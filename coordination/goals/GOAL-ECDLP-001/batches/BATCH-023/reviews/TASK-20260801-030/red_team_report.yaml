  claim_under_review: >-
    That RUN-EQD-001-real's failure of every retained statistic to reject at
    either toy cell is a durable observation about limb L2 of H-EQD-001 - that
    the fibre invariants (e_1, e_2) induced by the frozen deterministic
    factor base are not distinguishable, at the frozen resolutions and this n,
    from those induced by a random 512-point factor base on the same curve.
    Reviewed IN BOTH DIRECTIONS: against inflation of the non-rejection into a
    genericity or HEUR-DS-1 statement, and against deflation of it into a
    vacuous or worthless run.

  # =====================================================================
  # 1. BLOCKING CONSTRAINTS
  # =====================================================================
  blocking_constraints:
    - id: BC-1
      constraint: >-
        NO DELIVERABLE MAY SAY THE FIBRE INVARIANTS ARE GENERIC, EQUIDISTRIBUTED,
        RANDOM-LIKE, OR INDISTINGUISHABLE IN ANY SENSE BROADER THAN: the three
        retained two-sample statistics at K = 16, K = 64 and the e_1 marginal,
        at n = C(512,2) = 130816, on the two specific curve instances
        generate_instance(2301, 16) and generate_instance(2301, 20), at
        Bfb = 512, m = 4, one master seed, one host, one null draw per cell.
        "Not distinguishable by these three statistics at these two cells" is the
        whole of the licensed English. Absence of evidence is not evidence of
        absence and the design's own detection floor (BC-2) is the quantity that
        must accompany the sentence.
    - id: BC-2
      constraint: >-
        EVERY STATEMENT OF THE NON-REJECTION MUST CARRY THE DETECTION FLOOR AND
        THE LARGEST DEVIATION CONSISTENT WITH IT, as computed in
        `what_the_non_rejection_licenses`. A non-rejection reported without its
        power is an overclaim by omission. In particular the family-wise level of
        the N-2 branch is 1 - 0.99005^6 = 0.0582, not 0.00995, and the certified
        delta 0.05 is NOT the design's operative floor (see RT049-C1).
    - id: BC-3
      constraint: >-
        NO TRANSFER TO HEUR-DS-1, IN EITHER DIRECTION. This run factors no
        integer, computes no largest prime factor, evaluates no rho or Dickman
        quantity and measures no smoothness. Equidistribution of the fibre
        invariants is a LOAD-BEARING INPUT to HEUR-DS-1 and is not identical to
        it; a load-bearing input surviving one toy screen is not the heuristic
        surviving anything. OPEN-BATCH023-A (the owed direct smoothness
        measurement) remains OWED and must be restated as owed in the decision
        record.
    - id: BC-4
      constraint: >-
        NO ASYMPTOTIC, CRYPTO-SCALE OR MEDIUM-SCALE STATEMENT; no S1_met, F1_met,
        F2_met or structure_gate_passed; no `support` for H-EQD-001, H-SMTH-001
        or H-DS-001; no rescue or re-scoring of the BATCH-020 R result or of
        EV-DS-001..EV-DS-004; no affected-scheme statement. All four asymptotic
        promotion gates G1-G4 remain OPEN: no artifact in this package addresses
        a proof decomposition, a validated heuristic, a concrete-cost table or an
        independent review of an asymptotic claim, because no asymptotic claim
        exists here.
    - id: BC-5
      constraint: >-
        EQUALLY BLOCKING IN THE OTHER DIRECTION. No deliverable may call this run
        vacuous, worthless, or a mere control, and no deliverable may reach
        `reject_scoped`, still less reject_scoped-as-impossibility. The run
        carries three positive contributions I verified myself: a certified
        detection floor at the branch level of delta = 0.02 in the plant class
        (RT049-C1), an exact and independently reproduced structural
        reconciliation of the duplicate count (RC-5), and a mechanism finding
        that falsifies the specification's duplicate model at BOTH cells
        (RT049-B2). Discarding those would be premature closure under
        docs/inventor-protocol.md section 4.
    - id: BC-6
      constraint: >-
        THE STATE MACHINE MUST NOT BE SHORT-CIRCUITED. RR-EQD-1's N-2 disposition
        reads "H-EQD-001 `analyzed` -> stays `analyzed`", but the ledger record
        H-EQD-001.yaml is at `specified` with no `approved`, no `running` and no
        `analyzed` in its status_history (RC-8). The frozen rule's precondition is
        not satisfied by the ledger as it stands. TASK-20260801-031 and the ledger
        archive must either (a) record the intervening specified -> approved ->
        running -> analyzed transitions with their decision references, or (b)
        record explicitly that the N-2 disposition is being applied to a
        hypothesis that was never lifted past `specified` and say why. Writing
        `analyzed` with no intervening record is forbidden. In no case may
        H-EQD-001 reach `supported`: the state machine requires `replicated`
        first and this is a single unreplicated toy run.
    - id: BC-7
      constraint: >-
        LIMB DISCIPLINE. L1 - that (e_1, e_2) is not uniform on F_p x F_p with
        support density about 1/8 - is a derivation and may not be reported as a
        finding of this batch. I confirm no artifact in the reviewed package
        reports it as a finding. L3 - the dependency-structure comparison - is an
        instrument fact and may not be reported as a result about the Semaev map.
        I confirm no artifact in the reviewed package does so.

  # =====================================================================
  # 2. WHAT THE NON-REJECTION ACTUALLY LICENSES
  # =====================================================================
  what_the_non_rejection_licenses:
    the_headline_number_is_the_floor_not_the_non_rejection: >-
      THE FINDING IS THE DETECTION FLOOR, NOT THE SIX FAILURES TO REJECT. Stated
      as a single sentence: at these two toy cells, with n = 130816 and this
      design, a plant-class deviation affecting 2 percent or more of the
      half-tuples would have been caught with per-cell detection probability at
      least 0.928 (95 percent one-sided lower bound from 40 of 40 CAL-2
      detections), and none was seen; a deviation affecting 1 percent would have
      been missed roughly 85 percent of the time; a deviation affecting 0.5
      percent would have been missed essentially always; and a deviation of
      ARBITRARY size that preserves both marginals and moves only the dependence
      between e_1 and e_2 carries NO measured power at all and is not excluded to
      any degree whatsoever.
    power_the_design_actually_had_against_smaller_deltas:
      source: >-
        experiments/EXP-EQD-001/results/calib/power_curve.json at snapshot
        53e202dd, cells.<bits>.per_delta.<delta>.measured_detection_rates, read
        directly in this session. The operative quantity is NOT the certifying
        statistic alone but the N-4 condition - at least one RETAINED statistic
        rejects at BOTH cells - because that is the condition the branch set
        actually uses.
      delta_0_005: >-
        STAT-CHI-16 0/20 and 0/20; STAT-CHI-64 0/20 and 0/20; STAT-KS1-E1 0/20
        and 0/20. Per-cell union detection 0 of 20 at both cells. Rule-of-three
        95 percent upper bound on per-cell detection about 0.15; joint N-4
        probability bounded above by about 0.02 and not distinguishable from the
        0.0582 family-wise false-rejection floor. ENTIRELY UNDETECTABLE.
      delta_0_01: >-
        STAT-KS1-E1 7/20 at bits 16 AND 7/20 at bits 20; STAT-CHI-64 1/20 at bits
        16, 0/20 at bits 20; STAT-CHI-16 0/20 at both. Per-cell union detection
        about 0.35 to 0.40; joint N-4 probability about 0.12 to 0.16 treating the
        cells as independent (disjoint streams, different curve instances).
        A DEVIATION OF THIS SIZE ESCAPES THIS DESIGN ABOUT 85 PERCENT OF THE TIME.
      delta_0_02: >-
        STAT-KS1-E1 20/20 at bits 16 AND 20/20 at bits 20; STAT-CHI-16 1/20 and
        0/20; STAT-CHI-64 0/20 and 1/20. THE BRANCH-LEVEL FLOOR IS HERE, NOT AT
        0.05: pooling the 40 detections, the 95 percent one-sided lower confidence
        bound on per-cell detection probability is 0.05**(1/40) = 0.9280, and the
        joint N-4 probability is bounded below by about 0.861.
      delta_0_05: >-
        STAT-CHI-16 20/20 and 20/20 (this is what CERT-EQD-1 certifies);
        STAT-KS1-E1 20/20 and 20/20; STAT-CHI-64 5/20 and 9/20.
      delta_0_10: >-
        All three retained statistics 20/20 at both cells.
    largest_deviation_consistent_with_these_observations:
      inside_the_plant_class: >-
        A DEVIATION AFFECTING UP TO ABOUT 1 PERCENT OF THE 130816 HALF-TUPLES -
        of order 1300 pairs - IS FULLY CONSISTENT WITH THE OBSERVED NON-REJECTION
        at both cells, since such a deviation would have been missed about 85
        percent of the time. Anything at or below 0.5 percent (of order 650
        pairs) is invisible to this apparatus. The observation excludes only
        plant-class deviations at or above 2 percent (of order 2600 pairs), and
        that exclusion carries at least 0.861 joint power at a family-wise level
        of 0.0582.
      outside_the_plant_class: >-
        UNBOUNDED, AND THIS IS THE MORE IMPORTANT HALF. The plant moves the e_1
        MARGINAL ONLY (driver plant(): out1[idx] replaced by a uniform draw from
        [0, p//2), e2 returned as an unmodified copy - I read the source). No
        alternative on the frozen ladder moves the DEPENDENCE between e_1 and
        e_2 while preserving both marginals, so no measured power exists against
        that class at any magnitude. The reading rule declares this
        (attainability_argument.N_4.what_remains_uncertified) and I confirm it.
        A copula-type deviation of arbitrary strength is not excluded by this run
        at all. Since the deterministic base is a small-x window (max x = 1052 of
        p = 46663 at bits 16), a dependence-only deviation is precisely the shape
        a structured base is most likely to induce - so THE CERTIFICATE IS
        AGAINST THE WRONG ALTERNATIVE CLASS. This is objection RT049-B1.
    what_the_certified_delta_0_05_does_and_does_not_mean: >-
      CERT-EQD-1 admits only STAT-CHI-16 and STAT-CHI-64 as certifying
      statistics, and 0.05 is the smallest ladder rung either of them reaches at
      0.95 in both cells. That is a property of the CERTIFICATION PREDICATE, not
      of the apparatus. The apparatus's branch-level floor is 0.02 via
      STAT-KS1-E1, a fact the reading rule records
      (certified_delta_derivation.a_measured_fact_that_does_not_change_the_certified_delta)
      and correctly declines to act on, because acting on it would have been
      selection where only substitution was permitted. THE CORRECT DELIVERABLE
      STATEMENT CITES BOTH: certified floor 0.05 by the frozen predicate,
      measured branch-level floor 0.02. Citing only 0.05 understates the run;
      citing only 0.02 bends the frozen rule.
    the_coarseness_of_the_0_95_bar_at_R_REPS_20: >-
      CONFIRMED AND MATERIAL, and already declared in the reading rule's
      precision_caveat_carried_forward. With 20 replicates the 0.95 bar is
      attainable only at 19/20 or 20/20, and every rung that met it met it at
      20/20 at both cells, so the certification is a 20-of-20 test. A statistic
      of true power 0.90 passes such a test about 12 percent of the time. The
      remedy is not more argument, it is R_REPS: at R_REPS = 200 per rung the
      whole CAL-2 stage would still cost of order 10 minutes given the measured
      59.19 s for the entire calibration, and a finer ladder in [0.005, 0.02]
      would locate the floor to within a factor of two instead of a factor of
      four. THIS IS THE CHEAPEST POWER REPAIR IN THE PACKAGE AND IT IS NOT
      EXPENSIVE.

  # =====================================================================
  # 3. OBJECTIONS
  # =====================================================================
  objections:
    - id: RT049-B1
      severity: BLOCKING ON INTERPRETATION
      blocks_ledger_disposition: false
      title: >-
        PC-1 certifies power against the plant class, not against the alternative
        class the decision statistics actually faced
      statement: >-
        PC-1 establishes only that STAT-CHI-16 rejects an OBJ-PLANT-0.05 object -
        an object whose e_1 marginal has been re-randomized on 5 percent of pairs
        from [0, p//2) with e_2 untouched. The real object is a deterministic
        factor base: 512 consecutive-in-order x-coordinates of X_E, all below
        x = 1052 at bits 16. If such a base induces structure at all, the natural
        shape of that structure is a DEPENDENCE deviation (clustering in the
        joint (e_1, e_2) plane, or a correlation between the two coordinates)
        that preserves both marginals, not a marginal shift on e_1. The design has
        exactly zero measured power against that class. PC-1 rejecting therefore
        answers "could this statistic have rejected SOME alternative" and not
        "could it have rejected THE alternative that mattered".
      sharpening: >-
        PC-1 at bits 20 came in at 359.939 against a calibrated CAL-2 plant-arm
        minimum of 359.026 and maximum of 477.681 - essentially the bottom of its
        own certified distribution. The certificate passed by a margin of 33.7
        against a null sd of 25.60, i.e. 1.32 sd. The apparatus's power at the
        certified delta is real but thin, and it is thin on the statistic the
        certification predicate happens to admit rather than on the sensitive one.
      required_control: RT049-CTRL-1
      status_after_this_run: OPEN
    - id: RT049-B2
      severity: MATERIAL - NEW POST-HOC ATTAINABILITY FINDING
      blocks_ledger_disposition: false
      title: >-
        DV-5 / STAT-DUP is a pure function of the base's 2-torsion closure at
        BOTH cells, not only at bits 20, and the reading rule's "good match" at
        bits 16 was a numerical coincidence
      statement: >-
        RR-EQD-1 stat_dup_handling records that the specification's idealized
        model n**2/(2S) is falsified at bits 20 (predicts about 46 duplicates
        across 400 arms, zero observed) but states that at bits 16 it "predicts
        31.4 per arm against a measured mean of 30.82, a good match". MY
        MEASUREMENT SAYS THAT MATCH IS SPURIOUS. On six independently drawn
        OBJ-NULL-RFB bases at bits 16 (RC-6) the observed duplicate count equalled
        the 2-torsion-orbit prediction EXACTLY in all six cases, with zero
        residual accidental collisions. Under the birthday model each draw should
        have carried about 31 accidental collisions; observing zero in six draws
        has probability of order e**(-186) under that model.
      mechanism: >-
        NAMED, NOT FATIGUE. The invariant pair (e_1, e_2) determines the unordered
        root set {x(P+Q), x(P-Q)}. Recovering (P, Q) from that set requires
        choosing signs (fixed by the x-coordinates) and halving, and the halving
        ambiguity is exactly the 2-torsion group. So two distinct half-tuples
        share an invariant IFF one is the 2-torsion translate of the other. The
        map is structurally injective off the translate orbits; there is no
        birthday channel to speak of. Hence STAT-DUP is a deterministic function
        of how many base points have their translate also in the base - a
        hypergeometric-driven structural count - at bits 16 as much as at bits 20.
      consequence: >-
        DV-5 measures the 2-torsion closure of the factor base and nothing else.
        Its non-firing supplies assurance ONLY against gross support collapse
        (the RT047-H2 / RT048-H1 defect class, where a collapsed stand-in would
        give of order 1.8e5 duplicates and breach [0, 110] decisively - that leg
        IS live and IS discharged). It supplies ZERO assurance about the
        fibre-invariant law at either cell. The bits-20 "a control that cannot
        fail supplies no assurance" caveat should be restated in a weaker but
        still binding form for bits 16: a control whose value is a function of the
        base's torsion geometry alone cannot bear on the distributional question.
      why_this_is_a_positive_contribution_not_a_defect_report: >-
        The calibration was supposed to catch a wrong model and it caught it at
        one cell only, because at the other cell the wrong model returned
        approximately the right number for the wrong reason. That is a
        transferable lesson about calibrating against a numeric expectation rather
        than against a mechanism, and it belongs in the batch's knowledge output.
      status_after_this_run: >-
        NEW. Supersedes nothing (RR-EQD-1 is immutable); the correction is
        recorded here and must be carried into any successor specification. The
        TASK-20260801-028 archive's C-4 statement that the n**2/(2S) model is
        "treated as void at both cells" is CONSISTENT with this finding and is
        the position the batch should keep.
    - id: RT049-B3
      severity: MATERIAL
      blocks_ledger_disposition: false
      title: >-
        The real arm is deterministic, so "replication" at the same seed
        re-randomizes only the null side
      statement: >-
        OBJ-REAL is a single fixed object per cell: the first 512 x-coordinates of
        X_E. All sampling randomness in the comparison lives in the ONE null base
        drawn per cell. The level of the test is correct (the CAL-1 reference
        distribution is built from null-versus-null pairs, so the two arms are
        matched in their dependency structure - both are C(512,2) enumerations
        over 512 points - and exchangeability gives the exact 0.00995), but the
        run has ONE realization of the only random quantity present. Re-running at
        the same master seed would change nothing; re-running with a fresh null
        stream would change the six statistics but not the object under test.
      consequence: >-
        The reading rule's mandatory companion is the right one and must be
        enforced as written: replication REQUIRES A DIFFERENT CURVE INSTANCE PER
        BIT SIZE, not merely a different seed. Any "second seed" run that reuses
        generate_instance(2301, b) is not a replication of this result and must
        not be counted as one toward `replicated`.
      status_after_this_run: OPEN, correctly anticipated by RR-EQD-1
    - id: RT049-B4
      severity: MATERIAL - RECORDED UNDER AGENTS RULE 8, NOT ACTED ON
      blocks_ledger_disposition: false
      title: >-
        The bits-20 STAT-CHI-16 value sits at the 192nd of 200 CAL-1 replicates
        (empirical p = 0.0498) and this must be recorded without being converted
        into anything
      statement: >-
        My percentile recomputation (RC-4) shows the bits-20 STAT-CHI-16 value
        302.821 is exceeded by only 9 of the 200 CAL-1 replicates. It does NOT
        exceed the frozen 199th order statistic 326.221 and therefore correctly
        does not reject; the frozen rule was applied as written and I endorse
        that. But the number is in the upper 5 percent tail of its own null and
        recording it is mandatory under AGENTS.md rule 8.
      why_it_is_not_a_finding: >-
        FOUR REASONS, ALL OF WHICH MUST APPEAR BESIDE IT. (1) The design runs six
        retained comparisons, so the probability that at least one lands above the
        95th null percentile on a correct null is 1 - 0.95**6 = 0.265 - this is
        the single most likely value to appear and it appeared. (2) There is no
        cross-cell consistency: the same statistic at bits 16 sits at the 147th of
        200, p = 0.2736. A genuine structural property of the deterministic
        selection rule should show at both cells; a finite-size or draw-specific
        artifact should show at one. This one shows at one. (3) Five of six
        retained values sit above their null median, sign-test P = 0.109, i.e.
        nothing. (4) Converting it into a rejection would be exactly the
        post-calibration latitude ATS-1 clause 4 and condition C-1 forbid.
      required_disposition: >-
        RECORD IT, DO NOT READ IT. It is a pre-registration target for the
        replication: if the bits-20 K = 16 grid statistic lands in the upper tail
        AGAIN on a different curve instance, that is a signal worth a
        pre-registered follow-up; if it regresses to the middle, it was a draw.
        Naming it now is what makes the replication informative rather than
        exploratory.
    - id: RT049-B5
      severity: MINOR
      blocks_ledger_disposition: false
      title: STAT-KS1-E2's calibration false-rejection rate at bits 16 is mildly high and unexplained
      statement: >-
        The deductive argument for excluding STAT-KS1-E2 says its law under
        OBJ-PLANT-delta is EXACTLY the null law at every delta, so its measured
        "detection rates" are false-rejection rates. At bits 16 those were 0, 1,
        0, 1, 1 of 20 across the ladder - 4 exceedances in 100 comparisons against
        an expected 0.995 at level 0.00995, Poisson P(X >= 4 | 1) about 0.019. The
        reading rule calls this "mildly high and not a signal" and I agree it
        fires nothing, but the exactness claim implies 4 exceedances should be
        surprising, and no mechanism is offered. At bits 20 it was 0 of 100.
      possible_benign_explanation: >-
        The CAL-2 plant arm's e_2 comes from a specific null draw index compared
        against a different null draw, whereas the CAL-1 reference pairs
        consecutive draws; if the stream indexing induces any non-exchangeability
        the marginal statistic on the untouched coordinate is where it would show.
        UNTESTED - I did not run this check and do not assert it.
      status_after_this_run: OPEN, minor, worth one cheap check in the successor calibration
    - id: RT049-B6
      severity: MATERIAL
      blocks_ledger_disposition: false
      title: The comparison confounds "deterministic selection rule" with "small-x window"
      statement: >-
        OBJ-REAL is the first 512 x-coordinates of X_E in increasing integer
        order, all below 1052 at bits 16 - a narrow initial window of the field.
        OBJ-NULL-RFB is 512 x-coordinates drawn uniformly from all of X_E, spread
        over [0, p). The two arms differ in TWO respects at once: determinism of
        the rule, and locality of the support. A non-rejection is consistent with
        both being irrelevant; a rejection would not have told us which mattered.
        This is not a defect of execution - it is exactly the object the
        specification declares - but it is a scope limit that any deliverable must
        state, and it names a cheap discriminating arm (RT049-CTRL-2).
      status_after_this_run: OPEN, new
    - id: RT049-B7
      severity: MINOR - PROCEDURAL
      blocks_ledger_disposition: false
      title: manifest code.dirty is true
      statement: >-
        The run manifest records code.dirty true at commit d7b532ded. The
        executor's declared explanation is that the driver samples git state after
        writing its own untracked output artifacts. I did not and cannot verify
        the tree state at the instant of invocation from the archived artifacts
        alone; the claim is plausible and consistent with the artifact set, and
        the driver digest independently pins the executed code (RC-1), which is
        the load-bearing fact. Recorded as an unverifiable-but-non-load-bearing
        anomaly rather than as a pass.

  # =====================================================================
  # 4. THE THREE RULINGS THE TASK ASKS FOR
  # =====================================================================
  ruling_L1_versus_L2:
    verdict: >-
      THE TEST MEASURES L2, NOT L1. I VERIFIED THIS FROM THE SOURCE, NOT FROM THE
      PROSE.
    evidence:
      - >-
        run_real_arm() (driver lines 745-838) builds arm A by
        cell.enumerate_factor_base(deterministic_factor_base(cell)["xs"]) and arm
        B by _draw_null_arm(...) -> cell.draw_null_factor_base(...) ->
        cell.enumerate_factor_base(...). BOTH ARMS PASS THROUGH THE IDENTICAL
        int2_fibre_invariants CALL over the identical upper-triangle index set
        cell.iu / cell.ju, over exactly 512 points, giving exactly
        C(512,2) = 130816 pairs each. The ONLY difference between the arms is the
        512-element x-list. This is a real-versus-random-base comparison and
        nothing else.
      - >-
        stat_chi() is a TWO-SAMPLE Pearson chi-square of homogeneity with POOLED
        expectation ea = na*tot/N, eb = nb*tot/N (driver lines 252-272). It is not
        a goodness-of-fit test against a uniform reference. Any feature common to
        both arms - including the whole of L1, the support density about 1/8, the
        restriction of the root multiset to X_E, and the binning unevenness when
        K does not divide p - enters tot and cancels out of the statistic
        identically for both arms. The same holds for the two-sample KS statistic
        (lines 275-282), which compares the two empirical CDFs to each other.
      - >-
        Empirically: support_fraction_real is exactly 1.0 at both cells, and the
        archived CAL-4 measurement gives the same for null draws, so the two arms
        occupy the same admissible support by measurement as well as by
        construction.
      - >-
        empty_cell_omission_count is 0 at K = 16 and 0 at K = 64 at both cells on
        the real arm, so the binning-unevenness worry does not even bite through
        an omitted-cell channel: all 256 and all 4096 cells were populated in the
        pooled table.
    consequence: >-
      The L1 non-uniformity is common-mode and cancels. THE NON-REJECTION IS
      INFORMATIVE ABOUT L2 AND IS NOT A DISGUISED L1 STATEMENT. Correspondingly,
      no artifact in the package reports L1 as a finding, and none may.
    residual_caveat: >-
      Cancellation is exact for any feature shared by the two arms. It is NOT
      exact for a feature that interacts with the base geometry - and the
      small-x locality of the real base (RT049-B6) is precisely such a feature.
      The cancellation argument therefore protects against L1 leakage but not
      against the confound named in RT049-B6.

  ruling_on_excluding_STAT_KS1_E2:
    verdict: >-
      GENUINE COVERAGE OF e_2 WAS LOST IN PRINCIPLE. IT COST NOTHING ON THIS RUN.
      BOTH HALVES MUST BE STATED.
    the_plant_argument_is_valid_but_narrower_than_it_reads: >-
      CONFIRMED FROM SOURCE: plant() modifies out1 only and returns e2.copy()
      (driver lines 435-447), so under every OBJ-PLANT-delta the law of any
      statistic of e_2 alone is exactly the null law. The exclusion ground - "no
      power against the declared alternative class by construction" - is
      deductively correct AND IS A STATEMENT ABOUT THE PLANT, NOT ABOUT THE REAL
      OBJECT. Nothing in that argument implies STAT-KS1-E2 has no power against a
      deterministic factor base. The reading rule says exactly this in
      excluded_statistics.what_is_NOT_claimed, and it is right to.
    what_was_actually_lost: >-
      STAT-KS1-E2 was the ONLY dedicated marginal probe of e_2 at full
      resolution. After its exclusion the only retained statistics that see e_2
      at all are the joint chi-squares, which resolve e_2 into 16 bins at K = 16
      and 64 bins at K = 64 while simultaneously spending their degrees of freedom
      on the joint structure. A pure e_2 marginal deviation finer than 1/64 of the
      field, or one that a 4096-cell joint table dilutes across many cells, is a
      real blind spot. RR-EQD-1 N-2.additional_scope_note_forced_by_the_exclusion
      states this and every deliverable reading N-2 must repeat it.
    what_it_cost_on_this_run: >-
      NOTHING, AND THIS IS COMPUTABLE RATHER THAN ASSUMED. The measured values are
      0.003095951565557725 at bits 16 against the CAL-1 199th order statistic
      0.00623012475538165, and 0.004548373287671215 at bits 20 against
      0.00631421232876711. NEITHER EXCEEDS. Had DV-4 been retained, the N-2
      conjunction would still hold at both cells and the branch would be
      identical. The exclusion did not manufacture the non-rejection.
    condition_C_1_compliance: >-
      C-1 IS HONOURED AND MUST REMAIN SO. I am not converting STAT-KS1-E2 into a
      rejection - it does not reject - and equally I am NOT counting its
      non-rejection as an additional passed test that strengthens the result. Its
      threshold carries a valid 0.00995 null level but no power certificate in
      either direction against any alternative, so a non-rejection by an
      uncertified statistic adds no evidential weight. The correct statement is
      the neutral one: the exclusion changed no outcome here, and it left a
      declared e_2 blind spot that a successor design should close by adding a
      dependence-preserving plant (RT049-CTRL-1) against which an e_2 marginal
      test WOULD have certifiable power.
    effect_on_the_strength_of_the_non_rejection: >-
      The non-rejection is weakened as a statement about e_2 specifically -
      coverage of the e_2 marginal rests entirely on two coarse joint grids - and
      is unweakened as a statement about e_1 and about the joint at K = 16 and
      K = 64. Any English gloss must not say "the invariants are indistinguishable"
      without the e_2 qualifier.

  duplicate_structure_verdict:
    verdict: >-
      GENUINE RECONCILIATION, NOT A FIT. I REPRODUCED 45 = 5 + 2*20 INDEPENDENTLY
      AND IT HAS NO FREE PARAMETER.
    what_i_did: >-
      RC-5. I rebuilt the deterministic base from the curve, re-enumerated all
      130816 half-tuples, and found 20 colliding invariant values each of
      multiplicity exactly 2. Independently, by point addition with T = (39489, 0)
      - NOT by the INT-2 coefficient formula - I found exactly 10 base points
      whose 2-torsion translate is also in the base, forming 5 free orbits with 0
      fixed points. C(10,2) = 45 internal half-tuples; the 5 orbit pairs
      {x, tau(x)} are setwise invariant and generate no collision; the remaining
      40 pair off into exactly 20 translate pairs. 45 = 5 + 2*20. I then matched
      each of the 20 collisions individually to its translate partner: 20 of 20
      explained, 0 unexplained.
    why_it_is_not_a_fit: >-
      THREE INDEPENDENT REASONS. (1) It has no free parameter: |S| = 10 is a
      property of the base computed by point arithmetic, and it FORCES the value
      20 with no fitting step. (2) It is a POINT PREDICTION that could have failed
      - any accidental collision, or any multiplicity above 2, would have broken
      it, and neither occurred. (3) The mechanism generalizes and I tested the
      generalization on objects it was not derived from: on six random null bases
      the same prediction was exact in six of six cases (RC-6). A fit does not
      survive transfer to a null object; this did.
    the_alternative_collision_route_i_checked: >-
      There is no second route. A collision needs the same unordered set
      {x(P+Q), x(P-Q)}. The x-coordinates fix A = P+Q and B = P-Q up to sign, and
      recovering (P, Q) requires halving A+B and A-B, whose ambiguity is exactly
      the 2-torsion subgroup; the sign flip on B merely swaps P and Q, which the
      i < j convention already identifies. So the fibre of the invariant map is
      the 2-torsion translate orbit and nothing more. At bits 20, #E = 767427 is
      odd, E[2] is trivial, and the route does not exist - which is why 0
      duplicates is not merely observed but FORCED. The birthday route the
      specification assumed is not a route at all (RT049-B2).
    condition_C_2_masking_assessment:
      the_worry: >-
        At bits 16 the real base's duplicate count is a DETERMINISTIC arithmetic
        property while its band [0, 110] was calibrated on RANDOM bases. If the
        deterministic base happened to have unusually many 2-torsion-closed
        points, N-1 would have fired on a structural fact and pre-empted the
        substantive branch - an error direction that SUPPRESSES a positive
        finding.
      my_finding: >-
        NO MASKING OCCURRED AND THE MARGIN IS COMFORTABLE. The real value 20 is
        exactly the CAL-1 median (20.0) and sits far inside [0, 110]. The
        underlying driver |S| = 10 is close to its null expectation: for a random
        512-subset of the 23430-element X_E the expected number of points whose
        translate is also in the base is about 512 * 511/23429 = 11.2, against 10
        observed. The deterministic base is TYPICAL in its 2-torsion closure. My
        six null draws gave dup counts 42, 42, 20, 12, 56, 42, bracketing 20 on
        both sides.
      what_remains_unfixed: >-
        The below-band leg is dead at both cells (0 is the minimum attainable
        value of a count and is the lower edge at both). The deduplication /
        without-replacement failure mode DV-5 exists to catch was NOT checked and
        must never be reported as passed. The reading rule declares this in
        advance and the declaration held; it is an instrument gap, not a defect
        of this run.
      combined_with_RT049_B2: >-
        Because DV-5 is a pure function of the base's torsion closure at BOTH
        cells, its non-firing is a statement about base geometry, not about the
        fibre-invariant law. It correctly discharges the support-collapse defect
        class (RT047-H2, RT048-H1) at both cells via the live above-band leg, and
        it discharges nothing else. Say that, and no more.

  # =====================================================================
  # 5. REQUIRED CONTROLS
  # =====================================================================
  required_controls:
    - id: RT049-CTRL-1
      name: dependence-only plant, and the CAL-2 rung it needs
      why: >-
        Closes RT049-B1, the single largest gap. The apparatus has certified power
        only against a marginal shift on e_1; the alternative a structured factor
        base is most likely to produce preserves both marginals and moves the
        dependence.
      how: >-
        Add OBJ-PLANT-DEP-rho: take a correct null arm, stratify by e_1 bin, and
        permute e_2 within strata (or apply a Gaussian-copula reordering) to
        induce a target rank correlation rho, leaving BOTH marginals EXACTLY
        invariant by construction. Verify marginal invariance as an integrity
        check - both one-sample marginal histograms must be bit-identical to the
        source arm. Then re-run CAL-2 on a rho ladder and report per-statistic
        detection rates.
      cost: >-
        NEGLIGIBLE. The entire archived calibration - about 742 arms per cell at
        both cells - ran in 59.19 s with peak RSS 176 MB. A dependence ladder at
        R_REPS = 200 is minutes, not hours.
      what_it_would_expose: >-
        Whether K = 16 and K = 64 joint chi-squares have ANY power against a
        dependence deviation, and at what magnitude. If they turn out to have
        essentially none, the honest reading of THIS run drops to "the two
        marginals are not distinguishable and the joint was not effectively
        tested", which is materially weaker than what N-2's English currently
        suggests. That possibility is live and unmeasured.
      priority: 1
    - id: RT049-CTRL-2
      name: windowed null - the null object of the right shape
      why: >-
        Closes RT049-B6. Separates "deterministic rule" from "small-x window",
        which the current design confounds.
      how: >-
        A third arm: 512 x-coordinates drawn UNIFORMLY AT RANDOM from the first
        M x-coordinates of X_E, with M chosen so the window matches the real
        base's span (M of order 512 to 1024 at bits 16 gives x <= about 1052).
        Compare real-versus-windowed-null with the identical statistics and a
        separately calibrated threshold set.
      what_it_would_expose: >-
        If real-versus-global-null is null AND real-versus-windowed-null is null,
        neither locality nor determinism is doing anything at this resolution. If
        the two disagree, the design has isolated which. Either way it is a
        strictly stronger deliverable than the current one.
      priority: 2
    - id: RT049-CTRL-3
      name: R_REPS increase and a finer delta ladder between 0.005 and 0.02
      why: >-
        The certified floor is coarse by a factor of four because R_REPS = 20
        makes the 0.95 bar a 20-of-20 test on a five-rung ladder. The floor is the
        headline number of a null result (BC-2), so its resolution IS the quality
        of the deliverable.
      how: >-
        R_REPS = 200 per rung, ladder [0.0025, 0.005, 0.0075, 0.01, 0.015, 0.02].
        Report a detection curve with binomial confidence intervals, not a single
        certified rung.
      priority: 3
    - id: RT049-CTRL-4
      name: decomposed duplicate diagnostic, PRE-REGISTERED
      why: >-
        RT049-B2 shows STAT-DUP as a raw count is a torsion-closure statistic. Its
        DECOMPOSITION - translate-explained versus residual accidental - is a
        genuinely different quantity, and the residual being exactly 0 on the real
        base and on all six null draws I checked is a clean structural fact.
      how: >-
        Record two numbers instead of one: dup_translate_explained and
        dup_residual, with dup_residual pre-registered as an integrity tell (any
        nonzero residual means the invariant map is not what the derivation says
        it is, or the arithmetic is wrong).
      condition_C_1_note: >-
        THIS MAY NOT BE APPLIED RETROSPECTIVELY TO THE PRESENT RUN AS A REJECTION
        OR AS A FINDING. It is a design change for the successor experiment. I
        report my measured residuals (0 real, 0 on six null draws) as an
        observation under AGENTS.md rule 8 only.
      priority: 4
    - id: RT049-CTRL-5
      name: second curve instance per bit size - the actual replication
      why: RT049-B3. A fresh seed on the same instance re-randomizes only the null arm.
      how: >-
        generate_instance with a different master seed at each of 16 and 20 bits,
        full re-calibration (CAL-1 thresholds are instance-specific), full real
        arm, same frozen statistic forms and same reading-rule FORM with new
        numbers substituted.
      priority: 1

  counterexample_or_mutation: >-
    The cheapest single mutation that would discriminate an informative
    non-rejection from a powerless one is RT049-CTRL-1. Concretely: build
    OBJ-PLANT-DEP-rho by permuting e_2 within e_1-strata of a correct null arm so
    that both marginals are bit-identical to the source, sweep rho, and measure
    STAT-CHI-16 and STAT-CHI-64 detection rates. IF the joint chi-squares fail to
    reach 0.95 detection at any rho a structured base could plausibly induce, then
    the present non-rejection carries almost no information about the joint law
    and the deliverable must say so; if they reach it at small rho, the present
    non-rejection is substantially stronger than the certified delta 0.05 admits.
    The apparatus already contains every primitive this needs and the calibration
    stage costs about a minute of wall clock. NOT RUNNING IT IS THE MOST EXPENSIVE
    CHOICE AVAILABLE.

  # =====================================================================
  # 6. BASELINE COMPARISON / PARETO
  # =====================================================================
  baseline_comparison:
    note: >-
      This is a distributional measurement, not an algorithm. No time, memory or
      data cost is claimed against Pollard-rho, BSGS, GHS, Gaudry-Semaev index
      calculus or any other ECDLP baseline, and none may be inferred. The relevant
      frontier row is the matched-null comparison itself, as the handoff states.
    pollard_rho: >-
      NOT COMPARABLE AND NOT COMPARED. No DLP instance was solved, no relation was
      collected, no linear algebra was performed, no source recovery or target
      descent exists in this package. Any deliverable implying a comparison is an
      overclaim.
    bsgs: >-
      NOT COMPARABLE AND NOT COMPARED, for the same reasons.
    closest_specialized_baseline: >-
      Gaudry-Semaev-style index calculus over prime fields at arity m = 4 with a
      half-arity intermediate. This run measures ONE load-bearing input to that
      approach's cost model (equidistribution of the fibre invariants) and does
      not measure the cost model, the relation yield, the smoothness probability,
      the matrix rank, or the descent.
    dominated_by: >-
      THE MATCHED-NULL COMPARISON ITSELF. On every retained axis of the frontier
      the real object is Pareto-indistinguishable from OBJ-NULL-RFB: all six
      retained statistics lie below their 0.00995 thresholds, and on the finer
      empirical scale the largest deviation from the null median across the six is
      1.70 null sample standard deviations. There is no axis on which the real
      object is measurably better or worse than the null at these resolutions,
      which is precisely what "dominated by the null" means for a distributional
      claim. This is NOT null: it is the frontier row checked and named.
    sota_delta: >-
      QUANTITATIVE. Zero of six retained comparisons exceeds its calibrated
      threshold. Margins to threshold: bits 16 CHI-16 -46.17 (-1.87 null sd),
      CHI-64 -145.57 (-1.64 sd), KS1-E1 -0.001651 (-1.64 sd); bits 20 CHI-16
      -23.40 (-0.91 sd), CHI-64 -124.64 (-1.33 sd), KS1-E1 -0.003929 (-3.69 sd).
      Empirical percentiles against 200 CAL-1 replicates: 0.2736, 0.1244, 0.1393,
      0.0498, 0.2338, 0.6418. Measured branch-level detection floor against the
      plant class: delta = 0.02 (joint power >= 0.861 at 95 percent confidence);
      certified floor by the frozen predicate: delta = 0.05. Measured power
      against dependence-only alternatives: NONE, at any magnitude. No speedup, no
      exponent movement, no cost claim of any kind.

  # =====================================================================
  # 7. HEURISTIC AND COST-MODEL CHALLENGES
  # =====================================================================
  heuristic_challenges:
    - id: RT049-H1
      heuristic: HEUR-DS-1 (smoothness of half-arity Semaev intermediates)
      challenge: >-
        NOT EXERCISED, NOT VALIDATED, NOT REFUTED, AT ANY TIER, BY THIS RUN. I
        searched the package: no factorization, no largest-prime-factor
        computation, no rho or Dickman evaluation, no smoothness bound, no B. The
        driver contains no such primitive. Equidistribution of (e_1, e_2) is an
        INPUT that the smoothness argument would need; establishing an input at
        toy scale on two cells against three statistics is not establishing the
        heuristic, and a non-rejection of the input is not even establishing the
        input - it is bounding how badly the input could fail in one direction
        (see the detection floor). OPEN-BATCH023-A remains OWED.
      random_model_transfer_note: >-
        RT048-H2's core point is unrepaired and this run does not repair it. A
        structured algebraic intermediate is not a uniformly random integer of its
        bitlength. Worse, THIS RUN SUPPLIES A CONCRETE INSTANCE OF THE GENERAL
        FAILURE: the specification's random model for STAT-DUP (n**2/(2S)
        birthday collisions) is flatly wrong, because the invariant map is
        structurally injective off the 2-torsion orbits (RT049-B2). A random model
        that gave approximately the right number at bits 16 for entirely the wrong
        reason is exactly the transfer failure RT048-H2 warns about, observed in
        this lane, in this batch. That should raise, not lower, the prior that the
        random model for SMOOTHNESS of these intermediates is also wrong.
      status_after_this_run: OPEN and unchanged, with the transfer concern sharpened
    - id: RT049-H2
      heuristic: the implicit heuristic that a plant-class detection floor bounds all deviations
      challenge: >-
        NOWHERE STATED AS A HEURISTIC, AND IT IS ONE. Reading "certified delta
        0.05" as "deviations smaller than 5 percent are the only thing we could
        have missed" silently assumes the deviation lives in the plant's
        alternative class. It is unnumbered and unjustified in the package. Either
        state it explicitly and number it, or - better - discharge it with
        RT049-CTRL-1.
      status_after_this_run: OPEN, new

  cost_model_challenges:
    - id: RT049-C1
      title: the certified delta understates the design's own operative floor
      statement: >-
        CERT-EQD-1 admits only STAT-CHI-16 and STAT-CHI-64 as certifying
        statistics, giving 0.05. But the N-4 branch fires if ANY retained
        statistic rejects at both cells, and STAT-KS1-E1 reaches 20/20 at BOTH
        cells at delta 0.02. The design's branch-level floor is therefore 0.02,
        not 0.05, and the 95 percent lower bound on joint detection there is
        0.861. Reporting only 0.05 is an accounting error IN THE CONSERVATIVE
        DIRECTION, i.e. it under-reports what the run achieved. The reading rule
        correctly refused to act on this after the fact; the DELIVERABLE should
        nonetheless report both numbers, since 0.02 is a measured property of the
        apparatus and not a change to the frozen rule.
      direction_of_error: understates the result
    - id: RT049-C2
      title: the family-wise level, not the per-test level, is the operative one
      statement: >-
        Six retained tests at 0.00995 each give P(correct null reaches N-2) =
        0.99005**6 = 0.94177, i.e. a family-wise false-rejection probability of
        0.0582; including the pre-empting guards the end-to-end figure is about
        0.90. The contract's original figure of 0.9234 over eight tests is
        superseded and the reading rule says so. Any deliverable quoting 0.00995
        as "the level" is wrong. This also bounds how surprising RT049-B4's
        bits-20 percentile is: at a family-wise 5.8 percent, one upper-tail value
        among six is the expected observation.
      direction_of_error: would overstate the result if quoted as 0.00995
    - id: RT049-C3
      title: per-attempt versus total accounting is not applicable, and must not be faked
      statement: >-
        There is no per-attempt cost and no success probability in this package
        because there is no algorithm. No total-expected-cost line may be
        constructed for it, and the absence of one is correct rather than a gap.
        Flagged so that no successor synthesis manufactures a cost table from a
        distributional measurement.
    - id: RT049-C4
      title: wall clock and memory
      statement: >-
        Real arm 1.617 s of an 1800 s budget; the full calibration 59.19 s of 3600
        s with peak RSS 176 MB of 4 GiB. NOTHING IN THIS LANE IS COMPUTE-BOUND AT
        TOY SCALE. Every control I request above is affordable inside the existing
        budget by two orders of magnitude, which removes cost as a reason to defer
        RT049-CTRL-1, CTRL-2 or CTRL-3.

  reduction_and_scope_challenges:
    - id: RT049-S1
      title: what HEUR-DS-1 asserts that this run does not touch
      statement: >-
        HEUR-DS-1 asserts a SMOOTHNESS property - that half-arity Semaev
        intermediates behave, for the purpose of a largest-prime-factor / Dickman
        rho estimate, like integers of their size drawn from the relevant
        distribution - at parameters where an index-calculus cost model would
        bite. This run touches NONE of: (a) any smoothness or factorization
        quantity whatsoever; (b) the DISTRIBUTION OF THE INTEGER LIFT of e_1 or
        e_2 against any theoretical reference (the tests are two-sample, so a
        deviation shared by both arms is invisible by construction - this is the
        price of the L1 cancellation); (c) any field size above 20 bits;
        (d) any factor base size other than 512; (e) any arity other than m = 4 or
        any intermediate other than INT-2; (f) relation yield, matrix rank, linear
        algebra cost, source recovery or target descent; (g) more than one curve
        instance per bit size or more than one master seed.
      note_on_b: >-
        POINT (b) DESERVES EMPHASIS BECAUSE IT IS EASY TO MISS. A two-sample
        design cannot detect a deviation that the deterministic base and the
        random base SHARE. If the fibre invariants of ANY 512-point factor base on
        these curves are systematically non-generic in a way that matters for
        smoothness, this design is blind to it by construction. The design is the
        right one for the question actually posed (L2: deterministic versus
        random), and it is the wrong one for the question HEUR-DS-1 needs
        (absolute behaviour against a theoretical reference). Conflating the two
        is the specific blur BC-3 forbids.
    - id: RT049-S2
      title: no scheme scope, affected or safe
      statement: >-
        No scheme is affected and none is declared safe. Nothing here reduces to,
        or from, any deployed parameter set. Any affected-scheme sentence in a
        successor deliverable is fabricated.
    - id: RT049-S3
      title: promotion gates
      statement: >-
        G1-G4 all remain OPEN. No archived proof decomposition, no validated
        heuristic, no concrete-cost table, and no independent review of an
        asymptotic claim exists in or is produced by this package - because no
        asymptotic claim exists. I did not find, and therefore do not assert, any
        artifact moving any gate.

  # =====================================================================
  # 8. AUDITS THE HANDOFF REQUIRES
  # =====================================================================
  audits:
    was_the_reading_rule_applied_as_frozen_or_bent_to_the_data:
      verdict: APPLIED AS FROZEN. NOT BENT.
      basis: >-
        RC-1 through RC-3 and RC-7. The reading_rule.yaml digest recorded inside
        the run's own output equals the file's digest; the driver digest equals
        the calibration-bound value; all eight frozen thresholds and both bands
        recompute exactly from the named raw CAL-1 arrays; the six reject booleans
        recompute exactly from the frozen strict-greater rule. The driver states
        no disposition and selects no branch, which is correct. STAT-KS1-E2 was
        computed and recorded with NO threshold and NO reject boolean, which is
        the C-1-compliant handling.
    attainability_audit_against_the_actual_data:
      branches_that_fired: >-
        None of N-0, N-5, N-1 fired. My arithmetic places the result in N-2, which
        the TASK-20260801-025 attainability check declared reachable and which I
        independently confirm was reachable: the measured family-wise probability
        that a correct null reaches N-2 is 0.94177 on the decision tests and about
        0.90 end to end, so N-2 was not merely reachable, it was the modal outcome
        under the null.
      was_the_branch_that_fired_reachable: >-
        YES, CONFIRMED BY MY OWN ARITHMETIC, AND CONFIRMED NOT TO BE THE ONLY
        REACHABLE ONE. N-4 was demonstrably reachable: an OBJ-PLANT-0.05 object
        satisfies the N-4 condition at both cells in 40 of 40 measured CAL-2
        replicates, and an OBJ-PLANT-0.02 object does so via STAT-KS1-E1 in 40 of
        40. N-6 was reachable with probability about 0.47 at delta 0.01. This is
        NOT the BATCH-021 RT048-B2 defect: the unfavourable branch could have
        fired, on measured data, at two different deviation sizes.
      did_any_branch_or_band_turn_out_unreachable_after_all:
        finding_1: >-
          YES, ONE, AND IT WAS DECLARED IN ADVANCE. The below-band leg of DV-5 is
          unreachable at BOTH cells (0 is the minimum attainable count and is the
          lower band edge at both). RR-EQD-1 declared this before the real arm and
          the declaration held exactly. The deduplication / without-replacement
          failure mode is NOT checked and must never be reported as passed.
          RT048-B2's defect class is therefore PARTIALLY, not fully, discharged:
          the fatal form (favourable branch unreachable) did not recur, but a
          declared-unreachable control leg persisted into the real run.
        finding_2: >-
          NEW AND NOT PREVIOUSLY IDENTIFIED. DV-5's above-band leg, while formally
          reachable at both cells and genuinely decisive against support collapse,
          is a function of the base's 2-torsion closure and of NOTHING ELSE at
          BOTH cells - not only at bits 20 (RT049-B2, verified on six null draws).
          The bits-16 band's non-degenerate appearance comes from variation in
          torsion closure across random bases, not from a birthday process. The
          TASK-20260801-025 verdict "NO BAND AND NO BRANCH IS UNREACHABLE AT THE
          FROZEN THRESHOLDS" is correct as to formal reachability and incomplete
          as to informativeness. I am the last line on this and I am recording it.
      whether_a_declared_reachable_control_actually_exercised_its_power: >-
        PC-1 rejected at both cells, but at bits 20 with value 359.939 against a
        CAL-2 plant-arm minimum of 359.026 - essentially the smallest value its
        own certified distribution produced in 20 replicates. The apparatus passed
        its power check on a thin draw. Not a failure; recorded because the
        reading rule itself said PC-1 "is expected to reject and is not guaranteed
        to", and the real arm landed near the boundary of that expectation.
    ATS_1_post_hoc_audit:
      verdict: >-
        THE CALIBRATION SUPPLIED NUMBERS; IT DID NOT SELECT. I looked for the
        selection signature and did not find it.
      what_i_checked:
        - >-
          The retained set shrank by exactly one, by a pre-declared mechanism
          (CAL-STOP-1 second_stop_leg), on a DEDUCTIVE ground fixed at
          TASK-20260801-019 before any calibration number existed - and I verified
          the deduction against the source (plant() leaves e_2 untouched). Nothing
          was added anywhere.
        - >-
          The excluded statistic's real-arm values do not reject either. Had the
          exclusion been selection-in-disguise aimed at protecting the favourable
          branch, retaining DV-4 would have changed the outcome. IT WOULD NOT.
          This is the strongest available post-hoc evidence that the exclusion was
          not outcome-driven, and it is checkable rather than rhetorical.
        - >-
          The certification predicate was NOT relaxed to admit STAT-KS1-E1, which
          would have lowered the certified delta from 0.05 to 0.02 and produced a
          more impressive-looking floor. Declining that is the opposite of tuning
          and I credit it.
        - >-
          All eight thresholds are named order statistics of named raw arrays and
          recompute exactly. No number in the reading rule is untraceable.
        - >-
          The driver executed at the real arm is BYTE-IDENTICAL to the one the
          calibration froze (RC-1), so no code path was adjusted between arms.
      one_reservation: >-
        The reading rule's prose diagnosis of STAT-DUP at bits 16 ("a good match"
        to n**2/(2S)) is factually wrong (RT049-B2). This is an ERROR, NOT TUNING
        - it neither moved a threshold nor changed a branch, and the frozen band
        came from the raw order statistics regardless of the prose. I record it as
        a correction rather than as an ATS-1 violation.
    limb_discipline_audit:
      L1: >-
        NOT VIOLATED. No artifact in the reviewed package reports the support
        density 1/8 or the non-uniformity of (e_1, e_2) as a finding. The
        two-sample design makes L1 common-mode and it cancels; I verified the
        cancellation from source. Any successor deliverable that says "the fibre
        invariants are/are not uniform" violates this.
      L2: >-
        CORRECTLY THE OBJECT OF THE MEASUREMENT (see ruling_L1_versus_L2).
      L3: >-
        NOT VIOLATED. The dependency-structure facts (both arms are C(512,2)
        enumerations over 512 points; 130816 pairs each) are recorded as
        instrument matching, not as a result about the Semaev map.
    HEUR_DS_1_line_audit:
      verdict: >-
        NO DELIVERABLE IN THE REVIEWED PACKAGE BLURS THE LINE. The execution
        report states plainly that there was no factorization, no largest prime
        factor, no smoothness statistic; RR-EQD-1's N-2 disposition explicitly
        excludes HEUR-DS-1 validation at any tier; H-EQD-001 records HEUR-DS-1 as
        "never validated and never refuted, at any scale". OPEN-BATCH023-A is on
        record in the BATCH-023 opening as owed and REMAINS OWED. The risk is
        entirely prospective - it lives in the synthesis and decision records that
        TASK-20260801-031 and the ledger archive will write, which is why BC-3 is
        stated as a forward constraint.
    INT_2_is_the_intermediate_not_a_stand_in:
      verdict: >-
        SUBSTANTIALLY SETTLED, WITH ONE SCOPE LIMIT THAT MUST BE STATED, AND WITH
        ONE INDEPENDENT CORROBORATION I ADD.
      what_CTRL_EQD_S3_does: >-
        1000 of 1000 at both cells, verifying by ACTUAL POINT ARITHMETIC on
        E(F_p) - not by re-running the coefficient formula - that e_1 = x(P+Q) +
        x(P-Q) and e_2 = x(P+Q) * x(P-Q). That is the right check and it is
        decisive on what it covers.
      the_scope_limit: >-
        CTRL-EQD-S3 covers the first 1000 half-tuples IN ENUMERATION ORDER, which
        is the prefix i in {0, 1} only - two source points out of 512, not a random
        sample of the 130816. The TASK-20260801-028 archive declares this under
        C-3 and does not overstate it. A systematic failure confined to larger
        indices would be missed. Cheap repair for the successor: sample the 1000
        uniformly at random from the enumeration instead of taking a prefix. Zero
        additional cost.
      my_independent_corroboration: >-
        RC-5 is a second, structurally different confirmation that INT-2 is the
        intermediate rather than a stand-in, and it covers ALL 130816 half-tuples
        rather than a prefix. The observed collision structure is EXACTLY the
        collision structure the intermediate's algebra predicts - 20 collisions,
        all multiplicity 2, all 2-torsion translates, zero residual - which a
        stand-in with a different support or a different fibre structure would not
        reproduce. A collapsed or mis-specified stand-in would show either a huge
        duplicate count (of order 1.8e5) or a residual accidental component. It
        shows neither.

