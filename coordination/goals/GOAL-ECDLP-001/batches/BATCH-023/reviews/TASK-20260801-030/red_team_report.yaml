    - id: RV012-B6
      status: DISCHARGED FOR THIS PACKAGE
      note: >-
        The vacuous ENC-B justification does not recur. INT-2's roots are
        x(P_i + P_j) and x(P_i - P_j), both in F_p over this factor base, and
