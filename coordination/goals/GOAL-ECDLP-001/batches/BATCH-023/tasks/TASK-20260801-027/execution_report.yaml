    - C_2_involution_diagnostic_bits_16: >-
        BINDING CONDITION C-2, DISCHARGED. Using the recorded nontrivial 2-torsion
        x = 39489 - confirmed here as the unique root of x^3 + a x + b in F_p - and
        computing iota(x) = x(P + T) by point addition on E(F_p) through
        harness.toycurve, independently of the INT-2 coefficient formula: of the
        20 observed duplicate pairs, 20 ARE IOTA-TRANSLATES and 0 ARE NOT, a
        fraction of 1.0 (20/20). Supporting raw counts - 45 half-tuples of the
        deterministic base have BOTH indices translating back into the base; 5 of
        those 45 are setwise iota-invariant and therefore generate no collision;
        the remaining 40 form exactly 20 translate pairs, matching the 20 observed
        collisions exactly. iota has no fixed point inside the base, x = 39489 is
        not itself in the base, and iota is defined on all 512 base x-coordinates.
    - C_2_involution_diagnostic_bits_20: >-
        NOT APPLICABLE AT THIS CELL, and that is itself the C-4 point. #E(F_p) =
        767427 is ODD, so E(F_p)[2] is trivial, there is no nontrivial 2-torsion
        x-coordinate, and the translate map does not exist. Zero duplicates were
        observed.
    - C_4_model_status: >-
        BINDING CONDITION C-4. The n^2 / (2 S) duplicate model is VOID AT BOTH
        CELLS and is used nowhere in this package. At bits 20 zero duplicates is a
        THEOREM - odd #E makes halving a bijection and removes the collision
        generator - with probability 0, and the superseded e^-46 framing is NOT
        restated. At bits 16 the involution count and the birthday figure share
        the same leading-order expression, so neither the count nor the uniform
        multiplicity-2 pattern discriminates between them; only the translate
        test above does, and it is reported as counts.
    - C_3_control_sampling_C_3: >-
        BINDING CONDITION C-3. CTRL-EQD-S3's 1000 half-tuples are a PREFIX of the
        enumeration order - the first 1000 entries of np.triu_indices(512, k=1) -
        covering only i in {0, 1}. THEY ARE NOT A RANDOM SAMPLE of the 130816
        half-tuples and are not reported as one. On that prefix the check passed
        1000 of 1000 at both cells, by actual point arithmetic verifying
        e_1 = x(P+Q) + x(P-Q) and e_2 = x(P+Q) * x(P-Q) mod p.
