  joints:
    - joint: aligned_G_over_M_delta_versus_cs_bound
      assigned_to: TASK-20260907-57bc95
      attack_plan: >-
        From S2CS raw-result.json, confirm every required
        Stage 2 exact (cell, M, arm) is present and that
        aligned_ratio equals G_exact divided by
        M_delta_exact. Confirm n_exact_rows is 168.
        Confirm aligned_holds is the comparison of that
        ratio to recorded cs_bound_exact. Confirm the
        producer records raw G_exact versus cs_bound_exact
        as units-mismatched and does not treat a raw-G
        failure on P2 as a CS falsification. Do not
        classify W. Do not fit a.
      breaking_artifact: >-
        missing row, ratio not G_exact/M_delta_exact, or
        raw-G comparison treated as a CS falsification
    - joint: observation_not_disposition
      assigned_to: TASK-20260907-57bc95
      attack_plan: >-
        Proves-too-much. Holds only if SMALL_W_or_LARGE_W
        is false, fit_of_a is false, cs_bound_official_supported
        is false, P2 near-zero W is not treated as instrument
        failure, and H-ECDLP-07c7c6 is not moved.
      breaking_artifact: any SMALL-W/LARGE-W reading, official bound claim, or fit of a

  blindness:
    mutual: true
    lifted_for: []
    rationale: null

  proves_too_much:
    objects:
      - >-
        An argument that treats raw G <= cs_bound as the
        Cauchy-Schwarz statement. That conclusion is known
        false as a units match: G is M times max pi, and
        cs_bound bounds max_pi/delta.
      - >-
        An argument that treats P2 near-zero W as instrument
        failure. That conclusion is known false on this
        table: Stage 0 records that P2 is known-large G,
        not known-large W, and near-zero W is expected.
    failure_signature: >-
      The argument must refuse the raw-G comparison as the
      CS statement and must refuse to read P2 near-zero W
      as instrument failure.
    assigned_to: TASK-20260907-57bc95

  blind_rederivation:
