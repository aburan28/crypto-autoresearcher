      aligned ratio is at most the recorded cs_bound_exact,
      from the recorded Stage 2 S2-P523 M=5 P2 fields only.
    parameters: >-
      Recorded Stage 2 S2-P523 M=5 P2 fields G_exact,
      M_delta_exact, W_exact, min_q, and cs_bound_exact
      from RUN-ECDLP-5cad48-S2G/raw-result.json.
