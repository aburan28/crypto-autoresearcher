# Canonical schema fields required by tools/validate_ledger.py check_review_plan.
claim_under_review: >
  Stage 11 of EXP-ECDLP-420e73 measured the H3
  nearby-object re-randomized r-adding walk on
  the already-frozen Stage 7 cells at the
  largest 24-bit prime p=16777213.
  RUN-ECDLP-420e73-S11 is valid, fixture_pass
  is true, and the certificate kind is none.
  Eight walks per (cell x V-or-NULL3) arm,
  r=16, partition independent_uniform_0_15,
  cap 8*ceil(N/D). first_j pins match the
  protocol freeze. All 32 completed walks
  hit V before the cap. T2 design and T2
  NULL-3 record factor2_departure false. T1
  design and T1 NULL-3 record
  factor2_departure true on the fast side.
  T2 NULL-3 start_index 6 hit identity;
  spare start_index 8 completed the eighth
  walk. No invented start. The Stage 10
  deterministic x-mod-16 walk was not
  re-run. An H3 factor-2 miss is a model
  observation, not failed_infrastructure.
  An H3 miss is not H1 closure. Eight walks
  are not the idea's 10^4-walk KS plan.
  Stage 12 remains unauthorized.
  H-ECDLP-77caa5 remains specified.
coordinator_prior: >
  Written after snapshot TASK-20260908-932d2c
  at bind commit 1c67c9ff3 and before Stage
  11 reviewers run. The Coordinator expects
  fixture_pass true and certificate kind
  none. The Coordinator expects first_j
  pins to reconstruct from the sha256
  walk-RNG formula on every completed walk
  and on the identity event. The
  Coordinator expects every completed walk
  to hit V before the cap: that is the
  predicted nearby-object contrast with
  Stage 10, where the deterministic
  functional-graph walk entered short
  V-free cycles. The Coordinator expects
  T2 design and T2 NULL-3 means inside a
  factor 2 of N/D, and T1 design and T1
  NULL-3 means more than a factor 2 faster
  than N/D. The T1 fast-side factor-2 miss
  at n=8 is an H3 model observation on
  this nearby object, not
  failed_infrastructure and not H1
  closure. The hard gate is fixture_pass.
  Mean within a factor 2 of N/D is not
  required. C1, C2, and C3 are not re-run.
  The Stage 10 deterministic walk is not
  re-run. Eight walks are not 10^4 KS.
  Stage 12 is not authorized by this
  review. The Coordinator does not treat
  this as failed_infrastructure, H1
  closure, authorization of Stage 12, a
  status move of H-ECDLP-77caa5, a W
  class, a new-cell hunt, H3 supported, or
  the idea's 10^4-walk KS plan. PD-S11R1:
  same session produced the run and will
  execute the review attacks;
  independent_session is false.
procedure_deviations:
  - id: PD-S11R1
    what: same session produced the run and will execute the review attacks
    independent_session: false
    why: >
      This cloud session produced RUN-ECDLP-420e73-S11
      and is the session executing the Stage 11 review.
      Independence is the declared plan and the
      blind_from cut, not a second process.
  - id: PD-S11R2
    what: no git log or git show
    why: >
      The environment has no reachable git history walk
      for this review. Hashes are taken from the live
      tree and the snapshot receipt.
joints:
  - joint: instrument_gate
    assigned_to: TASK-20260908-76ae29
    attack_plan: >
      Hash-check the Stage 11 snapshot artifacts
      against the snapshot receipt path_sha256.
      Confirm fixture_pass is true, validity is
      valid, and certificate kind is none.
      Confirm first_j_pins_all_match is true.
      Confirm all four arms record n_walks 8
      and that every completed walk hit V
      before the cap. Confirm T2 design and
      T2 NULL-3 record factor2_departure
      false, and T1 design and T1 NULL-3
      record factor2_departure true. Confirm
      T2 NULL-3 start_index 6 is recorded as
      identity and spare start_index 8
      completed the eighth walk with no
      invented start. Confirm k-order BM,
      C1, C2, C3, and the Stage 10
      deterministic x-mod-16 walk are not
      re-run. Confirm
      execution_authorized_stages includes
      11 and does not include 12. Confirm
      H-ECDLP-77caa5, H-ECDLP-07c7c6, and
      H-ECDLP-2ade73 remain specified.
    breaking_artifact: >
      A hash mismatch, a fixture_pass false, a
      certificate other than none, a silent
      Stage 12 authorization, a re-run of
      C1/C2/C3, or a re-run of the Stage 10
      deterministic walk would break the gate.
  - joint: observation_not_disposition
    assigned_to: TASK-20260908-76ae29
    attack_plan: >
      Confirm an H3 factor-2 miss is recorded
      as a model observation, not
      failed_infrastructure. Confirm an H3
      miss is not read as H1 closure. Confirm
      the T1 fast-side factor-2 miss at n=8
      is not promoted to H3 supported or H1.
      Confirm the V-hit contrast with Stage
      10 is recorded as the predicted
      nearby-object mixing contrast, not as
      H1 and not as the idea's 10^4-walk KS
      plan. Confirm eight walks are not
      treated as 10^4 KS. Confirm Stage 12
      stays unauthorized. Confirm H3 is not
      claimed supported from these eight
      walks.
    breaking_artifact: >
      Promoting an H3 miss to H1 closure,
      reading a factor-2 miss as
      failed_infrastructure, treating eight
      walks as 10^4 KS, claiming H3
      supported, or treating Stage 11 as
      authorization of Stage 12 would break
      the observation-not-disposition joint.
  - joint: blind_h3_rerandom
    assigned_to: TASK-20260908-ef84f3
    attack_plan: >
      Re-derive the frozen r=16
      independent_uniform_0_15 r-adding
      walks on the Stage 7 cells and NULL-3
      V from v1_stage11_protocol only.
      Reconstruct addends, starts, and
      NULL-3 k from the frozen lists.
      Reconstruct first_j from
      sha256(f"{seed}|{cell_id}|{start_index}|{arm}")
      and random.Random(walk_rng_seed).
      Confirm each design V and NULL-3 V
      via [k]P. Walk the first 8 starts on
      all four arms without importing the
      producer. On T2 NULL-3, if
      start_index 6 hits identity, use
      spare start_index 8. Record mean,
      factor2_departure, first_j, and
      hitting times. Workspace root from
      this review path
      (coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/reviews/...)
      is Path(__file__).resolve().parents[7].
      Cells and walk parameters are hardcoded
      from v1_stage11_protocol. Do not import
      the producer. Do not use
      PYTHONHASHSEED or hash() of a tuple
      as the walk seed.
    breaking_artifact: >
      A mean or factor2 disagreement, a
      first_j pin mismatch, a V mismatch
      under [k]P, a producer import, a
      walk that uses x mod 16, or a walk
      that uses k-order 1,2,...,D as a
      Stage 11 object would break the blind
      joint.
blindness:
  within_round: true
  lifted_for: []
  rationale: >
    Reviewers may not read each other's reports.
    Each attests to what it read. Composition
    reads both after they exist.
proves_too_much:
  objects:
    - >
      An argument that treats a factor-2 H3
      miss on a frozen r=16
      independent_uniform_0_15 walk as
      failed_infrastructure after
      fixture_pass is true. That conclusion
      is known false: the Stage 11 hard
      gate is fixture_pass.
    - >
      An argument that treats an H3 miss,
      or the T1 fast-side factor-2 miss at
      n=8, as H1 closure or as H3
      supported. Those conclusions are
      known false on the Stage 0 through
      Stage 10 record: H3 is a declared
      heuristic, not H1, and eight walks
      are not support.
    - >
      An argument that treats eight
      nearby-object walks as the idea's
      10^4-walk KS plan, or that treats
      Stage 11 as authorization of Stage
      12. Those conclusions are known
      false: this slice locks 8 walks, and
      Stage 12 stays unauthorized.
  failure_signature: >
    The argument must refuse to read an H3
    factor-2 miss as failed_infrastructure,
    refuse to treat an H3 miss as H1
    closure, refuse to claim H3 supported
    from eight walks, refuse to treat
    eight walks as 10^4 KS, refuse to hunt
    a new cell, and refuse to authorize
    Stage 12.
  assigned_to: TASK-20260908-76ae29
blind_rederivation:
  required: true
  quantity: >
    Stage 11 H3 nearby-object hitting times
    of the frozen r=16
    independent_uniform_0_15 walk on frozen
    S7 cells, including first_j
    reconstruction from the sha256 formula
  assigned_to: TASK-20260908-ef84f3
  blind_from:
    - experiments/EXP-ECDLP-420e73/implementation/stage11_h3_rerandom_16777213.py
    - experiments/EXP-ECDLP-420e73/runs/RUN-ECDLP-420e73-S11/raw-result.json
    - experiments/EXP-ECDLP-420e73/execution-report-s11.yaml
  method: >
    Independent r-adding walk over F_p from
    the protocol cells, addend scalars,
    start scalars, and NULL-3 k list. Draw
    j from the per-walk RNG defined by the
    sha256 material formula. Confirm V via
    [k]P. Confirm first_j pins. Do not
    import the producer. Do not re-run C1,
    C2, C3, or the Stage 10 deterministic
    walk.
