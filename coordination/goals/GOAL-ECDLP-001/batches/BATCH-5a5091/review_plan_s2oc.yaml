  recorded_before_producer_run: true
  does_not_rewrite:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_stage1.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_stage2.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_h3.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_fit.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s0cs.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s1cs.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2g.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2cs.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2fl.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2dx.yaml

  claim_under_review: >-
    Expected producer statement for RUN-ECDLP-5cad48-S2OC
    under a later authorization of v1_stage2_occupancy_audit,
    written before the run exists: S2OC status valid;
    certificate kind none; executable package
    stage2_occupancy; four frozen floor cells only;
    occupancy vectors q, n_empty_before_remap, M_eff,
    max_q, min_q, dstar, pi_c, and max_pi_c present on
    each cell; five exact scalars matched to archived
    S2G; SMALL_W_or_LARGE_W false; fit_of_a false;
    cs_bound_official_supported false;
    a98ea9_stage5_authorized false; occupancy contrast
    is recorded as mechanism ingredients, not as a W
    class.

  coordinator_prior: >-
    Written before RUN-ECDLP-5cad48-S2OC exists. The
    Coordinator expects four cells, one miss and three
    holds, occupancy vectors present, and the five
    exact scalars to match archived S2G. The Coordinator
    expects no official bound and no fit of a. Occupancy
    contrast is not a W class. PD-S2OCR1: same session
    will produce the run and the reviews.
    independent_session is false.

  procedure_deviations:
    - id: PD-S2OCR1
      description: >-
        The Coordinator session that will produce
        RUN-ECDLP-5cad48-S2OC is writing this prior and
        will also execute the review attacks.
        independent_session is recorded false.
    - id: PD-S2OCR2
      description: >-
        Reviewers are forbidden to run git log / git show.
        A --blind-history FAIL or UNCHECKABLE is not a pass.

  joints:
    - joint: occupancy_vectors_and_s2g_match
      assigned_to: TASK-20260907-d491bb
      attack_plan: >-
        From S2OC raw-result.json, confirm n_cells is 4,
        each cell records q, n_empty_before_remap, M_eff,
        max_q, min_q, dstar, pi_c, and max_pi_c, and
        matches_s2g is true on the five exact scalars.
        Confirm the producer does not classify W. Do not
        fit a.
      breaking_artifact: >-
        missing occupancy fields, wrong cell count, S2G
        mismatch, or a W-class reading of occupancy
    - joint: observation_not_disposition
      assigned_to: TASK-20260907-d491bb
      attack_plan: >-
        Proves-too-much. Holds only if SMALL_W_or_LARGE_W
        is false, fit_of_a is false, cs_bound_official_supported
        is false, the S2-P8219 miss is not read as a W
        class, and H-ECDLP-07c7c6 is not moved.
      breaking_artifact: any SMALL-W/LARGE-W reading, official bound claim, or fit of a

  blindness:
    mutual: true
    lifted_for: []
    rationale: null

  proves_too_much:
    objects:
      - >-
        An argument that an occupancy contrast classifies
        the S2-P8219 row as SMALL-W or LARGE-W. That
        conclusion is known false: occupancy ingredients
        are still an observation, not a W class.
      - >-
        An argument that matching S2G on the five exact
        scalars is an official cs_bound claim. That
        conclusion is known false: a match is integrity,
        not an official supported bound.
    failure_signature: >-
      The argument must refuse to read occupancy contrast
      or an S2G match as a W class or as an official bound.
    assigned_to: TASK-20260907-d491bb

  blind_rederivation:
    required: true
    quantity: >-
      q occupancy after remap, n_empty_before_remap, and
      M_eff for two frozen floor cells: S2-P8219 M=9
      floor(Mx/p) and S2-P32779 M=13 floor(Mx/p).
    parameters: >-
      Rebuild labels from dlog_table(p, a, b, N) and
      (x*M)//p only. Must not read the S2OC producer or
      its raw result.
    blind_from:
      - experiments/EXP-ECDLP-5cad48/implementation/stage2_occupancy.py
      - experiments/EXP-ECDLP-5cad48/runs/RUN-ECDLP-5cad48-S2OC/raw-result.json
      - experiments/EXP-ECDLP-5cad48/execution-report-s2oc.yaml
    assigned_to: TASK-20260907-7a91eb
