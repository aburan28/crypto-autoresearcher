      [1..20]. Sort (V, k) by v
      increasing. Encode k_inc as 20
      big-endian unsigned 4-byte integers.
      Compress with zlib.compress(payload, 9)
      using CPython defaults. Record S_C,
      payload length, and k_inc. Workspace
      root from this review path
      (coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/reviews/...)
