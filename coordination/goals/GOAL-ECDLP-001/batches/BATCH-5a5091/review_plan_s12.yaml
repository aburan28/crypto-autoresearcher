# Canonical schema fields required by tools/validate_ledger.py check_review_plan.
claim_under_review: >
  Stage 12 of EXP-ECDLP-420e73 measured the C4
  first-slice zlib encoding length on the
  already-frozen Stage 7 cells at the
  largest 24-bit prime p=16777213.
  RUN-ECDLP-420e73-S12 is valid, fixture_pass
  is true, and the certificate kind is none.
  Arms are T2 design, T1 design, and T1
  NULL-2. Sequence is k in increasing-v
  order. Payload is 20 big-endian unsigned
  4-byte integers. S_C is eight times the
  length of zlib.compress(payload, 9).
  k_inc pins match the protocol freeze.
  Every payload is 80 bytes. Landing
  reconstruction of (V, k) matches the
  frozen V. T2 design, T1 design, and T1
  NULL-2 record the same S_C. That is the
  predicted generic-coder width-padding
  floor, not H1. C4 is a non-admissible
  indicator. A C4 floor is not
  failed_infrastructure. A C4 reading is
  not H1 closure. C1, C2, C3, and the
  Stage 10/11 walks were not re-run.
  Fishing-1000 is not this slice. Stage 13
  remains unauthorized. H-ECDLP-77caa5
  remains specified.
