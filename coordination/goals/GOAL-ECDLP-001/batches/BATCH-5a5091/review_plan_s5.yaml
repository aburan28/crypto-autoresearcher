  joints:
    - joint: instrument_gate
      assigned_to: TASK-20260908-9832ae
      attack_plan: >-
        From RUN-ECDLP-420e73-S5 raw-result.json
        and the Stage 5 execution report,
        confirm validity_status valid,
        fixture_pass true, certificate.kind
        none, and T2 linearized_formal_log
        recovers_exact_affine true. Confirm
        T1 identity exact affine is recorded
        as an observation and is not used as
        a hard gate. Confirm the producer
        does not classify W and does not
        claim H1.
      breaking_artifact: >-
        fixture miss, T2 formal-log miss,
        treating a T1 exact-affine miss as
        failed_infrastructure, W-class
        reading, or H1 claim
    - joint: observation_not_disposition
      assigned_to: TASK-20260908-9832ae
      attack_plan: >-
        Proves-too-much. Holds only if
        SMALL_W_or_LARGE_W is false, fit_of_a
        is false, not_an_H1_claim is true,
        a98ea9_stage5_authorized is false,
        recorded gammas are not read as H1
        support, gamma_power < 0.9 is not
        read as instrument failure, a T1
        exact-affine miss is not read as
        failed_infrastructure, Stage 6 is
        not authorized, and H-ECDLP-77caa5,
        H-ECDLP-07c7c6, and H-ECDLP-2ade73
        are not moved.
      breaking_artifact: >-
        any H1 reading, any 0.9-threshold
        instrument-failure reading, any
        SMALL-W/LARGE-W reading, Stage 6
        authorization, or fit of a
    - joint: blind_t2_formal_log_and_t1_identity
      assigned_to: TASK-20260908-536afa
      attack_plan: >-
        From the frozen v1_stage5_protocol
        cells only, recompute T2 [k]P for
        k=1..20, apply the protocol formal-log
        lambda (Hensel y, [p]R~ projective,
        t=-X Y^{-1} mod p^2, s=t//p), recover
        the unique affine on (s,k) mod 1048573,
        and confirm T1 identity on
        (V,k=1..20) mod 1049791 is not exact.
        Must not read the Stage 5 producer
        or its raw result.
      breaking_artifact: >-
        T2 formal-log non-recovery, T1
        identity exact affine, or a
        producer-path read

  blindness:
    mutual: true
    lifted_for: []
    rationale: null

  proves_too_much:
    objects:
      - >-
        An argument that a recorded Stage 5
        gamma supports H1. That conclusion is
        known false: Stage 5 is one ordinary
        cell at D=20, not an H1 ladder.
      - >-
        An argument that gamma_power < 0.9 on
        T2 is instrument failure. That
        conclusion is known false:
        v1_stage5_protocol disclosed that
        the 0.9 threshold is not a Stage 5
        gate at D=20.
      - >-
        An argument that a T1 exact-affine
        miss is failed_infrastructure. That
        conclusion is known false:
        v1_stage5_protocol disclosed that
        T1 exact affine is an observation.
    failure_signature: >-
      The argument must refuse to read a
      Stage 5 gamma as H1 support, as a
      0.9-threshold instrument miss, or a
      T1 exact-affine miss as
      failed_infrastructure.
    assigned_to: TASK-20260908-9832ae

  blind_rederivation:
    required: true
    quantity: >-
      T2 linearized_formal_log exact-affine
      pair (a,b) and T1 identity
      recovers_exact_affine on the frozen
      Stage 5 cells.
    parameters: >-
      T2: p=1048573, curve y^2=x^3+16x+127, N=1048573,
      P=(0,907328), V=x([k]P) for k=1..20 as
      frozen in v1_stage5_protocol.
      T1: p=1048573, curve y^2=x^3+2,
      N=1049791, P=(1,1047549), V as frozen.
      Formal-log lambda: Hensel-lift y to
      Z/p^2, [p]R~ projective, t=-X Y^{-1}
      mod p^2, require t==0 mod p,
      s=(t//p) mod p. Exact recovery means
      a unique (a,b) in 0..N-1 satisfies
      k = a*lambda+b mod N on all D rows.
      Must not read the Stage 5 producer
      or its raw result.
    blind_from:
      - experiments/EXP-ECDLP-420e73/implementation/stage5_t1_1048573.py
      - experiments/EXP-ECDLP-420e73/runs/RUN-ECDLP-420e73-S5/raw-result.json
      - experiments/EXP-ECDLP-420e73/execution-report-s5.yaml
    assigned_to: TASK-20260908-536afa
