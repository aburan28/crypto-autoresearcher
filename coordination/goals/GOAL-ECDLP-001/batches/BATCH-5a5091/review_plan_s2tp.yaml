review_plan:
  opened_by: TASK-20260907-46fb7f
  batch_id: BATCH-5a5091
  recorded_at: '2026-09-07'
  recorded_before_reviewers: true
  recorded_before_producer_run: true
  does_not_rewrite:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2dx.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2oc.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2os.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2bd.yaml

  claim_under_review: >-
    Expected producer statement for RUN-ECDLP-5cad48-S2TP
    under a later authorization of v1_stage2_tight_pair_audit,
    written before the run exists: S2TP status valid;
    certificate kind none; executable package
    stage2_tight_pair; consume-only of
    RUN-ECDLP-5cad48-S2BD; n_pair_cells 2; pair roles
    miss and next_tightest_hold; aligned_ratio is
    G_exact / M_delta_exact; miss_would_hold_if_next_G
    and miss_would_hold_if_next_M_delta are present;
    SMALL_W_or_LARGE_W false; fit_of_a false;
    cs_bound_official_supported false;
    a98ea9_stage5_authorized false; a pair ingredient
    is recorded as isolation of a derived quantity,
    not as a W class.

  coordinator_prior: >-
    Written before RUN-ECDLP-5cad48-S2TP exists. The
    Coordinator expects the miss and next-tightest
    archived S2BD cells and two defined counterfactual
    aligned ratios. The Coordinator does not pre-record
    whether either counterfactual would hold.
    Occupancy contrast remains not a W class.
    PD-S2TPR1: same session will produce the run and
    the reviews. independent_session is false.

  procedure_deviations:
    - id: PD-S2TPR1
      description: >-
        The Coordinator session that will produce
        RUN-ECDLP-5cad48-S2TP is writing this prior and
        will also execute the review attacks.
        independent_session is recorded false.
    - id: PD-S2TPR2
      description: >-
        Reviewers are forbidden to run git log / git show.
        A --blind-history FAIL or UNCHECKABLE is not a pass.

  joints:
    - joint: pair_counterfactuals
      assigned_to: TASK-20260907-46fb7f
      attack_plan: >-
        From S2TP raw-result.json, confirm n_pair_cells
        is 2, aligned_ratio is G_exact / M_delta_exact,
        and miss_would_hold_if_next_G and
        miss_would_hold_if_next_M_delta are present.
        Confirm the producer does not classify W.
      breaking_artifact: >-
        wrong pair count, wrong swap definition, missing
        hold fields, or a W-class reading
    - joint: observation_not_disposition
      assigned_to: TASK-20260907-46fb7f
      attack_plan: >-
        Proves-too-much. Holds only if SMALL_W_or_LARGE_W
        is false, fit_of_a is false, cs_bound_official_supported
        is false, the S2-P8219 miss is not read as a W
        class, and H-ECDLP-07c7c6 is not moved.
      breaking_artifact: any SMALL-W/LARGE-W reading, official bound claim, or fit of a

  blindness:
    mutual: true
    lifted_for: []
    rationale: null

  proves_too_much:
    objects:
      - >-
        An argument that a pair ingredient classifies
        the S2-P8219 row as SMALL-W or LARGE-W. That
        conclusion is known false: a pairwise swap is
        still an observation, not a W class.
      - >-
        An argument that a counterfactual aligned_ratio
        is an official cs_bound claim. That conclusion
        is known false: a derived swap is not an
        official supported bound.
    failure_signature: >-
      The argument must refuse to read a pair
      ingredient as a W class or as an official bound.
    assigned_to: TASK-20260907-46fb7f

  blind_rederivation:
    required: true
    quantity: >-
      Counterfactual aligned_ratio equal to pair
      G_exact / self M_delta_exact and self G_exact /
      pair M_delta_exact for the archived S2BD miss
      S2-P8219 M=9 floor(Mx/p) using the next-tightest
      S2-P32779 M=13 floor(Mx/p) as the pair.
    parameters: >-
      Read only archived S2BD fields G_exact and
      M_delta_exact for those two cells. Must not read
      the S2TP producer or its raw result.
    blind_from:
      - experiments/EXP-ECDLP-5cad48/implementation/stage2_tight_pair.py
      - experiments/EXP-ECDLP-5cad48/runs/RUN-ECDLP-5cad48-S2TP/raw-result.json
      - experiments/EXP-ECDLP-5cad48/execution-report-s2tp.yaml
    assigned_to: TASK-20260907-b308f7
