      first_j_idx10_all_match are true. Confirm
      nested_stage11_walk0_all_match is true.
      Confirm 10000 walks completed on every arm.
      Confirm n_capped is recorded (expected 0).
      Confirm identity events are recorded.
      Confirm Stage 11's eight walks are not the
      measurement. Confirm the Stage 10 x-mod-16
      walk is not re-run. Confirm C1, C2, C3, the
      Stage 12 three-arm C4, and Stage 13
      fishing-1000 are not re-run. Confirm
      execution_authorized_stages includes 14
      and does not include 15. Confirm
      H-ECDLP-77caa5, H-ECDLP-07c7c6, and
      H-ECDLP-2ade73 remain specified.
    breaking_artifact: >
      A hash mismatch, a fixture_pass false, a
      certificate other than none, a silent
      Stage 15 authorization, a re-run of
      C1/C2/C3, the Stage 10 walk, the Stage 12
      three-arm C4, or Stage 13 fishing-1000,
      or treating Stage 11's eight walks as
      the measurement would break the gate.
  - joint: observation_not_disposition
    assigned_to: TASK-20260908-99fb1e
    attack_plan: >
      Confirm KS is recorded as a distance, not
      a p-value and not a gate. Confirm
      factor2_departure true and ks_within_0_10
      false on all four arms are H3 observations,
      not failed_infrastructure. Confirm an H3
      miss is not H1 support and not H1 closure.
      Confirm the 32-spare stop is
      failed_infrastructure, not H3. Confirm
      Stage 11's eight walks are not the
      measurement. Confirm Stage 15 stays
      unauthorized.
    breaking_artifact: >
      Promoting a KS distance or factor-2 miss
      to H1 support, reading an H3 miss as
      failed_infrastructure, treating an H3
      miss as H1 closure, treating Stage 11's
      eight walks as the measurement, treating
      the 32-spare stop as H3, or treating
      Stage 14 as authorization of Stage 15
