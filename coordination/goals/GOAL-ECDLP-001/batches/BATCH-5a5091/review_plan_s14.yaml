    assigned_to: TASK-20260908-99fb1e
    attack_plan: >
      Hash-check the Stage 14 snapshot artifacts
      against the snapshot bind path_sha256 on
      TASK-20260908-1e7594. Confirm fixture_pass
      is true, validity is valid, and certificate
      kind is none. Confirm extra_start_pins_match
