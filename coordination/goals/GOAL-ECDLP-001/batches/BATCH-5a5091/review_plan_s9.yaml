blindness:
  within_round: true
  lifted_for: []
  rationale: >
    Reviewers may not read each other's reports. Each attests to what
    it read. Composition reads both after they exist.
proves_too_much:
  objects:
    - >
      An argument that treats a generic L=n/2 Berlekamp-Massey fit on a
      20-term k-in-v-order sample as a discrete-log break. That conclusion
      is known false on the Stage 0 through Stage 8 record.
    - >
      An argument that treats a T2 C2 high L as infrastructure failure
      after C3 already recovered T2. That conclusion is known false on
      the Stage 0 through Stage 8 record.
    - >
      An argument that treats Stage 9 gamma as H1 support, or gamma_power
      below 0.9 as instrument failure. Those conclusions are known false:
      Stage 9 does not authorize Stage 10 and does not move H-ECDLP-77caa5.
  failure_signature: >
    The argument must refuse to read Stage 9 gamma as H1, refuse to
    treat gamma_power < 0.9 as instrument failure, refuse to treat T2
    C2 high L as failed_infrastructure, refuse to treat a C2 miss as
    H1 closure, and refuse to run BM on k-order as a Stage 9
    measurement.
  assigned_to: TASK-20260908-4e9096
blind_rederivation:
  required: true
  quantity: >
    C2 Berlekamp-Massey linear complexity of k in increasing-v order
    on frozen S7 cells
  assigned_to: TASK-20260908-6e709f
  blind_from:
    - experiments/EXP-ECDLP-420e73/implementation/stage9_c2_16777213.py
    - experiments/EXP-ECDLP-420e73/runs/RUN-ECDLP-420e73-S9/raw-result.json
    - experiments/EXP-ECDLP-420e73/execution-report-s9.yaml
  method: >
