joints:
  - id: instrument_gate
    owner: TASK-20260908-4e9096
    role: validator
    attack_plan: >
      Hash-check the Stage 9 snapshot artifacts against the snapshot
      receipt path_sha256. Confirm fixture_pass is true, validity is
      valid, and certificate kind is none. Confirm T2/T1/NULL-2 L
      values match the raw result. Confirm the sequences are
      increasing-v and not k-order. Confirm
      execution_authorized_stages includes 9 and does not include 10.
      Confirm H-ECDLP-77caa5, H-ECDLP-07c7c6, and H-ECDLP-2ade73
      remain specified.
    where_coordinator_thinks_it_breaks: >
      A hash mismatch, a fixture_pass false, a certificate other than
      none, a k-order sequence, or a silent Stage 10 authorization
      would break the gate.
  - id: observation_not_disposition
    owner: TASK-20260908-4e9096
    role: validator
    attack_plan: >
      Confirm T2 C2 high L is recorded as class inadequacy, not
      failed_infrastructure. Confirm a C2 miss is not read as H1
      closure. Confirm both gammas are observations. Confirm
      gamma_power below 0.9 is not treated as a Stage 9 miss.
      Confirm k-order BM remains forbidden.
    where_coordinator_thinks_it_breaks: >
      Promoting a C2 miss to H1 closure, reading gamma_power < 0.9 as
      an instrument failure, or treating T2 L=10 as
      failed_infrastructure would break the observation-not-disposition
      joint.
  - id: blind_c2_complexities
    owner: TASK-20260908-6e709f
    role: validator
    attack_plan: >
      Re-derive Berlekamp-Massey linear complexity of k in
      increasing-v order on the frozen Stage 7 cells and the T1
      NULL-2 shuffle (seed 20260908) from the protocol cells only.
      Implement Massey independently. Do not import the producer.
      Confirm each V value via [k]P on the frozen curve. Expected
      match: T2, T1, and NULL-2 all L=10. Workspace root from this
      review path
      (coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/reviews/...)
      is Path(__file__).resolve().parents[7]. Cells are hardcoded from
      v1_stage9_protocol. Do not import the producer.
    where_coordinator_thinks_it_breaks: >
      An L or connection-polynomial disagreement, a V mismatch under
      [k]P, a k-order sequence, or a producer import would break the
      blind joint.
blindness:
  within_round: true
  lifted_for: []
  rationale: >
    Reviewers may not read each other's reports. Each attests to what
    it read. Composition reads both after they exist.
proves_too_much:
  refuse:
    - Stage 9 gamma as H1
    - gamma_power below 0.9 as instrument failure
    - T2 C2 high L as failed_infrastructure
    - C2 miss as H1 closure
    - k-order BM as a Stage 9 measurement
  known_false_objects: >
    An argument that treats a generic L=n/2 Berlekamp-Massey fit on a
    20-term k-in-v-order sample as a discrete-log break, or that
    treats a T2 C2 high L as infrastructure failure after C3 already
    recovered T2, is known false on the Stage 0 through Stage 8
    record.
blind_rederivation:
  quantity: C2 Berlekamp-Massey linear complexity of k in increasing-v order on frozen S7 cells
  owner: TASK-20260908-6e709f
  blind_from:
    - experiments/EXP-ECDLP-420e73/implementation/stage9_c2_16777213.py
    - experiments/EXP-ECDLP-420e73/runs/RUN-ECDLP-420e73-S9/raw-result.json
    - experiments/EXP-ECDLP-420e73/execution-report-s9.yaml
  method: >
    Massey Berlekamp-Massey over F_p (T2) and Z/N (T1), implemented
    independently. Sequence is k sorted by V as an integer.
    NULL-2 is Fisher-Yates shuffle of T1 ks with
    random.Random(20260908). Confirm V via [k]P. Do not run BM on
    k-order as the official sequence.
