claim_under_review: >
  Stage 9 of EXP-ECDLP-420e73 measured C2 Berlekamp-Massey linear
  complexity of k in increasing-v order on the already-frozen Stage 7
  cells at the largest 24-bit prime p=16777213. RUN-ECDLP-420e73-S9 is
  valid, fixture_pass is true, and the certificate kind is none. T2,
  T1, and T1 NULL-2 each produced L=10. T2 C2 high L is class
  inadequacy of C2 on the 24-bit anomalous cell, not
  failed_infrastructure. A C2 miss is not H1 closure. Both gammas are
  observations. k-order BM remains forbidden. Stage 10 remains
  unauthorized. H-ECDLP-77caa5 remains specified.
coordinator_prior: >
  Written after snapshot TASK-20260908-dbb047 at commit 7c928c104 and
  before Stage 9 reviewers run. The Coordinator expects linear
  complexity L=10 on all three arms (T2, T1, T1 NULL-2), the generic
  n/2 value for a 20-term sequence, not O(1). That is the predicted
  C2 class inadequacy on these 24-bit cells, not an infrastructure
  failure and not H1 closure. The hard gate is fixture_pass.
  Sequences are increasing-v, not k-order. Gamma_power below 0.9 is
  an observation, not a Stage 9 miss. Stage 10 is not authorized by
  this review. The Coordinator does not treat this as
  failed_infrastructure, H1 closure, a 0.9-threshold miss,
  authorization of Stage 10, a status move of H-ECDLP-77caa5, or
  permission to run BM on k-order 1,2,...,D. PD-S9R1: same session
  produced the run and will execute the review attacks;
  independent_session is false.
