review_plan:
  opened_by: TASK-20260907-661494
  batch_id: BATCH-5a5091
  recorded_at: '2026-09-07'
  recorded_before_reviewers: true
  recorded_before_producer_run: true
  does_not_rewrite:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_stage1.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_stage2.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_h3.yaml

  claim_under_review: >-
    Expected producer statement for RUN-ECDLP-5cad48-S2FIT under
    DEC-20260907-03e776 / v1_stage2_fit_authorized, written before
    the run exists: S2FIT status valid; certificate kind none;
    executable package eight_prime_fit_observation; eight primes
    present in the Stage 2 table; hat a and hat b recorded per
    covered arm; SMALL_W_or_LARGE_W false; fit_of_a false;
    classification_eligible is a gate, not a W class;
    a98ea9_stage5_authorized false.

  coordinator_prior: >-
    Written before RUN-ECDLP-5cad48-S2FIT exists. The Coordinator
    expects the three validator joints to hold: snapshot
    TASK-20260907-ea19c2 hashes match HEAD; every covered arm
    that remains after H2 and non-positive-W exclusions still
    represents all eight frozen primes, or classification_eligible
    is false; the report does not classify W, does not set
    fit_of_a true, and does not authorize a98ea9 Stage 5. The
    Coordinator expects a blind re-derivation of unconstrained
    hat a for floor(Mx/p) on W_plugin from the recorded Stage 2
    table, without reading stage2_fit.py or the producer
    raw-result. PD-FITR1: same session will produce the run and
    the reviews. independent_session is false.

  procedure_deviations:
    - id: PD-FITR1
      description: >-
        The Coordinator session that will produce
        RUN-ECDLP-5cad48-S2FIT is writing this prior and will
        also execute the review attacks. independent_session
        is recorded false.
    - id: PD-FITR2
      description: >-
        Reviewers are forbidden to run git log / git show.
        A --blind-history FAIL or UNCHECKABLE is not a pass.
    - id: PD-FITR3
      description: >-
        The blind re-deriver may read the Stage 2 raw-result
        W table and the frozen protocol formulas only. It
        may not read stage2_fit.py or S2FIT raw-result.

  joints:
    - joint: artifact_binding
      assigned_to: TASK-20260907-661494
      attack_plan: >-
        Rehash TASK-20260907-ea19c2 archive.path_sha256 against
        HEAD. Confirm the receipt binds EXP-ECDLP-5cad48 /
        RUN-ECDLP-5cad48-S2FIT / TASK-20260907-b693ae and
        certificate kind none. Hash stage2_fit.py as bytes only.
      breaking_artifact: missing S2FIT file, hash mismatch, or certificate other than none
    - joint: eight_prime_package_complete
      assigned_to: TASK-20260907-661494
      attack_plan: >-
        From S2FIT raw-result.json, confirm all eight Stage 2
        cells are ingested, no prime was dropped to improve a
        fit, and each covered arm either represents eight
        primes after exclusions or sets classification_eligible
        false. Do not classify W. Do not treat hat a as an
        official fit_of_a claim.
      breaking_artifact: missing prime, subset fit, or silent drop
    - joint: observation_not_disposition
      assigned_to: TASK-20260907-661494
      attack_plan: >-
        Proves-too-much. Holds only if SMALL_W_or_LARGE_W is
        false, fit_of_a is false, H3 bias is not treated as a
        disposition, later_classification_rule is not applied,
        and H-ECDLP-07c7c6 is not moved.
      breaking_artifact: any SMALL-W/LARGE-W reading or official fit_of_a

  blindness:
    mutual: true
    lifted_for: []
    rationale: null

  proves_too_much:
    objects:
      - >-
        A log-log hat a used as a SMALL-W or LARGE-W
        disposition, or as an official fit_of_a claim. That
        conclusion is known false for this package: the
        producer is forbidden to classify W, and official
        classification is a later Coordinator act.
    failure_signature: >-
      The argument must refuse to classify W and refuse to
      set fit_of_a true.
    assigned_to: TASK-20260907-661494

  blind_rederivation:
    required: true
    quantity: >-
      Unconstrained leave-one-prime point estimate of a for
      arm floor(Mx/p) on primary W_plugin, after H2 and
      non-positive-W_plugin exclusions, from the recorded
      Stage 2 table.
    parameters: >-
      Eight Stage 2 cells, M grids as frozen, arm
      floor(Mx/p), log W_plugin = c + a log M + b log p.
    blind_from:
      - experiments/EXP-ECDLP-5cad48/implementation/stage2_fit.py
      - experiments/EXP-ECDLP-5cad48/runs/RUN-ECDLP-5cad48-S2FIT/raw-result.json
      - experiments/EXP-ECDLP-5cad48/execution-report-fit.yaml
    assigned_to: TASK-20260907-34b2b6
