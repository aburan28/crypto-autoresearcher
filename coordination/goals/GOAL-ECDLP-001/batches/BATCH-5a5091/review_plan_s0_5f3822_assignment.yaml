      tables alone. Do not import the
      producer. Do not use frozenset.
      Do not use exists-c set equality.
      Do not use min(). Use a
      characteristic-array pairwise
      reflection check for symmetry,
      and pairwise sorted-tuple
      comparison for collision.
      Workspace root from this review
      path is Path(__file__).resolve().parents[7].
