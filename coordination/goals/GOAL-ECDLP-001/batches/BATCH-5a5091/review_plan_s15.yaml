  index 20 / 255 on both cells are
  protocol freeze, not a run. All four
  arms completed 10000 walks with
  n_capped 0. Identity events are
  recorded in the tens, not hundreds.
  factor2_departure is mixed: T2 design
  true, T2 NULL-3 false, T1 design false,
  T1 NULL-3 true. ks_within_0_10 is false
  on all four arms. Those last two are
  H3 observations, not gates, not
  failed_infrastructure, and not H1.
  KS is a distance, not a p-value and
  not a gate. The 32-spare stop is
  failed_infrastructure, not H3. C1, C2,
  C3, the Stage 10 x-mod-16 walk, the
  Stage 12 three-arm C4, Stage 13
  fishing-1000, and the Stage 14 D=20 KS
  were not re-run. Stage 16 remains
  unauthorized. H-ECDLP-77caa5 remains
