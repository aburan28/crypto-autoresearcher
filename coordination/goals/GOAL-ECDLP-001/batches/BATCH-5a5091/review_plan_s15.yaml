  certificate kind is none. Partition is
  independent_uniform_0_15. n_walks is
  10000 per arm. n_spare_starts is 4096.
  Extra-start pins at indices 10, 11,
  9999, 10000, 10031, 10032, and 14095
  match the protocol freeze (same Stage
  14 4096-spare stream). first_j at
  start_index 0 matches Stage 11 on every
  arm. first_j at start_index 10 matches
