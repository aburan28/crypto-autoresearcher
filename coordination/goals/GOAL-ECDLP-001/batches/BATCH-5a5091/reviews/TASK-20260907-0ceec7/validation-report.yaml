        execution_authorized_stages is exactly [0],
        a98ea9_stage5 is false, and the report does not change
        H-ECDLP-07c7c6. A recorded W value is an observation
        and is not a breaking artifact by itself.
      breaking_artifact_seen: none
      verdict: holds
