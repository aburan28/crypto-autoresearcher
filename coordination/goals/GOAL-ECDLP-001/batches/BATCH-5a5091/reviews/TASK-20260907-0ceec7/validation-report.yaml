        p2_G: 20.012253587339654
        p2_G_in_window: true
        w_interpreted: false
      note: >-
        W values are present on the arms object. They were not
        interpreted. Membership checks used only M_delta and G
        against the frozen windows named in the review plan.
    - joint: observation_not_disposition
      assigned_to: TASK-20260907-0ceec7
      attack: >-
        Proves-too-much control. Read execution-report-stage0.yaml
        and the specification execution_authorized_stages.
