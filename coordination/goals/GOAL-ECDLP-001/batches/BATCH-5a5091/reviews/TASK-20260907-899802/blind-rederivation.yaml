blind_rederivation:
  task_id: TASK-20260907-899802
  batch_id: BATCH-5a5091
  quantity: >-
    At the frozen fixture curve y^2 = x^3 + 11 over F_65539
    of prime order N=65287, M=40, let h(P) = floor(M * x(P) / p)
    with h(O)=0. Using the RT-EXP-1 exact convolution
    (analysis/o2-sum-compatible-filters/rt_exp_1.py bucket_gain):
    build the M-by-N indicator matrix of h on the dlog table,
    form W_s[k] by one M-axis FFT of the N-axis rFFTs, then
    num[s,c] = sum_{k: h(k)=c} W_s[k], den[s] = (n *_M n)[s],
    pi[s,c] = num/den. Report G = M * max_{s,c} pi[s,c] and
    Md = M * max_d of (sum_c num[(c-d) mod M, c] / N^2).
  parameters_used:
    p: 65539
    a: 0
    b: 11
    N: 65287
    M: 40
    filter: floor(Mx/p)
  implementation: coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/reviews/TASK-20260907-899802/fixture_blind.py
  raw_output: coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/reviews/TASK-20260907-899802/blind_raw.json

  computed:
    G: 1.0840910890776954
    M_delta: 1.0023145196748544
    M_eff: 40
    G0:
      - 2
      - 29831
    identity_indices: [0]
    walk_closed: true

  construction_notes: >-
    Imported only analysis/o2-sum-compatible-filters/rt_exp_1.py
    (bucket_gain) and fourier_obstruction.py (dlog_table). Built
    the discrete-log table of y^2 = x^3 + 11 over F_65539 by
    walking from a generator found by the first quadratic residue
    on the curve. Labelled each point P by floor(M * x(P) / p)
    and the identity by 0. Passed the length-N integer label
    vector to bucket_gain. The walk returned to the identity
    after exactly N steps and hit the identity only at index 0.
    No producer module was imported. W was not computed and was
    not classified. No comparison to any other implementation
    was made in this report.

  limitations:
    - >-
      PD-S0R1: this re-derivation ran in the same session that
      produced RUN-ECDLP-5cad48-S0. independent_session is false.
    - >-
      PD-S0R2: git log and git show were not run.
    - >-
      This report states G and Md only. It does not classify
      SMALL-W or LARGE-W and does not authorize Stage 1/2 or
      a98ea9 Stage 5.

