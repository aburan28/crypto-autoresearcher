      allowed_sources:
        - experiments/EXP-ECDLP-5f3822/specification.yaml
        - ledger/hypotheses/H-ECDLP-aecab6.yaml
      attack: >
        From the frozen n and S tables
        alone, recompute symmetry by a
        pairwise reflection check on a
        characteristic array, and
        recompute collision by pairwise
        comparison of sorted tuples,
        without importing the producer.
        Do not use frozenset. Do not
        use exists-c set equality. Do
        not use min().
      expected_break: >
        Disagreement with the five gates,
        or a script that imports the
        producer.

