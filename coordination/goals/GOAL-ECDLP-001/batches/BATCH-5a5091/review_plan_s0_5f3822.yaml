  joints:
    - joint: instrument_gate
      assigned_to: pending_validator
      attack: >
        Recompute toy_x as min(t % n,
        (n-t) % n), symmetric as exists
        c with S equal to its reflection
        through c, M_S as the frozenset
        of toy_x((x+s) % n), and
        collision as two distinct x, y
        with equal M_S. Confirm REAL
        symmetric and colliding, KF not
        symmetric and not colliding,
        NULL empty or |S|<2 rejected,
        n=0 rejected, the five gates,
        and certificate kind none. KF
        must not be a 2-set.
      expected_break: >
        A REAL miss of symmetric or
        collision, a KF that is
        symmetric or colliding, a 2-set
        used as KF, or treating NULL as
        a collapse to a true iff.
    - joint: observation_not_disposition
      assigned_to: pending_validator
      attack: >
        Confirm the run does not authorize
        Stage 1, does not form elliptic
        M_S, does not run an (L,b) meter,
        does not enumerate Aut, does not
        cost an orbit, and does not claim
        a rho beat.
      expected_break: >
        A Stage 1 authorization flag, an
        elliptic M_S, an (L,b) meter, an
        Aut census, an orbit cost, or a
        rho-beat claim.
    - joint: blind_rederivation
      assigned_to: pending_blind
      blind_from:
        - experiments/EXP-ECDLP-5f3822/implementation/stage0_shift.py
        - experiments/EXP-ECDLP-5f3822/runs/RUN-ECDLP-5f3822-S0/raw-result.json
