    execute the review attacks.
    independent_session is false.

  procedure_deviations:
    - id: PD-4DCA34-S1R1
      what: same session produced the run and will execute the review attacks
      independent_session: false
      why: >
        This cloud session produced
        RUN-ECDLP-6a97f4-S1 and is the session
        executing the Stage 1 review.
        Independence is the declared plan and
        the blind_from cut, not a second process.

  joints:
    - joint: instrument_gate
      assigned_to: TASK-20260908-2faa4e
      attack_plan: >
        Hash-check the Stage 1 snapshot artifacts
        against the snapshot bind path_sha256 on
        TASK-20260908-b5c904. Confirm
        validity_status valid, fixture_pass true,
        BASE-vs-BASE n_digit_diff 0 on every cell,
        n-1 sections on S0-C13 (8), S0-C17 (14),
        S0-C19 (20), S0-C37 (38), F scaling
        invariance on BASE/P10/P01/P11, and
        certificate.kind none. Confirm frozen
        cells, perturbations P10/P01/P11,
        scalings u=2 and u=3, and precision r=2
        were not changed. Confirm execution of
        Stage 1 only under v1_stage1_authorized.
        Confirm H-ECDLP-e9d9bb, H-ECDLP-77caa5,
        H-ECDLP-07c7c6, and H-ECDLP-2ade73 remain
        specified.
      breaking_artifact: >
        A hash mismatch, fixture_pass false,
        a nonzero BASE-vs-BASE n_digit_diff, a
        section-count miss, a scaling miss, a
        certificate other than none, a cell or
        perturbation change, a Stage 2
        execution, or a hypothesis status move
        would break the gate.
    - joint: observation_not_disposition
      assigned_to: TASK-20260908-2faa4e
      attack_plan: >
        Proves-too-much. Holds only if Stage 1
        is not read as Serre-Tate canonicality,
        not read as a P-S1-DIGIT hit or miss,
        not read as H1, not read as a W class,
        not read as authorization of Stage 2 of
        EXP-ECDLP-6a97f4, and not read as
        authorization of Stage 17 of
        EXP-ECDLP-420e73. Confirm
        SMALL_W_or_LARGE_W false, fit_of_a false,
        not_an_H1_claim true, P_S1_DIGIT_untested
        true, canonicality_status uncertified,
        and frozen_object P-S1-RELATIVE.
        Confirm P01 n_digit_diff 0 is recorded
        as a disclosed near-null of F=x^2/A
        with x held, not as a P-S1-DIGIT miss.
        Confirm H-ECDLP-77caa5, H-ECDLP-07c7c6,
        and H-ECDLP-2ade73 are not moved.
      breaking_artifact: >
        A canonicality claim, a P-S1-DIGIT
        disposition, an H1 reading, a W class,
        Stage 2 authorization, Stage 17
        authorization, treating P01 zero as a
        P-S1-DIGIT miss, or a hypothesis status
        move would break the
        observation-not-disposition joint.
    - joint: blind_relative_digit
      assigned_to: TASK-20260908-742d23
      attack_plan: >
        From the frozen fixture numbers only
        (four cells, perturbations P10/P01/P11,
        scalings u=2 and u=3, precision r=2,
        coefficient lift by the 0..p-1
        representative, unique n-torsion
        sections [k]P for k=1..n-1, digit
        d(F)=((F-(F mod p))/p) mod p),
        re-derive n_digit_diff per (cell,
        perturbation), n_digit_diff_panel,
        BASE-vs-BASE zeros, and per-cell
        n_sections without reading the Stage 1
        producer or its raw result. Confirm
        BASE-vs-BASE is 0, each cell has n-1
        sections with y != 0, and
        n_digit_diff_panel reconstructs as 152.
        Workspace root from this review path is
        Path(__file__).resolve().parents[7].
        Do not certify Serre-Tate. Do not
        dispose P-S1-DIGIT.
      breaking_artifact: >
        A BASE-vs-BASE miss, a section-count
        miss, a panel mismatch versus 152, a
        producer-path read, a canonicality
        claim, or a P-S1-DIGIT disposition
        would break the blind joint.

  blindness:
    mutual: true
    lifted_for: []
    rationale: >
      Reviewers may not read each other's reports.
      Each attests to what it read. Composition
      reads both after they exist.

  proves_too_much:
    objects:
      - >
        An argument that Stage 1 certifies
        Serre-Tate canonicality of the
        coefficient lift. That conclusion is
        known false: canonicality_status is
        uncertified on every arm.
      - >
        An argument that n_digit_diff_panel 152
        is a P-S1-DIGIT hit, or that P01
        n_digit_diff 0 is a P-S1-DIGIT miss.
        Those conclusions are known false:
        P-S1-DIGIT requires a certified
        canonical lift; this measurement is
        P-S1-RELATIVE.
      - >
        An argument that a nonzero panel
        authorizes Stage 2 or Stage 17 of
        EXP-ECDLP-420e73. Those conclusions
        are known false: Stage 2 and Stage 17
        stay unauthorized.
      - >
        An argument that the panel supports H1
        or classifies W. Those conclusions are
        known false: Stage 1 is a toy relative
        digit instrument, not a solver.
    failure_signature: >
      The argument must refuse to read Stage 1
      as canonicality, as a P-S1-DIGIT
      disposition, as Stage 2 authorization,
      as Stage 17 authorization, as H1, or as
      a W class.
    assigned_to: TASK-20260908-2faa4e

  blind_rederivation:
    required: true
    quantity: >
      n_digit_diff per (cell, perturbation),
      n_digit_diff_panel, BASE-vs-BASE
      n_digit_diff, and per-cell n_sections
      of d(F) on the frozen four cells under
      P10, P01, and P11, plus F scaling
      invariance on every arm.
    parameters: >
      S0-C13: p=13 A=1 B=5 n=9 P=(3,3);
      S0-C17: p=17 A=1 B=5 n=15 P=(2,7);
      S0-C19: p=19 A=1 B=1 n=21 P=(0,1);
      S0-C37: p=37 A=1 B=3 n=39 P=(0,15);
      scalings u in {2,3}; precision r=2;
      perturbations P10=(A+p,B), P01=(A,B+p),
      P11=(A+p,B+p); digit
      d(F)=((F-(F mod p))/p) mod p with
      0..p-1 representatives; sections [k]P
      for k=1..n-1 with y != 0; Hensel on y
      at fixed x in 0..p-1. Must not read
      the Stage 1 producer or its raw result.
    assigned_to: TASK-20260908-742d23
    blind_from:
      - experiments/EXP-ECDLP-6a97f4/implementation/stage1_relative_digit.py
      - experiments/EXP-ECDLP-6a97f4/runs/RUN-ECDLP-6a97f4-S1/raw-result.json
      - experiments/EXP-ECDLP-6a97f4/execution-report-s1.yaml
    method: >
      Independent Weierstrass arithmetic,
      Hensel lift of y at fixed x in 0..p-1,
      F=x^2 A^{-1} in Z/p^2, and the frozen
      digit convention, from the frozen cell
      numbers in this plan. Do not import the
      Stage 1 producer. Do not certify
      Serre-Tate. Do not dispose P-S1-DIGIT.
