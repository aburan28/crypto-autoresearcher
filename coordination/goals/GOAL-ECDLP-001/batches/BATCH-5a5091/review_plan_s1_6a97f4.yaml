  coordinator_prior: >
    Written after snapshot TASK-20260908-b5c904
    at bind commit 36a97a086 and before these
    reviewers run. The Coordinator expects
    fixture_pass true, BASE-vs-BASE
    n_digit_diff 0 on every cell, n-1
