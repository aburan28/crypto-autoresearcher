  coordinator_prior: >
    Written after snapshot TASK-20260908-7bc308
    at bind commit 6068a9434 and before these
    reviewers run. The Coordinator expects
    fixture_pass true, identity_pass true,
    scaling_invariance_pass true, n_changed_F
    0, and certificate kind none. The
    Coordinator expects per-cell n_sections
    equal to n-1 on every frozen cell. The
    Coordinator expects identity_pass to be
    a sampled F_97 unit-locus rewrite, not a
    Groebner check; that is a disclosed
    measurement of the tautological scaling
    law, not a silent upgrade and not a
    fixture miss of the Z/p^2 evaluation.
    The Coordinator does not treat Stage 0
    as Serre-Tate canonicality, as a
    first-lift-digit audit, as H1, as a W
    class, or as authorization of Stage 1
    of this experiment or Stage 17 of
    EXP-ECDLP-420e73. PD-4DCA34-S0R1: same
    session produced the run and will
    execute the review attacks.
    independent_session is false.

  procedure_deviations:
    - id: PD-4DCA34-S0R1
      what: same session produced the run and will execute the review attacks
      independent_session: false
      why: >
        This cloud session produced
        RUN-ECDLP-6a97f4-S0 and is the session
        executing the Stage 0 review.
        Independence is the declared plan and
        the blind_from cut, not a second process.
    - id: PD-4DCA34-S0-ID
      what: identity_pass is sampled over F_97, not a Groebner identity
      independent_session: false
      why: >
        The frozen Stage 0 law is F(u^2 x, u^4 A)
        = F(x,A) whenever A and u are units. The
        producer checks that rewrite on samples
        over F_97. The algebraic identity is
        tautological. Reviewers record this as a
        disclosed measurement, not as a fixture
        miss and not as a silent upgrade of the
        frozen law.

  joints:
    - joint: instrument_gate
      assigned_to: TASK-20260908-aed2e6
      attack_plan: >
        Hash-check the Stage 0 snapshot artifacts
        against the snapshot bind path_sha256 on
        TASK-20260908-7bc308. Confirm
        validity_status valid, fixture_pass true,
        identity_pass true, scaling_invariance_pass
        true, n_changed_F 0, and certificate.kind
        none. Confirm per-cell n_sections equals
        n-1 on S0-C13 (8), S0-C17 (14), S0-C19
        (20), S0-C37 (38). Confirm frozen cells,
        scalings u=2 and u=3, and precision r=2
        were not changed. Confirm execution of
        Stage 0 only. Confirm H-ECDLP-e9d9bb,
        H-ECDLP-77caa5, H-ECDLP-07c7c6, and
        H-ECDLP-2ade73 remain specified.
      breaking_artifact: >
        A hash mismatch, fixture_pass false,
        identity_pass false, scaling_invariance_pass
        false, n_changed_F nonzero, a certificate
        other than none, a cell or scaling change,
        a Stage 1 execution, or a hypothesis
        status move would break the gate.
    - joint: observation_not_disposition
      assigned_to: TASK-20260908-aed2e6
      attack_plan: >
        Proves-too-much. Holds only if Stage 0 is
        not read as Serre-Tate canonicality, not
        read as a first-lift-digit audit, not
        read as H1, not read as a W class, not
        read as authorization of Stage 1 of
        EXP-ECDLP-6a97f4, and not read as
        authorization of Stage 17 of
        EXP-ECDLP-420e73. Confirm
        SMALL_W_or_LARGE_W false, fit_of_a false,
        not_an_H1_claim true, and
        identity_check_is_sampled_F97 recorded.
        Confirm H-ECDLP-77caa5, H-ECDLP-07c7c6,
        and H-ECDLP-2ade73 are not moved.
      breaking_artifact: >
        A canonicality claim, a first-lift-digit
        audit, an H1 reading, a W class, Stage 1
        authorization, Stage 17 authorization, or
        a hypothesis status move would break the
        observation-not-disposition joint.
    - joint: blind_scaling_invariance
      assigned_to: TASK-20260908-76ebf5
      attack_plan: >
        From the frozen fixture numbers only
        (four cells, scalings u=2 and u=3,
        precision r=2, coefficient lift by the
        0..p-1 representative, unique n-torsion
        sections [k]P for k=1..n-1), re-derive
        n_changed_F and per-cell n_sections
        without reading the Stage 0 producer or
        its raw result. Confirm n_changed_F is 0
        and each cell has n-1 sections with
        y != 0. Confirm the algebraic rewrite
        F(u^2 x, u^4 A)=F(x,A) on the unit locus
        in Z/p^2 of each cell p. Workspace root
        from this review path is
        Path(__file__).resolve().parents[7].
        Do not inspect first-lift digits of a
        noncanonical family.
      breaking_artifact: >
        A nonzero n_changed_F, a section-count
        miss, a producer-path read, or a
        first-lift-digit inspection would break
        the blind joint.

  blindness:
    mutual: true
    lifted_for: []
    rationale: >
      Reviewers may not read each other's reports.
      Each attests to what it read. Composition
      reads both after they exist.

  proves_too_much:
    objects:
      - >
        An argument that Stage 0 certifies
        Serre-Tate canonicality of the
        coefficient lift. That conclusion is
        known false: the freeze is the 0..p-1
        representative into Z/p^2.
      - >
        An argument that Stage 0 is a
        first-lift-digit audit or that it
        authorizes Stage 1. Those conclusions
        are known false: DEC-20260908-36385f
        forbade inspecting noncanonical digits
        at Stage 0 and left Stage 1 unauthorized.
      - >
        An argument that n_changed_F 0 supports
        H1 or classifies W. Those conclusions
        are known false: Stage 0 is a toy
        scaling instrument, not a solver.
      - >
        An argument that sampled F_97 identity_pass
        is a Groebner proof of the polynomial
        identity. That conclusion is known false:
        PD-4DCA34-S0-ID records the sampled check.
    failure_signature: >
      The argument must refuse to read Stage 0
      as canonicality, as a digit audit, as
      Stage 1 authorization, as Stage 17
      authorization, as H1, as a W class, or
      as a Groebner identity proof.
    assigned_to: TASK-20260908-aed2e6

  blind_rederivation:
    required: true
    quantity: >
      n_changed_F and per-cell n_sections of
      F=x^2/A in Z/p^2 on every non-identity
      n-torsion section of the frozen four
      cells under scalings u=2 and u=3, plus
      the algebraic rewrite F(u^2 x, u^4 A)
      = F(x,A) on the unit locus.
    parameters: >
      S0-C13: p=13 A=1 B=5 n=9 P=(3,3);
      S0-C17: p=17 A=1 B=5 n=15 P=(2,7);
      S0-C19: p=19 A=1 B=1 n=21 P=(0,1);
      S0-C37: p=37 A=1 B=3 n=39 P=(0,15);
      scalings u in {2,3}; precision r=2;
      coefficient lift is the 0..p-1
      representative; sections [k]P for
      k=1..n-1 with y != 0. Must not read
      the Stage 0 producer or its raw result.
    assigned_to: TASK-20260908-76ebf5
    blind_from:
      - experiments/EXP-ECDLP-6a97f4/implementation/stage0_scaling_invariance.py
      - experiments/EXP-ECDLP-6a97f4/runs/RUN-ECDLP-6a97f4-S0/raw-result.json
      - experiments/EXP-ECDLP-6a97f4/execution-report-s0.yaml
    method: >
      Independent Weierstrass arithmetic,
      Hensel lift of y at fixed x in 0..p-1,
      and F=x^2 A^{-1} in Z/p^2, from the
      frozen cell numbers in this plan.
      Do not import the Stage 0 producer.
      Do not inspect first-lift digits of a
      noncanonical family.
