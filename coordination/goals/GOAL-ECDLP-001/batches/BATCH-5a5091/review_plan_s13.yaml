# Canonical schema fields required by tools/validate_ledger.py check_review_plan.
claim_under_review: >
  Stage 13 of EXP-ECDLP-420e73 measured the
  fishing-1000 C4 encoding length on the
  already-frozen Stage 7 cells at
  p=16777213. RUN-ECDLP-420e73-S13 is
  valid, fixture_pass is true, and the
  certificate kind is none. 1000
  independent random designs of size D=20
  were drawn per cell from {1,...,N-1}.
  Sequence is k in increasing-v order.
  Payload is 20 big-endian unsigned
  4-byte integers. S_C is eight times the
  length of zlib.compress(payload, 9).
  design_index=0 k and k_inc pins match
  the protocol freeze. Every payload is
  80 bytes. n_retries_total is 0. Min
  gamma_power and min gamma_linear are
  recorded on each cell. Mean gamma_power
  differs from min on both cells. Stage
  12 gammas were read from
  RUN-ECDLP-420e73-S12 and were not
  recomputed. C4 is a non-admissible
  indicator. Fishing min-gamma is not H1
  support. A fishing floor is not
  failed_infrastructure. A fishing
  reading is not H1 closure. C1, C2, C3,
  the Stage 10/11 walks, and the Stage 12
  three-arm C4 were not re-run. The
  idea's 10^4-walk KS is not this slice.
  Stage 14 remains unauthorized.
  H-ECDLP-77caa5 remains specified.
coordinator_prior: >
  Written after snapshot TASK-20260908-b8894e
  at bind commit f38f70818 and before Stage
  13 reviewers run. The Coordinator expects
  fixture_pass true and certificate kind
  none. The Coordinator expects
  design_index=0 k and k_inc to reconstruct
  from the sha256 RNG formula at seed
  20260908 with retry 0. The Coordinator
  expects 1000 valid designs per cell,
  every payload 80 bytes, and landing
  reconstruction of (V, k) to match [k]P.
  The Coordinator expects n_retries_total
  0. The Coordinator expects min gamma_C
  recorded on each cell. Mean gamma_power
  differing from min is allowed: S_C need
  not be constant across the 1000 designs.
  Encoded k values are from {1,...,N-1},
  so a min gamma that does not match the
  Stage 12 single-design gamma is not a
  protocol miss. The hard gate is
  fixture_pass. A small or large min gamma
  is not required. C4 is a non-admissible
  indicator and never supports a positive.
  Fishing min-gamma never supports a
  positive. C1, C2, C3, the Stage 10/11
  walks, and the Stage 12 three-arm C4
  are not re-run. 10^4-walk KS is not
  this slice. Stage 14 is not authorized
  by this review. The Coordinator does
  not treat this as failed_infrastructure,
  H1 closure, H1 support, authorization
  of Stage 14, a status move of
  H-ECDLP-77caa5, a W class, or a new-cell
  hunt. PD-S13R1: same session produced
  the run and will execute the review
  attacks; independent_session is false.
