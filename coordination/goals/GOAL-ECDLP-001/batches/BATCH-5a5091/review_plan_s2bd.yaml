review_plan:
  opened_by: TASK-20260907-38bbad
  batch_id: BATCH-5a5091
  recorded_at: '2026-09-07'
  recorded_before_reviewers: true
  recorded_before_producer_run: true
  does_not_rewrite:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2dx.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2oc.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2os.yaml

  claim_under_review: >-
    Expected producer statement for RUN-ECDLP-5cad48-S2BD
    under a later authorization of v1_stage2_bound_decomp_audit,
    written before the run exists: S2BD status valid;
    certificate kind none; executable package
    stage2_bound_decomp; consume-only of
    RUN-ECDLP-5cad48-S2OC; n_cells 4; rebuilt cs_bound
    is 1 + sqrt(W_exact / min_q); aligned_ratio is
    G_exact / M_delta_exact; all_rebuild_matches,
    miss_unique_tightest_cs_bound, and
    miss_unique_highest_aligned_ratio are present;
    SMALL_W_or_LARGE_W false; fit_of_a false;
    cs_bound_official_supported false;
    a98ea9_stage5_authorized false; a unique or shared
    bound ingredient is recorded as isolation of a
    derived quantity, not as a W class.

  coordinator_prior: >-
    Written before RUN-ECDLP-5cad48-S2BD exists. The
    Coordinator expects four archived occupancy cells
    and a rebuilt CS bound on each. The Coordinator
    does not pre-record whether the miss is unique in
    tightest bound or highest aligned_ratio.
    Occupancy contrast remains not a W class.
    PD-S2BDR1: same session will produce the run and
    the reviews. independent_session is false.

  procedure_deviations:
    - id: PD-S2BDR1
      description: >-
        The Coordinator session that will produce
        RUN-ECDLP-5cad48-S2BD is writing this prior and
        will also execute the review attacks.
        independent_session is recorded false.
    - id: PD-S2BDR2
      description: >-
        Reviewers are forbidden to run git log / git show.
        A --blind-history FAIL or UNCHECKABLE is not a pass.

  joints:
    - joint: bound_rebuild_and_ingredients
      assigned_to: TASK-20260907-38bbad
      attack_plan: >-
        From S2BD raw-result.json, confirm n_cells is 4,
        rebuilt cs_bound is 1 + sqrt(W_exact / min_q),
        aligned_ratio is G_exact / M_delta_exact, and
        all_rebuild_matches, miss_unique_tightest_cs_bound,
        and miss_unique_highest_aligned_ratio are present.
        Confirm the producer does not classify W.
      breaking_artifact: >-
        wrong cell count, wrong rebuild definition, missing
        uniqueness fields, or a W-class reading
    - joint: observation_not_disposition
      assigned_to: TASK-20260907-38bbad
      attack_plan: >-
        Proves-too-much. Holds only if SMALL_W_or_LARGE_W
        is false, fit_of_a is false, cs_bound_official_supported
        is false, the S2-P8219 miss is not read as a W
        class, and H-ECDLP-07c7c6 is not moved.
      breaking_artifact: any SMALL-W/LARGE-W reading, official bound claim, or fit of a

  blindness:
    mutual: true
    lifted_for: []
    rationale: null

  proves_too_much:
    objects:
      - >-
        An argument that a unique or shared bound
        ingredient classifies the S2-P8219 row as
        SMALL-W or LARGE-W. That conclusion is known
        false: a bound census is still an observation,
        not a W class.
      - >-
        An argument that a rebuilt cs_bound is an
        official cs_bound claim. That conclusion is
        known false: a derived rebuild is not an
        official supported bound.
    failure_signature: >-
      The argument must refuse to read a bound
      ingredient as a W class or as an official bound.
    assigned_to: TASK-20260907-38bbad

  blind_rederivation:
    required: true
    quantity: >-
      Rebuilt cs_bound equal to 1 + sqrt(W_exact / min_q)
      and aligned_ratio equal to G_exact / M_delta_exact
      for two archived S2OC cells: S2-P8219 M=9 floor(Mx/p)
      and S2-P32779 M=13 floor(Mx/p).
    parameters: >-
      Read only archived S2OC fields G_exact, M_delta_exact,
      W_exact, and min_q for those two cells. Must not read
      the S2BD producer or its raw result.
    blind_from:
      - experiments/EXP-ECDLP-5cad48/implementation/stage2_bound_decomp.py
      - experiments/EXP-ECDLP-5cad48/runs/RUN-ECDLP-5cad48-S2BD/raw-result.json
      - experiments/EXP-ECDLP-5cad48/execution-report-s2bd.yaml
    assigned_to: TASK-20260907-1b2ebd
