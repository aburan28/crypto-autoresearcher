review_plan:
  id: review_plan_s16
  goal: GOAL-ECDLP-001
  batch: BATCH-5a5091
  experiment: EXP-ECDLP-420e73
  run: RUN-ECDLP-420e73-S16
  hypothesis: H-ECDLP-77caa5
  recorded_at: '2026-09-08T09:05:00Z'
  recorded_by: coordinator
  recorded_after: TASK-20260908-22cd5e
  recorded_commit: 17f8abca5
  recorded_before_reviewers: true
  claim_under_review: >
    Stage 16 of EXP-ECDLP-420e73 measured
    the idea's remaining 10^4-walk H3
    Kolmogorov-Smirnov distance on the
    already-frozen Stage 7 cells at
    p=16777213 under v1_stage16_authorized,
    with D = round(N^{1/2}) per cell (T2
    4096, T1 4095). RUN-ECDLP-420e73-S16
    is valid, fixture_pass is true, and
    the certificate kind is none.
    Partition is independent_uniform_0_15.
    n_walks is 10000 per arm.
    n_spare_starts is 4096. Extra-start
    pins at indices 10, 11, 9999, 10000,
    10031, 10032, and 14095 match the
    protocol freeze (same Stage 14
    4096-spare stream). first_j at
    start_index 0 matches Stage 11 on
    every arm. first_j at start_index 10
    matches the protocol pins. Stage 15
    D=256 hitting times are not nested
    under D=round(N^{1/2}). Stage 11's
    eight walks are not the measurement.
    Design V pins at k=21 / k=256 / k=D
    and NULL-3 k[20] / k[255] / k[4094] /
    k[4095] plus V index 20 / 255 / D-end
    on both cells are protocol freeze,
    not a run. T2 NULL-3 has one freeze
    x-collision at stream indices 745 and
    1623 so |unique V|=4095 at declared
    D=4096; KS uses declared D/N; that is
    not failed_infrastructure. All four
    arms completed 10000 walks with
    n_capped 0. Identity events are
    recorded in the single digits, not
    hundreds. factor2_departure is true
    on all four arms. ks_within_0_10 is
    false on all four arms. Those last
    two are H3 observations, not gates,
    not failed_infrastructure, and not
    H1. KS is a distance, not a p-value
    and not a gate. The 32-spare stop is
    failed_infrastructure, not H3. C1,
    C2, C3, the Stage 10 x-mod-16 walk,
    the Stage 12 three-arm C4, Stage 13
    fishing-1000, the Stage 14 D=20 KS,
    and the Stage 15 D=256 KS were not
    re-run. Stage 17 remains
    unauthorized. H-ECDLP-77caa5 remains
    specified.
  coordinator_prior: >
    Written after snapshot TASK-20260908-22cd5e
    at bind commit 17f8abca5 and before Stage
    16 reviewers run. The Coordinator expects
    fixture_pass true and certificate kind
    none. The Coordinator expects extra-start
    pins to reconstruct from the sha256 RNG
    formula at seed 20260908 with n_spare_starts
    4096 (same Stage 14 4096-spare stream).
    The Coordinator expects first_j at
    start_index 0 to match Stage 11 and
    first_j at start_index 10 to match the
    protocol pins. The Coordinator expects
    live design V k=21 / k=256 / k=D pins
    and NULL-3 k[20] / k[255] / k[4094] /
    k[4095] plus V index 20 / 255 / D-end
    on both cells to reconstruct from
    v1_stage16_protocol. The Coordinator
    expects T2 NULL-3 |unique V|=4095 with
    the freeze x-collision at indices 745
    and 1623, T1 NULL-3 4095-distinct, and
    both design V D-distinct. The Coordinator
    expects 10000 completed walks per arm
    and n_capped 0. The Coordinator expects
    identity events in the single digits
    on the four arms, not hundreds. The
    Coordinator expects factor2_departure
    true on all four arms and
    ks_within_0_10 false on all four arms.
    Those last two are H3 observations, not
    gates, not H1, and not
    failed_infrastructure. The hard gate is
    fixture_pass. Mean within a factor 2 of
    N/D is not required. ks_within_0_10 is
    not required. The T2 NULL-3 freeze
    collision is not failed_infrastructure.
    KS uses declared D/N. Stage 15 D=256
    hitting times are not nested under
    D=round(N^{1/2}). Stage 11's eight walks
    are not the measurement. The Stage 10
    x-mod-16 walk is not re-run. C1, C2, C3,
    the Stage 12 three-arm C4, Stage 13
    fishing-1000, the Stage 14 D=20 KS, and
    the Stage 15 D=256 KS are not re-run.
    The 32-spare stop is
    failed_infrastructure, not H3. Stage 17
    is not authorized by this review. The
    Coordinator does not treat this as
    failed_infrastructure, H1 closure, H1
    support, authorization of Stage 17, a
    status move of H-ECDLP-77caa5, a W
    class, or a new-cell hunt. PD-S16R1:
    same session produced the run and will
    execute the review attacks;
    independent_session is false.
  procedure_deviations:
    - id: PD-S16R1
      what: same session produced the run and will execute the review attacks
      independent_session: false
      why: >
        This cloud session produced RUN-ECDLP-420e73-S16
        and is the session executing the Stage 16 review.
        Independence is the declared plan and the
        blind_from cut, not a second process.
  joints:
    - joint: instrument_gate
      assigned_to: TASK-20260908-5d87f0
      attack_plan: >
        Hash-check the Stage 16 snapshot artifacts
        against the snapshot bind path_sha256 on
        TASK-20260908-22cd5e. Confirm fixture_pass
        is true, validity is valid, and certificate
        kind is none. Confirm extra_start_pins_match
        is true. Confirm first_j_idx0_all_match and
        first_j_idx10_all_match are true. Confirm
        design V k=21 / k=256 / k=D pins and NULL-3
        k[20] / k[255] / D-end plus V index 20 / 255
        / D-end on both cells are recorded as
        protocol freeze matches. Confirm T2 NULL-3
        |unique V|=4095 with freeze collision at
        745 and 1623, and that this is not treated
        as failed_infrastructure. Confirm 10000
        walks completed on every arm. Confirm
        n_capped is recorded (expected 0). Confirm
        identity events are recorded in the single
        digits. Confirm Stage 15 D=256 hitting
        times are not nested. Confirm Stage 11's
        eight walks are not the measurement.
        Confirm the Stage 10 x-mod-16 walk is
        not re-run. Confirm C1, C2, C3, the
        Stage 12 three-arm C4, Stage 13
        fishing-1000, the Stage 14 D=20 KS, and
        the Stage 15 D=256 KS are not re-run.
        Confirm execution_authorized_stages
        includes 16 and does not include 17.
        Confirm H-ECDLP-77caa5, H-ECDLP-07c7c6,
        and H-ECDLP-2ade73 remain specified.
      breaking_artifact: >
        A hash mismatch, a fixture_pass false, a
        certificate other than none, treating the
        T2 NULL-3 freeze collision as
        failed_infrastructure, a silent Stage 17
        authorization, a re-run of C1/C2/C3, the
        Stage 10 walk, the Stage 12 three-arm C4,
        Stage 13 fishing-1000, the Stage 14 D=20
        KS, or the Stage 15 D=256 KS, treating
        Stage 15 D=256 hitting times as nested,
        or treating Stage 11's eight walks as the
        measurement would break the gate.
    - joint: observation_not_disposition
      assigned_to: TASK-20260908-5d87f0
      attack_plan: >
        Confirm KS is recorded as a distance, not
        a p-value and not a gate. Confirm
        factor2_departure true on all four arms
        and ks_within_0_10 false on all four arms
        are H3 observations, not
        failed_infrastructure. Confirm an H3
        miss is not H1 support and not H1 closure.
        Confirm the T2 NULL-3 freeze collision is
        not failed_infrastructure. Confirm KS uses
        declared D/N. Confirm the 32-spare stop is
        failed_infrastructure, not H3. Confirm
        Stage 15 D=256 hitting times are not
        nested. Confirm Stage 11's eight walks are
        not the measurement. Confirm Stage 17
        stays unauthorized.
      breaking_artifact: >
        Promoting a KS distance or factor-2 miss
        to H1 support, reading an H3 miss as
        failed_infrastructure, treating an H3
        miss as H1 closure, treating the T2
        NULL-3 freeze collision as
        failed_infrastructure, treating Stage 15
        D=256 hitting times as nested, treating
        Stage 11's eight walks as the measurement,
        treating the 32-spare stop as H3, or
        treating Stage 16 as authorization of
        Stage 17 would break the
        observation-not-disposition joint.
    - joint: blind_h3_ks_1e4
      assigned_to: TASK-20260908-53e074
      attack_plan: >
        Re-derive extra-start pins from
        v1_stage16_protocol only, using the
        sha256 RNG formula at seed 20260908
        with n_spare_starts 4096 (same Stage
        14 4096-spare stream). Re-derive
        first_j at start_index 0 and 10 from
        the per-walk sha256 RNG formula. Re-
        derive live design V k=21 / k=256 /
        k=D pins by independent scalar
        multiplication on both frozen cells.
        Re-derive NULL-3 k[20] / k[255] /
        k[4094] / k[4095] by continuing
        Random(20260908) after 16 addends and
        10 starts to 4096 values, then V
        index 20 / 255 / D-end as x([k]P) on
        each cell's D. Confirm T2 NULL-3
        |unique V|=4095 with x-collision at
        stream indices 745 and 1623, T1
        NULL-3 4095-distinct, and both design
        V D-distinct. Workspace root from this
        review path
        (coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/reviews/...)
        is Path(__file__).resolve().parents[7].
        Cells, addends, starts, and NULL-3
        construction are taken from
        v1_stage16_protocol.yaml. Do not import
        the Stage 16 producer. Do not read
        RUN-ECDLP-420e73-S16. Do not read
        stage14_walk.c. Do not re-run the
        Stage 10 x-mod-16 walk. Do not treat
        Stage 11's eight walks as the
        measurement. Do not treat Stage 15
        D=256 hitting times as nested. A full
        10000-walk KS re-run is not this joint.
      breaking_artifact: >
        An extra-start pin mismatch, a first_j
        mismatch at index 0 or 10, a design V
        k=21, k=256, or k=D pin mismatch, a
        NULL-3 k or V D-end mismatch, missing
        the T2 NULL-3 freeze collision, a
        producer import, a read of the Stage
        16 run, execution report, or
        stage14_walk.c, a Stage 10 x-mod-16
        walk as a Stage 16 object, treating
        Stage 15 D=256 hitting times as nested,
        or treating Stage 11's eight walks as
        the measurement would break the blind
        joint.
  blindness:
    mutual: true
    lifted_for: []
    rationale: >
      Reviewers may not read each other's reports.
      Each attests to what it read. Composition
      reads both after they exist.
  proves_too_much:
    objects:
      - >
        An argument that treats a KS miss or
        factor-2 miss after fixture_pass is
        true as failed_infrastructure. That
        conclusion is known false: the Stage
        16 hard gate is fixture_pass.
      - >
        An argument that treats a KS distance
        or factor-2 miss as H1 support or H1
        closure. Those conclusions are known
        false: KS is a distance, not a gate,
        and an H3 miss is not H1.
      - >
        An argument that treats the T2 NULL-3
        freeze x-collision as
        failed_infrastructure. That conclusion
        is known false: completeness recorded
        it as a freeze observation and KS uses
        declared D/N.
      - >
        An argument that treats Stage 15 D=256
        hitting times as nested under
        D=round(N^{1/2}), or Stage 11's eight
        walks as the Stage 16 measurement.
        Those conclusions are known false: V
        grew, so Stage 15 hitting times are
        not nested, and walks 0..7 are not
        the measurement.
      - >
        An argument that treats the 32-spare
        stop as H3, or that treats Stage 16
        as authorization of Stage 17. Those
        conclusions are known false: the
        32-spare stop is failed_infrastructure,
        and Stage 17 stays unauthorized.
    failure_signature: >
      The argument must refuse to read a KS
      or factor-2 miss as failed_infrastructure,
      refuse to treat KS as H1 support or H1
      closure, refuse to treat the T2 NULL-3
      freeze collision as failed_infrastructure,
      refuse to treat Stage 15 D=256 hitting
      times as nested, refuse to treat Stage
      11's eight walks as the measurement,
      refuse to treat the 32-spare stop as H3,
      refuse to hunt a new cell, and refuse
      to authorize Stage 17.
    assigned_to: TASK-20260908-5d87f0
  blind_rederivation:
    required: true
    quantity: >
      Stage 16 extra-start pins of the 4096-
      spare draw, first_j at start_index 0
      and 10 from the per-walk sha256 RNG,
      live design V k=21 / k=256 / k=D pins
      on both frozen cells, NULL-3 k[20] /
      k[255] / k[4094] / k[4095] plus V
      index 20 / 255 / D-end on both cells,
      and the T2 NULL-3 freeze collision at
      stream indices 745 and 1623
    assigned_to: TASK-20260908-53e074
    blind_from:
      - experiments/EXP-ECDLP-420e73/implementation/stage16_h3_ks_1e4_D_Nsqrt_16777213.py
      - experiments/EXP-ECDLP-420e73/implementation/stage14_walk.c
      - experiments/EXP-ECDLP-420e73/runs/RUN-ECDLP-420e73-S16/raw-result.json
      - experiments/EXP-ECDLP-420e73/execution-report-s16.yaml
    method: >
      Independent sha256 extra-start draw from
      v1_stage16_protocol cells, seed
      20260908, n_spare_starts 4096.
      Independent first_j from walk_rng at
      indices 0 and 10. Independent [21]P,
      [256]P, and [D]P x-coordinates on both
      cells. Independent NULL-3 k continuation
      of Random(20260908) after 16 addends
      and 10 starts to 4096 values, then
      x([k]P) at index 20, 255, and D-end on
      each cell's D. Confirm extra-start pins,
      first_j pins, design V pins, NULL-3
      pins, and the T2 NULL-3 freeze collision.
      Do not import the Stage 16 producer.
      Do not re-run C1, C2, C3, the Stage 10
      x-mod-16 walk, the Stage 12 three-arm
      C4, Stage 13 fishing-1000, the Stage 14
      D=20 KS, the Stage 15 D=256 KS, or the
      full 10000-walk KS.
