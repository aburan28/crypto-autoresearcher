  Stage 10 of EXP-ECDLP-420e73 measured the H3
  first-slice r-adding walk on the already-frozen
  Stage 7 cells at the largest 24-bit prime
  p=16777213. RUN-ECDLP-420e73-S10 is valid,
  fixture_pass is true, and the certificate kind
  is none. Eight walks per (cell x V-or-NULL3)
