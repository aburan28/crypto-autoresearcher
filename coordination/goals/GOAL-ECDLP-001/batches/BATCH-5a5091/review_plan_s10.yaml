blindness:
  within_round: true
  lifted_for: []
  rationale: >
    Reviewers may not read each other's reports.
    Each attests to what it read. Composition
    reads both after they exist.
proves_too_much:
  objects:
    - >
      An argument that treats a factor-2 H3 miss
      on a frozen r=16 x-mod-16 walk as
      failed_infrastructure after fixture_pass is
      true. That conclusion is known false: the
      Stage 10 hard gate is fixture_pass.
    - >
      An argument that treats an H3 miss, or the
      short V-free cycles of this walk, as H1
      closure. That conclusion is known false on
      the Stage 0 through Stage 9 record: H3 is
      a declared heuristic, not H1.
    - >
      An argument that treats eight first-slice
      walks as the idea's 10^4-walk KS plan, or
      that treats Stage 10 as authorization of
      Stage 11. Those conclusions are known
      false: this slice locks 8 walks, and
      Stage 11 stays unauthorized.
  failure_signature: >
    The argument must refuse to read an H3
    factor-2 miss as failed_infrastructure,
    refuse to treat an H3 miss as H1 closure,
    refuse to treat eight walks as 10^4 KS,
    refuse to hunt a new cell from the short
    cycles, and refuse to authorize Stage 11.
  assigned_to: TASK-20260908-88dfce
