        instrument failure of the whole Stage 2 table.
        That conclusion is known false: a difference
        localizes to this implementation versus the
        S2G producer on one row.
    failure_signature: >-
      The argument must refuse to read a match or a
      difference as a W class or as a whole-table
      instrument failure.
    assigned_to: TASK-20260907-7f7db1

