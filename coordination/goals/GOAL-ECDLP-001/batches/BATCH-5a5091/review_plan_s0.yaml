review_plan:
  opened_by: TASK-20260908-fe893c
  batch_id: BATCH-5a5091
  recorded_at: '2026-09-08'
  recorded_before_reviewers: true
  recorded_before_producer_run: false
  does_not_rewrite:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2bd.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2tp.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2gx.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2mx.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2cx.yaml

  claim_under_review: >-
    Official Stage 0 instrument claim for
    RUN-ECDLP-420e73-S0 of EXP-ECDLP-420e73
    under DEC-20260908-11e3ec: status valid;
    fixture_pass true; certificate kind none;
    identity_pass true on the N-unit
    S=N^theta form from idea (B);
    planted recovers exact affine (a,b)=(3,7)
    on V={0..19} at N=8191;
    seed-20260908 matched-marginal shuffle
    recovers no exact affine; both gamma_power
    and gamma_linear are recorded as
    observations on both arms; SMALL_W_or_LARGE_W
    false; fit_of_a false; not_an_H1_claim true;
    not_a_curve_measurement true;
    a98ea9_stage5_authorized false;
    Stage 1 remains unauthorized. A recorded
    gamma is not H1 support and is not a
    0.9-threshold miss.

  coordinator_prior: >-
    Written after RUN-ECDLP-420e73-S0 exists
    and is snapshotted (TASK-20260908-e760d5)
    and before these reviewers run. The
    Coordinator expects the three instrument
    gates to hold: N-unit identity, planted
    (3,7), shuffle non-recovery. The
    Coordinator does not treat recorded
    gammas as H1 support or as a 0.9-threshold
    miss. The Coordinator does not authorize
    Stage 1. Occupancy and advice length are
    not a W class. PD-S0R1: same session
    produced the run and will execute the
    review attacks. independent_session is
    false.

  procedure_deviations:
    - id: PD-S0R1
      description: >-
        The Coordinator session that produced
        RUN-ECDLP-420e73-S0 is writing this
        prior after the snapshotted run exists
        and will also execute the review
        attacks. independent_session is
        recorded false.
    - id: PD-S0R2
      description: >-
        Reviewers are forbidden to run git log
        / git show. A --blind-history FAIL or
        UNCHECKABLE is not a pass.

  joints:
    - joint: instrument_gate
      assigned_to: TASK-20260908-fe893c
      attack_plan: >-
        From RUN-ECDLP-420e73-S0 raw-result.json
        and the Stage 0 execution report,
        confirm validity_status valid,
        fixture_pass true, certificate.kind
        none, identity_pass true on N-unit
        S=N^theta rows with relative error
        <= 1e-12 at theta in {1/3, 1/2, 1},
        planted recovers_exact_affine with
        (a_hat, b_hat)=(3, 7), and shuffle
        recovers_exact_affine is false.
        Confirm the producer does not classify
        W and does not claim H1.
      breaking_artifact: >-
        fixture miss, identity miss, wrong
        planted pair, shuffle exact affine,
        W-class reading, or H1 claim
    - joint: observation_not_disposition
      assigned_to: TASK-20260908-fe893c
      attack_plan: >-
        Proves-too-much. Holds only if
        SMALL_W_or_LARGE_W is false, fit_of_a
        is false, not_an_H1_claim is true,
        not_a_curve_measurement is true,
        a98ea9_stage5_authorized is false,
        recorded gammas are not read as H1
        support, gamma_power < 0.9 is not
        read as instrument failure, and
        H-ECDLP-77caa5, H-ECDLP-07c7c6, and
        H-ECDLP-2ade73 are not moved.
      breaking_artifact: >-
        any H1 reading, any 0.9-threshold
        instrument-failure reading, any
        SMALL-W/LARGE-W reading, Stage 1
        authorization, or fit of a
    - joint: blind_planted_affine_and_shuffle
      assigned_to: TASK-20260908-e82b10
      attack_plan: >-
        From the frozen fixture numbers
        only, recover the unique (a,b) on
        planted k_v=(3v+7) mod 8191 for
        V={0..19}, confirm the
        seed-20260908 shuffle admits no
        exact affine, and confirm N-unit
        identity_pass at three thetas.
        Must not read the Stage 0 producer
        or its raw result.
      breaking_artifact: >-
        wrong planted pair, shuffle exact
        affine, identity miss, or a
        producer-path read

  blindness:
    mutual: true
    lifted_for: []
    rationale: null

  proves_too_much:
    objects:
      - >-
        An argument that a recorded Stage 0
        gamma supports H1. That conclusion is
        known false: Stage 0 is a synthetic
        20-row table, not a curve.
      - >-
        An argument that gamma_power < 0.9 on
        the planted table is instrument
        failure. That conclusion is known
        false: DEC-20260908-11e3ec disclosed
        that the 0.9 threshold is a Stage 1+
        object and Stage 0 gates on exact
        affine recovery.
    failure_signature: >-
      The argument must refuse to read a
      Stage 0 gamma as H1 support or as a
      0.9-threshold instrument miss.
    assigned_to: TASK-20260908-fe893c

  blind_rederivation:
    required: true
    quantity: >-
      planted exact-affine pair (a,b) and
      shuffle recovers_exact_affine on the
      frozen Stage 0 fixture, plus N-unit
      identity_pass at theta in {1/3, 1/2, 1}.
    parameters: >-
      N=8191; D=20; V={0,1,...,19};
      planted k_v = (3*v+7) mod 8191;
      lambda = identity;
      shuffle = numpy default_rng(20260908)
      permutation of the planted k_v list;
      exact recovery means a unique (a,b) in
      0..N-1 satisfies k_v = a*v+b mod N for
      every v in V; identity uses N-unit
      S=N^theta, T=N^{1-theta},
      log_N(S*T^2)=2-theta, relative error
      <= 1e-12. Must not read the Stage 0
      producer or its raw result.
    blind_from:
      - experiments/EXP-ECDLP-420e73/implementation/stage0_planted_affine.py
      - experiments/EXP-ECDLP-420e73/runs/RUN-ECDLP-420e73-S0/raw-result.json
      - experiments/EXP-ECDLP-420e73/execution-report-s0.yaml
    assigned_to: TASK-20260908-e82b10
