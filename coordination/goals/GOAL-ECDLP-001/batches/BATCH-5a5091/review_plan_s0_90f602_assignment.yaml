# Additive assignment overlay for review_plan_s0_90f602.
# Does not rewrite the frozen plan. Maps pending_validator and
# pending_blind to the tasks that filed attestations, and supplies
# the checker field names (attack_plan, proves_too_much.objects,
# blind_rederivation.required) that the frozen plan recorded under
# attack / object / the blind joint.
review_plan:
  id: review_plan_s0_90f602
  assignment_overlay_of: coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s0_90f602.yaml
  frozen_plan_unrewritten: true
  goal: GOAL-ECDLP-001
  batch: BATCH-5a5091
  experiment: EXP-ECDLP-90f602
  run: RUN-ECDLP-90f602-S0
  hypothesis: H-ECDLP-4afa77
  recorded_at: '2026-09-08T12:30:00Z'
  assigned_at: '2026-09-08T13:00:00Z'
  recorded_by: coordinator
  recorded_after: TASK-20260908-1d5b95
  recorded_commit: e7e710951
  recorded_before_reviewers: true
  does_not_rewrite:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s0_90f602.yaml

  claim_under_review: >
    Official Stage 0 instrument claim for
    RUN-ECDLP-90f602-S0 of EXP-ECDLP-90f602
    under DEC-20260908-e47501: status valid;
    fixture_pass true; translate_share_pass
    true; reflection_share_pass true;
    pair_homometric_pass true;
    phase_sep_pass true;
    reject_invalid_pass true; certificate
    kind none. Frozen object is
    P-S0-TRIPLECORR. Groups Z/13 and Z/17.
    Reflection share is C2 identity plus
    C3 covariance under offset negation.
    Stage 1 of this experiment remains
    unauthorized.

  coordinator_prior: >
    Written after snapshot TASK-20260908-1d5b95
    and before these reviewers run. The
    Coordinator expects all six Stage 0
    gates true and certificate kind none.
    The Coordinator expects C3 of a
    reflection to be compared after
    (a,b) |-> (-a,-b), not as a literal
    vector on the same S. The Coordinator
    does not treat Stage 0 as a decoder
    or as authorization of Stage 1.
    PD-C5113D-S0R1: same session produced
    the run and will execute the review
    attacks. independent_session is false.

  procedure_deviations:
    - id: PD-C5113D-S0R1
      what: same session produced the run and will execute the review attacks
      independent_session: false

  joints:
    - joint: instrument_gate
      assigned_to: TASK-20260908-73caff
      plan_slot: pending_validator
      attack_plan: >
        Recompute fixture well-formedness,
        translate maps, invalid rejection,
        C2 equality on translates and on
        the frozen homometric pairs, and
        C3 inequality on those pairs from
        the frozen lists. Confirm the six
        gates and certificate kind none.
    - joint: observation_not_disposition
      assigned_to: TASK-20260908-73caff
      plan_slot: pending_validator
      attack_plan: >
        Confirm the run does not authorize
        Stage 1, does not hunt a new
        subset, and does not decode a
        scalar.
    - joint: blind_rederivation
      assigned_to: TASK-20260908-25572c
      plan_slot: pending_blind
      attack_plan: >
        From the frozen subset lists and
        offset sets alone, recompute C2
        and C3 and the six gates without
        importing the producer.

  blindness:
    mutual: true
    within_round: true
    lifted_for: []
    rationale: >
      Reviewers may not read each other's reports.
      Each attests to what it read. Composition
      reads both after they exist.

  proves_too_much:
    objects:
      - >
        F13-A-T, the translate of F13-A by 3.
        A translation-invariant certificate
        that separates F13-A from F13-A-T
        is a known-false conclusion.
    failure_signature: >
      translate_share_pass remains true.
      The instrument must share C2 and C3
      on the translate, not separate it.
    assigned_to: TASK-20260908-73caff

  blind_rederivation:
    required: true
    quantity: >
      C2 and C3 of the frozen Z/13 and Z/17
      subsets, the six Stage 0 gates, and
      rejection of the two invalid objects.
    assigned_to: TASK-20260908-25572c
    blind_from:
      - experiments/EXP-ECDLP-90f602/implementation/stage0_triplecorr.py
      - experiments/EXP-ECDLP-90f602/runs/RUN-ECDLP-90f602-S0/raw-result.json
      - experiments/EXP-ECDLP-90f602/execution-report-s0.yaml
    method: >
      Recompute from the frozen subset lists
      and offset sets alone. Do not import
      the producer. Workspace root from this
      review path is Path(__file__).resolve().parents[7].
