  claim_under_review: >-
    Official Stage 1 instrument claim for
    RUN-ECDLP-420e73-S1 of EXP-ECDLP-420e73
    under DEC-20260908-c2303f: status valid;
    fixture_pass true; certificate kind none;
    T2 linearized_formal_log recovers an
    exact affine; NULL-1 identity recovers
    no exact affine; both gammas are
    observations; SMALL_W_or_LARGE_W false;
