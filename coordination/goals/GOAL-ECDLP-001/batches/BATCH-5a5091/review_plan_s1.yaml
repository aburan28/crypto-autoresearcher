  coordinator_prior: >-
    Written after RUN-ECDLP-420e73-S1 exists
    and is snapshotted (TASK-20260908-5e8658)
    and before these reviewers run. The
    Coordinator expects the two instrument
    gates to hold: T2 formal-log exact
    affine, NULL-1 identity non-recovery.
    The Coordinator does not treat recorded
    gammas as H1 support or as a 0.9-threshold
    miss. The Coordinator does not authorize
    Stage 2. Occupancy and advice length are
    not a W class. PD-S1R1: same session
    produced the run and will execute the
    review attacks. independent_session is
    false.

  procedure_deviations:
    - id: PD-S1R1
      description: >-
        The Coordinator session that produced
        RUN-ECDLP-420e73-S1 is writing this
        prior after the snapshotted run exists
        and will also execute the review
        attacks. independent_session is
        recorded false.
    - id: PD-S1R2
      description: >-
        Reviewers are forbidden to run git log
        / git show. A --blind-history FAIL or
        UNCHECKABLE is not a pass.

  joints:
    - joint: instrument_gate
      assigned_to: TASK-20260908-821ddf
      attack_plan: >-
        From RUN-ECDLP-420e73-S1 raw-result.json
        and the Stage 1 execution report,
        confirm validity_status valid,
        fixture_pass true, certificate.kind
        none, T2 linearized_formal_log
        recovers_exact_affine true, and
        NULL-1 identity recovers_exact_affine
        false. Confirm the producer does not
        classify W and does not claim H1.
      breaking_artifact: >-
        fixture miss, T2 formal-log miss,
        NULL-1 identity exact affine,
        W-class reading, or H1 claim
    - joint: observation_not_disposition
      assigned_to: TASK-20260908-821ddf
      attack_plan: >-
        Proves-too-much. Holds only if
        SMALL_W_or_LARGE_W is false, fit_of_a
        is false, not_an_H1_claim is true,
        a98ea9_stage5_authorized is false,
        recorded gammas are not read as H1
        support, gamma_power < 0.9 is not
        read as instrument failure, Stage 2
        is not authorized, and H-ECDLP-77caa5,
        H-ECDLP-07c7c6, and H-ECDLP-2ade73
        are not moved.
      breaking_artifact: >-
        any H1 reading, any 0.9-threshold
        instrument-failure reading, any
        SMALL-W/LARGE-W reading, Stage 2
        authorization, or fit of a
    - joint: blind_t2_formal_log_and_null1_identity
      assigned_to: TASK-20260908-c1e1ab
      attack_plan: >-
        From the frozen v1_stage1_protocol
        cells only, recompute T2 [k]P for
        k=1..20, apply the protocol formal-log
        lambda (Hensel y, [p]R~ projective,
        t=-X Y^{-1} mod p^2, s=t//p), recover
        the unique affine on (s,k) mod 523,
        and confirm NULL-1 identity on
        (V,k=1..20) mod 503 is not exact.
        Must not read the Stage 1 producer
        or its raw result.
      breaking_artifact: >-
        T2 formal-log non-recovery, NULL-1
        identity exact affine, or a
        producer-path read

  blindness:
    mutual: true
    lifted_for: []
    rationale: null

  proves_too_much:
    objects:
      - >-
        An argument that a recorded Stage 1
        gamma supports H1. That conclusion is
        known false: Stage 1 is one toy
        anomalous curve, not an ordinary
        H1 ladder.
      - >-
        An argument that gamma_power < 0.9 on
        T2 is instrument failure. That
        conclusion is known false:
        v1_stage1_protocol disclosed that
        the 0.9 threshold is not a Stage 1
        gate at D=20.
    failure_signature: >-
      The argument must refuse to read a
      Stage 1 gamma as H1 support or as a
      0.9-threshold instrument miss.
    assigned_to: TASK-20260908-821ddf

  blind_rederivation:
    required: true
    quantity: >-
      T2 linearized_formal_log exact-affine
      pair (a,b) and NULL-1 identity
      recovers_exact_affine on the frozen
      Stage 1 cells.
    parameters: >-
      T2: p=523, curve y^2=x^3+2x+6, N=523,
      P=(0,23), V=x([k]P) for k=1..20 as
      frozen in v1_stage1_protocol.
      NULL-1: p=523, curve y^2=x^3+3x+3,
      N=503, P=(1,141), V as frozen.
      Formal-log lambda: Hensel-lift y to
      Z/p^2, [p]R~ projective, t=-X Y^{-1}
      mod p^2, require t==0 mod p,
      s=(t//p) mod p. Exact recovery means
      a unique (a,b) in 0..N-1 satisfies
      k = a*lambda+b mod N on all D rows.
      Must not read the Stage 1 producer
      or its raw result.
    blind_from:
      - experiments/EXP-ECDLP-420e73/implementation/stage1_anomalous_affine.py
      - experiments/EXP-ECDLP-420e73/runs/RUN-ECDLP-420e73-S1/raw-result.json
      - experiments/EXP-ECDLP-420e73/execution-report-s1.yaml
    assigned_to: TASK-20260908-c1e1ab
