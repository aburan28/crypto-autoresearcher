        Path(__file__).resolve().parents[7].
        Do not construct a Frobenius. Do not
        treat a residue as a gate.
      breaking_artifact: >
        A discriminant miss, a 2P or 3P miss,
        an l(D) other than 2, a producer-path
        read, a Frobenius claim, or a residue
        used as a gate would break the blind
