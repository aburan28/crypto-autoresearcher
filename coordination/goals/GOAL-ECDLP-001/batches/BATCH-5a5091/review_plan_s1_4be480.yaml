  blindness:
    mutual: true
    lifted_for: []
    rationale: >
      Reviewers may not read each other's reports.
      Each attests to what it read. Composition
      reads both after they exist.

  proves_too_much:
    objects:
      - >
        An argument that Stage 1 constructs a
        marked Frobenius or runs Kedlaya. That
        conclusion is known false: Stage 1 is
        explicit L(D) bases.
      - >
        An argument that l(D)=2 authorizes
        Stage 2 of this experiment, Stage 2 of
        EXP-ECDLP-6a97f4, or Stage 17 of
        EXP-ECDLP-420e73. Those conclusions
        are known false.
      - >
        An argument that a residue difference
        is a Stage 1 gate, a Frobenius, or a
        P-S1-DIGIT result. Those conclusions
        are known false.
      - >
        An argument that Stage 1 supports H1
        or classifies W. Those conclusions are
        known false: Stage 1 is a toy L(D)
        instrument, not a solver.
    failure_signature: >
      The argument must refuse to read Stage 1
      as a Frobenius, as Kedlaya, as
      Serre-Tate, as P-S1-DIGIT, as
      P-S1-RELATIVE, as a residue gate, as
      Stage 2/17 authorization, as H1, or as
      a W class.
    assigned_to: TASK-20260908-46455e

  blind_rederivation:
    required: true
    quantity: >
      Discriminant of y^2=x^3+x+1, the point
      2*(0,1), the group-law sum 3P=P+2P, the
      chord slope through P and 2P, l(D) and
      Q-linear independence of the frozen
      L(D) bases on D1, D2, and D1-scaled,
      and rejection of repeated marks.
    parameters: >
      A=1, B=1 over Q. D1={(0,1),(0,-1)}.
      D2 second point is 2*(0,1) under the
      Weierstrass group law. 3P is P+2P.
      L(D1)=<1, 1/x>. L(D2)=<1,
      (x-x_3P)/(y-1+(17/2)x)>. Scaling u=2:
      (A,B,x,y) -> (u^4 A, u^6 B, u^2 x, u^3 y)
      with L(D1-scaled)=<1, 1/x>. Must not
      read the Stage 1 producer or its raw
      result. A residue is not this quantity.
    assigned_to: TASK-20260908-a0d3aa
    blind_from:
      - experiments/EXP-ECDLP-4be480/implementation/stage1_ldiv.py
      - experiments/EXP-ECDLP-4be480/runs/RUN-ECDLP-4be480-S1/raw-result.json
      - experiments/EXP-ECDLP-4be480/execution-report-s1.yaml
    method: >
      Independent Weierstrass arithmetic over Q
      and the frozen L(D) bases from the
      frozen fixture numbers in this plan. Do
      not import the Stage 1 producer. Do not
      construct a Frobenius. Do not treat a
      residue as a gate.
