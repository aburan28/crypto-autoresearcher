        SMALL_W_or_LARGE_W false, fit_of_a
        false, not_an_H1_claim true,
        not_a_frobenius true, and frozen_object
        P-S1-LDIV.
      breaking_artifact: >
        A Frobenius claim, a Kedlaya claim, a
        canonicality claim, a P-S1-DIGIT or
        P-S1-RELATIVE disposition, an H1
        reading, a W class, Stage 2/17
        authorization, or a hypothesis status
        move would break the
        observation-not-disposition joint.
    - joint: blind_ldiv
      assigned_to: TASK-20260908-a0d3aa
      attack_plan: >
        From the frozen fixture numbers only
        (A=1, B=1, D1={(0,1),(0,-1)}, D2
        second point = 2*(0,1), scaling u=2,
        L(D1) and L(D1-scaled) spanned by
