  canonicalization:
    manifest_media_type: "application/json"
    canonical_form: "RFC 8785 JCS"
    integer_rule: >-
      Seeds, counters, field moduli, coefficients before reduction, ordinals,
      nanosecond values, byte counts, and rational numerators/denominators are
      lowercase base-10 strings with no sign unless the field explicitly
      allows signed source coefficients. JCS numbers are not used for these
      values.
    digest_rule: "sha256(JCS(document_without_its_own_digest_field))"
    digest_encoding: "64 lowercase hexadecimal characters"
    domain_separation:
      schedule: "rank-failure-schedule-v1\\u0000"
      schema: "rank-row-schema-v1\\u0000"
      row: "rank-row-v1\\u0000"
      equation: "rank-equation-v1\\u0000"
      receipt_set: "rank-failure-receipts-v1\\u0000"

  preexecution_schedule:
    required_root_fields:
      - "contract_schema"
      - "contract_version"
      - "campaign_id"
      - "public_fixture"
      - "field"
      - "column_schema"
      - "canonical_row_format"
      - "terminal_vocabulary"
      - "resource_schema"
      - "probability_plan"
      - "attempts"
      - "initial_matrix"
      - "precommit"
    public_fixture:
      required:
        - "fixture_id"
        - "fixture_version"
        - "curve_or_group_parameters"
        - "subgroup_order"
        - "factor_base_points"
        - "fixture_sha256"
      rule: >-
        Only a public toy fixture is permitted. Its complete bytes and point
        encoding are hash-bound. The verifier independently checks group
        parameters, point membership, and subgroup membership.
    attempts:
      ordering: "ascending ordinal, then bytewise ascending attempt_id"
      required_per_attempt:
        - "attempt_id"
        - "ordinal"
        - "seed_256_hex"
        - "fixture_sha256"
        - "worker_slot"
        - "stage_id"
        - "budget"
        - "retry_parent_id"
        - "activation_terminal_codes"
        - "statistical_stratum_id"
        - "probability_cohort_member"
      identity_rules:
        - "attempt_id values are unique nonempty ASCII strings"
        - "ordinal values are unique and contiguous from zero"
        - "seed_256_hex is exactly 64 lowercase hexadecimal characters"
        - "every retry parent is null or names an earlier ordinal"
        - "every non-root has exactly one retry parent"
        - "roots have retry_parent_id null and an empty activation list"
        - "the retry graph is a directed acyclic rooted forest"
        - "all possible retries are listed before execution"
        - "no attempt or retry may be appended after the precommit seal"
      activation_rule: >-
        A root is activated. A non-root is activated exactly when its parent
        receipt's terminal_code belongs to its frozen
        activation_terminal_codes. Every unactivated node still receives one
        NOT_ACTIVATED receipt, with zero attempt-owned counters.
    precommit:
      required:
        - "schedule_sha256"
        - "schedule_path"
        - "coordinator_snapshot_receipt_path"
        - "snapshot_commit_sha"
        - "snapshot_parent_sha"
        - "verified_before_execution"
      ordering_gate: >-
        The Coordinator's snapshot verifier must accept the exact schedule
        bytes and commit before any attempt is activated. Every receipt repeats
        schedule_sha256. Timestamps are corroborating metadata, not the trust
        root. A missing, changed, or post-execution seal invalidates the
        campaign certificate.

  terminal_vocabulary:
    version: "rank-failure-terminal-v1"
    codes:
      RELATION_VALID:
        lifecycle_status: "completed_valid"
        meaning: "a candidate relation passed independent group and row verification"
      RELATION_INVALID:
        lifecycle_status: "completed_invalid"
        meaning: "a candidate relation or its row binding failed independent verification"
      NO_RELATION_WITHIN_BUDGET:
        lifecycle_status: "completed_valid"
        meaning: "the activated attempt ended without a relation inside its frozen budget"
      INFRASTRUCTURE_FAILURE:
        lifecycle_status: "failed_infrastructure"
        meaning: "the environment failed; this is not mathematical evidence"
      IMPLEMENTATION_FAILURE:
        lifecycle_status: "failed_implementation"
        meaning: "the implementation failed; this is not mathematical evidence"
      RESOURCE_EXHAUSTION:
        lifecycle_status: "resource_exhaustion"
        meaning: "a frozen non-time resource cap was reached"
      BUDGET_CANCELLATION:
        lifecycle_status: "cancelled_by_budget"
        meaning: "the Coordinator's frozen campaign budget cancelled the attempt"
      TIMEOUT_CENSORED:
        lifecycle_status: "cancelled_by_budget"
        meaning: "the frozen wall cap was reached; latent completion time is unobserved"
      NOT_ACTIVATED:
        lifecycle_status: null
        meaning: "a precommitted retry activation predicate evaluated false"
    exhaustive: true
    extension_rule: "A new code requires a versioned contract and a new schedule seal."

  field_and_row_schema:
    field:
      kind: "prime_field"
      required:
        - "modulus_decimal"
        - "modulus_primality_method"
        - "subgroup_order_binding"
      validity: >-
        Parse modulus_decimal as an integer ell. Require ell prime, ell equal
        to the public fixture's declared subgroup order, and every named point
        to satisfy ell*P = identity. Otherwise FIELD_MISMATCH.
    columns:
      required_per_column:
        - "column_id"
        - "point_encoding_hex"
        - "point_sha256"
      rules:
        - "column IDs are unique ASCII strings"
        - "the ordered column array is the matrix order"
        - "point encodings are canonical under the fixture"
        - "the schema digest binds fixture hash, field, order, IDs, and points"
    relation_certificate:
      kind: "decomposition"
      statement: "target_column_point = sum of summand_column_points"
      required:
        - "fixture_sha256"
        - "curve_parameters"
        - "target_column_id"
        - "target_point_encoding"
        - "summand_column_ids"
        - "summand_point_encodings"
        - "statement_sha256"
        - "producer_certificate_sha256"
      independent_checks:
        - "reparse the public fixture without using producer solver state"
        - "apply the current decomposition verifier to curve, target, and summand points"
        - "check every referenced column and canonical point encoding"
        - "recompute the group sum and compare with the target point"
        - "derive coefficients independently from target and summand IDs"
      derived_coefficients: >-
        For each ordered column j, a_j is the number of appearances of j among
        summand_column_ids minus one when j equals target_column_id, reduced to
        the unique integer in [0, ell-1].
    canonical_row:
      coefficient_width_bytes: "ceil(bit_length(ell-1)/8)"
      bytes: >-
        Concatenate each derived coefficient in frozen column order as exactly
        coefficient_width_bytes unsigned big-endian bytes.
      row_hash: >-
        sha256(UTF8("rank-row-v1\\u0000") || raw_schema_sha256_bytes ||
        canonical_row_bytes)
      equation_hash: >-
        sha256(UTF8("rank-equation-v1\\u0000") || raw_schema_sha256_bytes ||
        raw_statement_sha256_bytes || canonical_row_bytes)
      zero_row_rule: "A verified zero row is dependent and gains zero rank."

  terminal_receipt:
    required_fields:
      - "receipt_schema"
      - "receipt_version"
      - "campaign_id"
      - "schedule_sha256"
      - "attempt_id"
      - "ordinal"
      - "seed_256_hex"
      - "retry_parent_id"
      - "activated"
      - "terminal_code"
      - "started_monotonic_ns"
      - "finished_monotonic_ns"
      - "resource_vector"
      - "relation"
      - "producer_artifact_hashes"
    immutable_rule: "One JCS receipt object per schedule node; corrections create a superseding campaign."
    echo_rule: >-
      campaign, schedule, attempt, ordinal, seed, retry parent, fixture, worker,
      stage, budget, and schema values must equal the sealed schedule.
    not_activated_rule: >-
      terminal_code is NOT_ACTIVATED, activated is false, relation is absent,
      and every attempt-owned additive counter is zero. Campaign verifier work
      is charged separately to the verification stage.
    relation_block:
      required_when_present:
        - "certificate"
        - "certificate_sha256"
        - "declared_row_sha256"
        - "declared_equation_sha256"
        - "independent_verifier_id"
        - "independent_verifier_version"
        - "independent_verifier_artifact_sha256"
        - "certificate_verified"
        - "independently_derived_row_sha256"
        - "independently_derived_equation_sha256"
      mismatch_rule: >-
        Any certificate failure, field/schema mismatch, or mismatch between a
        declared and independently derived row/equation forces
        RELATION_INVALID and zero rank credit while retaining all resources.

  schedule_receipt_bijection:
    set_identity: "set(schedule.attempt_id) = set(receipt.attempt_id)"
    cardinality_identity: "count(schedule.attempts) = count(receipts)"
    multiplicity: "each schedule attempt_id and receipt attempt_id occurs exactly once"
    verification_order:
      - "validate schedule canonicalization and preexecution seal"
      - "reject duplicate schedule IDs or ordinals"
      - "reject retry cycles, forward parents, or undeclared parents"
      - "validate receipt canonicalization and receipt-set digest"
      - "reject missing, extra, or duplicate receipt IDs"
      - "validate every schedule/receipt echoed field"
      - "recompute every activation predicate in ordinal order"
      - "validate terminal-code consistency and all resource ownership"
    failure_effect: >-
      Any bijection or retry-graph failure invalidates the campaign-level
      conservation certificate. Existing receipts remain preserved and no
      omitted attempt is imputed a mathematical result.

  independent_rank_verification:
    initial_matrix:
      required:
        - "row_count"
        - "canonical_rows_sha256"
        - "rank"
        - "field_schema_sha256"
        - "column_schema_sha256"
      rule: "The verifier reparses and recomputes the initial exact rank."
    insertion_order: "ascending schedule ordinal"
    candidate_eligibility: >-
      Only RELATION_VALID receipts with a matching independently derived row
      are eligible. Every other terminal code has rank_increment zero.
    algorithm_requirement: >-
      Recompute exact Gaussian elimination over the declared prime field using
      an implementation independent of the producer's rank path.
    per_attempt_output:
      - "rank_before"
      - "rank_after"
      - "rank_increment"
      - "row_disposition"
    row_dispositions:
      - "independent"
      - "exact_duplicate"
      - "dependent_nonduplicate"
      - "invalid_or_absent"
    identities:
      - "rank_increment is rank_after-rank_before and belongs to {0,1}"
      - "independent iff rank_increment=1"
      - "exact_duplicate iff row hash appeared earlier and rank_increment=0"
      - "dependent_nonduplicate iff valid, not an exact duplicate, and rank_increment=0"
      - "final_rank = initial_rank + sum(rank_increment over all schedule ordinals)"
      - "R_gain = final_rank - initial_rank"
    zero_gain_cost_rule: "resource_per_rank is componentwise infinity when R_gain=0"

  resource_vector:
    version: "rank-failure-resource-v1"
    no_scalarization: true
    additive_coordinates:
      - "cpu_time_ns"
      - "group_operations_by_declared_type"
      - "io_read_bytes"
      - "io_write_bytes"
      - "communication_sent_bytes"
      - "communication_received_bytes"
    nonadditive_coordinates:
      - "campaign_elapsed_wall_ns"
      - "active_wall_union_ns"
      - "peak_memory_bytes_by_domain"
      - "campaign_peak_observed_bytes"
      - "retained_unique_bytes"
    attempt_resource_required:
      - "counter_source"
      - "counter_coverage"
      - "cpu_time_ns"
      - "wall_interval_monotonic_ns"
      - "group_operations_by_declared_type"
      - "io_read_bytes"
      - "io_write_bytes"
      - "communication_sent_bytes"
      - "communication_received_bytes"
      - "memory_domain_id"
      - "peak_memory_bytes"
      - "retained_object_sha256"
      - "exclusive_work_ids"
      - "shared_work_ids"
    ownership_registry:
      exclusive_rule: "Every exclusive work_id has exactly one owner attempt or named campaign stage."
      shared_rule: >-
        Every shared_work_id occurs exactly once in the campaign shared-work
        registry, has one measured vector, and lists rational attribution
        weights whose nonnegative numerators/denominators sum exactly to one.
        Receipt references do not add the shared vector again.
      unowned_or_duplicate_rule: "Any work_id with zero or multiple registry owners invalidates resource conservation."
      retained_rule: >-
        Each retained object is keyed by content SHA-256, has one byte size and
        one owner; retained_unique_bytes is the sum over unique object hashes.
    aggregation:
      cpu_and_counters: "coordinatewise sum of exclusive vectors plus each shared vector exactly once"
      wall_elapsed: "max(finished)-min(started) over activated work on the campaign monotonic clock"
      active_wall_union: "Lebesgue length in integer nanoseconds of the union of activated work intervals"
      peak_memory: >-
        Preserve each memory-domain peak and a separately observed campaign
        peak. Never sum peaks. A missing campaign monitor is declared missing,
        not reconstructed from per-process peaks.
      retained_bytes: "sum unique retained object sizes; never sum repeated references"
      audit_overhead: "receipt creation and independent verification are named stages and are included"
    required_stages:
      - "setup"
      - "relation_collection"
      - "linear_algebra"
      - "descent"
      - "verification"
    comparison_rule: >-
      No cross-unit sum is permitted. A comparison is allowed only under one
      predeclared coordinatewise dominance rule with identical counter
      conventions and resource coverage, plus separately declared wall and
      memory caps. Otherwise the campaigns are incomparable.

  probability_gate:
    version: "rank-yield-tail-v1"
    purpose: >-
      Bound a finite count of unconditional attempts for r verified
      incremental-rank successes. This is not a lower bound on required work.
    success_indicator: >-
      Y=1 exactly when a probability-cohort root receipt is RELATION_VALID and
      its independently recomputed rank_increment is one; otherwise Y=0.
    allowed_model: "prespecified_stratified_fixed_iid"
    assumptions:
      - "Strata are fixed from schedule metadata before execution."
      - "Every probability-cohort attempt is an unconditional root; retries and outcome-triggered attempts are excluded."
      - "Within each stratum, Y values are mutually independent Bernoulli trials with one fixed unknown p_s."
      - "Calibration observations are disjoint from and completed before the sealed evaluation schedule."
      - "Calibration stopping, seed selection, exclusions, and stratum definitions are fixed before observing calibration outcomes."
      - "Across-stratum independence is not needed because alpha is combined by a union bound."
      - "No sequential, exchangeability-only, or adaptive-rank model is asserted by version 1."
      - "If rank state or source adaptation makes within-stratum IID indefensible, the finite tail gate is invalid and no probability completion claim is made."
    required_per_stratum:
      - "stratum_id"
      - "static_membership_rule"
      - "calibration_manifest_sha256"
      - "calibration_trials_m"
      - "calibration_successes_x"
      - "alpha_estimation"
      - "declared_p_lower"
      - "required_rank_units_r"
      - "alpha_tail"
      - "scheduled_unconditional_attempts_n"
    lower_bound:
      method: "one-sided Clopper-Pearson"
      definition: >-
        If x=0 set p_L=0. If x>0, the mathematical lower endpoint is
        BetaInverse(alpha_estimation; x, m-x+1).
      serialization_rule: >-
        declared_p_lower is a finite decimal parsed as an exact rational. An
        independent verifier uses directed interval arithmetic and requires
        declared_p_lower no greater than the certified lower endpoint.
    tail_rule:
      formula: "sum_{k=r}^{n} binom(n,k) * p_L^k * (1-p_L)^(n-k) >= 1-alpha_tail"
      negative_binomial_equivalent: "Pr[N_r <= n] >= 1-alpha_tail"
      exactness: "Evaluate the finite sum as exact rational arithmetic using serialized p_L and alpha_tail."
      minimum_budget: "n_star is the least integer n>=r satisfying the formula."
      edge_cases:
        - "r=0 implies n_star=0"
        - "r>0 and p_L=0 implies n_star=infinity"
        - "scheduled n below n_star fails the gate"
    familywise_miss_bound: >-
      alpha_total is the exact rational sum over all strata of
      alpha_estimation_s + alpha_tail_s. It must not exceed the schedule's
      declared alpha_campaign. This uses a union bound, not an independence
      claim across strata.
    forbidden_replacement: >-
      ceil(r/p_L) is neither emitted nor interpreted as a lower bound or a
      finite-budget completion guarantee.

  planted_controls:
    - id: "CTRL-OMISSION"
      mutation: "remove one receipt for a sealed schedule ID"
      expected_verdict: "BIJECTION_MISSING_RECEIPT"
    - id: "CTRL-DUPLICATE-ID"
      mutation: "repeat one attempt ID in schedule or receipts"
      expected_verdict: "BIJECTION_DUPLICATE_ID"
    - id: "CTRL-RETRY-CYCLE"
      mutation: "make two retry nodes parents of each other"
      expected_verdict: "SCHEDULE_RETRY_CYCLE"
    - id: "CTRL-FIELD-SCHEMA"
      mutation: "change field modulus, column order, or schema digest in one receipt"
      expected_verdict: "FIELD_OR_SCHEMA_MISMATCH"
    - id: "CTRL-SHARED-DOUBLE"
      mutation: "assign one shared work ID as measured work to two owners"
      expected_verdict: "SHARED_WORK_DOUBLE_COUNT"
    - id: "CTRL-SHARED-OMITTED"
      mutation: "reference shared work with no registry owner"
      expected_verdict: "SHARED_WORK_UNOWNED"
    - id: "CTRL-CERTIFICATE-ROW"
      mutation: "use a valid group certificate with a declared row from different summands"
      expected_verdict: "CERTIFICATE_ROW_MISMATCH_AND_ZERO_RANK"
    - id: "CTRL-WRONG-FIELD"
      mutation: "compute producer incremental rank over a different prime field"
      expected_verdict: "INDEPENDENT_RANK_MISMATCH"
    - id: "CTRL-CLEAN"
      mutation: "none"
      expected_verdict: "PASS_ONLY_IF_ALL_CONSERVATION_GATES_PASS"

