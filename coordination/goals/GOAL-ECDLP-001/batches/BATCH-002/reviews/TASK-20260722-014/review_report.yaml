  technique_assessment:
    local_label: frontier-B
    name: Rank-and-failure conservation cost certificate
    schedule_completeness:
      verdict: PASS
      finding: >-
        Completeness is defined only against a hash-bound pre-execution
        schedule with finite retry forest, NOT_ACTIVATED receipts for
        inactive retries, and set/cardinality/multiplicity bijection checks.
        Generated IDs alone are correctly rejected as insufficient.
    rank_semantics:
      verdict: PASS
      finding: >-
        Incremental rank is recomputed independently over the sealed prime
        field; Delta in {0,1}; R_gain telescopes; only RELATION_VALID with
        matching independently derived row earns rank; zero-gain resource-per-
        rank is undefined/infinite rather than a fabricated finite scalar.
    probability_gate:
      verdict: PASS
      finding: >-
        ceil(r/p_L) is forbidden. The declared gate is the least n>=r with
        Binomial(n,p_L) survival >= 1-alpha_tail (NB equivalent), with
        Clopper-Pearson lower endpoint serialized by directed-rounding
        conservatism, stratified fixed-IID assumptions explicit, retries
        excluded from the cohort, and state-dependent yield named as a scoped
        invalidation of the finite tail claim rather than a silent guarantee.
      recomputation_note: >-
        Under fixed IID Bernoulli p>=p_L>0, E[N_r]=r/p <= r/p_L, so r/p_L is an
        upper bound on conditional expected trials, not a lower bound. The
        contract's binomial/NB tail formula is the correct finite-budget
        construction for declared alpha_tail. No concrete numeric (p_L,r,alpha)
        instance is sealed in this theory package; the formula check is
        symbolic.
      residual_risk: >-
        Within-stratum IID for rank-increment indicators may fail under
        adaptive sources or strong rank-state dependence. The contract
        correctly withholds the finite completion claim in that case; a later
        protocol must either defend the stratum model or drop the probability
        subgate.
    resource_ownership:
      verdict: PASS
      finding: >-
        Unlike units remain a vector with no_scalarization. Exclusive and
        shared work registries, rational attribution summing to one, union
        wall measure, non-summed peaks, and unique retained-byte hashing are
        specified. Required stages include setup through verification plus
        audit overhead.
    controls:
      verdict: PASS
      finding: >-
        All required planted mutations have decisive expected verdicts
        (omission, duplicate ID, retry cycle, field/schema, shared double/
        unowned, certificate/row mismatch, wrong-field rank, clean).
    novelty:
      verdict: PASS_SCOPED
      finding: >-
        Local novelty is a machine-checkable join from sealed schedule through
        receipts, rows, rank, and resource vectors. External provenance and
        NB/binomial semantics are established patterns; no new cryptanalytic
        mechanism is claimed.
    claim_boundary:
      verdict: PASS
      finding: >-
        Maximum tier remains toy conservation under frozen schema and accepted
        probability assumptions. Attack improvement, ECDLP lower bounds,
        crypto-scale conclusions, breakthroughs, and universal impossibility
        are prohibited.

