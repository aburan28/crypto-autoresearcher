batch:
  id: BATCH-20260807-1e897d
  goal_id: GOAL-ECDLP-001
  question_ids:
    - RQ-ECDLP-002
  title: Multi-target BKK experiment: EXP-MTARGET-20260807-1e897d
  objective: >-
    Implement and execute EXP-MTARGET-20260807-1e897d for multi-target BKK analysis
    with the following design:
    
    Design: For |F|^q targets, find P such that O_D([2^i]P) = y_i for all i in 0..r-1
    given oracle access to O_D([2^{-1}]Q) = x(Q). Use the |F|^{r-1}x^{r-1}
    polynomial system with q^{r-1} solutions per coefficient.
    
    Parameters: p=103, |F|=q=32, r=2, q_targets=64
    Expected BFK runtime: O(p^(3*r-2+eps)) = O(2^28.4) ~ 284 days on one core
    Target: ~2% of 56 days for single-target BKK
    
    Algorithm: For each of 80 (config, runs) combinations, perform:
    - Build the |F|^{r-1}x^{r-1} system from q^{r-1} solutions
    - Solve using meet-in-the-middle with size |F|^m
    - Aggregate across |F|^q targets
    - Track runtime, memory, and success rate
    
    Deliverables:
    - Full run directory: experiments/EXP-MTARGET-20260807-1e897d/
    - Implementation: experiments/EXP-MTARGET-20260807-1e897d/implementation.py
    - Results: experiments/EXP-MTARGET-20260807-1e897d/run-*/results/
    - Evidence: experiments/EXP-MTARGET-20260807-1e897d/run-*/run.json
    - Evidence record: EV-MTARGET-20260807-1e897d
    - Experiment report: coordination/goals/GOAL-ECDLP-001/batches/20260807-1e897d/evidence_report.md
  status: ready_for_dispatch
  claim_ceiling: run_to_analysis
  budget:
    source: GOAL-ECDLP-001.campaign_budget
    campaign_maximum_batches: 50
    campaign_total_wall_clock_seconds: 28800
    campaign_max_concurrent: 2
    this_batch_wall_clock_seconds_ceiling: 3600
    this_batch_task_budget_sum_seconds: 11700
    budget_note: |
      This is an executor batch (implementation + run). At most 2 concurrent
      runs. The budget covers the executor implementation and up to 2 runs.
      If runs exceed the wall_clock limit, the batch terminates early.
      No validator or red-team pass is required since this is new content.
    executor_time_seconds: 14400
    maximum_runs: 1
    memory_gb: 16
  max_concurrent: 2
  producer_task_ids: []
  snapshot_archive_task_ids: []  # Coordinator snapshots only
  review_task_ids: []  # No review for new executor content
  ledger_archive_task_ids: []  # Coordinator ledger archive only
  archive_claim_map: {}
  reserved_record_ids:
    evidence: EV-MTARGET-20260807-1e897d
  baseline_context:
    - RQ-ECDLP-002
    - GOAL-ECDLP-001
    - RQ-ECDLP-002
  dedup_reads:
    - experiments/EXP-SEMAEV-f48dd1/implementation.py
    - experiments/EXP-SEMAEV-f48dd1/run-0/results/run.json
  next_action: >-
    Run the 80 config-run combinations for EXP-MTARGET-20260807-1e897d.
    After completion, generate evidence report. Then dispatch a Coordinator
    snapshot archive task to commit (implementation + all run artifacts).
    
    After the snapshot commit, dispatch a Coordinator ledger archive task that
    creates EV-MTARGET-20260807-1e897d, the decision record, and advances the
    goal past this batch.
  proof_search_map:
    applicable: false
    reason: This batch runs a new experiment and creates new evidence; it does
      not propose a theorem or certificate family.
  created_by: coordinator
  created_at: '2026-08-07'

