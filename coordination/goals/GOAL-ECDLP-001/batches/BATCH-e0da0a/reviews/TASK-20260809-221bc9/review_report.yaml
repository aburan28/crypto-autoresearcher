checked_items:
  - item: exact_snapshot_repository_and_hash_integrity
    result: PASS
    detail: >-
      HEAD is exactly e330aedb1d686d0639c9646d1f9fa1b19ada52f1. Its sole
      delta from d3e98fb8537cf569cb0955dbe8f6e6d468b0bc3a is the dispatch
      queue. The producer snapshot changes exactly its eleven declared
      producer artifacts plus its receipt, and all eleven producer SHA-256
      values recompute to the receipt values; the queue binds the receipt
      SHA-256. All reviewed YAML and JSON artifacts parse.
  - item: REV-cff774-01_automorphism_closure_and_stabilizer_witnesses
    result: REVISE
    detail: >-
      The successor now requires an automorphism order, duplicate-free closure,
      a divisor list, and the orbit-size/stabilizer equation. However
      generated_group_maps has no element schema and declared_generators is not
      a required manifest field, while the certificate schema supplies only one
      subgroup_eigenvalue_lambda. The canonicalization contract requires the
      certified scalar for each map, but no map-by-map formula, composition,
      scalar, or replay witness is required. Thus a verifier cannot determine
      from the manifest bytes which closure was certified or which coefficient
      transform belongs to a selected map.
  - item: REV-cff774-02_source_random_pairing_and_calibration_rows
    result: REVISE
    detail: >-
      Primary source/random pairing is repaired: the target is derived from the
      pair token and subgroup order rather than instance_id, and paired fields
      are declared invariant. The eight calibration identifiers, seeds,
      predicates, detector labels, and excluded dispositions are also fixed.
      But calibration generation is an unbounded iterate-attempts-from-zero
      search with no maximum attempt count, terminal unavailable disposition,
      or predeclared treatment of an unavailable/misdetected calibration row.
      It can therefore exceed the fixed design budget or leave the exact
      104-row calibration obligation unevaluable.
  - item: REV-cff774-03_exclusive_cost_vector_coverage_and_non_overlap
    result: PASS
    detail: >-
      COST-ECDLP-5ec1c5-v2 defines nonnegative integer required counters,
      diagnostic-only point and certificate counters, exclusive owners for
      field, scalar, map, canonicalization, recovery, retry, setup, hash,
      serialization, and memory work, plus recomputation and pair-invariance
      gates. The point/map/recovery exclusions address the prior double-charge
      routes at the specification boundary.
  - item: REV-cff774-04_exact_2_to_the_8_statistics_and_attainability
    result: PASS
    detail: >-
      The registered eight held-out groups yield 2^8 sign assignments and a
      smallest two-sided p-value of 2/256 = 0.0078125, so the fixed p <= 0.05
      threshold is attainable. The all-eight-valid and censoring-invalid rules
      are internally consistent, and the 96 primary plus eight calibration
      rows reconcile to 104 runs and 5.2 worst-case CPU hours within the
      stated six-hour total budget.
  - item: REV-cff774-05_observation_collision_fixture
    result: PASS
    detail: >-
      The frozen collision fixture retains the equal and quotient-equivalent
      negative controls and supplies the distinct pair (12,7), (39,9), whose
      denominator is 2 modulo 101 and whose recovery equation gives x=37.
      It labels both duplicate cases as non-solves and blocks approval on a
      fixture failure.
  - item: proof_fixture_baseline_reproduction_semantics
    result: REVISE
    detail: >-
      The baseline fixture lists transition constants and expected coefficient
      pairs, but it does not declare the partition selector sequence, a point
      encoding/hash preimage that produces it, or an explicitly separate
      fixture-mode transition schedule. Consequently the required implementation
      cannot reproduce the asserted first three walk steps from frozen inputs
      without choosing an unstated convention.
  - item: hypothesis_success_rule_and_control_coverage
    result: REVISE
    detail: >-
      H-ECDLP-f6d060 states lower charged work than both ordinary and
      negation-only controls, while the registered success threshold requires
      only FULL/NEG <= 0.90 and a p-value. FULL/BASE is reported but has no
      threshold, statistical gate, or conjunct in success. The experiment
      could therefore pass while failing the stated ordinary-control portion
      of its hypothesis.
  - item: claim_ceiling_target_profile_and_design_boundary
    result: PASS
    detail: >-
      The package consistently limits itself to a toy finite constant-factor
      comparison, retains the generic 1/2 exponent, labels the heuristic as a
      comparison prediction, includes the nearby-object controls and
      proof-search-map fixtures, and denies a cryptographic-scale claim. This
      is not a target-class promotion under the target-result profile.
  - item: coordination_state_consistency
    result: REVISE_NONBLOCKING
    detail: >-
      The requested dispatch queue marks TASK-20260809-b6afd1 completed, while
      the snapshot-bound batch.yaml still lists that task as queued. The queue
      provides the current review binding and the receipt/hash chain is sound,
      but a later Coordinator-only immutable correction should reconcile this
      stale duplicated task state; this report does not alter either record.
findings:
  - id: REV-221bc9-01
    severity: critical
    blocking: true
    title: Automorphism closure lacks map-level certificate semantics.
    evidence_paths:
      - ledger/hypotheses/H-ECDLP-f6d060.yaml
      - experiments/EXP-ECDLP-5ec1c5/specification.yaml
      - experiments/EXP-ECDLP-5ec1c5/protocol/instance_manifest.schema.yaml
    rationale: >-
      A complete group order and a state stabilizer count do not identify the
      actual maps used for canonicalization. The untyped generated_group_maps
      field and singular lambda leave the claimed per-map coefficient transform
      unverifiable at exactly the boundary that protects recovery correctness.
    minimum_repair: >-
      Create a new immutable successor with a map-entry schema and required
      declared_generators. For every map require a stable index, formula and
      F_p witness, composition/closure witness, action on P, certified scalar,
      and replay result; require canonicalization and stabilizer receipts to
      reference those exact map indices. Reject a row unless the map-entry set
      is the duplicate-free closure of the declared generators.
  - id: REV-221bc9-02
    severity: high
    blocking: true
    title: Calibration controls are pre-registered but not bounded to a terminal outcome.
    evidence_paths:
      - experiments/EXP-ECDLP-5ec1c5/specification.yaml
      - experiments/EXP-ECDLP-5ec1c5/protocol/seed_register.yaml
    rationale: >-
      The source/random search has a 256-attempt terminal invalidation branch;
      calibration search has none. The latter can consume unbounded work and
      has no pre-registered unavailable or detector-failure disposition, which
      defeats the fixed 104-row budget and the calibration gate.
    minimum_repair: >-
      Add a finite per-calibration attempt cap and exact terminal receipt
      schema. State whether unavailable or wrong-detector calibration blocks
      approval or invalidates the package, record all candidate bytes through
      the cap, and reconcile that terminal rule with the 104-run budget.
  - id: REV-221bc9-03
    severity: high
    blocking: true
    title: Registered success does not test the hypothesis against C-BASE.
    evidence_paths:
      - ledger/hypotheses/H-ECDLP-f6d060.yaml
      - experiments/EXP-ECDLP-5ec1c5/specification.yaml
    rationale: >-
      The stated hypothesis requires a gain against ordinary and negation-only
      controls, but the decision rule tests only FULL/NEG. Reporting FULL/BASE
      is not an acceptance condition, so a passing result need not satisfy the
      claimed finite-scope prediction.
    minimum_repair: >-
      In a new successor, either add a pre-registered FULL/BASE effect and
      exact statistical rule to the success criterion, including any
      multiplicity treatment, or explicitly narrow the hypothesis, prediction,
      and decision language to a negation-only comparison.
  - id: REV-221bc9-04
    severity: high
    blocking: true
    title: Baseline proof fixture lacks deterministic selector semantics.
    evidence_paths:
      - ledger/hypotheses/H-ECDLP-f6d060.yaml
      - experiments/EXP-ECDLP-5ec1c5/specification.yaml
      - experiments/EXP-ECDLP-5ec1c5/protocol/proof_audits.yaml
    rationale: >-
      The fixture claims an exact first-three-step reproduction but leaves the
      source of the three selected transition indices unspecified. This permits
      incompatible implementations to satisfy the prose using different
      unstated selector conventions.
    minimum_repair: >-
      Freeze either an explicit selector schedule with a fixture-only execution
      rule or all encoded points, step counters, partition-hash preimages, and
      expected selector outputs. Bind the expected coefficient sequence and
      certificate equation to that exact representation.
