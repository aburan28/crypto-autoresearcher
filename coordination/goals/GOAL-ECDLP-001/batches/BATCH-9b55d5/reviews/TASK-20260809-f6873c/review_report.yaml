predecessor_finding_closure:
  - id: REV-221bc9-01
    result: PASS
    detail: >-
      The manifest schema and experiment now require declared generators and a
      typed map-entry schema with contiguous indices, generator words,
      formulas, F_p witnesses, composition rows, map-on-P values, per-map
      certified scalar lambdas, scalar certificates, and replay witnesses.
      The selected canonicalization map must name its index and own lambda;
      closure, composition, group-order, stabilizer, and orbit predicates are
      fail-closed. This closes the prior map-level/scalar-witness omission at
      the specification boundary.
  - id: REV-221bc9-02
    result: PASS
    detail: >-
      All eight registered calibration rows carry a 256-attempt cap, fixed
      terminal unavailable and detector-mismatch outcomes, required terminal
      receipt fields, and a no-replacement rule. The experiment marks either
      terminal failure package-invalid and retains the fixed 104-slot matrix.
  - id: REV-221bc9-03
    result: PASS_WITH_NEW_BLOCKER
    detail: >-
      FULL/NEG and FULL/BASE now both occur in the hypothesis prediction,
      preregistered prediction, replication statistics, and success criterion,
      with a Bonferroni alpha of 0.025 for each comparison. However, the new
      blocking finding REV-f6873c-01 prevents this syntactically complete gate
      from being an executable statistical decision rule.
  - id: REV-221bc9-04
    result: PARTIAL
    detail: >-
      The fixture now freezes fixture mode, selector schedule, selector inputs,
      and listed preimages while expressly separating the primary PART-v3 hash
      contract. Thus the predecessor's unspecified selector convention is
      repaired. The baseline reproduction gate nevertheless requires a
      certificate equation whose expected output is not frozen; this is the
      distinct blocker REV-f6873c-02.
blocking_findings:
  - id: REV-f6873c-01
    severity: critical
    title: Exact paired sign-permutation gates have no frozen test statistic or p-value algorithm.
    evidence_paths:
      - ledger/hypotheses/H-ECDLP-e42bda.yaml
      - experiments/EXP-ECDLP-2ebd6c/specification.yaml
    rationale: >-
      The package fixes eight held-out groups, a 0.90 effect threshold, and
      alpha=0.025 per comparison, but it never defines the statistic evaluated
      over the 2^8 sign assignments. It does not say whether the statistic is
      the sum or mean of log ratios, a signed-rank statistic, a
      Hodges-Lehmann/Walsh statistic, or another quantity; nor does it freeze
      the two-sided tail rule, tie/zero handling, or the exact numerator and
      denominator used for p. "Hodges-Lehmann paired median ratio" is likewise
      not defined as a function of the eight paired observations. Different
      correct-looking implementations can therefore yield different p-values
      and pass/fail dispositions on identical raw rows, allowing an
      implementation-time choice in a decision claimed to be pre-registered.
    minimum_repair: >-
      Create a new immutable successor that defines, for each comparison,
      d_i=log(W_FULL/W_control), the effect estimator and its transform back
      to a ratio, the single exact test statistic T(d), all 256 sign vectors,
      the inclusive two-sided tail predicate, and deterministic zero/tie and
      floating-point or exact-arithmetic handling. Require comparison.json and
      the validator to emit the complete enumerated statistic table and the
      exact p numerator/256 before either FULL/NEG or FULL/BASE can satisfy the
      success criterion.
  - id: REV-f6873c-02
    severity: high
    title: Baseline fixture freezes selectors but not the certificate-equation outputs demanded by its reproduction gate.
    evidence_paths:
      - ledger/hypotheses/H-ECDLP-e42bda.yaml
      - experiments/EXP-ECDLP-2ebd6c/specification.yaml
      - experiments/EXP-ECDLP-2ebd6c/protocol/proof_audits.yaml
    rationale: >-
      baseline_reproduction fixes modulus 101, target scalar 37, transitions,
      initial coefficients, selector schedule, and the three coefficient
      pairs. Its reproduction_gate nevertheless requires the implementation
      to emit "the same ... certificate equation" without supplying an
      expected coefficient-to-state residue, point representation, or expected
      equation/result for any step. The map transform is similarly named but
      not supplied as a frozen expected output. The observation-collision
      fixture does freeze its denominator and recovered scalar, but it cannot
      fill this missing baseline assertion. Consequently the baseline audit is
      not a complete deterministic reproduction test as required by the
      proof-search-map binding.
    minimum_repair: >-
      Create a new immutable successor that adds explicit baseline expected
      outputs, at minimum the fixed equations/residues for every listed
      (a,b) under x=37 (and their expected negation transforms), together with
      the exact encoded representation or an explicit coefficient-group
      acceptance rule. Make the fixture gate reject unless each emitted step,
      transform, and named certificate equation byte-for-byte or
      exact-arithmetic matches those frozen outputs.
nonblocking_findings:
  - id: REV-f6873c-NB-01
    severity: low
    title: Calibration terminal prose is off-by-one ambiguous.
    rationale: >-
      The generation prose says attempts run from zero through 255, which is
      256 attempts, then says no candidate "by attempt 256." The declared
      maximum is otherwise consistently 256 and the issue does not defeat the
      finite cap, but a future successor should state the attempted index set
      explicitly as [0,255] and the resulting count as 256.
    suggested_repair: >-
      Align the seed-register prose and the experiment rule to one inclusive
      index interval before the next snapshot.
checks_passed:
  - item: exact_snapshot_and_immutable_provenance
    detail: >-
      HEAD is a416d96a6577d2943843378043bcb7a44202f0f3 and its parent is the
      producer snapshot commit 061892d6440c3b9f63cb47816d633a03556abc16.
      The snapshot has its stated parent, changes exactly its twelve declared
      paths, and all eleven non-self producer hashes recompute to the receipt.
      The HEAD queue binds the snapshot commit and receipt SHA-256.
  - item: static_syntax_and_cross_reference_parse
    detail: >-
      The reviewed hypothesis, experiment, four protocol YAML artifacts,
      batch record, and predecessor review parse as YAML; the queue and
      snapshot receipt parse as JSON. IDs, hypothesis/experiment linkage,
      batch linkage, and successor/supersession references agree.
  - item: typed_map_level_closure_and_scalar_witness_contract
    detail: >-
      Per-map formula, field, composition, P-action, scalar, and replay
      witnesses are required and selected-map receipts bind to an indexed map
      and that map's own lambda. The prior singular-lambda ambiguity is absent.
  - item: calibration_cap_terminal_receipts_and_fixed_matrix
    detail: >-
      Eight calibration rows are fixed before outcome, capped, receipt-bound,
      excluded from primary aggregation, and package-invalid on unavailable or
      mismatched detection. Six primary variants across sixteen groups plus
      eight calibration rows reconcile to 104 declared slots.
  - item: control_pairing_and_cost_contract
    detail: >-
      Source/random matching fixes p, subgroup order, pair token, target,
      partition seed, stopping rule, and cost-model identity. The v3 cost
      vector assigns exclusive ownership for arithmetic, maps, recovery,
      setup, hashing, serialization, and memory, with raw-vector
      recomputation and non-overlap rejection before statistics.
  - item: full_neg_and_full_base_coverage
    detail: >-
      Both comparisons are conjuncts of the effect rule with the stated
      Bonferroni family-wise alpha. This check concerns coverage only; the
      executable-statistic defect is separately blocking.
  - item: frozen_selector_and_observation_collision_semantics
    detail: >-
      Fixture-mode selector schedule [0,1,2] is explicit and insulated from
      the primary hash rule. The observation fixture distinguishes identical,
      quotient-equivalent, and distinct valid collisions and freezes the
      latter's denominator 2 and recovered x=37 behavior.
  - item: proof_search_map_and_scope_ceiling
    detail: >-
      The hypothesis contains baseline, observation-collision, quantifier
      order, method-ceiling, nearby-object-control, and proof-obligation
      fields. It labels the work finite-constant-factor only, retains generic
      1/2 time and 0 memory exponents, and bounds any future measurement to
      p<2^18 toy curves; it makes no target-class, exponent, cryptographic
      security, or affected-system claim.
