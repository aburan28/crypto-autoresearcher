required_successor_repairs:
  - id: A-MARKOV-SERIALIZATION-MISLABEL
    severity: required_before_next_revision
    checkpoint_statement_verbatim: >-
      specification.yaml's contract_2_tuplewise_tail and
      verification-and-null-kats.yaml's KAT-HA2-TUPLEWISE-MARKOV both state
      the twelve-decimal-place values are "truncation of the long division."
      Independent recomputation shows 3 of 5 rows (bits 18, 27, 30) actually
      match half-up ROUNDING, not truncation (true truncated values:
      0.015151515151 / 0.010713739108 / 0.009544856438, one ULP below
      stored). Numbers are correct and in fact slightly more conservative;
      only the stated derivation method is wrong.
    requirement: >-
      Relabel the stated convention as "half-up rounding" and keep the
      current stored values, applied identically in both files. Recomputing
      the three rows to true truncation was considered and rejected as this
      task's chosen approach (see the producer handoff for the reasoning).
    unaffected_rows: {bits_21: '0.013498465426', bits_24: '0.012025765545'}
  - id: B-BITWIDTH-14-VS-13-ERROR
    severity: required_before_next_revision
    checkpoint_statement_verbatim: >-
      Three artifacts (specification.yaml ~line 560,
      design-repair-report.yaml ~line 236, custody-and-executable-contract.yaml
      line 115) state widening candidate_index to 8185 admissible values
      "needs at least a 14-bit index." 2^13=8192 >= 8185, so 13 bits suffice;
      2^12=4096 is insufficient. Minimal width is 13, not 14.
    requirement: >-
      Correct "14-bit index" to "13-bit index" in all three affected
      artifacts. Preserve the byte-alignment point that 13 bits still needs a
      U16.
  - id: C-PEAK-KAT-PARTIAL-OVERLAP-COVERAGE-GAP
    severity: required_before_the_peak_kat_suite_is_treated_as_sufficient
    checkpoint_statement_verbatim: >-
      All six current KATs test only full-coincidence or full-disjointness
      shard topologies. Red Team constructed a concrete counterexample: shard
      j (j=1..8) live on [j,j+4), shared=0, dedup=0 -- correct peak is 4
      throughout the interior, a value none of the six KATs would catch a
      wrong implementation missing.
    requirement: >-
      Add KAT-PEAK-7 (this exact fixture, expected peak 4) to the peak-axis
      KAT suite before it is treated as sufficient. State explicitly what
      wrong-rule/wrong-implementation class it rejects: any implementation
      that special-cases only the two extreme topologies (full-coincidence
      returning the shard count, full-disjointness returning 1) and falls
      back to an incorrect default elsewhere would fail this KAT while
      passing all six existing ones.
    fixture:
      events: shard j allocates 1 byte at t=j and frees it at t=j+4, for j = 1..8
      shared_t: 0
      dedup_t: 0
      sample_point_1: {t: 4.5, live_shards: [1, 2, 3, 4], aggregate: 4}
      sample_point_2: {t: 5.5, live_shards: [2, 3, 4, 5], aggregate: 4}
      expected_peak_live_bytes: 4
  - id: D-ARCHIVE-COMMUNICATION-ITEMIZATION-GAP
    severity: required_before_capacity_residuals_are_treated_as_independently_re-derivable
    checkpoint_statement_verbatim: >-
      The output residual has a 12-row itemized manifest independently
      re-summed by both reviewers to exactly 15520768. Archive (5563755264
      scheduled, 2307745600 cap) and communication (5614086912 scheduled,
      2328717120 cap) are opaque scalars with no itemized breakdown anywhere.
    requirement: >-
      Supply the same itemized per-mount/per-stream manifest for archive and
      communication that output already has, so the totals are independently
      re-derivable rather than merely asserted -- UNLESS no genuine,
      non-fabricated decomposition exists in the inherited design, in which
      case record ITEM-D-ITEMIZATION-NOT-ACHIEVABLE-WITHOUT-FABRICATION
      honestly as an incomplete residual repair rather than fabricate
      plausible-looking row values. Do not change scheduled_bytes,
      hard_cap_bytes, or over_cap_bytes for archive, communication, or
      output either way.
    coordinators_own_pre_check: >-
      No named archive/communication mount, stream, or per-shard/per-stage
      byte-attribution basis was found anywhere in the six frozen
      EXP-SYC-793304 artifacts or the inherited EXP-SYC-b11b38/EXP-SYC-12de89
      chain by this Coordinator's own read; only output_manifest has actual
      named per-file rows. The producer task must independently confirm or
      refute this before deciding between the two branches above.

