    - id: item_D_archive_communication_itemization
      must_address_id: D-ARCHIVE-COMMUNICATION-ITEMIZATION-GAP
      status: CONFIRMED_PARTIALLY_WRONG -- disposition correct for communication, incorrect for archive
      producer_disposition: NOT_ACHIEVABLE_WITHOUT_FABRICATION (both totals; no rows supplied)
      row_sum_check: not_applicable_no_rows_were_supplied_to_sum
      independent_re_search_beyond_producers_search: >-
        The producer searched experiments/EXP-SYC-b11b38/specification.yaml
        and experiments/EXP-SYC-12de89/specification.yaml (plus the six frozen
        files and a repo-wide grep for "mount"), and concluded
        archive_scheduled_bytes and communication_scheduled_bytes "appear ONLY
        as opaque scalars ... across the entire EXP-SYC-12de89 ->
        EXP-SYC-b11b38 -> EXP-SYC-793304 chain." This review additionally
        followed EXP-SYC-12de89/specification.yaml's OWN
        physical_cost_and_finite_frontier.binding field, which points
        directly to
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-68ea16/tasks/TASK-20260811-cb5d76/physical-frontier-compiler.yaml
        as EXP-SYC-12de89's stated authority for archive_scheduled_bytes and
        communication_scheduled_bytes -- i.e. one hop from a source the
        producer's own authoritative_sources_used list already named.
      finding_id: V-1-ARCHIVE-ITEMIZATION-BASIS-OVERLOOKED
      finding: >-
        That document's archive_hashing_mount_state_scaling section supplies a
        genuine per-ladder-size decomposition of archive_scheduled_bytes:
        n_c_by_size = [177118029, 357047457, 716906313, 1436624022,
        2876059443] for bits [18, 21, 24, 27, 30], summing exactly to
        5563755264 (independently re-summed by this review: 177118029 +
        357047457 + 716906313 + 1436624022 + 2876059443 = 5563755264, exact).
        This is not an invented partition constructed to sum correctly (which
        is what the producer correctly refused, e.g. the rejected 5563755264/8
        even-shard split): it is the CONSTRUCTION that produced the total,
        derived by applying an x3 mount-pass multiplier -- independently
        confirmed correct for the "candidate"-column-sibling class
        scalar_witness_verification by BOTH that batch's own Validator
        (TASK-20260811-b34084) and Red Team (TASK-20260811-c0a729) -- to
        archive_hashing's predecessor per-size values [59039343, 119015819,
        238968771, 478874674, 958686481] (from EXP-SYC-268d6f's
        physical-cost-compiler.yaml). BATCH-68ea16's own Validator
        independently re-derived the identical five numbers and explicitly
        confirmed the arithmetic, while also disclosing -- as does the
        deriving document itself -- that the x3 multiplier "remains an
        inference, not a provable identity" (no artifact states
        archive_hashing's per-verification byte formula explicitly; an
        alternative additive-delta derivation gives a different, LARGER total
        of 7713503488, used there as a robustness check, not adopted).
      what_this_means_for_archive: >-
        The producer's claim "No lossless, non-invented decomposition of
        archive_scheduled_bytes ... exists anywhere in the inherited chain" is
        FALSE as stated: a genuine, previously-independently-validated,
        formula-derived (if self-disclosed-as-inferential) per-size basis
        exists and was overlooked. Note this basis is per-LADDER-SIZE, not
        per-mount/per-stream as the checkpoint literally asked for, and it
        carries the same "derived, not directly-stated" caveat its own
        authors and reviewers attached to it -- so it does not by itself
        license writing archive_scheduled_bytes as a clean, certain
        itemization either. But it is squarely a "basis this Coordinator's own
        claim missed", which is exactly what this review was asked to check
        for before accepting NOT_ACHIEVABLE_WITHOUT_FABRICATION at face value.
      what_this_means_for_communication: >-
        For communication_scheduled_bytes, the SAME BATCH-68ea16 document
        states explicitly: "No analogous population-driven class exists for
        communication_bytes anywhere in either compiler document ...
        communication_scheduled_bytes cannot be independently re-derived from
        a named class," and its own x3 extension there is disclosed as "an
        explicitly weaker, more uncertain extrapolation" by symmetry alone,
        with no named class at all. This review independently confirms this:
        no comparable basis for communication was found anywhere. The
        producer's NOT_ACHIEVABLE_WITHOUT_FABRICATION conclusion for
        communication_scheduled_bytes IS well-supported.
      further_corroborating_observation: >-
        The class_population_table containing this archive_hashing row (and
        its per-size breakdown) is present ONLY in
        BATCH-68ea16/tasks/TASK-20260811-cb5d76/physical-frontier-compiler.yaml;
        grepping for "class_population_table" and "archive_hashing" in
        EXP-SYC-b11b38's own task package
        (BATCH-080a9c/tasks/TASK-20260811-338053/physical-frontier-compiler.yaml)
        and in every later successor's physical-frontier-compiler.yaml
        (including this one) returns zero hits: the itemization basis was
        dropped starting at the very next successor, EXP-SYC-b11b38, leaving
        only the opaque scalar under capacity_fit_residuals.archive from that
        point on, and no successor since (including this one) has
        acknowledged or re-derived it.
      required_before_item_D_can_be_treated_as_closed: >-
        A future successor task must either (a) incorporate this per-size
        archive basis into the record, with its disclosed x3-multiplier
        uncertainty preserved rather than presented as certain, and continue
        to record communication_scheduled_bytes as NOT_ACHIEVABLE_WITHOUT_FABRICATION,
        or (b) if the Coordinator judges a per-SIZE decomposition does not
        satisfy the checkpoint's per-MOUNT/per-STREAM requirement, say so
        explicitly rather than letting the "no basis exists anywhere" claim
        stand uncorrected.
