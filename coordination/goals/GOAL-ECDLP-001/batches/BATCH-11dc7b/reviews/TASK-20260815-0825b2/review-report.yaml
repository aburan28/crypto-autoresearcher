      recomputed_t_4_5: {live_shards: [1, 2, 3, 4], aggregate: 4}
      recomputed_t_5_5: {live_shards: [2, 3, 4, 5], aggregate: 4}
      recomputed_interior_sweep: >-
        live-shard count by integer t: t=1:1, t=2:2, t=3:3, t=4..8:4 (constant
        4 throughout the interior), t=9:3, t=10:2, t=11:1, t=12:0. Step-0.05
