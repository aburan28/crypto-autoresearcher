      status: CONFIRMED_REPAIRED
      independent_recomputation: >-
        Wrote a small Python model of "shard j live on [j, j+4) for j=1..8"
        and evaluated live-shard count at every half-integer and integer
        timestamp from t=0 to t=13, plus a step-0.05 sweep of the whole
