  baseline_comparison:
    pollard_rho: >-
      Program baseline remains 0.886*sqrt(N) group operations with van
      Oorschot-Wiener parallelization and negligible live storage. This
      zero-run static record reports no target-dependent decoder or
      measured end-to-end cost, so no attack comparison is possible or
      attempted, and none is claimed.
    bsgs: >-
      KN-TECH-035's requirement that memory, wiring, and communication be
      charged remains structurally satisfiable in principle (the peak rule
      from the prior batch is unchanged and correct), but no numeric
      aggregate exists anywhere in the inherited chain (PEAK-AGGREGATE-FIT-UNPROVED,
      confirmed still open), so an eight-way BSGS comparison remains
      incomplete pending an implementation this record does not authorize.
    closest_specialized_baseline: >-
      RT-OBJ4's k-list/generalized-birthday comparison remains explicitly
      open and deferred, confirmed not narrowed above; no dominance
      conclusion is available.
    dominated_by: n/a (no result claimed; zero-run static design-repair record)
    sota_delta: no measured attack or cost delta; static contract repair only.

  heuristic_challenges:
    - id: HA2-impossibility-is-conditional-not-universal
      finding: >-
        The record's "PROVED_UNAVAILABLE" language remains correctly scoped
        to "from the committed HA-2/HA-3 heuristic record," with two named
        forward routes left genuinely open. Items A and B are confirmed
        label/arithmetic edits only and do not touch this scoping. No
