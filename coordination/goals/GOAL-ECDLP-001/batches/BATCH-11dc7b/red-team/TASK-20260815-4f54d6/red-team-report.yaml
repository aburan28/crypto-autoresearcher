    - id: CTRL-4F54D6-SESSION-MODEL-CROSS-CHECK
      priority: recommended_process_improvement_carried_forward
      action: >-
        Same standing recommendation as TASK-20260815-d7c570: have the
        launching/dispatching layer record its own observed model
