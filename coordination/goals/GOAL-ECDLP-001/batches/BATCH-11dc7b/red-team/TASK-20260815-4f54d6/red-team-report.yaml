    - id: CTRL-4F54D6-PEAK-KAT-SCOPE-LABEL
      priority: recommended_before_the_peak_kat_suite_is_read_as_exhaustive
      action: >-
        Relabel `rejects_partial_overlap_special_casing: true` to scope it
