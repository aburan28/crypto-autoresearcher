  schema: crypto.autoresearch.red_team_report.v1
  id: RT-20260815-4f54d6
  task_id: TASK-20260815-4f54d6
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-11dc7b
  experiment_id: EXP-SYC-edf98d
  role: red-team
  verdict: REVISE
  recorded_at: '2026-08-15'

  claim_under_review: >-
    Whether frozen zero-run static successor EXP-SYC-edf98d (task
    TASK-20260815-8cb1c0, snapshot commit
    e7eb145751824d6d01f2fc509da39d34307361d4, parent 89bcfcc5) repairs, on
