    ha2_tail_unavailability_proof: >-
      items A and B are confirmed, by direct inspection, to be label/
      arithmetic edits only within contract_2_tuplewise_tail's
      serialization_convention field and the route-(b) forward-guidance
      text respectively; the surrounding lemma logic (L1-L5), the
      NKAT-HA2-EQUAL-MEAN and NKAT-HA2-CONVENTION-DEGENERACY negative
      controls, and the stated conclusion are textually untouched. Logic
      and conclusion unweakened.
    no_cap_raised: >-
      archive_hard_cap_bytes 2307745600, communication_hard_cap_bytes
      2328717120, and output hard_cap_bytes 8388608 are byte-identical to
      the inherited values in every one of the six frozen artifacts; no cap
      increase found anywhere.
    capacity_residual_arithmetic: >-
      5563755264-2307745600=3256009664, 5614086912-2328717120=3285369792,
      15520768-8388608=7132160, and the twelve-row output manifest
      (1966080*4+524288+2097152+1048576+8192+46080+1048576+2097152+786432)
      all independently recomputed exact matches.

  required_controls:
    - id: CTRL-4F54D6-ITEM-D-CITE-BATCH68EA16-BASIS
      priority: required_before_item_D_is_treated_as_correctly_closed
      action: >-
        Correct item D's disposition and its "no relationship exists
        anywhere in the chain" claim by citing
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-68ea16/tasks/TASK-20260811-cb5d76/physical-frontier-compiler.yaml's
