  frozen_literal_recomputation:
    id: RT-4F54D6-FROZEN-LITERALS
    disposition: PASS_ALL_UNWEAKENED
    deriv1_bits27_literal: >-
      Independently recomputed 4088/134217728 with exact Decimal division:
      0.000030457973480224609375, exact. The displayed literal
      0.0000304579734802 matches this value truncated/rounded to 16 decimal
      places exactly (17th digit is 2, so truncation and rounding coincide).
      Unweakened, unchanged from EXP-SYC-793304.
    worst_case_occupancy_bound: >-
      Recomputed 8*(L-1) for L in [64,128,256,512,1024]: [504, 1016, 2040,
      4088, 8152... ] -- exact match to [504, 1016, 2040, 4088, 8184] and to
      exceeds_capacity_by [472, 984, 2008, 4056, 8152]. Unweakened.
    familywise_union_bound: >-
      Recomputed 98304*mu/33 at all five ladder sizes and the gamma_x=1/3
      ceiling with exact Decimal arithmetic: 1489.454545, 1326.953145,
      1182.180856, 1053.203409, 938.297567, ceiling 2978.909091 -- all match
      the stored KAT-HA2-FAMILYWISE-UNION-VACUITY rows exactly. 33/98304 =
      0.000335693359375 and 1089/98304 = 0.011077880859375 both confirmed
      exact. Unweakened.
    overflow_rule: >-
      "a realized thirty-third distinct candidate has zero-based
      candidate_index 32... invalidates without truncation" is byte-
      identical to the inherited rule from EXP-SYC-12de89; no realized
      thirty-third distinct value is claimed anywhere (none could be, since
