  review_scope:
    read_method: >-
      git show e7eb145751824d6d01f2fc509da39d34307361d4:<path> for every
      reviewed artifact (the six TASK-20260815-8cb1c0 declared paths, the
      snapshot receipt, checkpoint BATCH-86fd69.yaml, and the prior
      red-team report TASK-20260815-d7c570). Verified by git
      merge-base --is-ancestor that this commit is reachable from HEAD
      (315f2cd7, two commits ahead); confirmed by git diff that no
      post-snapshot working-tree drift exists in reviewed content (the
      only later change is an administrative commit_sha self-fill in the
      archive receipt, which touches no reviewed content). Cross-lineage
      artifacts outside the six declared paths (EXP-SYC-b11b38,
      EXP-SYC-12de89, and the BATCH-68ea16 compiler document discussed
      under item D below) were read from the current working tree, which
      is immutable committed history unaffected by this batch's snapshot,
      and independently hash-verified against their own hash-pinned
      citations (see item D).
    working_tree_only_artifacts_treated_as_durable: false
    validator_directory_read: false
    independent_session: true
    originated_reviewed_output: false
    invalid_predecessor_TASK-20260813-a8dc5e_cited_as_evidence_or_authority: false
    quarantined_precursors_EXP-SYC-24123d_TASK-20260811-5e4a0f_cited_or_used: false

  # ===========================================================================
  # PROVENANCE ATTACK SURFACE -- addressed first per this task's explicit
  # instruction.
  # ===========================================================================
  session_provenance_finding:
    id: RT-4F54D6-SESSION-PROVENANCE
    this_sessions_resolved_model_id: claude-sonnet-5
    resolved_model_id_source: >-
      The exact configured identifier stated verbatim in this session's own
      system prompt model-identity section ("You are powered by the model
      named Sonnet 5. The exact model ID is claude-sonnet-5."), used
      verbatim per this task's explicit provenance instruction -- not a
      guessed marketing name recalled from training.
    committed_binding_target_for_review_adversarial: anthropic:claude-opus-5
    committed_binding_target_independently_verified: >-
      Read directly by this session (not trusted from any producer or
      prior-report claim): orchestration/model-bindings.yaml line 95-98
      (bindings.anthropic.review-adversarial.model = claude-opus-5,
      provenance = runtime-verified, last_probed = null) and defaults.backend
      = anthropic at line 28.
    these_are_two_distinct_facts_kept_separate: true
    mismatch: true
    mismatch_disposition: >-
      Same standing SESSION-MODEL-PROVENANCE-GAP already disclosed and
      accepted via Coordinator inference_amendment DEC-20260815-23d3bd.
      Independently corroborated in this session's own environment:
      AUTORESEARCH_POLICY and AUTORESEARCH_BACKEND are both unset, and
      CLAUDE_CODE_ENTRYPOINT=remote_mobile -- consistent with a native
      Claude Code remote/mobile launch not routed through
      orchestration/adapter's env mechanism, exactly the accepted standing
      condition, not a new anomaly.
    related_open_finding_disposition: >-
      snapshot-receipt.json's native_runtime.related_finding_not_yet_dispositioned
      reports that repair task TASK-20260815-c4e508 self-reported its
      identity as "Claude Sonnet 4.5" rather than the configured identifier
      "claude-sonnet-5." This session's own self-identification above
      follows the configured identifier stated in its own system prompt
      exactly and does NOT reproduce that error -- confirmed as requested.
      The TASK-20260815-c4e508 finding itself remains OPEN and
      UNDISPOSITIONED: it produces no committed receipt of its own (per the
      same snapshot receipt), so this review cannot close it and does not
      attempt to; it is flagged here as still requiring a Coordinator
      decision on whether it warrants disclosure in a DEC-* record, per the
      snapshot receipt's own framing.
    does_not_retroactively_weaken: >-
      This finding is about this session's own provenance and the
      already-disclosed harness-wide condition, not about EXP-SYC-edf98d's
      content. Every substantive objection below stands or falls on its own
      independently checked grounds.

  # ===========================================================================
  # PER-ITEM TREATMENT, BY ID
  # ===========================================================================
  blocker_by_blocker_findings:

    - id: A-MARKOV-SERIALIZATION-MISLABEL
      disposition: PASS
      independent_verification: >-
        Recomputed mu/33 to 30 decimal places with exact Decimal arithmetic
        and both truncated (ROUND_DOWN) and half-up-rounded (ROUND_HALF_UP)
        at 12 places for bits 18/27/30 (the three rows the checkpoint flagged
        as mismatched). Truncated values reproduce exactly: 0.015151515151 /
        0.010713739108 / 0.009544856438. Half-up-rounded values reproduce
        exactly: 0.015151515152 / 0.010713739109 / 0.009544856439, matching
        the stored rows in both contract_2_tuplewise_tail (specification.yaml)
        and KAT-HA2-TUPLEWISE-MARKOV (verification-and-null-kats.yaml)
        exactly. The relabel to "twelve decimal places, half-up rounding of
        the long division" is therefore ACCURATE, and is applied identically
        in both required files.
      downstream_citation_check: >-
        Grepped both files and all six frozen artifacts for "truncat" and
        "14-bit"/"13-bit". Every remaining "truncat*" occurrence is either
        (a) narrative describing the historical mislabel and its repair
        (expected, not a defect), or (b) the textually distinct concept
        "invalidates_without_truncation" for candidate_index overflow, which
        has nothing to do with the Markov serialization convention. No stale
        "truncation of the long division" phrase survives anywhere.
        range_gamma_x_5_over_18 ('0.009544856439 through 0.015151515152'),
        the independent_corroboration text (TASK-20260813-e04de4's identical
        endpoints), and the ceiling_row (bound 0.030303030303) are all
        unaffected by the relabel since the underlying decimal values did not
        change; no inconsistency found.

    - id: B-BITWIDTH-14-VS-13-ERROR
      disposition: PASS
      independent_verification: >-
        2**13 = 8192 >= 8185 confirmed; 2**12 = 4096 < 8185 confirmed;
        8*(1024-1)+1 = 8185 confirmed, so 13 bits is exactly the minimal
        width. "14-bit index" corrected to "13-bit index" in exactly the
        three declared occurrences: specification.yaml
        (blocker_repairs.HA2-EXPECTATION-NOT-TAIL.contract_3... route text,
        cost_of_the_missing_simultaneous_tail), design-repair-report.yaml,
        and custody-and-executable-contract.yaml's
        width_widening_considered_and_refused block.
      stale_figure_search: >-
        Grepped all six frozen artifacts for "14-bit"/"14 bit"/"14bit": every
        hit is backward-looking narrative describing the OLD (predecessor)
        error being corrected ("Predecessor EXP-SYC-793304 stated 'at least a
        14-bit index'... corrected to 13-bit"), never a live, uncorrected
        claim. No stale "14-bit" figure survives anywhere in the six
        artifacts. The qualitative point (13 bits still does not fit a byte,
        so widening still requires a byte-aligned U16 and still strictly
        worsens the open capacity residuals) is correctly preserved
        unchanged; this route remains not-taken and not-authorized.

    - id: C-PEAK-KAT-PARTIAL-OVERLAP-COVERAGE-GAP
      disposition: PASS_ON_THE_SPECIFIC_REPAIR_REVISE_ON_ONE_OVERCLAIMED_FIELD
      independent_full_recomputation: >-
        Simulated the KAT-PEAK-7 event timeline in full (8 shards, shard j
        live on [j, j+4) for j=1..8) and evaluated live-shard count at EVERY
        event timestamp {1,...,12} AND every interior midpoint, not merely
        the two given sample points (t=4.5, t=5.5). Result: count = 1, 2, 3,
        4, 4, 4, 4, 4, 4, 3, 2, 1, 0 across t = 1, 1.5, 2, 2.5, 3, 3.5, 4,
        4.5, ..., 8.5, 9, 9.5, 10, 10.5, 11, 11.5, 12. The true interior
        maximum is EXACTLY 4, achieved continuously on t in [4, 9), not just
        at the two sampled points -- confirming
        expected_peak_live_bytes=4 and the design's own
        "aggregate_over_the_interior" claim are both correct, independently
        of trusting the producer's two-point spot-check.
      cheaper_counterexample_constructed: >-
        Per this task's explicit probe, constructed a strictly CHEAPER
        genuine partial-overlap fixture that a naive implementation
        special-casing exactly the three topologies now covered (full-
        coincidence -> N; full-disjointness -> 1; the literal KAT-PEAK-7
        8-shard/16-event staircase shape -> 4; else -> some wrong default)
        would still fail while passing all seven current KATs: 3 shards,
        window length 2, offset 1 (shard1 [1,3), shard2 [2,4), shard3
        [3,5)), shared=0, dedup=0. Independently simulated at every event
        time and midpoint: live counts 1,1,2,2,2,2,1,1,0 across t=1..5 at
        half-integer resolution; interior maximum is exactly 2 (= min(window
        length 2, shard count 3)), strictly between full-coincidence-for-N=3
        (3) and full-disjointness (1), and structurally distinct from
        KAT-PEAK-7's own 8-shard/length-4/offset-1 shape. This fixture uses
        only 6 total events versus KAT-PEAK-7's 16, is strictly cheaper, and
        would be missed by any implementation that pattern-matches on
        KAT-PEAK-7's specific shape rather than implementing the general
        sliding-window rule.
      finding: >-
        aggregate_kat_summary.rejects_partial_overlap_special_casing: true
        (verification-and-null-kats.yaml line 286) is an OVERCLAIM as
        stated: no finite KAT suite, however many fixtures it contains, can
        categorically foreclose an adversarial implementation that
        literally pattern-matches on the enumerated fixtures and falls back
        to an arbitrary default elsewhere -- the cheaper 3-shard fixture
        above proves this concretely for THIS seven-KAT suite. This does not
        diminish the genuine, substantive repair KAT-PEAK-7 makes against
        the SPECIFIC counterexample the prior Red Team constructed (that
        objection is correctly and fully closed), but the suite-wide
        absolute claim is not supported by seven point-fixtures and should
        not be read as a completeness proof.
      required_control: >-
        Either (a) relabel `rejects_partial_overlap_special_casing` to scope
        it honestly (e.g. "rejects the Red-Team-supplied counterexample; a
        finite KAT suite cannot prove rejection of every conceivable
        topology-special-casing implementation"), or (b) add the cheaper
        3-shard fixture above as KAT-PEAK-8 to further narrow the space of
        surviving wrong implementations. Neither is required before item C's
        SPECIFIC checkpoint objection is treated as closed, since that
        objection targeted exactly the fixture now supplied.

    - id: D-ARCHIVE-COMMUNICATION-ITEMIZATION-GAP
      disposition: REVISE
      severity: required_before_item_D_is_treated_as_correctly_closed
      producer_claim_as_stated: >-
        "No genuine, non-fabricated per-mount/per-stream itemization of
        archive_scheduled_bytes (5563755264) or communication_scheduled_bytes
        (5614086912) exists anywhere in the EXP-SYC-12de89 / EXP-SYC-b11b38 /
        EXP-SYC-793304 chain" (specification.yaml
        items_A_through_D_repairs.D-ARCHIVE-COMMUNICATION-ITEMIZATION-GAP;
        materially identical wording in custody-and-executable-contract.yaml
        archive_and_communication.item_D_itemization_attempt), disposition
        ITEM-D-ITEMIZATION-NOT-ACHIEVABLE-WITHOUT-FABRICATION.
      independent_search_performed: >-
        Per this task's explicit instruction to search the inherited chain
        for a decomposition basis the producer might have missed, grepped
        the ENTIRE repository (not scoped to experiments/EXP-SYC-*/, unlike
        the producer's own search, which its own text confirms was scoped to
        "grepped every occurrence of 'mount' across the EXP-SYC-* chain" --
        i.e. experiments/EXP-SYC-*/specification.yaml files only, confirmed
        by direct reproduction: grep -rn "archive_hashing_mount_state_scaling"
        matches nowhere under experiments/, only under
        coordination/goals/.../BATCH-68ea16/) for the two scheduled-byte
        literals and for the word "mount".
      finding: >-
        THE PRODUCER'S CLAIM IS FALSE AS STATED. A genuine, formula-grounded,
        hash-pinned, previously-independently-reviewed decomposition basis
        for archive_scheduled_bytes exists, and is reachable in exactly one
        hop from a file the producer's own authoritative_sources_used list
        confirms it read: experiments/EXP-SYC-b11b38/specification.yaml
        (line 41, authority.predecessor_experiment_id = EXP-SYC-12de89) hash-
        pins its own predecessor "compiler" artifact at
        authority.predecessor_artifacts.compiler.path =
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-68ea16/tasks/TASK-20260811-cb5d76/physical-frontier-compiler.yaml,
        sha256 a4b24972ce934b14ef81c638164f3b26b3c53cd8ced0c59dbc0b3e0a3bc9724c
        -- independently reproduced by this session with `sha256sum` against
        the live file: EXACT MATCH. That document's
        class_primitive_and_byte_rules.archive_hashing_mount_state_scaling
        section (id VAL-EA56C5-ARCHIVE-COMMUNICATION-repair, closing finding
        VAL-EA56C5-ARCHIVE-COMMUNICATION-BYTES-UNCHARGED from checkpoint
        BATCH-68ea16, status closed) supplies a NAMED class (archive_hashing)
        with an explicit, disclosed-as-derived formula: corrected
        n_c_by_size = 3 x predecessor n_c_by_size, tied precisely to
        verification_accounting.mount_state_count=3 -- literally a per-MOUNT
        derivation, using the exact concept the checkpoint's own "per-mount"
        framing invoked. Independently verified with exact integer
        arithmetic: predecessor_n_c_by_size [59039343, 119015819, 238968771,
        478874674, 958686481] sums to 1854585088; corrected_n_c_by_size
        [177118029, 357047457, 716906313, 1436624022, 2876059443] sums to
        EXACTLY 5563755264 (= archive_scheduled_bytes), and each element is
        EXACTLY 3x the corresponding predecessor element (verified
        elementwise, all five ratios = 3.0 exactly). This x3/mount-state
        derivation was independently confirmed twice already, by BOTH the
        BATCH-68ea16 Validator (TASK-20260811-b34084) and Red Team
        (TASK-20260811-c0a729, whose report states the identical elementwise
        check), before this session re-verified it a third time from raw
        integers.
      communication_side: >-
        For communication_scheduled_bytes (5614086912), the SAME document
        discloses (candidly, as a weaker inference) that no analogous named
        sub-class exists, but the SAME x3 mount-state multiplier applies at
        the total level: 5614086912 = 3 x 1871362304 exactly (independently
        recomputed by this session: 1871362304*3 = 5614086912, matching the
        BATCH-68ea16 red team's own "communication_check"). This is weaker
        than the archive-side, named-class derivation, but it is still a
        genuine, stated, previously-verified relationship -- not "no
        relationship anywhere," as the producer's blanket claim asserts.
      root_cause: >-
        The producer's own inherited_compiler.rule (physical-frontier-
        compiler.yaml) correctly names "the EXP-SYC-12de89 / EXP-SYC-b11b38 /
        EXP-SYC-793304 chain" as the inheritance scope, and EXP-SYC-b11b38 IS
        part of that stated scope -- but the producer's search stopped at
        EXP-SYC-b11b38's own specification.yaml prose rather than following
        that file's own hash-pinned predecessor_artifacts.compiler binding
        one hop further into coordination/goals/.../BATCH-68ea16/, where the
        formula actually lives. The chain of git-hash-pinned provenance is
        broader than the chain the producer actually walked; the producer's
        "grepped every occurrence of 'mount'" claim was, in fact, scoped
        only to experiments/EXP-SYC-*/specification.yaml files, not to the
        coordination/ task-artifact tree its own cited predecessor points
        into.
      why_this_is_premature_closure_not_a_pedantic_nitpick: >-
        Per docs/inventor-protocol.md, a closure needs a named obstruction
        and an argument that actually holds. Here the named obstruction
        ("no decomposition exists anywhere") is not a fatigue report wearing
        a number -- it is a specific, falsifiable factual claim, and it is
        false. This is a stronger defect than an unmeasured obstruction: it
        is a measured claim contradicted by evidence one hop away from
        material the producer itself cites as read.
      what_is_not_affected: >-
        No numeric scalar changes: archive_scheduled_bytes, archive_over_cap_bytes,
        communication_scheduled_bytes, communication_over_cap_bytes,
        output's own itemization, DERIV-1, the occupancy bound, and the
        HA-2 proof are all untouched by this finding. This is narrowly
        scoped to item D's ACHIEVABILITY CLAIM, not to any other residual.
      required_control: >-
        Re-open item D. Either (a) cite
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-68ea16/tasks/TASK-20260811-cb5d76/physical-frontier-compiler.yaml's
        archive_hashing_mount_state_scaling section and supply the 5-row
        per-ladder-size archive itemization it already contains (with its
        own disclosed uncertainty note reproduced, since it is an inferred
        x3 multiplier, not a directly-stated formula, and a competing
        additive-delta alternative giving 7713503488 was also computed
        there), plus the total-level x3 relationship for communication
        (with the same "no named sub-class" caveat honestly carried
        forward); or (b) if the Coordinator judges the BATCH-68ea16 basis
        insufficiently strong to satisfy item D's spirit, say so explicitly
        with a reason, rather than asserting the basis does not exist. The
        cheapest control is re-running the "grep every occurrence of
        'mount'" search across the FULL repository (not scoped to
        experiments/EXP-SYC-*/) and following every hash-pinned
        predecessor_artifacts binding at least one hop past the
        specification.yaml files already read -- purely mechanical,
        zero-run, no implementation required.

  RT_OBJ3_RT_OBJ4_continuity_check:
    id: RT-OBJ3-RT-OBJ4-NOT-NARROWED
    disposition: PASS
    finding: >-
      Grepped RT-OBJ3/RT-OBJ4 across all five frozen YAML artifacts of this
      successor. Every instance uses the identical parenthetical scope
      ("crossover-N estimate" / "k-list/generalized-birthday baseline") and
      the identical disposition language ("OPEN, NON-BLOCKING... DEFERRED to
      a future batch; not closed, not folded into another item, and not
