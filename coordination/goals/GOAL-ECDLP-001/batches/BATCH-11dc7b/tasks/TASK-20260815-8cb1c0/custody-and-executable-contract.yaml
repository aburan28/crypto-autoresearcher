    # =========================================================================
    # ITEM B FIX. "14-bit index" corrected to "13-bit index" below.
    # 2^13 = 8192 >= 8185, so 13 bits suffice; 2^12 = 4096 < 8185 is
    # insufficient. The qualitative point (13 bits still needs a byte-aligned
    # U16, still strictly worsens the open residuals) is unchanged.
    # =========================================================================
    width_widening_considered_and_refused:
      option: widen candidate_index to at least 8*(L-1)+1 admissible values
      consequence_at_bits_30: at least 8185 values, hence at least a 13-bit index
      arithmetic: '2^13=8192 >= 8185, so 13 bits suffice; 2^12=4096 is insufficient; minimal width is 13'
      item_B_repair_note: >-
        Predecessor EXP-SYC-793304 stated "at least a 14-bit index" here; that
        was an arithmetic error (2^13=8192 already covers 8185 admissible
        values). Corrected to "13-bit" per checkpoint BATCH-86fd69 item B.
      effect_on_open_residuals: >-
        13 bits still does not fit in a byte, so this route still requires at
        least a byte-aligned U16 and therefore still at least doubles the
        per-index width from U8, cannot reduce, and would worsen the already-
        open output, archive, and communication residuals. This route remains
        NOT-taken and NOT-authorized; only the bit-count arithmetic is
        corrected.
      authorized: false
      performed: false

  peak_memory_custody:
    rule: 'peak_live_bytes_system = max_t( shared(t) + sum_j concurrent_nonshared_shard_j(t) - dedup(t) )'
    shards_required: 8
    streams_required: 9
    stream_list: shared/setup context plus one complete allocation-event stream per BSGS shard
    receipt_requirement: >-
      one complete timestamped allocate/free event stream per shard plus the
      shared context stream, all on one host monotonic clock; every stream
      participates in the time-aligned aggregate, not in a maximum
    missing_shard: invalidates
    missing_shared_stream: invalidates
    multi_host_execution: invalidates
    sampled_or_polled_census: invalidates
    averaging_or_dividing: forbidden
    reuse_of_a_five_way_maximum: forbidden
    no_invariance_claim: true
    dedup_custody:
      definition: >-
        dedup(t) = sum over physical pages P live at t of (c_P(t) - 1) *
        bytes(P), where c_P(t) counts how many of the nine accounting terms
        charge P at t
      evidence_requirement: page-level census
      unproved_duplication: set to zero, so it can never reduce the reported peak
      shared_counted_exactly_once: true
    kats: coordination/goals/GOAL-ECDLP-001/batches/BATCH-11dc7b/tasks/TASK-20260815-8cb1c0/verification-and-null-kats.yaml
    kats_note: >-
      KAT-PEAK-1 through KAT-PEAK-6 are byte-identical to EXP-SYC-793304's.
      KAT-PEAK-7 is new, repairing item C (partial-overlap coverage gap).
    measured_values_present: false
    new_residual:
      id: PEAK-AGGREGATE-FIT-UNPROVED
      statement: >-
        the unchanged maximum_memory_gb ceiling of 2 binds an aggregate over
        nine concurrently live streams rather than a per-shard maximum; the
        aggregate can exceed any single per-shard figure by up to eightfold and
        no byte figure exists, so fit is unproved. Unchanged from
        EXP-SYC-793304; not targeted by items A-D and not repaired here.
      cap_raised: false
      disposition: OPEN_CARRIED_FORWARD

