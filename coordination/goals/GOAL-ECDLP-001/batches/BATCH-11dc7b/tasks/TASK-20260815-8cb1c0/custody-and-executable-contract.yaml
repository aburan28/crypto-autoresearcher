        against the corpus, not merely against the six frozen files.
      finding: >-
        archive_scheduled_bytes (5563755264) and communication_scheduled_bytes
        (5614086912) appear ONLY as opaque scalars in
        specification.yaml, custody-and-executable-contract.yaml, and
        physical-frontier-compiler.yaml across the entire
        EXP-SYC-12de89 -> EXP-SYC-b11b38 -> EXP-SYC-793304 chain. No named
        archive mount, no named communication stream, and no per-shard or
        per-stage attribution formula for either total exists anywhere in that
        chain. The only "three-mount" concept found anywhere in the wider
        EXP-SYC-* family is
        experiments/EXP-SYC-268d6f/specification.yaml's
        mount_states: [true_secret_mounted_outside_sandbox,
        decoy_secret_mounted_outside_sandbox, no_secret_present] -- a sandbox
        NONINTERFERENCE-COVERAGE concept describing which secret, if any, is
        mounted outside the sandbox for a given trial, unrelated to byte
        accounting for archive or communication traffic. The nearest numeric
        candidates in physical-frontier-compiler.yaml,
        group_additions.scheduled (2267225191) and
        logical_traffic_bytes.scheduled (790546390912), neither sum to nor
        otherwise derive 5563755264 or 5614086912 by any relationship stated
        in the inherited design.
      rejected_non_options: >-
        An even split of archive_scheduled_bytes across the 8 candidate/rho/
        bsgs shards (5563755264/8 = 695469408 per shard), or any other
        partition constructed purely to sum to the right total, was considered
        and REJECTED: nothing in the inherited design states that archive or
        communication traffic is attributed per-shard, per-stage, or by any
        other named partition. Presenting such a split as a "decomposition"
        would be exactly the fabrication this task is required to refuse.
      disposition: NOT_ACHIEVABLE_WITHOUT_FABRICATION
      residual_id: ITEM-D-ITEMIZATION-NOT-ACHIEVABLE-WITHOUT-FABRICATION
      residual_status: RESIDUAL_REPAIR_NOT_COMPLETED
      distinct_from_repaired: true
      what_is_unchanged: >-
        archive_scheduled_bytes, archive_hard_cap_bytes, archive_over_cap_bytes,
        communication_scheduled_bytes, communication_hard_cap_bytes,
        communication_over_cap_bytes are all left EXACTLY as inherited and
        unitemized. output_manifest's own twelve-row itemization is unaffected
        and unchanged (it rests on twelve actually-named files with
        independently stated sizes, a structurally different situation from
        archive/communication's opaque scalars).
      cross_referenced_in:
        - experiments/EXP-SYC-edf98d/specification.yaml items_A_through_D_repairs.D-ARCHIVE-COMMUNICATION-ITEMIZATION-GAP
        - physical-frontier-compiler.yaml capacity_fit_residuals
      what_would_close_this: >-
        Either (a) a future implementation-design task that defines named
        archive mounts and communication streams for the first time, with each
        row's byte count derived from a stated formula over those named
        elements rather than reverse-fit to sum correctly, or (b) an explicit
        Coordinator statement, on review of this residual, that output's
