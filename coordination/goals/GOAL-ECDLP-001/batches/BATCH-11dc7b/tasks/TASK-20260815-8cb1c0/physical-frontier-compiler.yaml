  candidate_index_occupancy:
    capacity: 32
    width: U8_0_through_31
    tuple_count_per_size: 98304
    tuple_identity: 32*256*4*3=98304
    correspondence:
      hypothesis_variable: >-
        X is the number of distinct exact matching A values for one frozen
        (curve, root, public model) root before the Boolean V/S bridge.
      compiler_field: >-
        candidate_index is the zero-based ordinal of a retained distinct
        candidate within one (curve, root, public model, eta) accounting tuple.
      eta_rule: >-
        eta is a preregistered finite-size analysis stratum, not a new root
        draw. For each eta tuple the candidate_index occupancy equals that
        root/model X after the same exact-match and retention rules; eta does
        not multiply occupancy inside a tuple.
      expected_value_rule: >-
        HA-2 supplies expected occupancy per tuple E[X], conditional on its
        heuristic and the finite calibration convention. It does not supply a
        deterministic occupancy, a per-tuple tail beyond Markov, independence
        across tuples, or a maximum-over-98304-tuples guarantee.

    deterministic_worst_case:
      formula: selected_pair_comparisons[bits] / 98304 = 8*(L(bits)-1)
      rows:
        - {bits: 18, L: 64, bound: 504, exceeds_capacity_by: 472}
        - {bits: 21, L: 128, bound: 1016, exceeds_capacity_by: 984}
        - {bits: 24, L: 256, bound: 2040, exceeds_capacity_by: 2008}
        - {bits: 27, L: 512, bound: 4088, exceeds_capacity_by: 4056}
        - {bits: 30, L: 1024, bound: 8184, exceeds_capacity_by: 8152}
      multiplicity_note: >-
        Every retained candidate must originate from a charged
        selected_pair_comparisons event; polynomial multiplicity cannot create
        an uncharged candidate outside this event census.
      preserved_unweakened: true

    HA2_expected_case:
      source_hypothesis: H-SYC-b854f4
      formula: E[X] = N^(-1/3 + gamma_x + o(1))
      finite_ladder_convention: >-
        For the arithmetic KAT only, set the unspecified o(1) correction to zero
        and use N=2^bits. These decimals are symbolic finite reference values,
        not observed estimates or rigorous finite-N tail bounds.
      convention_scope: mean arithmetic only; explicitly refused for any tail statement
      rows:
        - {bits: 18, N: 262144, L: 64, ha2_threshold_gamma_x: 5/18, ha2_threshold_expected_X: '0.5000000000000000', cap_over_expected_X_margin: '64.000000000000', ha2_ceiling_gamma_x: 1/3, ha2_ceiling_expected_X: '1.0000000000000000', ceiling_cap_over_expected_X_margin: '32.000000000000'}
        - {bits: 21, N: 2097152, L: 128, ha2_threshold_gamma_x: 5/18, ha2_threshold_expected_X: '0.4454493590701696', cap_over_expected_X_margin: '71.837571091800', ha2_ceiling_gamma_x: 1/3, ha2_ceiling_expected_X: '1.0000000000000000', ceiling_cap_over_expected_X_margin: '32.000000000000'}
        - {bits: 24, N: 16777216, L: 256, ha2_threshold_gamma_x: 5/18, ha2_threshold_expected_X: '0.3968502629920499', cap_over_expected_X_margin: '80.634947193272', ha2_ceiling_gamma_x: 1/3, ha2_ceiling_expected_X: '1.0000000000000000', ceiling_cap_over_expected_X_margin: '32.000000000000'}
        - {bits: 27, N: 134217728, L: 512, ha2_threshold_gamma_x: 5/18, ha2_threshold_expected_X: '0.3535533905932738', cap_over_expected_X_margin: '90.509667991878', ha2_ceiling_gamma_x: 1/3, ha2_ceiling_expected_X: '1.0000000000000000', ceiling_cap_over_expected_X_margin: '32.000000000000'}
        - {bits: 30, N: 1073741824, L: 1024, ha2_threshold_gamma_x: 5/18, ha2_threshold_expected_X: '0.3149802624737183', cap_over_expected_X_margin: '101.593667325965', ha2_ceiling_gamma_x: 1/3, ha2_ceiling_expected_X: '1.0000000000000000', ceiling_cap_over_expected_X_margin: '32.000000000000'}
      threshold_margin_range: 64.000000000000 through 101.593667325965
      ceiling_margin: 32.000000000000 at every ladder size
      literals_propagated_verbatim_from: >-
        ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-080a9c.yaml preserved_repairs
      conclusion: >-
        The expected per-tuple value remains below capacity 32 at both gamma_x
        slices under the stated convention. This is a mean statement only. It
        certifies neither aggregate compiler occupancy nor overflow probability.

    HA2_tail_contract:
      tuplewise:
        status: SUPPLIED_SHARP_NON_CERTIFYING
        bound: 'P(X >= 33) <= mu/33'
        values: {bits_18: '0.015151515152', bits_21: '0.013498465426', bits_24: '0.012025765545', bits_27: '0.010713739109', bits_30: '0.009544856439', ceiling_gamma_x_1_over_3: '0.030303030303'}
        serialization_convention: twelve decimal places, half-up rounding of the long division
        item_A_note: relabeled from "truncation of the long division"; stored values unchanged.
      familywise:
        status: NOT_SUPPLIED_PROVED_UNAVAILABLE
        union_bound: '98304 * mu / 33 = 2978.909090909091 * mu'
        values: {bits_18: '1489.454545', bits_21: '1326.953145', bits_24: '1182.180856', bits_27: '1053.203409', bits_30: '938.297567', ceiling_gamma_x_1_over_3: '2978.909091'}
        vacuous_at_every_size: true
        second_moment_route: >-
          also vacuous: non-vacuity would require kappa*mu <= 0.011077880859375
          while kappa >= 1 and mu >= 0.3149802624737183 on this ladder
      worst_case:
        status: SUPPLIED_AND_NEGATIVE
        bound: 8*(L-1)
        adequacy: FAIL_not_worst_case_safe
      route_b_bit_width_note: >-
