        - {bits: 27, N: 134217728, worst_case_per_tuple_bound: 4088, expected_occupancy_literal: '0.0000304579734802', margin_vs_32: 1050628.007828}
        - {bits: 30, N: 1073741824, worst_case_per_tuple_bound: 8184, expected_occupancy_literal: '0.0000076219439507', margin_vs_32: 4198404.00391}
      authority: non-authoritative regression table; the HA-2 rows above govern calibration
      bits27_correct_literal: '0.0000304579734802'
      bits27_exact_identity: 4088 / 134217728 = 0.000030457973480224609375
      changed_in_this_successor: none

    overflow: >-
      any realized tuple occupancy above 32 invalidates without truncation,
