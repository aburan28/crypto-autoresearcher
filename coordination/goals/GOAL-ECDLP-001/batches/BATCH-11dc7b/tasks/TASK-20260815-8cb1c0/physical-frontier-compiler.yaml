  peak_live_bytes_accounting:
    composition: >-
      time_aligned_aggregate_of_all_concurrently_live_streams_with_shared_counted_once
    system_rule: 'peak_live_bytes_system = max_t( shared(t) + sum_j concurrent_nonshared_shard_j(t) - dedup(t) )'
    shard_index_range: j = 1 through 8
    synchronized_time_base:
      clock: one host monotonic clock, CLOCK_MONOTONIC_RAW, single source for all nine streams
      event_model: timestamped signed byte deltas forming right-continuous step functions
      evaluation: exact at every event timestamp in the merged event set
      sampling: forbidden
      multi_host: invalidates; no cross-host peak may be reported
      skew_tolerance: zero by construction; a single clock source is required rather than a measured skew bound
    dedup_term:
      definition: 'dedup(t) = sum over physical pages P live at t of (c_P(t) - 1) * bytes(P)'
      range: '0 <= dedup(t) <= sum_j nonshared_j(t)'
      unproved_duplication: set to 0
      shared_counted_exactly_once: true
    interval_arithmetic:
      lower: 'max_t( shared_lo(t) + sum_j nonshared_lo_j(t) - dedup_hi(t) )'
      upper: 'max_t( shared_hi(t) + sum_j nonshared_hi_j(t) - dedup_lo(t) )'
      dedup_lo_default: 0
      applies_to: candidate stage, rho stage, and BSGS stage alike
    bounds:
      lower_bound_rule: 'max_j max_t nonshared_j(t) <= peak_live_bytes_system'
      upper_bound_rule: 'peak_live_bytes_system <= max_t shared(t) + sum_j max_t nonshared_j(t)'
      coincide_only_when: all per-stream peaks are simultaneous
    stage_reporting_rule: >-
      the reported axis value is the single global max over t across the whole
      run; per-stage aggregates are diagnostic only and their maximum equals the
      global value only if the stages are evidenced to be time-disjoint
    census_completeness:
      streams_required: 9
      missing_stream: invalidates
      averaging_or_dividing: forbidden
      reuse_of_a_five_way_maximum: forbidden
    eight_way_effect: >-
      The eight-way BSGS baseline contributes eight concurrently live non-shared
      allocations that are now summed at aligned times rather than maximized
      across streams. Widening from five to eight can change the system peak;
      no shard-invariance is proved or asserted.
    kats: coordination/goals/GOAL-ECDLP-001/batches/BATCH-11dc7b/tasks/TASK-20260815-8cb1c0/verification-and-null-kats.yaml
    kats_note: KAT-PEAK-1 through KAT-PEAK-6 byte-identical to predecessor; KAT-PEAK-7 new (item C).
