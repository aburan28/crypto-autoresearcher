  item_by_item:

    - item_id: A-MARKOV-SERIALIZATION-MISLABEL
      severity: required_before_next_revision
      disposition: REPAIRED
      what_was_wrong: >-
        specification.yaml's contract_2_tuplewise_tail and
        verification-and-null-kats.yaml's KAT-HA2-TUPLEWISE-MARKOV both stated
        the twelve-decimal-place values were "truncation of the long
        division." Independent recomputation showed 3 of 5 rows (bits 18, 27,
        30) actually match half-up ROUNDING, not truncation (true truncated
        values 0.015151515151 / 0.010713739108 / 0.009544856438, one ULP below
        stored). Numbers were correct and in fact slightly more conservative;
        only the stated derivation method was wrong.
      approach_chosen: relabel_to_half_up_rounding_keep_stored_values
      approach_rejected: recompute_the_three_rows_to_true_truncation
      why_relabel_over_recompute: >-
        Recomputing to true truncation would force recomputing and
        re-verifying every downstream citation of the stored values
        (range_gamma_x_5_over_18, the independent_corroboration text quoting
        TASK-20260813-e04de4's identical range endpoints
        '0.009544856439_to_0.015151515152', the ceiling_row, and any
        cross-artifact numeric-consistency citation), for a purely mechanical
        label fix. The stored values are correct and slightly more
        conservative under half-up rounding, so relabeling repairs the
        checkpoint's finding with zero recomputation risk.
      what_this_successor_does: >-
        specification.yaml's contract_2_tuplewise_tail.serialization_convention
        and verification-and-null-kats.yaml's
        KAT-HA2-TUPLEWISE-MARKOV.serialization both now read "twelve decimal
        places, half-up rounding of the long division", applied identically in
        both files. The five stored decimal rows (bits 18/21/24/27/30) and the
        ceiling row are byte-identical to EXP-SYC-793304.
      unaffected_rows: {bits_21: '0.013498465426', bits_24: '0.012025765545'}
      fallback_used: false
      degraded: false

    - item_id: B-BITWIDTH-14-VS-13-ERROR
      severity: required_before_next_revision
      disposition: REPAIRED
      what_was_wrong: >-
        Three artifacts (specification.yaml, this report, and
        custody-and-executable-contract.yaml) stated widening candidate_index
        to 8185 admissible values "needs at least a 14-bit index." 2^13=8192
        >= 8185, so 13 bits suffice; 2^12=4096 is insufficient. Minimal width
        is 13, not 14.
      what_this_successor_does: >-
        "14-bit index" corrected to "13-bit index" (arithmetic: 2^13=8192 >=
        8185, 2^12=4096 insufficient) in all three occurrences: this file
        (immediately below), specification.yaml's
        blocker_repairs.HA2-EXPECTATION-NOT-TAIL.contract_3_simultaneous_tail.cost_of_the_missing_simultaneous_tail,
        and custody-and-executable-contract.yaml's
        candidate_custody.width_widening_considered_and_refused.consequence_at_bits_30.
      this_files_own_occurrence_repaired: >-
        THE NAMED REPAIR ROUTES ARE NOT TAKEN HERE: a new numbered finite-N
        tail heuristic with a ladder-scale occupancy-distribution validation
        control, or widening candidate_index to at least 8*(L-1)+1 values,
        which at bits 30 needs at least a 13-bit index (2^13=8192 >= 8185) and
        therefore strictly worsens all three open capacity residuals, since 13
        bits still does not fit a byte and still requires at least a
        byte-aligned U16.
      qualitative_point_preserved: >-
        13 bits still does not fit in a byte, so widening candidate_index
        still requires at least a byte-aligned U16 and still strictly worsens
        the output/archive/communication residuals. This route remains
        NOT-taken and NOT-authorized; only the bit-count arithmetic is
        corrected, nothing else in this section changed.
      fallback_used: false
      degraded: false

    - item_id: C-PEAK-KAT-PARTIAL-OVERLAP-COVERAGE-GAP
      severity: required_before_the_peak_kat_suite_is_treated_as_sufficient
      disposition: REPAIRED
      what_was_wrong: >-
        All six current KATs test only full-coincidence or full-disjointness
        shard topologies. Red Team constructed a concrete counterexample:
        shard j (j=1..8) live on [j,j+4), shared=0, dedup=0 -- correct peak is
        4 throughout the interior, a value none of the six KATs would catch a
        wrong implementation missing (e.g. one that special-cases only the two
        extreme topologies).
      what_this_successor_does: >-
        KAT-PEAK-7 (name: partial-staircase-overlap-eight-shards) added to
        verification-and-null-kats.yaml's peak_aggregate_kats.fixtures, using
        the exact fixture specified by the checkpoint: shard j allocates 1
        byte at t=j and frees it at t=j+4, for j=1..8; shared_t=0; dedup_t=0;
        expected_peak_live_bytes=4; must_reject full-coincidence-special-case
        (wrong_value 8) and full-disjointness-special-case (wrong_value 1).
        KAT-PEAK-7 is added to aggregate_kat_summary.additional_discriminators,
        not to mandated_by_checkpoint, which remains KAT-PEAK-1 through
        KAT-PEAK-4 exactly as inherited. KAT-PEAK-1 through KAT-PEAK-6 are
        copied byte-identical from EXP-SYC-793304.
      fixture_verbatim:
        id: KAT-PEAK-7
        events: shard j allocates 1 byte at t=j and frees it at t=j+4, for j = 1..8
        shared_t: 0 at every t
        dedup_t: 0 at every t
        sample_point_1: {t: 4.5, live_shards: [1, 2, 3, 4], aggregate: 4}
        sample_point_2: {t: 5.5, live_shards: [2, 3, 4, 5], aggregate: 4}
        expected_peak_live_bytes: 4
        must_reject:
          - {wrong_rule: full-coincidence-special-case, wrong_value: 8}
          - {wrong_rule: full-disjointness-special-case, wrong_value: 1}
      fallback_used: false
      degraded: false

    - item_id: D-ARCHIVE-COMMUNICATION-ITEMIZATION-GAP
      severity: required_before_capacity_residuals_are_treated_as_independently_re-derivable
      disposition: NOT_ACHIEVABLE_WITHOUT_FABRICATION
      what_was_wrong: >-
        The output residual has a 12-row itemized manifest independently
        re-summed by both prior reviewers to exactly 15520768. Archive
        (5563755264 scheduled, 2307745600 cap) and communication (5614086912
        scheduled, 2328717120 cap) are opaque scalars with no itemized
        breakdown anywhere.
      this_task_own_independent_re_check: >-
        This task independently re-read all six frozen EXP-SYC-793304
        artifacts plus the inherited EXP-SYC-b11b38 and EXP-SYC-12de89
        specification.yaml files, and grepped every occurrence of "mount"
        across the entire EXP-SYC-* experiment family (not just the six frozen
        files) to test the checkpoint's own "per-mount" framing against the
        full corpus. Full detail:
        custody-and-executable-contract.yaml archive_and_communication.item_D_itemization_attempt.
      finding: >-
        No named archive mount, communication stream, or per-shard/per-stage
        byte-attribution formula for either scheduled total exists anywhere in
        the inherited chain. The only "three-mount" concept present anywhere
        in the wider EXP-SYC-* family is
        experiments/EXP-SYC-268d6f/specification.yaml's sandbox
        noninterference mount_states (true_secret_mounted_outside_sandbox /
        decoy_secret_mounted_outside_sandbox / no_secret_present), which
        describes which secret is mounted outside the sandbox for a given
        trial and has no byte-accounting relationship to archive or
        communication traffic. physical-frontier-compiler.yaml's
        group_additions.scheduled (2267225191) and
        logical_traffic_bytes.scheduled (790546390912) neither sum to nor
        otherwise derive 5563755264 or 5614086912 by any stated relationship.
        This independently confirms, rather than merely repeats, the task
        card's own coordinators_own_pre_check.
      what_this_successor_does_instead: >-
        This task did NOT invent an archive/communication row partition (for
        example an even 8-way shard split, 5563755264/8 = 695469408 per shard,
        was considered and explicitly rejected as fabrication). It recorded
        the residual honestly: ITEM-D-ITEMIZATION-NOT-ACHIEVABLE-WITHOUT-FABRICATION,
        status RESIDUAL_REPAIR_NOT_COMPLETED, distinct from "repaired", in
        custody-and-executable-contract.yaml's archive_and_communication
        section, cross-referenced in specification.yaml and
        physical-frontier-compiler.yaml.
      unchanged: >-
        archive_scheduled_bytes (5563755264), archive_hard_cap_bytes
        (2307745600), archive_over_cap_bytes (3256009664),
        communication_scheduled_bytes (5614086912), communication_hard_cap_bytes
        (2328717120), communication_over_cap_bytes (3285369792), and
        output_manifest's existing twelve-row itemization are all left exactly
        as inherited from EXP-SYC-793304.
      why_this_is_the_preferred_outcome: >-
        Per this task's own handoff constraints: "A REVISE_WITH_EXACT_RESIDUALS
        return -- including 'item D could not be honestly completed' -- is a
        legitimate and preferred outcome to a fabricated fit." A contract that
        fabricated plausible-looking archive/communication rows would satisfy
        the letter of the checkpoint's requirement while violating its purpose
        (independent re-derivability from a real basis), which is a worse
        outcome than an honest, well-documented non-closure.
      fallback_used: false
      degraded: false

