  protocol_deviations:
    - id: PD-1
      severity: declared_and_required_by_the_contract_itself
      title: the per-arm harvest wrapper is an instrumented copy, not the original
      detail: >-
        harvest() in ds001_ctrl_matched_null.py is a copy of
        ds001_ctrl_unplanted.harvest_real with instrumentation added. The
        complete unified diff is computed at runtime by difflib and archived
        verbatim in raw-result.json under
        algorithm_invariance.harvest_wrapper_diff, exactly as
        CTRL-RT047-MATCHED-NULL.algorithm_invariance.binding requires when the
        object cannot be swapped without touching surrounding code.
      why_it_was_unavoidable: >-
        The control's own required_per_arm_fields mandates n_enum,
        per_arm_capped_attempt_count and peak_rss_bytes for EVERY arm, and the
        reviewer additionally recommended claw_table_build_count.
        harvest_real emits none of these, so the contract could not be satisfied
        by calling it unmodified.
      what_the_copy_adds: >-
        Accumulation of ar.n_enumerations; a capped-attempt counter and a
        separate arm-budget-truncated counter; per-arm RSS sampling;
        claw_table_build_count; a backend_object label; and a cert_fn parameter
        so each object supplies its own certificate constructor.
      what_the_copy_does_not_change: >-
        The search calls, the deadline arithmetic min(arm_deadline, seg0 +
        PER_TARGET_CAP_SECONDS), the charging, the stopping rule, the for/else
        stop-reason logic, the overhead accounting, and the amortization
        structure - the claw table is built ONCE before the target loop exactly
        as in harvest_real.
      does_it_advantage_any_arm: >-
        No. The same wrapper serves all four matched-null and real arms;
        harvest_legacy_null is the corresponding instrumented copy of
        harvest_null and serves both legacy arms.
      search_logic_touched: false
    - id: PD-2
      severity: minor_disclosure
      title: a mechanics smoke test preceded the authoritative run
      detail: >-
        One smoke test was executed at --relations 5 --real-targets 60 writing
        only into the session scratchpad. It produced no run-package artifact
        and no number in this package, and it was run to validate wiring rather
        than to select a result. Exactly one authoritative execution was then
        performed under maximum_runs 1, and it is the one recorded. Disclosed
        rather than omitted.

  anomalies:
    - id: AN-1
      class: infrastructure_note
      title: the 8 GB memory cap could not be enforced on this host
      detail: >-
        resource.setrlimit raised "ValueError - current limit exceeds maximum
        limit" for RLIMIT_AS, RLIMIT_DATA and RLIMIT_RSS on this macOS host, so
        the cap was requested but not applied. The errors are recorded in
        budget.memory_cap_errors and environment.json. This is identical to the
        BATCH-020 host behaviour and is not new. Observed peak RSS was 70434816
        bytes against an 8 GB allowance, so the unenforced cap did not bind.
      affects_result: false
    - id: AN-2
      class: unexpected_observation
      title: >-
        the two objects yield identical claw-table entry counts but different
        distinct-key counts
      detail: >-
        AUXILIARY POST-RUN OBSERVATION, computed outside the run and NOT a
        run-package number. Rebuilding the claw table for both objects gives
        identical entry counts (8256, which is C(129,2) over 128 signed
        elements) but different distinct KEY counts - 4079 on the curve versus
        8159 on the additive object. Cause - a curve point and its negation
        share an x-coordinate, so encode_intermediate maps P and -P to the same
        claw key, whereas residues g and N-g are distinct. This is an inherent
        consequence of removing the curve, and the control prescribes exactly
        the encoding used (element equals residue, join equals equality of
        residues). Recorded because it is a real asymmetry between the two
        objects that the word "matched" does not by itself cover.
      executor_conclusion: none
    - id: AN-3
      class: scope_limitation
      title: no object-cost-parity measurement was performed
      detail: >-
        The per-operation cost of modular addition versus curve addition on this
        host was not measured. It is outside this run's scope and is named in
        reviewer defect DEF-4 as a condition on certain readings.
    - id: AN-4
      class: scope_limitation
      title: object structure and factor-base selection policy remain confounded
      detail: >-
        The real arm's base is the frozen deterministic subset of E(F_p) while
        the matched-null base is uniform random residues, because a
        deterministic-subset policy has no meaning without a curve and reusing
        curve x-coordinates is forbidden by the control. The matched null
        therefore differs from the real object along two axes rather than one.
        This is reviewer defect DEF-5 and it is carried, not resolved here.
    - id: AN-5
      class: statistical_limitation
      title: only the overhead-unresampled bootstrap estimator was computed
      detail: >-
        RT047-M1's advisory is carried verbatim in the artifacts. An
        overhead-resampled variant was not constructed because that would
        introduce new statistics and CTRL-RT047-MATCHED-NULL forbids new
        mathematics in this run. Stating plainly that only the current estimator
        was computed is the second option the control permits.
    - id: AN-6
      class: cost_model_note
      title: rho calibration is a curve capture reused on the additive object
      detail: >-
