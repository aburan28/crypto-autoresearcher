  required_controls:

    - id: RT048-CTRL-1
      priority: 1
      name: HEUR-DS-1 ON THE CORRECT OBJECT - the cheapest experiment that touches the mechanism at all
      why_this_one: >-
        Nothing in this series has ever exercised the smoothness mechanism, and
        the one HEUR sampling that was run (EV-DS-002, F3) sampled the WRONG
        QUANTITY - RT047-H2 shows the sampled object was
        encode_intermediate of a curve x-coordinate, which at bits 20 / m 4 is
        provably the identity on a value below 2**20, while HEUR-DS-1 is about a
        half-arity Semaev intermediate bounded by D = 2**40. The two differ by a
        factor of 2**20 in magnitude. So the heuristic's own validation
        experiment has not been run on the object the heuristic is about.
      protocol: >-
        No search arms, no timing, no cost identity, no R. At the frozen toy
        cells bits in {16, 20} and m = 4, compute the ACTUAL half-arity Semaev
        partial-map intermediate (the resultant of the summation polynomial
        against the half-tuple) for at least 10**5 uniform random half-tuples
        over the frozen factor base; record the largest prime factor and the
        B-smoothness indicator of each; compare the empirical CDF against
        Dickman rho(u) with u = log D / log B using the pre-registered KS and
        tail thresholds already frozen in EXP-DS-001.
      null_object_control_mandatory: >-
        Run the IDENTICAL measurement on uniformly random integers of the same
        bitlength. This is the null-object control that inventor-protocol
        section 3.2 requires and that the sampled-quantity confusion has so far
        prevented. A matching CDF is a controlled null and says the structured
        intermediate is not smoother than a random integer of its size, which is
        precisely what HEUR-DS-1 asserts and has never been tested.
      the_parameter_that_should_destroy_it: >-
        u = log D / log B. Sweep B (or D) so that u ranges over at least
        [2, 6]. The B-smooth fraction MUST decay like u**(-u(1+o(1))) per
        Canfield-Erdos-Pomerance. A smooth fraction that stays flat as u grows is
        the canonical artifact tell (inventor-protocol section 3.1) and would
        indicate the sampled quantity is not the intermediate.
      cost: >-
        Minutes to low hours. No search, no new dependencies beyond the sympy
        1.14.0 already recorded in environment.json. It is a NEW experiment, not
        a control on EXP-DS-001, because it requires summation-polynomial
        arithmetic that CTRL-RT047-MATCHED-NULL's new_dependencies clause forbids
        in that lane.
      anti_pattern_to_forbid_explicitly: >-
        DO NOT simply set smoothness_abort = true on the existing arms and call
        the mechanism exercised. At these parameters that would call is_B_smooth
        on an identity-encoded x-coordinate below 2**20 with B = 64 - a
        stand-in, not the Semaev intermediate - and would produce a false
        "mechanism exercised" tick on the ledger while testing nothing. If it is
        run at all it must be labelled a plumbing check.

    - id: RT048-CTRL-2
      priority: 2
      name: RT047-CTRL-1 VARIANT (b) - keep E(F_p), randomize only the factor base
      protocol: >-
        One arm pair. Retain E(F_p) exactly as in this run; replace the frozen
        deterministic-subset factor base with 64 uniformly random curve
        x-coordinates (negation-closed to 128 signed points); everything else
        unchanged, same seed discipline, both proxies reported.
      why_required: >-
        It is the discriminator RT-20260731-047 named for exactly the confound
        AN-4 and reviewer defect DEF-5 record - object structure is confounded
        with factor-base selection policy, so the matched null differs from the
        real object along TWO axes. RT048-B3 bounds the base-policy contribution
        to W at essentially zero on this cell by residual accounting, which makes
        variant (b) confirmatory rather than urgent, but it remains the only
        DIRECT separation and is essentially free.
      cost: Under 60 seconds, no new mathematics.

    - id: RT048-CTRL-3
      priority: 3
      name: RT047-CTRL-2 B-SWEEP - the artifact tell that is still unmeasured
      protocol: >-
        Same cell, B in {32, 64, 128, 256}, on BOTH the curve and
        NULL-DS-ADDITIVE-Z753848, recording W, U, n_enum per arm,
