  narrowest_supported_statement: >-
    At exactly one toy cell (curve group order 753848 over p = 752627 with
    prime-order subgroup n = 241, matched null Z/753848Z, 64 unsigned / 128
    signed factor-base elements on each object, m = 4, seed 101, 200 relations
    per arm, unplanted uniform random targets, smoothness_abort false, backend
    ds001-v2-point-sum-membership+charged-units-v1, one unreplicated run on one
    macOS arm64 host), the identical depth-2 hash-join meet-in-the-middle
    collected 200 independently certificate-verified relations on an object with
    no elliptic curve, no x-coordinate and no Semaev structure at a wall ratio of
    0.04718 and a charged-unit ratio of 0.014736 against the naive depth-3
    enumeration, versus 0.031116 and 0.014653 on the curve measured in the same
    session on the same host; 1200 of 1200 certificates re-verified across six
    arms through three independent verifier paths; no arm capped, both split arms
    amortizing their claw table exactly once. The charged-unit limb of that
    comparison is a closed form in the signed factor-base size with expectation
    2/129 = 0.015504 and no dependence on the object, and the entire 1.52x wall
    difference is reproduced to within 0.6 percent by the per-enumeration cost of
    curve addition against modular addition recovered from the same four arms.
    The measurement is therefore silent about Semaev or multihomogeneous
    structure on both objects, for the reason recorded in H-DS-001's own
    mechanism_test_status before this run existed - the smoothness predicate was
    never called, the intermediate encoding is the identity, and the join is
    exact group equality. What is established is that the split arm's advantage
    at this cell is generic meet-in-the-middle worth about |signed|/2 in
    enumerations, available on any abelian group with any factor base; and
    consequently that the BATCH-020 R_null = 111.4 licensed no structure reading.
    Nothing here supports S1_met, `support` for H-DS-001, HEUR-DS-1 validation or
    refutation, any asymptotic or crypto-scale claim, any affected-scheme
    statement, or a Pareto win over any baseline - and equally, nothing here
    supports rejecting H-DS-001, closing the lane, or asserting that the
    mechanism fails, which has still never been executed once.

