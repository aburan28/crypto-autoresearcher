    licenses the frozen D-1 branch's scoped `weaken` of H-DS-001.

  # ====================================================================
  # PROCEDURAL POSTURE
  # ====================================================================
  procedural_posture:
    was_the_disposition_map_applied_as_frozen_or_bent_to_the_data: >-
      NEITHER, AS OF THIS SNAPSHOT - NO DISPOSITION HAS BEEN STATED BY ANYONE.
      I checked for a bent reading and did not find one. The Executor records
      `disposition_stated: false` in summary.json, `interpretation: NONE` in the
      execution report and the TASK-20260801-006 receipt, and routes
      classification to TASK-20260801-009 in every artifact. The F2 and R-1
      observation labels are recorded as arithmetic on the run's numbers and
      explicitly not adjudicated, which is exactly what reviewer defect DEF-2
      asked for. The map itself is hash-bound at a commit containing no run data.
      The bending risk in this batch is entirely PROSPECTIVE and sits in
      TASK-20260801-009's write-up, not in the package under review.
    what_the_frozen_map_yields_when_applied_mechanically: >-
      W = 0.04718148140369263 and U = 0.014736312270845113. Both are LOW
      (< 0.5), so D-1 fires. Against the LIVE re-measure anchors
      (W_real = 0.03111559673494141, U_real = 0.014652593415947846) the ratios
      are W/W_real = 1.5163 and U/U_real = 1.0057, both strictly between 0.5 and
      2, so the sub-branch is D-1a. Reviewer defect DEF-1's uncovered corner (a
      proxy strictly below half the re-measure) does not materialize and is moot
      on this data. All five D-5 guards are clear ON THE RUN'S OWN RECORD - 200
      relations on all six arms, 1200/1200 certificates re-verified, zero capped
      attempts, both split arms amortizing exactly once
      (claw_table_build_count 1), no undeclared code change, no timeout or
      resource exhaustion.
    conditionality_on_the_validator: >-
      MY REPORT IS CONDITIONAL. At the time of this review
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/reviews/TASK-20260801-007/
      does not exist in the tree; only TASK-20260801-003 is present. D-5 fires on
      "Validator returns INADMISSIBLE" and pre-empts D-1 through D-4. If
      TASK-20260801-007 returns INADMISSIBLE, everything in this report about
      D-1a is void and the disposition is inconclusive on the instrument.

  # ====================================================================
  # THE CENTRAL QUESTION
  # ====================================================================
  central_finding_is_the_null_too_good:
    question: >-
      Is this "the win is generic" or "the instrument never tested structure on
      either object"?
    ruling: >-
      IT IS THE SECOND, AND THE SECOND IS PRIMARY. "The win is generic" is also
      true, but it is a weaker and largely entailed corollary, and its headline
      form - that the advantage "transfers essentially in full" - is manufactured
      by the protocol's own matching choices on one proxy and by object
      arithmetic cost on the other. The two objects are NOT secretly the same
      computation in the trivial sense; they are genuinely two different groups.
      The precise statement is sharper and worse - THE DECISION VARIABLE DEPENDS
      ON NEITHER OBJECT. Both limbs of the frozen decision pair are quantities
      that a curve cannot influence through any channel this instrument opens.
      See objections RT048-B1 (U is a closed form in |signed| alone) and
      RT048-B3 (W's entire residual is per-operation arithmetic cost, recovered
      from this run's own numbers to 0.6 percent).
    what_the_artifacts_support_directly: >-
      The instrument-refutation reading is established by code inspection, not
      by the matched null, and it was already on the ledger BEFORE this run.
      H-DS-001.mechanism_test_status, recorded by DEC-20260801-003, states
      `exercised: false` with the reason that smoothness_abort has been false on
      every real arm in the series, is_B_smooth has never been called, the
      intermediate encoding is provably the identity (D = 2**40 against
      residues < 753848 < 2**20) and the join is exact group equality. This run
      re-confirms every one of those facts in its own
      algorithm_invariance.frozen_settings_honored block, on BOTH objects. The
      matched null therefore adds confirmation, not information, on the
      load-bearing point.
    what_the_matched_null_genuinely_adds: >-
      Three things, and they are real. (1) The generic-MITM reattribution moves
      from ARGUED (RT047-B2, from source reading) to MEASURED, on a second
      object, with 400 independently re-verified certificates on that object.
      (2) It permanently kills the R_null = 111 reading - a properly matched null
      puts the ratio at 0.047 wall / 0.0147 units, not >= 0.9, so the BATCH-020
      structure reading is dead by the standard the hypothesis itself named.
      (3) It supplies, as a by-product, enough per-arm data to recover the
      object-cost-parity measurement that AN-3 says was not performed
      (RT048-B3), which was a named precondition on future readings.
    consequences_that_differ_between_the_two_readings: >-
      Under "the win is generic", H-DS-001's structure conjunct has been tested
      and failed, and a hypothesis-level weaken is the natural disposition.
      Under "the instrument never tested structure on either object", nothing
      about H-DS-001's mechanism has been measured in either direction, the
      defect is in EXP-DS-001's v2 instrument, and the honest object of any
      weaken is the INTERPRETIVE CLAIM attached to R, not the hypothesis. The
      frozen D-1 branch already writes the narrow version - it scopes the weaken
      "EXACTLY to the claim that the measured R evidences Semaev/multihomogeneous
      structure" and states affirmatively that it is "NOT a finding that the
      mechanism fails, because the mechanism was never exercised". My finding is
      that the map got this right in its own text and that the entire remaining
      risk is a write-up that drops the scope. See RT048-B5.

  # ====================================================================
  objections:

    - id: RT048-B1
      severity: BLOCKING ON INTERPRETATION
      blocks_ledger_disposition: false
      advisory: false
      title: >-
        The U limb is not a measurement of anything - it is a closed form in the
        signed factor-base size, predicted a priori to 5 percent with no object
        as input
      target: >-
        Any statement that the two cost proxies independently confirm the
        transfer, or that U agreeing to 0.6 percent across two objects is
        evidence about those objects.
      statement: >-
        ds001_driver.charge_backend_units(m) returns the CONSTANT 40 for m = 4
        and is charged exactly once per enumerated candidate in naive_search
        (line 282) and once per table probe in split_search (line 493). Since
        both arms of each ratio reached n_usable = 200, U is therefore exactly
        the enumeration-count ratio. Recomputed from the run's own fields -
        51703 / 3508544 = 0.014736312270845113 on the additive object and
        47852 / 3265770 = 0.014652593415947848 on the curve, reproducing the
        reported figures to the last digit. Now the a-priori prediction. The
        naive arm hits with probability |signed| / N per enumeration; the split
        arm hits with probability (table entries) / N per enumeration. Both
        objects have |signed| = 128, m = 4, N = 753848, and table entries
        C(129,2) = 8256 - the last three matched by contract, the first by
        construction. Expected U = 128 / 8256 = 2 / (|signed| + 1) = 0.015504.
        N CANCELS. The object cancels. The group law cancels. The prediction
        contains only the factor-base size. Observed 0.014736 and 0.014653 sit
        5.0 percent and 5.5 percent below that single number, and the residual
        deviation is COMMON MODE, which is why the ratio of the ratios is 1.0057.
        This is reviewer defect DEF-7 upgraded from "close to a function of the
        enumeration counts" to an exact identity with a numerical prediction.
      which_way_it_cuts: >-
        Cuts AGAINST reading the near-perfect U transfer as a strong result, and
        equally AGAINST any attempt to rescue the BATCH-020 R by attacking the
        null - U was never going to differ between these two objects and does
        not. It does not impugn the measurement, which is correct.
      discharging_requirement: >-
        EV-DS-004 and the decision must state that U is the enumeration-count
        ratio, that its expected value 2/(|signed|+1) = 0.0155 is object-free,
        and that the discriminating limb of the frozen pair is W alone. The
        prose must not say "both proxies agree" without that sentence beside it.

    - id: RT048-B2
      severity: BLOCKING ON INTERPRETATION
      blocks_ledger_disposition: false
      advisory: false
      title: >-
        D-2 was unreachable at these parameters - the pre-registered favourable
        branch could not have fired on any object, so the map was one-sided on
        its U limb
      target: >-
        Any reading of "the run landed in the adverse branch" as a two-sided test
        that structure could have passed.
      statement: >-
        I applied the inventor-protocol section 3.1 discipline in the direction
        the task demands - I asked what the reported quantity should have done
        if the hypothesis were TRUE, and found it could not have done it. D-2
        requires U >= 0.9, i.e. n_enum_split >= 0.9 * n_enum_naive. But
        split_search enumerates right pairs over i <= j on 128 signed elements,
        so its per-target enumeration is HARD-CAPPED at C(129,2) = 8256, hence
        n_enum_split <= 200 * 8256 = 1,651,200 across the whole arm. Against this
        run's n_enum_naive = 3,508,544 that is U <= 0.4706 - and that ceiling is
        attained only if the split arm exhausts its entire table on every target
        WITHOUT FINDING ANYTHING, which fires D-5 for failure to reach 200
        relations. In other words, at bits 20 / B 64 / m 4, U >= 0.9 is
        arithmetically incompatible with a succeeding split arm ON ANY OBJECT,
        including a hypothetical object with the strongest imaginable Semaev
        structure. The favourable branch of a pre-registered map that cannot fire
        is not a test; the run's landing in D-1 on the U limb was determined
        before any object was chosen.
      what_this_does_not_say: >-
        It does NOT say the control was worthless or that the map was drafted in
        bad faith. The W limb was genuinely free and D-4 (proxy disagreement)
        was reachable and would have been a real finding. Nor does it rescue the
        structure reading - an unreachable favourable branch is not evidence FOR
        the hypothesis either. It says the confirmation is weaker than
        "the strongest form of the artifact finding" language in D-1a suggests.
      discharging_requirement: >-
        Record in EV-DS-004 that D-2's U conjunct was unreachable at this cell
        and that the D-1 landing is therefore weak confirmation on that limb;
        and require any successor protocol that keeps a HIGH band to first check
        that the band is attainable at the parameters chosen. Parameters at which
        D-2 is reachable require |signed| small enough, or the group large
        enough, that the split table no longer dominates the naive hit density -
        which is RT047-CTRL-2's B-sweep and RT047-CTRL-4's sparse regime.

    - id: RT048-B3
      severity: BLOCKING ON INTERPRETATION
      blocks_ledger_disposition: false
      advisory: false
      title: >-
        The entire wall-proxy residual is per-operation object arithmetic cost,
        and I recovered the missing object-cost-parity measurement from this
        run's own numbers to within 0.6 percent
      target: >-
        Both the claim that the 1.52x wall gap is noise or "essentially in full"
        transfer, and any rescue reading that the 1.52x gap is a residual
        structure signal.
      statement: >-
        AN-3 and reviewer defect DEF-4 say no object-cost-parity measurement was
        performed. It does not need to be performed separately - it is latent in
        the four per-arm records. Per-enumeration wall, computed as
        reported_wall_seconds / n_enum, from the archived fields:
        matched_null_naive 5.687e-07 s, matched_null_split 1.821e-06 s,
        real_naive_remeasure 1.345e-06 s, real_split_remeasure 2.857e-06 s.
        Curve-over-additive per-enumeration cost is therefore 2.366x on the naive
        path and 1.569x on the split path. The split path is less sensitive to
        the object because a fixed part of each split enumeration is
        object-independent - a SHA-256 claw_key plus a CPython dict lookup.
        Fitting the obvious two-parameter model (per-enumeration cost = a_object
        * group-work + c, with c object-free) gives group-work on the split path
        1.335x that on the naive path and c = 1.06e-06 s, which is the right
        order for one small-integer SHA-256 plus one dict get. The prediction
        that model makes for the ratio of the two wall ratios is
        W_real / W_matched_null = 0.6633. The OBSERVED value is 0.6595. That is
        agreement to 0.6 percent, with no free parameter fitted to the ratio
        itself. CONCLUSION - the whole of the 1.52x wall gap is the fact that a
        curve addition costs about 2.4 times a modular addition on this host, and
        that the split arm dilutes that cost with object-free hashing. There is
        no residual for structure to occupy, and none for the base-selection
        confound to occupy either.
      which_way_it_cuts: >-
        BOTH WAYS, DELIBERATELY. It forecloses a structure rescue of the 1.52x
        gap. It equally forecloses reading W as a measurement about structure at
        all - W is a measurement of Python arithmetic on two objects, which is
        RT047-B1 and RT047-C1 confirmed by a second object rather than repaired.
      discharging_requirement: >-
        EV-DS-004 records the four per-enumeration figures and the 0.6633 versus
        0.6595 agreement, and states that the D-1a "within a factor of 2" test
        was passed by an object-cost coincidence rather than by anything about
        structure. AN-3 and DEF-4 are then discharged AS TO THIS CELL - a
        standalone microbenchmark is no longer the cheapest route and should not
        be ranked ahead of the mechanism test.

    - id: RT048-B4
      severity: BLOCKING ON THE DECISION'S WORDING
      blocks_ledger_disposition: true
      advisory: false
      title: >-
        The falsifier that fires is a Red-Team-substituted surrogate, not
        H-DS-001's falsification condition as written, and no record has amended
        the hypothesis's null object
      target: >-
        D-1's `fires` clause and any decision sentence asserting that "H-DS-001's
        OWN falsification condition" fired.
      statement: >-
        First, the good news, stated because symmetric honesty requires it -
        reviewer defect DEF-3 is SATISFIED ON THIS DATA, not merely unlikely. The
        omitted conjunct is R_real < 0.5, and the live re-measure gives
        0.03111559673494141 wall and 0.014652593415947846 units, both far below
        0.5, as does the archived BATCH-020 anchor. The approval-time condition
        DEF-3 asked for is met and the D-1 weaken is not resting on a false
        premise in that respect. Now the objection. H-DS-001
        predictions.per_relation_cost_ratio_R demands "R_null >= 0.9 on the
        MATCHED null object", and H-DS-001 test_boundary.parameters.null_object
        names that object explicitly as
        `random_multihomogeneous_matched_multidegree`. The object actually run is
        NULL-DS-ADDITIVE-Z753848. RT047-B2 was right that the named object is
        unfit and CTRL-RT047-MATCHED-NULL's substitute is far better science, but
        NO DECISION RECORD HAS AMENDED H-DS-001's TEST BOUNDARY. A falsification
        condition evaluated against a substituted object is a repaired surrogate
        of that condition, and saying otherwise overstates the tightness of the
        link between the number and the hypothesis record - in the adverse
        direction, which is the direction this batch is prone to overstate.
      which_way_it_cuts: >-
        Purely against the adverse claim. It does not restore any structure
        reading; the surrogate is a better test than the original and its result
        stands as measured.
      discharging_requirement: >-
        Either (a) the decision says "a substituted matched-null surrogate of
        H-DS-001 falsification condition 2 fired, the named null object having
        been declared unfit by RT047-B2", or (b) the same ledger commit files a
        superseding amendment to H-DS-001.test_boundary.parameters.null_object
        recording NULL-DS-ADDITIVE-Z753848 as the operative matched null, with
        RT-20260731-047 and CTRL-RT047-MATCHED-NULL as the basis. Option (b) is
        cleaner and I recommend it. What is not available is the unqualified
        sentence.

    - id: RT048-B5
      severity: BLOCKING ON SCOPE
      blocks_ledger_disposition: true
      advisory: false
      title: >-
        The premise of DEC-20260801-003 finding (iii) - no adverse transition is
        available because the mechanism was never exercised - is UNCHANGED by
        this run
      target: >-
        A bare `H-DS-001: weakened` status field, and any downstream reading of
        it as "the mechanism is losing support".
      statement: >-
        DEC-20260801-003 refused an adverse transition at the BATCH-020 close on
        the ground that SMOOTHNESS_ABORT = False, is_B_smooth had never been
        called, and the smoothness claw the hypothesis is about had never
        executed. Every one of those facts is true again in BATCH-021, on BOTH
        objects, and the run records them itself -
        frozen_settings_honored.smoothness_abort false,
        encode_intermediate_is_identity_at_these_parameters true, join predicate
        exact equality. BATCH-021 added an OBJECT, not a MECHANISM. If the
        Coordinator now records `weakened`, the decision must state what changed
        relative to finding (iii), and the only honest answer is - nothing about
        the mechanism; only that the artifact reading moved from argued to
        measured on a second object. That is a real increment and it justifies
        the map's SCOPED weaken. It does not justify an unscoped one, and a bare
        `weakened` in a status field is unscoped by construction, because future
        index scans and successor agents read the field, not the branch text.
        Premature closure is cheap to produce and reads as rigour
        (docs/inventor-protocol.md, why this exists); a status field is the
        cheapest place to produce it.
      which_way_it_cuts: >-
        Against the adverse claim only. It does not license refusing the frozen
        branch - see my explicit ruling below, which is that refusing a
        pre-registered adverse branch after seeing the number would be the mirror
        image of the sin the map exists to prevent.
      discharging_requirement: >-
        If `weakened` is recorded, the SAME ledger commit must carry, inside
        ledger/hypotheses/H-DS-001.yaml, a `status_scope` block reproducing D-1's
        scope text verbatim - that the weaken attaches only to the claim that the
        measured R evidences Semaev/multihomogeneous structure, that it is not a
        finding that the mechanism fails, and that the mechanism remains
        unexercised - and `mechanism_test_status.exercised: false` must be
        preserved unchanged and re-affirmed with BATCH-021 named. A weaken whose
        scope lives only in a decision record and not in the hypothesis record is
        a scope that will be lost.

    - id: RT048-B6
      severity: MAJOR
      blocks_ledger_disposition: false
      advisory: false
      title: >-
        AN-2 ruling - the distinct-key asymmetry is BOTH an inherent consequence
        of removing the curve AND a real matching defect, but its magnitude is
        bounded at about 1 percent of the split arm and it cannot carry the
        transfer
      target: >-
        Both the claim that the two objects are "matched" without qualification,
        and any use of AN-2 to argue the comparison is apples-to-oranges.
      statement: >-
        The facts, recomputed - the claw table holds C(129,2) = 8256 entries on
        both objects, but 4079 distinct keys on the curve against 8159 on
        Z/753848Z, because encode_intermediate is the identity on both and the
        join key is x(P), which satisfies x(P) = x(-P), whereas g and N-g are
        distinct residues. INHERENT - yes. Any faithful removal of the curve
        removes the plus-or-minus identification with it; preserving it in Z/N
        would require inventing a quotient key such as min(g, N-g), which is a
        DIFFERENT ALGORITHM and would breach algorithm_invariance. The asymmetry
        is forced by the lesion, not chosen. A REAL DEFECT - also yes. The join
        predicate is literally 2-to-1 on the curve and 1-to-1 on the null, so
        "the ALGORITHM is identical" is true of the code and not quite true of
        the induced map. BOUNDED - the candidate loop accepts only on
        `lsum == need`, exact group equality, so the per-enumeration SUCCESS
        probability is (table entries)/N on both objects and n_enum is unaffected
        in expectation. That is confirmed empirically - both objects land within
        5 percent of the object-free prediction U = 2/129 (RT048-B1). The only
        cost is that a curve key hit yields a mean candidate list of 2.02 against
        1.01, i.e. about one extra failed equality check per key hit, and key
        hits are about 8256/753848 = 1.1 percent of enumerations. That is order
        1 percent of the split arm's wall, an order of magnitude below the 52
        percent wall gap that RT048-B3 attributes, with a fitted residual of 0.6
        percent, to arithmetic cost.
      effect_on_the_transfer_inference: >-
        The control remains FAIR for the D-1 direction and the transfer inference
        survives AN-2 intact. AN-2 would have been a live and UNNAMED confound
        under D-2 or D-3 - a 2-to-1 join key is exactly the sort of
        representation-level structure that could move an object-dependent ratio,
        and the frozen map does not name it in either branch. That is a drafting
        gap worth carrying to the successor protocol, not a defect in this
        result. The durable finding underneath AN-2 is worth stating on its own -
        THE ONLY CURVE-SPECIFIC STRUCTURE THIS INSTRUMENT TOUCHES AT ALL IS
        x(P) = x(-P), and it is worth a factor 2 in table keys and approximately
        zero in enumerations. That is an elliptic-curve fact. It is not a Semaev
        or summation-polynomial fact, and it is the entire structural content of
        the BATCH-020 measurement.
      discharging_requirement: >-
        EV-DS-004 records AN-2 with the 4079/8159 figures, the ruling that it is
        forced by the lesion, the approximately 1 percent wall bound, and the
        note that it is an unnamed confound for any future D-2 or D-3 branch.

    - id: RT048-B7
      severity: MAJOR
      blocks_ledger_disposition: false
      advisory: false
      title: >-
        PD-1 diff read in full - the instrumented harvest wrapper cannot produce
        or inflate the transfer
      target: The possibility that the declared wrapper copy manufactured the result.
      statement: >-
        I read the complete unified diff archived at
        raw-result.json algorithm_invariance.harvest_wrapper_diff and compared it
        against ds001_ctrl_unplanted.harvest_real. Everything added is
        instrumentation - an rss_bytes() sample at arm start and arm end, an
        n_enum accumulator, a capped-attempt counter and an arm-budget-truncated
        counter, claw_table_build_count, a backend_object label, a cert_fn
        parameter, and additional output fields. Everything load-bearing is
        preserved verbatim - the two search calls, the deadline arithmetic
        min(arm_deadline, cap_deadline), the charging lambda, the for/else
        stop-reason logic, the overhead accounting, and the amortization
        structure with the claw table built ONCE before the target loop. Three
        reasons the copy cannot carry the effect. (1) SYMMETRY - the same wrapper
        serves all four matched-null and real arms, so any wrapper overhead is
        common mode and cancels in both W's; the legacy arms use a separate
        instrumented copy of harvest_null and are excluded from the decision
        variable anyway. (2) GRANULARITY - every added statement executes per
        ATTEMPT (200 or 269 times) or per ARM (twice), never per ENUMERATION
        (millions of times), so it cannot perturb a per-enumeration wall ratio at
        the 1.5x scale under discussion. (3) INDEPENDENT CORROBORATION - the live
        re-measure through the new wrapper reproduces the archived BATCH-020
        figures at 0.9663 on wall and 0.9968 on units, so the wrapper is not
        shifting the real arm. VERDICT - PD-1 is clean, correctly declared,
        correctly justified as unavoidable (the contract's own
        required_per_arm_fields cannot be produced by harvest_real), and the
        runtime difflib archival is the right pattern.

    - id: RT048-B8
      severity: MAJOR
      blocks_ledger_disposition: false
      advisory: false
      title: >-
        The eliminated dimension is still not fully charged - the claw table's
        own construction is charged in wall but not in units
      target: The charged-unit ledger and any future use of U as a cost model.
      statement: >-
        Per KN-LIT-7593 and my standing obligation, an eliminated search
        dimension is not a speedup until the invariant's own cost is in the
        total. build_claw_table performs 8256 group additions, 8256 SHA-256
        claw_key calls and 8256 dict inserts, and charge_backend_units is never
        called inside it - the charge fires only in naive_search line 282 and
        split_search line 493. So U undercharges the split arm's table build
        entirely. Quantified - charging the build at the same 40 units per
