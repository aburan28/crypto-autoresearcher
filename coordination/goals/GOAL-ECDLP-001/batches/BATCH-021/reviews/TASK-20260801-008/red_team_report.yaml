  baseline_comparison:
    regime: >-
      Prime field p = 752627; curve group order 753848; prime-order subgroup
      n = 241 (about 7.9 bits); matched null Z/753848Z; factor base 64 unsigned /
      128 signed on both objects; m = 4; 200 relations per arm; unplanted uniform
      random targets; single unreplicated run on one macOS arm64 host;
      rho_gop_per_second = 1577384.044 from one curve capture (AN-6).
    pollard_rho_matched:
      source: measured on the curve instance, certificate verified, carried from RT047-B4
      total_group_operations: 744
      memory: O(1) with distinguished points
      comparison_live_remeasure: >-
        Recomputed from this run's own arms - real_split_remeasure costs 1078.28
        rho-equivalent group operations per relation. Index calculus needs at
        least |factor base| = 64 independent relations before linear algebra can
        start, so relation collection ALONE costs 69,010 rho-equivalent group
        operations, which is 92.8x the entire measured rho solve. The naive arm
        is 34,654 per relation, i.e. 2,217,858 for 64 relations, 2,981x rho.
    matched_null_object_own_baseline:
      method: discrete log in Z/753848Z by one extended-gcd modular inversion
      cost: 1 modular inversion, O(1) memory
      comparison: >-
        The matched-null split arm costs 742.44 rho-equivalent group operations
        per relation, i.e. 47,516 for the 64 relations that would be needed
        before linear algebra, on an object whose discrete logarithm is solvable
        outright by a single extended-gcd. This is not a defect of the control -
        the control measures ALGORITHM COST ONLY and the contract says so - but
        it is the reason no hardness statement of any kind may be read off the
        null arms.
    bsgs_matched:
      group_operations_modeled: 32
      storage_elements_modeled: 16
      caveat: >-
        Modeled as 2*ceil(sqrt(241)) over the subgroup while the membership
        search runs over order 753848. Even at the generous full-group figure
        (2*ceil(sqrt(753848)) = 1738 operations, 869 stored), the split arm is
        dominated on both axes.
    generic_meet_in_the_middle_baseline: >-
      The split arm IS this baseline, established twice over - by source reading
      in RT047-B2 and now by an exact object-free formula (RT048-B1) that
      predicts its charged-unit advantage to 5 percent from |signed| alone. It
      therefore holds no advantage over the generic baseline by construction.
    closest_specialized_baseline: >-
      Gaudry/Diem-style prime-field index calculus with Semaev summation
      polynomials and a Groebner membership solve. STILL NOT COMPARABLE from this
      package - the backend is exact point-sum membership with a constant
      charge_backend_units(4) = 40 per candidate, never a Groebner solve, so the
      relative cost of the two arms under a real algebraic membership backend
      remains entirely unmeasured. This is unchanged from RT047 and is the single
      largest reason no literature-relevant statement is available.
    dominated_by: >-
      Matched Pollard-rho (measured, 744 group operations, O(1) memory, this
      exact curve instance); matched BSGS (modeled, 32 operations / 16 stored, or
      1738 / 869 over the full group); one extended-gcd modular inversion on the
      matched-null object itself; and the generic meet-in-the-middle baseline,
      which the split arm coincides with rather than beats. Dominated on time, on
      memory, and on stored elements. No axis remains on which either arm wins.
    dominated_by_check_performed: >-
      Every row checked across time, memory and data/queries, against both
      baseline receipts present in the run record, against the null object's own
      analytic baseline, and against the generic-MITM alternative. `null` is
      inadmissible here and would be a fabrication under AGENTS.md rule 5 and
      inventor-protocol section 5.
    sota_delta: >-
      -9,180 percent on time against matched rho for relation collection alone on
      the curve (69,010 versus 744 group operations, 92.8x worse); -51,500
      percent on memory against modeled BSGS (8,256 claw entries versus 16 stored
      elements, or 9.5x against the 869 full-group figure); on the null object,
      47,516 rho-equivalent operations of relation collection against a problem
      solvable outright by one modular inversion. The only positive delta
      anywhere in the package is intra-experimental - the split arm is 32.1x
      cheaper in wall and 68.2x cheaper in enumerations than the naive arm of the
      same harness on the curve, and 21.2x / 67.9x on the additive object - and
      that is not a published baseline, is not a state of the art, and is
      predicted to 5 percent by 2/(|signed| + 1) with no object as input.

