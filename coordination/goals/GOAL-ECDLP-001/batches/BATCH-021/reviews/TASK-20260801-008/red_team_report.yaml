  cost_model_challenges:
    - id: RT048-C1
      challenge: >-
        R remains wall_split/wall_naive with charged units outside the identity.
        The run discloses this verbatim, which discharges RT047-B1's reporting
        requirement and repairs nothing about the model itself.
    - id: RT048-C2
      challenge: >-
        charge_backend_units is a constant 40 per call, so the charged-unit
        ledger is a candidate counter wearing a cost model's clothes. It charges
        nothing for the split arm's 8256 table-build additions and nothing for
        the naive arm's per-candidate group addition. See RT048-B1 and RT048-B8
        for the exact arithmetic and for the demonstration that correcting the
        table-build undercharge does not move the branch.
    - id: RT048-C3
      challenge: >-
        Amortization parity is REPAIRED between the two decision arms - both
        split arms build once, evidenced by an integer count - and remains broken
        on the legacy arms, which rebuild 269 times and are correctly excluded
        from every decision-bearing ratio. The deeper problem stands - table size
        is O(B**(m/2)) while the relation requirement is O(B), so the per-relation
        share of the build grows with B and has never been swept.
    - id: RT048-C4
      challenge: >-
        The eliminated dimension is a memory purchase reported as a time win, and
        the purchase is still not on the invoice - 8256 entries at a single
        unswept value of B, with no van Oorschot-Wiener interpolation drawn.
        peak_rss_bytes is an interpreter baseline plus a small dict and carries
        no scaling information; the Executor labels it honestly as a monotone
        upper bound rather than an arm-exclusive figure.
    - id: RT048-C5
      challenge: >-
        Total expected cost equals per-attempt cost times inverse success
        probability. Both objects here have empirical success probability exactly
        1.0 on every arm by design (about 15.5 representations per random
        target), so the dominant factor of real index calculus is multiplied by
        one and is invisible. The matched null deliberately preserves this,
        correctly, so as to change only the object - but it means neither object
        has been measured in the regime the hypothesis is about.
    - id: RT048-C6
      challenge: >-
        rho_gop_per_second is a single sub-millisecond curve capture reused on
        the additive object (AN-6). It cancels in every ratio, so no ratio is
        harmed, but every absolute gops-per-relation figure in the package -
        including the ones I quote in baseline_comparison - inherits that unit and
        should never be quoted without the caveat.

