    is_the_D1_scoped_weaken_licensed_by_this_data: >-
      QUALIFIEDLY YES, AND ONLY IN THE MAP'S OWN SCOPED FORM, WITH TWO
      CO-RECORDED CONDITIONS. I considered recommending the narrower disposition
      - leave H-DS-001 at `analyzed` and weaken only the EVIDENCE READING by
      having EV-DS-004 supersede the forward reading of EV-DS-003 - and I reject
      that recommendation, for a reason that is the whole point of this batch. A
      map was frozen and hash-bound before any data existed, its adverse branch
      was the one the author predicted, and its favourable branch was
      deliberately built to be non-promoting. Declining the pre-registered adverse
      branch after seeing the number would be the exact mirror image of the sin
      the map exists to prevent, and it would teach the program that
      pre-registration is optional whenever the result is uncomfortable. D-1
      fires on its stated condition, D-1a fires on its stated condition, and
      reviewer defect DEF-3's missing conjunct is satisfied on the live
      re-measure. The branch should be applied as written.
    the_two_conditions: >-
      (1) SCOPE MUST TRAVEL IN THE HYPOTHESIS RECORD. Per RT048-B5, a bare
      `weakened` status field is unscoped by construction because successors read
      the field, not the branch text. The same ledger commit must add a
      `status_scope` block to ledger/hypotheses/H-DS-001.yaml reproducing D-1's
      scope verbatim, and must preserve and re-affirm
      `mechanism_test_status.exercised: false` naming BATCH-021. (2) THE FALSIFIER
      MUST BE NAMED HONESTLY. Per RT048-B4, either the decision says a
      SUBSTITUTED SURROGATE of falsification condition 2 fired, or the same
      commit amends H-DS-001's null_object field to NULL-DS-ADDITIVE-Z753848 by a
      superseding record. I recommend the amendment.
    what_the_weaken_does_and_does_not_assert: >-
      IT ASSERTS - that at this cell, the claim that the measured R evidences
      Semaev or multihomogeneous structure has lost its support, the win being
      reattributed to generic meet-in-the-middle worth about |signed|/2 in
      enumerations. IT DOES NOT ASSERT - that the mechanism fails, that the
      smoothness claw does not work, that H-DS-001 is refuted as mathematics, or
      that the lane is closed. The honest one-line summary of BATCH-021 is that
      THE INSTRUMENT, NOT THE HYPOTHESIS, HAS BEEN REFUTED - and the weaken is
      bookkeeping that brings the hypothesis's status field into line with what
      DEC-20260801-003 already said in prose.
    on_the_coordinators_batch020_finding: >-
      DEC-20260801-003 finding (iii) said no adverse transition was available
      because the mechanism had never been exercised. That premise is UNCHANGED -
      see RT048-B5. What changed is not the mechanism's test status but the
      status of the INTERPRETIVE claim, which was argued in BATCH-020 and is
      measured in BATCH-021. A weaken confined to that interpretive claim is
      consistent with finding (iii); a weaken that reads as adverse evidence
      about the mechanism contradicts it and must not be written.

