# ---------------------------------------------------------------------------
# Objections
# ---------------------------------------------------------------------------
objections:
  - id: RT056-B1
    severity: BLOCKING
    title: NULL-SPLIT pass_condition soft-passes without R_null<0.9 destroy demonstration
    target: >-
      experiments/EXP-DS-001/controls/CTRL-RT025-NULL-SPLIT-COMPOSITION.yaml
      method.pass_condition / method.destroy_parameter_check; amendment
      discharges CTRL-RT025-NULL-SPLIT-COMPOSITION
    detail: >-
      Amendment and control purpose require demonstrating R_null can fall
      below 0.9 under a packaging-like real arm. pass_condition only requires
      documenting composition and recording destroy-attempt behavior. The OR
      arm ("honestly report that R_null could not be driven below 0.9") is a
      valid scientific *observation* but is incorrectly treated as a control
      PASS. RT047-M2 falsification_route: if R_null cannot be driven down
      after composition repair, the gate is not falsifiable and must be
      redesigned — not discharged. A co-required control that soft-passes
      here cannot scientifically discharge null-gate theater.
    required_fix: >-
      Split statuses: (1) composition_repaired (half-keys join under same
      claw/join as real arm); (2) destroy_demonstrated iff measured R_null<0.9
      under a packaging-like arm with raw costs; (3) falsifiability_failed if
      composition repaired but R_null cannot be driven <0.9 — terminal
      non-discharge for the co-required package (redesign), not a soft PASS.
      Align pass_condition with amendment discharge text.
    discharge: null

  - id: RT056-B2
    severity: BLOCKING
    title: Plant "equivalent non-arithmetic FLAG" re-opens echo-tautology class
    target: >-
      experiments/EXP-DS-001/controls/CTRL-RT025-PLANT-INDEPENDENT.yaml
      method.require_detection_path / method.falsifies_if
    detail: >-
      RT047-B3 core: a control that cannot return false has no detection
      power; synth-OR removal was cosmetic. This protocol correctly forbids
      the named null_gate_echo_factor-alone path and requires inject-before-
      gate, but allow-lists "equivalent non-arithmetic FLAG" without defining
      equivalence or forbidding FLAGS entailed by detector-applied plant
      arithmetic. An executor can mint a renamed echo conjunct and still
      claim non-echo detection. falsifies_if does not close that class.
    required_fix: >-
      Close detection_path to {null_gate_f2_shape} only for BATCH-021, OR
      define non-arithmetic as "truth not entailed by detector-applied plant
      arithmetic on the same reported costs" and extend falsifies_if to any
      FLAG in that entailment class. Require plant_independent_report.json
      fields: injection_site, costs_as_read_by_gate, detection_path,
      echo_entailment_check=false.
    discharge: null

  - id: RT056-M1
    severity: MAJOR
    title: RHO-CALIB under-specifies auditable measurement fields and band binding
    target: experiments/EXP-DS-001/controls/CTRL-RT025-RHO-CALIB.yaml
    detail: >-
      Anti-hardcode intent is clear, but report schema does not require raw
      rho wall/gop inputs used to form the ratios, and the parent v2 ±0.15
      calibration band is not re-bound or explicitly deferred to post-run
      interpretation. Alone not sufficient for REVISE given B1/B2.
    required_fix: >-
      Require rho_calib_report.json to carry raw real/null rho walls and
      gops (or named proxy formula + inputs); state whether ±0.15 is an
      acceptance gate or deferred interpretation.
    discharge: null

  - id: RT056-P1
    severity: PROCESS
    title: Prior TASK-057 APPROVED cites a superseded PASS at this path
    target: >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/archives/TASK-20260731-057/snapshot_commit_receipt.json
      (ebbeccbe); prior PASS text at this review path
    detail: >-
      Independent session 6f4bcb84 failed_infrastructure. A later PASS was
      archived and TASK-057 recorded APPROVAL_DETERMINATION APPROVED /
      run_authorized for RUN-DS-001-ctrl-theater. This independent session
      returns REVISE on the same 98fa35db blobs. Under AGENTS.md, correlated
      or superseded review text must not stand as the binding attestation.
      Remint is Coordinator-owned and outside this write_scope.
    required_fix: >-
      Coordinator remints TASK-057 (or superseding archive) to NOT APPROVED
      / no run, binds this REVISE, and treats RC-21 theater-repair run as
      non-execution unless a later out-of-batch repair is separately opened
      by a non-TASK-054 author under a new amend id.
    discharge: null

  - id: I-1
    severity: INFORMATIONAL
    title: EV-DS-004 id foreshadow vs ledger remint
    detail: >-
      Amendment non_changes foreshadow EV-DS-004 as theater-repair evidence;
      queue objective remints theater evidence toward EV-DS-005 after
      EV-DS-004 supersedes parse-broken EV-DS-003. Coordinator must mint a
      fresh theater-repair evidence id when/if a valid run lands. Not
      REVISE-forcing on control science.
    discharge: null

