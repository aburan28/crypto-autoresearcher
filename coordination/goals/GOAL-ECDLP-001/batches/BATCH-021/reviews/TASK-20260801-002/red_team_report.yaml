      - "cost_split_null = 8.165517262000094 * 601955.384 / 200 = 24576.385401125426 (matches)"
      - "R = 1619.2905897832022 / 44301.273752458015 = 0.03655178401486385 (matches manifest) = wall_split/wall_naive exactly"
      - "R_null = 24576.385401125426 / 219.22589960036922 = 112.10530072371081 (matches)"
      - "fake_R = R/4 = 0.009137946003715963 (matches live_plant_report.json); fake_R_null = R_null/4 = 28.026325180927703 (matches)"
      - "detection needs fake_R_null < 0.9 i.e. R_null < 3.6; observed R_null across 54 planted cells in [80.405, 189.133]; 0 of 55 measurements detectable"
      - "R outside its own R_ci in 41 of 54 cells of RUN-DS-001-measure/raw-result.json (recomputed, matches the task card)"
