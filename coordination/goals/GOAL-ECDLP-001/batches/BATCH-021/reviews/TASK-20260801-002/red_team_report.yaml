  inference:
    requested_policy: review-adversarial
    resolved_model_id: claude-opus-5
    backend: anthropic
    reasoning_effort: null
    reasoning_effort_note: >-
      The review-adversarial floor asks reasoning_effort xhigh. THIS HARNESS
      CANNOT REQUEST OR READ A REASONING-EFFORT LEVEL FOR A SUBAGENT. The
      level actually used is therefore not controllable and not verifiable by
