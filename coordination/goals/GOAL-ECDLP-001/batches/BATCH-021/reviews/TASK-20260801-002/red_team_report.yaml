red_team_report:
  id: RT-20260801-001
  task_id: TASK-20260801-002
  batch_id: BATCH-021
  goal_id: GOAL-ECDLP-001
  role: red-team
  independent_session: true
  reviewed_snapshot: 61cd52621e0a53669cee8f30af145f8193838362
  reviewed_at_working_tree: false
  read_method: >-
    Every artifact and every line of instrument code cited below was read via
    `git show 61cd5262:<path>` (and `git show 61cd5262^:<path>` for the
    pre-existing driver). Nothing in this report is read from the working
    tree. Line numbers for ds001_driver.py refer to the file AS COMMITTED AT
