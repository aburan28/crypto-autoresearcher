      evidence and nothing more. Classification is TASK-20260801-009's
      exclusive job.
    claim_tier_confirmed: toy
    confirmatory_status_confirmed: exploratory_control
    records_altered_by_this_task: none
    commits_made_by_this_task: none

  session:
    independent_session: true
    produced_the_run: false
    snapshot_validated: c781a2e7bb740f58dbf3e4c7773c143c3b910642
    snapshot_parent: f8b04d1a652ecfee823a2da9b3efd6e6badb12b7
    snapshot_reachable_from_head: true
    read_method: >-
      git archive of the snapshot commit into an isolated scratchpad. Every
      figure below was recomputed from those blobs, not from the executor's
      execution_report, the Coordinator's receipt, or the task prompt.
    working_tree_state_after_validation: clean (git status empty)

  inference:
    requested_policy: review-adversarial
    resolved_model_id: claude-opus-5
    reasoning_effort: null
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve orchestration/model-policies.yaml
      GPT-5.6-family policy aliases; subagent frontmatter supports Claude
      models only. Recorded rather than silently substituted.
    model_verified: false
    model_verified_reason: >-
      No python3 -m orchestration.adapter doctor --probe was run in this
      session, so the identifier is unverified runtime-reported configuration.
    degraded_allowed: false
    independent_session_required: true

  # ====================================================================
  artifact_checks:
    - id: A-1
      check: all 13 declared executor artifacts exist at the snapshot
      method: >-
        git archive of c781a2e7 followed by an existence, size and parse test
        on each path.
      result: pass
      detail: >-
        manifest.json (17470 B, parses), raw-result.json (591783 B, parses),
        stdout.txt (5470 B), stderr.txt (0 B), command.txt (1024 B),
        environment.json (1403 B, parses), summary.json (23697 B, parses),
