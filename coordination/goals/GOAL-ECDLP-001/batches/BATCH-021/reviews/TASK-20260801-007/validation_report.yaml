  # ====================================================================
  executor_declared_items_assessed:
    - id: PD-1
      assessment: accurate_and_verified
      detail: >-
        The declaration is precise and I confirmed every clause of it. The
        diff is real, it is instrumentation, and no search call, deadline
        computation, charge, stopping rule or amortization structure changes.
        The same wrapper serves the matched-null and real arms, so no arm is
        advantaged by the instrumentation. This was the single most important
        check in the batch and it passes.
    - id: PD-2
      assessment: disclosed_but_unverifiable_by_me
      detail: >-
        A pre-run smoke test at --relations 5 --real-targets 60 into the
        session scratchpad is disclosed. I cannot audit another session's
        scratchpad, so I can neither confirm nor refute it. What I can confirm
        is that the package contains exactly one authoritative execution,
        maximum_runs 1 is recorded, and the timestamps describe a single
        11.03 s run. Disclosing it was the right call; marked unverified.
    - id: AN-1
      assessment: accepted_as_infrastructure_note
      detail: >-
        Reproduced on this host - setrlimit refuses RLIMIT_AS, RLIMIT_DATA and
        RLIMIT_RSS with ValueError, and the errors are recorded in
        environment.json and budget.memory_cap_errors. Peak RSS 70434816 B is
        about 0.8 percent of the 8 GB allowance, so the unenforced cap is
        non-binding and affects nothing. Infrastructure, never a mathematical
        negative.
    - id: AN-2
      assessment: >-
        INHERENT CONSEQUENCE OF REMOVING THE CURVE, NOT A FABRICATED MISMATCH -
        but it is not cost-neutral and it bounds the strength of any transfer
        reading.
      independently_verified: true
      my_measurement: >-
        I rebuilt both claw tables myself at these parameters. Curve - 8256
        entries, 4079 distinct keys. Additive - 8256 entries, 8159 distinct
        keys. Both of the executor's numbers are exactly right, and 8256 is
        C(129,2) over 128 signed elements as claimed.
      judgement: >-
        The cause is real and unavoidable under the contract's own prescribed
        encoding - encode_intermediate consumes pt[0], which on a curve is an
        x-coordinate shared by P and -P, so the claw key is a 2-to-1 function
        of the point, whereas g and N-g are distinct residues. You cannot
        remove the curve and keep the 2-to-1 key without inventing a fiction.
        In that sense the control is not defective. HOWEVER the asymmetry is
        not neutral for the quantity being compared - the additive table's
        keys are twice as selective, so the additive split arm scans fewer
        candidates per lookup than the curve split arm does. That pushes
        R_matched_null DOWN, which is the direction that flatters the headline
        that the advantage transfers. A less asymmetric alternative existed
        and was not taken - keying the additive table on min(g, N-g) would
        have emulated the curve's 2-to-1 collapse - so this is a design choice
        with a known sign, not an unavoidable fact. My conclusion - the
        control stands and the run is admissible, but the asymmetry is a live
        confound of known direction and must be carried into any reading of
        how CLOSE R_matched_null is to R_real. It does not undermine the
        weaker statement that a large advantage survives on a structure-free
        object.
    - id: AN-3
      assessment: accepted_as_scope_limitation
      detail: >-
        No object-cost-parity measurement was made, so the per-operation cost
        of modular addition versus curve addition on this host is unknown. A
        constant object-level cost ratio would move R_matched_null relative to
        R_real for reasons unrelated to structure. Correctly named as a
        limitation rather than assumed away.
    - id: AN-4
      assessment: accepted_as_scope_limitation_and_the_most_substantive_one
      detail: >-
        Object structure and factor-base selection policy remain confounded -
        the real base is the frozen deterministic subset of E(F_p), the
        matched-null base is uniform random residues. The control's own text
        forbids reusing curve x-coordinates, so some divergence was forced,
        but the consequence is that the matched null differs from the real
        object along two axes rather than the one the word matched implies.
        Declared, not resolved.
    - id: AN-5
      assessment: accepted, and the contract's permitted option
      detail: >-
        Only the overhead-unresampled bootstrap was computed, and the
        anticonservative direction is stated. The control permitted exactly
        this alternative to computing a second estimator. I reproduced the
        intervals that were computed.
    - id: AN-6
      assessment: accepted, and algebraically harmless here
      detail: >-
        rho_gop_per_second 1577384.044 is one curve capture reused for every
        arm. I confirmed by direct algebra that it appears in both numerator
        and denominator of every ratio and cancels exactly, so no ratio in
        this package depends on it. It would matter only if an absolute cost
        figure were quoted, and none is used as evidence.

  # ====================================================================
  defects:
    - id: DEF-V1
      severity: minor
      class: incomplete_declaration
      blocking: false
      statement: >-
        The harvest_legacy_null wrapper is a second instrumented copy whose
        unified diff is asserted in PD-1 prose but not archived anywhere in
        the run package, unlike the harvest diff. I recomputed it and it is
        benign, but the package does not let a reader check it without
        redoing that work.
      remedy: >-
        On any reuse of this driver, archive both wrapper diffs by the same
        runtime difflib mechanism.
    - id: DEF-V2
      severity: minor
      class: instrument_limitation
      blocking: false
      statement: >-
        The charged-unit proxy charges a constant 40 units per membership call
        on every arm and every object, so units_per_enumeration is exactly
        40.0 on all six arms and U is an algebraic function of the enumeration
        counts alone. It is therefore not an independent second measurement of
        cost, and the fact that the two proxies land in the same band carries
        less corroborative weight than a two-proxy disclosure normally would.
        The executor states this plainly in
        proxy_sensitivity_report.charged_unit_proxy_is_object_independent_by_construction,
        which is why this is a limitation and not a misreport.
      remedy: >-
        Any future cost-proxy repair (the D-4 next_action) should charge the
        split arm's table-build additions and the naive arm's per-candidate
        additions, per RT047-C2.
    - id: DEF-V3
      severity: minor
      class: residual_confound_with_known_sign
      blocking: false
      statement: >-
        The AN-2 distinct-key asymmetry (4079 curve keys versus 8159 additive
        keys at identical 8256 entries, both independently confirmed by me)
        biases R_matched_null downward relative to R_real for a reason that is
        about key encoding rather than about Semaev structure. Combined with
        AN-4's factor-base-policy confound and AN-3's absent object-cost
        parity, at least three non-structural channels can move
        R_matched_null relative to R_real.
      remedy: >-
        Carry as a binding limitation on any quantitative-transfer reading;
        RT047-CTRL-2's B-sweep and an object-cost-parity measurement are the
        instruments that would separate these channels.
    - id: DEF-V4
      severity: informational
      class: field_semantics
      blocking: false
      statement: >-
        claw_table_amortized_once is null on the four naive arms. This is by
        construction (the predicate is undefined without a table) and every
        contract-required per-arm field is non-null everywhere, but the strict
        reading of no per-arm field is null is not literally satisfied.
  blocking_defects: none

