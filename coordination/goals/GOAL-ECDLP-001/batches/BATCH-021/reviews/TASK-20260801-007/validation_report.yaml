        ds001_ctrl_matched_null.py (80996 B, valid Python AST),
        implementation.md (18343 B), execution_report.yaml (32038 B, parses
        under yaml.safe_load). Total 14 declared paths including the
        Coordinator's snapshot_commit_receipt.json.
    - id: A-2
      check: declared path hashes in the snapshot receipt match the committed blobs
      method: >-
        recomputed sha256 of git show c781a2e7:<path> for each of the 13
        entries in snapshot_commit_receipt.source_path_sha256.
      result: pass
      detail: 13 of 13 match; 0 mismatches.
    - id: A-3
      check: manifest records a real command, revision, dirty state, seed, environment and resources
      result: pass
      detail: >-
        command.txt and manifest.code.command agree verbatim; argv in
        manifest, environment.json and raw-result agree. Revision
        f8b04d1a652ecfee823a2da9b3efd6e6badb12b7 equals the snapshot's parent.
        dirty is recorded true with the reason stated (only the untracked new
        driver). Seed 101 with seven enumerated randomness_sources.
        Environment records OS, arch, Python 3.13.1, numpy 2.4.0, sympy
        1.14.0, host, pid, cpu_count. Resources record peak RSS 70434816 B
        overall and per arm, cpu_seconds 11.139822, wall 11.028905 s against
        an 1800 s allowance.
    - id: A-4
      check: inference block is honest
      result: pass
      detail: >-
        requested_policy executor-implementation, resolved_model_id recorded
        as runtime-reported, fallback_used true with the harness reason,
        model_verified false with the reason that no adapter probe was run.
        This is the disclosure AGENTS.md requires, not a silent substitution.
    - id: A-5
      check: dirty-tree claim is fully explained
      method: >-
        git diff f8b04d1a6..c781a2e7b on ds001_driver.py and
        ds001_ctrl_unplanted.py; git diff --numstat on implementation.md.
      result: pass
      detail: >-
        Both shared modules are byte-identical across the run commit and the
        snapshot (empty diff). implementation.md shows 168 insertions and 0
        deletions beginning after line 143, i.e. a pure append. The dirty flag
        is therefore accounted for by the untracked new driver alone.

  # ====================================================================
  algorithm_invariance_checks:
    verdict: >-
      The central claim of the run - that only the object changed - is
      SUPPORTED by independent recomputation. No undeclared code change was
      found, and the declared change does not touch search logic.
    checks:
    - id: AI-1
      check: the archived harvest wrapper diff is the true diff of the two sources
      method: >-
        Extracted harvest_real from ds001_ctrl_unplanted.py and harvest from
        ds001_ctrl_matched_null.py at the snapshot with ast.get_source_segment,
        then ran difflib.unified_diff myself and compared the result to
        raw-result.json algorithm_invariance.harvest_wrapper_diff.
      result: pass
      detail: >-
        My independently computed unified diff is character-for-character
        equal to the archived diff. The archived diff is therefore genuine and
        not a hand-written description.
    - id: AI-2
      check: the diff adds only instrumentation
      method: line-by-line semantic reading of the verified diff.
      result: pass
      detail_confirmed:
        - >-
          Added state - rss_before, n_enum, capped, arm_budget_truncated,
          table_build_count - all write-only counters.
        - >-
          Signature change from (inst, E, fb) to (G, fb_signed) plus
          backend_object and cert_fn. Object and certificate constructor are
          parameters; no kernel was parameterized, subclassed or monkeypatched.
        - >-
          The build_claw_table call is argument-identical apart from the
          object and base - half arity m//2, DRV.frozen_D(bits, m), B,
          SMOOTHNESS_ABORT and the same wall_budget * 0.4 deadline.
        - >-
          Deadline arithmetic is mathematically unchanged. The original
          computed min(t_arm0 + wall_budget, seg0 + PER_TARGET_CAP_SECONDS);
          the copy names the same two quantities and takes the same min, and
          the extra boolean cap_is_binding_deadline is used only for
          accounting.
        - >-
          Charging is unchanged - the same lambda mm - DRV.charge_backend_units(mm)
          is passed to both kernels.
        - >-
          The stopping rule is untouched. The relations_target break and the
          arm wall-budget break sit in unchanged context lines, as does the
          for/else stop-reason logic.
        - >-
          Amortization structure is unchanged - the claw table is built once
          before the target loop in both versions.
        - >-
          Certificate construction moved from make_cert(inst, ...) to
          cert_fn(...), and in both versions it runs AFTER the timed segment
          has been closed, so it cannot contaminate a measurement.
        - >-
          The only semantic removal is the return field object equals
          semaev_real, replaced by backend_object plus backend_id. A declared
          field rename, not a logic change.
    - id: AI-3
      check: naive_search, split_search and build_claw_table are imported unchanged
      method: >-
        Loaded ds001_driver.py from the snapshot and recomputed
        sha256(inspect.getsource(fn)) for all ten recorded kernels.
      result: pass
      detail: >-
        All 10 recorded per-function hashes reproduce exactly - naive_search
        a1e97a9b..., split_search 626baf1a..., build_claw_table f24e0439...,
        charge_backend_units 8ccf86b5..., encode_intermediate d269a494...,
        claw_key 4211ff1c..., cost_from_wall b1afb071..., frozen_D
        8098d4bb..., null_naive_search f1681297..., null_split_search
        5f01bd9c... File hashes also reproduce - ds001_driver.py 5ac7a4ed...,
        ds001_ctrl_unplanted.py 3ee4f68f..., ds001_ctrl_matched_null.py
        0808b1b4... all equal to the manifest values.
    - id: AI-4
      check: the object substitution is genuine at the kernel level
      method: read the kernel sources at the snapshot.
      result: pass
      detail: >-
        naive_search, split_search and build_claw_table consume the object
        only through E.add, E.negate, point_sum and pt[0]. AdditiveGroupZN
        supplies exactly add and negate and encodes an element as the 1-tuple
        (g,) with None for the identity, so pt[0] yields the residue where a
        curve yields an x-coordinate. The substitution needs no kernel edit,
        which is what the contract demanded.
    - id: AI-5
      check: the legacy-null wrapper
      result: pass_with_minor_defect
      defect_id: DEF-V1
      detail: >-
        harvest_legacy_null is a second instrumented copy, of
        ds001_ctrl_unplanted.harvest_null, and its diff is NOT archived in the
        run package - only PD-1's prose asserts it. I recomputed that diff
        myself with the same difflib method. It is benign and of the same
        shape as AI-2 - counters, RSS sampling, backend labels, certificate
        capture after the timed segment, an honest table_build_count equal to
        the attempt count with an explanatory note - and the kernels
        null_naive_search and null_split_search are called unchanged. Not
        blocking, because I verified it, but a reader who did not would have
        to take it on assertion.
    - id: AI-6
      check: shared_backend_module_modified false
      result: pass
      detail: >-
        Verified by git diff across the run commit and the snapshot -
        ds001_driver.py and ds001_ctrl_unplanted.py are byte-identical, and
        implementation.md was appended to, never rewritten.

  # ====================================================================
  object_checks:
    - id: O-1
      check: Z/753848Z order equals the BATCH-020 curve group order exactly
      result: pass
      detail: >-
        experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-unplanted/raw-result.json
        instance.full_group_order is 753848 with p 752627 and subgroup n 241.
        MATCHED_NULL_MODULUS is 753848. I also regenerated the curve from seed
        101 at 20 bits and computed its order independently as 753848. The
        driver additionally refuses to run on a mismatch.
    - id: O-2
      check: factor base regenerates from seed 101 alone
      method: >-
        Reimplemented the documented draw procedure - random.Random(
        sha256("101:matched_null_factor_base") as int), repeated randrange(N)
        under rejection classes (a) zero, (b) duplicate, (c) 2g == 0 mod N,
        (d) negation already accepted - and rebuilt the signed list as
        [g1, N-g1, g2, N-g2, ...].
      result: pass
      detail: >-
        My regenerated 64 unsigned residues match unsigned_in_draw_order
        element-for-element, my 128 signed residues match
        signed_residues_in_order, and my sha256 of the comma-joined canonical
        serialization is
        2d9ae7b5943cd58f88551ce261a297b766183246f5b03811a1682796464d0ccc,
        equal to the recorded factor_base_sha256. 128 elements, all distinct,
        closed under negation (the sorted signed set equals its own negation
        set). Total draws 64 with all four rejection counters zero, matching
        the record.
    - id: O-3
      check: the 200 targets regenerate from seed 101 alone
      result: pass
      detail: >-
        random.Random(sha256("101:matched_null_targets")) then 200 randrange(N)
        draws gives target_stream_sha256
        4990e6255681cabe4a6f04256d3ceb453ffc3e7c09e77e8d938993a80fca7abd,
        equal to the record. 200 targets, no zero residue drawn, uniform on
        [0, N), no planted m-sums.
    - id: O-4
      check: the real re-measure object is the BATCH-020 object
      result: pass
      detail: >-
        Regenerating seed 101 at 20 bits yields p 752627, a 99676, b 5169,
        n 241, P (235279, 104113), and a factor base whose fb_x_hash is
        697365f1a41cc2980da10027da28e2ef0e9d9d3a996fa4d0cd0c3bcd4862a412,
        equal to the recorded value.
    - id: O-5
      check: representation-density matching is arithmetically as claimed
      result: pass
      detail: >-
        C(131,4) equals 11716640 multisets against N equals 753848, i.e.
        15.54 expected representations per uniform target, and it is labelled
        modeled. Empirically every one of the 200 matched-null targets and
        every one of the first 200 usable real targets produced a relation
        (empirical success probability 1.0 on both objects), which is
        consistent with that density.

  # ====================================================================
  amortization_parity_checks:
    - id: AM-1
      check: matched_null_split and real_split_remeasure each build the claw table once
      result: pass
      detail: >-
        claw_table_build_count is 1 on both, claw_table_amortized_once is true
        on both, and each has a separately measured build segment -
        0.009156832999906328 s on matched_null_split and
        0.010870416000216210 s on real_split_remeasure - with
        peak_claw_table_entries 8256 on both. Both arms are served by the same
        harvest wrapper, whose single pre-loop build I verified in the source.
        The D-5 amortization guard did NOT fire.
    - id: AM-2
      check: legacy_null_split reports 269 rebuilds, reported and not repaired
      result: pass
      detail: >-
        claw_table_build_count 269 equals attempted_targets 269,
        claw_table_amortized_once false, table_build_reported_wall_seconds 0.0
        with table_build_measurable false and an explicit note that
        ds001_driver.null_split_search builds its half-map inside every
        attempt so the segment cannot be split out without editing a frozen
        kernel. This is the RT047-B2 asymmetry carried forward honestly.
    - id: AM-3
      check: no per-arm field is null
      result: pass_with_note
      detail: >-
        The only null per-arm value anywhere is claw_table_amortized_once on
        the four non-split arms, which the wrapper sets to None by
        construction because the predicate is undefined for a naive arm. Every
        contract-required per-arm field - reported_wall_seconds,
        reported_backend_units, n_enum, n_usable, attempted_targets,
        success_count, empirical_success_probability,
        peak_claw_table_entries, peak_rss_bytes,
        reported_overhead_wall_seconds,
        table_build_reported_wall_seconds, per_arm_capped_attempt_count and
        stop_reason - is present and non-null on all six arms.

  # ====================================================================
  control_checks:
    - id: C-1
      check: matched null is the identical measurement on an object of the same shape
      result: pass
      detail: >-
        Order, composition law, factor-base cardinality and negation closure,
        arity m equals 4, target count, seed, stopping rule, cost identity and
        the search kernels are all held fixed; only the object changes. This
        is the null-object control docs/inventor-protocol.md section 3
        requires, and it is the control this batch exists to run.
    - id: C-2
      check: legacy null carried for disclosure only
      result: pass
      detail: >-
        Both artifacts and the summary state that
        NULL-DS-RANDOM-MULTIHOMOGENEOUS is DECLARED UNMATCHED for
        structure-dependence readings and that its R_null licenses no
        structure claim.
    - id: C-3
      check: no plant
      result: pass
      detail: >-
        plant_divisor is 1.0 on all six arms, plant_applied false on all six,
        synthetic_known_answer_used false, hardcoded_detection_used false,
        live_plant_run_in_this_batch false, and CTRL-RT025-PLANT-LIVE is
        recorded as remaining UNDISCHARGED after this batch.
    - id: C-4
      check: CTRL-RHO and CTRL-BSGS present, dominated_by not null
      result: pass
      detail: >-
        CTRL-RHO solved with k 43 in 744 group operations, certificate
        verified. CTRL-BSGS is explicitly labelled modeled (32 operations, 16
        stored elements). dominated_by carries three rows - measured rho,
        modeled BSGS, and the analytic one-modular-inversion baseline for the
        null object itself - across time, memory and stored elements.
        dominated_by_is_null is false.
    - id: C-5
      check: the decay direction the control is meant to test
      result: noted_not_a_defect
      detail: >-
        The parameter whose growth should destroy a generic meet-in-the-middle
        advantage is B, and the B-sweep is explicitly deferred to
        RT047-CTRL-2, not silently omitted. This run is a single-cell point
        measurement at B equals 64 and cannot exhibit a decay curve. The
        package says so. Any reading that needs the scaling of R with B is not
        supported by this receipt.

  # ====================================================================
  certificate_recomputation:
    claimed: 1200 of 1200 across six arms
    independently_reverified: 1200 of 1200
    per_arm:
      matched_null_naive: 200/200
      matched_null_split: 200/200
      real_naive_remeasure: 200/200
      real_split_remeasure: 200/200
      legacy_null_naive: 200/200
      legacy_null_split: 200/200
    how_i_reverified:
      - >-
        Additive arms - my own plain integer arithmetic. For each certificate
        I checked kind, modulus 753848, law additive, arity exactly 4, every
        summand strictly inside (0, N), every summand a member of the signed
        factor base I regenerated myself from seed 101, and
        sum(summands) mod N equal to the recorded target. No run code was
        called.
      - >-
        Real arms - I implemented affine short-Weierstrass point addition and
        doubling over F_752627 from scratch (including the P equals -Q
        identity case and modular inverse by Fermat), checked every summand
        and the target satisfy y^2 equals x^3 + ax + b, checked all four
        summands lie in the regenerated signed factor base, then added the
        four points in my own arithmetic and compared to the target. The
        curve parameters in each certificate were checked against
        (752627, 99676, 5169) first.
      - >-
        Legacy arms - I re-derived the blake2b acceptance predicate inline
        from its definition (digest_size 8, big-endian integer, modulus
        max(B^(m//2-1), 2), accept iff v mod modulus equals 0) over the
        message NULL_SPEC_ID|seed|bits|B|m|full|tag|xs, and checked factor-base
        membership and arity. ds001_driver.null_full_hit was never called.
      - >-
        Additionally checked that each arm's 200 certificates carry 200
        distinct targets, so no arm reached its count by re-solving one
        target.
    result: pass

  # ====================================================================
  metric_recomputations:
    - id: M-1
      metric: R_matched_null
      recomputed_from: >-
        per-arm reported_wall_seconds, reported_backend_units and n_usable in
        raw-result.json, with rho_gop_per_second derived from CTRL-RHO as
        744 / 0.0004716670000561862 equals 1577384.0440636566.
      wall_proxy_recomputed: 0.04718148140369263
      wall_proxy_recorded: 0.04718148140369263
      charged_unit_proxy_recomputed: 0.014736312270845113
      charged_unit_proxy_recorded: 0.014736312270845113
      agreement: exact
    - id: M-2
      metric: R_real_remeasure
      wall_proxy_recomputed: 0.03111559673494141
      wall_proxy_recorded: 0.03111559673494141
      charged_unit_proxy_recomputed: 0.014652593415947846
      charged_unit_proxy_recorded: 0.014652593415947846
      agreement: exact
    - id: M-3
      metric: R_null_legacy
      wall_proxy_recomputed: 107.58719106305873
      wall_proxy_recorded: 107.58719106305873
      charged_unit_proxy_recomputed: 0.9568759772858202
      charged_unit_proxy_recorded: 0.9568759772858202
      agreement: exact
    - id: M-4
      metric: bootstrap 95 percent CIs on the wall proxy
      method: >-
        reimplemented the estimator from the archived per_relation_wall_samples
        and reported_overhead_wall_seconds, seeded by
        sha256("101:boot_R_<name>"), 2000 replicates, percentile endpoints.
      result: exact reproduction of all three intervals
      values:
        R_matched_null_ci95_wall: [0.03889871487851398, 0.05786609854327616]
        R_real_remeasure_ci95_wall: [0.025799180307803374, 0.03735729774847203]
        R_null_legacy_ci95_wall: [94.55194172279988, 123.0928768753167]
    - id: M-5
      check: internal accounting identity per arm
      result: pass
      detail: >-
        For all six arms, sum(per_relation_wall_samples) plus
        reported_overhead_wall_seconds equals reported_wall_seconds to within
        1e-9, each arm carries exactly 200 per-relation samples, and
        empirical_success_probability equals success_count divided by
        attempted_targets exactly (1.0 on five arms, 200/269 equals
        0.7434944237918215 on legacy_null_split).
    - id: M-6
      check: the frozen cost identity is stated correctly and charged units never enter it
      result: pass
      detail: >-
        The verbatim disclosure appears in raw-result.required_disclosures.d1,
        summary.json, matched_null_report.json and
        proxy_sensitivity_report.json, and it explicitly supersedes the
        BATCH-020 optimistic_assumptions_restated[0] wording. My recomputation
        confirms the arithmetic - R is wall-derived, rho cancels between
        numerator and denominator, and the charged-unit figure is computed on
        a separate track and never mixed in.
    - id: M-7
      check: cross-file agreement
      result: pass
      detail: >-
        The ordered pairs are identical across raw-result.json,
        manifest.json, summary.json, R_cell.json,
        matched_null_report.json and proxy_sensitivity_report.json. The
        per-arm blocks in summary.json, R_cell.json arms_full and
        matched_null_report.json measured are field-identical to
        raw-result.json arms, and guards_observed is identical between
        summary and raw-result. No summary figure exists that is absent from
        the raw record.

  # ====================================================================
  d5_guard_statements:
    note: >-
      Every pre-registered D-5 branch condition is answered explicitly below.
      Answering them is an integrity statement; it is not a classification.
    guards:
    - guard: Validator returns INADMISSIBLE
      fired: false
      basis: this report returns ADMISSIBLE.
    - guard: certificate verification below 100 percent on any arm
      fired: false
      basis: >-
        1200 of 1200 re-verified independently by this session with its own
        arithmetic, 200 of 200 on every one of the six arms.
    - guard: per_arm_capped_attempt_count greater than zero on any arm
      fired: false
      basis: >-
        PER_TARGET_CAP_SECONDS 5.0 appears as an explicit field in
        manifest.json, raw-result.json and summary.json, with
        per_arm_capped_attempt_count present for all six arms and equal to 0
        on all six, and any_arm_capped false. The largest single per-relation
        wall observed anywhere is 0.10788795899952675 s on
        real_naive_remeasure, a factor of 46 under the cap; the largest on the
        matched-null arms is 0.04535120900072798 s. The cap demonstrably never
        bound. The disposition map is NOT suspended by this guard.
    - guard: the matched-null split arm does not amortize its claw table once
      fired: false
      basis: >-
        claw_table_build_count 1 on matched_null_split and 1 on
        real_split_remeasure, each with a separately measured build segment;
        legacy_null_split reports 269 and is disclosed, not repaired. This is
        the defect that invalidated the previous null and it is repaired on
        the arms that matter.
    - guard: an arm fails to reach 200 relations
      fired: false
      basis: >-
        n_usable is 200 on all six arms with stop_reason
        relations_target_reached on all six.
    - guard: the algorithm_invariance binding is broken by an undeclared code change
      fired: false
      basis: >-
        The one code change is declared as PD-1, its diff is archived, and I
        reproduced that diff byte-for-byte and read it as instrumentation
        only. All ten kernel source hashes and both shared-module file hashes
        reproduce. I found no undeclared change. The single documentation gap
        (DEF-V1, the unarchived legacy-null wrapper diff) is declared in prose
        by PD-1 and I verified it independently; it is not an undeclared
        change.
    - guard: the run terminates by timeout, crash, resource exhaustion or budget cancellation
      fired: false
      basis: >-
        status completed_valid, invalid_reason null, wall 11.028905 s against
        an 1800 s allowance, stderr.txt empty (0 bytes), exit clean. AN-1's
        unenforceable setrlimit is an infrastructure note - the cap was
        requested and refused by the host, and observed peak RSS 70434816 B
        against an 8 GB allowance means it could not have bound. Per AGENTS.md
        rule 5 that is never a mathematical negative, and here it is not even
        a measurement constraint.

  # ====================================================================
  reproducibility:
    pointer_exercised: true
    method: >-
      Re-ran the exact recorded command from the repository root with the same
      seed and arguments, redirecting --run-dir and --results-dir into an
      isolated scratchpad so no archived artifact could be touched. Exit code
      0, stderr empty, repository working tree still clean afterwards.
    deterministic_quantities_reproduced_exactly:
      - matched-null factor_base_sha256 and target_stream_sha256
      - real target_stream_sha256 and fb_x_hash
      - all ten kernel source hashes and the harvest wrapper diff
      - n_enum on all six arms (3508544, 51703, 3265770, 47852, 12151, 584524)
      - reported_backend_units on all six arms
      - n_usable and attempted_targets on all six arms (including 269 on legacy_null_split)
      - claw_table_build_count on all six arms (0, 1, 0, 1, 0, 269)
      - all 1200 certificates, byte-identical
      - both charged-unit ratios and the legacy charged-unit ratio, exactly
    wall_derived_quantities_reproduced_within_host_noise:
      R_matched_null_wall: 0.045359120181319726 against 0.04718148140369263, 3.86 percent low
      R_real_remeasure_wall: 0.030928918551602503 against 0.03111559673494141, 0.60 percent low
      R_null_legacy_wall: 106.49646331851304 against 107.58719106305873, 1.01 percent low
    tolerance_judgement: >-
      All three re-measured wall ratios fall inside the archived bootstrap 95
