  scope_and_authority:
    question_answered: >-
      Is the RUN-DS-001-ctrl-matched-null package, as committed at snapshot
      c781a2e7bb740f58dbf3e4c7773c143c3b910642, an admissible toy-tier
      empirical_only research receipt?
    completion_gate_answer: ADMISSIBLE
    explicitly_not_decided: >-
