    - I did not re-validate HEUR-DS-1, the Dickman-rho comparison, or EV-DS-002; they are out of this control's scope by contract.
    - I did not probe the model backend (`orchestration.adapter doctor --probe`), so model_verified remains false for both the producer's and my own inference block.
