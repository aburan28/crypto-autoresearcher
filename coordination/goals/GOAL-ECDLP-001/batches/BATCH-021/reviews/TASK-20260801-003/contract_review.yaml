  # ==================================================================
  # DOMINANT QUESTION 1
  # ==================================================================
  question_1_preregistration:
    verdict: PASS
    exhaustive_over_two_proxy_space: true
    mutually_exclusive: true
    method: >-
      Enumerated all nine (band(W), band(U)) pairs mechanically and evaluated the
      four branch conditions as literally written. Result - exactly one branch
      fires in every cell. LOW/LOW to D-1, HIGH/HIGH to D-2, MID/MID to D-3, and
      each of the six mixed pairs to D-4 alone. No cell fired zero branches and
      no cell fired two. The author's exhaustiveness_check claim is therefore
      CORRECT AS AUDITED, not accepted on assertion.
    unclassifiable_result_constructed: false
    doubly_classified_result_constructed: false
    gap_found_at_sub_branch_level: true
    sub_branch_gap:
      id: DEF-1
      severity: minor
      concrete_witness: >-
        W = 0.004 and U = 0.002 against a live real-arm re-measure of
        0.032 / 0.0147. Both proxies are LOW so D-1 fires. D-1a requires both
        proxies WITHIN a factor of 2 of the live re-measure, which 0.004 is not
        (it is 8x below). D-1b requires a proxy to EXCEED twice the re-measure,
        which 0.004 does not. The pair therefore falls in D-1 but in NEITHER
        sub-branch.
      why_it_is_only_minor: >-
        D-1a and D-1b differ only in the WORDING the write-up must use. The
        coordinator_decision, the hypothesis_status_transition, the
        refutation_artifact_required clause, the mandatory companions and the
        knowledge_promotion_expectation all sit at D-1 level and are identical
        across both sub-branches. The gap admits a post-hoc adjective, not a
        post-hoc disposition.
      direction_of_the_uncovered_corner: >-
        The uncovered corner is the one where the matched null is MORE advantaged
        than the real object, i.e. transfer greater than in full. That is the
        corner most adverse to the structure claim, so the gap does not shelter
        the hypothesis. It is still a gap.
    thresholds_genuinely_inherited: true
    threshold_provenance_audited:
      - threshold: 0.5
        inherited_from: >-
          H-DS-001 predictions.per_relation_cost_ratio_R and
          falsification_conditions[2] - "R_null < 0.5 whenever R < 0.5, apparent
          gain is an engine artifact". Also specification.v2 success_criterion S1.
        verdict: genuinely inherited, not reinvented
      - threshold: 0.9
        inherited_from: >-
          H-DS-001 statement clause "R_null >= 0.9 whenever R < 0.5" and
          specification.v2 success_criterion S1 plus falsification_criterion F2.
        verdict: genuinely inherited, not reinvented
    threshold_provenance_note: >-
      Both thresholds are applied to the NULL ratio in their source records and
      to the NULL ratio here, so the inheritance is on the same variable and
      not a quiet transplant onto a different quantity. The three-band split is
      the direct consequence of holding both frozen thresholds at once.
    mid_band_has_a_real_reading: true
    mid_band_assessment: >-
      D-3 is not a placeholder. It fixes a decision (inconclusive), fixes the
      status (analyzed, no transition), states why not weaken and why not
      structure, and names a specific next action including an object-cost-parity
      measurement. It commits in advance. But see DEF-2 - its stated RATIONALE
      misdescribes the frozen v2 criterion.
    could_this_map_have_been_written_after_seeing_a_result: false
    anti_post_hoc_evidence:
      - >-
        The map is hash-bound in a commit whose tree contains no matched-null run
        package, verified above. Pre-registration is checkable rather than
        asserted.
      - >-
        The branch the author explicitly predicts (D-1, anchor_expectation W about
        0.03 and U about 0.015) is the branch ADVERSE to the lane's own claim and
        carries the only status transition in the map. An author writing after
        seeing a favourable number would not have built the map this way.
      - >-
        D-2, the favourable branch, is deliberately constructed to be
        NON-PROMOTING - H-DS-001 stays `analyzed`, with the arithmetic reason
        given (one bit size supplied against a two-bit-size criterion). Making the
        favourable outcome unable to help is the signature of genuine
        pre-registration.
      - >-
        D-5 pre-empts all four substantive branches on instrument failure, so a
        defective run cannot be read into a band at all.
    forbidden_list_audited: true
    forbidden_list_finding: >-
      forbidden_under_every_branch covers S1_met, F1_met, structure_gate_passed,
      support, asymptotic and crypto-scale claims, affected-scheme statements,
      HEUR-DS-1 validation or refutation, reject_scoped including
      reject_scoped-as-impossibility, changes to H-IC-001 or H-STR-002,
      dominated_by null, and any movement of G1-G4. Cross-checked against every
      branch body - no branch prescribes anything on that list. D-1's `weaken` is
      not on the list and is a legitimate state-machine transition.
    d1_weaken_scoping_assessment: >-
      HONEST, with one recorded gap (DEF-3). The scoping is real rather than
      cosmetic - D-1 states in terms that the weaken is confined to the claim that
      the measured R evidences Semaev structure, states affirmatively that it is
      NOT a finding that the mechanism fails because the mechanism was never
      exercised, forbids reject_scoped, forbids lane closure with an explicit
      citation to the premature-closure rule, requires a refutation artifact
      archived in or before the same ledger commit, and mandates a replication
      plus the B-sweep as companions. The confirm/falsify asymmetry (D-1 moves
      status, D-2 does not) is not a bias defect - it is the correct asymmetry,
      and the contract gives the reason.

  # ==================================================================
  # DOMINANT QUESTION 2
  # ==================================================================
  question_2_matched_null:
    verdict: PASS
    destroys_target_structure: true
    destroyed_structure_audited: >-
      Z/753848Z under addition carries no curve, no x-coordinate, no point at
      infinity, no summation polynomial, no degree, no resultant, no
      multihomogeneous grading and no smoothness-bearing algebraic intermediate.
      Every Semaev and elliptic property the hypothesis names is absent. The
      contract additionally FORBIDS reusing curve x-coordinates as residues, which
      is the one route by which curve structure could have leaked back in.
    preserved_axes_audited:
      - axis: group order
        preserved: true
        verification: >-
          RUN-DS-001-ctrl-unplanted/raw-result.json records
          instance.full_group_order = 753848 (with p = 752627 and
          subgroup_order_n = 241). The null modulus N = 753848 matches EXACTLY.
          Order is not confounded with object. Verified against the archived run
          record, not taken from the control's own prose.
      - axis: composition law
        preserved: true
        verification: >-
          Abelian group operation on a set of the same cardinality; negation is
          N-g, matching point negation.
      - axis: factor-base geometry and size
        preserved: true
        verification: >-
          64 unsigned elements, 128 signed, closed under negation, matching the
          archived instance.factor_base_size = 64 and
          signed_factor_base_size = 128. The rejection rule excluding g = N/2 =
          376924 is correct and necessary - that element is its own negation and
          would otherwise collapse the signed base to 127.
      - axis: arity m
        preserved: true
        verification: m = 4 frozen, identical to the BATCH-020 cell.
      - axis: representation density
        preserved: true
        verification: >-
          Recomputed independently. C(131,4) = 11716640 multisets against
          N = 753848 gives 15.5 expected representations per uniform target. The
          control's "about 1.2e7" and "about 16" are accurate, and the density
          therefore matches the BATCH-020 cell rather than silently moving the
          success-probability regime. Deliberate, and the contract says so and
          assigns the sparse regime to RT047-CTRL-4.
      - axis: the algorithm
        preserved: true
        verification: >-
          algorithm_invariance binds naive_search and split_search to run
          UNCHANGED, freezes smoothness_abort false, relations_target 200, seed
          101, m 4, B 64, charge_backend_units and its constant charge of 40, the
          backend_id, the identity encode_intermediate with D = 2^40 against
          residues below 2^20, and the exact-equality claw_key hash join. An
          inability to parameterize the object without touching search logic must
          be declared as a protocol deviation with the exact diff, and D-5 fires
          if the invariance binding is broken by an undeclared code change.
    amortization_parity_specified_explicitly_enough: true
    amortization_finding: >-
      THE RT047-B2 DEFECT CANNOT RECUR SILENTLY. The previous null failed because
      null_split_search was a DIFFERENT PROCEDURE that rebuilt a 4096-entry table
      inside every attempt while the real split arm built its table once
      (table_build_reported_wall_seconds = 0.0119 s amortized over 200 relations),
      manufacturing R_null = 111.4 out of an amortization mismatch. This control
      closes that route three times over, and the three closures are independent -
      (1) algorithm_invariance forbids a separate procedure at all, so the
      once-built table comes from running the same code;
      (2) D-5 fires and SUSPENDS the entire map if the matched-null split arm does
      not amortize its claw table once as the real split arm does, which is a
      pre-registered guard rather than a post-hoc observation;
      (3) required_per_arm_fields makes table_build_reported_wall_seconds and
      peak_claw_table_entries mandatory FOR EVERY ARM, so the omission that let
      the legacy null record them as null is itself now an admissibility failure,
      and required_disclosures forces an explicit yes-or-no statement on whether
      the matched-null split arm amortizes once.
      That is sufficient. A strengthening is recommended below, not required.
    non_structural_confounds_i_hunted:
      - id: CONF-1
        name: per-operation cost of modular addition versus curve addition
        mechanism: >-
          A modular addition is orders of magnitude cheaper than a curve addition.
          Both arms get cheaper, but the split arm's dict-build and hashing
          overhead does NOT get cheaper, so its fixed overhead becomes a larger
          share of its wall time. This inflates W upward relative to the real-arm
          R for a reason that has nothing whatsoever to do with structure, and it
          pushes the observation toward D-2 and D-3.
        neutralized_by_the_contract: partially
        how: >-
          The charged-unit proxy U is object-independent by construction - the
          frozen charge is a constant 40 per membership call regardless of which
          group the call ran in - so this confound moves W and leaves U alone.
          Requiring D-2 to satisfy W >= 0.9 AND U >= 0.9 therefore means the
          confound alone cannot produce a structure reading. A confound-driven
          split lands in D-4, which is exactly the correct disposition and is
          labelled a positive cost-model finding rather than an ambiguity. This is
          the strongest design decision in the document and it should be credited.
        residual: >-
          D-2 does not require the object-cost-parity measurement that D-3
          requires, even though D-2 is the branch where the confound is most
          consequential. Recorded as DEF-4.
      - id: CONF-2
        name: factor-base selection policy is confounded with the object
        mechanism: >-
          The real arm's base is a frozen DETERMINISTIC subset of E(F_p)
          (H-DS-001 assumptions; fb_x_hash archived). The null base is RANDOM
          residues, and the control explicitly FORBIDS any deterministic-subset or
          structured base. So the matched null differs from the real object along
          TWO axes, object AND base-selection policy, not one.
        assessment: >-
          Unavoidable in variant (a) - a deterministic-subset policy has no
          meaning without a curve, and the alternative would smuggle structure in.
          Direction matters - under D-1 the confound is harmless a fortiori,
          because if the advantage transfers it transfers regardless of which of
          the two differences carried it, and either way it is not Semaev
          structure. Under D-2 and D-3 it is a live alternative explanation that
          the map does not name.
        cheapest_discriminating_control: >-
          RT047-CTRL-1 VARIANT (b) - keep E(F_p) and replace only the factor base
          with 64 uniformly random curve x-coordinates. That single arm separates
          object structure from base-selection policy at essentially zero cost,
          and it is already written in RT-20260731-047. Recorded as DEF-5.
      - id: CONF-3
        name: the two groups may be isomorphic
        mechanism: >-
          If E(F_p) is cyclic of order 753848 it is isomorphic to Z/753848Z, so
          the null destroys the REPRESENTATION and the Semaev machinery but not
          the abstract group.
        assessment: >-
          Not a defect. Destroying the representation and the summation-polynomial
          machinery is precisely the intended lesion, and preserving the
          composition law is a matched-control requirement, not a leak. It does
          sharpen the prior - if the objects are abstractly isomorphic and the
          algorithm is held fixed, a D-2 outcome is more plausibly a cost or
          base-policy artifact than structure, which is a further argument for
          DEF-4 and DEF-5.
    accidental_structure_retained: >-
      None found that threatens the reading. Negation closure means multisets
      containing both g and N-g cancel, so m-sums are not uniformly distributed -
      but the identical effect is present on the signed curve base, so it is
      MATCHED rather than introduced. N is composite and Z/N has proper subgroups,
      but the archived curve group of the same order does too, so this is matched
      as well.
    null_object_hardness_note: >-
      Discrete log in Z/NZ is trivial by one modular inverse. The contract states
      this itself and correctly draws the consequence - the control measures
      ALGORITHM COST ONLY and claims nothing about hardness. Accepted, and this is
      the right handling.

  # ==================================================================
  # ADDITIONAL REQUIRED CHECKS
  # ==================================================================
  additional_checks:
    per_target_cap_declared:
      status: PASS
      value: 5.0
      units: seconds
      bias_direction_declared: true
      bias_direction_text_verified: >-
        The contract states the cap truncates the slower naive arm first and
        therefore biases R DOWNWARD, in the direction that flatters the split arm.
        That is the correct direction and matches Validator defect D-3.
      suspension_guard_present: true
      guard_semantics: >-
        Any arm with per_arm_capped_attempt_count > 0 SUSPENDS the disposition map
        for that run; the run is reported cap_truncated, the decision is
        inconclusive on the instrument, and the repair is to raise the cap and
        re-run. Correctly routed as AGENTS rule 5 infrastructure signal rather
        than a mathematical negative in either direction.
      independent_verification_of_the_non_binding_claim: >-
        VERIFIED. The archived per_relation_wall_samples on real_naive have a
        maximum near 0.1196 s against the 5.0 s cap, so the cap demonstrably never
        bound at the BATCH-020 cell. The contract's own caution that this is a
        property of the cell and not of the driver is correct and is retained.
      mandatory_reporting_present: true
    both_proxies_required_neither_privileged:
      status: PASS
      finding: >-
        both_proxies_mandatory makes every ratio an ordered pair and declares any
        table, summary line or prose sentence giving one number without the other
        a protocol violation. All three required ratios carry
        proxies [wall, charged_units]. D-4 refuses to resolve a proxy
        disagreement by picking a proxy and labels the disagreement a positive
        finding. Neither proxy is privileged anywhere in the document.
      defect: see DEF-6 - the charged-unit proxy has no written formula.
    live_plant_excluded:
      status: PASS
      finding: >-
        live_plant_prohibition sets forbidden true, requires plant_divisor 1.0 on
        every arm, requires plant_applied false and
        synthetic_known_answer_used false, and states that
        CTRL-RT025-PLANT-LIVE remains UNDISCHARGED and stays undischarged after
        this batch. The reason given (RT047-B3 - the detector is a threshold-free
        strict inequality on a split-only divisor with R_on/R_off = 1/4 by
        algebra, false-positive rate 1, no measured specificity) is accurate and
        the exclusion follows from it. explicitly_not_discharged_here names
        RT047-CTRL-2, -3 and -4 with reasons rather than letting them lapse.
    claim_ceiling_toy:
      status: PASS
      finding: >-
        claim_tier toy, confirmatory_status exploratory_control, and a
        claim_ceiling that forbids crypto-scale improvement, asymptotic support,
        S1_met on any cell, F1_met, structure_gate_passed, GOAL completion,
        HEUR-DS-1 validation or refutation, changes to H-IC-001 or H-STR-002,
        affected-scheme scope statements and dominated_by null, with G1-G4 held
        OPEN and RT038-B1..B7+M1 and RT047-B1..B5+M1 held binding. No branch
        breaches it.
    dominated_by_handling:
      status: PASS
      finding: >-
        dominated_by MAY NOT be null is stated as a requirement, the BATCH-020
        matched rho (744 measured group operations) and BSGS (32 modeled
        operations, 16 stored elements) rows are carried forward, and the null
        object's own trivial baseline is added. Time, memory and stored-element
        axes all appear. This satisfies the inventor-protocol Pareto obligation
        rather than deferring it.
    parent_contract_binding:
      status: PASS
      finding: >-
        parent_contract_sha256 recomputed over
        experiments/EXP-DS-001/specification.v2.yaml equals the declared
        898304bfc9225062e68c5d7977d1490cad95957e856847676ef7ae1423a5636a. Same
        value as the archived RUN-DS-001-ctrl-unplanted contract block, so the
        binding is consistent across batches. parent_approval_snapshot 65f3c82b
        and parent_approval_decision DEC-20260731-022 are carried.
    immutable_inputs_untouched:
      status: PASS
      finding: >-
        The snapshot is additive only. specification.v2.yaml,
        CTRL-RT025-UNPLANTED.yaml, v2_ctrl_unplanted.yaml, ds001_driver.py,
        ds001_ctrl_unplanted.py, the RUN-DS-001-ctrl-unplanted package and
        EV-DS-001/002/003 are unmodified in the working tree relative to the
        snapshot and were not touched by it.
    supersession_semantics:
      status: PASS
      finding: >-
        The addendum supersedes only the FORWARD READING of the null axis and
        leaves prior R_null figures standing as measurements that license no
        structure claim. That is the correct correction-by-new-record discipline
        under AGENTS rule 4, not an overwrite.
    fidelity_to_the_prescribed_next_action:
      status: PASS
      finding: >-
        Compared clause by clause against RT-20260731-047 RT047-CTRL-1 variant (a)
        and its next_concrete_action. Every element is present - unchanged
        naive_search and split_search, smoothness_abort false, same
        charge_backend_units, same cost identity, 200 relations, seed 101,
        Z/753848Z, a 128-element negation-closed random signed base, 200 uniform
        random targets, and both proxies. n_enum, which RT047 asked for
        explicitly, appears in required_per_arm_fields. The control implements the
        prescribed action faithfully and adds the same-host re-measure arms, which
        RT047 did not ask for and which are a genuine improvement.

  # ==================================================================
  defects:
    - id: DEF-1
      severity: minor
      blocking: false
      title: D-1a and D-1b do not partition D-1
      detail: >-
        See question_1_preregistration.sub_branch_gap. A D-1 result with a proxy
        strictly below half the live re-measure satisfies neither sub-branch
        condition. Affects the mandated wording only; every disposition sits at
        D-1 level.
      resolution_without_editing_the_map: >-
        TASK-20260801-009 records that if the uncovered corner materializes, the
        write-up uses the D-1b language (transfer is PARTIAL or, here, DISPARATE)
        and must not round to "identical". Choosing the more conservative of the
        two pre-written readings is not a post-hoc invention.
    - id: DEF-2
      severity: minor
      blocking: false
      title: >-
        D-3's stated rationale misdescribes the frozen v2 F2 criterion, and the
        amendment's "does not change F2" claim is inaccurate in the MID band
      detail: >-
        specification.v2 falsification_criterion F2 reads "R < 0.5 AND
        R_null < 0.9 on the matched null" and states explicitly that this INCLUDES
        the former middle band 0.5 <= R_null < 0.9, so that every R < 0.5 outcome
        is either S1-eligible on the null axis or F2. Under the frozen contract a
        MID/MID matched-null result with R_real < 0.5 IS F2_met. D-3 nonetheless
        justifies `inconclusive` by asserting that "the falsification condition is
        stated at the 0.5 threshold and is NOT met in this band" and that a weaken
        "would be the Coordinator inventing a threshold after the fact". The 0.9
        threshold is not invented - it is frozen in F2 and it already absorbs the
        middle band. The amendment's non_changes claim that the v2 F2 criterion is
        unchanged is therefore inaccurate for this one cell.
      why_not_blocking: >-
        Three reasons, and I weighed them explicitly. First, F2_met's prescribed
        disposition in specification.v2 is reject_scoped, which DEC-20260801-003
        and the Coordinator contract independently forbid on a single unreplicated
        empirical-only run, so `inconclusive` is the residual disposition and D-3
        reaches the right ACTION by a wrong ROUTE. Second, the map is uniformly
        softer than F2's literal disposition, including at D-1, and says why, so
        this is not a MID-specific escape hatch. Third, MID/MID is a
        low-probability corner given that the charged-unit proxy is largely
        determined by fixed enumeration counts (see DEF-7).
      resolution_without_editing_the_map: >-
        The frozen v2 F2 criterion binds of its own force and the disposition map
        cannot suspend it. The run and the decision MUST record the F2/R-1
        observation label (the archived BATCH-020 raw-result carries
        r1_observation_label, and this control does not require it - that omission
        is part of this defect). If MID/MID fires, the record states plainly that
        F2 as frozen in specification.v2 is met while the reject_scoped disposition
        F2 prescribes is unavailable on an unreplicated single run, and the
        decision is inconclusive for THAT reason. This makes the reading stricter,
        not looser, so it is not an amendment to a success criterion.
    - id: DEF-3
      severity: minor
      blocking: false
      title: D-1 omits the R_real < 0.5 conjunct of the falsifier it claims to fire
      detail: >-
        H-DS-001's falsification condition is "R_null < 0.5 WHENEVER R < 0.5", and
        v2's F2 likewise conjoins R < 0.5. D-1's condition is stated purely on
        W and U, which are the MATCHED-NULL ratio. If the live real-arm re-measure
        were to land at or above 0.5 on either proxy, D-1 would still fire and
        would still assert that H-DS-001's own falsification condition fired, which
        would be false in that corner, while prescribing a status transition to
        `weakened` on that false premise. The reference_values clause requires a
        re-measure deviating by more than 2x from the 0.0322 / 0.0147 anchors to be
        reported as host variance, but nothing suspends D-1.
      likelihood: >-
        Low - it would take roughly a 15x to 34x host deviation. Low is not zero,
        and a status transition recorded on a false premise is exactly what this
        review exists to catch.
      resolution_without_editing_the_map: >-
        TASK-20260801-004 records as an approval condition that D-1's weaken is
        available only if the live re-measure R_real is below 0.5 on BOTH proxies;
        otherwise the run is read as instrument signal under D-5's
        never-a-mathematical-result clause and the decision is inconclusive. This
        only removes an adverse transition, so it cannot flatter the hypothesis.
    - id: DEF-4
      severity: minor
      blocking: false
      title: D-2 does not require the object-cost-parity measurement that D-3 requires
      detail: >-
        CONF-1 above is a concrete non-structural mechanism that pushes the ratio
        upward on the cheaper-arithmetic object. D-3 names it and requires a
        per-operation cost comparison of modular addition against curve addition
        on the same host. D-2, the branch where a spurious upward push would be
        read as THE FIRST GENUINE STRUCTURE EVIDENCE, requires no such measurement.
      why_not_blocking: >-
        The two-proxy AND condition already blocks the confound from producing D-2
        on its own, because the charged-unit proxy is object-independent. D-2's
        consequences are also bounded to `replicate` with no status change.
      resolution_without_editing_the_map: >-
        If D-2 fires, the object-cost-parity measurement and RT047-CTRL-1 variant
        (b) are both required before the result is described as structure
        evidence anywhere. Adding required controls to a favourable branch is a
        tightening.
    - id: DEF-5
      severity: minor
      blocking: false
      title: object structure and factor-base selection policy are confounded
      detail: See non_structural_confounds_i_hunted CONF-2.
      cheapest_discriminating_control: >-
        RT047-CTRL-1 variant (b) - E(F_p) retained, factor base replaced by 64
        uniformly random curve x-coordinates. One arm, essentially free, already
        specified in RT-20260731-047.
      resolution_without_editing_the_map: >-
        Record the confound as a scope limit on any D-2 or D-3 reading and rank
        variant (b) into BATCH-022 beside the B-sweep. Under D-1 the confound is
        harmless a fortiori and the write-up should say why.
    - id: DEF-6
      severity: minor
      blocking: false
      title: the charged-unit proxy U has no written formula in the contract
      detail: >-
        The frozen cost identity is wall-derived, and the contract correctly
        insists that charged units never enter it. But U is a DECISION VARIABLE of
        the pre-registered map and its computation is nowhere defined. I recovered
        the intended definition by reproducing the reference figures from the
        archived run - 1914080/130630800 = 0.014653, quoted as 0.0147, and
        465080/486040 = 0.95688, quoted as 0.9569 - so U is
        reported_backend_units per arm, divided by n_usable, the divisor
        cancelling when both arms reach 200.
      why_not_blocking: >-
        The two candidate definitions (raw unit ratio and per-relation unit ratio)
        COINCIDE whenever both arms reach 200 relations, and D-5 fires if any arm
        does not. There is therefore no residual analyst degree of freedom at
        execution time. It should still have been written down.
      resolution_without_editing_the_map: >-
        The Executor records the formula verbatim in summary.json and
        proxy_sensitivity_report.json and shows that both candidate definitions
        agree on this run.
    - id: DEF-7
      severity: minor
      blocking: false
      title: >-
        the U limb is weakly informative, so two-proxy agreement is not two
        independent confirmations
      detail: >-
        charge_backend_units charges a constant 40 per membership call regardless
        of the group, and the algorithm, B, m and target count are all held fixed.
        U is therefore close to a function of the enumeration counts rather than a
        measurement of the object, and U near 0.0147 is close to a foregone
        conclusion. The informative limb is W. This does not make the map wrong -
        D-1 requires both limbs and D-4 catches disagreement - but a write-up that
        presents "both proxies agree" as two independent confirmations of the
        artifact reading would overstate the evidence.
      resolution_without_editing_the_map: >-
        Add a required disclosure at TASK-20260801-009 stating that U is largely
        determined by the fixed enumeration counts and that the discriminating
        measurement is W, with the corollary that a D-2 outcome would require U to
        move for reasons the fixed algorithm does not obviously permit.
    - id: DEF-8
      severity: trivial
      blocking: false
      title: undefined ratios are not explicitly routed to D-5
      detail: >-
        The exhaustiveness claim is over the extended reals. A zero-denominator or
        NaN ratio is not an extended real. Practically unreachable, since an arm
        that fails to reach 200 relations already fires D-5 and wall times here are
        far above clock resolution.
      resolution_without_editing_the_map: >-
        Treat any undefined ratio as a D-5 instrument signal. This is the reading
        D-5 already gives every other instrument failure.

  recommended_strengthenings_not_required:
    - >-
      Record an integer claw_table_build_count per arm and assert it equals 1 on
      both split arms. The present proxies (table_build_reported_wall_seconds and
      peak_claw_table_entries, both mandatory per arm) do detect a per-attempt
      rebuild, so this is a convenience, not a gap.
    - >-
      Record the r1_observation_label and the F1/F2/F3 flags in raw-result.json as
      the BATCH-020 package did, so the frozen v2 criteria are evaluated on the
      record rather than only through the disposition map. Connected to DEF-2.

  reading_limits_binding_on_task_009:
    - DEF-2 - the frozen v2 F2 criterion binds independently of the map and its
      observation label must be recorded.
    - DEF-3 - D-1's weaken requires the live re-measure R_real below 0.5 on both
      proxies.
    - DEF-4 and DEF-5 - a D-2 or D-3 reading requires object-cost-parity and
      RT047-CTRL-1 variant (b) before the word "structure" is used.
    - DEF-7 - the write-up must not present two-proxy agreement as two independent
      confirmations.

  why_not_revise: >-
    Under RC-21 a REVISE at any severity records BATCH-021 non-execution for the
    control run, so the question is whether any defect found would corrupt the
    measurement or license an unearned claim. None does. The two dominant
    questions both pass on their merits and were audited rather than accepted -
    the disposition map is exhaustive and mutually exclusive over all nine
    two-proxy band cells by mechanical enumeration, its thresholds are traceable
    to H-DS-001 and to specification.v2's S1 and F2 rather than invented, its
    middle band commits to a decision and a next action, and its favourable branch
    is deliberately built to be non-promoting. The matched null preserves the
    order (verified at 753848 against the archived run record, not against the
    control's prose), the composition law, the base geometry, the arity, the
    density (recomputed at 15.5 representations per target) and the algorithm,
    while destroying every elliptic and Semaev property. The specific failure the
    task named as REVISE-if-absent - the legacy null's per-attempt table rebuild -
    is closed three independent ways, one of which is a pre-registered D-5
    suspension naming that exact defect. The eight defects recorded are labelling
    and rationale corners, each resolvable by a stricter reading recorded at
    approval or at decision time without editing any hash-bound artifact, and none
    of them is capable of producing a false positive for the hypothesis. Blocking
    the single measurement that finally tests this lane's load-bearing inference
    over corners of that kind would itself be a failure of proportion.

  what_would_have_forced_revise: >-
    Recorded so this PASS is falsifiable rather than agreeable. Any one of - the
    matched null failing to match the group order; the split arm's amortization
    parity left unspecified or unguarded; PER_TARGET_CAP_SECONDS undeclared or
    declared without its bias direction; either cost proxy privileged over the
    other; a branch prescribing S1_met, support, reject_scoped or any asymptotic
    movement; a gap or an overlap at the TOP level of the map, which I searched
    for mechanically and did not find; a live plant admitted to this batch; or a
    parent_contract_sha256 that did not reproduce.

  prohibitions_observed:
