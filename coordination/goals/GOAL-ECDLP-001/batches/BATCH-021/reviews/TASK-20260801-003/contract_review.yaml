contract_review:
  id: REV-20260801-003
  task_id: TASK-20260801-003
  role_assigned: reviewer
  role_served_by: red-team
  role_mapping_note: >-
    The BATCH-021 dispatch queue assigns this task the role `reviewer`. This
    harness provides no dedicated reviewer subagent, so the task was served by
    the red-team subagent under the review-adversarial contract. Recorded
    honestly here rather than silently relabelled. The session did not author
