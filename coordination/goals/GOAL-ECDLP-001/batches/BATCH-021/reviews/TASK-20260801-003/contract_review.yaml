  snapshot_integrity:
    working_tree_matches_snapshot: true
    method: >-
      git diff --stat against 8d28be76 over experiments/EXP-DS-001 and ledger
      returned empty; git status --porcelain clean at review start.
    declared_path_count_verified: 4
    declared_paths_verified:
      - experiments/EXP-DS-001/controls/CTRL-RT047-MATCHED-NULL.yaml
      - experiments/EXP-DS-001/amendments/v2_ctrl_matched_null.yaml
      - ledger/decisions/DEC-20260801-004.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/archives/TASK-20260801-002/snapshot_commit_receipt.json
    snapshot_adds_only: true
    snapshot_adds_only_evidence: >-
      git show --stat 8d28be76 reports 4 files, 1244 insertions, 0 deletions.
      No immutable input was edited by the snapshot.
    parent_contract_sha256_recomputed: 898304bfc9225062e68c5d7977d1490cad95957e856847676ef7ae1423a5636a
    parent_contract_sha256_matches_declared: true
    no_run_package_exists_yet: true
    no_run_package_evidence: >-
