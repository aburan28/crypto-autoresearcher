  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  batch_id: BATCH-021
  experiment_id: EXP-DS-001
  hypothesis_id: H-DS-001
  under_review:
    protocol_amendment_id: PA-DS-001-v2-ctrl-matched-null
    control_protocol_path: experiments/EXP-DS-001/controls/CTRL-RT047-MATCHED-NULL.yaml
    amendment_path: experiments/EXP-DS-001/amendments/v2_ctrl_matched_null.yaml
    bound_snapshot: 8d28be76f688b0120e74449322723d7d3ce3011d
    bound_snapshot_parent: 257a7b23f3c28d7947d2848d8ab06deb510b7fca

  verdict: PASS
  recommendation_to_task_004: APPROVE

  verdict_scope: >-
