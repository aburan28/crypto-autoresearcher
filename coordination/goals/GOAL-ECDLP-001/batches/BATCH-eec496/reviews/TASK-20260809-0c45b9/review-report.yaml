      residual: 0
      limitation: >-
        A regression coefficient computed from the five pointwise upper-bound
        values H_N_upper is a descriptor of that conservative finite ladder;
        pointwise upper bounds alone do not furnish a confidence bound on the
        slope of the unknown true H_N. The contract avoids overclaiming only
        because it explicitly limits gamma_fixed to the generated toy ladder
        and prohibits asymptotic and unseen-draw inference.

    - id: B7-unfrozen-curve-target-generation
      assertion: A-B7
      status: REVISE
      passing_checks:
        - public seed, SHAKE256, six added domains, key fields, caps, and exhaustion classes are present
        - all 21 inherited-plus-added literal domains are distinct
        - field-prime candidate mapping and special-curve rejection predicates are explicit
        - accepted public family is frozen before treatment and rerolls are forbidden
      blocking_residual: >-
        The curve-coefficient contract gives 16-byte words, coefficient_id,
        and four attempts but no exact word-to-F_p map, rejection threshold,
        per-coefficient attempt selection rule, or canonical coefficient
        encoding. The base-point rule does not freeze the x/sign bit layout,
        x rejection or reduction rule, square-root/sign convention, or point
        encoding. Target and decoy scalar rules say exact rejection-uniform but
        do not freeze which exact 128-bit rejection algorithm maps attempts to
        1..r-1; several unbiased algorithms produce different replay bytes.
        Certificate encodings are also unspecified despite a byte-for-byte
        replay gate. Independent implementations can therefore satisfy the
        prose while generating different curves, targets, rejection logs, and
        certificates.
      required_repair: >-
        Freeze literal absorb order and encodings plus exact candidate,
        threshold, attempt, sign, square-root, point, scalar, certificate, and
        rejection-log algorithms, with deterministic known-answer fixtures.

    - id: B8-x-v-s-and-overflow-gap
      assertion: A-B8
      status: REVISE
      passing_checks:
        - X is counted on the complete exact-match stream before capacity handling
        - every nonoverflow distinct candidate is delivered exactly once
        - S is defined as one if and only if V is positive
        - a thirty-third candidate invalidates instead of truncating
        - overflow and scalar-orientation mutations are mandatory
      blocking_residual: >-
        lossless_success_interface requires X=V only for valid prime-order
        exact-witness fixtures. It does not universally require X=V for every
        actual treatment and same-path-null root, nor cite a proof that every
        actual distinct exact A match deterministically yields the unique
        verifying scalar. Consequently an actual root may have X>V without an
        explicit invalidation, leaving the preserved X-based bridge and the
        claimed X-to-V losslessness disconnected from runtime S.
      required_repair: >-
        Require and archive X=V for every admitted treatment/null root, or bind
        a checked proof that the actual witness-to-scalar map makes equality
        unavoidable; specify that any actual mismatch invalidates before fit.

    - id: B9-nonidentical-null-path
      assertion: A-B9
      status: REVISE
      passing_checks:
        - curves, targets, models, roots, lists, widths, buffers, transforms, joins, verifier, metrics, hashes, and archive code are declared identical
        - treatment and null both use streaming pair hashes and do not persist pairs
        - treatment and null logical streaming bytes are each 207871016960
        - existing controls are preserved
      blocking_residual: >-
        The sole changed label lane is not reproducibly frozen. An
        XOF-keyed even permutation and paired sign complement does not specify
        the permutation construction, ordering of the four odd-length lists,
        pair involution, initial sign, tie handling, or exact mapping from the
        16-byte word to a permutation. Those choices can change the joined
        null outcomes while retaining perfect label balance and all declared
        shape properties, so the nearby null remains selectable at
        implementation time.
