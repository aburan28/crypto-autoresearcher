  claim_under_review: >-
    Whether immutable snapshot 633b538e4301cedbaf6718d662eb407e72d758e2
    repairs every B1--B12 pre-execution defect and can support a future toy
    fixed-target statement by replacing reciprocal marginal success with
    simultaneous per-input lower bounds, fitting a finite-family harmonic
    restart coefficient, and requiring that coefficient to exceed 5/18 after
    a complete physical-cost charge, while preserving losslessness, an
    identical-path null, reproducible public inputs, exact artifacts, a strict
    toy finite-ladder ceiling, and verifier-secret noninterference.
  overall_rationale: >-
    REVISE. The snapshot, hashes, strict parsing, cap sums, corrected bucket
    populations, chronology, literal future paths, symbolic crossover
    equalities, toy-only ceiling, and false execution authority all pass. The
    repaired fixed-target inference does not. The 160 one-sided Hoeffding
    bounds validly imply pointwise upper bounds H_N<=H_N_upper with familywise
    confidence at least 199/200, but pointwise upper bounds do not order the
    slope of H_N across the five sizes. Fitting the upper-bound vector and
    bootstrapping that fit therefore does not produce a lower confidence bound
    for the true harmonic coefficient. The complete physical-cost section is
    also a prospective class inventory rather than a defined per-size total-
    cost assembly: it never freezes or fits H_N times per-root work times the
    storage/wiring charge against rho. Additional blocking gaps remain in the
    throughput-class map, byte-exact generators, all-root X-to-V equality,
    the null-label algorithm, and the verifier-secret boundary. These are
    repairable static design defects, not evidence against H-SYC-b854f4.

