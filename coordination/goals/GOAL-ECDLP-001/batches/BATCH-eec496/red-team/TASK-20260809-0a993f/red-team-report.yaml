    - blocker: B3-stale-bucket-artifact-count
      assertion: A-B3
      adjudication: PASS
      evidence: >-
        259391488+5*64847872=583630848 exactly for the preserved population;
        2*259391488+4*64847872=778174464 exactly after replacing the old
        balanced arm with the treatment-shape null. The forbidden stale value
        585105408 differs from the preserved count by 1474560 padding values,
        and padding events are fixed at zero.

    - blocker: B4-control-order-conflict
      assertion: A-B4
      adjudication: PASS
      evidence: >-
        specification.yaml:256-294 freezes one authoritative chronological
        S0--S5 order, places selector controls in S1 and repeated coverage in
        S2, and explicitly supersedes conflicting source order only without
        deleting a control or population.

    - blocker: B5-nonexact-artifact-paths
      assertion: A-B5
      adjudication: PASS_LITERAL_PATH_REPAIR
      evidence: >-
        The future manifest contains 11 implementation paths and 37 run paths,
        all 48 are unique literal repository-relative paths under the fixed
        experiment or RUN-SYC-84baf2-5ea829 root, contain no glob metacharacter,
        and are absent from the producer snapshot as expected. Any new path
        required by the repairs below must be introduced by a new version, not
        silently appended to this manifest.

    - blocker: B6-marginal-fixed-target-inversion
      assertion: A-B6
      adjudication: REVISE
      passed_checks:
        - The marginal p_bar_N is explicitly diagnostic-only and its reciprocal is forbidden as fixed-target cost.
        - The four model outcomes for one root are treated as one bounded correlated vector, not four independent Bernoulli samples.
        - With 256 root vectors and per-bound error 1/32000, the stated Hoeffding offset is sqrt(log(32000)/512)=0.142340173403076.
        - A union bound over 160 inputs gives familywise one-sided error at most 1/200.
        - If all p_i>=L_i and every L_i is positive, H_N is at most the stated mean of 1/L_i pointwise.
        - The diffuse/concentrated fixture correctly separates reciprocal marginal probability from harmonic cost.
      blocking_evidence: >-
        specification.yaml:508-528 fits log(H_N_upper) and applies a bootstrap
        LCB to gamma_fixed. The simultaneous event gives only H_N<=H_N_upper
        at each size. Pointwise order does not imply slope order: an admissible
        upper-bound vector can be inflated more at a smaller size than at a
        larger size and therefore have a smaller fitted slope and a larger,
        falsely favorable gamma_fixed than the true H_N vector. Reusing the
        predecessor whole-curve bootstrap indices does not turn a pointwise
        confidence rectangle into a confidence bound on slope, and the
        contract freezes no minimization over all p_i in the simultaneous
        confidence set. It also forbids inference to unseen generator draws,
        leaving the inferential population of the whole-curve bootstrap
        unspecified. Finally, p_i averages four model views but the operational
        restart rule does not state whether each attempt resamples one uniform
        model or runs an OR over all four; 1/p_i is exact only for the former.
      required_repair: >-
        Freeze the operational model draw per attempt. Replace the plug-in
        slope of H_N_upper with either a direct finite-ladder cost inequality
        or a simultaneous confidence-set optimization whose worst case proves
        the claimed coefficient for every p_i compatible with the data. Freeze
        the estimator, weights, rounding, interval construction, and synthetic
        coverage controls for this harmonic procedure rather than inheriting
        marginal-Bernoulli calibration by name.

    - blocker: B7-unfrozen-curve-target-generation
      assertion: A-B7
      adjudication: REVISE
      passed_checks:
        - Six new literal domains plus the fifteen immutable predecessor domains give 21 distinct declared domains.
        - Prime, curve, subgroup, cofactor, anomalous, special-j, embedding-degree, no-score, exhaustion, commitment, and first-accepted-order rules are present.
        - The added fixed-XOF-word arithmetic 20480+327680+40960+1280+1280+259391488=259783168 is exact.
      blocking_evidence: >-
        Byte replay is still not implementation-independent. The curve domain
        at specification.yaml:411-429 does not define the coefficient_id
        enumeration or the exact mapping of its 16-byte words to a and b;
        deterministic_SEA_with_certificate has no algorithm/version,
        tie-breaking, or certificate encoding; the prime rule permits either
        Pratt or Pocklington without a deterministic choice; base-point
        decoding does not specify range rejection versus reduction or the
        square-root/sign convention; and exact scalar rejection from a 16-byte
        word is named but not encoded. The replay gate also requires sealed
        verifier seeds while the sealing format and replay-key provenance are
        absent. Two conforming implementations can therefore emit different
        curves, points, certificates, target scalars, or manifest bytes.
      required_repair: >-
        Freeze bit-level word-to-field/scalar maps, coefficient enumeration,
        primality and point-count certificate algorithms and schemas, square-
        root/sign conventions, serialization, sealing, and authorized replay-
        key handling. Add a cross-implementation byte-vector fixture for every
        generator and rejection branch.

    - blocker: B8-x-v-s-and-overflow-gap
      assertion: A-B8
      adjudication: REVISE
      passed_checks:
        - X is computed from the complete exact-match stream before capacity handling.
        - Every counted distinct candidate is required to reach the verifier once.
        - A detected thirty-third candidate invalidates rather than truncates, samples, or spills.
        - S is defined as 1[V>0] and an orientation-flipped candidate must give V=S=0.
      blocking_evidence: >-
        The required equality at specification.yaml:578-581 is only
        "X equals V for every valid prime-order exact-witness fixture." It is
        not a hard equality on every treatment and control root, despite the
        predecessor repair requiring every mathematically exact prime-order
        witness to survive. Moreover X is defined by distinct A values while
        candidate ordering includes witness digest and scalar; the contract
        does not freeze which candidate represents an A with multiple witness
        transcripts. An implementation can pass fixtures while losing or
        duplicating a treatment candidate below the 33-slot boundary.
      required_repair: >-
        Require X=V on every non-invalid treatment and control root, prove the
        exact-equality-to-public-verification implication, freeze deduplication
        identity and canonical representative selection, and archive a per-root
        reconciliation of complete X identities to verifier outcomes.

    - blocker: B9-nonidentical-null-path
      assertion: A-B9
      adjudication: REVISE
      passed_checks:
        - The null reuses public curves, targets, models, roots, lists, record widths, buffers, joins, equality, candidates, verifier, counters, digests, and archive code.
        - Treatment and null both stream selected pairs and charge the same declared 207871016960 logical bytes.
        - The predecessor balanced control is upgraded rather than deleted.
      blocking_evidence: >-
        The only permitted delta is the public label lane, but
        specification.yaml:614-617 names an "XOF-keyed even permutation and
        its paired sign complement" without defining the permutation domain,
        derivation, pairing, residue map, or left/right complement relation.
        Exact sign balance alone is not the statistical antisymmetric null and
        is not sufficient for byte replay. The contract also asserts component
        identity without freezing a machine-checkable differential manifest
        proving that every code/configuration hash except the label object is
        equal.
      required_repair: >-
        Give a literal null-label algorithm and test vectors, state its exact
        antisymmetry and selection-null property, and require a differential
        execution manifest whose sole allowed treatment/null delta is the
        committed label-lane object and its necessarily charged generator work.

    - blocker: B10-incomplete-end-to-end-costs
      assertion: A-B10
      adjudication: REVISE
      passed_checks:
        - The predecessor 87 traffic rows and 676907725568 bytes recompute exactly.
        - The redesigned 784067343104 logical-byte total is below the unchanged 846134656960 hard cap by 62067313856 bytes.
        - The predecessor 1567771584 group additions, 194745216 transforms, and 389597632 field multiplications recompute exactly.
        - The redesigned 1984080832 group-addition formula and 28 mandatory physical-cost classes are explicit.
        - Pollard rho and BSGS are named as mandatory matched-convention classes.
      blocking_evidence: >-
        specification.yaml:665-732 is a prospective inventory, not an
        end-to-end cost function. It contains no per-size class rows, no
        definition of the per-root physical cost, no storage quantity or exact
        Wiener equation, no rule combining CPU, wall, hardware occupancy,
        energy, archive, and communication, and no direct total-cost comparison
        with rho. Aggregate class totals admit different per-size allocations
        with different slopes. The harmonic analysis introduces three point
        fits plus 3*8191 bootstrap refits, at least 24576 new harmonic fits,
        while the interval/bootstrap populations remain the inherited
        50528256/50522088 counts and no reuse proof or incremental charge is
        supplied. The rho and BSGS rows likewise name no frozen algorithm,
        seeds, stopping rule, or standardized per-size output.
      required_repair: >-
        Freeze per-size cost rows and define C_root(N), storage(N), wiring(N),
        T_full(N)=H(N)*C_root(N)*wiring(N), and the exact finite-ladder rho
        comparison under one unit. Charge the added harmonic computation or
        prove literal reuse, freeze matched baseline implementations, and make
        the positive branch depend on a confidence bound for total fully
        charged cost rather than on gamma_fixed plus a prose cost gate.

    - blocker: B11-finite-ladder-ceiling
      assertion: A-B11
      adjudication: PASS
      evidence: >-
        The objective, scope, hard invalidations, method ceiling, success
        criterion, and interpretation all restrict every possible output to the
        exact 18--30-bit toy public manifest. They explicitly prohibit an
        asymptotic gamma_s, cryptographic-scale transfer, solver, attack,
        security impact, or breakthrough. A future positive branch is only a
        toy finite-ladder coefficient requesting independent review.

    - blocker: B12-verifier-secret-noninterference
      assertion: A-B12
      adjudication: REVISE
      passed_checks:
        - A separate verifier process and explicit forbidden selector inputs are required.
        - Candidate bytes/hash, D, Y, X, pair hashes, selector stdout, and selector counters must be invariant under decoy substitution.
        - Static read-edge and sandbox-attempt checks are prospective hard gates.
      blocking_evidence: >-
        specification.yaml:571-574 says a candidate verifies only by the public
        equation [k_hat]P=Q. Under that rule V and S cannot depend on replacing
        an unrelated hidden true scalar with a decoy. Yet lines 653-658
        explicitly permit V, S, and verifier outcomes to depend on the verifier
        input. This either leaves an unnecessary secret oracle in the primary
        success variable or contradicts the public verification rule. The
        current decoy control therefore proves only pre-verifier selector
        independence, not end-to-end secret noninterference.
      required_repair: >-
        Define V solely from public P,Q and candidate bytes. Run the verifier
        with the true secret mounted, a decoy mounted, and no secret mounted;
        require V, S, point-equality transcripts, stdout, and public resource
        counters to remain byte-identical. Any secret-dependent ground-truth
        annotation must be a separate post-verification diagnostic excluded
        from the scientific metric and cost/stopping path.

