  objections:
    - id: RT-HARMONIC-UPPER-BOUND-SLOPE-NONIDENTIFIABILITY
      severity: blocking
      category: fixed_target_inference
      finding: >-
        Simultaneous pointwise upper bounds on H_N do not identify or
        one-sidedly bound the fitted slope of the true H_N vector. The plug-in
        gamma_fixed LCB is therefore not a valid consequence of the stated
        199/200 event.
    - id: RT-FULL-COST-ASSEMBLY-ABSENT
      severity: blocking
      category: end_to_end_cost
      finding: >-
        Physical classes and counters are enumerated but never assembled by
        size into the total fixed-target hardware-time quantity whose slope is
        compared with rho. The 5/18 threshold remains conditional algebra, not
        a frozen finite-cost test.
    - id: RT-THROUGHPUT-CLASS-MAP-INCOMPLETE
      severity: blocking
      category: budget_and_admission
      finding: >-
        The certificate formula needs n_c, q_c, and shards_c for every mandatory
        class, but the frozen rows neither cover nor map those classes one-to-one.
    - id: RT-GENERATOR-BYTE-REPLAY-UNDERDEFINED
      severity: blocking
      category: reproducibility
      finding: >-
        Named deterministic algorithms and domains do not settle bit-to-object
        maps, certificate choice/encoding, or sealed-seed replay.
    - id: RT-X-V-ROOT-INVARIANT-INCOMPLETE
      severity: blocking
      category: losslessness
      finding: >-
        X=V is fixture-only rather than a hard invariant on every valid root,
        and candidate identity is not aligned with distinct-A identity.
    - id: RT-SAME-PATH-NULL-LABEL-UNDERDEFINED
      severity: blocking
      category: controls_before_belief
      finding: >-
        The null downstream path is substantially strengthened, but the sole
        allowed label delta is not defined precisely enough to reproduce or
        prove its null property.
    - id: RT-SECRET-DEPENDENT-PRIMARY-VERDICT
      severity: blocking
      category: verifier_noninterference
      finding: >-
        Permitting V/S to depend on hidden scalar substitution contradicts
        public candidate verification and leaves secret dependence in the
        primary scientific outcome.

  required_controls:
    - id: CTRL-HARMONIC-CONFIDENCE-SET-SLOPE
      cost: symbolic_only_zero_curve_operations_zero_experiment_runs
      purpose: >-
        Hold one five-size vector of L_i and hence H_N_upper fixed. Exhibit two
        true per-input probability vectors inside the same confidence set
        p_i in [L_i,1] whose harmonic vectors have fitted coefficients on
        opposite sides of 5/18. The current plug-in procedure collides; a valid
        worst-case confidence-set procedure must reject unless every admissible
        vector clears the branch.
    - id: CTRL-TOTAL-COST-SLOPE-COLLISION
      cost: symbolic_only_zero_curve_operations_zero_experiment_runs
      purpose: >-
        Hold all aggregate class totals, caps, residuals, and H_N_upper fixed
        while reallocating allowed physical work among sizes so one total-cost
        vector beats sqrt(N) and the other does not. The positive gate must
        distinguish them through explicit per-size total-cost rows.
    - id: CTRL-SECRETLESS-PUBLIC-VERIFIER
      cost: one_fixed_candidate_stream_no_selector_or_curve_generation
      purpose: >-
        Use fixed public P,Q with one correct and one incorrect k_hat. Run with
        true secret, decoy secret, and no secret. Require identical V, S, public
        point-equality transcripts, and public counters in all three cases.
    - id: CTRL-GENERATOR-CROSS-IMPLEMENTATION-BYTES
      cost: fixed_small_vectors_no_treatment
      purpose: >-
        Give each generator identical frozen words in two independent
        implementations and require identical rejection decisions, objects,
        certificates, serialization, commitments, and replay bytes.
    - id: CTRL-ALL-ROOT-X-V-RECONCILIATION
      cost: existing_candidate_streams_only
      purpose: >-
        For every valid treatment and null root, join complete distinct-A
        identities to candidate and public-verifier identities and require a
        one-to-one map with X=V and S=1[V>0].
    - id: CTRL-NULL-SINGLE-DELTA-MANIFEST
      cost: one_existing_treatment_root_and_null_replay
      purpose: >-
        Compare executable/configuration hashes, inputs, buffers, functions,
        and counters field by field and allow only the committed label-lane
        object and its separately charged generation to differ.

  counterexample_or_mutation:
    cheapest_falsification: CTRL-HARMONIC-CONFIDENCE-SET-SLOPE
    cost: symbolic_only_zero_experiment_runs
    construction: >-
      Treat the 160 simultaneous intervals p_i in [L_i,1] as the confidence
      set actually justified by the design. Keep all L_i fixed. At selected
      smaller sizes choose true p_i far above L_i while keeping larger-size
      p_i near L_i; reverse the slack allocation for a second admissible
      vector. Both vectors satisfy every simultaneous lower bound and have the
      same H_N_upper observable, but their true harmonic slopes can straddle
      the 5/18 coefficient boundary because pointwise upper-bound slack has no
      frozen cross-size order.
    conclusion: >-
      The current observable and plug-in fit cannot support the claimed lower
      confidence bound for fixed-target gamma_fixed even with perfect
      implementation and every control/cost residual equal to zero.

  heuristic_challenges:
    - id: HA-4-independent-restarts
      result: incomplete_operational_binding
      detail: >-
        The model-average p_i yields geometric cost 1/p_i only if each attempt
        independently samples one public model uniformly. Running all four
        views gives success probability Pr[any S_m=1], while holding one model
        fixed gives model-specific 1/p_im. The experiment must freeze one rule.
    - id: HA-5-family-and-model-scaling
      result: toy_manifest_only_and_generator_underdefined
      detail: >-
        The design correctly forbids unseen-generator transfer, but then the
        whole-curve bootstrap has no declared superpopulation target. The
        generator is also not byte-exact enough to define a reproducible
        manifest across implementations.
    - id: HA-6-wiring-access-charge
      result: algebraically_consistent_but_not_instantiated
      detail: >-
        The N^(1/9) multiplier gives the 5/18 symbolic crossover, but no frozen
        storage/access equation or per-size physical total instantiates it.
    - id: HA-7-finite-size-family-model
      result: ceiling_honest_but_inference_uncalibrated
      detail: >-
        Eta sensitivity is honestly finite-ladder only. The new harmonic
        estimator has no dedicated planted-gamma or coverage calibration and
        cannot inherit marginal composite-likelihood coverage automatically.

  cost_model_challenges:
    - Exact stage cap arithmetic passes, but the throughput inequality lacks a one-to-one mandatory-class prefix map and frozen shard counts.
    - H_N_upper is a restart-factor bound, not a total charged cost; per-root and wiring factors are not multiplied into the fitted response.
