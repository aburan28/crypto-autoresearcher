  baseline_comparison:
    pollard_rho: N^(1/2+o(1)) with negligible live-storage exponent
    standard_bsgs_full_cost: N^(2/3+o(1)) under the cited three-dimensional wiring model
    candidate_raw_conditional: N^(2/3-gamma+o(1))
    candidate_live_storage_conditional: N^(1/3+o(1))
    candidate_wiring_multiplier_conditional: N^(1/9+o(1))
    candidate_full_conditional: N^(7/9-gamma+o(1))
    symbolic_crossovers:
      raw_vs_pollard_rho: '2/3-gamma<1/2 iff gamma>1/6: PASS'
      full_vs_standard_bsgs: '7/9-gamma<2/3 iff gamma>1/9: PASS'
      full_vs_pollard_rho: '7/9-gamma<1/2 iff gamma>5/18: PASS'
    adjudication: >-
      The algebra is correct only when gamma is the exponent of the fixed-target
      restart factor and the charged per-root work/storage exponents really are
      1/3 and 1/9. EXP-SYC-84baf2 defines neither a statistically valid lower
      confidence bound for the true harmonic slope nor a per-size total-cost
      fit that verifies those physical premises. Pollard rho therefore remains
      the governing single-target baseline and no Pareto improvement exists.

  B1_B12_adjudication:
    - blocker: B1-budget-incompatibility
      assertion: A-B1
      adjudication: REVISE
      passed_checks:
        - The seven stage rows sum exactly to 450000 planned and 562500 hard wall seconds.
        - The seven stage rows sum exactly to 988 planned and 1235 hard CPU hours.
        - All eighteen listed S3 prefix-plus-remaining populations equal their complete populations and every prefix is nonzero.
        - No budget increase is declared and execution remains disabled.
      blocking_evidence: >-
        The admission inequality at specification.yaml:380-389 quantifies over
        every physical_cost_manifest class c and requires frozen n_c, q_c, and
        shards_c. The specification contains 28 mandatory physical classes at
        lines 674-702 but only 18 differently named S3 coverage rows at lines
        349-369; only two identifiers intersect literally, no explicit semantic
        mapping is supplied, and no per-class shards_c values are frozen. Thus
        the prospective certificate cannot evaluate its own stated inequality
        for all dominant classes. Exact cap addition is not yet proof that the
        complete preserved and added work fits those caps.
      required_repair: >-
        Freeze one row for every mandatory physical class with exact complete
        population n_c, prefix q_c, remaining population, stage owner, probe
        owner, and shard count; map each row one-to-one to the cost class; then
        require the CPU and wall inequalities and exact prefix reuse on that
        single table.

    - blocker: B2-prior-review-commit-misbinding
      assertion: A-B2
      adjudication: PASS
      evidence: >-
        The proposal snapshot 225ce3b63a4233b81b08657fe0ca5144a7839242
        does not contain the later review path. Commit
        9bc747e770323dac560ff7932977669a1221e9b7 has parent 3cabfc07a and contains
