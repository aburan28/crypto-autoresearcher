  blocker_repairs:
    - id: B1-budget-incompatibility
      assertion: A-B1
      repair: >-
        Split authorized S3 into a separately charged future same-work
        throughput certificate and full-work substage, freeze exact cap sums,
        preserve all old populations, add omitted generator/cost work, and
        invalidate on any failed coverage or projection inequality.
      residual: 0
    - id: B2-prior-review-commit-misbinding
      assertion: A-B2
      repair: >-
        Record 225ce3b as the reviewed proposal snapshot and 9bc747e as the
        durable review archive commit, bound to the exact path and SHA-256.
      residual: 0
    - id: B3-stale-bucket-artifact-count
      assertion: A-B3
      repair: >-
        Freeze 259391488+5*64847872=583630848 decoded bucket integers and zero
        padding events; explicitly forbid stale 585105408.
      residual: 0
    - id: B4-control-order-conflict
      assertion: A-B4
      repair: >-
        Freeze one chronological S0--S5 order with selector controls in S1 and
        repeated coverage in S2; stage IDs are chronological.
      residual: 0
    - id: B5-nonexact-artifact-paths
      assertion: A-B5
      repair: >-
        Enumerate every implementation and run artifact under the literal
        RUN-SYC-84baf2-5ea829 root with no glob, placeholder, or prose alias.
      residual: 0
    - id: B6-marginal-fixed-target-inversion
      assertion: A-B6
      repair: >-
        Keep p_bar only as a diagnostic. Treat each root's four correlated
        model outcomes as one bounded observation, freeze 160 simultaneous
        one-sided Hoeffding lower bounds, H_N_upper=mean(1/L_i), infinity for
        any L_i=0, and an outer-concentration collision fixture.
      residual: 0
    - id: B7-unfrozen-curve-target-generation
      assertion: A-B7
      repair: >-
        Freeze public field, curve, base-point, target, and decoy generators;
        domains, distributions, rejection caps, selection order, certificates,
        special-curve exclusions, replay, and charged discovery work.
      residual: 0
    - id: B8-x-v-s-and-overflow-gap
      assertion: A-B8
      repair: >-
        Freeze complete-stream X, verify every distinct candidate, require
        X=V on exact prime-order fixtures and S=1[V>0], and invalidate on a
        detected thirty-third candidate or orientation mismatch.
      residual: 0
    - id: B9-nonidentical-null-path
      assertion: A-B9
      repair: >-
        Upgrade the balanced antisymmetric arm to a full treatment-shape
        streaming path changing only the public label. Treatment and null both
        retain endpoint, join, comparison, hash, candidate, verifier, metric,
        stream-digest, and archive charges without persisting selected pairs.
      residual: 0
    - id: B10-incomplete-end-to-end-costs
      assertion: A-B10
      repair: >-
        Freeze a mandatory cost class for discovery, certification, labels,
        SHAKE, serialization, hashes, sorts, joins, comparisons, witnesses,
        interval fitting, bootstrap, archives, physical topology, Wiener
        wiring, Pollard rho, and BSGS, with physical counters and zero residual.
      residual: 0
    - id: B11-finite-ladder-ceiling
      assertion: A-B11
      repair: >-
        Cap every possible output at a toy 18--30-bit finite-ladder
        coefficient; asymptotic and cryptographic-scale inference are false.
      residual: 0
    - id: B12-verifier-secret-noninterference
      assertion: A-B12
      repair: >-
        Isolate true and decoy scalars in a verifier-only process and require
        candidate bytes/hashes, D/Y/X, pair hashes, stdout, and selector
        counters to remain byte-identical across verifier substitution.
      residual: 0

