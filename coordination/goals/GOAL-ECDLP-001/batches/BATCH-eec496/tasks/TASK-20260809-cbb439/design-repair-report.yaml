    Authored one versioned implementation-independent successor for all twelve
    BATCH-e3a312 blockers. The successor keeps every predecessor control and
    passed finite population as a mandatory lower bound; separates proposal
    snapshot from prior-review archive provenance; corrects the bucket count,
    chronological order, and literal future paths; replaces reciprocal-of-
    marginal fixed-target inference with simultaneous per-input lower bounds
    and a finite-family harmonic-cost upper bound; freezes deterministic public
    curve/target generation, X-to-V-to-S losslessness, overflow invalidation,
    a same-code-path null, end-to-end physical cost classes, toy-only scope,
    and verifier-secret noninterference. It records no run or evidence.

