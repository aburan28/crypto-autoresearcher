batch:
  id: BATCH-284817
  goal_id: GOAL-ECDLP-001
  objective: >-
    Design a genuine oracle-vs-exhaustive-search yield comparison experiment.
    DEC-20260808-6a7ac4 rejected H-XOR-d1a480's claim that the x-oracle improves
    yield over exhaustive search, on the ground that the experiment tested
    oracle-vs-random-predictor rather than oracle-vs-exhaustive-search. The
    decision explicitly names two reasonable successor designs: (1) direct
    Arm A (exhaustive) vs Arm B (x-oracle MITM) comparison, or (2) an "Arm D:
    Random-from-F_p MITM" true-null control for the MITM mechanism itself.
    This batch dispatches a /propose-ideas task to design one or both experiments,
    with a charged cost model (field operations or wall-clock) before any
    "speedup" language, per the red-team's still-open MODERATE objection.
  status: running
  started_at: '2026-08-08T11:00:00Z'
  max_concurrent: 2
  write_scope:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-284817/**
    - ledger/proposals/IDEA-20260808-*.yaml
  read_scope:
    - ledger/decisions/DEC-20260808-6a7ac4.yaml
    - ledger/evidence/EV-ECDLP-65b004.yaml
    - ledger/hypotheses/H-XOR-d1a480.yaml
    - experiments/EXP-SEMAEV-f48dd1/**
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-e0ccb2/**
  completion_gates:
    - >-
      At least one proposal with a falsifiable experimental test and a charged
      cost model (field operations or wall-clock).
    - >-
      Explicit dominated_by / sota_delta vs Pollard rho and vs exhaustive search.
    - >-
      Mechanism avoids the exact equality Y_A = Y_B that rejected H-XOR-d1a480.
    - >-
      OR recommendation to close RQ-ECDLP-002 with named obstruction if no
      viable design exists.
  dependencies: []
  budget:
    wall_clock_seconds: 1800
    memory_gb: 4
    max_runs: 1
