checked_items:
  - item: exact_snapshot_and_receipt_binding
    result: PASS
    detail: >-
      The requested commit has the Arm-A snapshot commit as its direct parent.
      The snapshot commit changes exactly the eight receipt-declared paths, and
      every SHA-256 recorded by the receipt/queue binding recomputed exactly.
  - item: canonical_cross_references_and_initial_state_transition
    result: PASS_WITH_NOTE
    detail: >-
      RQ-ECDLP-165d4b, H-ECDLP-1853dc, and EXP-ECDLP-51921d cross-reference
      consistently. DEC-20260809-b61556 records proposal_only to active,
      proposal to specified, and experiment to review_required, while the
      experiment remains unfrozen, unauthorized, and evidence-ineligible.
  - item: prior_design_review_citation
    result: FAIL
    detail: >-
      DEC-20260809-b61556 says BATCH-bd36fe supplied an Arm-A design-admissibility
      review, but its cited TASK-20260809-f84bf3 report reviews a synthetic
      XOR-control package and expressly states that it created no experiment
      specification. It cannot substantiate that an Arm-A ECDLP specification
      had already passed independent design review.
  - item: ordinary_prime_field_curve_admission
    result: FAIL
    detail: >-
      The specification names an independent order certificate and check labels,
      but does not define a deterministic generator, seed-to-instance mapping,
      certificate schema/verifier, acceptance thresholds, or an executable
      field-of-definition, subgroup-eigenvalue, stabilizer, twist, cofactor,
      anomalous, and embedding-degree admission procedure.
  - item: controls_distinguish_mechanism
    result: FAIL
    detail: >-
      C-BASE, C-NEG, C-RAND, C-RELABEL, and C-POS are named but lack a fixed
      construction, pairing/matching rule, shared target-and-seed policy,
      expected outcome, comparison statistic, and acceptance threshold. In
      particular, the random relabelling is not defined, same-order random-curve
      matching is not made constructive, and the two excluded calibrations are
      not separated or assigned expected calibration behavior.
  - item: complete_charged_cost_accounting
    result: FAIL
    detail: >-
      The contract lists operations as secondary metrics but gives no frozen
      cost unit, weights, aggregation formula, or rule charging automorphism
      evaluation, canonicalization, cycle detection, retries, setup,
      precomputation, memory, serialization, and recovery verification into the
      primary normalized work comparison.
  - item: replication_held_out_slope_and_stopping_design
    result: FAIL
    detail: >-
      Eight seeds, twelve independent instances, a maximum of twelve runs, and
      at least baseline/negation/full-quotient modes do not define a feasible
      run unit or a reconciled budget. There is no precommitted train/held-out
      partition, instance/seed allocation, minimum size grid or fit estimator,
      uncertainty method, finite-size slope decision ceiling, effect threshold,
      or operational definition of a non-random quotient-cycle failure.
  - item: required_artifact_completeness
    result: FAIL
    detail: >-
      Required artifacts are category names rather than immutable schemas and
      bindings. The contract omits a declared instance/control manifest format,
      versioned cost-accounting receipt, exact environment/dependency capture,
      run-to-control linkage, raw-success/censoring convention, and a complete
      resource/stage/sharding estimate required for reproducible execution.
  - item: proof_search_map_and_pareto_honesty
    result: FAIL
    detail: >-
      The proof_search_map is populated and correctly limits the proposed claim
      to a toy/medium constant factor, but its baseline reproduction and
      observation-collision entries describe future experiments rather than
      completed pre-compute audits or frozen fixtures. The declared
      dominated_by value, "Pollard rho on the declared prime-field ECDLP scope",
      is not a supported Pareto domination while the hypothesis predicts a
      possible lower charged-time constant; the all-zero sota_delta supplies no
      concrete frontier comparison. It should instead state no result claimed
      or cite and quantify an actual dominating frontier method.
  - item: no_bedrock_and_native_runtime_boundary
    result: PASS_WITH_INFRASTRUCTURE_BLOCKER
    detail: >-
      The package explicitly prohibits Bedrock and records native Codex as a
      constrained exception. Read-only preflight found no usable configured API
      backend. That is an infrastructure/provenance limitation only, not
      mathematical negative evidence; it blocks an API-backed dispatch until
      remediated but does not cure or create the above design defects.
  - item: batch_task_projection_consistency
    result: WARN
    detail: >-
      batch.yaml still describes TASK-20260809-a24eb5 as queued, whereas the
      committed dispatch queue and its receipt mark it completed and bind the
      snapshot. The queue/receipt provide a recoverable authoritative binding,
      but a later Coordinator record must not rely on the stale batch summary
      as the task-state source.

findings:
  - id: REV-f27fa2-01
    severity: critical
    blocking: true
    title: Curve and automorphism admission checks are not executable.
    evidence_paths:
      - experiments/EXP-ECDLP-51921d/specification.yaml
      - ledger/hypotheses/H-ECDLP-1853dc.yaml
    rationale: >-
      Check names do not specify the exact predicates, witnesses, verifier,
      bounds, or rejection behavior needed to decide whether an ordinary
      prime-order F_p instance, its subgroup action, and its exceptional twists
      are admissible. This permits special-structure leakage or inconsistent
      primary-arm admission.
    required_repair: >-
      Freeze a certificate/instance schema defining E/F_p, order and primality
      witnesses, subgroup generator, cofactor bound, ordinary/non-anomalous
      test, twist test and bound, embedding-degree range, automorphism formula
      over F_p, exact subgroup eigenvalue lambda, orbit/stabilizer algorithm,
      and fail-closed verifier for every arm.
  - id: REV-f27fa2-02
    severity: critical
    blocking: true
    title: Control plane cannot yet distinguish an automorphism mechanism from artifacts.
    evidence_paths:
      - experiments/EXP-ECDLP-51921d/specification.yaml
      - docs/inventor-protocol.md
    rationale: >-
      The controls lack deterministic construction and an identical paired
      measurement rule. Therefore a gain could arise from curve selection,
      different walk/collision semantics, relabelling overhead, or excluded
      calibration behavior rather than the claimed quotient action.
    required_repair: >-
      Specify one manifest row per source curve, matched random control, seed,
      target scalar, and variant; define C-RELABEL as an auditable permutation
      and inverse/certificate procedure; separate anomalous from low-embedding
      calibration; pre-register each expected null/positive outcome, statistic,
      tolerance, and invalidation action.
  - id: REV-f27fa2-03
    severity: critical
    blocking: true
    title: Primary charged-work metric and budget are internally incomplete.
    evidence_paths:
      - experiments/EXP-ECDLP-51921d/specification.yaml
      - docs/task-lifecycle.md
      - templates/research-records.md
    rationale: >-
      No implementer can derive a comparable primary cost from the listed
      counters, and the stated replication dimensions cannot be reconciled with
      maximum_runs: 12 without an undisclosed definition of run or omitted
      control executions.
    required_repair: >-
      Provide a versioned cost model with units and weights; charge all setup,
      maps, canonicalization, collision/recovery, retries, memory, and
      serialization; define the run unit; enumerate the full run matrix; and
      reconcile its wall-clock, CPU, memory, and maximum-run totals.
  - id: REV-f27fa2-04
    severity: high
    blocking: true
    title: Replication, held-out, finite-size, and stopping logic are not preregistered enough to support the success criterion.
    evidence_paths:
      - experiments/EXP-ECDLP-51921d/specification.yaml
      - ledger/hypotheses/H-ECDLP-1853dc.yaml
    rationale: >-
      The contract does not identify selection versus held-out families, define
      the slope fit or its uncertainty, state an effect-size/aggregation rule,
      or define the cycle-failure event that stops a family. "Replicated" and
      "control-corrected" therefore have no deterministic acceptance meaning.
    required_repair: >-
      Register an instance-and-seed split before any execution, a fixed size
      ladder and regression/censoring method, finite-size ceiling language,
      effect and uncertainty thresholds, all stopping counters, and explicit
      valid/invalid/budget-exhausted dispositions.
  - id: REV-f27fa2-05
    severity: high
    blocking: true
    title: The decision cites an unrelated prior review as Arm-A support.
    evidence_paths:
      - ledger/decisions/DEC-20260809-b61556.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/reviews/TASK-20260809-f84bf3/freeze_review.yaml
    rationale: >-
      The cited review concerns a synthetic XOR-control package, not this Arm-A
      ECDLP specification, and explicitly says no experiment specification was
      created. The materialization decision must not carry that citation as
      evidence that Arm A already passed review.
    required_repair: >-
      Preserve the immutable decision, but issue a later Coordinator correction
      or superseding decision that describes the prior review accurately and
      treats this task's eventual archived review as the first review of this
      canonical Arm-A contract.
  - id: REV-f27fa2-06
    severity: medium
    blocking: true
    title: Proof-search and Pareto declarations are not yet honest enough for approval.
    evidence_paths:
      - ledger/hypotheses/H-ECDLP-1853dc.yaml
      - docs/inventor-protocol.md
      - templates/research-records.md
    rationale: >-
      The map describes planned audits rather than frozen completed audits, and
      the claimed Pareto domination conflicts with a hypothesis that predicts a
      lower constant factor. The quantitative delta does not give a comparable
      frontier cost.
    required_repair: >-
      Attach a frozen baseline reproduction fixture and observation-collision
      audit, record their outcomes, and replace the Pareto fields with either
      a cited quantified frontier comparison or the protocol's explicit
      no-result-claimed form.
  - id: REV-f27fa2-07
    severity: medium
    blocking: false
    title: Batch summary state is stale relative to the authoritative queue and receipt.
    evidence_paths:
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-ac2e6d/batch.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-ac2e6d/dispatch_queue.json
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-ac2e6d/archives/TASK-20260809-a24eb5/snapshot-receipt.json
    rationale: >-
      The receipt and queue establish the snapshot integrity, so this is not a
      hash/provenance failure. It remains a state-projection ambiguity that must
      be explicitly resolved in later Coordinator documentation.

