    Read-only Git, exact-blob, SHA-256, record, contract, and harness-preflight
    inspection only. The sole planned write is this required reviewer report in
    its declared write scope.

backend_boundary:
  preflight_status: blocked_no_usable_api_backend
  infrastructure_only: true
  mathematical_interpretation: none
  native_runtime_boundary_explicit: true
  execution_consequence: >-
    No API-backed dispatch may proceed until a permitted backend is configured
    and probe-verified. This does not authorize Bedrock, does not invalidate
    the design by itself, and does not constitute negative ECDLP evidence.

recommendation_to_coordinator: >-
  Do not freeze, approve, implement, or dispatch EXP-ECDLP-51921d. Create a
  new versioned specification/materialization package that resolves
  REV-f27fa2-01 through REV-f27fa2-06, with fail-closed curve certificates,
  deterministic paired controls, a complete charged-cost/run matrix, and
  preregistered statistical/stopping/artifact rules. Archive that package,
  obtain a fresh independent review, and use a superseding Coordinator decision
  that accurately characterizes the unrelated BATCH-bd36fe synthetic review.
  Treat the missing API backend solely as an infrastructure prerequisite for
  later execution, never as evidence about the hypothesis.
