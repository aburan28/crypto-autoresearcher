recommendation: >-
  Do not freeze, approve, implement, or dispatch EXP-ECDLP-a76937. The
  snapshot correctly preserves the predecessor and corrects the unrelated
  BATCH-bd36fe citation, but REV-f27fa2-01 through REV-f27fa2-04 and
  REV-f27fa2-06 are not fully closed by the successor. Create a new versioned
  repair package that makes automorphism/stabilizer admission executable,
  fixes source/random pairing and calibration manifests, supplies an exclusive
  complete cost-vector schema, registers an attainable held-out criterion, and
  completes the distinct-collision fixture. Preserve the current package and
  this NO-GO report; obtain a fresh independent review after a snapshot of the
  corrected successor. The absent configured API backend remains an
  infrastructure prerequisite only and never permits Bedrock.
