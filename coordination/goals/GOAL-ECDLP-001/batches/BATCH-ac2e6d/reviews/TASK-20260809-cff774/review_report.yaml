checked_items:
  - item: snapshot_integrity_and_exact_committed_bytes
    result: PASS
    detail: >-
      The requested commit is the direct child of repair snapshot
      b8c569a694a6a79f1cfb6c3521859fa3eac59926. That snapshot has the declared
      parent 583adfb3d2a910c72f94bc0fd52ce2c5da958c1a, changes exactly its ten
      producer paths plus its receipt, and all ten receipt SHA-256 values
      recompute exactly. The requested child changes only dispatch_queue.json.
  - item: predecessor_immutability_and_provenance_correction
    result: PASS
    detail: >-
      H-ECDLP-1853dc, EXP-ECDLP-51921d, and the TASK-20260809-f27fa2 NO-GO
      report have identical SHA-256 bytes at the repair snapshot parent and at
      the requested commit. DEC-20260809-54f91c accurately retains
      BATCH-bd36fe/TASK-20260809-f84bf3 as an unrelated synthetic XOR-control
      review, names TASK-20260809-f27fa2 as the first canonical Arm-A review,
      and does not portray it as positive Arm-A evidence.
  - item: fail_closed_curve_order_twist_cofactor_and_automorphism_admission
    result: REVISE
    detail: >-
      The successor materially improves REV-f27fa2-01: it fixes deterministic
      source generation, rejection logging, prime/order/cofactor/twist,
      non-anomalous, embedding, F_p-map, eigenvalue, and rejection clauses.
      However the required manifest does not carry a declared automorphism
      order although acceptance requires it, and the stabilizer rule rejects an
      "unexpected" value without defining the allowed stabilizer set or a
      verifier predicate tying it to effective_orbit_size. These omissions make
      the last admission predicate not fail-closed as written.
  - item: paired_primary_controls_random_matching_relabel_and_calibrations
    result: FAIL
    detail: >-
      The six primary variants, same-order random-match rule, and auditable
      C-RELABEL byte permutation are improvements, but the target formula uses
      SHA-256(seed || instance_id || target). Source and matched-random rows
      necessarily have distinct instance_id values, so it does not establish
      the declared identical target_scalar per source/control pair. In addition,
      CAL-A01..CAL-A04 and CAL-K01..CAL-K04 have labels only: no deterministic
      seeds, construction rule, manifests, target/stopping allocation, or
      required calibration receipt schema is registered. The eight calibration
      rows therefore cannot be generated or audited from the frozen records.
  - item: run_matrix_budget_and_paired_invariants
    result: REVISE
    detail: >-
      Arithmetic is internally correct at the headline level: 12 groups times
      six primary variants is 72 and eight calibration variants gives 80; 80
      times 180 seconds is 14,400 seconds or four CPU hours; the seed register
      allocates eight train and four held-out primary groups over 12--15 bits.
      The missing executable calibration allocation and the target-pair mismatch
      prevent the full declared 80-row matrix from satisfying its own pairing
      invariants. The shared stopping-rule and cost-model identifiers are
      declared, but do not cure those defects.
  - item: charged_work_formula_raw_vector_and_double_counting
    result: FAIL
    detail: >-
      COST-ECDLP-a76937-v1 names many intended charges and requires raw
      recomputation, but it neither specifies a schema nor exclusive semantics
      for cost-vector.json. PADD/PDBL can overlap the simultaneously counted
      FADD/FML/FSQR/FINV work, while AUT/CANON/RECOVER/PRECOMPUTE are not defined
      as exclusive counters or expanded into charged primitive operations. The
      formula also has no counters or charge mapping for the SHA-256 partition,
      scalar/coefficient arithmetic, logging/receipt production other than byte
      length, and the stated instance-generation/certificate-replay scope.
      An implementation could set opaque counters to zero or charge the same
      operation twice while still satisfying the present arithmetic formula.
  - item: held_out_statistics_censoring_slope_and_stopping
    result: FAIL
    detail: >-
      With four held-out paired nonzero signs, an exact two-sided 2^4 sign
      permutation test has smallest attainable p-value 2/16 = 0.125. The
      stated p <= 0.05 success threshold is consequently impossible, even when
      all four FULL/NEG ratios favor FULL. The rule also says both "at least 3
      of 4 held-out groups valid" and that a single group failure invalidates
      the family; the later all-primary-rows-valid success condition reinforces
      the contradiction. Censoring is not positive evidence and the finite-size
      slope ceiling are correctly bounded, but cannot make the success criterion
      evaluable.
  - item: proof_audit_fixture_semantics_and_artifact_boundaries
    result: FAIL
    detail: >-
      The fixtures are correctly marked frozen, pre-compute, and not empirical
      evidence, and the baseline coefficients are sufficiently concrete. The
      observation-collision fixture, however, supplies only an identical pair
      (12,7)/(12,7) and its negated quotient-equivalent pair (89,94). It does
      not supply a distinct coefficient pair representing the same point and
      a stated expected recovered scalar, despite requiring a distinct valid
      collision to recover and verify x. Thus the recovery half of the claimed
      audit cannot be executed from the fixture bytes. Required run artifacts
      name cost-vector.json but do not define its schema, so raw-vector
      recomputation is likewise not fully auditable.
  - item: claim_ceiling_pareto_and_planned_result_boundary
    result: PASS
    detail: >-
      H-ECDLP-80fceb and DEC-20260809-54f91c state dominated_by null only in
      the explicit no_result_claimed form, give a no-result SOTA delta, retain
      a toy finite constant-factor ceiling, and expressly deny an exponent or
      cryptographic-scale claim. No implementation or run directory exists in
      the successor package.
  - item: backend_and_bedrock_boundary
    result: PASS_WITH_INFRASTRUCTURE_NOTE
    detail: >-
      Read-only preflight reports no usable configured API backend; the queue,
      repair report, and design record this only as infrastructure. They state
      the native Codex exception requires exact-session provenance and prohibit
      Bedrock. No Bedrock backend or request was used in this review. This
      condition does not support or weaken the ECDLP hypothesis and must not be
      repaired by selecting Bedrock.
findings:
  - id: REV-cff774-01
    predecessor_finding: REV-f27fa2-01
    severity: high
    blocking: true
    title: Automorphism order and stabilizer acceptance remain underdefined.
    evidence_paths:
      - experiments/EXP-ECDLP-a76937/specification.yaml
      - experiments/EXP-ECDLP-a76937/protocol/instance_manifest.schema.yaml
    rationale: >-
      The protocol says an automorphism's declared order is verified but omits
      that order from the required manifest. It also says unexpected stabilizers
      reject without defining which stabilizers are expected or the equality
      that connects the observed stabilizer to the recorded effective orbit
      size. An executor and validator can therefore disagree while both follow
      the text.
    minimum_repair: >-
      Add automorphism_order, generated subgroup/orbit list, allowed stabilizer
      set, and an exact per-state predicate such as
      orbit_size = declared_group_order / stabilizer_size; require a replayable
      witness and reject every value outside the explicit set.
  - id: REV-cff774-02
    predecessor_finding: REV-f27fa2-02
    severity: critical
    blocking: true
    title: Source/random target pairing and calibration rows are not executable.
    evidence_paths:
      - experiments/EXP-ECDLP-a76937/specification.yaml
      - experiments/EXP-ECDLP-a76937/protocol/seed_register.yaml
      - experiments/EXP-ECDLP-a76937/protocol/cost_model.yaml
    rationale: >-
      The target derivation includes a per-instance identifier even though the
      same-order source and random control must share target scalar x. The
      separate calibration rows have no seed-to-instance generation, no frozen
      manifests, and no registered run semantics. This leaves the matching and
      eight-row calibration claims untestable.
    minimum_repair: >-
      Derive one x from a canonical group-pair identifier (not either individual
      instance_id), declare the identical walk seed and cost/stopping fields for
      every primary pair, and add eight deterministic calibration entries with
      seeds, construction predicates, manifests, expected detector result, and
      invalid/exclusion disposition.
  - id: REV-cff774-03
    predecessor_finding: REV-f27fa2-03
    severity: critical
    blocking: true
    title: Charged-work vector does not prove complete, non-overlapping accounting.
    evidence_paths:
      - experiments/EXP-ECDLP-a76937/specification.yaml
      - experiments/EXP-ECDLP-a76937/protocol/cost_model.yaml
    rationale: >-
      A weighted expression and a promise to recompute are insufficient without
      counter definitions, coverage of every declared operation, and a rule
      excluding overlap between field-level, point-level, and opaque aggregate
      counters. The primary comparison could therefore be changed by accounting
      choices rather than the quotient mechanism.
    minimum_repair: >-
      Freeze a cost-vector schema with integer domains, one exclusive source for
      each operation, explicit setup/hash/scalar/map/canonicalization/cycle/
      recovery/serialization/precomputation charges, and validator equations
      showing both coverage and pairwise non-overlap; choose either expanded
      field-operation accounting or explicitly non-overlapping point-operation
      accounting, not both for the same work.
  - id: REV-cff774-04
    predecessor_finding: REV-f27fa2-04
    severity: critical
    blocking: true
    title: Four-pair exact test cannot meet the registered p-value threshold.
    evidence_paths:
      - experiments/EXP-ECDLP-a76937/specification.yaml
      - experiments/EXP-ECDLP-a76937/protocol/seed_register.yaml
    rationale: >-
      The stated two-sided sign-permutation test enumerates 16 sign assignments.
      Its most extreme possible result has two assignments at least as extreme,
      hence p = 2/16 = 0.125, not <= 0.05. The valid-group clauses also conflict.
      This is a mathematical property of the declared test, not an execution
      observation.
    minimum_repair: >-
      Either enlarge the held-out paired sample and recompute the fixed matrix,
      budget, and exact test threshold, or preregister a justified one-sided
      test with an attainable threshold; then state one non-conflicting valid/
      censored/invalid group rule and use it consistently in the success clause.
  - id: REV-cff774-05
    predecessor_finding: REV-f27fa2-06
    severity: high
    blocking: true
    title: Observation-collision fixture lacks its required distinct recovery case.
    evidence_paths:
      - experiments/EXP-ECDLP-a76937/protocol/proof_audits.yaml
      - ledger/hypotheses/H-ECDLP-80fceb.yaml
    rationale: >-
      The fixture's two supplied coefficient pairs are identical or quotient
      equivalent. No distinct valid collision and expected x are present, so
      the specified recovery-and-verification behavior has no concrete input.
      The frozen fixture therefore does not close the observation-collision
      audit promised by the proof_search_map.
    minimum_repair: >-
      Add a fully specified distinct pair (a1,b1),(a2,b2) for the same fixture
      point with b2-b1 nonzero, the expected recovered x, point/certificate
      encodings, and exact pass/fail assertions; retain the identical and orbit
      duplicate cases as separate negative controls.
