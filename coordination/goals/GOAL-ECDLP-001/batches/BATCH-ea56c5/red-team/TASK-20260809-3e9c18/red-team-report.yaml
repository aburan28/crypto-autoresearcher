  eight_blocker_adjudication:
    - id: repair-1-canonical-decoder-and-null-KAT
      adjudication: PASS_STATIC
      passed_checks:
        - p=262147 is prime, has bit length nineteen, and is three modulo four.
        - The curve discriminant witness is 59 modulo p and is nonzero.
        - R=03000000, minus-R=02000000, duplicate-R, and infinity have the declared widths, equations, parities, and exact round trips.
        - The SHAKE256 output, absorb SHA-256, replay bytes, and replay SHA-256 recompute exactly.
        - Root index, list position, and treatment outcome are absent from the null key; duplicate and negation fibers are explicit.
      residual: null
      claim_limit: >-
        This passes one admitted decoder and null known-answer vector only. It
        proves neither the future curve generator nor treatment correctness.

    - id: repair-2-production-custody-and-receipt-semantics
      adjudication: REVISE
      passed_checks:
        - The seed commitment, manifest digest, authenticated header, external key identifier, nonce, ciphertext, tag, and envelope bytes are explicit.
        - The envelope places commitment, seed class, and external key ID in authenticated associated data.
        - The intended custody, replay, ledger, retention, and destruction order is explicit.
      blocking_evidence: >-
        receipt_common_schema requires a fixed top-level key set and rejects
        unknown fields, but it contains neither payload nor any lifecycle
        payload field. The lifecycle rows require fields such as
        custodian_A_identifier, producer_snapshot_commit, AAD_sha256,
        ledger_commit, and destroy_operation_receipt_digest. Adding any of
        those top-level keys violates unknown_fields=reject; omitting them
        violates the lifecycle. No nested payload object is defined or allowed.
        In addition, custody_open has prerequisites=[] while every common
        receipt must contain prerequisite_receipt_sha256, with no null, empty,
        or zero sentinel frozen. The replay KAT adds aad_sha256 and test_only,
        omits seven common required fields, and is expressly not a signed
        production receipt. It therefore cannot disambiguate the schema.
      required_repair: >-
        Freeze one canonical payload object schema, its exact hash rule, the
        no-prerequisite encoding, every lifecycle field type and width, and one
        fully conforming signed KAT for each lifecycle type. Reject unknown
        payload keys separately from common top-level keys.

    - id: repair-3-deterministic-sharding-and-full-census
      adjudication: REVISE
      passed_checks:
        - The six consumer ranges, zero-based concatenated event index, round-robin shard function, and residual-block function are deterministic.
        - All twenty-eight n vectors and q vectors have positive components with q no larger than n.
        - The six consumer columns conserve each class and size exactly.
      blocking_evidence: >-
        Reinterpreting q as a block width creates 5,660,902 mandatory block
        receipts: 3,769,625 from physical_memory_topology, 880,804 from
        SHAKE_fixed_blocks, 237,485 from wiring, 179,343 from serialization,
        and 593,645 from the remaining classes. The contract gives a field-name
        list but no canonical encoding, integer widths, digest algorithms,
        paths, byte total, archive allocation, communication allocation, or
        output-cap allocation for these receipts. Missing receipts invalidate,
        so they cannot be treated as optional telemetry. Separately, the
        3,145,728 capacity slots per size equal
        32 curves times 4 models times 3 eta values times 256 roots times 32
        candidates, yet the slot schema omits model_id and eta and freezes no
        slot-index-to-semantic-tuple bijection. A full ordered file may therefore
        duplicate one model/eta cell and omit another while satisfying the
        current syntax and mount-state coverage counts.
      required_repair: >-
        Freeze canonical receipt bytes and paths, charge all 5,660,902 receipts
        and their counter/reset production, and bind a total slot-index
        bijection to bits, curve, model, eta, root, and candidate before hashing.

    - id: repair-4-exact-class-to-consumer-and-fixed-target-assembly
      adjudication: REVISE
      passed_checks:
        - Every population row conserves across setup, treatment, control, candidate, rho, and BSGS.
        - Mixed treatment/control and SHAKE/rho rows have exact integer splits.
        - Additive, wall, and peak axes remain separate and aggregate CPU is never divided by shards.
      blocking_evidence: >-
        The candidate equation multiplies a size-level harmonic restart bound
        H_b by the size-aggregated treatment-plus-verifier cost divided by 256.
        For a single fixed target, expected work is targetwise inverse success
        times targetwise root cost, and the family average is E_i[C_i/p_i], not
        E_i[C_i] times E_i[1/p_i]. The class table has no input or model axis and
        therefore cannot preserve this pairing. Two inputs with inverse-success
        factors (1,2) and per-root costs (1,2) or (2,1) have the same H sum and
        cost sum, so the current compiler emits 2.25 for both; the correct mean
        expected costs are respectively 2.5 and 2.0. This is an exact
        observation collision in the advertised fixed-target E[1/p] cost path.
      required_repair: >-
        Compile every directed axis per fixed input and public model, multiply
        each cost interval by that same input/model's inverse-success interval,
        then aggregate with the frozen family weights. Preserve covariance and
        infinity cases; do not multiply separately aggregated summaries.

    - id: repair-5-three-mount-verification-and-end-to-end-resources
      adjudication: REVISE
      passed_checks:
        - Candidate verifications are 3*15,728,640=47,185,920 and six KATs run once.
        - Total verifications are 47,185,926, six-addition verification work is 283,115,556, and table construction is 28,800 additions.
        - The two added packed V/S pairs and their stated logical candidate/table/accumulator bytes reconcile arithmetically.
      blocking_evidence: >-
        The resource crosswalk charges two added verifier event streams and a
        524,288-byte metadata reserve, but it does not allocate the 5,660,902
        full-census receipts introduced by the same successor. Nor does a class
        row or byte formula charge the physical noninterference protocol's 480
        fresh sandboxes, fixed cooldowns, cache resets, counter snapshots,
        reset receipts, temperatures, frequency-state records, or lag plots.
        These operations are mandatory and archived, not implementation-free
        annotations. Consequently the group/event identities may pass while
        archive, communication, CPU, wall, energy, read, write, and output caps
        remain unidentified.
      required_repair: >-
        Add exact classes, event populations, canonical bytes, stage ownership,
        and every nine-axis composition for sandbox/reset/counter/receipt work;
        then recompute all hard-cap residuals without dropping full census.

    - id: repair-6-byte-exact-rho-BSGS-and-complete-frontier
      adjudication: REVISE
      passed_checks:
        - Rho and BSGS state, distinguished, baby, and giant record width sums are internally consistent.
        - Scalar orientation in the rho collision formula is correct for X=alpha*P+beta*Q.
        - Full-table BSGS baby and giant iteration, verification, and tie order are substantially frozen.
      blocking_evidence: >-
        Rho assigns walk_id modulo five and gives each shard 1,024 local steps
        per epoch, but never maps those local step positions among the twelve or
        thirteen walks resident on that shard. Different round-robin, draining,
        or priority schedules produce different X states, distinguished points,
        first collisions, restart histories, and stopping costs while preserving
        every frozen field. Moreover baseline_rows=[rho,bsgs] contains one fixed
        rho configuration and only m=ceil(sqrt(r)) full-table BSGS. Standard
        bounded-table BSGS with baby width w<m and ceil(r/w) giant steps, as well
        as rho distinguished-memory/parallel configurations, trade additional
        CPU and wall for lower peak, archive, communication, or wiring. Such rows
        cannot be removed before their directed intervals are measured. The
        stated ninety comparison slots are exactly 5 sizes times 2 rows times 9
        axes; they prove the parameterized frontier was never enumerated.
      required_repair: >-
        Freeze the per-shard walk-step scheduler and enumerate a preregistered
        finite parameter grid including the memory-matched/segmented BSGS
        boundary and relevant rho time-memory points. Generate byte-exact rows
        for every configuration and compute the nondominated set only afterward.

    - id: repair-7-prospective-executable-dependency-syscall-and-coverage-schema
      adjudication: REVISE
      passed_checks:
        - Future implementation and evidence values remain null rather than fabricated.
        - Interpreter, libraries, builtins, frozen modules, stdlib, repository modules, imports, environment, descriptors, mounts, syscalls, slots, and coverage all have prospective field lists.
        - Synthetic pre-run branch KATs are separated from post-generation actual-stream replay.
      blocking_evidence: >-
        executable-universe.json includes manifest_sha256 among the exact JCS
        top-level fields but gives no rule saying which bytes that digest covers
        or that the field is omitted or null during hashing. The coverage record
        repeats the same defect with coverage_sha256. Hashing the complete JCS
        object is self-referential; omitting or neutralizing the field is an
        unrecorded implementation choice, recreating the lifecycle circularity.
        The syscall policy is also falsely identified with its declared
        semantics. Linux seccomp BPF cannot dereference the openat pathname
        pointer, so two calls with the same directory fd, flags, pointer address,
        and length but different pointed-to bytes lie in the same BPF observable
        fiber even when one path is allowed and one forbidden. It likewise
        cannot enforce that getrandom occurs only before candidate open or that
        returned bytes never influence branching. No Landlock, broker, or
        equivalent separator is frozen. The missing model/eta slot bijection
        additionally prevents the coverage schema from certifying semantic
        rather than merely cardinal coverage.
      required_repair: >-
        Give self-neutral digest rules and literal KATs for both manifests;
        replace unenforceable BPF promises with a frozen enforceable path and
        temporal-control mechanism or narrow the claim; and bind coverage to
        the total semantic slot bijection and source-record digests.

    - id: repair-8-statistically-valid-physical-noninterference
      adjudication: REVISE
      passed_checks:
        - Exact equality is no longer demanded for noisy physical counters.
        - The fifth-through-twenty-eighth order-statistic interval has the stated median noncoverage 82898/4294967296 under its assumptions.
        - Bonferroni over ninety median intervals is arithmetically below one percent.
      blocking_evidence: >-
        A confidence interval for the paired median is not a noninterference
        certificate for the physical distribution or all stream regions. Set
        twenty-eight paired log ratios to zero and four to log(2), meaning a
        100-percent mount effect on four of thirty-two blocks. The fifth and
        twenty-eighth order statistics are both zero, strictly inside the
        plus-or-minus log(1.05) margin, so every stated equivalence rule can
        PASS while 12.5 percent of the stream is grossly interfered with. The
        rule also treats thirty-two fixed contiguous, semantically heterogeneous
        blocks as independent draws from one common continuous law; randomizing
        processing order does not randomize candidate content into blocks or
        prove that exchangeability assumption. Lag plots and an undefined
        evidence-against-assumption clause are not a preregistered decision rule.
      required_repair: >-
        Add a preregistered distributional or upper-tail equivalence gate that
        rejects the four-block mutation, randomize semantic slots into blocks
        with a frozen one-shot permutation when compatible with the workload,
        and state an auditable exchangeability/reset criterion. Keep all raw
        axes and do not call median equivalence physical noninterference.

