  objections:
    - id: RT-CUSTODY-RECEIPT-LANGUAGE-HAS-NO-INSTANCE
      severity: blocking
      category: production_custody
      finding: >-
        Common unknown-field rejection and absent payload/no-prerequisite
        encodings make the lifecycle receipt schema uninstantiable.
    - id: RT-FULL-CENSUS-RECEIPTS-UNENCODED-AND-UNCHARGED
      severity: blocking
      category: sharding_and_resources
      finding: >-
        The successor mandates 5,660,902 block receipts but freezes neither
        their canonical bytes nor any end-to-end resource allocation.
    - id: RT-CANDIDATE-SLOT-SEMANTIC-BIJECTION-ABSENT
      severity: blocking
      category: coverage
      finding: >-
        Slot cardinality encodes model and eta factors that the record language
        omits, allowing semantic omissions under complete cardinal coverage.
    - id: RT-FIXED-TARGET-INVERSE-SUCCESS-COST-COLLISION
      severity: blocking
      category: cost_model
      finding: >-
        Separate aggregation of inverse success and root cost cannot identify
        E[C_i/p_i] and can understate or overstate fixed-target expected work.
    - id: RT-THREE-MOUNT-RESET-AND-COUNTER-WORK-UNCHARGED
      severity: blocking
      category: resource_accounting
      finding: >-
        Fresh sandboxes, cooldowns, cache resets, counter reads, environmental
        records, and their receipts are required but have no owned cost classes.
    - id: RT-RHO-WITHIN-SHARD-WALK-SCHEDULE-SELECTABLE
      severity: blocking
      category: finite_baseline
      finding: >-
        Walk-to-shard assignment does not specify which resident walk advances
        at each local step, so the byte stream and first-success order vary.
    - id: RT-RHO-BSGS-FRONTIER-OMITS-TRADEOFF-ROWS
      severity: blocking
      category: pareto_completeness
      finding: >-
        One rho and one full BSGS row are not the complete nondominated finite
        time-memory frontier required by the contract.
    - id: RT-EXECUTABLE-AND-COVERAGE-SELF-HASH-CIRCULARITY
      severity: blocking
      category: executable_universe
      finding: >-
        manifest_sha256 and coverage_sha256 have no self-neutral hash rule.
    - id: RT-SECCOMP-PATH-AND-TEMPORAL-POLICY-NONSEPARATING
      severity: blocking
      category: sandbox_enforcement
      finding: >-
        The frozen BPF observable cannot distinguish pathname contents or
        enforce the proposed startup-only and no-dataflow getrandom rule.
    - id: RT-MEDIAN-EQUIVALENCE-IS-NOT-NONINTERFERENCE
      severity: blocking
      category: statistical_noninterference
      finding: >-
        Four doubled blocks and twenty-eight unchanged blocks pass the exact
        median interval and margin while retaining material interference.

  required_controls:
    - id: CTRL-CUSTODY-RECEIPT-INSTANTIATION
      cost: one_static_JCS_object_per_lifecycle_type_zero_experiment_runs
      purpose: >-
        Construct every receipt from the common and lifecycle schemas, reject
        every unknown key, verify prerequisite chaining and payload hashes, and
        replay at least one complete signature. The current custody_open object
        has no conforming construction.
    - id: CTRL-FIXED-TARGET-COST-JOIN-COLLISION
      cost: two_inputs_two_exact_costs_two_exact_inverse_probabilities_zero_runs
      purpose: >-
        Hold the H multiset and cost multiset fixed and swap their targetwise
        pairing. Require the compiler to emit 2.5 versus 2.0 rather than 2.25
        for both.
    - id: CTRL-SLOT-BIJECTION-CENSUS
      cost: symbolic_cardinality_and_injective_mapping_check_zero_runs
      purpose: >-
        Enumerate all 32*4*3*256*32 tuples per size, map each to one slot, and
        prove the inverse decoder recovers model and eta as well as curve, root,
        and candidate.
    - id: CTRL-FULL-CENSUS-RECEIPT-BYTE-CROSSWALK
      cost: static_schema_compilation_zero_treatment_runs
      purpose: >-
        Compile exact bytes, paths, hashes, and all resource axes for 5,660,902
        receipts and reject the unchanged caps if any mandatory byte or counter
        action is unowned.
    - id: CTRL-RHO-RESIDENT-WALK-SCHEDULER-COLLISION
      cost: smallest_frozen_group_with_two_walks_on_one_shard
      purpose: >-
        Hold seeds and walk-to-shard mapping fixed, advance walks alternately
        versus draining one first, and require one frozen schedule to select the
        only admitted transcript and first collision.
    - id: CTRL-PARAMETERIZED-RHO-BSGS-FRONTIER
      cost: static_finite_parameter_grid_then_later_same-input_measurement
      purpose: >-
        Include at least full BSGS, memory-matched/segmented BSGS, and declared
        rho memory/parallel points before nondominance filtering.
    - id: CTRL-MANIFEST-SELF-NEUTRAL-HASH-KAT
      cost: two_literal_JCS_vectors_zero_runs
      purpose: >-
        State whether each digest field is omitted, null, or separately framed
        while hashing and freeze the exact preimage and output bytes.
    - id: CTRL-PHYSICAL-FOUR-BLOCK-TAIL-MUTATION
      cost: one_fixed_32_number_vector_zero_experiment_runs
      purpose: >-
        Feed twenty-eight zero log ratios and four log(2) ratios to the complete
        noninterference decision. Any rule called physical noninterference must
        reject even though the median interval is [0,0].

  counterexample_or_mutation:
    cheapest_falsification: CTRL-CUSTODY-RECEIPT-INSTANTIATION
    cost: one_static_key_set_comparison_zero_experiment_runs
    construction: >-
      Instantiate custody_open. Its lifecycle has no prerequisite, but the
      common required key set demands prerequisite_receipt_sha256 and supplies
      no sentinel. Its required payload fields include custodian_A_identifier,
      custodian_B_identifier, the public-key-manifest digest, envelope digest,
      key ID, and retention deadline. None is a common key; no payload key is a
      common key; and unknown fields are rejected. Omitting the fields violates
      the lifecycle, adding them violates the common schema, and adding a payload
      object is likewise unknown. No cryptography or run is needed.
    conclusion: >-
      Production custody and receipt semantics are not frozen, so the claimed
      zero static residual and PASS_STATIC producer verdict are false.
    secondary_fixed_target_counterexample: >-
