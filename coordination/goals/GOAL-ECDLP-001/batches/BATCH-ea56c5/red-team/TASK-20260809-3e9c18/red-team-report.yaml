  heuristic_challenges:
    - id: HA-fixed-target-uniformization-and-first-moment
      result: REVISE_COST_BRIDGE_NOT_HYPOTHESIS_REJECTION
      detail: >-
        Fresh uniform b makes Q' uniform for every fixed Q, so a predeclared
        same-shape null must reproduce the 1/N per-fixed-candidate opportunity.
        Because signed-y selection itself depends on h_y(Q'), uniformization
        alone does not prove gamma_s=0; any enrichment must survive the exact
        null, distinct-match, and Boolean bridge. More importantly, runtime for
        a fixed target is governed by 1/p_i and family-average work by
        E_i[C_i/p_i], never 1/E_i[p_i] or a product of separately averaged cost
        and inverse success. The current compiler loses that joint pairing.
    - id: HA-4-independent-restarts
      result: PASS_PROSPECTIVE_SEED_SEMANTICS_ONLY
      detail: >-
        The design keeps fresh root inputs and treats apparatus failure as
        invalidity. No run validates independence, and rho's baseline walk
        scheduling remains underfrozen.
    - id: HA-5-family-and-model-scaling
