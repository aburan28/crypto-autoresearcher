  pass_gates_checked_and_held:
    - id: PG1-verification-count-and-KAT-charging
      description: 3 mount states x 15,728,640 candidate slots + 6 KATs = 47,185,926, matching the resource_crosswalk, group-addition, and byte identities exactly across all five sizes.
    - id: PG2-canonical-decoder-reachability
      description: KAT-CANONICAL-POINT-ORBIT-19-BIT uses a genuine 19-bit prime (262147, prime, p mod 4 = 3) with a 4-byte affine encoding consistent with bits=18's declared field width, unlike the predecessor's unreachable 2-byte literal.
    - id: PG3-custody-and-envelope-cryptography
      description: The SYC4 envelope KAT is a correct, independently reproduced RFC 8439 ChaCha20-Poly1305 computation binding commitment, AAD, external key ID, and manifest digest.
    - id: PG4-class-consumer-allocation-conservation
      description: Every spot-checked class row's six-column consumer split sums exactly to its declared per-size population, including the three mixed-consumer rows that were the original B10 defect.
    - id: PG5-hardware-time-shard-collision-control
      description: The 720/8/90 vs 500/5/100 example correctly refuses to divide aggregate CPU by shard count and correctly returns Pareto-incomparable rather than a false dominance claim.
    - id: PG6-cost-bookkeeping-not-per-attempt-only
      description: candidate_directed_equations multiplies per-round additive/wall cost by a confidence restart bound (H_b_minus/H_b_plus) rather than reporting per-attempt cost alone, consistent with total-expected-cost = per-attempt-cost x inverse-success-probability.
    - id: PG7-nondominated-frontier-definition
      description: The interval-dominance rule (strict lower-vs-upper crossing on every axis, overlapping rows retained) is a legitimate full-cost Pareto test consistent with KN-TECH-035's caution against scalarizing memory-time tradeoffs, and correctly refuses to certify a candidate that only wins on a subset of axes.

  objections:
    - id: OBJ1-candidate-population-cap-is-N-independent-while-its-own-selection-boundary-is-not
      severity: blocking
      description: >-
        candidate_slots_per_size = 3,145,728 is held FLAT across all five order
        sizes (18, 21, 24, 27, 30 bits) -- independently re-derived as exactly
        curves(32) x roots(256) x models(4) x eta(3) x candidate_index(0..31,
        i.e. 32) = 3,145,728, confirmed by direct computation. This is a fixed
        combinatorial enumeration, not a quantity scaled from N. Meanwhile the
        N-dependent list-processing classes that feed the same candidates
        (treatment_and_control_group_additions, sorts, selected_pair_comparisons,
        etc.) grow by a recomputed factor of ~16.24x from bits=18 to bits=30
        (1,025,584,209 / 63,159,145), consistent with H-SYC-b854f4's own
        HA-1 list-length model L ~ N^(1/3+o(1)). HA-1's own stated boundary
        condition is explicitly N-dependent and unbounded: "a side above 4L,
        combined selected pairs above 8L ... invalidates the cost model." No
        artifact in this snapshot derives, bounds, or even states the expected
        or worst-case number of exact-match candidates a single (curve, root,
        model, eta) tuple can produce as a function of L(N), and none shows
        that 32 remains an adequate cap at the top of the tested ladder. Every
        OTHER resource in this document (group additions, logical traffic,
        archive, communication bytes, output bytes) carries an explicit
        hard_cap plus a computed slack plus an "overflow invalidates" rule
        (verified above); the candidate-index population is the one quantity
        in an otherwise exhaustively cross-checked design that has none of
        the three. Concretely: candidate_slot_schema's candidate_index field
        is fixed-width U8_0_through_31 with no stated behavior for a
        (curve,root,model,eta) tuple that produces a 32nd exact match -- the
        only "overflow" rule anywhere in the snapshot governs output FILE
        bytes ("overflow: invalidates_without_truncation" in
        physical-frontier-compiler.yaml#output_caps), not candidate population.
      proof_architecture_framing: >-
        This is a KN-TECH-080 audit-2 (observation-collision) failure: a
        world where the true per-tuple match count stays under 32 (modest or
        zero gamma_s) and a world where it exceeds 32 (a genuinely large,
        decision-relevant gamma_s -- precisely the interesting alternative
        H-SYC-b854f4 exists to test) produce the SAME observable, a
        saturated candidate_index=0..31 slot occupancy, because excess
        matches are silently uncounted rather than flagged. It is also a
        docs/inventor-protocol.md Section 3 structural tell: the quantity
        that should track N's growth (candidate capacity relative to the
        HA-1 boundary 8L) stays constant instead, exactly the "quantity that
        should decay [or grow] and does not" signature of an artifact risk,
        here in the direction of silently discarding evidence rather than
        manufacturing it.
      residual_status: >-
        Not one of the eight BATCH-ece945 blockers and not addressed by any
        of this producer's eight PASS_STATIC adjudications; it survives the
        repair untouched.

    - id: OBJ2-asymmetric-shard-parallelism-biases-the-wall-axis-of-the-positive-gate
      severity: blocking
      description: >-
        The candidate path's consumer classes (setup->generator, control->fixture,
        treatment->work, candidate/verify->verify, plus xof, analysis, memory,
        wiring) all use 8-way shard sets (generator-0..7, fixture-0..7, work-0..7,
        verify-0..7, ...), matching budget.maximum_parallel_shards: 8. The rho
        and BSGS baselines are pinned to 5-way shard sets (rho-shard-0..4,
        bsgs-0..4; walk_assignment: walk_id_mod_5, input_to_shard: input_index_mod_5)
        with no stated reason tied to hardware, only to the baseline protocol's
        own choice of 5 independent walks/shards. candidate_positive_gate
        requires the candidate to be STRICTLY better than every retained
        frontier row on aggregate_cpu_ns AND wall_latency_ns (plus non-worse
        on every other axis). aggregate_cpu_ns is, by design, shard-count
        invariant (summed, never divided -- correctly verified under PG5/PG6).
        wall_latency_ns is explicitly NOT shard-count invariant: more parallel
        shards mechanically reduce chronological wall time for the same
        aggregate work. Giving the candidate up to 8 shards against a baseline
        pinned to 5 therefore manufactures headroom on exactly one of the two
        mandatory strict axes, independent of any real per-root cost advantage.
        If the true available hardware ceiling is 8 shards, the fair control
        is to run rho/BSGS at 8-way parallelism too (or restrict candidate to
        5) before trusting a wall-axis "win."
      residual_status: >-
        Not one of the eight BATCH-ece945 blockers; the hardware_time_shard_collision
        KAT (PG5) correctly guards against dividing CPU by shard count but does
        not address unequal shard counts feeding an unnormalized wall-time axis.

    - id: OBJ3-method-ceiling-not-derived-against-observed-constant-factors
      severity: non_blocking_but_required_before_implementation_authorization
      description: >-
        H-SYC-b854f4's decision-changing threshold is gamma_s>5/18, an
        asymptotic statement valid only "for all sufficiently large N," with
        no stated crossover N. This snapshot's own class_population_table
        already shows, at the SMALLEST tested size (18 bits, N =~ 2^18),
        single-size totals in the tens of millions to ~1.74 billion elementary
        operations for list processing, hashing (SHAKE_fixed_blocks:
        1,741,891,719 at bits=18 alone), sorting, joining, serialization, and
        candidate verification -- versus a fully charged Pollard-rho cost on
        the order of 0.886*sqrt(2^18) =~ 641 group operations per curve
        (32 curves =~ 2.1x10^4 total). The proof_search_map's method_ceiling
        field states only the AUTHORITY ceiling ("this producer can certify
        only static completeness for independent review"), not the KN-TECH-080
        audit-4 RESOURCE ceiling ("the largest claim the resource measure can
        support under ideal tuning"). Nothing in the snapshot estimates the
        crossover N implied by these already-declared constant factors, so
        there is no evidence the 18-30-bit ladder's upper end is anywhere
        near a regime where the candidate_positive_gate could ever pass, even
        under the most favorable realizable gamma_s.
      residual_status: >-
        Orthogonal to the eight blockers (a research-direction-efficiency
        concern, not a static-byte defect); raised because CLAUDE.md's
        heuristic-and-cost-model challenge list requires checking whether the
        o(1)/polylog overhead and per-entry constants are tested against the
        headline exponent at standardized sizes, and this snapshot's own
        numbers already make that comparison possible without running anything.

    - id: OBJ4-closest-specialized-baseline-not-named
      severity: advisory
      description: >-
        agents/red-team.md requires comparison against Pollard-rho, BSGS, AND
        the closest specialized baseline. The mechanism (four length-L lists,
        complementary-label selection, exact point-sum equality A+B=Q') is
        structurally a k-list / generalized-birthday construction, not a
        two-party BSGS variant. Neither H-SYC-b854f4's proof_search_map nor
        this experiment's byte_exact_rho_protocol / byte_exact_BSGS_protocol
        names or embeds Wagner-style k-list algorithms (or a published
        multi-list ECDLP variant) as a baseline the frontier must also
        dominate. Van Oorschot-Wiener parallel rho IS effectively embedded
        (distinguished points, multiple walks, epoch barriers), which
        partially satisfies this rule; the k-list comparator does not appear
        anywhere.

  required_controls:
    - control: candidate-index-occupancy-vs-N derivation and overflow rule
      purpose: closes OBJ1
      action: >-
        Before implementation authorization, add an explicit derivation
        (symbolic or a frozen fixture) giving the expected and worst-case
        realized candidate_index occupancy per (curve, root, model, eta)
        tuple as a function of the same L(N) used elsewhere in this document,
        show 32 remains an adequate margin at bits=30 (the largest tested
        size), and add a "candidate_index overflow invalidates" rule
        symmetric with the existing output-byte overflow rule.
    - control: matched-parallelism wall-time re-run
      purpose: closes OBJ2
      action: >-
        Recompute rho_wall_interval and bsgs_wall_interval at 8-way shard
        parallelism (or recompute the candidate wall axis restricted to 5
        shards) using the same additive/chronological composition rules
        already defined, and confirm the candidate_positive_gate outcome
        does not change. If it does change, the wall-axis "win" was a
        hardware-provisioning artifact, not a mathematical signal.
    - control: crossover-N estimate from already-declared constants
      purpose: addresses OBJ3
      action: >-
        Using the SHAKE_fixed_blocks, sorts, pair_hashes, serialization, and
        scalar_witness_verification totals already frozen in this snapshot
        against the 0.886*sqrt(N) fully charged rho convention, compute the
        implied crossover N (even a rough order-of-magnitude bound) and state
        whether 2^30 is inside or far outside the regime where a positive
        result is even conceivable, before spending the 988-1235 declared
        CPU-hour budget on an implementation that targets this exact design.
    - control: name the k-list/generalized-birthday baseline
      purpose: addresses OBJ4
      action: >-
        Add Wagner-style k-list cost bounds (or the closest published
        multi-list ECDLP construction) to the frontier's baseline_protocols
        list, or record a specific reason the four-list mechanism reduces
        exactly to Pollard-rho/BSGS and no closer specialized baseline exists.

  counterexample_or_mutation: >-
    Cheapest concrete mutation that exposes OBJ1 without running anything:
    take the already-frozen mixed-consumer-split identity for
    selected_pair_comparisons (804,519,936 at bits=30, an 16.25x increase
    over bits=18's 49,545,216) and divide by the fixed per-size tuple count
    98,304 (=32 curves x 256 roots x 4 models x 3 eta) to get realized
    selected-pair-comparisons per tuple: 504 at bits=18 rising to 8,184 at
    bits=30. Compare against the fixed candidate_index cap of 32 per tuple:
    even granting that only a small, N^(o(1)) fraction of selected pairs
    becomes an exact-equality "candidate," the raw comparison volume feeding
    that filter grows >16x across the tested ladder while the downstream
    recording capacity for the resulting candidates is pinned flat at 32 --
    a design with no stated margin and no invalidation rule for the case
    where growth in raw comparisons is not perfectly cancelled by an equally
    fast drop in match probability. This is a five-minute recomputation on
    already-committed numbers, not a new experiment.

  baseline_comparison: >-
    Pollard-rho and standard BSGS are correctly embedded as byte-exact,
    parallel (van Oorschot-Wiener-style distinguished-point) finite protocols
    on the same public inputs, and the nondominated-frontier / positive-gate
    logic correctly refuses scalarization and correctly rejects the classic
    "CPU divided by shard count" dominance fallacy (independently reproduced
    under PG5/PG6/PG7 above). What is missing is (a) a named k-list /
    generalized-birthday specialized baseline appropriate to the mechanism's
    actual four-list structure (OBJ4), and (b) parity of hardware parallelism
    between the candidate path and the two baselines when computing the wall
    axis of the comparison (OBJ2) -- without which "candidate beats the
    rho/BSGS frontier" cannot be trusted to mean what it claims to mean even
    if every other byte in this snapshot is correct.

  heuristic_challenges:
    - >-
      HA-1 (selector regularity) states an explicit N-dependent invalidity
      boundary ("combined selected pairs above 8L ... invalidates the cost
      model") that this static repair's own candidate-capacity constant
      (independent of L or N) does not visibly respect or bound against; see
      OBJ1. This is not a defect in HA-1's own numbering or justification --
      HA-1 is explicit, numbered, and carries a stated boundary -- the defect
      is that the physical compiler downstream of it does not propagate that
      boundary into its own candidate-slot capacity.
    - >-
      HA-2's own boundary text already discloses "No theorem or observation
      presently supports positive gamma_x on prime curves," and the
      hypothesis's raw_rho_threshold (gamma_s>1/6) is already positioned at
      exactly the point past which Shoup's unconditional generic-group
      Omega(sqrt(N)) lower bound would be violated by a purely generic
      algorithm -- meaning any empirically observed gamma_s in the
      decision-changing range (>5/18) would necessarily indicate the
      signed-y label is exploiting non-generic (representation-specific)
      structure, not a defect discovered here, but a load-bearing
      precondition that should be restated explicitly in this experiment's
      own claim_boundary rather than left implicit one hop away in the
      hypothesis file.

  cost_model_challenges:
    - >-
      OBJ3 (method ceiling): the snapshot's own already-declared per-size
      operation counts, compared against the 0.886*sqrt(N) fully charged rho
      convention, are not reconciled into a stated crossover-N estimate,
      so there is no present evidence the 18-30-bit ladder can ever exhibit
      the claimed exponent even under maximally favorable tuning.
    - >-
      OBJ2 (shard asymmetry): wall_latency_ns is explicitly not shard-count
      normalized by design (correctly, to avoid dividing CPU by shards), but
      that same design choice means unequal shard budgets between candidate
      (8-way) and baselines (5-way) are not cost-model-neutral on that axis;
      this was not one of KN-TECH-035's named applicability limits and should
      be added to this program's full-cost-accounting checklist.

  reduction_and_scope_challenges:
    - >-
      No corollary-via-cited-reduction is claimed anywhere in this snapshot
      (implementation_authorized/execution_authorized are false throughout,
      and the scope block explicitly excludes asymptotic, cryptographic-scale,
      and novelty claims), so KN-TECH-080's reduction-instantiation audit is
      not_applicable here and that is correctly self-declared rather than
      silently omitted.
    - >-
      Scope is not inflated: the record repeatedly and consistently states
      it supports no implementation, measurement, scalar recovery, attack, or
      security-impact claim, and the toy 18-30-bit finite-ladder boundary is
      preserved unchanged from the predecessor. No affected-vs-safe scheme
      list is asserted, so there is nothing to audit for inflation on that
      axis.

  proof_architecture_challenges:
    - audit: observation_collision
      finding: >-
        OBJ1 is a direct KN-TECH-080 audit-2 failure: a modest-gamma_s world
        and a large-gamma_s world collide on the same observable (a saturated
        0..31 candidate_index range) once per-tuple matches exceed 32,
        because there is no overflow flag. The snapshot's own
        proof_search_map#observation_collision paragraph addresses only the
        null-orbit duplicate/negation collision (correctly, per PG2) and does
        not address this second, more consequential collision in the
        candidate-population encoding itself.
    - audit: method_ceiling
      finding: >-
        The proof_search_map#method_ceiling field states an authority
        ceiling ("can certify only static completeness for independent
        review") but not a resource ceiling (whether the described
        mechanism's own declared constant factors could ever let it win at
        the tested scale). KN-TECH-080 audit 4 asks for the latter; see OBJ3.
    - audit: baseline_reproduction
      finding: >-
        Symbolic 1/6, 5/18, 7/9 crossover identities are correctly inherited
        and the byte-exact rho/BSGS frontier reproduces the stated boundary
        case (gamma_s=0 gives the memory-matched BSGS exponent 7/9); PASS,
        held.
    - audit: quantifier_order
      finding: >-
        No witness-after-instance dependency was found in the reviewed
        artifacts; the deterministic_event_partition, shard function, and
        block partition are all fixed before any outcome, and the physical
        noninterference block/state ordering is a public-seed-keyed sort with
        no observed-data input. PASS, held.

  narrowest_supported_statement: >-
    The immutable BATCH-ea56c5 producer snapshot (commit
    672e08ca06031fb6f77369db5e3f2b7658e1b7ba) genuinely and verifiably repairs
    all eight BATCH-ece945 static blockers at the byte level -- independently
    reconfirmed by recomputation, not merely re-read -- including a genuine,
    correct RFC 8439 ChaCha20-Poly1305 custody KAT and a correct SHAKE256
    null-point-orbit KAT. That repair does not, by itself, make the successor
    PASS_STATIC for independent review: two structural gaps outside the
    original eight-blocker list -- an N-independent candidate-population cap
    against an N-dependent selection boundary the hypothesis itself declares
    (OBJ1), and an unequal candidate/baseline shard-parallelism allocation
    that biases the mandatory wall-time axis of the frontier comparison
    (OBJ2) -- are not addressed by this snapshot or by any of its eight
    PASS_STATIC blocker adjudications, and each is cheap to check or repair
    without running any code. This finding is scoped to the exact reviewed
    snapshot and its five committed artifacts; it says nothing about
    H-SYC-b854f4, ECDLP, or any prime-field curve, and it authorizes no
    implementation, execution, or official status change.

  next_concrete_action: >-
    Coordinator opens a versioned static successor (not an Executor or
    implementation task) that (1) derives and bounds candidate_index
    occupancy per (curve,root,model,eta) tuple against L(N) at all five
    ladder sizes with an explicit overflow-invalidation rule, and (2) either
    equalizes shard parallelism between the candidate path and the rho/BSGS
    baselines or documents and re-derives the wall axis at matched
    parallelism. Obtain fresh independent Validator and Red Team review of
    that successor before any Coordinator decision considers a
    maximum-runs-zero implementation batch. No implementation or execution is
    authorized by this report or by dual PASS on the current snapshot alone.

  no_execution_boundary_statement: >-
    This report performed zero commands against curve, cryptographic, or
    experiment code beyond independent recomputation of already-declared
    static numbers and byte layouts (Python arithmetic, hashing, and a
    standard-library-adjacent ChaCha20-Poly1305 call against literal test
    vectors already present in the snapshot -- no production seed, no
    candidate stream, no implementation, and no sandbox was touched or
    created). execution_authorized, implementation_authorized, and
    official_status_change_authorized are all false. No experiment ran, no
    run record was created, no ledger or hypothesis status changed, and no
    evidence for H-SYC-b854f4 or ECDLP was produced or is claimed. This
