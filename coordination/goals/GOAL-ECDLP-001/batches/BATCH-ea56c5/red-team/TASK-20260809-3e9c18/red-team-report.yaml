  claim_under_review: >-
    Whether immutable producer snapshot
    672e08ca06031fb6f77369db5e3f2b7658e1b7ba repairs all eight
    BATCH-ece945 static blockers strongly enough to admit consideration of a
    later maximum-runs-zero implementation batch: canonical decoder/null
    reachability; production custody and receipts; deterministic sharding and
    full census; class-to-consumer and candidate/control/rho/BSGS assembly;
    all three mount-state verifications and their end-to-end resources;
    byte-exact rho/BSGS finite-frontier completeness; prospective executable,
    dependency, syscall, sandbox, slot, and coverage schemas without circular
    future requirements; and statistically valid physical noninterference.
    This review also attacks fixed-target inverse-success accounting, proof and
    cost ceilings, hidden omissions, false equivalence, and Pareto completeness.
    It reviews no implementation, run, measurement, or ECDLP result because
    none exists.

  overall_rationale: >-
    REVISE. The immutable snapshot, exact parent, direct queue-binding child,
    six-path diff, receipt hash, producer hashes, strict syntax, authorization
    flags, canonical point KAT, point-orbit XOF replay, six-column population
    conservation, and raw verification-count arithmetic all survive static
    challenge. They do not establish the producer's zero-residual conclusion.
    The custody receipt language has no conforming lifecycle instance as
    written: lifecycle payload fields have no payload container yet unknown
    fields are rejected, custody_open has no prerequisite while the common
    schema requires a prerequisite digest, and the replay KAT is not an
    instance of the common schema. The full-census reinterpretation creates
    5,660,902 required block receipts without a canonical byte encoding, path,
    or resource allocation. The candidate slot language has no bijection from
    slot index to the four-model, three-eta, curve, root, and candidate census.
    The fixed-target cost compiler multiplies an averaged inverse-success bound
    by an aggregated cost, losing the joint target-by-cost pairing required by
    E[1/p]. Rho still leaves within-shard scheduling among its 64 walks
    selectable, and the alleged complete frontier contains only one rho row
    and one full-table BSGS row, omitting standard time-memory tradeoffs. The
    executable and coverage manifests contain unexplained self-hash fields,
    while the proposed seccomp BPF cannot distinguish allowed and forbidden
    pathname bytes or enforce temporal/dataflow restrictions on getrandom.
    Finally, the physical rule is only a median-equivalence test: it accepts a
    frozen mutation with four of thirty-two blocks showing a 100-percent mount
    effect. These are static counterexamples to contract completeness, not
    evidence against H-SYC-b854f4 or ECDLP. No implementation is admissible.

