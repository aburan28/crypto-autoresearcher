  blocker_adjudication:
    - id: B7-production-seed-envelope-underbound
      adjudication: REVISE
      passed_checks:
        - exact seed commitment, authenticated header, AAD, external key ID, nonce, ciphertext, tag, and envelope bytes replay
        - six lifecycle names, role requirements, JCS encoding, Ed25519 signing rule, retention order, and destruction order are present
      blocking_evidence: >-
        receipt_common_schema requires payload_sha256 but defines neither a
        payload member nor the exact bytes hashed into payload_sha256. Lifecycle
        payload_fields likewise have no types or rule saying whether they are
        top-level fields or members of a payload object. In addition,
        prerequisite_receipt_sha256 is required for every receipt while
        custody_open has prerequisites=[], but no null, empty, or fixed-zero
        encoding is selected. unknown_fields=reject makes this omission
        operational, not cosmetic. The replay_receipt_KAT is explicitly a
        canonicalization-only unsigned fixture and omits multiple common
        required fields, so it cannot disambiguate the production language.
      cheapest_countermodel: >-
        Encode custody_open once with prerequisite_receipt_sha256=null and once
        with prerequisite_receipt_sha256 as a fixed zero digest, while keeping
        all stated semantic fields equal. The contract selects neither byte
        string. Similarly, a lifecycle payload can be placed at top level or
        under payload because no production receipt grammar selects one.
      required_repair: >-
        Freeze the exact union of common and per-lifecycle fields with types,
        freeze the payload container and SHA-256 preimage rule, select one
        zero-prerequisite representation, bind signature metadata to role-key
        authorization, and add at least one full test-key receipt fixture that
        satisfies the production schema and signature-verification path.

    - id: B1-event-to-shard-allocation-underdefined
      adjudication: REVISE
      passed_checks:
        - consumer ranges are zero-based, contiguous, and conserving
        - round-robin event-to-shard assignment is deterministic and every named shard set exists
        - every class-level full and residual q block is arithmetically enumerable
      blocking_evidence: >-
        The compiler defines q blocks over the complete class interval, but a
        block receipt has one consumer_id. Split-consumer boundaries are not q
        boundaries. For treatment_and_control_group_additions at bits=18,
        treatment has 29255888 events and q=13108. Division gives block index
        2231 with interval [29243948,29257056), containing 11940 treatment
        events and 1168 control events. No single consumer_id can describe that
        mandatory block. The same collision occurs in the other explicit split
        rows. An implementation must either mislabel events or silently choose
        a different block partition.
      required_repair: >-
        Define q blocks independently within each consumer half-open range,
        including the consumer offset in block identity, or replace singular
        consumer_id with exact per-consumer subranges/counts and update the
        block digest and conservation rule. Recompute residual-block fixtures.

    - id: B10-class-to-candidate-cost-assembly-missing
      adjudication: PASS_STATIC_FOR_MATRIX_AND_FORMULAS_WITH_B1_DEPENDENCY
      passed_checks:
        - all twenty-eight six-column allocations conserve every per-size population
        - treatment/control and treatment/rho split identities recompute
        - generic additive, wall, and peak equations cover all nine axes and keep controls separate
        - aggregate CPU is summed and never divided by shards
      limitation: >-
        These totals and formulas cannot be compiled from the currently frozen
        full-census receipts until B1's mixed-consumer block collision is fixed.
        No measured directed row or cost advantage exists.

    - id: B10-finite-baseline-frontier-incomplete
      adjudication: REVISE
      passed_checks:
        - rho state and distinguished record widths, partition, epoch barrier, table retention, collision formula, restart cap, and cycle detector are stated
        - BSGS baby table, giant order, tie enumeration, verifier, retention, and stop are deterministic
        - frontier dominance retains overlapping rows and compares the candidate against both rho and BSGS on nine axes
      blocking_evidence: >-
        byte_exact_rho_protocol states walk_id_mod_5 but freezes neither the
        initial walk-id set/count nor the schedule among multiple walk IDs on a
        shard. global_step_order contains epoch, shard ordinal, and local_step,
        but not walk_id. One implementation may start walk IDs 0 through 4 and
        another 0 through 9 and round-robin two walks per shard; both satisfy
        every stated assignment and epoch rule but produce different states,
        collision order, restart behavior, and finite cost. The meaning of the
        64-restart cap is consequently also not bound to an exact walk set.
      required_repair: >-
        Freeze the initial walk IDs and count, exact intra-shard step schedule,
        restart replacement rule, and whether the restart cap is aggregate or
        per walk. Include walk_id and restart_id in the total event/collision
        order or prove the frozen one-walk-per-shard schedule makes them
        redundant. Add the preregistered tiny fully enumerable rho/BSGS
        frontier fixture before a finite comparison.

    - id: B9-null-point-kat-constructor-unreachable
      adjudication: PASS_STATIC
      passed_checks:
        - the predecessor two-byte literals reject under the four-byte decoder
        - every successor affine literal has the required four-byte width
        - curve equation, square root, prefix parity, decode, and byte-identical re-encode all pass
        - duplicate, negation, cross-root, and infinity label relations and replay digest pass

    - id: B12-two-verification-passes-uncharged
      adjudication: PASS_STATIC_FOR_DECLARED_COUNTS_AND_CAPS
      passed_checks:
        - all 47185920 candidate mount-state passes and six KATs are present
        - 283115556 verifier additions and 28800 table additions recompute
        - declared candidate reads, table reads, accumulator traffic, packed bits, metadata, output, archive, and communication identities recompute
        - successor operation and traffic totals remain below unchanged caps
      limitation: >-
        Exact per-consumer physical receipt ownership remains blocked by B1.
        Passing aggregate arithmetic is not a measurement or execution result.

    - id: B12-executable-and-coverage-universe-incomplete
      adjudication: REVISE
      passed_checks:
        - current future hashes, production receipts, coverage values, and measurements correctly remain null
        - interpreter, stdlib, import, environment, descriptor, mount, IPC, network, syscall, sandbox, slot, and actual-stream field sets are prospective rather than fabricated evidence
        - synthetic implementation KATs and post-generation actual-stream replay are separated
        - deterministic exact identities and noisy physical intervals are separated
        - the declared ninety-interval family bound recomputes
      blocking_evidence:
        - >-
          executable-universe.json includes manifest_sha256 in its own exact JCS
          top-level fields but defines no digest preimage or self-neutral rule.
          actual-stream/noninterference-coverage.json similarly includes
          coverage_sha256 without a rule. Hashing the final bytes is circular;
          hashing with the field omitted versus null gives distinct plausible
          manifests. This is a missing prospective schema rule, not a demand
          for nonexistent future hashes.
        - >-
          wiring_unique_64_byte_line_touches is a mandatory ninth physical
          frontier axis and full-census receipts report directed wiring bounds,
          but it appears in neither deterministic_exact_identity_fields nor
          physical_noninterference_equivalence.noisy_axes. The family contains
          only six axes, so mount-state-dependent wiring is never adjudicated.
      required_repair:
        - define exact omitted-field or fixed-null self-neutral digest preimages for both manifests, or store the digests only in external receipts
        - classify wiring-line touches as exact or noisy; if noisy, include it in the preregistered family, making 105 intervals with Bonferroni bound 0.002026625443249941, still below 0.01

    - id: producer-sole-lifecycle-residual-misidentified
      adjudication: PASS_STATIC_FOR_LIFECYCLE_SEPARATION
      passed_checks:
        - no current executable hash, production receipt, coverage certificate, or measurement is required or fabricated
        - static review does not authorize implementation or execution
      limitation: >-
        Lifecycle separation does not excuse the missing self-neutral rules for
        the schemas that future artifacts must follow.

  cheapest_falsification_control:
    id: CTRL-CONSUMER-BLOCK-BOUNDARY-COLLISION
    cost: one_integer_division_zero_experiment_runs
    construction: >-
      Select class treatment_and_control_group_additions, bits=18. Its treatment
      prefix has 29255888 events and its class-level block width is 13108.
      Compute 29255888=2231*13108+11940. Mandatory block 2231 is therefore
      [29243948,29257056): 11940 treatment events followed by 1168 control
      events. Compare this with block_receipt_fields, which permits one
      consumer_id.
    result: REJECT_ZERO_RESIDUAL
    conclusion: >-
      The frozen block language cannot encode its own conserving consumer
      allocation. This single static collision is sufficient for REVISE before
      any curve code, implementation, benchmark, or future artifact is created.

  proof_architecture_checks:
    baseline_reproduction: >-
      The inherited symbolic one-sixth, one-ninth, and five-eighteenths
      identities and the BSGS finite protocol are static. Exact finite baseline
      reproduction remains blocked by the selectable rho walk population and
      schedule. No finite baseline row is observed.
    observation_collision: >-
      The producer closes the predecessor one-versus-three verification-count
      collision and noncanonical point collision. It does not close the
      consumer/block collision, custody-receipt byte collision, or manifest
      self-hash collision documented above.
    quantifier_fidelity: >-
      Leaving future values null is correct. The universally frozen prospective
      schemas must nevertheless select digest preimages, receipt bytes, rho
      schedules, and every mandatory physical axis before implementation.
    method_ceiling_and_nearby_control: >-
      The point-orbit nearby control passes at one admitted nineteen-bit curve.
      The stated ceiling remains a zero-run 18-through-30-bit prospective
      design and supports no transfer or ECDLP conclusion.
    interface_preservation: >-
      Commitment-to-envelope bytes pass but envelope-to-receipt grammar fails;
      population-to-consumer totals pass but consumer-to-block receipts fail;
      candidate-to-BSGS passes but candidate-to-exact-rho fails; deterministic
      stream fields pass but wiring-to-physical-equivalence fails.
    verdict: REVISE

  pareto_honesty:
    dominated_by: n/a_no_result_claimed
    frontier_checked: >-
      The prospective two-row frontier rule was checked across all nine named
      axes. No finite row exists, and the rho row is not yet generated by a
