      `git merge-base --is-ancestor`. The BATCH-ece945 baseline was read the
      same way from commit 204cb0e52... (its ledger-archive bind commit) and
      2ee0c160a81487ccc54470dda702e8e613e082d6 (its producer snapshot). No
      working-tree-only content was used as evidence; where the working tree
      happened to be clean and identical to these commits (confirmed by
      `git status --short` returning empty), files were still hashed against
      the named commit, not trusted from disk.
    statement: >-
      This report validates only a prospective, implementation-independent
