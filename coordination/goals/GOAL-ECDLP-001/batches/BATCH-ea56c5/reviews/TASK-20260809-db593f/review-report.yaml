  eight_blocker_adjudication:
    - id: B7-production-seed-envelope-underbound
      status: PASS_STATIC
      independent_recomputation: >-
        Recomputed end-to-end with Python's `cryptography` library
        (ChaCha20Poly1305): public_manifest_sha256, external_key_id byte
        encoding, commitment_sha256, authenticated_header bytes, AEAD_AAD
        bytes and its sha256, the RFC8439 ciphertext, tag, full envelope
        bytes and envelope_sha256, and successful decrypt-back-to-plaintext
        all reproduce exactly against the KAT in
        custody-and-executable-contract.yaml#envelope_KAT. The external key
        ID is now a bound frame field (addressing the BATCH-ece945 red-team
        objection RT-PRODUCTION-SEED-ENVELOPE-BINDING-INCOMPLETE), and a
        concrete six-stage custody receipt lifecycle with signature schema
        is now specified.
      residual: null
    - id: B1-event-to-shard-allocation-underdefined
      status: PASS_STATIC
      independent_recomputation: >-
        `shard_function` is now a closed-form deterministic function of
        size_ordinal and global_event_index (mod shard_count), replacing the
        predecessor's bare named shard-ID lists. Independently parsed and
        cross-checked all 28 class_population_table rows against
        consumer_allocation_matrix: every row's six-column split sums
        exactly to n_c(b) at every size (script-verified, 28/28), and every
        q_c(b) is positive and <= n_c(b). Spot-checked
        treatment_and_control_group_additions and signed_y_and_null_labels
        splits by hand; both sum exactly.
      residual: null
    - id: B10-class-to-candidate-cost-assembly-missing
      status: REVISE
      independent_recomputation: >-
        The consumer_allocation_matrix mechanism itself is complete and
        internally consistent (28/28 rows sum correctly). However the
        underlying population figure for one of the 28 classes,
        archive_hashing, is not recomputed for this successor: its
        n_c_by_size vector [59039343, 119015819, 238968771, 478874674,
        958686481] is byte-identical to the predecessor's (unrepaired)
        EXP-SYC-268d6f archive_hashing row, confirmed by diffing against
        git commit 2ee0c160a81487ccc54470dda702e8e613e082d6. A row-internal
        sum check cannot catch this because the row is internally
        consistent with itself; it is simply the wrong (stale) total. See
        the blocking finding below for the full chain.
      residual: >-
        archive_hashing class population, and hence archive_scheduled_bytes
        and communication_scheduled_bytes, do not reflect the two newly
        charged mount-state verification passes.
    - id: B10-finite-baseline-frontier-incomplete
      status: PASS_STATIC
      independent_recomputation: >-
        byte_exact_rho_protocol and byte_exact_BSGS_protocol are both now
        fully specified with concrete fixed-width state/record schemas,
        distinguished-point epoch-barrier merge rules, Brent cycle
        detection, and a complete baby/giant-step BSGS protocol with tie
        rules. nondominated_finite_frontier's positive/negative gate now
        applies to every retained row of BOTH rho and BSGS baselines (fixing
        the BATCH-ece945 red-team objection
        RT-RHO-AND-BSGS-FRONTIER-INCOMPLETE, which found BSGS was only a
        prose row and the positive gate tested rho alone).
      residual: null
    - id: B9-null-point-kat-constructor-unreachable
      status: PASS_STATIC
      independent_recomputation: >-
        Recomputed from scratch in Python: p=262147 is prime and 19 bits,
        p mod 4 = 3, discriminant witness 4a^3+27b^2 mod p = 59, R=(0,1) and
        minus_R=(0,262146) are on curve y^2=x^3+2x+1 and canonically encode
        to 03000000 / 02000000 (4-byte affine width, matching a 19-bit
        prime -- this is exactly the defect BATCH-ece945's red-team
        objection RT-NULL-KAT-NONCANONICAL-POINT-WIDTH found in the
        predecessor's 2-byte 0201/0301 literals). The full input stream
        03000000020000000300000000 reproduces exactly, and all four
        invalid_mutations reject for the stated reason (wrong length, wrong
        prefix, x>=p). Independently recomputed the point_orbit_null_v3
        absorb_sha256, SHAKE256 output, and replay_sha256 with hashlib; all
        three match exactly.
      residual: null
    - id: B12-two-verification-passes-uncharged
      status: REVISE
      independent_recomputation: >-
        The verification-count identity (3*15728640+6=47185926) and the
        derived logical-byte/group-addition arithmetic all recompute
        exactly and correctly (verification_group_additions=283115556,
        successor_group_additions=2267225191 with slack 212875849 under an
        unchanged 2480101040 cap; successor_logical_traffic_bytes=
        790546390912 with slack 55588266048 under an unchanged
        846134656960 cap; the per-size physical_memory_topology vector
        [26151894143, 51528314151, 102281154166, 203786834195,
        406798194257] reproduces exactly from the predecessor's per-size
        vector plus the declared additions). BLOCKING: archive_scheduled_
        bytes (1854585088) and communication_scheduled_bytes (1871362304)
        are proven byte-for-byte identical to the unrepaired predecessor's
        figures (confirmed by diffing physical-frontier-compiler.yaml
        against BATCH-ece945's physical-cost-compiler.yaml at commit
        2ee0c160a). The design-repair-report's own claim that "the exact
        two added packed V/S pairs plus coverage/counter metadata occupy
        the reserved 8388608-byte archive and communication addition" is
        not supported by the numbers it ships: that 8388608-byte figure is
        the SAME reserved slot the predecessor already spent on ten
        different named output files (confidence-kats.json, byte-kats.json,
        null-replay.json, physical-class-allocation.json,
        rho-baseline.jsonl, dependency-closure.json, executable-hashes.json,
        noninterference-coverage.json, annotation-digests.json,
        reserved_JCS_and_newline_overhead), none of which appear anywhere
        in any of the five successor artifacts (grep across all five files
        returns zero matches). The successor's output_caps table lists five
        entirely different files (TARGET/DECOY V/S-packed.bin x4 plus
        coverage-counters-receipts-and-JCS-overhead) that happen to also
        sum to 8388608 bytes. This looks like the same numeric total was
        reused for an unrelated purpose rather than the archive/
        communication budgets being independently recomputed for the newly
        charged workload, and it leaves undisclosed whether the
        predecessor's nine other required output artifacts are dropped,
        renamed, or simply forgotten.
      residual: >-
        Two new mount-state passes' worth of archive and communication
        bytes are not demonstrably charged; nine previously required output
        artifacts have no traceable disposition in the successor.
    - id: B12-executable-and-coverage-universe-incomplete
      status: REVISE
      independent_recomputation: >-
        The executable-universe manifest schema, node schema, import
        resolution/scanner fixed-point rule, environment/descriptor
        contract, and a concrete linux_x86_64 syscall allowlist (37 named
        syscalls plus an explicit default_action of
        kill_process_and_mark_apparatus_invalid) are now genuinely frozen,
        which is a real improvement over BATCH-ece945's deferred allowlist
        (VAL-ECE945-NONINTERFERENCE-UNIVERSE / RT-SYNTHETIC-COVERAGE-NOT-
        ACTUAL-STREAM-COVERAGE). The synthetic-vs-actual-stream gate split
        (implementation_snapshot_static_closure_and_synthetic_branch_KATs
        -> candidate_generation -> three_mount_actual_stream_
        counterfactual_replay) and the noisy-vs-deterministic
        noninterference criteria are also now explicitly separated,
        addressing RT-PHYSICAL-COUNTER-BYTE-IDENTITY-FALSE-POSITIVE. BLOCKING:
        custody-and-executable-contract.yaml itself requires an
        actual_coverage_path of actual-stream/noninterference-coverage.json,
        an executable-universe.json manifest, a sandbox-policy.json, and up
        to 30 custody receipt files (6 receipt types x 5 seed classes), none
        of which have any corresponding line in physical-frontier-compiler.
        yaml's resource_crosswalk or output_caps. The "coverage universe" is
        therefore specified in prose but not actually closed under the same
        resource-budget discipline the rest of the document claims for
        itself (static_completeness declares
        deterministic_and_noisy_noninterference_criteria_separated: true
        and static_residual_count: 0, which this gap contradicts).
      residual: >-
        Required custody, manifest, and coverage output artifacts named in
        custody-and-executable-contract.yaml have no output-byte budget in
        physical-frontier-compiler.yaml.
    - id: producer-sole-lifecycle-residual-misidentified
      status: PASS_STATIC_CORRECTED
      independent_recomputation: >-
        This is an honest self-correction, not a fabrication: it accepts
        BATCH-ece945's validator finding VAL-ECE945-LIFECYCLE-CLAIM
        (the producer's claimed "sole residual" was not actually imposed by
        the immutable handoff) rather than re-asserting the predecessor's
        overclaim. current_executable_hashes, current_dependency_manifest,
        current_syscall_policy_hash, and current_actual_stream_coverage are
        all correctly left `null` in custody-and-executable-contract.yaml,
        with absent_future_values_are_not_static_residuals: true stated
        explicitly rather than any hash being invented.
      residual: null

