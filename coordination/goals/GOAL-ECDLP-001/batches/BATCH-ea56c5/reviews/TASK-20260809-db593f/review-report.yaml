    sota_delta: no_attack_no_observed_cost_delta_static_contract_only

  preserved_gate_audit:
    adjudication: PASS_FOR_ENUMERATED_STATIC_IDENTITIES_ONLY
    passed_gates:
      - exact snapshot, parent, commit-message identifiers, reachable commit, six-path diff, hashes, record IDs, and self-neutral receipt
      - five single-document duplicate-key-free YAML artifacts and strict receipt JSON
      - all inherited confidence, clipping, infinity, literal SHAKE256, and AEAD KATs
      - successor canonical point/null KAT and exact verification-count identity
      - twenty-eight population and allocation totals and deterministic event-to-shard formula
      - declared candidate/control/rho/BSGS nine-axis equations and conservative two-row frontier rule
      - declared operation, logical-traffic, output, archive, communication, wall, CPU, memory, and slack arithmetic under unchanged caps
      - exact 18-through-30-bit finite scope, no transfer, status review_required, approved_by null, implementation and execution false, and maximum_runs zero
    limitations:
      - total conservation does not make mixed-consumer block receipts representable
