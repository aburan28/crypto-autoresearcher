  verdict_summary: >-
    REVISE. This is a design-gate review of a zero-run static repair snapshot;
    it authorizes no implementation or execution. Six of the eight named
    BATCH-ece945 blockers (B7 production seed envelope, B1 event-to-shard
    allocation, B10 finite rho/BSGS frontier, B9 null-point KAT, and the
    lifecycle-residual self-correction) independently recompute exactly:
    every literal SHA-256/SHAKE256 digest, the full ChaCha20-Poly1305 AEAD
    KAT (AAD, ciphertext, tag, envelope), the admitted-curve arithmetic
    (p=262147 primality, discriminant, point encode/decode/re-encode), the
    28-class consumer-allocation matrix (all 28 rows sum exactly to n_c(b)
    at every size), the deterministic shard function, and the byte-exact
    rho/BSGS state-machine and frontier-gate protocols. However, independent
    cross-artifact recomputation shows the successor's B12 "two verification
    passes uncharged" repair is incomplete: the archive_hashing class
    population, archive_scheduled_bytes, and communication_scheduled_bytes
    are byte-for-byte IDENTICAL to the unrepaired predecessor
    (EXP-SYC-268d6f) figures despite the successor charging 31,457,280
    additional candidate verifications across two new mount-state passes.
    The successor's output_caps table silently replaces the predecessor's
    ten required output artifacts (confidence-kats.json, byte-kats.json,
    null-replay.json, physical-class-allocation.json, rho-baseline.jsonl,
    dependency-closure.json, executable-hashes.json,
    noninterference-coverage.json, annotation-digests.json,
    reserved_JCS_and_newline_overhead -- summing to the same 8388608 bytes)
    with five differently-named files (TARGET/DECOY V/S-packed.bin plus
    coverage-counters-receipts) that coincidentally also sum to 8388608
    bytes, with no disclosure that the prior nine files are dropped, renamed,
    or superseded. custody-and-executable-contract.yaml still requires an
    actual-stream/noninterference-coverage.json output and dozens of custody
    receipt files with no corresponding line in the resource crosswalk. This
    reproduces, in the archive/communication/output-byte axis, the exact
    defect class B12 was supposed to close in the candidate-verification
    axis. This is a pre-implementation static design defect, not evidence
    against H-SYC-b854f4 or ECDLP.

