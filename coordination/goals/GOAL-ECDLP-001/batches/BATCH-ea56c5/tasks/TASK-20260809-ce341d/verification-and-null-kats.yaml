    table_per_curve: >-
      For window j in 0 through 5, freeze the points d*[2^(5j)]P for d in
      1 through 31 in canonical compressed form. Starting from the known base
      point for that window, construct d=2 through 31 by exactly thirty group
      additions. The d=0 selection is infinity and is still consumed.
    verification: >-
      Parse the scalar as six little-endian five-bit digits. Initialize T to
      infinity. For j=0 through 5 in ascending order, constant-time select the
      canonical table point for digit d_j, selecting infinity for zero, and set
      T=T+selected_point. Exactly six group additions occur for every occupied
      or empty slot. Accept V=1 only when occupied=true, every canonical decode
      succeeds, and canonical(T) equals canonical(Q). Set S=V.
