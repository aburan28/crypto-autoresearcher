  byte_exact_rho_protocol:
    input_binding: exact_same_public_manifest_curve_P_Q_order_and_fixed_base_table_bytes_as_candidate_and_bsgs
    state_record:
      magic_ascii: SYC4RSTA
      version_u16be: 1
      fields: [bits_u8, curve_id_u16be, target_id_u8, walk_id_u32be, restart_id_u8, step_u64be, X_point_fixed5, alpha_u32be, beta_u32be, state_sha256_32]
      fixed_width_bytes: 72
      state_sha256_rule: SHA256_of_magic_version_and_the_preceding_30_field_bytes_total_40_preimage_bytes
      exact_width_check: '8+2+1+2+1+4+1+8+5+4+4+32=72'
    invariant: X=[alpha]P+[beta]Q
    partition: low_four_bits_of_SHA256_of_canonical_X
    partition_count: 16
    step_table: inherited_EXP_SYC_268d6f_RHO_STEP_v1_exact_bytes_and_rejection_attempts_0_through_7
    start_table: inherited_EXP_SYC_268d6f_RHO_START_v1_exact_bytes_and_rejection_attempts_0_through_7
    distinguished_bits_by_size: {18: 9, 21: 11, 24: 12, 27: 14, 30: 15}
    distinguished_record:
      magic_ascii: SYC4RDPT
      fields: [bits_u8, curve_id_u16be, target_id_u8, global_step_u64be, shard_id_u8, walk_id_u32be, restart_id_u8, X_point_fixed5, alpha_u32be, beta_u32be, reserved_zero_u8, record_sha256_32]
      fixed_width_bytes: 72
      record_sha256_rule: SHA256_of_magic_and_the_preceding_32_field_bytes_total_40_preimage_bytes
      exact_width_check: '8+1+2+1+8+1+4+1+5+4+4+1+32=72'
    epoch_steps_per_shard: 1024
    global_step_order: 'epoch*5*1024+shard_ordinal*1024+local_step'
    table_retention: retain_first_record_per_exact_X_until_input_terminal_then_archive
    first_record_order: lexicographic_by_global_step_shard_walk_restart_alpha_beta
    epoch_merge: >-
      At each five-shard barrier, concatenate records, stable-sort by
      X bytes then the first-record order, and process equal-X groups in that
      order. Table insertion and collision enumeration occur only after the
      barrier, so message arrival cannot select a collision.
    collision_pairs: lexicographic_combinations_of_the_sorted_equal_X_group_with_retained_table_record_first
    degenerate_collision: equal_beta_forces_charged_restart_of_the_later_record_walk
    candidate_scalar: '(alpha_left-alpha_right)*inverse(beta_right-beta_left) mod r'
    collision_acceptance: fixed_window_public_verifier_and_byte_equality_to_Q
    cycle_policy: >-
      Each walk runs Brent cycle detection on exact canonical X bytes with
      power and lambda initialized to one. A repeated X before a distinguished
      record triggers a charged restart. The detector state is in every epoch
      receipt. No heuristic cutoff or scheduler-dependent table eviction exists.
    walk_assignment: walk_id_mod_5
    restart_rule: fresh_RHO_START_domain_no_state_or_table_reuse_for_that_walk
    stop: first_verified_collision_in_global_order_or_64_restarts_or_ceil_8_sqrt_r_aggregate_steps
    failure: charged_baseline_failure_not_ECDLP_evidence
    choices_remaining: 0

  byte_exact_BSGS_protocol:
    input_binding: exact_same_public_manifest_curve_P_Q_order_and_fixed_base_table_bytes_as_candidate_and_rho
    m: ceil_sqrt_r_exact_integer
    input_to_shard: input_index_mod_5
    parallelism_within_one_input: 1
    baby_record:
      magic_ascii: SYC4BABY
      fields: [bits_u8, curve_id_u16be, target_id_u8, j_u32be, point_fixed5, record_sha256_32]
      fixed_width_bytes: 53
      record_sha256_rule: SHA256_of_magic_and_the_preceding_13_field_bytes_total_21_preimage_bytes
      exact_width_check: '8+1+2+1+4+5+32=53'
    baby_generation: >-
      Emit j=0 through m-1 in order with B_j=[j]P, using infinity for j=0
      and one addition of P for each successor. Stable-sort by canonical point
      bytes then j. Equal points retain every j; lookup returns increasing j.
    giant_record:
      magic_ascii: SYC4GNST
      fields: [bits_u8, curve_id_u16be, target_id_u8, i_u32be, point_fixed5, record_sha256_32]
      fixed_width_bytes: 53
      record_sha256_rule: SHA256_of_magic_and_the_preceding_13_field_bytes_total_21_preimage_bytes
      exact_width_check: '8+1+2+1+4+5+32=53'
    giant_generation: >-
      Compute M=[m]P with the six-window fixed-base verifier table. Set G_0=Q.
      For i=0 through m inclusive, emit G_i, enumerate every baby-table match in
      increasing j, set k=(i*m+j) mod r, and run the fixed-window public
      verifier. If none verifies, set G_(i+1)=G_i-M by one group addition.
    tie_and_stop_rule: first_verified_pair_in_lexicographic_i_then_j_order
    baby_table_retention: exact_full_table_until_input_terminal_then_archive
    table_layout: stable_sorted_fixed_width_records_no_hash_table
    collision_policy: byte_equality_only_then_public_scalar_verification
