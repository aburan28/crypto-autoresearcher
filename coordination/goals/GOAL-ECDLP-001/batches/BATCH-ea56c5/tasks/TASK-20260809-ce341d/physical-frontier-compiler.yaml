  fixed_point_record_encoding:
    affine_canonical_length_by_bits: {18: 4, 21: 4, 24: 5, 27: 5, 30: 5}
    infinity_canonical_hex: '00'
    storage_width_bytes: 5
    storage_rule: canonical_encoding_followed_by_the_minimum_zero_suffix_to_width_five
    decode_rule: >-
      Bits selects the canonical affine length. Require every suffix byte after
      that length to be zero, decode only the canonical prefix, check the curve,
      and require byte-identical canonical re-encoding before restoring the zero
      suffix. Infinity is 00 followed by four zero bytes. Any other length,
      suffix, prefix, coordinate, curve failure, or re-encoding mismatch rejects.

  shard_sets:
    generator: [gen-0, gen-1, gen-2, gen-3, gen-4, gen-5, gen-6, gen-7]
    fixture: [fixture-0, fixture-1, fixture-2, fixture-3, fixture-4, fixture-5, fixture-6, fixture-7]
    work: [work-0, work-1, work-2, work-3, work-4, work-5, work-6, work-7]
    xof: [xof-0, xof-1, xof-2, xof-3, xof-4, xof-5, xof-6, xof-7]
    verify: [verify-0, verify-1, verify-2, verify-3, verify-4, verify-5, verify-6, verify-7]
    analysis: [analysis-0, analysis-1, analysis-2, analysis-3, analysis-4, analysis-5, analysis-6, analysis-7]
    archive: [archive-0]
    memory: [memory-0, memory-1, memory-2, memory-3, memory-4, memory-5, memory-6, memory-7]
    wiring: [wiring-0, wiring-1, wiring-2, wiring-3, wiring-4, wiring-5, wiring-6, wiring-7]
    rho: [rho-shard-0, rho-shard-1, rho-shard-2, rho-shard-3, rho-shard-4]
    bsgs: [bsgs-0, bsgs-1, bsgs-2, bsgs-3, bsgs-4]

  deterministic_event_partition:
    event_key_fields: [class_id, bits, consumer_id, event_index_within_consumer]
    consumer_order: [setup, treatment, control, candidate, rho, bsgs]
    event_order: bits_ascending_then_consumer_order_then_event_index_ascending
    shard_function: 'shard_set[(size_ordinal+global_event_index_within_class_and_size) mod shard_count]'
    shard_count: length_of_the_class_shard_set
    global_event_index: >-
      Concatenate the six consumer ranges in consumer_order. The first event is
      zero. A consumer's half-open interval begins at the sum of all preceding
      consumer counts and ends after its exact count. No hash, scheduler,
      process count, or observed result affects assignment.
    full_census_block_function: >-
      For class c and size b, q_c(b) is a block width, not a sample. Block j is
      the exact half-open event interval [j*q,min(n,(j+1)*q)). Every full block
      and the final residual block execute and are measured once. The residual
      is n mod q and is never inferred from a different prefix.
    block_to_shard_rule: events_retain_their_event_to_shard_assignment_inside_each_block
    one_prefix_extrapolation: forbidden
    unmeasured_residual: invalidates
    duplicate_or_missing_event_index: invalidates
    event_partition_choices_remaining: 0

