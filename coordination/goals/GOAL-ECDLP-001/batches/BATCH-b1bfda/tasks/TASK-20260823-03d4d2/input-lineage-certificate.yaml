record_type: input_lineage_certificate
schema_version: "1.0"
task_id: TASK-20260823-03d4d2
batch_id: BATCH-b1bfda
goal_id: GOAL-ECDLP-001
base_field: K = F_p
parameters:
  B: N^(1/5)
  n: Theta(B^2)
lineage:
  - stage: L0_public_occurrences
    object: five pairwise-disjoint signed coloured decks A1 through A5, each of size Theta(B), plus a target deck
    coefficients_live_in: K
    required_metadata: [deck_colour, occurrence_index, sign, target_kind]
  - stage: L1_leaf_parameters
    object: exactly B^2 constant-degree leaves P_ij(U,W)
    coefficients_live_in: K
    derived_from: L0_public_occurrences and complete elliptic addition-chart formulae
    required_metadata: [i, j, signed_occurrence_codes, chart_id, endpoint_tags]
  - stage: L2_shared_product
    object: H(U,W) = product_(i,j) P_ij(U,W)
    coefficients_live_in: K
    forbidden_materialization: dense bivariate coefficient rectangle up to B^4
  - stage: L3_T_residue
    object: H mod T in R_T[W], R_T = K[U]/(T)
    coefficients_live_in: R_T
    base_field_expansion: Theta(B) coordinates per residue coefficient times Theta(B^2) W direction equals Theta(B^3) K-coordinates
  - stage: L3_F_residue
    object: H mod F in R_F[W], R_F = K[U]/(F)
    coefficients_live_in: R_F
    base_field_expansion: Theta(B^3) K-coordinates
  - stage: L4_norms
    object: N_T=Res_U(T,H), N_F=Res_U(F,H)
    coefficients_live_in: K
    degree: Theta(B^3) each
    forbidden_materialization: coefficient vectors under the frozen gate
  - stage: L5_common_factor
    object: G=gcd(N_T,N_F)
    coefficients_live_in: K
    expected_degree: Theta(B)
    required_output: [coefficients, squarefree_components, multiplicities]
  - stage: L6_source_replay
    object: labelled signed preimages for factor-start, both transition pairs, target, sign, chart, and every local stratum
    coefficients_live_in: K plus discrete lineage labels
    required_output: occurrence-level rows and jets before deduplication and rank
masked_target_lineage:
  target: R_r = Q + [r]P
  fresh_input: r and the resulting signed target-deck occurrences
  forbidden_assumption: a target-dependent modulus already containing G_r
  frozen_fresh_budget: B^(5/4+o(1)) time and memory
coefficient_completeness:
  includes:
    - every K coefficient of output G
    - multiplicity of every irreducible or linear output factor
    - source marker codes and chart/local-parameter provenance
  excludes_as_insufficient:
    - roots without multiplicities
    - a squarefree factor without source labels
    - fixed jets with no reachable-image separation proof
    - conditional replay that assumes G while being charged as location
certificate_result: >-
  The first large object is Theta(B^3) K-coordinates for each audited standard
  representation. The original L1 leaf lineage remains the sole declared input
  boundary for a surviving direct transducer.
experiment_runs: 0

