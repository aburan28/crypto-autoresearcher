batch_id: BATCH-b1bfda
goal_id: GOAL-ECDLP-001
review_plan_id: REVIEW-PLAN-BATCH-b1bfda
parameters:
  base_field: K = F_p
  B: N^(1/5)
  n: Theta(B^2)
  deg_T: Theta(B)
  deg_F: Theta(B)
  leaf_count_H: exactly B^2
  leaf_degree: constant
  deg_N_T: Theta(B^3)
  deg_N_F: Theta(B^3)
  expected_deg_G: Theta(B)
inputs:
  - coefficients of T(U),F(U) in K[U]
  - coefficient tuples of every P_ij(U,W) in K[U,W]
  - public occurrence codes, signs, chart identifiers, and endpoint tags
targets:
  locator: coefficient-complete G=gcd(Res_U(T,H),Res_U(F,H)) with multiplicities
  replay: signed labelled source jets and unranking for every registered stratum
  campaign_bound: B^(9/4+o(1)) time and memory
  fresh_bound: B^(5/4+o(1)) time and memory
statement_for_review:
  id: RSO-B59-1
  text: >-
    In explicit unary coefficient, target-blind triangular quotient retaining
    the full W direction, primitive/Kronecker flattened, and full
    power-projection representations, the first coefficient-complete state
    before G is known has Theta(B^3) K-coordinates or operations.
scope_exclusions:
  - arbitrary arithmetic circuits
  - adaptive nonlinear sketches
  - direct recurrences on the reachable elliptic-product image
  - any global impossibility or lane-closure claim
review_questions:
  J1: Are the base-field types and coefficient lineage complete from leaf inputs to every audited representation?
  J2: Is Theta(B^3) the first unavoidable object in each named representation without assuming G?
  J3: Does the fixed-jet pair test only the stated generic-unary observation class, and are any broader inferences absent?
  J4: Are campaign, masked-target, preprocessing, memory, multiplicity, and source-replay costs fully charged with correct quantifier order?
  J5: Does the direct pre-elimination shared-leaf class remain a concrete nonempty escape interface rather than a restatement of the missing operation?
controls:
  - explicit unary coefficient input to shallow-GCD methods
  - fixed-jet pair (W^D,W^D) and (W^D,W^D+W^k) for k<D
  - nearby instance with G supplied to the conditional B^2 decoder
  - fresh-target preprocessing quantified before every admissible r
  - complete chart and Hasse-jet registry for source replay
blind_rederivation_quantity:
  name: K-coordinate dimension before G is known
  supplied_data_only:
    - deg T and deg F
    - W-direction retained from H
    - quotient degree q for each route
    - degrees of N_T,N_F,G
excluded_material:
  - producer derivations
  - source-audit conclusions
  - ranking or disposition
  - expected verdicts
  - runtime receipt

