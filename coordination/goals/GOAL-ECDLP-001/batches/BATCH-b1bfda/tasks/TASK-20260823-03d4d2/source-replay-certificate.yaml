  derived_multisets:
    X: R_t - A_(1,k)
    Y: A_(2,i) + A_(3,j)
    Z: A_(4,a) + A_(5,b)
  occurrences_each: M = B^2
  row_equation: x + y + z = O
  polynomial_identity:
    f_D: f_D(U)=product_(d in D)(U-d)
    convolution: C_(Y,Z)(U)=Res_V(f_Y(V),(-1)^M f_Z(-U-V))=product_(y,z)(U+y+z)
    common_factor: G_X=gcd(f_X,C_(Y,Z))
multiplicity_accounting:
  b_x: sum_(y+z=-x) m_Y(y)m_Z(z)
  ordinary_gcd_order: min(m_X(x), b_x)
  labelled_row_count: m_X(x) * b_x
  warning: ordinary GCD multiplicity is not the labelled source count
marker_interface:
  codes: public injective c_X,c_Y,c_Z in F_p, one field element per occurrence because p=B^(5+o(1))
  marked_leaf: L_(y,z)(U) + s_0 + c_Y(y)s_Y + c_Z(z)s_Z
  first_nonzero_local_hasse_form: J_x=u_x*product_(y+z=-x)(s_0+c_Y(y)s_Y+c_Z(z)s_Z)^(m_Y(y)m_Z(z))
  simple_fiber_decode:
    y_code: partial_sY(C)/partial_s0(C)=c_Y(y)
    z_code: partial_sZ(C)/partial_s0(C)=c_Z(z)
  multiple_fiber_decode: factor the leading homogeneous Hasse form, preserving exponents
  x_decode: apply the analogous marked form to f_X
  emission: Cartesian product of X occurrences with decoded YZ occurrence pairs; deduplicate labelled rows before rank
