theorem_label: RSO-B59-1
statement:
  setup:
    base_field: K = F_p
    scale: B = N^(1/5)
    selector_degree: n = Theta(B^2)
    inputs:
      - T(U), F(U) in K[U] with degrees Theta(B)
      - H(U,W) = product over exactly B^2 constant-degree P_ij(U,W)
    norms:
      N_T: Res_U(T(U),H(U,W)) in K[W]
      N_F: Res_U(F(U),H(U,W)) in K[W]
      degrees: Theta(B^3) each
    target: G(W) = gcd(N_T,N_F), with coefficients, multiplicities, and signed labelled all-strata replay
  proposition: >-
    Within the union of four audited representation classes--explicit unary
    coefficient vectors, target-blind triangular quotients retaining the full
    W direction, primitive/Kronecker flattened coordinate algebras, and full
    power-projection data--the first coefficient-complete state before G is
    known has Theta(B^3) K-coordinates or requires Theta(B^3) K-operations.
  representation_classes:
    - id: R_EXPLICIT
      boundary: materialize N_T or N_F, or supply their coefficient vectors to a GCD routine
      first_large_object: degree-Theta(B^3) unary coefficient vector
    - id: R_TRIANGULAR
      boundary: compute in K[U,W]/(T,C) or K[U,W]/(F,C) with public target-blind C
      first_large_object: dimension Theta(Bq); retaining q=Theta(B^2) costs Theta(B^3)
      circular_case: q=Theta(B) helps only with a proved G-divisible C, which already locates G
    - id: R_FLAT
      boundary: primitive-element or Kronecker flattening of the selector algebra
      first_large_object: Theta(B^3) K-coordinate algebra
    - id: R_POWER
      boundary: full power projection through W-degree Theta(B^2) over K[U]/(T) or K[U]/(F)
      first_large_object: Theta(B^3) emitted K-coordinates
  proof_outline:
    - The K-dimension of K[U]/(T) and K[U]/(F) is Theta(B).
    - H retains Theta(B^2) W-coordinates over either residue ring, so the tensor coordinate rectangle has Theta(B^3) K-slots.
    - Elimination produces unary norms of degree Theta(B^3), so coefficient-input GCD begins with Theta(B^3) scalar slots.
    - A triangular degree-q quotient has Theta(Bq) K-dimension; q=Theta(B^2) gives Theta(B^3), while q=Theta(B) is circular if required to contain unknown G.
    - Full power projection is linear observation of the same Theta(B) by Theta(B^2) rectangle and does not itself compute the nonlinear common factor.
  collision_control:
    statement: For k<D, pairs (W^D,W^D) and (W^D,W^D+W^k) agree modulo W^k but have gcd W^D and W^k.
    scope: fixed_low_jet_observations_of_generic_unary_pairs
    limitation: No claim that both pairs lie in the reachable elliptic norm image.
  cost_consequence:
    exposed_cost: B^(3+o(1)) = N^(0.6+o(1))
    campaign_gate: B^(9/4+o(1)) = N^(0.45+o(1))
    masked_target_gate: B^(5/4+o(1)) = N^(0.25+o(1))
    gap_vs_campaign_in_N_exponent: 0.15
    gap_vs_rho_in_N_exponent: 0.10
  exact_boundary: >-
    This proposition is a coordinate audit of named representations, not an
    arithmetic-circuit lower bound. It leaves open direct algorithms exploiting
    algebraic dependencies in the B^2 shared elliptic leaves.
surviving_escape:
  class: direct_pre_elimination_shared_leaf_transducer
  typed_signature: >-
    (K, coeff(T), coeff(F), [(coeff(P_ij), sign_ij, chart_ij,
    occurrence_codes_ij)]_(i,j)) -> (coeff(G), multiplicities,
    signed_labelled_source_jets)
  discriminating_requirements:
    - no explicit N_T or N_F coefficient vector
    - no fixed selector algebra of K-dimension Omega(B^3)
    - no modulus whose construction assumes G or its roots
    - proof of separation on the reachable elliptic-product image
    - all preprocessing and source replay inside frozen exponents
