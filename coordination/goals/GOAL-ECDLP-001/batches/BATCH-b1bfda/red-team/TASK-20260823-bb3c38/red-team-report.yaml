        one genuinely stronger proved row may support a successor record.
    - id: CF-3-reachable-state-collision
      target: J5-B3-matched-circuit-control
      cost: proof_first__no_experiment_until_state_exists
      test: >-
        First state the proposed direct transducer's exact synopsis. Then either
        prove it separates the complete reachable elliptic marked-leaf image or
        construct two reachable instances with equal synopsis and different G
        or labelled replay. The F_1009 affine witness remains the generic nearby
        control.
      expected_decisive_outcome: >-
        A reachable collision falsifies that synopsis; a proved separator plus
        recurrence is the minimum reason to continue.
    - id: CF-4-Pareto-table
      target: J5-B2-Pareto-axes
      cost: static_cost_ledger
      test: >-
        For every named route, separate total operations/traffic from peak live
        memory and list preprocessing, advice/data, query, retries, parallel
        work, output fibres, verification, and multi-target amortization.
      expected_decisive_outcome: >-
        Restore checked_memory or checked_data_queries only if every row has a
        proved bound; otherwise set false/unknown and use dominated_by n/a.
