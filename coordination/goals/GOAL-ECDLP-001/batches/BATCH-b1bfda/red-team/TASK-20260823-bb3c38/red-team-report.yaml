        G: W^2-W-2
      matched_observation: >-
        Both instances have identical selector degree, leaf count, norm degree,
        common-factor degree, and first Newton sum 1, but different G.
      generalization: >-
        Over a sufficiently large field containing B-th roots of unity, choose
        distinct split squarefree factors W^B-a and W^B-b. Their first B-1
        Newton sums agree. For each desired root, two generic affine leaves can
        place it once on a T selector root and once on an F selector root;
        remaining leaves are chosen outside the finite set of forbidden
        cross-collisions. Thus matched generic product-circuit shape and a
        fixed short symmetric transcript do not identify G.
      limitation: >-
        The explicit object is not claimed to lie in the reachable elliptic
        complete-chart image. It is the required nearby/random product-circuit
        control. A positive elliptic claim needs a curve-specific identity or
        reachable-image separation theorem, neither of which is supplied.

    PTM-4-supplied-source-table:
      declared_known_false_conclusion: >-
        A table mapping common roots to all source labels is a sub-rho decoder.
      declared_required_signature: >-
        Materialized source advice is rejected at or above the incumbent before
        any decoder gain.
      result: control_breaks_as_stated
      counter_signature: >-
        The producer's own conditional interface reduces marked data modulo
        supplied G in B^(2+o(1))=N^(0.4+o(1)) represented dimension. A supplied
        root-to-label map may likewise have query/decoding cost proportional to
        its payload, below rho on simple fibres. It is still not a locator and
        its construction may be target-trained, B^3, B^4, or output-large.
      exact_error: >-
        The declared control confuses cheap conditional decoding with cheap
        construction and location. No universal at-or-above-rho bound follows
        from the supplied-table premise.
      corrected_required_signature: >-
        Record whether the table is target-independent; charge its construction,
        stored advice/data, queries, collision-fibre output, and masked-target
        rebuilds; reject it as circular if its keys or contents require G. Do
        not reject a genuinely B^2 conditional decoder merely for being a
        decoder.

