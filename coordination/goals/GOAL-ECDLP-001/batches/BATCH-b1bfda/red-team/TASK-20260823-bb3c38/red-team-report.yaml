  joint_reviews:
    J4-circularity-hidden-preprocessing-and-literature-applicability:
      verdict: breaks
      holds:
        - >-
          The degree-B query-modulus shortcut is explicitly recognized as
          circular unless the modulus is built from T, F, H without depending
          on G or its roots.
        - >-
          The masked-target quantifier order is correct: one target-independent
          state S must precede every mask r; constructing S_r after seeing r or
          G_r is correctly forbidden.
        - >-
          The packet does not claim a hidden DLP, supplied factor, source table,
          shallow-GCD black box, or generic SLP solver as a positive locator.
        - >-
          Explicit coefficient-vector GCD, triangular quotient, primitive
          flattening, and full power-projection interfaces are correctly charged
          by their degree or represented coordinate dimension on the named
          routes.
      breaks:
        - id: J4-B1-PTM4-semantics
          severity: load_bearing
          finding: >-
            PTM-4 declares known-false the conclusion that a table mapping
            common roots to all source labels is a sub-rho decoder and demands
            rejection because materialized source advice is at or above the
            incumbent. This conflates three different claims: decoding after G
            is supplied, constructing the source data, and locating G. The
            packet itself states a conditional marker decoder given G of
            B^(2+o(1))=N^(0.4+o(1)), below rho B^(5/2). A supplied answer-bearing
            table is not an end-to-end algorithm, but it can plainly be a cheap
            decoder. Its invalidity as evidence comes from target dependence,
            uncharged construction/advice, and failure to locate G, not a
            universal lower bound on decoder cost.
          impact: >-
            One mandatory proves-too-much control cannot produce its declared
            signature honestly. It must be corrected before review-plan
            composition treats all four controls as passed.
          corrected_control: >-
            A supplied or target-trained table containing G's roots or their
            complete source fibres is not an end-to-end locator or source
            construction. Separate preprocessing, advice/data, query, output,
            and target-dependence charges; reject the route if building the
            table depends on G or exceeds a frozen gate.
        - id: J4-B2-withdrawn-source
          severity: material_source_correction
          finding: >-
            arXiv:2511.05035 is withdrawn. The current arXiv record reports an
            anonymous-referee gap in Theorems 6.2 and 6.4 and provides no current
            PDF. It is not an admissible theorem control for near-linear border
            modular composition or GCD.
          impact: >-
            CIT-AKR-2025 must remain a historical unverified pointer or be
            removed/replaced. It cannot support applicability or nearest-work
            classification. Because the producer marked it recalled and
            unverified, no supported producer conclusion is retroactively
            attributed to it.
      circularity_audit:
        answer_containing_degree_B_modulus:
          result: correctly_rejected
          reason: >-
            Completeness requires C divisible by unknown G; supplying such C
            moves the missing locator into C's construction.
        target_trained_preprocessing:
          result: correctly_rejected
          reason: >-
            The packet requires exists S before forall r and forbids S_r built
            after observing the target or factor.
        lucky_target_or_average_mask:
          result: correctly_rejected
          reason: >-
            The surviving signature requires every admissible r unless an
            explicit success/retry model is charged.
        hidden_DLP_or_factor_logs:
          result: no_positive_use_found
          reason: >-
            No claimed locator reads scalar logs. Downstream factor logs and
            descent remain absent rather than silently credited.
        supplied_source_labels:
          result: conditional_interface_only
          reason: >-
            Public occurrence codes and complete chart data are allowed inputs;
            a target-trained table of actual common roots and fibres is not.
            The packet keeps global all-strata construction unsupplied.
        uncharged_selector_algebra:
          result: correctly_exposed_on_named_routes
          reason: >-
            The explicit, q=B^2 triangular, primitive/Kronecker, and full-output
            power-projection routes expose B^3 coordinates, traffic, or work.
      conclusion: >-
        The packet's own locator/circularity boundary is mostly sound, but J4
        breaks because a mandatory control asserts the wrong decoder-cost
        proposition and because the literature table retains a withdrawn item
        that cannot be used as a current theorem control.

    J5-collision-controls-novelty-pareto-and-steering:
      verdict: breaks
      holds:
        - >-
          Novelty is labeled unverified, no realized attack is claimed, and the
          direct pre-elimination shared-leaf transducer remains open.
        - >-
          The fixed-low-jet pair is correctly scoped to generic unary pairs and
          is not promoted to a reachable elliptic-image lower bound.
        - >-
          The producer's select-none recommendation is explicitly limited to
          the B59 requested recurrence and performs no official status change.
      breaks:
        - id: J5-B1-semantic-duplicate
          severity: load_bearing
          finding: >-
            The proposal's non_duplicate_rationale does not survive direct
            comparison with the complete IDEA-121 chain. The standard B^3
            coordinate lift, q=B^2 triangular dimension, q=B circularity,
            primitive/Kronecker flattening, full power-projection width,
            fixed-jet collision, B^2 conditional decoder given G, B^3 post-hoc
            replay, all-strata marker obligations, and surviving direct
            product-circuit locator were all already archived.
          impact: >-
            The B59 packet does not reduce the residual uncertainty named at
            opening. It may be retained as a schema-complete consolidation or
            independent reproduction, but not as a mechanism-new obstruction
            without isolating a statement absent from the predecessor.
        - id: J5-B2-Pareto-axes
          severity: load_bearing
          finding: >-
            The packet sets dominated_by to null and declares time, memory,
            and data_queries checked without an axis-complete comparison.
            B^3 coordinate exposure proves full input/output traffic or work
            for the specified interface; it does not by itself prove B^3 peak
            live memory. The predecessor expressly says streaming may reduce
            peak state. Advice/data, preprocessing/query separation, retry,
            output fibres, parallel work, and multi-target amortization are not
            tabulated for every route.
          impact: >-
            The inventor protocol's Pareto gate is unmet. The correct value for
            a record that claims no attack is dominated_by: "n/a (no result
            claimed)", with no realized SOTA delta.
        - id: J5-B3-matched-circuit-control
          severity: material
          finding: >-
            The producer reused the predecessor's generic fixed-jet collision
            but did not build the review plan's matched product-circuit control.
            The explicit static B=2 construction below shows that selector
            degree, B^2 affine leaves, norm degree B^3, common-factor degree B,
            and one short Newton moment can match while G differs. Hence shape
            and a short symmetric synopsis do not identify G.
          impact: >-
            Any future direct locator must name its actual state and prove a
            reachable elliptic-image separator. No such state or recurrence is
            supplied here, so the packet makes no curve-specific gain.
        - id: J5-B4-steering-information-gain
          severity: process_concern
          finding: >-
            The single-winner rerank names two alternatives but gives no
            quantitative time, memory, data/advice, and information-gain rows
            for them. The selected producer then restates standard routes that
            the opening batch itself listed as closed, rather than attacking
            the specialized residual recurrence. This makes the final-budget
            select-none recommendation low-information.
          impact: >-
            This supports an auditable concern about insufficient rerank and
            duplication, not a finding of deliberate suppression. No stronger
            concrete alternative is demonstrated, and neither the direct
            transducer nor ranks 2 and 3 may be closed or deprioritized on this
            packet alone.
      conclusion: >-
        J5 breaks on semantic duplication and Pareto fabrication, with an
        explicit matched-circuit non-identifiability control and a narrower
        process concern about final-budget steering. The direct specialized
        locator remains open.

  proves_too_much_controls:
    all_declared_controls_run_statically: true
    experiment_runs: 0
    PTM-1-explicit-norm-input:
      known_false_conclusion: >-
        An algorithm receiving explicit degree-B^3 norm coefficients is an
        output-sensitive B^2-leaf locator.
      static_object: >-
        Supply coeff(N_T), coeff(N_F) of degree Theta(B^3) to any downstream
        GCD theorem and omit their construction from the advertised locator.
      observed_signature: >-
        Reading or writing the explicit coefficient vectors already costs
        Omega(B^3) base-field traffic, before GCD or source replay.
      required_signature_met: true
      result: fires_and_rejects_control
      implication: >-
        Andrews-Wigderson and Bhattacharjee et al. begin at explicit univariate
        coefficient inputs and do not construct the selector norms from H.

    PTM-2-answer-containing-query:
      known_false_conclusion: >-
        A supplied degree-B query modulus divisible by unknown G locates G.
      static_object: >-
        Give C(W)=G(W)D(W) and compute gcd(C,N_T mod C,N_F mod C), pricing only
        the quotient computation.
      observed_signature: >-
        The result can only recover common roots already placed in C; building
        a complete degree-B C without G is the missing locator.
      required_signature_met: true
      result: fires_and_rejects_control
      quantifier_check: >-
        A target-independent C chosen before G has no completeness theorem;
        choosing C after G reverses the required exists-S then forall-target
        order.

    PTM-3-matched-random-product-circuit:
      known_false_conclusion: >-
        Leaf count and low expected output degree alone guarantee complete
        common-root recovery.
      result: control_constructed_and_generic_shape_rejected
      required_signature_met: true_only_via_no_curve_specific_gain_claim
      field: K=F_1009
      parameters:
