  literature_applicability:
    retrieval_date: "2026-08-23"
    retrieval_boundary: >-
      Primary sources were opened directly for theorem-input and status checks.
      Retrieval found no source that consumes T,F and the shared B^2-leaf H and
      emits the common factor plus complete source replay inside the frozen
      gates. This is a current nearest-work boundary, not proof of novelty or
      nonexistence.
    sources:
      - citation_id: CIT-AW-2024
        provenance: retrieved
        url: https://arxiv.org/html/2404.10839
        finding: >-
          The univariate results describe input and output polynomials by their
          coefficients and count degrees in I/O size. The paper also has a
          multivariate circuit-GCD extension, but that begins with circuits for
          the input polynomials; it does not construct the implicit unary norm
          circuits or a common-norm/source locator from H.
        applicability: explicit_coefficient_control_valid_but_not_locator
      - citation_id: CIT-BKRRSS-2025
        provenance: retrieved
        url: https://arxiv.org/html/2506.23220
        finding: >-
          Theorem 1.1 gives polynomial-size constant-depth piecewise circuits
          for two degree-n univariates over sufficiently large fields, and the
          formal GCD statement evaluates circuit families on the coefficient
          vectors. Polynomial size in n is neither near-linear work nor a
          constructor for degree-B^3 norms from the shared leaf circuit.
        applicability: explicit_coefficient_degree_sensitive_control_only
      - citation_id: CIT-KRSV-2024
        provenance: retrieved
        url: https://arxiv.org/html/2403.01965
        finding: >-
          Theorem 1.1 takes a constant-depth circuit over Q together with input
          degree D and desired factor-circuit size m, runs in subexponential
          parameter-dependent time, and emits a list that may contain spurious
          or ill-defined circuits. It neither works in the required finite-field
          interface as stated nor supplies a complete common-norm locator.
        applicability: factor_list_control_not_solution
      - citation_id: CIT-AKR-2025
        provenance: retrieved
        url: https://arxiv.org/abs/2511.05035
        finding: >-
          The record is withdrawn and reports a proof gap in Theorems 6.2 and
          6.4. Its abstract also starts from coefficient vectors of univariate
          modular-composition inputs over infinite fields.
        applicability: withdrawn_unusable_as_theorem_control
      - citation_id: CIT-GHMMMP
        provenance: retrieved
        url: https://arxiv.org/abs/alg-geom/9609005
        finding: >-
          Input length includes variable count, equation degrees, and SLP size,
          while complexity is polynomial also in a geometric-degree parameter.
          A small final common factor does not erase the degrees of the supplied
          systems or give an output-sensitive overdetermined locator.
        applicability: degree_and_geometric_degree_sensitive_control
      - citation_id: CIT-KALTOFEN-1988
        provenance: retrieved
        url: https://kaltofen.math.ncsu.edu/bibliography/88/Ka88_jacm.pdf
        finding: >-
          The randomized SLP GCD algorithm takes SLP representations plus total
          degree bounds and has runtime polynomial in binary input size and
          input degrees supplied in unary. Applying it still requires norm SLPs
          and exposes degree B^3 as a parameter.
        applicability: generic_SLP_control_not_common_norm_constructor
      - citation_id: CIT-KU
        provenance: retrieved
        url: https://users.cms.caltech.edu/~umans/papers/KU08-final.pdf
        finding: >-
          Kedlaya-Umans addresses degree-n univariate modular composition and
          finite-field polynomial factorization. It does not state the desired
          bivariate product-circuit common-norm/source reduction.
        applicability: dense_univariate_modular_composition_control
      - citation_id: CIT-PS
        provenance: retrieved
        url: https://www.fil.univ-lille.fr/~poteaux/fichiers/trigset.pdf
        finding: >-
          The triangular-set quotient has explicit vector-space dimension delta;
          modular composition and power projection are near-linear in represented
          input/output dimensions. This supports charging the B by B^2 quotient
          as B^3 traffic/work, not an arbitrary-circuit memory lower bound.
        applicability: supports_representation_dimension_boundary
      - citation_id: CIT-MS
        provenance: retrieved
        url: https://arxiv.org/abs/1609.04259
        finding: >-
          The truncated-resultant algorithm takes bivariate P,Q of degree at
          most d and computes k coefficients in soft-O(kd) operations. It is
          explicitly degree- and truncation-sensitive; a fixed local truncation
          is not an unknown-root locator.
        applicability: degree_sensitive_truncation_control
      - citation_id: CIT-NSSV-2021
        provenance: retrieved
        url: https://arxiv.org/abs/2110.08354
        finding: >-
          The algorithm composes two degree-n univariates modulo a third with
          algebraic-relation matrices and randomized generic reduction. It does
          not operate on implicit common norms or return source labels.
        applicability: univariate_modular_composition_control
      - citation_id: CIT-NSSV-2026
        provenance: retrieved
        url: https://arxiv.org/abs/2601.17422
        finding: >-
          The newer algorithm remains degree-n univariate modular composition,
          under genericity assumptions, with soft-O(n^((omega+3)/4)) operations.
          It is not an output-sensitive common-norm locator.
        applicability: univariate_degree_and_genericity_control
      - citation_id: CIT-SEMAEV
        provenance: retrieved
        url: https://eprint.iacr.org/2004/031.pdf
        finding: >-
          Semaev constructs elliptic summation-polynomial equations and makes
          the faster-DLP conclusion conditional on an algorithm for solving the
          resulting equations. It supplies no shared common-norm reporter or
          source decoder.
        applicability: elliptic_equation_lineage_only

