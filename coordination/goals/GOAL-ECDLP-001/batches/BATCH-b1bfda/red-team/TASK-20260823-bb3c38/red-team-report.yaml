red_team_report:
  schema: crypto.autoresearch.red_team_report.v1
  id: RT-20260823-bb3c38
  task_id: TASK-20260823-bb3c38
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-b1bfda
  role: red-team
  recorded_at: "2026-08-23"
  overall_verdict: REVISE
  verdict_scope: task_disposition_only_not_whole_claim_composition
  claim_under_review: >-
    Whether the frozen zero-run packet survives J4 circularity, hidden
    preprocessing, source-advice, and literature-applicability attacks and J5
    collision, novelty, Pareto, and steering attacks. This report neither owns
    nor composes J1 through J3 and reviews no implementation, experiment,
    empirical result, hypothesis transition, lane closure, ECDLP improvement,
    or breakthrough claim.

  executive_summary:
    joint_verdicts:
      J4-circularity-hidden-preprocessing-and-literature-applicability: breaks
      J5-collision-controls-novelty-pareto-and-steering: breaks
    disposition_recommendation: REVISE
    narrow_supported_result: >-
      The packet correctly preserves a representation-scoped B^3
      input/output-traffic or operation obstruction for the four named
      standard representations and correctly leaves the direct shared-leaf
      transducer open. It does not provide a locator recurrence or source-faithful
      ECDLP algorithm.
    load_bearing_breaks:
      - >-
        PTM-4 is not a valid known-false control as stated. A supplied mapping
        from already-known common roots to source labels is precisely a decoder,
        and the packet itself prices a conditional decoder given G at B^2,
        below rho B^(5/2). What must be rejected is crediting answer-bearing or
        target-trained advice as an end-to-end construction or locator, not a
        universal claim that decoder work is at or above the incumbent.
      - >-
        The packet's claimed non-duplicate contribution is not discriminated
        from the committed IDEA-121 predecessor chain. The B^3 coefficient,
        triangular, flattening, power-projection, post-hoc replay, fixed-jet,
        conditional-decoder, and direct-transducer boundaries were already
        stated in ku_circuit_reduction_v2.md and the translated-product V3
        correction. The new packet is useful consolidation, not a new
        obstruction theorem unless one genuinely new lemma is isolated.
      - >-
        dominated_by: null and the asserted memory/data checks are unsupported.
        Coordinate count, total traffic, field operations, and peak live memory
        are not interchangeable; the predecessor explicitly notes that
        streaming may lower peak state. No route-by-route preprocessing,
        advice/data, retry, output, parallel, or multi-target ledger proves all
        Pareto axes checked.
      - >-
        The AKR 2025 reference is withdrawn after a reported proof gap in
        Theorems 6.2 and 6.4. It cannot remain a usable theorem control. The
        producer marked every external citation recalled and unverified, so
        this is a required source correction rather than evidence of fabricated
        support.
    preserved_open_class: direct_pre_elimination_shared_leaf_transducer
    no_general_lower_bound: true

  objections:
    - id: J4-B1-PTM4-semantics
      joint: J4-circularity-hidden-preprocessing-and-literature-applicability
      verdict: breaks
      summary: >-
        PTM-4 confuses conditional decoding with construction and location; its
        universal at-or-above-rho decoder signature is contradicted by the
        packet's own B^2 decoder given G.
    - id: J4-B2-withdrawn-source
      joint: J4-circularity-hidden-preprocessing-and-literature-applicability
      verdict: breaks
      summary: >-
        AKR arXiv:2511.05035 is withdrawn for a reported proof gap and cannot be
        used as a current theorem control.
    - id: J5-B1-semantic-duplicate
      joint: J5-collision-controls-novelty-pareto-and-steering
      verdict: breaks
      summary: >-
        The B59 obstruction content is semantically contained in the archived
        IDEA-121 V2/V3 chain; no new recurrence, separator, or obstruction lemma
        is isolated.
    - id: J5-B2-Pareto-axes
      joint: J5-collision-controls-novelty-pareto-and-steering
      verdict: breaks
      summary: >-
        dominated_by null and checked memory/data axes are unsupported because
        traffic, operations, peak live state, advice, and queries were not
        separated route by route.
    - id: J5-B3-matched-circuit-control
      joint: J5-collision-controls-novelty-pareto-and-steering
      verdict: breaks
      summary: >-
        A matched F_1009 product-circuit pair has the same shape and short
        Newton synopsis but different common factors; no curve-specific
        separator is supplied.
    - id: J5-B4-steering-information-gain
      joint: J5-collision-controls-novelty-pareto-and-steering
      verdict: breaks
      summary: >-
        The final-budget rerank lacks an all-axis information-gain table, and
        the selected packet repeats routes already closed at opening.

  required_controls:
    - id: PTM-1-explicit-norm-input
      outcome: fires_and_rejects_control
    - id: PTM-2-answer-containing-query
      outcome: fires_and_rejects_control
    - id: PTM-3-matched-random-product-circuit
      outcome: explicit_static_collision_constructed
    - id: PTM-4-supplied-source-table
      outcome: declared_control_breaks_and_requires_correction

  counterexample_or_mutation: >-
    Over F_1009 with B=2, T=U(U-1), F=(U-2)(U-4), and four affine
    leaves W-phi_i(U), circuit A with phi=(U,U/2-1,10U+10,10U+100)
    has G_A=W^2-W, while circuit B with
    phi=(2-3U,5-3U/2,20U+200,20U+500) has G_B=W^2-W-2. Both have
    selector degree 2, four leaves, degree-8 norms, degree-2 common factor,
    and first Newton sum 1. Thus generic shape and the short synopsis do not
    identify G. Reachable elliptic membership is deliberately not claimed.

  baseline_comparison: >-
    Pollard rho remains the realized single-target N^(0.5+o(1))-time,
    N^(0+o(1))-state frontier and BSGS the N^(0.5+o(1))-time-and-memory
    point. The packet supplies no realized solver. Named explicit interfaces
    expose N^(0.6+o(1)) traffic/work; the N^(0.4+o(1)) decoder is conditional
    on supplied G; the direct locator has unknown time, memory, data, retry,
    replay, and descent axes.

  heuristic_challenges:
    - >-
      Expected degree Theta(B) does not imply an output-sensitive locator;
      completeness on the reachable elliptic norm image remains unproved.
    - >-
      Special dependencies among elliptic leaves may invalidate transfer from
      the generic matched-circuit control, while their existence alone cannot
      be credited without an explicit separating identity.
    - >-
      No success distribution, retry law, collision-fibre bound, or
      multi-target amortization is supplied for the surviving escape class.

  cost_model_challenges:
    - coordinate_count_is_not_peak_live_memory
    - preprocessing_advice_query_and_output_are_not_separated
    - conditional_decoder_given_G_is_not_an_end_to_end_locator_point
    - retries_parallel_work_multitarget_and_collision_output_are_unknown
    - dominated_by_null_is_not_supported_across_all_Pareto_axes

  reduction_and_scope_challenges:
    - >-
      Explicit-coefficient and degree-sensitive theorems begin after the
      forbidden norm/quotient representation and do not construct it from H.
    - >-
      The representation-scoped B^3 result does not transfer to arbitrary
      circuits, adaptive nonlinear sketches, or the direct shared-leaf class.
    - >-
      Conditional source recovery given G may be sub-rho while remaining
      irrelevant to location; supplied answer-bearing advice must be rejected
      for circularity rather than by an invented universal decoder lower bound.
    - >-
      The B59 select-none recommendation cannot close IDEA-121 or any
      alternative route family.

  proof_architecture_challenges:
    - >-
      Baseline reproduction holds for the named B by B^2 represented rectangle,
      but the packet supplies no recurrence for the actual residual method.
    - >-
      The producer's fixed-jet observation collision is generic and duplicated;
      the required matched product-circuit collision was absent until this
      review and reachable-image separation remains open.
    - >-
      Quantifier order correctly forbids target-trained S_r, but PTM-4's own
      quantifiers and cost signature are malformed.
    - >-
      The method ceiling is only a ceiling for four representations and cannot
      support a broader locator impossibility or lane closure.

  narrowest_supported_statement: >-
    For explicit unary coefficient vectors, target-blind q=B^2 triangular
    quotients, primitive/Kronecker flattenings, and full power-projection
    output, the frozen B by B^2 interface exposes Theta(B^3) base-field
    traffic or operations before G. This is an already-archived,
    representation-scoped zero-run obstruction. It says nothing negative
    about all direct pre-elimination shared-leaf algorithms, and supplies no
    locator, source-complete attack, or ECDLP improvement.

  next_concrete_action: >-
    Before any further scientific admission, the Coordinator should correct
    PTM-4, reclassify or isolate the B59 semantic delta, replace the Pareto
    block with an axis-complete n/a-no-result ledger, and require the next
    proposed direct state to face the explicit matched product-circuit control
    plus a reachable-elliptic separation proof. No experiment or implementation
    is authorized by this report.

