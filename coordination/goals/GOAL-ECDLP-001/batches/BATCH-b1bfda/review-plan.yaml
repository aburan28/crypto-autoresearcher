review_plan:
  schema: crypto.autoresearch.review_plan.v1
  id: REVIEW-PLAN-BATCH-b1bfda
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-b1bfda
  recorded_at: '2026-08-23'
  coordinator_prior: >-
    I expect the residual specialized locator to fail unless the producer finds
    a genuinely new recurrence. The most likely break is a degree-B^3
    represented object, an answer-containing query modulus, or a cubic
    post-hoc source inversion. I assign low confidence that a complete
    recurrence survives and zero confidence that this zero-run batch itself
    establishes an ECDLP improvement. A useful negative outcome is the
    narrowest proved point where cubic traffic becomes unavoidable for one
    named recurrence family.
  claim_under_review: >-
    Whether the frozen packet supplies a complete non-circular output-sensitive
    common-factor locator and exact all-strata source replay worthy of a later
    implementation-design batch, or a correctly scoped obstruction. No attack,
    implementation, empirical result, scientific promotion, closure, or
    breakthrough is under review.
  joints:
    - id: J1-locator-algebra-and-coefficient-completeness
      owner_task_id: TASK-20260823-2ec8ce
      owner_role: reviewer
      attack_plan: >-
        Verify every algebraic identity and recurrence coefficient from the
        frozen producer packet. Trace completeness from T, F, and the B^2
        leaves to G; check multiplicity and squarefree claims; and construct a
        same-transcript/different-G counterexample if any coefficient family is
        omitted. Confirm that no degree-B^3 norm or equivalent selector algebra
        is silently materialized.
      expected_break: >-
        Coefficient completeness will require an omitted cubic object or the
        recurrence will not separate two admissible common factors.
    - id: J2-multiplicity-source-and-all-strata-replay
      owner_task_id: TASK-20260823-2ec8ce
      owner_role: reviewer
      attack_plan: >-
        Verify multiplicities, signed target/start/transition labels, tangent,
        vertical, infinity, nonreduced, and repeated-factor strata and exact
        elliptic replay. Construct same-factor/different-source collisions and
        require the certificate to distinguish them without a source table or
        hidden DLP.
      expected_break: >-
        Source inversion will restore a B^3 pair-deck scan or omit an
        exceptional stratum.
    - id: J3-blind-input-lineage-cost-and-baseline-rederivation
      owner_task_id: TASK-20260823-26ebbb
      owner_role: validator
      attack_plan: >-
        Read only the frozen blind statement packet and permitted baseline and
        predecessor gates. Independently derive dimensions and costs of every
        represented algebra, coefficient vector, query object, output object,
        replay object, relation/rank system, and masked-target stage. Reproduce
        rho and parameterized BSGS, parallel work, retries, data/query use, and
        multi-target accounting. Never read producer derivations or reports.
      expected_break: >-
        A hidden B factor, cubic represented algebra, or uncharged retry,
        output, replay, or masked-target term will cross rho.
    - id: J4-circularity-hidden-preprocessing-and-literature-applicability
      owner_task_id: TASK-20260823-bb3c38
      owner_role: red-team
      attack_plan: >-
        Attack answer-containing moduli, target-trained preprocessing, supplied
        source labels, hidden DLP, lucky-target quantifiers, and uncharged
        selector-algebra operations. Verify whether cited GCD, factorization,
        modular-composition, and elimination theorems take explicit coefficient
        vectors or degree-sensitive inputs.
      expected_break: >-
        A circular locator or explicit B^3 input will be credited as a fast
        black box.
    - id: J5-collision-controls-novelty-pareto-and-steering
      owner_task_id: TASK-20260823-bb3c38
      owner_role: red-team
      attack_plan: >-
        Run every proves-too-much control, construct matched short-transcript
        circuits with different common factors, compare against the complete
        IDEA-121 predecessor chain and direct primary sources, and reconstruct
        realized versus conditional Pareto rows on every cost axis. Audit
        whether the single-winner rerank suppressed a stronger concrete route.
      expected_break: >-
        Novelty will remain unverified, a synopsis collision will break the
        locator, or a conditional Pareto claim will rely on an unknown axis.
  blindness:
    reviewers_may_read_sibling_reports: false
    lifted_for: []
    validator_allowed_paths:
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-b1bfda/review-plan.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-b1bfda/archives/TASK-20260823-6ef40d/snapshot-receipt.json
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-b1bfda/tasks/TASK-20260823-03d4d2/blind-statement-packet.yaml
      - docs/target-result-profile.md
      - ideas/artifacts/ECDLP-IDEA-121/ku_common_norm_reduction_gate.md
      - ideas/artifacts/ECDLP-IDEA-121/ku_circuit_reduction_v2.md
      - ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-90fff7.yaml
    reviewer_allowed_scope: full frozen producer snapshot except Validator and Red Team reports
    red_team_allowed_scope: full frozen producer snapshot except Reviewer and Validator reports
  blind_rederivation:
    task_id: TASK-20260823-26ebbb
    statement_path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-b1bfda/tasks/TASK-20260823-03d4d2/blind-statement-packet.yaml
    blind_from:
      - ledger/proposals/IDEA-20260823-62518d.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-b1bfda/tasks/TASK-20260823-03d4d2/locator-theorem.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-b1bfda/tasks/TASK-20260823-03d4d2/input-lineage-certificate.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-b1bfda/tasks/TASK-20260823-03d4d2/source-replay-certificate.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-b1bfda/tasks/TASK-20260823-03d4d2/masked-target-recurrence.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-b1bfda/tasks/TASK-20260823-03d4d2/proof-search-map.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-b1bfda/tasks/TASK-20260823-03d4d2/source-audit.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-b1bfda/tasks/TASK-20260823-03d4d2/disposition-report.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-b1bfda/tasks/TASK-20260823-03d4d2/runtime-session-receipt.json
    rule: >-
      The Validator never reads any blind_from path before or after deriving.
      It may not call aggregate collaboration status or messaging tools. The
      task ends after writing its report and receipt. Reviewer and Red Team
      verify producer semantics and source bindings.
  proves_too_much_controls:
    - id: PTM-1-explicit-norm-input
      known_false_conclusion: An algorithm on explicit degree-B^3 norm coefficients is an output-sensitive B^2-leaf locator.
      required_signature: The cost model charges at least B^3 input traffic and rejects this control before any downstream gain.
    - id: PTM-2-answer-containing-query
      known_false_conclusion: A supplied degree-B query modulus divisible by unknown G constitutes location of G.
      required_signature: Every query object is built from T, F, and H alone and this control fails as circular.
    - id: PTM-3-matched-random-product-circuit
      known_false_conclusion: Leaf count and low expected output degree alone guarantee complete common-root recovery.
      required_signature: The mechanism identifies a curve-specific identity absent from the matched random circuit, or makes no curve-specific gain claim.
    - id: PTM-4-supplied-source-table
      known_false_conclusion: A table mapping common roots to all source labels is a sub-rho decoder.
      required_signature: Materialized source advice is rejected at or above the incumbent before any decoder gain.
  composition_rule: >-
    The Coordinator composes J1 through J5 only after all three reports are
    terminal, strict-parse, hash-bind to the snapshot, attest to no sibling
    read, and check_review_independence passes. A theorem candidate requires
    every joint to hold. Any break forces REVISE, REJECT, or a narrower
    obstruction; a static PASS never authorizes implementation in this batch.
  authority_boundary: >-
    No review authorizes implementation, execution, a hypothesis or experiment
    status change, evidence promotion, closure, or a breakthrough. Any actual
    ECDLP claim requires later proof/empirical evidence satisfying C1-C18 and
    another claim-specific review-breakthrough/max round.
