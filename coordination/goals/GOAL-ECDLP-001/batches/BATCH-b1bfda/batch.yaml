objective: >-
  Decide one exact residual question from ECDLP-IDEA-121: whether a specialized
  nonlinear algorithm can locate the expected degree-B common factor directly
  from one shared B^2-leaf bivariate product circuit and two degree-B selectors,
  without constructing either degree-B^3 norm, exposing a cubic selector
  algebra, assuming a query modulus containing the answer, or hiding source
  recovery. Produce a theorem/proof-search packet or the narrowest scoped
  obstruction, with complete end-to-end cost accounting and zero code or runs.

coordinator_rerank:
  winner: ECDLP-IDEA-121 specialized product-circuit common-factor locator
  ranked_alternatives:
    - rank: 1
      route: specialized output-sensitive product-circuit common-factor locator
      reason: >-
        It has the narrowest already-frozen public input/output interface and
        attacks the missing non-circular target locator directly. The input is
        B^2 leaves, the expected output is degree B, and the conditional source
        replay given the factor is B^2; only the nonlinear locator remains.
    - rank: 2
      route: randomized or multivalued target-initializable correspondence
      reason: >-
        It escapes deterministic prime-cycle factor rigidity, but no concrete
        elliptic correspondence yet supplies both direct target initialization
        and a fully charged output-sensitive global locator.
    - rank: 3
      route: target-batched non-time-homogeneous algebraic sketch with list recovery
      reason: >-
        It avoids the time-homogeneous lemma but remains less mature and risks
        duplicating existing hidden-shift, coordinate-Fourier, and supplied-word
        indexing lanes without a mechanism-distinct decoder.
  current_realized_frontier: >-
    Pollard rho remains the realized single-target time frontier at
    N^(1/2+o(1)) and constant state; BSGS remains N^(1/2+o(1)) time and memory.
    No candidate in this batch is a realized attack.
  dominated_by: >-
    The proposed operation is not yet realized and therefore cannot dominate
    Pollard rho or BSGS. Conditional points with unknown locator, retry, data,
    or source-replay axes are Pareto-incomparable, not improvements.
  sota_delta:
    realized_time_exponent: 0
    realized_memory_exponent: 0
    conditional_target_time_exponent_delta_vs_rho: -0.1
    condition: >-
      Only if the locator plus source replay, retries, verification, rank,
      factor logs, and masked descent are all proved within B^(2+o(1)) =
      N^(0.4+o(1)); no such proof exists at opening.

frozen_regime:
  B: N^(1/5)
  shared_product_circuit_leaves: Theta(B^2)
  selector_degrees: Theta(B)
  selector_norm_degrees: Theta(B^3)
  expected_common_factor_degree: Theta(B)
  conditional_source_replay_given_factor: B^(2+o(1))
  pollard_rho: B^(5/2+o(1))
  required_locator_plus_replay_target: B^(2+o(1))

known_closed_routes:
  - selector-algebra Kedlaya-Umans with B^3 represented coordinates
  - query-modular triangular norm at B^2 query width
  - circular degree-B query modulus already containing the unknown factor
  - primitive-element or Kronecker flattening to degree B^3
  - dense multivariate multipoint conversion
  - transposed power projection or fixed moments presented as nonlinear location
  - intrinsic-degree geometric resolution through B^4 or B^5 square prefixes
  - generic straight-line GCD or factorization with B^3 degree input
  - explicit univariate coefficient-vector GCD, including shallow-circuit controls
  - post-hoc source table, target-trained oracle, or materialized pair table

producer_requirements:
  - >-
    Freeze the exact algebraic interface T(U), F(V), H(U,W), N_T, N_F, and G,
    including multiplicity, squarefreeness, exceptional charts, and source jets.
  - >-
    Give a concrete recurrence or reduction whose inputs are the B^2 leaves
    and selectors and whose outputs are G and a complete replay certificate;
    a named black box or hoped-for output sensitivity is not a mechanism.
  - >-
    Prove the input-lineage and output-completeness invariants that forbid
    reading or writing a B^3 norm/coefficient/quotient object at any stage.
  - >-
    Reproduce every closed route above as an explicit negative control and
    include the 2024-2025 explicit-coefficient/shallow-GCD results as controls,
    not as solutions to selector elimination.
  - >-
    Charge preprocessing, bit/base-field conversion, failures, multiplicity,
    output, source replay, relation yield, rank, factor logs, masked target
    descent, verification, peak memory, parallel work, and multi-target use.
  - >-
    Provide a proof_search_map with baseline reproduction, observation
    collision, quantifier order, method ceiling, and a nearby-object control.
  - >-
    If no recurrence survives, state only a scoped obstruction for the tested
    algorithm family and name a concrete remaining escape class.

selection_rule: >-
  Preserve a theorem candidate only if it supplies an actual non-circular
  locator recurrence, an exact source inverse, and proved lambda,mu<1/2 on all
  charged axes. Otherwise return REVISE with the narrowest scoped obstruction.
  No outcome in this batch authorizes implementation or execution.

