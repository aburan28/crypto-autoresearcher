  joint_reviews:
    - joint_id: J1-locator-algebra-and-coefficient-completeness
      verdict: breaks
      checks_that_hold:
        - >-
          Conditional on the frozen degree interface, materializing either
          degree-Theta(B^3) unary norm exposes Theta(B^3) base-field
          coefficients.
        - >-
          A dense degree-Theta(B^2) W-vector over K[U]/(T), or over K[U]/(F),
          has Theta(B^2)*Theta(B)=Theta(B^3) K-coordinates.
        - >-
          K[U,W]/(T,C) has K-dimension deg(T)*deg(C); the specifically audited
          full-width case deg(C)=Theta(B^2) therefore has Theta(B^3)
          coordinates. Primitive/Kronecker conversion preserves that dimension.
        - >-
          A full Theta(B^2)-entry power-projection output over a
          Theta(B)-dimensional coefficient ring contains Theta(B^3)
          base-field coordinates.
      breaks:
        - id: J1-B1-width-is-not-necessity
          statement: >-
            The packet proves sizes of representations after choosing to
            materialize them. It does not prove that a coefficient-complete
            locator must enter one of those representations, nor that the
            first necessary state or operation count is Theta(B^3). The
            producer itself leaves reachable-image separation open in O3, and
            its only collision is for generic unary low jets with reachable
            elliptic-image membership explicitly unestablished. Thus
            "first coefficient-complete state" and prediction P1 are stronger
            than the supplied dimension identities.
          consequence: >-
            Retain a static representation-width screen, but remove necessity,
            first-state, and implementation-wide operation language unless a
            separation or decision-tree lower bound for the named interface is
            supplied.
        - id: J1-B2-triangular-dichotomy-is-incomplete
          statement: >-
            The q=Theta(B) discussion is valid for the single operation
            gcd(C,N_T mod C,N_F mod C): that operation can return only common
            roots already in C. It does not establish that every target-blind
            triangular transcript is useless unless one modulus contains G.
            Residues across several target-blind moduli can carry information
            without any individual modulus containing G; the packet neither
            bounds the number and total degree of such queries nor constructs
            a same-transcript collision on the reachable elliptic family.
          consequence: >-
            Scope the negative to a single divisor-containment query, or prove
            and charge a complete multi-query transcript bound.
        - id: J1-B3-fixed-jet-control-misses-frozen-squarefree-interface
          statement: >-
            The recorded pair (W^D,W^D) versus (W^D,W^D+W^k) has a non-squarefree
            common factor and is not an instance of the frozen squarefree-output
            interface. It remains a generic truncation illustration, but cannot
            discharge coefficient completeness for the frozen family.
          consequence: >-
            Use a squarefree control and still label it generic-only until
            reachable-image membership is proved.
      explicit_same_transcript_different_factor_test:
        field: F_101
        observation: ordered polynomial pair reduced coefficientwise modulo W^2
        first_polynomial: A=(W-1)(W-2)(W-3)=W^3-6W^2+11W-6
        second_world_0: B0=(W-1)(W-4)(W-5)=W^3-10W^2+29W-20
        second_world_1: B1=B0+W^2=W^3-9W^2+29W-20
        same_transcript: B0 mod W^2 = B1 mod W^2 = 29W-20
        different_factors:
          world_0: gcd(A,B0)=W-1
          world_1: >-
            gcd(A,B1)=1 because B1(1)=1, B1(2)=10, and B1(3)=13 in F_101.
        squarefree_check: >-
          A and B0 split into distinct roots. The discriminant of B1 is -4595,
          which is 51 modulo 101 and nonzero.
        exact_scope: >-
          This is an explicit squarefree generic low-jet counterexample. It
          shows that an omitted coefficient family needs a special reachable-
          image separation theorem; it is not asserted to be an elliptic norm
          pair.
      narrow_supported_boundary: >-
        The four named fully materialized representations have the stated
        Theta(B^3) widths. No locator recurrence, necessity theorem, or
        arbitrary-circuit lower bound is validated.
    - joint_id: J2-multiplicity-source-and-all-strata-replay
      verdict: breaks
      checks_that_hold:
        - >-
          In the additive-line occurrence model,
          b_x=sum_(y+z=-x)m_Y(y)m_Z(z), ordinary gcd order is
          min(m_X(x),b_x), and the labelled row count is m_X(x)*b_x.
        - >-
          For one simple participating labelled pair, differentiating a
          correctly constructed marked local factor recovers its normalized
          occurrence codes; an unmarked endpoint factor alone cannot identify
          the source row.
        - >-
          The packet honestly states that complete charts, local parameters,
          Hasse-order bounds, marker factorization, and a pre-elimination
          locator are absent.
      breaks:
        - id: J2-B1-occurrence-codes-are-collapsed-by-the-formula
          statement: >-
            The certificate declares c_X,c_Y,c_Z injective per occurrence, but
            writes one endpoint-indexed factor
            (s0+c_Y(y)sY+c_Z(z)sZ)^(m_Y(y)m_Z(z)). If two labelled Y
            occurrences coalesce at the same endpoint, they have distinct
            codes and the exact marked product has distinct linear factors;
            replacing them by one powered factor loses the labels the
            certificate promises to recover. This breaks the repeated and
            nonreduced strata that J2 must cover.
          consequence: >-
            Index the Hasse product over labelled occurrence pairs, not endpoint
            values, and then separately prove how geometric intersection
            multiplicity enters the local form.
        - id: J2-B2-additive-polynomial-is-not-an-elliptic-replay-map
          statement: >-
            The source certificate places
            Res_V(f_Y(V),(-1)^M f_Z(-U-V)) under the elliptic source identity
            without an additive-line-control qualifier. Elliptic addition has
            no global affine coordinate U with U(y+z)=U(y)+U(z). The immutable
            predecessor scope correction already requires chart-specific
            addition-law or source-marked Semaev leaves and compatible local
            trivializations. None is constructed in this packet.
          consequence: >-
            Keep the resultant only as an additive-line control. A global
            elliptic claim requires explicit complete-chart leaves and overlap
            proofs.
        - id: J2-B3-all-strata-registry-is-not-a-certificate
          statement: >-
            Tangent, vertical, infinity, return/endpoint, chart-overlap,
            repeated, and nonreduced cases are listed only as obligations.
            There are no branch-separated formulas, compatible local
            parameters or trivializations, Hasse-order bounds, transition maps,
            or target/start/both-transition replay proof. Therefore exact
            signed all-strata replay is not supplied.
          consequence: >-
            The only admissible status is conditional local interface plus
            global construction unsupplied; it is not ready for implementation.
        - id: J2-B4-post-hoc-B3-is-a-route-cost-not-a-lower-bound
          statement: >-
            Scanning one B^2 pair deck per Theta(B) endpoint and materializing
            the stated marked quotient each cost B^3, but these are two
            explicit algorithms. The packet supplies no lower bound excluding
            a different source-aware replay data structure. The conclusion must
            remain representation-scoped.
          consequence: >-
            Preserve the B^3 costs as screened-route costs only.
      explicit_same_factor_different_source_test:
        group: cyclic subgroup generated by P with order greater than 10
        common_endpoint: x=-5P
        world_0_source: '(x, y=P, z=4P)'
        world_1_source: '(x, y=2P, z=3P)'
        collision: >-
          Both worlds satisfy x+y+z=O and yield the same unmarked endpoint
          factor with multiplicity one, while the labelled source rows differ.
          Hence G and its ordinary multiplicity cannot determine replay.
        repeated_occurrence_variant: >-
          Let two labelled Y occurrences y_a,y_b have the same endpoint P but
          distinct codes a!=b, and let one Z occurrence at 4P have code c. The
          exact leading marker form is
          (s0+a*sY+c*sZ)(s0+b*sY+c*sZ). The packet's grouped powered form uses
          one c_Y(P) squared and cannot encode both occurrence labels.
        no_hidden_source_table_boundary: >-
          A corrected marked recurrence could distinguish these worlds only if
          the occurrence factors and their chart lineage are constructed and
          propagated before G is known. Looking the pairs up after receiving G
          is the explicitly charged post-hoc route, not a locator.
      narrow_supported_boundary: >-
        Endpoint multiplicity arithmetic and a simple distinct-occurrence
        local marker identity survive. Complete labelled all-strata elliptic
        replay and its necessity/cost claim do not.
  findings_summary:
    - id: REVIEW-B59-F1
      joint: J1-locator-algebra-and-coefficient-completeness
      disposition: revise
      summary: Representation width was promoted into an unsupported necessity and first-state claim.
    - id: REVIEW-B59-F2
      joint: J1-locator-algebra-and-coefficient-completeness
      disposition: revise
      summary: The triangular-query negative omits multi-modulus target-blind transcripts.
    - id: REVIEW-B59-F3
      joint: J2-multiplicity-source-and-all-strata-replay
      disposition: revise
      summary: Endpoint-grouped multiplicity powers contradict per-occurrence injective markers.
    - id: REVIEW-B59-F4
      joint: J2-multiplicity-source-and-all-strata-replay
      disposition: revise
      summary: Additive-line algebra is not instantiated on complete elliptic charts, and all exceptional strata remain unsupplied.
  task_disposition: REVISE
  disposition_rationale: >-
    Both owned joints break, but the break is repairable by narrowing the claim
    to static widths of explicitly materialized representations, correcting the
    occurrence-indexed marker algebra, and leaving the complete elliptic replay
    construction open. The packet does not support implementation design,
    scientific promotion, lane closure, an ECDLP speedup, or a breakthrough.
  required_repairs:
    - >-
      Replace "first coefficient-complete state" and prediction P1 by exact
      representation-width statements, or supply a reachable-image separation
      theorem and an operation/transcript lower bound.
    - >-
      Restrict the q=Theta(B) circularity claim to the single
      divisor-containment query, or analyze the total degree and separation of
      arbitrary target-blind multi-query transcripts.
    - >-
      Replace endpoint-grouped powered marker factors by a product over labelled
      occurrence pairs and distinguish occurrence multiplicity from geometric
      intersection multiplicity.
    - >-
      Type the additive-line resultant as a control and supply complete elliptic
      chart/local-parameter/Hasse/overlap constructions before claiming replay.
    - >-
      Preserve all B^3 replay figures as costs of named post-hoc routes, not as
      universal replay lower bounds.
  operational_blockers:
    - id: REVIEW-PLAN-CHECKER-SCHEMA-MISMATCH
      statement: >-
        The committed review plan cannot satisfy the current
        tools/check_review_independence.py contract. The checker expects each
        joint to use keys joint and assigned_to, while this plan uses id and
        owner_task_id. It also expects proves_too_much.objects plus
        failure_signature, while this plan uses proves_too_much_controls.
        This is independent of the scientific verdict and must be corrected by
        a Coordinator successor or checker-compatible plan before the declared
        ledger completion gate can pass.
  limitations:
