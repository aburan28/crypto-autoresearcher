  independent_parameter_rederivation:
    supplied_relations:
      - 'B = N^(1/5), hence N = B^5'
      - 'n = Theta(B^2)'
      - 'deg(T) = deg(F) = Theta(B)'
      - 'there are exactly B^2 constant-degree leaves'
      - 'deg(N_T) = deg(N_F) = Theta(B^3)'
      - 'expected deg(G) = Theta(B)'
    baseline_conversion:
      pollard_rho:
        in_N: 'N^(1/2+o(1))'
        in_B: 'B^(5/2+o(1))'
      campaign_cap:
        in_N: 'N^(9/20+o(1))'
        in_B: 'B^(9/4+o(1))'
      fresh_cap:
        in_N: 'N^(1/4+o(1))'
        in_B: 'B^(5/4+o(1))'
      cubic_route:
        in_N: 'N^(3/5+o(1))'
        in_B: 'B^(3+o(1))'
        ratio_to_rho: 'B^(1/2-o(1))'
        ratio_to_campaign_cap: 'B^(3/4-o(1))'
        ratio_to_fresh_cap: 'B^(7/4-o(1))'
    cost_unit: >-
      Base-field coordinates or base-field operations. Under the permitted
      predecessor assumption p=N^(1+o(1)), multiplication by poly(log p)
      changes only the o(1) term in the B exponent. This does not identify
      constants or a concrete bit-cost table.

  coordinate_lineage:
    - object: coefficients of T and F
      independent_derivation: '2 * Theta(B) = Theta(B) K-coordinates'
      status: holds
    - object: B^2 constant-degree leaf coefficient tuples
      independent_derivation: 'B^2 * Theta(1) = Theta(B^2) K-coordinates'
      status: holds_conditionally
      condition: >-
        Leaf tuple width and public tag width are constant or polylogarithmic;
        the packet does not state their exact bit widths.
    - object: compact product circuit H
      independent_derivation: 'Theta(B^2) leaves plus Theta(B^2) product gates'
      status: holds
      scope: circuit representation only
    - object: dense generic bivariate expansion of H
      independent_derivation: >-
        Individual U and W degrees Theta(n) permit a Theta(n^2)=Theta(B^4)
        coefficient rectangle.
      status: holds_as_potential_width
      scope: generic dense expansion, not the compact product circuit
    - object: selector coefficient algebra R_T or R_F
      independent_derivation: 'dim_K K[U]/(T) = deg(T) = Theta(B)'
      status: holds
    - object: dense H_T(W) or H_F(W) coefficient vector
      independent_derivation: >-
        Theta(n) W coefficients times Theta(B) coordinates per selector-ring
        element equals Theta(B^3) K-coordinates.
      status: holds
    - object: triangular query algebra A_(T,C)
      independent_derivation: 'dim_K A_(T,C) = Theta(B*q) for q=deg(C)'
      status: holds
      cases:
        q_Theta_B2: 'Theta(B^3), above rho'
        q_Theta_B: >-
          Theta(B^2), but complete recovery is circular unless C is
          independently constructed to contain the unknown G.
    - object: primitive-element or Kronecker flattening with full W direction
      independent_derivation: 'Theta(B) * Theta(n) = Theta(B^3) coordinates'
      status: holds
      scope: basis change preserves dimension
    - object: full power projection over a selector ring
      independent_derivation: >-
        Theta(n) returned ring elements times Theta(B) K-coordinates per
        element equals Theta(B^3) K-coordinates.
      status: holds
      limitation: 'A truncated projection has no supplied completeness theorem.'
    - object: explicit norm coefficient vectors N_T and N_F
      independent_derivation: >-
        Degree Theta(B^3) dense univariates each require Theta(B^3)
        coefficients.
      status: holds
    - object: common-factor output G
      independent_derivation: >-
        Expected degree Theta(B) gives Theta(B) coefficients when degree
        includes multiplicity.
      status: incomplete
      limitation: >-
        Only an expected degree is supplied; no deterministic multiplicity
        bound or exceptional-stratum output bound is stated.
    - object: source jets, labels, and replay output
      independent_derivation: null
      status: underspecified
      missing_parameters:
        - number of registered strata
        - maximum source labels per common root
        - jet width and coefficient ring per label
        - multiplicity bound
        - unranking output width
    - object: conditional decoder after G is supplied
      independent_derivation: >-
        Each K[U,W]/(T,G) or K[U,W]/(F,G) has dimension Theta(B^2).
      status: conditional_only
      comparison: >-
        Below rho and the campaign cap, but above the fresh B^(5/4) cap if
        charged anew per target. It is not a locator.
    - object: relation, rank, and factor-log systems
      independent_derivation: null
      status: underspecified
      missing_parameters:
        - factor-base size
        - relation count and success probability
        - matrix row and column dimensions
        - sparsity or nonzero count
        - rank-failure and retry probability
        - solve algorithm and cost unit
        - number and representation of factor logs

  time_memory_and_traffic_rederivation:
    named_representation_lower_bound: >-
      Materializing or emitting Theta(B^3) coordinates costs Omega(B^3)
      coordinate traffic. A near-linear represented-algebra call therefore
      has B^(3+o(1)) work. Fully materializing the state costs Theta(B^3)
      memory; streaming may lower peak memory but cannot lower the coordinate
      work needed by an explicit full-vector interface.
    compact_input_traffic: >-
      The leaf input alone is Theta(B^2) K-coordinates under constant-width
      leaves and tags. It is below rho and the campaign cap but exceeds the
      fresh B^(5/4) cap if reread for every fresh target. A fresh-target claim
      therefore needs explicit target-independent preprocessing and
      amortization quantifiers.
    query_traffic: >-
      A degree-q triangular query touches Theta(B*q) selector-lifted
      coordinates. q=Theta(B^2) is cubic. q=Theta(B) is only quadratic but
      assumes a modulus containing G unless a separate locator is supplied.
    output_traffic: >-
      G alone has expected Theta(B) coefficient traffic. Multiplicity and
      all-source replay traffic cannot be bounded from the packet.
    memory_verdict: >-
      The named fully materialized routes violate both the campaign and fresh
      memory caps. A streaming implementation could avoid that memory verdict
      for a particular route, but its Omega(B^3) work still violates rho.

  incumbent_baselines:
    parameterized_bsgs:
      model: >-
        Let a baby table contain m=B^a group elements for a group of size
        N=B^5. Ignoring polylogarithmic factors, one target costs
        B^a+B^(5-a) group work and B^a memory/data.
      optimum: >-
        Balancing a=5-a gives a=5/2 and time and memory B^(5/2), the rho
        exponent boundary with large memory.
      campaign_memory_cap: >-
        If a<=9/4, the giant-step term is at least B^(5-9/4)=B^(11/4),
        so parameterized BSGS cannot meet B^(9/4) time and memory together.
      fresh_cap: >-
        The B^(5-a) term is <=B^(5/4) only for a>=15/4, requiring
        B^(15/4) table memory before target amortization.
    parallel_accounting:
      formula: >-
        With P=B^pi ideal processors, wall time for a B^x work term may fall
        to B^(x-pi), but aggregate work remains B^x and processor-local or
        replicated memory/data must be counted.
      named_cubic_thresholds:
        below_rho_wall_time_requires: 'pi >= 1/2'
        campaign_wall_time_requires: 'pi >= 3/4'
        fresh_wall_time_requires: 'pi >= 7/4'
      pollard_rho_control: >-
        Ideal rho wall time is B^(5/2-pi) with aggregate expected work
        B^(5/2); parallel wall-clock alone is not an exponent improvement.
    multi_target_bsgs:
      model: >-
        For M=B^tau targets sharing one target-independent baby table, total
        work is B^a+B^(tau+5-a); amortized per target it is
        B^(a-tau)+B^(5-a), with memory/data B^a.
      campaign_cap_consequence: >-
        The per-target giant term meets B^(9/4) only when a>=11/4, already
        above the campaign memory cap B^(9/4).
      fresh_cap_consequence: >-
        The per-target giant term meets B^(5/4) only when a>=15/4, far above
        the campaign memory cap; target count does not remove that term.
    amortized_cubic_preprocessing:
      formula: 'B^3 / M = B^(3-tau) per target for M=B^tau targets'
      campaign_threshold: 'tau >= 3/4'
      fresh_threshold: 'tau >= 7/4'
      limitation: >-
        The packet supplies neither M nor a proof that the cubic state is
        reusable and target independent. Conditional replay of B^2 per target
        would still exceed the fresh B^(5/4) cap.

  retry_mask_and_chain_bookkeeping:
    required_formula: >-
      Expected total work must separate one-time preprocessing C_pre from
      per-attempt work C_attempt and state success probability s:
      C_expected=C_pre+C_attempt/s. For r explicit masks or targets, a
      corresponding C_pre+r*C_fresh or shared-preprocessing formula is needed.
    lower_bound_that_survives_missing_terms: >-
      If every attempt necessarily invokes one of the named cubic
      representations, s<=1 implies C_expected>=Omega(B^3), before any
      nonnegative replay, relation, rank, factor-log, or masked-target cost.
    missing:
      - success probability and independence assumptions
      - retry stopping rule and failure cost
      - number of masks or fresh targets
      - whether preprocessing is reusable across masks or targets
      - preprocessing-before-target quantifier order
      - relation collection and linear-algebra recurrence
      - source replay and output recurrence
    consequence: >-
      The named-route obstruction remains valid, but no complete attack-chain
      time, memory, data/query, or amortized cost can be certified.

  controls:
    - control: PTM-1-explicit-norm-input
      outcome: passes_control
      derivation: >-
        Two explicit degree-Theta(B^3) norm vectors require cubic input
        traffic, so they are rejected before downstream gain.
    - control: PTM-2-answer-containing-query
      outcome: passes_control
      derivation: >-
        A q=Theta(B) query is quadratic only if its modulus already contains
        G; without an independent construction this is the answer as input.
    - control: fixed-jet generic-unary collision
      outcome: passes_control_with_scoped_interpretation
      derivation: >-
        For k<D, both pairs (W^D,W^D) and (W^D,W^D+W^k) reduce to (0,0)
        modulo W^k, while their gcds are W^D and W^k. A fixed k-jet cannot
        recover the gcd on general unary pairs.
      scope: >-
        This says nothing by itself about the reachable elliptic-product
        image. The permitted predecessor explicitly labels it a generic
        truncation control, and the blind statement excludes broader circuit
        or lane-closure inference.
    - control: nearby-instance-with-G-supplied
      outcome: conditional_only
      derivation: >-
        The selector-plus-G quotient has Theta(B^2) dimension, demonstrating
        that source decoding after a locator may be sub-rho while not locating
        G.
    - control: PTM-4-supplied-source-table
      outcome: incomplete
      derivation: >-
        The packet gives no source-table cardinality or encoding width, so its
        cost cannot be compared with rho or the campaign and fresh caps.

  scope_and_quantifier_checks:
    scoped_statement_status: holds
    statement: >-
      RSO-B59-1 is supported for explicit unary coefficient vectors, the
      q=Theta(B^2) target-blind triangular quotient retaining full W,
      primitive/Kronecker flattening retaining full W, and full length-n
      power projection.
    forbidden_broader_inference_absent: true
    exclusions_preserved:
      - arbitrary arithmetic circuits
      - adaptive nonlinear sketches
      - direct recurrences on the reachable elliptic-product image
      - global impossibility or lane closure
    remaining_escape_interface: >-
      A direct adaptive pre-elimination product-circuit recurrence that avoids
      every named full representation remains outside this verdict.
    notation_ambiguity: >-
      The blind packet writes F(U), while the permitted predecessor fiber
      system uses an independent selector F(V). This is harmless if it is
      alpha-renaming but should be made explicit in a successor blind packet.
    plan_packet_label_mismatch: >-
      The review plan assigns J3 to full input-lineage and cost rederivation,
      whereas the packet's internal review_questions.J3 asks only about the
      fixed-jet control and places cost accounting under its J4 label. This
      report follows the committed review-plan joint and handoff objective.

  proof_architecture_checks:
    - check: baseline reproduction
      outcome: partial
      detail: >-
        Rho, campaign, fresh, and parameterized BSGS exponents are
        independently reproduced. Complete chain baselines are blocked by
        missing parameters.
    - check: observation-collision control
      outcome: passed_scoped
      detail: 'The fixed-jet pair is exact for the generic-unary class only.'
    - check: quantifier fidelity
      outcome: incomplete
      detail: >-
        Target-independent preprocessing, admissible masks, target count,
        and retry quantifiers are not stated.
    - check: method ceiling and nearby control
      outcome: passed_for_named_representations
      detail: >-
        Theta(B^3) coordinate traffic is the named-interface ceiling, while
        supplying G reduces the conditional decode quotient to Theta(B^2).
    - check: interface preservation
      outcome: partial
      detail: >-
        Selector, query, flattening, and full projection dimensions are
        preserved. Source-replay and end-to-end attack interfaces are not
        specified enough to audit.

  cost_model_checks:
    - check: cost-unit honesty
      outcome: partial
      detail: >-
        Base-field coordinate and operation exponents are stated, but no
        concrete bit-cost constants or standardized parameter table exists.
    - check: time and memory separated
      outcome: partial
      detail: >-
        Full materialization has cubic memory; streaming can change peak
        memory but not cubic explicit-vector work. No concrete streaming
        recurrence is supplied.
    - check: retry bookkeeping
      outcome: incomplete
      detail: 'No success probability or retry model is supplied.'
    - check: multi-target and parallel bookkeeping
      outcome: incomplete
      detail: >-
        Generic formulas are rederived, but the candidate supplies no target
        count, processor exponent, sharing model, or aggregate-resource cap.
    - check: data and query bookkeeping
      outcome: partial
      detail: >-
        Leaf and triangular-query traffic are derivable; masked-target,
        source, and relation data are not.

  blockers:
    - >-
      The blind statement must give a recurrence-level interface for every
      stage without disclosing producer derivations: inputs, outputs,
      dimensions, and per-call multiplicities.
    - >-
      State multiplicity and source-replay cardinality bounds for every
      registered stratum, including jet widths and unranking output size.
    - >-
      State the success probability, retry rule, mask count, fresh-target
      count, and independence assumptions.
    - >-
      State preprocessing quantifiers and which data are target independent,
      reusable, or replicated.
    - >-
      State relation/factor-base size, matrix dimensions and sparsity, rank
      failure probability, factor-log count, and solve algorithm.
    - >-
      State processor count, shared-versus-replicated memory, aggregate work,
      communication/data traffic, and whether bounds are wall-clock or work.
    - >-
      Clarify whether expected deg(G)=Theta(B) includes multiplicities and
      give the exceptional-case bound needed for a worst-case replay claim.
    - >-
      Align the blind packet's internal joint labels with the committed
      review plan so the cost question is unambiguous.

  limitations:
    - >-
      No producer derivation, theorem, source audit, disposition, runtime
      receipt, implementation, or sibling report was read.
    - >-
      The report validates only algebraic dimensions and generic baseline
      formulas derivable from the seven permitted sources.
    - >-
      Source citations named inside permitted predecessor records were not
      retrieved; no literature-applicability verdict is made because J4 owns
      that question.
    - >-
      The snapshot's remote push and PR state were not independently queried;
      only the committed local queue and reachable Git snapshot were checked.

  required_successor_action: >-
    REVISE the blind statement packet additively with the missing recurrence,
    cardinality, quantifier, probability, BSGS/multi-target, processor,
    relation/rank/factor-log, masked-target, replay, and cost-unit fields, then
    dispatch a new fresh blind Validator session. Do not repair this immutable
    report or disclose any blind-from source to the successor.

