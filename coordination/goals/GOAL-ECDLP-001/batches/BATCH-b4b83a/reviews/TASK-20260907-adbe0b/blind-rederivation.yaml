  construction_notes: >-
    Independent derivation from review_plan.blind_rederivation.quantity
    and its parameters only. Affine Weierstrass addition on
    y^2 = x^3 + A x + B over F_p was implemented in t1_blind.py.
    Generator S=(2,97) satisfies the curve equation
    (97^2 = 9409 ≡ 2^3 + 31367*2 + 41141 mod 47237). The walk
    starts at the identity for k=0 (label 0) and adds S once per
    increment of k. After n=47057 steps the walk returned to the
    identity; no earlier identity and no off-curve point occurred.
    Labels are v(k) = 0 on the identity and otherwise
    min((x*2)//47237, 1). Fiber sizes 23483 and 23574 sum to n.

    Pair counts used circular convolution of the two length-n
    float64 indicator vectors via numpy.fft (exact length n).
    Convolution bins were recovered by rounding; the maximum
    absolute rounding residual was 2.55e-11 and the maximum
    imaginary residual 2.28e-11. n^2 = 2214361249 < 2^53, so
    integer pair counts fit in the float64 mantissa. Recovered
    N[a,b,*] row sums equal |A_a|*|A_b| and the eight-cell total
    equals n^2.

    maj_sum = 276259290 + 277328952 + 277328952 + 278404524
    = 1109321718. Then q_maj = 1109321718 / 2214361249.
    gcd(1109321718, 2214361249) = 47057, and
    gcd(23574, 47057) = 1, so the reduced value is 23574/47057.

    Verdict holds because the enumeration is complete and the
    rational is exact. This report does not compare the value to
    any other implementation, does not interpret ADV, and does
    not authorize Stage 4.

