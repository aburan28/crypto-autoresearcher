  quantity: >-
    Exact q_maj of T1_digit0 at precision r=1 and image size s=2 on
    instance S1-a. Curve y^2 = x^3 + A x + B over F_p with p=47237,
    A=31367, B=41141, prime order n=47057, generator S=(2,97).
    Walk P_k = [k]S in E(F_p) for k=0..n-1. The identity (k=0) has
    no affine x; assign label 0. Otherwise let x be the affine
    x-coordinate in 0..p-1 and set v(k) = min((x * s) // p, s-1).
    With N[a,b,c] the number of (k,ell) in {0,...,n-1}^2 such that
    v(k)=a, v(ell)=b, and v((k+ell) mod n)=c,
    q_maj = (1/n^2) * sum_{a,b} max_c N[a,b,c], as an exact
    rational in lowest terms.
  parameters_used:
