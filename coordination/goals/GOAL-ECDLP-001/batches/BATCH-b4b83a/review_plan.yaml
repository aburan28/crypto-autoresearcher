    true (static_provenance, instance_precheck, walk_closed_identity,
    six_prime_orders, span_at_least_6x, all_n_in_16_26);
    digit_ADV_computed true; D_computed false; two_branch_applied
    false; beta_fitted_as_claim false; certificate kind none;
    authorized stages [0,1,2,3]. ADV cells are observations.
    T2_legendre q_maj near one half at natural s=3 is recorded
