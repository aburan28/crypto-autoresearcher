  coordinator_prior: >-
    Written before the reviewers of this round run, after the same
    session produced RUN-ECDLP-a98ea9-S3. The Coordinator expects
    the four validator joints to hold on the snapshotted S3 package:
    path_sha256 values in TASK-20260907-4f7bcc match the worktree;
