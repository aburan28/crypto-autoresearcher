    The Coordinator expects a blind re-derivation of T1_digit0 at
    r=1, s=2 on instance S1-a (p=47237, n=47057, A=31367, B=41141,
    S=(2,97)) from the stated definition, without reading stage3.py
    or the S3 raw-result, to return an exact rational that matches
    the producer cell. PROCEDURE DEVIATION PD-S3R1: this prior is
    contaminated by the producer session. Concurrence with this
    prior is not independent corroboration of the Coordinator's
    belief.

  procedure_deviations:
    - id: PD-S3R1
      description: >-
        The Coordinator session that produced RUN-ECDLP-a98ea9-S3
        is writing this prior. A prior recorded after the producer
        result is known cannot separate "reviewers agreed" from
        "reviewers agreed with the Coordinator".
    - id: PD-S3R2
      description: >-
        Reachable commit messages on this branch discuss Stage 2
        fixture tokens from earlier batches. Reviewers are forbidden
        to run git log / git show. A --blind-history FAIL or
        UNCHECKABLE result is not treated as a pass.

  joints:
    - joint: artifact_binding
      assigned_to: TASK-20260907-0b5766
      attack_plan: >-
        Rehash every path in
        BATCH-b4b83a/archives/TASK-20260907-4f7bcc/snapshot-receipt.json
        against the worktree. Confirm S0/S1/S2/S2b/S2c directories
        still exist as distinct runs and were not overwritten.
        Confirm S3 manifest and report bind EXP-ECDLP-a98ea9 /
        H-ECDLP-07c7c6 / TASK-20260907-5947b6, certificate.kind
        none, digit_ADV_computed true, D_computed false,
        authorized stages [0,1,2,3].
      breaking_artifact: >-
        A missing S3 file, a path_sha256 mismatch, an overwritten
        earlier run directory, a certificate other than none, or
        D_computed true.
    - joint: scale_and_gates
      assigned_to: TASK-20260907-0b5766
      attack_plan: >-
        From S3 raw-result.json alone, read tested_scale and
        hard_gates. Holds only if instance_count is 7, n_min is
        39503, n_max is 375391, span_at_least_6x is true,
        band_20_to_26_tested is false, cell_count is 847, every
        hard_gates value is true, digit_ADV_computed is true,
        D_computed is false, and two_branch_applied is false.
        Recompute span_ratio as n_max/n_min from those two
        integers. Do not trust the top-level validity boolean
        without these field checks.
      breaking_artifact: >-
        A scale or gate field that disagrees with the producer
        statement, or a claimed 16-26 / 1024x coverage.
    - joint: provenance_ast
      assigned_to: TASK-20260907-0b5766
      attack_plan: >-
        Re-run implementation/static_provenance.py against the
        committed kfree_transport.py. Confirm
        canonical_order_n_lift parameters are curve, P_fp, n,
        precision and that no forbidden scalar name appears.
      breaking_artifact: >-
        AST failure, a missing required function, or a forbidden
        parameter on the k-free surface.
    - joint: no_D_no_branch
      assigned_to: TASK-20260907-0b5766
      attack_plan: >-
        Proves-too-much control. Read execution-report-stage3.yaml
        and v4_stage3_authorized. Holds only if D_computed is false,
        two_branch_applied is false, beta_fitted_as_claim is false,
        and T2 q_maj near one half is not sold as LEAD, as H
        support, or as a D2 disposition. Stage 4 remains
        unauthorized in the report language.
      breaking_artifact: >-
        Report language that applies CLOSURE/LEAD/INCONCLUSIVE,
        interprets T2 as H support, or authorizes Stage 4.

  blindness:
    mutual: true
    lifted_for: []
    rationale: null

  proves_too_much:
    objects:
      - >-
        A T2_legendre cell with q_maj near one half at s=3, which
        is the same numerical neighbourhood as POSITIVE CONTROL B
        and is not a Stage 4 comparator.
      - >-
        A reading that would treat Stage 3 ADV cells as D, as a
        two-branch outcome, or as support for H-ECDLP-07c7c6.
    failure_signature: >-
      An argument that classifies T2 as LEAD, applies the
      two-branch rule, or supports H from Stage 3 cells has
      proved too much.
    assigned_to: TASK-20260907-0b5766

  blind_rederivation:
    required: true
    quantity: >-
      Exact q_maj of T1_digit0 at precision r=1 and image size s=2
      on the prime-order instance S1-a. Curve y^2 = x^3 + A x + B
      over F_p with p=47237, A=31367, B=41141, prime order n=47057,
      generator S=(2,97). Walk P_k = [k]S in E(F_p) for k=0..n-1.
      The identity (k=0) has no affine x; assign label 0.
      Otherwise let x be the affine x-coordinate in 0..p-1 and set
      v(k) = min((x * s) // p, s-1). Then q_maj is the f558e4
      majority: with N[a,b,c] the number of (k,ell) in
      {0,...,n-1}^2 such that v(k)=a, v(ell)=b, and
      v((k+ell) mod n)=c, q_maj = (1/n^2) * sum_{a,b} max_c N[a,b,c].
      Report q_maj as an exact rational in lowest terms.
      Do not read the producer implementation, S3 raw-result, or
      the sibling validator report. Do not interpret ADV.
    parameters:
      instance_id: S1-a
      p: 47237
      A: 31367
      B: 41141
      n: 47057
      S: [2, 97]
      r: 1
      s: 2
      statistic: T1_digit0
      identity_label: 0
    blind_from:
      - experiments/EXP-ECDLP-a98ea9/implementation/stage3.py
      - experiments/EXP-ECDLP-a98ea9/implementation/qmaj.py
      - experiments/EXP-ECDLP-a98ea9/execution-report-stage3.yaml
      - experiments/EXP-ECDLP-a98ea9/runs/RUN-ECDLP-a98ea9-S3/
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-b4b83a/reviews/TASK-20260907-0b5766/
    assigned_to: TASK-20260907-adbe0b
