review_plan:
  opened_by: TASK-20260907-0b5766
  batch_id: BATCH-b4b83a
  recorded_at: '2026-09-07'
  recorded_before_reviewers: true

  claim_under_review: >-
    Producer statement (execution-report-stage3.yaml,
    RUN-ECDLP-a98ea9-S3, snapshot TASK-20260907-4f7bcc at 4ac80e199):
    validity valid under v4_stage3_authorized; 847 T1-T4 cells;
    seven prime orders n in {47057, 42667, 58453, 162611, 39503,
    79043, 375391}; n_min 39503; n_max 375391; span_ratio 9.5028;
