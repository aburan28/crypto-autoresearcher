schema_version: "1.0"
task_id: TASK-20260802-224
claim_type: scoped_producer_resource_accounting
global_frontier_claimed: false
novelty_claimed: false
definitions:
  N: "r-1"
  success: "s = Theta(N^(-beta)) unless a row states otherwise"
  excess_root_count: "Delta = N*s-d"
  excess_exponent: "Delta = Theta(N^kappa), with Delta>0"
  preprocessing: "P = Theta(N^p)"
  online_labels: "q_g+1 = Theta(N^x)"
  amortization_instances: "B = Theta(N^b), mutually independent challenges"
  capped_constraint: "max(p+x,2*x) >= kappa"
  charged_attempt_work: "C_pre+q_g+q_eq+q_raw+q_branch+A_move"
  retry_rule: "expected work = per-attempt charged work / per-attempt success"
comparison_dimensions:
  - expected_time
  - peak_memory
  - resident_data
  - online_generic_queries
  - online_table_accesses
dominance_scope_rule: "Rows are comparable only when input, success semantics, and single-instance versus amortized scope agree."
baseline:
  id: pollard_rho_ordinary_single
  time_exponent: 0.5
  memory_exponent: 0.0
  ordinary_sota_delta_time: 0.0
  ordinary_sota_delta_memory: 0.0
  ordinary_data_or_query_delta: 0.0

rows:
  - id: pollard_rho_ordinary_single
    kind: known_baseline
    scope: "One ordinary input (G,alpha*G); recover alpha, then issue alpha^d*G."
    admissibility:
      ordinary_input: true
      single_instance: true
      success: "constant, amplified to 1 in the usual generic-DLP sense"
      d_regime: "all declared d"
    parameters:
      p: 0.0
      x: 0.5
      beta: 0.0
      b: 0.0
    expected_work_expression: "Theta(sqrt(N))"
    time_exponent: 0.5
    peak_memory_exponent: 0.0
    data_query_access_exponent:
      resident_data: 0.0
      online_generic_queries: 0.5
      online_table_accesses: 0.0
      total_charged_single_instance: 0.5
    preprocessing:
      construction: "none beyond public G"
      amortization: "none"
      assumptions: "Pollard rho or kangaroo baseline"
    dominated_by: null
    dominance_checked_against:
      - collision_low_preprocessing_single
      - collision_table_tradeoff_single
      - collision_full_table_single
      - collision_table_tradeoff_amortized
      - root_mass_output_G
    sota_delta:
      comparison_admissible: true
      claimed_time_exponent_improvement: 0.0
      claimed_memory_exponent_improvement: 0.0
      claimed_data_or_query_exponent_improvement: 0.0
      resource_difference_from_baseline:
        time: 0.0
        memory: 0.0
        online_queries: 0.0

  - id: collision_low_preprocessing_single
    kind: "piecewise collision-boundary row; no novelty claim"
    scope: "One ordinary input, Delta=N*s-d=Theta(N^kappa)>0, 0<=p<=kappa/2."
    admissibility:
      ordinary_input: true
      single_instance: true
      success: "s=Theta(N^(-beta)); retries require iid detectable success"
      d_regime: "d <= N*s-Theta(N^kappa)"
    parameters:
      p: "[0,kappa/2]"
      x: "kappa/2"
      beta: ">=0"
      b: 0.0
    expected_work_expression: "(C_pre+Theta(N^(kappa/2))+all comparisons and accesses)/s"
    time_exponent: "beta+kappa/2"
    peak_memory_exponent: "p"
    data_query_access_exponent:
      resident_data: "p"
      preprocessing_writes: "p"
      online_generic_queries: "kappa/2"
      online_table_accesses: "at most the charged online-work exponent"
      total_charged_single_instance: "beta+kappa/2"
    preprocessing:
      construction: "C_pre >= P-1 = Omega(N^p), fully charged"
      amortization: "none"
      assumptions: "No challenge-dependent advice."
    dominated_by:
      status: conditional
      rows:
        - pollard_rho_ordinary_single
      condition: "Strictly dominated when beta=0, kappa=1, and p>0; equal in the listed exponents at p=0. Otherwise scopes or success levels differ."
      otherwise: null
    dominance_checked_against:
      - pollard_rho_ordinary_single
      - collision_table_tradeoff_single
      - collision_full_table_single
      - collision_table_tradeoff_amortized
      - root_mass_output_G
    sota_delta:
      comparison_admissible: true
      claimed_time_exponent_improvement: 0.0
      claimed_memory_exponent_improvement: 0.0
      claimed_data_or_query_exponent_improvement: 0.0
      resource_difference_from_baseline:
        time: "beta+kappa/2-0.5"
        memory: "p"
        online_queries: "kappa/2-0.5"

  - id: collision_table_tradeoff_single
    kind: "piecewise preprocessing/online boundary; generic DLP-table behavior is prior art"
    scope: "One ordinary input, Delta=Theta(N^kappa)>0, kappa/2<p<kappa."
    admissibility:
      ordinary_input: true
      single_instance: true
      success: "s=Theta(N^(-beta)); retries require iid detectable success"
      d_regime: "d <= N*s-Theta(N^kappa)"
    parameters:
      p: "(kappa/2,kappa)"
      x: "kappa-p"
      beta: ">=0"
      b: 0.0
    expected_work_expression: "(Theta(N^p)+Theta(N^(kappa-p))+all table accesses)/s"
    time_exponent: "beta+p"
    peak_memory_exponent: "p"
    data_query_access_exponent:
      resident_data: "p"
      preprocessing_writes: "p"
      online_generic_queries: "kappa-p"
      online_table_accesses: "kappa-p"
      total_charged_single_instance: "beta+p"
    preprocessing:
      construction: "Theta(N^p), fully charged for the one challenge"
      amortization: "none"
      assumptions: "A searchable table still incurs its construction, storage, and probes."
    dominated_by: null
    dominance_reason: "Pollard has lower time, memory, and resident data in the constant-success kappa=1 case, but this row has fewer online queries; no row is strictly no-worse in every declared dimension."
    dominance_checked_against:
      - pollard_rho_ordinary_single
      - collision_low_preprocessing_single
      - collision_full_table_single
      - collision_table_tradeoff_amortized
      - root_mass_output_G
    sota_delta:
      comparison_admissible: true
      claimed_time_exponent_improvement: 0.0
      claimed_memory_exponent_improvement: 0.0
      claimed_data_or_query_exponent_improvement: 0.0
      resource_difference_from_baseline:
        time: "beta+p-0.5"
        memory: "p"
        resident_data: "p"
        online_queries: "kappa-p-0.5"

  - id: collision_full_table_single
    kind: "piecewise full-preprocessing boundary"
    scope: "One ordinary input, Delta=Theta(N^kappa)>0, p>=kappa."
    admissibility:
      ordinary_input: true
      single_instance: true
      success: "s=Theta(N^(-beta))"
      d_regime: "d <= N*s-Theta(N^kappa)"
    parameters:
      p: "[kappa,1]"
      x: 0.0
      beta: ">=0"
      b: 0.0
    expected_work_expression: "(Theta(N^p)+N^o(1) online lookup and output issuance)/s"
    time_exponent: "beta+p"
    peak_memory_exponent: "p"
    data_query_access_exponent:
      resident_data: "p"
      preprocessing_writes: "p"
      online_generic_queries: 0.0
      online_table_accesses: 0.0
      total_charged_single_instance: "beta+p"
    preprocessing:
      construction: "Theta(N^p), fully charged"
      amortization: "none"
      assumptions: "Lookup indices and stored scalars are charged records."
    dominated_by: null
    dominance_reason: "Other single-instance rows use less time, memory, and data but more online queries; therefore no strict dominator exists across every declared dimension."
    dominance_checked_against:
      - pollard_rho_ordinary_single
      - collision_low_preprocessing_single
      - collision_table_tradeoff_single
      - collision_table_tradeoff_amortized
      - root_mass_output_G
    sota_delta:
      comparison_admissible: true
      claimed_time_exponent_improvement: 0.0
      claimed_memory_exponent_improvement: 0.0
      claimed_data_or_query_exponent_improvement: 0.0
      resource_difference_from_baseline:
        time: "beta+p-0.5"
        memory: "p"
        resident_data: "p"
        online_queries: -0.5

  - id: collision_table_tradeoff_amortized
    kind: "multi-instance amortized row"
    scope: "One challenge-independent table reused across B=Theta(N^b) mutually independent ordinary-input challenges."
    admissibility:
      ordinary_input: true
      single_instance: false
      success: "s=Theta(N^(-beta)) per independent challenge/attempt"
      d_regime: "Delta=Theta(N^kappa)>0"
      ordinary_single_instance_sota_comparison: false
    parameters:
      p: "(kappa/2,kappa]"
      x: "kappa-p"
      beta: ">=0"
      b: ">0"
    expected_work_expression: "(Theta(N^(max(p-b,0)))+Theta(N^(kappa-p))+all per-instance accesses)/s"
    time_exponent: "beta+max(max(p-b,0),kappa-p)"
    peak_memory_exponent: "p"
    data_query_access_exponent:
      resident_data: "p"
      preprocessing_writes_amortized_per_instance: "max(p-b,0)"
      online_generic_queries: "kappa-p"
      online_table_accesses: "kappa-p"
      total_amortized_charged_per_instance: "beta+max(max(p-b,0),kappa-p)"
    preprocessing:
      construction: "Theta(N^p) once"
      amortization: "Only construction is divided by B; memory and resident data remain Theta(N^p)."
      assumptions: "B challenges and their hidden scalars are mutually independent; this is not an ordinary single-instance row."
    dominated_by: null
    dominance_reason: "It can reduce amortized time and online queries only by changing scope and increasing peak memory/resident data; no same-scope local row is no-worse in every dimension."
    dominance_checked_against:
      - pollard_rho_ordinary_single
      - collision_low_preprocessing_single
      - collision_table_tradeoff_single
      - collision_full_table_single
      - root_mass_output_G
    sota_delta:
      comparison_admissible: false
      claimed_time_exponent_improvement: not_applicable
      claimed_memory_exponent_improvement: not_applicable
      claimed_data_or_query_exponent_improvement: not_applicable
      reason: "Multi-instance amortization is inadmissible as an ordinary single-instance SOTA comparison."

  - id: root_mass_output_G
    kind: exact_obstruction
    scope: "Bounded-correctness producer only; return the issued public handle G."
    admissibility:
      ordinary_input: true
      single_instance: true
      success: "exactly d/N over uniform alpha; meets any requested s<=d/N"
      d_regime: "root-dominated; in particular d=Theta(N) gives constant correctness"
      ecdlp_solver: false
    parameters:
      p: 0.0
      x: 0.0
      beta: "1-log_N(d)"
      b: 0.0
    expected_work_expression: "Theta(1) to issue one output; Theta(N/d) across fresh independently verified challenges if one insists on observing a successful instance"
    time_exponent: 0.0
    peak_memory_exponent: 0.0
    data_query_access_exponent:
      resident_data: 0.0
      preprocessing_writes: 0.0
      online_generic_queries: 0.0
      online_table_accesses: 0.0
      total_charged_single_instance: 0.0
    preprocessing:
      construction: "none beyond public G"
      amortization: "none"
      assumptions: "Success is over the sampled challenge; retrying the same alpha does not renew this success event."
    dominated_by: null
    dominance_reason: "It is minimal for its weaker bounded-correctness producer scope and is not comparable to rows that recover alpha or obtain positive excess success."
    dominance_checked_against:
      - pollard_rho_ordinary_single
      - collision_low_preprocessing_single
      - collision_table_tradeoff_single
      - collision_full_table_single
      - collision_table_tradeoff_amortized
    sota_delta:
      comparison_admissible: true
      claimed_time_exponent_improvement: 0.0
      claimed_memory_exponent_improvement: 0.0
      claimed_data_or_query_exponent_improvement: 0.0
      reason: "The row does not solve ordinary ECDLP and therefore creates no ordinary-ECDLP SOTA improvement."
      resource_difference_from_baseline:
        raw_task_time: -0.5
        raw_task_memory: 0.0
        raw_task_online_queries: -0.5

pareto_conclusion:
  ordinary_single_instance_constant_excess:
    condition: "s-d/N is bounded below by a positive constant"
    lower_bound_time_exponent: 0.5
    achievable_reference: pollard_rho_ordinary_single
    ordinary_sota_delta_time: 0.0
    ordinary_sota_delta_memory: 0.0
    ordinary_data_or_query_delta: 0.0
  root_dominated:
    condition: "s<=d/N"
    conclusion: "No collision lower bound; R=G is the exact obstruction."
  amortized:
    conclusion: "Potentially smaller per-instance online time is paid for by multi-instance scope and peak memory/resident data; ordinary SOTA deltas are not_applicable."
