outcome: CANDIDATE_WITH_EXACT_UNIFORM_OBSTRUCTION
official_status_changed: false
obligations:
  - id: PO-224-01
    name: mandatory_RT_215_C1_control
    status: PROVED
    section: "repaired-producer-bound.md §2 Mandatory RT-215-C1 control"
    statement: "The producer R=G creates no informative producer collision, while a separate perfectly sound generic-DLP verifier can accept exactly when alpha^d=1 using verifier work."
    falsification_condition: "Exhibit an informative collision in the zero-operation producer transcript for an accepted alpha other than alpha=1, or show that the verifier can be perfectly sound without its recovery/checking work belonging to the verifier."

  - id: PO-224-02
    name: earlier_producer_certificate_collision_lemma
    status: REFUTED
    section: "repaired-producer-bound.md §2 Mandatory RT-215-C1 control"
    statement: "Perfectly sound acceptance does not imply an informative collision in the producer transcript."
    falsification_condition: "Prove, without importing verifier labels, queries, collisions, or certificate checking into the producer budget, that every accepted R=G instance with alpha^d=1 contains a producer collision."

  - id: PO-224-03
    name: exact_domain_and_target
    status: PROVED
    section: "repaired-producer-bound.md §1 Scope and result"
    statement: "The theorem uses prime r, N=r-1, alpha uniform in F_r^*, d dividing N with 2<=d<N, ordinary input G and alpha*G, and target alpha^d*G."
    falsification_condition: "Find an undeclared alpha value, d value, auxiliary handle, or nonlinear interface used by any proof step."

  - id: PO-224-04
    name: affine_label_closure
    status: PROVED
    section: "repaired-producer-bound.md §4 Fixed symbolic transcript, including raw encodings"
    statement: "Before an informative collision, every online issued handle has an affine formal label a+bX."
    falsification_condition: "Produce an allowed ordinary generic operation on affine labels whose formal result is non-affine, without adding an excluded nonlinear oracle."

  - id: PO-224-05
    name: alpha_independent_fixed_transcript
    status: PROVED
    section: "repaired-producer-bound.md §4 Fixed symbolic transcript, including raw encodings"
    statement: "Coins, encoding tokens, advice, branches, and schedule are fixed independently of alpha; outside scalar-collision roots the real transcript is coupled to that symbolic transcript."
    falsification_condition: "Give an alpha outside the declared collision union for which the real random-injection transcript has a different distribution or takes a different raw-bit branch from the fixed symbolic transcript."

  - id: PO-224-06
    name: raw_encoding_branch_control
    status: PROVED
    section: "repaired-producer-bound.md §4 Fixed symbolic transcript, including raw encodings"
    statement: "Visible raw strings do not create an additional exceptional event under a uniformly random injective encoding; their sampled values and all branches are fixed in tau."
    falsification_condition: "Show a raw-string transcript divergence outside scalar collisions under the stated random-injection coupling, or show that two distinct scalars can receive the same encoding."

  - id: PO-224-07
    name: q_g_plus_one_boundary
    status: PROVED
    section: "repaired-producer-bound.md §3 Generic model and charged resources"
    statement: "The online boundary is the challenge label X plus at most one issued result per q_g oracle call; an output handle is not counted a second time."
    falsification_condition: "Exhibit one allowed generic call that issues more than one new handle, or an allowed output that is neither resident preprocessing nor one of the q_g+1 online slots."

  - id: PO-224-08
    name: exact_collision_root_union
    status: PROVED
    section: "repaired-producer-bound.md §5 Exact root sets and one union"
    statement: "After removing identically equal pairs, preprocessing/online and online/online collision sets are explicit set unions with at most Pn and binomial(n,2) nonzero affine root sets."
    falsification_condition: "Identify a possible producer scalar collision not represented in C_PO or C_OO, or a represented nonidentical affine pair having more than one root in F_r^*."

  - id: PO-224-09
    name: every_allowed_output_agreement_set
    status: PROVED
    section: "repaired-producer-bound.md §5 Exact root sets and one union"
    statement: "T_H is defined for every issued handle; the alpha-independent fixed transcript selects exactly one T_out for the success union."
    falsification_condition: "Show that outside collision roots the selected output index can vary with alpha, or find an allowed issued affine handle whose agreement polynomial with X^d is identically zero."

  - id: PO-224-10
    name: target_root_bound
    status: PROVED
    section: "repaired-producer-bound.md §5 Exact root sets and one union"
    statement: "Every affine-output agreement set has at most d roots because a+bX-X^d is a nonzero degree-d polynomial; G attains d roots when d divides N."
    falsification_condition: "Find more than d roots in F_r^* for a+bX=X^d under 2<=d<r, or show that |{x:x^d=1}| differs from d when d divides r-1."

  - id: PO-224-11
    name: overlap_and_double_counting
    status: PROVED
    section: "repaired-producer-bound.md §5 Exact root sets and one union"
    statement: "The exact event is one set union; duplicate roots and collision/target overlaps are counted once before applying the conservative sum bound."
    falsification_condition: "Find a probability step that adds multiplicities rather than bounding the cardinality of the declared union."

  - id: PO-224-12
    name: issued_output_correctness_bound
    status: PROVED
    section: "repaired-producer-bound.md §6 Producer correctness theorem"
    statement: "For an oracle-issued output, success is contained in C_PO union C_OO union T_out, yielding s <= (Pn+binomial(n,2)+d)/N."
    falsification_condition: "Give a successful alpha outside that union under the theorem's interface and issued-output convention."

  - id: PO-224-13
    name: arbitrary_encoding_guess_extension
    status: PROVED
    section: "repaired-producer-bound.md §3 Generic model and charged resources"
    statement: "Although excluded from the theorem, g adaptive non-issued guesses add at most g/(M-m) conditional probability after m distinct issued encodings."
    falsification_condition: "Under a uniform random injection, show that an unissued target encoding is not uniform among the M-m unused strings conditional on the producer view."

  - id: PO-224-14
    name: constant_excess_collision_implication
    status: PROVED
    section: "repaired-producer-bound.md §6 Producer correctness theorem"
    statement: "If delta=s-d/N>0, then P(q_g+1)+binomial(q_g+1,2)>=N delta; constant delta forces fully charged capped work Omega(sqrt(N))."
    falsification_condition: "Construct a capped producer satisfying the stated model and constant positive delta while violating the exact success union or using o(sqrt(N)) fully charged work."

  - id: PO-224-15
    name: constant_correctness_uniform_in_d
    status: REFUTED
    section: "repaired-producer-bound.md §§1-2"
    statement: "Constant correctness by itself does not force rho producer work uniformly over allowed d."
    falsification_condition: "Disprove that d=N/2 and R=G have correctness 1/2 and constant producer work."

  - id: PO-224-16
    name: expected_work_truncation
    status: PROVED
    section: "repaired-producer-bound.md §7 Expected work, retries, memory, and data"
    statement: "For expected total work mu and delta>0, truncation gives mu >= (delta/2)(sqrt(delta*N/3)-2), hence Omega(sqrt(N)) for constant delta."
    falsification_condition: "Find an error in the Markov truncation, the surviving-transcript P and q_g caps, or the application of the capped success bound."

  - id: PO-224-17
    name: restart_cost_identity
    status: PROVED
    section: "repaired-producer-bound.md §7 Expected work, retries, memory, and data"
    statement: "For iid attempts with detectable success, expected charged work is per-attempt charged work times inverse per-attempt success; reused preprocessing is separately C_pre plus online work divided by success."
    falsification_condition: "Give iid detectable attempts for which the renewal identity fails, or identify reused construction incorrectly multiplied by the inverse success probability."

  - id: PO-224-18
    name: memory_data_and_amortization_accounting
    status: PROVED
    section: "repaired-producer-bound.md §§3 and 7"
    statement: "Peak memory and resident data are at least P; all accesses and movements are charged; only construction is divided across B explicitly independent amortization instances."
    falsification_condition: "Find a row that divides peak memory, resident data, or per-instance online accesses by B, or omits single-instance preprocessing construction."

  - id: PO-224-19
    name: verifier_producer_separation
    status: PROVED
    section: "repaired-producer-bound.md §8 Verifier separation"
    statement: "Verifier labels, collisions, operations, memory, and data have separate variables and are not used in the producer theorem."
    falsification_condition: "Find a producer inequality whose proof uses a verifier-created object or charges verifier work to the producer."

  - id: PO-224-20
    name: pareto_piecewise_constraint
    status: PROVED
    section: "repaired-producer-bound.md §9 Pareto and prior-art boundary"
    statement: "For Delta=Ns-d=Theta(N^kappa), the boundary max(p+x,2x)>=kappa is split at p=kappa/2 and p=kappa, with single-instance and amortized construction distinguished."
    falsification_condition: "Provide a missing exponent regime or a row whose stated p,x exponents violate the exact collision constraint or cost accounting."

  - id: PO-224-21
    name: novelty_or_sota_claim
    status: REFUTED
    section: "repaired-producer-bound.md §9 Pareto and prior-art boundary"
    statement: "No novelty, first, global-frontier, breakthrough, or positive ordinary-ECDLP SOTA delta follows."
    falsification_condition: "Identify an explicit novelty or positive SOTA assertion in the artifacts, or supply an independently reviewed prior-art comparison establishing one."
