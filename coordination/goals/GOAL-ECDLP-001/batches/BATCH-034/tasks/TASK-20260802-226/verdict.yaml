        sha256: 90940d03bd81fcb97a7e3f81c396e453808789e5c69b4db982a17fa1b1f6ddce

  verdict_basis:
    core_theorem_under_repaired_standard_model: SURVIVES
    theorem_as_written: REVISE
    complete_cost_accounting: REVISE
    pareto_package: REVISE
    prior_art_and_scope: PASS
    package_verdict_rule: >-
      A binding theorem-model gap and independently decisive Pareto schema
      error prevent PASS; the standard-model core is sufficiently intact that
      a scoped redefinition and re-proof is preferable to FAIL.

  objections:
    - id: RT-226-F1
      severity: critical
      classification: theorem_blocking_as_written
      title: encoding_dependent_preprocessing_state_outside_root_union
      affected_claims:
        - repaired-producer-bound.md#equation-1
        - repaired-producer-bound.md#section-4-fixed-symbolic-transcript
        - repaired-producer-bound.md#equations-12-and-13
      affected_proof_obligations:
        - PO-224-05
        - PO-224-06
        - PO-224-08
        - PO-224-12
        - PO-224-14
        - PO-224-16
        - PO-224-18
      finding: >-
        P counts resident handle records, but separately charged non-handle
        advice is not required to be independent of the random injection. A
        retained encoding-recognition structure derived during preprocessing
        can condition raw-string branches without contributing roots to C_PO.
        Charging it in C_pre may make it expensive but does not validate the
        success inequality, which has no advice term.
      mutation: >-
        Precompute encodings for known constants, retain an exact
        encoding-to-scalar recognition structure, and discard whatever the
        artifact does not classify as a handle. On recognized Q=cG, issue
        c^dG; otherwise output G. If the records do not count in P, success
        gains one root per stored constant while equation (1) does not.
      repair: >-
        Require external advice to be independent of the random injection and
        count every retained encoding/equality-recognition record in P, or add
        preprocessing-query and advice-state terms and redo the coupling.

    - id: RT-226-R1
      severity: major
      classification: cost_accounting
      title: retry_rows_conflate_rebuilt_and_reused_preprocessing
      affected_claims:
        - pareto-frontier.yaml#collision_table_tradeoff_single
        - pareto-frontier.yaml#collision_full_table_single
        - pareto-frontier.yaml#collision_table_tradeoff_amortized
      affected_proof_obligations:
        - PO-224-17
        - PO-224-18
        - PO-224-20
      finding: >-
        Section 7 correctly gives C_pre+E[W_online]/s when preprocessing is
        reused, but the Pareto formulas divide construction by success without
        stating that the table is rebuilt with fresh coins every attempt.
      corrected_exponents:
        single_table_reused: "max(p,beta+x)"
        B_instance_shared_table: "max(max(p-b,0),beta+x)"
        rebuild_each_attempt: "beta+max(p,x), only with explicit rebuild"

    - id: RT-226-R2
      severity: major
      classification: task_scope
      title: fresh_challenges_are_not_single_instance_retries
      affected_claims:
        - pareto-frontier.yaml#root_mass_output_G.expected_work_expression
      affected_proof_obligations:
        - PO-224-17
      finding: >-
        Theta(N/d) fresh independently verified challenges samples until a
        favorable instance; it does not solve one fixed instance. The verifier
        is also omitted from the producer-only cost.

    - id: RT-226-R3
      severity: major
      classification: pareto_schema
      title: non_solver_marked_sota_comparison_admissible
      affected_claims:
        - pareto-frontier.yaml#root_mass_output_G.sota_delta
      affected_proof_obligations:
        - PO-224-20
        - PO-224-21
      finding: >-
        The row explicitly sets ecdlp_solver false, so ordinary ECDLP SOTA
        comparison is inadmissible. Numeric zero misstates an undefined
        comparison and must be not_applicable.
      required_values:
        comparison_admissible: false
        claimed_time_exponent_improvement: not_applicable
        claimed_memory_exponent_improvement: not_applicable
        claimed_data_or_query_exponent_improvement: not_applicable

    - id: RT-226-R4
      severity: major
      classification: pareto_interpretation
      title: lower_bound_profiles_presented_as_exact_frontier_rows
      affected_claims:
        - pareto-frontier.yaml#collision_low_preprocessing_single
        - pareto-frontier.yaml#collision_table_tradeoff_single
        - pareto-frontier.yaml#collision_full_table_single
        - pareto-frontier.yaml#collision_table_tradeoff_amortized
      affected_proof_obligations:
        - PO-224-20
      finding: >-
        The proof gives necessary collision constraints and no construction at
        every displayed boundary point. Exact time exponents and dominance are
        formal lower-bound-profile comparisons, not an achieved frontier.

    - id: RT-226-R5
      severity: minor
      classification: presentation
      title: parameter_and_access_fields_incomplete
      affected_claims:
        - pareto-frontier.yaml#definitions
        - pareto-frontier.yaml#collision_low_preprocessing_single.data_query_access_exponent
      affected_proof_obligations:
        - PO-224-20
      finding: >-
        Polynomial excess rows need 0<=kappa<=1-beta<=1, and a prose upper
        bound on table accesses is not a quantitative exponent.

  required_controls:
    - id: RT-226-C1
      name: encoding_state_erasure_mutation
      action: >-
        Preprocess known constant encodings, retain exact recognition state,
        discard handle objects, and decide whether every retained record still
        contributes to P. If not, instantiate the success-set violation of
        equation (1); if yes, serialize that definition and rerun the proof.
      execution: proof_only_completed
      experiment_required: false

    - id: RT-226-C2
      name: retry_reuse_algebra_audit
      action: >-
        Split rebuild_each_attempt from reuse_once and recompute each Pareto
        row using C_pre+online/s for reuse.
      execution: proof_only_completed
      experiment_required: false

    - id: RT-226-C3
      name: root_mass_sota_schema_check
      action: >-
        Enforce ecdlp_solver=false implies comparison_admissible=false and
        ordinary SOTA deltas not_applicable.
      execution: static_artifact_check_completed
      experiment_required: false

  counterexample_or_mutation:
    cheapest: RT-226-C1
    implementation_required: false
    experiment_required: false
    decisive_condition: >-
      Equation (1) is false if exact retained encoding-recognition state can be
      classified outside P; otherwise the model must explicitly forbid that
      classification and the restricted theorem survives.
    cheapest_package_blocker: RT-226-C3

  reconstruction:
    RT_215_C1: PASS
    d_half_obstruction: PASS
    affine_closure: PASS_UNDER_REPAIRED_MODEL
