    ordinary_sota_delta:
      time: 0.0
      memory: 0.0
      data_or_query: 0.0
    note: >-
      Producer-only rows are not ordinary ECDLP solvers until downstream
      Cheon work, verification, and inverse success are included.

  pareto_audit:
    rows:
      - row: pollard_rho_ordinary_single
        dominated_by: PASS
        sota_delta: PASS
      - row: collision_low_preprocessing_single
        dominated_by: PASS_AS_FORMAL_PROFILE
        sota_delta: REVISE_INCOMPLETE_ECDLP_PATH
      - row: collision_table_tradeoff_single
        dominated_by: PASS_AS_FORMAL_PROFILE
        sota_delta: REVISE_RETRY_AND_TASK_SCOPE
      - row: collision_full_table_single
        dominated_by: PASS_AS_FORMAL_PROFILE
        sota_delta: REVISE_RETRY_AND_TASK_SCOPE
      - row: collision_table_tradeoff_amortized
        dominated_by: PASS_AS_FORMAL_PROFILE
        sota_delta: PASS_NOT_APPLICABLE
        cost_expression: REVISE
      - row: root_mass_output_G
        dominated_by: PASS
        sota_delta: REVISE_MUST_BE_NOT_APPLICABLE
    all_rows_checked_against_local_rows: true
    global_frontier_supported: false

  heuristic_challenges:
    - >-
      No empirical heuristic is used; the surviving statement is a theorem
      only inside the repaired random-encoding generic model.
    - >-
      No toy or cryptographic-scale experiment can repair the missing advice
      definition; this is a proof-model obligation.

  cost_model_challenges:
    - Count every retained encoding-derived recognition record in P.
    - Charge construction, storage, access, and data movement for advice.
    - Separate rebuild_each_attempt from reuse_once.
    - Do not use average-over-alpha success as iid fixed-instance retry success.
    - Add verifier work to every end-to-end detectable-success row.
    - Do not amortize peak memory or resident data by B.

  reduction_and_scope_challenges:
    - >-
      Cheon auxiliary-input DLP and generic nonlinear-target hardness remain
      binding prior art; no novelty or first claim is available.
    - >-
      Ordinary input does not contain alpha^dG, and producer output alone is
      not a completed ECDLP reduction.
    - >-
      Pairings, nonlinear maps, coordinate structure, leakage, alpha-dependent
      advice, quantum algorithms, and uncharged multi-instance state remain
      outside the narrow result.

  narrowest_supported_statement: >-
    In a prime-order randomly encoded generic group, with alpha uniform in
    F_r^*, oracle-issued output, advice independent of the random injection,
    and every retained encoding/equality-recognition record counted and fully
    charged, a capped ordinary producer has success at most
    (P(q_g+1)+binom(q_g+1,2)+d)/N. Constant excess over d/N forces
    Omega(sqrt(N)) capped and expected fully charged single-instance producer
    work. Constant correctness alone does not: d=N/2 and output G give
    correctness 1/2 at constant producer cost.

  next_concrete_action: >-
    Dispatch one proof-only repair that closes the encoding/advice definition,
    re-proves the affected obligations, splits preprocessing retry regimes,
    and corrects all non-solver SOTA fields. Do not run an experiment.

