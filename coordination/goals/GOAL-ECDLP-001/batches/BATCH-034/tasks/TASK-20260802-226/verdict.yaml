  id: RT-20260802-226
  task_id: TASK-20260802-226
  role: red-team
  verdict: REVISE
  claim_under_review: >-
    TASK-224's repaired producer-only generic nonlinear-target bound, its
    fixed-transcript and exact-root-union proof, capped and expected-work
    consequences, retry and reuse accounting, and complete Pareto package.

  immutable_snapshot:
    commit: 79008962c5649785c9b0b60eb8f8a904c0e62890
    parent: 14763e911251898fae4a3d825c97931fe6114bbd
    reachable_from_head: true
    source_paths_match_snapshot: true
    source_blobs_verified: true
    sources:
