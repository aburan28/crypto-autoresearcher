        target-dependent/adaptive witnesses are excluded.

  new_findings:
    - id: NF1-vacuous-transformed-tail-threshold
      severity: critical
      category: operational_heuristic_gate
      finding: >-
        Comparing log-transformed multiplicity metrics to b^2 makes the tail
        gate impossible to fire under the heavy cap and automatically passes
        its Clopper-Pearson criterion.
    - id: NF2-null-destroying-duplicate-rule
      severity: critical
      category: control_validity
      finding: >-
        Zero tolerance for ordinary within-side scalar collisions is
        incompatible with the cited uniform occupancy baseline unless a
        collision-free constructor is explicitly frozen.
    - id: NF3-undefined-N0-label-assignment
      severity: critical
      category: control_construction
      finding: >-
        The Feistel permutation is specified, but the orbit-to-label assignment
        and exact meaning of balance are absent, so N0 cannot be implemented.
    - id: NF4-permutation-work-missing-from-envelope
      severity: critical
      category: resource_accounting
      finding: >-
        At least 343576412160 required Feistel round hashes are missing from the
        scaled operation total, before cycle-walk amplification.
    - id: NF5-underdefined-selector-and-quotient-tolerance
      severity: major
      category: executable_controls
      finding: >-
        The optional selector lacks a frozen pilot/statistic/budget and the
        quotient tolerance contains an undefined denominator n.
    - id: NF6-concurrent-working-tree-drift
      severity: operational_warning
      category: artifact_isolation
      finding: >-
        Uncommitted edits appeared in all three producer paths after preflight. The
        immutable snapshot remains valid, but the later archive must use
        explicit path staging and must not absorb those bytes.

  complete_discharge_gate:
    verdict: REVISE
    passed_repairs:
      - F1-output-sensitive-join-and-heavy-output
      - F3-full-clustered-B2-power
      - F4-constant-convention
      - F6-provenance
    unresolved_repairs:
      - F2-operational-H3-H4-and-duplicates
      - F5-controls-model-selection-and-resource-completeness
    statement: >-
      Preserve the new ID and all passing repairs, but create another additive
      versioned replacement before experiment design. Do not edit this
      immutable snapshot in place.

  cheapest_falsification_control:
    name: frozen-tuple globally balanced antisymmetric-label integer Z/NZ null
    verdict_as_written: REVISE
    why_cheapest: >-
      Once N0 is made executable, this control exercises the selector, D/Y/X/I
      separation, deduplication, heavy-output rule, factorial moment, Boolean
      B2 fit, zero handling, and cost counters using integer/hash operations
      only. It avoids elliptic-curve ladder work and directly attacks the two
      highest-risk false-positive routes: multiplicity masquerading as
      distinct success and nondecaying label artifacts.
