    interface_preservation:
      verdict: REVISE
      detail: >-
        The join interface and full-point equality are preserved, but N0 lacks
        the exact label-map interface and the resource interface omits its
        permutation work. Those losses prevent an exact control-to-treatment
        comparison.
    ceiling_and_nearby_control:
      verdict: REVISE
      detail: >-
        The pooled method ceiling is correct, and N1 is the right nearby-object
