    - gate: asymptotic_full_cost_arithmetic
      verdict: PASS
      recomputation: >-
        Candidate raw time exponent 2/3-gamma_B plus one third of storage
        exponent 1/3 gives full-cost exponent 7/9-gamma_B. Subtracting rho's
        1/2 gives raw crossover 1/6 and full-cost crossover 5/18. These are
        exact exponent calculations under KN-TECH-035's declared proxy.
      limitation: >-
        KN-TECH-035 does not supply concrete constants. The proposal correctly
        treats these rows as exponent-only.

    - gate: conditional_paley_zygmund_algebra
      verdict: PASS
      recomputation: >-
        From E[X(X-1)]<=kappa*mu^2, E[X^2]<=mu+kappa*mu^2. Paley-Zygmund at
        threshold zero gives P(X>0)>=mu/(1+kappa*mu), and Markov gives
        P(X>0)<=mu. For finite kappa and gamma_X<1/3, mu tends to zero and the
        Boolean and distinct-count exponents agree. This validates only the
        conditional algebra; the operational H3/H4 gate below is REVISE.

    - gate: narrowed_pooled_method_ceiling
      verdict: PASS
      detail: >-
        For a fixed target-independent M=N^(1/3+o(1)) label map with minimum
        fiber at least (N/M)N^(-o(1)), the pooled per-pair exact-hit probability
        is at most (M/N)N^o(1). Thus pooled multiplicity enrichment is at most
        M*N^o(1), gamma is at most 1/3+o(1), and distinct enrichment cannot
        exceed multiplicity enrichment. Pointwise targets, irregular fibers,
        advice, adaptive labels, and target-dependent selection remain
        explicitly excluded.

    - gate: scaled_resource_sum_arithmetic
      verdict: PASS
      recomputation:
        schedule_scale_factor: 32
        roots_per_arm_by_b:
          9: 196608
          12: 393216
          15: 786432
          18: 1572864
          21: 3145728
          24: 6291456
          27: 12582912
        roots_per_complete_arm: 24969216
        group_equivalents_max: 412325249024
        integer_and_synthetic_ops_max: 1109569568768
        retained_bytes_max: 163603021824
        worker_seconds_max: 3168000
      detail: >-
        Every printed total is exactly 32 times the predecessor total. This
        passes arithmetic identity only; the completeness/feasibility gate is
        REVISE because newly mandatory work was not added.

    - gate: pareto_honesty_and_sota_delta
      verdict: PASS
      detail: >-
        Rho/vOW dominates for gamma<=1/6. Above 1/6 the candidate buys lower
        raw time with N^(1/3) memory and is Pareto-incomparable; it does not
        clear the declared full-cost advancement boundary until gamma>5/18.
        The deltas 1/6-gamma_B in raw time, 5/18-gamma_B in full cost, and
        +1/3 in storage reproduce. realized_delta remains null.

    - gate: low_prior_and_premature_closure_guard
      verdict: PASS
      detail: >-
        The proposal retains probability 0.005 for gamma>5/18, low priority,
        high implementation and validation cost, and a scoped falsification
        boundary. It neither inflates its prior nor uses low prior as a closure
        argument.

    - gate: conditional_target_claim_ceiling
      verdict: PASS
      detail: >-
        The proposal is exponent-first and conditional, but explicitly claims
        no observed gamma, theorem, attack, breakthrough, crypto-scale
        validation, or deployed-system impact. Any finite pass would justify
        further proof work only.

    - gate: proposal_only_boundary
      verdict: PASS
      detail: >-
        The immutable snapshot creates no experiment ID or specification,
        performs no implementation or run, claims no evidence, requests no
        hypothesis/RQ transition, and grants no execution authority.

  repair_gate_reviews:
    - defect_id: F1-output-sensitive-join-and-heavy-output
      gate: root_algorithm_denominator_work_and_heavy_output_semantics
      verdict: PASS
      recomputation: >-
        D=|A||B| is an arithmetic offset only. Building the smaller deduplicated
        full-point multimap, probing exact complements Q-S_B, streaming every
        matching witness-bucket Cartesian product, and verifying every derived
        scalar costs O(L polylog L+Y) non-group work plus the declared list
        construction. The cap ceil(64L log2(max(L,2))) is N^(1/3+o(1)); a cap
        hit becomes invalid_heavy_output, never I=0 and never a silently
        truncated observation. Hash retry and stable sort-merge fallback are
        explicitly charged.
      limitation: >-
        The diagnostic exact replay after a heavy root has no finite stage
        budget. Because the root blocks inference rather than becoming a
        negative outcome, this does not corrupt the Boolean estimand, but the
        replay must be budgeted or reduced to an exact bucket-count witness in
        any future protocol.

    - defect_id: F2-operational-H3-H4-and-duplicates
      gate: finite_second_moment_multiplicity_and_duplicate_rules
      verdict: REVISE
      sound_parts:
        - >-
          Equal curve/model/root weighting, curve-level summaries, 20000
          whole-curve resamples, kappa0=8, simultaneous bounds, explicit
          PASS/FAIL/INCONCLUSIVE branches, zero-denominator handling, and
          exact-zero preservation are now present.
        - >-
          H4 has explicit slope thresholds U_delta<=1/24 for survival and
          L_delta>=1/16 for failure, with a gap classified inconclusive.
      blockers:
        - id: H4-tail-event-is-vacuous
          severity: critical
          detail: >-
            The H4 metrics are already log2(1+quantity), yet finite_tail marks
            a curve bad only when a transformed metric exceeds b^2. Under the
            heavy cap, the largest transformed Y/multiplicity metric is at
            most log2(1+C_emit): 15.807380 at b=21, 17.000011 at b=24, and
            18.169930 at b=27, versus thresholds 441, 576, and 729. The other
            transformed duplicate metrics are no larger. Therefore q_b is
            identically zero on every admitted root; with 192 curves the
            Bonferroni one-sided Clopper-Pearson upper bound for zero bad curves
            is 0.0292703, so U_q<=0.05 passes automatically. The purported tail
            check cannot falsify H4.
        - id: within-side-scalar-zero-tolerance-conflicts-with-null
          severity: critical
          detail: >-
            The proposal declares any within-side scalar duplicate an
            implementation invalidation and H4 failure, while its own uniform
            occupancy support permits ordinary birthday duplicates. At b=27,
            L=512 and N approximately 2^27, the independent-occupancy duplicate
            probability is about 0.000974655 per side/root. Across 32L roots,
            192 curves, and four models, the expectation is about 12264
            one-side duplicate events, or 24528 for both sides. Unless the list
            constructor is explicitly collision-free, the zero-tolerance rule
            almost surely rejects a healthy null and misclassifies mathematical
            multiplicity as implementation failure.
        - id: bootstrap-bound-construction-not-fully-frozen
          severity: major
          detail: >-
            The record names a simultaneous 99% max-statistic curve bootstrap
            but does not define the centered/studentized statistic, interval
            inversion, or the confidence construction for the separate mu
            lower bounds. Two conforming implementations can produce different
            survival verdicts.

    - defect_id: F3-full-clustered-B2-power
      gate: clustered_boolean_power_with_nuisance_terms
      verdict: PASS
      recomputation:
        residualized_slope_information: 27.766022800414
        composite_sd_from_declared_effects: 0.564025708634
        conservative_sd_used: 0.60
        curves_per_size_42:
          lambda: 1.580984936481
          prospective_power: 0.474537391373
        curves_per_size_192:
          independent_outer_clusters_total: 1344
          lambda: 3.380287980549
          prospective_power: 0.958668050179
      detail: >-
        Residualizing (b-18)ln(2) against a free intercept and 2^(-b/3) on the
        seven-size grid reproduces 27.766022800414. The four-model average of
        curve SD 0.55 and nested-model SD 0.25 has composite SD 0.5640257, so
        the frozen 0.60 value is conservative. The 42- and 192-curve formulas
        reproduce 0.4745 and 0.9587 power respectively. The B2 model retains a
        free beta, model effects, curve and model-within-curve effects, exact
        Bernoulli zeros, and 192 independent curves at every size.
      limitation: >-
        The 0.9587 figure is a prospective Gaussian cluster-level design
        calculation, not an executed full-GLMM simulation and not evidence.
        The proposal correctly requires 20000 deterministic exact-fitter
        replicates in every nuisance cell, with power, type-I, and
        nonconvergence gates, before any full run. That confirmation remains
        unauthorized and unexecuted.

    - defect_id: F4-constant-convention
      gate: exponent_only_rows_and_separately_matched_constants
      verdict: PASS
      recomputation: >-
        Every displayed rho/vOW, BSGS, and candidate comparison row is an
        exponent-only row and strips all constants, including 0.886 and 24.
        The separate future matched-concrete formula charges
        0.886*sqrt(N) for rho/vOW and E[R] times the complete candidate work,
        with E[R]=1/P(I=1). log2(24)=4.5849625007 reproduces.
      limitation: >-
        No concrete advantage is claimed, and the future formula still needs
        measured primitive, communication, storage, and hardware-time
        constants before it can become a concrete table.

    - defect_id: F5-controls-model-selection-and-resource-completeness
      gate: scalable_controls_model_persistence_selector_memory_and_budget
      verdict: REVISE
      sound_parts:
        - >-
          The signed-domain Feistel construction is deterministic, has a
          frozen byte order and seed frame, uses O(1) persistent storage,
          charges actual cycle walks, and invalidates rather than reseeds on a
          cap miss. The SHAKE256 empty digest and the injected Feistel KAT both
          reproduce exactly: outputs [0,4,2,3,1] with walk counts
          [2,1,2,2,1].
        - >-
          Model-specific and pooled outputs, nested-effect variance, crossing
          fractions, pairwise contrasts, primary-selection-disabled semantics,
          max-composed selector exponents, fixed-base reuse restrictions,
          statistical non-reuse, packed widths, and largest-cell per-worker and
          aggregate throughput metrics are now explicit.
        - >-
          The packed-memory arithmetic reproduces widths
          (24,24,32,16,16), 154480 bytes per b=27 worker, and 5991936 bytes for
          32 workers plus a one-MiB shared ring.
      blockers:
        - id: N0-label-map-not-defined
          severity: critical
          detail: >-
            N0 says only to derive flip(i) and assign opposite signed labels.
            It never defines the label modulus/range, the map from pi(i) or i
            to a label, or how exact global balance is obtained when the
            number of nonzero scalars is not divisible by the number of labels.
            For example, N=103 and M=ceil(N^(1/3))=5 leaves 102 mod 5 = 2.
            If balance means sign balance only, the control is not the declared
            same-shape M-label null; if it means equal M-label counts, it is
            impossible on that input. The construction is therefore not an
            executable frozen N0.
        - id: mandatory-permutation-work-omitted-from-resource-envelope
          severity: critical
          detail: >-
            The stated 1109569568768 operation maximum is exactly 32 times the
            predecessor total. Its four 32L join/hash arms already consume
            1099444518912 operations before synthetic controls. Even under the
            optimistic lower bound of two label-permutation lookups per list
            entry and one ten-round Feistel evaluation per lookup, one control
            needs 171788206080 round hashes and N0 plus N1 need at least
            343576412160. Actual cycle walks can multiply that by up to 64.
            These mandatory evaluations are named in W_permutation but absent
            from the purported conservative exact upper envelope.
        - id: selector-not-executable
          severity: major
          detail: >-
            The optional selector has no frozen pilot-root count, normalization
            formula, seed domains, finite acceptance rule, or concrete work and
            storage allocation. The max-plus exponent composition is correct,
            and primary selection is disabled, but the optional branch is not
            a reproducible selector and must be removed or fully frozen before
            it can enter a protocol.
        - id: exact-quotient-tolerance-has-undefined-n
          severity: major
          detail: >-
            The exact-quotient acceptance formula divides by lowercase n,
            which is not defined as group size, sample count, root count, or
            another quantity. The finite tolerance is therefore not
            independently executable.
        - id: heavy-replay-and-cycle-cap-feasibility-not-budgeted
          severity: major
          detail: >-
            The resource schedule does not reserve the independent exact replay
            required after heavy output and does not propagate the operational
            64-walk permutation cap into stage maxima. Invalidating on a miss is
            epistemically safe, but it does not make the prospective schedule
            feasible or complete.

    - defect_id: F6-provenance
      gate: authoring_input_versus_output_snapshot_semantics
      verdict: PASS
      detail: >-
        The immutable proposal labels 9ae810de... as an authoring/control-plane
        input, ead1ab61d as a dispatch-head input, and 339bfb2c... as the
        predecessor output snapshot. It leaves its own output snapshot null and
        unknown until TASK-20260808-3425ce. The queue and verified receipt now
        bind the actual output snapshot 9d5bf42f... and proposal hash 4ceb6c46....
        Native OpenAI Codex, gpt-5.6-sol, max authoring effort, no fallback, no
        degradation, and non-Bedrock provenance are internally consistent.

  proof_architecture_checks:
    exact_baseline_reproduction:
      verdict: PASS
      detail: >-
        Uniform D/N occupancy, exact 1/K quotient behavior, and exponent-only
        rho/BSGS rows are named as baseline fixtures without enrichment.
    strictness_witness:
      verdict: PASS
      detail: >-
        No achieved improvement is claimed. Any future strictness requires the
