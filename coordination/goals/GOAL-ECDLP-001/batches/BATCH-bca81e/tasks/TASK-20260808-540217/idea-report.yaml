  design_repairs:
    boolean_success: >-
      Exact root variables D,Y,X,V,S and kappa_N are defined. Paley-Zygmund
      supplies the explicit bridge under HA-3. Expected match multiplicity never
      enters inverse-success accounting.
    statistics: >-
      Roots are minimum observations, models are repeated measures, curves are
      resampling clusters, cross-pair binomial intervals are forbidden, the
      intercept is free, exact floor offsets and fixed finite-size sensitivities
      are preregistered, and pooling/zero-count rules are frozen.
    controls: >-
      A global balanced antisymmetric Z/NZ label null, exact quotient on
      Z/(M^3)Z, planted gamma values 1/6, 5/18, and 3/10, and exact
      short-Weierstrass isomorphisms have executable definitions, expected
      outputs, run order, and separate apparatus/mechanism dispositions.
    power_and_schedule: >-
      Five sizes, 32 curves, four models, and 256 roots per curve/model are
      fixed. The conservative calculation gives approximate 0.956 power for
      gamma=0.30 versus 5/18 under its stated assumptions; a smaller gap may be
      inconclusive.
    budget: >-
      Synthetic controls run first. The later prospective package is bounded by
      226800 wall seconds, 455 CPU-hours, eight shards, 2 GiB aggregate memory,
      1 GiB artifacts, and explicit primitive-operation caps. Resource failure
      cannot become ECDLP evidence.
    proof_architecture: >-
      The map includes exact baseline reproduction, multiplicity/Boolean
      observation collision, fixed quantifier order, three transforms, narrowed
      method ceiling, nearby objects, single-responsibility obligations, and all
      remaining heuristics.
    novelty_and_pareto: >-
      Current corpus coverage and exact hashes are bound; novelty stays
      unverified. Time, memory, full cost, preprocessing, advice, labels/queries,
      communication, hardware, verification, and multi-target axes are explicit.

