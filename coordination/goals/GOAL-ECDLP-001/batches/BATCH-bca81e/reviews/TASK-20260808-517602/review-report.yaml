  algebra_and_correctness_checks:
    signed_y_antisymmetry:
      status: satisfied_conditionally
      finding: >-
        For odd prime subgroup order, a nonidentity subgroup point cannot have
        y=0 because that would give order two. Centering y and handling O
        separately therefore gives h_y(-R)=-h_y(R) modulo M. Infinity,
        serialization, and centered-representative fixtures remain mandatory.
    affine_self_reduction:
      status: satisfied
      finding: >-
        For nonzero a and uniform b, Q'=[a]Q+[b]P is uniform in G for every
        fixed Q. Disjoint root seed domains can support independent restarts,
        subject to the implementation audit already required by HA-4.
    scalar_recovery_and_V_equals_X:
      status: satisfied_conditionally
      finding: >-
        If A=[r1+r2]P, B=[r3+r4]P, and A+B=Q'=[a*k+b]P, prime-order scalar
        uniqueness gives r1+r2+r3+r4=a*k+b modulo N. Hence the stated k_hat is
        k and passes [k_hat]P=Q. Multiple representations of one exact A have
        the same scalar sum modulo N, so mathematically V=X; any observed
        difference is an implementation failure.
    selected_pair_enumeration:
      status: satisfied_conditionally
      finding: >-
        With L=M=N^(1/3+o(1)) and regular M-way fibres, each selected pair list
        has L^2/M=N^(1/3+o(1)) entries. Bucket enumeration and exact point-sum
        lookup therefore cost N^(1/3+o(1)) per root only under HA-1's load and
        multiplicity caps.

