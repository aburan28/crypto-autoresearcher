  findings:
    - id: R1-marginal-success-and-clustering-validation
      severity: critical
      blocking: true
      category: success_probability_and_statistical_estimand
      observation: >-
        The algebraic Paley-Zygmund bridge is explicit, but the estimator is a
        conditional mixed model with an unproved D exposure while gamma_s is
        defined by a marginal p_N. Its random-effect and bootstrap details are
        not frozen, and no control plants polynomial kappa_N or polynomial
        p_N/E[X] decay.
      impact: >-
        A fitted gamma may be a conditional exposure slope rather than the
        Boolean family-average exponent used by the runtime. Passing the
        current planted arms cannot establish that the analysis detects the
        match-clustering failure that would invalidate inverse-success
        accounting.
      required_revision:
        - Define a marginal family-level gamma_s estimator or prove and freeze the conversion from the conditional model.
        - Remove D as an exact exposure or state and validate the additional proportional-hazard assumption.
        - Freeze the random-effect law, fit, size-stratified cluster resampling, test statistic, and confidence-bound construction.
        - Add and power a matched-mean polynomial-clustering control for kappa_N and p_N/E[X].

    - id: R2-control-coverage-and-pre-treatment-sequencing
      severity: major
      blocking: true
      category: controls_and_proof_search_map
      observation: >-
        The balanced-null and exact-quotient definitions are executable and the
        planted exponent arithmetic is correct, but one interval per planted
        value is not a coverage study, the planted mixture does not realize the
        proof map's observation collision, and isomorphism apparatus fixtures
        are co-scheduled with treatment in S4.
      impact: >-
        A false-positive or anti-conservative analysis can pass the stated
        control gates, and treatment data can be generated before the complete
        isomorphism apparatus gate is known to pass.
      required_revision:
        - Validate coverage by repeated complete synthetic datasets or an exact finite-sample reference.
        - Instantiate the diffuse-versus-concentrated observation-collision arm named in proof_search_map.
        - Move all isomorphism correctness fixtures before treatment and require three distinct nonredundant public u values.
        - Separate the treatment-coupled heterogeneity diagnostic from the pre-treatment apparatus gate.

    - id: R3-exact-budget-is-incomplete
      severity: major
      blocking: true
      category: cost_and_resource_budget
      observation: >-
        The published group-addition total is the exact sum of its listed list,
        P-table, selected-pair, and verification components, but it excludes
        Q' self-reduction, a Q-table or variable-base substitute, and Q'
        isomorphism transforms. Synthetic dual-map reuse is ambiguous, and the
        raw bucket-count obligation lacks a byte encoding compatible with the
        1 GiB artifact cap.
      impact: >-
        S2 cannot test a genuinely worst-case schedule, and a later run may hit
        an operation or artifact cap for work the frozen proposal promised to
        retain. Resource exhaustion would then be infrastructure rather than
        evidence, but the supposed fixed design would still be unusable.
      required_revision:
        - Add every self-reduction, table-construction, transform, label, verification, and serialization operation to the cap.
        - Freeze whether planted arms reuse prior map outputs, evaluate both maps, or evaluate the selected mode only.
        - Specify lossless raw-artifact encoding and recompute the byte cap before throughput gating.
        - Recompute wall and CPU forecasts with a 20-percent reserve after the exact caps are corrected.

