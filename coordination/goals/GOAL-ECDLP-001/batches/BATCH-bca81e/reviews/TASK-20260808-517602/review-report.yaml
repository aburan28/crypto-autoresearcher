  cheapest_falsification_control:
    name: matched-mean Boolean-bridge clustering stress fixture
    priority: before_any_curve_or_full_selector_control_in_a_future_authorized_design
    construction: >-
      Generate two exact root-record streams at the five frozen N values using
      only deterministic integer arithmetic and the frozen cluster/seed layout.
      In the diffuse stream set X=V=Y=1 with probability
      mu_N=N^(-1/3+gamma_x) and zero otherwise. In the concentrated stream set
      X=V=Y=c_N with probability mu_N/c_N and zero otherwise, where
      c_N=ceil(N^delta) for a frozen delta such as 1/12. Both streams have the
      same E[X] and E[Y] exponent, but the concentrated stream has
      kappa_N of exponent delta and Boolean p_N exponent lower by delta. Set
      S=1[V>=1] exactly and feed both streams through the unchanged proposed
      marginal estimator, kappa calculation, zero-count rules, sensitivity
      fits, and cluster interval code.
    exact_expectation: >-
      The analysis must recover equal gamma_x, kappa slopes zero and delta,
      p_N/E[X] slopes zero and minus delta, and Boolean gamma_s values separated
      by delta, with the concentrated arm rejected by HA-3. If it reports the
      same runtime gamma for both, or its interval misses the planted gap, the
      success bridge and inference apparatus are falsified before any group
      list is built.
    why_cheapest: >-
      This is a deterministic root-table fixture requiring no elliptic-curve
      generation, scalar multiplication, pair join, external literature, or
      model search. It directly attacks the one premise that turns match
      expectation into runtime and operationalizes the proof-search-map
      observation collision more cheaply than the existing integer/hash null.
    authorization_note: >-
      This is a recommended future preregistered control only. It was not run
      here and this review does not authorize it.

  limitations:
    - >-
      This review audits a proposal snapshot, not a run. There are no run IDs,
      raw samples, measured gamma_s values, recovered keys, throughput values,
      or empirical costs to validate.
    - >-
      The local corpus scan is bounded to commit
      c3cb7eef06970e0ee0971d4efe03762ad6ba0b6b and the named neighbours.
      Knowledge MCP retrieval was unavailable and external literature was not
      checked, so novelty remains unverified.
    - >-
      The wiring calculation applies the repository's KN-TECH-035 convention.
      It establishes exponent comparisons only; constants, phasewise table
      access, bandwidth, energy, and real-machine cost remain unmeasured.
    - >-
      Even a repaired 18--30-bit design can test only its toy family and frozen
      finite-size model. It cannot validate an asymptotic gamma_s or alter the
      security assessment of deployed curves.
    - >-
      No external model probe was run. Native provenance is bound to the
      authenticated ChatGPT-backed Codex session emitted by this run.

