  boolean_root_success_audit:
    paley_zygmund_identity:
      status: satisfied
      recomputation: >-
        For nonnegative integer X, Pr[X>=1]<=E[X]. At threshold zero,
        Paley-Zygmund gives Pr[X>=1]>=E[X]^2/E[X^2]=E[X]/kappa_N. Therefore
        mu_N=N^(-1/3+gamma_x+o(1)) and kappa_N=N^o(1) imply the same exponent
        for p_N, provided V=X except with negligible apparatus-failure
        probability.
    multiplicity_separation:
      status: satisfied
      finding: >-
        D, multiplicity-weighted Y, distinct X, verified V, Boolean S, and
        kappa_N are separately defined, and neither the runtime assembly nor
        inverse-success accounting substitutes E[Y] for p_N.
    premise_explicitness:
      status: satisfied
      finding: >-
        HA-3 explicitly names subpolynomial kappa_N and Y/X, records X^2 and
        p_hat/E[X]_hat, states a slope tolerance, and makes bridge failure a
        runtime failure rather than an apparatus or ECDLP conclusion.
    premise_testability:
      status: blocking_revision
      finding: >-
        The planned treatment summaries can reveal observed clustering, but
        the design does not validate the estimator against the load-bearing
        failure mode. The planted-gamma arm chooses a quotient root with
        probability w_b; quotient roots have order-one X and order-one second
        moment, so the mixture keeps kappa_N=N^o(1) and p_N exponent-equivalent
        to E[X]. It does not create two arms with the same E[X] or E[Y] slope
        and a polynomially different Boolean p_N. No power or finite-sample
        upper-bound calculation is supplied for the required 0.02 kappa slope
        ceiling or for polynomial decay of p_hat/E[X]_hat. A toy ladder can
        only test this bridge on the ladder; it cannot establish an asymptotic
        no-clustering premise.
    required_repair: >-
      Add an exact root-record or integer/hash control with matched E[X] and
      E[Y] exponents but planted kappa_N=N^delta and p_N=E[X]N^-delta, and
      preregister the estimator, confidence bound, and power with which delta
      and the p_N/E[X] gap must be recovered before treatment interpretation.

  statistical_inference_audit:
    cluster_units:
      status: satisfied_in_concept
      finding: >-
        Roots are minimum observations, models are nested repeated measures,
        curves are family-level clusters, sizes are fixed design levels, and
        cross-pair binomial intervals are prohibited. Isomorphic models are not
        counted as independent curves.
    free_intercept:
      status: satisfied
      finding: >-
        A free alpha_s prevents a constant enrichment factor from being forced
        into gamma_s. This directly repairs the predecessor's finite-size
        pseudo-exponent defect.
    primary_estimand_alignment:
      status: blocking_revision
      finding: >-
        The claim defines p_N as a marginal probability over curve, target,
        model rule, and fresh roots. The proposed complementary-log-log mixed
        model instead adds curve and model-within-curve effects and a realized
        D exposure, which ordinarily yields a conditional slope unless the
        random-effect distribution is specified and explicitly integrated.
        No random-effect law, marginalization rule, fitting algorithm, or
        estimand-conversion is supplied. Size-varying heterogeneity can make the
        conditional and marginal gamma slopes differ.
    exact_offset:
      status: blocking_revision
      finding: >-
        `offset_exact=log(D)-(2/3)log(N) plus the exact L/M floor correction`
        is not an executable formula. Realized D already carries the L, M,
        bucket, and floor variation relevant to selected cross-pair exposure,
        so an additional unspecified floor term may double count it. More
        fundamentally, treating log D as an exact exposure assumes the Boolean
        hazard is proportional to D despite the within-root dependence that
        HA-3 exists to audit. Controls can test such a model, but cannot turn an
        unstated exposure assumption into an exact identity.
    bootstrap_and_likelihood:
      status: blocking_revision
      finding: >-
        Whole-curve Rademacher weights and 99,999 draws are stated, but the
        resampled score or residual, null restriction, size stratification,
        small-cluster correction, treatment of fitted random effects, and
        profile-likelihood parameterization are not. One interval containing
        each of three planted values is pointwise inclusion, not evidence that
        nominal 99 percent coverage is calibrated.
    pooling_rules:
      status: satisfied
      finding: >-
        Arm separation, curve-level retention, nested-model treatment, and
        slope-only pooling across sizes are explicit and block the predecessor's
        pseudoreplication route.
    zero_count_rules:
      status: satisfied
      finding: >-
        Structural D=0 roots and all-zero cells are retained, pseudocounts and
        post-hoc estimator substitution are forbidden, and separation or
        nonconvergence is inconclusive. A scoped-negative branch is permitted
        only after the complete valid schedule.
    finite_size_sensitivities:
      status: satisfied_conditionally
      finding: >-
        Eta is frozen to {-4,0,4}, the intercept is free, known floors are meant
        to be retained, and all three gates must agree. The envelope has no
        structural justification, so it is a declared sensitivity analysis,
        not a proof that 18--30-bit slopes extrapolate asymptotically.
    power_recomputation:
      status: arithmetic_satisfied_design_conditional
      values:
        size_spread_sum_squared_logN: 43.24077125263812
        conservative_information: 74387.9636013384
        conservative_standard_error_gamma: 0.005185177918497309
        alternative_gap_over_5_18: 0.0222222222222222
        noncentral_z: 4.285720291862678
        one_sided_critical_z_0_995: 2.5758293035489004
        approximate_power: 0.9563569834104666
      limitation: >-
        The 0.956 result is correct only under success probabilities 0.30--0.70,
        curve design effect at most 2, correct finite-size model, and estimator
        convergence. It is not power for an arbitrarily small epsilon above
        5/18, for the HA-3 kappa slope, for p_N/E[X] decay, or for
        representation heterogeneity. Synthetic label clusters do not measure
        the signed-y curve design effect before treatment.

  control_audit:
    balanced_antisymmetric_null:
      status: executable_with_scope_limit
      arithmetic: >-
        Cycle-walking an even-round unbalanced Feistel permutation of H positive
        representatives gives a global deterministic permutation; reduction
        modulo M makes positive-side label counts differ by at most one and the
        epsilon rule enforces h(-r)=-h(r). The same root-level selector and
        verification pipeline can be run in odd prime Z/NZ without an O(N)
        table.
      strengths:
        - It is integer/hash only and precedes every curve treatment.
        - It tests global consistency, antisymmetry, gamma_s=0, V=X, seed domains, and cost counters.
        - Thirty-two independent label-map seeds provide declared synthetic clusters.
      limitation: >-
        It is globally balanced rather than histogram-matched to the realized
        signed-y labels. The exact-D diagnostics reduce but do not prove away
        that difference. A later contract should retain a preregistered
        histogram-conditioned sensitivity or explain why balanced is the sole
        null needed for the scoped claim.
    exact_quotient:
      status: executable_and_arithmetic_satisfied
      recomputation: >-
        For b in {18,21,24,27,30}, M=2^(b/3)-1 is odd, K=M^3 has exactly b
        bits for the listed cells, and h_q(x)=x mod M is a genuine quotient on
        Z/KZ. With unit a, scalar recovery is valid. Conditional exact-match
        probability is M/K=1/M^2; D is order M^2, so E[X] and p_N are order one
        and the Boolean exponent calibrates gamma_s=1/3.
      finite_reference: >-
        Comparing p_N with a frozen exact Monte Carlo generator rather than
        forcing 1-exp(-1) is the correct finite-size treatment.
    planted_gamma:
      status: exponent_arithmetic_satisfied_but_control_incomplete
      recomputation: >-
        w_b=K^(-1/3+gamma_star)=M^(-1+3gamma_star) and
        p_mix=(1-w_b)p_null+w_b p_quot have the claimed leading exponent for
        gamma_star in {1/6,5/18,3/10}. Equality at 5/18 is correctly treated as
        a full-cost tie, and 3/10 is the powered alternative.
      blocking_limitations:
        - >-
          The rootwise quotient/null mixture has order-one X on its active
          roots and therefore does not plant the polynomial kappa_N failure
          needed to validate the Boolean bridge.
        - >-
          The stated construction says each tuple is reused under both maps,
          while the synthetic label-evaluation cap equals five single-map arm
          equivalents. The later contract must choose reuse, dual evaluation,
          or selected-mode evaluation and charge the exact choice.
        - >-
          Inclusion of three planted values in one set of intervals is not a
          repeated-sampling coverage audit.
    isomorphic_models:
      status: algebra_satisfied_sequence_revision
      recomputation: >-
        For E:y^2=x^3+A*x+B and nonzero u,
