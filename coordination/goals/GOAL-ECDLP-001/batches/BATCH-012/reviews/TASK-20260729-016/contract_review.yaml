  answers_to_the_five_card_questions:
    Q1_can_the_criterion_fire_and_fail: >-
      YES IN THE AGGREGATE, AND THAT IS ENOUGH FOR GATE R1. Under a global
      counterfactual CR-1 fires at 20 tuples (21 as the table computes it), CR-2 at 5
      (4 as computed), CR-3 at 18 and CR-4 with certainty, so the contract CAN FAIL if
      the diagnostic is wrong. It is the NAMED SETS, not the falsifiability, that are
      defective - see OBJ-2. Against PARTIAL failures the design is weak, and that
      limit is quantified in OBJ-10.
    Q2_both_denominators_and_the_replicate_schedule: >-
      PRE-REGISTERED WITHOUT AMBIGUITY. The primary reading is
      sem_rep = s_rep/sqrt(n_rep), the secondary is s_rep, s_rep is the sample standard
      deviation with denominator n_rep - 1 (stated explicitly because it is a
      silent-choice hazard), and BOTH must pass. The schedule is fixed to C-14 with its
      reason stated in advance and the temptation named - raising the count would tighten
      sem by sqrt(count) and fire the criterion on the section 5 second-order terms
      rather than on a measurement fault. The 10000-replicate diagnostic block is
      labelled as feeding no criterion, no threshold, no invalidation rule and no verdict
      at three separate places, is seeded from a separate master 120501 with a separate
      arm label so it shares no randomness with the criterion streams, and executes LAST
      so a cap bind costs it first. IT IS GENUINELY CRITERION-FREE. The one residual is
      CR-3's mis-sourced sem_001 (OBJ-7).
    Q3_is_the_identity_bin_specified_not_declared: >-
      SPECIFIED, AND THIS IS THE STRONGEST PART OF THE CONTRACT. Both OB-10 decisions are
      made explicit rather than left to the implementer - the identity bin IS eligible to
      be pre-marked with probability s/N, and a throw with g = 0 marks one bin rather than
      two and is not corrected, rejected or resampled. The structurally exact alternative
      is stated, its exact effect size is derived, and both derivations reproduce under
      independent re-derivation. Neither convention can produce a 3.000-SEM excursion at
      any declared tuple. IV-2 cases KA-6 and KA-7 test the identity accounting with zero
      tolerance.
    Q4_any_efficiency_yield_ratio_or_cost_model_consequence: >-
      NONE ANYWHERE. No occupancy-normalised efficiency E, no yield ratio R, no operation
      count, no cost-model statement; IV-6 makes computing one a scope breach that
      invalidates the run; the value 0.85 is named only to exclude it;
      matched_baseline_position_RC7 is DECLARED INAPPLICABLE with a correct reason, since
      the experiment solves no instance and Pollard-rho and BSGS are not matched baselines
      for a balls-in-bins simulation; and EV-ECDLP-008 observation O-11 is left unretracted
      and explicitly not restated. The counterfactual branch is correctly identified as O-6
      and not O-4.
    Q5_any_number_from_an_unarchived_source: >-
      NO. Every per-cell number traces to IN-1 at commit 2fb2bb7a or to arithmetic shown in
      the contract or its table. NO FIGURE IS IMPORTED FROM A REVIEW REPORT AS PRIMARY,
      FROM AN UNARCHIVED PROBE, FROM A RECOLLECTION OR FROM AN ESTIMATE. The two input
      hashes are correctly labelled as QUOTED from the TASK-20260729-006 receipt rather
      than computed, and I re-verified both against the blobs. Three numbers are wrong or
      mis-sourced but all are internal - OBJ-5, OBJ-7, OBJ-8 - and none comes from outside
      the archive.

  is_it_worth_running:
    verdict: >-
      YES, ONCE THE FOUR BLOCKING OBJECTIONS ARE DISCHARGED. NO, AS FROZEN.
    reasoning: >-
      The 27-or-28 powerless tuples do NOT make this a pre-registered experiment that
      cannot fire. The failure mode under test is GLOBAL - either the missing pre-marking
      is the whole story or it is not - so per-tuple powerlessness does not remove global
      falsifiability, and under the global counterfactual CR-1 fires at 20 tuples and CR-4
      fires with certainty. The contract therefore does not launder a null result as a
      passed test, and its declared power limit is stated before execution rather than
      discovered after, which is the right way to carry a limit. What makes it unrunnable
      as frozen is not the power limit but OBJ-1 and OBJ-2 - an outcome structure that does
      not determine its own branch for the most likely miss, and pre-registered sets that
      contradict the counterfactual the contract defines - together with OBJ-3, which
      leaves two determinism choices to the Executor in a contract whose whole premise is
      that nothing is left to the Executor's judgement. All four repairs are cheap,
      pre-data, and change no threshold except the deliberate narrowing in OBJ-4.

  most_likely_remaining_failure_in_execution: >-
    A REALISED OUTCOME THAT FALLS IN BOTH MISS BRANCHES OR IN NEITHER, WITH THE
    DISPOSITION CHOSEN AFTER THE NUMBERS ARE VISIBLE. The single most likely miss is one
    CR-1 exceedance and no CR-3 exceedance, which the frozen text assigns to no branch at
    all under the AND reading of `and or`, and which under the OR reading collides with
    MISS-STRUCTURED as soon as a second CR-3 exceedance appears. Because the branch decides
    whether EV-ECDLP-008 observation O-4 is superseded or left undischarged, the reading
    will be settled at interpretation time by TASK-20260729-020 or TASK-20260729-021 rather
    than in advance - and a post-hoc branch selection is indistinguishable in the archive
    from a pre-registered one. That is exactly the class of fault BATCH-011 suffered, and
    OBJ-1's residual definition is the two-word repair that removes it.

