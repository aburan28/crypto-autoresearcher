  reproduced_without_dispute:
    - '49 criterion-evaluable cells; RC-C dedup on (k, m, B) gives 48; the single duplicate is (k=12, m=3, B=22) at beta 0.325 and 0.350 with identical N=4001, C_red=1782, P_pred=1452.1510155838187.'
    - 'Arity split 29 at m=2 and 19 at m=3.'
    - 'C-14 realised schedule 37 at 100 replicates and 11 at 30; the 10-replicate tier is unreachable; largest C_red is 91922 at T-18-3-B82. IN-1 replicates equals the C-14 value at all 49 cells.'
    - 'All 49 C_red are even, so C_red/2 is always an exact integer and the odd-C_red rule can only fire on a read error.'
    - >-
      THE E[distinct] FORMULA IS CORRECT AND EXACT, and its derivation is correct:
      E[distinct] = N - (1 - s/N)[(N-1)(1-2/N)^(C/2) + (1-1/N)^(C/2)]. Pre-marking and
      throwing are independent, P(j not pre-marked) = 1 - s/N for every j by
      exchangeability, N odd gives P(miss j) = 1 - 2/N per throw for j nonzero and
      1 - 1/N for j = 0, and linearity of expectation needs no cross-bin independence.
    - >-
      E[distinct] - P_pred = (1 - s/N)[e^(-lam)(1+lam) - e^(-lam/2)] + O(1/N) confirmed;
      the largest gap between the exact value and the asymptotic form over the 48 tuples
      is 3.05e-05 bins.
    - 'f < g for every positive lambda, proved independently: the inequality reduces to h(lam) = (2+lam)e^(-lam/2) < 2 with h(0) = 2 and h decreasing.'
    - 'lambda range 0.002208576767147994 (T-18-2-B34) to 0.495756707753721437 (T-16-3-B58); max f = 0.130625 bins at T-16-3-B58; max exact process bias 0.130512 bins, so `at most 0.131 bins` holds.'
    - 'MAX PROCESS BIAS = 0.07519 SEM at T-12-2-B46. Contract says 0.0752 at T-12-2-B46. MATCH.'
    - 'MAX IDENTITY-CONVENTION DIFFERENCE at m=2 = 0.08947 SEM at T-12-2-B62 (0.167939 bins). Contract says 0.0895 at T-12-2-B62. MATCH.'
    - 'MAX IDENTITY-CONVENTION DIFFERENCE at m=3 = 0.00043 SEM at T-12-3-B22. Contract says below 0.001. HOLDS.'
    - >-
      BOTH CONVENTION FORMULAS RE-DERIVED FROM SCRATCH AND CONFIRMED. At m=2 the
      structurally exact pre-mark is bin 0 and E_struct - E_unif = (1-1/N)(C*-A) =
      (1-1/N)(e^(-lam/2) - e^(-lam)) + O(1/N). At m=3 the structurally exact set is B/2
      whole antipodal pairs, P(j pre-marked) = B/(N-1) for j nonzero and 0 for j = 0, and
      E_struct - E_unif = (B/N)(A - C*) = (B/N)(e^(-lam) - e^(-lam/2)) + O(1/N).
    - 'BINDING CONSEQUENCE CARRIED: neither the identity-bin convention nor the process bias can produce a 3.000-SEM excursion at any declared tuple, so no outcome may be explained by either, in either direction.'
    - 'CR-3 shift T is correct: the true expected shift is T - (s/N)f(lam) + O(1/N), and the neglected correction is below 1e-3 SEM at every tuple.'
    - 'CR-3 paired-difference denominator sqrt(sem_rep^2 + sem_001^2) is CORRECT: the arms use independent streams and the shared quantities are constants carrying no variance.'
    - 'Tail constants: P(|t_99| > 3.000) = 0.003416 (claimed 0.00342, correct); P(|t_29| > 3.000) = 0.005499 (claimed 0.00552, correct to 0.4 percent); P(|Z| > 3.000) = 0.002700 (claimed 0.00270, correct).'
    - 'CHANCE-ALARM BUDGET: rebuilt total 0.37582 against the declared 0.377, so THE DECLARED FIGURE IS A VALID UPPER BOUND, and the union-bound direction is right (expected exceedances bound P(at least one) by Markov).'
    - 'P_pred recomputed to full double precision at the four INV-4-failing tuples agrees with the quoted P_pred to 0.0 absolute, and (mu_001 - P_pred)/sd_001 reproduces the quoted z to 12 decimals. IV-2 case KA-8 is feasible and will pass.'
    - 'IN-2 does carry n_evaluable_on_measured_B = 49 and n_eval_denominator = 49, so the IV-4 cross-check is implementable as written.'

  objections:
    - id: OBJ-1
      severity: BLOCKING
      target: 'falsification_criterion, the P-MISS branch split'
      statement: >-
        THE PRE-REGISTERED OUTCOME STRUCTURE IS PROVABLY NEITHER DISJOINT NOR
        EXHAUSTIVE, AND THE CONTRACT ASSERTS BOTH. MISS-MARGINAL reads `Exactly one
        tuple fails CR-1 with 3.000 at most |z_sem| less than 10.000, and or exactly
        one tuple fails CR-3 with 3.000 at most |z_shift| less than 10.000, with CR-2
        not firing at any tuple and CR-4 not firing`, and the contract then states
        `Any realised outcome falls in exactly one of P-CORE, MISS-STRUCTURED and
        MISS-MARGINAL, because the three are defined by disjoint conditions and their
        union is total`. The connective `and or` admits exactly two readings and each
        breaks one of the two asserted properties. UNDER THE OR READING, DISJOINTNESS
        FAILS - take one CR-1 failure at |z_sem| = 4.0, three CR-3 failures all below
        10, CR-2 clean, CR-4 clean; MISS-STRUCTURED holds because CR-3 fails at 2 or
        more, and MISS-MARGINAL holds because its CR-1 clause is satisfied and CR-2 and
        CR-4 are clean. UNDER THE AND READING, EXHAUSTIVENESS FAILS - take one CR-1
        failure at |z_sem| = 4.0, zero CR-3 failures, CR-2 clean, CR-4 clean; no
        MISS-STRUCTURED disjunct holds and MISS-MARGINAL requires exactly one CR-3
        failure, so the outcome falls in no branch at all. The second case is not
        exotic - it is THE SINGLE MOST LIKELY MISS OUTCOME, because the expected CR-1
        chance exceedance count is 0.187 and CR-3's counterfactual set is a strict
        subset of CR-1's. Because the branch decides whether EV-ECDLP-008 observation
        O-4 is SUPERSEDED or left UNDISCHARGED, an ambiguity here is a live route to
        choosing the disposition after the numbers are visible, which ST-5 forbids and
        cannot prevent when the text itself is ambiguous.
      discharging_change: >-
        Define MISS-MARGINAL RESIDUALLY rather than by an enumerated condition, in a
        versioned protocol_amendment, replacing the MISS-MARGINAL sentence with
        exactly - MISS-MARGINAL is defined as P-MISS AND NOT MISS-STRUCTURED. Its
        disposition is unchanged. This makes the three branches disjoint and exhaustive
        by construction, removes the connective entirely, and changes no threshold.
    - id: OBJ-2
      severity: BLOCKING
      target: >-
        criteria_feasibility_summary.headline_findings_of_the_table, and criterion
        feasibility table sections 4, 6 and 7
      statement: >-
        THE CONTRACT'S PRE-REGISTERED PRED-ID SETS ARE EVALUATED UNDER A DIFFERENT
        COUNTERFACTUAL FROM THE ONE THE CONTRACT DEFINES, AND ARE WRONG AT FOUR NAMED
        TUPLES. Table section 4 defines the counterfactual numerically as
        `mu_rep = P_pred - T at every declared tuple`, from which the counterfactual
        statistics are DETERMINED as T/sem_001, T/s_001 and T/(sqrt2 sem_001). Section
        4 then asserts these are `exactly, the committed columns` |z_sem_001| and
        |z_sd_001|. That identification requires T = |mu_001 - P_pred|, WHICH IS FALSE
        AT EVERY TUPLE - mu_001 is a SAMPLED committed draw carrying its own error and
        T is DETERMINED. The largest gap is 2.9276 SEM at T-18-2-B264. Section 6 then
        computes CR-1 and CR-2 from the committed residual while computing CR-3 from T,
        so the frozen power analysis mixes two counterfactuals. Recomputing under the
        contract's own section 4 definition gives CR-1 = 20 not 21, CR-2 = 5 not 4,
        CR-3 = 18 (same 18 tuples either way), and a powerless complement of 28 not 27.
        THE NAMED DIFFERENCES, ALL CHECKABLE FROM COLUMNS THE TABLE ITSELF PRINTS -
        T-18-2-B58 has T/sem_001 = 3.1004 and fires, but is absent from the CR-1 list
        and is present in the 27-tuple `cannot fire` list; T-16-3-B48 has
        T/sem_001 = 2.7588 and does not fire, but is listed as firing; T-18-2-B264 has
        T/sem_001 = 0.0945 and does not fire, but is listed as firing; and T-16-3-B22
        has T/s_001 = 3.0506 and fires CR-2, but is absent from the named 4. Section 7
        states its own rule as `at those tuples the omitted term T is smaller than 3.000
        standard errors of the mean`, and applying THAT rule literally yields 28 tuples,
        so the section 7 list contradicts the section 7 criterion at three named tuples.
        THE SHARPEST CASE IS T-18-2-B264 - at m = 2 the whole restored term is at most
        one bin, and there T = 0.875 bins against a committed residual of 27.997 bins,
        so the missing pre-marking is 32 TIMES TOO SMALL TO EXPLAIN THAT RESIDUAL, yet
        the table counts the tuple as one where CR-1 can fire under the full
        counterfactual. This is exactly the D-2 failure mode the contract's own PRED-ID
        rule was written to prevent - a pre-registered set whose members are wrong while
        its cardinality looks tidy - occurring inside the file that declares the rule.
      discharging_change: >-
        In a versioned protocol_amendment, adopt ONE counterfactual and re-derive every
        named set from it. Concretely, keep table section 4's definition
        mu_rep = P_pred - T, delete the sentence asserting that the counterfactual
        statistics are exactly the committed columns, and replace the three
        PRED-ID sets with the sets computed from T - CR-1 at 20 tuples including
        T-18-2-B58 and excluding T-16-3-B48 and T-18-2-B264; CR-2 at 5 tuples adding
        T-16-3-B22; CR-3 unchanged at its 18; and the `cannot fire` complement at 28
        tuples. Additionally state, as a pre-data observation feeding no criterion, that
        at all 29 m = 2 tuples the restored term T is at most 0.998 bins, so at
        T-18-2-B264, T-14-2-B118 and T-18-2-B140 the committed BATCH-011 residual
        exceeds 3T and cannot be explained by the missing pre-marking under any outcome.
    - id: OBJ-3
      severity: BLOCKING
      target: 'replication.seed_derivation_binding and process_specification.P_REPAIRED step 1'
      statement: >-
        THE CONTRACT CLAIMS `FULLY SPECIFIED SO THAT NOTHING IS LEFT TO THE EXECUTOR'S
        JUDGEMENT AND SO THAT EVERY NUMBER IS REPRODUCIBLE FROM THIS CONTRACT`, AND
        THAT CLAIM IS FALSE AS FROZEN, IN TWO INDEPENDENT WAYS. FIRST, NO SEED IS
        DERIVABLE FOR THE KNOWNANSWER ARM. The seed string is formed from the master
        seed, the arm label, k, round(beta x 1000), m, B and C_red; cases KA-1 through
        KA-7 are synthetic instances given only as N, s and C_red, with no k, no beta,
        no m and no B, so the Executor must invent the missing fields. Worse, KA-1 and
        KA-4 share (N = 11, s = 3, C_red = 0), so any parameter-keyed derivation makes
        KA-1's 1000 replicates a prefix of KA-4's 10^6 pre-markings and the two
        zero-tolerance checks cease to be independent. SECOND, THE PRE-MARKING SAMPLING
        ALGORITHM IS UNSPECIFIED. `Choose s DISTINCT bins UNIFORMLY AT RANDOM WITHOUT
        REPLACEMENT` fixes the distribution but not the algorithm, and
        numpy.random.Generator.choice with replace false, permutation truncation,
        Floyd's method and rejection sampling all consume different amounts of the same
        stream and produce different realised numbers from the same seed. The numpy
        version is also not pinned in advance. Statistical reproducibility survives;
        BIT-EXACT THIRD-PARTY REPRODUCTION DOES NOT, and two determinism choices are
        left to the Executor's judgement, which is where the BATCH-011 fault hid.
      discharging_change: >-
        In a versioned protocol_amendment, add three sentences. (1) The KNOWNANSWER arm
        seeds each case from the string formed by joining with the single character
        pipe, in this exact order and with no whitespace - the decimal master seed
        120401, the arm label KNOWNANSWER, the case label KA-1 through KA-8, the decimal
        N, the decimal s and the decimal C_red; the low 64 bits of the SHA-256 digest,
        interpreted as an unsigned little-endian integer, seed one
        numpy.random.default_rng per case. (2) The pre-marking of step 1 is performed by
        exactly the call rng.choice(N, size=s, replace=False) on the tuple's generator,
        and by no other method. (3) The numpy major and minor version used is recorded
        in every manifest, and any change of it is a declared protocol deviation.
    - id: OBJ-4
      severity: BLOCKING
      target: 'falsification_criterion, the MISS-MARGINAL admissible band'
      statement: >-
        THE MARGINAL BAND RUNS TO |z| = 10 WHILE THE CONTRACT'S OWN CHANCE-ALARM BUDGET
        SUPPORTS IT ONLY TO ABOUT |z| = 4, SO A DECISIVE STRUCTURAL REFUTATION CAN BE
        RECORDED AS INCONCLUSIVE. The declared budget of 0.377 is justified at the
        3.000 threshold - my recomputation gives 0.18686 expected CR-1 exceedances
        there - but the expected chance exceedance count falls to 8.92e-03 beyond 4.0,
        3.71e-04 beyond 5.0, 1.87e-05 beyond 6.0 and 8.82e-08 beyond 8.0. A single CR-1
        failure at |z_sem| = 8 is therefore seven orders of magnitude beyond the rate
        the budget was computed to excuse, and four orders below the CR-4 alarm rate the
        contract itself treats as STRUCTURAL, yet the frozen text routes it to
        MISS-MARGINAL, disposition `inconclusive`, successor `replication under
        amendment`, with EV-ECDLP-008 observation O-4 left standing. I record explicitly
        that MISS-MARGINAL is NOT an escape hatch on the pass-versus-miss axis - it says
        the prediction is NOT MET, records a MISS, forbids `consistent with the
        prediction`, and leaves O-4 neither confirmed nor superseded, which is honest
        and correct. IT IS AN ESCAPE HATCH ON THE SEVERITY AXIS, and that is enough to
        matter, because the severity axis is what decides whether O-4 is superseded.
      discharging_change: >-
        In a versioned protocol_amendment, replace the constant 10.000 with 4.000 at
        both places it bounds the MISS-MARGINAL band and at both places it appears as a
        MISS-STRUCTURED disjunct, so that MISS-STRUCTURED fires on any CR-1 failure with
        |z_sem| at least 4.000 or any CR-3 failure with |z_shift| at least 4.000, and
        MISS-MARGINAL admits only a single exceedance in [3.000, 4.000). Record in the
        same amendment the expected chance exceedance counts 0.18686 at 3.0 and
        8.92e-03 at 4.0 as the pre-data basis for the new edge. This makes the band
        DERIVED FROM the declared budget rather than asserted beside it, and it changes
        no criterion, only the branch a miss is routed to.

    - id: OBJ-5
      severity: NONFATAL
      target: 'criterion feasibility table section 6, CR-2 chance-alarm claim'
      statement: >-
        The claim that CR-2's per-tuple chance-alarm probability is `below 1e-20` is
        wrong at the 11 tuples with 30 replicates. There |z_sd| at least 3 means
        |t_29| at least 3 x sqrt(30) = 16.4317, and P(|t_29| > 16.4317) is
        approximately 3.13e-16 - four orders of magnitude above the stated bound. At
        the 37 tuples with 100 replicates the figure is approximately 1.7e-51 and the
        claim holds easily. The budget is unaffected, since 11 x 3.1e-16 is
        approximately 3.4e-15.
      discharging_change: >-
        Restate the bound as `below 1e-15 per tuple, and below 1e-50 at the 37 tuples
        with 100 replicates`, or drop the numeral and say `negligible against the
        0.377 budget`.
    - id: OBJ-6
      severity: NONFATAL
      target: 'independence_note_for_the_tail_checks_and_for_CR_4'
      statement: >-
        THE INDEPENDENCE LICENCE ITSELF IS SOUND AND I ENDORSE IT. The signs
        sign(mu_rep,i - P_pred,i) depend only on stream i; P_pred,i is a fixed constant
        with no randomness; and RC-C's de-duplication on (k, m, B) makes those three
        seed-string fields unique across the 48, so the per-tuple streams are distinct
        by construction. OB-9's objection concerns the correlation of MEASURED CURVE
        QUANTITIES down a (k, m) column, and those enter here as constants, so it
        genuinely does not transfer. The stated reason is the right reason. TWO
        RESIDUALS ARE MISSTATED. First, the per-tuple negative-sign probability range
        is 0.47003 to 0.49859, not `between 0.472 and 0.500` - the lower end is
        Phi(-0.07519) at T-12-2-B46. Second, and more substantively, `p = 0.500` is
        the conservative end ONLY ON ONE TAIL. The declared positive bias pushes n_neg
        DOWN, so p = 0.5 is conservative on the n_neg at least 35 tail, as the contract
        says, but ANTI-CONSERVATIVE ON THE n_neg at most 13 TAIL BY A FACTOR OF 1.59 -
        the true P(n_neg at most 13) is 0.001660 against 0.001044 at p = 0.5 - and
        n_neg at most 13 fires CR-4, which routes to MISS-STRUCTURED. The signs are
        independent but NOT identically distributed, so the reference law is
        Poisson-binomial with E[n_neg] = 23.504, not Binomial(48, 0.5). The budget
        survives because the contract's declared 0.002436 still bounds the true
        two-sided 0.002302; only the word `conservative` is wrong.
      discharging_change: >-
        Correct 0.472 to 0.470, and replace `CR-4's thresholds are evaluated at the
        conservative end p = 0.500` with a sentence stating that the reference law is
        Poisson-binomial with per-tuple p between 0.470 and 0.4986 and E[n_neg] =
        23.504; that p = 0.500 is conservative on the n_neg at least 35 tail and
        anti-conservative by a factor of 1.59 on the n_neg at most 13 tail; and that
        the declared CR-4 alarm figure 0.002436 nevertheless bounds the true two-sided
        value 0.002302, so the 0.377 budget stands.
    - id: OBJ-7
      severity: NONFATAL
      target: 'success_criterion CR-3, sourcing of sem_001'
      statement: >-
        CR-3 says `mu_001 and sem_001 are QUOTED from IN-1`. IN-1 CONTAINS NO sem FIELD
        AT ALL - a grep of the committed blob returns zero occurrences of the string
        `sem`. sem_001 is DERIVED as s_001/sqrt(n_rep), and only IV-1 says so. Under
        RC-8's labelling rule a derived quantity may not be labelled QUOTED, and under
        ST-3 an Executor who cannot locate a QUOTED quantity in IN-1 unambiguously must
        STOP AND REPORT - so as frozen, CR-3 obliges the Executor either to stop or to
        infer silently. The inference happens to be unambiguous, because IN-1's
        `replicates` equals the C-14 count at all 49 cells, but the text is wrong.
      discharging_change: >-
        Restate CR-3 as `mu_001 and s_001 are QUOTED from IN-1 at the tuple's binding
        committed reference, and sem_001 = s_001/sqrt(n_rep) is DETERMINED from them,
        with n_rep the tuple's C-14 replicate count, which equals IN-1's recorded
        `replicates` at all 49 cells`.
    - id: OBJ-8
      severity: NONFATAL
      target: 'budget.budget_feasibility_note'
      statement: >-
        The claim `below 2 x 10^7 random draws` across the two 48-tuple arms does not
        hold. The sum of (C_red/2) x n_rep over the 48 declared tuples, doubled for the
        two arms, is 2.19e7 - about 9.5 percent over the stated bound. The byte-clear
        figures do hold - main arms 8.05e8 against `below 1.5e9`, high-precision block
        1.70e10 against `below 1.8e10` - and the binding cost is indeed the array
        clears, so the overstatement is cosmetic. It is nevertheless a number in a
        frozen contract that is not true.
      discharging_change: 'Restate as `below 2.5 x 10^7 random draws`.'
    - id: OBJ-9
      severity: NONFATAL
      target: 'invalidation_rules IV-1, and criterion feasibility table section 9'
      statement: >-
        IV-1 HAS NO POWER AGAINST THE ONE SCENARIO THAT WOULD MATTER MOST. Suppose the
        committed BATCH-011 antipodal residuals are real rather than sampling noise, so
        that this batch's re-implementation lands at the analytic E_asrec while mu_001
        did not. Then z_comp reaches 3.000 at ZERO of the 48 tuples; the largest is
        2.074 at T-18-2-B264 and the next is 1.867 at T-14-2-B118. IV-1a requires MORE
        THAN 2 tuples at 3.000 or above and therefore does not fire. This is not a
        false-alarm hazard, it is a blind spot - IV-1 is the gate that anchors CR-3's
        comparison to the committed package, and it cannot see the single largest
        anomaly in that package.
      discharging_change: >-
        Add to IV-1 a REPORTING-ONLY clause, firing nothing, requiring results.json to
        report per tuple the quantity |mu_asrec - mu_001|/(sqrt2 sem_001) together with
        its rank, and to name the pre-registered fact that under the `committed
        residuals are real` scenario the maximum of that quantity is 2.074 at
        T-18-2-B264, below IV-1a's threshold. Do not loosen the threshold.
    - id: OBJ-10
      severity: NONFATAL
      target: 'criteria_feasibility_summary, CR-4 as the replacement for per-tuple power'
      statement: >-
        The claim that CR-4 `draws its power from the sign at all 48 tuples including
        those 27, and it fires with certainty under the counterfactual` is TRUE FOR THE
        ALL-OR-NOTHING COUNTERFACTUAL AND ONLY FOR IT. Letting the repaired null still
        fall short by a fraction phi of T, with sem_rep equal to sem_001, my
        Poisson-binomial computation gives P(CR-4 fires) of 0.009 at phi = 0.02, 0.048
        at phi = 0.05, 0.179 at phi = 0.10, 0.499 at phi = 0.20 and 0.997 at phi =
        1.00, while the number of tuples with expected |z_sem| at least 3 is 0, 1, 5, 8
        and 20 respectively. IN THE REGIME WHERE PER-TUPLE CRITERIA HAVE NO POWER,
        CR-4'S FIRING PROBABILITY IS AT MOST 0.048. CR-4 restores power against the
        COMPLETE failure, not against partial ones, and the contract should say so
        rather than let a reader infer that the 27-tuple limit has been repaired.
      discharging_change: >-
        Add the phi power table above to the criteria_feasibility_summary as a
        pre-registered scope limit, and replace `it is the criterion that carries the
        counterfactual power at the 27 tuples where CR-1 and CR-2 have none` with `it
        carries the ALL-OR-NOTHING counterfactual power at those tuples; against a
        shortfall of 5 percent of T or less, no criterion in this contract has
        appreciable power, and that limit is declared rather than repaired`.
    - id: OBJ-11
      severity: NONFATAL
      target: 'criterion feasibility table section 5.4'
      statement: >-
        `centred to within 0.16466 standard errors` is the sum 0.0895 + 0.0752 of the
        two second-order BIASES. It does not bound the (N-1)-versus-N bin-count
        deviation, whose magnitude (1 - e^(-lambda)) reaches 0.2032 SEM at T-12-2-B62.
        That deviation is not a bias of the process as specified - the exact formula is
        over N bins and is correct - so the sentence is not false, but it is narrower
        than a reader will take it to be, and 0.16466 is quoted downstream as though it
        bounded every second-order effect.
      discharging_change: >-
        Append to section 5.4 - `this bound covers the two declared BIASES only; the
        largest magnitude of the (N-1)-versus-N bin-count term, which is a
        specification-deviation hazard and not a bias of the specified process, is
        0.2032 SEM at T-12-2-B62, and it too cannot fire a 3.000 criterion alone`.
    - id: OBJ-12
      severity: NONFATAL
      target: 'instrument_independence.RC_F_disclosure_and_what_it_does_not_discharge'
      statement: >-
        THE DISCLOSURE IS HONEST AND I ENDORSE THE NON-DISCHARGE; THE CONSEQUENCE IS
        SHARPER THAN THE CONTRACT STATES. RC-F asks for an independent session to
        re-implement the antipodal null FROM THE CONTRACT TEXT ALONE. The Coordinator
        read the committed BATCH-011 driver and then specified P-ASRECORDED to be
        IDENTICAL to what that driver implements. Therefore IV-1 CANNOT DISTINGUISH `the
        re-implementation is faithful` FROM `the re-implementation inherited the same
        defect through the contract text` - if the BATCH-011 driver carried a subtle
        process error and the Coordinator transcribed it faithfully, IV-1 reproduces it
        and passes. BATCH-012 contributes an independent re-implementation of a
        Coordinator-transcribed process, not an independent re-derivation, which is
        strictly weaker than RC-F's second route and is essentially zero progress on it.
        ONE ASYMMETRY PARTIALLY RESCUES THE DESIGN, and should be recorded: step 1 of
        P-REPAIRED has no analogue in the BATCH-011 driver, so the PRIMARY arm is not
        transcribed from anything. It is only the COMPARABILITY ANCHOR that is
        contaminated.
      discharging_change: >-
        Carry the two sentences above verbatim into the RC_F disclosure block, into
        every EXP-YIELD-002 run record, and into DEC-20260729-002, so that no later
        reader can read IV-1's passing as progress on RC-F. No card may declare RC-F
        discharged, and this review does not.
    - id: OBJ-13
      severity: NONFATAL
      target: 'process_specification.effect_size_arithmetic_OB_10'
      statement: >-
        Both convention comparisons are derived FOR THE MEAN ONLY. The contract does
        not quantify whether pairing the m = 3 pre-marks into B/2 whole antipodal pairs
        changes the VARIANCE of the distinct count relative to uniform selection of B
        bins. This is harmless as the contract is written, because CR-1 and CR-2
        denominate on the MEASURED s_rep of the actual repaired process rather than on
        a modelled variance, and IV-1b checks the spread of the as-recorded arm only.
        It is recorded so that no later record reads the OB-10 analysis as covering
        second moments.
      discharging_change: >-
        Add one sentence to effect_size_arithmetic_OB_10 - `these comparisons are for
        the MEAN only; no claim is made about the variance under either convention, and
        no criterion in this contract depends on a modelled variance`.
    - id: OBJ-14
      severity: NONFATAL
      target: 'the TASK-20260729-015 receipt, pre_commit_repair_disclosed'
      statement: >-
        The whitespace-only dedent CANNOT BE VERIFIED AGAINST GIT BY ANY THIRD PARTY.
        The file was ADDED at f291a624, so the pre-repair version was never committed
