red_team_report:
  id: RT-20260729-021
  task_id: TASK-20260729-021
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-012
  role: red-team
  verdict: >-
    PASS WITH BOUNDED READING. The realised P-CORE is correctly classified by the
    frozen rule, the package asserts no disposition, and no prohibition is
    breached anywhere in the eleven committed artifacts. What P-CORE licenses is
    NARROWER than the governing contract's own success_criterion sentence claims,
    and one pre-registered sentence that C-20 makes MANDATORY on every downstream
    record is FALSE and must not be carried unaccompanied. Nothing here un-fires
    INV-4, makes any E readable, or touches any cost model.
  recorded_at: '2026-07-29'
  recorded_at_precision: >-
    Date only. This session did not fabricate a wall-clock time.

  snapshot_under_review:
    commit_sha: c7189f80225bad0d0d2aa28cbbbb11e672d30dd6
    parent_sha: f49670fa165e63cb8970ab137a4311c3d8223fd0
    branch: claude/ecdlp-b011
    receipt: >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-012/archives/TASK-20260729-019/snapshot_commit_receipt.json
    verification_performed_by_this_session: >-
      git show confirms parent f49670fa, eleven files, all additions, matching
      the receipt committed_paths exactly. ALL ELEVEN path_sha256 values were
      recomputed from the Git blobs at that commit and ALL ELEVEN MATCH. The
      twelfth declared path is the receipt itself, deferred by construction under
      INT-BATCH007-T; strict subset, no extras, no deletions.
    governing_contract: >-
      experiments/EXP-YIELD-002/specification.yaml at f291a624 AS AMENDED by
      amendments/v1_to_v2.yaml at e3c9cb45 and amendments/v2_to_v3.yaml at
      0548d8cc. v3 governs, then v2, then v1. IMMUTABILITY RE-VERIFIED BY THIS
      SESSION (OI-9), the frozen specification is unchanged since f291a624 and
      each amendment appears at exactly one commit.

  claim_under_review: >-
    That the repaired occupancy null reproduces the unchanged P_pred at all 48
    declared tuples, and that this therefore certifies the BATCH-011 diagnostic
    and confirms EV-ECDLP-008 observation O-4.

  ruling_on_what_P_CORE_licenses:
    O_4_disposition: >-
      CONFIRMED IN PART AND LEFT STANDING IN PART. NOT SUPERSEDED, AND NOT
      CONFIRMED AS A WHOLE. O-4 is compound. Its component that a process which
      also pre-marks |S_(m-2)| bins has mean P_pred is CONFIRMED BY MEASUREMENT
      for the first time, and that is the batch's genuine increment. Its
      component that the shortfall equals |S_(m-2)| exp(-lambda) at every cell was
      ALREADY DETERMINED arithmetic on committed data before this batch and is
      merely reconfirmed. Its component that CTRL-NULL-SUMSET as IMPLEMENTED
      realises only the first term is SUPPORTED BUT NOT INDEPENDENTLY
      ESTABLISHED, because IV-1's anchor arm is transcribed from a contract text
      written after the Coordinator read the BATCH-011 driver (C-12, C-21). Its
      component that the correct null pre-marks the bins A CANCELLING MULTISET
      REACHES DETERMINISTICALLY is UNTOUCHED AND STILL UNARCHIVED, because RC-A
      and this contract pre-mark a UNIFORMLY RANDOM s-subset instead, which the
      contract itself states is not the structurally exact set.
    does_any_BATCH_011_E_value_become_readable: >-
      NO. I RULE WITH THE DISPATCHING SESSION. Three independent grounds, any one
      sufficient. PROCEDURAL - INV-4 is a rule of the EXP-YIELD-001 contract
      evaluated on the EXP-YIELD-001 run, and nothing in BATCH-012 evaluates or
      can evaluate a rule of another contract on another run; un-firing it would
      need either an edit to an immutable committed contract or a new run under a
      corrected control, and neither exists. EVIDENTIAL - P-CORE certifies the
      CONTROL OBJECT, not the CENSUS, and certifying a replacement control after
      the fact supplies no denominator for a quantity computed against the
      original one; no such re-normalisation exists in any committed run and this
      review computes none. STRUCTURAL - the half of O-4 that is a claim about the
      census is not what was measured. THE VOID STANDS IN FULL.
    sentences_that_may_be_written: >-
      S-1 through S-5 of falsification_review.md section 1.1 and 1.4, each
      verbatim-adoptable and each scoped to the 48 declared tuples, one
      unreplicated curve-free run set, claim tier toy.
    sentences_that_may_not_be_written: >-
      F-1 through F-10 of falsification_review.md section 1.2. In particular no
      record may say that P_pred is certified or correct, that INV-4 should not
      have fired or is un-fired or re-disposed, that any BATCH-011 E value is now
      readable, or that the shift measured in the high-precision block confirms T.

  objections:
    - id: RT21-1
      severity: BLOCKING ON ADOPTION
      title: >-
        The power-limit sentence that C-20 makes MANDATORY on every downstream
        record is FALSE, and all three pre-execution reviews called it correct
      target: >-
        v1_to_v2 preregistered_power_curve.reading_pre_registered, v1_to_v2 C-10
        after-text, v2_to_v3 C-20, and every record carrying the sentence -
        including summary.json power_limit_sentence_C_20, all three run records,
        and the yet-unwritten EV-ECDLP-009 and DEC-20260729-002.
      statement: >-
        The mandatory sentence asserts that a shortfall of 5 percent of T or less
        would be VERY UNLIKELY TO BE DETECTED BY ANYTHING IN THIS CONTRACT, and
        C-10 asserts that AGAINST A SHORTFALL OF 5 PERCENT OF T OR LESS NO
        CRITERION IN THIS CONTRACT HAS APPRECIABLE POWER. BOTH ARE FALSE. At
        phi = 0.05 the expected |z_sem| at T-18-3-B16 is 6.24, not 3.000, because
        T/sem_001 there is 124.73. CR-1 therefore fires at that single tuple with
        probability about 0.999, and the design detects a uniform 5 percent
        shortfall with probability about 0.9999. UNARCHIVED PROBE, NOT EVIDENCE -
        P(CR-1 or CR-4 fires) by uniform phi is 0.170 at 0.010, 0.266 at 0.015,
        0.442 at 0.020, 0.663 at 0.025, 0.849 at 0.030, 0.990 at 0.040 and 0.9999
        at 0.050, against 0.124 at phi = 0.
      origin_of_the_error: >-
        THE CURVE'S COLUMN REPORTS A COUNT AND THE NARRATIVE READ IT AS A
        MAGNITUDE. The pre-registered column is the NUMBER of tuples at which the
        expected |z_sem| REACHES 3.000, which is one at phi = 0.05. Three
        successive sessions read one tuple as no power, when CR-1 requires only
        ONE failure and that one tuple carries an expectation of 6.24. THIS IS THE
        CARDINALITY-NOT-IDENTITY FAILURE MODE THAT THIS CONTRACT'S OWN PRED-ID
        RULE EXISTS TO PREVENT, RECURRING FOR THE THIRD TIME IN THE SAME CONTRACT
        AND THIS TIME INSIDE THE POWER CURVE.
      which_way_it_cuts: >-
        CONSERVATIVE. It understates the design's power and therefore makes
        P-CORE look WEAKER than it is. It creates no route by which a miss is
        reported as a pass. That is why it is not BLOCKING on the P-CORE reading.
        It IS blocking on adoption, because C-20 requires the sentence verbatim in
        two ledger records that do not yet exist, and a false pre-registered
        numeric claim in the ledger is a defect whichever direction it errs in.
      discharging_change: >-
        C-20's obligation is not waived. Carry the sentence AND carry this
        correction beside it, verbatim - THE CLAUSE ABOUT A SHORTFALL OF 5 PERCENT
        OF T IS SUPERSEDED BY RT-20260729-021. The design detects a uniform
        shortfall of 5 percent of T with probability about 0.9999 and of 4 percent
        with probability about 0.99, essentially all of it carried by CR-1 at
        T-18-3-B16 where T/sem_001 is 124.73. IT IS BLIND TO A UNIFORM SHORTFALL
        BELOW ABOUT 1.5 PERCENT OF T, AND BLIND TO ANY SHORTFALL THAT IS NOT
        PROPORTIONAL TO T, because T/sem_001 is below 3.000 at 25 of the 29 m = 2
        tuples. WHAT P-CORE EXCLUDES ABOVE PHI ABOUT 0.03 RESTS ON THREE TUPLES.
      status: OPEN

    - id: RT21-2
      severity: BLOCKING
      title: >-
        The governing contract's own success_criterion sentence asserts more than
        the run establishes, and must be narrowed before any record adopts it
      target: 'specification.yaml success_criterion, the O-4 clause'
      statement: >-
        The frozen text reads that under P-CORE, EV-ECDLP-008 observation O-4 is
        THEREBY CONFIRMED BY MEASUREMENT FOR THE FIRST TIME. That is correct for
        exactly one of O-4's four components and is false as a statement about
        O-4 as a whole - see ruling_on_what_P_CORE_licenses.O_4_disposition. A
        record that adopts the contract sentence unqualified will assert that the
        census-facing half of O-4 has been measured, and it has not.
      discharging_change: >-
        DEC-20260729-002 and EV-ECDLP-009 adopt S-5 of falsification_review.md
        rather than the contract's unqualified sentence, and record that O-4 is
        NEITHER SUPERSEDED NOR CONFIRMED AS A WHOLE.
      status: OPEN

    - id: RT21-3
      severity: NONFATAL
      title: >-
        The experiment tests the ARITHMETIC of O-4's model and not its STRUCTURAL
        premise, and the substitution is declared but its consequence is not
      target: >-
        process_specification.P_REPAIRED.identity_bin_may_be_pre_marked and
        the_structurally_exact_alternative_and_why_it_is_not_used
      statement: >-
        O-4 says the correct null pre-marks the |S_(m-2)| bins a cancelling
        multiset reaches DETERMINISTICALLY. P-REPAIRED pre-marks s bins chosen
        UNIFORMLY AT RANDOM. The contract states in terms that these differ - at
        m = 2 the structurally correct pre-marked bin IS bin 0, and at m = 3 it is
        B/2 whole antipodal pairs among the (N-1)/2 non-identity pairs - and bounds
        the MEAN difference at 0.0895 SEM at m = 2 and below 0.001 SEM at m = 3.
        The bound is correct and I do not dispute it. THE CONSEQUENCE THAT IS NOT
        RECORDED is that the experiment therefore confirms the identity between
        two closed forms and does not confirm that the sum-set null OUGHT to
        pre-mark S_(m-2). C-13 further scopes the whole effect-size analysis to
        the MEAN and makes NO claim about the variance under either convention, so
        even the mean-level equivalence does not transfer to any second moment.
      cheapest_discriminating_control: >-
        Run the structurally exact variant - pre-mark bin 0 at m = 2, and B/2
        whole antipodal pairs at m = 3 - at the same 48 tuples. The contract
        FORBIDS it under run_plan_rule, correctly, because adding it here would
        create an unpre-registered comparison. It is therefore a SUCCESSOR
        control, and because the declared mean separation is at most 0.0895 SEM it
        needs of order 10^4 replicates per tuple to separate, which the C-14
        schedule does not provide.
      status: OPEN, CARRIED TO A SUCCESSOR

    - id: RT21-4
      severity: NONFATAL
      title: >-
        CR-1 and CR-2 are near-tautological, and the only non-tautological
        criterion is anchored on the one arm RC-F declares contaminated
      statement: >-
        The contract proves EXACTLY that E[distinct] - P_pred = (1 - s/N) f(lambda)
        with f bounded at 0.0752 SEM over the declared set, and RT-20260729-016
        re-derived that from scratch and confirmed it. CR-1 and CR-2 therefore
        test whether numpy and a thirty-line marking loop reproduce a PROVED
        expectation, which is what IV-2's eight known-answer cases were separately
        built to check. THE ONLY CRITERION WHOSE STATISTIC CONTAINS A NUMBER
        PRODUCED IN A DIFFERENT BATCH BY A DIFFERENT IMPLEMENTATION IS CR-3, AND
        CR-3 IS ANCHORED BY IV-1, WHICH C-12 AND C-21 DECLARE UNABLE TO
        DISTINGUISH A FAITHFUL RE-IMPLEMENTATION FROM ONE THAT INHERITED THE SAME
        DEFECT THROUGH THE CONTRACT TEXT.
      what_this_does_not_mean: >-
        IT DOES NOT MEAN THE RUN WAS CIRCULAR OR WORTHLESS. The target P_pred is
        QUOTED and SHA-256-pinned from IN-1 at 2fb2bb7a and could not be moved by
        this batch; IV-4 re-derives it at max absolute difference 0.0. A simulator
        built to reproduce a formula still cannot manufacture agreement with a
        number committed at another commit. The objection is about how much the
        agreement ADDS, not about whether it is real.
      status: RECORDED

    - id: RT21-5
      severity: NONFATAL
      title: >-
        The batch's most load-bearing content did not require the run, and no
        record says so
      statement: >-
        UNARCHIVED PROBE, RUN OUTSIDE THE REPOSITORY, NOT EVIDENCE. Taking only
        the committed mu_001, s_001, N and C_red and the exact no-pre-marking mean
        N - [(N-1)A + C], the standardized residual (mu_001 - E_asrec_exact)/sem_001
        over the 48 tuples has mean -0.0122, sd 1.1303, SEM 0.1631, t = -0.075.
        THE COMMITTED BATCH-011 ANTIPODAL ARM IS DEAD CENTRED ON THE EXACT
        ANALYTIC MEAN OF THE PROCESS IT IS NOW SAID TO HAVE REALISED, BY PURE
        ARITHMETIC ON ALREADY-COMMITTED CONSTANTS. That is what O-4 asserted, and
        no Monte Carlo was needed to see it. The measurement's genuine increment
        is narrower - that the closed form is the true mean of the DESCRIBED
        process, which arithmetic on the committed data cannot establish.
      status: RECORDED

    - id: RT21-6
      severity: NONFATAL
      title: >-
        The unexplained +0.3610 z_sem shift - findings, and the one control that
        already exists inside the committed package
      finding: >-
        MOST CONSISTENT WITH A CHANCE FLUCTUATION IN ONE ARM OF ONE RUN SET, AND
        POSITIVELY CONTRADICTED AS A REAL BINS-LEVEL BIAS BY THE COMMITTED
        HIGH-PRECISION BLOCK. IT IS NOT A THIRD ANALYTIC TERM.
      reproduction_and_decomposition: >-
        UNARCHIVED PROBE, NOT EVIDENCE. I reproduce mean +0.3610, sd 0.9750, SEM
        0.1407, t = +2.565 exactly. The exact process bias accounts for only
        +0.0264 SEM on average, so +0.3346 SEM is unexplained, t = +2.379. The
        INDEPENDENT as-recorded arm gives +0.1224 SEM, t = +0.887. The committed
        BATCH-011 arm gives -0.0122 SEM, t = -0.075. The shift is STRUCTURELESS -
        correlation with lambda +0.02, with sem +0.02, with N +0.24, with n_rep
        -0.09, and m = 2 gives +0.343 against m = 3 at +0.323.
      the_discriminating_control_already_run: >-
        A REAL DEFECT PRODUCES A FIXED OFFSET IN BINS, AND z_sem SCALES IT BY
        SQRT(n_rep)/sd. An offset large enough to give +0.3346 SEM at 100
        replicates MUST give +2.9 to +3.7 SEM at 10000. The committed
        high-precision block measures exactly that at four tuples through the SAME
        draw_replicates code path - I read the driver and there is NO
        n_rep-dependent branch anywhere in it. Observed deviations of the
        high-precision repaired leg from the exact analytic mean are -2.95, +0.97,
        +0.61 and -0.45 where +3.09, +3.66, +2.94 and +3.24 would be required.
        Under the real-bias hypothesis that joint outcome has probability of order
        1e-7.
      declared_limit_on_my_own_reading: >-
        READING THAT BLOCK AT ALL SITS ADJACENT TO ITS BINDING LABEL, AND I FLAG
        IT RATHER THAN GLOSS IT. I EVALUATE NO CRITERION ON IT, POOL IT WITH
        NOTHING, SUBSTITUTE IT FOR NOTHING, AND CHANGE NO BRANCH WITH IT. If the
        Coordinator rules even a diagnostic reading inadmissible, my finding
        reduces to the three-arm comparison above, which is weaker and points the
        same way. My computation is an unarchived probe and is not evidence in
        either case.
      mechanism_derived_and_rejected: >-
        The one classical mechanism giving a systematic POSITIVE mean to a
        t-statistic on a left-skewed count is E[T] approximately -gamma_1/(2
        sqrt(n)). With Var(distinct) of order 350 at the largest tuples, |gamma_1|
        is of order 0.05 and the effect is about 0.003 SEM - two orders of
        magnitude too small. Named and dismissed quantitatively rather than left
        hanging.
      not_excluded: >-
        CHANCE, at nominal two-sided p about 0.021 against exact centring and
        about 0.036 against the declared bias, in a quantity that was NOT a
        pre-registered test statistic - tail_checks names no statistic and DEV-6
        records that it fires nothing by construction - so a post-hoc 2.4 sigma
        here is worth very little. THIS IS THE READING I ADOPT. Also NOT EXCLUDED,
        a small shift common to both BATCH-012 arms, pooled +0.2285 SEM with SEM
        0.0985, t = 2.32, which would have to be a property of this driver,
        platform or numpy build rather than of the process, and which the
        high-precision block also disfavours.
      does_it_damage_the_P_CORE_reading: >-
        NO, AND THE REASON IS NOT THAT CR-4'S WINDOW ABSORBED IT. The shift is
        POSITIVE, and every alternative this design exists to detect is a
        SHORTFALL. A positive excursion is in the direction AWAY from the
        counterfactual and cannot manufacture a P-CORE that a shortfall would have
        denied. n_neg = 16 low in [14, 34] is the same fact read a second way, not
        a second fact. ONE SENTENCE IS CONSTRAINED - no record may say the
        repaired null lands ON P_pred. It lands AT OR SLIGHTLY ABOVE it, by an
        amount larger than the declared second-order biases account for and
        currently unexplained.
      status: OPEN, WITH REQUIRED CONTROL RC-21A

    - id: RT21-7
      severity: NONFATAL
      title: >-
        Ruling on the second amendment cycle - justified on its stated merits,
        NOT vindicated by the outcome, and not yet carried into the ledger
      statement: >-
        THE SECOND CYCLE WAS A DECLARED, DATED DEVIATION FROM A PRE-REGISTERED
        EXECUTION GATE, and v2_to_v3 says so in terms rather than calling it an
        interpretation. It was granted by the author of the contract, on his own
        motion, in the same session that recorded QUEUE-AMEND-20260729-003 which
        created the card that authorised it. THAT IS THE FAILURE MODE THE CAP
        EXISTS TO PREVENT, and following the BATCH-011 precedent does not make it
        smaller.
      the_ruling: >-
        JUSTIFIED ON ITS STATED MERITS AT THE TIME IT WAS GRANTED, AND THE OUTCOME
        ADDS NOTHING TO THAT JUSTIFICATION. What justifies it is checkable from
        the committed record WITHOUT knowing the outcome. NB-2 was a real defect
        in a PRE-REGISTERED reference distribution, resolvable by neither
        execution nor the Executor, which would have put a per-tuple chance
        reference wrong by a factor of 17 to 28 into the record at the tuple most
        likely to fire, and would have admitted a route by which a chance
        exceedance driven entirely by the committed draw's own sampling error was
        recorded as a MEASUREMENT FAULT superseding O-4. The direction test is the
        right test - every repair C-14 through C-21 tightens or discloses and none
        loosens - and RT-20260729-029 checked it ADVERSARIALLY under OI-8 and
        found no loosening, no threshold moved and nothing outside the closed
        seven-item scope. The cycle also bought the single most valuable pre-data
        number in the batch, P(MISS-STRUCTURED under a correct null) = 0.050 and
        P(P-CORE) = 0.659, without which a realised MISS-STRUCTURED would have
        been read as roughly ten times stronger than it is.
      what_is_not_forgiven: >-
        A FAVOURABLE OUTCOME IS EXACTLY WHEN A PROCESS FAILURE IS EASIEST TO
        FORGIVE, AND THIS ONE IS NOT FORGIVEN BY IT. Had the run returned
        MISS-STRUCTURED, the identical process would be indicted, which is the
        test of whether the justification is outcome-independent. It is. But the
        self-scoping recurrence is real, it is now twice in a row on the same
        contract, and the deviation is recorded ONLY in QUEUE-AMEND-20260729-003
        and in v2_to_v3 - it is NOT YET A LEDGER DECISION, and v2_to_v3 itself says
        it MUST BE CARRIED INTO DEC-20260729-002.
      discharging_change: >-
        DEC-20260729-002 records the RC-12 deviation explicitly, records that a
        favourable outcome was obtained under a deviated gate, records that the
        deviation is justified by the pre-outcome record and not by the outcome,
        and rules whether the one-cycle cap stands for successors. A successor
        contract assigns the cycle-cap ruling to a session that did not author the
        amendment it authorises.
      status: OPEN

    - id: RT21-8
      severity: NONFATAL
      title: >-
        DEV-4 DOES feed something - it feeds the most persuasive-looking number in
        the run package, whose error bar is undefined
      statement: >-
        CONFIRMED that DEV-4 feeds NO criterion, NO threshold, NO invalidation
        rule and NO verdict, exactly as the Executor states. THE RECEIPT AND THE
        SUMMARY NEVERTHELESS REPORT, AT THE FOUR HIGH-PRECISION TUPLES, THE
        MEASURED MEAN DIFFERENCE REPAIRED MINUS AS-RECORDED BESIDE T_DETERMINED -
        15.9447 against 15.9580, 15.8261 against 15.8332, 23.7687 against 23.7889,
        27.5352 against 27.6103. A reader will take that as a precise
        confirmation of T to within 0.05 percent. IT IS NOT, BECAUSE THE TWO LEGS
        SHARE A SEED. Their streams are offset rather than independent, so the
        variance of that difference is neither the independent-sum value nor a
        common-random-numbers reduction, and it is quantified NOWHERE. The
        correlation is visible in the realised numbers - at T-18-3-B16 both legs
        sit low, at -2.95 and -2.03 against the exact analytic mean, and at
        T-16-3-B16 and T-18-3-B24 both sit high.
      what_a_successor_must_fix: >-
        Extend the seed rule's enumerated arm labels so that the high-precision
        block's two legs are distinguishable - for example by appending the leg
        label to the seed string, giving HIGHPREC-REPAIRED and
        HIGHPREC-ASRECORDED - and re-derive the block. Until then, NO RECORD MAY
        QUOTE THE HIGH-PRECISION DIFFERENCE COLUMN AS A CONFIRMATION OF T, and any
        successor that gives that block a criterion inherits a real defect. The
        Executor was right to flag DEV-4 as a CONTRACT defect rather than an
        executor reading.
      status: OPEN, CARRIED TO A SUCCESSOR

    - id: RT21-9
      severity: NONFATAL
      title: >-
        What P-CORE excludes is concentrated in three tuples, and that
        concentration is nowhere on the record
      statement: >-
        UNARCHIVED PROBE, NOT EVIDENCE. T/sem_001 is 124.73 at T-18-3-B16, 59.95
        at T-16-3-B16 and 57.56 at T-18-3-B24, and is below 3.000 at 25 of the 29
        m = 2 tuples. Essentially all of the batch's discriminating content above
        phi about 0.03 rests on ONE tuple's 100 replicates. A single mis-resolved
        per-cell quantity at T-18-3-B16 would erase most of it. IV-4's
        re-derivation at max absolute difference 0.0 is what currently stands
        against that and it is adequate, but the concentration belongs on the
        record beside the headline.
      status: RECORDED

    - id: RT21-10
      severity: NONFATAL
      title: >-
        RC-F contribution assessed as the contract required, and it is smaller
        than the batch's shape suggests
      statement: >-
        RC-F IS NOT DISCHARGED AND THIS REVIEW DECLARES NO DISCHARGE. Its P_pred
        sub-route IS now archived - KA-8 and IV-4 re-derive P_pred from N, C_red
        and |S_(m-2)| and agree with the quoted values at max absolute difference
        0.0 at all 48 tuples including the four failing ones, which is a THIRD
        independent reproduction after TASK-20260729-007 and TASK-20260729-008.
        Its occupancy_null sub-route is NOT archived, because P-ASRECORDED is
        specified to be IDENTICAL to a driver the contract's author had read, and
        C-21 records that C-3d moved the position slightly further from an
        independent re-derivation. NET - RC-F moves from undischarged to
        undischarged with the P_pred sub-route closed and the null sub-route
        explicitly contaminated. IV-1 PASSING IS NOT PROGRESS ON RC-F.
      status: OPEN

  prohibition_audit_T1:
    method: >-
      All eleven committed artifacts read or searched for the forbidden
      constructions, plus the -019 receipt and the three pre-execution reviews.
    INV_4: >-
      NOT UN-FIRED AND NOT RE-DISPOSED anywhere in the package. The admission and
      ceiling block, every manifest, summary.json and the receipt all carry the
      prohibition. NO SENTENCE COMES CLOSE. Nothing in this report un-fires it.
    efficiency_E_and_yield_ratio: >-
      NONE APPEARS. No E, no R, and no occurrence of 0.85 as a measurement.
      Searched and found none. None is computed in this report.
    hypothesis_movement: >-
      NONE. H-YIELD-001 stays specified, H-IC-001 and H-STR-002 stay weakened with
      DEFER-BATCH009-001's EXP-STR-004 obligation still binding, H-SUBRES-001
      stays weakened, H-ENDO-001 stays approved which carries no evidential
      standing, H-GGM-001 stays specified, H-FCP-001 stays analyzed.
    INV_5: >-
      DECLARED NEITHER WAY, correctly, and this report declares it neither way.
      EV-ECDLP-008 observation O-8 stands.
    cost_model: >-
      NOT TOUCHED, NOT RE-CHARGED, NOT FLAGGED AND NOT DEFENDED. The
      counterfactual branch is O-6, SPARSE OUT-OF-BAND SET, and NOT O-4, and EVEN
      A FULLY CERTIFIED NULL YIELDS NO COST-MODEL CONSEQUENCE WHATEVER. EV-ECDLP-008
      observation O-11 stands unretracted and is NOT restated as a result of
      BATCH-012.
    sentences_that_come_close: >-
      TWO, AND NEITHER IS A BREACH. FIRST, the governing contract's own
      success_criterion clause that O-4 is THEREBY CONFIRMED BY MEASUREMENT FOR
      THE FIRST TIME - correct for one component of O-4 and over-broad as written,
      handled at RT21-2. SECOND, the high-precision block's difference column
      beside T_DETERMINED, which invites a confirmation reading it cannot support,
      handled at RT21-8. NO ARTIFACT IN THE PACKAGE ASSERTS EITHER OVER-READING.
    ST_4_compliance: >-
      HONOURED. The run package states NO branch disposition, and the -019 receipt
      states the branch as the frozen rule classifies it while explicitly
      refusing a disposition.

  required_controls:
    - id: RC-21A
      title: replicate the aggregate z_sem shift under a fresh master seed
      why: >-
        The +0.3346 SEM residual is the one unexplained observation in the
        package, and the only live non-chance hypothesis is a shift common to
        BATCH-012's two arms. A replication separates chance from a
        driver-or-platform property at negligible cost.
      what: >-
        Re-run the REPAIRED arm at all 48 declared tuples under a NEW master seed
        in a block disjoint from 120201 and from BATCH-011's 110xxx block, on a
        DIFFERENT interpreter build and platform, and report the mean, sd and SEM
        of z_sem over the 48. Total cost is of order 15 seconds and 61 MB.
      resume_condition: >-
        Discharged when the replication is snapshot-committed. If the replicated
        mean is within about 0.14 SEM of zero, the shift is recorded as chance and
        closed. If it reproduces above about +0.25 SEM, the driver, the numpy
        build and the platform become the objects of the next control, and NO
        conclusion about the process is drawn from it either way.
      status: OPEN

    - id: RC-21B
      title: extend the high-precision block to a randomly chosen m = 2 subset
      why: >-
        The four existing high-precision tuples are all m = 3, all high N and all
        four INV-4 failures - a deliberately selected, not a random, subset. The
        unexplained shift is present equally at m = 2, where nothing is measured
        at high precision.
      what: >-
        Six m = 2 tuples chosen by a pre-registered deterministic rule, at 10000
        replicates, under a fresh master seed, with the two legs SEEDED SEPARATELY
        so that RT21-8's DEV-4 defect is not inherited. Reported as an observation
        feeding nothing.
      resume_condition: >-
        Discharged when committed. Never used to evaluate any criterion of
        EXP-YIELD-002 and never pooled with any criterion quantity.
      status: OPEN

    - id: RC-21C
      title: correct the mandatory power-limit sentence before it enters the ledger
      why: RT21-1. The sentence is false and C-20 makes it mandatory on EV-ECDLP-009 and DEC-20260729-002.
      what: >-
        Adopt the discharging_change of RT21-1 verbatim beside the C-20 sentence
        in every record BATCH-012 has yet to write, and re-derive the corrected
        detection curve independently rather than importing this session's
        unarchived probe.
      resume_condition: Discharged when DEC-20260729-002 carries both the sentence and the correction.
      status: OPEN

    - id: RC-B
      title: multi-curve control at the out-of-band cells
      carried_from: RT-20260729-008
      why_still_open: >-
        UNTOUCHED BY BATCH-012 AND UNTOUCHABLE BY IT - it requires curve compute
        and this contract specifies zero. It remains the ONLY control that
        separates an interval-structure effect at small N from a property of the
        single curve y^2 = x^3 + 4x + 8, and it is the discriminating control for
        the three out-of-band cells of EV-ECDLP-008 observation O-9.
      resume_condition: >-
        A declared successor run with its own contract, not a probe. NOTE that no
        efficiency may be computed against a repaired null without a fresh
        pre-registration, per RC-G, and that BATCH-012 authorises none.
      status: OPEN

    - id: RC-F
      title: close the self-attestation gap on the development dry run
      carried_from: RT-20260729-008
      why_still_open: >-
        See RT21-10. The P_pred sub-route is archived; the occupancy_null
        sub-route is contaminated by transcription and C-21 records that C-3d made
        it marginally worse. NO CARD IN BATCH-012 MAY DECLARE IT DISCHARGED AND
        THIS ONE DOES NOT.
      resume_condition: >-
        Either commit the SHA-256 of the pre-dry-run BATCH-011 driver, or have a
        session that has read NEITHER the BATCH-011 driver NOR the EXP-YIELD-002
        contract text re-derive the antipodal occupancy null from the
        EXP-YIELD-001 v2 clause C-4 text alone and reproduce the four recorded
        failing cells.
      status: OPEN

    - id: RC-21D
      title: carry the RC-12 deviation into the ledger
      why: RT21-7. The deviation from the pre-registered one-cycle cap is not yet a ledger decision.
      what: >-
        DEC-20260729-002 records the deviation, its pre-outcome justification, the
        fact that a favourable outcome was obtained under it, and a ruling on
        whether the cap stands for successors.
      resume_condition: Discharged when DEC-20260729-002 is committed carrying it.
      status: OPEN

  counterexample_or_mutation: >-
    THE CHEAPEST DISCRIMINATING MUTATION IS THE ONE ALREADY IN THE PACKAGE, AND IT
    IS WHY THE LOOSE THREAD RESOLVES. Raising n_rep by 100x holds the process
    fixed and rescales any true bins-level offset by 10 in SEM units. The
    committed high-precision block is exactly that mutation at four tuples through
    the same code path, and it returns -2.95, +0.97, +0.61 and -0.45 where +2.9 to
    +3.7 would be required. THE SECOND CHEAPEST MUTATION, NOT RUN, IS RC-21A - the
    same arm under a fresh seed on a different platform, which separates chance
    from a driver-or-platform property in fifteen seconds. THE MUTATION THAT WOULD
    ATTACK THE HIT ITSELF, NOT RUN AND FORBIDDEN HERE, IS RC-21E BELOW - the
    structurally exact pre-marking of RT21-3, which is the only mutation that
    tests O-4's census-facing component rather than its arithmetic.

  baseline_comparison:
    dominated_by: NOT_APPLICABLE_BY_CONSTRUCTION
    dominated_by_basis: >-
      A CHECKED NULL, NOT AN UNCHECKED ONE. EXP-YIELD-002 solves no instance,
      recovers no discrete logarithm, computes no relation and executes ZERO group
      operations. It occupies no row of any ECDLP time, memory or data frontier, so
      no row can dominate it.
    frontier_rows_actually_checked:
      - >-
        Pollard rho at about 0.886 sqrt(N) group operations with O(1) memory, the
        harness variant storing visited classes at O(sqrt N). Not comparable, this
        batch performs zero group operations.
      - >-
        Baby-step giant-step at about 2 sqrt(N) time and sqrt(N) stored elements,
        measured at 64, 129, 257 and 512 stored group elements for k = 12, 14, 16
        and 18. Not comparable.
      - >-
        Closest specialized baseline, decomposition and summation-polynomial index
        calculus over prime fields in the Gaudry and Diem line, which has no known
        advantage over rho at these sizes. The parent census is measured at 28,384x
        to 2,604,442x a measured Pollard-rho solve of the identical instance at
        EV-ECDLP-008 observation O-11. THAT POSITION STANDS UNRETRACTED AND IS NOT
        RESTATED AS A RESULT OF BATCH-012.
    sota_delta: >-
      0 BY CONSTRUCTION. No algorithmic task is attempted and no operation count of
      any kind is produced by this contract. The standing measured delta from the
      parent batch is the O-11 range above; BATCH-012 neither improves it, worsens
      it nor re-derives it, AND NO COST MODEL IS TOUCHED.

  heuristic_challenges:
    - >-
      NO HEURISTIC IS UNDER TEST AND THE CONTRACT SAYS SO. heuristic_under_test is
      null; HEUR-1, the counting heuristic B^m/(m! p), is not tested, not
      validated, not weakened and not mentioned as a measured quantity, and
      EV-ECDLP-008 already records that BATCH-011 did not test it either. NOTHING
      IN THIS PACKAGE IS A RANDOM-MODEL JUSTIFICATION FOR ANY STRUCTURED OBJECT.
    - >-
      THE ONE PLACE A RANDOM MODEL IS SUBSTITUTED FOR A STRUCTURED OBJECT IS RC-A's
      UNIFORM PRE-MARKING, AND IT IS THE EXEMPLAR-PROFILE FAILURE MODE IN
      MINIATURE. The bins S_(m-2) actually occupies are NOT a uniform random
      subset - at m = 2 the structurally correct bin is exactly bin 0, and at m = 3
      the correct set is B/2 whole antipodal pairs closed under negation. The
      contract declares the substitution before data and bounds its MEAN effect at
      0.0895 SEM, which is the honest treatment; but it makes NO claim about the
      variance (C-13), and the substitution is why the census-facing component of
      O-4 is untested. See RT21-3.
    - >-
      SCALE HONESTY IS SATISFIED IN THE ONLY SENSE AVAILABLE. Every parameter is
      quoted from a toy-tier package at 12, 14, 16 and 18 field bits, the tier is
      declared toy, and no correspondence, isometry or transport argument to
      cryptographic scale is offered - the contract states that none is available.
      NOTHING HERE IS EVIDENCE ABOUT CRYPTOGRAPHIC-SIZE CURVES IN EITHER DIRECTION.

  cost_model_challenges:
    - >-
      NO COST MODEL IS PRESENT TO CHALLENGE, AND ITS ABSENCE IS DECLARED RATHER
      THAN SKIPPED. matched_baseline_position_RC7 is DECLARED INAPPLICABLE with
      its reason, which is the correct handling and is not a defect.
    - >-
      THE ONE COST-ADJACENT NUMBER IN THE PACKAGE IS THE RUN'S OWN RESOURCE
      MEASUREMENT - 15.0 seconds and 61 MB peak RSS across three runs - and it is a
      MEASURED harness quantity, not an algorithmic cost. It may not be quoted in
      any comparison.
    - >-
      RLIMIT_AS COULD NOT BE SET ON THE HOST AND THE 4 GB CAP WAS ENFORCED BY
      MEASUREMENT. Disclosed in every manifest. Peak RSS 61 MB against a 4 GB cap
      leaves the substitution harmless here, but a successor whose peak approaches
      the cap may NOT rely on measurement in place of a limit.
    - >-
      EVEN A FULLY CERTIFIED NULL YIELDS NO COST-MODEL CONSEQUENCE. The
      counterfactual branch on the committed data is O-6, and DEC-20260729-001
      rationale R-6 records that the opposite framing was factually wrong on the
      committed data.

  reduction_and_scope_challenges:
    - >-
      NO PUBLISHED REDUCTION IS CITED OR INSTANTIATED BY THIS CONTRACT, so there is
      no reduction whose hypotheses could fail to transfer. The one internal
      inferential chain is repaired-null-lands-on-P_pred implies
      CTRL-NULL-SUMSET-was-mis-constructed, and it is valid only for the
      arithmetic component of O-4, per RT21-2 and RT21-3.
    - >-
      SCOPE INFLATION AUDIT - NONE FOUND IN THE PACKAGE. The admission and ceiling
      block is carried verbatim into every manifest, summary.json and the receipt.
      The one live inflation RISK is the contract's own success_criterion sentence
      about O-4, which is a contract defect and not an executor or package defect.
    - >-
      ABSENCE OF EVIDENCE IS NOT IMPOSSIBILITY, AND NO LANE IS DECLARED DEAD. THE
      DECOMPOSITION-YIELD QUESTION REMAINS OPEN. The 28 tuples at which no
      per-tuple criterion can fire even under the full counterfactual are an
      INFORMATION LIMIT at the fixed replicate count, not a finding about anything.

  claim_tier_check_T7: >-
    NOTHING IN THE PACKAGE OR IN ANY READING PROPOSED FOR IT ASSERTS ABOVE ITS
    CLAIM TIER UNDER docs/claims-and-verification.md. The tier is toy and is
    declared toy in the specification, in both amendments, in every manifest, in
    summary.json and in the -019 receipt. The evidence strength this run set can
    support is at most `preliminary`, per the replication honesty note, and
    `reject_scoped` on it is forbidden by agents/coordinator.md - the correct pair
    if evidence ever points that way is `weaken` plus a NAMED replication.

  scope_limits:
    largest_scope_supported: >-
      The 48 declared parameter tuples; k in {12, 14, 16, 18} with quoted group
      orders 4001, 16619, 65633 and 261707; the frozen beta grid as realised in the
      source package; arities m in {2, 3}; the x-interval factor-base convention
      with B measured; the one prime-order curve per size of the SOURCE package;
      this simulator, this budget, one platform and numpy 2.4.0; and the occupancy
      CONTROL OBJECT alone rather than any measured decomposition quantity.
    scopes_not_supported: >-
      Any curve; any field size not listed; any cryptographic scale in either
      direction; any decomposition-yield quantity; any efficiency E; any cost
      model; any hypothesis; INV-5; any other arity, coefficient set, factor-base
      convention or number of curves per size; AND REPLICATION - 48 parameter
      tuples are not 48 replications, this is a single unreplicated run set in its
      own right, and its inputs come from another single unreplicated run set.

  narrowest_supported_statement: >-
    At the 48 de-duplicated criterion-evaluable parameter tuples of the committed
    EXP-YIELD-001 v2 package, a curve-free occupancy simulation that pre-marks
    |S_(m-2)| uniformly chosen bins before throwing C_red/2 antipodal pairs
    reproduces the unchanged, hash-bound P_pred under both pre-registered
    denominator readings, with all three per-tuple firing sets empty on set
    identity and n_neg = 16 inside the pre-registered [14, 34] window. This
    confirms by measurement, for the first time, that CTRL-NULL-SUMSET as frozen in
    EXP-YIELD-001 v1 and as re-specified by amendment C-4 was mis-constructed by
    exactly the omitted term, and it establishes nothing else. It does not certify
    P_pred as a model of the decomposition census, does not un-fire or re-dispose
    INV-4, makes no BATCH-011 efficiency E readable, declares INV-5 neither way,
    moves no hypothesis, and yields no cost-model consequence whatever - the
    counterfactual branch being O-6 and not O-4. EV-ECDLP-008 observation O-4 is
    neither superseded nor confirmed as a whole - its null-construction component
    is confirmed and its component about which bins the correct null should
    pre-mark is untouched. A pass of P-CORE is not evidence that the repaired null
    is exact, and under a perfectly correct repaired null this design records
    P-CORE only about 0.659 of the time. The realised aggregate z_sem mean of
    +0.3610 over the 48 tuples exceeds what the declared second-order biases
    account for, is recorded and not adjusted for, and is in the direction away
    from the counterfactual this design exists to detect. Claim tier toy; a single
    unreplicated curve-free run set; NOT A CRYPTANALYTIC RESULT.

  next_concrete_action: >-
    DISPATCH RC-21A - re-run the REPAIRED arm at all 48 declared tuples under a new
