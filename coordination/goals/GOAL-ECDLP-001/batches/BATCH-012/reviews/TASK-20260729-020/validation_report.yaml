  # -----------------------------------------------------------------------
  reproducibility_check:
    method: >-
      The committed driver blob and the two committed input blobs were copied into
      a scratch root outside the repository and all three arms plus the summary
      derivation were re-executed there. The four regenerated JSON documents were
      compared against the committed blobs by a recursive structural diff with
      exact float equality.
    numpy_version_this_session: 2.4.0
    numpy_version_recorded_in_the_package: 2.4.0
    numpy_finding: >-
      THE EXACT STRING MATCHES. I ran under numpy 2.4.0, which is the exact string
      C-19b makes governing and which every manifest records before the first draw.
      Python 3.13.1, macOS-26.6-arm64, the same platform family as the run.
    python_version_this_session: 3.13.1
    bit_identical: true
    differing_leaves:
      KNOWNANSWER_results_json: 3 - one elapsed_seconds and two timestamps
      ASRECORDED_results_json: 51 - 48 per-row elapsed_seconds, one run elapsed_seconds, two timestamps
      REPAIRED_results_json: 55 - 52 per-row elapsed_seconds, one run elapsed_seconds, two timestamps
      summary_json: >-
        7 - four per-row elapsed_seconds and the three source_results_files
        sha256 values, which differ only because the three source files differ in
        their timing fields
    non_timing_differences: 0
    wall_clock: 14.53 s in this session against 14.96 s recorded in the package
    what_this_does_not_establish: >-
      This is a SAME-PLATFORM, SAME-INTERPRETER, SAME-NUMPY reproduction. The C-3e
      boundary - bit-exactness claimed only WITHIN the recorded version and
      statistical reproduction otherwise - was not tested and is not claimed. In
      particular C-19c's shuffle=True clause, which exists precisely because
      generator consumption may differ between settings, was not exercised as a
      load-bearing clause here and remains load-bearing for any reader on a
      different numpy.

  # -----------------------------------------------------------------------
  independent_reimplementation:
    written_from: >-
      The contract text alone - process_specification, replication.
      seed_derivation_binding, and amendment clauses C-3a to C-3e, C-19a and C-19c.
      The Executor's driver was NOT used as a source; it was read afterwards only
      to locate its I/O paths for the re-execution and to enumerate its imports.
    covers:
      - P-REPAIRED, including step 1 pre-marking and its omission when s equals 0
      - P-ASRECORDED
      - the SHA-256 per-tuple seed derivation and the KNOWNANSWER case-keyed derivation
      - P_pred, lambda, exp(-lambda) and T, re-derived rather than quoted
      - the RC-C de-duplication, performed independently from IN-1
      - all four criteria, both invalidation arms of IV-1, and all eight known-answer cases
      - the exact process mean N - (1 - s/N)[(N-1)A + C] and the C-16 delta_i / p_i table
    agreement_with_the_package: >-
      MAXIMUM ABSOLUTE DIFFERENCE 0.0 across all 48 tuples for mean, sd_ddof_1,
      sem, z_sem, z_sd, z_shift, T, P_pred, mu_001, s_001 and sem_001, and for the
      as-recorded arm's mean and sd_ddof_1. All 96 derived seeds of the two
      48-tuple arms match exactly as integers and all 96 seed strings match exactly
      as strings.
    the_four_INV_4_failing_cells_reproduced_end_to_end: true

