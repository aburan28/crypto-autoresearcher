      tolerances_DEV_3:
        delta_i: 1.0e-05
        p_i_3000_A2: 1.0e-06
        r_i_vs_IN_1: 1.0e-09
      verdict: >-
        CONFIRMED AND WITHIN TOLERANCE by a factor of about two. Against the
        driver's own re-derived column my values agree to 9.76e-09 on delta_i and
