    - id: MR-13
      quantity: bin accounting
      result: >-
        48 of 48 rows record realised_bin_count = N and realised_orbit_count =
        (N-1)//2 + 1; every C_red is even and throws_per_replicate = C_red//2 at 48
        of 48; the identity bin is eligible to be pre-marked and a g = 0 throw marks
