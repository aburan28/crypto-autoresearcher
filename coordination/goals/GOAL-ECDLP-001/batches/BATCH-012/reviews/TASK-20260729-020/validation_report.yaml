        FOUND IN ANY OF THE FIVE BIN-ACCOUNTING ITEMS.
    - id: MR-14
      quantity: both denominator readings at every checked cell
      result: >-
        Recomputed by me at all 48 tuples under BOTH readings. Both are reported at
