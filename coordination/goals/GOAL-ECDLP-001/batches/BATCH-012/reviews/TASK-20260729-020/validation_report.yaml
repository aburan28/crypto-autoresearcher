  # -----------------------------------------------------------------------
  control_checks:
    - id: CC-1
      control: CTRL-002-KNOWNANSWER, IV-2 cases KA-1 to KA-8
      method: re-implemented in this session from IV-2 plus C-3a and C-19a
      result: >-
        ALL EIGHT PASS on an independent implementation. My independently derived
        seeds for KA-1, KA-2, KA-3, KA-4 and KA-6 and my empirical values
        7.244196 (KA-3 mean, target 7.2441711010797825, tolerance 0.00483443278876482)
        and 0.090968 (KA-6 frequency, band 0.08975917 to 0.09205901) match the
        committed record exactly. KA-5 and KA-7 correctly reuse the KA-4 and KA-6
        streams and take no draw; KA-8 is DETERMINED and consumes none; generators
        are seeded for exactly five cases. KA-8 reproduces P_pred at all four
        INV-4-failing tuples at max absolute difference 0.0 against a 1e-9
        tolerance. IV-2 DOES NOT FIRE.
      status: verified
    - id: CC-2
      control: CTRL-002-ASRECORDED, the comparability arm, IV-1
      method: independently re-implemented P-ASRECORDED and recomputed both IV-1 arms
      result: >-
        The as-recorded arm reproduces the committed RUN-YIELD-001-NULL-RANDOM-SUMSET
        per-cell means within the contract's own numeric tolerance at every tuple:
        zero exceedances on IV-1a and zero on IV-1b, against triggers of MORE THAN
        two. THE REPAIRED ARM'S COMPARISON TO THE RECORDED PACKAGE IS ANCHORED AND
        IS NOT VOID. The contract's pre-declared invalidation route is therefore
        not taken.
      status: verified
      declared_blind_spot_restated: >-
        C-9 stands unchanged: IV-1 cannot see the single largest anomaly in the
        BATCH-011 package, so its passing is not evidence that no such anomaly
        exists, and C-12 and C-21 stand - IV-1 cannot distinguish a faithful
        re-implementation from one that inherited the same defect through the
        contract text. RC-F IS NOT DISCHARGED BY THIS VALIDATION EITHER.
    - id: CC-3
      control: CTRL-002-DIAGNOSTIC-HIGHPRECISION
      result: >-
        Present, executed last, labelled as feeding nothing, and confirmed by this
        session to feed nothing. See deviation_assessments DEV-4.
      status: verified
    - id: CC-4
      control: zero curve compute
      method: enumeration of every import and every file open in the committed driver blob
      result: >-
        Imports are argparse, datetime, hashlib, json, math, os, platform,
        resource, subprocess, sys, time and numpy, plus traceback inside an
        exception handler. NOTHING FROM harness/. NOTHING FROM tools/. NO
        computer-algebra system. NO BATCH-011 driver. Exactly two files are opened
        under experiments/EXP-YIELD-001 - IN-1 and IN-2 - each SHA-256-verified
        before parsing. No elliptic-curve operation of any kind appears; the only
        occurrences of the word curve are the preregistered power curve table and
        prose disclaimers. Subprocess use is confined to read-only git and two
        orchestration.adapter provenance calls, neither of which produces a
        reported measurement. EVERY INPUT IS QUOTED FROM THE COMMITTED BATCH-011
        RESULTS HASH-BOUND AT 2fb2bb7a, AND EVERY QUOTED VALUE MATCHES THOSE BLOBS
        AT ABSOLUTE DIFFERENCE 0.0.
      status: verified
    - id: CC-5
      control: seed integrity
      result: >-
        105 seeds in total - 48 REPAIRED, 48 ASRECORDED, 4 HIGHPREC, 5 KNOWNANSWER -
        and ALL 105 ARE DISTINCT, with no overlap between any two arms. Every one is
        derivable from the contract text alone by a third party, which this session
        demonstrated by deriving all of them independently and matching every
        derived integer and every seed string. The merged tuple T-12-3-B22 is seeded
        from its binding committed reference with round(beta x 1000) = 325 and is
        drawn once. The only stream sharing anywhere is the intended KA-5/KA-4 and
        KA-7/KA-6 reuse and the DEV-4 sharing inside the block that feeds nothing.
      status: verified

  # -----------------------------------------------------------------------
  deviation_assessments:
    - id: DEV-1
      subject: command.txt, environment.json and stderr.log folded into manifest.json
      assessment: ACCEPTABLE, NOT A POLICY BREACH
      reasoning: >-
        AGENTS.md's artifact policy enumerates the INFORMATION each run must retain
        - exact command, environment and dependency versions, stdout and stderr -
        and prescribes NO filenames. The generic layout in
        docs/evidence-and-reproducibility.md is a convention, and the frozen
        contract's required_artifacts_rule declares EXACTLY ELEVEN FILES and forbids
        any undeclared artifact, so writing a twelfth file would itself have fired
        IV-6. I verified that every field the policy names is present in all three
        manifests, that stderr is tee'd into stdout.log in-process and its location
        is named, and that the layout follows the BATCH-011 DEV-1 precedent.
        RETENTION IS SATISFIED; ONLY THE LOCATION CHANGES, AND THE LOCATION IS
        DECLARED. The residual cost is discoverability, not evidence.
    - id: DEV-2
      subject: implementation note folded into every manifest and into summary.json
      assessment: ACCEPTABLE
      reasoning: >-
        Same reasoning as DEV-1. The seven implementation notes are present verbatim
        in all three manifests and in summary.json. Nothing is omitted.
    - id: DEV-3
      subject: numeric agreement tolerance for the C-16 committed table
      assessment: ACCEPTABLE, AND THE CONSERVATIVE CHOICE
      reasoning: >-
        RT-20260729-029's control requires equality but the committed table is
        printed to 5 decimals for delta_i and 6 for p_i, so exact equality is
        unattainable in principle and some tolerance had to be read. The Executor
        declared the reading BEFORE the comparison, made the committed values the
        binding ones, set the tolerance at print precision, and reported the
        realised maxima in full so a reviewer could re-judge. I re-derived both and
        reproduce the realised maxima to six significant figures; they sit inside
        the tolerance by about a factor of two.
      residual: >-
        The exact-A1 column is QUOTED and not re-derived, by the Executor for want
        of scipy and by me for the same reason. Only the A2 column and delta_i are
        independently checked anywhere.
    - id: DEV-4
      subject: the high-precision block's two legs derive the same per-tuple seed
      assessment: >-
        CONFIRMED AS A CONTRACT DEFECT RATHER THAN AN EXECUTOR READING, AND THE
        EXECUTOR'S CONSERVATIVE READING WAS THE RIGHT ONE.
      reasoning: >-
        The seed string's fields are master, arm, k, round(beta x 1000), m, B,
        C_red, and the arm labels are enumerated as EXACTLY REPAIRED, ASRECORDED,
        KNOWNANSWER and HIGHPREC. CTRL-002-DIAGNOSTIC-HIGHPRECISION runs BOTH
        processes at the same four tuples under one master seed. No field
        distinguishes the process, so the contract as written mandates a shared seed
        for two processes it intends to compare. The only alternative would have
        been to invent a label outside the contract's enumerated set, which is an
        Executor-side change to a frozen clause. Taking the contract literally and
        declaring the defect is correct, and flagging it for the Coordinator is
        correct.
      feeds_nothing_confirmed: >-
        CONFIRMED BY THREE INDEPENDENT LINES. First, the four HIGHPREC seeds appear
        only in the block and in the manifest's high_precision_block_per_tuple; they
        do not enter repaired_arm.rows. Second, my independent recount never touched
        the block and reproduces all four criteria exactly, which is the strongest
        available demonstration that no criterion depends on it. Third, the DEV-5
        phi-equivalent is computed from the criterion arm's per-tuple shortfall and
        from realised n_neg, not from the block; IV-1 reads the as-recorded arm and
        IV-2 the known-answer arm. The block reports means, sds, sems, a measured
        mean difference and T, and attaches NO standard error and NO z to the
        difference - which is what keeps the shared stream harmless.
      residual: see NARROW-3
    - id: DEV-5
      subject: four phi-equivalent aggregations reported, none chosen
      assessment: ACCEPTABLE, AND THE RIGHT SHAPE OF ANSWER
      reasoning: >-
        C-20 requires a realised phi-equivalent and defines no aggregation.
        Reporting four named aggregations side by side and choosing none is strictly
        more honest than choosing one silently, and all four carry the binding label
        that they have no threshold, no acceptance region and no disposition. The
        fourth is correctly reported as null with its reason - the realised n_neg of
        16 lies at or below the lowest declared curve row, so no interpolated phi
        exists and none was invented.
    - id: DEV-6
      subject: the z_sem tail check reports the full sorted vector and descriptive summaries, and performs no test
      assessment: ACCEPTABLE, AND THE CONSERVATIVE CHOICE
      reasoning: >-
        tail_checks names no statistic. Publishing the whole vector with counts
        against standard-normal expectations, performing no test and computing no
        p-value, is the reading that adds no unpre-registered inference. It is also
        what made the unexplained shift visible in the record rather than buried.
    - id: DEV-7
      subject: the two arms that draw no P-REPAIRED replicate carry a null phi-equivalent with its reason
      assessment: ACCEPTABLE
      reasoning: >-
        C-20 binds every run record and C-16 binds results.json. Neither the
        known-answer nor the as-recorded arm can have a realised phi-equivalent, so
        each carries the block with a null value, the reason, the C-20 sentence
        verbatim, and a pointer to where the realised value is reported. The C-16
        table is carried in all three records. Nothing is omitted; the location is
        named.
    - id: DEV-summary
      count_declared: 7
      count_assessed: 7
      blocking: 0
      requiring_a_narrowing: 2 - DEV-3's un-re-derived exact-A1 column, and DEV-4's shared stream

  # -----------------------------------------------------------------------
  unexplained_observation_investigation:
    subject: the z_sem vector over the 48 tuples has mean +0.3610, sd 0.9750, SE 0.1407
    reproduced_independently: true
    validator_values:
      mean: 0.361024
      sd_ddof_1: 0.975002
      se_of_the_mean: 0.140729
      t: 2.5654
      n_neg: 16
    instrument_causes_tested_and_excluded:
      - cause: the two declared second-order biases
        finding: >-
          I evaluated the contract's own exact mean at all 48 tuples. The declared
          0.0895 SEM envelope HOLDS and the declared per-tuple maximum 0.0752 is
          confirmed at T-12-2-B46, but the MEAN bias over the 48 tuples is only
          +0.0264. Re-standardizing against the exact process mean instead of P_pred
          leaves mean +0.334642, t = 2.3794. THE DECLARED BIASES ACCOUNT FOR 0.026
          OF 0.361 AND NO MORE.
      - cause: small-sample skewness of the standardized statistic
        finding: >-
          Replicate-level skewness across the 48 tuples has mean -0.2172, predicting
          a t-statistic bias of +0.011. Real, correctly signed, an order of magnitude
          too small.
      - cause: an off-by-one in the pre-mark, a ddof inconsistency, or a wrong shuffle keyword
        finding: >-
          EXCLUDED STRUCTURALLY. My simulator was written from the contract text,
          marks exactly s bins, uses ddof n_rep - 1 and sem = s_rep/sqrt(n_rep), and
          reproduces every package number at 0.0. Two independently written
          implementations agreeing bit-for-bit rules out a coding slip in either.
      - cause: a seeding correlation or a pathology of the SHA-256 seed derivation
        finding: >-
          EXCLUDED BY DIRECT MONTE CARLO. Repeating the ENTIRE 48-tuple design 400
          times under the contract's OWN SHA-256 seed rule with disjoint master
          seeds gives mean(z_sem) with MC mean +0.0439 and MC sd 0.1473 - the sd an
          independent-stream design predicts, sqrt(1.03/48) = 0.147 - and the MC mean
          is fully accounted for by the declared bias +0.026 plus the skew term
          +0.011. A 100-repetition run under numpy SeedSequence.spawn agrees at MC
          mean +0.0342, sd 0.1320, and returns n_neg MC mean 23.55 against the
          contract's declared Poisson-binomial E[n_neg] = 23.504.
      - cause: a structural gradient across strata
        finding: >-
          NONE FOUND. corr(z_sem, lambda) = +0.031, corr(z_sem, log N) = +0.064,
          corr(z_sem, s) = -0.063, corr(z_sem, z_comp) = -0.066. By arity +0.370 at
          m = 2 and +0.348 at m = 3; by replicate tier +0.321 at 100 and +0.497 at
          30; by field size +0.709, +0.011, +0.005, +0.718 at k = 12, 14, 16, 18. The
          shift tracks no parameter that a mis-specified process would track.
    finding: >-
      NO INSTRUMENT CAUSE WAS FOUND. Nothing in the artifacts explains the +0.3610
      shift. Under a correct implementation of the SPECIFIED process at other seeds
      it does not recur: P(mean z_sem at least 0.361024) = 0.0100 plus or minus
      0.0050 and P(n_neg at most 16) = 0.0200, both from the M = 400 Monte Carlo
      under the contract's own seed rule. n_neg = 16 is the same data seen through a
      coarser statistic and is not independent corroboration.
    what_this_validator_does_not_decide: >-
      Whether the residual is chance at a rate the contract's marginal 0.377 budget
      was never computed to cover for an aggregate statistic no criterion tests, or a
      small positive component of the specified process that neither declared bias
      captures. Both readings remain open and both belong to TASK-20260729-021 and to
      the Coordinator. The design's own C-20 sentence already covers the second
      possibility.

