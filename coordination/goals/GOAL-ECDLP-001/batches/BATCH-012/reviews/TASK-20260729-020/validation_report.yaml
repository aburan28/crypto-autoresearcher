  scope_of_this_verdict: >-
    A PASS here means one thing and nothing more: the EXP-YIELD-002 run package is
    ADMISSIBLE EVIDENCE - the receipt binds, the artifacts are complete, the
    controls hold, and every reported number recomputes from an independent
    re-implementation. It is not a statement that P-CORE licenses anything about
