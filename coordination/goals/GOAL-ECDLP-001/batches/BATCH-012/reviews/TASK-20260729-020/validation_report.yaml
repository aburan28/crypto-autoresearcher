    way, moves no hypothesis, authorizes no promotion and supports no ECDLP claim.
    What the result MEANS belongs to TASK-20260729-021 and to the Coordinator's
    decision at TASK-20260729-022.

  governing_contract: >-
    experiments/EXP-YIELD-002/specification.yaml at f291a624, AS AMENDED by
    amendments/v1_to_v2.yaml at e3c9cb45 and amendments/v2_to_v3.yaml at 0548d8cc.
    Precedence read as v3 over v2 over v1. This session verified from Git that each
    of the three files was added in exactly one commit and never modified since,
    and that all three are ancestors of the validated snapshot.
  approval_location_check: >-
    The specification reads status review_required / approved_by null BY DESIGN
    (D-1 prophylaxis) and that null was NOT read as evidence of non-approval.
    Approval is recorded in the TASK-20260729-030 receipt, APPROVAL_DETERMINATION
    APPROVED, at commit 5174001c, after RT-20260729-016 REVISE, RT-20260729-025
    REVISE and RT-20260729-029 PASS. This session verified that 5174001c is an
    ancestor of f49670fa, which is the first parent of the run snapshot, so
    approval strictly precedes execution in the commit graph.

  # -----------------------------------------------------------------------
  artifact_checks:
    - id: AC-1
      check: snapshot commit reachability and first parent
      method: git cat-file, git merge-base --is-ancestor, git rev-list --parents
      result: >-
        c7189f80225bad0d0d2aa28cbbbb11e672d30dd6 exists, is reachable from HEAD
        256f417a, and has first parent f49670fa165e63cb8970ab137a4311c3d8223fd0,
        which is the value the receipt declares.
      status: verified
    - id: AC-2
      check: exact changed-path set
      method: git diff-tree --no-commit-id --name-status -r
      result: >-
        Exactly 11 paths, every one an addition, set-equal to the receipt's
