        BLOCKING; each is a correction to a stated figure that this card supplies
        in corrected form, before any draw.
      the_C_4_edge: >-
        VERIFIED NOT MOVED AND NOT REOPENED. The constant 4.000 as a severity edge
        appears in v2 at C-4 only, and v3 mentions it three times - in
