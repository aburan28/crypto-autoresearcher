  new_objections:
    - id: RT29-1
      severity: NONFATAL
      target: >-
        v2_to_v3 the_variance_model_for_CR_3.what_this_session_derived_and_by_what_method.the_comparison_that_makes_the_declared_line_wrong,
        and C-15 fifth after-bullet
      statement: >-
        THE `ABOUT 51 PERCENT` AND THE `40.5 PERCENT` OF THE -028 RECEIPT ARE NOT
        A DISAGREEMENT, AND RECORDING THEM AS ONE OBSCURES A REAL DEFECT IN THE
        SENTENCE. Computed here, the top tuple takes 41.44 percent of the
        CONDITIONAL CR-3 total 0.229893 and 50.87 percent of the DECLARED MARGINAL
        CR-3 line 0.18726. The amendment's figure is the second, and its own text
        says so. The -028 receipt's is the first, computed with the process bias
        dropped. BOTH ARE ARITHMETICALLY CORRECT ABOUT DIFFERENT DENOMINATORS. The
        defect is that the amendment's sentence divides a CONDITIONAL numerator by
        a MARGINAL denominator, which is not a meaningful share of anything, and
        the -028 receipt then compared it against a different ratio and recorded a
        disagreement that does not exist.
      why_nonfatal: >-
        It changes no criterion and no threshold, and the qualitative claim both
        support - that one named tuple takes a large plurality of the CR-3
        chance-alarm mass - is correct under either denominator.
      required_correction_before_any_record_quotes_it: >-
        A record quoting a share must state which denominator it uses. The
        conditional share is 41.44 percent; the ratio against the declared
        marginal line is 50.87 percent. The two-tuple figure `about 80 percent` is
        confirmed exactly at 79.98 percent against the marginal line.
    - id: RT29-2
      severity: NONFATAL
      target: >-
        C-15 fourth after-bullet, and RT-20260729-025 NB-2, both of which this
        objection contradicts
      statement: >-
        THE CLAIM THAT 0.377 DOES NOT BOUND THE CONDITIONAL FIGURE IS FALSE AS
        STATED, AND THE AMENDMENT ADOPTED IT FROM ITS REVIEWER WITHOUT CHECKING
        WHAT THE SENTENCE IT SUPERSEDES ACTUALLY ASSERTS. Section 8 of the
        feasibility table asserts a PROBABILITY - that the probability at least
        one criterion registers a chance alarm under a perfectly correct
        diagnostic is AT MOST 0.377. Computed exactly here by convolving the
        48 per-tuple joint laws, that probability CONDITIONAL on the committed
        draw is 0.341 with A2 removed and 0.292 under A2. BOTH ARE BELOW 0.377.
        What exceeds 0.377 is the SUM OF EXPECTED EXCEEDANCE COUNTS, 0.4427 with
        A2 removed and 0.4199 under A2, which is a different quantity and is the
        one RT-20260729-025 computed.
      narrowest_correct_statement: >-
        0.377 IS NO LONGER A DERIVED BOUND - the derived conditional union bound
        is 0.4427 - BUT IT REMAINS A TRUE BOUND on the quantity the sentence
        asserts it about, whose conditional value is 0.341.
      why_nonfatal_and_which_way_it_cuts: >-
        C-15's relabelling states the contract's position as WORSE than it is.
        That direction is conservative, it is not a loosening, and it cannot make
        any outcome easier to report as a pass. It is recorded because a
        pre-registered sentence should not be wrong in either direction, and
        because a run record that quotes `0.377 does not bound this` would be
        quoting an inaccuracy.
    - id: RT29-3
      severity: NONFATAL
      target: the_variance_model_for_CR_3.step_6_approximation_A2
      statement: >-
        A2 SHOULD NOT HAVE BEEN CARRIED AS A DECLARED APPROXIMATION, BECAUSE
        REMOVING IT COSTS ONE QUADRATURE AND IT MATTERS MORE THAN THE AMENDMENT
        IMPLIES. The declared direction is correct - replacing the random
        denominator by its central value understates the tail - but the magnitude
        is not small. Removing A2 moves the expected CR-3 exceedance count from
