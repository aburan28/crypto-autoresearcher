  variance_model_ruling_gate_Q3:
    VM_1_as_a_model:
      ruling: CORRECT
      reasoning: >-
        The derivation in steps 1 to 4 is right and this session re-derived it
        independently rather than checking it. mu_001, s_001, sem_001, T, P_pred,
        N and C_red are committed constants; the only randomness in CR-3 under a
        perfectly correct repaired null is (mu_rep, s_rep); the numerator's exact
        mean is bias_i - r_i with no approximation; and delta_i/sqrt(2) is indeed
        the very quantity C-9 already pre-registers for IV-1 reporting. Step 4 is
        the sharpest form of the finding and it is correct. The residual r_i as
        defined reproduces IN-1's own recorded
        residual_after_adding_back_S_m_minus_2_term at all 48 tuples to an
        absolute difference of 0.0.
    A1:
      ruling: ADEQUATE, AND ITS DIRECTION IS NOT UNKNOWN - IT IS BOUNDED
      reasoning: >-
        The amendment declares A1's direction and magnitude unknown and not
        claimed. That is over-cautious and this session bounds it. Writing rho for
        the ratio of the repaired arm's true standard error to sem_001, the budget
        over rho in [0.85, 1.15] - far wider than either error source justifies -
        moves by at most plus 5.0 percent and minus 4.3 percent, and the ranking
        of tuples does not change. The two contributions to rho minus one are the
        structural change in spread from pre-marking s bins, which is O(s/N) and at
        most 0.55 percent at m=3 and 0.025 percent at m=2, and the sampling error
        in s_001 itself, relative sd 1/sqrt(2(n_rep-1)), i.e. 7.1 percent at
        n_rep=100 and 13.1 percent at n_rep=30. THE AMENDMENT IS ALSO RIGHT THAT NO
        CRITERION DEPENDS ON A1, because CR-1 and CR-2 denominate on the measured
        s_rep and CR-3's denominator uses the measured sem_rep and the committed
        sem_001, never the true standard error.
      recommended_replacement: NONE REQUIRED
    A2:
      ruling: >-
        CORRECT IN DIRECTION, UNDERSTATED IN MAGNITUDE, AND IT SHOULD HAVE BEEN
        REMOVED RATHER THAN DECLARED
      reasoning: >-
        Replacing a random denominator by its central value understates the tail,
        so every figure computed under VM-1 as bound is a LOWER bound - the
        amendment's declared direction is right. But removing A2 is a single
        quadrature over u distributed as chi2_{n_rep-1}/(n_rep-1) and moves the
        headline figures by 10 to 52 percent. See objection RT29-3. The exact-A1
        column of conditional_budget_note.md is supplied and governs the record.
      recommended_replacement: >-
        REPLACED IN THIS CARD by exact integration over the denominator's
        sampling distribution. No criterion changes; only the declared budget
        becomes correct rather than conservative.
    corollary_VM_1a_the_marginal_correlation:
      ruling: CORRECT, AND ITS EFFECT IS NOW QUANTIFIED
      reasoning: >-
        Conditional on the committed draw, CR-1's and CR-3's numerators differ by
        the CONSTANT r_i and both statistics are deterministic functions of the
        same (mu_rep, s_rep). The 1/sqrt(2) figure section 8 names is the marginal
        correlation obtained by treating mu_001 as redrawn, and it is not the
        conditional dependence. Any conditional total that subtracts a 1/sqrt(2)
        correlation term uses the wrong figure, INCLUDING THE ONE IN
        RT-20260729-025'S OWN NB-2 DISCHARGING CHANGE, and the amendment is right
        to say so. THE QUANTIFICATION OI-4 LEFT OPEN - the exact overlap
        correction to the MISS-STRUCTURED route sum is 0.0027 under A2 and 0.0063
        with A2 removed, small and favourable. Across DIFFERENT tuples the streams
        are distinct by construction per RC-C and the independence
        RT-20260729-016 endorsed is untouched, exactly as the amendment states.
    corollary_VM_1b_the_student_t_does_not_transfer:
      ruling: CORRECT, AND THE REFUSAL TO NET THE TWO ERRORS IS CORRECT
      reasoning: >-
        z_shift is Z_delta divided by sqrt(1 + u) where a Student-t at n_rep - 1
        degrees of freedom would be Z divided by sqrt(u). Replacing u by (1+u)/2
        halves the relative variability of the denominator, so the law lies
        strictly between N(delta, 1/2) and t_{n_rep-1}/sqrt(2) and is STRICTLY
        LIGHTER-TAILED than the t section 8 assumes, for every finite n_rep. The
        amendment's refusal to net this against the non-centrality is right and
        the arithmetic vindicates it - the tail-shape error is worth about minus
        0.0027 in the expected exceedance count while the non-centrality is worth
        plus 0.065, a factor of twenty-four, so netting them would have hidden the
        defect.
    the_scale:
      ruling: SETTLED - 3.000 times sqrt(2) = 4.242641 IS THE CORRECT SCALE
      reasoning: >-
        Conditional on the committed draw the numerator's standard deviation is
        the repaired arm's own standard error while the denominator is
        sqrt(sem_rep^2 + sem_001^2), so Var(z_shift) = 1/2 in units of sem_001
        under A1 and A2 and firing at 3.000 requires the underlying normal to
        exceed 4.242641. The amendment's conjecture that the -026 recomputation
        slipped on this scale is NOT CONFIRMED and is not refuted; what IS
        established is that the -028 receipt's figures used the correct scale and
        differ from RT-20260729-025's only because they set the exact process bias
        to zero in delta_i.

  direction_test_and_closed_scope_gate_Q4:
    classification_of_every_repair:
      C-14: >-
        NARROWING plus DISCLOSING. A claim of certainty about a random quantity
