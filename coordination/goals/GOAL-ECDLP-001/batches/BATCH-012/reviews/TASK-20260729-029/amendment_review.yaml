        conditional one (an overstatement in the conservative direction, RT29-2),
        binds the conditional budget by an explicit rule, and adds a DISPATCH GATE
        that did not exist before. A NEW GATE ON EXECUTION IS THE OPPOSITE OF A
        LOOSENING. NOTHING LOOSENED.
      C-16: >-
        DISCLOSING, FIRING NOTHING. It pre-registers by name the two tuples most
        likely to fire AGAINST this contract, and requires the MISS-STRUCTURED
        chance rate on the record before any draw. Naming a tuple in advance
        routes nothing and excuses nothing - CR-3's disposition is untouched and an
        exceedance at a named tuple still records the prediction as NOT MET and
        still routes by the unchanged rules of C-1 and C-4. CHECKED SPECIFICALLY
        FOR A DRESSED-UP LOOSENING AND IT IS NOT ONE.
      C-17: >-
        DISCLOSING. One sentence is extended to name the largest non-centrality in
        the contract, which it had omitted. No number in any criterion changes.
      C-18: >-
        NARROWING. It REMOVES a binding comparison the previous amendment added,
        and keeps the supersession half, which is correct. This is the only repair
        that removes something, and removal is the right direction for a widening.
      C-19: >-
        TIGHTENING. Three determinism choices that were the Executor's become the
        contract's, and the numpy granularity mismatch resolves to the STRICTER
        form. No distribution changes. RT29-6 shows the shuffle pin is
        load-bearing.
      C-20: >-
        TIGHTENING plus DISCLOSING. A self-critical obligation that bound one
        branch now binds every record including EV-ECDLP-009 and DEC-20260729-002,
        and one further reporting-only quantity is added with no threshold. A
        WIDENED OBLIGATION IS NOT A WIDENED CLAIM.
      C-21: >-
        DISCLOSING, AND AGAINST THE AUTHOR. It records that the RC-F position is
        worse than previously stated, and RC-F is correctly still not discharged.
    anything_that_loosens: >-
      NONE FOUND. This session looked specifically for a loosening dressed as a
      clarification, checked every `after` and `after_ADOPTED_VERBATIM` text
      against its `before`, checked C-16 in particular as the most natural place
      to hide an escape route, and checked whether any reporting-only clause
      acquires a threshold by implication. NO THRESHOLD MOVED, NO CRITERION WAS
      WEAKENED, NO SET MOVED, NO ARM WAS ADDED, NO REPLICATE COUNT CHANGED, NO
      TOLERANCE CHANGED, NO INVALIDATION RULE CHANGED, AND NO OUTCOME BECAME
      EASIER TO REPORT AS A PASS. Two of the eight changes make the contract
      HARDER to execute at all - C-15's dispatch gate and C-16's requirement that
      a chance rate exist before any draw. THE DIRECTION TEST HOLDS.
    the_4_000_severity_edge: >-
      VERIFIED NOT MOVED AND NOT REOPENED. v3 contains no replacement text for it;
