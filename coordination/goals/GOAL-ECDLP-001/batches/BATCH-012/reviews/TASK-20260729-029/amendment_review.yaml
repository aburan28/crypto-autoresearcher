    - id: RT29-4
      severity: NONFATAL
      target: C-14 after_ADOPTED_VERBATIM_FROM_THE_REVIEWER and second_replacement
      statement: >-
        `E[n_neg] = 48` AND `n_neg = 48 IN EXPECTATION` ARE BOTH FALSE UNDER THE
