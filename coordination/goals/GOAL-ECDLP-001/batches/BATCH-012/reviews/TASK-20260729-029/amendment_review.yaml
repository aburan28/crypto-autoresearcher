        adopted reading the counterfactual statistics are T/sem_001, T/s_001 and
        T/(sqrt(2) sem_001), and the firing sets are CR-1 at 20 tuples, CR-2 at 5,
        CR-3 at 18 and the cannot-fire complement at 28 with a 25 at m=2 plus 3 at
        m=3 arity split. ALL FOUR CARDINALITIES AND ALL FOUR MEMBER LISTS MATCH
        WHAT v2 PUBLISHED AND WHAT v3 CARRIES FORWARD. CR-3's 18 is a strict
        subset of CR-1's 20 and CR-2's 5 is a strict subset of CR-1's 20, as the
        contract states. NO SET MOVED.
      independent_verification_of_the_rejected_reading: >-
        Under the LITERAL single-arm reading that C-14 rejects, CR-3's
        counterfactual firing set is 19 tuples, the extra member being T-18-2-B58
        at 3.4578738 against a threshold of 2.1923. RT-20260729-025 reported
        3.4579. INDEPENDENTLY CONFIRMED TO FIVE DECIMALS, by a different
        computational route.
      what_is_not_repaired_and_why_it_is_not_blocking: >-
        The verbatim-adopted sentence carries `E[n_neg] = 48` and `n_neg = 48 in
        expectation`, and BOTH ARE FALSE UNDER THE READING C-14 ADOPTS. Computed
        here, E[n_neg] under that counterfactual is 40.94, not 48. See objection
        RT29-4. It is nonfatal because it feeds no criterion - C-18, in this same
        amendment, establishes that the counterfactual sets and statistics feed no
        criterion, no threshold, no invalidation rule and no verdict - and because
        the OPERATIVE figure stated in the same clause, P(CR-4 fires) = 0.997, is
        correct (this session computes 0.998). The direction of the error is that
        it OVERSTATES the design's own counterfactual power, which is not a
        loosening of anything a realised run is scored against.
    NB_2:
      severity_as_raised: BLOCKING
      disposition: REPAIRED BY DISCLOSURE, AND DISCLOSURE IS SUFFICIENT HERE
      the_ruling_this_card_was_asked_to_make: >-
        DISCLOSURE IS ENOUGH. RE-CENTRING WAS NOT REQUIRED AND WOULD HAVE BEEN
        WRONG. The Coordinator's stated reason is correct, and this session
        establishes something stronger than the Coordinator asserted - re-centring
        would not merely calibrate CR-3 on the committed draw, IT WOULD DELETE THE
        COMMITTED DRAW FROM THE CRITERION ENTIRELY. Algebraically, subtracting the
        per-tuple offset (bias_i - r_i) from CR-3's numerator leaves
        (mu_rep - mu_001) - T - (bias_i - r_i) = mu_rep - m_rep, in which mu_001
        CANCELS. A re-centred CR-3 is a self-consistency check of the repaired arm
        against its own analytic mean, carrying no comparison to the committed
        package at all, and it is structurally incapable of detecting the case
        where mu_001 is itself at fault - which is one of the two live
        explanations under test. RE-CENTRING WOULD HAVE REMOVED THE CRITERION, NOT
        REPAIRED IT.
      what_disclosure_had_to_supply_to_be_sufficient: >-
        A CRITERION'S REFERENCE DISTRIBUTION MUST MATCH ITS STATISTIC BEFORE ANY
        DRAW - that requirement is accepted in full and is not weakened here. What
        NB-2 identified is that the DECLARED reference did not match. The match is
        restored by producing the correct conditional reference, which C-15 binds
        by rule and makes a dispatch gate, and which this card supplies in
        conditional_budget_note.md. THE TEST OF SUFFICIENCY IS THEREFORE WHETHER
        THE NUMBER EXISTS ON THE COMMITTED RECORD BEFORE THE FIRST DRAW, NOT
        WHETHER THE STATISTIC MOVED. It will exist, if TASK-20260729-030 commits
        this card's two artifacts. IF IT DOES NOT, THE DISPATCH GATE IS NOT
        SATISFIED AND TASK-20260729-018 MUST NOT RUN, and that conditionality is
        part of this PASS.
      independent_verification_of_the_figures: >-
        EVERY ONE OF RT-20260729-025'S SEVEN QUOTED FIGURES IS REPRODUCED HERE
        FROM IN-1, TO THE PRECISION IT WAS QUOTED AT, BY A SESSION THAT DID NOT
        PRODUCE THEM. Expected conditional CR-3 exceedances at 3.000 0.229893
        against 0.22989; P(at least one CR-3 alarm) 0.210755 against 0.2108;
        p at T-18-2-B264 0.095265 against 0.0953; p at T-14-2-B118 0.054505
        against 0.0545; P(CR-3 at two or more tuples) 0.018289 against 0.0183;
        expected exceedances at 4.000 0.005198 against 0.0052; conditional union
        total 0.419913 against 0.4196. THE FULL 48-TUPLE delta TABLE, THE PER-TUPLE
        RANKING AND THE SPURIOUS MISS-STRUCTURED RATE ARE IN
        conditional_budget_note.md.
      the_scale_question_settled: >-
        SETTLED, AND THE AMENDMENT'S CONJECTURE IS NOT THE EXPLANATION OF THE
        FIGURES ACTUALLY ON THE RECORD. The threshold on the underlying normal
        scale is 3.000 times sqrt(2) = 4.242641, because conditional on the
        committed draw only mu_rep is random so the numerator's sd is sem_001
        while the denominator is sqrt(2) sem_001, giving Var(z_shift) = 1/2. The
        TASK-20260729-028 receipt already used that correct scale; its figures
        differ from RT-20260729-025's for a DIFFERENT reason, namely that it
        defined delta_i as residual_after_adding_back divided by sem_001 and
        thereby set the exact process bias to zero. Recomputing under exactly that
        definition reproduces 0.23291, 0.0942 and 0.0584 to five significant
        figures. INCLUDING THE PROCESS BIAS IS CORRECT.
      what_is_carried_as_new_objections: >-
        RT29-1 on the top-tuple share denominators, RT29-2 on the claim that 0.377
        does not bound the conditional figure, RT29-3 on A2, RT29-7 on the
