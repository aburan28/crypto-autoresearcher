  baseline_comparison: >-
    DECLARED INAPPLICABLE, AND THE REASON IS RECORDED RATHER THAN THE FIELD LEFT
    EMPTY. EXP-YIELD-002 is a curve-free Monte-Carlo re-derivation of an occupancy
    control object. It computes no discrete logarithm, collects no relation,
    builds no sum set and touches no cost model, so there is no Pollard-rho, BSGS
    or specialized baseline against which its output could be compared. The
    contract's own matched_baseline_position_RC7 is DECLARED INAPPLICABLE with its
    reason and this review does not disturb that. A REVIEW THAT INVENTED A
    BASELINE COMPARISON HERE WOULD BE MANUFACTURING ONE.

  counterexample_or_mutation: >-
    THE CHEAPEST DISCRIMINATING CONTROL, AND IT WAS RUN. If the conditional
    non-centrality delta_i were not ordinary sampling noise, the committed
    BATCH-011 antipodal arm would itself be inconsistent with the analytic
    as-recorded process and the whole conditional budget would be a SYMPTOM rather
    than a nuisance - which would change what NB-2 means. Across the 48 tuples
    delta_i has mean +0.0122, sd 1.1303 and max magnitude 2.9336, with 16 tuples
    above 1 against 15.3 expected under N(0,1) and 3 above 2 against 2.2 expected;
    the sd of a 48-sample sd is about 0.103, so 1.13 is about 1.3 standard
    deviations. THE COMMITTED DRAW IS CONSISTENT WITH BEING A FAIR SAMPLE OF THE
    ANALYTIC AS-RECORDED PROCESS. This SUPPORTS, and does not prove, the
    Coordinator's decision to treat NB-2 as an accounting defect rather than a
    design defect. IT ESTABLISHES NOTHING ABOUT DECOMPOSITION YIELD, NOTHING ABOUT
    ANY CURVE, AND NOTHING ABOUT THE OCCUPANCY NULL IN EITHER DIRECTION.

