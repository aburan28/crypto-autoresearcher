  declared_extension_rulings_gate_N4:
    C_3d_throwing_call_and_stream_order:
      ruling: IN SCOPE, NECESSARY, AND ADOPTED CORRECTLY - NOT SCOPE CREEP.
      reasoning: >-
        OBJ-3's stated harm is the loss of BIT-EXACT THIRD-PARTY REPRODUCTION.
        Naming step 1's call alone does not restore it, because step 2's
        consumption of the same generator is what fixes the stream. Frozen v1
        already bound the ORDER - `with the pre-marking draw taken BEFORE the
        throwing draws within each replicate` - and already bound sequential
        replicate consumption without re-seeding, so C-3d's genuinely new content
        is narrow - that step 2 is exactly ONE vectorised call rather than
        C_red/2 scalar calls, that the returned array is consumed in index order,
        and that step 1 is OMITTED ENTIRELY when s = 0. The last of these is
        load-bearing rather than decorative, because KA-6 has s = 0 and a
        zero-size choice call is exactly the kind of implementation-dependent
        stream consumption OBJ-3 is about. It changes no threshold, no criterion,
        no tolerance and no distribution.
