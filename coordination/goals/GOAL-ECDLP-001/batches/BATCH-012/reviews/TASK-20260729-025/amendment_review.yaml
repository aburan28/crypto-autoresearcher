        mu_rep = P_pred - T and leaving mu_001 at its committed value gives
        |(mu_001 - P_pred) + 2T|/(sqrt(2) sem_001), which equals
        T/(sqrt(2) sem_001) ONLY IF mu_001 = P_pred - T - the identification the
        amendment explicitly deletes and rejects. Re-derived from IN-1 in this
        session, the CR-3 counterfactual firing set under the LITERAL adopted
        counterfactual is 19 TUPLES, NOT 18, adding T-18-2-B58 at 3.4579 against
