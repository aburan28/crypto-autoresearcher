        now says which reading it means, which is precisely what OBJ-2 was ruled
        BLOCKING for.
      discharging_change: >-
        ONE SENTENCE, PRE-DATA, NO THRESHOLD MOVES. Replace the counterfactual
        sentence with - `UNDER THE COUNTERFACTUAL BOTH ARMS HAVE THE ANALYTIC
        AS-RECORDED MEAN, E[mu_rep] = E[mu_001] = P_pred - T at every declared
        tuple, and the committed draw mu_001 is REPLACED BY THAT MEAN and is not
        used as a realised value. From this the counterfactual statistics are
        DETERMINED as T/sem_001 for CR-1, T/s_001 for CR-2 and T/(sqrt(2) sem_001)
        for CR-3, and E[n_neg] = 48. THE FOUR SETS BELOW ARE EXPECTED-STATISTIC
        FEASIBILITY SETS AND NOT PREDICTIONS OF A REALISED FIRING SET.` Then
        replace `n_neg = 48 with certainty` with `n_neg = 48 in expectation, and
        P(CR-4 fires) = 0.997 once the sampling variance of a single run is
        carried, per the pre-registered power curve`.
