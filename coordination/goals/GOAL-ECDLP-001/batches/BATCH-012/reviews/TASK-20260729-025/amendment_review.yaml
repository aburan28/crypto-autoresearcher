  new_objections:
    - id: NB-1
      severity: BLOCKING
      target: 'protocol_amendment.ordered_disposition_by_objection.OBJ_2 and changes.C-2.after'
      statement: >-
        THE ADOPTED COUNTERFACTUAL IS STILL TWO-VALUED, AND ITS TWO VALUES
        DISAGREE ON A PRE-REGISTERED SET AT A NAMED TUPLE. C-2 states that the
        counterfactual is `mu_rep = P_pred - T at every declared tuple, and
