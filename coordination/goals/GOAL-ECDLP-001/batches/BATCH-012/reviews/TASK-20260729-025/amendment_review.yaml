  power_curve_ruling:
    is_the_curve_right: >-
      YES. ALL EIGHTEEN PUBLISHED FIGURES WERE RE-DERIVED IN THIS SESSION FROM
      IN-1 AND ALL EIGHTEEN REPRODUCE EXACTLY - E[n_neg] of 26.66, 29.22, 31.71,
      34.46, 37.97 and 40.72; P(CR-4 fires) of 0.009, 0.048, 0.179, 0.499, 0.919
      and 0.997; and expected-|z_sem| tuple counts of 0, 1, 5, 8, 16 and 20. The
      phi = 1.00 row is internally consistent with the corrected CR-1 count of 20,
      which is a real cross-check and it passes.
    is_the_binding_sentence_strong_enough: >-
      ALMOST, AND ONE CLAUSE SHORT. The sentence - `A PASS OF P-CORE IS NOT
      EVIDENCE THAT THE REPAIRED NULL IS EXACT ... a shortfall of 5 percent of T
      or less would be very unlikely to be detected by anything in this contract.
      Any record reading a P-CORE pass must carry this sentence` - is correct,
      pre-registered, and mandatory on records. WHAT IS MISSING is that the
      obligation is stated only for a record `reading a P-CORE pass`. A
      MISS-MARGINAL record is equally blind to a 5 percent shortfall and equally
      liable to be read as `nearly passed`. The obligation should attach to EVERY
      EXP-YIELD-002 record, to EV-ECDLP-009 and to DEC-20260729-002, in the PD-7
      pattern.
    should_the_experiment_run_at_all: >-
      YES, ONCE NB-1 AND NB-2 ARE RECORDED. THE POWER PROFILE IS NOT A REASON TO
      WITHHOLD IT. The failure mode under test is GLOBAL - either the missing
      pre-marking is the whole story or it is not - so per-tuple powerlessness at
      28 tuples does not remove global falsifiability, and under the counterfactual
      CR-1's expected |z_sem| reaches 3.000 at 20 tuples and CR-4 fires with
      probability 0.997. ABSENCE OF POWER AGAINST A PARTIAL FAULT IS A DECLARED
      LIMIT AND NOT AN IMPOSSIBILITY, and this session converts it into neither.
      The limit is stated BEFORE execution, which is the only honest way to carry
      one. The reason to hold the run is NB-1 and NB-2, not the power curve.
    further_reporting_obligation_recommended: >-
      YES, AND IT IS CHEAP. Require every run record to report the realised
      phi-equivalent - the value of phi for which the observed aggregate shortfall
      would be typical - beside the pre-registered curve, so that a reader of a
      P-CORE pass sees WHICH PART OF THE CURVE THE RUN ACTUALLY EXCLUDED rather
      than only that it passed. This feeds no criterion and no verdict.

