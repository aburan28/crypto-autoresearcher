artifact:
  task_id: TASK-20260823-39b936
  kind: candidate_constructor_and_primitive_operations
  zero_run: true
  freeze_order:
    - parameters
    - representations
    - primitive interface
    - fresh-target quantifier
    - output
    - adversary
    - cost
  parameters:
    group: G=<P> of prime order N with N=p^(1+o(1)) and p>3
    scale: B=N^(1/5)
    decks: five signed source-labelled occurrence decks of size Theta(B)
    retained_pair_decks: D_12 and D_34 each have Theta(B^2) labelled occurrences
    fifth_labels: distinct public t_a for a in I_5
  constructor:
    name: ST-EVR supplied-term exact support evaluator
    status: scoped_counterexample_not_positive_constructor
    input: Fixed H_12, g_I, preprocessed labelled decks, and individual-query access to e_(a,v) in K for each a in I_5 and v in D_34.
    promised_domain: Every formal table e in K^(I_5 times D_34), not merely tables realizable by one elliptic target R.
    required_output: Monic z_e whose t_a support indicates whether some v has e_(a,v) in the root multiset of H_12.
    result: Any deterministic exact evaluator queries all Theta(B^3) entries in the worst case; the same holds coin-by-coin for randomized zero-error evaluators.
    positive_p1553_constructor: not_supplied
  primitive_operations:
    allowed:
      - Read preprocessed H_12, g_I, labels, and D_34 metadata.
      - Query one named scalar e_(a,v).
      - Perform field arithmetic and equality/root-membership tests on queried scalars.
      - Branch only on preprocessed state and queried values.
    forbidden_as_outside_family:
      - Any oracle returning a product, resultant, gcd contribution, subinterval unit, or aggregate depending on unqueried entries.
      - A degree-B^2 target vector or B^3 translated endpoint table hidden in advice.
      - Supplied orbit-resultant terms, a post-hoc B^3 source table, or unpaid replay.
  representations:
    target_dependent: Independent scalar oracle table of B times Theta(B^2) entries.
    preprocessed: H_12, g_I, D_12, D_34, dyadic ancestors, labels, multiplicities, and backpointers, all independent of R.
    output: Squarefree fifth-occurrence support polynomial; no row multiplicity guarantee.
  quantifier_order:
    exact: For every exact ST-EVR decision tree correct for every formal table, there exists a table and transcript that forces all entries to be queried.
    excluded: No quantifier over all elliptic-net or division-polynomial algorithms.
  gauge_invariance:
    positive_operation: absent
    scoped_negative: The adversary uses only membership of supplied encodings in the fixed H_12 root multiset, but the independent-table enlargement is representation-specific.
  dependency_graph:
    - H_12 roots plus queried entries determine the transcript.
    - An unqueried entry is absent from the transcript.
    - Flipping that entry onto a root changes exact fifth-label support.
    - Therefore exact output forces all B^3 entry queries.
  scope_ceiling: unverified_zero_run_formula_level_scoped_counterexample_for_ST-EVR_only
