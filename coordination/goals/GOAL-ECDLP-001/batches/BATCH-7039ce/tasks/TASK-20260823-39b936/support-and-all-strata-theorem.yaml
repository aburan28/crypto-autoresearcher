artifact:
  task_id: TASK-20260823-39b936
  kind: support_and_all_strata_theorem
  definitions:
    coefficient_ring: K=F_p[theta]/h(theta) for a fixed irreducible cubic h
    encoding: kappa([x:y:1])=x+theta*y and kappa(O)=theta^2
    g_I: product over a in I_5 of (T-t_a)
    A_I: K[T]/(g_I), canonically Map(I_5,K)
    H_12: product over labelled u in D_12 of (U-kappa(u))
    H_34_R: product over labelled v in D_34 of (U-kappa(R-A_I(T)-v))
    r_R: Res_U(H_12,H_34_R) modulo g_I
    z_R: monic gcd(g_I,r_R)
  support_theorem:
    exact_identity: For each a, r_R(t_a) equals, up to fixed sign, the product over labelled u,v of kappa(u)-kappa(R-a-v).
    support: z_R is the product of T-t_a over fifth occurrences extendible to at least one labelled relation u+v+a=R.
    ST_EVR_adversary: Fix c in the H_12 root multiset and d outside it. An all-d formal table has z=1. Replacing one entry e_(a0,v0) by c yields z divisible by T-t_a0. An algorithm that did not query that entry sees the same transcript on both inputs and cannot be exact on both.
  multiplicity_semantics:
    fifth_labels: z_R is squarefree because the t_a are distinct occurrence labels.
    pair_rows: Repeated endpoints alter resultant order and module length, not whether T-t_a occurs.
    limitation: z_R alone does not recover row count or compatible labelled u,v.
  strata:
    complete_chart: identity, infinity, vertical, tangent, secant, repeated, and nonreduced cases are typed before kappa encoding.
    masks: denominators are inverted only under nonzero masks; P=Q with y=0 is vertical.
    adversary_scope: The formal supplied-term proof begins after complete-chart encoding. It does not assert that arbitrary one-entry mutations are realizable in every geometric stratum.
  one_hit_control:
    formal_table: Exactly one e_(a0,v0) equals c and every other entry avoids all roots of H_12.
    expected_support: z=T-t_a0
  no_relation_control:
    formal_table: Every entry avoids all roots of H_12.
    expected_support: z=1
  proof_obligations:
    - Verify the evaluation identity and monic support extraction.
    - Verify transcript identity by induction for adaptive decision trees.
    - Keep the formal-table promise distinct from actual elliptic realizability.
    - Check the nonconstant-H_12 and off-root field-value slice.
  clause_assessment:
    exact_support_semantics: satisfied_from_internal_P1553_interface
    all_geometric_strata_positive_constructor: not_satisfied
    ST_EVR_formal_family_counterexample: formula_level_complete_pending_independent_review
  claims_excluded:
    - generic selector lower bound
    - actual elliptic-table lower bound
    - multiplicity recovery
    - positive target-local constructor
    - ECDLP speedup or closure
