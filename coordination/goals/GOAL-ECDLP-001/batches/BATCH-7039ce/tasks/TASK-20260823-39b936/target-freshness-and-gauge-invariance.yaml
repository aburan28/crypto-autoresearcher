artifact:
  task_id: TASK-20260823-39b936
  kind: target_freshness_and_gauge_invariance
  preprocessing:
    allowed: D_12, D_34, H_12, fifth occurrence labels, complete-chart metadata, dyadic ancestors, multiplicities, and backpointers.
    independence: R appears in no stored coefficient, seed, cache, pointer, or advice.
    cap: B^(9/4+o(1)) setup, advice, and state.
  fresh_target:
    order: Preprocessing is frozen first; then an adversary supplies a fresh formal table or an actual fresh R.
    replacement_test: Replacing R after preprocessing invalidates any target-dependent hidden state.
    ST_EVR: Each e_(a,v) is available only when that named entry is queried.
  forbidden_dependencies:
    - degree-B^2 target coefficient vector
    - B^3 translated endpoints
    - target-specific supplied resultant terms
    - post-hoc B^3 source table
    - target-dependent preprocessing or advice
  gauge_action:
    geometric: A Weierstrass coordinate change transports points, complete-chart branches, kappa, and both root sets together.
    invariant_observable: Existence of u+v+a=R and fifth-label support.
    caveat: ST-EVR's independent scalar-table promise is not a coordinate-free elliptic family.
  invariance_claim:
    positive: not_established
    negative: The transcript adversary is invariant under simultaneous relabelling of the formal value alphabet that preserves root versus nonroot membership, but this is weaker than elliptic gauge invariance.
  tests:
    - Freeze preprocessing, replace the target, and require a new target transcript.
    - Apply a simultaneous encoding relabelling and check that root/nonroot support is unchanged.
    - Reject any proof that independently mutates an entry while still calling the mutated table an actual elliptic orbit.
  conclusion: >-
    Freshness is explicit for ST-EVR, but no oracle-free gauge-invariant
    elliptic-net or division-polynomial constructor has been supplied. The
    scoped negative cannot discharge that missing positive obligation.
