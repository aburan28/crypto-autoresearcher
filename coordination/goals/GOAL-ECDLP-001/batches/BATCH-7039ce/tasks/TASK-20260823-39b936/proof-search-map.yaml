artifact:
  task_id: TASK-20260823-39b936
  kind: proof_search_map
  proposal_id: IDEA-20260823-69a3a0
  bottleneck: >-
    Exact fresh-target fifth-label support must be obtained before a B by B^2
    target table is represented, while retaining enough provenance for
    labelled-source replay.
  baseline_embedding:
    parameter_slice:
      - H_12 is fixed, nonconstant, and has a root c.
      - The field K contains an element d outside the H_12 root set.
      - I_5 has B distinct occurrence labels and D_34 has Theta(B^2) labelled occurrences.
      - Fresh-target values are formal independent supplied scalars.
    reproduction_check:
      no_relation: All entries equal d, so no t_a is in support and z=1.
      one_hit: One entry at (a0,v0) equals c and all others equal d, so z=T-t_a0.
  observation_collision:
    observable: Complete ST-EVR decision-tree transcript.
    distinct_preimage_search: Run on the all-d table; if fewer than all entries are queried, flip one unqueried entry to c. The transcript is unchanged and the correct output differs.
  constructive_transforms:
    - transform: Structured variable-coefficient net step before scalar expansion.
      proposed_object: Gauge-invariant dyadic interval unit product coupled across all v for an orbit interval of fifth labels.
      predicted_gain: A logarithmic-depth split could reveal support without B^3 term queries if each bulk step costs within the B^(5/4) total budget; no formula or proof is supplied.
    - transform: Coordinate-free finite-module operation.
      proposed_object: Direct support/Fitting generator of the finite module M_R without a size-B^2 presentation over width B.
      predicted_gain: Would bypass the ST-EVR input model; no compatible operation is supplied.
  quantifier_order:
    formal_negative: forall exact ST-EVR algorithms A, if A is correct for all formal tables, then exists a table e on which A queries every entry.
    randomized: applies only after fixing coins for zero-error algorithms.
    excluded: bounded-error distributions and algorithms promised only actual elliptic tables.
  method_ceiling:
    strongest_certifiable_claim: Theta(B^3) worst-case scalar-query requirement for ST-EVR.
    nearby_object_control:
      object: Oracle Bulk(J) returning the exact product contribution of all indices in a dyadic interval J in one charged operation.
      known_false_extension: The per-entry adversary does not apply because Bulk(J) depends on the mutated entry even when that scalar is never individually queried.
  proof_obligations:
    - claim: P1553 support identity distinguishes the paired tables.
      responsibility: Reviewer joint J2.
    - claim: Adaptive transcript equality holds and family boundaries are typed.
      responsibility: Validator joint J3 blind re-derivation.
    - claim: Exact replay remains unpaid and no ECDLP consequence follows.
      responsibility: Red Team joint J4.
    - claim: Pareto and proves-too-much controls prohibit transfer beyond ST-EVR.
      responsibility: Red Team joint J5.
  disposition: >-
    The supplied-independent-term subfamily has a formula-level scoped
    counterexample. The structural elliptic exception remains open; select no
    positive route and retain REVISE.
