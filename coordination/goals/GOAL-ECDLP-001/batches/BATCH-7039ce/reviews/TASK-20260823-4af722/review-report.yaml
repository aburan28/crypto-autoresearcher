      decimal_N_exponent: 0.40
    - quantity: formal_query_gap_over_per_target_cap
      B_form: "B^3 / B^(5/4+o(1)) = B^(7/4-o(1))"
      N_form: "N^(7/20-o(1))"
      decimal_N_exponent_gap: 0.35
    - quantity: dense_target_state_gap_over_B2_cap
