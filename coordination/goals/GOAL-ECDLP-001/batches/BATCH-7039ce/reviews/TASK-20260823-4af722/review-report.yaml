      N_form: "N^(1/5)"
      decimal_N_exponent_gap: 0.20

  baseline_accounting:
    realized_serial_time_frontier_from_frozen_batch: "N^(1/2+o(1))"
    unrealized_conditional_total_time: "N^(9/20+o(1))"
    conditional_exponent_delta: "9/20 - 1/2 = -1/20"
    conditional_interpretation: >-
      If the per-target cap, Theta(B) aggregation, success, retry, and unit-cost
      premises all held, the advertised total-time exponent would be 1/20
      below the frozen rho baseline while using N^(2/5+o(1)) memory. This is
      arithmetic only and does not establish an achieved row.
    formal_ST_EVR_note: >-
      The Theta(N^(3/5)) result counts unit individual-position queries for one
      unrestricted formal table. It refutes the stated per-target cap inside
      that interface, but is not directly promoted into an end-to-end ECDLP
      cost comparison because scalar-query generation cost and actual elliptic
      realizability are outside the statement.

  cap_assessment:
    formal_ST_EVR_operation_family: breaks
    reason: >-
      Exact all-formal-table correctness forces Theta(B^3)=Theta(N^(3/5))
      unit scalar queries on the all-off-root input, strictly exceeding the
      declared B^(5/4+o(1))=N^(1/4+o(1)) per-target online cap. A supplied
      dense scalar grid or dense A_I[U] coefficient vector also costs
      Theta(B^3) scalar state, exceeding B^(2+o(1)) memory. Streaming avoids
      the latter storage conclusion but cannot avoid the former query-time
      conclusion.
    actual_elliptic_tables: inconclusive
    transfer_boundary: >-
      The single-cell toggle X_0 to X_1 is legal because the packet declares
      all K-valued tables. Actual elliptic tables may satisfy algebraic
      dependencies coupling many cells; a compact circuit, recurrence, or
      global algebraic query could then infer row support without reading an
      independently variable scalar at every formal address. Applying this
      lower bound to actual elliptic inputs requires a realizability or
      embedding theorem for the fooling pair, or another lower bound proved
      directly on the restricted elliptic family. None is supplied in the
      blind statement, so no generic elliptic-constructor impossibility,
      ECDLP lower bound, or lane closure follows.

