  transcript_separation:
    result: partial_transcripts_do_not_separate_the_exact_output
    worst_case_queries: "M = Theta(B^3) distinct positions"
    upper_bound: >-
      Query every position once, mark a row when an on-root response is seen,
      and form the monic support polynomial. This uses M distinct queries.
    lower_bound_certificate:
      base_table: "X_0[a,v]=d for every (a,v) in P"
      base_output: "S(X_0)=empty and z_X0(T)=1"
      adversarial_path: >-
        Answer d to every query. If a deterministic algorithm stops after
        fewer than M distinct addresses, choose one unqueried address
        (a_star,v_star).
      colliding_table: >-
        Let X_1 equal X_0 everywhere except
        X_1[a_star,v_star]=c.
      transcript_equality: >-
        The algorithm sees the same queried addresses and the same d response
        at every queried address on X_0 and X_1. Adaptivity does not help,
        because the next address is a function of that identical transcript.
      output_inequality: >-
        S(X_1)={a_star}, so z_X1(T)=T-t_(a_star), whereas z_X0(T)=1.
        The exact outputs differ in degree even if occurrence values elsewhere
        repeat.
      conclusion: >-
        Stopping before all M positions gives the same transcript for two
        formal inputs with different exact outputs, a contradiction. On the
        all-d table every exact deterministic decision tree therefore queries
        every position. Together with exhaustive scanning, the exact
        worst-case distinct-query complexity is Theta(B^3).
    zero_error_extension: >-
      Fix any random tape. The zero-error algorithm becomes a deterministic
      decision tree and the same all-d adversary applies. Under the packet's
      stated 'zero-error after fixing coins' quantifier, every admissible fixed
      tape must query all M positions on X_0; randomization does not reduce this
      worst-case or its expectation on X_0.
    repeated_query_note: >-
      Re-querying an address cannot reduce the M-distinct-position lower bound;
      total oracle calls are therefore at least M as well.

  exponent_rederivations:
    - quantity: independent_ST_EVR_positions_and_exact_formal_query_time
      B_form: "Theta(B^3)"
      substitution: "B=N^(1/5)"
      N_form: "Theta(N^(3/5))"
