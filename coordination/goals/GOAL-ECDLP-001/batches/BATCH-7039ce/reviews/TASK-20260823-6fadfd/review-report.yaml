  claim_boundary: >-
    This report owns only J1 formula, typing, target freshness, and gauge
    invariance and J2 support, multiplicity, all-strata semantics, and the
    one-hit/no-relation transcript counterexample. It reviews a zero-run
    formal supplied-independent-term query family. It does not assess J3, J4,
    or J5 and gives no whole-claim, P1553-lane, ECDLP-speedup, novelty,
    breakthrough, closure, or official-status verdict.
  joints:
    - joint: J1-formula-typing-and-gauge-invariance
      verdict: breaks
      formula_and_type_checks:
        - check: frozen_ST_EVR_domain_and_primitive_interface
          outcome: holds
          detail: >-
            The negative family is precise as a query model: preprocessing
            fixes H_12, g_I, the labelled sets, and metadata independently of
            the target; the fresh input is an arbitrary table
            e in K^(I_5 times D_34); one primitive query returns one named
            e_(a,v); and every aggregate depending on unqueried entries is
            outside ST-EVR. This is an oracle model, not the oracle-free
            positive constructor requested by the P1553 exception, and the
            packet says so.
        - check: quotient_ring_and_label_types
          outcome: revise
          detail: >-
            The intended CRT ring is sound only after explicitly typing an
            injective label map t:I_5->K and setting
            g_I=product_a(T-t_a). Distinct labels make g_I squarefree and give
            K[T]/(g_I) isomorphic to the product of one copy of K for every
            labelled fifth occurrence. The packet calls the labels distinct
            but never states t_a in K at the parameter declaration.
        - check: displayed_H_34_R_formula
          outcome: breaks
          detail: >-
            The frozen expression
            H_34^R(U,T)=product_v(U-kappa(R-A_I(T)-v)) is not literally typed.
            A_I was defined as the scalar K-algebra K[T]/(g_I), and the residue
            class T evaluates componentwise to the scalar labels t_a. It is
            not a point of E(F_p), so R-A_I(T)-v is not an elliptic-curve group
            operation. No point-valued interpolation or complete-chart lift of
            a is defined in the packet.
          exact_repair: >-
            Keep A=K[T]/(g_I) and define H_34,e in A[U] by CRT components:
            for each a, H_34,e,a(U)=product_(v in D_34)(U-e_(a,v)); on an
            actual target specialize e_(a,v)=kappa(R-a-v). Equivalently define
            a separate point-valued lookup alpha with alpha(t_a)=a and type
            all of its complete-chart coordinates and masks. A_I(T) itself
            cannot serve as alpha.
        - check: kappa_totality_and_injectivity
          outcome: holds_after_explicit_argument
          detail: >-
            With h irreducible cubic, 1, theta, theta^2 are linearly independent
            over F_p. Therefore x+theta*y uniquely encodes every affine point,
            and theta^2 cannot equal an affine encoding; kappa(O)=theta^2 makes
            kappa total and injective on E(F_p). This argument is needed for
            the relation equivalence and should be stated in the repaired
            formula record.
        - check: target_fresh_quantifier_order
          outcome: holds_for_ST_EVR
          detail: >-
            H_12, g_I, labels, D_34, and all advice are frozen before the
            formal table is supplied. The all-off-root adversarial input is
            therefore a fresh input, and every inspected target value is
            charged as a named scalar query. No target-dependent preprocessing
            is used by the proof.
        - check: gauge_invariance
          outcome: breaks_as_worded_but_scope_is_disclosed
          detail: >-
            Actual relation support is invariant under an admissible curve
            coordinate change because point equality and u+v+a=R are
            invariant and a transported injective encoding preserves equality.
            The arbitrary formal-table family, however, has no canonical
            elliptic gauge action. Moreover, an arbitrary simultaneous
            relabelling that merely preserves root/nonroot membership need not
            preserve transcripts of an ST-EVR algorithm allowed general field
            arithmetic. The lower-bound adversary can be re-instantiated after
            each encoding choice; it is not generally the same transported
            transcript. The producer correctly denies a positive
            gauge-invariant constructor, but its negative-invariance sentence
            must use this narrower formulation.
        - check: total_all_strata_positive_primitive
          outcome: not_supplied_and_not_claimed
          detail: >-
            The semantic actual-target specialization can be total by using
            the abstract elliptic group law followed by total kappa, including
            O. The packet does not give a typed oracle-free complete-chart
            primitive or formulas for its masks, and expressly records that
            the all-geometric-strata positive constructor is not satisfied.
      break_scope: >-
        J1 breaks the exact frozen formula/typing gate and the claimed form of
        formal-table gauge invariance. It does not invalidate the separately
        formulable ST-EVR query lower bound, prove the structured elliptic
        exception impossible, or create a generic lower bound.
      required_repair:
        - State t:I_5->K as an injective public occurrence-label map.
        - Replace R-A_I(T)-v by the exact componentwise CRT definition of H_34,e, or supply a separately typed point-valued lift alpha.
        - State the short proof that kappa is total and injective.
        - Replace transcript invariance under arbitrary alphabet relabelling by re-instantiability of the root/off-root adversary in each encoding.
        - Keep the absence of an oracle-free gauge-invariant positive constructor explicit.
    - joint: J2-support-theorem-and-controls
      verdict: holds
      independent_componentwise_derivation:
        setup: >-
          Let S be the set of roots of the fixed nonconstant H_12 in K, let
          S be nonempty and proper, and let e be any formal table in
          K^(I_5 times D_34). Under the explicit CRT repair from J1, define the
          a-component H_34,e,a(U)=product_v(U-e_(a,v)).
        resultant_identity: >-
          Since H_12 and H_34,e,a are monic split polynomials,
          Res_U(H_12,H_34,e,a) equals
          product_(labelled u in D_12) product_(labelled v in D_34)
          (kappa(u)-e_(a,v)), up to the fixed resultant convention sign.
          Over the field K this component vanishes exactly when at least one
          e_(a,v) belongs to S.
        support_extraction: >-
          Because the t_a are distinct, g_I is squarefree. Hence the monic gcd
          of g_I with any representative of the CRT resultant is exactly
          product_(a whose row meets S)(T-t_a); adding a multiple of g_I to the
          representative cannot change this gcd.
        actual_target_specialization: >-
          For e_(a,v)=kappa(R-a-v), injectivity of kappa gives
          e_(a,v)=kappa(u) iff R-a-v=u iff u+v+a=R. Thus the componentwise
          support polynomial equals the intended z_R on every actual target,
          once H_34^R is retyped as above.
      multiplicity_checks:
        - check: repeated_D_12_or_D_34_occurrences
          outcome: holds
          detail: >-
            Duplicate labelled endpoints repeat resultant factors and can
            increase vanishing order, but they do not change whether a row
            component vanishes.
        - check: fifth_occurrence_multiplicity
          outcome: holds
          detail: >-
            Distinct public occurrence labels make g_I squarefree, so each
            supported fifth occurrence contributes one factor T-t_a even when
            several compatible labelled pairs exist. The output is support,
            not compatible-pair count or source lineage.
        - check: same_support_different_pair_multiplicity
          outcome: holds_as_a_limitation
          detail: >-
            Two inputs with the same supported fifth labels but different row
            multiplicities legitimately return the same z. Therefore this
            control does not distinguish ST-EVR outputs and cannot be used to
            claim multiplicity recovery or exact source replay.
      all_strata_check:
        outcome: holds_semantically_not_as_a_positive_constructor
        detail: >-
          The actual-target identity uses only the total group operation on
          E(F_p), equality of resulting points, and total injective kappa.
          Identity/infinity, tangent, vertical, secant, and repeated cases
          therefore do not alter the support equivalence. Nonreduced or
          repeated factors affect resultant order but are removed by the
          squarefree g_I support gcd. The formal one-entry mutation begins
          after encoding and is not asserted realizable in any geometric
          stratum.
      controls:
        - control: one_hit
          outcome: holds
          detail: >-
            Choose c in S and d outside S. If exactly e_(a0,v0)=c and every
            other entry equals d, only row a0 meets S and the exact support is
            z=T-t_a0.
        - control: no_relation
          outcome: holds
          detail: >-
            If every entry equals d outside S, no row meets S and the exact
            support is z=1.
        - control: adaptive_transcript_collision
          outcome: holds
          detail: >-
            Run a deterministic exact decision tree on the all-d table. If it
            halts without querying some (a0,v0), change only that entry to c.
            Every answer at every adaptively selected queried index is
            unchanged, so induction gives the identical query and branch
            transcript and the same output. The correct outputs are 1 and
            T-t_a0, a contradiction. Thus the all-d input forces all
            |I_5|*|D_34|=Theta(B^3) individual queries.
        - control: randomized_zero_error
          outcome: holds_with_declared_scope
          detail: >-
            Fix any coin sequence on which a zero-error algorithm halts. The
            same deterministic transcript argument applies. No bounded-error
            distributional lower bound follows.
        - control: actual_elliptic_and_bulk_escape
          outcome: holds
          detail: >-
            Arbitrary one-entry mutation need not remain an actual elliptic
            table, and a bulk primitive can depend on the hidden entry without
            individually querying it. These controls correctly stop transfer
            to elliptic-only recurrence, circuit, data-structure, or aggregate
            operation families.
      limitation: >-
        J2 verifies the exact formula-level ST-EVR transcript counterexample
        and its support semantics after the explicit componentwise typing
        repair. It establishes neither a positive constructor nor any lower
        bound outside the supplied-independent-term, individual-query, exact
        or zero-error formal family.
  scoped_recommendation: REVISE
  recommendation_basis: >-
    Preserve the ST-EVR scoped counterexample: its support derivation,
    one-hit/no-relation controls, and adaptive transcript collision hold.
    Revise the immutable theory packet through a successor record because the
    displayed H_34^R expression is ill-typed and the formal-table gauge claim
    is too strong. Do not select a positive P1553 route from this packet, and
    do not broaden the valid query-model barrier to actual elliptic or bulk
    structured operations.
  limitations:
