  whole_claim_verdict: not_rendered
  joint_verdicts:
    J4-exact-source-replay:
      verdict: breaks
      reason: >-
        A root of z identifies only a public fifth occurrence. The frozen
        represented recovery path still scans Theta(B^2) D_34 occurrences per
        selected fifth occurrence, and z is squarefree support that does not
        retain compatible D_12/D_34 lineages or their multiplicities. This
        exceeds the B^(5/4+o(1)) online cap before retry, rank, factor-log, or
        scalar-recovery costs. The predecessor O(log B) bisection theorem needs
        a subset-stable exact decision operation on all source restrictions;
        ST-EVR and a whole-set z do not supply that operation.
      surviving_substatement: >-
        Conditional on a compatible labelled pair being found, backpointers,
        signed occurrence labels, denominator rejection, and the final xP=Q
        check give a sound replay-and-verification skeleton.
    J5-success-retry-pareto-and-proves-too-much:
      verdict: holds
      reason: >-
        The scoped ST-EVR worst-case scalar-query theorem is valid, the fixed
        all-off-root table gives the required quantifier order, and every
        predeclared control prevents transfer to actual elliptic, structured
        bulk, multiplicity-aware, or bounded-error algorithms. The producer
        also labels success, retries, rank, factor logs, descent, bit cost, and
        non-time Pareto axes as unknown and makes no realized N^0.45/N^0.40
        claim. This verdict holds only for that scoped-negative and
        no-realized-Pareto interpretation; it does not rescue the positive
        constructor or the end-to-end conditional campaign.
  objections:
    - id: OBJ-J4-REPLAY-1
      severity: gate_blocking
      finding: >-
        The observation fibre of z contains different compatible pair-source
        multisets and different labelled lineages. Factoring or evaluating z
        can recover fifth labels, but it cannot select D_12 and D_34 sources.
      consequence: >-
        z alone is not the source-complete result required for relation rows or
        scalar recovery.
    - id: OBJ-J4-REPLAY-2
      severity: gate_blocking
      finding: >-
        The only frozen exact represented unranking path scans D_34 and hashes
        into D_12, costing Theta(B^2) group/lookup operations for each selected
        fifth occurrence.
      consequence: >-
        Even one positive replay exceeds B^(5/4+o(1)); B accepted rows would
        contribute Theta(B^3) before unsuccessful targets and duplicates.
    - id: OBJ-J5-COST-1
      severity: gate_blocking_for_positive_chain
      finding: >-
        The N^0.45 relation term presumes Theta(1) expected new independent,
        replayable rows per attempted target. Relation probability, replay
        success, denominator acceptance, duplicate suppression, rank growth,
        retry independence, and deck-rebuild cost are all unproved.
      consequence: >-
        B times B^(5/4) is an algebraic conditional product, not an achieved
        expected running time.
    - id: OBJ-J5-SCOPE-1
      severity: mandatory_wording_boundary
      finding: >-
        ST-EVR requires correctness on every formal independent K-valued term
        table. Merely exposing actual elliptic terms one scalar at a time does
        not place an algorithm in ST-EVR if it exploits algebraic dependence to
        infer unqueried entries.
      consequence: >-
        Every ledger synthesis must retain the all-formal-table promise; the
        shorter phrase individual supplied-term algorithm would be too broad.
    - id: OBJ-J5-MODEL-1
      severity: interpretation_boundary
      finding: >-
        Theta(B^3) is exact worst-case scalar-query complexity in the declared
        oracle model. It is not by itself a concrete bit-time, memory, circuit,
        cell-probe, or generic-group lower bound.
      consequence: >-
        The N^0.60 comparison with rho is a time-exponent reference under a
        unit-cost query/field-operation interpretation, not a total Pareto
        domination result.
    - id: OBJ-J5-OPPORTUNITY-1
      severity: prioritization_note
      finding: >-
        The last authorized batch formalizes an elementary sensitivity sentinel
        on an enlarged formal domain and does not narrow the structured
        elliptic exception beyond requiring exploitation before scalar
        expansion.
      consequence: >-
        Its information gain is scope hygiene rather than a mechanism-new
        construction. A budget pause is justified; lane closure or an
        exhaustion claim is not.
  st_evr_query_reconstruction:
    domain_size:
      expression: "m=|I_5|*|D_34|"
      substitution: "Theta(B)*Theta(B^2)=Theta(B^3)=Theta(N^0.60)"
    fixed_hard_input: >-
      Let e_0 be the formal table with every entry equal to a fixed d outside
      the root set of nonconstant H_12. Its exact output is z=1.
    lower_bound: >-
      Run any deterministic exact ST-EVR decision tree on e_0. If it halts
      with position (a_0,v_0) unqueried, replace only that value by a fixed root
      c of H_12. The ordered queries, answers, and branches are unchanged, but
      the exact output now contains T-t_(a_0). Therefore the tree must query all
      m positions on the single fixed input e_0.
    randomized_zero_error: >-
      The same e_0 works for every fixed coin branch that is exact. Thus this is
      stronger than a coin-dependent forall-coins-exists-input statement and
      forces m queries almost surely under the packet's zero-error semantics.
      No conclusion is available for bounded-error algorithms.
    upper_bound: >-
      Query each distinct position once, test root membership against the
      preprocessed H_12 root dictionary, mark every hit row a, and emit the
      monic product of its public T-t_a factors. This uses at most m scalar
      queries, up to field/dictionary/output overhead.
    conclusion: >-
      Worst-case distinct scalar-query complexity is Theta(B^3) inside ST-EVR.
      The theorem is a fixed-input no-relation lower bound, not an actual-
      elliptic or structured-operation lower bound.
    necessary_slice_checks:
      H_12_nonconstant: frozen
      root_c_in_K: true_by_split_definition
      off_root_d_in_K: >-
        Available on the asymptotic slice because the K-valued root set has at
        most Theta(B^2) distinct elements while K=F_(p^3) and B^2=p^(2/5+o(1)).
  exact_source_replay_reconstruction:
    - step: root_to_fifth_occurrence
      operation: >-
        Factor z or evaluate it on public distinct labels t_a, then use the
        public label map to recover a.
      status: plausible_standard_work_but_not_frozen_with_bit_bound
    - step: pair_source_search
      operation: >-
        For each labelled v in D_34, compute u=R-a-v with complete-chart masks
        and look up u in the labelled D_12 endpoint dictionary.
      cost: Theta(B^2)_per_selected_a_in_the_frozen_represented_baseline
      status: exceeds_online_cap
    - step: backpointer_expansion
      operation: >-
        Retain ordered D_12 and D_34 occurrence backpointers, signs, colours,
        repetitions, and chart branches; choose an exact compatible labelled
        lineage rather than only an endpoint.
      status: conditional_on_pair_source_search
    - step: duplicate_and_multiplicity_handling
      operation: >-
        Preserve occurrence duplicates until a complete coefficient row is
        assembled, then semantically deduplicate rows before rank credit.
      status: not_encoded_by_squarefree_z
    - step: coefficient_orientation
      operation: >-
        Sum the five known signed source coefficients under the frozen deck
        convention to obtain A*P+B*Q=O.
      status: sound_if_exact_lineage_and_coefficients_are_available
    - step: denominator_rejection
      operation: Reject B=0 before modular division.
      status: specified_but_acceptance_probability_unknown
    - step: scalar_candidate_and_verification
      operation: Compute x=-A/B modulo N and require xP=Q.
      status: sound_final_check
    - step: negative_replay
      operation: >-
        A unit output certifies no support only after the support evaluator is
        trusted. On the all-off-root ST-EVR input, obtaining that exact unit
        result itself forces Theta(B^3) scalar queries.
      status: scoped_ST_EVR_cost_only
  end_to_end_cost_reconstruction:
    formula: >-
      Let y_rel(B) be the expected number of new independent, exactly replayed
      and verified relation rows per attempted known-log target. Expected
      relation work is at least (B/y_rel(B)) times the full per-attempt locator,
      replay, miss, output, and verification cost, plus factor-log algebra.
      A descent analog uses its own verified success probability y_desc(B).
    stages:
      - stage: target_independent_pair_indexes
        frozen_cost: B^(2+o(1))=N^(0.40+o(1))
        status: fits_conditional_setup_and_memory
      - stage: hypothetical_locator_per_attempt
        frozen_target: B^(5/4+o(1))=N^(0.25+o(1))
        status: no_positive_operation_supplied
      - stage: current_positive_replay
        frozen_cost: B^(2+o(1))=N^(0.40+o(1))_per_selected_fifth_occurrence
        status: exceeds_per_target_cap
      - stage: relation_campaign
        advertised_conditional: B*B^(5/4)=B^(9/4)=N^(0.45)
        required_conditions: >-
          y_rel(B)=Theta(1), fast exact replay, bounded duplicate output,
          denominator acceptance, Theta(B) rank completion, and charged
          retries and rebuilds.
        status: unestablished
      - stage: factor_log_system
        optimistic_cost: B^(2+o(1))=N^(0.40+o(1))
        required_conditions: >-
          A full-rank sparse coefficient matrix, correct occurrence-to-factor
          mapping, a specified sparse solver and memory model, and verification.
        status: unestablished
      - stage: masked_descent
        advertised_conditional: B^(5/4+o(1))=N^(0.25+o(1))
        required_conditions: >-
          The identical target-fresh constructor, exact replay, nonzero Q
          coefficient, success probability y_desc(B), retries, and xP=Q.
        status: unestablished
      - stage: bit_complexity
        exponent_observation: >-
          Fixed cubic extension arithmetic and polylogarithmic operations can
          be N^o(1) under standard algorithms, so they need not change an
          asymptotic exponent.
        missing: >-
          No explicit bit bound is frozen for polynomial/root work,
          dictionaries, inversions, sparse linear algebra, communication,
          parallel scheduling, caches, or concrete memory.
  required_controls:
    - id: C1_one_hit
      review_plan_object: one-hit_z_R_linear_factor
      mutation: Exactly one formal entry is on an H_12 root.
      expected_signature: "z=T-t_(a_0)"
      result: holds_for_ST_EVR_support
      replay_effect: >-
        The factor identifies a_0 but not the compatible labelled pair source;
        J4 remains broken.
    - id: C2_no_relation
      review_plan_object: no-relation_z_R_equals_1
      mutation: Every formal entry is off the H_12 root set.
      expected_signature: z=1_and_every_position_queried
      result: holds_and_is_the_fixed_hard_input
    - id: C3_fresh_target
      review_plan_object: fresh-target_replacement
      mutation: Replace the target/formal table after preprocessing.
      expected_signature: no_target_specific_cache_or_advice_survives
      result: holds_as_a_frozen_quantifier_not_an_executed_test
    - id: C4_transcript_collision
      review_plan_object: same_transcript_distinct_support
      mutation: Flip one unqueried all-off-root entry to the root c.
      expected_signature: identical_transcript_and_distinct_exact_output
      result: holds_inside_the_all_formal_table_domain
    - id: C5_actual_elliptic_representation
      review_plan_object: closest_structured_object
      mutation: Demand that the one-entry flip remain realizable as e_(a,v)=kappa(R-a-v).
      expected_signature: the_independent_mutation_need_not_be_realizable
      result: argument_stops_as_required
      scope_effect: >-
        Actual-elliptic scalar-query algorithms remain outside the theorem even
        when they do not expose a named bulk oracle.
    - id: C6_all_strata
      review_plan_object: complete_chart_boundary
      mutation: >-
        Move through identity, infinity, vertical, tangent, secant, repeated,
        and nonreduced encodings.
      expected_signature: >-
        Formal root-versus-nonroot semantics remain typed after encoding, while
        mutation realizability and a positive all-strata constructor remain
        unclaimed.
      result: holds_as_scope_control_only
    - id: C7_nearby_bulk_oracle
      review_plan_object: generic_product_circuit_without_elliptic_identity
      mutation: >-
        Replace individual scalar access by one exact interval product or bulk
        operation whose return depends on every hidden entry in the interval.
      expected_signature: >-
        The transcript changes when the hidden scalar changes even though that
        scalar was never individually queried.
      result: ST_EVR_adversary_stops_as_required
      scope_effect: >-
        Product circuits, variable-coefficient recurrences, elliptic nets, and
        direct Fitting/support operations are not closed.
    - id: C8_duplicate_replay
      review_plan_object: same_support_different_source_multiplicities
      mutation: >-
        Keep the same fifth-label support while changing the number or labels
        of compatible D_12/D_34 source occurrences.
      expected_signature: z_is_unchanged_but_exact_replay_answer_changes
      result: breaks_z_only_source_replay
      missing_separator: labelled_marker_Hasse_form_or_subset_stable_source_query
  counterexample_or_mutation: >-
    For ST-EVR, the all-d table and its single unqueried d-to-c mutation give
    the exact fixed-input query lower bound. For the positive P1553 path, two
    instances with identical squarefree z but different compatible labelled
    pair-source multisets give the observation-fibre collision that breaks
    source replay from z alone.
  baseline_comparison:
    generic_rho:
      time: N^(1/2+o(1))
      memory: low
      status: realized_external_reference
    ST_EVR:
      time_or_query: Theta(B^3)=Theta(N^0.60)_scalar_queries
      memory: >-
        Streaming need not materialize B^3 target scalars; the packet makes no
        favorable memory claim and a materialized table costs N^0.60.
      status: theorem_only_formal_oracle_family
      comparison: worse_time_exponent_than_rho_under_unit_query_cost_only
    conditional_P1553:
      time: N^(0.45+o(1))
      memory: N^(0.40+o(1))
      status: not_a_typed_or_realized_Pareto_point
      missing_axes:
        - effective_relation_yield_and_retry
        - exact_source_replay
        - rank_and_factor_log_completion
        - masked_descent_success
        - bit_time_and_bit_memory
        - communication_and_parallel_span
        - data_or_query_model
        - multitarget_amortization
  heuristic_challenges:
    - >-
      ST-EVR itself uses no probabilistic heuristic, but the conditional
      campaign needs an achieved generic-prime relation-yield law.
    - >-
      Constant expected raw support would not establish independent rank,
      denominator acceptance, anti-clustering, duplicate-free rows, or retry
      freshness.
    - >-
      The masked-target distribution must be proved compatible with the
      known-log campaign rather than inherited by analogy.
  cost_model_challenges:
    - Current exact represented source replay is B^2 per selected a and is not included in the N^0.45 product.
    - Total expected cost must multiply full per-attempt cost by inverse verified yield, separately for relations and descent.
    - Sparse factor-log B^2 is conditional on rank, a specified solver, coefficient correctness, and verification.
    - Query complexity and field-operation exponents do not substitute for concrete bit, memory, communication, or parallel costs.
    - Unknown axes cannot support dominated_by=null or a total Pareto claim; the packet correctly limits comparison to time.
  reduction_and_scope_challenges:
    - >-
      The all-formal-table promise, exactness, individual-scalar access, and
      target-independent preprocessing are all load-bearing ST-EVR premises.
    - >-
      Bounded-error algorithms need a hard distribution; fixing coins does not
      supply one.
    - >-
      Actual elliptic tables, compact product circuits, interval-product
      oracles, structured recurrences, data structures, and unrestricted
      arithmetic or Boolean circuits remain outside the method ceiling.
    - >-
      The four retrieved primary pages advertise nonlinear recurrences,
      elliptic-net/curve correspondences, EDS-equivalence statements, CM
      valuation recurrences, or supersingular-isogeny recurrences. Their
      abstract pages do not advertise the P1553 target-local locator, but that
      absence is not a literature-exhaustion or novelty result.
  proof_architecture_challenges:
    - attack: observation_fibre
      result: >-
        Holding z fixed while varying compatible source multiplicity and labels
        crosses the replay conclusion. The missing separator is a source jet or
        subset-stable source query.
    - attack: quantifier_order
      result: >-
        The fixed all-off-root table validates forall exact ST-EVR algorithms,
        one common worst-case input. The conclusion fails if the universal
        formal-table promise is removed.
    - attack: boundary_and_strictness
      result: >-
        Theta(B^3) is strictly above B^(5/4) and rho's B^(5/2) exponent inside
        the query model. It is not a strict result against the preserved
        structured families because they are not embedded in ST-EVR.
    - attack: method_ceiling
      result: >-
        The strongest supported result is the exact worst-case scalar-query
        complexity of ST-EVR. No actual-elliptic, bulk, bounded-error, circuit,
        ECDLP, or lane-closure conclusion reaches the ceiling.
    - attack: nearby_object
      result: >-
        A bulk interval-product oracle and an actual elliptic table both stop
        the transcript mutation: the former reveals the mutation indirectly,
        and the latter may forbid it algebraically.
    - attack: compositional_invariant
      result: >-
        Deleting occurrence labels, multiplicity channels, or source-marker
        data preserves fifth support but breaks exact coefficient replay;
        squarefree z therefore does not imply the final scalar target.
  novelty_and_source_audit:
    semantic_novelty: >-
      The decision-tree sensitivity argument is an explicit P1553 sentinel but
      does not establish a mechanism-new lane. The correct status is
      novelty_unverified and no_new_lane.
    retrieved_primary_pages:
      - ref: https://arxiv.org/abs/0710.1316v4
        provenance: retrieved
        checked_scope: >-
          Multidimensional elliptic nets, nonlinear recurrences, an explicit
          curve-and-points correspondence, and Laurentness/integrality.
        locator_implication: none_from_primary_page
      - ref: https://arxiv.org/abs/0803.0728v2
        provenance: retrieved
        checked_scope: >-
          Three EDS hard problems and subexponential equivalences with ECDLP,
          plus pairing/known-attack relations in applicable cases.
        locator_implication: none_from_primary_page
      - ref: https://arxiv.org/abs/2512.09601v2
        provenance: retrieved
        checked_scope: >-
          Common valuations and recurrences for CM elliptic nets indexed by an
          order under stated conditions.
        locator_implication: no_generic_prime_P1553_inference
      - ref: https://eprint.iacr.org/2025/608
        provenance: retrieved
        checked_scope: >-
          Nonlinear recurrences linked to isogeny graphs and supersingular
          endomorphism-ring questions.
        locator_implication: different_problem_interface
    result: >-
      The producer's source-faithfulness and novelty-unverified language holds;
      the retrieved abstract pages cannot establish literature completeness.
  successor_scope_and_steering:
    preserved_successors:
      - successor: IDEA-121_specialized_product_circuit_and_source_jets
        status: open_exception
        separation_from_ST_EVR: >-
          A product-circuit locator may aggregate before scalar expansion and
          carry marker Hasse forms; the independent-term adversary does not
          apply.
      - successor: IDEA-133_target_local_apolar_or_projector_action
        status: separate_approval_gated_action_preserved
        separation_from_ST_EVR: >-
          The permitted predecessor record describes a different nonlinear
          target-local theorem action. No IDEA-133 source outside this task's
          read scope was used.
      - successor: P1549_shared_layer_S3_locator
        status: open_conditional_window
        separation_from_ST_EVR: >-
          A target-conditioned O(D) path locator with 11/12<=gamma<=1 would
          aggregate across paths and return sources rather than expose an
          independent scalar table.
      - successor: P1550_finite_domain_selector
        status: compact_high_degree_finite_field_circuit_unclassified
        separation_from_ST_EVR: >-
          It may agree with curve and sum laws only on E(F_p) and need not be a
          global rational branch or all-formal-table evaluator.
      - successor: P1551_noncharacter_coefficient_and_unranking_operation
        status: outside_frozen_explicit_quotient_grammar
        separation_from_ST_EVR: >-
          Its purpose is precisely to aggregate a succinct predicate without
          materializing B^3 support or a source quotient.
    opportunity_cost: >-
      B65 used the final authorized batch on a zero-run formal-family sentinel.
      That follows B64's recorded next action and sharply guards scope, but it
      does not demonstrate that this route dominates mechanism work on the
      preserved successors across time, memory, data, or expected information
      gain.
    steering_finding: none_supported
    steering_reason: >-
      The batch explicitly preserves every named structured successor, labels
      unknown Pareto axes, selects no positive route, and conditions any 66th
      batch on fresh authority. A budget pause must remain a budget disposition,
      not a mathematical closure.
  resource_reversal:
    obstruction: independent_one_entry_sensitivity_after_scalar_expansion
    reading: >-
      The algebraic dependence that invalidates the formal mutation is the
      resource a successful elliptic-net, variable-coefficient recurrence,
      direct Fitting-support, or bulk interval-product operation must exploit.
      Separately, the B^2 source-labelled pair indexes and the predecessor
      subset-stable bisection theorem show that exact dyadic decision products
      could turn support structure into logarithmic source replay. Neither
      resource is instantiated in B65.
    examined: true
    spawned_ids: []
    existing_successor_refs:
      - IDEA-121
      - IDEA-133
      - P1549
      - P1550
      - P1551
      - P1553
  narrowest_supported_statement: >-
    Let ST-EVR expose only individual entries of a fresh formal table on
    I_5 times D_34, require exact correctness on every K-valued table, and
    forbid aggregates depending on unqueried entries. With nonconstant H_12
    and one off-root value, the fixed all-off-root table forces every exact
    deterministic or zero-error evaluator to query all
    |I_5||D_34|=Theta(B^3)=Theta(N^0.60) entries in the worst case; a full scan
    gives the matching query upper bound. This statement does not apply to
    actual-elliptic-only inputs, bounded-error algorithms, structured bulk
    operations, elliptic nets, division polynomials, product circuits, source
    unranking, or generic ECDLP. No positive P1553 constructor, exact sub-cap
    replay, N^0.45/N^0.40 algorithm, novelty result, lane closure, or
    breakthrough is established.
  next_concrete_action: >-
    The Coordinator should ledger-dispose B65 as REVISE/select-none at the
    scoped ST-EVR boundary and pause at the authorized 65-batch limit. If fresh
    authority later exists, require one explicit oracle-free gauge-invariant
    structured operation that acts before scalar expansion, supports exact
    dyadic restrictions and labelled replay, and supplies achieved relation
    yield, rank, factor logs, descent, bit cost, and all Pareto axes. Do not
    create a 66th batch, implement, execute, promote, or close a lane from this
    report.
