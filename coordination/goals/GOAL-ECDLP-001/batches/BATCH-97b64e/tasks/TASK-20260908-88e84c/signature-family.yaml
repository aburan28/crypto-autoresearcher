  vocabulary:
    input:
      signature: 'I=(E,p,P,N); Valid(I): ordinary E/F_p, G=<P> subset E(F_p), ord(P)=N prime, N != p.'
      availability: I and public conventions nu precede Q; later Q is a point of G.
      boundary: 'Q=[x]P describes the problem; x is not an input. No source-class asymptotic distribution is chosen.'
      sources: [original, 'map:row1', 'map:row3']
    scalars:
      signature: 'A_N = Z/NZ; src(a,R)=[a]R in G; Adm(context) subset A_N.'
      obligation: Source action and subgroup data must be supplied with their exact laws; Adm is not silently all scalars or only units.
    setup:
      signature: 'Pre(I,nu) -> S0; F(S0)=(F_1,...,F_B) in G^B.'
      contents: Precommitted rules for deformation, selectors, jet order, precision, factor-base predicate, decoder and public auxiliary acquisition.
      timing: F is constructed and fixed before Q under both setup readings; selectors/parameters fixed before relation collection.
      obligation: Public computation, commitment semantics and acquisition costs of S0 and F remain unsupplied.
    context:
      signature: 'C_U=(I,nu,S0); C_Q=(I,nu,S0,Q,U_Q); U_Q=Select(S0,Q).'
      meaning: Q is a fixed public anchor during a covariance comparison; query R is a separate argument.
      choice: This separation names dependencies; identifying anchor Q with every changing R needs the transport/coherence obligation below.
    auxiliary:
      signature: 'Acquire(C,R) -> Aux(C,R); Aux=(deformation_data,section_data,basis,orientation,precision,extension,branch,tangent).'
      types: Each component is an explicit dependent type slot; unused components must be declared unused, not supplied by an oracle.
      dependency: Acquisition may use public C and R only. Its algorithm is precommitted; supplied coefficients alone are not public acquisition.
      excluded_inputs: [hidden_x, withheld_mask_t, source_scalar_labels, unsolved_factor_logs, unpriced_division_table, undeclared_advice]
      obligation: Public construction, reproducibility, permitted choices, invariance and every component's cost remain unproved.
    jet_data:
      signature: 'JetSpec(C)=(base_ring,deformation,reduction,jet_order h,precision_rule,raw_jet_type K_C,relation approx_C).'
      finiteness:
        finite_order: h is a specified finite truncation order; no value or construction selected here.
        finite_presentation: Generators/relations or encoding-length bounds are separate optional data and unproved obligations.
        finite_cardinality: No finite carrier assumed; any cardinality bound and its dependence on p,N,extensions must be supplied separately.
        interpretation: The meaning of finite jet quotient remains a parameter/obligation inside either target reading, not a fourth axis.
        restriction_warning: Requiring finite carrier or a particular finite coefficient ring would be an additional specification choice, not a consequence asserted here.
    evaluation:
      signature: 'Eval(C,R,aux,d) : M_C, with R:G, aux:Aux(C,R), d:Dom(C,R,aux).'
      public_abbreviation: 'j_C(R,d)=Eval(C,R,Acquire(C,R),d); exists only as a proposed composite signature.'
      proof_input_boundary: Domain witnesses carry logical validity only; no hidden scalar payload. Constructing/checking them is an acquisition obligation.
      failure: Outside Dom return an explicit failure at the operational interface; no arbitrary value is inserted into covariance.
      obligation: Independence of permitted auxiliary choices/domain witnesses modulo target equality is unproved.
    domain:
      signature: 'D_C(R)=Dom(C,R,Acquire(C,R)); Pair_C(a,R)=R in G AND src(a,R) in G AND D_C(R) AND D_C(src(a,R)) AND Extra_C(a,R).'
      O_policy: 'O:G remains present. The instantiation must declare D_C(O) and, if true, its evaluation; otherwise every pair with R=O or [a]R=O is ineligible.'
      chart_policy: Poles, affine-chart exclusions and denominators are explicit D_C predicates. No transfer of the marked affine fixture to O is assumed.
      extra_policy: Extra_C and Adm must be public/predeclared, with nonvacuity/coverage obligations; they cannot be chosen by reading successful scalar labels.
      guard_warning: If O is excluded and a=0 admitted, coverage for that scalar is unavailable until domains or admissibility are explicitly reconciled.
    population:
      signature: 'Omega_C subset G; mu_C a declared probability/counting measure; DensitySpec_N(delta,mu_C,Bgood).'
      unresolved: Original density N^(-delta) has no specified population or exact-equality versus bound convention. Keep DensitySpec explicit; do not assert a numerical density.
      distinction: Good sets below are mathematical witnesses, not gratis selectable advice. Any operational sampler/membership test requires public construction and cost.
  axes:
    setup_readings:
      - key: U
        name: uniform_pre_target
        source: 'map:row3; original pipeline68,73'
        binders: 'Fix I,nu; exists S0=Pre(I,nu), with F fixed before Q; forall subsequently supplied Q in G use C_U and the same family/target/evaluator rules for all R.'
        allowed: R-dependent section acquisition in a preselected family; Q used only as a query, not family-selection input.
