      cost_countercheck: Unchanged representation has no supplied atom decoder or scalar inverse and no complete recovery cost advantage; pricing a trivial copy/evaluation cannot price its missing inverse or pipeline. Covariance is not decoding, even if separately proved later.
      raw_sign: Archived P/-P raw-x collision is retained as a loss-of-information warning; it neither proves every quotient useless nor creates a signed decoder.
    - number: 6
