      - key: Q
        name: public_query_aware_family_rule
        source: 'map:row3; original hypothesis18 and pipeline68,73'
        binders: 'Fix I,nu; exists S0=Pre(I,nu) before Q with F fixed; forall public anchor Q in G, U_Q=Select(S0,Q), then use C_Q for all compared R.'
        allowed: Public Q-dependent deformation/auxiliary output through a precommitted Select rule; never x or t and never a Q-dependent F.
        obligation: Public selection and compatibility with precommitted decoder/parameters, target-independent use and blind descent. If values from different anchors are compared, explicit transports are required.
        unresolved_timing: Any use of pre-Q relation rows with a post-Q family needs a compatibility statement. No existing row is automatically reusable.
    target_readings:
      - key: M
        name: additive_mod_N_target
        source: 'map:row5; map:row7'
        signature: 'M_C with equality =_C, zero, addition, negation, and act_C:A_N x M_C -> M_C.'
        unproved_laws:
          - Equality is an equivalence and operations respect it; additive operations satisfy abelian-group laws.
          - 'act(1,m)=m; act(ab,m)=act(a,act(b,m)); act(a+b,m)=act(a,m)+act(b,m); act(a,m+n)=act(a,m)+act(a,n); act(0,m)=0.'
          - Scalar representatives modulo N yield the same operation; any integral scalar interpretation agrees with this action.
          - Raw jets map to this carrier by a specified quotient map respecting the declared jet equivalence and admitted coordinate changes.
        boundary: A Z/N module is requested, not obtained by relabeling the archived k-valued coefficient. Additivity of Eval is not assumed.
      - key: A
        name: invariant_classes_with_abstract_scalar_action
        source: 'map:row5; map:row7'
        signature: 'M_C=K_C/approx_C (proposed class type), equality =_C, act_C:A_N x M_C -> M_C.'
        unproved_laws:
          - approx_C is an equivalence and class equality has the stated exact semantics; action is well-defined on representatives.
          - 'act(1,m)=_C m; act(ab,m)=_C act(a,act(b,m)); dependence on a is modulo N.'
          - The raw observation/quotient respects exactly the admitted gauge and parameter comparisons, with their declared transport law.
        boundary: Multiplicative-monoid action of A_N includes zero if Adm admits it; no addition, module, distinguished zero value, or additive vanishing premise is supplied by this reading.
    good_set_readings:
      - key: C
        name: common_good_set
        source: 'map:row7; map:row8'
        proposition: >-
          After the selected setup/target binders and fixed C,Omega_C,mu_C,Adm:
          exists Bgood subset Omega_C, DensitySpec_N(delta,mu_C,Bgood)
          AND forall a in Adm, forall R in Bgood,
          Pair_C(a,R) AND Cov_C(a,R).
        obligation: One shared source set, simultaneous coverage and density; not extracted from per-scalar sets.
      - key: D
        name: scalar_dependent_good_sets
        source: 'map:row7; map:row8'
        proposition: >-
          After the same setup/target binders and fixed C,Omega_C,mu_C,Adm:
          forall a in Adm, exists Bgood_a subset Omega_C,
          DensitySpec_N(delta,mu_C,Bgood_a) AND forall R in Bgood_a,
          Pair_C(a,R) AND Cov_C(a,R).
        obligation: Each scalar has its own set and density; no common intersection density or target success probability is inferred.
  covariance:
    statement: >-
      For fixed C and target structure, a:A_N, R:G, d:D_C(R),
      da:D_C(src(a,R)), and e:Extra_C(a,R), the required proposition is
      Cov_C(a,R): j_C(src(a,R),da) =_C act_C(a,j_C(R,d)).
      This is an unproved law on eligible pairs. a is public to a covariance
      check/source multiplication, not an input revealing log_P(R) to Eval.
    quantifier_scope: The setup choice determines C before a and R; target and acquisition rules precede all good-set quantifiers. No forall-R exists convenient family substitution.
    guard_choice: Pair is required for every point counted in a good set; a vacuous implication alone does not discharge density or coverage. This explicit convention adds obligations, not evidence.
    fiber_transport_obligation: >-
      If an instantiation instead uses M_(C,R) or chooses a new family at [a]R,
      supply transport_C,a,R:M_(C,[a]R)->M_(C,R) and compatible action maps,
      equality transport and identity/composition coherence. Only then can a
      transported covariance proposition be stated. Such data are unavailable;
      simply equating values in different fibers is a signature defect.
  composition:
    family: 'Signature(s,t,g)=shared vocabulary + setup[s] + target[t] + good_set[g] + covariance + external obligations.'
    parameters: 's in {U,Q}; t in {M,A}; g in {C,D}'
    combinations: [U-M-C, U-M-D, U-A-C, U-A-D, Q-M-C, Q-M-D, Q-A-C, Q-A-D]
    interpretation: Eight unchosen specification combinations; none claimed consistent, realizable, canonical, or source-selected.
    compatibility_conditions:
      - All four Q combinations need decoder/frame coherence if Q-selected data change the value frame; neither target reading supplies transport.
      - Both good-set readings need O/chart coverage for their admitted scalars; excluding O while demanding coverage for zero is an unreconciled interface conflict.
      - An additive native p-adic target cannot be substituted for M without reconciling its scalar laws; invoking P1547 additionally needs its exact additive/invertibility/full-domain premises.
      - A constant or unchanged-source value may type-check provisionally while still lacking every jet-construction, nontriviality, decoder and cost obligation.
  external_obligations:
    nontriviality:
      M: 'Specify the source nonzero condition, e.g. exists eligible R with j_C(R) !=_C 0; requiring j_C(P)!=0 is an added choice unless separately justified.'
      A: 'Specify nonconstancy/separation, e.g. two declared eligible points with unequal values; there is no default zero element.'
      boundary: These are unproved predicate candidates, not equivalences or sufficient conditions for scalar recovery. No injectivity requirement silently added.
    canonicality: Supply canonical deformation/base/section construction and the exact admitted coordinate-change class; prove independence or coherent transport of every auxiliary choice.
    decoder:
      sources: ['map:row10', 'original:24,30,70,73']
      input: 'Decode(S0,value:M_C) with a predeclared public interpretation of C; extra metadata must be explicitly admitted and priced.'
      tuple_type: 'Tup(F) is an unsupplied signed coefficient domain with bounds, tuple equality/equivalence and output encoding. Exact_F(R,e) means R=sum_i [e_i]F_i in E(F_p).'
      literal_every: 'For each eligible successful R, output represents all e:Tup(F) with Exact_F(R,e), and only exact tuples; define enumeration/compression, termination and completeness.'
      one_complete: 'For each successful R, return one full e:Tup(F) satisfying Exact_F(R,e), with explicit failure otherwise.'
      boundary: Both textual readings remain external and unchosen. One-complete soundness does not establish literal-every completeness. No finite tuple domain or free symbolic output assumed.
      compatibility: Same precommitted decoder/F must handle relation and masked-target values; query-aware target frames need explicit compatibility without hidden advice.
    descent: Relation scalar s is retained only by generation/row verification, not given to Acquire/Eval/Decode. Withheld t is released only for final scalar recovery after exact masked descent; separately supply rank, factor-log checks and final EC verification.
    density: Supply Omega,mu,Adm,Extra,DensitySpec and operational success events. Relation density delta and masked-target delta_t are separate; covariance density supplies neither decoder success nor descent success automatically.
    costs:
      acquisition_slots: [setup, factor_base, deformation, lifted_sections, jet_order, extension_degree, precision, tangent, basis, orientation, branch, advice]
      operational_slots: [evaluation, domain_checks, equality, scalar_action, transport, decoding, materialized_output, failed_attempts, ambiguity, relation_collection, rank, linear_algebra, masked_descent, EC_verification, peak_memory, data_queries]
      values: null
      boundary: Every acquisition and operational slot needs an actual algorithm and complete single-instance cost; missing values are not zero. No exponents or rho/BSGS improvement are measured here.
