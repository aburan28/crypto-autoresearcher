      verdict: PASS
      findings:
        - The implementation deterministically iterates scalar values 1 through n-1.
        - Identity multiples are skipped.
        - Duplicate x-coordinates are skipped.
        - >-
          Every retained x-coordinate is canonically lifted and checked by
          verifying n times the lift is the identity.
        - Requested size is rejected when greater than (n-1)//2.
        - The implementation returns only when the requested exact size is reached.
        - Exhaustion before exact size raises ValueError.
        - Unknown scope values raise ValueError.
        - >-
          The frozen fixture has p=53, subgroup order n=11, full curve order
