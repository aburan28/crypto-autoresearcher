  objections:
  - id: RT411037-B1
    severity: BLOCKING
    title: thr_TAIL=0 makes TAIL-SMTH-4403c4 vacuous / non-discriminating
    quoted_passages_in_full:
    - >-
      run_manifest.json protocol.thr_TAIL_observation: "199th OS of tau_r was
      0.0 at both bit sizes because the 8-deep-smooth mean was identical across
      all null replicates (dominated by LPF=2 atoms). Rule applied unchanged."
    - >-
      RESULTS.json bit_sizes["16"]: "SMTH_tau_real": 0.0, "SMTH_thr_TAIL": 0.0,
      "SMTH_T_real": 0.032632893688070416, "SMTH_T_ref": 0.032632893688070416
      (identical equality at bits 20 with T=0.025607453906189147).
    - >-
      specification.yaml tail_rule.reject_rule: "tau_real > thr_TAIL" with
      thr_TAIL = 199th ascending OS of {tau_1..tau_200}; exact_null_level claimed
      analogously to KS as alpha ≈ 0.00995 on the measured null.
    finding: >-
      Code deep_smooth_mean returns mean of the 8 smallest z-values
      (smth4403c4_driver.py). For every null replicate at both cells,
      tau_r = 0 for all 200/200 values (null_calibration.json tau_summary
      min=max=0; thr_TAIL_199th=0). T_ref equals ln(2)/ln(X) to machine
      identity at both X (X_16=1677803521, X_20=569588693521). Mechanism: with
      n=130816 and P(LPF=2)≈1/2 on [1,X], expected ~6.5e4 atoms at z=ln(2)/ln(X);
      the 8-deep-smooth mean is therefore the LPF=2 atom for essentially every
      sample of this size, including OBJ-REAL and held-out stream 201. Under
      reject_rule tau > thr_TAIL with thr_TAIL=0, the test rejects only if
      tau>0, which never occurs for any law retaining ≥8 even integers. Claimed
      alpha≈0.00995 does not transfer: Type-I for TAIL is 0, and power against
      any alternative that still places ≥8 mass on LPF=2 is 0. The held-out M-5
      tail limb (tau_ho > thr_TAIL) is likewise inert. Plant control requires
      only KS and RATE at u=4 — it never certifies TAIL power. OPEN-BATCH023-A
      explicitly repaired asymptotic-rho deep-tail miscalibration; a tautological
      measured-null TAIL pass does not discharge that limb.
    consequence: >-
      bit_size_pass ∧ TAIL cannot be read as evidence about deep-smooth
      behavior. M-SUPPORT's conjunction reduces, informatively, to KS ∧
      RATE-BAND only. Any sentence that treats "TAIL passed" as a positive
      deep-smooth consistency check is false.
    required_control: >-
      Pre-register a non-LPF2-saturated deep-smooth statistic before any new
      datum (examples: mean of 8 smallest z among odd N; empirical mass with
      LPF in (B_5, B_4]; or T_k for k large enough that the k-th order
      statistic escapes the LPF=2 atom with positive null variance). Recompute
      thr from measured null; require thr_TAIL > 0 and at least one null tau_r > 0
      as an integrity gate (else M-0 / ill-defined), symmetric for support and
      refute.

  - id: RT411037-B2
    severity: BLOCKING
    title: >-
      M-SUPPORT must not be read as HEUR-DS-1 validated (even at toy) while TAIL
      is vacuous and the object is a FB census
    quoted_passages_in_full:
    - >-
      RESULTS.json reading: "branch": "M-SUPPORT",
      "heuristic_verdict_per_contract": "support_at_toy_scope",
      "note": "Reading branch is the frozen RR-SMTH-4403c4 outcome metric.
      Executor does not change hypothesis status; Coordinator alone may.",
      "scope": "toy cells bits in {16,20}, Bfb=512, ENC-B, measured-null
      thresholds only"
    - >-
      specification.yaml M-SUPPORT disposition: "At the tested toy cells, under
      INT-SMTH-4403c4 / ENC-B / Bfb=512 / measured-null thresholds, the
      intermediate smoothness law is NOT distinguishable from the measured
      uniform null. This is SCOPED TOY-TIER SUPPORT for HEUR-DS-1's finite-X
      \"like uniform integers on [1,X]\" limb. Explicitly NOT crypto-scale
      validation; NOT asymptotic support; NOT movement of G1-G4; NOT `supported`
      for H-SMTH-001 without replication."
    - >-
      ledger/goals/GOAL-ECDLP-001.yaml (carried ranking text): "OPEN-BATCH023-A
      - the direct smoothness measurement of HEUR-DS-1 ... equidistribution of
      the fibre invariants is a LOAD-BEARING INPUT to HEUR-DS-1 and is not
      identical to it"
    finding: >-
      Producer scope hedges are mostly honest and claim_tier is toy. The
      dangerous sentence-path is the branch name itself ("M-SUPPORT" /
      "TOY-TIER SUPPORT FOR HEUR-DS-1" / support_at_toy_scope) combined with
      the goal's standing language that HEUR-DS-1 is load-bearing for larger
      claims. Under AGENTS rule 7 and the inventor-protocol controls-before-belief
      rule, a conjunction whose deep-smooth limb cannot fire is not
      "support" for the heuristic limb that prior batches identified as the
      failure mode of asymptotic rho. Additionally the tested object is a
      deterministic factor-base census (OBJ-REAL: "No sampling seed"), whereas
      heuristic_under_test states "uniform random targets" — a transfer gap
      (see RT411037-M2). No crypto-scale, medium-scale, affected-scheme, or
      asymptotic claim appears in RESULTS; dominated_by/sota_delta claim no
      ECDLP exponent move. The overclaim risk is interpretive promotion of the
      branch label, not an explicit crypto sentence in the producer package.
    consequence: >-
      Coordinator evidence/decision text must not say HEUR-DS-1 is validated,
      supported above toy census KS/RATE non-rejection, or discharged as a
      load-bearing input to larger claims. Leave H-SMTH-001 untouched by this
      Red Team; assign no official state.
    required_control: >-
      Any EV-* or DEC-* that cites this package must quote the vacuous-TAIL
      fact and the FB-census vs uniform-targets gap in the same paragraph as
      any M-SUPPORT mention, or else refuse the support reading and record
      KS/RATE non-rejection only.

  - id: RT411037-M1
    severity: MAJOR
    title: >-
      i<j removes the diagonal only; shared-vertex dependence remains and is
      not in the null
    quoted_passages_in_full:
    - >-
      specification.yaml enumeration.diagonal_exclusion: "BY CONSTRUCTION. The
      generator never yields i == j. There is no post-enumeration filter, drop,
      mask, or \"skip undefined\" step. The diagonal is absent because the nested
      loops never produce it."
    - >-
      specification.yaml objects OBJ-NULL-CAL: "M_CAL = 200 independent
      replicates, each of n = 130816 uniform integers on the SAME [1, X]"
    - >-
      Driver enumerate_real_N: nested loops for i in range(BFB): for j in
      range(i+1, BFB): enc_b(...) — confirms diagonal absent; every x_i still
      appears in (BFB-1) pairs.
    finding: >-
      Diagonal exclusion prevents c2=0 / self-pairs. It does not make the
      multiset {N_ij} exchangeable with n i.i.d. uniforms. Pairs (i,j) and
      (i,k) share x_i; ENC-B is a deterministic rational function of (x_i,x_j),
      so N_ij and N_ik are dependent. Effective degrees of freedom are O(Bfb)
      rather than O(C(Bfb,2)). KS and RATE thresholds are order statistics of
      i.i.d.-vs-i.i.d. null replicates; size for dependent-census-vs-i.i.d.-REF
      is not the advertised alpha by construction. Direction of bias is not
      signed a priori: positive dependence can inflate Type I (hurting SUPPORT);
      variance reduction / lattice-like regularity can shrink D and deltas
      (false SUPPORT). Point estimates: at bits 16, D_real sits mid-null
      (empirical frac null≥D_real = 0.335); at bits 20, D_real empirical frac
      0.185 — not an extreme low-D artifact. Rate deltas at bits 20 for u=3,4,5
      sit at ascending ranks 198,197,197/200 — near thr_RATE (see M3). The
      dependence objection is therefore about unvalidated size, not an already
      observed smoking-gun variance collapse.
    consequence: >-
      KS/RATE non-rejection is evidence only under the i.i.d. null the contract
      actually measured — not under a dependence-matched null for the FB census.
    required_control: >-
      Cheapest discriminating control: (A) draw a random matching of 256
      vertex-disjoint pairs from the same factor base; run KS/RATE at n=256
      against a measured null of size 256 at the same X; and/or (B) build a
      dependence-preserving null by applying ENC-B to C(512,2) pairs from 512
      i.i.d. uniform x in F_p (not necessarily on E) and calibrate thresholds
      on that object class. If REAL rejects under (A)/(B) while passing the
      i.i.d. integer null, the present M-SUPPORT is an artifact of null mismatch.

  - id: RT411037-M2
    severity: MAJOR
    title: Object transfer gap — FB census ≠ uniform random targets
    quoted_passages_in_full:
    - >-
      specification.yaml heuristic_statement: "Intermediate degrees arising from
      half-arity Semaev partial maps on uniform random targets behave, for
      B-smoothness purposes, like uniform random integers of the same size."
    - >-
      specification.yaml OBJ-REAL: "Exhaustive ENC-B integers N_ij over
      ENUM-IJ-STRICT on the frozen deterministic factor base. Count exactly
      n = 130816. No sampling seed."
    finding: >-
      HEUR-DS-1 as stated is about uniform random targets. The measurement is a
      full census of ENC-B on the first 512 curve x-coordinates. Passing or
      failing on that census does not automatically transfer to the random-target
      limb, nor to other encodings / m / Bfb (contract already limits refute
      scope; support must be limited symmetrically).
    consequence: >-
      Narrowest valid positive reading names the FB-census ENC-B object, not
      "HEUR-DS-1" in full generality.
    required_control: >-
      One cell of uniform random (x,y)-style targets (or random unordered pairs
      in F_p) at the same X, same measured-null rules, same n — compare accept/
      reject to the FB census.

  - id: RT411037-M3
    severity: MAJOR
    title: bits=20 RATE-BAND is near the 199th-OS cliff
    quoted_passages_in_full:
    - >-
      RESULTS.json bits 20 rate_band u=3: delta_u_real=0.0019187255381604151,
      thr_RATE_u=0.002079256360078219, pass=true; u=4 delta=0.002339163405088107
      thr=0.0027443126223092307; u=5 delta=0.0021786325831703035
      thr=0.002308586105675192.
    finding: >-
      Relative to the 200 measured null deltas, bits=20 u=3/4/5 real deltas rank
      198/197/197 ascending (empirical null frac ≥ delta_real ≈ 0.015–0.02).
      They still satisfy delta ≤ thr (199th OS), so the frozen rule passes. A
      small null-model perturbation (dependence-aware calibration, different REF
      stream, or modest M_CAL Monte Carlo error on the 199th OS) could flip
      individual rungs and therefore bit_size_pass at bits 20, converting
      M-SUPPORT into M-SPLIT. Budget was not the binding constraint (wall
      ~1775s ≪ 5400s); the design completed. Near-boundary RATE at the larger
      toy cell is a fragility of the support reading, not proof of deviation.
    consequence: >-
      Do not treat M-SUPPORT as stable under trivial re-calibration noise at
      bits 20.
    required_control: >-
      Report empirical ranks / plug-in p-values beside pass bits; optionally
      recompute thr with leave-one-out or M_CAL bootstrap on the archived
      delta_u_r vectors (no new factorizations) to test cliff sensitivity.

  - id: RT411037-M4
    severity: MAJOR
    title: Plant control does not salvage TAIL; CTRL-NO-RHO is self-attested
    quoted_passages_in_full:
    - >-
      specification.yaml plant_control.pass_rule: "KS between OBJ-PLANT and
      OBJ-NULL-REF must reject at thr_KS ... AND delta_4(OBJ-PLANT, REF) must
      reject at thr_RATE_4."
    - >-
      specification.yaml controls CTRL-NO-RHO: "Grep decision path for any
      rho-based threshold substitution. pass_condition: zero hits in decision
      code and in applied thresholds."
    - >-
      Driver RESULTS CTRL_NO_RHO: hardcoded
      "dickman_rho_used_as_decision_threshold": False, "pass": True — no grep
      executed in code path reviewed.
    finding: >-
      Plant passed (D_plant ≫ thr_KS; delta4 ≫ thr_RATE_4) and certifies gross
      B_4-smooth truncation power for KS/RATE only. It cannot certify TAIL
      (vacuous) or subtle alternatives (contract non_claim already says this).
      Dickman rho was not observed in applied thresholds (PASS on the substance
      of the Dickman-leak attack: X=p^2 actual; thr from measured OS; driver
      never imports a Dickman function). CTRL-NO-RHO as implemented is a
      constant, not the grepped control the contract freezes — a process gap.
    consequence: >-
      Do not cite plant pass as evidence that the full three-limb instrument has
      power. Treat CTRL-NO-RHO as human/reviewer-verified (this session found no
      rho threshold) rather than machine-enforced.
    required_control: >-
      Add an automated grep/AST check that fails closed if dickman/rho/u**-u
      appears in threshold assignment; extend plant (or a second plant) to a
      non-degenerate deep-smooth alternative once TAIL is repaired.

  - id: RT411037-N1
    severity: MINOR
    title: Calib restarts and append_stamp TypeError are hygiene, not math
    quoted_passages_in_full:
    - >-
      run_manifest.json commands[calib]: "exit_status": 1, "exit_note":
      "TypeError in append_stamp after null_calibration.json was fully written;
      artifact retained; stamp added out-of-band before treatment"
    - >-
      execution_report.json protocol_deviations mention RESTART_CALIB_FULL and
      write_scope mirroring under the task directory.
    finding: >-
      Stamps show aborted/restarted calib attempts before a successful
      NULL_CALIBRATION_COMMITTED. Treatment began after that commit. Spec-required
      paths under experiments/EXP-SMTH-4403c4/{implementation,runs,results} were
      not populated (write_scope); mirrors live under the task dir. None of this
      is evidence for or against HEUR-DS-1 (AGENTS rule 5).
    consequence: >-
      Record as process debt; do not fold into M-0 after the fact without an
      integrity predicate that actually failed on the committed hashes.
    required_control: >-
      Harden append_stamp; ensure single-calib provenance in future wrappers;
      archive implementation under the EXP tree in a scoped repair if reviewers
      need path-stable citations.

  null_model_audit:
    measured_at_actual_X: true
    X_values:
      '16': 1677803521
      '20': 569588693521
    X_equals_p_squared: true
    dickman_rho_used_as_decision_threshold: false
    dickman_leak_routes_checked:
    - thr_KS / thr_RATE_u / thr_TAIL are order statistics of measured CAL replicates
    - no rho, u**(-u), or asymptotic KS critical value appears in applied thresholds
    - driver comments prohibit rho; decision assignments use order_statistic_199 only
    null_sample_size_supports_tail_rule: false
    null_sample_size_note: >-
      M_CAL=200 is enough to form a 199th OS in the abstract, but the TAIL
      statistic has zero null variance here, so sample size cannot rescue the
      rule. "A tail rule is only as good as the null's tail" — the null's tail
      of tau is a point mass at 0.
    exchangeability_claim: >-
      Contract exchangeability holds among i.i.d. uniform REF/CAL streams. It
      does not extend to OBJ-REAL (dependent FB census); see RT411037-M1.

  decision_rules_audit:
    ks:
      thr_positive: true
      vacuous: false
      alpha_construction: '199th of 200; P(fresh > thr)=2/201≈0.00995 under exchangeability'
      bits16_D_real: 0.0030271526418786943
      bits16_thr: 0.005488625244618461
      bits20_D_real: 0.0026602250489237145
      bits20_thr: 0.004143224070450202
    rate_band:
      thr_positive: true
      vacuous: false
      all_rungs_powered: true
      bits20_near_cliff: true
    tail:
      thr_TAIL: 0.0
      vacuous: true
      ill_defined_for_inference: true
      pre_registered_rule_applied_as_written: true
      pre_registered_rule_informative: false

  enumeration_audit:
    rule_implemented: '0 <= i < j < 512'
    diagonal_present_count_reported: 0
    pair_count_n: 130816
    residual_dependence_named: shared-vertex pairs (i,j)-(i,k); polynomial ENC-B coupling
    diagonal_exclusion_sufficient_for_iid_null: false

  baseline_comparison:
    claim_is_distributional_measurement_not_algorithm: true
    dominated_by_field: 'Pollard rho at generic exact-ECDLP exponent 1/2'
    sota_delta:
      time_exponent: 0.0
      memory_exponent: 0.0
      data_exponent: 0.0
    pareto_honesty: >-
      No ECDLP time/memory/data improvement is claimed under any branch. Setting
      dominated_by to Pollard rho with zero sota_delta is appropriate for a
      non-algorithm toy measurement. No unchecked null-Pareto fabrication of a
      solver advantage. van Oorschot–Wiener / BSGS comparison is N/A because no
      attack path is asserted.
    cost_model_note: >-
      Contract what_this_experiment_is_NOT includes cost/wall-clock charged-unit
      measurement. wall_seconds_total is budget accounting only.

  heuristic_challenges:
  - id: HC-1
    challenge: >-
      Finite-X "like uniform on [1,X]" limb is only partially probed: KS/RATE
      see the bulk LPF law; deep-smooth limb is untested due to LPF=2 saturation.
  - id: HC-2
    challenge: >-
      Random-model transfer from i.i.d. integers to ENC-B(FB pairs) is assumed,
      not controlled (M1/M2).
  - id: HC-3
    challenge: >-
      HEUR-DS-1 remains load-bearing for larger goal claims; this toy package
      must not be cited as discharging that load.

  cost_model_challenges:
  - id: CC-1
    challenge: >-
      None on an ECDLP exponent path — no per-attempt × inverse-success
      bookkeeping is claimed. Do not retrofit an exponent narrative onto
      M-SUPPORT.

  reduction_and_scope_challenges:
  - id: RC-1
    challenge: >-
      No reduction-network corollary (OneEnd/EndRing/Isogeny-style) is claimed;
      none to instantiate.
  - id: RC-2
    challenge: >-
      Affected-vs-safe scheme lists must remain empty / untouched. Toy
      smoothness non-rejection does not move any scheme.

  budget_vs_conclusiveness: >-
    The package completed inside the wall-clock budget (measured ~1775s vs
    5400s declared). Budget was not the binding constraint. The design could
    be conclusive on KS and RATE-BAND at this budget; TAIL was structurally
    incapable of discriminating at these (n,X,k) regardless of budget. An
    inconclusive reading is not forced by resources; a REVISE of the support
    interpretation is forced by vacuous TAIL and null-object mismatch.

  falsification_routes_for_M_SUPPORT:
  - id: FALS-1
    cheapest: true
    action: >-
      Recompute deep-smooth on archived factorizations with an odd-only or
      LPF>2 filter (no new curve work if prime factors were retained; else
      re-factor once). If the repaired tau_real > new thr_TAIL at either cell,
      M-SUPPORT is falsified on the limb that mattered historically.
  - id: FALS-2
    action: >-
      Vertex-disjoint matching KS/RATE (n=256) under a measured null at n=256.
      Reject ⇒ present support reading fails dependence control.
  - id: FALS-3
    action: >-
      ENC-B census on 512 uniform random x in F_p (not on E). Divergence from
      curve-FB result falsifies transfer of the support reading to the heuristic
      as stated.
  - id: FALS-4
    action: >-
      Leave-one-out / bootstrap on archived bits=20 delta_u_r to test whether
      thr_RATE cliff-crossing flips bit_size_pass without new factorizations.

  required_controls:
  - RT411037-B1 non-degenerate TAIL statistic + thr_TAIL>0 integrity gate
  - RT411037-M1 dependence-matched or matching-subsample null
  - RT411037-M2 random-target cell
  - RT411037-M3 cliff-sensitivity on archived deltas
  - RT411037-B2 evidence-text anti-promotion wording

  counterexample_or_mutation: >-
    Mutate T_8 → mean of 8 smallest z among odd N (forces escape from LPF=2
    atom). Re-calibrate thr_TAIL from the same null streams. Prediction under
