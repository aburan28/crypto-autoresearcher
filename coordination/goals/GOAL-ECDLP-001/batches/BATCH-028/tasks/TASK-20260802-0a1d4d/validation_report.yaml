  # ------------------------------------------------------------------
  # Completion-gate claim verdicts (CONFIRMED | OVERSTATED | DOES NOT FOLLOW | NOT CHECKED)
  # ------------------------------------------------------------------
  claim_verdicts:
    - claim: archive_commit_integrity_vs_declared_paths_hashes
      verdict: CONFIRMED
      detail: >-
        git diff-tree on 4470b38 lists exactly the eight declared paths (all Added).
        Content SHA-256 at the snapshot equals source_path_sha256 / queue path_sha256
        for every source artifact, including specification.yaml =
        ffdd4451fb6502224d28f5410055a6577ab12703ffea0d05209d0d9ef43d1042. Parent
        cc9f618 matches receipt and queue. Commit is an ancestor of HEAD.

    - claim: freeze_hash_match_before_first_datum
      verdict: CONFIRMED
      detail: >-
        freeze_receipt.json records contract_sha256 ffdd4451... with
        no_datum_produced true at 2026-08-03T05:04:17Z. Measurement
        budget_stamps POST_FREEZE_HASH_OK at 05:11:11Z has match true and the same
        hash. run_manifest.contract_sha256_verified_match and freeze_match are true.
        Independent re-hash of specification.yaml at the snapshot equals that digest.

    - claim: null_measured_at_actual_X_and_committed_before_treatment
      verdict: CONFIRMED
      detail: >-
        For bits 16 and 20, null_calibration cells record X = p^2
        (40961^2=1677803521; 754711^2=569588693521), not 2^(2*bits). B_u =
        max(2, floor(X^(1/u))) recomputes exactly. Chronology in the snapshotted
        budget_stamps.jsonl: NULL_CALIBRATION_COMMITTED at 05:40:16Z (sha
        97b1873c...) then LAUNCH_TREATMENT at 05:40:30Z then TREATMENT_START.
        Driver treatment entry raises if null_calibration.json is absent. Git history
        co-archives null and RESULTS in the same snapshot commit, so git alone does
        not sequence them; stamps + code gate do. That is a forensic limitation, not
        a null-after-treatment finding.

    - claim: i_lt_j_diagonal_absent_by_construction
      verdict: CONFIRMED
      detail: >-
        Untracked driver enumerate_real_N uses for i in range(BFB): for j in
        range(i+1, BFB) and asserts len==130816 against the identity list
        [(i,j) for i in range(512) for j in range(i+1,512)]. No post-filter drop of
        a diagonal. RESULTS/null enumeration.diagonal_present_count == 0 and
        pair_count_n == 130816. Durable caveat: the driver was not snapshot-bound.

    - claim: pre_registered_rules_applied_as_written
      verdict: CONFIRMED
      detail: >-
        thr_KS / thr_RATE_u / thr_TAIL recomputed as the 199th ascending order
        statistic (index 198) of the archived 200 CAL replicates match the committed
        thresholds exactly at both bit sizes. RATE-BAND pass/fail uses every powered
        u in {2,3,4,5}; all rungs powered (n*q_ref >> 30). Plant CTRL-PLANT-B4
        rejects KS and RATE at u=4. Held-out stream 201 does not reject. Reading
        branch M-SUPPORT follows both bit_size_pass. thr_TAIL=0.0 was applied
        unchanged (tau_real <= 0), as disclosed — not silently substituted. No
        Dickman-rho numeric threshold appears in decision fields
        (dickman_rho_used_as_threshold false; CTRL_NO_RHO pass).

    - claim: statistics_rederived_from_raw_counts
      verdict: CONFIRMED
      detail: >-
        For every powered u at both bit sizes, q_u = smooth_count/n, delta_u =
        |q_real-q_ref|, and pass = (delta_u <= thr_RATE_u) match RESULTS exactly.
        Rate-band endpoints q_ref ± thr_RATE_u match null_calibration.thresholds.
        Caveat: smooth_count_* in RESULTS are produced via int(round(q*n)) in the
        driver, so this is internal consistency of the archived counts/rates, not an
        independent re-factorization of the 130816 integers.

    - claim: KS_D_real_recomputed_from_raw_z_samples
      verdict: NOT CHECKED
      detail: >-
        Per-integer z-values are not retained in the snapshot. D_real magnitudes and
        KS pass relative to archived thr_KS are accepted as reported; thr_KS itself
        was recomputed from archived D_r arrays.

    - claim: run_integrity_controls_certificate_kind
      verdict: CONFIRMED
      detail: >-
        certificate.kind is none on RESULTS, null_calibration, run_manifest, and
        run manifests. claim_tier toy. factorization_certificates_verified_* ==
        130816 on real and ref. Plant and held-out M-5 controls recorded. Calib
        process exit_status 1 (append_stamp TypeError after null write) is
        disclosed; null artifact hash still matches and precedes treatment.

    - claim: claim_tier_toy_only
      verdict: CONFIRMED
      detail: >-
        RESULTS.claim_tier == toy; reading.scope names only field_bits {16,20},
        Bfb=512, ENC-B, measured-null thresholds. No crypto-scale, medium-scale,
        affected-scheme, or asymptotic claim in the snapshotted package. M-SUPPORT
        is the contract reading-branch metric, not a Coordinator hypothesis
        transition.

    - claim: M-SUPPORT_as_HEUR_DS_1_crypto_validation
      verdict: OVERSTATED_IF_READ_THAT_WAY
      detail: >-
        The producer text correctly scopes support_at_toy_scope and denies
        hypothesis-status change. Any reading that promotes HEUR-DS-1 or H-SMTH-001
        beyond toy cells would be OVERSTATED; the artifacts themselves do not make
        that leap. Validator does not promote.

    - claim: TAIL_arm_discriminative_power
      verdict: CONFIRMED_AS_APPLIED_WITH_UNDERSTATED_POWER
      detail: >-
        All 200 tau_r are 0.0 at both bit sizes, so thr_TAIL=0.0. The rule was
        applied as written. Discriminative power of TAIL is vacuous except for
        exact T8 equality; the HEUR-consistency conjunction therefore effectively
        reduces to KS ∧ RATE-BAND at these toy cells. Producer disclosed this
        (run_manifest.thr_TAIL_observation; execution_report anomalies). Not a
        silent rule drop.

