schema: crypto.autoresearch.review_plan.v1
goal_id: GOAL-ECDLP-001
batch_id: BATCH-c36939
recorded_at: '2026-08-23'
recorded_by: coordinator
review_plan:
  claim_under_review: >-
    The producer's static claim, if made: a stated joinability certificate is
    sufficient to reduce a four-list source-labelled prime-order ECDLP k-sum
    search to N^(1/3+o(1)) time and memory, or the certificate audit identifies
    the exact missing condition. No empirical or breakthrough claim is under
    review.
  coordinator_prior: >-
    REVISE is more likely than PASS. Prime-order rigidity removes the obvious
    exact quotient, and a mere candidate survival rate does not control either
    output-sensitive enumeration or conditional partial-sum collision. I
    expect the same-pruning/different-cost control to break at least one
    proposed coordinate predicate. A clean impossibility for every approximate
    predicate is not expected and must not be inferred.
  joints:
    - joint: J1-baseline-end-to-end-cost
      assigned_to: TASK-20260823-e05cee
      attack_plan: >-
        Blindly re-derive the k=4 list sizes, pair enumeration cost, filtered
        output size, conditional collision probability, per-attempt success,
        retry count, memory, and total exponent. Reject any accounting that
        hides L^2 work or an N^(1/3) retry factor.
      breaking_artifact: A corrected symbolic cost table with the first exponent mismatch.
    - joint: J2-certificate-sufficiency
      assigned_to: TASK-20260823-e05cee
      attack_plan: >-
        Check that decomposable key computation, O(L+output) enumeration,
        candidate rate, Renyi-2 concentration, source replay, and final zero
        verification jointly imply the claimed cost. Remove each condition in
        turn and construct the cheapest counterexample.
      breaking_artifact: A minimal omitted-condition counterexample.
    - joint: J3-primary-source-and-prior-art-binding
      assigned_to: TASK-20260823-e05cee
      attack_plan: >-
        Verify the Wagner and generalized-birthday bounds against retrieved
        primary sources, and separate the new certificate delta from the
        pre-existing T07 source-join and IDEA-20260817-1e0111 pruning-ratio
        proposals. Any recalled citation is non-supporting.
      breaking_artifact: A citation mismatch or a prior record already stating the full certificate.
    - joint: J4-observation-collision-and-proves-too-much
      assigned_to: TASK-20260823-a4132d
      attack_plan: >-
        Build two filters with the same survival rate: one output-sensitive
        joinable relation and one post-hoc random predicate. Compute their
        conditional partial-sum collision and total cost. Also run the argument
        on XOR truncation, where a genuine quotient exists.
      breaking_artifact: An explicit equal-pruning pair with divergent end-to-end exponents.
    - joint: J5-prime-order-rigidity-and-nearby-object-scope
      assigned_to: TASK-20260823-a4132d
      attack_plan: >-
        Try to smuggle an exact quotient, discrete-log oracle, full pair table,
        or target-dependent decoder into each certificate condition. Confirm
        any rigidity statement is scoped to exact homomorphisms and does not
        exclude every approximate coordinate statistic.
      breaking_artifact: A hidden-oracle/circularity witness or overbroad impossibility statement.
    - joint: J6-pareto-scope-and-steering
      assigned_to: TASK-20260823-a4132d
      attack_plan: >-
        Recompute dominated_by and quantitative sota_delta across time, memory,
        and data. Check that CM and Fourier-moment routes remain visible and
        that rejection guidance names a concrete reopen condition.
      breaking_artifact: A Pareto row or omitted lead showing unjustified steering.
  blindness:
    mutual: true
    lifted_for: []
    rationale: null
  proves_too_much:
    objects:
      - prime_cyclic_group_with_post_hoc_random_pair_predicate
      - xor_vector_space_with_exact_prefix_projection
      - oracle_filter_that_materializes_all_L_squared_pairs
    failure_signature: >-
      The certificate must reject the random post-hoc and L^2-materializing
      objects as sub-rho implementations, while accepting the algebraic shape
      of XOR truncation only as a nearby positive control, never as an ECDLP
      result. If the same proof labels all three N^(1/3), it proves too much.
    assigned_to: TASK-20260823-a4132d
  blind_rederivation:
    required: true
    quantity: >-
      For four source-labelled lists of length L=N^(1/3), derive total time,
      memory, and success from join output size, conditional collision
      probability, and retry count.
    parameters:
      group_order: N
      list_length: N^(1/3)
      intended_pair_survival: N^(-1/3)
      uniform_group_collision_probability: N^(-1)
      target_conditioned_collision_probability: N^(-2/3)
    blind_from:
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-c36939/tasks/TASK-20260823-14f80f/frontier-rerank.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-c36939/tasks/TASK-20260823-14f80f/proof-search-map.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-c36939/tasks/TASK-20260823-14f80f/joinability-certificate.yaml
      - experiments/EXP-JPR-88d9d4/specification.yaml
    assigned_to: TASK-20260823-e05cee
  procedure_deviations: []
