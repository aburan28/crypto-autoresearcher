  blind_rederivation:
    quantity: >-
      For four source-labelled lists of length L=N^(1/3), derive total
      time, memory, and success from join output size, conditional collision
      probability, and retry count.
    completed_before_any_blind_from_path_was_read: true
    durable_pre_read_artifact_created: false
    derivation:
      - >-
        Each side contains L^2=N^(2/3) possible leaf pairs. Survival
        probability 1/L leaves expected output M=L=N^(1/3).
      - >-
        A decomposable output-sensitive join with work
        O(L*polylog(N)+M) costs N^(1/3+o(1)) per side. A post-hoc predicate
        that inspects all possible pairs costs N^(2/3) before any final join.
      - >-
        For two filtered lists of size M=L and target-conditioned
        cross-collision q=N^(-2/3), E[Z]=M^2*q=1. This expectation alone
        does not imply constant Pr[Z>0]; an anti-clustering or second-moment
        condition is independently necessary.
      - >-
        With ambient q=N^(-1), E[Z]=N^(-1/3), hence
        Pr[Z>0] is at most N^(-1/3). At least N^(1/3) attempts are needed,
        lifting a linear-list attempt to at least N^(2/3) expected time.
      - >-
        If a separate dependence bound supplies Pr[Z>0]=Omega(1), the two
        joins, final sort/hash intersection, exact checks, and source-label
        storage fit N^(1/3+o(1)) time and memory, provided all preprocessing,
        skew, candidates, and retries are charged.
      - >-
        A replayed identity A*P+B*Q=O with prime N and B nonzero gives
        k=-A/B mod N when Q=kP. B=0, a failed point replay, or a source-label
        mismatch must be rejected.
    comparison_after_producer_read: >-
      The independent derivation agrees with the producer. In particular,
      producer condition JPR-C5 is exactly the missing anti-clustering gate
      that prevents JPR-C4's expected collision count from being mistaken for
      constant success.
    protocol_conflict: >-
      The four producer paths were subsequently read to perform the assigned
      J1-J3 snapshot audit, exactly as the frozen handoff instructed. The
      repository's mechanical checker nonetheless treats any later read as a
      blind_from violation. No truthful passing attestation can represent the
      frozen sequence.

  joint_results:
    - joint: J1-baseline-end-to-end-cost
      verdict: holds
      checks:
        - L=N^(1/3), L^2=N^(2/3), and output L at survival 1/L recomputed.
        - >-
          Good branch: output-sensitive joins plus q=N^(-2/3) and C5
          constant-success control give N^(1/3+o(1)) time and memory.
        - >-
          Ambient branch: q=N^(-1) gives success at most N^(-1/3),
          N^(1/3) retries, and at least N^(2/3) total time.
        - Post-hoc enumeration independently costs N^(2/3).
        - Source labels add only polylogarithmic bits and replay without a DLP oracle.
      limitation: >-
        JPR-C4 by itself supplies only an expected collision count. The
        advertised exponent holds only because JPR-C5 separately assumes and
        requires a constant lower bound on exact-success probability.

    - joint: J2-certificate-sufficiency
      verdict: holds
      finding: >-
        Taken together and with their stated uniform quantifiers, C1-C7 are
        sufficient. The theorem is conditional and no curve relation is
        asserted to satisfy C2, C4, or C5.
      removal_witnesses:
        JPR-C1-SOURCE: >-
          Remove source labels and a point collision supplies no recoverable
          scalar coefficients; post-hoc source inversion is another DLP.
        JPR-C2-DECOMPOSABLE-KEY: >-
          A random point-hash subset has the desired conditioned support but
          requires inspection of all L^2 sums.
        JPR-C3-OUTPUT-SENSITIVE: >-
          A constant join key is decomposable but emits L^2 pairs and needs
          N^(2/3) output traffic or storage.
        JPR-C4-CONDITIONAL-COLLISION: >-
          Independent per-pair survival leaves sums uniform, so q=N^(-1) and
          creates the N^(1/3) retry exponent.
        JPR-C5-CORRELATION-CONTROL: >-
          A rare-burst construction can keep E[Z]=1 while setting Z=0 with
          probability 1-N^(-1/3) and Z=N^(1/3) otherwise. Collision
          expectation alone then hides N^(1/3) retries.
        JPR-C6-VERIFICATION: >-
          A zero denominator or duplicate-source tautology can be accepted as
          a false success unless point and scalar replay are mandatory.
        JPR-C7-FULL-COST: >-
          An oracle may materialize all L^2 pairs, return only L, and make the
          visible join appear linear while hiding N^(2/3) preprocessing.
      quantifier_check: >-
        The producer fixes one public relation family and constants before
        data, requires all sufficiently large prime orders in a declared curve
        family, and forbids selecting curve, projection, bucket width, decoder,
        or success metric after outputs. Per-instance post-selection is not
        licensed.

    - joint: J3-primary-source-and-prior-art-binding
      verdict: holds
      primary_source_checks:
        - source: https://www.iacr.org/archive/crypto2002/24420288/24420288.pdf
          result: holds
          detail: >-
            Wagner states and derives the four-list cube-root algorithm,
            output-sensitive sort/hash joins, O(k*2^(n/(1+lg k))) k-tree
            time and space, transfer to additive cyclic groups, and the
            reduction from cyclic-group k-sum to discrete logarithm.
        - source: https://eprint.iacr.org/2016/312.pdf
          result: holds
          detail: >-
            Nikolic and Sasaki restate Wagner's k-tree bound and derive the
            tradeoff T^2*M^(lg k-1)=k*N, including T^2*M=4N for k=4. The
            producer uses this only as refinement and tradeoff context.
        - source: https://arxiv.org/abs/1404.2226
          result: holds_with_scope
          detail: >-
            The source studies coordinate-bit extraction from sums of two
            elliptic-curve subgroup sources and reports closeness to uniform;
            the producer explicitly does not treat it as a joinability theorem.
        - source: https://arxiv.org/abs/1302.4210
          result: holds_with_scope
          detail: >-
            The source derives bilinear exponential-sum bounds over elliptic
            curve points; the producer labels it context, not a source-resolved
            output-sensitive join theorem.
      prior_art_checks:
        - prior: IDEA-20260817-1e0111
          result: distinct_delta_supported
          detail: >-
            The prior record names a partial verifier and scalar pruning ratio
            r, but explicitly collapses the lane to r. It does not separate
            output-sensitive enumeration, conditioned cross-collision, and
            anti-clustering success as independent certificate coordinates.
        - prior: IDEA-20260817-84755b
          result: distinct_delta_supported
          detail: >-
            The prior record measures conditional-entropy propagation defects
            for a fixed coordinate panel. It does not give the full source-
            resolved join-and-retry certificate.
        - prior: >-
            ideas/rejected/preallocation/20260724-a_T07_wagner_generalized_
            birthday_source_join_preid_duplicate.md
          result: explicit_successor_not_novelty_claim
          detail: >-
            T07 already requires public staged projections, balance, source
            replay, and complete costs in a factor-base descent setting. The
            new record correctly acknowledges it and limits its delta to the
            explicit probabilistic sufficiency vector and equal-pruning
            observation collision. Novelty remains unverified.

