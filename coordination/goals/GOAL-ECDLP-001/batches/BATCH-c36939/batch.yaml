      path; preserved for later rerank, not dispatched.
    dominated_by: JPR-CERTIFICATE

proof_search_requirements:
  baseline_reproduction: >-
    Re-derive Wagner k=4 time/memory and the exact retry factor when filtered
    partial sums remain uniform; include all list construction and join costs.
  observation_collision: >-
    Exhibit same pruning/survival rate with different conditional collision
    probability and different enumeration cost.
  quantifier_order: >-
    State whether the relation works for every prime-order curve/group in the
    target class or only a sampled family, and place probability over all
    randomness explicitly.
  method_ceiling: >-
    State the strongest conclusion available without a nontrivial quotient or
    without measuring an output-sensitive join implementation.
  nearby_object_control: >-
    Use XOR-vector-space truncation as a positive control where an exact lossy
    homomorphism exists, and a prime cyclic group with a random post-hoc hash as
    the known-false control.

