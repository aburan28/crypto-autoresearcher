objective: >-
  Determine whether a four-list Wagner route to prime-order ECDLP can even be
  stated with a source-resolved, output-sensitive joinable partial verifier
  whose end-to-end cost is N^(1/3+o(1)), or whether the route fails before
  implementation. Replace the insufficient scalar pruning-ratio observable by
  a certificate that accounts for join enumeration, conditional collision
  entropy, source replay, success probability, and memory. Produce no run.

mechanism_boundary: >-
  Leaves are source-labelled points aP+bQ, so source coefficients are retained
  at construction. The missing primitive is not post-hoc source inversion: it
  is a decomposable join relation enumerable in O(L+output) for L=N^(1/3), with
  candidate rate about N^(-1/3), conditioned partial-sum collision probability
  about N^(-2/3), and a final zero-sum success probability bounded away from
  zero. An exact homomorphic projection would supply this shape but is forbidden
  nontrivially in a prime-order group; approximate coordinate projections must
  therefore pass the certificate rather than inherit Wagner's cost by analogy.

observation_collision_control: >-
  Construct two predicates with the same pair survival rate. A joinable bucket
  predicate may be enumerated output-sensitively; a post-hoc random predicate
  requires L^2 pair examination and leaves conditional sums uniform. The latter
  has final success N^(-1/3) per attempt and total N^(2/3), despite the same
  pruning ratio. Therefore pruning ratio alone is not decision-identifying.

frontier_candidates:
  - id: JPR-CERTIFICATE
    route: source_resolved_output_sensitive_wagner_join
    expected_delta: >-
