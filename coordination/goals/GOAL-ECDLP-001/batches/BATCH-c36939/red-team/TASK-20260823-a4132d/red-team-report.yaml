  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-c36939
  role: red-team
  recorded_at: '2026-08-23'
  overall_verdict: REVISE
  claim_under_review: >-
    The frozen producer package's conditional static claim: JPR-C1 through
    JPR-C7 are a sufficient certificate for a source-labelled four-list
    prime-order ECDLP relation finder with expected time and peak memory
    N^(1/3+o(1)), while the current package identifies the first missing
    condition rather than asserting that a curve construction satisfies it.
    No empirical, implementation, scientific-support, closure, or
    breakthrough claim is under review.

  snapshot_binding:
    snapshot_task_id: TASK-20260823-baa211
    snapshot_commit: 9b94bd5def3ce99f1c4ad8c87bb3e6f395c4d83c
    snapshot_parent: de7a903390a87eb9083e474e8108f828019b2572
    snapshot_reachable_from_review_head: true
    review_head: 24cf339301153341f48d382c1a7a52f0edb0c09e
    exact_changed_path_count: 9
    queue_hash_bindings_checked: 9
    queue_hash_bindings_matched: 9
    snapshot_receipt_self_neutrality_respected: true
    verdict: PASS
    note: >-
      The queue's additive post-commit binding, rather than the self-neutral
      prepared receipt's null self fields, supplies the commit, parent, and
      nine final hashes. Every bound blob was read from the reachable snapshot
      commit and matched exactly.

  joint_verdicts:
    - joint: J4-observation-collision-and-proves-too-much
      verdict: breaks
      holds: >-
        The central observation collision is real. At fixed survival 1/L,
        XOR quotient matching, an independent per-pair coin, and a post-hoc
        point filter have different enumeration, collision, retry, and total
        exponents. The certificate correctly rejects post-hoc and full-table
        mechanisms as sub-rho implementations.
      break: >-
        POS-XOR cannot literally pass all seven ECDLP rows as the producer
        repeatedly requires. F_2^(3m) is not a prime-order cyclic group with
        a single generator P and scalar secret Q=kP, so the ECDLP-specific
        C1/C6 scalar-recovery statement has no literal instance on that
        object. XOR is a valid positive control for the join core C2-C5/C7
        only after a separately stated vector-source replay analogue. The
        experiment's success criterion and arm table currently conflate that
        analogue with literal ECDLP source recovery.
      breaking_artifact: >-
        Use the producer's own POS-XOR object. If P generates the whole group,
        then F_2^(3m) would have to be cyclic, which it is not for m>0. If P
        instead generates a one-dimensional subspace, Q=kP and all aP+bQ
        leaves remain in that subspace, so the claimed 3m-dimensional prefix
        quotient experiment is no longer the stated object.
    - joint: J5-prime-order-rigidity-and-nearby-object-scope
      verdict: holds
      holds: >-
        The frozen package does not instantiate an exact quotient or hide a
        concrete oracle. C2, C3, C7, the quantifier-order statement, and the
        explicit no-oracle constraint jointly reject a discrete-log-derived
        scalar key, a materialized L^2 table, and an after-the-fact decoder.
        The rigidity statement is limited to exact nontrivial lossy group
        quotients and explicitly does not exclude approximate coordinate
        statistics.
      residual_scope: >-
        For G of prime order, the kernel of an exact homomorphism is either
        trivial or all of G. Thus an exact homomorphic key is injective or
        constant and supplies no nontrivial lossy quotient. This says nothing
        by itself about non-homomorphic, approximate, list-distribution, or
        coordinate-derived keys. Their C2/C4/C5 obligations remain open.
      required_wording_tightening: >-
        State in C2 itself, not only in C7 and surrounding prose, that key
        evaluation and auxiliary-state construction are public,
        target-independent, and charged within polylogarithmic work per leaf.
        This prevents a future certificate row from looking locally complete
        while relying on C7 to expose a hidden DLP oracle.
    - joint: J6-pareto-scope-and-steering
      verdict: breaks
      holds: >-
        CM calibration and the Fourier-moment route remain visible, have
        concrete reopen conditions, and are not declared closed. The selected
        static falsifier is cheap and exponent-relevant. No evidence of
        deliberate suppression or bad-faith steering was found.
      break: >-
        The frontier is not a valid Pareto table as written. JPR-CERTIFICATE
        records dominated_by null while its own check says the realized route
        supplies no attack and is dominated by rho. The Fourier and CM rows
        are marked dominated_by JPR-CERTIFICATE despite unknown time, memory,
        or data coordinates and despite JPR's N^(1/3) point being conditional
        on an uninstantiated construction. Pareto dominance cannot be inferred
        from unknown coordinates or by comparing a hypothetical positive
        branch with current realized rows. Pollard-rho and BSGS data/query
        coordinates are also absent while the text says all three axes were
        checked.
      steering_caveat: >-
        The numeric positive-branch priors 0.08, 0.03, and 0.02 have no stated
        elicitation method, evidence reference, or uncertainty interval. They
        may be subjective ranking inputs, but must be labelled as such and may
        not be presented as measured probabilities.

  explicit_same_pruning_different_cost_control:
    parameters:
      group_scale: N
      list_length: L=N^(1/3)
      potential_pairs_per_side: L^2=N^(2/3)
      survival_probability: 1/L=N^(-1/3)
      expected_survivors_per_side: L=N^(1/3)
    arms:
      - object: xor_prefix_quotient
        qualifying_pair_enumeration_exponent: 1/3
        conditioned_cross_zero_probability_exponent: -2/3
        per_attempt_success_exponent: 0
        retry_exponent: 0
        total_time_exponent: 1/3
        peak_memory_exponent: 1/3
        disposition: >-
          Accept for the join-core algebra only. It is not a prime-order ECDLP
          or a literal C1/C6 scalar-recovery control.
      - object: independent_per_pair_coin_in_prime_cyclic_group
        qualifying_pair_enumeration_exponent: 2/3
        conditioned_cross_zero_probability_exponent: -1
        per_attempt_success_exponent: -1/3
        retry_exponent: 1/3
        total_time_exponent_if_fresh_full_enumeration_each_attempt: 1
        optimistic_total_time_exponent_if_linear_enumeration_were_granted: 2/3
        disposition: REJECT
        note: >-
          The producer's N^(2/3) ambient-branch total is the optimistic linear
          per-attempt lower bound. The actual independent-pair-coin arm pays
          N^(2/3) enumeration per fresh attempt and N^(1/3) retries, giving
          exponent 1 if the control itself is run literally. Reusing the same
          failed tables does not create an independent retry.
      - object: complementary_posthoc_point_hash_subsets
        construction: >-
          Filter left sums into a random public S of size N/L and right sums
          into -S. This complementary choice is necessary for the advertised
          cross-zero concentration.
        qualifying_pair_enumeration_exponent: 2/3
        conditioned_cross_zero_probability_exponent: -2/3
        per_attempt_success_exponent: 0
        retry_exponent: 0
        total_time_exponent: 2/3
        disposition: REJECT
        note: >-
          If both sides use the same unsymmetrized random S, the relevant
          probability depends on S intersect -S and is ambient order N^-1 in
          expectation. The producer should state S versus -S explicitly.
      - object: full_pair_table_selection_oracle
        hidden_preprocessing_exponent: 2/3
        selected_output_exponent: 1/3
        total_time_exponent: at_least_2/3
        disposition: REJECT
    conclusion: >-
      Survival 1/L has preimages with total exponents 1/3, 2/3, and 1 under
      literal implementations. It is therefore not a sufficient statistic.

  proves_too_much_controls:
    - object: prime_cyclic_group_with_post_hoc_random_pair_predicate
      result: rejected_as_required
      first_failure: JPR-C2-DECOMPOSABLE-KEY
      additional_failures:
        - JPR-C3-OUTPUT-SENSITIVE
        - JPR-C7-FULL-COST
      note: >-
        An independent pair coin also fails C4/C5; a complementary point-hash
        subset can pass the collision exponent but still fails enumeration.
    - object: xor_vector_space_with_exact_prefix_projection
      result: revise_control_typing
      join_core_result: accepted_as_required
      ecdlp_lift_result: not_applicable
      failure_location: >-
        The claim that POS-XOR passes all seven rows, specifically literal
        ECDLP source replay C1/C6, rather than an explicitly typed analogue.
    - object: oracle_filter_that_materializes_all_L_squared_pairs
      result: rejected_as_required
      first_failure: JPR-C3-OUTPUT-SENSITIVE
      additional_failure: JPR-C7-FULL-COST
  failure_signature_result: >-
    The proof does not assign N^(1/3) to both negative objects. It does,
    however, type the nearby XOR control too broadly, so the declared
    three-object control does not pass without revision.

  hidden_oracle_and_circularity_attacks:
    - mutation: scalar_key_from_discrete_log
      construction: >-
        Define the leaf key by first recovering the scalar of aP+bQ relative
        to P, then truncate that scalar as in XOR.
      apparent_gain: O(L+output) scalar-prefix join and desired concentration.
      rejection: >-
        Computing the key already solves the target DLP or an equivalent
        per-leaf DLP; C7 charges at least the incumbent cost and the explicit
        no-DLP-oracle constraint rejects it.
    - mutation: target_or_list_dependent_decoder
      construction: >-
        After seeing Q and all four lists, choose a bucket rule that isolates
        a known zero relation.
      apparent_gain: Constant success with L reported outputs.
      rejection: >-
        It reverses the quantifiers. The public relation family, curve family,
        key width, and decoder must be fixed before Q, list randomness, and
        outputs.
    - mutation: materialized_pair_index_called_auxiliary_state
      construction: Build all L^2 pair sums and expose only an O(L) index.
      apparent_gain: Output-sensitive query after preprocessing.
      rejection: >-
        C3 and C7 charge construction time and peak live storage; relabelling
        preprocessing as bounded state does not change the exponent.
    - mutation: exact_lossy_group_quotient
      construction: Assume a nontrivial exact homomorphism from prime-order G.
      rejection: >-
        Kernel rigidity makes the map injective or constant. This mutation is
        impossible as an exact quotient, but the argument does not touch an
        approximate non-homomorphic coordinate key.

  objections:
    - id: RT-O1-XOR-TYPE
      severity: material_static_control_defect
      status: validated
      finding: >-
        The XOR positive control is valid for the join core but cannot
        literally satisfy the prime-order scalar-source rows. Requiring it to
        pass all seven rows makes the control ill-typed.
      affected_paths:
        - ledger/proposals/IDEA-20260823-835868.yaml
        - experiments/EXP-JPR-88d9d4/specification.yaml
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-c36939/tasks/TASK-20260823-14f80f/joinability-certificate.yaml
    - id: RT-O2-PARETO
      severity: material_ranking_defect
      status: validated
      finding: >-
        Unknown or conditional coordinates are used to assert domination, and
        data/query coordinates for the baselines are absent. The recorded
        dominated_by fields do not follow from the table.
      affected_path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-c36939/tasks/TASK-20260823-14f80f/frontier-rerank.yaml
    - id: RT-O3-NULL-ARITHMETIC
      severity: clarification
      status: validated
      finding: >-
        Literal independent-pair-coin retries cost exponent 1 when each fresh
        attempt re-enumerates N^(2/3) pairs; the N^(2/3) figure is an
        optimistic lower bound that grants linear enumeration. The point-hash
        concentration claim also needs complementary S and -S predicates.
      affected_paths:
        - ledger/proposals/IDEA-20260823-835868.yaml
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-c36939/tasks/TASK-20260823-14f80f/proof-search-map.yaml

  required_controls:
    - >-
      Split the certificate into a typed join-core certificate and an ECDLP
      lift. Make POS-XOR pass the former, and mark C1/C6 not applicable unless
      a precise vector-source replay analogue is stated separately.
    - >-
      Reissue the Pareto table with separate current-realized and conditional
      frontiers. Use unknown or incomparable, never dominated, when any axis
      is unknown. Define the data/query axis and fill it for rho and BSGS.
    - >-
      State the two post-hoc nulls separately: independent pair coins have
      ambient collision and literal expected total exponent 1; complementary
      point-hash subsets have concentrated collision but N^(2/3) enumeration.
    - >-
      Label branch priors as subjective elicited values with method and
      uncertainty, or remove them from the decision record.

  baseline_comparison:
    pollard_rho:
      time_exponent: 1/2
      memory_exponent: 0
      status: incumbent_realized_baseline
    bsgs:
      time_exponent: 1/2
      memory_exponent: 1/2
      status: incumbent_realized_baseline
    jpr_current:
      status: no_instantiated_attack
      realized_delta: 0
      dominated_by: pollard_rho_as_an_attack
    jpr_conditional_positive:
      time_exponent: 1/3
      memory_exponent: 1/3
      data_or_group_input_exponent: 1/3
      versus_rho: lower_time_higher_memory_incomparable
      versus_bsgs: dominates_if_data_axis_is_defined_consistently
      caveat: All seven correctly typed obligations remain conditional.

  heuristic_challenges:
    - >-
      C4's collision exponent is not enough for success; C5 must supply a
      second-moment or other dependence bound. The package states this, but no
      curve candidate or proof currently supplies it.
    - >-
      A random subset's support size does not alone determine zero-sum
      cross-collision unless the right predicate is coupled as -S. This
      coupling must be predeclared and charged, not added after seeing lists.

  cost_model_challenges:
    - >-
      Keep per-attempt enumeration and retry multiplication explicit for every
      null. N^(2/3) pair enumeration times N^(1/3) fresh retries is N, not
      N^(2/3).
    - >-
      Auxiliary-state creation, key evaluation, bucket skew, and rebuilding
      for an independent retry must remain inside C7. No query-only cost may
      be compared with rho's end-to-end cost.

  reduction_and_scope_challenges:
    - >-
      The conditional theorem is not an ECDLP attack until one public
      curve-family construction satisfies C2, C4, and C5 with the required
      uniform quantifiers. No such construction appears in the snapshot.
    - >-
      Prime-order exact-quotient rigidity is narrow and correctly leaves
      approximate coordinate statistics open. No impossibility conclusion
      about that broader family is supported.
    - >-
      The static certificate and these reviews cannot authorize code, a run,
      a hypothesis promotion, an evidence promotion, closure, or a
      breakthrough claim.

  proof_architecture_challenges:
    observation_fiber: >-
      Survival 1/L has at least three preimages spanning total-time exponents
      1/3, 2/3, and 1. The certificate vector separates them; the old pruning
      scalar does not.
    quantifier_order: >-
      The stated for-all-large-N, fixed-before-Q-and-data order rejects a
      post-selected decoder. Any future candidate must retain it verbatim.
    boundary_and_strictness: >-
      The conditional 1/3 point would be strictly faster than rho in time, but
      it is not a current point and trades N^(1/3) memory against rho's
      constant-memory baseline.
    method_ceiling: >-
      Missing C2 gives at least N^(2/3) enumeration. Missing C4 with otherwise
      linear attempts gives N^(2/3) expected total; the literal pair-coin null
      is worse because it misses both. Missing C5 leaves expectation without a
      constant-success theorem.
    nearby_object: >-
      XOR supplies the desired quotient join but is not a literal prime-order
      ECDLP source-recovery object. That typing distinction is the missing
      separator in the current positive-control claim.
    compositional_invariant: >-
      Removing C2 admits the post-hoc point-hash null; removing C4 admits the
      independent-coin null; removing C5 admits perfectly correlated
      survivors with no zero collision; removing C7 admits the full-table
      oracle. C1/C6 are specifically the ECDLP lift, not generic join rows.

  steering_audit:
    promising_path_suppressed: false
    unjustified_closure_detected: false
    quantitative_ranking_valid: false
    finding: >-
      Keeping CM and Fourier-moment rows plus explicit reopen conditions is
      good-faith forward guidance. The selection can be justified by cheap
      falsification and conditional exponent relevance, but not by the
      current dominated_by fields or unexplained numeric priors.
    resource_reversal: >-
      Prime-order rigidity is a resource locator rather than a lane closure:
      it focuses the search on non-homomorphic, distribution-specific keys
      while making their output-sensitive enumeration and C4/C5 concentration
      obligations explicit. This is a candidate ranking insight, not evidence.
    spawned_ids: []

  narrowest_supported_statement: >-
    On the frozen static package, pruning rate alone is rigorously
    underidentifying: explicit same-survival controls have divergent
    enumeration, collision, retry, and total-cost exponents. JPR-C2 through
    C5 and C7 form a useful conditional join-core gate, and C1/C6 describe the
    separate ECDLP source-replay lift. No coordinate-derived curve relation is
    shown to satisfy the gate, the XOR object is only a join-core positive
    control, the Pareto ranking requires repair, and no ECDLP improvement or
    scientific promotion follows.

  next_concrete_action: >-
    The Coordinator should ledger-dispose this round as REVISE and issue an
    additive successor, if separately authorized, that (1) type-splits the XOR
    join core from the ECDLP lift, (2) repairs the two null-arm arithmetic and
    S versus -S specification, and (3) reconstructs separate realized and
    conditional Pareto frontiers without dominance claims over unknown axes.
    Do not implement or run EXP-JPR-88d9d4 from this report.

