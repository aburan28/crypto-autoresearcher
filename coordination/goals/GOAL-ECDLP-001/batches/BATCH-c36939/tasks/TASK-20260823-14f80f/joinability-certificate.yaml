joinability_certificate:
  schema: crypto.autoresearch.joinability_certificate.v1
  task_id: TASK-20260823-14f80f
  hypothesis_id: H-JPR-3a00f0
  recorded_at: '2026-08-23'
  theorem_status: conditional_static_unreviewed
  theorem: >-
    If one public construction satisfies JPR-C1 through JPR-C7 uniformly for
    the declared prime-order curve family, then the four-list procedure
    returns a valid discrete-log relation in N^(1/3+o(1)) expected time and
    N^(1/3+o(1)) peak memory. No construction is asserted to satisfy them.
  rows:
    JPR-C1-SOURCE:
      required: true
      statement: Source coefficients accompany every point and pair; final replay is exact.
      current_curve_candidate_status: structurally_available_at_leaf_level
    JPR-C2-DECOMPOSABLE-KEY:
      required: true
      statement: Qualifying pairs are enumerable in O(L polylog N plus output), not L squared.
      current_curve_candidate_status: missing
    JPR-C3-OUTPUT-SENSITIVE:
      required: true
      statement: Output and peak-live tails are O(L polylog N) with no hidden table.
      current_curve_candidate_status: missing_pending_C2
    JPR-C4-CONDITIONAL-COLLISION:
      required: true
      statement: Cross-collision probability of filtered pair sums is Theta(N^(-2/3)).
      current_curve_candidate_status: unproved
    JPR-C5-CORRELATION-CONTROL:
      required: true
      statement: Dependence still gives constant probability of at least one exact zero.
      current_curve_candidate_status: unproved
    JPR-C6-VERIFICATION:
      required: true
      statement: Every candidate and scalar is independently replayed; invalid denominators reject.
      current_curve_candidate_status: specified
    JPR-C7-FULL-COST:
      required: true
      statement: Construction, joins, skew, outputs, verification, retries, and memory are charged.
      current_curve_candidate_status: cannot_pass_until_C2_C4_C5
  necessity_witnesses:
    JPR-C2-DECOMPOSABLE-KEY: posthoc_point_hash_subset
    JPR-C4-CONDITIONAL-COLLISION: independent_pair_coin
    JPR-C5-CORRELATION-CONTROL: adversarially_correlated_survivor_lists_with_zero_exact_collisions
    JPR-C6-VERIFICATION: zero_denominator_or_duplicate_source_relation
    JPR-C7-FULL-COST: full_pair_table_oracle
  arm_table:
    - arm: POS-XOR
      C1: pass
      C2: pass
      C3: pass
      C4: pass
      C5: pass_symbolically
      C6: pass
      C7: pass
      disposition: positive_control_only
    - arm: NULL-PAIR-COIN
      C1: pass
      C2: fail
      C3: fail
      C4: fail
      C5: fail
      C6: pass
      C7: fail
      disposition: reject
    - arm: NULL-POINT-HASH
      C1: pass
      C2: fail
      C3: fail
      C4: pass_in_random_subset_model
      C5: model_dependent
      C6: pass
      C7: fail
      disposition: reject
    - arm: NULL-FULL-TABLE
      C1: pass
      C2: oracle_only
      C3: fail
      C4: selectable
      C5: selectable
      C6: pass
      C7: fail
      disposition: reject
  exact_arithmetic:
    list_size: L=N^(1/3)
    potential_pair_count_per_side: L^2=N^(2/3)
    survivor_count_at_rate_1_over_L: L=N^(1/3)
    cross_pair_count_between_survivor_lists: L^2=N^(2/3)
    expected_collisions_good_branch: L^2*N^(-2/3)=1
    expected_collisions_ambient_branch: L^2*N^(-1)=N^(-1/3)
    ambient_branch_retries: N^(1/3)
    ambient_branch_total_from_linear_attempt: N^(2/3)
  source_replay:
    leaf: R_i=a_i*P+b_i*Q
    final_relation: A*P+B*Q=O
    recovery: k=-A/B mod N when Q=kP and B is nonzero
    rejects:
      - B_equals_0_mod_N
      - point_identity_replay_failure
      - coefficient_or_source_mismatch
      - duplicate_source_outside_declared_sampling_contract
  current_disposition: >-
    The conditional theorem architecture is complete enough for independent
    attack. The elliptic-curve mechanism is not instantiated: C2 is missing
    and C4/C5 are unproved. Therefore no implementation or experiment is
    authorized and no ECDLP improvement is claimed.
  implementation_authorized: false
  execution_authorized: false
  experiment_runs: 0
  breakthrough_claimed: false
