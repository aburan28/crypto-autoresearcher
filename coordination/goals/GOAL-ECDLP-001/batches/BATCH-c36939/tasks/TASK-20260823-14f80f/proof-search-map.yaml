proof_search_map:
  schema: crypto.autoresearch.proof_search_map.v1
  task_id: TASK-20260823-14f80f
  hypothesis_id: H-JPR-3a00f0
  experiment_id: EXP-JPR-88d9d4
  recorded_at: '2026-08-23'
  target_statement: >-
    JPR-C1..C7 imply a source-resolved N^(1/3+o(1))-time,
    N^(1/3+o(1))-memory four-list ECDLP relation finder, conditional on a
    concrete public relation satisfying every row.
  baseline_reproduction:
    parameters:
      L: N^(1/3)
      potential_pairs_per_side: L^2=N^(2/3)
      intended_survival: 1/L=N^(-1/3)
      survivors_per_side: L=N^(1/3)
    good_branch: >-
      Output-sensitive enumeration costs N^(1/3+o(1)); conditioned collision
      is N^(-2/3); L^2 cross-pairs give constant expected collisions; retries
      are constant; total time and memory are N^(1/3+o(1)).
    ambient_branch: >-
      Conditioned collision stays N^(-1); L^2 cross-pairs give
      N^(-1/3) success; N^(1/3) retries raise N^(1/3) per-attempt work to
      N^(2/3) total, even if enumeration were free.
    enumeration_failure_branch: >-
      Inspecting all L^2 pairs already costs N^(2/3), regardless of survival
      or collision concentration.
    incumbent_controls:
      pollard_rho: {time_exponent: 1/2, memory_exponent: 0}
      bsgs: {time_exponent: 1/2, memory_exponent: 1/2}
  observation_collision_search:
    fixed_observable: survival_probability_1_over_L
    objects:
      - object: xor_prefix_join
        enumeration_exponent: 1/3
        collision_probability_exponent: -2/3
        total_time_exponent: 1/3
      - object: independent_pair_coin
        enumeration_exponent: 2/3
        collision_probability_exponent: -1
        total_time_exponent: at_least_2/3
      - object: posthoc_point_hash_subset
        enumeration_exponent: 2/3
        collision_probability_exponent: -2/3
        total_time_exponent: 2/3
    conclusion: >-
      Identical pruning has at least three preimages with distinct costs;
      pruning ratio is not sufficient for the decision.
  constructive_transforms:
    - transform: replace_scalar_r_with_certificate_vector
      object: [enumeration, output, cross_collision, retries, source_replay, time, memory]
      predicted_gain: makes hidden exponent costs visible
    - transform: source_label_every_leaf
      object: coefficients_a_b_plus_point
      predicted_gain: removes post-hoc tuple inversion from the attack path
    - transform: separate_exact_and_approximate_projection_claims
      object: prime_order_rigidity_boundary
      predicted_gain: prevents exact impossibility from being overextended
  quantifier_order: >-
    There exists a public relation family fixed before data and constants
    c,C>0 such that for all sufficiently large prime N in a declared curve
    family, over independently predeclared coefficient-list randomness,
    JPR-C1..C7 hold with probability at least c and total charged cost at most
    C*N^(1/3)*polylog(N). Curve, model, key width, decoder, and success metric
    are fixed before outputs. No existential choice after seeing Q or list
    contents is allowed.
  method_ceiling:
    without_output_sensitive_enumeration: Omega(N^(2/3)) pair work
    without_collision_concentration: Omega(N^(1/3)) retries and Omega(N^(2/3)) total
    without_source_replay: relation collection but no DLP recovery
    exact_projection_boundary: >-
      A nontrivial exact lossy quotient is unavailable in a prime-order group;
      this ceiling does not rule out every approximate coordinate relation.
    strongest_current_conclusion: >-
      The prior pruning-ratio formulation is underidentified. No concrete
      elliptic-curve relation currently passes the stronger certificate.
  nearby_object_control:
    positive: F_2^(3m) prefix quotient
    known_false:
      - independent pair coin in a prime cyclic group
      - post-hoc random point-hash subset
      - full-table oracle
    failure_signature: Any proof assigning N^(1/3) to all objects proves too much.
  single_responsibility_lemmas:
    - lemma: source_replay_correctness
      obligation: final coefficients yield exact point identity and scalar when denominator nonzero
    - lemma: join_enumeration_bound
      obligation: qualifying pairs enumerated in O(L polylog N plus output)
    - lemma: output_and_memory_bound
      obligation: filtered lists and peak live storage are O(L polylog N) with stated tail
    - lemma: collision_success_bound
      obligation: conditioned cross-collision and dependence imply constant zero-relation success
    - lemma: fully_charged_runtime
      obligation: per-attempt cost times inverse success stays N^(1/3+o(1))
  unresolved_obligation: >-
    Exhibit any public coordinate-derived relation on a prime-order curve that
    passes both JPR-C2 and JPR-C4 without a hidden oracle. This is open; the
    present batch does not claim one.
  disposition: ready_for_independent_static_falsification
