batch:
  id: BATCH-960560
  goal_id: GOAL-ECDLP-001
  kind: design_gate_and_reconciliation_finding
  opened_by: coordinator
  opened_at: '2026-08-07'
  recorded_by_task: TASK-20260807-48b8f2

  objective: >-
    Design-gate review (no code, no experiment execution) of the task handed to
    this session: open a successor Executor batch under frozen
    PA-IT-001-v3-rc45-repair-5 implementing DEC-20260803-004's exact_next_action,
    i.e. ledger/goals/GOAL-ECDLP-001/goal.yaml's current committed next_action
    text (current_batch_id: BATCH-046) — (1) exercise CTRL-ANOMALOUS-TRACE1 at
    bits=20 with a verified anomalous_trace1_certificate and
    C_special=ceil(8*log2(p)); (2) persist a non-empty CTRL_NULL_IT_PLANT edge
    ledger and a live CTRL-NULL-PACKAGING-GATE; (3) emit dominated_by/sota_delta
    on run deliverables; (4) rebind execution_report/manifest provenance; then
    run reserved measure if smoke controls pass, followed by independent
    validate + red-team.

  finding_summary: >-
    THIS EXACT next_action WAS ALREADY EXECUTED, in this same working tree,
    before this design gate began, and its outcome was already superseded by
    two further official Coordinator decisions. ledger/goals/GOAL-ECDLP-001/
    goal.yaml's current_batch_id (BATCH-046) and next_action (sourced from
    DEC-20260803-004) are STALE. Opening a fresh Executor task to redo (1)-(4)
    plus reserved measure would duplicate already-completed, already-superseded
    work and would silently re-open a subgoal (SG-ECDLP-002) that a later,
    still-standing Coordinator decision paused with a named, unmet resume
    condition. This batch does not dispatch that Executor task. It records the
    finding, its evidence chain, and a scoped recommendation, and leaves
    GOAL-ECDLP-001's status, current_batch_id, and next_action fields
    untouched, per this task's own constraint.

  staleness_precedent: >-
    This is not a novel observation. Two other coordinator sessions already
    found and documented the same goal-head staleness without editing
    goal.yaml in place: ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-9c41dd.yaml
    and ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-a83850.yaml. The latter's
    goal_head_note reads verbatim: "ledger/goals/GOAL-ECDLP-001/goal.yaml is
    DELIBERATELY NOT MODIFIED by this archive, for the same reason recorded at
    BATCH-9c41dd's checkpoint: its head is stale (current_batch_id BATCH-046)
    relative to BATCH-121..124 merged from other sessions, through no action of
    this batch." This batch's finding is a third, independent confirmation,
    specific to the IT-001 / SG-ECDLP-002 thread named in the stale
    next_action, tracing it forward to its actual, current disposition.

  evidence_chain:
    - step: BATCH-047 (already executed)
      artifacts:
        - ledger/evidence/EV-IT-aefd12.yaml
        - experiments/EXP-IT-001/runs/RUN-IT-001-rc47/manifest.json
        - experiments/EXP-IT-001/runs/RUN-IT-001-rc47/command.txt
        - experiments/EXP-IT-001/runs/RUN-IT-001-rc47/raw-result.json
      text: >-
        RUN-IT-001-rc47 (TASK-20260803-027/028) already executed exactly
        next_action requirements (1)-(4) under frozen PA-IT-001-v3-rc45-repair-5:
        CTRL-ANOMALOUS-TRACE1 closed at bits=20 with a verified Smart anomalous
        certificate (BF-1 CLOSED: p=771853, N=p, trace=1, C_special_smart=157,
        ratio 0.202); the null-plant edge ledger populated (48 rows, BF-2
        CLOSED); the packaging gate exercised and rejecting a synthetic
        R_xfer=0.5 with no certificate (BF-3 CLOSED). Independent Validator
        VAL-20260803-029 returned COMPLETED_VALID_SCOPED. Independent Red Team
        RT-20260803-030 returned FAIL on three NEW formal-compliance defects
        (RT-047-B1: planted-path start violates the nonspecial-start
        requirement; RT-047-B2: run-id/mode outside the frozen amendment;
        RT-047-B3: dirty worktree) and filed a structural observation (O-6):
        trace of Frobenius is an isogeny-class invariant for ordinary curves,
        so rho_special=0 may not be a finite-scale artifact. rho_special=0.0
        measured at all three tested bit sizes (20/24/28).
    - step: BATCH-048 (already executed)
      artifacts:
        - ledger/evidence/EV-IT-511f3d.yaml
        - ledger/decisions/DEC-20260804-2fae6a.yaml
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-048/tasks/TASK-20260804-002/successor_directions.yaml
      text: >-
        TASK-20260804-002 formally resolved RT-047's O-6 by deriving from the
        unconditional Tate isogeny theorem (Tate 1966; Silverman AEC Ch. V
        Thm 3.1) that ordinary F_p-isogenies preserve trace of Frobenius, so
        H-IT-001's three named special families (anomalous, MOV,
        Weil-descent) are isogeny-class invariants: no finite ordinary
        F_p-isogeny path of any length, at any scale, connects a generic
        curve to any of them. rho_special=0 is a mathematical certainty, not
        a measurement outcome. DEC-20260804-2fae6a (decision: reject_scoped
        at mechanism scope) transitioned H-IT-001 specified -> weakened for
        the ordinary-isogeny mechanism against these three families. This
        makes further CTRL-ANOMALOUS-TRACE1 density/measure runs against
        these families scientifically moot: the answer is proved, not merely
        toy-null.
    - step: BATCH-049 through BATCH-053 (already executed)
      artifacts:
        - ledger/decisions/DEC-20260804-760bae.yaml
        - ledger/decisions/DEC-20260804-419e3c.yaml
        - ledger/decisions/DEC-20260804-d0c452.yaml
        - ledger/decisions/DEC-20260804-ea13dc.yaml
        - ledger/decisions/DEC-20260804-fec1e8.yaml
      text: >-
        BATCH-049 dispatched ideation for a revised SG-ECDLP-002 mechanism.
        BATCH-050-053 progressively closed every successor isogeny-based
        proposal (class-group DLP reduction: blocked at specification, h(D)
        << N order mismatch; Elkies ell-isogeny factor-base augmentation:
        H-ICI-063e91 weakened, indistinguishable from a random bijection;
        ordinary isogeny MITM: blocked at both the starting-point and
        key-recovery steps), converging on a named structural obstruction
        (DEC-20260804-fec1e8, BATCH-053): the SCALAR-DOMAIN MISMATCH — the
        ECDLP scalar has order N~p while every ordinary-isogeny-related
        algebraic structure examined (class group, isogeny-class structure)
        has order at most h(D)~sqrt(p). SG-ECDLP-002 (the isogeny-transfer
        subgoal that owns H-IT-001) transitioned active -> paused with an
        explicit, still-unmet resume condition: "a mechanism ... that
        connects the ECDLP scalar ... to a computational structure of order
        > sqrt(p) that admits subexponential DLP." No such mechanism is
        named, proposed, or available to this design gate.
    - step: BATCH-060 frontier rerank and beyond (already executed)
      artifacts:
        - ledger/decisions/DEC-20260804-1f06d6.yaml
        - ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-e0ccb2.yaml
      text: >-
        DEC-20260804-1f06d6 (BATCH-060) independently re-confirms both
        transitions (H-IT-001: weakened; SG-ECDLP-002: paused, listed under
        blocked_directions) in its frontier_rerank block, and redirects the
        goal to unrelated hypotheses (H-GGM-001, H-OIFP-097d1a, Semaev BKK,
        KN-OPEN-009). The most recent located checkpoint,
        ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-e0ccb2.yaml (decision
        DEC-20260806-08b9ed, dated 2026-08-06), continues on entirely
        different threads (H-PSEUDO biconditional, halving-query
        equivalence, x-oracle discrimination, KN-FIND-9d2f56). None of the
        batches after BATCH-053 references H-IT-001, SG-ECDLP-002, or
        PA-IT-001-v3-rc45-repair-5 again.

  scope_decision: >-
    No Executor task is dispatched under PA-IT-001-v3-rc45-repair-5 by this
    batch. Doing so would (a) duplicate work already completed at BATCH-047
    with materially worse formal compliance than that already-completed run
    (RT-047-B1..B3 FAIL, none of which this next_action's four requirements
    would fix, since (1)-(4) were already satisfied at BATCH-047 and it still
    failed red-team on unrelated contract-compliance grounds); (b) re-run a
    measurement whose outcome is already settled by an unconditional theorem
    (Tate 1966; EV-IT-511f3d) rather than left open; and (c) violate the
    still-standing pause condition on SG-ECDLP-002 (DEC-20260804-fec1e8)
    without satisfying its named, explicit resume condition. This would spend
    Executor budget on already-decided science and would contradict two later,
    official, committed Coordinator decisions without a new record superseding
    them — exactly the invented/duplicated-result and unbounded-exploration
    failure modes agents/coordinator.md's "Prohibitions" and "Decision
    checklist" (Q1: "What exact uncertainty will this reduce?") forbid.
    H-IT-001 remains weakened; SG-ECDLP-002 remains paused. This batch
    authors no coordinator_decision and changes no hypothesis or sub-goal
    status: the finding here is procedural (a stale goal-head pointer), not a
    new hypothesis result, and reconciling a pointer is a distinct action
    from re-deciding science that is already decided.

  ranked_task_list_against_next_actions_four_requirements:
    - requirement: "(1) exercise CTRL-ANOMALOUS-TRACE1 at bits=20 with verified anomalous certificate and C_special=ceil(8*log2(p))"
      status: already_satisfied
      evidence: EV-IT-aefd12 O-2 (BF-1 CLOSED)
    - requirement: "(2) persist a non-empty CTRL_NULL_IT_PLANT edge ledger and a live CTRL-NULL-PACKAGING-GATE"
      status: already_satisfied
      evidence: EV-IT-aefd12 O-2 (BF-2, BF-3 CLOSED)
    - requirement: "(3) emit dominated_by / sota_delta on run deliverables"
      status: already_satisfied
      evidence: EV-IT-aefd12 (dominated_by / sota_delta fields present)
    - requirement: "(4) rebind execution_report/manifest provenance to the current batch/task IDs"
      status: superseded_moot
      evidence: >-
        Satisfied in substance for BATCH-047 (manifest under
        experiments/EXP-IT-001/runs/RUN-IT-001-rc47/); moot for any further
        run because the underlying mechanism is now proven infeasible
        (EV-IT-511f3d), not merely awaiting a clean provenance rebind.
    - requirement: "reserved measure if smoke controls pass"
      status: superseded_moot
      evidence: >-
        Smoke did not cleanly pass (RT-047 FAIL on RT-047-B1..B3), and
        independently the measure's target quantity (rho_special for
        anomalous/MOV/Weil-descent transfer) is now a proven zero
        (EV-IT-511f3d), not an open empirical question a measure run would
        resolve.
    - requirement: goal-head reconciliation (not one of the four named requirements, but the true prerequisite this design gate identifies)
      status: recommended_not_dispatched_here
      task_id: "<PENDING-MINT: TASK-20260807-XXXXXX>"
      reason: >-
        Reconciling ledger/goals/GOAL-ECDLP-001/goal.yaml's current_batch_id
        and next_action against a chain this large (120+ batches, multiple
        sub-goals, multiple concurrent sessions, at least one other still-open
        parallel goal referenced in passing — GOAL-ICEX-001) is outside this
        design gate's read/write scope and this task's own constraint against
        changing current_batch_id/next_action. It also risks exactly the
        "resolve a sync conflict by editing a record" violation AGENTS.md
        forbids if done hastily by a session that has not read every
        checkpoint. This batch instead hands the finding back to the
        orchestrating session with a precise recommendation (see
        SCOPE-DECISION.md) to dispatch a dedicated reconciliation task.

  not_dispatched_note: >-
    This batch's dispatch_queue.json intentionally contains no Executor task
    card, a deliberate and reasoned deviation from a literal instruction to
    include one. It is flagged here explicitly, with full rationale, rather
