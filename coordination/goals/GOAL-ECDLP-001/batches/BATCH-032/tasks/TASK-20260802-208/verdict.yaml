acquisition_boundary:
  augmented_input_leaks_usable_generic_information: true
  leak_mechanism: "The A handle introduces x^d into the generic-label span and permits multiplicative scalar-action collisions."
  ordinary_input_generic_labels: "a+bx"
  ordinary_sub_rho_acquisition_established: false
  balanced_generic_acquisition_objection: "A fixed affine output equals x^d on at most d field values, while an informative affine collision is rho-scale at constant probability."
  non_generic_sources_excluded: false
