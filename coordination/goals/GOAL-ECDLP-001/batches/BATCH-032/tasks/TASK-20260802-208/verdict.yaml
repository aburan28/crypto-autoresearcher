decisive_findings:
  - id: RT-208-F1
    severity: major
    finding: "A Pollard kangaroo/rho vectorization on each of the same two scalar-action torsors has time exponent tau and memory exponent 0. It dominates the table MITM row, invalidating dominated_by:null and the +tau memory sota_delta."
    required_revision:
      - add_low_memory_two_stage_row
      - mark_table_MITM_dominated
      - mark_augmented_rho_ignoring_A_dominated_for_0_lt_delta_lt_1
      - set_corrected_memory_sota_delta_to_zero

  - id: RT-208-F2
    severity: major
    finding: "APR-206 is reconstructable without an untyped operation, but exact domain coverage requires a certified primitive scalar g in F_N^* or equivalent certified generators. The tuple (P,Q,A,d) does not supply this setup."
    required_revision:
      - add_generator_and_order_certificate_to_input_contract
      - or_charge_generator_construction_and_factorization_as_preprocessing

  - id: RT-208-F3
    severity: moderate
    finding: "Each general known-scalar action costs O(log N) elliptic-curve additions. The exact bound is soft-O(sqrt((N-1)/d)+sqrt(d)), although the claimed exponent tau survives."
    required_revision:
      - replace_literal_O_group_operation_claim
      - include_scalar_index_hash_and_point_storage_bits

  - id: RT-208-F4
    severity: major_for_any_ordinary_input_claim
    finding: "From P and Q alone, generic group operations preserve affine scalar labels a+bx. Producing x^d P is nonlinear; no charged sub-rho acquisition route is supplied."
    required_revision:
      - define_a_as_total_expected_correct_acquisition_cost
      - retain_augmented_input_only_scope
      - require_a_typed_non_generic_or_oracle_source_before_any_ordinary_claim

  - id: RT-208-F5
    severity: moderate
    finding: "One encoded curve point costs Theta(log p) bits unless log p=Theta(log N) is an explicit family assumption."
    required_revision:
      - correct_auxiliary_bit_accounting_or_add_family_assumption

  - id: RT-208-F6
    severity: gate
    finding: "The balanced d=N^(1/2+o(1)) divisor family is not exhibited; the one-quarter row remains conditional."
    required_revision:
      - supply_and_certify_a_concrete_family_before_realized_SOTA_language

