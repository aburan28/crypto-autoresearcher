narrowest_supported_statement: >-
  The fixed-field named-weakness barrier and the exact quotient correction
  survive in their stated scope. Conditional on the two numbered quotient
  heuristics, an omitted uniform M-fiber gives total exponent
  gamma+(1+delta)/2. On the stronger augmented contract, and with certified
  scalar generators, the two exact scalar-action domains do yield a
  N^(tau+o(1)) recovery algorithm. This is not an ordinary-ECDLP improvement,
  and the committed table row is not Pareto-optimal.

cheapest_falsification_control:
  candidate: "Check the two explicit collision congruences and the four typed point invariants in red-team-report.md; any failure falsifies APR-206."
  ordinary_acquisition: "Prove the affine generic-label invariant and its collision bound before allowing an acquisition exponent a<1/2."
  balanced_row: "Require a certified target family with both d and (N-1)/d equal to N^(1/2+o(1))."

