  explicit_b1_b2_attack_answers:
    Q1_can_midband_full_eligible_mean_still_force_thr_TAIL_0: 'NO — not as the expected outcome
      at declared (n,X). Atom-saturation of fixed-k extremes required E[cheapest eligible
      atom] ≫ k. Full-set mean sets k_eff = |S_elig|, so that overrun cannot occur by construction.
      At bits≈16 (X=p^2 with p=65521): B_5=84, B_4=255, 31 band primes, E_elig≈3.3e3 (Mertens),
      observed |S_elig|≈2.9e3; 50/50 cal replicates had tau>0 (min≈7e-7, max≈5.6e-4); thr-like
      high OS > 0. At bits≈20 (p=1048573): B_5=255, B_4=1023, 118 band primes; same pattern
      (0/50 tau==0). Negative control: fixed k=8 extremes on the SAME mid-band still collapses
      20/20 onto the cheapest atom (89 at bits-16, 257 at bits-20) — confirming the contract
      correctly forbids that substitution.'
    Q2_GATE_TAIL_NONVACUOUS_and_HEUR_anti_promotion_retained: 'YES. GATE-TAIL-NONVACUOUS requires
      thr_TAIL>0, max(tau)>0, not all-tau identical at 0, and discriminating reject_rule;
      failure → M-INSTRUMENT, forbids M-SUPPORT. HEUR_DS_1_anti_promotion retained verbatim
      in spirit: no branch may be equated with HEUR-DS-1 validated/supported/discharged; M-SUPPORT
      heuristic_verdict is instrument_pass_at_toy_cells_only with explicit forbids_reading_as.
      TOY TIER ONLY; no STR/DEP reopen; no HEUR-DS-1 promotion in this gate batch.'
    Q3_execute_admissible: 'YES — recommend Coordinator may authorize measurement execute
      of EXP-SMTH-c83476 at claim_tier toy, contingent on independent validator PASS (TASK-20260803-795ad7)
      and a Coordinator execute decision. Do NOT execute EXP-SMTH-9d04ba. Cheapest post-authorize
      falsifier: after CAL-NULL-X commits, verify thr_TAIL>0 at both bit sizes; if thr_TAIL==0,
      GATE forces M-INSTRUMENT (integrity retained even under surprise vacuity).'
    Q3_cheapest_remaining_falsifier_if_PASS: 'Pre-exec (already run here): synthetic uniform
      LPF draws at n=130816; compute mid-band full-set mean T; confirm tau cloud has positive
      spread (50/50 both bit sizes). Post-CAL falsifier: archived tau_1..tau_200 must satisfy
      GATE-TAIL-NONVACUOUS; thr_TAIL==0 → M-INSTRUMENT, not M-SUPPORT. Mutation control: replace
      T by mean of 8 smallest mid-band z → expect thr_TAIL=0 (already 20/20 collapses) — if
      an implementation silently reintroduces fixed-k, GATE-ATOM-ESCAPE / M-0 must fire.'
