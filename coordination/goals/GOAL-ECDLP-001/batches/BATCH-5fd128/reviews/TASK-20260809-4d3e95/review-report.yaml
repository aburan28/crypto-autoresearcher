  predecessor_experiment_id: EXP-ECDLP-f77b0c
  recorded_at: '2026-08-09'
  role: validator
  verdict: REVISE
  verdict_scope: >-
    Design readiness only, for a review-required, unfrozen, unapproved,
    non-executable, evidence-ineligible nonexperimental serializer-design
    successor whose only possible downstream effect is to be considered for a
    separate future executable-contract gate. This is not a verdict on an
    experiment result, a serializer implementation, a scientific hypothesis, a
    cryptanalytic claim, or any ECDLP evidence, and it authorizes nothing.
  verdict_rationale: >-
    The repair that VAL-E93546-CASE-IDENTITY-001 demanded is delivered and
    independently reproduces exactly. All 112 registry rows, all 112 seed
    preimages and digests, every identity tuple, ordinal, position, count,
    canonical row encoding, registry header, 112 leaves, static registry root,
    canonical registry file bytes/blocks/digest, canonical pass and maximally
    rejected manifest sizes, and the entire metadata budget reconciliation were
    rebuilt from the frozen bytes and matched to the digit. All 42 of the 52
    predecessor top-level fields that carry passing serializer mechanics are
    deep-equal after strict parse, and the 10 that differ are exactly the
    identity, lifecycle, seed-domain, artifact-path, and review-routing
    adjustments a versioned successor requires. Readiness nevertheless fails
    because the repair introduces one mandatory canonical field,
    artifact_sha256, and one mandatory artifact class,
    artifacts/cases/<case_id>.bin, whose content is defined nowhere in this
    specification, the predecessor, the proposal, or the repository. That value
    feeds every result_leaf_i and therefore result_root, so two implementations
    that fully obey the frozen grammar produce byte-distinct canonical result
    manifests with identical byte and block counts. This is the same
    two-manifest commitment ambiguity that VAL-E93546-CASE-IDENTITY-001 closed
    for case identity, reinstated one layer up at artifact identity, and no
    declared control detects it. The same undefined artifact also leaves the
    preserved 268435456-byte retained-artifact cap unreconciled against 112 new
    mandatory artifacts; under one admissible reading the design is infeasible
    by 16.8x. A versioned successor must define artifact content and reconcile
    the retained-artifact budget before an executable contract can be written.

