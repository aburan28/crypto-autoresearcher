  findings:
    - id: VAL-4D3E95-ARTIFACT-IDENTITY-001
      severity: blocking_at_design_readiness_scope
      disposition: REVISE
      title: >-
        Per-case artifact content is undefined, so artifact_sha256 and
        therefore every result leaf and the result root are underdetermined
      evidence:
        - >-
          canonical_registry_and_result_manifest.future_result_manifest.case_result_field_order
          lists artifact_sha256 as field index 11 of every canonical case_result
          record, so its value is inside the preimage of result_leaf_i.
        - >-
          future_result_commitment_formula derives result_root from all 112
          result leaves, so artifact_sha256 propagates into the result root and
          into the footer.
        - >-
          per_case_rules.artifact_path fixes only the path,
          artifacts/cases/<literal case_id>.bin, and
          per_case_rules.artifact_sha256 fixes only that the value is 64
          lowercase hex bytes "of that artifact".
        - >-
          The bytes that belong in that file are specified nowhere. A
          repository-wide search finds exactly two occurrences of
          artifacts/cases, both in this specification, and both are path or
          binding statements. The predecessor specification, its
          required_artifacts_if_later_authorized list, and the source proposal
          IDEA-20260809-7f2d9c contain no definition.
        - >-
          By contrast the sibling field observed_sha256 is fully determined:
          it is the digest of the case's future serializer message, which the
          preserved predecessor construction fixes exactly.
      cheapest_falsification: >-
        Two implementations both obey every frozen byte of the grammar. One
        writes the case's canonical serializer message to the .bin file; the
        other writes a small per-case summary record. I constructed both for
        registry row 20 and confirmed that the canonical case_result length is
        identical at 606 bytes under either reading, so every declared byte
        count, block count, file size, and sizing digest is unchanged, while
        result_leaf_20 differs (067ba3e6125dd795b7c198c0d3505ebd92f2009a98e2d967fead4da0d9808871
        versus a70bca3baef6850188f386941f95b70680e6c6427c1d05829a1de9f105b54b7b)
        and the result root therefore differs. Two byte-distinct canonical
        manifests both pass every declared check.
      why_no_declared_control_catches_it: >-
        CTRL-TWO-MANIFEST-AMBIGUITY tests a field-reordered alias manifest, not
        a content-divergent one. CTRL-OUTPUT-SENTINEL-MISUSE only bars the two
        reserved placeholder values, and both readings produce a real digest.
        Every sizing and block control is invariant under the ambiguity because
        the canonical record length is identical. R4-RESULT-PARSE and
        R5-RESULT-COMMITMENT check structure and self-consistency, not artifact
        semantics.
      relation_to_the_repaired_finding: >-
        This is the same failure mode as VAL-E93546-CASE-IDENTITY-001, whose
        cheapest falsification was likewise two prose-conformant manifests with
        different commitment bytes, relocated from case identity to artifact
        identity. The repair closed the case layer exactly and opened the
        artifact layer.
      impact: >-
        No serializer byte, frozen digest, archive total, certificate mapping,
        registry row, seed, registry root, budget arithmetic, or claim boundary
        is contradicted, and the entire registry repair stands. What is blocked
        is the assertion that this design is ready to feed a separate future
        executable-contract gate: an executable contract cannot be written from
        these bytes without a choice that changes the result root.
      required_versioned_successor:
        - Allocate a fresh immutable experiment successor id with a random six-hex suffix; do not edit or remap EXP-ECDLP-6dbb4c or EXP-ECDLP-f77b0c.
        - >-
          Freeze the exact content of artifacts/cases/<case_id>.bin as a
          canonical grammar with declared field order, encoding, and length
          rule, in the same style as the registry and manifest records, or
          alternatively bind artifact_sha256 to an already-determined value and
          state that binding explicitly.
        - >-
          State whether the artifact for a canonical or archive-zero case is
          the serializer message itself, in which case record that
          artifact_sha256 equals observed_sha256 for those cases and say so, or
          a distinct record, in which case give its grammar.
        - >-
          Add a content-divergence control alongside CTRL-TWO-MANIFEST-AMBIGUITY
          that holds field order fixed and varies artifact content, with the
          expected disposition SECOND_MANIFEST_REJECTED.
    - id: VAL-4D3E95-RETAINED-ARTIFACT-BUDGET-002
      severity: blocking_at_design_readiness_scope
      disposition: REVISE
      title: >-
        112 newly mandated per-case artifacts are never reconciled against the
        preserved 268435456-byte retained-artifact cap
      evidence:
        - >-
          successor_required_future_artifacts newly requires per-case artifacts
          at exact artifacts/cases/<case_id>.bin paths with SHA-256 bindings,
          and registry_manifest_stage_order.presemantic_commitment_gate makes
          per-case artifact bindings a precondition of G6 completion.
        - >-
          stage_budget.maximum_retained_artifact_bytes is preserved unchanged
          from the predecessor at 268435456 bytes, that is 256 MiB.
        - >-
          canonical_metadata_and_budget_reconciliation reconciles only logical
          SHA-256 input bytes. Its justification asserts that "no wall, CPU,
          memory, retained-artifact, worker, run-package, or network cap is
          widened", which is true of the cap value but performs no feasibility
          check of the new artifact class against it.
        - >-
          Under the reading in which the artifact is the case's canonical
          serializer message, the 112 artifacts total 4514247043 bytes, that is
          16.8 times the entire cap, and six individual cases each exceed the
          whole cap on their own: CASE-ARCHIVE-ZERO-010-WRITE and its
          verification pass at 805208128 bytes each, which is 3.00 times the
          cap, CASE-ARCHIVE-ZERO-001-WRITE and its verification pass at
          742993984 bytes each, and CASE-ARCHIVE-ZERO-039-WRITE and its
          verification pass at 325591104 bytes each.
        - >-
          Under the reading in which the artifact is a small per-case record,
          112 artifacts of 4 KiB total 458752 bytes and consume well under one
          percent of the cap.
      cheapest_falsification: >-
        Compute the sum and maximum of the 112 per-case message sizes from the
        preserved predecessor tables and compare with
        maximum_retained_artifact_bytes. Under one admissible reading the
        design is infeasible before any code is written; under the other it is
        trivially feasible. The frozen bytes do not decide which, so the
        retained-artifact budget is not derivable from the design.
      impact: >-
        This is the resource consequence of VAL-4D3E95-ARTIFACT-IDENTITY-001
        and shares its root cause, but it needs a separate repair because
        defining artifact content does not by itself reconcile the budget. It
        contradicts no measurement and no scientific claim; it blocks only the
        readiness assertion, because the preserved stopping rule "Stop on wall,
        CPU, memory, retained-artifact, logical-byte, or run-package cap
        exhaustion" would fire on the very first archive case under one reading.
      required_versioned_successor:
        - >-
          After fixing artifact content, add an explicit retained-artifact
          reconciliation next to the existing logical-byte reconciliation,
          giving total retained bytes, the largest single retained artifact,
          and the headroom against 268435456.
        - >-
          If the intended artifacts genuinely exceed the cap, do not silently
          widen it: record an explicit, reasoned cap amendment in the successor
          with its own arithmetic, or narrow the artifact requirement, for
          example by retaining a digest plus a bounded excerpt for the large
          archive cases and saying exactly what is retained.

  nonblocking_findings:
    - id: VAL-4D3E95-OVERHEAD-RECONCILIATION-003
      result: REVISE_NONBLOCKING
      severity: internal_inconsistency_no_cap_effect
      statement: >-
        The same named quantity is stated twice with two different values.
        preserved_construction_receipt.adjustments records "prospective
        metadata hashing overhead" as 308391 logical SHA-256 input bytes, which
        I recomputed as exactly the conformance-pass total. The authoritative
        canonical_metadata_and_budget_reconciliation.prospective_cap_reconciliation
        records 311079, which I recomputed as exactly the maximally rejected
        total, and explicitly declares overhead_basis as the maximum manifest
        with all 112 case results rejected. The two figures differ by 2688
        bytes.
      assessment: >-
        Not blocking. The binding reconciliation uses the larger, conservative
        figure, the cited arithmetic 4514247043+311079=4514558122<=4600000000
        is exact, headroom 85441878 is exact, and cap_change_bytes is 0. The
        receipt row understates worst-case overhead by 2688 bytes without
        affecting any gate. A successor should restate the receipt row on the
        same worst-case basis or label it explicitly as the pass-case figure.
    - id: VAL-4D3E95-NEGATIVE-VARIANT-ORDER-004
      result: REVISE_NONBLOCKING
      severity: inherited_residual_of_the_same_defect_class
      statement: >-
        The preserved independent_variables field declares five fixed control
        variants: canonical, reserved-byte-invalid, slot-alias-invalid,
        excluded-mutation, and included-mutation. The 112-row registry
        enumerates only the first, fourth, and fifth; every row carries
        expected_acceptance true and the registry contains no rejection case.
        The reserved-byte-invalid and slot-alias-invalid variants therefore
