batch:
  id: BATCH-278705
  goal_id: GOAL-ECDLP-001
  opened_by: coordinator
  opened_at: '2026-08-04'
  status: control_plane_ready_for_snapshot
  authorizing_decision: DEC-20260803-004
  objective: >-
    Determine through a bounded, non-execution design and independent review
    whether a versioned successor amendment can cure RC-45's immutable
    path/provenance collision while preserving the live controls required by
    DEC-20260803-004. This batch creates no amendment, implementation, run,
    evidence, decision, approval, freeze, execution authorization, hypothesis
    transition, cryptanalytic result, asymptotic result, or goal-completion claim.
  claim_ceiling: >-
    Design-stage process evidence only. No ECDLP attack, solve, relation,
    transfer, HEUR-ISO-1, cost, asymptotic, cryptographic-scale, or completion claim.
  uncertainty: >-
    Whether PA-IT-001-v3-rc46-repair-6 can be proposed with fresh, reproducible
    run/output/provenance paths and the DEC-20260803-004 live controls, without
    changing an immutable RC-45 artifact.
  proof_search_map:
    applicable: false
    reason: >-
      This is a non-execution protocol-amendment design and review task, not a
      proof-oriented proposal, theorem, asymptotic bound, certificate family,
      reduction, or closure argument.
  max_concurrent: 2
  active_critical_lanes: 1
  active_lane:
    id: PA-IT-001-v3-rc46-repair-6-design
    owner_task: TASK-20260804-bfe0d0
    decisive_evidence: >-
      A snapshot-archived proposed amendment and independently recorded Reviewer
      and Red Team verdicts on path freshness, provenance, anomalous trace-1
      certification, null-edge ledger, live packaging gate, Pareto fields, and
      smoke-before-measure gating.
    inconclusive_decision: >-
      Record only design-stage evidence and a revise decision; admit no Executor.
    rerank_trigger: >-
      The final ledger archive records both actual review verdicts and one of
      the pre-registered positive, revise, or inconclusive branches.
    peripheral_exclusions:
      - Any Executor task, implementation change, Sage invocation, or experiment run.
      - Any edit to PA-IT-001-v3-rc45-repair-5 or its historical run/output/provenance paths.
      - Any hypothesis-status, evidence-strength, cryptanalytic, asymptotic, or completion conclusion.
  resource_estimate:
    wall_clock_seconds: 13500
    cpu_hours: 4.75
    maximum_memory_gb: 4
    maximum_runs: 0
    dominant_cost: Independent design review.
    stop_rule: >-
      Stop at the first missing snapshot, unresolved review gate, unavailable
      required policy, or revise/inconclusive verdict; no Executor is admitted.
    stages:
      - id: control_plane
        purpose: Produce the bounded opening records.
        wall_clock_seconds: 1800
        cpu_hours: 0.5
        maximum_memory_gb: 2
      - id: control_snapshot
        purpose: Hash-bind the opening control plane before amendment authoring.
        wall_clock_seconds: 900
        cpu_hours: 0.25
        maximum_memory_gb: 2
      - id: amendment_authoring
        purpose: Propose only the versioned amendment and its design plans.
        wall_clock_seconds: 5400
        cpu_hours: 1.5
        maximum_memory_gb: 4
      - id: amendment_snapshot
        purpose: Hash-bind the proposed amendment before independent review.
        wall_clock_seconds: 900
        cpu_hours: 0.25
        maximum_memory_gb: 2
      - id: independent_reviews
        purpose: Run Reviewer and Red Team design reviews in parallel.
        wall_clock_seconds: 3600
        cpu_hours: 2
        maximum_memory_gb: 4
      - id: ledger_archive
        purpose: Archive only actual review verdicts and the design-stage disposition.
        wall_clock_seconds: 900
        cpu_hours: 0.25
        maximum_memory_gb: 2
  outcome_branches:
    positive: >-
      If both independent reviews pass every amendment-design gate, the ledger
      archive may record a narrow design-stage approval to open a later,
      separately allocated Executor-admission batch. It does not authorize an
      Executor in this batch and makes no run or mathematical claim.
    revise: >-
      If either review finds a specific repairable amendment-design defect, the
      ledger archive records the actual verdict and a revise disposition. No
      Executor is admitted; a new versioned amendment cycle requires new task
      identifiers and a new snapshot/review chain.
    inconclusive: >-
      If the proposed amendment or either independent review is incomplete,
      ambiguous, or policy-unavailable, the ledger archive records only that
      design-stage limitation and a non-execution disposition. No Executor is
      admitted and no negative mathematical inference is made.
  archive_claim_map:
    TASK-20260804-cb6de3: TASK-20260804-533c6c
    TASK-20260804-bfe0d0: TASK-20260804-fdc6d7
    TASK-20260804-af8ec2: TASK-20260804-79506c
    TASK-20260804-889042: TASK-20260804-79506c
  next_action: >-
    Run TASK-20260804-533c6c alone to snapshot the control plane. No author,
    review, ledger archive, or Executor task is eligible before that snapshot
    is post-commit verified.
