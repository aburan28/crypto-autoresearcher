  construction_notes: >-
    Implemented affine Weierstrass addition over F_p in this task
    directory only: identity is None; P+(-P)=O; doubling uses
    lambda=(3x^2+A)/(2y); mixed addition uses lambda=(y2-y1)/(x2-x1);
    all arithmetic mod p=47237. Verified S=(2,97) lies on
    y^2=x^3+A x+B. Walked P_0=O, P_{k+1}=P_k+S for k=0..n-1.
    The walk returned to O after exactly n steps, hit no earlier
    identity, and produced no off-curve affine points. Label rule:
    k=0 (identity) gets 0; otherwise v(k)=min((x*s)//p, s-1) with
    s=2, so affine x in 0..p-1 maps to {0,1}. Fiber sizes counted
    from the length-n label vector and sum to n. Exact N[a,b,c]
    was obtained by batched integer pairwise sums: for each label
    pair (a,b) and each k in A_a, increment the c-bin of
    v[(k+ell) mod n] over ell in A_b. A length-n numpy.fft circular
    convolution of the 0-1 indicator vectors was run as a
    cross-check; integer bins were recovered by rounding, with
    max |conv residual| about 2.5e-11, and the recovered cells
    agreed with the integer counts. N cells sum to n^2=2214361249.
    Each (a,b) row sums to |A_a|*|A_b|. pair_count is the sum of
    max_c N[a,b,c] over the four (a,b) pairs, equal to 1109321718.
    gcd(1109321718, 2214361249)=47057, so q_maj=23574/47057 in
    lowest terms (gcd(23574,47057)=1). Parameter r=1 was recorded
    as stated and does not enter the F_p x-bucket formula. No
    producer module was imported. ADV and D were not interpreted.
    No comparison to any other implementation was made.

