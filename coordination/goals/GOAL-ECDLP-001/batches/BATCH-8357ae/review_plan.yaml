    assigned_to: TASK-20260907-5874ee

  blind_rederivation:
    required: true
    quantity: >-
      Exact q_maj of the plain F_p x-coordinate interval bucket
      at image size s=2 on the prime-order instance S1-a. Curve
      y^2 = x^3 + A x + B over F_p with p=47237, A=31367,
      B=41141, prime order n=47057, generator S=(2,97). Walk
      P_k = [k]S in E(F_p) for k=0..n-1. The identity (k=0) has
      no affine x; assign label 0. Otherwise let x be the affine
      x-coordinate in 0..p-1 and set v(k) = min((x * s) // p,
      s-1). Then q_maj is the f558e4 majority: with N[a,b,c] the
      number of (k,ell) in {0,...,n-1}^2 such that v(k)=a,
      v(ell)=b, and v((k+ell) mod n)=c, q_maj = (1/n^2) *
      sum_{a,b} max_c N[a,b,c]. Report q_maj as an exact
      rational in lowest terms. Do not read the producer
      implementation, S3 or S4 raw-results, or the sibling
      validator report. Do not interpret ADV or D.
    parameters:
      instance_id: S1-a
      p: 47237
      A: 31367
      B: 41141
      n: 47057
      S: [2, 97]
      r: 1
      s: 2
      statistic: COMPARATOR_x_bucket
      identity_label: 0
    blind_from:
      - experiments/EXP-ECDLP-a98ea9/implementation/stage4.py
      - experiments/EXP-ECDLP-a98ea9/implementation/stage3.py
      - experiments/EXP-ECDLP-a98ea9/implementation/qmaj.py
      - experiments/EXP-ECDLP-a98ea9/execution-report-stage4.yaml
      - experiments/EXP-ECDLP-a98ea9/execution-report-stage3.yaml
      - experiments/EXP-ECDLP-a98ea9/runs/RUN-ECDLP-a98ea9-S4/
      - experiments/EXP-ECDLP-a98ea9/runs/RUN-ECDLP-a98ea9-S3/
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-8357ae/reviews/TASK-20260907-5874ee/
    assigned_to: TASK-20260907-f5f3ec
