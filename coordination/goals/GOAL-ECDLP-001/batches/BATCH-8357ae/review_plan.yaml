      - >-
        A mechanical INCONCLUSIVE row on T2_legendre, which is
        not LEAD and is not D2 closure.
      - >-
        A reading that would authorize Stage 5 from this package.
    failure_signature: >-
      An argument that supports H, closes D2, classifies T2 as
