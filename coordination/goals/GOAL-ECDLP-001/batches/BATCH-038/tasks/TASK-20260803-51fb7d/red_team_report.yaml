  claim_under_review: >-
    That RUN-SMTH-71b1b0-001 satisfies the frozen success predicate of
    EXP-SMTH-71b1b0 at both field sizes with all four blocking controls passing,
    and that the corresponding contract branch is SUPPORT_AT_TOY_SCALE with
    disposition "support, strength preliminary, claim tier TOY".

  what_i_do_not_dispute:
    - >-
      The measurement itself. The run package is complete, deterministic, and
      internally consistent. I re-read the six committed arm arrays and
      independently recomputed KS2-DS-1 as 0.0020945450 (bits16) and
      0.0026296477 (bits20); both match the manifest to ten digits.
    - >-
      The pipeline is not a fake. verify_run.py V4 re-derives N_ij end to end
      from the (i,j) enumeration - Vieta invariants, then ENC-B as
      N = e1*p + e2 + 1 - and re-factors 400 records per arm by pure trial
      division with zero mismatches. An "the encoder never ran" attack fails.
    - >-
      The arithmetic of the frozen thresholds. I recomputed each from the
      declared inputs. 1.63*sqrt(2/130816) = 0.0063734146 (frozen 0.006373);
      max(0.05, 1.63/sqrt(130816)) = 0.05; 100*rho(6)/rho(2) = 0.0064038
      (frozen 0.006404). No threshold was recomputed or moved after the datum.
    - >-
      The claim discipline of the BATCH-038 coordination artifacts. I searched
      SCOPE-DECISION.md, INPUT-CAPSULE.md, the task cards, the archive receipt,
      the goal notes and the run manifest for a sentence reading past TOY TIER
      and did not find one. See objection RT038-O4 for the one sentence that
      does, which is inside the frozen contract and not in the batch artifacts.
    - >-
      That a conditional, scoped, toy-tier distributional result is worth
      having. Nothing below rejects this run for being small or for being
      conditional.

  headline: >-
    THE PROBLEM IS NOT THE MEASUREMENT, IT IS WHAT THE MEASUREMENT CAN
    DISTINGUISH. I ran the null-object control that the contract does not
    contain - the identical pipeline on a factor base of 512 elements NONE of
    which is an x-coordinate of a point of E(F_p) - and it passes the entire
    frozen success predicate at both field sizes. The single structural feature
    that makes this object a half-arity Semaev partial map on the curve
    contributes nothing the predicate can see. Under docs/inventor-protocol.md
    section 3 that makes the reported outcome a CONTROLLED NULL rather than a
    finding, and the honest disposition is `inconclusive_uninformative`, not
    `support`.

  objections:

    - id: RT038-O1
      severity: critical
      title: The null object of the same shape was never run, and when run it passes.
      target: success_criterion, outcomes.SUPPORT_AT_TOY_SCALE, DEC-20260803-155a86 rationale
      obligation_cited: >-
        docs/inventor-protocol.md section 3 (controls before belief) and
        AGENTS.md "Inventor protocol" - any reported signal is an artifact until
        the identical measurement has been run against a null object of the same
        shape. NULL-UNIF-D is a null for the ENCODING's codomain. It is not a
        null for the OBJECT. No arm in this contract varies the thing that makes
        the object a Semaev half-arity partial map on E(F_p).
      what_i_did: >-
        Red-Team exploratory control CTRL-RT-OFFCURVE. I replaced the on-curve
        factor base with 512 distinct elements x of F_p for which x^3 + a x + b
        is a quadratic NON-residue, so that not one of them is the x-coordinate
        of a point of E(F_p). Everything else is byte-identical to the run - the
        same p, a, b, the same s3_invariants Vieta coefficients from the run's
        own smth71b1b0_core, the same ENC-B, the same factor_complete, the same
        ks_two_sample_int, and the run's OWN committed NULL-UNIF-D arrays as the
        null.
      result_bits16:
        ks2_vs_committed_null: 0.00363105
        frozen_threshold: 0.006373
        passes: true
        tail_diff: 0.0017353
        tail_threshold: 0.01
        decay_ratio_u6_over_u2: 0.00041065
        decay_threshold: 0.006404
        decay_fires: false
      result_bits20:
        ks2_vs_committed_null: 0.00171997
        frozen_threshold: 0.006373
        passes: true
        tail_diff: -0.0004739
        tail_threshold: 0.01
        decay_ratio_u6_over_u2: 0.00034618
        decay_threshold: 0.006404
        decay_fires: false
      secondary_variant: >-
        An unconstrained variant (512 uniform elements of F_p, of which 250/512
        and 267/512 happened to be on-curve) also passes, at KS2 0.00240032 and
        0.00234681.
      consequence: >-
        An object that is not the object under study satisfies the whole frozen
        predicate, at both field sizes, with margins comparable to the
        treatment's own (0.0021 and 0.0026). Therefore "criterion met" carries
        no information about whether the sampled object is a half-arity Semaev
        partial map on the factor base of E(F_p). It is information about ENC-B
        composed with a generic algebraic map on F_p x F_p.
      why_this_was_predictable_before_compute: >-
        ENC-B is the bijection [0,p) x [0,p) -> [1,p^2] given by
        N = e1*p + e2 + 1, and NULL-UNIF-D is uniform on exactly [1,p^2]. So the
        test is, identically, an equidistribution test for the pair (e1,e2) in
        F_p x F_p, read through the lossy statistic LPF. Any quasi-random
        algebraic map into F_p x F_p passes it. This is a lossy-projection
        failure of the kind docs/inventor-protocol.md exists to catch, and the
        apparatus does produce the null by construction for a very wide class of
        objects.
      what_this_does_NOT_say: >-
        It does not say the run is wrong, that the measurement is invalid, or
        that HEUR-DS-1 is false. It says the predicate does not discriminate.
        A defender may fairly answer that HEUR-DS-1 is a high-prior statement
        and confirming it is still worth something. I accept that answer and it
        is exactly why the disposition should be a low-information pass, not
        `support`.
      reproduction: >-
        Deterministic. Factor bases drawn from a SHA256 counter-mode stream keyed
        "redteam:offcurve:bits16" and "redteam:offcurve:bits20", rejection-
        sampling x < p with legendre(x^3+ax+b) == -1 until 512 distinct values,
        sorted ascending; p,a,b taken from manifest inputs.constructed_instances;
        invariants via smth71b1b0_core.s3_invariants, encoding via
        smth71b1b0_core.enc_b, LPF via smth71b1b0_core.factor_complete, KS2 via
        smth71b1b0_core.ks_two_sample_int against the committed
        arms/NULL-UNIF-D.bits{16,20}.lpf.i64. Cost about 8 seconds per field
        size on the same host.

    - id: RT038-O2
      severity: critical
      title: >-
        The PRIMARY AND DECISIVE statistic is structurally blind at exactly the
        rungs the heuristic is used at.
      target: decision_rules.KS2-DS-1, success_criterion
      argument: >-
        KS2-DS-1 is an UNWEIGHTED sup-norm on the z-CDF with an ABSOLUTE
        tolerance of 0.006373. The deep-smooth end of that CDF carries almost no
        mass - the null CDF is 0.0086 at u=4, 0.0012 at u=5 and 0.00011 at u=6
        (bits16). An absolute tolerance of 0.0064 therefore corresponds to a
        multiplicative tolerance that explodes as u grows. HEUR-DS-1 is used
        precisely at large u, because that is where a Dickman-style early-abort
        accounting lives.
      tolerated_treatment_over_null_ratio_at_each_rung:
        note: >-
          Computed from the run's own committed per-rung counts. "Range" is the
          set of treatment rates that KS2-DS-1 would still pass at that abscissa.
        bits16:
          u2: {null_rate: 0.336809, tolerated_ratio_range: [0.981, 1.02]}
          u3: {null_rate: 0.062898, tolerated_ratio_range: [0.899, 1.10]}
          u4: {null_rate: 0.008646, tolerated_ratio_range: [0.263, 1.74]}
          u5: {null_rate: 0.001170, tolerated_ratio_range: [0.0, 6.45]}
          u6: {null_rate: 0.000107, tolerated_ratio_range: [0.0, 60.6]}
        bits20:
          u2: {null_rate: 0.330755, tolerated_ratio_range: [0.981, 1.02]}
          u3: {null_rate: 0.057317, tolerated_ratio_range: [0.889, 1.11]}
          u4: {null_rate: 0.006872, tolerated_ratio_range: [0.073, 1.93]}
          u5: {null_rate: 0.000757, tolerated_ratio_range: [0.0, 9.42]}
          u6: {null_rate: 0.000061, tolerated_ratio_range: [0.0, 105.2]}
      where_the_statistic_actually_looked: >-
        I located the abscissa at which the observed sup is attained. bits16 at
        LPF = 17431, z = 0.4403. bits20 at LPF = 27854389, z = 0.6183. Both sit
        in the bulk. The reported statistic is a bulk statistic and was never
        going to be anything else.
      consequence: >-
        The run supports "indistinguishable from uniform" at u <= 3 and at u = 4
        against deviations above about a factor 1.8. It supports NOTHING at
        u = 5 and u = 6, where a sixty- to hundred-fold excess of smooth values
        would have passed unremarked. Any evidence record must state the
        per-rung resolution beside the verdict, or a reader will take a pass at
        u=2 as a pass across the ladder.
      a_more_powerful_test_already_exists_in_this_data: >-
        Per-rung two-sample proportion tests on the SAME committed arrays need no
        new factorisation and are far sharper in the tail. At n = 130816 their
        80-percent-power minimum detectable deviation is 11.6 percent of the null
        rate at u=4, 32.7 percent at u=5 and 108 percent at u=6 (bits16) - versus
        the sup-norm's 74 percent, 545 percent and 5960 percent. Observed
        per-rung z-scores are all null (bits16 u4 z=-0.64, u5 z=+0.78, u6 z=+0.19;
        bits20 u4 z=+0.42, u5 z=+0.76, u6 z=+0.89), so running the sharper test
        does not change the direction of the outcome - it changes what the
        outcome is entitled to say.
      method_ceiling_note: >-
        This is a pre-compute failure, derivable from the enumeration rule alone.
        The contract's own PRE_REGISTRATION_CORRECTION block computed the
        threshold from n and never asked what deviation that threshold could
        see. Section 8 of docs/inventor-protocol.md calls this the method-ceiling
        audit and it was not performed.

    - id: RT038-O3
      severity: major
      title: CTRL-ENCA-POWER is a liveness check, not a power certificate.
      target: controls.CTRL-ENCA-POWER, manifest controls note "factor of about 106"
      argument: >-
        ENC-A is M_ij = max(e1,1)*max(e2,1) with e1, e2 < p. Every ENC-A value is
        therefore a PRODUCT OF TWO INTEGERS BELOW p, so its largest prime factor
        is below p = sqrt(D) with probability one. z <= 0.5 is an arithmetic
        identity for this arm, not an empirical outcome.
      measured_confirmation: >-
        From the committed arrays I read ENC-A z_max = 0.49548 (bits16, max LPF
        59281 against p = 59333) and z_max = 0.49560 (bits20, max LPF 928111
        against p = 928139), and the u=2 smooth fraction is exactly 1.00000000 on
        all 130816 records in both ENC-A arms. The ENC-A/null sup is attained at
        LPF 59243 and 928099 - i.e. at p, where the ENC-A CDF has already reached
        1 and the null CDF is only about 0.33.
      consequence: >-
        The control cannot fail. It compares a distribution supported entirely
        below sqrt(D) against one that puts 66 percent of its mass above sqrt(D).
        It certifies that the KS2 code path computes a nonzero number on grossly
        separated inputs. It certifies NOTHING about sensitivity to any
        alternative living on the same support as the null - which is the only
        kind of alternative HEUR-DS-1 could plausibly fail by. The manifest's
        "about 106x the threshold" is therefore not a power argument for the
        specific alternative; it is a power argument for one alternative that was
        chosen because it is unmissable.
      answering_the_task_card_directly: >-
        Asked whether CTRL-ENCA-POWER is a sufficient power argument for the
        alternative HEUR-DS-1 posits - NO. It is sufficient for SOME alternative
        and only for that one. The design has no measured power against any
        deviation of the size that would matter, and objection RT038-O2 shows
        that at u >= 5 it demonstrably has almost none.
      second_face_of_the_same_control: >-
        ENC-A and ENC-B encode the SAME fibre invariants (e1,e2) and give
        KS2 = 0.67 and KS2 = 0.002 respectively. The smoothness answer is
        therefore a property of the chosen encoding, not of the Semaev fibre.
        ENC-A is not injective and ENC-B is, so the two are not equally faithful -
        but that is the point - the result is contingent on which integer a
        hypothetical algorithm would actually factor, and no algorithm in this
        program has been shown to factor an ENC-B value.
      note_on_admissibility: >-
        I concur with the Executor's OBS-ENCA-DEFINITION-BY-REFERENCE flag and
        with the archive receipt's referral of it. My finding makes the
        admissibility question secondary - under the one corpus definition the
        control is degenerate, so admitting it changes nothing that matters.

    - id: RT038-O4
      severity: major
      title: >-
        The sentence that reads "criterion met" as "smoothness behaves as hoped"
        exists, it is in the frozen contract, and it contradicts the governing
        hypothesis.
      quoted_sentence_1: >-
        EXP-SMTH-71b1b0.outcomes.SUPPORT_AT_TOY_SCALE - "when - the
        success_criterion above is met. disposition - support, strength
        preliminary, claim tier TOY".
      quoted_sentence_2: >-
        EXP-SMTH-71b1b0.success_criterion - "SUPPORT AT TOY SCALE iff, at BOTH
        field sizes ...".
      the_contradiction: >-
        H-SMTH-001.interpretation_limits, first item, says verbatim - "Toy scale
        only, two field sizes, one curve instance each, one seed, one host, one
        unreplicated run. A pass is `replicate`, never `support`, and never
        validation of HEUR-DS-1 above the toy tier." The hypothesis is the
        governing record for interpretation and the contract's own outcome label
        contradicts it.
      why_the_word_matters: >-
        The predicate is a FAILURE TO REJECT. Labelling a failure to reject
        "SUPPORT" and assigning disposition `support` is the whole mechanism by
        which a non-difference becomes "the smoothness behaves as hoped" three
        records downstream. Nothing else in BATCH-038 does this; this does.
      ruling: >-
        The contract is frozen and must not be edited. The Coordinator resolves
        the conflict in favour of H-SMTH-001. The evidence record and decision
        must use `replicate` (pass, needs replication) and must not carry the
        token "support" as a disposition. Given RT038-O1 my own recommendation is
        weaker still - see narrowest_supported_statement.

    - id: RT038-O5
      severity: major
      title: >-
        evidence_eligible false is still standing and no committed decision has
        addressed it.
      target: EXP-SMTH-71b1b0.evidence_eligible, DEC-20260803-155a86.authorization_mechanism
      argument: >-
        The frozen contract carries BOTH `execution_authorized - false` AND
        `evidence_eligible - false`. DEC-20260803-155a86.authorization_mechanism
        names both fields in its `issue` paragraph but its `resolution` supplies
        one external fact only, authorization to EXECUTE. Nothing committed
        supplies the second. On the record as it stands the run was validly
        performed under a contract that says its output is not evidence-eligible.
      consequence: >-
        This is not a reason to discard the run. It is a gate that must be closed
        by an explicit committed Coordinator decision BEFORE any EV-* record
        cites RUN-SMTH-71b1b0-001. If it is not closed, the first evidence record
        will assert eligibility that no record grants.

    - id: RT038-O6
      severity: major
      title: >-
        The false hygiene precondition was corrected in the coordination note and
        left standing in the immutable ledger decision.
      target: DEC-20260803-155a86.preconditions_verified
      quoted: >-
        "tools/check_merge_hygiene.py PASSES on the batch-opening tree."
      what_is_true: >-
        The batch-opening tree is commit d1b6952c. I extracted
        ledger/corrections/CORR-20260803-a1c41e.yaml at that commit and parsed
        it - it fails with a yaml ScannerError, "mapping values are not allowed
        here", at line 54. The record was tracked and committed at that tree, so
        the gate as stated does not pass on it. The INPUT-CAPSULE has retracted
        the identical claim in its own text and says so plainly.
      the_asymmetry: >-
        INPUT-CAPSULE.md is a coordination note and was corrected in place, which
        is fine. DEC-20260803-155a86 is a LEDGER DECISION carrying the same false
        assertion, and under AGENTS.md rule 4 it cannot be edited - it requires a
        correction record. None exists. The correction was applied where it was
        cheap and omitted where it binds.
      required: >-
        A new CORR-* record naming DEC-20260803-155a86.preconditions_verified,
        stating the assertion, stating what was true at d1b6952c, and stating
        that the approval stands on its remaining preconditions. This is
        bookkeeping, not a challenge to the approval.

    - id: RT038-O7
      severity: moderate
      title: CTRL-APPARATUS-IDENTITY was silently redefined between hypothesis and contract.
      quoted_hypothesis: >-
        H-SMTH-001.test_boundary.parameters.apparatus_identity_control - "ENC-B
        applied to uniformly drawn (e_1, e_2) in [0, p)**2, which is DERIVABLY
        the same law as the null; disagreement is an implementation defect,
        agreement is not corroboration."
      quoted_contract: >-
        EXP-SMTH-71b1b0.controls CTRL-APPARATUS-IDENTITY - "re-running the
        factor-base and null generators from the frozen seed reproduces every
        stream digest."
      argument: >-
        These are two different controls carrying one name. The hypothesis's
        version is a DISTRIBUTIONAL identity check that exercises the encoder;
        the contract's version is a DETERMINISM check that does not touch the
        encoder at all. The blocking control that the frozen contract actually
        ran is therefore not the one the hypothesis specified, and the
        substitution is nowhere disclosed in the contract.
      mitigation_i_verified: >-
        The gap is largely closed by accident. verify_run.py V4-REFACTOR-TREAT-*
        re-derives N_ij from (i,j) via its own Vieta implementation and ENC-B and
        re-factors 400 records per arm by pure trial division with zero
        mismatches, and V2-SYMFUN confirms (e1,e2) are the root sum and product.
        So the encoder is exercised and correct on a sample. I record the
        substitution as a contract-versus-hypothesis defect rather than as a
        threat to this run's numbers.

    - id: RT038-O8
      severity: moderate
      title: About half the treatment population is never invariant-verified.
      target: verification-report.json V2-ROOTS-*, V2-SYMFUN-*
      argument: >-
        V2 recovers roots by Tonelli-Shanks and therefore only checks pairs whose
        discriminant is a square - the report says "199/199 split pairs". Pairs
        with a non-residue discriminant have roots in F_{p^2} and were not
        checked, yet their (e1,e2) are still recorded and encoded. That is
        roughly half the 130816 records.
      cheapest_fix: >-
        Vieta needs no root recovery. e1 = -c1/c2 and e2 = c0/c2 hold for every
        off-diagonal pair regardless of splitting. A check of the recorded
        (e1,e2) against (-c1/c2, c0/c2) for ALL 130816 pairs costs one modular
        inverse per pair and closes the gap completely.
      does_it_change_a_verdict: >-
        Almost certainly not - V4 already re-derives N from the same Vieta path
        on a sample drawn across the whole enumeration. Recorded so the coverage
        gap is not later mistaken for full coverage.

    - id: RT038-O9
      severity: minor
      title: I attacked the i.i.d. assumption behind the frozen threshold and it held.
      argument_raised: >-
        The frozen threshold 1.63*sqrt(2/n) assumes n independent draws in BOTH
        arms. The null arm has 130816 genuinely independent draws. The treatment
        arm's 130816 records are generated by only 512 underlying factor-base
        elements, each appearing in 511 pairs - a U-statistic-like sample whose
        effective size could in principle be far below 130816, which would
        invalidate the threshold and inflate the claimed power.
      what_i_measured: >-
        Per-factor-base-element means of the tail indicator and of the u=3 and
        u=4 smooth indicators, against the binomial expectation, on the committed
        treatment arrays; and the identical diagnostic on the null arm as a
        control. Variance ratios - treatment 0.97, 1.18, 0.89 (bits16) and 0.99,
        1.03, 0.98 (bits20); null 0.88, 0.93 (bits16) and 1.01, 0.99 (bits20).
      verdict: >-
        NO DETECTABLE DESIGN EFFECT. The treatment ratios sit inside the band the
        genuinely independent null arm produces, and the implied design effect on
        an arm mean is below 1. The objection does not bite. Recorded because the
        contract assumed independence rather than checking it, and because a red
        team that only reports the attacks that land is not reporting.

    - id: RT038-O10
      severity: minor
      title: The frozen threshold is mildly LIBERAL, not conservative, on this discrete data.
      what_i_did: >-
        Permutation calibration. Pool the treatment and null arrays, reshuffle
        the labels 120 times, recompute KS2 with the run's own tie-aware
        estimator. This gives the exact null law of the statistic on data with
        these ties, replacing the continuous-KS asymptotic.
      result: >-
        Null law of KS2 - median 0.003455, p90 0.005122, p99 0.006620 (bits16);
        median 0.003463, p90 0.005114, p99 0.006612 (bits20). The frozen
        threshold 0.006373 sits at an actual alpha of about 0.017 (bits16) and
        0.025 (bits20), not the nominal 0.01.
      consequence: >-
        Small and in the direction that makes rejection EASIER, so it cannot have
        manufactured this pass. Worth recording because the same calibration is
        the free replacement for the asymptotic threshold in any successor
        contract, and because the null law is essentially identical at both field
        sizes - which makes KS2-versus-bits a clean trend axis (see CTRL-RT6).
      unexpected_observation_not_discarded: >-
        The bits16 statistic 0.002095 has permutation p-value 0.95 - the two arms
        agree BETTER than 95 percent of exchangeable relabellings. bits20 is 0.75.
        Across two field sizes this is unremarkable and I do not call it a
        finding. Recorded under AGENTS.md rule 8 so a later reader with more
        field sizes can see whether it recurs.

    - id: RT038-O11
      severity: minor
      title: Threshold and count disagreement between the hypothesis and the contract is unresolved in the ledger.
      argument: >-
        H-SMTH-001.predictions still carries n = 131328 and the KS2 threshold
        0.006362; the contract froze n = 130816 and 0.006373 and discloses the
        change in PRE_REGISTRATION_CORRECTION before any datum. The contract is
        right - 131328 = C(513,2) counts the diagonal, exactly where the
        invariants are undefined - and the change loosens the threshold by
        1.1e-05, which is immaterial. But the hypothesis record still states the
        wrong count and the wrong threshold, and a reader comparing the two sees
        a mismatch with no record resolving it.
      required: a CORR-* record binding the hypothesis's prediction block to the corrected enumeration.

    - id: RT038-O12
      severity: minor
      title: OBS-RHO2-TRANSCRIPTION confirmed, and it does not bite.
      what_i_checked: >-
        1 - ln 2 = 0.3068528194400547; the contract's rho_frozen.u2 is
        0.30684282; absolute difference 1.0e-05. DECAY-1 recomputed with the
        correct rho(2) is 0.0064036 against the frozen 0.006404, and the
        observed decay ratios are 0.00034 and 0.00028, two orders below either.
        The RATE-DS-1 factor-8 band is 64 times wider than the discrepancy.
      verdict: >-
        I concur with the Executor's OBS-RHO2-TRANSCRIPTION - no verdict turns on
        it and an Executor correctly did not repair a frozen contract. A
        successor contract should carry the closed form.

  ruling_on_the_authorization:
    question: >-
      Is the external authorization in DEC-20260803-155a86 sufficient, or does
      freeze_rule require a SUPERSEDING contract carrying execution_authorized
      true, in which case BATCH-038 re-opens against a new contract id?
    ruling: SUFFICIENT. The competing reading does not carry.
    reasoning:
      - >-
        freeze_rule governs CHANGES TO THE CONTRACT TEXT and its enforcement
        mechanism is a digest gate over the file. Its purpose is anti-tuning - to
        guarantee the measured quantity, metrics, thresholds, controls and
        success criterion were fixed before any datum existed. That purpose was
        fully served. I re-hashed the file and searched its whole history - two
        commits, one digest, never edited - and the run's own gate recorded the
        same digest before any datum.
      - >-
        `execution_authorized` is a STATUS field. It is not a measured quantity,
        metric, threshold, control, success criterion, budget or claim ceiling.
        No number in this run depends on it, and no reading of it could have been
        tuned by anyone who had seen data, because there was none.
      - >-
        Under AGENTS.md the authoritative locus of approval is a decision record,
        not a boolean inside an artifact - "State transitions must include a
        decision record with rationale and evidence references", and only the
        Coordinator may make them. The field is a cached copy of a decision; the
        decision is the original. Where the two disagree, the later committed
        decision governs.
      - >-
        Rule 4 forbids editing the frozen record. Flipping the flag in place
        would have been the violation. Recording the fact in a new committed
        decision is precisely the prescribed mechanism - corrections supersede,
        they do not overwrite.
      - >-
        The competing reading is actively WORSE for evidence integrity if applied
        now. Re-opening against a new contract id after the data exists means the
        successor contract's thresholds would be authored by someone who has seen
        the numbers. That is the exact harm the freeze exists to prevent. The
        cure would be more dangerous than the defect.
    boundary_this_ruling_must_not_be_read_past: >-
      An external committed decision may supply a STATUS or AUTHORIZATION fact
      that a frozen contract does not carry. It may NEVER supply, alter, relax or
      reinterpret a measured quantity, metric, threshold, band, control, success
      criterion, outcome branch, budget or claim ceiling. Any of those requires a
      superseding contract under a new id, full stop. I recommend this boundary
      be recorded as a durable rule rather than as a one-off ruling in this
      report, because the next invocation of "the decision states what is true
      now" will not be about a status flag.
    consequential_gate: >-
      The ruling covers execution only. See RT038-O5 - `evidence_eligible - false`
      is a separate standing field that no committed record has addressed, and it
      must be closed before an EV-* record cites this run.
    standing_of_this_run: >-
      RUN-SMTH-71b1b0-001 stands as a valid, citable, immutable observation
      record under the contract it names. Nothing in this ruling discards it, and
      nothing in this report proposes re-running it. Its limits are the
      interpretive ones in RT038-O1 through RT038-O4, not authorization ones.

  ruling_on_the_unverifiable_supersession_receipt:
    question: >-
      Does the unverifiable EXP-SMTH-4403c4 receipt (CORR-20260803-a1c41e defect
      2) affect what this run concludes, or trust in the contract's other
      declared numbers, in particular the frozen thresholds?
    verification_i_repeated_independently: >-
      `git log --all -- experiments/EXP-SMTH-4403c4/specification.yaml` returns
      exactly one commit, f846c8dd, and `git show f846c8dd:<path> | sha256sum`
      gives 664e37a3752b984f6b213dde21c9d7c26e891708325185c785f36c5d6462eb6f.
      The declared 80b75c41... appears nowhere in history as a file digest. The
      correction's factual account is accurate.
    effect_on_what_this_run_concludes: NONE.
    effect_reasoning: >-
      The superseded contract is not an input to the measurement. Every number
      the driver consumed came from EXP-SMTH-71b1b0's own text, whose digest gate
      passed. The measured quantity is stated directly, as the contract's
      reuses_nothing_unapproved clause says.
    effect_on_trust_in_the_frozen_thresholds: NONE, AND THIS IS CHECKABLE RATHER THAN TAKEN ON TRUST.
    effect_on_thresholds_reasoning: >-
      A receipt digest is a provenance claim about a DIFFERENT file. The
      thresholds are not provenance claims - they are arithmetic on declared
      inputs, and I recomputed every one of them from the declared inputs
      (see what_i_do_not_dispute). A threshold that reproduces from its own
      stated derivation cannot be undermined by a bad digest on another record.
      The contract's remaining declared numbers are of the same kind, with the
      single exception of rho_frozen.u2, which I checked separately and which is
      off by 1.0e-05 (RT038-O12).
    what_it_DOES_damage: >-
      The provenance chain, and only that. The narrative "three defects of
      EXP-SMTH-4403c4 are repaired here" is checkable against f846c8dd, which
      does exist - so the substantive supersession story is auditable even though
      the receipt is not. What is permanently lost is the ability to say WHICH
      bytes the supersession was declared against.
    required: >-
      A one-line addendum in the Coordinator's next correction stating that the
      supersession claims of EXP-SMTH-71b1b0 are to be read against
      f846c8dd:experiments/EXP-SMTH-4403c4/specification.yaml, sha256
      664e37a3..., and that the digest 80b75c41... is retired as unverifiable.

  ruling_on_the_coordinators_own_conduct:
    question: >-
      Was in-place repair of an unparseable committed ledger record (d1b6952c ->
      b72b120a) acceptable, or did AGENTS.md rule 4 require a superseding record?
    ruling: ACCEPTABLE, NARROWLY, ON VERIFIED FACTS - not on the Coordinator's self-report.
    what_i_verified_rather_than_accepted:
      - >-
        The d1b6952c version genuinely does not parse. I extracted it and ran
        yaml.safe_load - ScannerError, "mapping values are not allowed here",
        line 54.
      - >-
        The diff is what the self_repair_note says it is. `git diff d1b6952c
        b72b120a -- ledger/corrections/CORR-20260803-a1c41e.yaml` changes exactly
        four lines of punctuation (removing the quoted colon-space commit
        message) and appends the self_repair_note block. No assertion, digest,
        finding, scope or claim ceiling is altered.
      - >-
        The record is cited by no other record, and the batch it belongs to is
        still open.
    reasoning: >-
      The determining fact is NOT "only punctuation changed" - that is exactly
      the kind of self-report immutability exists so nobody has to accept, and I
      only credit it because the diff is public and I read it. The determining
      fact is that the committed bytes did not constitute a record of the
      declared type. A superseding record must NAME the record it supersedes and
      state what that record said; neither is possible for a file no parser can
      load, so there was no readable record to supersede. Rule 4 protects the
      content of records; it cannot be discharged against a file that has none.
    the_rule_i_would_have_the_coordinator_adopt: >-
      In-place repair of a committed ledger record is permissible if and only if
      ALL of - (1) the committed bytes fail to parse as the declared record type,
      demonstrated by a quoted parser error against the exact commit; (2) no
      other committed record cites it; (3) the diff is confined to lexical repair
      and is quoted in full in the record's own repair note; (4) an independent
      reviewer verifies (1) to (3) against git rather than against the note.
      Any repair that changes a value, digest, scope or assertion is a
      superseding record under a new id, with no exception.
    the_finding_that_actually_matters_here: >-
      The Coordinator repaired the cheap thing and left the binding thing. See
      RT038-O6 - the identical false hygiene assertion sits uncorrected in
      DEC-20260803-155a86.preconditions_verified, which is a ledger decision and
      cannot be edited. That omission is a larger integrity defect than the
      in-place repair, and it was not flagged anywhere in the batch.
    credit_where_due: >-
      The defect was caught by the Executor of TASK-20260803-fa7476, which
      refused to touch a file outside its write scope and reported it. The batch
      then documented the failure mechanism precisely - the hygiene gate was run
      before `git add`, so an untracked file was invisible to a tool that
      inspects touched files. "Run it after staging" is a correct and reusable
      finding and should be promoted, not buried in a correction record.

  answer_to_the_task_cards_question_2:
    what_a_KS2_far_below_threshold_DOES_say: >-
      That the treatment z-CDF and the measured null z-CDF differ nowhere by more
      than 0.0021 (bits16) / 0.0026 (bits20) in absolute sup-norm, at n = 130816
      per arm, on this curve, this factor base, this encoding and these two field
      sizes. Equivalently - the pair (e1,e2) shows no detectable departure from
      equidistribution in F_p x F_p at that resolution.
    what_it_DOES_NOT_say:
      - >-
        It does not say the two distributions agree in the smooth tail. At u = 5
        and u = 6 the same statistic tolerates 6.5x and 60-105x ratios
        (RT038-O2).
      - >-
        It does not say the object under study behaves this way BECAUSE it is a
        Semaev half-arity partial map. An off-curve object passes identically
        (RT038-O1).
      - >-
        It does not say the test could have detected a failure of HEUR-DS-1. The
        only power evidence offered is against an arithmetically impossible-to-
        miss alternative (RT038-O3).
      - >-
        It does not license any early abort, any charged saving, any exponent, or
        any statement about ECDLP cost. The contract, the hypothesis and the
        batch artifacts all say this and I confirm none of them breaches it.
    is_anyone_positioned_to_read_it_as_smoothness_behaves_as_hoped: >-
      Yes, and the exact vector is the contract's own outcome label - see
      RT038-O4. Nothing in the BATCH-038 coordination artifacts, the archive
      receipt or the run manifest does this; the run manifest is scrupulous
      ("interpretation - NONE") and the archive receipt explicitly disclaims it.
      The risk is entirely downstream, in the evidence record and decision that
      have not yet been written.

  answer_to_the_task_cards_question_3_claim_ceiling_sweep:
    method: >-
      Read SCOPE-DECISION.md, INPUT-CAPSULE.md, all task cards, the archive
      receipt, the goal opening and next-action notes, the run manifest,
      implementation.md, DEC-20260803-155a86 and CORR-20260803-a1c41e looking for
      any sentence asserting more than two field sizes at 16 and 20 bits,
      |FB| = 512, m = 4, one curve per size, one seed, one host, one unreplicated
      run can carry.
    result: >-
      NO sentence in the BATCH-038 coordination or run artifacts reads past TOY
      TIER. Every one of them carries an explicit claim ceiling and the archive
      receipt volunteers "It does NOT establish that HEUR-DS-1 is supported" and
      "One run, one seed, one host, unreplicated". This is unusually disciplined
      and I say so.
    the_one_exception: >-
      EXP-SMTH-71b1b0.outcomes.SUPPORT_AT_TOY_SCALE, quoted in RT038-O4. It is in
      the frozen contract, predates the data, and cannot be edited - so it must
      be neutralised by the Coordinator's decision rather than by any repair.

  required_controls:
    - id: CTRL-RT1
      priority: 1
      blocking_for_any_evidence_record: true
      name: Off-curve null object of the same shape.
      what: >-
        Add as a BLOCKING control in any successor contract - the identical
        pipeline on a factor base of 512 elements none of which is an
        x-coordinate of a point of E(F_p), compared against NULL-UNIF-D. The
        control PASSES only if that arm is REJECTED; if it passes the treatment's
        own predicate, the predicate is declared non-discriminating and the
        outcome branch is INSTRUMENT_UNINFORMATIVE.
      cost: about 8 seconds per field size. Already run by the Red Team; it fails.
      why_first: >-
        It is the control docs/inventor-protocol.md section 3 already requires,
        it is the cheapest thing in this list, and its result changes the
        disposition of this run.
    - id: CTRL-RT2
      priority: 2
      name: Per-rung two-proportion tests and a tail-weighted statistic.
      what: >-
        On the ALREADY COMMITTED arm arrays, with zero new factorisation - report
        a two-sample proportion test at each rung u in {2,3,4,5,6}, with its
        80-percent-power minimum detectable ratio printed beside it, and an
        Anderson-Darling statistic (which weights by 1/sqrt(F(1-F)) and so is
        sensitive where the sup-norm is blind) alongside KS2.
      cost: seconds, no new factorisation, no new run.
    - id: CTRL-RT3
      priority: 3
      name: Permutation calibration replaces the asymptotic threshold.
      what: >-
        Derive the KS2 rejection threshold from 1000 label permutations of the
        pooled arms rather than from 1.63*sqrt(2/n). The data are heavily tied
        and the asymptotic is off by roughly a factor 2 in alpha (RT038-O10).
      cost: about one minute at n = 130816.
    - id: CTRL-RT4
      priority: 4
      name: Publish the resolution beside every verdict.
      what: >-
        No pass may be reported without the per-rung tolerated ratio table of
        RT038-O2 in the same record. A pass whose resolution is 60x at the rung
        that matters must say so in the sentence that reports it.
      cost: none, it is a reporting rule.
    - id: CTRL-RT5
      priority: 5
      name: A real power certificate - planted deviation, not a degenerate encoding.
      what: >-
        Replace or supplement CTRL-ENCA-POWER with a SPIKED arm - take the null
        draw and replace a controlled fraction of its values with values forced
        to be D^(1/u)-smooth so the u-rung rate is exactly k times the null rate,
        for k in {1.25, 1.5, 2, 4} at u in {4,5,6}. Report the smallest k the
        statistic rejects at each rung. That is the power curve the design
        currently lacks entirely.
      cost: one arm's worth of factorisation per (k,u) cell; well inside the
        budget this run used 0.66 percent of.
    - id: CTRL-RT6
      priority: 6
      name: Field-size trend with n held fixed.
      what: >-
        Add bits in {24, 28} at the same |FB| = 512. Because n is fixed at 130816
        the null law of KS2 is essentially bits-independent (I measured medians
        0.003455 and 0.003463 at bits 16 and 20), so KS2-versus-bits is a clean
        trend axis. Two points is not a trend; a systematic structural deviation
        would show as monotone growth in KS2 with bits, and its absence over four
        points would be worth far more than its absence over two.
      naming_the_parameter_that_should_destroy_it: >-
        Per docs/inventor-protocol.md section 3 - the parameter that should move
        the reported quantity is the field size, and the run reports it at two
        values only. The quantity that DOES visibly degrade with a parameter is
        the predicate's own resolution as u grows, and that degradation is
        currently unreported.
    - id: CTRL-RT7
      priority: 7
      name: Vieta check on all pairs, not only split ones.
      what: verify recorded (e1,e2) against (-c1/c2, c0/c2) on all 130816 pairs. See RT038-O8.
      cost: one modular inverse per pair.
    - id: CTRL-RT8
      priority: 8
      name: A second curve and a second seed per field size.
      what: >-
        The run has one curve per field size from one master seed. H-SMTH-001's
        own interpretation_limits call a pass `replicate`. Two curves per size
        under a second master seed is the cheapest thing that makes the word
        honest.

  counterexample_or_mutation: >-
    THE OFF-CURVE MUTATION. Hold every element of the design fixed - p, a, b,
    S_3, the Vieta invariants, ENC-B, the factoriser, the KS2 estimator, the
    committed null arrays, n = 130816, and all four frozen thresholds - and
    mutate ONE thing - require the 512 factor-base elements to be field elements
    for which x^3 + a x + b is a quadratic non-residue, so that none of them is
    the x-coordinate of a point of E(F_p) and the object is no longer a
    half-arity Semaev partial map on the curve at all. The mutated object passes
    the entire frozen success predicate at both field sizes - KS2 0.00363105 and
    0.00171997 against 0.006373, TAIL 0.0017353 and -0.0004739 against 0.01,
    DECAY 0.00041065 and 0.00034618 against 0.006404. The mutation that should
    have destroyed the result does not touch it. That is the discriminating
    control this contract lacked, it costs eight seconds, and it is decisive.

  baseline_comparison:
    cost_baselines_do_not_apply_and_that_is_correct: >-
      H-SMTH-001.test_boundary.parameters.baselines says "NONE APPLY. This
      hypothesis makes no cost claim, so matched Pollard rho and matched BSGS are
      not baselines for it and are not measured." I concur. No discrete logarithm
      is solved, no relation is claimed, no cost identity is asserted, and
      docs/claims-and-verification.md requires no solution certificate. Importing
      a rho/BSGS comparison here would be a category error and I do not require
      one.
    the_baselines_that_do_apply:
      - id: BL-1
        name: The Dickman-de Bruijn law.
        comparison: >-
          The run agrees with it - KS-DS-1 0.0314 and 0.0263 against 0.05, all
          RATE-DS-1 rungs in band - and the null agrees with it equally (0.0312,
          0.0247). The run does not beat this baseline and does not claim to.
      - id: BL-2
        name: NULL-UNIF-D, the measured uniform null.
        comparison: >-
          Indistinguishable at sup-norm resolution 0.0064. Again not a beat - the
          intended direction is agreement.
      - id: BL-3
        name: THE TRIVIAL DOMINATOR - any 512-element subset of F_p pushed through S_3 Vieta and ENC-B.
        comparison: >-
          Also passes (RT038-O1). This baseline achieves the same predicate
          outcome at the same cost with none of the structure, so it DOMINATES
          the treatment on the only axis the predicate measures.
    dominated_by: >-
      BL-3. This field is NOT null and must not be recorded as null in any
      evidence record for this run. H-SMTH-001 itself states that "`dominated_by
      - null` remains forbidden" for this hypothesis. Under AGENTS.md rule 5 and
      the inventor protocol's Pareto clause, an unchecked null here would be a
      fabrication; I checked every applicable row and the frontier is not empty.
    sota_delta: >-
      Zero on every axis. No time, memory, data or query cost is claimed,
      measured, or improved. The result is a distributional agreement report and
      its delta against the published Dickman-de Bruijn law is by construction
      nil - agreement, not advantage.

  heuristic_challenges:
    - id: HC-1
      name: Numbering and explicitness.
      finding: >-
        PASS. HEUR-DS-1 is explicit, is quoted verbatim in H-SMTH-001, is
        numbered, carries a named random-model justification
        (Canfield-Erdos-Pomerance plus Dickman-de Bruijn), a falsification
        condition set (F-SMTH-1/2/3) and a validation experiment. This is the
        exemplar-profile discipline done properly and I record it as such.
    - id: HC-2
      name: Random-model transfer - the object measured is not the object the heuristic names.
      finding: >-
        FAIL, and this is the deepest challenge in this report. HEUR-DS-1's
        verbatim sentence is about "INTERMEDIATE DEGREES arising from half-arity
        Semaev partial maps". The degree of S_3(x_i,x_j,Z) in Z is 2, always, for
        every pair. There is no varying degree to be smooth or non-smooth. The
        contract therefore substitutes a CONSTRUCTED INTEGER - the elementary
        symmetric functions of the root multiset, packed by the bijection
        N = e1*p + e2 + 1 into [1,p^2] - and measures the smoothness of that.
        Whether that substitution preserves what the heuristic is about is an
        unargued representation assumption. The program has been burned by
        exactly this before - RT047-H2 and RT048-H1 record that the only earlier
        HEUR-DS-1 sampling measured a quantity wrong by a factor about 2^20. The
        SIZE mismatch is fixed here. The IDENTITY mismatch is not addressed
        anywhere in the contract.
      cheapest_computation_that_would_expose_it: >-
        Already performed - RT038-O1. Since ENC-B is a bijection onto exactly the
        null's support, the test is an equidistribution test for (e1,e2) in
        F_p x F_p, and equidistribution of a quasi-random algebraic map is a
        Weil-type expectation, not a smoothness fact. The off-curve control
        confirms it empirically in eight seconds per field size. The complementary
        computation, not yet performed and also cheap, is to name the integer that
        an actual claw or index-calculus early abort would factor and measure
        THAT - if no such integer has been identified, the heuristic has no
        algorithmic referent and that should be recorded as an open problem
        rather than tested by proxy.
    - id: HC-3
      name: Minimality, symmetry and multiplicity effects.
      finding: >-
        Partially examined. The contract does exclude the diagonal by loop bound
        and does prove the leading coefficient (x1-x2)^2 vanishes exactly on the
        diagonal, which is correct and well done. What is NOT examined is whether
        the root multiset's splitting behaviour (discriminant a residue or not)
        biases (e1,e2) - roughly half the pairs have roots in F_{p^2} - and
        whether e2 as a product of conjugates carries a norm-form constraint. A
        norm form is precisely the "structured quantity that is not a uniformly
        random integer" the exemplar profile warns about. Cheap check - split the
        treatment arm by the Legendre symbol of the discriminant and run the two
        halves separately against the null. Zero new factorisation; the split is
        recoverable from the committed enumeration.
    - id: HC-4
      name: Scale honesty.
      finding: >-
        Correctly declared and correctly bounded. 16 and 20 bits is toy by
        several orders and every artifact says so. Under AGENTS.md rule 7 nothing
        here validates HEUR-DS-1 at any cryptographic size, and no
        substitute-sampling argument reaching a cryptographic scale is offered or
        claimed. I record no objection, only the note that the exemplar profile's
        standard - validation AT the claimed scale - is not met and is not
        asserted to be met.
    - id: HC-5
      name: Cost bookkeeping - per-attempt versus total expected cost.
      finding: >-
        Not applicable and correctly so. No success probability is inverted, no
        attempt is costed, and no total is claimed. The exemplar-profile
        bookkeeping challenge has no purchase on a pure distributional report.

  cost_model_challenges:
    - id: CM-1
      name: No cost claim is made, and none is smuggled.
      finding: >-
        Confirmed. I searched the contract, the manifest and the batch artifacts
        for any charged saving, abort cost, exponent or ECDLP cost statement and
        found only explicit denials. AGENTS rule 5 is not breached.
    - id: CM-2
      name: The DESIGN's own cost model is wrong by three orders of magnitude.
      finding: >-
        This is a real cost-model defect even though the result claims no cost.
        The statistic chosen as PRIMARY AND DECISIVE buys tail resolution at a
        catastrophic price. To resolve a factor-2 deviation at the u = 6 rung,
        the sup-norm KS2 needs its threshold below the null rate 1.07e-04, hence
        n >= 4.6e+08, hence |FB| about 30,500 and about 4.6e+08 complete
        factorisations. A per-rung two-proportion test at 80 percent power needs
        n about 2.2e+05, hence |FB| about 663 - roughly 2100 times fewer
        factorisations for the SAME tail resolution. At u = 5 the ratio is about
        190x (|FB| 2787 versus 200); at u = 4 about 27x (|FB| 377 versus 73).
      consequence: >-
        The contract spent its entire sample on the least efficient available
        statistic and then reported the result as decisive. This is a
        method-ceiling failure that was derivable before compute from the
        enumeration rule and the ladder alone, at no cost, and it should have
        been caught by the section 8 audit.
    - id: CM-3
      name: Budget honesty.
      finding: >-
        Exemplary. 0.66 percent of wall, 0.16 percent of CPU, 1.98 percent of
        peak RSS; the RSS pre-flight declared its tolerance before probing and
        the growth was 16384 bytes against a 67108864-byte tolerance; the
        rlimit-based enforcement argument (RSS never exceeds address space) is
        sound. The BATCH-029 RUN-SMTH-PILOT-002 failure mode was genuinely fixed
        rather than merely described. Since the run used under one percent of its
        ceilings, EVERY control in required_controls above fits inside the same
        budget envelope, which removes the usual excuse for omitting them.

  reduction_and_scope_challenges:
    - id: RS-1
      name: No cited reduction to instantiate.
      finding: >-
        Correct - this contract cites no published reduction and derives no
        corollary through one, so the reduction-instantiation challenge has no
        target. Nothing is claimed via OneEnd/EndRing-style chaining.
    - id: RS-2
      name: Affected-versus-safe scope.
      finding: >-
        Not inflated. The contract, hypothesis, decision, goal note and archive
        receipt each state that no deployed scheme is affected and no exponent or
        cost saving is claimable. I found no scheme list to audit because none
        was asserted. This is the correct posture and I record it as passed.
    - id: RS-3
      name: The scope that IS at risk of inflation.
      finding: >-
        Not scheme scope - OBJECT scope. Given RT038-O1 the honest scope of this
        run is "ENC-B-encoded pairs in F_p x F_p arising from the S_3 Vieta
        formula on 512 field elements", which is strictly WIDER and strictly
        weaker than "the half-arity Semaev partial-map invariants on the factor
        base of E(F_p)". Every downstream record must use the wider, weaker
        phrase, or it inflates by naming a structure the measurement cannot see.
    - id: RS-4
      name: Closure discipline in the other direction.
      finding: >-
        The batch handles the deferred EXP-IT-001 thread correctly. It names the
        obstruction concretely (validate_ledger.py indexes runs only at
        experiments/*/runs/*/manifest.yaml and the JSON rescue path covers frozen
        legacy manifests only, so BATCH-028's flat manifest.json files leave
        EV-IT-001 and EV-IT-002 citing unregistered ids), states it is a
        Coordinator ruling on admissibility rather than a lint fix, and records it
        as deferred not abandoned with a named successor. Under
        docs/inventor-protocol.md section 4 that is a proper deferral and not a
        fatigue report. No objection.

  proof_architecture_challenges:
    - id: PA-1
      attack: Nearby-object attack.
      outcome: SUCCEEDS AGAINST THE CLAIM.
      detail: >-
        The closest object for which the desired conclusion carries no meaning -
        512 field elements that are not on the curve, same formula, same encoding
        - is not distinguished by the design. See RT038-O1. The missing
        problem-specific ingredient is any statistic that responds to the
        on-curve constraint.
    - id: PA-2
      attack: Observation-fiber attack.
      outcome: SUCCEEDS AGAINST THE CLAIM.
      detail: >-
        Hold the reported invariant fixed - the LPF z-CDF at sup-norm resolution
        0.0064 - and vary the underlying object. I placed on the SAME side of the
        conclusion - (a) the on-curve Semaev invariants, (b) an off-curve object,
        (c) an unconstrained object, and by RT038-O2 also (d) any hypothetical
        object with up to a 60x excess of D^(1/6)-smooth values. Four preimages,
        one verdict. The missing separator is a tail-weighted or per-rung
        statistic (CTRL-RT2).
    - id: PA-3
      attack: Method-ceiling attack.
      outcome: SUCCEEDS AGAINST THE HEADLINE.
      detail: >-
        The largest claim the resource measure supports under ideal tuning is
        "agreement to within a factor 1.02 at u=2, 1.10 at u=3, 1.74 at u=4,
        6.45 at u=5, 60.6 at u=6". The headline the contract attaches - "behave,
        for B-smoothness purposes, like uniform random integers of the same size"
        - is a statement about the whole ladder. The ceiling does not reach the
        headline at u >= 5, and that was computable before the run from n and the
        ladder alone.
    - id: PA-4
      attack: Quantifier-order attack.
      outcome: PASSES.
      detail: >-
        The thresholds, the enumeration, the n correction, the null ordering
        constraint and the RSS tolerance were all fixed before any datum, and the
        null arm was drawn, factored and hash-committed before the first
        treatment factorisation (null_arm_commit_sha256 4bc1b392..., recorded in
        null-commit.json and echoed in raw-result.json). No witness was chosen
        after seeing an outcome. This is the part of the design that is genuinely
        strong and I do not attack it.
    - id: PA-5
      attack: Boundary and strictness attack.
      outcome: NOT APPLICABLE.
      detail: No old method is claimed as an embedded boundary and no perturbation is claimed strictly better.
    - id: PA-6
      attack: Compositional-invariant attack.
      outcome: PARTIAL FINDING, recorded as RT038-O7.
      detail: >-
        Deleting the hypothesis's version of CTRL-APPARATUS-IDENTITY and
        substituting a seed-replay check removes the only component that
        exercised the encoder under the null law. The recursion step that fails
        is "the treatment arm's integers are ENC-B images of genuine Semaev
        invariants" - which is in fact re-established, but by verify_run.py V4
        rather than by any control the contract names.

  narrowest_supported_statement: >-
    RUN-SMTH-71b1b0-001 is a valid, complete, deterministic, independently
    re-verified measurement. What it supports, and nothing more - AT bits in
    {16,20}, on one deterministic ordinary curve per field size from master seed
    4403196, with |FB| = 512, m = 4, INT-1 and ENC-B, n = 130816 per arm, one
    seed, one host, one unreplicated run - the empirical largest-prime-factor
    distribution of the ENC-B-encoded elementary symmetric functions of the
    S_3(x_i,x_j,Z) root multiset shows NO DEPARTURE from a measured uniform null
    on [1,p^2] at an absolute sup-norm CDF resolution of 0.006373, which
    corresponds to a multiplicative resolution of about 1.02x at u=2, 1.10x at
    u=3, 1.8x at u=4, 6.5x at u=5 and 60-105x at u=6; the u=6/u=2 decay ratio is
    two orders of magnitude below the artifact-tell threshold; and all four
    blocking controls as the contract defines them pass. THAT IS A FAILURE TO
    REJECT, NOT A CONFIRMATION. Because a structurally different object of the
    same shape - a factor base with no point of E(F_p) behind it - satisfies the
    identical predicate at both field sizes, the outcome is a CONTROLLED NULL
    under docs/inventor-protocol.md section 3 and carries no information about
    the Semaev structure specifically. The honest disposition is a low-information
    pass - `replicate` per H-SMTH-001.interpretation_limits, and in my judgement
    better recorded as `inconclusive - instrument non-discriminating` with the
    per-rung resolution table attached. It licenses no cost saving, no exponent,
    no crypto-scale validity, no early abort and no consequence for any deployed
    scheme, and a negative outcome would have closed only the exact tested scope.

