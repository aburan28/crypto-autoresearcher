  scaled_down_ladder_note:
    applicability: >-
      docs/inventor-protocol.md section 6 governs a claimed improvement that
      cannot be executed at the scale where it would matter. This run CLAIMS NO
      IMPROVEMENT and no speedup -- it is a distributional measurement whose
      whole output is two KS statistics, two tail differences and a decay ratio
      against a matched null. The section 6 ladder, including the step-2
      measured-ratio-against-baseline requirement whose absence would be a
      failed rather than an incomplete, therefore does not bind this receipt.
    but_it_binds_what_comes_next: >-
      The moment any record built on this run asserts that smoothness behaviour
      licenses a cost saving, a relation-collection rate, an early abort or an
      exponent, section 6 binds in full and this toy run supplies none of it.
      The Coordinator should treat that as a standing gate on promotion rather
      than a matter for the evidence record alone.

  # =====================================================================
  verdict: passed

  verdict_scope: >-
    RUN-SMTH-71b1b0-001 is an ADMISSIBLE RESEARCH RECEIPT. The frozen contract
    digest matches, every declared artifact is present and hashes as declared,
    all four blocking controls carry recorded verdicts that are supported by
    data I recomputed from the raw arms rather than by assertion, every budget
    ceiling was respected by two orders of magnitude, no stop occurred and the
