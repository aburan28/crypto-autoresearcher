    and citable, and every gating statistic reproduces exactly from the raw
    per-record data with the whole artifact set rebuilding bit-for-bit from
    scratch.
  what_this_verdict_does_not_do: >-
    It does not support HEUR-DS-1 or H-SMTH-001. It does not select
    SUPPORT_AT_TOY_SCALE or any other outcome branch -- the Executor evaluated
    the frozen predicate mechanically and I confirmed the arithmetic of that
    evaluation, which is a different act from adopting its disposition. It
    assigns no evidence strength -- this is one run, one seed, one host,
    unreplicated. It does not resolve the contested external authorization under
    DEC-20260803-155a86, which the Coordinator routed to the Red Team and which
    I make no ruling on. And it authorizes no promotion, no cost claim and no
    scale beyond TOY.

  limitations:
    - >-
      TOY SCALE, and it is the dominant limitation. 16-bit and 20-bit primes,
      |FB| = 512, m = 4, one curve per field size. Nothing here transfers to any
      cryptographic parameter, and no crypto-scale, medium-scale,
      affected-scheme or asymptotic claim is derivable.
    - >-
      ONE RUN, ONE SEED, ONE HOST, UNREPLICATED. The contract permits one run
      and one was performed. Determinism is not replication -- I rebuilt the
      artifacts bit-for-bit, which shows the pipeline is deterministic, not that
      the result holds under a different seed, a different curve, a different
      factor base or a different implementer.
    - >-
      CTRL-ENCA-POWER certifies non-degeneracy of the KS2-DS-1 statistic, not
      power against a small deviation. Its object is 100 percent u=2-smooth by
      construction. See RULING-OBS-ENCA-DEFINITION-BY-REFERENCE.
    - >-
      The object of a blocking control is defined outside the frozen contract,
      so pre-registration is incomplete for that control.
    - >-
      Both ordering guarantees -- null-before-treatment and
      declaration-before-probe -- rest on the driver's own control flow, its own
      hash-pinned source and its own single append-only log, all produced by one
      task in one process. That defeats accident and post-hoc tuning; it is not
      externally notarised.
    - >-
      The "independent" verifier verify_run.py is an independent IMPLEMENTATION
      (stdlib only, re-derives the curve, factor base, DRBG, roots and
      factorizations by different algorithms) but not an independent AUTHOR --
      the same Executor wrote both. My own recomputations in this report are the
      genuinely third-party layer, and they cover the gating statistics, the
      null sampler and the full artifact rebuild.
    - >-
      The arm dumps carry no (i,j) index column, so the no-duplicate-pair and
      no-diagonal properties cannot be audited per record from the raw
      artifacts alone.
    - >-
      The contract's frozen rho(2) is wrong in its last transcribed digits. It
      cannot move any verdict here (see RULING-OBS-RHO2-TRANSCRIPTION) but it is
      a defect in a frozen record and should be recorded as one.
    - >-
      The supersession receipt for EXP-SMTH-4403c4 remains UNVERIFIABLE AS
      RECORDED (CORR-20260803-a1c41e defect 2). I re-read that correction and
      did not re-litigate it; it does not affect this run, because
      EXP-SMTH-71b1b0 states its measured quantity directly. Still open.
    - >-
      This report validates INTEGRITY only. It does not interpret the
      mathematics, and a passed integrity verdict on a well-built instrument
      says nothing about what the instrument measured.

