  # =====================================================================
  # THE RULING THE COORDINATOR ASKED FOR
  # =====================================================================
  rulings:
    - id: RULING-OBS-ENCA-DEFINITION-BY-REFERENCE
      question: >-
        ENC-A is the object of the BLOCKING control CTRL-ENCA-POWER, is defined
        NOWHERE inside EXP-SMTH-71b1b0, and that contract's
        reuses_nothing_unapproved clause explicitly declines to reuse
        EXP-SMTH-001's contract. Is a blocking control whose object is defined
        only by reference to an UNAPPROVED contract admissible?
      ruling: ADMISSIBLE-WITH-SCOPE-NOTE
      the_facts_i_verified:
        - >-
          EXP-SMTH-71b1b0 names ENC-A twice -- in controls.CTRL-ENCA-POWER and
          in outcomes.REFUTE_AT_TOY_SCALE -- and defines it nowhere. Its
          measured_quantity.encoding names only INT-1 and ENC-B. Confirmed by
          reading the whole frozen contract.
        - >-
          Exactly one definition of ENC-A exists in the corpus, at
          EXP-SMTH-001.intermediate_generation.step_5_power_certificate_encoding
          -- "M_ij = max(lift(e_1), 1) * max(lift(e_2), 1). Range [1, (p-1)**2],
          contained in [1, p**2]." I searched and found no second definition.
        - >-
          H-SMTH-001, which IS this contract's hypothesis_id, names ENC-A as
          test_boundary.parameters.power_certificate_encoding and requires the
          apparatus to demonstrate "in the same run, that it can detect a
          deviation - the ENC-A power certificate". So the term enters through
          the hypothesis the contract is bound to, not only through the
          unapproved experiment.
        - >-
          The implementation matches that definition exactly --
          `def enc_a(e1, e2): return max(e1, 1) * max(e2, 1)` -- with no
          Executor embellishment.
        - >-
          The Executor flagged it prospectively as OBS-ENCA-DEFINITION-BY-REFERENCE
          with its provenance and its effect, rather than resolving it silently.
      why_not_INADMISSIBLE:
        - >-
          The non-reuse clause is scoped. Read in full, reuses_nothing_unapproved
          says "The measured quantity is stated directly below rather than by
          reference to either." Its subject is the MEASURED QUANTITY -- the
          treatment object INT-1/ENC-B -- and its purpose is to stop the
          decision variable from depending on an unapproved contract. ENC-A is
          not a decision variable about HEUR-DS-1; both the corpus definition
          and the implementation label it POWER CERTIFICATE ONLY, and the
          contract's own success criterion gates on ENC-B alone. Extending the
          clause to void the power certificate reads the clause against its
          stated purpose.
        - >-
          The resolution was forced, not chosen. With exactly one definition in
          the corpus and the hypothesis naming ENC-A in that exact role, the
          Executor exercised no discretion, so the usual harm of
          definition-by-reference -- an implementer silently picking the
          favourable reading -- did not occur and could not have.
        - >-
          It is fully reproducible. The implementation is committed, the
          derivation is deterministic, and I rebuilt the CTRL-ENCA arms
          bit-for-bit. Any reviewer who prefers a different ENC-A can re-run the
          control against it at a cost of about 7 seconds.
        - >-
          Ruling it inadmissible would void a blocking control on a receipt
          whose defect is a GAP IN THE FROZEN CONTRACT, not an act of the
          Executor. Under AGENTS.md rule 5 the correct response to an
          apparatus/contract defect is to name it and scope the conclusion, not
          to convert it into a mathematical verdict.
      why_not_plainly_ADMISSIBLE:
        - >-
          Pre-registration is INCOMPLETE for this control. The frozen contract
          does not fix the object of one of its four blocking controls, so what
          was actually executed is contract-plus-imported-definition. The
          freeze covers the threshold and the statistic but not the sample the
          statistic is computed on.
        - >-
          The imported definition makes the control DEGENERATE, which I verified
          from the raw data rather than inferring. Each ENC-A factor is below p,
          so the product's largest prime factor is below p, hence below sqrt(D)
          whenever p < 2**bits. Measured maxima are 59281 against sqrt(D) =
          65536 at bits 16, and 928111 against sqrt(D) = 1048576 at bits 20. The
          arm is 100.0000 percent u=2-smooth and 0.0000 percent tail at both
          field sizes. The KS2 rejection at about 106x the threshold is a
          restatement of the null's tail fraction (about 0.663), fixed in
          advance by arithmetic.
        - >-
          That degeneracy is by design and is stated in the source definition --
          EXP-SMTH-001 says the rejection "is DERIVABLE IN ADVANCE, and
          therefore certifies that the KS2-DS-1 statistic as implemented has the
          power to reject at all". The control was never intended to calibrate
          power. But because the definition lives outside the frozen contract,
          that intent lives outside it too, and a reader of EXP-SMTH-71b1b0
          alone would not know how weak a claim "the test has power" is here.
      what_follows_for_the_runs_standing:
        run_validity: >-
          UNCHANGED. RUN-SMTH-71b1b0-001 remains an admissible receipt. This
          ruling does not invalidate the run, does not void the other three
          blocking controls, and does not require re-execution.
        how_the_control_must_be_reported: >-
          CTRL-ENCA-POWER is PASSED, and every downstream record that cites it
          -- evidence record, decision, knowledge entry -- must carry the object
          definition it depends on ("ENC-A = max(e1,1)*max(e2,1), imported from
          EXP-SMTH-001 step_5, which EXP-SMTH-71b1b0 does not define") together
          with the statement that the control certifies non-degeneracy of the
          KS2-DS-1 statistic and does NOT calibrate power against a small
          deviation. A record that says "the test was shown to have power"
          without that qualifier overstates this run.
        what_the_coordinator_should_open: >-
          A correction record against EXP-SMTH-71b1b0 for the contract defect --
          a blocking control with an undefined object -- which is a receipt
          defect of the freezing task TASK-20260802-80f5e9 of the same family as
          the two already in CORR-20260803-a1c41e, and belongs alongside them.
          The frozen contract must NOT be edited.
        what_a_successor_contract_owes: >-
          If any downstream claim depends on the instrument being able to detect
          a SMALL deviation -- which is the only kind at issue if HEUR-DS-1 is
          nearly true -- then the successor must define its power-certificate
          object inside its own frozen text AND pre-register a graded power
          control at a deviation size comparable to the effect it means to
          exclude. A KS2 of 0.67 against a threshold of 0.0064 tells you nothing
          about detecting a deviation of 0.01.
        what_this_ruling_is_not: >-
          It is not a judgement that the run supports or fails to support
          HEUR-DS-1, and it is not an evidence-strength assignment. Both belong
          to the Red Team and the Coordinator.

    - id: RULING-OBS-RHO2-TRANSCRIPTION
      question: >-
        The contract's frozen rho(2) is 0.30684282 where 1 - ln 2 =
        0.30685282 (3.3e-5 relative). The Executor used the frozen values
        verbatim and took no action. Is that acceptable?
      ruling: ACCEPTABLE. The Executor's non-action was correct, and no verdict
        in this run can turn on the discrepancy.
      what_i_verified_independently: >-
        I integrated rho'(u) = -rho(u-1)/u myself, RK4 at step 1e-5, own
        implementation, and obtained rho(2) = 0.3068528194, rho(3) =
        0.04860838829, rho(4) = 0.004910925645, rho(5) = 0.0003547246983,
        rho(6) = 1.964969465e-05. Against the contract's frozen table, the u3,
        u4, u5 and u6 entries agree to every digit quoted. ONLY u2 is wrong, by
        9.99944e-06 absolute and 3.2587e-05 relative. The digit pattern
        (0.30684282 vs 0.30685282) is a single-digit transcription slip, exactly
        as the Executor described. The contract's own rho_provenance says it
        cross-checked rho(2) against 1 - ln 2 and that "Both agree" -- the
        cross-check is what failed to be applied to the transcribed value, not
        the integration.
      impact_on_the_only_GATING_metric_derived_from_it:
        metric: DECAY-1, which IS gating -- the success criterion requires that it not fire
        threshold_as_frozen: 0.006404
        recomputed_from_the_erroneous_rho2: 100*1.96496897e-05/0.30684282 = 0.0064038291
        recomputed_from_the_correct_rho2: 100*1.96496897e-05/0.3068528194 = 0.0064036204
        both_round_to: 0.006404
        conclusion: >-
          The frozen DECAY-1 threshold is UNCHANGED at the precision it is
          stated to. The error cannot move the gate. Observed ratios are
          3.3977e-04 and 2.7681e-04, that is 18.8x and 23.1x inside the
          threshold, so no plausible correction reaches it either.
      impact_on_the_non_gating_metric:
        metric: RATE-DS-1, explicitly SECONDARY and non-blocking
        band_u2_from_frozen_rho2: [0.038355353, 2.454742560]
        band_u2_from_correct_rho2: [0.038356602, 2.454822556]
        contract_frozen_band: [0.038355, 2.454743]
        observed_u2_fractions: [0.33748165362035226, 0.3313891267123288]
        conclusion: >-
          The factor-8 band spans a 7x relative width against a 3.26e-05
          relative error, roughly 215000x the gap, and the observations sit an
          order of magnitude inside either version of the band at both field
          sizes. The batch's "~64x" characterisation understates how far the
          error is from mattering; the direction of the claim is right.
      why_the_executors_non_action_was_correct: >-
        An Executor does not repair a frozen contract. Recomputing a frozen
        threshold at run time is precisely the failure the contract's own
        PRE_REGISTRATION_CORRECTION disclosure guards against -- "a
        pre-registered threshold recomputed after the fact is indistinguishable
        from one chosen to fit." Using the frozen value verbatim and recording
        the discrepancy for the Validator is the behaviour the contract asks
        for, and it is what happened.
      what_follows: >-
        Record it as a contract transcription defect in a correction record
        against EXP-SMTH-71b1b0 -- again alongside the CORR-20260803-a1c41e
        family, again without editing the frozen contract. A successor contract
        should carry rho(2) = 0.3068528194 and should derive its DECAY-1
        threshold in the record rather than transcribing a product of two
        transcribed numbers. No evidence record needs to be qualified for this,
        provided it does not quote the contract's rho(2) as a value of the
        Dickman function.

  # =====================================================================
  heuristic_validation_checks:
    - id: HV-1-PREDICTION-PRE-REGISTERED
      finding: >-
