    - id: REC-2-DEFINITIONAL-CONFORMANCE
      question: >-
        Are the reported metrics the CONTRACT's metrics, computed as the
        contract defines them?
      checks:
        - contract: "z = log(max(1, LPF(N_ij))) / log(D)"
          implemented: log(LPF)/log(D) with LPF <= 1 mapped to 0
          verdict: CONFORMS
        - contract: "Bsm-smooth fraction at each rung, Bsm(u) = D**(1/u)"
          implemented: exact integer predicate LPF**u <= D
          verdict: >-
            CONFORMS and is strictly more exact than a floating-point
            comparison against D**(1/u); the two agree because LPF**u <= D is
            equivalent to LPF <= floor(D**(1/u)) over the integers
        - contract: "fraction with z >= 0.5"
          implemented: exact integer predicate LPF*LPF >= D
          verdict: CONFORMS, exactly equivalent
        - contract: "two-sample KS of treatment against NULL-UNIF-D (KS2-DS-1)"
          implemented: exact two-sample KS on the sorted integer LPF values
          verdict: >-
            CONFORMS; z is strictly increasing in LPF, so the statistic on LPF
            equals the statistic on z and no float tie can perturb it
        - contract: "tail-fraction difference, treatment minus null (TAIL-DS-1)"
          implemented: treatment minus null against the MEASURED null, threshold on the absolute value
          verdict: CONFORMS, and is measured against NULL-UNIF-D rather than analytic rho, as the contract requires
        - contract: "ratio of the u = 6 smooth fraction to the u = 2 rung (DECAY-1)"
          implemented: fraction_u6 / fraction_u2 on the treatment arm
          verdict: CONFORMS
        - contract: "one-sample KS of the treatment z-CDF against the Dickman LPF CDF (KS-DS-1)"
          implemented: sup over jumps of |F_n(z) - rho(1/z)|
          verdict: CONFORMS to the standard reading of the Dickman LPF CDF
        - contract_per_arm_metrics: >-
            empirical z-CDF; smooth fraction at each rung; fraction with
            z >= 0.5; count of incomplete factorizations
          implemented: >-
            all four present for all six arms in raw-result.json
            arm_summaries, with a 1001-point z-CDF grid, per-rung counts and
            fractions, tail count and fraction, z_min/z_max/z_mean and the
            incomplete count
          verdict: CONFORMS; no contract metric is missing and no metric outside the contract gates anything
        - thresholds: >-
            KS2-DS-1 0.006373, TAIL-DS-1 0.01, DECAY-1 0.006404, KS-DS-1 0.05,
            and the frozen rho and band tables are hard-coded constants in
            smth71b1b0_core.py quoted from the contract. No threshold is
            recomputed at run time.
          verdict: CONFORMS
      verdict: PASS

  # =====================================================================
  # ITEM 2 -- BLOCKING CONTROLS
  # =====================================================================
  control_checks:
    - id: CTRL-ENCA-POWER
      blocking: true
      recorded_verdict: PASS
      recorded_values:
        bits16_ks2_enca_vs_null: 0.6720278864970646
        bits20_ks2_enca_vs_null: 0.6777076198630136
        threshold: 0.006373
      validator_recomputation_from_raw_arm_data:
        bits16: 0.6720278864970646
        bits20: 0.6777076198630136
        match: EXACT
      supported_by_data_or_merely_asserted: SUPPORTED BY DATA
      verdict: PASS-WITH-SCOPE-NOTE
      scope_note: >-
        The control does what the contract asks and no more. I checked what the
        rejection actually rests on, from the raw arm files. Under the ENC-A
        definition used, max LPF over the whole CTRL-ENCA arm is 59281 at bits
        16 against sqrt(D) = 65536, and 928111 at bits 20 against sqrt(D) =
        1048576. Every ENC-A record is therefore u=2-smooth BY CONSTRUCTION,
        the arm's u=2 smooth fraction is exactly 1.000000 and its tail fraction
        is exactly 0.000000 at both field sizes. The separation from the null is
        a mathematical certainty of the encoding, not an empirical outcome. That
        is the corpus definition's own stated intent -- EXP-SMTH-001 step_5
        says ENC-A's rejection "is DERIVABLE IN ADVANCE, and therefore certifies
        that the KS2-DS-1 statistic as implemented has the power to reject at
        all." So the control certifies NON-DEGENERACY of the statistic. It does
        NOT calibrate power against a near alternative, and no downstream record
        may describe this pass as evidence that the test would detect a small
        deviation. See the ruling section.

    - id: CTRL-APPARATUS-IDENTITY
      blocking: true
      recorded_verdict: PASS
      recorded_check: >-
        curve, factor base and null stream re-derived from the frozen seed
        reproduce every stream digest at both field sizes
      how_the_run_established_it: >-
        Re-derived inside the SAME measurement process using the SAME functions.
        On its own that is a self-consistency check, not independence.
      independent_reconfirmation_present_in_package: >-
        verify_run.py (stdlib only, re-implements the curve search, the factor
        base and the DRBG) reports V1-CURVE-bits16/20, V1-ORDINARY-bits16/20,
        V1-FACTORBASE-bits16/20 and V1-FB-ONCURVE-bits16/20 all PASS.
      validator_own_reconfirmation: >-
        I regenerated both null integer streams from the recorded seed with my
        own DRBG implementation and matched the recorded integer_stream_sha256
        and the rejection counts exactly at both field sizes (CHK-3), and I
        rebuilt all six arm dumps bit-for-bit by re-executing the driver into a
        scratch directory (CHK-4). The apparatus is reproducible by a third
        party, not merely self-consistent.
      supported_by_data_or_merely_asserted: SUPPORTED BY DATA
      verdict: PASS

    - id: CTRL-FACTOR-COMPLETE
      blocking: true
      recorded_verdict: PASS
      recorded_values:
        records_checked: 784896
        product_mismatches_total: 0
        incomplete_factorizations_total: 0
      validator_recomputation: >-
        An incomplete factorization is encoded in the arm dumps as LPF 0. I
        counted zero entries directly in all six arm files -- 0, 0, 0, 0, 0, 0
        -- confirming the reported incomplete count of 0 against the raw data
        rather than against the summary. Every arm carries 130816 nonzero LPF
        values, so no record was silently dropped from any denominator.
      independent_reconfirmation_present_in_package: >-
        verify_run.py V4-REFACTOR-* re-factored 2398 sampled records across all
        six arms by pure trial division to sqrt(N), with no probabilistic
        primality test and no Pollard rho, and reproduced the recorded largest
        prime factor on every one, 0 mismatches.
      supported_by_data_or_merely_asserted: SUPPORTED BY DATA
      verdict: PASS
      minor_note: >-
        The driver's pass predicate for this control is product_mismatches == 0
        and does not additionally require incomplete == 0. Both are 0 here, so
        nothing turns on it, and the contract only requires that incompletes be
        counted and reported rather than zero. Flagged so a successor contract
        can tighten the predicate if it wants to.

    - id: CTRL-PAIR-COUNT
      blocking: true
      recorded_verdict: PASS
      recorded_values:
        TREAT-ENCB.bits16_records: 130816
        TREAT-ENCB.bits20_records: 130816
        no_pair_with_j_le_i: true
      validator_recomputation: >-
        Both treatment arm files are exactly 1046528 bytes = 130816 x 8 and
        yield exactly 130816 int64 values on my own reader. The count matches
        C(512,2) = 512*511/2 = 130816, which I recomputed, and matches the
        contract's count_n. The diagonal is excluded by the loop bound
        `for j in range(i+1, 512)` in the committed source, not by a post-hoc
        filter, which I confirmed by reading _pair_stream in smth71b1b0_core.py.
      independent_reconfirmation_present_in_package: >-
        verify_run.py V5-PAIRCOUNT enumerates independently and reports 130816
        pairs with 0 having j <= i.
      supported_by_data_or_merely_asserted: SUPPORTED BY DATA
      verdict: PASS
      limitation_i_must_state: >-
        The arm dumps carry LPF values only, with no (i,j) index column, so a
        per-record index audit is NOT possible from the raw artifacts alone. The
        no-(i,j)-with-j<=i property rests on the committed enumeration source,
        on verify_run.py's independent enumeration, and on my bit-identical
        rebuild -- which is strong, but is not the same thing as an index column
        a reviewer could audit directly. A successor contract that dumps the
        index alongside the LPF would close this at negligible cost.

    - id: CTRL-NULL-DICKMAN
      blocking: false
      recorded_verdict: reported, ADVISORY
      recorded_values:
        bits16_null_ks_vs_dickman: 0.03115509017956858
        bits20_null_ks_vs_dickman: 0.02471894154694032
      validator_recomputation:
        bits16: 0.031155089628178034
        bits20: 0.024718940938788014
        match: agrees to 1e-9, residual is my own rho integration
      verdict: REPORTED, NON-GATING, correctly not allowed to trigger APPARATUS_FAILURE
      note: >-
        The contract's non-blocking designation is honoured in code -- the
        driver records passes_is_not_gating and the success-criterion predicate
        does not read this control. The repair of the superseded contract's
        third defect is actually in force, not merely described.

    - id: NULL-OBJECT-CONTROL-ADEQUACY
      blocking: false
      question: >-
        Per docs/inventor-protocol.md section 3, was the reported quantity
        measured against a null object of the same shape?
      finding: >-
        YES, and this is the design centre of the contract. NULL-UNIF-D is
        130816 uniform integers on [1, p**2] -- the exact codomain of ENC-B --
        drawn at the SAME field size and factored by the SAME pipeline, and the
        gating statistic KS2-DS-1 is measured against it rather than against
        asymptotic Dickman rho. The analytic comparison is explicitly demoted to
        non-blocking with a cited reason (REV-20260801-012 measured a correct
        uniform null failing analytic comparisons 0 of 8 at both field sizes).
      decay_direction_statement: >-
        The contract also states what a quantity should do as the parameter
        meant to destroy it increases -- DECAY-1 requires the u=6 smooth
        fraction to fall away from the u=2 rung, and fires if it does not. I
        confirmed from the raw data that it does decay, at ratios 3.40e-4 and
        2.77e-4 against a fire threshold of 6.404e-3, i.e. 19x and 23x inside
        the threshold. The canonical artifact tell was checked prospectively and
        did not fire.
      verdict: PASS
      what_this_does_not_say: >-
        A null control that is present and correctly shaped makes a measurement
        admissible. It does not make the measured agreement mean anything about
        HEUR-DS-1; that judgement is the Red Team's and the Coordinator's.

  # =====================================================================
  # ITEM 6 -- NULL BEFORE TREATMENT
  # =====================================================================
    - id: ORDERING-NULL-BEFORE-TREATMENT
      blocking: true
      contract_rule_quoted: >-
        THE NULL ARM IS DRAWN, FACTORED AND COMMITTED BEFORE THE TREATMENT ARM
        IS FACTORED; its summary statistics are hash-committed first. Enforcement
        -- the run manifest records the null-arm commit digest BEFORE any
        treatment factorization. A manifest lacking it is invalid_integrity.
      what_i_checked_rather_than_read:
        - >-
          The commitment is a REAL hash commitment and it recomputes. I stripped
          null_commit_sha256 from null-commit.json, re-serialized the remainder
          with sort_keys and compact separators exactly as the driver does, and
          re-hashed -- obtaining
          4bc1b3920502af8b0d35dadcf427ec5b691b308c73ea871c1eeabb78bda5695f,
          which equals the recorded digest and the digest echoed in
          raw-result.json and in the manifest. The committed object is the null
          summary, not a placeholder.
        - >-
          The committed null summary statistics reproduce from the raw null arm
          files. The committed tail fraction 0.6631910469667319 at bits 16 and
          0.6692453522504892 at bits 20, and the committed u=2 smooth counts
          44060 and 43268, are exactly what my own reader computes from
          arms/NULL-UNIF-D.bits{16,20}.lpf.i64.
        - >-
          The ordering is enforced by CONTROL FLOW in the committed source, not
          by a claim in prose. run_exp.py calls run_arms(NULL_ARMS), then builds
          and writes null-commit.json, and only then calls
          run_arms(TREATMENT_ARMS) and run_arms(ENCA_ARMS). ARM_ORDER in
          smth71b1b0_core.py fixes the same order. The source file's sha256 is
          recorded in the manifest and in environment.json.
        - >-
          The single append-only stdout.log records the sequence in one
          monotonic stream -- the two NULL-UNIF-D arm lines, then
          "[measure] NULL ARM COMMITTED, sha256=4bc1b392...", then the two
          TREAT-ENCB lines, then the two CTRL-ENCA lines.
        - >-
          The timing is internally consistent. null-commit.json records
          committed_after_wall_seconds 11.144; the two null arms took 3.206 +
          6.756 = 9.962 s plus construction, and the treatment arms are timed
          after it.
        - >-
          The RSS pre-flight probe stopped at 156979 of 784896 records, which in
          the fixed production order falls inside NULL-UNIF-D.bits20. The probe
          therefore factored no treatment record and could not have leaked
          treatment information into the gate that authorised the run. I
          confirmed 156979 < 2 * 130816 = 261632 arithmetically.
      verdict: ESTABLISHED BY CODE AND LOG, NOT MERELY ASSERTED
      the_honest_limit: >-
        Every one of those artifacts is generated by the same process under the
        same task. There is no external timestamp, no third-party notary, and no
        commit of the null summary that predates the treatment data -- the whole
        run package was committed to git in one snapshot afterwards. So the
        ordering is established against ACCIDENT and against post-hoc tuning by
        a cooperating executor; it is not tamper-evident against a determined
        one. I record that as the true strength rather than overstating it. It
        is the strongest form available to a single-process deterministic run,
        and the cheap upgrade for a successor contract is to commit
        null-commit.json to git as its own commit before the treatment stage
        runs.

  # =====================================================================
  # ITEM 7 -- THE PRE-FLIGHT DECLARATION ORDERING
  # =====================================================================
    - id: RSS-PREFLIGHT-DECLARED-BEFORE-PROBE
      blocking: true
      question: >-
        Was the RSS tolerance genuinely declared BEFORE the probe ran, or is
        that only claimed?
      ordering_evidence_i_checked:
        - >-
          Control flow in the committed driver. run_exp.py STEP 1 (lines
          702-714) writes rss-preflight-declaration.json and computes decl_sha
          from the file on disk. STEP 2 (lines 718-727) then launches the probe
          as a SEPARATE SUBPROCESS. The declaration file and its digest
          therefore exist before the probe process is created, in a different
          address space. The digest is stamped into rss-preflight.json after the
          probe returns, which is why the probe file can name a digest the probe
          itself never computed.
        - >-
          The declared tolerance is a SOURCE-LEVEL CONSTANT (RSS_DECLARATION in
          run_exp.py), not a value computed at run time. It cannot have been
          fitted to an observed RSS without editing run_exp.py, and run_exp.py's
          sha256 1dfa11c77898e1605356c98a20f0a6a3939e2ae4055668b3aebe5a9a234ecd8e
          is recorded in the manifest and environment.json and matches the
          committed file, which I re-hashed.
        - >-
          The digest binding is verifiable. rss-preflight.json carries
          declaration_file_sha256
          7c1db2ee0187acd9d5579f670e21085f5ae5e2c0fb4c8a5bb73b2cda6ca983ae; I
          hashed rss-preflight-declaration.json myself and got the same value,
          which also matches the archive receipt.
        - >-
          Log order. stdout.log line 6 records the declaration digest, and every
          [probe] and [preflight] line follows it in the same append-only,
          line-buffered stream.
        - >-
          The halt rule is real, not decorative. A non-zero probe return code
          writes raw-result.json with status halt, classification
          resource_exhaustion, datum_produced false, and returns 3 without ever
          entering the measurement stage.
      substantive_result:
        declared_absolute_tolerance_bytes: 1073741824
        declared_max_growth_bytes: 67108864
        declared_checkpoints_percent: [5, 10, 20]
        observed_peak_rss_bytes_at_checkpoints: [49745920, 49745920, 49762304]
        observed_growth_first_to_last_bytes: 16384
        margin_against_declared_absolute: >-
          observed peak is 4.6 percent of the declared tolerance and 1.16
          percent of the contract cap
        verdict_recorded: PASS
      verdict: DECLARED BEFORE THE PROBE, SUPPORTED BY ORDERING EVIDENCE
      the_honest_limit: >-
        Same limit as the null commitment -- the ordering is established by the
        driver's own control flow, its own pinned source, and its own log, all
        produced by one task. That defeats accident and post-hoc adjustment; it
        is not a notarised pre-registration. Given that the declaration is a
        constant in hash-pinned source rather than a computed value, I regard
        this as materially stronger than the null-ordering case.

