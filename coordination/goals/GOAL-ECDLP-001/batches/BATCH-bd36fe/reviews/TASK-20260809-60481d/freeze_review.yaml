  v6_finding_disposition:
    - v6_finding_id: F-V6-3b76fc
      v7_disposition: closed_by_declared_v7_checks
      basis: >-
        strict_arithmetic derives the lexicographically first exact-order-six
        point, recomputes roots, binds the selected root to the point y, and
        binds integer-search metadata and F/R_star values; the five arithmetic
        strict mutations were rejected.
    - v6_finding_id: F-V6-80100a
      v7_disposition: closed_by_declared_v7_checks
      basis: >-
        strict_event requires a nonempty phase stream, nondecreasing phase
        indices, every declared phase, and the required first-occurrence order;
        the empty and phase-collapse mutations were rejected.
    - v6_finding_id: F-V6-18f44d
      v7_disposition: partially_closed_blocking_residual
      basis: >-
        The v7 schema, complete case payload checks, and unattempted-arm
        semantic checks reject the twelve named strict case mutations, but the
        validator does not bind each accepted case file name to its
        fixture_id. A completed_valid object supplied for the
        completed_invalid.json path passed strict_cases in memory.
    - v6_finding_id: F-V6-12b146
      v7_disposition: partially_closed_blocking_residual
      basis: >-
        v7 checks deterministic arm keys and run IDs and resolves source hashes,
        but per_arm_run_index_xor_v7.json contains only arm_count, a rule, and a
        digest rule. No 400-entry map resolves each attempted arm to a validated
        run manifest/event digest or compares status, timing, CPU, RSS, and
        byte fields to such a record.
    - v6_finding_id: F-V6-5db4ea
      v7_disposition: partially_closed_blocking_residual
      basis: >-
        v7 rejects the historical --control-fixtures flag in corrected_command,
        but it does not require corrected_command to equal the actual accepted
        argv. The metadata value not-an-invocation passed strict_matrix in
        memory.

  additional_adversarial_checks:
    method: >-
      Read-only in-memory deep copies, function calls, and a temporary
      read_json replacement; no archived source byte, fixture, queue record,
      predecessor report, or repository artifact was changed.
    outcomes:
      - probe: metadata_arbitrary_corrected_command
        outcome: FAIL_OPEN
        exact_path_section: >-
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-2cca8f/validate_xor_v7.py:178-181;
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-2cca8f/matrix_validator_metadata_xor_v7.json:5-9
        detail: >-
          Replacing corrected_command with not-an-invocation, while retaining
          the historical command and all other canonical objects, returned from
          strict_matrix without rejection because only the stale flag, the
          legacy flag, and command_scope are checked.
        repair_guidance: >-
          Bind metadata to the exact normalized argv constructed by the v7
          validator, including the v6 root, all schema/fixture paths, manifest,
          and repo root; reject any other command string and verify the command
          version and manifest path.
      - probe: manifest_v6_pointer_forged
        outcome: FAIL_OPEN
        exact_path_section: >-
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-2cca8f/validate_xor_v7.py:146-153;
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-2cca8f/validation_contract_xor_v7.json:26-29;
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-2cca8f/fixture_manifest_xor_v7.json:4
        detail: >-
          Replacing manifest.v6_manifest with wrong/manifest.json passed
          strict_manifest. The field is descriptive but not bound to the v6
          manifest actually used by run_v6_exact.
        repair_guidance: >-
          Require v6_manifest to equal the canonical v6 manifest path relative
          to the declared v6 root and bind its content hash, or remove the
          field from the normative manifest rather than leaving a forgeable
          provenance pointer.
      - probe: accepted_case_filename_fixture_id_swap
        outcome: FAIL_OPEN
        exact_path_section: >-
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-2cca8f/validate_xor_v7.py:127-144;
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-2cca8f/case_xor_v7.schema.json:10-20
        detail: >-
          A temporary in-memory read_json replacement returned the valid case
          object for completed_invalid.json. strict_cases selected the contract
          entry by the object's fixture_id and did not compare that ID with the
          filename, so the swapped file identity passed.
        repair_guidance: >-
          Require Path(case_id).stem to equal case.fixture_id for every accepted
          case and check the exact filename-to-contract map before selecting the
          contract entry. Keep the existing schema and complete-payload checks.
      - probe: matrix_arm_cpu_changed_with_aggregates
        outcome: FAIL_OPEN
        exact_path_section: >-
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-2cca8f/validate_xor_v7.py:156-177;
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-2cca8f/per_arm_run_index_xor_v7.json:1-8;
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-c40deb/validate_xor_v6.py:282-386
        detail: >-
          An in-memory mutation changed one arm cpu_seconds by 998 and adjusted
          its shard and matrix CPU aggregates consistently. The immutable v6
          validate_matrix and v7 strict_matrix both accepted it. This is
          possible because the v7 index has no per-arm run record or event
          digest against which the changed resource field can be checked.
        repair_guidance: >-
          Replace the count/rule-only index with a complete canonical map for
          every attempted arm. Resolve each run_id to an immutable run manifest
          and event digest and compare status, timing endpoints, CPU, RSS, raw
          bytes, stdout/stderr bytes, and terminal fields before accepting the
          matrix summary.
      - probe: source_binding_design_relabelled_to_validator
        outcome: FAIL_OPEN
        exact_path_section: >-
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-2cca8f/validate_xor_v7.py:159-165;
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-2cca8f/matrix_source_bindings_xor_v7.json:5-15
        detail: >-
          An in-memory source binding changed the design token's path and hash
          to the v6 validator path and hash. Because v7 checks each declared
          path hash but has no normative key-to-path map, strict_matrix accepted
          the relabelled source identity.
        repair_guidance: >-
          Add a normative expected source-binding map keyed by design,
          run_schema, matrix_schema, event_schema, validator,
          predecessor_exclusion, implementation, arithmetic, dependency_lock,
          and fixtures_manifest. Check both the exact path and its hash, and
          bind that map to the contract/archive.

  additional_adversarial_summary: >-
    The exact v7 package is hash-consistent and its declared strict suite is
    effective: arithmetic and event v6 findings are discharged, and all six
    accepted cases, twenty-one v6 negative mutations, and twelve v7 strict
    mutations are exercised with the expected outcomes. The fresh probes show
    that accepted-case filename authority, manifest pointer authority,
    matrix-to-run provenance, source-token semantic identity, and exact replay
    command authority remain fail-open. These are control-plane admissibility
    defects, not ECDLP evidence.

  findings:
    - id: F-V7-6c91e4
      severity: blocking_before_specification_or_freeze
      disposition: not_fully_discharged
      closes_v6_finding: F-V6-5db4ea
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-2cca8f/validate_xor_v7.py:178-181;
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-2cca8f/matrix_validator_metadata_xor_v7.json:5-9
      why_it_matters: >-
        A future freeze gate must replay the exact validator invocation, not
        merely reject one historical flag. The current check permits a
        syntactically unrelated or semantically wrong command to be recorded as
        corrected metadata, so the provenance pointer can still fail open.
      independent_probe: >-
        metadata_arbitrary_corrected_command set corrected_command to
        not-an-invocation and strict_matrix returned without raising.
      repair_guidance: >-
        Record the canonical normalized argv generated by the v7 validator and
        require corrected_command, validator_version, manifest path, v6 root,
        and command scope to equal that argv and its inputs exactly. Keep the
        historical command as non-authoritative context.
      design_only_boundary: >-
        No experiment specification, approval, freeze, Executor task, run, or
        evidence record was created by this review.
    - id: F-V7-2ab7d0
      severity: blocking_before_specification_or_freeze
      disposition: not_fully_discharged
      closes_v6_finding: F-V6-18f44d
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-2cca8f/validate_xor_v7.py:127-144;
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-2cca8f/case_xor_v7.schema.json:10-20,23-40
      why_it_matters: >-
        Strict schema validation and payload equality do not establish that the
        bytes read from each declared filename are the case the contract names.
        A duplicate or swapped accepted case can therefore pass the case gate
        while changing which file represents which terminal state.
