  findings:
    - id: F-V9-86d47c
      severity: blocking_before_specification_or_freeze
      disposition: not_fully_discharged
      closes_v8_finding: F-V8-c6f2fb
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-bcf758/validate_xor_v9.py:97-114;
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-bcf758/matrix_validator_metadata_xor_v9.json:5-9;
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-0e21cd/validate_xor_v8.py:253-290
      why_it_matters: >-
        v9 claims to run the exact archived v8 predecessor, but run_v8_exact
        constructs a new command using sys.executable, absolute v8/v7/input
        paths, and an absolute --repo-root. A read-only capture of that
        command differed from the archived v8 accepted argv at the executable,
        every input path, and --repo-root. The direct archived v8 command was
        separately run and passed, but the v9 gate itself does not invoke that
        exact argv. Because v8 has no actual-argv check, its metadata-only
        command checks do not repair this nested replay-binding gap.
      independent_probe: >-
        v9.run_v8_exact was called with subprocess.run replaced by a recorder;
        the captured argv did not equal the v8 metadata accepted_argv. The
        captured command ended with --repo-root
        /Volumes/SSD990/wt-ecdlp-bd36fe-v9-review, while the archived command
        ends with --repo-root .; the v9/v8 direct command results above remain
        VALIDATION_PASS.
      repair_guidance: >-
        Make the v9 predecessor gate use the exact archived v8 argv under the
        repository cwd, and bind or verify the actual nested argv before
        accepting its VALIDATION_PASS. Do not use metadata equality alone as
        invocation evidence.
      design_only_boundary: >-
        The command capture did not invoke an experiment or modify any
        repository artifact.

    - id: F-V9-d18f4e
      severity: blocking_before_specification_or_freeze
      disposition: not_fully_discharged
      closes_v8_finding: F-V8-39f5b9
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-bcf758/validate_xor_v9.py:168-180;
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-bcf758/validation_contract_xor_v9.json:24-34
      why_it_matters: >-
        The v9 path test rejects absolute and traversal paths, but it does not
        preserve raw path spelling. Path('./completed_valid.json').as_posix()
        becomes completed_valid.json, so a non-canonical accepted-case path
        spelling is accepted after the contract and manifest maps are changed
        consistently.
      independent_probe: >-
        An in-memory mutation of both accepted_case_file_map entries to
        ./completed_valid.json returned PASS from strict_manifest followed by
        strict_cases. Absolute, ../, and subdir/../ mutations returned the
        expected rejection, so this is a distinct normalization fail-open.
      repair_guidance: >-
        Compare the raw binding path directly with fixture_id + .json before
        constructing Path, and require the canonical v6 fixture-root relation.
      design_only_boundary: >-
        The path was mutated only in memory; no fixture file was edited.

    - id: F-V9-48e7c3
      severity: blocking_before_specification_or_freeze
      disposition: not_fully_discharged
      closes_v8_finding: F-V8-39f5b9
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-bcf758/validate_xor_v9.py:159-165,168-187;
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-bcf758/fixture_manifest_xor_v9.json:21-35
      why_it_matters: >-
        The v9 validator checks an accepted-case count of six but never checks
        that the six fixture IDs are unique and equal to the canonical six
        IDs. A manifest and contract with six copies of completed_valid.json
        therefore present six rows while covering only one accepted case.
      independent_probe: >-
        Replaced both accepted_case_file_map arrays in memory by six copies of
        the canonical completed_valid binding. strict_manifest and strict_cases
        both returned PASS; no file was loaded from outside the canonical
        fixture directory.
      repair_guidance: >-
        Require the set of fixture IDs to equal the canonical six-case set,
        require unique paths, and require one-to-one map coverage before case
        loading.
      design_only_boundary: >-
        This was an in-memory contract/manifest probe only.

    - id: F-V9-59f2e6
      severity: blocking_before_specification_or_freeze
      disposition: not_fully_discharged
      closes_v8_finding: F-V8-39f5b9
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-bcf758/validate_xor_v9.py:146-180;
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-bcf758/validation_contract_xor_v9.json:24-34
      why_it_matters: >-
        The design requires the canonical v6 fixture root, but strict_cases
        trusts contract.case_authority.fixture_root and strict_manifest does
        not compare that field with the canonical v6 fixture root. An absolute
        root can therefore relocate accepted-case authority while all six
        relative filenames and hashes remain valid.
      independent_probe: >-
        Replaced contract.case_authority.fixture_root in memory with the
        absolute current v6 fixtures directory while leaving the six relative
        bindings unchanged. strict_manifest and strict_cases returned PASS.
        This is a root-authority mutation distinct from the rejected absolute
        case-file path mutation.
      repair_guidance: >-
        Require fixture_root to equal the exact repository-relative v6 fixture
        root, reject absolute or escaped roots, and bind that root to the
        predecessor/archive identity before accepted-case loading.
      design_only_boundary: >-
        The root relocation existed only in an in-memory contract copy.

