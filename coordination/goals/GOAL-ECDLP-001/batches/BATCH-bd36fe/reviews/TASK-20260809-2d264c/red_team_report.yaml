  verdict: REVISE
  verdict_scope:
    type: design_admissibility_only
    precise_scope: >-
      Whether the repaired bytes are sufficiently specified and adversarially
      controlled for a separate future freeze review. REVISE means that the
      current design still has repairs required before freeze admissibility.
    verdict_does_not_mean: >-
      This verdict is not a result about ECDLP cost, oracle usefulness,
      security, asymptotic complexity, exponent movement, a deployed scheme,
      or the truth or falsity of any mathematical hypothesis.
    claim_ceiling_observed: >-
      The batch, handoff, snapshot receipt, and queue consistently state a
      design-only, toy-only, no-run ceiling. That ceiling remains binding.

  per_arm_checks:
    A:
      mechanism: PASS
      mechanism_note: >-
        Arm A is identified as the exhaustive reference over the declared toy
        cells and is the intended source of R_star.
      complete_output_target: REVISE
      complete_output_note: >-
        A canonical sorted set and H_star are named, but the relation-identity
        schema, tuple ordering, sign-normalization rule, multiplicity policy,
        and nonempty-target rule are not fully frozen. The future artifact list
        does not explicitly require the canonical R_star bytes.
      cost_contract: REVISE
      cost_note: >-
        The exact E.add counter is required, but shared curve/factor-base
        preparation and the per-arm process boundary are not attributed
        explicitly, so the baseline can be charged on a different boundary
        from B.
      controls: REVISE
      stopping_and_validity: PARTIAL
      no_run_boundary: PASS
    B:
      mechanism: PASS
      mechanism_note: >-
        The table-plus-x-key MITM mechanism and exact candidate verification
        are described as the oracle arm.
      complete_output_target: REVISE
      complete_output_note: >-
        H_star plus cardinality is not a byte-for-byte A/B output contract,
        and B's input bytes are not tied to A by a dedicated shared-input
        digest control.
      cost_contract: REVISE
      cost_note: >-
        Table construction, bucket handling, candidate verification, and
        deduplication are named, but event-level conservation and setup
        attribution are not yet reproducible.
      controls: REVISE
      stopping_and_validity: PARTIAL
      no_run_boundary: PASS
    D:
      mechanism: PASS
      mechanism_note: >-
        Arm D is correctly repositioned as a matched true-null diagnostic and
        not as a cheaper incomplete solver.
      query_generation: REVISE
      query_generation_note: >-
        Uniform-with-replacement is stated, but the exact unbiased PRNG
        mapping, canonical tuple encoding, campaign-seed meaning, and A/B
        null-replica convention are absent.
      coverage_contract: REVISE
      coverage_note: >-
        Q and right-censoring are named, but the prefix schedule, B-at-prefix
        comparator, censoring estimator, interval level, and null decision
        rule are not frozen.
      raw_partial_cost_guard: PARTIAL
      raw_partial_cost_note: >-
        The prose prohibits a raw partial-output speedup, but retaining
        C_add,D(q) and C_wall,D(q) without a schema-level diagnostic label or
        a fully defined coverage estimand leaves a foreseeable downstream
        misreading route.
      no_run_boundary: PASS
    C:
      status: PASS
      status_note: >-
        Arm C is explicitly historical continuity reference only, with exact
        prior paths and hashes and no new run or budget. It must remain outside
        the future matrix and outside any future result aggregation.

  per_contract_checks:
    output_target_R_star_H_star_and_exact_A_B_matching:
      status: REVISE
      checked: >-
        R_star is defined as a deduplicated canonical set and H_star as its
        SHA-256 digest; B is required to match H_star and cardinality.
      remaining_defect: >-
        Digest plus cardinality is an integrity summary, not an exact output
        equality predicate, and the raw canonical outputs and identity schema
        are not required artifacts. Empty R_star also makes the D coverage
        denominator undefined.
      cheapest_repair: >-
        Freeze one canonical byte serialization of relation identities and
        retain R_star plus each arm's canonical output blob. Gate A/B on exact
        byte/list equality; retain H_star only as an additional digest. Reject
        or explicitly classify cells with |R_star| = 0 before Q is evaluated.
    arm_D_coverage_right_censoring_and_null_interpretation:
      status: REVISE
      checked: >-
        Q={0.25,0.50,0.75}, first-prefix cost, target_not_reached
        right-censoring, and the prohibition on raw D-vs-complete-output
        speedup are all present.
      remaining_defect: >-
        No exact prefix schedule is supplied; B has no defined coverage curve
        despite the prediction that D is lower than B at the same prefixes;
        the eight-replica interval/censoring method has no named estimand or
        coverage level; and no pre-registered null interpretation statistic is
        specified. Raw partial D costs can therefore be copied into an
        informal speedup table despite the prose prohibition.
      cheapest_repair: >-
        Freeze the complete prefix list and define R_A(q), R_B(q), and R_D(q)
        or remove the B-prefix prediction. Declare D a diagnostic-only null
        unless a named coverage-matched statistic exists, specify the
        right-censored estimator and interval coverage, and prohibit any
        D-to-A/B raw cost delta field in machine-readable analysis.
    C_add_C_wall_and_all_E_add_paths:
      status: REVISE
      checked: >-
        C_add counts E.add evaluations by arm and C_wall is monotonic elapsed
        time; table construction, left preparation, verification, collision,
        sign, deduplication, hashing, PRNG, allocation, logging, and
        serialization are mentioned.
      remaining_defect: >-
        The design does not say whether curve selection, factor-base
        construction, shared input decoding, and output preparation are
        charged once per fresh arm process, once per cell, or excluded from
        C_add while included in C_wall. It also gives no event taxonomy or
        conservation equations for bucket hits, candidate duplicates,
        false positives, verified identities, and deduplicated outputs.
        A timeout or invalid arm could consequently have a partial count that
        is accidentally aggregated.
      cheapest_repair: >-
        Freeze the arm process boundary and a shared-setup attribution rule.
        Emit one phase-tagged event for every E.add invocation, including
        early-return and exception paths, and define conservation equations
        for every collision/bucket/candidate/dedup channel. Make the
        independent replay reject any manifest whose event totals do not
        reconcile, and exclude all non-valid arms from comparative deltas.
    uniform_with_replacement_paired_substreams_and_table_identity:
      status: REVISE
      checked: >-
        The repair requires integer draws uniformly from F_p with replacement,
        deterministic paired substreams, duplicate retention, shared table
        bytes for B and D, and ordinary collision retention.
      remaining_defect: >-
        Hashing a tuple into an approved PRNG does not specify an unbiased
        integer-to-F_p sampler or its canonical byte encoding. The meaning of
        campaign_seed versus the five primary seeds and the null_replica value
        for A/B is also unstated. The shared-table hash control covers B/D but
        does not bind A's curve and factor-base inputs to the target source.
      cheapest_repair: >-
        Specify the exact PRNG/version, fixed-width encoding, rejection or
        other unbiased randbelow-p sampler, and substream tuple values for
        every arm. Record the raw query stream or a complete stream digest.
        Add a shared curve/factor-base input digest covering A, B, and every D
        replica, with the table digest as a separate control.
    matrix_seed_replica_order_and_aggregation_uncertainty:
      status: REVISE
      checked: >-
        The arithmetic 8 cells x 5 seeds x 2 A/B = 80, 8 cells x 5 seeds x 8
        D replicas = 320, and 400 total arm invocations is correct. The
        lexicographic order and arm indices are also explicit.
      remaining_defect: >-
        A and B are deterministic for a fixed (p,b) input, so five seed labels
        do not provide five independent A/B observations for a paired
        bootstrap. D replicas are conditional within a cell, while the design
        does not define clustering across the eight (p,b) cells. F1 invokes an
        interval but no confidence/coverage level or bootstrap variant is
        specified; saying that no arbitrary 0.95 threshold is used leaves the
        decision rule underdetermined.
      cheapest_repair: >-
        Declare exact C_add deltas deterministic per cell and make wall-time
        intervals descriptive, or add independent process repetitions. For D,
        define the cell-level estimand and a cluster-aware aggregation over
        cells and replicas. Name the interval estimator and coverage level, or
        remove inferential language and make F1 a descriptive unresolved gate.
    invalid_infrastructure_timeout_and_budget_handling:
      status: REVISE
      checked: >-
        F0-F3 distinguish invalid controls from mathematical interpretation,
        right-censor D target misses, prohibit early mathematical stopping,
        and count timeout/resource exhaustion/invalid control against the
        future cap. The 400-arm arithmetic and nominal four-shard budget are
        internally consistent.
      remaining_defect: >-
        The design does not bind the repository terminal statuses
        completed_valid, completed_invalid, failed_infrastructure,
        failed_implementation, resource_exhaustion, and cancelled_by_budget
        to an arm/cell schema. It does not define whether shared setup, replay,
        analysis, shard startup, host-level RSS, or log serialization consume
        the 1,800-second/4,000-CPU budget, nor how a timed-out A/B arm's
        partial C_add is represented. This leaves room to omit hard cells or
        reinterpret them as evidence.
      cheapest_repair: >-
        Add the repository terminal-status enum, per-arm reason and attempted
        flag, unrun-cell accounting, and an explicit budget equation covering
        setup, arm, replay, and analysis resources. Count every attempted or
        timed-out arm, mark all incomplete cells non-valid, and require a
        Coordinator decision before any interpretation.
    exact_source_blob_and_transitive_provenance_gate:
      status: REVISE
      checked: >-
        The old machinery path and hash are real and recomputed; the repair
        correctly requires the future xor_cost.py hash to be non-null before
        approval and lists command, Git, environment, dependency, model,
        logs, raw ledgers, resource, analysis, and unexpected-observation
        artifacts.
      remaining_defect: >-
        A hash for xor_cost.py alone cannot bind imported curve arithmetic,
        harness.toycurve E.add behavior, PRNG implementation, serialization,
        or generated configuration. The new implementation hash is absent now
        by design, but the freeze gate does not name the required transitive
        source set or lockfile. The prior full_grid hash is not a substitute.
      cheapest_repair: >-
        Require a non-null source_blobs map at freeze for xor_cost.py and every
        imported module that affects inputs, E.add, PRNG, identity encoding,
        or accounting, plus dependency/version locks. Recompute and archive
        those hashes before approval; do not treat a placeholder or a single
        driver hash as CTRL-SOURCE-BLOB.
    stale_predecessor_authority_and_queue_binding:
      status: REVISE
      checked: >-
        The current queue correctly binds the repaired design to af6e6f5, makes
        TASK-20260809-2d264c depend on the snapshot, grants only the report
        write scope, and declares TASK-20260809-503fdc as the later report
        archive.
      remaining_defect: >-
        The same checkout still contains approved/frozen
        experiments/EXP-XOR-7267e4/specification.yaml and the Executor handoff
        TASK-20260808-e6022f, both sourced from the predecessor design, plus
        approved H-XOR-a227dc. They are absent from the current BATCH-bd36fe
        queue, but the repair neither supersedes them nor states a machine
        exclusion that prevents stale admission. The repair's future
        EXP-XOR-0c39f3 is not yet created or bound to these bytes.
      cheapest_repair: >-
        Before any freeze or Executor admission, create a new Coordinator
        freeze task whose source_design and hash bindings point to this repaired
        snapshot, and record an immutable supersession/ineligibility decision
        for the old approved spec and handoff. Do not edit those historical
        records and do not let the old Executor card be treated as the repaired
        contract.
    pareto_frontier_and_sota_delta_audit:
      status: REVISE
      checked: >-
        The repair names EV-ECDLP-65b004, EXP-SEMAEV-f48dd1, and
        TASK-20260809-9d39e8 and supplies a pre-run vector with unmeasured
        C_add/C_wall fields left null.
      remaining_defect: >-
        The actual checkout also contains the approved/frozen
        EXP-XOR-7267e4 contract, which has explicit time, memory, query, and
        arm-count fields but is absent from the frontier table. Whether it
        dominates or is incomparable must be recorded, not silently omitted.
        In addition, complete_output_target_delta_vs_EV-ECDLP-65b004 is written
        as 0.0 even though EV-ECDLP-65b004 is a historical yield-only record
        with no complete-output target, and candidate_arm_count_delta_vs_
        EXP-SEMAEV-f48dd1 is not defined well enough to verify its value 2.
      cheapest_repair: >-
        Add the frozen EXP-XOR-7267e4 row and every other current relevant
        frontier row, with time, memory, data/query, output, and charge-model
        comparability values. Replace non-comparable zeroes with null plus a
        reason, define the arm-count delta, and retain dominated_by: null only
        after that complete row-by-row audit.

  findings:
    - id: F-RT-001
      severity: blocking
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-c21465/repair_design.md:§3 lines 65-92; §7 lines 197-206
      why_it_could_invalidate_or_overclaim: >-
        H_star plus cardinality can fail to establish exact complete-output
        equality without the canonical bytes and identity schema. A relation
        ordering, sign, multiplicity, or deduplication mismatch can be hidden
        by an underspecified set encoding; an empty R_star makes coverage_D
        undefined. Any resulting C_add comparison could be for different
        tasks even though the digest check appears to pass.
      cheapest_repair: >-
        Freeze and retain canonical R_star, A output, and B output byte blobs;
        compare bytes/lists exactly and use H_star only as an additional
        integrity digest. Define tuple order, sign normalization, multiplicity,
        deduplication, and a nonempty-target gate.
      design_only_boundary: >-
        This is a control and artifact-validity objection only, not a claim
        that a digest collision or an ECDLP phenomenon occurred.
    - id: F-RT-002
      severity: blocking
      exact_path_section: >-
        repair_design.md:§1 lines 19-31; §3 lines 67-71; §4 lines 96-118
      why_it_could_invalidate_or_overclaim: >-
        The cell tuple (p,b,seed) does not by itself identify a curve, factor
        base, point encoding, or relation identity. The B/D table hash does
        not bind Arm A's input bytes to the same instance. Two arms could
        therefore be compared after different preparation choices while still
        satisfying the stated table control.
      cheapest_repair: >-
        Put the deterministic curve-selection and factor-base rules, serialized
        input schema, and all input hashes in the future frozen specification;
        add a shared-input digest control for A, B, and every D replica before
        the shared-table digest.
      design_only_boundary: >-
        No input mismatch was executed or inferred as an experimental result.
    - id: F-RT-003
      severity: blocking
      exact_path_section: >-
        repair_design.md:§4 lines 94-118 and §5 lines 128-148
      why_it_could_invalidate_or_overclaim: >-
        “Hash the tuple into the approved PRNG” and “uniform from F_p with
        replacement” do not specify an unbiased randbelow-p construction,
        canonical encoding, PRNG version, or the values for campaign_seed and
        null_replica on A/B. A modulo-biased or differently paired stream
        changes the null distribution; a missing duplicate or stream digest
        prevents replay.
      cheapest_repair: >-
        Pre-register the exact PRNG, byte encoding, unbiased sampler, seed and
        replica tuple for every arm, and retain the raw D query stream or a
        complete digest plus counts. Keep all duplicate draws and do not use a
        collision-free retry loop.
      design_only_boundary: >-
        This identifies an unclosed sampling contract, not a statement about
        any observed null distribution.
    - id: F-RT-004
      severity: blocking
      exact_path_section: >-
        repair_design.md:§3 lines 73-92; §5 lines 137-148; §6 lines 152-171
      why_it_could_invalidate_or_overclaim: >-
        Q is named but the query-prefix schedule, B-at-prefix coverage, and
        censoring estimator are not. The statement that D is lower and more
        variable than B at the same prefixes has no defined B curve. “Use
        uncertainty” has no interval level or null test, while raw C_add,D(q)
        and C_wall,D(q) remain easy to misread as a partial-output speedup.
      cheapest_repair: >-
        Freeze the complete prefix schedule and define R_A(q), R_B(q), and
        R_D(q). Make D explicitly diagnostic-only unless a named
        coverage-matched statistic and right-censored estimator are supplied;
        otherwise remove the B-prefix prediction. Mark raw D costs
        diagnostic_only in the schema and forbid D-to-A/B raw delta fields.
      design_only_boundary: >-
        A future null curve could be useful, but this review assigns no null
        result or interpretation to it.
    - id: F-RT-005
      severity: blocking
      exact_path_section: >-
        repair_design.md:§2 lines 33-63; §4 lines 104-118; §7 lines 188-203
      why_it_could_invalidate_or_overclaim: >-
        C_add and C_wall have different stated boundaries, but setup and output
        attribution are unresolved. The collision, bucket, candidate-false,
        candidate-duplicate, verified, and deduplicated channels have names
        but no conservation equations. A partial timeout or a deduplication
        shortcut could lower the reported cost while preserving a plausible
        summary.
      cheapest_repair: >-
        Freeze the fresh-process boundary and shared-setup rule. Emit a
        phase-tagged record for every E.add call, including early returns and
        exceptions, and define machine-checkable conservation equations for
        every collision/bucket/candidate/dedup count. Independent replay must
        reject non-reconciling manifests, and invalid/partial arms must not
        enter a cost delta.
      design_only_boundary: >-
        The displayed formulas remain predictions only; this finding does not
        dispute or confirm any measured cost.
    - id: F-RT-006
      severity: blocking_before_freeze
      exact_path_section: >-
        repair_design.md:§4 CTRL-SOURCE-BLOB lines 119-126 and §7 lines 197-206
      why_it_could_invalidate_or_overclaim: >-
        The future xor_cost.py hash is correctly absent in a no-implementation
        design, but a single driver hash would not bind imported
        harness.toycurve arithmetic, E.add behavior, PRNG, serialization, or
        generated configuration. The old full_grid.py hash is a historical
        reference and cannot establish the new instrument's bytes.
      cheapest_repair: >-
        Require a non-null source_blobs map at freeze for the driver and all
        transitive code affecting inputs, E.add, PRNG, output identity, and
        accounting, plus dependency locks. Recompute and archive each hash
        before approval; reject placeholders and missing imported blobs.
      design_only_boundary: >-
        No implementation was created or executed in this review.
    - id: F-RT-007
      severity: blocking
      exact_path_section: >-
        repair_design.md:§5 lines 128-148; §6 lines 161-171
      why_it_could_invalidate_or_overclaim: >-
        The 5 seed labels are not five independent A/B cost observations when
        A and B are deterministic for a fixed (p,b) instance. D replicas are
        conditional within cells, and the design does not specify cell
        clustering. F1 relies on an interval without a declared coverage level
        or bootstrap variant. The phrase “no arbitrary 0.95 threshold” avoids
        one arbitrary choice but leaves the direction gate underdetermined.
