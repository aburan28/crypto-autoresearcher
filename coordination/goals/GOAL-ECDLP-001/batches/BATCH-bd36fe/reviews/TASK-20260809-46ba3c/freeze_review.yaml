  findings:
    - id: F-V6-3b76fc
      severity: blocking_before_freeze
      disposition: not_fully_discharged
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-c40deb/repair_design_v6.md:22,44-50;
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-c40deb/arithmetic_fixture_xor_v6.json:10-14;
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-c40deb/validate_xor_v6.py:103-142
      why_it_matters: >-
        v6 claims to validate the first eligible point, lift/output identity,
        and arithmetic witness. The validator verifies the supplied point's
        order and the lift root set, but does not require the selected point's
        y coordinate to equal lift_x.selected_smallest_y and does not derive
        the first eligible point from a declared eligibility predicate. An
        in-memory mutation replaced (2,3) with the other order-six point
        (2,98), updated its order trace, point encoding, and output digest, and
        still passed validate_arithmetic while the recorded smallest lift root
        remained 3. F and R_star_count are only required to be positive;
        integer_search bounds and input_digest_domain metadata are also not
        checked.
      independent_probes: >-
        validate_arithmetic accepted the (2,98) alternate-root mutation, F=999,
        forged integer_search lower/upper_exclusive values, and a forged
        input_digest_domain. All probes were in memory only.
      repair_guidance: >-
        Define and implement the exact eligibility predicate and search order;
        require point.y == lift_x.selected_smallest_y and bind the selected
        point to the root chosen by lift_x. Either derive F/R_star_count and the
        integer-search witness from declared inputs or remove those fields from
        the admissibility claim. Validate the domain metadata against the
        actual digest construction or make it non-normative explicitly.
      design_only_boundary: >-
        No curve search, ECDLP implementation, point list, experiment
        specification, or research run was created or executed.

    - id: F-V6-80100a
      severity: blocking_before_freeze
      disposition: not_fully_discharged
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-c40deb/repair_design_v6.md:55-80;
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-c40deb/event_ledger_xor_v6.schema.json:12,29-52;
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-c40deb/validate_xor_v6.py:185-215,231-265
      why_it_matters: >-
        The design describes one complete event stream with phase, candidate,
        relation, query, and table accounting. The schema permits an empty
        events array, and the validator checks only local equations and the
        supplied phase labels; it imposes no minimum event count, required phase
        coverage, phase ordering, or operation-specific completeness. A
        read-only in-memory replacement of the event bytes with an empty stream,
