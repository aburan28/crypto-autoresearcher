        to the input object or verify all claimed identity/output encodings.
        Targeted payload, point-encoding, and output-digest mutations passed.
    - id: F-NEW-003
      disposition: not_fully_discharged
      basis: >-
        Raw monotonic run endpoints and the ten-repeat state gate are present,
        but estimand run IDs, all_repeats_completed_valid, and matrix timing
        records are not bound to the retained arms. Targeted identity/flag and
        interval mutations passed.
    - id: F-NEW-004
      disposition: not_fully_discharged
      basis: >-
        Event bytes, indices, and most derived counters are recomputed, but the
        run event_ledger.exception_count is not compared with the recomputed
        event exception count. Setting that run field to 99 passed the validator
        on the corrected in-memory base.
    - id: F-NEW-005
      disposition: not_fully_discharged_before_freeze
      basis: >-
        The exact canonical run/event binding is inconsistent, so the required
        full command fails before the matrix, six accepted cases, or nine
        mutation branches. Even after an in-memory digest correction, the
        validator uses contract patches/expectations instead of the five run
        case-file payloads and does not verify the manifest lists.
    - id: F-NEW-006
      disposition: not_fully_discharged
      basis: >-
        Canonical ordered domain, shard ownership, overlap, host RSS addition,
        campaign equations, and cap checks are implemented, but shard output
        bytes are hard-coded at 115 per arm and are not tied to member arm byte
        classes, worker wall seconds are not recomputed from interval endpoints,
        and matrix terminal status is not related to arm states.
    - id: F-NEW-008
      disposition: partially_discharged_but_future_gate_remains_open
      basis: >-
        The exact three historical IDs, live hashes, flags, required gate
        booleans, and selected/dependency stale negative are checked. The
        candidate approval_lock_ids are ignored and no approval lock, selected
        contract, or transitive dependency closure is resolved; a safe-looking
        candidate with an empty lock and unknown dependency passed.

  findings:
    - id: F-NEW-002
      severity: blocking_before_freeze
      disposition: not_fully_discharged
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-dda652/repair_design_v5.md:21,36-49;
        arithmetic_fixture_xor_v5.json:3-14;
        validate_xor_v5.py:42-47,83-122
      why_it_matters: >-
        The design claims a canonical input object, fixed field order, and fixed
        point/relation/output encodings. The validator recomputes a SHA-256 over
        whatever canonical_payload_utf8 string is supplied, but never parses
        that payload or compares it with arithmetic.input, never checks that
        lift_x is the recorded point or that roots are field roots, and checks
        only none_hex, F>0, and R_star_count>0 rather than point_hex,
        relation_hex, output_prefix, or output_digest. Its factor-base relation
        also hard-codes exponents 5 and 2 at line 94 instead of deriving both
        from the declared input fields.
      independent_probes: >-
        In-memory mutations that replaced the payload object while recomputing
        its preimage/digest, changed identity_encoding.point_hex, or changed
        output.output_digest all returned PASS from validate_arithmetic.
      repair_guidance: >-
        Parse the payload as compact canonical JSON, require the exact ordered
        object and equality with arithmetic.input, derive the B exponents from
        that object, verify both lift roots and selected point, recompute all
        point/relation/NONE encodings and the output prefix/digest, and add
