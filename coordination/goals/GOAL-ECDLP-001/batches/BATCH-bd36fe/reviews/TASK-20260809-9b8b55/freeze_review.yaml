    assert an experimental or mathematical negative result.

  checked_prior_findings:
    - id: F-RT-001
      disposition: discharged
      basis: >-
        Section 2 defines a binary RST2 format, big-endian widths, sorted
        ordered point-index tuples, sign and multiplicity semantics,
        deduplication, a nonempty gate, and retained byte-for-byte A/B blobs.
    - id: F-RT-002
      disposition: substantially_repaired_but_identity_closure_remains
      basis: >-
        Section 2 supplies a shared LF/UTF-8 input blob, concrete curve and
        factor-base fields, and a shared digest control. F-NEW-002 identifies
        remaining canonical numeric, curve-search, point-list, and identity
        serialization ambiguity before freeze.
    - id: F-RT-003
      disposition: not_fully_discharged
      basis: >-
        Section 3 correctly requires with-replacement values, ordinary
        collision retention, deterministic seed components, and no
        collision-free retry loop. F-NEW-001 finds that the PRNG, rejection
        sampler, seed serialization, seed values, and replay stream are not
        yet exact.
    - id: F-RT-004
      disposition: substantially_repaired_but_estimand_binding_remains
      basis: >-
        Section 4 defines four prefixes, coverage, target costs, right
        censoring, diagnostic-only raw D costs, and an explicit prohibition on
        raw D-to-A/B deltas. F-NEW-003 finds an unresolved prefix-order and
        wall-time aggregation choice.
    - id: F-RT-005
      disposition: not_fully_discharged
      basis: >-
        Section 5 adds fresh-process charging, per-E.add events, phase sums,
        and replay. F-NEW-004 finds undefined candidate/relation identity and
        exception-accounting terms that prevent a complete machine replay
        contract.
    - id: F-RT-006
      disposition: discharged_for_design_stage
      basis: >-
        Section 7 explicitly makes the future freeze require a complete,
        non-null, recomputed transitive source_blobs and dependency-lock map,
        while correctly omitting an implementation hash from this no-code
        design snapshot.
    - id: F-RT-007
      disposition: not_fully_discharged
      basis: >-
        Section 4 separates exact C_add from descriptive wall time and bans
        inferential claims, but it does not select the C_wall statistic from
        the five repeats. This is covered by F-NEW-003.
    - id: F-RT-008
      disposition: not_fully_discharged
      basis: >-
        Section 6 names the repository terminal enum and attempted/reason
        fields, but F-NEW-005 finds that the current strict run-manifest schema
        rejects those fields and the random-suffix experiment id; F-NEW-006
        finds incomplete total-resource and unrun-arm accounting.
    - id: F-RT-009
      disposition: discharged_as_a_required_future_gate
      basis: >-
        Section 7 explicitly requires a separate Coordinator decision naming
        EXP-XOR-7267e4, H-XOR-a227dc, and TASK-20260808-e6022f as historical
        and ineligible before any future approval or Executor task.
    - id: F-RT-010
      disposition: substantially_repaired_but_machine_binding_remains
      basis: >-
        Section 8 includes the stale approved predecessor, uses null for
        unmeasured or incomparable dimensions, and computes 400 minus 120 as
        planned bookkeeping while disclaiming SOTA meaning. F-NEW-007 finds
        that the required dominated_by and row-wise audit are only prose, not
        a machine-readable frontier record.

  findings:
    - id: F-NEW-001
      severity: blocking
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-da79af/repair_design_v2.md:§3 lines 173-199;
        prior control source: coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/reviews/TASK-20260809-2d264c/red_team_report.yaml:F-RT-003
      why_it_matters: >-
        The v2 text calls the sampler rejection-free while also requiring an
        unspecified rejection rule. It does not name the PRNG and version,
        fixed-width word size or byte order, rejection threshold, exact
        length-prefix encoding, concrete campaign_seed values, or the value
        sets and numbering of process_replica/null_replica. Retaining only a
        raw query-value stream does not let an independent parser replay or
        verify rejected PRNG words and therefore does not prove the stated
        unbiased law. The remaining choices can change the D null distribution
        while all nominal controls still pass.
      cheapest_repair: >-
        In the future specification, name the exact PRNG/version and
        randbelow-p algorithm; define word width, endian encoding, rejection
        threshold, and the length-prefixed serialization of every seed tuple;
        enumerate campaign seeds and replica labels; distinguish rejected
        PRNG draws from forbidden collision retries; and retain every consumed
        PRNG word (or an independently replayable equivalent) plus the accepted
        query stream and duplicate counts.
      design_only_boundary: >-
        No random values were generated and no null distribution was observed
        in this review.

    - id: F-NEW-002
      severity: blocking
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-da79af/repair_design_v2.md:§2 lines 53-75;
        sanctioned reference: experiments/EXP-SEMAEV-f48dd1/implementation/full_grid.py:lines 38-87
      why_it_matters: >-
        The input fields are ordered and byte-encoded, but decimal lexical
        canonicalization, the exact rational interpretation and evaluation of
        floor(p**b), the meaning of F order, the lift_x root choice, and the
        identity representation are not fully stated. The sanctioned
        predecessor's curve search and factor-base construction are executable
        reference code, not a complete normative serialization contract; its
        find_curve order test and lift_x-dependent point ordering must not be
        inherited by interpretation. A shared digest catches cross-arm
        divergence inside one cell, but it does not make independent
        regeneration of the same cell deterministic when these choices are
        left open.
      cheapest_repair: >-
        Freeze a canonical decimal grammar with no leading zeros, represent b
        as an exact registered rational (0.4 = 2/5 and 0.5 = 1/2), define the
        exact curve-search/order test and lift_x root convention, define F as
        the point-list cardinality, spell out the identity encoding (including
        the repository None/identity mapping), and bind the resulting per-cell
        input blobs, factor-base lists, and digests before freeze.
      design_only_boundary: >-
        No curve, factor base, point list, or input digest was generated by
        this review; the observation is a specification-ambiguity finding.

    - id: F-NEW-003
      severity: blocking
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-da79af/repair_design_v2.md:§4 lines 146-181 and §6 lines 281-288
      why_it_matters: >-
        Delta_AB_wall uses C_wall_A and C_wall_B, but five fresh-process wall
        repeats are only said to be reported as min/median/max; no one of
        those statistics is the estimand used in the delta, and no missing or
        invalid-repeat rule is given. Likewise, same prefix lengths do not
        explicitly say that A, B, and D consume the first q entries of the
        exact point list in one fixed order. Without these choices, a future
        implementation can select a favorable repeat or prefix interpretation
        while still claiming the declared formula. This is the unresolved
        F-RT-007 and part of F-RT-004 contract, not a statistical result.
      cheapest_repair: >-
        Define every prefix as the first q point-list entries under a frozen
        query order, enumerate q for every arm, and choose a single
        pre-registered C_wall cell statistic (for example, the median of all
        five completed-valid repeats). Require a complete-validity rule for
        that statistic, retain all per-repeat values, and prohibit a delta when
        the required repeat set is incomplete.
      design_only_boundary: >-
        No wall-time measurement or prefix coverage was collected.

    - id: F-NEW-004
      severity: blocking
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-da79af/repair_design_v2.md:§5 lines 183-215
      why_it_matters: >-
        The event count itself is well motivated, but candidate_unique,
        candidate_duplicate_events, relation_unique, and
        relation_duplicate_events have no canonical identity key or scope.
        The text does not say whether a candidate is identified by the ordered
        (i1,i2,i3) tuple before or after verification, or how duplicate table
        buckets and prefix repeats are classified. Exceptions generate events
        but have no conservation term, and monotonically increasing
        event_index does not state its origin or whether gaps are legal. An
        independent replay therefore cannot fully reconcile the summary
        channels or distinguish a failed candidate from a false positive.
      cheapest_repair: >-
        Define the candidate and relation identity as the ordered point-index
        tuple, state the uniqueness scope and first-seen rule, require a
        contiguous zero- or one-based event index, add exception and
        aborted-candidate counters to the conservation equations, and bind an
        exact per-phase/per-counter manifest schema. Require every exception or
        non-reconciling ledger to make the arm invalid and ineligible for all
        deltas.
      design_only_boundary: >-
        No implementation, event ledger, replay, or cost was produced.

    - id: F-NEW-005
      severity: blocking
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-da79af/repair_design_v2.md:§3 lines 105-144 and §6 lines 235-241;
        schemas/run-manifest.schema.json:lines 8-13, 24-32, 35-49, 77-105
      why_it_matters: >-
        The current strict run-manifest schema has additionalProperties:false,
        does not define attempted or terminal_reason, and requires fields that
        the v2 matrix summary does not say how to populate for unattempted or
        cancelled arms. More seriously, the fresh required experiment id
        EXP-XOR-44d232 is valid under the repository's random six-hex id rule
        but is rejected by the schema's digits-only experiment-id pattern.
        The v2 claim that per-arm manifests are machine-checkable is therefore
        false unless a versioned schema/amendment is made part of the freeze
        gate. Resource wrapper fields also cannot be extended under the current
        strict object.
      cheapest_repair: >-
        Before freeze, create or version the applicable manifest and matrix
        schemas, bind their hashes, change the id patterns to accept the
        repository's random six-hex suffixes, and explicitly add attempted,
        terminal_reason, source-blobs, phase-counter, and matrix-state fields
        or define a separate hash-bound matrix-summary schema. Validate a
        completed, invalid, failed, exhausted, cancelled, and unattempted
        example against that exact schema.
      design_only_boundary: >-
        No run manifest was created or validated as an experiment execution.

    - id: F-NEW-006
      severity: blocking
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-da79af/repair_design_v2.md:§6 lines 217-241 and §7 lines 259-263
      why_it_matters: >-
        The invocation arithmetic 80 A/B plus 320 D equals 400, but the
        contract does not enumerate the five primary seed values, five
        process-replica values, or eight null-replica values, and its stated
        lexicographic key contains seed and arm_index but not
        process_replica. Four shards and 1,800 seconds total wall are not
        tied to a concurrency or shard-allocation rule; 400 ten-second arm
        caps imply 4,000 seconds of serial wall, while total CPU, peak RSS,
        raw output, wrapper replay, serialization, and analysis equations are
        not reconciled. The phrase that an unrun arm consumes budget has no
        matrix-state or reservation representation. This leaves room for
        silently changing the realized matrix or hiding unrun work.
      cheapest_repair: >-
        Enumerate all seed and replica labels and include them in the canonical
        arm key, define the four-shard assignment and required concurrency,
        write exact total wall/CPU/host-RSS/output equations including setup,
        replay, hashing, serialization, and analysis, and define a matrix
        summary for attempted, cancelled, failed, invalid, and unattempted
        arms. Require that a cap breach records the terminal state and never
        reduces the declared matrix.
      design_only_boundary: >-
        No arm, shard, process, timeout, or resource measurement was run.

    - id: F-NEW-007
      severity: blocking_before_freeze
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-da79af/repair_design_v2.md:§8 lines 273-305;
        AGENTS.md:Inventor protocol/Pareto honesty lines 250-253
      why_it_matters: >-
        The row set is materially better than the prior report: it includes
        EXP-XOR-7267e4 and correctly uses null for incomparable or unmeasured
        axes, and 400 minus 120 is honest planned bookkeeping. However,
        dominated_by:null is only asserted in prose and no structured
        dominated_by field or per-row per-axis comparability/reason record is
        emitted. The planned arm-count value is nested under sota_delta even
        though it is not a performance delta. A downstream freeze or Pareto
        consumer could therefore treat an unchecked null or planned count as a
        measured frontier/SOTA conclusion, contrary to AGENTS.md.
      cheapest_repair: >-
        Emit a structured Pareto record with every checked row, every time,
        memory, data/query, output-identity, and charge-model comparability
        value, a reason for each null, and an explicit dominated_by field. Put
        planned arm arithmetic under a separate planned_bookkeeping mapping
        and reserve sota_delta for measured quantities, with all measured
        fields null until a valid run exists.
      design_only_boundary: >-
        No SOTA, Pareto dominance, cost, or performance result is asserted by
        this review.

