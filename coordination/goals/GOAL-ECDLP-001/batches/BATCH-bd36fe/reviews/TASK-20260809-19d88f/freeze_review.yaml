  additional_adversarial_checks:
    method: >-
      Read-only subprocess invocations and in-memory deep-copy replacements;
      no archived source byte, fixture, queue record, predecessor report, or
      repository artifact was changed. The alternate CLI probe used the same
      immutable files and no --run or --matrix argument.
    outcomes:
      - probe: actual_argv_repo_root_absolute_spelling
        outcome: FAIL_OPEN
        exact_path_section: >-
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-0e21cd/validate_xor_v8.py:30-41,138-146,253-283;
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-0e21cd/matrix_validator_metadata_xor_v8.json:5-9
        detail: >-
          The actual v8 CLI was rerun with --repo-root "$PWD" in place of the
          accepted argv's --repo-root ., while all other inputs were unchanged.
          It exited 0 and printed VALIDATION_PASS. strict_metadata compares
          metadata to the hard-coded CANONICAL_ARGV but main never compares the
          actual parsed argv to that canonical list.
        repair_guidance: >-
          Normalize and compare the actual invocation argv before accepting any
          input, including exact relative spellings for every path and exact
          --repo-root .; reject equivalent-but-different absolute or normalized
          spellings. Record the checked argv as the authoritative replay input.
      - probe: v6_manifest_path_and_hash_mutations
        outcome: REJECTED_AS_EXPECTED
        exact_path_section: >-
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-0e21cd/validate_xor_v8.py:94-105;
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-0e21cd/validation_contract_xor_v8.json:8-10
        detail: >-
          In-memory wrong v6_manifest path and wrong v6_manifest_sha256 values
          were both rejected by strict_manifest.
      - probe: unbound_manifest_v7_root_pointer
        outcome: FAIL_OPEN
        exact_path_section: >-
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-0e21cd/fixture_manifest_xor_v8.json:4-7;
          coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-0e21cd/validate_xor_v8.py:94-112,274-283
        detail: >-
          Replacing manifest.v7_root with wrong/v7-root passed strict_manifest.
          The validator instead loads the predecessor from the CLI --v7-root;
          manifest.v7_root and manifest.v7_validator are descriptive and not
          cross-checked.
        repair_guidance: >-
          Bind v7_root and v7_validator to the canonical paths derived from the
          accepted argv and require a content hash for the v7 contract or
          remove those fields from normative provenance.
      - probe: unbound_contract_predecessor_root_pointer
