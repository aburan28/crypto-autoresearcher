  verdict: REVISE
  verdict_scope: >-
    Design admissibility only: the v4 snapshot is a substantial repair and
    closes the byte-level PRNG contract and the preserved v3 Pareto boundary,
    but it is not admissible for a separately frozen specification until the
    validator/fixture gate, event ledger binding, wall-repeat gate, matrix
    resource equations, and executable predecessor-selection gate are repaired.
    REVISE is not an experimental, mathematical, security, cost, asymptotic,
    cryptographic-scale, or official research-state conclusion.

  checked_prior_findings:
    - id: F-NEW-001
      disposition: discharged_for_design_stage
      basis: >-
        repair_design_v4.md:§2 lines 38-75 and
        validation_contract_xor_v4.json:lines 10-45 assign tags 01 through 08,
        field order, typed lengths, counter c=0 and increment 1, exact lower-
        case display widths, zero-based accepted-query indices, rejection
        nulls, and the first accept/reject/accept fixture. The read-only pass
        independently recomputed the seed bytes, seed SHA-256, threshold, and
        four words. Actual run-ledger replay is not claimed here; its missing
        enforcement is recorded under F-NEW-005.
    - id: F-NEW-002
      disposition: not_fully_discharged_before_freeze
      basis: >-
        repair_design_v4.md:§3 lines 81-116 closes the four p values, two
        rational b values, search order, order predicate, lift_x choice,
        F/R_star nonempty gates, and four-byte identity encodings. However,
        the required inputs.input_digest is only a 64-hex field with no
        canonical preimage or hash rule, and validate_xor_v4.py has no prime,
        curve, factor-base, identity, or nonempty-output arithmetic check; it
        only hard-codes the domain and validates the PRNG fixture. The design
        wording is therefore stronger than the executable control boundary.
    - id: F-NEW-003
      disposition: not_fully_discharged_before_freeze
      basis: >-
        repair_design_v4.md:§4 lines 120-151 supplies the prefix formula,
        delta formula, sign, null rule, and median-of-five intent. The charged
        interval starts at spawn return while claiming to include process
        launch (lines 125-136), and the run schema records arbitrary strings
        rather than typed monotonic endpoints, clock source, or seconds unit.
        The matrix schema permits zero through five wall repeats and does not
        bind included_in_metrics to five completed_valid repeats; the matrix
        validator never checks that gate.
    - id: F-NEW-004
      disposition: not_fully_discharged
      basis: >-
        repair_design_v4.md:§5 lines 154-184 fixes arm-wide scope, phase names,
        equations, and exception intent. The event schema has no contiguous or
        unique event-index constraint and no minimum/length relation to its
        counters. The run schema stores only event-ledger metadata; it does
        not require bucket_sizes even though table_insert_events is defined as
        their sum, and it does not link the event-ledger bytes, run id,
        exception count, or event phases to the run counters. The validator
        checks only aggregate fields in the run record and never reads the
        event ledger.
    - id: F-NEW-005
      disposition: not_fully_discharged_before_freeze
      basis: >-
        The v4 schemas and six fixture descriptor files are hash-bound, but
        the fixture files contain only status/mutation descriptions and refer
        to an absent canonical_minimal_run; they are not run or matrix records.
        validate_xor_v4.py:194-212 checks descriptor echo fields and compares
        the nine mutation names, while main():229-235 validates a run or matrix
        only if an external --run or --matrix is supplied. The required
        --event-schema argument is not used. No negative mutation is applied.
        Consequently VALIDATION_PASS can occur without exercising either
        schema, the event schema, any state relation, or any negative case.
        Remaining schema gaps include nullable completed_invalid.invalid_reason,
        unconstrained matrix state/run_id/included_in_metrics relations,
        absent inputs-to-matrix_key equality, and source hashes that are only
        regex-checked rather than resolved to bytes.
    - id: F-NEW-006
      disposition: not_fully_discharged
      basis: >-
        The design and dormant validate_matrix function encode 400 keys,
        40/40/320 counts, four shards, 100-key ownership, terminal totals,
        wall/CPU/output equations, and the 27111981056-byte cap. The checker
        ignores shard-entry order and does not require each shard arm_key.shard
        to equal its shard number; it checks sets only. It does not validate
        host RSS sampling or a host reservation, shard/output byte totals,
        arm-class byte sums, or concurrent shard timing/overlap. The declared
        arm_raw_bytes/arm_stdout_bytes/arm_stderr_bytes are not used in the
        output equation. Also, §3 lines 91-93 list the b cells as 2/5 then 1/2,
        while §7 and validate_xor_v4.py:101 sort the numeric tuple so 1/2
        precedes 2/5; ordinal-mod-4 sharding therefore has two competing
        canonical orders.
    - id: F-NEW-007
      disposition: discharged_for_design_stage
      basis: >-
        The v3 pareto_audit_v3.json remains byte-identical to its archived
        TASK-20260809-e239a2 binding (00e711089da655029dabee25a8cef8d410c4fb95a30b2f55f7676233b33fa0f0).
        The v4 snapshot adds no Pareto row, measured value, dominance claim,
        or SOTA delta; the v3 record keeps all measured fields null and planned
        bookkeeping separate. This is preservation of the design-stage
        boundary, not evidence from the planned 400-arm matrix.
    - id: F-NEW-008
      disposition: partially_discharged_but_future_gate_remains_open
      basis: >-
        predecessor_exclusion_xor_v4.json:4-49 names exactly
        EXP-XOR-7267e4, H-XOR-a227dc, and TASK-20260808-e6022f, verifies their
        live source hashes, and sets all three historical/ineligible flags.
        The validator checks the record flags and six gate booleans but omits
        required_future_gate.reject_if_any_new_stale_id_is_discovered. It has
        no candidate future contract, approval lock, or dependency closure
        input, so the declared stale_predecessor_selected negative mutation
        cannot be executed. A future selector could therefore be wrong while
        this package still prints VALIDATION_PASS.

  findings:
    - id: F-NEW-002
      severity: blocking_before_freeze
      disposition: not_fully_discharged
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-c4bd18/repair_design_v4.md:§3 lines 81-116;
        run_manifest_xor_v4.schema.json:lines 40-50;
        validate_xor_v4.py:lines 20-24 and 91-104
      why_it_matters: >-
        A future run must carry input_digest, but two implementations can hash
        different canonical bytes and both satisfy the current schema. The
        design also says the validator checks primality and the curve,
        factor-base, identity, and nonempty gates, while the supplied validator
        performs no such arithmetic or gate check. The fixed p membership
        happens to contain primes, but that is not the claimed independent
        predicate or a replayable input/output gate.
      cheapest_repair: >-
        Define the exact input_digest preimage, encoding, hash domain, and
        field order. Add a versioned arithmetic/control fixture that checks
        p prime and p>3, integer B search, curve/order search, lift_x and
        point ordering, NONE/point bytes, F>0, and nonempty R_star, or remove
        those checks from the validator contract and bind them explicitly to a
        future arithmetic implementation review before freeze.
      design_only_boundary: >-
        No curve, factor base, point list, input digest, identity, or reference
        output was generated by this review.

    - id: F-NEW-003
      severity: blocking
      disposition: not_fully_discharged
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-c4bd18/repair_design_v4.md:§4 lines 125-150;
        run_manifest_xor_v4.schema.json:lines 89-108;
        matrix_summary_xor_v4.schema.json:lines 125-145
      why_it_matters: >-
        The start timestamp is described as spawn-return time but the interval
        claims to include process launch, so two wrappers can charge different
        launch costs. The schema accepts arbitrary timestamp strings and does
        not require monotonic endpoints, clock source, decimal seconds, or
        raw endpoint values. A/B metric inclusion is also not machine-gated:
        an arm may have fewer than five repeats or partial/invalid repeats and
        still set included_in_metrics=true. The resulting median/delta can be
        falsely costed while satisfying the schema and dormant matrix checks.
      cheapest_repair: >-
        Choose one exact start boundary that matches the included set, record
        raw monotonic start/stop values, clock source, unit, exit/flush state,
        and remove the unsupported per-arm ten-second cap or justify it. Add a
        schema/validator relation requiring exactly five fresh A/B repeats,
        each completed_valid with a retained reason, before included_in_metrics
        or either wall delta is non-null.
      design_only_boundary: >-
        No process was spawned and no wall, CPU, prefix, median, or delta was
        measured by this review.

    - id: F-NEW-004
      severity: blocking
      disposition: not_fully_discharged
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-c4bd18/repair_design_v4.md:§5 lines 154-184;
        event_ledger_xor_v4.schema.json:lines 12-60;
        validate_xor_v4.py:lines 107-128
      why_it_matters: >-
        The contract says missing ledger bytes, an index gap, an unknown phase,
        an exception mismatch, or a failed conservation equation invalidates an
        arm, but the available validator can pass without opening one event
        ledger. The event schema allows an arbitrary event array and does not
        enforce event_index={0,...,event_count-1}; the run schema has no
        bucket_sizes despite the table equation. Aggregate counters can be
        self-consistent but unrelated to the actual E.add stream, making event
        cost and duplicate accounting non-reproducible.
      cheapest_repair: >-
        Add an event-ledger input to the validator, schema-check the referenced
        bytes, require run_id/hash/count/phase and contiguous-index agreement,
        retain the bucket-size domain, and recompute exception, candidate,
        relation, query, table, and seven-phase equations from the canonical
        event/counter artifacts. Include a concrete valid ledger and gap/
        exception/table mutations in the fixture runner.
      design_only_boundary: >-
        No E.add call, event ledger, replay, candidate identity, or event cost
        was produced by this review.

    - id: F-NEW-005
      severity: blocking_before_freeze
      disposition: not_fully_discharged
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-c4bd18/validation_contract_xor_v4.json:lines 56-96;
        fixtures/fixture_manifest_xor_v4.json:lines 4-24;
        validate_xor_v4.py:lines 194-236;
        run_manifest_xor_v4.schema.json:lines 206-220;
        matrix_summary_xor_v4.schema.json:lines 124-166
      why_it_matters: >-
        The contract presents six accepted fixtures and nine negative tests as
        the approval gate, but the six files are descriptive control records
        with no canonical_minimal_run and no run/matrix/event payload. The
        validator verifies only that descriptor fields echo the manifest and
        that mutation names match; it never applies a mutation or asserts a
        rejection. The command's run and matrix inputs are optional, and the
        event-schema argument is unused. Schema-only paths therefore retain
        false-valid state combinations: completed_invalid may have a null
        result.invalid_reason; matrix state/run_id/included_in_metrics and
        top-level status have no relations; inputs can disagree with matrix_key;
        and source_blobs are only format-checked. A future malformed or stale
        record can pass the claimed freeze gate.
      cheapest_repair: >-
        Materialize one complete canonical run, one event ledger, one complete
        400-arm matrix, and the six accepted cases. Implement a fixture runner
        that applies all nine named mutations and requires each to fail at the
        relevant schema/semantic check, including event-schema validation. Add
        the missing state, run-key, source-byte, and top-level matrix relations,
        and make VALIDATION_PASS impossible unless every accepted and negative
        case is actually exercised.
      design_only_boundary: >-
        The validator was run only in the explicitly requested fixture/
        predecessor-only mode; no synthetic or real ECDLP run or matrix was
        supplied, created, or interpreted.

    - id: F-NEW-006
      severity: blocking
      disposition: not_fully_discharged
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-c4bd18/repair_design_v4.md:§7 lines 207-251;
        matrix_summary_xor_v4.schema.json:lines 14-72 and 148-165;
        validate_xor_v4.py:lines 131-172
      why_it_matters: >-
        The 400-key domain, 40+40+320 counts, four 100-key shards, terminal
        state names, and numeric output cap are materially closed. However,
        shard membership is compared as sets, so list order and the key's own
        shard field can disagree with the containing shard. Section 3's stated
        b-cell order conflicts with the numeric tuple sort used for ordinal
        sharding. The checker ignores coordinator/active-worker RSS samples,
        host reservation, shard intervals/overlap, shard output bytes, and the
        arm_raw/stdout/stderr total fields; it recomputes output from a
        different per-arm expression. These omissions permit under- or
        mis-attributed campaign wall, memory, and byte costs even when all
        declared equations appear numerically consistent.
      cheapest_repair: >-
        Freeze one b-cell order and use it consistently in the design,
        contract, key generator, and shard fixture. Require each shard array
        in canonical order with key.shard equal to the containing shard, and
        require its declared byte totals to equal per-arm sums. Record and
        validate worker/coordinator intervals or an explicit concurrency
        witness, RSS samples and host reservation, all byte classes, and the
        exact cap boundary. Exercise duplicate-key, duplicate-shard, empty-
        membership, terminal-total, and resource mutations against a complete
        matrix fixture.
      design_only_boundary: >-
        No arm, shard, process, cap, RSS, timing, resource, or output
        measurement was run by this review.

