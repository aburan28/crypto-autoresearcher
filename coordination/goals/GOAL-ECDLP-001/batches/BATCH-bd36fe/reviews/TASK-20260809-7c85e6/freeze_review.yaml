  verdict: REVISE
  verdict_scope: >-
    Design admissibility only: whether the exact v3 artifact is sufficiently
    closed for a separately reviewed future freeze/specification task. The
    v3 snapshot is a meaningful repair and F-NEW-007 is discharged, but the
    remaining blockers below prevent a PASS. REVISE does not assert an
    experimental, mathematical, security, cost, or ECDLP result and does not
    authorize implementation or execution.

  checked_prior_findings:
    - id: F-NEW-001
      disposition: not_fully_discharged
      basis: >-
        The SHA-256 counter construction, byte rejection rule, seed/replica
        ranges, consumed-word retention, and replay obligation are now stated.
        However, the one-byte type-tag values in the seed serialization are
        not assigned, the initial counter value is not stated, and canonical
        encodings for word_hex and query_index are not fixed. An independent
        replay can therefore still build different seed bytes or counter
        streams while satisfying the prose.
    - id: F-NEW-002
      disposition: partially_discharged_but_domain_closure_remains
      basis: >-
        The decimal grammar, registered rational b values, integer power
        bound, curve search intent, exact order intent, lift_x root choice,
        point-list cardinality, input digest, RST2 bytes, ordered tuple
        identity, and empty-output invalid reason are materially improved.
        The actual eight p values are not enumerated in v3, and the exact
        lexicographic point enumeration, prime-field/domain precondition,
        nonempty point-list/reference-output gate, and all binary identity
        widths are not fully closed.
    - id: F-NEW-003
      disposition: substantially_discharged_but_wall_contract_remains
      basis: >-
        The four prefixes are exact first point-list prefixes, D consumes the
        accepted stream in that schedule, and a wall estimand is the median of
        five completed_valid repeats only when all five repeats are valid.
        The v3 artifact does not define the exact wall-clock interval or the
        formula and sign/units of Delta_AB_wall, so a future implementation
        can still measure different process boundaries or report different
        deltas under the same median rule.
    - id: F-NEW-004
      disposition: not_fully_discharged
      basis: >-
        The v3 prose fixes zero-based contiguous E.add event indices,
        exception events, ordered tuple identity at a high level, and the
        principal conservation equations. It does not state the uniqueness
        scope across prefixes, table construction, and the complete arm, and
        the equation sum(phase_counters[p]) does not specify that p excludes
        the required total field. The event ledger and candidate/relation
        counters are not required properties in the run schema, so the
        claimed independent replay contract is not machine-bound.
    - id: F-NEW-005
      disposition: not_fully_discharged_before_freeze
      basis: >-
        Versioned six-hex run and matrix schema drafts now exist and the
        future fixture gate is explicitly named. They remain structurally
        permissive in exactly the places the design claims the gate will
        reject: the run schema accepts attempted:false with status
        completed_valid, result.valid:false, terminal_reason:null, and a
        phase total inconsistent with its phase fields; the matrix schema
        accepts 400 duplicate arm_key values, four duplicate shard numbers,
        empty shard membership, and totals inconsistent with the arm states.
        These deliberately inconsistent examples produced zero Draft 2020-12
        validation errors. No fixture set or validator artifact is bound in
        this snapshot.
    - id: F-NEW-006
      disposition: not_fully_discharged
      basis: >-
        The v3 arithmetic correctly gives 80 A/B plus 320 D invocations, the
        output-cap arithmetic is correct at 27111981056 bytes, and the
        declared four-shard/400-key intent is explicit. The p domain is still
        absent, the matrix schema does not enforce unique complete keys or
        the equations, the equation uses valid/invalid while the schema names
        completed_valid/completed_invalid, and “shard workers run
        sequentially” conflicts with worker_wall=max(shard.wall_seconds) and
        “four active processes maximum.” The timing, RSS sampling, and raw
        ledger/replay/output byte boundaries are consequently not yet an
        exact cost ledger.
    - id: F-NEW-007
      disposition: discharged_for_design_stage
      basis: >-
        pareto_audit_v3.json is parseable and hash-bound, contains the named
        historical/design rows, gives every row a time/memory/data-query/
        output-identity/charge-model comparability object with a reason, sets
        dominated_by explicitly to null with a checked-row reason, and keeps
        every measured sota_delta field null. Planned invocation and shard
        arithmetic is separated under planned_bookkeeping. This discharges
        the prior machine-readable Pareto finding for the design stage; it
        does not make the planned 400-arm matrix evidence.

  findings:
    - id: F-NEW-001
      severity: blocking
      disposition: not_fully_discharged
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-47ae98/repair_design_v3.md:§2 lines 30-71
      why_it_matters: >-
        XOR-PRNG-v1 and randbelow_p are otherwise concrete, but
        “one-byte type tag” has no assigned byte values. The field order alone
        does not identify S bytes if a producer chooses different tags. The
        counter stream also does not state whether the first consumed counter
        is 0 or 1, and word_hex width/case and query_index origin are not
        canonical. Those choices change the D null stream and make a replay
        mismatch possible without any implementation defect.
      cheapest_repair: >-
        Assign and freeze the tag byte for every named field, explicitly state
        that fields occur in the listed order with no omitted/count field (or
        specify one), set the initial counter and increment rule, require
        exactly 16 lower-case hexadecimal characters for word_hex, and define
        zero-based query indices and the exact representation of rejected
        draws. Add a byte-level seed example and a replay fixture containing
        the first rejected and accepted draws for at least one p.
      design_only_boundary: >-
        No random values, PRNG words, query stream, or null distribution was
        generated by this review.

    - id: F-NEW-002
      severity: blocking
      disposition: partially_discharged_but_domain_closure_remains
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-47ae98/repair_design_v3.md:§3 lines 73-124 and §6 lines 189-200
      why_it_matters: >-
        A future implementation reading only the v3 repair cannot know which
        eight p values form the matrix. “All eight (p,b) cells” is a count,
        not an input domain; the predecessor's p set is not automatically a
        v3 normative binding. In addition, “first lexicographically found
        on-curve point” does not explicitly define the x/y enumeration, p's
        prime-field precondition is implicit, and the nonempty F/R_star gate
        is not stated before prefix and coverage calculations. The
        NONE=ffffffff notation also needs an explicit four-byte identity
        encoding, not only a textual label. Any of these gaps can change the
        curve, point ordering, denominator, or output bytes.
      cheapest_repair: >-
        Enumerate p exactly as {101,103,107,211} if that is the intended
        inherited domain, and bind the list in the future specification and
        matrix-key fixture. State p prime and p>3, define lexicographic search
        as the exact integer loops over x then y (with the selected root),
        require F>0 and nonempty R_star before any q or coverage division,
        and define NONE as the exact u32be(0xffffffff) byte encoding in every
        event/output context. Bind the arithmetic source and its hash before
        freeze.
      design_only_boundary: >-
        No curve, factor base, point list, input digest, or relation output was
        generated by this review.

    - id: F-NEW-003
      severity: blocking
      disposition: substantially_discharged_but_wall_contract_remains
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-47ae98/repair_design_v3.md:§4 lines 125-153 and §5 lines 155-163
      why_it_matters: >-
        The prefix order, q_k formula, target censoring, five-repeat median,
        all-five-completed-valid rule, and null-on-incomplete behavior repair
        the central statistical ambiguity. The remaining wall estimand is not
        fully normative: C_wall has no explicit start/stop boundary, and
        Delta_AB_wall is named but no absolute or relative formula, sign, or
        unit is stated in v3. Fresh-process setup, output flush, replay, and
        analysis can therefore be included differently while the median and
        validity rule still appear to pass.
      cheapest_repair: >-
        Define C_wall as a measured interval with exact process-launch/input
        and terminal/output-flush endpoints, state which post-run work is
        excluded or separately charged, and carry forward an explicit formula
        such as (median(C_wall_A)-median(C_wall_B))/median(C_wall_A) only after
        the all-five-valid gate. Require every raw repeat and its validity
        reason in the matrix summary.
      design_only_boundary: >-
        No wall-time measurement, prefix coverage, censoring result, or
        inferential statistic was collected.

    - id: F-NEW-004
      severity: blocking
      disposition: not_fully_discharged
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-47ae98/repair_design_v3.md:§5 lines 155-185;
        run_manifest_xor_v3.schema.json:lines 82-126
      why_it_matters: >-
        Ordered tuple identity and contiguous exception-aware E.add events are
        useful, but “first-seen” has no explicit scope: complete arm, prefix,
        table bucket, or per-event stream. The conservation equations also
        leave the phase summation domain implicit while phase_counters.total
        is itself a required field. More importantly, the v3 run schema has no
        required event-ledger artifact, candidate_attempts,
        candidate_verified, candidate_aborted, relation, query, duplicate, or
        bucket counters; result.metrics and artifacts are open objects. A
        schema-valid future run can omit the data needed to reproduce or
        reconcile the claimed cost.
      cheapest_repair: >-
        Define uniqueness as arm-wide first-seen over the canonical ordered
        tuple, explicitly state how prefix observations and table duplicates
        map to that scope, and define the phase set as exactly
        {input,curve,factor_base,table,query,verify,serialize} with total
        outside the sum. Add a versioned event-ledger schema or required
        artifact hash and require all conservation counters and exception
        normalization fields. Bind an independent replay validator and make
        any missing ledger/counter or equation mismatch completed_invalid.
      design_only_boundary: >-
        No implementation, event ledger, replay, or E.add cost was produced.

    - id: F-NEW-005
      severity: blocking_before_freeze
      disposition: not_fully_discharged_before_freeze
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-47ae98/run_manifest_xor_v3.schema.json:lines 1-130;
        matrix_summary_xor_v3.schema.json:lines 1-87;
        repair_design_v3.md:§7 lines 230-245
      why_it_matters: >-
        The drafts parse and accept the six-hex identifiers, but structural
        JSON Schema validation does not enforce the state relationships and
        matrix equations promised by Section 7. A read-only Draft 2020-12
        check accepted a run with status completed_valid, attempted false,
        result.valid false, terminal_reason null, and phase_counters.total
        999. It also accepted a matrix with 400 duplicate arm_key values, four
        shard objects all numbered 0 with empty membership, and totals that do
        not describe those arms. No fixture files or validator implementation
        is bound in the snapshot. Calling the drafts machine-checkable without
        that gate would admit false validity and false resource totals.
      cheapest_repair: >-
        Provide a versioned validator (or a fully specified fixture-driven
        validation command) that is hash-bound with the future freeze. Include
        and hash the six named fixtures, enforce status/attempted/terminal and
        valid/invalid relations, exact source-blob keys, phase and ledger
        equations, unique complete arm keys, one-to-one shard coverage,
        terminal totals, and every cap. Require the validator and all fixtures
        to pass before approval or Executor admission.
      design_only_boundary: >-
        Only in-memory schema checks were performed; no run manifest, matrix
        summary, fixture, approval, or experiment artifact was created.

    - id: F-NEW-006
      severity: blocking
      disposition: not_fully_discharged
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-47ae98/repair_design_v3.md:§6 lines 187-228;
        matrix_summary_xor_v3.schema.json:lines 30-79
      why_it_matters: >-
        The 400 invocation arithmetic and the numerical output cap are
        correct: 400*64 MiB + 256 MiB = 27111981056 bytes. The remaining
        matrix/resource contract is not exact. The p set is absent; the
        matrix schema cannot enforce unique arm keys, canonical shard
        membership, or the totals; the equation names valid/invalid while the
        schema names completed_valid/completed_invalid; and “four shard
        workers run sequentially” is inconsistent or at least ambiguous with
        worker_wall=max(shard.wall_seconds) and four active processes. Wall
        overlap, RSS sampling/attribution, and the precise inclusion of raw
        event/replay/analysis/global bytes in per-arm and campaign caps are
        also unstated. These gaps permit both stale cost totals and silently
        changed realized work.
      cheapest_repair: >-
        List all p,b arm keys in a canonical fixture, use the exact schema
        field names completed_valid and completed_invalid in every equation,
        define whether the four shards execute concurrently with sequential
        work within each shard, and specify non-overlapping wall intervals or
        an intentional overlap accounting rule. Define RSS sampling and
        attribution, enumerate every byte class and its cap boundary, require
        one occurrence of each key and shard, and bind a validator that
        recomputes all totals and the 1800-second/4000-second/host-RSS/output
        caps without shrinking not_attempted work.
      design_only_boundary: >-
        No arm, shard, process, timeout, resource, or output measurement was
        run.

    - id: F-NEW-007
      severity: none
      disposition: discharged_for_design_stage
      exact_path_section: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-bd36fe/tasks/TASK-20260809-47ae98/pareto_audit_v3.json:lines 1-79;
        repair_design_v3.md:§8 lines 247-257
      why_it_matters: >-
        This prior blocker is discharged at the design stage. The JSON record
        is machine-readable, lists the checked rows, supplies per-axis values,
        comparability booleans and reasons, explicitly records dominated_by as
        null with a reason, keeps all measured fields null, and places planned
        counts/shards under planned_bookkeeping. No planned value is presented
        as measured SOTA or performance evidence.
      cheapest_repair: >-
        No repair is required for this finding before the next design gate.
        The future freeze must preserve the null-measured boundary and update
        the record only through a new immutable record after actual evidence
        exists.
      design_only_boundary: >-
        No Pareto measurement, dominance claim, SOTA delta, cost result, or
        performance result was asserted.

    - id: F-NEW-008
      severity: blocking_before_freeze
      disposition: not_fully_discharged
      exact_path_section: >-
        repair_design_v3.md:§7 lines 230-245 and §9 lines 259-268;
        pareto_audit_v3.json:rows for EXP-XOR-7267e4 and TASK-20260809-47ae98;
        archived v2 freeze_review.yaml:lines 108-113 and 265-271
      why_it_matters: >-
        The prior review named the stale approved predecessor set exactly:
        EXP-XOR-7267e4, H-XOR-a227dc, and TASK-20260808-e6022f. V3 says only
        “write the predecessor ineligibility decision” and the Pareto record
        contains only an EXP-XOR-7267e4 row. It does not bind that exact set,
        its specification/handoff/hypothesis records, or a machine gate that
        rejects the old Executor path. A future Coordinator could therefore
        create the new specification while leaving an approved stale handoff
        admissible, creating a scope and provenance fork.
      cheapest_repair: >-
        Name all three immutable predecessor IDs in the future specification
        gate, predecessor decision, approval lock, and dispatch dependency
        check. Require explicit historical/ineligible assertions for the
        experiment, hypothesis, and Executor handoff, hash-bind those source
        records, and make the future validator fail if any stale predecessor
        is the selected contract or an eligible dependency.
      design_only_boundary: >-
        No predecessor, specification, handoff, queue, approval, or status
        record was edited or reactivated.

  additional_adversarial_checks:
    exact_prng_and_replay: >-
      Partially passes. SHA-256 domain separation, fixed-width extraction,
      rejection threshold, with-replacement semantics, seed/replica ranges,
      rejected-word retention, accepted-stream retention, and replay are
      present. F-NEW-001 remains because seed tags, counter origin, and
      serialization display/index conventions are not byte-exact.
    canonical_decimal_rational_curve_order_lift_x_identity: >-
      Partially passes. Integer grammar, exact b rational registration,
      integer binary-search bound, curve/order intent, smallest lift_x root,
      sign handling, F cardinality, input digest, ordered RST2 tuple bytes,
      and empty-reference invalidation are present. F-NEW-002 remains because
      the matrix domain and several field/identity/search preconditions are
      not closed.
    prefix_and_complete_validity_wall_estimands: >-
      Prefix ordering and complete-validity median-of-five gating pass. The
      exact wall interval and Delta_AB_wall formula remain open under
      F-NEW-003.
    event_and_conservation_equations: >-
      The prose contains the intended equations and exception treatment, but
      the event/candidate/relation ledger is not schema-required and the phase
      sum domain is ambiguous. F-NEW-004 remains blocking.
    schema_applicability_and_fixture_gate: >-
      The future installation/hash/fixture gate is correctly kept outside this
      design snapshot, but the drafts alone accept inconsistent examples and
      no validator/fixtures are hash-bound. F-NEW-005 remains blocking before
      freeze.
    matrix_keys_shards_resources_output_cap: >-
      Counts and the 27111981056-byte cap arithmetic pass. Exact p-domain
      enumeration, unique key/shard enforcement, terminal total naming, shard
      scheduling, timing/RSS boundaries, and byte-class accounting do not.
      F-NEW-006 remains blocking.
    pareto_comparability_and_null_measured_fields: >-
      Passes for the v3 design record: all measured fields are null, each
      listed row has machine-readable per-axis comparability and reason data,
      dominated_by is explicit, and planned bookkeeping is separate. The
      predecessor-bound defect is separately recorded as F-NEW-008.

