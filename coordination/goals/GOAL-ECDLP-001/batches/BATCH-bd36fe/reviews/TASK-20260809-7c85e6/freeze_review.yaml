      mathematical conclusion, or a research-status transition.

  next_action: >-
    Create a scoped superseding repair that assigns the PRNG serialization and
    replay bytes, enumerates the exact matrix domain, closes canonical curve
    and wall boundaries, makes event/conservation data schema-required,
    supplies a hash-bound fixture validator, resolves shard/resource interval
    accounting, and binds the exact stale predecessor ineligibility set. Then
    snapshot-archive that repair and obtain another fresh independent freeze
    review before any specification, approval, freeze, implementation,
    Executor admission, run, evidence, or official status transition. This
    report authorizes none of those actions.

