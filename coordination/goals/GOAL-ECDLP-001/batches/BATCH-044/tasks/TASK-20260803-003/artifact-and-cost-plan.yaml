artifact_and_cost_plan:
  amendment_id: PA-IT-001-v3-rc44-repair-4
  experiment_id: EXP-IT-001
  task_id: TASK-20260803-003
  claim_tier: toy
  execution_in_this_task: false

  cost_model:
    C_special_formula_id_anomalous: C_special_smart
    c_smart: 8
    anomalous_plant_bits: 20
    matched_rho_formula_id: ceil_0_886_sqrt_Nstar
    matched_rho: ceil(0.886 * sqrt(N_star))
    headroom_path_pullback: floor(0.45 * matched_rho)
    C_special_smart_supersedes: >-
      specification.v3.yaml experiment.inputs.cost_ledger.C_special.anomalous_trace_eq_1
    structural_check_bits20:
      C_special_smart: 160
      matched_rho_approx: 907.264
      ratio_approx: 0.176
      alone_below_0_7: true

  reserved_run_ids:
    - RUN-IT-001-rc44-smoke
    - RUN-IT-001-rc44-measure

  budgets:
    wall_clock_seconds_smoke: 600
    wall_clock_seconds_measure: 3600
    memory_gb: 4

  future_executor_commands:
    binding_entrypoint: experiments/EXP-IT-001/implementation/run_bounded_toy.py
    smoke: >-
      sage experiments/EXP-IT-001/implementation/run_bounded_toy.py
      --amendment experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc44-repair-4.yaml
      --run-id RUN-IT-001-rc44-smoke --mode smoke --seed 2026080301
    measure: >-
      sage experiments/EXP-IT-001/implementation/run_bounded_toy.py
      --amendment experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc44-repair-4.yaml
      --run-id RUN-IT-001-rc44-measure --mode measure --seeds 2026080301,2026080302,2026080303

  future_run_artifacts:
    required:
      - path: command.txt
      - path: environment.json
      - path: manifest.yaml
      - path: stdout.log
      - path: stderr.log
      - path: raw-result.json
      - path: transfer_gate_report.json
        must_include: [c_special_formula_id, matched_rho_formula_id, anomalous_plant_bits, dominated_by, sota_delta]
      - path: anomalous_trace1_certificate.json
      - path: planted_transfer_certificate.json
      - path: null_packaging_gate_report.json
      - path: ctrl_null_it_plant_edge_ledger.jsonl
      - path: density_scan_report.json
        must_include: [bits, multiplicity_method]
      - path: concrete_cost_table.yaml
      - path: HEUR-report.md

  implementation_archive_manifest:
    - experiments/EXP-IT-001/specification.v3.yaml
    - experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc44-repair-4.yaml
    - experiments/EXP-IT-001/implementation/run_bounded_toy.py
    - experiments/EXP-IT-001/implementation/it001_driver.py
    - experiments/EXP-IT-001/implementation/it001_lib.py
    - experiments/EXP-IT-001/implementation/it001_pure.py
    - experiments/EXP-IT-001/implementation/it001_density_worker.py
    - experiments/EXP-IT-001/implementation/recompute_null_plant_from_ledger.py
    - experiments/EXP-IT-001/implementation/implementation.md
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-044/tasks/TASK-20260803-003/control-matrix.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-044/tasks/TASK-20260803-003/artifact-and-cost-plan.yaml

  density_scan:
    bits: [20, 24, 28]
    n_curves_per_bits: 5
    ci: Wilson_95
    multiplicity: bonferroni_3

  pareto:
    dominated_by: Pollard rho at exponent 1/2 (matched negation).
    sota_delta:
      time_exponent_delta: not_applicable
      memory_exponent_delta: not_applicable
      data_or_query_exponent_delta: not_applicable
      non_solver_scope: Design-only TASK-003; no ECDLP cost measurement.

  non_claims:
    - No crypto-scale ECDLP break
    - No H-IT-001 status transition in this task
    - No run execution in this task
