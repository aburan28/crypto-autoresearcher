          block tuples are unaffected and are independently confirmed correct.
      - id: PDC-4
        text: >-
          DEFER-BATCH013-001's cost statement `of order twenty-four times the
          committed EXP-YIELD-002 high-precision block` is superseded and
          corrected to of order twelve times when counted in tuple-legs, the
          committed block being four tuples in two legs, and of order six times
          when counted in the byte-clear unit the contract's own budget note
          uses; no other part of DEFER-BATCH013-001 is changed and it remains
          deferred.
      - id: PDC-5
        text: >-
          The sem_001 column discrepancy in the committed BATCH-012 criterion
          feasibility table is recorded as hand-arithmetic error and not as
          presentation-level rounding; it is present at all eleven 30-replicate
          rows and at none of the thirty-seven 100-replicate rows, and its
          largest instance is 3.929e-3 absolute at T-18-3-B82, where the table
          prints 31.725983 and the authoritative value from the committed
          BATCH-011 results is 31.7299120391; the committed machine records are
          correct at all 48 rows to 0.0 absolute, no criterion and no quantity of
          EXP-YIELD-003 consumes the column, and the committed artifact is
          superseded rather than edited.
      - id: PDC-6
        text: >-
          The clause `no_criterion_may_be_added_later` prohibits the attachment
          of any NEW threshold, acceptance region, band, window, decision rule or
          pass-or-fail reading, and does not prohibit DEC-20260729-003 from
          applying the resume condition carried verbatim from DEC-20260729-002
          NA-1, which pre-exists this contract and is the only disposition
          DEC-20260729-003 is authorised to take on the primary observation.
      - id: PDC-7
        text: >-
          Observation OM-7 is retained and is not struck; no disposition of the
          resume condition may be taken on the mean of delta_z, which is
          identically the replicated 48-tuple z_sem mean minus
          0.36102368504276455 and therefore carries no information the primary
          observation does not, and the resume condition is evaluated on the
          primary observation OM-5's mean and on no other quantity.
      - id: PDC-8
        text: >-
          PP-1's outcome is classified on STREAM EQUALITY and not on numpy
          version equality alone: the Executor records whether the PP-1 48-tuple
          z_sem vector is bit-identical to the primary arm's, records both numpy
          version strings, and records that a different numpy version producing
          an identical stream is a fourth case that the contract's three-case
          statement does not enumerate; under no case may PP-1 be read as a
          portability result, as a cross-version determinism result or as a
          separation of the driver from the build, and if PP-1 yields a second
          fresh-stream 48-tuple mean that mean is reported as a separately
          labelled observation and is never pooled with, averaged into,
          substituted for, or compared against the resume-condition thresholds.
      - id: PDC-9
        text: >-
          The statement that the high-precision block feeds nothing is a
          statement about EXP-YIELD-003 and is not a statement that the block's
          archived numbers are uninterpretable by any future record; a later
          record that pre-registers its reading before looking at them may read
          them, and the deviation of the repaired leg from the exact analytic
          mean in standard-error units - the quantity RT-20260729-021 RT21-6 used
          as its discriminating control - is recomputable from the fields OM-8
          and OM-9 already require.
      - id: PDC-10
        text: >-
          The tail-check counts of absolute z_sem above 1, 2 and 3 are reported
          beside expectations computed under the contract's own stated null for
          z_sem, which is a Student-t mixture of 37 tuples at 99 degrees of
          freedom and 11 at 29 degrees of freedom giving expected counts of
          15.412, 2.389 and 0.187 over 48 draws, and if the standard-normal
          figures 15.231, 2.184 and 0.130 are reported they are labelled as
          computed under a reference distribution that is not the stated null.
      - id: PDC-11
        text: >-
          PRED-ID EXTENDED is applied to every count this contract and its
          records state and not only to counts of tuples; in particular the
          figure 105 is recorded as the number of DISTINCT derived seeds in the
          three committed EXP-YIELD-002 run results.json files, which record 109
          seed fields, the four repeats being the four INV-4-failing tuples
          printed twice inside RUN-YIELD-002-NULL-REPAIRED, and the IV-2c scope
          is recorded as covering all 98 derived seeds IN-1 records, being 49 for
          the antipodal arm and 49 for the independent-throw contrast arm, rather
          than the antipodal arm alone.
      - id: PDC-12
        text: >-
          The standard error of the 48-tuple z_sem mean under the
          independent-stream design is recorded as 0.1466905 rather than
          0.146691, and the two standardised resume-condition edges as 0.9543904
          and 1.7042686 rather than 0.954389 and 1.704194; all three corrections
          are in the sixth decimal place, none changes any statement in which the
          figures bear weight, and the branch probabilities derived from them are
          independently confirmed correct.
      - id: PDC-13
        text: >-
          PP-1's second interpreter is invoked as a subprocess running the single
          declared driver file and returns its numbers to the parent process
          without writing any file inside the repository; if a temporary file is
          unavoidable it is created outside the repository, its exact path is
          recorded in the manifest, and it is removed before the run ends, so
          that the committed artifact set remains exactly the eleven declared
          files and IV-6 does not fire on a twelfth.
      - id: PDC-14
        text: >-
          The unit convention of the resume condition is recorded explicitly:
          `about 0.14 SEM` and `about +0.25 SEM` are 0.14 and 0.25 in the units
          of the z_sem statistic itself, being the same usage as
          RT-20260729-021's `+0.0264 SEM on average` and DEC-20260729-002 NA-1's
          `at most 0.0895 SEM`, and are not multiples of the 0.1466905 standard
          error of the 48-tuple mean; under the alternative reading the
          pre-committed inconclusive region would have probability about 0.49
          rather than 0.2957 under a centred replication.
      - id: PDC-15
        text: >-
          The prohibition on the high-precision difference column is symmetric:
          no record may quote any high-precision repaired-minus-as-recorded
          difference column as a confirmation of T and no record may quote it as
          a disconfirmation of T, and any record that reports the column states
          that its exact expectation under the specified process is
          (|S_(m-2)|/N)[(N-1)(1-2/N)^(C_red/2) + (1-1/N)^(C_red/2)], which agrees
          with T to better than 3.2e-5 at every one of the ten block tuples, so
          that agreement is arithmetic and not evidence.

