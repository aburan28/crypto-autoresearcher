  platform_clause_ruling:
    is_the_narrowing_honest: YES.
    is_it_sufficient: >-
      YES, AND IT IS NOT SATISFIABLE BY SILENCE. Three independent mechanisms
      force disclosure rather than permit omission. First, BND-3 states the
      prohibition as a positive sentence in the contract's own boundaries block -
      `NO RECORD MAY DESCRIBE THIS AS A FRESH-PLATFORM REPLICATION, BECAUSE THE
      PLATFORM DOES NOT CHANGE` - rather than leaving it to be inferred from an
      absent field. Second, ST-4 forbids the run package from describing the
      replication as a fresh-platform replication. Third, IV-7 fires on a MISSING
      environment string, so an omitted disclosure is an invalidation rather than
      a silence, and
      `the_platform_cannot_vary_and_this_is_stated_plainly` requires the Executor
      to state the unavailability in every manifest and in results.json. A clause
      whose omission fires an invalidation rule is not satisfiable by silence.
    is_the_supersession_the_right_instrument: >-
      YES. The word `fresh-platform` is narrowed by a named supersession, SUP-E,
      that quotes the superseded text in both DEC-20260729-002 NA-1 and
      RT-20260729-021 RC-21A, states the cost as strictly less than NA-1 asked
      for, and refers the worth-running judgement to the Coordinator's G-5 ruling
      rather than making it for itself. That is the program's established
      correction mechanism and it is used correctly. No superseded artifact is
      edited.
    is_PP_1_s_three_case_pre_statement_sound:
      ruling: >-
        SOUND IN CASE ONE'S CORE CLAIM, INCOMPLETE AS A TAXONOMY, AND ONE SHADE
        TOO STRONG IN THE WORDS `BY CONSTRUCTION`.
      case_one_core_claim: >-
        CORRECT. If the second build carries the same numpy version, the numpy
        Generator stream is a function of the numpy version and the seed and not
        of the CPython build, so the draws are identical and PP-1 cannot separate
        a driver property from a build property. The contract is right that a
        DIFFERENCE in case one would be a finding about the pipeline.
      the_qualification: >-
        `By construction` holds exactly for the random stream. For the float64
        reductions that turn the stream into a mean and an sd it holds because
        the same numpy version built for a different CPython behaves identically
        on one CPU with runtime SIMD dispatch - which is an empirical property of
        two binaries, not a construction. The distinction is small and it is the
        difference between a tautology and a test.
      the_incompleteness: 'See OBJ-8 and PDC-8.'
    what_the_replication_can_and_cannot_establish_restated_narrowly: >-
      With a fresh master seed on the same driver, the same build and the same
      platform, it separates CHANCE from a SEED-INDEPENDENT DETERMINISTIC PROPERTY
      of the driver-build-platform combination, separates NONE of those three from
      each other, and never separates any of them from the PROCESS. That statement
      in BND-1 and BND-2 is exactly right and this session endorses it without
      narrowing it further.

  required_controls:
    - id: RC-33-K
      title: 'THE CHEAPEST DISCRIMINATING CONTROL, AND IT IS NOT IN THE CONTRACT'
      what: >-
        Draw the 48-tuple primary arm under K independent fresh master seeds
        rather than one, with K of order 10, and report the K values of the
        48-tuple z_sem mean together with their sample sd. Nothing else changes -
        same process, same C-14 schedule, same statistic, same tuples, no
        criterion.
      why_it_is_the_right_control: >-
        The declared purpose is to separate CHANCE from a SEED-INDEPENDENT
        DETERMINISTIC property. A seed-independent deterministic property gives
        the same shift at every master seed; chance gives a scatter of sd
        0.1467. K = 1 distinguishes those two poorly, which the contract admits:
        0.2957 of the time the single draw lands in a pre-committed inconclusive
        region under a centred replication. K = 10 measures the between-seed
        scatter directly and settles the question rather than sampling it once.
      why_the_contract_s_own_argument_does_not_block_it: >-
        The contract correctly refuses to raise n_rep, because z_sem's null sd is
        sqrt((n_rep-1)/(n_rep-3)) and a different replicate count is a different
        statistic. That argument does NOT apply to K: additional master seeds are
        additional independent realisations of the SAME statistic and change its
        law not at all.
      cost: >-
        Re-derived here from committed figures: the primary arm is 4.025e8
        byte-clears against the 3.444e10 of the high-precision block, so one
        extra 48-tuple draw costs about 1.2 per cent of the block. Nine extra
        draws cost of order 3 seconds against a 600-second per-run cap. The
        contract's whole estimated cost is of order 30 seconds.
      status_and_why_it_is_not_a_blocking_objection: >-
        RAISED, NOT IMPOSED. Adopting it changes the frozen seed set and is
        therefore a protocol amendment consuming the single permitted RC-13
        cycle. This session does NOT make it blocking, for three reasons: the
        contract's disclosure of the weakness is complete, pre-data and honest;
        the Coordinator's G-5 scope ruling already judged the narrowed experiment
        worth running and that judgement is not this session's to retake; and a
        second REVISE for any reason ends the batch as a non-execution, so
        spending the cycle carries a real risk of producing nothing. If the
        Coordinator elects to spend the cycle, this is what to spend it on.
      who_may_rule_on_it: >-
        NOT THIS SESSION. RULE-BATCH013-SCOPE and ST-5 assign any cycle-cap
        ruling to a session that did not author the amendment it authorises, and
        this session authored this proposal.
    - id: RC-33-L
      title: 'Preserve the recomputability of the block''s discriminating quantity'
      what: >-
        Require the run record to carry, per block tuple and per leg, the mean,
        the sd, the standard error, N, C_red and the size of S_(m-2) - which OM-8
        and OM-9 already require - and to state in words that the deviation of
        the repaired leg from the exact analytic mean, in standard-error units,
        is recomputable from those recorded fields. No new quantity is computed
        and no threshold is applied.
      why: 'OBJ-9. It costs nothing and it stops the last authorized batch from archiving a discriminating measurement in an unusable form.'
    - id: RC-33-M
      title: 'The counterexample that would expose an implementation artefact, if one exists'
      what: >-
        IV-3 KA-6 and KA-7 already carry it, and they are correctly specified.
        The one mutation not covered is a step-order defect: a driver that draws
        step 2 before step 1 within a replicate produces the same SET of marked
        bins and the same distinct count, so no known-answer case detects it, yet
        it leaves the generator in a different state and makes the run
        irreproducible against the recorded seed.
      cheapest_detection: >-
        Record, for one named tuple, the first three raw integers the per-tuple
        generator returns after seeding, beside the derived seed. That is three
        integers in results.json, no threshold, no criterion, and it pins the
        stream position that the contract's own `the_named_calls_and_the_stream_order`
        clause says is load-bearing.
      status: 'RAISED AS AN OPTIONAL TIGHTENING. Not imposed; it adds a reported field.'

  pre_dispatch_conditions:
    binding_statement: >-
      EVERY CONDITION BELOW MUST APPEAR VERBATIM IN THE TASK-20260729-034
      SNAPSHOT COMMIT RECEIPT BEFORE TASK-20260729-035 IS DISPATCHED. D-2 is this
      program's worked example of what a late recording costs: a condition
      recorded after the fact is not a condition. None of these conditions
      changes a seed, a replicate count, a tuple set, a block membership, a
      denominator reading, a tolerance or an invalidation-rule value, so none is
      a protocol amendment and none consumes the RC-13 one-cycle cap.
    conditions:
      - id: PDC-1
        text: >-
          IV-6's clause `applies any threshold to any quantity of this contract`
          is scoped to the observation quantities OM-1 through OM-9 and to any
          quantity derived from them, and does not reach the tolerances that
          invalidation rules IV-1 and IV-3 themselves mandate; the driver's
          application of the 1e-9 absolute tolerances of IV-1 and KA-8 and of the
          4.000-sigma tolerances of KA-3, KA-4 and KA-6 is required execution of
