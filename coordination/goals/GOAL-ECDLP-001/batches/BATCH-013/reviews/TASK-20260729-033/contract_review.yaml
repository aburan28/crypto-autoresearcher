contract_review:
  id: REV-20260729-033
  task_id: TASK-20260729-033
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-013
  role_as_dispatched: reviewer
  role_contract_executed: >-
    red-team. The dispatch queue entry names role `reviewer`; this session runs
    under agents/red-team.md. The queue governs the artifact paths, the write
    scope and the completion gate, and all ten gate items R1 to R10 are answered
    here. The adversarial posture of agents/red-team.md was applied in addition
    to, and never in place of, the queue's constraints.
  reviewed_object: experiments/EXP-YIELD-003/specification.yaml
  reviewed_companion: >-
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-013/tasks/TASK-20260729-031/observation_feasibility_table.md
  reviewed_at_commit: de6fbb752f9f0b9ce28fda91b15a88593861dfcc
  verdict: PASS
  verdict_qualifier: >-
    PASS WITH FIFTEEN NUMBERED PRE-DISPATCH CONDITIONS, AND NO BLOCKING
    OBJECTION. Every objection below is dischargeable by recording a condition
    verbatim in the TASK-20260729-034 receipt; none requires editing a frozen
    protocol element - no seed, replicate count, tuple set, block membership,
    denominator reading, tolerance or invalidation-rule value is changed by any
    condition. That is why this is a PASS and not a REVISE. It is not leniency:
    two objections, PDC-1 and PDC-2, are severe enough that if the Coordinator
    does not record them the batch is likely to produce either an ST-3 stop or a
    false mandated sentence in an immutable artifact, and both outcomes would
    repeat BATCH-012 exactly.
  blocking_objections: []
  blocking_objection_count: 0

  is_a_criterion_free_experiment_legitimate_here:
    ruling: >-
      YES, IN THIS INSTANCE, AND THE ABSENCE IS CORRECT RATHER THAN A CATEGORY
      ERROR.
    reasoning: >-
      The statistic under replication was a post-hoc tail-check observation of
      EXP-YIELD-002 that stood outside all four of that contract's criteria and
      fired nothing. Attaching a criterion now would (i) invent a test the
      original never had, and (ii) create precisely the pre-registration-order
      versus confirmatory-standing conflation that the contract's own
      confirmatory_status_basis block forbids, since the first realisation of the
      quantity is already committed and already read. The correct analogue is a
      calibration protocol - acceptance limits on the INSTRUMENT, none on the
      MEASURAND. This contract keeps all seven invalidation rules, all of which
      the feasibility table shows CAN FIRE, so it is not unfalsifiable in the
      sense that matters: a defective run is still detectable and still invalid.
    the_limit_of_that_ruling: >-
      `No success criterion` must never be reported as `nothing can go wrong`.
      IV-3 can fire and would invalidate the entire run set. And the contract is
      NOT threshold-free in substance: the carried resume condition is a
      pre-registered three-way disposition rule keyed on the primary observation,
      and the contract itself calls its two numbers `the ONLY numeric
      dispositions in this contract`. The honest formulation, which the receipt
      should record, is: no success criterion, no falsification criterion, no
      hypothesis transition - AND one pre-registered disposition rule on the
      primary observation, carried verbatim from the governing decision and not
      chosen here.
    the_real_risk_which_is_not_the_missing_criterion: >-
      Not that the experiment cannot fail, but that its most likely outcome is
      uninformative. Re-derived below: under a centred replication the design
      lands in a pre-committed INCONCLUSIVE region 0.2957 of the time. That is
      disclosed correctly and pre-data, which is the right disclosure; it is also
      the reason for required control RC-33-K.

  is_the_RT21_1_structural_response_right:
    ruling: >-
      THE DIAGNOSIS IS RIGHT AND THE REPLACEMENT IS RIGHT. THE CLAIM THAT NO
      MANDATORY-SENTENCE CLAUSE WAS CREATED IS FALSE.
    what_is_right: >-
      C-20's mechanism - widening a self-critical sentence into an obligation
      binding every later record - is correctly identified as the propagation
      channel. A mandated verbatim sentence cannot be corrected in the carrying,
      so a false one reaches immutable artifacts uncorrected, which is what
      happened. Replacing a mandated SENTENCE with a rule about HOW statements
      are made (PRED-ID EXTENDED) preserves the function C-20 served - limits
      travel with the claim - without the propagation hazard, because a rule
      re-derives at each use while a sentence only copies. Removing the mechanism
      therefore loses nothing the mechanism was for.
    what_is_wrong: >-
      See objection OBJ-2. The clause
      `the_constrained_sentence_binding_every_record_this_contract_produces` at
      lines 200 to 206 IS a mandatory-sentence clause: it mandates a substantive
      empirical sentence on this contract, its driver, its three run records, its
      results summary, EV-ECDLP-010 and DEC-20260729-003. It therefore directly
      contradicts `no_mandatory_sentence_clause_is_created` at line 802, and the
      sentence it mandates carries an empirical claim that this very experiment
      may contradict of its own data.
    does_the_PRED_ID_extension_actually_bind:
      ruling: PARTIALLY. IT BINDS COUNTS OF TUPLES AND NOT COUNTS OF ANYTHING ELSE.
      test_applied: >-
        The extension's operative sentence reads `EVERY STATEMENT THAT REPORTS A
        COUNT OF TUPLES SAYS IN TERMS THAT IT IS A COUNT AND NAMES THE TUPLES OR
        NAMES THE EXACT TABLE SECTION WHERE THEY ARE NAMED`, while the declared
        scope one sentence earlier is `EVERY POWER, SENSITIVITY, COUNT AND
        MAGNITUDE STATEMENT THE CONTRACT MAKES ABOUT ITSELF`. The operative
        sentence is narrower than the declared scope. Tested against the
        contract's own text: every count OF TUPLES complies - 48, 29, 19, 37, 11,
        four, six, ten, 49 all say they are counts and all name their members or
        the table section that does, and all were re-derived correct here. Counts
        that are NOT of tuples do not comply - `105` derived seeds, `73` seeds
        (members named only in the table, which does comply), `20` streams,
        `eleven` artifacts (complies), `192` tests (complies). `105` names no
        members anywhere and is additionally ambiguous between occurrences and
        distinct values; see OBJ-11.
      verdict_on_the_extension: >-
        The extension is a real improvement and it did NOT prevent recurrence in
        the contract's own companion table. Four further instances of the same
        genus were found here - OBJ-3, OBJ-4, OBJ-10 and OBJ-11 - which is the
        strongest available argument that a RULE beats a SENTENCE, and also that
        this rule needs the one-clause widening in PDC-11.

  fourth_cardinality_not_identity_instance_hunted_as_ordered:
    ordered_by: >-
      OI-7 of the contract, which asks the reviewer to hunt for a fourth instance
      rather than to confirm absence.
    result: FOUR FURTHER INSTANCES FOUND, TWO OF THEM DEMONSTRABLY FALSE.
    the_cleanest_one: >-
      OBJ-3. Observation feasibility table section 6 states `The nearest
      non-selected neighbours, recorded so the boundary is checkable:
      T-18-2-B82 at 0.01284643 from below`. T-18-2-B82 is RANK 5 of the 29 m = 2
      tuples ordered by lambda ascending. The rank-4 tuple, which is the actual
      nearest non-selected neighbour from below, is T-16-2-B38 at lambda
      0.01100056. An ordinal position was read for a member identity, in the
      exact sentence written so that a boundary could be checked. The neighbour
      from above, T-12-2-B54 at 0.36440890, IS rank 26 and is correct.
    the_others: 'OBJ-4, OBJ-10, OBJ-11. See objections.'
    what_none_of_them_changes: >-
      None touches the RC-21B rule, the six selected names, the 48-tuple set, any
      seed, any tolerance, or any invalidation rule. All four are statements
      ABOUT the design in a companion artifact or a deferral note, and no
      quantity the run computes depends on any of them.

  objections:
    - id: OBJ-1
      severity: MAJOR_NON_BLOCKING
      discharged_by: PDC-1
      title: >-
        IV-6 as written invalidates the driver for correctly executing IV-1 and
        IV-3, and a literal Executor reaches ST-3
      finding: >-
        IV-6 fires when the driver `applies any threshold to any quantity of this
        contract`. IV-1 requires the driver to apply a 1e-9 absolute threshold to
        recomputed lambda, exp(-lambda), T and P_pred at all 48 tuples, which is
        192 threshold applications. IV-3 requires the driver to apply a 4.000
        empirical-sigma threshold at KA-3, an 0.00178145 half-band at each of 11
        bins in KA-4, an 0.00114993 half-band at KA-6, and a 1e-9 threshold at
        KA-8. Every one of those quantities is a quantity of this contract. Read
        literally, a correct run fires IV-6 and is INVALID.
      why_it_is_not_hypothetical: >-
        This lineage's Executor is demonstrably literal: DEV-4 was found and
        declared, rather than patched, precisely because the enumerated arm-label
        set was read literally. ST-3 obliges a STOP AND REPORT when the contract
        `cannot be executed as written`, and two rules that invalidate each other
        is that case. The most likely realised failure is a stop before the first
        draw, which under RULE-BATCH013-SCOPE costs the batch.
      severity_rationale: >-
        Not blocking because it is a scoping ambiguity, not a design defect, and
        the intended scope is unambiguous from context: IV-6's threshold clause
        is the mechanical enforcement of the no-criterion design and is aimed at
        the OBSERVATIONS, not at the integrity checks. A recorded condition
        settles it without changing any rule value.
    - id: OBJ-2
      severity: MAJOR_NON_BLOCKING
      discharged_by: PDC-2
      title: >-
        A mandatory-sentence clause IS created, it contradicts the clause that
        says none is, and the sentence it mandates may be false of this
        experiment's own data
      finding: >-
        `the_constrained_sentence_binding_every_record_this_contract_produces`
        mandates on this contract, its driver, its three run records, its results
        summary, EV-ECDLP-010 and DEC-20260729-003 the sentence `IT LANDS AT OR
        SLIGHTLY ABOVE IT, by an amount larger than the declared second-order
        biases account for and, on the committed record as it stands,
        unexplained`. `no_mandatory_sentence_clause_is_created` asserts `THIS
        CONTRACT CREATES NO CLAUSE MAKING ANY SENTENCE MANDATORY ON ANY
        DOWNSTREAM RECORD`. The two are directly contradictory.
      why_it_matters_beyond_the_contradiction: >-
        The mandated sentence carries an empirical claim derived from
        EXP-YIELD-002's realised data. It is qualified `on the committed record
        as it stands`, which scopes it correctly - but the clause then binds
        records that describe EXP-YIELD-003's data. If the replicated mean lands
        near zero, a run record describing THAT data would still be obliged to
        carry a sentence asserting an unexplained positive offset. That is the
        C-20 failure mode one iteration later: a sentence true of one data set
        made mandatory on records of another.
      the_narrowest_correct_reading: >-
        The prohibition half - NO RECORD MAY SAY THE REPAIRED NULL LANDS ON
        P_pred - is sound and should stand for both data sets, because the exact
        process mean provably exceeds P_pred for every declared tuple; this
        session re-derived the excess and it is strictly positive at all 48, with
        a maximum of 0.130512 bins at T-16-3-B58. The ASSERTION half must be
        scoped to the committed EXP-YIELD-002 realisation.
    - id: OBJ-3
      severity: MODERATE
      discharged_by: PDC-3
      title: >-
        FOURTH CARDINALITY-NOT-IDENTITY INSTANCE - the nearest non-selected
        lambda neighbour is misidentified in the feasibility table
      finding: >-
        Table section 6 names T-18-2-B82 at 0.01284643 as the nearest
        non-selected neighbour from below. Re-derived from IN-1: the ascending
        lambda order over the 29 m = 2 tuples places T-18-2-B34 0.00220858,
        T-18-2-B44 0.00369879, T-18-2-B58 0.00642703 at ranks 1 to 3, and
        T-16-2-B38 at 0.01100056 at rank 4. T-18-2-B82 is rank 5. The nearest
        non-selected neighbour from below is T-16-2-B38, not T-18-2-B82.
      materiality: >-
        NONE to the selection. The rule is the binding object, the six selected
        names are CONFIRMED correct, and the rank-3 to rank-4 gap - 0.00642703 to
        0.01100056 - is wide, so the boundary is robust either way. Materiality
        is entirely to the reader who uses the sentence for its stated purpose.
    - id: OBJ-4
      severity: MODERATE
      discharged_by: PDC-4
      title: >-
        FIFTH INSTANCE - DEFER-BATCH013-001's cost multiple counts tuple-legs as
        tuples
      finding: >-
        The contract states the deferred structurally exact arm is `of order
        twenty-four times the committed EXP-YIELD-002 high-precision block`. The
        committed block ran BOTH processes at FOUR tuples, i.e. 8 tuple-legs at
        10^4 replicates. The deferred arm is 48 tuples in 2 legs, i.e. 96
        tuple-legs. 96 / 8 = 12, not 24. On the contract's OWN cost unit, the
        byte-clear, the ratio is smaller still: the sum of N over the 48 declared
        tuples is 5,353,386 against 850,754 over the four block tuples, a factor
        of 6.29. The figure 24 is reached only by counting the committed block as
        4 tuple-legs when it is 8.
      materiality: >-
        NONE to any run. It is a cost figure attached to an explicitly deferred
        item and is labelled a MAGNITUDE and `of order`. It matters because a
        later batch may decide whether to dispatch DEFER-BATCH013-001 on this
        figure, and the true cost is half to a sixth of the stated one - i.e. the
        error argues AGAINST the deferred arm on cost when the corrected figure
        argues for it.
    - id: OBJ-5
      severity: MODERATE
      discharged_by: PDC-5
      title: >-
        OI-4 RULING - the sem_001 discrepancy is not `presentation-level
        rounding`, it is hand-arithmetic error at all eleven rows, and the
        largest was not checked
      finding: >-
        The reading offered in table section 2.3 is right in its MATERIALITY
        conclusion and wrong in its CHARACTERISATION and in its implied
        magnitude. Re-derived here for all eleven 30-replicate rows against
        s_001/sqrt(30) from IN-1, in double precision. All eleven disagree with
        the committed BATCH-012 column. Rounding a value to six decimals cannot
        move it by more than 5e-7; the observed differences run from 2.46e-5 to
        3.929e-3, so they are not rounding. The largest, 3.929e-3 at T-18-3-B82
        (quoted 31.725983, authoritative 31.7299120391), is 45 times the largest
        of the three rows the authoring session hand-checked, and T-18-3-B82 was
        not among them. All 37 rows at n = 100 are exact, which is consistent
        with the column having been formed by hand division by sqrt(30) at the
        30-replicate rows and by an exact shift of the decimal point elsewhere.
      what_is_correct_in_the_offered_reading: >-
        Confirmed independently: EXP-YIELD-003 consumes no part of the sem_001
        column; the machine record is right, with sem_001_DETERMINED equal to
        s_001/sqrt(n_rep) to 0.0 absolute at all 48 rows of the committed
        EXP-YIELD-002 repaired arm; and no criterion depends on the printed
        table, this contract having none. The item is a disclosure about a
        committed coordination artifact and not a defect in EXP-YIELD-003. THAT
        READING IS RIGHT.
    - id: OBJ-6
      severity: MODERATE
      discharged_by: PDC-6
      title: >-
        `no_criterion_may_be_added_later` literally forbids DEC-20260729-003 from
        applying the resume condition it is dispatched to apply
      finding: >-
        The clause forbids attaching any `decision rule` to the replicated z_sem
        mean `by the run records, by the reviews, by EV-ECDLP-010, by
        DEC-20260729-003 or by any later record`. The carried resume condition IS
        a decision rule attached to the replicated z_sem mean, and
        DEC-20260729-003 is the record that must apply it. The intended reading -
        no NEW criterion may be added - is clear from the clause title and from
        the contract's separate insistence that the resume condition is carried
        verbatim rather than chosen. But the operative sentence does not carry
        the qualifier, and ST-4 separately forbids only the RUN PACKAGE from
        stating a disposition, leaving the exception implicit.
    - id: OBJ-7
      severity: MODERATE
      discharged_by: PDC-7
      title: >-
        OI-5 RULING ON OM-7 - KEEP IT, DO NOT STRIKE IT; but its aggregate is a
        deterministic shift of the primary observation and is therefore a
        smuggled-disposition surface
      ruling: KEEP.
      reasons_to_keep: >-
        (a) Striking it would remove a metric from a frozen file and would
        consume the single permitted amendment cycle for a change with no
        integrity benefit. (b) It does not introduce IN-3 as a new input: the
        contract already reads all three committed EXP-YIELD-002 results.json
        files for the IV-2b seed-collision check regardless of OM-7, so striking
        OM-7 removes no input. (c) The per-tuple delta_z vector genuinely is the
        comparison a reader constructs by hand and gets wrong, and getting it
        right requires matching on tuple label and knowing the two draws are
        independent by construction - both of which the contract states. (d) The
        SD of delta_z over the 48 tuples is NOT recoverable from OM-5 and is a
        genuine additional observation.
      the_defect_that_survives_keeping_it: >-
        The MEAN of delta_z is not additional information. Because the committed
        vector is a fixed realised quantity, mean(delta_z) equals mean(z_new)
        minus 0.36102368504276455 exactly. A record could therefore report `the
        delta_z mean is about -0.36, so the shift did not reproduce` and take the
        resume-condition disposition through a differently named quantity while
        formally never applying a threshold to OM-5. That surface must be closed
        by condition, not by striking the metric.
    - id: OBJ-8
      severity: MODERATE
      discharged_by: PDC-8
      title: >-
        PP-1's three-case taxonomy is not exhaustive, and this host will most
        likely realise the missing case
      finding: >-
        The taxonomy splits on numpy VERSION equality: case one same version, so
        bit-identical by construction; case two different version, so `the stream
        changes entirely`; case three no importable numpy. The missing case is
        DIFFERENT VERSION, IDENTICAL STREAM. numpy's Generator bit stream is not
        guaranteed stable across feature releases but is in practice stable
        across patch releases, so a 2.4.0 to 2.4.4 move will very likely produce
        an identical PCG64 stream and therefore identical numbers. A reader
        applying the taxonomy would then classify a genuinely null result as case
        two - `confounds build with stream` - when nothing varied at all; or
        worse, would read bit-identity across two numpy versions as a portability
        or cross-version determinism result, which BND-4 forbids.
      host_evidence: >-
        See UNARCHIVED PROBE, NOT EVIDENCE in the companion note. It indicates
        that case one is not reachable on this host without installing a matching
        numpy elsewhere, and that the realised case will be a different numpy
        version. That makes the missing case the LIKELY case rather than a corner
        case.
      what_is_right_about_PP_1: >-
        The case-one analysis is correct as far as it goes and is the subtle part
        the contract identifies correctly: a same-numpy build reproduces the
        numbers because the Generator stream is fixed by the numpy version and
        the seed rather than by the CPython build, so it cannot separate a driver
        property from a build property. One qualification: that holds BY
        CONSTRUCTION for the random stream and only by same-compiled-behaviour
        for the float64 reductions, since the same numpy version built for a
        different CPython is a different binary. On one CPU with runtime SIMD
        dispatch the reductions will agree, but `by construction` is a shade too
        strong for the arithmetic half of the claim.
    - id: OBJ-9
      severity: MODERATE
      discharged_by: PDC-9
      title: >-
        RC-21B is satisfied in letter and not in purpose - the extended block is
        the discriminating measurement and the contract forbids reading it
      finding: >-
        RC-21B was raised because the four existing high-precision tuples are a
        deliberately selected subset and `the unexplained shift is present
        equally at m = 2, where nothing is measured at high precision`.
        RT-20260729-021 RT21-6 then used exactly the high-precision quantity as
        `the discriminating control already run`, reasoning that a real fixed
        bins-level offset giving +0.3346 at 100 replicates must give +2.9 to +3.7
        at 10000, and reporting observed deviations of -2.95, +0.97, +0.61 and
        -0.45. EXP-YIELD-003 runs that measurement at ten tuples including six at
        m = 2, and then declares that the whole block `FEEDS NO CRITERION, NO
        THRESHOLD, NO INVALIDATION RULE AND NO VERDICT` and may not be `compared
        against any other quantity of this contract to produce a disposition`.
        The one measurement in this batch with real discriminating power is
        therefore the one no record may read.
      why_this_is_nevertheless_defensible: >-
        Attaching a criterion to it after the fact would be exactly the post-hoc
        success criterion the contract forbids, and RT21-6's reading is already
        committed and already stands. The discipline is right; the risk is only
        that `feeds nothing in EXP-YIELD-003` is later misread as `is
        uninterpretable forever`, so that the last authorized batch archives a
        discriminating measurement nobody may ever use.
      one_reporting_gap: >-
        OM-8 requires per leg the mean, sd and standard error and the
        repaired-minus-as-recorded difference with its standard error. It does
        NOT require the deviation of the repaired leg from the exact analytic
        mean, which is the quantity RT21-6 used. That deviation is recomputable
        after the fact from the recorded mean, sd, N, C_red and the size of
        S_(m-2), all of which OM-8 and OM-9 record, so nothing is lost - but the
        recomputability should be stated so a future record knows it is
        available.
    - id: OBJ-10
      severity: MINOR
      discharged_by: PDC-10
      title: >-
        SIXTH INSTANCE, AND A WRONG REFERENCE DISTRIBUTION - the tail check
        compares counts against standard-normal expectations while the contract's
        own stated null for z_sem is Student-t
      finding: >-
        The first tail check reports counts of absolute z_sem above 1, 2 and 3
        `with the standard-normal expectations for 48 draws beside them`.
        Feasibility table section 3.1 states, correctly, that z_sem is a Student-t
        variate on n_rep - 1 degrees of freedom, and the contract's own
        replicate-schedule rationale turns on exactly that. Re-derived here, the
        expected counts over the realised 37-at-99-df plus 11-at-29-df mixture
        are 15.412, 2.389 and 0.187 against standard-normal 15.231, 2.184 and
        0.130. The declared reference is systematically too thin in the tail - by
        44 per cent at the 3-sigma count - so a reader comparing realised counts
        against it will see an apparent tail excess that is an artefact of the
        wrong reference.
      relation_to_the_recurring_failure: >-
        This is the same genus once more: a count is placed beside an expectation
        computed for a different population from the one that generates it.
    - id: OBJ-11
      severity: MINOR
      discharged_by: PDC-11
      title: >-
        SEVENTH INSTANCE - `105 derived seeds` is a count with no named members
        and is ambiguous between occurrences and distinct values, and PRED-ID
        EXTENDED does not reach it
      finding: >-
        The contract and the table both assert the comparison pool includes `the
        105 derived seeds recorded in the three committed EXP-YIELD-002 run
        results.json files`. Enumerated here: those three files record 109 seed
        fields, of which 105 are distinct. The four repeats are the four
        INV-4-failing tuples, whose rows are printed twice inside
        RUN-YIELD-002-NULL-REPAIRED - once in `rows` and once in
        `INV_4_failing_tuples_reported_separately` - and not, as a reader might
        assume, the four DEV-4 shared high-precision seeds. `105` is correct as a
        distinct count and wrong as an occurrence count, and its members are
        named nowhere. PRED-ID EXTENDED does not catch it because its operative
        sentence binds only counts OF TUPLES.
      materiality: >-
        NONE to IV-2b, which is correctly written as a coincidence test and not
        as a cardinality test. It would matter if a driver implemented IV-2b by
        first asserting a pool size of 105.
    - id: OBJ-12
      severity: MINOR
      discharged_by: PDC-11
      title: >-
        The IV-2c scope sentence under-describes what IN-1 actually records
      finding: >-
        The scope disclosure says IV-2c covers `the derived seeds IN-1 records
        for the BATCH-011 antipodal arm`. IN-1 records 98 derived seeds, all
        distinct: 49 for the antipodal arm and 49 for the independent-throw
        contrast arm. IV-2c's own rule text - `any derived seed recorded in IN-1`
        - is correct and broader than its own disclosure. This is an
        under-claim, not an over-claim, and is therefore harmless to integrity;
        it is recorded because a scope statement that names a set smaller than
        the rule tests is the kind of drift that later gets quoted as the rule.
    - id: OBJ-13
      severity: MINOR
      discharged_by: PDC-12
      title: >-
        The SEM magnitude and the two standardised edges each disagree with the
        contract's own arithmetic chain in the last digit
      finding: >-
        The contract and table state SEM(mean) as 0.146691. The stated chain
        sqrt(1.03286878)/sqrt(48) evaluates to 0.1466904890, which rounds to
        0.146690. The standardised edges are stated as 0.954389 and 1.704194;
        re-derived they are 0.9543904 and 1.7042686. The `about 0.1467`, `about
        0.95` and `about 1.70` forms used everywhere the figures actually bear
        weight are all correct.
      materiality: 'NONE. Recorded only because OI-2 and OI-3 asked for a re-derivation.'
    - id: OBJ-14
      severity: MINOR
      discharged_by: PDC-13
      title: >-
        PP-1's inter-process mechanics are unspecified and can collide with IV-6's
        eleven-file rule
      finding: >-
        PP-1 requires re-executing the primary 48-tuple arm under a second
        interpreter and recording the result inside
        RUN-YIELD-003-REPLICATE-REPAIRED's results.json. The contract does not
        say how the second process returns its numbers to the first. The obvious
        implementation - write a temporary JSON and read it back - writes a
        twelfth file and fires IV-6, and a temp file inside the repository would
        also leave the tree dirty. The contract also forbids the driver from
        importing any Python file other than itself, which is satisfied by
        re-invoking the same driver file as a subprocess but should be said.
    - id: OBJ-15
      severity: NOTE_NOT_A_DEFECT
      discharged_by: PDC-14
      title: >-
        The unit convention of the resume condition's `0.14 SEM` and `+0.25 SEM`
        is ambiguous on its face; the contract's reading is the CORRECT one and
        the alternative would change section 4 materially
      finding: >-
        `within about 0.14 SEM of zero` admits two readings: 0.14 in z_sem units,
        which is what the contract adopts, or 0.14 standard errors of the
        48-tuple mean, which would be 0.14 x 0.1466905 = 0.02054. The contract's
        reading is right, and the proof is in the originating records rather than
        in the contract: RT-20260729-021 RT21-6 writes `the exact process bias
        accounts for only +0.0264 SEM on average, so +0.3346 SEM is unexplained`,
        and DEC-20260729-002 NA-1 binding condition four writes `a declared mean
        gap of at most 0.0895 SEM` - in both, `SEM` is the unit name of the z_sem
        reading, not a multiplier of the aggregate standard error. Under the
        alternative reading the unassigned probability under a centred
        replication would be about 0.49 rather than 0.2957.
      why_it_is_recorded_as_a_note_and_not_an_objection: >-
        Because the contract's reading is correct and its
        `the_unassigned_region_is_named_and_is_recorded_as_inconclusive` clause
        is right to say it adds no branch and moves no threshold. It is recorded
        because naming the unit IS fixing the threshold, and a later reader
        without the originating records in front of them could re-open it.

  smuggled_criterion_hunt:
    performed: YES
    result: >-
      NO SUCCESS OR FALSIFICATION CRITERION IS SMUGGLED IN. FOUR SURFACES EXIST
      ON WHICH A REALISED VALUE COULD BE REPORTED AS A PASS OR FAILURE OF
      SOMETHING, AND ALL FOUR ARE NAMED.
    surfaces:
      - id: SC-1
        surface: >-
          The resume condition itself. It is a genuine pre-registered three-way
          disposition rule keyed on the primary observation. The contract's
          defence - that it disposes of an instrument note and not of a
          hypothesis - is a real distinction and is sustained, but the contract
          should not be described anywhere as threshold-free.
        disposition: 'ACCEPTED AS CARRIED. Covered by PDC-6 and PDC-14.'
      - id: SC-2
        surface: >-
          mean(delta_z) of OM-7, which equals mean(z_new) minus
          0.36102368504276455 exactly and therefore permits the resume-condition
          disposition to be taken through a differently named quantity.
        disposition: 'CLOSED BY PDC-7.'
      - id: SC-3
        surface: >-
          The tail-check counts of absolute z_sem above 1, 2 and 3 reported
          beside expectations. Counts beside expectations is a chi-square-shaped
          surface even when no test is performed, and here the expectation is
          computed from the wrong reference distribution.
        disposition: 'CLOSED BY PDC-10.'
      - id: SC-4
        surface: >-
          The high-precision difference column against T. Re-derived here: the
          exact expectation of the repaired-minus-as-recorded difference is
          (s/N)[(N-1)(1-2/N)^(C_red/2) + (1-1/N)^(C_red/2)], which agrees with
          T = |S_(m-2)| exp(-lambda) to better than 3.2e-5 at every one of the
          ten block tuples. The column is therefore a clean unbiased estimator of
          T, which is exactly why a reader will be tempted to call agreement a
          confirmation. The existing prohibition covers CONFIRMATION and is
          silent on DISCONFIRMATION.
        disposition: 'CLOSED BY PDC-15.'
    conclusion_on_gate_item_R6: >-
      The contract does NOT smuggle a criterion onto its primary quantity. It
      carries one pre-existing disposition rule, correctly attributed, and four
      surfaces that must be fenced by condition rather than by removal.

