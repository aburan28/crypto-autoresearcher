          `the_constrained_sentence_binding_every_record_this_contract_produces`
          is read in two parts: its prohibition, that no record may say the
          repaired null lands ON P_pred, binds every record this contract
          produces without qualification; its assertion, that the null lands at
          or slightly above P_pred by an amount larger than the declared
          second-order biases account for and unexplained, is scoped to the
          committed EXP-YIELD-002 realisation only and may not be asserted of
          EXP-YIELD-003's own realised data by any run record, results summary,
          review, EV-ECDLP-010 or DEC-20260729-003.
      - id: PDC-3
        text: >-
          Observation feasibility table section 6's sentence naming T-18-2-B82 at
          lambda 0.01284643 as the nearest non-selected lambda neighbour from
          below is superseded and corrected: the rank-4 tuple, and therefore the
          nearest non-selected neighbour from below, is T-16-2-B38 at lambda
