        9854 and 5294 bytes).
    - id: AC-10
      check: PDC-1 through PDC-15 carried verbatim.
      result: >-
        PASS. summary.json carries all fifteen condition texts and each is byte-identical to
        the corresponding text in the TASK-20260729-034 receipt's
        PRE_DISPATCH_CONDITIONS_VERBATIM block. All three results.json files carry a
        fifteen-key pre_dispatch_condition_compliance record.

  metric_recomputations:
    - id: MR-1
      quantity: >-
        The primary observation OM-5, recomputed from the 48 raw per-tuple means, standard
        deviations and replicate counts, independently of the driver's summary code.
      method: >-
        z_i = (mean_i - P_pred_i) / (sd_ddof_1_i / sqrt(n_rep_i)) computed row by row, then
        mean, sample sd at ddof 1, and sd/sqrt(48).
      recomputed:
        n: 48
        mean: 0.33369767840297898
        sample_sd_ddof_1: 0.89157053997649016
        standard_error: 0.12868712281424166
        min: -1.6051967280661212
        max: 2.2570411311500851
      package_values:
        mean: 0.33369767840297898
        sample_sd_ddof_1: 0.89157053997649016
        standard_error: 0.12868712281424166
      max_absolute_difference: 0.0
      per_element_check: >-
        The maximum absolute difference between the 48 independently recomputed z_sem values
        and the 48 recorded z_sem values is exactly 0.0, and the sorted 48-entry vector is
        element-wise identical to the recorded sorted vector.
      note: >-
        Recorded honestly - an alternative summation route (statistics.stdev) returns
        0.89157053997649005, one unit in the last place below the recorded value, which is
        the expected float-summation-order effect. The naive route and the fsum route both
        return the recorded value bit for bit.
    - id: MR-2
      quantity: n_neg, tail counts and the maximum.
      recomputed: >-
        n_neg = 16 by all three equivalent routes (z_sem strictly negative, the recorded sign
        field, and mean minus P_pred strictly negative), with the same sixteen named members
        as the record. Tail counts of |z_sem| above 1, 2 and 3 are 12, 3 and 0. The maximum
        |z_sem| is 2.2570411311500851, which rounds to 2.257041, attained at T-18-2-B82.
      agreement: EXACT at every figure. CONFIRMED, not contradicted.
    - id: MR-3
      quantity: The BATCH-012 comparator, recomputed from the committed EXP-YIELD-002 blob.
      recomputed: >-
        From RUN-YIELD-002-NULL-REPAIRED at c7189f80, the 48-tuple z_sem mean is
        0.3610236850427646, sd 0.9750016842, standard error 0.1407293712, n_neg 16, tails
        15/4/0, max 2.6101537975436533. The driver's quoted constant
        0.36102368504276455 equals the recomputed mean exactly.
      note: >-
        The receipt quotes the comparator standard error as 0.1407; the exact value is
        0.1407293712. Using either value the difference of the two means, 0.0273260066,
        stands at 0.14 combined standard errors (0.1906748 versus 0.1906964). No disposition
        is stated here.
    - id: MR-4
      quantity: Comparability of the two arms.
      result: >-
        CONFIRMED. The 48 tuple labels are identical and in identical order; n_rep matches
        tuple by tuple (37 at 100, 11 at 30); P_pred matches tuple by tuple exactly; and the
        derived seed differs at every one of the 48 tuples. The replication is the same 48
        parameter points of the same process under a disjoint seed block.
    - id: MR-5
      quantity: IV-1's 192 tolerance tests.
      result: >-
        CONFIRMED INDEPENDENTLY. Recomputing lambda, exp(-lambda), T and P_pred from IN-1's
        integer constants at each of the 48 de-duplicated tuples gives a maximum absolute
        difference against the quoted values of exactly 0.0 on all four quantities, far
        inside the 1e-9 tolerance. IN-1 carries exactly 49 cells; IN-2 reports
        n_evaluable_on_measured_B 49 and n_eval_denominator 49; RC-C de-duplication on
        measured B within (k, m) columns yields exactly 48 tuples with T-12-3-B22 the single
        merge and the first-listed occurrence (beta 0.325) binding, which is what the
        recorded seed string uses; no declared tuple has an odd C_red; and the C-14 replicate
        schedule reproduces IN-1's replicate counts at all 48 tuples with the 10-replicate
        tier unreachable (largest C_red 91922).
    - id: MR-6
      quantity: PDC-10's expected tail counts.
      result: >-
        CONFIRMED. The Student-t mixture of 37 tuples at 99 degrees of freedom and 11 at 29
        gives 15.4121, 2.3892 and 0.1869, matching PDC-10's quoted 15.412, 2.389 and 0.187.
        The standard-normal figures are 15.2309, 2.1840 and 0.1296, matching the quoted
        15.231, 2.184 and 0.130, and the package labels them as computed under a reference
        distribution that is not the stated null, as PDC-10 requires.
    - id: MR-7
      quantity: PDC-12's pre-data reference magnitudes.
      result: >-
        CONFIRMED. sqrt(37*(99/97) + 11*(29/27))/48 = 0.1466904890, and the standardised
        resume-condition edges are 0.9543904 and 1.7042686, matching PDC-12's corrected
        figures to every digit quoted. The package carries them as reference magnitudes and
        applies them to nothing.
    - id: MR-8
      quantity: RC-21B block selection and PDC-3's correction.
      result: >-
        CONFIRMED. Re-applying the rule to IN-1 gives 29 m = 2 tuples; the three smallest
        lambda are T-18-2-B34, T-18-2-B44, T-18-2-B58 and the three largest are T-14-2-B118,
        T-16-2-B246, T-12-2-B62, set-identical to the contract's named six. PDC-3 is correct:
        rank 4 is T-16-2-B38 at lambda 0.011000564 and T-18-2-B82 at 0.012846427 is rank 5.
    - id: MR-9
      quantity: The high-precision difference column and its error bar.
      result: >-
        CONFIRMED. At all ten block tuples the recomputed repaired-minus-as-recorded
        difference and the recomputed standard error of the difference, sqrt(sem_r^2 +
        sem_a^2), equal the recorded values to 0.0 absolute.
    - id: MR-10
      quantity: RC-33-L recomputability.
      result: >-
        CONFIRMED. The RT21-6 discriminating quantity - the deviation of the repaired leg
        from the exact analytic mean in standard-error units - was recomputed by this session
        at all ten block tuples from the recorded OM-8 and OM-9 fields alone. The values are
        deliberately not reproduced here and no reading is taken of them; the check is that
        the archived record preserves recomputability, and it does.
    - id: MR-11
      quantity: RC-33-M stream-position probe (DEV-7).
      result: >-
        CONFIRMED INDEPENDENTLY AND OUTSIDE THE DRIVER. Seeding numpy.random.default_rng with
        the recorded derived seed 356104778378094363 and taking three raw 64-bit words
        reproduces the recorded triple exactly under BOTH numpy 2.4.4 and numpy 2.4.0. This
        is a driver-free corroboration of PP-1's conclusion at the bit-generator level.

  reproduction_check:
    scope_statement: >-
      THIS ESTABLISHES DETERMINISM OF THE RECORDED PIPELINE AND NOT PORTABILITY, exactly as
      NARROW-5 required of BATCH-012. Same host, same operating system, same architecture.
    method: >-
      The committed driver blob and the five committed input blobs were extracted from Git
      into a scratch root OUTSIDE the repository, and all three arms plus the summary step
      were re-executed there in ST-2 order. Nothing was written inside the repository.
    interpreter_used_by_this_validator:
      sys_version: "3.14.3 (main, Feb  3 2026, 15:32:20) [Clang 17.0.0 (clang-1700.6.3.2)]"
      sys_executable: /opt/homebrew/opt/python@3.14/bin/python3.14
      numpy: 2.4.4
      platform_platform: macOS-26.6-arm64-arm-64bit-Mach-O
      platform_machine: arm64
      platform_processor: arm
      identical_to_the_recorded_run_environment: true
    result: >-
      REPRODUCED BIT-IDENTICALLY ON EVERY SCIENTIFIC LEAF. Across summary.json and all six
      run documents, 9022 leaf values were compared at exact float equality. 143 leaves
      differ and every one of them falls into exactly four mechanically expected classes,
      with ZERO unclassified differences.
    differing_leaf_classes:
      - class: TIMING
        count: 113
        detail: >-
          elapsed_seconds at every level, ru_utime, ru_stime, ru_maxrss, peak_memory_gb and
          the started and ended timestamps.
      - class: PATH_CWD
        count: 12
        detail: >-
          invocation_cwd, git.worktree and the PP-1 leg command strings, which embed the
          absolute driver path.
      - class: GIT_STATE
        count: 24
        detail: >-
          15 value differences plus 9 key-set differences. The scratch root is not a Git
