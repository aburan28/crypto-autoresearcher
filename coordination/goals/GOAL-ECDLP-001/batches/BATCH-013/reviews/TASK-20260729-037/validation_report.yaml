  ruling_on_AMB_2:
    question: >-
      The contract MANDATES tail counts of |z_sem| above 1, 2 and 3, and OM-6 mandates the
      count of strictly negative signs. Each is literally a threshold on a quantity derived
      from OM-3 or OM-1, which IV-6 read literally forbids and which PDC-1's carve-out does
      not name. Is the Executor's reading - that a threshold the contract itself mandates as a
      reporting rule is required execution of that clause - correct?
    ruling: >-
      THE EXECUTOR'S READING IS CORRECT, AND THE COVERAGE GAP IS A DRAFTING DEFECT IN PDC-1
      RATHER THAN A DEFECT IN THE RUN.
    reasons:
      - >-
        The competing reading is self-defeating. Refusing to compute the counts breaches the
        tail_checks clause and OM-6; computing them fires IV-6. Under that construction no
        possible executor behaviour is compliant, and a construction on which the contract
        cannot be executed at all is not a possible construction of the contract.
      - >-
        IV-6 is a SCOPE-BREACH rule. Its enumerated targets - forbidden module imports, curve
        arithmetic, the efficiency E and the yield ratio R, reading unnamed files, writing a
        twelfth artifact - are all things OUTSIDE the contract's declared scope. The tail
        counts are inside it: the contract names them, mandates them, and expressly disclaims
        any test, firing or p-value on them.
      - >-
        PDC-1 supplies the governing principle even though it does not supply the enumeration:
        applying a tolerance that a rule itself mandates is required execution of that rule.
        The tail_checks clause mandates the counts on identical structure.
      - >-
        The procedural handling was correct under ST-3 and AGENTS rule 8. The Executor
        recorded the reading as its own, named the affected quantities, and flagged it for
        review rather than applying it silently or stopping the run on a self-cancelling pair
        of clauses.
    blast_radius_claim_verified: >-
      CONFIRMED ON DATA DEPENDENCE. OM-5 is computed as a mean, a sample standard deviation
      and a standard error over the 48-entry z_sem vector, with no threshold anywhere in its
      derivation - this validator recomputed all three from the raw rows using no comparison
      operator at all and obtained the recorded doubles bit for bit. The tail counts and n_neg
      are terminal leaves: no other quantity in any of the seven artifacts reads them.
    correction_to_the_blast_radius_claim: >-
      THE EXECUTOR'S SENTENCE UNDERSTATES THE PROCEDURAL CONSEQUENCE OF AN ADVERSE RULING. If
      a reviewer ruled that computing the counts fires IV-6, IV-6's own consequence clause is
      that THE RUN IS INVALID - not that the affected counts are struck. The claim that only
      those counts would be affected is true of the data and false of the run's validity
      status. Since this report rules the Executor's reading correct, that branch does not
      arise; the correction is recorded so that no later record adopts the softer sentence.

  ruling_on_the_PDC_15_marginal_exceedance:
    finding_recomputed_independently: >-
      CONFIRMED. Evaluating (|S_(m-2)|/N)[(N-1)(1-2/N)^(C_red/2) + (1-1/N)^(C_red/2)] against T
      at all ten block tuples in 60-digit decimal arithmetic gives a maximum absolute
      difference of 3.230158440695e-05 at T-12-2-B62, which is above PDC-15's quoted "better
      than 3.2e-5". The package's own reported figure, 3.230158440703512e-05, agrees to
      thirteen significant figures.
    ruling: >-
      QUOTED-FIGURE IMPRECISION IN THE CONDITION'S OWN DESCRIPTIVE ARITHMETIC. NOT A PDC
      VIOLATION AND NOT A RUN DEFECT.
    reasons:
      - >-
        |E - T| is DETERMINED arithmetic on committed integer constants N, C_red and
        |S_(m-2)|. No seed, no draw, no replicate count and no executor action can move it.
        A condition the run cannot influence cannot be violated by the run.
      - >-
        PDC-15's operative obligations are the symmetric prohibition (no record may quote the
        difference column as a confirmation OR a disconfirmation of T) and the requirement
        that any record reporting the column state the exact expectation formula. Both are
        discharged: the prohibition is carried verbatim in the high-precision block and no
        record in the package reads the column either way, and the formula is stated and
        evaluated.
      - >-
        The figure is the reviewer's own hand-computed characterisation of that formula, of
        exactly the same species as PDC-3, PDC-4, PDC-5 and PDC-12, all of which this program
        corrects by supersession rather than by treating as violations.
      - >-
        The Executor carried the condition text verbatim beside the per-tuple numbers and
        altered nothing, which is the correct handling of an immutable quoted figure.
    required_action: >-
      A superseding correction, not a repair. See narrowing N-3.

  deviation_assessment:
    count_as_declared_in_the_committed_artifacts: 5
    declared_ids: [DEV-1, DEV-5, DEV-6, DEV-7, DEV-8]
    discrepancy_with_the_snapshot_receipt: >-
      THE TASK-20260729-036 RECEIPT RECORDS `deviations: count: 8`. THE COMMITTED PACKAGE
      DECLARES FIVE DISTINCT DEVIATION IDENTIFIERS, NOT EIGHT. DEV-2 and DEV-3 appear nowhere
      in the EXP-YIELD-003 contract, the pre-execution review or any of the eleven committed
      artifacts. DEV-4 appears only as the NAME of the seed-string repair carried from
      EXP-YIELD-002, which is a contract-level repair rather than a deviation of this run. The
      eight is the highest identifier used, not an enumerated set - which is precisely the
      cardinality-rather-than-identity failure PRED-ID EXTENDED exists to prevent, occurring
      here in the archive receipt rather than in the run package. Every one of the five that IS
      declared carries a `what`, an `effect_size` and a `conservative_reading`, so the
      receipt's `all_declared_with_effect_sizes: true` is accurate as far as it goes.
    assessments:
      - id: DEV-1
        what: Artifact layout - no separate command.txt, environment.json or stderr.log.
        assessment: >-
          ACCEPTED. Forced by the contract's eleven-path rule. Verified: the command, the full
          environment block and the stderr location are all present inside manifest.json, and
          stderr is tee'd in-process into stdout.log. Every field the reproduction-package
          layout requires exists, in a different file. Effect on measured quantities: none.
      - id: DEV-5
        what: The three arms ran on python 3.14.3 with numpy 2.4.4, not the committed EXP-YIELD-002 3.13.1 with numpy 2.4.0.
        assessment: >-
          ACCEPTED AND MATERIAL, AND ITS EFFECT IS NOW MEASURED RATHER THAN ASSUMED. The
          contract names no version, so this is a declared execution choice within the
          contract's silence and not a departure from a clause. Its conservative reading - that
          a reader must not treat agreement with the committed run as a seed-only contrast
          because the build differs too - is exactly right, and PP-1, independently confirmed
          here, is what bounds the confound. PLACEMENT DEFECT: DEV-5 is arm-general (its own
          text says THE THREE ARMS) yet its labelled entry appears only in the
          REPLICATE-REPAIRED manifest and in summary.json. Its substance is nonetheless in all
          three environment blocks, which each carry the realised strings and the quoted
          committed reference environment side by side, so no reader of any single manifest is
          misled. Minor, non-blocking.
      - id: DEV-6
        what: PP-1 was run against every qualifying second build rather than the singular build the clause names (AMB-3).
        assessment: >-
          ACCEPTED. Running a superset satisfies the clause and removes an unrecorded choice.
          Each leg is separately labelled, none is pooled with or substituted for OM-5, and
          none is compared against the resume-condition thresholds, which is what PDC-8
          requires. ITS OMISSION FROM THE OTHER TWO MANIFESTS IS CORRECT, NOT A DEFECT: PP-1 is
          a sub-block of the REPLICATE-REPAIRED arm only. The receipt's grouping of DEV-5, -6
          and -7 as a single placement issue therefore overstates it; only DEV-5's placement is
          questionable.
      - id: DEV-7
        what: The optional tightening RC-33-M was adopted - three raw 64-bit words from a separate generator instance.
        assessment: >-
          ACCEPTED AND USEFUL. Verified to touch no stream: the probe uses its own generator
          instance seeded with the same value, and the arm reproduces bit-identically with the
          probe present. This session reproduced the three recorded words independently under
          both numpy versions. Like DEV-6 it is arm-specific, so its absence from the other two
          manifests is correct.
      - id: DEV-8
        what: The orchestration adapter was not invoked; resolved_model_id is self-reported with model_verified false.
        assessment: >-
          ACCEPTED AS THE ONLY AVAILABLE HONEST HANDLING, AND CORRECTLY SO. The contract's
          instrument_independence clause forbids the driver from importing OR EXECUTING
          anything under orchestration/, and IV-6 fires on invoking a forbidden module, so
          `doctor --probe` could not be run without invalidating the run. The consequence is
          recorded rather than papered over: model_verified false, fallback_used false,
          degraded_requirements empty, and the known INT-BATCH013-D policy-binding mismatch
          disclosed in the inference block of every manifest. AGENTS.md is satisfied - a model
          identifier that is not probe-verified is recorded as unverified configuration, which
          is exactly what the manifests say. NO ADAPTER RESULT IS CLAIMED AND NONE IS
          FABRICATED. Residual: the resolved model is therefore unverified for all three runs,
          and this report's own resolved model is unverified for the same reason.
      - id: DEV-2
        what: NOT PRESENT IN THIS PACKAGE.
        assessment: >-
          Does not exist in EXP-YIELD-003. DEV-2 is an EXP-YIELD-002 identifier (a separate
          implementation note forced by that contract's path declaration). Assessed as absent,
          not as unassessed.
      - id: DEV-3
        what: NOT PRESENT IN THIS PACKAGE.
        assessment: >-
          Does not exist in EXP-YIELD-003. DEV-3 is an EXP-YIELD-002 identifier (an
          under-determined agreement tolerance). Assessed as absent, not as unassessed.
      - id: DEV-4
        what: The seed-string arm-label defect, named here but repaired by the frozen contract rather than deviated from.
        assessment: >-
          NOT A DEVIATION OF THIS RUN. It is the EXP-YIELD-002 defect that the EXP-YIELD-003
          contract repairs by closing the arm-label set to four strings. Its repair is verified
          under seed_machinery_check.DEV_4_repair and it holds at all ten block tuples.

  additional_findings:
    - id: F-1
      severity: minor, non-blocking
      finding: >-
        IDENTIFIER REUSE ACROSS THE LINEAGE. The committed EXP-YIELD-002 package uses DEV-1
