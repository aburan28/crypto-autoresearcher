  PP_1_independent_test:
    claim_under_test: >-
      That the 48-tuple z_sem vector reproduces bit-identically under python 3.13.1 with
      numpy 2.4.0 - the exact committed EXP-YIELD-002 reference environment - and under
      python 3.13.3 with numpy 2.4.4.
    could_this_validator_reach_3_13_1: true
    method: >-
      NOT RELAYED. This session located the interpreters itself, confirmed 3.13.1 with numpy
      2.4.0 at /Library/Frameworks/Python.framework/Versions/3.13/bin/python3 and 3.13.3 with
      numpy 2.4.4 at /opt/homebrew/opt/python@3.13/bin/python3.13, and re-executed the FULL
      primary arm under each in its own separate scratch root outside the repository, rather
      than reading the driver's own PP-1 sub-block.
    result: >-
      CONFIRMED, AND AT WIDER SCOPE THAN PP-1 CLAIMS. Under 3.13.1 with numpy 2.4.0 and under
      3.13.3 with numpy 2.4.4 the entire primary arm reproduces bit for bit - all 48
      per-tuple means, all 48 standard deviations and all 48 z_sem values - and OM-5's mean,
      sd and standard error are identical doubles to the committed values in all three
      environments. The independent bit-generator probe of MR-11 corroborates this below the
      driver.
    consequence_recorded_without_interpretation: >-
      The interpreter build and the numpy version are excluded as sources of the difference
      between the two measurements, ON THIS HOST. This is a statement about the instrument.
      What it licenses about the shift is not this report's to say.

  seed_machinery_check:
    derivation_reimplemented_from_the_contract_text: true
    method: >-
      The seed rule was reimplemented in this session directly from the contract's
      seed_derivation_binding and knownanswer_seed_derivation clauses - low 64 bits of the
      SHA-256 digest of the pipe-joined ASCII string, read as an unsigned little-endian
      integer - and the parameter fields were taken from IN-1's cells at the bound commit
      2fb2bb7a under the RC-C first-listed-occurrence rule, not from the run's own rows.
    seeds_derived: 73
    breakdown: 48 primary tuples, 5 seeded known-answer cases, 20 high-precision legs.
    mismatches_against_the_recorded_seed_strings_and_seeds: 0
    pairwise_distinct: true
    pools_measured_by_enumeration_per_PDC_11:
      EXP_YIELD_002_seed_fields: 109
      EXP_YIELD_002_distinct_seeds: 105
      the_four_repeats: >-
        CONFIRMED EXACTLY AS PDC-11 STATES. The four repeated values are the four
        INV-4-failing tuples printed twice inside RUN-YIELD-002-NULL-REPAIRED, once in
        repaired_arm.rows and once in
        repaired_arm.INV_4_failing_tuples_reported_separately.rows.
      IN_1_seed_fields: 98
      IN_1_distinct_seeds: 98
      IN_1_composition: 49 antipodal plus 49 independent-throw contrast, exactly as PDC-11 requires.
    collisions:
      against_the_105: 0
      against_the_98: 0
      against_the_union: 0
      inside_the_BATCH_011_master_block_110200_to_110799: 0
      verdict: NO COLLISION. NOT BLOCKING.
    master_seed_disjointness: >-
      CONFIRMED. 130301, 130401 and 130501 are pairwise distinct, disjoint from EXP-YIELD-002's
      120201, 120301, 120401 and 120501, and outside the BATCH-011 block 110200 to 110799.
    residual_disclosed_by_the_contract_and_not_closed_by_this_check: >-
      IV-2b and IV-2c cover only the seeds recorded in files this contract hash-binds. BATCH-011
      run records outside those files are not covered by any derived-seed check, only by the
      master-seed block declaration, which is a design fact and not a proof about SHA-256
      outputs. The contract discloses this; this validator confirms the residual is real and
      remains open.
    DEV_4_repair:
      verified_independently: true
      result: >-
        CONFIRMED AT ALL TEN BLOCK TUPLES. The two high-precision legs derive different seed
        strings and different derived seeds at every one of the ten, because the arm-label
        field differs (HIGHPREC-REPAIRED against HIGHPREC-ASRECORDED) while every other field
        is identical. The check is logged before the first draw in all three runs.
      error_bar_status: >-
        THE DIFFERENCE COLUMN NOW HAS A QUANTIFIABLE ERROR BAR, WHICH IT DID NOT HAVE IN THE
        COMMITTED EXP-YIELD-002 PACKAGE. Because the legs are independently seeded the
        variances add, so sqrt(sem_repaired^2 + sem_asrecorded^2) is a valid standard error,
        it is recorded at all ten block tuples, and this session recomputed all ten to 0.0
        absolute. The committed EXP-YIELD-002 column remains unusable forever and this repair
        does not touch it.

  control_checks:
    - id: CC-1
      control: KNOWN-ANSWER CONTROL (IV-3, cases KA-1 to KA-8), positive and negative.
      result: >-
        PASS, AND EVERY CASE RE-VERIFIED INDEPENDENTLY. KA-1 zero throws gives distinct = 3 in
        all 1000 replicates with zero off-target; KA-2 full pre-marking gives 11 in all 1000;
        KA-3's target 7.2441711010797825 was recomputed from the closed form to the identical
        double, its half band 4.000*sd/sqrt(1e6) = 0.00483243453461788 recomputed exactly, and
        the realised |difference| 0.0022248989 lies inside it; KA-4's half band
        0.001781447085660493 recomputed exactly over all eleven bins with worst deviation
        0.0007987273 inside it; KA-5 gives exactly 3 distinct marked bins in all 1e6
        pre-markings with zero violations; KA-6's implication holds with zero violations and
        its frequency deviation 0.0004080909 lies inside the half band 0.001149919149152138,
        recomputed exactly; KA-7 gives exact antipodal set equality in all 1e6 replicates with
        zero violations; KA-8 reproduces P_pred at all four INV-4-failing tuples to 0.0
        absolute against a 1e-9 tolerance, recomputed here independently. IV-3 did not fire.
    - id: CC-2
      control: SEED-COLLISION CONTROL (IV-2a to IV-2d).
      result: PASS. See seed_machinery_check. Zero collisions in every pool. IV-2 did not fire.
    - id: CC-3
      control: INPUT-INTEGRITY CONTROL (IV-1).
      result: PASS. See MR-5 and AC-4. IV-1 did not fire.
    - id: CC-4
      control: INFRASTRUCTURE (IV-4).
      result: >-
        DID NOT FIRE. No timeout, crash, resource exhaustion, budget cancellation or
        implementation failure in any of the three runs, and none is recorded as a result.
    - id: CC-5
      control: COVERAGE (IV-5).
      result: DID NOT FIRE. See AC-8.
    - id: CC-6
      control: SCOPE BREACH (IV-6).
      result: >-
        DID NOT FIRE, on the reading PDC-1 establishes and the AMB-2 extension this report
        rules correct. Verified by inspection of the committed driver blob: the imports are
        argparse, datetime, hashlib, json, math, os, platform, resource, struct, subprocess,
        sys, time and numpy, and nothing else; nothing under harness/, tools/ or
        orchestration/ is imported or executed; no elliptic-curve operation of any kind is
        implemented; no occupancy-normalised efficiency E and no yield ratio R is computed or
        reported anywhere in the package; the driver opens the five hash-bound inputs, itself
        (to record its own SHA-256) and its own declared artifacts; and the commit changed
        exactly the eleven declared paths, so no twelfth file was written.
    - id: CC-7
      control: ENVIRONMENT DISCLOSURE (IV-7).
      result: >-
        DID NOT FIRE. All six required strings are present in all three manifests, in all
        three results.json files and in both PP-1 leg blocks, each flagged as recorded before
        the first draw. One numpy version, 2.4.4, is used across the three arms. PP-1's legs
        record their own six strings separately and are expressly outside the single-version
        scope.
    - id: CC-8
      control: >-
        NULL-OBJECT CONTROL for the reported signal, in the sense of the inventor protocol's
        controls-before-belief obligation.
      result: >-
        NOT PRESENT, AND THIS IS THE PACKAGE'S PRINCIPAL LIMITATION. RT-20260729-033 raised
        RC-33-K - draw the 48-tuple arm under K independent master seeds with K of order 10
        and report the between-seed scatter directly - as the cheapest discriminating control,
        and expressly RAISED IT WITHOUT IMPOSING IT because adopting it would consume the
        single permitted RC-13 amendment cycle. The run therefore measures the statistic at
        K = 1 fresh master seed. That is a faithful execution of the frozen contract and not a
        defect in the run; it is a bound on what any reader may take from the pair of
        measurements.

  heuristic_validation_checks:
    - id: HV-1
      check: Pre-registered prediction.
      result: >-
        NOT APPLICABLE IN THE EXEMPLAR SENSE, AND CORRECTLY SO. EXP-YIELD-003 tests no
        hypothesis and no heuristic; hypothesis_id and heuristic_under_test are null by
        design and the contract says so in terms. It carries no success criterion and no
        falsification criterion, and this report neither treats their absence as a defect nor
        evaluates one. What IS pre-registered and was verified here is the observation set
        OM-1 to OM-9, the tail-check reporting rule, the RC-21B block-selection rule (keyed
