validation_report:
  id: VAL-20260729-002
  task_id: TASK-20260729-037
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-013
  role: validator
  reviewed_object: >-
    The EXP-YIELD-003 run package as committed at 6921e7160f2e21711361e3fe8d346d25328238be,
    parent 572ce080a1dd9ea76b078e0ec6d96e9f8ff522c9, branch claude/ecdlp-b011, bound by the
    TASK-20260729-036 snapshot commit receipt.
  governing_contract: >-
    experiments/EXP-YIELD-003/specification.yaml at de6fbb752f9f0b9ce28fda91b15a88593861dfcc.
  run_ids:
    - RUN-YIELD-003-KNOWNANSWER
    - RUN-YIELD-003-REPLICATE-REPAIRED
    - RUN-YIELD-003-HIGHPREC

  verdict: PASS
  verdict_in_role_contract_vocabulary: passed
  blocks_ledger_record: false
  admissibility_statement: >-
    THE RUN SET IS VALID AND ADMISSIBLE AS A RESEARCH RECEIPT. Three runs of three declared,
    all terminal_status completed_valid, all 48 declared tuples measured with none unreached,
    no invalidation rule fired in any run, every declared artifact present and hash-bound,
    every recorded SHA-256 recomputed from the Git blobs at the bound commit, the primary
    observation recomputed from the 48 raw rows to exact float equality, and the recorded
    pipeline re-executed outside the repository with every scientific leaf bit-identical.
  what_a_pass_means: >-
    A passed validation report means this receipt is admissible evidence about the recorded
    pipeline. It does not support an ECDLP claim, does not demonstrate a speedup, does not
    dispose of the shift, does not apply the resume condition and does not authorize
    promotion. The disposition of the two measurements belongs to TASK-20260729-038 and
    DEC-20260729-003.

  approval_status_check:
    frozen_file_reads: "status: review_required / approved_by: null"
    ruling: >-
      NOT A DEFECT AND NOT EVIDENCE OF NON-APPROVAL. D-1 prophylaxis is in force: the
      approval determination lives in the TASK-20260729-034 snapshot commit receipt, which
      records APPROVED conditional on PDC-1 through PDC-15 being carried verbatim, with
      condition_satisfied true and authorized_to_execute true, sourced from RT-20260729-033
      verdict PASS with fifteen numbered objections and zero blocking. All fifteen condition
      texts were read in full by this session.

  independence:
    session_independence: true
    basis: >-
      Fresh non-originating session. This session did not author the EXP-YIELD-003 contract
      (TASK-20260729-031), did not review it (TASK-20260729-033), did not execute it
      (TASK-20260729-035), did not archive it (TASK-20260729-036) and shares no conversation
      lineage with TASK-20260729-031, -033, -035 or -038. Its inputs were the committed Git
      blobs, the two committed archive receipts and the committed contract review; it read no
      producer working tree.
    model_independence: >-
      NOT AVAILABLE AND NOT CLAIMED (INT-BATCH013-D). Session independence is what this card
      buys.
    requested_policy: review-adversarial
    resolved_model_id: claude-opus-5
    resolved_model_id_source: >-
      Self-reported by the Claude Code runtime session executing TASK-20260729-037. The
      orchestration adapter was not invoked. NOT probe-verified.
    model_verified: false
    fallback_used: false
    degraded_allowed: false
    degraded_requirements: []
    reasoning_effort: null
    instrument_independence_limit: >-
      This validation re-executes the SAME committed driver blob. Re-execution establishes
      determinism of the recorded pipeline. It is NOT an independent reimplementation of the
      simulated process, and no such reimplementation exists in this package. Every quantity
      recomputed by this session from raw fields, however, was recomputed with code written
      in this session and not with the driver's summary code.

  artifact_checks:
    - id: AC-1
      check: Snapshot reachability, parent and changed-path set.
      method: >-
        git merge-base --is-ancestor 6921e716 HEAD; git rev-list --parents -n1; git diff-tree
        -r --name-status.
      result: >-
        PASS. 6921e716 is reachable from HEAD (2c6b11f3). Its single parent is 572ce080,
        exactly as the receipt declares. It changes exactly eleven paths, all with status A,
        with no deletion, no rename, no undeclared path, no AppleDouble sidecar and no
        __pycache__ entry. The eleven changed paths are set-identical to the eleven paths in
        the receipt's committed_paths, to the contract's required_artifacts list and to the
        eleven_declared_artifact_paths field carried in all three manifests.
    - id: AC-2
      check: Every recorded SHA-256 recomputed from the Git blobs at the bound commit.
      method: SHA-256 over `git cat-file blob 6921e716:<path>` for each of the eleven paths.
      result: >-
        PASS. All eleven recomputed digests equal the receipt's path_sha256 values exactly.
        No working-tree file was used for this check.
    - id: AC-3
      check: >-
        Declared twelve versus committed eleven.
      result: >-
        PASS AND NOT A SCOPE OVERRUN. The twelfth declared path is the TASK-20260729-036
        receipt itself, deferred by construction under INT-BATCH007-T. The committed set is a
        strict subset of the declared set with no extras and no deletions.
    - id: AC-4
      check: Input hash bindings verified against the bound commits rather than the worktree.
      result: >-
        PASS. The five hash-bound inputs were extracted from their bound commits
        (2fb2bb7a for IN-1 and IN-2, c7189f80 for IN-3 and the two IV-2 extras) and their
        SHA-256 values equal the constants pinned in the driver and in the contract's
        inputs.files_read block exactly.
    - id: AC-5
      check: Cross-binding of artifacts.
      result: >-
        PASS. The driver SHA-256 recorded in all three manifests and in all three results.json
        environment blocks equals the committed driver blob digest. summary.json's
        source_results_files digests equal the three committed results.json digests.
    - id: AC-6
      check: AGENTS.md artifact policy, all three runs.
      result: >-
        PASS. Every required item is present in every manifest - exact command; git commit
        572ce080 with dirty true and the two untracked entries enumerated; environment and
        dependency versions; input parameters and seeds; requested policy
        executor-implementation; backend; resolved runtime model id; model provenance;
