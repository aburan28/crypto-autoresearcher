    - id: AC-7
      check: Budget and resources.
      result: >-
        PASS. Elapsed 17.859 + 3.545 + 4.885 = 26.289 s against a 600 s per-run ST-1 cap.
        Peak ru_maxrss across the three runs is 65814528 bytes, that is 62.8 MiB, against a
        4 GB cap. Memory is reported beside time in every manifest.
    - id: AC-8
      check: Run count, coverage and ST-2 order.
      result: >-
        PASS. Three arms and no fourth run identifier. IV-5 did not fire: 48 of 48 tuples
        measured in the primary arm, 10 of 10 block tuples in both legs, 8 of 8 known-answer
        cases, with tuples_not_reached empty everywhere. Recorded timestamps place
