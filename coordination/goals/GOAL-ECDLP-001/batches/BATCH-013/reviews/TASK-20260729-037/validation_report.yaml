        DEV-1, the package makes an unqualified cross-experiment reference to "DEV-6"
        ambiguous. This campaign already carries one duplicated immutable identifier
        (VAL-20260729-001 labelling two committed reports); this is a second instance of the
        same hygiene failure in a different namespace. No measured quantity is affected.
    - id: F-2
      severity: minor, non-blocking
      finding: >-
        THE NULL AUXILIARY TOLERANCE FIELD IS CONFIRMED AND IS SLIGHTLY MISDESCRIBED. In both
        results.json and summary.json the `tolerance` key is ABSENT (not present with a null
        value) for KA-4 and KA-6, while `half_band` and `admissible_interval` are present and
        non-null for both cases in both files, as this session verified. The contract's IV-3
        text says the admissible interval and the numeric half-band are recorded per case in
        both files and that NARROW-1's cosmetic omission "is repaired here by requiring the
        field in both files". On the reading where "the field" is the tolerance string, the
        cosmetic half of NARROW-1 is NOT discharged for KA-4 and KA-6; on the reading where it
        is the interval and half-band just named, it is. The substantive half is discharged
        either way. The Executor's decision not to edit the driver after its SHA-256 was
        already recorded in three manifests is CORRECT and is the same call the BATCH-012
        Executor made: editing it would have broken a binding that four artifacts depend on.
    - id: F-3
      severity: minor, non-blocking
      finding: >-
        TWO IV-6 VERDICT SENTENCES ARE FLATLY STATED WHERE THEY SHOULD BE QUALIFIED. All three
        results.json files record under IV-6 that "NO THRESHOLD WAS APPLIED TO ANY OBSERVATION
        QUANTITY OM-1 THROUGH OM-9 OR TO ANY QUANTITY DERIVED FROM THEM" and that "no file
        outside `inputs` was read". Neither is literally accurate: the contract-mandated tail
        counts and n_neg ARE thresholds on quantities derived from OM-3 and OM-1, which the
        very next sentence discloses via AMB-2; and the driver reads itself to record its own
        SHA-256 and reads its own three results.json files to build summary.json, which the
        environment block's `files_this_driver_opens` discloses in terms. The disclosure is
        complete in both cases and nothing is hidden; the verdict sentences are imprecise
        summaries of it. The second case is a third instance of the same over-broad IV-6
        drafting behind AMB-1 and AMB-2, and it was not flagged as an AMB.
    - id: F-4
      severity: trivial, prose only
      finding: >-
        The TASK-20260729-036 commit message states "peak RSS 61 MB". The measured maximum
        ru_maxrss across the three runs is 65814528 bytes, which is 62.8 MiB or 65.8 MB; 61 is
        the GiB-scaled figure 0.0613 read as though it were MB. The manifests themselves are
        correct and unambiguous. No artifact is affected.
    - id: F-5
      severity: informational
      finding: >-
        The receipt states that PP-1-A is "the case the contract's three-case taxonomy does not
        enumerate", identified in advance by RT-20260729-033, and that the pre-run probe's
        judgement that case one was unreachable "was wrong in its consequence". Both statements
        are supported: the reviewer's platform_clause_ruling does record the taxonomy as
        incomplete, and this session confirms that once the primary build was 3.14.3, both
        3.13.1 with numpy 2.4.0 and 3.13.3 with numpy 2.4.4 became reachable second builds.
