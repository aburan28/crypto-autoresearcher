    independent_session: true
    basis: >-
      This session was launched fresh for TASK-20260729-038 with no conversation
      history, no transcript and no context shared with TASK-20260729-031
      (contract freeze), TASK-20260729-033 (pre-execution review), TASK-20260729-035
