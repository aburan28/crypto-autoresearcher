red_team_report:
  id: RT-20260729-031
  task_id: TASK-20260729-038
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-013
  role: red-team
  verdict: >-
    PASS WITH BLOCKING CONSTRAINTS ON THE DECISION. The run package itself is
    admissible, internally consistent, honestly bounded and correctly labelled;
    no invalidation rule fired and none should have. THE PACKAGE IS NOT WHAT
    THIS REPORT OBJECTS TO. What this report objects to is THE READING THE
    BATCH'S OWN ARCHIVE ARTIFACTS ALREADY PUT IN FRONT OF THE COORDINATOR - that
    a replicated value plus an excluded build makes the shift a real
    deterministic offset. Four objections are BLOCKING on DEC-20260729-003 and
    on EV-ECDLP-010; none is blocking on the run package, which needs no repair
    and must not be edited.

  claim_under_review: >-
    That the EXP-YIELD-003 replication, having produced a 48-tuple z_sem mean of
    0.3336976784 against BATCH-012's 0.3610236850 under disjoint master seeds,
    and PP-1 having reproduced the vector bit-identically under python 3.13.1 /
    numpy 2.4.0 and 3.13.3 / numpy 2.4.4, establishes that the +0.36 shift is a
    real deterministic offset - a third term not yet derived - and that its
    locus is therefore the driver, the build or the platform.

  bound_snapshot_verified:
    run_package_commit: 6921e7160f2e21711361e3fe8d346d25328238be
    parent: 572ce080a1dd9ea76b078e0ec6d96e9f8ff522c9
    committed_paths_verified: 11
    frozen_contract_commit: de6fbb752f9f0b9ce28fda91b15a88593861dfcc
    contract_not_present_in_run_commit: true
    approval_receipt: coordination/goals/GOAL-ECDLP-001/batches/BATCH-013/archives/TASK-20260729-034/snapshot_commit_receipt.json
    approval_receipt_commit: 99dec70d68dd49fc153f5042882dd52b888e036c
    method: >-
      git log/show against the named commits in the assigned worktree at HEAD
      2c6b11f346e816da1312d1ff510e61657dd09411, branch claude/ecdlp-b011, clean
      tree. Every figure this report quotes from the package was read from the
      committed blobs, not from a working-tree file.

  pre_stated_decision_labels:
    recorded_as_pre_stated: true
    basis_that_they_are_genuinely_pre_stated: >-
      ledger/decisions/DEC-20260729-003.yaml and ledger/evidence/EV-ECDLP-010.yaml
      DO NOT EXIST at this HEAD (ledger/decisions/ ends at DEC-20260729-002;
      ledger/evidence/ carries no EV-ECDLP-010). The TASK-20260729-036 receipt
      states in terms that it records arithmetic and no disposition, and the run
      package writes no branch. There was therefore no disposition available to
      be read, and these labels were fixed before any was written.
    labels:
      BRANCH_1_mean_within_about_0.14_of_zero: >-
        inconclusive on the shift's mechanism, with the SHIFT ITSELF CLOSED as
        chance. NOT `support`, NOT `reject_scoped`, NOT `weaken` - there is no
        hypothesis to move. Strength `preliminary`, claim tier toy.
      BRANCH_2_mean_above_about_plus_0.25: >-
        inconclusive. THIS IS THE REALISED BRANCH AND I PRE-STATE THE LABEL FOR
        IT AS `inconclusive`, NOT as anything stronger, and specifically NOT as
        a finding that the shift is a property of the driver-build-platform
        combination. See objection RT31-1. A `support` label on branch 2 would
        be a positive attribution the branch cannot carry; a `weaken` label
        would imply a hypothesis exists to weaken, and none does.
      EITHER_UNASSIGNED_REGION: >-
        inconclusive on the shift, per BND-5, never assimilated to the nearer
        named branch.
      ANY_INVALIDATION_RULE_FIRED: >-
        no label - infrastructure signal under IV-4, never a mathematical
        result. None fired.
    labels_on_the_instrument_question_as_distinct_from_the_shift: >-
      Under every branch the acceptable label for EXP-YIELD-003's OWN integrity
      result - all 48 tuples measured, IV-1 through IV-7 all evaluated and none
      fired, the DEV-4 repair verified before any draw, the reproduction gate
      passed - is `support` at strength `preliminary`, claim tier toy, SCOPED TO
      THE INSTRUMENT AND TO NOTHING ELSE. That label attaches to the run's
      integrity, never to the value of the replicated statistic.

  narrowest_supported_statement: >-
    Under the frozen EXP-YIELD-003 contract at de6fbb75, on one macOS arm64 host,
    a curve-free balls-in-bins re-execution of the EXP-YIELD-002 repaired-null
    arm at the same 48 declared parameter tuples, under the fresh disjoint master
    seed 130301 and the C-14 replicate schedule, produced a 48-tuple z_sem mean
    of 0.3336976784 with sample sd 0.8915705400 and standard error 0.1286871228,
    with all 48 tuples measured, no invalidation rule fired, the DEV-4 seed-string
    defect repaired and verified before any draw, and the recorded computation
    reproducing bit-identically on re-execution and under two further interpreter
    builds carrying numpy 2.4.0 and 2.4.4; the committed EXP-YIELD-002 arm under
    master seed 120201 produced 0.3610236850 with sd 0.9750016842; the two draws
    are independent in their Monte Carlo noise, share every deterministic
    component by construction, and differ by 0.0273 against a difference standard
    error of 0.1907. THAT IS ALL. It licenses no statement about decomposition
    yield, no statement about P_pred, no statement about the balls-in-bins process,
    no locus for the shift, and no claim that any deterministic offset exists.
  is_it_narrower_than_the_batch_framing: >-
    YES, IN TWO PLACES. It is narrower than the TASK-20260729-035 commit subject
    line, which asserts that the shift REPLICATES; and it is narrower than the
    TASK-20260729-036 receipt's key `PP_1_EXCLUDES_THE_BUILD_...` and its
    consequence field, which asserts that the interpreter build and the numpy
    version are EXCLUDED as sources of the shift. See RT31-2 and RT31-3.

  the_ruling_asked_for:
    question: >-
      The replication having landed at 0.3337 against 0.3610, and PP-1 having
      excluded the build - what is the shift?
    ruling: >-
      IT IS NOT ESTABLISHED AS ANYTHING. On the committed record it is a SECOND
      UPPER-TAIL DRAW of a statistic whose null the program has now calibrated
      twice, and no locus for a deterministic component survives inspection. The
      correct disposition is `inconclusive` on the mechanism and CLOSED on the
      chase, and the reason it is closed is NOT that the stopping rule says so
      but that there is nothing left to look for.
    argued_at_full_strength_for_a_real_offset: >-
      STATED FIRST AND NOT SOFTENED, BECAUSE IT IS THE STRONGER-LOOKING SIDE.
      Two draws under disjoint master seeds both land about 2.2 design standard
      errors above the expectation the committed package itself declares. The
      BATCH-012 validator's 400-repetition Monte Carlo of the whole design put
      the first at P = 0.0100 plus or minus 0.0050. The declared second-order
      biases account for at most 0.0895 SEM and realised 0.02638 SEM on average -
      an order of magnitude short. PP-1 removes the interpreter build and the
      numpy version from the candidate list. On those facts a fixed additive
      component is the natural reading, and if it existed it would be a term
      nobody in this lineage has derived.
    argued_at_full_strength_against: >-
      AND IT IS THE SIDE THAT WINS, ON FOUR INDEPENDENT GROUNDS.
      FIRST, THE AGREEMENT ARGUMENT IS EMPTY. The TASK-20260729-036 receipt
      states that `A FIXED OFFSET predicts the two agree within their combined
      error, which they do at 0.14 SE`. So does the chance hypothesis. Two draws
      of the same statistic agree within their combined error with the same
      probability under BOTH hypotheses; the likelihood ratio contributed by the
      DIFFERENCE of the two means is approximately 1. Agreement is not evidence
      here. All of the evidential content is in the LEVEL, and the level is one
      fresh one-sided excursion at about p = 0.017.
      SECOND, THE FIRST OBSERVATION IS SELECTED AND ITS NOMINAL p CANNOT BE
      COMPOUNDED WITH THE SECOND AS IF IT WERE NOT. The contract records in its
      own text that the statistic was a POST-HOC TAIL-CHECK OBSERVATION of
      EXP-YIELD-002, outside all four of that contract's criteria. It was
      noticed because it was extreme, from a menu that also contained the z_sd
      mean, n_neg, three tail counts, the maximum, the per-arity means and the
      delta_z vector. Multiplying 0.010 by 0.017 and reporting 1.7e-4 treats a
      selected statistic as if it had been named in advance.
      THIRD, THE MATHEMATICS CANNOT HOST A TERM OF THIS SIZE, AND THAT IS A
      DERIVATION AND NOT AN OPINION. For P-REPAIRED the exact mean
      E[distinct] = N - (1 - s/N)[(N-1)(1-2/N)^(C_red/2) + (1-1/N)^(C_red/2)]
      is a theorem, re-derived three times in this lineage and not disputed;
      call it M. Then E[z_sem] = (M - P_pred) E[1/sem_rep] + E[(mu_rep - M)/sem_rep].
      The first term is bounded by the committed package's own declared envelope,
      is at most 0.0801 in SEM units at any of the 48 tuples and 0.0262 on
      average, and E[1/sem_rep] exceeds 1/sigma_sem by a factor of at most
      1 + 3/(4 n_rep), which is at most 1.0083 here. The second term is the
      classical skewness bias of the one-sample t statistic, -gamma_1/(2 sqrt(n_rep))
      + O(1/n_rep); the distinct-bin count is left-skewed at these parameters, so
      the term is POSITIVE, and it is at most 0.088 at the most extreme tuple
      (T-18-2-B34) and 0.012 averaged over the 48. THE TOTAL EXPECTATION IS OF
      ORDER +0.04, AND THERE IS NO THIRD ANALYTIC TERM AVAILABLE TO CARRY +0.30.
      This reproduces, independently and at greater generality, the finding
      RT-20260729-021 recorded at RT21-6, which this session did not consult
      until after deriving it.
      FOURTH, THE ONLY LOCUS THAT REMAINED - A SHARED CODE DEFECT - IS THE ONE
      THE PACKAGE'S OWN HIGH-PRECISION BLOCK EXCLUDES, FRESHLY AND AT TEN TUPLES.
      A defect producing a FIXED offset in BINS scales in SEM units as
      sqrt(n_rep)/sd. An offset large enough to give about +0.31 SEM at the
      primary schedule must give between +2.5 and +5.6 SEM at 10,000 replicates
      at the ten block tuples. PDC-9 expressly preserves that quantity as
      recomputable from OM-8 and OM-9, and it is NOT the prohibited
      repaired-minus-as-recorded difference column. Recomputed from the committed
      HIGHPREC results, the repaired leg's deviation from the exact analytic mean
      in SEM units is 0.501, -0.393, -0.686, 1.305, 1.224, -0.682, -0.723, 0.781,
      0.096 and 1.829 - mean 0.325, sd 0.941, ten values, none of them within
      reach of the +2.5 to +5.6 a bins-level offset requires. This is the same
      control RT21-6 ran on the committed EXP-YIELD-002 block, now repeated on a
      block that is no longer a deliberately selected all-m=3 subset, with the
      DEV-4 defect repaired and the legs independently seeded.
    what_it_is_a_property_of: >-
      OF THE MASTER SEED, AND OF NOTHING ELSE IN THE INSTRUMENT. It is not a
      property of the mathematics: the exact mean is a theorem and the residual
      expectation is bounded above by about 0.04. It is not a property of the
      build: PP-1 shows the vector is invariant across CPython 3.13.1, 3.13.3
      and 3.14.3 and across numpy 2.4.0 and 2.4.4. It is not a property of the
      driver code at any bins level: the high-precision block excludes a fixed
      bins offset by a factor of three to seventeen. What remains is the draw.
    is_it_undetermined_between_mathematics_and_code: >-
      NO, AND THIS IS WHERE I DEPART FROM THE CAUTIOUS ANSWER. The two limbs are
      not symmetric. The MATHEMATICS limb is closed by derivation - the exact
      mean is known in closed form and the only other O(n^(-1/2)) term is the
      skewness bias, which is computable and bounded. The CODE limb is not closed
      by derivation but is closed empirically by the package's own ten-tuple,
      10,000-replicate block for any defect of the fixed-bins-offset kind, which
      is the only kind a shared defect could plausibly be. What is NOT closed on
      the committed record is a defect that is itself proportional to sem_rep -
      i.e. one that produces the same offset in SEM units at 100 and at 10,000
      replicates. No such defect has been named, no mechanism for one has been
      proposed, and I do not propose one; but I record that it is the residue,
      because naming the residue is the job.
    the_single_control_that_would_separate_them: >-
      RC-38-A, below. K independent master seeds through the SAME driver under
      the SAME seed-derivation rule, reporting the empirical distribution of the
      48-tuple z_sem mean. If its centre is about +0.03 with sd about 0.147, the
      two realised values are upper-tail draws at about p = 0.008 and p = 0.017
      and the residue is closed. If its centre is about +0.33, the offset is a
      property of the driver-plus-seed-rule combination, is deterministic, and
      is located. The control cannot come out ambiguous, it is curve-free, and
      the package's own timing puts it at a few minutes of wall clock.

  objections:
    - id: RT31-1
      severity: BLOCKING
      binds: DEC-20260729-003 and EV-ECDLP-010, not the run package
      title: >-
        The BATCH-013 queue WIDENED branch 2 of the pre-registered resume
        condition, and the widened form is now falsified in part by this batch's
        own package. It may not be written into the ledger.
      finding: >-
        DEC-20260729-002 next action NA-1, field resume_condition_stated_in_advance,
        reads: `If it reproduces above about +0.25 SEM, the driver, the numpy build
        and the platform BECOME THE OBJECTS OF THE NEXT CONTROL.` The BATCH-013
        dispatch_queue.json, at
        scope_ruling.stopping_rule_for_this_lineage.closed_at_the_close_of_BATCH-013_regardless_of_outcome,
        restates the same branch as: `If it reproduces above about +0.25 SEM, THE
        TERMINAL FINDING IS THAT THE SHIFT IS A PROPERTY OF THE RECORDED DRIVER,
        BUILD AND PLATFORM.` Those are different statements. NA-1 names the objects
        of a FUTURE CONTROL; the queue asserts a POSITIVE ATTRIBUTION as a TERMINAL
        FINDING. That is a widening of a pre-registered disposition.
      why_it_matters: >-
        The widening was recorded in the opening commit, before the outcome, so it
        is not outcome-driven and I do not allege that it was. It is nevertheless
        now UNWRITABLE. Its `build` limb is contradicted by PP-1 within this very
        batch. Its `driver` limb is unsupported: the package's own reproduction
        gate and its high-precision block are evidence AGAINST a driver-level
        bins offset, not for one. Its `platform` limb was never tested and BND-3
        forbids claiming it. And the disjunction it offers - chance or
        driver-build-platform - omits the option the evidence actually supports,
        namely an upper-tail draw of a correctly-calibrated null.
      the_calibration_that_makes_this_decisive: >-
        The queue's own observation feasibility table, section 4.1, puts
        P(branch 2) at about 0.044 under a centred replication. A branch that
        fires about one time in twenty-three under the null cannot carry a
        terminal positive attribution. Realising it is at most weak evidence.
      required_repair: >-
        DEC-20260729-003 records the branch-2 CONSEQUENCE IN NA-1's OWN WORDS and
        no stronger, and records expressly that the queue's stronger restatement
        is superseded on this point. No record produced by this batch may say
        that the shift IS a property of the recorded driver, build or platform.

    - id: RT31-2
      severity: BLOCKING
      binds: every record derived from the snapshot; the offending text is immutable
      title: >-
        The TASK-20260729-035 commit subject line states the disposition that
        ST-4 reserves for -037, -038 and DEC-20260729-003, and the body of the
        same message denies having done so.
      finding: >-
        The subject line of commit 6921e716 reads `TASK-20260729-035: EXP-YIELD-003
        executed - the z_sem shift REPLICATES under fresh seeds`. `REPLICATES` is
        a disposition, not an observation. The body of the same message then
        states `THE RUN PACKAGE STATES NO DISPOSITION AND NEITHER DOES THIS
        MESSAGE - the reading belongs to TASK-20260729-037, -038 and
        DEC-20260729-003.` The message contradicts itself, and the subject line
        is the part a reader sees first and a log renders alone.
      scope_of_the_fault: >-
        THE RUN PACKAGE IS CLEAN. All eleven committed artifacts observe ST-4;
        results.json and summary.json carry explicit
        resume_condition_not_applied_here and ST_4_no_interpretation blocks and
        write no branch. The fault is in the commit message and, at one remove,
        in the receipt key named at RT31-3.
      required_repair: >-
        Immutable and therefore superseded, never edited. DEC-20260729-003 records
        the correction verbatim: the committed z_sem mean is an OBSERVATION and
        the word `replicates` in the subject line of 6921e716 states a disposition
        the run was forbidden to state and which this decision does not adopt.

    - id: RT31-3
      severity: MAJOR
      binds: DEC-20260729-003, EV-ECDLP-010 and any later quotation of PP-1
      title: >-
        `The interpreter build and the numpy version are EXCLUDED as sources of
        the shift` is stronger than what PP-1 establishes, and it is stronger in
        exactly the direction that matters.
      finding: >-
        PP-1 establishes that the 48-tuple z_sem vector is INVARIANT across the
        builds and numpy versions tested - 3.14.3/2.4.4 primary, 3.13.1/2.4.0 and
        3.13.3/2.4.4 as legs. Invariance across the tested set excludes
        VARIATION AMONG THOSE BUILDS as a contributor. It does NOT exclude a
        property SHARED by all of them - for instance a behaviour of the PCG64
        bit generator or of Generator.choice common to numpy 2.4.0 and 2.4.4 -
        and a shared property is precisely the shape a `numpy build` hypothesis
        would have to take to explain an offset that reproduces under fresh
        seeds. The receipt's own key name,
        `PP_1_EXCLUDES_THE_BUILD_AND_INVERTS_THE_PRE_RUN_EXPECTATION`, carries
        the overstatement in the field name itself.
      what_may_be_written: >-
        `The committed z_sem vector is bit-identical under CPython 3.13.1 with
        numpy 2.4.0, CPython 3.13.3 with numpy 2.4.4 and CPython 3.14.3 with
        numpy 2.4.4, so no difference among those three build-and-library
        combinations contributes to the observed value.` And nothing beyond that.
        BND-3 and BND-4 are otherwise observed correctly throughout the package,
        which states plainly that this is NOT a fresh-platform replication and
        that no portability is claimed.
      the_control_that_would_close_the_residue: RC-38-B.

    - id: RT31-4
      severity: BLOCKING
      binds: DEC-20260729-003 and EV-ECDLP-010
      title: >-
        `A fixed offset predicts exactly that agreement` is a likelihood error.
        The agreement of the two means carries no evidence for either hypothesis
        and must not be cited as if it did.
      finding: >-
        The TASK-20260729-036 receipt, field
        the_arithmetic_of_the_two_measurements.what_each_hypothesis_predicts,
        reads `A FIXED OFFSET predicts the two agree within their combined error,
        which they do at 0.14 SE. The CHANCE hypothesis must produce two same-sign
        excursions of about 2.5 SE each under independent master seeds.` The first
        clause is true and USELESS: under the chance hypothesis the two draws come
        from the same distribution as well, so they agree within their combined
        error with the same probability. The DIFFERENCE statistic has the same law
        under both hypotheses; its likelihood ratio is approximately 1. Only the
        LEVEL discriminates.
      it_is_the_same_genus_as_D_2: >-
        D-2 is this program's worked example: PC-2 predicted eleven class flips
        and eleven occurred, but only five were the same cells, and the count
        agreement is recorded as coincidental and never citable as a successful
        prediction. Here a MATCH is again cited as confirmation when the match is
        equally probable under the alternative. It is the same failure in a
        continuous variable.
      second_defect_in_the_same_sentence: >-
        `about 2.5 SE each` is the t statistic against ZERO computed with the
        REALISED standard error. The relevant reference is the expectation the
        package's own declared biases imply - about +0.026 to +0.04 - and the
        DESIGN standard error 0.1466905 that PDC-12 fixes. Against those the two
        excursions are about 2.3 and about 2.1, with one-sided probabilities of
        about 0.008 and 0.017 rather than the roughly 0.005 that `2.5 SE`
        suggests. The sentence overstates the burden it places on chance by about
        a factor of two per draw.
      required_repair: >-
        No record may cite the agreement of the two means as support for a fixed
        offset. Any record that quotes the 0.0273 difference and the 0.1907
        difference standard error states beside them that the difference statistic
        does not discriminate between the two hypotheses and that the discriminating
        quantity is the level.

    - id: RT31-5
      severity: MAJOR
      binds: DEC-20260729-003; a correction, not a repair of an artifact
      title: >-
        THE FIFTH CARDINALITY-NOT-IDENTITY INSTANCE, and it is in the bound
        snapshot receipt and in an immutable commit message.
      finding: >-
        The TASK-20260729-036 receipt states `"deviations": {"count": 8,
        "all_declared_with_effect_sizes": true}` and the commit message states
        `Eight deviations declared with effect sizes.` Neither names a member.
        The committed package carries FIVE distinct declared deviation
        identifiers - DEV-1, DEV-5, DEV-6, DEV-7 and DEV-8 - enumerated across
        the three run records and summary.json, and NINE per-arm entries
        (REPLICATE-REPAIRED 5, KNOWNANSWER 2, HIGHPREC 2). A repository-wide
        enumeration over experiments/EXP-YIELD-003 returns DEV-1, DEV-4, DEV-5,
        DEV-6, DEV-7 and DEV-8, and DEV-4 is the CARRIED AND REPAIRED
        EXP-YIELD-002 contract defect, not a deviation of this run. DEV-2 and
        DEV-3 do not appear anywhere in the package. `8` therefore matches
        neither the distinct-identifier count 5, nor the per-arm entry count 9,
        nor the six identifiers that appear at all. The likeliest origin is 5
        deviations plus the 3 declared ambiguities AMB-1, AMB-2 and AMB-3, which
        would be a set-identity error of exactly the D-2 shape - two different
        sets pooled into one numeral.
      why_it_matters_more_than_its_size: >-
        PRED-ID EXTENDED was written into this contract specifically to stop
        this, and it binds `every record derived from it`. The count survived the
        Executor, the archiving session and the commit message, and it is now
        immutable in both. The recurrence, not the magnitude, is the finding.
      required_repair: >-
        DEC-20260729-003 records the corrected enumeration - five distinct
        declared deviations, named, across nine per-arm entries - and records
        that the numeral 8 in the TASK-20260729-036 receipt and in the 6921e716
        commit message is superseded and may not be quoted.

    - id: RT31-6
      severity: MINOR
      binds: DEC-20260729-003
      title: PDC-15's `better than 3.2e-5` is FALSE as a bound, by 0.9 per cent.
      ruling_requested_by_the_card: QUOTED-FIGURE IMPRECISION, NOT A VIOLATION BY THE RUN.
      finding: >-
        Recomputed independently at 50-digit precision at all ten block tuples,
        the exact expectation of the repaired-minus-as-recorded difference,
        (|S_(m-2)|/N)[(N-1)(1-2/N)^(C_red/2) + (1-1/N)^(C_red/2)], differs from
        the quoted T by at most 3.230158e-05, attained at T-12-2-B62; the next
        largest is 7.358e-06 at T-14-2-B118 and the remaining eight are at or
        below 1.939e-06. The Executor's realised figure 3.2302e-05 is correct.
        `better than 3.2e-5` is therefore false as stated; `better than 3.24e-5`,
        or `better than 1e-4`, is true.
      why_it_is_imprecision_and_not_a_violation: >-
        The RUN violated nothing: it computed the quantity PDC-15 mandates,
        reported it, carried the condition text verbatim beside the per-tuple
        numbers, altered nothing and handed the exceedance to the reviewers. The
        defective object is the CONDITION, whose numeral was hand-derived by the
        pre-execution reviewer and truncated downward instead of rounded upward.
        PDC-15's SUBSTANCE is unaffected and is correct: the agreement is
        arithmetic and not evidence, and the prohibition on reading the column as
        confirmation OR as disconfirmation of T stands.
      but_it_is_the_RT21_1_genus_again: >-
        A hand-derived numeral, frozen into an immutable governing text, surviving
        an independent review, and false. That is the third distinct occurrence of
        that pattern in this lineage after C-20 and after the observation
        feasibility table's rank-4 sentence. It must be superseded explicitly and
        never quoted unaccompanied.
      the_executors_handling: CORRECT AND EXEMPLARY. It is the ST-3 behaviour that found DEV-4.

    - id: RT31-7
      severity: MINOR
      binds: DEC-20260729-003 as a ratification, not a repair
      title: AMB-2 - the Executor's reading was RIGHT, and its authority was WRONG.
      ruling_requested_by_the_card: RIGHT CALL. RATIFY IT EXPLICITLY.
      finding: >-
        The contract MANDATES, in tail_checks and in OM-6, the counts of |z_sem|
        above 1, above 2 and above 3 and the count n_neg of strictly negative
        signs. Each is literally a threshold applied to a quantity derived from
        OM-1 or OM-3, which IV-6 read literally forbids. PDC-1 scopes IV-6 away
        from the tolerances IV-1 and IV-3 mandate, but names only IV-1, KA-8,
        KA-3, KA-4 and KA-6 - it does not reach these clauses.
      why_the_reading_is_right: >-
        THREE REASONS. First, IV-6 read literally is self-invalidating: it would
        forbid the contract's own metrics section, since OM-6 is DEFINED as a
        count over a strict inequality, so no execution of the contract could
        satisfy both clauses and a rule that no execution can satisfy is not the
        rule. Second, PDC-1's STRUCTURE - a threshold the contract itself mandates
        is required execution of the mandating clause and not an IV-6 application
        - transfers to a clause of identical shape a fortiori, the mandating
        clause here being in the contract's own reporting requirements rather than
        in an invalidation rule. Third, the contract states of these counts that
        NO TEST IS PERFORMED, NOTHING FIRES and NO p-VALUE IS COMPUTED, so no
        criterion is created; and refusing to compute them would breach
        tail_checks and OM-6 outright.
      why_the_authority_is_wrong: >-
        THE PDC BINDING STATEMENT SAYS SO IN ITS OWN WORDS, CITING D-2: a
        condition recorded after the fact is not a condition. AMB-2 is an
        Executor-adopted extension of a pre-dispatch condition, recorded after
        dispatch. The Executor did the right thing by DECLARING it and naming its
        blast radius rather than applying it silently - that is exactly the ST-3
        discipline that found DEV-4 - but the reading itself carries no
        pre-dispatch authority and must be ratified by the Coordinator in
        DEC-20260729-003, not left standing as an Executor reading.
      blast_radius_confirmed: >-
        The Executor's statement is correct and I verified it. OM-5 is a mean, a
        sample standard deviation and a standard error and applies no threshold;
        the tail counts and n_neg feed nothing. I independently recount from the
        committed sorted z_sem vector: |z_sem| above 1 is 12 (3 negative, 9
        positive), above 2 is 3, above 3 is 0, and n_neg is 16 with n_pos 32 -
        every figure reproduces, and every one is reported in the package with its
        member tuples named beside it, which is PRED-ID EXTENDED correctly applied.

    - id: RT31-8
      severity: MAJOR
      binds: DEC-20260729-003, EV-ECDLP-010 and the successor batch's scoping
      title: >-
        A replicated offset does NOT bear on EV-ECDLP-008 observation O-4
        component (d). The two questions are orthogonal, and (d)'s mean-level
        content is closed-form arithmetic that needs no experiment at all.
      ruling_requested_by_the_card: ORTHOGONAL.
      finding: >-
        The substitution the repair makes - a uniformly random s-subset in place
        of the structurally exact pre-marked set - has an EXACTLY COMPUTABLE
        effect on the process mean, and it is not the shift's size, its sign at
        m = 3, or its shape. Writing A = (1-2/N)^(C_red/2) and C = (1-1/N)^(C_red/2):
        at m = 2, where the structurally exact set is {bin 0}, the exact mean under
        the structurally exact rule EXCEEDS the uniform-subset mean by
        ((N-1)/N)(C - A); at m = 3, where the structurally exact set is B/2 whole
        antipodal pairs, it FALLS SHORT by (B/N)(C - A). Evaluated at the 48
        declared tuples in SEM units, the m = 2 gap runs from +0.00527 to +0.08605
        with mean +0.02974, and the m = 3 gap runs from -0.000435 to -0.00000073
        with mean -0.0000769; the maximum over all 48 is 0.08605 at T-12-2-B46,
        confirming the committed envelope of 0.0895 SEM as CORRECT AND TIGHT, and
        the overall mean is +0.01794.
      the_two_consequences: >-
        FIRST, component (d) cannot explain the shift: it contributes at most
        0.086 SEM at any single tuple and 0.018 SEM to the 48-tuple mean, an order
        of magnitude short of +0.30, and at m = 3 it has the WRONG SIGN. The
        question a replicated offset asks and the question (d) asks do not touch.
        SECOND, and more usefully, the MEAN-LEVEL content of DEFER-BATCH013-001 is
        settled by the two expressions above and by no experiment. A 10^4-replicate
        two-leg run over 48 tuples buys a Monte Carlo estimate of a number already
        available in closed form to full precision.
      what_that_does_not_settle: >-
        STATED SO THAT THE RULING IS NOT OVERREAD. The arithmetic settles the gap
        between TWO SPECIFIED PRE-MARKING RULES inside the simulation. It does NOT
        settle O-4 component (d)'s CENSUS-FACING claim - that the correct null
        pre-marks the bins a cancelling multiset reaches deterministically - which
        is a modelling claim about the census and not a claim about the simulator.
        That claim remains untouched and unarchived, exactly as the queue records.
        It also does not settle the SECOND-MOMENT effect, on which C-13 makes no
        claim; but the second-moment effect is of the same O(s/N) scale, with s/N
        at most 0.0055 across the declared set, so it cannot be large either.
      consequence_for_the_successor_batch: >-
        If DEFER-BATCH013-001 is dispatched, it should be dispatched with its
        mean-level arm replaced by a DERIVATION NOTE plus a two-tuple numerical
        confirmation, and its compute spent on the second moment and on the
        census-facing question, which are the parts arithmetic cannot reach.
        Dispatching the 48-tuple 10^4-replicate two-leg arm as designed spends a
        batch measuring a closed form.

    - id: RT31-9
      severity: MINOR
      binds: nothing; recorded so it does not go silent
      title: >-
        The observation feasibility table's branch probabilities are computed
        under a null centred at ZERO, while the package's own declared bias puts
        the null centre at about +0.026.
      finding: >-
        Section 4.1 models the replicated mean as Normal with mean 0 and sd
        0.146691. The contract elsewhere declares that the exact process mean sits
        ABOVE P_pred, giving a null centre of about +0.0264 in SEM units before
        any t-statistic correction, and I make it about +0.038 including the
        skewness term. The branch probabilities shift accordingly: P(branch 2)
        rises from about 0.044 to about 0.06 and P(branch 1) falls. The figures
        feed nothing and the direction of the error is CONSERVATIVE for the
        program's purposes - it understates how often branch 2 fires by chance -
        so this strengthens rather than weakens RT31-1.

    - id: RT31-10
      severity: MINOR
      binds: nothing
      title: The `three items handed to the reviewers rather than smoothed` are correctly handled.
      finding: >-
        PDC-15 is ruled at RT31-6. The DEV-5/6/7 placement - present in the primary
        manifest and summary.json, absent from the KNOWNANSWER and HIGHPREC
        manifests - is confirmed: those two manifests carry DEV-1 and DEV-8 only,
        while referencing DEV-6, and the interpreter and numpy facts are present in
        all three environment blocks, so nothing is hidden. The null auxiliary
        tolerance string at two known-answer cases is cosmetic, the substantive
        numeric half-band and admissible interval being present and non-null in
        both files, which is the NARROW-1 repair actually delivered. None of the
        three affects any measured quantity. Leaving them unrepaired was correct.

    - id: RT31-11
      severity: INFORMATIONAL
      binds: nothing
      title: Ceiling sweep - CLEAN, with the two exceptions already named.
      finding: >-
        I swept the eleven committed artifacts and the -034 and -036 receipts for
        any sentence reaching beyond toy tier, asserting anything about
        decomposition yield, computing or quoting an efficiency E or a yield ratio
        or the value 0.85, re-disposing INV-4, determining INV-5, moving a
        hypothesis, or touching a cost model. EVERY occurrence of `efficiency E`,
        `yield ratio`, `0.85`, `INV-4` and `INV-5` in the package is inside a
        PROHIBITION or a statement of non-action. No record says the repaired null
        lands ON P_pred - every occurrence of that phrase is inside the prohibition
        itself. The C-20 power sentence is not reproduced anywhere in the package
        or in the receipts; the only occurrence in the batch is inside the
        RT21-1 carried-defect block, which carries the correction. The
        EXP-YIELD-002 high-precision difference column is not quoted as a
        confirmation of T anywhere. Claim tier is recorded as toy in every artifact
        and in both receipts, and both receipts state that this is not a
        cryptanalytic result and not a fresh-platform replication. THE TWO
        EXCEPTIONS ARE RT31-2 AND RT31-3, BOTH OF WHICH ARE IN THE COMMIT MESSAGE
        AND THE RECEIPT AND NEITHER OF WHICH IS IN THE RUN PACKAGE.

  required_controls:
    - id: RC-38-A
      title: >-
        THE ONE DISCRIMINATING CONTROL. K independent master seeds through the
        same driver under the same seed-derivation rule.
      what: >-
        Re-execute the primary 48-tuple arm K times under K fresh pairwise-disjoint
        master seeds, changing NOTHING ELSE - same 48 tuples, same C-14 replicate
        schedule, same seed string format, same driver - and report the empirical
        distribution of the 48-tuple z_sem mean: its centre, its sd, and the
        empirical exceedance probabilities at 0.3336976784 and at 0.3610236850.
      why_it_and_not_something_else: >-
        It is the ONLY construction that turns the question from an argument about
        two draws into a measurement of the null. It cannot come out ambiguous. It
        was already named as the cheapest discriminating control by
        RT-20260729-033 as RC-33-K and was not imposed; this report imposes the
        same control for a sharper reason - that after PP-1 and after the
        high-precision block, the null's centre is the last quantity that has never
        been measured on the committed record.
      cost: >-
        Curve-free, zero curve operations. The package measures the whole three-arm
        execution at 26.3 s with peak RSS 61 MB; the primary arm alone is a
        fraction of that. K = 120 is therefore of order a few minutes of wall
        clock and well under 1 GB. At K = 120 the centre is pinned to about
        plus or minus 0.013 and the exceedance probabilities to about plus or
        minus 0.01.
      resume_condition: >-
        If the measured centre is within 0.05 of the declared expectation of about
        +0.03 and the sd is within 0.02 of 0.1467, the shift is CLOSED as an
        upper-tail draw, the residue named in this report is closed with it, and
        nothing further in this lineage is warranted. If the measured centre
        exceeds +0.20, a deterministic component in the driver-plus-seed-rule
        combination is LOCATED, and the next control is RC-38-B followed by a
        line-level audit of draw_replicates.
      does_it_clear_RULE_BATCH013_SCOPE: >-
        NO, AND I DO NOT REQUEST IT AS A BATCH. RULE-BATCH013-SCOPE closes this
        lineage to further replication or control-on-a-control batches regardless
        of outcome, and reserves exactly one item - DEFER-BATCH013-001 - as able to
        justify a batch and only as its primary subject. RC-38-A is a
        control-on-a-control and does not clear that bar. I ACCEPT THE FORECLOSURE,
        for the reason given under RT31-12 below: the control would settle a
        question that the derivation and the high-precision block have already
        settled to the accuracy that matters, and spending the program's last
        instrument batch to raise a p = 0.017 residue to a p = 0.4 residue is not
        worth a batch.
      how_it_should_be_run_if_it_ever_is: >-
        As a subordinate calibration arm of the DEFER-BATCH013-001 batch, if and
        only if that batch is dispatched with (d) as its primary subject, and never
        as the primary subject of a batch of its own.

    - id: RC-38-B
      title: A different bit generator, not a different build.
      what: >-
        Re-execute the primary arm under a bit generator from a different family -
        Philox or SFC64 - with the same seed-derivation rule, and compare the
        48-tuple z_sem mean's centre against RC-38-A's.
      why: >-
        This is the control PP-1 is repeatedly mistaken for. PP-1 varies the BUILD
        and holds the GENERATOR fixed, so it cannot see a property shared by every
        tested numpy version. RC-38-B varies the generator and is the only
        construction that can. It is the residue RT31-3 names.
      cost: Curve-free, of the same order as one execution of the primary arm - seconds.
      resume_condition: >-
        Centres agreeing within their combined error close the generator-family
        question permanently. A disagreement above 0.10 would be a numpy finding
        and would be reported as an infrastructure finding, never as a mathematical
        one.
      does_it_clear_RULE_BATCH013_SCOPE: NO. Same reasoning as RC-38-A, and it is ranked behind it.

    - id: RC-38-C
      title: Replace DEFER-BATCH013-001's mean-level arm with its derivation.
      what: >-
        Before any compute is spent on the structurally exact pre-marking arm,
        archive the two closed-form expressions of RT31-8 and their evaluation at
        the 48 declared tuples, and confirm them at two tuples numerically. Spend
        the arm's compute on the SECOND MOMENT and on the census-facing component
        of O-4 (d), which arithmetic cannot reach.
      cost: >-
        The derivation is free. The two-tuple confirmation is seconds. The saving
        against the deferral's own costed design is the whole 48-tuple two-leg
        10^4-replicate block, which PDC-4 puts at of order twelve times the
        committed EXP-YIELD-002 high-precision block in tuple-legs and of order six
        times in byte-clears.
      resume_condition: >-
        If the two-tuple confirmation contradicts either closed form, the
        contradiction is the finding and the full arm is warranted after all.
      does_it_clear_RULE_BATCH013_SCOPE: >-
        YES, AS A MODIFICATION OF THE ONE RESERVED ITEM RATHER THAN AS A NEW ONE.
        It does not add a batch; it changes what the reserved batch should spend
        its compute on.

    - id: RC-38-D
      title: The corrections this report requires, carried into DEC-20260729-003.
      what: >-
        The four blocking repairs - RT31-1's branch-2 wording, RT31-2's commit
        subject line, RT31-4's likelihood correction, RT31-5's deviation count -
        recorded as explicit supersessions with the corrected text beside each.
      cost: None beyond the drafting of DEC-20260729-003.
      resume_condition: >-
        Not a control and has no resume condition; it is a precondition of the
        decision.
      does_it_clear_RULE_BATCH013_SCOPE: Not applicable - it consumes no batch.

  controls_the_stopping_rule_forecloses_and_whether_I_accept_it:
    foreclosed: [RC-38-A, RC-38-B]
    do_I_accept: >-
      YES, AND THE ACCEPTANCE IS REASONED RATHER THAN COMPLIANT. I would not
      accept it if the question were open. It is not open: the exact process mean
      is a theorem, the residual expectation is bounded above by about 0.04 by a
      derivation any session can re-run, and the package's own ten-tuple
      10,000-replicate high-precision block excludes a fixed bins-level offset by
      a factor of three to seventeen. What RC-38-A would buy is the conversion of a
      one-sided p of about 0.017 into a measured exceedance probability. That is
      worth minutes of compute and it is NOT worth this lineage's last batch, and
      the alternative use of that batch - DEFER-BATCH009-001's EXP-STR-004
      replication, the only carried obligation that can move the goal's sole
      active hypothesis - is worth more by any ranking this program has recorded.
      I record one dissent from the stopping rule's reasoning rather than its
      conclusion: the rule justifies closure by FIAT, and closure is in fact
      justified by EVIDENCE. Those are different, and a rule that would have
      closed the question equally firmly had the evidence pointed the other way is
      not the reason the question is closed.
    declared_dead: NONE. No lane is declared dead by this report.
    absence_of_evidence_versus_impossibility: >-
      STATED EXPLICITLY. That no deterministic component has been located is not a
      proof that none exists. RT31-3's residue - a property shared by every tested
      numpy version - and the residue named under
      is_it_undetermined_between_mathematics_and_code - a defect proportional to
      sem_rep - are UNEXCLUDED, not excluded. Nothing here is an impossibility
      claim, and a later session that finds a mechanism is not contradicting this
      report.

  refutation_artifact_ordering:
    the_ordering: counterexample certificate, then derivation note, then declared empirical_only
    counterexample_certificate: >-
      NOT APPLICABLE, AND RECORDED AS NOT APPLICABLE RATHER THAN AS SATISFIED.
      There is no proposition of the form `for all x, P(x)` to exhibit a witness
      against. A replication is a measurement, and a measurement admits no
      certificate. INT-BATCH013-I already records this and it is correct.
    derivation_note: >-
      AVAILABLE, AND THIS IS THE FINDING THE ORDERING RULE EXISTS TO SURFACE.
      Against the specific proposition that a third analytic term of size +0.30
      SEM exists, a DERIVATION NOTE is available and is strictly stronger than the
      empirical basis the batch declares. Its content is the decomposition
      E[z_sem] = (M - P_pred) E[1/sem_rep] + E[(mu_rep - M)/sem_rep] with M the
      exact process mean, together with the bound of at most 0.0801 in SEM units
      on the first term at any declared tuple, at most 1 + 3/(4 n_rep) on the
      Jensen factor, and the classical -gamma_1/(2 sqrt(n_rep)) form and its
      bound of about 0.088 at the extreme tuple on the second. It is not a product
      of this run and it is not archived; it is derivable from the committed
      package plus standard results, in one session, with no compute.
    declared_empirical_only: >-
      CORRECT FOR WHAT THE RUN ITSELF ADDS. Everything EXP-YIELD-003 measures is
      empirical_only and EV-ECDLP-010 should declare it so, as BND-6 and
      INT-BATCH013-I both anticipate.
    the_undeclared_basis_would_be_the_failure: >-
      NAMED BECAUSE THE CARD REQUIRES IT. If DEC-20260729-003 comes to rest on the
      proposition that no third analytic term exists, its basis is a DERIVATION
      NOTE and must be declared as one, and the note must be archived before the
      decision that relies on it. Resting that proposition on `empirical_only`
      when a derivation is available is the undeclared-basis failure. The absence
      of a proof is not the failure; the misdeclaration is.

  heuristic_challenges:
    - >-
      NO HEURISTIC IS UNDER TEST AND THE CONTRACT SAYS SO. heuristic_under_test is
      null; HEUR-1, the counting heuristic B^m/(m! p), is not tested, not
      validated, not weakened and is not a measured quantity anywhere in the
      package. I confirm that against the eleven committed artifacts.
    - >-
      THE ONE MODELLING ASSUMPTION THAT IS LIVE IS NOT LABELLED A HEURISTIC AND
      SHOULD BE. The substitution of a uniformly random s-subset for the
      structurally exact pre-marked set is a modelling choice carried since RC-A,
      declared before data, bounded at the mean level, and UNBOUNDED at every
      higher moment. RT31-8 closes its mean-level content in closed form. Its
      second-moment content remains an undeclared modelling assumption and should
      be numbered as one in EV-ECDLP-010 rather than carried as a deferral.
    - >-
      THE RANDOM-MODEL TRANSFER QUESTION DOES NOT ARISE HERE AND MUST NOT BE
      IMPORTED. There is no structured object standing in for a uniform one - the
      universe is an integer index range and the draws are genuinely uniform by
      construction. The exemplar-profile transfer challenge is inapplicable and is
      recorded as inapplicable rather than answered with a fabricated concern.

  cost_model_challenges:
    - >-
      NO COST MODEL IS TOUCHED, AND I VERIFIED IT RATHER THAN ACCEPTING IT. No
      operation count, no time-memory position, no efficiency and no yield ratio
      appears in any of the eleven artifacts except inside prohibitions. The
      BATCH-011 cost position at EV-ECDLP-008 O-11 is not restated. I introduce no
      cost-model consequence and none follows from anything here.
    - >-
      THE ONE COST STATEMENT THAT IS LIVE IS DEFER-BATCH013-001's, AND RT31-8
      CHANGES IT. PDC-4 corrected its size from twenty-four times to twelve times
      in tuple-legs and six times in byte-clears, and I confirm the byte-clear
      figure independently: the 48 declared tuples carry a total bin count of
      5,353,386, so a two-leg 10^4-replicate arm is about 1.07e11 byte-clears
      against the committed block's quoted 1.70e10, a ratio of about 6.3.
      RT31-8's derivation removes the mean-level justification for most of that
      spend.
    - >-
      PER-ATTEMPT VERSUS TOTAL EXPECTED COST DOES NOT ARISE - nothing is attempted,
      nothing succeeds or fails, and no success probability appears anywhere. The
      exemplar-profile bookkeeping challenge is inapplicable and is recorded as
      such rather than answered decoratively.

  baseline_comparison:
    RC_7_status: DECLARED INAPPLICABLE BY THE CONTRACT, AND I CONCUR.
    reasoning: >-
      EXP-YIELD-003 solves no instance, recovers no discrete logarithm, computes no
      relation and touches no curve. There is no algorithmic task for Pollard rho
      or baby-step giant-step to be a matched baseline of, and quoting either would
      be decoration. No specialized baseline exists for a balls-in-bins occupancy
      simulation over an integer residue range.
    the_baseline_that_does_apply_and_is_missing: >-
      THE RELEVANT BASELINE IS STATISTICAL, NOT ALGORITHMIC, AND IT IS THE THING
      THE COMMITTED RECORD LACKS. The correct comparator for a 48-tuple z_sem mean
      is the SAMPLING DISTRIBUTION OF THAT MEAN UNDER THE SPECIFIED PROCESS, which
      is what RC-38-A measures and what RT-20260729-033 named as RC-33-K. Until
      that exists on the record, every statement about how surprising 0.3337 is
      rests on a hand-derived normal approximation with a hand-derived centre. The
      BATCH-012 validator's 400-repetition Monte Carlo is the closest thing on the
      record and it is scoped to the FIRST observation only.
    the_committed_position_that_stands_unretracted: >-
      EV-ECDLP-008 O-11's census-versus-rho position - 28,384 to 2,604,442 times a
      measured Pollard-rho solve of the same instance, in a single declared
      operation unit - stands unretracted, is not restated as a result of this
      batch, and is not re-derived here.

  reduction_and_scope_challenges:
    no_reduction_is_invoked: >-
      No published reduction is cited by the package and none is instantiated.
      There is no OneEnd-to-EndRing-style corollary chain to check, and I record
      that rather than manufacturing one.
    scope_inflation_audit: >-
      THE A1 ADMISSION HOLDS AND I CONFIRM IT ON THE COMMITTED RECORD. This is a
      curve-free simulation of an occupancy null, at claim tier toy, at four toy
      prime fields with group orders 4001, 16619, 65633 and 261707, on one
      prime-order curve per size in the source package, from a SINGLE UNREPLICATED
      SOURCE RUN SET that is a size series and not a replication. IT IS NOT A
      FRESH-PLATFORM REPLICATION and every artifact says so. Nothing here is
      quotable as target-class, as an exponent result, as an attack, as an attack
      improvement, as a cryptanalytic result, as a closure or as an impossibility
      claim. No cost model is touched. INV-4 is not un-fired and is not
      re-disposed; INV-5 is declared neither way. No hypothesis moves. No
      completion criterion of GOAL-ECDLP-001 is met or approached, and no closure
      quorum is claimed or claimable.
    the_one_scope_statement_that_is_inflated: >-
      RT31-3. `The interpreter build and the numpy version are EXCLUDED as sources
      of the shift` inflates the tested scope from three build-and-library
      combinations on one host to the class of build-and-library properties.

  counterexample_or_mutation: >-
    THE CHEAPEST MUTATION THAT WOULD HAVE EXPOSED THE READING, HAD THE READING
    BEEN WRONG, IS ALREADY INSIDE THE BOUND PACKAGE AND WAS NOT READ AGAINST THIS
    QUESTION. It is the high-precision block's REPAIRED LEG measured against the
    exact analytic mean in standard-error units - the quantity PDC-9 expressly
    preserves as recomputable from OM-8 and OM-9, and NOT the prohibited
    repaired-minus-as-recorded difference column. A fixed offset in BINS scales as
    sqrt(n_rep)/sd, so an offset giving +0.31 SEM at the primary schedule must give
    +2.5 to +5.6 SEM at 10,000 replicates. The ten realised deviations are 0.501,
    -0.393, -0.686, 1.305, 1.224, -0.682, -0.723, 0.781, 0.096 and 1.829. The
    mutation is free, it is inside the snapshot, and it is decisive against the
    bins-level-offset reading. RT-20260729-021 ran the same control on the
    committed EXP-YIELD-002 block; this batch reproduced it on a block that is no
    longer an all-m=3 selected subset, with independent legs, and nobody read it.

  unarchived_probes_declaration:
    status: UNARCHIVED AND NOT EVIDENCE. No conclusion in this report rests on them.
    what_was_run_outside_the_repository:
      - >-
        An exact recomputation, at 50-digit precision, of the process mean M and
        of (M - P_pred)/sem_rep at all 48 declared tuples from the committed
        results.json, and of the skewness of the occupancy distribution from its
        exact factorial moments.
      - >-
        An independent from-scratch re-implementation of P-REPAIRED written from
        the frozen contract's prose, run at all 48 declared tuples over 120 fresh
        master seeds under the contract's own SHA-256 seed-derivation rule.
      - >-
        The same re-implementation seeded with master 130301, which reproduced the
        committed 48-tuple z_sem vector and its mean bit-identically at all 48
        tuples - an independent verification of the committed driver that the
        program did not ask for and that I record as a probe rather than as a
        result.
      - >-
        The exact evaluation of RT31-8's two closed forms and of PDC-15's exact
        difference expectation at the ten block tuples.
    why_they_are_named_rather_than_omitted: >-
      Because they shaped the ruling and a reader is entitled to know it, and
      because RC-38-A exists precisely so that the load-bearing one can be put on
      the record properly if the program ever decides it is worth the minutes.
      Every conclusion in this report is ALSO supported by the derivation note and
      by the committed high-precision block, both of which are available to any
      session without running anything.

