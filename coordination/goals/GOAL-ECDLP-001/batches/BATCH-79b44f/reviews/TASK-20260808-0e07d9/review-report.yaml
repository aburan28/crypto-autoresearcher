    F1_rank_keys:
      status: REVISE
      satisfied:
        - Coverage and matched-mean ranks have different literal domains.
        - Coverage names gamma, dataset, bits, and cluster fields.
        - Matched mean names a cluster-only key and a canonical tie break.
      blockers:
        - >-
          With dataset_id meaning a source dataset, the coverage-rank grammar
          has 4*512*5*32=327680 keys, not the declared 50325504 calls.
        - >-
          If dataset_id includes eta and bootstrap replicate as stated, the
          grammar has 4*512*3*8191*5*32=8052080640 keys, again not 50325504.
        - >-
          The matched key has only 32 unique cluster_id values. Charging
          368640 sixteen-byte rows is described as reuse but is not derived
          from the 320 arm-size-cluster assignments or any named metric table.
      conclusion: The two domains are separated but their cardinality and traffic bindings are not frozen.

