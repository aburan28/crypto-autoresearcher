  verdict_summary: >-
    The proposal snapshot, predecessor snapshot, corrected predecessor review,
    and immutable correction are hash-bound and parse strictly. The exact
    quotient row values, root/view/list cardinalities, all 53 displayed local
    traffic products, displayed traffic subtotal and reserve arithmetic, all
    six stage budgets, all 40 inherited uint128 thresholds, all 12 inherited
    eta-specific pseudo-true brackets, the capped algebraic sampler's stated
    exactness bound, the 12800 added canonical-query count, and the conditional
    estimator/bridge/crossover claim boundary independently recompute. The
    successor is nevertheless not one compiler-ready deterministic design.
    Coverage-rank calls do not match either interpretation of their frozen key
    grammar; the matched-rank charge is not derived from its 32 unique keys;
    the shared treatment-root key contains undefined gamma and dataset fields
    and charges only three 16-byte root words while also promising four sampled
    lists; selected-pair traffic uses half the selected-pair event count implied
    by the group-addition schedule; treatment and total group additions are
    high by 32768 and field multiplications are high by 983040 after changing
    L from U to U-1; and four declared unchanged inheritance anchors name no
    predecessor key, while two more bindings point to the wrong source section.
    These are versionable specification and accounting defects. They do not
    constitute an experiment, ECDLP evidence, a positive gamma_s observation,
    a speedup, a security result, or a reason to close the research lane.

