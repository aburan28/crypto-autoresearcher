  findings:
    - id: VAL79-F1-RANK-CARDINALITY
      severity: critical
      blocking: true
      category: deterministic_key_and_count_binding
      finding: >-
        Coverage and matched rank domains are distinct, but their declared call
        and byte counts do not follow from their key grammars. Coverage has
        either 327680 source-data keys or 8052080640 bootstrap-expanded keys,
        not 50325504; matched mean has 32 unique rank keys, while the 368640
        charged lookups are not tied to a named matched-mean row population.
      required_revision: >-
        Freeze one interpretation of every rank key, state the exact unique and
        reused call counts, and derive XOF generation and lookup traffic separately.

    - id: VAL79-F2-SHARED-ROOT-GENERATOR
      severity: critical
      blocking: true
      category: root_sharing_and_sampler_provenance
      finding: >-
        The model field is correctly removed and the view counts recompute, but
        gamma_id/dataset_id are undefined for treatment and the charged three
        root words cannot also generate four without-replacement scalar lists.
      required_revision: >-
        Freeze treatment sentinel fields or remove them; specify exact a,b,z
        and list generators, rejection caps, XOF consumption, and traffic; and
        restore every required generator domain displaced by full replacement.

    - id: VAL79-F3-TRAFFIC-SEMANTICS
      severity: critical
      blocking: true
      category: local_traffic_compiler
      finding: >-
        All 53 products multiply correctly, but pair/hash event counts represent
        half the selected-pair additions and multiple aggregate-derived event
        counts lack formulas. The 278899258112-byte aggregate is therefore a
        sum of internally exact products, not a complete resource derivation.
      required_revision: >-
        Make each selected-pair, endpoint, hash, archive-read, bootstrap scan,
        matched scan, fixture record, and XOF count derive from one named row population.

    - id: VAL79-F5-OPERATION-RECOMPILE
      severity: critical
      blocking: true
      category: exact_quotient_operation_accounting
      finding: >-
        L=M=U-1 is correct, but recompilation gives 1567771584 rather than
        1567804352 group additions and 389597632 rather than 390580672 field
        multiplications. The latter is exactly the stale two-multiplication
        charge for 491520 transforms removed by the L correction.
      required_revision: Recompile every operation, traffic, and hard-cap total from the corrected L rows.

    - id: VAL79-F6-CANONICAL-GATE-BINDING
      severity: major
      blocking: true
      category: unequal_isomorphism_pre_treatment_gate
      finding: >-
        The 12800-query, 1024000-byte, 25600-multiplication, and
        25600-squaring increments are numerically correct, but the total
        multiplication row is stale and the P/Q split does not enumerate the
        ten required canonical point classes per paired fixture.
      required_revision: Bind each canonical query to the exact generated point class and use the recompiled field total.

    - id: VAL79-INHERITANCE-ANCHORS
      severity: critical
      blocking: true
      category: immutable_interface_preservation
      finding: >-
        Four unchanged selectors do not exist as source keys and two explicit
        bindings point to the wrong source section. Fully replaced generator,
        root-variable, and cost sections also omit passing source interfaces.
      required_revision: >-
        Use exact source paths, preferably with section hashes, and enumerate
        every intentionally replaced interface so no passing gate disappears silently.

    - id: VAL79-SAMPLER-EXACTNESS
