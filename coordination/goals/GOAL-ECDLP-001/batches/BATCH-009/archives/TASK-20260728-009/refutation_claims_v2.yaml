  claims:

    - id: C1
      supersedes: D2
      status_of_claim: CONFIRMED by VAL-20260728-001 items 2, 3 and 4; certificate delivered.
      statement: >-
        For the eigenvalue multiset {1, lambda_2, lambda_3} frozen in
        experiments/EXP-ENDO-001/specification.yaml at
        inputs.curve_families[J0].eigenvalue_source - lambda_2 and lambda_3 being
        the two roots of L^2 + L + 1 = 0 mod N, for prime N at least 3 - Vieta
        gives lambda_1 + lambda_2 + lambda_3 = 0 mod N identically. Hence the
        integer vector (1, 1, 1, 0, ..., 0 | 0, ..., 0) lies in the witness lattice
        W_r(k) for every rank r at least 3 and every k, its infinity norm is 1, and
        no nonzero integer vector has infinity norm below 1, so the infinity-norm
        first minimum of W_r is EXACTLY 1 on those cells. EXP-ENDO-001 prediction
        P2 and H-ENDO-001 prediction 2, which predict about N^(1/(2r)) there, are
        FALSE on exactly those cells.
      scope_narrowing_mandatory: >-
        THIS CLAUSE IS ABOUT THE FROZEN EIGENVALUE SOURCE, NOT ABOUT A CURVE FAMILY
        AND NOT ABOUT A RANK. The family-level and rank-level phrasings used in
        REF-20260728-001 - "on family J0 at every r >= 3" - are RETRACTED as false
        (see retraction R1): on the same j = 0 curves other curve-backed eigenvalue
        choices admit no short relation and the first minimum is about N^(1/(2r)).
        Only the frozen triple degenerates.
      hypothesis_made_explicit: >-
        The roots must EXIST, i.e. N = 1 mod 3, or N = 3 where the quadratic is a
        square and 1 + 1 + 1 = 3 = 0 mod 3 anyway. VAL-20260728-001 item 2 shows
        this is FORCED rather than assumed: phi acts on the prime-order group as a
        scalar of order 3, and lambda = 1 would force N divides Norm(zeta_3 - 1) =
        3. So for every prime N > 3 in scope, 3 divides N - 1.
      basis: certificate
      certificate_level: >-
        LEVEL 1, COUNTEREXAMPLE CERTIFICATE, under docs/claims-and-verification.md.
        The certificate is instantiation.json, produced by the independent
        non-originating Validator session, carrying p = 4294967539, the curve
        y^2 = x^3 + 7, N = 613557433, k = 365480133 chosen not solved,
        lambda_2 = 290635917, lambda_3 = 322921515, an HNF basis of W_3 of
        determinant N, the counterexample vector (1,1,1,0,0,0) with congruence
        residue 0 and infinity norm 1 against a predicted N^(1/6) = 29.150266997,
        the on-curve CTRL-EIGEN checks phi(P) = [lambda_2]P and
        phi^2(P) = [lambda_3]P, and the CTRL-CERT replay P + phi(P) + phi^2(P) = O.
        An embedded pure-Python re-checker reading only that file was run by the
        producing session as a separately written second program - 42 checks, 0
        failures, exit code 0.
      consequences_that_stand:
        - >-
          The geometric degeneracy itself. Whether a driver enumerated exactly or
          used an LLL upper bound, the recorded value is log_N(1) = 0. The
          Validator ran LLL on W_3 and its reduced basis contains the norm-1
          vectors (-1,-1,-1,0,0,0) and (0,0,0,-1,-1,-1) directly.
        - >-
          HEUR-1 fails at these cells, and for a sharper reason than
          REF-20260728-001 gave. W_r contains the deterministic rank-2 family
          {(t,t,t,0,...)} + {(0,...,u,u,u,0,...)}, so a box of side cX contains at
          least about (2cX+1)^2 forced witnesses with certainty - about 3721 at
          r = 3, c = 1, X = 30, against a Poisson mean of about 64. The count is
          neither Poisson nor random.
        - >-
          HEUR-2 is SELF-DEFEATING at these cells rather than merely false. Its
          hypothesis excludes the algebraic relations forced by the endomorphism
          ring, and 1 + lambda_2 + lambda_3 = 0 is exactly such a relation, yet its
          conclusion that the first minimum attains the Minkowski bound is asserted
          unconditionally. The carve-out and the conclusion cannot both stand.
        - >-
          Minkowski is untouched. STEP 3 proves an UPPER bound, and 1 <= 30 holds.
          What fails is the ATTAINMENT assumption that turns that upper bound into
          a predicted regression slope of 1.
      consequence_marked_convention_dependent: >-
        Per NAR-3, the claim that the 40 J0 cells at r in {3,4} enter the S2
        regression is CONVENTION-DEPENDENT and, under H-ENDO-001's own
        first_minimum_method rule, FALSE - those are LLL cells and the contract's
        invalidation rule excludes them from the S2 fit. The cell arithmetic is
        right (arm A is 4 sizes x 5 seeds x 4 ranks = 80 cells, of which ranks 3
        and 4 are 40) but only r = 3 is labelled GENUINE by the contract; r = 4 is
        labelled SYNTHETIC. Half the affected cells are synthetic and this record
        says so.

    - id: C2
      supersedes: D1
      status_of_claim: >-
        PARTIAL in VAL-20260728-001 item 1. Mathematics CONFIRMED; the normative
        conclusion of D1 is NOT SUSTAINED and is retracted here.
      statement: >-
        The defect in EXP-ENDO-001's rank bookkeeping is DEFINITIONAL, not a
        mis-set numeral. The contract does not say whether `genuine` denotes a
        count of distinct efficiently computable scalars or a Z-rank; it uses the
        first notion on J0 and the second on J1728. Under its own
        synthetic_rank_rule - which defines a cell as SYNTHETIC when the extra
        eigenvalues correspond to NO efficiently computable map - J0's
        genuine_r_bound of 3 is INTERNALLY CORRECT, and J1728's 2 is internally
        WRONG, since four distinct efficiently computable scalars {1, i, -1, -i}
        exist there. What prediction P2 and STEP 3 tacitly require is
        Z-INDEPENDENT coordinates, and the contract never requires them anywhere.
      mathematics_confirmed_and_strengthened: >-
        End(E) for an ordinary j = 0 curve over F_p with p = 1 mod 3 is an order in
        Q(zeta_3), of Z-rank 2, and phi^2 + phi + 1 = 0. Two strengthenings from
        VAL-20260728-001 item 1 that REF-20260728-001 did not make. (i) Ordinarity
        is AUTOMATIC here - y^2 = x^3 + b over F_p with p > 3 is supersingular
        exactly when p = 2 mod 3 - so the hypothesis need not be assumed. (ii) The
        rank-2 conclusion does not need ordinarity at all: End(E) is a torsion-free
        domain in both the ordinary and the supersingular case, phi^3 = 1 with
        phi != 1 forces phi^2 + phi + 1 = 0, and no integer satisfies that, so
        Z[phi] has rank exactly 2 either way.
      basis: derivation
      j1728_finding_adopted: >-
        Per NAR-2. On a real j = 1728 curve the Validator verified four distinct
        efficiently computable scalars - p = 268435597, a = 4, N = 33555217,
        phi(P) = [16416912]P, phi^2(P) = [-1]P, phi^3(P) = [-16416912]P - and
        exhibited norm-1 congruence vectors for the coordinate choices (1, i, -1)
        and (1, i, -i), the latter being precisely the contract's own J1728
        eigenvalue_source. The frozen J1728 cells at r >= 3 do NOT carry the
        collapse only because the contract declares them SYNTHETIC with lambda_3
        drawn uniformly. The confinement to J0 is an artifact of an inconsistent
        definition, not a property of the mathematics.

    - id: C3
      supersedes: D4
      status_of_claim: >-
        CONFIRMED in VAL-20260728-001 item 7, and STRONGER than REF-20260728-001
        stated. The LLL route is superseded here, not carried.
      statement: >-
        For the class of attacks that construct a basis of W_r(k) and then reduce
        it, the CONSTRUCTION step already requires k. Writing down a basis of
        W_r(k) for any r at least 1 is polynomial-time EQUIVALENT to solving the
        given ECDLP instance. The determinant being pinned at N is a true but
        non-operative fact for that attack class - the barrier sits one step
        earlier, at constructing the object to be searched.
      the_reduction_carried_here_is_the_repaired_one: >-
        DETERMINISTIC, NO LLL, NO HERMITE FACTOR, NO FAILURE CASE, VALID FOR EVERY
        r AT LEAST 1. W_r(k) is the kernel of the character chi_k on Z^(2r) given
        by chi_k(a, b) = sum a_i lambda_i + k sum b_i lambda_i, of index N. Since
        Z^(2r)/W_r(k) is cyclic of prime order N, the group of characters vanishing
        on W_r(k) is cyclic of order N, generated by u = (lambda_1, ..., lambda_r,
        k lambda_1, ..., k lambda_r). So given ANY basis of W_r(k), form the basis
        matrix, compute its one-dimensional nullspace over the field Z/N by
        Gaussian elimination, normalise the generator by its first coordinate
        (which is c lambda_1 = c, nonzero), and read k off coordinate r + 1.
        Polynomial time, deterministic, always succeeds.
      why_the_LLL_route_is_not_carried: >-
        REF-20260728-001's D4 routed the recovery through LLL plus k = -A/B and did
        not state that LLL may return a vector with B = 0, which recovers nothing.
        That is not hypothetical: on W_3 for this very family LLL returns
        (0,0,0,-1,-1,-1) with A = B = 0. The LLL route is therefore CONDITIONAL and
        the record carries the deterministic replacement instead.
      instantiated: >-
        The Validator took an HNF basis of W_2(k), multiplied it by a random
        unimodular matrix so that k appears in no entry of the presented basis,
        confirmed the scrambled rows span the same lattice, recomputed the
        annihilator from those rows alone, normalised it, and recovered
        k = 365480133 with [k]P = Q verified on the curve. The recovered
        annihilator's second coordinate was lambda_2 and its fourth was k lambda_2,
        as predicted.
      basis: derivation
      scope_stated_narrowly_and_bindingly: >-
        A statement about the class of attacks that construct and then reduce W_r
        AS DEFINED IN EXP-ENDO-001 STEP 1, and about nothing else. It is NOT a
        statement about ECDLP, NOT about endomorphism-assisted attacks in general,
        and NOT an impossibility claim of any kind. Five settings it explicitly
        does not reach, named by RT-20260728-002 Q1 rather than assumed away: the
        preprocessing/advice model (Corrigan-Gibbs-Kogan, advice built without any
        target, already charged in DEC-20260727-008); multi-target and batch DLP
        (Kuhn-Struik, about sqrt(MN)); a DIFFERENT lattice encoding of the same
        endomorphism structure, in particular R_r itself, which is the GLV
        decomposition lattice and is fully constructible without k; partial-
        information and interval settings, where the natural object is not W_r; and
        approximate construction with candidate testing, which is the algorithm
        under test rather than a construction barrier. Endomorphism lattices are
        NOT a barred class. W_r specifically is.

    - id: C4
      supersedes: D3
      status_of_claim: >-
        Parts (i), (ii) and (iii) CONFIRMED by both reviews, with (ii) stronger
        than stated. The CONCLUSION CLAUSE of D3 is FALSE AS WRITTEN and is
        RETRACTED here, not narrowed.
      statement: >-
        For prime N, the k-independent sublattice of W_r - the intersection of
        W_r(k) over all k in [1, N-1] - is exactly R_r x R_r, where R_r is the
        eigenvalue relation lattice {c in Z^r : sum c_i lambda_i = 0 mod N}, and
        every vector of it has Q-side combination B = 0 and is therefore
        certificate-void under CTRL-CERT. Equivalently, and this is the strongest
        quantifier the argument supports: any k-independent construction that is
        correct for EVERY k yields only vectors of R_r x R_r, which carry no
        information about k.
      strengthening_adopted: >-
        Any TWO DISTINCT values of k suffice, not k = 1 and k = 2 specifically:
        (k - k')B = 0 with k - k' invertible mod the prime N forces B = 0 and then
        A = 0. The k-independent part is pinned by two probes, not by N - 1 of
        them.
      index_bookkeeping_confirmed: >-
        c -> sum c_i lambda_i is onto Z/N because lambda_1 = 1 is a unit, so R_r
        has index N in Z^r, R_r x R_r has index N^2 in Z^(2r), W_r(k) has index N,
        and [W_r(k) . R_r x R_r] = N. All three numbers check, and
        instantiation.json confirms det R_3 = N, det(R_3 x R_3) = N^2 and index N,
        with the HNF of the kernel of the k = 1 and k = 2 congruence pair equal to
        the HNF of R_3 x R_3 row for row.
      primality_hypothesis_is_inside_the_clause: >-
        N PRIME IS LOAD-BEARING AND IS STATED INSIDE THE CLAUSE, per RT-20260728-002
        S2. Over a composite modulus a nonzero non-invertible B recovers k modulo
        N/gcd(B, N) - that is Pohlig-Hellman, partial information rather than none
        - and the clause would be false as a general statement.
      basis: derivation
      generic_side_claim_labelled: >-
        Per NAR-4, the statement that generically R_r has determinant N in
        dimension r and first minimum about N^(1/r) is a GAUSSIAN HEURISTIC, not a
        theorem. The determinant part is exact and confirmed. The first-minimum
        part was tested on ONE random draw (LLL infinity-norm upper bound 397
        against N^(1/3) = 849.738 and a Gaussian expectation of about 425) and one
        draw is not a distribution. It is additionally HEUR-1, invoked inside a
        record whose headline claim is that HEUR-1 fails on this lattice family;
        that methodological defect is recorded rather than repaired.

  retractions:
    statement: >-
      Each item below is a claim published by this Coordinator that is WITHDRAWN,
      stated plainly rather than quietly restated. Six of the eight concern
      reasoning I published as my own.
    items:
    - id: R1
      retracts: >-
        Withdrawal ground G7 and rationale bullet 3 of the BATCH-009
        batch_disposition_decision - "Setting genuine_r_bound to 2 for J0 leaves
        the genuine r-sweep with exactly TWO points, r = 1 and r = 2 ... This is
        the Coordinator's own arithmetic, not the review's" - together with D2's
        family-level and rank-level phrasing of the P2 refutation.
      why: >-
        THE PREMISE IS FALSE. The governing invariant is not the Z-rank of End(E)
        but the existence of a SHORT relation sum c_i lambda_i = 0 mod N of
        infinity norm at most X = ceil(N^(1/(2r))). Rank deficiency guarantees SOME
        relation, never a short one. On the same j = 0 curve, phi_3 = a + b phi is
        a genuine endomorphism, evaluable as [a]P + [b]phi(P) in O(log N) group
        operations, and CTRL-EIGEN passes on it exactly as for phi; its eigenvalue
        is lambda_3 = a + b lambda_2 mod N and its relation vector (a, b, -1) has
        infinity norm max(|a|,|b|). R_3 has determinant N in dimension 3, so its
        generic first minimum is about N^(1/3), the SQUARE of X = N^(1/6): a
        relation short enough to matter is a measure-zero accident and the CM
        triple {1, lambda, lambda^2} is exactly that accident. GENUINE,
        CURVE-BACKED, EIGENVALUE-CHECKABLE r = 3 AND r = 4 CELLS EXIST. The
        two-point cap is false and the label it was published under - the
        Coordinator's own arithmetic - was the strongest evidential label used
        anywhere in the batch, on a claim nobody had checked.
      what_survives_on_a_repaired_premise: >-
        G7's CONCLUSION, for a different reason supplied by RT-20260728-002 S1: any
        such rescued cell is, as a lattice, the preimage of W_2 under an explicit
        integer matrix - a Z-linear reparametrization of the r <= 2 object carrying
        no endomorphism content the r = 2 cell did not already carry. The
        supportable sentence, which replaces the retracted one, is: beyond r = 2
        the sweep measures a Z-linear reparametrization of the r <= 2 lattice,
        whether the extra eigenvalues come from a curve or from a random draw, so
        no rank above 2 adds endomorphism content.
      the_correct_criterion: >-
        RELATION-FREENESS AT A THRESHOLD, which is RT-20260728-001's RC-3 with the
        missing threshold supplied and is carried forward as required control RC-6:
        a cell is genuine iff R_r admits no nonzero relation of infinity norm at
        most X = ceil(N^(1/(2r))). The reviewer stated the right invariant twice
        and REF-20260728-001 replaced it with a rank count.
      evidential_basis_of_this_retraction: >-
        DERIVATION, not certificate, and this is stated rather than glossed. The
        determinant-N count for R_3 in dimension 3 against X = N^(1/6) is paper
        arithmetic; the single generic control in instantiation.json used
        UNIFORMLY RANDOM eigenvalues rather than a curve-backed lambda_3 =
        a + b lambda_2, so RC-6 was NOT run on the curve-backed alternative and no
        certificate exists for it. The retraction does not need one: the withdrawn
        claim was a universal cap, and an admissible construction voiding it is
        enough. Recorded as a residual gap, not as a discharged control.
    - id: R2
      retracts: >-
        D3's conclusion clause - "every vector of W_r an attacker can write down
        without knowing k carries zero information about k" - in every form, and
        the framing built on it that "the constructible part is useless in both
        cases".
      why: >-
        FALSE AS WRITTEN, refuted by the algorithm the contract itself specifies.
        An attacker writes down any (a, b) with B(b) invertible - no knowledge of k
        required - computes k* = -A/B mod N and tests [k*]P = Q. That vector was
        written without knowing k and it decides one candidate for k; the whole
        meet-in-the-middle is a procedure for writing such vectors. The word
        "constructible" equivocated between constructible-with-a-guarantee and
        constructible-and-testable. Separately, the framing is contradicted by the
        literature: R_2 = {(c_1, c_2) : c_1 + c_2 lambda = 0 mod N} IS THE GLV
        DECOMPOSITION LATTICE, whose short vectors of norm about sqrt(N) are what
        Gallant-Lambert-Vanstone use to split k = k_1 + k_2 lambda and which
        underlies the automorphism-quotient rho walk this campaign names as the
        known correct way endomorphisms help. THE SUBLATTICE D3 CALLED USELESS IS
        THE USEFUL ONE IN THE PUBLISHED RECORD.
      replaced_by: 'C4 above, with the primality hypothesis inside the clause.'
    - id: R3
      retracts: >-
        Withdrawal ground G5's promotion of D4 from a statement about one attack
        class to "the mechanism the contract offers is not the operative one".
      why: >-
        CATEGORY ERROR against the algorithm actually specified. STEP 5's dichotomy
        is about a MEASURED COST CURVE, and the specified algorithm is a
        meet-in-the-middle over two boxes of coefficient vectors that never
        computes a basis of W_r, never reduces one, and never needs k to run - the
        driver knows k by the contract's own subgroup_requirement.
        Non-constructibility can therefore neither explain nor fail to explain a
        measured rho(r). D4 answers a question about basis reduction; STEP 5 asks a
        question about box enumeration.
