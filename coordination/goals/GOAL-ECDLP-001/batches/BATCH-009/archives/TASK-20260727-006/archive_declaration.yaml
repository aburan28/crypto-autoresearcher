archive_declaration:
  kind: ledger
  task_id: TASK-20260727-006
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-009
  source_task_ids:
    - TASK-20260727-005
  authorized_by: DEC-20260727-002
  amended_by: DEC-20260727-007
  declared_at: '2026-07-27'
  declared_by: coordinator

  role_of_this_document: >-
    A DECLARATION, not a receipt. The authoring Coordinator session has Read/Grep/Glob/Write/
    Edit and NO shell. It ran no git command, staged nothing, computed no SHA-256, made no
    commit, and ASSERTS THAT NO COMMIT HAPPENED. Nothing installed by this task is durable or
    official until the executing session commits the declared paths and the post-commit
    verifier accepts the commit. The executing session authors
    ledger_commit_receipt.json in this same directory, after the commit, as a follow-up - the
    mechanism BATCH-006 used, because a record cannot contain the hash of the commit that
    creates it.

  expected_parent: fa1510c9
  run_alone: true

  exact_paths_to_stage:
    - path: ledger/decisions/DEC-20260727-007.yaml
      change: added
      note: >-
        The TASK-20260727-005 determination's proposed_decision_record, installed at the
        identifier DEC-20260727-005 reserved for it. NOT DEC-20260727-004.
    - path: ledger/evidence/EV-GGM-002.yaml
      change: added
      note: >-
        The determination's proposed_evidence_record. Supersedes EV-GGM-001; all nine
        RUN-GGM-* ids populated; direction neutral, strength inconclusive, claim_tier toy,
        proof_status not_applicable.
    - path: ledger/corrections/CORR-20260727-003.yaml
      change: added
      note: >-
        The determination's proposed_correction_record against origin/main's DEC-20260726-007.
        This path is outside TASK-20260727-006's declared write_scope; DEC-20260727-007
        authorizes the addition of exactly this one path, on the precedent of DEC-20260727-001
        with CORR-20260727-001 and DEC-20260727-005 with CORR-20260727-002.
    - path: ledger/hypotheses/H-GGM-001.yaml
      change: modified
      note: >-
        EXACTLY ONE FIELD. Line 133 "  status: supported" -> "  status: specified". Nothing
        else in the file was touched. `git diff --numstat` against fa1510c9 must report exactly
        1 insertion and 1 deletion for this path; any other number is a defect - stop and
        record it.
    - path: ledger/goals/GOAL-ECDLP-001.yaml
      change: modified
      note: >-
        maximum_batches 6 -> 8 citing DEC-20260727-002; current_batch_id and
        dispatch_queue_path moved to BATCH-009; latest_verified_commit
        ab59e26bbf5fb06248b3a4ae2fb4306fb57c8144 -> fa1510c9 with an explicit basis field
        recording that the value rests on the executing session's report and not on a committed
        receipt; BATCH-009 checkpoint appended; status left at paused; exactly one next_action,
        with the replaced prior value preserved verbatim in the checkpoint.
    - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/dispatch_queue.json
      change: modified
      note: >-
        Card states set from what is actually committed, each with a state_basis.
        TASK-20260727-004 is recorded blocked because its declared deliverable does not exist.
        TASK-20260727-006 is recorded running; the executing session sets it completed and
        sets batch_closed true in the follow-up commit.
    - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/archives/TASK-20260727-006/archive_declaration.yaml
      change: added
      note: >-
        This file. Included deliberately: the post-commit verifier only checks paths the
        archive itself declared, so the declaration travels in the commit it describes.

  paths_deliberately_NOT_staged:
    - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/decisions/TASK-20260727-005/status_determination.yaml
      reason: >-
        DIVERGENCE FROM THE DETERMINATION'S OWN exact_paths_to_stage, AND THE REASON IS A FACT
        ABOUT HEAD. The determination listed itself and its companion for staging because at
        6d6632fc they were working-tree-only. The calling session reports the worktree CLEAN at
        fa1510c9, so both are already committed and staging them would contribute no change,
        which would make the "exactly the declared paths, no extras, no deletions" check fail
        for two phantom entries. VERIFY BEFORE COMMITTING: if `git status --short` shows either
        path modified or untracked at commit time, ADD IT BACK to the declared set and record
        the addition; do not silently drop a producer artifact that is not yet committed.
    - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/decisions/TASK-20260727-005/decision_rationale.md
      reason: Same as above.
    - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/archives/TASK-20260727-006/ledger_commit_receipt.json
      reason: >-
        Authored by the executing session AFTER this commit and carried by a follow-up commit,
        because it must record this commit's sha, parent and per-path SHA-256. It cannot be in
        the commit it describes.
    - path: any ._* AppleDouble sidecar
      reason: >-
        The worktree carries ._* siblings beside most tracked files. None is a declared
        research path. Do not stage any of them.
    - path: ledger/evidence/EV-GGM-001.yaml, ledger/decisions/DEC-20260726-007.yaml
      reason: >-
        Published and immutable, superseded and corrected rather than overwritten. Neither was
        edited by this task and neither may be staged.
    - path: experiments/EXP-GGM-001/ in its entirety, including specification.yaml and all nine run directories
      reason: >-
        Untouched. Run records are immutable; every defect in them is recorded, never filled.
        The specification stays status review_required with approved_by null.
    - path: anything under knowledge/
      reason: >-
        Outside every write scope in BATCH-009. The knowledge action CORR-20260727-003 requires
        belongs to TASK-20260727-008.
    - path: ledger/handoffs/TASK-20260727-006.yaml
      reason: >-
        Immutable task record. Its archive.record_ids entry DEC-20260727-003 is stale; the
        amendment is carried by DEC-20260727-007 and by this declaration, never by an edit.
    - path: ledger/decisions/DEC-20260727-003.yaml and ledger/decisions/DEC-20260727-004.yaml
      reason: >-
        Neither exists in the typed namespace and neither is created here. The root-namespace
        records ledger/DEC-20260727-003.yaml and ledger/DEC-20260727-004.yaml are published
        co-driver records (EXP-GPS-002 and EXP-GPS-001) and are untouched.

  id_freeness_verified_by_this_session:
    method: >-
      Each identifier was resolved across the UNION of the root namespace ledger/*.yaml and the
      typed subdirectory, per the binding allocation rule in DEC-20260727-005 rationale item 10,
      plus a repository-wide grep for a matching `id:` line under ledger/. Read from the working
      tree at a HEAD the calling session reports clean; the executing session must reconfirm at
      HEAD and STOP rather than shift the mapping if any is taken.
    DEC-20260727-007:
      free: true
      evidence: >-
        Root holds DEC-20260727-001 through -004 only. Typed holds -001, -002 and -005 only.
        -006 is reserved by DEC-20260727-005 for the RES-5 namespace decision and is NOT used
        here. -007 is reserved by DEC-20260727-005 for exactly this determination.
    EV-GGM-002:
      free: true
      evidence: Root holds no EV-GGM-* record. Typed holds EV-GGM-001 only.
    CORR-20260727-003:
      free: true
      evidence: >-
        Root holds CORR-20260724-002 only. Typed holds CORR-20260724-001 through -004,
        CORR-20260727-001 and CORR-20260727-002. -004 is reserved by DEC-20260727-005 and is
        NOT used here.

  commit_message: |
    ledger: BATCH-009 close - H-GGM-001 supported -> specified on REV-20260727-002 DOES_NOT_SURVIVE

    TASK-20260727-005 determination, installed by TASK-20260727-006.

    Records: DEC-20260727-007, EV-GGM-002, CORR-20260727-003, H-GGM-001, GOAL-ECDLP-001,
    BATCH-009. The determination proposed DEC-20260727-004; that id is taken by the published
    root record ledger/DEC-20260727-004.yaml (EXP-GPS-001 forensics), so DEC-20260727-005
    reallocated this decision to DEC-20260727-007 before any commit and reserved that id for it.
    EV-GGM-002 supersedes EV-GGM-001 with all 9 RUN-GGM-* ids populated, at direction neutral,
    strength inconclusive, claim_tier toy, proof_status not_applicable. CORR-20260727-003
    corrects origin/main's DEC-20260726-007 without overwriting it.

    Producers: TASK-20260727-002 (REV-20260727-002, DOES_NOT_SURVIVE) and TASK-20260727-003
    (RT-20260727-001, DOES_NOT_SURVIVE). H-GGM-001 returns to specified because its sole test
    was never implemented - classify_oracle is a lookup table on the subject's name and the
    control gate compares two literals in the same file - so the claim is UNTESTED, not
    refuted. GOAL-ECDLP-001 stays paused on pause_conditions item 1 with the batch budget
    extended 6 -> 8 by DEC-20260727-002; no rule-13 quorum was sought and none is recorded.

    AGENTS.md rule 12 is NOT discharged: both producers requested a higher policy, resolved
    claude-opus-5, fallback_used true, no equivalence claimed. No execution of EXP-GGM-001 is
    authorized; its status stays review_required with approved_by null. Whether the four
    augmented oracles are GGM-simulable stays OPEN and is decided in neither direction.
    Nothing in this commit is evidence for or against ECDLP hardness.

  message_requirements_checked:
    contains_TASK_20260727_006: true
    contains_TASK_20260727_005: true
    contains_DEC_20260727_007: true
    contains_EV_GGM_002: true
    contains_CORR_20260727_003: true
    contains_H_GGM_001: true
    contains_GOAL_ECDLP_001: true
    contains_BATCH_009: true
    deliberately_omits_DEC_20260727_003: >-
      Yes. That record is unrelated to this archive, which neither creates nor changes it.
      Naming it would make the verifier's message check pass for a false reason. Evaluate
      message_contains_record_ids against the AMENDED set authorized by DEC-20260727-007.

  sha256_bindings: >-
    EVERY SHA-256, THE COMMIT SHA AND THE PARENT SHA ARE COMPUTED BY THE EXECUTING SESSION FROM
    GIT OBJECT CONTENT AT THE RESULTING COMMIT (git show <sha>:<path> | shasum -a 256), NEVER
    FROM THE WORKING TREE AND NEVER BY THE DECLARING SESSION. No value in this document is a
    binding. Never invent, estimate or back-fill a hash or a commit sha; a value that cannot be
    computed stays null and is reported as such.

  post_commit_verification_required:
    - commit resolves
    - ancestor of HEAD
    - first parent equals fa1510c9
    - exactly the declared paths, no extras, no deletions
    - every declared SHA-256 matches commit content
    - message contains TASK-20260727-006, TASK-20260727-005 and every amended record id
    - ledger/hypotheses/H-GGM-001.yaml shows exactly 1 insertion and 1 deletion
    - all four new or modified YAML records parse, and tools/validate_ledger.py reports no new violations against the fa1510c9 baseline of 1108 errors
    - ledger/goals/GOAL-ECDLP-001.yaml carries exactly one next_action, status paused, no completion_quorum block, and no CONCUR attestation
    - nothing under experiments/ or knowledge/ appears in the commit

  on_any_failure: >-
    Stop and record the failure. A failed archive is an evidence-integrity failure, never a
    research conclusion, and no official transition is recorded until the verifier accepts the
    commit. If the archive stops, H-GGM-001 remains at whatever status is committed at HEAD and
    the BATCH-009 checkpoint is not official.

  what_this_archive_does_not_do:
    - Authorizes no execution of EXP-GGM-001 version 1 or of any other experiment.
    - Records no AGENTS.md rule-13 quorum. None was obtained and none may be recorded.
    - Sets no goal to completed.
    - Does not settle whether the jet, elliptic-net, incidence or endomorphism oracle is
      GGM-simulable. The reviews establish that the artifact does not support its claim; that
      question stays open in both directions.
    - Is not evidence for or against ECDLP hardness. KN-OPEN-001 is untouched.
    - Overwrites no published record. EV-GGM-001, DEC-20260726-007 and
      experiments/EXP-GGM-001/specification.yaml are superseded and corrected, never edited.
