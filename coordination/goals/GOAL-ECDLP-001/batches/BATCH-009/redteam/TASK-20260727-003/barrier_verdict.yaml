    statement: >-
      I did not author Report 94 (research/idea_generation_20260727_claude.md), its candidate
      file, BAR-PATHDYN-CONDTAIL-D2, BAR-PATHDYN-CHARP-D1, or RT-1476-SUBRES-A1. This is a
