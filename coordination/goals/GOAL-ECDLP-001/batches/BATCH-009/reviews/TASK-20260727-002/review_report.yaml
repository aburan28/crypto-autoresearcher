      - >-
        No branch inspects oracle_spec["query_types"], oracle_spec["public_data"], or any
        other structural property of its argument. The only use of the argument beyond
        `name` is spec_hash = sha256(json.dumps(oracle_spec)) at lines 114-115, a value that
        is recorded but never compared against anything.
      - >-
        There is no parser, no simulator constructor, no overhead checker and no witness
        generator, though specification.yaml implementation_requirements names all four. The
        `simulator`, `overhead_C`, `witness` and `rationale` fields are likewise source
