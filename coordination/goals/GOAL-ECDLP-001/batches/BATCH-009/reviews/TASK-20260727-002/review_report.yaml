    sha256: 3be3b279c371d5aff8a6b48dd47333dcd74e6dbc5d9df2ad5044a71b008e93c6
    lines_read: "1-343 (entire file)"
    imports_followed: "harness.toycurve.generate_instance (harness/toycurve.py:171) -- exists; called once, return value discarded"

    one_sentence_predicate: >-
      SIMULABLE if and only if the value of oracle_spec["name"] is one of the six string
      literals {pure_generic, public_curve, jet_oracle, elliptic_net_oracle,
