      "structured GGM". No single predicate could emit both sets of reasons -- but a lookup
      table can, because a lookup table carries no consistency obligation. The
      inconsistency is not hidden: both branches state it in their own emitted text.

    matches_frozen_gg_model_variant_shoup_encoding: NO
    matches_frozen_gg_model_variant_detail: >-
      inputs.gg_model_variant is frozen as shoup_encoding and H-GGM-001 assumptions item 5
      requires that variant be "fixed consistently across all oracles and controls". Two of
      the eight branches self-declare a departure from it in their emitted rationale. The
      jet branch states verbatim "In the strict GGM (opaque labels), the jet data is NOT
      computable"; the endomorphism branch states verbatim "in the strictest Shoup GGM
      (opaque labels), phi cannot be applied to a label, making it NON-SIMULABLE. We
      classify as SIMULABLE under the structured GGM." The frozen field was not honoured,
      and the artifact says so itself.

  # ---------------------------------------------------------------------------
  # 5. UNIFORM VERDICT TABLES  (CORE TASK 2 -- derived by hand, this session)
  # ---------------------------------------------------------------------------
  uniform_verdict_tables:
    single_simulability_definition_used:
      label: D
      statement: >-
        An oracle O is SIMULABLE in a given generic-group model M iff there exists a
        simulator that, given only M's public setup, the labels handed to it, the
        group-operation oracle and equality tests, reproduces O's answers exactly on every
        query. Its overhead C(N) is the number of group-oracle queries the simulator makes
        per O-query. O is O(1)-SIMULABLE iff additionally C(N) = O(1). Transfer rule: if O
        is simulable with overhead C, an algorithm making q O-queries yields a pure generic
        algorithm making q*C group operations, so Shoup (KN-TECH-005) gives q >=
        Omega(sqrt(p)/C).
      why_this_definition: >-
        It is the only reading under which the discrete_log control gets its frozen
        expected verdict. The competing reading -- "simulable iff the answer is invariant
        under relabeling" -- classifies discrete_log as SIMULABLE, because k is a function
        of the abstract pair (P,Q) and is identical under every encoding; the frozen
        falsification_criterion calls exactly that outcome unsoundness. So D is forced by
        main's own specification.

    model_1:
      name: strict Shoup opaque-label GGM
      definition: >-
        Group elements of the prime-order subgroup are presented as images of a random
        injection sigma into an unstructured label set. The algorithm receives the group
        order, sigma(P), sigma(Q), a group-operation oracle on labels and equality tests.
        No coordinates, no curve equation, no label-to-point map.
      subjects:
        - subject: pure_generic
          role: control
          frozen_expected: SIMULABLE
          my_verdict: SIMULABLE
          my_C: 1
          agrees_with_expected: true
          reasoning: "The query IS the model's native operation."
        - subject: discrete_log
          role: control
          frozen_expected: NON_SIMULABLE
          my_verdict: NON_SIMULABLE
          my_C: "unbounded (Omega(sqrt(p)))"
          agrees_with_expected: true
          reasoning: >-
            k is relabeling-invariant, so it is a function of the abstract data; but under
            D what matters is query cost, and Shoup gives Omega(sqrt(p)) group operations.
            Unbounded C, hence not simulable in the sense D requires.
        - subject: public_curve
          role: control
          frozen_expected: SIMULABLE
          my_verdict: SIMULABLE
          my_C: 0
          agrees_with_expected: true
          reasoning: "Setup data; answered without touching the group oracle."
        - subject: encoding
          role: control
          frozen_expected: NON_SIMULABLE
          my_verdict: NON_SIMULABLE
          my_C: "not applicable"
          agrees_with_expected: true
          reasoning: "A label carries no coordinate. x(P) is not a function of the abstract element."
        - subject: jet_oracle
          role: augmented
          frozen_expected: SIMULABLE
          my_verdict: NON_SIMULABLE
          my_C: "not applicable"
          agrees_with_expected: false
          reasoning: >-
            The frozen string returns a concrete element of F_p[eps]/eps^2. Apply the
            Weierstrass twist (x,y) -> (u^2 x, u^3 y): this is a group isomorphism, so all
            abstract group data (and every exponent relation) is unchanged, while the
            coordinates and hence the eps-block of the addition law transform by powers of
            u. The answer is therefore NOT a function of the abstract group element, and no
            label-only simulator can produce it. The module's own simulator string concedes
            the point: "This requires the coordinates, which are the encoding."
        - subject: elliptic_net_oracle
          role: augmented
          frozen_expected: SIMULABLE
          my_verdict: NON_SIMULABLE
          my_C: "not applicable"
          agrees_with_expected: false
          reasoning: >-
            W(a,b) is a field element in F_p fixed by the division-polynomial normalization
            and the Weierstrass model, not by the abstract group element; the same twist
            argument applies. Independently, the module's stated simulator is type-incorrect
            -- see blocking objection BO-4.
        - subject: incidence_oracle
          role: augmented
          frozen_expected: SIMULABLE
          my_verdict: SIMULABLE
          my_C: "Theta(B^m) -- NOT O(1)"
          agrees_with_expected: "verdict yes, overhead no"
          reasoning: >-
            Which m-subsets of the factor base sum to R is determined by the abstract
            group data alone, so a label-only simulator can answer by exhaustive summation
            and equality tests. But it must form Theta(B^m) sums. Simulable; not
            O(1)-simulable.
        - subject: endomorphism_oracle
          role: augmented
          frozen_expected: SIMULABLE
          my_verdict: SIMULABLE
          my_C: "Theta(log N) by addition chain; 0 under a lazy-encoding simulator"
          agrees_with_expected: "verdict yes, but for a reason main does not give, and at an overhead main does not report"
          reasoning: >-
            THIS IS THE ONE SUBJECT WHERE MAIN'S VERDICT SURVIVES. phi acts on the
            prime-order subgroup as multiplication by a scalar lambda, the root of phi's
            characteristic polynomial mod n (for j=0 GLV curves lambda^2+lambda+1 = 0 mod
            n). n and the curve are public, so lambda is computable with no group access at
            all, and the simulator answers phi(sigma(A)) as [lambda]sigma(A) using only the
            group oracle -- it never touches a coordinate. This works in strict Shoup AND in
            the structured model. Main's module reaches the same verdict by the opposite and
            invalid route: applying phi(x,y) = (zeta*x, y) to coordinates it does not have,
            and then charging C=0 for it, i.e. charging nothing for the very operation being
            simulated.
      control_gate_under_this_model: "4/4"
      control_gate_note: >-
        The gate PASSES under strict Shoup applied uniformly -- and two of the four
        augmented expected verdicts fail under that same uniform application.

    model_2:
      name: SGGM -- structured GGM, public curve equation, opaque point encodings
      definition: >-
        As model 1, but the algorithm additionally receives (a, b, p, n): the defining
        Weierstrass equation, the field, and the subgroup order. sigma remains a random
        injection and NO label-to-coordinate map is supplied. The algorithm knows which
        curve it is on; it does not know which point any given label denotes.
      provenance: >-
        This is the steelman named in ESC-20260727-001 reconciliation_notes section 5 item
        3 and constructed here, not adopted from any prior artifact.
      subjects:
        - subject: pure_generic
          frozen_expected: SIMULABLE
          my_verdict: SIMULABLE
          my_C: 1
          agrees_with_expected: true
        - subject: discrete_log
          frozen_expected: NON_SIMULABLE
          my_verdict: NON_SIMULABLE
          my_C: "unbounded (Omega(sqrt(p)))"
          agrees_with_expected: true
          reasoning: "Publishing (a,b,p,n) does not help a generic algorithm find k."
        - subject: public_curve
          frozen_expected: SIMULABLE
          my_verdict: SIMULABLE
          my_C: 0
          agrees_with_expected: true
        - subject: encoding
          frozen_expected: NON_SIMULABLE
          my_verdict: NON_SIMULABLE
          my_C: "not applicable"
          agrees_with_expected: true
          reasoning: >-
            DECISIVE AND CONTESTED. Knowing the curve equation tells the algorithm the SET
            of points on E. It does not tell it WHICH point the label sigma(A) denotes.
            x(sigma(A)) therefore remains uncomputable and the control survives. This is
            where I part company with ESC-20260727-001 horn 2 -- see
            dissent_from_ESC_20260727_001.
        - subject: jet_oracle
          frozen_expected: SIMULABLE
          my_verdict: NON_SIMULABLE
          my_C: "not applicable"
          agrees_with_expected: false
          reasoning: >-
            Identical to model 1. Publicity of (a,b,p) does not de-anonymise a label, and
            the twist argument is untouched by it: E and its u-twist have DIFFERENT public
            equations, so an algorithm told the equation still cannot recover an eps-block
            that varies across models from abstract data that does not.
        - subject: elliptic_net_oracle
          frozen_expected: SIMULABLE
          my_verdict: NON_SIMULABLE
          my_C: "not applicable"
          agrees_with_expected: false
        - subject: incidence_oracle
          frozen_expected: SIMULABLE
          my_verdict: SIMULABLE
          my_C: "Theta(B^m) -- NOT O(1)"
          agrees_with_expected: "verdict yes, overhead no"
        - subject: endomorphism_oracle
          frozen_expected: SIMULABLE
          my_verdict: SIMULABLE
          my_C: "Theta(log N); 0 lazily"
          agrees_with_expected: "verdict yes, reason and overhead no"
      control_gate_under_this_model: "4/4"

    the_unsatisfiability_result:
      statement: >-
        There is NO single model under which the control gate reads 4/4 AND the jet oracle
        is SIMULABLE by the construction main gives.
      proof_sketch: >-
        The `encoding` control is NON_SIMULABLE precisely when the label-to-coordinate map
        is unavailable. Main's jet simulator (simulability_test.py line 149) requires
        x_P, y_P, x_Q, y_Q, x_{P+Q}, y_{P+Q} -- it requires the label-to-coordinate map.
        Availability of that map is exactly the negation of the condition that makes the
        encoding control pass. The two conditions are complementary, so their conjunction is
        unsatisfiable. Symmetrically: in any model where main's jet simulator runs, the
        `encoding` oracle is answered by the one-line simulator "return x_P", making it
        SIMULABLE against its frozen expected verdict and dropping the gate to at most 3/4.
      corollary: >-
        The reported 4/4 was obtained by applying strict Shoup to the controls and a
        structured model to the augmented subjects. Under either model applied uniformly,
        the reported result set does not stand. Checkable on paper from main's own artifacts;
        requires no re-execution.
      surviving_exception: >-
        endomorphism_oracle escapes the dilemma, because a correct label-only simulator
        exists for it ([lambda]-multiplication). Main does not give that simulator. jet does
        not escape, and jet is what DEC-20260726-007 leads with.

  # ---------------------------------------------------------------------------
  # 6. STEELMAN ATTEMPT  (CORE TASK 3)
  # ---------------------------------------------------------------------------
  steelman_attempt:
    attempted: true
    attempted_before_attacking: true
    construction: "model_2 (SGGM) above, formalised in full before any objection was written."
    can_the_definition_be_made_precise: YES
    does_it_save_the_control_gate: YES
    does_it_save_the_jet_closure: NO
    does_it_save_the_endomorphism_verdict: "YES as to the verdict; NO as to main's reason and NO as to C=0 under the frozen overhead metric"
    finding: >-
      The steelman is a real and defensible model, and it does MORE for main's result than
      ESC-20260727-001 allowed: under a properly formalised SGGM the control gate genuinely
      reaches 4/4, because publishing the curve equation does not de-anonymise an opaque
      label. ESC-20260727-001 horn 2 asserted that a uniform structured model forces the
      encoding control to flip to SIMULABLE. That step conflates "the curve equation is
      public" with "the coordinates of a labelled point are readable", and it is wrong. I
      record that in main's favour.
      But the rescue does not reach the headline. The very feature that saves the gate --
      opaque labels -- is the feature that kills the jet simulator, because main's jet
      simulator consumes coordinates by its own written construction. A model cannot both
      withhold coordinates from the encoding control and hand them to the jet oracle. So the
      steelman relocates the contradiction; it does not dissolve it. The strongest available
      rescue saves the gate and loses the closure.
    what_would_have_saved_the_jet_closure_and_does_not_exist: >-
      A proof that the eps-block is invariant under every group isomorphism of the
      subgroup -- i.e. that the jet oracle transmits nothing beyond the abstract group law.
      The Weierstrass twist (x,y) -> (u^2 x, u^3 y) is a counterexample to that invariance.
      And were such invariance true, the SIMULABLE verdict would be correct but VACUOUS: an
      oracle transmitting no information beyond the group law closes nothing that the plain
      group-operation oracle did not already close, so "this closes all jet-based ECDLP
      candidates" would still not follow.

  # ---------------------------------------------------------------------------
  # 7. CONTROL GATE FINDING   (question 4a, answered separately)
  # ---------------------------------------------------------------------------
  control_gate_finding:
    question: "Does the reported 4/4 control gate actually establish test soundness?"
    answer: NO
    answer_is_unconditional: true
    grounds:
      - id: CG-1
        title: "The gate is a tautology: it compares two hardcoded literals in the same file"
        detail: >-
          The gate (lines 303-311) compares ORACLES[name]["expected_verdict"] against
          verdicts[name].verdict. The first is a source literal at lines 27-92; the second is
          a source literal at lines 121-178. Both were written by the same author in the same
          file and agree by construction. The comparison contains no free variable. Therefore
          controls_correct == 4 for every seed, every bit size, every curve, and indeed for
          every possible execution of the program. The frozen falsification_criterion -- "a
          single control misclassification falsifies the test's soundness" -- cannot fire. A
          gate that cannot fail carries zero information about soundness.
      - id: CG-2
        title: "Even a genuine 4/4 gate could not validate this classifier"
        detail: >-
          The gate's stated logic is: correct controls license trust in the augmented
          verdicts. That inference requires the classifier to be a single procedure whose
          correctness on controls is evidence of correctness elsewhere. classify_oracle is a
          lookup table of eight independent branches. Correct control entries and wrong
          augmented entries coexist in a lookup table at no cost, because the branches share
          no machinery. So the control-gate design is void for this implementation
          independently of CG-1.
      - id: CG-3
        title: "The 4/4 figure appears in no run artifact at all"
        detail: >-
          controls_correct is printed to stdout (line 312) and is never passed to write_run.
          write_run explicitly writes stdout.log and stderr.log as EMPTY STRINGS (lines
          271-274). I confirmed all 18 log files are 0 bytes. controls_correct appears in no
          manifest.yaml and no raw-result.json. The 4/4 therefore exists only as prose in
          analysis.md, EV-GGM-001 and DEC-20260726-007. It is unbacked by any run record --
          not falsified, simply not recorded. Against AGENTS.md rule 10.
      - id: CG-4
        title: "The gate as reported was scored under two different models"
        detail: >-
          See uniform_verdict_tables.the_unsatisfiability_result. Under one model applied
          uniformly the gate does reach 4/4 -- but then two augmented expected verdicts fail.
    what_this_finding_is_not: >-
      It is NOT a finding that the four control verdicts are wrong. I derived all four by
      hand under two models and all four came out as the specification expects. The controls
      have the right answers. The gate simply does not, and cannot, establish anything by
      checking them.

  # ---------------------------------------------------------------------------
  # 8. CLOSURE CLAIM FINDING   (question 4b, answered separately)
  # ---------------------------------------------------------------------------
  closure_claim_finding:
    question: >-
      Does the claimed scale-independent mathematical closure at exponent 1/2 hold, as
      asserted by EV-GGM-001 and main's DEC-20260726-007?
    answer: NO_FOR_JET; NOT_ESTABLISHED_BY_THIS_ARTIFACT_FOR_ENDOMORPHISM
    jet_oracle:
      claim: "SIMULABLE with C=1, closed at exponent 1/2, closes all jet-based ECDLP candidates"
      my_finding: DOES_NOT_HOLD
      detail: >-
        NON_SIMULABLE under both models I formalised, by the Weierstrass-twist argument. The
        claimed closure does not exist. If instead the oracle is read as the universal-
        identity variant, it becomes SIMULABLE but vacuous and still closes nothing beyond
        what the group oracle closes. The frozen specification string is the coordinate
        reading, so the frozen text points to NON_SIMULABLE.
    endomorphism_oracle:
      claim: "SIMULABLE with C=0, closed at exponent 1/2"
      my_finding: VERDICT_CORRECT_ARGUMENT_INVALID_OVERHEAD_MISREPORTED_RESULT_NOT_NOVEL
      detail: >-
        The verdict SIMULABLE is CORRECT, via [lambda]-multiplication (see model_1). With
        C = Theta(log N) the transfer gives q >= Omega(sqrt(p)/log p) = p^{1/2-o(1)}, so
        exponent 1/2 IS preserved -- a log factor does not move an exponent. So a true
        closure-flavoured statement about the endomorphism oracle survives. But: (i) it is
        not the statement main derives, since main's C=0 comes from applying a coordinate
        formula the model forbids and charging nothing for the operation being simulated;
        (ii) it is not novel -- that a public automorphism of order r yields a sqrt(r)
        speedup of rho with the exponent unchanged is standard (Wiener-Zuccherato; GLV;
        Duursma-Gaudry-Morain), and is sharper than the verdict label; (iii) an artifact
        whose classifier is a lookup table cannot be the thing that establishes it.
    scale_independence_and_tier:
      finding: >-
        The phrase "scale-independent mathematical closure at exponent 1/2 (derivation-
        level, not toy-tier)" is not earned in either subject. docs/claims-and-verification.md
        defines proof_status derivation as "a written, self-contained argument ... checkable
        by an independent reader step by step". analysis.md is 66 lines of assertion citing a
        lookup table; it contains no step-by-step argument for any verdict, and its own
        Limitations section concedes "Under the strictest GGM, jet and endomorphism would be
        NON-SIMULABLE". A record cannot claim derivation status on an argument that is not
        present, and the same document states that derivation status "does not relax the
        ceiling above".
      internal_inconsistency: >-
        EV-GGM-001 simultaneously carries claim_tier toy and asserts in boundaries item 2
        that "the closures themselves are not toy-tier". Those cannot both hold. The honest
        form is claim_tier toy AND proof_status at most empirical_only, with the closure
        language removed.

  # ---------------------------------------------------------------------------
  # 9. SPECIFIC CLAIM CHECKS  (CORE TASK 4 a-e)
  # ---------------------------------------------------------------------------
  specific_claim_checks:
    a_overhead_C_identical_across_bit_sizes:
      question: "Is overhead_C identical across 8, 12 and 16 bits for every subject, and can a statically counted quantity support an N-independence claim?"
      identical: true
      verified_over: "all 9 manifests, read individually this session"
      values: "pure_generic 1; public_curve 0; jet_oracle 1; endomorphism_oracle 0; null for discrete_log, encoding, elliptic_net_oracle, incidence_oracle -- at every bit size and every seed"
      can_support_N_independence: NO
      detail: >-
        Stronger than "statically counted". The `verdicts` dict is computed ONCE at lines
        295-299, OUTSIDE the seed/bits loop at lines 325-337, and the SAME object is
        serialized into all nine run directories. overhead_C is not merely a static count; it
        is literally the same integer object written nine times. All nine raw-result.json are
        byte-identical (SHA-256 388c95d8b6a7...). The
        analysis_methodology.overhead_growth_check compared a constant to itself and had zero
        degrees of freedom. The N-independence claim underlying both headline closures rests
        on a check that could not have detected growth for any oracle under any circumstance.
      independently_predicted_by: "RT-20260726-001 falsification route XR-2, written before this run existed"
    b_discrete_log_witness_form:
      question: "Does the discrete_log control emit a witness of the form its own specification mandates (an encoding pair), or prose?"
      answer: PROSE
      detail: >-
        specification.yaml implementation_requirements.module_interface mandates, for
        NON_SIMULABLE, `witness: {E1, E2, O_answer_E1, O_answer_E2}` -- a structured encoding
        pair with divergent answers. simulability_test.py line 130 emits a free-text English
        paragraph. No E1, no E2, no divergent answers, no structure of any kind.
        Self-refutation: that paragraph's own final sentence reads "The answer depends on the
        abstract group structure (which element is Q relative to P), not on the encoding" --
        conceding that the mandated encoding pair CANNOT exist, because k is relabeling-
        invariant. The primary soundness control was scored correct without producing the
        certificate its own specification requires.
      also_verify_witness_is_vacuous: >-
        verify_witness (lines 181-204) returns True on every reachable path: line 185
        (SIMULABLE), 188 (discrete_log, "the lower bound is a theorem"), 200 (encoding,
        "trivially true"), 204 (default). The only False (line 202) is reachable solely if
        generate_instance raises. Its signature (verdict, seed, bits) does not match the
        mandated verify_witness(witness, curve). And its results are collected into
        witness_results at line 331 and then DISCARDED -- write_run never receives them. So
        the frozen primary metric witness_checkability appears in zero run records, and the
        specification's requirement that witnesses be re-verified "with independent code (not
        the test module's own path)" is unmet.
      independently_predicted_by: "RT-20260726-001 OBJ-05; REV-20260726-005 BO-3"
    c_falsification_condition_4:
      question: "Does H-GGM-001 falsification_conditions item 4 fire for elliptic_net (O(log N)) and incidence (O(B^m)), and is it stated in the right direction?"
      fires_textually: true
      detail: >-
        Item 4 reads: "The simulator overhead C grows with the group order N for an oracle
        classified SIMULABLE, meaning the O(1) overhead claim is false and the Shoup lower
        bound does not apply to that oracle." Both subjects are classified SIMULABLE with C
        stated to grow in N (analysis.md rows 2 and 3, EV-GGM-001 observations 5 and 6). The
        condition fires textually for two of the four augmented subjects. The archive
        nonetheless recorded decision `support` at strength `strong` without noting that a
        declared falsification condition had fired.
      stated_in_right_direction: NO
      direction_detail: >-
        Two independent defects. (i) The consequent is wrong: growth in C does not make the
        Shoup bound "not apply", it degrades the transferred bound to q >= Omega(sqrt(p)/C).
        For C = O(log N) that is p^{1/2-o(1)} -- exponent 1/2 fully intact. Treating a log
        factor as destroying the bound is a mathematical error in the hypothesis text. (ii)
        The condition is scoped as a falsifier of the HYPOTHESIS when what growing C
        undermines is a single SUBJECT'S O(1) claim. A per-subject overhead observation
        should invalidate that subject's O(1) verdict, not the hypothesis about the test.
      consequence: >-
        Because item 4 fires textually but is stated in a direction that does not follow, this
        protocol cannot adjudicate the elliptic-net and incidence subjects in EITHER
        direction. That is a finding of indeterminacy, not a falsification.
    d_O_B_to_the_m_much_less_than_sqrt_N:
      question: "Is 'O(B^m) is still much less than sqrt(N)' true, false, or vacuous given that B is never bounded in the frozen specification?"
      answer: FALSE_UNDER_THIS_PROGRAMS_OWN_CONVENTION_AND_VACUOUS_IN_GENERAL
      detail: >-
        I read inputs.augmented_oracles[incidence_oracle] in the frozen specification: it
        bounds neither B nor m, and states nothing about the factor base's provenance. So the
        sentence has no truth value as frozen -- vacuous. Instantiated with this program's own
        convention B = ceil(sqrt(N)) (H-STR-002 test_boundary) at m = 2, B^m is on the order
        of N, which is not much LESS than sqrt(N) but very much GREATER -- so the sentence is
        false on the program's own default. The transfer bound then reads q >=
        Omega(sqrt(N)/N), which is vacuous. analysis.md line 63 asserts the sentence for both
        elliptic_net and incidence jointly; it is fine for O(log N) and unsupported for
        O(B^m).
      not_a_claim_of_advantage: >-
        Nothing here suggests the incidence oracle confers any advantage. It is a defect in a
        written analysis, not a result about index calculus.
    e_all_nine_runs_agree:
      question: "Do all 9 runs agree on spec_hash and on every subject verdict?"
      answer: YES_BUT_THE_AGREEMENT_IS_NOT_CORROBORATION
      detail: >-
        All 9 runs carry identical spec_hash values for all 8 subjects (pure_generic
        d26f5a1285baaea2, discrete_log 3134d46d42fb5daf, public_curve 01fbd6f6472962f3,
        encoding b4db9084a18e53da, jet_oracle 2751ca45b10c7c65, elliptic_net_oracle
        e29dd804df030a0d, incidence_oracle 0851d6a65a624d27, endomorphism_oracle
        4b6f28a6213feee2) and identical verdicts. All 9 raw-result.json are byte-identical.
        This is agreement by construction, not replication: one classification serialized nine
        times.
      spec_hash_cannot_detect_drift: >-
        The spec_hash is sha256 of the IN-CODE ORACLES entry (line 114), not of
        experiments/EXP-GGM-001/specification.yaml, and it is never compared to anything.
        invalidation_rule 3 -- "if the oracle specification hash in a run's raw-result does not
        match the frozen specification hash, the run is invalid" -- therefore cannot fire.
        Worse, the hashed in-code object INCLUDES expected_verdict and expected_basis, so the
        recorded "specification hash" is a hash of the answer key.
      actual_drift_exists: >-
        The frozen command_template names oracles `jet,elliptic_net,incidence,endomorphism`
        while the module's ORACLES keys are `jet_oracle,elliptic_net_oracle,incidence_oracle,
        endomorphism_oracle`. Executing the frozen command_template verbatim raises KeyError at
        line 297. Specification and implementation are out of sync and no check detects it.

  # ---------------------------------------------------------------------------
  # 10. PER-RUN CONSISTENCY
  # ---------------------------------------------------------------------------
  per_run_consistency:
    runs_examined: 9
    all_manifests_read_individually: true
    status_all: completed_valid
    dirty_all: false
    code_commit_all: 7ec5251ff6c23cbc26ada90ecb0fced928f84b85
    code_commit_exists_in_this_repo: true
    code_commit_subject: "EXP-SEMAEV-001: complete the bits=14 tier (seeds 1,2)"
    verdicts_identical_across_runs: true
    spec_hashes_identical_across_runs: true
    raw_result_byte_identical_across_runs: true
    findings:
      - id: PR-1
        title: "The nine runs are one execution, not nine"
        detail: >-
          Timestamps span started_at 1785163745.012458 (s1-b8) to finished_at 1785163746.016994
          (s3-b16) -- 1.005 seconds for all nine, strictly increasing in exact loop order. The
          module's main() computes verdicts once and then loops over seeds x bits writing nine
          directories from one process. The nine directories are nine serializations of a
          single computation. Describing them as "9 runs (3 seeds x 3 bit sizes)" (EV-GGM-001
          observation 1) is accurate as a count of directories and misleading as a claim of
          replication. Per-run wall_seconds range from 0.00021 to 0.229 s.
      - id: PR-2
        title: "command.txt is synthesized, was not the command executed, and cannot be executed"
        detail: >-
          command.txt is built as an f-string at line 328, not captured from the invocation.
          The recorded per-run commands (e.g. "--seeds 1 --bits 8") were not what ran; a single
          default-argument invocation produced all nine. Independently, the recorded string
          `python -m experiments.EXP-GGM-001.simulability_test` cannot execute as written:
          `EXP-GGM-001` contains hyphens and is not a valid Python identifier, so `-m` cannot
          resolve that dotted path. The reproduction command in every run record is unrunnable.
          Relevant to AGENTS.md rule 9 (recorded commands).
      - id: PR-3
        title: "stdout.log and stderr.log are written empty by the writer itself"
        detail: >-
          Lines 271-274 write empty strings unconditionally. All 18 files are 0 bytes. Every
          printed diagnostic -- including the control-gate line and the "TEST SOUND" banner --
          is discarded at write time.
      - id: PR-4
        title: "The manifest inference block is a source constant, not a receipt"
        detail: >-
          requested_policy coordinator-ultra-code, resolved_model_id
          fireworks-ai/accounts/fireworks/models/glm-5p2, fallback_used true are hardcoded at
          lines 237-242 and emitted identically into all nine manifests. They record nothing
          measured. Likewise result.valid true, certificate {kind none, verified true, verifier
          no-claim} (line 251), artifacts {} and environment.dependencies {} (line 218). The
          fallback carries no authorization_ref and I found no committed decision authorizing
          it.
      - id: PR-5
        title: "EV-GGM-001.run_ids is empty while asserting nine runs"
        detail: >-
          All nine run directories exist on disk; none is cited by the evidence record. The
          evidence is not bound to the runs it rests on. Against AGENTS.md rule 10.

  # ---------------------------------------------------------------------------
  # 11. PROCESS FINDINGS -- kept strictly separate from substance
  # ---------------------------------------------------------------------------
  process_findings:
    separation_statement: >-
      THIS SECTION IS PROCESS ONLY. A process defect is NOT a mathematical finding and is
      NOT evidence about any oracle. Everything in sections 5-9 above was derived from the
      frozen specification text and the module source, and would stand unchanged if
      EXP-GGM-001 had been approved and reviewed perfectly. Conversely nothing in this
      section is offered as support for the substantive verdict. The two lines of argument
      are independent and each is sufficient on its own terms for what it claims.
    P1_no_approval:
      confirmed: true
      evidence: >-
        experiments/EXP-GGM-001/specification.yaml at HEAD reads status: review_required and
        approved_by: null (lines 8 and 262). A grep of ledger/decisions/ finds no approve
        decision for EXP-GGM-001. The runs executed against parent 7ec5251f where the same
        specification was equally unapproved.
      is_this_negative_evidence_about_any_oracle: NO
    P2_no_rule_12_review:
      confirmed: true
      evidence: >-
        No reviewer, validator or red-team artifact accompanies commit 3a59a207; EV-GGM-001
        records reviewed_by: coordinator. A closure claim above the toy tier received no
        independent review. Note the recursion: THIS review does not repair it either, because
        it could not reach the rule-12 policy floor (see runtime_receipt).
      is_this_negative_evidence_about_any_oracle: NO
    P3_knowledge_promotion_state:
      observed_only_repaired_nothing: true
      detail: >-
        knowledge/findings/KN-FIND-002.md carries 3 unresolved Git conflict markers,
        knowledge/findings/KN-FIND-001.md carries 6, and knowledge/INDEX.md carries 3.
        main's DEC-20260726-007 knowledge_promotion records `promoted: [KN-FIND-002]`, while
        ESC-20260727-001 states the same commit promoted KN-FIND-001. KN-FIND-002 is claimed
        by two different findings across the conflict boundary. Whatever the resolution, a
        finding promoted on this evidence would inherit a proof_status its evidence record
        does not earn (see closure_claim_finding), which docs/claims-and-verification.md
        forbids: "a finding never claims a stronger basis than its evidence record". I edited
        nothing under knowledge/.
    P4_specification_implementation_drift:
      detail: "See specific_claim_checks.e_all_nine_runs_agree.actual_drift_exists."

  # ---------------------------------------------------------------------------
  # 12. DISSENT FROM THE POSITION UNDER TEST
  # ---------------------------------------------------------------------------
  dissent_from_ESC_20260727_001:
    treated_as_position_under_test: true
    where_I_agree: >-
      A1, A2, A5, B2, B3, B4, B5 and the C-section judgement that `supported` cannot stand
      are all confirmed independently here, several of them from the source code the ruling
      declined to read.
    where_I_disagree:
      item: "B_substance.the_decisive_point.horn_2"
      ruling_said: >-
        That under a uniform structured GGM, coordinates are recoverable for every subject
        alike, so the encoding control must be classified SIMULABLE and the gate drops to at
        most 3/4.
      my_finding: INCORRECT_AS_STATED
      detail: >-
        The step conflates publicity of the curve EQUATION with readability of a labelled
        point's COORDINATES. A properly formalised structured GGM (model_2) publishes (a,b,p,n)
        while keeping sigma a random injection with no label-to-coordinate map. Under it the
        encoding control remains NON_SIMULABLE and the gate genuinely reads 4/4. Horn 2 is
        therefore too strong, and the ruling's dilemma as written is not sound.
      why_the_ruling_s_conclusion_nonetheless_stands: >-
        The correct dilemma is sharper and survives the repair. The gate is 4/4 exactly when
        the label-to-coordinate map is unavailable; main's jet simulator runs exactly when it
        IS available. Complementary conditions, so the conjunction is unsatisfiable. The
        ruling reached the right destination by a partly wrong route, and its own instruction
        -- that the horn argument "should be tested by a non-originating reviewer, not
        accepted because a Coordinator wrote it" -- is vindicated by the correction, not
        contradicted by it.
    additional_correction: >-
      ESC-20260727-001 A3 treats falsification condition 4 as having fired against the
      hypothesis. It fires textually, but the condition's consequent is mathematically wrong
      (see specific_claim_checks.c). The ruling's own hedge -- "this protocol cannot adjudicate
      the question, in either direction" -- is the correct reading and should be the one
      carried forward.

  # ---------------------------------------------------------------------------
  # 13. CEILINGS
  # ---------------------------------------------------------------------------
  recommended_claim_tier: toy
  recommended_claim_tier_rationale: >-
    docs/claims-and-verification.md derives the tier mechanically from tested parameters
    ("toy: max field bit size <= 32"); the runs are 8, 12 and 16 bits. medium and crypto are
    unreachable by this protocol at any verdict. This matches the ceiling RT-20260726-001
    set in advance.
  recommended_proof_status: empirical_only
  recommended_proof_status_rationale: >-
    proof_status derivation requires "a written, self-contained argument ... checkable by an
    independent reader step by step" (docs/claims-and-verification.md). No such artifact
    exists: analysis.md asserts conclusions and cites a lookup table, and the module contains
    no derivation. I note candidly that empirical_only is itself generous here, since the runs
    measured nothing about any curve -- the seeds and bit sizes never touch a verdict. If the
    Coordinator prefers, not_applicable is defensible. What is NOT defensible is derivation.
  forbidden_phrasings_that_currently_appear_in_committed_records:
    - "\"closure at exponent 1/2\" without model and oracle qualifiers -- DEC-20260726-007 context; EV-GGM-001 observations 3 and 4"
    - "\"valid at all scales\" -- DEC-20260726-007 rationale item 2; H-GGM-001 interpretation_limits item 1"
    - "\"This closes all jet-based ECDLP candidates\" -- analysis.md key finding 1"
    - "\"scale-independent\" applied to a verdict from a lookup table -- EV-GGM-001 observations 3 and 4"

  # ---------------------------------------------------------------------------
  # 14. OBJECTIONS
  # ---------------------------------------------------------------------------
  blocking_objections:
    - id: BO-1
      severity: S1-blocking
      title: "classify_oracle is a lookup table keyed on the subject's name; the experiment contains no test"
      target: "experiments/EXP-GGM-001/simulability_test.py lines 106-178"
      detail: >-
        The eight verdicts are source literals selected by string equality on `name`. No
        parser, simulator constructor, overhead checker or witness generator exists, though
        specification.yaml implementation_requirements names all four. The verdicts are inputs
        to the program, not outputs of it.
      concrete_fix: >-
        A version 2 specification must REPLACE THE CLASSIFIER, not merely restate the
        definition. Either (i) implement a real decision procedure over a formal oracle grammar
        with the eight expected verdicts removed from the module's input, or (ii) abandon the
        machine-checkable framing and produce a hand-written derivation note per subject,
        archived as a proof_ref and reviewed under rule 12. Option (ii) is cheaper and more
        honest; the eight-subject table in section 5 of this report is a worked template.
    - id: BO-2
      severity: S1-blocking
      title: "The control gate cannot fail and therefore establishes nothing"
      target: "simulability_test.py lines 27-92 and 303-311; specification.yaml success_criterion and analysis_methodology.control_gate"
      detail: "See control_gate_finding CG-1 and CG-2."
      concrete_fix: >-
        Remove expected_verdict and expected_basis from the module's input entirely; hold them
        in a separate answer-key file the classifier never reads; and add the four control
        mutations RT-20260726-001 pre-registered: (P+Q)+O; () -> (a,b,p,N,k); P -> x(P) mod 2;
        P -> 0*x(P). Add at least two blind subjects authored outside the specifying session. A
        gate that cannot fail must be replaced by one that can.
    - id: BO-3
      severity: S1-blocking
      title: "The jet closure -- the archive's headline -- does not hold under any single model"
      target: "analysis.md key finding 1; EV-GGM-001 observation 3; DEC-20260726-007 rationale item 2"
      detail: "See closure_claim_finding.jet_oracle and uniform_verdict_tables.the_unsatisfiability_result."
      concrete_fix: >-
        Withdraw the jet closure. Freeze the jet oracle to exactly one reading, and
        pre-register the Weierstrass-twist invariance test as the discriminator: evaluate the
        frozen oracle on E and on its u-twist and compare eps-coefficients. That is ~20 lines
        on one 8-bit curve and settles the reading empirically.
    - id: BO-4
      severity: S1-blocking
      title: "The elliptic-net simulator is type-incorrect and does not answer the query it claims to answer"
      target: "simulability_test.py line 156; analysis.md key finding 2; EV-GGM-001 observation 5"
      detail: >-
        The stated simulator is "scalar_mult(a, P) + scalar_mult(b, Q) = W(a,b)". The left-hand
        side is a POINT on the curve; W(a,b) is an ELEMENT OF F_p. These are different objects
        and the asserted equality does not typecheck. Even granting the module's own model, its
        simulator computes aP+bQ and does not compute W(a,b), so it does not answer the frozen
        query. analysis.md line 32 repeats the error as "W(a,b) = a*P + b*Q".
      concrete_fix: >-
        Either restate the oracle as the zero-test [W(a,b) = 0], which IS a function of the
        abstract group element and is honestly simulable at Theta(log a + log b), or keep the
        field-value oracle and record NON_SIMULABLE. Also bound (a,b): the frozen text does
        not, and an unbounded range makes the oracle a free full-range zero test.
    - id: BO-5
      severity: S1-blocking
      title: "EV-GGM-001 claims proof_status derivation with no derivation artifact"
      target: "ledger/evidence/EV-GGM-001.yaml proof_status and proof_refs"
      detail: >-
        proof_refs names analysis.md and simulability_test.py. The first asserts without
        arguing; the second is a lookup table. Neither is "checkable by an independent reader
        step by step". EV-GGM-001 also carries claim_tier toy while asserting in boundaries
        item 2 that the closures are not toy-tier -- internally inconsistent.
      concrete_fix: >-
        Issue a correction record against EV-GGM-001 (it is published and must not be
        overwritten) setting strength to preliminary, proof_status to empirical_only, populating
        run_ids with the nine directories, and deleting every "closure at exponent 1/2" and
        "valid at all scales" phrase in favour of a model-and-oracle-scoped statement.
  non_blocking_objections:
    - id: NB-1
      severity: S2
      title: "witness_checkability, a frozen primary metric, is recorded in zero run artifacts"
      concrete_fix: "Pass witness_results into write_run and persist it; and make verify_witness capable of returning False."
    - id: NB-2
      severity: S2
      title: "command.txt is synthesized and is not executable as written"
      concrete_fix: >-
        Capture sys.argv at invocation rather than rebuilding a string, and give the experiment
        directory an importable module path (or invoke by file path) so the recorded command
        actually runs.
    - id: NB-3
      severity: S2
      title: "stdout.log and stderr.log are truncated to empty by the run writer"
      concrete_fix: "Tee real process output into the run directory instead of writing empty strings."
    - id: NB-4
