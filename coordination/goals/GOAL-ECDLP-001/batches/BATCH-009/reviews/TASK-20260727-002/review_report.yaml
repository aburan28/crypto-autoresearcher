      - >-
        Consequently the eight verdicts are inputs to the program, not outputs of it. The
        module's function is serialization, not classification.

    matches_prose_rationales_in_raw_result: PARTLY_AND_MISLEADINGLY
    matches_prose_rationales_detail: >-
      The rationale strings in raw-result.json are emitted verbatim from the same source
      branches, so they match trivially in provenance. They do NOT match in content: they
