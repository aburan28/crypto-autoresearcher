  named_disposition:
    disposition: >-
      reject_scoped, on EXP-ENDO-001 prediction P2 and H-ENDO-001 prediction 2,
      NARROWED to the eigenvalue multiset {1, lambda_2, lambda_3} frozen in
      inputs.curve_families[J0].eigenvalue_source at ranks r >= 3 for prime
      N >= 3 - NOT to family J0 as such, and NOT to rank as such. The instrument
      EXP-ENDO-001 v1 is withdrawn before execution on grounds G6 and G3.
    why_the_others_are_unavailable:
      weaken: >-
        UNAVAILABLE. `weaken` denotes a shift in evidential weight. The core here
        is an algebraic identity (Vieta), airtight and instance-free within its
        narrow scope, so `weaken` would UNDERSTATE it; and there is no evidence
        of any kind, so `weaken` would also imply an evidential basis that does
        not exist. Wrong on both sides at once.
      inconclusive: >-
        AVAILABLE BUT NOT REQUIRED, AND THE COORDINATOR MUST SAY WHICH READING IT
        TAKES. Under a literal reading of INT-BATCH009-R, my PARTIAL on checklist
        item 1 (D1) forces `inconclusive` for the whole batch. Under the narrow
        reading, a PARTIAL sinks only the claim that item supports - D1 and
        therefore G7 - while the P2 refutation stands on items 2 and 3, which I
        CONFIRM and which do not depend on D1 at all. I recommend the narrow
        reading and I require it to be adopted or rejected explicitly in
        DEC-20260728-004, with the reason, and never by silently rewriting the
        rule after seeing where it points. If the Coordinator takes the literal
        reading, I do not object to `inconclusive`; I object only to the choice
        being made without being recorded.
      return_the_artifacts_as_defective: >-
        UNAVAILABLE, AND I CONSIDERED IT SERIOUSLY. Three of the four claims have
        defects (D1 PARTIAL, D3 conclusion FALSE, D4 mis-promoted in G5), which is
        a poor ratio for a batch's only output. But D2's core is correct, is the
        only claim the disposition needs, and is independently checkable in two
