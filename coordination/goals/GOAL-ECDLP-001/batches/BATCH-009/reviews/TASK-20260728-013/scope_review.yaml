        lambda_i with lambda_1 = 1, including repeats. Only HEUR-1's random model
        breaks, and it breaks on short relations.
      the_consequence_the_coordinator_pre_registered: >-
        INT-BATCH009-R states: "If either [TASK-20260728-012 or -013] returns
        REFUTED or PARTIAL on checklist items 1 through 7, the disposition is
