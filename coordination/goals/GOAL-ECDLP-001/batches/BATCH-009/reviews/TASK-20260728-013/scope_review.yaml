  per_question_findings:

    Q1_is_D4_an_impossibility_claim_in_disguise:
      answer: >-
        NOT AS SCOPED IN THE DERIVATION NOTE; YES AS USED IN GROUND G5. The
        note's scope paragraph is adequate and must be carried verbatim. G5
        promotes D4 from a statement about one attack class to "the mechanism the
        contract offers is not the operative one", which is a category error
        against a box-enumeration algorithm that never constructs W_r (S3).
      concrete_alternatives_not_excluded:
        - 'Preprocessing / advice model: Corrigan-Gibbs-Kogan N^(1/3) online with N^(1/3) target-independent advice, already charged in DEC-20260727-008. Advice is built without k, so a no-k constructibility barrier says nothing there.'
        - 'Multi-target / batch DLP: Kuhn-Struik about sqrt(MN) for M targets, untouched.'
        - 'A different lattice encoding of the SAME endomorphism structure: R_r is the GLV decomposition lattice, fully constructible without k, and it is the basis of the only endomorphism speedup this campaign acknowledges. Endomorphism lattices are not a barred class; W_r is.'
        - 'Partial-information and interval settings, where the natural object is not W_r and kangaroo methods already improve the constant.'
        - 'Approximate construction: an attacker who can produce a basis of a lattice CLOSE to W_r(k) for a guessed k-range is doing candidate testing, which is the algorithm under test, not a construction barrier.'

    Q2_is_D3_over_read:
      answer: >-
        YES, in its conclusion clause. (i), (ii) and (iii) are correct and (ii) is
        stronger than stated. The conclusion "carries zero information about k" is
        refuted by the contract's own algorithm and its framing is contradicted by
        the GLV lattice being the useful object (S2).
      weakest_hypothesis_under_which_D3_fails: >-
        N COMPOSITE. A nonzero non-invertible B then recovers k modulo
        N/gcd(B, N) - partial information, not zero. Within the frozen contract N
        is prime and D3(i)-(iii) hold; EV-ENDO-001 must carry the primality
        hypothesis inside the clause.
      partial_knowledge_of_k: >-
        Does NOT break D3(ii): any two distinct candidate values of k already
        force B = 0 and A = 0. D3(ii) fails only when the attacker's uncertainty
        collapses to a single k, i.e. when the instance is already solved.
      shared_eigenvalues_across_instances: >-
        Does NOT break D3(ii) either; the joint k-independent part is still a
        product of relation lattices. But the batch-DLP baseline is untouched and
        must not be read as covered.

    Q3_is_the_withdrawal_justified_or_a_coordinator_convenience:
      answer: >-
        JUSTIFIED, BUT NOT BY THE ARGUMENT THAT LEADS. See adversarial_notes.md
        for the case against at full strength. In summary: G6 (Pareto domination
        in both time and memory at every rank, with no time-memory crossing
        point) is reviewer-originated, independent of D1-D4, corroborated by
        IDEA-20260727-005's own committed tradeoff_note, and decisive under A1 on
        its own. G3 (the `confirmed` branch unreachable from the contract's own
        ceiling arithmetic, plus S5 failing deterministically against the wrong
        |Aut|) is independent and also reviewer-originated. Either alone
        justifies not executing v1. G7 fails on its premise (S1); G5 fails as a
        mechanism claim (S3); G2/D1 is PARTIAL (S8); the (b) budget argument is
        backwards (S6). The disposition therefore survives on its second and
        third strongest grounds while its headline arguments are the defective
        ones - which is itself a finding, because a decision whose published
        reasons are wrong is not reproducible even when its outcome is right.
      the_attack_on_G7_specifically: >-
        See S1. G7's premise is false: genuine curve-backed r = 3 and r = 4 cells
        exist. G7's conclusion nonetheless holds for a different reason: any such
        cell is a Z-linear reparametrization of the r <= 2 lattice and adds no
        endomorphism content. So a two-point sweep with RC-1 and RC-3 would
        establish only what arm D already establishes with no curve: that a
        uniformly drawn index-N sublattice of Z^(2r) has index N and roughly
        attains its Minkowski bound. That is one cheap arm, not a batch.
      does_DEFER_BATCH009_002_get_promoted: >-
        NO. Its resume_condition (1) asks whether "a two-point genuine r-sweep
        with RC-1 and RC-3 would establish something the algebra does not". It
        would not. I ALSO record that the resume condition is malformed: it is
        stated against a premise (the two-point cap) that I have just shown to be
        false, so a future session could satisfy it trivially by exhibiting a
        four-point genuine sweep while establishing nothing. The condition should
        be restated against relation-freeness, not against rank.

    Q4_does_anything_here_bear_on_IDEA_20260727_005:
      answer: 'NO, not in the sense the rerank claimed. See S4.'
      detail: >-
        D3 and D4 bear on class E4 and clause C1, which IDEA-20260727-005 already
