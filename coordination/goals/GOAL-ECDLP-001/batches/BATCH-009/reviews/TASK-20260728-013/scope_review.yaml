  objections:

    - id: S1
      title: >-
        GROUND G7, THE TWO-POINT ARGUMENT, RESTS ON A FALSE PREMISE. Z-rank is
        the wrong invariant; small-relation-freeness is the right one, and
        genuine r = 3 and r = 4 cells ARE constructible on the same j = 0 curves.
      severity: blocking_for_the_stated_reasoning_not_for_the_disposition
      answers: 'launching question 2; card Q3'
      the_claim_attacked: >-
        Withdrawal ground G7 and rationale bullet 3: "Setting genuine_r_bound to
        2 for J0 leaves the genuine r-sweep with exactly TWO points, r = 1 and
        r = 2 ... This is the Coordinator's own arithmetic, not the review's."
      the_arithmetic_is_right_given_the_definition: >-
        CONFIRMED as bookkeeping. With genuine_r_bound 2 on J0, 2 on J1728 and 1
        on GEN, and arms A/B sweeping r in [1,2,3,4] and C at r = 1, the cells
        with r <= genuine_r_bound have r in {1, 2}. Two distinct rank points, a
        two-point fit with zero residual degrees of freedom, which cannot
        discriminate 2^(r+1) from any other two-parameter family. That much is
        correct and I do not dispute it.
      the_premise_is_not: >-
        The step from D1 to G7 is where it fails. D1 argues genuine_r_bound must
        equal the Z-RANK of End(E), which for an ordinary curve over a finite
        field is 2 (Deuring). But rank is not the invariant that produces the
        degeneracy D2 exhibits. What collapses the first minimum of W_r to 1 is
        the existence of an integer relation sum c_i lambda_i = 0 mod N whose
        infinity norm is at most X = ceil(N^(1/(2r))). Rank deficiency guarantees
        SOME relation exists; it says nothing about whether that relation is
        SHORT. The contract's frozen triple {1, lambda, lambda^2} is degenerate
        because its relation is (1, 1, 1), of norm 1 - not because End(E) has
        rank 2.
      the_construction_that_breaks_it: >-
        On the SAME j = 0 curve, take phi_3 = a + b*phi for integers a, b. It is
        a genuine endomorphism, it is efficiently evaluable as
        phi_3(P) = [a]P + [b]phi(P) in O(log N) group operations, and CTRL-EIGEN
        (phi_i(P) = [lambda_i]P) passes on the curve exactly as for phi. Its
        eigenvalue is lambda_3 = a + b*lambda_2 mod N. The relation vector
        (a, b, -1) then has infinity norm max(|a|,|b|), which exceeds X whenever
        a or b does. The relation lattice R_3 = {c : sum c_i lambda_i = 0 mod N}
        has determinant N in dimension 3, so its first minimum is generically
        about N^(1/3), which is the SQUARE of X = N^(1/6): a relation short
        enough to matter is a measure-zero accident, and the CM triple is exactly
        that accident. Genuine, curve-backed, eigenvalue-checkable r = 3 and
        r = 4 cells with first minimum about N^(1/(2r)) therefore exist and are
        cheap to build.
      the_reviewer_already_had_the_right_invariant: >-
        RT-20260728-001 states it twice and the derivation note did not carry it
        across. Objection B4: the list-build term shrinks "only if a
        small-coefficient Z-relation exists among the lambda_i". Required control
        RC-3: "Reject any synthetic draw admitting a nonzero integer relation
        sum c_i lambda_i = 0 mod N with max |c_i| <= X". RC-3 IS the correct
        genuine/synthetic criterion, stated by the reviewer, and D1 replaced it
        with a rank count.
      what_survives_and_what_does_not: >-
        G7's CONCLUSION survives on a repaired premise; G7's PREMISE does not. A
        rescued r = 3 cell with lambda_3 = a + b*lambda_2 is, as a lattice, the
        preimage of W_2 under an explicit integer matrix - a Z-linear
        reparametrization of the r <= 2 object, carrying no endomorphism content
        the r = 2 cell did not already carry. So the rescued sweep still measures
        a CONSTRUCTION rather than endomorphisms, which is objection B1's
        original charge arriving by a different route. The r-sweep is not
        rescuable as a measurement OF ENDOMORPHISMS at any rank above 2; it is
        rescuable as a measurement of the construction, which is what arm D
        already does with no curve at all.
      required_correction: >-
        G7 must be restated in the record, not quietly dropped. The supportable
        sentence is: "beyond r = 2 the sweep measures a Z-linear
        reparametrization of the r <= 2 lattice, whether the extra eigenvalues
        come from a curve or from a random draw, so no rank above 2 adds
        endomorphism content." The sentence actually published - that rank 2
        leaves only two genuine points - is false, and it is published as the
        Coordinator's own arithmetic, which is the strongest evidential label
        the disposition uses anywhere.
      cheapest_discriminating_control: >-
        One SVP computation in a rank-3 integer lattice of determinant N. For a
        candidate triple (1, lambda_2, lambda_3) compute the first minimum of
        R_3; if it exceeds X = ceil(N^(1/(2r))) the cell is relation-free and
        genuine under the correct criterion. No curve arithmetic, no run record,
        seconds of compute. This is RC-3 with a threshold attached, and nobody in
        this batch has run it.

    - id: S2
      title: >-
        CLAIM D3's CONCLUSION IS FALSE AS WRITTEN, AND ITS COUNTEREXAMPLE IS THE
        CAMPAIGN'S OWN ACKNOWLEDGED BEST ENDOMORPHISM SPEEDUP. D3 is not
        load-bearing for the withdrawal; it is load-bearing for the one claim
        that does not survive.
      severity: blocking_for_EV_ENDO_001
      answers: 'launching question 4; card Q2'
      what_is_correct: >-
        D3(i), D3(ii) and D3(iii) are correct and I confirm them. R_r x R_r is
        contained in W_r(k) for every k; the intersection over all k is exactly
        R_r x R_r; every vector of it has B = 0 and yields no discrete logarithm
        under CTRL-CERT. D3(ii) is in fact STRONGER than stated: any TWO distinct
        k in [1, N-1] force B = 0 and then A = 0, since N is prime, so the
        argument does not need k = 1 and k = 2 specifically and does not need
        N >= 3 as a separate hypothesis beyond N >= 3 for two distinct nonzero
        residues to exist.
      what_is_false: >-
        The CONCLUSION clause: "Every vector of W_r that an attacker can write
        down without already knowing k lies in R_r x R_r and carries zero
        information about k." That is refuted by the algorithm the contract
        itself specifies. An attacker writes down any (a, b) with B(b)
        invertible - no knowledge of k required - computes the candidate
        k* = -A/B mod N, and tests [k*]P = Q. That vector was written without
        knowing k and it decides one candidate for k; the whole meet-in-the-
        middle is a procedure for writing such vectors. The word "constructible"
        equivocates between CONSTRUCTIBLE-WITH-A-GUARANTEE (must lie in the
        k-independent intersection, hence useless) and CONSTRUCTIBLE-AND-TESTABLE
        (the actual attack model, in which every enumerated vector is
        information-bearing).
      the_concrete_counterexample: >-
        R_2 = {(c_1, c_2) in Z^2 : c_1 + c_2*lambda = 0 mod N} IS THE GLV
        DECOMPOSITION LATTICE. Its short vectors, of norm about sqrt(N), are
        exactly what Gallant-Lambert-Vanstone use to split a scalar as
        k_1 + k_2*lambda with k_1, k_2 about sqrt(N), and they are the same
        structure underlying the automorphism-quotient rho walk at
        0.886 sqrt(N/|Aut|) that this batch repeatedly names as the known correct
        way endomorphisms help. So the sublattice D3 calls information-free and
        useless is, in the published literature, the useful one. The narrow
        statement (a witness with B = 0 does not determine k) is true; the
        framing built on it - "the constructible part is useless in both cases" -
        is contradicted by the campaign's own baseline.
      weakest_hypothesis_under_which_D3_fails_outright: >-
        N COMPOSITE. D3(iii) rests on the dichotomy "B invertible mod N, or
        nothing to recover". Over a composite modulus a nonzero non-invertible B
        recovers k modulo N/gcd(B, N) - that is Pohlig-Hellman, and it is partial
        information, not zero. The frozen contract assumes prime N, so D3 holds
        within scope, but EV-ENDO-001 must carry "N prime" INSIDE the D3 clause
        or the clause is false as a general statement. A second, milder failure:
        if several instances share the same eigenvalues, the joint
        k-independent part is still the product of relation lattices, so D3(ii)
        survives - but the batch-DLP baseline (Kuhn-Struik, sqrt(MN) for M
        targets) is untouched by D3 and must not be read as covered.
      load_bearing_analysis: >-
        D3 appears in NONE of the seven withdrawal grounds G1-G7. G5 cites D4
        only. D3 is load-bearing for exactly one thing: rationale bullet 5, the
        claim that "D3 and D4 bear on [IDEA-20260727-005's classification
        barrier] differently and more directly" - which is the surviving residue
        of the batch-opening rerank rationale, and which objection S4 below
        shows does not survive. So the answer to the launching question is:
        D3 IS NOT LOAD-BEARING FOR THE WITHDRAWAL, AND THE WITHDRAWAL DOES NOT
        FALL WITH IT. It is load-bearing only for the one claim that fails on
        other grounds. A decision resting on D3 would be resting on an unchecked
        claim of its own author; the disposition, to its credit, does not.
      second_defect_in_D3: >-
        D3's "why this matters" paragraph asserts that generically R_r "has
        determinant N in dimension r and its first minimum is around N^(1/r)".
        That is the Gaussian-heuristic random-lattice model - HEUR-1 - invoked
        inside a note whose headline result is that HEUR-1 fails on this very
        family of lattices. Using the falsified model as an unlabelled premise in
        the refutation of that model is a methodological defect. The paragraph
        must be labelled heuristic, not derivation. (I note it cuts in my favour
        for S1 and I still object to it: an argument I benefit from is not
        thereby derived.)
      required_correction: >-
        Delete the conclusion clause. The supportable statement is: "The
        k-independent sublattice of W_r is exactly R_r x R_r, and every vector of
        it is certificate-void under CTRL-CERT for prime N." Nothing about
        information, nothing about what an attacker can or cannot write down,
        nothing about usefulness.

    - id: S3
      title: >-
        GROUND G5 / CLAIM D4 IS A CATEGORY ERROR AGAINST THE ALGORITHM ACTUALLY
        SPECIFIED. The contract never constructs W_r, so non-constructibility
        cannot be "the operative mechanism" for anything the contract measures.
      severity: blocking_for_EV_ENDO_001
      answers: 'card Q1'
      argument: >-
        D4 and G5 say the contract's STEP 5 dichotomy omits the operative
        explanation, which is that W_r is not attacker-constructible. But STEP 5's
        dichotomy is about a MEASURED COST CURVE: "if rho(r) falls with r then
        either the determinant is not pinned or the balanced split is not the
        best decomposition". The specified algorithm is a meet-in-the-middle over
        two boxes of coefficient vectors, evaluating group elements and hashing
        them. It never computes a basis of W_r, never reduces one, and never
        needs k to run - the driver KNOWS k, by the contract's own
        subgroup_requirement, precisely so no discrete logarithm is solved to set
        up an instance. Non-constructibility therefore cannot explain, and cannot
        fail to explain, a measured rho(r). D4 answers a question about basis
        reduction; STEP 5 asks a question about box enumeration. The two are not
        in contact.
      what_D4_does_establish: >-
        A correct and narrow statement about a DIFFERENT algorithm: for the class
        of attacks that construct a basis of W_r(k) and then reduce it, the
        construction step already requires k, and LLL in dimension 4 on a
        determinant-N lattice plus k = -A/B would solve the instance. That is
        true, it is worth recording, and it is essentially Lemma 1 and Lemma 2 of
        IDEA-20260727-005 restated with the constructibility observation added.
      is_D4_an_impossibility_claim_in_disguise: >-
        NOT AS SCOPED IN THE NOTE, WHICH IS ADEQUATE - but the scope paragraph
        does NOT exclude four readings a later record could take, and they must
        be named rather than assumed away.
        (1) PREPROCESSING / ADVICE MODEL. Corrigan-Gibbs-Kogan gives N^(1/3)
        online time with N^(1/3) target-independent advice, already charged in
        DEC-20260727-008. The advice is built without any target k, so
        "non-constructibility without k" says nothing there. D4 must not be read
        as covering the preprocessing model.
        (2) MULTI-TARGET / BATCH. Kuhn-Struik solves M targets in about
        sqrt(MN). D4 is single-target and does not touch it.
        (3) A DIFFERENT LATTICE ENCODING OF THE SAME STRUCTURE. R_r itself - the
        GLV lattice - is fully constructible without k and is the basis of the
        only endomorphism speedup anyone claims. So "endomorphism lattices an
        attacker can write down" are not a barred class; W_r specifically is.
        (4) PARTIAL-INFORMATION AND INTERVAL SETTINGS. If k is known to lie in a
        short interval or a coset, the object to be searched changes and the
        W_r parametrization is not the natural one; kangaroo methods already beat
        the generic bound there in the constant.
        The note's scope paragraph confines D4 to "attacks that construct and
        then reduce W_r AS DEFINED IN EXP-ENDO-001 STEP 1", which is correct and
        sufficient IF it is carried verbatim into EV-ENDO-001. It is not
        sufficient as currently used in ground G5, where D4 is promoted from a
        statement about one attack class to "the mechanism the contract offers is
        not the operative one".
      required_correction: >-
        Narrow G5 to: "STEP 5's dichotomy is incomplete as a statement about what
        protects the instance, though not about what the contract measures." Do
        not assert that D4 supplies the operative mechanism for the cost curve.

    - id: S4
      title: >-
        THE ROADMAP CLAIM DOES NOT SURVIVE, AND THE BATCH-OPENING RERANK MUST BE
        CORRECTED IN THE RECORD RATHER THAN QUIETLY DROPPED.
      severity: blocking_for_EV_ENDO_001
      answers: 'card Q4'
      argument: >-
        Rationale bullet 5 keeps a weakened form of the rerank justification
        alive by claiming D3 and D4 bear on IDEA-20260727-005's classification
        barrier "differently and more directly". Read against the committed
        proposal, they do not. IDEA-20260727-005 already contains, at
        proof_status rigorous: Lemma 1 (scalar rigidity), Lemma 2 (index N and
        determinant N for every r), Lemma 3 (Minkowski shrinkage), Lemma 4 (MITM
        at Theta(2^r sqrt N) time AND memory), and in target_complexity a
        tradeoff_note stating in terms that "the augmented lattice is not merely
        neutral but Pareto-dominated" and sits at the S = T = N^(1/2) corner of
        the van Oorschot-Wiener curve, strictly dominated by parallel rho. D3 and
        D4 bear on class E4 and on C1 - the part the proposal itself already
        marks rigorous. The load-bearing, contested part of the barrier is C2,
        the COMPLETENESS of the E1/E2/E3 classification of exit maps, and nothing
        in D1-D4 touches it.
      the_sharper_finding: >-
        THE PARETO-DOMINATION THAT KILLED THE EXPERIMENT WAS ALREADY IN THE
        COMMITTED PROPOSAL THAT SPAWNED IT. Ground G6 cites RT-20260728-001's
        baseline comparison as the reason no amendment could produce a
        target-class outcome. IDEA-20260727-005's tradeoff_note recorded the same
        conclusion before the contract was frozen. The batch outranked a
        COMMITTED action (EXP-STR-004) partly on a gating claim that its own
        source record contradicted. That is a Coordinator error of exactly the
        class DEFER-BATCH009-003 is meant to catch, and DEFER-BATCH009-003 as
        drafted would NOT have caught it: a criterion-feasibility table checks
        thresholds against cells, not a design against the baseline recorded in
        its own proposal.
      required_correction: >-
        EV-ENDO-001 and DEC-20260728-004 must state plainly that the batch-
        opening rerank rationale was wrong on the gating claim (N3 confirmed),
        that the Pareto-domination ground was available in IDEA-20260727-005
        before the freeze, and that D3/D4 do not restore the gating claim in any
        form. DEFER-BATCH009-003 should be extended with one line: every frozen
        contract states its algorithm's position against Pollard rho, BSGS and
        the closest specialized baseline in time AND memory, before freezing.

    - id: S5
      title: >-
        THE INT-BATCH009-S SELF-DIAGNOSIS IS HONEST IN ITS COUNT AND OPTIMISTIC
        IN ITS DIAGNOSIS. "Mostly selection bias" fits at most one of the three
        batches, and the campaign's own record contains the discriminating
        counter-evidence.
      severity: blocking_for_the_batch_conclusion_narrative
      answers: 'launching question 3'
      the_count_is_verified_true: >-
        Checked against Git and the queues, not taken on trust. BATCH-006:
        executor TASK-20260727-005 CANCELLED, no runs. BATCH-007: EXECUTED -
        commit c79e3a8d, "TASK-20260727-022 snapshot: EXP-STR-003 run package",
        20 committed runs under experiments/EXP-STR-003/runs, 120 tracked files,
        132.6 s of a declared 5400 s. BATCH-008: executor TASK-20260727-028
        never dispatched, no runs. BATCH-009: executor TASK-20260728-005
        CANCELLED, no runs. So THREE OF THE LAST FOUR BATCHES MEASURED NOTHING is
        literally correct, and stating it plainly rather than as efficiency is to
        the Coordinator's credit.
      but_the_denominator_is_contaminated: >-
        BATCH-008's own opening objective declares it "a bounded LEDGER-INTEGRITY
        repair" that "contains no research work of any kind" - a YAML quoting fix
        for two unparseable specifications. It had no experiment to execute.
        Counting it in a review-versus-execution signal inflates the numerator
        with a category error. The honest research denominator is three:
        BATCH-006, BATCH-007, BATCH-009, of which one executed.
      and_the_mechanism_differs_per_case: >-
        The selection-bias story is "for quantities that are DETERMINED rather
        than sampled, paper analysis beats a run by construction". Test it case
        by case.
        BATCH-009: FITS. Vieta on a monic quadratic and a ceiling formula are
        determined quantities. Paper genuinely beat the run here.
        BATCH-006: DOES NOT FIT. EXP-IC-002 went REVISE -> versioned v2 amendment
        -> independent re-review -> never executed. Nothing about a determined
        quantity ended it; it died of process attrition. The disposition's own
        description of the defect - "a stopping rule halted the primary arm at
        instance 1 of 34" - is a defect that only a RUN could have exhibited.
        BATCH-008: NOT APPLICABLE, per above.
        So the story fits one of three, not "mostly". The correct weighting is
        one determined-quantity pre-emption, one process attrition, one
        non-research batch.
      the_discriminating_counter_evidence_already_exists: >-
        THE ONE BATCH IN FOUR THAT EXECUTED PRODUCED A RUN THAT FALSIFIED A
        PAPER-LEVEL ADJUDICATION. In BATCH-007, red-team observation OBS-1 /
        RT-OBJ-1 - that a phi-free construction beats the phi-invariant factor
        base at every headline B - was adjudicated YES by TASK-20260727-017 on
        unarchived scratchpad probes. The executed EXP-STR-003 package returned
        F1 FIRES at two of four instances: "The red team's central argument ...
        does NOT reproduce. Those numbers came from an unarchived scratchpad
        script; 14 of 16 alpha cells reproduced, arm E did not at two of four
        instances." The pre-fixed consequence was that OBS-1 had to be withdrawn
        or rescoped and DEC-20260727-009 could not rest on it. So the campaign's
        base rate of executed batches overturning a paper-level adjudication is
        1 of 1. That is n = 1 and I do not over-read it, but it is direct
        evidence against "paper beats a run by construction" as a general
        posture, and the disposition does not mention it while arguing exactly
        that posture from a two-case sample.
      verdict: >-
        HONEST BUT INCOMPLETE, AND THE INCOMPLETENESS IS SELF-SERVING IN
        DIRECTION. Part 3, the dangerous-misreading paragraph, is the most
        credible thing in the disposition and I endorse it without reservation.
        Part 1's weighting is wrong. Part 2's identified defect is real, and its
        proposed fix (a criterion-feasibility table) is cheap, correct and
        insufficient - see S4.
      the_empirical_discriminator_the_launching_task_asked_for: >-
        Pre-classify, in every future frozen contract, each decisive pre-
        registered quantity as DETERMINED (a closed-form function of the declared
        parameters, evaluable without drawing an instance) or SAMPLED (requires
        drawn instances). The two hypotheses then make different predictions.
        SELECTION BIAS predicts: review pre-empts DETERMINED-quantity contracts
        and SAMPLED-quantity contracts execute. STOPPED HARNESS predicts:
        non-execution regardless of quantity type, for budget, scope or attrition
        reasons. One additional data point decides it: if a contract whose
        decisive quantities are all SAMPLED also fails to execute, selection bias
        is falsified on its own terms. EXP-STR-004 is exactly such a contract -
        its arms A-prime and E-prime produce measured alpha counts across drawn
        instances - so BATCH-010 IS THE EXPERIMENT THAT DECIDES THIS QUESTION,
        and it decides it for free. The classification costs nothing beyond the
        table DEFER-BATCH009-003 already requires.

    - id: S6
      title: >-
        THE (b)-LOSES-ON-SCOPE ARGUMENT CONTAINS A BACKWARDS BUDGET CLAIM, AND
        THE TARGET-CLASS CRITERION THAT KILLED (a) ALSO KILLS THE RECOMMENDED
        BATCH-010 OPENING.
      severity: non_blocking_but_must_be_corrected_in_the_record
      answers: 'launching questions 1 and 6'
      the_backwards_claim: >-
        The disposition says option (b) loses partly because "the 7200-second
        Executor budget it would need was allocated to the contract now being
        withdrawn". Withdrawing the contract RELEASES that allocation - the
        amendment's own commit message records "Executor compute allocation
        7200 -> 0 s" and INT-BATCH009-S records the batch budget falling from
