  required_controls:
    - id: RC-6
      title: 'RELATION-FREENESS SCREEN WITH A THRESHOLD - the cheapest discriminating control in this report'
      description: >-
        For any candidate eigenvalue tuple (1, lambda_2, ..., lambda_r), compute
        the first minimum of the relation lattice R_r = {c : sum c_i lambda_i = 0
        mod N} and compare it with X = ceil(N^(1/(2r))). The cell is genuine iff
        no relation of infinity norm <= X exists. This replaces genuine_r_bound
        as a rank count with the invariant that actually governs the phenomenon,
        it decides S1 either way in seconds, and it is RT-20260728-001's RC-3 with
        the missing threshold supplied. Nobody in this batch has run it.
    - id: RC-7
      title: 'BASELINE-POSITION STATEMENT INSIDE EVERY FROZEN CONTRACT'
      description: >-
        Extend DEFER-BATCH009-003 by one line: before freezing, every contract
        states its algorithm's position against Pollard rho, BSGS and the closest
        specialized baseline, in TIME AND MEMORY, at the declared sizes. The
        criterion-feasibility table would not have caught this batch's opening
        error; this would have, and the answer was already sitting in
        IDEA-20260727-005's tradeoff_note.
    - id: RC-8
      title: 'DETERMINED-VERSUS-SAMPLED PRE-CLASSIFICATION OF EVERY DECISIVE QUANTITY'
      description: >-
        In the same table, label each decisive pre-registered quantity DETERMINED
        or SAMPLED. This is the free instrument that decides the INT-BATCH009-S
        question empirically rather than by narrative (S5), and it makes
        BATCH-010 the deciding data point at no extra cost.
    - id: RC-9
      title: 'EXECUTION GATE ON BATCH-010'
      description: >-
        Pre-register that BATCH-010 may not close without at least one committed
        run record carrying a manifest, and that a REVISE on its contract permits
        AT MOST ONE amendment cycle, after which the batch either executes the
        reduced-scope core or records the non-execution as a BATCH FAILURE rather
        than as a result. Without a gate, "the next batch must execute" is an
        intention, and BATCH-006 shows what happens to intentions on this route.

  counterexample_or_mutation: >-
    TWO, both cheap and both decisive against a published clause of this batch.
    (1) AGAINST G7's PREMISE AND THE FAMILY-LEVEL P2 CLAUSE: on the same j = 0
    curve, replace phi_3 = phi^2 by phi_3 = a + b*phi. It is a genuine
    endomorphism, evaluable as [a]P + [b]phi(P) in O(log N) operations, and
    CTRL-EIGEN passes. Its eigenvalue is lambda_3 = a + b*lambda_2 mod N and the
    relation vector (a, b, -1) has norm max(|a|,|b|). The relation lattice R_3 has
    determinant N in dimension 3, so a relation of norm <= X = N^(1/6) is a
    measure-zero accident and the CM triple {1, lambda, lambda^2} is precisely
    that accident. Genuine r = 3 and r = 4 cells with first minimum about
    N^(1/(2r)) therefore exist, and "genuine_r_bound 2 leaves two points" is
    false.
    (2) AGAINST D3's CONCLUSION: R_2 = {(c_1, c_2) : c_1 + c_2*lambda = 0 mod N}
    IS the GLV decomposition lattice. Its short vectors of norm about sqrt(N)
    are what Gallant-Lambert-Vanstone use to split k = k_1 + k_2*lambda, and the
    same structure underlies the automorphism-quotient rho walk this batch names
    as the known correct way endomorphisms help. The sublattice D3 calls
    information-free and useless is the useful one in the literature.

  baseline_comparison:
    pollard_rho_negation: 'about 0.886 sqrt(N/2) group operations, O(w) memory, linear parallel speedup via van Oorschot-Wiener distinguished points.'
    pollard_rho_automorphism_quotient: 'about 0.886 sqrt(N/|Aut|); at most sqrt(6) = 2.449x better than plain rho at j = 0, degraded in practice by fruitless cycles. The closest specialized baseline, and outside target class under A1.'
    bsgs: 'about 1.5-2 sqrt(N) operations, sqrt(N) memory.'
    the_withdrawn_algorithm: 'derived 2 (2 ceil(N^(1/(2r))) + 1)^r operations, about 2^(r+1) sqrt(N) time with 2^r sqrt(N) memory.'
    van_oorschot_wiener_interpolation: >-
      CONCURRED WITH RT-20260728-001 AND RESTATED: shrinking the stored list to w
      forces the join to scan about N/w, the classical Shanks tradeoff line,
      strictly worse than rho's sqrt(N)/m parallel line for every w < sqrt(N).
      There is no time-memory point at which the algorithm under test wins, so no
      interpolation rescues it. IDEA-20260727-005's own target_complexity
      recorded this before the contract was frozen: the E4 MITM "sits at the
      S = T = N^(1/2) corner of the van Oorschot-Wiener curve" and increasing r
      "moves the point up and to the right".
    verdict: >-
      The withdrawn instrument is Pareto-dominated in both time and memory at
      every rank including r = 1. This is the one ground of the withdrawal that
      needs no repair, and it is sufficient by itself. It is also the ground that
      should have prevented the batch from opening on this experiment.

  heuristic_challenges:
    - >-
      HEUR-1's random-lattice transfer is invoked INSIDE the note that refutes it.
      D3's "why this matters" paragraph asserts R_r generically has first minimum
      about N^(1/r) on the Gaussian heuristic. That is HEUR-1 in the same lattice
      family where D2 has just shown HEUR-1 fails. Label it heuristic; do not use
      it as a premise.
    - >-
