    - id: S7
      title: >-
        THE PROPOSED reject_scoped CLAUSE IS BROADER THAN THE ALGEBRA SUPPORTS.
        The refutation is of a specific EIGENVALUE TRIPLE, not of a curve family
        at a rank.
      severity: blocking_for_EV_ENDO_001
      answers: 'card Q5'
      argument: >-
        Every formulation in the batch reads "on family J0 at every r >= 3 the
        first minimum of W_r is exactly 1, for every N and every k". By S1 that
        is FALSE as a statement about the FAMILY: on the same j = 0 curve, with
        lambda_3 = a + b*lambda_2 for generic (a, b), no norm-1 vector exists and
        the first minimum is about N^(1/6). What is true - and it is airtight, by
        Vieta alone, with no instance needed - is the statement about the
        contract's FROZEN eigenvalue_source. The permitted clause is: "For the
        eigenvalue multiset {1, lambda_2, lambda_3} with lambda_2, lambda_3 the
        two roots of L^2 + L + 1 = 0 mod N, as frozen in
        inputs.curve_families[J0].eigenvalue_source, one has
        1 + lambda_2 + lambda_3 = 0 mod N identically, so (1,1,1,0,...,0) lies in
        W_r for every r >= 3 and every k, and the infinity-norm first minimum is
        exactly 1." Prediction P2 is refuted ON THOSE CELLS AS FROZEN. The
        family-level and rank-level phrasing must not be used.
      why_this_matters_beyond_pedantry: >-
        This is the same failure mode the launching task names: DEC-20260726-006
        wrote a support verdict wider than its artifacts and DEC-20260727-009 had
        to weaken it. A negative written wider than its algebra is the same
        error with the sign flipped, and it is harder to catch because negatives
        feel safe.

    - id: S8
      title: >-
        D1 IS A DESIGN CONVENTION PRESENTED AS A DERIVATION, AND UNDER THE
        COORDINATOR'S OWN PRE-REGISTERED RULE THAT HAS A CONSEQUENCE.
      severity: procedural
      argument: >-
        refutation_claims.yaml gives D1 `basis: derivation` and asserts "the
        frozen value genuine_r_bound 3 is wrong". The rank-2 fact about End(E) is
