    THE WITHDRAWAL RULING SURVIVES, ON TWO OF ITS SEVEN GROUNDS AND NOT ON THE
    ONES IT LEADS WITH. Option (c) is the right disposition, but the reasoning
    published for it is defective in four places, and the batch's scope claims
