      the_reconciliation_that_should_be_recorded: >-
        Target-class is NOT the operative criterion for BATCH-010. Two other
        criteria are, and they are sufficient: (i) EXP-STR-004 discharges a
        MANDATORY replication obligation that DEFER-BATCH009-001 itself makes
