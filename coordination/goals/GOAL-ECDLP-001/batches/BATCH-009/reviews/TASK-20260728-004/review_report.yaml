    EXP-ENDO-001 as frozen at a6b5ca60 can discriminate P1 (index pinning),
    P2 (Minkowski shrinkage) and P3 (cost neutrality with a 2^r constant) on the
    witness lattice W_r, with shrinkage-without-cost-reduction as the falsifiable
    signature and F1 as a reachable negative.
