    - 'total expected cost = per-pass cost x inverse success probability is not written down; no criterion records the box inflation actually needed.'
    - 'memory is quantified but its comparison target (rho''s stored entries) is a free parameter, making F6 undecidable.'
    - 'no van Oorschot-Wiener time-memory interpolation is stated.'
    - 'budget feasibility depends on a per-entry cost convention that appears only in prose.'
  reduction_and_scope_challenges:
    - 'no published reduction is invoked; none is at risk.'
    - 'the claimed gating of IDEA-20260727-005''s classification barrier is scope inflation: the design fixes the eigenvalues by fiat and cannot test which maps are efficiently computable.'
    - 'toy-tier ceiling is correctly enforced; no scheme scope is claimed, correctly.'
