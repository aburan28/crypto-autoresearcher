  # ------------------------------------------- checklist items 1-7, re-derived
  checklist_results:

    - item: 1
      claim: D1
      question: >-
        End(E) for j = 0, p = 1 mod 3 is an order in Q(zeta_3), rank 2 over Z,
        and phi^2 + phi + 1 = 0. Does genuine_r_bound: 3 survive?
      answer: PARTIAL
      mathematics: CONFIRMED
      normative_conclusion: NOT SUSTAINED AS WRITTEN
      my_derivation: >-
        Hypotheses, stated exactly. Let p > 3 be prime with p = 1 mod 3 and let
        E: y^2 = x^3 + b over F_p. (a) p = 1 mod 3 puts a primitive cube root of
        unity zeta_3 in F_p, so phi(x, y) = (zeta_3 x, y) is an F_p-rational
        automorphism of E of order 3. (b) ORDINARITY IS AUTOMATIC HERE: a curve
        y^2 = x^3 + b over F_p (p > 3) is supersingular exactly when
        p = 2 mod 3; equivalently, disc -3 gives an ordinary reduction exactly
        when p splits in Q(sqrt(-3)), which is p = 1 mod 3. So the note's
        ordinarity hypothesis holds and does not need to be assumed separately.
        Verified on my instance: trace = p + 1 - #E = 65509, nonzero and not
        divisible by p. (c) With ordinarity, End(E) is an order in the imaginary
        quadratic field Q(zeta_3) and is a Z-module of rank 2 - D1's stated
        justification, confirmed.
        STRENGTHENING THE NOTE DOES NOT MAKE. The rank-2 conclusion does not
        actually need ordinarity. End(E) is a domain in every case - an order in
        an imaginary quadratic field when E is ordinary, an order in a definite
        quaternion algebra when E is supersingular, and both are torsion-free
        domains. From phi^3 = 1 and phi != 1, (phi - 1)(phi^2 + phi + 1) = 0
        forces phi^2 + phi + 1 = 0. And phi is not an integer, since no m in Z
        satisfies m^2 + m + 1 = 0. Hence Z<1, phi, phi^2> = Z[phi] has rank
        EXACTLY 2 whether or not E is ordinary. D1's conclusion is therefore
        more robust than its stated hypotheses, which is worth recording.
      why_this_is_only_PARTIAL: >-
        "Does genuine_r_bound: 3 survive?" is a question about a DEFINITION, and
        the contract supplies one. Its synthetic_rank_rule defines a cell as
        SYNTHETIC when "the extra eigenvalues ... correspond to NO efficiently
        computable map". Under that definition genuine_r_bound is the largest r
        for which every lambda_i is realized by an efficiently computable map.
        On J0 there are exactly three such distinct scalars - 1, lambda,
        lambda^2, realized by 1, phi, phi^2 - so on the contract's OWN
        definition the value 3 is internally correct. What does not survive is
        the PREDICTION attached to it: STEP 3 of the contract and prediction 2
        of H-ENDO-001 tacitly require the r coordinates to be Z-independent, and
        at r = 3 on J0 they are not. So D1's mathematics is right and its
        normative sentence "the frozen value genuine_r_bound 3 is wrong" is
        right only under a Z-rank reading of "genuine" that the contract does
        not use. The defect is definitional, not a mis-set numeral: the contract
        never says which of the two notions "genuine" denotes, and - see the
        adjudication below - it silently uses a different one for each CM family.

    - item: 2
      claim: D2
      question: 'Vieta on L^2 + L + 1 mod N: is lambda_1 + lambda_2 + lambda_3 = 0 identically?'
      answer: CONFIRMED
      my_derivation: >-
        N prime, so Z/N is a FIELD - this is the load-bearing hypothesis, since
        over a ring with zero divisors a monic quadratic can have more than two
        roots and Vieta does not apply. If L^2 + L + 1 has a root in Z/N it
        splits completely, L^2 + L + 1 = (L - lambda_2)(L - lambda_3), and
        comparing coefficients gives lambda_2 + lambda_3 = -1 and
        lambda_2 lambda_3 = 1. With lambda_1 = 1, the sum is 1 + (-1) = 0 mod N.
        Identically in N, and with no computation.
        HYPOTHESIS THE NOTE LEAVES IMPLICIT, and which I checked rather than
        assumed: the roots must EXIST, i.e. N = 1 mod 3 (or N = 3, where
        L^2 + L + 1 = (L - 1)^2 and lambda_2 = lambda_3 = 1, whence
        1 + 1 + 1 = 3 = 0 mod 3 - the conclusion survives the degenerate case).
        For N > 3 with N = 2 mod 3 the roots do not exist and the J0
        construction cannot be instantiated at r >= 2 at all. That case cannot
        arise: phi acts on the prime-order group G = <P> as a scalar lambda with
        lambda^3 = 1, and lambda = 1 would mean (phi - 1) kills G, so
        N | deg(phi - 1) = Norm(zeta_3 - 1) = 3, i.e. N = 3. Hence for every
        prime N > 3 in scope lambda has order 3 in (Z/N)*, forcing 3 | N - 1.
        The note's "for every prime N >= 3" is therefore true but under-stated;
        the missing hypothesis is forced, not free.
      numeric_confirmation: >-
        N = 613557433, lambda_2 = 290635917, lambda_3 = 322921515;
        lambda_2 + lambda_3 = 613557432 = N - 1 = -1 mod N; lambda_2 lambda_3 = 1
        mod N; lambda_1 + lambda_2 + lambda_3 = 0 mod N. Both roots verified to
        satisfy L^3 = 1 and L != 1.

    - item: 3
      claim: D2
      question: >-
        Is (1,1,1,0,0,0) in W_3(k) for every k, and is the infinity-norm first
        minimum therefore exactly 1?
      answer: CONFIRMED
      my_derivation: >-
        Write w = (a | b) with a = (1,1,1,0,...,0), b = 0. Then
        A(a) = lambda_1 + lambda_2 + lambda_3 = 0 mod N by item 2 and B(b) = 0,
        so A(a) + k B(b) = 0 mod N for EVERY k in [1, N-1] - k never enters the
        expression. So w is in W_r(k) for every r >= 3 and every k. It is a
        nonzero integer vector of infinity norm 1, and 1 is the least possible
        infinity norm of a nonzero integer vector, so
        lambda_1^inf(W_r(k)) = 1 EXACTLY. It follows that
        log_N(lambda_1^inf) = 0 identically, against a predicted 1/(2r) - 1/6 at
        r = 3 and 1/8 at r = 4. Prediction 2 of H-ENDO-001 and STEP 3's
        attainment reading are false on family J0 at r >= 3.
        WHAT IS NOT REFUTED, stated so the note is not over-read: Minkowski's
        inequality itself is untouched. STEP 3 proves an UPPER bound
        lambda_1^inf <= ceil(N^(1/(2r))), and 1 <= 30 holds. What fails is the
        ATTAINMENT assumption that turns that upper bound into a predicted
        regression slope of 1. The note is correct about this (it routes the
        consequence through F3, "the Minkowski minimum is not being attained");
        the refutation_claims.yaml phrasing "predict a first minimum of about
        N^(1/(2r))" is the accurate one and should be the one carried forward.
        Two further norm-1 vectors exist and were computed, not assumed:
        (0,0,0,1,1,1) and (1,1,1,1,1,1) are also in W_3(k) for every k.
      numeric_confirmation: >-
        See instantiation.json. u3 . (1,1,1,0,0,0) = 0 mod N; the vector lies in
        the HNF lattice; its infinity norm is 1; N^(1/6) = 29.150267 (ceiling
        30). Over the contract's own frozen field sizes (16 to 28 bits, N >=
        2^(field_bits - 4)) the predicted value ranges from about 4.8 to about
        25 while the true value is 1 at every one of them. The on-curve form of
        the same relation, P + phi(P) + phi^2(P) = O, was replayed on the curve
        and returned the point at infinity - this is the CTRL-CERT replay of the
        witness, and it passes with B = 0, i.e. it certifies a true relation
        that yields no discrete logarithm.
      consequence_check_PARTIAL:
        finding: >-
          D2 consequence 1 - "the 40 J0 cells at r in {3,4} enter the S2
          regression at y = 0 and are NOT removed by the exact-enumeration
          restriction" - is CONVENTION-DEPENDENT, not forced, and under
          H-ENDO-001's own stated rule it is FALSE.
        argument: >-
          H-ENDO-001 test_boundary.parameters pins
          `first_minimum_method: exact enumeration in dimension at most 4, LLL
          upper bound otherwise`. dim W_r = 2r, so r = 3 (dim 6) and r = 4
          (dim 8) are LLL cells under the hypothesis record's own rule. The
          contract's invalidation_rules then say "The S2 fit runs on
          exact-enumeration cells only, and the LLL cells are reported beside
          it." Under that reading the 40 cells are EXCLUDED from the S2 fit, and
          the note's stated route to F3 does not run as written. The contract's
          metric definition ("with the method recorded as exact_enumeration or
          lll_upper_bound") leaves the choice to the driver, and the note
          resolves that ambiguity in the direction that maximises the
          consequence without saying it is doing so.
        what_is_unaffected: >-
          The degeneracy itself. Whichever method a driver used, the recorded
          value is log_N(1) = 0: I ran LLL on W_3 and its reduced basis contains
          the norm-1 vectors (-1,-1,-1,0,0,0) and (0,0,0,-1,-1,-1) directly, so
          the LLL upper bound equals the exact minimum here. HEUR-1 and HEUR-2
          break at these cells either way (below). Only the specific claim that
          the cells enter the S2 REGRESSION is convention-dependent.
        arithmetic_check: >-
          The cell count 40 is right: arm A is 4 field sizes x 5 seeds x 4 ranks
          = 80 cells, of which ranks 3 and 4 are 40.
      precision_defect: >-
        Both artifacts describe the affected region as "cells the contract
        labels GENUINE" for r >= 3. The contract labels the J0 r = 4 cells
        SYNTHETIC ("of which the r = 4 cells are synthetic"). Only r = 3 is
        genuine. Half the affected cells are synthetic and the sentence should
        say so.
      heuristics_check:
        HEUR-1: >-
          CONFIRMED FALSE at these cells, and for a sharper reason than the note
          gives. W_r at J0, r >= 3 contains the deterministic rank-2 family
          {(t,t,t,0,..,0)} + {(0,..,0,u,u,u,0,..,0)}, so the box of side cX
          contains at least about (2cX+1)^2 witnesses with certainty. At r = 3,
          c = 1, X = 30 that is about 3721 forced witnesses against a Poisson
          mean of (2X+1)^6/N which is about 64. The count is not Poisson and is
          not random.
        HEUR-2: >-
          Worth recording because the note does not: HEUR-2 is SELF-DEFEATING at
          these cells rather than simply false. Its hypothesis explicitly
          excludes "the algebraic relations forced by the endomorphism ring" -
          and 1 + lambda_2 + lambda_3 = 0 is exactly such a relation - yet its
          conclusion ("so the first minimum attains the Minkowski bound") is
          asserted unconditionally. The carve-out and the conclusion cannot both
          stand at J0, r >= 3.

    - item: 4
      claim: D2
      question: 'Instantiate numerically on a real j = 0 curve with a prime-order subgroup.'
      answer: CONFIRMED - PRODUCED
      certificate_level_reached: >-
        YES. D2 reaches LEVEL 1, COUNTEREXAMPLE CERTIFICATE, under
