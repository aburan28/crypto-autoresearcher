    - item: 5
      claim: D3
      question: 'Is intersection_k W_r(k) = R_r x R_r exactly, by the k = 1, 2 argument? Is the index bookkeeping N, N^2, N right?'
      answer: CONFIRMED
      my_derivation: >-
        (i) If A(a) = 0 and B(b) = 0 then A(a) + k B(b) = 0 for every k, so
        R_r x R_r is contained in W_r(k) for every k. (ii) Suppose (a, b) lies in
        W_r(1) and in W_r(2), which requires only N >= 3 so that both values are
        in [1, N-1]. Then A + B = 0 and A + 2B = 0 mod N; subtracting gives
        B = 0 and then A = 0. So the intersection over all k is contained in
        R_r x R_r, and with (i) equals it.
        STRENGTHENING: any two DISTINCT values k != k' suffice, since
        (k - k') B = 0 and k - k' is invertible mod the prime N. For the specific
        pair (1, 2) the difference is 1 and primality is not even used. The
        intersection over all k is thus attained by any two of them - the
        "k-independent part" is pinned by two probes, not by N - 1 of them.
        INDEX BOOKKEEPING, checked: c -> sum c_i lambda_i is onto Z/N because
        lambda_1 = 1 is a unit, so R_r has index N in Z^r. Hence R_r x R_r has
        index N^2 in Z^(2r), W_r(k) has index N, and
        [W_r(k) : R_r x R_r] = N^2 / N = N. All three numbers are right.
      numeric_confirmation: >-
        det R_3 = 613557433 = N; det(R_3 x R_3) = N^2; index of R_3 x R_3 in W_3
        = N. Containment R_3 x R_3 in W_3(k) verified for k in {1, 2, 3,
        365480133, N-1}. The HNF of the kernel of the pair of congruences at
        k = 1 and k = 2 equals the HNF of R_3 x R_3 exactly, row for row. And
        the difference of the two coefficient vectors is (0,0,0,lambda_1,
        lambda_2,lambda_3), which is the subtraction step made explicit.

    - item: 6
      claim: D3
      question: 'Does every vector of R_r x R_r have B = 0, and does CTRL-CERT therefore exclude it?'
      answer: PARTIAL
      what_confirms: >-
        The mechanical part is trivially and completely CONFIRMED. Every
        (a, b) in R_r x R_r has b in R_r, hence B(b) = sum b_i lambda_i = 0 mod
        N by definition. Zero is not invertible mod N, so CTRL-CERT's k = -A/B
        step does not apply and no discrete logarithm is recoverable. Verified
        numerically for every HNF basis row of R_3 x R_3, and demonstrated on
        the sharpest possible case: LLL run on W_3 returns (0,0,0,-1,-1,-1),
        which has A = 0 and B = 0 and yields nothing.
      what_is_over_stated: >-
        D3's CONCLUSION sentence - "every vector of W_r that an attacker can
        write down without already knowing k lies in R_r x R_r and carries zero
        information about k" - is stronger than (i)-(iii) establish. What is
        established is: a vector guaranteed to lie in W_r(k) for EVERY k lies in
        R_r x R_r. That covers a deterministic, zero-error, k-free construction.
        It does not cover an attacker who guesses k (correct with probability
        1/N), who produces a vector valid on a proper subset of the k-range, or
        who runs any randomized strategy with success probability below 1. The
        correct quantifier is "any k-independent construction that is correct
        for every k", and the claim should be written that way. Note this is a
        narrowing of the PROSE only: it does not weaken D4, whose barrier
        argument is independent and is established in item 7 by a direct
        reduction rather than by D3.
      generic_side_claim: >-
        D3's why_it_matters asserts that generically, absent a small integer
        relation among the lambda_i, R_r has determinant N in dimension r and
        first minimum about N^(1/r), LONGER than the N^(1/(2r)) attained by W_r.
        The determinant statement is exact and confirmed. The first-minimum
        statement is a Gaussian-heuristic expectation, not a theorem, and I
        tested it on ONE random draw: with lambda_2, lambda_3 drawn uniformly,
        LLL gives an infinity-norm upper bound of 397 against N^(1/3) = 849.7
        and a Gaussian infinity-norm expectation of about (1/2) N^(1/3) = 425.
        Good agreement, but one draw is not a distribution and the claim should
        be labelled heuristic. In the degenerate CM case R_3 contains (1,1,1)
        and its minimum is 1 - verified - so the note's "in the degenerate case
        it is the shortest possible one" is confirmed.

    - item: 7
      claim: D4
      question: 'Does constructing W_2 plus LLL plus k = -A/B really solve the instance - is D4''s reduction valid in the direction stated?'
      answer: CONFIRMED, and the reduction is stronger and cleaner than stated
      the_note_route_as_written: >-
        VALID BUT CONDITIONAL. W_2(k) is a rank-4 integer lattice of determinant
        N. LLL returns in polynomial time a nonzero v with
        ||v||_2 <= 2^((n-1)/4) det^(1/n) = 2^(3/4) N^(1/4) for n = 4, so the
        infinity norm is O(N^(1/4)). Writing v = (a, b), the congruence
        A(a) + k B(b) = 0 mod N gives k = -A(a) B(b)^(-1) mod N WHEN B(b) is
        invertible, and [k]P = Q certifies it. I ran exactly this: LLL on my W_2
        returned (-22, -36, 83, -98), B was invertible, and it recovered
        k = 365480133 with [k]P = Q. (Aside: RT-20260728-001 N2 quotes the bound
        as about 3.4 N^(1/4) and the note as O(N^(1/4)); these differ only by
        Hermite-factor convention and neither is load-bearing.)
        THE GAP THE NOTE DOES NOT STATE: LLL may return a vector with B = 0,
        which recovers nothing. That is not hypothetical. On W_3 for this very
        family, LLL returns (0,0,0,-1,-1,-1) with A = B = 0 - the useless
        sublattice of D3 - so "LLL then k = -A/B" is not an unconditional
        reduction.
      repaired_reduction_mine: >-
        The gap closes completely, and the reduction becomes deterministic, with
        no LLL, no Hermite factor, no failure case, and valid for EVERY r >= 1.
        W_r(k) is the kernel of the character chi_k on Z^(2r) given by
        chi_k(a, b) = sum a_i lambda_i + k sum b_i lambda_i, of index N. Since
        Z^(2r) / W_r(k) is cyclic of prime order N, the group of characters
        Z^(2r) -> Z/N vanishing on W_r(k) is cyclic of order N, generated by
        u = (lambda_1, ..., lambda_r, k lambda_1, ..., k lambda_r). So: given ANY
        basis of W_r(k), form the basis matrix, compute its nullspace over the
        field Z/N by Gaussian elimination - the nullspace is one-dimensional -
        take the generator u', normalise by its first coordinate (which is
        c lambda_1 = c, nonzero), and read k directly off coordinate r + 1.
        Polynomial time, deterministic, always succeeds.
        I VERIFIED THIS RATHER THAN ASSERTED IT. I took the HNF basis of W_2(k),
        multiplied it by a random unimodular matrix so that k appears in no
        entry of the presented basis, confirmed the scrambled rows span the same
        lattice, recomputed the annihilator from those rows alone, normalised
        it, and obtained k = 365480133 - equal to the true k - together with
        [k]P = Q. The recovered annihilator's second coordinate was lambda_2 and
        its fourth was k lambda_2, as predicted.
      conclusion: >-
        Writing down a basis of W_r(k) for any r >= 1 is polynomial-time
        EQUIVALENT to solving the given ECDLP instance. D4's direction is
        correct. The determinant being pinned at N is a true but non-operative
        fact: the barrier sits one step earlier, at constructing the object.
      what_this_does_to_the_mechanism_of_IDEA_20260727_005_and_008:
        untouched: >-
          IDEA-20260727-005's part C1 as a STATEMENT - no augmented witness
          lattice of index strictly below N - is untouched and correct; that is
          P1, and STEP 2 of the contract derives it properly. Its C2-C4 exit
          classification (Chevalley-Barsotti, unipotent/toric/abelian targets,
          cover-channel cost) is untouched by D1-D4: D4 speaks only about the
          class of attacks that construct and then reduce W_r as defined in
          STEP 1.
        what_moves: >-
          The EXPLANATORY MECHANISM both records give. IDEA-20260727-005 says
          "the determinant, and hence the candidate count inside the Minkowski
          box, is pinned at N", and IDEA-20260727-008 says "shrinkage without
          cost reduction is the signature of the determinant being pinned".
          Under D4 the determinant is not what bars the lane. W_r(k) cannot be
          written down without k, and writing it down is equivalent to solving
          the instance, so no cost measured on W_r is the cost of any attack.
          Concretely: EXP-ENDO-001's driver builds W_r FROM k, which the
          contract legitimately notes it chose - "k is CHOSEN by the driver, so
          no discrete logarithm is solved to set up an instance". True, and it
          also means the searched object presupposes the answer. P2 and P3 of
          IDEA-20260727-008 are therefore measurements of lattice geometry and
          of a search over an oracle-provided object, not of attack cost. They
          cannot support that record's stated reading that "increasing r
          therefore makes the attack strictly worse"; the supportable statement
          is that there is no attack in this family at any r, for a reason that
          needs no measurement.
        second_order_consequence: >-
          IDEA-20260727-008's falsification clause "falsified if the measured
          MITM cost divided by sqrt(N) DECREASES with r on any instance family"
          - the contract's F1 - is reachable through the D2 degeneracy as a
          bookkeeping artifact rather than through an exploitable effect. A
          fired F1 on J0 at r >= 3 would be a false positive. This reproduces
          RT-20260728-001 B4 independently; I record it as reproduced, not as a
          finding of mine.
        what_is_NOT_claimed: >-
          Nothing above closes the endomorphism lane, and nothing above is a
          statement about ECDLP, about endomorphism-assisted attacks in general,
          or about lattice formulations other than W_r. The
          automorphism-quotient Pollard rho at about 0.886 sqrt(N/|Aut|) is
          untouched, is a constant factor of at most sqrt(6), and is outside
          target class. This is paper algebra about a withdrawn instrument. It
          is not a cryptanalytic result.

  # ---------------------------------- adjudication of the recorded disagreement
  adjudication_coordinator_vs_reviewer:
    the_disagreement: >-
      RT-20260728-001 B1 required_fix: "Set genuine_r_bound: 2 for BOTH CM
      families." The Coordinator's D1 records a DISAGREEMENT: J1728 already
      carries 2 correctly because Z[i] has rank 2, so "the defect is confined to
      J0" and "the correction is smaller than the review states".
    verdict: 'NOT SUSTAINED. The reviewer did not over-generalize; the Coordinator''s framing understates the defect.'
    what_the_coordinator_gets_right: >-
      Narrowly and verifiably: End(E) for an ordinary j = 1728 curve over F_p
      with p = 1 mod 4 is an order in Q(i), a Z-module of rank 2, and the
      contract already sets genuine_r_bound: 2 there. (Ordinarity is again
      automatic: y^2 = x^3 + a x over F_p is supersingular exactly when
      p = 3 mod 4.) So B1's required_fix demands no EDIT on J1728. That is true
      and I confirm it.
    why_it_is_still_not_sustained:
      - >-
        The Coordinator's own justification for D1 IS the Z-rank rule. Applied
        uniformly, that rule yields 2 for both CM families - which is exactly
        what B1 states. B1 stated the correct uniform RULE; that it happens to
        be already satisfied on one family makes the fix vacuous there, not
        over-general.
      - >-
        The substantive point runs the OTHER WAY from the Coordinator's. On
        J1728 there are FOUR distinct efficiently computable scalars, not two:
        1, i, -1, -i, realized by 1, phi, phi^2, phi^3 with
        phi(x,y) = (-x, i y). I verified all of them on a real curve rather than
        asserting them (instantiation.json, j1728_secondary): p = 268435597,
        a = 4, N = 33555217, phi(P) = [16416912]P, phi^2(P) = [-1]P,
        phi^3(P) = [-16416912]P, four distinct scalars confirmed. Under the
        contract's J0 criterion - count DISTINCT EFFICIENTLY COMPUTABLE SCALARS
        - J1728's genuine_r_bound would be 4, not 2.
      - >-
        So the contract counts distinct scalars on one CM family and Z-rank on
        the other, with no statement that it is doing either. That inconsistency
        is the actual defect, and it is larger than a single numeral.
      - >-
        And the degeneracy is NOT peculiar to j = 0. It is a Vieta /
        automorphism artifact of using every efficiently computable scalar as a
        coordinate. Computed, not asserted: on the J1728 instance above, with
        coordinates (1, i, -1) the vector (1,0,1,0,0,0) satisfies the congruence
        and has infinity norm 1; with coordinates (1, i, -i) - both roots of
        L^2 + 1, which is precisely what the contract names as J1728's
        eigenvalue_source - the vector (0,1,1,0,0,0) does the same. Predicted
        N^(1/6) there is 17.96.
    scope_of_this_adjudication: >-
      Stated so it is not over-read: J1728 at r >= 3 is declared SYNTHETIC in
      the frozen contract, with lambda_3 drawn uniformly at random rather than
      set to -1 or -i. So the frozen J1728 cells do NOT carry the collapse, and
      the Coordinator is right that as frozen the defect shows up only on J0.
      What is wrong is the inference from that accident to "the defect is
      confined to J0" and "the correction is smaller". The confinement is an
      artifact of the inconsistent definition, not a property of the
      mathematics, and any amendment that fixed the definition on the
      distinct-scalar reading would put the collapse on J1728 too.

  # ------------------------------------------------------- required narrowings
  required_narrowings:
    - id: NAR-1
      applies_to: D1
      required_statement: >-
        Replace "the frozen value genuine_r_bound 3 is wrong" with: the contract
        does not say whether `genuine` denotes a count of distinct efficiently
        computable scalars or a Z-rank, and it uses the first notion on J0 and
        the second on J1728. Under the distinct-scalar notion, which is the one
        the contract's own synthetic_rank_rule states, J0's 3 is internally
        correct and J1728's 2 is internally WRONG (it should be 4). The defect
        is definitional: prediction P2 requires Z-independent coordinates and
        the contract never requires them. Additionally record that the rank-2
        conclusion holds without the ordinarity hypothesis, since End(E) is a
        domain and phi^3 = 1 with phi != 1 forces phi^2 + phi + 1 = 0.
    - id: NAR-2
      applies_to: 'D1, disagreement_with_source_review'
      required_statement: >-
        Withdraw the claim that RT-20260728-001 B1 over-generalized and that
        "the correction is smaller than the review states". Record instead: B1's
        uniform rank-2 rule is correct and is the same rule D1 itself uses; on
        J1728 it requires no edit because the value is already 2; and the
        degeneracy is a Vieta/automorphism artifact that reaches J1728 too under
        the contract's own distinct-scalar criterion, verified numerically in
        VAL-20260728-001's instantiation.json. It is confined to J0 only as the
        contract happens to be frozen.
    - id: NAR-3
      applies_to: 'D2, consequence 1'
      required_statement: >-
        Mark the claim that the 40 J0 cells at r in {3,4} enter the S2
        regression as CONVENTION-DEPENDENT. Under H-ENDO-001's own
        first_minimum_method rule (exact enumeration in dimension at most 4, LLL
        otherwise) those cells are LLL cells and are excluded from the S2 fit by
        the contract's invalidation rule. The first minimum is 1 either way -
        LLL returns the norm-1 vector directly - so the geometric degeneracy and
        the HEUR-1/HEUR-2 failures stand unchanged; only the regression route to
        F3 is convention-dependent. Also correct "cells the contract labels
        GENUINE" to cover r = 3 only: the contract labels J0 r = 4 SYNTHETIC.
    - id: NAR-4
      applies_to: 'D3, conclusion sentence'
      required_statement: >-
        Requantify. Replace "every vector of W_r an attacker can write down
        without knowing k carries zero information about k" with "any
        k-independent construction that is correct for EVERY k yields only
        vectors of R_r x R_r, which carry no information about k". The proved
        statement is about zero-error k-free constructions; it does not cover
        guessing, partial-range or randomized strategies. Label the generic
        first-minimum claim (about N^(1/r)) as a Gaussian heuristic tested on
        one random draw, not as a theorem.

