  proposed_evidence_record:
    install_at: ledger/evidence/EV-GGM-002.yaml
    conforms_to: templates/research-records.md evidence schema
    ceiling_compliance: >-
      RT-20260726-001 recorded claim_tier_ceiling toy and proof_status_default_ceiling
      empirical_only for any evidence record a future execution of EXP-GGM-001 could support, at
      any verdict, for any subject. EV-GGM-002 declares claim_tier toy, AT the ceiling, and
      proof_status not_applicable, strictly BELOW the empirical_only default ceiling. No
      supersession of that ceiling is claimed or needed. REV-20260727-002 recommended
      empirical_only and expressly permitted the lower value: "I note candidly that
      empirical_only is itself generous here, since the runs measured nothing about any curve --
      the seeds and bit sizes never touch a verdict. If the Coordinator prefers, not_applicable
      is defensible. What is NOT defensible is derivation."
    file_content: |
      evidence:
        id: EV-GGM-002
        supersedes: EV-GGM-001
        supersession_note: >-
          EV-GGM-001 is published and immutable and is NOT overwritten, edited or withdrawn. This
          record supersedes it as the operative evidence record for the same experiment and the
          same nine run directories, under DEC-20260727-004, on the strength of REV-20260727-002
          (TASK-20260727-002, terminal_verdict DOES_NOT_SURVIVE). Every assertion of EV-GGM-001
          that this record does not repeat is thereby not carried forward; the specific
          withdrawals are enumerated in CORR-20260727-003.
        hypothesis_id: H-GGM-001
        experiment_ids:
          - EXP-GGM-001
        run_ids:
          - RUN-GGM-s1-b8
          - RUN-GGM-s1-b12
          - RUN-GGM-s1-b16
          - RUN-GGM-s2-b8
          - RUN-GGM-s2-b12
          - RUN-GGM-s2-b16
          - RUN-GGM-s3-b8
          - RUN-GGM-s3-b12
          - RUN-GGM-s3-b16
        run_ids_note: >-
          EV-GGM-001 asserted 9 runs with run_ids empty, so the evidence was not bound to the
          runs it rested on (ESC-20260727-001 ground A5; REV-20260727-002 PR-5). All nine
          directories exist under experiments/EXP-GGM-001/runs/ and are cited here for the first
          time. Listing them is a cross-reference repair and is NOT an assertion that they are
          nine independent executions; see boundaries item 1.
        type: empirical
        type_note: >-
          empirical rather than theoretical, because this record describes what nine executed run
          directories contain. It asserts no theoretical result. EV-GGM-001's theoretical was
          bound to the derivation-level closure language this record does not carry.
        direction: neutral
        direction_note: >-
          neutral, not supports and not weakens. The run set neither supports nor contradicts
          H-GGM-001. supports is untenable because the artifact contains no test whose output
          could support anything; weakens and contradicts are forbidden by AGENTS.md rule 5,
          under which an implementation failure is not evidence against a mathematical
          hypothesis. ESC-20260727-001 section C suggested direction supports at strength
          preliminary for a retained EV-GGM-001; that suggestion predates the review and does not
          survive it.
        strength: inconclusive
        strength_note: >-
          inconclusive as a matter of fact and not of caution. replicated and strong are
          unavailable because the nine directories are one computation serialized nine times;
          preliminary and anecdotal would still assert that something was observed about the
          hypothesis, and nothing was.
        claim_tier: toy
        certificate_refs: []
        proof_status: not_applicable
        proof_refs: []
        proof_status_note: >-
          not_applicable, and deliberately not empirical_only. The record's direction is neutral,
          so no adverse transition rests on it and no refutation artifact is required for it; and
          there is no empirical content to declare, because the seeds and bit sizes never touch a
          verdict and all nine raw results are byte-identical. REV-20260727-002 recommended
          empirical_only while stating that "empirical_only is itself generous here" and that "If
          the Coordinator prefers, not_applicable is defensible. What is NOT defensible is
          derivation." not_applicable is strictly below the proof_status ceiling RT-20260726-001
          recorded, so no ceiling supersession is claimed. proof_refs is empty because nothing is
          being proved by this record; the derivation note backing DEC-20260727-004's withdrawal
          of the archive's claim is cited there, not here.
        observations:
          - >-
            Nine run directories exist and are bound to this record by ID: RUN-GGM-s1-b8,
            RUN-GGM-s1-b12, RUN-GGM-s1-b16, RUN-GGM-s2-b8, RUN-GGM-s2-b12, RUN-GGM-s2-b16,
            RUN-GGM-s3-b8, RUN-GGM-s3-b12, RUN-GGM-s3-b16. Each manifest records status
            completed_valid, code.commit 7ec5251ff6c23cbc26ada90ecb0fced928f84b85, code.dirty
            false, and certificate kind none with verified true and verifier no-claim, which is
            the correct declaration for a run claiming no solve.
          - >-
            All nine raw-result.json files are BYTE-IDENTICAL, SHA-256
            388c95d8b6a75ca619fa73eb933af5167cdc46392ff22e86c1e3b9e29bac82c7, computed by
            REV-20260727-002 from Git object content. A single hash is recorded because there is
            a single distinct file content across the nine directories.
          - >-
            The nine directories are one execution. The verdicts dict is computed once at
            simulability_test.py lines 295-299, OUTSIDE the seed/bits loop at lines 325-337, and
            the same object is serialized nine times by one process. Timestamps run from
            started_at 1785163745.012458 to finished_at 1785163746.016994, 1.005 seconds for all
            nine, strictly increasing in exact loop order.
          - >-
            All 18 stdout.log and stderr.log files are 0 bytes; write_run writes them as empty
            strings unconditionally at lines 271-274. controls_correct is printed at line 312 and
            never passed to write_run, so the reported 4/4 control-gate figure appears in NO
            manifest and NO raw-result.json. It exists only as prose in analysis.md, EV-GGM-001
            and DEC-20260726-007.
          - >-
            classify_oracle, lines 106-178, is an if/elif chain testing the oracle spec name
            against eight string literals, each branch returning a Verdict whose verdict,
            simulator, overhead_C, witness and rationale fields are hardcoded source literals. No
            branch inspects query_types, public_data or any other structural property of its
            argument. No parser, simulator constructor, overhead checker or witness generator
            exists, although specification.yaml implementation_requirements names all four.
          - >-
            The control gate at lines 303-311 compares ORACLES[name]["expected_verdict"] (source
            literals, lines 27-92) against classify_oracle's return (source literals, lines
            121-178). The comparison contains no free variable, so controls_correct == 4 on every
            possible execution of the program and the frozen falsification_criterion - "A single
            control misclassification falsifies the test's soundness" - cannot fire.
          - >-
            overhead_C is identical at 8, 12 and 16 bits for every subject in all nine manifests:
            pure_generic 1, public_curve 0, jet_oracle 1, endomorphism_oracle 0, and null for
            discrete_log, encoding, elliptic_net_oracle and incidence_oracle. This is necessary,
            not measured: it is the same integer object written nine times.
          - >-
            The eight spec_hash values are identical across all nine runs: pure_generic
            d26f5a1285baaea2, discrete_log 3134d46d42fb5daf, public_curve 01fbd6f6472962f3,
            encoding b4db9084a18e53da, jet_oracle 2751ca45b10c7c65, elliptic_net_oracle
            e29dd804df030a0d, incidence_oracle 0851d6a65a624d27, endomorphism_oracle
            4b6f28a6213feee2. Each is a hash of the IN-CODE ORACLES entry, which includes
            expected_verdict and expected_basis, and is never compared to
            experiments/EXP-GGM-001/specification.yaml, so invalidation_rule 3 cannot fire.
          - >-
            Specification and implementation are out of sync and no check detects it: the frozen
            command_template names oracles jet, elliptic_net, incidence, endomorphism while the
            module's ORACLES keys are jet_oracle, elliptic_net_oracle, incidence_oracle,
            endomorphism_oracle. Executing the frozen command_template verbatim raises KeyError at
            line 297. Separately, command.txt is synthesized as an f-string at line 328 rather
            than captured, was not the command executed, and cannot execute as written because
            EXP-GGM-001 contains hyphens and is not a valid Python module path.
          - >-
            The manifest inference block is a source constant hardcoded at lines 237-242 -
            requested_policy coordinator-ultra-code, resolved_model_id
            fireworks-ai/accounts/fireworks/models/glm-5p2, fallback_used true - and is emitted
            identically into all nine manifests. It records nothing measured, carries no
            authorization_ref, and no committed decision authorizing that fallback was found.
            adapter_version is null, environment.dependencies is an empty map and artifacts is an
            empty map in every manifest.
          - >-
            PROCESS OBSERVATIONS, RECORDED SEPARATELY AND NOT USED AS EVIDENCE ABOUT ANY ORACLE.
            experiments/EXP-GGM-001/specification.yaml reads status review_required with
            approved_by null and no approve decision exists in ledger/decisions; the runs executed
            against parent 7ec5251f where the same specification was equally unapproved; no
            reviewer, validator or red-team artifact accompanies commit 3a59a207; and EV-GGM-001
            records reviewed_by coordinator.
        inference: >-
          This run set is EVIDENTIALLY VOID with respect to H-GGM-001. It neither supports nor
          contradicts the hypothesis, at any strength, because the module whose output it records
          implements no decision procedure: the eight verdicts are inputs to the program rather
          than outputs of it, and the gate that was supposed to license trust in them returns 4/4
          on every possible execution. Two things the run set DOES establish, both about the
          artifact and neither about mathematics: (i) the executed module is a serializer of eight
          hardcoded verdict literals selected by string equality on the subject's name, and (ii)
          the nine directories are one computation, so no replication, no seed variation and no
          N-dependence of any quantity was observed. One thing it does NOT establish, in either
          direction: whether the jet, elliptic-net, incidence or endomorphism oracle is in fact
          GGM-simulable. That question is untouched by this record and remains open. Per AGENTS.md
          rule 5 the implementation failure recorded here is not evidence against H-GGM-001, and
          per AGENTS.md rule 10 the absence of controls_correct from every run artifact means the
          4/4 figure asserted by EV-GGM-001 and DEC-20260726-007 is unbacked by any run record -
          not falsified, simply not recorded.
        boundaries:
          - >-
            THE NINE RUNS ARE ONE COMPUTATION, AND THIS IS THE GOVERNING SCOPE LIMIT ON THIS
            RECORD. They are not three seeds at three bit sizes of anything. The verdicts dict is
            built once before the loop and the same object is written nine times; all nine
            raw-result.json are byte-identical; the whole set spans 1.005 seconds. Therefore this
            record may NOT be cited for replication, for seed robustness, for agreement across
            runs, for stability of any verdict, or for N-independence of overhead_C. The identity
            of overhead_C across 8, 12 and 16 bits is a necessary consequence of serializing one
            integer nine times; the overhead-growth check had zero degrees of freedom and could
            not have detected growth for any oracle under any circumstance. Any later record that
            cites "9 runs" from this experiment must carry this sentence with it.
          - >-
            claim_tier toy, derived mechanically from the tested parameters 8, 12 and 16 bits
            (docs/claims-and-verification.md: toy is max field bit size <= 32). medium and crypto
            are unreachable by this protocol at any verdict. Nothing in this record asserts
            anything about medium or cryptographic curves.
          - >-
            NOT EVIDENCE FOR OR AGAINST ECDLP HARDNESS. Nothing here bears on prime-field ECDLP,
            index calculus, KN-OPEN-001, or any attack stage. No solve, no relation, no
            certificate, no cost comparison against rho or BSGS.
          - >-
            THE CLOSURE LANGUAGE OF EV-GGM-001 IS NOT CARRIED FORWARD. "Closure at exponent 1/2",
            "scale-independent", "valid at all scales", "derivation-level, not toy-tier" and "this
            closes all jet-based ECDLP candidates" appear nowhere in this record and are not
            supported by it. EV-GGM-001 carried claim_tier toy while asserting in boundaries item
            2 that "the closures themselves are not toy-tier"; those cannot both hold, and this
            record holds neither.
          - >-
            THE ENDOMORPHISM RESULT IS NOT THIS RECORD'S EVIDENCE. REV-20260727-002 derived by
            hand that the endomorphism oracle IS genuinely simulable - phi acts on the
            prime-order subgroup as multiplication by a publicly computable lambda, so a
            simulator answers phi(sigma(A)) as [lambda]sigma(A) using only the group oracle - and
            that exponent 1/2 is preserved at C = Theta(log N) via q >= Omega(sqrt(p)/log p) =
            p^{1/2-o(1)}. That is the reviewer's derivation, not an output of this run set; the
            artifact never gives that simulator, reports C = 0 by applying a coordinate formula
            the model forbids, and the result restates Wiener-Zuccherato, GLV and
            Duursma-Gaudry-Morain. It is attributed here, is not adopted as a finding, and needs
            its own independent review.
          - >-
            PROCESS DEFECTS ARE NOT MATHEMATICAL FINDINGS. The absence of approval and of any
            rule-12 review is recorded in observations as process fact only. A process-invalid
            execution is not negative evidence about any oracle.
          - >-
            RULE 12 IS NOT DISCHARGED FOR THIS RECORD. REV-20260727-002 requested
            review-breakthrough at max, resolved claude-opus-5 at high, recorded fallback_used
            true and equivalence_to_requested_policy_claimed false, and states of itself that it
            "discharges rule 12 for nothing". This record may not be cited as rule-12 reviewed.
          - >-
            THE RUN RECORDS ARE IMMUTABLE AND WERE NOT EDITED. Every gap named in observations is
            recorded, never filled. No manifest, raw-result, log or command file under
            experiments/EXP-GGM-001/ was modified in producing this record.
        unresolved_confounds:
          - >-
            Whether the jet, elliptic-net, incidence and endomorphism oracles are GGM-simulable
            under a single frozen model is UNDETERMINED by this record and is not decided anywhere
            in the ledger.
          - >-
            Which reading of the jet oracle is frozen - "return the eps-coefficient of P+Q",
            encoding-dependent, versus "return the derivative of the addition map", a universal
            identity - is not settled by the frozen text. The Weierstrass-twist invariance test
            that would settle it empirically is pre-registered twice (RT-20260726-001;
            REV-20260727-002 BO-3) and has never been run. It requires a new experiment
            specification and is authorized by nothing in the ledger.
          - >-
            The generic-group model variant was not held fixed. inputs.gg_model_variant is frozen
            as shoup_encoding and H-GGM-001 assumptions item 5 requires the variant be fixed
            consistently across all oracles and controls, yet the jet and endomorphism branches
            announce in their own emitted rationale that they classify under a "structured GGM"
            instead. Which model any given verdict was reached under is therefore not recoverable
            from the artifact.
          - >-
            The glm-5p2 fallback recorded in all nine manifests carries no authorization_ref and
            no committed decision authorizing it was located.
          - >-
            At authoring time no committed snapshot receipt binds the review artifacts on which
            this record's interpretation rests; the declared path
            coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/archives/TASK-20260727-004/snapshot_commit_receipt.json
            does not exist. The binding must be established and recorded by the ledger archive
            task.
        reviewed_by: >-
          REV-20260727-002 (TASK-20260727-002), an independent non-originating session that
          authored neither the execution, nor EV-GGM-001, nor DEC-20260726-007, nor H-GGM-001,
          nor ESC-20260727-001. Its runtime receipt records requested_policy review-breakthrough
          at max, resolved_model_id claude-opus-5 at reasoning_effort high, fallback_used true,
          equivalence_to_requested_policy_claimed false, rule_12_floor_met false. Disposition by
          coordinator under DEC-20260727-004.

  proposed_correction_record:
    install_at: ledger/corrections/CORR-20260727-003.yaml
    conforms_to: >-
      templates/research-records.md correction schema, with the record_type_note convention
      established by CORR-20260724-001 and CORR-20260727-001 for correcting a
      coordinator_decision, since the template enumeration has no decision value.
    necessity_judgement: >-
      NECESSARY. DEC-20260726-007 is published, immutable and cited by a published commit message
      and by a knowledge finding. Several of its assertions are withdrawn by DEC-20260727-004 and
      one of its next_actions is countermanded. Leaving that implicit would leave an immutable
      published record asserting a 4/4 gate that cannot fail, a derivation-level closure with no
      derivation, and a knowledge promotion on evidence that has been superseded, with nothing in
      the ledger saying so at the record's own id.
    file_content: |
      correction:
        id: CORR-20260727-003
        recorded_at: '2026-07-27'
        record_type: claim
        record_type_note: >-
          The template enumeration for record_type is candidate | claim | run and has no decision
          value. claim is used as the closest permitted token, exactly as CORR-20260724-001 and
          CORR-20260727-001 did. The corrected record is a coordinator_decision. No new enum value
          is invented silently.
        record_id: DEC-20260726-007
        record_id_disambiguation: >-
          MAIN'S. This correction is about the record published on origin/main at
          ledger/decisions/DEC-20260726-007.yaml in commit
          3a59a2079e7d24fa877828dc4766d4ca1c1cc9cb - the EXP-GGM-001 archive decision, support at
          strength strong on H-GGM-001. It is NOT about the branch record that formerly occupied
          that id and was renumbered to DEC-20260726-009 under CORR-20260727-001. The corrected
          record is not edited, deleted, withdrawn or moved; it keeps its id and its bytes.
        field: multiple, enumerated in corrected_assertions
        prior_value: see corrected_assertions, each entry's prior_value
        corrected_value: see corrected_assertions, each entry's corrected_value
        corrected_assertions:
          - locus: context
            prior_value: >-
              "Control gate: 4/4 correct (test sound)." and "The jet and endomorphism verdicts are
              scale-independent mathematical closures at exponent 1/2 (derivation-level, not
              toy-tier)."
            corrected_value: >-
              WITHDRAWN. The gate compares two hardcoded literals held in the same source file and
              returns 4/4 for every possible execution, so it establishes no soundness; and the
              figure appears in no run artifact, only in prose. The scale-independent closure at
              exponent 1/2 is not earned for the jet oracle under either model the reviewer
              formalised, and for the endomorphism oracle it is not established BY THIS ARTIFACT.
              No replacement closure statement is asserted.
          - locus: rationale item 1
            prior_value: >-
              "Control gate 4/4: the test correctly classifies pure_generic (SIMULABLE),
              discrete_log (NON_SIMULABLE), public_curve (SIMULABLE), and encoding
              (NON_SIMULABLE). Test soundness established."
            corrected_value: >-
              WITHDRAWN as to "Test soundness established". The four control verdicts are NOT
              asserted to be wrong - REV-20260727-002 derived all four by hand under two models
              and all four came out as the specification expects. What is withdrawn is the
              inference: a gate that cannot fail establishes nothing, and even a genuine gate
              could not validate a lookup table whose eight branches share no machinery.
          - locus: rationale item 2
            prior_value: >-
              "Jet oracle SIMULABLE with C=1 ... Closed at exponent 1/2 by KN-TECH-005. This is a
              derivation-level result valid at all scales."
            corrected_value: >-
              WITHDRAWN. No derivation exists: analysis.md asserts conclusions and cites a lookup
              table, and the module contains no derivation, so proof_status derivation was not
              available. "Valid at all scales" is a forbidden phrasing under the ceiling
              RT-20260726-001 recorded in advance. This correction does NOT assert that the jet
              oracle is non-simulable; that question is open.
          - locus: rationale item 3 and next_actions item 2
            prior_value: >-
              "Endomorphism oracle SIMULABLE with C=0: phi is public and deterministic. Closed at
              exponent 1/2. This contextualizes H-STR-002 ..." and the instruction to update
              H-STR-002 interpretation_limits accordingly.
            corrected_value: >-
              PARTLY WITHDRAWN, WITH THE SURVIVING PART RECORDED. The SIMULABLE verdict is
              correct, but C = 0 is not: it is obtained by applying phi(x,y) = (zeta*x, y) to
              coordinates the model forbids and charging nothing for the very operation being
              simulated. Under the specification's own metric the honest count is Theta(log N), at
              which exponent 1/2 is still preserved. The H-STR-002 contextualization as written is
              withdrawn, both because it rests on C = 0 and because RT-20260726-001 OBJ-10 found
              it a category error, query cost versus linear-algebra cost. No edit to H-STR-002 is
              made or authorized by this correction.
          - locus: rationale item 5
            prior_value: >-
              "support at strong strength: ... The result is reproducible by construction."
            corrected_value: >-
              WITHDRAWN. strength strong was unavailable: the nine run directories are one
              computation serialized nine times, byte-identical, spanning 1.005 seconds.
              "Reproducible by construction" is accurate about the serialization and is not a
              statement about replication of any measurement.
          - locus: evidence_refs
            prior_value: EV-GGM-001
            corrected_value: >-
              EV-GGM-001 is SUPERSEDED by EV-GGM-002 under DEC-20260727-004. EV-GGM-001 remains
              published and immutable and is not overwritten.
          - locus: operative effect on H-GGM-001
            prior_value: decision support; H-GGM-001 status set to supported.
            corrected_value: >-
              SUPERSEDED by DEC-20260727-004: H-GGM-001 returns to specified. This is a statement
              that the hypothesis is UNTESTED, not that it is refuted, and it is not a finding
              that the mathematics is wrong.
          - locus: next_actions item 3
            prior_value: >-
              "Close jet-based ECDLP candidates (ECDLP-IDEA-004 and related) by theorem."
            corrected_value: >-
              COUNTERMANDED. No theorem exists, no candidate family is closed by this archive, and
              no such closure is authorized. Any closure of a live candidate family is a closure
              result requiring an independent review-breakthrough review at max under AGENTS.md
              rule 12 plus its own Coordinator decision.
          - locus: knowledge_promotion
