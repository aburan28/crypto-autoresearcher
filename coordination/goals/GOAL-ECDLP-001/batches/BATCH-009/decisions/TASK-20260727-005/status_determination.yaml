          - >-
            THE TASK-20260727-004 SNAPSHOT RECEIPT IS ABSENT AT ITS DECLARED PATH. The producer
            artifacts this decision rests on are present in a clean worktree but are not bound by
            any committed receipt at authoring time. The archive task must establish and record
