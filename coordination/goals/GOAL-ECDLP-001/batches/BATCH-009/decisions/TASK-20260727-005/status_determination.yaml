  proposed_decision_record:
    install_at: ledger/decisions/DEC-20260727-004.yaml
    conforms_to: templates/research-records.md coordinator_decision schema
    file_content: |
      coordinator_decision:
        id: DEC-20260727-004
        context: >-
          The ESC-20260727-001 section C superseding decision, which DEC-20260727-001 recorded as
          its single next action and which had not been written. It is authored on the strength
          of an independent non-originating review that ESC-20260727-001 did not have.
          origin/main commit 3a59a2079e7d24fa877828dc4766d4ca1c1cc9cb executed EXP-GGM-001 into
          nine run directories, recorded EV-GGM-001 (direction supports, strength strong,
          proof_status derivation) and DEC-20260726-007 (support), moved H-GGM-001 to supported,
          and promoted a KN-FIND entry, asserting that the jet and endomorphism verdicts are
          "scale-independent mathematical closures at exponent 1/2 (derivation-level, not
          toy-tier)". TASK-20260727-002 reviewed that archive from the committed artifacts,
          including experiments/EXP-GGM-001/simulability_test.py, which the escalation ruling
          expressly declined to read, and returned terminal_verdict DOES_NOT_SURVIVE
          (REV-20260727-002). This decision supersedes main's DEC-20260726-007 as the operative
          disposition of that archive, supersedes EV-GGM-001 by EV-GGM-002, returns H-GGM-001 to
          specified, records CORR-20260727-003 against DEC-20260726-007, and authorizes no
          execution of anything.
        decision: supersede
        target_ids:
          - H-GGM-001
          - EXP-GGM-001
          - EV-GGM-001
          - EV-GGM-002
          - DEC-20260726-007
          - CORR-20260727-003
        rationale:
          - >-
            WHAT WAS DECIDED AND ON WHAT. H-GGM-001 returns from supported to specified. The
            ground is the TASK-20260727-002 verdict, quoted: "The 4/4 control gate does not
            establish test soundness: it compares two hardcoded string literals held in the same
            source file, so it returns 4/4 for every possible execution and carries zero
            information; and even a genuine gate could not validate a lookup table, whose
            branches share no machinery. The figure itself appears in no run artifact." The
            reviewer considered SURVIVES_WITH_SCOPE_REDUCTION and CANNOT_DETERMINE and rejected
            both by name. This decision does not rest on ESC-20260727-001's authority: it
            corrects the ruling on the ruling's own decisive step, and it reaches the same status
            on a stronger ground the ruling could not have had.
          - >-
            THE HYPOTHESIS HAS NO EVIDENTIAL SUPPORT, AND NO EVIDENTIAL CONTRADICTION. The
            reviewer's one-sentence statement of what the module actually implements: "SIMULABLE
            if and only if the value of oracle_spec[name] is one of the six string literals
            {pure_generic, public_curve, jet_oracle, elliptic_net_oracle, incidence_oracle,
            endomorphism_oracle}, and NON_SIMULABLE if it is discrete_log, encoding, or
            unrecognised -- that is, classify_oracle is a lookup table keyed on the subject's
            name, not a decision procedure." No parser, simulator constructor, overhead checker
            or witness generator exists, though specification.yaml implementation_requirements
            names all four. The gate compares ORACLES[name]["expected_verdict"] (source literals,
            lines 27-92) against classify_oracle's return (source literals, lines 121-178), so
            controls_correct == 4 on every possible execution and the frozen
            falsification_criterion cannot fire; and controls_correct is printed at line 312 and
            never passed to write_run, which writes stdout.log and stderr.log as empty strings at
            lines 271-274, so the 4/4 figure appears in no run artifact at all. The eight
            verdicts are inputs to the program, not outputs of it. A program that reads out its
            own inputs measures nothing, so this archive is evidence for nothing and against
            nothing.
          - >-
            THE NINE RUNS ARE ONE COMPUTATION. The verdicts dict is computed once at lines
            295-299, outside the seed/bits loop at 325-337, and the same object is serialized
            into all nine directories by one process spanning 1.005 seconds; all nine
            raw-result.json are byte-identical at SHA-256
            388c95d8b6a75ca619fa73eb933af5167cdc46392ff22e86c1e3b9e29bac82c7 and all 18 log files
            are 0 bytes. Two consequences are recorded rather than inferred. First, "9 runs (3
            seeds x 3 bit sizes)" is accurate as a count of directories and false as a claim
            about executions, so strength replicated and strong were never available on any
            reading. Second, the identity of overhead_C across 8, 12 and 16 bits is a necessary
            property of writing one integer object nine times, not a measurement; the
            overhead-growth check had zero degrees of freedom, and the N-independence claim
            underlying both headline closures rests on a check that could not have detected
            growth under any circumstance. RT-20260726-001 falsification route XR-2 specified
            this exact test before the run existed.
          - >-
            WHY specified, AND WHAT IT MEANS. The Research-states chain is proposed -> specified
            -> approved -> running -> analyzed -> replicated -> supported | weakened | rejected |
            inconclusive | superseded. Every status right of running asserts that a test was
            carried out and interpreted. specified is the last status that asserts only that a
            test exists on paper, and that is exactly and only what is true: H-GGM-001 has a
            specified test, the test was never approved, and the one execution that occurred did
            not implement it. This is the status that says THE CLAIM IS UNTESTED, as distinct
            from refuted. It restores no more than DEC-20260726-008 had already recorded and than
            ledger/goals/GOAL-ECDLP-001.yaml BATCH-006 claim_boundary already states, resolving a
            live contradiction between two committed records.
          - >-
            WHY NOT weakened OR rejected. Both are evidence-driven adverse transitions and no
            observation about the mechanism exists. AGENTS.md rule 5 forbids treating an
            implementation failure as evidence against a mathematical hypothesis, and the
            reviewer states it in terms: "It is not negative evidence about any oracle. A
            process-invalid, badly instrumented execution is not evidence in either direction
            (AGENTS.md rule 5)." The single candidate ground for weakening - that H-GGM-001
            falsification_conditions item 4 fires textually for elliptic_net at O(log N) and
            incidence at O(B^m) - fails because item 4 is stated in a direction that does not
            follow: growth in C degrades the transferred bound to q >= Omega(sqrt(p)/C), which at
            C = O(log N) is p^{1/2-o(1)} with the exponent fully intact, rather than making the
            Shoup bound inapplicable. The reviewer's conclusion is adopted verbatim: "this
            protocol cannot adjudicate the elliptic-net and incidence subjects in EITHER
            direction. That is a finding of indeterminacy, not a falsification." A misstated
            falsifier cannot fire. Rejection is separately forbidden: no counterexample
            certificate exists, the only derivation about the oracles is the reviewer's own and
            is unreviewed, and reject_scoped on a single unreplicated empirical-only run set is
            forbidden outright - and this run set is not even that.
          - >-
            WHY NOT inconclusive, AND WHERE inconclusive IS THE RIGHT WORD. inconclusive is the
            status of a hypothesis whose test ran and whose data did not discriminate. Recording
            it would silently ratify the proposition that EXP-GGM-001 executed a test of
            H-GGM-001 and returned ambiguous data. It executed no test. The review is not
            ambiguous about the artifact; it is decisive about it, and that decisiveness is what
            removes the hypothesis from the tested branch of the chain entirely. The genuinely
            inconclusive question is a different one - whether the jet, elliptic-net, incidence
            and endomorphism oracles are GGM-simulable under a single frozen model - and on that
            question this record is INCONCLUSIVE and says so. It is recorded in limitations and in
            EV-GGM-002 unresolved_confounds, not encoded as a hypothesis status it does not
            describe.
          - >-
            WHY NOT superseded. It requires a successor hypothesis record and none exists.
            DEC-20260726-008 named the obligation - correct falsification_conditions item 4 to
            the T = Omega(sqrt(p)/C) form, repair the witness definition, rescope assumptions
            item 2, and remove the tier asymmetry in interpretation_limits item 1 - and it is
            carried forward to TASK-20260727-009 rather than discharged by a status label.
          - >-
            THIS IS BOTH A PROCESS RULING AND A SUBSTANTIVE FINDING, ON TWO INDEPENDENT AXES, AND
            NEITHER STANDS IN FOR THE OTHER. Process: the specification reads status
            review_required with approved_by null, no approve decision exists anywhere in
            ledger/decisions, and a claim above the toy tier was archived with no independent
            review of any kind. Substance: the module implements no decision procedure and the
            gate cannot fail - a finding derived from the committed source that would stand
            unchanged had the experiment been approved and reviewed perfectly. A process defect
            is never allowed to stand in as a mathematical finding here, and a process-invalid
            execution is not negative evidence about any oracle.
          - >-
            WHAT SURVIVES IN MAIN'S FAVOUR, RECORDED BECAUSE IT IS TRUE AND NOT BECAUSE IT IS
            CONVENIENT. Three items. (i) The review CORRECTS ESC-20260727-001 in main's favour:
            horn 2 was wrong, because it "conflates publicity of the curve EQUATION with
            readability of a labelled point's COORDINATES"; under a properly formalised
            structured GGM the encoding control remains NON_SIMULABLE and the control gate
            genuinely reads 4/4. The ruling reached the right destination by a partly wrong
            route. (ii) The endomorphism SIMULABLE verdict is CORRECT, and exponent 1/2 genuinely
            is preserved - phi acts on the prime-order subgroup as multiplication by a publicly
            computable lambda, so a simulator answers phi(sigma(A)) as [lambda]sigma(A) using
            only the group oracle, and at C = Theta(log N) the transfer gives
            q >= Omega(sqrt(p)/log p) = p^{1/2-o(1)}. But that is not main's argument, which
            applies phi to coordinates the model forbids and charges C = 0 for the very operation
            being simulated; it is not main's overhead; and it is not novel, being a restatement
            of Wiener-Zuccherato, GLV and Duursma-Gaudry-Morain. (iii) The archive is unusually
            honest: EV-GGM-001 boundaries item 1 concedes in writing that "Under the strictest
            GGM, jet and endomorphism would be NON-SIMULABLE", and certificate kind none with
            verifier no-claim is the correct declaration for a measurement run. Item (ii) is
            REV-20260727-002's own hand derivation, is unreviewed, and is adopted as the basis of
            nothing here; it is assigned its own review as TASK-20260727-010.
          - >-
            EXP-GGM-001 DISPOSITION. No execution of version 1 is authorized by this decision, in
            this campaign or in any successor campaign, at sha256
            09931848d2dbe55aa998857db9653d763a5b327a2016dd56e8eab942a8a03c56. The reviewer's
            operative finding is that there is nothing to re-run: "the module contains no
            classifier to re-run: it would reprint the same eight literals. No re-execution
            should be authorized for version 1 in any form." RT-20260726-001 OBJ-02 remains a
            standing blocking objection. This decision does not set specification.yaml status or
            approved_by; both stay as they are, review_required and null, and approving a
            specification is a separate decision on a separate record. The nine-run execution is
            recorded as an out-of-lifecycle execution that confers no lifecycle status on the
            experiment and is not admissible as evidence for or against H-GGM-001. The nine run
            records are immutable and were not edited; their defects are recorded, never filled.
            Version 2 must REPLACE THE CLASSIFIER, not restate the definition around it - either
            a real decision procedure over a formal oracle grammar with the eight expected
            verdicts removed from the module's input, or an abandonment of the machine-checkable
            framing in favour of a hand-written derivation note per subject reviewed under rule
            12.
          - >-
            AGENTS.md RULE 12 IS NOT DISCHARGED BY ANYTHING IN THIS RECORD, AND THE HANDOFF
            CONFLICT IS RULED ON RATHER THAN LEFT OPEN. REV-20260727-002 requested
            review-breakthrough at max, resolved claude-opus-5 at reasoning_effort high, recorded
            fallback_used true and equivalence_to_requested_policy_claimed false, and states of
            itself: "It discharges rule 12 for nothing." RT-20260727-001 requested
            review-adversarial at xhigh and resolved the same model with the same disclosures. So
            rule 13's three-independently-resolved-models standard is not met by the pair either,
            and neither is rule 12's floor. TASK-20260727-002's frozen constraints told the
            reviewer to stop and return a policy-resolution failure if the floor could not be
            resolved, while the dispatching instruction told it to produce a caveated verdict;
            the reviewer followed the latter and recorded the conflict for the Coordinator.
            Ruling: the handoff governs on what the review DISCHARGES, and the answer is nothing;
            the verdict is nevertheless ADMITTED as a substantive review artifact, because its
            central findings are mechanically checkable by any reader against the committed
            source and do not depend on the reviewing model's judgement, and because discarding a
            verdict that identifies a tautological gate in favour of no verdict at all would
            leave a supra-toy-tier claim standing entirely unreviewed - the worse of the two
            failures. This ruling amends no frozen constraint; TASK-20260727-002's handoff is
            immutable and untouched. The consequence travels: a conforming re-review is required
            and is assigned as TASK-20260727-010, and no downstream record may cite
            REV-20260727-002 as discharging rule 12 for EXP-GGM-001 or for this decision.
          - >-
            REFUTATION ARTIFACT, NAMED AND LOCATED. This determination is not an adverse evidence
            transition, so the refutation-artifact gate of docs/claims-and-verification.md is not
            triggered by it; the artifact is named anyway because the determination is adverse to
            a committed claim. Tier 1, counterexample certificate: NOT AVAILABLE - the
            Weierstrass-twist invariance test that would produce one is pre-registered twice and
            has never been run, requires a new specification, and is not authorized here. Tier 2,
            derivation note: AVAILABLE and relied on -
            coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/reviews/TASK-20260727-002/review_report.yaml
            and the companion adversarial_notes.md, whose load-bearing steps require no
            mathematics at all, only reading simulability_test.py lines 27-92, 106-178, 271-274,
            295-299, 303-312 and 325-337. Labelled derivation, never proved. Tier 3,
            empirical_only: NOT AVAILABLE - there is no empirical content, since the seeds and
            bit sizes never touch a verdict. The artifact must be committed and its binding
            recorded before this decision is treated as durable; TASK-20260727-006 stops and
            records a binding failure if it cannot establish it.
          - >-
            SECONDARY DISPOSITION, RECORDED FOR THE BATCH CLOSE AND CHANGING NO STATUS.
            TASK-20260727-003 returned RT-20260727-001, barrier_verdict DOES_NOT_SURVIVE on
            BAR-PATHDYN-CONDTAIL-D2, and REJECTED-duplicate on novelty against
            inputs/idea_generation_20260718_batch2.md lines 1388-1397, the red-team note that
