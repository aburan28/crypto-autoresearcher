          - >-
            RULE 12 UNDISCHARGED AND RULE 13 UNMET. Both BATCH-009 producers ran fallback_used
            true below their requested policy floors on the same resolved model, claude-opus-5,
            which is also the model that produced REV-20260726-005 and RT-20260726-001. Agreement
            across those four sessions is corroboration by non-communicating sessions, not by
            independent model families, and it is weaker than four opinions. This decision is
