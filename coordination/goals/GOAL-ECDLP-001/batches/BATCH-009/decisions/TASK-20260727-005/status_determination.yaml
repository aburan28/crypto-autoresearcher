          - >-
            WHETHER THE FOUR AUGMENTED ORACLES ARE GGM-SIMULABLE IS INCONCLUSIVE AND IS NOT
            DECIDED HERE. The evidence in this record cannot discriminate between "the closure
            argument stands" and "the protocol cannot decide the question" AS TO THE ORACLES; it
