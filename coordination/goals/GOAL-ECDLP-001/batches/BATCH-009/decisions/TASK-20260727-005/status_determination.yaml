  # =========================================================================
  # 0. WHAT THIS IS AND WHAT IT IS NOT
  # =========================================================================
  nature_of_the_determination:
    process_ruling_or_substantive_finding: BOTH, ON TWO INDEPENDENT AXES
    process_axis: >-
      origin/main's EXP-GGM-001 archive was executed against a specification that reads status
      review_required with approved_by null, with no approve decision anywhere in
      ledger/decisions, and a closure claim above the toy tier was archived with no independent
      review of any kind (ESC-20260727-001 A1 and A2, independently reconfirmed as
      REV-20260727-002 P1_no_approval and P2_no_rule_12_review). These are process facts. A
      process-invalid execution is NOT negative evidence about any oracle, and none of it is
      used here as a substantive finding.
    substantive_axis: >-
      Independently of every process fact, the executed module implements no decision procedure
      and the reported 4/4 control gate cannot fail. That finding is derived from the committed
      source text and would stand UNCHANGED had EXP-GGM-001 been approved and reviewed
      perfectly. It is a substantive finding ABOUT THE ARTIFACT.
    third_axis_explicitly_not_decided: >-
      Whether the jet, elliptic-net, incidence or endomorphism oracle is in fact GGM-simulable
      is INCONCLUSIVE on this record and is NOT decided here, in either direction. Saying so
      plainly is the correct output; the evidence in front of me cannot discriminate.
    separation_statement_adopted_verbatim_from_the_review: >-
      "A process defect is not a mathematical finding, and a mathematical finding is not a
      process defect. Sections 5-9 and section 11 are independent."
    what_this_determination_is_not_evidence_for:
      - Not evidence for or against ECDLP hardness. KN-OPEN-001 is untouched.
      - Not evidence about prime-field ECDLP, index calculus, or any attack stage.
      - Not evidence that any of the four augmented oracles is, or is not, GGM-simulable.
      - Not evidence that any ECDLP candidate family is open that was previously thought closed.
      - Not a claim above claim_tier toy. Toy scale stays toy scale.
      - Not an impugnment of the co-driver's good faith. EV-GGM-001 boundaries item 1 concedes
        its own most damaging point in writing, which is what made the review tractable.

