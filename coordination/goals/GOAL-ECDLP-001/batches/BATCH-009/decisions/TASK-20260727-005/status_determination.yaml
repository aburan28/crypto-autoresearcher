  # =========================================================================
  # 2. THE REVIEW VERDICT, QUOTED VERBATIM
  # =========================================================================
  review_verdict_quoted:
    source: coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/reviews/TASK-20260727-002/review_report.yaml
    record_id: REV-20260727-002
    terminal_verdict: DOES_NOT_SURVIVE
    verdict_rationale_verbatim: |
      The two things under review both fail, on independent grounds, and the failures are
      substantive rather than procedural.
      The 4/4 control gate does not establish test soundness: it compares two hardcoded string
      literals held in the same source file, so it returns 4/4 for every possible execution and
      carries zero information; and even a genuine gate could not validate a lookup table, whose
      branches share no machinery. The figure itself appears in no run artifact.
      The scale-independent closure at exponent 1/2 fails for the jet oracle, the archive's
      headline, under BOTH models I formalised -- including the strongest available steelman,
      which I constructed in good faith and which does succeed in saving the control gate. It
      cannot save the jet closure, because the property that saves the gate (opaque labels) is
      the negation of the property main's jet simulator requires (readable coordinates). For the
      endomorphism oracle the SIMULABLE verdict is correct and exponent 1/2 genuinely is
      preserved -- but by a [lambda]-multiplication simulator the artifact never gives, at
      Theta(log N) rather than the reported C=0, and as a restatement of standard published
      results rather than a new closure.
      SURVIVES_WITH_SCOPE_REDUCTION was considered and rejected: no narrowing of scope rescues
      the jet closure, and the mechanism that produced all eight verdicts is not a test, so there
      is no reduced scope within which its output would be a result. CANNOT_DETERMINE was
      considered and rejected: everything needed was legible in the committed artifacts, and the
      module's source is unambiguous.
      Separately and without bearing on the above, the archive is process-invalid (no approval,
      no rule-12 review). That is stated as a process fact only.
    implemented_predicate_verbatim: |
      SIMULABLE if and only if the value of oracle_spec["name"] is one of the six string
      literals {pure_generic, public_curve, jet_oracle, elliptic_net_oracle,
      incidence_oracle, endomorphism_oracle}, and NON_SIMULABLE if it is discrete_log,
      encoding, or unrecognised -- that is, classify_oracle is a lookup table keyed on the
      subject's name, not a decision procedure.
    control_gate_finding_CG_1_verbatim: |
      The gate (lines 303-311) compares ORACLES[name]["expected_verdict"] against
      verdicts[name].verdict. The first is a source literal at lines 27-92; the second is
      a source literal at lines 121-178. Both were written by the same author in the same
      file and agree by construction. The comparison contains no free variable. Therefore
      controls_correct == 4 for every seed, every bit size, every curve, and indeed for
      every possible execution of the program. The frozen falsification_criterion -- "a
      single control misclassification falsifies the test's soundness" -- cannot fire. A
      gate that cannot fail carries zero information about soundness.
    nine_runs_finding_verbatim: |
      The `verdicts` dict is computed ONCE at lines 295-299, OUTSIDE the seed/bits loop at
      lines 325-337, and the SAME object is serialized into all nine run directories.
      overhead_C is not merely a static count; it is literally the same integer object written
      nine times. All nine raw-result.json are byte-identical (SHA-256 388c95d8b6a7...). The
      analysis_methodology.overhead_growth_check compared a constant to itself and had zero
      degrees of freedom. The N-independence claim underlying both headline closures rests on a
      check that could not have detected growth for any oracle under any circumstance.
    agreement_is_not_corroboration_verbatim: |
      This is agreement by construction, not replication: one classification serialized nine
      times.
    what_the_verdict_does_not_establish_verbatim:
      - It does not establish that the jet, elliptic-net, incidence or endomorphism oracle is
        non-simulable in fact. My section-5 table is a derivation offered for independent
        checking, not a theorem.
      - It does not establish that any ECDLP candidate family is open that was previously
        thought closed.
      - It does not impugn the co-driver's good faith. EV-GGM-001 boundaries item 1 concedes the
        most damaging point in writing, which is what made this review tractable.
      - It is not negative evidence about any oracle. A process-invalid, badly instrumented
        execution is not evidence in either direction (AGENTS.md rule 5).
    re_execution_finding_verbatim: |
      The question was decidable on paper from the committed artifacts and I decided it on
      paper. Re-executing simulability_test.py would be worthless in the strict sense that
      the module contains no classifier to re-run: it would reprint the same eight literals.
      No re-execution should be authorized for version 1 in any form.
    rule_12_statement_verbatim: |
      AGENTS.md rule 12 requires that a closure claim receive independent
      review-breakthrough review at max effort and states that review "may not be degraded
      or run on a backend that cannot reach it". THAT REQUIREMENT WAS NOT MET BY THIS
      REVIEW. This backend cannot reach the max floor. Per the handoff's own instruction I
      produced a verdict anyway rather than returning a policy-resolution failure, on the
      stated ground that an unreviewed claim is worse than a caveated one. The consequence
      must be carried forward explicitly: THIS VERDICT IS ITSELF SUBJECT TO LATER REVIEW ON
      A CONFORMING BACKEND, and no downstream record may cite REV-20260727-002 as
      discharging rule 12 for EXP-GGM-001. It discharges rule 12 for nothing. It is a
      substantive review that does not satisfy the policy floor the contract sets for the
      class of claim it examines.
    proof_status_recommendation_verbatim: |
      proof_status derivation requires "a written, self-contained argument ... checkable by an
      independent reader step by step" (docs/claims-and-verification.md). No such artifact
      exists: analysis.md asserts conclusions and cites a lookup table, and the module contains
      no derivation. I note candidly that empirical_only is itself generous here, since the runs
      measured nothing about any curve -- the seeds and bit sizes never touch a verdict. If the
      Coordinator prefers, not_applicable is defensible. What is NOT defensible is derivation.
    correction_of_the_escalation_in_mains_favour_verbatim: |
      The steelman is a real and defensible model, and it does MORE for main's result than
      ESC-20260727-001 allowed: under a properly formalised SGGM the control gate genuinely
      reaches 4/4, because publishing the curve equation does not de-anonymise an opaque
      label. ESC-20260727-001 horn 2 asserted that a uniform structured model forces the
      encoding control to flip to SIMULABLE. That step conflates "the curve equation is
      public" with "the coordinates of a labelled point are readable", and it is wrong. I
      record that in main's favour.
    reviewer_recommended_next_action_verbatim: |
      TASK-20260727-006 should return H-GGM-001 to status `specified` and issue a correction
      record against EV-GGM-001 per BO-5, citing this report; and should authorize NO
      re-execution of EXP-GGM-001 version 1, because the module contains no classifier to re-run
      -- the remedy is a version 2 that replaces the classifier, not a rerun that reprints eight
      literals.

  second_producer_verdict_quoted:
    source: coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/redteam/TASK-20260727-003/barrier_verdict.yaml
    record_id: RT-20260727-001
    subject: BAR-PATHDYN-CONDTAIL-D2
    barrier_verdict: DOES_NOT_SURVIVE
    novelty_finding: REJECTED-duplicate against inputs/idea_generation_20260718_batch2.md lines 1388-1397
    implication_verbatim: |
      BAR-PATHDYN-CONDTAIL-D2 does not survive this review, and a broken barrier is not a positive
      result for RT-1476-SUBRES-A1 - the gate is merely still open. ... THIS TASK DOES NOT CLOSE
      THE GATE, AND IT DOES NOT OPEN IT.
    bearing_on_H_GGM_001: >-
      NONE. Different subject matter. Recorded here only for the batch close and for the goal
      checkpoint.

  # =========================================================================
  # 3. THE DETERMINATION
  # =========================================================================
  determination:
    target: H-GGM-001
    prior_status_at_head: supported
    prior_status_provenance: >-
      Set by origin/main's DEC-20260726-007 and carried onto this branch by merge. It was never
      set by any decision authored on this branch; DEC-20260726-008 had left it at specified and
      DEC-20260727-001 explicitly declined to change it inside an ID repair.
    determined_status: specified
    exactly_one_status_determined: true

    reason: >-
      The review establishes a fact ESC-20260727-001 did not have and could not have had,
      because the ruling declined to read the implementation: the executed module contains no
      decision procedure at all. classify_oracle is an if/elif chain on oracle_spec name
      returning eight hardcoded string literals; there is no parser, no simulator constructor,
      no overhead checker and no witness generator, although specification.yaml
      implementation_requirements names all four. The control gate compares
      ORACLES[name]["expected_verdict"] (source literals, lines 27-92) against classify_oracle's
      return (source literals, lines 121-178), so controls_correct == 4 on every possible
      execution and the frozen falsification_criterion cannot fire. And the nine run directories
      are one computation serialized nine times: `verdicts` is computed once at lines 295-299
      outside the seed/bits loop at 325-337, all nine raw-result.json are byte-identical at
      SHA-256 388c95d8..., all 18 log files are 0 bytes, and the whole set spans 1.005 seconds.
      Consequently H-GGM-001 has NO evidential support whatsoever from this archive, and equally
      no evidential contradiction. A program that reads out its own inputs measures nothing. The
      eight verdicts are inputs to the program, not outputs of it. The hypothesis is therefore
      exactly where DEC-20260726-008 left it: it has a specified test, that test has never been
      validly approved, and - this is the new fact - the one execution that occurred did not
      implement the specified test. `specified` is not a rollback by authority. It is the status
      that states a fact: the claim is UNTESTED.

    the_question_the_handoff_asked_answered_directly:
      does_a_lookup_table_tested_hypothesis_have_any_evidential_support: >-
        NO. None. The evidential content of the nine runs with respect to H-GGM-001 is empty in
        both directions. This is not a low-strength result, an anecdotal result, or a weak
        result; it is the ABSENCE OF A MEASUREMENT. Any strength label above the floor would
        assert that something was observed about the hypothesis, and nothing was.
      what_status_honestly_represents_untested_rather_than_refuted: >-
        `specified`. The Research-states chain in AGENTS.md is proposed -> specified -> approved
        -> running -> analyzed -> replicated -> supported | weakened | rejected | inconclusive |
        superseded. Every status to the RIGHT of `running` asserts that a test was carried out
        and interpreted. `specified` is the last status on the chain that asserts only that a
        test exists on paper. That is precisely and only what is true here. `rejected` and
        `weakened` assert refutation or partial refutation; `inconclusive` asserts that a test
        ran and its data did not discriminate. All three would misdescribe the record by
        asserting that the specified test was executed. It was not.

    rejected_alternatives:
      - status: supported
        rejected_because: >-
          The terminal review verdict is DOES_NOT_SURVIVE. The 4/4 control gate on which
          DEC-20260726-007 rested cannot fail and appears in no run artifact; the jet closure,
          which that decision leads with, fails under both models the reviewer formalised,
          including the strongest available steelman which he constructed in good faith and
          which does save the gate; and strength `strong` was in any case unavailable for one
          unreplicated execution of a deterministic classifier over eight frozen strings.
          Additionally the claim sits above the toy tier and received no independent review at
          all, so rule 12 was never even attempted for it.
      - status: weakened
        rejected_because: >-
          `weaken` is an evidence-driven adverse transition and asserts that an observation
          lowered confidence in the mechanism. No observation about the mechanism exists.
          AGENTS.md rule 5 forbids treating an implementation failure as evidence against a
          mathematical hypothesis, and the reviewer states the point in terms: "It is not
          negative evidence about any oracle. A process-invalid, badly instrumented execution is
          not evidence in either direction (AGENTS.md rule 5)." The one candidate ground for
          weakening - that H-GGM-001 falsification_conditions item 4 fires textually for
          elliptic_net (O(log N)) and incidence (O(B^m)) - was examined and rejected on the
          reviewer's finding that item 4 is stated in a direction that does not follow: growth
          in C degrades the transferred bound to q >= Omega(sqrt(p)/C), which for C = O(log N)
          is p^{1/2-o(1)} with the exponent fully intact, rather than making the Shoup bound
          inapplicable. The reviewer's conclusion is adopted: "this protocol cannot adjudicate
          the elliptic-net and incidence subjects in EITHER direction. That is a finding of
          indeterminacy, not a falsification." A mathematically misstated falsifier cannot fire
          against the hypothesis it belongs to.
      - status: rejected
        rejected_because: >-
          Forbidden three times over. There is no counterexample certificate; the only
          derivation about the oracles is the reviewer's own eight-subject table, which he
          expressly labels "a derivation offered for independent checking, not a theorem" and
          which has itself received no review; and an empirical-only refutation on a single
          unreplicated run set takes weaken plus replication, never rejection
          (docs/claims-and-verification.md, "Refutation artifacts"). The run set is not even
          unreplicated-but-real: it is one computation written nine times.
      - status: inconclusive
        rejected_because: >-
          This was the closest competitor and it fails on a precise point. `inconclusive` is the
          status of a hypothesis whose test RAN and whose data did not discriminate between
          explanations. Recording it here would silently ratify the proposition that
          EXP-GGM-001 executed a test of H-GGM-001 and returned ambiguous data. It did not
          execute a test. The review is not ambiguous about the artifact; it is decisive about
          it, and the decisiveness is what removes the hypothesis from the tested branch of the
          chain entirely. The genuinely inconclusive question - whether the four oracles are
          GGM-simulable - is a question about the ORACLES, not about H-GGM-001's status, and it
          is recorded as inconclusive in the decision's limitations and in EV-GGM-002's
          unresolved_confounds rather than encoded as a hypothesis status it does not describe.
      - status: superseded
        rejected_because: >-
          `superseded` requires a successor hypothesis record to exist. None does.
          DEC-20260726-008 named one as a future obligation (correcting falsification condition
          4 to the T = Omega(sqrt(p)/C) form, the witness definition, assumptions item 2, and
          interpretation_limits item 1) and it has not been written. Marking a hypothesis
          superseded by a record that does not exist would leave a dangling status. The
          obligation is carried forward as a named successor task instead.
      - status: approved
        rejected_because: >-
          Not available and not sought. EXP-GGM-001 version 1 stays status review_required with
          approved_by null, RT-20260726-001 OBJ-02 remains a standing blocking objection against
          approving or executing it, and no execution is authorized by this determination under
          any outcome.

    independence_of_this_determination_from_the_ruling: >-
      ESC-20260727-001 section C recommended `specified`. This determination reaches the same
      status on a different and stronger ground, and it does not rest on the ruling's authority.
      The ruling reasoned that an execution had occurred which was process-invalid and
      model-inconsistent. The review establishes that the specified test was never implemented,
      so there was no execution of it to be invalid. The ruling's own decisive argument is also
      corrected here on the review's finding: horn 2 is "INCORRECT_AS_STATED" because it
      "conflates publicity of the curve EQUATION with readability of a labelled point's
      COORDINATES", and under a properly formalised structured GGM the encoding control survives
      and the gate genuinely reads 4/4. That correction is recorded in main's favour. The ruling
      reached the right destination by a partly wrong route; agreeing with its destination while
      correcting its route is what distinguishes a determination that rests on review from one
      that rests on authority.

  # =========================================================================
  # 4. REFUTATION-ARTIFACT BASIS
  # =========================================================================
  refutation_artifact_basis:
    is_the_determination_adverse_to_the_hypothesis: >-
      NO, in the technical sense that governs docs/claims-and-verification.md "Refutation
      artifacts". The determination is neither weaken, nor reject_scoped, nor a move to
      rejected. It withdraws an unearned promotion and returns the hypothesis to the untested
      status it held before that promotion. The refutation-artifact gate is therefore not
      triggered. The strongest available artifact is nevertheless identified and located below,
      because the withdrawal is adverse to a COMMITTED CLAIM (main's DEC-20260726-007 and
      EV-GGM-001) even though it is not adverse to the hypothesis.
    what_the_artifact_refutes: The archive's claim. Not the hypothesis, and not any oracle.
    tier_1_counterexample_certificate:
      available: "NO"
      why: >-
        No instance was constructed and no machine re-verification was performed. The check that
        would produce one - evaluating the frozen jet oracle on E and on its u-twist
        (x,y) -> (u^2 x, u^3 y) and comparing eps-coefficients - is pre-registered twice
        (RT-20260726-001 jet_oracle cheapest_check; REV-20260727-002 BO-3 concrete_fix) and has
        NEVER BEEN RUN. It requires a new experiment specification, is not authorized by
        anything currently in the ledger, and is not authorized here.
    tier_2_derivation_note:
      available: "YES"
      this_is_the_basis_relied_on: true
      artifact_paths:
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/reviews/TASK-20260727-002/review_report.yaml
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/reviews/TASK-20260727-002/adversarial_notes.md
      load_bearing_sections:
        - implemented_predicate, the one-sentence operative predicate derived from the source
        - control_gate_finding CG-1 through CG-4
        - specific_claim_checks.a, the same integer object written nine times
        - specific_claim_checks.e, agreement by construction rather than replication
        - per_run_consistency PR-1 through PR-5
        - adversarial_notes Part II sections 1, 2 and 5, and Part IV
      why_it_qualifies: >-
        It is checkable by an independent reader step by step and its central steps require no
        mathematics at all: read simulability_test.py lines 27-92, 106-178, 271-274, 295-299,
        303-312 and 325-337, and observe that the gate's two operands are literals in the same
        file and that the verdict dict is built once outside the loop. Every hash it quotes was
        computed from Git object content. Part IV reduces the whole dispute to one yes/no
        question a third party can answer by reading two source branches.
      archived_before_the_decision_that_relies_on_it: >-
        REQUIRED AND NOT YET DEMONSTRATED. The artifacts are present in a worktree reported
        clean at 6d6632fc, which is consistent with TASK-20260727-004 having committed them, but
        no snapshot receipt exists at the declared path and this session cannot verify a commit.
        The calling session MUST establish and record that binding before or as part of the
        ledger archive; if it cannot, the archive stops and records a binding failure rather
        than a research conclusion. See deviations_and_defects.D3.
      labelled_derivation_never_proved: true
    tier_3_empirical_only:
      available: "NO"
      why: >-
        There is no empirical content to declare. The seeds and bit sizes never touch a verdict;
        the nine raw results are byte-identical; nothing about any curve was measured.
    artifact_that_is_NOT_relied_on:
      what: REV-20260727-002's eight-subject hand derivation, uniform_verdict_tables models 1 and 2
      why_not: >-
        It is the reviewer's own mathematics about the oracles - the Weierstrass-twist argument
        for jet and elliptic_net NON_SIMULABLE, the Theta(B^m) bound for incidence, and the
        [lambda]-multiplication simulator for endomorphism. It is derivation-level, it is
        offered "for independent checking, not a theorem", and it has received NO review of its
        own. It is attributed to REV-20260727-002, carried as an open item, and adopted as the
        basis of NOTHING in this determination. Using an unreviewed hand derivation to move a
        hypothesis status would be the mirror image of the defect being corrected. Assigned for
        its own independent review as TASK-20260727-010.

  # =========================================================================
  # 5. STRENGTH DISCIPLINE: DOES THIS CONSTITUTE REPLICATION?
  # =========================================================================
  replication_question_answered_explicitly:
    question: >-
      Do 3 seeds x 3 bit sizes of a deterministic classifier over the same 8 frozen strings
      constitute replication?
    answer: >-
      NO, AND NOT MERELY BECAUSE THE CLASSIFIER IS DETERMINISTIC.
    reasoning: >-
      Two separate grounds, and the second is decisive on its own. FIRST: a deterministic
      procedure re-run on identical inputs produces agreement by construction; agreement that
      cannot vary carries no information, so even a genuine nine-fold re-execution would not be
      replication of anything. SECOND and stronger: there was no nine-fold re-execution. The
      `verdicts` dict is computed once at lines 295-299, before the loop at 325-337, and the
      same object is serialized into nine directories by one process in 1.005 seconds. All nine
      raw-result.json are byte-identical. The nine directories are nine copies of one write, not
      nine runs. Describing them as "9 runs (3 seeds x 3 bit sizes)" is accurate as a count of
      directories and false as a claim about executions.
    consequence_for_strength: >-
      strength `replicated` and `strong` are both unavailable as a matter of fact, independently
      of any judgement about the mathematics. EV-GGM-002 carries strength `inconclusive`.
    consequence_for_the_N_independence_claim: >-
      The identity of overhead_C across 8, 12 and 16 bits is a necessary consequence of
      serializing one integer object nine times, not a measurement. The overhead-growth check
      had zero degrees of freedom and could not have detected growth for any oracle under any
      circumstance. No N-independence claim is available from this run set at any strength. This
      was pre-registered as RT-20260726-001 falsification route XR-2 before the run existed.

