        evidence_refs:
          - EV-GGM-002
          - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/reviews/TASK-20260727-002/review_report.yaml
          - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/reviews/TASK-20260727-002/adversarial_notes.md
          - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/redteam/TASK-20260727-003/barrier_verdict.yaml
          - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/decisions/TASK-20260727-005/status_determination.yaml
          - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/decisions/TASK-20260727-005/decision_rationale.md
        evidence_note: >-
          EV-GGM-002 is the superseding evidence record for the same run set and is installed in
          the same ledger archive as this decision. EV-GGM-001, EV-ECDLP-007, REV-20260726-005,
          RT-20260726-001, DEC-20260726-007, DEC-20260726-008, DEC-20260727-001 and
          ESC-20260727-001 are the subject matter and the context; the escalation ruling is
          Coordinator direction living in coordination/ and is expressly NOT relied on as
          authority for this transition.
        limitations:
          - >-
            NOTHING IN THIS DECISION IS EVIDENCE FOR OR AGAINST ECDLP HARDNESS. Not about
            prime-field ECDLP, index calculus, any attack stage, any curve, or any candidate
            family. KN-OPEN-001 is untouched. No solve, no relation, no certificate and no cost
