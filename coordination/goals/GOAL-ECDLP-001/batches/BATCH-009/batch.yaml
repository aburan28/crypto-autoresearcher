batch:
  id: BATCH-009
  goal_id: GOAL-ECDLP-001
  question_ids: [RQ-ECDLP-002]
  authorizing_decision: DEC-20260727-002
  objective: >-
    Reduce two named uncertainties, both decidable on paper from already-committed
    artifacts and neither requiring any experiment compute, and then record one
    ruled-but-unwritten ledger transition.
    (1) Whether the control gate reported as 4/4 and the claimed scale-independent
    closure at exponent 1/2 in origin/main's EXP-GGM-001 archive survive an
    independent AGENTS.md rule-12 review at review-breakthrough / max, performed by a
    session that authored neither the execution nor the ESC-20260727-001 ruling that
    disputes it.
    (2) Whether BAR-PATHDYN-CONDTAIL-D2, the highest-value unrefuted barrier from
    Report 94, survives adversarial attack, and what its survival or failure implies
    for the standing live gate RT-1476-SUBRES-A1.
    (3) Author and archive the ESC-20260727-001 section C superseding decision on
    H-GGM-001's official status, on the strength of (1) rather than on a Coordinator
    verdict.
    This batch is NOT an attempt to solve ECDLP, to improve any attack, or to produce
    cryptographic evidence. It runs no experiment, authorizes no execution, and
    produces no result about prime-field ECDLP.
  status: ready_for_dispatch
  maximum_wall_clock_seconds: 9600
  max_concurrent: 2

  campaign_budget_position:
    maximum_batches_before_this_decision: 6
    maximum_batches_after_this_decision: 8
    extension_authorized_by: DEC-20260727-002
    batches_consumed_before_this_one: 7
    consumed_batch_ids: [BATCH-001, BATCH-002, BATCH-003, BATCH-004, BATCH-005,
      BATCH-006, BATCH-008]
    batches_remaining_after_this_one: 0
    exhausts_extended_campaign_batch_budget: true
    pre_existing_defect_named: >-
      Before this decision the goal record already carried 7 batch_checkpoints against
      campaign_budget.maximum_batches 6. That is a defect in the record, not a rounding
      question: the declared maximum was exceeded by one before BATCH-009 was
      contemplated. The seventh entry is BATCH-008, whose checkpoint carries
      TASK-20260719-043/044/045 and ledger_commit 6db269d0, i.e. task ids and a commit
      from 2026-07-19, earlier than BATCH-006's close-out on 2026-07-26. How that entry
      came to be appended to the list after BATCH-006 recorded the budget exhausted is
      NOT established by any committed record inspected while opening this batch, and no
      explanation is invented here. Setting maximum_batches to 8 makes the declared
      budget consistent with the 7 batches actually consumed and admits exactly one
      further batch, this one. It is an extension, stated explicitly, not a silent
      overrun.
    wall_clock_budget_note: >-
      campaign_budget.total_wall_clock_seconds stays 28800 and is NOT extended. It is
      also not auditable: BATCH-005 has no coordination record and logged no elapsed
      time, so the campaign tally cannot be reconstructed. BATCH-009 is therefore
      bounded independently at 9600 seconds (3600 + 2700 + 1800 + 600 + 900 across its
      five cards) and the campaign wall-clock figure is treated as unverifiable rather
      than as satisfied.

  goal_record_not_edited_in_this_batch_opening:
    status_unchanged: paused
    why: >-
      Opening this batch changes no official status. GOAL-ECDLP-001 stays paused, its
      campaign_budget.maximum_batches still reads 6 in the record, current_batch_id
      still reads BATCH-008, and its single next_action still points at the co-driver's
      BATCH-008 scoped-revision work. Extending a budget is authorized by a decision
      record; applying it to the operational anchor is a goal checkpoint, and
      templates/research-records.md restricts that to a Coordinator ledger archive.
      Editing the record here would also risk clobbering a concurrently-running
      co-driver's next_action from a stale copy.
    interim_inconsistency_recorded: >-
      For the duration of this batch the goal record understates the authorized batch
      budget and points at a different batch. This is deliberate, is recorded in
      DEC-20260727-002 limitations, and is remedied by TASK-20260727-006, which
      reconciles the goal record against its then-current committed content rather than
      against any copy read today.
    who_applies_it: TASK-20260727-006

  rerank_basis:
    verified_checkpoint_commit: ab59e26bbf5fb06248b3a4ae2fb4306fb57c8144
    branch_tip_at_open: 21ed454c
    selected_frontier: >-
      Ledger-integrity and review debt around the EXP-GGM-001 closure claim, plus the
      single unrefuted barrier from Report 94 whose survival would move a live gate.
    selection_reason: >-
      Three grounds. First, ESC-20260727-001 section F item 1 names the independent
      rule-12 review of main's execution as the highest-value open item in the program,
      and its own author states the horn argument should be tested by someone who did
      not write it. Second, ESC-20260727-001 section C ruled that H-GGM-001's status
      requires a superseding decision and that decision has still not been written, so
      the ledger currently carries H-GGM-001 as supported while the goal record's
      BATCH-006 claim_boundary says it stays specified - a live contradiction between
      two committed records. Third, Report 94 generated 63 candidates with ZERO
      constructive survivors; of the 15 never-refuted candidates all 15 are Group-D
      barriers, and BAR-PATHDYN-CONDTAIL-D2 is the only one whose survival would move a
      live gate and it costs no experiment compute. There is no cheaper honest work
      available on this goal.
    excluded_frontiers:
      - >-
        Executing EXP-GGM-001 version 1. Explicitly and absolutely out of scope. The
        specification is status review_required with approved_by null, DEC-20260726-008
        authorized no execution, and RT-20260726-001 OBJ-02 is a standing blocking
        objection against approving or executing version 1.
      - >-
        Authoring EXP-GGM-001 version 2 (one frozen model variant for all eight
        subjects). It is the correct next design step but it should follow, not precede,
        the independent review of what version 1 actually produced.
      - >-
        Running the minimal_test in BAR-PATHDYN-CONDTAIL-D2 (7 primes x 10^4 5-tuples).
        The point of selecting this barrier is that its premises are attackable on paper
        first. An experiment contract, if any, is an output of TASK-20260727-003, not an
        input.
      - >-
        Repairing the knowledge corpus (see known_open_defects). It needs its own
        decision and its own batch.
      - >-
        TASK-20260727-001, the ESC-20260727-001 section E provenance audit of the 9 run
        directories. Its id is reserved by that ruling and is deliberately not reused
        here. It is complementary to TASK-20260727-002 and is the recommended first item
        of the next batch, but running both concurrently would have the auditor and the
        reviewer reading the same run directories under two cards.
      - Any crypto-scale claim, live-key target, or breakthrough assertion.

  review_package_binding:
    method: prior_commit_plus_reviewer_verified_hash
    rationale: >-
      Everything TASK-20260727-002 reviews is already committed and unmodified at the
      branch tip. A snapshot archive must change exactly its declared paths, so these
      files cannot be re-snapshotted: staging unchanged content produces an empty diff
      and fails the post-commit verifier. The pre-review snapshot obligation is
      discharged the way BATCH-006 discharged it - the reviewing session must, before
      interpreting anything, resolve the commit that supplies each reviewed path,
      confirm the path is clean at HEAD, compute its SHA-256 from Git object content
      (never from the working tree), and record commit, path and hash in its own report.
      A review that cannot establish this binding stops and reports a binding failure
      instead of a verdict.
    reviewed_paths_for_TASK-20260727-002:
      - experiments/EXP-GGM-001/specification.yaml
      - experiments/EXP-GGM-001/analysis.md
      - experiments/EXP-GGM-001/simulability_test.py
      - experiments/EXP-GGM-001/runs/  (all 9 RUN-GGM-s{1,2,3}-b{8,12,16} directories)
      - ledger/evidence/EV-GGM-001.yaml
      - ledger/decisions/DEC-20260726-007.yaml
      - ledger/hypotheses/H-GGM-001.yaml
    reviewed_paths_for_TASK-20260727-003:
      - research/idea_generation_20260727_claude_candidates.yaml
      - research/idea_generation_20260727_claude.md
    binding_values_recorded_by: [TASK-20260727-002, TASK-20260727-003]

  producer_task_ids: [TASK-20260727-002, TASK-20260727-003, TASK-20260727-005]
  snapshot_archive_task_id: TASK-20260727-004
  ledger_archive_task_id: TASK-20260727-006
  independent_review_task_ids: [TASK-20260727-002, TASK-20260727-003]

  archive_claim_map:
    TASK-20260727-002: TASK-20260727-004
    TASK-20260727-003: TASK-20260727-004
    TASK-20260727-005: TASK-20260727-006
  review_required_note: >-
    Every card carries review_required false, as in BATCH-006 and for the same reason:
    the two producers ARE the independent reviews, and the third producer is a
    Coordinator determination that the ledger archive installs. Setting review_required
    true on a review would demand an independent reviewer of the reviewer, which this
    batch does not budget and does not need.

  batch_opening_archive:
    kind: snapshot
    owned_by: >-
      No in-queue card. It is the Coordinator batch-opening commit, declared to the
      dispatching session by the Coordinator that authored this batch, and executed and
      verified by that session. Recorded here so the commit is not invisible to the
      record.
    expected_parent: 21ed454c
    declared_paths:
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/batch.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/dispatch_queue.json
      - ledger/decisions/DEC-20260727-002.yaml
      - ledger/handoffs/TASK-20260727-002.yaml
      - ledger/handoffs/TASK-20260727-003.yaml
      - ledger/handoffs/TASK-20260727-004.yaml
      - ledger/handoffs/TASK-20260727-005.yaml
      - ledger/handoffs/TASK-20260727-006.yaml
    structural_fix_applied: >-
      This opening commit stages BATCH-009/dispatch_queue.json itself. Both BATCH-004
      and BATCH-006 ended with a queue advertising completed work as dispatchable
      because the post-commit verifier only checks paths the archive itself declared,
      so a batch's own queue was invisible to it. ESC-20260727-001 reconciliation notes
      section 6 names the durable fix as "make each archive claim the queue that governs
      it". Applied here at the opening, and required again of TASK-20260727-006 at the
      close.

  positive_branch: >-
    If TASK-20260727-002 finds that the reported control gate and the closure claim
    survive scrutiny, the section C determination records H-GGM-001 at the status that
    review supports, the superseding evidence record states the surviving scope, and the
    batch closes having removed a disputed claim from dispute. That is still not
    approval to execute EXP-GGM-001 version 1 and still not a crypto-scale result.
  negative_branch: >-
    If TASK-20260727-002 finds the gate or the closure does not survive, the
    determination records the scoped consequence for H-GGM-001 and EV-GGM-001, names the
    first unmet obligation, and authorizes no execution. A defect in a protocol or in a
    record is a statement about that protocol or record. It is never evidence that any
    oracle is or is not GGM-simulable, and never evidence about ECDLP hardness.
  inconclusive_branch: >-
    If the review cannot discriminate between "the closure argument stands" and "the
    protocol cannot decide the question", the determination records inconclusive, names
    the exact unresolved obligation, and leaves H-GGM-001 wherever the review's own
    reasoning supports. Inconclusive is a permitted and honest landing.

  excluded_peripheral_work:
    - Implementing, modifying, or executing simulability_test.py or any oracle simulator.
    - Executing EXP-GGM-001 version 1 or any other experiment, at any scale.
    - Editing anything under experiments/EXP-GGM-001/. Run records are immutable and a
      gap in them is recorded, never filled.
    - Editing knowledge/ (see known_open_defects), any ledger record outside
      TASK-20260727-006's declared write scope, or any BATCH-001..008 record.
    - Running the BAR-PATHDYN-CONDTAIL-D2 minimal_test or any other measurement.
    - Testing live keys, deployed systems, or private targets.
    - Any crypto-scale, breakthrough, or universal-impossibility claim.

  known_open_defects:
    - id: DEFECT-KNOWLEDGE-CONFLICT
      severity: high
      found_while: opening BATCH-009
      statement: >-
        Eighteen files at the branch tip carry unresolved Git conflict markers
        (<<<<<<< / ======= / >>>>>>>), including knowledge/INDEX.md,
        knowledge/findings/KN-FIND-001.md, knowledge/findings/KN-FIND-002.md, six
        ledger/decisions records (DEC-20260724-007, -008, -009, DEC-20260725-001, -002)
        and ten ledger/handoffs records. knowledge/INDEX.md contains two mutually
        exclusive tables, one declaring 128 entries and one declaring 7638, and lists
        KN-FIND-001 and KN-FIND-002 twice each with different titles. In particular the
        ID KN-FIND-002 is claimed both by "Rare-event density gates are settled exactly
        by fibering over solutions" and by main's GGM closure finding, which is an ID
        collision of exactly the class ESC-20260727-001 section D adjudicated for
        DEC-20260726-007.
      why_not_repaired_here: >-
        It is outside this batch's objective, it needs its own Coordinator decision on
        which record keeps each ID, and a blind resolution would silently pick a side in
        eleven records including immutable ones. It is recorded, not fixed.
      blocking_scope: >-
        It does NOT block BATCH-009: none of the reviewed EXP-GGM-001 artifacts,
        EV-GGM-001, DEC-20260726-007, H-GGM-001 or GOAL-ECDLP-001 is among the conflicted
        files. It DOES block any knowledge promotion, which is why knowledge/ is outside
        every write scope in this batch.
      recommended_next_action: >-
        A dedicated Coordinator decision and repair batch, taking precedence over further
        research work on this branch.
    - id: DEFECT-BATCH-004-ARCHIVE
      severity: recorded_irreparable
      statement: >-
        BATCH-004's ledger archive card TASK-20260726-004 remains blocked at 7 of 8
        post-commit checks; the failing check is message_contains_task_id and the failure
        lives in published history that AGENTS.md forbids rewriting. Carried forward
        unchanged. No waiver is granted by this batch.

  next_action: >-
    Dispatch TASK-20260727-002 and TASK-20260727-003 concurrently in two separate
    non-originating independent sessions, neither of which authored ESC-20260727-001,
    main's EXP-GGM-001 execution, or H-GGM-001.
  created_at: '2026-07-27'
  created_at_precision: >-
    Date only. The authoring Coordinator session has no clock or shell access and does
    not fabricate a wall-clock time; the committing session may record the exact commit
    time in its receipt.
  updated_at: '2026-07-27'
