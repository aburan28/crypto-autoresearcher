  claims:

    - id: D1
      statement: >-
        For family J0 the genuine endomorphism rank bound is 2, not 3. End(E)
        for an ordinary j = 0 curve over F_p with p congruent to 1 mod 3 is an
        order in the imaginary quadratic field Q(zeta_3), a Z-module of rank 2,
        and phi satisfies phi^2 + phi + 1 = 0 in End(E). The three distinct
        scalars 1, phi, phi^2 span a rank-2 Z-module. Since r in EXP-ENDO-001 is
        a coordinate count, the frozen value genuine_r_bound 3 is wrong.
      basis: derivation
      refutes: 'experiments/EXP-ENDO-001/specification.yaml inputs.curve_families[J0].genuine_r_bound'
      disagreement_with_source_review: >-
        RT-20260728-001 B1 asks for genuine_r_bound 2 for BOTH CM families. That
        is not right for J1728, where End(E) contains Z[i] of rank 2 generated
        by 1 and i, and the contract already sets 2. The defect is confined to
        J0. The correction is smaller than the review states and is recorded
        smaller here.
      independently_checkable_by: 'reading End(E) for a CM curve of discriminant -3; no computation'

    - id: D2
      statement: >-
        On family J0, for every rank r at least 3, every prime subgroup order N
        at least 3 and every k, the infinity-norm first minimum of the witness
        lattice W_r is exactly 1. By Vieta on L^2 + L + 1 = 0 mod N the two
        roots sum to -1, so lambda_1 + lambda_2 + lambda_3 = 0 mod N
        identically; hence the integer vector (1, 1, 1, 0, ..., 0 | 0, ..., 0)
        lies in W_r for every k, its infinity norm is 1, and no nonzero integer
        vector has infinity norm below 1.
      basis: derivation
      upgradeable_to: certificate
      upgrade_procedure: >-
        Instantiate on one real j = 0 curve with a prime-order subgroup and
        report p, b, N, k, the three eigenvalues with their on-curve
        phi_i(P) = [lambda_i]P checks, an HNF basis of W_3, and the enumerated
        first minimum. Package it so independent code re-checks it.
      refutes: >-
        EXP-ENDO-001 prediction P2 and H-ENDO-001 prediction 2, which predict a
        first minimum of about N^(1/(2r)), i.e. log_N of it equal to 1/6 at
        r = 3 and 1/8 at r = 4, on cells the contract labels GENUINE. The true
        value is log_N(1) = 0 at every field size.
      scope_of_the_refutation: >-
        Family J0 only, ranks r at least 3 only. It says nothing about r = 1 or
        r = 2, nothing about J1728 or GEN, and nothing about P1 or P3.
      cells_affected_in_the_frozen_run_set: >-
        40 cells - ranks 3 and 4, four field sizes, five seeds - which would
        have entered the S2 regression at y = 0 and are NOT removed by the
        exact-enumeration restriction, since a first minimum of 1 is enumerated
        immediately.
      independently_checkable_by: 'Vieta on a monic quadratic over Z/N; two lines, no computation'

    - id: D3
      statement: >-
        Let R_r be the eigenvalue relation lattice, the set of integer vectors c
        with sum c_i lambda_i = 0 mod N. R_r is attacker-constructible, since it
        depends only on N and the public lambda_i, and has index N in Z^r
        because lambda_1 = 1 is a unit. Then R_r x R_r is contained in W_r(k)
        for every k, and the intersection of W_r(k) over all k in [1, N-1] is
        exactly R_r x R_r for N at least 3 - take k = 1 and k = 2, subtract, get
        B = 0 and then A = 0. Every vector of R_r x R_r has Q-side combination
        B = 0, which is not invertible mod N, so it yields no discrete logarithm
        and is exactly the case CTRL-CERT already excludes. Conclusion - every
        vector of W_r an attacker can write down without knowing k carries zero
        information about k.
      basis: derivation
      refutes: 'nothing in the contract directly; it explains D2 and sharpens D4'
      why_it_matters: >-
        The short vectors that collapse the J0 r >= 3 first minimum to 1 lie
        inside R_r x R_r, the information-free sublattice. The collapse is
        shortness in exactly the coordinates that cannot help. Generically,
        when the lambda_i admit no small integer relation, R_r has determinant N
        in dimension r and first minimum about N^(1/r), which is LONGER than the
        N^(1/(2r)) that W_r as a whole attains - so the constructible part is
        generically the longer one and in the degenerate case the shortest
        possible one, and is useless in both.
      independently_checkable_by: 'the k = 1 and k = 2 subtraction; index bookkeeping N, N^2, N'

    - id: D4
      statement: >-
        W_r(k) is not attacker-constructible - its congruence coefficient vector
        is (lambda_i, k lambda_i) and involves the unknown k - and constructing
        it would already solve the instance. Given a basis of W_2(k), a rank-4
        integer lattice of determinant N, LLL returns in polynomial time a
        nonzero vector of infinity norm O(N^(1/4)) up to a dimension-4 Hermite
        factor, and any witness with B invertible mod N yields k = -A/B mod N,
        checkable by [k]P = Q. Therefore the pinned determinant is NOT what
        makes the shortness unexploitable; non-constructibility is, one step
        earlier, at the construction of the object to be searched.
      basis: derivation
      refutes: >-
        The STEP 5 dichotomy of EXP-ENDO-001 - that a falling rho(r) would mean
        either the determinant is not pinned or the balanced split is not the
        best decomposition - which omits the operative explanation; and the
        corresponding mechanism attribution in H-ENDO-001.
      scope_stated_narrowly: >-
        A statement about the class of attacks that construct and then reduce
        W_r AS DEFINED IN EXP-ENDO-001 STEP 1. NOT a statement about ECDLP, NOT
        about endomorphism-assisted attacks in general, and NOT an impossibility
        claim of any kind. The known correct way endomorphisms help - the
        automorphism-quotient rho at about 0.886 sqrt(N/|Aut|) - is untouched,
        is a constant factor of at most sqrt(6), and is outside target class.
      independently_checkable_by: 'the LLL bound in dimension 4 and the k = -A/B recovery'

