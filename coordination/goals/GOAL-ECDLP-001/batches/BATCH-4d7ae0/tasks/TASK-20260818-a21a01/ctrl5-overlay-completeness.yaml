    procedure: >-
      Each of the five predecessor/successor pairs is parsed to YAML,
      flattened to leaf paths (lists indexed positionally), and diffed into
      added / removed / changed sets. Each diff is mapped to an
      overlays_in_this_successor entry (the companion artifacts' diffs map
      to the same overlay ids declared in specification.yaml, plus
      IDENTITY-AND-SUPERSESSION for session-identity re-authoring). The
      old/new values recorded below are the PARSER'S EMITTED VALUES, not
      hand-authored summaries (RT-A70C90-B3, BATCH-158345); values longer
      than 160 characters are truncated with an explicit marker. The twelve
      V4 items are compared field-by-field between the successor and the
      frozen baseline EXP-SYC-793304. The should-differ list (fields that
      name this task, batch, session, branch, archive task, or reviewers)
      is checked for actual difference. SHA-256 digests of the
      specification files and of this task's own declared artifacts are
      computed with shasum -a 256, and every closed-form numeric literal
      touched by D2 and D4 is recomputed with python3 (3.12.8, decimal
      module, 60-digit precision, ROUND_HALF_UP at six places).
    executed_by: this producer session (TASK-20260818-a21a01)
    experiment_runs: 0
    backend_contacted: false

