  peak_memory_custody:
    rule: 'peak_live_bytes_system = max_t( B_0(t) + shared(t) + sum_j concurrent_nonshared_shard_j(t) - dedup(t) )'
    rt_obj_f_setup_private_term: >-
      RT-OBJ-F: the setup process's private (neither shared nor shard)
      allocation B_0(t) is concurrently live and must be charged. BLOCK-5
      (BATCH-7d9b78): the B_0 term now reaches this file's operative rule as
      well as the merged-lane formula (specification.yaml
      merged_parallel_lane_exp_syc_75f7d2.repair_item_C_system_peak_live_bytes
      .replacement_rule.frozen_formula, max_t ( B_0(t) + S(t) +
      sum_{j=1..8} B_j(t) )). The pre-repair rule quoted in
      specification.yaml blocker_repairs.SYSTEM-PEAK-LIVE-CONCURRENCY
      .pre_repair_rule_quoted omitted B_0. FORBIDDEN-R7 (omitted-setup-stream)
      is added and KAT-PEAK-F exercises B_0 > 0 and is in the set an
      implementation is REQUIRED to pass.
    shards_required: 8
    streams_required: 10
    stream_list: setup-private stream (B_0) plus shared/setup context plus one complete allocation-event stream per BSGS shard
    receipt_requirement: >-
      one complete timestamped allocate/free event stream per shard plus the
      shared context stream plus the setup-private stream, all on one host
      monotonic clock; every stream participates in the time-aligned aggregate,
      not in a maximum
    missing_shard: invalidates
    missing_shared_stream: invalidates
    missing_setup_private_stream: invalidates
    multi_host_execution: invalidates
    sampled_or_polled_census: invalidates
    averaging_or_dividing: forbidden
    reuse_of_a_five_way_maximum: forbidden
    no_invariance_claim: true
    dedup_custody:
      definition: >-
        dedup(t) = sum over physical pages P live at t of (c_P(t) - 1) *
        bytes(P), where c_P(t) counts how many of the TEN accounting terms
        {setup_private(B_0), shared, nonshared_1..nonshared_8} charge P at t
      evidence_requirement: page-level census
      unproved_duplication: set to zero, so it can never reduce the reported peak
      shared_counted_exactly_once: true
    kats: coordination/goals/GOAL-ECDLP-001/batches/BATCH-4d7ae0/tasks/TASK-20260818-a21a01/verification-and-null-kats.yaml
    kats_note: >-
      KAT-PEAK-1 through KAT-PEAK-7 are byte-identical to EXP-SYC-dc854f's
      (which carried them byte-identical from EXP-SYC-ff777e /
      EXP-SYC-793304). KAT-PEAK-F (RT-OBJ-F, the setup-private B_0 term) is
      carried forward and, per BLOCK-5 (BATCH-7d9b78), is now in the set an
      implementation is REQUIRED to pass (required_by_this_successor in the
      KAT file). The parallel-lane KAT-PEAK-A through KAT-PEAK-F with
      FORBIDDEN-R1 through R7 are carried in specification.yaml's
      merged_parallel_lane_exp_syc_75f7d2 section.
    measured_values_present: false
    new_residual:
      id: PEAK-AGGREGATE-FIT-UNPROVED
      statement: >-
        the unchanged maximum_memory_gb ceiling of 2 binds an aggregate over
        TEN concurrently live streams (the setup-private B_0 stream, the
        shared/setup context, and the eight non-shared shard streams) rather
        than a per-shard maximum; the aggregate can exceed any single per-shard
        figure by up to eightfold and no byte figure exists, so fit is
        unproved. Carried forward from EXP-SYC-793304 and EXP-SYC-ff777e;
        BLOCK-5 propagates B_0 to this rule and census but does not close it.
        D2 (BATCH-4d7ae0) widens the bounded quantity further: the corrected
        bounds in physical-frontier-compiler.yaml now carry max_t B_0(t), so
        the residual is strictly wider than in the predecessor and no byte
        figure for B_0 exists; disclosed in specification.yaml
        new_residual_created_by_this_repair.
      cap_raised: false
      disposition: OPEN_CARRIED_FORWARD_AND_WIDENED_BY_D2

