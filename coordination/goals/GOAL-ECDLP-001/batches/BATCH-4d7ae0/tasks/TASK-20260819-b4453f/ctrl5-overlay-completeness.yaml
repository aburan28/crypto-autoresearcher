  # ---------------------------------------------------------------------------
  # CTRL-5 is the red team whole-file overlay-completeness diff: every
  # difference from the predecessor (EXP-SYC-4725b3, the first 55th-batch
  # successor) must map to an overlays_in_this_successor entry, AND every
  # field that SHOULD have differed because it names this task, this batch,
  # this session, this branch, this archive task, or the reviewers must
  # actually differ. Per VAL-D50C44-N3 / RT-A70C90-M1 (BATCH-158345) this
  # successor CTRL-5 covers ALL FIVE comparable artifact pairs, not
  # specification.yaml alone. It is mechanical and needs zero experiment
  # runs.
  #
  # RT-DB50A3-D2 (BATCH-4d7ae0, second successor), stated plainly: CTRL-5 as
  # recorded is the POST-AUTHORING completeness pass. No pre-authoring pass
  # is recorded, and none is claimed. The ctrl5-first ordering requirement of
  # batch.yaml is satisfiable only for the predecessor-side checks (the
  # frozen predecessor bytes were available before this successor was
  # written); the successor-side diff is necessarily post-authoring.
  # ---------------------------------------------------------------------------

  method:
    tool: >-
      python3 with PyYAML, SafeLoader subclass whose mapping constructor
      raises on a repeated key (duplicate keys rejected), single-document
      parse required. The interpreter version is captured verbatim in
      version_capture below (RT-DB50A3-N3); the declared version string is
      taken from the captured output, not from memory.
    version_capture: |
      Python 3.12.8
      PyYAML 6.0.3
    files_compared:
      - {predecessor: experiments/EXP-SYC-4725b3/specification.yaml, successor: experiments/EXP-SYC-c5f30f/specification.yaml}
      - {predecessor: coordination/goals/GOAL-ECDLP-001/batches/BATCH-4d7ae0/tasks/TASK-20260818-a21a01/physical-frontier-compiler.yaml, successor: coordination/goals/GOAL-ECDLP-001/batches/BATCH-4d7ae0/tasks/TASK-20260819-b4453f/physical-frontier-compiler.yaml}
      - {predecessor: coordination/goals/GOAL-ECDLP-001/batches/BATCH-4d7ae0/tasks/TASK-20260818-a21a01/verification-and-null-kats.yaml, successor: coordination/goals/GOAL-ECDLP-001/batches/BATCH-4d7ae0/tasks/TASK-20260819-b4453f/verification-and-null-kats.yaml}
      - {predecessor: coordination/goals/GOAL-ECDLP-001/batches/BATCH-4d7ae0/tasks/TASK-20260818-a21a01/custody-and-executable-contract.yaml, successor: coordination/goals/GOAL-ECDLP-001/batches/BATCH-4d7ae0/tasks/TASK-20260819-b4453f/custody-and-executable-contract.yaml}
