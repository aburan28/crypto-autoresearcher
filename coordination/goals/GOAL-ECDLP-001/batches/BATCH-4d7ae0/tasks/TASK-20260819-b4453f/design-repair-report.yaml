  # ---------------------------------------------------------------------------
  # PROMINENT LIMITATION STATEMENT. This copy is byte-identical to
  # experiments/EXP-SYC-c5f30f/specification.yaml prominent_ha2_limitation_
  # statement (VAL-7FA865-N5, BATCH-7d9b78: the predecessor report presented a
  # paraphrase as verbatim; the specification's copy is the authoritative one
  # and is quoted here without alteration; the byte-identity is re-verified by
