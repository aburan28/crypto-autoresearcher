      literals_propagated_verbatim_from: >-
        ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-080a9c.yaml preserved_repairs
      conclusion: >-
        The expected per-tuple value remains below capacity 32 at both gamma_x
        slices under the stated convention. This is a mean statement only. It
        certifies neither aggregate compiler occupancy nor overflow probability.

    HA2_tail_contract:
      tuplewise:
        status: SUPPLIED_SHARP_NON_CERTIFYING
        bound: 'P(X >= 33) <= mu/33'
        values: {bits_18: '0.015151515152', bits_21: '0.013498465426', bits_24: '0.012025765545', bits_27: '0.010713739109', bits_30: '0.009544856439', ceiling_gamma_x_1_over_3: '0.030303030303'}
        serialization_convention: twelve decimal places, half-up rounding of the long division
        item_A_note: relabeled from "truncation of the long division"; stored values unchanged. Carried forward, not re-touched.
      familywise:
        status: NOT_SUPPLIED_PROVED_UNAVAILABLE
        union_bound: '98304 * mu / 33 = 2978.909090909091 * mu'
        union_bound_family_size_note: 'm = 98304 (valid but threefold-loose); the operative distinct-variable count is m = 32768 (RT-82A8CB-OBJ7); the vacuity conclusion holds under both counts'
        values: {bits_18: '1489.454545', bits_21: '1326.953145', bits_24: '1182.180856', bits_27: '1053.203409', bits_30: '938.297567', ceiling_gamma_x_1_over_3: '2978.909091'}
        vacuous_at_every_size: true
        second_moment_route: >-
          also vacuous: non-vacuity would require kappa*mu <= 0.011077880859375
          while kappa >= 1 and mu >= 0.3149802624737183 on this ladder
        v2_note: >-
          V2 fix restores five supporting-prose sub-fields of the lemmas behind
          these numbers, verbatim, in specification.yaml's blocker_repairs
          block. No number, bound, or conclusion on this page changes.
      worst_case:
        status: SUPPLIED_AND_NEGATIVE
        bound: 8*(L-1)
        adequacy: FAIL_not_worst_case_safe
      route_b_bit_width_note: >-
        ITEM B FIX (carried forward, not re-touched): widening candidate_index
        to at least 8*(L-1)+1 = 8185 admissible values at bits 30 needs at
        least a 13-bit index (2^13=8192 >= 8185, 2^12=4096 insufficient). This
        route is still NOT taken; only the arithmetic is corrected. See
        full_derivation.
      full_derivation: experiments/EXP-SYC-c5f30f/specification.yaml blocker_repairs.HA2-EXPECTATION-NOT-TAIL

    DERIV1_regression_only:
      formula: worst_case_per_tuple_bound/N
      rows:
        - {bits: 18, N: 262144, worst_case_per_tuple_bound: 504, expected_occupancy_literal: '0.0019226074218750', margin_vs_32: 16644.063492}
        - {bits: 21, N: 2097152, worst_case_per_tuple_bound: 1016, expected_occupancy_literal: '0.0004844665527344', margin_vs_32: 66052.031496}
        - {bits: 24, N: 16777216, worst_case_per_tuple_bound: 2040, expected_occupancy_literal: '0.0001215934753418', margin_vs_32: 263172.015686}
        - {bits: 27, N: 134217728, worst_case_per_tuple_bound: 4088, expected_occupancy_literal: '0.0000304579734802', margin_vs_32: 1050628.007828}
        - {bits: 30, N: 1073741824, worst_case_per_tuple_bound: 8184, expected_occupancy_literal: '0.0000076219439507', margin_vs_32: 4198404.00391}
      authority: non-authoritative regression table; the HA-2 rows above govern calibration
      bits27_correct_literal: '0.0000304579734802'
      bits27_exact_identity: 4088 / 134217728 = 0.000030457973480224609375
      changed_in_this_successor: none

    overflow: >-
      any realized tuple occupancy above 32 invalidates without truncation,
      replacement, sampling, or silent saturation
    adequacy_disposition: >-
      Expected occupancy is below 32 at both HA-2 slices under the zero-o(1)
      arithmetic convention. Worst-case adequacy is established as FALSE, and
      simultaneous-tail adequacy is proved unobtainable from the committed
      heuristics. Overflow invalidation is therefore mandatory, not optional.

  peak_live_bytes_accounting:
    composition: >-
      time_aligned_aggregate_of_all_concurrently_live_streams_with_shared_counted_once
    system_rule: 'peak_live_bytes_system = max_t( B_0(t) + shared(t) + sum_j concurrent_nonshared_shard_j(t) - dedup(t) )'
    rt_obj_f_setup_private_term: >-
      RT-OBJ-F: the setup process's private (neither shared nor shard)
      allocation B_0(t) is concurrently live and must be charged. BLOCK-5
      (BATCH-7d9b78): the B_0 term now reaches this page's system_rule as well
      as the merged-lane formula (specification.yaml
      merged_parallel_lane_exp_syc_75f7d2.repair_item_C_system_peak_live_bytes
      .replacement_rule.frozen_formula is max_t ( B_0(t) + S(t) +
      sum_{j=1..8} B_j(t) )), with the retained bracket's upper bound widened
      by max_t B_0(t). FORBIDDEN-R7 (omitted-setup-stream) is added and
      KAT-PEAK-F exercises B_0 > 0 and is in the set an implementation is
      REQUIRED to pass. D2 (BATCH-4d7ae0): the PRIMARY-BASE bracket on this
      page is NOW also extended -- interval_arithmetic.lower/upper carry
      B_0_lo/B_0_hi and bounds.lower_bound_rule/upper_bound_rule carry max_t
      B_0(t), so both the merged-lane bracket and the primary-base bracket are
      widened by max_t B_0(t); see d2_b0_at_all_four_rule_sites for the
      KAT-PEAK-F hand derivation.
    shard_index_range: j = 1 through 8
    synchronized_time_base:
      clock: one host monotonic clock, CLOCK_MONOTONIC_RAW, single source for all TEN streams
      event_model: timestamped signed byte deltas forming right-continuous step functions
      evaluation: exact at every event timestamp in the merged event set
      sampling: forbidden
      multi_host: invalidates; no cross-host peak may be reported
      skew_tolerance: zero by construction; a single clock source is required rather than a measured skew bound
    dedup_term:
      definition: 'dedup(t) = sum over physical pages P live at t of (c_P(t) - 1) * bytes(P)'
      accounting_terms: 'c_P(t) counts how many of the TEN accounting terms {setup_private(B_0), shared, nonshared_1..nonshared_8} charge page P at t'
      range: '0 <= dedup(t) <= B_0(t) + shared(t) + sum_j nonshared_j(t) - M(t), where M(t) = max over the TEN accounting terms of the bytes that term charges at t'
      range_correction_note: >-
        RT-DB50A3-B1 (BATCH-4d7ae0, second successor): the predecessor range
        '0 <= dedup(t) <= sum_j nonshared_j(t)' was FALSE -- with B_0 and
        shared on the same page and no nonshared term, dedup(t) = 4096 > 0 =
        sum_j nonshared_j(t). The corrected bound holds by construction:
        dedup(t) = total_charged(t) - union_live_bytes(t), where
        total_charged(t) = B_0(t) + shared(t) + sum_j nonshared_j(t), and
        union_live_bytes(t) >= M(t) because each term's charged bytes at t are
        a subset of the live pages. The bound is tight for the one-page,
        two-term instance (B_0 = shared = 4096 on one page, no nonshared:
        dedup = 4096 = total_charged - M).
      unproved_duplication: set to 0
      shared_counted_exactly_once: true
    union_size_lemma: >-
      RT-DB50A3-B1 (BATCH-4d7ae0, second successor). Let U(t) be the union of
      the bytes of the physical pages live at t. Each of the TEN accounting
      terms charges only bytes of pages it keeps live, so its charged bytes at
      t are a subset of U(t). Hence U(t) >= B_0(t), U(t) >= shared(t), and
      U(t) >= nonshared_j(t) for every j = 1..8. Since
      peak_live_bytes_system = max_t U(t): max_t B_0(t) <=
      peak_live_bytes_system and max_j max_t nonshared_j(t) <=
      peak_live_bytes_system. This is the property the lower bound rests on;
      it is a set-containment statement, not a heuristic.
    interval_arithmetic:
      lower: 'max_t( B_0_lo(t) + shared_lo(t) + sum_j nonshared_lo_j(t) - dedup_hi(t) )'
      upper: 'max_t( B_0_hi(t) + shared_hi(t) + sum_j nonshared_hi_j(t) - dedup_lo(t) )'
      dedup_lo_default: 0
      dedup_hi_definition: 'B_0_hi(t) + shared_hi(t) + sum_j nonshared_hi_j(t) - M_lo(t), the corrected over-count bound (dedup_term.range) evaluated on the hi/lo envelopes, with M_lo(t) the maximum over the TEN terms of that term''s lo envelope'
      applies_to: candidate stage, rho stage, and BSGS stage alike
    bounds:
      lower_bound_rule: 'max( max_t B_0(t), max_j max_t nonshared_j(t) ) <= peak_live_bytes_system'
      lower_bound_rule_note: >-
        RT-DB50A3-B1 (BATCH-4d7ae0, second successor): re-derived from the
        union_size_lemma above -- max_t B_0(t) <= max_t U(t) =
        peak_live_bytes_system and, for each j, max_t nonshared_j(t) <= max_t
        U(t), hence their maximum is bounded. The predecessor stated this rule
        without the lemma; the rule itself is unchanged.
      upper_bound_rule: 'peak_live_bytes_system <= max_t B_0(t) + max_t shared(t) + sum_j max_t nonshared_j(t)'
      coincide_only_when: all per-stream peaks are simultaneous
    d2_b0_at_all_four_rule_sites: >-
      D2 (BATCH-4d7ae0, first successor TASK-20260818-a21a01; count reading
      fixed by RT-DB50A3-D1 in this second successor): the setup-private B_0
      term is present at all FIVE rule sites on this page -- system_rule
      (already present from BLOCK-5, BATCH-7d9b78), plus the FOUR sites the
      first successor's D2 repair added: interval_arithmetic.lower (B_0_lo),
      interval_arithmetic.upper (B_0_hi), bounds.lower_bound_rule (max_t B_0
      as a lower-bound disjunct), and bounds.upper_bound_rule (max_t B_0 as an
      additive term). The field name d2_b0_at_all_four_rule_sites counts the
      four sites the D2 repair added, not the page total of five. KAT-PEAK-F
      hand derivation for the corrected bounds, using the KAT-PEAK-F fixture
      values (B_0 peak 4096 bytes, all nonshared and shared terms 0): lower
      bound max( max_t B_0(t), max_j max_t nonshared_j(t) ) = max(4096, 0) =
      4096 <= 4096 = peak_live_bytes_system; upper bound
      peak_live_bytes_system = 4096 <= max_t B_0(t) + max_t shared(t) + sum_j
      max_t nonshared_j(t) = 4096 + 0 + 0 = 4096. Both directions hold with
      equality. RT-DB50A3-M1 (this second successor): KAT-PEAK-F now asserts
      BOTH bound halves -- expected_lower_bound 4096 and expected_upper_bound
      4096 -- plus a must_reject entry for the lower-bound-omits-b0-disjunct
      rule (wrong_value 0), so the fixture discriminates the lower-bound
      repair as well as the peak computation; the lower-bound half rests on
      the union_size_lemma above.
    stage_reporting_rule: >-
      the reported axis value is the single global max over t across the whole
      run; per-stage aggregates are diagnostic only and their maximum equals the
      global value only if the stages are evidenced to be time-disjoint
    census_completeness:
      streams_required: 10
      missing_stream: invalidates
      averaging_or_dividing: forbidden
      reuse_of_a_five_way_maximum: forbidden
    eight_way_effect: >-
      The eight-way BSGS baseline contributes eight concurrently live non-shared
      allocations that are now summed at aligned times rather than maximized
      across streams. Widening from five to eight can change the system peak;
      no shard-invariance is proved or asserted.
    kats: coordination/goals/GOAL-ECDLP-001/batches/BATCH-4d7ae0/tasks/TASK-20260819-b4453f/verification-and-null-kats.yaml
    kats_note: >-
      KAT-PEAK-1 through KAT-PEAK-7 byte-identical to EXP-SYC-dc854f's; not
      re-touched. KAT-PEAK-F (RT-OBJ-F, the setup-private B_0 term) is carried
      forward and, per BLOCK-5 (BATCH-7d9b78), is in the set an implementation
