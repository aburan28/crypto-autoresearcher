    - id: D2-B0-NOT-AT-ALL-FOUR-RULE-SITES
      source_checkpoint: BATCH-158345
      source_findings: [VAL-D50C44-B2, RT-A70C90-BLOCKING-1]
      checkpoint_statement_verbatim: >-
        physical-frontier-compiler.yaml line 262 system_rule includes B_0, but
        lines 294-295 (lower_bound_rule and upper_bound_rule) are carried forward
        byte-identical from the predecessor with no B_0 term. The upper bound
        omits B_0 while the peak it bounds includes B_0, so the bound is FALSE
        whenever B_0(t) > 0 -- exactly the KAT-PEAK-F fixture (B_0 = 4096).
      required_fix: >-
        Propagate B_0 to ALL FOUR rule sites (system_rule already has it; add it
        to lower_bound_rule and upper_bound_rule) so the upper bound reads
        peak_live_bytes_system <= max_t( B_0(t) + shared(t) + sum_j
        concurrent_nonshared_shard_j(t) ) and holds for KAT-PEAK-F. Re-derive the
        KAT-PEAK-F inequality by hand and record the derivation.
    - id: D3-VERIFICATION-METHOD-ASSERTED-AND-DENIED
      source_checkpoint: BATCH-158345
      source_findings: [VAL-D50C44-B3, RT-A70C90-BLOCKING-3]
      checkpoint_statement_verbatim: >-
        The successor still asserts a parsed-YAML structural diff as the
        verification method in some sites while the ctrl5 artifact's method and
        the companion artifacts deny or cannot support it; the leaf-level
        accounting does not reconcile with the documents.
      required_fix: >-
        State the verification method truthfully and consistently across ALL
        artifacts -- either actually run the parsed-YAML diff (name the exact
        command and paste the field list it produced, correcting actions_not_
        taken accordingly) or state plainly that the fields were compared by
        reading and the parsed-YAML verification is delegated to the review
        tasks. Do not assert a mechanized check the package also denies.
    - id: D4-M98304-ARITHMETIC-PLUS-FALSIFIED-NOMISMATCH-CLAIM
      source_checkpoint: BATCH-158345
      source_findings: [VAL-D50C44-B4, RT-A70C90-BLOCKING-4]
      checkpoint_statement_verbatim: >-
        specification.yaml line 1468 (m_98304_variant) and design-repair-report.
        yaml line 633 declare (1965.347055, 1833.733644, 1710.933986,
        1596.357856, 1489.454545). Under the closed form min(1, 98304 *
        2^(-bits/30) / 33) at six-decimal ROUND_HALF_UP, bits 21 should be
        1833.733643 and bits 27 should be 1596.357855 (each +1 ulp as declared).
        The "no mismatch was found" note is falsified by the two errors.
      required_fix: >-
        Correct bits 21 to 1833.733643 and bits 27 to 1596.357855 in BOTH
        specification.yaml and design-repair-report.yaml. HARD REQUIREMENT:
        actually run a python3 Decimal recompute at >= 60-digit precision with
        ROUND_HALF_UP at six places for EVERY closed-form literal and paste the
        ACTUAL command output; then correct or remove the "no mismatch was
        found" note to match the recomputation.
    - id: NON-BLOCKING-CARRY
      source_checkpoint: BATCH-158345
      source_findings: [VAL-D50C44-N1, VAL-D50C44-N2, VAL-D50C44-N3, VAL-D50C44-N4, VAL-D50C44-N5, VAL-D50C44-N6, VAL-D50C44-N7, RT-A70C90-MAJOR-1, RT-A70C90-MAJOR-2, RT-A70C90-MAJOR-3, RT-A70C90-MAJOR-4]
      checkpoint_statement_verbatim: >-
        The 54th batch's dual-REVISE left seven validator non-blocking findings
        (VAL-D50C44-N1..N7) and the red team's four major / three moderate /
        seven minor findings open, plus the three capacity residuals and
        PEAK-AGGREGATE-FIT-UNPROVED (widened by D2's B_0 without disclosure).
      required_fix: >-
        Address each by ID in the successor, or carry it forward as an explicit
        visible open line. None is blocking; none may be silently dropped.
