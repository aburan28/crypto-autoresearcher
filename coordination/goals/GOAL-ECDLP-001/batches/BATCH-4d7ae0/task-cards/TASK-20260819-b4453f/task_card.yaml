        pre-repair lower bound passes KAT-PEAK-F identically.
      required_fix: >-
        Extend KAT-PEAK-F to assert BOTH bound halves: expected_lower_bound
        4096 and expected_upper_bound 4096, plus a must_reject entry for the
        lower-bound-omits-b0-disjunct rule (wrong_value 0), and state that
        the lower-bound half rests on the union-size property now stated in
        the compiler (RT-DB50A3-B1). KAT-PEAK-F is the only fixture with
        B_0 > 0, so with the bound assertions it discriminates the
        lower-bound repair as well as the peak computation.
