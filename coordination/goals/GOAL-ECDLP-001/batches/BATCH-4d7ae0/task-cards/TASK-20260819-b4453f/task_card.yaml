  findings_to_fix:
    - id: RT-DB50A3-B1
      source_review: TASK-20260818-db50a3
      severity: blocking
      checkpoint_statement_verbatim: >-
        physical-frontier-compiler.yaml line 297 dedup_term.range reads
        '0 <= dedup(t) <= sum_j nonshared_j(t)' and is byte-identical from the
        predecessor. It is FALSE: with B_0 and shared on the same page and no
        nonshared term, dedup(t) = 4096 > 0 = sum_j nonshared_j(t). The
        lower_bound_rule is refutable under the declared range: the range
        admits instances on which the lower bound fails, so the frozen
        contract contains a false mathematical statement.
      required_fix: >-
        Propagate the census into the range: set dedup_term.range to the
        correct over-count bound 0 <= dedup(t) <= B_0(t) + shared(t) + sum_j
        nonshared_j(t) - M(t), where M(t) is the maximum over the TEN
        accounting terms of the bytes that term charges at t (equivalently
        dedup(t) = total_charged(t) - union_live_bytes(t) and
        union_live_bytes(t) >= M(t)); state the union-size lemma (each term's
        charged bytes at t are a subset of the live-page union U(t), hence
        U(t) >= B_0(t), U(t) >= shared(t), U(t) >= nonshared_j(t) for every
        j, and peak_live_bytes_system = max_t U(t) >= max_t B_0(t) and >=
        max_j max_t nonshared_j(t)); re-derive the lower_bound_rule from the
        lemma; and make interval_arithmetic consistent with the corrected
        bound (dedup_hi(t) is the corrected over-count bound evaluated on the
        envelopes).
    - id: RT-DB50A3-B2
      source_review: TASK-20260818-db50a3
      severity: blocking
      checkpoint_statement_verbatim: >-
        ctrl5-overlay-completeness.yaml recomputation.d4_gamma_0_over_1_exception
        declares formula '32768 * 2^(-bits/30) / 33' but the specification's
        closed form is min(1, 32768 * 2^(-bits/3) / 33); the recorded value
        0.969697 is correct for the specification's formula, and the stated
        formula yields 496.484848 at bits 30.
      required_fix: >-
        Set the formula string to 'min(1, 32768 * 2^(-bits/3) / 33)' and
        re-run the recomputation with the ACTUAL command output pasted.
        No recorded value changes.
    - id: RT-DB50A3-B3
      source_review: TASK-20260818-db50a3
      severity: blocking
      checkpoint_statement_verbatim: >-
        ctrl5-overlay-completeness.yaml recomputation.d4_familywise_5_over_18_m_98304
        declares formula '98304 * 2^(-bits/30) * (5/18) / 33', which generates
        NONE of the five recorded values (it yields 545.929738, 509.370456,
        475.259441, 443.432738, 413.737374); the true generating form is
        98304 * 2^(-bits/18) / 33 (the 5/18 is the gamma value, not a
        multiplier), and the ceiling row 2978.909091 = 98304/33 sits outside
        the stated family.
      required_fix: >-
        Set the formula string to '98304 * 2^(-bits/18) / 33 (equivalently
        98304 * mu / 33 with mu = 2^(-bits/18) at gamma_x = 5/18)' and record
        the gamma 1/3 ceiling row 2978.909091 under its own closed form
        98304/33 at E[X] = 1; re-run the recomputation with the ACTUAL
        command output pasted. No recorded value changes.
    - id: RT-DB50A3-M1
      source_review: TASK-20260818-db50a3
      severity: major
      checkpoint_statement_verbatim: >-
        The KAT-PEAK-F hand derivation is non-discriminating for the
        lower-bound half: NEW lower bound max(4096, 0) = 4096 <= 4096 passes;
