  moderate:

    - id: RT-0F62F9-D1
      severity: moderate
      title: >-
        The design-repair-report B3 disposition MISQUOTES the very defect it
        repairs and leaks a Python string-munging artifact into a frozen record
      class: false_verbatim_quotation_in_a_repair_disposition
      attacks_claim:
        - 'design-repair-report.yaml:727-728, second_successor_repairs RT-DB50A3-B3.what_this_successor_does'
      exact_residual: >-
        The field reads, verbatim across the line fold: "The formula label
        '98304 * 2^(-bars/30) * (5/18) / 33'.replace('bars','bits') (which
        generates none of the five recorded values) is corrected to ...".
        Two things are wrong. First, the quoted predecessor label is not what
        the predecessor says: TASK-20260818-a21a01 ctrl5:1754 reads
        "six-decimal ROUND_HALF_UP of 98304 * 2^(-bits/30) * (5/18) / 33" --
        "bits", not "bars", and with a leading "six-decimal ROUND_HALF_UP of"
        that the quotation drops. Second, the string carries a literal Python
        method call, .replace('bars','bits'), appended to a YAML scalar. That is
        an authoring or templating artifact, not prose, and it is now immutable.
        The same quotation is rendered CORRECTLY in
        ctrl5-overlay-completeness.yaml b3_familywise_5_over_18_m_98304
        .correction_note ("98304 * 2^(-bits/30) * (5/18) / 33"), so the package
        contradicts itself about the verbatim text of the defect it is
        repairing.
        No number, bound, or disposition depends on it, and the repair itself is
        correct. It is recorded here because a batch whose whole subject is
        record integrity should not carry a misquotation of its own source
        inside a blocking-item disposition.
      falsification_route: >-
        grep -n "bars" over the task directory: two hits, both in
        design-repair-report.yaml:727-728. Then read TASK-20260818-a21a01
        ctrl5:1754 for the true predecessor string, and the successor ctrl5 b3
        correction_note for the correct rendering.
      required_to_clear: 'quote the predecessor label verbatim and remove the .replace() artifact'
      changes_any_ecdlp_claim: false

    - id: RT-0F62F9-D2
      severity: moderate
      title: >-
        The B2 correction_note states the min is ACTIVE at bits 30, which is
        exactly backwards -- bits 30 is the only ladder size at which it does
        NOT bind
      class: false_explanatory_statement_in_a_blocking_item_repair_note
      attacks_claim:
        - 'ctrl5-overlay-completeness.yaml recomputation.b2_gamma_0_over_1_exception.correction_note: "At bits 30 the min is active and the value is 32/33"'
      exact_residual: >-
        Under the corrected formula min(1, 32768 * 2^(-bits/3) / 33), this red
        team computed the unclipped value at every ladder size: bits 18 ->
        15.515152, bits 21 -> 7.757576, bits 24 -> 3.878788, bits 27 ->
        1.939394, bits 30 -> 0.969697. The min BINDS at bits 18, 21, 24 and 27
        (where it returns 1) and DOES NOT BIND at bits 30 (where 32/33 < 1 and
        the min returns the unclipped value). The note gives the min being
        active as the REASON the recorded value is 32/33; if the min were active
        the value would be 1. The specification agrees with this red team and
        against the note: evaluated_gamma_x_0_over_1.rows_m_32768 records
        clipped_bound 1 at bits 18/21/24/27 and 32/33 at bits 30, and
        non_vacuous_at reads "bits 30 only (32/33 = 0.9696969697 < 1)".
        A charitable reading of "active" as merely "the min operator is
        present" exists; under that reading the sentence is vacuous rather than
        false. Either way it does not explain what it is offered to explain, in
        the repair note for a blocking finding.
      falsification_route: >-
        Evaluate min(1, 32768*2^(-b/3)/33) at b = 18, 21, 24, 27, 30 at 60+
        digits and record whether the clip binds. It binds at four of five sizes
        and not at bits 30. Cross-read specification.yaml
        evaluated_gamma_x_0_over_1.
      required_to_clear: 'state that at bits 30 the min does NOT bind, which is why the recorded value is 32/33 rather than 1'
      changes_any_ecdlp_claim: false
      changes_any_numeric_row: false

    - id: RT-0F62F9-D3
      severity: moderate
