        The block is presented as captured stdout but NO COMMAND IS RECORDED
        NEXT TO IT, unlike the digests and recomputation blocks. Line 1,
        "Python 3.12.8", is the stdout shape of `python3 --version`. Line 2,
        "PyYAML 6.0.3", is the stdout of NO standard invocation: `python3 -c
