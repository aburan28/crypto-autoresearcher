        recomputed, this entry is one of the FIVE recomputation entries with no
        pasted command output (see RT-0F62F9-M1), and the receipt own list of
        recomputed literals does not include the mu column at all.
        STATED FAIRLY: no specification value, bound, table, or disposition is
        wrong because of this, and the entry CONCLUSION survives -- 2^(-7/6) at
        16 places is 0.4454493590701696 by truncation and 0.4454493590701697 by
        half-up, so the VAL-D50C44-N4 undeclared-serialization-convention carry
        is correctly stated. What is wrong is a forty-digit number asserted as
        exact in the artifact whose entire purpose is to certify the arithmetic
        of this package, in a batch whose D4 defect class is verbatim "numeric
        error plus falsified verification claim".
      falsification_route:
        - step: 1
          action: >-
            Run: python3 -c "from decimal import *; getcontext().prec=150;
            print(Decimal(2)**(Decimal(-7)/Decimal(6)))" and read the first 40
