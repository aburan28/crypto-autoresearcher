  per_claim_findings:

    B1_corrected_dedup_range_and_union_lemma:
      status: HOLDS
      claim_attacked: >-
        physical-frontier-compiler.yaml dedup_term.range '0 <= dedup(t) <=
        B_0(t) + shared(t) + sum_j nonshared_j(t) - M(t)', union_size_lemma,
        interval_arithmetic.dedup_hi_definition, bounds.lower_bound_rule_note,
        and specification.yaml overlay R1-B1-DEDUP-RANGE-AND-UNION-LEMMA.
      what_holds: >-
        THE BOUND IS TRUE. Writing total_charged(t) = B_0(t) + shared(t) +
        sum_j nonshared_j(t) and U(t) for the union of the bytes of the pages
        live at t, the record own definition dedup(t) = sum over live pages P of
        (c_P(t) - 1)*bytes(P) gives dedup(t) = total_charged(t) - U(t) whenever
        every live page is charged by at least one term, and U(t) >= M(t)
        because each term charged bytes at t are a subset of U(t). Hence
        dedup(t) <= total_charged(t) - M(t), which IS the recorded range.
        This red team constructed the three instances the review brief names and
        the bound holds, tightly, on all three:
        (a) B_0 and shared each charging ONE 4096-byte page, all eight nonshared
        zero -- the instance that FALSIFIED the predecessor range. total_charged
        = 8192, M = 4096, U = 4096, dedup = 4096; the corrected range asserts
        4096 <= 8192 - 4096 = 4096. HOLDS with equality. The predecessor range
        asserted 4096 <= 0 and was FALSE.
        (b) shared + nonshared_1 + nonshared_2 all charging ONE 4096-byte page.
        total_charged = 12288, M = 4096, U = 4096, dedup = 8192; range asserts
        8192 <= 12288 - 4096 = 8192. HOLDS with equality.
        (c) the FULL TEN-TERM instance, all ten terms charging one 4096-byte
        page. total_charged = 40960, M = 4096, U = 4096, dedup = 36864; range
        asserts 36864 <= 40960 - 4096 = 36864. HOLDS with equality.
        Multi-page separation (B_0 on page A, shared on page B) gives dedup = 0
        <= 8192 - 4096 = 4096, HOLDS strictly.
        THE UNION-SIZE LEMMA IS VALID. U(t) >= B_0(t), U(t) >= shared(t) and
        U(t) >= nonshared_j(t) for each j are set-containment facts, and
        peak_live_bytes_system = max_t U(t) follows from the system_rule
        combined with the identity dedup = total_charged - U that the
        range_correction_note states. The lemma is therefore not a heuristic, as
        the record says.
        THE LOWER BOUND IS ACTUALLY RE-DERIVED, NOT MERELY ASSERTED.
        lower_bound_rule_note derives max(max_t B_0(t), max_j max_t
        nonshared_j(t)) <= peak_live_bytes_system from the lemma, and the
        RT-DB50A3-B1 limb (b) counterexample (nonshared_1 = 4096, all else 0,
        dedup = 4096) is now EXCLUDED by the corrected range, which caps dedup
        at 0 + 0 + 4096 - 4096 = 0 there. This red team could not reconstruct
        it or any variant.
        INTERVAL ARITHMETIC IS CONSISTENT. dedup_hi = B_0_hi + shared_hi + sum_j
        nonshared_hi_j - M_lo is a true upper bound on dedup(t) (since
        total_charged(t) <= total_hi and M(t) >= M_lo(t)), so
        interval_arithmetic.lower = max_t(total_lo - dedup_hi) really is a lower
        bound on max_t U(t), and interval_arithmetic.upper with dedup_lo = 0 is
        a true upper bound. Both directions verified by hand.
      residual: 'see RT-0F62F9-M3 (no control discriminates the repair) and RT-0F62F9-N5 (the 0 <= limb is not derived)'

    B2_B3_formula_labels_generate_recorded_values:
      status: PARTIALLY_HOLDS
      claim_attacked: >-
        ctrl5 recomputation.b2_gamma_0_over_1_exception and
        .b3_familywise_5_over_18_m_98304, and the header assertion that every
        closed-form numeric literal touched by B2/B3/D2/D4/M1 was recomputed at
        60-digit precision with ROUND_HALF_UP at six places.
