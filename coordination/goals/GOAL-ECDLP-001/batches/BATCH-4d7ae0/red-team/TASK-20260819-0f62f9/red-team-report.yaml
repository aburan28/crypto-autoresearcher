      class: residual_of_the_b3_repair_in_the_field_a_mechanical_checker_reads
      attacks_claim:
        - 'ctrl5-overlay-completeness.yaml recomputation.b3_familywise_5_over_18_m_98304.formula (a single string) and .result'
        - 'RT-DB50A3-B3 required_to_clear, which asked for the gamma_x = 1/3 ceiling row to be recorded UNDER ITS OWN CLOSED FORM'
      exact_residual: >-
        The entry records six values: bits_18 through bits_30 and
