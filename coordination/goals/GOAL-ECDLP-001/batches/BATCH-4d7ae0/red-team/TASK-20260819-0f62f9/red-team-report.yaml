      attacks_claim:
        - 'ctrl5-overlay-completeness.yaml method.tool: "The interpreter version is captured verbatim in version_capture below (RT-DB50A3-N3); the declared version string is taken from the captured output, not from memory"'
        - 'ctrl5 method.version_capture, a two-line literal block: "Python 3.12.8" / "PyYAML 6.0.3"'
        - 'specification.yaml overlay R12-N3-VERSION-CAPTURE: "The interpreter version output (python3 --version, PyYAML version) is captured as a fenced verbatim block in ctrl5, and the declared version string is taken from the captured output"'
        - 'design-repair-report.yaml RT-DB50A3-N3 disposition: REPAIRED'
