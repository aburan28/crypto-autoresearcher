        - 'specification.yaml overlay R5-M2-PASTED-COMMAND-OUTPUTS, asserting the Decimal recomputation is pasted for every closed-form literal'
      exact_residual: >-
        The entry declares formula '2^(-21/18) = 2^(-7/6)' and exact_prefix
        0.4454493590701696523701131027952562539935 -- forty decimal places.
        The true value is
        0.4454493590701696523701131027952562539936063079390802016918... The
        FORTIETH decimal digit is 6, not 5. The declared string is therefore
        neither a prefix (truncation) nor a rounding of the exact value:
        ROUND_DOWN at 40 places gives ...539936 and ROUND_HALF_UP at 40 places
        also gives ...539936. It matches nothing.
        This red team confirmed the digit by TWO INDEPENDENT ROUTES, one of
        which uses no transcendental function at all:
        (i) Decimal at 150-digit precision, 2**(Decimal(-7)/Decimal(6)) =
        0.4454493590701696523701131027952562539936063079390802016918;
        (ii) a Newton iteration solving x^6 = 2^-7 = 1/128 from x0 = 0.44,
        converging to the identical 58 digits, with x^6 reproducing
        0.0078125000000000000000000000000000000000000000000000000000.
        THE PACKAGE IS CONTRADICTED BY ITS OWN FIRST-ROUND REVIEW. The
        first-round validator TASK-20260818-e0fa83 line 434 records, from its
        own independent computation, "2^(-7/6) =
        0.4454493590701696523701131027952562539936" -- the CORRECT value. That
        review is the review this successor exists to repair and which it claims
        to have answered item by item; the correct digit was available in it and
        the wrong digit was carried forward BYTE-IDENTICAL from the first
        successor (TASK-20260818-a21a01 ctrl5:1769). The wrong form traces
        further back to the 54th validator TASK-20260817-d50c44 line 1003.
        Nothing in the package flags any of this.
