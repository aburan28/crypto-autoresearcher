  verdict_statement: >-
    REVISE-worthy. This is a materially stronger package than its predecessor and
    most of it survives adversarial attack. D3 is repaired to a standard this red
    team could not break: an independent from-scratch reimplementation of CTRL-5
    reproduces ALL 25 declared count fields exactly, the enumerated path sets are
    set-equal to the computed diff sets with zero missing and zero spurious
    entries across all 508 rows, every row maps to a declared overlay id, and
    ZERO of the 508 recorded old and new values deviates from the parser-emitted
    value -- which is the precise thing RT-A70C90-B3 falsified in the
    predecessor. D1 substance holds: every digest the package records is the true
    on-disk SHA-256, independently recomputed here and independently confirmed by
    the snapshot receipt seven path_sha256 values. D4 core numeric fix holds:
    98304*2^(-bits/30)/33 at 60+ digits with ROUND_HALF_UP at six places yields
    exactly 1965.347055, 1833.733643, 1710.933986, 1596.357855 and 1489.454545,
    present in BOTH specification.yaml line 1519 and design-repair-report.yaml
    lines 630 and 703, and the falsified exact-rational no-mismatch note is
    genuinely replaced. All twelve V4 restorations are byte-exact against the
    frozen baseline; all 24 should-differ fields actually differ; no unchanged
    leaf anywhere in the five compared pairs still carries a predecessor-identity
    token; all three carried-forward residuals 3256009664, 3285369792 and
    7132160, the row-sum 5563755264, the communication symmetry, the occupancy
    bound, capacity 32, the 13-bit correction and the DERIV-1 literal transcribe
    without drift; no preserved closure is weakened; and no ECDLP assertion in
    either direction was found.
    What does NOT hold is D2 and part of the D4 verification record. The D2
    repair leaves a FALSE mathematical statement in a frozen contract -- the same
    class the batch declared blocking -- because it propagated B_0 to the two
    bounds rules while leaving dedup_term.range un-propagated, and the newly
    strengthened lower_bound_rule is refutable under that very range; the
    mandated KAT-PEAK-F hand derivation provably cannot detect this, because the
    pre-repair lower bound passes KAT-PEAK-F identically. And the ctrl5
    recomputation block -- the artifact whose entire purpose is to certify the
    arithmetic under D4 -- carries TWO entries whose stated formula does not
    generate its own stated values, each under an explicit
    matches-the-stored-values verdict. Neither of those two changes any
    specification numeric value or any conclusion; both are exactly the
    unsupportable-method-claim class that D3 and D4 were ruled blocking for.
    NO ECDLP CLAIM IS MADE OR CONTRADICTED BY THIS REPORT IN EITHER DIRECTION.

