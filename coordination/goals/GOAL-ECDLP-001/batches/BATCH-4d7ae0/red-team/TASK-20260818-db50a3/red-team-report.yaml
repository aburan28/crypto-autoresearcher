        all_other_residuals_carried_forward_unchanged_capacity_residuals_ha2_simultaneous_tail_unavailability_and_peak_aggregate_fit_remain_open.
        The successor design_verdict is
        successor_superseding_95ff77_D1_D2_D3_D4_and_non_blocking_carry_CTRL5_over_all_five_pairs_all_other_residuals_carried_forward_unchanged.
        The trailing clause naming capacity_residuals,
        ha2_simultaneous_tail_unavailability and peak_aggregate_fit as REMAINING
        OPEN is gone. The items themselves survive elsewhere, in
        success_criterion, in PEAK-AGGREGATE-FIT-UNPROVED and in
