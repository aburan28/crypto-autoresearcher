  blocking:
    - id: RT-DB50A3-B1
      severity: blocking
      title: >-
        D2 is incomplete in the same class the checkpoint declared blocking:
        dedup_term.range was not propagated for B_0, and the newly strengthened
        lower_bound_rule is FALSE under that range
      class: incomplete_repair_leaves_a_false_mathematical_statement_in_a_frozen_contract
      attacks_claim:
        - 'physical-frontier-compiler.yaml lines 309-315, field d2_b0_at_all_four_rule_sites, claiming the setup-private B_0 term is now present at ALL FOUR rule sites on this page'
        - 'physical-frontier-compiler.yaml line 306, field bounds.lower_bound_rule'
        - 'specification.yaml line 308, claiming B_0 is carried at all four rule sites with the KAT-PEAK-F inequality re-derived by hand, 4096 <= 4096 both directions'
        - 'ctrl5-overlay-completeness.yaml recomputation.d2_kat_peak_f_hand_derivation.result, claiming both directions hold with equality and the corrected bounds hold for KAT-PEAK-F'
        - 'batch.yaml D2 required_fix, ordering the B_0 term propagated to the system_rule, the lower_bound_rule, the upper_bound_rule, and ANY REMAINING RULE SITE'
      exact_residual: >-
        TWO coupled limbs, both in physical-frontier-compiler.yaml
        peak_live_bytes_accounting.
        LIMB (a), THE UN-PROPAGATED RULE SITE. dedup_term.accounting_terms at
        line 296 states that c_P(t) counts how many of the TEN accounting terms
        setup_private(B_0), shared and nonshared_1 through nonshared_8 charge
        page P at t. dedup_term.range at line 297 states 0 <= dedup(t) <= sum_j
        nonshared_j(t). That range line is carried forward BYTE-IDENTICAL from
        the predecessor line 285 of
        BATCH-158345/tasks/TASK-20260817-9d7d09/physical-frontier-compiler.yaml,
        confirmed by this red team, and was never updated when B_0 joined the
        term census. It is falsified by the definition directly above it: let
        setup_private charge one 4096-byte page P at time t, let the shared
        context charge the same page P, and let all eight nonshared_j be zero.
        Then c_P(t) = 2, so dedup(t) = (2-1)*4096 = 4096, while sum_j
        nonshared_j(t) = 0. The declared range asserts 4096 <= 0.
        LIMB (b), THE NEW LOWER BOUND IS REFUTABLE UNDER THE DECLARED RANGE. The
        successor NEWLY strengthens line 306 to max( max_t B_0(t), max_j max_t
        nonshared_j(t) ) <= peak_live_bytes_system, where the predecessor read
        max_j max_t nonshared_j(t) <= peak_live_bytes_system. Take t with
        nonshared_1(t) = 4096, B_0 = shared = nonshared_2 through nonshared_8 =
        0, and dedup(t) = 4096, which the declared range EXPLICITLY PERMITS since
        0 <= 4096 <= sum_j nonshared_j(t) = 4096. Then the system_rule gives peak
        = 0 + 0 + 4096 - 4096 = 0, and the lower_bound_rule asserts max(0, 4096)
        = 4096 <= 0. FALSE.
        The bound IS recoverable, but only from a property the record does not
        state: reading dedup as the sum over pages P of (c_P - 1)*bytes(P) makes
        the peak equal the live-page UNION size, which dominates every single
        term. That derivation is nowhere in the package, and the record own
        declared range is strictly weaker than it. So the frozen contract as
        written asserts a bound its own stated premises refute, which is verbatim
        the D2 class.
        NOTE ON FAIRNESS. The limb (b) counterexample also refutes the
        PREDECESSOR weaker lower bound, so the falsity is inherited rather than
        introduced. What is new and chargeable to this batch is that D2
        explicitly ordered any remaining rule site propagated, this successor
        edited this exact line, and it certified the result as complete and
        hand-verified.
      falsification_route:
        - step: 1
          action: >-
            Read physical-frontier-compiler.yaml lines 294 to 308 and confirm
            dedup_term.accounting_terms names TEN terms including
            setup_private(B_0) and shared, while dedup_term.range bounds dedup
            only by sum_j nonshared_j(t).
        - step: 2
          action: >-
            Diff the predecessor lines 283 to 285 against the successor lines 295
            to 297 and confirm the range line is byte-identical and untouched.
        - step: 3
          action: >-
            Instantiate limb (a): B_0 and shared both charging one 4096-byte
            page, all nonshared_j zero. Evaluate the definition to get dedup =
            4096. Evaluate the range to get 4096 <= 0.
        - step: 4
          action: >-
            Instantiate limb (b): nonshared_1 = 4096, everything else 0, dedup =
            4096, inside the declared range. Evaluate system_rule to get peak = 0.
            Evaluate lower_bound_rule to get 4096 <= 0.
        - expected_result_if_objection_is_wrong: >-
            Either the range line would already exclude both counterexamples, or
            the package would contain a stated union-size lemma from which the
            lower bound follows. Neither exists; a grep for dedup across all
            seven artifacts returns only the definition, the unchanged range, the
            interval terms, and the KAT fixtures dedup_t of 0.
      required_to_clear: >-
        Either propagate the term census into dedup_term.range, for example 0 <=
        dedup(t) <= B_0(t) + shared(t) + sum_j nonshared_j(t) minus the maximum
        over the ten terms, which is the correct over-count bound, or state the
        union-size lemma the lower bound actually needs, and re-derive the lower
        bound from whichever is chosen.
      changes_any_ecdlp_claim: false
      changes_any_numeric_row: false
      changes_any_disposition: false

    - id: RT-DB50A3-B2
      severity: blocking
      title: >-
        The D4 repair artifact d4_gamma_0_over_1_exception states a formula that
        misses its own recorded value by a factor of 512, under an explicit
        matches-the-stored-values verdict
      class: unsupportable_method_claim_in_the_artifact_that_certifies_the_arithmetic
      attacks_claim:
        - 'ctrl5-overlay-completeness.yaml recomputation.d4_gamma_0_over_1_exception.formula, recorded as 32768 * 2^(-bits/30) / 33 unclipped, with p = 1/33792 and threshold 1/32768'
        - 'the same entry bits_30_value of 0.969697 and its result field asserting a match to the stored values with p below 1/32768 and the 32/33 = 0.9696969697 evaluation unchanged'
        - 'the ctrl5 header comment at lines 1715-1718 asserting independent recomputation of every closed-form numeric literal touched by D2 and D4, verbatim values as recomputed'
        - 'batch.yaml D4 required_fix HARD REQUIREMENT to ACTUALLY RUN a python3 Decimal recompute for EVERY m_98304_variant literal AND EVERY OTHER CLOSED-FORM LITERAL IT ASSERTS'
      exact_residual: >-
        Evaluating the entry OWN stated formula at bits = 30 gives 32768 *
        2^(-30/30) / 33 = 32768 / 2 / 33 = 496.484848, independently recomputed
        at 80-digit Decimal precision. The entry records bits_30_value 0.969697.
        The two differ by exactly a factor of 512. The recorded value is correct
        for the specification ACTUAL gamma_x = 0/1 closed form, which
        specification.yaml states at line 1457 as closed_form_at_gamma_0 equal to
        min(1, 32768 * 2^(-bits/3) / 33) -- exponent divisor 3, not 30 -- giving
        32768 * 2^(-10) / 33 = 32/33 = 0.969697. So the certifying artifact
        records the right ANSWER against the wrong FORMULA and then declares that
        it matches the stored values. A reader performing the mandated
        independent recompute from the recorded formula gets 496.484848 and a
        mismatch. This is the D3 defect class exactly, an asserted verification
        the record cannot support, reproduced inside the artifact whose purpose
        is to close D4.
      falsification_route:
        - step: 1
          action: >-
            Compute
            Decimal(32768)*(Decimal(2)**(Decimal(-30)/Decimal(30)))/Decimal(33)
            at 80-digit precision. The result is 496.4848484848 and so on.
        - step: 2
          action: >-
            Compare with the entry recorded bits_30_value of 0.969697. The ratio
            is 512.
        - step: 3
          action: >-
            Read specification.yaml line 1457 closed_form_at_gamma_0, confirm the
            divisor is 3, and confirm that 32768*2^(-30/3)/33 = 32/33 = 0.969697
            reproduces the recorded value.
        - expected_result_if_objection_is_wrong: >-
            The stated formula would reproduce 0.969697 at some admissible bits
            value. It does not at bits 18, 21, 24, 27 or 30; at bits 30 it is
            496.484848 and the function is decreasing in bits, so no ladder size
            in the record produces 0.969697 under the stated exponent.
      required_to_clear: >-
        Correct the formula string to 32768 * 2^(-bits/3) / 33, matching
        specification.yaml closed_form_at_gamma_0, or restate the entry so the
        recorded value and the recorded formula agree, and re-run the recompute
        against the corrected string.
      changes_any_ecdlp_claim: false
      changes_any_numeric_row: false
      changes_any_specification_value: false
      note_on_scope: >-
        The SPECIFICATION own gamma_x = 0/1 rows are CORRECT and were
        independently verified by this red team: 512/33 to 15.515152, 256/33 to
        7.757576, 128/33 to 3.878788, 64/33 to 1.939394 and 32/33 to
        0.9696969697, with p = 1/33792 = 2.959280e-05 below 1/32768 =
        3.051758e-05. Only the verification artifact account of how they were
        checked is defective.

    - id: RT-DB50A3-B3
      severity: blocking
      title: >-
        The D4 repair artifact d4_familywise_5_over_18_m_98304 states a formula
        that generates NONE of its five recorded values, and no value of bits
        under it produces its recorded ceiling row, again under
        matches-the-stored-values
      class: unsupportable_method_claim_in_the_artifact_that_certifies_the_arithmetic
      attacks_claim:
        - 'ctrl5-overlay-completeness.yaml recomputation.d4_familywise_5_over_18_m_98304.formula, recorded as six-decimal ROUND_HALF_UP of 98304 * 2^(-bits/30) * (5/18) / 33'
        - 'the same entry rows 1489.454545, 1326.953145, 1182.180856, 1053.203409 and 938.297567, its gamma_1_over_3_ceiling of 2978.909091, and its result field asserting a match to the stored values with the vacuity conclusion unchanged'
        - 'batch.yaml D4 HARD REQUIREMENT covering every other closed-form literal it asserts'
      exact_residual: >-
        Evaluated at 80-digit Decimal precision with ROUND_HALF_UP at six places,
        the entry own stated formula yields 545.929738 at bits 18, 509.370456 at
        bits 21, 475.259441 at bits 24, 443.432738 at bits 27 and 413.737374 at
        bits 30. NONE of the five equals the value recorded on the same line. The
        generating form is instead 98304 * 2^(-bits/18) / 33 -- exponent divisor
        18, not 30, and NO factor of 5/18, since 5/18 is the VALUE of gamma_x and
        not a multiplier -- which reproduces 1489.454545, 1326.953145,
        1182.180856, 1053.203409 and 938.297567 exactly. specification.yaml line
        1432 states this itself: closed_form_m_98304 is the same with m = 98304
        equals min(1, 2^(15 - bits/18)/11), and 2^(15-21/18)/11 = 1326.953145 as
        this red team confirmed. Separately, the recorded gamma_1_over_3_ceiling
        of 2978.909091 is not an instance of the stated formula for ANY bits: it
        is 98304/33 = 2978.9090909, the E[X] = 1 ceiling that specification.yaml
        line 1440 records as unclipped_value_m_98304 equal to 98304/33,
        approximately 2978.91. Under the stated formula the closest analogous
        quantity would be 98304*(5/18)/33 = 827.474747. So the entry result claim
        is false as written on all six rows.
      falsification_route:
        - step: 1
          action: >-
            Evaluate
            Decimal(98304)*(Decimal(2)**(Decimal(-b)/Decimal(30)))*(Decimal(5)/Decimal(18))/Decimal(33)
            for b in 18, 21, 24, 27 and 30 at 80-digit precision with
            ROUND_HALF_UP at six places.
        - step: 2
          action: >-
            Observe 545.929738, 509.370456, 475.259441, 443.432738 and 413.737374
            against the recorded 1489.454545, 1326.953145, 1182.180856,
            1053.203409 and 938.297567. Zero of five match.
        - step: 3
          action: >-
            Re-run with 98304 * 2^(-bits/18) / 33 and observe all five match;
            cross-check against specification.yaml line 1432 and lines 916 to 921.
        - step: 4
          action: >-
            Solve the stated formula for the recorded ceiling 2978.909091. No
            positive bits value satisfies it; the recorded ceiling is 98304/33,
            outside the stated family.
        - expected_result_if_objection_is_wrong: >-
            At least one of the six recorded numbers would be reproduced by the
            recorded formula. None is.
      required_to_clear: >-
        Replace the formula string with the generating form, six-decimal
        ROUND_HALF_UP of 98304 * 2^(-bits/18) / 33, equivalently 2^(15 -
        bits/18)/11; record the gamma_x = 1/3 ceiling row under its own closed
        form 98304/33 at E[X] = 1; and re-run the recompute against the corrected
        strings.
      changes_any_ecdlp_claim: false
      changes_any_numeric_row: false
      changes_any_specification_value: false
      note_on_scope: >-
        The SPECIFICATION five familywise_bound rows at lines 916 to 920 and its
        ceiling_row at line 921 are CORRECT and were independently verified here.
        Only the verification artifact account of how they were checked is
        defective. The vacuity conclusion is unaffected under either reading:
        every value is far above 1 in both.

  major:
    - id: RT-DB50A3-M1
      severity: major
      title: >-
        The KAT-PEAK-F hand derivation mandated by D2 is provably
        NON-DISCRIMINATING for the lower-bound half of the change it certifies
      class: verification_control_that_cannot_detect_the_defect_it_is_cited_for
      attacks_claim:
        - 'batch.yaml D2 required_fix, ordering verification by re-deriving the KAT-PEAK-F inequality by hand and recording the derivation'
        - 'ctrl5-overlay-completeness.yaml recomputation.d2_kat_peak_f_hand_derivation.result, asserting both directions hold with equality and the corrected bounds hold for KAT-PEAK-F'
        - 'physical-frontier-compiler.yaml lines 315-321, the same derivation restated'
        - 'specification.yaml line 308, asserting the KAT-PEAK-F inequality was re-derived by hand, 4096 <= 4096 both directions'
      exact_residual: >-
        KAT-PEAK-F is B_0 = 4096 on the interval from 1.0 to 2.0, shared = 0,
        nonshared_j = 0 for all j, dedup = 0 and expected peak 4096, per
        verification-and-null-kats.yaml lines 351 to 358. Evaluate the four rules
        on that fixture.
        NEW upper bound: 4096 + 0 + 0 = 4096 >= 4096, PASS.
        OLD upper bound: 0 + 0 = 0 >= 4096, FAIL. So the fixture DOES discriminate
        the upper-bound repair, which is what the checkpoint asked for and this
        red team confirms.
        NEW lower bound: max(4096, 0) = 4096 <= 4096, PASS.
        OLD lower bound: max_j max_t nonshared_j = 0 <= 4096, PASS.
        The pre-repair lower bound passes KAT-PEAK-F IDENTICALLY. The fixture is
        therefore incapable of distinguishing the repaired lower_bound_rule from
        the unrepaired one, so half of the recorded both-directions derivation
        carries zero verification content, and it is precisely the half in which
        RT-DB50A3-B1 limb (b) locates a refutable statement. A control that
        passes identically with and without the change under test is a null
        result presented as a confirmation.
      falsification_route:
        - step: 1
          action: >-
            Read verification-and-null-kats.yaml lines 351 to 358 for the fixture
            values: b0_t 4096, shared_t 0, nonshared_j 0 each, dedup_t 0.
        - step: 2
          action: >-
            Evaluate the PREDECESSOR rule max_j max_t nonshared_j(t) <= peak,
            line 294 of the predecessor file, on that fixture. It gives 0 <= 4096,
            PASS.
        - step: 3
          action: >-
            Conclude the fixture cannot separate the two lower-bound forms, then
            construct any fixture with B_0 greater than the sum of all other terms
            and dedup allowed positive, for example RT-DB50A3-B1 limb (b), which
            separates them and refutes the new form under the declared range.
        - expected_result_if_objection_is_wrong: >-
            KAT-PEAK-F would fail under the predecessor lower bound. It does not;
            the predecessor lower bound evaluates to 0 <= 4096.
      required_to_clear: >-
        Add a fixture that discriminates the lower-bound change, with nonzero B_0,
        at least one nonzero nonshared stream and a nonzero dedup, or state
        plainly that KAT-PEAK-F verifies the upper-bound limb only and that the
        lower-bound limb rests on the unstated union-size property.
      changes_any_ecdlp_claim: false
      changes_any_numeric_row: false

    - id: RT-DB50A3-M2
      severity: major
      title: >-
        The D1 and D4 HARD REQUIREMENT to paste the ACTUAL command output is
        unmet, and four sites in three artifacts assert that the output IS
        recorded
      class: assertion_about_artifact_contents_that_the_artifact_does_not_contain
      attacks_claim:
        - 'batch.yaml D1 required_fix, requiring the producer to ACTUALLY RUN shasum -a 256 for EVERY digest and PASTE THE ACTUAL COMMAND OUTPUT next to each declared digest, and declaring a digest that is not the literal output of a recorded shasum invocation to be a defect'
        - 'batch.yaml D4 required_fix, likewise requiring the ACTUAL command output to be pasted'
        - 'ctrl5-overlay-completeness.yaml digests header, asserting every digest below is the literal output of a recorded shasum -a 256 invocation'
        - 'design-repair-report.yaml actions_not_taken.digest_computed_note, asserting the digests are recorded in ctrl5-overlay-completeness.yaml WITH THE LITERAL COMMAND OUTPUT'
        - 'specification.yaml line 314 and design-repair-report.yaml lines 632 and 716, asserting the recomputation output is recorded in ctrl5-overlay-completeness.yaml and runtime-session-receipt.json'
        - 'specification.yaml success_criterion, asserting for D1 that every digest in ctrl5-overlay-completeness.yaml is the literal output of a recorded shasum invocation and for D4 that the Decimal recomputation output is recorded'
      exact_residual: >-
        NO literal command output exists anywhere in the package. A count of lines
        matching the shasum stdout shape, 64 hex characters followed by two spaces
        and a path, returns 0 for every one of the seven artifacts, and a looser
        regex allowing any run of whitespace returns nothing at all. What ctrl5
        actually records is hand-authored YAML mappings, of the form key colon hex
        and path-plus-sha256 dictionaries. Separately, a search of
        runtime-session-receipt.json for 1833.733643, 1596.357855, 1965.347055 or
        the token Decimal returns 0: the receipt contains NO recomputation output
        at all, only a prose sentence in
        resolution_provenance.commands_executed_by_this_session describing what
        was run. So three artifacts and the success_criterion assert a content
        that neither named file contains.
        MITIGATION, STATED FAIRLY. This red team independently recomputed every
        digest and every literal and the VALUES are all correct, per D1 and D4
        above, and the snapshot receipt independently supplies all seven
        path_sha256 values, which also match. The defect is the unsupported claim
        about provenance form, not a wrong number. That is, however, exactly the
        distinction on which D1 and D3 were both ruled blocking in the 54th, and
        the success_criterion invites a reviewer to check a literal condition that
        is false.
      falsification_route:
        - step: 1
          action: 'Count lines matching the shasum stdout shape across all seven declared artifacts. The count is 0 in every file.'
        - step: 2
          action: 'Search runtime-session-receipt.json for any recomputed numeral such as 1833.733643. The count is 0.'
        - step: 3
          action: 'Read ctrl5 lines 1793 to 1810 and observe YAML mappings rather than shasum stdout lines.'
        - expected_result_if_objection_is_wrong: >-
            At least one file would contain a line pairing a 64-hex digest with a
            path in shasum output form, and the receipt would contain at least one
            recomputed numeral. Neither does.
      required_to_clear: >-
        Either paste the literal stdout of the shasum and Decimal invocations, a
        fenced block per command being sufficient, or amend the four assertions to
        say what is actually true: that the digests and literals were computed by
        this producer and their VALUES are recorded, with the raw stdout not
        retained.
      changes_any_ecdlp_claim: false
      changes_any_numeric_row: false

  moderate:
    - id: RT-DB50A3-D1
      severity: moderate
      title: >-
        The block certifying D2 is named d2_b0_at_all_four_rule_sites and then
        enumerates FIVE sites, while specification.yaml uses four for a DIFFERENT
        set of four
      class: internal_and_cross_artifact_inconsistency_in_a_completeness_claim
      attacks_claim:
        - 'physical-frontier-compiler.yaml lines 309-315'
        - 'specification.yaml line 308'
        - 'physical-frontier-compiler.yaml line 99, the repair list'
      exact_residual: >-
        physical-frontier-compiler.yaml line 311 reads that B_0 is now present at
        ALL FOUR rule sites on this page and then lists system_rule,
        interval_arithmetic.lower, interval_arithmetic.upper,
        bounds.lower_bound_rule and bounds.upper_bound_rule. That is FIVE.
        specification.yaml line 308 reads that interval_arithmetic.lower and
        .upper and bounds.lower_bound_rule and .upper_bound_rule now carry B_0 at
        all four rule sites, which is four, EXCLUDING system_rule; and
        physical-frontier-compiler.yaml line 99 own repair list agrees with the
        specification four rather than with its own line 311. So the same phrase
        all four rule sites denotes two different sets in two artifacts of one
        package, and in one of them the enumeration contradicts the count in the
        field name it sits under. A completeness claim whose cardinality is
        ambiguous cannot be mechanically checked, which is the failure mode this
        batch exists to remove.
      falsification_route:
        - step: 1
          action: 'Count the sites enumerated in physical-frontier-compiler.yaml lines 311 to 315. There are five.'
        - step: 2
          action: 'Count those named in specification.yaml line 308. There are four, excluding system_rule.'
        - step: 3
          action: 'Confirm physical-frontier-compiler.yaml line 99 lists four, matching the specification and not its own line 311.'
      required_to_clear: >-
        Fix the count or the enumeration so one reading is fixed package-wide, and
        state which set the word four denotes.
      changes_any_ecdlp_claim: false

    - id: RT-DB50A3-D2
      severity: moderate
      title: >-
        The CTRL-5 was run FIRST claim is self-refuting as recorded, and the batch
        stated prophylactic rationale does not apply to what the artifact actually
        contains
      class: unsupportable_ordering_claim
      attacks_claim:
        - 'ctrl5-overlay-completeness.yaml lines 12-14, asserting CTRL-5 was run FIRST per batch.yaml ctrl5_first'
        - 'batch.yaml ctrl5_first, ordering CTRL-5 RUN FIRST BEFORE ANY OTHER WORK on the rationale that it would have caught D1 and D2 before dispatch, and that this is why it goes first'
        - 'specification.yaml design_verdict token naming CTRL5 over all five pairs'
      exact_residual: >-
        The recorded CTRL-5 artifact contains, first, a leaf-path diff of five
        SUCCESSOR artifacts against their predecessors; second, SHA-256 digests of
        the successor specification and of all six sibling task artifacts; and
        third, recomputations of literals that only exist in the successor. None
        of those can be produced before the successor package is authored, so the
        recorded CTRL-5 is necessarily a POST-AUTHORING check, whatever a first
        pass may have done. No record of a first pass exists in the package. The
        consequence is not cosmetic: the batch justification for ctrl5-first is
        that it would have caught D1 and D2 before dispatch, and a post-authoring
        artifact confers none of that. Indeed the two defects this red team found
        in the D4 certification block, RT-DB50A3-B2 and B3, would have been caught
        by exactly the kind of pre-authoring formula check the ordering was
        supposed to institute.
      falsification_route:
        - step: 1
          action: 'Read ctrl5 digests.this_tasks_declared_artifacts and confirm it lists six sibling artifacts of the same task.'
        - step: 2
          action: 'Read ctrl5 diff_summary and confirm four of the five compared pairs are companion artifacts of this same task.'
        - step: 3
          action: 'Observe that the successor-side operand of every one of those comparisons is an artifact of the work CTRL-5 claims to precede.'
        - expected_result_if_objection_is_wrong: >-
            The artifact would record a first-pass result over predecessor bytes
            alone, with the post-authoring pass recorded separately. It records one
            pass.
      required_to_clear: >-
        State plainly that CTRL-5 as recorded is the post-authoring completeness
        pass, and either record the pre-authoring pass separately or note that the
        ordering requirement is satisfiable only for the predecessor-side checks.
      changes_any_ecdlp_claim: false

    - id: RT-DB50A3-D3
      severity: moderate
      title: >-
        The three over-cap residuals are carried forward with NO disposal path,
        and the batch own cap-amendment-authority clause appears nowhere in the
        package
      class: omitted_end_to_end_cost_consequence
      attacks_claim:
        - 'physical-frontier-compiler.yaml capacity_fit_residuals, all three OPEN_CARRIED_FORWARD with no_cap_raised true'
        - 'batch.yaml carried_forward_open_and_unchanged.CAPACITY-RESIDUALS, stating that item (d) stays open until a task holding cap-amendment authority disposes of it by a versioned protocol_amendment, which this batch has no authority to make'
        - 'specification.yaml next_action and design-repair-report.yaml next_action'
      exact_residual: >-
        The three residuals are OVER-cap, not headroom, and this red team confirms
        the arithmetic exactly: archive 5563755264 scheduled against a 2307745600
        cap gives 3256009664 over; communication 5614086912 against 2328717120
        gives 3285369792 over; output 15520768 required against 8388608 gives
        7132160 over, with the twelve output_rows summing to 15520768. The
        designed experiment therefore CANNOT be executed within its own declared
        hard caps on three independent axes. That is disclosed honestly as far as
        it goes. What is missing is the consequence: a grep over
        specification.yaml and all six task artifacts for cap-amendment authority,
        for cannot be executed, or for until a task holding returns NOTHING, so
        the batch own statement of who may dispose of the residuals is not
        reproduced anywhere in the successor package. And this is the last batch
        authorized under the current budget, with
        remaining_authorized_batches_after_this_one equal to 0, so no such
        disposing task exists or is scheduled. The record leaves an unexecutable
        design carried open with no revisit condition and no named successor,
        which AGENTS.md rule 9 and CLAUDE.md rule 9 require any deprioritization
        or closure to state.
      falsification_route:
        - step: 1
          action: 'Verify the three residuals are scheduled minus cap and therefore over-cap: 5563755264 minus 2307745600 equals 3256009664, and likewise for the other two.'
        - step: 2
          action: 'Grep the seven artifacts for cap-amendment authority, for cannot be executed, and for until a task holding. No hits.'
        - step: 3
          action: 'Read batch.yaml campaign_budget_position.remaining_authorized_batches_after_this_one, which is 0, and confirm no disposing task is authorized.'
        - expected_result_if_objection_is_wrong: >-
            The package would name the authority, the amendment vehicle, and a
            revisit condition. It names none.
      required_to_clear: >-
        Reproduce the batch disposal clause in the successor and state the revisit
        condition explicitly: that the design is not executable under the current
        caps, and that execution requires a versioned protocol_amendment from a
        cap-amendment-holding task that is not currently authorized.
      changes_any_ecdlp_claim: false
      changes_any_numeric_row: false

    - id: RT-DB50A3-D4
      severity: moderate
      title: >-
        design_verdict drops the explicit naming of the three open items that the
        predecessor verdict token carried
      class: narrowing_of_a_visible_open_line_in_the_most_quoted_summary_field
      attacks_claim:
