        or better Decimal precision with ROUND_HALF_UP at six places and compare
        with the values recorded in the SAME entry. Two of ten entries fail. This
        is the exact check batch.yaml D4 mandated and it takes one script.
      script: >-
        from decimal import *; getcontext().prec = 80; Q = Decimal('0.000001'); f
        = lambda m, d, k: [(b,
        (Decimal(m)*(Decimal(2)**(Decimal(-b)/Decimal(d)))*k/Decimal(33)).quantize(Q,
        rounding=ROUND_HALF_UP)) for b in (18,21,24,27,30)]; print('stated 5/18
        block:', f(98304, 30, Decimal(5)/Decimal(18))); print('actual generator:',
        f(98304, 18, Decimal(1))); print('stated gamma0 at 30:', f(32768, 30,
