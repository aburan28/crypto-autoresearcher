        4096; evaluate system_rule to get peak = 0, against bounds.lower_bound_rule
        which asserts 4096 <= 0. If either evaluates false, the objection stands.
      cost: 'minutes, zero runs'
    - id: FR-2
      target: 'RT-DB50A3-B2 and RT-DB50A3-B3'
      cheapest_discriminating_check: >-
