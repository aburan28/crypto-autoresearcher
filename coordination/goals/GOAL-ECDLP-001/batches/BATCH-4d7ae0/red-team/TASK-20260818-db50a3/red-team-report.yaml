      falsification_route:
        - step: 1
          action: 'Parse both specification files and diff experiment.design_verdict as strings.'
        - step: 2
          action: 'Confirm the three open items are named in the predecessor token and in neither the successor token nor any adjacent summary token.'
      required_to_clear: >-
