ctrl5_first: >-
  RUN CTRL-5 FIRST, BEFORE ANY OTHER WORK. It is the red team's whole-file
  overlay-completeness diff: every difference from the predecessor
  (EXP-SYC-95ff77) must map to an `overlays_in_this_successor` entry, AND
  every field that SHOULD have differed because it names this task
  (TASK-20260818-a21a01), this batch (BATCH-4d7ae0), this session, this
  branch, this archive task, or the reviewers must actually differ. It is
  mechanical, needs zero experiment runs, and would have caught D1 (the stale
  ctrl5 digest is an unmapped difference) and D2 (the missing B_0 at the bound
  rules is an unexplained difference from the predecessor) before dispatch.
  That is why it goes first. The producer must record the CTRL-5 result (the
  overlay map and the should-differ/did-differ check) as a first-class
  artifact of the successor package, with ACTUALLY-COMPUTED digests.

required_successor_repairs:
  - id: D1-CTRL5-STALE-DIGEST
    source_checkpoint: BATCH-158345
    source_findings: [VAL-D50C44-B1, RT-A70C90-BLOCKING-2]
    severity: blocking
    class: fabricated_or_stale_digest_in_the_mechanized_verification_artifact
    checkpoint_statement_verbatim: >-
      ctrl5-overlay-completeness.yaml line 467 declares
      digests.specification_files.successor_experiments_EXP-SYC-95ff77_specification_yaml
      = b34bb9873bd80f0aab35906507d0640572c5d9129e859989c339187b522bb553, but the
      actual SHA-256 of experiments/EXP-SYC-95ff77/specification.yaml is
      786ca5f06d0c1d27e055c79be0c2437e8ae58e169b5a673330ac0082cb0fa3c1 -- the
      value the SAME artifact records at line 469 and the Coordinator snapshot
      receipt records. One artifact carries two digests for one file; the
      line-467 value matches nothing on disk.
    required_fix: >-
      Set line 467 to the ACTUAL digest 786ca5f06d0c1d27e055c79be0c2437e8ae58e169b5a673330ac0082cb0fa3c1.
      HARD REQUIREMENT (the reliability fix this batch exists to enforce): the
      producer must ACTUALLY RUN `shasum -a 256 <path>` for EVERY digest it
      records in ctrl5-overlay-completeness.yaml and paste the ACTUAL command
      output next to each declared digest. A digest that is not the literal
      output of a recorded shasum invocation is a defect.
    no_numeric_or_disposition_change: >-
      A digest correction. No numeric row, bound, or disposition changes, and
      no ECDLP assertion in either direction.

  - id: D2-B0-NOT-AT-ALL-FOUR-RULE-SITES
    source_checkpoint: BATCH-158345
    source_findings: [VAL-D50C44-B2, RT-A70C90-BLOCKING-1]
    severity: blocking
    class: incomplete_repair_leaves_a_false_mathematical_statement_in_a_frozen_contract
    checkpoint_statement_verbatim: >-
      physical-frontier-compiler.yaml line 262 system_rule now reads
      peak_live_bytes_system = max_t( B_0(t) + shared(t) + sum_j
      concurrent_nonshared_shard_j(t) - dedup(t) ), but lines 294-295
      (lower_bound_rule and upper_bound_rule) are carried forward byte-identical
      from the predecessor and contain no B_0 term. The upper bound omits B_0
      while the peak it bounds includes B_0, so the bound is FALSE whenever
      B_0(t) > 0 -- exactly the KAT-PEAK-F fixture (B_0 = 4096) the same
      package made required.
    required_fix: >-
      Propagate the B_0 term to ALL FOUR rule sites: the system_rule (already
      done at line 262), the lower_bound_rule, the upper_bound_rule, and any
      remaining rule site, so the upper bound reads
      peak_live_bytes_system <= max_t( B_0(t) + shared(t) + sum_j
      concurrent_nonshared_shard_j(t) ) and the bound holds for KAT-PEAK-F.
      Verify by re-deriving the KAT-PEAK-F inequality by hand and recording the
      derivation.
    no_numeric_or_disposition_change: >-
      Makes the already-introduced B_0 term EFFECTIVE and consistent. Changes
      no numeric result, bound value, or disposition; propagates a term the
      package already introduced.

  - id: D3-VERIFICATION-METHOD-ASSERTED-AND-DENIED
    source_checkpoint: BATCH-158345
    source_findings: [VAL-D50C44-B3, RT-A70C90-BLOCKING-3]
    severity: blocking
    class: unsupportable_method_claim
    checkpoint_statement_verbatim: >-
      The successor still asserts a parsed-YAML structural diff as the
      verification method in some sites while the ctrl5 artifact's own
      method.procedure and the companion artifacts deny or cannot support it.
      The ctrl5 artifact claims "Both specification files are parsed to YAML,
      flattened to leaf paths ... and diffed into added / removed / changed
      sets" and records every_diff_maps_to_a_declared_overlay = true with
      unmapped_diffs = none, but the leaf-level accounting does not reconcile
      with the documents, and the same package elsewhere denies having run a
      parser.
    required_fix: >-
      State the verification method truthfully and consistently across ALL
      artifacts. EITHER actually run the parsed-YAML diff (name the exact
      command, e.g. a python3 -c 'import yaml; ...' invocation, and paste the
      ACTUAL field list it produced, correcting actions_not_taken accordingly),
      OR state plainly that the fields were compared by reading and the
      parsed-YAML verification is delegated to the review tasks. Do not assert
      a mechanized check the package also denies.
    no_numeric_or_disposition_change: >-
      A method-accounting correction. The OUTCOME does not depend on which
      reading is chosen; the reviewer performs the parsed-YAML diff
      independently. Only the unsupported method claim must not survive.

  - id: D4-M98304-ARITHMETIC-PLUS-FALSIFIED-NOMISMATCH-CLAIM
    source_checkpoint: BATCH-158345
    source_findings: [VAL-D50C44-B4, RT-A70C90-BLOCKING-4]
    severity: blocking
    class: numeric_error_plus_falsified_verification_claim
    checkpoint_statement_verbatim: >-
      specification.yaml line 1468 (m_98304_variant) and
      design-repair-report.yaml line 633 declare "3x larger at every size
      (1965.347055, 1833.733644, 1710.933986, 1596.357856, 1489.454545)".
      Under the declared closed form min(1, 98304 * 2^(-bits/30) / 33) at the
      sub-block's own six-decimal ROUND_HALF_UP serialization, two entries are
      wrong in the last place: bits 21 declares 1833.733644, exact
      1833.7336425675... serializes to 1833.733643 (+1 ulp); bits 27 declares
      1596.357856, exact 1596.3578554722... serializes to 1596.357855 (+1
      ulp). The adjacent note asserts the values were "independently
      recomputed ... no mismatch was found" -- falsified by the two errors.
    required_fix: >-
      Correct bits 21 to 1833.733643 and bits 27 to 1596.357855 in BOTH
      specification.yaml and design-repair-report.yaml. HARD REQUIREMENT: the
      producer must ACTUALLY RUN a python3 Decimal recompute at >= 60-digit
      precision with ROUND_HALF_UP at six places for EVERY m_98304_variant
      literal (and every other closed-form literal it asserts) and paste the
      ACTUAL command output. Then correct or remove the "no mismatch was
      found" note to match the recomputation.
    no_numeric_or_disposition_change: >-
      Corrects two last-place arithmetic errors in a static literal table. The
      closed form and the serialization convention are unchanged; only the
      two mis-serialized entries and the falsified verification note change.

  - id: NON-BLOCKING-CARRY
    source_checkpoint: BATCH-158345
    source_findings: [VAL-D50C44-N1, VAL-D50C44-N2, VAL-D50C44-N3, VAL-D50C44-N4, VAL-D50C44-N5, VAL-D50C44-N6, VAL-D50C44-N7, RT-A70C90-MAJOR-1, RT-A70C90-MAJOR-2, RT-A70C90-MAJOR-3, RT-A70C90-MAJOR-4, RT-A70C90-MODERATE-1, RT-A70C90-MODERATE-2, RT-A70C90-MODERATE-3, RT-A70C90-MINOR-1, RT-A70C90-MINOR-2, RT-A70C90-MINOR-3, RT-A70C90-MINOR-4, RT-A70C90-MINOR-5, RT-A70C90-MINOR-6, RT-A70C90-MINOR-7]
    severity: non_blocking_carry
    class: record_quality_and_premature_closure_risk
    checkpoint_statement_verbatim: >-
      The 54th batch's dual-REVISE left seven validator non-blocking findings
      (VAL-D50C44-N1..N7) and the red team's four major / three moderate /
      seven minor findings open, plus the three capacity residuals
      (3256009664 archive, 3285369792 communication, 7132160 output) and
      PEAK-AGGREGATE-FIT-UNPROVED (widened by D2's B_0 without disclosure).
    required_fix: >-
      Address each non-blocking item by ID in the successor, or carry it
      forward as an explicit visible open line. None is blocking; none may be
      silently dropped. The four majors include the stale copy-forward blocks
      and the family-size reconciliation (98304 vs 32768); none is a new
      ECDLP assertion.
    no_numeric_or_disposition_change: >-
      Record-quality and scope-narrowing items. None reverses a conclusion.

