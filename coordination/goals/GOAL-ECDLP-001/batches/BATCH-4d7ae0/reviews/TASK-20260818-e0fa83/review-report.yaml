        where: 'specification.yaml:1476-1496, evaluated_gamma_x_3_over_10_RT_82A8CB_OBJ8.RT_OBJ_8_NOTE'
        correction_text_verified: >-
          'The predecessor''s note "independently recomputed by this producer
          (exact rational arithmetic); no mismatch was found" is corrected:
          exact rational arithmetic is inapplicable at bits 18/21/24/27 because
          2^(-bits/30) is irrational there (rational only at bits 30, where
          2^(-1) = 1/2), and the m = 98304 variant carried two last-place errors
          (bits 21 and bits 27, each +1 ulp) that this successor corrects.'
        assessment: >-
          CORRECT and, notably, correct for the right reason. The
          irrationality argument is sound: 2^(-bits/30) is rational only when
          30 | bits, so on this ladder only bits 30 qualifies. The predecessor's
          method claim was not merely unlucky, it was inapplicable, and the
          successor says so rather than quietly deleting the note.
      surviving_no_mismatch_note_elsewhere_is_TRUTHFUL_not_a_residual:
