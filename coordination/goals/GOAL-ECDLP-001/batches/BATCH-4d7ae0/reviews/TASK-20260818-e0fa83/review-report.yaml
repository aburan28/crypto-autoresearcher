    D4-M98304-ARITHMETIC-PLUS-FALSIFIED-NOMISMATCH-CLAIM:
      verdict: PASS
      independent_recompute:
        tool: 'python3 3.13.1, decimal.Decimal, getcontext().prec = 80 (>= 60 as required), ROUND_HALF_UP quantized at six decimal places'
        formula: '98304 * 2^(-bits/30) / 33'
        exact_and_serialized:
