  blocking_findings:
    - id: VAL-B0465B-B1
      severity: blocking
      class: incomplete_repair_leaves_a_false_mathematical_statement_in_a_frozen_contract
      title: >-
        The RT-DB50A3-B1 dedup-range repair was applied to the companion compiler page
        only; the identical FALSE bound survives in the FROZEN CONTRACT at
        specification.yaml:1243, undisclosed, under a disposition of REPAIRED
      where: 'experiments/EXP-SYC-c5f30f/specification.yaml:1243, blocker_repairs.SYSTEM-PEAK-LIVE-CONCURRENCY.dedup_term.range'
      defect: >-
        experiments/EXP-SYC-c5f30f/specification.yaml:1237-1243 defines, inside the
        frozen experiment contract:
          dedup_term:
            definition: dedup(t) = sum over physical pages P live at time t of
              (c_P(t) - 1) * bytes(P), where c_P(t) is the number of distinct
              accounting terms among the TEN terms {setup_private(B_0), shared,
              nonshared_1..nonshared_8} that charge page P at time t
            range: 0 <= dedup(t) <= sum_j nonshared_j(t)
        That range line is byte-identical to the predecessor's
        experiments/EXP-SYC-4725b3/specification.yaml:1159 and is the EXACT string
        RT-DB50A3-B1 declared FALSE and blocking. The successor replaced it at
        physical-frontier-compiler.yaml:297 and left the specification copy untouched.
      failure_instance: >-
        Take the finding's own limb (a) instance, evaluated against the specification's
        own definition three lines above the range: let setup_private charge one
        4096-byte page P at time t, let the shared context charge the same page P, and
        let all eight nonshared_j be zero. Then c_P(t) = 2, so
        dedup(t) = (2-1)*4096 = 4096, while sum_j nonshared_j(t) = 0. The declared range
        asserts 4096 <= 0. FALSE.
      exact_residual: >-
        A FALSE mathematical statement stands in the frozen contract, which is the more
        authoritative of the two documents carrying this field: physical-frontier-
        compiler.yaml is a companion artifact, specification.yaml is the frozen
        experiment contract and the rule of record (it carries frozen_rule at :1178 and
        the whole SYSTEM-PEAK-LIVE-CONCURRENCY blocker disposition). NOTHING in the
        package discloses it. design-repair-report.yaml:683-706 records item_id
        RT-DB50A3-B1 with `disposition: REPAIRED` and `where:
        physical-frontier-compiler.yaml peak_live_bytes_accounting.dedup_term.range,
        .union_size_lemma, .interval_arithmetic.dedup_hi_definition,
        .bounds.lower_bound_rule_note` -- naming only the companion page, with no
        residual line, no open item, and no scoping caveat. The overlay at
        specification.yaml:361 is worded 'companion-side repair of RT-DB50A3-B1 ... The
        compiler's dedup_term.range', which is literally accurate about what was done
        but is not a disclosure that the specification's own copy remains false; a grep
        of all seven artifacts for RT-DB50A3-B1 returns 21 hits and none of them names
        the specification-side site.
        The union_size_lemma, which is what makes the corrected reading sound, exists
        ONLY in physical-frontier-compiler.yaml. The specification carries neither the
        corrected range nor the lemma.
      why_blocking: >-
        This is verbatim the class the batch declared blocking, twice: batch.yaml D2's
        class is `incomplete_repair_leaves_a_false_mathematical_statement_in_a_frozen_
        contract`, and RT-DB50A3-B1 carries the same class string. The batch's D2
        required_fix ordered propagation to 'the system_rule, the lower_bound_rule, the
        upper_bound_rule, and ANY REMAINING RULE SITE'. RT-DB50A3-B1's required_to_clear
        ordered 'propagate the term census into dedup_term.range ... and re-derive the
        lower bound from whichever is chosen'. The producer did exactly that on one page
        and certified the item REPAIRED without residual. Grading it below blocking
        would mean the same sentence is blocking in a companion artifact and
        non-blocking in the contract the companion serves.
      fairness_note: >-
        Stated plainly and in the producer's favour: (a) the false statement is
        INHERITED, not introduced -- it is byte-identical to EXP-SYC-4725b3:1159 and
        older; (b) NO numeric value, bound, table, disposition or conclusion anywhere
        in the package depends on it, and this validator found zero numeric mismatches;
        (c) the specification carries no lower_bound_rule or upper_bound_rule of its
        own, so only limb (a) of the finding applies there, not limb (b); (d) the
        MATHEMATICS of the repair is correct and was re-derived from scratch here --
        what is wrong is its placement and the completeness claim over it; (e) the fix
        is one line plus a pointer to the lemma, and changes no number. What is
        chargeable to this successor is that it edited the ADJACENT block in the same
        file (BLOCK_5_B0_PROPAGATION_REPAIR.remedy at :1198-1214, ~30 lines above),
        knew the exact defect by ID, and certified the repair complete.
      required_to_clear: >-
        Either replace specification.yaml:1243 with the corrected over-count bound
        `0 <= dedup(t) <= B_0(t) + shared(t) + sum_j nonshared_j(t) - M(t)` and carry
        (or cite) the union_size_lemma into the specification, or record the
        specification-side site as an explicit open residual and downgrade the
        RT-DB50A3-B1 disposition from REPAIRED to PARTIALLY_REPAIRED with its `where`
        and success_criterion scoped accordingly.
      changes_any_ecdlp_claim: false
      changes_any_numeric_row: false
      changes_any_disposition: false

