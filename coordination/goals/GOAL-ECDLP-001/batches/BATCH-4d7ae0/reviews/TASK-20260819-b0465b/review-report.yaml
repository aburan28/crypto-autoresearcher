        derived it independently and finds it TRUE for every admissible census
        instance. Writing T(t) = B_0(t) + shared(t) + sum_j nonshared_j(t) =
        sum_P c_P(t)*bytes(P) and U(t) = sum_P bytes(P) over pages live at t, the
        definition gives dedup(t) = T(t) - U(t); each term's charged bytes at t are a
        subset of U(t), so U(t) >= M(t), hence 0 <= dedup(t) <= T(t) - M(t). Tested
        instances, all PASS:
        (i) B_0 + shared only, one 4096-byte page, no nonshared term: c_P = 2,
        dedup = 4096; T = 8192, M = 4096; 4096 <= 4096, TIGHT -- and the red team's
        limb (a) counterexample (which gave 4096 <= 0 under the predecessor range) is
        excluded.
        (ii) shared + two nonshared terms on one 4096-byte page: c_P = 3,
        dedup = 8192; T = 12288, M = 4096; 8192 <= 8192, TIGHT. Disjoint variant
        (shared and nonshared_1 on a 4096-byte page P, nonshared_2 on a disjoint
        8192-byte page Q): dedup = 4096; T = 16384, M = 8192; 4096 <= 8192, PASS.
