  blocker_repairs:
    - id: B1-incomplete-s3-physical-class-crosswalk
      assertion: A-B1-v3
      repair: >-
        One table has exactly the 28 mandatory identifiers, each with exact
        n_c, nonzero q_c, shards_c in 1..8, unique stage owner, unit,
        multiplicity, primitive formula, logical-byte formula, and mandatory
        physical-memory-energy-wiring counters. CPU and wall projection rules
        quantify over that same table and prefixes are hash-reused once.
      residual: 0
    - id: B6-unidentified-harmonic-slope-confidence
      assertion: A-B6-v3
      repair: >-
        Operational restarts draw one uniform public model. Two-sided
        Hoeffding intervals use 320 tails at 1/64000 each. For each eta the OLS
        coefficient is optimized exactly over all five harmonic intervals by
        coefficient sign with directed 512-bit rounding. Positive requires
        gamma_lower>5/18 for every eta. No bootstrap or plug-in upper-bound
        slope enters the decision. The collision KAT must reject.
      residual: 0
    - id: B7-noncanonical-generator-and-replay
      assertion: A-B7-v3
      repair: >-
        Freeze tuple and record framing, threshold maps, deterministic complete
        prime proof below 2^31, deterministic Schoof/CRT certificate schema,
        coefficient order, Tonelli-Shanks root/sign, point encoding, binary
        scalar multiplication, u128 scalar rejection, target/decoy generation,
        ChaCha20-Poly1305 envelope, commitment, authorized replay, and two-
        implementation known-answer vectors for every accept/reject branch.
      residual: 0
    - id: B8-treatment-wide-losslessness-gap
      assertion: A-B8-v3
      repair: >-
        Keep scientific X as distinct canonical A identities, choose the
        lexicographically least witness per A, bind candidate identity to
        (A,k_hat), publicly verify every candidate, and require a one-to-one
        all-root reconciliation with X=V and S=1[X>0]=1[V>0] for every valid
        treatment and null root. A 33rd A invalidates before truncation.
      residual: 0
    - id: B9-noncanonical-same-path-null
      assertion: A-B9-v3
      repair: >-
        Sort all 4L positions by a 16-byte keyed SHAKE value and position,
        assign adjacent ranks complementary signs, and pair them by rank xor 1.
        This is exact, balanced for all odd L, point-independent, and replayable.
        A field-by-field differential manifest permits only label object id and
        hash to differ between treatment and null.
      residual: 0
    - id: B10-incomplete-physical-and-crossover-accounting
      assertion: A-B10-v3
      repair: >-
        Reconcile 15728640 candidate writes, public reads, true-audit reads,
        and decoy-audit reads to 62914560 events. Charge 15728640 public scalar
        verifications plus six KAT verifications; true/decoy annotations add
        only 31457280 scalar-word comparisons. Add 587202560 audit bytes, 1152
        KAT bytes, and 1020 harmonic slots. Define per-size setup, C_root,
        wiring, harmonic total bounds, matched rho bounds, direct comparison,
        and memory/energy/physical-byte Pareto gates.
      residual: 0
    - id: B12-incomplete-and-contradictory-noninterference
      assertion: A-B12-v3
      repair: >-
        V and S come solely from a public verifier over P,Q and candidate bytes.
        The finite graph enumerates five entrypoints, 491520 selector streams,
        15728640 public candidates, all candidate audit reads, and a three-mount
        KAT. Selector and public verifier have empty secret allowlists. True
        and decoy scalar annotations run only after candidate, V, S, and public
        transcript hashes freeze and cannot enter the scientific path.
      residual: 0
