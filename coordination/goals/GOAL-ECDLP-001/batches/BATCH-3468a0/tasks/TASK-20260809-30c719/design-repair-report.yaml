  summary: >-
    Authored a version-3 static successor for the seven BATCH-eec496 union
    blockers. Before writing the scientific branch, the successor freezes two
    zero-run discriminators: a confidence-box slope collision that defeats the
    predecessor plug-in rule, and an aggregate-total allocation collision that
    forces per-size fully charged comparison. The contract then optimizes the
    harmonic coefficient over the entire simultaneous two-sided confidence
    box; compiles all 28 physical classes one-to-one; canonicalizes public
    family, point, scalar, certificate, seed-envelope, and replay bytes;
    requires all-root X=V and S=1[V>0]; defines an exact balanced null and
    single-delta manifest; and removes hidden scalars from V and S. No
    implementation, experiment, evidence, approval, or status transition is
    created.

