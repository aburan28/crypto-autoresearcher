  predecessor_blocker_adjudication:
    - blocker: B1-incomplete-s3-physical-class-crosswalk
      assertion: A-B1-v3
      adjudication: REVISE
      passed_checks:
        - Exactly twenty-eight unique class identifiers are present in both the specification and certificate.
        - Every n_c and q_c is positive and every shards_c is between one and eight.
        - The static n_c, q_c, shards_c, and stage-owner projections match between the two producer artifacts.
        - Stage caps and aggregate class populations reconcile without arithmetic residual.
      blocking_evidence: >-
        The row schema ends at stage_owner and formulas; it does not freeze the
        artifact_owner or probe owner whose uniqueness the certificate asserts,
        and it has no bits or n_c(b) field from which the required per-size cost
        compilation can be reconstructed. Values such as S0_to_S4 and all are
        multi-stage labels, not a unique ownership allocation. The later
        common-counter promise that each class will emit an artifact owner does
        not precommit which owner is legal and therefore cannot prevent two
        classes charging one artifact or one class being omitted. The CPU and
        wall projection also does not say whether cpu_ns_c and wall_ns_c are
        totals for q_c, per-item values, or already sharded measurements, so
        division by q_c and shards_c is not dimensionally reproducible.
      required_repair: >-
        Add one frozen artifact/probe owner and one exact per-size population
        vector to every class. Define prefix counter units and sharding before
        measurement, require the per-size vectors to sum to n_c, and make the
        ownership compiler reject missing, duplicate, or cross-stage charges.

    - blocker: B6-unidentified-harmonic-slope-confidence
      assertion: A-B6-v3
      adjudication: PASS_STATIC
      evidence: >-
        The successor observes one bounded four-model mean per root, spends 320
        Hoeffding tails, builds a simultaneous two-sided rectangle, maps its
        endpoints monotonically through the finite-family harmonic mean, and
        maximizes or minimizes the five-point coefficient by the sign of
        x_b/S_xx. The adversarial vector that sets p_i=U_i at 18 and 21 bits
        and p_i=L_i at 27 and 30 bits gives delta_max=1/(25 log 2) and
        gamma_lower=0.27562553169777476, below 5/18, so the frozen collision is
        correctly refused. The opposite endpoints give delta_min. One fresh
        root and one exactly uniform model are drawn on each operational
        attempt, so the earlier fixed-model/OR ambiguity is removed. This pass
        is a static consequence of the stated confidence model, not evidence
        that HA-4 holds or that any positive coefficient exists.

    - blocker: B7-noncanonical-generator-and-replay
      assertion: A-B7-v3
      adjudication: REVISE
      passed_checks:
        - Prime trial division below 2^31, coefficient order, Schoof/CRT stopping, Tonelli-Shanks root sign, point encoding, and u128 rejection are substantially more explicit.
        - Accepted points and scalars have canonical fixed-width encodings and re-encoding checks.
        - Seed commitment, authenticated sealing, and authorized replay are required before treatment.
      blocking_evidence: >-
        The tuple framing includes a one-byte type tag but nowhere assigns tag
        values to unsigned integers, signed eta, identifiers, bytes, or strings.
        Nor does it give an ordered key schema for each domain. Most critically,
        no rule states whether and where the public-family, target, and decoy
        seeds are absorbed into SHAKE. Reading the target-scalar section with
        domain plus public tuple only makes k publicly reproducible; reading the
        sealed-seed paragraph as an implicit keyed prefix or suffix yields
        different secret-derived bytes. All are compatible with the literal
        text. Rejection-code byte values and literal known-answer outputs or
        digests are also absent. Two implementers can therefore choose different
        tag registries or seed framing, freeze self-consistent vectors afterward,
        and emit different primes, curves, targets, null labels, and replay
        bytes while satisfying every count-level static row.
      observation_collision: >-
        Encoder A may use unsigned-integer tag 01 and absorb seed before the
        domain; encoder B may use tag 02 and absorb seed after the key list.
        Both use one-byte type tags, the declared domain, the declared semantic
        keys, and a fresh offset-zero SHAKE stream, but their first output byte
        differs. No frozen literal digest in the snapshot separates them.
      required_repair: >-
        Freeze a complete tag registry, ordered typed-key list for every one of
        the twenty-two domains, exact seed classes and seed absorption position,
        rejection-code registry, and literal pre-implementation absorb/output
        vectors including target, decoy, null, commitment, seal, and replay.

    - blocker: B8-treatment-wide-losslessness-gap
      assertion: A-B8-v3
      adjudication: PASS_STATIC
      evidence: >-
        X is the complete distinct compressed-A set; the lexicographically
        least full witness is selected per A; candidate identity binds A and
        k_hat; every exact witness must derive and publicly verify k_hat; and a
        one-to-one join requires X=V and S=1[X>0]=1[V>0] on every valid
        treatment and null root before fitting. The 33rd distinct A invalidates
        without truncation or favorable replacement. These obligations repair
        the predecessor fixture-only gap, subject to future implementation and
        Validator verification.

    - blocker: B9-noncanonical-same-path-null
      assertion: A-B9-v3
      adjudication: REVISE
      passed_checks:
        - Sorting positions by a 16-byte key and t makes a total deterministic order once the XOF bytes are fixed.
        - Adjacent ranks yield exactly 2L positive and 2L negative positions for every declared odd L.
        - The downstream executable and configuration are intended to differ only in the committed label object.
      blocking_evidence: >-
        The null inherits B7's undefined type tags, ordered tuple, and seed
        framing, while its known-answer rows freeze only position and sign
        counts, not an expected permutation or label digest. More importantly,
        its involution pairs arbitrary list positions. It proves complement
        under that position involution, but not the treatment label's group
        antisymmetry h(-R)=-h(R). The same point, or a point and its negation,
        appearing at different positions may receive unrelated labels, so the
        null changes duplicate and negation correlations in addition to erasing
        signed-y structure. The single-delta manifest permits the entire label
        object hash to differ and therefore does not distinguish these two null
        semantics.
      required_repair: >-
        Freeze literal null-label KAT bytes and either preserve the treatment
        label's point-negation antisymmetry with a point-keyed random orbit sign,
        or explicitly justify and separately control the extra position-versus-
        point correlation change. Keep the downstream one-executable manifest
        and separately charge label generation.

    - blocker: B10-incomplete-physical-and-crossover-accounting
      assertion: A-B10-v3
      adjudication: REVISE
      passed_checks:
        - The successor adds the omitted candidate audit reads, six public KAT verifications, restart-model bytes, and 1020 confidence-extremum slots.
        - It names per-size G_candidate, C_root, W_root, harmonic total bounds, matched rho bounds, a direct five-size inequality, and Pareto reporting.
        - Aggregate traffic, operation, archive, communication, workspace, and budget caps reconcile.
      blocking_evidence: >-
        The twenty-eight rows remain aggregate; no frozen compiler maps every
        class population to G_candidate(b), one operational C_root(b), controls,
        analysis, or rho without omission or duplication. The definition
        C_root_ns=max(cpu_ns/shards,wall_ns) converts aggregate CPU occupancy to
        latency. It is not KN-TECH-035 hardware multiplied by occupied time and
        favors an eight-shard candidate over a five-shard rho baseline. Physical
        bytes, joules, communication, archive work, and selected-table touches
        are measured but do not enter the scalar T formula; the Pareto paragraph
        requires reporting, not that the prospective positive branch dominate
        rho on those axes. Finally, pollard_rho_baseline is only a class label
        with a prose primitive formula. No partition function, walk equation,
        distinguished-point density, collision handling, seed domains, failed-
        walk/restart rule, stopping cap, or directed per-size statistic is
        frozen, so T_rho_minus is implementation-selectable.
      hardware_time_counterexample:
        id: CTRL-HARDWARE-TIME-SHARD-DIVISION-COLLISION
        execution_kind: symbolic_only_zero_experiment_runs
        common_values: 'G=0, H=1, W=1, equal memory, bytes, energy, archive, and communication'
        candidate: 'cpu_ns=720, shards=8, wall_ns=90, declared C_root_ns=90'
        pollard_rho: 'cpu_ns=500, shards=5, wall_ns=100, declared T_rho_ns=100'
        declared_decision: candidate_strictly_below_rho
        hardware_time_decision: candidate_occupies_720_cpu_ns_and_rho_500_cpu_ns_so_candidate_is_worse
        collision_present: true
      required_repair: >-
        Freeze n_c(b), exact setup/root/control/audit/baseline allocation, and
        one dimensionally explicit cost functional. If the claim is full
        hardware-time, charge aggregate processor occupancy rather than divide
        it away; if the claim is latency, rename and scope it. Freeze complete
        rho and BSGS protocols and literal per-size output schemas before any
        comparison.

    - blocker: B12-incomplete-and-contradictory-noninterference
      assertion: A-B12-v3
      adjudication: REVISE
      passed_checks:
        - The scientific public verifier is now defined solely from p, a, b, r, P, Q, candidate identity, and k_hat.
        - True and decoy scalar comparisons are moved after candidate, V, S, and public transcript hashes freeze.
        - Selector and public-verifier secret allowlists are empty and all candidate audit reads are charged.
      blocking_evidence: >-
        The declarative public algorithm is secretless, but the claimed
        exhaustive enforcement is not. The invocation graph records five
        entrypoint names and asserted edge counts without an extraction
        algorithm, node/edge artifact, transitive-call rule, dynamic-load rule,
        or coverage digest. The true/decoy/no-secret sandbox KAT covers only two
        candidates per state, while the public-verifier population is 15728640.
        No rule reruns the complete frozen candidate stream in all three mount
        states or requires public resource counters to be identical. A branch
        outside the two KAT candidate identities can therefore consult a secret
        or secret-derived environment value without being distinguished by the
        stated six-verification KAT; an asserted zero-edge integer is not an
        exhaustive certificate.
      required_repair: >-
        Freeze a reproducible transitive dependency/call-edge certificate for
        the selector and verifier binaries, prohibit dynamic secret paths and
        secret-derived environment inputs at the sandbox boundary, and replay
        the full actual candidate stream under true-secret, decoy-secret, and
        no-secret mounts with byte-identical V, S, transcripts, stdout, and
        public counters. If full counterfactual replay is too costly, weaken the
        claim from exhaustive noninterference and state the sampled ceiling.

  baseline_comparison:
    pollard_rho: N^(1/2+o(1)) with negligible live-storage exponent
    standard_bsgs_full_cost: N^(2/3+o(1)) under the cited three-dimensional wiring model
    candidate_raw_conditional: N^(2/3-gamma+o(1))
    candidate_live_storage_conditional: N^(1/3+o(1))
    candidate_wiring_multiplier_conditional: N^(1/9+o(1))
    candidate_full_conditional: N^(7/9-gamma+o(1))
    symbolic_crossovers:
      raw_vs_pollard_rho: '2/3-gamma<1/2 iff gamma>1/6: PASS'
      full_vs_standard_bsgs: '7/9-gamma<2/3 iff gamma>1/9: PASS'
      full_vs_pollard_rho: '7/9-gamma<1/2 iff gamma>5/18: PASS'
    finite_cost_adjudication: >-
      The exponent algebra remains correct conditionally, and the successor's
      direct per-size gate is the right decision shape. The frozen rows do not
      instantiate that shape under a reproducible full-cost unit or a frozen
      rho algorithm. Pollard rho therefore remains the governing single-target
      baseline, and no finite or Pareto improvement is observed.

  objections:
    - id: RT-CANONICAL-XOF-SEED-FRAMING-UNBOUND
      severity: blocking
      category: public_family_and_replay
      finding: >-
        Type tags, per-domain ordered keys, and seed absorption are not frozen,
        so public objects, secret targets, null labels, and replay bytes are not
        implementation-independent.
    - id: RT-PER-SIZE-CLASS-OWNERSHIP-ABSENT
      severity: blocking
      category: cost_compiler
      finding: >-
        Aggregate class rows omit artifact/probe ownership and n_c(b), leaving
        the mapping into per-size setup, root, control, analysis, and baseline
        costs non-identifying.
    - id: RT-HARDWARE-TIME-SHARD-DIVISION-COLLISION
      severity: blocking
      category: full_cost
      finding: >-
        Dividing aggregate CPU nanoseconds by shard count prices latency rather
        than hardware-time and can reverse the candidate-versus-rho decision.
    - id: RT-POLLARD-RHO-PROTOCOL-UNFROZEN
      severity: blocking
      category: baseline_reproduction
      finding: >-
        The rho class has no walk, seed, distinguished-point, restart, stopping,
        or exact per-size statistic contract.
    - id: RT-NULL-POSITION-INVOLUTION-NOT-POINT-ANTISYMMETRY
      severity: blocking
      category: nearby_object_control
      finding: >-
        Arbitrary adjacent-rank position pairing preserves counts but not the
        signed-y treatment object's negation and duplicate-point correlations.
    - id: RT-NONINTERFERENCE-KAT-NOT-EXHAUSTIVE
      severity: blocking
      category: secret_boundary
      finding: >-
        Six KAT verifications plus asserted graph counts do not certify the full
        candidate stream or transitive executable dependency graph.

  required_controls:
    - id: CTRL-HARDWARE-TIME-SHARD-DIVISION-COLLISION
      cost: symbolic_only_zero_experiment_runs
      purpose: >-
        Compile the frozen 720/8/90 candidate and 500/5/100 rho rows under the
        claimed full-cost convention. The current formula says candidate wins;
        a hardware-time compiler must reject or relabel the quantity as latency.
    - id: CTRL-CANONICAL-XOF-ABSORB-VECTORS
      cost: fixed_tiny_byte_vectors_zero_curve_operations
      purpose: >-
        Before implementation, freeze tag values, ordered keys, seed placement,
        absorbed bytes, and SHAKE outputs for one public prime, one target, one
        decoy, one restart model, and one null-label position. Two independent
        decoders must reproduce the literal bytes.
    - id: CTRL-PER-SIZE-CLASS-ALLOCATION-COLLISION
      cost: symbolic_only_zero_experiment_runs
      purpose: >-
        Hold every aggregate n_c and total counter fixed while using the frozen
        A=[90,90,90,90,90] and B=[50,50,50,50,250] allocations against rho=100.
        Require exact n_c(b), owner, G, C, W, and T rows to distinguish them.
    - id: CTRL-NULL-POINT-NEGATION-AND-DUPLICATE-FIBER
      cost: one_fixed_small_point_list_no_treatment
      purpose: >-
        Hold point bytes fixed with one duplicate and one R,-R pair. Compare the
        treatment antisymmetry to the proposed position null and require the
        contract either to preserve or explicitly isolate both correlations.
    - id: CTRL-SECRETLESS-FULL-STREAM-COUNTERFACTUAL
      cost: existing_candidate_streams_only_no_selector_or_curve_generation
      purpose: >-
        Replay every frozen candidate under true, decoy, and absent secret mounts
        and require identical V, S, public transcripts, stdout, and public
        counters, backed by a transitive call-edge certificate.

  counterexample_or_mutation:
    cheapest_falsification: CTRL-HARDWARE-TIME-SHARD-DIVISION-COLLISION
    cost: symbolic_only_zero_experiment_runs
    construction: >-
      Set setup G, harmonic factor H, and wiring W to 0, 1, and 1 respectively,
      and hold every non-time Pareto axis equal. Give the candidate aggregate
      cpu_ns=720, shards=8, wall_ns=90 and rho cpu_ns=500, shards=5,
      wall_ns=100. The frozen max(cpu_ns/shards,wall_ns) rule returns 90 for
      candidate and 100 for rho, hence a strict candidate pass. Hardware
      multiplied by occupied time is already represented by aggregate CPU
      occupancy and gives 720 versus 500, hence the opposite ordering.
    conclusion: >-
      The declared scalar T is not the stated fully charged hardware-time cost.
      Because shard counts differ between candidate and rho classes, identical
      application of the formula does not remove the bias.
    secondary_observation_fiber: >-
      Two one-byte type-tag registries and two seed absorption positions can
      produce distinct SHAKE bytes while preserving every semantic field,
      population, balance count, and aggregate cap named by the snapshot. The
      missing separator is a literal typed absorb/output vector frozen before
      implementation.

  heuristic_challenges:
    - id: HA-4-independent-restarts
      result: PASS_STATIC_OPERATIONAL_SEMANTICS_ONLY
      detail: >-
        One uniform model and one fresh root are now resampled per attempt, and
        four experimental model views are not treated as four restarts. The
        geometric conclusion remains conditional on HA-4 and domain-separated
        XOF draws; no run validates it.
    - id: HA-5-family-and-model-scaling
      result: REVISE_CANONICAL_FAMILY_BYTES
      detail: >-
        The ceiling honestly forbids unseen-family transfer, but the exact finite
        family is not yet uniquely generated because the tuple tag and seed
        framing are unbound.
    - id: HA-6-wiring-access-charge
      result: REVISE_COST_FUNCTIONAL
      detail: >-
        The cube-root live-line multiplier is named, but aggregate CPU occupancy
        is divided by shards and the measured physical axes are not assembled
        into one full-cost functional. The 5/18 comparison is not instantiated.
    - id: HA-7-finite-size-family-model
      result: PASS_CEILING_ONLY
      detail: >-
        Eta is frozen to -4, 0, and 4 and the confidence rectangle is optimized
        separately for all three. This supports at most the exact finite toy
        ladder and cannot identify an asymptotic exponent.

  cost_model_challenges:
    - The crosswalk has twenty-eight identifiers but no frozen per-size n_c(b) or artifact/probe ownership.
    - The prefix projection does not define whether CPU and wall counters are per-prefix totals, per-item measurements, or already sharded.
    - C_root=max(cpu_ns/shards,wall_ns) is a latency proxy and undercharges hardware-time by the parallel occupancy it divides away.
    - Physical bytes, energy, archive, communication, and line touches are reported beside T but are not composed into its scalar comparison.
    - Candidate setup versus one operational fixed-target cost is not given a matched averaging or summation unit against the 32-input rho row.
    - Pollard rho and BSGS remain class labels rather than byte-exact matched protocols.

  reduction_and_scope_challenges:
    - >-
      The only admissible future observation remains about the exact 18--30-bit,
      160-input, 256-root, four-model toy manifest. No unseen public-family,
      asymptotic, cryptographic-scale, live-key, multi-target, reusable-advice,
      solver, attack, speedup, security-impact, novelty, or breakthrough claim
      follows.
    - >-
      The confidence-set-to-gamma interface is repaired, but the gamma-to-total-
      physical-cost interface is not: a correct confidence bound cannot repair a
      non-identifying cost unit or selectable baseline.
    - >-
      The public scalar equation is the correct secretless verification target.
      The remaining B12 objection concerns exhaustive enforcement, not the
      algebraic equation itself.

  proof_architecture_challenges:
    baseline_reproduction: >-
      The symbolic 1/6, 1/9, and 5/18 boundaries and the five size rows reproduce.
      The concrete boundary does not because the rho protocol and the candidate
      hardware-time functional are not frozen.
    observation_collision: >-
      The producer successfully closes its two declared confidence and aggregate-
      allocation collisions. A cheaper shard-division collision survives, and
      the canonical tuple observable admits different byte preimages. The missing
