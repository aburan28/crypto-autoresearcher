  claim_under_review: >-
    Whether immutable snapshot 9e5b518d68a9c2537036c3f60c4a21c3e37b9a09
    repairs all seven BATCH-eec496 union blockers strongly enough to admit a
    later implementation-only batch: in particular, whether one uniformly
    resampled public model per fresh root has a simultaneous two-sided
    confidence-box lower bound gamma_lower above 5/18 for every frozen eta,
    and whether the corresponding fixed-target cost is compiled one-to-one
    from all twenty-eight physical classes into fully charged per-size totals
    that beat matched Pollard rho, while public-family replay, all-root
    X-to-V-to-S losslessness, the single-delta null, and verifier-secret
    noninterference remain canonical and exhaustive.

  overall_rationale: >-
    REVISE. The snapshot is immutable and strictly parseable, its arithmetic
    populations and caps reconcile, and the main confidence-set repair is
    mathematically sound: the endpoint rule minimizes and maximizes the OLS
    coefficient over the entire stated rectangle, catches the frozen
    confidence collision, and no longer calls a pointwise plug-in fit a lower
    confidence bound. The fresh-restart mixture is operationally frozen, and
    the universal X=V and S=1[V>0] gate is treatment-wide. Four repair
    interfaces nevertheless remain non-identifying. First, the canonical XOF
    framing requires a one-byte type tag but supplies no tag registry,
    per-domain ordered tuple schema, or seed-to-XOF absorption rule; the target
    scalar can therefore be interpreted as either public deterministic output
    or as secret-seeded output in multiple byte-incompatible ways. Second, the
    twenty-eight class rows are aggregate rows without frozen artifact/probe
    ownership or per-size class populations, and the scalar cost definition
    max(cpu_ns/shards,wall_ns) is latency, not hardware multiplied by occupied
    time. A zero-run shard-allocation collision reverses its comparison with
    rho. The rho row itself does not freeze a walk, partition, distinguished-
    point rule, seed domains, restart/stopping rule, or exact per-size output.
    Third, the position-pair null proves exact balance but not the treatment
    label's point-negation antisymmetry, and its only known-answer rows freeze
    counts rather than permutation or label bytes. Fourth, two three-mount KAT
    candidates do not establish exhaustive counterfactual noninterference for
    15728640 public candidates, while the claimed zero-secret-edge invocation
    graph has no frozen extraction or coverage certificate. These are
    repairable static design defects, not evidence against H-SYC-b854f4 or
    ECDLP. No implementation or execution is admissible from this report.

