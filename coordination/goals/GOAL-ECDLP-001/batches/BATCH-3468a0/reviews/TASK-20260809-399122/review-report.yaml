    blocking_ownership_residual: >-
      The common counter contract requires artifact_owner for every class, but
      neither the specification row schema nor any of its 28 rows supplies one.
      The certificate nevertheless states duplicate_stage_or_artifact_owners
      is empty, a statement that cannot be recomputed from absent artifact
      owners. Stage labels repeat and cannot substitute for artifact ownership.
    blocking_decoy_residual: >-
      The frozen generator has independent target and decoy scalar seeds and
      the predecessor prefix table separately freezes 1280 target and 1280
      decoy scalar words. The successor assigns target_scalar_words n_c=1280
      and has no decoy-named or decoy-multiplicity class. The aggregate SHAKE
      count may include the bytes, but the decoy rejection work, commitment,
      sealing, record I/O, and ownership are not assigned to a primitive-cost
      population. Treating row 5 as both streams would require n_c=2560.
    shard_assignment_residual: >-
      A count shards_c is frozen, but no class-to-shard identifier mapping or
      schedule is. Therefore max_shard(sum_c(...)) is not uniquely evaluable
      when 1-, 5-, and 8-shard classes coexist. The table supplies replication
      counts, not the per-class shard allocation required by B1.
    physical_formula_residual: >-
      Twenty-four rows use only measured_all_common_counters as their entire
      physical-memory-energy-wiring formula. This names outputs but does not
      freeze allocation, conversion, or a prefix-to-full-work cost rule. In
      particular, linearly scaling a prefix by n_c/q_c does not specify the
      nonlinear comparison/movement work of sorts or the working-set behavior
      of cache, memory-topology, and wiring classes.
    overall_status: REVISE

