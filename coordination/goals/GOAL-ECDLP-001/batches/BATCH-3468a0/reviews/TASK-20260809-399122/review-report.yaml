    blocking_residual: >-
      The allocation collision correctly proves that per-size rows are needed,
      but the contract then supplies only aggregate 28-class populations. Its
      C_root paragraph defines one upward maximum C_root_ns, while the formulas
      consume undefined C_root_plus and C_root_minus. The wiring paragraph
      defines one upward W_root while the formulas consume W_root_plus and
      W_root_minus. G_candidate and rho likewise have no directed-bound
      construction or class-to-size allocation. H_b is a 32-input mean, G is
      described as one size-level total, and rho is described on all 32 inputs,
