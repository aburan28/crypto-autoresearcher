matched_baselines:
  group_order: N
  factor_deck_scale: "B=N^(1/5)"
  pollard_rho:
    expected_work: "N^(1/2+o(1))"
    serial_memory: "N^(o(1))"
    parallel_accounting: >-
      Parallel wall time may fall with processors, but total group work remains
      N^(1/2+o(1)); candidate parallelism is charged on the same basis.
  bsgs:
    work: "N^(1/2+o(1))"
    memory: "N^(1/2+o(1))"
  generic_preprocessing:
    bound: "S*T^2=Omega_tilde(epsilon*N)"
    implication: >-
      Any claimed setup S<=N^0.45 and fresh query T<=N^0.25 with constant
      success must use a proved non-generic, non-simulable information source;
      S*T^2<=N^0.95 cannot be credited as a generic algorithm.

surviving_candidates: []

operation_level_screen:
  - family: generic_collision_or_preprocessed_generic_group
    mathematical_object: opaque prime-order group encodings
    operation: collision search, table lookup, or generic advice/query tradeoff
    information_source: generic group-operation and equality oracles
    output_semantics: scalar discrete logarithm
    nearest_predecessors:
      - KN-TECH-001
      - KN-TECH-005
      - KN-LIT-011
      - KN-LIT-013
    verdict: no_candidate
    fully_charged_reason: >-
      Rho and BSGS already attain exponent 0.50. Generic preprocessing is
      constrained by S*T^2, so reduced online time is not a total-cost or
      multi-target win unless all advice, memory, success, and amortization are
      charged. No new generic information source was found.

  - family: endomorphism_isogeny_or_representation_transfer
    mathematical_object: curve endomorphism, isogeny, cover, jet, net, pairing, or lifted variety
    operation: split an orbit or transfer the DLP and return an oriented scalar
    information_source: public curve structure beyond the generic oracle
    output_semantics: scalar or exact source relation after return
    nearest_predecessors:
      - ECDLP-IDEA-002
      - ECDLP-IDEA-004
      - ECDLP-IDEA-006
      - ECDLP-IDEA-008
      - ECDLP-IDEA-009
      - ECDLP-IDEA-160
      - P1540-P1548
    verdict: no_candidate
    fully_charged_reason: >-
      Fixed-degree maps provide at most constant-factor gains. Growing-degree
      maps restore construction/state or return costs; pairing targets require
      an auxiliary DLP; jets and tested elliptic-net values were simulable,
      tautological, or k-unspecific in the audited scope. Exact scalar-blind
      return and source replay remain absent.

  - family: relation_collection_and_target_descent
    mathematical_object: five signed factor decks and six-list Abel-Jacobi or Semaev relation fibre
    operation: exact restricted endpoint existence followed by one signed occurrence replay
    information_source: endpoint-derived algebraic reporter, not a supplied source catalogue
    output_semantics: verified relation row and fresh masked-target decomposition
    nearest_predecessors:
      - ECDLP-IDEA-012
      - ECDLP-IDEA-121
      - ECDLP-IDEA-156
      - ECDLP-IDEA-195
      - ECDLP-IDEA-199
      - ECDLP-IDEA-266
      - P1513
      - P1551
      - P1553-R4
    verdict: frontier_only
    fully_charged_reason: >-
      Local determinant, wedge, trace, norm, Fitting-ideal, and tensor identities
      do not construct the target-labelled reporter. Standard realizations
      restore B^3 pair-plus-singleton traffic, B^4 pair-pair traffic, or a B^5
      source algebra. A conditional complete path reaches lambda=0.45 and
      mu=0.40 only if the missing constructor, all-strata replay, useful
      relation density, independent rank, factor logs, and blind descent are
      all proved.

  - family: structured_relation_matrix_or_solver_backend
    mathematical_object: sparse relation matrix or source transition operator
    operation: Wiedemann, block Krylov, displacement solve, Arnoldi, ordering, or projection
    information_source: already represented relation rows or transition nonzeros
    output_semantics: factor logs, kernel vector, or aggregate certificate
    nearest_predecessors:
      - ECDLP-IDEA-056
      - KN-TECH-008
      - KN-OPEN-006
      - EXP-STR-001
      - 20260721-d-L06
      - 20260721-d-L12
    verdict: no_candidate
    fully_charged_reason: >-
      Solver substitution occurs after relation supply. The AP-support control
      measured displacement rank proportional to B and a growing relation
      supply penalty; relation collection dominated. No source-free operator,
      exact lift, or end-to-end gain survived.

  - family: special_curve_attack
    mathematical_object: anomalous, pairing-friendly, low-embedding-degree, or otherwise exceptional curve family
    operation: exploit a family-specific transfer or representation defect
    information_source: public exceptional curve parameters
    output_semantics: scalar discrete logarithm on that family
    nearest_predecessors:
      - KN-TECH-005
      - KN-OPEN-001
      - ECDLP-IDEA-005
      - ECDLP-IDEA-009
    verdict: no_candidate_for_declared_scope
    fully_charged_reason: >-
      Published exceptional-family attacks do not extend to the declared
      generic ordinary prime-field prime-order setting. Restricting the input
      distribution is a scope change, not a generic ECDLP improvement.

  - family: multi_target_or_fixed_curve_amortization
    mathematical_object: fixed-curve advice shared across many public targets
    operation: preprocess once, then answer target DLP or descent queries
    information_source: target-independent advice and retained state
    output_semantics: one or many scalar logarithms
    nearest_predecessors:
      - KN-LIT-013
      - KN-TECH-005
      - P1553-R4
    verdict: no_candidate
    fully_charged_reason: >-
      Online-only improvements disappear when setup, state, number of targets,
      success probability, replay, and verification are matched. No
      non-generic advice constructor with a complete attack path was found.

frontier:
  title: Oracle-free gauge-invariant restriction-aware elliptic unit-product constructor
  novelty_status: unverified
  claim_tier: proposed_theorem_frontier_only
  exact_mechanism_if_constructed: >-
    From public complete-chart pair-divisor trees, construct the mixed
    target/source elliptic-net or division-polynomial terms needed to form
    r_R modulo g_I, or equivalent exact dyadic unit products, without supplied
    recurrence terms, source tuples, target-trained advice, or B^3 represented
    traffic. Use the result as a subset-stable exact Query2P1 decision and
    replay one signed occurrence by O(log B) restrictions.
  exact_nonduplicate_operation: >-
    The new operation would be construction of mixed target/source unit products
    from public pair trees. Fast evaluation of already supplied net terms,
    generic polynomial gcd after r_R is represented, and a backend operating on
    a supplied source graph are semantic duplicates and receive no credit.
  information_source_required: >-
    Public complete elliptic addition/division-polynomial coefficients with a
    proved gauge-invariant normalization. No hidden scalar character, pairing
    target logarithm, occurrence catalogue, mixed-resultant oracle, or
    target-fitted branch is allowed.
  nearest_semantic_predecessors:
    - ideas/artifacts/ECDLP-IDEA-012/p1553_target_label_common_factor_gate_r4.md
    - ideas/artifacts/ECDLP-IDEA-121/translated_product_common_norm_v3_audit_v2.md
    - ideas/artifacts/ECDLP-IDEA-121/ku_circuit_reduction_v2.md
    - ideas/artifacts/ECDLP-IDEA-165/pair_sum_quotient_theorem.md
    - ECDLP-IDEA-006
    - P1513
    - P1551
    - P1516
  assumptions:
    - Complete signed projective charts and denominator saturation are constructible uniformly.
    - The mixed recurrence has no supplied target-dependent seeds or hidden B^3 state.
    - Exact unit/nonunit semantics survive zero, pole, tangent, vertical, identity, infinity, repeated-label, and nonreduced strata.
    - Dyadic restrictions update the state without rebuilding source-sized objects.
    - Relation targets have sufficient useful density and yield Theta(B) independent verified rows.
    - The same target-independent state supports fresh scalar-blind masked-target descent.
  predictions:
    - metric: represented_setup_and_campaign_work
      required_direction: at_most
      threshold: "B^(9/4+o(1)) = N^(0.45+o(1))"
    - metric: fresh_target_work_and_workspace
      required_direction: at_most
      threshold: "B^(5/4+o(1)) = N^(0.25+o(1))"
    - metric: exact_restricted_decision_errors
      required_direction: equal
      threshold: "0 on every admitted stratum"
    - metric: source_replay_queries
      required_direction: at_most
      threshold: "5*ceil(log2(B))+O(1)"
    - metric: complete_time_exponent_lambda
      required_direction: at_most
      threshold: "0.45"
    - metric: complete_memory_exponent_mu
      required_direction: at_most
      threshold: "0.45"
  cheapest_decisive_test:
    type: theorem_only_static_construction_audit
    no_experiment_authorized: true
    design: >-
      Write every recurrence index, seed, coefficient source, gauge action,
      dependency edge, represented dimension, target update, and dyadic
      restriction update. Expand the first mixed term that is not derived from
      public pair-tree data. Either prove the complete exact constructor and
      cost recurrences, or identify the first supplied term or represented
      state exceeding B^(5/4) online or B^(9/4) setup.
  falsification_conditions:
    - Any mixed net, resultant, norm, or recurrence input is supplied rather than constructed.
    - A gauge rescaling changes the returned gcd, unit product, or existence answer.
    - Any admitted exceptional or collision stratum yields a false positive, false negative, or unreplayable occurrence.
    - Target update or one dyadic restriction restores B^3 traffic or exceeds B^(5/4+o(1)).
    - Setup, live state, or the B-target campaign exceeds B^(9/4+o(1)).
    - Useful relation density, independent rank, factor logs, blind descent, verification, bit cost, or memory makes lambda or mu exceed 0.45.
    - The augmented interface is generically simulable with constant overhead, placing it under the generic preprocessing bound.
  confounders:
    - Supplied recurrence terms can make evaluation look fast while hiding construction.
    - Known-scalar target generation can leak an orientation unavailable in blind descent.
    - Incomplete affine charts can silently drop vertical, tangent, infinity, or repeated components.
    - Structured toy decks can expose sparse recurrences while losing generic target coverage or rank.
    - Counting or gcd degree can appear output-sensitive while exact source backpointers remain unrepresented.
    - Parallel wall time can hide unchanged or larger total work and memory.
  complete_conditional_attack_path:
    - Build five signed coloured factor decks of size B and certify all chart strata.
    - Build two source-labelled dyadic pair-divisor indexes in B^(2+o(1)) state/work.
    - Use the proposed constructor for exact target-labelled restricted existence in B^(5/4+o(1)) per fresh target.
    - Replay one occurrence with O(log B) restrictions and verify the elliptic point equation before accepting a row.
    - Query B known-log targets, retain dependencies, obtain Theta(B) independent rows, and require full factor-base rank.
    - Solve all factor logs with a charged B^(2+o(1)) sparse/dense baseline unless a separately proved lower cost applies.
    - Reuse unchanged state on Q+[t]P, replay a decomposition, recover the scalar, and verify it by scalar multiplication.
    - Charge coefficient construction, bit complexity, output, ambiguity, memory, and total parallel work.
  conditional_cost_accounting:
    setup_and_campaign: "B^(9/4+o(1)) = N^(0.45+o(1))"
    retained_pair_state: "B^(2+o(1)) = N^(0.40+o(1))"
    one_fresh_target: "B^(5/4+o(1)) = N^(0.25+o(1))"
    B_target_relation_queries: "B * B^(5/4) = B^(9/4) = N^0.45"
    relation_verification_and_output: "B^(1+o(1)) = N^(0.20+o(1))"
    factor_log_linear_algebra: "B^(2+o(1)) = N^(0.40+o(1))"
    blind_descent: "B^(5/4+o(1)) = N^(0.25+o(1)), conditional on constant useful density"
    complete_conditional_lambda: "0.45"
    complete_conditional_mu: "0.40"
    status: >-
      These are gate arithmetic under missing assumptions, not an achieved
      complexity bound or evidence of an attack.

exactly_one_next_theorem_or_experiment_target:
  kind: theorem
  target: >-
    Prove or refute an oracle-free, gauge-invariant elliptic-net or
    division-polynomial constructor for r_R modulo g_I, or equivalent exact
    dyadic unit products, with B^(9/4+o(1)) total setup/campaign,
    B^(5/4+o(1)) fresh-target work/workspace, exact all-strata restricted
    existence, and O(log B) signed source replay; identify the first required
    mixed seed or represented state that exceeds a cap if construction fails.

terminal_rationale: >-
  No inspected mechanism supplies a new public information source and a fully
  charged route below matched rho/BSGS. The narrow elliptic unit-product
  constructor remains checkable but unconstructed, so the only honest verdict
  is FRONTIER_ONLY.
