  frontier_proposals:
    - local_label: frontier-A
      name: Target-swap state non-interference receipt
      classification: verification_methodology
      decision_changing_uncertainty: >-
        Does a claimed target-independent preprocessing state actually remain
        unchanged when the target is replaced, or does target-derived material
        enter files, caches, seeds, parameters, pointers, or generated
        polynomials and get amortized incorrectly?
      nearest_existing_component:
        component: ideas/artifacts/ECDLP-IDEA-012/p1553_target_label_common_factor_gate_r4.md
        existing_capability: >-
          It requires fresh-target replacement and forbids R in preprocessing,
          but supplies a prose control rather than a replayable dependency
          receipt.
        additional_capability: >-
          A content-addressed stage receipt binds declared inputs, randomness,
          reads, writes, generated state, and target-swap outcomes. It can
          falsify a target-independence claim by exhibiting one target-derived
          dependency or one supposedly frozen-state hash change.
      proposed_artifact:
        kind: target_swap_noninterference_receipt
        required_fields:
          - public/toy fixture identifier and seed
          - declared setup and online stage boundaries
          - content hashes of all setup inputs and outputs
          - target value excluded from setup
          - randomness derivation and environment
          - file/read dependency trace or an explicitly bounded substitute
          - state hashes under at least two independently generated target swaps
          - solver outputs and independent final certificates
          - mismatch witness with first divergent dependency when the gate fails
      cheapest_validation:
        execution_status: not_executed
        fixture: >-
          A toy deterministic solver with one clean target-independent setup,
          one planted hidden-target cache leak, and one planted target-derived
          seed leak.
        bounded_protocol: >-
          Freeze one setup, replay two target swaps, and require the clean
          fixture to preserve setup hashes while both planted leaks produce a
          divergent dependency witness. No live key or deployed system is used.
        cost_bound: >-
          Three bounded toy replays; hashing work O(A) in artifact bytes and
          trace storage O(E) in observed dependency events. This is a validation
          estimate, not a measured runtime.
      falsification_and_failure_modes:
        - An incomplete trace can miss environment, subprocess, mmap, GPU, or network dependencies.
        - Equal hashes do not prove semantic non-interference or exclude a collision.
        - Nondeterministic setup can create false alarms unless randomness and scheduling are frozen.
        - The receipt can become source-sized and erase any claimed memory benefit.
        - A solver may recompute target-dependent state online after a clean setup; that cost must still be charged online.
      quantitative_rigor_or_savings:
        rigor_gain: >-
          For deterministic dependencies inside the declared trace boundary,
          every observed setup-state byte is checked under two target swaps,
          replacing the current zero machine-checkable target-independence
          comparisons with complete comparison over that bounded state.
        decision_rule: >-
          One target-derived dependency or frozen-state hash mismatch moves its
          construction and storage from setup S to per-target cost T. Recompute
          C(K)=S+K*T+relation_collection+linear_algebra+descent+verification;
          withdraw any amortized advantage that no longer beats both matched
          rho and BSGS.
        resource_savings: >-
          If a leak is found after a pilot, all remaining planned scaling runs
          whose premise was target-independent reuse may be cancelled. Savings
          equal the unspent remainder of that frozen run budget; no numeric
          saving is claimed before a protocol exists.
      route_to_attack_cost_reduction: >-
        Methodological only at present. A passing receipt could make a claimed
        reusable preprocessing boundary testable and thereby support a later
        multi-target cost hypothesis; it does not itself lower attack cost.
      promotion_gate: >-
        Independent review must first approve a hermetic trace boundary and
        planted-leak sensitivity test. Passing toy fixtures promotes only to a
        frozen validation protocol.

    - local_label: frontier-B
      name: Rank-and-failure conservation cost certificate
      classification: cost_model_methodology
      decision_changing_uncertainty: >-
        After charging every failed, invalid, censored, duplicated, dependent,
        and parallel attempt, what resource cost buys one new verified relation
        rank unit and a complete K-target attack?
      nearest_existing_component:
        component: >-
          docs/evidence-and-reproducibility.md plus the common lambda/mu formula
          in ideas/reviews/DEDUP-20260721T171454-0700.md
        existing_capability: >-
          The corpus requires censored/invalid reporting and charges density,
          rank credit, memory, and retries; EXP-ICI-001 gives a careful manual
          censoring table.
        additional_capability: >-
          A machine-checkable conservation receipt joins each attempt's
          terminal status and measured resources to its independently verified
          row and incremental matrix rank. It prevents successful-only
          denominators, duplicate-row credit, and parallel wall-time from
          silently replacing total work.
      proposed_artifact:
        kind: rank_failure_cost_certificate
        required_fields:
          - one row for every scheduled attempt and terminal state
          - CPU seconds, wall seconds, group operations, bytes read/written, and peak memory where available
          - censoring cap, retry parent, worker count, and shared-state attribution
          - certificate hash for each accepted relation
          - relation-row hash and rank before/after insertion
          - zero rank credit for duplicates and dependent rows
          - setup, relation collection, factor-log algebra, descent, and verification partitions
          - K-target total and per-target marginal cost
          - matched fully parallel rho and BSGS controls
      accounting_identities:
        - "W_total = W_setup + sum_attempts(W_i) + W_linear_algebra + sum_targets(W_descent_i + W_verify_i)"
        - "R_gain = rank(final_verified_matrix) - rank(initial_matrix)"
        - "W_per_rank_unit = (W_setup + sum_attempts(W_i)) / R_gain; infinity when R_gain = 0"
        - "C(K) = W_setup + W_relations + W_linear_algebra + K*(W_descent + W_verify)"
        - "parallel wall time and aggregate worker work are reported separately; neither substitutes for the other"
      cheapest_validation:
        execution_status: not_executed
        fixture: >-
          A public toy relation stream containing one valid independent row, one
          valid duplicate, one valid dependent row, one invalid certificate,
          one timeout at its cap, and two workers with overlapping wall time.
        bounded_protocol: >-
          Reconstruct the final rank independently and verify exact conservation
          of all attempt IDs and resource counters. The certificate must assign
          rank credit one only to the independent row and zero to all others.
        cost_bound: >-
          One toy campaign replay. Receipt construction is O(m) in attempts plus
          the chosen exact incremental-rank cost; an implementation must report,
          not hide, that rank-audit overhead.
      falsification_and_failure_modes:
        - Resource counters may omit accelerator, kernel, scheduler, or shared-service work.
        - Incremental rank can depend on field, row normalization, and column schema.
        - A censored attempt's unobserved completion time is not inferred as mathematical failure.
        - Confidence bounds are model-dependent when attempts are adaptive or correlated.
        - Shared preprocessing can be double-counted or undercounted without explicit ownership.
      quantitative_rigor_or_savings:
        rigor_gain: >-
          The conservation gate requires 100% of scheduled attempt IDs to appear
          exactly once and gives zero credit to every non-rank-increasing row.
          A speedup claim is blocked whenever any resource partition or terminal
          attempt is unbound.
        decision_rule: >-
          Estimate the lower confidence bound p_L for verified incremental-rank
          yield under a prespecified sampling model. The projected attempts for
          r required rank units are at least ceil(r/p_L), or infinity when
          p_L=0. Continue only if the corresponding conservative total-cost
          envelope remains below both matched rho and BSGS and within budget.
        resource_savings: >-
          After m pilot attempts, if ceil(r/p_L) exceeds the frozen maximum-run
          budget, stop before the remaining budget is spent. Symbolic saved
          attempts are maximum_runs-m; no empirical saving is claimed here.
      route_to_attack_cost_reduction: >-
        Methodological now. It could identify that a higher verified independent
        row yield or better parallel efficiency lowers relation-collection cost,
        but only a separately approved experiment with complete factor logs,
        blind descent, and matched controls could support that attack-cost path.
      promotion_gate: >-
        Independent review must approve resource ownership, rank semantics,
        dependence handling, and the conservative confidence rule before any
        implementation or run is authorized.

  terminal_rationale:
    validated_techniques: 0
    frontier_proposals: 2
    reason: >-
      Both proposals add an auditable artifact absent from the current harness,
      but neither has passed even its cheapest toy validation. Their current
      value is stricter decision methodology, not evidence of a speedup,
      validated improvement, lower bound, or breakthrough.
    exactly_one_next_action: >-
      Commission the already-declared independent TASK-20260721-011 review on
      the verified snapshot; authorize no implementation or experiment unless
      that review selects and freezes one bounded validation protocol.
