      cost_accounting:
        verdict: PASS_CONDITIONAL_ARITHMETIC_ONLY
        recomputation:
          B_definition: "B=N^(1/5)"
          pair_index_setup_and_state: "B^(2+o(1)) = N^(0.40+o(1))"
          one_fresh_query_if_oracle_exists: "B^(5/4+o(1)) = N^(0.25+o(1))"
          B_relation_queries: "B*B^(5/4)=B^(9/4)=N^0.45"
          factor_log_solve_baseline: "B^(2+o(1))=N^0.40"
          conditional_total_time_exponent: "max(0.40,0.45,0.40,0.25)=0.45"
          conditional_peak_memory_exponent: "max(0.40,0.25)=0.40"
          generic_preprocessing_check: "N^0.45*(N^0.25)^2=N^0.95<N"
        limitations:
          - These are resource caps around an absent oracle, not an algorithmic bound.
          - Theta(B) rows must be replaced in any frozen statement by rank d_FB over the actual columns with explicit constant slack and retry accounting.
          - Relation density and blind-target success are assumptions, so no end-to-end success probability is established.
          - The generic preprocessing inequality is only an escape test; it is not a Query2P1 or coordinate lower bound.
