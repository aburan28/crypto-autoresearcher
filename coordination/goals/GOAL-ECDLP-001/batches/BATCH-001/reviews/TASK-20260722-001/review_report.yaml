    - candidate_id: FRONTIER-UNIT-PRODUCT-CONSTRUCTOR
      producer_label: "Oracle-free gauge-invariant restriction-aware elliptic unit-product constructor"
      verdict: FAIL
      reason: >-
        It is not a surviving operation-level novel mechanism and is not ready
        for a frozen theorem or toy experiment. The exact input, output,
