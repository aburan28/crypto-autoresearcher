  technique_verdicts:
    - local_label: frontier-A
      name: Target-swap state non-interference receipt
      verdict: REVISE
      novelty:
        corpus_local: PASS_SCOPED
        external_method_novelty: NOT_ESTABLISHED
        finding: >-
          The current harness lacks this ECDLP-specific gate, but content-hashed
          materials/products, environment metadata, runtime dependency traces,
          and replay are established provenance patterns in in-toto, SLSA, and
          ReproZip. The defensible novelty is their target-swap composition and
          ECDLP cost decision, not a new non-interference method.
      decision_impact:
        verdict: REVISE
        finding: >-
          A causally target-derived setup dependency can block amortization.
          An unexplained hash divergence cannot automatically move all setup
          work to per-target cost; benign nondeterminism and incomplete tracing
          first make the receipt invalid or inconclusive.
      cost_model:
        verdict: REVISE
        implementation_burden: high
        finding: >-
          O(A) hashing and O(E) retained trace size omit trace capture CPU and
          wall overhead, hermeticization, replay, event normalization, memory
          and accelerator observation, and independent receipt verification.
          No numeric run saving or attack-cost reduction is established.
      falsification:
        verdict: REVISE
        finding: >-
          Two target swaps plus planted leaks test sensitivity, not semantic
          non-interference. Add identical-target reruns, target-independent
          nondeterminism controls, a sealed observation boundary, and a rule
          that only a target-to-state causal path is leakage; unexplained
          divergence is inconclusive.
      claim_boundary:
        passing_claim: >-
          At most, no target-derived dependency was observed within one sealed
          deterministic toy trace boundary.
        forbidden_claims:
          - semantic non-interference
          - complete dependency coverage
          - reusable preprocessing at cryptographic scale
          - reduced ECDLP attack cost

    - local_label: frontier-B
      name: Rank-and-failure conservation cost certificate
      verdict: REVISE
      novelty:
        corpus_local: PASS_SCOPED
        external_method_novelty: NOT_ESTABLISHED
        finding: >-
          The corpus already requires terminal-state, failure, censoring, rank,
          retry, and complete-cost accounting. The narrower additional
          capability is a machine-checkable join from a precommitted attempt
          schedule through certificates and canonical rows to incremental rank
          and resource vectors.
      decision_impact:
        verdict: REVISE
        finding: >-
          Exact attempt conservation can block successful-only denominators,
          but completeness is checkable only against a hash-bound schedule
          manifest created before execution. Generated IDs alone cannot expose
          an omitted or silently unscheduled attempt.
      cost_model:
        verdict: FAIL
        implementation_burden: moderate_to_high
        finding: >-
          The p_L rule has the wrong interpretation. Under a fixed IID
          Bernoulli model, p >= p_L makes r/p_L a conservative upper bound on
          expected trials, not a lower bound on required trials. A finite
          high-probability budget must instead solve a binomial or negative-
          binomial tail at p_L and declared alpha. Incremental-rank yield is
          generally state-dependent, so one pilot p_L is invalid without
          prespecified strata or a justified sequential model. CPU seconds,
          wall seconds, group operations, I/O, and memory must remain a vector
          unless a conversion rule is frozen.
      falsification:
        verdict: REVISE
        finding: >-
          The proposed toy stream checks rank arithmetic but not schedule
          completeness or resource ownership. Add planted omitted and duplicate
          attempt IDs, retry-parent cycles, field/schema mismatches, shared-work
          attribution, and an independently reconstructed schedule-to-receipt
          bijection.
      claim_boundary:
        passing_claim: >-
          At most, the receipt conserves a sealed toy campaign's attempt IDs,
          accepted-row validity, incremental rank, and declared resource
          counters under one frozen schema.
        forbidden_claims:
          - lower bound on ECDLP relation cost
          - statistically guaranteed completion from ceil(r/p_L)
          - complete machine-resource accounting
          - reduced ECDLP attack cost

  package_assessment:
    novelty_verdict: REVISE
    decision_impact_verdict: REVISE
    complete_cost_verdict: FAIL
    falsification_verdict: REVISE
    claim_boundary_verdict: PASS
    producer_terminal_verdict_FRONTIER_ONLY_upheld: true
    methodology_value_possible: true
    research_evidence_created: false
    research_finding_created: false
    cryptanalytic_improvement_created: false
    implementation_authorized: false
    experiment_authorized: false
    rationale: >-
      Both artifact ideas can become useful audit gates, but neither is ready
      for a frozen validation protocol. Frontier-A needs a narrower observational
      claim and complete trace overhead. Frontier-B needs a corrected
      probability model, a precommitted schedule, and resource-vector semantics.

  exactly_one_next_action: >-
    Commission one versioned, review-only amendment of frontier-B that seals the
    attempt schedule and field/schema, freezes resource ownership as a vector,
    and replaces ceil(r/p_L) with a declared-alpha negative-binomial tail gate;
    defer frontier-A and authorize no implementation or run until that amendment
    passes another independent review.

  final_claim_boundary: >-
    This passing metadata and snapshot check is not evidence, a research
    finding, a validated methodology, an ECDLP lower bound, an attack-cost
    reduction, or a breakthrough. The review verdict is only REVISE on two
    proposal-stage methodology artifacts.
