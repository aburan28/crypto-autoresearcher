  id: VAL-20260804-e6cca0
  task_id: TASK-20260804-040
  reviewed_task_id: TASK-20260804-039
  snapshot_commit: 9edde63a31dbbb394dd26bfb0cc63818fa99807c
  batch_id: BATCH-057
  experiment_id: EXP-OIFP-0ca0c9
  hypothesis_id: H-OIFP-097d1a
  run_ids:
    - RUN-OIFP-001
  recorded_at: "2026-08-04"

  # ── 1. ARTIFACT CHECKS ────────────────────────────────────────────────────
  artifact_checks:
    - id: AC-001
      artifact: experiments/EXP-OIFP-0ca0c9/specification.yaml
