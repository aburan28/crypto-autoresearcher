  named_duties:
    attainability:
      verdict: REVISE
      deliverable: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-040/attainability_check.md
      summary: >-
        D-0, D-2, D-3 and D-4 have achievable numerical assignments, and no
        branch condition keys on a ledger status. D-5 is not merely reachable:
        under the literal frozen definition of DEP-CAL-E, its archived 1-of-20
        exceedance is a rejection and D-5 fires. D-1 is not a decidable frozen
        predicate because `beyond sampling noise` has no numeric tolerance or
        test and the CELL monotonicity leg supplies no noise rule at all.
    anti_tuning:
      verdict: REVISE
      deliverable: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-040/anti_tuning_check.md
      summary: >-
        The durable Git ordering, all eight archived thresholds, the unchanged
        branch/statistic/ladder/cut inventory, the calibration exclusion of
        OBJ-REAL and all rungs, and the DEP-CAL-D pre-disclosure check pass.
        ATS-DEP-1 nevertheless does not license measurement: RR-DEP-1 freezes
        two purportedly admissible readings of D-5 after observing 1 rather
        than a single rule, while ATS-DEP-1.4 forbids exactly that latitude.
        Applying the natural literal reading makes D-5 fire.
    alternative_class:
      verdict: REVISE
      deliverable: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-040/alternative_class_check.md
      summary: >-
        C1, C2 and C3 all preserve both marginal multisets by source
        construction and none is constrained to permute only within a fine
        e1-bin. But the mandatory DESIGN-TRAP-1 duty cannot be discharged at
        both resolutions: the driver computes source-versus-plant joint TV at
        K=16 only, no K=64 movement diagnostic exists, and C2/C3 have no
        calibration observation. C2 additionally does not require exchanged
        e2 values to occupy different K=16 or K=64 bins, so an exchange need
        not move either table. The contract's blanket assertion that every
        construction measurably moves both tables is therefore unsupported.

  blocking_objections:
    - id: REV040-B1
      duty: anti_tuning_and_attainability
      title: The frozen D-5 control already rejects under its literal definition
      finding: >-
        specification.yaml defines DEP-CAL-E as 20 comparisons and says `a
        rejection is an implementation defect`; D-5 says the control rejects
        at either cell. The archived bits-20 STAT-KS1-E2 arm contains one
        strict-threshold exceedance. The natural per-comparison reading is
        therefore fixed by the contract language independently of the observed
        value, and the observed value satisfies D-5. RR-DEP-1 instead freezes
        an unresolved choice between that reading and a newly introduced
        aggregate/materially-above-nominal reading with no frozen aggregate
        statistic or cut.
      consequence: >-
        The measurement arm must not be approved. Record REVISE and, if the
        apparatus-identity rule is to be aggregate, create a versioned protocol
        amendment with a pre-measurement statistic, multiplicity unit and cut.
    - id: REV040-B2
      duty: attainability
      title: D-1 is not decidable as frozen
      finding: >-
        `Fails to increase monotonically ... beyond sampling noise` never
        defines the sampling-noise allowance, test statistic, confidence level,
        multiplicity rule or equality handling. The CELL-TV leg merely says
        `fails to increase`, although empirical TV from 200 randomized arms can
        wobble. Two honest readers can select different precedence branches
        from identical measured arrays.
      consequence: >-
        Freeze a mechanical D-1 predicate before measurement. A post-result
        choice would violate ATS-DEP-1.4.
    - id: REV040-B3
      duty: alternative_class
      title: DESIGN-TRAP-1 is not checked at K=64 and is not guaranteed per family
      finding: >-
        `induced_dependence` calls only `joint_tv_distance_k16`; no
        source-versus-plant K=64 table distance is computed or archived. The
        calibration observed only rho=0 and the comonotone anchor, not C2 or C3
        and not any ladder rung. Source inspection shows the constructions are
        capable of crossing fine e1 bins, but capability is not the mandatory
        measured assertion. In C2, different e1 K=16 bins are required but
        different e2 bins are not, so a swap can leave both joint tables
        unchanged; cancellations are also possible.
      consequence: >-
        Add a K=64 source-versus-plant movement diagnostic and a frozen
        per-family/per-rung non-invariance gate (or narrow the certified claim)
        before measurement.
    - id: REV040-B4
      duty: alternative_class
      title: The eps_det over 0.02 ratio is not a class-independent sensitivity ratio
      finding: >-
        eps and delta both count a fraction of touched records, but the plants
        alter different coordinates with different effect-size distributions.
        Equal touched fractions do not imply equal joint TV, rank displacement
        or noncentrality for either chi-square grid. Calling eps_det/0.02 the
        honest measure of `how much less sensitive` the apparatus is overstates
        what the ratio identifies.
      consequence: >-
        Label it only as a ratio of smallest detected touched-record fractions
        for two named plant families, or normalize both families by a common
        measured distance before interpreting sensitivity.

  nonblocking_findings:
    - id: REV040-N1
      finding: >-
        THR-DEP-REPRO's dead lower leg is explicitly declared; no claim of an
        under-rejection check is permitted.
    - id: REV040-N2
      finding: >-
        rho_star=0.05 is an openly conventional cut rather than a derived
        structural threshold. That is acceptable only with the full curve and
        scope fence retained.
    - id: REV040-N3
      finding: >-
        At n=130816, K=16 has about 511 observations per joint cell and K=64
        about 31.9 on average per arm. The grids are computationally and
        numerically feasible at the two frozen cells; this does not cure the
        missing K=64 source-versus-plant movement check.
    - id: REV040-N4
      finding: >-
        U1 through U6 are stated prominently in the contract and reading rule;
        no silent claim to those classes was found in the reviewed files.

  required_disposition:
    literal: REVISE
    approval_determination_recommended: REVISE
    next_action: >-
      Do not run RUN-DEP-001-measure. Archive this review, then use the
      Coordinator's conditional close or a versioned pre-measurement amendment
      that resolves REV040-B1 through REV040-B4 without reading measurement
      data.

