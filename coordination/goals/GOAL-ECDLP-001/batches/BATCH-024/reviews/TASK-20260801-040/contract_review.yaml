red_team_report:
  target: 'RR-DEP-1 and ATTAIN-RR-DEP-1 at snapshot f7513991, in the context of EXP-DEP-001 at 36141a95'
  objections:
  - 'RTB-040-1: an object the argument calls "a different object" is bit-identical to a ladder rung.'
  - 'RTB-040-2: two of the four statistics cannot move, and their immobility is used as evidence.'
  - 'RTB-040-3: two of the three plant families cannot create a deviation against a source at the independence coupling.'
  - 'RTB-040-4: a precedence leg is already satisfied on archived data the measurement cannot change.'
  required_controls:
  - id: CTRL-REQ-1
    name: 'the null-object control the calibration owes C2 and C3'
    text: >-
      The identical measurement against a null object of the same shape, per
      docs/inventor-protocol.md section 3. For C1 that control exists and is
      DEP-CAL-C. For C2 and C3 it does not exist, and it is exactly the control that
      would expose TRAP-DISTRIBUTIONAL: run OBJ-PLANT-DEP-CELL-eps at the TOP rung
      eps = 0.25 and OBJ-PLANT-DEP-BLOCK-q at q = 1.00, 200 replicates per cell,
      against the archived thresholds, BEFORE any ladder. Cost: two rungs, roughly
      one twentieth of the measurement arm's budget.
  - id: CTRL-REQ-2
    name: 'the decay question, asked of the right parameter'
    text: >-
      What should the reported quantity do as the parameter meant to destroy it
      increases? For C2 the parameter is eps and the quantity is the K = 16 joint TV
      and the detection rate; both should increase. This reviewer's synthetic run
      predicts both stay flat at the noise floor across the entire CELL ladder. A
      quantity that stays flat when it should rise is the artifact tell, and the
      correct disposition of a flat curve is D-1, not a floor.
  - id: CTRL-REQ-3
    name: 'the statistic-level blindness audit'
    text: >-
      Before any deliverable reports a certifying statistic's non-detection as
      evidence, verify per statistic that it is capable of moving on the object in
      question. STAT-KS1-E1 and STAT-KS1-E2 are not, on any plant in this experiment.
  heuristic_and_cost_model_challenges:
  - 'The eps_det/0.02 ratio D-4 mandates is called like-for-like. It is not: eps counts exchanged pairs of a dependence-destroying relabeling, delta counts re-randomised e1 coordinates of a marginal-moving plant, and about 1/16 of the C2 exchanges are table-neutral at K = 16. The ratio should carry both caveats or not be reported as a comparison.'
  - 'DET-DEP-1 at 190/200 against a 199/200 threshold is a power bar of 0.95 against a nominal level of 0.00995 per comparison. That is a sound bar. But CERT-DEP-1 names three certifying statistics of which one is structurally incapable of reaching it, so the effective certifying set is two, and any certification language should say two.'
  - 'No cost or memory claim is made anywhere in this batch and none is challenged. Claim tier is toy throughout, at 16 and 20 bits, and the file says so.'
  baseline_comparison:
    pollard_rho: 'n/a - no ECDLP solver, no relation search and no search outcome is measured or claimed anywhere in EXP-DEP-001.'
    bsgs: 'n/a - same reason.'
    closest_specialised_baseline: >-
      The closest baseline is EXP-EQD-001 / EV-EQD-001 itself, whose e_1-marginal
      certification at delta = 0.05 with a branch-level floor of delta = 0.02 this
      experiment exists to qualify. RR-DEP-1 correctly forbids `support` in every
      branch and correctly forbids describing BATCH-023 as vacuous.
    dominated_by: 'n/a (no attack, no speedup and no result is claimed by the artifact under review)'
    sota_delta: 'n/a (instrument-characterisation batch; no performance quantity exists to compare)'
  scope_limits:
  - 'This review rules on RR-DEP-1 as frozen and on the frozen contract it substitutes into. It states no disposition about H-DEP-001, H-EQD-001, H-SMTH-001 or HEUR-DS-1 in either direction.'
  - 'The synthetic 40-replicate control this reviewer ran used an EXACTLY independent uniform source, not the INT-2 fibre map. It is a mechanism demonstration, not a measurement of the real source. Its transfer to the real source rests on the archived DEP-CAL-C evidence that maximal destruction of the real source''s dependence is undetectable, which is on-instrument evidence at the two frozen cells and nowhere else.'
  - 'CLAIM TIER TOY throughout. Nothing here is scale-matched to anything cryptographic.'
  - 'This REVISE does not declare any direction impossible. C1 is a sound, genuinely dependence-creating construction and the measurement it supports remains worth making once the four defects are repaired.'
  next_concrete_action: >-
    ONE ACTION. Before TASK-20260801-041 makes any approval determination, the
    Coordinator records a single versioned protocol_amendment that (a) states this
    ruling on OPEN-RR-DEP-1-A and its consequence for D-5, (b) corrects the
    rho = 1.00 / anchor identity and re-classifies D-3 accordingly, and (c) either
    supplies the C2/C3 null-object control CTRL-REQ-1 as a pre-measurement stage or
    strikes the CELL and BLOCK ladders from the certification claim. It is justified
    on grounds independent of any measurement result, and it discloses in terms that
    it changes the D-5 outcome on the already-known archived value.

