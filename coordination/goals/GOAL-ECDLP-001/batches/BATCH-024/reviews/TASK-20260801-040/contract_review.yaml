# ---------------------------------------------------------------------
# THE HEADLINE
# ---------------------------------------------------------------------
summary: >-
  RR-DEP-1's SUBSTITUTION DISCIPLINE IS CLEAN. Every one of the eight primary
  thresholds, the eight secondary order statistics, the eight THR-DEP-REPRO counts,
  the DEP-CAL-C / D / E / F counts and every DIAG-DEP-RHO summary reproduces EXACTLY
  from the archived raw arrays under this reviewer's own recomputation. The branch
  set is byte-for-byte the frozen one in the frozen order, no cut moved, no rung and
  no statistic changed, no statistic was excluded, no branch keys on a ledger status,
  the D5 arm attribution is correct, and the driver's own loader and threshold guard
  accept the file with all eight rows equal. On the anti-tuning duty the file passes.
  THE VERDICT IS NEVERTHELESS REVISE, on the DESIGN-TRAP-1 and ATTAINABILITY duties,
  for four defects that the substitution discipline could not have caught because
  they are properties of the frozen construction and of the attainability argument
  built on it. Two of the four are decisive on their own - the rho = 1.00 rung of
  DEP-LADDER-RHO is BIT-IDENTICALLY the DEP-CAL-D comonotone anchor, which the
  attainability argument expressly denies and which collapses D-3; and both KS
  statistics are PROVABLY CONSTANT between a source arm and any plant arm in this
  experiment, so the attainability argument's D-2, D-3 and D-4 entries rest in part
  on outputs that carry no information about dependence at all.

# ---------------------------------------------------------------------
# DUTY 1 - THE DESIGN-TRAP-1 RE-DERIVATION
# ---------------------------------------------------------------------
design_trap_1:
  duty: >-
    Derive the invariance statement independently; then, from SOURCE, state per
    construction at what resolution its reordering moves mass and why it is not
    invariant at K = 16 or K = 64. A construction invariant at either is a REVISE.

  independent_derivation:
    setup: >-
      The arm is n = 130816 pairs (e1_i, e2_i). The chi-square statistics read the
      joint contingency table N_K[b][c] = #{i : bin_K(e1_i) = b, bin_K(e2_i) = c},
      with bin_K(e) = (e*K)//p, K in {16, 64}, via EQD._cell_index. A plant leaves
      e1 untouched and replaces e2 by a rearrangement of the SAME multiset.
    step_1: >-
      Let S_1, ..., S_r partition the RECORD indices, and let sigma permute e2 values
      only within each S_j. Then for every j the multiset {e2_i : i in S_j} is
      unchanged, hence so is the multiset {bin_K(e2_i) : i in S_j}.
    step_2: >-
      If each S_j is CONTAINED IN a single e1 bin at resolution K - i.e. the strata
      REFINE the e1 binning - then every row of N_K is a disjoint union of the strata
      lying in it, and each such row's column multiset is unchanged by step 1.
      Therefore N_K is EXACTLY invariant, entry by entry.
    step_3_the_tautology: >-
      All four statistics are functions of the two arms only through N_K (the two
      chi-squares) and through the one-dimensional empirical distributions of e1 and
      of e2 (the two KS statistics), and all of those are invariant. So the planted
      arm yields the SAME statistic values as its source arm. Comparing it against a
      fresh null is then distributionally identical to comparing the source against a
      fresh null - a null-versus-null comparison. The exceedance rate is the nominal
      false-rejection rate at EVERY rung, by construction, and the resulting
      "detection curve" is a measurement of the threshold, not of power.
    step_4_the_resolution_lattice: >-
      RECOMPUTED, NOT ASSUMED. floor(floor(e*64/p)/4) = floor(e*64/(4p)) = floor(e*16/p),
      so the K = 64 grid REFINES the K = 16 grid exactly. Consequences: invariance at
      K = 64 IMPLIES invariance at K = 16 (marginalise four-by-four), and invariance
      at K = 16 does NOT imply invariance at K = 64. A within-e1-K16-bin permutation
      is therefore exactly invariant at K = 16 and generally NOT at K = 64; a
      within-e1-K64-bin permutation is exactly invariant at BOTH. The trap has two
      distinct depths and the handoff is right to demand both be checked.
    numerical_confirmation_of_the_derivation:
      method: 'built both trap plants on an independent synthetic arm at p = 46663, n = 130816'
      within_e1_K16_strata: 'K16 cells moved 0, TV 0.000000 | K64 cells moved 11283, TV 0.086251'
      within_e1_K64_strata: 'K16 cells moved 0, TV 0.000000 | K64 cells moved 0, TV 0.000000'
      reading: 'the derivation is confirmed, including the one-sided implication between resolutions.'

  per_construction_verdict:
  - construction: C1 / OBJ-PLANT-DEP-rho / plant_copula
    source_lines: 'dep001_driver.py 426-445'
    the_reordering: >-
      e2_new[i] = sort(e2)[rank(z2)_i] with z2 = rho*Z1 + sqrt(1-rho^2)*W and
      Z1 = Phi_inv grid indexed by rank(e1). The rearrangement is a GLOBAL rank
      matching computed over all n indices; it is confined to no stratum at any
      resolution, and it depends on the ranks of e2 (through sort(e2)) as well as on
      e1. This is the one construction that IMPOSES a coupling rather than removing one.
    resolution_at_which_mass_moves: >-
      The finest available - the rank-pair coupling of every record. To first order in
      rho the cell probability deviates from independence by rho times the product of
      the two per-cell Hermite-1 integrals, which is nonzero on every cell whose
      rank-range is not symmetric about 1/2; no cell of either grid is.
    invariant_at_K16: false
    invariant_at_K64: false
    measured: 'rho=0.0025 K16 TV 0.022910 / K64 0.099231; rho=0.05 K16 0.028467 / K64 0.099743; rho=1.0 K16 0.921692 / K64 0.969423'
  - construction: C2 / OBJ-PLANT-DEP-CELL-eps / plant_cell
    source_lines: 'dep001_driver.py 455-501, the constraint at line 489 `keep = bins[u] != bins[v]` with `bins = (e1*16)//p`'
    the_reordering: >-
      floor(eps*n/2) disjoint transpositions of e2 between records in DIFFERENT
      e1-K16 bins. The constraint is the exact NEGATION of the trap: the driver
      requires the two records to lie in different strata, where the trap would have
      required them to lie in the same one. This is the anti-trap made explicit in code.
    resolution_at_which_mass_moves: >-
      K = 16 by construction, since the two rows are different by the constraint; a
      transposition fails to move the K = 16 table only in the sub-case
      bin16(e2[u]) = bin16(e2[v]), of probability about 1/16, so at eps = 0.005 all
      327 transpositions would have to land in that sub-case simultaneously.
      Different K = 16 rows implies different K = 64 rows because K = 64 refines
      K = 16, so the K = 64 table moves too, with per-pair failure probability ~1/64.
    invariant_at_K16: false
    invariant_at_K64: false
    measured: 'eps=0.005 K16 TV 0.001789 / K64 0.004212; eps=0.02 0.003195 / 0.012239; eps=0.25 0.012177 / 0.048580'
    charge_the_reviewer_adds: >-
      The effective mass moved at K = 16 is about (15/16)*eps, not eps. DDV-5's
      eps_det is a nominal fraction of exchanged pairs, and the ratio eps_det/0.02
      that D-4 mandates compares it to a re-randomisation fraction of a DIFFERENT
      family. The ratio is not the like-for-like comparison the contract calls it.
  - construction: C3 / OBJ-PLANT-DEP-BLOCK-q / plant_block
    source_lines: 'dep001_driver.py 504-529'
    the_reordering: >-
      Two strata split at the e1 rank median; a uniform permutation of the chosen e2
      values WITHIN each stratum. The strata are far COARSER than the grid - each
      spans roughly eight K = 16 e1 bins and thirty-two K = 64 bins - so they do NOT
      refine the e1 binning and step 2 of the derivation does not apply.
    resolution_at_which_mass_moves: >-
      Both. A permuted record's e2 lands in a different e1 bin with probability about
      1 - 1/8 at K = 16 and 1 - 1/32 at K = 64.
    invariant_at_K16: false
    invariant_at_K64: false
    measured: 'q=0.05 K16 TV 0.004892 / K64 0.021068; q=0.25 0.011352 / 0.048817; q=1.0 0.022665 / 0.097136'

  verdict_on_the_literal_criterion: >-
    NO CONSTRUCTION IS EXACTLY INVARIANT AT K = 16 OR AT K = 64, AND NONE IS
    INVARIANT AT ONE RESOLUTION AND NOT THE OTHER. On the literal DESIGN-TRAP-1
    criterion the three constructions PASS, and the contract's prose reason for each
    - "moves mass across e1 bins" for C1, the `!=` constraint for C2, "strata far
    coarser than the grid" for C3 - is accurate against source.

  but_the_trap_recurs_by_a_second_route:
    id: TRAP-DISTRIBUTIONAL
    statement: >-
      DESIGN-TRAP-1 is stated as EXACT TABLE INVARIANCE. C2 and C3 escape that and
      land in the identical tautology by distribution. In both, the permutation sigma
      is a function of e1 and of fresh randomness ONLY, and never of e2 (verified at
      source: plant_cell's pairs are constrained by `bins`, a function of e1;
      plant_block's strata are e1 ranks and its choices are rng draws). If the source
      records are i.i.d. and e2 is independent of e1, the e2 vector is exchangeable
      given e1, so applying any e2-independent sigma leaves the JOINT LAW EXACTLY
      UNCHANGED. C2 and C3 are dependence-DESTROYING, never dependence-creating; the
      largest deviation either can produce is bounded by the dependence the source
      already carries.
    why_this_is_not_hypothetical_here: >-
      The calibration measured the MAXIMALLY destructive member of that family. A
      uniform random permutation of e2 is OBJ-PLANT-DEP-0, and the file's own D5
      block classifies it correctly as dependence-destroying. On the real INT-2
      source its measured K = 16 joint TV is 0.023457 and 0.023241 - at the
      multinomial noise floor - its plant Spearman is -0.000045 and 0.000091, the
      representative null draws record source Spearman 0.00034 and 0.00023, and its
      exceedance counts against the archived thresholds are 2, 1, 5, 2 and 1, 6, 0, 2
      of 200, i.e. nominal. TOTAL DESTRUCTION OF THE SOURCE'S DEPENDENCE IS
      UNDETECTABLE ON THIS INSTRUMENT, AS MEASURED. Every C2 rung and every C3 rung
      destroys a subset of what the uniform permutation destroys.
    the_reviewer_ran_the_discriminating_control: >-
      40 paired replicates at p = 46663, n = 130816, on an exactly independent
      synthetic source, comparing plant-versus-fresh-null against
      source-versus-fresh-null with the driver's own statistics_of and the imported
      EXP-EQD-001 code path. Mean shift in null standard deviations of STAT-CHI-16 /
      STAT-CHI-64: C1 at rho = 0.05, +7.33 / +1.96; C1 at rho = 1.00, +10182 / +2554;
      C2 AT ITS TOP RUNG eps = 0.25, +0.21 / +0.16; C3 AT ITS TOP RUNG q = 1.00,
      +0.15 / +0.19. C2 and C3 AT THE TOP OF THEIR LADDERS ARE INDISTINGUISHABLE FROM
      THE NULL.
    consequence: >-
      DDV-5's eps_det is NONE_ON_LADDER by construction rather than by low power, so
      the D-4 ratio eps_det/0.02 does not exist and cannot be produced; DDV-3 over
      DEP-LADDER-BLOCK is a nominal-rate measurement at every rung; and C3 has NO
      guard whatever, because D-1 has a Spearman leg for the RHO ladder and a TV leg
      for the CELL ladder but NO leg for the BLOCK ladder, and DEP-LADDER-BLOCK has
      no calibration endpoint (the file discloses the missing endpoint but not the
      missing guard). The one guard that does bite is D-1's CELL-ladder TV leg, which
      will correctly fire on a flat TV curve and route the run to `inconclusive`.
    severity: 'blocking, jointly with the attainability defects below'

# ---------------------------------------------------------------------
# DUTY 2 - OPEN-RR-DEP-1-A
# ---------------------------------------------------------------------
open_rr_dep_1_a:
  item: >-
    D-5's second leg - "the DEP-CAL-E apparatus-identity control rejects at either
    cell" - admits READING-A (per-exceedance) and READING-B (aggregate). RR-DEP-1
    records both and chooses neither, and names TASK-20260801-040 as the route.
  ruling: READING-A
  ruling_text: >-
    THE FROZEN TEXT MEANS READING-A. The leg is satisfied if ANY single
    replicate-statistic comparison in DEP-CAL-E, at either cell, over any of the four
    members of STAT-DEP-1, strictly exceeds its archived threshold.
  grounds_all_textual:
    g1_defined_term: >-
      "Rejects" is a DEFINED TERM in this contract and its definition is
      per-comparison. THR-DEP-1: "The rejection rule is STRICTLY GREATER THAN the
      threshold." The metrics inventory: DEP_reject_per_replicate is "boolean per
      statistic per replicate, the statistic strictly greater than its archived
      THR-DEP-1 threshold". The driver implements exactly that (rejects_against,
      line 741). No aggregate sense of "reject" is defined anywhere in the contract.
    g2_expressio_unius: >-
      THE TWO LEGS SIT IN ONE SENTENCE AND ONLY ONE OF THEM CARRIES A BAND. The first
      leg reads "detects ABOVE THE THR-DEP-REPRO BAND" - an explicit, named,
      pre-frozen aggregate cut. The second reads "rejects at either cell" with no
      band, no rate and no cut. Where this contract wanted an aggregate reading it
      supplied the aggregate instrument by name; its absence in the sibling clause is
      deliberate contrast, not an omission a reviewer may fill.
    g3_the_controls_own_words: >-
      DEP-CAL-E's stage text: "DERIVABLY the same law; A REJECTION is an
      implementation defect." CTRL-DEP-IDENT: "REJECTION is an implementation
      defect." Both are indefinite and existential. Neither speaks of a rate.
    g4_reading_b_is_an_amendment_not_an_interpretation: >-
      DECISIVE. READING-B requires a materiality cut - how far above nominal is
      "materially above" - and the frozen contract fixes none. Supplying one now
      would be ADDING A CUT after calibration, which ATS-DEP-1.2 forbids in terms
      ("no cut may move") and which ATS-DEP-1.4 forbids in effect. A reviewer may
      construe a frozen text; he may not complete it.
    g5_no_certifying_only_narrowing: >-
      The leg says "the control", and the control is defined by CALE_apparatus_identity_values
      as "EVERY STATISTIC on 20 fresh-null-versus-fresh-null comparisons per cell".
      CERT-DEP-1 restricts certification for DDV-4 and DDV-5 only and does not reach
      a control leg. RR-DEP-1 is right that narrowing to certifying statistics would
      be a rewording of a frozen branch.
  could_this_ruling_be_made_without_the_measured_value: true
  independence_from_the_measured_value: >-
    YES, AND THIS IS THE POINT OF THE DUTY. Grounds g1 through g5 are entirely
    textual - a defined term, a contrast within one sentence, the control's own
    wording, and the impossibility of supplying a missing cut. Not one of them
    mentions, uses or depends on the DEP-CAL-E counts. Had the archived value been 0
    the ruling would be identical, word for word; the only difference would be that
    the leg is not satisfied. The reviewer discloses that the handoff quoted the
    measured value to him before he ruled, and states the counterfactual explicitly
    so the ruling can be audited against ATS-DEP-1.4 in both directions.
  consequence_stated_separately_as_arithmetic_not_latitude:
    fact: >-
      DEP-CAL-E's archived arrays contain exactly one exceedance - STAT-KS1-E2 at
      bits 20 - recomputed by this reviewer from the raw replicate values (0,0,0,0 of
      20 at bits 16; 0,0,0,1 of 20 at bits 20). Under READING-A the leg is satisfied.
    dep_cal_e_is_calibration_only_and_is_never_re_run: >-
      VERIFIED AT SOURCE. DEP-CAL-A through DEP-CAL-F are produced by run_calibration
      only; run_measurement (line 1383) computes no apparatus-identity arm. D-5's
      second leg therefore reads a quantity that is already frozen in the archive and
      that the measurement arm cannot change.
    therefore: >-
      D-5 IS SATISFIED NOW, BEFORE THE MEASUREMENT ARM RUNS, AND D-5 PRECEDES D-2,
      D-3 AND D-4 IN THE FROZEN PRECEDENCE. The disposition of a measurement run
      under the currently frozen pair is already determined: instrument failure, no
      disposition about any object in either direction. Spending the measurement
      budget would not change the reading.
  the_design_flaw_this_exposes:
    computed_from_the_contract_alone: >-
      The archived-threshold rule is the 199th order statistic of 200, so a fresh
      independent draw exceeds it with probability 2/201 = 0.00995 - the contract's
      OWN figure, used in THR-DEP-REPRO. DEP-CAL-E performs 20 replicates x 4
      statistics x 2 cells = 160 such comparisons. Recomputed here: P(at least one
      exceedance at a given cell) = 0.5507, P(at least one at either cell) = 0.7981.
    statement: >-
      UNDER THE ONLY READING THE FROZEN TEXT SUPPORTS, D-5's SECOND LEG FIRES ABOUT
      80 PERCENT OF THE TIME ON A PERFECTLY CORRECT APPARATUS. An apparatus-failure
      detector with a 0.80 false-fire rate is not a control. The error is the
      contract's, not RR-DEP-1's: the phrase "DERIVABLY the same law; a rejection is
      an implementation defect" conflates identity of law with never exceeding a
      99th-percentile threshold. This arithmetic uses only pre-datum quantities and
      was available before any calibration number existed.
    rr_dep_1_is_not_at_fault_here: >-
      RR-DEP-1 declined to choose, named the ambiguity, named the route and named the
      consequence if unresolved. That was the correct handling and it is why the
      defect surfaced before the measurement arm rather than after it.
  forward_guidance_not_a_closure:
    what_remains_open: >-
      The lane is not dead. The repair is a versioned protocol_amendment to D-5's
      second leg, admissible under the editable_until clause only if it is justified
      SOLELY by the pre-datum arithmetic above and is written in a form that would
      have been written before any datum - e.g. an exact binomial band on the
      DEP-CAL-E count at the same per-test stringency the contract already chose for
      THR-DEP-REPRO (about 5e-4). Recomputed here for reference and NOT applied by
      this review: at n = 20 and p = 2/201, P(count >= 1) = 0.1813, P(>= 2) = 0.0167,
      P(>= 3) = 0.00099, P(>= 4) = 4.2e-5.
    the_disclosure_that_must_accompany_any_such_amendment: >-
      MANDATORY AND NON-NEGOTIABLE. Any such amendment flips D-5 from satisfied to
      not satisfied on the already-known archived value. That fact must be stated in
      the amendment itself, in those words, together with this ruling, so that no
      later reader can mistake the amendment for a neutral clarification. Without
      that disclosure the amendment is ATS-DEP-1.4 latitude however it is justified.
    the_reviewer_does_not_write_it: 'Authoring the amendment is the Coordinator''s act, not this task''s.'

# ---------------------------------------------------------------------
# DUTY 3 - ATTAINABILITY (full detail in attainability_check.md)
# ---------------------------------------------------------------------
attainability:
  every_branch_reachable_as_claimed_by_the_file: false
  branches_this_review_finds_not_reachable: [D-3, 'D-2 / D-3 / D-4 jointly, under the D-5 ruling']
  attain_no_mono_dependence_claim: PARTIALLY_UPHELD
  attain_no_mono_dependence_finding: >-
    The claim is that NO step of the argument assumes per-rung movement, resting only
    on counts being achievable integers plus the two measured endpoints. Checked step
    by step. The claim HOLDS for D-0, D-1 and D-5, whose entries genuinely use only
    integer-range and measured-range facts. It FAILS as a defence of D-2, D-3 and
    D-4, not because those entries assume per-rung movement, but because they lean on
    ENDPOINT measurements that the reviewer finds carry no information about
    dependence - both KS statistics are provably constant between a source arm and
    any plant arm - and because one of the two "endpoints" is in fact a ladder rung.
    An argument that avoids one unsound premise by leaning on a second unsound one is
    not repaired by the declaration.

# ---------------------------------------------------------------------
# BLOCKING DEFECTS
# ---------------------------------------------------------------------
blocking_defects:
- id: RTB-040-1
  severity: blocking
  title: 'The rho = 1.00 rung of DEP-LADDER-RHO IS the DEP-CAL-D comonotone anchor, bit-identically.'
  location: 'reading_rule.yaml attainability_argument.per_branch D-4 what_is_not_claimed; specification.yaml OBJ-PLANT-DEP-EXTREME / ATS-DEP-1.6'
  the_file_says: >-
    "The anchor is NOT the rho = 1.00 rung. It is a different object - noiseless
    comonotone reordering rather than a Gaussian-copula reordering at rho = 1."
  the_source_says: >-
    plant_copula computes sqrt(max(0.0, 1.0 - rho*rho)), which at rho = 1.0 is
    exactly 0.0, so z2 = z1 exactly; ranks_ties_by_index of the strictly ascending
    phi_inv grid indexed by rank(e1) returns rank(e1); hence
    e2_new = sort(e2)[rank(e1)], which is plant_comonotone's return value verbatim.
  verified_by_execution: >-
    plant_copula(e1, e2, 1.0, rng) == plant_comonotone(e1, e2) elementwise on three
    independent seeds, and independent of the noise stream supplied. The joint-TV
    table computed for this review shows the two rows identical to the last digit
    (K16 0.921692, K64 0.969423).
  consequences:
  - 'The CALIBRATION MEASURED THE TOP RUNG OF DEP-LADDER-RHO. `ladder_rungs_executed: []` and ATS-DEP-1.6''s "NOT a ladder rung" are wrong in substance, however honestly recorded.'
  - 'The declared pre-disclosure is LARGER THAN DECLARED: the archive already shows 20/20 detection by both chi-squares at both cells at the top rung, at threshold ratios of 704x, 56.8x, 691x and 57.7x (all four recomputed here from raw-result.json).'
  - 'D-3 requires rho_det = NONE_ON_LADDER, i.e. that no rung including rho = 1.00 reaches DET-DEP-1 at both cells. The archived measurement on the identical object is 20/20 at both cells at 57x threshold minimum. D-3 is not reachable on any measurement this instrument can produce.'
  - 'D-3''s MANDATORY counterexample certificate requires an object with maximal measured rank correlation whose FOUR statistics all fall below the archived thresholds. The maximal-rank-correlation object is the anchor, measured at 704x and 57x above threshold. The certificate is unobtainable, so D-3 could not be completed even if selected.'
  what_would_have_to_change: 'A protocol_amendment, not a reading-rule edit. Not this task''s act.'
- id: RTB-040-2
  severity: blocking
  title: 'Both KS statistics are provably constant between a source arm and any plant arm; the attainability argument uses their outputs as measured evidence about dependence.'
  derivation: >-
    STAT-KS1-E1 = stat_ks1(e1_a, e1_b) reads only the e1 arrays, and every plant
    leaves e1 bit-identical (plant_arm returns e1s.copy(); CTRL-DEP-MARG enforces
    it). STAT-KS1-E2 = stat_ks1(e2_a, e2_b) is a function of the EMPIRICAL
    DISTRIBUTION of e2 only, and every plant returns a permutation of the same e2
    multiset. Both are therefore identical on the plant arm and on its source arm,
    for every family and every rung, deterministically.
  verified_by_execution: >-
    Confirmed exactly (bitwise equality of both KS values) for copula rho = 0.5, the
    comonotone anchor, cell eps = 0.25 and block q = 1.0, while STAT-CHI-16 moved by
    factors 24.9, 308.6, 1.005 and 1.119 on the same arms.
  consequences:
  - 'Of the three CERT-DEP-1 certifying statistics, only TWO can move at all. STAT-KS1-E1 has exactly the null distribution at every rung of every ladder, by construction.'
  - 'ATTAIN-RR-DEP-1''s D-2 entry credits the instrument with attaining "counts at both ends of the range WITHIN THE CERTIFYING SET" by pairing the chi-squares'' 20/20 with STAT-KS1-E1''s 3/20 and 0/20 "on the SAME object". The second half is a null-versus-null draw with no relation to the object.'
  - 'ATTAIN-RR-DEP-1''s D-3 entry states that STAT-KS1-E1 "failed the bar at maximal monotone dependence at both cells", presenting a structurally guaranteed non-detection as evidence about dependence. It is not evidence about dependence.'
  - 'The D-3 certificate paragraph counts STAT-KS1-E1 and STAT-KS1-E2 non-exceedances as two of the four statistics already satisfying the certificate. Those two are guaranteed, so the certificate''s difficulty rests entirely on the two chi-squares, which are measured 57x to 704x ABOVE threshold on the required object.'
  - 'record.excluded_statistics_none reports STAT-KS1-E2''s 0-of-20 on the anchor as "RECORDED AND NOT EXPLAINED". It has a complete deterministic explanation, supplied above. Leaving a mechanically explicable null unexplained is the artifact tell of docs/inventor-protocol.md section 3 read in the wrong direction.'
- id: RTB-040-3
  severity: blocking
  title: 'C2 and C3 are e2-independent relabelings and are null objects in law against a source measured at the independence coupling.'
  detail: 'See design_trap_1.but_the_trap_recurs_by_a_second_route above and alternative_class_check.md.'
  consequences:
  - 'eps_det = NONE_ON_LADDER is forced by construction, not measured as low power. The D-4 ratio eps_det/0.02 cannot be produced under any outcome.'
  - 'DDV-3 over DEP-LADDER-BLOCK measures the nominal rate at every rung, and D-1 has NO leg over the BLOCK ladder, so C3 is unguarded. ALT-CLASS-DEP-1 nevertheless contemplates certifying C3 "at the fractions measured" on a valid run.'
  - 'D-1''s CELL-ladder TV leg WILL correctly fire on the resulting flat TV curve. That is the design working, and it means the honest outcome of the measurement arm as currently frozen is `inconclusive` on the instrument by two independent routes (D-1 and D-5).'
- id: RTB-040-4
  severity: blocking
  title: 'D-5 is satisfied on archived, non-re-runnable calibration data under the only admissible reading, so D-2, D-3 and D-4 are unreachable in this run.'
  detail: 'See open_rr_dep_1_a above. This defect is the frozen contract''s, surfaced correctly by RR-DEP-1''s own open item.'

non_blocking_defects:
- id: RTN-040-1
  title: 'The corrected DET-DEP-1 constant is itself 4 ulps low, and the three-way confirmation is not reproducible as stated.'
  recomputed: >-
    The exact one-sided 95 percent lower Clopper-Pearson bound at 190 of 200 is
    0.916664848933628025523679399... (300-step bisection on an exact mpmath binomial
    tail at 60 digits). The correctly rounded double is 0.916664848933628, and
    scipy.stats.beta.ppf(0.05, 190, 11) returns exactly that. The file's
    0.9166648489336275 is 4 ulps (about 5.0e-16) below it, and its tail evaluates to
    0.049999999999997 rather than 0.05.
  the_overstated_claim: >-
    "Confirmed three independent ways ... All three agree, and all three equal the
    value the driver recorded." The scipy leg does not agree with the driver's value
    as a double. The driver's 200-iteration float bisection is the likely source, and
    its recorded residual 2.08e-17 understates the true error.
  materiality: >-
    NONE FOR ANY DECISION. The constant is used only to establish that the bound at
    190 of 200 clears the 0.90 floor, with a margin of 1.67e-2 against an error of
    5e-16. The operational equivalence DET-DEP-1 iff count >= 190 of 200 is
    UNCHANGED, and this reviewer independently confirms that equivalence.
- id: RTN-040-2
  title: 'The literal "0.9145 appears nowhere" phrasing is inaccurate.'
  finding: >-
    0.9145 occurs three times in reading_rule.yaml, at lines 435, 446 and 447, ALL
    inside det_dep_1_constant_correction and all in the negating role - naming the
    wrong constant, asserting it is wrong, and showing it matches neither bound. It
    is nowhere applied, substituted or carried as a value. The file's own narrower
    claim, "It is not copied forward anywhere in this file", is ACCURATE. The
    TASK-20260801-039 commit message's absolute phrasing "appears nowhere in the
    frozen file" is not. No defect in the reading rule; recorded so the commit
    message is not relied on as written.
- id: RTN-040-3
  title: 'STAT-KS1-E1 runs hot against the archived threshold at bits 16.'
  finding: >-
    STAT-KS1-E1 is blind to every plant (RTB-040-2), so ALL of DEP-CAL-A, DEP-CAL-C,
    DEP-CAL-D and DEP-CAL-E supply effectively null-versus-null comparisons of it. At
    bits 16 that is 3 + 5 + 3 + 0 = 11 exceedances in 200 + 200 + 20 + 20 = 440
    comparisons against an expectation of 4.38 at p = 2/201; recomputed exact tail
    P(X >= 11) = 0.0052. At bits 20 it is 1 of 440. No D-0 leg fires - every
    individual count is inside [0, 8] - and the 190/200 bar makes a spurious
    certification from a 2.5 percent false-positive rate impossible. Recorded as an
    observation the measurement arm should carry, not as a blocking defect.

