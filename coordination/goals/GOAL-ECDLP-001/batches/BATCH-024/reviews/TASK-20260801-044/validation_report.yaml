    - check: cancellation snapshot changes exactly its two declared paths
      result: passed
      evidence: >-
        git diff-tree for
        9dbbeaf74e56f23c8a3b0f0055aa2ebb99e45c48 lists only
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/tasks/TASK-20260801-042/execution_report.yaml
