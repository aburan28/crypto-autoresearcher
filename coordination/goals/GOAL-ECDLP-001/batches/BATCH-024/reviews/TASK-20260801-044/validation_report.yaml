        Both equal dispatch_queue.json archive.path_sha256 for
        TASK-20260801-043. No later commit changed either file.
    - check: cancellation report records zero execution
      result: passed
      evidence: >-
        The committed TASK-20260801-042 report records terminal_status
        cancelled_pre_execution, cancellation_reason
        authorization_gate_revise, driver_invoked false, measurement_started
        false, attempts 0, no completed, invalid, or failed runs, and only the
        cancelled run id RUN-DEP-001-measure.
    - check: measurement run and result directories are absent
      result: passed
      evidence: >-
        Both filesystem existence checks and git ls-tree at the TASK-20260801-043
        snapshot and at HEAD returned no
        experiments/EXP-DEP-001/runs/RUN-DEP-001-measure directory and no
        experiments/EXP-DEP-001/results/measure directory.
    - check: every originally declared measurement deliverable is absent
      result: passed
      evidence: >-
        All twelve run/result deliverables named by the frozen TASK-20260801-042
        handoff are absent: manifest.yaml, raw-result.json, command.txt,
        environment.json, stdout.log, stderr.log, git_status_prerun.txt,
        DEP_report.json, dependence_power_curve.json,
        detection_floor_certificate.json,
        maximal_deviation_certificate.json, and
        duplicate_decomposition.json. Only the cancellation execution report
        exists, as narrowed by QUEUE-AMEND-20260801-004.
    - check: no experiment artifact changed after the REVISE gate
      result: passed
      evidence: >-
        git diff --name-status 80aaf9c6d..HEAD --
        experiments/EXP-DEP-001 returned no paths. Repository evidence is
        therefore consistent with the archived statement that the measurement
        driver was not invoked and no measurement output was written.
