  verdict: NOT_APPLICABLE_NO_MEASUREMENT
  limitations:
    - >-
      Repository artifacts cannot forensically prove that a process was never
      invoked if it produced no writes. The committed gate, zero-attempt
      execution report, absent run/result trees, absence of every declared
      measurement deliverable, and zero EXP-DEP-001 diffs after the gate are
      mutually consistent evidence of non-invocation; no contrary repository
      evidence was found.
    - >-
      snapshot_commit_receipt.json carries commit_sha null internally. The
      immutable binding to commit 9dbbeaf74e56f23c8a3b0f0055aa2ebb99e45c48,
      its parent, exact path set, and both path hashes is recorded in the
      later Coordinator control-plane dispatch_queue.json and independently
      verified above.
    - >-
      QUEUE-AMEND-20260801-004 says TASK-20260801-044 was cancelled before
      dispatch, while the current dispatch queue marks it queued. This report
      follows the Coordinator's explicit independent-validation handoff and
      validates only the committed non-execution snapshot; it does not restore
      or imply a measurement review.
  mathematical_interpretation: none
  claim_boundary: >-
    No observation exists about H-DEP-001, H-EQD-001, HEUR-DS-1,
