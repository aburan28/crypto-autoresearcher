        coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/archives/TASK-20260801-043/snapshot_commit_receipt.json.
        This equals declared_commit_sets.TASK-20260801-043_snapshot.
    - check: cancellation snapshot parent and reachability
      result: passed
      evidence: >-
        git rev-parse 9dbbeaf74^ returned
        558208d09d197014fe5c8600dc81b8c2f5c4cae2, equal to the queue-bound
        parent_sha, and git merge-base --is-ancestor 9dbbeaf74 HEAD exited 0.
    - check: cancellation snapshot path hashes
      result: passed
      evidence: >-
        SHA-256 of execution_report.yaml at the snapshot and current HEAD is
        33a36bd9a03e0e587403158f37873171e589e1528264d25ba536c7e4c66d95a6.
        SHA-256 of snapshot_commit_receipt.json at the snapshot and current
