      no arm was computed and no result file was emitted in any of the three.
  - control: 'Null-object control before belief (inventor-protocol section 3)'
    status: pass_with_a_stated_limit
    detail: >-
      The identity null objects of the same shape are present and measured at usable size -
      DEP-CAL-A is 200 fresh null-versus-null pairs per cell against the archived thresholds
      (0-3 exceedances of 200), and DEP-CAL-E is 20 independent-stream identity comparisons per
      cell. The decay direction is stated and measured at its two endpoints - as the plant
      parameter goes to the dependence-destroying end (rho = 0) the induced Spearman collapses
      to order 1e-4 and the joint TV falls to the sampling-noise floor, while at the comonotone
      end Spearman is 1.000000 and TV is about 0.92. THE LIMIT - the intermediate decay curve
      (CTRL-DEP-MONO) is a two-point endpoint check here, not a monotone ladder, because no
      ladder rung was run. The executor states this plainly and does not claim otherwise.
  - control: 'Stream disjointness from the archived EXP-EQD-001 streams'
    status: pass_with_a_defect_in_the_declared_set
    detail: >-
      The 14 DEP stream seeds are 62317/62321, 72317/72321, 82317/82321, 92317/92321,
      112317/112321, 122317/122321, 132317/132321. The driver checks them against a hard-coded
      archived offset set (10000, 20000, 30000, 40000, 50000), i.e. 10 seeds. THAT DECLARED SET
      IS INCOMPLETE - the archived EXP-EQD-001 real-arm results also record streams
      real_arm_plant_pc1 at seeds 52417 and 52421, which the declared offsets do not generate.
      I therefore re-ran the disjointness check myself against the FULL set of 12 stream seeds
      actually observed in the archived EXP-EQD-001 artifacts. THERE IS STILL NO COLLISION, so
      the conclusion stands; only the driver's own coverage of it is short by two seeds. Note
      also that the stream NAME enters the per-draw seed derivation, so a numeric seed collision
      alone would not have produced identical draws.

