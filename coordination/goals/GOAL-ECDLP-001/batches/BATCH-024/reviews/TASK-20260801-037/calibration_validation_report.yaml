  declared_items_assessed:
  - item: 'DIAG-DEP-DUP deliberately NOT produced'
    assessment: >-
      CONFIRMED AND CORRECT. I verified from the artifacts, not the prose, that no duplicate
      decomposition exists anywhere in the package - no dup_colliding_pairs_total, no
      dup_translate_explained, no dup_residual, no dup_orbit_decomposition, no
      duplicate_decomposition.json, and duplicate_decomposition_emitted false. I also confirmed
      the code IS authored in full with the contract's exact field names and is reachable only
      from measure mode. The frozen contract's forbidden_in_the_calibration_stage clause names
      "no DIAG-DEP-DUP output" explicitly and declares OBJ-REAL measurement-stage-only, so
      producing it during calibration would have enumerated the deterministic factor base and
      tripped ATS-DEP-1.3. Following the frozen contract over a relayed instruction was the
      right call and it is disclosed as DEV-035-1 with its consequence stated - the
      KN-CAND-BATCH023-A promotion trigger is NOT discharged by this run.
  - item: 'Undeclared stream for the second fresh-comparison null arm (DEV-035-2)'
    assessment: >-
      ACCEPTABLE AND VERIFIED. The contract names a stream for a plant's source null but none
      for the fresh comparison arm. The executor used source_null_for_plants at the next unused
      draw index rather than inventing a stream. I confirmed from the code and from the recorded
      stream-consumption count that DEP-CAL-C consumes indices 0-399 and DEP-CAL-D indices
      400-439, for exactly 440 draws, with NO index reused and every arm individually
      addressable - which is how I was able to rebuild specific arms at all. Measure mode starts
      the same stream at index 1000000, so it cannot re-consume a calibration index. This is the
      least-invention resolution and it is disclosed rather than silent.
  - item: 'DET-DEP-1 rationale quoting about 0.9145'
    assessment: >-
      THE EXACT VALUE 0.9166648489336275 IS RIGHT AND THE CONTRACT'S 0.9145 IS WRONG. Verified
      three independent ways (see metric_recomputations). Impact is nil for attainability
      because both clear the 0.90 floor, but a threshold rationale carrying a wrong constant
      does propagate - see defects D2 below for the concrete instruction this implies for
      TASK-20260801-038.

  defects:
  - id: D1
    severity: minor
    blocking: false
    title: 'Driver''s archived-EQD stream set is short by two seeds'
    detail: >-
      ARCHIVED_EQD_STREAM_OFFSETS omits the real-arm plant stream (archived seeds 52417 and
      52421). The disjointness assertion recorded in the run is therefore checked against 10 of
      the 12 archived seeds. I verified the full 12 myself and found no collision, so no
      conclusion changes. Recommendation - TASK-20260801-042 should not treat the driver's own
      disjointness boolean as exhaustive, and any successor driver should widen the set.
  - id: D2
    severity: minor
    blocking: false
    title: 'Frozen contract carries an incorrect Clopper-Pearson constant'
    detail: >-
      specification.yaml DET-DEP-1 why_the_second_clause states about 0.9145 for the one-sided
      lower bound at 190 of 200; the exact value is 0.9166648489336275. The run recorded the
      exact value beside the prose figure and adjusted neither, which is correct. THE CONCRETE
      RISK IS PROPAGATION - TASK-20260801-038 must not copy 0.9145 into RR-DEP-1 or into any
      rationale. The DET-DEP-1 BAR ITSELF (rate >= 0.95 and one-sided lower >= 0.90) is
      unaffected and must not be moved on account of this; the wrong number is in the prose
      justification only. Correcting it belongs in a superseding record, never an in-place edit.
  - id: D3
    severity: informational
    blocking: false
    title: 'Tripwire coverage claim is very slightly overstated'
    detail: >-
      The docstring says dep_deterministic_factor_base() is the only function that reaches the
      frozen deterministic factor base. Two other functions also read curve data that overlaps
      it - _selfcheck_translate() reads cell.X_E[:32] and two_torsion_x_coordinates() scans the
      whole field. Both are measure-only and both are reachable only downstream of the call that
      has already flipped the tripwire, so the guarantee holds operationally. Recorded so the
      claim is not carried forward more strongly than it is true.
  - id: D4
    severity: minor
    blocking: false
    title: 'Approval gate trusts an unbound JSON file'
    detail: >-
      The measure-mode gate reads APPROVAL_DETERMINATION from whatever path --approval-receipt
      names, with no binding to a committed coordinator receipt, commit hash or signature. I
      demonstrated the refusal paths work, and the driver does record the receipt path and its
      sha256 in the payload, so misuse is auditable after the fact. But the gate is a discipline
      aid, not a cryptographic control. Recommendation for TASK-20260801-042 and -044 - verify
      independently that the receipt supplied is the actual committed TASK-20260801-041 receipt
      blob. This has no bearing on the calibration package's admissibility.
  - id: D5
    severity: caution_for_the_freeze
    blocking: false
    title: 'DEP-CAL-C is not an identity null and must not be read as a false-positive rate'
    detail: >-
      OBJ-PLANT-DEP-0 applies the plant machinery at rho = 0, which DESTROYS whatever dependence
      the fibre map induces rather than reproducing the source law. Its exceedance rates - 5/200
      for STAT-KS1-E1 at bits 16 and 6/200 for STAT-CHI-64 at bits 20, i.e. 2.5 and 3.0 percent
      - are consequently NOT the instrument's false-positive rate and are higher than the
      genuine identity nulls, which are DEP-CAL-A at 0-3 of 200 and DEP-CAL-E at 0-1 of 20. The
      driver's own note says exactly this, so nothing is misreported. I flag it because a reading
      rule frozen at TASK-20260801-038 that used a DEP-CAL-C rate as a null calibration would be
      wrong in a way nothing downstream would catch.
  - id: D6
    severity: informational
    blocking: false
    title: 'Anchor Spearman printed as exact 1.0 in the execution report'
    detail: >-
      The execution report's DIAG-DEP-RHO block gives the anchor plant Spearman as
      "mean 1.0, min 1.0, max 1.0". The exact archived values are 0.9999999990401287 to
      0.9999999999691521 - 1.000000 at six decimals, which is what the snapshot receipt says
      and is accurate, but the execution report's rendering drops the rounding marker. Full
      precision is archived and no frozen quantity reads it.
  defects_that_would_make_a_frozen_threshold_unsound: none_found
  defects_summary: >-
    Six items, none blocking. None of them touches a number TASK-20260801-038 will consume - the
    eight DEP-CAL-A order statistics and the eight DEP-CAL-B archived thresholds all reproduce
    exactly, twice, once from the archived arrays with my own code and once from a complete
    from-scratch re-run of the recorded command. D2 and D5 are instructions for the freeze, not
    faults in the measured numbers.

  heuristic_validation_checks:
  - check: 'Pre-registered prediction'
    status: not_applicable_with_reason
    detail: >-
      This run validates no heuristic in the exemplar sense - there is no theoretical
      distribution predicted in advance and compared against samples (no Dickman rho, no
      smoothness law, no CDF). It calibrates an instrument. What IS pre-registered, and what I
      did verify is pre-registered, is the entire decision apparatus - the statistic family, the
      threshold rule, the ladders, the cuts, the DET-DEP-1 bar, the THR-DEP-REPRO band and the
      branch structure are all hash-bound in specification.yaml at commit 36141a95, which is an
      ancestor of the snapshot, with no run artifact in the tree at that commit. So the
      calibration can supply numbers and cannot supply choices.
  - check: 'Sample integrity'
    status: pass
    detail: >-
      Sample sizes (M_PAIRS 200, R_REPS 200, R_ANCHOR_REPS 20, IDENT_REPS 20, n 130816 per arm),
      all 14 stream seeds and the sampling procedure are in the manifest, and every replicate is
      individually addressable - which I proved by regenerating specific arms from their indices.
      All summary statistics were recomputed from the raw per-replicate arrays, never copied.
  - check: 'Correspondence validity'
    status: not_applicable_with_reason
    detail: >-
      No correspondence substitutes for direct sampling here. The objects are enumerated
      directly from drawn factor bases through the INT-2 map, and CTRL-DEP-S3 independently
      verifies that map by actual point arithmetic on a uniform random sample.
  - check: 'Scale binding'
    status: pass_recorded_as_a_limitation
    detail: >-
      Two toy cells only - p = 46663 (16 bits) and p = 767551 (20 bits), Bfb = 512. claim_tier
      toy in the manifest, the raw result and the execution report; tools/validate_ledger.py
      tier_of_run returns toy. Nothing in the package is presented as crypto-scale, and no
      extrapolation to cryptographic parameters appears anywhere. Recorded as a limitation
      under AGENTS rule 7.
  cost_model_checks:
  - check: 'Concrete cost table'
    status: not_applicable_with_reason
    detail: >-
      The run publishes no cost table, no cost unit, no per-attempt cost and no success
      probability, and the contract explicitly forbids a timing decision variable - wall_seconds
      is recorded for budget accounting only. I confirmed there is no charged unit, no cost
      identity and no R anywhere in the package. There is therefore no cost-unit, memory-beside-
      time or per-attempt-cost-times-inverse-success-probability claim to audit. Peak RSS is
      recorded beside wall time as resource accounting.
  inventor_protocol_ladder_checks:
  - check: 'Claimed improvement executed at scale'
    status: not_applicable_with_reason
    detail: >-
      NO IMPROVEMENT AND NO SPEEDUP IS CLAIMED BY THIS RUN, so the section 6 ladder does not
      bind it. For completeness - step 1 (isolate each assumption and measure it separately) is
      partly discharged here, in that the assumption the power certificate rests on ("the plant
      moves the joint table") is isolated as DIAG-DEP-RHO and measured, with the named failure
      mode DESIGN-TRAP-1 stated. Step 4 (exercise the reproducibility pointer) is discharged by
      my from-scratch rebuild. Step 2 does not arise because there is no ratio against a
      baseline to measure.

  limitations:
  - 'Procedural independence only. This harness resolves author and reviewer to the same model; correlated blind spots are not excluded. Every load-bearing number here was recomputed or re-derived externally rather than reasoned about, which is the mitigation available.'
  - 'I reconstructed 8 of the 440 planted arms from seeds. The other 432 rest on the producer''s recorded digests, which are internally consistent and which my full re-run reproduced byte for byte, plus the construction-level argument that e_1 is never touched and e_2 is only permuted.'
  - 'Toy tier. 16-bit and 20-bit fields, Bfb = 512, two curve instances. Nothing here is scale-matched to anything cryptographic.'
  - 'The calibration is expressly NON-EVIDENTIAL about H-DEP-001, H-EQD-001, HEUR-DS-1 and H-SMTH-001 in either direction, and this report changes that not at all.'
  - 'CTRL-DEP-MONO is NOT evaluated. No ladder rung of any family was run, so whether each family moves the joint law at each intermediate rung is unestablished; DIAG-DEP-RHO here is a two-endpoint check.'
  - 'DIAG-DEP-DUP is absent by contract, so the KN-CAND-BATCH023-A promotion trigger is not discharged by this run.'
  - 'I did not attempt to falsify the EXP-EQD-001 arrays themselves beyond hashing them and recomputing their order statistics; the BATCH-023 measurements are taken as archived inputs.'
  - 'I did not re-derive harness.toycurve; the curve instances are shared ground truth between producer and validator. I did check the recorded p, a and b against my own instantiation and against CTRL-DEP-S3 point arithmetic.'
