    exit_code: 0
    wall_seconds: 117.5
    result: >-
      FULL BIT-FOR-BIT REPRODUCTION. All three result artifacts are byte-identical to the
      archived ones - null_replicate_statistics.json 717031c6209e05a9c5a5998a24ed255cf74d7c2bbe
      a756d7372a32af853beaa4, marginal_integrity_report.json 9783dae9728b308f287d945a617e413900
