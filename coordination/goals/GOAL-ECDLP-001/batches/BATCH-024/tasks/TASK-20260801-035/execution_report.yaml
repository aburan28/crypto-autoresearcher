  protocol_deviations:
  - id: DEV-035-1
    kind: instruction_versus_frozen_contract
    resolved_in_favour_of: the frozen contract
    text: >-
      The relayed task instruction asked this task to produce the DIAG-DEP-DUP decomposition with
      dup_translate_explained and dup_residual. The frozen contract forbids it in the calibration
      stage - forbidden_in_the_calibration_stage names DIAG-DEP-DUP output explicitly, OBJ-REAL
      is declared MEASUREMENT STAGE ONLY, and the frozen handoff says emit NO duplicate
      decomposition - and producing it would have enumerated the deterministic factor base and
      tripped ATS-DEP-1.3, firing branch D-0. The diagnostic is therefore IMPLEMENTED IN FULL in
      the driver with exactly the contract's field names and NOT EXECUTED. Consequence stated
      plainly - the KN-CAND-BATCH023-A promotion trigger is NOT discharged by this run and no
      deliverable may claim it is; it is discharged, if at all, by TASK-20260801-042.
  - id: DEV-035-2
    kind: unspecified_detail_resolved_by_the_least_invention
    text: >-
      The contract names a stream for the source null of a plant but none for the second, fresh
      comparison null arm that each planted arm is tested against. DEP-CAL-C and DEP-CAL-D draw
      that comparison arm from the source_null_for_plants stream at the next unused draw index,
      so no draw index is reused, every arm stays individually addressable from its recorded
      seed, and no new stream is invented. The measurement entry point draws from that stream
      starting at index 1000000 so it can never re-consume a calibration index.

  anomalies:
  - id: ANOM-035-1
    kind: contract_prose_figure_versus_exact_value
    text: >-
      The DET-DEP-1 rationale quotes about 0.9145 as the one-sided 95 percent lower
      Clopper-Pearson bound at 190 of 200. The exact one-sided lower bound is 0.9166648489336275
      and the exact TWO-SIDED lower bound at the same count is 0.9099724622986483. Both exceed
      the DET-DEP-1 floor of 0.90, so the bar remains attainable and non-vacuous under either
      reading, and no frozen quantity depends on which the prose meant. Recorded, not corrected,
      and nothing was adjusted. The implementation's bounds were verified by substituting them
      back into their defining binomial tail equations, residuals below 1e-15.
  - id: ANOM-035-2
    kind: recorded_observation_no_explanation_claimed
    text: >-
      DEP-CAL-E at bits 20 shows one of 20 fresh-null-versus-fresh-null comparisons exceeding the
      archived STAT-KS1-E2 threshold. It is recorded here because it must be, not explained.
      STAT-KS1-E2 is a DIAGNOSTIC under CERT-DEP-1 and certifies nothing, and DEP-CAL-E's own
      contract text says NON-REJECTION IS NOT CORROBORATION - the symmetric caution applies to
      reading a single exceedance. No branch is evaluated by this task.
  - id: ANOM-035-3
    kind: scratch_development_testing_disclosed
    text: >-
      Unit tests of the three plant functions were run on synthetic uniform random arrays with no
      curve, no factor base, no OBJ-NULL-RFB arm and no comparison against any threshold, in a
      scratch directory outside the repository, to verify marginal preservation and that the
      joint table moves. The two measurement-gate refusal paths were exercised the same way. None
      is archived in any run package; all are disclosed here.
  - id: ANOM-035-4
    kind: infrastructure_note
    text: >-
      No timeout, crash, resource exhaustion or budget cancellation occurred. Wall clock 165.8 s
      against an 1800 s budget; peak RSS 212189184 bytes against a 4 GiB budget.

