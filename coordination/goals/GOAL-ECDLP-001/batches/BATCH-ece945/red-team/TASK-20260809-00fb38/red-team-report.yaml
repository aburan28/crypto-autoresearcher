  predecessor_blocker_adjudication:
    - blocker: B1-incomplete-physical-class-ownership-and-allocation
      adjudication: REVISE
      passed_checks:
        - Twenty-eight unique IDs, artifact owners, and probe owners are frozen.
        - Every class has five positive populations and prefixes summing to its declared total.
        - Explicit shard IDs replace shard counts.
      blocking_evidence: >-
        Ownership is unique as a string but is not an evaluable allocation into
        candidate setup, one fresh root attempt, null/control apparatus,
        analysis, rho, and BSGS. Rows named treatment_and_control_group_additions,
        treatment_and_control_transforms, signed_y_and_null_labels, serialization,
        SHAKE_fixed_blocks, and candidate_writes_and_reads deliberately combine
        several consumers. No frozen incidence matrix or per-axis compiler
        equation separates them. Two compilers can preserve every n_c(b),
        owner, cap, and stage while charging different shares to the candidate.
      required_repair: >-
        Freeze a class-by-size-by-consumer allocation table whose columns sum
        back to each n_c(b), and literal equations for every candidate and
        baseline axis. Reject any consumer or residual not mapped exactly once.

    - blocker: B6-unreachable-and-incomplete-confidence-kat
      adjudication: PASS_STATIC
      evidence: >-
        The repeated 0011 root vector is reachable and gives exact m=1/2. Eta
        -4, 0, and 4, both clips, the L=0 infinity rule, and rejection of the
        predecessor's impossible narrow interval all recompute. This validates
        only constructor arithmetic, not HA-4 or any positive gamma.

    - blocker: B7-noncanonical-byte-framing-and-seed-absorption
      adjudication: REVISE
      passed_checks:
        - The sixteen tags and twenty-four positional schemas are unambiguous.
        - Every literal frame has the declared first-field seed class and replays exactly.
        - The target-envelope ChaCha20-Poly1305 ciphertext, tag, and digest replay.
      blocking_evidence: >-
        Literal KAT bytes do not fully bind production seed custody. The
        successor envelope frame contains no key identifier, and the successor
        never explicitly states the production commitment function, the AAD
        derivation, or the exact custody/retention receipt schemas and paths.
        The predecessor stated SHA256(seed) and AAD=SHA256(ordered public
        manifest), but the successor changes the envelope from SYC3 to SYC4 and
        does not bind an exact public-manifest byte vector to its KAT AAD.
        A KAT can replay while two production implementations bind different
        manifests or external-key lookups.
      required_repair: >-
        Bind the inherited commitment and AAD rules explicitly to exact manifest
        bytes, include or immutably bind the external key identifier, and freeze
        custody, independent-replay, retention-close receipt paths and schemas.

    - blocker: B9-null-bytes-and-shape-not-frozen
      adjudication: REVISE
      passed_checks:
        - The abstract orbit rule preserves duplicate identity, negation antisymmetry, and infinity zero within one declared context.
        - The literal byte stream and three mutation intentions are fixed.
      blocking_evidence: >-
        The literal orbit is outside the frozen point language: bits=18 implies
        a 19-bit p and four-byte affine encodings, but the KAT uses two-byte
        0201 and 0301 encodings. In addition, the null key includes root_index,
        so the same canonical point can receive different null labels across
        roots even though the signed-y treatment label is a point-derived
        function. The contract justifies equality only "in one context" and
        does not prove that changing cross-root duplicate correlations is
        irrelevant to the root-level statistic.
      required_repair: >-
        Freeze an admitted curve and a canonically encoded on-curve R,-R,
        duplicate-R,infinity stream at one declared size, with exact p,a,b and
        decoding checks. Either remove root_index from the orbit key or add a
        separate cross-root duplicate fiber control and justify the retained
        root-specific randomization.

    - blocker: B10-no-fully-charged-per-size-hardware-time-rho-comparison
      adjudication: REVISE
      passed_checks:
        - Aggregate CPU and wall are separate and CPU is never divided by shards.
        - Nine directed physical axes, five per-size populations, and strict Pareto-style comparisons are named.
        - The shard-division mutation is correctly classified incomparable.
      blocking_evidence: >-
        The contract supplies field names but no exact per-axis formula from
        the twenty-eight classes to candidate setup, one root, restart bounds,
        and total output. The old scalar G+H*C*W formula cannot be silently
        inherited because scalar collapse is now forbidden. The rho walk also
        leaves distinguished-point table retention/tie handling, inter-shard
        collision ordering, and cycle detection selectable. The only current
        BSGS row is a prose class inherited from EXP-SYC-24f469; neither record
        freezes a byte-exact baby table, giant-step order, collision policy, or
        directed output. At 18--30 bits a prospective finite improvement must
        beat or be Pareto-compared with the rho/BSGS frontier, not only the
        mandated SHA256-partition rho implementation.
      required_repair: >-
        Freeze literal candidate assembly equations and the class allocation
        matrix, deterministic rho table/cycle/inter-shard rules, and a complete
        matched BSGS protocol. Require the positive branch to dominate the
        nondominated finite baseline frontier under the same nine axes.

    - blocker: B12-nonexhaustive-public-verifier-isolation
      adjudication: REVISE
      passed_checks:
        - Future entrypoints, forbidden dynamic Python features, path and environment allowlists, descriptor rules, and deny-all IPC/network intent are explicit.
        - Exact source, dependency, and policy hashes correctly remain null because no implementation exists.
      blocking_evidence: >-
        The coverage cardinality and cost class contradict each other by
        exactly two full mount states: 47185920 candidate verifications are
        required and only 15728640 are charged. The proposed implementation-only
        lifecycle repair then promises a finite synthetic fixture, while the
        success criterion requires the ordered actual candidate stream; those
        quantifiers are not interchangeable. Actual candidate bytes do not
        exist until the apparatus runs. Finally, byte-identical physical
        resource counters across three separate replays are not implied by
        secret independence because scheduling, caching, frequency, and energy
        counters can vary on identical secretless inputs. That rule can reject
        a correct implementation and does not isolate leakage.
      required_repair: >-
        Split static implementation attestation from post-generation actual-
        stream counterfactual replay. Charge all three streams, define empty
        capacity slots, and require exact identity only for candidate bytes,
        V, S, transcripts, logical operation counts, exit status, and public
        file hashes. Retain and charge physical counters but assess them under
        a predeclared measurement-equivalence rule rather than byte equality.

  baseline_comparison:
    pollard_rho: N^(1/2+o(1)) with negligible live-storage exponent
    standard_BSGS_processor_steps: N^(1/2+o(1))
    standard_BSGS_full_cost: N^(2/3+o(1)) under KN-TECH-035's cited three-dimensional wiring model
    candidate_raw_conditional: N^(2/3-gamma+o(1))
    candidate_live_storage_conditional: N^(1/3+o(1))
    candidate_wiring_multiplier_conditional: N^(1/9+o(1))
    candidate_full_conditional: N^(7/9-gamma+o(1))
    symbolic_crossovers:
      raw_vs_pollard_rho: '2/3-gamma<1/2 iff gamma>1/6: PASS_SYMBOLIC'
      full_vs_standard_BSGS: '7/9-gamma<2/3 iff gamma>1/9: PASS_SYMBOLIC'
      full_vs_pollard_rho: '7/9-gamma<1/2 iff gamma>5/18: PASS_SYMBOLIC'
    finite_cost_adjudication: >-
      No finite cost exists. The successor defines nine comparison axes but
      neither compiles candidate totals uniquely nor binds the complete finite
      baseline frontier. Pollard rho remains the governing asymptotic
      single-target baseline; BSGS remains a required finite control.

  objections:
    - id: RT-NULL-KAT-NONCANONICAL-POINT-WIDTH
      severity: blocking
      category: constructor_and_null_shape
      finding: >-
        bits=18 with a frozen 19-bit p requires four-byte affine encodings, so
        two-byte 0201 and 0301 cannot reach the canonical point decoder.
    - id: RT-NONINTERFERENCE-TWO-MOUNT-COST-OMISSION
      severity: blocking
      category: exhaustive_coverage_and_cost
      finding: >-
        The contract requires 47185920 candidate verifications but charges
        15728640; exactly 31457280 candidate verifications are absent.
    - id: RT-CLASS-TO-CANDIDATE-COMPILER-NONIDENTIFYING
      severity: blocking
      category: full_cost
      finding: >-
        Unique row owners do not define the consumer allocation or per-axis
        G/H/root/wiring assembly needed to compute candidate bounds.
    - id: RT-RHO-AND-BSGS-FRONTIER-INCOMPLETE
      severity: blocking
      category: baseline_reproduction
      finding: >-
        Rho table/cycle behavior remains selectable, BSGS remains a prose row,
        and the positive gate tests only rho rather than the finite frontier.
    - id: RT-PRODUCTION-SEED-ENVELOPE-BINDING-INCOMPLETE
      severity: blocking
      category: seed_custody
      finding: >-
        The primitive KAT replays but production commitment, AAD, key-id, and
        receipt bindings are not completely frozen in the successor.
    - id: RT-SYNTHETIC-COVERAGE-NOT-ACTUAL-STREAM-COVERAGE
      severity: blocking
      category: quantifier_order
      finding: >-
        A pre-run synthetic fixture cannot be reported as exhaustive coverage
        of actual outcome-dependent candidate bytes without a separate gate.
    - id: RT-PHYSICAL-COUNTER-BYTE-IDENTITY-FALSE-POSITIVE
      severity: blocking
      category: noninterference
      finding: >-
        Exact equality of noisy physical counters is neither necessary for
        noninterference nor stable under identical secretless replay.

  required_controls:
    - id: CTRL-NONINTERFERENCE-VERIFICATION-COUNT-COLLISION
      cost: one_static_integer_identity_zero_experiment_runs
      purpose: >-
        Assert scalar_witness_verification.n_c-6 equals
        candidate_slots_per_mount_state times mount-state count. The frozen
        values give 15728640 versus 47185920 and must reject the compiler.
    - id: CTRL-NULL-CANONICAL-DECODE-ROUNDTRIP
      cost: one_fixed_admitted_curve_and_four_point_records_zero_treatment_runs
      purpose: >-
        Decode and re-encode the literal R,-R,duplicate-R,infinity stream under
        its declared bits and p before hashing labels. The current 0201 vector
        must reject on canonical length.
    - id: CTRL-CLASS-CONSUMER-ALLOCATION-COLLISION
      cost: symbolic_only_zero_experiment_runs
      purpose: >-
        Hold every class total and owner fixed while one compiler charges all
        treatment-and-control work to C_root and another charges only the
        treatment share. A frozen incidence matrix must distinguish them.
    - id: CTRL-ACTUAL-VERSUS-SYNTHETIC-CANDIDATE-BRANCH
      cost: one_adversarial_candidate_record_no_curve_generation
      purpose: >-
        Add a candidate byte pattern that takes a branch absent from the
        synthetic fixture. Require the static dependency/sandbox proof or the
        actual-stream replay to catch it; fixture cardinality alone must not be
        called exhaustive.
    - id: CTRL-RHO-TABLE-AND-BSGS-FRONTIER-FIXTURE
      cost: smallest_frozen_group_with_fully_enumerable_state_space
      purpose: >-
        Run byte-exact rho and BSGS protocols on the same tiny group, enumerate
        all table/collision outcomes, and verify the reported nondominated
        baseline row before any toy finite comparison.

  counterexample_or_mutation:
    cheapest_falsification: CTRL-NONINTERFERENCE-VERIFICATION-COUNT-COLLISION
    cost: one_static_integer_identity_zero_experiment_runs
    construction: >-
      Read candidate_slots_per_mount_state=15728640 and the three declared mount
      states from the specification. Exhaustive replay therefore requires
      3*15728640=47185920 candidate verifications. Remove the six preserved KATs
      from scalar_witness_verification.n_c=15728646; only 15728640 candidate
      verifications are charged. The residual is 31457280, exactly two complete
      mount states. No timing assumption, implementation choice, or experiment
      is needed.
    conclusion: >-
      The twenty-eight-class compiler has a nonzero primitive, byte, counter,
      and output residual despite declaring residual_count=0. The omitted work
      can change caps and budgets, so the populated-hash circularity is not the
      sole blocker.
    secondary_constructor_counterexample: >-
      Parse the same-path-null KAT. Its bits field is 18 and its POINT payload
      is 0201. The frozen generator makes p 19 bits, and the inherited point
      format is 02-or-03 followed by a three-byte x. The payload is therefore
      two bytes short and cannot be a canonical admitted point.

  heuristic_challenges:
    - id: HA-4-independent-restarts
      result: PASS_STATIC_OPERATIONAL_SEMANTICS_ONLY
      detail: >-
        The design still specifies one fresh root and one uniform operational
        model per attempt. No run validates independence or a positive gamma.
    - id: HA-5-family-and-model-scaling
      result: REVISE_NULL_AND_PRODUCTION_CUSTODY_BYTES
      detail: >-
        The ordinary tuple registry is exact, but one null vector is outside
        the admitted point language and production envelope bindings remain
        incomplete. The finite-family ceiling is otherwise honest.
    - id: HA-6-wiring-access-charge
      result: REVISE_COST_ASSEMBLY_AND_BASELINE_FRONTIER
      detail: >-
        Aggregate CPU is no longer divided by shards, but no exact multi-axis
        class-to-candidate compiler exists and two coverage states are omitted.
    - id: HA-7-finite-size-family-model
      result: PASS_CEILING_ONLY
      detail: >-
        Eta and sizes are frozen. Any future result remains limited to the
        exact finite toy manifest and cannot identify an asymptotic exponent.

  cost_model_challenges:
    - The all-slot three-mount verifier population is undercharged by exactly 31457280 candidate verifications.
    - The omitted verifier work also lacks corresponding scalar-multiplication, I/O, physical-counter, archive, communication, and output allocation.
    - Unique artifact and probe owner strings do not define a class-to-consumer incidence matrix.
    - No per-axis equation replaces the predecessor's now-forbidden scalar G+H*C*W collapse.
    - Prefix projection is declared as a directed bound without a frozen justification that a short prefix bounds a full workload under caching and scheduling changes.
    - Rho distinguished-point retention, collision tie handling, inter-shard ordering, and cycle detection remain selectable.
    - The finite positive gate omits the BSGS row from the nondominated baseline comparison.
    - Physical resource counter equality is incorrectly reused as a noninterference identity instead of being separately charged and statistically assessed.

  reduction_and_scope_challenges:
    - >-
      No implementation, curve, measurement, gamma, scalar recovery, or cost
      comparison exists. Nothing in the snapshot supports an attack, solver,
      speedup, security impact, novelty, breakthrough, unseen-family transfer,
      asymptotic exponent, or cryptographic-scale claim.
    - >-
      Passing literal SHAKE vectors proves byte replay for those literals only;
      it does not make a noncanonical point constructor-reachable or bind all
      production custody records.
    - >-
      Passing aggregate arithmetic before omitted all-stream work does not prove
      the unchanged caps would survive the repaired population.
    - >-
      A valid future toy comparison must cite the exact rho and BSGS artifacts
      and preserve the finite claim ceiling even if one baseline is dominated.

  proof_architecture_challenges:
    baseline_reproduction: >-
      The symbolic 1/6, 1/9, and 5/18 boundaries reproduce. The concrete
      boundary does not: candidate assembly is non-identifying, rho table and
      cycle behavior are selectable, and BSGS is not a frozen protocol or part
      of the positive gate.
    observation_collision: >-
      The producer closes the old shard-division collision but admits a cheaper
      cardinality collision: one charged mount stream and three required mount
      streams share every declared aggregate cap except the omitted work. The
      null digest likewise has a byte-valid but decoder-invalid preimage.
    quantifier_order: >-
      Future executable hashes may legitimately depend on later implementation
      bytes, but an implementation-only synthetic fixture cannot quantify over
      actual candidate bytes that arise only after treatment. The contract must
      state separate pre-run and post-generation gates.
    method_ceiling: >-
      Even ideal later execution could address only the finite toy manifest.
      At present the stronger ceiling is a static partial design with no
      executable null KAT, exhaustive cost total, or reproducible baseline
      frontier.
    nearby_object: >-
      The abstract point-orbit null is closer than the predecessor position
      null because it preserves negation and within-context duplicates. Its KAT
      is unreachable, and root-index domain separation changes cross-root
