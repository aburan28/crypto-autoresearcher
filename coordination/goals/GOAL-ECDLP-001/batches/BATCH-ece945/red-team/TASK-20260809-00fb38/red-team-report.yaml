  claim_under_review: >-
    Whether immutable producer snapshot
    2ee0c160a81487ccc54470dda702e8e613e082d6 closes the six
    BATCH-3468a0 repair interfaces strongly enough that the only remaining
    defect is the declared pre-implementation executable-hash and actual-stream
    coverage circularity. The review attacks constructor reachability, exact
    tuple and seed bytes, the point-orbit null, twenty-eight-class ownership,
    separate fully charged physical axes, the matched Pollard-rho and BSGS
    frontier, and finite three-mount noninterference. It does not review an
    implementation, run, measurement, or ECDLP result because none exists.

  overall_rationale: >-
    REVISE. The immutable snapshot and queue archive binding are sound. All
    four producer YAML documents strictly parse without duplicate keys. The
    three interior confidence KATs are constructor-reachable, their eta-specific
    bounds recompute, the clipping and infinity branches are present, all
    twenty-four tuple frames and literal SHAKE256 vectors replay byte-for-byte,
    the ChaCha20-Poly1305 KAT opens, the twenty-eight class identifiers and
    owner strings are unique, every n_c(b) and q_c(b) vector sums to its total,
    the declared aggregate caps reconcile, and the 720/8/90 versus 500/5/100
    control correctly refuses to divide aggregate CPU occupancy by shards.
    The advertised sole lifecycle residual is nevertheless false. First, the
    literal null KAT sets bits=18 but encodes R as 0201: two bytes. The inherited
    canonical point encoder requires one prefix byte plus a fixed-width x; the
    frozen prime generator makes p exactly 19 bits at that row, so the only
    canonical affine length is four bytes. The KAT cannot reach the decoder it
    purports to test. Second, the all-slot noninterference contract requires
    15728640 public verifications in each of three mount states, or 47185920
    candidate verifications, while the scalar-witness class charges only
    15728640 candidate verifications plus six KATs. Exactly 31457280 required
    candidate verifications, together with their group operations, I/O,
    physical counters, and archive work, are absent. Third, the class rows do
    not define an exact class-to-setup/root/control/baseline allocation or a
    per-axis equation assembling G, H, root work, and wiring into candidate
    bounds; aggregate treatment-and-control classes admit different compliant
    cost compilers. Fourth, the successor still does not freeze a deterministic
    distinguished-point table/cycle policy, and its positive gate is only
    against rho even though the 18--30-bit finite frontier must also include a
    byte-exact BSGS implementation. Finally, an implementation-only synthetic
    fixture cannot be silently substituted for the required actual candidate
    stream, and byte-identical wall, CPU, energy, and other physical counters
    across separate mount-state replays is not a valid noninterference
    invariant. These are static design defects, not evidence against
    H-SYC-b854f4 or ECDLP. No implementation or execution is admissible.

