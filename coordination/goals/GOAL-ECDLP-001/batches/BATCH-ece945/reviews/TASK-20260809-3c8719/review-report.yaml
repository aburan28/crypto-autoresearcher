  six_blocker_adjudication:
    - id: B1-incomplete-physical-class-ownership-and-allocation
      status: REVISE
      passed_checks:
        - exactly twenty-eight unique class identifiers
        - exactly twenty-eight unique artifact owners and probe owners
        - each five-entry n_c vector sums to n_c
        - each five-entry q_c vector sums to q_c
        - every q_c by size is positive and no larger than n_c by size
        - target and decoy scalar work totals 2560 events with one explicit owner
        - every row names nonempty explicit shard IDs, primitive formula, byte formula, counter formula, and stage owner
      residual: >-
        A shard-ID set is not an event-to-shard assignment. No row freezes a
        deterministic mapping of the q_c(b) prefix or n_c(b) full population
        onto its listed shard IDs. The measured wall prefix and residual can
        therefore change with a compliant implementation's partition. Since
        wall is a decision axis, this remains a blocking allocation choice.
    - id: B6-unreachable-and-incomplete-confidence-kat
      status: PASS_STATIC
      passed_checks:
        - repeated 0011 root vectors emit exactly 512 successes of 1024 and m equal to one half
        - eta minus four, zero, and four delta and gamma enclosures recompute
        - the exact five-over-eighteen threshold lies inside all three reported intervals
        - all-zero roots emit lower clipping, L equal to zero, and positive infinity
        - all-one roots emit upper clipping and a finite reciprocal bound
        - the predecessor narrow interval is correctly rejected as constructor-unreachable
      residual: null
    - id: B7-noncanonical-byte-framing-and-seed-absorption
      status: REVISE
      passed_checks:
        - all sixteen one-byte tags and fixed payload widths are unique and parse
        - all twenty-four domain schemas are positional and seed-first
        - all twenty-four absorb hashes, SHAKE256 outputs, and output hashes recompute
        - target, decoy, restart, null, and public KAT seeds are pairwise distinct
        - the supplied target ChaCha20-Poly1305 ciphertext, tag, envelope, decrypt, commitment, and envelope digest recompute
      residual: >-
        The KAT supplies an AAD literal but neither the successor specification
        nor seed-custody section defines the production AAD derivation or binds
        public-manifest bytes from which it could be recomputed. The promised
        key identifier is also absent from the declared envelope frame, and no
        field schema binds the claimed two-custodian and retention-close
        receipts. Two implementations can therefore pass the literal KAT yet
        produce incompatible production envelopes and replay custody.
    - id: B9-null-bytes-and-shape-not-frozen
      status: PASS_STATIC
      passed_checks:
        - the representative of 0201 and 0301 is 0201
        - the bound SHAKE output begins with 6c and maps to positive
        - R and duplicate R both receive 01
        - minus R receives ff and infinity receives 00
        - the SYC4NULL replay bytes and SHA-256 digest recompute
        - all three declared mutations target duplicate, negation, or context-shape violations
      residual: null
    - id: B10-no-fully-charged-per-size-hardware-time-rho-comparison
      status: REVISE
      passed_checks:
        - candidate aggregate CPU 720 is worse than rho 500 while candidate wall 90 is better than rho 100
        - CPU is summed across shards and wall is kept as a distinct maximum-latency axis
        - 40960 rho-step and 163840 rho-start calls recompute from five sizes, 32 inputs, bounded attempts, and 64 starts
        - rho-step and rho-start absorb lengths 94 and 100 plus sixteen output bytes reproduce 23511040 added bytes
        - the rho state invariant, partition, collision, restart, stopping, public verification, and output fields are frozen
        - logical, archive, communication, group-operation, output, wall, and CPU totals remain below unchanged caps
      residual: >-
        The file freezes row populations and a generic prefix projection, but
        not an exact compiler assigning each row to candidate setup, root,
        control, audit, shared input, rho, or excluded BSGS totals by size.
        Nor does it define which events form each residual prefix or how class
        wall intervals compose across chronological stages. Consequently the
        promised candidate and rho directed output fields cannot yet be
        reproduced uniquely from the twenty-eight row artifacts.
    - id: B12-nonexhaustive-public-verifier-isolation
      status: REVISE
      passed_checks:
        - selector and verifier future paths and three attestation paths are exact
        - public read and write paths, environment, cwd, descriptors, and IPC/network denials are stated
        - candidate capacity is 15728640 in each of true-secret, decoy-secret, and no-secret states
        - total public-verification cardinality is exactly 47185920
        - candidate inputs, V, S, transcripts, outputs, counters, and exit status must remain identical
      residual: >-
        The syscall field is a promise to populate an exact allowlist later,
        not an exact frozen allowlist. Dependency extraction starts at two
        scripts and resolves repository modules, but does not freeze how the
        Python interpreter, standard library, import machinery, or scanner
        itself enters the hashed executable universe. The coverage artifact is
        named but has no canonical record schema that binds ordered slot IDs,
        mount-state receipts, denials, public counters, and their digest.
        Thus the finite universe remains underdefined independently of the
        honest absence of future implementation hashes.

