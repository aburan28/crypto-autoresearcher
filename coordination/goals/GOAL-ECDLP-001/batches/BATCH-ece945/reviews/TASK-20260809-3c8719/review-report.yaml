  verdict_summary: >-
    REVISE. The immutable producer snapshot, direct queue-binding child, exact
    five-path archive topology, self-neutral receipt, strict syntax, source
    hashes, and predecessor lineage all pass. Independent recomputation also
    passes every reachable confidence KAT, all twenty-four positional tuple and
    SHAKE256 vectors, the supplied ChaCha20-Poly1305 KAT, the point-orbit null
    replay, all twenty-eight n_c and q_c population sums and unique owners, the
    decoy-scalar addition, rho XOF call and byte additions, the aggregate-CPU
    versus wall-latency collision, population identities, output caps, traffic
    identities, and unchanged budgets. Four static reproducibility residuals
    prevent the claimed zero-residual successor. The production seed-envelope
    interface does not define how AAD is derived, does not place the promised
    key identifier in the envelope, and supplies no custody-receipt schema.
    Class rows name shard sets but freeze no event-to-shard assignment, so wall
    prefixes remain implementation-selectable. The cost file does not give a
    complete class-to-candidate/setup/control/rho aggregation or residual-prefix
    compiler for the promised per-size directed totals. The noninterference
    contract defers the exact syscall allowlist, resolves only repository
    modules, and omits the interpreter/stdlib and coverage-certificate schema
    needed to freeze a finite executable universe. Moreover, the immutable
    producer handoff requires the universe to be frozen but does not demand
    current hashes or a current all-slot certificate; the producer's claimed
    sole lifecycle circularity is therefore not the handoff's residual. These
    are pre-implementation contract defects, not experimental evidence or
    evidence against H-SYC-b854f4 or ECDLP.

