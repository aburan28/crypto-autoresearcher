  size_order: [18, 21, 24, 27, 30]
  class_count: 28
  duplicate_class_ids: 0
  missing_class_ids: 0

  counter_semantics:
    prefix_unit: >-
      For each class and size, q_c(b) is the exact number of complete primitive
      events replayed once across the explicit shard IDs. Prefix cpu_ns is the
      sum of occupied processor time over all threads and shards; prefix wall_ns
      is maximum end minus minimum start over the same frozen prefix. Neither is
      per-item and neither is already divided by q or shards.
    directed_projection: >-
      Linear event classes multiply each prefix lower bound by floor(n/q) plus
      the directed residual prefix and multiply each prefix upper bound by
      ceil(n/q), using 512-bit outward rounding. Sort, memory-topology, archive,
      and wiring classes additionally execute with full-size buffers and use
      the maximum of this projection and their exact formula bound. Any
      nonmonotone counter or lower bound above upper bound invalidates.
    aggregate_cpu: sum_over_all_threads_and_shards_never_divide_by_shard_count
    wall_latency: maximum_shard_completion_minus_minimum_shard_start
    energy: sum_package_and_DRAM_nanojoules_with_counter_wrap_rejected
    physical_bytes: separate_read_and_write_hardware_counter_bounds
    peak_memory: maximum_concurrent_live_bytes_not_sum_over_time
    archive: exact_bytes_read_plus_written_by_archive_stage
    communication: exact_bytes_crossing_process_or_shard_boundaries
    wiring: exact_unique_64_byte_selected_table_line_touches
    axes_kept_separate: [aggregate_cpu_ns, wall_latency_ns, energy_nJ, physical_read_bytes, physical_write_bytes, peak_live_bytes, archive_bytes, communication_bytes, wiring_unique_64_byte_line_touches]
    scalar_collapse_forbidden: true
    cpu_division_by_shards_forbidden: true
    prefix_reuse: each_prefix_hash_frozen_once_and_charged_once_only

  ownership_rules:
    artifact_owner_format: exact_future_path_hash_fragment
    probe_owner_format: throughput_certificate_exact_class_fragment
    artifact_owner_unique_across_classes: true
    probe_owner_unique_across_classes: true
    stage_owner_may_repeat: true
    compiler_rejects: [missing_owner, duplicate_owner, missing_size, population_sum_mismatch, prefix_sum_mismatch, unknown_shard, zero_prefix, primitive_residual, logical_byte_residual, physical_axis_residual, output_byte_residual]

