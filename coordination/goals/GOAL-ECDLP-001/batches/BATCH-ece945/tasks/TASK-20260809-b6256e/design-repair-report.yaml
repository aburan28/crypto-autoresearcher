        - 1280 decoy scalar primitive events, 204800 rho XOF calls, 23511040 rho XOF bytes, and 8388608 new output/archive bytes are added explicitly
        - exact logical, archive, communication, wall, and CPU totals remain below unchanged caps
        - the matched rho input, state invariant, sixteen-way partition, step table, start seeds, distinguished points, collisions, restarts, stopping, public verification, failures, shards, and per-size outputs are frozen
        - candidate dominance requires strict CPU and wall improvement and no worse value on every other directed axis
      residual: null
    - id: B12-nonexhaustive-public-verifier-isolation
