  falsifier_dispositions:
    - id: F-A-CONSTRUCTOR-REACHABILITY
      disposition: SURVIVES
      evidence_kind: exact_symbolic_zero_run_derivation
      binding: constructor-and-byte-kats.yaml#confidence_constructor
      details:
        - >-
          Interior vectors use exactly 256 roots and four Boolean model bits
          per root. The repeated root vector 0011 gives 512 successes of 1024
          and exact m=1/2, so it is reachable through the frozen interface.
        - >-
          The same reachable vector is mapped through eta -4, 0, and 4 with
          exact symbolic delta and gamma endpoints and outward decimal
          enclosures.
        - >-
          All-zero roots give m=0, exact lower clipping L=0, and H_plus equal
          positive infinity. All-one roots give m=1 and exact upper clipping.
        - >-
          The predecessor interval of width about 0.01258 is explicitly
          rejected because an interior output of this constructor must have
          width 2*sqrt(log(64000)/512), about 0.29404.
    - id: F-B-HARDWARE-TIME-SHARD-COLLISION
      disposition: REJECTS_PREDECESSOR_CPU_DIVISION
      evidence_kind: exact_integer_zero_run_derivation
      binding: physical-cost-compiler.yaml#hardware_time_shard_collision
      details:
        - candidate aggregate CPU occupancy is 720 and rho is 500
        - candidate wall latency is 90 and rho is 100
        - dividing by eight and five creates the false 90-versus-100 CPU order
        - the successor keeps CPU and wall separate and returns Pareto incomparable
    - id: F-C-LITERAL-BYTES
      disposition: SURVIVES_STATIC_BYTE_INTERFACE
      evidence_kind: literal_preimplementation_vectors
      binding: constructor-and-byte-kats.yaml#literal_xof_vectors
      details:
        - sixteen numeric one-byte tags and payload widths are frozen
        - every one of twenty-four domains has a positional typed schema
        - the seed is the first field and every SHAKE stream begins at offset zero
        - every domain has literal absorb and output hex plus SHA-256 digests
        - the replay envelope has literal key-only-for-KAT, nonce, AAD, plaintext, commitment, ciphertext, tag, envelope, and digest
        - the point-orbit null has literal R, minus-R, duplicate-R, infinity, labels, replay bytes, and digest

