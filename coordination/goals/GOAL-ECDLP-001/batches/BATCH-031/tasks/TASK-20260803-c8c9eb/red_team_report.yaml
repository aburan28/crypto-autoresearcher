    Q3_cheapest_remaining_falsifier_if_PASS: >-
      Overall verdict is REVISE, so no PASS-path falsifier is owed for execute
      authorization. Had B1 been judged PASS on integrity alone, the cheapest
      pre-exec falsifier would be: draw ~50 synthetic null LPF multisets of size
      n=130816 from the prime-atom distribution (no curve work); compute
      T_8 on LPF>2; verify tau cloud is a point mass at 0 — already done here
      (50/50 tau=0; T=ln(3)/ln(X) to float identity). That falsifies
      "non-vacuous thr_TAIL expected under this statistic."

  objections:
  - id: RTc8c9eb-B1
    severity: BLOCKING
    title: >-
      LPF>2 / k=8 deep-smooth mean re-saturates on the LPF=3 atom; thr_TAIL=0
      remains the expected calibration outcome
    repairs_target: RT411037-B1
    quoted_passages_in_full:
    - >-
      specification.yaml deep_smooth_tail_lpf_gt_2: "Let S_elig = { z(N) : N in
      the sample and LPF(N) > 2 }. ... T = mean of the 8 smallest values in
      S_elig (deep_smooth_order_count_k=8)."
    - >-
      specification.yaml why_not_lpf2_saturated: "Restricting to LPF(N) > 2
      removes the atom at z=ln(2)/ln(X) that made every prior tau_r identically
      0 under EXP-SMTH-4403c4."
    - >-
      specification.yaml GATE-TAIL-NONVACUOUS pass_conditions: thr_TAIL > 0;
      max(tau_1..tau_200) > 0; not (all tau_r identical and equal to 0).
    finding: >-
      RT411037-B1's mechanism was order-statistic collapse onto the cheapest
      LPF atom. Excluding LPF=2 shifts the cheapest eligible atom to LPF=3
      without changing the mechanism. Classical densities: P(LPF=2)=1/2,
      P(LPF=3)=1/6, so E[#{LPF=3}]=n/6≈21802.7 at n=130816. P(#{LPF=3}<8) is
      negligible under a Poisson(21803) model. Therefore T_8(S_elig)=ln(3)/ln(X)
      on essentially every arm at both toy X values; tau_r=|T_CAL-T_ref|=0;
      thr_TAIL=199th OS=0; GATE-TAIL-NONVACUOUS fails. A cheap synthetic-LPF
      Monte Carlo (50 null draws, no factorization) reproduced tau≡0 and
      T≡ln(3)/ln(X). The same collapse recurs if the floor is raised to LPF>3
      or LPF>5 while k stays 8 (next atoms still have E[count]≫8). Raising k
      above the atom count (~2e4) is infeasible as a "deep" mean; a mid-band
      mass / rate statistic is the cheap structural escape. Note: RT411037's
      own example "mean of 8 smallest z among odd N" is exactly this failing
      repair — the mid-band and large-k alternatives in that same sentence were
      the sound ones.
    consequence: >-
      Authorizing execute spends full CAL-NULL-X (200×130816×2 bit sizes
      factorizations) to rediscover thr_TAIL=0 and emit M-INSTRUMENT. That is
      not a repaired discriminating deep-smooth limb. Vacuous M-SUPPORT is
      blocked (gate works), but B1 as "repair thr_TAIL=0 vacuity" for a usable
      instrument is not met. OPEN-BATCH023-A residual deep-smooth debt remains.
    required_control: >-
      Supersede under a new EXP id before any execute. Pre-register a deep-smooth
      / tail statistic whose null has positive variance at these (n,X), e.g.
      empirical mass with LPF in (B_5, B_4], or mean z on that mid-band, or
      another non-atom-order-statistic. Keep GATE-TAIL-NONVACUOUS. Optionally
      add a one-paragraph pre-exec null-atom audit: compute E[count] of the
      cheapest eligible LPF atom and require E[count] < k/2 (or switch
      statistic) as a freeze-time integrity check.

  - id: RTc8c9eb-B1-gate
    severity: MAJOR
    title: >-
      GATE-TAIL-NONVACUOUS integrity half is adequate; do not confuse abort
      hygiene with a non-vacuous limb
    repairs_target: RT411037-B1
    quoted_passages_in_full:
