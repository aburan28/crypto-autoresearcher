      MUST NOT treat KS∧RATE-BAND alone as a support conjunction.
    - >-
      specification.yaml invalidation_rules: "Any emission of M-SUPPORT when
      GATE-TAIL-NONVACUOUS failed or thr_TAIL <= 0."
    finding: >-
      The gate, precedence (M-INSTRUMENT before M-SUPPORT/M-REFUTE/M-SPLIT),
      and invalidation rules correctly close the RT411037 overclaim path where
      thr_TAIL=0 was silently counted as TAIL-pass. That integrity repair stands
      and should be retained. It is not sufficient alone to mark B1 PASS for
      execute authorization when the calibrated statistic is predictably
      non-discriminating.
    consequence: >-
      Narrow credit: vacuous-support integrity is fixed. Execute authorization
      still blocked by RTc8c9eb-B1.
    required_control: >-
      Retain GATE-TAIL-NONVACUOUS + M-INSTRUMENT in any superseding contract;
      pair with a non-atom-saturating statistic.

  - id: RTc8c9eb-B2
    severity: INFO
    title: B2 anti-promotion wording is adequate
    repairs_target: RT411037-B2
    quoted_passages_in_full:
    - >-
      specification.yaml HEUR_DS_1_anti_promotion: no branch may be equated with
      "HEUR-DS-1 validated/supported/discharged" at any tier; especially binding
      while TAIL vacuous OR object is only FB census (always true of OBJ-REAL).
    - >-
      specification.yaml M-SUPPORT name: "TOY-CELL INSTRUMENT-PASS (NOT HEUR-DS-1
      VALIDATION)"; heuristic_verdict: instrument_pass_at_toy_cells_only;
      forbids_reading_as includes HEUR-DS-1 validated/supported/discharged.
    finding: >-
      Relative to EXP-SMTH-4403c4's "TOY-TIER SUPPORT for HEUR-DS-1" /
      support_at_toy_scope sentence-path, the superseding contract removes the
      dangerous promotion reading. FB-census honesty is explicit. claim_ceiling
      and what_this_experiment_is_NOT reinforce the ban. Cosmetic residual:
      branch id remains M-SUPPORT, which a careless citation could strip from
      disposition text — mitigated by forbids_reading_as and anti-promotion rule.
    consequence: >-
      B2 is PASS for contract-language adequacy. No execute authorization follows
      because B1 is REVISE.
    required_control: >-
      Keep HEUR_DS_1_anti_promotion in the superseding EXP. Optional: rename
      branch id to M-INSTRUMENT-PASS to reduce citation stripping risk.

  - id: RTc8c9eb-M1
    severity: MAJOR
    title: >-
      Unaddressed carry-overs (dependence / object-transfer) remain out of B1/B2
      scope but still bound any future support reading
    quoted_passages_in_full:
    - >-
      DEC-20260802-446a54 next_actions names only RT411037-B1/B2 repair for the
      successor; RT411037-M1/M2 remain as limitations.
    finding: >-
      EXP-SMTH-9d04ba correctly scopes this batch to B1/B2 and does not claim to
