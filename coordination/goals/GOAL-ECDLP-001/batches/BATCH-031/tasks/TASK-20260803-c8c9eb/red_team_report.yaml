      are not new blockers for this card's B1/B2 PASS bar, but they still forbid
      reading any future instrument-pass as HEUR-DS-1 validation — already
      aligned with B2 PASS text.
    consequence: >-
      Do not expand this REVISE into STR/DEP reopen or into a demand that M1/M2
      be fixed inside BATCH-031. Record as standing scope limits on any later
