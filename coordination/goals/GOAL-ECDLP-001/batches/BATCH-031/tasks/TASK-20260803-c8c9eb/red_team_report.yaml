      STILL SATURATES. LPF>2 removes the LPF=2 atom but leaves the LPF=3 atom
      (z=ln(3)/ln(X)) with E[count]≈21803 at n=130816. Mean of k=8 smallest
      eligible z is identically ln(3)/ln(X) on REF and every CAL replicate;
