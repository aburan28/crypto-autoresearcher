  - id: subfield_transfer_from_prime_field
    admissible: true
    source_class: prime_field_without_proper_subfield
    transfer_map: "evaluated isogeny followed by certified descent and pullback"
    certificate_proves:
      - evaluated_path_and_subgroup_images
      - field_tower_or_subfield_embedding
      - descent_relations_and_solver_output
      - pullback_relation
      - original_instance_verification
    success_probability:
      value: 0
      basis: "F_p has no proper subfield and the frozen path does not change the base field"
    time:
      expression: infinity
      power_exponent: null
      ratio_to_rho: infinity
      log2_ratio_to_rho: infinity
    memory:
      asymptotic: "at least descent and path state; time infeasible"
      ratio_to_rho: null
      log2_ratio_to_rho: null
    data_queries:
      asymptotic: "positive descent/path data; time infeasible"
      ratio_to_rho: null
      log2_ratio_to_rho: null
    delta_alpha: null
    dominated_by: matched_pollard_rho
    pareto_check:
      complete: true
      axes_checked:
