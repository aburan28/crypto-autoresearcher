schema_version: "1.0"
task_id: TASK-20260802-201
verdict: OBSTRUCTED_IN_SCOPE

scope:
  source: "prime-field E/F_p with prime-order subgroup of order N"
  admissible_transfer: "evaluated ordinary F_p-isogeny path of degree coprime to N, complete special solve, pullback, certificate, and verification on the original instance"
  target_families:
    - anomalous_trace_one
    - low_embedding_degree_mov_frey_ruck
    - subfield_or_weil_descent_friendly
  excluded:
    - structured_CM_or_pairing_friendly_sources_as_generic_evidence
    - changed_base_field_or_uncharged_extension_boundary
    - direct_BSGS_without_isogeny_evaluation
    - crypto_scale_inference_from_toy_data

comparison:
  baseline: matched_pollard_rho
  time_cost: "0.886*sqrt(N_star)"
  success_matching: equal
  preprocessing_matching: equal
  memory_matching: equal
  data_query_matching: equal
  parallelism_matching: equal
  exponent_delta_convention: "delta_alpha = alpha_rho - alpha_candidate; positive favors candidate"
  log_ratio_convention: "log2(candidate resource / matched-rho resource); positive is worse"

obstruction:
  name: frozen_invariant_target_obstruction
  type: derivation
  statement: >-
    An admissible F_p-rational isogeny preserves Frobenius trace and point
    count; embedding degree is ord_N(p), depending only on frozen p and N;
    and an isogeny does not change the prime base field. Therefore every
    registered target property is either already present at the source or
    unreachable from it.
  consequence_non_special: "p_success=0 and expected transfer cost is infinite"
  consequence_special: "direct special solver weakly dominates transfer after removing nonnegative isogeny overhead"
  empirical_zero_used_as_proof: false

rows:
  - id: matched_pollard_rho
    admissible: true
    role: baseline
    source_class: frozen_generic_non_special
    success_probability: matched
    time:
      expression: "0.886*sqrt(N_star)"
      power_exponent: 0.5
      ratio_to_rho: 1.0
      log2_ratio_to_rho: 0.0
    memory:
      asymptotic: "O(1) state under frozen rho implementation"
      ratio_to_rho: 1.0
      log2_ratio_to_rho: 0.0
    data_queries:
      asymptotic: "no transfer-specific oracle or path data"
      ratio_to_rho: 1.0
      log2_ratio_to_rho: 0.0
    preprocessing: none_frozen
    parallelism: "same worker budget as candidates"
    delta_alpha: 0.0
    dominated_by: null
    pareto_check:
      complete: true
      axes_checked:
        - time
        - memory
        - data_queries
      rationale: >-
        No admissible frozen transfer has lower finite time with memory and
        data/query use no worse than rho. Inadmissible special-source controls
        do not enter this frontier.

  - id: anomalous_transfer_from_non_anomalous
    admissible: true
    source_class: non_anomalous
    transfer_map: "coprime-degree evaluated isogeny followed by anomalous solver and pullback"
    certificate_proves:
      - evaluated_path_and_coprime_degree
      - subgroup_images
      - target_trace_one_and_order_p
      - special_solver_output
      - pullback_relation
      - original_instance_verification
    success_probability:
      value: 0
      basis: "trace and point-count invariance"
    time:
      expression: infinity
      power_exponent: null
      ratio_to_rho: infinity
      log2_ratio_to_rho: infinity
    memory:
      asymptotic: "at least path/certificate state; time infeasible"
      ratio_to_rho: null
      log2_ratio_to_rho: null
    data_queries:
      asymptotic: "positive path and certificate data; time infeasible"
      ratio_to_rho: null
      log2_ratio_to_rho: null
    delta_alpha: null
    dominated_by: matched_pollard_rho
    pareto_check:
      complete: true
      axes_checked:
        - time
        - memory
        - data_queries

  - id: anomalous_transfer_control_from_anomalous
    admissible: false
    inadmissibility_reason: "source is already special; not a genuine non-special transfer"
    source_class: anomalous
    time:
      expression: "C_direct_anomalous + C_path + C_certificate + C_pullback"
      power_exponent: null
      ratio_to_rho: null
      log2_ratio_to_rho: null
    memory:
      asymptotic: "no better than direct anomalous solver"
      ratio_to_rho: null
      log2_ratio_to_rho: null
    data_queries:
      asymptotic: "strictly no better than direct anomalous solver"
      ratio_to_rho: null
      log2_ratio_to_rho: null
    delta_alpha: null
    dominated_by: direct_anomalous_solver
    pareto_check:
      complete: true
      axes_checked:
        - time
        - memory
        - data_queries
      rationale: "The direct solver removes every nonnegative transfer-only term."

  - id: mov_transfer_from_high_embedding_degree
    admissible: true
    source_class: high_embedding_degree
    transfer_map: "evaluated coprime-degree isogeny, pairing reduction, complete F_{p^k} DLP, and pullback"
    certificate_proves:
      - evaluated_path_and_subgroup_images
      - "k=ord_N(p)"
      - pairing_inputs_and_outputs
      - field_DLP_solution
      - pullback_relation
      - original_instance_verification
    success_probability:
      value: 0
      basis: "embedding degree ord_N(p) is fixed by frozen p and N"
    time:
      expression: infinity
      power_exponent: null
      ratio_to_rho: infinity
      log2_ratio_to_rho: infinity
    memory:
      asymptotic: "at least field-DLP and path state; time infeasible"
      ratio_to_rho: null
      log2_ratio_to_rho: null
    data_queries:
      asymptotic: "positive path/pairing/certificate data; time infeasible"
      ratio_to_rho: null
      log2_ratio_to_rho: null
    delta_alpha: null
    dominated_by: matched_pollard_rho
    pareto_check:
      complete: true
      axes_checked:
        - time
        - memory
        - data_queries

  - id: planted_k1_mov_frozen_v3
    admissible: false
    inadmissibility_reason: >-
      The observed certificate was direct BSGS, the path returned to a special
      start, and no genuine non-special transfer or live identical-shape null
      was present.
    observed_inputs:
      C_path: 9
      C_pullback: 40
      C_special_MOV: 1284
      matched_rho: 641.609
    time:
      expression: "(9+40+1284)/641.609"
      power_exponent: 0.5
      ratio_to_rho: 2.08
      log2_ratio_to_rho: 1.06
    alternative_supplied_field_dlp_charge:
      expression: "(9+40+1448)/641.609"
      ratio_to_rho: 2.33
      log2_ratio_to_rho: 1.22
      reconciliation_status: unresolved
    memory:
      bsgs_interpretation: "approximately sqrt(N_star), about 724 stored entries"
      rho_interpretation: "O(1) state"
      approximate_log2_entry_ratio: 9.50
      exact_byte_ratio: null
      uncertainty: "point representation sizes and exact field-DLP implementation were not supplied"
    data_queries:
      candidate: "positive path, pairing, certificate, and ledger data"
      rho: "no transfer-specific data"
      ratio_to_rho: null
      log2_ratio_to_rho: null
      reason_null: "zero transfer-query denominator"
    delta_alpha: 0.0
    dominated_by: matched_pollard_rho
    pareto_check:
      complete: true
      axes_checked:
        - time
        - memory
        - data_queries

  - id: mov_transfer_control_from_low_embedding_degree
    admissible: false
    inadmissibility_reason: "source already admits the same pairing reduction"
    source_class: low_embedding_degree
    time:
      expression: "C_direct_MOV + nonnegative transfer overhead"
      power_exponent: null
      ratio_to_rho: null
      log2_ratio_to_rho: null
    memory:
      asymptotic: "no better than direct MOV/Frey-Ruck"
      ratio_to_rho: null
      log2_ratio_to_rho: null
    data_queries:
      asymptotic: "no better than direct MOV/Frey-Ruck"
      ratio_to_rho: null
      log2_ratio_to_rho: null
    delta_alpha: null
    dominated_by: direct_mov_frey_ruck
    pareto_check:
      complete: true
      axes_checked:
