cheapest_falsification_route:
  type: derivation_then_optional_tiny_exhaustive_control
  experiments_run_here: 0
  derivation: >-
    Count the equivalence classes of G x [M] when only labeled copies of the
    same affine element are identified; the result is N for all M.
  optional_control:
    subgroup_order: 101
    representation_counts: [1, 4, 16]
    expected_distinct_canonical_keys: 101
    null: identical_shape_random_bijection
    decision: >-
      Any claimed N/M key count must identify which distinct original elements
      were merged and provide recoverable certified relations among them.

required_repairs:
  - id: R1
    priority: blocking_for_pass
    action: >-
      Withdraw or replace the successor's N/M cardinality, M^-1/2 gain,
      constant-success, 3/8 exponent, +1/8 delta, and target dominated_by:null.
  - id: R2
    priority: major
    action: >-
      Normalize cost units and use a named closest field-DLP algorithm; relabel
      current numerical ratios as frozen proxy-work ratios.
  - id: R3
    priority: major
    action: >-
      Reissue the Pareto inventory and qualify special-source constant
      dominance; remove unsupported completeness/null assertions.
  - id: R4
    priority: major
    action: >-
      State exact forward/dual isogeny scalar orientation and separate
      certificate generation, verification, memory, and data/query cost.
  - id: R5
    priority: minor
    action: >-
      Make F_p-rationality or the fully charged extension-field alternative an
      explicit admissibility premise.

narrowest_supported_statement: >-
  Within the frozen non-special prime-field source and exactly the anomalous,
  low-embedding-degree, and subfield/Weil-descent predicates, the target is
  already present or inadmissible/unreachable. This is a bounded derivation;
  rho_special=0 and HEUR-ISO-1 supply no impossibility evidence. The current
  quotient-rho successor is falsified as specified because its quotient retains
  N logical states.

next_concrete_action: >-
  Coordinator should request corrected analytical artifacts, with no Executor
  admission for IDEA-20260802-201-01 until a distinct-logical-element quotient
  and its inverse-success cost are proved. This recommendation changes no
  official status.

