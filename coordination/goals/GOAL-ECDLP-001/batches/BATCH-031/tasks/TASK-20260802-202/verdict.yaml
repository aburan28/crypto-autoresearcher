findings:
  - id: RT202-F1
    severity: critical
    disposition: successor_falsified_as_written
    subject: successor_quotient_cardinality_and_success_probability
    artifact_refs:
      - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-031/tasks/TASK-20260802-201/successor-proposal.yaml
        sha256: 35a6317f05ca180ab4fd39adea32faac6489ee02a749c10258a4d091cc9ef831
        loci:
          - mechanism.summary
          - cost_model.per_attempt
          - target_inequalities
          - predictions.P2_quotient_collision_gain
          - predictions.P5_exponent_gate
          - pareto.target_state
    objection: >-
      The proposal creates M representations of each same affine group element
      and then canonicalizes those copies. For X=G x [M] with (R,i)~(R,j),
      |X/~|=N, not N/M. At T=Theta(sqrt(N/M)), birthday success is Theta(1/M),
      not Omega(1). The inverse-success factor removes and reverses the claimed
      speedup.
    decisive_equations:
      physical_state_count: "|X|=M*N"
      quotient_state_count: "|X/~|=N"
      proposed_steps: "T=N^((1-delta)/2+o(1))"
      actual_success_at_proposed_steps: "s=Theta(T^2/N)=N^(-delta+o(1))"
      expected_restart_cost: "N^(gamma+(1+delta)/2+o(1))"
      constant_success_cost: "N^(gamma+1/2+o(1))"
    affected_claims:
      - "effective state space N/M"
      - "M^(-1/2) collision gain"
      - "s=Omega(1) at sqrt(N/M) steps"
      - "time exponent 3/8"
      - "delta_alpha_vs_rho=+1/8"
      - "target dominated_by=null"
    repair: >-
      Withdraw those claims. Before any execution, either prove a quotient that
      merges M distinct original logical elements by certified recoverable
      relations, or record the cardinality obstruction and replace the
      successor. Recompute cost times inverse success from the proved quotient.

  - id: RT202-F2
    severity: major
    disposition: revise_cost_model
    subject: field_dlp_baseline_and_unit_normalization
    artifact_refs:
      - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-031/tasks/TASK-20260802-201/feasibility-rerank.md
        sha256: 60b7dbf88285ba2595f8a6412ae309e774262a8c0a1bd92effa0b283e9da7a8a
        loci:
          - Frozen planted-cell accounting
          - Pareto and sota_delta summary
      - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-031/tasks/TASK-20260802-201/pareto-frontier.yaml
        sha256: bfda9201c2d17936373db45ce338875c43598d2483bde99c00f807e2fb63ce89
        loci:
          - rows.planted_k1_mov_frozen_v3
    objection: >-
      The 1284 and 1448 charges are valid frozen proxies but are not a
      closest-algorithm lower bound for an order-N finite-field subgroup. The
      package also adds EC, isogeny, field-group, and pullback operations
      without a common unit calibration or the registered factor-ten
      sensitivity, then labels their log ratios as bits of time.
    decisive_equations:
      frozen_v3_ratio: "1333/641.609=2.077589310624; log2=1.054910496358"
      supplied_bsgs_ratio: "1497/641.609=2.333196697677; log2=1.222307937327"
      generic_order_N_field_rho_proxy: "(9+641.609+40)/641.609=1.076370499790; log2=0.106174756524"
    repair: >-
      Distinguish frozen-ledger proxy compliance from scientific cost. Name the
      field-DLP algorithm and subgroup order, normalize operation types to a
      common unit, include preprocessing/relation/descent/memory/data and
      amortization, run the declared sensitivity analytically, and call the
      existing numbers proxy-work ratios rather than elapsed-time bits.

  - id: RT202-F3
    severity: major
    disposition: revise_pareto
    subject: pareto_completeness_and_direct_solver_dominance
    artifact_refs:
      - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-031/tasks/TASK-20260802-201/pareto-frontier.yaml
        sha256: bfda9201c2d17936373db45ce338875c43598d2483bde99c00f807e2fb63ce89
        loci:
          - rows.matched_pollard_rho.pareto_check
          - rows.anomalous_transfer_control_from_anomalous
          - rows.mov_transfer_control_from_low_embedding_degree
      - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-031/tasks/TASK-20260802-201/successor-proposal.yaml
        sha256: 35a6317f05ca180ab4fd39adea32faac6489ee02a749c10258a4d091cc9ef831
        loci:
          - pareto.target_state
          - pareto.rows_checked
    objection: >-
      The claimed every-row audit does not enumerate closest finite-field DLP,
      BSGS, serial/parallel rho, preprocessing-amortized, or direct-special
      tradeoff rows. Invariance gives already-special source access to the same
      attack family, but strict constant-resource dominance additionally needs
      C_direct_source <= C_path+C_solver_target+C_cert+C_verify. The successor
      target's dominated_by:null is hypothetical and rests on RT202-F1's false
      exponent.
    repair: >-
      Publish the named full frontier and assumptions, qualify special-source
      dominance at the exponent/property level unless the constant inequality
      is shown, and remove unsupported complete:true and dominated_by:null.

  - id: RT202-F4
    severity: major
    disposition: revise_certificate
    subject: scalar_orientation_and_certificate_cost_partition
    artifact_refs:
      - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-031/tasks/TASK-20260802-201/feasibility-rerank.md
        sha256: 60b7dbf88285ba2595f8a6412ae309e774262a8c0a1bd92effa0b283e9da7a8a
        loci:
          - Candidate-family audit
          - Common end-to-end cost and success argument
    objection: >-
      "Pullback/scaling relation" is not an exact scalar-orientation rule. If
      Q'=[x]P' under an injective coprime-degree isogeny, then Q=[x]P; x is not
      degree-scaled. Degree inversion arises only when pulling points back with
      the dual. Per-attempt and success-only certificate costs are also not
      separated.
    decisive_equations:
      forward: "P'=phi(P), Q'=phi(Q), Q'=[x]P' implies Q=[x]P"
      dual: "phi_hat(P')=[D]P and phi_hat(Q')=[D]Q; use D^(-1) mod N for point pullback"
    repair: >-
      Bind every edge, field of definition, composed degree, point image, and
      pairing/field-DLP input; state the equations above; charge generation and
      verification separately; retain final Q=[x]P verification.

  - id: RT202-F5
    severity: minor
    disposition: clarify_scope
    subject: rationality_and_extension_boundary
    artifact_refs:
      - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-031/tasks/TASK-20260802-201/feasibility-rerank.md
        sha256: 60b7dbf88285ba2595f8a6412ae309e774262a8c0a1bd92effa0b283e9da7a8a
        loci:
          - Verdict
          - Frozen boundary used
    objection: >-
      Trace equality requires an F_p-rational isogeny, while the capsule's
      short description says ordinary-isogeny path. The report later excludes
      uncharged extension boundaries, but this premise should be explicit at
      the certificate boundary so an extension-defined map cannot be used as a
      counterexample without its solver-domain and cost changes.
    repair: >-
      Require each map to be F_p-rational and its images to lie in the target
      solver domain, or specify and fully charge the extension-field variant.

checks_passed:
  - id: RT202-P1
    subject: bounded_non_special_reachability_obstruction
    result: pass_bounded
    detail: >-
      An anomalous target usable on an order-N subgroup forces N=p and the
      source is already anomalous in the tested regime; k=ord_N(p) is fixed;
      and F_p has no proper subfield. The registered target predicates cannot
      be created for a genuinely non-special source.
  - id: RT202-P2
    subject: zero_event_interpretation
    result: pass
    detail: >-
      rho_special=0 was not used as impossibility. The exact zero-of-50000
      one-sided 95 percent upper bound is 5.991285062e-5; HEUR-ISO-1 remains
      unmeasured and no KS/tail claim is made.

