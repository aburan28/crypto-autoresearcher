  blocking_check_verbatim_copy:
    status: PASS
    what_was_done: >-
      NOT taken from the producer's account. The source file was read straight
      out of the Git object store at the cited commit and lines 416-441 were
      sliced and hashed by this reviewer; the copied region was sliced out of
      the committed mutation_driver.py blob by the marker comments and hashed;
      the two byte strings were compared.
    commands:
      - "git rev-parse e3cf9fdd -> e3cf9fdd770cbab3ebf55691a60143ace2b75f4c"
      - "git cat-file blob e3cf9fdd:.../BATCH-015/probe/probe_driver.py | shasum -a 256
         -> 9885810350ca914ffdb9a7dc1132315dea5ce14d8858de68438046c363b52977
         (matches manifest.verbatim_checker_provenance.source_file_sha256)"
      - "python3: sha256 of lines[415:441] joined by newline, plus trailing newline
         -> 89ecfa9ac1a6705c83deacb0ee03e75818b93575d3ca97bac28ddf301c1fc3b0"
      - "python3: sha256 of mutation_driver.py text between BEGIN_MARK and END_MARK
         -> 89ecfa9ac1a6705c83deacb0ee03e75818b93575d3ca97bac28ddf301c1fc3b0"
      - "python3: copied == source -> True; both 1444 bytes"
    finding: >-
      THE CHECKER WAS COPIED, NOT REWRITTEN. 1444 bytes, 26 lines, ZERO
      characters changed inside the region. The recorded digest
      89ecfa9ac1a6705c83deacb0ee03e75818b93575d3ca97bac28ddf301c1fc3b0 is
      confirmed independently and is the digest of exactly lines 416-441 with
      the trailing newline. The identifiers `inst1` and `zeta3_1` were kept from
      the source, so not even a name differs. The cited path, line range and
      commit are all correct.
    wrapping_semantics_verdict: PASS
    wrapping_semantics_analysis: >-
      THE SUBTLER QUESTION, ANSWERED SEPARATELY. The Executor added, OUTSIDE the
      compared region: `def ctrl4_checker_copied_verbatim(entry, F, inst1,
      zeta3_1, B):`, `    for _binding_only in (0,):`, `        if True:`, the
      two marker comments, and `    return entry`. I checked four ways that this
      wrapping cannot change the copied region's behaviour.
      (1) FREE NAMES. The region's free names are exactly entry, F, inst1,
      zeta3_1, B plus the builtins len, pow, range, int, list. All five are bound
      by the function signature. NO module-level name in mutation_driver.py
      shadows any builtin the region uses (checked by AST call/name walk); the
      region calls NO module-level function of either file - sha256_obj is used
      at source line 442, which is OUTSIDE the copied range and is not in the
      copy.
      (2) SHADOWING/CAPTURE BY THE WRAPPER. The wrapper introduces exactly one
      new name, `_binding_only`, which does not appear anywhere in the region.
      `if True:` introduces none. Neither can capture or rebind entry, F, inst1,
      zeta3_1, B, nor the region's own locals p, complete_blocks, failing, j,
      base, k, want, got, nor the lambda parameter d.
      (3) CONTROL FLOW. Wrapping in a loop would matter if the region contained
      `break`, `continue`, `return` or `yield` at wrapper level. It contains
      none: the only loops are the region's own `for j` / `for k`, whose `break`
      semantics are unaffected, and the single-iteration `for _binding_only in
      (0,)` runs the body exactly once and falls through. Python has no block
      scope, so the 12-space nesting is presentation only.
      (4) WHAT inst1 AND zeta3_1 ACTUALLY BIND TO. In the source, main() binds
      `inst1, zeta3_1 = val` where val = (ela._generate_j0_instance(seed=1,
      field_bits=12), ela._find_zeta3(inst.p)) - the J0 instance object and the
      TRUE cube root; F comes from ela._build_phi_invariant_factor_base(inst1,
      B, zeta3_1); B is the loop variable of `for B in (192, 193)`. In the copy,
      run_case calls ctrl4_checker_copied_verbatim(rec, F_case, inst, z_check,
      B_FIXED): `inst` is the same generator's output for the same
      seed=1/field_bits=12 (verified: the BATCH-015 CURVE_SPEC entry for
      CURVE-J12S1 is {"requested_seed": 1, "field_bits": 12}), `z_check` is the
      zeta3 the case declares for checking, B_FIXED = 192. The region reads only
      inst1.p, and inst.p is an int in both. THE BINDINGS ARE THE SAME OBJECTS
      OF THE SAME KINDS. The only intentional freedom - which is the whole point
      of the card - is that z_check may be a bogus z in case 1, exactly as the
      BATCH-015 red team ran it.
      CONCLUSION: THE WRAPPING IS SEMANTICALLY INERT. The batch measured CTRL-4,
      not a rewrite.

