  OBS_3_further_mutation_classes_CTRL4_does_not_detect:
    status: >-
      VALIDATOR EXPLORATORY PROBE. NOT part of CTRL-RT034-A, NOT pre-registered,
      NOT a result of BATCH-016, and NOT to be recorded as one. It is reported
      because the card asks whether the two-way characterisation is complete.
      Every figure below is from a command this reviewer ran, using the SAME
      verbatim checker region extracted from Git, on the SAME instance
      (CURVE-J12S1, p = 2293, zeta3 = 1303) at B = 192.
    answer: >-
      NO. THE CHARACTERISATION IS NOT COMPLETE. CTRL-4 is blind to at least
      three further classes, one of which is a LAYOUT break of exactly the kind
      cases 2 and 3 were meant to probe.
    the_root_cause_stated_exactly: >-
      Condition (ii) RE-ANCHORS ON F[3j] SEPARATELY FOR EVERY BLOCK j, and
      compares only ratios within that block. Two structural consequences follow
      mechanically. (a) The pair (j, 0) can NEVER fail for any input whatsoever,
      because it compares F[3j] against pow(z,0,p)*F[3j] = F[3j]; one third of
      the 192 comparisons are vacuous by construction. (b) The predicate is
      PURELY RELATIVE - it constrains F only up to an arbitrary choice of 64
      independent anchors and their order, and it never once asks whether any
      element is an x-coordinate on E, whether the elements are distinct, or
      whether they came from the constructor at all. THE COMPLETE SEMANTIC
      CONTENT OF CTRL-4 IS: "len(F) == B, and F is a concatenation of len(F)//3
      geometric triples whose common ratio equals the z you handed the checker."
      Nothing outside that statement is detected - including which z, which
      curve, and which anchors.
    class_4a_block_level_permutation:
      mutation: >-
        Permute the 64 complete blocks AS UNITS (I reversed them: block order
        63, 62, ..., 0, each block's internal order untouched).
      measured_outcome: "cond(i) PASS, cond(ii) PASS, JOINT PASS, 0 failing pairs"
      controls: >-
        Multiset preserved (True); every element still on the curve (True); the
        list genuinely differs from F (True).
      why_it_matters_most: >-
        THIS IS A LAYOUT BREAK AND CTRL-4 DOES NOT SEE IT. It is the direct
        complement of case 3: case 3 permuted ACROSS block boundaries and was
        caught; a permutation that respects block boundaries is invisible. So
        "CTRL-4 detects layout breaks" is FALSE AS STATED. What it detects is
        layout breaks that alter WITHIN-BLOCK ratios. Any downstream record that
        depends on factor-base ORDER - row ordering, index-to-element maps,
        anything comparing two runs' factor bases positionally - is unprotected
        by CTRL-4.
    class_4b_off_curve_elements:
      mutation: >-
        Build a 192-element list of geometric triples [x, zx, z^2 x] with the
        TRUE zeta3, choosing each anchor x from the values for which
        E.lift_x(x) IS None - i.e. every element is a non-residue x that is NOT
        on the curve.
      measured_outcome: "cond(i) PASS, cond(ii) PASS, JOINT PASS, 0 failing pairs"
      controls: >-
        192 of 192 elements are NOT on the curve; the list shares ZERO elements
        with the true F.
      why_it_matters: >-
        THE CHECKER NEVER TESTS CURVE MEMBERSHIP. It calls no lift_x and no
        curve method at all; it reads only inst1.p. A factor base that is not a
        factor base - not a set of x-coordinates on E, with no element in common
        with the real one - passes CTRL-4 in full. Note the asymmetry with case
        2: case 2's replacement WAS on the curve and was caught, because what
        was broken was the ratio, not the curve membership. CTRL-4 never checked
        the property case 2's mutation preserved.
    class_4c_degenerate_or_duplicated_content:
      mutation: "F' = block 0 repeated 64 times (192 elements, 3 distinct values)."
      measured_outcome: "cond(i) PASS, cond(ii) PASS, JOINT PASS, 0 failing pairs"
      controls: "3 distinct elements against the true F's 192 distinct elements."
      why_it_matters: >-
        A maximally degenerate factor base passes both conditions. Anything
        downstream that relies on CTRL-4 to establish that F supplies 64
        distinct orbits or 192 distinct targets is relying on a check that never
        looked. An all-zero list of length 192 also passes both conditions
        (measured: JOINT PASS).
    class_4e_compound_z_and_content:
      mutation: >-
        Bogus z = 7 (pow(7,3,2293) = 343, not 1) AND arbitrary integers as
        anchors, checked with the same z = 7.
      measured_outcome: "cond(i) PASS, cond(ii) PASS, JOINT PASS"
      why_it_matters: >-
        Composing class 1 with class 4b shows the blindnesses are independent
        and compose: an ARBITRARY list of integers, on no curve, with a ratio
        that is not a cube root of unity, passes CTRL-4 in full.
    positive_control_on_my_own_probe:
      mutation: "Perturb one element: F[4] -> F[4] + 1 mod p."
      measured_outcome: "cond(i) PASS, cond(ii) FAIL, 1 failing pair"
      purpose: >-
        Confirms my probe harness reports FAIL when a within-block ratio is
        broken, so the four PASS results above are not an artefact of my
        scaffolding. WITHOUT THIS CONTROL THE FOUR PASSES WOULD NOT BE EVIDENCE.
    what_this_is_NOT: >-
      NOT a disposition on CTRL-4. NOT a claim that any past "CTRL-4 passes"
      record was false - those records reported a true fact about a weak
      predicate. NOT evidence about phi-invariance, alpha, rank, supply or cost.
      NOT pre-registered, therefore NOT scored against any expectation. It is
      four measurements offered to the Coordinator as materially useful input to
      the retire-or-rewrite call that is the Coordinator's alone.

