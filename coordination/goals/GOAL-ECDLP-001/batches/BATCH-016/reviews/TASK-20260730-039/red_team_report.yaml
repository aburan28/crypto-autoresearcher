      for "informative", "rehabilit", "vindicat", "working control", "confirms",
      "validates", "is phi-invariant" and "general" and found ZERO hits.
    - >-
      THE SNAPSHOT COMMIT CHANGED EXACTLY THE SEVEN DECLARED PRODUCER PATHS.
      The receipt lands one commit later as INT-BATCH007-T predicts. The
      four-batch pattern of committing review artifacts one commit early did NOT
