        NOT AS A CARD - IT IS A ZERO-COMPUTE PRACTICE CHANGE and should be
        recorded as a rationale in the BATCH-016 closing decision alongside R-9,
        exactly as R-9 itself was. Dispatching it as an experiment would consume
        budget to produce a sentence.
    - id: CTRL-RT039-B
      name: "FREEZE-AND-MUTATE CTRL-4-PRIME."
      what_it_does: "Implement the clauses above and run M1-M10 with outcomes pre-stated as written here."
      should_it_be_dispatched: >-
        YES, IN A SUCCESSOR, AND NOT HERE. TASK-20260730-039 MAY NOT ENLARGE
        BATCH-016 AND DOES NOT. It should be attached to whatever successor
        contract first needs a factor-base assertion, and it should not be run
        speculatively before such a contract exists - a control with no contract
        to serve is a card with no consumer.
    - id: CTRL-RT039-C
      name: "B = 193 TAIL AUDIT across the frozen contract's cells."
      what_it_does: >-
        Enumerate every cell of every frozen contract at B not divisible by 3
        and record which factor-base indices are checked by no assertion.
      should_it_be_dispatched: >-
        NO, NOT AS A SEPARATE CARD. My D-10 already answers it for the only
        such B in play (B=193, exactly index 192), and clause (h) of the rewrite
        closes it structurally. Dispatching a card to re-measure a hole I have
        already located and named would be make-work.
    - id: CTRL-RT039-D
      name: "EXHAUSTIVE RANDOM-MUTATION SWEEP - 10^4 random single-element perturbations of F with a PASS-rate statistic."
      what_it_does: "Sample random mutations and report the fraction the checker catches."
      should_it_be_dispatched: >-
        REFUSED, AND I NAME IT AS MY REFUSAL SO THAT MY RECOMMENDATIONS ARE
        FALSIFIABLE. The answer is already a theorem: a single-element
        perturbation at index 3j+k is caught unless the new value equals
        zeta3^k*F[3j], so the catch rate is 1 - O(1/p) and the sweep would
        produce a large number that reports the size of the field and nothing
        about the control. It is exactly the class of measurement CTRL-RT034-E
        was refused for - multiplying numbers on a saturated quantity - and I
        refuse it on the same grounds. THE INFORMATIVE MUTATIONS ARE THE
        STRUCTURED ONES, AND THEY MUST BE CONSTRUCTED, NOT SAMPLED.
    - id: CTRL-RT039-E
      name: "APPROVE AND RUN EXP-STR-004 TO SEE WHETHER THE REWRITTEN CONTROL MATTERS IN PRACTICE."
      should_it_be_dispatched: >-
        REFUSED AND EXPLICITLY NOT RECOMMENDED. EXP-STR-004 IS NOT APPROVED, ITS
        NOT-APPROVED DETERMINATION AND THE QUEUE-AMEND-20260729-005 STAND-DOWN
        STAND, AND NOTHING IN THIS REVIEW SUPPORTS APPROVING IT. Recorded here
        only so that the refusal is on the record rather than inferred from
        silence (G8).

  premature_closure_check:
    in_the_over_reading_direction: >-
      LIVE RISK, AND IT IS THE MAIN ONE. The batch is at risk of being read as a
      vindication of CTRL-4. OBJ-1 and the eight missed mutations are the
      answer, and the specific sentences to refuse are enumerated above.
    in_the_premature_retirement_direction: >-
      ALSO LIVE, AND I DECLINE IT. "The checker is a constructor identity,
      therefore retire it" would discard an assertion with demonstrated non-zero
      discriminating power (D-6, D-7, D-9) on the strength of a fatigue argument
      about a search that found blind spots. Blind spots are grounds for
      widening the assertion, not for deleting it. Per
      docs/inventor-protocol.md section 4, a closure needs a named obstruction,
      an argument and forward guidance; "CTRL-4 detects nothing" is not an
      obstruction, it is a false statement, and I decline to write it.
    the_honest_middle_which_i_am_obliged_to_state_if_it_is_true: >-
      IT IS PARTLY TRUE AND I STATE IT. For the ONE job the checker was actually
      wired up to do inside the BATCH-015 probe - confirm that the builder laid
      the returned list out in aligned blocks of three - the checker is
      adequate, and cases (2), (3) and my D-6/D-9 confirm it. My objection is
      not that the six lines are buggy. THEY ARE NOT BUGGY. My objection is that
      the job they do is a strictly smaller job than the word "control" in the
      frozen contract promises, and that the gap is where a successor will
      overclaim.

