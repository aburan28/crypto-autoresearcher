      5bc95c8c, and no ledger/evidence/EV-STR-006.yaml or
      ledger/decisions/DEC-20260730-032.yaml exists in the tree.
    - >-
      I INDEPENDENTLY RE-DERIVED THE INSTANCE AND THE CASE-2 RULE. p=2293,
      n=733, zeta3=1303 with zeta3^3 mod p = 1, len(F)=192, F[0..5] =
      [1963,1094,1529,310,362,1621], the forbidden orbit of F[0] is
      [1963,1094,1529] as reported, x=1 is on the curve, is not in F and is not
      in that orbit, so chosen_x=1 with candidates_scanned=1 is correct under
      the stated rule. All 192 entries of F are distinct.

  objections:
    - id: OBJ-1
      severity: HIGH
      title: >-
        "CATCHES LAYOUT BREAKS" IS FALSE AS STATED. I CONSTRUCTED SIX MUTATIONS
        THE COMMITTED CHECKER MISSES, INCLUDING A WHOLLY FABRICATED FACTOR BASE
        WITH 114 OF 192 ENTRIES NOT ON THE CURVE, AND I RAN THEM.
      statement: >-
        Cases (2) and (3) do not establish a general layout-detection
        capability. They establish that ONE detectable class is detected:
        violation of the within-block multiplicative alignment
        F[3j+k] == zeta3^k * F[3j]. The checker refers to nothing else. It never
        touches the curve, never checks distinctness, never checks that the list
        came from this instance, and never checks block-level ordering. Any
        corruption that preserves within-block alignment passes, however
        catastrophic. This is not speculation: I ran it. See
        counterexample_or_mutation, diagnostics D-1 to D-5, D-8 and D-10.
      why_it_matters: >-
        The successor reading turns on whether CTRL-4 "detects layout breaks".
        The measured boundary is narrower than "layout": it is "within-block
        alignment". D-4 is decisive on this point because it is a permutation of
        exactly the same six elements that case (3) permutes, and the checker
        PASSES it. Two mutations of the same descriptive class, one caught and
        one missed, means the descriptive class is the wrong unit of
        generalisation.
      what_would_refute_this_objection: >-
        A showing that the derivation note's exactness needs only within-block
        alignment and needs no on-curve, distinctness, orbit-disjointness or
        provenance property from the factor base. I do not believe that showing
        can be made - the factor base is used as a set of columns indexed by
        curve points - but it is the falsifier and it is cheap to attempt by
        reading experiments/EXP-STR-004/derivation_note.md.
    - id: OBJ-2
      severity: HIGH
      title: >-
        THE TWO SCORED MUTATIONS WERE DEDUCIBLE-TO-FAIL FROM THE CHECKER SOURCE
        BEFORE THE CARD RAN. THEIR FAIL CARRIES ONE BIT, NOT A CAPABILITY.
      statement: >-
        Case (2)'s replacement rule EXPLICITLY EXCLUDES every value in
        {zeta3^t * F[0]}. Given that exclusion, "G[1] != zeta3 * G[0]" is a
        theorem about the constructed input, not a measurement, and condition
        (ii) must report FAIL by inspection of the six lines of the checker.
        Case (3) is the same up to a 1/p accident: after interleaving,
        H[1] = F[3], and H[1] == zeta3*H[0] would require the independently
        seeded F[3] to coincide with zeta3*F[0], probability about 1/2293 per
        position. Both outcomes were derivable at queue-authoring time from the
        source the queue author had in hand.
      what_the_two_cases_therefore_actually_bought: >-
        ONE GENUINE BIT, AND IT IS WORTH NAMING RATHER THAN DISMISSING: that the
        checker is not vacuously always-PASS. A checker whose inner loop never
        executed - `range(len(F)//3)` on an empty or short list, an early
        return, a `failing` list that is rebuilt and discarded, a PASS/FAIL
        polarity inversion - would have passed case (1) for the same reason it
        passed everything, and BATCH-015's finding would have had a second,
        duller explanation. That alternative is now excluded, on this instance
        at this B. THAT IS A REAL RESULT AND I DO NOT ARGUE IT AWAY. It is one
        bit and it does not scale into "is a control".
      dissent_against_my_own_objection: >-
        A tautological mutation is the CORRECT first mutation for a control that
        has never been mutated at all: you check that the instrument moves
        before asking what it is sensitive to. The queue's choice was not
        unreasonable as a first exercise. My objection is to the INFERENCE that
        would be drawn from it, not to the choice of running it.
    - id: OBJ-3
      severity: MEDIUM
      title: >-
        THE MUTATION SET WAS AUTHORED BY THE PARTY THAT AUTHORED THE
        EXPECTATIONS AND HAD READ THE CHECKER. DETERMINISATION BINDS AGAINST THE
        WRONG ATTACK.
      statement: >-
        The Coordinator determinised both mutations in the queue so that no
        outcome could be obtained by choosing an input after seeing a result.
        That is a real protection and it held: I reproduced chosen_x=1 and the
        fixed permutation exactly from the queue text alone. But it defends only
        against POST-HOC input selection. It offers no defence at all against
        PRE-HOC selection of mutations whose outcome was already deducible - the
        far likelier failure mode when one program reads the checker, picks the
        mutations, and writes the expectations. My six missed mutations are the
        direct evidence that the undetected region of mutation space was never
        sampled, and it was never sampled because nothing in the protocol
        required sampling it.
      the_structural_defect_named: >-
        A control's power is characterised by the BOUNDARY between the
        mutations it catches and those it misses. This batch reports only
        caught mutations. Reporting only positives is the same error as
        reporting a signal without its null-object control
        (docs/inventor-protocol.md section 3): the quantity that would have
        destroyed the reading - a mutation that should be caught and is not -
        was never measured.
    - id: OBJ-4
      severity: MEDIUM
      title: >-
        CASE 0 IS AN ADEQUATE NULL OBJECT FOR ONE FAILURE MODE OF THE MUTATION
        HARNESS AND NOT FOR THE MODE THAT MATTERS.
      statement: >-
        Case 0 excludes an always-FAIL harness: a mutation driver that corrupted
        its input on every path, mis-bound zeta3 for every case, or inverted the
        PASS/FAIL polarity would have shown case 0 as FAIL. It does NOT exclude
        an always-PASS-then-FAIL-correctly harness, and more importantly it does
        not exclude the mode that actually threatens this batch: a harness that
        applies its mutations correctly but whose mutations are drawn only from
        the detectable region. A broken mutation harness that still passes case
        0 looks exactly like this one would if, say, build_case_input() silently
        returned the mutated list for cases 2 and 3 and the UNMUTATED list for
        case 1 - case 0 would pass, cases 2 and 3 would fail, case 1 would pass,
        and the reported pattern would be IDENTICAL to the observed one.
      is_that_mode_actually_present: >-
        NO, AND I CHECKED RATHER THAN ASSUMING. I read build_case_input() and I
        independently re-derived case 1 in my own session: building F with z=5
        and checking with z=5 does yield JOINT=PASS, and the underlying reason
        (the builder constructs orbits under whatever z it is handed, so the
        checker re-verifies the constructor's own arithmetic) is visible in
        harness/endomorphism_la.py lines 96-113. The mode is absent. The point
        stands that case 0 could not have told us so.
      required_repair: >-
        The adequate null object for a MUTATION harness is a POSITIVE CONTROL on
        the mutation channel: a mutation that is known-detectable by an argument
        independent of the checker under test, plus a mutation that is known-
        UNdetectable and must PASS, both pre-stated. My D-6 (within-block
        reversal, must FAIL, 128 failing pairs) and D-4 (whole-block swap, must
        PASS, and harmless) are that pair and cost microseconds.
    - id: OBJ-5
      severity: MEDIUM
      title: >-
        CONDITION (i) IS NOT DEAD CODE. THE CLAIM "DEAD, FULL STOP" WOULD BE
        FALSE AND MUST NOT BE WRITTEN. IT IS DEAD AGAINST THIS BATCH'S MUTATION
        CLASS, WHICH IS A DIFFERENT AND NARROWER STATEMENT.
      statement: >-
        All five reported cases show condition (i) PASS because all five inputs
        preserve length by construction - the queue designed them that way. I
        fired condition (i) on my first attempt: D-7 truncates F to 189 elements
        and yields cond(i)=FAIL with cond(ii)=PASS. So the code path is live,
        the comparison is real, and it discriminates.
      the_correct_narrow_verdict: >-
        Condition (i) is a length check that (a) no reachable path of the
        as-committed builder can fail at B = 192 on CURVE-J12S1, because
        _build_phi_invariant_factor_base fills xs until len(xs) >= B and then
        returns xs[:B], so the only failure mode is exhausting the 50*B+1000
        seed budget, against which BATCH-015 measured a 76x margin; and (b) no
        mutation in this batch's set was constructed to violate. It retains
        power against length-changing corruption and against supply exhaustion
        at larger B or on a poorer instance. It is a CONSTRUCTOR IDENTITY IN
        PRACTICE AT THESE PARAMETERS, exactly as BATCH-015 found, and that
        finding is neither weakened nor extended to "dead, full stop" by this
        batch.
      a_real_gap_condition_i_hides: >-
        At B = 193, which is a cell of the frozen EXP-STR-004 contract and which
        the BATCH-015 probe actually ran, len(F) = 193 passes condition (i)
        while index 192 lies in no complete block and is checked by NOTHING. I
        ran this (D-10): replacing F[192] with an unrelated on-curve x, and even
        setting F[192] = 0, both give JOINT=PASS. The checker's own
        tail_indices_not_in_a_complete_block field records the hole; nothing
        acts on it.
    - id: OBJ-6
      severity: LOW
      title: >-
        A COST THAT A REWRITE MUST CHARGE AND THAT NOTHING IN THIS BATCH HAS
        COSTED.
      statement: >-
        The on-curve clause I recommend below costs B calls to E.lift_x per
        cell, i.e. B modular square-root computations. That is the same order as
        building the factor base itself. Per KN-LIT-7593, an invariant's own
        cost must be charged before it is called free: at B = 192 on a 12-bit
        prime it is microseconds and irrelevant, but the frozen contract's
        timing windows are the object of RT-CM-1 to RT-CM-6, and a control
        added inside a timed window perturbs the quantity being timed. The
        rewrite must place the on-curve and orbit-disjointness clauses OUTSIDE
        every window whose wall_seconds the contract reports, and say so.

  counterexample_or_mutation:
    label: >-
      RED-TEAM DIAGNOSTIC. NOT A BATCH MEASUREMENT, NOT EVIDENCE, NOT A RESULT
      OF BATCH-016, AND NOT A RUN. No run identifier is minted, nothing is
      written under experiments/, harness/ is unmodified and unmonkeypatched,
      and the mutations are applied ONLY to lists returned by the committed
      builder.
    method: >-
      A scratchpad script imported harness.endomorphism_la and loaded the
      COMMITTED mutation_driver.py by file path (its main() is under an
      __main__ guard, so import executes module level only), then called its
      byte-verbatim ctrl4_checker_copied_verbatim on mutated inputs. The
      checker under test is therefore literally the committed CTRL-4 text, not
      a reimplementation. I re-ran verify_verbatim_copy() in my own session and
      obtained byte_identical=True.
    script_path_not_in_the_repository: >-
      /private/tmp/claude-501/-Volumes-SSD990-crypto-autoresearcher--claude-worktrees-run-harness-boi-060771/e6be2d6e-7396-4b4c-b287-44e8a4b9dac9/scratchpad/rt039_diagnostic.py
      and .../scratchpad/rt039_d10.py. DELIBERATELY OUTSIDE THE REPOSITORY: my
      write scope is the review directory and a diagnostic is not an artifact of
      this batch.
    instance: CURVE-J12S1, p=2293, n=733, zeta3=1303, B=192 unless stated.
    results:
      - id: D-0
        mutation: none (baseline on my own harness)
        cond_i: PASS
        cond_ii: PASS
        joint: PASS
        expected: PASS
      - id: D-1
        mutation: >-
          Block j=0 replaced by the full orbit [y, zeta3*y, zeta3^2*y] of
          y = 4, which is NOT on the curve (E.lift_x(4) is None). Within-block
          alignment is perfect; three of the 192 entries are not
          x-coordinates of any point of E.
        cond_i: PASS
        cond_ii: PASS
        joint: PASS
        expected: PASS
        verdict: MISSED BY THE CHECKER
      - id: D-2
        mutation: >-
          ALL 64 blocks replaced by orbits of a deterministic integer
          recurrence. The resulting list is a perfectly phi-aligned factor base
          that has nothing to do with the curve: only 78 of its 192 entries lie
          on E, so 114 entries are not x-coordinates of any point.
        cond_i: PASS
        cond_ii: PASS
        joint: PASS
        expected: PASS
        verdict: >-
          MISSED BY THE CHECKER. THIS IS THE STRONGEST SINGLE OBSERVATION IN
          THIS REVIEW. CTRL-4 reports PASS on a factor base that is 59 percent
          non-points.
      - id: D-3
        mutation: >-
          Block j=1 overwritten with a copy of block j=0. The factor base has
          189 distinct entries out of 192; three columns are duplicated.
        cond_i: PASS
        cond_ii: PASS
        joint: PASS
        expected: PASS
        verdict: MISSED BY THE CHECKER
      - id: D-4
        mutation: >-
          Blocks j=0 and j=1 swapped WHOLE. A permutation of F touching the
          SAME SIX INDICES that case (3) touches, verified to be a permutation
          (sorted(G) == sorted(F)) differing from F at 6 indices.
        cond_i: PASS
        cond_ii: PASS
        joint: PASS
        expected: PASS
        verdict: >-
          MISSED BY THE CHECKER, AND CORRECTLY SO - a whole-block swap does not
          break the block-circulant phi-shift, so this is a DEMARCATION, not a
          defect. Its value is that it and case (3) are the same descriptive
          class with opposite outcomes, which is what refutes OBJ-1's target
          reading.
      - id: D-5
        mutation: "Block j=0 set to [0, 0, 0]."
        cond_i: PASS
        cond_ii: PASS
        joint: PASS
        expected: PASS
        verdict: >-
          MISSED BY THE CHECKER. 0 == zeta3^k * 0 for every k, so a degenerate
          zero block satisfies condition (ii) identically. The committed builder
          explicitly rejects orbits with fewer than 3 distinct members; the
          checker does not.
      - id: D-6
        mutation: >-
          Positions k=1 and k=2 swapped inside EVERY block (a global within-
          block reversal).
        cond_i: PASS
        cond_ii: FAIL
        joint: FAIL
        expected: FAIL
        failing_pair_count_is_a_count: 128
        verdict: >-
          CAUGHT. This is the POSITIVE CONTROL the batch lacks: a mutation
          known-detectable by an argument independent of the checker.
      - id: D-7
        mutation: "F truncated to its first 189 elements (one complete block dropped)."
        cond_i: FAIL
        cond_ii: PASS
        joint: FAIL
        expected: FAIL via condition (i)
        verdict: >-
          CAUGHT, AND IT IS THE ONLY CASE IN THIS ENTIRE BATCH OR REVIEW IN
          WHICH CONDITION (i) HAS EVER FIRED. It settles OBJ-5.
      - id: D-8
        mutation: >-
          F truncated to 189 and refilled with one fresh valid orbit of a
          foreign leader. Length restored, alignment intact, contents changed.
        cond_i: PASS
        cond_ii: PASS
        joint: PASS
        expected: PASS
        verdict: >-
          MISSED. Shows condition (i) is trivially evaded by any corruption that
          restores length.
      - id: D-9
        mutation: "G[1] := zeta3^2 * F[0] mod p (an in-orbit element at the wrong power)."
        cond_i: PASS
        cond_ii: FAIL
        joint: FAIL
        expected: FAIL
        failing_pair_count_is_a_count: 1
        verdict: >-
          CAUGHT. Recorded because it retires a suspicion I held about case
          (2)'s rule: the rule's exclusion of the orbit {zeta3^t F[0]} does NOT
          hide a passing mutation, since the in-orbit wrong-power swap fails
          too. The case-2 rule is not rigged in that respect and I say so.
      - id: D-10
        mutation: >-
          AT B = 193, A CONTRACT CELL, NOT B = 192. Baseline passes. Then
          F[192] - the tail element, which lies in no complete block - replaced
          by the unrelated on-curve x = 1 (D-10b), and separately set to 0
          (D-10c).
        cond_i: PASS
        cond_ii: PASS
        joint: PASS
        expected: PASS
        verdict: >-
          BOTH MISSED. At B = 193 exactly one factor-base element is checked by
          nothing at all, and CTRL-4 passes with it set to a non-point.
          Explicitly labelled as a diagnostic at a parameter OUTSIDE BATCH-016's
          B = 192 scope; it is not offered as a BATCH-016 measurement.
      - id: D-11
        mutation: "Foreign-instance factor base (provenance)."
        outcome: >-
          NOT RUN AS DESIGNED AND SAID SO RATHER THAN QUIETLY DROPPED. Seed 2
          yields p = 2953, a different prime, so the checker's own p would
          differ and the comparison would be ill-posed. The provenance gap is
          demonstrated instead by D-2. I did not weaken the rule to force a
          number.
    summary_of_the_diagnostic: >-
      SIX OF ELEVEN CONSTRUCTED MUTATIONS ARE MISSED BY THE COMMITTED CHECKER
      (D-1, D-2, D-3, D-4, D-5, D-8), PLUS TWO MORE AT B = 193 (D-10b, D-10c).
      THREE ARE CAUGHT (D-6, D-7, D-9). One was not run and is reported as not
      run. Of the missed ones, D-4 is a correct non-detection, and D-1, D-2,
      D-3, D-5, D-8, D-10b and D-10c are corruptions that break properties the
      factor base must have for the derivation note's exactness to mean
      anything.
    scope_of_the_diagnostic: >-
      One instance, one checker, one commit, B = 192 (and B = 193 for D-10),
      one host, one realisation each, deterministic throughout. It supports NO
      statement about phi-invariance, about alpha, about H-STR-002, about
      B != 192/193, about j != 0 curves, or about any cost. IT IS A STATEMENT
      ABOUT WHAT SIX LINES OF PYTHON DO AND NOTHING ELSE.

  claim_ceiling_audit:
    method: >-
      Item by item against the queue's claim_ceiling and
      may_not_conclude_under_any_outcome list, read against all seven committed
      artifacts at 1454d2be, plus a grep for the specific phrasings.
    findings:
      - item: "N-1 H-STR-002 mechanism"
        breached: false
        evidence: >-
          No artifact mentions H-STR-002 except to disclaim; ledger/hypotheses
          is untouched by the snapshot commit, whose diff is exactly the seven
          declared producer paths.
      - item: "N-2 case (1) not a new result"
        breached: false
        evidence: >-
          mutation_manifest.json field case_1_pre_stated_status states verbatim
          that the outcome is pre-stated and that its reproduction is not
          recorded as a new result, a discovery, a replication or evidence about
          phi-invariance. stdout.log line 30 lists case 1 only as a contributing
          case to the pre-registered consequence, which is the mechanically
          correct use. NO BREACH. I checked this specifically because the card
          pre-registers it as prohibited.
      - item: "case 0 not a result"
        breached: false
        evidence: >-
          case_0_status is phrased as a harness sanity gate; stdout.log lines 13
          and 21 both label it "instrument sanity check, not a result".
      - item: "N-3 phi-invariance in either direction"
        breached: false
      - item: "N-4 supply count, cost, alpha, rank, misalignment, diagnosticity"
        breached: false
        evidence: >-
          forbidden_computations_assertion enumerates each with an explicit
          false, and the driver contains no call to _measure_displacement_rank,
          _collect_relations or _build_random_factor_base.
      - item: "N-5 model/hardware independence"
        breached: false
        evidence: "inference.model_independence_claimed: false; fallback_used: true."
      - item: "N-6 reject_scoped"
        breached: false
      - item: "N-7 DEFER-BATCH009-001 / EXP-STR-004 / stand-down"
        breached: false
      - item: "no RUN-* identifier, no experiments/ write, empty run_ids"
        breached: false
        evidence: "run_ids empty with run_ids_reason; certificate.kind none with a reason."
      - item: "no statement that the ledger validates"
        breached: false
    verdict: >-
      NO CLAIM-CEILING BREACH IS PRESENT IN ANY COMMITTED BATCH-016 ARTIFACT AT
      1454d2be. THE EXECUTOR CARD IS CLEAN ON THIS AXIS AND I SAY SO PLAINLY
      RATHER THAN MANUFACTURING AN OBJECTION.
    the_breach_risk_is_downstream_and_these_are_the_exact_sentences_to_refuse:
      - >-
        "CTRL-4 detects layout breaks and is blind only to zeta3." FALSE AS
        STATED - refuted by D-1, D-2, D-3, D-5, D-8, D-10b, D-10c. FLAG BLOCKING
        if written.
      - >-
        "The mutation test shows CTRL-4 is a working control." BLOCKING. It
        shows the checker is not always-PASS on this instance at this B.
      - >-
        "Cases 2 and 3 confirm the factor base is phi-invariant / that CTRL-4 is
        informative about phi-invariance." BLOCKING under N-3 and under the
        queue's own what_a_FAIL_on_cases_2_and_3_does_NOT_license.
      - >-
        "Case 1 reproduced the BATCH-015 finding" or "BATCH-016 replicated the
        bogus-zeta3 pass." BLOCKING under N-2. The permitted sentence is that
        case (1) was executed with a pre-stated outcome so that all cases passed
        through one checker in one package.
      - >-
        "The baseline passed, confirming the factor base is well-formed."
        BLOCKING - case 0 is an instrument gate, not evidence about F.
      - >-
        "Condition (i) is dead." FALSE - see D-7. The permitted sentence names
        the constructor and the parameters.
      - >-
        "R-9 has been discharged" or "the mutation-test mitigation is now in
        force and the independence limitation is mitigated." BLOCKING - the
        queue itself says an exercise is not a repair, and OBJ-3 shows the
        exercise did not reach the failure mode R-9 exists to cover.
      - >-
        Any sentence attaching a number - alpha, rank, cost, supply, crossover -
        to anything in BATCH-016. Nothing numeric was computed except PASS/FAIL
        booleans, four failing-pair identities and one scan count.

  process_assessment_R9_and_determinisation:
    did_the_R9_mutation_test_substitute_for_model_independence:
      answer: PARTIALLY, AT THE EXECUTION LAYER ONLY, AND NOT AT THE LAYER THAT MATTERS MOST.
      argument: >-
        R-9's premise is that mutation evidence is model-independent in a way
        that cross-reading is not. That premise is CORRECT FOR EXECUTION: the
        arithmetic mod 2293 does not care which model wrote the driver, and the
        byte-verbatim constraint plus the determinism repeat make the execution
        layer genuinely mechanical. I re-executed it and got the same answer, so
        the mechanical part is real and I credit it. BUT A MUTATION TEST HAS TWO
        LAYERS, AND ONLY ONE OF THEM WAS MECHANISED. The SELECTION of mutations
        is a modelling act, and here one program - with the checker source in
        front of it - chose the mutations, wrote the expectations, wrote the
        prohibitions and wrote the reading that the outcomes would license. The
        correlated blind spot R-9 exists to defend against therefore survived
        intact at the selection layer, and the proof that it survived is that a
        single adversarial session found six missed mutations in about ten
        minutes, one of which passes a factor base that is 59 percent
        non-points. R-9 IS A REAL MITIGATION THAT WAS APPLIED TO THE WRONG HALF
        OF THE PROBLEM.
      what_would_make_R9_bind: >-
        A MUTATION-COMPLETENESS RULE: the mutation set for an assertion-style
        control must contain (a) at least one mutation per property the control
        is claimed to protect, enumerated from the control's own text; (b) at
        least one mutation pre-stated to PASS, so the boundary of the control's
        power is recorded rather than assumed; and (c) at least one mutation
        authored by a session that did not author the queue or the assertion.
        (c) is available on this harness TODAY at zero model diversity - it is
        exactly what this card just did - and it is the cheapest of the three.
    did_determinisation_bind:
      answer: YES AGAINST POST-HOC SELECTION, NO AGAINST PRE-HOC SELECTION.
      argument: >-
        I reproduced chosen_x = 1, candidates_scanned = 1, the forbidden orbit
        [1094, 1529, 1963] and the fixed interleaving from the QUEUE TEXT ALONE
        and got identical values, so the executor could not have obtained its
        outcome by choosing an input after seeing a result. That protection is
        real and it held. It is however orthogonal to OBJ-2: fixing an input in
        advance does not make its outcome informative if the outcome was
        derivable from the checker source in advance, and the same program held
        both. Determinisation converts "could have been fished" into "was fixed
        in advance"; it does not convert "deducible" into "measured".

  baseline_comparison:
    axes_checked: [time, memory, data/queries]
    dominated_by: >-
      INAPPLICABLE, AND THIS IS NOT AN UNCHECKED NULL. BATCH-016 PRODUCES NO
      (time, memory, data) POINT FOR ANY ALGORITHM. It computes no relation, no
      closure, no rank, no solve and no cost quantity; it evaluates PASS/FAIL
      booleans of an assertion over lists of field elements. There is therefore
      no point to place on any Pareto frontier and nothing that could dominate
      it. Writing dominated_by: null here would suggest an undominated
      algorithmic point exists, which would be a fabrication under AGENTS rule
      5, so the field is filled with this sentence instead.
    sota_delta: >-
      ZERO ON EVERY AXIS, QUANTITATIVELY. The standing baselines for the ECDLP
      instance this batch touches (CURVE-J12S1, group order n = 733) are
      Pollard rho at an expected sqrt(pi*n/4) = 24.0 group operations with O(1)
      memory; BSGS at 2*sqrt(n) = 54 operations with sqrt(n) = 27 stored
      entries; and exhaustive search at 733 operations. The closest specialised
      baseline is Gaudry/Semaev-style index calculus over this same factor base,
      which this batch also does not run - not one relation was collected. Time
      delta 0, memory delta 0, data delta 0 against all four. The batch is not
      an attack and does not attempt to be one; the queue's own claim_ceiling
      says so under RULE A1's building-block clause, and I concur with that
      self-assessment.
    against_the_target_result_profile: >-
      NOT TARGET-CLASS, AND NOT CLOSE. docs/target-result-profile.md asks for
      mechanisms that move an asymptotic exponent on a central hard problem
      under explicit numbered heuristics, validated at cryptographic scale. This
      batch measures six lines of Python on a 12-bit prime. It is admissible
      only as instrument hygiene, and its value is entirely instrumental:
      without it, every past and future "CTRL-4 PASSES" is uninterpretable.

  recommended_disposition_of_CTRL_4:
    recommendation: REWRITE, NOT RETIRE - BUT WITH A DEMOTION THAT IS PART OF THE RECOMMENDATION AND NOT A GLOSS.
    the_argument: >-
      RETIRE is wrong because the checker is demonstrably not inert: D-6, D-7
      and D-9, together with the batch's own cases (2) and (3), show it
      discriminates within-block misalignment and length. An assertion with
      non-zero power against a future refactor is worth about ten lines to keep.
      RETAIN-AS-IS is wrong because the pre-registered consequence has already
      fired on the BATCH-015 record and because condition (ii) is blind to
      on-curve membership, distinctness, orbit disjointness, provenance and the
      B = 193 tail. So REWRITE. The demotion is the load-bearing half: the
      rewritten assertion must be labelled an INPUT-INTEGRITY REGRESSION
      ASSERTION, not a control, and no record may cite it as evidence about
      phi-invariance, because clause (e) below remains a constructor identity no
      matter how many clauses surround it.
    the_rewritten_assertion_stated_precisely_enough_to_freeze:
      name: "CTRL-4-PRIME - FACTOR-BASE INPUT-INTEGRITY ASSERTION (not a control)"
      preconditions: "B mod 3 == 0. If B mod 3 != 0 the assertion reports NOT_APPLICABLE and the cell is not run under it; see clause (h)."
      clauses:
        - "(a) pow(zeta3, 3, p) == 1 AND zeta3 != 1 AND zeta3 != 0. THE AXIS THE OLD ASSERTION MISSED ENTIRELY."
        - "(b) len(F) == B."
        - "(c) len(set(F)) == B. Distinctness."
        - "(d) E.lift_x(x) is not None for every x in F. On-curve membership."
        - "(e) For every 0 <= j < B//3 and k in {1,2}: F[3j+k] == pow(zeta3,k,p)*F[3j] % p, and F[3j] != 0. LABELLED IN THE CONTRACT TEXT AS A CONSTRUCTOR IDENTITY THAT VERIFIES THE BUILDER'S OWN ARITHMETIC AND NOTHING ABOUT THE MATHEMATICS."
        - "(f) The B//3 orbit leaders are pairwise orbit-disjoint: for j != j', F[3j'] not in {F[3j], zeta3*F[3j], zeta3^2*F[3j]}. Computable in O(B) with one set."
        - "(g) PROVENANCE: record sha256 of (p, a, b, derived_seed, B, zeta3) beside factor_base_sha256, and assert that rebuilding F from the recorded instance reproduces F byte-identically."
        - "(h) TAIL: if B mod 3 != 0, every index in [3*(B//3), B) is asserted to satisfy (c), (d) and (g) even though (e) cannot apply, and the assertion records the tail indices explicitly rather than silently skipping them."
      reporting_rule: "Every clause reports PASS/FAIL SEPARATELY with its own failing set reported as a NAMED SET and never as a count alone (PRED-ID-STR). The joint verdict is reported beside them."
      cost_placement: "Clauses (d), (f) and (g) execute OUTSIDE every window whose wall_seconds the contract reports (OBJ-6)."
    pre_stated_mutation_test_the_rewrite_must_pass_before_it_is_frozen:
      must_FAIL_with_the_named_clause_firing:
        - "M1 zeta3 := 5 (pow(5,3,2293)=125 != 1) -> clause (a) FAIL. The old assertion PASSED this."
        - "M2 G[1] := first on-curve x not in F and not in the orbit of F[0] -> clause (e) FAIL at (j,k)=(0,1). [reproduces case 2]"
        - "M3 blocks 0 and 1 interleaved to [F0,F3,F1,F4,F2,F5] -> clause (e) FAIL at (0,1),(0,2),(1,1),(1,2). [reproduces case 3]"
        - "M4 block 0 := orbit of y = 4, which is off-curve -> clause (d) FAIL on 3 named entries. [my D-1; the old assertion PASSES this]"
        - "M5 block 1 := copy of block 0 -> clauses (c) and (f) FAIL. [my D-3; the old assertion PASSES this]"
        - "M6 block 0 := [0,0,0] -> clauses (c) and (e)'s F[3j] != 0 FAIL. [my D-5; the old assertion PASSES this]"
        - "M7 F := 64 orbits of a deterministic integer recurrence, length and alignment intact -> clauses (d) and (g) FAIL. [my D-2; the old assertion PASSES this on a 59-percent-non-point list]"
        - "M8 F truncated to 189 -> clause (b) FAIL. [my D-7]"
        - "M9 at B = 193, F[192] := 0 -> clauses (d) and (h) FAIL. [my D-10c; the old assertion PASSES this]"
      must_PASS_and_this_row_is_mandatory:
        - >-
          M10 blocks 0 and 1 swapped WHOLE -> ALL CLAUSES PASS, PRE-STATED, with
          the recorded reason that a whole-block permutation does not break the
          block-circulant phi-shift. [my D-4] A MUTATION SET WITH NO
          PRE-STATED-PASS ROW DOCUMENTS NO BOUNDARY AND IS THE DEFECT OBJ-3
          NAMES.
      authorship_rule: "At least M4 through M7 and M10 must be re-derived by a session that did not author the successor contract."
    what_would_falsify_my_own_recommendation:
      - >-
        F-RT1: A showing from experiments/EXP-STR-004/derivation_note.md that
        the exactness argument needs ONLY within-block alignment and needs no
        on-curve, distinctness, orbit-disjointness or provenance property. Then
        clauses (c),(d),(f),(g) protect nothing, REWRITE collapses to
        relabelling, and RETIRE becomes the correct disposition. THIS IS THE
        CHEAPEST FALSIFIER AND IT IS A READING TASK COSTING NO COMPUTE.
      - >-
        F-RT2: A showing that clauses (c),(d),(f),(g) are themselves constructor
        identities on every REACHABLE call path of the frozen contract - i.e.
        that no code path can hand the checker a factor base violating them.
        The committed builder does enforce distinctness and on-curve membership
        internally, so this falsifier is LIVE and I flag it against myself: my
        mutations reach a state the current single call path cannot reach. My
        counter is that a control exists to catch a FUTURE bug, not the current
        constructor, and that a control which can only ever restate its
        constructor is precisely what BATCH-015 condemned. But if the
        Coordinator judges that a control must be justified against reachable
        states only, RETIRE follows and I would not contest it.
      - >-
        F-RT3: If clause (d)'s B lift_x calls measurably perturb any timing the
        contract reports and cannot be moved outside the timed window, clause
        (d) must be dropped or sampled, and if dropped the rewrite loses most of
        its added power.

  required_controls_for_successors:
    - id: CTRL-RT039-A
      name: "MUTATION-COMPLETENESS RULE for assertion-style controls (an amendment to R-9, not a card)."
      what_it_does: >-
        Require every mutation set to enumerate one mutation per property the
        control's own text claims to protect, to include at least one
        pre-stated-PASS row documenting the boundary, and to have at least one
        row authored by a session that did not author the assertion or the
        queue.
