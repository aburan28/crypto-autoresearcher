  open_decision: DEC-20260803-003
  prior_design_pass:
    - RT-20260803-013
    - DEC-20260803-002
    - EV-IT-007
  snapshot_commit: e7d14020ca711729e76bbf420d4ec24184a4a7a0
  independent_session: true
  claim_ceiling: toy
  official_research_state_changed: false
  inference:
    requested_policy: review-adversarial
    reasoning_effort: xhigh
    independent_session_required: true
    note: >-
      Independent validator session over Coordinator snapshot e7d14020c.
      Observations only; no hypothesis status change; no crypto-scale claim.

  verdict: COMPLETED_VALID_SCOPED
  verdict_note: >-
    The frozen RC-45 smoke command executed and produced a mechanically
    completed_valid toy package (exact command match, yaml.safe_load of
    PA-IT-001-v3-rc45-repair-5 succeeds, recompute_null_plant_from_ledger.py
    present, c_smart=8 and c_special_formula_id=C_special_smart recorded,
    planted_path_recovered=true, plant_detected=true, declared run artifacts
    present and hash-bound in snapshot e7d14020c). BATCH-030-style honesty
    still applies: transfer-gate interpretation is VOID because the executed
    planted control is an embedding-degree-1 MOV plant (anomalous_trace_eq_1=
    false; control_id=CTRL-PLANTED-PATH-POS; no anomalous_trace1_certificate.json),
    C_special=22 follows ceil(k*log2(p)) rather than C_special_smart=
    ceil(8*log2(.)) despite the Smart formula_id label, CTRL-NULL edge_ledger
    is empty, and null_packaging_gate_rejected_synthetic is absent. Density
    bits=24 stop_reason=resource_exhaustion is infrastructure, not a
    mathematical negative. Admissible only as a toy-tier scoped smoke /
    density package under claim_ceiling=toy.

  transfer_gate_interpretation: void
  narrowest_supported_statement: >-
    Under PA-IT-001-v3-rc45-repair-5 smoke (seed 2026080304), the bounded toy
    harness completed with validity_status=completed_valid. Recorded density
    upper bounds are rho_special=0.0 at bits 20 (exhaustive), 24
    (exhaustive_partial, resource_exhaustion — not a math negative), and 28
    (50k sample_estimate). Unplanted RATE-ISO-1 fails (fraction
    2/21≈0.0952 of censorship lower bounds with R_xfer>=1; n_unplanted
    R_xfer<0.7 with cert = 0). No admissible anomalous Smart transfer-gate
    measurement, no sub-rho claim, no H-IT-001 status change, no crypto-scale
    validation.

  checks:
    - id: CHK-CMD
      check: Exact frozen RC-45 smoke command used (command.txt vs amendment future_executor_commands.smoke)
      result: PASS
      evidence: >-
        command.txt and manifest.command equal the whitespace-normalized
        frozen smoke string: sage experiments/EXP-IT-001/implementation/
        run_bounded_toy.py --amendment experiments/EXP-IT-001/amendments/
        PA-IT-001-v3-rc45-repair-5.yaml --run-id RUN-IT-001-rc45-smoke
        --mode smoke --seed 2026080304. sha256(command.txt)=
        ce7613ebd00b63c2cdbfe754534765ee54e08a11cc98420d2ce6d803ee0e236c
        matches snapshot receipt.

    - id: CHK-YAML
      check: yaml.safe_load of PA-IT-001-v3-rc45-repair-5 succeeds (R5-FIX-Y1)
      result: PASS
      evidence: >-
        sage -python yaml.safe_load on experiments/EXP-IT-001/amendments/
        PA-IT-001-v3-rc45-repair-5.yaml returns protocol_amendment.id=
        PA-IT-001-v3-rc45-repair-5 with no ScannerError.

    - id: CHK-RECOMPUTE-SCRIPT
      check: recompute_null_plant_from_ledger.py present (R5-FIX-M2)
      result: PASS
      evidence: >-
        Blob present at snapshot e7d14020c and at proposal snapshot
        16f7b7bf8 (amend freeze); also listed in implementation_archive_manifest.
        Path: experiments/EXP-IT-001/implementation/recompute_null_plant_from_ledger.py.

    - id: CHK-CSMART-LABEL
      check: c_smart=8 / c_special_formula_id=C_special_smart recorded
      result: PASS
      evidence: >-
        transfer_gate_report.json records c_smart=8, c_special_formula_id=
        C_special_smart, anomalous_plant_bits=20, matched_rho_formula_id=
        ceil_0_886_sqrt_Nstar, amendment_id=PA-IT-001-v3-rc45-repair-5.
        Note: label PASS does not imply the planted arm used Smart anomalous
        accounting — see CHK-XFER-VOID / BF-1.

    - id: CHK-PLANTED-FLAGS
      check: planted_path_recovered and plant_detected recorded true
      result: PASS
      evidence: >-
        manifest.result, summary.json, raw-result planted_path_control, and
        null CTRL_NULL_IT_PLANT all record planted_path_recovered=true and
        plant_detected=true. Independent R_xfer recompute on planted best
        path: (9+22+40)/641.6089988053473 = 0.11065929582066247 matches
        reported R_xfer bit-exactly. Null-plant arithmetic floor(277/4)=69
        matches C_path_reported.

    - id: CHK-ARTIFACTS
      check: Artifact completeness vs manifest / declared snapshot paths
      result: PASS
      evidence: >-
        All 13 manifest.artifact_paths exist in snapshot tree e7d14020c.
        Snapshot receipt declared_paths (15) sha256-verified against git show
        blobs with 0 mismatches (self-receipt hash null by design). Core run
        package (manifest, raw-result, command, environment, stdout, stderr)
        and results/{summary,HEUR*,transfer_gate,concrete_cost,null_*} are
        present. Non-blocking: manifest still points at the BATCH-030
        TASK-20260801-143 execution_report (RUN-IT-001-rerun content) while
        the RC-45 execution_report lives at BATCH-046/tasks/TASK-20260803-019/.

    - id: CHK-VALIDITY
      check: validity_status and transfer-gate interpretation admissibility
      result: PASS_SCOPED
      evidence: >-
        validity_status=completed_valid with reason "bounded toy package
        produced under v3 contract" is consistent across manifest.result,
        summary.json, and execution_report. Transfer-gate interpretation is
        VOID (see BF-1..BF-3): completed_valid describes the smoke package
        mechanics, not an admissible anomalous Smart / sub-rho measurement.

    - id: CHK-RESOURCE-STOP
      check: Timeouts/resource stops are not mathematical negatives
      result: PASS
      evidence: >-
        Density bits=24 stop_reason=resource_exhaustion with estimator=
        exhaustive_partial (scanned_j=3881563 of cardinality 266849 universe
        under p=33554467). Per AGENTS rule 5 / amendment unexpected_observation
        policy, this is infrastructure exhaustion, not evidence against a
        density or transfer hypothesis. bits=20 exhaustive and bits=28
        sample_estimate completed without resource stop.

    - id: CHK-PARETO
      check: dominated_by / sota_delta honesty for toy non-solver scope
      result: FAIL
      evidence: >-
        Amendment design correctly records dominated_by (Pollard rho) and
        sota_delta axes as not_applicable with non_solver_scope. Run
        deliverables summary.json, concrete_cost_table.json,
        HEUR_ISO_1_report.json, and transfer_gate_report.json omit both
        fields entirely (R5-FIX-PRESERVE-PARETO acceptance unmet on run
        artifacts). For this smoke non-solver scope the honest values are
        dominated_by=Pollard rho and sota_delta axes=not_applicable — absence
        is a honesty gap, not a license to imply a frontier advance.

    - id: CHK-XFER-VOID
      check: Transfer-gate controls under frozen RC-45 anomalous arm
      result: FAIL
      evidence: >-
        RC-45 requires CTRL-ANOMALOUS-TRACE1 at bits=20 with
        anomalous_trace1_certificate.json verified:true and C_special=
        ceil(8*log2(p)). Executed planted_path_control has control_id=
        CTRL-PLANTED-PATH-POS, plant_field_source=bits_window_mov_search,
        start_det.anomalous_trace_eq_1=false, families=
        [embedding_degree_leq_threshold], C_special.value=22
        (ceil(1*k*log2(p)) MOV), and no anomalous_trace1_certificate.json
        in the snapshot. Certificate note discloses toy pullback = direct
        solve with no isogeny evaluation. Null arm: edge_ledger=[] and
        null_packaging_gate_rejected_synthetic absent; R_null=null on all
        21 cells (null gate skipped).

  blocking_findings:
    - id: BF-1
      severity: critical
      finding: >-
        Transfer-gate interpretation VOID: planted positive control is not an
        anomalous Smart plant. anomalous_trace_eq_1=false; missing
        anomalous_trace1_certificate.json; control_id remains
        CTRL-PLANTED-PATH-POS with plant_field_source=bits_window_mov_search.
        RC-45 R5-FIX-PRESERVE-B1/B2 acceptance for CTRL-ANOMALOUS-TRACE1 is
        not met. Same defect class as BATCH-030 D-1/D-2 under a new label.
      consequence: >-
        completed_valid smoke package must not be read as an admissible
        transfer-gate or sub-rho measurement.

    - id: BF-2
      severity: critical
      finding: >-
        Formula/id mismatch on the planted arm: reports record
        c_special_formula_id=C_special_smart and c_smart=8, but the planted
        best path charges C_special=22 for family embedding_degree_leq_threshold
        (MOV ceil(k*log2(p)) at the plant field). True C_special_smart at
        N_star=524413 would be ceil(8*log2(524413))=153 (R_xfer≈0.315 still
        <0.7 on constants alone, but that is not what was charged). Using a
        MOV charge under a Smart formula_id is contract-invalid for the
        anomalous/transfer pass threshold under RC-45
        forbidden_as_anomalous_pass_threshold / limb_binding.
      consequence: >-
        Labeled C_special_smart recording is not evidence that Smart
        anomalous accounting was applied.

    - id: BF-3
      severity: major
      finding: >-
        Null-plant independence unmet: CTRL_NULL_IT_PLANT.edge_ledger=[]
        (empty); ctrl_null_it_plant_edge_ledger.jsonl absent from snapshot;
        null_packaging_gate_rejected_synthetic not present in
        null_it_isogeny_transfer_report.json; null gate skipped on all 21
        unplanted cells (R_null=null). plant_detected=true rests on packaging
        arithmetic over a search counter (C_path_honest=277 echoed as
        C_path_recomputed), not a Validator-independent ledger recompute via
        the archived recompute_null_plant_from_ledger.py.
      consequence: >-
        Null-object control does not discriminate a real sub-rho signal from
        a packaging artifact (inventor-protocol §3).

  non_blocking_findings:
    - id: NBF-1
      severity: minor
      finding: >-
        Density bits=24 stopped with resource_exhaustion
        (exhaustive_partial). Must not be treated as a mathematical negative
        on rho_special or HEUR-ISO-1.

    - id: NBF-2
      severity: minor
      finding: >-
        Manifest provenance drift: batch_id=BATCH-030, task_id=
        TASK-20260801-143, and artifact_paths entry pointing at the old
        BATCH-030 RUN-IT-001-rerun execution_report.yaml, while the RC-45
        smoke execution_report is archived under BATCH-046/tasks/
        TASK-20260803-019/. Run measurement artifacts themselves are coherent.

    - id: NBF-3
      severity: major
      finding: >-
        Run deliverables omit dominated_by and quantitative sota_delta
        (R5-FIX-PRESERVE-PARETO). For toy non-solver smoke the honest fill is
        dominated_by=Pollard rho (matched negation) and sota_delta axes=
        not_applicable with explicit non_solver_scope — already stated in the
        amendment, missing from run reports.

    - id: NBF-4
      severity: informational
      finding: >-
        HEUR-ISO-1 remains unmeasured in both directions: censored_fraction=
        1.0 at every bit; ks_pass/tail_pass null; rate_iso_1_pass=false
        (fraction 2/21). n_unplanted_R_xfer_lt_0.7_with_cert=0. Executor
        correctly sets observations_only / no_support_reject_conclusion.

    - id: NBF-5
      severity: informational
      finding: >-
        Snapshot archive receipt records commit_sha=null in-blob (hash_note:
        bound post-commit). Validator binds to reachable commit
        e7d14020ca711729e76bbf420d4ec24184a4a7a0 (ancestor of HEAD), parent
        fbd9e4c465294fa4854dc217d73de6c3ed3cd99f, 15 changed paths, all
        non-self source_path_sha256 values recomputed OK.

  metric_recomputations:
    - planted_R_xfer: 0.11065929582066247
    - planted_R_xfer_match: true
    - rate_iso_1_fraction_R_ge_1: 0.09523809523809523
    - rate_iso_1_recompute: 2/21
    - total_heur_edges_expanded: 30
    - total_gate_edges_expanded: 8620
    - matched_rho_identity_mismatches: 0
    - wall_seconds: 248.0565869808197
    - wall_budget_seconds: 600
    - peak_rss_bytes: 490930176

  limitations:
    - Toy claim ceiling only; no crypto-scale validation (AGENTS rule 7).
    - Transfer-gate / sub-rho interpretation void under BF-1..BF-3.
    - bits=24 density is resource-censored, not a law.
    - bits=28 rho_special=0 is a 50k-sample estimate, not exact zero.
    - Official research state unchanged; H-IT-001 status not in scope.

  artifact_paths:
