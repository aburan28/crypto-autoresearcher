  claim_under_review: >-
    Whether RUN-IT-001-rc45-smoke under PA-IT-001-v3-rc45-repair-5 /
    DEC-20260803-003 is admissible as a toy observations package, and whether
    any sub-rho, transfer-gate, HEUR-ISO-1 support, asymptotic, STR-reopen, or
    lane-death reading is licensed by this smoke alone.

  inference:
    requested_policy: review-adversarial
    reasoning_effort: xhigh
    independent_session_required: true
    resolved_model_id: cursor-cloud-agent
    model_verified: false
    fallback_used: true
    fallback_reason: >-
      review-adversarial xhigh is not probe-verified on this Cursor cloud
      backend; resolved runtime is cursor-cloud-agent (bc-0daaccb0). Recorded
      rather than asserted.

  checklist:
    illicit_sub_rho_or_transfer_or_heur_support:
      result: FORBIDDEN_NO_LICENSE
      note: >-
        Package itself is observations_only / no_support_reject_conclusion;
        rate_iso_1_pass=false; n_unplanted_R_xfer_lt_0.7_with_cert=0;
        expected_cost_bookkeeping overall_mode=deterministic_only with
        p_success=0.0 → expected cost unbounded. Any support reading is illicit.
    executor_mutated_frozen_rc45_text:
      result: PASS_NO_MUTATION
      evidence: >-
        git blob hash of PA-IT-001-v3-rc45-repair-5.yaml identical at
        16f7b7bf8, e7d14020c, and HEAD:
        8e1441b49a4541e5f6f0189d4eca78079baae774. Diff empty.
    exact_frozen_command_used:
      result: PASS
      command: >-
        sage experiments/EXP-IT-001/implementation/run_bounded_toy.py
        --amendment experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc45-repair-5.yaml
        --run-id RUN-IT-001-rc45-smoke --mode smoke --seed 2026080304
      evidence: command.txt byte-exact match to amendment future_executor_commands.smoke
    c_smart_8_applied_not_leftover_1:
      result: PASS_METADATA_AND_RUNTIME
      evidence: >-
        run_bounded_toy.py sets pure.C_SPECIAL_ANOMALOUS_CALIB_CONST = 8.0
        (it001_pure default is 1.0). transfer_gate_report records c_smart=8,
        c_special_formula_id=C_special_smart, calibrated_formula
        max(1, ceil(8.0 * log2(N))), calibrated_value_at_N_2_20=160.
        Caveat: CTRL-ANOMALOUS-TRACE1 itself was never executed; planted
        control remains MOV (see RT-046-M2).
    null_plant_and_planted_path_controls:
      result: PACKAGING_THEATER
      note: >-
        Same defect class as RT-146-O2/O3: planted_path uses embedding-degree-1
        MOV with C_special=22 and direct-solve certificate (no isogeny
        pullback); CTRL_NULL_IT_PLANT has edge_ledger=[]; null gate skipped on
        all 21 cells (R_null=null). Do not treat planted_path_recovered=true or
        plant_detected=true as transfer-capability validation.
    density_null_decay_rt045_d3:
      result: STILL_MISSING_CARRYOVER
      carryover_id: RT-045-D3
    measure_run_executed:
      result: ABSENT
      note: >-
        RUN-IT-001-rc45-measure directory absent. Smoke alone is not enough for
        any scientific H-IT-001 / transfer-gate / HEUR transition.

  executive_summary: >-
    PASS_SCOPED. Executor admission hygiene for the RC-45 smoke gate holds:
    frozen amendment text untouched, exact frozen smoke command executed,
    c_smart=8 applied at runtime (not leftover 1), D2 CLI wired enough for the
    frozen string to run, and snapshot hashes at e7d14020c match the reviewed
    tree. The smoke package is usable only as toy-tier observations with hard
    voids: no sub-rho, no transfer-gate support, no HEUR-ISO-1 adjudication,
    no crypto-scale, no asymptotic, no STR reopen, no lane death, and no
    H-IT-001 status change. Measure was not executed; smoke alone cannot
    authorize any scientific transition. Planted-path and null-plant positives
    remain packaging theater (MOV/direct-solve; empty edge ledger; null gate
    never live). Density null-decay (RT-045-D3) remains missing. Honest Pareto:
    dominated_by Pollard rho 1/2; sota_delta not_applicable under
    non_solver_scope.

  objections:
    - id: RT-046-B1
      severity: blocking_interpretation
      title: Forbid any sub-rho / transfer-gate / HEUR-ISO-1 support from this toy smoke
      evidence: >-
        summary.json: observations_only=true, no_support_reject_conclusion=true,
        rate_iso_1_pass=false, n_unplanted_R_xfer_lt_0.7_with_cert=0,
        rho_special_by_bits all 0.0. transfer_gate_report
        expected_cost_bookkeeping.overall_mode=deterministic_only with
        p_success=0.0 and expected_cost_per_attempt_over_p_success=null on every
        row. All unplanted certificates verified=false / kind=none; R_xfer rows
        are censorship_lower_bound.
      analysis: >-
        With empty special set, F_hit(hops_max)=0, so total expected transfer
        cost is unbounded. Censorship lower bounds that happen to sit below 0.7
        without certificates are not transfer wins. HEUR-ISO-1 is unmeasured
        (degenerate F_hit≡0; 0 uncensored H_min). Reading support, weaken-as-
        heuristic-failure, or sub-rho existence/non-existence from this package
        would violate AGENTS rules 6–7 and the BATCH-046 claim ceiling.
      falsification_route: >-
        Any EV/DEC draft that sets support_claimed, HEUR pass/fail adjudication,
        or sub-rho sota_delta from RUN-IT-001-rc45-smoke alone is rejected on
        inspection of summary.json + expected_cost_bookkeeping (zero new data).

    - id: RT-046-B2
      severity: blocking_interpretation
      title: Smoke alone is not enough for any scientific transition
      evidence: >-
        RUN-IT-001-rc45-measure absent. DEC-20260803-003 authorized smoke and
        measure-if-admissible; snapshot receipt note: "Measure deferred."
        Single seed 2026080304; n_curves smoke only; no replicated measure
        seeds [2026080304,2026080305,2026080306].
      analysis: >-
        Scientific transition (H-IT-001 analyzed→*, HEUR freeze as validated,
        transfer-gate pass/fail, knowledge promotion) requires the reserved
        measure arm or an explicit Coordinator decision that smoke voids are
        the entire deliverable. Smoke is a wiring/admission + density snapshot
        at one seed, not a measurement campaign.
      falsification_route: >-
        Require measure run presence or an explicit DEC that closes BATCH-046
        as observations-only with no hypothesis transition; reject any
        transition citing only RUN-IT-001-rc45-smoke.

    - id: RT-046-B3
      severity: blocking_interpretation
      title: Planted-path and null-plant positives are packaging theater — void as transfer evidence
      evidence: >-
        planted_path_control: anomalous_trace_eq_1=false; family
        embedding_degree_leq_threshold; C_special=22 (MOV calibrated); note
        "toy pullback = direct solve; no isogeny evaluation at toy scale";
        R_xfer=0.1107. CTRL_NULL_IT_PLANT: edge_ledger=[], C_path_reported=69,
        C_path_honest=277 (69==floor(277/4)); all 21 null per_curve rows
        skipped with R_null=null. No anomalous_trace1_certificate.json artifact.
      analysis: >-
        Same class as RT-146-O1/O2/O3. RC-45 predictions require
        CTRL-ANOMALOUS-TRACE1 at bits=20 under C_special_smart and
        CTRL-TRANSFER-NONSPECIAL with nonspecial endpoints; smoke executed
        neither. plant_detected proves a 4x-cut arithmetic tripwire on a
        censorship counter with an empty ledger — not independent recomputation
        of a certificate path. Void planted_path_recovered / plant_detected as
        transfer-capability or packaging-gate validation.
      falsification_route: >-
        Cheapest: recompute planted R_xfer with frozen field-DLP-inclusive MOV
        ceil(0.886*sqrt(p^k))≈1284 → R_xfer≈2.08≥0.7 (control FAIL). Require
        non-empty edge_ledger for plant_detected, and one live
        CTRL-NULL-PACKAGING-GATE on a synthetic cert-bearing R_xfer<0.7 claim.

    - id: RT-046-M1
      severity: major
      title: execution_report / manifest still emit BATCH-030 / TASK-20260801-143 provenance
      evidence: >-
        execution_report.yaml task_id=TASK-20260801-143 batch_id=BATCH-030;
        manifest.task_id and artifact_paths still cite
        BATCH-030/tasks/TASK-20260801-143. run_bounded_toy.py report writer
        hardcodes those IDs (lines ~2109–2251) even though TASK_DIR defaults to
        BATCH-046/TASK-20260803-019 and APPROVAL.task_id is correct.
      analysis: >-
        D2 CLI wiring succeeded (frozen command runs) but report packaging was
        not fully rebinding. Numeric results are still hash-bound at e7d14020c;
        treat BATCH-030 fields as stale labels, not as a second experiment.
        Non-blocking for PASS_SCOPED usability of hashed observations; blocking
        if Coordinator launders this as a BATCH-030 rerun.
      falsification_route: >-
        Diff execution_report task_id/batch_id against DEC-20260803-003 /
        TASK-20260803-019; require rewrite on next Executor touch without
        mutating RC-45 text.

    - id: RT-046-M2
      severity: major
      title: c_smart=8 is set, but CTRL-ANOMALOUS-TRACE1 was never exercised
      evidence: >-
        Runtime applies C_SPECIAL_ANOMALOUS_CALIB_CONST=8.0 and reports
        c_smart=8 / calibrated_value 160. stdout only shows CTRL-PLANTED-PATH-POS
        (MOV). No anomalous plant certificate; planted start_det.anomalous_trace_eq_1=false.
      analysis: >-
        Checklist item 4 passes against leftover c_smart=1. It does not show
        the RC-45 anomalous positive-control prediction held. Do not cite
        c_smart=8 metadata as anomalous-arm PASS.
      falsification_route: >-
        Run CTRL-ANOMALOUS-TRACE1 at bits=20 with verified Smart plant and
        charge C_special=ceil(8*log2(p))=160; check R_xfer<0.7 under headroom
        budget. Absent that run, anomalous arm remains untested.

    - id: RT-046-D3
      severity: major
      title: Density null-decay control still missing (RT-045-D3 carryover)
      carryover_from: RT-045-D3
      evidence: >-
        rho_special=0.0 at bits {20,24,28} with no identical statistic on
        NULL-IT random-graph object. No null-decay plot or flat-null comparison
        in results/.
      analysis: >-
        Inventor-protocol controls-before-belief: a quantity that should decay
        with bits must be compared to a null object of the same shape. Zero
        specials on fixed smallest-p universes without null decay is a density
        upper-bound observation, not HEUR validation.
      falsification_route: >-
        Identical special-density statistic on NULL-IT random graph at each bit
        in {20,24,28}; require real-graph decay vs null flat rate.

    - id: RT-046-D4
      severity: major
      title: c_smart unit conversion still thin (RT-045-D4 carryover)
      carryover_from: RT-045-D4
      evidence: >-
        Amendment discloses c_smart=8 as upper-bound conversion without
        enumerated Smart operation count; smoke inherits that disclosure.
      analysis: >-
        Non-blocking for toy admission; blocks any claim that 8 log2(p) is
        information-theoretically justified.
      falsification_route: >-
        Enumerate Smart p-adic lift ops at bits=20 and bound the conversion
        constant before any anomalous-arm support reading.

    - id: RT-046-I1
      severity: informational
      title: Snapshot hash integrity OK; dirty-tree at run time disclosed
      evidence: >-
        All TASK-20260803-020 source_path_sha256 entries match current tree.
        manifest.git.dirty=true with dirty_entries_sample modifying
        run_bounded_toy.py (D2 wiring committed in e7d14020c).
      analysis: >-
        Reproducibility caveat only; not a mathematical negative.

  required_controls:
    - id: CTRL-FORBID-SUPPORT-FROM-SMOKE
      description: >-
        Any EV/DEC must set support_claimed=false, novelty/sota/closure/
        breakthrough false, and refuse HEUR-ISO-1 pass/fail from this smoke.
    - id: CTRL-MEASURE-OR-NO-TRANSITION
      description: >-
        Either execute RUN-IT-001-rc45-measure under the frozen measure string,
        or explicitly close with hypothesis_status_transition=none.
    - id: CTRL-VOID-PLANTED-AND-NULL-THEATER
      description: >-
        Do not cite planted_path_recovered / plant_detected as transfer or
        packaging-gate validation until anomalous/nonspecial controls and a
        non-empty edge ledger exist.
    - id: CTRL-DENSITY-NULL-DECAY
      description: >-
        RT-045-D3 cheapest control: NULL-IT density statistic at {20,24,28}.
    - id: CTRL-ANOMALOUS-TRACE1-LIVE
      description: >-
        Exercise RC-45 CTRL-ANOMALOUS-TRACE1 at bits=20 with C_special_smart=160.

  counterexample_or_mutation: >-
    Cheapest decisive mutations (no/new minimal data): (1) recompute planted
    R_xfer with frozen MOV field-DLP cost ≈1284 → fail (≥0.7); (2) assert
    measure dir absent → forbid scientific transition; (3) note edge_ledger=[]
    → void plant_detected independence; (4) compare amendment blob hash across
    16f7b7bf8 vs e7d14020c (unchanged — admission mutation fails to fire).

  baseline_comparison: >-
    Generic tightest baseline remains Pollard rho at exponent 1/2 (matched
    negation ceil(0.886*sqrt(N_star))). Matched BSGS 2*sqrt(N) is recorded and
    dominated by rho on time×memory at toy. Closest specialized baseline is
    Smart linear-time anomalous solve (charged via c_smart=8 when that arm is
    actually run). With rho_special=0, expected transfer cost is unbounded, so
    every honest transfer reading is dominated by rho. No row of the toy
    frontier shows a certificate-bearing R_xfer<0.7 win.

  heuristic_challenges:
    - >-
      HEUR-ISO-1 unadjudicated: F_hit≡0, 0 uncensored H_min, KS/TAIL unevaluable;
      vacuous consistency with rho=0 is neither PASS nor FAIL.
    - >-
      Random-model transfer for independent-marking F_hit never testable on an
      empty special set; fixed smallest-p selection shapes density zeros
      (RT-146-O5 class).
    - >-
      RT-045-D3 null-decay still absent — density zeros lack null-object control.

  cost_model_challenges:
    - >-
      Expected-cost bookkeeping is honest (deterministic_only / unbounded) but
      therefore licenses no per-attempt-only sub-rho comparison.
    - >-
      Planted MOV C_special=22 still omits field-DLP dominant term if misread as
      transfer win; under frozen field-DLP formula the planted control fails.
    - >-
      c_smart=8 conversion remains thin (RT-045-D4); anomalous arm untested.
    - >-
      Memory reported as process RSS only; no algorithmic BFS/MITM memory row;
      no van Oorschot–Wiener interpolation (out of claim at toy, but must stay
      undisclosed-as-win).

  reduction_and_scope_challenges:
    - >-
      Claim ceiling toy only; AGENTS rule 7 forbids crypto-scale laundering.
    - >-
      No STR reopen, no lane death, no GOAL completion, no H-IT-001 support.
    - >-
      Affected-vs-safe in concrete_cost_table remains generic-toy vs
      structured/pairing/crypto out_of_claim — acceptable only as disclosure,
      not as tested safety.

  narrowest_supported_statement: >-
    Under PA-IT-001-v3-rc45-repair-5 at snapshot e7d14020c, the frozen smoke
    command ran to completion (completed_valid packaging label) with c_smart=8
    applied in runtime metadata, density abscissa {20,24,28}, and
    rho_special=0.0 on the three chosen p_bits universes (exact at 20/24 for
    those primes; 50k-sample estimate at 28). No certificate-bearing unplanted
    R_xfer<0.7 exists; expected transfer cost is unbounded under p_success=0.
    This licenses toy observations and admission-hygiene facts only — not
    transfer-gate validation, HEUR-ISO-1 adjudication, sub-rho claims, or any
    hypothesis status change. Measure not executed.

  next_concrete_action: >-
    Coordinator (TASK-20260803-023 / EV-IT-008 / DEC-20260803-004): adopt
    PASS_SCOPED with RT-046-B1..B3 voids; keep H-IT-001 unchanged; either
    schedule frozen measure + CTRL-ANOMALOUS-TRACE1 + density null-decay, or
    explicitly pause with no scientific transition. Do not promote knowledge.
    Red Team makes no commit.

  interpretation_caution: >-
    Usable: toy density upper bounds at fixed p_bits; wiring proof that RC-45
    smoke string executes; c_smart=8 not leftover 1; honest unbounded expected-
    cost declaration. Not usable: planted_path_recovered / plant_detected as
    transfer proofs; any HEUR pass/fail; any sub-rho shortcut; any asymptotic
    or crypto-scale statement; any STR/lane-death/GOAL closure.

  dominated_by: >-
    Pollard rho at exponent 1/2 (matched negation) remains the generic baseline
    for ordinary prime-order subgroups; this smoke does not claim a sub-rho
    exponent and is dominated by rho on every honest frontier row.
  sota_delta:
    time_exponent_delta: not_applicable
    memory_exponent_delta: not_applicable
    data_or_query_exponent_delta: not_applicable
    non_solver_scope: >-
      Toy smoke observations under RC-45; no solver advantage claimed; measure
      arm absent; transfer expected cost unbounded at rho_special=0. Quantitative
      ECDLP exponent deltas are not_applicable.

