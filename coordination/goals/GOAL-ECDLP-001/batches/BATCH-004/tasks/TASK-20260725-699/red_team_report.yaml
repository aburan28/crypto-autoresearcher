  pin_audit_against_rt687_and_dec005:
    contract_version: "1.0.0-review"
    decision_refs:
      - DEC-20260722-005
      - DEC-20260725-022
    prior_review_ref: RT-20260725-687
    pins:
      - id: public_fixture
        required_by: DEC-20260722-005 / RT687-O1
        status: DISCHARGED
        finding: >-
          public_fixture.json freezes FIXTURE-ECDLP-TOY-RANKFAIL-001 over
          F_19 short-Weierstrass a=0,b=2 with subgroup order 13, generator
          G=(4,3), factor base {G,2G,3G}. fixture_sha256
          4c82f5e43efce185a2ecbf2cbcc24b6da7a1bddadd1176007427be350494c4a8
          equals sha256 of the committed JCS file (no self-included digest
          field). Independent EC checks: points on curve; 13*G = O.
      - id: sealed_empty_or_pilot_schedule_template
        required_by: DEC-20260722-005 / RT687-O2
        status: DISCHARGED
        finding: >-
          empty_or_pilot_schedule.json is a sealable JCS instance with
          attempts:[], all required_root_fields materialized, seal_before_activation
          true, and schedule_sha256
          be41eb8d016f049d31a3f2ce5bdeda94fb60548b9108311bddca5ede9f9f2279
          recorded in the protocol. YAML sealed_schedule_instance echo matches
          the JSON bytes structurally. Empty-or-pilot correctly means empty
          attempts, not a missing document.
      - id: independent_verifier_artifact_hash
        required_by: DEC-20260722-005 wording; RT687-O4 residual
        status: OBLIGATION_ONLY_HARD_GATED
        finding: >-
          artifact_sha256 remains null. First no-go
          PRECOMMIT_VERIFIER_HASH_MISSING is explicit in precommit and protocol
          activation_gate. Acceptable residual under RT687-O4; still blocks any
          executable campaign.
      - id: group_operation_type_vocabulary
        required_by: TASK-20260722-014 / RT687-O5
        status: DISCHARGED
        finding: >-
          Frozen enum is embedded under
          resource_schema.group_operations_by_declared_type.frozen_types in the
          sealed schedule JSON, not only in protocol prose.
    illicit_scalarization: NOT_FOUND
    planted_controls: COMPLETE_NINE_OF_NINE
    non_authorization_language: PRESENT_AND_STRENGTHENED
    overclaim: NOT_FOUND
    design_note_self_exculpation: CORRECTED

  rt687_objection_disposition:
    - id: RT687-O1
      severity_was: major
      status: closed
      note: Concrete fixture bytes and fixture_sha256 are frozen and hash-bound.
    - id: RT687-O2
      severity_was: major
      status: closed
      note: Sealable empty-or-pilot schedule instance and schedule_sha256 exist.
    - id: RT687-O3
      severity_was: major
      status: closed
      note: >-
        Design note now treats prior missing fixture/schedule pins as closed
        design defects; remaining verifier/precommit nulls are activation
        blockers, not reclassified as non-defects of the DEC fixture/schedule
        pins. Non-authorization requires separate Coordinator ledger
        authorization after review PASS.
    - id: RT687-O4
      severity_was: nonblocking
      status: residual_accepted_hard_gated
      note: Null verifier hash with PRECOMMIT_VERIFIER_HASH_MISSING first no-go.
    - id: RT687-O5
      severity_was: nonblocking
      status: closed
      note: Vocabulary embedded in sealed schedule resource_schema.
    - id: RT687-O6
      severity_was: nonblocking
      status: closed
      note: >-
        Empty/pilot schedule materializes probability_plan, terminal_vocabulary,
        resource_schema, field, column_schema, canonical_row_format,
        initial_matrix, and precommit objects.

  objections:
    - id: RT699-O1
      severity: nonblocking
      category: precommit_schedule_sha256_omission
      objection: >-
        Contract precommit.required lists schedule_sha256, but the sealed JSON
        omits that field inside precommit (digest recorded only at protocol pin
        level; digest_rule excludes a self-included schedule_sha256 field).
      consequence: >-
        Acceptable for this empty/pilot seal pattern if later activation
        sealing either embeds the digest under an exclusion rule or binds the
        protocol-pin digest into precommit after Coordinator snapshot. Not a
        fixture/schedule pin incompleteness of the RT-687 class.
    - id: RT699-O2
      severity: nonblocking
      category: point_sha256_preimage_convention
      objection: >-
        column_schema.point_sha256 values equal sha256(UTF-8 hex encoding
        string), not sha256(raw SEC1 bytes). Contract requires point_sha256 but
        does not freeze the preimage convention in the reviewed package text.
      consequence: >-
        Digests are internally consistent with column_schema_sha256. Before any
        executable campaign, freeze the preimage rule in the verifier/contract
        binding so binary vs ASCII-hex cannot diverge across implementations.

  required_controls:
    - id: RT699-C1
      control: >-
        Keep activation impossible while independent_verifier_artifact_sha256
        is null (PRECOMMIT_VERIFIER_HASH_MISSING) and while
        verified_before_execution is false.
      discriminates: >-
        Methodology PASS from unauthorized executable campaigns.
    - id: RT699-C2
      control: >-
        Retain no_scalarization:true, additive/non-additive split, ownership
        registry rules, undefined resource-per-rank when R_gain=0, and all nine
        planted controls with unchanged expected verdicts.
      discriminates: >-
        Full-cost conservation honesty from illicit scalar scorekeeping.
    - id: RT699-C3
      control: >-
        Require a separate Coordinator ledger authorization after this review
        PASS before any implementation task; keep maximum claim at toy-tier
        conservation under accepted probability assumptions.
      discriminates: >-
        Protocol-pin completeness from cryptanalytic or auto-execution overclaim.

  counterexample_or_mutation:
    name: null_digest_certificate_collapse_no_longer_applies
    cost: zero_compute_symbolic
    construction: >-
      Replay the RT-687 mutation: attempt to form a campaign certificate using
      only fixture/schedule metadata without sealed bytes. Against the 697
      package the mutation fails—fixture_sha256 and schedule_sha256 name
      concrete JCS documents with independently checkable toy group parameters.
    expected_observation: >-
      Preexecution can bind fixture and schedule digests. Activation still fails
      closed on PRECOMMIT_VERIFIER_HASH_MISSING / PRECOMMIT_SNAPSHOT_UNVERIFIED
      until a later authorized sealing step. That residual is intentional and
      does not reopen the DEC fixture/schedule pin gap.
    discrimination: >-
      Distinguishes completed design pins from still-blocked execution
      precommit.

