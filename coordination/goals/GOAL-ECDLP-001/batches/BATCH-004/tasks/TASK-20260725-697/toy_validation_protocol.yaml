      seal_before_activation: true
      schedule_path: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-004/tasks/TASK-20260725-697/empty_or_pilot_schedule.json
      schedule_sha256: be41eb8d016f049d31a3f2ce5bdeda94fb60548b9108311bddca5ede9f9f2279
      digest_rule: >-
        sha256 of RFC8785-style JCS bytes of the schedule document without its
        own schedule_sha256 digest field (file empty_or_pilot_schedule.json).
      status: sealable_empty_or_pilot_instance_frozen
      note: >-
        Empty-or-pilot permits empty attempt contents; it does not permit
        omitting a hashable schedule document. This instance materializes all
        preexecution_schedule.required_root_fields with attempts:[].
