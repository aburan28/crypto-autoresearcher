        independent_verifier_id/version/artifact_sha256.
      activation_gate: >-
        Machine-checkable first no-go: if
        independent_verifier_artifact_sha256 is null at seal/activation time,
        fail closed with PRECOMMIT_VERIFIER_HASH_MISSING. Activation is
        impossible while this field remains null (RT687-O4 residual accepted
        as obligation-only only under this hard gate).
