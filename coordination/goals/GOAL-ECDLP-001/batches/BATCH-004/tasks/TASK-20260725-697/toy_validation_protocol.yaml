      description: >-
        Public toy prime-field short-Weierstrass subgroup instance for
        certificate conservation validation only (≤32-bit field). Concrete
        curve parameters, subgroup order, factor-base points, and encodings
        are frozen and hash-bound.
      curve_or_group_parameters:
        model: short_weierstrass
        field_prime_decimal: "19"
        a_decimal: "0"
        b_decimal: "2"
        discriminant_nonzero: true
        point_encoding: uncompressed_sec1_xy_hex_fixed_1byte
        identity_encoding_hex: "00"
      subgroup_order: "13"
      generator_point:
        label: G
        affine_x_decimal: "4"
        affine_y_decimal: "3"
        encoding_hex: "040403"
      factor_base_points:
        - column_id: P0
          label: G
          affine_x_decimal: "4"
          affine_y_decimal: "3"
          encoding_hex: "040403"
          scalar_times_G_decimal: "1"
        - column_id: P1
          label: 2G
          affine_x_decimal: "18"
          affine_y_decimal: "18"
          encoding_hex: "041212"
          scalar_times_G_decimal: "2"
        - column_id: P2
          label: 3G
          affine_x_decimal: "6"
          affine_y_decimal: "3"
          encoding_hex: "040603"
          scalar_times_G_decimal: "3"
