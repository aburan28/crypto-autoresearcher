            point_sha256: 08afe1125bb5ba2c2b2dede276a61b273c745628ccf2c6e470f75b0bdd36bd48
        canonical_row_format:
          coefficient_width_bytes: "1"
          domain_separator: rank-row-v1
          zero_row_rule: >-
            A verified zero row is dependent and gains zero rank.
        terminal_vocabulary:
