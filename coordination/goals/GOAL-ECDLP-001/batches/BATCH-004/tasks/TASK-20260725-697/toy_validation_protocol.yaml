      - ecdlp_lower_bound
      - crypto_scale_conclusion
      - breakthrough
      - solution
      - universal_impossibility
    exclusions:
      - no_live_keys_or_private_targets
      - P1553_R4_out_of_scope
      - timeouts_infra_failures_are_costs_not_negative_math
  supersedes_failed_card: TASK-20260725-611
  pin_discharge_vs_rt687:
