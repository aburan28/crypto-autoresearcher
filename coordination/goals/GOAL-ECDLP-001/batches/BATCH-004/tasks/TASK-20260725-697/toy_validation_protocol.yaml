  resource_vector:
    schema: rank-failure-resource-v1
    no_scalarization: true
    additive:
      - cpu_time_ns
      - group_operations_by_declared_type
      - io_read_bytes
      - io_write_bytes
      - communication_sent_bytes
      - communication_received_bytes
    non_additive:
      - campaign_elapsed_wall_ns
      - active_wall_union_ns
      - peak_memory_bytes_by_domain
      - campaign_peak_observed_bytes
      - retained_unique_bytes
    ownership_rules:
      - exclusive_work_id_has_exactly_one_owner
      - shared_work_id_has_one_registry_entry_weights_sum_to_1
      - double_owned_or_unowned_invalidates_conservation
    required_stages:
      - setup
      - relation_collection
      - linear_algebra
      - descent
      - verification
    comparison_rule: >-
      Coordinatewise dominance under identical counter conventions only;
      otherwise incomparable. If R_gain=0, resource-per-rank is undefined —
      do not fabricate a finite scalar.
  terminal_vocabulary: rank-failure-terminal-v1
  probability_gate:
    forbid: ceil(r/p_L)
    require: binomial_or_negative_binomial_tail_at_declared_alpha
    drop_finite_tail_if_within_stratum_iid_indefensible: true
  conservation_gates:
    - schedule_receipt_bijection
    - exhaustive_terminal_vocabulary
    - independent_decomposition_cert_to_canonical_row_to_exact_gaussian_rank
    - resource_vector_conservation
  controls:
    - id: CTRL-OMISSION
      mutation: remove_one_receipt
      expected: BIJECTION_MISSING_RECEIPT
    - id: CTRL-DUPLICATE-ID
      mutation: repeat_attempt_id
      expected: BIJECTION_DUPLICATE_ID
    - id: CTRL-RETRY-CYCLE
      mutation: mutual_retry_parents
      expected: SCHEDULE_RETRY_CYCLE
    - id: CTRL-FIELD-SCHEMA
      mutation: change_modulus_order_or_digest
      expected: FIELD_OR_SCHEMA_MISMATCH
    - id: CTRL-SHARED-DOUBLE
      mutation: shared_work_double_charged
      expected: SHARED_WORK_DOUBLE_COUNT
    - id: CTRL-SHARED-OMITTED
      mutation: shared_work_unowned
      expected: SHARED_WORK_UNOWNED
    - id: CTRL-CERTIFICATE-ROW
      mutation: valid_cert_wrong_summand_row
      expected: CERTIFICATE_ROW_MISMATCH_AND_ZERO_RANK
    - id: CTRL-WRONG-FIELD
      mutation: producer_rank_over_other_field
      expected: INDEPENDENT_RANK_MISMATCH
    - id: CTRL-CLEAN
      mutation: none
      expected: PASS_ONLY_IF_ALL_CONSERVATION_GATES_PASS
  claim_boundary:
    maximum_claim: >-
      Toy-tier conservation for a later sealed public/toy campaign under frozen
      schema and accepted probability assumptions.
    not_claimed:
