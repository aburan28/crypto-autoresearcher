  verdict_summary: >-
    REVISE. The immutable zero-run successor is internally coherent about the
    scientific and design boundary it actually reaches, but it is not a PASS
    and all five items are not closed in the stronger capacity/readiness
    sense. Independent recomputation confirms: (1) the HA-2 threshold margins
    are 64.000000000000, 71.837571091800, 80.634947193272,
    90.509667991878, and 101.593667325965, while the gamma_x=1/3 ceiling
    margin is exactly 32 at every size; these are expectation-only values and
    do not prove a per-tuple or simultaneous tail; (2) peak_live_bytes is
    correctly disclosed as a maximum over setup and all eight BSGS shard
    snapshots, with no shard-invariance claim and no static numeric peak; (3)
    4088/134217728 equals exactly 0.000030457973480224609375 and serializes to
    the repaired DERIV-1 literal 0.0000304579734802; (4) RT-OBJ3 and RT-OBJ4
    are explicitly retained as open, non-blocking, deferred findings; and (5)
    archive, communication, and output remain over their unchanged caps by
    exactly 3256009664, 3285369792, and 7132160 bytes. Thus the four
    documentation/calibration repairs are genuine, and the fifth item is
    honestly carried forward rather than falsely closed on capacity fit.
    Worst-case candidate_index bounds [504,1016,2040,4088,8184] still exceed
    capacity 32 and the no-truncation overflow invalidation rule is preserved.
    Separately and independently blocking, the producer's archived runtime
    receipt is not valid resolution provenance for its frozen policy: it
    requested coordinator-orchestration-code but manually launched
    gpt-5.6-sol, whereas the frozen OpenAI binding for that policy was
    gpt-5.6-terra; fallback was forbidden and no amendment exists. The receipt
    verifies only the short read-only probe it encodes and explicitly does not
    prove that the later authoring tokens ran in that session. The correction
    snapshot supersedes only the two failed review launches and preserves the
    producer and producer snapshot unchanged, so it does not remediate this
    mismatch. No implementation, execution, state transition, or ECDLP
    conclusion is authorized.

