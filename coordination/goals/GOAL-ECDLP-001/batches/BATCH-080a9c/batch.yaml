required_successor_repairs:
  - Recompute the candidate_index adequacy margin directly from H-SYC-b854f4's own already-adopted HA-2 heuristic (E[X]=N^(-1/3+gamma_x+o(1))), not DERIV-1, at both the decision threshold (gamma_x=5/18) and the theoretical ceiling (gamma_x=1/3); state the exact correspondence between H-SYC-b854f4's per-root X and the compiler's per-(curve,root,model,eta)-tuple candidate_index occupancy; and either show adequacy still holds at 32 under HA-2, or raise the cap and propagate the consequences. Closes RT-68EA16-OBJ1-DERIV1-uncalibrated-against-HA2.
  - Add a peak_live_bytes accounting for the widened 8-way BSGS baseline: either an analytic shard-invariance derivation or an explicit disclosure parallel to the existing wall-axis treatment. Closes RT-68EA16-OBJ2-peak_live_bytes-shard-sensitivity-unaudited.
  - Fix the DERIV-1 by_size table's bits=27 expected_occupancy literal (0.0000304654240608 -> 0.0000304579734802). Closes VAL-68EA16-DERIV1-BITS27-LITERAL-ERROR.
  - Explicitly and visibly note RT-OBJ3 (crossover-N estimate) and RT-OBJ4 (k-list/generalized-birthday baseline) as deferred, not dropped, in the successor's own artifacts. Closes RT-68EA16-OBJ3-RTOBJ3-RTOBJ4-deferred-status-not-recorded.
  - Either propose a scoped resolution for the archive/communication/output capacity-fit residuals that fits within unchanged hard caps, or explicitly carry them forward again as disclosed, quantified residuals rather than silently dropping them; this batch has no authority to unilaterally raise a hard cap.
