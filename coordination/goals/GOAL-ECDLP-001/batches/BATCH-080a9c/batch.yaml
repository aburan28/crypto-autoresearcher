predecessor_disposition: >-
  EXP-SYC-12de89 remains at status review_required and is never edited. It is
  superseded only by a new immutable record. Its independently reconfirmed
  RT-OBJ2 closure (asymmetric shard parallelism, fully closed with zero side
  effect on any other figure) and its independently reconfirmed worst-case
  candidate_index occupancy bound and overflow-invalidation rule are
  preserved, not retracted. The three residuals this batch targets are
  additive repairs to a document that otherwise stands.
blocking_findings:
  - id: RT-68EA16-OBJ1-DERIV1-uncalibrated-against-HA2
    source: red-team
    source_task_id: TASK-20260811-c0a729
    severity: blocking
    summary: >-
      DERIV-1's disclosed expected-case margin (~16,644x at bits=18 rising to
      ~4,198,404x at bits=30) is internally inconsistent with H-SYC-b854f4's
      own already-adopted numbered heuristic HA-2
      (E[X]=N^(-1/3+gamma_x+o(1))) for the identical quantity, by two to
      three orders of magnitude at the hypothesis's own decision-relevant
      parameter range. Recomputed directly from HA-2: at the decision
      threshold gamma_x=5/18 the margin is only 64x-101.6x, and at the
      theoretical ceiling gamma_x=1/3 it is a constant 32.0x at every tested
      size. Never computed or disclosed by the producer. No artifact states
      the exact correspondence between H-SYC-b854f4's per-root X and the
      compiler's per-(curve,root,model,eta)-tuple candidate_index occupancy.
  - id: VAL-68EA16-DERIV1-BITS27-LITERAL-ERROR
    source: validator
    source_task_id: TASK-20260811-b34084
    severity: informational
    summary: >-
      The DERIV-1 by_size table's bits=27 expected_occupancy literal
      (claimed 0.0000304654240608) fails independent recomputation against
      the document's own formula (correct value 0.0000304579734802);
      isolated to one literal, the row's own margin_vs_32 field is
      consistent with the correct value, not the erroneous one.
  - id: RT-68EA16-OBJ2-peak_live_bytes-shard-sensitivity-unaudited
    source: red-team
    source_task_id: TASK-20260811-c0a729
    severity: moderate
    summary: >-
      The 5-to-8-way shard-widening repair's claim of "provably zero effect
      on every ... figure" omits peak_live_bytes, the one non-additive
      comparison axis among the nine mandatory candidate_positive_gate axes
      not actually checked. BSGS partitions inputs across shards, so 5→8-way
      plausibly increases concurrently-live baby-table memory by roughly
      8/5x, neither derived nor disclosed anywhere in the document.
  - id: RT-68EA16-OBJ3-RTOBJ3-RTOBJ4-deferred-status-not-recorded
    source: red-team
    source_task_id: TASK-20260811-c0a729
    severity: advisory
    summary: >-
      DEC-20260809-e35473's next_actions and BATCH-68ea16's own task card
      both explicitly required RT-OBJ3 (crossover-N estimate) and RT-OBJ4
      (k-list/generalized-birthday baseline) to be noted as deferred, not
      dropped. A text search of all five reviewed BATCH-68ea16 producer
      artifacts found zero matches.
  - id: VAL-EA56C5-ARCHIVE-COMMUNICATION-OUTPUT-CAPS-STILL-EXCEEDED
    source: validator_and_red_team
    source_task_id: TASK-20260811-b34084 / TASK-20260811-c0a729
    severity: blocking_infrastructure_budget_adequacy
    summary: >-
      Both reviewers independently confirm the correctly-recharged totals
      exceed the unchanged archive_hard_cap_bytes and
      communication_hard_cap_bytes by 3256009664 and 3285369792 bytes
      respectively, and the honest output budget exceeds output_caps by
      7132160 bytes. Neither review found any silently-uncharged byte or
      undisclosed file swap; this is an honestly disclosed capacity-fit
      residual, not a fabrication. This batch has no authority to
      unilaterally raise any hard cap.
