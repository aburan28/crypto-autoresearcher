objective: >-
  Freeze, snapshot, and independently review ONE further new immutable static
  successor, EXP-SYC-24123d, to EXP-SYC-12de89 (which stays review_required
  and is not edited or remapped), that repairs exactly the five items named
  by the dual REVISE verdicts on checkpoint BATCH-68ea16 (Validator
  TASK-20260811-b34084, Red Team TASK-20260811-c0a729): (a) recompute the
  candidate_index adequacy margin directly from H-SYC-b854f4's own
  already-adopted HA-2 heuristic; (b) add a peak_live_bytes accounting for
  the widened 8-way BSGS baseline; (c) fix the DERIV-1 bits=27
  expected_occupancy literal error; (d) explicitly note RT-OBJ3/RT-OBJ4 as
  deferred, not dropped; (e) either propose a scoped resolution for the
  archive/communication/output capacity-fit residuals within unchanged hard
  caps, or explicitly carry them forward again as disclosed residuals. No
  implementation, execution, run, evidence promotion, ECDLP claim, or status
  transition is in scope.
