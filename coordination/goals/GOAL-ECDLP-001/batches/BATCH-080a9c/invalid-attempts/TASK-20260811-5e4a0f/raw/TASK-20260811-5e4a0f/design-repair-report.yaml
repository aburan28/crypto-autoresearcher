  five_item_adjudication:
    - id: RT-68EA16-OBJ1-DERIV1-uncalibrated-against-HA2
      disposition: CLOSED_FOR_STATIC_RECALIBRATION
      repair: >-
        Replaced DERIV-1 as capacity authority with H-SYC-b854f4's own HA-2
        mean E[X]=N^(-1/3+gamma_x+o(1)). At gamma_x=5/18 and finite-table
        o(1)=0, expected X is 0.5 down to 0.3149802624737183 and the 32-slot
        margin is 64x up to 101.5936673259648x. At gamma_x=1/3, expected X is
        1 and the margin is exactly 32x at every size.
      correspondence: >-
        This successor defines one generated curve-root-model stream,
        canonically deduplicates exact A, and emits one slot per distinct A;
        occupancy therefore equals hypothesis X. Multiplicity-weighted Y and
        repeated comparison paths do not allocate slots. The three eta cells
        and three mount passes are byte-identical analytical views/replays of
        the same stream, not independent X draws.
      limitation: >-
        The result is an expected-occupancy margin only. HA-2 supplies no tail
        bound, worst-case guarantee, or full-population no-overflow guarantee.
        The thirty-third distinct A still invalidates without truncation.

    - id: RT-68EA16-OBJ2-peak_live_bytes-shard-sensitivity-unaudited
      disposition: CLOSED_BY_EXPLICIT_DISCLOSURE
      repair: >-
        The successor withdraws shard-invariance for peak_live_bytes. With one
        retained 53-byte-record baby table per active shard, widening BSGS
        from five to eight shards can increase concurrently live baby-table
        payload from 5*53*ceil(sqrt(r)) to 8*53*ceil(sqrt(r)), an 8/5 factor,
        unless a shard-independent setup peak dominates. Future directed peak
        intervals must measure or conservatively bound the eight-table case.
      limitation: no live peak value exists in this zero-run task

    - id: VAL-68EA16-DERIV1-BITS27-LITERAL-ERROR
      disposition: CLOSED
      repair: >-
        Corrected 4088/134217728 from 0.0000304654240608 to
        0.0000304579734802. Exact-rational rechecks leave the bits 18, 21, 24,
        and 30 rows unchanged.

    - id: RT-68EA16-OBJ3-RTOBJ3-RTOBJ4-deferred-status-not-recorded
      disposition: CLOSED_AS_A_RECORDING_DEFECT
      repair: >-
        RT-OBJ3 (crossover-N estimate) and RT-OBJ4
