static_custody_contract:
  task_id: TASK-20260811-5e4a0f
  experiment_id: EXP-SYC-24123d
  status: review_required
  approved_by: null
  contract_scope: static_design_bytes_only
  implementation_exists: false
  implementation_authorized: false
  execution_authorized: false
  maximum_runs: 0

  immutable_predecessor:
    snapshot_commit: d0041fe73b90e9e1827c8b13ff144888bc1a4f25
    specification_sha256: 5b022abb43712ce17ac772b0ba0c87a49435bc434ffbe28bef9e68840b521558
    verification_and_null_kats_sha256: 2481789faaafa436286dd747e4c66b966226a236020abe20ba8ab6e8c7006e1d
    custody_and_executable_contract_sha256: 59539b465484fba653d74e6be7ee42a3e8340e1ad72bfe48e30b3542ff99dce0
    physical_frontier_compiler_sha256: a4b24972ce934b14ef81c638164f3b26b3c53cd8ced0c59dbc0b3e0a3bc9724c
    design_repair_report_sha256: d4c34d51e45cd78aff202955c4074b845c30699d561d48a7b5c87b8759f5efe8
    preservation_rule: >-
      All independently confirmed predecessor cryptographic literals,
      custody fields, executable restrictions, KATs, shard equalization, and
      overflow behavior remain inherited by these exact bindings. This static
      successor adds no executable and mutates none of those predecessor bytes.

  candidate_stream_identity:
    logical_generation_key_fields: [bits, curve_id, root_index, public_model_id]
    generated_once_per_key: true
    canonical_deduplication_key: exact_canonical_A_bytes
    emission_order: canonical_A_bytes_then_canonical_reconstructed_witness
    occupancy_definition: number_of_distinct_canonical_A_values
    occupancy_equals_hypothesis_X: true
    multiplicity_Y_storage: root_metric_diagnostic_only
    duplicate_comparison_outcome_consumes_slot: false
    verification_rule: >-
      Each emitted distinct A carries one canonical reconstructed scalar and
      verification/source flags. If two comparison paths yield the same A,
      they update Y and duplicate diagnostics but do not create another slot.
      Conflicting reconstructed witnesses for one A invalidate rather than
      selecting a favorable witness.

  analytical_view_identity:
    eta_values: [-4, 0, 4]
    eta_role: estimator_sensitivity_only
    eta_generates_candidates: false
    eta_candidate_bytes_relation: byte_identical_references_to_one_generated_stream
    mount_states: [true_secret_outside_sandbox, decoy_secret_outside_sandbox, no_secret]
    mount_role: verifier_counterfactual_replay_only
    mount_generates_candidates: false
    mount_candidate_bytes_relation: byte_identical_replay_of_one_immutable_stream
    required_digest_identity: >-
      For each bits-curve-root-model generation key, the candidate-array
      digest must be identical across all three eta analyses and all three
      mount-state replays. Eta and mount labels live in analysis and receipt
      metadata, not in the generated candidate identity.

  candidate_index_capacity:
    capacity: 32
    valid_indices: '0 through 31'
    thirty_third_distinct_A_rule: invalidate_before_emission
    overflow_disposition: invalidates_without_truncation
    prohibited_overflow_actions: [drop, truncate, wrap, overwrite, reassign, resample]
    expected_margin_claim: >-
      Under HA-2 with the finite-table convention, expected occupancy margin
      is 64x through 101.5936673259648x at gamma_x=5/18 and exactly 32x at
      gamma_x=1/3. This is an expectation statement only.
    tail_guarantee: none
    full_population_no_overflow_guarantee: false
    worst_case_guarantee: false

  future_executable_admission:
    current_admission: denied
    blockers:
      - archive bytes exceed the unchanged hard cap by 3256009664.
      - communication bytes exceed the unchanged hard cap by 3285369792.
      - output bytes exceed the unchanged total cap by 7132160.
      - fresh independent Validator and Red Team review has not occurred.
    required_before_admission:
      - immutable snapshot archive of all five EXP-SYC-24123d producer artifacts
      - strict duplicate-key-rejecting YAML parse and arithmetic recomputation
      - independent Validator verdict PASS
      - independent Red Team verdict PASS
      - a later Coordinator decision resolving every positive hard-cap residual
    forbidden_shortcuts:
      - treating disclosure of an over-cap value as capacity fit
      - dropping mount passes, custody receipts, manifests, or output files without a versioned scope decision
      - increasing any hard cap under this contract
      - treating overflow invalidation as evidence against H-SYC-b854f4

  output_custody_boundary:
    inherited_required_output_bytes: 15520768
    inherited_output_cap_bytes: 8388608
    output_over_cap_bytes: 7132160
    disposition: carried_forward_quantified_implementation_blocker
    truncation_authorized: false
    omission_authorized: false

  runtime_provenance:
    provider: OpenAI
    runtime: direct_native_codex
    resolved_model_id: gpt-5.6-sol
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    model_verified: false
    verification_note: native_session_identity_only_no_separate_probe
    fallback_allowed: false
    fallback_used: false
    degraded_allowed: false
    degraded_requirements: []

  no_execution_statement: >-
    This contract describes future custody and admission obligations only. No
    candidate bytes, production seeds, keys, receipts, manifests,
    implementation hashes, executables, curves, or run artifacts were created
    or claimed by TASK-20260811-5e4a0f.
