    execution_authorized: false
    experiment_runs: 0
    curve_generation_authorized: false
    status_transition_authorized: false
    claim_ceiling: >-
      Pre-implementation symbolic design repair on a prospective 18-to-30-bit
      toy ladder only. No implementation, measurement, scalar recovery,
      solver, speedup, attack, asymptotic result, security impact,
      cryptographic-scale transfer, novelty, or breakthrough is claimed.

  inputs:
    hypothesis: H-SYC-b854f4
    predecessor_experiment: EXP-SYC-12de89
    predecessor_evidence: EV-ECDLP-2a7e77
    predecessor_decision: DEC-20260811-a3705b
    sizes_bits: [18, 21, 24, 27, 30]
    curves_per_size: 32
    roots_per_curve: 256
    public_models_per_curve: 4
    eta_sensitivity_values: [-4, 0, 4]
    candidate_index_capacity: 32
    mount_states: 3

  controls:
    - Recompute HA-2 from H-SYC-b854f4 rather than treating DERIV-1 as its substitute.
    - Separate distinct matching A values X from multiplicity-weighted comparison outcomes Y.
    - Treat eta as three preregistered analyses of one generated root-model stream, not three independent X draws.
    - Preserve the candidate_index overflow rule without truncation, wrapping, overwriting, or reassignment.
    - Disclose peak_live_bytes shard sensitivity separately from additive and wall axes.
    - Preserve all independently confirmed predecessor closures unless this repair explicitly says otherwise.

  independent_variables:
    - bits in [18,21,24,27,30]
    - public model in [0,1,2,3]
    - eta sensitivity analysis in [-4,0,4]
    - finite baseline in [rho,bsgs]

  metrics:
    primary:
      - HA-2 expected distinct-match occupancy and margin against capacity 32
      - candidate_index overflow status for every curve-root-model stream
      - peak_live_bytes directed interval on all candidate-rho-BSGS frontier rows
      - archive, communication, and output hard-cap residual bytes
    secondary:
      - corrected DERIV-1 literal table retained only as a historical null approximation
      - explicit deferred status of RT-OBJ3 and RT-OBJ4

  candidate_observable_contract:
    hypothesis_quantity: >-
      H-SYC-b854f4 defines X for one curve, root, and public model as the
      number of distinct exact matching A values. Y is the
      multiplicity-weighted count of comparison outcomes and is not X.
    successor_storage_quantity: >-
      One logical candidate_index occupancy is defined per curve-root-model
      stream after canonical deduplication by exact canonical A. Exactly one
      slot is occupied for each distinct A, with its canonical reconstructed
      witness and verification flags. Thus occupancy equals X by this
      successor's normative emission rule. Comparison duplicates contribute
      to Y and the duplicate diagnostic but do not consume extra slots.
    eta_semantics: >-
      Eta is an estimator sensitivity parameter and does not alter list draws,
      selected pairs, exact matches, deduplication, or candidate bytes. The
      three eta cells reference the same immutable curve-root-model candidate
      array and are byte-identical analytical views, not independent roots or
      independent X draws. Any implementation that regenerates or mutates
      candidates by eta invalidates the apparatus.
    mount_semantics: >-
      The three mount-state passes replay the same immutable candidate bytes;
      they are counterfactual verifier passes, not new X draws.
    predecessor_schema_gap: >-
      EXP-SYC-12de89 allocated slots per curve-root-model-eta tuple while its
      candidate record did not encode eta and did not explicitly bind slot
      occupancy to deduplicated X. This successor resolves that ambiguity
      normatively; no claim is made that an implementation already satisfies it.

  ha2_capacity_calibration:
    source_heuristic: H-SYC-b854f4#HA-2-distinct-match-enrichment
    formula: 'E[X] = N^(-1/3 + gamma_x + o(1))'
    finite_ladder_convention: 'N=2^bits and o(1)=0 solely for this prospective table'
    decision_threshold:
      gamma_x: 5/18
      simplified_formula: 'E[X]=N^(-1/18)'
      by_size:
        18: {expected_X: '0.5000000000000000', margin_32_over_expected_X: '64.00000000000000'}
        21: {expected_X: '0.4454493590701697', margin_32_over_expected_X: '71.83757109179986'}
        24: {expected_X: '0.3968502629920499', margin_32_over_expected_X: '80.63494719327187'}
        27: {expected_X: '0.3535533905932738', margin_32_over_expected_X: '90.50966799187808'}
        30: {expected_X: '0.3149802624737183', margin_32_over_expected_X: '101.5936673259648'}
    theoretical_ceiling:
      gamma_x: 1/3
      simplified_formula: 'E[X]=1'
      all_sizes_expected_X: '1.000000000000000'
      all_sizes_margin_32_over_expected_X: '32.00000000000000'
    disposition: >-
      Capacity 32 is retained because its expected per-stream occupancy margin
      remains greater than or equal to 32 throughout the requested HA-2 range.
      This is not a tail bound, a worst-case guarantee, or a guarantee that no
      stream in the full population overflows. HA-2 fixes only E[X]. The
      assumption-free safety mechanism remains immediate apparatus
      invalidation on the thirty-third distinct A, with no truncation.

  preserved_predecessor_closures:
    rt_obj2_shard_equalization: preserved
    worst_case_comparison_bound: '8*(L(bits)-1), preserved as an upper bound on emitted comparisons, not substituted for X'
    candidate_index_overflow_rule: preserved
    all_other_independently_confirmed_EXP_SYC_12de89_controls: preserved_by_hash_reference

  open_deferred_findings: >-
    RT-OBJ3 (crossover-N estimate) and RT-OBJ4
    (k-list/generalized-birthday baseline) remain open, non-blocking findings
    deferred to a future batch; they are not dropped or silently closed.

  budget:
    wall_clock_seconds_per_run: 0
    planned_wall_clock_seconds: 450000
    hard_wall_clock_seconds: 562500
    total_cpu_hours: 988
    hard_total_cpu_hours: 1235
    maximum_memory_gb: 2
    maximum_runs: 0
    maximum_workers: 1
    increase_authorized: false

  stopping_rules:
    - Stop before implementation admission on any independent REVISE or REJECT.
    - Stop on any strict-YAML, duplicate-key, formula, count, or immutable-binding mismatch.
    - Stop and invalidate on the thirty-third distinct A in any curve-root-model stream.
    - Stop before implementation while any unchanged hard-cap residual is positive.
    - Never reinterpret a stop, timeout, implementation failure, or resource exhaustion as ECDLP evidence.

  invalidation_rules:
    - Any candidate slot emitted per comparison multiplicity rather than per distinct canonical A.
    - Any eta cell that regenerates or changes candidate bytes.
    - Any mount-state pass that changes candidate bytes.
    - Any candidate overflow that is truncated, wrapped, overwritten, or reassigned.
    - Any claim that HA-2's mean alone proves a no-overflow tail guarantee.
    - Any implementation, experiment run, fallback, degradation, or budget increase under this record.

  success_criterion: >-
    The five static repair obligations are machine-readable and independently
    reviewable. This record does not meet implementation admission because the
    capacity-fit residuals remain positive.
  falsification_criterion: >-
    A strict parse failure, arithmetic mismatch, ambiguous X-to-slot mapping,
    omitted peak-memory disclosure, omitted deferred finding, hidden cap
    exceedance, or unauthorized implementation or execution.

  required_artifacts:
    - experiments/EXP-SYC-24123d/specification.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-080a9c/tasks/TASK-20260811-5e4a0f/verification-and-null-kats.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-080a9c/tasks/TASK-20260811-5e4a0f/custody-and-executable-contract.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-080a9c/tasks/TASK-20260811-5e4a0f/physical-frontier-compiler.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-080a9c/tasks/TASK-20260811-5e4a0f/design-repair-report.yaml

