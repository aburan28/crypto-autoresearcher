  hypothesis_id: H-SYC-b854f4
  version: 1
  title: Five-item zero-run static successor to EXP-SYC-12de89
  status: review_required
  objective: >-
    Repair or explicitly disposition the five items frozen by
    TASK-20260811-5e4a0f without implementing or executing an experiment.
    This contract returns REVISE because the unchanged archive,
    communication, and output hard caps do not fit the preserved scope.

  immutable_lineage:
