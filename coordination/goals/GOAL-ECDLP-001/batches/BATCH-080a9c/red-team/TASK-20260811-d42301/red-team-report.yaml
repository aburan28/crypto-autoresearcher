  finding_by_finding_adjudication:
    - finding_id: RT-68EA16-OBJ1-DERIV1-uncalibrated-against-HA2
      adjudication: PARTIAL_PASS_MEAN_CALIBRATION_REPAIRED_CAPACITY_ADEQUACY_OPEN
      calibration_arithmetic: PASS_WITH_ONE_INFORMATIONAL_SERIALIZATION_DISCREPANCY
      correspondence_definition: PASS
      correspondence_assessed: >-
        The source proposal defines X as the number of distinct exact matching
        A values for one root under one frozen public model. The successor
        explicitly maps that value to the retained candidate_index occupancy
        of each corresponding curve/root/model/eta accounting tuple and
        correctly treats eta as a preregistered analysis stratum rather than a
        new root draw.
      mean_margin_result: >-
        With N=2^bits and the arithmetic-only convention o(1)=0, the margins
        32/E[X] are 64.000000000000, 71.837571091800,
        80.634947193272, 90.509667991878, and 101.593667325965
        at gamma_x=5/18, and exactly 32 at gamma_x=1/3.
      unresolved_residual: >-
        HA-2 specifies only E[X]. It supplies no finite-N tail, no tuplewise
        overflow probability, no dependence model across 98304 tuples per
        size, and no maximum-over-tuples guarantee. The unspecified o(1) term
        is set to zero only for a symbolic KAT. Deterministic bounds
        504, 1016, 2040, 4088, and 8184 all exceed capacity 32.
      surviving_counterexample: >-
        At gamma_x=1/3 under the same o(1)=0 convention, let every tuple share
        one Bernoulli variable B with Pr[B=1]=1/33 and define X=33B. Then
        E[X]=1 exactly, matching the declared HA-2 mean, while
        Pr[max X > 32]=1/33. The competing law X=1 identically has the same
        mean and never overflows. Therefore the mean observable does not
        identify capacity adequacy.
      closure_status: not_closed_beyond_mean_calibration
    - finding_id: RT-68EA16-OBJ2-peak_live_bytes-shard-sensitivity-unaudited
      adjudication: REVISE_DISCLOSURE_REPAIRS_WORDING_BUT_DOES_NOT_CLOSE_PEAK_AXIS
      prior_shard_equalization_closure: PASS_INTACT
      current_shard_sets:
        candidate: 8
        rho: 8
        bsgs: 8
      current_peak_formula: "[max(S_peak_lower,B_peak_lower), max(S_peak_upper,B_peak_upper)]"
      static_numeric_peak_available: false
      shard_invariance_proved: false
      all_eight_shards_censused: false
      finding: >-
        The successor correctly retracts any claim that widening from five to
        eight shards has zero effect on peak_live_bytes and requires all eight
        BSGS shards to participate in the maximum. That disclosure closes the
        prior overstatement but not the underlying unaudited axis. A new
        eighth-shard snapshot larger than the first seven changes the maximum
        while every additive count remains unchanged. Until an analytic upper
        bound or complete eight-shard census exists, the nine-axis baseline
        frontier remains incomplete.
      closure_status: open_disclosed_residual
