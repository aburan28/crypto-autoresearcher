  objections:
    - id: RT-A8DC5E-OBJ1-HA2-MEAN-ADMITS-NEAR-CERTAIN-OVERFLOW
      severity: blocking
      description: >-
        The producer says the HA-2 rows repair calibration only, but it does
        not show how severe the surviving tail ambiguity is. At any threshold
        row let mu=N^(-1/18) and define X=33 with probability mu/33 and X=0
        otherwise. Then E[X]=mu exactly, E[X^2]/E[X]=33 is a constant and thus
        N^o(1), and 33 is below every deterministic bound. This distribution
        therefore survives HA-2, HA-3's second-moment condition, and the
        compiler census. Under HA-4-independent root draws, the probability
        that none of 32768 distinct root/model observations overflows is
        (1-mu/33)^32768. Its natural logarithm ranges from -500.284527 at
        bits=18 to -314.268075 at bits=30. Thus overflow is effectively
        certain at every size even though each mean is 64x to 101.6x below
        capacity. The gamma_x=5/18 construction suffices; no appeal to the
        gamma_x=1/3 boundary is needed.
      proof_architecture_framing: >-
        Observation-fiber attack: the same HA-2 mean and permitted kappa=33
        support both a benign diffuse distribution and a spiky distribution
        that invalidates virtually every full census. The mean is not an
        identifying observable for apparatus survival.
    - id: RT-A8DC5E-OBJ2-ALL-SHARD-PEAK-TOPOLOGY-NOT-FROZEN
      severity: blocking_before_peak_comparison
      description: >-
        peak_live_bytes_accounting says eight BSGS shards are concurrently
        eligible, then evaluates B_peak through a max rather than a liveness
        aggregation. If B_i is shard-local private live memory, max_i B_i is
        not total live memory. A shared-table topology and an eight-private-table
        topology can each report the same eight local peaks while their
        systemwide peaks differ by nearly 8x. The formula is sound only if
        every snapshot is explicitly a whole-process/cgroup/system total at a
        synchronized timestamp, in which case taking the maximum over
        timestamps is appropriate. That semantic is absent.
      proof_architecture_framing: >-
        Observation collision and compositional-invariant attack: per-shard
        maxima forget ownership and simultaneous liveness, the load-bearing
        structure needed to recover aggregate peak memory.
    - id: RT-A8DC5E-OBJ3-DEFERRED-SEVERITY-WEAKENED
      severity: blocking_before_implementation_authorization
      description: >-
        Recording the names closes the prior notation gap, but the combined
        non-blocking label loses the original RT-OBJ3 qualification. A
        crossover-N method ceiling is a mandatory cheap pre-compute audit, and
        the original report required it before implementation authorization.
        The k-list/generalized-birthday comparator is also the missing closest
        specialized baseline. Deferral is allowed for this zero-run repair;
        implementation permission while they remain open is not.
    - id: RT-A8DC5E-OBJ4-PRODUCER-PROBE-IS-NOT-AUTHORING-SESSION-RECEIPT
      severity: provenance_limit
      description: >-
        The producer receipt history is preserved correctly: failed
        runtime-session-receipt.json has hash
        185f1da0bb9d476eeae0b4d6601c16e52d8de96e368836c8c520ad7adccc452a,
        zero thread-start events, and its own earlier correction archive; the
        successful v2 receipt has hash
        a1d80ffc952104a0f2ba88dee2a335be1af98741b72b7da8c5538624e85d9c17
        and is in the producer snapshot. But v2 launched a short read-only
        session whose sole prompt was to print PROBE_OK. Its own scope note
        concedes it does not prove later interactive authoring tokens ran in
        that session. It verifies model availability and task labeling, not
        authorship provenance. Future synthesis must preserve that limit and
        must not describe the five YAML artifacts as generated inside the
        verified probe session.
      scientific_effect: none

  required_controls:
    - control: HA2-tail-or-capacity-certificate
      purpose: closes RT-A8DC5E-OBJ1
      action: >-
        Before implementation, reject the current allocation with the exact
        X in {0,33} mutation above, then supply either a rigorous tail bound
        for max X over the 32768 root/model observations at each size, a
        preregistered empirical tail gate with an explicit familywise overflow
        budget and uncertainty bound, or a larger lossless representation
        whose propagated operation, memory, archive, communication, and output
        costs fit every unchanged hard cap. A mean ratio alone is not a gate.
    - control: whole-system-eight-shard-peak-contract
      purpose: closes RT-A8DC5E-OBJ2
      action: >-
        Freeze an ownership and liveness rule. Either sample whole-cgroup or
        whole-system live bytes at synchronized barriers, or compute shared
        setup bytes once plus the sum of every simultaneously live shard-private
        allocation with proved non-overlap. The cheapest future KAT allocates
        eight private equal-size buffers concurrently and must report eight
        times one buffer, not the largest single buffer. No experiment is run
        by this review.
    - control: restore-RT-OBJ3-implementation-gate-and-run-cheap-audits
      purpose: closes RT-A8DC5E-OBJ3
      action: >-
        Record RT-OBJ3 as non-blocking to the current static disposition but
