        either historical receipt.

  counterexample_or_mutation: >-
    Cheapest mathematical falsifier: at gamma_x=5/18 set
    mu=N^(-1/18), P[X=33]=mu/33, and P[X=0]=1-mu/33 for each independent
    root/model observation. It exactly preserves HA-2's E[X], keeps
    kappa=33=N^o(1) as HA-3 requires, stays within every deterministic bound,
    and triggers candidate_index overflow with probability effectively one
    somewhere in the full census. Cheapest peak mutation: keep every local
    BSGS shard peak equal to one unit, but change ownership from one shared
    unit to eight private simultaneously live units. The recorded max remains
    one while the true aggregate peak changes from one to eight. Both
    mutations are static and require no curve or experiment run.

  baseline_comparison: >-
    Pollard rho and standard BSGS remain the declared matched public-input
    baselines, with eight-way wall parallelism inherited. No finite frontier
    measurement exists. The peak axis is not yet comparable because its
    all-shard aggregation topology is underdefined. RT-OBJ4's closer
    k-list/generalized-birthday comparator remains absent and explicitly
    deferred. Therefore no candidate-vs-rho/BSGS or candidate-vs-specialized
    dominance statement is supported. KN-TECH-035's full-cost rule reinforces
    that memory ownership, wiring, and communication cannot be normalized
    away.

  heuristic_challenges:
    - >-
      HA-2 supplies only E[X]. HA-3 allows constant kappa, so it does not rule
      out the X in {0,33} overflow mutation. HA-4 then makes repeated roots
      amplify rather than suppress the apparatus-failure probability.
    - >-
      Setting the unspecified o(1) to zero is valid only as the declared
      arithmetic KAT. No finite-N capacity inference may inherit that choice.
    - >-
      Eta is a sensitivity-analysis stratum, not an independent root. Tail
      multiplicity must use the root/model dependence structure rather than
      count three eta copies as independent. This review uses only 32768 draws,
      making its counterexample conservative.

  cost_model_challenges:
    - >-
      Overflow invalidation is honest but can destroy almost the entire
      planned data set under an HA-2/HA-3-compatible world. The cost model must
      charge retries or redesign; invalidated work cannot silently disappear
      from expected total cost.
    - >-
      Peak live memory is a maximum over time of aggregate simultaneously live
      bytes, not a maximum over private shard-local maxima. Shared/private
      ownership must be explicit to avoid an up-to-eightfold undercount.
    - >-
      Archive, communication, and output arithmetic is correct and still
      exceeds caps by 3256009664, 3285369792, and 7132160 bytes. This is an
      honest blocker, not a reason to weaken custody or treat a failed run as
      evidence.

  reduction_and_scope_challenges:
    - >-
      No published reduction, ECDLP solver, asymptotic speedup, security
      impact, or target-class result is claimed, so reduction instantiation is
      not applicable to this static record.
    - >-
      The closest-specialized-baseline duty is not satisfied by rho and BSGS
      alone. The deferred generalized-birthday comparator remains a required
      pre-implementation scope gate.
    - >-
      EXP-SYC-24123d is quarantined correctly and does not appear in the
      scientific snapshot. The two zero-thread failed review launches are
      forward-preserved under CORR-20260813-300c5d with no verdict or
      scientific effect; this successor task does not appropriate them.

  proof_architecture_challenges:
    - audit: baseline_reproduction
      finding: >-
        Wall-shard parity is preserved, but peak-memory composition is not a
        complete baseline embedding until ownership and simultaneous liveness
        are frozen. The closest k-list baseline also remains missing.
    - audit: observation_collision
      finding: >-
        Two X distributions share the frozen HA-2 mean while one survives and
        one almost certainly overflows. Two BSGS topologies share all local
        shard maxima while aggregate peak differs by up to 8x.
    - audit: quantifier_order
      finding: >-
        Curve, root, model, eta, shard, and cap choices precede data. No
        witness-after-outcome selection was found. Eta is repeated analysis,
        however, and must not be treated as an independent draw in tail claims.
    - audit: method_ceiling
      finding: >-
        RT-OBJ3 remains open. The zero-run producer correctly cannot establish
        a speedup, but it also cannot permit implementation until the cheap
        crossover-N ceiling is computed from already-declared constants.
    - audit: nearby_object
      finding: >-
        The predecessor nearby-object control is preserved by hash and was not
        executed. This review adds only static tail and memory-topology
        mutations; neither is research evidence.

