  five_item_adjudication:
    - finding_id: RT-68EA16-OBJ1-DERIV1-uncalibrated-against-HA2
      verdict: REPAIRED_ARITHMETIC_REVISE_ADEQUACY
      pass_gates:
        - HA-2 is now the authoritative calibration and DERIV-1 is labeled regression-only.
        - At gamma_x=5/18, E[X]=2^(-bits/18) and the five margins are 64.000000000000, 71.837571091800, 80.634947193272, 90.509667991878, and 101.593667325965.
        - At gamma_x=1/3, E[X]=1 and the margin is exactly 32 at every size.
        - The deterministic bounds 504, 1016, 2040, 4088, and 8184 and invalidation above 32 remain visible.
      residual: >-
        The repair correctly refuses to infer a tail from a mean. The residual
        is not cosmetic: a distribution compatible with the stated HA-2 mean,
        HA-3 subpolynomial second-moment ratio, the deterministic upper bound,
        and HA-4 independent roots makes at least one overflow effectively
        certain across the census. Capacity 32 is therefore not an adequate
        implementation allocation under the current assumptions.
      severity: blocking_before_implementation_or_execution
    - finding_id: RT-68EA16-OBJ2-peak_live_bytes-shard-sensitivity-unaudited
      verdict: DISCLOSURE_REPAIRED_TOPOLOGY_STILL_UNDERSPECIFIED
      pass_gates:
        - The producer retracts shard-invariance and zero-effect language.
        - All eight BSGS shards are required and a missing shard invalidates.
      residual: >-
        The frozen formula takes a maximum of shard peaks, but does not define
        whether a shard snapshot is whole-process or systemwide live memory,
        or only shard-local memory. For eight simultaneously resident private
        baby-step tables, max_i(B_i) undercounts sum_i(B_i) by up to eightfold.
        Merely collecting all eight local peaks does not repair the topology.
      severity: blocking_before_any_peak_frontier_comparison
    - finding_id: VAL-68EA16-DERIV1-BITS27-LITERAL-ERROR
      verdict: PASS_CLOSED
      pass_gates:
        - The exact quotient is 4088/134217728 = 511/16777216 = 0.000030457973480224609375.
        - Serialization to 16 decimal places is 0.0000304579734802.
        - The other four DERIV-1 regression literals independently reproduce.
      residual: none
      severity: none
    - finding_id: RT-68EA16-OBJ3-RTOBJ3-RTOBJ4-deferred-status-not-recorded
      verdict: NOTATION_CLOSED_SEVERITY_SCOPE_REVISE
      pass_gates:
        - RT-OBJ3 and RT-OBJ4 are explicitly visible and described as open and deferred.
      residual: >-
        The predecessor finding labeled RT-OBJ3
        non_blocking_but_required_before_implementation_authorization. The
        successor collapses both findings to an unqualified non-blocking label
        while its positive branch permits consideration of a later
        maximum-runs-zero implementation batch. The current static task may
        defer the work, but it may not erase RT-OBJ3's implementation gate;
        RT-OBJ4 also remains the missing closest specialized baseline required
        by the Red Team contract.
      severity: blocking_before_implementation_authorization_for_RT_OBJ3
    - finding_id: archive-communication-output-capacity-fit
      verdict: PASS_EXACT_CARRY_FORWARD_REVISE_NO_FIT
      pass_gates:
        - Archive 5563755264 - 2307745600 = 3256009664 bytes over cap.
        - Communication 5614086912 - 2328717120 = 3285369792 bytes over cap.
        - Output rows sum to 15520768 and 15520768 - 8388608 = 7132160 bytes over cap.
        - No cap is raised, no required row is silently removed, and overflow invalidates without truncation.
      residual: >-
        All three residuals remain positive, so capacity fit is false. Exact
        disclosure closes omission, not feasibility. This is an apparatus and
        budget blocker with no mathematical effect on H-SYC-b854f4.
      severity: blocking_before_implementation_or_execution

