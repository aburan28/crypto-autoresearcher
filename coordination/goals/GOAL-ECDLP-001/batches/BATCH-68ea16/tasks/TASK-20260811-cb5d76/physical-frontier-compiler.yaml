    bsgs: [bsgs-0, bsgs-1, bsgs-2, bsgs-3, bsgs-4, bsgs-5, bsgs-6, bsgs-7]
    rho_and_bsgs_shard_count_change_note: >-
      RT-OBJ2 CLOSED BY EQUALIZATION. rho and bsgs are widened from five
      shards to eight, exactly matching budget.maximum_parallel_shards: 8 and
      the candidate path's own eight-way shard sets (generator, fixture,
      work, xof, verify, analysis, memory, wiring all already used eight
      shards). This removes the parallelism asymmetry RT-OBJ2 identified: the
      candidate path can no longer receive wall-time headroom purely from
      having more shards than the baselines it is compared against. Because
      aggregate_cpu_divided_by_shards is false (additive axes are always
      summed, never divided) and no class population (n_c_by_size) depends on
      shard count, this change has zero effect on any group-addition,
      logical-traffic, archive, communication, output, CPU-hour, or
      wall-second figure anywhere in this document; it only changes which
      shard a given deterministic event is assigned to and, prospectively,
      how wall_latency_ns will be computed once (if ever) an implementation
      exists. Since measured_values_present is false throughout this
      zero-run static successor, there is no pre-existing numeric
      candidate_positive_gate outcome that could have "changed" as a result
      of this repair -- none was ever computed. The repair instead ensures
      that whenever a future maximum-runs-zero implementation batch IS
      separately authorized and measurements ARE taken, the wall-time axis of
      candidate_positive_gate will be computed under matched, not asymmetric,
      parallelism from the first measurement onward.

  deterministic_event_partition:
    event_key_fields: [class_id, bits, consumer_id, event_index_within_consumer]
    consumer_order: [setup, treatment, control, candidate, rho, bsgs]
    event_order: bits_ascending_then_consumer_order_then_event_index_ascending
    shard_function: 'shard_set[(size_ordinal+global_event_index_within_class_and_size) mod shard_count]'
    shard_count: length_of_the_class_shard_set
    global_event_index: >-
      Concatenate the six consumer ranges in consumer_order. The first event is
      zero. A consumer's half-open interval begins at the sum of all preceding
      consumer counts and ends after its exact count. No hash, scheduler,
      process count, or observed result affects assignment.
    full_census_block_function: >-
      For class c and size b, q_c(b) is a block width, not a sample. Block j is
      the exact half-open event interval [j*q,min(n,(j+1)*q)). Every full block
      and the final residual block execute and are measured once. The residual
      is n mod q and is never inferred from a different prefix.
    block_to_shard_rule: events_retain_their_event_to_shard_assignment_inside_each_block
    one_prefix_extrapolation: forbidden
    unmeasured_residual: invalidates
    duplicate_or_missing_event_index: invalidates
    event_partition_choices_remaining: 0

  candidate_index_occupancy_bound:
    id: RT-OBJ1-repair
    closes: RT-OBJ1-candidate-population-cap-N-independent-vs-HA1-N-dependent-boundary
    purpose: >-
      Derive and bound candidate_index occupancy per (curve,root,model,eta)
      tuple against L(N) at all five ladder sizes, ground it in
      H-SYC-b854f4#HA-1's own boundary ("a side above 4L, combined selected
      pairs above 8L, or polynomial multiplicity invalidates the cost
      model"), and give the fixed candidate_index cap of 32 an explicit
      overflow-invalidation rule symmetric with output_caps.overflow.
    tuple_count_per_size:
      formula: 'curves(32) x roots(256) x models(4) x eta(3)'
      value: 98304
      cross_check: 'candidate_slots_per_size(3145728) / candidate_index_capacity(32) = 98304, exact'
    L_of_N:
      definition: 'L(bits) = 2^(bits/3), matching HA-1''s stated N^(1/3+o(1)) list-length model with the o(1) term realized as exactly zero on this power-of-two-bits ladder'
      by_size: {18: 64, 21: 128, 24: 256, 27: 512, 30: 1024}
    worst_case_per_tuple_occupancy_bound:
      derivation: >-
        selected_pair_comparisons (already frozen, independently reconfirmed
        by both BATCH-ea56c5 reviewers) divided by the fixed 98304 tuples per
        size equals exactly 8*(L(bits)-1) at every tested size -- this is the
        SAME quantity HA-1's own boundary names as "combined selected pairs."
        Since each examined selected-pair comparison can produce at most one
        exact-equality outcome, and no more comparisons than this occur for a
        given tuple, this count is a deterministic (assumption-free) upper
        bound on realized candidate_index occupancy for that tuple.
      identity_check: 'selected_pair_comparisons[bits] / 98304 = 8*(L(bits)-1), verified exact at all five sizes from the already-frozen row'
      by_size:
        18: {selected_pair_comparisons: 49545216, per_tuple: 504, formula_check: '8*63=504'}
        21: {selected_pair_comparisons: 99876864, per_tuple: 1016, formula_check: '8*127=1016'}
        24: {selected_pair_comparisons: 200540160, per_tuple: 2040, formula_check: '8*255=2040'}
        27: {selected_pair_comparisons: 401866752, per_tuple: 4088, formula_check: '8*511=4088'}
        30: {selected_pair_comparisons: 804519936, per_tuple: 8184, formula_check: '8*1023=8184'}
      conclusion: >-
        Under a fully adversarial, zero-probabilistic-assumption worst case,
        the fixed cap of 32 is NOT adequate at ANY of the five tested sizes
        (it is already exceeded 15.75x at the smallest size, bits=18: 504>32,
        and 255.75x at bits=30: 8184>32). This is an honest negative result,
        not a false PASS: no artifact anywhere in this document, before or
        after this repair, can certify worst-case safety of the fixed-32 cap.
    expected_case_heuristic_occupancy_bound:
      id: DERIV-1-birthday-style-match-rate
      status: producer_local_heuristic_not_part_of_H-SYC-b854f4_numbered_heuristic_assumptions
      statement: >-
        Under the standard birthday-style approximation that each examined
        selected-pair comparison A_i+B_j=Q' independently succeeds with
        probability approximately 1/N(bits) (Q' uniform over the order-N(bits)
        subgroup), consistent with HA-1's own stated assumption that "bucket
        and exact point-sum multiplicities are N^o(1)" (matches are rare,
        subpolynomial events), the expected per-tuple candidate_index
        occupancy is worst_case_per_tuple_bound(bits) / N(bits).
      validation_status: >-
        NOT independently validated by any run in this zero-execution batch
        (maximum_runs: 0 throughout). Per CLAUDE.md's requirement that a
        conditional dependence be paired with a heuristic-validation
        experiment, DERIV-1 requires a future scheduled experiment sampling
        the actual per-tuple match-rate distribution at representative scale
        and comparing it against this 1/N approximation before any claim
        conditioned on DERIV-1 may be treated as more than illustrative
        context. The overflow-invalidation rule below, not DERIV-1, is the
        apparatus's actual safety mechanism.
      by_size:
        18: {N: 262144, expected_occupancy: 0.0019226074218750, margin_vs_32: 16644.1}
        21: {N: 2097152, expected_occupancy: 0.0004844665527344, margin_vs_32: 66052.0}
        24: {N: 16777216, expected_occupancy: 0.0001215934753418, margin_vs_32: 263172.0}
        27: {N: 134217728, expected_occupancy: 0.0000304654240608, margin_vs_32: 1050628.0}
        30: {N: 1073741824, expected_occupancy: 0.0000076219439507, margin_vs_32: 4198404.0}
      conclusion: >-
        IF DERIV-1 holds, 32 remains adequate at bits=30 (the largest tested
        size) with an approximately 4.2-million-fold margin, and at every
        other tested size with margins from approximately 16,600x upward.
        This directly answers "show the fixed cap of 32 remains an adequate
        margin at bits=30" -- but only conditionally on DERIV-1, which is
        disclosed, numbered, and unvalidated, not asserted as fact.
    cap_disposition:
      decision: cap_not_raised
      rationale: >-
        This repair does NOT raise candidate_index's fixed capacity of 32
        (leaving candidate_slots_per_size=3145728, scalar_witness_verification,
        verification_group_additions, and successor_logical_traffic_bytes
        entirely unchanged). Raising the cap to the deterministic worst-case
        bound (8184 at bits=30, a 255.75x increase) would proportionally
        multiply candidate_slots_per_size and hence scalar_witness_verification
        and verification_group_additions by a similar factor, breaching the
        unchanged group_addition_hard_cap (2480101040) and
        logical_traffic_hard_cap_bytes (846134656960) -- the two of the four
        explicitly-forbidden-to-raise hard caps this change would hit first.
        Per this task's own framing, "if your candidate_index fix requires
        raising the fixed-32 cap, that changes design, not the experiment run
        budget" -- but that framing licenses raising the SLOT-CAPACITY design
        parameter only if doing so is itself budget-neutral; a 255.75x
        capacity increase is not budget-neutral once its slot-count
        consequence is traced through, so it is not exercised here.
    overflow_invalidation_rule:
      id: candidate_index_overflow
      symmetric_with: output_caps.overflow
      rule: >-
        If any (curve,root,model,eta) tuple's realized number of
        exact-equality candidates exceeds 32 in any of the three mount-state
        passes, the apparatus invalidates without truncation: no excess
        candidate is dropped, silently discarded, reassigned into another
        tuple's index range, or wrapped/overwritten. The affected
        mount-state pass and its full-census block are marked
        apparatus_invalid, consistent with this document's existing
        invalidation_rules treatment of missing or duplicate events.
      closes_observation_collision: >-
        This directly closes the KN-TECH-080 audit-2 observation-collision
        objection the red-team raised: previously a modest-gamma_s world and
        a large-gamma_s world (the interesting alternative H-SYC-b854f4
        exists to test) both produced the identical observable -- a silently
        saturated 0..31 candidate_index occupancy -- once per-tuple matches
        exceeded 32. With this rule, they no longer collide: the large-match
        world instead produces a DISTINGUISHABLE observable (an invalidated
        apparatus, per the stopping_rules already governing this document),
        which is scientifically honest even though it means such a run would
        need a redesigned, larger cap rather than a silent undercount.
    residual_status: >-
      PARTIALLY CLOSED. The "no derivation, no bound, no overflow rule"
      defect RT-OBJ1 identified is fully closed: a derivation and bound
      against L(N) now exist at all five sizes, an explicit overflow rule now
      exists, and the expected-case bound (conditional on disclosed,
      unvalidated DERIV-1) shows large margin at bits=30. What remains open,
      disclosed rather than hidden: no WORST-CASE (assumption-free) bound
      certifies 32 as safe at any tested size, and DERIV-1 is unvalidated.

