      - communication_bytes_exact
      - wiring_line_touches_lower
      - wiring_line_touches_upper
      - logical_operation_counts
      - input_digest
      - output_digest
    directed_counter_source: calibrated_hardware_counter_resolution_plus_exact_logical_census
    additive_composition: sum_all_block_lower_and_upper_bounds_across_threads_and_shards
    wall_composition: >-
      Within one chronological stage, wall is maximum shard end minus minimum
      shard start over the complete census. Across sequential stages, sum
      directed stage wall bounds. Across explicitly parallel stages, take the
      maximum. CPU is always summed and never divided.
    peak_composition: maximum_over_all_concurrently_live_stage_and_shard_snapshots
    counter_wrap_or_reset: invalidates
    missing_full_census_receipt: invalidates
    q_prefix_decision_use: forbidden

