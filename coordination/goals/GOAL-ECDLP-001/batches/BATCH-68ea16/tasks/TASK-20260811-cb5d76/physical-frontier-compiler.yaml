      - wall_end_monotonic_ns
      - energy_nJ_lower
      - energy_nJ_upper
      - physical_read_bytes_lower
      - physical_read_bytes_upper
      - physical_write_bytes_lower
      - physical_write_bytes_upper
      - peak_live_bytes_lower
      - peak_live_bytes_upper
