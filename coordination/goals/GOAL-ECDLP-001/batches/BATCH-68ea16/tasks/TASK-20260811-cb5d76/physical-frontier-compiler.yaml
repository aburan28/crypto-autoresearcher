    EXP-SYC-a59d02's physical-frontier-compiler.yaml (snapshot commit
    672e08ca06031fb6f77369db5e3f2b7658e1b7ba, sha256
    b9d86f9893d001719cdd99d5c9259be95c25c338c33825d0f8db75076b7c4be1),
    including the eight-blocker repairs both BATCH-ea56c5 reviewers
    independently reconfirmed byte-exact. This repair does NOT re-derive
    those; it only touches: (1) a new candidate_index_occupancy_bound
    section (RT-OBJ1); (2) shard_sets.rho, shard_sets.bsgs,
    byte_exact_rho_protocol.walk_assignment/epoch_merge/global_step_order,
    and byte_exact_BSGS_protocol.input_to_shard (RT-OBJ2); (3)
