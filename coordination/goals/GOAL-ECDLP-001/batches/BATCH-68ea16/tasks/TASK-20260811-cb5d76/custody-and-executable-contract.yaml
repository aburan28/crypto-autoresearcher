  physical_noninterference_equivalence:
    purpose: detect_mount_state_effect_without_demanding_impossible_counter_identity
    block_count_per_size: 32
    public_ordering_seed: >-
      A fresh 32-byte OS-CSPRNG value is generated only after the candidate-file
      snapshot is immutable and before any physical counter is read. It is
      public, placed with its generation receipt in the future actual-stream
      package, and may not be retried or selected. No value or digest is claimed
      in this zero-run design record.
    block_partition: >-
      Split each size's 3145728 ordered slots into thirty-two contiguous blocks
      of exactly 98304 slots. Each state processes every block once in a fresh
      sandbox after the same fixed cooldown and cache-reset procedure. For each
      size, order blocks and then the three states within each block by sorting
      SHA256 keys over ASCII EXP-SYC-a59d02/NONINTERFERENCE-ORDER/v1, one zero
      byte, the public ordering seed, bits U8, block U8, tag-length U8, and tag
      bytes; use BLOCK for block ordering and PUBLIC, TARGET, DECOY for state
      ordering, with digest then encoded index/tag as the collision tie-break.
      This rule has no secret, scheduler, or observed-data input.
    block_partition_domain_ascii_note: >-
      The literal ASCII domain string EXP-SYC-a59d02/NONINTERFERENCE-ORDER/v1
      is inherited unchanged as a frozen literal-vector byte (like
      point_orbit_null_v3's domain_ascii); it is not a live identifier
      reference and this task's constraints forbid editing already-reconfirmed
      literal bytes.
    charged_candidate_verifications: 47185920
    noisy_axes: [wall_latency_ns, aggregate_cpu_ns, energy_nJ, physical_read_bytes, physical_write_bytes, peak_live_bytes]
    normalization: divide_each_additive_counter_by_98304_and_keep_peak_live_as_bytes
    log_ratio_rule: >-
      For normalized nonnegative values x and y use log((x+u)/(y+u)), where u
      is exactly one unit in that normalized axis. This prospective shared
      offset handles genuine zero byte counters without dropping a block or
      selecting a transform after observation.
    comparison: >-
      For each noisy axis and each pair of mount states, form the thirty-two
      paired log ratios within every size and sort them ascending. Use the
      closed interval from the fifth through the twenty-eighth order statistic
      as a distribution-free confidence interval for the paired median. Under
      independent blocks and a continuous distribution its exact two-sided
      noncoverage is 2*sum(C(32,j),j=0..4)/2^32 =
      82898/4294967296 = 0.000019301194697618484. Ties widen or preserve the
      interval and never receive randomized breaking. No Gaussian assumption,
      fitted trimming, sign-flip enumeration, or post-data margin is allowed.
    sampling_assumption_and_audit: >-
      The interval's only stochastic assumption is that the thirty-two
      preregistered fresh-sandbox block triples are independent draws with a
      common continuous paired-log-ratio distribution after the randomized
      block/state order, fixed cooldown, and fixed cache reset. Raw ordered
      ratios, reset receipts, temperatures, frequency states, and lag-one
      plots are archived. A missing reset, adaptive rerun, cross-block mutable
      state, or evidence against this assumption invalidates the apparatus; it
      does not justify a narrower interval or become ECDLP evidence.
    equivalence_margin_log: '[-log(1.05),+log(1.05)]'
    simultaneous_family: 5_sizes_times_6_axes_times_3_state_pairs_equals_90_intervals
    familywise_rule: >-
      Bonferroni over all ninety fixed intervals gives total noncoverage at
      most 90*82898/4294967296 = 0.0017371075227856636, below the preregistered
      0.01 familywise ceiling. No independence between the ninety intervals is
      assumed; the independent-block condition applies only within an interval.
    pass_rule: every_simultaneous_interval_is_strictly_inside_the_equivalence_margin
    fail_rule: >-
      Any interval outside or touching the margin, any deterministic identity
      mismatch, any denial, or incomplete slot coverage invalidates the
      apparatus. It is not evidence about H-SYC-b854f4 or ECDLP.
    physical_counters_archived_and_fully_charged: true
    physical_counter_exact_equality_forbidden: true
    security_claim_from_equivalence: forbidden_this_is_only_a_preregistered_apparatus_gate

