  finding_by_finding_adjudication:
    - finding_id: RT-OBJ1-candidate-population-cap-N-independent-vs-HA1-N-dependent-boundary
      source: red_team
      source_task_id: TASK-20260809-3e9c18
      closure_status: PARTIALLY_CLOSED_derivation_and_overflow_rule_complete_worst_case_safety_not_provable
      what_was_missing: >-
        No artifact derived or bounded expected/worst-case per-tuple
        candidate occupancy against L(N), and the fixed-width candidate_index
        field (U8_0_through_31) carried no overflow-invalidation rule, unlike
        every other resource in the document.
      what_this_repair_adds:
        - >-
          A formal L(N) = 2^(bits/3) definition consistent with HA-1's
          N^(1/3+o(1)) list-length model, tabulated at all five ladder sizes:
          64, 128, 256, 512, 1024.
        - >-
          A deterministic, assumption-free WORST-CASE per-tuple occupancy
          bound: selected_pair_comparisons[bits]/98304 = 8*(L(bits)-1), the
          SAME quantity HA-1's own boundary names as "combined selected
          pairs above 8L ... invalidates the cost model." Tabulated: 504,
          1016, 2040, 4088, 8184 at bits 18/21/24/27/30 respectively.
        - >-
          An expected-case heuristic bound (DERIV-1, explicitly numbered,
          explicitly flagged as producer-local and NOT part of
          H-SYC-b854f4's own numbered heuristic_assumptions, explicitly
          disclosed as unvalidated by any run in this zero-execution batch)
          showing 32 remains adequate with a margin of approximately
          4,198,000x at bits=30 (the largest tested size) and at least
          16,600x at every other tested size, CONDITIONAL on that heuristic.
        - >-
          An explicit candidate_index_overflow rule, symmetric with the
          existing output_caps.overflow rule: any tuple whose realized
          candidate count exceeds 32 invalidates the apparatus without
          truncation, closing the KN-TECH-080 audit-2 observation-collision
          objection (a large-gamma_s world no longer collides with a
          modest-gamma_s world at the same silently-saturated observable).
      what_remains_open: >-
        No worst-case (assumption-free) analysis can certify 32 as adequate
        at ANY tested size -- the deterministic bound already exceeds 32 at
        bits=18 (504>32). The "32 is adequate" claim holds only conditional
        on DERIV-1, which requires a future heuristic-validation experiment
        (sampling the actual match-rate distribution at representative scale
        and comparing against the 1/N approximation) before it can be relied
        upon beyond illustrative context. This repair does NOT raise the
        candidate_index cap to the deterministic worst-case bound, because
        doing so would proportionally multiply candidate_slots_per_size and
        breach the unchanged group_addition_hard_cap and
        logical_traffic_hard_cap_bytes -- two of the four caps this batch is
        forbidden from raising.
      binding: physical-frontier-compiler.yaml#candidate_index_occupancy_bound

    - finding_id: RT-OBJ2-asymmetric-shard-parallelism-biases-wall-axis-of-positive-gate
      source: red_team
      source_task_id: TASK-20260809-3e9c18
      closure_status: FULLY_CLOSED
      what_was_missing: >-
        The candidate path used eight-way shard parallelism while the rho and
        BSGS baselines were pinned to five-way, with no hardware-tied
        justification, manufacturing wall-axis headroom on one of the two
        mandatory strict candidate_positive_gate axes independent of any real
        per-root cost advantage.
      what_this_repair_adds: >-
        shard_sets.rho and shard_sets.bsgs are widened from five to eight
        shards, exactly matching budget.maximum_parallel_shards: 8 and every
        other consumer class. byte_exact_rho_protocol.walk_assignment changes
        from walk_id_mod_5 to walk_id_mod_8; byte_exact_BSGS_protocol.input_to_shard
        changes from input_index_mod_5 to input_index_mod_8; the rho epoch-merge
        barrier and global_step_order formula are updated to match (epoch*8*1024
        instead of epoch*5*1024). Because aggregate_cpu_divided_by_shards is
        false (additive axes are always summed, never divided) and no class
        population depends on shard count, this equalization has PROVABLY
        zero effect on every group-addition, logical-traffic, archive,
        communication, output, CPU-hour, or wall-second figure in the
        document.
      why_this_is_full_not_partial_closure: >-
        Unlike the byte-accounting findings, RT-OBJ2's repair required no
        execution-dependent recomputation and no resource trade-off: it is a
        pure, zero-cost, static design choice, achievable without touching
        any hard cap. Since measured_values_present is false throughout this
        zero-run design (as it was in EXP-SYC-a59d02), no pre-existing
        numeric candidate_positive_gate outcome existed that could have
        "changed" -- there was never a computed gate result to recompute. The
        repair instead guarantees that whenever a future implementation batch
        IS separately authorized and measurements ARE taken, the wall axis
        will be computed under matched, not asymmetric, parallelism from the
        very first measurement.
      untouched_by_design: >-
        The hardware_time_shard_collision symbolic KAT (720/8/90 candidate vs
        500/5/100 rho) is deliberately left byte-identical: it is an
        illustrative literal-numbers control already independently
        reconfirmed PASS by both reviewers under PG5/PG6, unrelated to the
        real candidate/rho/BSGS shard configuration this repair actually
        touches (shard_sets, walk_assignment, input_to_shard).
      binding: physical-frontier-compiler.yaml#shard_sets.rho_and_bsgs_shard_count_change_note

    - finding_id: VAL-EA56C5-ARCHIVE-COMMUNICATION-BYTES-UNCHARGED
      source: validator
      source_task_id: TASK-20260809-db593f
      closure_status: PARTIALLY_CLOSED_disclosure_complete_capacity_fit_not_achieved
      what_was_missing: >-
        archive_scheduled_bytes (1854585088), communication_scheduled_bytes
        (1871362304), and the archive_hashing class n_c_by_size population
        were proven byte-for-byte identical to the unrepaired EXP-SYC-268d6f
        predecessor despite the successor charging 31457280 additional
        candidate verifications across two new mount-state passes elsewhere
        in the same document. The validator additionally showed the
        "archive_base_before_reserved_successor_output + 8388608" formula was
        itself a fabricated identity.
      root_cause_confirmed_by_this_repair: >-
        Reading EXP-SYC-268d6f's own physical-cost-compiler.yaml (sha256
        3000c2be3137029c2645017420f0eb693ce6a2d4ba7b309520879c5411b00c5f)
        directly confirms the validator's "reused for an unrelated purpose"
        reading: archive_base_before_reserved_successor_output was itself
        DEFINED as sum(archive_hashing.n_c_by_size) - 8388608 in that
        document's own crosswalk, meaning adding the reserved output back
        ALWAYS recovers sum(archive_hashing) regardless of whether anything
        new was ever charged -- the "identity" carried zero real information.
      what_this_repair_adds: >-
        archive_hashing's n_c_by_size (the class whose own byte_formula is
        literally "n_c_is_exact_scheduled_archive_bytes") is recharged by the
        same x3 mount-pass multiplier both reviewers already independently
        confirmed correct for its column-sibling scalar_witness_verification:
        [177118029, 357047457, 716906313, 1436624022, 2876059443], summing to
        5563755264 (versus predecessor's 1854585088). communication_scheduled_bytes
        is extended by the same multiplier (to 5614086912), explicitly
        flagged as a weaker, symmetry-only extrapolation since no dedicated
        communication-driving class exists in either compiler document. An
        alternative additive-delta derivation (modeled on
        physical_memory_topology's own confirmed approach) was also computed
        as a robustness check and produces an even LARGER figure
        (7713503488), reinforcing rather than undermining the conclusion.
      what_remains_open: >-
        The correctly-derived totals (5563755264 archive, 5614086912
        communication) exceed archive_hard_cap_bytes (2307745600) by
        3256009664 bytes and communication_hard_cap_bytes (2328717120) by
        3285369792 bytes. This batch is expressly forbidden from raising any
        inherited hard cap. Per the document's own stopping_rules, a
        hypothetical future implementation of this exact design would
        deterministically hit the archive/communication stop condition before
        completing S4/S5. This is a genuine infrastructure/budget-adequacy
        finding about EXP-SYC-a59d02's and EXP-SYC-268d6f's inherited cap
        sizing (both sized for a ONE-mount-state design, never resized for
        this THREE-mount-state design), not a mathematical result about
        H-SYC-b854f4; per AGENTS.md, infrastructure/implementation-failure
        conditions are never negative evidence for or against a hypothesis.
      what_would_close_it_fully: >-
        A future Coordinator decision, in a separate batch, either raising
        archive_hard_cap_bytes and communication_hard_cap_bytes to
        accommodate the honestly-derived totals, or narrowing scope (e.g.
        fewer archived mount-state artifacts, summarized rather than
        per-block archive hashing) to fit the unchanged caps. Neither option
        is exercised or authorized here.
      binding: physical-frontier-compiler.yaml#class_primitive_and_byte_rules.archive_hashing_mount_state_scaling

    - finding_id: VAL-EA56C5-OUTPUT-MANIFEST-UNDISCLOSED-SWAP
      source: validator
      source_task_id: TASK-20260809-db593f
      closure_status: PARTIALLY_CLOSED_disclosure_complete_capacity_fit_not_achieved
      what_was_missing: >-
        The output_caps table silently replaced the predecessor's ten
        required output artifacts (confidence-kats.json, byte-kats.json,
        null-replay.json, physical-class-allocation.json, rho-baseline.jsonl,
        dependency-closure.json, executable-hashes.json,
        noninterference-coverage.json, annotation-digests.json,
        reserved_JCS_and_newline_overhead) with five differently-named files
        that coincidentally also summed to 8388608 bytes, with no disclosed
        disposition for the nine dropped files; custody-and-executable-contract.yaml
        still required an actual-stream/noninterference-coverage.json,
        executable-universe.json, sandbox-policy.json, and up to 30 custody
        receipt files with no corresponding line in the resource crosswalk.
      what_this_repair_adds: >-
        Every one of the ten legacy files now has an explicit, individually
        justified disposition (read directly from EXP-SYC-268d6f's own
        new_output_byte_caps table, sha256
        3000c2be3137029c2645017420f0eb693ce6a2d4ba7b309520879c5411b00c5f, not
        invented): confidence-kats.json/byte-kats.json/null-replay.json
        renamed-and-consolidated into synthetic-branch-kat-replay.json (786432
        bytes, closing gate 1 of actual_stream_coverage_schema which had no
        prior budget line at all); physical-class-allocation.json and
        rho-baseline.jsonl renamed unchanged; dependency-closure.json
        superseded by executable-universe.json (1048576 bytes, matching the
        successor's own already-named manifest path); executable-hashes.json
        dropped and absorbed into executable-universe.json's per-node sha256
        fields; noninterference-coverage.json renamed to
        actual-stream/noninterference-coverage.json (2097152 bytes, matching
        custody-and-executable-contract.yaml's own named path);
        annotation-digests.json dropped and absorbed into
        full_census_counter_contract's existing per-block input/output digest
        fields; reserved_JCS_and_newline_overhead consolidated into the
        successor's own actual-stream/coverage-counters-receipts-and-JCS-overhead
        file. New output-budget lines are added for every artifact
        custody-and-executable-contract.yaml requires but that had no
        crosswalk line: sandbox-policy.json (8192 bytes, bottom-up estimate
        from the 37-syscall seccomp allowlist plus rlimits/layer metadata)
        and a consolidated custody-receipt line (46080 bytes, ~1536
        bytes/receipt x up to 30 receipts, grounded in the already-frozen
        389-byte minimal replay_receipt_KAT scaled up for full production
        fields and a two-signer Ed25519 signatures block).
      what_remains_open: >-
        The full, honestly-disclosed sum of every required file is 15520768
        bytes, exceeding the currently declared output_caps total (8388608
        bytes) by 7132160 bytes. This batch is forbidden from raising that
        cap. This is the SAME infrastructure/budget-adequacy finding class as
        the archive/communication residual above and shares its root cause:
        the inherited cap was sized for a one-mount-state, custody-incomplete
        predecessor and was never resized for this design's genuinely
        three-mount-state, custody-complete scope.
      what_would_close_it_fully: >-
        A future Coordinator decision, in a separate batch, either raising
        output_caps.total_bytes, or trimming scope (e.g. fewer than 30
        custody receipts via seed-class consolidation, a summarized rather
        than per-block noninterference-coverage.json). Neither is exercised
        or authorized here.
      binding: physical-frontier-compiler.yaml#output_caps

  cross_finding_observation: >-
