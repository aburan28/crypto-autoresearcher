    successor generations (EXP-SYC-a59d02, now EXP-SYC-12de89) despite the
    successor design genuinely tripling mount-state coverage and adding a
    full custody/manifest/coverage artifact set. Correctly charging the
    disclosed work (archive/communication) and correctly disclosing every
    required artifact (output) both independently and consistently reveal
    the SAME underlying inadequacy. This repair treats "fix the silent
    non-disclosure" and "fix the cap-fit" as two SEPARABLE problems: it
    fully and honestly solves the first (no more byte-identical-to-predecessor
    non-charging, no more undisclosed file swap) while leaving the second
    disclosed, quantified, and explicitly out of this batch's authority
    (raising a hard cap is not something a design-repair batch may do
    unilaterally; it requires its own Coordinator decision and, per the
    program's general bias toward honest accounting over convenient
    numbers, should not be decided inside the same batch that just proved
    the shortfall).

