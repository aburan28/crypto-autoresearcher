required_successor_repairs:
  - Derive and bound candidate_index occupancy per (curve,root,model,eta) tuple against L(N) at all five ladder sizes (18/21/24/27/30 bits), showing 32 remains adequate at bits=30, and add a candidate_index overflow-invalidation rule symmetric with the existing output-byte overflow rule. Closes RT-OBJ1.
  - Either equalize shard parallelism between the candidate path and the rho/BSGS baselines, or recompute and document wall_latency_ns at matched parallelism and confirm whether candidate_positive_gate's outcome changes. Closes RT-OBJ2.
  - Recompute archive_scheduled_bytes, communication_scheduled_bytes, and the archive_hashing class n_c_by_size population so they reflect the newly charged mount-state verification passes. Closes VAL-EA56C5-ARCHIVE-COMMUNICATION-BYTES-UNCHARGED.
  - Give the output_caps table an explicit, disclosed disposition (renamed / superseded / dropped, each with a traceable byte budget) for all required output artifacts, including the custody, manifest, and coverage artifacts custody-and-executable-contract.yaml itself requires. Closes VAL-EA56C5-OUTPUT-MANIFEST-UNDISCLOSED-SWAP.
scope:
