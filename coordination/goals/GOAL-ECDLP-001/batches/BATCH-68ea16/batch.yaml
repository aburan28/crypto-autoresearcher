    - one new immutable successor specification EXP-SYC-12de89 and its design-repair report
    - a derived, bounded candidate_index occupancy model against L(N) at all five ladder sizes with an explicit overflow-invalidation rule
    - either equalized candidate/baseline shard parallelism, or a matched-parallelism wall-axis recomputation with a documented gate-outcome check
    - recomputed archive_scheduled_bytes, communication_scheduled_bytes, and archive_hashing class population reflecting all newly charged work
    - an explicit, disclosed, traceable-byte-budget disposition for every required output, custody, manifest, and coverage artifact
    - fresh independent Validator and Red Team review at review-adversarial xhigh
  excluded:
