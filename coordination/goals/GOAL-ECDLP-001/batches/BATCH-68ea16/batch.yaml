predecessor_disposition: >-
  EXP-SYC-a59d02 remains at status review_required and is never edited. It is
  superseded only by a new immutable record. Its independently reconfirmed
  eight-blocker repairs (the RFC 8439 ChaCha20-Poly1305 production envelope
  KAT, the deterministic event-to-shard function and 28-row consumer
  allocation matrix, the byte-exact rho/BSGS finite frontier with the positive
  gate applied to both baselines, the canonical 19-bit-field null-point KAT,
  the honest lifecycle self-correction, and the verification-count and
  downstream arithmetic identities) are preserved, not retracted.
blocking_findings:
  - id: RT-OBJ1-candidate-population-cap-N-independent-vs-HA1-N-dependent-boundary
    source: red-team
    source_task_id: TASK-20260809-3e9c18
    severity: blocking
    summary: >-
      candidate_slots_per_size = 3,145,728 (= 32 curves x 256 roots x 4 models
      x 3 eta x 32 fixed candidate_index slots) is held flat across all five
      tested order sizes (18/21/24/27/30 bits) while H-SYC-b854f4's own HA-1
      selector-regularity boundary is explicitly N-dependent and unbounded
      ("selected pairs above 8L invalidates the cost model"), and the
      N-dependent list-processing classes feeding the same candidates grow by
      a recomputed ~16.24x across the ladder. No artifact derives or bounds
      expected/worst-case per-tuple candidate occupancy against L(N), and the
      fixed-width candidate_index field carries no overflow-invalidation
      rule, unlike every other resource in the document.
  - id: RT-OBJ2-asymmetric-shard-parallelism-biases-wall-axis-of-positive-gate
    source: red-team
    source_task_id: TASK-20260809-3e9c18
    severity: blocking
    summary: >-
      The candidate path's consumer classes all use 8-way shard sets
      (budget.maximum_parallel_shards: 8) while the rho and BSGS baselines are
      pinned to 5-way shard sets with no hardware-tied justification.
      candidate_positive_gate requires strict dominance on both
      aggregate_cpu_ns (shard-invariant) AND wall_latency_ns (NOT
      shard-invariant), so giving the candidate up to 8 shards against a
      5-shard baseline manufactures headroom on one of the two mandatory
      strict axes independent of any real per-root cost advantage.
  - id: VAL-EA56C5-ARCHIVE-COMMUNICATION-BYTES-UNCHARGED
    source: validator
    source_task_id: TASK-20260809-db593f
    severity: blocking
    summary: >-
      archive_scheduled_bytes (1,854,585,088), communication_scheduled_bytes
      (1,871,362,304), and the archive_hashing class n_c_by_size vector
      ([59039343, 119015819, 238968771, 478874674, 958686481]) are
      byte-for-byte identical to the unrepaired predecessor EXP-SYC-268d6f
      figures despite the successor charging 31,457,280 additional candidate
      verifications across two new mount-state passes elsewhere in the same
      document.
  - id: VAL-EA56C5-OUTPUT-MANIFEST-UNDISCLOSED-SWAP
    source: validator
    source_task_id: TASK-20260809-db593f
    severity: blocking
    summary: >-
      The output_caps table silently replaces the predecessor's ten required
      output artifacts (confidence-kats.json, byte-kats.json,
      null-replay.json, physical-class-allocation.json, rho-baseline.jsonl,
      dependency-closure.json, executable-hashes.json,
      noninterference-coverage.json, annotation-digests.json, reserved_JCS
      and newline overhead) with five differently-named files that
      coincidentally sum to the same 8,388,608 bytes, with no disclosed
      disposition for the nine dropped files; custody-and-executable-contract.yaml
      still independently requires an actual-stream/noninterference-coverage.json,
      an executable-universe.json, a sandbox-policy.json, and up to 30 custody
      receipt files with no corresponding line in the resource crosswalk.
