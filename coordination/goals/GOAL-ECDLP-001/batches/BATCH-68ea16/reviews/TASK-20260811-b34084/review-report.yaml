  finding_by_finding_adjudication:
    - finding_id: RT-OBJ2-asymmetric-shard-parallelism-biases-wall-axis-of-positive-gate
      producer_claimed_status: FULLY_CLOSED
      independent_adjudication: CONFIRMED_FULLY_CLOSED
      independent_recomputation: >-
        shard_sets.rho now lists eight shard IDs (rho-shard-0..7, was
        rho-shard-0..4) and shard_sets.bsgs now lists eight (bsgs-0..7, was
        bsgs-0..4); both match budget.maximum_parallel_shards: 8, confirmed
        present and unchanged (value 8) in specification.yaml. walk_assignment
        changed from walk_id_mod_5 to walk_id_mod_8, input_to_shard from
        input_index_mod_5 to input_index_mod_8, and global_step_order's
        multiplier from 5 to 8, all consistently. A full line-level diff of
        this successor's physical-frontier-compiler.yaml against the
        immediate predecessor's (byte-hash-confirmed 672e08ca0...) shows the
        ONLY sections that differ anywhere in the document are exactly the
        five the repair_scope_note names; no group-addition, logical-traffic,
        archive, communication, output, CPU-hour, or wall-second figure
        changes anywhere as a side effect of the shard widening. The claim
        that this has "PROVABLY zero effect" is independently confirmed true,
        and is true for the reason the document itself gives: no numeric
        wall_latency_ns value exists anywhere in this document for rho or
        bsgs to be biased (measured_values_present: false; rho_wall_interval
        and bsgs_wall_interval remain symbolic formulas, never evaluated to a
        number). The one numeric shard/CPU/wall example in the document,
        hardware_time_shard_collision, is confirmed byte-identical to the
        predecessor, correctly left untouched as a labeled illustrative
        control unrelated to the real candidate/rho/bsgs configuration.
      concurrence: true

    - finding_id: RT-OBJ1-candidate-population-cap-N-independent-vs-HA1-N-dependent-boundary
      producer_claimed_status: PARTIALLY_CLOSED_derivation_and_overflow_rule_complete_worst_case_safety_not_provable
      independent_adjudication: PARTIALLY_CLOSED_CONFIRMED_WITH_ONE_ARITHMETIC_DISCREPANCY
      independent_recomputation: >-
        tuple_count_per_size independently recomputed as 32*256*4*3=98304,
        matching, and 98304*32=3145728 cross-checks against
        candidate_slots_per_size exactly. L(bits)=2^(bits/3) independently
        recomputed as {18:64,21:128,24:256,27:512,30:1024}, matching. The
        worst-case bound selected_pair_comparisons[bits]/98304 was
        independently recomputed against the class_population_table's own
        selected_pair_comparisons row (49545216, 99876864, 200540160,
        401866752, 804519936) and divides EXACTLY (zero remainder) at all
        five sizes, giving 504, 1016, 2040, 4088, 8184 -- matching the
        claimed 8*(L(bits)-1) formula exactly at every size. H-SYC-b854f4's
        HA-1 boundary text was independently read from
        ledger/hypotheses/H-SYC-b854f4.yaml and confirmed to read verbatim
        "A side above 4L, combined selected pairs above 8L, or polynomial
        multiplicity invalidates the cost model" -- the producer's citation is
        accurate, and grounding the derivation in HA-1's own named quantity
        ("combined selected pairs") rather than an invented one is a sound,
        non-arbitrary choice; the fact that the realized value equals exactly
        8*(L-1) (one L-unit under HA-1's own stated 8L ceiling) at every
        tested size independently confirms this is a real structural property
        of the four-list mechanism, not a coincidence or a cherry-picked
        formula. The overflow_invalidation_rule text was independently
        checked against output_caps.overflow: both use the identical policy
        wording "invalidates_without_truncation" -- the claimed symmetry is
        accurate. DERIV-1's expected-case table was independently recomputed
        at all five sizes using exact rational arithmetic (Python
        fractions.Fraction) to avoid float rounding: bits=18, 21, 24, and 30
        reproduce the claimed expected_occupancy and margin_vs_32 values
        exactly (to float64 precision). BITS=27 DOES NOT: the claimed
        expected_occupancy (0.0000304654240608) differs from the independently
        recomputed value (4088/134217728 = 0.0000304579734802) by
        7.45e-9 in absolute terms (about 0.025% relative), which is not
        floating-point noise -- it is outside float64 precision for this
        computation. The SAME row's margin_vs_32 field (claimed 1050628.0) IS
        consistent with the CORRECT expected_occupancy value (32 /
        0.0000304579734802 = 1050628.008, rounds to 1050628.0), not with the
        erroneous occupancy literal (32 / 0.0000304654240608 = 1050371.07,
        which would round to 1050371.0). This shows the error is an isolated
        arithmetic slip in the one expected_occupancy literal at bits=27, not
        a wholesale re-derivation using a wrong per_tuple or N value elsewhere
        in the row. It does not change DERIV-1's qualitative conclusion
        (margin remains on the order of 10^6 either way), and DERIV-1 is
        already, independently of this finding, explicitly disclosed as an
        unvalidated, producer-local heuristic not part of H-SYC-b854f4's own
        numbered heuristic_assumptions -- so no claim of fact rests on the
        erroneous literal. The cap_disposition rationale (raising
        candidate_index's cap would proportionally raise
        candidate_slots_per_size and breach group_addition_hard_cap /
        logical_traffic_hard_cap_bytes) is independently plausible given the
        confirmed-unchanged 2480101040 / 846134656960 caps and the confirmed
        3,145,728-per-size candidate population, though not separately
        re-derived to the last digit within this review's scope.
      concurrence_on_partial_vs_full: true
      concurrence_on_underlying_arithmetic: false
      disagreement_detail: >-
        The DERIV-1 by_size table's bits=27 expected_occupancy literal fails
        independent recomputation (see above). This is a genuine, if minor
        and non-consequential, defect: the document does not, in fact,
        reproduce exactly at every claimed literal, contrary to what a
        careless reading of "identity_check: verified exact at all five
        sizes" (which refers to the worst_case bound, correctly verified
        exact) could be conflated with for the DERIV-1 table below it.

    - finding_id: VAL-EA56C5-ARCHIVE-COMMUNICATION-BYTES-UNCHARGED
      producer_claimed_status: PARTIALLY_CLOSED_disclosure_complete_capacity_fit_not_achieved
      independent_adjudication: PARTIALLY_CLOSED_CONFIRMED
      independent_recomputation: >-
        EXP-SYC-268d6f's physical-cost-compiler.yaml was independently
        re-extracted via `git show 2ee0c160a8...` and its sha256
        independently recomputed as
        3000c2be3137029c2645017420f0eb693ce6a2d4ba7b309520879c5411b00c5f,
        matching the citation exactly. That file's archive_hashing row was
        read directly: n_c_by_size=[59039343,119015819,238968771,478874674,
        958686481], n_c=1854585088 -- confirmed byte-identical to what the
        prior BATCH-ea56c5 Validator found unrepaired in EXP-SYC-a59d02, and
        confirmed this is what the successor's x3 multiplier is applied to.
        archive_base_before_reserved_successor_output (1846196480, present in
        EXP-SYC-a59d02's file, independently diffed out in this successor)
        was independently verified to equal
        sum(archive_hashing.n_c_by_size)-8388608 = 1854585088-8388608 =
        1846196480 exactly, confirming the prior Validator's "fabricated
        identity" reading (the +8388608 decomposition always trivially
        recovers archive_hashing's own total regardless of any new charge).
        The x3 multiplier applied to each of the five predecessor
        archive_hashing values independently recomputes to exactly
        [177118029,357047457,716906313,1436624022,2876059443], summing to
        5563755264 -- matching every claimed figure exactly, including
        resource_crosswalk's mirrored copies. The claim that this is the
        "same x3 multiplier both reviewers independently confirmed correct
        for scalar_witness_verification" was independently checked: deep
        predecessor scalar_witness_verification n_c_by_size
        [3145734,3145728,3145728,3145728,3145728] (one mount pass) times
        three plus a 6-KAT adjustment at bits=18 gives exactly
        [9437190,9437184,9437184,9437184,9437184], the value already present
        unchanged in this successor and both prior BATCH-ea56c5 reports'
        PG1/verification-count gates -- confirmed. archive_hashing and
        scalar_witness_verification were independently confirmed to share
        the "candidate" consumer column in consumer_allocation_matrix
        (both {all_to: candidate}), supporting the analogy but not proving
        it: as the producer itself discloses, no artifact states
        archive_hashing's per-verification byte formula explicitly, so the x3
        figure remains an inference, not a provable identity. The alternative
        additive-delta robustness check was independently recomputed:
        1854585088 + 5*1171783680 = 7713503488, matching the claimed
        7713503488 exactly and confirming it is larger than the x3 figure,
        which is independently verified to mean the "genuinely over cap"
        conclusion is robust to which of the two disclosed derivations is
        used -- though the producer's chosen headline figure (x3,
        5563755264) is the SMALLER of the two, meaning the reported shortfall
        is, if anything, the more conservative (understated-severity, not
        overstated) of the two disclosed candidates. archive_hard_cap_bytes
        (2307745600) and communication_hard_cap_bytes (2328717120) are
        independently confirmed unchanged from the deep predecessor via
        direct grep of both files. Over-cap arithmetic independently
        recomputes exactly: 5563755264-2307745600=3256009664 and
        5614086912-2328717120=3285369792.
      concurrence: true

    - finding_id: VAL-EA56C5-OUTPUT-MANIFEST-UNDISCLOSED-SWAP
      producer_claimed_status: PARTIALLY_CLOSED_disclosure_complete_capacity_fit_not_achieved
      independent_adjudication: PARTIALLY_CLOSED_CONFIRMED
      independent_recomputation: >-
        All ten legacy output files and their byte figures were independently
        read from EXP-SYC-268d6f's own new_output_byte_caps table (same
        independently-verified sha256 3000c2be...): confidence-kats.json
        131072, byte-kats.json 524288, null-replay.json 131072,
        physical-class-allocation.json 1048576, rho-baseline.jsonl 2097152,
        dependency-closure.json 1048576, executable-hashes.json 131072,
        noninterference-coverage.json 2097152, annotation-digests.json
        1048576, reserved_JCS_and_newline_overhead 131072 -- every one matches
        the successor's predecessor_disclosed_disposition table exactly, and
        independently sums to 8388608 as both documents claim. Every one of
        the ten legacy files was independently confirmed to have an explicit
        disposition entry (renamed_unchanged / renamed / renamed_and_
        consolidated / superseded / dropped_absorbed), none silently missing.
        The successor's output_caps.rows (12 entries) were independently
        summed and reproduce the claimed sum_check of 15520768 exactly.
        synthetic-branch-kat-replay.json's 786432-byte figure was
        independently confirmed to equal the exact sum of the three
        consolidated legacy files (131072+524288+131072=786432), not an
        arbitrary number. The custody-receipt line (46080 bytes) was
        independently confirmed to equal 1536*30 exactly, and the "30"
        (6 receipt types x 5 seed classes) was independently confirmed by
        parsing custody-and-executable-contract.yaml's receipt_lifecycle
        (6 stages: custody-open, snapshot-bound, independent-replay,
        ledger-bound, retention-close, destruction) and seed_classes (public,
        target, decoy, restart, null) -- 6x5=30, matching exactly.
        physical-class-allocation.json and rho-baseline.jsonl's
        renamed_unchanged dispositions preserve their exact predecessor byte
        figures. executable-universe.json inherits dependency-closure.json's
        exact 1048576-byte budget as claimed. Over-cap arithmetic
        independently recomputes exactly: 15520768-8388608=7132160.
        sandbox-policy.json's 8192-byte figure is explicitly disclosed as a
        "bottom-up estimate," not a formula-checkable figure, so it is not
        independently falsifiable to the byte -- but its supporting prose
        cites a "37-syscall seccomp allowlist." Independently parsing
        custody-and-executable-contract.yaml's actual
        linux_x86_64_syscall_allowlist (via YAML, not a manual count) gives
        40 entries, not 37, in both this successor's file and the
        byte-identical predecessor's file (confirmed identical between the
        two). This "37" figure originates from the prior BATCH-ea56c5
        Validator's own report (also uncorroborated there) and is repeated
        here without independent re-verification; it does not change the
        8192-byte estimate (which is disclosed as an estimate, not derived
        from a syscall count formula) or any sum_check total, so it is
        informational, not a residual-affecting defect.
      concurrence: true

  cross_finding_independent_observation: >-
