    REVISE. EXP-SYC-12de89's frozen snapshot at commit
    d0041fe73b90e9e1827c8b13ff144888bc1a4f25 is durably bound, strictly
    parses, and touches exactly the five sections its repair_scope_note
    claims to touch (independently confirmed by a full diff against the
    hash-verified predecessor, not a sampled check). Of the four findings
    DEC-20260809-e35473 required closed, RT-OBJ2 (shard parallelism
    asymmetry) is independently confirmed genuinely and fully closed with
    zero side effects on any other figure. RT-OBJ1 (candidate-index
    occupancy), VAL-EA56C5-ARCHIVE-COMMUNICATION-BYTES-UNCHARGED, and
    VAL-EA56C5-OUTPUT-MANIFEST-UNDISCLOSED-SWAP are not: this successor
    converts each from a silently broken or undisclosed defect into an
    honestly, precisely, and largely conservatively quantified residual --
    real, independently-verifiable progress -- but the underlying
    requirement (close within unchanged caps) is not met, and the producer's
    own PARTIAL_STATIC_REPAIR_WITH_DISCLOSED_RESOURCE_CAP_RESIDUALS_FOR_
    INDEPENDENT_REVIEW verdict already says so; this review does not find
    that self-characterization to be an overclaim. One independent
    recomputation disagreement was found (the DERIV-1 bits=27
    expected_occupancy literal), isolated and non-consequential given
    DERIV-1's already-disclosed unvalidated status. This is a design-level
    outcome requiring either a further versioned successor that narrows
    scope to fit the unchanged caps, or a separate Coordinator decision
    raising archive_hard_cap_bytes, communication_hard_cap_bytes, and
    output_caps.total_bytes, before dual independent review could support
    any Coordinator decision toward a maximum-runs-zero implementation
    batch; execution_authorized=false and implementation_authorized=false
    remain mandatory, and no hypothesis, evidence, goal, or ECDLP conclusion
    follows from this report.
