  verdict_summary: >-
    REVISE. This is a design-gate review of a zero-run static repair snapshot;
    it authorizes no implementation or execution regardless of outcome. Every
    literal number this producer claims to have derived or recomputed was
    independently re-derived from the committed bytes with Python (arithmetic,
    YAML parsing, hashing) rather than re-read from the producer's stated
    equalities, per this task's constraint. Of the four findings
    DEC-20260809-e35473 named, exactly ONE -- RT-OBJ2 (asymmetric shard
    parallelism) -- is genuinely and fully closed: shard_sets.rho and
    shard_sets.bsgs are independently confirmed widened from five to eight
    shards (matching the candidate path and budget.maximum_parallel_shards:8),
    and a full diff of this file against the immediate predecessor confirms
    the equalization has zero effect on every group-addition, logical-traffic,
    archive, communication, output, CPU-hour, or wall-second figure in the
    document, exactly as claimed, because no numeric wall value exists
    anywhere in this zero-run snapshot for shard-count to bias
    (measured_values_present: false throughout). The other three findings
    (RT-OBJ1, VAL-EA56C5-ARCHIVE-COMMUNICATION-BYTES-UNCHARGED,
    VAL-EA56C5-OUTPUT-MANIFEST-UNDISCLOSED-SWAP) are NOT genuinely closed by
    this successor, and the producer's own design-repair-report.yaml agrees --
    it self-labels PARTIALLY_CLOSED for all three, not FULLY_CLOSED, and its
    own producer_verdict is PARTIAL_STATIC_REPAIR_WITH_DISCLOSED_RESOURCE_CAP_
    RESIDUALS_FOR_INDEPENDENT_REVIEW, not a zero-residual PASS claim.
    Independent recomputation confirms every one of the producer's claimed
    numbers on these three findings reproduces exactly, with one exception:
    the RT-OBJ1 DERIV-1 table's expected_occupancy literal at bits=27
    (claimed 0.0000304654240608) does NOT match independent recomputation of
    the document's own formula (4088/134217728 = 0.0000304579734802); the
    row's own margin_vs_32 field (1050628.0) is consistent with the CORRECT
    value, not the erroneous one, showing this is an isolated arithmetic slip
    in one literal, not a wholesale re-derivation error, and it does not
    change the qualitative "large margin" conclusion of an already-disclosed,
    unvalidated heuristic. All other archive/communication/output arithmetic
    (the x3 archive_hashing multiplier, the additive-delta robustness check,
    the ten-legacy-file output disposition table, and every over-cap figure)
    independently reproduces exactly, including against the deep predecessor
    EXP-SYC-268d6f's own physical-cost-compiler.yaml (sha256
    3000c2be3137029c2645017420f0eb693ce6a2d4ba7b309520879c5411b00c5f,
    independently recomputed and confirmed). DEC-20260809-e35473 asked this
    successor to close all four findings "within unchanged caps"; the honest,
    independently-reproduced arithmetic shows this is not achievable as
    scoped: the correctly-recharged archive_scheduled_bytes (5563755264) and
    communication_scheduled_bytes (5614086912) exceed their unchanged hard
    caps by 3256009664 and 3285369792 bytes respectively, and the honestly
    disclosed output/custody/manifest/coverage budget (15520768 bytes)
    exceeds the unchanged output_caps total (8388608) by 7132160 bytes. This
    REVISE is issued because three of four named findings remain open by
    DEC-20260809-e35473's own closure bar, not because of any fabrication,
    hidden defect, or understated residual: this repair converts three
    silently-broken or undisclosed defects into honestly, precisely, and (in
    the archive/communication case) conservatively quantified residuals, which
    is real and verifiable progress, but is not the same thing as closure.

