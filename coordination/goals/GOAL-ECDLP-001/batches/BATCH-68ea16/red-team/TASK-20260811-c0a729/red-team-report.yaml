    - id: PG5-honest-non-closure-framing
      description: >-
        producer_verdict, design_verdict, and exact_residuals (total_static_residual_count: 3)
        correctly avoid asserting a false zero-residual PASS_STATIC; the
        archive/communication/output over-cap residuals are explicitly
        separated from the "silent non-charging" defect that was actually
        fixed, consistent with CLAUDE.md's cost-and-scope-honesty bias and
        AGENTS.md's rule that infrastructure/budget-adequacy findings are not
        evidence against the hypothesis.

  objections:
    - id: OBJ1-DERIV1-uncalibrated-against-H-SYC-b854f4s-own-adopted-HA2-heuristic
      severity: blocking
      description: >-
        DERIV-1 ("expected_case_heuristic_occupancy_bound") assumes each of
        the ~8*(L(bits)-1) charged selected_pair_comparisons events
        independently succeeds with probability approximately 1/N(bits), and
        reports margins of 16,644x (bits=18) rising to ~4,198,404x (bits=30)
        against the fixed cap of 32. This heuristic is disclosed as
        "producer_local," "not part of H-SYC-b854f4's own numbered
        heuristic_assumptions," and "NOT independently validated" -- that
        much is honest. What is NOT disclosed: DERIV-1 is not merely
        unvalidated in a generic sense, it is INTERNALLY INCONSISTENT with
        H-SYC-b854f4's own already-adopted, numbered heuristic HA-2
        (E[X]=N^(-1/3+gamma_x+o(1)), ledger/hypotheses/H-SYC-b854f4.yaml and
        its mathematical source IDEA-20260808-917e63.yaml, both already in
        this task's own read_scope) for the SAME quantity, and was never
        evaluated at H-SYC-b854f4's own decision-changing threshold
        (gamma_x>5/18) or theoretical ceiling (gamma_x<=1/3, per
        H-SYC-b854f4's own method_ceiling: "Since p_N<=1, gamma_s<=1/3").
        Independent recomputation (Python, exact): at the NULL point
        gamma_x=0 (the case DERIV-1 implicitly approximates), HA-2's own
        formula gives margins of 2048x (bits=18) to 32,768x (bits=30) --
        SMALLER than DERIV-1's own reported null-case margins by a factor of
        exactly L(bits)/8 (8x at bits=18, 128x at bits=30) -- meaning DERIV-1
        does not even correctly reproduce the null case it is meant to model.
        At the DECISION-CHANGING threshold gamma_x=5/18 -- the exact
        parameter value this whole hypothesis and experiment exist to test --
        HA-2's own formula gives margins of only 64x (bits=18) to 101.6x
        (bits=30): two to three orders of magnitude smaller than the
        disclosed "4.2-million-fold." At the theoretical ceiling gamma_x=1/3,
        the margin is a CONSTANT exactly 32.0x at every tested size (it does
        not grow with N, unlike DERIV-1's reported trend) -- a razor-thin
        margin the disclosure never computes, states, or acknowledges.
      proof_architecture_framing: >-
        This is CLAUDE.md's exemplar "random-model transfer" challenge (item
        2): DERIV-1 borrows a generic, uniform "1/N" random-model
        justification for a STRUCTURED quantity (signed-y selected-pair exact
        matches) that the SAME document set's own numbered heuristic HA-2
        already predicts deviates from that generic model in exactly the
        decision-relevant direction (positive gamma_x is the interesting
        alternative). It is also a second-order KN-TECH-080 audit-2
        (observation-collision) residual distinct from the original RT-OBJ1
        collision: the original collision was about SILENT saturation (now
        formally fixed by the overflow-invalidation rule); this is about
        whether the apparatus's disclosed SAFETY-MARGIN CONFIDENCE survives
        being evaluated at the world the hypothesis targets. It does not
        collapse to overflow at the tested toy sizes (see
        narrowest_supported_statement), but the confidence figure disclosed
        (millions-fold) materially overstates the actually-relevant margin
        (double-to-triple-digit-fold), which is exactly the kind of
        overstated-safety-margin defect the exemplar heuristic-transfer
        challenge exists to catch.
      residual_status: >-
        NEWLY IDENTIFIED by this review; not raised by the predecessor
        Red Team's RT-OBJ1 (which challenged the ABSENCE of any
        derivation/bound/overflow rule, not the calibration of the
        expected-case heuristic this producer added to fill that absence).
        Also newly relevant: no artifact in the five reviewed files, in
        H-SYC-b854f4.yaml, or in its mathematical source explicitly states
        whether H-SYC-b854f4's per-root X and the compiler's per-
        (curve,root,model,eta)-tuple candidate_index occupancy are the same
        quantity, a divided quantity, or otherwise related -- an unstated
        correspondence DERIV-1 (or any HA-2-based replacement) needs before
        it can be checked precisely at all.

    - id: OBJ2-peak_live_bytes-shard-sensitivity-unaudited-by-RT-OBJ2-repair
      severity: moderate
      description: >-
        The RT-OBJ2 repair's own justification claims the 5-to-8-way shard
        widening for rho/BSGS "has PROVABLY zero effect on every
        group-addition, logical-traffic, archive, communication, output,
        CPU-hour, or wall-second figure in the document" (wall is separately,
        correctly acknowledged as the one axis that DOES change). This
        enumeration silently omits peak_live_bytes -- the ONLY OTHER
        non-additive comparison axis among the nine mandatory
        candidate_positive_gate axes (axes.maximum: [peak_live_bytes], versus
        axes.additive's seven summed axes and axes.chronological's
        wall_latency_ns). The document's own peak_composition rule is
        "maximum_over_all_concurrently_live_stage_and_shard_snapshots" --
        structurally a function of how many shards are concurrently live, not
        a pure per-class charge. For BSGS specifically,
        parallelism_within_one_input is 1 and shard_count partitions the 32
        inputs across shards (input_index_mod_8 now, was mod_5); if each
        shard processes its assigned inputs sequentially, going from 5 to 8
        concurrent shards means 8 (not 5) baby-step tables of size
        m=ceil(sqrt(r)) can be concurrently live at once, a plausible ~8/5x
        increase in bsgs's peak_live_bytes purely from the shard-count
        change, independent of any real algorithmic difference. No formula,
        derivation, or disclosure anywhere in the repaired document addresses
        this.
      proof_architecture_framing: >-
        A completeness gap in the baseline_reproduction / method_ceiling
        axis: the finite rho/BSGS embedding's claim to be a fully fair,
        matched-parallelism comparison is verified for 8 of 9 axes but not
        the 9th, and the repair's own summary language overclaims
        ("every ... figure") beyond what it demonstrates.
      residual_status: >-
        NEWLY IDENTIFIED. Non-blocking to this batch's static-review
        admissibility, since measured_values_present is false everywhere in
        this document and no live peak_live_bytes number is asserted or
        contradicted; blocking only to accepting the literal "provably zero
        effect on every figure" claim as written. The plausible DIRECTION of
        the bias (more concurrent baseline shards -> larger baseline peak ->
        easier, not harder, for a candidate to be non-worse on that axis)
        does not favor an unfair candidate win, unlike the original RT-OBJ2
        asymmetry; this is a rigor/disclosure gap, not a fairness threat in
        the candidate's favor.

    - id: OBJ3-RT-OBJ3-RT-OBJ4-deferred-status-not-recorded
      severity: advisory
      description: >-
        DEC-20260809-e35473's next_actions and this batch's own dispatch
        queue (TASK-20260811-cb5d76's constraints) both explicitly instruct:
        "RT-OBJ3 (crossover-N estimate) and RT-OBJ4 (k-list/generalized-birthday
        baseline) are OUT OF SCOPE for this task; note them as deferred, not
        dropped." A text search of all five reviewed artifacts for "OBJ3",
        "OBJ4", "crossover-N", "k-list", "Wagner", "non_blocking", "advisory",
        and "deferred" returns zero matches (the one incidental "crossover"
        hit is the unrelated symbolic 1/6-5/18-7/9 identity). Nothing in the
        successor records that OBJ3/OBJ4 remain open, non-blocking findings;
        a reader of EXP-SYC-12de89 in isolation, without also reading
        BATCH-ea56c5's checkpoint, would not know they exist.
      proof_architecture_framing: >-
        method_ceiling audit: unchanged from the predecessor in substance
        (OBJ3's underlying question -- is there any evidence the 18-30-bit
        ladder can ever reach a regime where candidate_positive_gate could
        pass -- remains completely unaddressed, exactly as before), but this
        successor also fails the narrower, purely bookkeeping instruction to
        record that fact.
      residual_status: >-
        NEWLY IDENTIFIED, cheap compliance gap; a one-line addition to
        design-repair-report.yaml or specification.yaml closes it.

  required_controls:
    - control: recompute-candidate_index-margin-from-H-SYC-b854f4s-own-HA-2-heuristic
      purpose: closes OBJ1
      action: >-
        Before treating RT-OBJ1's "32 remains adequate" conclusion as
        adequately validated, recompute (or supersede) the expected-case
        margin using H-SYC-b854f4's own already-adopted HA-2 formula
        E[X]=N^(-1/3+gamma_x+o(1)) evaluated at gamma_x=5/18 (decision
        threshold, giving margins of approximately 64x-102x across the
        ladder) and gamma_x=1/3 (theoretical ceiling, giving a constant
        margin of exactly 32x), state both numbers alongside or in place of
        DERIV-1's null-inconsistent 16,644x-4,198,404x figures, and
        explicitly define the correspondence between H-SYC-b854f4's per-root
        X and the compiler's per-(curve,root,model,eta)-tuple candidate_index
        occupancy (currently undefined in any reviewed artifact). This is a
        symbolic substitution into already-committed formulas, not a new
        experiment.
    - control: peak_live_bytes-shard-invariance-derivation-or-disclosure
      purpose: closes OBJ2
      action: >-
        Either derive analytically that peak_live_bytes is shard-count
        invariant for the specific rho/BSGS classes now at 8-way parallelism
        (e.g. by showing S_peak or a shard-invariant table-size term always
        dominates R_peak/B_peak under the document's own peak_composition
        rule), or add a disclosure to shard_sets.rho_and_bsgs_shard_count_change_note
        parallel to its existing wall-axis treatment, before the "provably
        zero effect on every figure" claim is repeated as covering all nine
        comparison axes.
    - control: record-OBJ3-OBJ4-deferred-status
      purpose: closes OBJ3
      action: >-
        Add one explicit line (in design-repair-report.yaml or
        specification.yaml) stating that RT-OBJ3 (crossover-N estimate) and
        RT-OBJ4 (k-list/generalized-birthday baseline) remain open,
        non-blocking findings deferred to a future batch, per
        DEC-20260809-e35473's own instruction.

  counterexample_or_mutation: >-
    Cheapest concrete mutation that exposes OBJ1 without running anything:
    take the already-frozen worst_case_per_tuple_occupancy_bound table
    (8*(L(bits)-1), independently reproduced exact above) and, instead of
    dividing by N(bits) under DERIV-1's own uncalibrated "1/N per comparison"
    assumption, substitute H-SYC-b854f4's own already-adopted HA-2 formula
    E[X]=N^(-1/3+gamma_x+o(1)) at gamma_x=5/18 (the hypothesis's own
    decision-changing threshold, already frozen in
    ledger/hypotheses/H-SYC-b854f4.yaml, already in this task's read_scope).
    The margin against cap 32 falls from the disclosed 16,644x-4,198,404x to
    64x-101.6x across the same five sizes, and at the hypothesis's own stated
    ceiling gamma_x=1/3 the margin is a constant, non-growing 32.0x at every
    size -- not an overflow, but nowhere near "large" in the sense the
    disclosure claims. This is a five-minute symbolic substitution into two
    sets of already-committed numbers (the compiler's worst-case table and
    the hypothesis's own HA-2 formula), exactly the class of cheap
    recomputation the predecessor Red Team used for its own OBJ1
    counterexample, which this review also independently reproduced exact
    (see independent_static_recomputation.RT_OBJ1_predecessor_counterexample_reproduction).

  baseline_comparison: >-
    Pollard-rho and standard BSGS remain correctly embedded as byte-exact,
    parallel finite protocols on identical public inputs; the nondominated-frontier
    and positive/negative gate logic is unchanged and was not touched by this
    repair. RT-OBJ2's parallelism-equalization repair is genuine and correctly
    verified on 8 of the 9 mandatory comparison axes (the 7 additive axes plus
    the now-correctly-matched-parallelism wall axis); the 9th axis,
    peak_live_bytes, is left unaudited by the repair's own blanket claim
    (OBJ2). OBJ3 (crossover-N estimate) and OBJ4 (k-list/generalized-birthday
    baseline), both from the predecessor review and both correctly declared
    out-of-scope for this batch by the task card, remain exactly as
    unaddressed as before -- but now silently rather than explicitly (OBJ3
    above).

  heuristic_challenges:
    - >-
      DERIV-1 is disclosed as unvalidated but not disclosed as
      internally-inconsistent with H-SYC-b854f4's own numbered HA-2
      heuristic for the identical quantity at the identical null reference
      point (gamma_x=0): HA-2 predicts occupancy L(bits)/8 times larger than
      DERIV-1 computes there, and DERIV-1 was never evaluated at HA-2's own
      decision-changing threshold (5/18) or ceiling (1/3) at all. See OBJ1.
    - >-
      HA-1's own boundary names THREE independent invalidation conditions
      ("a side above 4L, combined selected pairs above 8L, or polynomial
      multiplicity invalidates the cost model") -- three, not one. The
      producer's worst-case bound derivation relies only on the SECOND
      condition (matches <= comparisons performed, tied to the 8L bound) and
      does not explain why the THIRD, independently-named condition
      ("polynomial multiplicity") cannot separately produce more candidates
      than the compiler's own closed accounting bounds. The bound is likely
      still trivially sound given the compiler's closed-accounting
      construction (every candidate must originate from a charged
      selected_pair_comparisons event, whatever that event semantically
      represents), but this is not stated anywhere, and HA-1's own authors
      apparently thought the third condition needed separate naming for a
      reason this repair does not address.

  cost_model_challenges:
    - >-
      OBJ1 (candidate_index margin): the disclosed "4.2-million-fold margin
      at bits=30" is per-attempt-style optimism dressed as an expected-case
      bound -- it is calibrated against an internally-inconsistent implicit
      null point, not against the decision-relevant gamma_x range. Recomputed
      from the document's own adopted heuristic, the actually-relevant margin
      at the decision threshold is 64x-102x, and at the theoretical ceiling
      is a constant 32x. This is a cost-model overstatement of confidence,
