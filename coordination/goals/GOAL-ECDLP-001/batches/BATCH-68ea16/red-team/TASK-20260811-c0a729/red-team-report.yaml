  pass_gates_checked_and_held:
    - id: PG1-worst-case-occupancy-bound-derivation
      description: >-
        The deterministic worst_case_per_tuple_occupancy_bound (matches <=
        selected_pair_comparisons performed, since each event yields at most
        one candidate) is trivially and correctly true given the compiler's
        own closed accounting (every accepted candidate must originate from a
        charged selected_pair_comparisons event); independently reproduced
        exact at all five sizes.
    - id: PG2-shard-parallelism-equalization
      description: >-
        rho and bsgs shard_sets, walk_assignment/input_to_shard, and the rho
        epoch/global_step formulas are symmetrically and correctly widened
        from 5-way to 8-way; no class population (n_c_by_size) changes as a
        result, correctly verified for the seven additive axes and CPU.
    - id: PG3-archive-communication-output-arithmetic
      description: >-
        The x3 archive_hashing multiplier, the communication symmetry
        extension, and the output_caps disposition-table sum all
        independently recompute to the exact disclosed over-cap figures; no
