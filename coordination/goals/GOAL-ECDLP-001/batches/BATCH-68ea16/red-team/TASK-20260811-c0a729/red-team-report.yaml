    RT_OBJ2_shard_symmetry_check:
      rho_protocol: 'shard_sets.rho widened to 8 entries (rho-shard-0..7); walk_assignment: walk_id_mod_8 (was walk_id_mod_5); global_step_order: epoch*8*1024+... (was epoch*5*1024); epoch_merge text updated to eight-shard barrier'
      bsgs_protocol: 'shard_sets.bsgs widened to 8 entries (bsgs-0..7); input_to_shard: input_index_mod_8 (was input_index_mod_5)'
