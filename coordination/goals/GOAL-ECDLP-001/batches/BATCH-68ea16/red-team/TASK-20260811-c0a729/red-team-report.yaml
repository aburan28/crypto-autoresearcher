      over_cap_arithmetic: 'archive_over_cap = 5563755264-2307745600 = 3256009664 (matches); communication_over_cap = 5614086912-2328717120 = 3285369792 (matches)'
      output_cap_arithmetic: 'output_caps.rows sum to 15520768 exactly (1966080*4+524288+2097152+1048576+8192+46080+1048576+2097152+786432=15520768); over_cap = 15520768-8388608=7132160 (matches)'
