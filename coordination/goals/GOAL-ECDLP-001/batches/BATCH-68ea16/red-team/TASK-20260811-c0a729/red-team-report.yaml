      result: '504, 1016, 2040, 4088, 8184 at bits 18/21/24/27/30, exactly reproducing 8*(L(bits)-1) with L(bits)=2^(bits/3) = 64/128/256/512/1024'
      adjudication: >-
        EXACT MATCH to physical-frontier-compiler.yaml#candidate_index_occupancy_bound's
        own worst_case_per_tuple_occupancy_bound table. The producer has
        formalized the predecessor Red Team's own counterexample as the
