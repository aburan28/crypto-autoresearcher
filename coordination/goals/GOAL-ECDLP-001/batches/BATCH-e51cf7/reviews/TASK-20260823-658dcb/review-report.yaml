        independently_converted_N_scale: N^(9/20+o(1))
        decimal_N_exponent: 0.45
        arithmetic: '(9/4)/5 = 9/20'
      - baseline: conditional_fresh_target
        supplied_B_scale: B^(5/4+o(1))
        independently_converted_N_scale: N^(1/4+o(1))
        decimal_N_exponent: 0.25
        arithmetic: '(5/4)/5 = 1/4'
        admissibility: >-
          Conditional only. The packet supplies no target count,
          target-independence quantifier, or reusable-preprocessing boundary,
          so this baseline cannot be invoked for the candidate.

    cost_identity_audit:
      supplied_identity: >-
        C_expected = C_pre +
        (C_target + C_transcript + C_decode + C_replay + C_verify) / s
      abbreviation: >-
        Let A = C_target + C_transcript + C_decode + C_replay + C_verify.
      exact_iid_restart_identity: >-
        If attempts are independent with success probability 0 < s <= 1,
        preprocessing is paid once, a success attempt costs C_success, and a
        failed attempt costs C_failure, then the uncapped expected cost is
        C_pre + C_success + ((1-s)/s) C_failure. Equivalently it is
        C_pre + A/s only when A is the unconditional mean cost of one attempt,
        namely s*C_success + (1-s)*C_failure, or when the packet states another
        equivalent convention.
      prerequisites_not_supplied:
        - success_probability_s
        - failure_cost and whether it is included in A
        - retry_count or uncapped geometric stopping
        - retry_independence
        - mask distribution and whether it preserves s
        - which costs are per attempt versus paid once
        - whether failed attempts incur decode, replay, and verify work
        - whether preprocessing is reusable across retries or targets
      result: inconclusive
      reason: >-
        The identity can be copied symbolically but cannot be validated or
        instantiated from the packet.

    symbolic_exponent_gates:
      assumptions_for_this_symbolic_reduction:
        - >-
          Suppose C_pre = B^(pi+o(1)), A = B^(alpha+o(1)), and
          1/s = B^(sigma+o(1)) in one declared cost unit.
        - >-
          Suppose the supplied identity is valid, all cost components are
          included, the number of summed components is subpolynomial, and no
          unlisted axis dominates.
      derived_expected_exponent: 'max(pi, alpha + sigma) in B'
      strict_time_requirements:
        below_BSGS_or_rho: 'pi < 5/2 and alpha + sigma < 5/2'
        below_campaign: 'pi < 9/4 and alpha + sigma < 9/4'
        below_conditional_fresh_target_without_amortization: >-
          pi < 5/4 and alpha + sigma < 5/4
        below_conditional_fresh_target_with_M_targets: >-
          If M = B^(mu+o(1)) mutually admissible targets share all of C_pre,
          the per-target gate is max(pi-mu, alpha+sigma) < 5/4. This formula is
          unavailable until M, target independence, persistence, and reuse
          quantifiers are supplied.
      equality_warning: >-
        Equality of exponents is not an exponent improvement; hidden o(1),
        polylogarithmic, unit-conversion, and constant factors then require
        separate matched accounting.
      candidate_substitution: impossible
      missing_exponents: [pi, alpha, sigma, mu]

