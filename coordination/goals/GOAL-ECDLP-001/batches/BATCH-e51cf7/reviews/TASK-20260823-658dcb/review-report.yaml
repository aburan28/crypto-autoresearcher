        independently_converted_N_scale: N^(1/2+o(1))
        arithmetic: '(5/2)/5 = 1/2'
      - baseline: BSGS_memory_where_applicable
        supplied_B_scale: B^(5/2+o(1))
        independently_converted_N_scale: N^(1/2+o(1))
        arithmetic: '(5/2)/5 = 1/2'
      - baseline: rho_time
