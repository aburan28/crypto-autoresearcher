    parameter_normalization:
      supplied_relation: B = N^(1/5)
      derivation_rule: >-
        For a monomial B^(a+o(1)), substitution gives
        N^(a/5+o(1)). This is the only candidate-independent exponent
        conversion supplied by the packet.
      unavailable_relations:
        - No relation among N, p, n, the curve, or the subgroup is supplied.
        - No bit-cost or field/group-operation cost unit is supplied.
        - degree_T, degree_F, degree_H, and degree_G are all unknown.
