  joint_assessments:
    - joint: J1-complete-reachable-elliptic-image-and-source-lineage
      status: breaks
      claim_tested: >-
        The packet supplies the complete public-to-source-to-reachable-image
        construction, all elliptic charts and overlap data, multiplicity-safe
        occurrence markers, and a signed all-strata replay certificate.
      decisive_result: >-
        No such construction is present. Every load-bearing public-instance,
        source-map, image-membership, chart, local, marker, fibre, and replay
        field is explicitly unknown or missing. The IDEA-121 lineage is also
        incomplete at the exact place where the inherited source-jet scope
        was corrected.
      checks:
        public_instance_and_domain:
          result: breaks
          evidence:
            - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/reachable-elliptic-image-spec.yaml
              fields:
                - artifact.public_instance
                - artifact.reachable_source_lineage
          detail: >-
            p, the curve model and equation, n, N, the base point, the target
            domain, the public source, the source map, the reachable image,
            and the image-membership certificate are all unknown. Therefore
            neither a universal coverage proof nor a concrete reachable-image
            collision can be checked.
        chart_coverage:
          result: breaks
          evidence:
            - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/reachable-elliptic-image-spec.yaml
              field: artifact.complete_chart_registry
            - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/source-replay-certificate.yaml
              field: artifact.elliptic_replay_certificate
          missing:
            - affine chart formulas
            - point-at-infinity chart formulas
            - tangent and doubling charts
            - vertical-line and inverse-pair charts
            - exceptional addition charts
            - overlap maps and a coverage proof
          cheapest_chart_witness: >-
            For any nonzero R in an odd-order elliptic subgroup, R and -R are
            distinct reachable signed points with the same affine x-coordinate
            and R+(-R)=O. The ordinary affine chord formula has zero
            x-denominator and cannot represent the vertical sum or the output
            O. A second chart or a complete addition law is mandatory, but no
            such formula, transition, or replay rule is supplied. This is an
            elliptic group-law witness to the missing stratum, not a claim that
            every possible complete formula fails.
        local_parameters_trivializations_and_overlaps:
          result: breaks
          evidence:
            - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/reachable-elliptic-image-spec.yaml
              field: artifact.local_structure
          detail: >-
            The packet does not choose a uniformizer on any chart, a local
            equation or line-bundle trivialization, or the unit and parameter
            transformations on overlaps. Consequently a local Hasse form in
            one chart is not bound to the form interpreted by replay in
            another chart, and equality of marker data across overlaps is not
            defined.
        Hasse_orders_and_nonreduced_fibres:
          result: breaks
          evidence:
            - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/reachable-elliptic-image-spec.yaml
              fields:
                - artifact.local_structure.Hasse_derivative_orders
                - artifact.local_structure.nonreduced_fibre_handling
                - artifact.fibre_bounds
          detail: >-
            No multiplicity bound or first-nonzero Hasse-order bound is given.
            Hence the decoder cannot distinguish absence from a higher-order
            repeated or tangent fibre, and it has no finite derivative order
            at which it is allowed to stop.
        per_occurrence_markers:
          result: breaks
          evidence:
            - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/reachable-elliptic-image-spec.yaml
              field: artifact.per_occurrence_markers
            - path: ideas/artifacts/ECDLP-IDEA-121/translated_product_common_norm_v3_audit_v2.md
              sections:
                - Correct multiplicity and source output
                - Conditional source-jet scope
          detail: >-
            The occurrence index set, injective code, sign bit, and
            within-fibre collision proof are unknown. The superseding
            IDEA-121 correction requires the full m_X(x)*b_x labelled output
            and makes the source-jet identity conditional on a complete
            all-strata local construction; B60 supplies neither.
        signed_replay_and_verification:
          result: breaks
          evidence:
            - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/source-replay-certificate.yaml
              fields:
                - artifact.replay_steps
                - artifact.signed_occurrence_requirement
          detail: >-
            Every source-to-image, marker-to-local-data, local-data-to-group,
            group-to-scalar, and scalar-verification step is marked missing.
            No addition, doubling, inverse, chart-transition, or scalar
            verification equation is supplied.
        source_lineage:
          result: breaks
          evidence:
            - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/source-replay-certificate.yaml
              field: artifact.lineage_entries[0]
            - path: ideas/artifacts/ECDLP-IDEA-121/assignment_receipt.md
            - path: ideas/artifacts/ECDLP-IDEA-121/translated_product_common_norm_v3.md
            - path: ideas/artifacts/ECDLP-IDEA-121/translated_product_common_norm_v3_audit_v2.md
          detail: >-
            The B60 lineage names the deferred IDEA-121 hypothesis and only
            the KU/common-norm and direct-circuit gates. It omits the
            translated-product V3 receipt and, critically, its superseding V2
            audit correction. That correction narrows the claimed source jets
            to a conditional local identity, corrects row multiplicity to
            m_X(x)*b_x, and declares the global all-strata construction
            unsupplied. Those are load-bearing J1 facts, so the listed lineage
            is not complete.
      explicit_reachable_occurrence_witness:
        classification: >-
          Elliptic group-law/effective-divisor witness to required occurrence
          separation; not an exact collision certificate for B60 because B60
          never defines its reachable-image membership map or transcript.
        assumptions: >-
          Let <P> be a prime-order subgroup of order n>200. Extend the named
          source decks arbitrarily after including the distinct labelled
          points below; all displayed source points are pairwise distinct.
        labelled_sources:
          X_occurrence: "x = 50P - 55P = -5P"
          Y_occurrence_1: "y1 = 10P + (-9P) = P"
          Y_occurrence_2: "y2 = 20P + (-18P) = 2P"
          Z_occurrence_1: "z1 = 30P + (-26P) = 4P"
          Z_occurrence_2: "z2 = 40P + (-37P) = 3P"
        equal_relations:
          - "x + y1 + z1 = (-5+1+4)P = O"
          - "x + y2 + z2 = (-5+2+3)P = O"
        consequence: >-
          Two distinct labelled six-list rows lie above the same X endpoint.
          Here m_X(x)=1 and b_x=2, while an ordinary endpoint gcd records only
          min(1,2)=1. The first marker partials at zero vanish; the first
          nonzero marker form is the degree-two product of the two distinct
          linear code factors. A decoder therefore needs second-order Hasse
          handling and per-occurrence factorization even in this smallest
          collision fibre. None is instantiated or bounded in the packet.
      J1_scope_boundary: >-
        These breaks establish that this committed packet does not supply J1.
        They do not establish nonexistence of a complete reachable elliptic
        source construction. The occurrence witness cannot be promoted to the
        packet's collision alternative without the missing exact membership
        and complete-transcript certificates.

    - joint: J2-transcript-separation-and-decoder-correctness
      status: breaks
      claim_tested: >-
        A finite target-blind adaptive transcript is well typed, has a bounded
        total modulus degree and stopping rule, separates every pair of
        reachable instances with different required answers, and admits a
        uniform correct decoder and complete replay.
      decisive_result: >-
        Only an obligations grammar is frozen. The number of rounds, choice
        functions, oracle semantics, response alphabets, total degree,
        transcript equality, output equivalence, separator, decoder, replay,
        success law, retries, and algorithmic stopping rule are absent. The
        grammar admits a reachable constant-response countermodel, so its
        syntax alone cannot imply separation.
      checks:
        adaptive_quantifiers_and_uniformity:
          result: breaks
          evidence:
            - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/dependency-and-quantifier-dag.yaml
              fields:
                - artifact.quantifier_order
                - artifact.nodes
            - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/adaptive-transcript-interface.yaml
              field: artifact.dependency_contract
          detail: >-
            The packet explicitly fixes only S_pre before Q. It does not bind
            a finite r, Oracle_I, the full family of f_i, Sep, Dec, Replay, and
            Verify as uniform finite descriptions before the universal target
            quantifier. The prose intent is target-independent code receiving
            Q as input, but the recorded DAG does not certify that quantifier
            order or code-size uniformity.
        transcript_finiteness_and_total_modulus_degree:
          result: breaks
          evidence:
            - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/adaptive-transcript-interface.yaml
              fields:
                - artifact.transcript.step_index_range
                - artifact.transcript.r
                - artifact.query_accounting
          detail: >-
            There is no finite maximum r, no pathwise or expected call bound,
            no modulus at any node, no sum-of-modulus-degrees rule, and no
            response cardinality. Therefore neither termination nor the size
            of the adaptive decision tree is defined.
        transcript_typing_and_equality:
          result: breaks
          evidence:
            - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/adaptive-transcript-interface.yaml
              fields:
                - artifact.transcript.definition
                - artifact.transcript.choice_rule
                - artifact.transcript.response_rule
          detail: >-
            tau_Q records only response values sigma_i. Choices C_i may vary
            with Q through T_Q, F_Q, and H_Q, while response codomains are
            unknown. Equal untagged response tuples can therefore arise from
            different queries or rings and need not have a common meaning.
            A successor must either include each typed C_i/codomain in the
            transcript or prove that a decoder can canonically reconstruct
            them from a uniformly frozen public construction.
        separation_statement:
          result: breaks
          evidence:
            - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/separator-decoder-or-collision.yaml
              field: artifact.positive_branch.separator_statement
          detail: >-
            The desired implication is written but marked supplied=false, and
            no equivalence relation on required replay answers is defined.
            With no response alphabets or reachable-output cardinality, even
            the necessary counting condition that transcript leaves cover all
            distinct required-answer classes cannot be checked.
        decoder_correctness:
          result: breaks
          evidence:
            - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/separator-decoder-or-collision.yaml
              fields:
                - artifact.positive_branch.decoder_statement
                - artifact.positive_branch.decoder_proof
                - artifact.positive_branch.replay_statement
                - artifact.positive_branch.verification_statement
          detail: >-
            No decoder algorithm, multiplicity policy, output type, correctness
            invariant, replay proof, or false-accept bound exists. Injectivity
            alone would not provide an efficient constructive inverse, and an
            endpoint-only inverse would fail on the two-row J1 witness.
        algorithmic_stopping_and_failure:
          result: breaks
          evidence:
            - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/adaptive-transcript-interface.yaml
              field: artifact.success_contract
            - path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/proof-search-map.yaml
              field: artifact.stopping_rule_applied
          detail: >-
            The proof-search map's select-none rule is a lifecycle gate, not a
            transcript halting rule. The packet has no public-prefix stopping
            predicate, maximum degree/call budget, success or failure event,
            retry rule, independence condition, or failure-output semantics.
      explicit_reachable_grammar_countermodel:
        classification: >-
          Reachable elliptic countermodel to the sufficiency of the frozen
          obligations grammar; not a qualifying collision against a concrete
          transcript, because no concrete transcript was supplied.
        construction: >-
          In any declared subgroup <P> of prime order n>2, take reachable
          targets Q1=P and Q2=2P, whose required scalar answers are 1 and 2.
          Instantiate the still-unspecified interface with r=0, one fixed
          allowed choice C_0, and a constant response sigma_0=0. This obeys
          the displayed dependency restrictions and uses no G, root, desired
          answer, future response, or target-trained advice.
        collision: "tau_Q1=(0)=tau_Q2 while the required answers 1 and 2 differ"
        implication: >-
          The dependency syntax does not itself imply separation. A successor
          must supply concrete oracle semantics and a separation proof. Since
          B60 did not freeze this constant instance or any other instance, the
          witness cannot reject the open adaptive-transcript class.
      J2_scope_boundary: >-
        The packet supplies neither the positive separator/decoder chain nor a
        qualifying exact reachable collision for a fixed transcript. J2 thus
        breaks for the supplied packet and warrants REVISE, while the broader
        mechanism remains untested and unrefuted.

