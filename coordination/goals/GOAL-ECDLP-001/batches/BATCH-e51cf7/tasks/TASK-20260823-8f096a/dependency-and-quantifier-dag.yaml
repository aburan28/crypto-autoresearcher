artifact:
  task_id: TASK-20260823-8f096a
  kind: dependency_and_quantifier_dag
  outcome: REVISE_select_none
  quantifier_order:
    - order: 1
      binder: "for every declared public elliptic instance I=(p,E,n,N,B)"
      status: parameters_unknown
    - order: 2
      binder: "there exists target-independent preprocessing S_pre(I) fixed before Q"
      status: construction_unknown
    - order: 3
      binder: "for every admissible target Q in the declared subgroup"
      status: target_set_unknown
    - order: 4
      binder: "tau_Q=(sigma_0,...,sigma_r), where C_i=f_i(S_pre,T_Q,F_Q,H_Q,sigma_<i)"
      status: syntax_frozen_instantiation_unknown
    - order: 5
      binder: "a target-independent separator and decoder consume only the frozen transcript and public instance"
      status: theorem_unknown
    - order: 6
      binder: "complete elliptic replay and verification return or reject a scalar relation"
      status: construction_unknown
  nodes:
    - id: I
      object: public_elliptic_instance
      known_fields: []
      unknown_fields: [p, E, n, N, B, subgroup, charts]
    - id: S_pre
      object: target_independent_source_and_advice
      allowed_dependencies: [I]
      forbidden_dependencies: [Q, G, roots, desired_answer, target_trained_advice]
      status: unknown
    - id: Q
      object: target
      allowed_dependencies: [I]
      status: symbolic
    - id: T_Q
      object: target_polynomial_or_target_encoding
      allowed_dependencies: [I, Q]
      status: unknown
    - id: F_Q
      object: target_specialized_source_object
      allowed_dependencies: [I, S_pre, Q, T_Q]
      forbidden_dependencies: [G, roots, desired_answer]
      status: unknown
    - id: H_Q
      object: auxiliary_target_object
      allowed_dependencies: [I, S_pre, Q, T_Q, F_Q]
      forbidden_dependencies: [G, roots, desired_answer]
      status: unknown
    - id: C_i
      object: adaptive_choice_at_step_i
      formula: "C_i=f_i(S_pre,T_Q,F_Q,H_Q,sigma_<i)"
      forbidden_dependencies: [G, roots, desired_answer, target_trained_source_advice, future_sigma]
      status: function_family_unknown
    - id: sigma_i
      object: transcript_response_at_step_i
      allowed_dependencies: [I, S_pre, T_Q, F_Q, H_Q, C_i]
      status: codomain_and_dimension_unknown
    - id: tau_Q
      object: complete_adaptive_transcript
      formula: "tau_Q=(sigma_0,...,sigma_r)"
      status: r_and_components_unknown
    - id: Sep
      object: reachable_image_separator
      allowed_dependencies: [I, S_pre, Q, T_Q, F_Q, H_Q, tau_Q]
      forbidden_dependencies: [supplied_G, roots, target_trained_advice]
      status: absent
    - id: Dec
      object: conditional_decoder
      allowed_dependencies: [I, S_pre, Q, tau_Q, Sep]
      status: absent
    - id: Replay
      object: complete_elliptic_replay
      allowed_dependencies: [I, Q, Dec]
      status: absent
    - id: Verify
      object: scalar_relation_verification
      allowed_dependencies: [I, Q, Replay]
      status: absent
  edges:
    - [I, S_pre]
    - [I, Q]
    - [Q, T_Q]
    - [S_pre, F_Q]
    - [T_Q, F_Q]
    - [F_Q, H_Q]
    - [S_pre, C_i]
    - [T_Q, C_i]
    - [F_Q, C_i]
    - [H_Q, C_i]
    - [sigma_before_i, C_i]
    - [C_i, sigma_i]
    - [sigma_i, tau_Q]
    - [tau_Q, Sep]
    - [Sep, Dec]
    - [Dec, Replay]
    - [Replay, Verify]
  frozen_dependency_rule: >-
    No choice may depend on G, a root, the desired answer, target-trained
    source advice, or a future transcript response. This rule is frozen; no
    concrete family f_i or finite r is supplied.
  first_unavoidable_state_claim:
    status: not_claimed
    reason: "Representation width alone does not establish necessity or reachable-image separation."
  completeness_gate:
    passed: false
    missing:
      - exact public-instance parameters
      - target-independent source construction
      - finite step count r
      - every f_i and response codomain
      - total call and total modulus-degree bounds
      - reachable-image separator
      - decoder, replay, and verification
