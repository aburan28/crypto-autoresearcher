review_plan:
  schema: crypto.autoresearch.review_plan.v1
  id: REVIEW-PLAN-BATCH-e51cf7
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-e51cf7
  recorded_at: '2026-08-23'
  coordinator_prior: >-
    Expected disposition is REVISE. The likeliest breaks are failure to define
    a genuinely new transcript, lack of reachable-image separation, or hidden
    target-dependent construction. If those unexpectedly hold, blind cost
    reconstruction is still likely to expose uncharged preprocessing, output
    fibres, retries, communication, or fresh-target reuse.
  claim_under_review: >-
    Whether the frozen zero-run packet supplies a mechanism-new, non-circular
    adaptive transcript with complete reachable-image separation, decoder,
    replay, and fully charged sub-rho cost, or a valid collision rejecting only
    that exact transcript. No attack, support, implementation, closure, or
    breakthrough is under review.
  joints:
    - joint: J1-complete-reachable-elliptic-image-and-source-lineage
      assigned_to: TASK-20260823-7b24d7
      role: reviewer
      attack_plan: >-
        Verify complete addition charts, local parameters and trivializations,
        Hasse-order bounds, infinity/tangent/vertical/overlap strata, repeated
        and nonreduced fibres, injective per-occurrence markers, signed replay,
        and the claimed reachable domain. Construct the cheapest missing-chart
        or same-geometric-point/different-occurrence counterexample.
      expected_break: Incomplete strata or collapsed occurrence labels.
    - joint: J2-transcript-separation-and-decoder-correctness
      assigned_to: TASK-20260823-7b24d7
      role: reviewer
      attack_plan: >-
        Audit every adaptive quantifier and total-modulus rule, squarefree
        completeness, transcript equality, separation statement, decoder step,
        and stopping rule. Search for reachable same-transcript/different-G or
        different-replay instances.
      expected_break: The transcript omits a separating invariant or assumes its answer.
    - joint: J3-blind-end-to-end-cost-rederivation
      assigned_to: TASK-20260823-658dcb
      role: validator
      attack_plan: >-
        From the statement packet alone, reconstruct all dimensions, total
        modulus degree, calls, preprocessing, target work, decoder, replay,
        output, retries, verification, processors, communication, memory,
        multi-target reuse, and rho/BSGS/campaign/fresh-target comparisons.
      expected_break: A hidden B factor or uncharged target-dependent stage crosses rho.
    - joint: J4-circularity-and-hidden-resources
      assigned_to: TASK-20260823-a9841f
      role: red-team
      attack_plan: >-
        Attack target-trained moduli, supplied G or roots, answer-bearing advice,
        hidden norm materialization, source tables, lucky-target quantifiers,
        preprocessing reuse, and corrected PTM-4 semantics.
      expected_break: Conditional sub-rho decoding is misrepresented as end-to-end location.
    - joint: J5-novelty-pareto-and-steering
      assigned_to: TASK-20260823-a9841f
      role: red-team
      attack_plan: >-
        Compare proposition-by-proposition against IDEA-121, B57, B58, and B59;
        run all matched controls; separate realized, conditional, and unknown
        time, memory, data/query, output, and communication axes; challenge any
        unsupported deprioritization or lane-closing implication.
      expected_break: The packet consolidates an archived gate or uses unknown axes as domination.
  blindness:
    mutual: true
    lifted_for: []
    rationale: null
  proves_too_much:
    objects:
      - B59 matched F_1009 product-circuit pair with identical short synopsis and distinct degree-two common factors
      - B59 Reviewer squarefree F_101 low-jet collision
      - explicit degree-B^3 norm input that must be rejected before downstream savings count
      - modulus or source table constructed from supplied G, with conditional B^2 decoding treated as legitimate but not as a locator
      - random matched product circuit lacking curve-specific reachable-image structure
    failure_signature: >-
      A correct end-to-end locator claim must reject supplied-answer and cubic
      inputs as circular or over-budget, distinguish the complete reachable
      collision if it claims separation, and must not transfer a proof from a
      generic random circuit without an explicit curve-specific lemma.
  blind_rederivation:
    required: true
    assigned_to: TASK-20260823-658dcb
    quantity: >-
      C_expected and every time, peak-live-memory, coordinate-traffic,
      advice/data, output, communication, retry, processor, and multi-target
      term compared to parameterized BSGS, rho, campaign, and fresh-target gates.
    blind_from:
      - ledger/proposals/IDEA-20260823-a06dba.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/dependency-and-quantifier-dag.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/reachable-elliptic-image-spec.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/adaptive-transcript-interface.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/separator-decoder-or-collision.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/source-replay-certificate.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/full-cost-and-pareto-ledger.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/proof-search-map.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/proves-too-much-controls.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/source-and-semantic-delta-audit.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/disposition-report.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/runtime-session-receipt.json
  procedure_deviations:
