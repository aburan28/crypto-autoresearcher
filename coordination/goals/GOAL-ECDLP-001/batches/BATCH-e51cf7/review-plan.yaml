      declared_before_review: true
      rationale: >-
        The create-only producer omitted twelve validator-required verified_by
        citation leaves. A Coordinator who personally read those sources may
        add exactly those leaves and one repair report before snapshot. No
        scientific content or review joint changes.
    - task_id: TASK-20260823-39230c
