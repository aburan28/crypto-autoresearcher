  proves_too_much_controls:
    method: static_statement_level_application_only
    experiment_runs: 0
    implementation_or_scientific_script_runs: 0
    all_five_statically_applied: true
    generic_controls_are_reachable_elliptic_evidence: false
    controls:
      - id: PTM-1-B59-matched-F1009-product-circuit
        review_plan_object: >-
          B59 matched F_1009 product-circuit pair with identical short synopsis
          and distinct degree-two common factors.
        concrete_object: >-
          Over F_1009 let B=2, T=U(U-1), F=(U-2)(U-4), and use four leaves
          W-phi_i(U). Circuit A has
          phi=(U, U/2-1, 10U+10, 10U+100) and common factor
          G_A=W^2-W. Circuit B has
          phi=(2-3U, 5-3U/2, 20U+200, 20U+500) and common factor
          G_B=W^2-W-2. Both have selector degree two, four affine leaves,
          degree-eight norms, degree-two G, and first Newton sum one.
        static_check: >-
          At the T roots, circuit A contains common W-values 0 and 1 with the
          F-root values, while circuit B contains common W-values 2 and -1;
          hence the stated G factors differ although the short synopsis and
          public shape agree.
        failure_signature: >-
          Any separator proof using only those shared dimensions and the first
          Newton sum proves a false uniqueness conclusion.
        application_to_current_packet: >-
          No Oracle_I, response codomain, synopsis, or separator exists, so the
          syntax cannot distinguish the pair and earns no separator credit.
        outcome: fires_against_synopsis_only_proofs_but_no_candidate_exists
        reachable_elliptic_membership: not_claimed
        elliptic_evidence: none
      - id: PTM-2-squarefree-F101-low-jet-collision
        review_plan_object: >-
          A squarefree F_101 low-jet collision, independently instantiated from
          the plan statement without reading any Reviewer report.
        concrete_object: >-
          In F_101[W], let f=W^2+1, h_0=f, and
          h_1=f+W^3=W^3+W^2+1. Compare ordered pairs A=(f,h_0) and
          B=(f,h_1) under componentwise reduction modulo W^3.
        static_derivation:
          same_low_jet: >-
            h_1 is congruent to h_0 modulo W^3, so A and B have identical
            componentwise jets through degree two.
          different_gcd: >-
            gcd(f,h_0)=f, while gcd(f,h_1)=gcd(f,h_1-f)=gcd(f,W^3)=1
            because f(0)=1.
          squarefree_f: >-
            f'=2W and f(0)=1, so f and f' have no common root.
          squarefree_h1: >-
            h_1'=W(3W+2). At its derivative roots, h_1(0)=1 and the
            second root is W=33, where h_1(33)=61 mod 101, so h_1 is
            squarefree.
        failure_signature: >-
          Any generic exact-GCD separator based only on a fixed jet modulo W^3
          assigns the same observation to pairs with different gcd answers.
        application_to_current_packet: >-
          No fixed-jet transcript is supplied. The control blocks future
          low-jet generic uniqueness credit but does not refute the open
          adaptive reachable-image class.
        outcome: explicit_static_collision_constructed_generic_only
        reachable_elliptic_membership: not_claimed
        elliptic_evidence: none
      - id: PTM-3-explicit-degree-B3-norm-input
        review_plan_object: explicit degree-B^3 norm input
        static_check: >-
          An explicit coefficient vector with Theta(B^3) base-field
          coordinates requires Omega(B^3) input production, reading, or traffic
          before any downstream decoder or replay. Since B^3 exceeds the rho
          comparison B^(5/2+o(1)), downstream B^2 work cannot repair the
          end-to-end cost.
        failure_signature: >-
          A claimed sub-rho locator begins after receiving or materializing the
          cubic object and omits that cost.
        application_to_current_packet: >-
          The producer correctly gives this object zero downstream credit and
          supplies no such input as a favorable construction.
        outcome: fires_and_rejects_before_downstream_credit
        scientific_result_about_open_class: none
      - id: PTM-4-supplied-G-modulus-or-source-table
        review_plan_object: >-
          A modulus or source table constructed from supplied G, with
          conditional B^2 decoding legitimate but not a locator.
        corrected_static_check: >-
          Once degree-Theta(B) G is supplied, reductions in rings of dimension
          Theta(B^2) can legitimately support a conditional source decoder
          below rho. This does not locate G. If the modulus, roots, or source
          table are constructed from the desired G or target-trained advice,
          the missing locator and construction cost are already in the input.
        failure_signature: >-
          End-to-end complexity charges only the B^2 query or decode while G,
          its roots, or an answer-bearing table is supplied for free.
        application_to_current_packet: >-
          The packet states exactly this correction and makes no locator claim
          from supplied G. It therefore passes PTM-4 at the declared syntax
          boundary; a future construction must still prove that S_pre and all
          query moduli are target independent.
        outcome: corrected_control_holds_conditional_decode_only
        conditional_decoder_credit: legitimate_if_fully_charged
        end_to_end_locator_credit: zero
      - id: PTM-5-random-matched-product-circuit-null
        review_plan_object: >-
          A matched generic product-circuit null lacking curve-specific
          reachable-image structure.
        concrete_mutation: >-
          Erase all elliptic chart, Hasse, subgroup, occurrence-lineage, and
          source-membership predicates and replace the leaf provider by the
          matched affine product-circuit type used in PTM-1, or by the same
          public shape sampled from a generic affine-leaf ensemble. Preserve
          B, selector degrees, leaf count, norm degree, response dimensions,
          and short synopsis, but supply no curve-reachable certificate.
        failure_signature: >-
          A purported separator proof or signal survives this erasure and uses
          only generic shape or transcript syntax, so it would prove the same
          conclusion on an object where curve-specific reachability is absent.
        application_to_current_packet: >-
          The current interface contains no concrete curve-specific identity,
          source construction, Oracle, or separator. Its syntax survives the
          mutation unchanged. Because no positive proof exists, the outcome is
          a missing-lemma method-ceiling gate rather than a falsified reachable
          theorem.
        outcome: fires_as_curve_specific_lemma_gate_no_candidate_to_falsify
        random_samples_drawn: 0
        reachable_elliptic_membership: false_or_not_claimed
        elliptic_evidence: none
    combined_control_result: >-
      PTM-1 and PTM-2 defeat generic short-synopsis and fixed-low-jet
      uniqueness arguments only. PTM-3 rejects cubic represented inputs before
      downstream credit. PTM-4 is correctly phrased and passed at the syntax
      boundary. PTM-5 shows that a future proof needs an explicit
      curve-specific reachable-image lemma. With no candidate, these controls
      neither support nor reject the adaptive elliptic class.

