        retries, and multi-target reuse. Use n/a when no candidate exists.
      expected_decisive_outcome: >-
        Unknown remains neither dominance nor novelty; a concrete point is
        comparable only after every axis has a proved bound.
    - id: CF-5-final-budget-rerank
      target: J5-B4-final-budget-information-gain
      cost: one_three_row_static_table
      test: >-
        Compare adaptive transcript, JPR key, and randomized multivalued cover
