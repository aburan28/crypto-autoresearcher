  joint_reviews:
    J4-circularity-and-hidden-resources:
      verdict: inconclusive
      holds:
        - >-
          The quantifier order places S_pre after the public instance and
          before Q and forbids S_pre from depending on Q, G, roots, the desired
          answer, or target-trained advice.
        - >-
          Each adaptive choice C_i is declared to depend only on S_pre, T_Q,
          F_Q, H_Q, and prior responses, and is forbidden from depending on G,
          roots, the desired answer, target-trained source advice, or future
          responses.
        - >-
          The packet supplies no answer-bearing modulus, G, root table, factor
          logs, hidden DLP oracle, target-trained source table, or claimed
          preprocessing reuse as a positive input.
        - >-
          The degree-B^3 represented-input control is correctly required to be
          charged before decoder, replay, success, or amortization credit.
        - >-
          Corrected PTM-4 semantics hold: a B^2 conditional decoder once G is
          supplied can be legitimate, while it receives zero end-to-end
          locator credit and the construction or supply of G remains charged.
        - >-
          No lucky-target, expected-success, retry, batch, or fresh-target
          claim is made from unknown masks, success probability, target count,
          or independence.
      inconclusive_findings:
        - id: J4-I1-declarative-lineage-only
          finding: >-
            S_pre has no construction or representation. The statement
            S_pre=S_pre(I) is a desired dependency type, not evidence that its
            eventual bytes do not encode target-trained or answer-bearing
            information.
          consequence: >-
            Neither circularity nor non-circularity can be established for a
            nonexistent preprocessing object.
        - id: J4-I2-unknown-target-objects
          finding: >-
            T_Q, F_Q, and H_Q have no formulas, dimensions, or source lineage.
            A future definition could materialize a cubic norm, choose a
            modulus divisible by unknown G, or hide roots in a target-specific
            table without contradicting the present uninstantiated syntax.
          consequence: >-
            The current record is a gate for future definitions, not a proof
            that hidden resources are absent.
        - id: J4-I3-unknown-oracle-and-responses
          finding: >-
            Oracle_I, response codomains, response coordinate counts, finite r,
            every f_i, total modulus degree, and stopping rule are unknown.
          consequence: >-
            No dataflow, answer-content, traffic, call, or adaptivity audit can
            be completed.
        - id: J4-I4-unknown-success-and-reuse
          finding: >-
            Success probability, failure cost, retry policy, mask distribution,
            reusable objects, target count, and target-independence conditions
            are unknown.
          consequence: >-
            No average-case, lucky-target, campaign, amortized, or fresh-target
            claim is available.
      circularity_audit:
        supplied_G_or_roots:
          current_result: not_used_as_locator_input
          corrected_boundary: >-
            Conditional decoding given G is allowed and separately priced;
