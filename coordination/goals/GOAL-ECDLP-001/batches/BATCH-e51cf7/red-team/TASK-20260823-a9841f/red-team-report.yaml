    - id: CF-2-statement-containment-matrix
      target: J5-B1-predecessor-containment
      cost: static_proposition_comparison
      test: >-
        For each proposed theorem row, cite the nearest IDEA-121 and B59
        statement and label identical, strengthened, or new. A strengthened or
        new row must state changed quantifiers and one falsifier not already
        demanded by B59 O3 through O6.
      expected_decisive_outcome: >-
        If every row is identical or merely more verbose, classify the packet
        as obligations-only consolidation; one genuinely stronger proved row
        can support a successor.
    - id: CF-3-reachable-transcript-collision-or-separator
      target: J4-I3-unknown-oracle-and-responses
      cost: proof_first_no_experiment
      test: >-
        Freeze the complete transcript. Then either prove it separates every
        reachable marked elliptic instance with different replay answer or
        provide two exact reachable instances with equal full transcript and
        different G or labelled replay.
      expected_decisive_outcome: >-
