    target-trained source advice is circular and rejected.
  - >-
    Prove separation on the complete reachable elliptic image or give two
    reachable marked instances with identical full transcripts and distinct G
    or labelled replay. Generic polynomial collisions are controls only.
  - >-
    Charge total modulus degree, calls, coordinate traffic, live state, work,
    output, retries, verification, processors, communication, and reuse.

