objective: >-
  Determine whether the complete reachable elliptic-product image admits a
  genuinely mechanism-new adaptive or multi-modulus transcript, constructed
  without G or target-trained advice, that separates and decodes the required
  squarefree factor G and exact per-occurrence source replay at fully charged
  sub-rho cost; otherwise produce a collision for that exact transcript or
  return REVISE/select-none. Do not repeat B59's five cubic representations.

coordinator_rerank:
  winner: adaptive multi-modulus marked shared-leaf reachable-image transcript
  ranked_alternatives:
    - rank: 1
      route: adaptive or multi-modulus marked shared-leaf transcript
      reason: >-
        B59 screened five coefficient-complete cubic representations but its J1
        review explicitly left multi-query target-blind transcripts open because
        no total-degree or reachable-image same-transcript bound was proved.
    - rank: 2
      route: concrete elliptic decomposable join key satisfying JPR-C1 through JPR-C7
      reason: >-
        The gate is mature and conditionally targets N^(1/3+o(1)), but no new
        elliptic key supplies the load-bearing C2 and C4 properties.
    - rank: 3
      route: randomized multivalued cover and provenance transducer
      reason: >-
        It can escape deterministic prime-cycle rigidity, but inverse location,
        branch entropy, preprocessing, and total target costs remain unknown.
  current_realized_frontier: >-
    Pollard rho remains the realized single-target time frontier at
    N^(1/2+o(1)) with constant state; BSGS remains N^(1/2+o(1)) time and
    memory. No B60 candidate is a realized attack.
  dominated_by: >-
    No realized candidate exists. Conditional points with unknown transcript,
    decoder, output, retry, preprocessing, or reuse axes are Pareto-incomparable
    and do not dominate Pollard rho or BSGS.
  sota_delta:
    realized_time_exponent: 0
    realized_memory_exponent: 0
    conditional_campaign_time_exponent_delta_vs_rho: -0.05
    condition: >-
      Only if the entire target-independent preprocessing and target-dependent
      transcript, decoder, replay, verification, and retry chain is proved at
      B^(9/4+o(1))=N^(0.45+o(1)) or lower. No such proof exists at opening.

frozen_regime:
  B: N^(1/5)
  pollard_rho: B^(5/2+o(1)) = N^(1/2+o(1))
  campaign_gate: B^(9/4+o(1)) = N^(0.45+o(1))
  fresh_target_gate_if_claimed: B^(5/4+o(1)) = N^(0.25+o(1))
  already_screened_routes: B^(3+o(1)) = N^(0.6+o(1))
  expected_cost_identity: >-
    C_expected = C_pre +
    (C_target + C_transcript + C_decode + C_replay + C_verify) / s.

earliest_falsification:
  - >-
    Prove semantic delta against ku_circuit_reduction_v2, its V3 correction,
    and B59; reproduction or relabeling forces select-none.
  - >-
    Freeze tau_Q=(sigma_0,...,sigma_r) and every adaptive choice
