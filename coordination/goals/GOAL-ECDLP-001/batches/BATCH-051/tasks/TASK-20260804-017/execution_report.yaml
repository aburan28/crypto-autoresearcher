  observations:
    - id: OBS-1
      type: primary_metric
      description: >-
        Across all 8 cells with valid data, the isogeny augmentation ratio is
        aug ≈ 2 − B_fraction:
          B_frac=0.1: aug ≈ 1.897–1.900, null ≈ 1.899–1.901
          B_frac=0.2: aug ≈ 1.800–1.801, null ≈ 1.799–1.801
          B_frac=0.3: aug ≈ 1.700–1.702, null ≈ 1.699–1.702
        This matches the random-bijection prediction (HEUR-ICI-1: independence).
        The frozen prediction (aug > 1 + epsilon, epsilon not vanishing) is NOT
        supported. The isogeny acts as a random permutation on x-coordinates.
      frozen_prediction: "aug > 1.05 AND aug > null + 0.01 at >=6/9 cells"
      observed: "aug ≈ null ≈ 2 − B_frac; difference |aug − null| < 0.003 in all cells"

    - id: OBS-2
      type: null_control
      description: >-
        Null map ratio [k]-map is ≈ 2 − B_fraction for all cells (K=10000 sample,
        std.err ≈ 0.01). Indistinguishable from the isogeny augmentation ratio.
        Confirms the isogeny provides no x-coordinate mixing advantage.

    - id: OBS-3
      type: negation_control
      description: >-
        Negation ratio = 1.0 by construction in all reps: F includes both
        (x,y) and (x,−y) for every QR x below threshold, so (−F) = F.
        No implementation discrepancy detected.

    - id: OBS-4
      type: scale_invariance
      description: >-
        The observed pattern aug ≈ null ≈ 2 − B_frac holds identically at
        bits=20, 24, and 28 (where computable). No size dependence visible.
        The result is consistent with the isogeny x-rational-map (degree-ell
        rational function) producing output uniformly distributed in [0,p−1],
        regardless of ell or p.

    - id: OBS-5
      type: resource_observation
      description: >-
        Cell bits=28/B_frac=0.3 all resource_exhaustion (300s cap). The 300s
        cap is binding at this parameter because the inner loop iterates 80M
        x-values with Legendre symbol checks. This is a Python performance
        limitation (≈4M iterations/s), not a mathematical obstruction.

  anomalies:
