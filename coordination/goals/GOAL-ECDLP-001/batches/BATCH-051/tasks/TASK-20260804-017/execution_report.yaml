  protocol_deviations:
    - id: DEV-1
      subject: Null control sampled rather than exact
      detail: >-
        The [k]-map null control was computed by sampling K=10000 random points
        from F (by drawing random x in [0, threshold) until on-curve) and
        applying [k^{-1}] via SageMath scalar multiplication. Full enumeration
        of phi^{-1}(F) for the null map would require O(B_frac * N * log N)
        point multiplications, which exceeds the 300s per-run budget for bits≥24.
        The sampled estimate has standard error ≈ 0.01, sufficient to confirm
        null ≈ 2−B_frac and to compare against the exact augmentation ratio.
      severity: minor

    - id: DEV-2
      subject: Cell bits=28/B_frac=0.3 all resource_exhaustion
      detail: >-
        The augmentation computation for this cell requires iterating
        ≈80M x-values with a Legendre symbol check (Python pow(x,(p-1)/2,p))
        plus polynomial evaluation at each on-curve x. This takes ≈300-500s per
        replication in Python, exceeding the 300s per-run cap. All 10 reps were
        cut off at the cap. No augmentation data for this cell.
      severity: minor_resource_limit

    - id: DEV-3
      subject: Two-phase execution (main run + recovery)
      detail: >-
        The main script (run_ici_exp_v2.sage) was interrupted after 2 hours by
        the bash tool timeout before writing output files. Cells 1–8 results
        were captured from stdout and hardcoded in the recovery script
        (run_ici_cell9.sage) which ran cell 9 and wrote all output files.
        All numerical values match the captured stdout verbatim.
      severity: implementation_note

    - id: DEV-4
      subject: ClassicalModularPolynomialDatabase not used
      detail: >-
        The initial implementation attempted to use
        ClassicalModularPolynomialDatabase()[ell] (Kohel database) to find
        Elkies isogenies. This database is not installed on this system
        (FileNotFoundError). The implementation was corrected to use
        E.isogenies_prime_degree(ell) directly, which is the standard SageMath
        method and the mathematically equivalent approach. This did not affect
        results.
      severity: implementation_note

