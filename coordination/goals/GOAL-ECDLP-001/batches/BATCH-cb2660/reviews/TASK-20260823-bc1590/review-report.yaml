  limitations:
    - No experiment or implementation was authorized or run; all mathematical checks are static derivations from the frozen snapshot.
    - The split-product arguments rely on the frozen assumption that every occurrence code is a distinct element of F_p and each f_i is its split monic product.
    - The count-only collision does not establish a collision for every richer weighted packet.
    - The dual-number counterexample is exact for the declared ordinary-trace nonreduced extension but does not transfer to the actual reduced occurrence algebra.
    - No J3 cost, J4 replay, or J5 success/Pareto/novelty conclusion is rendered.
    - No same-round sibling report or output was read, and the Coordinator must compose this joint-local result with the other independent reports.

