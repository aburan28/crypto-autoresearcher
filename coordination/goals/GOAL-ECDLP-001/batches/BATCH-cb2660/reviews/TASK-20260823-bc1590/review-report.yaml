  joints:
    - joint: J1-recurrence-definition-projector-semantics-and-target-freshness
      verdict: breaks
      exact_subclaims_that_hold:
        - check: coefficient_ring_and_split_semantics
          outcome: holds_under_frozen_occurrence_code_assumption
          detail: >-
            With k=F_p and each monic f_i the product of distinct public
            occurrence codes in k, A=k[T_1,...,T_5]/(f_1,...,f_5) is the split
            reduced product of one copy of k per labelled five-tuple. Merely
            saying squarefree would give an etale algebra but not necessarily
            a split one; the frozen in-field occurrence-code assumption is
            therefore load-bearing.
        - check: quotient_multiplication_formula
          outcome: holds
          detail: >-
            Raw coefficient convolution followed by the product of the five
            univariate remainder matrices D_i gives exactly the coefficient
            of every rectangular-basis monomial in UV modulo (f_1,...,f_5).
            Axiswise reduction commutes because the ideal generators use
            disjoint variables.
        - check: binary_powering_invariant
          outcome: holds
          detail: >-
            Inductively b_l=g_R^(2^l) and
            z_l=g_R^(sum_(r<l) epsilon_r 2^r). Thus after all bits of p-1,
            z_final=g_R^(p-1). This is an exact recurrence over A.
        - check: reduced_projector_identity
          outcome: holds_with_empty_branch
          detail: >-
            Coordinatewise on split A, 1-g_R^(p-1) is one precisely where
            g_R=0 and zero elsewhere. If zero occurs and
            mu_R(Z)=Z h_R(Z), squarefreeness gives h_R(0)=mu_R'(0) nonzero,
            and h_R(g_R)/h_R(0) has those same coordinate values. Hence
            e_R=chi_R on the reduced occurrence algebra. If zero is absent,
            mu_R is not divisible by Z and the construction must branch to
            e_R=chi_R=0 rather than invoke h_R.
        - check: regular_trace_contraction
          outcome: holds
          detail: >-
            The regular trace of a tensor monomial is the product of the five
            factor traces. Newton identities derive those factor power sums
            from the public monic f_i, including in characteristics where an
            index vanishes by using the division-free coefficient identities.
            Reduction of a shifted weight must occur before contraction, as
            the packet states.
        - check: minpoly_krylov_identity
          outcome: holds_only_conditionally
          detail: >-
            Once the monic minimal polynomial mu_R of degree d_R is actually
            known, mu_R(g_R)=0 yields the displayed order-d_R weighted Krylov
            recurrence, and expanding h_R gives
            Lambda_(R,alpha)=h_R(0)^(-1) sum_(q<d_R) h_q s_(alpha,q).
            This algebraic identity is not a construction of mu_R or of its
            d_R weighted prefix values.
      blocking_breaks:
        - id: J1-B1-dense-quotient-expansion
          severity: blocking_for_positive_certificate
          detail: >-
            The only coefficient-complete multiplication algorithm asks for
            Mul_f(U,V)[beta] for every beta in the rectangular basis. That is
            the full product_i n_i=Theta(B^5) quotient tensor, with an even
            larger raw convolution index set, before any recompression can be
            certified. The producer's field
            prohibitions_checked.B5_quotient_materialized=false is therefore
            not supported by the displayed algorithm. Disabling recompression
            correctly reproduces the excluded dense baseline, but the packet
            supplies no direct factor-space multiplication that avoids it.
        - id: J1-B2-recompression-is-a-predicate-not-an-algorithm
          severity: blocking_for_positive_certificate
          detail: >-
            Canonical exact recompression is defined as factors whose decoded
            tensor equals the already-defined dense product coefficientwise.
            Lexicographic pivots make a successful factorization canonical,
            but do not construct it, bound its rank or traffic, or give a
            succinct verification procedure. A coefficientwise equality
            certificate can itself require the excluded dense tensor. This is
            a post-hoc exactness predicate, not the frozen separated/apolar
            recurrence operation.
        - id: J1-B3-minimal-polynomial-construction-absent
          severity: blocking_for_positive_certificate
          detail: >-
            The packet names the target-specific mu_R and correctly counts a
            dense degree-d_R recurrence, but gives no algorithm deriving mu_R
            from (f_i,S_6,R) inside the online bound. Computing a multiplication
            matrix, evaluating every split component, or running dense Krylov
            linear algebra would reintroduce uncharged quotient-scale state.
            The conditional recurrence cannot be treated as an output of the
            specified powering procedure.
        - id: J1-B4-target-freshness-not-demonstrated
          severity: blocking_for_positive_certificate
          detail: >-
            The quantifier order is stated correctly: all R-dependent powers,
            recurrence coefficients, traces, ranks, and decoder state are
            online, and no target-fitted table is expressly admitted. But no
            construction or control was executed, and invariance of the
            target-dependent recompression and decoder is explicitly
            unproved. The statement prevents hidden advice on paper; it does
            not establish a fresh-target algorithm.
      target_sign_boundary: >-
        Because g_R uses x_R through S_6, g_R and its projector are unchanged
        under R -> -R. They identify unsigned/existential Semaev lift tuples,
        not a signed relation to the chosen target. This does not falsify
        e_R=chi_R; it limits what that identity means. Acceptance must remain
        downstream of labelled sign resolution and complete projective
        verification.
      joint_scope: >-
        J1 breaks the required constructive, non-dense, fresh-target
        recurrence interface. The dense quotient arithmetic and reduced
        projector identities themselves are correct, so this is not a
        representation-independent lower bound or a rejection of every
        implicit/output-sensitive projector certificate.

    - joint: J2-faithful-packet-all-strata-source-jet-and-decomposition
      verdict: breaks
      exact_subclaims_that_hold:
        - check: reduced_idempotent_decomposition
          outcome: holds
          detail: >-
            Any idempotent e_R gives A=e_R A direct-sum (1-e_R)A. In split A,
            e_R A is the direct sum of the primitive coordinate factors for
            the labelled zero tuples.
        - check: reduced_moment_semantics
          outcome: holds
          detail: >-
            For every monomial weight T^alpha,
            Tr_A(T^alpha e_R) is exactly the sum over labelled zero tuples of
            the five occurrence-code monomials. A singleton therefore yields
            its code monomial values, and a multiple reduced fiber yields
            labelled power sums with unit mass.
        - check: count_only_singleton_control
          outcome: breaks_count_only_packets_exactly
          detail: >-
            Lambda_0 equals one for every singleton zero fiber. Two different
            labelled singleton sources therefore collide under the unweighted
            count-only packet. This exact control does not by itself falsify a
            sufficiently rich fixed weighted packet, and the producer does
            not overstate it as doing so.
        - check: nonreduced_ordinary_trace_control
          outcome: breaks_the_selected_ordinary_trace_jet_family_exactly
          detail: >-
            In C=k[epsilon]/(epsilon^2), multiplication by u=a+b epsilon has
            matrix [[a,0],[b,a]] and regular trace 2a, independent of b (and
            identically zero in characteristic two). More generally the
            regular trace pairing annihilates the nilradical, so fixed
            ordinary-trace Krylov moments cannot recover the epsilon jet. For
            g=epsilon, mu_g=Z^2 and the normalization mu=Z h with h(0) nonzero
            fails. Hasse/dual-basis functionals would be a different,
            explicitly constructed family.
      blocking_breaks:
        - id: J2-B1-packet-not-frozen
          severity: blocking_for_positive_certificate
          detail: >-
            The asserted packet uses weights alpha in a "frozen O+O", but no
            order ideal O, border, cardinality, or target-independent rule for
            selecting it appears in the packet. Consequently the number and
            identity of moments are not fixed, and neither constant size nor
            output sensitivity is a checkable statement.
        - id: J2-B2-flat-extension-is-only-a-decoder-contract
          severity: blocking_for_positive_certificate
          detail: >-
            Asking a decoder to verify flat-extension rank, build five
            multiplication operators, and decompose them does not prove that
            the unspecified moments satisfy the necessary rank equality for
            every admitted support. There is no maximum support/rank theorem,
            invertible moment minor, extension degree, collision theorem, or
            construction/cost of the required additional moments. The full
            weighted reduced packet remains inconclusive, exactly as the
            producer records.
        - id: J2-B3-occurrence-versus-scheme-multiplicity
          severity: blocking_for_all_strata_claim
          detail: >-
            Distinct occurrence codes can preserve provenance for repeated
            geometric points or repeated x-coordinates, provided the weighted
            decoder is faithful. But the reduced idempotent assigns unit mass
            to each primitive labelled tuple and erases repeated-witness or
            local-scheme multiplicity at the same primitive coordinate. The
            promise to emit multiplicity provenance is therefore unsupported
            beyond distinct reduced occurrence labels.
        - id: J2-B4-nonreduced-source-jets-missing
          severity: exact_break_for_declared_family
          detail: >-
            The dual-number calculation is an exact proves-too-much control:
            ordinary regular trace cannot encode the required nonreduced jet.
            Since the frozen all-strata requirement includes nonreduced
            decomposition and the selected family supplies no Hasse-jet or
            local dual functional, the all-strata packet fails its declared
            boundary. This counterexample does not transfer to an impossibility
            result for the actual reduced occurrence algebra or for a
            jet-sensitive successor family.
        - id: J2-B5-empty-and-signed-acceptance-branches
          severity: specification_gap
          detail: >-
            The empty branch is semantically clear but must be constructed by
            detecting mu_R(0) nonzero or by explicitly computing chi_R; the
            displayed h_R formula does not cover it. At the other end, a
            nonempty projector yields only unsigned Semaev candidates. The
            producer correctly requires a downstream 2^5 signed-lift envelope
            and complete projective checks, but no decoder or signed replay was
            established. No source tuple in this packet is therefore an
            accepted relation.
      stratum_assessment:
        empty: semantic_identity_holds_construction_missing
        singleton: full_label_moments_semantically_hold_count_only_collides
        multiple_reduced: conditional_on_unsupplied_flat_extension_theorem
        same_point_or_x_distinct_occurrences: separable_in_principle_by_codes_not_proved_for_packet
        repeated_witness_or_local_multiplicity: not_recovered_by_reduced_idempotent
        nonreduced: exact_ordinary_trace_counterexample
        identity_infinity_vertical_tangent_secant_wrong_sign: downstream_complete_verification_required_not_established_here
      joint_scope: >-
        J2 breaks the faithful fixed-packet and all-strata source-jet gate. It
        does not refute the exact reduced value-projector semantics, prove a
        collision for every possible weighted reduced packet, or close a
        Hasse-jet/output-sensitive successor.

  control_checks:
    - control: empty_projector
      outcome: holds_semantically
      detail: chi_R is zero when zero is absent from image(g_R).
    - control: one_reduced_source
      outcome: holds_semantically
      detail: Full labelled monomial moments equal that source's code monomials.
    - control: two_labelled_singletons_under_count_only_packet
      outcome: exact_collision
      detail: Both return Lambda_0=1.
    - control: equal_short_weighted_moments
      outcome: designed_not_instantiated
      detail: >-
        No explicit pair for a genuinely frozen O+O was supplied, because O
        itself was not supplied. This control cannot be upgraded into a full
        weighted-packet counterexample.
    - control: same_support_different_multiplicity
      outcome: breaks_if_multiplicity_is_not_encoded_by_distinct_occurrence_codes
      detail: A reduced indicator records support with unit masses, not local or repeated-witness multiplicity.
    - control: nonreduced_double_source
      outcome: exact_break
      detail: The regular trace pairing on dual numbers annihilates the nilradical.
    - control: fresh_target_replacement
      outcome: specified_not_executed
      detail: No target-dependent preprocessing is declared, but no fresh-target recurrence was run.
    - control: representation_sentinel
      outcome: breaks_as_constructive_interface
      detail: The only exact certificate is coefficientwise against the full dense tensor.
    - control: signed_verification_boundary
      outcome: correctly_deferred_but_unestablished
      detail: Semaev zero membership is not accepted as a signed relation without complete point replay.

  proof_architecture_checks:
    - check: exact_baseline_reproduction
      outcome: holds
      detail: Identity recompression yields the full Theta(B^5) rectangular quotient arithmetic coefficient for coefficient.
    - check: observation_collision_search
      outcome: partial_exact_breaks_only
      detail: >-
        Count-only singleton and nilpotent-jet collisions are exact. No exact
        collision is supplied for every fixed weighted packet on the reduced
        occurrence family.
    - check: quantifier_fidelity
      outcome: statement_holds_construction_unestablished
      detail: Target-independent preprocessing is stated before every fresh R, but the missing O, mu_R construction, and recompression algorithm prevent verification of the universal online witness.
    - check: interface_preservation
      outcome: breaks
      detail: >-
        Dense coefficient multiplication to canonical factors has no direct
        transform or bounded exact certificate, and reduced regular-trace
        moments do not preserve nonreduced jet information.
    - check: proves_too_much
      outcome: control_detects_break
      detail: >-
        The ordinary-trace source argument would claim nilpotent-jet recovery
        on dual numbers, where that conclusion is known false; the explicit
        trace matrix localizes the failure.
    - check: method_ceiling
      outcome: correctly_scoped
      detail: >-
        The strongest supported result is exact dense formula semantics plus
        exact failures of count-only and ordinary-trace nonreduced variants.
        No representation-independent ceiling follows.

  scoped_recommendation:
    verdict: REVISE
    rationale: >-
      Both owned positive gates break, while several component identities are
      correct and the counterexamples are family-local. REJECT would overstate
      the evidence because no impossibility is shown for a direct low-rank
      recurrence, a fixed label-faithful output-sensitive moment order ideal,
      or explicitly constructed jet-sensitive functionals.
    minimum_successor_requirements:
      - >-
        Give a direct separated/apolar multiplication and reduction algorithm
        whose factors are computed without enumerating every quotient
        coefficient, together with target-uniform exact rank, traffic, and
        verification bounds.
      - >-
        Construct mu_R or an equivalent succinct annihilator/projector
        certificate from public inputs inside the online bound; do not receive
        it as target advice.
      - >-
        State the exact target-independent order ideal O and prove a
        no-collision/flat-extension theorem for every admitted reduced support
        stratum, including an explicit output-size and characteristic bound.
      - >-
        Separate reduced occurrence provenance from local multiplicity and
        add explicitly constructed and charged Hasse/dual functionals if
        nonreduced jets remain in scope.
      - >-
        Keep Semaev projector membership strictly before signed complete
        projective verification and final scalar acceptance.

