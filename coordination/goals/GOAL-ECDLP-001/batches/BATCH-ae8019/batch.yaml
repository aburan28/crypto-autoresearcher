blocking_findings:
  - id: REV-GAP-REPRESENTATION-007
    severity: critical
    predecessor_finding: REV-BOOT-GAP-001
    summary: >-
      Gap ordering and retained bytes are undefined. No gap record kind,
      representative, refinement, ordering, tie rule, or archive allocation
      exists for the 8191 retained gap values and their selected endpoints.
  - id: REV-CANONICAL-SCHEDULE-008
    severity: critical
    predecessor_finding: REV-SERIALIZATION-002
    summary: >-
      COMPSCH2, PROVRC02, and ALIASv02 admit multiple byte streams under
      reasonable implementations because their complete grammars are absent.
  - id: REV-RESOURCE-CONSUMER-009
    severity: critical
    predecessor_finding: REV-RESOURCE-ARTIFACT-004
    summary: >-
      The zero-residual resource ledger omits per-arm sorts and quantile
      endpoints, independent rank and retained-index comparison, S3 bootstrap
      index consumption, and gap storage.
  - id: REV-PACKAGE-FINALIZATION-010
    severity: critical
    predecessor_finding: REV-RESOURCE-ARTIFACT-004
    summary: >-
      S4 final package attestation is causally self-referential: it produces the
      logs, provenance, and index that purportedly contain verification, final
      measurements, validity, and hashes of themselves.
  - id: REV-MUTATION-LAYER-011
    severity: major
    predecessor_finding: REV-MUTATION-CONTROL-005
    summary: >-
      Mutation enclosure, offsets, retained and rebound digests, and ALIASv02
      parsing are not frozen, so the required first error is not uniquely
      determined.
required_successor_repairs:
  - Freeze an exact archived gap representation, interval refinement, total ordering, ties, and endpoint records.
  - Freeze every COMPSCH2 counter, flag, reserved byte, and digest-input equation grammar with fixtures.
  - Freeze the complete ALIASv02 field layout and canonical provenance JSON schema and encoding.
  - Bind every mutation to an exact enclosing object, path, ordinal, byte offset, retained digest, rebound digest, and resulting hash.
  - Add per-arm sorts and endpoints, independent rank and retained-index comparisons, S3 index consumption, gap storage, and every corresponding operation and byte row.
  - Split execution capture, package construction, immutable reread validation, and final external receipt into an acyclic graph.
  - Recompute every affected payload, padding, archive, operation, logical-I/O, write, read, reserve, and hard-cap equation.
