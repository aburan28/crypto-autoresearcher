          one assignment that reproduces every published byte, both published
          digests, and the published offset semantics. A different assignment
          could reproduce the same bytes; the point of the repair is that
          exactly one is now frozen.
      - id: JUD-02
        subject: gap ordering key width
        statement: >-
          The ordering key is the 24-byte transformed lower endpoint, which
          keeps the radix cost at the predecessor's 196584 visits per series
          and matches the reviewer's 24-byte-per-endpoint counting convention.
          A 32-byte midpoint-sum key was considered and rejected because it
          would change counts the reviewer had already recomputed without
          improving determinism.
      - id: JUD-03
        subject: zero adaptive refinement
        statement: >-
          Refinement is frozen at zero passes rather than being made adaptive.
          This is a deliberate choice to keep the archived ordering independent
          of observed values; a reviewer may instead prefer a bounded adaptive
          policy, which would require a different quantifier-order argument.
