  finding_dispositions:
    - id: REV-GAP-REPRESENTATION-007
      severity: critical
      blocking: true
      reviewer_evidence: >-
        FITREC02 has 49152 arm-fit records with alpha and beta interval
        endpoints only; no gap record kind, representative, refinement,
        ordering, tie rule, or archive allocation exists for 8191 gaps.
      disposition: specified_closed_pending_fresh_independent_verification
      closed_by_repairs: [1, 5]
      successor_locations:
        - experiment.gap_representation_contract
        - experiment.payload_layouts.gap_value_file_v2
        - experiment.payload_layouts.type1_endpoint_record_file_v2
        - experiment.artifact_bijection.rows ordinals 10 and 11
        - experiment.controls C7-gap-representation-and-ordering
      closure_summary: >-
        The gap is now an archived record kind. GAPVAL02 stores all 8191
        enclosures as exact i192be Q63.128 beta differences in 64-byte records
        at artifact ordinal 10; QUANTL02 stores fourteen Type-1 endpoint
        records in 72-byte records at artifact ordinal 11; the ordering key,
        sign transform, tie rule, totality argument, zero-pass refinement
        policy, width bound, and every resulting resource and archive row are
        frozen and reconciled.
      residual_risk_declared: >-
        Ordering consults only the lower endpoint and the draw ordinal, so two
        enclosures with equal lower endpoints and different upper endpoints
        order by draw ordinal. This is stated in the record rather than hidden.
    - id: REV-CANONICAL-SCHEDULE-008
      severity: critical
      blocking: true
      reviewer_evidence: >-
        COMPSCH2, PROVRC02, and ALIASv02 admit multiple byte streams under
        reasonable implementations because their complete grammars are absent.
      disposition: specified_closed_pending_fresh_independent_verification
      closed_by_repairs: [2, 3]
      successor_locations:
        - experiment.payload_layouts.compiler_schedule_v2
        - experiment.payload_layouts.provenance_receipt_file_v2.canonical_json_encoding
        - experiment.payload_layouts.provenance_receipt_file_v2.nested_schema
        - experiment.mutation_controls.alias_descriptor_grammar
      closure_summary: >-
        COMPSCH2 now carries a complete offset grammar, three defined flag
        bits with a per-record value, the exact counter values of all 22 used
        records, an all-zero rule for the 10 unused records, and a frozen
        digest-input equation grammar with a fully worked example plus a
        non-digest byte fixture. ALIASv02 gains a complete field layout that
        reproduces the immutable published base bytes, both published digests,
        and the published zero-based offset 21. PROVRC02 gains a complete
        canonical JSON encoding rule and a fully nested sorted-key schema.
      declared_limitation: >-
        Digest values are not displayed because this task computes no hash.
        Byte canonicity is established by freezing every digest input as an
        exact byte string; the digest values are pure functions of those
        inputs and are left null rather than fabricated.
    - id: REV-RESOURCE-CONSUMER-009
      severity: critical
      blocking: true
      reviewer_evidence: >-
        Per-arm sorts and endpoints, independent retained-index comparison,
        cluster-rank comparison, S3 index consumption, and gap storage are
        absent.
      disposition: specified_closed_pending_fresh_independent_verification
      closed_by_repairs: [5, 1, 7]
      successor_locations:
        - experiment.resource_contract.stage_ledger
        - experiment.semantic_consumer_closure
        - experiment.resource_contract.reconciliation
      closure_summary: >-
        All seven reviewer-enumerated omissions now have exact operation and
        logical-I/O rows in named stages, and the recomputed archive increment
        for the retained gap values and endpoint records is stated as 525360
        bytes with the total moving from 24037344 to 24562704.
      residual_risk_declared: >-
        Wall, CPU, and RSS values remain design estimates, as they were in the
        predecessor. Only the counting-based rows are exact.
    - id: REV-PACKAGE-FINALIZATION-010
      severity: critical
      blocking: true
      reviewer_evidence: >-
        S4 produces the logs, provenance, and index that purportedly contain
        verification, final measurements, validity, and hashes of themselves.
      disposition: specified_closed_pending_fresh_independent_verification
      closed_by_repairs: [6, 7]
      successor_locations:
        - experiment.finalization_graph
        - experiment.resource_contract.stage_ledger S4, S5, S6
        - experiment.payload_layouts.log_pair_file_v2.capture_boundary_rule
        - experiment.payload_layouts.provenance_receipt_file_v2.forbidden_content
        - experiment.controls C8-acyclic-finalization-and-silence
      closure_summary: >-
        The single S4 splits into S4 execution capture, S5 package
        construction, S6 immutable reread validation, and an external final
        receipt outside the package. Three named predecessor cycles are listed
        with their removal mechanism, and the graph is given as an explicit
        node and edge list with a topological order and a strict-forward-edge
        acyclicity argument.
      residual_risk_declared: >-
        The external final receipt is outside this experiment's authority. The
        design states its obligations but cannot enforce them; an archive task
        must honor them.
    - id: REV-MUTATION-LAYER-011
      severity: major
      blocking: true
      reviewer_evidence: >-
        Fixtures do not identify the enclosing object or every retained and
        rebound digest, so conforming enclosures can reach different first
        errors.
      disposition: specified_closed_pending_fresh_independent_verification
      closed_by_repairs: [4]
      successor_locations:
        - experiment.mutation_controls.enclosure_definition
        - experiment.mutation_controls.frozen_first_error_check_sequence
        - experiment.mutation_controls.deterministic_mutations
      closure_summary: >-
        A 160-byte MUTENC02 enclosure is frozen with a complete offset layout
        and all base field values. Each mutation names its enclosing object,
        field path, absolute byte offset, mutation ordinal, base and mutated
        bytes, every retained digest, every rebound digest, its resulting
        length, its first failing check, its reason code, and an argument for
        why no earlier check fires. A nine-step ordered check sequence makes
        the first error a function of the enclosure bytes alone.
      preserved_outcomes: >-
        All four registered first reason codes are unchanged: 0x0301, 0x0302,
        0x0303, and 0x0304. No repair forced any of them to move.

  repair_dispositions:
    - repair: 1
      text: 'Freeze an exact archived gap representation, interval refinement, total ordering, ties, and endpoint records.'
      status: implemented
      where: experiment.gap_representation_contract and payload_layouts.gap_value_file_v2 and payload_layouts.type1_endpoint_record_file_v2
      how: >-
        GAPVAL02 with 8191 sixty-four-byte records; QUANTL02 with 14
        seventy-two-byte records; exact beta-difference arithmetic with a
        proved zero-rounding argument; a 2^-119 width bound derived from the
        parent fit criterion; a zero-adaptive-pass refinement policy with its
        rationale; a sign-transformed 24-byte lower-endpoint radix key; a
        stable-radix draw-ordinal tie rule with a totality argument; and a
        sorted-position permutation invariant.
    - repair: 2
      text: 'Freeze every COMPSCH2 counter, flag, reserved byte, and digest-input equation grammar with fixtures.'
      status: implemented
      where: experiment.payload_layouts.compiler_schedule_v2
      how: >-
        A twelve-field offset grammar summing to 128; three defined flag bits
        with an explicit value per record; exact key_count, operation_count,
        logical_bytes, and output_bytes for all 22 used records; an all-zero
        128-byte rule for the 10 unused records; column checks that reproduce
        10484960, 1247703680, 146798080, 24562704, 234813518, and
        143009799600; a frozen digest-input grammar per record class with two
        fully written example strings; and a byte fixture for record ordinal 0
        offsets 0 through 39 and 104 through 127.
    - repair: 3
      text: 'Freeze the complete ALIASv02 field layout and canonical provenance JSON schema and encoding.'
      status: implemented
      where: experiment.mutation_controls.alias_descriptor_grammar and experiment.payload_layouts.provenance_receipt_file_v2
      how: >-
        ALIASv02 is given a six-field layout summing to 24 with a four-byte
        alias entry, three enums, per-entry base values, and a byte map that
        reconstructs the immutable published hex exactly. PROVRC02 gains a
        canonical JSON encoding rule covering encoding, whitespace, key
        sorting at every level, integer-only numbers, the exact escape set,
        array order, and no trailing newline, plus a thirteen-key sorted
        top-level schema with every nested object's sorted key list and value
        type, a maximum JSON length of 130972 with its derivation, and an
        explicit forbidden-content list with its anti-cycle rationale.
    - repair: 4
      text: 'Bind every mutation to an exact enclosing object, path, ordinal, byte offset, retained digest, rebound digest, and resulting hash.'
      status: implemented_with_one_declared_null
      where: experiment.mutation_controls
      how: >-
        MUTENC02 is frozen at 160 bytes with a seventeen-field offset layout
        and all base field values. Each of the four mutations binds enclosing
        object, field path, absolute byte offset, mutation ordinal, base and
        mutated bytes, retained digests by value, rebound digests by name, and
        resulting enclosure length.
      declared_null: >-
        Resulting enclosure hashes and the one rebound summary digest are null
        because this task computes no hash. Each null carries the complete
        frozen input bytes that determine it, including the exact 36-byte
        mutated CSUMDAT2 frame.
    - repair: 5
      text: 'Add per-arm sorts and endpoints, independent rank and retained-index comparisons, S3 index consumption, gap storage, and every corresponding operation and byte row.'
      status: implemented
      where: experiment.resource_contract.stage_ledger and experiment.semantic_consumer_closure
      how: >-
        Six per-arm sorts add 1179504 operations and 2359008 logical bytes to
        S3; twelve endpoint selections add 12 operations and 288 bytes;
        independent index comparison adds 7863360 operations and 7863360 bytes
        to S2; independent cluster-rank comparison adds 160 operations and
        5120 bytes to S2; S3 index consumption adds 7863360 input bytes; gap
        and endpoint storage add 8205 serialization operations and 525232
        payload write bytes; mutation-enclosure work adds 12 operations and
        1279 bytes to S2.
    - repair: 6
      text: 'Split execution capture, package construction, immutable reread validation, and final external receipt into an acyclic graph.'
      status: implemented
      where: experiment.finalization_graph and experiment.resource_contract.stage_ledger
      how: >-
        Four separated nodes S4, S5, S6, and EXTRECEIPT with their own
        resource rows, a silence rule that makes S4 through S6 emit nothing, a
        provenance scope split into measured S0 through S3 and declared-only
        S4 through S6, a retained self-neutral index entry, a write-nothing
        reread stage, and an external owner for the final verdict and the
        index digest.
    - repair: 7
      text: 'Recompute every affected payload, padding, archive, operation, logical-I/O, write, read, reserve, and hard-cap equation.'
      status: implemented
      where: experiment.resource_contract.reconciliation and experiment.artifact_bijection.geometry_checks and experiment.forced_changes_from_predecessor
      how: >-
        Every displayed equation is restated with its new terms; eight forced
        changes are enumerated with cause and effect; per-file payload
        equations, header sum, payload sum, padding sum, exact file sum, cap,
        reserve, traffic, and call counts are all restated; and stagewise
        hard-minus-planned slack vectors are displayed and summed to prove
        every hard value dominates its planned value while the global caps stay
        exactly at their predecessor values.

