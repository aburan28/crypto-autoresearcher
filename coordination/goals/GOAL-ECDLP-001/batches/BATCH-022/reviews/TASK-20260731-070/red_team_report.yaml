    - id: RT070-B3
      severity: BLOCKING ON DECISION
      blocks_ledger_disposition: true
      advisory: false
      title: package_pass / low R_null is not structure support — inventor-protocol tell
      target: >-
        Any reading of destroy_demonstrated / package_pass_observation /
        F2_eligible as structure-dependent claw win or null-gate success for
        H-DS-001.
      statement: >-
        RT056-B1 hard-destroy bit is empirically met (R_null≈0.044<0.9, plant
        OFF, not soft-pass). Composition join sample checks:
        (1140+3792)%4096=836. But inventor-protocol §3 asks what the null
        should do to a real structure signal: R_null should rise toward ≥0.9
        when structure is removed. Observed R≈0.0345 and R_null≈0.044 — the
        apparent split advantage survives the null. That is the canonical
        artifact tell, not mechanism vindication. Protocol vocabulary
        "destroy_demonstrated" means "R_null can fall below 0.9 after
        composition repair" (anti-asymmetric-crippling), which is the opposite
        direction from "null destroys the claimed advantage."
      which_way_it_cuts: >-
        Blocks promoting package_pass to support / structure_gate_passed;
        weakens prior readings that treated R_null≫1 as a clean null gate.
      discharging_requirement: >-
        Ledger must separate (a) protocol RT056-B1 bit met on this cell from
        (b) inventor-protocol null-control failure for structure claims; must
        not equate F2_eligible with S1_met.

