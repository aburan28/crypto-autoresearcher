  # =====================================================================
  headline: >-
    THE ATTAINABILITY DUTY FOUND WHAT IT WAS CREATED TO FIND, AND IT FOUND IT TWICE.
    EXP-SMTH-001 is a materially better contract than BATCH-021's - the null is matched
    by construction rather than by argument, the decision-variable degeneracy check is
    real, the two derivably-degenerate variables are quarantined honestly, and the u = 6
    rung is a textbook example of declaring an unattainable band in advance and confining
    it to a role its unattainability does not spoil. But the two bands that actually
    decide the experiment were not checked, and both are unreachable by a correct
    measurement. Under a flawless implementation with HEUR-DS-1 exactly true, this run
    lands in M-5 MAP SUSPENDED with near-certainty. That is the BATCH-021 D-2 defect
    reproduced through a probabilistic guard instead of a hard enumeration cap.

  blocking_defects:
    - id: RV012-A1
      severity: fatal
      title: TAIL-DS-1 fails on a correct uniform null, so M-5 leg (a) fires deterministically
      finding: >-
        TAIL-DS-1 sets p_ext equal to the rho-model probability of a sample at least as
        smooth as the smoothest observed, and passes iff p_ext * n >= 1. Under the very
        model the rule invokes, p_ext = min_j rho(u_j) and rho(u_j) is uniform on (0,1),
        so n * p_ext is asymptotically Exp(1) and P(pass) = (1 - 1/n)**n = 0.36788. The
        contract's m_2_attainable block states this probability INVERTED, as "about
        1 - 1/e" = 0.632. Empirically it is far worse than 1/e, because at X of order
        2**32 to 2**40 the asymptotic rho massively under-predicts the density of very
        smooth integers in the deep tail, which is exactly where p_ext is evaluated. I
        ran the declared OBJ-NULL-UNIF arm end to end, 8 independent draws of n = 131328
        uniform integers on [1, p**2] per cell, factored with sympy 1.14.0, and measured
        TAIL-DS-1 passing 0 of 8 at bits 16 and 0 of 8 at bits 20; the largest p_ext * n
        observed anywhere was 0.73 and the bits-16 values ran from 4e-7 to 0.044.
      consequence: >-
        bit_size_pass requires TAIL. OBJ-NULL-UNIF therefore fails bit_size_pass at both
        bit sizes, M-5 leg (a) fires, and M-5 precedes M-1, M-2, M-4 and M-6 in the frozen
        order. All four substantive branches are jointly unreachable and the run yields
        MAP SUSPENDED, an instrument signal, on a correct apparatus. Even on the
        optimistic analytic figure of 1/e per cell the map gives P(M-5) = 0.865,
        P(M-2) = 0.018 and P(M-4) = 0.055 under the truth of the hypothesis; on the
        measured figures M-2 is effectively zero.
      why_verbatim_inheritance_is_not_a_defence: >-
        The reuse is genuine - I diffed the text against
        experiments/EXP-DS-001/specification.v2.yaml heur_ds_1_decision_rule and
        RATE-DS-1, KS-DS-1, TAIL-DS-1, c = 8, min_samples_per_bit_size, D_formula and
        u_star_formula are quoted verbatim - and verbatim reuse is the right policy. But
        the named duty is attainability AT THESE PARAMETERS, and this is the first time
        in twenty-two batches that TAIL-DS-1 has ever been load-bearing, because the
        EXP-DS-001 HEUR arm never ran. A threshold that has never been exercised is not a
        validated threshold, and freezing it forward without measuring it against a
        correct null is the precise error this duty exists to catch.
    - id: RV012-A2
      severity: fatal
      title: ENC-B and ENC-A are undefined on exactly 512 of the 131328 enumerated half-tuples
      finding: >-
        The third summation polynomial is
        S_3(x1,x2,Z) = (x1-x2)**2 Z**2 - 2[(x1+x2)(x1 x2 + a) + 2b] Z
        + [(x1 x2 - a)**2 - 4b(x1+x2)]. I verified this form on a real toy curve
        y**2 = x**3 + 7x + 11 over p = 46349 by checking that it vanishes exactly at
        x(P+Q) and x(P-Q). Its leading coefficient in Z is (x1 - x2)**2, which is zero
        over F_p if and only if x1 = x2. Over 7260 half-tuples with i <= j on 120
        factor-base points I measured exactly 120 degenerate pairs - exactly the diagonal
        - and 7140 non-degenerate ones. At Bfb = 512 that is exactly 512 degenerate
        half-tuples out of 131328, or 0.3899 percent. On every one of them f_ij collapses
        to degree 1, e_1 = -c_1/c_2 and e_2 = c_0/c_2 are divisions by zero, and both
        ENC-B and ENC-A are undefined.
      consequence: >-
        The contract fixes n_per_set = 131328 as exhaustive over i <= j, requires the
        other three sets at that same n because the two-sample threshold assumes matched
        sizes, instructs the run to count c_2 == 0 draws, and fires M-0 on "a sample set
        with fewer than 131328 recorded samples" - but never says what a degenerate draw
        contributes. Dropping them, the only mathematically available choice, leaves the
        two OBJ-REAL sets at C(512,2) = 130816 and M-0 fires DETERMINISTICALLY on every
        possible outcome, before any statistic is read. Sentinel-filling them is an
        undeclared post-freeze design choice that contaminates p_hat at every rung and
        breaks the matched n for DV-4. Note that M-0's own degenerate clause is written
        at "above 1 percent", so at 0.39 percent it stays silent and the count-shortfall
        clause fires instead - an interaction the contract did not anticipate.
      note_on_repairability: >-
        Cheaply repairable in principle by enumerating i < j at n = C(512,2) = 130816,
        which still clears the frozen 10**5 minimum, with the DV-4 threshold re-derived as
        1.63*sqrt(2/130816) = 0.006374. I do not author the repair; that is the
        Coordinator's, and it is a versioned amendment because n, the DV-4 threshold and
        the POW-1 counts all move.

  material_but_non_blocking_defects:
    - id: RV012-B1
      severity: material
      title: M-4's attainability demonstration is invalid on both of its legs
      finding: >-
        Leg one asserts the diagonal draws give "S_3(x, x, Z) ... a forced square
        structure that biases e_2 toward the quadratic residues". This is mathematically
        false, per RV012-A2 - on the diagonal there is no root multiset of size two, no
        e_2, and no bias. Leg two asserts that concentrating e_2 on a density-1/2 set
        "displaces the CDF of N by up to 0.25 in supremum norm, which is 39 times the
        DV-4 threshold". DV-4 is a two-sample KS on the LPF statistic
        Z_j = ln(N_j)/ln(P_max(N_j)), not on the CDF of N. Concentrating e_2 on the
        quadratic residues, a set generic with respect to the factorization of
        e_1*p + e_2 + 1, displaces the Z CDF by approximately nothing. This is the same
        species of substitution that KS-DS-1's own note forbids elsewhere in the contract.
      status_of_the_branch: >-
        M-4 itself remains formally reachable - no cap, closed form or protocol parameter
        bounds DV-4 away from rejection - so this is not a BATCH-021-style unreachable
        branch. It is an unproved attainability claim in a block whose entire purpose is
        to prove attainability. Worse, once RV012-A1 is fixed M-4 becomes the MODAL
        substantive branch under the truth of the hypothesis, because TAIL noise fails the
        real arm independently at each cell - a false `weaken` is a worse failure than an
        unreachable branch.
    - id: RV012-B2
      severity: material
      title: KS-DS-1 at bits 16 sits on its threshold on a correct null
      finding: >-
        Measured KS of a correct uniform null against the asymptotic Dickman LPF CDF, 8
        draws at bits 16 - 0.04838, 0.04850, 0.04875, 0.04889, 0.04911, 0.04972, 0.04980,
        0.05061 - against a threshold of 0.05, so one of eight correct nulls FAILED
        KS-DS-1 outright. The spread is plus or minus 0.0007, so this is systematic
        finite-X model bias of about 0.049, not sampling noise. At bits 20 the same
        statistic is 0.0375 to 0.0387 and is safe. The contract's defence, that 0.05 is
        eleven times the alpha = 0.01 critical value 0.004498, compares the threshold to
        sampling noise and omits the model bias that actually consumes it.
      consequence: >-
        An independent 10-percent-order false-fire probability on M-5 leg (a) at bits 16,
        on a knife edge that any innocuous implementation choice can flip - the handling
        of N = 1, of prime N, or a curve whose p**2/D ratio differs from 0.515.
    - id: RV012-B3
      severity: material
      title: POW-1's remedy for the u = 6 rung is counter-productive
      finding: >-
        POW-1 attributes the u = 6 rung's exclusion to low expected counts and states
        n >= 30/rho(6) = 1526718 as the sample size that would power it. I confirm the
        arithmetic. But the measured cause of the rung's misbehaviour is systematic, not
        statistical - on a CORRECT uniform null I measured p_hat/rho(u_D) ratios of
        1.18, 1.47, 2.13, 4.41, 10.07 at bits 16 and 1.13, 1.30, 1.73, 2.64, 6.87 at
        bits 20 across the five rungs. The u = 6 rung at bits 16 is already OUTSIDE the
        factor-8 band on a correct null. Raising n to 1526718 would not convert that rung
        into a powered pass; it would convert it into a systematic RATE-DS-1 FAILURE. The
        remedy is ranked into the BATCH-023 opening by M-2's mandatory_companions and
        should not be carried forward unmodified.
      related: >-
        The same inflation consumes most of the u = 5 headroom - a correct null already
        sits at 4.41 times the band centre at bits 16 against an edge of 8. Part of this
        is the declared p**2 versus D mismatch, which I compute contributes factors 1.08,
        1.16, 1.27, 1.39 and 1.54 at the five rungs; the remainder is finite-X.
    - id: RV012-B4
      severity: minor
      title: DECAY-1's crossing count is out by a factor 3.26
      finding: >-
        The contract states that crossing DECAY-1 at u = 6 requires 841 counts. That
        figure multiplies the threshold by p_hat(u2) = 1, which is the BATCH-020
        stand-in's value, not a genuine sample's. For a genuine sample with
        p_hat(u2) = rho(2) the crossing count is 0.00640378 * 0.30685 * 131328 = 258. The
        conclusion is unaffected - a Poisson count of mean 2.6 reaches neither 258 nor 841
        - and I independently confirm the confinement of u = 6 to DECAY-1 does not spoil
        DECAY-1. But a number stated inside an attainability argument and wrong by a
        factor 3.26 is the class of unchecked arithmetic this duty exists to catch.
    - id: RV012-B5
      severity: minor
      title: two unstated scope restrictions inside the frozen rule
      finding: >-
        First, DV-5 is defined "per encoding and bit size" but M-1's condition reads only
        ENC-B, so a DECAY firing on ENC-A is recorded and classified by no branch. Harmless
        in fact - I compute the ENC-A ratio as about rho(ln p/ln Bsm)**2 = 0.0024, below
        the 0.0064 threshold - but it is an unstated restriction. Second, at the u = 2
        rung 8*rho(2) = 2.455 exceeds 1, so RATE-DS-1's upper edge is unattainable by
        construction there and that rung can only fail low; the contract's "the band is
        wide" is true on one side only.
    - id: RV012-B6
      severity: material
      title: the stated justification for preferring ENC-B is vacuous, and INT-1's size was fitted to the frozen D
      finding: >-
        step_3_invariants prefers ENC-B because the pair is "well defined whether the
        roots lie in F_p or in F_{p**2}". Over the frozen factor base that case never
        arises - the roots of S_3(x_i, x_j, Z) are x(P_i + P_j) and x(P_i - P_j), which
        lie in F_p whenever P_i and P_j do. Measured - 7140 of 7140 non-degenerate
        half-tuples split over F_p, zero irreducible. See the fifth section of
        attainability_check.md; the consequence is discussed under question 3 below.

  # =====================================================================
  answers_to_the_five_dominant_questions:

    q1_attainability:
      verdict: FAIL
      one_line: >-
        Two independent defects make M-1, M-2, M-4 and M-6 jointly unreachable by a
        correct measurement; a third band, u = 6, is the one the contract handled
        exactly right.
      band_and_branch_table:
        M-0: >-
          Reachable as claimed - and it fires with certainty under RV012-A2, which is the
          defect, not the attainability.
        M-5_leg_a_firing_side: Reachable; the base-2-logarithm route is a real achievable error.
        M-5_leg_a_not_firing_side: >-
          NOT ATTAINABLE. Measured 0 of 16 on correct nulls. FATAL - see RV012-A1.
        M-5_leg_b: >-
          Reachable on both sides. The rejection side is essentially certain for a correct
          ENC-A, as claimed. Objection recorded - the certificate proves power against a
          smoothness-shifted alternative, while DV-4's real alternative is an
          equidistribution defect in the joint law of (e_1, e_2), which ENC-B's base-p
          interleaving can carry with almost no LPF displacement. The certificate bounds no
          Type II error in the direction that matters.
        M-5_leg_c: >-
          Reachable on both sides. I verified the bijection independently - with lift the
          representative in [0, p), N = lift(e_1)*p + lift(e_2) + 1 is injective on
          [0,p) x [0,p) with image exactly [1, p**2] - so DV-7's non-rejection is exact by
          derivation as claimed.
        M-1: >-
          Reachable on both sides, and the only branch whose attainability argument is
          fully sound. Firing - the BATCH-020 stand-in gives a ratio 7.6 to 8.2 times the
          threshold; I reproduce that. Not firing - I measured decay ratios of 5.27e-4 at
          bits 16 and 3.95e-4 at bits 20 on correct nulls, an order of magnitude below
          0.00640378.
        M-2: >-
          NOT ATTAINABLE. Pre-empted by M-5 leg (a) under RV012-A1, and independently by
          M-0 under RV012-A2. The contract's argument - that the null arm demonstrates
          M-2's reachability on the same code path in the same run - is the RIGHT FORM of
          argument and I endorse it, but its premise is empirically false because the null
          does not pass bit_size_pass.
        M-4: >-
          Formally reachable, since nothing caps DV-4 away from rejection, but the
          demonstration offered is invalid on both legs - see RV012-B1 - and after
          RV012-A1 is repaired M-4 becomes the modal branch under the truth of the
          hypothesis.
        M-6: >-
          Reachable. The factor-base-density reason is plausible; independently, the
          measured bits-16 versus bits-20 KS asymmetry, 0.049 against 0.0385, makes a
          split verdict likely for a finite-X reason rather than a Semaev one, which would
          be over-read as "the data do not discriminate the explanations".
        bsm_rungs_u2_to_u5_both_ladders: >-
          Attainable and correctly powered at both cells - I recomputed every u from the
          frozen integer Bsm and every n*rho, and they match the contract. Headroom at
          u = 5 is thinner than stated - see RV012-B3.
        bsm_rung_u6_both_ladders: >-
          Correctly declared unattainable AS A RATE DECISION in advance, correctly excluded
          from RATE-DS-1, correctly retained for DECAY-1, and the confinement genuinely
          does NOT spoil DECAY-1 - I verified that crossing needs 258 counts against a
          Poisson mean of 2.6, so low-count noise can only make the tell harder to fire.
          This is the part of ATTAIN-RR-SMTH-1 that works and it should be carried into any
          successor verbatim. Its stated remedy for powering the rung should not be - see
          RV012-B3.
      arithmetic_redone_independently:
        C_513_2: 131328
        clears_10e5_minimum: true
        margin_percent: 31.328
        C_65_2_C_129_2_C_257_2: [2080, 8256, 32896]
        least_admissible_Bfb: >-
          447, giving C(448,2) = 100128; Bfb = 446 gives 99681. The contract's claim is
          confirmed exactly.
        ks_threshold: >-
          1.63/sqrt(131328) = 0.00449789, so max(0.05, .) = 0.05. Confirmed.
        ks2_threshold: >-
          1.63*sqrt(2/131328) = 0.00636098. The contract's 0.006362 is a rounding of this.
        rho_table_agreement: >-
          My RK4 solution of u rho'(u) = -rho(u-1) at step 1e-4 agrees with the contract's
          frozen table to within 0.002 percent at u = 1 through 6.
        expected_smooth_counts: >-
          n*rho(u) = 40298.0, 6383.6, 644.9, 46.59, 2.581 at u = 2,3,4,5,6. Powered at 2,
          3, 4, 5; not powered at 6. Confirmed. Using the recomputed rung u values rather
          than the integers, the u = 6 counts are 2.62 at bits 20 and 2.48 at bits 16.
        rate_bands: >-
          Factor-8 bands confirmed at every rung, with the caveat that 8*rho(2) exceeds 1.
        decay_threshold: >-
          100*rho(6)/rho(2) = 0.00640378. Confirmed. Crossing count 258, not 841.
        n_to_power_u6: 1526718
        tail_pass_probability: >-
          1/e = 0.36788 analytically, not 1 - 1/e; and 0 of 16 measured. This is the
          batch-ending number.

    q2_pre_registration:
      verdict: PASS_ON_FREEZING__PARTIAL_ON_EXHAUSTIVENESS
      git_verification: >-
        Verified directly against Git rather than from the receipt. Commit
        d40bf3adde9cefd2b79fafdd56fde7bc61614894 exists, is reachable from HEAD, has
        parent d72163e67bbb25479dcd5460ca4318d65faa9373, and adds exactly three paths -
        the specification, DEC-20260801-006 and the snapshot receipt. The specification's
        sha256 at that commit equals the receipt's recorded hash and equals the worktree
        copy I reviewed. `git ls-tree -r d40bf3ad` shows experiments/EXP-SMTH-001 contains
        specification.yaml ONLY - no runs directory, no manifest, no raw-result, no
        results directory, no EV-SMTH record anywhere in the tree. RR-SMTH-1 and
        ATTAIN-RR-SMTH-1 both live inside that hash-bound file. ledger/hypotheses/H-SMTH-001.yaml
        is NOT in the declared set, exactly as the receipt discloses, and was created in the
        ancestor commit d72163e67 - so it too predates any datum. The receipt's own
        instruction to verify that against Git rather than accept the note is discharged.
        PRE-REGISTRATION IS GENUINE.
      threshold_provenance: >-
        Verified verbatim against experiments/EXP-DS-001/specification.v2.yaml
        heur_ds_1_decision_rule. RATE-DS-1, KS-DS-1, TAIL-DS-1, bit_size_pass, c = 8,
        min_samples_per_bit_size = 100000, d_half, D_formula and u_star_formula are quoted
        unchanged, neither relaxed nor tightened. The only textual change is KS-DS-1's
        reference range, written "(1, X]" here against "(1, D]" there, which is
        substantively the same self-normalized statistic. The two ADDED variables are
        declared as additions and their thresholds are derived rather than chosen -
        KS2-DS-1 is the standard two-sample critical value at the SAME alpha = 0.01 that
        KS-DS-1 already fixes, and DECAY-1 is a factor-100 margin on a ratio the frozen rho
        table already supplies. I confirm both derivations arithmetically.
      exhaustiveness: >-
        Over the STATISTICS the map is exhaustive and non-overlapping. Given no M-0, M-5 or
        M-1, each cell either satisfies the M-2 conjunction or does not; both, neither and
        exactly-one map to M-2, M-4 and M-6 respectively, and the declared precedence order
        M-0, M-5, M-1, then one of M-2/M-4/M-6 is total, so nothing can be read twice.
      can_i_construct_a_result_the_map_classifies_twice_or_not_at_all: >-
        Not twice - the precedence order forecloses that. But YES, not at all, and it is
        not a contrived case, it is the CERTAIN case. Under RV012-A2 exactly 512
        half-tuples have no ENC-B value. The contract never says what they contribute, and
        the two available readings land in different branches - dropping them fires M-0
        deterministically, sentinel-filling them does not fire M-0 but contaminates p_hat
        and breaks the matched n for DV-4. A rule whose branch depends on an undeclared
        implementation choice made after the freeze is not fully pre-registered, however
        genuinely its file was hash-bound.

    q3_do_the_decision_variables_vary_with_what_they_measure:
      verdict: PASS_ON_THE_BIJECTION__QUALIFIED_ON_SENSITIVITY
      the_bijection_claim_attacked_directly: >-
        The claim is correct as stated and I verified it rather than accepted it. With
        lift the representative in [0, p), the map (e_1, e_2) -> lift(e_1)*p + lift(e_2) + 1
        is injective on [0,p) x [0,p) with image exactly [1, p**2] - the base-p digits are
        recovered by (N-1) div p and (N-1) mod p. OBJ-NULL-UNIF is drawn uniformly on that
        same [1, p**2]. So the law of N on OBJ-REAL is the pushforward of the joint law of
        (e_1, e_2) and the null is the pushforward of the uniform law, and DV-1 through
        DV-4 deviate from their null values if and only if that joint law departs from
        uniform. That is a property of the Semaev map alone. I confirm there is no analogue
        of BATCH-021's 2/129 degeneracy - no protocol parameter (Bfb, n, Bsm, the seed)
        survives into the comparison, and unlike charge_backend_units's constant 40 per
        call there is no closed form in the protocol's matched parameters here. This is a
        real repair of the defect that wasted BATCH-021.
      the_qualification_that_matters: >-
        "Deviates if and only if" is a statement about the SUPPORT of the deviation, not
        about the POWER to detect it. The decision variables are functionals of the largest
        prime factor of N, and ENC-B interleaves e_1 and e_2 in base p. A departure from
        uniformity that is gross in (e_1, e_2) - a bias of e_2 onto the quadratic residues
        is the contract's own example - can perturb the LPF statistic of N essentially not
        at all. So DV-1 through DV-4 vary with the object in principle and may be nearly
        blind to it in practice, and the ENC-A power certificate does not repair this
        because it certifies power against a different alternative (see M-5 leg b above).
        The smoothness apparatus is a heavily lossy functional of the quantity of interest.
        A direct chi-square or two-dimensional KS on (e_1, e_2) tests the same "if and only
        if" statement with far more power, no factorization, no Dickman model and no
        finite-X bias. That is the cheapest discriminating measurement in this design and it
        is not in the contract.
      is_int_1_the_intermediate_or_a_new_stand_in: >-
        It is NOT a stand-in in the BATCH-020 sense - the object is genuinely computed from
        S_3 and genuinely lives at the size the frozen D names, and the factor 2**20 error
        that RT047-H2 and RT048-H1 caught is not repeated. But it is not simply "the
        quantity HEUR-DS-1 is about" either. The roots of S_3(x_i, x_j, Z) are
        x(P_i + P_j) and x(P_i - P_j); I measured that they lie in F_p for 7140 of 7140
        non-degenerate half-tuples, so the F_{p**2} case the contract cites to justify the
        symmetric-function encoding never occurs over this factor base and the stated
        justification is vacuous. The intermediate that the claw table is actually keyed on
        - the contract's own step_1 says so - is that x-coordinate, an integer below p, not
        an object of size p**2. The frozen D = 2**(2*bits) fits ENC-B and does not fit that
        object. So the sampled object's SIZE was chosen to fit a frozen bound rather than
        the bound being derived from the object. H-SMTH-001.interpretation_limits concedes
        that a different faithful encoding could carry a different smoothness law, which is
        honest and correct; but objects.OBJ-REAL.role ("the quantity HEUR-DS-1 is about")
        and confirmatory_status_note overstate it, and the scoping should be tightened to
        say so in the experiment contract and not only in the hypothesis record.
      is_the_scoping_honest_about_it: >-
        In the hypothesis record, yes. In the experiment contract, not quite - the role
        line and the confirmatory note assert more than the interpretation limits allow.

    q4_is_the_null_genuinely_matched:
      verdict: PASS_ON_CONSTRUCTION__FAIL_ON_THE_REACHABILITY_ARGUMENT_IT_IS_ASKED_TO_CARRY
      matched_in_count: >-
        Declared matched at n = 131328 and the reason given - the two-sample threshold
        assumes matched sizes - is correct. BUT the match BREAKS under RV012-A2, because
        the real arm can only produce 130816 defined values while the null produces 131328.
      matched_in_range: >-
        YES, and this is the strongest single design choice in the contract. Drawing the
        null on [1, p**2] rather than on [1, D] removes the factor-1.94 range mismatch that
        would otherwise have nothing to do with Semaev structure. The range_matching_note
        is correct and load-bearing, and it is exactly the class of non-structural
        difference RT047-B2 and RT048-B3 were about. Verified - p**2 <= D always, since
        p < 2**bits, so CTRL-SMTH-RANGE cannot fire falsely, and N's maximum is exactly
        p**2 so M-0's range clause cannot fire falsely either.
      matched_in_code_path: >-
        Declared identical with no code path differing except the source of the integers,
        and reinforced by an invalidation rule. This is materially better than
        H-DS-001's null, which was matched by argument. Unverifiable before the run; the
        Validator at TASK-20260801-016 must confirm it from the driver.
      the_authors_reachability_argument: >-
        The author argues that the null arm demonstrates M-2's reachability inside the same
        run on the same code path, and calls this "the single most important line of this
        block". THE FORM OF THE ARGUMENT IS CORRECT and I endorse it as the right way to
        establish attainability - it is genuinely stronger than BATCH-021, where no arm on
        any object could have produced U >= 0.9. But the argument is only as good as its
        premise, and its premise is that the null arm PASSES. It does not. I measured the
        null failing TAIL-DS-1 in 16 of 16 draws and failing KS-DS-1 in 1 of 8 draws at
        bits 16. So the null arm does not produce an M-2-pattern measurement, and it is not
        merely possible but near-certain for the M-2 pattern to be unreachable while the
        null arm is admissible - the contract asserts the opposite. This is exactly why
        attainability had to be MEASURED rather than argued, and it is the single most
        important sentence of this review.

    q5_is_the_contract_honest_about_what_it_cannot_show:
      verdict: PASS
      assessment: >-
        Unusually so, and this should be recorded plainly given the REVISE. claim_tier is
        toy and is repeated in the claim ceiling, the confirmatory note, both falsification
        criteria and every branch disposition. Two cells, two curve instances, one seed,
        one host, one unreplicated run, and replication_status_declared says NONE in those
        words. No crypto-scale or medium-scale correspondence is claimed and none is
        available - the contract states that a crypto-scale HEUR validation would need a
        separate correspondence experiment, which is correct. S1_met, F1_met, F2_met and
        structure_gate_passed are all expressly unavailable because no search runs. G1
        through G4 remain OPEN and the contract says supplying an ingredient is not opening
        a gate, which is the right distinction. `support` is forbidden under every branch,
        the favourable branch yields `replicate` and not `support`, and the adverse branch
        yields `weaken` and never reject_scoped-as-impossibility. dominated_by null is
        forbidden downstream, and H-SMTH-001 correctly records that the comparison for a
        distributional claim is against the published Dickman-de Bruijn law rather than
        against Pollard rho or BSGS, which do not apply because no cost claim is made. The
        success criterion is explicitly a COMPLETENESS criterion and not a directional one.
        The residual_attainability_risk block, which discloses in advance that an M-2
        landing may be near-certain and low-information, is a genuinely unusual piece of
        honesty and I want it on the record. AGENTS.md rule 4 and rule 7 are satisfied.

  # =====================================================================
  additional_checks_demanded_by_the_task:
    quarantine_of_the_two_degenerate_variables:
      verdict: REAL, AND NEITHER LEAKS
      finding: >-
        Checked structurally rather than taken on assertion. DV-6 appears in exactly one
        branch condition, M-5 leg (b), and DV-7 in exactly one, M-5 leg (c). Neither
        appears in the conditions of M-1, M-2, M-4 or M-6, neither appears in
        bit_size_pass, and neither feeds any metric that does. The contract states in
        advance that DV-6's rejection and DV-7's agreement are both derivable, forbids
        citing DV-6 as evidence about HEUR-DS-1, and expressly declares DV-7's agreement
        NOT to be corroboration - which is the correct handling of the RT048-H4 two-proxy
        reporting error. The quarantines hold. My only objection is the strength of the
        DV-6 certificate, recorded under q3 and under M-5 leg (b), not its containment.
    check_run_compliance:
      verdict: SATISFIED
      finding: >-
        I read the function rather than the contract's description of it.
        tools/validate_ledger.py line 696 globs experiments/*/runs/*/manifest.yaml and
        nothing else, so the manifest_filename_ruling is correct on its premise and
        experiments/EXP-SMTH-001/runs/RUN-SMTH-001-heur/manifest.yaml WILL be indexed.
        check_run then requires a top-level `run` key; an id matching ^RUN-[A-Za-z0-9._-]+$,
        which RUN-SMTH-001-heur does; the eight fields id, experiment_id, status, code,
        environment, inputs, timing, result, all of which the contract names; non-empty
        code.commit and code.command, both named; and the five companion files
        command.txt, environment.json, stdout.log, stderr.log and raw-result.json, all
        five of which appear in required_artifacts with the .log extensions the validator
        demands rather than the .txt that EXP-DS-001 used. result.certificate.kind must be
        discrete_log, decomposition or none, and the contract fixes the literal string
        none, which is correct since no discrete logarithm or decomposition is claimed. The
        indexing-gap repair is real. I also ran tools/validate_ledger.py against the
        current tree - it reports 1169 new errors, NONE of which mentions SMTH; the
        specification and the hypothesis record validate cleanly and every reported error
        belongs to unrelated lanes.
    smoothness_abort_anti_pattern:
      verdict: EXPRESSLY FORBIDDEN, CORRECTLY
      finding: >-
        AP-1 forbids it in this contract and in any successor citing it, labels any such
        flag-flip a PLUMBING CHECK producing no evidence record, gives the correct
        quantitative reason (an identity-encoded x-coordinate below 2**20 against an
        intermediate bounded by 2**40), and cites four upstream sources. DEC-20260801-006
        and H-SMTH-001 repeat it. Nothing further needed.
    exp_ds_001_untouched:
      verdict: CONFIRMED
      finding: >-
        The snapshot commit changes exactly three paths and none of them is under
        experiments/EXP-DS-001/. No EXP-DS-001 specification, control, amendment, driver,
        run or result is modified, and H-DS-001, H-IC-001 and H-STR-002 are untouched. The
        two things taken from that lane are quotations - the frozen thresholds and the
        frozen D_formula - not edits.
    ruling_on_the_declared_D_formula_reading:
      verdict: CONFIRMED, the contract's reading is the correct one
      reason: >-
        The frozen formula is D(bits, m) = 2**(bits * d_half[m]) with d_half[4] = 2, which
        gives 2**32 at bits 16 and 2**40 at bits 20. The BATCH-021 next_action's phrase
        "D = 2**40" is consistent with "bits in {16, 20}" only if it names the bits = 20
        cell. Applying the frozen formula per cell is therefore the reading that preserves
        the freeze; forcing D = 2**40 at bits = 16 would redraft it, which is forbidden
        without an amendment. The contract flagged this for explicit ruling and the ruling
        is that it read it correctly. I note in passing that this makes the two cells
        differ in D, which the ladders correctly handle by recomputing u per cell.
    ruling_on_the_Bfb_512_departure:
      verdict: ADMISSIBLE AND CORRECTLY REASONED
      reason: >-
        The arithmetic is right - 2080, 8256 and 32896 distinct half-tuples at Bfb of 64,
        128 and 256, every one below the frozen 10**5 minimum, so at any EXP-DS-001 factor
        base size the sample count is reachable only by drawing with replacement from a
        support of at most 32896, whose discretization would dominate the KS statistic and
        force a failure having nothing to do with Semaev structure. Bfb = 512 is outside
        H-DS-001's test boundary, but this experiment tests H-SMTH-001, whose own boundary
        names 512, and nothing about H-DS-001's boundary is altered or annotated. The
        departure is declared, reasoned and admissible. It is also the clearest evidence
        that the attainability discipline is real rather than ceremonial - it changed the
        design before any review, which is the point.
      caveat: >-
        Under RV012-A2 the usable count is C(512,2) = 130816, not 131328. That still clears
        the 10**5 minimum by 30.8 percent, so the Bfb = 512 choice survives the defect
        intact; only the declared n and the thresholds derived from it move.

  # =====================================================================
  what_the_contract_gets_right_and_should_be_carried_forward:
    - >-
      The u = 6 handling. Declaring a band unattainable as a rate decision IN ADVANCE,
      excluding it from the decision it cannot serve, retaining it for the one where its
      noise is provably conservative, and stating the sample size that would power it, is
      exactly the discipline BATCH-021 lacked. I verified the conservatism claim rather
      than accepting it. Carry it verbatim.
    - >-
      The null drawn on [1, p**2] rather than [1, D]. Matched by construction rather than
      by argument, with the factor-1.94 mismatch identified and eliminated.
    - >-
      The decision_variable_variation_check block, and specifically the bijection
      derivation, which does repair the 2/129 defect it was written against.
    - >-
      The declaration in advance that DV-6 and DV-7 are degenerate, together with their
      confinement to guard roles and the express statement that DV-7's agreement is NOT
      corroboration.
    - >-
      The residual_attainability_risk disclosure that an M-2 landing may be low-information.
    - >-
      AP-1, the manifest.yaml ruling, and the filing of OPEN-BATCH022-A rather than an
      illegitimate repair of immutable records.
    - >-
      The form of the argument that a passing null arm demonstrates the favourable
      pattern's reachability on the same code path in the same run. The form is right and
      is the correct general repair for the BATCH-021 defect. It needs its premise
      measured, not asserted - which is the whole content of this REVISE.

  scope_limits_of_this_review:
    - >-
      This review reads a CONTRACT. It asserts nothing about HEUR-DS-1, about H-SMTH-001,
      about H-DS-001 or about the Semaev map's equidistribution, in either direction.
    - >-
      The two reviewer-side computations are sanity checks of the FROZEN THRESHOLDS against
      a uniform null and of the S_3 leading coefficient. They are not EXP-SMTH-001 runs,
      they produce no evidence record, they are not committed, and they discharge nothing.
      They were run at bits-equivalent ranges 0.4999*2**32 and 0.5156*2**40 with sympy
      1.14.0 and seeds 1000 to 1007, and at p = 46349 with a = 7, b = 11 respectively.
    - >-
      The measured null-arm behaviour is a statement about the frozen thresholds at these
      toy ranges. It is NOT a statement that Dickman or Canfield-Erdos-Pomerance is wrong;
      those are asymptotic laws and the discrepancy found is the ordinary finite-X
      correction, applied at u values where it is large.
    - >-
      A REVISE on attainability is not a closure of this lane, is not an obstruction claim
      about measuring HEUR-DS-1, and is not a statement that the experiment is
      unsalvageable. Both fatal defects are threshold-and-enumeration defects, not
      mechanism defects, and the underlying measurement remains the highest-information
      action available to the goal. Premature closure and overclaiming are symmetric
      failures and neither is intended here.
    - >-
      I did not verify the driver, which does not exist, nor the budget adequacy beyond
      noting that my own factorization timings (about 0.04 ms at 2**32 and 0.10 ms at
      2**40 with sympy factorint) suggest the 5400 s factorization estimate is
      conservative by more than an order of magnitude.

  next_concrete_action: >-
    Coordinator issues a versioned protocol_amendment to EXP-SMTH-001 under a new
    specification version, on grounds independent of any datum because no datum exists,
    that (1) resolves RV012-A2 by fixing the enumeration and the sample count and
    re-deriving every threshold that depends on n, and (2) resolves RV012-A1 by
    re-founding the absolute-model tests. Before drafting (2), run the cheapest
    discriminating measurement this review identifies - the null-arm dry run itself, one
    execution of OBJ-NULL-UNIF alone through the declared pipeline at both cells, which
    costs about two minutes of CPU and settles empirically what the correct-apparatus
    values of KS-DS-1, RATE-DS-1 and TAIL-DS-1 are BEFORE any threshold is frozen against
    them. Freezing a threshold that has never been measured against its own null is what
    produced both fatal defects here, and measuring it costs less than reviewing it.

