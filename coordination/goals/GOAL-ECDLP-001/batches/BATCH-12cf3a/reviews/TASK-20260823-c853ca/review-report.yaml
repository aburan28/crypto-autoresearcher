  joint_assessments:
    - joint: J1-public-ec-object-reachability-and-occurrence-lineage
      status: breaks
      claim_tested: >-
        The frozen packet supplies a target-independent, public, finite EC
        correspondence on the complete reachable subgroup, total across every
        group-law stratum, with canonical occurrence-labelled states and
        exact source-consistent lineage; and B61-DER-1 is a valid substantive
        extension of B58 on the deterministic slice.
      decisive_result: >-
        B61-DER-1 itself holds under its exact hypotheses and assumes no
        invertibility of U. However, it is B58-DER-1 applied verbatim to the
        single map S_s into a multiset-state codomain, not a new arbitrary-d
        theorem. The selected EC route still has no realized K_s, seed rule,
        label system, canonical encoding, total +P/+Q transition, locator, or
        occurrence certificate. Complete reachability and all EC strata are
        requirements asserted by the interface, not supplied constructions.
      theorem_audit:
        theorem_id: B61-DER-1
        status: holds
        exact_hypotheses:
          - G is the complete prime-order cyclic domain generated by P.
          - S is one total deterministic map from every R in G to one state.
          - U is one total deterministic successor on states satisfying S(R+P)=U(S(R)) for every R.
        collision_propagation: >-
          If S(R)=S(R+aP), forward application of U gives
          S(R+jP)=S(R+(a+j)P) for j=0,...,N-1. Those nonnegative iterates
          already enumerate all of G, so S is invariant under translation by
          aP. When a is nonzero modulo prime N, aP generates G; hence S is
          constant. A nonconstant S therefore has no distinct-source fibre.
        proof_wording_note: >-
          The producer says repeated application works for every integer j.
          Only nonnegative j is obtained directly, but j=0,...,N-1 suffices;
          negative iterates are unnecessary. This is a wording repair, not a
          mathematical break.
        invertibility_audit:
          assumed_by_proof: false
          needed_by_proof: false
          induced_on_reachable_image: >-
            Exact closure makes U restricted to S(G) surjective because
            S(R) has predecessor S(R-P); the image is finite, so that
            restriction is bijective. Global U may still be noninvertible.
            The proof uses only forward equality propagation and does not use
            this induced bijectivity.
        finite_support_audit: >-
          Neither finiteness, d, labels, multiplicities, nor the internal
          support representation appears in the proof. The result holds for
          any codomain Z. Encoding a finite labelled multiset merely makes
          that entire encoding one value of a map S:G->Z.
        seed_audit: >-
          The theorem is pointwise in a fixed seed. Randomizing over seeds does
          not create one global constant-or-injective randomized observable;
          only each deterministic seed slice is covered. The packet states
          this boundary correctly.
        target_audit: >-
          Q is absent from the theorem. Target independence is therefore
          automatic for the theorem after S_s is fixed, but the theorem cannot
          validate target independence of a b>1 construction that does not
          exist.
      b58_semantic_delta:
        status: breaks_as_substantive_extension
        baseline: >-
          Committed B58-DER-1 already quantifies over every deterministic
          public factor f on the prime cycle; its codomain is unrestricted.
        substitution: "f := S_s and T := U_s"
        result: >-
          B61-DER-1 is an immediate renaming/application of B58-DER-1. The
          arbitrary support bound d adds no proof case or hypothesis because
          the whole multiset state is simply the value f(R). The packet is
          appropriately conservative about literature novelty, but fields
          calling this an arbitrary-d extension or new exact content should
          be revised to call it a B58 corollary/semantic instantiation.
      public_instance_and_target_independence:
        status: breaks
        held_declarations:
          - The quantifier file places seed and preprocessing before Q.
          - The reachable abstract domain is declared to be all of G.
          - The +Q transition may be instantiated only after Q is received.
        missing_realization:
          - a claimed curve family/model and finite public instance description for the correspondence
          - a seed sampler or fixed seed and a check that no Q-dependent filtering occurred
          - finite definitions of Y_s, K_s, the occurrence labels, multiplicities, and canonical state encoding
          - typed, total +P and +Q transition relations on the realized states
          - a source-consistent occurrence certificate and its public verifier
        notation_defect: >-
          bounded-correspondence-interface.yaml uses L_s both for the
          occurrence alphabet and for the locator. The locator has no formal
          input/output type, history input, certificate type, or verifier.
      complete_reachable_ec_strata:
        status: breaks
        coordinate_free_theorem_boundary: >-
          B61-DER-1 assumes its functional equation for every R in G, so O and
          every exceptional group-law case are covered only as hypotheses.
          It supplies no EC formula whose totality across those cases can be
          checked.
        unauditable_or_missing_strata:
          - "R=O under +P and +Q"
          - "R=-P and R=-Q, where the successor is O and affine chord denominators vanish"
          - "R=P and R=Q, where addition specializes to doubling"
          - generic affine additions and every model-specific denominator failure
          - "Q=O, Q=P, Q=-P, and any other target-specialized overlap"
          - repeated support values, multiplicities, label collisions, and branch merges
          - the identity encoding, exceptional charts, overlap maps, and verification at O
        scope_note: >-
          Their absence breaks the realized J1 route, not the abstract group
          theorem and not every possible complete EC addition law.
      cheapest_controls:
        constant_state:
          construction: "S(R)=z0 and U(z0)=z0 for all R"
          consequence: >-
            Exact all-source deterministic transport can be completely lossy
            and useless only in the constant arm, exactly as the theorem says.
          classification: theorem_sanity_check_not_a_counterexample
        kummer_multivalued_boundary:
          construction: >-
            With x(O) represented by a special infinity symbol, the lossy
            state x(R) admits the well-defined set-valued successor
            {x(R+P),x(P-R)} of width at most two; replacing P by Q gives the
            analogous online set. Swapping R with -R only swaps the set.
          consequence: >-
            This shows why B61-DER-1 cannot be extended to b>1. A
            source-consistent sign/occurrence locator is still absent, so this
            control is not a decoder or attack.
          classification: exact_boundary_control_not_route_validation
      J1_scope_boundary: >-
        J1 breaks because no public EC construction or occurrence lineage is
        realized and the claimed semantic delta from B58 is overstated. The
        break does not refute B61-DER-1, which holds, and does not reject a
        concrete future b>1 correspondence.

    - joint: J2-identifiability-separator-decoder-and-replay
      status: breaks
      claim_tested: >-
        The complete seeded transcript separates answer-relevant sources or
        supplies an exact reachable collision/dichotomy, and one uniform
        public locator, decoder, stopping event, occurrence replay, and group
        verification recovers k on every reachable stratum.
      decisive_result: >-
        The deterministic theorem gives only information-theoretic
        constant-or-injective state fibres. It gives no efficient inverse,
        no scalar locator, no +Q interaction, no stopping relation, and no
        replay. For b>1 there is neither a concrete reachable graph nor a
        typed transcript, so no separation, answer-different collision,
        decoder, or support-growth lower bound can be audited. The producer
        records these absences honestly; they nevertheless break J2 for the
        selected route and warrant REVISE.
      deterministic_identifiability:
        status: holds_only_information_theoretically
        result: >-
          Under B61-DER-1, a nonconstant complete b_P=1 state separates exact
          group sources because S is injective; a constant state separates
          none. This is the complete fibre dichotomy and nothing more.
        identity_state_control:
          construction: >-
            Let K_s(R) be the singleton labelled by R itself, let S_s(R)=R,
            and let U_s(R)=R+P. The state is injective and exact on all G.
          consequence: >-
            Given S_s(Q)=Q, recovering its scalar k is still the original
            ECDLP. Thus injectivity does not supply a constructive or sub-rho
            inverse, separator, or decoder.
          classification: counterexample_to_decoder_inference_not_to_B61_DER_1
      transcript_and_collision_audit:
        status: breaks
        missing:
          - a finite reachable transition graph for one seed
          - a typed complete transcript and a definition of transcript equality
          - the fields visible to the locator/decoder and the fields used only by an external auditor
          - answer equivalence on histories and a finite separator
          - two exact reachable same-complete-transcript/different-answer histories
        collision_result: >-
          No qualifying collision was found because there is no object on
          which one can be certified. The Kummer pair R,-R and the B60
          occurrence witness are controls only; importing either as a B61
          collision would be invalid without equality of every realized B61
          field and transition.
        separation_result: >-
          No separation theorem exists for b_P>1 or b_Q>1. The statement that
          either answers are constant on transcript fibres or an
          answer-different collision exists is a logical partition, not a
          quantitative support-growth or efficient-decoding theorem.
      b_greater_than_1_scope:
        status: inconclusive
        supported_statement: >-
          A depth-t branch tree has at most the product of the declared branch
          bounds before accounting for merges and pruning.
        unsupported_overreach:
          - that branch width necessarily grows exponentially
          - that every b>1 locator is circular or rho-scale
          - that complete transcripts necessarily separate answers
          - that an answer-different reachable collision exists
          - that B61-DER-1 applies to a set-valued successor
        consequence: >-
          Any b>1 impossibility, collision, decoder, or speed claim must be
          rejected for this packet. The mechanism class remains open rather
          than negatively evidenced.
      locator_audit:
        status: breaks
        detail: >-
          The locator is only a sentence saying it selects a source-consistent
          successor. Its inputs, permitted history, output occurrence, public
          certificate, verifier, and failure behavior are undefined. If it is
          a deterministic function only of the complete current state, it
          induces the b=1 U case; if it uses history or occurrence advice, that
          information must be explicitly typed and shown sufficient for replay.
      decoder_and_replay_audit:
        status: breaks
        held_algebraic_check: >-
          Once A,B are actually produced, AP+BQ=O with nonzero B modulo prime
          N correctly implies k=-A/B modulo N, and checking the equation in G
          is a sound final verification step.
        missing:
          - a uniform decoder algorithm rather than a required output type
          - a target/source initialization with known P,Q coefficients
          - a stopping event such as equality of two compatible replayed states/histories
          - proof that every selected branch retains its occurrence and coefficient lineage
          - treatment of identity, inverse, doubling, repeated-value, and multiplicity strata
          - success, false-accept, failure, retry, and termination semantics
        terminal_relation_gap: >-
          The replay specification records R_t=R_0+[A]P+[B]Q but does not
          instantiate the event that makes R_t=R_0, or otherwise derives
          AP+BQ=O. The final group check can reject a bad pair; it cannot create
          A,B or prove that a stopping event occurs.
      J2_scope_boundary: >-
        J2 breaks for the frozen packet. This is a failure to realize the
        selected separator/decoder/replay obligations, not a collision theorem,
        a b>1 impossibility result, or a verdict on the broader ECDLP route.

  required_revision_for_J1_J2:
    - >-
      Reclassify B61-DER-1 as a direct B58-DER-1 corollary obtained by taking
      the entire occurrence-labelled state as the factor value; retain its
      correct fixed-seed, deterministic-successor boundary.
    - >-
      Freeze one concrete finite target-independent EC state/support object,
      with non-overloaded types for labels and locator certificates, and prove
      total +P/+Q transport on the complete reachable subgroup.
    - >-
      Enumerate and discharge O, inverse-pair, doubling, generic affine,
      target-special, repeated-value, multiplicity, chart, and denominator
      strata, with replay-preserving occurrence labels.
    - >-
      Define the complete typed transcript and its equality relation, then
      either prove answer separation and give a uniform constructive decoder,
      or provide one exact reachable same-transcript/different-answer collision.
    - >-
      Supply a public locator signature, certificate verifier, stopping rule,
      initial coefficient convention, branch-by-branch coefficient replay,
      terminal relation derivation, and final verification semantics.
    - >-
      State any b>1 result only for the realized graph. Do not turn the formal
      branch upper bound or the absence of a current construction into a lower
      bound, impossibility claim, collision, or negative evidence.

