      "Assume S is nonconstant and S(R)=S(R') for two sources R and R'.",
      "Applying U repeatedly gives S(R+jP)=S(R'+jP) for every integer j.",
      "If R is not R', write R'=R+aP with nonzero a mod N. The equality says S is invariant under translation by aP.",
      "Because N is prime, aP generates G. Its translation orbit is all of G, so S is constant, contradicting the assumption.",
      "Therefore a nonconstant S has no distinct-source collision and is injective."
