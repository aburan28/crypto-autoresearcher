    fallback_used: unknown
    fallback_used_reason: >-
      No adapter on this branch, therefore no recorded resolution event to read.
      No policy-equivalence claim is made.
    degraded_requirements: []

  scope_of_this_report: >-
    This report concerns the integrity and reproducibility of commit a935f207
    (a two-line YAML quoting repair) and of the commits that bind it. It
    adjudicates no research claim. A PASS here does not support, weaken, or
    otherwise touch H-STR-002, H-IC-001, EV-STR-003, DEC-20260727-008,
    DEC-20260727-009, or any ECDLP claim, and proposes no status transition.

  bound_snapshot:
    worktree: /Volumes/Volume/crypto-autoresearcher-worktrees/ecdlp-batch006
    branch: claude/ecdlp-batch006
    head_at_validation: a935f207a85f5d0a227b811cfbdde4393372aa1a
    repair_commit: a935f207a85f5d0a227b811cfbdde4393372aa1a
