validation_report:
  id: VAL-20260727-003
  task_id: TASK-20260727-030
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-008
  role: validator
  session_independence:
    independent_session: true
    non_originating: true
    note: >-
      This session did not write the repair plan (TASK-20260727-025), the
      dispatch queue, the goal record, or the repair (TASK-20260727-028). Every
      finding below was recomputed from Git and from a re-run of the validator;
