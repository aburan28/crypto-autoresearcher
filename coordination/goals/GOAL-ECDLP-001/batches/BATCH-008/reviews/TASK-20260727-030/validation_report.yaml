    - claim: C5 blob accounting
      status: confirmed
      EXP-STR-003_specification_yaml:
        at_92268c9e: 1c6f10b7ba4db293126504c19b4fe9c931b257f3
        at_c79e3a8d: 1c6f10b7ba4db293126504c19b4fe9c931b257f3
        at_14deee8a: 1c6f10b7ba4db293126504c19b4fe9c931b257f3
        at_a935f207: 5e0dadf7437613e630cfd5511e0ef7a97956a413
        at_HEAD: 5e0dadf7437613e630cfd5511e0ef7a97956a413
      EXP-IC-002_specification_yaml:
        at_92268c9e: 8987eb01978ab82538b17e35358c389c23a9b7f1
        at_c79e3a8d: 8987eb01978ab82538b17e35358c389c23a9b7f1
        at_14deee8a: 8987eb01978ab82538b17e35358c389c23a9b7f1
        at_a935f207: 23319080e17607dcb952822317990737adf764ab
        at_HEAD: 23319080e17607dcb952822317990737adf764ab
      original_blobs_retrievable:
        "1c6f10b7ba4db293126504c19b4fe9c931b257f3": "git cat-file -t -> blob (retrievable)"
        "8987eb01978ab82538b17e35358c389c23a9b7f1": "git cat-file -t -> blob (retrievable)"
      note: >-
        Both pre-repair blobs remain reachable from the commits that attest them
        (they are the content of their paths at 92268c9e and c79e3a8d), so the
        frozen contracts are recoverable verbatim with
        "git show 92268c9e:experiments/EXP-STR-003/specification.yaml".
        Every value matches what the card declared, recomputed independently.

    - claim: C6 the freeze consequence
      status: confirmed_with_a_stated_residual
      run_manifest_findings:
        run_count: 20
        code_commit_values: "all 20 manifests record commit: 92268c9e72dd9d49de410f4a535e64af5aa5d9a9 (grep | sort | uniq -c returns a single group of 20)"
        dirty_flags: "all 20 record dirty: false (single group of 20)"
        runs_tree_hash_at_c79e3a8d: f632035108372f599860b85f273c8dee437ca64f
        runs_tree_hash_at_14deee8a: f632035108372f599860b85f273c8dee437ca64f
        runs_tree_hash_at_a935f207: f632035108372f599860b85f273c8dee437ca64f
        runs_tree_hash_at_HEAD: f632035108372f599860b85f273c8dee437ca64f
        conclusion: >-
          The entire experiments/EXP-STR-003/runs subtree is bit-identical from
          the run-archive commit through HEAD. All 20 manifests are unmodified
          and still record 92268c9e.
      pre_registration_ordering:
        finding: SURVIVES
        evidence:
          - >-
            92268c9e (2026-07-27 16:44:36 -0700, "TASK-20260727-020 snapshot:
            freeze the EXP-STR-003 ablation contract") adds exactly ONE path:
            experiments/EXP-STR-003/specification.yaml. Nothing else.
          - >-
            experiments/EXP-STR-003/runs does not exist at 92268c9e at all
            ("git rev-parse 92268c9e:experiments/EXP-STR-003/runs" fails with
            "exists on disk, but not in 92268c9e"). The contract commit predates
            the existence of any run artifact in the history.
          - >-
            92268c9e is an ancestor of c79e3a8d, which is an ancestor of
            a935f207. The ordering contract-freeze -> execution/archive -> repair
            is Git-verifiable and unaltered.
          - >-
            The frozen blob 1c6f10b7 is still the content of that path at
            92268c9e and c79e3a8d and is still retrievable.
      what_the_blob_change_does_not_do:
        - >-
          It does not change any predicate of the frozen contract. Byte
          comparison shows lines 1-406 and 408-923 of EXP-STR-003 are identical
          to the frozen file. F1 (line 544), the fixed-in-advance consequence
          block (line 560), the verdict definitions including obs1_falsified
          (line 576), and every control, metric definition, budget and stopping
          rule are untouched.
        - >-
          The single changed line is the human-readable definition text of the
          SECONDARY diagnostic metric "branch", and its content is preserved
          character for character. No measured value, no run artifact, and no
          recorded observation depends on those two quote characters.
        - >-
          It does not invalidate the manifests' attestation: they attest a
          commit id, that commit still exists, and its tree still contains the
          frozen blob.
        - >-
          It does not create a pre-registration problem. Nothing was added to,
          removed from, or weakened in the contract after seeing results.
      what_the_blob_change_does_do:
        - >-
          The path at HEAD no longer resolves to the frozen blob. A reader who
          runs "git diff 92268c9e HEAD -- experiments/EXP-STR-003/specification.yaml"
          now sees a NON-EMPTY diff on the contract file: one hunk at line 407,
          quoting only, inside metrics.secondary. The same holds for EXP-IC-002.
        - >-
          Consequently the shorthand "the specification at HEAD is the
          specification that was frozen" is no longer true for these two files.
          Anyone auditing the F1 falsification recorded in DEC-20260727-009 must
          resolve the contract explicitly at 92268c9e rather than reading HEAD.
        - >-
          RESIDUAL RISK, reported not repaired: no manifest records a hash of the
          specification blob - the manifests bind only code.commit and
          dirty:false. Nothing in the run receipts would have detected this
          divergence, and nothing will flag a future one. The divergence is
          discoverable only by an explicit git diff against 92268c9e. That is a
          pre-existing property of the manifest schema, not something this repair
          introduced, but this repair is the first time it has bitten.
      plain_statement: >-
        The pre-execution freeze that underwrites the F1 falsification survives
        intact in substance and in ordering: the contract commit predates every
        run artifact, all 20 manifests are unmodified and still attest it, and
