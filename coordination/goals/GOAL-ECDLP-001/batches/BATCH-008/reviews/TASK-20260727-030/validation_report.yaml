        after: 985
        delta: -5
        exit_code_before: 1
        exit_code_after: 1
      errors_present_before_and_absent_after_verbatim:
        - "experiments/EXP-IC-002/specification.yaml: invalid YAML: while scanning a block scalar"
        - "experiments/EXP-STR-003/specification.yaml: invalid YAML: while scanning a block scalar"
        - "ledger/decisions/DEC-20260727-008.yaml: decision references unknown target 'EXP-IC-002'"
        - "ledger/decisions/DEC-20260727-009.yaml: decision references unknown target 'EXP-STR-003'"
        - "ledger/evidence/EV-STR-003.yaml: evidence references unknown experiment 'EXP-STR-003'"
      errors_present_after_and_absent_before: []
      explicit_answers_to_the_card_questions:
        were_there_two_invalid_yaml_errors_before: >-
          YES. Both "invalid YAML: while scanning a block scalar" errors were
          present before the repair, exactly as the plan predicted, in addition
          to the three cross-reference errors the orchestrator reported.
        did_the_three_cross_reference_errors_clear: >-
          YES. All three (EV-STR-003, DEC-20260727-008, DEC-20260727-009)
          disappear once the two experiments register.
        did_any_new_error_appear_once_the_experiments_registered: >-
          NO. comm -13 on the sorted error sets returns the empty set: the
          post-repair error set is a strict subset of the pre-repair set. The two
          newly-registering experiment records introduced no schema, id,
          duplicate-id, or cross-reference violation of their own.
      independent_cross_check: >-
        My 990-element and 985-element error sets are set-identical to the
        executor's committed validator_output_before.txt and
        validator_output_after.txt. This was computed after my own measurement
        and is corroboration only; no claim above depends on it.

    - claim: C4 the baseline was not laundered
      status: confirmed
      findings:
