  environment:
    platform: Darwin 25.6.0
    git: 2.39.5 (Apple Git-154)
    python: 3.13.1
    pyyaml: 6.0.3

  commands_run:
    - git rev-parse --abbrev-ref HEAD
    - git rev-parse HEAD
    - git status --porcelain
    - "git log --format='%H %P %ci %s' -5 a935f207a85f5d0a227b811cfbdde4393372aa1a"
    - git merge-base --is-ancestor a935f207a85f5d0a227b811cfbdde4393372aa1a HEAD
    - git merge-base --is-ancestor 14deee8a33a23cd1c8feef9a25376c53f5e3433c a935f207a85f5d0a227b811cfbdde4393372aa1a
    - "git show --stat --format='%H %s' 14deee8a33a23cd1c8feef9a25376c53f5e3433c"
    - "git show --name-status --format='' a935f207"
    - "git show 14deee8a:experiments/EXP-IC-002/specification.yaml > <scratch>/before_EXP-IC-002.yaml"
    - "git show a935f207:experiments/EXP-IC-002/specification.yaml > <scratch>/after_EXP-IC-002.yaml"
    - "git show 14deee8a:experiments/EXP-STR-003/specification.yaml > <scratch>/before_EXP-STR-003.yaml"
    - "git show a935f207:experiments/EXP-STR-003/specification.yaml > <scratch>/after_EXP-STR-003.yaml"
    - "wc -l / wc -c / tail -c 1 | xxd / grep -c $'\\r' on all four extracts"
    - "diff -u0 before_<EXP>.yaml after_<EXP>.yaml"
    - "python3 byte-level line comparator (split on b'\\n', index-wise compare, sha256 of the file with the changed line removed)"
    - "python3 yaml.safe_load on before and after, plus placeholder-neutralisation tree comparison"
    - "python3 tools/validate_ledger.py   (at HEAD = post-repair)"
    - "git show 14deee8a:<both specs> > <both specs>; python3 tools/validate_ledger.py; git checkout -- <both specs>   (pre-repair measurement, fully reverted)"
    - "comm -23 / comm -13 on the sorted error sets"
    - "git rev-parse <commit>:tools/validate_ledger_baseline.txt  for 92268c9e c79e3a8d 14deee8a a935f207 HEAD"
    - "git log -1 --format='%H %ci %s' -- tools/validate_ledger_baseline.txt"
    - "git rev-parse <commit>:experiments/EXP-STR-003/specification.yaml  for 92268c9e c79e3a8d 14deee8a a935f207 HEAD"
    - "git rev-parse <commit>:experiments/EXP-IC-002/specification.yaml  for the same five commits"
    - "git cat-file -t 1c6f10b7... 8987eb01 5e0dadf7... 23319080..."
    - "git rev-parse <commit>:experiments/EXP-STR-003/runs  for the same five commits"
    - "git rev-parse <commit>:ledger, :tools, :harness  for 14deee8a and a935f207"
    - "grep -h -A3 '^ *code:' experiments/EXP-STR-003/runs/*/manifest.yaml | grep -i commit | sort | uniq -c"
    - "grep -h 'dirty:' experiments/EXP-STR-003/runs/*/manifest.yaml | sort | uniq -c"
    - "grep -rn 'secondary' tools/*.py harness/*.py"

  claim_checks:

    - claim: C0 receipt binding and commit ordering
      status: confirmed
      findings:
        - "a935f207a85f5d0a227b811cfbdde4393372aa1a == HEAD of claude/ecdlp-batch006; merge-base --is-ancestor against HEAD succeeds. Reachable."
        - "Parent of a935f207 is 14deee8a33a23cd1c8feef9a25376c53f5e3433c, exactly as declared."
        - >-
          14deee8a ("TASK-20260727-027 snapshot: open BATCH-008, plan the spec
          YAML repair", 2026-07-27 22:16:44 -0700) changes exactly three paths:
          BATCH-008/dispatch_queue.json, BATCH-008/tasks/TASK-20260727-025/repair_plan.md,
          and ledger/goals/GOAL-ECDLP-001.yaml. It touches NEITHER specification
          file. The plan therefore genuinely precedes the edit, and the edit
          appears for the first time in the child commit a935f207
          (2026-07-27 22:23:12 -0700, six minutes later).
        - >-
          repair_plan.md at 14deee8a declares the target lines and the exact
          replacement text (lines 86-95 for EXP-STR-003 line 407, lines 206-215
          for EXP-IC-002 line 213). The committed replacement text is
          character-for-character what the frozen plan declared.
      caveat_reported_not_routed_around: >-
        INT-BATCH008-C applies. Neither
        BATCH-008/archives/TASK-20260727-027/snapshot_commit_receipt.json nor
        BATCH-008/archives/TASK-20260727-029/snapshot_commit_receipt.json
        exists; both archive tasks are still state "queued" in the committed
        dispatch_queue.json. There is therefore NO formal archive receipt to
        verify for either snapshot. I did not fabricate one and did not treat
        its absence as satisfied. I validated the underlying commits directly
        against Git instead, which is the substantive content of the receipt
        check (reachability, parent, declared-path scope, blob preservation),
        and I record that the formal receipt artifact is missing for a known,
        Coordinator-acknowledged structural reason (DEFER-BATCH008-002), not
        because of anything this repair did. The artifacts under review ARE
        committed, so this is not a working-tree-only receipt and validation
        was not refused on that ground.

    - claim: C1 the diff is exactly two lines across two files, quoting only
      status: confirmed
      method: >-
        Independent extraction of all four blobs with "git show", then a
        byte-level Python comparator that splits both files on b"\n", compares
        line lists index-wise, and separately sha256s each file with the changed
        line deleted. repair.diff was NOT used to derive any of this.
      measurements:
        EXP-IC-002:
          before_blob: 8987eb01978ab82538b17e35358c389c23a9b7f1
          after_blob: 23319080e17607dcb952822317990737adf764ab
          bytes_before: 29208
          bytes_after: 29210
          byte_delta: 2
          lines_before: 511
          lines_after: 511
          differing_line_indices_1_based: [213]
          before_line_213: '      - p_dec_counting_bound: |S| / N.'
          after_line_213: "      - p_dec_counting_bound: '|S| / N.'"
          leading_whitespace_before_after: [6, 6]
          trailing_whitespace_before_after: [0, 0]
          tabs_in_changed_line: false
          sha256_of_file_minus_changed_line_before: 99590067f09d8550...
          sha256_of_file_minus_changed_line_after: 99590067f09d8550...
          all_other_lines_byte_identical: true
        EXP-STR-003:
          before_blob: 1c6f10b7ba4db293126504c19b4fe9c931b257f3
          after_blob: 5e0dadf7437613e630cfd5511e0ef7a97956a413
          bytes_before: 50581
          bytes_after: 50583
          byte_delta: 2
          lines_before: 923
          lines_after: 923
          differing_line_indices_1_based: [407]
          before_line_407: '    - branch: "square" | "rectangular" - which limb of lines 220-234 executed (RT-OBJ-4).'
          after_line_407: "    - branch: '\"square\" | \"rectangular\" - which limb of lines 220-234 executed (RT-OBJ-4).'"
          leading_whitespace_before_after: [4, 4]
          trailing_whitespace_before_after: [0, 0]
          tabs_in_changed_line: false
          sha256_of_file_minus_changed_line_before: 08644b7e67389387...
          sha256_of_file_minus_changed_line_after: 08644b7e67389387...
          all_other_lines_byte_identical: true
      negative_checks:
        no_reflow: "confirmed - one differing line index per file; every other line index compares equal byte for byte"
        no_reindent: "confirmed - leading whitespace 6 -> 6 and 4 -> 4 on the changed lines; all other lines unchanged"
        no_reorder: "confirmed - the comparison is index-wise, so any reorder would surface as multiple differing indices"
        no_line_count_change: "confirmed - 511 -> 511 and 923 -> 923 (wc -l); 512 -> 512 and 924 -> 924 split-elements including the empty tail"
        no_trailing_newline_change: "confirmed - tail -c 1 | xxd is 0a on all four extracts"
        no_line_ending_change: "confirmed - grep -c $'\\r' returns 0 on all four extracts; no CR anywhere"
        insertion_is_only_quote_delimiters: >-
          confirmed - byte delta is exactly +2 per file, and in each case the
          after-line equals the before-line with one U+0027 inserted immediately
          after "<key>: " and one appended at end of line. Neither original
          scalar contains an apostrophe, so no ''-escaping was needed and none
          was introduced.
      disagreements_with_producer_artifacts: none

    - claim: C2 semantic preservation
      status: confirmed_on_a_stated_and_limited_basis
      why_the_usual_method_is_unavailable: >-
        Both originals fail yaml.safe_load, so there is no "before" parse tree
        and parsed-structure diffing is impossible. Verbatim scanner errors I
        obtained:
        EXP-IC-002 - "ScannerError: while scanning a block scalar ... line 213,
        column 31 ... expected chomping or indentation indicator";
        EXP-STR-003 - "ScannerError: while scanning a block scalar ... line 407,
        column 24 ... expected a comment or ...".
        Both confirm the diagnosed cause: an unquoted "|" read as the literal
        block-scalar indicator.
      what_i_did_instead:
        - >-
          T1 SOURCE-TEXT IDENTITY. Byte comparison (claim C1) shows the repaired
          line is the original line with two quote delimiters inserted and
          nothing else, and every other byte of both files is unchanged.
        - >-
          T2 PARSED-VALUE == ORIGINAL RAW TEXT. I parsed the repaired files with
          yaml.safe_load, located the node, and compared its value character for
          character against the substring of the ORIGINAL line following the
          "<key>: " prefix. Result:
          experiment/metrics/secondary[4]/p_dec_counting_bound parses to
          '|S| / N.' and the original raw text is '|S| / N.' - EQUAL;
          experiment/metrics/secondary[1]/branch parses to
          '"square" | "rectangular" - which limb of lines 220-234 executed (RT-OBJ-4).'
          and the original raw text is the same string - EQUAL.
        - >-
          T3 STRUCTURAL ISOLATION. I replaced the single offending line with an
          identical placeholder ("<key>: __PLACEHOLDER__") in BOTH the pre- and
          post-repair file, parsed both, and compared the resulting trees. They
          are identical (Python == and canonical JSON dump both agree) for each
          experiment. This proves the added quotes perturbed the parse of no
          other node anywhere in either document - no key moved, no sibling was
          absorbed, no block boundary shifted.
        - >-
          T4 CONTEXT. Both changed lines sit inside a metrics.secondary block
          sequence in which every sibling entry has the identical shape
          "- <metric_name>: <free-text description>". The line immediately
          following each changed line is at the same indentation, so on the
          block-scalar reading the literal scalar would have had empty content
          and the residual header text ("S| / N.", '"square" | ...') would be
          unexplained - which is precisely why the scanner errored.
        - >-
          T5 NO CONSUMER REGRESSION IS POSSIBLE. grep of tools/*.py and
          harness/*.py finds no reader of metrics.secondary; the only consumer of
          these files, check_experiment in tools/validate_ledger.py, reads only
          the top-level experiment fields. And since neither file parsed at all
          before, no program could previously have read this key. There is no
          behaviour that could regress.
      what_this_proves: >-
        That the repaired documents preserve the source text of the two lines
        exactly modulo two quote delimiters; that the value a parser now returns
        for each repaired key is character-for-character the text that a human
        read in the original file after the key; and that the repair changed the
        parsed meaning of nothing else in either document.
      what_this_does_not_prove:
        - >-
          It does not prove AUTHORIAL INTENT. Because the originals are
          unparseable there is no fact of the matter about what they "meant" as
          YAML. The claim established is source-text preservation, not recovery
          of an intended parse.
        - >-
          For EXP-STR-003 specifically: had the author intended YAML double-quote
          syntax, "square" would have denoted the bare string square. The chosen
          repair instead yields a string that CONTAINS the literal characters
          "square" and "rectangular" with their double quotes. That is the
          conservative choice - it preserves the raw text - but it is a choice,
          and it is not the only defensible one. I judge it correct because the
          rest of the line is prose that cannot be YAML syntax under any reading,
          so the whole line was always documentation text; but that judgement is
          inference from context (T4), not proof.
        - >-
          It does not establish that the descriptions are technically accurate,
          only that they are unchanged.
      verdict_on_this_claim: >-
        Semantic preservation is established as strongly as it CAN be for an
        unparseable original: byte-exact source preservation, parsed value equal
        to original raw text, and zero perturbation of any other node. Full
        parse-tree equivalence with the original is not merely unproven but
        undefined, and I say so rather than implying a stronger result.

    - claim: C3 validator counts 990 -> 985 with the five named errors cleared and no new error
      status: confirmed
      method: >-
        Ran python3 tools/validate_ledger.py myself at HEAD (post-repair). Then
        wrote the 14deee8a versions of the two specs over the working copies,
        re-ran the validator, and restored with "git checkout --". Restoration
        verified: git status --porcelain empty, and sha256 of both files
        identical to the values captured before the swap. The tree is clean.
      pre_repair_stdout_verbatim: |
        note: 1142 grandfathered legacy error(s) suppressed by tools/validate_ledger_baseline.txt
        note: 95 frozen root-level ledger records were indexed; 191 legacy schema issue(s) remain read-only
