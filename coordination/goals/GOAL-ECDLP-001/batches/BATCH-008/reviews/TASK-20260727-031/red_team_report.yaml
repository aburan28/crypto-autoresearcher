  counterexample_or_mutation:
    cheapest_discriminating_control: >-
      THE PARSE TEST ON THE PRE-EDIT BLOB. One command -
      `git cat-file blob <pre-edit-blob> | python3 -c "import sys,yaml;
      yaml.safe_load(sys.stdin)"` - decides the entire disanalogy, because it
      separates "edited a corrupt file" from "edited a record." Run it against
      5de2db97's pre-edit blobs for EV-STR-002 and DEC-20260726-006 and it
      SUCCEEDS: those were records, and rewriting them changed assertions. Run it
      against 1c6f10b7 and 8987eb01 and it RAISES: those were not records. That
      single control is the whole distinction, it costs one command, and it is
      the reason the pre-committed plan is not needed to establish the point.
    mutation_that_would_break_the_verdict: >-
      If the repair had used any transform that is not exactly invertible -
      rewording to remove the pipe, escaping with double quotes (which would
      require altering the embedded `"square"` characters), reflowing the line
      into a block scalar, or bumping `version` - the inverse-transform check
      would return False and the content-null claim would collapse. It returns
      True for both files, so the mutation is absent. This is also the mutation a
      future actor would attempt in order to smuggle content through the
      precedent, which is why gate L2 must be exhibited and not asserted.

