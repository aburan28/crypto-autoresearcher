red_team_report:
  id: RT-20260727-004
  task_id: TASK-20260727-031
  role: red-team
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-008
  date: '2026-07-27'
  session: independent, non-originating; did not author the plan, the repair, or
    any BATCH-007 record

  bound_snapshot:
    head_commit: a935f207a85f5d0a227b811cfbdde4393372aa1a
    parent_commit: 14deee8a33a23cd1c8feef9a25376c53f5e3433c
    branch: claude/ecdlp-batch006
    worktree: /Volumes/Volume/crypto-autoresearcher-worktrees/ecdlp-batch006
    validated_against_git: true
    working_tree_clean_at_entry: true
    verification: >-
      `git rev-parse HEAD` -> a935f207...; `git rev-parse HEAD^` -> 14deee8a...;
      `git status --porcelain` empty at entry. The parent 14deee8a is confirmed
      to stage the repair PLAN and NEITHER specification file
      (`git show --stat 14deee8a`), and a935f207 is confirmed to change exactly
      two lines across the two specification files plus four new
      TASK-20260727-028 artifact files and nothing else.

  inference:
    requested_policy: review-adversarial
    resolved_model_id: claude-opus-5
    fallback_used: true
    model_verified: false
    equivalence_to_requested_policy_claimed: false
    disclosure: >-
      `orchestration/adapter/` is absent on this branch, so
      `python3 -m orchestration.adapter resolve --role red-team` could not be
      run and no probe was performed. AUTORESEARCH_POLICY and
      AUTORESEARCH_BACKEND were unset. `resolved_model_id` is the identifier
      this runtime reports for the session, not an adapter-verified resolution.
      This session is not pairwise-distinct from the other reviews in this
      lineage; no closure quorum is claimed, claimable, or needed here.

  claim_under_review: >-
    That repairing two committed, frozen experiment specifications IN PLACE -
    changing the blob of EXP-STR-003, whose byte-identity at 92268c9e was
    cryptographically attested by TASK-20260727-023 and underwrites the F1
    falsification behind DEC-20260727-009 - is materially different from the
    5de2db97 in-place rewrite that CORR-20260727-007 corrects as an AGENTS.md
    rule 4 violation, because the plan was committed first, the Executor was
    bounded to two declared lines, a snapshot preceded review, two independent
    reviews follow, and a superseding CORR-20260727-004 will record it.

  # ==================================================================
  # VERDICT
  # ==================================================================
  verdict:
    disanalogy: HOLDS_NARROWLY
    summary: >-
      This is NOT the same act as 5de2db97, but it is NOT distinguished by the
      element the Coordinator leads with. The pre-committed plan is procedural
      hygiene that grants no authority, is self-authored, and is exactly the
      element a future bad actor can replicate at zero cost - it is NOT
      load-bearing. The single load-bearing element is that the PRE-EDIT BLOB
      HAD NO VALID PARSE AT ALL, so no assertion could change, and that this is
      provable mechanically and by a stranger from the commit alone. 5de2db97
      moved a parseable record from asserting one conclusion to asserting the
      opposite; a935f207 moved two documents from "not a record" to "a record"
      while adding and removing zero characters of content. Those differ in
      kind, not in degree.
    load_bearing_element: >-
      L1: `yaml.safe_load` on both pre-edit blobs raises, so there was no prior
      parsed content for the edit to change - combined with L2, an
      inverse-transform byte-identity proof that the edit is content-null.
    NOT_load_bearing:
      - the pre-committed plan (self-authored; confers no authority; trivially
        replicable by any future in-place edit)
      - the two-lines-versus-694-insertions size difference (rule 4 has no de
        minimis clause)
      - the snapshot-before-review element (see OBJ-3 - the snapshot is a commit
        but is NOT dispatcher-verified, by the batch's own design)
    f1_result_damaged: false
    fourth_mechanism_exists: true
    is_a_research_result: false

  # ==================================================================
  # THE STRONGEST CASE THAT IT IS THE SAME ACT, ARGUED BEFORE CONCLUDING
  # ==================================================================
  same_act_case:
    - id: SA-1
      text: >-
        Both are in-place edits of committed artifacts under their original ids
        that leave HEAD's text differing from the archived text WITH NO IN-FILE
        MARKER. CORR-20260727-007 defect_b names precisely that: "no superseding
        record and no indication in either file that its text was replaced." A
        reader opening experiments/EXP-STR-003/specification.yaml at HEAD sees
        nothing telling them it was changed after freezing. That sentence
        applies verbatim to a935f207.
      disposition: CONCEDED as to form; defeated by SA-1-REBUT (nothing the file
        asserts changed, and there was nothing it asserted).
    - id: SA-2
      text: >-
        Rule 4 contains no de minimis clause. "Two lines, quoting only" versus
        "694 insertions, 213 deletions" is a difference of degree. A rule that
        yields to smallness yields to any sufficiently patient sequence of small
        edits.
      disposition: CONCEDED. Size is not doing any work in my verdict, and the
        Coordinator must not let it.
    - id: SA-3
      text: >-
        THE STRONGEST SAME-ACT ARGUMENT. At the bound snapshot the superseding
        correction DOES NOT EXIST. CORR-20260727-004 is reserved and unwritten;
        TASK-20260727-032 has not run. An auditor at a935f207 who greps
        ledger/corrections/ finds CORR-001, 002, 003 and nothing about this
        edit. That is structurally IDENTICAL to the repository state after
        5de2db97. Worse, the precedent is bad: CORR-20260727-007 itself only
        exists because an independent forensic validator (TASK-20260727-016,
        finding V-NEW-1) dug the rewrite out of git history a day later. A
        promise to correct, held only in a commit message and a plan, is what
        every uncorrected in-place edit looks like from the inside. This
        campaign has already paused mid-batch once (BATCH-006) and just
        consumed a budget amendment to reach batch 8; an interruption here
        makes the defect permanent.
      disposition: NOT DEFEATED. This is live objection OBJ-1 and is the reason
        the required control is "same commit, or not at all."
    - id: SA-4
      text: >-
        The pre-committed plan is SELF-AUTHORED. The Coordinator wrote it,
        approved it, and dispatched its execution. Nothing in AGENTS.md grants
        a Coordinator authority to pre-authorize an immutability breach; rule 4
        is not addressed to any role. If committing a plan first sufficed, then
        5de2db97 would have been fully laundered by a one-line plan commit at
        20:39. Process-as-authority IS the laundering mechanism the task asked
        about.
      disposition: NOT DEFEATED as to the plan's authority. This is why the
        plan is excluded from the load-bearing set and why the proposed
        precedent boundary is content-gated, not process-gated.
    - id: SA-5
      text: >-
        On one axis a935f207 is WORSE than 5de2db97. It destroys a hash
        attestation that TASK-20260727-023 specifically established and that
        EV-STR-003 records in `provenance.contract_blob`. 5de2db97 broke no hash
        attestation - it only rewrote prose and numbers.
      disposition: PARTIALLY DEFEATED. The attestation as WORDED in EV-STR-003
        is about two named commits and survives intact (see f1_assessment). What
        is destroyed is HEAD byte-identity, which no ledger record asserts. But
        the residual harm in OBJ-2 is real and unnamed anywhere in the batch.
    - id: SA-6
      text: >-
        The repository ALREADY HAS a non-overwriting mechanism for changing a
        frozen specification, and used it on this very experiment family 24
        hours earlier. experiments/EXP-IC-002/amendments/v1_to_v2.yaml states in
        terms: "specification.yaml version 1 is PRESERVED UNCHANGED. This
        amendment supersedes the named fields; it does not overwrite them ...
        Where the two disagree, this record governs." Repair-in-place inverts
        the program's own established precedent for the same file. The plan
        rejected "sidecar" without noticing that a sidecar is what this
        repository does to frozen specs.
      disposition: >-
        PARTIALLY DEFEATED - an amendment sidecar cannot fix a PARSE failure,
        because it registers no id (validate_ledger.py:461-462). But it is
        decisive for the FOURTH MECHANISM below - the precedent shows the
        correct shape is repair PLUS preservation, not repair alone.
    - id: SA-7
      text: >-
        PROPORTIONALITY, which nobody in this batch priced. The repair clears 5
        of 990 non-grandfathered validator errors - 0.5 percent. The validator
        STILL FAILS, at 985 errors, exit code 1. No gate was unblocked, because
        no gate can be gated on a validator that fails at 990. Meanwhile
        eleven OTHER specifications sit in exactly the same unparseable state,
        grandfathered in tools/validate_ledger_baseline.txt (EXP-DREG-001,
        EXP-DREG-002, EXP-EQJ-001, EXP-FB-001, EXP-FB3-001, EXP-ICI-001,
        EXP-REP-001, EXP-REP-002, EXP-SIG-001, EXP-SIG-004, EXP-SIG-005) and
        untouched. The benefit purchased with a broken attestation is small and
        the batch does not say so.
      disposition: NOT DEFEATED as a criticism of the cost-benefit framing;
        does not defeat the disanalogy. Logged as OBJ-4.

  disanalogy_elements_that_actually_survive:
    - id: D-1
      weight: LOAD-BEARING
      element: The pre-edit object had no parsed content, so no assertion could
        change - and this is mechanically provable, by a stranger, from the
        commit alone.
      verification_i_performed: >-
        Extracted blobs 1c6f10b7, 5e0dadf7, 8987eb01, 23319080 to scratch and
        (a) confirmed yaml.safe_load raises yaml.ScannerError "while scanning a
        block scalar" on BOTH pre-edit blobs; (b) confirmed both post-edit blobs
        parse with experiment.id EXP-STR-003 / EXP-IC-002; (c) applied the
        INVERSE TRANSFORM - deleting exactly the two inserted single-quote
        characters from the one changed line - to each post-edit blob and
        obtained the pre-edit blob BYTE FOR BYTE OVER THE WHOLE FILE, True for
        both; (d) confirmed the parsed value equals the original line's text
        after the "<key>: " prefix, character for character, for both. This is a
        scratchpad probe outside the repository and is NOT EVIDENCE UNLESS
        ARCHIVED - see required_controls RC-3.
      why_it_defeats_the_same_act_case: >-
        5de2db97 took records that PARSED and asserted "the structured solve is
        NOT cheaper at B=27" and "16/20-bit instances were too slow to generate"
        and made them assert measurements at B=204 and B=397 and "H-STR-002 is
        confirmed" (CORR-20260727-007 defect_b). a935f207 took two files that
        asserted NOTHING - they were not records, they were corrupt files - and
        made them assert exactly the character sequences a human already read on
        those lines. Rule 4 protects results and claims. No claim existed to
        protect, and none moved.
    - id: D-2
      weight: SUPPORTING (mitigation, not justification)
      element: Disclosure at the moment of the act, plus permanent retrievability.
      basis: >-
        a935f207's own commit message states both blob pairs, states in capitals
        that HEAD is NO LONGER byte-identical to the blob at 92268c9e, and names
        the correction that must be consulted. 5de2db97's message disclosed
        nothing; the rewrite was discovered by forensic audit a day later.
        Disclosure-at-commit versus discovery-by-audit is a material difference
        in the reader's position. It is not an authorization.
    - id: D-3
      weight: NOT LOAD-BEARING
      element: Commit order (plan at 14deee8a precedes the edit at a935f207).
      assessment: >-
        Verified and unforgeable after the fact - `git show --stat 14deee8a`
        confirms neither specification is staged there. But it is self-authored,
        confers no authority under any AGENTS.md rule, and is the single element
        a future in-place edit can replicate at zero cost. If the program treats
        it as sufficient, laundering is trivially available. See
        precedent_boundary.
    - id: D-4
      weight: NOT LOAD-BEARING, AND PARTLY UNEARNED
      element: "Snapshot before review."
      assessment: >-
        a935f207 is a real commit reachable from HEAD with the expected parent,
        and I verified that. But under CLAUDE.md rule 7 an artifact "is not
        official until the dispatcher's post-commit verifier accepts it," and
        BATCH-008's dispatch_queue.json carries commit_sha null for EVERY task
        including the archives, by design, because INT-BATCH007-T /
        INT-BATCH008-C make archive-task verification unreachable repository-wide
        (repair_plan.md section 7 says so explicitly). So the snapshot element is
        weaker than the disanalogy claim implies. The Coordinator should not
        lean on it.
    - id: D-5
      weight: SUPPORTING
      element: Nothing downstream moves.
      basis: >-
        No hypothesis status, evidence record, or decision changes as a
        consequence. H-STR-002 and H-IC-001 remain `weakened`. 5de2db97 carried
        an H-STR-002 flip to `support` inside the same commit as the rewrite.

  precedent_boundary:
    problem: >-
      Because the pre-committed plan is NOT load-bearing, a process-gated rule
      ("a plan was committed first, therefore the edit is clean") licenses
      exactly the laundering the task asked about, and would immediately expose
      the eleven other unparseable frozen specifications to the same treatment.
      The boundary must be CONTENT-gated and checkable by a reader who does not
      trust the actor.
    proposed_gate_L1_to_L5: >-
      An in-place edit of a committed frozen artifact is permitted only when ALL
      of the following hold and are EXHIBITED IN THE COMMIT:
      (L1) the pre-edit blob has NO VALID PARSE under the schema the artifact
      claims - it is a corrupt file, not a record. Anything that parses fails L1
      and is a reissue-under-a-new-id, full stop. This is the clause that can
      never extend to a 5de2db97-shaped case.
      (L2) an inverse transform of the post-edit blob reproduces the pre-edit
      blob BYTE FOR BYTE over the whole file, and that transform is exhibited as
      a re-runnable script, not asserted.
      (L3) the pre-edit bytes are preserved as a LIVE FILE IN HEAD, not only in
      history.
      (L4) the superseding correction record lands IN THE SAME COMMIT as the
      edit, or the edit does not land.
      (L5) no field that any downstream immutable record quotes changes value.
    status_against_the_current_repair:
      L1: MET (verified, both files)
      L2: MET IN FACT, NOT ARCHIVED (I ran it; no batch artifact exhibits it)
      L3: NOT MET (original bytes live only in git history)
      L4: NOT MET (CORR-20260727-004 reserved and unwritten - OBJ-1)
      L5: MET (byte-level line comparison; 923 of 924 and 511 of 512 lines
        identical; no criterion, budget, version, status, or approved_by field
        touched)
    recommendation: >-
      CORR-20260727-004 should state L1-L5 as the boundary of the precedent it
      creates, so that this batch cannot be cited to authorize an in-place edit
      of anything that parses.

  # ==================================================================
  # OBJECTIONS
  # ==================================================================
  objections:
    - id: OBJ-1
      severity: HIGH
      title: The superseding correction does not exist yet, and that is the whole
        of the difference from 5de2db97 at this instant.
      text: >-
        At the bound snapshot, the repository contains an in-place edit of two
        committed frozen contracts and no superseding record. That is exactly
        the state CORR-20260727-007 corrects. Every distinguishing element the
        Coordinator names except D-1 is currently a promise held in a commit
        message. AGENTS.md rule 4 says corrections CREATE NEW RECORDS; it does
        not say a future task may create one. The gap is not hypothetical: this
        campaign paused mid-batch at BATCH-006, required BUDGET-AMEND-004 to
        reach batch 8, and BATCH-008's archive tasks cannot be closed at all
        under INT-BATCH007-T.
      required_action: >-
        CORR-20260727-004 must land, and TASK-20260727-032 must be treated as
        non-optional and non-deferrable. If BATCH-008 terminates before it, the
        correct disposition is to say so loudly in GOAL-ECDLP-001 as an open
        evidence-integrity defect of the SAME class as CORR-20260727-007
        defect_b - not to leave it implicit.
      disposition_if_unmet: The repair should be regarded as an uncorrected
        rule 4 violation, not as a distinguished one.
    - id: OBJ-2
      severity: MEDIUM
      title: EV-STR-003's spec proof_ref is an unpinned path and now resolves to a
        different blob at HEAD. Nobody in this batch has named this.
      text: >-
        ledger/evidence/EV-STR-003.yaml line 134 lists
        `experiments/EXP-STR-003/specification.yaml` under `proof_refs` as a
        BARE PATH with no commit pin. A reader resolving that proof_ref at HEAD
        now resolves blob 5e0dadf7, not the 1c6f10b7 the evidence was written
        against. The difference is one inserted quote pair, so no criterion text
        moved and no number changed - but the reference-resolution discipline
        for an immutable evidence record is now silently commit-dependent, and
        the record does not say so. `provenance.contract_blob` pins 1c6f10b7 and
        `provenance.contract_freeze_commit` pins 92268c9e, so the information to
        resolve correctly exists; nothing instructs the reader to use it.
      required_action: >-
        CORR-20260727-004 must state the resolution rule explicitly: EV-STR-003's
        specification proof_ref resolves at 92268c9e, not at HEAD. Combined with
        the fourth mechanism below, this closes the residual harm entirely.
    - id: OBJ-3
      severity: MEDIUM
      title: The "snapshot before review" element of the disanalogy is not
        dispatcher-verified and should not be asserted as though it were.
      text: >-
        CLAUDE.md rule 7 and AGENTS.md "Durable research commits" make an
        artifact official only on the dispatcher's post-commit receipt.
        BATCH-008's dispatch_queue.json carries `commit_sha: null` for all eight
        tasks, and repair_plan.md section 7 states that under INT-BATCH007-T /
        INT-BATCH008-C no archive task can be marked completed or pass
        verify_archive. I verified a935f207 by hand against git and it satisfies
        every property the verifier WOULD check - reachable from HEAD, expected
        parent, exactly the declared paths, recorded hashes preserved, task and
        record ids named - but that is my check, not the dispatcher's.
      required_action: >-
        DEC-20260727-003 must state that the snapshot element of the disanalogy
        rests on hand verification recorded in two review reports, not on a
        dispatcher receipt, and must not fabricate a receipt hash.
    - id: OBJ-4
      severity: MEDIUM
      title: The cost-benefit of the repair is never stated, and it is unflattering.
      text: >-
        The batch reports 990 -> 985 as a clean transition. The denominator is
        never used. The repair clears 0.5 percent of the non-grandfathered error
        set; the validator still exits 1 with 985 errors; no gate was unblocked
        because no gate could have been; and eleven other specifications remain
        unparseable and grandfathered, so "the ledger now validates" is false
        and "these two experiments now register" is the true and much smaller
        claim. The price paid was HEAD byte-identity on an attested contract.
        A reader is entitled to that comparison.
      required_action: >-
        EV-SPEC-001 and DEC-20260727-003 must state the residual error count
        (985, exit 1) and the eleven-spec residue alongside the delta, and must
        not phrase the outcome as validator improvement without the denominator.
    - id: OBJ-5
      severity: LOW-MEDIUM
      title: repair_plan.md section 5 OVER-CONCEDES. A mechanical proof of
        content preservation does exist and is stronger than the substitute
        offered.
      text: >-
        Section 5 asserts "semantic equivalence cannot be proved mechanically"
        and substitutes a decidable-by-eye diff plus two reviews. What is
        genuinely unavailable is a PARSED-TREE DIFF. What IS available, and is
        strictly stronger for a pure-delimiter change, is an INVERSE-TRANSFORM
        BYTE-IDENTITY PROOF: delete the inserted delimiters from the post-edit
        blob and require the pre-edit blob back, byte for byte, over the whole
        file. I ran it: True for both files. Add (a) the pre-edit blob has NO
        valid parse at all, so there is no second reading the repair could have
        chosen wrongly, and (b) parsed value == original post-key text character
        for character, and the argument is COMPLETE. So the answer to "is a
        two-line eye-verifiable diff plus two reviews an adequate substitute for
        a missing check?" is: the check is not missing, and the reviews are not
        a substitute for it. The reviews check the CHOICE of repair - was
        quoting the right fix rather than rewording? - which is a judgement call
        and correctly reviewed. Presenting a provable thing as unprovable is a
        defect in the safe direction, but it invites the next batch to skip the
        proof.
      required_action: >-
        EV-SPEC-001 should archive the inverse-transform check as a re-runnable
        script with its output, and rest `proof_status: derivation` on that
        rather than on eye-verification. I am NOT asking for a certificate
        claim; `derivation` remains correct.
    - id: OBJ-6
      severity: LOW
      title: A latent, pre-existing inconsistency becomes machine-visible now that
        EXP-IC-002 registers.
      text: >-
        The repaired EXP-IC-002 specification parses to `version: 1`, while
        experiments/EXP-IC-002/amendments/v1_to_v2.yaml declares
        `version_from: 1, version_to: 2`. That is BY DESIGN - the amendment
        record states "specification.yaml version 1 is PRESERVED UNCHANGED ...
        Where the two disagree, this record governs" - and `git log` confirms
        the spec file was never touched by commit e0db8ef7. The validator does
        not check it, so it is not an error, and this batch did not cause it.
        But any future consumer that now reads `experiment.version` from the
        newly-registered document will read 1 and silently miss the amendment.
      required_action: One sentence in DEC-20260727-003 recording that
        EXP-IC-002's operative protocol is v1 AS AMENDED by
        amendments/v1_to_v2.yaml, and that the registered document alone is not
        the operative protocol.
    - id: OBJ-7
      severity: LOW (standing limitation, NOT caused by this batch, NOT an attack
        on F1)
      title: The frozen contract was never machine-bound to the execution.
      text: >-
        The task rightly flags that the 20 runs were executed against a spec no
        tool could parse. I checked what follows and it is a general property,
        not a consequence of the defect: `tools/validate_ledger.py` is the ONLY
        program in the repository that opens `experiments/*/specification.yaml`
        (grep over tools/, harness/, orchestration/; the only other matches are
        fixtures in tools/test_research_dispatch.py). The runs were driven by
        experiments/EXP-STR-003/driver/ablation_driver.py from CLI arguments,
        and NO run manifest references the specification path or any hash of it
        (grep -l "specification" over the 20 manifests returns 0). So nothing
        ever mechanically verified that the driver implemented the frozen
        protocol; the pre-registration guarantee behind F1 is commit order plus
        human transcription. That was equally true at 92268c9e and is unchanged
        by the repair. I do not use it to attack F1 - EXP-STR-003's own runs and
        results were independently checked in BATCH-007 - but it should be
        recorded as a standing limitation rather than left implicit.
      required_action: Record as a goal-level integrity note; no action in this
        batch.

  # ==================================================================
  # FOURTH MECHANISM
  # ==================================================================
  fourth_mechanism:
    exists: true
    name: M4 - repair in place PLUS the frozen original preserved as a live,
      non-globbed companion file
    relation_to_chosen_mechanism: >-
      NOT a replacement. It is the COMPLETION of the chosen mechanism, it clears
      the same 5 of 5 errors, and - critically - it is STILL AVAILABLE NOW,
      post-hoc, without reverting or re-editing anything, because it only ADDS
      files.
    specification: >-
      Commit blob 1c6f10b7ba4db293126504c19b4fe9c931b257f3 verbatim to
      experiments/EXP-STR-003/specification.v1-frozen-1c6f10b7.yaml and blob
      8987eb01978ab82538b17e35358c389c23a9b7f1 verbatim to
      experiments/EXP-IC-002/specification.v1-frozen-8987eb01.yaml.
    why_it_is_safe:
      - >-
        tools/validate_ledger.py:461-462 globs
        `experiments/*/specification.yaml` EXACTLY. A companion under any other
        filename is never opened, never parsed, registers no id, and can never
        collide - the "duplicate ID EXP-STR-003" instability the plan correctly
        feared for a registering sidecar cannot arise for a file that is never
        parsed.
      - >-
        No other program in the repository reads experiment specifications at
        all (verified by grep over tools/, harness/, orchestration/), so the
        blast radius of the addition is exactly zero.
      - >-
        It is ADDITIVE. It modifies no committed file and deletes nothing. Adding
        bytes that are already permanently attested is not an immutability
        breach; it is the discharge of one.
    why_the_plan_missed_it: >-
      repair_plan.md section 2.3 evaluated SIDECAR-AS-REGISTRATION - a repaired
      copy that the validator would read - and rejected it correctly on three
      grounds (it registers nothing under a non-globbed name; it manufactures a
      directory whose name contradicts its id; it becomes a duplicate id the
      moment the original is repaired). It never evaluated
      SIDECAR-AS-PRESERVATION, which has none of those properties. The very
      fact that made a sidecar useless as a repair - the validator ignores it -
      makes it perfect as a preservation.
    it_follows_the_repositorys_own_precedent: >-
      experiments/EXP-IC-002/amendments/v1_to_v2.yaml already does exactly this
      for a different kind of change to a frozen spec, in this same goal, on
      this same experiment: "specification.yaml version 1 is PRESERVED
      UNCHANGED. This amendment supersedes the named fields; it does not
      overwrite them." M4 restores that shape.
    what_it_buys: >-
      It satisfies gate L3 and repairs OBJ-2 completely. A reader at HEAD can
      see and hash the exact frozen bytes without git archaeology and without
      trusting a narrative; the repair becomes supersede-BY-ARTIFACT instead of
      supersede-by-narrative; and the 20 runs' attested contract is present in
      the tree the reader is standing in.
    cost: >-
      Two added files and a widening of TASK-20260727-032's write_scope by
      exactly two experiment paths. That is a Coordinator decision, not mine.
    fallback_if_M4_is_judged_scope_creep: >-
      At minimum, CORR-20260727-004 must record a SHA-256 of each pre-edit file
      alongside the git blob sha1. The blob ids recorded everywhere in this
      batch are git-internal SHA-1 values; a content hash makes retrieval
      verifiable independently of git and of this repository. These MUST be
      recomputed and archived under TASK-20260727-032 - see RC-3.
