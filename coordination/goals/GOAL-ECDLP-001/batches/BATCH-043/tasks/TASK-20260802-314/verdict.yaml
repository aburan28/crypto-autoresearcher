    note: >-
      c_smart=64 has no operation-count justification and the field-op to
      group-op conversion is unstated; the target-result-profile requires
      per-entry constants and unit conversions explicit and justified. Fix at
      RT-314-B1; do not merely swap 64 for another unjustified constant.

