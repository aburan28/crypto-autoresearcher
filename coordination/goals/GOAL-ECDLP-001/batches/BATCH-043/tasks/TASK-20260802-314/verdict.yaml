      Flag discretion is removed and one entrypoint is bound (B3 wording met),
      but two command strings are frozen and the parenthetical "(or the
      smoke/measure pair as written)" is redundant; tighten so "these strings"
      unambiguously means the frozen pair only.
  - id: RT-314-D3
    title: c_smart_constant_and_unit_conversion_unjustified_vs_profile
    severity: major
    frozen_clauses:
