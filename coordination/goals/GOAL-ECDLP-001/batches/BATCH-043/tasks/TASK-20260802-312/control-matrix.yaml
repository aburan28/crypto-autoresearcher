control_matrix:
  amendment_id: PA-IT-001-v3-rc43-repair-3
  controls:
  - id: CTRL-ANOMALOUS-TRACE1
    pass_threshold_formula: C_special_smart
    forbidden_formulas:
    - C_special_field_DLP
    - ceil(2*sqrt(N*))
    - ceil(0.886*sqrt(p^k))
    plant: verified Smart trace-1
  - id: CTRL-TRANSFER-NONSPECIAL
    required_fields:
    - start_j_speciality=nonspecial
    - end_j_speciality=nonspecial
    - path_is_reverse_of_planted=true
    - pullback_evaluated=true
    - relation_reverified=true
  - id: CTRL-NULL-PACKAGING-GATE
    must_reject_synthetic_R_xfer_lt_0_7: true
  - id: CTRL-NULL-IT-PLANT
    ledger: ctrl_null_it_plant_edge_ledger.jsonl
    recompute_script: experiments/EXP-IT-001/implementation/recompute_null_plant_from_ledger.py
  - id: CTRL-MOV-COMPARATOR
    formula: C_special_field_DLP
    role: labeled comparator only
    never_pass_threshold: true
  closes:
  - RT-244-B1
  - RT-244-B2
  - RT-244-B3
  - RT-244-M1
  - RT-244-M2
  - RT-244-M3
