  blindness:
    mutual: true
    lifted_for: []
    rationale: null

  proves_too_much:
    objects:
      - >-
        The section-(G) x-bucket 3dp smoke at composite N, whose
        published digits are not exact rationals and whose
        match_3dp_all is false on S2c.
      - >-
        A reading that would treat a diagnostic mismatch as
        confirmation of the interval fixture or of H.
    failure_signature: >-
      An argument that cites match_3dp_all false as a 3dp pass,
      as nearby success, or as support for H or digit ADV has
      proved too much. An argument that treats x-bucket as the
      blocking r=1 fixture has proved too much.
    assigned_to: TASK-20260907-8a0b02

  blind_rederivation:
    required: true
    quantity: >-
      Interval-partition majority and strict propagation at n=23,
      s=3, exact rationals over all n^2 pairs. Let
      v(k) = min(floor(k*s/n), s-1) for k in {0,...,n-1}. Let
      N[a,b,c] be the number of (k,ell) in {0,...,n-1}^2 with
      v(k)=a, v(ell)=b, and v((k+ell) mod n)=c. Then
      q_maj = (1/n^2) * sum_{a,b} max_c N[a,b,c].
      q_strict is the fraction of pairs (k,ell) whose sum fiber
      is forced by (v(k), v(ell)): for each (a,b), if
      A_a + A_b is contained in a single fiber A_c (equivalently,
      only one c has N[a,b,c] > 0), all those pairs are strictly
      determined; otherwise none of them are.
      Report both quantities as exact rationals in lowest terms.
      Holds only if q_maj = 284/529 and q_strict = 0.
    parameters:
      n: 23
      s: 3
      pairs: 529
      partition: interval
    blind_from:
      - experiments/EXP-ECDLP-a98ea9/implementation/
      - experiments/EXP-ECDLP-a98ea9/execution-report-stage2c.yaml
      - experiments/EXP-ECDLP-a98ea9/execution-report-stage2.yaml
      - experiments/EXP-ECDLP-a98ea9/runs/RUN-ECDLP-a98ea9-S2c/
      - experiments/EXP-ECDLP-a98ea9/runs/RUN-ECDLP-a98ea9-S2b/
      - experiments/EXP-ECDLP-a98ea9/runs/RUN-ECDLP-a98ea9-S2/
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-da8d1e/reviews/TASK-20260907-8a0b02/
    assigned_to: TASK-20260907-b736a3
