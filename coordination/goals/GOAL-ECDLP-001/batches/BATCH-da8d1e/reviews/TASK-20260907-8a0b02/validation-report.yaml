      match_3dp_all: false
      labeled_diagnostic: true
      labeled_not_blocking: true
      used_as_3dp_pass: false
      used_as_nearby_is_a_pass: false
      used_as_H_or_ADV_evidence: false
      xbucket_diagnostic_pass_field_true: true
