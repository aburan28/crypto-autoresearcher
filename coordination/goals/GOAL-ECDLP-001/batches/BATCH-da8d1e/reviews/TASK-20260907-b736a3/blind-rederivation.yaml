  construction_notes: >-
    Independent derivation from review_plan.blind_rederivation.quantity
    and its parameters only. No producer implementation (qmaj.py,
    stage2.py, or any file under experiments/EXP-ECDLP-a98ea9/), no
    Stage 2 / 2b / 2c run directory, no execution report, and no
    sibling review TASK-20260907-8a0b02 was opened. git log and
    git show were not run.

    v(k) = min(floor(k*3/23), 2) on {0,...,22} yields fibers
    A_0 = {0..7} (size 8), A_1 = {8..15} (size 8), A_2 = {16..22}
    (size 7). All 23*23 = 529 pairs (k,ell) were enumerated.
    For each pair, labels a = v(k), b = v(ell),
    c = v((k+ell) mod 23) were tallied into N[a,b,c].
    Sum of N over all (a,b,c) is 529.

    q_maj numerator is the sum of max_c N[a,b,c] over the nine
    (a,b) cells: 36+36+28+36+36+28+28+28+28 = 284. Written as
    fractions.Fraction(284, 529), already in lowest terms
    (529 = 23^2, 284 = 4*71).

    Every (a,b) cell has support size exactly 2 (two distinct c
    with N[a,b,c] > 0). No cell has A_a + A_b contained in a
    single fiber, so no pair is strictly determined and
    q_strict = Fraction(0, 529) = 0/1.

    Holds: q_maj = 284/529 and q_strict = 0, matching the
    pre-registered fixture. No ADV or D2 quantity was computed
    or interpreted.

