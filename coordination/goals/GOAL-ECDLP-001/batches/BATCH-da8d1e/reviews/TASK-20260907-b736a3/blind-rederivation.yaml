blind_rederivation:
  task_id: TASK-20260907-b736a3
  batch_id: BATCH-da8d1e
  quantity: >-
    Interval-partition majority and strict propagation at n=23, s=3,
    exact rationals over all n^2 pairs. v(k) = min(floor(k*s/n), s-1)
    for k in {0,...,n-1}. N[a,b,c] = number of (k,ell) in
    {0,...,n-1}^2 with v(k)=a, v(ell)=b, v((k+ell) mod n)=c.
    q_maj = (1/n^2) * sum_{a,b} max_c N[a,b,c]. q_strict is the
    fraction of pairs (k,ell) whose sum fiber is forced by
    (v(k), v(ell)): for each (a,b), if A_a + A_b is contained in a
    single fiber A_c (equivalently only one c has N[a,b,c] > 0),
    all those pairs are strictly determined; otherwise none of
    them are.
  parameters_used:
    n: 23
    s: 3
    pairs: 529
    partition: interval
    enumeration: all (k,ell) in {0,...,22}^2; no sampling
  implementation: coordination/goals/GOAL-ECDLP-001/batches/BATCH-da8d1e/reviews/TASK-20260907-b736a3/interval_blind.py
  raw_output: coordination/goals/GOAL-ECDLP-001/batches/BATCH-da8d1e/reviews/TASK-20260907-b736a3/blind_raw.json

  computed:
    q_maj: 284/529
    q_strict: 0/1
    maj_numerator: 284
    strict_numerator: 0
    pair_count: 529
    expected_q_maj: 284/529
    expected_q_strict: 0
    q_maj_holds: true
    q_strict_holds: true

  fibers:
    A_0: [0, 1, 2, 3, 4, 5, 6, 7]
    A_1: [8, 9, 10, 11, 12, 13, 14, 15]
    A_2: [16, 17, 18, 19, 20, 21, 22]
    sizes: {0: 8, 1: 8, 2: 7}

