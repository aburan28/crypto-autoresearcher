  objections:
    - id: RT025-B1
      severity: BLOCKING ON DECISION
      blocks_ledger_disposition: true
      advisory: false
      title: Toy R must not be read as crypto-scale or asymptotic support
      target: >-
        Any EV-DS-001 / DEC-20260731-004 / H-DS-001 prose that treats R<0.5
        cells, S1_eligible_observation, or assembled_E_proxy as crypto-scale
        ECDLP improvement, exponent move, or asymptotic_claim toward
        `supported`.
      statement: >-
        Claim tier is toy; bit sizes are 16/20/24; claim_ceiling and
        what_this_experiment_is_NOT forbid crypto-scale and asymptotic support
        under any outcome. Assembled E proxy is formulaic
        max(beta*m/2, omega_LA*beta, beta) with min≥0.65 — no E<0.45 cell —
        and is honesty telemetry against rho, not a measured end-to-end break.
        AGENTS rule 7: toy stays toy. All four promotion gates remain OPEN
        (see asymptotic_promotion_gates).
      which_way_it_cuts: >-
        Blocks upward smuggle. Does not erase the toy matrix measurements.
      discharging_requirement: >-
        Ledger disposition must restate claim_ceiling, keep asymptotic_claim
        gates OPEN, and scope any R discussion to the named toy cells and
        recorded deviations.

    - id: RT025-B2
      severity: BLOCKING ON DECISION
      blocks_ledger_disposition: true
      advisory: false
      title: HEUR-DS-1 F3 failure and S1-eligible labels are not asymptotic support
      target: >-
        Any smoothness-based exponent narrative, HEUR-DS-1 "validated at toy
        therefore usable at crypto," or reading F3 beside S1-eligible cells as
        partial asymptotic support.
      statement: >-
        F3_trigger_observation=true: RATE-DS-1 and KS-DS-1 failed at 16, 20,
        and 24 bits with n=1e5 (e.g. bits=16 p_hat=0.14746 vs rho(u*)≈0.00252,
        factor ≫ c=8). Contract F3_only: record HEUR failed at toy; R decision
        still follows S1/F1/F2, and F3 blocks any smoothness-based exponent
        narrative. Primary R was harvested with smoothness_abort=false, so
        even the R arm does not exercise HEUR early-abort. Additionally,
        HEUR samples encode_intermediate(x-coordinate of EC point sums), not
        Semaev resultant/norm intermediates of size D=2^(bits·d_half) — a
        random-model transfer failure for HEUR-DS-1 as stated in H-DS-001.
        TAIL_DS_1_ok with p_ext=1.0 on all three bit sizes is consistent with
        the driver's smoothest≤1 branch (vacuous tail), not a validated extreme-
        value check — do not cite TAIL pass as heuristic support.
      which_way_it_cuts: >-
        Blocks HEUR→exponent smuggle. F3 is a toy-scale heuristic failure
        report, not crypto-scale refutation and not mechanism proof via R.
      discharging_requirement: >-
        EV/DEC must record HEUR-DS-1 failed at toy (F3), forbid smoothness-
        based exponent narrative, and refuse to treat S1-eligible cells as
        heuristic validation.

    - id: RT025-B3
      severity: BLOCKING ON DECISION
      blocks_ledger_disposition: true
      advisory: false
      title: Null-gate / packaging artifact — CTRL theater and asymmetric null
      target: >-
        Any claim that IDEA-20260731-011 structure-dependence is established,
        or that planted_bug_detected=true / R_null≫0.9 validates mechanism
        over packaging.
      statement: >-
        (1) CTRL-NULL-PLANT in ds001_driver.py ends with a synthetic known-
        answer plant synth_R=synth_Rn=0.05 that forces planted_bug_detected
        true regardless of whether the live null gate would flag a real /4
        packaging bug — control theater, not IDEA-011's positive control.
        (2) CTRL-NULL-RHO sets rho_calib_ratio_real=rho_calib_ratio_null=1.0
        by identity comment, not by measuring honest rho on real vs null —
        negative control not executed. (3) null_split_search uses independent
        half-keys that do not compose, so claws rarely verify and R_null is
        systematically huge (≈62–274 on S1-axis cells); F2 never fires
        (f2_eligible=0). An asymmetrically crippled null makes
        R_null≥0.9 whenever R_real<0.5 a near-automatic pass — null-gate
        evasion risk under inventor-protocol §3. (4) Real arm uses planted
        m-sums so membership always exists; measuring claw vs naive search
        time on guaranteed-hit targets is not Semaev sparse-target relation
        cost. Together these prevent reading the package as structure-gate
        cleared.
      which_way_it_cuts: >-
        Blocks S1_met / mechanism-supported disposition. Favors
        inconclusive_partial or weaken with explicit deviation scope; forbids
        structure_gate_passed narratives.
      discharging_requirement: >-
        EV/DEC must list the four deviation/control defects, refuse
        structure-dependence claims, and require a repaired null+plant+rho
        control package before any S1_met reading.

    - id: RT025-B4
      severity: BLOCKING ON DECISION
      blocks_ledger_disposition: true
      advisory: false
      title: Cost-identity abuse via charged-units proxy and planted yield
      target: >-
        Any reading of R = cost_split/cost_naive as Groebner/Semaev membership
        cost, per-attempt algebraic cost, or total expected attack cost.
      statement: >-
        Contract cost_identities charge wall_seconds × rho_gop_per_second /
        max(n_usable,1). Backend is exact point-sum verification with
        charge_backend_units(m)∈{40,120} as a proxy — not per-attempt sympy
        Groebner. Those units are accumulated but do not enter R; R is wall-
        dominated enumeration timing on planted targets with n_usable=15 by
        construction. Total expected cost = per-attempt × inverse success
        probability is not measured: planted m-sums set success≈1, and
        smoothness_abort is off on the R arm. CTRL-BACKEND-IDENTICAL
        "sign_stable" is synthetic ±10% wall noise when CI excludes 0.5, not
        a ±10x backend-unit perturbation of a shared Groebner solver. Reduced
        cell walls (≈45s / 15 relations vs 7200 / 200) further underpower the
        yield-charged identity. This is not a complete Pollard-rho / BSGS /
        specialized-Semaev baseline comparison for end-to-end ECDLP.
      which_way_it_cuts: >-
        Blocks cost-path and exponent-assembly claims from R. Matched rho/BSGS
        receipts remain calibration/baseline telemetry only.
      discharging_requirement: >-
        EV/DEC must scope R as toy wall-charged ratio under the named proxy
        and planted-target regime; must not equate it to Groebner membership
        cost or end-to-end ECDLP cost.

    - id: RT025-B5
      severity: BLOCKING ON DECISION
      blocks_ledger_disposition: true
      advisory: false
      title: R-1 (F2-over-S1) remains binding — cannot be ignored
      target: >-
        Any dual success label, or any disposition that treats
        S1_eligible_observation as S1_met while leaving R-1 optional.
      statement: >-
        Residual R-1 (OPEN_NONBLOCKING at RT-20260731-020 / DEC-20260731-022)
        binds Executor/Validator/Coordinator: if any completed cell with R<0.5
        has R_null<0.9, official disposition is F2_met even if other cells
        would satisfy S1. On this package f2_eligible=0 so the override does
        not fire — but R-1 is not discharged by a quiet matrix. Package-level
        S1_eligible_observation must not be promoted to S1_met without the
        full success_criterion (including CI excluding 0.5 from above and
        non-theater plant/sign-stable controls). Ignoring R-1 in ledger prose
        is a process overclaim.
      which_way_it_cuts: >-
        Blocks S1_met without R-1 acknowledgment; blocks inventing dual labels
        in future cells.
      discharging_requirement: >-
        DEC must restate R-1 as binding adjudication; record that override did
        not fire on this matrix; refuse S1_met unless full S1 conjuncts hold
        under non-theater controls.

    - id: RT025-B6
      severity: BLOCKING ON DECISION
      blocks_ledger_disposition: true
      advisory: false
      title: No scope creep into H-IC-001 or H-STR-002
      target: >-
        Any status change, reopen, strengthen, or weaken of H-IC-001 or
        H-STR-002 citing EXP-DS-001.
      statement: >-
        Contract does_not_modify_hypotheses and claim_ceiling forbid altering
        H-IC-001 / H-STR-002. This lane is not STR / phi_alpha polish and not
        a reopen of weakened IC. Red Team did not and must not edit those
        records.
      which_way_it_cuts: >-
        Blocks cross-hypothesis smuggle.
      discharging_requirement: >-
        EV/DEC explicitly leave H-IC-001 and H-STR-002 unchanged (weakened).

    - id: RT025-M1
      severity: MAJOR
      blocks_ledger_disposition: true
      advisory: false
      title: S1_eligible_observation overclaims full S1_met
      target: >-
        summary.json r1_disposition_observation; any Coordinator promotion of
        that string to outcome_disposition.S1_met.
      statement: >-
        32 cells are labeled S1_eligible_on_null_axis from point estimates
        only. Full S1 also requires bootstrap CI excluding 0.5 from above,
        plant detection, and sign-stability. Recomputed: 23/32 have CI
        upper<0.5, but 15 null-axis cells have the point estimate outside the
        reported CI (broken/noisy bootstrap of per-attempt wall ratios at
        n=15). At 16 bits only two null-axis cells exist; one CI includes 0.5
        (R≈0.4895∈[0.027,0.652]); the other has R outside CI and
        sign_stable=false. Under honest S1 reading, 16-bit support is not
        established — undermining the "≥2 bit sizes" clause if 16 is required
        beside 20/24. Disposition must not be S1_met on this unrepaired set.
      which_way_it_cuts: >-
        Forces inconclusive_partial or weaken+replicate rather than S1_met.
      discharging_requirement: >-
        Coordinator applies full S1 conjuncts; treats cell labels as
        null-axis observations only; rejects reject_scoped-from-S1 and
        S1_met alike on theater/deviation grounds unless a repaired rerun
        clears controls.

    - id: RT025-M2
      severity: MAJOR
      blocks_ledger_disposition: false
      advisory: true
      title: Reduced walls and yield targets underpower confirmatory reading
      target: protocol_deviations cell_wall / relations_target
      statement: >-
        Contractual stopping is 200 relations or 7200s per method; executed
        ≈15 relations and ≈45s cell walls. Executor recorded the deviation
        and completed 54 cells — not fabrication — but confirmatory_status
        exploratory plus underpowered harvest blocks treating the matrix as
        a confirmatory S1 demonstration. Advisory relative to B3/B4 only
        because those already block S1_met; still must appear in EV limitations.
      which_way_it_cuts: >-
        Supports replication-with-contractual-budgets before any strengthen.
      discharging_requirement: >-
        Name the deviation in EV/DEC limitations; do not silent-upgrade
        exploratory → confirmatory.

  required_controls:
    - id: CTRL-RT025-UNPLANTED
      description: >-
        Cheapest discriminating control: re-measure one (bits,B,m) cell with
        R≪0.5 under planted m-sums (e.g. 20/64/m4) using unplanted uniform
        random targets (or sparse random targets with explicit success-
        probability accounting), same backend id, smoothness_abort=false,
        contractual relations_target or honest resource_exhaustion. If R
        collapses, yield dies, or R_null gate behavior changes, the BATCH-018
        R signal is planted-yield packaging.
      falsifies_if: >-
        Planted-arm R≪0.5 fails to reappear with unplanted targets under the
        same charged cost identity, or usable-yield goes to zero while being
        reported as a mathematical negative (must be infrastructure /
        scope-limited instead).
    - id: CTRL-RT025-PLANT-LIVE
      description: >-
        Replace synthetic synth_R/synth_Rn known-answer with a live /4
        inflation of reported split costs on one real arm and confirm the
        null gate flags R_null echo without hardcoded detection.
      falsifies_if: >-
        Live plant not detected while summary still claims
        planted_bug_detected=true.
    - id: CTRL-RT025-RHO-CALIB
      description: >-
        Actually run CTRL-NULL-RHO (honest matched rho cost ratios on real vs
        null) within band ±0.15; do not hardcode 1.0.
      falsifies_if: >-
        Ratios deviate beyond band or remain unmeasured while cited as pass.
    - id: CTRL-RT025-HEUR-OBJECT
      description: >-
        If HEUR-DS-1 is retained, sample the frozen Semaev resultant/norm
        intermediate integers of size governed by D(bits,m), not EC
        x-coordinates; keep RATE/KS/TAIL; null-object smoothness on random
        multihomogeneous intermediates.
      falsifies_if: >-
        x-coordinate sampling continues to be cited as HEUR-DS-1 validation.

  counterexample_or_mutation: >-
    Cheapest falsification of the favourable R reading: identical claw vs
    naive measurement on unplanted random targets at a single 20-bit B=64 m=4
    cell (CTRL-RT025-UNPLANTED). Expected under packaging: R rises toward ≥0.5
    or yield/resource_exhaustion dominates. Expected under true structure-
    dependent membership rewrite: R remains <0.5 with CI excluding 0.5 and a
    non-theater null gate. Secondary mutation: enable smoothness_abort=true
    on the R arm despite F3 — if abort destroys yield while HEUR fails RATE,
    the abort path cannot underwrite an exponent narrative.

  baseline_comparison: >-
    Matched Pollard rho (negation) and modeled BSGS are present as CTRL-RHO /
    CTRL-BSGS receipts. Assembled E proxy stays ≥0.65 on every cell — no
    toy cell reports E below the free-oracle LA / rho honesty floor called
    out in H-DS-001 (E≥~0.45 warning). Closest specialized baseline for the
    stated regime is naive (m-1)-tuple Semaev/Groebner membership; this
    package substitutes point-sum membership with planted solutions, so it
    does not beat that specialized baseline — it measures a different
    problem. No dominated_by Pareto win over rho/BSGS is claimable; an
    unchecked null dominated_by asserting sub-rho ECDLP cost would be
    fabrication under AGENTS rule 5 / inventor-protocol §4.

  heuristic_challenges:
    - id: HC-1
      heuristic: HEUR-DS-1
      challenge: >-
        Explicit and numbered, but failed RATE and KS at all completed toy
        bit sizes (F3). Cannot support early-abort exponent bookkeeping.
    - id: HC-2
      heuristic: HEUR-DS-1
      challenge: >-
        Random-model transfer: sampled object is encode_intermediate of EC
        x-coordinates of half-arity point sums, truncated to floor(log2 D)+1
        bits — not Semaev partial-map resultant/norm integers. u*=ln(D)/ln(B)
        with D=2^(bits·d_half) does not match the sampled bitlength law
        (field-sized x). Cheapest exposure: compare p_hat on true Semaev
        intermediates vs x-coord encodings at bits=16 (already RATE-failed
        on the wrong object).
    - id: HC-3
      heuristic: HEUR-DS-1
      challenge: >-
        Scale honesty: only 16–24 bit subgroups; no Deuring-style or other
        correspondence to crypto scale (specification.scale_relevance
        correspondence null). Toy failure ≠ crypto refutation; toy pass
        would still not validate crypto (AGENTS rule 7).
    - id: HC-4
      heuristic: HEUR-DS-1
      challenge: >-
        TAIL_DS_1_ok with p_ext=1.0 at all three bit sizes indicates the
        smoothest≤1 vacuous branch, not a calibrated tail test. Do not cite
        as supportive.

  cost_model_challenges:
    - id: CM-1
      challenge: >-
        R uses wall×rho_gop/n_usable, not charged backend units and not
        Groebner poly(D) cost — proxy abuse risk when narrated as algebraic
        membership cost.
    - id: CM-2
      challenge: >-
        Planted m-sums set per-target success probability ≈1; total expected
        cost ≠ measured per-success wall cost × 1/p_success under sparse
        targets.
    - id: CM-3
      challenge: >-
        smoothness_abort=false on R arm: HEUR-justified abort cost model not
        in the primary ratio; F3 already blocks abort-based exponent claims.
    - id: CM-4
      challenge: >-
        Hidden overhead / memory: peak_rss_bytes_claw_table recorded but no
        concrete-cost table at crypto sizes; o(1) Dickman and Groebner factors
        uncharged. van Oorschot–Wiener back to rho not evaluated.
    - id: CM-5
      challenge: >-
        Bootstrap CIs from n=15 per-attempt wall ratios produce frequent
        point-outside-CI pathologies — unfit as sole S1 CI gate without
        repair.

  reduction_and_scope_challenges:
    - id: RS-1
      challenge: >-
        reduction_chain.corollaries is empty — no OneEnd/EndRing-style
        corollary to inflate. Keep it that way.
    - id: RS-2
      challenge: >-
        Scope must not expand to H-IC-001 or H-STR-002 (both remain weakened,
        unmodified).
    - id: RS-3
      challenge: >-
        Affected-vs-safe scheme lists: none admissible; no deployed curve is
        implicated by 16–24 bit planted point-sum timings.
    - id: RS-4
      challenge: >-
        R-1 F2-over-S1 is scope of adjudication, not optional commentary.

  narrowest_supported_statement: >-
    On the Coordinator-committed BATCH-018 snapshot
    (33a1f6ae91e773e3ca0a4202d9bfc94afa466568), under explicit protocol
    deviations (point-sum + charged-units proxy; planted m-sums;
    smoothness_abort=false on R; relations_target=15 / short cell walls),
    the Executor recorded toy-tier wall-charged ratios R and R_null across
    54 cells with 32 cells point-estimate-labeled S1_eligible_on_null_axis,
    zero F2-eligible cells, F3_trigger_observation=true for HEUR-DS-1 at
    bits 16/20/24, and no assembled_E_proxy < 0.45. That package supports
    only deviation-qualified toy observations. It does not support crypto-
    scale ECDLP improvement, asymptotic promotion, HEUR-DS-1 validation,
    structure-gate clearance under a non-theater IDEA-011 control, S1_met,
    or any change to H-IC-001 / H-STR-002. All four asymptotic-claim
    promotion gates remain OPEN.

  recommended_disposition_constraint: >-
    Coordinator ledger (TASK-20260731-026): prefer inconclusive_partial or
    weaken H-DS-001 to the tested proxy/planted/short-wall scope with a
    single next control (CTRL-RT025-UNPLANTED). Forbid S1_met,
    reject_scoped-as-impossibility, asymptotic_claim supported, HEUR
    asymptotic support, and any edit to H-IC-001 / H-STR-002.
    reject_scoped on a single unreplicated empirical-only set is forbidden
    by the batch card when used to over-close — use weaken + replication
    when applicable. R-1 remains binding.

