  algebra_and_derivation_checks:
    - check: signed_y_antisymmetry
      status: PASS_CONDITIONAL
      detail: >-
        On an odd prime-order subgroup there is no nonidentity point with y=0,
        so the centered representative gives h(-R)=-h(R) modulo M, with h(O)=0.
        Coordinate conventions and the point at infinity still need frozen test
        fixtures.
    - check: affine_self_reduction
      status: PASS
      detail: >-
        With a nonzero a and uniform b, Q'=[a]Q+[b]P is uniform in G for every
        fixed target Q. Fresh a, b, lists, and roots can therefore define fresh
        restart trials, subject to measured dependence.
    - check: scalar_recovery
      status: PASS
      detail: >-
        Exact A+B=Q' gives r1+r2+r3+r4 = a*k+b modulo N, hence
        k=a^(-1)*(r1+r2+r3+r4-b) modulo N. Requiring [k]P=Q is the correct final
        acceptance condition.
    - check: selected_pair_sizes
      status: PASS_CONDITIONAL
      detail: >-
        Under regular M-way selector fibres, each L-by-L bucket join has expected
        size L^2/M=N^(1/3+o(1)) at L=M=N^(1/3), and the two selected lists expose
        N^(2/3+o(1)) candidate cross-pairs without enumerating every cross-pair.
        The actual join and lookup work is O(L) only if bucket and point-sum
        multiplicities obey the declared tail bounds.
    - check: raw_group_work_exponent
      status: PASS_CONDITIONAL
      detail: >-
        If one root costs N^(1/3+o(1)) and its Boolean success probability is
        N^(-1/3+gamma+o(1)), sequential restart work is
        N^(2/3-gamma+o(1)). The raw group-work crossover against rho is therefore
        gamma>1/6. The success-probability premise is not yet established by the
        proposal's match-count observable.
    - check: finite_parameter_table_arithmetic
      status: PASS_FOR_RAW_EXPONENTS_ONLY
      detail: >-
        The listed candidate time rows equal (2/3-gamma) times order_bits, and
        the rho, standard-BSGS, and memory-matched-BSGS raw exponents are
        arithmetically consistent. They are not a fully charged concrete-cost
        table and must not be presented as one.
    - check: gamma_ceiling
      status: INCOMPLETE
      detail: >-
        Gamma=1/3 is a valid exact-quotient calibration point and the runtime
        saturates at one root of N^(1/3+o(1)) work once gamma reaches 1/3. A
        pointwise information-theoretic ceiling does not follow from the current
        prose. The M-fold enrichment bound needs an explicit pooled-uniform-z
        counting argument, exact selector-denominator hypotheses, and a clear
        distinction between expected match enrichment, per-root enrichment, and
        the algorithmic time floor.

  proof_architecture_checks:
    baseline_fixture:
      status: REVISE
      finding: >-
        Gamma=0 reproduces the N^(2/3)-time, N^(1/3)-memory memory-limited BSGS
        exponents, but not an exact frozen baseline in common operation and
        full-cost units. The baseline map currently says identical up to
        polylogarithmic factors, which is weaker than the inventor protocol's
        exact-boundary requirement.
    strictness_witness:
      status: REVISE
      finding: >-
        Gamma>1/6 is a strict witness only for raw group-work time. A strict
        improvement under the program's mandatory full-cost baseline requires
        gamma>5/18. Both gates must be named and kept separate.
    observation_collision:
      status: PARTIAL_PASS
      finding: >-
        The signed-y, x-bucket, random-label, and exact-quotient comparison is
        well targeted, but match multiplicity and Boolean root success are
        observationally distinct and can collide. Both must be retained.
    interface_preservation:
      status: PARTIAL_PASS
      finding: >-
        The representation chain keeps actual points through both bucket joins
        and accepts only exact equality, so correctness does not rely on the
        bucket as an oracle. Losses in success probability, multiplicity, table
        lookup work, model selection, and full cost are not yet carried through
        every arrow.
    quantifier_fidelity:
      status: PASS_WITH_SCOPE_LIMIT
      finding: >-
        The proposal fixes the curve-family rule and h before randomness and
        limits toy negatives to the declared ladder. The finite-size stopping
        rule still needs an estimator whose intercept and within-curve
        dependence match the stated asymptotic quantifiers.
    method_ceiling_and_nearby_control:
      status: REVISE
      finding: >-
        Specify the synthetic group, divisor relation for M, exact quotient map,
        and intermediate planted-gamma construction. State whether the ceiling
        is an expectation over uniform roots or a per-root claim, and prove the
        corresponding bound. An exact quotient of size M does not exist in the
        prime-order treatment group and must remain a clearly separate composite
        or synthetic nearby object.

  findings:
    - id: F1-full-cost-gate
      severity: critical
      blocking: true
      category: fully_charged_cost_and_pareto
      observation: >-
        The proposal labels gamma>1/6 as the sub-rho decision gate while storing
        S=N^(1/3+o(1)) entries. Under KN-TECH-035, the common full-cost charge is
        processor work times S^(1/3). Therefore the candidate has
        FC=N^(2/3-gamma)*N^(1/9)=N^(7/9-gamma+o(1)), while fully charged rho with
        constant per-processor storage remains N^(1/2+o(1)).
      impact: >-
        The mandatory full-cost crossover is gamma>5/18, not gamma>1/6. At
        gamma=1/6 the candidate's full-cost exponent is 11/18, still above rho's
        1/2. The current concrete table, headline gate, honest prior, stopping
        rule, and Pareto interpretation all use only raw time and therefore do
        not answer the handoff's fully charged comparison.
      required_revision:
        - Separate raw group-work time, peak storage, and wiring-aware full cost.
        - State raw-time rho crossover gamma>1/6 and full-cost rho crossover gamma>5/18.
        - >-
          Include standard BSGS full cost N^(2/3), memory-matched BSGS full cost
          N^(7/9), and candidate full cost N^(7/9-gamma). The candidate beats
          standard BSGS in full cost only for gamma>1/9 and memory-matched BSGS
          by gamma in the exponent.
        - >-
          Regenerate a machine-readable table at standardized subgroup-order
          sizes, including at least 256, 384, and 512 bits, in matched group/field
          operation units and bytes, with raw time, full cost, memory, and
          parallelism shown separately.
        - >-
          Charge n parallel roots as n independent N^(1/3)-entry tables, and
          compare their total hardware, wall time, communication, and total work
          with van Oorschot-Wiener rho.

    - id: F2-matches-are-not-successes
      severity: critical
      blocking: true
      category: success_probability_and_runtime
      observation: >-
        HA-2 defines gamma using the expected number of exact selected
        cross-pair matches. The runtime proof then silently substitutes that
        expectation for Pr[root has at least one usable match]. HA-1 controls
        selector fibres and HA-3 controls restart independence; neither supplies
        a within-root second-moment or no-clustering bound.
      impact: >-
        Multiple representations of one point sum, duplicated scalars, or heavy
        selected point-sum atoms can raise matches/selected_cross_pairs without
        raising Boolean root success. In general Pr[X>=1] is at most E[X], not
        asymptotically equal to it. The claimed inverse-success-probability and
        total runtime do not follow.
      required_revision:
        - >-
          Add a named assumption or derivation controlling E[X*(X-1)] or an
          equivalent Paley-Zygmund/Poisson approximation for distinct matches.
        - >-
          Make Boolean root success and the count of distinct matching point
          sums primary observables beside multiplicity-weighted match count.
        - >-
          Derive expected runtime from the confidence bound on Pr[X>=1], not from
          the ratio-of-counts estimate alone.
        - >-
          Pre-register duplicate-scalar, duplicate-pair-sum, and maximum
          match-multiplicity invalidation thresholds.

    - id: F3-dependent-statistics-and-finite-size-exponent
      severity: critical
      blocking: true
      category: statistical_observables
      observation: >-
        Cross-pairs share left and right list elements, point sums, curves, and
        roots, so a binomial likelihood interval with every selected cross-pair
        as an independent trial is not justified. In addition, defining
        gamma_N=log(N*q_N)/log(N) absorbs every constant factor into a positive
        finite-size pseudo-exponent.
      impact: >-
        The proposed 95-percent bounds can be much too narrow, and a constant
        enrichment can masquerade as gamma_N>0 on the 18-to-27-bit ladder. Four
        curves per size do not cure pseudo-replication when cross-pairs, roots,
        and isomorphic models are treated as independent.
      required_revision:
        - >-
          Use roots as the minimum cluster unit and curves as the family-level
          inference unit; use a cluster bootstrap, hierarchical count model, or
          exact permutation/randomization distribution validated on the null.
        - >-
          Fit log(N*q_N)=c+gamma*log(N) with a free intercept and a preregistered
          finite-size term. Do not infer an asymptotic exponent from the largest
          two gamma_N point estimates alone.
        - >-
          Pre-register numbers of roots, isomorphic models, and curves per cell,
          pooling rules, zero-count handling, overdispersion diagnostics, and a
          power calculation for both gamma=0 and the decision threshold.
        - >-
          Require the same estimator and uncertainty procedure to recover the
          null and positive controls before treatment inference.

    - id: F4-controls-and-isomorphism-scope
      severity: major
      blocking: true
      category: controls_and_falsification
      observation: >-
        The control families are named but not fully constructed. Random
        relabeling must be a global, seeded, histogram- and negation-preserving
        function consistently applied to every occurrence of a point and Q'.
        The exact-quotient and intermediate planted-gamma controls lack a group,
        map, divisor condition, and exact expected finite-size output.
      impact: >-
        A failed synthetic control cannot be diagnosed, and a coordinate signal
        that varies under isomorphism is prematurely called an artifact. Because
        h is intentionally representation-dependent, isomorphism sensitivity
        narrows the claim and may introduce model-selection cost; it does not by
        itself prove the measurement false.
      required_revision:
        - Freeze executable mathematical definitions for every null and positive control.
        - >-
          Treat isomorphic models as a distribution: report persistence,
          heterogeneity, and the fraction of models crossing the gate. If a model
          is selected, specify a public selection rule and charge its search.
        - >-
          Distinguish apparatus invalidation from a representation-specific but
          potentially usable signal.

    - id: F5-budget-and-implementation-cost
      severity: major
      blocking: true
      category: budget_and_stopping
      observation: >-
        The maximum schedule has 16 curves and up to 2^15 roots per curve. At
        only the four 27-bit curves, four lists of L=512 points already require
        268,435,456 scalar-to-point evaluations before pair joins and controls.
        The proposal supplies no implementation path, throughput calibration,
        or staged power calculation tying that work to 7,200 seconds and 2 GB.
      impact: >-
        The maximum schedule may stop on the wall-clock cap before the
        decision-changing cells have the declared power. Resource exhaustion
        would then be infrastructure/inconclusive, not evidence about HA-2.
      required_revision:
        - >-
          Provide stage-by-stage group-addition, scalar-multiplication,
          hash/lookup, byte, and wall-clock forecasts for every arm and control.
        - >-
          State whether fixed-base tables, batch scalar multiplication, list
          reuse, or early stopping are allowed; charge each and preserve restart
          independence.
        - >-
          Replace "up to" with a power-derived root schedule and reserve budget
          for all blocking controls before treatment cells.

    - id: F6-novelty-coverage
      severity: moderate
      blocking: false
      category: novelty
      observation: >-
        No identical signed-y rooted four-list gamma construction was found in a
        snapshot-wide keyword and identifier scan. The closest conceptual
        predecessor is IDEA-20260808-24c61b, which names probabilistic
        non-homomorphic compatibility as an open escape, and
        IDEA-20260807-df906f, which explicitly leaves probabilistic propagation
        open. The current proposal is a concrete composition in that open lane,
        not evidence that the lane is externally novel.
      limitation: >-
        The BATCH-9c41dd audit covered 262 proposals and only proposal heads for
        most target-question entries. The frozen novelty screen accounts for 34
        audited RQ-ECDLP-002 entries, 21 later heads, and three newer oracle
        proposals, while the current declared directory contains 69
        RQ-ECDLP-002 proposals. External literature was not checked, and the
        three newer near-neighbour files postdate the frozen proposal snapshot.
      required_revision:
        - Keep novelty_status unverified.
        - >-
          Re-enumerate all current RQ-ECDLP-002 records, bind the exact paths and
          commits of every load-bearing near neighbour, and report coverage
          numerically without using absence as evidence.
        - >-
          Classify the mechanism as a concrete probabilistic-propagation
          composition unless an external prior-art review supports a stronger
          novelty label.

  cheapest_falsification_control:
    name: frozen-tuple antisymmetric-label null in Z/NZ
    priority: run_before_any_curve_ladder_if_a_coordinator_later_approves_a_revised_protocol
    construction: >-
      Use the identical frozen scalar lists, target scalar, and root schedule in
      the cyclic integer group Z/NZ, replace signed-y by a globally seeded
      balanced antisymmetric label map with h(-r)=-h(r), and run the identical
      selectors and estimators. Exact equality is checked by integer addition,
      so no elliptic-curve arithmetic or discrete-log work is needed. Preserve
      the treatment histogram when a treatment sample is available.
    exact_expectation: >-
      The null must recover gamma=0 within its preregistered finite-size
      randomization distribution, must show agreement between
      multiplicity-weighted matches and Boolean root success after the declared
      no-clustering checks, and must reproduce the declared full-cost baseline
      accounting. A nonzero scaling signal, anti-conservative interval, or
      match/success divergence invalidates the apparatus before any signed-y
      interpretation.
    why_cheapest: >-
      It exercises the complete selector, root, denominator, multiplicity,
      estimator, and cost-accounting pipeline using integer and hash operations
      only. It is cheaper than generating a single curve ladder and directly
      targets the two most dangerous false-positive routes.
    authorization_note: >-
      This is a recommended preregistered control, not an executed experiment and
      not an authorization to run one.

  scope_and_interpretation_checks:
    proposal_only_boundary: PASS
    no_positive_gamma_claimed: PASS
    no_crypto_scale_validation_claimed: PASS
    toy_negative_scoped_to_declared_ladder: PASS
    single_target_no_advice_scope: PASS
    exact_full_point_verification_required: PASS
    coordinate_representation_scope: REVISE
    affected_vs_safe_scope: >-
      At proposal stage, the only affected scope is the declared single-target,
      no-advice prime-order short-Weierstrass representation, conditional on a
      corrected gamma gate and all controls. No deployed curve or protocol is
      presently affected. Prime-order ECDLP, other coordinate maps, other curve
      families, multi-target settings, reusable preprocessing, and
      cryptographic-scale parameters remain outside any supported conclusion.

  required_revision_gate:
    - Correct the full-cost derivation, crossover, concrete table, Pareto rows, and parallelism.
    - Add a distinct-match/Boolean-root-success assumption, metric, and runtime derivation.
    - Replace cross-pair binomial inference with preregistered clustered or randomization inference.
    - Add an intercept-bearing scaling model and power-derived root schedule.
    - Fully specify the null, exact-quotient, planted-gamma, and isomorphic-model controls.
    - Prove or narrow the gamma ceiling and distinguish it from runtime saturation.
    - Bind a feasible staged budget in operations, bytes, and wall-clock time.
    - Re-run and numerically bind the current in-corpus novelty screen while retaining unverified status.
    - Obtain a new independent review of the revised frozen proposal before any Coordinator approval decision.

  limitations:
    - >-
      This review validates a proposal snapshot, not a completed run. There are
      no run IDs, raw samples, empirical gamma values, recovered scalars, or
      measured costs to validate.
    - >-
      External-literature novelty was not verified. The local scan supports only
      that no identical construction was found in the inspected repository
      corpus; it does not support an absence claim.
    - >-
      The wiring-aware exponent calculation applies the repository's declared
      KN-TECH-035 convention. A later concrete implementation must still provide
      stagewise constants, communication, entry widths, and technology assumptions.

