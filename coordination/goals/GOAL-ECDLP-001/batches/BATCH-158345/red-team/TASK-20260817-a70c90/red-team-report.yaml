  blocking:

    - id: RT-A70C90-B1
      title: BLOCK-5 propagated the tenth stream's COUNT but not its CUSTODY; the newly-REQUIRED KAT-PEAK-F is unsatisfiable under the spec's and the KAT file's own time-base contracts
      severity: blocking
      class: incomplete_repair_mandated_fix_not_effective
      attacks_claim:
        - batch.yaml required_successor_repairs BLOCK-5-B0-TERM-NOT-PROPAGATED required_fix
        - specification.yaml blocker_repairs.SYSTEM-PEAK-LIVE-CONCURRENCY.BLOCK_5_B0_PROPAGATION_REPAIR.remedy ("B_0(t) is now present in the frozen rule of every rule site")
        - design-repair-report.yaml item_by_item[BLOCK-5].what_this_successor_does ("propagated to ALL FOUR rule sites")
        - verification-and-null-kats.yaml aggregate_kat_summary.required_by_this_successor (KAT-PEAK-F moved into the required set)
      what_the_successor_did_right: >-
        The B_0 term IS present in all four operative formulas
        (specification.yaml line 1082; verification-and-null-kats.yaml line 111;
        physical-frontier-compiler.yaml line 262; custody-and-executable-
        contract.yaml line 205), the dedup terms DO count ten, and the census IS
        ten at all nine predecessor sites. That much is confirmed.
      exact_residual: >-
        The tenth stream was added to the RULE and to the COUNT but not to the
        EVENT-SOURCE CONTRACT that makes the census computable, at two of the
        four rule sites, and BOTH of those two are the authoritative ones for an
        implementer.
        (i) specification.yaml lines 1117-1121,
        blocker_repairs.SYSTEM-PEAK-LIVE-CONCURRENCY.synchronized_time_base.clock,
        is carried forward from the predecessor UNCHANGED and still reads "one
        host monotonic clock (CLOCK_MONOTONIC_RAW), single source for every
        allocate and free event of the shared/setup context and of all eight
        shards" -- nine streams. The setup-private stream B_0 is not on the
        clock.
        (ii) specification.yaml lines 1129-1131, the same block's
        multi_host_rule, still reads "all eight shards and the shared context
        must execute on one host under one clock; a cross-host census
        invalidates" -- so the setup-private stream may lawfully run on another
        host without invalidating.
        (iii) verification-and-null-kats.yaml lines 123-126, time_base, still
        reads "one host monotonic clock; every allocate and free event of the
        shared context and of all eight shards is stamped on that single
        timeline; the aggregate is evaluated at every event timestamp in the
        merged event set" -- nine streams, in the same file whose
        census_streams_required is 10 (line 376) and whose missing_stream is
        `invalidates` (line 377).
        The two sites that WERE fixed prove this is an omission and not a
        convention: physical-frontier-compiler.yaml line 276 was rewritten to
        "single source for all TEN streams", and custody-and-executable-
        contract.yaml lines 220-225 were rewritten to a stream_list naming the
        setup-private stream and a receipt_requirement demanding it "on one host
        monotonic clock", with missing_setup_private_stream: invalidates. The
        merged-lane block in the spec (line 1640) likewise already says "all
        eight shards and the setup process co-located on a single host". Three
        sites say ten streams on one clock; the primary-base spec block and the
        KAT file say nine.
      why_this_is_blocking_and_not_cosmetic: >-
        BLOCK-5's own stated purpose was to stop a corrected formula from
        co-existing with pre-repair operative text, and to make KAT-PEAK-F
        MANDATORY. Both goals fail together here, because the exactness argument
        the census rests on is stated over the merged event set, and B_0's
        events are not in it.
      falsification_route:
        - step: 1
          action: >-
            Read verification-and-null-kats.yaml at 3d9e8eb18, lines 123-126
            (time_base) and lines 320-346 (KAT-PEAK-F).
        - step: 2
          action: >-
            Take KAT-PEAK-F's own event list literally: "the setup process
            allocates 4096 private (non-shared, non-shard) bytes at t=1.0 and
            frees them at t=2.0" and "the shared context and all eight shards
            are idle throughout".
        - step: 3
          action: >-
            Apply the file's own time_base: the single timeline carries "every
            allocate and free event of the shared context and of all eight
            shards". With shared and all eight shards idle, that merged event
            set is EMPTY.
        - step: 4
          action: >-
            Apply the file's own evaluation rule: "the aggregate is evaluated at
            every event timestamp in the merged event set". There is no
            timestamp. A conforming implementation returns 0 (or is undefined)
            where pass_condition (line 338) demands "census returns exactly
            4096".
        - step: 5
          action: >-
            Confirm the same construction against specification.yaml lines
            1117-1131 and observe the identical result at the primary-base rule
            site, whose disposition is REPAIRED (line 1080).
        - expected_result_if_objection_is_wrong: >-
            Either of the two files states somewhere that B_0's allocate/free
            events are stamped on the shared monotonic timeline. Grep for
            "setup" within twenty lines of "time_base" in either file returns
            nothing of the kind; the words "and of all eight shards" are the
            complete enumeration in both.
      minimal_repair_that_would_close_it: >-
        Three string edits in a successor record, changing no number: rewrite
        specification.yaml synchronized_time_base.clock and multi_host_rule, and
        verification-and-null-kats.yaml time_base, to the wording already used
        at physical-frontier-compiler.yaml line 276 and custody-and-executable-
        contract.yaml lines 220-225 (ten streams, setup-private stream named,
        co-located on one host). This is a NON-NUMERIC edit; it does not touch
        any KAT value, any residual, or any disposition.
      changes_any_ecdlp_claim: false
      changes_any_numeric_row: false

    - id: RT-A70C90-B2
      title: CTRL-5 records a WRONG SHA-256 for the successor specification, contradicting its own second copy of the same digest
      severity: blocking
      class: false_mechanized_verification_output
      attacks_claim:
        - ctrl5-overlay-completeness.yaml digests.specification_files (line 467)
        - ctrl5-overlay-completeness.yaml method.procedure ("SHA-256 digests ... computed with shasum -a 256")
        - design-repair-report.yaml actions_not_taken.digest_computed / digest_computed_note
        - specification.yaml falsification_criterion, which names "fabricated digest" as invalidating the contract
      exact_residual: >-
        ctrl5-overlay-completeness.yaml line 467 asserts
        `successor_experiments_EXP-SYC-95ff77_specification_yaml:
        b34bb9873bd80f0aab35906507d0640572c5d9129e859989c339187b522bb553`.
        The frozen file's actual SHA-256 at 3d9e8eb18 is
        786ca5f06d0c1d27e055c79be0c2437e8ae58e169b5a673330ac0082cb0fa3c1.
        The SAME artifact records the correct value 786ca5f0... twenty rows
        later in this_tasks_declared_artifacts (line 469-470), so the file
        publishes two different SHA-256 values for one path and one of them is
        false. The snapshot task's own receipt
        (coordination/goals/GOAL-ECDLP-001/batches/BATCH-158345/archives/
        TASK-20260817-0160e0/snapshot-receipt.json) independently records
        786ca5f0..., so the wrong value stands alone against the file, the
        producer's own second copy, and the archive.
      corroborating_detail: >-
        The predecessor digest on the adjacent line 466
        (43b375f7e564ddd204023f1bf5f1eec5d64a1208244864496855b2e7a7b571da)
        recomputes CORRECTLY against EXP-SYC-dc854f/specification.yaml, and that
        file is byte-identical at 0a13d39f34, 20f628d35a and 3d9e8eb184 (checked
        at all three), so the method was sound and only the successor row is
        wrong. The most economical explanation is that
        digests.specification_files was computed against a draft of the
        specification and never regenerated -- which is also the explanation
        RT-A70C90-B3 requires independently.
      falsification_route:
        - 'git show 3d9e8eb18:experiments/EXP-SYC-95ff77/specification.yaml | shasum -a 256'
        - 'compare with ctrl5-overlay-completeness.yaml line 467 (b34bb987...) and line 470 (786ca5f0...)'
        - 'expected_result_if_objection_is_wrong: the recomputed digest equals b34bb987.... It does not; it equals 786ca5f0..., matching line 470 and the snapshot receipt.'
      why_blocking: >-
        This batch exists because a package's account of itself was false while
        its content was right. specification.yaml's own falsification_criterion
        lists "fabricated digest" as invalidating the contract, and the digest is
        published in the artifact whose entire purpose is mechanized
        verification. A reviewer who trusted line 467 and recomputed would
        conclude the frozen specification had been altered after snapshot.
      changes_any_ecdlp_claim: false
      changes_any_numeric_row: false

    - id: RT-A70C90-B3
      title: CTRL-5's changed_paths old/new values are hand-authored summaries, not parser output; two rows doctor quotations of the immutable predecessor and one records a `new` value absent from the frozen specification
      severity: blocking
      class: unsupportable_method_claim_and_misquotation_of_an_immutable_record
      attacks_claim:
        - ctrl5-overlay-completeness.yaml method.procedure ("Both specification files are parsed to YAML, flattened to leaf paths ... and diffed into added / removed / changed sets")
        - ctrl5-overlay-completeness.yaml overlay_coverage.every_diff_maps_to_a_declared_overlay = true, unmapped_diffs = none
        - ctrl5-overlay-completeness.yaml verdict = PASS
        - specification.yaml overlays_in_this_successor[BLOCK-3] description, which points at ctrl5-overlay-completeness.yaml as the record of "the field list and result"
      what_this_red_team_confirmed_first: >-
        The DIFF ITSELF is genuine. An independent reimplementation of the
        described procedure (recursive flatten, lists indexed positionally)
        reproduces CTRL-5's numbers EXACTLY: 811 predecessor leaves, 920
        successor leaves, 115 added, 6 removed, 60 changed, and the removed and
        changed PATH SETS match element for element. The objection is not that
        the diff was faked; it is that the old/new VALUES attached to the rows
        were not produced by that parser.
      exact_residual: >-
        Ten of the sixty changed_paths rows carry an old or new value that does
        not appear, in order and allowing for the row's own "..." elisions, in
        the file it is attributed to. Three are material:
        (a) MISQUOTES THE IMMUTABLE PREDECESSOR SO AS TO OVERSTATE A REPAIR.
        Row `prominent_ha2_limitation_statement` (line 370) gives `old` as
        "...VACUOUS at every ladder size and at both gamma_x slices, and it
        remains vacuous under HA-3's second-moment shape...". The actual
        EXP-SYC-dc854f value reads "...VACUOUS at every ladder size and at both
        gamma_x slices (the familywise bound ranges from 938.297567 to
        1489.454545 at gamma_x=5/18 and is 2978.909091 at gamma_x=1/3, all far
        above 1), and it remains vacuous...". The numeric parenthetical is
        deleted from the quoted `old` with NO ellipsis and reappears in `new`,
        so the row presents an INHERITED numeric passage as an addition made by
        this successor under the NON-BLOCKING-CARRY overlay. (The three numbers
        are correct in both records -- 938.297567, 1489.454545, 2978.909091 all
        re-derive exactly -- so nothing numeric is wrong; the attribution is.)
        (b) MISQUOTES THE IMMUTABLE PREDECESSOR SO AS TO HIDE THE DEFECT BEING
        REPAIRED. Row `success_criterion` (line 381) gives `old` as "...that V4
        is answered by ID (all twelve enumerated items present verbatim,
        matching experiments/EXP-SYC-793304/specification.yaml byte-for-byte),
        ...". The actual predecessor value reads "...byte-for-byte, VERIFIED BY
        A FULL RECURSIVE PARSED-YAML STRUCTURAL DIFF OF THE HA2 BLOCK), ...".
        The deleted clause is precisely the unsupportable method claim that
        BLOCK-3 exists to remove, and the successor DOES remove it (confirmed:
        the string "full recursive parsed-YAML structural diff" appears nowhere
        in EXP-SYC-95ff77). CTRL-5's own row therefore renders the BLOCK-3
        repair invisible, and compounds it by labelling the row overlay
        NON-BLOCKING-CARRY when specification.yaml's own
        overlays_in_this_successor lists success_criterion under
        BLOCK-3-VERIFICATION-METHOD-CONTRADICTION.
        (c) RECORDS A `new` VALUE THAT DOES NOT EXIST IN THE FROZEN SPEC. Row
        `runtime_provenance.mismatch_disposition` (line 374) gives `new` ending
        "...and defers to this batch's ledger-archive task (TASK-20260817-3566f6)
        to decide whether any prior amendment's acceptance extends to this
        batch's own review and archive sessions." The frozen specification's
        actual value ends "...and the independent reviewers
        (TASK-20260817-d50c44, TASK-20260817-a70c90) determine its disposition."
        These are different sentences assigning the disposition to different
        tasks, in a BLOCK-1 provenance field. The quoted text matches
        runtime-session-receipt.json, not specification.yaml -- further evidence
        that CTRL-5 was written against a draft and not regenerated, which is the
        same conclusion RT-A70C90-B2 forces from the digest.
        The remaining seven are quotation hygiene rather than substance:
        `blocker_repairs.HA2-EXPECTATION-NOT-TAIL.repair_summary` (old inserts an
        "and" not in the source), `inherited_bindings...disclaimer` (new
        paraphrases the source clause),
        `items_A_through_D_repairs.C-PEAK-KAT-PARTIAL-OVERLAP-COVERAGE-GAP.non_blocking_overclaim_sub_note`
        (new drops words mid-fragment without an ellipsis),
        `runtime_provenance.conflation_forbidden_note` old AND new (the old's tail
        "continuing the practice established in every prior task of this chain
        since that correction" is not in the predecessor at all -- the
        predecessor reads "continuing the practice established in EXP-SYC-edf98d's
        and this batch's own opening_session_provenance"), `design_verdict` and
        `title` (both silently normalize away the fold-injected spaces that are
        genuinely present in the stored values; see RT-A70C90-N5).
      falsification_route:
        - step: 1
          action: >-
            Reimplement CTRL-5's stated procedure: yaml.safe_load both
            specification files, recursively flatten to leaf paths with lists
            indexed positionally, and take the added/removed/changed sets.
            Confirm 811/920/115/6/60 and set-equality with CTRL-5's declared
            paths. (This red team did; they match.)
        - step: 2
          action: >-
            For each of the sixty changed rows, split the declared `old`/`new`
            on "..." and require every remaining fragment to occur, in order, in
            the whitespace-normalized predecessor/successor value at that path.
        - step: 3
          action: >-
            Ten rows fail. Inspect the three named above by hand against
            `git show 3d9e8eb18:experiments/EXP-SYC-dc854f/specification.yaml`
            and `...EXP-SYC-95ff77/specification.yaml`.
        - expected_result_if_objection_is_wrong: >-
            All sixty rows' fragments are found. They are not: the two
            predecessor-side deletions in (a) and (b) carry no ellipsis marker
            and change the apparent direction of the diff in OPPOSITE ways --
            one inflates a non-blocking carry, one conceals a blocking repair --
            which is exactly what a hand-written summary produces and a parser
            cannot.
      why_blocking: >-
        BLOCK-3 was ruled blocking on the principle that "the OUTCOME does not
        depend on resolving this ... Only the unsupported method claim must not
        survive." The identical principle applies with more force here: the
        successor's answer to BLOCK-3 is "a parser WAS invoked and the field
        list and result are recorded in ctrl5-overlay-completeness.yaml", and
        the recorded result is partly not the parser's. Separately, (a), (b) and
        the conflation_forbidden_note `old` attribute to an IMMUTABLE record
        words it does not contain, which AGENTS.md rule 5 forbids and which
        specification.yaml's own falsification_criterion names as invalidating.
      changes_any_ecdlp_claim: false
      changes_any_numeric_row: false

    - id: RT-A70C90-B4
      title: two of five values in the successor's NEW gamma_x = 3/10 m = 98304 tabulation are wrong in the last stated digit, under an explicit claim that they were independently recomputed with no mismatch found
      severity: blocking
      class: numeric_error_plus_falsified_verification_claim
      attacks_claim:
        - specification.yaml line 1468, C-HA2-4 evaluated_gamma_x_3_over_10_RT_82A8CB_OBJ8.m_98304_variant
        - specification.yaml line 1459, RT_OBJ_8_NOTE ("independently recomputed by this producer (exact rational arithmetic); no mismatch was found")
        - batch.yaml objective and parent_note, "NOT ONE NUMBER NEEDS TO CHANGE"
        - batch.yaml NON-BLOCKING-CARRY no_numeric_or_disposition_change ("additions that make the record more complete")
      exact_residual: >-
        specification.yaml line 1468 states:
        m_98304_variant: '3x larger at every size (1965.347055, 1833.733644,
        1710.933986, 1596.357856, 1489.454545); likewise vacuous'.
        The closed form the same sub-block declares is
        min(1, 98304 * 2^(bits*(3/10 - 1/3)) / 33) = min(1, 98304 * 2^(-bits/30) / 33)
        over bits 18, 21, 24, 27, 30. Evaluated at 50 decimal digits and
        cross-checked in IEEE double:
          bits=18  1965.3470554639181...  -> 1965.347055  RECORD 1965.347055  OK
          bits=21  1833.7336425675553...  -> 1833.733643  RECORD 1833.733644  WRONG
          bits=24  1710.9339862064928...  -> 1710.933986  RECORD 1710.933986  OK
          bits=27  1596.3578554722388...  -> 1596.357855  RECORD 1596.357856  WRONG
          bits=30  1489.4545454545454...  -> 1489.454545  RECORD 1489.454545  OK
        Two of five rows are off by 1 in the sixth decimal place. The
        companion m = 32768 rows on lines 1462-1467 (655.115685, 611.244548,
        570.311329, 532.119285, 496.484848) are ALL CORRECT, so the error is
        confined to the "3x larger" variant and is consistent with tripling
        already-rounded intermediates rather than recomputing.
      what_is_NOT_wrong: >-
        The conclusion is untouched. Every value in both rows is three orders of
        magnitude above 1, so clipped_bound is 1 at every size and
        "UNIFORMLY VACUOUS at every ladder size under both counts" stands. The
        relative error is about 6e-10. No disposition, bound, residual or
        preserved closure moves. This red team also re-derived and CONFIRMED
        every OTHER number in the same neighbourhood: the gamma_x = 0/1 rows
        (512/33, 256/33, 128/33, 64/33, 32/33), 32/33 = 0.9696969697,
        p = (2^-10)/33 = 1/33792 = 2.959280e-05, 1/32768 = 3.051758e-05, the
        crossing_by_bits_m_32768 vector [-0.21975588, -0.14074314, -0.08148358,
        -0.03539281, 0.00147980], crossing_at_bits_30_m_98304 = -0.05135228,
        the non-vacuity thresholds 33/32768 = 0.001007080078125 and
        11/32768 = 0.000335693359375, bits >= 179.2009 and 207.7302, and
        938.297567 / 1489.454545 / 2978.909091 in the prominent limitation
        statement. All correct.
      falsification_route:
        - 'python3: from decimal import Decimal, getcontext; getcontext().prec=50; ln2=Decimal(2).ln(); [Decimal(98304)*((Decimal(b)*(Decimal(3)/10-Decimal(1)/3))*ln2).exp()/Decimal(33) for b in (18,21,24,27,30)]'
        - 'cross-check in IEEE double: [98304*2**(-b/30)/33 for b in (18,21,24,27,30)]'
        - 'both methods agree to 12+ significant figures and both disagree with the record at bits=21 and bits=27'
        - 'expected_result_if_objection_is_wrong: the record''s five values round-trip. Three do; two do not.'
      why_blocking: >-
        Not because of the magnitude -- it is negligible -- but because the same
        sub-block asserts "independently recomputed by this producer (exact
        rational arithmetic); no mismatch was found", and the values themselves
        falsify that assertion. This is the BLOCK-3 pattern applied to
        arithmetic: a verification claim the record's own content contradicts.
        It also makes the batch's headline "NOT ONE NUMBER NEEDS TO CHANGE"
        literally false for the successor as frozen -- two digits do.
      minimal_repair_that_would_close_it: >-
        Correct 1833.733644 -> 1833.733643 and 1596.357856 -> 1596.357855 in a
        successor record, and restate the method claim per RT-A70C90-M2.
      changes_any_ecdlp_claim: false
      changes_any_disposition: false

  # ===========================================================================
  # MAJOR
  # ===========================================================================
  major:

    - id: RT-A70C90-M1
      title: CTRL-5 compares one of the six comparable artifacts; the four carried-forward YAML artifacts contain 544 further differences that are never diffed and never mapped, and three of the six BLOCK defects lived in a file CTRL-5 cannot see
      severity: major
      class: control_under_scoped_relative_to_the_defect_population_it_targets
      attacks_claim:
        - batch.yaml ctrl5_first ("whole-file overlay-completeness diff: every difference from the predecessor (EXP-SYC-dc854f) must map to an overlays_in_this_successor entry ... would have caught five of the six blocking findings before dispatch")
        - ctrl5-overlay-completeness.yaml overlay_coverage.unmapped_diffs = none
        - ctrl5-overlay-completeness.yaml verdict = PASS
      exact_residual: >-
        ctrl5-overlay-completeness.yaml method.files_compared names exactly two
        files: experiments/EXP-SYC-dc854f/specification.yaml and
        experiments/EXP-SYC-95ff77/specification.yaml. The predecessor package
        was SIX artifacts and the successor is SEVEN; the other five successor
        artifacts are never compared to their predecessor counterparts under
        TASK-20260815-9b3cb3. strict_parse does list all seven, but that is a
        parse check, not a diff.
        Applying CTRL-5's own stated procedure to the four carried-forward YAML
        artifacts (this red team ran it):
          design-repair-report.yaml         343 -> 472 leaves; +205 / -76 / ~86
          verification-and-null-kats.yaml   523 -> 533 leaves; +11  / -1  / ~39
          custody-and-executable-contract   231 -> 257 leaves; +26  / -0  / ~37
          physical-frontier-compiler.yaml   374 -> 399 leaves; +28  / -3  / ~32
          TOTAL                                              +270 / -80 / ~194 = 544
        So "every one of the 181 diffs ... maps to a declared overlay; no diff
        is unmapped" describes 181 of roughly 725 package-level differences,
        about 25%.
        The scope gap lands exactly where the batch's own findings were:
        BLOCK-2 (found_by attribution), BLOCK-4 (the twelve-path list) and
        BLOCK-6 (KAT-PEAK-F 1 byte vs 4096) were ALL defects of
        design-repair-report.yaml, and CTRL-5 does not diff that file. CTRL-5's
        overlay_coverage.note concedes half of this itself -- "BLOCK-2 ... and
        BLOCK-6 ... produce no specification.yaml diffs: both are report-only
        repairs" -- and then returns PASS anyway. The batch's justification for
        running CTRL-5 first ("would have caught five of the six blocking
        findings") is therefore not supported by the CTRL-5 that was actually
        run: as scoped it could have caught at most three.
      corroborating_detail: >-
        A concrete unmapped removal the spec-only diff cannot see:
        physical_frontier_compiler.inherited_compiler.overlays_in_this_successor
        drops from eight entries to five, collapsing the individually described
        RT-OBJ-F, VAL-A723AF-R1 and VAL-A723AF-R3 overlay rows into one summary
        line. The items survive by name, but three per-item descriptions are
        gone with no overlay entry accounting for the removal.
      falsification_route:
        - 'read ctrl5-overlay-completeness.yaml method.files_compared (two paths only)'
        - 'run the same flatten-and-diff over git show 3d9e8eb18:coordination/.../BATCH-7d9b78/tasks/TASK-20260815-9b3cb3/<f>.yaml vs .../BATCH-158345/tasks/TASK-20260817-9d7d09/<f>.yaml for the four carried YAML artifacts'
        - 'count the resulting added/removed/changed leaf paths and look for any of them in CTRL-5''s three lists'
        - 'expected_result_if_objection_is_wrong: CTRL-5''s lists contain paths from those files. They contain none; every declared path is rooted in the `experiment` document.'
      why_major_not_blocking: >-
        CTRL-5 discloses its own file scope honestly in method.files_compared,
        so this is an under-scoped control rather than a false statement. It is
        major because the completeness verdict is stated without that
        qualification and because the batch's stated reason for ordering CTRL-5
        first does not survive it.

    - id: RT-A70C90-M2
      title: '"exact rational arithmetic" is impossible for the values it is claimed over'
      severity: major
      class: unsupportable_method_claim
      attacks_claim:
        - specification.yaml line 1459 (gamma_x = 3/10 sub-block) "independently recomputed by this producer (exact rational arithmetic); no mismatch was found"
        - specification.yaml line 1423 (gamma_x = 0/1 sub-block) "Every value was independently recomputed by this producer (exact rational arithmetic)"
      exact_residual: >-
        For the gamma_x = 3/10 tabulation the quantity is
        98304 * 2^(-bits/30) / 33 (and 32768 * 2^(-bits/30) / 33) over
        bits = 18, 21, 24, 27, 30. 2^(-bits/30) is rational only when 30 | bits,
        i.e. only at bits = 30. Four of the five rows in EACH of the two
        gamma_x = 3/10 row sets are irrational and cannot be computed in exact
        rational arithmetic at all; they can only be evaluated to a stated
        precision. The same objection applies to crossing_by_bits_m_32768 and
        crossing_at_bits_30_m_98304, which contain log2 33 and log2 98304.
        The claim IS defensible where it was first made: the gamma_x = 0/1
        sub-block evaluates 32768 * 2^(-bits/3) / 33 at bits = 18..30, all of
        which are exact rationals (512/33, 256/33, 128/33, 64/33, 32/33). The
        method sentence was carried into the new 3/10 sub-block where it does
        not hold.
      relationship_to_RT_A70C90_B4: >-
        These are one defect seen twice. A genuine exact computation could not
        have produced 1833.733644 or 1596.357856; a rounded-intermediate
        computation can, and did.
      falsification_route:
        - 'observe that 2^(-21/30) = 2^(-0.7) is irrational (30 does not divide 21)'
        - 'therefore no rational representation of 98304*2^(-21/30)/33 exists and no exact rational arithmetic can produce a decimal for it'
        - 'expected_result_if_objection_is_wrong: the sub-block states a rational closed form for these rows. It does not; it states min(1, 32768 * 2^(-bits/30) / 33).'
      minimal_repair: >-
        Restate as "evaluated to twelve significant figures with 50-digit
        decimal arithmetic" (or whatever was actually used) in the 3/10
        sub-block, leaving the gamma_x = 0/1 sub-block's exact-rational claim
        intact, where it is true.

    - id: RT-A70C90-M3
      title: 'BLOCK-5''s no_numeric_or_disposition_change is an over-claim in one respect: the rule of record now returns a strictly larger value against an UNCHANGED 2 GB ceiling'
      severity: major
      class: omitted_end_to_end_cost
      attacks_claim:
        - batch.yaml BLOCK-5 no_numeric_or_disposition_change ("changes no numeric result, bound, or disposition")
        - design-repair-report.yaml item_by_item[BLOCK-5].no_numeric_or_disposition_change = true
        - specification.yaml budget.maximum_memory_gb = 2 (unchanged), hard_cap_increase_authorized = false
      exact_residual: >-
        The primary-base frozen rule changed from
        max_t( shared(t) + sum_j concurrent_nonshared_shard_j(t) - dedup(t) ) to
        max_t( B_0(t) + shared(t) + sum_j concurrent_nonshared_shard_j(t) - dedup(t) ).
        B_0(t) >= 0 by construction and the dedup term is bounded by
        sum_j nonshared_j(t) independently of B_0, so for every schedule the new
        rule returns a value greater than or equal to the old one, strictly
        greater whenever max_t B_0(t) > 0. The rule DEFINES the quantity that
        must fit under budget.maximum_memory_gb = 2, and that ceiling did not
        move. The headroom the record implicitly relies on is therefore reduced
        by max_t B_0(t), a quantity the record declares exists (KAT-PEAK-F
        exercises it at 4096 bytes) and never bounds. The record's own
        retained_bracket upper limit was already widened to
        'sum_j max_t P_j(t) + max_t S_solo(t) + max_t B_0(t)'.
        Saying "no numeric result, bound, or disposition" changes is true of
        every STATED numeric value and false of the BOUND the rule defines.
      what_the_successor_does_say: >-
        The successor is not concealing this. PEAK-AGGREGATE-FIT-UNPROVED is
        carried forward open in all four files, its statement was correctly
        updated from "nine concurrently live streams" to "TEN", and it states
        explicitly "BLOCK-5 propagates B_0 to this block's rule and census but
        does not close it", cap_raised: false. The objection is to the
        `no_numeric_or_disposition_change: true` LABEL, not to the disclosure.
      falsification_route:
        - 'compare specification.yaml line 1101 (pre_repair_rule_quoted) with line 1082 (frozen_rule); the difference is the addition of a non-negative term'
        - 'confirm budget.maximum_memory_gb is 2 in both EXP-SYC-dc854f and EXP-SYC-95ff77 and that hard_cap_increase_authorized is false'
        - 'evaluate both rules on KAT-PEAK-F: old returns 0, new returns 4096 -- the record states this itself at specification.yaml lines 1779-1780'
        - 'expected_result_if_objection_is_wrong: the record bounds max_t B_0(t) somewhere, so the strictly larger rule still provably fits. It does not; no byte figure for B_0 exists anywhere in the chain.'
      minimal_repair: >-
        Relabel BLOCK-5 as "changes no STATED numeric value; strictly increases
        the quantity the unchanged 2 GB ceiling bounds, by an undeclared
        max_t B_0(t), which is why PEAK-AGGREGATE-FIT-UNPROVED remains open."
        No number changes.

    - id: RT-A70C90-M4
      title: the batch activation gate requiring origin/main to be fetched and MERGED before the first archive, with the merge outcome recorded in the archive receipt, is unmet
      severity: major
      class: activation_gate_not_satisfied
      attacks_claim:
        - batch.yaml activation_gates ("origin/main is fetched and MERGED (never rebased) into the working branch before the first archive, with the base commit and merge outcome recorded in the archive receipt")
        - CLAUDE.md Conventions ("At the start of an active session, before an archival commit, and before requesting review or merge, fetch origin/main and compare it with every open research branch ... Record the base commit checked and the merge outcome in the task receipt")
        - specification.yaml authority.git_state.note ("The base-commit/merge record is determined and recorded by the isolated snapshot task TASK-20260817-0160e0")
      exact_residual: >-
        The producer itself records local_main_behind_origin_main: true and
        origin_main_head_at_authoring_time:
        20f628d35a816e890b4f4ed9cf5890193af11d85. That commit is NOT an ancestor
        of the frozen snapshot 3d9e8eb18 (git merge-base --is-ancestor returns
        false), so origin/main was never merged in. The snapshot receipt records
        only base_commit_checked: e706e6a01... "(BATCH-158345 opening commit, on
        branch claude/ecdlp-001-batch158345-20260817, branched from origin/main
        24225684a)" and states NO merge outcome at all. origin/main is presently
        20 commits ahead of the snapshot (git rev-list --count
        3d9e8eb18..origin/main). The producer discharged its part honestly by
        disclosing the divergence and deferring; the gate was then not
        discharged by the task it was deferred to.
      material_impact_assessed_and_bounded: >-
        This red team checked whether the divergence could have changed what the
        producer read. It could not: EXP-SYC-dc854f/specification.yaml and
        EXP-SYC-793304/specification.yaml are byte-identical at 0a13d39f34
        (producer HEAD), 20f628d35a (origin/main at authoring) and 3d9e8eb184
        (the snapshot). The defect is procedural and forward-looking -- a merge
        conflict or a contract change on main is undetected -- not a corruption
        of the frozen bytes.
      falsification_route:
        - 'git merge-base --is-ancestor 20f628d35a816e890b4f4ed9cf5890193af11d85 3d9e8eb18  (returns non-zero)'
        - 'grep the snapshot receipt for a merge outcome field (absent; only base_commit_checked)'
        - 'git rev-list --count 3d9e8eb18..origin/main  (20)'
        - 'expected_result_if_objection_is_wrong: 20f628d is reachable from 3d9e8eb18 or the receipt records a merge. Neither holds.'

  # ===========================================================================
  # MODERATE
  # ===========================================================================
  moderate:

    - id: RT-A70C90-D1
      title: the BLOCK-1 repair edit introduced a NEW YAML mis-parse; metrics.primary[0] was a string in the predecessor and is a single-key mapping in the successor
      severity: moderate
      class: structural_regression_introduced_by_this_successor
      exact_residual: >-
        specification.yaml line 1979 reads
        `- gap-free binding of requested policy, self-reported resolved model,
        and the authoring session (BLOCK-1 repaired: re-authored for the actual
        session)`. The unquoted ": " inside the appended parenthetical makes
        YAML parse the list item as a MAPPING:
        {"gap-free binding ... (BLOCK-1 repaired": "re-authored for the actual
        session)"}. In EXP-SYC-dc854f the same item was a plain string. The
        annotation added by the BLOCK-1 repair is therefore machine-unreadable
        and the key is truncated mid-phrase. Sibling items on lines 1981 and
        1983-1989 ARE quoted, so this is an inconsistency, not a house style.
        (Two other list items, at lines 1980 and 1982, mis-parse the same way but
        are INHERITED from the predecessor and are not this successor's doing.)
      why_ctrl5_did_not_catch_it: >-
        CTRL-5's strict_parse tests single-document-ness and duplicate keys, not
        node type stability, and it PASSES here (independently confirmed: all
        seven artifacts load under a duplicate-key-rejecting SafeLoader as one
        document each). More tellingly, CTRL-5's added_paths row (line 174) is
        written as the hand-made label
        'metrics.primary[0] (new; replaces removed old metrics.primary[0])'
        where the procedure it declares would emit the real leaf path
        'metrics.primary[0].gap-free binding of requested policy, self-reported
        resolved model, and the authoring session (BLOCK-1 repaired'. That is
        the single row where this red team's independent reimplementation
        disagreed with CTRL-5's added_paths list, and the disagreement is
        exactly the corruption. It is also a fourth instance of RT-A70C90-B3.
      falsification_route:
        - 'python3 -c "import yaml;d=yaml.safe_load(open(f))[''experiment''];print([type(x).__name__ for x in d[''metrics''][''primary'']])" on both specs'
        - 'predecessor gives str at index 0; successor gives dict at index 0'
        - 'expected_result_if_objection_is_wrong: both are str. They are not.'
      minimal_repair: 'quote line 1979 as lines 1981 and 1983-1989 already are.'

    - id: RT-A70C90-D2
      title: CTRL-5's should_differ set is under-specified against the batch mandate; the branch-naming field did NOT differ and is unchecked, and the reviewer-naming field is unchecked
      severity: moderate
      class: control_coverage_gap
      attacks_claim:
        - batch.yaml ctrl5_first ("every field that SHOULD have differed because it names this task, this batch, this session, this branch, this archive task, or the reviewers must actually differ")
        - ctrl5-overlay-completeness.yaml should_differ.all_differ = true
      what_holds: >-
        All 23 fields CTRL-5 lists were independently re-checked here and all 23
        genuinely differ between EXP-SYC-dc854f and EXP-SYC-95ff77. The
        should_differ PASS is not false.
      exact_residual: >-
        The mandate names six categories; the list covers four. No field naming
        THIS BRANCH is checked, and the one field that names a branch --
        authority.git_state.git_ref_read_from_dot_git_head -- did NOT differ in
        content class and is absent from the list: the predecessor recorded
        refs/heads/claude/launch-the-barnes-5316qt and the successor records
        refs/heads/main, neither of which is this batch's branch
        claude/ecdlp-001-batch158345-20260817 on which the artifacts were
        archived. No field naming THE REVIEWERS is checked either;
        authority.reviewed_by_tasks does in fact differ
        (['TASK-20260815-839dc8','TASK-20260815-fbd43e'] ->
        ['TASK-20260817-d50c44','TASK-20260817-a70c90']) but was not put under
