      falsification_route:
        - 'git cat-file -e 0a13d39...:coordination/goals/GOAL-ECDLP-001/batches/BATCH-158345/batch.yaml  (absent)'
        - 'git log --oneline --diff-filter=A -- .../BATCH-158345/batch.yaml  (first added by e706e6a01)'
        - 'git merge-base --is-ancestor 0a13d39... 24225684a  (true: producer HEAD precedes the batch branch point)'
        - 'expected_result_if_objection_is_wrong: some commit''s tree equals what the producer describes reading. None does.'

