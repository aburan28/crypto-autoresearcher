      falsification_route:
        - 'enumerate ctrl5 should_differ.items (23) and classify each against the six mandate categories'
        - 'grep the two specs for any field naming a branch or the reviewer tasks and check membership in the list'
        - 'expected_result_if_objection_is_wrong: a branch-naming and a reviewer-naming field appear in should_differ. Neither does.'

    - id: RT-A70C90-D3
      title: the producer's recorded working state is not the state that was archived and is not reconstructible from any commit
      severity: moderate
      class: provenance_auditability_gap
      exact_residual: >-
        specification.yaml authority.git_state records
        git_ref_read_from_dot_git_head: refs/heads/main,
        head_commit_sha: 0a13d39f34ceeebd7f049b2414cd28c2cfee015d,
        head_commit_sha_determined_by_this_producer: true, and a note that "the
        working tree carries pre-existing unrelated modifications". The seven
        artifacts were archived on branch
        claude/ecdlp-001-batch158345-20260817 at 3d9e8eb18, whose base e706e6a
        is a DESCENDANT of 0a13d39 and is the commit that first introduced
        BATCH-158345/batch.yaml and the task cards at all (verified with
        git log --diff-filter=A). So at the producer's own recorded HEAD its
        binding contract did not exist in the tree; the producer resolves this
        honestly by stating it read batch.yaml and the task card "committed on
        origin/main" and by listing `git show origin/main:<path>` among the
        commands it ran, and origin/main at authoring (20f628d) does contain
        them. The residual is that no single commit reproduces the tree the
        producer actually read: it is 0a13d39 plus an undeclared dirty overlay
        plus selected blobs from 20f628d.
      material_impact_assessed_and_bounded: >-
        Bounded by the same check as RT-A70C90-M4: the predecessor and baseline
        specifications are byte-identical at 0a13d39, 20f628d and 3d9e8eb18, so
        the inputs that matter were stable. Also, authoring a declared research
        artifact with HEAD on refs/heads/main rather than the batch branch is
