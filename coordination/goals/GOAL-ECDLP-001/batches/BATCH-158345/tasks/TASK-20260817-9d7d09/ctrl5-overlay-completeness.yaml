      structural diff was performed over the whole file, and no artifact of
      EXP-SYC-95ff77 makes that claim anywhere. A read-based field-by-field
      comparison by the producing session is weaker than a parsed diff in
      exactly two ways it is worth naming: it cannot prove the ABSENCE of a
      key it did not think to look for, and it cannot detect a whitespace-only
      or invisible-character difference. Both are named as residuals in section
      6 and both are delegated by name below.
