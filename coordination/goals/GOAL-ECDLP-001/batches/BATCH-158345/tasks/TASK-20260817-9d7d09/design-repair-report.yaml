  # ---------------------------------------------------------------------------
  # PROMINENT LIMITATION STATEMENT. This copy is byte-identical to
  # experiments/EXP-SYC-95ff77/specification.yaml prominent_ha2_limitation_
  # statement (VAL-7FA865-N5, BATCH-7d9b78: the predecessor report presented a
