        The frozen formula is max_t ( B_0(t) + S(t) + sum_{j=1..8} B_j(t) ), with
        the equivalent per-shard-totals form max_t ( B_0(t) + sum_j P_j(t) - D(t) )
        and the retained bracket's upper bound widened by max_t B_0(t).
        FORBIDDEN-R7 (omitted-setup-stream) is in the forbidden-rules list, and
        the KAT-PEAK-F fixture is A SETUP-PRIVATE ALLOCATION OF 4096 PRIVATE
        NON-SHARED BYTES LIVE ON [0,20) while all shards and the shared context
        are idle, WITH EXPECTED_SYSTEM_PEAK 4096, rejecting FORBIDDEN-R7 (which
        returns 0). No other KAT changes.
