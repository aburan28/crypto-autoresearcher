  peak_memory_custody:
    rule: 'peak_live_bytes_system = max_t( B_0(t) + shared(t) + sum_j concurrent_nonshared_shard_j(t) - dedup(t) )'
    rule_site_id: RULE-SITE-3-OF-4
    rule_b0_repair_note: >-
      BLOCK-5 / RT-82A8CB-OBJ5. The predecessor's custody rule at this site
      omitted B_0 and carried only a pointer note beside it, so the OPERATIVE
      custody obligation an implementer reads was the pre-repair rule.
      Evaluated against KAT-PEAK-F it returns 0 against a required 4096: the
      pre-repair rule IS FORBIDDEN-R7. The term is now in the rule itself.
    equivalent_merged_form: 'system_peak_live_bytes = max_t ( B_0(t) + S(t) + sum_{j=1..8} B_j(t) )'
    rt_obj_f_setup_private_term: >-
      RT-OBJ-F: the setup process's private (neither shared nor shard)
      allocation B_0(t) is concurrently live and must be charged. FORBIDDEN-R7
      (omitted-setup-stream) exists for this and KAT-PEAK-F exercises B_0 > 0.
    numeric_effect_of_the_b0_propagation: >-
      NONE. B_0 = 0 in KAT-PEAK-1 through KAT-PEAK-7, so no expected value, byte
      figure, bound, residual or disposition changes; the corrected rule reduces
      exactly to the predecessor's at B_0 = 0.
    shards_required: 8
    streams_required: 10
    streams_required_site_id: CENSUS-SITE-5-OF-9
    streams_required_repair_note: >-
      BLOCK-5. The predecessor read 9. TEN, at all nine sites. A nine-stream
      census is one that may omit B_0, so the census contract as written
      permitted the exact omission FORBIDDEN-R7 forbids.
    stream_list: >-
      the setup process's private non-shared stream B_0, the shared/setup
      context stream S counted exactly once, and one complete allocation-event
      stream per BSGS shard, B_1 through B_8
    receipt_requirement: >-
      one complete timestamped allocate/free event stream per shard, plus the
      shared context stream, plus the setup process's private stream, all on one
      host monotonic clock; every stream participates in the time-aligned
      aggregate, not in a maximum
    missing_shard: invalidates
    missing_shared_stream: invalidates
    missing_setup_private_stream: invalidates
    missing_setup_private_stream_note: >-
      NEW IN THIS SUCCESSOR AS AN EXPLICIT CUSTODY OBLIGATION. The predecessor
      required the shard streams and the shared stream and said nothing about
      B_0, which is how a fully conformant implementation could still commit
      FORBIDDEN-R7.
    multi_host_execution: invalidates
    sampled_or_polled_census: invalidates
    averaging_or_dividing: forbidden
    reuse_of_a_five_way_maximum: forbidden
    no_invariance_claim: true
    dedup_custody:
      definition: >-
        dedup(t) = sum over physical pages P live at t of (c_P(t) - 1) *
        bytes(P), where c_P(t) counts how many of the TEN accounting terms
        {setup_private_B_0, shared, nonshared_1..nonshared_8} charge P at t
      definition_site_id: CENSUS-SITE-6-OF-9
      definition_repair_note: >-
        BLOCK-5. The predecessor read "how many of the NINE accounting terms"
        while the corrected formula summed TEN. NO DEDUP VALUE IN ANY FIXTURE
        CHANGES, because dedup is 0 in every fixture.
      accounting_terms_counted: 10
      evidence_requirement: page-level census
      unproved_duplication: set to zero, so it can never reduce the reported peak
      shared_counted_exactly_once: true
    kats: coordination/goals/GOAL-ECDLP-001/batches/BATCH-158345/tasks/TASK-20260817-9d7d09/verification-and-null-kats.yaml
    kats_note: >-
      KAT-PEAK-1 through KAT-PEAK-7 and KAT-PEAK-F are carried forward from
      EXP-SYC-dc854f with every expected value unchanged. The parallel-lane
      KAT-PEAK-A through KAT-PEAK-F with FORBIDDEN-R1 through R7 are carried in
      specification.yaml's merged_parallel_lane_exp_syc_75f7d2 section.
    required_kat_set_for_implementation_conformance: [KAT-PEAK-1, KAT-PEAK-2, KAT-PEAK-3, KAT-PEAK-4, KAT-PEAK-F]
    required_kat_set_repair_note: >-
      BLOCK-5. KAT-PEAK-F is now in the set an implementation is REQUIRED to
      pass. In the predecessor it was an optional discriminator, so the only
      fixture exercising B_0 was not binding and MUT-2 showed the repaired term
      was invisible to every required fixture. The historical
      mandated_by_checkpoint list (KAT-PEAK-1 through 4, from BATCH-080a9c) is
      NOT edited, because BATCH-080a9c did not mandate KAT-PEAK-F and this
      package will not attribute to a committed checkpoint something it did not
      say.
    measured_values_present: false
    new_residual:
      id: PEAK-AGGREGATE-FIT-UNPROVED
      statement: >-
        the unchanged maximum_memory_gb ceiling of 2 binds an aggregate over TEN
        concurrently live streams rather than a per-shard maximum; the aggregate
        can exceed any single per-shard figure by up to eightfold and no byte
        figure exists, so fit is unproved. Unchanged in substance from
        EXP-SYC-793304, EXP-SYC-ff777e and EXP-SYC-dc854f.
      statement_site_id: CENSUS-SITE-7-OF-9
      statement_repair_note: 'BLOCK-5. The predecessor read "nine concurrently live streams" here.'
      b0_widening_disclosure:
        finding_id: RT-82A8CB-OBJ5, cost-model limb CMC-2
        statement: >-
          THE B_0 REPAIR WIDENS THE QUANTITY BEING FITTED by max_t B_0(t), on
          top of an already-unproved fit, and the predecessor did not disclose
          that its own repair did so. No byte figure for B_0 exists either, so
          the widening is qualitative and unquantified; quantifying it requires
          an implementation that does not exist.
        cap_raised: false
      cap_raised: false
      disposition: OPEN_CARRIED_FORWARD

