  peak_live_bytes_accounting:
    composition: >-
      time_aligned_aggregate_of_all_concurrently_live_streams_with_shared_counted_once
    system_rule: 'peak_live_bytes_system = max_t( B_0(t) + shared(t) + sum_j concurrent_nonshared_shard_j(t) - dedup(t) )'
    system_rule_site_id: RULE-SITE-4-OF-4
    system_rule_b0_repair_note: >-
      BLOCK-5 / RT-82A8CB-OBJ5. The predecessor's compiler rule at this site
      omitted B_0 and carried only a pointer note beside it, so the OPERATIVE
      compiler rule was the pre-repair one. Evaluated against KAT-PEAK-F it
      returns 0 against a required 4096: the pre-repair rule IS FORBIDDEN-R7.
    equivalent_merged_form: 'system_peak_live_bytes = max_t ( B_0(t) + S(t) + sum_{j=1..8} B_j(t) )'
    rt_obj_f_setup_private_term: >-
      RT-OBJ-F: the setup process's private (neither shared nor shard)
      allocation B_0(t) is concurrently live and must be charged, with the
      retained bracket's upper bound widened by max_t B_0(t). FORBIDDEN-R7
      (omitted-setup-stream) exists for this and KAT-PEAK-F exercises B_0 > 0.
    numeric_effect_of_the_b0_propagation: >-
      NONE. B_0 = 0 in KAT-PEAK-1 through KAT-PEAK-7, so no expected value or
      byte figure changes and the corrected rule reduces exactly to the
      predecessor's at B_0 = 0.
    shard_index_range: j = 1 through 8
    stream_count: 10
    synchronized_time_base:
      clock: one host monotonic clock, CLOCK_MONOTONIC_RAW, single source for all TEN streams
      clock_site_id: CENSUS-SITE-8-OF-9
      clock_repair_note: 'BLOCK-5. The predecessor read "single source for all nine streams".'
      event_model: timestamped signed byte deltas forming right-continuous step functions
      evaluation: exact at every event timestamp in the merged event set
      sampling: forbidden
      multi_host: invalidates; no cross-host peak may be reported
      skew_tolerance: zero by construction; a single clock source is required rather than a measured skew bound
    dedup_term:
      definition: 'dedup(t) = sum over physical pages P live at t of (c_P(t) - 1) * bytes(P), where c_P(t) counts how many of the TEN accounting terms charge P at t'
      accounting_terms_counted: 10
      range: '0 <= dedup(t) <= B_0(t) + sum_j nonshared_j(t)'
      unproved_duplication: set to 0
      shared_counted_exactly_once: true
    interval_arithmetic:
      lower: 'max_t( b0_lo(t) + shared_lo(t) + sum_j nonshared_lo_j(t) - dedup_hi(t) )'
      upper: 'max_t( b0_hi(t) + shared_hi(t) + sum_j nonshared_hi_j(t) - dedup_lo(t) )'
      dedup_lo_default: 0
      applies_to: candidate stage, rho stage, and BSGS stage alike
    bounds:
      lower_bound_rule: 'max_j max_t nonshared_j(t) <= peak_live_bytes_system'
      upper_bound_rule: 'peak_live_bytes_system <= max_t b0(t) + max_t shared(t) + sum_j max_t nonshared_j(t)'
      coincide_only_when: all per-stream peaks are simultaneous
    stage_reporting_rule: >-
      the reported axis value is the single global max over t across the whole
      run; per-stage aggregates are diagnostic only and their maximum equals the
      global value only if the stages are evidenced to be time-disjoint
    census_completeness:
      streams_required: 10
      streams_required_site_id: CENSUS-SITE-9-OF-9
      streams_required_repair_note: >-
        BLOCK-5. The predecessor read 9. TEN, at all nine sites. A nine-stream
        census is one that may omit B_0, so the contract as written permitted the
        exact omission FORBIDDEN-R7 forbids.
      stream_list: 'B_0, S, B_1, B_2, B_3, B_4, B_5, B_6, B_7, B_8'
      missing_stream: invalidates
      averaging_or_dividing: forbidden
      reuse_of_a_five_way_maximum: forbidden
    eight_way_effect: >-
      The eight-way BSGS baseline contributes eight concurrently live non-shared
      allocations that are now summed at aligned times rather than maximized
      across streams, alongside the shared stream and the setup-private stream.
      Widening from five to eight can change the system peak; no shard-invariance
      is proved or asserted.
    kats: coordination/goals/GOAL-ECDLP-001/batches/BATCH-158345/tasks/TASK-20260817-9d7d09/verification-and-null-kats.yaml
