required_successor_repairs:
  - id: BLOCK-1-FALSE-PROVENANCE-SELF-REPORT
    source_checkpoint: BATCH-7d9b78
    source_findings: [VAL-7FA865-B1, RT-82A8CB-OBJ1]
    severity: blocking
    class: provenance_integrity_false_affirmative_statement
    checkpoint_statement_verbatim: >-
      specification.yaml's `runtime_provenance` (lines 145-200) and
      `authority` (lines 84-94) assert a false self-report:
      `self_reported_resolved_model_id: claude-sonnet-5` with source reading
      "Direct self-report from THIS authoring session's own runtime system
      context, which states verbatim: 'You are powered by the model named
      Sonnet 5. The exact model ID is claude-sonnet-5.'", task_id
      TASK-20260815-6f4429, batch_id BATCH-8c58a3. The artifact was in fact
      authored by TASK-20260815-9b3cb3 in BATCH-7d9b78; its own companion
      receipt and the other four deliverables all record vllm/qwen3.8-27b.
      FIVE OF SIX ARTIFACTS AGREE WITH EACH OTHER AND DISAGREE WITH THE
      SPECIFICATION. The block was copied forward unmodified from the
      predecessor, which WAS authored by TASK-20260815-6f4429 in BATCH-8c58a3
      on claude-sonnet-5.
    required_fix: >-
      A successor record (NEVER an edit to the committed snapshot) must
      re-author `runtime_provenance` and `authority` in specification.yaml to
      describe its OWN authoring session: its own task_id
      (TASK-20260817-9d7d09), batch_id (BATCH-158345), receipt path, genuine
      self-reported resolved model id kept separate from the committed
      binding target, and its own archived_by / reviewed_by tasks. OR rename
      the inherited block (e.g. inherited_predecessor_runtime_provenance),
      strike the "THIS authoring session" phrasing, and add the successor's
      own. Because the defective bytes are already committed and immutable,
      the Coordinator additionally issues a CORR-* record superseding the
      false provenance assertion BY REFERENCE, on the CORR-20260815-092c9f
      precedent.
    no_numeric_or_disposition_change: >-
      This is a self-description/provenance-integrity defect. It changes no
      numeric row, bound, or disposition label, and bears on no ECDLP
      assertion in either direction.

  - id: BLOCK-2-FOUND-BY-ATTRIBUTION
    source_checkpoint: BATCH-7d9b78
    source_findings: [VAL-7FA865-B2, RT-82A8CB-OBJ2]
    severity: blocking
    class: fabricated_citation_provenance
    checkpoint_statement_verbatim: >-
      All eight repair items in design-repair-report.yaml are attributed in
      item_by_item[*].found_by to TASK-20260815-7fa865 and
      TASK-20260815-82a8cb -- THIS batch's two reviews, both
      `preregistered_not_yet_dispatched` when the producer wrote the report.
      The actual finders, from the committed checkpoints: BATCH-8c58a3 --
      Validator TASK-20260815-839dc8 (V3-RESIDUAL-COMPLETENESS-OVERCLAIM,
      seven items) and Red Team TASK-20260815-fbd43e (RT-FBD43E-OBJ2-V2-INCOMPLETE,
      twelve items, authoritative); BATCH-a723af -- Validator
      TASK-20260815-508861 (VAL-A723AF-R1/R2/R3) and Red Team
      TASK-20260815-47a2e9 (RT-OBJ-A/C/D/F), with CONVERGENT-C-HA2-1
      reached_independently_by [VAL-A723AF-R2, RT-OBJ-A].
    required_fix: >-
      A successor must attribute each of the eight items to its ACTUAL finder
      by task ID and finding ID, as the source checkpoints already do
      correctly, and must not name a task that has not reported.
    no_numeric_or_disposition_change: >-
      Provenance attribution only. No numeric, bound, or disposition change.

  - id: BLOCK-3-VERIFICATION-METHOD-CONTRADICTION
    source_checkpoint: BATCH-7d9b78
    source_findings: [VAL-7FA865-B4, RT-82A8CB-OBJ4]
    severity: blocking
    class: unsupportable_method_claim
    checkpoint_statement_verbatim: >-
      The package claims a "full recursive parsed-YAML structural diff" was
      performed (specification.yaml preamble lines 539-542; V4_FIX_APPLIED.
      independent_verification_performed; design-repair-report.yaml
      item_by_item[V4].independent_verification_performed) while two
      artifacts explicitly deny it (design-repair-report.yaml
      actions_not_taken.parser_invoked: false, command_executed: false;
      verification-and-null-kats.yaml "No command was executed, no digest was
      computed, no parser was invoked"). These cannot both be true. BLOCK-4 is
      direct evidence for the "not performed" reading: the report's twelve-path
      list contains field paths that do not exist, which no parser would emit.
    required_fix: >-
      A successor must state exactly what it did -- either "a parser was
      invoked, and here is the tool and the field list it produced" with
      actions_not_taken corrected accordingly, or "fields were compared by
      reading, and the parsed-YAML verification is delegated to the review
      tasks" -- and must not assert a mechanized check it also denies making.
    no_numeric_or_disposition_change: >-
      The OUTCOME does not depend on resolving this: the reviewer performed
      the parsed-YAML structural diff independently and the twelve items are
      byte-identical. Only the unsupported method claim must not survive.

  - id: BLOCK-4-TWELVE-SUB-FIELDS-NOT-AUTHORITATIVE
    source_checkpoint: BATCH-7d9b78
    source_findings: [VAL-7FA865-B3, RT-82A8CB-OBJ3]
    severity: blocking
    class: internal_contradiction_between_two_artifacts_of_one_package
    checkpoint_statement_verbatim: >-
      design-repair-report.yaml item_by_item[V4].twelve_sub_fields_restored is
      NOT the checkpoint's authoritative twelve: its parent path segments do
      not exist (the spec keys are contract_1_worst_case,
      contract_2_tuplewise_tail, contract_3_simultaneous_tail); seven of its
      entries were never among the trimmed fields (already matched the
      baseline in ff777e); one (serialization_convention) DELIBERATELY DIFFERS
      from the baseline by the item-A relabel; and it OMITS
      contract_1_worst_case.falsification_condition (the checkpoint's
      ENTIRE_FIELD_MISSING priority item) and
      contract_2_tuplewise_tail.falsification_condition. specification.yaml's
      own V4_FIX_APPLIED.twelve_items_restored list IS correct and matches the
      checkpoint exactly, so the two artifacts of one package contradict each
      other.
    required_fix: >-
      Replace the list with the checkpoint's authoritative twelve paths,
      matching specification.yaml's already-correct V4_FIX_APPLIED list.
    no_numeric_or_disposition_change: >-
      The restoration itself is real and byte-exact (independently verified).
      The defect is in the report's account of the work, not the work.

  - id: BLOCK-5-B0-TERM-NOT-PROPAGATED
    source_checkpoint: BATCH-7d9b78
    source_findings: [RT-82A8CB-OBJ5]
    severity: blocking
    class: incomplete_repair_mandated_fix_not_effective
    checkpoint_statement_verbatim: >-
      RT-OBJ-F's B_0 term reaches exactly one formula and one NON-MANDATORY
      KAT. The pre-repair rule and the nine-stream census contract survive as
      the operative text: specification.yaml line 969
      blocker_repairs.SYSTEM-PEAK-LIVE-CONCURRENCY.frozen_rule =
      max_t( shared(t) + sum_j concurrent_nonshared_shard_j(t) - dedup(t) )
      WITH NO B_0 POINTER NOTE ANYWHERE IN THAT BLOCK, disposition REPAIRED at
      line 967; the stopping rule (line 1803) still says "a peak census
      missing any of the NINE streams invalidates"; verification-and-null-kats.yaml
      line 127 ("how many of the NINE accounting terms charge P at t") and
      line 363 (census_streams_required: 9); physical-frontier-compiler.yaml
      line 244 ("single source for all NINE streams") and line 269
      (streams_required: 9). The dedup term still omits B_0, while the
      corrected formula at line 1440 sums TEN (B_0, S, B_1..B_8). KAT-PEAK-1
      through 4 all have B_0 = 0, so the one fixture that would exercise B_0
      (KAT-PEAK-F) is not in the set an implementation is REQUIRED to pass.
    required_fix: >-
      Propagate the B_0 term to ALL FOUR rule sites (the frozen_rule at line
      969, the stopping rule at line 1803, and the census contracts in
      verification-and-null-kats.yaml and physical-frontier-compiler.yaml);
      update the census from NINE streams to TEN at ALL NINE sites that state
      the stream count; correct the dedup term at lines 991-993 to include
      B_0; and place KAT-PEAK-F in the set of KATs an implementation is
      REQUIRED to pass (census_streams_required: 10, streams_required: 10).
    no_numeric_or_disposition_change: >-
      This makes the already-correct B_0 repair EFFECTIVE and consistent. It
      changes no numeric result, bound, or disposition; it propagates a term
      the package already introduced at line 1440.

  - id: BLOCK-6-KAT-PEAK-F-WRONG-VALUE-IN-REPORT
    source_checkpoint: BATCH-7d9b78
    source_findings: [VAL-7FA865-B5, RT-82A8CB-OBJ6]
    severity: blocking
    class: internal_contradiction_between_two_artifacts_of_one_package
    checkpoint_statement_verbatim: >-
      design-repair-report.yaml item_by_item[RT-OBJ-F].what_this_successor_does
      describes KAT-PEAK-F as "a setup-private allocation of 1 byte live ...
      expected_system_peak 1". specification.yaml's KAT-PEAK-F and
      verification-and-null-kats.yaml's KAT-PEAK-F both specify 4096 private
      non-shared bytes live on [0,20), expected_system_peak 4096,
      frozen_formula_with_B_0 4096, predecessor_formula_without_B_0_returns 0.
      THE SPEC AND THE KAT FILE ARE RIGHT; THE REPORT IS WRONG.
    required_fix: >-
      Correct the report's KAT-PEAK-F to 4096 bytes live on [0,20) with
      expected_system_peak 4096, matching specification.yaml,
      verification-and-null-kats.yaml, and the BATCH-a723af checkpoint's
      mandated 4096.
    no_numeric_or_disposition_change: >-
      Corrects the report to the already-mandated 4096. The spec and KAT file
      are unchanged (they are the ones that are right).

  - id: NON-BLOCKING-CARRY
    source_checkpoint: BATCH-7d9b78
    source_findings: [RT-82A8CB-OBJ15, RT-82A8CB-OBJ7, RT-82A8CB-OBJ8, RT-82A8CB-OBJ9, RT-82A8CB-OBJ10, RT-82A8CB-OBJ11, RT-82A8CB-OBJ12, RT-82A8CB-OBJ13, RT-82A8CB-OBJ14, RT-82A8CB-OBJ16, RT-82A8CB-OBJ17]
    severity: non_blocking_carry
    class: record_quality_and_premature_closure_risk
    checkpoint_statement_verbatim: >-
      The non-blocking carry from the goal's RESUME ACTION (vii): re-author
      the four stale copy-forward blocks; reconcile the two family sizes
      (98304 vs 32768); add the gamma_x = 3/10 evaluation the red team already
      computed; record the disjoint-arc attainment witness for the 32/33
      supremum; and narrow the "even after a future implementation"
      foreclosure to "from the committed heuristics alone" (RT-82A8CB-OBJ15,
      an open premature-closure risk this goal does NOT adopt in its
      over-broad form).
    required_fix: >-
      Address each non-blocking item by ID in the successor, or carry it
      forward as an explicit visible open line. None is blocking; none may be
      silently dropped.
    no_numeric_or_disposition_change: >-
      Record-quality and scope-narrowing items. The gamma_x = 3/10 evaluation
      and the disjoint-arc attainment witness are additions that make the
      record more complete; they do not reverse any conclusion.

