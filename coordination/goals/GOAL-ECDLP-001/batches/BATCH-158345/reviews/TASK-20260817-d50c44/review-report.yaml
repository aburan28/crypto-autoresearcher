    - id: VAL-D50C44-B2
      title: >-
        BLOCK-5's B_0 propagation reached physical-frontier-compiler.yaml's
        system_rule but not the bracket the same file uses to validate a
        computed peak, so that file now asserts a bound its own
        required-to-pass fixture KAT-PEAK-F falsifies
      severity: blocking
      class: incomplete_repair_leaves_a_false_mathematical_statement_in_a_frozen_contract
      locations:
        repaired_site: coordination/goals/GOAL-ECDLP-001/batches/BATCH-158345/tasks/TASK-20260817-9d7d09/physical-frontier-compiler.yaml:262
        unrepaired_sites:
          - physical-frontier-compiler.yaml:289 interval_arithmetic.lower
          - physical-frontier-compiler.yaml:290 interval_arithmetic.upper
          - physical-frontier-compiler.yaml:294 bounds.lower_bound_rule
          - physical-frontier-compiler.yaml:295 bounds.upper_bound_rule
      defect: >-
        Line 262 now reads system_rule = 'peak_live_bytes_system = max_t( B_0(t)
        + shared(t) + sum_j concurrent_nonshared_shard_j(t) - dedup(t) )'. Lines
        289-290 and 294-295 are carried forward BYTE-IDENTICAL from the
        predecessor (BATCH-7d9b78/.../physical-frontier-compiler.yaml:256-257
        and :261-262) and contain no B_0 term:
        lower = 'max_t( shared_lo(t) + sum_j nonshared_lo_j(t) - dedup_hi(t) )';
        upper = 'max_t( shared_hi(t) + sum_j nonshared_hi_j(t) - dedup_lo(t) )';
        lower_bound_rule = 'max_j max_t nonshared_j(t) <= peak_live_bytes_system';
        upper_bound_rule = 'peak_live_bytes_system <= max_t shared(t) + sum_j max_t nonshared_j(t)'.
      exact_residual: >-
        physical-frontier-compiler.yaml:262 system_rule contains B_0(t);
        lines 289, 290, 294 and 295 do not, and are byte-identical to the
        predecessor's lines 256, 257, 261 and 262. Under KAT-PEAK-F (B_0 = 4096,
        shared = 0, all nonshared_j = 0, dedup = 0) the system_rule returns 4096
        while interval_arithmetic returns the bracket [0, 0] and
        bounds.upper_bound_rule asserts 4096 <= 0. The four missing terms are
        B_0_lo(t) in lower, B_0_hi(t) in upper, and max_t B_0(t) in
        upper_bound_rule; lower_bound_rule (0 <= 4096) remains true and needs no
        change.
      failure_scenario_recomputed: >-
        Evaluate the package's own KAT-PEAK-F, which BLOCK-5 moved INTO the set
        an implementation is REQUIRED to pass
        (verification-and-null-kats.yaml:350). Its state is B_0 = 4096 on the
        live window, shared(t) = 0 at every t, nonshared_j = 0 for every j,
        dedup(t) = 0 at every t (verification-and-null-kats.yaml:327-335;
        specification.yaml:1777-1780). Then:
        (a) physical-frontier-compiler.yaml:262 system_rule returns
            max_t(4096 + 0 + 0 - 0) = 4096, matching the mandated
            expected_peak_live_bytes 4096;
        (b) the interval_arithmetic bracket at 289-290 returns
            lower = max_t(0 + 0 - 0) = 0 and upper = max_t(0 + 0 - 0) = 0,
            i.e. the bracket [0, 0], which EXCLUDES the value the same file's
            own rule requires;
        (c) bounds.upper_bound_rule at 295 asserts
            peak_live_bytes_system <= max_t shared(t) + sum_j max_t nonshared_j(t)
            = 0 + 0 = 0, i.e. it asserts 4096 <= 0, which is FALSE.
        An implementation that follows physical-frontier-compiler.yaml as
        written must either invalidate its own mandated fixture or violate the
        file's stated upper bound.
      the_asymmetry_is_demonstrable_not_inferred: >-
        specification.yaml's merged-lane retained_bracket WAS widened for
        exactly this case: line 1679 reads upper = 'sum_j max_t P_j(t) +
        max_t S_solo(t) + max_t B_0(t)' and line 1685-1686 states "the setup
        private bytes are bounded by max_t B_0(t)". Under KAT-PEAK-F that
        bracket evaluates to [0, 0 + 0 + 4096] = [0, 4096], which correctly
        contains 4096. So the successor demonstrably knew the bracket needed
        the B_0 term and applied it in specification.yaml, and did not apply it
        to the parallel primary-base bracket in
        physical-frontier-compiler.yaml.
      relationship_to_the_mandated_scope: >-
        Stated plainly and without inflation: batch.yaml's BLOCK-5 required_fix
        enumerated FOUR rule sites, NINE census sites, the dedup term, and
        KAT-PEAK-F. All of those are done correctly (see
        BLOCK-5-B0-TERM-PROPAGATED above, which this validator scores PASS on
        every enumerated item). The bracket sites were NOT among them. What
        makes this blocking is not the omission from a list but the resulting
        state of the frozen artifact: it contains a bounds statement that is
        false under its own repaired rule and its own required fixture, and
        physical-frontier-compiler.yaml:270 tells the reader the retained
        bracket's upper bound was "widened by max_t B_0(t)" -- a sentence that
        is true of the merged-lane bracket it cites but that a reader will
        naturally, and wrongly, read as covering the bracket printed twenty
        lines below it.
      required_repair: >-
        In a successor artifact, add the B_0 term to
        physical-frontier-compiler.yaml interval_arithmetic.lower/upper and to
        bounds.lower_bound_rule/upper_bound_rule (upper widened by
        max_t B_0(t), matching specification.yaml:1679), or state explicitly
        that the primary-base bracket is scoped to the shared and shard
        streams only and is NOT a validity check for the B_0-bearing rule. No
        numeric row, residual, or disposition changes either way.
      no_numeric_result_changes: true

