    feed a separate future executable-contract gate. This is not a verdict on
    an experiment result, serializer implementation, scientific hypothesis, or
    ECDLP evidence.
  verdict_rationale: >-
    The snapshot, proposal binding, literal serializer constructions, all 20
    compact fixture hashes, all 84 archive-pass hashes, nine static certificate
    source/slot mappings, collision and layout controls, allocation-25
    self-neutrality, budgets, claim ceiling, and non-execution barrier passed
    independent checks. Readiness nevertheless requires revision because the
    deterministic case-seed and commitment namespace is not finite and exact
    for every archive, phase, pass, and mutation case. Only the 20 compact
    fixtures have explicit fixture ids and ordinals. A versioned successor must
    freeze the complete case registry before an executable-contract gate can
    produce reproducible manifest seeds and an unambiguous case order.

