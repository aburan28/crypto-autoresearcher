    - id: A04-COMPACT-FIXTURES
      commands:
        - >-
          python3 read-only independent byte constructors for generator bundle,
          planted audit, selected pair, matched rank, canonical root seed,
          fixture transcript, ordered ICC2 curve framing, and the nonvalidating
          interval-certificate serializer fixture; hashlib.sha256 over only the
          reconstructed local literal messages
      result: >-
        PASS 20/20. Total bytes 463363 and independently recomputed SHA-256
        compression blocks 7257. This was validation of local frozen literals,
        not materialization of a future schedule or computation of a future
        certificate digest.
    - id: A05-ARCHIVE-ROWS-AND-SELF-NEUTRALITY
      commands:
        - >-
          python3 read-only streaming SHA-256 reconstruction of each CARARCH1
          header and zero payload for allocation codes 1..42, write before
          verification, followed by the fixed nonzero allocation-25 validation
      result: >-
        PASS 42/42 allocation rows and 84/84 pass hashes. One-pass allocation
        bytes are 2252694592; two-pass absorbed bytes including 84 headers are
        4505394560; independent block total is 70396870. Allocation 25 produced
        the two fixed digests before and after storing them in the excluded
        region, with dependency-cycle count zero.
    - id: A06-CERTIFICATE-MAP
      commands:
        - python3 half-open interval partition and uniqueness audit over the nine static rows
      result: >-
        PASS. Source intervals partition [0,36288), digest slots partition
        [2688,2976), and ids, ordinals, intervals, and slots are unique. A
        mutation aliasing ordinal 8 to digest offset 2912 was rejected. No
        actual future certificate digest was computed; all nine proposal
        values remain pending_future_certificate_execution.
    - id: A07-COLLISION-LAYOUT-AND-NEARBY-CONTROLS
      commands:
        - >-
          python3 independent prefix/code uniqueness, 18-layout half-open
          partition, reserved-zero mutation, source/digest alias mutation, and
          allocation-25 included/excluded byte mutation checks
      result: >-
        PASS. Ten prefixes, family codes 1..9, nine schema codes, and arm codes
        1..10 are unique. All 18 fixed layouts are gap-free and overlap-free.
        Injected prefix, code, gap, overlap, reserved-zero, and slot aliases
        failed. The excluded-byte mutation preserved both pass digests; the
        included-byte mutation changed both to
        7452edc4d635173837c281790ccf18c7a6417737014ad0235630c3f035cf567b
        and f1f69eaeaa9f6f61b1e629d66c5851c58c6a0d35491dfe175e5b9284bf7bfdf3.
        The nearby-object checks are therefore discriminating, not tautologies.
    - id: A08-DOMAIN-ORDER-BUDGET-AND-GATES
      commands:
        - python3 deterministic case-seed examples, stage sums, known hashed-byte sum, and ordering audit
      result: >-
        Stage wall and CPU rows each sum exactly to 1800 seconds; maximum stage
        memory is 1 GiB. The eight known nonzero allocation-25 pass messages,
        84 zero messages, and 20 compact messages account for 4514247043
        logical hashed bytes, below the 4600000000 cap. Stops, invalidations,
        infrastructure disposition, proof-search-map ceiling, comparator
        restrictions, artifacts, approval/freeze/execution separation, and
        one-worker/one-package limits are coherent. The seed function is
        deterministic when all inputs are supplied, but the design does not
        supply exact case identity inputs for every archive phase and mutation;
        see VAL-E93546-CASE-IDENTITY-001.
    - id: A09-SCALE-SUCCESS-FALSIFICATION-AND-OUTPUT-LANGUAGE
      commands:
        - manual adversarial reading of every success, falsification, scale, assignment, approval, and claim-boundary field
      result: >-
        PASS apart from the separately identified case-identity defect. Scale
        is explicitly nonexperimental; success is future apparatus conformance
        only; falsification closes serializer scope only; assigned_to is
        conditioned on separate future authorization; approval_status is
        explicitly negative. The custom serializer_design schema,
        nonexperimental tier, and conditional assigned_to vocabulary are
        unusual but internally unambiguous and cannot authorize execution or
        support scientific evidence.
    - id: A10-CHEAPEST-NONEXECUTION-FALSIFICATION
      commands:
        - git show --format= --name-status 4b0cb1a0850bad10d2f91b23eb0965e8e172d4ab
        - >-
          rg over specification.yaml and design-report.yaml for status, frozen,
          authorization, approval, implementation, fixture materialization,
          SHA execution, curve, selector, sampler, interval, certificate,
          treatment, empirical, evidence, inference, and breakthrough terms
        - git status --short --untracked-files=all
      result: >-
        PASS. The snapshot adds only specification, producer report, and
        receipt paths; it adds no code. All execution/materialization booleans
        are false, all nine future certificate outputs remain pending, all
        scientific quantities are explicitly excluded from metrics, and no
        approval, evidence, status transition, authorized command, or implicit
        scientific inference was found.
    - id: A11-REPOSITORY-VALIDATORS
