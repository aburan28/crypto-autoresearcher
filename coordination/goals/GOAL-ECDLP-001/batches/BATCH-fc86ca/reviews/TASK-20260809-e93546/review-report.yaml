  findings:
    - id: VAL-E93546-CASE-IDENTITY-001
      severity: blocking_at_design_readiness_scope
      disposition: REVISE
      title: Deterministic case identity and commitment order are incomplete outside the 20 compact fixtures
      evidence:
        - >-
          deterministic_domain_and_seed_derivation.case_seed_formula hashes
          fixture_id, control_id, and decimal(case_ordinal), so those strings
          and ordinals are part of reproducibility metadata.
        - >-
          canonical_fixture_schedule supplies exact ids and zero-based ordinals
          only for the 20 compact rows.
        - >-
          archive_zero_fixture_schedule supplies allocation code and allocation
          name but no exact fixture_id, no pass-specific case id, and no global
          or local case_ordinal rule for its 84 messages.
        - >-
          allocation_25_self_neutral_fixture supplies two passes, initial and
          round-trip phases, and two mutation classes but supplies no exact
          fixture ids or case ordinals for those eight pass messages.
        - >-
          fixture_order states a broad sequence but does not state whether
          ordinals are global or per control, how pass and phase enter
          fixture_id, or the exact order of write versus verification within
          each nonzero mutation phase.
      cheapest_falsification: >-
        Construct two manifests that both obey the prose: one can use the
        allocation string as fixture_id and code 25 as case_ordinal, while
        another can use an ARCHIVE-25 fixture id and a global ordinal following
        compact ordinal 19. The case_seed_formula necessarily produces
        different metadata seeds and therefore different commitment bytes.
      impact: >-
        No serializer byte, frozen digest, archive total, certificate mapping,
        or scientific boundary is contradicted. The defect blocks only the
        assertion that deterministic seeds, complete case order, and the future
        presemantic commitment are already exact enough for an executable
        contract.
      required_versioned_successor:
        - Allocate a fresh immutable experiment successor id with a random six-hex suffix; do not edit or remap EXP-ECDLP-f77b0c.
        - >-
          Add one finite case registry enumerating every compact, archive-zero,
          allocation-25 initial, round-trip, excluded-mutation, and
          included-mutation pass case.
        - >-
          For each case freeze a unique case_id, exact fixture_id string,
          exact control_id, one global zero-based case_ordinal, family/subtype,
          allocation and pass when applicable, phase, mutation, expected
          acceptance or rejection, expected digest relation, and exact position.
        - >-
          Freeze the canonical ordering-commitment manifest schema and field
          order, including how each per-case seed and output digest is encoded.
        - Recompute case counts and logical-byte/resource caps if the finite registry changes any scheduled message.

