        - python3 tools/check_runtime_bindings.py
        - python3 tools/validate_ledger.py
      result: >-
        PASS. Dispatch validation exited zero; runtime bindings reported five
        roles consistent with every binding; ledger validation reported 5349
        records and no new violations. Inherited baseline debt is listed
