    - id: A03-FIELD-TRACE
      commands:
        - python3 read-only recursive field-classification and leaf-count audit
      result: >-
        52/52 top-level fields and 958/958 leaf values received one provenance
        class. The 566 exact serializer-payload leaves were independently
        reconciled. One conservative gate subtree requires revision for the
        incomplete finite case-identity registry; no proposal-derived byte or
