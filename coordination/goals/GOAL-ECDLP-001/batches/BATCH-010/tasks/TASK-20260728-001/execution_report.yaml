  deviations_from_the_approved_protocol:
    - id: D-EXEC-1
      what: 'Stage B measured 10 certified successes and 10 matched failures per cell rather than ALL certified successes.'
      why: >-
        The frozen text expected about ten certified successes per cell; the realised number is
        277-576 on main and negctl, because the frozen heuristic L^5/(5! q) omits the 2^5 sign
        factor. One membership query costs about 14 s at L = 28, so measuring every success is
        not affordable inside the 1800 s cell budget.
      how_bounded: >-
        Cap fixed from a timing pilot before the production set was launched, on measured
        seconds per query only; uniform across all 27 runs; deterministic (lowest target
        indices); recorded in every raw-result.json and every manifest. It widens the noise on
        a per-cell mean, it does not bias it. It does not interact with INVALID-1, which counts
        certified successes in the cell, not measured ones.
    - id: D-EXEC-2
      what: 'The factor-base variables x3, x4, x5 are eliminated by the monic evaluation-product identity Res_x(A, f_V) = prod_{v in V} A(v) rather than by a Sylvester resultant against f_V.'
      why: 'the literal iterated chain produces intermediate bivariate objects of about 10^7 coefficients at L = 28'
      how_bounded: 'exact (f_V is monic and splits over GF(p) by construction) and verified against sympy in --selftest; the identity holds with constant 1'
    - id: D-EXEC-3
      what: 'Subresultant computation implemented in fraction-free (Bareiss) Sylvester form; the polynomial-remainder-sequence form is implemented separately and used only for prs_step_count.'
      why: 'correctness is directly checkable against sympy.resultant; the two forms compute the same subresultant sequence'
      how_bounded: '25/25 agreement with sympy.resultant on random inputs; 0 fallbacks to evaluation-interpolation across the whole run set; PRS degree sequences recorded verbatim'
    - id: D-EXEC-4
      what: 'negctl screening uses a two-level algebraic meet (W1 level) instead of expanding the u level for all 1200 targets.'
      why: 'exactly equivalent as a predicate, and affordable at 1200 targets'
    - id: D-EXEC-5
      what: 'Elliptic-curve group operations are not counted in ops_success, and forward-state construction is excluded from the per-query count.'
      why: 'different unit; and the forward state is built once per cell and amortised'
      how_bounded: 'declared in implementation_notes.md sections 2 and 5; both quantities are reported separately in the raw records'
  deviations_note: >-
    None of these changes a metric definition, a control, a criterion, a budget or an
