batch:
  id: BATCH-010
  goal_id: GOAL-ECDLP-001
  question_ids: [RQ-ECDLP-002]
  authorizing_decisions: [DEC-20260728-001, DEC-20260728-002]
  objective: >-
    MEASURE THE RT-1476 ALPHA EXPONENT. Execute one bounded, frozen, approved experiment -
    EXP-RT1476-001, the subresultant-PRS backward-state degree meter for the serial-S3 2|3 split
    of S5 - and obtain, for the first time in this program, MEASURED values of the two exponents
    behind the RT-1476-SUBRES-A1 gate: beta_deg, the growth exponent of the backward 3-sum state
    at the shared Kummer coordinate u, and beta_ops, the growth exponent of counted GF(p)
    operations on the certified-relation subset only. Validate the run set independently, then
    record what it supports.
    THIS BATCH IS NOT AN ATTEMPT TO SOLVE ECDLP AND IS NOT AN ATTACK. It solves no discrete
    logarithm, recovers no scalar, collects no relations into a linear-algebra stage, performs no
    descent, and makes no comparison against Pollard rho or BSGS. It measures two exponents on toy
    curves of at most 24 bits, and it cannot become an attack within this batch under any outcome.
  status: ready_for_dispatch
  maximum_wall_clock_seconds: 12300
  max_concurrent: 2
  max_concurrent_note: >-
    Set to 2 as directed, but INERT: the four cards form a strictly serial dependency chain
    (execute -> snapshot -> validate -> ledger), so at most one card is ever eligible. Idle
    parallel capacity is not a reason to admit another lane (agents/coordinator.md, Focus
    discipline) and none is admitted. Recorded so a reader is not misled by the number.

  campaign_budget_position:
    maximum_batches_before_this_decision: 8
    maximum_batches_after_this_decision: 9
    extension_authorized_by: DEC-20260728-001
    batches_consumed_before_this_one: 8
    consumed_batch_ids: [BATCH-001, BATCH-002, BATCH-003, BATCH-004, BATCH-005, BATCH-006,
      BATCH-008, BATCH-009]
    batches_remaining_after_this_one: 0
    exhausts_extended_campaign_batch_budget: true
    the_overrun_is_named_not_silent: >-
      BATCH-010 EXCEEDS the maximum of 8 that DEC-20260727-002 set. That maximum was exactly
      consumed by BATCH-009. This batch therefore requires an extension and DEC-20260728-001
      grants one, from 8 to 9, RECORDED BEFORE ANY WORK IS DISPATCHED rather than discovered
      afterwards. It is the SECOND declared extension of this campaign: 6 -> 8 by
      DEC-20260727-002 (which also recorded that 6 had already been exceeded by one before it
      existed), and 8 -> 9 here. Two extensions in two days is a signal that should be
      uncomfortable, and it is written down rather than smoothed over.
    terminal_condition_attached: >-
      DEC-20260728-001 attaches an exit condition so this does not become an open-ended series. If
      BATCH-010 returns a VALID run set with beta_deg >= 0.3, RT-1476-SUBRES-A1 is closed on the
      tested scope and the goal moves to paused or closed_at_budget with that as its terminal
      finding - NOT to BATCH-011 by default. Any further batch requires its own Coordinator
      decision naming the new uncertainty it reduces.
    wall_clock_budget_note: >-
      campaign_budget.total_wall_clock_seconds stays 28800 and is NOT extended. It also remains
      unauditable: DEC-20260727-002 rationale item 3 recorded that BATCH-005 has no coordination
      record and logged no elapsed time, so the campaign tally cannot be reconstructed. BATCH-010
      is bounded INDEPENDENTLY at 12300 seconds (7200 + 600 + 3600 + 900 across its four cards)
      and the campaign figure is treated as unverifiable rather than as satisfied.

  rerank_basis:
    branch_tip_at_open: e77ca6a4
    selected_frontier: 'RT-1476-SUBRES-A1, the program''s only live sub-rho gate, measured rather than argued about.'
    selection_reason: >-
      Four grounds. (1) BATCH-009 closed with two DOES_NOT_SURVIVE verdicts and no research
      movement, and no experiment has executed on this goal since BATCH-005; the campaign is
      review-rich and measurement-poor. (2) RT-1476-SUBRES-A1 has been open for 29+ ideation runs
      and ITS EXPONENT HAS NEVER BEEN MEASURED - the gate is held open by a prior, not by data.
      (3) It already carries a COMPLETE FROZEN CONTRACT authored elsewhere (Contract A1,
      inputs/idea_generation_20260718_batch2.md lines 1286-1319) that has already absorbed one
      adversarial amendment (lines 1388-1397, the successful-subset restriction), so the design is
      not being invented to fit an outcome. (4) It is executable here at toy scale inside a bounded
      budget: the largest object that must be enumerated has fewer than 22000 elements.
    both_outcomes_are_informative: >-
      An adverse measurement gives the gate its first real negative on a tested scope. A favourable
      one gives the program its first toy-scale reason to look further. Neither is a result about
      ECDLP.
    adverse_prior_recorded_at_open: >-
      THE PRIOR IS AGAINST THE HYPOTHESIS. The red-team note at
      inputs/idea_generation_20260718_batch2.md lines 1388-1397 predicts beta_ops -> 3/2 from
      above; the generic count for the backward 3-sum state at balanced sizing is q^{3/5}, i.e.
      beta_deg = 0.6, twice the 0.3 gate. This experiment is EXPECTED TO FAIL. Recording that
      before execution is what prevents an adverse result from being reinterpreted afterwards as a
      surprise, an artifact of the port, or a reason to relax the criterion.
    what_the_BATCH_009_barrier_verdict_does_and_does_not_mean: >-
      RT-20260727-001 found BAR-PATHDYN-CONDTAIL-D2 DOES_NOT_SURVIVE. That is NOT support for
      H-RT1476-001 and is not a reason to run this. The red team wrote its own consequence in
      terms: "a broken barrier is not a positive result for RT-1476-SUBRES-A1 - the gate is merely
      still open ... THIS TASK DOES NOT CLOSE THE GATE, AND IT DOES NOT OPEN IT." The gate is open;
      that is a state, not evidence.
    excluded_frontiers:
      - 'Executing EXP-GGM-001 version 1. Absolutely out of scope: forbidden by DEC-20260727-007 at sha256 09931848d2dbe55aa998857db9653d763a5b327a2016dd56e8eab942a8a03c56, with RT-20260726-001 OBJ-02 standing.'
      - 'TASK-20260727-009, authoring EXP-GGM-001 version 2 and the superseding H-GGM-001 record. Open and not closed by this batch; it is design work and this batch is deliberately a single-lane measurement.'
      - 'TASK-20260727-010, the conforming review-breakthrough-at-max re-review. Open; AGENTS.md rule 12 stays undischarged for EXP-GGM-001 and DEC-20260727-007 until it runs.'
      - 'TASK-20260727-008, the CORR-20260727-003 knowledge action and the Report 94 demotion of BAR-PATHDYN-CONDTAIL-D2. UNDISCHARGED and currently the goal record''s single next_action. Excluded because adding a curation lane to a batch opened to fix a measurement deficit would reproduce the deficit. knowledge/ is outside every write scope here. See known_open_obligations.'
      - 'TASK-20260727-001, reserved by ESC-20260727-001 section E for the nine-run provenance audit. Reserved and not reused; all BATCH-010 ids are allocated on the new date 2026-07-28 precisely to leave TASK-20260727-007 through -010 undisturbed.'
      - 'Any further idea generation. Report 94 produced 63 candidates and ZERO constructive survivors; the marginal value of a 95th screen is below the value of one measurement.'
      - 'Any crypto-scale claim, live-key target, deployed system, or breakthrough assertion.'

  experiment_approval_recorded_before_dispatch:
    experiment_id: EXP-RT1476-001
    version: 1
    status: approved
    approved_by: coordinator
    approved_by_decision: DEC-20260728-002
    why_this_is_called_out_at_the_top_of_the_batch: >-
      Because its absence is the defect BATCH-009 documented. origin/main executed EXP-GGM-001
      into nine run directories, recorded evidence, moved a hypothesis to supported and promoted a
      knowledge finding while its specification still read status review_required with approved_by
      null and NO APPROVE DECISION EXISTED ANYWHERE. The lifecycle is
      draft -> review_required -> approved -> running, and "approved" is a Coordinator act that
      leaves a record or it did not happen. EXP-RT1476-001 is approved, with approved_by set, in a
      committed decision, BEFORE TASK-20260728-001 is dispatched. No execution may begin until the
      opening commit is verified.
    no_independent_pre_execution_design_review: >-
      NONE EXISTS, and that is a real weakness rather than an oversight. It is named in the
      specification's review_history and in DEC-20260728-002 limitations. The compensating control
      is TASK-20260728-003, which must return a DESIGN-adequacy finding as well as an integrity
      finding, before any evidence record is written. The trade - approve a meter now, review it
      independently in the same batch - is a judgement made against spending a third consecutive
      batch on paper, and a later reviewer is entitled to disagree with it.

  environment_deviation_recorded_not_hidden:
    what: 'Sage is NOT available in this environment. The frozen contract''s reproduction command is a .sage script and cannot be run.'
    substitution: 'Python 3 with sympy and numpy over GF(p), on the in-repo harness/ elliptic-curve and Semaev code.'
    metrics_that_survive:
      - 'backward_state_support_size - exact, by enumeration over at most 21952 triples, uses no computer-algebra system at all. Fully implementation-independent and the most robust number the experiment produces.'
      - 'deg_u of the backward eliminant - a property of the polynomial system over GF(p), not of the CAS computing it.'
      - 'PRS step count - the remainder degree sequence is intrinsic to the input pair, conditional on the declared PRS variant, which the run record must state.'
      - 'ops_success and hence beta_ops - IF AND ONLY IF the counter is a real instrumented integer over a hand-written GF(p) layer. A counted operation is implementation-independent up to the algorithm; a timed one is not. If it cannot be counted, INVALID-7 records it null with the reason rather than substituting a proxy.'
      - 'success_rate, forward_state_size, and certificate verification - combinatorial and group-law facts, CAS-independent.'
    metrics_that_do_not_survive:
      - 'WALL-CLOCK. sympy''s subresultant PRS over GF(p) has entirely different performance characteristics from Sage''s. Wall-clock from this port is NOT comparable to any Sage run, may never fit beta_ops, and may never support a cost claim. It is retained as a diagnostic and as the basis of the timeout rules only.'
      - 'COEFFICIENT BIT-SIZE / the Collins-Brown growth check. VACUOUS over GF(p), where every coefficient is bounded by ceil(log2 p) bits by construction. Recorded not_applicable_over_GF_p with a declared sparsity substitute that carries no conclusion. The contract''s "coefficient blow-up" failure mode is therefore recorded UNTESTED, not absent.'
    risk: >-
      The load-bearing metrics survive and the two that do not are exactly the two that would have
      supported a COST statement. This port can measure the EXPONENT; it cannot support any claim
      about absolute cost, competitiveness with rho, or how the same computation behaves in Sage.

  claim_ceilings_binding_on_every_card:
    claim_tier: toy
    claim_tier_basis: 'mechanical: maximum field 24 bits (16769023 < 2^24), and docs/claims-and-verification.md sets toy at <= 32 bits. Unreachable above at any outcome.'
    maximum_evidence_strength: preliminary
    forbidden_transitions:
      - 'H-RT1476-001 may not move to supported on this run set.'
      - 'reject_scoped on a single unreplicated empirical_only run set is forbidden; an adverse result takes weaken plus replication.'
      - 'GOAL-ECDLP-001 may not move to completed under any outcome (AGENTS.md rule 13; no attestations exist and none may be recorded that was not obtained).'
      - 'No universal impossibility claim from a bounded experiment, in either direction.'
    rule_12_branch: >-
      If the run set is VALID and beta_deg comes back below 0.3, that would OPEN the program's only
      sub-rho window and is a claim in AGENTS.md rule 12's class. TASK-20260728-003 runs at
      review-adversarial/xhigh and DOES NOT discharge rule 12 for it. In that branch the batch
      records the measurement and its scope, records rule 12 UNDISCHARGED, authorizes no sub-rho
      reading, and names a conforming review-breakthrough-at-max re-review as a required successor.

  producer_task_ids: [TASK-20260728-001]
  independent_review_task_ids: [TASK-20260728-003]
  snapshot_archive_task_id: TASK-20260728-002
  ledger_archive_task_id: TASK-20260728-004
  archive_claim_map:
    TASK-20260728-001: TASK-20260728-002
    TASK-20260728-003: TASK-20260728-004
    TASK-20260728-002: TASK-20260728-002
    TASK-20260728-004: TASK-20260728-004
  archive_claim_map_note: >-
    Every non-archive task is claimed by exactly one archive task, and each archive task
    self-archives its own receipt - the TASK-20260727-004 / TASK-20260727-006 pattern. No artifact
    in this batch is unclaimed.
  write_scope_disjointness_check:
    TASK-20260728-001:
      - experiments/EXP-RT1476-001/subresultant_meter.py
      - experiments/EXP-RT1476-001/implementation_notes.md
      - experiments/EXP-RT1476-001/analysis.md
      - experiments/EXP-RT1476-001/results_summary.json
      - experiments/EXP-RT1476-001/runs/
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/tasks/TASK-20260728-001/
    TASK-20260728-002:
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/archives/TASK-20260728-002/
    TASK-20260728-003:
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/validation/TASK-20260728-003/
    TASK-20260728-004:
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/decisions/TASK-20260728-004/
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/archives/TASK-20260728-004/
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/dispatch_queue.json
      - ledger/evidence/EV-RT1476-001.yaml
      - ledger/decisions/DEC-20260728-003.yaml
      - ledger/hypotheses/H-RT1476-001.yaml
      - ledger/goals/GOAL-ECDLP-001.yaml
    verdict: >-
      Pairwise disjoint. experiments/EXP-RT1476-001/specification.yaml is in NO card's write scope:
      it is the frozen protocol and is immutable from the moment of the opening commit. knowledge/
      is in no card's write scope. No two cards may run concurrently in any case (serial chain), so
      no shared-worktree write contention is possible.
    path_shape_note: >-
      Write scopes MAY name directories - a write scope bounds where a task may write and is not
      hash-bound, so experiments/EXP-RT1476-001/runs/ legitimately remains in TASK-20260728-001's
      write scope. artifact_paths may NOT: tools/research_dispatch.py requires every artifact_path
      to be an exact repository-relative FILE path so the archive verifier can hash-bind it. See
      path_shape_repair_before_first_commit.

  path_shape_repair_before_first_commit:
    when: 'Before any commit. Nothing was staged and HEAD was still e77ca6a4.'
    found_by: 'the dispatching session, running tools/research_dispatch.py and a YAML parse over the drafted records'
    defects:
      - id: REPAIR-1
        what: >-
          experiments/EXP-RT1476-001/specification.yaml DID NOT PARSE. The key
          control_comparability_requirements was written at the sequence-item indent level inside
          the controls: block sequence, which terminates the sequence illegally
          (yaml.parser.ParserError: expected <block end>, but found '?').
        fix: >-
          Dedented to 2 spaces so it is a SIBLING of controls:, which is what it always meant: it
          states requirements binding across all three arms of a cell and so cannot belong to one
          arm. Indentation only. No requirement was added, removed or reworded.
      - id: REPAIR-2
        what: >-
          TASK-20260728-001.artifact_paths contained the DIRECTORY
          experiments/EXP-RT1476-001/runs/, and TASK-20260728-002.archive.declared_paths contained
          the same directory with a parenthetical. The dispatcher rejected the queue: a directory
          cannot be hash-bound, which is the entire point of the rule.
        fix: >-
          Replaced by the exact file experiments/EXP-RT1476-001/runs/INDEX.json - a run index the
          Executor writes last, enumerating every run directory and every file inside it - plus a
          MECHANICAL expansion rule in TASK-20260728-002 that stages and individually hash-binds
          every file the index lists, stopping on any index/disk discrepancy. The 27 run records
          remain required deliverables and remain immutable; only the declaration shape changed.
      - id: REPAIR-3
        what: >-
          FOUND WHILE FIXING REPAIR-2, NOT REPORTED BY THE DISPATCHER, AND IT WOULD HAVE FAILED THE
          SAME CHECK ON THE NEXT CARD. TASK-20260728-004.artifact_paths carried the placeholder
          'ledger/decisions/<close-decision-id allocated in phase 1 across the union>.yaml' and its
          write_scope carried 'ledger/decisions/ (the single close-decision file only)'. Neither is
          a path. A deferred identifier would additionally have left that archive committing a path
          it had not declared, failing the "changes exactly the declared paths" check.
        fix: >-
          The close-decision identifier is PRE-ALLOCATED as DEC-20260728-003 and reserved in
          DEC-20260728-001, with TASK-20260728-004 required to reconfirm it free at HEAD across the
          union and to STOP rather than shift. This REVERSES a judgement in the first draft, which
          deliberately deferred the identifier; the reversal and its two concrete reasons are
          recorded in DEC-20260728-001 reserved_identifiers rather than applied quietly.
      - id: REPAIR-4
        what: >-
          ledger/hypotheses/H-RT1476-001.yaml DID NOT PARSE, with the SAME defect class as
          REPAIR-1, in a file the previous round reported as unchanged and therefore never
          checked. The key falsification_scope sat at the sequence-item indent level inside the
          falsification_conditions block sequence (yaml.parser.ParserError, line 161 column 5 /
          line 174 column 5).
        fix: >-
          Dedented to 2 spaces so it is a SIBLING of falsification_conditions:, which is what it
          always meant - it scopes all of F1 through F6 at once and so cannot be one of them.
          Indentation only; no falsification condition was added, removed or reworded.
        method_change_this_defect_forced: >-
          THREE OCCURRENCES OF ONE CLASS IS NOT A COINCIDENCE, AND SPOT-FIXING WHAT THE DISPATCHER
          REPORTS IS THE WRONG METHOD. After REPAIR-4 every YAML file authored for this batch was
          swept STRUCTURALLY rather than read for sense: the indent-and-first-token skeleton of
          each file was extracted with line numbers and scanned for any mapping key at the same
          indent as the items of the sequence it follows. All eight files were swept - the
          specification, this batch record, both decisions and all four handoffs. H-RT1476-001
          line 174 was the only remaining instance. Three apparent hits were identified as text
          INSIDE block scalars, such as "auditable:" and "SURVIVING METRICS:", and were correctly
          left alone rather than "fixed".
      - id: REPAIR-5
        what: >-
          The dispatch queue's task cards carried a handoff_record POINTER but no inline handoff
          OBJECT. tools/research_dispatch.py validate_handoff (line 205) requires tasks[i].handoff
          to be an object, and validate_inference reads the inference block from INSIDE that
          object - so the inference blocks, which sat at task level, were a second latent failure
          the dispatcher had not yet reached because it stops at the first error.
        fix: >-
          The queue was REWRITTEN WHOLESALE rather than patched, because eight surgical edits
          across four cards is exactly how the REPAIR-2 breakage happened. Every card now carries
          a full inline handoff envelope - objective, uncertainty_reduced, inputs, constraints,
          deliverables, artifact_paths, archived_by, inference, budget, completion_gate,
          return_format - alongside the retained handoff_record pointer. A queue-level
          handoff_authority_note states that the LEDGER RECORD is authoritative and that any
          divergence between it and the inline copy is a defect to repair by a new record, never a
          choice between the two.
        third_finding_from_reading_the_validator: >-
          Reading tools/research_dispatch.py rather than inferring from the BATCH-009 precedent
          surfaced a constraint that independently vindicates REPAIR-3 and sharpens the INVALID
          branch. _validate_ledger_archive (line 278) requires a ledger archive to own EXACT
          artifacts under BOTH ledger/evidence/ and ledger/decisions/, with archive.record_ids
          containing the record ID visible in each filename. The deferred close-decision
          identifier could therefore never have satisfied TASK-20260728-004 at all, independent of
          the path-shape rule. It also means that if the run set is INVALID this card cannot be a
          ledger archive, because there is no evidence record to own. That branch is now written
          into the card explicitly - record the defects, return the run set under a scoped
          successor task authorized by a new decision, and close the batch with a
          decision-and-checkpoint commit - together with the instruction NOT to manufacture an
          evidence record to satisfy a validator. A validator that can be satisfied by inventing a
          record is worse than one that blocks.
    substance_unchanged: >-
      These are syntax, path-shape and envelope-shape repairs only. The beta_deg/beta_ops split
      and its two pre-registered thresholds, the anti-tautology rule, the bidirectional CTRL-POS
      meter gate, the success-subset restriction, the toy claim-tier ceiling, the preliminary
      strength ceiling, the adverse prior, every budget figure and every interpretation limit are
      unchanged. No metric, control, criterion, stopping rule or invalidation rule was altered.
      The one substantive addition is the INVALID-outcome branch in TASK-20260728-004, which
      follows from reading the validator and makes an already-implied obligation explicit rather
      than changing what this batch may conclude.
    self_inflicted_breakage_recorded: >-
      One is recorded rather than hidden. The first attempt at REPAIR-2 deleted the
      required_artifacts.per_experiment key and orphaned three sequence items, which would have
      produced a SECOND parse error in the same file the repair existed to fix. It was caught by
      re-reading the edited region and repaired in the same pass, before any declaration of
      readiness. The lesson is the obvious one and is why this entry exists: an edit to a YAML
      record is re-read before the record is declared ready to commit.

  batch_opening_archive:
    kind: snapshot
    owned_by: >-
      No in-queue card. This is the Coordinator batch-opening commit, declared here by the
      Coordinator that authored the batch and executed and verified by the calling session, exactly
      as BATCH-009's opening was. Recorded so the commit is not invisible to the record.
    expected_parent: e77ca6a4
    expected_parent_basis: >-
      The dispatching session reports HEAD at e77ca6a4, clean and pushed. This authoring session
      has NO SHELL: it ran no git command, resolved no ref, computed no SHA-256, made no commit and
      staged nothing, and it asserts that no commit happened. The expected parent is recorded from
      the dispatcher's report and MUST be confirmed against Git by the executing session before
      staging. If HEAD is not e77ca6a4 at commit time, STOP and re-declare rather than committing
      onto an unexpected parent.
    declared_paths:
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/batch.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/dispatch_queue.json
      - experiments/EXP-RT1476-001/specification.yaml
      - ledger/hypotheses/H-RT1476-001.yaml
      - ledger/decisions/DEC-20260728-001.yaml
      - ledger/decisions/DEC-20260728-002.yaml
      - ledger/handoffs/TASK-20260728-001.yaml
      - ledger/handoffs/TASK-20260728-002.yaml
      - ledger/handoffs/TASK-20260728-003.yaml
      - ledger/handoffs/TASK-20260728-004.yaml
    declared_path_count: 10
    record_ids:
      - BATCH-010
      - DEC-20260728-001
      - DEC-20260728-002
      - H-RT1476-001
      - EXP-RT1476-001
      - TASK-20260728-001
      - TASK-20260728-002
      - TASK-20260728-003
      - TASK-20260728-004
    commit_message_requirement: >-
      The message must contain the literal strings BATCH-010, DEC-20260728-001, DEC-20260728-002,
      H-RT1476-001, EXP-RT1476-001, TASK-20260728-001, TASK-20260728-002, TASK-20260728-003 and
      TASK-20260728-004. BATCH-004's ledger archive is permanently blocked at 7 of 8 post-commit
      checks solely because its message omitted its own task id; that failure lives in published
      history and cannot be repaired.
    hash_bindings: >-
      ALL SHA-256 VALUES ARE COMPUTED BY THE CALLING SESSION, from Git object content at the
      resulting commit (git show <commit>:<path> | shasum -a 256), never from the working tree.
      This authoring session computed none and asserts none. path_sha256 must cover all ten
      declared paths.
    post_commit_checks_required:
      - 'the commit resolves'
      - 'it is an ancestor of HEAD'
      - 'its first parent is e77ca6a4'
      - 'it changes exactly the ten declared paths, with no extras and no deletions, and no ._* AppleDouble sibling is staged'
      - 'every recorded SHA-256 matches commit content'
      - 'the message contains every record id and every task id listed above'
    on_failure: >-
      Record the failure and STOP. Dispatch nothing. An archive failure is an evidence-integrity
      failure, never a mathematical result, and EXP-RT1476-001 is not approved in any durable sense
      until this commit verifies.
    gating_effect: >-
      TASK-20260728-001 MUST NOT BE DISPATCHED until this commit is made and accepted. An
      experiment approved by an uncommitted decision is an experiment approved by nothing, and
      executing it would reproduce precisely the EXP-GGM-001 defect this batch is written to avoid.

  goal_record_not_edited_in_this_batch_opening:
    status_unchanged: paused
    why: >-
      Opening this batch changes no official status. GOAL-ECDLP-001 stays paused, its
      campaign_budget.maximum_batches still reads 8, current_batch_id still reads BATCH-009, and
      its single next_action still points at TASK-20260727-008. Extending a budget is authorized by
      a decision record; applying it to the operational anchor is a goal checkpoint, which
      templates/research-records.md restricts to a Coordinator ledger archive. Editing it here
      would also risk clobbering a concurrently running co-driver's next_action from a stale copy.
    interim_inconsistency_recorded: >-
      For the duration of this batch the goal record understates the authorized batch budget (8
      recorded versus 9 authorized), points at BATCH-009, and carries a next_action this batch does
      not execute. Deliberate, recorded in DEC-20260728-001 limitations, remedied by
      TASK-20260728-004. Named so a reader who finds the mismatch knows it was chosen, not missed.
    who_applies_it: TASK-20260728-004

  positive_branch: >-
    If the run set is VALID and beta_deg < 0.3 with beta_ops < 3/2 on the success subset across all
    three sizes with a flat or decreasing trend, and CTRL-POS passed its meter gate, then the
    measurement is consistent with alpha < 3/2 AT TOY SCALE. That would be the first data ever
    obtained on this gate and the first toy-scale reason to look further. IT WOULD NOT BE A
