    preliminary, and would not move H-RT1476-001 to supported. It would license exactly one thing:
    designing a larger scaling study, and commissioning the conforming rule-12 review named above.
  negative_branch: >-
    If the run set is VALID and beta_deg >= 0.3 at any size, or the beta_deg trend increases, or
    beta_ops >= 3/2 on the success subset, then H-RT1476-001 is falsified ON THE TESTED SCOPE -
    these sampled prime-order curves, these three moduli, this x-line factor base at
    L = round(q^(1/5)), the serial-S3 2|3 split at m = 5, this sympy/GF(p) implementation, this
    budget - and the gate closes on that scope only. The landing is weakened plus a replication
    obligation, never rejected and never reject_scoped, because reject_scoped on a single
    unreplicated empirical_only run set is forbidden. It closes nothing about other arities,
    splits, geometries, field sizes, or prime-field ECDLP, and it is not a universal impossibility
    claim.
  intermediate_branch: >-
