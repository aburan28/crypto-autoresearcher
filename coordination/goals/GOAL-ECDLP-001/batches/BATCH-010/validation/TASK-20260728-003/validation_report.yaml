    - id: IF-5
      check: byte-identity across all 27 raw-result.json (INVALID-6 last clause; the EXP-GGM-001 failure mode)
      result: PASS
      detail: >-
        SHA-256 computed in this session over all 27 raw-result.json: 27 files, 27 DISTINCT
        digests, 0 duplicate groups. The same check on certificates.json: 27 distinct. On
        stdout.log: 27 distinct. No two runs with differing inputs are byte-identical. Cross-arm
