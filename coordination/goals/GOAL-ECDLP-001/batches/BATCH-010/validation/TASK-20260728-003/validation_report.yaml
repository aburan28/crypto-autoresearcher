      INVALID-1:
        fired: true
        where: '6 of 9 posctl cells - p=65521 seeds 28/29/30 with 2, 0, 1 certified successes and p=16769023 seeds 28/29/30 with 1, 0, 0, all against a threshold of 5'
        independently_confirmed: true
        consequence_correctly_applied: PARTIALLY
        note: >-
          The rule's consequence "beta_ops is NOT fitted for that cell" is stated correctly in
          analysis.md section 7, but results_summary.json nevertheless fits a posctl
          beta_ops_success series across exactly those cells and reports 0.6223. See ND-1. No
          main or negctl cell is affected: every one has 277-576 certified successes out of 1200.
          The degree/support series is complete for all nine posctl cells because support is
