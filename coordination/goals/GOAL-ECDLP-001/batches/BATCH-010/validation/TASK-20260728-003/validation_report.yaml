    - id: IF-6
      check: control comparability - do the three arms of each cell share p, n, L, seed stream, target count, PRS variant and operation counter, and differ in exactly the one declared respect each?
      result: PASS for CTRL-POS; PASS WITH A DECLARED CONSEQUENCE for CTRL-NEG
      detail_main_vs_posctl: >-
