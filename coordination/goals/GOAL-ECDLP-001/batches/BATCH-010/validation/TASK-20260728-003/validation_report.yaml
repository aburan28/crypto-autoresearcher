        lists, the (r_scalar, x_R) pair is identical - 95 shared-index comparisons across the
        nine cells, 0 disagreements. DIFFERENT: the factor base V only, planted as
        {x([i]P) : i = 1..L}, exactly the one declared respect.
        Downstream differences (|F|, certified-success counts, ops level) are CONSEQUENCES of
        that single change and not additional manipulations; this session verified that V is the
        only differing input.
      detail_main_vs_negctl: >-
        IDENTICAL: p, a, b, n, L, targets_screened, factor base V (verified equal, element by
        element, in all nine cells), resultant routine, counter, module, session, machine.
        DIFFERENT: the three chain links, replaced by random dense trivariates of the same
