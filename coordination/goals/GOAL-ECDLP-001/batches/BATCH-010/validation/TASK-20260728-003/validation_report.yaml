        IF and only if the program wants beta_ops to mean anything, a successor experiment must
        implement a membership query whose cost is NOT bounded by O(q) by construction - e.g. an
        aborting variant, or one that materialises B_R by a product tree - and must state, before
        execution, an upper bound on the implemented query's cost so that the reachability of the
        pre-registered threshold can be checked in advance. Otherwise the 3/2 gate is untestable
        by any experiment in this family.
    - id: SUCC-3
      what: 'A short derivation note establishing 8L^3/3! = (4/3)L^3 for the serial-S3 2|3 backward leg and deg_u = 8L^3 for the implemented eliminant, which would make the two load-bearing facts checkable on paper and scale-free rather than resting on three toy points.'
