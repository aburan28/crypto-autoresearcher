  # =========================================================================
  # 7. CONTROL ADJUDICATION AGAINST INVALID-4 AND INVALID-5
  # =========================================================================
  control_adjudication:

    ctrl_pos_against_invalid_4:
      rule_text: 'INVALID-4: CTRL-POS does not report beta_deg < 0.3 (the meter fails to see the planted threefold exponent drop).'
      the_ambiguity_that_must_be_resolved_first: >-
        The specification defines the metric beta_deg over TWO quantities:
        "fitted slope of log(backward_state_support_size) versus log(q), AND SEPARATELY of
        log(deg_u_backward_eliminant) versus log(q)". INVALID-4 refers to "beta_deg" without
        saying which. The two give OPPOSITE answers on CTRL-POS, so the rule cannot be
        adjudicated without ruling the ambiguity. This session rules it as follows, on the
        specification's own text and not on the outcome: the primary metric is
        backward_state_support_size (metrics.primary[0], and it is the quantity
        preregistered_prediction is written about and the quantity success_criterion S1 names
        first); deg_u is a corroborating quantity that S1 uses only "where available". INVALID-4
        is therefore adjudicated on the SUPPORT series, with the deg_u series adjudicated
        separately and its consequence stated.
      adjudication_on_the_support_series:
        measured_by_this_session: 0.2034 pooled, 0.2029/0.2034/0.2037 pairwise, 0.2020/0.2037/0.2045 per seed, 0.2029-0.2037 under leave-one-prime-out
        condition_beta_deg_ge_0_3: NOT MET
        verdict: 'INVALID-4 DOES NOT FIRE on the support series.'
        consequence_in_terms: >-
          The support meter is demonstrated able to report a value far below 0.3 when the state
          really is that small, under instrumentation identical to the main arm's. The main arm's
          support-based beta_deg is therefore ADMISSIBLE as a measurement in both directions, and
          the bidirectional lock in controls.CTRL-POS.what_it_tests is released FOR THAT SERIES.
      adjudication_on_the_deg_u_series:
        measured_by_this_session: 0.6056 pooled on CTRL-POS, against a planted true exponent of 0.2034
        condition_beta_deg_ge_0_3: MET
        verdict: >-
          INVALID-4 WOULD FIRE on the deg_u series. The eliminant-degree quantity CANNOT see a
          planted factor-q^{0.4} collapse: it returns 8L^3 = 175616 on the positive control at
          L = 28, where the reachable set has 169 elements - an overstatement by a factor of 1039.
        consequence_in_terms: >-
          THE deg_u SERIES IS A DEMONSTRATED-BLIND INSTRUMENT AND CARRIES NO WEIGHT IN EITHER
          DIRECTION. Concretely: (a) success_criterion S1's clause "and, where available,
          corroborated by deg_u_backward_eliminant" is STRUCTURALLY UNAVAILABLE, not merely
          unmet - a quantity that returns 8L^3 regardless of the factor base can never
          corroborate or contradict a claim about the backward state; (b) H-RT1476-001's second
          prediction ("deg_u grows no faster than the support size, with fitted exponent below
          0.3") is untestable by this instrument rather than tested and failed by it; (c) no
          evidence record may cite the deg_u exponent 0.6009 as support for anything, in either
          direction. The producer records the underlying fact correctly in analysis.md section 6
          observation 1 - including the sentence "A reader who reads deg_u as the backward-state
          size would conclude that CTRL-POS shows no collapse, which is false" - but does not
          connect it to INVALID-4. This session makes that connection explicitly, because the
          rule's consequence language is what binds the reviewing Coordinator.
      is_ctrl_pos_genuinely_one_declared_respect_different:
        verdict: YES, VERIFIED MECHANICALLY
        detail: 'see integrity_findings IF-6. V is the only differing input across all nine cells; the target stream is shared and identical on 95 of 95 shared-index comparisons.'
      does_the_planted_state_size_really_come_out_6L_plus_1:
        verdict: YES, WITH A STRUCTURAL EXCEPTION THAT THIS SESSION EXPLAINS RATHER THAN WAIVES
        detail: >-
          Per-target support values on CTRL-POS, counted in this session from raw-result.json:
          at L = 28, EVERY ONE of the 31 measured targets across the three cells returns exactly
          169 = 6*28+1. At L = 9, 32 of 33 return exactly 55 = 6*9+1 (one success target returns
          42). At L = 4, 29 of 30 FAILURE targets return exactly 25 = 6*4+1, while success
          targets return 25 on 14 of 22 and 13-24 on the remaining 8.
          THE EXCEPTIONS ARE STRUCTURAL AND EXPECTED, NOT NOISE: for a target R = [m]P the
          backward state is {x([m-k]P) : k in the index set}, and because x([j]P) = x([-j]P) two
          indices collide whenever k + k' = 2m. For a CERTIFIED SUCCESS on the planted arm, m
          necessarily lies inside a window of size O(L), so at small L the collision is reachable
          and the count folds below 6L+1. At L = 28 the window no longer reaches and the count is
          exactly 6L+1 everywhere. The producer's analysis.md table headlines "25.0, 55.0, 169.0"
          as "measured backward state" when the measured mean at L = 4 is 23.32; the FIT used
          23.3167 (this session reproduced 0.2034 from it), so only the table cell is wrong.
          Recorded as non-blocking defect ND-2.
      could_the_0_203_be_an_artifact_of_the_planting_rather_than_a_demonstration_of_meter_sensitivity:
        verdict: 'IT IS BOTH, AND THE DISTINCTION IS MATERIAL. The control is sound but WEAKER than "the meter is calibrated" suggests.'
        reasoning: >-
          (1) The value is arithmetically forced. V_pos = {x([i]P)} makes the reachable index set
          an interval of 6L+1 integers, so ANY correct implementation of "count the distinct u
          reachable over V^3" must return 6L+1, and 6L+1 with L = round(q^{1/5}) must fit to
          0.2034. Nothing about the meter's sensitivity is inferred from the value itself.
          (2) What the control genuinely establishes is a CORRECTNESS check with a specific and
          non-empty failure class: it excludes the possibility that the support routine returns
          |V|^3, or a constant multiple of it, or any quantity insensitive to the structure of V.
          That failure class is exactly the one that would have manufactured a false 0.6 on the
          main arm, so excluding it is worth having, and EXP-GGM-001's tautological gate is
          precisely what happens when it is not excluded.
          (3) But it is NOT a power calculation and cannot be. backward_state_support_size is
          DEFINED as the exact cardinality of the reachable set and is COMPUTED by exhaustive
          enumeration over V^3 with the group law (this session read the code and re-executed it).
          A quantity computed exactly has no "sensitivity" to calibrate: the only thing a control
          can add is a bug check, which is what this one is. Describing CTRL-POS as showing "the
          meter demonstrably resolves a planted factor-q^{0.4} collapse" is true but flattering;
          the accurate statement is "the enumerator is not blind to the structure of V, and
          returns the true count on an input whose true count is independently known".
          (4) The load-bearing consequence runs the other way: the SAME control, applied to the
          other quantity the specification calls beta_deg, FAILS. That is the informative result
          of CTRL-POS, and it is the part a reader is most likely to miss.
        residual_risk_this_control_does_not_cover: >-
          CTRL-POS does not test the enumerator against a factor base that is unstructured but
          whose reachable set is nevertheless smaller than 8L^3/6. No such input exists in the run
          set, and constructing one is not obviously possible. So the claim "the enumerator would
          detect a collapse in a REALIZABLE factor base" is not established by anything here. It
          is, however, strongly supported by a different argument that needs no control at all:
          the enumerator computes a set cardinality by exhaustion, so its output is correct by
          construction if the group law is correct, and the group law is verified 3191 times.

    ctrl_neg_against_invalid_5:
      rule_text: 'INVALID-5: CTRL-NEG reports beta_deg materially below the generic 0.6 without an explanation derived from the run data.'
      measured_by_this_session: 0.6055 pooled on the support series (0.6102 / 0.6056 / 0.6022 pairwise; 0.5938-0.6126 per seed; 0.6022-0.6102 under leave-one-prime-out)
      condition_materially_below_0_6: NOT MET
      verdict: 'INVALID-5 DOES NOT FIRE.'
      consequence_in_terms: >-
        A system with no elliptic structure at all reproduces the generic exponent, so the meter
        does not under-report on a structureless input. Combined with CTRL-POS on the support
        series, the support instrument is bracketed: it returns 0.2034 where the truth is
        Theta(L) and 0.6055 where the truth is Theta(L^3).
      level_versus_trend: >-
        CTRL-NEG's LEVEL is about 76% of the main arm's at the largest size (22319 vs 29312) and
        support/L^3 is 0.957/1.086/1.017 rather than converging on 4/3. Levels between arms are
        declared non-comparable in controls.CTRL-NEG.comparability_limit_declared, and this
        session confirms the declared reason is visible in the data: a random dense quadratic has
        a GF(p) root only about half the time, which is directly observable as |F| = 11/42/432
        against L^2 = 16/81/784. Only the trend is comparable, and the trend matches.

    bidirectional_consequence_statement_required_by_the_handoff: >-
      STATED IN TERMS. Had CTRL-POS failed to report beta_deg < 0.3 on the primary support
      series, NO PRIMARY CONCLUSION COULD BE DRAWN IN EITHER DIRECTION, and in particular the
      main arm's 0.5985 could NOT then have been read as evidence against H-RT1476-001, because
      a meter that cannot see a drop cannot certify the absence of one. THAT DID NOT HAPPEN on
      the support series: CTRL-POS returned 0.2034 and the lock is released for that series.
      IT DID HAPPEN on the deg_u series, and for that series the lock is NOT released: the
      main-arm deg_u exponent 0.6009 may not be read as evidence against H-RT1476-001, nor for
      it, and must be excluded from any evidence record's reasoning.

  # =========================================================================
  # 8. SUCCESS-SUBSET RESTRICTION CHECK  (the red-team amendment)
  # =========================================================================
  success_subset_restriction_check:
    was_it_formally_honoured: YES
    source_evidence: >-
      subresultant_meter.run_cell builds `succ = [m for m in measured if m["subset"] ==
      "success"]` and computes ops_success_mul/add/inv/total_unit_weighted as the mean over
      `succ` ONLY; ops_all and ops_failure are computed over separate lists and are written to
      separate keys. summarize() fits `beta_ops_success` from
      ops_success_total_unit_weighted and `beta_ops_all` from ops_all_total_unit_weighted into
      two distinct, distinctly named series. ops_all is NEVER pooled into beta_ops_success.
    was_the_success_set_itself_the_right_set: YES
    detail: >-
      On the main and posctl arms the "success" label is assigned by the group-law
      meet-in-the-middle screen and every member carries a certificate that re-verified - it is
      NOT the algebraic root-existence set. This session confirmed from the raw data that the
      measured success targets are drawn from screening.success_target_indices, i.e. from the
      certified set, and that ops_success_values has exactly measured_success_count entries in
      every cell. The specification's rule that a Kummer coincidence is a candidate and not a
      relation until the group law is checked (ASSUM-5) is therefore enforced where it matters.
    was_it_numerically_consequential: NO, AND THIS IS THE IMPORTANT FINDING
    detail_2: >-
      beta_ops recomputed by this session on the three subsets of the MAIN arm:
      ops_success 0.7197, ops_all 0.7195, ops_failure 0.7192. The three agree to 0.0005.
      Per-cell, the ratio ops_success/ops_failure is 1.0000 at both larger sizes and 0.978-1.007
      at p = 1009.
      THE REASON IS IN THE SOURCE: membership_query() iterates over all L^3 factor-base triples
      unconditionally and collects every hit; there is no early exit on the first meet and no
      abort on a failing prefix. A successful query and a failing query therefore perform the
      same work by construction.
      CONSEQUENCE: the red-team amendment - "fit on the successful-membership subset only,
      because early abort helps only the non-relation fraction" - was formally honoured and
      COULD NOT HAVE CHANGED THE ANSWER under this query variant, because this variant has no
      abort to exclude. The amendment's protective function was not exercised. This is a
      statement about the implemented query, not about the mathematics; an aborting variant would
      separate the two series and the amendment would then bite. The producer states this in
      analysis.md section 5.2 and this session confirms it quantitatively.
    is_it_quietly_wrong_in_the_favourable_direction: >-
      NO. The handoff flagged this as "the single most likely place for the result to be quietly
      wrong in the favourable direction". It is not wrong: the restriction is implemented, the
      right set is used, and the unrestricted series is published beside it. It is, instead,
      INERT - which is a different and less serious finding, but one the Coordinator must not
      mistake for the amendment having been satisfied in substance.

  # =========================================================================
  # 9. ANTI-TAUTOLOGY SOURCE CHECK  (the EXP-GGM-001 failure mode)
  # =========================================================================
  anti_tautology_source_check:
    rule_text: 'metric_isolation_rule_anti_tautology: no threshold, expected value or verdict may be visible to the measuring code path; the module must emit no pass/fail verdict; every per-run gate quantity must appear in raw-result.json rather than only in stdout.'
    result: PASS on all three clauses
    clause_1_no_threshold_literal_visible_to_the_measuring_path:
      method: 'this session grepped the full 1816-line module for the literals 0.3, 1.5, 0.6, 0.2, 3/10 and 3/2, and read every function on the measurement path.'
      finding: >-
        ZERO matches. The numbers 0.3, 0.6, 0.2 and 1.5 do not appear anywhere in
        subresultant_meter.py, in any form, let alone on a branch. No expected value and no
        answer key is present. The only floats reaching the module are the timeouts (900.0,
        1800.0) supplied on the command line, and those drive stopping rules, not metrics.
    clause_2_no_pass_fail_verdict_emitted:
      finding: >-
        The module emits no verdict. run_cell returns raw numbers; summarize() returns slopes
        and explicitly records "Slopes only. No threshold, expected value or verdict appears in
        this file or in the module that produced it." No comparison against any criterion occurs
        anywhere in the module. The threshold comparisons live in analysis.md and, independently,
        in this report.
    clause_3_every_per_run_gate_quantity_appears_in_raw_result_json:
      finding: >-
        VERIFIED. raw-result.json carries a `gate_values` block of 25 entries per run holding q,
        log_q, L, forward_state_size, targets_screened, certified_successes, screening_failures,
        success_rate, measured counts, support means and per-target values, deg_u means and
        values, the four operation counters, ops_all, ops_failure, the PRS step count, and the
        two INVALID-7 flags. Every figure this session used for a threshold comparison was read
        out of raw-result.json, not out of stdout.log. No gate quantity exists only in stdout.
    contrast_with_the_precedent: >-
      REV-20260727-002 found EXP-GGM-001's control gate compared two string literals held in the
      same source file, returned 4/4 on every possible execution, and appeared in no run
      artifact. None of those three properties holds here. Every gate in this experiment compares
      a measured quantity against a threshold held outside the measuring module.
    the_operation_counter_is_real:
      required_by: 'metrics.primary.ops_success.instrumentation_requirement and INVALID-7'
      finding: 'PASS. INVALID-7 does not fire.'
      detail: >-
        The counter is class FieldOps with three integer fields (mul, add, inv) incremented
        inside a hand-written polynomial arithmetic layer over GF(p) - padd, psub, pneg, pmul,
        pscal, pdivmod, pexactdiv, peval, ppow, pmonic, pgcd, ppowmod - all written in the module
        over little-endian coefficient lists. Increments are by the actual number of coefficient
        operations performed on that call (e.g. pmul counts one mul and one add per non-zero
        coefficient product actually executed, skipping zeros). It is reset per query
        (F.reset() at the top of membership_query) so per-query counts are isolated.
        NO SYMPY ON THE COUNTED PATH: `import sympy` appears at ten places in the module and this
        session inspected every one - primality (sympy.isprime, before the counter starts),
        curve order primality, the --selftest block, and the environment version string. None is
        inside membership_query or anything it calls. The module's own header states this and the
        source bears it out.
        NO WALL-CLOCK PROXY: wall clock is recorded per query as `seconds` and is used only for
        the deadline check and for reporting. ops_success is never derived from it. The three
        counters are reported separately in every raw record, so any weighting other than the
        declared unit weighting can be applied post hoc without re-running.
      what_the_counter_is_actually_counting: >-
        RECORDED BECAUSE IT CHANGES THE MEANING, NOT THE VALIDITY. The counted work is the
        L^3-triple enumeration: for each (v3, v4, v5) the module computes two small resultants
        (the inner one cached per (v4, v5)) and then evaluates the resulting degree-8 factor at
        every forward-state value. Subresultant PRS proper - prs_remainder_degrees - is invoked
        on only the FIRST `--prs-sample 4` polynomial pairs per query, purely to record a
        remainder-degree sequence, and its cost is a negligible and constant part of the count.
        So ops_success is a faithful, honestly instrumented count OF THE IMPLEMENTED QUERY, and
        the implemented query is a brute-force triple enumeration rather than a PRS over the
        backward eliminant. See design_adequacy_finding DA-2 and DA-3.

  # =========================================================================
  # 10. REPRODUCIBILITY
  # =========================================================================
  reproducibility_check:
    required_by: 'handoff obligation 7 - re-run at least one recorded command and compare raw-result.json on deterministic content'
    cells_re_executed: 5
    which:
      - RUN-RT1476-main-p1009-s20260728
      - RUN-RT1476-main-p65521-s20260729
      - RUN-RT1476-main-p16769023-s20260728
      - RUN-RT1476-negctl-p1009-s20260728
      - RUN-RT1476-posctl-p65521-s20260728
    coverage: 'all three arms and all three field sizes, including the largest and most expensive cell (289 s)'
    method: >-
      Each recorded command was taken verbatim from that run's command.txt, executed with the
      committed subresultant_meter.py at HEAD 777b1e43 against an --out directory OUTSIDE the
      repository, and the resulting raw-result.json compared to the committed one after removing
      six declared-volatile blocks (timing, resources, git, environment, command, argv) and
      per-target wall-clock. certificates.json was compared with no exclusions at all.
    result: 'IDENTICAL in all five cases, for raw-result.json deterministic content AND for certificates.json in full.'
    what_this_establishes: >-
      (a) The recorded seeds reproduce the recorded inputs and every recorded measurement.
      (b) The committed subresultant_meter.py IS the module that produced the committed run set.
      This matters because the module was UNCOMMITTED at execution time - the runs record
      commit e1847fc8 with dirty: true and list
      experiments/EXP-RT1476-001/subresultant_meter.py among the dirty paths - and no manifest
      records a hash of the module. Exact reproduction settles by demonstration what a module
      hash would have settled by declaration.
    what_this_does_not_establish: >-
      Nothing about platform independence. The re-execution used the same machine, the same
      CPython 3.13.1 and the same sympy 1.14.0 as the producer. A defect in that toolchain would
      reproduce faithfully. A different-platform replication is named as a successor task.

  # =========================================================================
  # 11. FIRED STOPPING AND INVALIDATION RULES
  # =========================================================================
  fired_stopping_and_invalidation_rules:
