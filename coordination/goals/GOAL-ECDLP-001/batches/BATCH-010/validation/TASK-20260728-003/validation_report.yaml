        (c) INDEX vs DISK vs GIT: runs/INDEX.json enumerates 189 files with per-file SHA-256.
        Listed-but-absent: 0. On-disk-but-unlisted: 0. Index SHA-256 vs Git object SHA-256
        mismatches: 0. Index byte counts vs Git object byte counts mismatches: 0. Per-run
