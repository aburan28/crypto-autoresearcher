      finding_of_record: >-
        deg_u EQUALS 8 * L^3 EXACTLY ON EVERY ARM at the two larger sizes: 512 = 8*4^3,
        5832 = 8*9^3, 175616 = 8*28^3. Deviations occur only at p = 1009 where individual
