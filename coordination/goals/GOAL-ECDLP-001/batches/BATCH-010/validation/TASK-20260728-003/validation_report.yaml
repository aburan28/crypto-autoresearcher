        underlying_means: {'p=1009': 61.2667, 'p=65521': 791.5833, 'p=16769023': 22319.3500}

    beta_deg_backward_state_support_size_success_subset_only:
      main: {pooled: 0.5982, pairwise: [0.5784, 0.5974, 0.6117], per_seed: [0.5934, 0.6035, 0.5979], leave_one_prime_out: [0.6117, 0.5974, 0.5784]}
      posctl: {pooled: 0.2105, pairwise: [0.1893, 0.2097, 0.2251], caveat: 'built from 3, 2 and 1 cells at the three sizes because six posctl cells have an empty measured success subset; see control_adjudication'}
