    - id: IF-3
      check: seed integrity - does each recorded seed reproduce its recorded inputs?
      result: PASS (demonstrated on 5 of 27 cells by exact re-execution; argued for the rest)
      detail: >-
        DEMONSTRATED: this session re-executed the recorded command of five cells -
