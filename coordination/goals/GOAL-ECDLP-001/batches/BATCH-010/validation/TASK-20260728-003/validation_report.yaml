  # 2. SNAPSHOT VALIDATION AND BINDING
  # =========================================================================
  snapshot_validation:
    repository: /Volumes/Volume/crypto-autoresearcher-worktrees/ecdlp-solve-20260727
    branch: research/ecdlp-solve-20260727
    head_commit: 777b1e43e509c112c50d67d952e5f82dee0beee4
