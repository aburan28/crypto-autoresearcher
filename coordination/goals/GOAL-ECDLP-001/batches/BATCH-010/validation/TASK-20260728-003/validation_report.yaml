      INVALID-2: {fired: 'not an invalidation by its own terms', where: 'curve rejection recorded per cell as required; this session confirmed rejected_candidates and rejection_breakdown present in all 27'}
      INVALID-3: {fired: false, basis: '3191 certificates re-verified in THIS session under three independent implementations, 3191 passing, 0 failing'}
      INVALID-4: {fired: 'NO on the primary support series (0.2034); WOULD FIRE on the deg_u series (0.6056)', consequence: 'see control_adjudication - the support series is released, the deg_u series is locked'}
      INVALID-5: {fired: false, basis: 'CTRL-NEG support exponent 0.6055, not materially below the generic 0.6'}
      INVALID-6:
        fired: false
        basis: >-
          27 distinct raw-result.json digests; 0 missing manifest fields against the AGENTS.md
          artifact policy; recorded seeds reproduce recorded inputs (demonstrated on 5 cells);
          raw/summary agreement to 4.88e-05 on all fifteen slopes; no two runs byte-identical.
        near_miss_recorded: 'the manifest-vs-raw wall_seconds difference (ND-3) is a naming collision between two different measurements, not a raw/summary disagreement; it is recorded so a later reader does not rediscover it as one.'
