    top_level_artifact_hashes_sha256_of_git_object_content:
      'experiments/EXP-RT1476-001/specification.yaml': '73d67e27fa02c786df0730fd06057d1cf8e779105fd42116f005e9e3fd5968dd  (48358 bytes)'
      'experiments/EXP-RT1476-001/subresultant_meter.py': '3010d5de4ddd07057132e836f958a3120744e90a161546d3889407f9de76d6a3  (65133 bytes)'
      'experiments/EXP-RT1476-001/implementation_notes.md': 'ac0fabf5343e2e747432261d9220cd5e3ca7abf751e1f032aa0201f9db79352e  (24979 bytes)'
      'experiments/EXP-RT1476-001/results_summary.json': '45b38ddf6ee9c172a38a5a7f617e416b4ffb3ec03aaf1dc8351d487bb1c950c6  (61948 bytes)'
      'experiments/EXP-RT1476-001/analysis.md': '1bced29baaeb5ac377534421008a04f8771be313194367bc78134265e033236d  (27539 bytes)'
      'experiments/EXP-RT1476-001/runs/INDEX.json': 'b402ef6bfe1a957e0458413bb2b7332d28e88de83982d28b420692b6420ca37b  (57293 bytes)'
      note: >-
        The full 195-path table was computed in this session. It is not transcribed here in
        full; the three load-bearing summary facts are: 195 paths bound, 0 git-vs-worktree
        mismatches, and 189/189 run-file hashes agreeing with INDEX.json (below).
    receipt_cross_check:
      expected_receipt_path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/archives/TASK-20260728-002/snapshot_commit_receipt.json
      status: ABSENT AT HEAD
      evidence: >-
        `git ls-files coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/` returns exactly
        three paths - batch.yaml, dispatch_queue.json and
        tasks/TASK-20260728-001/execution_report.yaml. There is no archives/ directory under
        BATCH-010 at all. Six other batches in this repository DO carry a
        snapshot_commit_receipt.json (BATCH-001/-002/-003 x2/-004/-009), so the artifact class
        exists and this instance is missing rather than unconventional.
      consequence_as_ruled_by_this_session: >-
        The handoff's constraint is "If the binding CANNOT BE ESTABLISHED, STOP and report a
        binding failure instead of a validation verdict." The binding CAN be established and
        was established, by a stronger route than the missing receipt would have provided:
        (i) every reviewed path resolves to a commit reachable from HEAD; (ii) every path is
        clean at HEAD; (iii) SHA-256 computed from Git object content matches the working tree
        for all 195; and (iv) the run set additionally carries its own committed hash manifest,
        runs/INDEX.json, whose 189 recorded SHA-256 values this session verified against the
        Git object content with 0 mismatches. What could NOT be discharged is the specific
        cross-check against the TASK-20260728-002 receipt, because that receipt does not exist.
        This session therefore returns a verdict AND records the missing receipt as
        blocking_defect BD-1 against the ARCHIVE task, not against the run set.
      transparency_note: >-
        This is a judgement call and is flagged as one. A stricter reading of the handoff would
        return CANNOT_DETERMINE on the ground that a named required input is absent. This
        session did not, because returning CANNOT_DETERMINE would have discarded a run set whose
        binding is in fact verifiable and verified, and would have repeated BATCH-009's failure
        in mirror image - spending a batch on process while the measurement went unexamined. The
        cost of the choice is recorded: this validation does NOT discharge the snapshot-receipt
        requirement, and the Coordinator must not treat it as having done so.
      what_would_settle_it: >-
        TASK-20260728-004 (or a corrective task) emits
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/archives/TASK-20260728-002/snapshot_commit_receipt.json
