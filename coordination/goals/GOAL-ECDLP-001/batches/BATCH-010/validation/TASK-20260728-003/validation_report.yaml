  # =========================================================================
  # 12. DESIGN-ADEQUACY FINDING  (SEPARATE FROM THE INTEGRITY FINDINGS)
  # =========================================================================
  design_adequacy_finding:
    scope_note: >-
      THIS SECTION IS NOT AN INTEGRITY FINDING AND MUST NOT BE READ AS ONE. Everything above
      concerns whether the artifacts are what they claim to be. This section concerns whether the
      frozen protocol, as written AND as implemented, was capable of returning a different answer
      than it returned. A protocol can be perfectly executed and still be incapable of being
      wrong. No independent pre-execution design review of EXP-RT1476-001 exists; DEC-20260728-002
      records that and names this task as the compensating control.

    headline_answer: >-
      PARTLY. The protocol contains one gate that COULD have failed and did, one gate that COULD
      NOT have failed, and one measured quantity that could not have taken any value other than
      the one it took. Concretely: the support-based beta_deg test (S1/F1) was a real test and
      H-RT1476-001 could have passed it; the beta_ops test (S2/F3) could not have been failed by
      this implementation at any outcome; and the deg_u series was arithmetically determined
      before any curve was sampled.

    DA-1:
      title: 'The support-based beta_deg gate WAS a real test. It could have returned below 0.3 and did not.'
      basis: >-
        backward_state_support_size is the exact cardinality of the reachable set, computed by
        exhaustive enumeration over V^3 with the group law. Its value depends entirely on the
        input: the same code returns 0.2034 on the planted factor base and 0.5985 on the random
        one, under identical instrumentation, in the same session. There is no path by which the
        implementation forces 0.6. If the backward state of a random x-line factor base really
        did collapse, this instrument would have shown it.
      caveat_that_reduces_the_test_s_informational_content: >-
        The measured answer is also DERIVABLE without any computation, and the derivation was
        available before the run: the backward leg reaches 8L^3 signed triples, the chain sum is
        symmetric in the three factor-base points so ordered triples collapse by 3! = 6, giving
        8L^3/6 = (4/3)L^3 distinct u. Measured support/L^3 = 1.3573, 1.3507, 1.3353, converging
        on 4/3 = 1.3333. So the main-arm result CONFIRMS AN ELEMENTARY COUNT rather than
        discovering an exponent. That does not weaken the test - H-RT1476-001 asserted the count
        was wrong by a factor of q^{0.3}, and it is not - but it does bound what the run set adds
        over a paragraph of arithmetic, and the Coordinator should price it accordingly.
      could_this_step_have_failed: YES

    DA-2:
      title: 'The beta_ops gate COULD NOT have failed. F3 (beta_ops >= 3/2) was arithmetically unreachable before any curve was sampled.'
      derivation_from_the_implemented_code: >-
        membership_query performs L^3 iterations. Each iteration computes at most two resultants
        of polynomials whose degrees are bounded by 4 in the eliminated variable and 2 in u -
        bounded independently of q - and then evaluates a degree-8 polynomial at every element of
        the forward state. Therefore
        ops_per_query <= L^3 * (c1 + c2 * |F|) with c1, c2 absolute constants.
        This session measured |F| = L^2 EXACTLY on the main arm at all three sizes (16, 81, 784),
        so ops_per_query = O(L^5) = O(q) identically, for ANY curve, ANY factor base and ANY q.
        Hence beta_ops <= 1 + o(1) < 3/2 was FORCED by the choice of query algorithm, not
        discovered.
      numerical_confirmation_computed_in_this_session: >-
        Fitting c1 and c2 from the two larger sizes only gives
        ops_per_query = L^3 * (5428.5 + 15.9142*|F|), which predicts the SMALLEST cell - which
        was not used in the fit - to within 1.5% (363,723 predicted vs 369,134 measured). The
        two-term model explains the rising pairwise slopes exactly: as the c2*|F| term overtakes
        c1, the exponent walks from 3/5 toward 1, which is precisely the observed 0.6165 ->
        0.7158 -> 0.7908, and the asymptote is beta_ops -> 1.0, not 0.72.
      consequence_stated_in_terms: >-
        (a) The pre-registered success clause S2 ("beta_ops < 3/2") is MET but carries ZERO
        INFORMATION: it could not have been unmet. A gate that returns the same answer on every
        possible execution is exactly the defect REV-20260727-002 found in EXP-GGM-001's control
        gate, in a different guise - there the operands were two string literals, here the
        threshold sits at 3/2 while the measured quantity is bounded above by 1 by construction.
        (b) The red team's Omega(q^{3/2}) prior was made about subresultant PRS on an eliminant
        of degree ~q. This experiment ran a different algorithm on a different object. The
        measurement therefore neither confirms nor refutes that prior - it does not address it.
        (c) The pooled 0.7197 is not an exponent. It is a point on a crossover between q^{3/5}
        and q^{1}, and its instability under leave-one-prime-out (0.6165 to 0.7908) is the
        crossover being visible in three points.
      could_this_step_have_failed: NO
      is_the_executor_s_own_caveat_correct: >-
        YES, AND IT UNDERSTATES THE POINT. analysis.md caveat 1 says the measured beta_ops is
        below 3/2 for an arithmetic reason - the eliminant has degree 8L^3 = 8q^{3/5} rather than
        ~q, so the red team's premise did not hold - and calls this "the single most important
        thing for the Validator to attack". This session attacked it and confirms it, with one
        correction that makes it stronger: it is not only that the eliminant is smaller than the
        red team assumed, it is that the COST FUNCTION ACTUALLY COUNTED is bounded by O(q) by the
        structure of the loop, independently of the eliminant's degree. A naive reader could
        mistake 0.72 for a sub-rho signal; it is not one, and the reason it is not is stronger
        than the reason the producer gives.

    DA-3:
      title: 'The deg_u series could not have taken any value other than 8L^3, so its exponent 0.6 was determined before execution.'
      basis: >-
        The module computes deg_u as `deg_sum`, the SUM over all L^3 factor-base triples of the
        degree of that triple's resultant G. Each G has u-degree 8 generically (the resultant in
        w1 of a polynomial of w1-degree 2 and u-degree 2 against one of w1-degree 4). Hence
        deg_sum = 8L^3 whenever no factor degenerates, which is what the data shows: 512, 5832
        and 175616 are exactly 8L^3 at L = 4, 9, 28, on ALL THREE ARMS, with departures only at
        p = 1009 where individual factors occasionally collapse.
      consequence: >-
        deg_u is a count of non-degenerate triples times 8. It is a function of L alone. Fitting
        an exponent to it recovers 3 * (1/5) = 0.6 by arithmetic. It measures nothing about the
        backward state, which is why CTRL-POS returns 0.6056 on it while the true state exponent
        is 0.2034, and why deg_u/support on CTRL-POS reaches 1039 at L = 28. This is the same
        fact as the INVALID-4 deg_u adjudication in section 7, restated as a design property:
        the specification names as a primary metric a quantity that its own implementation cannot
        vary.
      could_this_step_have_failed: NO

    DA-4:
      title: 'The red-team amendment (fit on successes only) could not have changed the answer.'
      basis: 'see success_subset_restriction_check. The implemented query has no early abort, so ops_success, ops_all and ops_failure agree to 0.0005 on the main arm.'
      could_this_step_have_failed: 'NO, under this query variant. It is a live restriction only for an aborting variant, which was not implemented.'

    DA-5:
      title: 'Conclusions this protocol STRUCTURALLY CANNOT SUPPORT, at any outcome.'
      list:
        - 'Any statement about absolute cost, about competitiveness with rho or BSGS, or about how the computation would behave in Sage. DEV-1 already declares wall-clock non-surviving, and this session confirms no cost comparison exists anywhere in the run set.'
        - 'Any statement that the backward eliminant''s DEGREE collapses or does not collapse (DA-3).'
        - 'Any statement about the cost of a subresultant PRS on the backward eliminant, since the cost-bearing path is a triple enumeration and PRS is sampled on 4 pairs per query as a diagnostic (DA-2).'
        - 'Any statement that H-RT1476-001''s heuristic HEUR-002 - that a single power law describes the support size - holds. Three points cannot establish a power law. H-RT1476-001 says so itself and caps the hypothesis below supported independently of any measured value.'
        - 'Any statement about coefficient blow-up. B_R is never materialised as a coefficient vector, so the frozen contract''s named failure mode is UNTESTED, not absent. results_summary.json records this as an explicit null with a reason, which is the correct handling.'
        - 'Any statement about a realizable factor base having a small backward state. CTRL-POS uses the discrete logarithms of its own elements and is a calibration, not an attack.'
        - 'Anything at all about cryptographic-size curves. Largest field 24 bits.'

    DA-6:
      title: 'Specification defects visible from the run data, recorded because a design review would have caught them.'
      list:
        - 'The specification asserts |F| <= L(L+1)/2 for the forward state. The implementation measures |F| = L^2 exactly (16, 81, 784), because the forward leg admits both signs: L(L+1)/2 sums plus L(L-1)/2 differences equals L^2. The specification''s bound is arithmetically wrong by a factor of about 2. It changes no conclusion, but |F| is the load-bearing quantity in the ops model (DA-2), so the slip is not cosmetic.'
        - 'The specification defines beta_deg over two quantities and then writes INVALID-4 about "beta_deg" without saying which, leaving the single most important gate in the experiment ambiguous in a case where the two readings disagree. Ruled in section 7.'
        - 'The specification sets INVALID-1 at "fewer than 5 certified successes" but sets no analogous floor for the number of CELLS behind a size-point of a fit, which is how posctl beta_ops came to rest on single cells with one measured success (ND-1).'
        - 'sampling_design.stage_B_measurement anticipates "expected order 10" certified successes per cell and the realised figure on the main arm is 277-576, so the Stage-B cap of 10 successes plus 10 failures discards 96-98% of the available success subset. This is a declared budget choice and does not bias the mean, but it means the per-cell means rest on 10 targets when hundreds were available, which is the cheapest available improvement to the fit''s precision.'

  # =========================================================================
  # 13. RECOMMENDED CEILINGS  (RECOMMENDATIONS ONLY - CHANGE NOTHING)
  # =========================================================================
  recommended_claim_tier:
    value: toy
    basis: >-
      MECHANICAL, NOT DISCRETIONARY. docs/claims-and-verification.md sets the toy tier at max
      field bit size <= 32; the three moduli are 10, 16 and 24 bits. Unreachable above at any
      outcome.
  recommended_proof_status:
    value: empirical_only
    basis: >-
      No theorem is proved and none is claimed. The two architectural identities this session
      confirmed - deg_u = 8L^3 and support -> (4/3)L^3 - ARE derivable and could be written as a
      derivation note, but they are derivations ABOUT the implemented architecture, not proofs
      about ECDLP, and the run set as such remains empirical_only.
  recommended_evidence_strength_ceiling:
    value: preliminary
    basis: >-
      Binding on three independent grounds, any one of which suffices:
      (i) EXP-RT1476-001 interpretation_limits fixes maximum strength at preliminary for the
      first execution and forbids reject_scoped on a single unreplicated empirical-only run set;
      (ii) H-RT1476-001 interpretation_limits repeats it and adds that HEUR-002 is unvalidatable
      by this experiment, which caps the hypothesis below supported independently of any value;
      (iii) three size-points spanning a factor of 2.4 in log q, with both pairwise-slope
      sequences turning, cannot carry more.
  recommended_scope_reductions_binding_on_any_evidence_record:
    - id: SR-1
      text: >-
        Any evidence record may cite ONLY the backward_state_support_size series. The
        deg_u_backward_eliminant series must be excluded from the reasoning in both directions:
        it failed the CTRL-POS test at 0.6056 against a planted 0.2034 and is a demonstrated-blind
        instrument (control_adjudication, DA-3).
    - id: SR-2
      text: >-
        Any evidence record must state that beta_ops = 0.7197 carries no weight for or against
        the red team's Omega(q^{3/2}) prior, because F3 was arithmetically unreachable under the
        implemented query (DA-2). "beta_ops < 3/2" must not appear as a satisfied criterion
        without that qualification attached in the same sentence.
    - id: SR-3
      text: >-
        Any evidence record must state that the main-arm support result reproduces an elementary
        count, 8L^3/6 = (4/3)L^3, that was derivable in advance (DA-1). Its evidential content is
        "the generic count is not violated at three toy sizes", not "an exponent was discovered".
    - id: SR-4
      text: >-
        The posctl beta_ops figure 0.6223 must not be cited at all: INVALID-1 fires on the cells
        it is fitted from (ND-1).
    - id: SR-5
      text: >-
        Falsification-condition arithmetic, recorded for the Coordinator to adjudicate and NOT
        adjudicated here: on the support series this session's recomputation gives beta_deg =
        0.5985 pooled, minimum pairwise 0.5790, so F1 (beta_deg >= 0.3 at any size) is met at
        every size and on every slope; adjacent-pair slopes are 0.5790 then 0.6119, so F2
        (pairwise slopes increasing with q) is met; support/L^3 = 1.3573, 1.3507, 1.3353 against
        a generic 4/3, so F4 (agrees with the generic count) is met. F3 is not met but is
        uninformative per SR-2. WHETHER THOSE ARITHMETIC FACTS CONSTITUTE FALSIFICATION, AND AT
        WHAT STRENGTH, IS THE COORDINATOR'S TO DECIDE AND NOT THIS SESSION'S. Note the standing
        prohibition: reject_scoped on a single unreplicated empirical-only run set is forbidden
        by both the experiment and the hypothesis records.
  strongest_refutation_artifact_the_result_admits_if_adverse:
    ranked:
      - rank: 1
        kind: counterexample_certificate
        available: NO
        why: >-
          A counterexample certificate would be an explicit factor base and target exhibiting a
          backward state materially below (4/3)L^3. No such object exists in this run set and
          none is constructible from it. The planted CTRL-POS factor base is NOT one: it uses
          the discrete logarithms of its own elements and is unrealizable by an attacker.
      - rank: 2
        kind: derivation_note
        available: YES, AND THIS IS THE STRONGEST ARTIFACT ACTUALLY ADMITTED
        content: >-
          A short note deriving, without computation, that the serial-S3 2|3 backward leg reaches
          8L^3 signed triples whose sum is symmetric in the three factor-base points, giving
          8L^3/3! = (4/3)L^3 distinct u and hence beta_deg = 3/5 exactly at balanced sizing; and
          separately that the implemented membership query costs L^3(c1 + c2|F|) with |F| = L^2,
          hence Theta(q). Both are checkable on paper, both are corroborated to three significant
          figures by the measurement, and together they explain every headline number in the run
          set. A derivation note is a stronger refutation artifact than nine toy cells because it
          is scale-free in a way the measurement is not - though it is a statement about THIS
          architecture and sizing only, and proves nothing about other splits or arities.
      - rank: 3
        kind: declared_empirical_only
        available: YES
        content: 'the nine main-arm cells as measured, scoped to the tested curves, moduli, geometry, split, implementation and budget.'

  # =========================================================================
  # 14. DEFECTS
  # =========================================================================
  blocking_defects:
    - id: BD-1
      severity: blocking_for_the_archive_task_not_for_the_run_set
      against: TASK-20260728-002
      what: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/archives/TASK-20260728-002/snapshot_commit_receipt.json
        does not exist at HEAD. The handoff names it as "the binding for everything you review".
        Six other batches in this repository carry this artifact, so its absence is an omission
        rather than a convention.
      why_it_is_blocking: >-
        Not because the binding failed - this session established it independently from Git
        object content and from the committed runs/INDEX.json hash manifest, with 0 mismatches
        across 195 paths - but because the Coordinator's own dispatch contract requires the
        receipt before a state transition, and BATCH-009 already proceeded past a missing
        snapshot receipt once. Admitting this run set as evidence without emitting the receipt
        would set that precedent twice.
      concrete_fix: >-
        Before writing any evidence record for EXP-RT1476-001, emit
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/archives/TASK-20260728-002/snapshot_commit_receipt.json
        recording: commit 777b1e43e509c112c50d67d952e5f82dee0beee4; parent
        e1847fc8496cfa4dab04671300b78552e1f21a56; the staged path list; and per-path SHA-256 over
        Git object content. The 189 run-file values may be copied verbatim from runs/INDEX.json,
        which this session verified against Git object content with 0 mismatches; the six
        remaining values are in snapshot_validation.top_level_artifact_hashes above. Then have
        the post-commit verifier accept it.

  non_blocking_defects:
    - id: ND-1
      what: >-
        results_summary.json reports a posctl beta_ops_success series (pooled 0.6223) fitted
        across cells on which INVALID-1 fires. The p = 65521 point averages cells with 2 and 1
        measured successes; the p = 16769023 point is one cell with 1. analysis.md section 7
        states the rule's consequence correctly ("beta_ops is NOT fitted for those cells") while
        results_summary.json fits them anyway. The two artifacts contradict each other on a
        pre-registered invalidation rule.
      impact: >-
        Low. The posctl beta_ops figure carries no conclusion anywhere. But it is a
        pre-registered rule not applied where it fires, which is exactly the class of slip that
        matters most in a pre-registered protocol.
      concrete_fix: >-
        In a superseding results_summary, emit posctl beta_ops_success as null with reason
        "insufficient_success_subset under INVALID-1 at p = 65521 and p = 16769023", keeping the
        per-cell ops_success values in the cells block for anyone who wants them. Do not
        overwrite the committed file; supersede it.
    - id: ND-2
      what: >-
        analysis.md section 4.1 headlines the CTRL-POS row "measured backward state | 25.0, 55.0,
        169.0" when the measured seed-averaged means are 23.32, 54.61, 169.00. 25 and 55 are the
        THEORETICAL 6L+1, not the measurement. The parenthetical per-cell values immediately
        after are correct, and the FIT used the true measured means (this session reproduced
        0.2034 from 23.3167 / 54.6061 / 169.0), so no number downstream is affected.
      impact: 'Presentational. A reader taking the headline row at face value would believe the planted prediction was matched exactly at every size, which it is not at L = 4 and L = 9.'
      concrete_fix: 'In any superseding analysis, label the row "measured (theoretical 6L+1)" and print 23.32 (25), 54.61 (55), 169.00 (169).'
    - id: ND-3
      what: >-
        manifest.yaml run.timing.wall_seconds and raw-result.json timing.wall_seconds carry the
        same name and different values in all 27 runs (e.g. 1.157 vs 0.471; 289.109 vs 288.352).
        The manifest figure is the driver's process-level measurement including interpreter
        start; the raw figure is the in-process measurement. Neither is wrong; the collision is
        undeclared.
      impact: 'Low, but it is a raw-versus-manifest disagreement on its face and a future reviewer will have to re-derive the explanation.'
      concrete_fix: 'Rename the manifest field to wall_seconds_process (or add a note) in any future run wrapper, and record the relationship once.'
    - id: ND-4
      what: >-
        CTRL-NEG differs from the main arm in the declared respect (randomized chain links) AND,
        as a forced consequence, in how targets are drawn: with no group law there is no [r]P, so
        negctl targets are uniform field elements and r_scalar is null in all negctl records.
        The specification declares the differing SUCCESS PREDICATE in
        comparability_limit_declared but does not declare the differing TARGET DRAW.
      impact: 'Low. It is a consequence of the one declared change, not a second manipulation, and the required shared quantity (target COUNT = 1200) is shared.'
      concrete_fix: 'Add the target-draw difference to CTRL-NEG.comparability_limit_declared in any version-2 specification.'
    - id: ND-5
      what: >-
        execution_report.yaml runtime_receipt.total_wall_clock_seconds is 1827.1. This session
        computes 1797.3 from the 27 raw-result.json and 1816.4 from the 27 manifests. Neither
        reproduces 1827.1.
      impact: 'Negligible in magnitude (0.6%) but it is a reported figure that reproduces from no artifact.'
      concrete_fix: 'State the definition alongside the figure, or report the manifest sum 1816.4 which is reproducible.'
    - id: ND-6
      what: >-
        subresultant_meter.git_state does `subprocess(...).stdout.strip()` and then slices each
        line at [3:]. The leading strip removes the first line''s leading space, so the FIRST
        entry of git.dirty_paths in every raw-result.json has its first character cut:
        "xperiments/EXP-SIG-008/..." instead of "experiments/...". All other entries are correct.
      impact: 'Cosmetic. dirty_path_count is computed from the unsliced lines and is correct (30).'
      concrete_fix: 'Use `.stdout` without the outer strip, or slice with `ln[3:] if ln.startswith((" ", "M", "?")) else ln` after splitlines.'
    - id: ND-7
      what: >-
        certificates.json carries an unconditional certificate_kind_note reading "none: the
        negative control replaces the S_3 chain by random dense polynomials, so there is no group
        law and no relation to certify" - on MAIN and POSCTL files where certificate_kind is
        "decomposition" and count is up to 515. The same text is copied into
        manifest.result.certificate.kind_note on every arm. The note is emitted unconditionally
        by the module regardless of arm.
      impact: >-
        Low but genuinely misleading: a reader auditing a main-arm certificate file is told, in
        that file, that there is no relation to certify.
      concrete_fix: 'Emit the note only when arm == "negctl"; on the other arms emit the decomposition-kind note.'
    - id: ND-8
      what: >-
        No manifest records a SHA-256 of subresultant_meter.py, and the module was uncommitted
        (dirty) at execution time under commit e1847fc8. The identity of the executed code rests
        on assertion in the committed artifacts.
      impact: >-
        Would have been serious; it is not, because this session re-executed five cells with the
        committed module and reproduced the committed artifacts exactly. Recorded so the next
        experiment does not rely on a validator being willing to re-execute.
      concrete_fix: 'Record sha256 of every source file on the measurement path in run.code of each manifest.'
    - id: ND-9
      what: >-
        The specification asserts the forward state satisfies |F| <= L(L+1)/2; the implementation
        measures |F| = L^2 exactly. The specification omitted the difference points x(P1 - P2).
      impact: 'No run artifact is wrong. But |F| is the load-bearing quantity in the cost model (DA-2), so the specification understates the query cost by about a factor of 2 in its own terms.'
      concrete_fix: 'Correct the bound to |F| <= L^2 in a version-2 specification.'

