          summand_x_signs vector's x-values match the materialised summand points.
        checked: 3191
        passing: 3191
        failing: 0
    failures_named: 'NONE. There are no failures to name.'
    structural_facts_checked: >-
      Every certificate has exactly 5 summands (distinct summand counts observed: [5] only).
      Summand x-coordinates lying outside the run's factor base: 0 of 15955 summands.
      Certificate curve mismatching the run curve: 0. Sign-vector/point mismatch: 0.
    producer_verifier_independence_assessed: >-
      The producer applied two verifiers, harness.semaev.verify_decomposition_certificate and
      subresultant_meter.independent_recheck. This session read the latter's source: it
      reimplements on-curve membership and the group law from modular arithmetic directly and
      imports nothing from harness.toycurve, so the producer's claim of two separate
      implementations is CORRECT, not a relabelling of one routine. This session's V2 is a third.
    invalid_3_adjudication: 'INVALID-3 DOES NOT FIRE. No claimed success failed independent re-verification under any of three implementations.'
    observations_about_certificate_quality_not_defects:
      - >-
        43 of 3191 certificates (1.35%) contain the target's own x-coordinate among the five
        summands - i.e. R = R + (four summands cancelling). These are mathematically valid
        5-term decompositions over V: they occur exactly when x_R happens to lie in V, which has
        probability |V|/q, and ALL 43 occur at p = 1009 where |V|/q = 4/1013. Zero occur at the
        two larger sizes.
      - >-
        397 of 3191 certificates (12.44%) contain a proper sub-multiset of 2 to 4 summands
        summing to the identity, i.e. the relation is effectively shorter than 5 terms. Again
        concentrated at the smallest size: 292 of the 397 are at p = 1009 (about 24% of that
        size's certificates), 48 at p = 65521 (5.5%), and only 8 at p = 16769023 (0.9%).
      - >-
        NEITHER IS A DEFECT and neither invalidates anything: a shorter relation is still a
        relation, ops_success is essentially independent of which target is queried (see
        success_subset_restriction_check), and the specification does not require non-degenerate
        relations. They are recorded because they are one more reason the p = 1009 cell is a weak
        anchor for a three-point fit, which is already flagged in the specification's own
        interpretation_limits and in the producer's caveat 3.

  # =========================================================================
  # 6. INDEPENDENTLY RECOMPUTED EXPONENTS
  # =========================================================================
  independently_recomputed_exponents:
    blinding_status_disclosed_honestly: >-
      PARTIAL, NOT FULL. The handoff required the exponents to be recomputed before opening
      results_summary.json and analysis.md, and that ORDER WAS OBSERVED: this session read
      specification.yaml and subresultant_meter.py, extracted the 27 raw-result.json, computed
      every fit, and only then opened results_summary.json and analysis.md. However, the
      dispatching prompt that launched this session STATED the producer's headline values
      (beta_deg 0.5985 / 0.2034 / 0.6055 and beta_ops 0.7197 / 0.6223 / 0.6812) before any work
      began. This session was therefore NOT blind to the target numbers, and its agreement with
      them is correspondingly weaker evidence than a truly blind recomputation would be. It is
      disclosed here rather than allowed to be assumed. What survives the disclosure: the fits
      are deterministic least squares on data this session extracted itself, so the agreement is
      checkable by anyone; and the leave-one-prime-out and per-seed variants below were NOT
      disclosed in advance and were computed freely.
    method: >-
      For each arm and each metric: group the nine cells by p; take the arithmetic mean of
      log(q) over the three seeds of that p and the log of the arithmetic mean of the metric
      over those seeds; fit an ordinary least-squares slope through the three resulting
      (log q, log value) points. This reproduces the producer's `series` aggregation. All
      pairwise slopes, all per-seed slopes, an all-nine-cell OLS and a leave-one-prime-out
      re-fit were computed additionally. q is the MEASURED group order n of each sampled curve,
      never p.

    beta_deg_backward_state_support_size_all_measured_targets:
