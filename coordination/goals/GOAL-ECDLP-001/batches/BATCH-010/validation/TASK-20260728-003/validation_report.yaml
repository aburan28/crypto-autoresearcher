  # =========================================================================
  # 5. CERTIFICATE VERIFICATION
  # =========================================================================
  certificate_verification:
    total_certificates_in_the_run_set: 3191
    distribution: >-
      3191 across the 18 group-law cells (main: 291-515 per cell; posctl: 50, 54, 61 at p=1009
      and 2, 0, 1 and 1, 0, 0 at the two larger sizes). Zero in the nine negctl cells, correctly,
