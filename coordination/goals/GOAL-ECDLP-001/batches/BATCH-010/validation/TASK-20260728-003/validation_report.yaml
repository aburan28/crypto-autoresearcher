      - id: V1
        what: harness.semaev.verify_decomposition_certificate
        note: 'the verifier named in the specification, imported from harness/ at HEAD; it rebuilds the curve from the certificate and checks on-curve membership and the group-law sum.'
        checked: 3191
        passing: 3191
        failing: 0
      - id: V2
