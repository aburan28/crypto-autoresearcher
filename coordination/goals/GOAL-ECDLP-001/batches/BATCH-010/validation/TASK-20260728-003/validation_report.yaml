validation_report:
  id: VAL-20260728-001
  id_allocation_note: >-
    VAL-20260728-001 verified free across the whole repository at HEAD 777b1e43: a
    repository-wide search for the string "VAL-20260728" returns no match, and the maximum
    existing VAL identifier on any earlier date is VAL-20260724-928. Allocation is on a new
    date, strictly above the maximum of the union, never into a gap.
  task_id: TASK-20260728-003
  batch_id: BATCH-010
  goal_id: GOAL-ECDLP-001
  experiment_id: EXP-RT1476-001
  hypothesis_id: H-RT1476-001
  authorizing_decisions: [DEC-20260728-001]
  produced_at: '2026-07-28'
  produced_at_precision: >-
    Date only from the environment's declared current date. This session executed shell
    commands and computed every hash and every exponent in this report itself, but it made no
    commit and asserts that none happened. Durability is TASK-20260728-004's.

  # =========================================================================
  # 0. WHAT THIS DOCUMENT IS AND IS NOT
  # =========================================================================
  standing_disclaimers:
    - >-
      NOTHING IN THIS REPORT IS EVIDENCE FOR OR AGAINST ECDLP HARDNESS. It concerns the
      admissibility of one run set of two exponents measured on prime fields of at most 24
      bits. It says nothing about cryptographic-size curves, prime-field ECDLP, index calculus
      at any relevant scale, KN-OPEN-001, H-GGM-001, or any other live record.
    - >-
      A VALIDATED RUN SET IS NOT A VALIDATED CONCLUSION. Everything below concerns receipt and
      control integrity. It establishes that the artifacts are what they claim to be and that
      the reported numbers reproduce. It does NOT establish what those numbers mean for
      H-RT1476-001, does not assign evidence strength, and does not close or open the
      RT-1476-SUBRES-A1 gate.
    - >-
      A TIMEOUT, CRASH, MEMORY EXHAUSTION OR PROCESS DEFECT IS NEVER NEGATIVE MATHEMATICAL
      EVIDENCE ABOUT H-RT1476-001 (AGENTS.md rule 5). No stopping rule fired in this run set,
      so the point is recorded pre-emptively rather than applied.
    - >-
      THIS SESSION RECOMMENDS CEILINGS. It changed no record status, wrote no evidence record,
      edited nothing under experiments/, ledger/ or knowledge/, and made no commit. It did not
      re-run the experiment as a whole; it re-executed five of the twenty-seven recorded
      commands into a scratch directory outside the repository for reproducibility, and
      re-verified certificates. Both are permitted by the handoff.
    - >-
      RULE 12 BRANCH NOT REACHED. The handoff's inference block provides that IF the run set
      were valid AND beta_deg came back below 0.3 - i.e. if the measurement would OPEN the
      program's only sub-rho window - that reading would fall in AGENTS.md rule 12's class and
      would require a separate review-breakthrough-at-max session, which this validation would
      not discharge. beta_deg did not come back below 0.3 on any arm except the planted
      positive control, so the branch is NOT reached and no rule-12 successor is triggered by
      this report.

  # =========================================================================
  # 1. INDEPENDENCE ATTESTATION
  # =========================================================================
  independence_attestation:
    non_origination:
      specification_EXP_RT1476_001: >-
        NOT AUTHORED BY THIS SESSION. experiments/EXP-RT1476-001/specification.yaml is supplied
        by commit e1847fc8 and was read here for the first time as an input.
      hypothesis_H_RT1476_001: >-
        NOT AUTHORED BY THIS SESSION. Read as an input.
      decision_DEC_20260728_001: 'NOT AUTHORED BY THIS SESSION.'
      decision_DEC_20260728_002: 'NOT AUTHORED BY THIS SESSION.'
      execution_TASK_20260728_001: >-
        NOT PERFORMED BY THIS SESSION. This session did not write subresultant_meter.py, did not
        write the driver, did not run the 27 cells, did not write any manifest, raw-result.json,
        certificates.json, INDEX.json, results_summary.json or analysis.md, and did not write
        the execution report.
      snapshot_TASK_20260728_002: >-
        NOT PERFORMED BY THIS SESSION. Commit 777b1e43 was made by another session.
    model_correlation_statement: >-
      DISCLOSED RATHER THAN ASSUMED ABSENT. This validating session resolves the SAME model
      identifier as the Executor session that produced the run set: claude-opus-5 in both cases
      (Executor: TASK-20260728-001 execution_report.yaml inference.resolved_model_id and every
      run manifest run.inference.resolved_model_id; Validator: this session). The sessions are
      independent in context, prompt, task and toolchain, and this session formed its numbers
      from raw-result.json before opening results_summary.json or analysis.md. They are NOT
      independent in model weights. Any correlated blind spot in that model - a shared
      misconception about resultant degrees, about what a positive control establishes, or
      about the difference between a fitted exponent and an arithmetic identity - would be
      shared by both sessions and would not be caught by this review. A genuinely
      model-independent check of the substantive findings would require either a different
      model family or a human reader; the "one check a third party could run on paper" in
      adversarial_notes.md is written specifically to make that possible without a computer.
    what_this_session_did_itself:
      - 'Resolved and hashed all 195 committed EXP-RT1476-001 paths from Git object content.'
      - 'Read subresultant_meter.py source before accepting any reported number.'
      - 'Recomputed beta_deg and beta_ops from the 27 raw-result.json files - pooled, per-seed, all pairwise, all-cell, and leave-one-prime-out - BEFORE opening results_summary.json or analysis.md.'
      - 'Re-verified all 3191 certificates with harness.semaev.verify_decomposition_certificate AND with a from-scratch group law written in this session.'
      - 'Re-executed 5 of the 27 recorded commands and compared deterministic content byte-for-byte.'

