      STOP-1: {fired: false, basis: 'stopping_rules_fired is [] in all 27 raw-result.json; max single query 14.1 s against a 900 s rule'}
      STOP-2: {fired: false, basis: 'max single cell 289.1 s against an 1800 s rule'}
      STOP-3: {fired: false, basis: 'total 1797.3 s (raw) / 1816.4 s (manifests) against a 7200 s budget'}
      STOP-4: {fired: false, basis: 'the protocol was implemented; five deviations were declared in advance in deviations_from_frozen_contract, none of them a blocking obstruction'}
