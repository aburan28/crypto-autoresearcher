  # =========================================================================
  # 1. THE VERDICT THIS DETERMINATION RESTS ON, QUOTED VERBATIM
  # =========================================================================
  validator_verdict_verbatim:
    source: coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/validation/TASK-20260728-003/validation_report.yaml
    validation_report_id: VAL-20260728-001
    terminal_verdict: VALID_WITH_SCOPE_REDUCTION
    verdict_rationale_quoted_verbatim: >-
      VALID as a receipt. The run set clears every integrity check this session could construct,
      and clears several by a wider margin than any prior artifact in this repository: 195 paths
      bound to Git object content with 0 mismatches; 189 of 189 run-file hashes independently
      confirmed against the committed runs/INDEX.json; 27 of 27 raw-result.json byte-distinct;
      27 of 27 manifests complete against the AGENTS.md artifact policy with 0 missing fields;
      3191 of 3191 certificates re-verified in this session under three independent
      implementations with 0 failures; 5 of 27 cells re-executed from the committed module and
      reproduced byte-identically on deterministic content and in full on certificates; all
      fifteen reported pooled slopes recomputed here from raw data and agreeing to 4.88e-05; no
      threshold, expected value or verdict anywhere in the measuring module; the operation counter
      a genuine instrumented integer over a hand-written GF(p) layer with no sympy and no
      wall-clock on the counted path; the success-subset restriction genuinely implemented on the
      certified group-law set. CTRL-POS is one-declared-respect different, verified mechanically,
      and CTRL-NEG likewise up to a forced consequence. INVALID-3, -4 (on the primary series), -5,
      -6 and -7 do not fire; INVALID-1 fires exactly where the producer says it does.
      WITH SCOPE REDUCTION, on four grounds that are about what the run set can SUPPORT and not
      about whether it is genuine. (1) The deg_u series fails the CTRL-POS test - it returns 0.6056
      where the planted truth is 0.2034 - so one of the two quantities the specification calls
      beta_deg is a demonstrated-blind instrument and must carry no weight in either direction.
      (2) The beta_ops gate could not have failed: the implemented query costs L^3(c1 + c2|F|) with
      |F| = L^2, i.e. O(q), so beta_ops <= 1 < 3/2 was forced before any curve was sampled, and
      "S2 met" is an uninformative outcome of the same family as the tautological gate
      REV-20260727-002 found in EXP-GGM-001. (3) The main-arm support result reproduces an
      elementary count, 8L^3/6 = (4/3)L^3, derivable in advance and matched to three significant
      figures, so it confirms rather than discovers. (4) The posctl beta_ops series is fitted
      across cells on which INVALID-1 fires. Separately, the TASK-20260728-002 snapshot receipt is
      absent, which this session records as a blocking defect against the archive task rather than
      against the run set, because the binding was independently reconstructed and verified.
      NOT INVALID, because nothing about the artifacts is false, missing, stale or inconsistent in
      a way that would make them inadmissible; NOT CANNOT_DETERMINE, because every question the
      handoff posed was answerable from the committed artifacts plus re-execution; NOT plain VALID,
      because admitting this run set without SR-1 through SR-5 attached would let a reader conclude
      from it things the protocol structurally cannot support.
    recommended_next_action_quoted_verbatim: >-
      ARCHIVE THIS REPORT UNDER TASK-20260728-004 AND, BEFORE ANY EVIDENCE RECORD IS WRITTEN,
      EMIT THE MISSING TASK-20260728-002 snapshot_commit_receipt.json (BD-1); THEN admit the
      EXP-RT1476-001 run set as toy-tier, empirical_only, preliminary-strength evidence carrying
      ONLY the backward_state_support_size series, with scope reductions SR-1 through SR-5 recorded
      verbatim in the evidence record's limitations. Exactly one action, sequenced: the receipt is a
      precondition of the admission, not a parallel task.
    branch_taken: >-
      VALID_WITH_SCOPE_REDUCTION is one of the two verdicts under which
      TASK-20260728-004.conditional_paths admits an evidence record. THE INVALID BRANCH IS NOT
      TAKEN: EV-RT1476-001 IS created, H-RT1476-001 IS transitioned, and this card IS a ledger
      archive owning artifacts under both ledger/evidence/ and ledger/decisions/ as
      tools/research_dispatch.py _validate_ledger_archive requires.
    bd_1_precondition_discharged: >-
      The validator's sequencing requirement is MET BEFORE this determination writes an evidence
      record. coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/archives/TASK-20260728-002/snapshot_commit_receipt.json
      now EXISTS and is committed, recording commit 777b1e43e509c112c50d67d952e5f82dee0beee4,
      parent e1847fc8496cfa4dab04671300b78552e1f21a56, 195 declared paths with per-path SHA-256
      recomputed from Git object content, and post_commit_verification verdict PASS. It records its
      own lateness and is not backdated. This authoring session verified none of that itself and
      rests on the executing session's report plus the committed file; if the receipt is NOT
      committed at or before HEAD 843b05f6, phase 2 must STOP and record the failure rather than
      proceed.

