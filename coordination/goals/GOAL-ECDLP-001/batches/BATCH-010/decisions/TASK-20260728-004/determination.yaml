  produced_at_precision: >-
    Date only. This authoring session has NO SHELL. It ran no git command, resolved no ref,
    computed no SHA-256, staged nothing, made no commit, and asserts that no commit happened.
    Every hash binding, commit identity and parentage is computed and verified by the executing
