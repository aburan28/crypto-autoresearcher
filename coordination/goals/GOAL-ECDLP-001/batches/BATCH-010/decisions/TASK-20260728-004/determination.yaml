      certificate_refs: 'the 18 group-law certificates.json paths; 3191 certificates, all re-verified under three implementations with 0 failures; the nine negctl cells carry none by construction and are not listed'
      observations: 'OBS-1..OBS-7: the one real measurement; the elementary count reproduced; beta_ops structurally uninformative; deg_u demonstrated blind; both controls and the exact limit of CTRL-POS; HEUR-001 falsified as written (rule 8); the red-team amendment honoured and inert'
      boundaries: '8 entries, from instances and moduli through implementation, budget, fit and the explicit not-an-attack boundary'
      unresolved_confounds: '7 entries, including model correlation, platform, three turning points, module identity by demonstration, coefficient_profile untested, self-test in no committed artifact, Stage-B subsampling'
      scope_reductions_carried_verbatim: [SR-1, SR-2, SR-3, SR-4, SR-5]
      reviewed_by: coordinator
    proposed_decision_record:
      install_path: ledger/decisions/DEC-20260728-003.yaml
      authored_in_phase_1: true
      id: DEC-20260728-003
      decision: weaken
      target_ids: [H-RT1476-001, EXP-RT1476-001, EV-RT1476-001, RT-1476-SUBRES-A1, BATCH-010, GOAL-ECDLP-001]
      rationale: 'R-1..R-11: S1 not met; the corroboration clause structurally unavailable; F1/F2/F4 with the CTRL-POS precondition satisfied; the pre-registered band reported unrounded; S2 struck as unreachable; the four version-1 specification defects; the exact limit of CTRL-POS; the refutation-artifact ladder; RT-1476-SUBRES-A1 closed on the tested scope with rule 12 undischarged for any program-level reading; HEUR-001 falsified as written in the favourable direction; what the batch cost and bought'
      evidence_refs: [EV-RT1476-001, VAL-20260728-001, EXP-RT1476-001, 'plus the six exact artifact paths']
      limitations: '11 entries'
      knowledge_promotion:
