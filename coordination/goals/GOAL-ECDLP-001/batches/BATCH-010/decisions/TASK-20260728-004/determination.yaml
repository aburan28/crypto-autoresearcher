  # =========================================================================
  # 3. THE DETERMINED LANDING
  # =========================================================================
  determined_landing:
    hypothesis: H-RT1476-001
    from: specified
    to: weakened
    scope: >-
      ON THE TESTED SCOPE ONLY: these nine sampled ordinary prime-order curves, the three moduli
      1009 / 65521 / 16769023 (10, 16 and 24 bits), an x-line factor base at L = round(q^(1/5)) =
      4, 9, 28, the serial-S3 2|3 split at m = 5 at a shared Kummer coordinate, this sympy/GF(p)
      implementation on one machine, and this budget. It closes nothing about other arities, other
      splits, other factor-base geometries, larger fields, or prime-field ECDLP, and it is not a
      universal impossibility claim.
    basis_in_one_paragraph: >-
      Success criterion S1 (beta_deg < 0.3 on backward_state_support_size) is NOT MET under any
      reading: pooled 0.5985, minimum pairwise 0.5790, leave-one-prime-out spread 0.033, per-seed
      spread 0.011, success-subset 0.5982 - every cut at least 0.279 above the gate. Falsification
      conditions F1 (beta_deg >= 0.3 at any size) and F4 (agreement with the generic Theta(L^3)
      count: support/L^3 = 1.3573, 1.3507, 1.3353 against 4/3, within 2% at every size with no fit
      involved) are MET, with the precondition both frozen criteria attach - CTRL-POS having passed
      INVALID-4 - satisfied on the primary support series at 0.2034. F2 is met arithmetically and is
      evidentially weak on three points. The measurement was independently recomputed from the 27
      raw files by a non-originating session to within 4.88e-05 of the reported value, on a quantity
      that is an exact set cardinality computed by exhaustion rather than an estimate.
    rejected_alternatives_reasoned_by_name:
      - landing: supported
        why_not: 'FORBIDDEN by three prior records and contradicted by the data. The measurement is adverse.'
      - landing: rejected
        why_not: >-
          `rejected` asserts the mechanism is wrong rather than unsupported at these sizes. Nine
          toy curves at at most 24 bits on one implementation license no such assertion.
      - landing: reject_scoped
        why_not: >-
          FORBIDDEN OUTRIGHT on a single unreplicated empirical_only run set by
          docs/claims-and-verification.md, by EXP-RT1476-001 interpretation_limits, by H-RT1476-001
          interpretation_limits and by BATCH-010 claim_ceilings. An adverse result takes weaken plus
          replication.
      - landing: inconclusive
        why_not: >-
          THE CLOSEST CALL, AND IT IS THE RIGHT LANDING FOR TWO OF THE THREE SERIES BUT NOT FOR THE
          HYPOTHESIS. It would be correct if the meter were not demonstrated able to see a drop, or
          if the data could not discriminate between "the state collapses" and "the meter cannot see
          the collapse". Neither holds for the support series: CTRL-POS returned 0.2034 under
          identical instrumentation, the quantity is exact rather than estimated, and the answer is
          stable under every cut. beta_ops and deg_u ARE inconclusive - structurally so - and the
          records say exactly that; but a hypothesis carries one status and its primary prediction
          was tested by an admissible instrument and was not borne out.
      - landing: analyzed
        why_not: >-
          AN UNDERSTATEMENT, AND A POST-HOC DEPARTURE FROM THE PRE-REGISTRATION. `analyzed` takes no
          position on direction. Taking no position would present a stable, exact, independently
          recomputed adverse measurement as carrying no information, and BATCH-010's negative_branch
          fixed the landing as "weakened plus a replication obligation" before any data existed.
          Softening a pre-registered landing after seeing the outcome is what pre-registration
          exists to prevent.
      - landing: running
        why_not: 'Execution is complete: 27 of 27 runs completed_valid, no stopping rule fired, run package archived and validated.'
      - landing: 'specified (unchanged)'
        why_not: >-
          It would assert the hypothesis is still UNTESTED - which is what DEC-20260727-007
          correctly recorded for H-GGM-001, whose experiment never ran. EXP-RT1476-001 ran, its run
          set validated, and its primary prediction was measured.
    fields_changed_on_the_hypothesis_record:
      count: 1
      field: status
      not_repaired_here: >-
        status_basis still describes the pre-execution position, and HEUR-001's formula is now known
        to omit a 2^5 sign factor. AGENTS.md rule 4 forbids repairing an immutable record in place.
        Both are assigned to a superseding hypothesis record (SUCC-5). Nothing else in the file is
        touched.

  # =========================================================================
  # 4. THE TWO PRE-REGISTERED CRITERIA, RULED
  # =========================================================================
  criterion_rulings:
    S1:
      text: 'beta_deg < 0.3 on backward_state_support_size and, where available, corroborated by deg_u_backward_eliminant.'
      ruling: NOT MET
      measured: 'pooled 0.5985; pairwise 0.5790 / 0.5978 / 0.6119; per-seed 0.5940 / 0.6053 / 0.5968; all-nine-cell OLS 0.5987; leave-one-prime-out 0.6119 / 0.5978 / 0.5790; success-subset 0.5982'
      ambiguity_ruled_on_the_text_not_the_outcome: >-
        The specification defines beta_deg over TWO quantities and writes INVALID-4 about "beta_deg"
        without saying which; the two disagree, so the ambiguity had to be ruled. It is ruled on the
        specification's own text: backward_state_support_size is metrics.primary[0], is what
        preregistered_prediction is written about, and is what S1 names first; deg_u is corroborating
        "where available".
      corroboration_clause: >-
        STRUCTURALLY UNAVAILABLE, not merely unmet. deg_u = 8L^3 exactly on every arm and returns
        175616 on the positive control whose reachable set has 169 elements - an overstatement by
        1039x - so read as a state-size meter it FAILS INVALID-4. Consequently H-RT1476-001's SECOND
        prediction is UNTESTABLE by this instrument and is NOT counted against the hypothesis, and
        the deg_u exponent 0.6009 is excluded from the reasoning in both directions.
      preregistered_band: >-
        REPORTED AS AN OBSERVATION AND NOT ROUNDED. The pooled 0.5985 falls in band (b)
        [0.3, 0.6) by 0.0015 - a margin an order of magnitude below the leave-one-prime-out spread
        of 0.033 - so THE POOLED FIT DOES NOT DISCRIMINATE BETWEEN BAND (b) AND BAND (c). The
        largest pairwise slope is 0.6119, above 0.6, and support/L^3 converges on 4/3 from above at
        every size. Determination: band (b) by the pooled number, band (c) in substance. What is not
        in doubt under any reading, and all this decision relies on, is that beta_deg is far above
        0.3.
    S2:
      text: 'beta_ops < 3/2, fitted on ops_success only.'
      ruling: STRUCK AS UNREACHABLE. NOT COUNTED AS MET.
      derivation: >-
        membership_query performs L^3 iterations, each computing at most two resultants of
        polynomials whose degrees are bounded independently of q and then evaluating a degree-8
        polynomial at every element of the forward state, so ops <= L^3(c1 + c2|F|). |F| = L^2 was
        MEASURED exactly at all three sizes (16, 81, 784), so ops = O(L^5) = O(q) for any curve, any
        factor base and any q, whence beta_ops <= 1 + o(1) < 3/2 was FORCED BEFORE ANY CURVE WAS
        SAMPLED. A two-parameter fit from the two larger sizes predicts the held-out smallest cell
        to 1.5%. The pooled 0.7197 is not an exponent: pairwise slopes rise monotonically 0.6165 ->
        0.7158 -> 0.7908 with leave-one-prime-out spread 0.174, asymptoting to 1.0.
      why_struck_rather_than_recorded_met: >-
        Counting a criterion that returns the same answer on every possible execution as satisfied is
        exactly what BATCH-009's REV-20260727-002 condemned in origin/main's EXP-GGM-001 control
        gate. The mechanism differs - there, two string literals in one source file; here, a
        threshold at 3/2 against a quantity bounded above by 1 by a loop - and the epistemic content
        is identical: none. F3 is symmetrically neither met nor unmet, and the red team's
        Omega(q^{3/2}) prior is NOT ADDRESSED by this run set.
      recorded_as: >-
        A SPECIFICATION DEFECT OF EXP-RT1476-001 VERSION 1 (SPECDEF-RT1476-001-A), against the
        protocol and not against the Executor, who implemented the frozen contract faithfully,
        declared five deviations in advance and flagged this very point as the thing most worth
        attacking. The specification is frozen and is NOT edited; the correction is a superseding
        version 2 (SUCC-2), which must implement a query whose cost is not bounded by O(q) by
        construction and must state, before execution, an upper bound on that query's cost so the
        reachability of its own threshold is checkable in advance.
      the_uncomfortable_finding_recorded_in_terms: >-
        BATCH-010 was opened partly to avoid this defect class and installed an anti-tautology rule
        that WORKED at the source level - the literals 0.3, 0.6, 0.2 and 1.5 appear nowhere in the
        1816-line module, no verdict is emitted, every gate quantity is in raw-result.json. THE RULE
        POLICED THE CODE; THE LOOP STRUCTURE FORCED THE ANSWER ANYWAY. Source-level anti-tautology
        discipline is necessary and not sufficient. The missing control is a pre-execution cost bound
        checked against the pre-registered threshold.

  # =========================================================================
  # 5. REFUTATION-ARTIFACT BASIS  (required before an adverse transition)
  # =========================================================================
  refutation_artifact_basis:
    required_by: 'agents/coordinator.md and docs/claims-and-verification.md, "Refutation artifacts: proof before rejection".'
    rank_1_counterexample_certificate:
      available: false
      why: >-
        It would be an explicit factor base and target exhibiting a backward state materially below
        (4/3)L^3. No such object exists in the run set and none is constructible from it. The planted
        CTRL-POS factor base is not one: it is built from the discrete logarithms of its own elements
        and is not attacker-constructible.
    rank_2_derivation_note:
      argument_exists: true
      archived_at:
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/validation/TASK-20260728-003/adversarial_notes.md
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/validation/TASK-20260728-003/validation_report.yaml
        - experiments/EXP-RT1476-001/analysis.md
      archived_before_this_decision: >-
        YES. analysis.md is supplied by commit 777b1e43; the two validation artifacts are committed
        at or before HEAD 843b05f6, which is this archive's declared parent. The artifact precedes
        the decision that relies on it, as the contract requires.
      content: >-
        The serial-S3 2|3 backward leg reaches 8L^3 signed triples; the chain sum is symmetric in the
        three factor-base points, so ordered triples collapse by 3! = 6, giving 8L^3/6 = (4/3)L^3
        distinct u and beta_deg = 3/5 exactly at L = round(q^(1/5)). Checkable on paper in five
        minutes; corroborated to three significant figures by the measurement.
      status_not_claimed: >-
        proof_status on EV-RT1476-001 is empirical_only, NOT derivation, for three stated reasons:
        no standalone self-contained note is archived with the experiment as the doc describes
        (SUCC-3); no session resolving a different model has checked it; and BATCH-010's ceiling
        binds. Upgrading is available to a SUPERSEDING evidence record after SUCC-3. It is not
        back-filled here.
    rank_3_declared_empirical_only:
      available: true
      declared: true
      content: 'The nine main-arm cells as measured, scoped to the tested curves, moduli, geometry, split, implementation and budget. THIS IS THE DECLARED BASIS.'

