  determined_at: 2026-08-02
  no_datum_existed_from_this_contract_when_written: true

  reasoning:
    - >-
      THE CONTRACT DECIDES THE CALIBRATION QUESTION IN ADVANCE AND CHOOSES THE
      STRICTER READING AGAINST ITS OWN INTEREST. It adopts one-sample whenever the
      treatment arm appears, on the stated ground that the inferential target is
      the population of C(512,2) pairs of the frozen (p,a,b,FB), relative to which
      the treatment has no draw and only the null is random. That is the reading
      that makes BATCH-028's number look WORSE, and the contract says so in terms.
      It also states the opposing red-team argument fairly and answers it by
      naming it a different inferential target rather than dismissing it.
    - >-
      ARM 1 IS CALIBRATION-ROBUST BY CONSTRUCTION, which is the property that makes
      it decisive. At m8 the one-sample critical value is 0.001593 and the
      unequal-size two-sample value is 0.004780, so PLATEAU rejects under BOTH
      readings and DECAY not-rejects under BOTH. The calibration dispute therefore
      does not decide ARM 1, which is exactly what a successor to BATCH-028 needed.
    - >-
      THE UNRESOLVABLE GAP IS DECLARED RATHER THAN DISCOVERED. A1-INTERMEDIATE is
      a first-class named outcome, not a residual, and the contract states the
      exact multipliers that would close it (14.1x, 31.7x, 56.4x for delta =
      0.0024, 0.0016, 0.0012) with the recommendation that a larger multiplier be
      approved NOW, pre-datum, if that range is wanted. It also states the
      structural floor that no null enlargement can pass while n_T is capped at
      C(512,2).
    - >-
      ARM 2's SUPPORT IS DERIVED, NOT FITTED. The square-discriminant support is
      obtained from the roots of S_3 being x(P_i +/- P_j), so the null stays
      independent of the treatment; a support fitted to the observed treatment
      would have been circular. The contract also pre-commits that NOT-DETECTED
      does NOT clear the mismatch, and names "cleared", "resolved", "harmless",
      "irrelevant" and "ruled out" as FORBIDDEN WORDS on that outcome. That is the
      question the red team asked of BATCH-028 and it is answered before the data.
    - >-
      CORR-20260802-757677 COMPLIANCE IS STRUCTURAL. No approved_by key, no
      evidence_eligible key, no self-declaration of standing. INTEG-H makes the
      EXECUTOR halt if this record is absent, not APPROVED, or names a different
      hash -- the gate is armed by the party that would otherwise bypass it.

  A_COORDINATOR_SIDE_PROBE_EXISTS_AND_I_HAVE_SEEN_ITS_RESULT:
    what_happened: >-
      AT THE USER'S DIRECT REQUEST, AND BEFORE THIS APPROVAL WAS WRITTEN, THE
      COORDINATOR RAN THE 8x NULL ENLARGEMENT AT CELL-16 AS AN EXPLORATORY PROBE
      OUTSIDE THIS LIFECYCLE. It is not evidence: no contract governed it, no
      approval preceded it, no reviewer has seen it. It is disclosed here because
      concealing it would be the actual misconduct.
    what_it_read:
      D1_null_x1: 0.004808280332681103
      D8_null_x8: 0.0036329653864970446
      note: >-
        The probe's D1 reproduces BATCH-028's recorded 0.004808 exactly, which is
        the check that its instrument is right. An earlier version of the probe
        read 0.0481 -- ten times the reference -- because it measured mid-tie in a
        statistic where every prime contributes exactly z = 1. That error was
        caught only because it disagreed with a number an independent validator
        had already reproduced bit-exactly.
    where_it_lands_in_THIS_CONTRACT_S_BANDS: >-
      A1-PLATEAU. D8 = 0.003633 is at or above the plateau threshold 0.003215, and
      is 2.28x the one-sample critical value 0.001593. On the probe's reading the
      separation does NOT decay under an 8x null.
    why_this_does_not_contaminate_the_CONTRACT: >-
      The freeze task ran as a separate agent with no knowledge of the probe and
      no channel to it. The bands 0.001593 / 0.003215 were derived from m8 and
      D_028 alone. The contract is uninfluenced.
    WHY IT MAY CONTAMINATE THIS APPROVAL, STATED PLAINLY: >-
      I WROTE THIS APPROVAL KNOWING THE LIKELY OUTCOME. A reviewer should treat
      the determination as INFORMED BY UNOFFICIAL DATA and discount it
      accordingly. Concretely, the risk is that I approved an 8x multiplier
      because I already knew 8x would produce a decisive PLATEAU rather than an
      A1-INTERMEDIATE, when a disinterested approver might have funded a larger
      multiplier up front. I did NOT reduce scope, weaken a rule, or adjust a band
      on the strength of the probe, and the bands were not mine to set.
    the_coordinator_reading_that_was_WRONG_and_is_corrected_here: >-
      On first seeing the probe the Coordinator reported that D falling from
      0.004808 to 0.003633 was "consistent with noise" and "dissolves the
      calibration question". THAT WAS WRONG. Against this contract's
      pre-registered band the same numbers read PLATEAU -- the separation
      PERSISTED. Eyeballing "D got smaller" instead of comparing against a decay
      criterion is precisely the error pre-registration exists to prevent, and the
      frozen band caught it.

  binding_on_the_executor:
    - Read this record before the first datum and HALT if it is absent, not APPROVED, or names a different hash.
    - Apply the frozen bands as written. Do not consult the probe, cite it, or let it influence any reported value.
    - An A1-INTERMEDIATE outcome is a real result and must be reported as such, not resolved by appeal to the probe.

