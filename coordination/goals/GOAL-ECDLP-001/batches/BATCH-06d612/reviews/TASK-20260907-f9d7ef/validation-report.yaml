  findings:
  - finding: F1_exact_arithmetic_description_is_false_for_one_certificate
    kind: contradictory
    joint_effect: breaks
    sources:
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/source/symbolic_audit.py:365
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/implementation.md
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/runs/RUN-ECDLP-a5f766-002/symbolic-certificates.json
    observation: Fv_series = sp.expand(9 * (1 / 3 - t * 6 / 9)) evaluates Python 1 / 3 as a float. Reconstructing
      only this expression in memory with SymPy 1.14.0 gives 3.0 - 6*t and a Float atom 3.00000000000000. This contradicts
      the implementation and certificate method descriptions that no float enters any certificate and all arithmetic
      is exact over QQ.
    scope: Only the F_V expansion subcheck in group 5 is demonstrated to use a float. The t*6/9 term is symbolic
      division, not another Python float division. No numerical disagreement was found.
    independent_check: Using Rational(1,3) and Rational(6,9) gives exactly 3 - 6*t, with coefficients (3,-6), agreeing
      with the recorded values. This audit does not change the archived producer certificate.
    cheapest_correction: Archive an additive exact rational certificate and correct the exact-only description through
      a Coordinator-authorized correction record; any implementation or new execution is a separate authorized task.
      Preserve both existing runs.
  - finding: F2_characteristic_rejection_is_not_isolated
    kind: control_sensitivity_gap
    joint_effect: breaks
    sources:
    - experiments/EXP-ECDLP-a5f766/approved-contract-v2.yaml
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/runs/RUN-ECDLP-a5f766-002/rejection-controls.json
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/source/symbolic_audit.py:202
    observation: 'All four fixtures reject. For char_3=(p=3,A0=3,B0=-11,n=3), every compound guard is false: characteristic,
      invertible A0, invertible n, and smoothness. In-memory removal of the characteristic guard leaves accepted=false.
      The recorded rejection therefore cannot independently establish the named characteristic guard, as required
      by the frozen independent-predicate control.'
    scope: The source does contain the characteristic check, and its predicate evaluates false. The other three
      fixtures each fail only their named guard. This is a test isolation gap, not evidence that a bad input was
      accepted.
    cheapest_correction: Use an additive control clarification or authorized repair that exposes each named predicate
      result independently, or supplies a characteristic fixture with otherwise valid defaults where possible. Do
      not overwrite the frozen fixture or count the present rejection as an isolated guard-sensitivity test.
  - finding: F3_start_timestamp_is_not_a_UTC_start
    kind: contradictory
    joint_effect: breaks
    sources:
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/runs/RUN-ECDLP-a5f766-002/manifest.json
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/source/symbolic_audit.py:63
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/source/symbolic_audit.py:688
    observation: started_utc=1970-01-09T04:43:29Z, finished_utc=2026-09-07T21:53:17Z, and total_wall_seconds=2.678
      cannot represent the same elapsed interval. The driver formats time.monotonic() as an epoch timestamp with
      time.gmtime(state.t_start).
    scope: The elapsed monotonic measurements are separate from this timestamp bug. No reliable wall-clock start
      is recoverable from the supplied artifacts.
    cheapest_correction: Record the historical UTC start as unavailable in an additive receipt qualification unless
      an existing external launcher log supplies it. Future receipts must record time.time()/UTC separately from
      a monotonic timer.
  - finding: F4_runtime_command_and_dirty_scope_binding_is_incomplete
    kind: missing_or_self_reported
    joint_effect: inconclusive
    sources:
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/runs/RUN-ECDLP-a5f766-001/manifest.json
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/runs/RUN-ECDLP-a5f766-002/manifest.json
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/runs/RUN-ECDLP-a5f766-002/environment.json
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/source/symbolic_audit.py:656
    observation: PD-1 declares that two executor subagent attempts returned empty and the dispatching OpenCode session
      executed in-process. The manifest hardcodes the model and runtime description; no model probe, resolved provider
      field, served reasoning effort, or launcher/session evidence is supplied. model_verified=false is honest.
      Run002 command is sys.argv joined as text, omitting the Python launcher, quoting and stdout/stderr capture
      command. dirty_tree=true is measured, but the claim that dirt is only untracked run artifacts is an unconditional
      note; raw porcelain was not retained.
    producer_declared_model: fireworks-ai/accounts/fireworks/models/qwen3p8-2p4t-a95b
    producer_declared_policy: executor-implementation
    producer_declared_fallback_used: false
    producer_declared_degraded_requirements: []
    scope: Environment records Python 3.12.8, SymPy 1.14.0, macOS 26.6 arm64 and an executable path. These are retained
      self-reports, not independently measured historical environment. No Bedrock identifier appears in the supplied
      selected-runtime fields; absence of external telemetry is not proof about an unobserved backend. Downstream
      independent review does not retroactively establish PD-1 producer dispatch provenance.
    cheapest_correction: Bind any existing launcher/inference/dirty-status records in an additive receipt. Otherwise
      explicitly retain the missing fields and qualify the process claim; do not invent telemetry or retroactive
      permission.
  - finding: F5_cost_endpoint_and_stop_enforcement_are_incomplete
    kind: missing_measurements_and_contradictory_implementation_claim
    joint_effect: breaks
    sources:
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/runs/RUN-ECDLP-a5f766-002/metrics.json
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/runs/RUN-ECDLP-a5f766-002/manifest.json
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/runs/RUN-ECDLP-a5f766-002/execution-report.md
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/implementation.md
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/source/symbolic_audit.py:81
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/source/symbolic_audit.py:632
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/source/symbolic_audit.py:693
    observation: All four stage times exist in execution-report.md and are below the frozen ceilings, but immutable_artifact_production
      is absent from both JSON timing maps because they are serialized before its timer is finalized. Metrics total=2.673
      and manifest total=2.678 are earlier endpoint samples; the four reported stages sum to 2.679276290931739 seconds.
      Initialization/imports precede the timer, and report writing/final hashing follow it. CPU time is not measured.
      Peak RSS=67371008 bytes is sampled during stage4, not after final artifact work. No full process end-to-end
      cost is established.
    implementation_observation: STAGE_BUDGETS is declared and copied to the manifest but never compared against
      stage durations. check_budget enforces only total wall and sampled RSS, is not called after stage4, and has
      no CPU check. Several scientific flags are checked after the entire grid rather than at the first bad row.
      The implementation description that every stage ceiling and stop rule is enforced is therefore too broad.
    scope: No actual ceiling overrun is demonstrated. Present measured stage samples and nominal RSS are small.
      No CPU value is inferred from wall time, and advisory research budgets are not treated as an authorization
      blocker.
    cheapest_correction: Qualify historical totals by their actual endpoints; extract the already-existing stage4
      time into a new correction record. Any future driver repair should finalize timings and RSS after output,
      measure user/system CPU, retain stage checks and durable partial rows. A historical CPU measurement cannot
      be manufactured.
  - finding: F6_failed_run_partial_row_preservation_is_missing
    kind: missing
    joint_effect: inconclusive
    sources:
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/runs/RUN-ECDLP-a5f766-001/manifest.json
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/runs/RUN-ECDLP-a5f766-001/stderr.log
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/runs/RUN-ECDLP-a5f766-001/stdout.log
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/runs/RUN-ECDLP-a5f766-001/source-snapshot/symbolic_audit.py
    observation: RUN001 retains a terminal failed_infrastructure receipt, eligibility, inputs, lemma, rejection
      controls, certificates, logs and frozen sources. environment.json, finite-controls.csv, metrics.json and execution-report.md
      are absent. The old nesting reaches C/G pairing after the first C family, before any G rows exist; StopIteration
      escapes the typed-stop handler. Its local stage3 rows are never flushed. Static control flow implies eight
      C rows would have been assembled on this path, but their bytes are not archived and this is not a validated
      executed-row count.
    scope: The StopIteration traceback supports an orchestration crash. The missing partial data prevents a comprehensive
      audit of every failed-run observation or cost. RUN001 contributes no completed numerical metric and no mathematical
      negative evidence.
    cheapest_correction: Preserve this limitation in an additive qualification. Recover only pre-existing logs if
      available; otherwise mark partial rows and costs unavailable. Repair durable row flushing and broad terminal-receipt
      capture only in a later authorized implementation task.
