    disposition: Applied analytically to the archived construction; known-false blanket rule rejected.
  - control: P/-P and C/G observation collisions.
    disposition: Applied analytically; both survive with the quotient qualification above.
  - control: IDEA-109 exact-source and quantifier audit.
