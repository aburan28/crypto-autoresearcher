  component_assessments:
    constant_family:
      assessment: holds
      claim: For a smooth constant elliptic curve over R=k[epsilon]/epsilon^2, a fixed finite special-fiber
        n-torsion point with n invertible has exactly one n-torsion lift, and its coordinates are constant
        in the fixed constant model.
      argument: Base change k -> R supplies the constant torsion lift P_const. For any other torsion lift
        P, the difference D=P-P_const lies in the reduction kernel K. In a formal parameter at O, every
        element of K is epsilon*a, the group law is addition because epsilon^2=0, and [n](epsilon*a)=epsilon*n*a.
        Thus [n]D=0 and n invertible imply D=0. Since the two sections agree, their affine coordinates
        agree; the finite-chart hypothesis matters to this coordinate statement. This reviews the producer's
        elementary proof without relying on its recalled finite-etaleness citation.
      hypothesis_checks:
      - Smoothness supplies the one-dimensional formal group at O.
      - Invertibility of n is needed to eliminate nonzero n-torsion in K.
      - Constancy supplies P_const as an actual torsion section of the same family.
      - The coordinate conclusion is for the fixed affine short-Weierstrass chart.
      - A0 invertible is additionally needed to interpret F=x^2/A.
      wording_qualification: Unique means the unique torsion lift of the specified reduction P0. It does
        not mean that the family has only one order-3 section. The certificate's phrase 'the unique order-3
        section' needs this qualifier in any downstream quotation; P and -P already have distinct reductions.
      source_refs:
      - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/runs/RUN-ECDLP-a5f766-002/lemma-proof.md
      - ledger/hypotheses/H-ECDLP-a3598b.yaml
    varying_family:
      assessment: holds
      claim: Torsion-lift uniqueness in a varying family does not force constant coordinates or J=0.
      argument: For V, s=5+epsilon is a unit on the panel, A=6s-27 and B=s^2-18s+54. At P=(3,s), 27+3A+B=s^2,
        so P lies on the family. Its tangent slope is (27+A)/(2s)=3. The doubling formulas give x(2P)=9-6=3
        and y(2P)=3*(3-3)-s=-s, so 2P=-P. The affine section is nonidentity, hence has exact order 3.
        The special-fiber discriminant factor is 3375, a unit for 7,11,13,17, and 3 is invertible. Meanwhile
        F=9/(3+6epsilon)=3-6epsilon and J=-6 is nonzero on every panel field. Two n-torsion lifts of the
        same reduction would still differ by an n-torsion element of K and therefore coincide; that uniqueness
        is entirely compatible with the exhibited varying coordinates.
      exact_broken_step_in_blanket_argument: The invalid step is to insert the special-fiber coordinates
        as a constant torsion point in a different, varying curve family. In V, holding (x,y)=(3,5) fixed
        gives y^2-(x^3+Ax+B)=-10epsilon, nonzero at every panel prime. There is no such constant-coordinate
        curve section to which uniqueness could compare P. Invertibility of the differential of [n] remains
        true; it does not remove this missing premise.
      interpretation_qualification: 'In V the x derivative is already zero: J=-6 arises entirely from
        A1=6 in the denominator. The observation is a response of the pair (family, chosen torsion section)
        to its tangent, not demonstrated scalar displacement within a fixed elliptic curve.'
      source_refs:
      - experiments/EXP-ECDLP-a5f766/design.md
      - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/runs/RUN-ECDLP-a5f766-002/lemma-proof.md
      - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/runs/RUN-ECDLP-a5f766-002/symbolic-certificates.json
    idea109_reconciliation:
      assessment: inconclusive
      missing: No exact IDEA-109 statement, observation model, level-structure requirement, or quantified
        comparison to this local marked flex family is supplied within the permitted sources. design.md
        quotes a parent-supplied scoped expectation; lemma-proof.md explicitly leaves its reconciliation
        deferred.
      consequence: Group 6 remains UNRESOLVED. The approved contract's success criterion requires all
        six complete certificate/proof groups, so five PASS groups and zero listed row failures do not
        discharge this obligation. Deferral is honest incomplete work and is not a counterexample to IDEA-109.
      source_refs:
      - experiments/EXP-ECDLP-a5f766/approved-contract-v2.yaml
      - experiments/EXP-ECDLP-a5f766/design.md
      - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/runs/RUN-ECDLP-a5f766-002/lemma-proof.md
      - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/runs/RUN-ECDLP-a5f766-002/symbolic-certificates.json
  proves_too_much_controls:
  - object: Blanket zero first coordinate-invariant derivative for every varying smooth prime-to-p torsion
      section.
    method: Apply the inference unchanged to the preregistered V family; exact analytical argument only.
    concrete_witness: The already archived p=7, family V, u0=1, v=0, c=1 row 9 has (A0,A1,B0,B1,x0,x1,y0,y1)=(3,6,3,6,3,0,5,1),
      interpreted in F_7. Its discriminant factor is 3375 mod 7=1 and F=3+epsilon, so J=1. The recorded
      eligibility table labels this special fiber ordinary (point count 6, trace mod 7=2); that eligibility
      count was read, not recomputed in this review. The symbolic witness does not require ordinariness.
    observed_failure_signature: The blanket inference predicts J=0, contradicted by J=1 at the declared
      ordinary fixture and by J=-6 on the symbolic panel construction. Its failure is at the substitution
      of a nonexistent constant-coordinate lift.
    result: Expected known-false assertion rejected; the scoped producer lemma does not survive as a blanket
      assertion because it explicitly excludes it.
  - object: Injective encoding of raw sections and model trajectories by (F0,J) and its pullback law.
    method: Apply injectivity unchanged to P/-P and C/G; exact analytical argument and archived collision
      summaries.
    concrete_witness: P=(3,s) and -P=(3,-s) are distinct because 2s is a unit, while their x series, F0
      and J coincide. For C, F=3. For G with u=1+epsilon, x=3+6epsilon and A=3+12epsilon, so x^2/A=3 modulo
      epsilon^2 despite the changed raw coordinates. Further common declared gauges and pullbacks preserve
      these equalities.
    observed_failure_signature: Sign and raw-model collisions survive, matching the recorded 96/96 P/-P
      equal-F comparisons and 32/32 C/G equal-jet pairs. Those counts are producer summaries; no full
      row recount was performed for J3.
    result: Expected injectivity inference rejected on the stated raw domain.
    quotient_qualification: C and G are intentionally the same geometric marked object after quotienting
      by model gauge, so their equality is successful invariance, not a counterexample to injectivity
      on that quotient. P/-P likewise does not rule out a useful observable on a sign quotient. These
      controls disprove only unqualified injectivity, not all cryptanalytic utility.
  objections:
  - label: unresolved_reconciliation
    severity: material_completion_gap
    finding: The IDEA-109 reconciliation required by the scoped lemma remains absent.
    effect: Prevents calling J3 complete or calling the six-group success criterion met.
    remedy: Obtain a new bounded proof-audit handoff containing the exact IDEA-109 source and a quantified
      comparison.
  - label: tangent_not_parameter_free
    severity: transfer_boundary
    finding: Gauge invariance under the declared active unit scaling does not remove dependence on the
      base tangent. J -> cJ under pullback, and V at c=1 versus c=2 already exhibits distinct nonzero
      values on the same reparameterized family. No intrinsic scalar ranking follows from that value.
    effect: Any parameter-free or canonical displacement interpretation needs a separately justified tangent
      choice or a genuinely invariant comparison.
    remedy: Specify the tangent selection rule, its inputs, its cost and its behavior under every admitted
      parameter action.
  - label: lost_information
    severity: interpretation_boundary
    finding: The proposed jet does not separate P from -P or raw gauge-related trajectories.
    effect: Unique scalar encoding on the raw domain is unavailable from the tested observable alone.
    remedy: Define the quotient domain or name and cost the additional separator; do not infer universal
      futility from these collisions.
  - label: execution_label_not_certificate_completion
    severity: process_and_scope_qualification
    finding: The producer's valid terminal label coexists with UNRESOLVED group 6 and disclosed PD-1.
      A successful numerical panel or subsequent independent review does not erase that provenance or
      make the missing reconciliation appear.
    effect: Keep execution/provenance assessment, mathematical components and full-success assessment
      distinct.
    remedy: Coordinator synthesis should preserve PD-1 and pending group 6; J2 owns the detailed receipt/provenance
      judgment.
