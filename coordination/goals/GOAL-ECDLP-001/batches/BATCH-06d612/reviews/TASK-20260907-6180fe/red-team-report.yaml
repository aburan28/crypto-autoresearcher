  - control: Canonical versus arbitrary deformation or mixed-characteristic transfer.
    disposition: Not performed and not established; needs a separate frozen contract before any execution.
  counterexample_or_mutation:
    cheapest_current_falsification: Reuse V at p=7 with the identity extra gauge/pullback, or simply the
      exact identity F_V=3-6epsilon. It requires no new scientific run to locate the false premise. For
      injectivity, replace the same section P by -P, which keeps its entire x series and therefore F fixed.
    cheapest_next_missing_argument: In a zero-run proof audit, transcribe the exact IDEA-109 quantifiers,
      define what 'displacement', 'finite invariant jet' and 'global level structure' mean there, and
      map each input used to construct V to that observation model. Determine whether choosing this marked
      flex family already supplies structure excluded by that model. Identify a missing separator or exact
      incompatibility; do not infer one from the paraphrase.
  baseline_comparison:
    status: No scalar-recovery algorithm or measured attack gain exists in this artifact package.
    generic_large_prime_order_baselines: For a target subgroup of order q, the comparison targets are
      expected O(sqrt(q)) group operations with constant stored group elements for a serial Pollard-rho
      walk under its usual collision model, and O(sqrt(q)) group operations and stored elements for balanced
      BSGS. These are explicit benchmark cost models, not newly verified literature citations.
    tested_regime_baseline: The fixed torsion order is 3. A discrete logarithm in that fixed subgroup
      has only three possibilities, resolvable by a constant number of checks. No scalar targets were
      tested, and evaluating a supplied jet does not compete with a large-prime-order discrete-log solver.
    observed_sota_delta: No time, memory, data/query or exponent improvement has been measured.
    frontier_sweep_performed: false
    dominance_claim: None; this joint review is neither a frontier-ranking exercise nor a lane-closure
      proposal.
  heuristic_challenges:
  - No numbered statistical or asymptotic heuristic is tested by this deterministic exact audit.
  - The 96 transformed rows are not 96 independent random instances and provide no statistical tail or
    success-probability estimate.
  - The recorded ordinary fixtures are 7,13,17; p=11 is auxiliary, and no ordinary-stratum conclusion
    may rely on it alone.
  cost_model_challenges:
  - Given x0,x1,A0,A1, evaluating J at fixed first-order precision needs only a bounded number of field
    operations and an inversion. This conditional cost assumes the deformation, section and tangent coefficients
    are already available without knowing a target scalar. Their construction and verification are the
    presently missing computational inputs, not free preprocessing.
  - Any later attack interpretation must charge family and section construction, choice of precision/tangent,
    source and target lifting, relation collection, independent rank, memory/storage, target descent,
    scalar orientation/recovery and final verification. None has an end-to-end measurement here.
  - For repeatable independent attempts, expected cost is setup plus per-attempt cost divided by the actual
    success probability; success is not silently 1. No suitable attempt distribution or scalar success
    probability is measured. Shared preprocessing must state its amortization and target count.
  - The producer records total wall 2.673 seconds in metrics and 2.678 seconds in the manifest, and peak
    self-process ru_maxrss 67371008 bytes with a nominal-only 2 GiB ceiling. These are audit-runtime observations,
    not DLP complexity or validated whole-process-tree resource bounds. No new timing was taken, and detailed
    receipt reconciliation belongs to J2.
  reduction_and_scope_challenges:
  - Equal-characteristic R=k[epsilon]/epsilon^2 is not a Witt-vector digit ring, a canonical lift or a
    characteristic-zero construction.
  - First-order algebra and a single marked order-3 flex family do not establish higher precision, arbitrary
    torsion families, global descent or large-order scalar information.
  - The declared action is active unit scaling; invariance under every possible model transformation has
    not been supplied as a separate theorem.
  - A0=0, nonsmooth fibers and n noninvertible lie outside the lemma; rejecting those inputs is not mathematical
    counterevidence.
  - No affected-protocol or safe-protocol classification follows from this audit.
  proof_architecture_challenges:
  - attack: observation_fiber
    result: P/-P keep the observable fixed while the raw section changes; C/G keep it fixed while raw
      model motion changes. The missing separator depends on the intended quotient.
  - attack: quantifier_order
    result: Fix the field, smooth family, invertible n and finite torsion section; then quantify over
      the declared gauges and invertible pullbacks. Constant-family vanishing is universal only on its
      stated subdomain. V is an existential witness against a broader inference, not a distribution-level
      assertion about all deformations or scalar targets.
  - attack: boundary_and_strictness
    result: C and its gauge orbit reproduce the order-zero invariant and zero jet. V supplies a different
      nonzero response, not a better DLP algorithm. Nonzero response is not a time/memory improvement
      criterion.
  - attack: method_ceiling
    result: At ideal zero computational overhead, these artifacts certify at most first-order action laws
      and the constant-versus-varying distinction. They still do not contain a scalar separator, a recovery
      reduction, a success probability or an asymptotic improvement argument.
  - attack: nearby_object_and_compositional_assumptions
    result: V defeats extending the constant-coordinate premise to a varying family. Removing n-invertibility
      would break the step nD=0 => D=0; removing A0-invertibility would make the chosen rational observable
      undefined. Neither change is an admissible counterexample to this contract.
