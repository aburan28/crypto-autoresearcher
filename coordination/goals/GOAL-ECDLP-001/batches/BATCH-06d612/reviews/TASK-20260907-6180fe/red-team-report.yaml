    closure_proposed: false
    quantity: Information lost by the first-order observable on the two declared collision controls.
    producer_measurements:
      C_G_equal_jet_pairs: 32
      C_G_total_pairs: 32
      P_minus_P_same_F: 96
      P_minus_P_total: 96
