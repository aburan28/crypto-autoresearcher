artifact:
  task_id: TASK-20260823-36c80d
  kind: nearby_object_controls
  controls:
    - id: CTRL-XOR-JOIN-CORE
      object: "four lists over F_2^(3m), L=2^m, fixed m-bit prefix condition"
      expected: >-
        Complement lookup enumerates prefix-matching pairs in O(L+out), emits
        Theta(L), and leaves 2m bits so cross-collision scale is 2^(-2m).
      scope: "positive control for the common join core only"
      excluded_scope:
        - EC coefficient replay C1
        - denominator/scalar verification C6
      repair: JPR-REV-2
    - id: CTRL-INDEPENDENT-PAIR-COIN
      object: "evaluate a fresh independent Bernoulli(1/L) coin for every pair"
      expected: >-
        One attempt evaluates L^2=N^(2/3) predicates and has ambient relation
        success N^(-1/3); N^(1/3) fresh retries give expected total N.
      repair: JPR-REV-4
    - id: CTRL-POSTHOC-POINT-HASH
      object: "hash each complete pair sum to L buckets after computing it"
      expected: "right marginal survivor scale but L^2 pair-sum inspection"
      diagnostic: "distribution plausibility does not create an index"
    - id: CTRL-FULL-TABLE-ORACLE
      object: "precompute all L^2 pair sums and bucket memberships"
      expected: "exact outputs with hidden N^(2/3) time/data/memory"
      diagnostic: "detects uncharged preprocessing"
    - id: CTRL-PRIME-ORDER-HOMOMORPHISM
      object: "exact homomorphism from G of prime order N into a key group"
      expected: "image order 1 or N, never L"
      diagnostic: "rules out a naive exact small quotient, not nonlinear keys"
    - id: CTRL-SAME-COMPLETE-INPUT
      object: "(U,V) and (U+T,V-T), which have the same complete sum"
      expected: "guaranteed key collision but no free list-index discovery"
      diagnostic: "separates existence of fibres from access to fibres"
    - id: CTRL-SIGN-ORBIT
      object: "S and -S under the x-coordinate key"
      expected: "same bucket and exact sign invariance"
      diagnostic: "tests double counting and opposite-sum matching"
    - id: CTRL-CONSTANT-TRANSCRIPT
      object: "K(U,V)=0 for every pair"
      expected: "maximal fibre, L^2 output, no compression or exact-relation locator"
      diagnostic: "proves-too-much control for fibre-size arguments"
    - id: CTRL-COEFFICIENT-FREE-EQUALITY
      object: "emit equal/opposite pair sums without source coefficients"
      expected: "point equality may be detected but x=-A/B cannot be computed"
      diagnostic: "confirms coefficient lineage is load bearing"
  control_status:
    executed: false
    reason: "zero-run theory task"
    role: "formal discriminators for a future approved protocol"
  conclusion: >-
    The frozen EC key is distinct from every control, yet currently behaves like
    the post-hoc point-hash control on the decisive enumeration axis.
