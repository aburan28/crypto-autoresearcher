artifact:
  task_id: TASK-20260823-36c80d
  kind: proof_search_map
  proposal_id: IDEA-20260823-cab6c6
  bottleneck:
    primary: >-
      Convert the fixed rational two-leaf predicate enc_p(x(U+V))<w into an
      exact output-sensitive reporting data structure with O(L polylog N+out)
      work, without L^2 inspection or hidden advice.
    downstream:
      - prove high-probability Theta(L) output despite shared-leaf dependence
      - prove conditioned Renyi-2 and cross-overlap scale Theta(L/N)
      - prove anti-clustered constant joint verified-relation probability
      - charge inverse success and every resource axis
  baseline_embedding:
    parameter_slice: >-
      Prime-order subgroup G, canonical prime-field encoding, L=ceil(N^(1/3)),
      w=ceil(p/L), fixed bucket zero, four independent coefficient-labelled lists.
    reproduction_check:
      algorithm: "double loop over each list pair and exact K_EC evaluation"
      time: "Theta(L^2) per side"
      memory: "O(L+out) streaming"
      success_status: "not measured; zero runs"
      purpose: "exact reference only, not target complexity"
  observation_collision:
    observable: "fixed bucket K_EC(U,V) plus separately retained source labels"
    distinct_preimage_search:
      algebraic_witness: "(U,V) and (U+T,V-T) have identical complete sum"
      list_restricted_search: "missing without pair enumeration"
      collision_warning: "same observable is not the same as accessible exact relation"
  constructive_transforms:
    selected:
      - representation_reduction
      - observable_fiber
    attempted_interpretation: >-
      Reduce the EC pair predicate to a finite bucket label and audit its fibres;
      then ask for a source-index reporting representation rather than assuming
      bucket membership is enumerable.
    result: "fibre is explicit; reporting representation is not"
  quantifier_order:
    forall:
      - public curve and prime-order subgroup satisfying the stated model
      - public P and Q
      - canonical encoding fixed independently of sources
    exists_required:
      - one exact bounded-state data structure for the frozen key
      - proofs of tails, collision mass, anti-clustering, and cost
    sampling_after_freeze:
      - source coefficients and seeds
    forbidden_swap: >-
      No key, bucket, interval, hash, or advice may be chosen after observing
      pair sums, survivor counts, Q-dependent labels, or collisions.
  method_ceiling:
    strongest_certifiable_claim: >-
      K_EC is an explicit public target-independent DLP-free sign-invariant
      pair key; exact direct enumeration costs Theta(L^2); the desired fibre
      scale is conditional on named flatness assumptions.
    nearby_object_control:
      object: "cyclic prime-order group with an exact homomorphism to a finite key group"
      known_false_target: "a nontrivial exact homomorphic image of size Theta(L)"
      proof: >-
        The image order divides N. Since N is prime, the image order is 1 or N,
        never Theta(N^(1/3)). Thus a purported exact small quotient would be
        either constant or injective and cannot supply the desired bucket.
    ceiling_respected: true
  proof_obligations:
    - id: PO-1
      responsibility: "Exhibit exact output-sensitive reporting for K_EC."
      result: missing
      not_applicable_reason: null
    - id: PO-2
      responsibility: "Prove survivor expectation and high-probability tail."
      result: heuristic_only
      not_applicable_reason: null
    - id: PO-3
      responsibility: "Prove conditioned Renyi-2 mass and cross overlap."
      result: heuristic_only
      not_applicable_reason: null
    - id: PO-4
      responsibility: "Prove joint collision/denominator/verification anti-clustering."
      result: missing
      not_applicable_reason: null
    - id: PO-5
      responsibility: "Charge total expected all-axis cost."
      result: realized_baseline_only
      not_applicable_reason: null
  disposition: >-
    The proof search reaches a precise method ceiling at the reporting data
    structure. Passing the fibre audit does not pass C2--C5.
