  kind: conditioned_collision_and_joint_success
  key_id: K-EC-XINTERVAL-1
  exact_counting_scaffold:
    potential_pairs_per_side: "L^2 = N^(2/3+o(1))"
    predicted_survivors_per_side: "L, conditional on bucket mass Theta(1/L)"
    coordinate_bucket_width: "w=ceil(p/L)"
    affine_points_per_bucket_upper_scale: "at most 2w before subgroup restriction, plus O(1) endpoints"
    desired_common_support: "Theta(N/L)=Theta(N^(2/3)) when p=Theta(N)"
    desired_opposite_sum_probability: "Theta(L/N)=Theta(N^(-2/3)) per survivor cross-pair"
    desired_expected_relations: "L^2 * Theta(N^(-2/3)) = Theta(1)"
  realized_facts:
    - "K_EC is invariant under S -> -S because x(S)=x(-S)."
    - "Bucket zero is fixed before list sampling."
    - "The direct enumerator recovers the exact filtered multiset."
    - "No sampling or measurement occurred."
  conditional_claims:
    - id: C4-CONDITIONAL
      condition: >-
        Each side's filtered pair sums is flat in Renyi-2 sense on the same
        sign-closed support of cardinality Theta(N/L), with cross inner product
        Theta(L/N).
      implication: "opposite-sum probability Theta(N^(-2/3))"
    - id: C5-CONDITIONAL
      condition: >-
        The two survivor counts concentrate at Theta(L), cross collisions are
        anti-clustered, nonzero denominators occur with constant probability,
        and dependencies from shared leaves/key/Q do not destroy the joint event.
      implication: "constant per-attempt probability of at least one verified relation"
  missing_proofs:
    survivor_tail: >-
      Pair indicators share leaves; expectation under a marginal flatness model
      does not give a Chernoff tail.
    conditioned_renyi2: >-
      The coordinate interval may bias subgroup point mass and source
      multiplicities. No bound on sum_s mu(s)^2 is established.
    common_support: >-
      Matching bucket labels is necessary for S and -S but does not show that
      the left and negated-right conditioned distributions overlap uniformly.
    anti_clustering: >-
      A constant first moment can be caused by rare transcripts with many
      collisions; no second moment for the verified-relation count is supplied.
    coefficient_correlation: >-
      S=A P+B Q couples bucket membership and B=0 through Q and source labels.
    retry_law: >-
      With no established per-attempt success, inverse-success cost is unknown.
  renyi2_obligation:
    left: "prove sum_s mu_12(s)^2 = Theta(L/N)"
    right: "prove sum_s mu_34(s)^2 = Theta(L/N)"
    cross: "prove sum_s mu_12(s) mu_34(-s) = Theta(L/N)"
    tail: "bound max_s mu_side(s) or an equivalent anti-clustering statistic"
    status: unestablished
  joint_event:
    definition: >-
      E={both sides enumerate within bound; survivor counts are Theta(L); an
      opposite-sum collision is emitted; its combined denominator B is nonzero;
      x=-A/B verifies xP=Q}.
    achieved_probability: null
    claimed_constant: false
    retry_count: unknown
    clause_status: unestablished
  ambient_comparison:
    unrestricted_uniform_point_collision: "1/N per survivor cross-pair"
    desired_conditioned_collision: "N^(-2/3+o(1))"
    warning: >-
      Substituting the ambient heuristic yields only expected N^(-1/3) relation
      count from L^2 survivor cross-pairs and cannot support constant success.
  conclusion: >-
    The frozen key makes the desired support-size arithmetic legible but does
    not establish it. No achieved success probability or retry budget is
