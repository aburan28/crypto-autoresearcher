blind_statement_packet:
  task_id: TASK-20260823-36c80d
  purpose: "Statements and parameters only for independent rederivation."
  blind_from:
    - output-sensitive-pair-enumerator.yaml
    - conditioned-collision-and-joint-success.yaml
    - full-cost-and-pareto.yaml
    - jpr-repair-matrix.yaml
    - disposition-report.yaml
  statements:
    - id: BS-1
      text: >-
        Let G=<P> subset E(F_p) have prime order N and Q=xP. Let
        L=ceil(N^(1/3)), w=ceil(p/L), and enc_p be the canonical integer field
        encoding. Define K(U,V)=0 for U+V=O and otherwise
        min(L-1,floor(enc_p(x(U+V))/w)). The accepted bucket is fixed at zero.
    - id: BS-2
      text: >-
        Four lists have L independently sampled records
        (a,b,R=aP+bQ). A retained pair stores its two source IDs, summed
        coefficients (A,B), and point S=AP+BQ.
    - id: BS-3
      text: >-
        The target enumeration bound per side is O(L polylog N+output) time,
        O(L polylog N) memory, no L^2 inspection/materialization, and
        high-probability Theta(L) outputs.
    - id: BS-4
      text: >-
        The target conditioned opposite-sum probability per survivor cross-pair
        is Theta(N^(-2/3)), supported by Renyi-2 or equivalent second-moment and
        anti-clustering bounds, with constant achieved joint verified success.
    - id: BS-5
      text: >-
        For an emitted opposite-sum collision, independently replay AP+BQ=O,
        reject B=0 and duplicate/replay failures, compute -A/B mod N, and verify
        the candidate by scalar multiplication against Q.
    - id: BS-6
      text: >-
        Charge key construction, joins, skew, outputs, replay, verification,
        inverse success, memory, data, communication, parallelism, and
        multi-target effects.
  requested_rederivations:
    - "Determine the exact complexity of the best supplied exact enumerator for K."
    - "Derive what additional distribution statements are required for Theta(L) survivors and Theta(N^(-2/3)) opposite-sum probability."
    - "Derive the coefficient replay and denominator rule from the statements."
    - "Separate realized, conditional, and unknown time/memory/data rows."
  parameters_disclosed:
    group_order: N
    field_size: p
    list_length: "ceil(N^(1/3))"
    bucket_width: "ceil(p/L)"
    accepted_bucket: 0
    authorized_runs: 0
  derivations_included: false
  verdict_included: false
  expected_review_included: false
  producer_notes_included: false
  snapshot_integrity_separate: true
  repair: JPR-REV-1
