artifact:
  task_id: TASK-20260823-36c80d
  kind: observation_collision_audit
  observable:
    name: K-EC-XINTERVAL-1
    value: "the fixed canonical x-coordinate bucket of U+V"
    coefficient_aware: false
    source_ids_retained_outside_observable: true
  explicit_distinct_preimages:
    construction: >-
      Choose public U,V,T in G with T nonzero and with source points remaining
      distinct. Let U'=U+T and V'=V-T. Then U'+V'=U+V, hence
      K_EC(U',V')=K_EC(U,V).
    collision_type: same_complete_pair_sum
    cardinality_scale: "up to N shifts T before source-list restrictions"
    implication: "The observable has large algebraic fibres."
    non_implication: >-
      The construction does not locate collisions among two independently
      sampled length-L source lists without inspecting candidate pairs.
  coarser_distinct_preimages:
    sign_orbit: "S and -S share x and therefore share K_EC."
    interval_fibre: "all subgroup points whose encoded x lies in one interval share the bucket"
    coefficient_fibre: >-
      Multiple coefficient tuples can map to the same point when their
      differences encode an ECDLP relation; finding such tuples is the objective,
      not free preprocessing information.
  collision_search:
    exact_baseline: "enumerate L^2 pairs, group by bucket or complete sum"
    claimed_subquadratic_search: null
    status: failed_to_supply_required_search
  quantifier_audit:
    order:
      - freeze_curve_and_public_instance
      - freeze_encoding_width_bucket_and_key
      - sample_source_coefficients
      - construct_labelled_leaves
      - enumerate_pairs
      - observe_counts_and_collisions
      - replay_and_verify
    post_selection_forbidden: true
  proves_too_much_check:
    nearby_false_argument: >-
      Large observable fibres alone imply a fast collision finder and hence a
      fast DLP algorithm.
    counterexample: >-
      A constant transcript has the largest possible fibre but exposes no
      information for locating an exact opposite-sum relation. Therefore fibre
      cardinality without source-sensitive access proves too much.
    outcome: "The false implication is rejected; accessibility remains a separate obligation."
  conclusion: >-
    Observation collisions exist exactly and abundantly, but the required
    observation-collision search remains missing. This audit supports REVISE,
    not closure of the broader lane.
