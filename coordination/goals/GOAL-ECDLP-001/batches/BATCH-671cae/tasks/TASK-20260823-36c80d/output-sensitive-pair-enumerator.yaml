      - fixed bucket and fixed key
      - subgroup x-coordinate bias
      - duplicate points and sources
    clause_status: unestablished
  conclusion:
    selector: select_none
    reason: >-
      The only exact supplied enumerators cost Theta(L^2) per side. This is a
      failure of this frozen construction packet, not a proof that no exact
