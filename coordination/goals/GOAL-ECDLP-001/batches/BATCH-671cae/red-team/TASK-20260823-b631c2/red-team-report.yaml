  joint_verdicts:
    J4-proves-too-much-controls-and-semantic-novelty: breaks
    J5-scope-resource-reversal-and-steering: breaks

  verdict_summary:
    J4: >-
      Breaks narrowly. The packet correctly leaves external novelty
      unverified, refuses a full-table oracle, charges the literal pair-coin
      retries, scopes XOR to the common join core, and retains coefficients for
      scalar replay. Two control statements are nevertheless too strong. The
      x-interval key is a deterministic sign-invariant member of the post-hoc
      complete-pair-sum bucket family on the decisive locator axis, not
      mechanism-distinct from that family merely because its bucket map is an
      EC coordinate interval rather than a random oracle. Also, the constant
      transcript has an exact full-pair meet-in-the-middle relation locator;
      it fails the target through quadratic output/work and ambient 1/N
      per-cross-pair collision, not through absence of any exact locator.
      These breaks require an additive wording/control correction but do not
      undermine the scoped observation that the supplied K-EC-XINTERVAL-1
      enumerators cost Theta(L^2).
    J5: >-
      Breaks narrowly while preserving the scoped negative. The direct
      baseline is honestly rho-dominated and the broader JPR/P1549--P1553
      routes are not closed. However, the unrealized conditional row sets
      dominated_by to null even while saying that no Pareto assessment is
      permitted and communication and multi-target axes remain unknown; under
      the inventor protocol that must be typed n/a or unknown, not null. The
      resource check also does not quantify the useful side of sign closure or
      source multiplicity and does not expose the exact L^2 supplied-method
      obstruction in the canonical registry-readable obstruction block.
      Sign closure is the structural property that can change a uniform
      conditioned opposite-match probability from 1/N to L/N, while repeated
      coefficient-labelled representations can either help denominator/rank
      diversity or cause the anti-clustering failure. Those possibilities must
      remain open rather than being carried only as confounders.

  objections:
    - id: RT-B64-J4-01
      joint: J4-proves-too-much-controls-and-semantic-novelty
      severity: major_control_semantics
      title: The constant-transcript control is stopped at the wrong interface
      producer_statement: >-
        CTRL-CONSTANT-TRANSCRIPT says that K(U,V)=0 for every pair has maximal
        fibre, L^2 output, no compression, or exact-relation locator.
      counterexample: >-
        Enumerate all L^2 labelled left pair sums, hash or sort them by their
        complete oriented group point, enumerate all L^2 labelled right pair
        sums, and report S_left=-S_right. This is an exact relation locator and
        preserves the four source coefficient records.
      exact_cost_and_signal: >-
        The locator costs Theta(L^2) work and up to Theta(L^2) state. Each side
        emits L^2 pairs. Under uniform pair sums the opposite match probability
        per survivor cross-pair is 1/N and the expected number of four-list
        relations is L^4/N=N^(1/3), without asserting a high-probability or
        independent-rank theorem.
      correct_failure_location:
        - C2 target prohibition on L^2 inspection is violated
        - C3 high-probability Theta(L) output is violated
        - C4 desired L/N per-cross-pair conditioned collision is violated
        - C7 N^(1/3+o(1)) total cost is violated
      preserved_scope: >-
        The control still proves that fibre size alone does not imply the
        desired complexity. It does not prove that exact location is absent.
      required_correction: >-
        Replace "no exact-relation locator" by "no locator within the repaired
        output and all-axis cost gates" and record the exact MITM locator as the
        known-false object's failure signature.

    - id: RT-B64-J4-02
      joint: J4-proves-too-much-controls-and-semantic-novelty
      severity: major_semantic_deduplication
      title: The x-interval key is inside the post-hoc pair-sum bucket family
      finding: >-
        K-EC-XINTERVAL-1 first computes the complete pair sum S=U+V and then
        applies a public bucket map to S. On the source-access and enumeration
        interface it is therefore a deterministic, sign-invariant instance of
        the packet's post-hoc point-bucket control. Replacing a random bucket
        map by enc_p(x(S)) in a fixed interval supplies algebraic and sign
        structure, but it supplies no separately computed leaf label,
        complement lookup, or source-reporting index.
      exact_semantic_delta: >-
        The valid delta is one explicit DLP-free native formula, a predeclared
        interval, and the sign-closed support A=-A. The packet's source audit
        correctly calls the external novelty status unverified and acknowledges
        the same enumeration failure; the nearby-control conclusion that the
        key is distinct from every control is the overstatement.
      internal_duplication_boundary: >-
        Relative to B57, C1/C6 and the conditional C1--C7 architecture were
        already present; B64 instantiates a formula and applies the repaired
        controls, but C2--C5 remain at the same missing-index/missing-success
        interfaces. No mechanism-level output-sensitive selector is new.
      external_novelty_adjudicated: false
      required_correction: >-
        Describe the key as a structured specialization of the post-hoc
        pair-sum bucket control with a sign-closure resource, while retaining
        novelty_status=unverified.

    - id: RT-B64-J5-01
      joint: J5-scope-resource-reversal-and-steering
      severity: major_pareto_typing
      title: An unrealized row with unknown axes cannot use dominated_by null
      finding: >-
        full-cost-and-pareto.yaml assigns dominated_by: null to
        repaired_jpr_if_all_gates, but the same row says it is conditional and
        unrealized and the file leaves communication, constants, and
        multi-target behavior unknown. The narrative correctly refuses a
        Pareto or SOTA claim; the machine field does not encode that refusal.
      protocol_boundary: >-
        The inventor protocol permits null only after every frontier row has
        been checked across time, memory, and data/query axes. A non-result is
        instead typed n/a, and an unknown coordinate is neither dominance nor
        nondominance.
      unaffected_row: >-
        The frozen direct exact baseline is rho-dominated in the serial
        single-target model: its one-attempt time is at least N^(2/3), memory
        is N^(1/3) plus output, and per-target list data is N^(1/3), all before
        unknown retries. That scoped comparison survives.
      required_correction: >-
        Use dominated_by: "n/a (unrealized; no complete attack point)" or the
        schema's explicit unknown value, and keep the hypothetical time-memory
        tradeoff outside the realized frontier.

    - id: RT-B64-J5-02
      joint: J5-scope-resource-reversal-and-steering
      severity: major_resource_and_registry_completeness
      title: The obstruction is not read twice in a registry-readable form
      finding: >-
        The packet gives exact_reachability, a scoped_counterexample, and a
        prose resource_check, but no canonical obstruction block stating the
        exact quantity, symbolic value and units, zero error, proof references,
        zero-run boundary, scope, resource reading, and spawned_ids. The
        existing resource reading names only generic algebraic range reporting.
      sign_resource: >-
        Let A be the accepted set of complete pair sums. For the x-coordinate
        key A=-A. If both conditioned distributions are uniform on A and
        |A|=Theta(N/L), then Pr[S_left=-S_right]=1/|A|=Theta(L/N). For a generic
        non-sign-closed bucket of the same size, the expected overlap
        |A intersect -A| is Theta(N/L^2), giving only Theta(1/N). Sign closure
        is therefore a load-bearing possible resource, not merely folding.
      multiplicity_resource: >-
        With source-labelled counts m_left(s) and m_right(s), the exact
        relation count is sum_s m_left(s)m_right(-s). Repeated representations
        may provide coefficient diversity that helps avoid B=0 and improve row
        rank, or may concentrate all mass into rare transcripts and destroy a
        constant-success inference. Both the point multiplicity and the number
        of distinct coefficient lineages per point must be retained.
      obstruction_normal_form:
        quantity: inspected_source_pairs_per_side_for_supplied_exact_enumerators
        value: L^2
        units: pair_sum_and_key_evaluations
        error: exact_zero
        runs: []
        proof_refs:
          - coordination/goals/GOAL-ECDLP-001/batches/BATCH-671cae/tasks/TASK-20260823-36c80d/candidate-key-and-reachable-lists.yaml
          - coordination/goals/GOAL-ECDLP-001/batches/BATCH-671cae/tasks/TASK-20260823-36c80d/output-sensitive-pair-enumerator.yaml
        scope: K-EC-XINTERVAL-1_and_only_the_enumerators_explicitly_supplied
        universal_lower_bound: false
      required_correction: >-
        Mint an additive correction or disposition record, never edit the
        snapshot, that carries the canonical obstruction/resource block and
        explicitly preserves sign-closed multiplicity-aware reporting as an
        untested successor interface.

  required_controls:
    - id: CTRL-INDEPENDENT-PAIR-COIN
      application: symbolic_known_false_control
      outcome: stops_correctly
      derivation: >-
        Under the frozen literal control, one attempt evaluates L^2=N^(2/3)
        independent predicates, retains Theta(L) pairs per side, and has
        ambient expected relation count N^(-1/3). N^(1/3) fresh retries give
        expected predicate work N. The control fails C2, C4, C5, and C7; it
        cannot support the one-third point.
    - id: CTRL-POSTHOC-POINT-HASH
      application: symbolic_known_false_control_and_semantic_deduplication
      outcome: producer_distinctness_statement_breaks
      derivation: >-
        A point bucket evaluated only after U+V is formed has the desired
        marginal scale only after L^2 pair formation. K-EC-XINTERVAL-1 is a
        structured sign-invariant member of this locator family, though it is
        not a random oracle and may have different conditioned support.
    - id: CTRL-FULL-TABLE-ORACLE
      application: symbolic_hidden_advice_control
      outcome: stops_correctly
      derivation: >-
        Precomputing all pair sums can answer the filter exactly but costs
        Theta(L^2) construction and persistent state. Moving that cost outside
        the query does not satisfy the per-leaf all-axis budget.
    - id: CTRL-PRIME-ORDER-HOMOMORPHISM
      application: exact_nearby_object_control
      outcome: stops_correctly
      derivation: >-
        The image order of an exact homomorphism out of a group of prime order
        N divides N, so it is 1 or N and cannot be Theta(L). This eliminates a
        naive exact small quotient only; it says nothing about nonlinear
        list-specific or approximate keys.
    - id: CTRL-XOR-JOIN-CORE
      application: exact_positive_common_core_control
      outcome: scoped_correctly
      derivation: >-
        In F_2^(3m), grouping leaves by an m-bit prefix enumerates matching
        pairs in O(L+output), leaves a 2m-bit sign-free support, and gives the
        common-core N^(-2/3) cross scale. It has no EC coefficient replay,
        nonzero-denominator rule, or xP=Q verification, so it cannot discharge
        ECDLP-specific C1 or C6.
    - id: CTRL-SAME-COMPLETE-INPUT
      application: exact_observation_collision_control
      outcome: stops_correctly
      derivation: >-
        (U,V) and (U+T,V-T) have the same complete sum and key for every valid
        T, proving a large global fibre. The transformed sources need not occur
        in the two sampled lists, so the collision does not locate a reachable
        source pair.
    - id: CTRL-SIGN-ORBIT
      application: exact_resource_reversal_control
      outcome: mathematical_fact_holds_resource_audit_incomplete
      derivation: >-
        Except for the identity in the odd prime-order subgroup, S and -S form
        a two-element orbit with the same x bucket. Retaining the oriented pair
        point and all source labels makes the ambiguity constant-size. More
        importantly, A=-A can supply the full L factor in the desired
        conditioned opposite-match scale if flatness and output-sensitive
        access are separately proved.
    - id: CTRL-CONSTANT-TRANSCRIPT
      application: exact_proves_too_much_control
      outcome: producer_failure_location_breaks
      derivation: >-
        K=0 has maximal fibres and quadratic output. A full pair-sum MITM is an
        exact locator, but it misses C2/C3/C4/C7 and the one-third target. The
        control refutes fibre-size-to-fast-algorithm reasoning, not the
        existence of every locator.
    - id: CTRL-COEFFICIENT-REPLAY
      application: exact_load_bearing_mutation
      outcome: stops_correctly
      derivation: >-
        Equal or opposite group points without their source coefficients do
        not reveal A or B. With checked source labels, AP+BQ=O, B nonzero,
        x=-A/B mod N, and xP=Q form a sound decoder. This establishes decoder
        correctness conditional on a candidate; it supplies no locator or
        success probability.

  counterexample_or_mutation:
    id: MUT-B64-CONSTANT-TRANSCRIPT-LOCATOR
    object: "K_0(U,V)=0 for every source pair"
    construction: >-
      Retain every labelled pair sum on the left and right, hash one complete
      oriented side by S, and query the other by -S. Replay any hit from its
      four coefficient-labelled sources and apply the B!=0 and xP=Q gates.
    exactness: exact_relation_locator
    one_attempt_time: Theta(L^2)
    peak_state: "Theta(L^2) for the direct hash table; streaming tradeoffs do not reach the target"
    output_per_side: L^2
    conditioned_cross_probability_under_uniform_sums: 1/N
    expected_relation_count_under_uniform_sums: "L^4/N=N^(1/3)"
    claim_falsified: >-
      The producer's literal statement that the constant transcript has no
      exact-relation locator.
    claim_not_falsified: >-
      Fibre size alone does not yield an N^(1/3+o(1)) attack; the supplied
      K-EC-XINTERVAL-1 exact enumerators remain quadratic in L.

  baseline_comparison:
    regime: single_target_prime_order_ECDLP
    pollard_rho:
      time_exponent: "1/2"
      memory_exponent: "0 up to negligible or distinguished-point state"
      data_queries_exponent: "0"
      realization: known_baseline
    baby_step_giant_step:
      time_exponent: "1/2"
      memory_exponent: "1/2"
      data_queries_exponent: "0"
      realization: known_baseline
    frozen_key_direct_stream:
      time_exponent: ">=2/3 for one attempt"
      memory_exponent: "1/3 plus emitted-output skew"
      generated_per_target_data_exponent: "1/3"
      retries: unknown
      comparison: >-
        Rho dominates the supplied direct baseline in the serial single-target
        model before retries. BSGS has the same half-time exponent as rho but
        larger memory; its omission from the producer table does not rescue
        the direct baseline, though a complete table should name it.
    repaired_jpr_if_all_gates:
      time_exponent: "conditional 1/3"
      memory_exponent: "conditional 1/3"
      data_exponent: "conditional 1/3"
      communication: unknown
      multi_target: unknown
      realization: unrealized_non_pareto_point
      comparison: >-
        If realized, this would trade lower time for higher memory/data than
        rho and would require a typed time-memory frontier comparison. In the
        present packet it is not an attack point and is neither dominated nor
        undominated.

  semantic_duplication_audit:
    - comparator: B57_repaired_JPR_architecture
      refs:
        - ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-c36939.yaml
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-c36939/tasks/TASK-20260823-14f80f/joinability-certificate.yaml
      duplicated_clauses: >-
        Coefficient-labelled C1 replay, the B!=0/x=-A/B/xP=Q C6 decoder, the
        conditional L=N^(1/3) arithmetic, and the missing C2/C4/C5 interfaces.
      B64_delta: >-
        One explicit x-coordinate interval formula, exact supplied-method
        L^2 costs, and faithful incorporation of JPR-REV-1 through JPR-REV-4.
      remaining_boundary: >-
        No mechanism-level output-sensitive selector, conditioned theorem, or
        achieved success law was added.
    - comparator: B63_Query2P1_selector
      refs:
        - ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-d8a1aa.yaml
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-d8a1aa/tasks/TASK-20260823-c82d71/disposition-report.yaml
      duplicated_clauses: >-
        A public compressed key without a source occurrence locator is not an
        ECDLP decoder, and success/retry/fully typed cost cannot be inferred
        from expected endpoint counts.
      B64_delta: >-
        B64 does preserve coefficient labels and gives the correct scalar
        verifier, repairing B63's equality-only decoder. Its sign-invariant
        bucket is used as a possible common-support resource rather than a
        unique-orientation certificate.
      remaining_boundary: >-
        The output-sensitive occurrence locator is still absent. Sign folding
        is constant-size when both oriented candidates and labels are retained.
    - comparator: P1549_non_Cartesian_shared_layer_path_locator
      ref: ideas/artifacts/ECDLP-IDEA-195/p1549_noncartesian_finite_state_closure_gate.md
      relationship: >-
        P1549 asks for an exact O(D) target-to-signed-source path locator in a
        shared S3 grammar. B64's interval predicate is not that recurrence.
        Both expose an access-versus-fibre distinction, but neither closes the
        other's surviving operation.
      preserved_successor: true
    - comparator: P1550_global_rational_and_finite_domain_branch_gate
      ref: ideas/artifacts/ECDLP-IDEA-195/p1550_high_branching_s3_path_locator_gate.md
      relationship: >-
        P1550 closes explicit global rational source branches and preserves a
        compact high-degree finite-domain selector. A nonlinear x bucket does
        not output five source branches and is outside neither conclusion as a
        completed selector.
      preserved_successor: true
    - comparator: P1551_noncharacter_endpoint_extractor
      ref: ideas/artifacts/ECDLP-IDEA-195/p1551_finite_domain_selector_circuit_gate.md
      relationship: >-
        P1551's residual is a noncharacter, nonenumerative coefficient and
        source-unranking operation. K-EC-XINTERVAL-1 supplies a pointwise
        predicate after pair formation, not that aggregation operation.
      preserved_successor: true
    - comparator: P1552_translated_product_common_norm
      ref: ideas/artifacts/ECDLP-IDEA-121/translated_product_common_norm_v3.md
      relationship: >-
        The translated-product object has exact support and source-jet
        identities but standard B^3/B^4 constructors. B64 uses a different
        four-list parameter map, yet repeats the same semantic warning that an
        exact support predicate is not a compact source locator. Specialized
        product-circuit and source-preserving exceptions remain untested.
      preserved_successor: true
    - comparator: P1553_target_label_common_factor
      ref: ideas/artifacts/ECDLP-IDEA-012/p1553_target_label_common_factor_gate_r4.md
      relationship: >-
        P1553's exact z_R factor reports extendible fifth labels but lacks a
        B^(5/4) constructor. B64's coarse pair bucket neither constructs z_R
        nor supersedes the common-factor/source-replay operation.
      preserved_successor: true

  heuristic_challenges:
    - id: H-BUCKET-FLAT
      status: unestablished_as_packet_says
      challenge: >-
        The at-most-2w point count is only an upper scale. It gives no lower
        bound for subgroup occupancy, no finite-list mixing theorem, and no
        high-probability tail under shared leaves.
    - id: H-COND-FLAT
      status: unestablished_as_packet_says
      challenge: >-
        Sign closure makes the desired support overlap possible, but the left
        and right source-weighted measures still require Renyi-2, cross-inner-
        product, and maximum-mass bounds. Support cardinality alone is not the
        distribution theorem.
    - id: H-JOINT-RETRY
      status: unestablished_as_packet_says
      challenge: >-
        The joint event must include output bounds, at least one opposite hit,
        a nonzero B, coefficient-lineage diversity, verified x, and valid fresh
        retry nesting. A first moment can be carried by rare high-multiplicity
        transcripts and supplies no geometric retry law.

  cost_model_challenges:
    - >-
      The packet correctly charges the supplied direct enumerators at
      Theta(L^2)=N^(2/3+o(1)) group/key work and does not hide a full table.
    - >-
      A hypothetical preprocessing index must charge its construction per
      frozen key and per target-dependent leaf collection; bounded key state
      does not make source-pair advice free.
    - >-
      Output skew controls both time and peak memory. A streaming scan avoids
      table state but cannot suppress the emitted coefficient-labelled
      multiplicity, and a full hash join can reach Theta(L^2) state.
    - >-
      Parallelizing the L^2 scan over L workers may reduce wall time toward L
      but retains L^2 total work plus routing, synchronization, and duplicate
      output. It is not a serial one-third attack.
    - >-
      Unknown achieved success makes retry, communication, and multi-target
      axes unknown. They must not be inserted as zero or used to certify a
      Pareto point.

