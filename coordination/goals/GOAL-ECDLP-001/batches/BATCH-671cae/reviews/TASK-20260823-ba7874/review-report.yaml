  claim_boundary: >-
    This report owns only J1 key construction/reachability and J2
    output-sensitive pair joining/coefficient replay for K-EC-XINTERVAL-1. It
    does not assess J3, J4, or J5; it gives no whole-claim, ECDLP-speedup,
    novelty, lane-closure, hypothesis-status, or goal-status verdict.
  joints:
    - joint: J1-key-construction-and-reachability
      verdict: breaks
      formula_checks:
        - check: total_key_formula
          outcome: holds
          detail: >-
            K_EC is defined on every U,V in G: the point at infinity is handled
            explicitly, while an affine sum is assigned the canonical interval
            index min(L-1,floor(enc_p(x(U+V))/ceil(p/L))). Because
            0 <= enc_p(x) < p, the value lies in {0,...,L-1}.
        - check: public_dependencies_and_target_boundary
          outcome: holds
          detail: >-
            The formula uses only public curve/field data, N through L, the
            canonical encoding, and the predeclared bucket tau=0. It contains
            neither the unknown scalar x nor output-trained advice. Q occurs
            only in the public input leaves R=aP+bQ, which is the boundary the
            packet explicitly declares.
        - check: bounded_state_and_dlp_free_evaluation
          outcome: holds
          detail: >-
            Key state is O(1) public field/group parameters, and one evaluation
            is a public EC addition plus coordinate encoding and integer
            bucketing. No pair table or discrete logarithm is needed to define
            or evaluate the key. The separate exact reachable-list construction
            is quadratic, but that cost is disclosed rather than hidden in key
            setup.
        - check: sign_and_infinity_semantics
          outcome: holds
          detail: >-
            For affine S, x(S)=x(-S), and O=-O is assigned bucket zero, so the
            key is exactly sign invariant. A later opposite-sum test must still
            use the full point S, not merely its bucket or x-coordinate.
        - check: deterministic_reachability
          outcome: holds
          detail: >-
            For any fixed four labelled input lists, the definitions of F_12
            and F_34 are exact. Exhausting all L^2 source pairs on each side
            emits precisely the tuples (source IDs,A,B,S) satisfying K_EC=0.
        - check: coefficient_labelled_input_distribution
          outcome: breaks
          detail: >-
            The frozen packet says only to "sample declared coefficients in
            Z_N^2" and requires independence "before duplicate handling". It
            never specifies the probability law (for example, independent
            uniform sampling with replacement), and it never defines whether
            duplicate coefficient pairs, points, or source identifiers are
            retained, rejected, or resampled. Consequently the claimed
            coefficient-labelled reachable-list distribution is not a fully
            frozen mathematical object. Independence alone does not determine
            marginal point laws, multiplicities, or reachable transcript
            probabilities.
        - check: complete_transcript_semantics
          outcome: holds_declaratively
          detail: >-
            The declared emitted record retains list-qualified source IDs,
            source coefficients, summed coefficients, and the full point S.
            Thus pairs with the same key or even the same complete sum can
            remain distinct records. No implementation or emitted instance
            exists, so this is a static interface result only.
      break_scope: >-
        J1 breaks only as the complete frozen construction-and-distribution
        joint. The break does not invalidate the key formula, prove the key
        unreachable, or establish a lower bound for other EC keys.
      required_repair:
        - State the exact coefficient law for every list, including replacement and independence semantics.
        - Define duplicate handling for coefficient tuples, point values, and list-qualified source identifiers.
        - Derive the resulting leaf and reachable-pair multiset law without using the unknown target scalar.
    - joint: J2-output-sensitive-join-and-coefficient-replay
      verdict: breaks
      join_reconstruction:
        first_level_left: >-
          The only supplied exact construction of F_12 loops over all L^2
          pairs, computes S=R_1i+R_2k, evaluates K_EC, and emits the complete
          labelled record when the bucket is zero.
        first_level_right: >-
          F_34 is constructed by the identical L^2 loop. The two scans perform
          2L^2 EC additions/key evaluations, hence Theta(L^2) total work even
          when the emitted output is small.
        bucket_preimage_route: >-
          Enumerating the bucket-zero point support already costs scale p/L;
          under p=Theta(N) this is N^(2/3+o(1)). The packet explicitly leaves
          list-membership work uncharged in that headline, and supplies no
          exact batched method that reports all U,V with U+V=S. It therefore
          does not rescue the target bound.
        cross_opposite_sum_join: >-
          Conditional on complete F_12 and F_34 records, an exact downstream
          join is straightforward: build a multimap from every full right point
          S to all of its records, then query -S for every left record and emit
          the Cartesian product of matching multiplicity lists. Expected hash
          cost is O(m_12+m_34+z), or deterministic sorting cost
          O((m_12+m_34) log(m_12+m_34)+z), where z is the number of emitted
          four-leaf candidates. A one-record map would lose lineage, and a join
          on only K_EC or x(S) would admit false sign matches.
        output_boundary: >-
          No high-probability bound on m_12, m_34, or z is established. Each
          first-level output can be as large as L^2 on a degenerate input, and
          the cross multiplicity can be as large as m_12*m_34. These output
          costs may be charged as output, but they cannot be replaced by the
          desired unproved Theta(L)-per-side tail.
      output_sensitive_gate:
        outcome: breaks
        detail: >-
          No exact O(L polylog N+output) first-level enumerator, complement
          index, or separately sortable leaf representation is supplied. The
          direct scan is exact but always inspects L^2 pairs; the full table
          also stores L^2 records; and the other two sketched routes are either
          incomplete or already too expensive. This confirms the packet's
          scoped C2 failure and does not prove that all possible indices for
          this or another key require quadratic work.
      coefficient_replay:
        outcome: holds_conditionally_on_complete_emitted_records
        derivation:
          - >-
            Each checked leaf satisfies R_ji=a_ji P+b_ji Q. Therefore an
            emitted left record satisfies S_12=A_12 P+B_12 Q, and an emitted
            right record satisfies S_34=A_34 P+B_34 Q, with all coefficients
            reduced modulo N.
          - >-
            A full-point opposite-sum match S_12+S_34=O gives
            A P+B Q=O for A=A_12+A_34 and B=B_12+B_34 modulo N.
          - >-
            Since Q=xP and P has prime order N, the relation is
            (A+Bx)P=O and hence A+Bx=0 mod N. When B is nonzero, B is
            invertible and x_candidate=-A*B^(-1) mod N.
          - >-
            The public check x_candidate*P=Q is necessary and sufficient for
            accepting the candidate in the stated prime-order subgroup.
        mandatory_conditions:
          - retain every matching pair record and all four list-qualified source IDs
          - recompute every leaf and both pair points from the recorded coefficients
          - reject duplicate source identifiers and every replay mismatch
          - require the four-point sum to be O
          - reject B=0 mod N before inversion
          - reject any candidate for which x_candidate*P differs from Q
        limitation: >-
          This establishes decoder algebra, not candidate production or a
          nonzero-denominator probability. The packet contains zero emitted
          instances and zero experiment runs.
      break_scope: >-
        J2 breaks at the required output-sensitive first-level join. The
        coefficient lineage and scalar-verification implication hold if an
        exact enumerator emits complete records, and no generic selector lower
        bound follows from the missing construction.
      required_repair:
        - Supply one exact first-level reporting algorithm and prove O(L polylog N+output) time without hidden preprocessing or advice.
        - Specify the full-point multiplicity-preserving opposite-sum multimap or an equivalent exact join.
        - Keep source identifiers and coefficients through every emitted multiplicity and replay rejection.
  scoped_recommendation: REVISE
  recommendation_basis: >-
    Do not select K-EC-XINTERVAL-1 as a repaired-JPR N^(1/3+o(1)) route from
    this packet. J1's distributional input is incompletely frozen and J2's only
    exact supplied first-level join costs Theta(L^2). The formula, direct
    reachability baseline, and conditional coefficient decoder remain useful
    scoped artifacts.
  limitations:
    - Static zero-run review only; no implementation, experiment, or scientific measurement was authorized or performed.
    - J3 conditioned tails/success/cost and J4/J5 controls/novelty/scope were not reviewed.
    - No conclusion is drawn about a different EC-derived key or a future index for this key.
  procedure_notes:
