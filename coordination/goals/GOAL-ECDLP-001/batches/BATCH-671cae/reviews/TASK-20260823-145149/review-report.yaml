  definitions:
    L: "ceil(N^(1/3))"
    accepted_set: >-
      A = {O} union {R in G minus {O}: enc_p(x(R)) < w}, where
      w=ceil(p/L). Because x(-R)=x(R), A=-A.
    accepted_set_size: "a = |A|"
    single_pair_acceptance: "q = Pr[U+V in A]"
    side_survivor_count: "Z = sum over 1<=i,j<=L of 1[U_i+V_j in A]"
    opposite_collision_count: >-
      C = sum over i,j,k,l of 1[U_i+V_j in A and
      U_i+V_j+U'_k+V'_l=O].
  metric_recomputations:
    - metric: best_exact_enumerator_supplied_by_statement
      result: breaks_target
      derivation: >-
        The packet gives a predicate K but no subquadratic enumeration
        algorithm or index. The exact fallback derivable from the statement is
        the nested scan: evaluate U_i+V_j and K for every one of L^2 pairs on
        each of two sides. It performs exactly 2L^2 point/predicate evaluations,
        hence Theta(L^2 polylog N)=N^(2/3+o(1)) time. With streaming, input
        storage is Theta(L) and retained-pair storage is Theta(Z); materializing
        every possible output can require Theta(L^2). This is the complexity
        of the supplied fallback, not a lower bound against every possible
        future enumerator.
    - metric: survivor_expectation_and_variance
      result: conditional_derivation
      derivation: >-
        For general iid source laws mu and nu, define
        r(u)=Pr_V[u+V in A] and c(v)=Pr_U[U+v in A]. Then
        E[Z]=L^2 q and Var(Z)=L^2 q(1-q)+L^2(L-1)
        (Var_mu(r)+Var_nu(c)). Thus q=Theta(1/L) is necessary for
        E[Z]=Theta(L), while an expectation alone gives no high-probability
        tail. If source points are iid uniform on G, r=c=q=a/N exactly and the
        covariance terms vanish. If additionally a=Theta(N/L), then
        E[Z]=Theta(L), Var(Z)=Theta(L), and Chebyshev gives
        Pr[|Z-EZ| >= epsilon EZ]=O(1/(epsilon^2 L)), hence Z=Theta(L)
        with high probability.
      missing_statements:
        - The coefficient sampling domain and law, sufficient to imply iid-uniform point records in G.
        - A two-sided subgroup bucket-mass bound a=Theta(N/L); w approximately p/L alone does not prove it for an arbitrary prime-order subgroup G of E(F_p).
        - Or, without uniformity, quantitative bounds on q, Var(r), and Var(c) strong enough to imply the same tail.
    - metric: conditioned_renyi2_and_cross_collision
      result: conditional_derivation
      derivation: >-
        Under iid-uniform points, the sum conditioned on acceptance is uniform
        on A, so pi(s)=1/a for s in A. Its Renyi-2 collision mass is
        sum_s pi(s)^2=1/a. Since A=-A, the opposite-side cross mass is
        kappa=sum_s pi_left(s) pi_right(-s)=1/a. With a=Theta(N/L),
        kappa=Theta(L/N)=Theta(N^(-2/3)). For nonuniform survivor laws,
        separate Renyi-2 upper bounds give at most a Cauchy-Schwarz upper bound;
        they do not supply the required lower overlap. A two-sided cross-mass
        statement is required.
    - metric: actual_shared_source_collision_second_moment
      result: conditional_derivation
      derivation: >-
        Marginal kappa does not by itself prove that any collision occurs,
        because survivor outputs share list records. In the sufficient
        iid-uniform model, this dependence can be counted exactly. With a=|A|,
        E[C]=L^4 a/N^2 and
        E[C^2]=L^4*(a/N^2 + 2*(L^2-1)*a/N^3
        + (L^2-1)^2*a^2/N^4). The three terms are respectively the identical
        quadruple, pairs sharing one complete left or right source pair, and
        pairs sharing neither complete side. At L=N^(1/3) and a=Theta(N/L),
        both E[C] and E[C^2] are Theta(1). Paley-Zygmund therefore gives
        Pr[C>0]=Omega(1). The packet states neither the iid-uniform premise nor
        an equivalent conditional first/second-moment bound for its actual
        enumerator outputs.
      minimally_sufficient_replacement: >-
        Conditional on both survivor-tail events, establish E[C]>=c1>0 and
        E[C^2]<=c2<infinity uniformly in N, including every shared-source
        overlap class. Then Pr[C>0]>=c1^2/c2.
    - metric: coefficient_replay_and_denominator
      result: algebra_holds_probability_unknown
      derivation: >-
        If the left and right retained records replay to
        S_L=A_L P+B_L Q and S_R=A_R P+B_R Q and S_L+S_R=O, set
        A=A_L+A_R mod N and B=B_L+B_R mod N. Then AP+BQ=O. Since Q=xP and P
        has prime order N, A+Bx=0 mod N. For B != 0, prime N makes B invertible
        and x=-A*B^(-1) mod N; xP=Q is the mandatory independent verification.
        If B=0, then A=0 and the relation is tautological, so it must be
        rejected. The packet does not state a coefficient law or conditional
        bound on B=0, duplicate outputs, or replay failures.
      sufficient_non_degeneracy_model: >-
        If every (a,b) is iid uniform on Z_N^2, the map (a,b) -> (a+bx,b) is a
        bijection, so b is uniform and independent of the point record. For a
        collision selected using only point values and source IDs, the summed
        B is uniform conditional on the collision and Pr[B=0]=1/N. This useful
        fact is conditional because that coefficient law and selection rule
        are absent from the packet.
    - metric: achieved_joint_success
      result: not_derived
      derivation: >-
        Let T be the event that both survivor counts have their declared tails,
        C the event of at least one opposite collision, and G the event that a
        selected/replayed collision is nonduplicate, has B != 0, and verifies.
        One-attempt success is exactly
        s=Pr[T]*Pr[C|T]*Pr[G|T,C]. Marginal estimates may not be multiplied
        without these conditional bounds. The packet supplies none of the
        three lower bounds, so constant achieved verified success does not
        follow.
    - metric: retry_nesting
      result: formula_derived_parameter_unknown
      derivation: >-
        Independent fresh attempts with success s need expected 1/s attempts;
        failure at most delta needs ceil(log(delta)/log(1-s)) attempts. Reusing
        the same deterministic lists, outputs, or collision transcript does
        not create a fresh event. If s=N^(-alpha+o(1)), a per-attempt time
        N^(t+o(1)) becomes expected sequential time N^(t+alpha+o(1)); cumulative
        data and communication exponents also gain alpha, while sequential
        peak-memory exponent does not. Running N^alpha attempts in parallel
        preserves total work N^(t+alpha+o(1)) and raises aggregate memory by
        alpha even if ideal wall time stays N^(t+o(1)). The packet leaves s,
        freshness, and alpha unknown.
  control_checks:
    - control: ambient_versus_conditioned_probability
      result: breaks_without_repair
      detail: >-
        The ambient probability for two uniform group points to be opposites is
        1/N. The requested N^(-2/3) value is the conditioned probability 1/a
        only after a=Theta(N^(2/3)) and uniform conditioned survivor laws are
        proved. Substituting either ambient or conditioned probability for the
        other is invalid.
    - control: upper_bound_versus_achieved_success
      result: breaks_without_repair
      detail: >-
        Renyi-2 or Cauchy-Schwarz upper control is not a lower collision bound,
        and E[C]=Theta(1) alone is not Pr[C>0]=Theta(1). The actual factorial
        second moment, including shared-source overlaps, is required.
    - control: fresh_retry
      result: breaks_without_repair
      detail: >-
        A retry must resample every random object on which T, C, and G depend.
        Rechecking one fixed leaf only repeats the same outcome and cannot be
        charged as a geometric trial.
