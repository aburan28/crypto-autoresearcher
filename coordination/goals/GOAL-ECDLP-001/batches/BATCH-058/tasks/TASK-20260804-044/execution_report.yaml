execution_summary:
  task_id: TASK-20260804-044
  batch_id: BATCH-058
  run_id: RUN-OIFP-002
  amendment_id: PA-OIFP-0ca0c9-v2-rc58
  status: completed_valid

  key_finding: >-
    OIFP MITM collisions found at all 4 large-class reps (class_size in [174, 558]).
    Mean ratio of total_evals to sqrt(class_size) = 68.5 (range: 37-87).
    The birthday paradox prediction (O(sqrt(class_size))) underestimates actual cost
    by a factor C ~ 40-90. This is consistent with the 3-isogeny volcano graph having
    SLOW MIXING TIME: the volcano structure (crater + floors of varying levels) creates
    bottlenecks that prevent random walks from quickly exploring the full class.

  volcano_mixing_analysis: >-
    The 3-isogeny graph on h(D) ordinary curves has hierarchical (volcano) structure:
    - Surface (top level): ~h(O_K) curves with maximal CM order
    - Lower floors: curves with smaller CM orders (conductors f=2,3,...)
    - Each level has degree at most 4 (floor: degree 1 up + degree 3 down)
    - A random walk starting at the surface can get "trapped" on the surface for
      O(h(O_K)) steps before descending, and descending takes O(log_3(f)) steps
    - This hierarchical bottleneck means the mixing time is O(h(D)^{1/2} * const)
      where const captures the volcano depth and level structure
    - For our measured constant C~68.5: if C grows as O(log p), the total MITM cost
      is O(log(p) * sqrt(h(D))) = O(log(p) * p^{1/4}), which is still O(p^{1/4+epsilon})
      and potentially sub-rho asymptotically

  implication_for_h_oifp: >-
    H-OIFP-097d1a claimed O(p^{1/4}) based on birthday paradox. The actual cost is
    O(C * p^{1/4}) with C ~ 50-100 measured at bits=21. Whether C is a constant or
    grows with p is the key open question. If C = O(1): the algorithm is still O(p^{1/4})
    but with a large constant. If C = O(log p): still O(p^{1/4+epsilon}). If C = O(p^epsilon):
    the algorithm may not be polynomial improvement over L[1/2]. A scale-up experiment
    at bits=40+ is needed to measure C's behavior with p.

  observations_only: true
  hypothesis_status_unchanged: true
