  verdict_rationale: >-
    The successor preserves the predecessor population and claim ceiling, and
    its planted arithmetic, key lengths, seven SHAKE256 fixtures, enums, frame
    hashes, Type-1 ranks, thirteen file geometries, padding totals, and displayed
    stage sums independently recompute. It remains below experiment-design
    readiness because the primary gap rule lacks canonical retained bytes,
    schedule, provenance, and mutation encodings admit multiple byte streams,
    the resource ledger omits mandatory work, and S4 finalization is cyclic.
    These are repairable specification defects, not mathematical evidence or an
    ECDLP impossibility result.

  narrowest_supported_statement: >-
    Immutable EXP-ECDLP-ffa5c3 is a claim-safe deterministic apparatus-design
    successor whose seed, planted population, exact means, slope and gamma
    references, XOF fixtures, principal binary geometries, and headline
    arithmetic are internally consistent. It does not yet define one
    independently reproducible end-to-end package or primary gap decision in
    canonical bytes. Nothing reviewed establishes implementation correctness,
    execution readiness, an observed apparatus result, an elliptic-curve
    phenomenon, an ECDLP attack, a speedup, a security impact, an asymptotic
    improvement, a cryptographic-scale result, a state transition, closure, or
    a breakthrough.

