  per_predecessor_finding_dispositions:
    - id: REV-BOOT-GAP-001
      disposition: not_closed
      blocking_residual: >-
        The gap has no canonical finite representation, adaptive ordering rule,
        retained 8191-value artifact, endpoint records, or allocated geometry.
      repair_action: >-
        Freeze an exact gap representation, interval refinement and ordering,
        tie handling, retained records, and all resulting resource totals.
    - id: REV-SERIALIZATION-002
      disposition: not_closed
      blocking_residual: >-
        COMPSCH2 lacks exact flags, counters, and digest-input grammar;
        PROVRC02 lacks nested schemas and complete escaping; ALIASv02 lacks a
        field layout.
      repair_action: >-
        Freeze exact bytes and complete whole-record fixtures for all three.
    - id: REV-DECODER-003
      disposition: closed_at_design_scope
      confirmed_repair: >-
        The design truthfully encodes S and one M field, declares X, Y, and V
        aliases, and defers source-independence evidence to implementation.
    - id: REV-RESOURCE-ARTIFACT-004
      disposition: not_closed
      blocking_residual: >-
        The written rows add correctly but omit mandatory sort, quantile,
        comparison, index-consumer, gap-archive, and acyclic final-verification work.
      repair_action: >-
        Freeze the complete producer-consumer-verifier graph and recompute all
        operations, bytes, archive geometry, and caps.
    - id: REV-MUTATION-CONTROL-005
      disposition: not_closed
      current_design_blocking: true
      blocking_residual: >-
        Mutation enclosure, offsets, retained or rebound digests, ALIASv02
        parsing, and therefore the exact first error are not uniquely frozen.
    - id: REV-PROBABILITY-LABEL-006
      disposition: closed_at_design_scope
      confirmed_repair: >-
        The estimator is correctly named a fixed aggregated binomial objective
        over deterministic aggregates with no sampling-law interpretation.

  new_findings:
    - id: REV-GAP-REPRESENTATION-007
      severity: critical
      blocking: true
      title: Gap ordering and retained bytes are undefined
      evidence: >-
        FITREC02 has 49152 arm-fit records with alpha and beta interval
        endpoints only; no gap record kind, representative, refinement,
        ordering, tie rule, or archive allocation exists for 8191 gaps.
    - id: REV-CANONICAL-SCHEDULE-008
      severity: critical
      blocking: true
      title: Compiler schedule and provenance are not byte-canonical
      evidence: >-
        COMPSCH2, PROVRC02, and ALIASv02 admit multiple byte streams under
        reasonable implementations because their complete grammars are absent.
    - id: REV-RESOURCE-CONSUMER-009
      severity: critical
      blocking: true
      title: Zero-residual resource ledger omits required consumers
      evidence: >-
        Per-arm sorts and endpoints, independent retained-index comparison,
        cluster-rank comparison, S3 index consumption, and gap storage are absent.
    - id: REV-PACKAGE-FINALIZATION-010
      severity: critical
      blocking: true
      title: S4 final package attestation is causally self-referential
      evidence: >-
        S4 produces the logs, provenance, and index that purportedly contain
        verification, final measurements, validity, and hashes of themselves.
    - id: REV-MUTATION-LAYER-011
      severity: major
      blocking: true
      title: Mutation first-error layer is not uniquely determined
      evidence: >-
        Fixtures do not identify the enclosing object or every retained and
        rebound digest, so conforming enclosures can reach different first errors.

