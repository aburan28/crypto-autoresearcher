        no cancelled_by_budget, no skipped cell anywhere - census_cells_measured
        136 of 136 planned, cells_skipped empty.
    - id: A9
      check: AGENTS.md artifact policy, field by field, all six manifests
      method: programmatic per-field presence table
      result: |-
        PASS, 23 of 23 fields present in 6 of 6 manifests. Exact command; git
        commit; dirty-tree state; environment and dependency versions; input
        parameters; random seeds with their derivation; requested model policy;
        backend; resolved runtime model identifier; model provenance;
        probe-verification status; reasoning effort; fallback_used;
        degraded_requirements; stdout location; stderr location; raw results
