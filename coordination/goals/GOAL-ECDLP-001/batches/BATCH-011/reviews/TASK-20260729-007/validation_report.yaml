        checkable by any third party.
    - id: A6
      check: upstream archive receipts in the chain
      method: same three checks applied to 82327a02, 59f2e930, 009b90a5
      result: >-
        PASS with one carried defect. TASK-20260729-002 (82327a02) 3 declared / 3
        committed / 3 hashes match. TASK-20260729-013 (009b90a5) 2 / 2 / 2 match.
        TASK-20260729-012 (59f2e930) commits 2 paths against 1 declared source
