        The backend field is present and honestly null - AUTORESEARCH_BACKEND was
        unset - rather than absent or invented.
    - id: A10
      check: seed integrity
      method: read and compare across runs
      result: >-
        PASS. Six master seeds 110201, 110301, 110401, 110501, 110601, 110701 -
        present, distinct per run, and identical to v1 replication.seeds which v2
        `not_changed` leaves alone. Derivation is
        derive_seed(master, *parts) = first 8 bytes of SHA-256 of the joined
        string; every derived per-cell, per-draw and per-seed value is recorded
        beside the number it produced. Sufficient to reproduce every reported
        number - proved by M1 below, not asserted.

  metric_recomputations:
    - id: M1
      quantity: full re-execution of all six runs from the recorded command
      method: >-
        committed driver, recorded command, --out-root to a scratch path OUTSIDE
        the repository; then every results.json diffed against the committed one
        with no normalisation, and the differing leaf keys enumerated
      result: |-
        EXACT. 7.8 s total. Every differing leaf across all six files is a timing
        field and nothing else - `seconds` 136 times, `instance_setup_seconds` 20
        times, `elapsed_seconds` 6 times. Zero measured quantities, zero seeds,
        zero derived statistics and zero flags differ. Manifests differ only in
        git state (HEAD has moved since), timestamps and the four measured
        resource fields.
        The Executor's reproducibility claim is confirmed exactly.
    - id: M2
      quantity: summary.json derivability
      method: >-
        the COMMITTED six results.json and manifest.json copied to a scratch
        root, then --summarize run over them
      result: >-
        BYTE-IDENTICAL. sha256 of the regenerated file is
        2287b277b6f6ce842230ca13bf1217a8ba34cc6da1d2d362123502810f7b2aeb, exactly
        the value the TASK-20260729-006 receipt binds. No number in summary.json
        is hand-entered. This satisfies the raw-to-summary agreement gate at the
        strongest available level - not value-by-value comparison but byte
        identity of a regeneration from the raw files.
    - id: M3
      quantity: the P_pred missing-term diagnostic, THE LOAD-BEARING CLAIM
      method: >-
        recomputed in this session from N, B, C_red and m alone, plus the
        antipodal arm's raw mean and sd, at all 49 cells; the Executor's derived
        fields were then compared to mine, not copied
      result: |-
        CONFIRMED EXACTLY, AND IT IS AN ARITHMETIC FINDING, NOT AN
        INTERPRETATION.
        max abs difference between my P_pred and the recorded P_pred over 49
        cells is 0.0. My z agrees with mean_minus_P_pred_over_sd to 1e-9 at all
        49 cells; my add-back residual agrees with
        residual_after_adding_back_over_sd to 1e-9 at all 49.
        z vs P_pred spans [-12.43936, +0.24912].
        z after adding back the |S_(m-2)| e^-lambda term spans
        [-0.53450, +0.26740].
        4 cells exceed 3 sd, all at m = 3, at z = -12.4394 (k=18 beta=0.200),
        -5.8995 (k=16 beta=0.225), -5.7486 (k=18 beta=0.225) and -3.9203
        (k=18 beta=0.250). My threshold call agrees with the recorded
        INV_4_within_3_empirical_sd flag at all 49 cells, 0 disagreements.
        Split by arity, which is what decides the reading -
        m = 2, 29 cells, z in [-0.938, +0.249], no systematic sign.
        m = 3, 20 cells, z in [-12.439, -0.231], EVERY ONE NEGATIVE.
        Adding back one term collapses a 12.4-sigma discrepancy to 0.03 sigma.
        So the amendment C-4 sentence "P_pred is therefore CORRECT to O(1)"
        holds at m = 2, where the omitted term is |S_0| = 1, and fails at m = 3,
        where it is |S_1| = B and is the entire discrepancy.
    - id: M4
      quantity: >-
        location of the discrepancy - contract clause vs driver implementation
      method: read v2 C-4 against occupancy_null() in the committed driver
      result: |-
        RECORDED AS FACT, NOT ADJUDICATED. v2 C-4's own antipodal-mean derivation
        gives (N-1)(1 - e^-lambda) and contains NO |S_(m-2)| e^-lambda term,
        while the v1 P_pred it declares correct to O(1) does contain one. The
        driver implements C-4's process exactly as written - draw g uniformly
        from G, insert both g and -g, C_red/2 times, into a ZEROED N-bit array,
        never pre-marking any bin - and evaluates INV-4 against P_pred exactly as
        frozen. The gap is therefore between two committed contract clauses, not
        between the contract and the driver, and not an implementation departure.
        WHETHER THE VOID VERDICT SHOULD STAND OR BE RE-DISPOSITIONED IS NOT MINE.
        It is the Coordinator's, informed by TASK-20260729-008.
    - id: M5
      quantity: >-
        independent recount of |S_m| by a different representation
      method: >-
        own program, explicit elliptic-curve point addition over every m-element
        multiset, distinct sums in a Python set; NO discrete-logarithm table is
        built and no point is ever converted to an integer
      result: |-
        EXACT AGREEMENT AT ALL FOUR RECOUNTED CELLS, TO EVERY PRINTED DIGIT.
        k=12 beta=0.275 m=3, the SMALLEST criterion-evaluable cell -
          L 10, B 16, C_all 816, C(B,m) 560, C_red 688, |S_m| 642,
          P_pred 645.568750542, E 0.994471928, R 0.9634644562, R_max 1.2245903368.
        k=12 beta=0.400 m=2 - B 36, C_all 666, C_red 648, |S_m| 587,
          P_pred 599.09744201, E 0.9798072214, R 0.9280523233.
        k=12 beta=0.325 m=3 - B 22, C_all 2024, C_red 1782, |S_m| 1232,
          P_pred 1452.151015584, E 0.8483966108, R 0.7112188895.
        k=14 beta=0.350 m=2 - B 34, C_all 595, C_red 578, |S_m| 563,
          P_pred 569.030071499, E 0.9894028949, R 0.9618574521.
        THE DEC-20260727-009 FAILURE MODE IS NOT PRESENT. The primary metric is a
        measurement of the quantity it names, at these cells, confirmed through an
        independent representation.
    - id: M6
      quantity: cell classing, recounted from the predicate
      method: >-
        own implementation of the v2 C-2 R-1 predicate and of the C_red closed
        form, run over all 136 recorded cells
      result: |-
        CONFIRMED. 49 criterion-evaluable on measured B; 44 on the B = L basis;
        11 changed class. My C_red, my h and my evaluable flag each match the
        recorded value at all 136 cells, 0 mismatches, and the
        class_changed_on_measurement flag is consistent at all 136.
        R-7 drift = |49 - 44| = 5 > 4, so R-7 FIRES. Confirmed independently. The
        disclosure obligation is met - summary.json
        realised_evaluable_set.R_7_drift_disclosure names all eleven moved cells
        with their direction. R-7 is a disclosure, not a stop and not an
        invalidation.
    - id: M7
      quantity: was the cell class frozen before S_m existed
      method: code-level reading of run_census()
      result: |-
        YES, VERIFIED IN CODE RATHER THAN ACCEPTED AS AN ASSERTION. Pass 1 walks
        all 68 cells of the arity and calls classify_cell(B, m, p), whose
        signature admits only B, m and p - it cannot see a sum set and none
        exists yet - and freezes the record. Pass 2 computes the census and
        COPIES the class in from the pass-1 record; it never recomputes or
        revises it. A class that is a function of its outcome would void the
        design. It is not one.
    - id: M8
      quantity: parity
      method: recomputed B mod 2 and C_red mod 2 at every cell
      result: >-
        CONFIRMED AND STRONGER THAN CLAIMED. Measured B is even at all 136 cells,
        zero odd. C_red is even at all 136 cells, not merely at the
        criterion-evaluable ones. The recorded C_red_is_even flags agree.
    - id: M9
      quantity: variance doubling, from the archived contrast arm
      method: recomputed the ratios from the two arms' raw sd values at 49 cells
      result: |-
        CONFIRMED. Variance ratio antipodal over independent - mean 2.117811,
        median 2.015342, min 1.047669, max 3.622515. sd ratio - mean 1.442891,
        median 1.419627, min 1.023557, max 1.903291, against the analytic
        sqrt(2) = 1.4142136. My per-cell values agree with the recorded ones to
        1e-9 and my rollup reproduces contrast_arm_summary exactly. The factor is
        measured inside the driver and archived, not imported from the unarchived
        TASK-20260729-003 probe.
    - id: M10
      quantity: baselines against the model positions
      method: recomputed 0.886*sqrt(N) and 2*sqrt(N) at all four sizes
      result: |-
        CONFIRMED. rho walk-step means over 16 targets, measured over model -
        k=12 59.125 / 56.043 = 1.0550; k=14 117.062 / 114.218 = 1.0249;
        k=16 260.938 / 226.984 = 1.1496; k=18 492.125 / 453.254 = 1.0858.
        EVERY size is ABOVE the model position, so INV-6 (rho more than 20 per
        cent BELOW 0.886 sqrt(N)) cannot fire and did not. BSGS memory 64 / 129 /
        257 / 512 stored elements sits at sqrt(N) and is reported beside its time.
        The rho measurement convention - table-based walk stopping at first
        repetition, so the step count is exactly the quantity the model position
        names - is declared in the record rather than assumed.
    - id: M11
      quantity: the 128 claimed discrete-logarithm solves
      method: >-
        own curve selection, own generator rule, own point counting, own
        baby-step giant-step; every one of the 64 targets re-solved
      result: |-
        ALL 128 CONFIRMED BY AN INDEPENDENT IMPLEMENTATION. My re-derivation of
        the four curves reproduces the package exactly, including the search
        bookkeeping, which means my reading of the contract's selection rule and
        the driver's are the same reading -
        k=12 p=4099 a=4 b=8 N=4001 G=(1,264), 59 candidates at t=12;
        k=14 p=16411 a=4 b=1 N=16619 G=(0,1), 10 at t=5;
        k=16 p=65537 a=12 b=2 N=65633 G=(0,4080), 90 at t=14;
        k=18 p=262147 a=5 b=1 N=261707 G=(0,1), 15 at t=6.
        N*G = identity and G on the curve at all four. My BSGS re-solved 16/16
        targets at each size with 0 mismatches, and rho_d = bsgs_d = d_true at all
        64. My solver shares no code with rho, with BSGS or with the DL table.
    - id: M12
      quantity: CTRL-CALIB-AP recovered penalties
      method: >-
        recomputed C(B,m)/median(supply) from the per-seed ap_supply_distinct
        values at all six cells
      result: |-
        6 OF 6 INSIDE THE FACTOR-2 WINDOW ON RATIO OF MEDIANS, RECOMPUTED.
        n=211  m=3 B=15 24 seeds C=455    med 21.0  -> 21.6667 vs 17.5   factor 1.2381
        n=211  m=4 B=15 24 seeds C=1365   med 5.0   -> 273.00  vs 214.9  factor 1.2704
        n=1009 m=3 B=32  6 seeds C=4960   med 118.0 -> 42.0339 vs 41.9   factor 1.0032
        n=1009 m=4 B=32  6 seeds C=35960  med 40.0  -> 899.00  vs 924.5  factor 1.0284
        n=4099 m=3 B=65  6 seeds C=43680  med 510.5 -> 85.5632 vs 87.8   factor 1.0261
        n=4099 m=4 B=65  6 seeds C=677040 med 168.0 -> 4030.00 vs 4128.6 factor 1.0245
        Every derived field in the package's calibration cells reproduces exactly
        - C_B_m, supply_median, supply_min, supply_max, seed count, both estimator
        forms, factor_vs_target and within_factor_2. Monotone growth in n at fixed
        m holds on my numbers; superlinear growth in m under DEV-5's declared
        reading holds at all three n. Seed counts honour C-8(a): 24 at both n=211
        cells, 6 elsewhere. B = 15 / 32 / 65 as C-8 freezes it, recorded per cell.
    - id: M13
      quantity: >-
        the convention risks - point count vs interval, the m factorial
        denominator, repeated elements, the identity, unordered vs ordered
      method: checked each against the frozen contract and against my recount
      result: |-
        NO SILENT DIVERGENCE ON ANY OF THE FIVE.
        Point count vs interval - every criterion runs on measured B, never on L;
        confirmed in code (classify_cell takes B, m, p) and in data (both B and L
        reported at all 136 cells, B/L 1.2 to 1.67 at small L).
        m factorial - C_all = C(B+m-1, m) and C_all*m!/B^m = prod(1 + j/B) both
        reported; my recount's C_all matches at all four recounted cells, so the
        denominator is checked rather than assumed.
        Repeated elements - multisets with repetition; my
        combinations_with_replacement count equals C_all; C(B,m) reported
        alongside; C_red's closed form reproduces at all 136 cells.
        Identity - present in S_m at both recounted m=2 cells and absent at both
        m=3 cells, matching the contract's statement that the identity is in S_m
        for even m and never in F.
        Ordering - unordered throughout; no ordered variant appears in any
        reported ratio.

  control_checks:
    - id: C1
      control: CTRL-DL
      result: >-
        PASS. Eight records, four sizes by two arities, 10^4 random m-multisets
        each, ZERO mismatches between curve-side and DL-image sums. Walk closure
        OK and the 2x+1 = N point count OK at all four sizes. INV-3 did not fire.
        This is the control that actually stands behind the census and it is
        clean. Minor undeclared reading recorded under limitation L-3.
    - id: C2
      control: CTRL-NULL-SUMSET, the shape-matched occupancy null
      result: |-
        RAN AS SPECIFIED; INV-4 FIRED. 49 criterion-evaluable cells, replicate
        counts 100 at 38 cells and 30 at 11, exactly the v2 C-14 rule (100 if
        C_red <= 1e4, 30 if <= 1e6, else 10). Antipodal process implemented
        verbatim per C-4. INV-4 evaluated against P_pred as frozen under DEV-4's
        literal single-replicate-sd reading. 4 of 49 cells fail at 3 sd, all m=3.
        NOTE ON THE DEV-4 READING, BECAUSE IT COULD HAVE GONE THE OTHER WAY: the
        literal reading applied is the CONSERVATIVE-TO-FIRE one. Had the standard
        error of the mean been used as the denominator instead, INV-4 would have
        fired far more widely. The reading chosen is not the one that manufactures
        the firing.
    - id: C3
      control: CTRL-NULL-FB, the destroy-parameter null
      result: |-
        SHAPE-MATCHED, IDENTICALLY MEASURED, CORRECTLY PARAMETERISED - VERDICT
        YES ON ALL THREE. 49 cells, 0 skipped. Draws 10 where measured B <= 64
        (33 cells) and 3 otherwise (16 cells), exactly v2 C-13, verified cell by
        cell. Uniform random NEGATION-CLOSED factor base of the IDENTICAL measured
        B on the IDENTICAL curve through the IDENTICAL code path - verified in
        code: sum_set_chain -> distinct_sumset -> shared_membership_distinct, the
        same three functions the census uses.
        DECAY: reported, NOT adjudicated, and deliberately so. The package
        records 49 cells compared, 16 not shrinking under the strict reading, 0
        not-shrinking AND out-of-band, and firing_determination null under DEV-6.
        At every one of the three out-of-band cells the deviation DOES decay
        (deviation_shrinks_under_randomisation_strict_reading true at all three).
        I state the statistic and make no INV-5 determination: the contract never
        quantifies "shrink" and v2 C-13 gives the disposition a three-way reading
        the Executor was right to refuse and that I am not authorised to choose
        either. It belongs to TASK-20260729-008 and the Coordinator.
    - id: C4
      control: CTRL-CALIB-AP
      result: |-
        PASS, AND THE CENSUS VOID VERDICT FROM THIS LEG IS NOT-VOID.
        6 of 6 cells inside the factor-2 window on ratio of medians, recomputed
        by me at M12. INV-2a DID NOT FIRE - the shared distinct-count and
        membership routine agrees with independently computed exact values on 7 of
        7 known-answer cases, in every one of the six runs. INV-2b DID NOT FIRE -
        zero cells outside the window and no trend clause failure.
        Only INV-2a can void, per v2 C-8, and it did not.
        ST-3 correctly did NOT fire on the AP admissibility predicate: the reading
        is recorded verbatim as resolved from the committed EXP-STR-001 contract,
        which is what C-8's named_execution_risk_discharged requires.
    - id: C5
      control: CTRL-EXHAUSTIVE-TRUTH
      result: >-
        PRESENT AND EXERCISED at m = 3, k = 12 and k = 14, with the sampled
        estimator run against the exhaustive value and the deviation compared to
        3 standard errors. The estimator itself is defined under DEV-3, since v1
        names SAMPLED without naming the statistic.
    - id: C6
      control: CTRL-COLLISION-ACCOUNTING
      result: >-
        PRESENT. Per cell - C_all, C(B,m), C_red, the identity-multiset count with
        its Burnside cross-check, max load, occupied buckets, load histogram, and
        the checks that the counts sum to C_all and that occupied equals |S_m|.
        These reproduce in my recount at the four recounted cells.
    - id: C7
      control: CTRL-BASELINE
      result: >-
        PASS. Measured rho and BSGS on 16 targets per size, all above the model
        positions, INV-6 not fired, memory reported beside time, and every solve
        carrying a certificate. The certificates are independently re-verified at
        M11 by my own solver, not merely by the driver's own re-check.
    - id: C8
      control: NOISE-LIMITED exclusion rule
      result: >-
        NO CELL EXCLUDED. Max measured relative null sd is 1.641 per cent against
        the unmoved 2 per cent rule. Recorded as an observation: the amendment C-4
        stated a 1.49 per cent worst case, so the realised margin is 1.22x rather
        than the 1.34x C-4 predicted. The threshold was not crossed and was not
        moved.
    - id: C9
      control: standing control - census cost versus solving the instance
      result: >-
        PASS. Census over measured-rho operation ratio 2.8e4 at k=12 to 2.6e6 at
        k=18, far above 1 at every size. The census costs vastly more than solving
        the instance outright. It is not an attack and cannot be read as one. A
        ratio below 1 would have been an accounting red flag, and none is present.

  protocol_deviation_assessment:
    DEV_1:
      subject: >-
        command, environment and stderr folded into manifest.json and stdout.log
        rather than written as command.txt, environment.json and stderr.log
      verdict: ACCEPTABLE - NOT A POLICY BREACH
      reasoning: >-
        AGENTS.md artifact policy requires each run to RETAIN the exact command,
        the environment and dependency versions, and stdout and stderr. It
        nowhere prescribes filenames. The frozen contract's
        required_artifacts_rule goes the other way and is emphatic - EXACTLY
        TWENTY FILES, NO MORE AND NO FEWER, three per run directory, no stderr
        file - and states that this is what makes the TASK-20260729-006 21-path
        declaration (20 artifacts plus the receipt) exact in advance. Writing the
        three extra files would have breached the frozen contract AND the task
        card's prohibition on undeclared artifacts.
      verified_not_assumed: >-
        Retention was checked rather than accepted. command, invocation_cwd, and
        a full environment block carrying Python version, platform, cpu_count,
        dependency versions, driver SHA-256, RLIMIT status and randomness sources
        are present in 6 of 6 manifests; stderr_location names stdout.log; the
        in-process Tee is present in the driver. Nothing is lost; only the
        location changed, for a stated contractual reason, and it was declared
        rather than done silently.
    DEV_2:
      subject: implementation notes carried in the manifest instead of a separate file
      verdict: ACCEPTABLE - same reasoning as DEV-1
      note: Notes present in 6 of 6 manifests and in summary.json.
    DEV_3:
      subject: the sampled collision-profile estimator, undefined in v1
      verdict: ACCEPTABLE
      note: >-
        A genuine under-specification - v1 names SAMPLED but names no statistic.
        The estimator is defined, the sample maximum load is explicitly labelled a
        sample statistic and NOT an estimate of the true maximum, and
        CTRL-EXHAUSTIVE-TRUTH runs the same estimator where the exhaustive value
        exists.
    DEV_4:
      subject: >-
        INV-4's "3 empirical standard deviations" - single-replicate sd versus
        standard error of the mean
      verdict: ACCEPTABLE, AND THE CONSERVATIVE CHOICE
      note: >-
        v1 really is silent. The literal single-replicate reading was applied and
        both z values are reported per cell. I confirmed the applied rule in code
        and that my own threshold call agrees at all 49 cells. The alternative
        reading would have fired INV-4 far more widely, so the reading chosen is
        not the one that manufactures the firing.
    DEV_5:
      subject: INV-2's qualitative "superlinear growth in m at fixed n"
      verdict: ACCEPTABLE
      note: >-
        Operationalised as penalty(m=4) > (4/3)*penalty(m=3) at each n, declared
        with its formula. Holds at all three n on my own recomputation.
    DEV_6:
      subject: INV-5 not adjudicated by the Executor
      verdict: ACCEPTABLE, AND THE RIGHT CALL
      note: >-
        The trigger turns on an unquantified "shrink" and v2 C-13 gives it a
        three-way disposition. Refusing to choose, archiving the comparison
        statistics per cell under two stated readings, and routing the
        determination upward is exactly what ST-4 requires of a run record.

  dry_run_contamination_finding:
    claim_under_test: >-
      A scratch-root dry run preceded the declared runs and revealed the INV-4
      firing; only reporting changed in response - no threshold, criterion, seed,
      control process, replicate count, cell class or measurement.
    what_cannot_be_checked: >-
      STATED FIRST SO IT IS NOT BURIED. git log --all shows
      experiments/EXP-YIELD-001/driver/yield_census.py has EXACTLY ONE COMMIT in
      the entire repository - 2fb2bb7a, the run package itself. There is no
      committed pre-dry-run driver blob, and the dry run wrote outside the
      repository leaving no receipt of any kind. The claim is therefore NOT
      DIRECTLY CORROBORABLE FROM GIT, and any validator asserting otherwise would
      be overstating.
    what_was_checked: |-
      The contamination surface was bounded by tracing every behaviour-governing
      constant in the committed driver back to the committed contract pair, which
      was frozen at 82327a02 and amended at 59f2e930, both strictly before the
      driver existed and both with checkable commit order.
      Evaluable predicate H_CAP 0.5 and C_RED_FLOOR 500 -> v1 criteria / v2 C-2
      R-1. Six master seeds -> v1 replication.seeds, unchanged by v2. Seed
      derivation uniform SHA-256, recorded per number. INV-4 test
      abs(mean - P_pred) <= 3*sd -> v1 INV-4 under DEV-4. Null process draw g,
      insert g and -g, C_red/2 times -> v2 C-4 verbatim. Contrast arm, same
      function with antipodal false -> v2 C-4's declared contrast. Replicate
      counts 100/30/10 -> v2 C-14 exactly. FB-null draws 10 if B <= 64 else 3 ->
      v2 C-13 exactly. NOISE-LIMITED 0.02 -> v1, unmoved. Calibration window 2.0
      and the two-miss trigger -> v2 C-8. Superlinearity 4/3 -> DEV-5, declared.
      INV-6 0.8 -> v1. Grid, sizes and arities -> v1 inputs.
      A whole-file scan for hard-coded cell coordinates found the only (k, beta)
      literals to be inside a QUOTED PC-2 disclosure string copied from the
      committed TASK-20260729-011 review. They appear in a text field and never
      in a branch condition. There is no cell-specific special-casing anywhere.
      DECISIVE STRUCTURAL CHECK: the add-back quantities are computed and
      recorded but CONSUMED BY NOTHING.
      residual_after_adding_back_S_m_minus_2_term,
      residual_after_adding_back_over_sd and P_pred_decomposition appear only in
      output dictionaries; no predicate reads them. INV_4_within_3_empirical_sd
      is evaluated against p_pred and nothing else. The one data-dependent branch
      is the `if failed:` guard on emitting the derived_diagnostic block - a
      reporting conditional, exactly as disclosed.
    finding: >-
      NO EVIDENCE OF PRE-REGISTRATION CONTAMINATION. Every threshold, criterion,
      seed, control process, replicate count and class rule in the committed
      driver matches the committed contract pair that predates it; INV-4 was
      evaluated against P_pred exactly as frozen; and the package re-executes
      bit-exactly, so no reported number is adjustable after the fact without
      changing the driver's own recorded hash. The residual surface is confined
      to WHAT GOT REPORTED, which is precisely what the Executor disclosed.
      I record explicitly that this conclusion is BOUNDED BY CONTRACT
      CONFORMANCE AND NOT PROVEN BY A RECEIPT, because no receipt for the dry run
      exists or could exist under the artifact rule the contract itself imposed.

  heuristic_validation_checks:
    - id: HV1
      check: pre-registered prediction recorded before or independently of sampling
      result: >-
        SATISFIED ON COMMIT ORDER. The prediction under test - E = |S_m| / P_pred
        = 1 + o(1) with d log E / d log p = 0 at fixed (beta, m), and the exact
        ceiling R <= (p/N) prod (1 + j/B) - is stated in the v1
        preregistered_prediction block, frozen at 82327a02, and its referents are
        restated in v2 at 59f2e930. Both precede the run package at 2fb2bb7a, and
        the v1 blob is byte-identical throughout. Pre-registration ORDER is
        established. Pre-registration STRENGTH is limited by the amendment's own
        confirmatory_status - see limitation L-6.
    - id: HV2
      check: sample integrity - size, seeds and procedure in the manifest
      result: >-
        SATISFIED. Sample sizes (49 cells, replicate counts 100/30/10, 10 or 3
        FB-null draws, 24 or 6 calibration seeds, 16 baseline targets, 10^4
        CTRL-DL samples, 10^6 sampled-profile draws), the six master seeds, and
        the SHA-256 seed derivation are all in the manifest; every derived seed is
        recorded beside the number it produced. The empirical statistics were
        recomputed by me from the raw per-cell and per-seed values at M3, M9 and
        M12 rather than copied from the report.
    - id: HV3
      check: correspondence validity
      result: >-
        NOT APPLICABLE, AND CORRECTLY DECLARED SO. The contract's
        scale_relevance.correspondence reads "null - direct sampling. No
        correspondence, isometry or transport claim of any kind is used to reach
        scale, and none is available." The census is exhaustive over all N group
        elements; there is no substitute sampler and therefore nothing to control
        for. The one representational substitution - computing in the
        discrete-logarithm image rather than on the curve - is NOT a distributional
        correspondence, it is an exact bijection, and it is covered by CTRL-DL
        (10^4 samples, zero mismatches) and independently re-verified at M5 by a
        recount that never enters the DL image at all.
    - id: HV4
      check: scale binding, and toy scale recorded as a limitation
      result: >-
        SATISFIED. 12 to 18 field bits, m at most 3, one prime-order curve per
        size, one interval anchor, one implementation, one budget. claim_tier is
        toy in all six manifests, the claim_ceiling is carried verbatim in all
        six, and the contract's scale_relevance block states that nothing measured
        here is evidence about cryptographic-size curves in either direction. This
        matches AGENTS rule 7. No manifest and no results file presents any
        quantity as crypto-scale.
    - id: HV5
      check: no interpretation in the run package
      result: >-
        SATISFIED. ST_4_no_interpretation is present in all six manifests and in
        summary.json. No outcome branch of the v2 disposition table is evaluated
        anywhere in the package, no evidence or decision record is written, no
        hypothesis status is touched, and INV-5 is explicitly left unadjudicated.
        The out_of_band and tail_checks blocks carry the note "COUNTS AND
        FRACTIONS ONLY" and "REPORTED, NOT A CRITERION".

  cost_model_checks:
    - id: CM1
      check: cost unit declared
      result: >-
        SATISFIED. operation_unit is stated as "one elliptic-curve point addition
        or doubling" in the baseline run, and the census figures are labelled
        census_group_equivalent_operations_MEASURED_MODEL_UNIT. Model positions
        are labelled DERIVED_MODEL and measured quantities MEASURED, so the two
        are never conflated.
    - id: CM2
      check: memory reported alongside time
      result: >-
        SATISFIED. BSGS memory in stored group elements (64 / 129 / 257 / 512) is
        reported beside its operation count at every size, against the sqrt(N)
        model position. Peak RSS is measured and recorded per run. rho memory is
        addressed in the declared measurement convention.
    - id: CM3
      check: optimistic assumptions flagged
      result: >-
        SATISFIED. The rho_measurement_convention block states plainly that the
        table-based walk uses O(sqrt(N)) memory rather than the O(1) of a
        Floyd/Brent or distinguished-point rho, and that a Floyd variant would
        measure a LARGER step count for the same solve. That is the flag a cost
        table needs and it is present rather than implied. rho setup operations
        are reported SEPARATELY rather than folded into the walk count, with the
        reason given.
    - id: CM4
      check: per-attempt cost times inverse success probability
      result: >-
        NOT APPLICABLE. This package reports no expected-cost bookkeeping and
        makes no attack cost claim. It reports MEASURED operation counts for a
        census and for two baselines, and their ratio. There is no success
        probability in play, so there is no such product to check and none is
        asserted. The standing control runs in the opposite direction - the census
        costs 2.8e4 to 2.6e6 times a matched rho solve, reported per instance
        precisely so no reader mistakes it for an attack.

  defects:
    - id: D-1
      severity: material
      owner: coordinator
      title: no committed record moves EXP-YIELD-001 to approved
      detail: >-
        The specification blob at the snapshot commit still reads
        `status: review_required` at line 11 and `approved_by: null` at line 706.
        I checked the blob, not the working tree. AGENTS.md "Research states" puts
        `approved` before `running`. The contract's OWN execution gate is
        satisfied by committed records - TASK-20260729-011 returned PASS at
        009b90a5, and BUDGET-AMEND-20260729-001 raising maximum_batches from 10 to
        11 is committed at 93d961e0, which I verified is an ancestor of the
        snapshot, so INT-BATCH011-A is lifted on its own terms. What is missing is
        the formal status transition, and it cannot be supplied by editing an
        immutable file. The Executor reported it rather than editing anything,
        which is correct.
    - id: D-2
      severity: material
      owner: coordinator
      title: PC-1, PC-2 and PC-4 have no separate committed Coordinator recording
      detail: >-
        Their own binding note in the TASK-20260729-011 review requires them to be
        recorded BEFORE dispatch "so that it is pre-data". The texts DO exist
        verbatim in that committed review at 009b90a5, an ancestor of the run
        package, so the pre-data property survives; what was skipped is the
        separate recording. The Executor applied the sole committed candidate
        reading in each case and flagged the gap rather than treating it as
        satisfied. PC-3 is discharged in the committed TASK-20260729-013 receipt,
        which I confirmed exists with both path hashes matching.
      related_observation: >-
        PC-2 predicted eleven cells would flip class. Eleven did - but they are
        NOT the same eleven. Only five overlap (m=2 at k=14 beta 0.350 and 0.500,
        m=2 at k=18 beta 0.275 and 0.500, m=3 at k=12 beta 0.375). The count
        agreement is coincidental and must not be read as a confirmed prediction.
    - id: D-3
      severity: minor
      owner: executor
      title: CTRL-DL's factor-base beta is an undeclared reading
      detail: >-
        The contract does not specify at which beta CTRL-DL should draw its factor
        base. The driver fixes beta = 0.500 and records it per control as
        beta_used, so nothing is hidden, but it is not enumerated among
        DEV-1..DEV-6 as the other under-specified readings were.
    - id: D-4
      severity: minor
      owner: none - observation
      title: realised null spread exceeds the amendment's stated worst case
      detail: >-
        Max measured relative null sd 1.641 per cent against C-4's stated 1.49 per
        cent worst case and the unmoved 2 per cent NOISE-LIMITED rule. No
        exclusion fired; the realised margin is 1.22x rather than 1.34x.
    - id: D-5
      severity: material
      owner: runtime - recorded, not repairable by any agent here
      title: policy binding mismatch on the executing session
      detail: >-
        The requested policy executor-implementation resolves through
        orchestration/adapter to anthropic:claude-sonnet-5 at effort medium; the
        executing session reports itself as claude-opus-5 with AUTORESEARCH_POLICY
        and AUTORESEARCH_BACKEND unset. The manifest records this as a
        policy_binding_mismatch with fallback_used false and model_verified false,
        and states that doctor --probe was run in that session and could verify
        nothing. That is the honest recording CLAUDE.md's process-level model note
        calls for - a per-role model-selection gap disclosed rather than silently
        substituted, not a backend fallback.

