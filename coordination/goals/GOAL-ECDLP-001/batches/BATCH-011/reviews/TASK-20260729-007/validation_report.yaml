    - id: A7
      check: does the TASK-20260729-012 overrun weaken the binding of MY inputs
      method: >-
        identify the undeclared path and test whether any bound input of
        TASK-20260729-007 depends on it
      result: >-
        NO. The undeclared path is the BATCH-011 dispatch_queue.json, a
        coordination record. My bound input from that commit,
        experiments/EXP-YIELD-001/amendments/v1_to_v2.yaml, IS properly declared
