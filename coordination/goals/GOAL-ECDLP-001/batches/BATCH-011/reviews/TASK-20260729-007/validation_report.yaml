  verdict: PARTIAL
  terminal_verdict: incomplete
  terminal_verdict_vocabulary: >-
    agents/validator.md required output uses passed | failed | incomplete |
    invalid. TASK-20260729-007's completion gate V9 uses PASS | PARTIAL | FAIL.
    Both are given so neither contract is answered in the other's vocabulary.
    They agree - the run package's own receipts and artifacts are sound and
    reproduce exactly, and what is missing is an upstream Coordinator
    authorization record that no producer artifact could have supplied.
  blocks_ledger_record: true
  blocks_ledger_record_discharge_condition: >-
    This block is discharged the moment DEC-20260729-001 carries the two
    narrowings N-1 and N-2 below verbatim. They are Coordinator-side recordings,
    not repairs to any run artifact, and nothing in the run package needs to be
    re-executed, re-committed or superseded to clear them. No third party need
    do anything.

  run_ids:
    - RUN-YIELD-001-CENSUS-M2
    - RUN-YIELD-001-CENSUS-M3
    - RUN-YIELD-001-NULL-UNIFORM-FB
    - RUN-YIELD-001-NULL-RANDOM-SUMSET
    - RUN-YIELD-001-CALIB-AP
    - RUN-YIELD-001-BASELINE-RHO-BSGS

  bound_snapshot:
    commit_sha: 2fb2bb7a111d999859612e52990eea7dc6bbac1a
    parent_sha: 81e5edc3660bf6831734a9e4ac637515cd760ce8
    branch: claude/ecdlp-b011
    worktree_head_at_validation: c3e2f453d8386f68683582b03a328a11e8403cbf
    receipt_path: >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-011/archives/TASK-20260729-006/snapshot_commit_receipt.json
    validated_object: >-
      THE COMMITTED PACKAGE, NOT THE WORKING TREE. Every hash below was
      recomputed from the blobs at the commit; the worktree bytes were then
