  artifact_checks:
    - id: A1
      check: snapshot commit reachability and first parent
      method: >-
        git rev-parse, git rev-list --parents -n 1, git merge-base --is-ancestor
      result: >-
        PASS. 2fb2bb7a111d resolves; its single parent is 81e5edc3660bf, equal to
        the receipt's parent_sha; it is an ancestor of HEAD.
    - id: A2
      check: exact changed-path set
      method: git diff-tree --no-commit-id --name-status -r
      result: >-
        PASS. Exactly 20 paths, all additions (status A), and the set is
        identical to the receipt's committed_paths. No overrun, no shortfall.
    - id: A3
      check: content hashes
      method: sha256 of each blob at the commit, and of each worktree file
      result: >-
        PASS. 20 of 20 path_sha256 values match at the commit; 0 mismatches. All
        20 also match the current worktree bytes.
    - id: A4
      check: dirty-tree state and stray artifacts under the experiment
      method: git status --porcelain on the experiment and batch paths
      result: >-
        PASS. Empty. No untracked files, no macOS AppleDouble sidecars, no
        scratch output, driver is exactly one file. The pre-existing dirty
        entries elsewhere in the worktree are AppleDouble deletions under
        experiments/EXP-SIG-008 and were left untouched.
    - id: A5
      check: pre-registration order of the contract pair
      method: git rev-parse of the blob ids across the whole chain
      result: >-
        PASS. specification.yaml is blob 586914984c4cd00fca16ee91c739b8363dd0fae1
        at 82327a02, 59f2e930, 009b90a5, 81e5edc3, 2fb2bb7a and c3e2f453 - byte
        identical at every commit, so the frozen contract was never rewritten and
        the amendment supersedes rather than overwrites. amendments/v1_to_v2.yaml
        is blob f54fc443cfa4e11476649da9d632a9b2aaa2cb42 at 59f2e930 and unchanged
