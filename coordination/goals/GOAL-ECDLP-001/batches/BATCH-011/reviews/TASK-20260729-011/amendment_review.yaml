  red_team_report:
    id: RT-20260729-002
    task_id: TASK-20260729-011
    claim_under_review: >-
      That the committed EXP-YIELD-001 v2 amendment discharges the four blocking
      objections of TASK-20260729-003, that its outcome disposition table is
      exhaustive and mutually exclusive by construction, that it moves no
      threshold and widens no scope beyond what the objections required, and that
      the amended protocol is executable inside the unchanged 5400-second, 8 GB
      budget.
    objections:
      - 'RT-12 material - INV-2a keeps the voiding power and has no firing predicate.'
      - 'RT-13 material - the C-7 correction note did not reach the archive chain, so the sub-1/2-exponent over-claim stands uncorrected in the committed record.'
      - 'RT-14 material - eleven knife-edge cells rather than two, and the m=2 beta=0.500 column is a coin flip at all four sizes.'
      - 'RT-15 minor - the antipodal null has no bin for the identity, which S_m can contain; O(1), no threshold moves.'
      - 'RT-16 minor - added compute understated by about 3x because the declared contrast arm is never priced.'
      - 'RT-3 residual - three reachable routes into O-9, one of them the design''s strongest negative signal, one of them at probability of order one third under the null.'
    required_controls:
      - >-
        MANDATORY, AND ALREADY IN THE AMENDMENT. The declared v1-process contrast
        arm of C-4 must actually run and be archived. It is the control that
        converts the sqrt(2) from an analytic assertion into a measured, archived
        ratio, and it is the reason RT-4 is REPAIRED rather than merely restated.
        If any arm is dropped under a budget bind, this one must not be.
      - >-
        MANDATORY. Report the identity-summing multiset count per cell beside the
        null, per RT-15, so the O(1) bin mismatch is visible rather than implicit.
      - >-
        MANDATORY. Report evaluable_on_measured_B, evaluable_on_B_equals_L and
        class_changed_on_measurement for all 136 cells per R-3, and report the
        realised per-column size counts, so RT-14's column-loss risk is auditable
        after the fact against a pre-data disclosure.
      - >-
        RECOMMENDED. Report the slope of log E in beta at fixed (k, m) as an
        observation. The prior review raised this and the amendment did not adopt
        it. Every trend criterion runs in p at fixed beta, so a beta-direction
        trend - the signature of an interval-structure effect - is invisible to
        every criterion in the design. It costs nothing at analysis time.
    counterexample_or_mutation: >-
      THE CHEAPEST DISCRIMINATING CASE, AND IT COSTS NO COMPUTE AT ALL. Take one
      evaluable column with E = 1.00, 0.92, 0.85, 0.78 at k = 12/14/16/18 - slope
      -0.0595, 95 percent interval (-0.0622, -0.0567) excluding zero,
      non-increasing, E at the largest size 0.78 - and evaluate the outcome table
      twice, once assuming the deviation shrinks under CTRL-NULL-FB and once
      assuming it does not. The first lands in O-2 and is reported as outcome (c).
      The second matches no branch except the residual O-9 and is reported as a
      completeness defect of the amendment. Flipping one control's result moves
      the design's strongest negative signal from a named verdict to a
      self-declared gap. That single trace is the whole of my RT-3 objection and
      it can be checked on paper in five minutes.
    baseline_comparison: >-
      Re-checked at k = 18 with N about 262144 and sqrt(N) = 512. Pollard rho
      with negation sits at 0.886 x 512 = 454 group operations at O(1) memory,
      BSGS at about 1024 operations with 512 stored elements, and both are
      MEASURED over 16 targets per size with a re-verified discrete-logarithm
      certificate per rho solve - stronger practice than most contracts in this
      ledger. The census costs at least N = 262144 group-equivalent operations
      for the DL table alone, hence at least about 578x a matched rho, so the
      contract's "order 10^2 to 10^6" is right and its standing control - that a
      ratio below 1 is an accounting red flag rather than an attack - is correctly
      placed. THE CENSUS IS NOT AND CANNOT BE AN ATTACK; it costs more than
      solving the instance outright, by construction. The specialized baseline
      gap that RT-11 identified is now closed by C-11, and its consequence clause
      is the one that matters: the yield factor measured here is NOT the binding
      factor for the prime-field exponent, because the decomposition-TEST cost is,
      and this contract deliberately excises that cost for instrument independence.
      Even a perfect outcome (a) would move nothing about the prime-field exponent.
    heuristic_challenges:
      - >-
        HEUR-1 is explicit, numbered, formally stated, given a rigorous bound
        (the multiset counting bound, which I re-derived) plus a classical
        distribution theorem (balls-in-bins), and paired with a falsification
        condition and a pre-registered validation arm. RANDOM-MODEL TRANSFER was
        where v1 failed and where v2 succeeds: S_m is negation-symmetric, so the
        balls are antipodal pairs and not independent throws; the mean survives
        and the variance does not. The amendment fixes the process rather than
        the number, which is the correct repair. The residual transfer defect is
        RT-15 - the identity is a fixed point of the negation map on the GROUP
        even though it is not one on cancellation-free MULTISETS, and the
        corrected null has no bin for it. O(1), disclosed here, nothing rests on
        it.
      - >-
        HEUR-1's o(1) is still asserted uniform in beta and nothing in the design
        measures it. Every trend criterion runs in p at fixed beta. Carried
        forward from the prior review, not adopted by the amendment, restated as
        a recommended control above.
      - >-
        SCALE HONESTY. Unchanged and correct. At most 18 field bits, one curve
        per size, no correspondence or transport claim of any kind, and an
        explicit statement that nothing measured here bears on cryptographic-size
        curves in either direction. The only scale-free content is the D-1 and
        D-3 algebra, and C-7 now correctly says what that content does and does
        not settle. TOY-SCALE AGREEMENT WOULD BE TOY-SCALE VALIDATION OF A
        HEURISTIC AND NOTHING MORE.
    cost_model_challenges:
      - >-
        Per-attempt versus total expected cost does not arise: this contract runs
        no attack and computes no success probability against a per-attempt cost.
        The correct standing discipline is the census-operations to
        rho-operations ratio, which is reported per instance.
      - >-
        Memory is stated beside time throughout, including BSGS memory beside
        BSGS time, and the census's O(N)-bit memory beside its time.
      - 'RT-16 - the amendment understates its own added compute by about 3x; the budget conclusion is unaffected.'
      - >-
        Carried from the prior review and not addressed by the amendment: ST-1's
        5 x 10^8 cap sits only about 7 percent above the largest projected cell's
        4.67 x 10^8, and that projection is computed on B = L while every other
        quantity is now computed on measured B. A measured B above about 1907 at
        (k=18, beta=0.600, m=3) trips the cap. The cell is not
        criterion-evaluable, so the consequence is a named observation gap under
        ST-2 and nothing more.
    reduction_and_scope_challenges:
      - >-
        NO REDUCTION IS CLAIMED and reduction_chain.core_problem is explicitly
        null with a note explaining why. There is no cited theorem to instantiate
        and no corollary cascade to audit.
      - >-
        SCOPE INFLATION: the one instance the prior review found is corrected in
        the amendment's text and NOT corrected in the archive chain. RT-13.
      - >-
        SCOPE OF THE COUNTING BOUND, BOTH DIRECTIONS, CONFIRMED. It covers MORE
        than the declared decomposition shape - it needs no curve, no interval and
        no prime order, holding for any finite subset of any abelian group - so
        the declared scope is conservative. Its consequence covers LESS than v1
        advertised: it bounds distinct COVERAGE, and index calculus in its
        operating regime is priced on MULTIPLICITY, which it does not bound at
        all. The amendment now states both correctly.
      - >-
        AFFECTED-VERSUS-SAFE SCOPE IS NOT INFLATED. Six hypotheses are listed as
        untouched, DEFER-BATCH009-001's replication obligation is named as still
        binding, both of IDEA-20260727-006's headline claims are declared
        unadjudicated, and the contract states it can meet no completion
        criterion of the goal under any outcome. That discipline survives the
        amendment intact.
    narrowest_supported_statement: >-
      On the committed artifacts alone, with no run in existence and nothing
      measured: the EXP-YIELD-001 v2 amendment correctly identifies 44
      criterion-evaluable cells where its predicate gives 44 and v1 said 43, and
      the cell it recovers carries the design's largest counting ceiling on E
      (E_max = 1.4215); it correctly makes the measured-B predicate authoritative
      over an enumeration that the contract's own even-B curve rule renders
      unrealisable; it correctly re-specifies the occupancy null as an
      antipodal-pair process whose variance is 2(N-1)/N times the independent-throw
      variance, restating the design's chance spread from 1.05 to 1.49 percent
      and the plus-or-minus 10 percent band from about 9 to 6.7 sigma, with no
      threshold moved; and it closes the outcome gap for a uniform p-independent
      shortfall, which now lands on branch O-4. Its outcome table is formally
      exhaustive and mutually exclusive, and its residual branch is reachable by
      at least three routes including the design's strongest negative signal. The
      counting bound closes NO exponent question - it is Markov's inequality on a
      first-moment estimate, and it bounds coverage rather than multiplicity - and
      what it establishes is that IDEA-20260727-006's falsification condition 1
      was malformed at birth. NOTHING HERE IS A CRYPTANALYTIC RESULT, nothing
      here is evidence for or against any hypothesis, nothing here bears on
      cryptographic-size curves in either direction, and no direction is declared
      impossible by anything in this review.
    next_concrete_action: >-
      Coordinator records PC-1 through PC-4 as pre-execution reading notes in the
      TASK-20260729-013 archive - PC-3 in particular, since the C-7 correction
      note promised into the TASK-20260729-012 receipt is verifiably absent from
      it and the sub-1/2-exponent over-claim otherwise stands uncorrected in the
      committed archive chain - reconciles the queue's stale AUTHORIZATION
      PENDING block against the recorded BUDGET-AMEND-20260729-001, and then
      dispatches TASK-20260729-005 to execute the 44-cell census under the pair
      (the committed v1 blob at 82327a02, the committed v2 amendment at
      59f2e930). No further amendment cycle is requested and none is needed.
    artifact_paths:
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-011/reviews/TASK-20260729-011/amendment_review.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-011/reviews/TASK-20260729-011/recheck_note.md

