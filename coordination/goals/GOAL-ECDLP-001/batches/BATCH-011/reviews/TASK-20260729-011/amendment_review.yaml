  blocking_objection_disposition:
    RT-1:
      disposition: REPAIRED
      independent_finding: >-
        CONFIRMED BY RECOUNT FROM THE PREDICATE, NOT BY READING THE AMENDMENT.
        Evaluating h = B^m/(m! p) <= 0.5 AND C_red(B) >= 500 over all 136 cells
        on the B = L basis gives 27 cells at m = 2 and 17 at m = 3, total 44. I
        obtained the SAME 44 under p = 2^k and under p = the smallest prime at or
        above 2^k, so the count is not an artifact of the table's stated
        approximation. My cell-by-cell enumeration is IDENTICAL to the
        amendment's corrected_enumeration block at every one of the 44 entries,
        including every B value. The omitted cell is (m=3, k=12, beta=0.375),
        B = 23, h = 0.495085, C_red = 2035.5 - inside the predicate on both
        clauses. Nine evaluable columns confirmed, six carrying four sizes and
        three carrying three (m=2 beta 0.375 and 0.400, m=3 beta 0.300), which
        also confirms C-12's identification of the three 1-df columns.
      the_E_max_claim: >-
        CONFIRMED, AND IT IS THE MORE INTERESTING HALF OF RT-1. I recomputed
        E_max = min(C_all, N)/P_pred at all 44 cells. The MAXIMUM over the whole
        evaluable set is 1.4215 and it is attained at (m=3, k=12, beta=0.375) -
        the cell v1 dropped - from C_all = 2300 and P_pred = 1618.1, both of
        which I reproduce exactly. The amendment prints 1.4214; the difference is
        a fourth-digit rounding and is immaterial. The minimum is 1.0184 at
        (m=2, k=18, beta=0.350, B=79) from C_all = 3160 and P_pred = 3103.0,
        also reproduced exactly. So the v1 enumeration dropped precisely the cell
        with the most room above 1 in the entire design.
      robustness_check_this_session_added: >-
        I re-ran the count on a REALISABLE basis, forcing B even (see RT-2). At
        B = nearest even below L the count is 43 (27 at m=2, 16 at m=3), at
        B = nearest even above L it is 44, and under both the 44th cell still
        carries the design maximum E_max (1.3871 at B = 22) and the count of
        cells with E_max < 1.10 is still 17. The correction survives the parity
        constraint.
    RT-2:
      disposition: REPAIRED
      independent_finding: >-
        The repair is the right one and the parity argument that carries it is
        SOUND. F = {P : x(P) in I}; N is prime and, being a group order near
        p >= 4099, odd; a point with y = 0 has order 2, which an odd N forbids;
        the identity has no x-coordinate. So every x in I that admits a point
        contributes exactly the two points (x, y) and (x, -y), and B = 2 times
        the number of such x, hence EVEN. B = 15, 21, 23, 31, 79 are therefore
        unattainable as measured counts, and the half-integer C_red values that
        follow from them - 567.5, 1550.5, 2035.5, 4975.5, 82199.5, every one of
        which I reproduced from both the closed form and the C(B/2,k) series -
        correspond to no realisable configuration. The closed form itself is
        derived from C(B/2, k), which presupposes B even, so it is not merely
        that odd B is improbable: the enumeration's own formula is undefined
        there. That settles RT-2 structurally, exactly as the card anticipated.
      what_this_session_adds_that_the_amendment_missed: >-
        THE PARITY FACT IS NOT NEW AND THE AMENDMENT SHOULD HAVE SAID SO. The
        FROZEN v1 specification already states it, in the inputs block: "Prime N
        removes every cofactor and subgroup-structure confound, guarantees no
        point of order 2 (so the factor base is closed under negation and B is
        even)". The amendment presents parity as an observation of the authoring
        session. It is instead an INTERNAL CONTRADICTION IN v1 - the contract
        declared B even in one block and enumerated the evaluable set on odd B in
        another. That strengthens rather than weakens the repair, and it is
        recorded here so the record is accurate about provenance.
      order_of_operations: >-
        R-2 is the clause that actually earns the PASS on this objection. The
        class of every cell is computed from measured B alone and FROZEN before
        S_m is computed, so the class can never be a function of an outcome, and
        reclassification after E is known is forbidden in either direction. R-3's
        dual booleans and the class_changed_on_measurement flag make the drift
        auditable, R-6 evaluates every fraction against the realised denominator,
        and R-7 discloses drift beyond four cells. That is a complete and
        pre-registered handling.
      new_objection_raised: 'RT-14 - the knife-edge list is materially incomplete. See new_objections.'
    RT-3:
      disposition: PARTIALLY REPAIRED
      what_is_repaired: >-
        THE GAP RT-3 NAMED IS CLOSED, AND NO THRESHOLD WAS MOVED TO CLOSE IT. I
        traced the worked case mechanically. Uniform E about 0.85 at every
        evaluable cell with no p-trend: every column is FLAT (slope 0, zero
        residual, interval containing zero); P0 does not fire; O-8, O-2, O-3 and
        O-7 all require a DOWN-SIGNIFICANT or UP-SIGNIFICANT column and there is
        none; O-1 fails because OUT is the whole evaluable set; O-4 MATCHES on
        all three clauses - no significant column, OUT exceeds one third of
        n_eval, and OUT has a consistent sign. Landing on O-4 is caused by ONE
        change and one only, the deletion of "and no consistent sign", which is
        exactly the repair RT-3 required. I checked every threshold against v1
        and confirm: the band [0.90, 1.10] is unchanged, the "more than one
        third" fraction is unchanged, F1's 0.80 and -0.05 are unchanged, S1's
        0.05 is unchanged, and the NOISE-LIMITED 2 percent is unchanged. NO
        THRESHOLD WAS MOVED TO MAKE THE WORKED CASE LAND ON O-4.
      exhaustiveness_ruling: >-
        THE FORMAL CLAIM IS TRUE AND THE SUBSTANTIVE CLAIM IS WEAKER THAN
        ADVERTISED. Formally the table IS exhaustive and mutually exclusive:
        O-9's condition is "any realised pattern not matched above", so no
        outcome fires nothing, and first-match-governs makes exactly one branch
        govern, so no outcome fires two branches ambiguously. I could not
        construct a counterexample to either property and I tried. My objection
        is different in kind: O-9 is not a remote residual. It is reachable by at
        least three distinct routes, one of which is the design's STRONGEST
        NEGATIVE SIGNAL and another of which has probability of order one third
        UNDER THE NULL ITSELF. Since the amendment declares that any outcome
        reaching O-9 is a completeness defect of the amendment, a substantial
        slice of the outcome space is pre-registered as self-indicting. That is a
        coverage weakness, not a coverage hole, and it is why this objection is
        PARTIALLY REPAIRED rather than NOT REPAIRED.
      three_routes_into_the_residual_branch:
        - >-
          ROUTE A, AND THE ONE THAT MATTERS. A column that is DOWN-SIGNIFICANT
          with E at most 0.80 at its largest size, whose deviation does NOT
          shrink under CTRL-NULL-FB, matches NEITHER O-2 NOR O-3. O-2 requires
          the shrink clause and fails. O-3 requires that NO down-significant
          column has E at most 0.80, and there is one, so O-3 fails too. O-7,
          O-1, O-4, O-5 and O-6 all fail on their leading clauses. The outcome
          lands in O-9. I traced this with a worked column - E = 1.00, 0.92,
          0.85, 0.78 at k = 12/14/16/18, slope -0.0595, 95 percent interval
          (-0.0622, -0.0567) excluding zero, non-increasing, E_last = 0.78 - and
          confirmed the landing branch flips from O-2 to O-9 on the shrink clause
          alone. This is the design's largest and most consequential negative
          signal being routed to the branch that declares itself defective. O-3's
          own disposition text already contemplates the non-shrinking case ("If
          the trend does NOT shrink under CTRL-NULL-FB, INV-5 governs the
          reading"), so the intent was there and the CONDITION was mis-drafted by
          one clause. The narrow fix would have been to write O-3's condition as
          "at least one column is DOWN-SIGNIFICANT and O-2 does not apply".
        - >-
          ROUTE B. The column taxonomy's own completeness claim is FALSE. The
          definitions block asserts "A column may be none of these - absolute
          slope above 0.05 with an interval containing zero - and such a column
          is UNDERPOWERED", which says the only unnamed case is UNDERPOWERED.
          There are at least two others. (i) A column with absolute slope AT MOST
          0.05 and a 95 percent interval EXCLUDING zero is not DOWN- or
          UP-SIGNIFICANT (magnitude too small), not FLAT (interval excludes
          zero), and not UNDERPOWERED (interval excludes zero). This is a small
          but tightly determined trend, which is a thoroughly plausible outcome
          of a real finite-size correction, and S1 correctly fails on it. With
          OUT empty it lands in O-9. (ii) A column with a significant slope of
          magnitude at least 0.05 whose E sequence is not monotone is excluded
          from DOWN- and UP-SIGNIFICANT by the monotonicity clause and, if its
          interval excludes zero, is not UNDERPOWERED either. The branch table
          still catches both through O-9; the TAXONOMY does not, and the
          taxonomy's stated completeness is what a reader will rely on.
        - >-
          ROUTE C, WITH THE ARITHMETIC. S1 and O-1 require ALL NINE evaluable
          columns to carry a 95 percent interval containing zero. Under a null in
          which the per-column residuals behave like independent noise, each
          column's interval excludes zero with probability 0.05 by construction,
          so the probability that ALL NINE contain it is 0.95^9 = 0.6302 and the
          probability that at least one does not is 0.3698. NO MULTIPLE-
          COMPARISON CORRECTION IS APPLIED ANYWHERE. If OUT is empty - the modal
          success-adjacent outcome - a single such column takes the run out of
          O-1 and, being neither FLAT nor significant, into O-9. So roughly one
          run in three lands in the branch the amendment calls its own
          completeness defect, purely by multiplicity, with nothing wrong at all.
          This is a PRE-EXISTING DEFECT OF v1's S1, which the prior review did
          not catch and the amendment did not introduce; the amendment makes its
          consequence visible by giving it a branch and then labelling that
          branch a defect. I state the 0.37 figure as an ORDER-OF-MAGNITUDE
          DESIGN ESTIMATE conditional on iid-like residuals - a condition this
          design nowhere establishes, and which is especially doubtful at 1 and 2
          residual degrees of freedom where t-interval coverage is very sensitive
          to non-normality. It is not a measurement and nothing here depends on
          its exact value.
      traced_cases_summary: >-
        Every case the card mandates was traced mechanically against the branch
        conditions as written; the arithmetic and the branch each landed in are
        in recheck_note.md. Uniform E about 0.85 with no p-trend lands in O-4. A
        single UNDERPOWERED column with OUT empty lands in O-9, and with three
        cells out of band lands in O-6. Two columns with significant slopes of
        opposite sign, both monotone, land in O-8. Three out-of-band cells with
        no trend land in O-6. E rising with p from below lands in O-7 with its
        binding prohibition against reading it as outcome (b). NO CASE LANDED IN
        NO BRANCH AND NO CASE MATCHED TWO BRANCHES AMBIGUOUSLY.
      one_content_change_mislabelled_as_coverage: >-
        C-3's consequence paragraph says "F2's threshold and S1's and F1's
        thresholds are NOT relaxed and NOT tightened. What changes is coverage".
        The thresholds indeed do not move, but F2's TREND CLAUSE changes CONTENT,
        not merely coverage: "no monotone trend in p" becomes "no evaluable
        column is DOWN-SIGNIFICANT or UP-SIGNIFICANT". Those are different
        conditions - a column can be monotone without being significant, and the
        replacement lets O-4 fire where v1's F2 would not have. The change is
        justified (v1's clause is not machine-checkable at three or four points)
        and it IS disclosed accurately in changed_criteria_before_and_after.F2.
        The defect is confined to C-3's summary sentence, which understates what
        was changed. Recorded, not blocking.
    RT-4:
      disposition: REPAIRED
      independent_finding: >-
        RE-DERIVED FROM SCRATCH IN THIS SESSION AND CONFIRMED. F is closed under
        negation and N is odd, so S_m = -S_m. On cancellation-free multisets the
        involution M -> -M is fixed-point-free: a fixed point would require every
        element to be paired with its own negation, which is a cancelling pair
        and excluded, and an unpaired element would need -P = P, impossible with
        N odd and the identity absent from F. So the C_red multisets pair into
        exactly C_red/2 antipodal pairs, and C_red is even at every cell because
        every term of sum_k C(B/2,k) C(m-1,k-1) 2^k carries a factor 2^k with
        k at least 1.
      the_factor_of_two: >-
        DERIVED INDEPENDENTLY. Let M = (N-1)/2 antipodal bin-pairs and throw
        C_red/2 pairs, so lambda = (C_red/2)/M = C_red/(N-1). With X the number
        of occupied bin-pairs, the occupancy law gives Var(X) = M e^{-lambda}
        (1 - (1+lambda) e^{-lambda}). The distinct count is 2X, so its variance
        is 4 Var(X) = 2 (N-1) e^{-lambda}(1 - (1+lambda) e^{-lambda}), against
        the independent-throw variance N e^{-lambda}(1 - (1+lambda) e^{-lambda}).
        The RATIO IS 2(N-1)/N, which is 1.99951 at k = 12 and 1.99999 at k = 18 -
        not literally "exactly twice" as the amendment writes, but twice to
        within 1/N, which is inside the O(1) slack the amendment itself declares
        for the mean. The relative standard deviation is multiplied by sqrt(2) =
        1.41421. The mean is unchanged to O(1) and I confirm that P_pred needs no
        change and NO CRITERION THRESHOLD MOVES.
      restated_sigma_figures: >-
        ALL THREE REPRODUCE. Recomputing the chance relative standard deviation
        of E at all 44 cells, the design-wide maximum under the v1 independent-
        throw process is 1.0518 percent at (m=2, k=12, beta=0.425, B=34), from
        C_red = 578, lambda = 0.141113, P_pred = 539.9 and sd = 5.677 - the
        amendment says 1.0515 percent, P_pred 539.8, sd 5.676, agreeing to the
        fourth digit. Multiplying by sqrt(2) gives 1.4875 percent, so the
        amendment's 1.49 percent is right and the cell it names is right. The
        plus-or-minus 10 percent band is 10/1.4875 = 6.72 sigma against the
        amendment's 6.7, and F1's 0.80 threshold is 20/1.4875 = 13.45 sigma
        against the amendment's 13.4. I also confirm no evaluable cell exceeds
        the 2 percent NOISE-LIMITED rule on chance sd alone, the largest being
        1.4875 percent, so the disclosed 1.34x margin is right and C-14's raised
        replicate counts are a proportionate response to it rather than a
        threshold move.
      the_probe_was_correctly_excluded: >-
        This is the part of C-4 I most wanted to check and it holds. The
        amendment derives the factor analytically and states in terms that the
        prior review's balls-in-bins probe at N = 4099, C = 568 "IS NOT THE BASIS
        AND IS NOT CITED AS EVIDENCE" because it was run outside the repository
        and is unarchived. That is the correct handling of an unarchived probe
        and it is exactly the failure mode this program has been burned by
        before. Better still, the amendment does not merely drop the probe: it
        replaces it with a DECLARED CONTRAST ARM that runs the v1 independent-
        throw process alongside the antipodal one at the same cells and replicate
        counts, so the sqrt(2) is MEASURED INSIDE THE DRIVER AND ARCHIVED rather
        than asserted. That converts an unarchived probe into a pre-registered
        archived control, and it is the single best change in this amendment.
      one_unstated_O_1_mismatch_this_session_found: >-
        The antipodal null partitions the N-1 NON-IDENTITY elements into (N-1)/2
        bin-pairs, which implicitly asserts that no ball lands on the identity.
        But a cancellation-free multiset CAN sum to the identity - three
        collinear factor-base points do it - and the contract itself reports "the
        number of m-multisets summing to the identity" as a secondary metric at
        both arities, and states that the identity IS in S_m for even m. Such a
        multiset and its antipode both land on the identity, covering ONE bin
        rather than two. The expected number of such multisets is about C_red/N,
        which is at most about 0.5 anywhere in the evaluable set, so the effect
        is O(1) against a P_pred between 540 and 131000 and moves no threshold.
        It is recorded because the entire point of RT-4 was that an unstated
        shape mismatch had silently corrupted a denominator, and this is a second
        one of the same kind, two orders of magnitude smaller. RT-15.

  material_and_minor_objection_disposition:
    RT-5:
      disposition: CARRIED, in its narrowest valid form
      check: >-
        Verified numerically. R_max = (p/N) prod_{j<m}(1 + j/B). The exact Hasse
        supremum p/(p + 1 - 2 sqrt p) at p = 2^12 is 4096/3969 = 1.0319979,
        against the linearisation 1 + 2/sqrt p = 1.03125. At the smallest cell
        (m=3, B=5) the product is 1.68, giving 1.68 x 1.0319979 = 1.73376, i.e.
        1.7338 and not 1.733 - confirmed. Over the evaluable set the ceilings at
        the smallest B are 1.2476 (m=3, B=15) and 1.0624 (m=2, B=34), confirming
        that R > 2.0 cannot fire at any criterion-evaluable cell. The degenerate
        ceilings 3.096 (m=3, B=2), 2.293 (m=3, B=3) and 2.064 (m=2, B=1) also
        reproduce. The struck step "Every cell in the design has B >= 5" was
        indeed evaluated on L rather than on measured B and its removal is
        correct. INV-1 keeps its teeth because R_max is now computed per cell on
        that cell's own measured B.
    RT-6:
      disposition: CARRIED, and strengthened beyond what the objection asked
      check: >-
        E_max and the Cauchy-Davenport floor are now reported per cell. I
        recomputed both across all 44 cells. E_max is below 1.10 at EXACTLY 17 of
        them, and my breakdown matches the amendment's cell for cell: 3 at
        (m=2, k=14), 6 at (m=2, k=16), 7 at (m=2, k=18), none at (m=2, k=12), and
        exactly one at m = 3, namely (k=18, beta=0.300) with E_max = 1.09318
        against the amendment's 1.0932. So the band is one-sided at 38.6 percent
        of the evaluable set. The Cauchy-Davenport bound is correctly applied - N
        prime makes G isomorphic to Z/NZ, |A+B| >= min(N, |A|+|B|-1) iterates to
        |S_m| >= min(N, mB - m + 1) - and I confirm 0.1241 at (m=2, k=12,
        beta=0.425, B=34) IS the largest floor over the evaluable set, with the
        next largest 0.1070. F1's 0.80 threshold sits far above every floor, so
        F1 survives on a rigorous bound rather than on the v1 assertion that
        "nothing in the design bounds E from below". Replacing an assertion with
        a bound and adding the violation to INV-1 is a strengthening, not a
        relaxation.
    RT-7:
      disposition: PARTIALLY CARRIED - the replacement text lands, the promised supersession did not
      check: >-
        See scope_and_correction_to_the_record below. The replacement text is
        correct and I confirm it on the merits. The supersession mechanism it
        names DID NOT EXECUTE, which I verified against the committed receipt.
    RT-8:
      disposition: CARRIED, with one half of the repair left without a firing predicate
      check: >-
        The false-invalidation risk is genuinely discharged, twice over. Raising
        (n=211, m=3) and (n=211, m=4) from 6 to 24 seeds makes the median a far
        more stable statistic than the prior review's failure scenario needs, and
        splitting INV-2 so that only the shared-code half can void means that
        even two AP-supply misses cannot destroy census data. Pre-registering the
        estimator form as the ratio of medians rather than the median of ratios
        is correct and the Jensen argument for it is sound; the v1 feasibility
        table does reconcile all six targets on the ratio-of-medians convention.
        The B disclosure is right too - I verified that C(64,4)/154 = 4126.5 and
        C(65,4)/154 = 4396.4 against EV-STR-001's 4128.6, and C(64,3)/477 = 87.35
        and C(65,3)/477 = 91.57 against its 87.8, so EV-STR-001 used B = 64 while
        the leg freezes ceil(sqrt(4099)) = 65, and the resulting 1.04 and 1.06
        ratios sit far inside the factor-2 window. THE DEFECT IS THAT INV-2a HAS
        NO FIRING PREDICATE - see RT-12, which is the only new objection I attach
        a pre-execution condition to.
    RT-9:
      disposition: CARRIED, and I confirm every correction independently
      check: >-
        beta*(3) recomputes to 0.405138 / 0.394880 / 0.387187 / 0.381203, so the
        contract's 0.3982 / 0.3930 / 0.3892 are wrong at three of four sizes and
        the amendment's values are right. 2^2.7 = 6.49802 rounds to 6, so
        L(k=12, beta=0.225) = 6 and not 7. The exact Hasse suprema are 1.031998,
        1.015810, 1.007859 and 1.003918, i.e. 3.20 / 1.58 / 0.79 / 0.39 percent.
        C_red(m=3) at B = 21 is 21 + 399 + 1130.5 = 1550.5 and at B = 31 is
        31 + 899 + 4045.5 = 4975.5; I verified both against the C(B/2,k) series
        as well as the closed form, so the table's 1542 and 5424 are genuine
        errors. None is load-bearing: both corrected C_red values stay above 500,
        both cells stay criterion-evaluable, and the count of 44 is unaffected.
    RT-10:
      disposition: CARRIED IN FULL
      check: >-
        The retraction is correct on the merits and I checked the source. EV-STR-001
        line 26 reads "The AP penalty is supply-side, not per-tuple: AP tuples
        hit at comparable per-tuple rates, but only supply << C(B,m) admissible
        AP tuples exist". A supply-side penalty is the designed consequence of
        restricting supports to arithmetic progressions and carries no
        information about whether the unconstrained heuristic overstates yield.
        Retracting the directional prior REMOVES a thumb from the scale in the
        direction of outcome (c) and is the right call. The full 17.5x to 4128.6x
        range is still carried with both trend clauses and the prohibition on
        quoting 17.5x alone.
    RT-11:
      disposition: CARRIED, with its sourcing status honestly declared
      check: >-
        The added paragraph names a line of work rather than a theorem, states
        that NO EXTERNAL SOURCE WAS RETRIEVED, and asks to be read as a
        positioning statement to be checked rather than as a citation. That is
        the correct handling and no citation is fabricated. I did not retrieve an
        external source either and I do not certify the positioning; I record
        that the claim asserted is a NEGATIVE one (no known sub-sqrt(p) prime-field
        instantiation in the Semaev-Gaudry-Diem line), which is the weakest form
        the sentence could take. Its real work is the consequence clause, and
        that clause is the most valuable sentence in the whole amendment: the
        yield factor measured here is NOT the binding factor for the prime-field
        exponent, the decomposition-TEST cost is, this contract deliberately
        excises it for instrument independence, and so even a perfect outcome (a)
        with E exactly 1 at every cell would move nothing about the prime-field
        exponent. That is honest baseline positioning and it should be quoted
        wherever this experiment is quoted.

  disagreements_with_the_prior_review_adjudicated:
    beta_star_2_at_k16:
      ruling: AMENDMENT UPHELD
      basis: >-
        beta*(2) at k = 16 is (1 + log_p 2)/2 = (1 + 1/16)/2 = 0.53125 EXACTLY.
        The contract prints 0.5313, which is 0.53125 under round-half-away-from-
        zero; the prior review's feasibility_check.md line 152 tabulates 0.5312,
        which is 0.53125 under round-half-to-even. Both are correct renderings of
        the same exact number and neither is a defect in the contract. The
        amendment's characterisation is also accurate as to the review: the
        review's PROSE says the m = 2 row is "exactly right" while its TABLE
        prints a different fourth digit, so the inconsistency is internal to the
        review. No correction to the m = 2 row is warranted. I note for the
        record that the underlying complaint is nothing but a rounding
        convention, and that a table which is meant to be re-derived should print
        an exact value or state its rounding rule - a remark, not an objection.
    two_missed_C_red_entries:
      ruling: AMENDMENT UPHELD
      basis: >-
        Verified two independent ways. The closed form B + B(B-2) + B(B-2)(B-4)/6
        and the C(B/2,k) C(m-1,k-1) 2^k series agree exactly and give 1550.5 at
        B = 21 and 4975.5 at B = 31, against the feasibility table's 1542 and
        5424. These are genuine arithmetic errors in the table, not roundings -
        contrast the table's 568 for 567.5 and 2036 for 2035.5, which ARE
        roundings. The amendment's account of why the prior review missed them is
        fair: that review states at its line 462 that it verified C_red "against
        C_all by an independent identity at m=2 (C_all - C_red = B/2)", which is
        a check of the IDENTITY and not of every entry. I confirm that identity
        independently. Neither correction changes any cell's class, so the count
        of 44 stands under this ruling.
    p_over_N_correction_at_all_four_sizes:
      ruling: AMENDMENT UPHELD ON THE ARITHMETIC, PARTIALLY CORRECTED ON BOTH SIDES
      basis: >-
        The mathematics is on the amendment's side. The linearisation 1 +
        2/sqrt(p) understates the exact Hasse supremum p/(p + 1 - 2 sqrt p) at
        EVERY size, not only at k = 12: 1.031998 vs 1.031250, 1.015810 vs
        1.015625, 1.007859 vs 1.007812, 1.003918 vs 1.003906. So the correction
        does apply at all four sizes and the amendment's 3.20 / 1.58 / 0.79 /
        0.39 percent are right. Two fairness corrections, one to each session.
        AGAINST THE AMENDMENT'S ACCOUNT OF THE REVIEW: the prior review did
        already say, at its line 75, that "the same linearisation understates all
        four p/N bounds"; it merely declined to tabulate the other three. So the
        amendment's "The review corrects only the k = 12 bound" is true of the
        correction and misleading about the review's finding. AGAINST THE
        AMENDMENT'S OWN QUALIFIER: its claim that "only the k = 12 correction is
        numerically visible in any downstream figure" is itself slightly wrong at
        the two-decimal display the contract uses, where k = 14 moves 1.56 to
        1.58 and k = 16 moves 0.78 to 0.79. Nothing here is load-bearing and no
        threshold moves; the ruling is recorded at this length only because a
        re-review that rubber-stamps a producer's disagreements with its
        predecessor is worthless, and two of these three needed correcting in
        both directions.
    parity_and_the_located_maximum:
      ruling: >-
        UPHELD, WITH THE PROVENANCE CORRECTED. The amendment's fourth and fifth
        recorded disagreements are not disagreements on the merits and I confirm
        both facts - many B values in the v1 basis table are unattainable, and
        the maximum E_max of 1.4215 does sit at the very cell RT-1 recovers,
        which I verified by recomputing E_max at all 44 cells rather than by
        reading the range off the prior review. But the parity FACT is not this
        session's discovery: the frozen v1 specification states in its own inputs
        block that B is even. The correct framing is that v1 contradicted itself,
        which is a stronger point than the one the amendment makes.

  new_objections:
    - id: RT-12
      severity: material
      title: INV-2a retains the voiding power and has no stated firing predicate
      finding: >-
        C-8 was offered the choice "either route the AP leg's supply through the
        identical distinct-count and membership routine the census uses, OR
        downgrade INV-2 so it cannot void census data". It did BOTH, and in doing
        both it left the half that keeps the teeth without a predicate. INV-2a
        reads in full: "SHARED-ROUTINE DEFECT. The shared distinct-count and
        membership routine fails its own known-answer test. THE CENSUS NUMBERS
        ARE VOID RATHER THAN NEGATIVE." Nowhere is that known-answer test
        defined, and nowhere is its pass criterion stated. The only quantitative
        comparison the calibration leg makes is against EV-STR-001's per-cell
        medians, and that comparison is INV-2b, which is explicitly declared
        unable to void. So as written INV-2a is either unfireable - in which case
        the calibration leg has lost all voiding power, contrary to the
        amendment's claim that INV-2a "retains the real teeth", and S1's amended
        calibration clause "CTRL-CALIB-AP does not fire INV-2a" is trivially
        satisfied - or it is fireable only on a predicate the Executor must
        invent, which ST-3 forbids.
      why_it_is_not_blocking: >-
        The census does not depend on it. CTRL-DL and INV-3 are unchanged and
        remain the control that actually stands behind the census, invalidating
        the entire run set on a single curve-side versus DL-image mismatch out of
        10^4. And a natural reading is available that adds no threshold: INV-2a
        fires if and only if the shared distinct-count and membership routine
        returns a result that disagrees with an independently computed exact
        value on a known-answer input - structurally the same rule as CTRL-DL.
      required_repair_without_an_amendment: 'See PC-1 in pre_execution_conditions.'
    - id: RT-13
      severity: material
      title: >-
        The C-7 correction note that supersedes the exponent over-claim was
        promised into the TASK-20260729-012 receipt and is not there
      finding: >-
        C-7's consequence block states that the correction of the TASK-20260729-002
        receipt's language "is carried forward as a CORRECTION NOTE in the
        TASK-20260729-012 snapshot receipt, which is the next archive record in
        this lineage". I checked the committed receipt. It contains NO such note:
        a search of it for "exponent", "correction", "REMOVED-1" and "coverage"
        returns zero matches. Meanwhile the TASK-20260729-002 receipt still
        carries, at its line 47, the escalation the amendment exists to retract -
        "That was the one event that would have reopened a sub-1/2 exponent; it
        is closed by counting, not measurement." So the over-claim stands
        UNCORRECTED in the committed archive chain, and the amendment's own
        chosen supersession mechanism did not execute. This is the single most
        consequential scope defect in the package, because the receipt's sentence
        is exactly the kind of sentence downstream records quote.
      why_it_is_not_blocking: >-
        Because it is repairable without an amendment cycle. The defective record
        is an ARCHIVE RECEIPT, not the protocol, and the correction can ride the
        TASK-20260729-013 receipt that archives this review - which is the next
        archive record in the lineage and is not yet written. The amendment's
        replacement text is itself correct and is binding on every downstream
        record of this batch regardless.
      required_repair_without_an_amendment: 'See PC-3 in pre_execution_conditions.'
    - id: RT-14
      severity: material
      title: >-
        Eleven cells sit on the knife edge, not two, and the design's densest
        column is a coin flip at all four of its sizes
      finding: >-
        C-2's rule R-4 names TWO knife-edge cells. I evaluated the frozen
        predicate at the nearest even B below and above L at every one of the 136
        cells - even because the contract's own curve rule forces B even - and
        found ELEVEN cells whose criterion-evaluable class flips under that
        ordinary fluctuation. Six are at m = 2 (k=12 beta 0.500; k=14 beta 0.350
        and 0.500; k=16 beta 0.500; k=18 beta 0.275 and 0.500) and five at m = 3
        (k=12 beta 0.325 and 0.375; k=14 beta 0.275 and 0.375; k=16 beta 0.250).
        Four of them can ENTER the evaluable set rather than leave it. The
        sharper consequence is structural and is nowhere disclosed: at beta =
        0.500 with m = 2 the predicate h <= 0.5 reduces to B <= sqrt(p), while
        B is approximately L = round(p^0.5), so EVERY ONE OF THE FOUR SIZES OF
        THE m=2 beta=0.500 COLUMN IS A COIN FLIP. Under an independent 50/50 per
        cell model the probability that at least three of its four sizes survive
        is 5/16 = 0.31, so that column is MORE LIKELY THAN NOT to fall below
        three sizes and be dropped under R-6, taking the nine evaluable columns
        to eight. I state the 0.31 as a model estimate, not a measurement.
      why_it_is_not_blocking: >-
        The HANDLING is complete even though the DISCLOSURE is not. R-5 routes
        any other cell that changes class through the same rule, R-3 records the
        flag, R-6 uses realised denominators and explicitly contemplates a column
        dropping below three sizes with its reason recorded, and R-7's four-cell
        drift disclosure is wide enough for a parity-driven shift of one or two.
        Nothing here requires the Executor to guess and no criterion is
        evaluated at a cell whose measured h exceeds 0.5. What is overstated is
        the design's advertised power, and that is a reading correction rather
        than a protocol change.
      required_repair_without_an_amendment: 'See PC-2 in pre_execution_conditions.'
    - id: RT-15
      severity: minor
      title: The antipodal null has no bin for the identity, which S_m can contain
      finding: >-
        Recorded in full under RT-4 above. The corrected null partitions the N-1
        non-identity elements into (N-1)/2 bin-pairs, but a cancellation-free
        multiset can sum to the identity, its antipode does too, and that pair
        covers one bin rather than two. The contract reports the count of
        identity-summing multisets as a secondary metric, so the event is known
        to be possible. Expected count about C_red/N, at most about 0.5 anywhere
        in the evaluable set, hence O(1) against P_pred between 540 and 131000.
        NO THRESHOLD MOVES. It is recorded because RT-4's whole lesson was that
        an unstated shape mismatch silently corrupted a denominator, and this is
        a second one of the same kind, two orders of magnitude smaller.
      required_repair: >-
        One sentence in the run record noting the O(1) identity-bin mismatch,
        with the measured identity-summing multiset count reported beside it.
    - id: RT-16
      severity: minor
      title: The amendment understates its own added compute by about a factor of three
      finding: >-
        independent_reconfirmation claims "The changes in this amendment add well
        under 10^7 modular additions in total". Re-deriving per arm I get about
        3.1 x 10^7. The dominant contributor is the DECLARED CONTRAST ARM of C-4,
        which the amendment never prices: running the v1 independent-throw
        process alongside the antipodal one at the same cells and replicate
        counts DOUBLES the occupancy Monte Carlo, taking it from 1.69 x 10^7
        draws under v1 to 4.54 x 10^7 under v2. CTRL-NULL-FB rises from 3.98 x
        10^6 to 6.35 x 10^6, and the 44th cell adds 6.6 x 10^3. THE BUDGET
        VERDICT IS UNAFFECTED AND I CONFIRM IT: 3.1 x 10^7 sits against a design
        whose observation-only tier already carries about 1.4 x 10^9 and a
        criterion-evaluable core of about 1.3 x 10^6, inside 5400 seconds and
        8 GB with orders of magnitude to spare. The objection is to the arithmetic
        of the claim, not to the conclusion. I also note a harmless convention
        difference: my census-cost total over the 44 cells is 1.33 x 10^6 against
        the amendment's 9.32 x 10^5, because the amendment charges B^2/2 at m = 2
        where the feasibility table's own cost model charges |S_1| B = B^2.

  pre_execution_conditions:
    binding_note: >-
      THESE ARE CONDITIONS ON THE COORDINATOR, NOT ON THE EXECUTOR, AND NONE OF
      THEM CHANGES A THRESHOLD, A BAND, A FRACTION OR A CRITERION. Each is a
      READING NOTE that must be recorded BEFORE TASK-20260729-005 is dispatched,
      so that it is pre-data. They do not require and must not be treated as a
      second amendment cycle. If the Coordinator declines PC-1, the consequence
      is not that this verdict fails: it is that ST-3 may fire at the calibration
      leg and the Executor stops and reports, which is the contract working as
      designed.
    PC-1:
      subject: RT-12
      requirement: >-
        Record the operational reading of INV-2a before dispatch. The narrowest
        reading that adds no threshold and matches the amendment's stated intent
        is: INV-2a fires if and only if the distinct-count and membership routine
        SHARED by the AP calibration leg and the census returns a result that
        disagrees with an independently computed exact value on a known-answer
        input - the same form of rule as CTRL-DL and INV-3. If the Coordinator
        prefers a different reading it must be recorded before dispatch, and it
        must be recorded that INV-2b cannot void under any reading.
    PC-2:
      subject: RT-14
      requirement: >-
        Record, before dispatch, that R-4's two named knife-edge cells are
        illustrative rather than exhaustive, that eleven cells flip class under
        an ordinary even-constrained fluctuation of measured B, and that the
        m = 2 beta = 0.500 column is a coin flip at all four sizes and may be
        dropped under R-6. This changes nothing in the protocol - R-5 and R-6
        already govern - and exists so that a realised set of eight evaluable
        columns is a disclosed expectation rather than a surprise read after the
        numbers are seen.
    PC-3:
      subject: RT-13
      requirement: >-
        Carry the C-7 correction note forward into the TASK-20260729-013 archive
        receipt, since it did not land in the TASK-20260729-012 receipt as C-7
        promised. The note must state that the TASK-20260729-002 receipt's
        sentence "That was the one event that would have reopened a sub-1/2
        exponent; it is closed by counting, not measurement" is SUPERSEDED, that
        the counting bound closes no exponent question, and that R bounds
        coverage and not multiplicity. The TASK-20260729-002 receipt is immutable
        and must not be edited.
    PC-4:
      subject: 'RT-3, routes A, B and C'
      requirement: >-
        Record, before dispatch, this report's pre-registered reading for the
        three routes into O-9, so that reaching O-9 by any of them is not
        resolved by judgement after the numbers are seen. Specifically: a
        DOWN-SIGNIFICANT column with E at most 0.80 whose deviation does not
        shrink under CTRL-NULL-FB is read as O-3's disposition governed by INV-5,
        namely a downward trend of pre-registered magnitude whose cause the
        design cannot separate among estimator artifact, curve artifact and a
        mis-specified C_red or P_pred, with NO interval-structure reading in
        either direction and NO cost model re-charged; a column with absolute
        slope at most 0.05 whose interval excludes zero is read as a small
        determined trend that fails S1 and fires no falsification criterion; and
        a single column failing the interval clause with OUT empty is read as
        the multiplicity artifact it most likely is, with the 0.95^9 arithmetic
        stated. None of these creates a new branch, none moves a threshold, and
        all three are recorded here before any measurement exists.

  scope_and_correction_to_the_record:
    REMOVED_1_replacement_narration:
      ruling: CONFIRMED ON EVERY CLAUSE
      basis: >-
        I re-derived the bound rather than adjudicating it by quotation, and the
        amendment's replacement narration is right in all four of its parts.
        (i) The bound bounds COVERAGE, not MULTIPLICITY. |S_m| is the number of
        DISTINCT representable targets; it says nothing whatever about how many
        multisets represent each target, and multiplicity is what a relation
        harvest is priced on. (ii) Index calculus operates in the SATURATED band,
        beta above beta*(m), where coverage is 1 by definition and the priced
        quantity is relations harvested per unit work - which this argument does
        not bound above at all. (iii) The bound is NEAR-DEFINITIONAL. h =
        B^m/(m! p) is a first-moment estimate of the number of representations
        per target, and |S_m| <= C(B+m-1, m) is precisely "the probability of at
        least one representation is at most the expected number of them", i.e.
        Markov's inequality applied to a first moment. There is no content in it
        beyond that. (iv) It therefore CLOSES NO EXPONENT QUESTION, and what it
        does establish is that IDEA-20260727-006's falsification condition 1 was
        MALFORMED AT BIRTH, because it asked whether a first-moment upper bound
        could be exceeded by a factor of two - which is asking whether
        P(X >= 1) > 2 E[X]. That is a genuine and valuable pre-freeze catch about
        a CRITERION and it is not an answer about an EXPONENT. I confirm the
        amendment's reading in full and I record that this de-escalation is the
        most important scope repair in the package.
      unfinished_business: 'RT-13 and PC-3 - the supersession did not reach the archive chain.'
    A1_admission:
      ruling: SURVIVES INTACT AND VERBATIM
      basis: >-
        The amendment's not_changed block carries the admission_and_ceiling text
        word for word and re-affirms it as binding: EXP-YIELD-001 MOVES NO
        EXPONENT and is an EXPONENT-DECIDING SCREEN, expressly not an
        exponent-targeting mechanism under docs/target-result-profile.md rule A1;
        NO DOWNSTREAM RECORD MAY QUOTE IT AS TARGET-CLASS; its claim tier is
        capped at TOY; it can meet NO completion criterion of GOAL-ECDLP-001
        under any outcome; it changes no existing hypothesis status; it leaves
        all four asymptotic-claim promotion gates open; and a timeout, crash,
        resource exhaustion or implementation failure is infrastructure signal
        and is never negative evidence. The replication honesty note is carried
        too - four field sizes on one curve each is a SIZE SERIES and not a
        replication, this is a single unreplicated run set, no strength above
        `preliminary` may be claimed, and `reject_scoped` is FORBIDDEN. I checked
        the outcome table against that cap and every branch complies: the best
        available label is `support` at no more than `preliminary` with a named
        replication, and `reject_scoped` is forbidden under every branch by the
        table's own binding note.
    scope_creep_audit:
      widened_beyond_the_objection: >-
        NOTHING MATERIAL. C-13 (CTRL-NULL-FB from 3 to 10 draws, E_randomFB
        promoted to a reported empirical null, a third INV-5 disposition) and
        C-14 (replicate counts raised) go beyond the four blocking objections,
        but both were STRONGLY RECOMMENDED or forced as a second-order
        consequence by the prior review, both only ADD measurement, and neither
        touches a threshold. C-6's Cauchy-Davenport clause ADDS an impossible
        event to INV-1 rather than relaxing one. C-11 adds a positioning
        paragraph and no measured quantity.
      weakened: >-
        TWO, BOTH DISCLOSED AND BOTH REQUIRED BY AN OBJECTION. First, INV-2 is
        genuinely weakened - INV-2b can no longer void census data - which RT-8
        expressly authorised as one of two acceptable repairs, and whose residual
        defect is RT-12. Second, INV-4 becomes harder to fire because its
        denominator grows by 1.41; the amendment states this in terms and it is
        the correct direction, since the v1 control would have fired INV-4 on a
        systematically understated denominator. Note the dependency this creates:
        if the antipodal derivation were wrong, INV-4 would now be too lax. The
        declared contrast arm is exactly the control that would expose that, and
        it is archived.
      answered_in_words_without_changing_the_thing: >-
        ONE, AND IT IS RT-7 - see RT-13. The narration was corrected in the
        amendment and the promised supersession into the archive chain did not
        execute, so the record a downstream reader will actually meet is
        unchanged. Everything else I checked changed the thing objected to. In
        particular RT-3 and RT-4, which the card flags as the two most likely to
        be restated rather than repaired, are BOTH genuinely repaired: RT-4
        changes the control's sampling process and every dependent sigma figure,
        and RT-3 changes the evaluation procedure, not the prose around it.

  confirmatory_status_adjudication:
    value_under_review: exploratory_only
    ruling: CORRECT, AND MORE CONSERVATIVE THAN docs/task-lifecycle.md SECTION 5 COMPELS
    basis: >-
      Section 5 reads in full: "The Coordinator approves the frozen protocol and
      sends it to the Executor. Protocol changes after approval require a
      versioned amendment. Exploratory changes must be labeled exploratory and
      cannot be evaluated against the original confirmatory criterion." Its
      literal trigger is a change AFTER APPROVAL. EXP-YIELD-001 was NEVER
      approved: its status is `review_required`, its approved_by is null with a
      note explaining that the null is deliberate, and the amendment does not
      move it. So a strict reading would hold that section 5 does not bite at
      all, and that criteria amended before approval and before any data exists
      retain full confirmatory standing - there being no outcome a criterion
      could have been tuned to. THE AMENDMENT NEVERTHELESS ELECTS
      exploratory_only, which is the conservative direction, cannot overstate
      anything, and follows a correction already recorded against a prior batch
      in this program for marking exactly this situation `preserved`. I rule the
      label CORRECT AS ELECTED, and I record that it is elected rather than
      compelled - because an election in the safe direction must never later be
      argued back the other way on the ground that section 5 did not compel it.
      Once recorded, exploratory_only stands.
    separation_of_order_from_standing:
      ruling: SOUND, AND THE DISTINCTION IS DRAWN CORRECTLY
      basis: >-
        Pre-registration ORDER is a property of commit order and is verifiable
        against Git by any third party: I verified it above - no run record
        exists at any commit in this lineage, affected_runs is empty and
        correctly so, and the amendment is committed strictly before any
        measurement. Confirmatory STANDING is a property of protocol stability
        under adverse review, and this protocol changed its evaluable-set
        definition, the null control supplying every standardized denominator,
        and its falsification branch structure, in response to an adverse
        independent review. The amendment claims the first and disclaims the
        second and says in terms that "the two are not interchangeable". That is
        exactly right, and it is the distinction most commonly elided in this
        program's records. The consequence must be carried: no evidence record
        may claim confirmatory strength on the basis of the v1 criteria, and
        under branch O-1 the best available label remains `support` at no more
        than `preliminary` with a named replication.

  executability_ruling:
    can_an_executor_run_this_without_guessing: >-
      YES, WITH ONE NAMED EXCEPTION AND ITS RECORDED WORKAROUND. Everything the
      Executor must do is unambiguous. R-1 gives a single mechanical definition
      of the evaluable set on measured B; R-2 fixes the order of operations so
      the class is computed and frozen before S_m exists; R-3 fixes exactly what
      is recorded per cell; C-4 gives a one-line sampling process for the null
      plus a declared contrast arm at the same cells and counts; C-14 gives
      explicit replicate counts by C_red band; C-13 gives explicit draw counts by
      measured B; C-8 gives explicit seed counts, a pre-registered estimator form
      and an explicit statement of which B to freeze. The six run identifiers,
      the six master seeds and the twenty declared artifact paths are unchanged.
      THE EXCEPTION IS INV-2a (RT-12), whose firing predicate is not stated. If
      PC-1 is recorded before dispatch the Executor never meets the ambiguity. If
      it is not, ST-3 governs: the Executor stops and reports, or records the
      shared-routine known-answer results as observations with a protocol
      deviation noted in the manifest, and defers the INV-2a determination to the
      interpretation task under ST-4. Both are legitimate; neither fabricates a
      verdict.
    EXP_STR_001_AP_admissibility_predicate:
      ruling: RESOLVABLE FROM THE COMMITTED CONTRACT - ST-3 SHOULD NOT FIRE ON IT
      basis: >-
        I checked the committed EXP-STR-001 specification directly rather than
        relying on either prior session. It fixes the factor base at line 19 as
        "x-interval: first B liftable x >= 0, canonical y = min(y, p-y), ordered
        by x"; the support shape at line 9 as {x, x+d, ..., x+(m-1)d} with d in
        D; the shift set at line 16 as the integers 1..64; the exclusion of the
        degenerate d = 0 at lines 27 to 28, where the interpretation is frozen in
        the contract itself; and the recovered quantity at line 53 as
        yield_penalty = C(B,m)/ap_supply, with ap_supply defined at line 48 as
        the number of DISTINCT AP support tuples. Canonical y means one point per
        x, and D positive-only means each support is counted once. That is every
        degree of freedom the leg needs. The amendment's discharge of the v1
        named execution risk is therefore supportable, and its instruction that
        the Executor RECORD WHICH READING AND WHICH B IT USED rather than stop is
        the right disposition.
    CTRL_CALIB_AP_false_invalidation_risk:
      ruling: DISCHARGED, BELT AND BRACES
      basis: >-
        The risk was concrete: EV-STR-001 line 29 records "m=4 at p=211: supply <
        B in 6/6 seeds (as low as 3 tuples)", and the leg draws fresh curves from
        master seed 110601, so a fresh median of 3 at that cell would give
        C(15,4)/3 = 455, i.e. 2.1x the 214.9 target and outside the factor-2
        window, with INV-2 tolerating only one failing cell. The amendment closes
        it twice over and either closure alone would suffice. Raising the two
        n = 211 cells from 6 to 24 seeds makes a median of 3 from a distribution
        with median 8 a far rarer event than at 6 seeds. And splitting INV-2 so
        that AP-supply recovery cannot void means that even two misses produce an
        instrument note rather than a void census. Pre-registering the ratio of
        medians as the window statistic removes the remaining discretion. The
        residual defect is RT-12, which concerns the other half of the split.
    budget:
      ruling: THE UNCHANGED 5400 SECONDS AND 8 GB CARRY EVERY CRITERION
      basis: >-
        Re-derived per arm in this session, not accepted. The 44 criterion-
        evaluable cells cost about 1.33 x 10^6 modular additions in total under
        the feasibility table's own cost model, with a largest single evaluable
        cell of about 2.6 x 10^5. The 44th cell adds about 6.6 x 10^3. The
        occupancy Monte Carlo rises from 1.69 x 10^7 draws under v1 to 4.54 x
        10^7 under v2, counting BOTH the antipodal arm and the declared v1
        contrast arm; CTRL-NULL-FB rises from 3.98 x 10^6 to 6.35 x 10^6; the
        calibration leg rises from 36 to 72 seed-cells over fields of at most
        4099 elements. Total added compute about 3.1 x 10^7, against a design
        whose observation-only priority-3 tier already carries about 1.4 x 10^9
        and against 5400 seconds and 8 GB. Memory is unmoved - one N-bit set at
        32 KB plus the k = 18 DL table, well under 1 GB. NO BUDGET FIELD NEEDS TO
        MOVE and no reduced-scope core is triggered by the amendment. The
        amendment's own claim of "well under 10^7" added is wrong by about a
        factor of three (RT-16) and its conclusion is nevertheless right.
      reduced_scope_core_if_a_cap_binds: >-
        The v1 core is unchanged and remains correct - all criterion-evaluable
        cells at m = 2 and m = 3, both nulls at those cells, the calibration leg
        and the baselines - and my re-derivation confirms it is about 1.3 x 10^6
        modular additions and cannot bind. If a cap binds anyway it binds in the
        priority-3 saturated observation tier, costing observations and not
        criteria, with the unreached cells named under ST-2.

