  ruling:
    headline: >-
      VOID STANDS, AND THE FAULT IS A LOCATED, REPAIRABLE INSTRUMENT FAULT.
      These are not alternatives and the Coordinator must record both. The
      diagnostic is correct - I re-derived it independently and it is stronger
      than the Executor claimed - and it is nevertheless NOT grounds for
      re-dispositioning INV-4 inside EXP-YIELD-001. The repair belongs to a
      successor contract, and the successor cannot be confirmatory on these
      cells.
    why_void_stands: >-
      INV-4 exists to certify P_pred empirically before any E is read. It did
      not certify it. The control the amendment C-4 titled SHAPE-MATCHED is
      still not shape-matched to S_m - C-4 repaired the antipodal-pairing half
      of the shape mismatch and left the pre-marking half in place, then
      asserted the two means agree to O(1), which is false at m = 3. INV-4
      reported that failure exactly as written, on the most forgiving of the two
      available denominator readings. A rule that fires for the reason it was
      written for, on data it was written to police, is not re-dispositioned
      after the fact. RC-11's single amendment cycle is spent; this program has
      already corrected one contract (EXP-IC-001 v3) for outcome-selected
      criteria; and the Executor's diagnostic, however correct, was FOUND by a
      dry run of the fired rule, so its use as a repair inside this batch is
      data-motivated in origin whatever its analytic status.
    why_it_is_also_a_located_repairable_fault: >-
      The fault is one deterministic term in a Monte Carlo control, not an error
      in any measured quantity. |S_m| is exhaustive, deterministic and seed-free;
      P_pred is recomputable from the frozen v1 formula and I reproduced all 49
      recorded values to the printed precision; the omitted term is exact set
      inclusion, S_(m-2) subset S_m, which needs no simulation. INV-4's own text
      voids EVERY E VALUE, not every measurement, and that distinction is in the
      frozen contract, not invented here.
    what_this_ruling_licenses: |-
      L1  The batch disposition `inconclusive` plus a scoped INSTRUMENT
          successor, per P0 of the v2 outcome_disposition_table. This is the
          only disposition available.
      L2  Recording the diagnostic as a located instrument fault with a named
          repair. AGENTS core rule 8 REQUIRES the unexpected observation to be
          recorded; recording it is an obligation, not a favour, and it does not
          need an amendment.
      L3  Carrying forward as DETERMINED, claim-tier-toy OBSERVATIONS, not as
          evidence about yield: |S_m| and the identity-multiset counts at all
          136 cells, B, L, B/L, h, C_all, C(B,m), C_red, the collision
          multiplicity profiles, CTRL-DL (80,000 curve-versus-DL-image checks,
          zero mismatches), the AP calibration leg (INV-2a and INV-2b both not
          fired), and the measured rho and BSGS baselines with their verified
          discrete-logarithm certificates.
      L4  Writing a successor contract that pre-registers the repaired null.
      L5  Correcting, by supersession and never in place, the C-4 claim that
          P_pred is correct to O(1) against the antipodal process, and the
          identical slip in the TASK-20260729-011 recheck note.
    what_this_ruling_forbids: |-
      X1  Re-dispositioning INV-4 to NOT FIRED, on this or any basis.
      X2  Computing E against a repaired P_pred or a repaired null and reading
          ANY branch of the outcome disposition table off it inside BATCH-011.
      X3  Any `support`, `weaken` or `reject_scoped` label on H-YIELD-001, Y2,
          H-IC-001 or any other hypothesis from this run set. `reject_scoped` is
          independently forbidden on a single unreplicated empirical-only run
          set by agents/coordinator.md.
      X4  Quoting the three out-of-band cells, or the figure E about 0.85, as a
          measured decomposition-yield shortfall in any record, in either
          direction.
      X5  Declaring INV-5 FIRED or NOT FIRED as a finding of this batch.
      X6  Re-charging, flagging or defending any index-calculus cost model in
          this ledger on the basis of anything in this package.
      X7  Quoting any part of this package as target-class under
          docs/target-result-profile.md rule A1, as an exponent result, as an
          attack, as a closure or as an impossibility claim.

  diagnostic_verdict:
    verdict: CORRECT, AND STRONGER THAN THE EXECUTOR CLAIMED
    independent_rederivation: >-
      Re-derived from the frozen contract without reading the Executor's
      arithmetic first. v1 conventions_fixed.occupancy_prediction gives
      P_pred = N (1 - exp(-lambda)) + |S_(m-2)| exp(-lambda) with lambda =
      C_red/N, |S_0| = 1, |S_1| = B. That is algebraically identical to
      |S_(m-2)| + (N - |S_(m-2)|)(1 - exp(-lambda)), i.e. the mean of a process
      that PRE-MARKS the |S_(m-2)| deterministically reachable bins and then
      throws C_red balls uniformly over all N bins. CTRL-NULL-SUMSET, both as
      frozen in v1 and as re-specified by v2 C-4, throws C_red/2 antipodal pairs
      into an EMPTY N-bit set and produces only the first term. The gap is
      therefore exactly |S_(m-2)| exp(-lambda) minus a term of order
      (1 - exp(-lambda)) from the (N-1)-versus-N bin count. At m = 2 the term is
      1 times exp(-lambda) and is invisible against a single-replicate sd of 3
      to 100; at m = 3 it is B times exp(-lambda) and dominates wherever lambda
      is small. The structural reason is exact and pre-data: a 3-multiset
      containing a cancelling pair {P, -P, Q} sums to Q, so S_1 = F is contained
      in S_3 with probability 1.
    combinatorics_checked: >-
      C_red = sum_{k=1..m} C(B/2,k) C(m-1,k-1) 2^k counts multisets drawn from k
      distinct antipodal classes with one sign per class and a composition of m
      into k positive parts, i.e. exactly the cancellation-free multisets. At
      B = 16, m = 3 it gives 16 + 224 + 448 = 688, matching the recorded C_red.
      The closed forms B^2/2 at m = 2 and B + B(B-2) + B(B-2)(B-4)/6 at m = 3
      reproduce.
    numerical_check: >-
      Recomputing P_pred from the frozen formula at all 49 criterion-evaluable
      cells reproduces the recorded P_pred with a maximum absolute difference of
      0.000 at every cell. So the driver implements the frozen prediction and
      the fault is not an implementation slip.
    strengthening_the_executor_did_not_claim: >-
      The Executor reports the residual after adding the term back as spanning
      [-0.534, +0.267] in SINGLE-REPLICATE sd units, which I reproduce exactly.
      Under DEV-4's stricter alternative reading - the standard error of the
      mean, at the recorded replicate counts of 100, 30 or 10 - the same
      residual spans [-2.93, +2.67] over 49 cells, which is precisely the range
      49 draws from a standard normal should occupy, with ZERO cells outside 3.
      So the corrected null recovers the corrected P_pred at 49 of 49 cells
      under BOTH denominator readings, while the uncorrected comparison fails at
      4 of 49 under the literal reading and at 22 of 49 under the SEM reading.
      The fault is fully located and fully closed by one term: if a second
      unmodelled term existed, it would show in this residual and it does not.
    where_the_error_was_born: >-
      NOT IN THE EXECUTOR AND NOT IN THE RUN. v2 C-4 basis states, of the
      antipodal process, that its mean is (N-1)(1 - exp(-lambda)) and that
      `P_pred is therefore CORRECT to O(1)`. That comparison silently drops
      P_pred's second term. The identical slip is in the TASK-20260729-011
      recheck note, which computes the difference against
      `N(1 - e^{-C_red/N}) + |S_{m-2}| e^{-...}` as about 0.09 - a number that
      can only arise by comparing against the first term alone. The
      TASK-20260729-003 contract review had already written, correctly, that
      `S_{m-2} is genuinely a subset of S_m`, one paragraph before concluding
      that the mean was fine. The defect is a shared arithmetic slip across the
      amendment and both pre-execution reviews, was catchable with no data at
      all, and its correct value was already on the page.

  objections:
    - id: OB-1
      severity: BLOCKING
      target: any proposal to treat the E values as usable after repairing the null
      statement: >-
        The VOID disposition may not be lifted inside BATCH-011. INV-4's
        function is to certify P_pred before E is read; it did not certify it,
        and the certification gap is real even though the analytic formula
        survives. Lifting VOID on the strength of an analysis produced after the
        rule fired converts a pre-registered validity gate into a post-hoc
        judgement, which is the one thing pre-registration exists to prevent.
      required_response: >-
        Record `inconclusive` plus a scoped instrument successor. Do not
        recompute any E in a BATCH-011 record.
    - id: OB-2
      severity: BLOCKING
      target: the dispatching framing that the E about 0.85 cells route to O-4
      statement: >-
        THIS IS FACTUALLY WRONG ON THE COMMITTED DATA AND MUST NOT ENTER A
        DECISION RECORD. O-4 requires OUT to exceed one third of n_eval. The
        recorded out_of_band block gives n_out = 3 against n_eval = 49, i.e.
        6.12 percent against a one-third threshold of 16.33 cells. Every one of
        the ten realised evaluable columns is FLAT - absolute OLS slope at most
        0.05 with a 95 percent interval containing zero, the largest being
        +0.0408 at m = 3, beta = 0.350 - so no column is DOWN-SIGNIFICANT or
        UP-SIGNIFICANT and branches O-8, O-2, O-3 and O-7 are all excluded. O-1
        fails because OUT is non-empty. The first matching branch is O-6, SPARSE
        OUT-OF-BAND SET, whose disposition is `inconclusive` at batch level with
        the explicit instruction that NO COST MODEL IS RE-CHARGED. The
        counterfactual outcome of a repair is therefore the WEAKEST branch in
        the table, not the strongest.
      required_response: >-
        Any record that mentions the counterfactual must name O-6, must not
        name O-4, and must carry the sentence that even a fully repaired null
        would have produced no cost-model consequence.
    - id: OB-3
      severity: BLOCKING
      target: any reading of the three out-of-band cells as a yield signal
      statement: >-
        The three out-of-band cells are TWO distinct factor bases, not three.
        (k=12, beta=0.325) and (k=12, beta=0.350) have identical measured B = 22,
        identical C_red = 1782, identical |S_3| = 1232, identical E = 0.8484 and
        identical maximum load 14; L is 15 and 18 respectively, so the x values
        15, 16 and 17 admit no point on that curve and the two cells select the
        SAME factor base. Across the whole evaluable set this is the only
        duplicate, so the 49 cells carry 48 distinct (k, m, B) triples. All
        three out-of-band cells sit on ONE curve - k = 12, p = 4099, N = 4001,
        y^2 = x^3 + 4x + 8 - at the smallest size in the design, where the
        contract's own declared weakness is that exactly one curve per size is
        used. In both affected columns E rises monotonically toward 1 with p
        (0.848, 0.964, 0.985, 1.015 at beta = 0.325; 0.848, 0.988, 1.014, 1.015
        at beta = 0.350), so the deviation SHRINKS with size - the opposite
        direction from outcome (c) - and neither column reaches significance.
      required_response: >-
        No interval-structure, curve-structure or yield reading of these cells
        may be written. If the observation is carried at all it is carried as
        `two factor bases on one 12-bit curve, at lambda = 0.33 to 0.45, with
        the deviation decreasing in p`.
    - id: OB-4
      severity: NONFATAL
      target: v2 C-4 and both pre-execution reviews
      statement: >-
        C-4's assertion that P_pred is correct to O(1) against the antipodal
        process is false at m = 3, where the omitted term is B exp(-lambda) and
        grows with the factor base. The TASK-20260729-011 recheck note repeats
        the slip numerically. Both are committed and immutable and must be
        corrected by supersession in the archive receipt and in
        DEC-20260729-001, exactly as C-7 handled the TASK-20260729-002 receipt's
        exponent over-claim.
    - id: OB-5
      severity: NONFATAL
      target: the pre-registration-contamination question
      statement: >-
        NO CONTAMINATION IS DETECTABLE, AND THE PRIMARY METRIC IS STRUCTURALLY
        IMMUNE TO IT, BUT THE DISCLOSURE IS A SELF-ATTESTATION THAT THE SNAPSHOT
        CANNOT CORROBORATE. What is checkable and checks out: the driver
        evaluates INV-4 as bool(abs(ma - p_pred) <= 3 * sa) against
        occupancy_prediction(N, C_red, s_prev), i.e. the frozen formula with
        nothing subtracted; every recorded P_pred reproduces the frozen formula
        to 0.000; the diagnostic fields (S_m_minus_2_term,
        residual_after_adding_back_over_sd) are written per cell and are
        consumed by no criterion, no threshold and no class; the replicate
        counts follow C-14 exactly (100 at C_red at most 1e4, 30 between 1e4 and
        1e6, 10 above); the master seeds are the six declared in the frozen v1
        replication block; cell class is computed by classify_cell(B, m, p)
        before any sumset is built, as v2 C-2 rule R-2 requires; and the census
        is exhaustive, deterministic and seed-free, so |S_m| carries no seed,
        no sampling and no stopping rule that a dry run could have tuned. What
        is NOT checkable: the pre-dry-run driver was never committed, so the
        claim `only reporting changed` cannot be diffed. The rollup block
        derived_diagnostic is emitted only `if failed`, which is harmless but is
        code whose shape records that the firing was known.
      required_response: >-
        Record the residual honestly rather than as a clean bill. The cheapest
        closure is RC-F below.
    - id: OB-6
      severity: NONFATAL
      target: DEV-4, the INV-4 denominator
      statement: >-
        v1 INV-4 never says whether `3 empirical standard deviations` means the
        single-replicate sd or the standard error of the mean. The Executor
        applied the literal single-replicate reading and declared it, which is
        the MORE FORGIVING of the two: under the SEM reading INV-4 fires at 22
        of 49 cells rather than 4, including 4 cells at m = 2. The firing is
        therefore robust to the ambiguity and is not an artifact of a strict
        denominator. The corrected residual passes under both readings, but at
        (k=18, beta=0.450, m=2) it reaches 2.93 SEM, so a repaired successor has
        essentially no margin at one cell and must pre-register the denominator
        rather than inherit the ambiguity.
    - id: OB-7
      severity: NONFATAL
      target: INV-5
      statement: >-
        INV-5 SHOULD NOT BE RECORDED AS FIRED, AND SHOULD NOT BE RECORDED AS NOT
        FIRED. Its trigger turns on an unquantified `shrink` and the recorded
        statistics make the two readings diverge completely. Strict literal
        reading: 16 of 49 cells do not shrink, which exceeds the three-cell
        trigger, so INV-5 fires. Purposive reading: the largest |E - 1| among
        those 16 cells is 0.0157, every one of them is inside the [0.90, 1.10]
        band, E_randomFB is itself a mean of only 3 to 10 draws, and
        n_not_shrinking_and_out_of_band is 0 - all three out-of-band cells DO
        shrink - so the rule catches nothing it was written to catch. A trigger
        that fires on noise at in-band cells and would then forbid reading the
        out-of-band cells that pass it is not an instrument. The Executor was
        right to refuse the determination under ST-4 and DEV-6. The honest
        disposition is UNADJUDICATED BY CONTRACT DEFECT. Nothing turns on it
        here: the conservative branch - no interval-structure reading in either
        direction - is what OB-3 requires on scope grounds anyway, and every E
        is void regardless.
      required_response: >-
        Record INV-5 as UNADJUDICATED-BY-DEFECT with both readings and their
        counts, and require the successor to quantify `shrink` before data, for
        example as |E_randomFB - 1| at most one half of |E_interval - 1|
        evaluated only at cells where |E_interval - 1| exceeds 3 chance sd.
    - id: OB-8
      severity: NONFATAL
      target: R-7 drift and the measured-B classing rule
      statement: >-
        CLASSING ON MEASURED B REMAINS SOUND AND THE DRIFT DOES NOT UNDERMINE
        IT. R-2 freezes each cell's class from measured B alone before S_m
        exists, the driver implements that order, and every one of the 11
        movers moved because measured B differs from L - never because of an E
        value, which did not exist yet. All 11 movers have B greater than L, so
        the movement is a property of the interval realisation, not of an
        outcome. The 44th cell that C-1 added, (m=3, k=12, beta=0.375), left on
        measurement exactly as R-4 named in advance: R-4 states it is evaluable
        iff B is at most 22 given even B, and measured B = 28 gives h = 0.8926.
        R-4 explicitly calls a flip an ORDINARY EVENT that is not a deviation,
        not an invalidation and does not fire ST-3. Freezing the B = L
        enumeration instead would have evaluated criteria at three cells whose
        measured h is 0.552, 0.649 and 0.893 - inside the saturation band the
        design exists to avoid. R-6 correctly applies the realised denominator
        n_eval = 49 to the one-third clause. TWO RESIDUAL OBJECTIONS. First, the
        drift is ONE-SIDED: aggregate measured B over L is 1.046, 1.077, 1.004
        and 1.030 at k = 12, 14, 16, 18, so the realised set gained cells almost
        entirely by crossing the C_red at least 500 floor, and 8 of the 11
        movers sit at C_red between 578 and 722 - the smallest-C_red, largest-
        relative-sd corner of the design. The realised evaluable set is
        therefore biased toward its noisiest cells. Second, n_eval = 49 counts
        48 distinct factor bases (OB-3).
    - id: OB-9
      severity: NONFATAL
      target: the independence assumed by every fraction and tail check
      statement: >-
        The 17 beta cells at each (k, m) are NESTED intervals {0, ..., L-1} on a
        single curve, so measured B and hence C_red, h and S_m are strongly
        positively correlated down each column, and the four sizes are four
        curves, not four independent draws of a curve family. The one-third
        fraction of F2/O-4/O-5/O-6, the Gumbel extreme-value tail check and the
        standardized bulk check against the standard normal all treat the
        criterion-evaluable cells as independent tests. They are not. The
        effective number of independent observations is closer to the number of
        curves than to 49. This does not change any disposition here, because
        every E is void, but it invalidates any future power or false-discovery
        statement computed on n_eval.
    - id: OB-10
      severity: NONFATAL
      target: RT-15, the identity bin
      statement: >-
        The antipodal null partitions N - 1 non-identity elements into (N-1)/2
        bin pairs, but a draw of g = 0 covers one bin and S_m can contain the
        identity. The run record declares this and does not correct it, calling
        the effect O(O(1)). The recorded identity_multisets field shows the
        identity is genuinely reachable at many cells (2 to 410 multisets at
        m = 3, k = 14). The effect is second order against the |S_(m-2)| term
        and does not change the diagnostic, but a repaired null must handle the
        identity bin explicitly rather than by declaration.
    - id: OB-11
      severity: NONFATAL
      target: run provenance
      statement: >-
        The manifests record requested_policy executor-implementation, an
        adapter resolution to anthropic:claude-sonnet-5 at effort medium, and a
        self-reported resolved_runtime_model_id of claude-opus-5 with
        model_verified false and fallback_used false. The mismatch is DISCLOSED
        under policy_binding_mismatch and a doctor --probe was attempted and
        failed on an unset API key and SSL failures, so this is a declared gap
        and not a silent substitution. It nonetheless means the model identity
        behind every number in this package is unverified configuration, which
        must be carried into any evidence record rather than dropped.
    - id: OB-12
      severity: NONFATAL
      target: experiment governance state
      statement: >-
        The Executor discloses that no committed record sets
        EXP-YIELD-001.status to `approved` or fills approved_by; the frozen spec
        still reads review_required and null, and the amendment explicitly
        states it does not approve execution. A run package therefore exists
        against a contract that no committed record ever moved out of
        review_required. This is a governance defect, not a mathematical one,
        and it must be repaired by a superseding record before any evidence
        record cites this package. It is separately disclosed that PC-1, PC-2
        and PC-4 have no separate committed Coordinator recording and that the
        Executor applied the sole committed candidate reading and flagged the
        gap - which is the correct behaviour, but the gap remains open.
    - id: OB-13
      severity: NONFATAL
      target: scope and claim tier
      statement: >-
        AUDITED AND CLEAN. claim_tier reads `toy` in the summary and in every
        manifest; the admission_and_ceiling block is carried verbatim; the
        measured census-to-rho operation ratio is 28,384 at k = 12; 147,480 at
        k = 14; 512,582 at k = 16; and 2,604,442 at k = 18, so the census costs
        between 2.8e4 and 2.6e6 times a measured rho solve of the same instance
        and cannot be an attack under any reading. No artifact in the package
        asserts above its tier. Every rho solve carries a discrete-logarithm
        certificate the driver re-verified and all match the DL table. The A1
        admission survives intact: EXP-YIELD-001 moves no exponent, is an
        exponent-DECIDING screen and not an exponent-targeting mechanism, and
        nothing here is quotable as target-class.

  required_controls:
    - id: RC-A
      title: repaired-null re-derivation, curve-free and archived
      description: >-
        At the four INV-4-failing cells and at a sample of passing cells, run
        the antipodal occupancy null WITH the pre-marking: mark |S_(m-2)| bins
        chosen uniformly at random, then throw C_red/2 antipodal pairs, then
        count distinct occupancy. Compare with the unchanged P_pred under BOTH
        denominator readings. ZERO CURVE COMPUTE - this is pure balls-in-bins on
        recorded N, C_red and B, costs of order 1e6 RNG draws, and must be
        archived under a successor run id or it is not evidence.
      predicted_outcome_stated_in_advance: >-
        |z| below 3 at all cells under both readings, with the mean shifted up
        by |S_(m-2)| exp(-lambda) relative to the recorded null mean. If it is
        NOT, the diagnostic is wrong and the VOID reflects a measurement fault
        rather than a null-construction fault, which would change the entire
        reading.
    - id: RC-B
      title: multi-curve control at the out-of-band cells
      description: >-
        Re-run the census at k = 12, m = 3, beta in {0.300, 0.325} on at least
        20 further prime-order curves over p = 4099 under the same deterministic
        interval rule. This is the ONLY control that separates an
        interval-structure effect at small N from a property of the single curve
        y^2 = x^3 + 4x + 8. It requires curve compute and must be a declared
        successor run, not a probe.
      discriminating_prediction: >-
        E clustered near 0.85 across curves means small-N interval structure; E
        scattered about 1 with 0.85 in the tail means a curve artifact and the
        observation dies.
    - id: RC-C
      title: de-duplicate the grid on measured B
      description: >-
        The successor must detect and merge cells whose measured B coincides
        within a (k, m) column, so that n_eval counts distinct factor bases. On
        this package that would have turned 49 into 48 and 3 out-of-band cells
        into 2.
    - id: RC-D
      title: quantify INV-5's `shrink` before data
      description: >-
        Give the trigger a numeric form and restrict it to cells whose interval
        deviation exceeds a stated multiple of the chance sd, so it cannot fire
        on in-band noise.
    - id: RC-E
      title: pre-register the INV-4 denominator
      description: >-
        State explicitly whether the 3 standard deviations are single-replicate
        or standard error of the mean. On this package the choice moves the
        firing count from 4 to 22 of 49.
    - id: RC-F
      title: close the self-attestation gap on the development dry run
      description: >-
        Commit the sha256 of the pre-dry-run driver, or have an independent
        session re-implement occupancy_prediction and the antipodal
        occupancy_null from the contract text alone and reproduce the four
        recorded failing cells. The second is cheap, curve-free and archivable,
        and it is the only route that makes `only reporting changed` a checked
        fact rather than a disclosure.
    - id: RC-G
      title: confirmatory-status declaration for any successor that reuses |S_m|
      description: >-
        MANDATORY AND EASILY MISSED. A successor that recomputes E from the
        already-committed |S_m| against a repaired null has an outcome that is
        fully determined by data already in hand, so it CANNOT be confirmatory
        under docs/task-lifecycle.md section 5 and must be labelled
        exploratory_only. A confirmatory test of the yield heuristic requires
        FRESH cells - new curves per size, or new sizes - with the repaired null
        pre-registered before they are measured.

  counterexample_or_mutation: >-
    The cheapest discriminating control is RC-A, and it is the one this batch
    could actually have produced without spending a single curve operation:
    re-run the recorded antipodal null with the |S_(m-2)| bins pre-marked. It
    costs seconds, touches no curve, and separates the two readings of the VOID
    completely - if the pre-marked null lands on P_pred the fault is in the
    control's construction and the E values were never in question; if it does
    not, P_pred is wrong in some further way and the VOID is a measurement
    verdict. The cheapest mutation that would kill the only interesting
    observation in the package is RC-B: 20 further prime-order curves at
    p = 4099 at the two out-of-band factor bases. A single curve cannot separate
    interval structure from curve identity, and the contract says so itself.

  baseline_comparison:
    pollard_rho_with_negation:
      model_position: 0.886 sqrt(N) group operations
      measured: >-
        59.1, 117.1, 260.9 and 492.1 mean walk steps at k = 12, 14, 16, 18
        against model positions 56.0, 114.2, 227.0 and 453.3 - ratios 1.055,
        1.025, 1.150 and 1.086. INV-6 does not fire at any size and every solve
        carries a re-verified discrete-logarithm certificate matching the DL
        table.
      memory_note: >-
        DECLARED IN THE RUN RECORD AND MATERIAL. This harness's rho stores every
        visited class and stops at the first repetition, so it uses O(sqrt(N))
        memory rather than the O(1) of a Floyd, Brent or distinguished-point
        rho. The convention was chosen to make the step count comparable with
        the 0.886 sqrt(N) model position; a constant-memory variant would
        measure MORE steps for the same solve.
    bsgs:
      model_position: about 2 sqrt(N) time, sqrt(N) stored elements
      measured: >-
        97.0, 191.8, 367.8 and 810.0 operations against 126.5, 257.8, 512.2 and
        1046.5, i.e. ratios 0.72 to 0.79 - consistent with the usual 1.5 sqrt(N)
        realisation rather than an anomaly - with 64, 129, 257 and 512 stored
        group elements against the sqrt(N) model.
    closest_specialized_baseline: >-
      Summation-polynomial index calculus in the Semaev, Gaudry and Diem line.
      Per v2 C-11, and stated there as a positioning claim with NO EXTERNAL
      SOURCE RETRIEVED, it has no known sub-sqrt(p) instantiation over PRIME
      fields; the published sub-sqrt and subexponential results in that line are
      over extension and binary fields. C-11's consequence is the one that binds
      here and I endorse it: the yield factor measured by this census is NOT the
      binding factor for the prime-field exponent - the decomposition-TEST cost
      is, and this contract deliberately excises it for instrument independence
      under DEC-20260727-009. Even a perfect outcome (a) would move nothing
      about the prime-field exponent.
    this_experiment:
      time: >-
        MEASURED 1.68e6, 1.73e7, 1.34e8 and 1.28e9 group-equivalent operations
        at k = 12, 14, 16, 18, of which the DL table alone is N point additions.
      memory: O(N) bits for the sum set plus the full DL table; peak RSS 0.869 GB of an 8 GB cap.
    dominated_by: pollard-rho-with-negation
    dominated_by_basis: >-
      NOT A DEFAULT. Every frontier axis was checked against the measured
      figures in this package. TIME - census over measured rho is 2.84e4, 1.47e5,
      5.13e5 and 2.60e6 at the four sizes, so rho dominates by 4.5 to 6.4 orders
      of magnitude, and BSGS dominates by a similar margin at 97 to 810
      operations. MEMORY - the census needs O(N) bits plus a DL table of N
      entries against rho's O(1) stored points in a standard implementation and
      BSGS's measured 64 to 512 stored elements. DATA AND QUERIES - the census
      is exhaustive over all N group elements and its setup alone costs N group
      operations, already more than the 0.886 sqrt(N) rho needs to solve the
      instance outright. SPECIALIZED - summation-polynomial index calculus has
      no known sub-sqrt(p) prime-field instantiation, so it does not dominate
      rho over prime fields either, and the census does not implement it.
    sota_delta: >-
      Negative on every axis. Time: between -4.5 and -6.4 orders of magnitude
      against measured Pollard rho on the identical instance. Memory: O(N) bits
      plus an N-entry DL table against O(1) to O(sqrt(N)). There is no
      favourable reading to protect, and under the VOID disposition there is no
      reading at all.

  heuristic_challenges:
    - id: HC-1
      target: HEUR-1, the counting heuristic B^m/(m! p)
      statement: >-
        HEUR-1 is not tested by this package. Every E value is void, and the
        only pre-data statements that survive are scale-free algebra rather than
        measurement: the counting ceiling R at most (p/N) prod (1 + j/B), and
        the threshold comparison of REMOVED-3. C-7 already corrected the
        narration of the first and its correction is binding: the bound is
        elementary and near-certainly folklore, it closes NO exponent question,
        and it bounds distinct COVERAGE rather than decomposition MULTIPLICITY,
        while index calculus operates in the saturated band where coverage is 1
        by definition and the priced quantity is relations harvested per unit
        work, which this argument does not bound above at all. That qualifier
        may not be dropped in any restatement.
    - id: HC-2
      target: the random-model transfer inside the occupancy null itself
      statement: >-
        The null value E = 1 holds under an ASSUMED independence model, not `by
        construction` as the frozen contract says - the TASK-20260729-003 review
        already made this correction and it is right. The package contains
        direct evidence that the transfer fails on the structured object: at
        (k=12, m=3, beta=0.325) the maximum load is 14 with C_red = 1782 balls
        in 4001 bins at mean load 0.45, where a Poisson(0.45) maximum over 4001
        bins is about 4 to 5; at (k=14, m=3, beta=0.600) the maximum load is 666.
        Sums of a structured negation-closed set are not uniformly random balls,
        and the collision profile says so at every m = 3 cell. This is the
        cheapest available exposure of the deviation and it is already recorded.
        CTRL-NULL-SUMSET cannot detect it - it validates the ARITHMETIC of
        P_pred against draws that are independent by construction. Only
        CTRL-NULL-FB can, which is exactly why v2 C-13 raised it to 10 draws and
        gave INV-5 a third disposition.
    - id: HC-3
      target: scale honesty, attacked by name as the card requires
      statement: >-
        AT 12 TO 18 FIELD BITS THE SHORT-BOX REGIME IS BARELY ENTERED AND THIS
        DEFEATS EVERY READING ON OFFER. The measured factor base is a large
        fraction of the field at the higher beta - measured B over L exceeds 1
        at nearly every cell, aggregate 1.046, 1.077, 1.004 and 1.030 by size,
        and B reaches 538 of about 131,000 available x values at k = 18,
        beta = 0.500 while at k = 12 the whole beta grid saturates by
        beta = 0.500 with |S_m| = N = 4001. The regime in which the counting
        heuristic is actually charged by an index-calculus cost model - B a
        vanishing fraction of a cryptographic-size field, with m growing - is
        not entered at all. No correspondence, isometry or transport argument is
        offered or available (the contract says so: `correspondence: null -
        direct sampling`), so there is no substitute-sampling route to
        cryptographic scale here of the kind docs/target-result-profile.md
        requires. NOTHING MEASURED IN THIS PACKAGE IS EVIDENCE ABOUT
        CRYPTOGRAPHIC-SIZE CURVES IN EITHER DIRECTION.
    - id: HC-4
      target: declared-confounder audit, tested rather than rediscovered
      statement: |-
        Each confounder IDEA-20260727-006 and the contract already declared,
        tested against the committed package:
          m-SUM COLLISIONS BIAS THE RATIO BELOW 1 FOR KNOWN REASONS, so a
          slightly-low ratio is NOT evidence of structure - ADDRESSED. This is
          precisely why the design measures E against P_pred rather than R
          against h, and the recorded collision profiles show the bias is real
          and large. It also means the three low cells cannot be read as
          structure without RC-B.
          THE (x, +-y) PAIRING SHIFTS THE RATIO BY A CONSTANT - ADDRESSED BY
          MEASUREMENT. Every criterion runs on measured B, and B and L and B/L
          are recorded per cell, so the pairing is handled by counting rather
          than by a factor-of-two convention.
          THE m! DENOMINATOR ASSUMES UNORDERED DISTINCT m-SUBSETS - ADDRESSED.
          C_all = C(B+m-1, m), C(B, m) and C_red are all reported per cell and
          C_all m!/B^m = prod (1 + j/B) is checked rather than assumed; I
          verified C_red's combinatorics independently at both arities.
          THE SHORT-BOX REGIME IS BARELY ENTERED - PARTIALLY ADDRESSED ONLY. It
          is declared in scale_relevance and it is real, and no design element
          mitigates it. See HC-3.
          ONE CURVE PER SIZE - UNADDRESSED BY DESIGN AND DECISIVE HERE. The
          contract declares it and offers the uniform-random factor-base null as
          the separator, but that null varies the FACTOR BASE, not the CURVE, so
          it cannot separate an interval effect from a curve identity at k = 12.
          See OB-3 and RC-B.

  cost_model_challenges:
    - id: CC-1
      statement: >-
        NO COST MODEL MAY BE RE-CHARGED, FLAGGED OR DEFENDED ON THIS PACKAGE.
        Under P0 no outcome branch is evaluated; under the counterfactual repair
        the branch is O-6, whose disposition text says in terms that no cost
        model is re-charged. Both roads end in the same place.
    - id: CC-2
      statement: >-
        The census is not and cannot be an attack, and the package proves it
        with measured operation counts rather than asserting it: 2.8e4 to 2.6e6
        times a measured rho solve on the same instance, with the DL table alone
        costing N group operations against rho's 0.886 sqrt(N). A ratio below 1
        would have been an accounting red flag; the ratios are far above 1 at
        every size.
    - id: CC-3
      statement: >-
        Memory is reported beside time throughout - O(N) bits for the sum set
        plus the DL table, peak RSS 0.869 GB - and the rho baseline's memory
        convention is declared as O(sqrt(N)) rather than silently claimed as
        O(1). That is the correct discipline and I have no objection to it, only
        the note that a constant-memory rho would show MORE steps and so the
        measured rho position is if anything optimistic for the baseline.
    - id: CC-4
      statement: >-
        There is no per-attempt-versus-total-expected-cost bookkeeping to
        challenge, because this experiment prices no algorithm. That is correct
        for a screen and is noted so a later reader does not mistake the absence
        for an omission.

  reduction_and_scope_challenges:
    - id: SC-1
      statement: >-
        No corollary is obtained here by citing any published reduction, so
        there is no reduction instantiation to check. The one positioning claim
        about published work - C-11 on the Semaev, Gaudry and Diem line - is
        explicitly declared as a positioning statement with no external source
        retrieved and no theorem, number or citation asserted. That declaration
        is the honest form and it must survive into any downstream record
        verbatim; it must NOT be upgraded into a citation.
    - id: SC-2
      statement: >-
        SCOPE IS NOT INFLATED, AND THE AFFECTED-VERSUS-SAFE QUESTION DOES NOT
        ARISE, BECAUSE NO SCHEME IS AFFECTED. The package moves no exponent,
        changes no hypothesis status, meets no completion criterion of
        GOAL-ECDLP-001 under any outcome, leaves all four asymptotic-claim
        promotion gates open and attempts none, and claims no closure quorum.
        Every one of those statements is carried verbatim in the frozen
        admission_and_ceiling block and is reproduced in the summary and in
        every manifest. I confirm the A1 admission survives intact.
    - id: SC-3
      statement: >-
        DECLARE NO LANE DEAD. Nothing in this package is an impossibility
        result, and the VOID is emphatically not one - a fired validity gate is
        the absence of a measurement, not the presence of a negative one. The
        decomposition-yield question at m in {2, 3} over prime fields remains
        OPEN and is now cheaper to answer than before, because the instrument
        fault is located and its repair is one term.
    - id: SC-4
      statement: >-
        THE MAXIMUM SCOPE ANY READING OF THIS PACKAGE COULD EVER HAVE HAD, had
        INV-4 not fired: four prime field sizes k in {12, 14, 16, 18}, ONE
        prime-order curve per size chosen by a deterministic rule, x-interval
        factor bases anchored at 0 on the frozen 17-point beta grid,
        m in {2, 3}, unweighted decomposition with coefficients in {+1, -1},
        multiset repetition allowed, membership decided by hash lookup with no
        polynomial solver, one implementation, one budget, one platform.
        EVERYTHING ELSE IS OUT OF SCOPE, and the list is not decorative: other
        integer coefficients, adaptive factor bases, decomposition MULTIPLICITY,
        beta_cert, the (m+1)/(2m) derivation, IDEA-20260727-006's headline gap
        claim (DEFER-BATCH011-002), any arity above 3, any binary or extension
        field, any curve family beyond the four selected, any field size outside
        12 to 18 bits, and every cryptographic size.

  narrowest_supported_statement: >-
    EXP-YIELD-001 v2 SUPPORTS NO STATEMENT ABOUT DECOMPOSITION YIELD. Its
    invalidation rule INV-4 fired at 4 of 49 criterion-evaluable cells, so every
    occupancy-normalised efficiency E in the package is VOID rather than
    negative by pre-registration, no outcome branch is evaluated, and the void
    is never a negative mathematical result. What the batch DOES support, at
    claim tier toy and at no strength above preliminary, is a single instrument
    finding derived from committed quantities and independently re-derived in
    this review: the occupancy null CTRL-NULL-SUMSET, as frozen in v1 and as
    re-specified by amendment C-4, does not simulate the process that P_pred
    models, because it throws C_red balls into an empty N-bit set while P_pred
    is the mean of a process that also pre-marks the |S_(m-2)| bins that a
    cancelling multiset reaches deterministically; the discrepancy is exactly
    |S_(m-2)| exp(-C_red/N) at every one of the 49 cells, invisible at m = 2
    where the term is 1 and dominant at m = 3 where it is B; and with that term
    restored the antipodal null recovers P_pred at 49 of 49 cells within 3
    standard deviations under both the single-replicate and the standard-error-
    of-the-mean readings of INV-4. Correspondingly, C-4's claim that P_pred is
    correct to O(1) against the antipodal process holds at m = 2 and fails at
    m = 3. Separately and as OBSERVATIONS rather than evidence: |S_m| is
    DETERMINED exhaustively at all 136 cells with no cell skipped and no
    invalidation of INV-1, INV-2a, INV-3 or INV-6; CTRL-DL agreed on all 80,000
    curve-versus-DL-image checks; and the census cost 2.8e4 to 2.6e6 times a
    measured Pollard rho solve of the same instance, so it is not and cannot be
    an attack.

  next_concrete_action: >-
    Coordinator writes DEC-20260729-001 as `inconclusive` on EXP-YIELD-001 with
    the VOID upheld under P0, carrying OB-1 through OB-3 verbatim, and dispatches
    ONE scoped instrument successor whose first and only gate is RC-A - the
    curve-free repaired-null re-derivation at the four INV-4-failing cells,
    archived under its own run id, predicted in advance to land within 3
    standard deviations under both denominator readings. Nothing else in this
    lineage moves until RC-A is archived and verified, because RC-A is what
    decides whether the fault is in the control's construction or in P_pred
    itself, and every other successor question is downstream of that answer.

  completion_gate_status:
    T1_scope_attack: MET - see SC-4, HC-3 and the scope block of falsification_review.md.
    T2_estimator_attack: >-
      MET AND DECISIVE. The verdict is that the measured discrepancy was
      produced by the ESTIMATOR - specifically by the null control's
      construction - and not by the decomposition. Tested against both null
      arms: the antipodal primary arm and the declared independent-throw
      contrast arm, whose measured sd ratio is 1.443 mean and 1.420 median
      against the analytic sqrt(2) = 1.4142, confirming v2 C-4's variance
      derivation by measurement rather than by import.
    T3_declared_confounder_audit: MET - HC-4, with one UNADDRESSED and one PARTIALLY ADDRESSED.
    T4_pre_stated_narrowest_sentences: MET - falsification_review.md, one per outcome plus the realised VOID and the counterfactual O-6.
    T5_refutation_artifact: MET - falsification_review.md; the strongest artifact this result admits is a DERIVATION NOTE, and the batch can produce it.
    T6_pareto_honesty: MET - dominated_by is pollard-rho-with-negation with every frontier row listed; sota_delta is quantitative and negative on every axis; no null was left unchecked.
    T7_claim_tier_check: MET - OB-13. No artifact and no proposed reading asserts above its tier.
    T8_provenance_and_limits: MET - see provenance below and OB-11.
    lines_not_reached_inside_the_cap: >-
      NAMED EXPLICITLY. (i) The deterministic curve-selection rule was NOT
      re-executed - that would require curve compute, which this card forbids;
      the four recorded curves were checked only for plausibility (t = 12, 5, 14
      and 6 candidate sums against an expected 8 to 12 trials for prime order)
      and for internal consistency (N prime, N distinct from p, Hasse-admissible
      traces 99, -207, -95 and 441, generator recorded, DL walk closure and the
      2x+1 = N point count both true). (ii) The AP calibration leg's supplies
      were not independently reconstructed; only its rollup, INV-2a and INV-2b
      determinations were audited. (iii) The Gumbel tail check and the
      standardized bulk check were not recomputed cell by cell, because both are
      denominated in the same empirical sd whose consumer INV-4 already voided,
      and because OB-9 makes their independence assumption unsound regardless.
      (iv) The 87 non-criterion-evaluable cells were reviewed only in aggregate.

