contract_review:
  id: RT-20260729-001
  task_id: TASK-20260729-003
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-011
  role_executed: red-team
  role_declared_in_queue: reviewer
  role_note: >-
    The BATCH-011 queue card names role `reviewer`; this session was launched
    under the Red Team contract at agents/red-team.md. Both contracts are
    discharged here, and the declared artifact filenames from the queue card
    are used unchanged so that no queue amendment is required. The full
    red_team_report block required by agents/red-team.md is embedded below.
  verdict: REVISE
  verdict_scope: >-
    REVISE blocks execution only. It is not a rejection of the mechanism, the
    hypothesis, or the design. The core of this contract is sound and unusually
    well built - the primary metric is genuinely exhaustive, the null is derived
    rather than fitted, the a-priori exclusion that killed the upward criterion
    is a correct derivation, the budget carries every criterion by three orders
    of magnitude, and the named execution risk turns out to be resolvable. Every
    objection below is a pre-execution, textual, arithmetic or one-line-control
    repair. All of them fit inside the single versioned protocol_amendment cycle
    permitted by RC-11 and INT-BATCH011-E.

  claim_under_review: >-
    That EXP-YIELD-001 as frozen at commit 82327a02bb3041af70566a3f8edfb4468dd2d52d
    can produce a pre-registered decision under every outcome; that its success
    criterion S1 can fail and its falsification criterion F1 can fire; that its
    calibration leg is a real invalidation test; and that the inherited upward
    criterion `R > 2.0 and growing` is correctly excluded a priori by counting
    rather than by measurement.

  snapshot_verification:
    commit_sha: 82327a02bb3041af70566a3f8edfb4468dd2d52d
    reachable_from_head: true
    head_at_review: 4fa4455793bd2117db6140f58fd38f79cc2b8000
    first_parent_matches_receipt: true
    parent_sha: 93d961e012d4db59641933a90ce03587e2ba189e
    changed_path_count: 3
    changed_paths_match_receipt: true
    all_three_sha256_match_receipt: true
    worktree_matches_committed_blobs: true
    verified_by: >-
      git merge-base --is-ancestor, git show --name-status, and shasum -a 256 of
      both the committed blob and the worktree file for each of the three paths.
    not_verified: >-
      Whether tools/allocate_id.py --check was actually run before the commit.
      The receipt asserts it; the contract's own id_check block records that the
      authoring session had no shell and could not run it. Recorded as an
      untested claim, not as a defect.

  objections:
    - id: RT-1
      severity: blocking
      title: The criterion-evaluable set has 44 members, not 43
      finding: >-
        Evaluating the frozen predicate (h at most 0.5 AND C_red at least 500)
        over all 136 cells gives 27 cells at m=2 and 17 at m=3, total 44. The
        contract, the hypothesis and the feasibility table all state 43. The
        missing cell is m=3, beta=0.375, k=12, where B=23 gives h=0.4951 and
        C_red=2035.5, both inside the predicate. The table's m=3 section stops
        at beta=0.350 because it applied the tightest h-band (0.3627, the k=18
        value) as a global cut, where the predicate is evaluated per size and the
        k=12 band is 0.3774. Column counts are unaffected - the new cell is alone
        in its column, so nine evaluable columns stands.
      why_it_blocks: >-
        run_plan instructs both null arms to run at "the 43 criterion-evaluable
        cells". An Executor implementing the predicate gets 44; an Executor
        copying the enumeration gets 43. Under ST-3 that is an ambiguity to stop
        and report on, which costs the batch a stop for a defect that costs one
        line to fix now.
      required_repair: >-
        Correct the count to 44, add the cell to the section 5 m=3 table, and
        state which authority governs - see RT-2.

    - id: RT-2
      severity: blocking
      title: >-
        The evaluable set is defined on measured B but frozen as an enumeration
        computed on B equal to L, and two cells sit on the knife edge
      finding: |-
        The contract is emphatic and correct that every criterion is evaluated on
        measured B, never on the interval length L. But the criterion-evaluable
        SET is frozen as a fixed enumeration computed on B = L. Two evaluable
        cells flip on a small fluctuation of measured B:
          - m=2, k=18, beta=0.500: h = 512^2 / (2 * 262144) = 0.5000 exactly.
            A measured B of 514 gives h = 0.5039 and drops the cell.
          - m=3, k=12, beta=0.375: h = 0.4951. A measured B of 24 gives
            h = 0.5625 and drops the cell.
        Measured B is twice the number of x in the interval admitting points and
        fluctuates on the order of sqrt(L), so both flips are ordinary events.
      required_repair: >-
        State explicitly that the predicate on measured B governs and that the
        section 5 enumeration is illustrative, or freeze the enumeration and say
        the predicate is illustrative. Either is acceptable; leaving both
        authoritative is not, and it is precisely the class of ambiguity ST-3
        tells the Executor to stop on.

    - id: RT-3
      severity: blocking
      title: >-
        F2 excludes its own stated cause, and the most likely non-null outcome
        maps to no pre-registered verdict
      finding: |-
        F2 fires only if out-of-band cells show "NO monotone trend in p AND no
        consistent sign", and its stated meaning is "the analytic null is missing
        a term". A missing term in P_pred or in C_red is multiplicative and
        produces a consistent sign by construction. Worse, the counting ceiling
        E_max = min(C_all, N) / P_pred is below 1.10 at 17 of the 44 evaluable
        cells (as low as 1.0184 at m=2, k=18, beta=0.350), so at 39 per cent of
        the evaluable set an upward out-of-band deviation is mathematically
        impossible and the sign CANNOT be mixed.
        Consequence, stated as an outcome gap rather than as an unfirable
        criterion. Suppose E is about 0.85 at every evaluable cell with no trend
        in p - the single most likely non-null result, being what any omitted
        order-one correction produces. Then S1 fails (E below 0.90), F1 does not
        fire (slope about zero, E not decreasing), and F2 does not fire
        (consistent sign). The run produces NO pre-registered verdict for its
        most likely non-null outcome.
      required_repair: >-
        Delete the four words "and no consistent sign" from F2 in both the
        contract and H-YIELD-001, or add a fourth pre-registered branch for a
        p-independent uniform shift. One-line fix.

    - id: RT-4
      severity: blocking
      title: >-
        CTRL-NULL-SUMSET is not shape-matched to S_m; the null variance is
        understated by a factor of two
      finding: |-
        F is closed under negation and N is odd, so S_m = -S_m exactly. On
        multisets the involution M -> -M has no fixed point among the
        cancellation-free multisets (a fixed point needs P and -P both present),
        so the C_red balls arrive as exactly C_red/2 antipodal PAIRS, each pair
        covering a bin-pair {g, -g}. Deriving the occupancy law for that process:
        C_red/2 throws into (N-1)/2 bin-pairs, each covering 2 bins, gives mean
        (N-1)(1 - exp(-lambda)) - so P_pred is CORRECT to O(1) and no criterion
        threshold moves - but variance exactly 2x the independent-throw variance,
        i.e. relative sd multiplied by sqrt(2).
        CTRL-NULL-SUMSET as frozen throws C_red INDEPENDENT uniform elements of
        G, which is the wrong process. Corrected figures: maximum chance sd over
        the evaluable set is 1.49 per cent, not 1.05; the plus-or-minus 10 per
        cent band is 6.7 sigma, not 9.5; F1's 0.80 threshold is 13.4 sigma, not
        19. Both remain structure thresholds, so the criteria survive.
      why_it_blocks: >-
        The empirical sd from this control feeds the NOISE-LIMITED exclusion
        rule, INV-4's three-sd test, the Gumbel extreme-value tail check and the
        standardized bulk check against the standard normal. A control that
        reports an sd systematically 1.41x too small would inflate every
        standardized deviation by 1.41 across all 44 cells and manufacture an
        apparent tail excess. The contract calls this control SHAPE-MATCHED in
        its own title; it is not.
      required_repair: >-
        One line in the control - draw g uniformly and insert both g and -g,
        C_red/2 times - plus restating the sigma figures in sections 5 and 6 of
        the feasibility table.

    - id: RT-5
      severity: material
      title: The a-priori exclusion is over-stated at the degenerate cells
      finding: |-
        The derivation is CORRECT and I re-derived it independently; see
        feasibility_check.md section 2. The step that does not hold as written is
        "Every cell in the design has B at least 5", which is evaluated on B = L
        while every criterion in this contract is evaluated on measured B.
        R_max exceeds 2 exactly when B is at most 3 at m=3 and at most 1 at m=2:
        B=2 gives R_max = 3.096 and B=3 gives 2.293 at m=3. At the single
        smallest cell L=5, a measured B of 2 means F = {P, -P}, S_3 =
        {3P, P, -P, -3P}, |S_3| = 4 = C_all, and R = 3p/N which is about 3.0.
        That is the event "only one of the five x in the interval is a square",
        which is not rare.
        Also, the design-wide ceiling recomputes to 1.7338, not 1.733, because
        the table uses the linearisation p/N <= 1 + 2/sqrt(p) = 1.03125 where the
        exact Hasse supremum is 4096/3969 = 1.03200. The same linearisation
        understates all four p/N bounds.
      narrowest_valid_replacement: >-
        R greater than 2.0 cannot fire at any criterion-evaluable cell, where the
        smallest B is 15 at m=3 and 34 at m=2 giving ceilings 1.248 and 1.062,
        robust to any plausible fluctuation of measured B; and the composite
        three-consecutive-sizes form cannot realistically fire anywhere in the
        design. The design-wide ceiling 1.7338 is conditional on B = L and rises
        to about 3.096 at the smallest cell if measured B collapses to 2.
      required_repair: >-
        Replace "Every cell in the design has B at least 5" with the measured-B
        statement above, and correct 1.733 to 1.7338.

    - id: RT-6
      severity: material
      title: >-
        The counting ceiling on E is never reported, although E is the metric all
        criteria now run on
      finding: >-
        The contract reports R_max per cell but not E_max = min(C_all, N)/P_pred.
        Over the 44 evaluable cells E_max ranges from 1.0184 to 1.421 and is
        below 1.10 at 17 of them. The plus-or-minus 10 per cent band is therefore
        one-sided at 39 per cent of the evaluable set. This does not break S1 - a
        ceiling inside the band makes the success side easier, not impossible -
        but it is exactly the kind of fact the feasibility table exists to
        surface, and it is what makes RT-3 bite.
      required_repair: >-
        Report E_max per cell alongside R_max, and state the one-sidedness.

    - id: RT-7
      severity: material
      title: >-
        REMOVED-1's narration contradicts the contract's own A1 admission
      finding: |-
        admission_and_ceiling states, correctly and bindingly, that EXP-YIELD-001
        MOVES NO EXPONENT and is an exponent-deciding screen. REMOVED-1 then
        narrates the same derivation as "an answer to the exponent question in
        the PESSIMISTIC direction", and the snapshot receipt escalates it further
        to "the one event that would have reopened a sub-1/2 exponent; it is
        closed by counting, not measurement". Those cannot both stand, and the
        second is what downstream records quote.
        On the merits: B^m/(m! p) is a first-moment estimate, so "the number of
        distinct sums is at most the number of objects generating them" is close
        to definitional. D-1 does not deliver new information about any exponent.
        What it establishes - and this is genuinely valuable - is that
        IDEA-20260727-006's falsification condition 1 was MALFORMED AT BIRTH,
        because it asked whether a first-moment upper bound could be exceeded by
        a factor of two.
        Separately, R bounds distinct COVERAGE, not decomposition MULTIPLICITY.
        Index calculus operates in the saturated band, where coverage is 1 by
        definition and the priced quantity is relations per unit work, which this
        argument does not bound above at all. H-YIELD-001 interpretation_limits
        excludes multiplicity explicitly and correctly; REMOVED-1 and the receipt
        drop the qualifier.
      required_repair: >-
        Rewrite REMOVED-1's consequence paragraph to the malformed-criterion
        statement, keep the multiplicity qualifier attached to every restatement,
        and correct the receipt language in the next archive record rather than
        editing the committed receipt.

    - id: RT-8
      severity: material
      title: >-
        INV-2 can void a valid census on sampling noise in an unrelated leg, and
        its inferential link to the census is asserted rather than established
      finding: |-
        Two distinct problems.
        (a) FALSE-INVALIDATION RISK. EV-STR-001 itself records "m=4 at p=211:
        supply < B in 6/6 seeds (as low as 3 tuples)". CTRL-CALIB-AP uses master
        seed 110601 with six freshly derived per-cell seeds, so it draws
        DIFFERENT curves from the six that produced the target medians. At a
        median supply of 8 with per-seed values reaching 3, a fresh median of 3
        gives a recovered penalty of 455, which is 2.1x the 214.9 target and
        outside the factor-2 window. INV-2 tolerates exactly one failing cell, so
        one miss is absorbed; a second, at the similarly small-count (211, m=3)
        cell, voids the entire census on noise in a leg that never touched it.
        (b) NON-SEQUITUR. INV-2's warrant is that a harness which cannot recover
        a known penalty produces untrustworthy yield numbers. But the leg shares
        no code path with the census - it enumerates AP supports at
        B = ceil(sqrt(n)) and reports C(B,m)/supply, while the census computes
        distinct(S_2 + F) in a discrete-log image and reports |S_m|/P_pred.
        Passing says nothing about the sumset estimator; failing voids data it
        never touched. CTRL-DL is the control that actually stands behind the
        census.
      required_repair: >-
        Raise the seed count at the two small-supply cells (211, m=3) and
        (211, m=4) from 6 to at least 24, or pin the exact curves; AND either
        route the AP leg's supply through the identical distinct-count and
        membership routine used by the census so it becomes a genuine known-answer
        test of the shared code, or downgrade INV-2 from "census numbers VOID" to
        an instrument note that does not void census data.

    - id: RT-9
      severity: minor
      title: Three arithmetic errors in a table whose sole purpose is checkable arithmetic
      finding: |-
        None is load-bearing; all three are in a document that asks to be
        re-derived rather than quoted.
          - beta*(m=3) is wrong at three of four sizes: 0.3982 / 0.3930 / 0.3892
            where the recomputed values are 0.3949 / 0.3872 / 0.3812. The m=2 row
            is exactly right. Margin against beta_cert(3) = 0.6667 is 0.28, so
            D-3 is untouched.
          - L(k=12, beta=0.225) is given as 7; 2^2.7 = 6.4980 rounds to 6. The
            cell is far outside the evaluable set under either value.
          - The p/N linearisation understates: 1.0313 quoted where the exact
            Hasse supremum is 1.0320, propagating into 1.733 vs 1.7338.
        For the record, what DID reproduce exactly: the h <= 0.5 band values
        (0.3774 / 0.3711 / 0.3664 / 0.3627), all 42 saturation-forced cells split
        9 at m=2 and 33 at m=3, both saturation closed forms, the C_red identity
        at m=2 and m=3, the variance law at all four sampled cells, the nine
        evaluable columns, the D-3 threshold row, and the 348k DL-table cost.
      required_repair: Correct the three entries.

    - id: RT-10
      severity: minor
      title: The stated prior for outcome (c) is a misreading of its own source
      finding: >-
        The contract and H-YIELD-001 present EV-STR-001's 17.5x to 4128.6x
        penalty as "a prior pointing toward outcome (c)", and H-YIELD-001 goes
        further with "it is the branch the existing evidence points toward".
        EV-STR-001's own finding reads "The AP penalty is supply-side, not
        per-tuple". A supply-side penalty is the designed consequence of
        restricting supports to arithmetic progressions - it is what the counting
        heuristic itself predicts for a restricted support class - and carries no
        information about whether the unconstrained heuristic overstates yield.
        The contract's own hedge, that the comparison is qualitative only and not
        a prediction for the cells tested here, is correct and should be the only
        statement made.
      required_repair: >-
        Delete the directional-prior claim from H-YIELD-001 falsification
        condition 1 and from the statement block; keep the hedge.

    - id: RT-11
      severity: minor
      title: RC-7 names no specialized baseline
      finding: >-
        Pollard rho and BSGS are correctly positioned and MEASURED. Missing is
        the closest specialized baseline for the stated regime - summation
        polynomial index calculus in the Semaev, Gaudry and Diem line, which has
        no known sub-sqrt(p) instantiation over PRIME fields, the published
        subexponential and sub-sqrt results living over extension and binary
        fields. Without that sentence a reader cannot see that the yield factor
        measured here is not the binding factor for the prime-field exponent -
        the decomposition-test cost is, and this contract deliberately excises it
        for instrument independence under DEC-20260727-009. That excision is the
        right call; its consequence for interpretation should be stated.
      required_repair: One paragraph in matched_baseline_position_RC7.

  adjudications_requested_by_the_card:
    can_S1_fail: >-
      YES. Forty-four evaluable cells must all land in [0.90, 1.10], nine columns
      must all show |slope| at most 0.05 with a 95 per cent interval containing
      zero, the calibration must return NOT-VOID, the null must be recovered, and
      no invalidation may fire. Nothing forces any of these. S1 is a real
      success criterion.
    can_F1_fire: >-
      YES, and the contract's own supporting claim is confirmed with a bound
      rather than left as an assertion. The contract says "nothing in the design
      bounds E from below". That is not literally true - G has prime order, so
      Cauchy-Davenport gives |S_m| >= min(N, mB - m + 1) - but the largest
      resulting floor over the 44 evaluable cells is E >= 0.1241 (m=2, k=12,
      beta=0.425, B=34), and below 0.02 at the largest cells. F1's 0.80 threshold
      sits far above every floor, so the negative outcome is genuinely reachable.
      One caveat the table never evaluates. A column with exactly three sizes has
      one residual degree of freedom, so the 95 per cent interval uses
      t = 12.71, and the interval-excludes-zero clause, not the 0.80 threshold,
      is F1's binding constraint. Worked example: E = 1.00 / 0.90 / 0.80 at
      k = 14/16/18 gives slope -0.0805, residual s = 0.00507, standard error
      0.00259, half-width 0.0329 - the interval excludes zero with about 2.4x of
      margin. Satisfiable, but the margin is about 2x, not the 19 sigma the
      table's framing suggests.
    can_F2_fire: >-
      NARROWLY, AND NOT IN THE SITUATION IT EXISTS FOR. See RT-3.
    is_the_null_right: >-
      YES IN THE MEAN, NO IN THE SPREAD. C_red is exactly correct - I verified
      the combinatorics independently at both arities and confirmed the identity
      C_all - C_red = B/2 at m=2, the count of cancelling pairs. The
      inclusion-exclusion for P_pred is correct, with |S_0| = 1 and |S_1| = B,
      and S_{m-2} is genuinely a subset of S_m. The mean is unaffected by the
      antipodal structure. The variance is understated by a factor of two - RT-4.
      One framing correction: the null value of E is 1 under an ASSUMED
      independence model, not "by construction". CTRL-NULL-SUMSET validates the
      ARITHMETIC of P_pred against genuinely independent draws; it cannot detect
      failure of the independence assumption itself. The control that can is
      CTRL-NULL-FB, whose random negation-closed factor base is the real
      empirical null. The contract uses it only as a destroy-parameter check and
      routes a surviving deviation to INV-5 as "an estimator or curve artifact" -
      a disjunction that omits the third possibility, that C_red or P_pred is
      mis-specified for sumsets generally, which is the reading the ledger's cost
      models would actually care about. Three draws is thin for that role.
    is_the_calibration_leg_a_real_test: >-
      YES, IT CAN FAIL - in one correct way and one spurious way. See RT-8. Its
      six target figures and three supply medians are quoted VERBATIM and
      correctly from ledger/EV-STR-001.yaml lines 15 and 16, its factor-2 window
      is genuinely discriminating against a wrong support set, and it is written
      as an INVALIDATION rule (INV-2, census numbers VOID rather than negative)
      and not as a falsification criterion. That much is right.
    is_the_EV_STR_001_penalty_carried_as_a_range: >-
      YES. VERIFIED AND MET. All three committed artifacts carry the full range
      17.5x to 4128.6x, state that it grows with n at fixed m and superlinearly
      in m at fixed n, and explicitly FORBID quoting 17.5x alone as
      characteristic. I confirmed both trend clauses arithmetically: 17.5 < 41.9
      < 87.8 and 214.9 < 924.5 < 4128.6 in n, and the m=3 to m=4 multiplier runs
      12.3, 22.1, 47.0. No instance of 17.5x standing alone appears anywhere in
      the three artifacts.
    is_the_A1_scope_admission_intact_in_the_specification_body: >-
      YES. The admission_and_ceiling block of the specification carries, in the
      body and not by reference, the exponent-deciding-screen statement, the
      express A1 non-targeting statement, the prohibition on any downstream
      record quoting it as target-class, the TOY claim-tier cap, the "can meet no
      completion criterion of GOAL-ECDLP-001 under any outcome" statement, the
      per-hypothesis no-status-change list, the "leaves all four asymptotic-claim
      promotion gates open" statement, and the infrastructure-is-never-negative-
      evidence rule. It is mirrored in H-YIELD-001 interpretation_limits and
      repeated in feasibility table section 11. Intact. The single contradiction
      of it is RT-7.
    is_the_AP_admissibility_predicate_resolvable: >-
      YES - the named execution risk is DISCHARGED at review, and ST-3 should not
      fire on it. The committed EXP-STR-001 contract fixes every degree of
      freedom: the factor base is "x-interval, first B liftable x >= 0, canonical
      y = min(y, p-y), ordered by x" (line 19); the support is
      {x, x+d, ..., x+(m-1)d} with d in D = 1..64 on x-COORDINATES and
      non-wrapping, which is settled by the negative control's closed form
      sum over d of max(0, p-(m-1)d) (line 38); canonical y means one point per
      x; D is positive only, so each support is counted once; and
      yield_penalty = C(B,m)/ap_supply is defined verbatim at line 53.
      I reconstructed ap_supply from that reading alone and obtained 26.3, 8.4,
      124.0, 40.7, 520, 172 against the record's medians 28, 8, 124, 40, 477,
      154 - four essentially exact and two within about 10 per cent. A predicate
      that reproduces the source record's own supplies to that accuracy from the
      committed text is resolvable. The Executor should record which reading and
      which B it used rather than stop.
    does_the_budget_carry_the_cells: >-
      YES, WITH ENORMOUS MARGIN, AND THE MARGIN IS WHERE IT MATTERS. Recomputed
      per cell: the ENTIRE criterion-evaluable set costs 9.3e5 modular additions
      with a largest single evaluable cell of 2.5e5, against 5400 seconds and
      8 GB. The DL tables cost 348,160 point additions across all four sizes,
      matching the contract. Peak memory is a 32,768-byte bit set plus a
      262k-entry DL table, well under 1 GB. The contract's 4.674e8 for the
      largest single cell and about 1.2e9 for all m=3 cells at k=18 both
      reproduce - but that cost lives ENTIRELY in the priority-3 saturated,
      observation-only cells. No criterion is at budget risk under any
      implementation, in any language. Two notes rather than objections: the
      table's "vectorised: seconds" presumes numpy, which the contract does not
      require, so a pure-Python driver would hit ST-2 in the priority-3 tier and
      produce a named gap in observations only, which is a declared acceptable
      outcome; and ST-1's 5e8 cap sits only 7 per cent above the largest cell's
      4.674e8 projection, so a measured B above about 1907 there trips the cap on
      a cell that is not criterion-evaluable.
    reduced_scope_core_if_any_cap_binds: >-
      The contract's declared core is already correct and needs no change - all
      criterion-evaluable cells at m=2 and m=3, both nulls at those cells, the
      calibration leg and the baselines. My cost re-derivation confirms that this
      core is under 10^6 modular additions and cannot bind. Amend only the count
      from 43 to 44.

  required_controls:
    - >-
      MANDATORY. Re-specify CTRL-NULL-SUMSET as an antipodal-pair process - draw
      g uniformly and insert both g and -g, C_red/2 times. This is the single
      cheapest discriminating control change in the package and it is the one
      that makes the contract's own "shape-matched" claim true. Confirmed
      analytically (mean unchanged, variance exactly doubled) and by a pure
      integer balls-in-bins probe.
    - >-
      MANDATORY. Report E_max = min(C_all, N)/P_pred per cell beside R_max, and
      report the Cauchy-Davenport floor min(N, mB - m + 1)/P_pred, so that both
      edges of the band are visible as reachable or not before any number is
      interpreted.
    - >-
      MANDATORY. Raise CTRL-CALIB-AP seeds at (n=211, m=3) and (n=211, m=4) from
      6 to at least 24, or pin the exact curves, so that INV-2 cannot void a
      valid census on small-count sampling noise.
    - >-
      STRONGLY RECOMMENDED. Route the AP leg's supply count through the same
      distinct-count and membership routine the census uses, converting INV-2
      from an unrelated known-answer test into a genuine shared-code-path test.
      If that is not done, downgrade INV-2 so it cannot void census data.
    - >-
      STRONGLY RECOMMENDED. Raise CTRL-NULL-FB from 3 draws to at least 10 at the
      small-B evaluable cells, and promote its output E_randomFB to a reported
      empirical null, so that a deviation reproduced under randomisation while
      CTRL-NULL-SUMSET passes is routed to an explicit third disposition -
      C_red or P_pred mis-specification - rather than to INV-5's "estimator or
      curve artifact".
    - >-
      RECOMMENDED. Report the OLS residual degrees of freedom and the t
      multiplier per column, so no reader mistakes a 1-df interval for the
      table's 19-sigma framing.

  counterexample_or_mutation: >-
    The cheapest single mutation that would expose the null's deviation from the
    random model, and it costs no curve arithmetic at all - run the occupancy
    Monte Carlo twice at one small cell, once with C_red independent uniform
    draws and once with C_red/2 antipodal pairs, and compare the empirical
    standard deviations. If the second is about 1.41x the first, the frozen
    control is mis-shaped exactly as derived. At N = 4099, C = 568, 4000
    replicates, this returns 1.040 per cent against 1.523 per cent, variance
    ratio 2.14, with means 530.6 and 530.4 against the analytic 530.4. That probe
    was run outside the repository in this session, is NOT archived, and is NOT
    evidence - it only confirms an inequality derived on paper beforehand, and it
    must be re-run inside the driver and archived before any use.

  baseline_comparison: >-
    Recomputed at k=18 with N about 262144 and sqrt(N) = 512. Pollard rho with
    negation: 0.886 * 512 = 453.6 group operations at O(1) memory - correct, and
    MEASURED over 16 targets per size with a re-verified discrete-log certificate
    per solve, which is stronger than most contracts in this ledger. BSGS:
    2 * 512 = 1024 operations at 512 stored elements - correct, and also
    measured. The census costs at least N = 262144 group-equivalent operations
    for the DL table alone, hence at least 578x a matched rho, rising to about
    1.0e6x at the largest cell, so the contract's "order 10^2 to 10^6" is right
    and the standing control that a ratio below 1 is an accounting red flag
    rather than an attack is correctly placed. THE CENSUS IS NOT AND CANNOT BE AN
    ATTACK. The gap is RT-11 - no specialized baseline is named, so a reader
    cannot see that the yield factor measured here is not the binding factor for
    the prime-field exponent.

  heuristic_challenges:
    - >-
      HEUR-1 is explicit, numbered, formally stated, given a rigorous bound (the
      multiset counting bound, which I re-derived and confirm) plus a classical
      distribution theorem (balls-in-bins), and paired with a falsification
      condition and a validation arm. That structure meets the target-result
      profile. The transfer of the random model to the structured object is where
      it fails: S_m is negation-symmetric, so the balls are antipodal pairs, not
      independent throws. Mean survives, variance does not. RT-4.
    - >-
      HEUR-1's o(1) is asserted uniform over beta in the unsaturated band and
      over the tested sizes, but nothing in the design measures uniformity in
      beta - the trend criteria run in p at fixed beta only. A beta-direction
      trend in E would be invisible to every criterion while being exactly the
      signature of an interval-structure effect. Cheap fix: report the slope of
      log E in beta at fixed (k, m) as an observation.
    - >-
      HEUR-2 (curve genericity at toy scale) rests on one curve per field size
      and is honestly declared a weakness rather than a strength. Its
      falsification condition routes a surviving deviation to "estimator or curve
      artifact", which as noted conflates the curve with the estimator and with a
      mis-specified C_red.
    - >-
      HEUR-3 is correctly recorded as NOT LOAD-BEARING and NOT VALIDATABLE here,
      with the reason given (no summation polynomial is computed and no Lang-Weil
      main term is invoked). Carrying it explicitly so that no reader imports a
      Lang-Weil-conditional statement is the right handling and I have no
      objection to it.
    - >-
      SCALE HONESTY. The contract states its own toy ceiling correctly and
      repeatedly, declares no correspondence or transport to reach scale, and
      says explicitly that the only scale-free content is the D-1 and D-3
      algebra. That is the honest position. It should be read together with RT-7:
      the scale-free content is elementary and settles a malformed criterion, not
      an exponent.

  cost_model_challenges:
    - >-
      Per-attempt versus total expected cost does not arise - this contract runs
      no attack and computes no success probability against a per-attempt cost.
      The relevant discipline here is the census-operations to rho-operations
      ratio, which IS reported per instance and IS the right standing control.
    - >-
      Memory is stated beside time throughout, including BSGS memory beside BSGS
      time. Correct.
    - >-
      The unstated dependency is vectorisation - the "seconds" claim presumes
      numpy and the contract does not require it. Consequence is confined to
      priority-3 observations. See the budget adjudication.
    - >-
      ST-1's 5e8 cap sits 7 per cent above the largest projected cell. That is a
      thin margin on a projection computed with B = L, and it should be stated as
      such.

  reduction_and_scope_challenges:
    - >-
      NO REDUCTION IS CLAIMED, and reduction_chain.core_problem is explicitly
      null with a note explaining why it is null rather than blank. Correct and
      commendable - there is no cited theorem to instantiate and no corollary
      cascade to audit.
    - >-
      SCOPE INFLATION, ONE INSTANCE. RT-7. The affected-versus-safe framing is
      otherwise not inflated: the contract lists the six hypotheses it does not
      touch, names DEFER-BATCH009-001's still-binding replication obligation,
      declares both of IDEA-20260727-006's headline claims unadjudicated, and
      states that it can meet no completion criterion of the goal under any
      outcome. That is unusually disciplined scope writing.
    - >-
      SCOPE OF THE COUNTING BOUND, BOTH DIRECTIONS. The bound covers MORE than
      the declared "fixed-factor-base, fixed-arity, unweighted decomposition
      shape" - it needs no curve, no interval and no prime order, holding for any
      finite subset of any abelian group - so the declared scope is conservative
      in the safe direction. The consequence claim covers LESS than advertised in
      one respect: R bounds distinct coverage, not decomposition multiplicity,
      and index calculus in its operating regime is priced on multiplicity.
      H-YIELD-001 excludes multiplicity correctly; REMOVED-1 and the receipt drop
      the qualifier.

  narrowest_supported_statement: >-
    On the committed artifacts alone, and with no run in existence: the multiset
    counting bound |S_m| <= C(B+m-1, m), hence
    R <= (p/N) * prod_{j<m} (1 + j/B), is correct, elementary, scale-free and
    independently re-derived here; it establishes that IDEA-20260727-006's
    falsification condition 1 was malformed at birth, and it excludes
    R > 2.0 at every criterion-evaluable cell of this design and, in its
    composite three-size form, anywhere in it. It does not close an exponent
    question, it bounds coverage rather than multiplicity, and the design-wide
    ceiling figure 1.7338 is conditional on B = L. EXP-YIELD-001 as frozen can
    produce a decision under S1 and under F1, cannot classify a uniform
    p-independent shortfall under any criterion, understates its own null spread
    by a factor sqrt(2), enumerates 43 evaluable cells where its own predicate
    gives 44, and is carried comfortably by its budget. Nothing here is a
    cryptanalytic result, nothing here is evidence about any hypothesis, and
    nothing measured or derived here bears on cryptographic-size curves in either
    direction.

  next_concrete_action: >-
    Coordinator opens the single RC-11 protocol_amendment cycle as
    EXP-YIELD-001 version 2, carrying exactly the four blocking repairs RT-1
    through RT-4 - correct the evaluable count to 44 and add the m=3,
    beta=0.375, k=12 cell; declare the measured-B predicate authoritative over
    the enumeration; delete "and no consistent sign" from F2; and re-specify
    CTRL-NULL-SUMSET as an antipodal-pair process with the sigma figures
    restated - plus the seven material and minor repairs RT-5 through RT-11 as
    text and reporting changes. Snapshot-commit version 2 and send it to one
    independent non-originating re-review before any Executor run is authorized.
    All eleven repairs are pre-execution, textual or one-line, and none requires
    new derivation beyond what is shown in feasibility_check.md.

