control_matrix:
  id: CM-IT-001-RC36-REPAIR-2
  task_id: TASK-20260802-242
  amendment_id: PA-IT-001-v3-rc36-repair-2
  frozen: true
  execution_authorized: false
  rows:
    - id: CTRL-ANOMALOUS-TRACE1-POS
      role: positive_cost_and_detector
      input: deterministic first trace-1 fixture in the frozen 20-bit search
      required_measurements:
        - p_j_curve_coefficients_exact_cardinality_and_trace
        - detector_booleans
        - P_Q_d_and_d_rec
        - SMART_LIFT_v1_ledger
        - anomalous_cost_sensitivity_rows
      expected: >-
        #E=p, trace=1, anomalous detector true, d_rec=d, wrapper pass, and
        multiplier-1 R_control<0.7.
      failure: harness_void_not_hypothesis_evidence
      closes: [repair_1_wrong_family, repair_1_model_inversion]

    - id: CTRL-ISOGENY-PULLBACK-NONSPECIAL-POS
      role: positive_transfer_mechanics
      input: first deterministic detector-negative degree-2 fixture at p=2097169
      required_measurements:
        - E0_E1_j_and_detector_booleans
        - kernel_and_phi_dual_phi_coefficients
        - P_Q_P1_Q1_Pback_Qback
        - BSGS_d_rec
        - map_and_scalar_identity_booleans
        - certificate_sha256
      expected: >-
        E0 and E1 detector-negative, j(E0)!=j(E1), phi and dual_phi actually
        evaluated, dual_phi(phi(P))=[2]P, dual_phi(phi(Q))=[2]Q, and d_rec=d.
      forbidden_substitute: direct same-curve DLP certificate without map evaluations
      failure: harness_void_not_hypothesis_evidence
      closes: [repair_2_direct_solve, repair_2_special_endpoint, repair_2_return_to_start]

    - id: CTRL-NULL-GATE-LIVE-SYNTHETIC
      role: positive_control_for_rejection
      input: >-
        Valid transfer certificate with synthetic C_path_reported=floor(0.5*matched_rho)
        and the same undercharge on NULL-IT-ISOGENY-TRANSFER-v2.
      required_measurements:
        - R_xfer_synthetic
        - R_null_synthetic
        - null_gate_pass
        - claim_accepted
        - rejection_reason
      expected: >-
        R_xfer_synthetic<0.7, R_null_synthetic<0.95, null_gate_pass=false,
        claim_accepted=false.
      failure: harness_void_if_skipped_null_or_accepted
      closes: [repair_3_null_gate_never_live]

    - id: CTRL-NULL-IT-PLANT
      role: packaging_plant
      input: honest genuine-transfer search and chosen-path ledgers
      required_measurements:
        - raw_search_edge_ledger_nonempty
        - raw_chosen_path_edge_ledger_nonempty
        - C_search_recomputed
        - C_eval_recomputed
        - C_path_recomputed
        - C_path_reported
        - plant_detected
      expected: >-
        Independent edge-level recomputation gives C_path_recomputed>0;
        C_path_reported=floor(C_path_recomputed/4); plant_detected=true.
      failure: harness_void
      closes: [repair_3_empty_edge_ledger, repair_3_echoed_search_counter]

    - id: CTRL-MATCHED-RHO-HONEST
      role: measured_baseline
      input: first frozen 20-bit unplanted cell
      required_measurements:
        - recovered_scalar_and_wrapper_certificate
        - measured_group_ops
        - measured_peak_bytes
        - modeled_matched_rho
        - ratio
      expected: certificate pass and measured_ops/matched_rho in [0.70, 1.30]
      failure: baseline_calibration_failure_not_transfer_evidence
      closes: [prior_proxy_rho_calibration]

    - id: CTRL-MATCHED-BSGS
      role: measured_baseline
      input: same first frozen 20-bit unplanted cell
      required_measurements:
        - recovered_scalar_and_wrapper_certificate
        - measured_group_ops
        - baby_table_entries_and_bytes
      expected: certificate pass with complete time and memory ledger
      failure: baseline_calibration_failure_not_transfer_evidence

    - id: CTRL-EXIT-MAP-CONSISTENCY
      role: structural_consistency
      input: every path certificate
      required_measurements: [source_j, target_j, map_degree, self_map_boolean]
      expected: no algebraic self-map is counted as a transfer edge
      failure: affected_path_invalid

    - id: DENSITY-SELECTION-WITNESS
      role: density_design_positive
      input: three selected primes in each bit stratum 20_21_22
      required_measurements:
        - selected_prime_list
        - exact_trace1_witness_per_prime
        - sample_count_2048_per_prime
        - sample_hash_per_prime
        - primary_estimands_and_intervals
      expected: >-
        Nine exact trace-1 witnesses, nine complete samples, pointwise exact 95%
        intervals, and Bonferroni simultaneous 95% intervals.
      failure: invalid_density_design_not_zero_density
      closes: [repair_5_smallest_prime_exclusion, repair_5_missing_CI_and_multiplicity]

  global_gates:
    before_path_search:
      - verified pre-run source and contract snapshot
      - density-freeze.json fsynced and hashed
      - all four positive/rejection controls have required outcomes
    after_path_search:
      - all raw ledgers and certificates hash-bound in manifest
      - every result row has dominated_by and quantitative sota_delta
      - all unexpected observations retained
    any_failure: >-
      Mark the future package invalid or failed_infrastructure as applicable;
      make no mathematical inference and do not rerun with changed parameters.

  falsification:
    F1: >-
      At least two real unplanted certificate-bearing R_xfer<0.7 cells whose
      non-synthetic null gates pass. Synthetic rows never count.
    F2: any required positive/rejection control misses its frozen outcome; harness void
    F3: exact v3 HEUR-ISO-1 trigger, only with the v3 minimum sample preconditions

  pareto:
    dominated_by: not_applicable
    non_solver_scope: >-
      Pre-run control specification; it contains predictions and no observed
      solver point.
    sota_delta:
      time: {exponent_delta: 0.0, achieved_group_ops_delta: 0}
      memory: {exponent_delta: 0.0, achieved_bytes_delta: 0}
      data_or_query: {exponent_delta: 0.0, achieved_query_delta: 0}
