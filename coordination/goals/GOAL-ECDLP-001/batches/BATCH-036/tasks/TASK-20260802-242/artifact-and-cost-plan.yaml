artifact_and_cost_plan:
  id: ACP-IT-001-RC36-REPAIR-2
  task_id: TASK-20260802-242
  amendment_id: PA-IT-001-v3-rc36-repair-2
  design_only: true
  implementation_or_run_performed: false

  declared_future_sources:
    - experiments/EXP-IT-001/implementation/rc36/run_rc36_repair_2.py
    - experiments/EXP-IT-001/implementation/rc36/fixture.py
    - experiments/EXP-IT-001/implementation/rc36/density.py
    - experiments/EXP-IT-001/implementation/rc36/controls.py
  undeclared_repository_imports_allowed: false
  generated_code_allowed: false

  pre_run_snapshot:
    required: true
    paths:
      - experiments/EXP-IT-001/specification.v3.yaml
      - experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc27-b5-b8.yaml
      - experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc30-repair-1-to-7.yaml
      - experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc36-repair-2.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-036/tasks/TASK-20260802-242/control-matrix.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-036/tasks/TASK-20260802-242/artifact-and-cost-plan.yaml
      - experiments/EXP-IT-001/implementation/rc36/run_rc36_repair_2.py
      - experiments/EXP-IT-001/implementation/rc36/fixture.py
      - experiments/EXP-IT-001/implementation/rc36/density.py
      - experiments/EXP-IT-001/implementation/rc36/controls.py
      - experiments/EXP-IT-001/implementation/rc36/pre-run-contract-manifest.json
    manifest_fields: [path, sha256, byte_count, git_blob_id]
    verification:
      - commit reachable from HEAD
      - expected parent matches
      - changed paths equal declared paths plus receipt
      - every path hash matches
      - exact future command hash matches
      - source import audit has no undeclared repository module
    failure_effect: execution_forbidden

  future_run:
    id: RUN-IT-001-rc36-repair-2
    exact_command: >-
      sage -python experiments/EXP-IT-001/implementation/rc36/run_rc36_repair_2.py
      --contract experiments/EXP-IT-001/specification.v3.yaml
      --amendment experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc36-repair-2.yaml
      --run-id RUN-IT-001-rc36-repair-2
      --output experiments/EXP-IT-001/runs/RUN-IT-001-rc36-repair-2
    root: experiments/EXP-IT-001/runs/RUN-IT-001-rc36-repair-2
    files:
      - command.txt
      - environment.json
      - manifest.json
      - stdout.log
      - stderr.log
      - raw-result.json
      - density-freeze.json
      - density-samples.jsonl
      - control-results.json
      - transfer-certificate.json
      - raw-search-edge-ledger.jsonl
      - raw-chosen-path-edge-ledger.jsonl
      - pareto-table.json
      - cost-table.json
      - unexpected-observations.json
      - execution-report.yaml
    future_execution_report: >-
      experiments/EXP-IT-001/runs/RUN-IT-001-rc36-repair-2/execution-report.yaml
    immutable_manifest_fields:
      - exact command and exit code
      - git commit and dirty state
      - pre-run snapshot commit and parent
      - source and contract hashes
      - environment and dependency versions
      - every deterministic seed
      - requested policy resolved model and reasoning effort
      - wall CPU peak RSS and disk measurements
      - every artifact path SHA256 and byte count
      - validity status reason deviations and unexpected observations

  budgets:
    task_242:
      wall_clock_seconds: 3600
      memory_gb: 4
      maximum_runs: 1
      experiment_runs: 0
    future_run:
      wall_clock_seconds: 7200
      cpu_hours: 8
      memory_gb: 16
      disk_mib: 768
      maximum_runs: 1
      point_count_queries: 3000000
      directed_neighbor_edge_queries: 2000000
    budget_breach: >-
      Stop, persist partial artifacts, and label failed_infrastructure. No
      scientific criterion is evaluated and no changed-parameter rerun occurs.

  cost_ledger:
    unit: group_op_equivalent
    matched_rho: 0.886*sqrt(N_star)
    matched_BSGS: 2*ceil(sqrt(N_star))
    C_path: C_search+C_eval
    C_search: one unit per directed neighbor edge expanded
    C_eval: sum(4*ell) over chosen path edges
    C_special_MOV_binding: ceil(0.886*sqrt(p**k))
    C_special_MOV_audit: pairing_eval_ops+2*ceil(sqrt(N_star))
    C_special_anomalous_control: ceil(log2(N_star))
    C_pullback: ceil(log2(N_star))*deg_composite
    deterministic_ratio: (C_path+C_special+C_pullback)/matched_rho
    expected_total: >-
      C_special_set_construction_amortized + per_attempt_cost/p_success +
      C_special + C_pullback
    zero_success_rule: expected_total=positive_infinity_and_no_expected_cost_comparison

  memory_accounting:
    required_fields:
      - BFS_queue_peak_entries_and_bytes
      - visited_map_peak_entries_and_bytes
      - density_sample_entries_and_bytes
      - certificate_bytes
      - total_algorithmic_peak_bytes
      - process_peak_rss_bytes
      - baseline_state_bytes
    reconciliation: >-
      Report algorithmic total separately from process RSS and explain any RSS
      excess. MITM tables must be zero and labeled forbidden.

  data_and_query_accounting:
    required_fields:
      - candidate_primes_tested
      - j_candidates_counted
      - retained_curve_samples
      - detector_queries
      - directed_neighbor_edge_queries
      - isogeny_map_evaluations
      - rho_group_operations
      - BSGS_table_entries_and_lookups
    hidden_queries_allowed: false

  pareto_output_rule:
    every_row_required: true
    dominated_by_values: [pollard_rho, BSGS, neither, not_applicable]
    not_applicable_on_solver_row_allowed: false
    sota_delta_required:
      time: [absolute_group_ops, ratio_vs_rho, exponent_delta]
      memory: [peak_bytes, ratio_vs_rho_state_bytes, exponent_delta]
      data_or_query: [curve_samples, edge_queries, ratio_vs_rho_queries, exponent_delta]
    censored_rule: >-
      Use dominated_by=neither and name the unresolved component; never omit or
      set null.

  stopping_and_retention:
    - freeze density before path search
    - stop invalid before path search on any failed fixture or control
    - stop each BFS at v3 hops_max or 200000 directed edges
    - retain every partial ledger on stop or error
    - never overwrite an existing run root
    - never retry with a different seed prime sample size threshold or formula

  current_artifact_set:
    exact_count: 5
    paths:
      - experiments/EXP-IT-001/amendments/PA-IT-001-v3-rc36-repair-2.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-036/tasks/TASK-20260802-242/amendment-rationale.md
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-036/tasks/TASK-20260802-242/control-matrix.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-036/tasks/TASK-20260802-242/artifact-and-cost-plan.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-036/tasks/TASK-20260802-242/provenance.yaml

  pareto:
    dominated_by: not_applicable
    non_solver_scope: >-
      Artifact and cost plan for a future experiment; no solver result or
      achieved resource reduction is reported.
    sota_delta:
      time: {exponent_delta: 0.0, achieved_group_ops_delta: 0}
      memory: {exponent_delta: 0.0, achieved_bytes_delta: 0}
      data_or_query: {exponent_delta: 0.0, achieved_query_delta: 0}
