  independent_parameter_map:
    notation:
      N: prime subgroup order
      B: N^(1/5), suppressing integral rounding and polylogarithmic factors
      m: B^2 = N^(2/5), the size of each source-labelled pair deck
      q: B = N^(1/5), the number of target shifts
    five_list_reduction:
      statement: >-
        For a five-list equality X1[i1]+X2[i2]+X3[i3]+X4[i4]+X5[i5]=Q,
        form D12={(X1[i1]+X2[i2],i1,i2)} and
        D34={(X3[i3]+X4[i4],i3,i4)}. For each i5 query
        y_i5=Q-X5[i5] and seek d12+d34=y_i5. Fixed sign choices can be
        absorbed by negating the affected lists without changing cardinalities.
      deck_cardinalities: "|D12|=|D34|=B^2=m=N^(2/5)"
      target_count: "B=N^(1/5)"
      source_labels: >-
        Four base-list indices plus the shift index require only O(log N) bits
        per returned occurrence, but a compressed selector must still preserve
        occurrence identity. Value equality alone is not source replay.
      boundary: >-
        This is a size and equality map only. It does not establish an exact
        integer-to-EC source transfer, a structure-sensitive selector, or a DLP
        relation-success law; those are outside J3 or absent from the blind input.
    exponent_rules:
      one_m_power: "m^a = N^(2a/5)"
      B_queries_of_m_power: "B*m^a = N^((1+2a)/5)"
      B3_materialization: "B^3 = N^(3/5)"
      B5_candidate_count: "B^5 = N"

  metric_recomputations:
    - id: J3-MAP-1
      quantity: pair_deck_and_query_map
      recomputation: "B=N^(1/5); m=B^2=N^(2/5); q=B=N^(1/5)"
      status: verified
    - id: J3-MAP-2
      quantity: prior_3sum_indexing_tradeoff
      source_statement: "T*S^3=m^6 up to polylogarithmic factors"
      parameterization: "S=m^sigma; T=m^(6-3*sigma)"
      N_space_exponent: "s_N=2*sigma/5"
      N_one_query_exponent: "t_N=(12-6*sigma)/5"
      N_all_B_queries_exponent: "w_N=(13-6*sigma)/5"
      strict_subhalf_conditions:
        space: "sigma<5/4"
        all_B_queries: "sigma>7/4"
        intersection: empty
      status: verified_as_conditional_query_space_translation
      limitation: >-
        No preprocessing bound for this prior realization was supplied in the
        blind statement. It cannot be set to zero. Even before preprocessing,
        no value of sigma makes both space and all-B-query exponents strictly
        below 1/2.
    - id: J3-MAP-3
      quantity: dinur_golovnev_tradeoff
      source_statement: "S=m^(5/2-delta), T=m^delta, 0<=delta<=1; preprocessing is O_tilde(m^2)"
      N_preprocessing_exponent: "p_N=4/5"
      N_space_exponent: "s_N=1-(2*delta)/5"
      N_one_query_exponent: "t_N=(2*delta)/5"
      N_all_B_queries_exponent: "w_N=(1+2*delta)/5"
      strict_improvement_window:
        m_space_window: "m^(3/2) << S << m^(7/4)"
        delta_window: "3/4 < delta < 1"
        N_space_window: "3/5 < s_N < 7/10"
        N_one_query_window: "3/10 < t_N < 2/5"
        N_all_B_queries_window: "1/2 < w_N < 3/5"
      endpoints:
        delta_3_over_4: "(p_N,s_N,t_N,w_N)=(4/5,7/10,3/10,1/2)"
        delta_1: "(p_N,s_N,t_N,w_N)=(4/5,3/5,2/5,3/5)"
      status: verified_as_conditional_source_realization
      consequence: >-
        Every point charges N^(4/5) preprocessing. In the strict improvement
        window, both space and all-B-query work exceed the strict 1/2 gate;
        the boundary at delta=3/4 only ties 1/2 for query work and still uses
        N^(7/10) space and N^(4/5) setup.
    - id: J3-MAP-4
      quantity: preprocessed_unknown_universe_3sum
      source_statement: >-
        For epsilon in [0,1/2], P=O_tilde(m^2),
        S=O_tilde(m^(2-2*epsilon/3)), and one subset query with a C-prime
        set of O(m) elements costs O_tilde(m^(3/2+epsilon)) with high probability.
      N_preprocessing_exponent: "p_N=4/5"
      N_space_exponent: "s_N=4/5-(4*epsilon)/15, hence 2/3<=s_N<=4/5"
      N_one_theorem_query_exponent: "t_N=3/5+(2*epsilon)/5, hence 3/5<=t_N<=4/5"
      N_B_separate_queries_exponent: "w_N=4/5+(2*epsilon)/5, hence 4/5<=w_N<=1"
      batched_shift_case: >-
        Because B=m^(1/2)<=m, a hypothetical exact reduction could place all
        B shifts in one allowed C-prime set. That avoids multiplying by B, but
        the one-query exponent remains at least 3/5, while setup is 4/5 and
        space is at least 2/3.
      semantic_boundary: >-
        The theorem answers subset queries A-prime subset A, B-prime subset B,
        and C-prime of size O(m), against an oblivious adversary. It is not the
        same interface as an EC occurrence locator with exact source replay;
        its high-probability correctness cannot be imported as DLP success.
      status: verified_as_conditional_cost_translation_only
    - id: J3-MAP-5
      quantity: generic_dlp_preprocessing
      source_statement: >-
        Generic prime-order DLP preprocessing obeys
        S*T^2=Omega_tilde(epsilon*N) and
        P*T+T^2=Omega(epsilon*N); the known upper bound has P approximately S*T.
      exponent_form_for_epsilon_N_minus_gamma:
        advice_online: "s+2t >= 1-gamma"
        preprocessing_online: "max(p+t,2t) >= 1-gamma"
      constant_success_balanced_point:
        advice_exponent: 1/3
        online_exponent: 1/3
        preprocessing_exponent: 2/3
      status: verified_with_model_scope
      consequence: >-
        At constant success, strictly sub-1/2 preprocessing and online
        exponents cannot coexist in the generic model: p<1/2 and t<1/2 imply
        both p+t<1 and 2t<1. The balanced N^(1/3) advice/online point is not a
        single-target N^(1/3) total-time attack because its preprocessing is
        N^(2/3).

  charged_cost_ledger:
    units: asymptotic group_or_word_operations_and_words_with_polylogs_suppressed
    setup:
      pair_deck_presentation: >-
        Explicitly presenting two length-m source arrays costs at least
        N^(2/5) entries and work; an implicit EC representation could differ,
        but its setup cost is unspecified and therefore not zero.
      dinur_golovnev_published_realization: N^(4/5)
      unknown_universe_published_realization: N^(4/5)
      generic_dlp_balanced_realization: N^(2/3)
    persistent_space_or_advice:
      dinur_golovnev_strict_improvement_window: "N^s with 3/5<s<7/10"
      unknown_universe: "N^s with 2/3<=s<=4/5"
      generic_dlp_balanced: N^(1/3)
    target_shift_construction: N^(1/5)
    total_query_work:
      dinur_golovnev_strict_improvement_window: "N^w with 1/2<w<3/5"
      unknown_universe_one_batched_query_best_case: "at least N^(3/5)"
      unknown_universe_B_separate_queries: "N^w with 4/5<=w<=1"
    output:
      exact_source_3sum_indexing: >-
        The retrieved two-array 3SUM-indexing source returns one index pair or
        bottom per query, so at most B returned pairs cost N^(1/5+o(1)) to
        write. This bound transfers only if EC occurrences remain source-labelled.
      proposed_ec_selector: >-
        No candidate-output count or collision multiplicity bound is in the
        blind packet. For Z=N^z returned candidates and per-candidate replay
        N^r, output plus replay contributes N^(z+r); z and r are unknown.
    replay:
      conditional_direct_labels: >-
        Four pair-deck source indices and the fifth shift index can be replayed
        in N^o(1) per candidate if they are actually retained.
      realized_selector: unknown
    verification:
      conditional_single_candidate: >-
        Once a nondegenerate scalar relation is explicitly supplied, a constant
        number of group operations and modular operations is N^o(1).
      aggregate: >-
        Candidate multiplicity and the probability of obtaining a
        nondegenerate relation are unspecified, so aggregate verification is unknown.
    forbidden_materialization_control:
      cost: "B^3=N^(3/5) before output, replay, verification, or retries"
      consequence: fails_strict_subhalf_gate

  achieved_success_and_retry_semantics:
    event_chain:
      events:
        R: a usable five-list relation is present
        L: the locator returns the correct source-labelled occurrence conditional on R
        D: replay yields a nondegenerate scalar relation conditional on R and L
        V: verification accepts the correct scalar conditional on R, L, and D
      achieved_probability: "Pr[R]*Pr[L|R]*Pr[D|R,L]*Pr[V|R,L,D]"
      observed_inputs: >-
        The blind packet gives no achieved lower bound for any factor. Retrieved
        data-structure correctness is conditional on a valid query having a
        source-model pair; it does not supply Pr[R], EC transfer, or DLP replay.
    B5_expectation_boundary: >-
      B^5=N candidate tuples suggests expected count one only under an
      unstated uniform model. An expectation, and a fortiori a union-bound
      ceiling, is not a lower bound on Pr[R]. A second-moment, anti-clustering,
      or exact distribution argument is required for achieved success.
    sign_invariance_control: >-
      If a complete selector transcript is invariant under u -> -u, then the
      marked instances (u,v,q=u+v) and (-u,v,q) produce the same transcript,
      while the second equality would require 2u=0. Under the packet's
      2u!=0 condition they need different locator answers. Without an oriented
      separator, locator completeness and therefore achieved success are not established.
    geometric_retry_rule:
      valid_only_if: >-
        Each attempt has a proved lower bound p>0 on achieved end-to-end
        success and attempts are independent or have a proved conditional
        success lower bound after the full setup/query/replay/verification history.
      expected_attempts: 1/p
      attempts_for_failure_at_most_delta_fail: "ceil(log(delta_fail)/log(1-p))"
      asymptotic_if_p_is_N_minus_gamma: "N^(gamma+o(1)) attempts"
      rebuild_each_attempt_total_exponent: "max(p_setup,w_query,z_plus_replay,v_verify)+gamma"
      reusable_setup_total_exponent: "max(p_setup,max(w_query,z_plus_replay,v_verify)+gamma)"
      current_status: unjustified
      reason: >-
        No achieved p or retry nesting is stated. Re-running a deterministic
        query schedule against the same table repeats the same event; an upper
        bound on success cannot be inverted into expected retries.

  parallelism:
    B_query_parallel_formula: >-
      With K=N^pi processors and no intra-query parallel algorithm, ideal
      wall time for B independent queries of per-query exponent t is
      N^(t+max(1/5-pi,0)); total work remains N^(t+1/5). For pi>1/5 there are
      no more than B query-level jobs, so the source theorem alone gives no
      further reduction.
    retry_parallel_formula: >-
      If and only if independent retries with p=N^(-gamma) exist, N^pi workers
      can reduce ideal retry wall-clock exponent by at most min(pi,gamma),
      while total work retains the +gamma exponent.
    charged_axes: >-
      Processor count, aggregate worker memory, communication, and any table
      replication remain charged. Parallel wall time without those axes is
      not a Pareto point. The N^(4/5) published setup terms remain unchanged.
    realized_status: unknown_no_parallel_algorithm_or_resource_ledger_supplied

  multi_target_amortization:
    general_formula: >-
      For M=N^mu targets sharing P=N^p setup and W=N^w online work per target,
      total work is N^max(p,mu+w) and amortized work per target has exponent
      max(max(p-mu,0),w). Persistent advice N^s remains physically allocated
      and the M-target data axis must be reported.
    dinur_golovnev: >-
      Amortizing N^(4/5) setup needs mu>3/10 merely to make its per-target
      share strictly below N^(1/2). In the strict improvement window the
      B-query exponent itself is already greater than 1/2, and space is at
      least N^(3/5), so amortization does not make an all-axis subhalf point.
    unknown_universe: >-
      The best one-query exponent is at least 3/5, so setup amortization cannot
      make the online axis subhalf.
    generic_dlp_balanced: >-
      N^(2/3) preprocessing amortizes below N^(1/2) only after mu>1/6, with
      N^(1/3) advice and online work. This is a generic multi-target advice
      regime, not a realized single-target EC-specific selector or speedup.
    realized_status: conditional_only_no_multi_target_claim_supported

  baseline_and_pareto_comparison:
    axes:
      - setup_time
      - persistent_space_or_advice
      - single_target_total_work
      - wall_clock_with_processor_count
      - output
      - replay
      - verification
      - achieved_success
      - targets_or_queries
    pollard_rho:
      supplied_reference_time_exponent: 1/2
      retrieved_primary_source_check: >-
        Pollard's 1978 abstract states O(p^(1/2)) operations and avoidance of
        stored tables. The packet independently freezes 1/2 as the reference.
      setup_exponent: 0
      persistent_space_exponent: 0
      boundary: constant-success and polylogarithmic details are suppressed
    baby_step_giant_step:
      independent_derivation: >-
        Store N^a baby steps and scan N^(1-a) giant steps. Time exponent is
        max(a,1-a), minimized at a=1/2; space exponent is a=1/2.
      balanced_point: "time=N^(1/2), space=N^(1/2)"
      comparison: >-
        It ties, rather than strictly improves, the rho time exponent and uses
        more memory. Its deterministic-coverage property should be kept as a
        success-axis distinction, not converted into a time speedup.
    naive_pair_deck_scan:
      setup_and_space: N^(2/5)
      all_B_query_work: N^(3/5)
      comparison: dominated_by_rho_on_single_target_time_and_space_exponents
    dinur_golovnev_published_realization:
      single_target_total_time_exponent: 4/5
      space_lower_endpoint_exponent: 3/5
      comparison: dominated_by_rho_for_the_fully_charged_single_target_realization
    unknown_universe_published_realization:
      single_target_total_time_exponent_at_least: 4/5
      space_exponent_at_least: 2/3
      comparison: dominated_by_rho_for_the_fully_charged_single_target_realization
    generic_dlp_balanced_preprocessing:
      single_target_total_time_exponent: 2/3
      advice_exponent: 1/3
      online_exponent: 1/3
      comparison: dominated_by_rho_for_single_target_total_time_and_space
    realized_B63_point:
      exists: false
      reason: >-
        Conditional query exponents with omitted setup, output, replay,
        verification, or achieved-success/retry axes are not points. No
        concrete selector costs or achieved success are in the blind input.
    dominated_by: Pollard rho for every fully charged published single-target realization evaluated here
    sota_delta:
      realized_single_target_time_delta_vs_rho: 0
      realized_memory_delta: none
      conditional_query_only_delta: not_a_realized_point
      multi_target_delta: workload_changed_and_unrealized

