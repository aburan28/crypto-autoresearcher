            "countermodel": "Let one U bucket keyed by a sign-invariant K contain source-labelled occurrences u and -u, let V contain v, and query q=u+v. Emit both source tuples from the bucket. Replay accepts u+v=q and rejects (-u)+v=q. The final algorithm is sound and complete for this witness, and the sign ambiguity costs two emitted candidates rather than proving impossibility.",
            "logical_dichotomy": "If source-labelled candidate records and replay reads are part of the claimed complete transcript, the two transcripts are not identical. If they are excluded, the transcript is not complete for the frozen locator/replay interface. Conditioned-randomness does not repair this gap because a randomized decoder may also emit both candidates before replay.",
            "impact": "The exact scoped result in IDEA-20260823-9696cd, locator-replay-and-verifier.yaml, proof-search-map.yaml, and disposition-report.yaml is not established. The witness proves only that a compressed sign-invariant key cannot uniquely choose an orientation without enumeration or an orientation witness.",
            "required_correction": "Replace the impossibility claim with an orbit-multiplicity/output obligation. To obtain a true cost obstruction, prove a growing lower bound on the number of reachable colliding source occurrences or on the work required to enumerate and replay them; a single sign orbit gives only a constant factor."
