          "The naive exact hash-and-scan baseline has B*B^2=B^3=N^(3/5) total query work before retries.",
          "For Dinur-Golovnev with equal list size n=B^2, TS=n^(5/2) translates to t+s=1 in N-exponents, and the published improvement interval n^(3/2)<<S<<n^(7/4) translates to 3/5<s<7/10. Charging B queries gives total-query exponent 1/5+t=6/5-s, so the strict sub-rho gate would require s>7/10.",
          "The prior TS^3=n^6 relation translates to t+3s=12/5; strict total-query time below N^(1/2) would require s>7/10.",
          "Corrigan-Gibbs and Kogan support the generic-only ST^2 and PT+T^2 controls stated in the packet; no non-generic EC lower-bound transfer follows.",
          "Chung-Larsen's polynomially relevant statements are cell-probe and group/model specific; the packet correctly refuses to turn them into a general ECDLP lower bound."
