            "evidence": "In the paper's integer model, set A'=U, B'=V, and C'={-q_e: e in [B]}. Since |C'|=B<=B^2=n, the query asks exactly whether some u+v=q_e across the B shifts. This is a special case of the unknown-C query, not a semantic non-instance.",
            "impact": "This does not produce an EC attack: the source is over integers, reports decision rather than source-labelled EC replay, guarantees high probability against an oblivious adversary, and has preprocessing n^2=N^(4/5), query n^(3/2+epsilon)=N^(3/5+(2/5)epsilon), and space N^(4/5-(4/15)epsilon), all outside the strict gate. The packet reaches the safe cost conclusion for an inaccurate semantic reason.",
