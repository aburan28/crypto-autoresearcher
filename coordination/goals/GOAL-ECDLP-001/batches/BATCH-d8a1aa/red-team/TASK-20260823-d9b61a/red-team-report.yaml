  required_controls:
    - >-
      Re-run the F_KTN argument with the actual output-list semantics. Put u
      and -u in one reachable source-labelled database, emit both candidates,
      and replay them. Record candidate multiplicity and work rather than a
      pre-verification truth-bit contradiction.
    - >-
      For any indistinguishability claim, hold the complete public instance,
      target-independent source data, transcript, and decoder inputs fixed.
      Changing u to -u in the source database is not a same-input collision.
    - >-
      Construct an exact reachable source-list generator satisfying the sign-
      pair premise, including source histories and labels; an assumed domain
      predicate is not a concrete reachable collision certificate.
    - >-
      Produce a clause-level semantic-delta table against P1553 and B59-B62.
      Treat the absent standalone P1552 record in this read scope as an
      unresolved audit gap, not novelty evidence.
    - >-
      Keep all six review-plan controls and the oriented-encoding control, but
      split semantic failure from cost failure. Constant transcripts are
      semantically repairable by full enumeration and therefore fail on cost,
      not automatically on soundness/completeness.
    - >-
      Type preprocessing, memory, persistent advice, all B queries, outputs,
      replay, verification, achieved success, retries, parallelism, and target
      count in one row. Unknown values remain unknown and incomparable.
    - >-
      Perform the resource reversal against the already quantified P1549
      grammar and P1550/P1551 residual rather than restating their missing
      locator interface.

  counterexample_or_mutation: >-
    The cheapest mutation is one pair-deck bucket containing both labelled
    signs u and -u. Keep v and q=u+v fixed, emit both candidate labels from the
    shared sign-invariant bucket, and run exact group replay. The true sign is
    accepted and the false sign rejected. The producer's transcript-collision
    premise remains true, but its no-sound-and-complete-locator conclusion is
    false. This localizes the missing step exactly: no lower bound on output
    multiplicity or replay work was proved.

  baseline_comparison: >-
    No realized B63 attack exists. The exact hash-and-scan locator has
    N^(2/5) setup and memory and N^(3/5) total work over B shifts before
    unknown relation-success and retries, so serial Pollard rho is better on
    time and memory. The retrieved Dinur-Golovnev tradeoff reaches the rho time
    boundary only at the edge requiring N^(7/10) space and does not supply EC
    representation, output/replay, success, or a preprocessing-time row. The
    unknown-universe algorithm has N^(4/5) natural preprocessing and mismatched
    subset semantics. The generic DLP balanced online/advice point requires
    N^(2/3) preprocessing at constant success. These are controls, not a
    lower bound on the open EC-specific selectors.

  heuristic_challenges: []

  cost_model_challenges:
    - >-
      Key collision count is not an achieved relation probability, but it is
      also not semantic impossibility. Bound the full candidate-output
      multiplicity before using sign collision as a cost obstruction.
    - >-
      The Dinur-Golovnev theorem statement supplies S and T, not a complete
      preprocessing/output/replay/success ledger for this EC interface.
    - >-
      Do not attach a dominated_by relation to an incomplete object whose
      attempt success, retries, and open-selector axes are unknown.
    - >-
      This report does not issue J3's blind cost verdict and does not adopt or
      reject any sibling rederivation.

  reduction_and_scope_challenges:
    - >-
      The exact group equality reduction does not make an integer data
      structure an elliptic data structure; the packet correctly keeps that
      transfer conditional.
    - >-
      A B62-style single-valued quotient-successor impossibility cannot be
      transferred to B63's list-output-plus-replay interface without a new
      ambiguity/output lower bound.
    - >-
      Generic-group preprocessing bounds do not cover non-generic EC
      coordinates, divisors, Semaev circuits, or noncharacter selectors.
    - >-
      F_KTN says nothing about JPR, target-label factors, nonseparable target
      algebra, compact finite-field circuits, or other EC-specific selectors.

  proof_architecture_challenges:
    observation_fiber: >-
      Holding the sign-invariant key fixed places u and -u in one fiber, but
      the fiber can be enumerated and replayed. The missing separator is not a
      unique sign bit; it is a proof that the full fiber is too large to emit
      within the claimed cost.
    quantifier_order: >-
      The target-independent setup boundary is stated correctly. The claimed
      collision nevertheless changes public source data or ignores it, so it
      is not an indistinguishability pair for the full decoder input.
    boundary_and_strictness: >-
      Exact scan is feasible but N^(1/10) worse in time exponent than rho;
      generic indexing reaches only the time boundary while using excessive
      space. No strict improvement is claimed.
    method_ceiling: >-
      The method ceiling is key-level nonseparation and a requirement to retain
      ambiguity. It does not reach an exact locator impossibility, general
      lower bound, or lane closure.
    nearby_object: >-
      Five circular/mismatched controls refuse correctly. The constant or
      collision-heavy transcript survives the unchanged semantic argument and
      is the breaking known-false control.
    compositional_invariant: >-
      Adding orientation makes the key injective; retaining both signs makes
      the output list complete. Deleting exact replay creates the producer's
      contradiction only by changing the frozen correctness interface.

  narrowest_supported_statement: >-
    On J4 and J5 only, the frozen packet correctly restates the source-labelled
    Query2P1 pair-deck/B-shift interface, correctly refuses direct transfer of
    the retrieved integer data structures and generic-group preprocessing
    theorem into an EC attack, and honestly leaves external novelty unverified.
    A sign-invariant F_KTN key cannot by itself uniquely decide which sign
    satisfies u+v=q, so an exact implementation must retain or emit ambiguity
    for source replay. The packet does not prove that a candidate-list locator
    cannot be sound and complete, does not lower-bound the ambiguity or replay
    cost, and supplies no complete sub-rho selector or typed attack point. Its
    alleged semantic delta is occupied by P1553 and B59-B62 after this
    correction. Repaired JPR, the P1553 target-label divisor/common-factor,
    IDEA-195/non-Cartesian, compact finite-field, and other EC-specific
    selector families remain untested and open. No conclusion is offered on
    J1-J3 or on the whole claim.

  next_concrete_action: >-
    The Coordinator should archive these two Red Team artifacts under
    TASK-20260823-5c0b29 and compose only the assigned J4/J5 breaks with the
    mutually blind J1-J3 results. Preserve the snapshot immutably. Any
    correction should narrow F_KTN to key nonseparation, remove the unsupported
    examined resource label and all-axis domination claim, classify the packet
    as predecessor/source consolidation, and retain every untested route with
    a revisit condition. If no budget remains, record a budget-bounded pause or
    B63 select-none, not a mathematical closure. Do not stage, commit, push,
    implement, execute, promote, change status, authorize a new batch, or claim
    an ECDLP speedup or breakthrough from this report.

