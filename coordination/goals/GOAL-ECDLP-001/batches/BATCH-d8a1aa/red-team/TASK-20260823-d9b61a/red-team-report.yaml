  objections:
    - id: RT-B63-O1-OUTPUT-LIST-REPLAY-INVALIDATES-OBSTRUCTION
      severity: material_claim_break
      status: validated_static
      joint: J4-semantic-novelty-and-proves-too-much-controls
      finding: >-
        The F_KTN proof compares a true and false tuple with the same compressed
        sign-invariant fields, then assumes the decoder must make one identical
        pre-verification acceptance decision. The frozen interface instead
        returns a candidate list and mandates exact source replay. Emitting
        both signs is complete and finally sound. Paired databases also differ
        in public source data, so equal keys are not equal complete decoder
        inputs. The claimed impossibility and exact scoped result therefore do
        not follow.
      affected_paths:
        - ledger/proposals/IDEA-20260823-9696cd.yaml
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-d8a1aa/tasks/TASK-20260823-c82d71/locator-replay-and-verifier.yaml
