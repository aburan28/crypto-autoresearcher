  joint_verdicts:
    J4-semantic-novelty-and-proves-too-much-controls: breaks
    J5-scope-resource-reversal-steering-and-opportunity-cost: breaks

  verdict_summary:
    J4: >-
      Breaks. The packet correctly marks external novelty unverified and
      correctly refuses direct generic-3SUM, generic-DLP, true-scalar,
      target-trained, and B^3-materialization imports. Its claimed exact
      F_KTN locator obstruction does not survive the required
      constant/collision-heavy control, however. A sign-invariant key may emit
      both sign candidates with source labels and let exact replay accept the
      true one; that is simultaneously complete and finally sound, albeit
      potentially expensive. The proposed pair also changes public source
      data, so equal compressed keys are not equal full decoder inputs. The
      proof establishes only that the compressed key alone is not a unique
      equality decision, not that no exact candidate-list locator exists.
      Further, the pair-deck map, target shifts, source-replay obligation,
      generic-indexing mismatch, scalar/advice controls, and B^3 boundary are
      already operation-level content of P1553 and B59-B62. No valid new
      semantic delta remains after the overstrong obstruction is removed.
    J5: >-
      Breaks. The packet preserves broad scope in several boundary fields, but
      its resource_check marks the B62 sign/multiplicity reversal examined
      while merely restating the already-recorded possibility. It does not
      confront the quantitative P1549 feasible window or the P1550/P1551
      residual finite-field selector class. Its top-level Pareto object also
      says success/retry axes were checked although they are explicitly
      unknown, so the incomplete selector is not a typed attack point. Finally,
      the recommended successor condition singles out one oriented
      non-Cartesian locator even though repaired JPR, the exact P1553 target-label
      divisor/common-factor constructor, and other nonseparable EC-specific
      selectors were not individually tested. Exhaustion of the authorized
      batch budget cannot close those routes.

  semantic_duplication_audit:
    - clause: exact_2_plus_2_plus_1_pair_deck_reduction
      current_content: >-
        Two source-labelled pair decks of size B^2 and B target shifts, with
        exact replay of five source indices.
      nearest_predecessor:
        - ideas/artifacts/ECDLP-IDEA-012/p1553_query2p1_indexing_gate_r3.md
        - ideas/artifacts/ECDLP-IDEA-012/p1553_target_label_common_factor_gate_r4.md
      comparison: >-
        P1553 already freezes the same two B^2 pair-occurrence decks, B fifth
        shifts, target-independent preprocessing, source restrictions, and
        exact labelled replay. B63 changes the accounting rectangle but not
        the operation or information flow.
      classification: duplicate_parameter_restatement_not_mechanism_new
      verdict: breaks_claimed_semantic_delta

    - clause: current_3sum_indexing_tradeoff_screen
      current_content: >-
        Translate TS^3=m^6 and TS=m^(5/2) at m=B^2 and charge B queries;
        refuse integer/universe semantics without an EC reduction.
      nearest_predecessor:
        - ideas/artifacts/ECDLP-IDEA-012/p1553_query2p1_indexing_gate_r3.md
        - ideas/artifacts/ECDLP-IDEA-195/p1551_finite_domain_selector_circuit_gate.md
      comparison: >-
        P1553 already screens Dinur-Golovnev under B target shifts, refuses an
        additive point-to-integer map, and charges occurrence replay. B63's
        directly retrieved version of the newer theorem is useful source
        refresh, not a new EC selector. The Dinur-Golovnev theorem statement
        supplies S and T but no charged preprocessing-time exponent, so that
        axis remains unknown rather than realized.
      classification: source_refresh_and_control_consolidation
      verdict: holds_only_as_control

    - clause: generic_dlp_preprocessing_control
      current_content: >-
        At S=T=N^(1/3), the generic PT+T^2 lower bound forces P at least
        N^(2/3) at constant success.
      nearest_predecessor:
        - ideas/artifacts/ECDLP-IDEA-012/p1553_query2p1_indexing_gate_r3.md
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-b1bfda/tasks/TASK-20260823-03d4d2/masked-target-recurrence.yaml
      comparison: >-
        The exact Corrigan-Gibbs-Kogan preprocessing-time formula is a useful
        strengthened generic control, but its semantic role is unchanged: it
        rules out free generic advice and does not lower-bound coordinate or
        non-generic EC selectors.
      classification: model_specific_control_refinement_not_ec_result
      verdict: holds

    - clause: target_training_scalar_labels_and_B3_materialization
      current_content: >-
        Refuse true discrete-log labels, Q-trained tables, and any B^3
        pair-times-shift/coefficient-complete object.
      nearest_predecessor:
        - ideas/artifacts/ECDLP-IDEA-012/p1553_query2p1_indexing_gate_r3.md
        - ideas/artifacts/ECDLP-IDEA-012/p1553_target_label_common_factor_gate_r4.md
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-b1bfda/tasks/TASK-20260823-03d4d2/locator-theorem.yaml
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-e51cf7/tasks/TASK-20260823-8f096a/proves-too-much-controls.yaml
      comparison: >-
        These are already the P1553/B59/B60 missing-locator controls. B63
        applies them correctly but cannot count their reuse as a distinct
        selector result.
      classification: exact_duplicate_controls
      verdict: holds_as_controls_only

    - clause: sign_invariant_Kummer_transcript_obstruction
      current_content: >-
        The tuples (u,v,q) and (-u,v,q) share all sign-invariant fields while
        exactly one satisfies u+v=q, allegedly making simultaneous soundness
        and completeness impossible for F_KTN.
      nearest_predecessor:
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-12cf3a/tasks/TASK-20260823-9495d1/nearby-object-controls.yaml
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-12cf3a/tasks/TASK-20260823-9495d1/support-growth-identifiability.yaml
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-d2d733/tasks/TASK-20260823-b66c61/locator-impossibility.yaml
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-d2d733/tasks/TASK-20260823-b66c61/oriented-history-lift.yaml
      comparison: >-
        B61 already records Kummer sign ambiguity and warns that exactness can
        move into retained branches, false matches, or a source table. B62
        proves a narrower impossibility only for a single-valued memoryless
        successor on the quotient. B63 attempts to transfer that contradiction
        to an output-list-and-replay interface, where it is false. No valid
        theorem-strengthening or new mechanism follows.
      classification: predecessor_specialization_with_invalid_stronger_inference
      verdict: breaks

    - clause: oriented_noncartesian_resource_escape
      current_content: >-
        Retain orientation/history and multiplicity as weights on a
        non-Cartesian branch DAG, then seek output-sensitive unranking.
      nearest_predecessor:
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-d2d733/tasks/TASK-20260823-b66c61/disposition-report.yaml
        - ideas/artifacts/ECDLP-IDEA-195/p1549_noncartesian_finite_state_closure_gate.md
        - ideas/artifacts/ECDLP-IDEA-195/p1550_high_branching_s3_path_locator_gate.md
        - ideas/artifacts/ECDLP-IDEA-195/p1551_finite_domain_selector_circuit_gate.md
      comparison: >-
        This is the existing B62 resource prompt and ECDLP-IDEA-195 path
        locator/source-unranking interface. P1549 already gives a quantitative
        conditional window; P1550 removes global rational branch catalogs;
        P1551 preserves a narrower compact finite-field coefficient/source
        extractor. B63 supplies no discriminator against that live residual.
      classification: duplicate_open_obligation
      verdict: breaks_resource_check_examined_label

    - clause: P1552_operation_level_rerank_and_P1553_frontier
      current_content: >-
        Source-and-novelty-audit names IDEA-121/P1552/P1553 as nearest internal
        records but imports no novelty conclusion.
      nearest_predecessor:
        - ideas/artifacts/ECDLP-IDEA-195/p1551_finite_domain_selector_circuit_gate.md
        - ideas/artifacts/ECDLP-IDEA-012/p1553_query2p1_indexing_gate_r3.md
      comparison: >-
        The authorized material identifies P1552 as the corpus-wide
        operation-level rerank and P1553 as the exact Query2P1 residual. No
        standalone P1552 record was available inside this task's read scope,
        and the producer provides no clause table. It therefore cannot claim
        semantic distinctness from that frontier; external novelty correctly
        remains unverified.
      classification: direct_comparison_incomplete
      verdict: inconclusive_for_external_novelty_breaks_internal_delta_claim

  generic_vs_ec_transfer_audit:
    exact_group_reduction: >-
      The algebraic equality (A_i+C_j)+(D_k+F_l)=Q-E_e and source replay are
      exact as a group statement. This report does not issue J1's theorem
      verdict.
    generic_3sum_semantics: >-
      The retrieved Dinur-Golovnev object preprocesses integer input and
      answers an integer challenge through a data structure. The packet
      correctly refuses an operation-preserving EC-to-integer import and does
      not count B queries as one query.
    preprocessed_universe_semantics: >-
      Kirkpatrick et al. preprocess integer universes and query subsets plus an
      unknown set C'; their theorem has quadratic preprocessing and is not the
      frozen static EC source-replay interface. The packet correctly refuses
      this transfer.
    generic_dlp_semantics: >-
      Corrigan-Gibbs-Kogan is a generic-group preprocessing theorem. Its
      PT+T^2 consequence can reject free generic advice, but it supplies no
      lower bound for the EC-specific open selectors.
    lower_bound_semantics: >-
      Chung-Larsen explicitly gives restricted adaptive/nonadaptive data-
      structure lower bounds while general unconditional hardness remains far
      away. The packet correctly avoids an ECDLP lower-bound inference.
    residual_defect: >-
      The known-tradeoff artifact calls its result fully charged even though
      the Dinur-Golovnev theorem statement does not populate preprocessing,
      EC representation, output/replay, or achieved relation-success axes.
      The safe statement is that the cited theorem does not itself supply a
      complete EC attack, not that every implementation of its abstract
      tradeoff has been end-to-end costed.
    verdict: holds_with_material_wording_and_axis_qualification

  proves_too_much_controls:
    - id: PTM-B63-RANDOM-INTEGER-3SUM
      object: ordinary_random_integer_3sum_indexing_without_ec_source_replay
      required_failure_signature: >-
        The argument must stop before claiming an EC locator because the
        universe, operation, target queries, source labels, and replay differ.
      observed: >-
        The packet explicitly refuses EC qualification and treats the data
        structure only as a conditional cost control.
      verdict: holds

    - id: PTM-B63-GENERIC-DLP-FREE-ADVICE
      object: generic_group_advice_with_preprocessing_omitted
      required_failure_signature: >-
        Preprocessing P must be charged, and the generic theorem must not be
        transferred to non-generic EC coordinates.
      observed: >-
        The packet derives P at least N^(2/3) at the balanced constant-success
        point and explicitly refuses an EC-specific lower-bound transfer.
      verdict: holds

    - id: PTM-B63-TRUE-SCALAR-KEY
      object: selector_bucket_key_equal_to_true_discrete_log
      required_failure_signature: >-
        The candidate must be rejected as circular before any equality or
        locator speed is credited.
      observed: >-
        The packet forbids the scalar key and gives it zero candidate credit.
      verdict: holds

    - id: PTM-B63-TARGET-TRAINED-TABLE
      object: table_containing_Q_dependent_entries_or_target_shifts
      required_failure_signature: >-
        Construction must move to online cost and cannot be called public
        target-independent preprocessing.
      observed: >-
        The packet enforces target-independent setup and refuses target-trained
        advice.
      verdict: holds

    - id: PTM-B63-B3-MATERIALIZATION
      object: coefficient_complete_norm_resultant_or_pair_times_shift_table
      required_failure_signature: >-
        B^3=N^(3/5) construction, traffic, and output must be charged before a
        cheap query subroutine is credited.
      observed: >-
        The packet charges exponent 3/5 and rejects strict sub-rho status.
      verdict: holds

    - id: PTM-B63-CONSTANT-OR-COLLISION-HEAVY-TRANSCRIPT
      object: >-
        A constant or sign-invariant key whose bucket contains every matching
        source-labelled candidate, followed by exact group replay.
      known_false_conclusion: >-
        It is false that such a transcript can never be both complete and
        finally sound. Emitting the whole bucket and replaying each source is
        semantically exact, even though its output/work may be prohibitive.
      unchanged_argument: >-
        The producer's same-transcript step still fires and therefore declares
        impossibility. It omits that the decoder also receives the public
        source database and may output a list, while the verifier is explicitly
        part of the frozen chain. On one database containing both u and -u,
        emit both source labels; replay accepts u and rejects -u. On paired
        databases, the public source records differ, so the complete decoder
        inputs are not identical even if compressed keys match.
      failure_signature_observed: >-
        The proof survives a known-false object by conflating pre-verification
        key uniqueness with output-list completeness and final soundness.
      verdict: breaks

    - id: PTM-B63-ORIENTED-INJECTIVE-ENCODING
      object: exact_oriented_point_encoding
      required_failure_signature: >-
        The sign-collision premise must fail because u and -u have different
        keys; only a separate locator-cost objection may remain.
      observed: >-
        The family definition excludes oriented encodings, so the literal
        sign premise stops. This control is necessary but does not repair the
        output-list/replay flaw on noninjective encodings.
      verdict: holds_but_not_dispositive

  output_list_counterexample_to_the_counterexample:
    public_instance: >-
      Use one reachable pair deck containing labelled occurrences L_plus:u and
      L_minus:-u, a labelled v in the other deck, and q=u+v, with 2u nonzero.
    selector: >-
      Bucket both signs under their common F_KTN key. On q, emit every source
      label in that bucket paired with the compatible v label.
    replay: >-
      Recompute the exact group sums from the public source records. The
      L_plus tuple passes; the L_minus tuple fails and is discarded.
    consequence: >-
      Locator completeness and final soundness both hold. Sign loss causes at
      least a two-candidate ambiguity here, not semantic impossibility. To
      obtain a cost obstruction, a successor must lower-bound bucket/output
      multiplicity over the exact reachable source generator and charge it;
      the current zero-valued separation quantity does not do so.
    experiment_runs: 0
    status: exact_symbolic_nearby_object_control

  observation_fiber_and_method_ceiling:
    claimed_invariant: complete_sign_invariant_F_KTN_key_or_preverification_transcript
    fiber_mutation: u_to_minus_u_with_v_and_q_fixed
    producer_conclusion: no_sound_and_complete_exact_locator
    missing_separator: >-
      The public source occurrence and post-emission replay result are not part
      of the compressed key. More importantly, the required output is a list,
      not a unique pre-verification truth bit.
    largest_supported_claim: >-
      A purely sign-invariant key cannot by itself uniquely decide which sign
      satisfies u+v=q. Any exact implementation must retain or emit enough
      ambiguity for replay. No asymptotic lower bound on that ambiguity,
      locator work, or source output is proved.
    headline_reached: false
    verdict: breaks

  novelty_audit:
    internal_semantic_novelty: >-
      Not established. The exact Query2P1 interface and generic indexing
      controls are P1553 content; B59/B60 already freeze target-independent
      state, B^3 materialization, complete transcript, reachable collision,
      source replay, and target-training gates; B61/B62 already isolate Kummer
      sign ambiguity and oriented restoration. The only asserted stronger
      delta, the F_KTN locator impossibility, fails the output-list control.
    external_novelty: unverified
    external_retrieval_scope: >-
      Four directly opened primary sources verify only their data-structure or
      generic-group statements. No exhaustive Kummer-selector literature
      search was performed, and absence from those papers is no novelty
      evidence.
    producer_novelty_status_honest: true
    semantic_delta_wording_honest: false
    required_wording: >-
      Describe B63 as a current-source refresh and consolidation of the
      Query2P1/selector obligations. Retain only the key-nonseparation lemma
      after correcting the output-list claim. Do not call the rest distinct,
      known, novel, or a new obstruction.
    verdict: breaks

  pareto_and_all_axis_audit:
    realized_attack_point_exists: false
    exact_scan_baseline:
      preprocessing_exponent: 0.4
      memory_exponent: 0.4
      all_B_query_scan_exponent: 0.6
      relation_presence: unknown
      attempt_success: unknown
      retry_exponent: unknown
      interpretation: >-
        This is a deterministic locator conditional on a relation, not a
        complete ECDLP attack. Its pre-retry scan is already slower than rho,
        but unknown success/retry axes prevent typing it as a realized attack
        point.
    dinur_golovnev_control:
      translated_space_range_in_N: strictly_between_0.6_and_0.7
      translated_total_B_query_time_in_N: strictly_between_0.6_and_0.5
      strict_sub_rho_time_requires_space_exponent: greater_than_0.7
      theorem_preprocessing_axis: not_stated_in_reviewed_theorem_statement
      EC_semantics_output_replay_success: untransferred
      interpretation: conditional_generic_control_only
    unknown_universe_control:
      natural_preprocessing_exponent_in_N: 0.8
      query_model: subset_queries_over_integer_universes_with_unknown_C
      interpretation: fails_preprocessing_and_semantic_gates
    generic_dlp_preprocessing_control:
      advice_exponent: 0.3333333333333333
      online_exponent: 0.3333333333333333
      preprocessing_lower_bound_exponent: 0.6666666666666666
      interpretation: generic_only_and_not_fully_sub_rho
    domination_typing:
      producer_checked_axes_claim: >-
        The proposal lists preprocessing, online time, memory, data/queries,
        output/replay, and success/retries as checked.
      defect: >-
        Relation presence, attempt success, retries, and the open selector's
        costs are explicitly unknown. An incomplete object is not a Pareto row
        and cannot be declared dominated across axes that have no values.
      allowed_narrow_comparison: >-
        Pollard rho dominates the concrete N^(3/5)-time exact-scan subroutine
        on time and memory for a single target, before retries. The open
        oriented/non-Cartesian object remains incomparable because it has no
        cost or success row.
      required_top_level_value: n_a_no_complete_attack_point
    multi_target_amortization: >-
      No realized multi-target row is supplied. Setup reuse may be discussed
      only with target count, target distribution, persistent advice, and
      per-target output/replay charged together.
    verdict: breaks

  obstruction_resource_reversal:
    producer_obstruction: Kummer_sign_transcript_collision
    producer_quantity: minimum_transcript_separation_between_u_and_minus_u
    producer_value: 0
    producer_resource_check_examined: true
    producer_reading: >-
      Lost sign or multiplicity may be retained as orientation/history weight
      in a non-Cartesian selector.
    defect: >-
      This repeats B62's explicitly unexamined resource prompt and does not
      test a theory that consumes the quantity. It also treats zero key
      separation as fatal even though output-list replay reads ambiguity as a
      bounded resource in the smallest control.
    independent_resource_reading: >-
      Sign branches and collision multiplicities are candidate weights, not
      automatically noise. P1549 already asks whether a shared-layer
      non-Cartesian path grammar can use exact signed edges and multiplicity;
      its conditional O(D) locator window 11/12<=gamma<=1 is quantitatively
      admissible. P1550 removes explicit global rational branch catalogs but
      preserves compact high-degree finite-field selectors. P1551 narrows the
      residual further to a noncharacter, nonenumerative endpoint-coefficient
      and source-unranking operation outside explicit B^3 source quotients.
      B63 neither instantiates nor falsifies that existing resource reading.
    correct_completion_label: examined_false_or_incomplete
    existing_owner: ECDLP-IDEA-195
    additional_open_owner: P1553_target_label_common_factor_z_R
    candidate_for_future_ranking_only: true
    evidence_status: not_evidence
    spawned_ids: []
    verdict: breaks

  scope_and_steering_audit:
    route_checks:
      exact_F_KTN_unique_preverification_decision:
        status: key_nonseparation_only
        basis: >-
          Sign invariance prevents a unique key-level decision, but candidate
          enumeration plus replay remains semantically exact and was not cost
          lower-bounded.
      oriented_history_bearing_noncartesian_selector:
        status: open_uninstantiated
        basis: >-
          Explicitly outside the F_KTN family; IDEA-195 quantitative residual
          is not resolved by B63.
      repaired_JPR:
        status: open_conditional_alternative
        basis: >-
          The B63 batch rerank lists repaired JPR second. No B63 producer
          artifact tests an exact JPR key or its certificate obligations.
      target_label_divisor_or_common_factor:
        status: open_representation_sensitive_alternative
        basis: >-
          P1553 R4 gives exact z_R component semantics and leaves an oracle-free
          representation-sensitive constructor open. F_KTN sign-key analysis
          does not range over that object.
      compact_finite_field_or_noncharacter_selector:
        status: open
        basis: >-
          P1550/P1551 explicitly preserve this class. No current lower bound
          or construction addresses it.
      generic_3sum_data_structures:
        status: not_an_EC_attack_from_current_sources
        basis: >-
          Their exact group/representation/replay transfer is absent; this is
          not an impossibility result for EC-specific indexing.
      general_EC_selector_or_ECDLP_lane:
        status: open
        basis: >-
          No current theorem covers target-dependent, history-rich,
          nonseparable, coordinate, divisor, weighted, or support-changing
          families.
    opportunity_cost: >-
