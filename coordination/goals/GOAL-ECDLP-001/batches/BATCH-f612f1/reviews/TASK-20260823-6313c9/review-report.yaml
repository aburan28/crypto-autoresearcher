  independent_derivation:
    algebra_and_trace:
      - id: J3-DER-01
        statement: >-
          Since B^5<p, in particular B<p.  Each f_i has the B distinct roots
          0,...,B-1 in F_p, so the Chinese remainder theorem gives
          A_occ isomorphic to the direct product F_p^Omega.  Its regular trace
          is the sum of occurrence coordinates.
        equations:
          - "A_occ ~= product_(a in Omega) F_p"
          - "Tr(h)=sum_(a in Omega) h(a)"
        scope: exact for the frozen split square-free algebra
      - id: J3-DER-02
        statement: >-
          Coordinatewise Fermat evaluation gives e_Q(a)=1 exactly when
          g_Q(a)=0 and e_Q(a)=0 otherwise.  Thus e_Q is an idempotent selector,
          m_0=q in F_p, and q is also the unique integer in [0,D] represented
          by m_0 because D<p.
        equations:
          - "g(a)^(p-1)=0 if g(a)=0, and 1 otherwise"
          - "e(a)=1_[g(a)=0]"
          - "m_0=sum_a e(a)=q"
        scope: exact; q counts selected occurrence tuples, not oriented replay
      - id: J3-DER-03
        statement: >-
          The standard public Semaev definition constructs S_n recursively by
          a resultant and has degree 2^(n-2) in each variable.  Hence S_6 has
          individual degree 16.  This is used only to bound the univariate
          powers X_i^alpha that can occur; it does not provide a contraction
          cost or an expanded support list.
        provenance: retrieved
        source: https://eprint.iacr.org/2004/031.pdf

    occurrence_code_and_collision_census:
      - id: J3-COLL-01
        object: base-B code U
        result: no_collisions
        derivation: >-
          For a=(a_1,...,a_5) with 0<=a_i<B, U(a) is the ordinary five-digit
          base-B integer.  Equality of two codes implies equality of every
          digit.  Moreover 0<=U(a)<=B^5-1<p, so reduction in F_p cannot merge
          two codes.
        exact_scope: every frozen B^5<p instance
      - id: J3-COLL-02
        object: moments m_0,...,m_64
        result: no_collisions_for_q_at_most_64
        derivation: >-
          For q<=64, the roots u_1,...,u_q are distinct code values.  Newton's
          identities k*e_k=sum_(i=1)^k (-1)^(i-1)e_(k-i)m_i recover all
          elementary symmetric functions through k=q because every
          1<=k<=64 is invertible in F_p.  Therefore the monic polynomial
          product_r (Z-u_r) and its root set are unique; base-B decoding then
          recovers the selected occurrence tuples.
        quantifiers: >-
          For every public instance satisfying the frozen field inequalities
          and every selector support of integer size q<=64.  No genericity,
          probability, cancellation assumption, or supplied root is used.
      - id: J3-COLL-03
        object: q>64 packet
        result: no_injectivity_claim
        derivation: >-
          Newton reconstruction from the supplied powers stops at degree 64.
          For q>64 the packet does not provide the remaining elementary
          symmetric functions, so the frozen stop is necessary.  This report
          does not assert a collision for every such parameter choice; it
          records only that injectivity is not established by these moments.
      - id: J3-COLL-04
        object: duplicate x-coordinates with distinct occurrence labels
        result: code_level_collision_free
        derivation: >-
          Equal x-coordinate data can make g take the same value on multiple
          labelled occurrences, but their index tuples and therefore their U
          codes remain distinct.  This establishes code/moment separation
          only, not point orientation or scalar replay.

    fixed_exact_occurrence_basis_circuit:
      purpose: >-
        A transparent baseline that charges every target-dependent coordinate;
        it is not asserted to be optimal and it supplies no lower bound against
        a different explicitly proved representation.
      s6_circuit: >-
        Fix the public resultant definition with S_3 as the base polynomial,
        form S_4 by the prescribed resultant, and form S_6 as the balanced
        resultant Res_Z(S_4(x_1,x_2,x_3,Z),S_4(x_4,x_5,x_6,Z)).  Fix a
        deterministic Sylvester-determinant arithmetic circuit and its
        evaluation order once.  Let C6_add and C6_mul denote that circuit's
        exact field-addition and field-multiplication counts.  The packet omits
        the curve equation, coefficients, and expanded circuit, so numerical
        values for these constants cannot be instantiated honestly; they are
        charged symbolically below.
      steps:
        - step: F1
          operation: >-
            Enumerate every a in Omega and evaluate
            g_a=S_6(x(P_1,a_1),...,x(P_5,a_5),x(Q)).
          target_dependent: true
          output_basis: occurrence idempotents delta_a
          output_count: D field elements, streamable one at a time
          field_cost: "D*C6_add additions + D*C6_mul multiplications"
        - step: F2
          operation: >-
            For every coordinate use left-to-right binary exponentiation to
            compute z_a=g_a^(p-1), then e_a=1-z_a.
          target_dependent: true
          exact_multiplier_count: >-
            D*(ell+wt(p-1)-2), where ell=floor(log_2(p-1))+1 and wt is
            binary Hamming weight; plus D subtractions
          output_support: "O_Q={a:g_a=0}, of exact size q"
        - step: F3
          operation: >-
            For every coordinate set v=1.  Add e_a to m_0.  For j=1,...,64,
            update v=v*U(a), multiply h=e_a*v, and add h to m_j.
          target_dependent: true
          exact_fixed_loop_cost: "128*D multiplications + 65*D additions"
          output_basis: 65 scalar trace accumulators
        - step: F4
          operation: >-
            Interpret m_0 as q; when q<=64 apply Newton identities, factor the
            recovered degree-q polynomial, and base-B decode its roots.
          target_dependent: true
          asymptotic_in_B: O(1) field words and operations because q<=64
          excluded_scope: factorization constants, orientation, and scalar replay
      traffic_and_state:
        target_tuple_visits: D
        minimum_charged_baseline_input_traffic: "at least D tuple evaluations"
        fixed_loop_field_operation_order: "Theta(D*(C6+log p+64))"
        bit_cost: >-
          O(D*(C6_add+66)*beta +
          D*(C6_mul+ell+wt(p-1)+126)*M(beta)), where M(beta) is the chosen
          beta-bit modular multiplication cost.  This is symbolic because the
          packet fixes neither field representation nor multiplication
          algorithm.
        streaming_peak_state: >-
          5B setup table words + 65 accumulator words + O(1) circuit words +
          at most 64 recovered code words; this is O(B) field words.
        materialized_peak_state: >-
          Theta(D) field words for any full g, e, or boundary vector, or
          Theta(65D) if all e*U^j vectors are retained simultaneously.
        conclusion: >-
          Streaming avoids B^5 live state but still incurs B^5
          target-dependent traffic.  Materialization incurs B^5 state.  The
          statement contains no named exact operation that simultaneously
          removes both costs.

    exact_occurrence_basis_supports:
      notation:
        O_Q: "{a in Omega:g_Q(a)=0}"
        delta_0: "1 if (0,0,0,0,0) is in O_Q, otherwise 0"
      boundaries:
        - value: g_Q
          exact_support: "Omega minus O_Q"
          exact_nonzero_count: D-q
        - value: every positive power g_Q^k
          exact_support: "Omega minus O_Q"
          exact_nonzero_count: D-q
          reason: positive powers preserve zero versus nonzero coordinates
        - value: g_Q^(p-1)
          exact_support: "Omega minus O_Q"
          exact_nonzero_count: D-q
        - value: e_Q
          exact_support: O_Q
          exact_nonzero_count: q
        - value: U
          exact_support: "Omega minus {(0,0,0,0,0)}"
          exact_nonzero_count: D-1
        - value: e_Q*U^0
          exact_support: O_Q
          exact_nonzero_count: q
        - value: e_Q*U^j for every 1<=j<=64
          exact_support: "O_Q minus {(0,0,0,0,0)}"
          exact_nonzero_count: q-delta_0
        - value: m_0
          exact_support: scalar
          exact_nonzero_condition: q>0
        - value: m_j for j>=1
          exact_support: scalar
          exact_nonzero_condition: >-
            Not derivable: distinct nonzero powers can cancel modulo p even
            though the complete packet remains injective for q<=64.

    monomial_support_and_reduction_census:
      basis: >-
        E={T_1^r_1...T_5^r_5:0<=r_i<B}; exponent box E_B=[0,B-1]^5.
      definitions:
        C_i: "support of X_i in the univariate monomial basis"
        P_i_alpha: "support of X_i^alpha mod f_i"
        A_Q: >-
          exponent support of S_6 after substituting x(Q) in its sixth
          variable and collecting coefficients
      exact_statement_level_bound_for_g: >-
        supp(g_Q) is contained in the union over alpha in A_Q of the Cartesian
        products P_1,alpha_1 x ... x P_5,alpha_5.  Each P_i,alpha has at most B
        exponents and 0<=alpha_i<=16, so the reduced support can occupy all D
        monomials.  Exact nonzero support is not determined by the packet:
        X_i coefficients, curve coefficients, x(Q), modular cancellations,
        and the chosen S_6 circuit are absent.
      minkowski_product:
        rule: >-
          Before reduction, multiplying supports S and T gives candidate
          support S+T={s+t}.  For two full reduced boxes this is
          [0,2B-2]^5 with exactly (2B-1)^5 candidate exponents and D^2
          ordered coefficient-product incidences.
        cancellation_boundary: >-
          Candidate exponent support is not the same as exact nonzero support;
          claiming equality requires coefficients and a no-cancellation proof.
      reduction_map:
        univariate_definition: >-
          R_B maps coefficients on exponents 0,...,2B-2 to the remainder
          basis 1,T,...,T^(B-1) modulo f(T)=product_(a=0)^(B-1)(T-a).
        nonzero_count_parameter: >-
          Let rho_k=nnz(T^k mod f) and
          r_B=B+sum_(k=B)^(2B-2)rho_k=nnz(R_B).  Because f has factor T,
          rho_k<=B-1 and r_B<=B^2-B+1.  Its exact value depends on B and
          reduction modulo the unspecified p.
        five_axis_full_box_traffic: >-
          r_B*sum_(k=0)^4 B^k*(2B-1)^(4-k) coefficient contributions for
          separable sequential reduction of a materialized full raw box.
        output_width: B in each coordinate and at most D nonzeros
        state_if_materialized: "up to (2B-1)^5 raw words and D reduced words"
      multiplication_by_U:
        input: "a dense reduced coefficient tensor h"
        U_support: "the five unit exponent vectors; exactly 5 monomials"
        raw_candidate_nonzero_positions: "D-1+5B^4"
        coefficient_product_incidences: 5D
        boundary_terms_requiring_reduction: 5B^4
        reduction_contributions: >-
          5*rho_B*B^4, where rho_B=nnz(T^B mod f)<=B-1
        reduced_output_width: >-
          at most D-1 monomials for h*U^j with j>=1; the constant coefficient
          is zero because evaluation at the all-zero occurrence is zero
        consequence: >-
          Repeating through j=64 preserves a B^5 traffic exponent even though
          64 is constant.

    basis_map_and_contraction_census:
      vandermonde_parameters:
        V_definition: "V[a,r]=a^r for 0<=a,r<B, with 0^0=1"
        V_exact_nonzeros: "nu_B=B^2-B+1"
        L_definition: "L=V^(-1), the consecutive-node interpolation map"
        L_nonzeros: >-
          eta_B=nnz(L), an exact public function of B and p but not a numeric
          constant in this symbolic packet; eta_B<=B^2-B+1
      maps:
        - map: five input x-coordinate tables to coefficients of X_i
          input_basis: occurrence values indexed by a
          output_basis: univariate monomials 1,T_i,...,T_i^(B-1)
          fixed_matrix: L
          coefficient_contributions: 5*eta_B
          setup_or_target: setup
          live_words: O(B)
        - map: full monomial tensor to occurrence values
          input_basis: E
          output_basis: delta_a
          fixed_matrix: V tensor-power 5
          explicit_matrix_nonzeros: nu_B^5
          separable_coefficient_contributions: 5*B^4*nu_B
          separable_additions: 5*B^4*(B-1)^2
          setup_or_target: "matrix setup; application is target-dependent"
          live_words_when_materialized: Theta(D)
        - map: full occurrence vector to monomial tensor
          input_basis: delta_a
          output_basis: E
          fixed_matrix: L tensor-power 5
          explicit_matrix_nonzeros: eta_B^5
          separable_coefficient_contributions: 5*B^4*eta_B
          setup_or_target: "matrix setup; application is target-dependent"
          live_words_when_materialized: Theta(D)
        - map: trace in occurrence basis
          input_basis: delta_a
          output_basis: scalar
          exact_nonzero_weights: D
          coefficient_traffic: "D reads and D-1 additions"
          setup_or_target: "fixed map; target-dependent input"
        - map: trace in monomial basis
          input_basis: E
          output_basis: scalar
          weights: >-
            w_r=product_i s_(r_i), where s_k=sum_(a=0)^(B-1)a^k
          exact_nonzero_weights: >-
            tau_B^5, where tau_B is the number of nonzero s_k for 0<=k<B
          coefficient_traffic: "tau_B^5 multiplications and at most tau_B^5-1 additions"
          setup_or_target: "weights are setup; input is target-dependent"
        - map: diagonal multiplication by U^j in occurrence basis
          input_basis: delta_a
          output_basis: delta_a
          exact_map_nonzeros: "D for j=0 and D-1 for j>=1"
          exact_nonzero_output_on_e: "q for j=0 and q-delta_0 for j>=1"
          setup_or_target: "diagonal is setup; e is target-dependent"
      free_map_check: >-
        None of interpolation, CRT conversion, modular reduction, trace, or
        diagonal moment formation is free.  The separable application counts
        above already exceed the online cap when applied to a full tensor; a
        claimed smaller cost needs an explicit representation and contraction
        order with every boundary charged.

    state_and_cost_cap_check:
      setup_state:
        streaming_occurrence_baseline: O(B) field words
        coefficient_or_crt_materialization: Theta(B^5) field words
        cap: B^(9/4+o(1)) field words
        result: >-
          The streaming baseline satisfies the state exponent but not the
          online exponent.  Any displayed full coefficient/occurrence tensor
          violates the state cap by a factor B^(11/4-o(1)).
      online:
        exact_baseline: "Theta(B^5*(C6+log p+64)) field operations/traffic"
        cap: B^(5/4+o(1))
        result: >-
          The explicit baseline exceeds the cap by B^(15/4-o(1)), before
          charging root factorization or replay.  No allowed statement-level
          lemma reduces the D coordinate inspections or supplies the moments.
      support_only_claim_check:
        result: not_established
        reason: >-
          Monomial support propagation reaches width B in every variable and
          can reach D positions after reduction.  Support sets alone do not
          encode coefficient cancellations, separated rank, image size, or a
          target-independent contraction.  Treating a numerical rank, supplied
          m_j, cancellation, or unnamed map as the missing step would violate
          the frozen boundary.
      lower_bound_boundary: >-
        This is a failure of the supplied cost certificate, not a proof that
        every possible implicit evaluator requires B^5 time or state.

    B_to_N_exponent_census:
      parameterization: >-
        Set N=p and theta=log_N(B).  The inequality B^5<N gives theta<1/5.
        Equalities in the last column apply only in the customary boundary
        regime B=N^(1/5+o(1)); the inequality alone does not imply equality.
      rows:
        - quantity: online cap
          B_scale: B^(5/4)
          N_scale_general: N^((5/4)*theta)
          N_boundary_exponent: 1/4
        - quantity: setup/state cap
          B_scale: B^(9/4)
          N_scale_general: N^((9/4)*theta)
          N_boundary_exponent: 9/20
        - quantity: five public occurrence tables
          B_scale: B
          N_scale_general: N^theta
          N_boundary_exponent: 1/5
        - quantity: five dense univariate interpolation maps
          B_scale: B^2
          N_scale_general: N^(2*theta)
          N_boundary_exponent: 2/5
        - quantity: full tensor or direct tuple scan
          B_scale: B^5
          N_scale_general: N^(5*theta)
          N_boundary_exponent: 1
        - quantity: separable full CRT application
          B_scale: B^6
          N_scale_general: N^(6*theta)
          N_boundary_exponent: 6/5
        - quantity: explicit tensor matrix or dense convolution pairs
          B_scale: B^10
          N_scale_general: N^(10*theta)
          N_boundary_exponent: 2
        - quantity: q and 65 moments under q<=64
          B_scale: B^0
          N_scale_general: N^0
          N_boundary_exponent: 0
      polylog_note: >-
        Binary exponentiation contributes log p=N^(o(1)); it does not change
        the B^5 or boundary N^1 exponent.

    nearby_object_controls:
      - object: dense-generic
        instantiated_definition: >-
          An arbitrary explicitly supplied occurrence-basis vector
          g in F_p^Omega.
        census: >-
          The selector and trace circuit has D coordinate inputs, D Fermat
          tests, and D trace contributions.  Any exact deterministic algorithm
          in this explicit-input model must inspect every coordinate: changing
          one unread coordinate between zero and nonzero changes m_0 because
          D<p.  Thus the control has an Omega(D) field-word input-traffic lower
          bound and cannot meet B^(5/4+o(1)).
        proves_too_much_signature: >-
          A topology/support argument that claims the same sub-D exact cost on
          this object without a compressed input representation, charged map,
          or promise is unsound.
      - object: separable-unary
        status: underspecified_in_statement_packet
        finding: >-
          No formula, composition law, representation, or output promise is
          given, so an exact support/traffic census is impossible without
          reading blind_from material.  For the natural additive
          instantiation g=sum_i h_i(T_i), the initial coefficient support has
          at most 1+5(B-1) positions, but powering and reduction can introduce
          mixed terms in all five variables and a D-wide reduced support.  For
          the multiplicative instantiation g=product_i h_i(T_i), powers remain
          rank one and traces factor.  These controls have different answers,
          showing that the omitted definition is load-bearing.
        validator_action: >-
          Report underspecification; do not open the producer derivation to
          guess which object was intended.

  findings:
    - id: J3-FINDING-01
      severity_for_joint: blocking
      verdict: breaks
      statement: >-
        The statement supplies semantic definitions but no coefficient-complete
        support-only evaluator.  The fully charged exact baseline has B^5
        online traffic, and full coefficient/CRT materialization has B^5
        state.  Therefore the stated cost rectangle is not derived.
      exact_scope: frozen representation and allowed statement packet only
    - id: J3-FINDING-02
      severity_for_joint: blocking
      verdict: breaks
      statement: >-
        Exact reduced nonzero supports and exact numerical bit costs cannot be
