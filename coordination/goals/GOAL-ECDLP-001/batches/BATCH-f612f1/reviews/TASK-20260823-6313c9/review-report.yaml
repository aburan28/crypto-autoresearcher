  recorded_at: "2026-08-23T17:32:46Z"
  joint_owned: J3-blind-support-width-traffic-bit-cost-and-exponent-census
  joint_verdict: breaks
  whole_claim_verdict: not_rendered
  summary: >-
    The semantic selector, base-B occurrence code, and power-sum packet are
    exact and collision-free for every frozen instance with B^5<p, p>64, and
    integer support size q<=64.  That algebraic fact does not supply the
    requested topology-derived evaluator or its cost certificate.  A fully
    explicit occurrence-basis circuit has target-dependent traffic
    Theta(B^5 log p) field multiplications for the selector, plus Theta(B^5)
    moment traffic, while a materialized coefficient-basis circuit reaches
    B^5 field words and dense multiplication/reduction boundaries.  The
    promised online B^(5/4+o(1)) and setup/state B^(9/4+o(1)) rectangle
    therefore does not follow from the statement without an additional named
    exact contraction or pruning theorem.  No representation-independent
    lower bound is claimed.
  claim_boundary: >-
    J3 only: support width, Minkowski/reduction growth, map traffic, live
    state, symbolic bit cost, collision census, and B-to-N exponent
    translation for the statement packet.  This report does not review J1,
    J2, J4, or J5 and does not decide the whole claim, hypothesis status,
    novelty, ECDLP complexity, lane closure, or breakthrough status.

  frozen_inputs:
    field: F_p with p prime
    dimension_symbol: D
    dimension_identity: D = B^5
    field_word_bits: beta = ceil(log_2(p))
    occurrence_index_set: "Omega=[0,B-1]^5"
    reconstruction_boundary: q<=64
    online_cap: B^(5/4+o(1))
    setup_state_cap: B^(9/4+o(1))
    experiment_runs: 0

  custody_checks:
    opening_head:
      expected: 942aa8fd56a082dc8bfe6f4fb88a945548ef5f4a
      observed: 942aa8fd56a082dc8bfe6f4fb88a945548ef5f4a
      matches: true
