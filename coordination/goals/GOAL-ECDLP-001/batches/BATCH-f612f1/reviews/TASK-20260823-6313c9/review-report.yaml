      exact_scope: requested complete census
    - id: J3-FINDING-03
      severity_for_joint: blocking_control_gap
      verdict: inconclusive
      statement: >-
        The separable-unary nearby object is not defined.  Additive and
        multiplicative interpretations have materially different support and
        contraction behavior, so the preregistered control cannot be scored
        exactly from the allowed packet.
      exact_scope: separable-unary control only
    - id: J3-FINDING-04
      severity_for_joint: positive_exact_subresult
      verdict: holds
      statement: >-
        CRT selector semantics, q=m_0, base-B injectivity, and Newton recovery
        are exact and collision-free for q<=64 under B^5<p and p>64.
      exact_scope: occurrence codes and moment faithfulness only

