  # ==================================================================
  # 1. Findings that STRENGTHEN the artifact
  # ==================================================================
  confirmations_that_strengthen_the_record:
    - id: RT-OK-1-every-HA2-literal-reproduces
      finding: >-
        All five gamma_x = 5/18 expectation literals reproduce byte-exactly as
        binary64 formatted to sixteen places, and all five E[X]/33 bounds
        reproduce byte-exactly at twelve places, including 1/66 at bits=18 and
        1/33 at the gamma_x = 1/3 ceiling. Recomputed from E[X] = N^(-1/3 +
        gamma_x) with N = 2^bits and the o(1) term set to zero; nothing was
        copied from any predecessor report.
    - id: RT-OK-2-Markov-supremum-is-genuinely-attained
      finding: >-
        C-HA2-2 is correct and is the record's most valuable clause. The law
        placing mass E[X]/33 at 33 and the rest at 0 is non-negative,
        integer-valued, has exactly the HA-2 mean, satisfies 33 <= 8*(L-1) at
        every ladder size, and attains P[X >= 33] = E[X]/33. So E[X]/33 is a
        maximum, not merely a supremum, and the per-tuple bound is tight. This
        clause is sound as written.
    - id: RT-OK-3-covering-construction-is-valid-at-the-two-tabulated-slices
      finding: >-
        The C-HA2-3 construction checks out. With arcs A_i = [i/m, i/m + p)
        modulo 1 and p >= 1/m, each arc contains [i/m, (i+1)/m), so the union
        is exactly [0,1) and the familywise overflow event has probability 1.
        The stated numeric condition holds with a wide margin: the smallest
        arc length on the tabulated slices is p = 0.009544856439 at gamma_x =
        5/18 and bits = 30, against 1/32768 = 0.000030517578125, a factor of
        312.8. Marginals are preserved by the modulo-1 wrap. The symmetric
        certificate X_i = 1[B_i] with P[B_i] = mu is likewise valid and gives
        probability 0.
    - id: RT-OK-4-the-sup-1-result-survives-my-own-independence-control
      finding: >-
        I ran the control the record did not: restrict the admissible laws by
        adding independence, which the design's seeded generation arguably
        supplies and which HA-2 does not. Under full independence across all
        32768 variables the familywise supremum is 1 - 3.274e-137 at gamma_x =
        5/18 and bits = 30, and 1 - 5.360e-218 at bits = 18. Under independence
        ACROSS the 32 curves with the covering coupling used WITHIN a curve
        (m' = 1024, and p >= 1/1024 still holds), it is exactly 1. So the
        record's vacuity conclusion at the tabulated slices is not an artifact
        of an exotic coupling. This strengthens C-HA2-3 materially and the
        record should say it.
    - id: RT-OK-5-deterministic-rows-and-their-provenance-are-exact
      finding: >-
        L = 2^(bits/3) gives 64/128/256/512/1024; 8*(L-1) gives
        504/1016/2040/4088/8184; the excesses over 32 are exactly
        472/984/2008/4056/8152, all five confirmed. Provenance also confirmed:
        the deep compiler's frozen selected_pair_comparisons row
        49545216/99876864/200540160/401866752/804519936 divided by 98304 gives
        504/1016/2040/4088/8184 exactly at every size. The arithmetic of item 3
        is not in doubt.
    - id: RT-OK-6-every-cap-residual-figure-reproduces-exactly
      finding: >-
        Archive: the by-size row sums to 5563755264; 5563755264 - 2307745600 =
        3256009664; dropping bits=30 leaves 2687695821, still over by
        379950221; dropping bits=30 and 27 leaves 1251071799 with slack
        1056673801; the required factor is 2.4109049386, strictly inside
        (2.41, 2.411); the fraction is 58.5218 percent. Communication:
        5614086912 - 2328717120 = 3285369792; factor 2.4108067329, strictly
        inside the same interval; fraction 58.5201 percent. Output: the twelve
        rows sum to 15520768; the first five sum to 8388608, exactly the cap
        and exactly 2^23; the remaining seven sum to 7132160, exactly the
        overage; 15520768/8388608 = 1.8502197265625 exactly; the fraction is
        45.9524 percent. Group additions slack 212875849 and logical traffic
        slack 55588266048 both confirmed. The alternative archive derivation
        7713503488 - 2307745600 = 5405757888 confirmed, and its provenance
        confirmed in the deep compiler as 1854585088 plus five times
        1171783680, with 5563755264 = 3 * 1854585088.
    - id: RT-OK-7-KAT-PEAK-D-and-all-four-siblings-are-arithmetically-correct
      finding: >-
        Recomputed from the fixture definitions, not read. KAT-PEAK-D
        occupancy is 1 / 15 / 1 / 3 / 1 over the five intervals, so the frozen
        formula gives 15. FORBIDDEN-R1 gives max_j max_t P_j = 3, since P_j =
        m_j + B_j = 1 + 2 for shards 1..7 on [4,9) and for shard 8 on [12,15).
        FORBIDDEN-R2 gives 8 * 3 = 24. FORBIDDEN-R3 gives 7*3 + 1 = 22 on
        [4,9). The dedup check D = 8 - 1 = 7 and 22 - 7 = 15 is right, the
        bracket 3 <= 15 <= 24 is right with S_solo = 0, and the
        proof_search_map's "disagree by 12 bytes" is 15 - 3. A gives 8 against
        R1's 1; B gives 1 against R2's 8; C gives 1 against R2's and R3's 8; E
        gives 1024 against integer-tick sampling's 0. All correct.
    - id: RT-OK-8-the-retained-bracket-is-a-valid-theorem
      finding: >-
        I verified the two bracket proofs rather than accepting them. Lower:
        S(t) >= m_j(t) for every j and t, so S + sum_j B_j >= m_j + B_j = P_j,
        hence the system peak dominates max_j max_t P_j. Upper: S = (bytes
        mapped by at least one shard) + S_solo <= sum_j m_j + S_solo, so
        S + sum_j B_j <= sum_j P_j + S_solo <= sum_j max_t P_j + max_t S_solo.
        The stated equivalence sum_j P_j - D = S + sum_j B_j is an identity
        given D = sum_j m_j - S. All three hold.
    - id: RT-OK-9-every-cited-hash-verifies-and-OBS-1-is-correct
      finding: >-
        The producer had no command surface and could compute no hash; I do
        and did. All six cited sha256 literals recompute exactly from the
        committed objects, including the predecessor specification
        535508e125327b23dca4dc45b200886102b71b3c6054e29e6b66c14b8ce7c6a4 at
        2ca69be4 and the deep compiler
        a4b24972ce934b14ef81c638164f3b26b3c53cd8ced0c59dbc0b3e0a3bc9724c. Both
        prior review-report hashes match. The snapshot receipt's three non-null
        path_sha256 values match the committed bytes at dd84e57d. The
        falsification criterion "a fabricated, predicted or uncited hash" is
        NOT triggered. Separately I confirm OBS-1 from the exact real:
        2^(-21/18) = 0.44544935907016965237..., whose half-up rounding at
        sixteen places ends 1697 while the stored binary64 literal ends 1696;
        bits 24, 27 and 30 agree under both conventions, so bits=21 is the only
        affected row, exactly as OBS-1 says.
    - id: RT-OK-10-the-eta-quotation-and-the-e04de4-citation-are-faithful
      finding: >-
        Role contract item 9 requires challenging load-bearing recalled
        citations. The eta_rule quotation underpinning the family-size
        correction is faithful to EXP-SYC-b11b38 at 2ca69be4, which reads
        "eta is a preregistered finite-size analysis stratum, not a new root
        draw. For each eta tuple the candidate_index occupancy equals that
        root/model X ... eta does not multiply occupancy inside a tuple." And
        after deriving the range myself I checked the citation: TASK-20260813-
        e04de4 does report 0.009544856439_to_0.015151515152. Both citations are
        accurate.
    - id: RT-OK-11-the-output-cap-intent-claim-is-corroborated-and-its-minimal-set-is-right
      finding: >-
        The record asserts the output cap "was sized for exactly the four
        packed streams plus the coverage-counter reserve and for nothing else".
        That is an intent claim, and I checked it: the deep compiler's
        resource_crosswalk declares target_V_and_S_packed_bytes 3932160,
        decoy_V_and_S_packed_bytes 3932160 and
        coverage_counter_and_receipt_metadata_cap_bytes 524288 against
        redesigned_successor_output_cap_bytes 8388608. The intent claim is
        corroborated. I also verified by exhaustive enumeration that among drop
        sets preserving all four packed streams, all seven auxiliaries are
        REQUIRED: the largest six-subset of them reaches only 7123968, short of
        7132160. The record's minimality claim in its own class is correct.
    - id: RT-OK-12-scope-discipline-against-transfer-is-clean
      finding: >-
        I searched specifically for a crypto-scale, asymptotic, multi-target,
        reusable-advice or transfer reading and found none. The 179.2-bit
        figure is the only number with transfer-misreading potential and it is
        explicitly fenced as ARITHMETIC ONLY in the same clause. The claim
        boundary correctly identifies item (b) as a statement about a
        heuristic's reach and not about H-SYC-b854f4's truth, ECDLP or any
        curve. The rho baseline constant 0.886*sqrt(N) is correct, being
        sqrt(pi*N/4) = 0.8862*sqrt(N), and its framing as the unchallenged
        program baseline is accurate. Both artifacts parse strictly and I
        scanned every mapping in both for a null key from a split flow mapping
        and found none; the disclosed repair round held.

  # ==================================================================
  # 2. Objections
  # ==================================================================
  objections:

    - id: RT-OBJ-A
      severity: blocking_for_item_b
      target: 'specification clause C-HA2-1, kind: definite_negative_fact'
      title: 'an upper bound that exceeds 32 is not a proof that 32 is exceeded'
      objection: >-
        C-HA2-1 states "X <= 8*(L-1) deterministically ... The bound exceeds
        capacity 32 at every ladder size, so capacity 32 is NOT worst-case
        adequate. This is settled, not merely unproved." That inference does
        not go through. 8*(L-1) is an UPPER bound on X; the true worst case
        lies somewhere in [0, 8*(L-1)] and nothing in the record, the
        successor's read scope, or the inherited compiler exhibits a single
        configuration in which X attains 33. From an upper bound of 504 you
        cannot conclude that 32 is insufficient any more than from an upper
        bound of 504 you can conclude that 400 is attained. The supported
        statement is exactly the one the inherited compiler itself uses and
        the successor strengthened without adding an argument: "no artifact
        anywhere in this document ... can certify worst-case safety of the
        fixed-32 cap." Non-certification is not settled inadequacy. The clause
        is one of the three legs of the batch's headline output and it is
        labelled definite_negative_fact, so the mislabel is load-bearing.
      cheapest_falsification_or_repair: >-
        Either restate the clause as non-certification, which costs one
        sentence and loses nothing the record actually needs, or exhibit one
        (curve, root, model) configuration in which 33 distinct exact-equality
        candidates are simultaneously realizable under the frozen selection
        and retention rules. The first is free; the second is a genuine open
        combinatorial question about the selector.

    - id: RT-OBJ-B
      severity: blocking_for_item_b
      target: 'residual B-R1, and C-HA2-3 symmetric_certificate force paragraph'
      title: 'the record refutes its own "no tail is derivable" three clauses earlier'
      objection: >-
        B-R1 asserts "No finite-N tail, concentration, or familywise overflow
        bound is derivable from HA-2 as currently stated ... a proved
        impossibility", and C-HA2-3 asserts "HA-2 is therefore completely
        uninformative about overflow, in the exact sense that it excludes no
        possible answer". Both are false as written and are refuted by
        C-HA2-2 in the same file. C-HA2-2 IS a finite-N tail bound derived
        from HA-2 alone: P[X >= 33] <= E[X]/33, numerically between
        0.009544856439 and 0.015151515152 across the ladder at gamma_x = 5/18.
        HA-2 therefore excludes every per-tuple answer above 0.01515 and is
        emphatically not "completely uninformative about overflow". What is
        actually established is narrower and should be stated that way: no
        NON-VACUOUS FAMILYWISE bound is derivable from HA-2 alone AT THE FROZEN
        FAMILY SIZE AND CAPACITY. B-R1 in its present form also carries the
        blocking clause "any capacity-adequacy claim, now and under any future
        argument from HA-2 alone", which inherits the same over-breadth.
      cheapest_falsification_or_repair: >-
        Read C-HA2-2 and B-R1 side by side. Repair costs one qualifier:
        insert "familywise, at m = 32768 and capacity 32" into B-R1 and delete
        the "completely uninformative" sentence, which the record does not
        need for any of its actual conclusions.

    - id: RT-OBJ-C
      severity: blocking_for_item_b
      target: 'C-HA2-3, C-HA2-4, B-R1, success_criterion, and the design-repair-report summary'
      title: >-
        the null-object control the record owed and did not run: at the
        record's own preregistered gamma_x = 0/1 and bits = 30, the first-
        moment familywise bound is NON-VACUOUS and the covering construction
        fails its own stated hypothesis
      objection: >-
        H-SYC-b854f4's frozen test_boundary declares FOUR preregistered
        coverage_gamma_values: 0/1, 5/18, 3/10 and 1/3. The record evaluates
        TWO of them. gamma_x = 0/1 is not an arbitrary extra point: it is the
        hypothesis's own declared leading null, named twice in the same record
        ("gamma_s=0 gives probability N^(-1/3+o(1)), ... the memory-matched
        BSGS boundary", and "a balanced antisymmetric odd-prime cyclic label is
        the gamma_s=0 leading null"). I evaluated the record's own closed form
        there. At gamma_x = 0/1 and bits = 30, E[X] = 2^(-10) = 0.0009765625,
        the first-moment familywise bound is 32768 * 2^(-10) / 33 = 32/33 =
        0.969696969697, which is STRICTLY LESS THAN 1 and therefore
        non-vacuous, derived from HA-2 alone; and the arc length p = E[X]/33 =
        2.959280e-05 is STRICTLY LESS THAN 1/32768 = 3.051758e-05, so the
        C-HA2-3 covering construction fails the very hypothesis the record
        lists in its own checks, the arcs do not cover [0,1), and the
        familywise supremum there is 32/33 rather than 1. The exact crossing is
        gamma_x <= 1/3 - (15 - log2(33))/bits, which is -0.21975588,
        -0.14074314, -0.08148358 and -0.03539281 at bits 18, 21, 24 and 27,
        hence empty for admissible gamma_x >= 0, and +0.00147980 at bits = 30,
        hence non-empty and containing the null. Consequently: C-HA2-4's "no
        reparameterisation inside the frozen ladder can rescue it" is false;
        B-R1's "permanently under HA-2 as stated" is false; the
        success_criterion's "capacity adequacy is not derivable from HA-2 at
        all" is false; and the design-repair-report's "it will never be closed
        by a better argument from the current heuristic" is false. This is the
        artifact tell docs/inventor-protocol.md section 3 asks for: the
        reported quantity is not flat, it varies smoothly with gamma_x and
        crosses 1 near the null at the top of the ladder, and the record
        tabulated only the two slices where it does not cross.
      pointed_note_on_the_family_size_correction: >-
        The record's own 98304 -> 32768 correction is what OPENS this window.
        Under the inherited m = 98304 the crossing gamma is -0.05135228 at
        bits = 30 and negative at every other size, so the blanket claim would
        have held. The record's stated reasoning for the correction is
        CORRECT -- a smaller m makes vacuity harder to demonstrate, so
        demonstrating it is a stronger result -- and it is precisely that
        conservatism which breaks the blanket sentences. The defect is not the
        correction; the defect is that the blanket sentences were not
        re-checked after it was applied.
      cheapest_falsification_or_repair: >-
        One line of arithmetic already inside the record's own frozen scope:
        evaluate min(1, 32768 * 2^(bits*(gamma_x - 1/3)) / 33) at
        gamma_x = 0/1 and bits = 30 and record 32/33.

    - id: RT-OBJ-D
      severity: blocking_for_item_b
      target: 'C-HA2-6 ROUTE-A, source_heuristic.what_it_does_not_supply, method_ceiling_reached_here, B-R1'
      title: >-
        the second moment the record says would be needed is ALREADY a
        numbered heuristic in the same hypothesis record: HA-3
      objection: >-
        The entire item-(b) architecture rests on "HA-2 supplies the first
        moment and nothing else", and C-HA2-6 ROUTE-A accordingly says a NEW
        numbered heuristic, provisionally HA-2T, would be required. But
        H-SYC-b854f4's heuristic_assumptions list -- the same list the record
        read to obtain HA-2 -- contains HA-3-subpolynomial-root-clustering:
        "For gamma_x<1/3, kappa_N = E[X^2]/E[X] = N^o(1), Y/max(1,X) = N^o(1),
        and p_N/E[X] = N^o(1) with exponent zero." That is a second-moment
        heuristic about the SAME X, already explicit, already numbered, already
        validated to exactly the same degree as HA-2 (which is to say not at
        all), and applicable at gamma_x = 5/18, the decision-changing slice the
        record tabulates in full. Two consequences, both recomputed by me:
        (i) Under the record's OWN frozen arithmetic convention, o(1) := 0, we
        get kappa_N = 1, hence E[X^2] = E[X], hence E[X(X-1)] = 0; since X is a
        non-negative integer, X(X-1) >= 0 pointwise, so X(X-1) = 0 almost
        surely and X is Bernoulli. Then P[X >= 33] = 0 EXACTLY, per tuple and
        familywise, and the C-HA2-3 covering law -- which has X in {0,33} and
        hence kappa = 33 -- is INADMISSIBLE. Under HA-2 plus HA-3 plus the
        record's own convention, capacity 32 is certified, not merely
        un-refuted.
        (ii) Without the o(1) := 0 convention, with kappa_N = K a constant (and
        K >= 1 is forced, since X^2 >= X for non-negative integers), the exact
        per-tuple maximum of P[X >= 33] subject to E[X] = mu and E[X^2] = K*mu
        is (K-1)*mu/1056, attained by the three-point law with mass q at 33,
        r at 1 and the remainder at 0, where 33q + r = mu and 1089q + r = K*mu
        give q = (K-1)*mu/1056, valid while K <= 33. The familywise
        first-moment bound 32768*(K-1)*mu/1056 is then NON-VACUOUS whenever
        kappa_N <= 1.064453 at bits=18, 1.072346 at bits=21, 1.081206 at
        bits=24, 1.091150 at bits=27, or 1.102313 at bits=30 -- a natural
        regime, and exactly the near-Bernoulli regime the inherited compiler's
        own DERIV-1 describes.
        Therefore method_ceiling_reached_here ("the strongest available result
        was a proved impossibility") is wrong: the strongest available result
        was the HA-3 bound, obtainable with no new heuristic, no hypothesis
        amendment and no write-scope expansion. C-HA2-6 is the one clause that
        claims to enumerate what would suffice, and it is incomplete precisely
        there.
      scope_discipline_i_impose_on_my_own_objection: >-
        This does NOT establish capacity adequacy and I do not claim it does.
        HA-3 is unvalidated exactly as HA-2 is, its o(1) is equally
        uncontrolled, and the consequence "X is Bernoulli almost surely" is so
        strong that it is itself evidence the o(1) := 0 convention is too
        aggressive to carry ANY safety conclusion. That is the real finding:
        the frozen convention is load-bearing in both directions, and the
        record deployed it only in the direction that produces a negative.
      cheapest_falsification_or_repair: >-
        Read H-SYC-b854f4's heuristic_assumptions.rows entry HA-3 and apply
        Markov to X^2. Two lines. Add it to C-HA2-6 as ROUTE-D with its
        conditionality stated as plainly as ROUTE-A's.

    - id: RT-OBJ-E
      severity: material_non_blocking
      target: 'family_size_correction versus C-HA2-1, and OBS-2'
      title: 'the 32768 reading and the 8*(L-1) row cannot both be unexamined'
      objection: >-
        The deterministic bound is derived by the deep compiler as
        selected_pair_comparisons[bits] / 98304, dividing the census by
        exactly the tuple count the record now says overstates the distinct
        random variables threefold. Two readings exist and the record commits
        to neither. Under reading (i), each eta stratum is a separate physical
        recomputation on the same seeds, so 8*(L-1) per stratum is right AND
        the family-size correction is right -- but then roughly two thirds of
        selected_pair_comparisons is deterministic recomputation of a quantity
        already known, which is a cost-model fact of some consequence. Under
        reading (ii), eta is a labelling only, so the census must be divided by
        32768 and the per-variable deterministic bound is 24*(L-1) =
        1512/3048/6120/12264/24552, making the "exceeds_capacity_by" rows
        1480/3016/6088/12232/24520 rather than the recorded
        472/984/2008/4056/8152. The record asserts the 32768 count in clauses
        C-HA2-3 and C-HA2-4 and carries the 8*(L-1) rows in C-HA2-1 marked
        inherited_unchanged, without saying which reading reconciles them. The
        conclusion's direction is unaffected either way; the record's internal
        consistency is not.
      cheapest_falsification_or_repair: >-
        One sentence naming the reading, plus, if reading (i), one sentence
        noting the threefold recomputation and carrying it forward.

    - id: RT-OBJ-F
      severity: blocking_for_item_c
      target: 'replacement_rule.frozen_formula and quantities'
      title: 'the frozen system-peak formula has no term for the setup process'
      objection: >-
        The frozen rule is system_peak_live_bytes = max_t ( S(t) + sum_{j=1..8}
        B_j(t) ), where S is bytes live in SHARED regions and B_j is bytes live
        in SHARD j's NON-shared regions for j = 1..8. The record's own time_base
        declares "all eight shards AND THE SETUP PROCESS co-located on a single
        host". The setup process's private, non-shared allocations belong to no
        shared region and to no B_j, so the frozen formula omits them entirely
        and returns zero for a host holding only setup allocations. This is not
        hypothetical: the inherited compiler's fixed_window_table_precompute
        builds tables over 160 curves and 6 windows, and stages S0 and S3b are
        setup stages, so setup-resident memory demonstrably exists in this
        design. The budget's maximum_memory_gb = 2 is a HOST-level quantity,
        which is exactly the quantity the formula fails to compute. No
        FORBIDDEN-R rule covers the omission either: FORBIDDEN-R6 covers a
        missing SHARD stream only. Item (c) is a replacement-rule repair, so a
        completeness hole in the replacement rule is a defect in the deliverable
        itself, not a residual.
      cheapest_falsification_or_repair: >-
        One fixture, KAT-PEAK-F: the setup process allocates 4096 private
        non-shared bytes live on [0,20); no shard allocates anything; no shared
        regions exist. True system peak 4096; the frozen formula returns 0.
        Repair is to extend the sum to j = 0..8 with B_0 the setup process's
        non-shared bytes, and to add FORBIDDEN-R7 for omitting it.

    - id: RT-OBJ-G
      severity: material_non_blocking
      target: 'retained_bracket, static_kat_fixtures, completeness_claim, units'
      title: 'four smaller defects in the peak contract, each repairable in one or two lines'
      objection: >-
        (1) No fixture exercises S_solo > 0 or partial sharing. In all five,
        S_solo = 0 and every shared region is mapped by all eight shards or by
        none, so the max_t S_solo(t) term of the bracket's upper bound is never
        tested and neither is a negative D(t). D can go negative: one 100-byte
        shared region mapped by nobody plus a 1-byte region mapped by all eight
        gives D = 8 - 101 = -93, which the label "the deduplication term"
        conceals while the algebra remains correct.
        (2) equivalent_form_from_per_shard_totals is misnamed: computing
        max_t (sum_j P_j(t) - D(t)) requires S(t), a global quantity no shard
        reports, so the form is NOT obtainable from per-shard totals alone.
        Relatedly, P_j(t) = B_j(t) + m_j(t) is an instrumentation ASSUMPTION --
        a shard reporting resident set size after copy-on-write, or
        double-mapping a region, breaks it -- and is nowhere flagged as one.
        (3) The completeness_claim understates the fixtures. "R5 and R6 ... have
        no numeric fixture, which is stated rather than papered over" is a
        choice, not a necessity: KAT-PEAK-A already discriminates both, since
        omitting shard 8 returns 7 against an expected 8, and dividing by the
        shard count returns 1 against an expected 8. Two extra entries in A's
        values_under_rejected_rules would make it a four-rule discriminator.
        (4) units declares "times are abstract ticks" while KAT-PEAK-E is live
        on [5.4, 5.6). A tick that admits 5.4 is not a tick; the fixture is
        well-posed only under a real-valued monotonic clock with an integer
        sampling grid, which is what it is actually testing.
      cheapest_falsification_or_repair: >-
        For (1), KAT-PEAK-G: shared region R_a of 1 byte mapped by shards 1-4
        on [0,10), shared region R_b of 1 byte mapped by NO shard on [0,10), no
        non-shared bytes; expected peak 2, while a rule defining S as "shared
        bytes mapped by at least one shard" returns 1. For (2), (3) and (4),
        rename the form, add the two entries, and fix the unit sentence.

    - id: RT-OBJ-H
      severity: material_non_blocking
      target: 'repair_item_D archive derivation_bracket.why'
      title: 'the adoption rationale for 3256009664 is backwards, and its tie-break is an appeal to authority'
      objection: >-
        The record states, correctly, that "Carrying 3256009664 as if it were a
        unique quantity would understate the deficit", and then adopts it, on
        the ground that it is "the conservative one for the purpose of NOT
        overstating the problem's size in any direction that would justify
        raising a cap". For the operative decision -- how large an amendment,
        or how deep a scope cut, is required -- the LARGER figure is the
        conservative one. A cap raised to clear 3256009664 still fails under
        the alternative derivation by 2149748224 bytes. Adopting the smaller
        figure makes a smaller raise look sufficient, which is the direction
        that makes an inadequate amendment easier to pass, not harder. The
        second stated reason, "it is the figure both provenance-clean reviews
        recomputed", is an appeal to authority: those reviews recomputed the
        ARITHMETIC of the x3 derivation, which I have also now recomputed and
        confirm; they did not adjudicate the CHOICE between two derivations,
        and a recomputation cannot confer that.
      cheapest_falsification_or_repair: >-
        Carry the residual as the interval [3256009664, 5405757888] with
        5405757888 as the planning figure. Zero new derivation required; both
        endpoints are already in the record.

    - id: RT-OBJ-I
      severity: material_non_blocking
      target: 'repair_item_D archive residual, and OBS-4'
      title: 'the adopted x3 triples an output reserve that the output cap does not allow'
      objection: >-
        The deep compiler records archive_hashing's primitive_formula as
        "exact_SHA256_reads_hashes_and_manifest_writes_including_8388608_new_
        output_bytes" and states that archive_hashing's n_c IS
        archive_scheduled_bytes measured directly in bytes. The adopted repair
        multiplies that entire population by three. So the adopted archive
        schedule now implicitly charges 3 * 8388608 = 25165824 bytes of "new
        output", while the output hard cap is 8388608 and the output
        requirement is 15520768. Three mutually inconsistent output-byte
        figures coexist inside one accounting. The magnitude, 16777216 bytes of
        double charge, is small against 3256009664 and changes no verdict, but
        it demonstrates that "exact" is the wrong word for the archive
        residual: it is exact arithmetic over an inexact derivation. OBS-4
        concedes the derivation is inferred; the top-level presentation of
        over_cap_bytes: 3256009664 as a bare integer does not.
      cheapest_falsification_or_repair: >-
        Read the primitive_formula string in the deep compiler alongside the
        x3 rationale. Repair is one disclosure sentence under OBS-4.

    - id: RT-OBJ-J
      severity: material_non_blocking
      target: 'residual D-R4-no-lossless-representation-found'
      title: 'a closure without a search, standing beside a candidate the record itself named'
      objection: >-
        D-R4 sits in a list of exact residuals and reads as a finding, with the
        note "This task did not conduct a new search for one." Per
        docs/inventor-protocol.md section 4 and my role contract item 7, "we
        did not look" is a fatigue report about the search, not a statement
        about the object, and it should be labelled as one. It is also not the
        case that no candidate was in view: the record's own OBS-2 identifies a
        threefold redundancy in the eta stratification of the candidate index,
        and the SAME factor multiplies candidate_slots_per_size, which is
        3145728 = 98304 * 32 and would be 32768 * 32 = 1048576 under 32768
        distinct variables. archive_hashing sits in the "candidate" consumer
        column. Purely as arithmetic: 5563755264/3 = 1854585088 fits the
        unchanged archive cap 2307745600 with slack 453160512, and
        5614086912/3 = 1871362304 fits the unchanged communication cap
        2328717120 with slack 457354816, while the output requirement is
        unaffected and remains over by 7132160. The required archive reduction
        factor is 2.4109, and 3 exceeds it. I am NOT proposing this and it must
        not be adopted: whether the redundancy is losslessly eliminable is
        unestablished, stage S2 is "eta-complete-coverage" so the strata may
        carry independent custody obligations, and archive_hashing's per-byte
        formula does not exist anywhere (OBS-4), so its scaling with the eta
        count is unknown. Note carefully that this eta three is NOT the
        mount-state three behind the x3 repair -- 3145728 already contains the
        eta factor, and 3145728 -> 9437184 is the separate mount-state
        expansion -- so this is not "undo the repair", and the numerical
        coincidence that 5563755264/3 returns the unrepaired predecessor total
        is a coincidence of two independent threes and must not be read
        otherwise.
      cheapest_falsification_or_repair: >-
        Relabel D-R4 as "not searched" rather than "not found", and file the
        eta-redundancy question as a named open lead for a task that holds cap
        and scope authority. The lead is refuted the moment anyone shows that
        the three eta strata carry independent archive or custody obligations,
        which is one paragraph of the custody contract away.

    - id: RT-OBJ-K
      severity: material_non_blocking
      target: 'repair_item_D output itemisation force paragraph'
      title: 'the exact overage identity is definitional, and 23 smaller fitting drop sets exist'
      objection: >-
        Given RT-OK-11's confirmation that the cap was DEFINED as the sum of
        the first five rows, the identity 1966080*4 + 524288 = 8388608 restates
        that definition and "the exact overage identity" is its arithmetic
        complement. It carries no information beyond the definition, yet it is
        presented with force. Worse, the attribution of the overage to those
        particular seven artifacts is a labelling of one partition, not a fact
        about which artifacts cause the overage: an over-cap total is a total.
        I enumerated every subset of the twelve rows. The MINIMUM-CARDINALITY
        drop sets that fit the unchanged cap contain FOUR artifacts, and there
        are 23 of them; the smallest by bytes removes 7208960 and is, for
        example, one packed stream together with noninterference-coverage.json,
        executable-universe.json and rho-baseline.jsonl. The record's
        seven-artifact set is minimal only within the class that preserves all
        four packed streams, which is a real and defensible restriction but is
        a POLICY choice, not an arithmetic one. So "the identity is recorded so
        that the future amendment decision is arithmetic rather than
        negotiation" is not supported: the decision is a choice among at least
        24 fitting sets with no declared obligation-weight ordering, which is a
        negotiation with arithmetic bounds.
      cheapest_falsification_or_repair: >-
        Enumerate the fitting drop sets, which is seconds of arithmetic, and
        either declare the obligation-weight ordering that makes the
        packed-stream-preserving class mandatory, or drop the "rather than
        negotiation" claim.

    - id: RT-OBJ-L
      severity: material_non_blocking
      target: 'pareto_honesty.dominated_by'
      title: 'dominated_by is n/a on the ground that no result is claimed, while the record claims a result'
      objection: >-
        pareto_honesty.dominated_by reads 'n/a (no result claimed)'. The same
        record states that "the strongest available result was a proved
        impossibility, and it was obtained rather than asserted" and that "Two
        collisions are now resolved rather than disclosed". If item (b) is a
        result -- and the batch's framing says it is the batch's most valuable
        output -- then it carries a comparison obligation and n/a is not a
        checked field. On the axis that matters, informativeness about the
        overflow event at the frozen parameters, item (b) is DOMINATED by the
        HA-3 second-moment derivation of RT-OBJ-D, available at zero cost from
        the same hypothesis record. Two further axes are unchecked: on MEMORY,
        C-R3 concedes peak_live_bytes has no declared hard cap and no identity
        binding it to maximum_memory_gb = 2, so the record cannot place itself
        on the memory axis at all even though item (c) is a memory-axis
        deliverable; and the baseline sentence names only Pollard rho, on the
        time axis, with no BSGS memory row and no k-list row, the latter openly
        deferred as RT-OBJ4. My role contract instructs me not to read past
        this field, and read properly it is unchecked on two of three axes.
      cheapest_falsification_or_repair: >-
        Replace n/a with either "no result claimed AND item (b) withdrawn as a
        result", or an explicit three-axis comparison whose informativeness row
        names the HA-3 route as the dominating alternative.

    - id: RT-OBJ-M
      severity: material_non_blocking
      target: 'replacement_rule.time_base.evaluation'
      title: 'exact event-time evaluation has an uncharged cost that lands on the open item (d)'
      objection: >-
        "the maximum over t is evaluated EXACTLY over the finite set of event
        times, not by periodic sampling" requires logging every allocation and
        every free across eight shards, with per-region shared/non-shared
        attribution and, for D(t), the per-shard mapping set at every instant.
        No bound on the event count appears anywhere, no allocator or /proc
        counter supplies that attribution natively, and the event stream's own
        bytes and its own resident memory are charged in none of the archive,
        communication or output schedules -- two of which are already over cap
        by 3256009664 and 3285369792 bytes. For a design scheduled at 2267225191
        group additions and 790546390912 logical bytes this is not a rounding
        term. An omitted end-to-end cost that lands on the one item the record
        already cannot close is not a residual, it is an enlargement of it.
      cheapest_falsification_or_repair: >-
        State an upper bound on the allocation-event count per stage and add
        the resulting event-log bytes to the archive schedule, or replace
        "exact over all events" with "exact over a declared, bounded event
        alphabet" and say which allocations are instrumented.

    - id: RT-OBJ-N
      severity: presentational
      target: 'C-HA2-4 non_vacuity_threshold, and the "entire interval [0,1]" claim'
      title: 'two presentational items, one of which is the most quotable number in the file'
      objection: >-
        (1) The threshold 179.2009 is arithmetically exact and correctly fenced
        as ARITHMETIC ONLY, and I confirm both. It is nonetheless a bit-length
        extrapolated roughly sixfold beyond the tested ladder while the family
        size stays pinned at a design constant, 32 curves times 256 roots times
        4 models, that has nothing to do with bits. It is the one figure in the
        file most likely to be lifted out of its fence. The identical content
        is carried by the condition E[X] <= 33/32768 = 0.001007080078125, which
        cannot be misread as a bit-length claim. (2) C-HA2-3 asserts the
        familywise probability "ranges over the entire interval [0, 1], both
        endpoints attained" but exhibits only the endpoints. The claim is TRUE
        -- mixing the two exhibited laws with weight q preserves every marginal
        mean and gives familywise probability exactly q -- but the record does
        not say so, and a reviewer checking only what is written sees two
        points asserted to be an interval.
      cheapest_falsification_or_repair: >-
        State the threshold as the mean condition and keep the bit form in a
        footnote if at all; add the one-line mixture argument.

  # ==================================================================
  # 3. Scope-blurring sentences, as the task card required
  # ==================================================================
  scope_blurring_sentences_flagged:
    instruction_restated: >-
      Item (b) is a claim about the reach of a heuristic AS WRITTEN. It is not
      a claim about H-SYC-b854f4's truth, not about ECDLP, not about any curve.
      I was asked to flag any sentence that blurs that line. I found none that
      blurs it toward ECDLP, curves or cryptographic scale; the record's
      discipline there is clean and repeatedly restated. Every sentence below
      blurs a DIFFERENT line: from "HA-2 alone, at the frozen parameters, at
      two gamma slices" to "the heuristic, permanently, at all parameters".
    sentences:
      - location: 'specification C-HA2-1.statement'
        text_quoted: 'capacity 32 is NOT worst-case adequate. This is settled, not merely unproved.'
        defect: 'non-certification restated as settled inadequacy; see RT-OBJ-A'
      - location: 'specification C-HA2-3.symmetric_certificate.force'
        text_quoted: 'HA-2 is therefore completely uninformative about overflow, in the exact sense that it excludes no possible answer.'
        defect: 'refuted per-tuple by C-HA2-2 in the same file; see RT-OBJ-B'
      - location: 'specification C-HA2-3.statement'
        text_quoted: 'no cleverer argument from HA-2 as currently stated can do better'
        defect: >-
          true only at the two tabulated gamma_x slices and at the frozen family
          size; false at the preregistered gamma_x = 0/1 with bits = 30, where
          the same first-moment route yields 32/33; see RT-OBJ-C
      - location: 'specification C-HA2-4.non_vacuity_threshold.scope_of_that_statement'
        text_quoted: 'no reparameterisation inside the frozen ladder can rescue it'
        defect: 'falsified at gamma_x = 0/1, bits = 30, a preregistered coverage value of this same ladder; see RT-OBJ-C'
      - location: 'specification residual B-R1'
        text_quoted: 'No finite-N tail, concentration, or familywise overflow bound is derivable from HA-2 as currently stated.'
        defect: 'C-HA2-2 is a finite-N tail bound derived from HA-2; see RT-OBJ-B'
      - location: 'specification success_criterion'
        text_quoted: 'repair item B establishes that capacity adequacy is not derivable from HA-2 at all'
        defect: 'over-broad on both the gamma_x axis and the HA-3 axis; see RT-OBJ-C and RT-OBJ-D'
      - location: 'specification proof_search_map.method_ceiling_reached_here'
        text_quoted: 'the strongest available result was a proved impossibility, and it was obtained rather than asserted'
        defect: 'the strongest available result was the HA-3 second-moment bound; the ceiling reached was self-imposed; see RT-OBJ-D'
      - location: 'design-repair-report residuals_remaining_open_plainly.summary'
        text_quoted: 'capacity adequacy is not derivable from HA-2 at all, so it will never be closed by a better argument from the current heuristic'
        defect: >-
          "the current heuristic" is singular for a hypothesis carrying seven
          numbered heuristics, one of which supplies exactly the missing moment;
          and "never" is falsified at the null gamma slice; see RT-OBJ-C and
          RT-OBJ-D
    crypto_scale_or_transfer_readings_found: 0
    toy_ladder_discipline: >-
      Confirmed throughout. scope.evidence_tier is toy, transfer_authorized is
      false, cryptographic_scale_claim is forbidden, and the limitations block
      restates it. Nothing in either artifact reads as an asymptotic,
      multi-target, reusable-advice or live-key claim.

  # ==================================================================
  # 4. Required controls
  # ==================================================================
  required_controls:
    - id: CTRL-1-null-gamma-row
      priority: 1
      control: >-
        Evaluate the record's own closed form at ALL FOUR preregistered
        coverage_gamma_values of H-SYC-b854f4 -- 0/1, 5/18, 3/10 and 1/3 -- at
        all five ladder sizes, and record the crossing gamma_x = 1/3 -
        (15 - log2(33))/bits per size.
      what_it_would_show: >-
        That the reported vacuity is a function of gamma_x and crosses 1 at
        (0/1, bits=30), where the first-moment familywise bound is 32/33 and
        the covering construction fails its own hypothesis.
      cost: 'one line of arithmetic; zero runs; inside the frozen scope'
      null_object_role: >-
        This IS the null-object control docs/inventor-protocol.md section 3
        demands. gamma_x = 0/1 is the record's own declared leading null, not
        an outside object.
    - id: CTRL-2-HA3-second-moment-route
      priority: 2
      control: >-
        Apply Markov to X^2 using HA-3's kappa_N = E[X^2]/E[X], and record both
        the o(1) := 0 consequence (X Bernoulli, overflow probability exactly 0)
        and the constant-kappa consequence (per-tuple maximum (kappa-1)*mu/1056;
        familywise non-vacuous for kappa <= 1.0645 to 1.1023 across the ladder).
      what_it_would_show: >-
        That the missing moment is already numbered in the same hypothesis
        record, that C-HA2-6's option list is incomplete, and that the frozen
        o(1) := 0 convention is load-bearing in BOTH directions.
      cost: 'two lines of arithmetic; zero runs; no hypothesis amendment'
    - id: CTRL-3-independence-restriction
      priority: 3
      control: >-
        Recompute the familywise supremum under an added independence
        restriction, both across all 32768 variables and across the 32 curves
        only, and record 1 - (1-p)^32768 and the within-curve variant.
      what_it_would_show: >-
        That C-HA2-3's conclusion at the tabulated slices is robust to the most
        obvious objection to its coupling -- the shortfall from 1 is 3.27e-137
        at bits=30 -- and that the sup is exactly 1 under across-curve
        independence. This STRENGTHENS the record and belongs in it.
      cost: 'one line of arithmetic; zero runs'
    - id: CTRL-4-KAT-PEAK-F-setup-process
      priority: 4
      control: >-
        Add a fixture in which only the setup process allocates: 4096 private
        non-shared bytes live on [0,20), no shard allocation, no shared region.
      what_it_would_show: >-
        That the frozen formula returns 0 against a true system peak of 4096,
        exposing the missing B_0 term. This is the cheapest falsification of
        item (c)'s central deliverable.
      cost: 'one fixture specification; zero runs'
    - id: CTRL-5-KAT-PEAK-G-partial-sharing-and-S-solo
      priority: 5
      control: >-
        Add a fixture with a 1-byte shared region mapped by shards 1-4 and a
        1-byte shared region mapped by no shard, both live on [0,10), no
        non-shared bytes; expected peak 2.
      what_it_would_show: >-
        That the bracket's max_t S_solo(t) term and a negative D(t) are
        currently untested, and that a plausible misreading of S as
        "shared bytes mapped by at least one shard" returns 1.
      cost: 'one fixture specification; zero runs'
    - id: CTRL-6-attainability-of-33
      priority: 6
      control: >-
        Either exhibit one configuration realizing 33 simultaneous distinct
        exact-equality candidates for a single tuple under the frozen selection
        and retention rules, or restate C-HA2-1 as non-certification.
      what_it_would_show: >-
        Whether the deterministic leg of item (b) is a proved negative or an
        unproved one. Until one of the two is done it is the latter.
      cost: 'a paragraph of combinatorics, or one sentence; zero runs'
    - id: CTRL-7-output-drop-set-enumeration
      priority: 7
      control: >-
        Enumerate every subset of the twelve output rows that fits 8388608, and
        publish the minimum-cardinality sets alongside the packed-stream-
        preserving set already recorded.
      what_it_would_show: >-
        That 23 four-artifact sets fit and that the recorded seven-artifact set
        is minimal only under an undeclared policy restriction.
      cost: 'seconds of arithmetic; zero runs'

  # ==================================================================
  # 5. Counterexample / mutation
  # ==================================================================
  counterexample_or_mutation: >-
    The decisive counterexample is a MUTATION OF ONE PARAMETER THE RECORD
    ALREADY FROZE. Hold the record's own closed form, family size m = 32768,
    capacity 32 and ladder fixed; move gamma_x from 5/18 to 0/1, which is one
    of the four preregistered coverage_gamma_values in H-SYC-b854f4's own
    test_boundary and the hypothesis's declared leading null. At bits = 30 the
    first-moment familywise bound becomes 32768 * 2^(-10) / 33 = 32/33 =
    0.969696969697 < 1, so a NON-VACUOUS familywise overflow bound IS derivable
    from HA-2 alone; and the arc length p = 2.959280e-05 falls below
    1/32768 = 3.051758e-05, so the C-HA2-3 covering construction fails the
    hypothesis listed in its own checks and its supremum-equals-1 conclusion
    does not run there. One parameter, one line, and four blanket sentences
    fall. The second mutation is orthogonal and equally cheap: keep gamma_x =
    5/18 and add HA-3, already numbered in the same hypothesis record; under
    the record's own o(1) := 0 convention kappa_N = 1 forces X into {0,1}
    almost surely, the C-HA2-3 covering law (kappa = 33) becomes inadmissible,
    and the overflow probability is exactly 0. Neither mutation shows capacity
    32 is adequate. Both show the record's negative is a statement about one
    heuristic at two parameter values, not about the heuristic's reach.

  # ==================================================================
  # 6. Baseline comparison
  # ==================================================================
  baseline_comparison:
    applicability: >-
      The record claims no attack, cost or speedup, so the ECDLP baselines are
      not challenged by it and I do not treat them as challenged. What follows
      is the comparison the record's own claimed result requires.
    pollard_rho: >-
      Stated as 0.886*sqrt(N) group operations with vOW parallelization and
      negligible live storage. I checked the constant: the expected iteration
      count is sqrt(pi*N/4) = 0.8862*sqrt(N). The figure and the framing are
      correct and correctly scoped; the record does not claim to approach it.
    bsgs: >-
      Named in the compiler as standard_BSGS_baseline and embedded in the
      hypothesis as the memory-matched boundary at gamma_s = 0, but absent from
      the record's pareto block, which cites only rho. Since item (c) is a
      MEMORY-axis deliverable, the omission matters: BSGS is the baseline
      against which any memory-axis statement would have to be placed, and the
      record has no memory-axis position at all because C-R3 concedes there is
      no declared peak cap.
    closest_specialized_baseline_for_the_actual_claim: >-
      For item (b) the relevant baseline is not an ECDLP algorithm but the
      standard moment-method toolkit on the same object. Against that baseline
      the record's contribution is the Markov attainment argument (C-HA2-2,
      sound and worth keeping) and the covering construction (C-HA2-3, sound at
      the two tabulated slices). It is DOMINATED on informativeness by the HA-3
      second-moment route, which requires no new heuristic and gives, under the
      record's own convention, a decisive answer in the opposite direction.
    k_list_generalized_birthday: >-
      RT-OBJ4 remains open and deferred by the record's own statement. Correct
      as a carry-forward; it means no frontier or crossover reading is
      available and the record does not attempt one.
    dominated_by_field_audit:
      declared_value: 'n/a (no result claimed)'
      time_axis_checked: 'not applicable, no time result claimed; rho baseline correctly stated'
      memory_axis_checked: false
      memory_axis_reason: >-
        C-R3 and OBS-3 concede peak_live_bytes has no declared hard cap and no
        identity binding it to budget.maximum_memory_gb = 2, so no memory-axis
        position exists to compare
      data_or_queries_axis_checked: 'not applicable to a zero-run static contract'
      informativeness_axis_checked: false
      informativeness_axis_verdict: 'dominated by the HA-3 route of RT-OBJ-D'
      verdict: >-
        UNCHECKED on two of three applicable axes, and internally inconsistent
        with the record's own assertion that item (b) is a result.

  # ==================================================================
  # 7. Heuristic and cost-model challenges
  # ==================================================================
  heuristic_challenges:
    - id: HC-1-inventory-incomplete
      challenge: >-
        The heuristic inventory for item (b) contains exactly one entry, HA-2.
        The hypothesis record carries seven numbered heuristics, and HA-3 bears
        directly on the question item (b) asks. An inventory that omits the
        one sibling heuristic constraining the second moment of the same random
        variable is not an inventory. See RT-OBJ-D.
    - id: HC-2-o1-convention-is-used-in-one-direction-only
      challenge: >-
        The frozen convention o(1) := 0 is applied to HA-2 to produce exact
        numeric means that carry the whole of item (b). Applied to HA-3 the
        same convention gives kappa_N = 1, hence X Bernoulli, hence overflow
        probability exactly 0. A convention that yields a negative when applied
        to one heuristic and a positive when applied to its sibling is not a
        neutral reference convention, and the record's B-R2 disclosure
        ("unbounded multiplicative factor N^{o(1)} on every E[X] row") does not
        cover this asymmetry.
    - id: HC-3-random-model-transfer-to-a-structured-object
      challenge: >-
        X is the count of distinct exact point-equalities among selected pairs
        under a frozen antisymmetric label -- a structured, selector-determined
        quantity, not a draw from an exchangeable urn. HA-2 pins one moment of
        it and the record then quantifies over ALL joint laws with that moment.
        That superset includes the covering coupling, which requires 32768
        variables to be arranged around a circle in perfect rotational
        lockstep. Nothing in the apparatus produces such an arrangement; the
        curves are generated by a fixed public generator and the roots draw
        fresh a, b, z per A3. My CTRL-3 shows the conclusion survives an
        independence restriction anyway, which is the right defence and which
        the record should make. Without it, "HA-2 permits this coupling" is
        true but is doing work that "the apparatus might exhibit this coupling"
        cannot do.
    - id: HC-4-DERIV-1-and-HA-2-are-never-placed-side-by-side
      challenge: >-
        The inherited compiler carries a second, explicitly numbered
        expected-occupancy model, DERIV-1, giving 8*(L-1)/N per tuple --
        0.0019226074 at bits=18 down to 0.0000076219 at bits=30 -- versus
        HA-2's 0.5 down to 0.31498 at gamma_x = 5/18. These are not
        contradictory: DERIV-1 is the birthday null at roughly N^(-2/3) and
        HA-2 posits enrichment to N^(-1/3+gamma_x). But the record lists "all
        HA-2 expectation literals and the DERIV-1 by-size literals" as
        inherited unchanged and then reasons exclusively from HA-2, never
        noting that its own inherited null model sits three to five orders of
        magnitude below the means it tabulates and would place the ladder deep
        inside the non-vacuous regime. A reader is entitled to see the two
        models next to each other before being told the question is settled.
    - id: HC-5-validation-status-is-correctly-stated
      challenge: >-
        Positively: HA-2 is correctly labelled unvalidated, the frozen
        convention is correctly labelled "not an observation and not a rigorous
        finite-N bound", DERIV-1's own record labels it unvalidated, and
        C-HA2-5 correctly makes overflow an apparatus-invalidity event rather
        than evidence. No heuristic is smuggled in as a fact anywhere. This
        part of the exemplar-profile discipline is satisfied.

  cost_model_challenges:
    - id: CMC-1-uncharged-peak-instrumentation
      challenge: 'see RT-OBJ-M: exact event-time evaluation has unbounded, uncharged event-log cost that lands on the already-open item (d)'
    - id: CMC-2-tripled-output-reserve
      challenge: 'see RT-OBJ-I: the adopted x3 triples an 8388608-byte output reserve embedded in archive_hashing while the output cap stays 8388608'
    - id: CMC-3-derivation-dependence-understated-by-adoption
      challenge: 'see RT-OBJ-H: the smaller of two disclosed derivations is adopted with a rationale that runs the wrong way for the operative decision'
    - id: CMC-4-no-per-record-byte-formula-exists-anywhere
      challenge: >-
        OBS-4 states plainly that neither archive_hashing's per-verification
        byte formula nor any communication class formula appears in either
        compiler document. I confirm this by reading the deep compiler: the
        x3 multiplier is justified by column-sibling parity, not by a formula,
        and the compiler says so itself. Every archive and communication figure
        in the record therefore rests on an inferred multiplier. The record
        discloses this honestly; the consequence, which it does not draw, is
        that the archive and communication residuals are not "exact" in the
        sense the phrase "exact and itemised" implies, and the by-size
        itemisation inherits the same inference since it is the same row.
    - id: CMC-5-ROUTE-B-byte-impact-uncomputed-but-its-capacity-advantage-is-computable
      challenge: >-
        B-R3 correctly records that ROUTE-B's byte impact is unknown. What is
        computable, and is not recorded, is ROUTE-B's capacity advantage over
        the first-moment route: to make the familywise first-moment bound
        merely NON-VACUOUS at the frozen m one needs capacity at least
        16383/14596/13003/11585/10321 across the ladder, whereas ROUTE-B's
        deterministic capacity is 504/1016/2040/4088/8184. ROUTE-B needs LESS
        capacity than the probabilistic route needs to say anything at all, at
        every ladder size, and by a factor of 32.5 at bits=18. C-HA2-6 is a
        routes-comparison clause and omits the one comparison that favours the
        route it declines.
    - id: CMC-6-peak-axis-has-no-cap-so-no-stop-rule-binds
      challenge: >-
        C-R3 discloses this and declines to fix it on scope grounds, which is
        defensible. The consequence is worth stating: the record adds a
        stopping rule "a system peak computed by any FORBIDDEN-R rule
        invalidates the accounting" while there is no threshold the computed
        peak can violate. The rule polices the METHOD and nothing polices the
        VALUE. The one-line fix -- declare peak_live_bytes_hard_cap_bytes =
        2147483648 and state the identity to maximum_memory_gb = 2 -- is a cap
        declaration and hence genuinely outside this task's authority, so this
        stands as a correctly-scoped carry-forward rather than an objection to
        the producer.

  reduction_and_scope_challenges:
    - id: RSC-1-no-published-reduction-is-instantiated
      challenge: >-
        The record invokes no published reduction and derives no corollary from
        one, so the exemplar-profile reduction-instantiation test is vacuous
        here. Recorded so that its absence is not mistaken for a pass.
    - id: RSC-2-affected-versus-safe-scope-is-not-inflated
      challenge: >-
        No scheme is named as affected or safe anywhere in either artifact, and
        no security effect is asserted. Scope inflation is absent. This is a
        pass.
    - id: RSC-3-the-only-scope-inflation-is-internal
      challenge: >-
        The inflation in this record runs from "HA-2 alone, at two gamma
        slices, at one family size" to "the heuristic, permanently". That is a
        scope error about a mathematical statement rather than about a
        cryptosystem, and it is enumerated sentence by sentence in
        scope_blurring_sentences_flagged.
    - id: RSC-4-item-b-is-correctly-fenced-from-the-hypothesis-and-from-ECDLP
      challenge: >-
        Positively: claim_boundary states that item (b) "proves a negative
        about a stated heuristic's reach; that is a statement about HA-2 as
        written, not about ECDLP, not about H-SYC-b854f4's truth, and not about
        any curve", and C-HA2-5 states that a realized overflow is apparatus
        invalidity and never negative evidence. Both are correct and both are
        the right fences. My objections attack the reach of the negative, never
        this fence.

  proof_architecture_challenges:
    - id: PAC-1-observation-fiber
      challenge: >-
        The record's own observation-collision claim is that C-HA2-3 proves the
        mean is a lossy projection of the safety question, by exhibiting two
        laws with equal mean on opposite sides. That is a valid fiber argument
        and I confirm it at the two tabulated slices. The fiber it did NOT
        vary is gamma_x: holding the projection (the first-moment familywise
        bound) fixed and varying gamma_x moves the conclusion across the
        vacuity boundary at bits = 30. The missing separator is the pair
        (gamma_x, bits), not the mean alone.
    - id: PAC-2-quantifier-order
      challenge: >-
        Written with explicit quantifiers, C-HA2-3 reads: for each ladder size
        and each of two gamma values, there EXISTS an HA-2-consistent joint law
        with familywise overflow probability 1. The record then states it as if
        it read: for ALL parameters, no HA-2 argument certifies capacity. The
        witness (the covering law) is chosen AFTER seeing the parameters, and
        it exists only when p >= 1/m -- a condition on the parameters that the
        record verifies numerically at the tabulated slices and never states as
        a hypothesis of the theorem. That unstated hypothesis is exactly what
        fails at (0/1, 30).
    - id: PAC-3-boundary-and-strictness
      challenge: >-
        The old method (the plain union bound) is genuinely embedded as the
        boundary and the record correctly shows it is vacuous at the tabulated
        slices. The proposed perturbation (the covering construction) is
        strictly stronger there. Both hold. The strictness fails only outside
        the tabulated slices, which is PAC-2's point.
    - id: PAC-4-method-ceiling
      challenge: >-
        The record's declared ceiling -- "a zero-run static producer ... can
        PROVE a negative about what a stated heuristic yields" -- is the right
        ceiling for the method. Its claim to have REACHED it is wrong, because
        the largest claim the available resource (the hypothesis record's own
        heuristic list) supports is not the negative it obtained but the HA-3
        bound it did not look for. The ceiling was under-reached, not
        over-claimed, which is the rarer failure and is worth saying plainly.
    - id: PAC-5-nearby-object
      challenge: >-
        The nearest object for which the desired conclusion is FALSE is the
        same design at gamma_x = 0/1 and bits = 30. The record's
        nearby_object_control says only "preserved by citation; no control was
        executed". No control needed executing: the nearby object was one line
        of arithmetic away and was inside the frozen scope. This is the
        cheapest control in the whole record and it is the one that was
        skipped.
    - id: PAC-6-compositional-invariant
      challenge: >-
        Item (b)'s strengthened invariant is the triple (C-HA2-1, C-HA2-2,
        C-HA2-3). Deleting C-HA2-1 leaves C-HA2-2 and C-HA2-3 intact -- neither
        uses 8*(L-1) except to check 33 <= 8*(L-1), which any bound above 33
        supplies. Deleting C-HA2-2 breaks nothing structurally but removes the
        only clause that makes HA-2 informative. Deleting C-HA2-3 collapses the
        whole negative. So the invariant is not compositional: C-HA2-1 is
        decorative to the argument while carrying the record's strongest verbal
        claim, which is precisely the configuration in which an unproved
        assertion survives review.

  # ==================================================================
  # 8. Closure audit
  # ==================================================================
  closure_audit:
    instruction: >-
      My role contract requires attacking closures as hard as claims. Two
      closures are asserted in this batch.
    closure_1_item_b_negative:
      asserted_as: 'a proved impossibility that permanently blocks capacity-adequacy claims under HA-2'
      named_obstruction: 'the familywise supremum equals 1 under HA-2-consistent joint laws'
      does_the_obstruction_measure_something: >-
        YES. Unlike a fatigue report, C-HA2-3 exhibits an explicit law and the
        measurement is real. This is a genuine obstruction and I credit it.
      does_the_measurement_support_the_breadth_closed: >-
        NO. It supports closure at gamma_x in {5/18, 1/3}, at m = 32768 and
        capacity 32, for arguments using HA-2 and nothing else. It is closed at
        "HA-2, permanently, any argument". Two independent over-reaches:
        gamma_x (RT-OBJ-C) and sibling heuristics (RT-OBJ-D).
      forward_guidance_present: >-
        PARTIALLY. C-HA2-6 names three routes, which is good practice and
        better than most closures. But its option list omits the cheapest live
        route, which is HA-3, and it presents ROUTE-A as requiring a NEW
        heuristic when an existing one suffices.
      verdict: 'genuine obstruction, over-broad closure, incomplete forward guidance'
    closure_2_item_d_R4_no_lossless_representation:
      asserted_as: 'no lossless, obligation-preserving representation was found'
      named_obstruction: none
      does_the_obstruction_measure_something: >-
        NO. The record states explicitly that no new search was conducted. A
        count of nothing screened is not a statement about the object, and I
        say so in those terms: D-R4 is a fatigue report about the search,
        wearing the format of an exact residual, in a list whose other entries
        are exact byte quantities.
      forward_guidance_present: >-
        NO, and a candidate was in view: the record's own OBS-2. See RT-OBJ-J.
      verdict: 'under-supported closure; relabel as not-searched and file the lead'
    reversal_reading_the_author_could_not_make:
      instruction: 'role contract item 8: which theory takes the measurement as its hypothesis'
      reading: >-
        Take C-HA2-3's measurement -- that the first-moment route is vacuous by
        a factor of 312.8 to 496.5 at the tested slices -- as a HYPOTHESIS
        rather than an obstruction, and it says something useful: the design is
        operating at a family size roughly 300 to 500 times too large for any
        first-moment argument at capacity 32, and the crossing is at capacity
        about 10321 to 16383. Since the deterministic route needs only 504 to
        8184, the measurement is a quantitative argument FOR ROUTE-B and
        against ever attempting a probabilistic capacity certificate on this
        apparatus. The record declines ROUTE-B on cost grounds (B-R3, byte
        impact unknown) without noticing that its own measurement is the
        strongest available argument for it. This is a candidate for the
        ranking, it is not evidence, and it changes no status.
      spawned_ids: []
      spawned_ids_note: >-
        This session has no authority to mint ledger identifiers and does not.
        The reading is recorded here for a Coordinator to file or discard.

  # ==================================================================
  # 9. Narrowest supported statement
  # ==================================================================
  narrowest_supported_statement: >-
    On the frozen toy ladder of 18, 21, 24, 27 and 30 bits, with the frozen
    design constants 32 curves, 256 roots and 4 public models, with
    candidate_index capacity 32 and overflow defined as X >= 33, and under the
    frozen symbolic convention that sets HA-2's o(1) term to zero, the
    following are established by EXP-SYC-75f7d2 and survive independent
    recomputation:
    (1) Per tuple, HA-2 alone yields the tail bound P[X >= 33] <= E[X]/33, and
    that bound is attained by an admissible law, so it is exact. Numerically it
    ranges from 0.015151515152 at bits=18 to 0.009544856439 at bits=30 at
    gamma_x = 5/18, and equals 1/33 at the gamma_x = 1/3 ceiling. HA-2 is
    therefore INFORMATIVE about per-tuple overflow.
    (2) At gamma_x = 5/18 and at gamma_x = 1/3, taking the family to be the
    32768 distinct root/model variables, the supremum over HA-2-consistent
    JOINT laws of the probability that at least one tuple overflows is exactly
    1, witnessed by an explicit covering construction whose hypothesis
    p >= 1/32768 holds at those slices by a factor of at least 312.8; and 0 is
    also attained. Hence no non-vacuous familywise bound follows from HA-2
    ALONE at those two gamma values and that family size. This conclusion is
    robust: it survives an added independence restriction across the 32 curves
    exactly, and across all 32768 variables to within 3.3e-137.
    (3) The inherited census permits per-tuple occupancy up to 8*(L-1), namely
    504, 1016, 2040, 4088 and 8184, exceeding capacity 32 by 472, 984, 2008,
    4056 and 8152. This means capacity 32 is NOT CERTIFIED by the deterministic
    census. It does NOT mean capacity 32 is inadequate; no attainability of 33
    is exhibited anywhere.
    (4) The first-moment familywise bound has closed form 2^(15 - bits/18)/33
    at gamma_x = 5/18 with family size 32768, and 2^(15 - bits/18)/11 with
    98304; it is non-vacuous only when E[X] <= 33/32768 = 0.001007080078125,
    equivalently bits >= 179.2009 in the frozen expression at gamma_x = 5/18.
    All of this arithmetic is exact and I reproduce every digit.
    (5) The synchronized system-peak formula max_t ( S(t) + sum_{j=1..8} B_j(t)
    ) correctly rejects the four numeric forbidden rules on the five specified
    fixtures, with KAT-PEAK-D giving 15 against 3, 24 and 22, its dedup check
    and its bracket both correct, and the retained bracket a valid theorem. It
    does NOT correctly compute host peak memory, because it has no term for the
    co-located setup process's private allocations.
    (6) Under the unchanged caps, the archive schedule exceeds its cap by
    3256009664 bytes under the adopted derivation and by 5405757888 under the
    disclosed alternative, communication by 3285369792 with no bracket at all,
    and output by 7132160, itemised exactly. Every one of these arithmetic
    identities reproduces. They are inexact derivations reported to exact
    precision, and the interval, not the point, is the honest residual.
    NOT established, and specifically NOT to be read into the above:
    that no argument from H-SYC-b854f4's heuristics can certify capacity 32
    (HA-3 gives one); that the negative holds at every preregistered gamma_x
    (it fails at gamma_x = 0/1, bits = 30, where the bound is 32/33); that
    capacity 32 is inadequate; that any lossless representation does or does
    not exist for item (d); or anything whatsoever about H-SYC-b854f4's truth,
    about any elliptic curve, about ECDLP, or about any scale beyond the tested
    18-to-30-bit toy ladder.

