  item_by_item:

    - item: a
      name: producer policy-resolution versus probe-versus-authoring binding
      blocker_id: PRODUCER-POLICY-RESOLUTION-BINDING
      disposition: REPAIRED
      disposition_qualifier: repaired for this successor, with two disclosed residuals
      what_the_defect_was:
        resolution: >-
          the predecessor requested coordinator-orchestration-code and launched
          gpt-5.6-sol while the frozen openai binding for that policy was
          gpt-5.6-terra; fallback and degradation were both forbidden and no
          inference amendment exists
        scope: >-
          the predecessor receipt verified a short read-only probe session and,
          by its own scope note, did not prove that the later authoring tokens
          ran inside it
      what_was_done:
        resolution_half:
          requested_policy: coordinator-orchestration-code
          backend: anthropic
          frozen_binding_model: claude-opus-5
          resolved_model_id: claude-opus-5
          matches_frozen_binding: true
          manual_model_override_issued: false
          reasoning_effort: high
          fallback_used: false
          degraded: false
          verdict: the resolution mismatch does not recur
        scope_half:
          probe_session_executed: false
          verification_scope: same_session_authoring_tokens
          argument: >-
            the predecessor's gap was that its evidence covered a DIFFERENT
            session from the authoring one. Here the model identity is a
            session-level attribute of the single session that emitted these
            authoring tokens; there is no second session for the evidence to be
            about, so the disjointness is absent by construction rather than by
            assertion.
          verdict: the probe-versus-authoring scope gap is closed
      residuals_disclosed:
        - id: A-R1-no-provider-side-attestation
          quantified: >-
            global_backend_verified=false, binding_probe_run=false, and
            bindings.anthropic.coordinator-orchestration-code.last_probed is
            null in the committed binding file
          reason: >-
            this role has no command-execution surface, so no probe, no
            `adapter doctor --probe` and no check_runtime_bindings.py run is
            possible; asserting one would be fabrication
          carry_forward_to: >-
            any future session for this lane that holds a command surface
        - id: A-R2-predecessor-provenance-permanently-unrepairable
          quantified: >-
            zero figures in the successor are sourced to TASK-20260811-338053;
            all carried figures are sourced to the two provenance-clean
            independent recomputations
          reason: >-
            EXP-SYC-b11b38 is immutable and its authoring tokens are past; no
            successor can retroactively repair its receipt, and laundering it
            is forbidden
          carry_forward_to: permanent; the defect stands on the BATCH-080a9c record
      residual_status_after_this_task: repaired going forward, two residuals open

    - item: b
      name: justified HA-2 tail or worst-case contract
      blocker_id: HA2-EXPECTATION-NOT-TAIL
      disposition: REPAIRED
      disposition_qualifier: >-
        repaired by derivation, not assertion; the repair is a proved negative
      what_the_defect_was: >-
        the HA-2 values were expectations only, so a positive-probability
        thirty-third distinct value remained compatible with the stated mean.
        The predecessor's response was to ASSERT that no tail follows, which
        leaves open whether a stronger argument from the same heuristic could
        establish capacity adequacy.
      what_was_done:
        - clause: C-HA2-1
          content: >-
            the inherited deterministic bound X <= 8*(L-1) exceeds capacity 32
            at every ladder size by 472, 984, 2008, 4056 and 8152, so capacity
            32 is settled NOT worst-case adequate
        - clause: C-HA2-2
          content: >-
            Markov gives P[X >= 33] <= E[X]/33, and this is ATTAINED by the
            admissible law X = 33 with probability E[X]/33 and 0 otherwise, so
            E[X]/33 is the exact supremum of the per-tuple overflow
            probability over all HA-2-consistent laws, ranging from
            0.009544856439 at bits=30 to 1/66 at bits=18
        - clause: C-HA2-3
          content: >-
            an explicit covering construction on the unit circle exhibits an
            HA-2-consistent joint law with familywise overflow probability
            exactly 1, and a second construction exhibits one with probability
            exactly 0. HA-2 alone therefore admits the entire interval [0,1]
            and excludes no answer; the familywise supremum is exactly 1, so
            the vacuity is intrinsic and not an artifact of the proof
            technique
        - clause: C-HA2-4
          content: >-
            the first-moment familywise bound has closed form
            2^(15 - bits/18)/33 at gamma_x = 5/18 with the conservative family
            size 32768, and becomes non-vacuous only above bits ~= 179.2009 --
            an arithmetic statement about the frozen expression at fixed
            capacity and tuple count, explicitly NOT a scale claim or transfer
        - clause: C-HA2-5
          content: >-
            the operative contract is unchanged: overflow above 32 invalidates
            without truncation, replacement, resampling or silent saturation,
            and a realized overflow is apparatus invalidity, never evidence
        - clause: C-HA2-6
          content: >-
            three routes to adequacy are declared and NONE is adopted: a new
            numbered heuristic HA-2T with validation; capacity raised to the
            deterministic worst case 8*(L-1); or the status quo, which is what
            remains in force
      family_size_correction_applied: >-
        the eta_rule makes the three eta tuples of one (curve, root, model) the
        same random variable, so the conservative count 32768, not 98304, is
        used in every familywise statement; this makes each bound smaller and
        each vacuity conclusion stronger
      refutation_artifact:
        kind: counterexample_certificate
        content: >-
          two explicit admissible occupancy laws with identical HA-2 means and
          familywise overflow probabilities 0 and 1 respectively
        archived_at: 'experiments/EXP-SYC-75f7d2/specification.yaml, clause C-HA2-3'
        basis: derivation_note_plus_counterexample_certificate
        empirical_only: false
      residuals_disclosed:
        - id: B-R1-no-finite-N-tail-derivable
          quantified: 'derivable familywise overflow probability spans [0, 1]'
          status: >-
            now a PROVED impossibility rather than an unproved gap; it blocks
            any capacity-adequacy claim permanently under HA-2 as stated
        - id: B-R2-o1-unspecified
          quantified: 'unbounded multiplicative N^{o(1)} factor on every E[X] row'
          reason: HA-2 supplies no finite-N control on its own error term
        - id: B-R3-route-B-byte-impact-uncomputed
          quantified: >-
            candidate_index widens from 1 byte to at least 2; the resulting
            archive, communication and output deltas are UNKNOWN and are not
            estimated
          reason: >-
            the required per-record byte formulas are not present in the
            artifacts read, and pursuing them would widen scope
      residual_status_after_this_task: >-
        repaired; the residuals that remain are the proved limits of the
        heuristic itself, not gaps in the record

    - item: c
      name: synchronized system-peak KAT
      blocker_id: SYSTEM-PEAK-LIVE-CONCURRENCY
      disposition: REPAIRED
      what_the_defect_was: >-
        the predecessor froze a maximum over per-shard peak streams. System
        peak is a maximum over TIME of a SUM across simultaneously live
        allocations with shared bytes charged once, so the frozen rule
        undercounts by up to eightfold on eight disjoint simultaneous
        allocations.
      what_was_done:
        replacement_formula: 'system_peak_live_bytes = max_t ( S(t) + sum_{j=1..8} B_j(t) )'
        equivalent_from_per_shard_totals: 'max_t ( sum_j P_j(t) - D(t) ) with D(t) = sum_j m_j(t) - S(t)'
        time_base: >-
          one monotonic clock read by all eight shards and setup on a single
          host; allocation and free are events; the maximum is evaluated
          exactly over the finite event set, never by periodic sampling
        retained_bracket: 'max_j max_t P_j(t) <= system_peak <= sum_j max_t P_j(t) + max_t S_solo(t)'
        forbidden_rules: [FORBIDDEN-R1 max-over-shard-peaks, FORBIDDEN-R2 sum-of-per-shard-maxima, FORBIDDEN-R3 sum-without-dedup, FORBIDDEN-R4 periodic-sampling, FORBIDDEN-R5 division-averaging-or-five-way-reuse, FORBIDDEN-R6 missing-shard]
        kat_fixtures:
          - {id: KAT-PEAK-A-eight-simultaneous-nonshared, expected_peak: 8, rejects: [FORBIDDEN-R1]}
          - {id: KAT-PEAK-B-eight-staggered-nonshared, expected_peak: 1, rejects: [FORBIDDEN-R2]}
          - {id: KAT-PEAK-C-shared-counted-exactly-once, expected_peak: 1, rejects: [FORBIDDEN-R2, FORBIDDEN-R3]}
          - {id: KAT-PEAK-D-seven-simultaneous-one-staggered-one-shared, expected_peak: 15, rejects: [FORBIDDEN-R1, FORBIDDEN-R2, FORBIDDEN-R3], values_under_rejected_rules: {R1: 3, R2: 24, R3: 22}}
          - {id: KAT-PEAK-E-sub-sample-transient, expected_peak: 1024, rejects: [FORBIDDEN-R4]}
        checkpoint_requirement_satisfied: >-
          KAT-PEAK-D is the single fixture the checkpoint names: simultaneous
          shards, a staggered shard, and a shared allocation counted exactly
          once, all on one timeline, with an expected peak of 15 that all three
          arithmetic falsifiers miss.
        executed: false
        executed_note: >-
          the fixtures are SPECIFIED, not run. No byte was allocated and no
          measurement exists.
      residuals_disclosed:
        - id: C-R1-multi-host-clock-skew
          quantified: 'skew bound delta is UNDECLARED; execution topology is not frozen by this record'
          reason: freezing the execution topology would widen scope beyond the four items
        - id: C-R2-no-measured-peak-exists
          quantified: 'measured_values_present: false on every peak axis row'
          reason: maximum_runs is 0 by construction
        - id: C-R3-peak-axis-has-no-declared-hard-cap
          quantified: 'peak_live_bytes_hard_cap_bytes: absent from the inherited compiler'
          reason: >-
            recorded as an open non-blocking observation; declaring a cap would
            be a cap change this task may not make
      residual_status_after_this_task: repaired; three residuals open, none arithmetic

    - item: d
      name: exact cap residuals
      blocker_id: CAPACITY-RESIDUALS
      disposition: DISCLOSED-CARRY-FORWARD
      disposition_qualifier: >-
        exactly carried, newly itemised and newly bracketed; NOT closed, and
        not closable by this task
      what_was_done:
        carried_exactly:
          archive: {scheduled_bytes: 5563755264, hard_cap_bytes: 2307745600, over_cap_bytes: 3256009664}
          communication: {scheduled_bytes: 5614086912, hard_cap_bytes: 2328717120, over_cap_bytes: 3285369792}
          output: {required_bytes: 15520768, hard_cap_bytes: 8388608, over_cap_bytes: 7132160}
        new_itemisation_archive:
          by_size_bytes: [177118029, 357047457, 716906313, 1436624022, 2876059443]
          sum_identity: '177118029+357047457+716906313+1436624022+2876059443 = 5563755264'
          drop_bits_30_only: 'leaves 2687695821, still over cap by 379950221'
          drop_bits_30_and_27: 'leaves 1251071799, fits with slack 1056673801, but destroys the five-point ladder; NOT adopted'
        new_bracket_archive:
          adopted_derivation_total: 5563755264
          adopted_over_cap: 3256009664
          alternative_derivation_total: 7713503488
          alternative_over_cap: 5405757888
          force: >-
            the archive residual is DERIVATION-DEPENDENT and 3256009664 is the
            smaller of two disclosed derivations. Carrying it as a unique
            quantity would understate the deficit; both are now on the record.
        communication_derivation_quality:
          itemisation_available: false
          reason: >-
            no population-driven communication class exists in either compiler
