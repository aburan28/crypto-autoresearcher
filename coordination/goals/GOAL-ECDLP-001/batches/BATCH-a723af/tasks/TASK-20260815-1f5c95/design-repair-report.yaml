          derivation: 'x3 multiplier extended to the predecessor TOTAL by symmetry with archive'
          self_declared_status: 'the compiler''s own words: an explicitly weaker, more uncertain extrapolation'
          alternative_bracket_available: false
        new_itemisation_output:
          cap_identity: '1966080*4 + 524288 = 8388608, exactly the hard cap'
          overage_identity: '2097152+1048576+8192+46080+1048576+2097152+786432 = 7132160, exactly the over-cap bytes'
          force: >-
            the cap was sized for exactly the four packed streams plus the
            coverage-counter reserve; the entire overage is precisely the seven
            remaining custody, coverage, allocation, baseline and replay
            artifacts. Dropping all seven would fit exactly, but they are
            custody and coverage obligations, so that is LOSSY and is NOT
            proposed. The identity is recorded so the future amendment decision
            is arithmetic rather than negotiation.
        reduction_arithmetic:
          archive: 'must remove 3256009664 bytes, more than 58.5 percent of schedule; required factor strictly between 2.41 and 2.411'
          communication: 'must remove 3285369792 bytes, more than 58.5 percent of schedule; required factor strictly between 2.41 and 2.411'
          output: 'must remove 7132160 bytes, more than 45.9 percent; required factor exactly 1.8502197265625'
        caps_unchanged: true
        cap_raise_performed: false
        scope_reduction_performed: false
        lossless_fit_found: false
      residuals_disclosed:
        - {id: D-R1-archive-fit, over_cap_bytes: 3256009664, alternative_over_cap_bytes: 5405757888, status: OPEN}
        - {id: D-R2-communication-fit, over_cap_bytes: 3285369792, derivation_quality: weakest_in_cost_model_no_bracket, status: OPEN}
        - {id: D-R3-output-fit, over_cap_bytes: 7132160, status: OPEN}
        - {id: D-R4-no-lossless-representation-found, status: OPEN, note: 'no new search was conducted; a representation redesign is outside the four named items'}
        - {id: D-R5-closure-requires-a-decision-this-task-may-not-make, status: OPEN, note: 'closing D needs a Coordinator-authorised cap amendment or scope reduction recorded as a versioned protocol_amendment; this task is forbidden to raise a cap or widen scope'}
      residual_status_after_this_task: >-
        OPEN. Item D is disclosed to the byte and better decomposed than
        before, but it is not repaired and cannot be repaired here by any
        honest route.

