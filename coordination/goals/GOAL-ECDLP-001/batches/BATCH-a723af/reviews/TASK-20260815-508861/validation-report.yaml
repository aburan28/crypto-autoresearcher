    - id: OBS-V7
      subject: 'producer receipt qualifiers'
      finding: 'see check_1 RECEIPT-NOTE-1 and RECEIPT-NOTE-2; both cosmetic'
    - id: OBS-V8
      subject: 'completeness of the ROUTE menu in C-HA2-6'
      finding: >-
        The menu offers a new numbered heuristic, a deterministic capacity, and
        the status quo. It does not consider a joint argument from HA-1's own
