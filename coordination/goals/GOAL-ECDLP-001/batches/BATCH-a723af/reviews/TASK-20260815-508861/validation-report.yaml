        - 'the union-bound closed form and both non-vacuity thresholds recompute exactly'
        - 'the family-size correction from 98304 to 32768 is right, is conservative in the direction claimed, and follows from the predecessor eta_rule verbatim'
        - 'the operative contract (overflow invalidates, never evidence) is preserved unchanged'
