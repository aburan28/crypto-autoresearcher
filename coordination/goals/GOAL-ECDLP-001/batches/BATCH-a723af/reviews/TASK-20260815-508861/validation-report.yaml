        - 'all five fixtures recompute exactly, including KAT-PEAK-D at 15 against falsifiers 3, 24 and 22, the dedup check, and the bracket check'
        - 'each fixture discriminates exactly the rules its rejects list names, and no more, which I checked in both directions'
