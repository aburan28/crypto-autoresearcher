    - id: OBS-V4
      subject: 'independence control on the producer read-scope self-report'
      method: >-
        I differenced every numeric token of length four or more in the two
        successor artifacts against the union of six clean sources (the
        checkpoint, both compilers, the immutable predecessor specification,
        and both provenance-clean review reports), then intersected the
        remainder with the quarantined TASK-20260813-a8dc5e report.
      result: >-
        Exactly one token, 32768, is shared with the quarantined report and
        absent from all six clean sources. Every other novel token in the
        successor is a value I independently recomputed as derived. None of the
        quarantined artifact's distinctive figures appears in the successor:
        not its log-no-overflow values -500.284527 to -314.268075, not its
        DERIV1 expected_occupancy rows, and not its HA-4-independence route.
        Conversely, the successor's three substantive arguments (Markov
        attainment, the covering construction, the union-bound closed form)
        appear nowhere in the quarantined report.
      interpretation: >-
        This is NOT evidence of a quarantine breach and is not recorded as one.
        32768 = 32*256*4 is one step from the frozen scope, and the eta_rule
        that licenses collapsing 98304 to 32768 is stated verbatim in the
        immutable predecessor and restated independently in the
        provenance-clean TASK-20260813-e04de4. The producer's
        quarantined_bytes_read false is a self-report no artifact can verify
        externally; the corroboration above is what a validator can supply, and
        it is consistent with the self-report.
    - id: OBS-V5
      subject: 'pareto_honesty sota_delta'
      finding: >-
        The rho baseline "0.886*sqrt(N) group operations with vOW
        parallelization" carries no knowledge-record citation. It is consistent
        with the corpus, where the constant appears in several KN-TECH entries,
