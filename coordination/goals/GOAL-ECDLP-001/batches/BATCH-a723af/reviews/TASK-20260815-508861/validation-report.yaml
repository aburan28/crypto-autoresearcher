  # ==================================================================
  # Named REVISE items
  # ==================================================================
  named_revise_items:
    - id: VAL-A723AF-R1
      item: b
      class: arithmetic_error
      severity: minor_must_fix
      location: 'specification.yaml, C-HA2-6 ROUTE-B requirement and quantified_carry_forward; the same claim propagates into residual B-R3''s framing'
      claim_as_written: '"this forces the index width above U8 (8184 needs 14 bits)" and "the required width change is U8 -> at least U14"'
      why_it_is_wrong: >-
        A capacity of 8184 indices spans the values 0 to 8183, and 2^13 = 8192
        exceeds 8184, so 13 bits suffice; even reserving one extra sentinel
        value keeps the requirement at 8192 values and therefore 13 bits. 14
        bits would be needed only above 8192 values. The other four sizes,
        which the record does not state, need 9, 10, 11 and 12 bits.
      what_is_unaffected: >-
        The downstream conclusion is unchanged: 13 bits still exceeds U8 and
        still forces at least a 2-byte, byte-aligned field, so B-R3's "widens
        from 1 byte to at least 2" and the "doubling" language stay correct,
        and ROUTE-B is not adopted in any case.
      required_repair: 'replace 14 with 13 and U14 with U13, or state the width as "at least 13 bits, hence 2 bytes byte-aligned"'
      note_on_severity: >-
        The specification's own falsification_criterion lists "an arithmetic
        error in any derived bound" as invalidating. A width requirement is
        arguably such a bound, so a stricter reader than this one could treat
        this as fatal rather than minor. I classify it minor because it sits
        inside an explicitly non-adopted route and changes no adopted quantity,
        but it cannot be waived and must be corrected in the successor.
    - id: VAL-A723AF-R2
      item: b
      class: claim_exceeds_what_the_artifact_supports
      severity: major
      location: 'specification.yaml, C-HA2-1, kind: definite_negative_fact; repeated in design-repair-report.yaml item b clause C-HA2-1 and relied on by C-HA2-5'
      claim_as_written: >-
        "X <= 8*(L-1) deterministically ... The bound exceeds capacity 32 at
        every ladder size, so capacity 32 is NOT worst-case adequate. This is
        settled, not merely unproved."
      why_it_overreaches: >-
        8*(L-1) is an UPPER bound on X, inherited from a comparison census. An
        upper bound lying above capacity shows that no worst-case adequacy
        certificate is available; it does not show that any admissible instance
        actually reaches 33. To settle inadequacy the record would need an
        attainment witness, exactly as it correctly supplies attaining laws for
        the Markov bound in C-HA2-2 and for the familywise supremum in
        C-HA2-3. No such witness is supplied here, so the asymmetry is internal
        to the artifact's own standard of proof.
      regression_against_the_predecessor: >-
        EXP-SYC-b11b38 phrased this correctly: "cap adequacy is not proved in
        the simultaneous-tail or worst-case sense". This successor converts a
        correct not-proved into an incorrect proved-not. That the label
        FAIL_not_worst_case_safe was inherited from TASK-20260813-e04de4 does
        not validate the inference; a review's label is not a proof either.
      also_affects: >-
        specification.yaml limitations line "No finite-N candidate_index tail
        exists", which should read that no finite-N tail BOUND is DERIVABLE
        from HA-2. A tail distribution for the real X certainly exists; what
        does not exist is a derivation of it from the stated heuristic.
      required_repair: >-
        Restate C-HA2-1 as "no worst-case adequacy is derivable from the
        inherited bound; capacity 32 is not worst-case CERTIFIED", or supply an
        instance witness with X >= 33 and label it as such. Fix the limitations
        line in the same pass.
      what_is_unaffected: >-
        The operative contract is identical under either phrasing: capacity
        adequacy is not claimed, overflow invalidates without truncation, and
        implementation stays blocked. This is a precision defect in a stated
        negative, not a hidden positive claim, and it does not touch the
        soundness of C-HA2-2 or C-HA2-3.
    - id: VAL-A723AF-R3
      item: c
      class: conformance_gap_against_the_frozen_requirement
      severity: moderate
      location: 'specification.yaml static_kat_fixtures, fixtures A, B and D, and the checkpoint_requirement_satisfied claim in design-repair-report.yaml'
      claim_as_written: >-
        "KAT-PEAK-D is the single fixture the checkpoint names: simultaneous
        shards, a staggered shard, and a shared allocation counted exactly
        once, all on one timeline"
      what_the_frozen_requirement_actually_says: >-
        The BATCH-080a9c blocker SYSTEM-PEAK-LIVE-CONCURRENCY reads "The
        required KAT binds eight simultaneous shards, one staggered shard, and
        shared allocation counted exactly once." The red team's control
        CTRL-PEAK-AGGREGATE-STATIC-KAT additionally requires the shared
        one-byte allocation to be added to BOTH the simultaneous fixture and
        the staggered fixture.
      what_the_artifact_provides: >-
        KAT-PEAK-D binds SEVEN simultaneous shards plus one staggered shard,
        and KAT-PEAK-A and KAT-PEAK-B both carry "shared: none", so neither
        instantiates the shared-byte variant the control asks for.
      why_this_is_not_a_pure_defect: >-
        The 7+1 choice is defensible and arguably better. With eight
        simultaneous shards plus a staggered one, R2 and R3 would both evaluate
        to 24 and the fixture would not separate them; D as written separates
        them at 24 versus 22. The deviation improves discrimination.
      required_repair: >-
        Record the deviation and that reason explicitly instead of asserting
        literal conformance, and add the two cheap variants the control names:
        A plus one shared byte (expected peak 9) and B plus one shared byte
        (expected peak 2). Both are static fixtures and cost nothing to
        specify.
      also_record: >-
        FORBIDDEN-R5 and FORBIDDEN-R6 have no numeric fixture. That is stated
        in completeness_claim but is not carried into residuals_open next to
        C-R1 to C-R3, which is where a reader auditing the peak axis will look.
    - id: VAL-A723AF-R4
      item: d
      class: unrepaired_by_construction_correctly_disclosed
      severity: 'blocking for implementation, not a defect of this artifact'
      finding: >-
        Item d is not repaired and this review confirms it cannot be repaired
        by a task forbidden to raise a cap or reduce scope. Every figure is
        disclosed to the byte and every one recomputes: 3256009664, 3285369792
        and 7132160 under unchanged caps, with the archive figure correctly
        bracketed against the larger 5405757888 alternative. D-R1 to D-R5 are
        each carried with a status and a reason.
      required_action_and_owner: >-
        A Coordinator-authorised cap amendment or scope reduction, recorded as
        a versioned protocol_amendment, in a task that holds that authority.
        Nothing in this review authorises it.
    - id: VAL-A723AF-R5
      item: b
      class: scoping_and_derivational_precision
      severity: minor
      components:
        - id: R5a
          location: 'C-HA2-2 derivation'
          finding: >-
            The clause claims a supremum "over every occupancy law consistent
            with HA-2". The constraint actually used is the frozen-convention
            mean with o(1) := 0. Under HA-2 as literally written the admissible
            set is larger and the per-tuple supremum is at least as large, so
            the direction is conservative and no conclusion changes, but the
            clause should say "consistent with the frozen-convention mean".
        - id: R5b
          location: 'C-HA2-4 non_vacuity_threshold'
          finding: >-
            The conditions should be strict. At E[X] = 33/32768 exactly, the
            clipped bound equals 1 and is still vacuous, and likewise at bits
            equal to 179.2009 or 207.7302. Consequence-free on this ladder,
            which is far from the boundary.
        - id: R5c
          location: 'C-HA2-3 symmetric_certificate force'
          finding: >-
            "ranges over the entire interval [0, 1], both endpoints attained"
            is proved only at the endpoints. Every intermediate value follows
            from mixing the two exhibited laws with weight lambda, which
            preserves each marginal mean and yields familywise probability
            lambda. The one-line argument is missing, not wrong.
      required_repair: 'three sentence-level corrections; no figure moves'
    - id: VAL-A723AF-R6
      item: 'cross-cutting'
      class: accuracy_of_a_stated_count
      severity: cosmetic
      location: 'design-repair-report.yaml residuals_remaining_open_plainly.summary'
      finding: >-
        The summary says "Ten residuals remain open", but the enumerated
        residual identifiers number thirteen: A-R1, A-R2, B-R1, B-R2, B-R3,
        C-R1, C-R2, C-R3, D-R1, D-R2, D-R3, D-R4, D-R5. Ten is the row count of
        a list that groups D-R1 to D-R3 into one row and D-R4 to D-R5 into
        another. No residual is dropped and both artifacts enumerate the same
        thirteen; only the count label is wrong.
      required_repair: 'say thirteen, or say "ten rows covering thirteen residual identifiers"'

