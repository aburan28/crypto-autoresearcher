  # ==================================================================
  # CHECK 4 (separate check): mathematical interpretation of item (b)
  # ==================================================================
  check_4_mathematical_interpretation:
    status: SOUND_CORE_CORRECTLY_SCOPED_WITH_ONE_OVERREACHING_CLAUSE
    what_the_argument_actually_proves:
      statement: >-
        Under HA-2 as written, which constrains only the first moment of X per
        (curve, root, public model) tuple, the familywise probability that at
        least one of the 32768 distinct per-size variables reaches 33 is not
        bounded away from 1. Two explicit joint laws with exactly the HA-2
        means attain familywise overflow probability 1 and 0 respectively.
        Therefore no capacity-adequacy certificate for capacity 32 is derivable
        from HA-2 alone, and the mean is a lossy projection of the safety
        question.
      soundness: SOUND
      independent_check_of_each_step:
        - step: 'Markov: P[X >= 33] <= E[X]/33 for a non-negative integer X'
          result: 'correct; the bound is attained by X = 33 with probability E[X]/33 and 0 otherwise, which is admissible and respects X <= 8*(L-1) because 33 <= 504'
        - step: 'covering construction on [0,1) with m = 32768 arcs of length p = mu/33 at offsets i/m'
          result: >-
            correct. p > 1/m is required for the arcs to cover, and I
            recomputed p at every row: the smallest is 0.009544856439 at
            bits=30 against 1/32768 = 0.000030517578125, a factor of about
            313. Every x in [0,1) lies in the arc indexed by floor(x*m), so the
            union is the whole circle and the familywise overflow probability
            is exactly 1. E[X_i] = 33p = mu holds by construction.
        - step: 'symmetric certificate X_i = 1[B_i] with P[B_i] = mu'
          result: 'correct; mu <= 1 at both slices, E[X_i] = mu, and P[X_i >= 33] = 0'
        - step: 'conclusion that HA-2 excludes no answer'
          result: 'correct at the endpoints; see VAL-A723AF-R5 for the intermediate values'
    scoping_check_this_review_was_asked_to_make:
      is_it_read_as_a_claim_about_H_SYC_b854f4: NO
      is_it_read_as_a_claim_about_ECDLP: NO
      is_it_read_as_a_claim_about_any_curve: NO
      is_it_a_crypto_scale_or_transfer_claim: NO
      evidence_the_artifact_scopes_itself_correctly:
        - 'design_repair_report.claim_boundary says exactly this in its own words'
        - 'C-HA2-5 restates that a realized overflow is apparatus invalidity and never negative evidence about H-SYC-b854f4 or ECDLP'
        - 'decision_logic.negative_effect repeats it and cites AGENTS.md rule 3'
        - 'B-R1 and the report''s open-residual row both qualify the impossibility with "under HA-2 as stated" / "from HA-2 alone"'
        - 'scope.cryptographic_scale_claim is forbidden and transfer_authorized is false'
      the_179_2_bit_figure:
        finding: >-
          The threshold 18*(15 - log2(33)) = 179.2009 recomputes exactly, and
          so does the 98304 variant at 207.7302. This is the single number in
          the record most exposed to misreading, because 179 bits sits near
          cryptographic sizes. The artifact disclaims it explicitly and
          correctly in C-HA2-4.scope_of_that_statement: it extends a frozen
          symbolic expression while holding capacity 32 and the tuple count
          fixed, and is not a transfer, an extrapolation of a measurement, or a
          statement about how the design would be parameterised at a larger
          order.
        validator_position: >-
          The disclaimer is adequate as written. Downstream records must not
          quote 179.2009 without the sentence that scopes it, and no downstream
          record may treat it as a cryptographic-scale statement.
        recomputed: '18*(15 - log2(33)) = 179.20090585154782; 18*(15 - log2(11)) = 207.73023086452866'
    overreach_found: VAL-A723AF-R2
    limits_of_the_negative:
      statement: >-
        The proved negative is about HA-2 in isolation. It does not show that
        no capacity-adequacy argument exists from the full assumption set. The
        artifact's route menu C-HA2-6 offers a new numbered heuristic, a
        deterministic capacity, or the status quo, and does not consider a
        joint argument from HA-1's own boundary (sides N^(1/3+o(1)), combined
        selected pairs at most 8L, multiplicities N^o(1)) together with HA-2,
        nor any structural argument about the exact-match count. That is a gap
        in the menu, not an error in the negative; recording it keeps B-R1 from
        being over-read.
      severity: non_blocking_observation
      id: OBS-V8

