  # ---------------------------------------------------------------------------
  blocker_by_blocker:

    - blocker_id: PRODUCER-POLICY-RESOLUTION-BINDING
      severity: blocking
      disposition: REPAIRED
      what_was_wrong: >-
        The superseded producer receipt requested coordinator-orchestration-code
        but launched gpt-5.6-sol while the frozen binding resolved that policy to
        gpt-5.6-terra, and it verified a short read-only probe rather than the
        authoring tokens.
      what_this_successor_does:
        - >-
          Records requested_policy and resolved_model_id as SEPARATE fields in
          all six artifacts; neither is ever written in place of the other.
        - >-
          Propagates the resolution verbatim from three committed records (the
          task card, the handoff envelope, and the batch contract) rather than
          inventing or re-probing it.
        - >-
          Cross-checks that propagated string against committed configuration by
          direct file read: orchestration/model-bindings.yaml defaults.backend =
          anthropic and bindings.anthropic.coordinator-orchestration-code.model =
          claude-opus-5, orchestration/model-policies.yaml
          policies.coordinator-orchestration-code.reasoning_effort = high, and
          .claude/agents/coordinator.md frontmatter effort = high.
        - >-
          Binds the receipt to the AUTHORING session: its declared scope is the
          entire authoring span of the single session that wrote all six
          artifacts, and it lists those six paths.
        - >-
          Sets probe_versus_authoring_gap to none and probe_session_launched to
          false, and never asserts that a probe verified authoring tokens.
      why_the_gap_cannot_exist_here: >-
        The coordinator role's declared tool surface in .claude/agents/coordinator.md
        is exactly Read, Grep, Glob, Write, Edit, SendMessage. With no
        command-execution tool this session could not launch a separate probe
        process even in principle, so a probe-versus-authoring split is not
        constructible here, not merely absent.
      what_was_deliberately_not_claimed:
        - >-
          The resolution command was NOT executed by this session, and the
          receipt says so with its reason. Asserting that it ran would be a
          fabricated command output.
        - >-
          No backend probe was performed and none is claimed; the anthropic
          binding carries last_probed: null in committed state.
        - >-
          No session UUID is asserted because this runtime exposes none.
        - >-
          No SHA-256 digest was computed by this producer; every digest in the
          artifacts is a quotation with its citing record named.
      residual_limitation: >-
        The binding is an authoring-session self-attestation cross-checked
        against committed configuration, not a third-party cryptographic
        attestation. The completion gate asked for a gap-free binding of
        requested policy, resolved model, and the authoring session; that is
        delivered. An external attestation is not something this runtime can
        produce, and it is disclosed rather than simulated.
      fallback_used: false
      degraded: false
      inference_amendment_created: false

    - blocker_id: HA2-EXPECTATION-NOT-TAIL
      severity: blocking
      disposition: REPAIRED_WITH_PROVED_UNAVAILABILITY_OF_SIMULTANEOUS_TAIL
      what_was_wrong: >-
        The HA-2 values are expectations only, giving no tuplewise,
        simultaneous-tail, or worst-case guarantee, so a positive-probability
        thirty-third distinct value remains compatible with the stated mean.
      contracts_supplied:
        - id: HA2-WORSTCASE-C1
          kind: worst-case
          status: SUPPLIED_AND_NEGATIVE
          content: >-
            Every retained candidate originates from a charged
            selected_pair_comparisons event, giving the deterministic per-tuple
            bound 8*(L-1) = 504, 1016, 2040, 4088, 8184, which exceeds capacity
            32 at every ladder size by 472, 984, 2008, 4056, 8152.
          falsification_condition: >-
            exhibit a retained candidate not traceable to a charged
            selected_pair_comparisons event, or occupancy above 8*(L-1)
          consequence: capacity 32 is not worst-case adequate; overflow invalidation is mandatory
        - id: HA2-TUPLEWISE-C2
          kind: tuplewise tail
          status: SUPPLIED_SHARP_NON_CERTIFYING
          content: >-
            X is nonnegative and integer-valued, so Markov gives
            P(X >= 33) <= mu/33, numerically 0.015151515152, 0.013498465426,
            0.012025765545, 0.010713739109, and 0.009544856439 at bits
            18/21/24/27/30 under gamma_x=5/18, and 0.030303030303 at the
            gamma_x=1/3 ceiling.
          sharpness: >-
            attained by the two-point law X=33 with probability mu/33 and X=0
            otherwise, so no stronger bound follows from the mean alone
          assumption_basis: HA-2 mean only; no independence, concentration, or higher moment assumed
          falsification_condition: >-
            exhibit a nonnegative integer X with E[X]=mu and P(X >= 33) > mu/33
            (impossible), or show candidate_index is not the count X that HA-2
            governs (which falsifies applicability, not the inequality)
          consequence: >-
            a per-tuple overflow probability of order 1e-2 is not a safety
            margin; this contract is real but non-certifying
      contract_not_supplied:
        id: HA2-SIMULTANEOUS-C3
        kind: simultaneous (familywise) tail over the 98304 tuples per size
        status: NOT_SUPPLIED_AND_PROVED_UNAVAILABLE_FROM_COMMITTED_HEURISTICS
        proof_sketch:
          L2_first_moment: >-
            union bound 98304*mu/33 = 2978.909090909091*mu equals 1489.454545,
            1326.953145, 1182.180856, 1053.203409, and 938.297567 at bits
            18/21/24/27/30 under gamma_x=5/18 and 2978.909091 at gamma_x=1/3;
            all exceed 1, so the bound is vacuous everywhere. Non-vacuity would
            require mu <= 33/98304 = 11/32768 = 0.000335693359375, a shortfall
            factor equal to the familywise bound itself.
          L3_second_moment: >-
            with kappa = E[X^2]/E[X] from HA-3, Markov on X^2 gives familywise
            98304*kappa*mu/1089, and non-vacuity requires
            kappa*mu <= 1089/98304 = 363/32768 = 0.011077880859375. But
            X^2 >= X pointwise for nonnegative integer X forces kappa >= 1, and
            the smallest ladder mean is 0.3149802624737183, so
            kappa*mu >= 0.3149802624737183 > 0.011077880859375 everywhere. The
            second moment does not rescue the bound.
          L4_convention_is_not_tail_safe: >-
            applying the frozen o(1)=0 convention to HA-3's kappa_N forces
            kappa = 1, and for nonnegative integer X, E[X^2]=E[X] holds iff X is
            supported on {0,1}, giving P(X >= 33)=0 by fiat. A certificate that
            assumes its conclusion is rejected; the convention is admitted for
            HA-2 mean arithmetic only.
          L5_what_would_be_required: >-
            a non-vacuous familywise bound needs strictly more than the first
            two moments: an explicit finite-N upper-tail assumption, a genuine
            higher-moment control, or a declared dependence structure across the
            98304 tuples. None exists in H-SYC-b854f4 and none is assumed here.
        mandatory_negative_kat_retained:
          id: NKAT-HA2-EQUAL-MEAN
          construction: 'X=33 with probability mu/33 and X=0 otherwise'
          effect: every displayed mean and margin is preserved exactly while a thirty-third value occurs
          status: MANDATORY_AND_RETAINED
          source: TASK-20260813-e04de4 control CTRL-HA2-TAIL-BOUNDARY
      exact_cost_of_the_missing_simultaneous_tail:
        - capacity 32 is not certified adequate in any probabilistic sense at any ladder size
        - >-
          the thirty-third-distinct-value overflow rule remains the only line of
          defence and its firing probability cannot be bounded away from 1
          across a full ladder
        - >-
          no per-attempt-cost times inverse-success-probability bookkeeping is
          available, so no cost, frontier, dominance, speedup, or advantage
          claim is admissible even after a future implementation
        - >-
          the prospective 450000/562500 wall-second and 988/1235 CPU-hour
          schedule is exposed to invalidation at an unquantified probability,
          a budget risk this design cannot price
        - >-
          promotion gate 2 (numbered heuristics with archived validation) is
          unsatisfied on the HA-2 axis, capping any dependent claim below
          `supported`
        - >-
          the named repair routes are not taken here: a new numbered finite-N
          tail heuristic with a ladder-scale occupancy-distribution validation
          control, or widening candidate_index to at least 8*(L-1)+1 values,
          which at bits 30 needs at least a 14-bit index and therefore strictly
          worsens all three open capacity residuals

    - blocker_id: SYSTEM-PEAK-LIVE-CONCURRENCY
      severity: blocking
      disposition: REPAIRED
      what_was_wrong: >-
        The predecessor froze a maximum over per-shard streams. A maximum across
        workers is not aggregate live memory and undercounts by up to eightfold.
      frozen_rule: 'peak_live_bytes_system = max_t( shared(t) + sum_j concurrent_nonshared_shard_j(t) - dedup(t) )'
      time_base_defined: >-
        one host monotonic clock for all nine streams, timestamped allocate/free
        deltas forming right-continuous step functions, exact evaluation at every
        event timestamp in the merged event set, sampling forbidden, multi-host
        execution invalidates
      dedup_defined: >-
        dedup(t) = sum over physical pages P live at t of (c_P(t) - 1)*bytes(P)
        where c_P(t) counts how many of the nine accounting terms charge P;
        0 <= dedup(t) <= sum_j nonshared_j(t); unproved duplication is set to 0
        so it can never reduce the reported peak; shared bytes are counted
        exactly once under either accounting
      kats_frozen:
        - {id: KAT-PEAK-1, fixture: eight one-byte non-shared shard allocations live simultaneously, expected_peak: 8, rejects: 'max-of-shards value 1'}
        - {id: KAT-PEAK-2, fixture: the same eight allocations at pairwise disjoint times, expected_peak: 1, rejects: 'sum-of-independent-maxima value 8'}
        - {id: KAT-PEAK-3, fixture: KAT-PEAK-1 plus one shared one-byte allocation, expected_peak: 9, rejects: 'value 17 without dedup, value 8 with shared dropped, value 2 with max-of-shards'}
        - {id: KAT-PEAK-4, fixture: KAT-PEAK-2 plus one shared one-byte allocation, expected_peak: 2, rejects: 'value 9 sum-of-maxima, value 1 shared dropped, value 3 shared charged per shard without dedup'}
        - {id: KAT-PEAK-5, fixture: seven simultaneous shards plus one staggered shard, expected_peak: 7, rejects: 'value 1 and value 8', status: additional_discriminator}
        - {id: KAT-PEAK-6, fixture: KAT-PEAK-1 observed only outside the live window, expected_result: INVALID, status: null_control_against_sampled_census}
      both_error_directions_rejected: true
      shared_counted_exactly_once: true
      executed: false
      execution_note: >-
        nothing was run. The KATs are contract fixtures whose expected values are
        fixed in advance of any implementation; no measurement exists.
      rt_obj2_closure_effect: >-
        PRESERVED AND STRENGTHENED. Shard counts 8/8/8, maximum_parallel_shards
        8, the refusal of shard-invariance, the all-eight-shard census, and
        missing-shard invalidation are all unchanged. Only the composition rule
        changed, and it changed in exactly the direction the Red Team record
        that closed RT-OBJ2 demanded (objection RT-V5-OBJ1). No dependent numeric
        value required recomputation because no measured or static numeric peak
        exists in the predecessor chain.
      new_residual_created:
        id: PEAK-AGGREGATE-FIT-UNPROVED
        statement: >-
          under the corrected rule the unchanged maximum_memory_gb ceiling of 2
          binds an aggregate over nine concurrently live streams rather than a
          per-shard maximum, and the aggregate can exceed any per-shard figure by
          up to eightfold; with no byte figure available, fit is unproved
        cap_raised: false
        honesty_note: >-
          this residual exists because the repair is correct. The predecessor's
          rule concealed it by undercounting, so disclosing it is progress, not
          regression.

