required_successor_repairs:
  - id: PRODUCER-POLICY-RESOLUTION-BINDING
    severity: blocking
    checkpoint_statement_verbatim: >-
      The frozen producer receipt requested coordinator-orchestration-code but
      launched gpt-5.6-sol while the frozen binding resolved that policy to
      gpt-5.6-terra. The receipt verifies a short probe, not the later
      authoring tokens; no permitted fallback or inference amendment repairs
      this mismatch.
    requirement: >-
      The successor's runtime receipt must bind requested policy, resolved
      model, and the AUTHORING session as one, with NO probe-versus-authoring
      gap. Requested policy and resolved model are written as SEPARATE fields
      everywhere. No probe may be asserted to have verified authoring tokens.
    propagated_provenance_fact:
      resolution_command: python3 -m orchestration.adapter resolve --role coordinator
      resolution_command_output: coordinator-orchestration-code -> anthropic:claude-opus-5 (effort=high)
      requested_policy: coordinator-orchestration-code
      resolved_model_id: anthropic:claude-opus-5
      reasoning_effort: high
      source: propagated as given to this Coordinator, not invented or re-probed here
  - id: HA2-EXPECTATION-NOT-TAIL
    severity: blocking
    checkpoint_statement_verbatim: >-
      The HA-2 values are expectations only. They give no tuplewise,
      simultaneous-tail, or worst-case guarantee, so a positive-probability
      thirty-third distinct value remains compatible with the stated mean.
    requirement: >-
      Supply a justified tail or worst-case contract, or state explicitly and
      prominently that the design cannot supply one and exactly what that
      costs. Retain the equal-mean negative KAT from TASK-20260813-e04de4:
      X=33 with probability mu/33 and X=0 otherwise preserves every displayed
      mean while a thirty-third distinct value occurs with positive
      probability.
    ha2_expectation_values_gamma_x_5_over_18:
      bits_18: '64.000000000000'
      bits_21: '71.837571091800'
      bits_24: '80.634947193272'
      bits_27: '90.509667991878'
      bits_30: '101.593667325965'
    ha2_expectation_margin_gamma_x_1_over_3: '32.000000000000'
    ha2_values_are: expectations_only_no_tuplewise_no_simultaneous_tail_no_worst_case
  - id: SYSTEM-PEAK-LIVE-CONCURRENCY
    severity: blocking
    checkpoint_statement_verbatim: >-
      System peak must be computed as
      max_t(shared(t)+sum_j concurrent_nonshared_shard_j(t)-dedup(t)), not as
      a maximum over isolated per-shard peaks. The required KAT binds eight
      simultaneous shards, one staggered shard, and shared allocation counted
      exactly once.
    requirement: >-
      Freeze the time-aligned aggregate rule with an explicit synchronized time
      base and an explicit dedup(t) term, and freeze the KAT: eight disjoint
      one-byte non-shared shard allocations live simultaneously yield peak 8;
      the same allocations at disjoint times yield peak 1; one shared one-byte
      allocation added to both fixtures is counted exactly once. The KAT must
      reject both max-of-shards undercounting and sum-of-independent-maxima
      overcounting.

