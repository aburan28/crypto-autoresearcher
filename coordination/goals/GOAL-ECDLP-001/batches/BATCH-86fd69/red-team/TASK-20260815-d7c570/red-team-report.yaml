    - id: HA2-EXPECTATION-NOT-TAIL
      disposition: PASS_ON_THE_IMPOSSIBILITY_ARGUMENT_REVISE_ON_TWO_LITERAL_DEFECTS
      impossibility_argument_attack: >-
        Independently recomputed every number in lemmas L2-L5 with arbitrary-precision
        Decimal arithmetic (not trusted from the record). The union bound
        98304*mu/33 = 2978.909090909091*mu reproduces exactly: 1489.454545, 1326.953145,
        1182.180856, 1053.203409, 938.297567 at bits 18/21/24/27/30 (gamma_x=5/18), and
        2978.909091 at the gamma_x=1/3 ceiling (all six figures reproduce to the stated
        decimal places under standard rounding). The non-vacuity threshold 33/98304 =
        11/32768 = 0.000335693359375 is exact. The second-moment threshold
        1089/98304 = 363/32768 = 0.011077880859375 is exact, and kappa>=1 (since
        X^2>=X pointwise for nonnegative integer X, so E[X^2]>=E[X]) is a correct,
        elementary fact, making kappa*mu>=mu>=0.3149802624737183 at every ladder size,
        which exceeds the threshold by more than an order of magnitude everywhere. I also
        checked whether a genuinely different second-moment route (Chebyshev/Cantelli rather
        than Markov-on-X^2) could rescue the bound: it cannot, because HA-3 supplies no
        finite-N NUMERIC upper bound on kappa at all (only the asymptotic statement
        kappa_N=N^o(1)); the only way to get a number is the same zero-o(1) convention that
        L4 already shows forces kappa=1 and trivializes the tail to zero by fiat. I also
        checked whether tuple dependence could rescue a familywise bound without a new
        heuristic: a union bound is valid under ANY dependence structure (positive, negative,
        or none), so exploiting dependence to IMPROVE on it requires additional information
        (e.g. pairwise co-occurrence probabilities) that HA-2/HA-3 do not supply either. On
        every route I tried, the record's conclusion holds. THE IMPOSSIBILITY ARGUMENT IS
        AIRTIGHT AS SCOPED. It is also correctly and narrowly scoped -- "unavailable FROM THE
        COMMITTED HEURISTIC RECORD," not a universal impossibility -- and it satisfies the
        inventor-protocol closure standard (named obstruction with exact numbers, a five-lemma
        argument, and two named forward routes: a new numbered finite-N tail heuristic with a
        ladder-scale validation control, or widening candidate_index capacity). This is a
        well-executed static closure, not a fatigue report wearing a number, and it does not
        foreclose either forward route -- both are explicitly left open with revisit
        conditions, matching docs/inventor-protocol.md section 4's premature-closure check.
      literal_defect_1_mislabeled_serialization_convention: >-
        contract_2_tuplewise_tail (specification.yaml) and KAT-HA2-TUPLEWISE-MARKOV
        (verification-and-null-kats.yaml) both declare "twelve decimal places, truncation of
        the long division." Independently recomputing mu/33 to 30 decimal places with exact
        arithmetic and TRUNCATING (not rounding) at the 12th place gives 0.015151515151 (bits
        18), 0.013498465426 (bits 21), 0.012025765545 (bits 24), 0.010713739108 (bits 27),
        0.009544856438 (bits 30). The record's actual values are 0.015151515152,
        0.013498465426, 0.012025765545, 0.010713739109, 0.009544856439 -- three of five rows
        (bits 18, 27, 30) match ROUNDING, not the declared truncation; the other two (21, 24)
        happen to coincide under both conventions because their 13th digit is < 5. This is a
        genuine, reproducible disagreement between the record's stated methodology and its
        own delivered literals, present identically in two frozen artifacts. It does NOT
        change the substantive conclusion (the familywise union bound is computed directly
        from mu, not from this intermediate truncated value, so vacuity is unaffected;
        "non-certifying, order 1e-2" also survives either convention), but per this task's
        invalidation trigger ("any disagreement with exact recomputation of the frozen
        literals") it is a required correction: either relabel the convention as rounding, or
        recompute the three affected rows to genuine truncation.
      literal_defect_2_bit_width_arithmetic_error: >-
        Three frozen artifacts (specification.yaml line ~560, design-repair-report.yaml line
        ~236, custody-and-executable-contract.yaml line 115) identically state that widening
        candidate_index to at least 8*(L-1)+1 = 8185 admissible values at bits 30 "needs at
        least a 14-bit index." Independently recomputed: 2^13 = 8192 >= 8185, so 13 bits
        suffice to index 0..8184 (8185 distinct values); 2^12 = 4096 < 8185 is insufficient.
        The minimal bit-width is 13, not 14. This is a genuine arithmetic error, reproduced
        consistently (not a one-off transcription slip) across three artifacts, and it is new
        to this successor -- it does not appear in the predecessor checkpoint or the prior
        red-team report I checked it against. It sits inside forward guidance for a
        NOT-taken route (capacity widening), so it does not affect the current REVISE
        disposition, but it is exactly the kind of frozen literal this task asked me to
        independently recompute, and it must be corrected before any future successor relies
        on "14-bit" as a sizing figure. (The qualitative point that widening at least doubles
        the storage width from U8 to a byte-aligned U16 remains correct in practice, since 13
        bits does not fit in a byte either -- only the specific "14" is wrong.)
      required_controls:
        - >-
          Recompute contract_2_tuplewise_tail / KAT-HA2-TUPLEWISE-MARKOV bits 18/27/30 rows
          under genuine truncation (0.015151515151 / 0.010713739108 / 0.009544856438), or
          relabel the stated convention as "rounded to nearest" and keep the current values.
        - >-
          Correct "14-bit index" to "13-bit index" (2^13=8192 >= 8185) in all three affected
          artifacts.

    - id: SYSTEM-PEAK-LIVE-CONCURRENCY
      disposition: PASS_ON_THE_RULE_AND_ALL_SIX_KATS_REVISE_ON_KAT_SUITE_COVERAGE
      rule_and_kat_correctness: >-
        The frozen rule max_t(shared(t)+sum_j concurrent_nonshared_shard_j(t)-dedup(t)) is
        mathematically the correct time-aligned aggregate (a genuine improvement over both
        rejected rules: max-of-shards undercounts, sum-of-independent-maxima overcounts).
        Independently re-derived the expected value of all six KATs from their stated event
        sets: KAT-PEAK-1 (8 simultaneous, 0+8-0=8) correct; KAT-PEAK-2 (8 staggered,
        0+1-0=1 at every event) correct; KAT-PEAK-3 (8 simultaneous+shared, both accountings
        1+8-0=9 and 1+16-8=9 agree, and the dedup(t)=8 in accounting B correctly reflects
        c_P(t)=9 accounting terms charging the one shared physical page, so
        (9-1)*1=8) correct; KAT-PEAK-4 (8 staggered+shared, 1+1-0=2, and the named wrong
        value 3 = 1+2-0 correctly demonstrates the undedup'd overcount) correct; KAT-PEAK-5
        (7 simultaneous+1 staggered, max(7,1)=7) correct; KAT-PEAK-6 (sampled census null
        control, correctly demands INVALID rather than a silently undercounted 0 or a
        fabricated 8) correct. All six are internally consistent and each does discriminate
        the specific wrong rule it targets.
      coverage_gap_constructed: >-
        Attacking the KAT SUITE's coverage rather than the rule: all six fixtures use only
        "fully coincident" (all-8, or 7-of-8, share the exact same start/end instant) or
        "fully pairwise-disjoint" window topologies. None tests a genuine PARTIAL overlap
        where the maximal concurrently-live subset is strictly between 1 and 8 and must be
        found by an actual sweep over event times rather than by recognizing one of the two
        extreme shapes. Concrete fixture that reveals this: shard j (j=1..8) allocates 1 byte
        at t=j and frees it at t=j+4 (each shard's window has length 4, offset by 1); shared=0,
        dedup=0. Evaluating the frozen rule at every event timestamp gives, e.g. at t=4.5,
        shards {1,2,3,4} live (sum=4), and at t=5.5, shards {2,3,4,5} live (sum=4); the
        maximum over t is 4 throughout the interior (standard sliding-window overlap =
        min(window_length, shard_count) = min(4,8) = 4) -- a value that is neither 1, 7, nor
        8, and that none of the six frozen fixtures would catch a wrong implementation on.
        A plausible-but-wrong implementation that special-cases exactly the three topologies
        the six KATs exercise ("if all windows identical: sum; elif all windows pairwise
        disjoint: take the single max; else: fall back to some other rule") would PASS all
        six frozen KATs while returning 1 or 8 instead of the correct 4 on this fixture. This
        is precisely the scenario item 3 of this task asked me to construct.
      required_control: >-
        Add a KAT-PEAK-7 partial/staircase-overlap fixture (e.g. the one above, expected peak
        4) to the mandated set before the peak-axis KAT suite is treated as sufficient to
        discriminate all plausible wrong implementations, not merely the two extreme
        topologies (full-coincidence, full-disjointness) the current six already cover well.

  # ===========================================================================
  RT_OBJ3_RT_OBJ4_continuity_check:
