  session_provenance_finding:
    id: RED-TEAM-SESSION-POLICY-BINDING-MISMATCH
    severity: blocking_provenance_defect_for_this_receipt_not_for_the_reviewed_design
    finding: >-
      This session's requested_policy is review-adversarial. Independently running
      `python3 -m orchestration.adapter resolve --role red-team --independent-session`
      returns "review-adversarial -> anthropic:claude-opus-5 (effort=xhigh)", and a direct
