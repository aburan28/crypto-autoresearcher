  blocker_by_blocker_findings:

    - id: PRODUCER-POLICY-RESOLUTION-BINDING
      disposition: PASS_WITH_ONE_NAMED_RESIDUAL_GAP
      independent_verification: >-
        All facts in the producer's independent_static_cross_check were independently
        re-read at the snapshot commit and confirmed true, not merely trusted: defaults.backend
        = anthropic (orchestration/model-bindings.yaml line 28); bindings.anthropic.
        coordinator-orchestration-code.model = claude-opus-5, provenance = runtime-verified,
        last_probed = null (lines 38-41); orchestration/model-policies.yaml
        policies.coordinator-orchestration-code.requires.reasoning_effort = high and
        .reasoning_effort = high (lines 41-65); .claude/agents/coordinator.md frontmatter
        effort: high, model: inherit, tools: Read, Grep, Glob, Write, Edit, SendMessage (no
        command-execution tool, confirmed -- the "gap is not constructible" argument is
        structurally correct for this role).
      probe_versus_authoring_gap: >-
        Correctly closed for the ORIGINAL defect shape (a separate short probe subprocess
        verifying tokens distinct from later authoring tokens): the coordinator role has no
        Bash/exec tool, so a probe process cannot exist in this session, and none is claimed.
      remaining_gap_named: >-
        The receipt's "gap_impossibility_reason" only rules out a cross-PROCESS probe split.
        It does not, and cannot, rule out same-session drift or resumption (e.g. context
        compaction, session restart, or a host-level model substitution mid-session) silently
        changing the effective serving model without any external signal the agent could
        detect -- "runtime_declared_model_name" is itself a self-report from the same
        potentially-drifted session, not an external check. The receipt's limitations list
        names "not a third-party attestation" and "last_probed: null" but does not separately
        name this same-session-drift channel as still open. This session's own
        session_provenance_finding above is direct, first-hand evidence that a policy/binding
