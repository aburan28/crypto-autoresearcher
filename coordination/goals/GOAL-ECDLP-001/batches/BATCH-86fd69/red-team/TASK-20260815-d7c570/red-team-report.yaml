      control. The Coordinator should treat this receipt as provenance-suspect for
      strict policy-compliance purposes and decide whether to re-dispatch under a
      corrected binding or record a Coordinator-approved inference_amendment
      (fallback_used/degraded with a stated reason) before this review counts toward
