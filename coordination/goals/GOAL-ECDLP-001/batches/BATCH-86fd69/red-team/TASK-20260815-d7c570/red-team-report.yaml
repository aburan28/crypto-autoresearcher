      orchestration/model-bindings.yaml; or a stale, never-probed committed binding --
      last_probed is null for review-adversarial/anthropic in committed state).
    disposition: >-
      Disclosed rather than silently substituted or hidden, per the task card's own
      resolved_model_id_note ("a mismatch with the requested policy is a blocking
      provenance defect, never a silent substitution"). This session completed the
      substantive review rather than refusing outright, because every conclusion below is
      independently reproducible arithmetic and citation-checking that a reader can
      re-verify regardless of which model produced it; refusing would delete the findings
