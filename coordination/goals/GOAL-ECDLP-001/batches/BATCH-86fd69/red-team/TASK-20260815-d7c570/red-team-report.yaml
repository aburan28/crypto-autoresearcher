        harness, not a closed hypothetical -- which makes the omission material rather than
        pedantic.
      cheapest_falsification_control: >-
        Have the launching/dispatching layer (not the subagent) record, per task, its own
        observed model/backend identifier from outside the subagent's self-report (e.g. from
        the harness's own launch parameters or API response metadata), and cross-check it
