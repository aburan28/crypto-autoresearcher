      -- e.g. no scoping to a subset of ladder sizes, no claim of partial progress, no folding
      into the HA-2 or peak-axis repairs. Both remain fully open and non-blocking as carried.
    minor_note_not_a_defect: >-
      specification.yaml's RT-OBJ3/RT-OBJ4 text says "not folded into any other item" while
      design-repair-report.yaml's says "not folded into another item" -- a trivial wording
