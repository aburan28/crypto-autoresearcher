      runtime system context, however, self-reports its identity as claude-sonnet-5 --
      the model orchestration/model-bindings.yaml binds to the DIFFERENT, lower policy
      executor-implementation, not to review-adversarial. Neither AUTORESEARCH_POLICY
      nor AUTORESEARCH_BACKEND is set in this session's environment, so this session was
      not launched through the adapter-env mechanism CLAUDE.md describes for recording a
      resolved policy at launch time.
    why_this_is_exactly_the_class_under_review: >-
      PRODUCER-POLICY-RESOLUTION-BINDING's original defect was "requested
      coordinator-orchestration-code but launched gpt-5.6-sol while the frozen binding
      resolved that policy to gpt-5.6-terra." This session's own mismatch has the same
      shape: requested review-adversarial, committed binding says claude-opus-5, actual
      self-reported identity is claude-sonnet-5. The handoff sets fallback_allowed:false
      and degraded_allowed:false; this session did not select the substitution and cannot
      determine its cause (candidates named without asserting one: an unauthorized upstream
