  objective: >-
    Try to falsify EXP-SYC-793304's three claimed blocker repairs -- the
    producer policy/authoring-session binding, the HA-2 tail or worst-case
    contract (or its declared absence), and the time-aligned all-shard
    system-peak rule and its KAT -- and construct a competing counterexample,
