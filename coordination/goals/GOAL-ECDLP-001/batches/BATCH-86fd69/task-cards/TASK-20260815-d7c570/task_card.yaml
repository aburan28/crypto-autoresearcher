  - RT-OBJ4
  attack_surfaces:
  - id: SYSTEM-PEAK-LIVE-CONCURRENCY
    probe: >-
      Construct a fixture separating max_t(shared(t) + sum_j
      concurrent_nonshared_shard_j(t) - dedup(t)) from any maximum over isolated
      per-shard peaks, and check the frozen KAT binds eight simultaneous shards,
      one staggered shard, and shared allocation counted exactly once --
      rejecting both max-of-shards undercounting and sum-of-independent-maxima
      overcounting.
  - id: HA2-EXPECTATION-NOT-TAIL
    probe: >-
      Test whether any offered tail or worst-case contract actually excludes the
      equal-mean counterexample X=33 with probability mu/33 and X=0 otherwise,
      which preserves every displayed mean while a thirty-third distinct value
      occurs with positive probability. If the successor instead declares that
      no such contract exists, judge whether that declaration is prominent and
      whether its stated cost to the design is honest.
  - id: PRODUCER-POLICY-RESOLUTION-BINDING
    probe: >-
      Check whether requested policy, resolved model, and the AUTHORING session
      are bound as one, with no probe-versus-authoring gap and with requested
      policy and resolved model recorded as separate fields. A receipt verifying
      only a probe fails.
