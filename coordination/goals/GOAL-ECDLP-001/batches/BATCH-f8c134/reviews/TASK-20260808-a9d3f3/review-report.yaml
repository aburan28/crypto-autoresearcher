  gate_reviews:
    - gate: immutable_snapshot_paths_hashes_parent_and_message
      verdict: PASS
      detail: >-
        Git independently confirms the declared parent, exact four-path commit
        diff, all four content hashes, all required message IDs, and reachability
        from dispatch HEAD.

    - gate: current_corpus_binding_and_coverage_limitations
      verdict: PASS
      detail: >-
        All 72 pre-proposal literal-tag files and class counts reproduce at the
        bound ancestor, with zero missing paths or hash mismatches. The proposal
        expressly retains the external, KB, and cross-tag limitations.

    - gate: asymptotic_full_cost_arithmetic_and_crossovers
      verdict: PASS
      recomputation: >-
        With T=N^(2/3-gamma) and S=N^(1/3), the KN-TECH-035 charge
        T*S^(1/3) is N^(7/9-gamma). The raw rho crossover is gamma greater
        than 1/6 and the full-cost rho crossover is gamma greater than 5/18.
        Candidate-minus-rho deltas 1/6-gamma and 5/18-gamma are correct.
      limitation: >-
        This passes only the asymptotic algebra. The separate concrete-row gate
        below does not pass.

    - gate: concrete_crypto_cost_rows
      verdict: REVISE
      detail: >-
        The exponent-only rows at 256, 384, and 512 bits and all full-cost
        exponent additions recompute. However, the same proposal freezes a
        per-root cap of 24*L group-equivalents. The candidate raw rows set that
        known constant to one, omitting log2(24)=4.5849625007 bits, while rho
        retains its log2(0.886)=-0.1749 constant and memory rows retain record
        width and worker constants. The result is not a matched concrete table.
        Known group-work constants, expected-root constants, storage-byte
        constants, and full-cost constant conventions must either be charged
        consistently or every row must be explicitly labeled exponent-only.

    - gate: root_algorithm_denominator_and_work_consistency
      verdict: REVISE
      detail: >-
        Lines defining the root observables call D_r the exact number of
        enumerated selected cross-pairs and say the A_r by B_r cross-product is
        enumerated. With both selected lists of size N^(1/3), literal enumeration
        costs N^(2/3), contradicting H1's N^(1/3) per-root cost. A valid linear-list
        implementation may compute D_r=|A_r|*|B_r| combinatorially and hash-join
        only equal point-sum candidates. The proposal must say that explicitly,
        state the collision-output-sensitive work term, and carry heavy-output
        invalidation into the budget.

    - gate: d_y_x_i_success_probability_bridge
      verdict: REVISE
      sound_part: >-
        For mu=E[X], H3 gives E[X^2] at most mu+kappa*mu^2, so
        Paley-Zygmund yields Pr[X at least 1] at least
        mu/(1+kappa*mu), while Markov yields Pr[X at least 1] at most mu.
        If gamma_X is strictly below 1/3 and kappa=N^o(1), the Boolean and
        distinct-count exponents agree. At gamma_X=1/3, bounded kappa plus a
        separate constant-success condition is correctly required.
      blocker: >-
        The advancement gate says only that H3 and H4 must survive. It supplies
        no finite-size estimator, confidence bound, pass threshold, scaling
        tolerance, or invalidation threshold for kappa, Y/max(X,1), mmax,
        duplicate scalars, or duplicate pair sums. H3's expectation also needs
        an explicit curve/root/model distribution. Without operational criteria,
        a future result cannot be classified reproducibly as passing the bridge.

    - gate: clustered_inference_intercept_finite_size_and_zeros
      verdict: REVISE
      sound_part: >-
        Curve is correctly declared the outer independent unit, roots are the
        minimum repeated unit, models are nested, cross-pairs are prohibited as
        units, both models use a free intercept and N^(-1/3) term, and exact
        zeros are retained without pseudocounts. All-zero or unidentified arms
        are correctly inconclusive.
      blocker: >-
        The exact 2^6 sign enumeration is not tied to a precise estimand. There
        are six curves per size and seven sizes, hence 42 size-specific curve
        clusters unless an unrecorded cross-size coupling exists. Six signs can
        test a within-size sharp paired null, but cannot by itself provide the
        cross-size one-sided lower bound for gamma_B. The proposal must state
        the joint resampling/randomization scheme, covariance model, interval
        construction, and how model heterogeneity and the fraction of models
        crossing the gate are reported.

    - gate: exact_null_positive_and_multiplicity_controls
      verdict: REVISE
      sound_part: >-
        N0 prohibits per-pair relabeling and freezes a global antisymmetric map;
        the quotient G=Z/(F*K)Z has exact fiber size F and probability 1/K;
        planted Poisson X with I=1[X>=1] correctly calibrates distinct and
        Boolean fits; and MT changes only Y.
      blocker: >-
        N1 names a seeded bijection of scalar negation orbits but does not freeze
        an exact scalable permutation construction or its operation/storage
        charge. N0 leaves SHAKE word width, byte order, stream expansion, and
        its relationship to the separately named integer-null stage unstated.
        N1 and the planted arms lack fully domain-separated seeds and finite
        acceptance tolerances. These are not yet executable frozen controls,
        and the global O(N)-permutation work is absent from the stage totals.

    - gate: isomorphic_model_distribution_selection_and_cost
      verdict: REVISE
      sound_part: >-
        The map from E to E_u and its coefficient scaling are correct. Four
        public models are sampled independently of success, no model is selected
        in the primary analysis, and models are correctly nested within curves.
      blocker: >-
        The prior repair gate required persistence, heterogeneity, and the
        fraction of models crossing the gate. The replacement pools models but
        does not freeze those diagnostics. The optional K=16 selector does not
        define its label-dispersion statistic or quantify model-construction
        cost. If K=N^tau models receive only a fixed pilot and one model enters
        the main run, the selector contributes a separate N^tau term and total
        time is the maximum of that term and the main term, not automatically an
        additive tau on the main exponent. The selection algorithm and cost
        composition need an exact statement.

    - gate: narrowed_gamma_ceiling
      verdict: PASS
      detail: >-
        The replacement no longer asserts a pointwise universal ceiling. Under
        a fixed target-independent M-label map, uniform pooled target/root, and
        minimum fiber (N/M)N^(-o(1)), exact-hit probability is at most
        M/N*N^o(1), so enrichment is at most M*N^o(1) and gamma is at most
        1/3+o(1). X is pointwise no larger than multiplicity Y, so distinct
        enrichment cannot exceed the same multiplicity ceiling. Irregular
        fibers, advice, adaptive selection, and pointwise claims are explicitly
        excluded.

    - gate: power_derived_root_schedule
      verdict: REVISE
      arithmetic_recomputation: >-
        The seven L values, all root rows, 780288 roots per arm, residual
        information 27.7660228004, lambda 2.8682694641, and the stated normal
        approximation of about 0.89 all reproduce from the written formula.
      blocker: >-
        The formula uses 768 expected root events per size and inserts an assumed
        design effect of two, but the declared independent unit is the curve and
        there are only six curves per size. No intra-curve correlation,
        between-model dependence, or curve random-effect variance establishes
        design effect two. It also uses gamma=0 rare-event information while the
        actual test boundary is gamma=5/18, where Boolean probabilities are no
        longer uniformly rare. A simulation or analytic power calculation for
        the full clustered cloglog model at the boundary and at gamma=11/36,
        including the 42-cluster layout and nuisance terms, is required. If
        curve heterogeneity dominates, more roots do not repair the missing
        outer-cluster power.

    - gate: staged_resource_total_arithmetic
      verdict: PASS
      recomputation:
        roots_per_complete_arm: 780288
        group_equivalents_per_treatment_arm: 6442057728
        group_equivalents_two_treatment_arms: 12884115456
        group_equivalents_including_calibration: 12885164032
        integer_hash_operations_per_full_arm: 8589410304
        integer_hash_and_synthetic_operations_total: 34674049024
        serialized_bytes_per_full_arm: 599261184
        bytes_cap_total: 5112594432
        seconds_cap_total: 99000
      detail: >-
        Every listed root, operation, byte, and seconds sum is arithmetically
        consistent, and 5112594432 bytes is below the declared 6 GiB disk cap.

    - gate: staged_resource_feasibility_and_completeness
      verdict: REVISE
      detail: >-
        At the admission thresholds, the charged group work requires about
        64426 seconds and all integer/synthetic work about 11558 seconds, so the
        aggregate arithmetic can fit the 99000-second cap. Feasibility is still
        not established because the throughput cell/worker aggregation is not
        frozen, the O(N) global permutation construction and storage are not
        charged, peak 4 GiB memory is asserted rather than derived, and the
        20L base plus 4L selected-pair constants lack an implementation path and
        fixed-base/list-reuse policy. Calibration must be tied to the largest
        relevant size and the exact allowed implementation, not treated as a
        generic throughput number.

    - gate: pareto_honesty_and_sota_delta
      verdict: PASS
      detail: >-
        The proposal correctly records rho domination at gamma at most 1/6,
        Pareto incomparability when lower time is bought with N^(1/3) memory,
        non-advancement through the full-cost boundary 5/18, and quantitative
        deltas against rho, standard BSGS, memory-matched BSGS, and aggregate
        vOW work. No realized Pareto improvement is claimed.

    - gate: provenance_and_binding_semantics
      verdict: REVISE
      sound_part: >-
        Producer and materializer roles, native OpenAI Codex model, max effort,
        no fallback, no degradation, and non-Bedrock declarations are internally
        consistent. The actual output snapshot is independently verified.
      blocker: >-
        The proposal field named snapshot_binding.commit and both producer
        companion bindings name 6a338238..., which is the authoring/corpus base
        ancestor and cannot contain the newly created proposal. The actual
        proposal snapshot is 339bfb2c.... Future records must label 6a338238...
        as the input or authoring-base binding and cite 339bfb2c... as the output
        snapshot; the current queue remains the authoritative immutable binding.

    - gate: low_prior_and_premature_closure_guard
      verdict: PASS
      detail: >-
        The prior assigns only 0.005 to clearing the full-cost advancement gate,
        priority remains low, and the proposal does not use low prior as a lane
        closure. A valid negative would remain limited to the tested selector,
        curve/root/model distribution, sizes, and controls.

    - gate: target_profile_and_claim_ceiling
      verdict: PASS
      detail: >-
        The proposal is exponent-first, conditional, cost-aware, and explicit
        that passing toy-scale controls would justify only further proof work.
        It does not claim a target-class theorem, a breakthrough, crypto-scale
        heuristic validation, or an affected deployed system. Proof maturity
        and crypto-scale validation remain future gates.

    - gate: proposal_only_boundary
      verdict: PASS
      detail: >-
        No experiment, implementation, run, empirical evidence, hypothesis/RQ
        transition, or official status change exists in the reviewed artifact.

    - gate: complete_discharge_of_prior_repair_matrix
      verdict: REVISE
      detail: >-
        The asymptotic cost, corpus, ceiling, zeros, Pareto, and proposal-only
        repairs are discharged. Algorithm/work consistency, operational H3/H4,
        clustered power, exact controls, isomorphic diagnostics/selection,
        matched concrete constants, feasibility, and binding semantics require
        another additive versioned repair before experiment design.

  blocking_findings:
    - id: F1-enumerated-cross-product-cost-contradiction
      severity: critical
      category: algorithm_and_cost_model
      finding: >-
        Literal enumeration of D=N^(2/3) cross-pairs contradicts an N^(1/3)
        per-root work bound. Replace enumeration with a precisely specified
        output-sensitive hash join and a combinatorial denominator, or charge
        the N^(2/3) work.
    - id: F2-success-bridge-not-operational
      severity: critical
      category: success_probability
      finding: >-
        The Paley-Zygmund theorem statement is correct, but H3/H4 survival and
        duplicate/multiplicity invalidation have no predeclared finite-sample
        decision rule.
    - id: F3-cluster-power-mismatch
      severity: critical
      category: statistical_power
      finding: >-
        Event-level information with an assumed design effect does not establish
        power for the declared curve-clustered gamma_B lower bound.
    - id: F4-concrete-cost-constants-mismatched
      severity: major
      category: concrete_cost
      finding: >-
        Known candidate factor-24 work is omitted while baseline and storage
        constants are retained, so the concrete rows are not matched.
    - id: F5-controls-model-selection-and-budget-incomplete
      severity: major
      category: controls_and_resources
      finding: >-
        Global permutation construction, finite control tolerances, model
        heterogeneity/selection, and their operation/storage costs are not frozen.
    - id: F6-authoring-base-mislabeled-as-snapshot
      severity: moderate
      category: provenance
      finding: >-
        The proposal labels its input-base ancestor as its snapshot commit even
        though the durable output snapshot is separately and correctly bound.

  cheapest_falsification_control:
    name: frozen-tuple balanced antisymmetric-label null in Z/NZ
    priority: first_after_a_future_coordinator_approved_protocol
    construction: >-
      Freeze the scalar tuples, target scalar, root seeds, D/Y/X/I definitions,
      estimators, and cost counters. Work entirely in Z/NZ and use one globally
      seeded balanced antisymmetric label map h with h(-r)=-h(r), applied to
      every occurrence. Use integer addition for exact equality and run the same
      deduplication, factorial-moment, Boolean-success, clustered inference, and
      zero handling as treatment. No elliptic-curve ladder is needed.
    expected_result: >-
      The control must recover gamma_B=gamma_X=0 within the preregistered
      curve/root-level procedure, show no multiplicity-only pseudo-signal, and
      reproduce the declared denominator and cost accounting. A nonzero slope,
      anti-conservative interval, D/Y/X/I inconsistency, or unexplained tail
      invalidates the apparatus before any signed-y interpretation.
    why_cheapest: >-
      It exercises the entire selector, root, denominator, distinctness,
      success, inference, and accounting pipeline with integer/hash operations
      only and directly attacks the two most dangerous false-positive routes.
    authorization_note: >-
      This is a recommended future control, not an authorization and not an
      executed experiment.

  required_revision_gate:
    - >-
      Resolve the D_r enumeration contradiction with a frozen output-sensitive
      algorithm and carry its worst-case/output work into H1 and the budget.
    - >-
      Freeze finite-sample confidence bounds and pass/invalidation thresholds
      for H3, H4, duplicate scalars, duplicate point sums, and mmax.
    - >-
      Replace the design-effect power approximation with clustered power for
      the full Boolean model, exact size/curve/model layout, nuisance terms,
      zeros, and gamma=5/18 boundary.
    - >-
      Freeze exact global permutation algorithms, seeds, acceptance tolerances,
      model heterogeneity outputs, and any optional selection rule.
    - >-
      Regenerate the concrete table with matched known constants and fully
      charge permutation construction, model construction, peak memory, and
      throughput scope in the staged feasibility model.
    - >-
      Distinguish the 6a338238... authoring-base/corpus commit from the verified
      339bfb2c... output snapshot in all future provenance bindings.
    - Obtain another independent review before any experiment-design approval.

  limitations:
    - >-
      This is a proposal-snapshot review, not validation of a completed run.
      There are no run IDs, raw measurements, fitted gamma values, recovered
      scalars, measured resource costs, or crypto-scale results.
    - >-
      The local 72-entry audit does not establish external novelty or exclude
      every differently tagged near neighbour.
    - >-
      The KN-TECH-035 calculation validates the repository's declared asymptotic
      convention; a later implementation still needs technology, communication,
      entry-width, and constant-factor assumptions.
    - >-
      Pre-existing ledger baseline debt is reported separately and was not used
      to excuse any new semantic defect.

