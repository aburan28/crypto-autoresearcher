predecessor_finding_closure:
  - id: REV-f6873c-01
    result: PARTIAL_WITH_NEW_BLOCKER
    algorithm_definition: PASS
    detail: >-
      v5 defines reduced positive rational ratios, all 36 i<=j Walsh geometric
      means ordered by their exact squared rationals, the one-indexed lower
      median g_18, exact 0.90 squared threshold, retained zeros, exact
      reciprocal magnitude ties, doubled midranks S_i, T2, bit order for
      k=0..255, inclusive two-sided tails, and p_numerator<=6. The full
      decision algorithm is therefore no longer implementation-selected.
      However, the stated comparison artifact schema requires walsh_pairs_36
      but does not require the separately named walsh_pair_indices or
      walsh_squared_values, their exact numerator/denominator form, their
      one-indexed pair mapping, or an exact cardinality constraint on that
      field. It consequently cannot itself reject a comparison artifact that
      omits or alters one of the 36 values while retaining the required field
      name. This leaves the lower-Walsh decision non-auditable at the required
      output-schema boundary.
  - id: REV-f6873c-02
    result: PASS
    detail: >-
      The baseline fixture now fixes the coefficient-group acceptance model,
      R(a,b)=(a+37b) mod 101, initial residue 0, all three after-step residues
      75, 11, and 14, and all four negation outputs/residues. Independent exact
      arithmetic recomputation agrees with every frozen value. It expressly
      rejects curve-point inference for this audit, so the requested output
      boundary is deterministic.
  - id: REV-f6873c-NB-01
    result: PASS
    detail: >-
      seed_register.yaml fixes the inclusive calibration attempt interval
      [0,255], its 256-attempt count, and terminal unavailable disposition
      after attempt index 255. This removes the predecessor off-by-one prose
      ambiguity.
blocking_findings:
  - id: REV-7761cf-01
    severity: critical
    title: Frozen target derivation is inconsistent across the three paired-contract artifacts.
    evidence_paths:
      - experiments/EXP-ECDLP-e8ef62/specification.yaml
      - experiments/EXP-ECDLP-e8ef62/protocol/seed_register.yaml
      - experiments/EXP-ECDLP-e8ef62/protocol/instance_manifest.schema.yaml
    rationale: >-
      specification.yaml derives target_x by reducing the already-defined
      pair_token: 1 + int(pair_token[0:32], big-endian) mod (n-1).
      seed_register.yaml instead declares target_derivation as a fresh
      SHA256(tag_pair_target || seed || group_id || field_bits ||
      subgroup_order). The instance-manifest schema requires target
      recomputation from pair_token and subgroup_order only. These are three
      different input functions: the first does not hash a target preimage or
      include subgroup_order before reduction, the second does both, and the
      third has only pair_token plus subgroup_order. No one of them is a
      deterministic expansion of the other from the frozen bytes. Source and
      control implementations can therefore generate different targets while
      each follows a named contract, defeating the fail-closed paired target
      invariant before the statistics are reached.
    minimal_repair: >-
      Make one new immutable successor select exactly one canonical target
      derivation, state its tag and exact length-prefixed byte preimage, and
      repeat the identical formula in specification, seed register, and
      manifest schema. Require the manifest to retain pair_token, subgroup
      order, target_x, and the exact derivation preimage; add at least one
      frozen seed/group/order -> pair_token -> target_x vector and require the
      validator to recompute it. Snapshot and independently review that
      successor before approval.
  - id: REV-7761cf-02
    severity: high
    title: comparison.json schema does not bind all 36 exact Walsh outputs required by the decision rule.
    evidence_paths:
      - experiments/EXP-ECDLP-e8ef62/specification.yaml
      - ledger/hypotheses/H-ECDLP-63d136.yaml
    rationale: >-
      The effect-estimator prose correctly requires walsh_pair_indices and
      walsh_squared_values, but comparison_artifact_schema lists only the
      undefined field walsh_pairs_36. Unlike sign_vector_table_256, it sets no
      exact length, row schema, pair ordering, rational representation, or
      validator recheck rule for the Walsh values. A required field name alone
      cannot bind the 36 exact values or show that the reported g_18 came from
      the declared sorted multiset. This is an auditable-output defect in the
      repair of REV-f6873c-01, not evidence against the mathematical
      hypothesis.
    minimal_repair: >-
      In a new immutable successor, define one required walsh_table_36 with
      exactly the lexicographically enumerated pairs (i,j), 1<=i<=j<=8,
      each product r_i*r_j as reduced exact numerator/denominator, its sorting
      position, and a validator recomputation rule. Require lower_median_index
      18 to reference that table entry and retain the exact squared threshold
      comparison. Either remove the conflicting older output names or require
      them as aliases with equality checks. Snapshot and independently review
      the successor before approval.
nonblocking_findings: []
checks_passed:
  - item: immutable_snapshot_and_provenance
    detail: >-
      The producer snapshot is reachable from reviewed HEAD, has the receipt's
      declared parent, changes exactly the twelve declared paths, and all eleven
      non-self producer SHA-256 values recompute exactly. The post-snapshot
      queue binds the snapshot commit and the receipt self-hash.
  - item: syntax_and_cross_reference_parse
    detail: >-
      H-ECDLP-63d136, EXP-ECDLP-e8ef62, all four protocol YAML artifacts, the
      successor decision and handoff, batch record, repair report, and
      predecessor review parse as YAML; the queue and receipt parse as JSON.
      The goal, batch, hypothesis, experiment, predecessor, and successor
      references agree.
  - item: exact_statistics_algorithm
    detail: >-
      The contract enumerates exactly 36 i<=j Walsh pairs, requires the lower
      one-indexed g_18 rather than interpolation, and uses exact squared
      rational comparison. It retains zero rows with S_i=0; its tie rule
      correctly identifies same-ratio and reciprocal-ratio magnitudes. The
      256 bit vectors are unique with k=0 all-minus and k=255 all-plus in the
      declared [G09..G16] bit order. The inclusive tail includes the observed
      vector and ties, and 6/256 <= 0.025 < 7/256 verifies the integer p gate.
  - item: baseline_fixture_arithmetic
    detail: >-
      Exact modular recomputation verifies all frozen transition and negation
      residues for R(a,b)=(a+37b) mod 101. The fixture distinguishes its
      coefficient-group scope from a curve-point assertion.
  - item: typed_map_and_stabilizer_closure_contract
    detail: >-
      The manifest and specification require a duplicate-free typed generated
      map closure, per-map field/formula/P-action/scalar/replay witnesses, a
      total replayed composition table, recomputed group order, and fail-closed
      orbit/stabilizer witnesses. A selected canonicalization map is bound to
      its indexed map entry and own certified scalar.
  - item: calibration_contract
    detail: >-
      Eight registered calibration rows are bounded to attempts [0,255], carry
      terminal unavailable and detector-mismatch dispositions, retain required
      receipts, permit no replacement, and are excluded from primary
      aggregation. The fixed 96 primary plus 8 calibration slots reconcile to
      104 maximum runs.
  - item: cost_and_control_contract
    detail: >-
      The exclusive cost vector charges all declared arithmetic, map,
      canonicalization, recovery, retry, setup, hash, serialization, and memory
      work once; the validator must recompute W and reject overlap or mismatch.
      Source/random controls fix same p, subgroup order, pair id/token,
      partition seed, stopping rule, and cost-model identity, subject to the
      blocking target-derivation inconsistency above.
  - item: proof_search_map_and_toy_ceiling
    detail: >-
      The hypothesis supplies baseline reproduction, observation-collision,
      quantifier-order, method-ceiling/nearby-object-control, and named proof
      obligations. It is explicitly finite constant-factor only, retains time
      exponent 1/2 and memory exponent 0, and limits any future measurement to
      p<2^18 toy curves. The target-result profile therefore licenses no
      target-class, exponent, security, or cryptographic-scale claim.
