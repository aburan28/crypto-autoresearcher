toy_claim_boundaries:
  - This report is a design-admissibility review, not an ECDLP experiment or result.
  - No conclusion about a full-scale ECDLP attack, generic-exponent improvement, or cryptographic security follows.
  - No future run of this package could support more than the declared p<2^18 toy finite-family charged-work comparison, and only after separate repair, approval, freeze, implementation, execution, validation, and Coordinator disposition.
  - The NO-GO identifies repairable specification/provenance defects only; it is not negative mathematical evidence against H-ECDLP-63d136.
recommendation: >-
