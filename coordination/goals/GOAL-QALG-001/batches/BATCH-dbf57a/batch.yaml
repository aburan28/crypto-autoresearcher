constraints:
  - >-
    Each experiment contract's primary deliverable is the proof_search_map's
    own baseline-reproduction check, already identified as the recommended
    first test in the source IDEA record. No larger statistical campaign,
    toy-scale simulation, or implementation work is authorized by this batch
    beyond that single deterministic check per candidate.
  - Every field docs/task-lifecycle.md step 4 requires (inputs, controls,
    independent variables, primary/secondary metrics, seed and replication
    strategy or an explicit not-applicable rationale for a deterministic
    check, resource budget, stopping/invalidation rules, success and
    falsification criteria, required artifacts) must be filled; a null field
    keeps the experiment at review_required, never approved.
  - A red-team pass on cost-model and scope honesty is required before
    Coordinator approval, per docs/dynamic-subagent-dispatch.md's guidance
    to reserve independent challenge whenever a result could change a claim
    -- approving a compute-spending experiment is exactly that kind of
    consequential step.
  - Archive tasks never bind dispatch_queue.json or ledger/goals/GOAL-QALG-001.yaml
    in their path_sha256: both are live coordination records mutated later
    in this same batch (the lesson from BATCH-d4b33f's two structural
    repairs, TASK-20260813-3a86a8 note and dispatch_queue.json
    artifact_paths_note_20260814).
