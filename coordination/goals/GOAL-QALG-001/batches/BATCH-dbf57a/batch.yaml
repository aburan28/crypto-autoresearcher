  artifact-path double-ownership conflict (research_dispatch.py rejects any
  path declared in two tasks' artifact_paths) ruled out a separate
  "disposition" task re-touching the same H-*/EXP-* files the design tasks
  already own. Each design task now drafts AND approves its own contract
