# BATCH-dbf57a). Fresh session, no memory of the design sessions that
# produced H-MLKEM-36f511/EXP-MLKEM-12d9b8 and H-CSIDH-3eaede/EXP-CSIDH-c65945.
# Reviewed the Coordinator-committed snapshot at commit
# 531fd399823d1375ca06873fb0089df806b4a394 (content_first-verified against
# HEAD f4bb6d6e356269ff8b403ac91018073b700a8248, which post-dates the snapshot
# with two further verification-marker commits only; no source artifact
# content changed). Findings below are this reviewer's own, independently
