design_report:
  task_id: TASK-20260814-1b47ba
  batch_id: BATCH-dbf57a
  goal_id: GOAL-QALG-001
  kind: design_experiment
  performed_by: coordinator
  objective: >-
    Convert IDEA-20260813-02479f into a specified hypothesis
    (H-MLKEM-36f511) with an explicit test boundary and distinguishable
    outcomes, and a frozen experiment contract (EXP-MLKEM-12d9b8) whose
    primary deliverable is the idea's own recommended first test: a closed-
    form arithmetic determination of whether real ML-KEM's k in {2,3,4}
    module rank can ever supply Simon 2026's Lemma-required sample count for
    the Dihedral Coset Problem specialization the proposal targets. Design
    and administrative approval only -- no execution, no run, no result.

  inputs_read:
    - coordination/goals/GOAL-QALG-001/batches/BATCH-dbf57a/dispatch_queue.json
    - AGENTS.md
    - agents/coordinator.md
    - docs/task-lifecycle.md
    - .claude/skills/design-experiment/SKILL.md
    - templates/research-records.md
    - ledger/proposals/IDEA-20260813-02479f.yaml (in full, including proof_search_map)
    - ledger/goals/GOAL-QALG-001.yaml
    - ledger/goals/GOAL-QALG-001/checkpoints/BATCH-d4b33f.yaml
    - ledger/questions/RQ-QALG-457b41.yaml (existence check)
    - knowledge/literature/KN-LIT-e204ab.md
    - knowledge/literature/KN-LIT-21383c.md
    - knowledge/open-problems/KN-OPEN-8a5965.md
    - knowledge/techniques/KN-TECH-d1bc4f.md
    - inputs/DCP-SIMON-2026/paper_extracted_text.txt (pages 1-3, for the n-definition pin)
    - ledger/hypotheses/H-MLKEM-7d9bcc.yaml, ledger/hypotheses/H-MLKEM-11aabf.yaml (status/field-shape precedent)
    - experiments/EXP-MLKEM-18c6e9/specification.yaml, experiments/EXP-MLKEM-42ea04/specification.yaml (contract-shape precedent)
    - coordination/goals/GOAL-QALG-001/batches/BATCH-dbf57a/tasks/TASK-20260814-bdf473/design-report.yaml (sibling task in this same batch, read after drafting to check for a status-convention conflict -- see status_alignment_note below)

  design_time_findings:
    - >-
      n-DEFINITION PIN (completed now, not deferred to the Executor):
      inputs/DCP-SIMON-2026/paper_extracted_text.txt pages 1-3 state directly
      that Simon's "n" is literally the dimension of the SVP/LWE lattice the
      reduction operates over ("p(n)-SVP is the problem of finding a
      non-zero vector in an n-dimensional lattice"), with the DCP group
      order 2N ~ 2^(n+1) directly (post-BKSW; Regev's original reduction had
      a quadratic blow-up N ~ 2^(n^2), which BKSW removed). This is a
      literal, source-cited definition, superseding KN-LIT-21383c's own
      "should be checked against the original before use" flag for this
      specific sub-question. NOT resolved by this finding, and left as an
      explicitly disclosed working assumption rather than fact: whether
      n := k*256 legitimately instantiates "the lattice dimension" for
      ML-KEM's actual Module-LWE structure under BKSW's reduction, which is
      stated for unstructured LWE -- KN-OPEN-8a5965's own Q2 names this
      bridge as fully open, and IDEA-20260813-02479f's own second assumption
      already treats it as unverified; this design task does not resolve it
      further, only carries the disclosure forward precisely.
    - >-
      CONVERSION-CHAIN GAP (identified now, not previously named this
      precisely in IDEA-20260813-02479f's own text): the idea's own
      mechanism compares a self-reduction-induced NOISE VARIANCE (a
      continuous LWE parameter) against Simon's stated 1/O(log n) FAULTY-
      SAMPLE RATE (a discrete, all-or-nothing corruption probability in his
      own DCP formalization). KN-TECH-d1bc4f states the relationship only
      for Regev's OWN reduction construction at a fixed target a(n)
      ("Regev's reduction converts a(n)-approximate lattice problems into
      DCP instances with faulty-sample rate 1/a(n)"), not as a general
      formula converting an arbitrary self-reduction noise-variance
      inflation into an effective a(n) or faulty rate. Regev 2004's and
      BKSW's full derivations, which would presumably supply that formula,
      are NOT staged in this repository's inputs/ as of this filing (only
      the DCP-SIMON-2026 extracted text and the KN-LIT summaries are
      available; a direct check confirmed no REGEV or BKSW full-text file
      exists under inputs/). This design task cannot discharge this gap
      itself (no compute tool, and it is a load-bearing derivation, not an
      administrative check); it is named explicitly as EXP-MLKEM-12d9b8's
      gating stage 0, with a decidable three-way (not binary) outcome so the
      contract is never forced to guess in either direction if the chain
      cannot be sourced within budget.
    - >-
      SYMBOL COLLISION: Simon's own paper uses "k" for its internal
      group/repetition parameter (k_simon > c) while ML-KEM's module rank is
      conventionally ALSO "k" (k in {2,3,4}). Both records and the contract
      keep these visibly distinct (k_simon vs k_mlkem) throughout, and a
      symbol-collision control/audit is a required artifact of
      EXP-MLKEM-12d9b8, since the idea's own text does not flag this risk
      explicitly.

  status_alignment_note: >-
    This task's own instructions say nothing about hypothesis-status
    convention beyond "specified hypothesis" in the objective prose. Reading
    the sibling design task in this same batch (TASK-20260814-bdf473,
    completed before this report was finalized) after drafting revealed it
    kept H-CSIDH-3eaede.status at `proposed`, citing the same established
    program precedent this task independently found in H-MLKEM-7d9bcc
    (status moves past `proposed` only after independent review and a
    ledger archive, not at specification-filing time). H-MLKEM-36f511 was
    revised to match: status stays `proposed`, with a status_note explaining
    that this task's "specified hypothesis" objective language is satisfied
    by the RECORD'S CONTENT (an explicit test boundary and distinguishable,
    never-defaulted outcomes, per docs/task-lifecycle.md step 3), not by
    advancing the `status` field. This keeps both design tasks in this batch
    internally consistent rather than one diverging from established
    precedent.

  field_completeness_check:
    hypothesis_H-MLKEM-36f511:
      test_boundary_explicit: 'yes -- ML-KEM-512/768/1024 real standardized parameters, disclosed n := k*256 working definition, Simon''s own stated Q/c/tolerance constants'
      distinguishable_outcomes: 'yes -- three-way, mutually exclusive, individually complete: realizable / unrealizable / not-computable-from-available-sources (F2/F3/F4), never defaulted'
      proof_search_map: 'filled -- not_applicable_reason: null; bottleneck, baseline_embedding (partially discharged design-time), observation_collision, constructive_transforms, quantifier_order, method_ceiling, and 5 proof_obligations, two explicitly marked NOT YET PERFORMED / PARTIALLY DISCHARGED rather than silently treated as done, per this task''s own constraint'
      asymptotic_claim: 'null, with an explicit disclosure of why (access-model realizability audit, not a complexity claim) -- not silently omitted'
      heuristic_assumptions: 'HEUR-MLKEM-36f511-1 (variance additivity), with a stated falsification_condition tied to EXP-MLKEM-12d9b8 stage 1 and an explicit note that its own random_model_justification is a proven identity, distinct from the still-open conversion-chain question'
      unverified_preprint_disclosure: 'stated in statement, mechanism, assumptions, and interpretation_limits -- KN-LIT-e204ab is never characterized as established anywhere in the record'
    experiment_EXP-MLKEM-12d9b8:
      input_instances: 'filled -- exact ML-KEM-512/768/1024 k/q/eta1/eta2 values (FIPS 203), Simon''s own Q/c/k_simon/tolerance constants, the pinned n-definition plus disclosed working substitution, and the self-reduction construction'
      controls_and_baselines: 'filled -- baseline-embedding control (m=1/m=2 checks), trivial-floor control, the falsifying formula-comparison control (combinatorial ceiling vs Q, no simulation needed, per this task''s own instruction), sensitivity control over c, and a symbol-collision control'
      independent_variables: 'filled -- ML-KEM level, c, m, B'
      primary_and_secondary_metrics: 'filled -- n_pinned, Q_table, variance_formula, combinatorial_ceiling, realizability_verdict; stage_0_disposition, trivial_floor_check, symbol_collision_audit'
      seed_and_replication: >-
        filled -- explicitly "NOT APPLICABLE: DETERMINISTIC, INDEPENDENTLY
        RE-DERIVABLE BY ANY REVIEWER", per this task's own required phrasing
      resource_budget: 'filled -- small (1800s wall-clock, 0.25 CPU-hours, 2GB memory, 1 run, 1 worker), explicitly justified as symbolic/exact-integer arithmetic plus at most bounded literature reading, not a compute campaign'
      stopping_and_invalidation_rules: filled
      success_and_falsification_criteria: >-
        filled and DECIDABLE -- success_criterion names three mutually
        exclusive, individually complete dispositions (including the
        stage-0 "not computed" outcome as a genuinely non-negative,
        non-defaulted disposition per AGENTS.md rule 5) and states that
        reporting neither a verdict nor an explicit not-computed disposition
        is INCOMPLETE, not successful; falsification_criterion names F1/F2
        as genuine possible negative outcomes and states F3 (the
        hypothesis's own predicted outcome) and F4 (infrastructure/
        derivation-availability) are explicitly not falsifications -- this
        contract was checked against, and does not fail, "reject your own
        contract if no possible outcome would count as negative"
      required_artifacts: >-
        filled -- source-pin citation, stage-0 derivation-note-or-not-
        computed disposition, exact Q table, variance-formula derivation
        with baseline checks shown, combinatorial-ceiling derivation,
        realizability verdict table, symbol-collision audit statement,
        manifest/environment/resource measurements, snapshot then
        independent review before any evidence record
    all_fields_status: >-
      Every field required by docs/task-lifecycle.md step 4 is filled or
      explicitly marked not-applicable with a stated reason. No field was
      left null without justification.

  decision: approved
  status_set:
    hypothesis: >-
      H-MLKEM-36f511.status = proposed (unchanged; matches H-MLKEM-7d9bcc
      and this batch's own sibling TASK-20260814-bdf473 precedent -- the
      hypothesis moves past proposed only after independent review and a
      ledger archive, not at specification time; see status_alignment_note)
    experiment: 'EXP-MLKEM-12d9b8.status = approved, approved_by: coordinator, frozen: true, execution_authorized: false (dispatch held -- see below)'

  rationale:
    - >-
      Every docs/task-lifecycle.md step-4 field is honestly fillable for
      this contract without fabricating any data, and every field above was
      in fact filled or explicitly marked not-applicable with a stated
      reason -- the approval gate in .claude/skills/design-experiment/
      SKILL.md and this task's own constraints is satisfied.
    - >-
      The success/falsification criteria are decidable and admit two
      genuine negative outcomes (F1, a formula defect, and F2, "realizable")
      distinct from the honest infrastructure outcome F4 ("not computed") --
      this contract does not fail the "reject your own contract if no
      possible outcome would count as negative" rule, and F4 is never
      allowed to silently stand in for either F2 or F3.
    - >-
      Two of IDEA-20260813-02479f's own proof_search_map audits were
      explicitly not-yet-performed in the source record (the n-to-dimension
      correspondence, and the combinatorial ceiling computation). This
      design task partially discharged the first (the literal n-definition,
      pinned to primary source text) and identified a THIRD, previously
      unnamed gap (the noise-variance-to-faulty-rate conversion chain),
      naming exactly what remains for the Executor rather than silently
      treating any of them as resolved -- per this task's own constraint.
    - >-
      The budget is small and explicitly justified as such (closed-form
      symbolic/exact-integer arithmetic plus, at most, bounded literature
      reading for stage 0; no lattice software, no ML-KEM implementation, no
      quantum simulation).
    - >-
      The dependency on Simon 2026 (KN-LIT-e204ab, UNVERIFIED, every
      substantive lemma self-labelled a sketch) is disclosed explicitly and
      repeatedly in both records; neither record implies the preprint is
      established, and every numeric output is scoped to "taking the paper's
      own stated constants at face value for the arithmetic" rather than
      asserting the algorithm works.
    - >-
      No result is claimed by this design task itself: no numeric Q, no
      variance figure, and no realizability verdict is asserted anywhere in
      H-MLKEM-36f511 or EXP-MLKEM-12d9b8 -- only the n-definition literal pin
      (a citation-level fact, not a computed result) and the identification
      of the conversion-chain gap (a scoping finding, not a numeric claim)
      are recorded as design-time work product, per this task's own
      instruction to distinguish reasoning recorded here from an executed
      run.

  handoff_written: true
  handoff_id: TASK-20260814-807901
  handoff_dispatch_hold: >-
    The handoff record explicitly states it MUST NOT be dispatched until
    TASK-20260814-11516e's red-team report is read and any objection
    resolved. Writing this handoff record is administrative filing only, not
    authorization to execute; execution_authorized in the frozen
    specification is separately false.

  disclosures:
    - >-
      This design task performed NO execution, NO computation, and asserted
      NO numeric Q, variance, or realizability value anywhere in
      H-MLKEM-36f511 or EXP-MLKEM-12d9b8 -- the coordinator subagent has no
      compute/Bash tool in this harness and, independent of that, this
      task's own scope is design and approval only. The n-definition pin
      recorded above is a citation of Simon's own stated text
      (inputs/DCP-SIMON-2026/paper_extracted_text.txt), not a derived
      numeric result. The actual arithmetic evaluation is entirely deferred
      to the Executor under TASK-20260814-807901, once unblocked.
    - >-
      EXP-MLKEM-12d9b8's stage 0 (the noise-variance-to-faulty-rate
      conversion chain) may resolve to "NOT COMPUTED" if the Executor cannot
      derive or source it within the stage-0 budget share; this is disclosed
      as a real, live possibility, not papered over, and the contract's own
      success_criterion treats that outcome as complete and honest rather
      than as a defect requiring a larger budget.
    - >-
      This experiment's scope is narrower than IDEA-20260813-02479f's own
      full minimal_test in one respect: the idea's step 1 asks to read
      Simon's own derivation "if accessible" to pin the correspondence; this
      design task went further at zero marginal cost (the primary source
      text was already staged in this repository and readable without
      network access) and pinned the LITERAL n-definition now, but the
      MODULE-LWE bridging question (n := k*256) remains exactly as
      unresolved as the idea itself left it, carried forward as a disclosed
      working assumption rather than resolved.

  next_actions:
    - >-
      TASK-20260814-8a0fea (snapshot archive, run_alone) may proceed once
      the sibling CSIDH design task (TASK-20260814-bdf473, already complete)
      and this task are both done; it stages H-MLKEM-36f511,
      EXP-MLKEM-12d9b8/specification.yaml, TASK-20260814-807901, and this
      design-report.yaml by exact declared path.
    - >-
      TASK-20260814-11516e (independent red-team review, independent
      session required) must clear before TASK-20260814-807901 may be
      dispatched to the executor. Its report should specifically weigh
      stage 0's conversion-chain gap and the n := k*256 working definition
      as candidate hidden-cost / scope-honesty concerns, since both are
      novel findings of this design task rather than carried unchanged from
      IDEA-20260813-02479f's own text.
    - >-
      No coordinator_decision (DEC-*) ledger record is written by this task
      -- that record (DEC-20260814-1445a1) is TASK-20260814-5870c1's own
      deliverable, after the red-team report is available, per this batch's
      own dispatch_queue.json structure.
