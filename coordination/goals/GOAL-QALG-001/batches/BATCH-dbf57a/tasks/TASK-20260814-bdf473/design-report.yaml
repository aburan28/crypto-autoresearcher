design_report:
  task_id: TASK-20260814-bdf473
  batch_id: BATCH-dbf57a
  goal_id: GOAL-QALG-001
  kind: design_experiment
  performed_by: coordinator
  objective: >-
    Convert IDEA-20260813-e6d55d into a specified hypothesis
    (H-CSIDH-3eaede) with an explicit test boundary and distinguishable
    outcomes, and a frozen experiment contract (EXP-CSIDH-c65945) whose
    primary deliverable is the idea's own recommended first test:
    independently re-obtain CSIDH-512's exact class-group order
    factorization from CSI-FiSh, and audit whether Simon 2026's zero-noise
    DCP specialization is a legitimate instance of its own source theorem
    at that scale. Design and administrative approval only -- no execution,
    no run, no result.

  inputs_read:
    - coordination/goals/GOAL-QALG-001/batches/BATCH-dbf57a/dispatch_queue.json
    - AGENTS.md
    - agents/coordinator.md
    - docs/task-lifecycle.md
    - .claude/skills/design-experiment/SKILL.md
    - templates/research-records.md
    - ledger/proposals/IDEA-20260813-e6d55d.yaml (in full, including proof_search_map)
    - ledger/goals/GOAL-QALG-001.yaml
    - ledger/goals/GOAL-QALG-001/checkpoints/BATCH-d4b33f.yaml
    - ledger/questions/RQ-QALG-74bf20.yaml
    - knowledge/literature/KN-LIT-e204ab.md
    - knowledge/techniques/KN-TECH-d1bc4f.md
    - knowledge/literature/KN-LIT-129.md
    - knowledge/techniques/KN-TECH-051.md
    - ledger/hypotheses/H-MLKEM-7d9bcc.yaml (status/field-shape precedent)

  scoping_decision: >-
    IDEA-20260813-e6d55d's own claim is a two-premise conditional: (i) the
    zero-noise specialization is a legitimate instance of Simon 2026's own
    theorem, AND (ii) the resulting O(n^13) cost beats Kuperberg's sieve at
    CSIDH-standardized class-group orders. The idea's own minimal_test
    bundles a symbolic Stage-1 audit and a toy-scale (log2 N <= 24) Stage-2
    simulation computing a crossover order N*. This task's own instructions
    narrow the FIRST test further than the idea's own minimal_test: rather
    than a toy or symbolic N, the deliverable is the applicability audit
    (premise (i) only) instantiated at CSIDH-512's ACTUAL, independently
    re-derived class-group order N from CSI-FiSh -- because Simon's
    construction's own text presents an explicit N = 2^n bit-recursion
    structure, and CSIDH-512's real class number is (generically, though
    this must be verified, not assumed) not of that form, making "does N's
    actual structure admit the paper's stated hypothesis, or a citable
    reduction to it" a decisive, cheap, literature-plus-arithmetic
    falsifier distinct from and prior to both the idea's own toy-simulation
    Stage 2 and any crossover-cost computation (premise (ii)). This
    experiment therefore tests ONLY premise (i) plus establishes N itself;
    it explicitly does not perform the idea's own toy-scale simulation,
    does not verify Lemma 3, and does not compute a crossover order. This
    scoping is stated explicitly in both H-CSIDH-3eaede and
    EXP-CSIDH-c65945 so no reviewer mistakes this run for the idea's full
    minimal_test.

  field_completeness_check:
    hypothesis_H-CSIDH-3eaede:
      test_boundary_explicit: 'yes -- CSIDH-512 only, real CSI-FiSh N, premise (i) only'
      distinguishable_outcomes: 'yes -- outcome A (APPLICABLE-AS-STATED) vs B (NOT-APPLICABLE-AS-STATED), plus an explicit invalidation path for source disagreement'
      proof_search_map: 'filled, scoped to the concrete-N instantiation of the idea''s own bottleneck/quantifier_order/method_ceiling; several sub-audits (Kuperberg baseline reproduction_check, observation_collision distinct_preimage_search, nearby_object_control) are explicitly recorded as NOT performed by this experiment rather than silently marked done'
      asymptotic_claim: 'filled, explicitly conditional on BOTH premises, with premise (ii) marked not tested here'
      heuristic_assumptions: 'H1 carried from the idea, explicitly marked NOT VALIDATED by this experiment (concerns premise (ii))'
      unverified_preprint_disclosure: 'stated in statement, mechanism, assumptions, structural_ingredients, and interpretation_limits -- KN-LIT-e204ab is never characterized as established anywhere in the record'
      conditional_scoping_per_constraint: >-
        satisfied -- statement is written as "IF (i) [tested here] AND (ii)
        [not tested here] THEN [conditional claim]", matching this task's
        own constraint against inflating the method_ceiling claim
    experiment_EXP-CSIDH-c65945:
      input_instances: filled (CSIDH-512 exact parameters; CSI-FiSh source citation, no fabricated numeric value)
      controls_and_baselines: filled (cross-source agreement, factorization-integrity, known-answer harness-sanity control, citation-completeness control)
      independent_variables: 'filled -- explicitly "None" with reasoning, a deterministic verification task'
      primary_and_secondary_metrics: filled (class_group_order_match, applicability_outcome; discrepancy_log, citation_completeness)
      seed_and_replication: 'filled -- explicitly "not applicable: deterministic, independently re-derivable by any reviewer" per this task''s own instruction wording'
      resource_budget: 'filled -- small (1800s wall-clock, 0.5 CPU-hours, 2GB memory, 1 run), explicitly stated as small and why it is below the templates'' memory floor'
      stopping_and_invalidation_rules: filled
      success_and_falsification_criteria: >-
        filled and DECIDABLE -- success_criterion is satisfied by reaching
        EITHER outcome A or B (or a documented NOT-COMPUTED/invalid state);
        falsification_criterion is outcome B specifically, a genuine
        possible negative outcome, so this contract is not rejected for
        having no possible negative result
      required_artifacts: filled (audit report with citations, N + factorization + primality checks, reconciliation note, CJS-supplied group-order statement, terminal run record)
    all_fields_status: >-
      Every field required by docs/task-lifecycle.md step 4 is filled or
      explicitly marked not-applicable with a stated reason. No field was
      left null without justification.

  decision: approved
  status_set:
    hypothesis: 'H-CSIDH-3eaede.status = proposed (unchanged; matches H-MLKEM-7d9bcc precedent -- the hypothesis moves past proposed only after a run and review, not at specification time)'
    experiment: 'EXP-CSIDH-c65945.status = approved, approved_by: coordinator'
  rationale:
    - >-
      Every docs/task-lifecycle.md step-4 field is honestly fillable for
      this contract without fabricating any data, and every field above was
      in fact filled or explicitly marked not-applicable with a stated
      reason -- the approval gate in .claude/skills/design-experiment/
      SKILL.md and this task's own constraints is satisfied.
    - >-
      The success/falsification criteria are decidable and admit a genuine
      negative outcome (B, NOT-APPLICABLE-AS-STATED) distinct from an
      invalid run (source disagreement) -- this contract was checked
      against, and does not fail, the "reject your own contract if no
      possible outcome would count as negative" rule.
    - >-
      The budget is small and explicitly justified as such (factorization
      lookup/verification and a close literature read, not a compute
      campaign, with a stated reason for going below the templates' 8GB
      memory floor).
    - >-
      The dependency on Simon 2026 (KN-LIT-e204ab, UNVERIFIED) is disclosed
      explicitly and repeatedly in both records; neither record implies the
      preprint is established.
    - >-
      The method_ceiling / target_complexity language is kept explicitly
      conditional on BOTH premises (i) and (ii), per this task's own
      constraint against inflating the claim beyond "IF applies AND beats
      Kuperberg THEN...".

  handoff_written: true
  handoff_id: TASK-20260814-a82a19
  handoff_dispatch_hold: >-
    The handoff record explicitly states it MUST NOT be dispatched until
    TASK-20260814-11516e's red-team report is read and any objection
    resolved. Writing this handoff record is administrative filing only,
    not authorization to execute.

  disclosures:
    - >-
      This design task performed NO execution, NO computation, and asserted
      NO numeric class-group-order value anywhere in H-CSIDH-3eaede or
      EXP-CSIDH-c65945 -- the coordinator subagent has no compute/Bash tool
      in this harness and, independent of that, this task's own scope is
      design and approval only. The actual re-derivation and applicability
      audit are entirely deferred to the executor under TASK-20260814-a82a19,
      once unblocked.
    - >-
      This experiment's scope is deliberately narrower than
      IDEA-20260813-e6d55d's own full minimal_test (see scoping_decision
      above); a future task under RQ-QALG-74bf20 will still need to run the
      idea's own toy-scale Stage 2 (simulation, crossover order N*,
      Lemma-3-adjacent bias measurement) and, per this program's
      conditional-result pairing rule, that or a successor experiment must
      be paired with a heuristic-validation experiment before any
      asymptotic claim under H-CSIDH-3eaede could advance past `analyzed`.

  next_actions:
    - >-
      TASK-20260814-8a0fea (snapshot archive, run_alone) may proceed once
      the sibling ML-KEM design task (TASK-20260814-1b47ba) also completes;
      it stages H-CSIDH-3eaede, EXP-CSIDH-c65945/specification.yaml,
      TASK-20260814-a82a19, and this design-report.yaml by exact declared
      path.
    - >-
      TASK-20260814-11516e (independent red-team review, independent
      session required) must clear before TASK-20260814-a82a19 may be
      dispatched to the executor.
    - >-
      No coordinator_decision (DEC-*) ledger record is written by this task
      -- that record (DEC-20260814-1445a1) is TASK-20260814-5870c1's own
      deliverable, after the red-team report is available, per this batch's
      own dispatch_queue.json structure.
