  proposals:
    - id: IDEA-20260813-4aecda
      title: >-
        Small-n classical audit of Simon 2026's Lemma 3 no-catastrophic-
        cancellation certificate, instrumented with module-structured
        correlated noise
      class: control
      one_line_mechanism: >-
        Classically simulate (no quantum hardware needed) the exact signed
        cancellation sum Simon 2026's unverified DCP-algorithm correctness
        argument depends on, at small dihedral group sizes, against a
        random-sign null-object control, to see whether the argument's
        "no catastrophic cancellation" claim holds or fails at the one scale
        this program can currently check directly.
      discriminates_between: >-
        (a) cancellation ratio concentrates near the null and does not
        worsen as n grows (Lemma 3 survives this audit; DCP route stays
        live) vs. (b) cancellation is systematic and non-shrinking (a named,
        scoped obstruction, closing this specific algorithm's correctness
        argument within the tested regime).
      proof_search_map_audit_result: >-
        PASSED (design-stage). All four KN-TECH-080 audits are addressed:
        bottleneck named (Lemma 3), baseline embedding defined (k=1, Simon's
        own model), observation collision searched (does S(d) even
        distinguish secrets at this scale), method ceiling and nearby-object
        control stated (random-sign null). No audit failure at design stage;
        the proposal's own falsification_conditions define what a failed
        RUN would look like.
      target_complexity_summary: >-
        No complexity claimed by this control itself; if the underlying
        Simon 2026 result survives all open questions it targets a
        polynomial-time quantum MSVP/MLWE algorithm against a
        2^(0.2653d+o(d)) QRAM-model Grover/quantum-walk baseline (KN-LIT-703)
        -- a genuine exponent-class claim, not a cofactor gain -- but this
        proposal itself claims zero speedup (sota_delta: zero).
      recommended_priority: high

    - id: IDEA-20260813-0cf345
      title: >-
        Reduction-side noise-budget audit at ML-KEM's fixed small module
        rank, decoupled from Simon 2026's own correctness
      class: measurement
      one_line_mechanism: >-
        Extract the closed-form (or algorithmic) dependence of the Regev-
        BKSW-IP-M-EDCP reduction's induced faulty-sample rate on module rank
        and ring degree, and evaluate it at ML-KEM's three standardized,
        fixed (non-asymptotic) parameter sets against the 1/O(log n)
        tolerance ANY noise-tolerant DCP algorithm of this shape would need.
      discriminates_between: >-
        (a) reduction-induced noise stays inside budget at ML-KEM's actual
        parameters (bottleneck is purely algorithm-side, i.e. Q1) vs. (b) the
        fixed-rank regime is already the wrong shape for this reduction
        chain, closing the reduction-side branch independent of whether any
        future DCP algorithm is ever verified correct.
      proof_search_map_audit_result: >-
        PASSED (design-stage). Bottleneck, baseline embedding (unstructured
        LWE at ring degree 1), observation collision (does the noise rate
        depend on ring degree independently of total dimension), and method
        ceiling (three fixed standardized parameter triples only) are all
        stated with explicit proof_obligations.
      target_complexity_summary: >-
        No complexity claimed; this is a scope-narrowing precondition
        measurement (sota_delta: zero), independent of whether the algorithm
        side ever succeeds.
      recommended_priority: high

    - id: IDEA-20260813-8aa6ea
      title: >-
        Galois-automorphism sample amplification for ring-structured DCP
        instances: relief mechanism or independence-breaking obstruction
      class: composition
      one_line_mechanism: >-
        ML-KEM's cyclotomic ring's Galois automorphism group (order 128)
        turns every physical MLWE sample into up to 128 "free" algebraically-
        related samples; test whether these can relieve Simon 2026's
        astronomical sample-count requirement or instead violate the
        pairwise-independence assumption Lemma 3's counting argument needs.
      discriminates_between: >-
        (a) Galois-orbit samples behave close enough to independent for
        Lemma 3's counting bound, giving a bounded (at most 128x) sample-
        count relief vs. (b) they are too deterministically correlated,
        breaking the independence precondition and closing this specific
        relief route at exactly the ring-structured parameters that matter.
      proof_search_map_audit_result: >-
        PASSED (design-stage), with an explicit identity-automorphism
        null-object control (must show zero relief) as the primary
        artifact-detection safeguard before any nontrivial-automorphism
        result is trusted.
      target_complexity_summary: >-
        No complexity claimed; the proposal's own analysis shows even a
        full 128x sample-count relief cannot touch Simon's dominant n^13-
        scale cost term, so sota_delta is zero even in the best case,
        disclosed explicitly rather than hidden.
      recommended_priority: medium

    - id: IDEA-20260813-f35692
      title: >-
        Method-ceiling and nearby-object control on lattice sieving's own
        near-neighbor search bottleneck, independent of the DCP ingredient
      class: control
      one_line_mechanism: >-
        Apply a BBBV-style black-box quantum query-lower-bound framing to
        the sieve's own near-neighbor search predicate, with a planted-
        structure positive control, to test whether the established Grover/
        quantum-walk sieve family (2^(0.2653d), KN-LIT-703) already sits at
        its own unstructured-search ceiling, redirecting future search
        effort toward the algebraic route if so.
      discriminates_between: >-
        (a) no exploitable hidden-subgroup structure found in the sieve's
        own search primitive under the standard heuristic (headroom, if any,
        must come through the algebraic/DCP route) vs. (b) exploitable
        structure is found (reopening the sieve-direct route as a live
        target family).
      proof_search_map_audit_result: >-
        PASSED (design-stage). This is the batch's only proposal that is
        entirely independent of the Simon 2026 / DCP ingredient, providing
        a control against single-threading the whole batch on one external
        claim's survival. Explicit nearby-object control names DCP itself
        as the case where black-box observational similarity does NOT imply
        a ceiling, bounding the audit's own strongest certifiable claim.
      target_complexity_summary: >-
        No complexity claimed; a closure-oriented control whose deliverable
        is a scoped, named obstruction (or its absence), not a speedup.
      recommended_priority: high

    - id: IDEA-20260813-02479f
      title: >-
        Sample-access-model realizability audit: can one bounded ML-KEM
        public key ever supply Simon 2026's required sample count
      class: control
      one_line_mechanism: >-
        Compute, via elementary variance-additivity arithmetic (no
        simulation needed), whether standard linear self-reduction from
        ML-KEM's k in {2,3,4} real matrix rows can approach the
        Q = k*n^(c+1), c>=12 independent-sample count Simon's own theorem
        requires without exceeding its own required noise tolerance --
        independent of both Lemma 3's correctness and the base reduction's
        noise-rate quality.
      discriminates_between: >-
        (a) realizable within budget (redirects remaining scrutiny fully to
        Q1 and the reduction-quality question) vs. (b) unrealizable by an
        overwhelming margin (a named, scoped closure of the concrete-attack
        reach question, independent of and prior to resolving Lemma 3).
      proof_search_map_audit_result: >-
        PASSED (design-stage). Likely the cheapest of the five proposals to
        execute (closed-form arithmetic only); explicit baseline (m=1) and
        trivial-floor checks guard against a formula error before the main
        evaluation is trusted.
      target_complexity_summary: >-
        No complexity claimed; sota_delta: zero. If unfavorable, this is the
        cheapest possible route to learning the whole DCP-route family is
        dead-on-arrival against concrete ML-KEM, before spending further
        effort on Lemma 3.
      recommended_priority: high

  proof_search_map_audit_failures: >-
    None of the five proposals failed a proof_search_map audit at the design
    stage (all four KN-TECH-080 mandatory audits -- baseline reproduction,
    observation collision, quantifier order, method ceiling with nearby-
    object control -- are addressed with explicit content, not left null,
    in every proposal). This is an honest design-stage result, not a claim
    that any proposal's underlying hypothesis will survive execution: three
    of the five proposals (IDEA-20260813-4aecda, -8aa6ea, -02479f) are
    explicitly designed so that their MOST LIKELY outcome, per their own
    stated predictions and the program's existing KN-OPEN-8a5965 record, is
    a negative/closing result -- this is disclosed, not hidden, per this
    task's instruction that "a failed proof_search_map audit is itself a
    useful, recordable result."

  ranking_rationale: >-
    All five proposals share the same exponent-first ambition (a
    Grover-only-to-polynomial-time exponent-class jump, not a cofactor gain)
    and the same cost floor (low implementation, low compute -- none
    requires quantum hardware, ML-KEM software, or lattice-reduction
    tooling; four are closed-form arithmetic or small toy-scale classical
    simulation, one is literature extraction plus arithmetic). Expected
    information gain is ranked by how decisively and cheaply each
    proposal's minimal test can move the program's belief about the DCP-
    route family for RQ-QALG-457b41: IDEA-20260813-02479f (sample-access-
    model realizability) is ranked highest for information-gain-per-cost
    because it requires the least compute (pure closed-form arithmetic once
    the n-to-dimension correspondence is pinned down) and, per the rough
    estimate in its own record (Q on the order of n^13 with n in the low
    thousands against only k in 2-4 real public-key rows), is likely to
    produce a swift, high-confidence verdict that could close the entire
    DCP-route family for concrete ML-KEM independent of Lemma 3's fate --
    the cheapest possible way to learn whether the other three DCP-route
    proposals are worth pursuing further. IDEA-20260813-4aecda (Lemma 3
    audit) and IDEA-20260813-0cf345 (reduction-noise-budget) are next,
    tied at high priority: both are cheap, both operationalize a specific
    open sub-question already recorded in KN-OPEN-8a5965, and both are
    needed regardless of IDEA-20260813-02479f's outcome, since a favorable
    access-model verdict would make Lemma 3's and the reduction's own
    correctness the remaining open questions. IDEA-20260813-f35692 (sieve
    ceiling control) is ranked high but on an independent axis: it does not
    gate or get gated by the other four, and its value is in preventing the
    batch from being single-threaded on one external, three-days-old,
    every-lemma-a-sketch preprint. IDEA-20260813-8aa6ea (Galois relief) is
    ranked medium: its own analysis already shows its best-case outcome
    cannot move the dominant cost term Simon's algorithm pays, so its
    information gain is real but strictly smaller in consequence than the
    other four, even though it is a genuinely novel composition worth
    recording.

  test_first_recommendation:
    idea_id: IDEA-20260813-02479f
    reason: >-
      Cheapest valid discriminator in the batch: no toy-scale simulation, no
      literature-reading-dependent formula extraction beyond confirming one
      published dimension correspondence (a citation-level check, not a
      derivation), and no dependence on any of the other four proposals'
      outcomes. Its minimal test is closed-form variance-additivity
      arithmetic applied to numbers ML-KEM's own specification and Simon
      2026's own stated parameters (c>=12, k>c, Q=k*n^(c+1)) already supply.
      Given the stated rough order of magnitude (Q on the order of 10^36 or
      larger against k in {2,3,4} real rows), this proposal has a
      substantial chance of producing a swift, decisive, low-cost closure of
      the entire access-model precondition for the DCP route against
      concrete ML-KEM -- which would make it unnecessary to spend the
      comparatively larger compute budget of IDEA-20260813-4aecda's toy-
      scale simulation or IDEA-20260813-0cf345's two-paper literature
      extraction before knowing whether the whole family is already
      dead-on-arrival at ML-KEM's fixed, non-asymptotic parameters. This
      matches KN-OPEN-8a5965's own methodological stance ("the cheapest next
      step... settles it far more cheaply than a full read") applied one
      layer earlier, to the access-model precondition rather than to Lemma
      3 itself.

  honest_accounting:
    objects_considered:
      - >-
        Object 1 (IDEA-20260813-4aecda): the signed cancellation-certificate
        sum S(d) in Simon 2026's Lemma 3, tracked under both i.i.d. and
        module-correlated noise models.
      - >-
        Object 2 (IDEA-20260813-0cf345): the induced faulty-sample rate
        a(n)^(-1) of the Regev-BKSW-IP-M-EDCP reduction chain, as a function
        of module rank and ring degree, held separate from any specific
        DCP algorithm's correctness.
      - >-
        Object 3 (IDEA-20260813-8aa6ea): the pairwise-correlation structure
        of Galois-orbit-derived DCP samples versus physically independent
        ones.
      - >-
        Object 4 (IDEA-20260813-f35692): the black-box query-complexity
        structure of lattice sieving's own near-neighbor search predicate,
        compared against genuinely hidden-subgroup-structured search
        problems.
      - >-
        Object 5 (IDEA-20260813-02479f): the noise-variance-versus-sample-
        count curve of standard linear self-reduction from a bounded
        ML-KEM public key's real matrix rows.
      - >-
        Per docs/inventor-protocol.md section 1, this program has no written
        object-enumeration for the ECDLP (KN-OPEN-019) and, more pointedly
        for this quantum-lattice lane, no written object-enumeration for
        quantum MLWE/MSVP mechanisms either; the five objects above are a
        sketch built around one freshly identified external ingredient plus
        one independent ceiling audit, not a taxonomy, and are labelled as
        such throughout.
    established_families_declared_off_limits_as_primary_lens: >-
      Grover/amplitude-amplification on classical sieve inner loops, and
      quantum-walk sieve variants (Laarhoven; Kirshanova-Martensson-
      Postlethwaite), per KN-LIT-703 -- these are the RQ's own stated
      baseline and were used only as the comparison target
      (dominated_by / target_complexity.best_known) and as the audited
      OBJECT of IDEA-20260813-f35692, never proposed as a NEW mechanism.
    dominated_by: >-
      For all five proposals: n/a (no attack, algorithm, or speedup result
      is claimed by any of the five records). Checked against every row this
      program's corpus records on the quantum MSVP/MLWE frontier: (i)
      Grover/quantum-walk sieve, 2^(0.2653 d + o(d)) time, QRAM model
      (Laarhoven, reported in KN-LIT-703); (ii) quantum k-Sieve,
      2^(0.2989 d + o(d)) time / 2^(0.1395 d + o(d)) memory, QRAM model
      (Kirshanova-Martensson-Postlethwaite, KN-LIT-703); (iii) the unverified
      Simon-2026-composed-with-BKSW polynomial-time claim (KN-LIT-e204ab,
      confidence unverified). None of the five filed proposals displaces any
      of these three rows; each targets a PRECONDITION, AUDIT, or
      DISCRIMINATOR bearing on whether row (iii) could ever displace rows
      (i)-(ii), not a competing figure of its own. This dominated_by
      statement was set to "n/a" only after this explicit row-by-row check,
      per docs/inventor-protocol.md section 5's requirement that null be set
      only after checking every row on the frontier.
    sota_delta: >-
      Zero across all five proposals, quantitatively and explicitly stated
      in each record's own sota_delta field. No speedup, no exponent
      movement, and no cofactor improvement is claimed by any of the five;
      the batch's entire deliverable is discriminating power over whether an
      already-published, already-flagged-unverified external claim (row
      (iii) above) could ever become one, at a cost this program's current
      budget can actually afford.
    enumerated_closures: >-
      None yet -- all five proposals are `status: proposed`, not yet
      executed, so no mechanism has actually been closed by this batch. Each
      proposal's own falsification_conditions and interpretation_limits
      state, in advance, exactly what a closure would look like and at what
      scope it would apply, satisfying the docs/inventor-protocol.md section
      4 standard (named obstruction, argument, forward guidance) in
      PROSPECT, to be discharged only once an approved Executor run actually
      produces the stated outcome.
    open_directions_for_next_session: >-
      (1) If the Coordinator approves IDEA-20260813-02479f first (per this
      report's test_first_recommendation), its output should gate whether
      the remaining four proposals in this filing are worth executing as
      designed. (2) A full written object-enumeration for quantum MLWE/MSVP
      mechanisms (this lane's own analogue of KN-OPEN-019) does not yet exist
      and would sharpen future batches under this RQ beyond the sketch used
      here. (3) None of the five proposals addresses whether a DIFFERENT
      hidden-subgroup or Fourier-sampling route (unrelated to the specific
      Simon-2026/DCP chain) might exist against MLWE; this remains
      unexplored and is a legitimate direction for a future batch once this
      one's results are in. (4) Per KN-OPEN-8a5965's own cheapest-next-step
      guidance and this report's own ranking, the program should watch the
      ePrint record for KN-LIT-e204ab (eprint 2026/1591) for a revision or
      withdrawal notice before committing further budget to any of the four
      DCP-anchored proposals in this filing, independent of this program's
      own audits.
