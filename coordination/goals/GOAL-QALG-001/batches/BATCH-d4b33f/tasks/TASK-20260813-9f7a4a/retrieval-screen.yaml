  synthesis: >-
    The corpus's quantum-ISD literature cluster (2017-2024) is active but
    exclusively on the RESOURCE axis (qubit count, circuit depth, memory,
    classical-quantum hybrid split), not the ASYMPTOTIC EXPONENT axis. No
    corpus entry claims or references an exponent improvement to Kachigar-
    Tillich's 2017 quantum-walk-on-MMT/BJMM result, and no corpus entry
    addresses HQC's quasi-cyclic ring structure as a quantum-specific lever
    (DOOM-style multi-target folding, CRT/idempotent factorization of
    R = F_2[X]/(X^n-1), automorphism-orbit graph quotienting, or an
    electric-network re-derivation of the walk's hitting time). ABSENCE OF A
    CORPUS HIT IS NOT TREATED AS NOVELTY EVIDENCE (AGENTS.md "Knowledge
    retrieval policy" and agents/idea-generator.md novelty discipline): with
    WebSearch failing outright, primary literature was NOT actually checked
    for any of the five candidate mechanisms filed below, so every
    proposal's novelty_status is unverified.

