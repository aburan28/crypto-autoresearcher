        novelty: "the framework itself is well-known; application to this graph family would be narrow-new"
        testability: "symbolic, though the specific derivation was not completed this session (inconclusive)"
        survival: >-
          capped hard by method_ceiling at a non-exponential gain; better
          classified as algorithm-analysis than a new tracked object, flagged
          as such rather than forced into the framing
      - object: >-
          the ratio of two already-published cost-exponent formulas
          (Grover-Prange vs quantum-walk-BJMM/MMT) at HQC's own sparse
          weight regime (IDEA-20260813-fe3c5e)
        novelty: "not an attack object; a baseline-comparison/control proposal"
        testability: "purely symbolic once the primary source is obtained (blocked this session by WebSearch failure)"
        survival: "open, not resolved -- an infrastructure block, not a negative finding"

  proposals:
    - id: IDEA-20260813-a46301
      title: >-
        Quantum-DOOM: amplitude-amplified cyclic-shift-orbit folding layered
        on quantum-walk ISD for quasi-cyclic syndrome decoding
      class: composition
      one_line_summary: >-
        Tests whether folding HQC's n cyclic-shift targets into the existing
        quantum walk (a quantum analogue of classical DOOM) yields DOOM's
        own sqrt(n) prefactor gain, or whether a naive design silently
        overclaims a further compounded quadratic gain the shift-branches'
        correlation structure does not support.
      proof_search_map_audit_outcome: >-
        Observation-collision audit FOUND a real collision (correlated,
        non-independent shift branches) that directly falsifies the
        strongest ("compounded quadratic") reading of the mechanism while
        leaving the weaker ("reproduces DOOM's own sqrt(n)") reading open.
        Recommended priority: low (explicitly cofactor-class, not
        exponent-moving).
    - id: IDEA-20260813-5a2aaa
      title: CRT-residue hidden-shift screen for quasi-cyclic syndrome decoding
      class: mechanism
      one_line_summary: >-
        Tests whether HQC's ring CRT decomposition R isomorphic to F_2 x
        F_{2^(n-1)} carries hidden-shift structure exploitable by a
        Simon/Kuperberg-style quantum algorithm; finds it does not, via a
        direct linear-algebra obstruction.
      proof_search_map_audit_outcome: >-
        FAILED at the observation-collision stage -- a genuine, cheap,
        algebraic closure meeting docs/inventor-protocol.md section 4's
        standard (named obstruction: e -> e_bar is linear but the
        decoding-relevant secret is a combinatorial support pattern, not a
        group element). Recommended priority: low (closure-shaped, no
        positive claim).
    - id: IDEA-20260813-c34e09
      title: >-
        Orbit-quotient continuous-time quantum walk over the Z_n
        automorphism of the ISD search graph
      class: control
      one_line_summary: >-
        Tests whether the cyclic automorphism group lets the quantum-walk
        search graph be quotiented n-fold for free; finds it cannot, because
        the per-instance marked set is generically asymmetric.
      proof_search_map_audit_outcome: >-
        FAILED at the observation-collision stage with a zero-compute,
        purely algebraic obstruction (orbit-size divisibility under a free
        transitive action of Z_n, n prime). This also fails the
        lossy-projection compatibility test directly. Recommended priority:
        low (closure-shaped, no positive claim).
    - id: IDEA-20260813-319645
      title: >-
        Electric-network / span-program re-derivation of the MNRS quantum
        walk on the BJMM/MMT representation graph
      class: algorithm
      one_line_summary: >-
        Tests whether Belovs' electric-network framework gives a tighter
        hitting-time bound than the standard MNRS framework for the
        BJMM/MMT search graph; the observation-collision audit is
        INCONCLUSIVE (composite-graph conductance not characterized in this
        session), but method_ceiling caps any possible gain at a
        constant/polylog factor regardless.
      proof_search_map_audit_outcome: >-
        INCONCLUSIVE at observation-collision (recorded honestly, not
        forced to a clean pass/fail); method_ceiling audit bounds the best
        case to a non-exponential gain. Recommended priority: low.
    - id: IDEA-20260813-fe3c5e
      title: >-
        Sparse-regime baseline reproduction: does quantum-walk BJMM/MMT
        actually beat Grover-Prange at HQC's own weight regime?
      class: control
      one_line_summary: >-
        A measurement/control proposal (not an attack) asking whether
        Kachigar-Tillich's quantum-walk advantage survives HQC's very
        sparse weight regime (w=Theta(sqrt(n))), or collapses to plain
        Grover-Prange there -- which would mean the RQ's own comparison
        baseline needs regime-specific restatement.
      proof_search_map_audit_outcome: >-
        BLOCKED at baseline_embedding -- the required primary-source read
        (Kachigar-Tillich's exact formula) could not be completed because
        WebSearch failed and WebFetch of the primary source was not
        attempted. Recorded as an open, live proposal, not a closure and not
        an infrastructure-caused negative finding (AGENTS.md rule 3/5).
        Recommended priority: medium (cheapest to complete once literature
        access is restored, and gates correct baseline framing for the
        other four).

  ranking_rationale: >-
    Ranked by expected information gain per unit of remaining audit cost.
    IDEA-20260813-fe3c5e is ranked highest for immediate follow-up: its
    remaining work is a single symbolic literature-transcription step (no
    compute, no circuit design), it is a genuine discriminator (does the
    RQ's own bundled baseline hold at HQC's actual sparse parameters, or
    does it need a regime-specific correction), and its answer conditions
    how any of the other four proposals' claimed gains should be measured
    (against Grover-Prange or against quantum-walk-BJMM/MMT, whichever
    turns out tighter). IDEA-20260813-a46301 (quantum-DOOM) ranks second:
    its toy-scale (n=7) exact-enumeration test is cheap, and even though its
    observation-collision audit already found a real risk of overclaiming,
    the WEAKER claim (reproducing DOOM's own sqrt(n)) remains open and
    would be a legitimate, if modest, building-block result. IDEA-20260813-
    5a2aaa and IDEA-20260813-c34e09 are ranked lowest for further executor
    time: both already met docs/inventor-protocol.md section 4's closure
    standard within this ideation session itself (named obstruction plus
    argument plus forward guidance), at zero compute cost -- their value was
    realized during screening, and re-litigating them would not discriminate
    between new explanations. IDEA-20260813-319645 sits between: its
    audit is inconclusive rather than resolved, but its method_ceiling
    already caps any finding to a cofactor-class result, so its priority for
    scarce experiment budget is low even though the specific composite-graph
    conductance calculation remains a well-defined, doable next step for
    whoever wants a small, honestly-scoped building-block result.

  single_idea_recommended_first: IDEA-20260813-fe3c5e
  why_first_and_cheapest_valid_discriminator: >-
    Its minimal test requires no compute, no circuit construction, and no
    novel mathematics -- only reading Kachigar-Tillich's already-cited,
    already-published formula (arXiv 1703.00263) and taking a single
    symbolic limit (tau = w/n -> 0), then comparing it against the
    independently well-established Prange/Grover-Prange exponent in the same
    limit. It directly discriminates between two live, mutually exclusive
    explanations (the RQ's bundled baseline already holds at HQC's sparse
    parameters, vs. it needs a regime-specific correction), and its outcome
    changes how every other proposal in this batch, and any future proposal
    against this RQ, must state its own sota_delta and dominated_by fields.
    This session could not complete it only because of a tool-infrastructure
    failure (WebSearch), not a mathematical obstacle, so it is the single
    highest-value, lowest-cost next step.

  proof_search_map_audit_summary:
