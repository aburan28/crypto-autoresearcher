  honest_accounting:
    objects_considered:
      - "shift-label register composed with the existing quantum walk (DOOM-style folding)"
      - "CRT field-residue projection of ring elements onto F_{2^(n-1)}"
      - "automorphism-orbit quotient of the quantum-walk search graph"
      - "electric-network effective-resistance re-analysis of the existing walk's hitting time"
