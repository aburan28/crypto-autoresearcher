    dominated_by:
      IDEA-20260813-a46301: >-
        Kachigar-Tillich (2017, KN-LIT-80202e) dominates on the exponent
        axis outright; classical DOOM composed with the existing walk
        dominates on the time x memory x implementation-cost axis unless
        the quantum construction beats DOOM's own classical sqrt(n), which
        the observation-collision audit suggests it likely cannot. Checked
        against every corpus row in retrieval-screen.yaml.
      IDEA-20260813-5a2aaa: "n/a (no positive result claimed)"
      IDEA-20260813-c34e09: "n/a (no positive result claimed)"
      IDEA-20260813-319645: >-
        Kachigar-Tillich (2017, KN-LIT-80202e) dominates outright on the
        exponent axis; on the constant-factor axis, not fully checked
        against the resource-optimization literature cluster (named as an
        open item).
      IDEA-20260813-fe3c5e: >-
        Potentially dominated by simply reading the primary source directly
        -- an infrastructure limitation of this session, not a mathematical
        finding, named explicitly rather than hidden.
    sota_delta:
      IDEA-20260813-a46301: "at most Theta(sqrt(n)) prefactor, ~133 at HQC-128; explicitly cofactor-class"
      IDEA-20260813-5a2aaa: "no attack; conceptual/measurement contribution only"
      IDEA-20260813-c34e09: "no attack; conceptual/measurement contribution only"
      IDEA-20260813-319645: "no verified numeric delta; conjectured constant/polylog factor at most"
      IDEA-20260813-fe3c5e: "no attack; baseline-clarification contribution only"
    enumerated_closures:
      - id: IDEA-20260813-5a2aaa
        mechanism: >-
          The map from error vector e to its CRT field-residue e_bar in
          F_{2^(n-1)} is F_2-linear, so the "shift" relating any two
          distinct low-weight error vectors' images is (e - e')_bar, which
          depends on the PAIR (e, e') rather than being a single global
          secret shared across the whole instance family -- exactly the
          structure a hidden-shift/HSP quantum algorithm requires and
          exactly what this construction does not have.
        forward_guidance: >-
          Any future HSP-style attempt on HQC must find a DIFFERENT
          global-secret construction where the secret is truly a single
          group element (as in the LWE-to-dihedral-coset-problem reduction,
          the nearby-object control used in this audit), not a discrete
          combinatorial support pattern; no such reduction is known or
          attempted here.
      - id: IDEA-20260813-c34e09
        mechanism: >-
          For n prime, Z_n acts freely and transitively on the n
          coordinates, so every nontrivial orbit has size exactly n and any
          Z_n-invariant subset has size a multiple of n; since HQC's error
          weight w satisfies 0 < w < n, no single instance's error support
          can be Z_n-invariant, so the marked-vertex predicate of the
          quantum-walk search graph does not factor through the
          automorphism-orbit quotient for any actual instance.
        forward_guidance: >-
          DOOM-style multi-target folding (IDEA-20260813-a46301) is the
          surviving way to exploit the SAME cyclic structure -- it changes
          what counts as "marked" across many targets rather than trying to
          quotient the graph for one fixed instance. Any future attempt to
          use HQC's cyclic automorphism for a free graph-size reduction must
          address this same orbit-size obstruction, e.g. by working with an
          ensemble of instances rather than one fixed instance.
    open_directions_for_next_session:
      - >-
        Complete IDEA-20260813-fe3c5e's blocked baseline_embedding step
        once literature access (WebSearch/WebFetch) is restored: obtain
        Kachigar-Tillich's exact cost-exponent formula and take its
        tau = w/n -> 0 limit, comparing against Prange/Grover-Prange at
        HQC-128/192/256's actual parameters.
      - >-
        Complete IDEA-20260813-a46301's toy-scale (n=7) exact enumeration to
        determine whether the two-register quantum-DOOM construction
        reproduces DOOM's own classical sqrt(n) gain or falls short of it
        once the correlated-shift collision is correctly accounted for.
      - >-
        Complete IDEA-20260813-319645's level-by-level conductance
        characterization of the BJMM/MMT composite search graph, to resolve
        its currently-inconclusive observation-collision audit (though its
        method_ceiling already caps the possible gain to a cofactor).
      - >-
        Per docs/inventor-protocol.md section 1 / KN-OPEN-019, a written
        object-enumeration for code-based quantum ISD (analogous to the
        symmetric-cipher differential/linear/integral/boomerang/division-
        property taxonomy) does not exist in this program; this session's
        five-object sketch is not a substitute, and writing that
        enumeration would sharpen future object-first generation against
        this and sibling RQs.
      - >-
        Restore WebSearch/WebFetch tool access before the next ideation
        wave against this RQ -- three of five proposals in this wave were
        materially limited by its unavailability (novelty_status unverified
        throughout; IDEA-20260813-fe3c5e blocked outright).
