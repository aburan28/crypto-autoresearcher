      - >-
        Circuit/qubit/memory-resource-axis refinements of the above
        (Perriello et al. 2021/2023/2024; Chevignard-Fouque-Schrottenloher
        2024; Kimura-Takayasu-Takagi 2023; Esser et al. 2021/2022) -- active
