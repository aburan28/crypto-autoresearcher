          shift-label register j in Z_n composed with the existing quantum
          walk (IDEA-20260813-a46301, "quantum-DOOM")
        novelty: "plausibly new as a quantum construction; classical DOOM is well-known"
        testability: "concretely testable at toy scale (n=7 exact enumeration)"
        survival: >-
          survives only as far as reproducing DOOM's own classical sqrt(n)
