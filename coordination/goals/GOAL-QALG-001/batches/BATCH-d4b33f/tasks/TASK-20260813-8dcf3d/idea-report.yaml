  ranking_rationale: >-
    Ranked by expected information gain per unit of pre-compute audit cost,
    all five being classifiable as cheap (low/medium implementation,
    low/low-medium compute) at the minimal-test stage. IDEA-20260813-55d3a0
    (CRT decomposition) and IDEA-20260813-e6d55d (Simon zero-noise
    specialization) rank highest: both instantiate the search heuristics'
    "hunt for external structural ingredients" bias against a genuinely
    recent, concrete fact (CSI-FiSh's computed class-group structure; Simon
    2026's three-day-old preprint) rather than retuning an already-optimized
    parameter, both are resolvable largely by symbolic/exact pre-compute
    checks before any simulation, and both have an honestly disclosed
    ceiling (parameter-reduction for the CRT idea; galactic-algorithm risk
    for the Simon specialization) rather than an inflated one.
    IDEA-20260813-b650e0 (decoherence-tolerant memory tradeoff) ranks next: it
    directly answers an explicitly in-scope RQ mechanism class and its most
    likely failure mode is itself a citable, well-motivated closure.
    IDEA-20260813-710293 (k-ary Wagner generalization) ranks medium: a
    genuine open question but with an a-priori higher chance of reducing to
    an already-known parameterization of Kuperberg's own paper.
    IDEA-20260813-c6e557 (Grover pairing search) ranks lowest: its own
    informational-budget pre-analysis already makes a net exponent-moving
    gain the least likely outcome in the batch, though it remains a
    legitimate, cheap, recordable audit per docs/inventor-protocol.md's
    discipline that a fatigue-free closure is still a useful result.

  first_test_recommendation: >-
