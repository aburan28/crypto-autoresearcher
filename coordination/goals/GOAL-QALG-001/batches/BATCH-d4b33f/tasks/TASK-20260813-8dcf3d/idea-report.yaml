  established_families_declared_off_limits_program_wide: >-
    Named once here and referenced by each proposal per
    docs/inventor-protocol.md section 1: Kuperberg's original sieve
    (KN-LIT-2c8264, 2^{O(sqrt(log N))} time/query, error-free samples); the
    collimation c-sieve variant (Peikert 2020, KN-LIT-127, same time order
    with exponentially reduced quantum memory); Regev's oracle-based
    poly-time reduction (KN-LIT-21383c, conditional on an uninstantiable
    subset-sum oracle); the Childs-Jao-Soukharev reduction of isogeny
    path-finding to the hidden-shift instance (KN-LIT-071); and Simon 2026's
    noise-tolerant Hadamard-erasure mechanism (KN-LIT-e204ab, unverified,
    itself addressed by one proposal below rather than treated as
    off-limits). No filed proposal claims to have originated from any of
    these; each proposal states its specific delta against them explicitly.

  proposals:
    - id: IDEA-20260813-e6d55d
      title: >-
        Zero-noise specialization of Simon 2026's Hadamard-erasure DCP
        mechanism against CSIDH-scale exact dihedral coset instances
      class: algorithm
      mechanism_one_line: >-
        Take Simon 2026's claimed noise-tolerant DCP algorithm to its
        zero-fault-rate limit (a(n) -> infinity), which is exactly CSIDH's
        error-free coset-sampling regime, and audit whether the
        specialization is a legitimate instance of the paper's own theorem
        and, if so, whether its polynomial-but-large-exponent (O(n^13))
        sample complexity actually crosses over below Kuperberg's
        concretely costed 2^{O(sqrt(log N))} at any standardized CSIDH
        parameter, or is a galactic algorithm there.
      novelty_status: unverified
      recommended_priority: high
      proof_search_map_audit_status: >-
        NOT EXECUTED this session (execution requires compute/implementation,
        not authorized by this batch). The proposal's own pre-compute
        analysis flags a strong prior risk that the specialization falls
        outside the paper's proven parameter range or that the crossover
        order lies far above any standardized CSIDH parameter -- recorded as
        a predicted, not observed, likely partial closure.
    - id: IDEA-20260813-710293
      title: >-
        k-ary Wagner-tree generalization of Kuperberg's pairwise collimation
        step
      class: algorithm
      mechanism_one_line: >-
        Ask whether a k>2-ary unitary generalization of Kuperberg's pairwise
        combine step exists, and if so whether a global Wagner-style k-tree
        join (rather than Kuperberg's local bucket rule) changes the sieve's
        round-count exponent's FUNCTIONAL FORM rather than merely its
        constant.
      novelty_status: unverified
      recommended_priority: medium
      proof_search_map_audit_status: >-
        NOT EXECUTED this session. The proposal's own method-ceiling
        analysis predicts the most likely outcome is closure at a
        constant-factor-only result, explicitly flagged as the honest
        expectation rather than an assumed positive finding; a genuine
        near-term risk (not yet resolved) is that Kuperberg's own 2005 paper
        already covers this parameterization, which the required
        baseline-reproduction audit (not yet run) would surface.
    - id: IDEA-20260813-55d3a0
      title: >-
        CRT/factorization decomposition of the CSIDH dihedral hidden-shift
        instance via the class group's own computed order
      class: mechanism
      mechanism_one_line: >-
        If CSIDH's class-group order N factors into comparable-size coprime
        parts, ask whether the CRT isomorphism lets a D_N coset sample be
        losslessly (or near-losslessly) projected into independently
        Kuperberg-solvable D_{N1} and D_{N2} instances, recursively
        reducing the sqrt(log N) exponent's argument.
      novelty_status: unverified
      recommended_priority: high
      proof_search_map_audit_status: >-
        NOT EXECUTED this session. The single cheapest, most decisive
        pre-check (whether CSIDH-512's actual class-group order admits a
        favorable factorization at all) has not been run in this session;
        the proposal states plainly that it may be entirely vacuous for
        CSIDH-512 specifically if N proves unfavorably factored, and that
        even its best case is honestly a parameter-reduction, not a
        functional-form, exponent change.
    - id: IDEA-20260813-c6e557
      title: >-
        Amplitude-amplified pairing selection inside Kuperberg's sieve
        rounds
      class: control
      mechanism_one_line: >-
        Ask whether Grover-searching for higher-alignment pairs at each
        sieve round reduces the number of ROUNDS needed (exponent-form
        change) or only the per-round list size at fixed round count
        (constant-factor change), once the search's own oracle-call cost is
        fully charged.
      novelty_status: unverified
      recommended_priority: low
      proof_search_map_audit_status: >-
        NOT EXECUTED this session. This proposal's own informational-budget
        argument (an audit performed on paper within the proposal, not
        computed) already predicts that even an idealized zero-cost oracle
        would not reduce round count below Kuperberg's own bound, which
        would close the proposal entirely if confirmed by the (not yet run)
        minimal test -- flagged as the single most likely candidate in this
        batch to close cleanly at the pre-compute audit stage.
    - id: IDEA-20260813-b650e0
      title: >-
        Decoherence-tolerant classical-memory-assisted sieve
      class: representation
      mechanism_one_line: >-
        Ask whether Kuperberg's sieve's combination step can be restructured
        into small, independently-coherent batches whose outputs are
        measured and recorded classically between rounds, trading quantum
        memory O(L) for classical memory plus a bounded repetition count at
        the same time exponent -- directly targeting RQ-QALG-74bf20's own
        in-scope "quantum-memory-exponent reduction at fixed time" class.
      novelty_status: unverified
      recommended_priority: medium-high
      proof_search_map_audit_status: >-
        NOT EXECUTED this session. The proposal's own a-priori prediction,
        stated explicitly in its predictions block, is a SHARP
        (cliff-pattern) success-probability collapse under batching -- i.e.
        the proposal predicts its own likely closure, drawing a direct
        analogy to the well-established Regev-erasure obstruction
        (KN-TECH-d1bc4f) -- rather than assuming the mechanism works.

