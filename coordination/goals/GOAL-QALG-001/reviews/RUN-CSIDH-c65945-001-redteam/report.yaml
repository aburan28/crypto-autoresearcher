  reviewed_snapshot:
    commit: 95cc1fd4cd72d3f0ff10ff1e06f3661e47165b3c
    experiment: EXP-CSIDH-c65945
    run: RUN-CSIDH-c65945-001
    verified_commit_is_head_reachable: true
    verified_working_tree_clean_for_reviewed_paths: true
    note: >-
      Confirmed via `git log --oneline -1 HEAD` (95cc1fd4c is HEAD at review
