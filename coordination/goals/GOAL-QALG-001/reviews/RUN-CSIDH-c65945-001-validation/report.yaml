validation_report:
  id: VAL-20260906-csidhc65945
  task_id: TASK-VALIDATION-RUN-CSIDH-c65945-001
  run_ids: [RUN-CSIDH-c65945-001]
  experiment_id: EXP-CSIDH-c65945
  hypothesis_id: H-CSIDH-3eaede
  goal_id: GOAL-QALG-001
  reviewed_snapshot_commit: 95cc1fd4cd72d3f0ff10ff1e06f3661e47165b3c
  reviewed_snapshot_commit_note: >-
    Verified reachable from HEAD (`git merge-base --is-ancestor
    95cc1fd4c HEAD` -> true). `git status --porcelain` shows this run's
    directory clean against the commit (`git diff 95cc1fd4c --
    experiments/EXP-CSIDH-c65945/runs/RUN-CSIDH-c65945-001/` is empty), so
    this is the Coordinator-committed snapshot, not a working-tree-only
    artifact. `git show 95cc1fd4c --stat` confirms the commit touches
    exactly the 11 files under RUN-CSIDH-c65945-001/ and nothing outside
    that directory (970 insertions, 0 deletions).

  verdict: REVISE
  verdict_rationale: >-
    The two primary metrics -- class_group_order_match: true and
    applicability_outcome: B -- are both independently reproduced from
    scratch against freshly re-fetched primary sources and are CONFIRMED
    correct as reported. Every citation this task specifically named for
    spot-checking (Simon 2026 Section 2.2's "for simplicity, let N=2^n"
    Theorem/Proof; Ettinger-Hoyer's Theorem 2 general-N claim) verifies
    verbatim against the real retrieved PDF text, and a further six
    citations checked beyond the two required (CSI-FiSh Section 3 p.8
    factorization and "2^257.136"; CSI-FiSh Section 2.1 p.4 cyclicity;
    Regev 2004 Section 2 Definition 2.1 p.5; Kuperberg 2005 Section 5
    Algorithm 2 p.4; Kuperberg 2005 Section 6 Proposition 6.1 p.6; CJS
    Section 5 Lemma 5.1 / Algorithm 3 p.9/p.11) all verify verbatim as
    well. No scope violation exists anywhere in the run package. Required
    artifacts are all substantively present and their content matches
    what specification.yaml demands. This is REVISE rather than CONFIRM
    because three real, independently-discoverable defects remain
    uncorrected in the run package, the most significant of which bears
    directly on this Validator's own resource-record duty:
    (1) the run's own manifest.yaml records a 90-minute wall-clock span
    (15:00-16:30 UTC) against specification.yaml's hard
    budget.wall_clock_seconds_per_run: 1800 (30 minutes) -- a 3x apparent
    overrun -- while disclosing in the same field that this timing was
    never actually measured, only "reconstructed... approximate," and
    asserting without supporting arithmetic that this is "within the
    1800s budget's intent"; no stopping_rule, invalidation_rule, or
    Coordinator budget decision addresses this discrepancy, and no
    resource_usage.json-equivalent artifact exists to check it against;
    (2) applicability_audit.md misattributes one Kuperberg 2005 citation
    ("Section 3, p.2") to a sentence that is actually in the Introduction
    on page 1 -- the underlying substantive claim (Kuperberg's own
    Theorem 1.1 proof is first specialized to N=2^n in Section 3, which
    does begin on page 2) is independently true and separately
    verifiable, but the specific quoted sentence is not where cited; and
    (3) the audit quotes only the Proof's specializing clause of Simon
    2026's Section 2.2 Theorem ("For simplicity, let N=2^n") without
    disclosing that the Theorem's own STATEMENT claims a broader scope
    ("N is exponential in n", not restricted to a power of 2) -- a real
    tension in the primary text that CSIDH-CHG-2's strict operative test
    would still resolve to outcome B (a bare assertion of generality with
    no accompanying extension technique does not satisfy operative-test
    criterion (i)), but which the audit does not surface or dismiss
    explicitly, leaving a citation-completeness gap on exactly the point
    a critical reader would probe first. None of the three, singly or
    together, overturns class_group_order_match or applicability_outcome;
    all three are correctable by a targeted addendum/correction, not a
    re-run. This validation report is therefore admissible evidence of
    what the run computed and audited (per agents/validator.md, this does
    not itself authorize promotion, support an ECDLP claim, or demonstrate
    a speedup), but the run package should not be treated as a clean,
    fully-corrected receipt until the Coordinator files or directs
    corrections for items (1)-(3) above.

  # =====================================================================
  # ITEM 1: INDEPENDENT PRIMARY-SOURCE FETCH AND VERBATIM CONFIRMATION
  # =====================================================================
  independent_source_fetch:
    - id: FETCH-1-CSIFISH
      command: >-
        curl -sS --max-time 40 -L -o csifish.pdf -w "HTTP_CODE:%{http_code}
        SIZE:%{size_download}\n" "https://eprint.iacr.org/2019/498.pdf"
      result: "HTTP_CODE:200 SIZE:467604, then `pdftotext -layout csifish.pdf csifish.txt`"
      verbatim_match_check: >-
        Both required strings appear verbatim, on physical PDF page 8,
        under the "3 Class group computation" heading:
        "#Cl(OQ(sqrt(-p))) = 37 x 1407181 x 51593604295295867744293584889
        x31599414504681995853008278745587832204909." and "The class group
        of the order O therefore has cardinality 3 . #Cl(OQ(sqrt(-p)))
        which is approximately equal to 2[superscript]257.136." (pdftotext
        strips the superscript rendering of "2^257.136" to "2257.136";
        confirmed by independently computing log2(N) = 257.1369928597118,
        matching the paper's own stated figure to the precision it gives).
        CONFIRMED, NOT MERELY ASSERTED BY THE PRODUCER.
    - id: FETCH-2-SIMON2026
      command: >-
        curl -sS --max-time 40 -L -o simon2026.pdf
        "https://eprint.iacr.org/2026/1591.pdf"
      result: "HTTP_CODE:200 SIZE:280252"
      verbatim_match_check: >-
        Section "2.2 Algorithm Details" heading and the Theorem/Proof both
        located on physical page 6 (matches applicability_audit.md's "p.6"
        citation exactly). Proof text confirmed verbatim: "For simplicity,
        let N = 2^n, and assume all arithmetic operations and relations
        involving states, amplitudes and phases are (mod N)." CONFIRMED.
        Additional finding beyond the requested check: the THEOREM's own
        statement (immediately preceding the Proof, same page) reads
        "... where N is exponential in n and x is a random value (mod N)
        ..." -- a broader scope claim than N=2^n that applicability_audit.md
        does not quote or address; see operative_test_strictness_check below.
    - id: FETCH-3-ETTINGER-HOYER
      command: >-
        curl -sS --max-time 30 -L -o eh.pdf
        "https://arxiv.org/pdf/quant-ph/9807029"
      result: "HTTP:200 SIZE:162248"
      verbatim_match_check: >-
        "Theorem 2 (Main theorem)" on physical page 3: "Let gamma: D_N -> R
        be a function that fulfills the dihedral subgroup promise with
        respect to H. There exists a quantum algorithm that given gamma,
        uses Theta(log N) evaluations of gamma and outputs a subset
        X subset-of D_N such that X is a generating set for H with
        probability at least 1 - 2/N." (re-extracted with `pdftotext -raw`
        to resolve the fraction rendering; confirmed "1 - 2/N", not "1 -
        N^2" or similar, exactly as quoted in applicability_audit.md).
        Proof, physical page 4: "The subgroup <X1> <= D_N is normal in
        D_N, and the factor group D_N/<X1> is isomorphic to D_M where
        M = min{1 <= j <= N | (j,0) in <X1>}." verbatim match. CONFIRMED,
        exactly as quoted, both citations exactly located.
    - id: FETCH-4-CSIFISH-GITHUB-REPO
      note: see item 3 below (git clone check).
    - id: FETCH-5-ADDITIONAL-SPOT-CHECKS-BEYOND-TASK-MINIMUM
      description: >-
        Also fetched and checked Regev 2004 (arXiv:cs/0304005), Kuperberg
        2005 (arXiv:quant-ph/0302112), and Childs-Jao-Soukharev
        (arXiv:1012.4019) directly, to cross-check every remaining
        page/section citation in applicability_audit.md and
        cjs_group_order.md, not only the two the task named.
      results_summary: >-
        Regev 2004 Section 2 Definition 2.1, physical p.5: verbatim match,
        general-N throughout, no power-of-2 language anywhere in the
        paper (grepped in full). Kuperberg 2005 Section 6 Proposition 6.1,
        physical p.6 (heading "6. GENERALIZED DIHEDRAL GROUPS..."):
        verbatim match. Kuperberg 2005 Section 5 "Other Algorithms"
        Algorithm 2, physical p.4: verbatim match for both the CRT/
        automorphism technique quote and the "proof of Theorem 3.1
        carries over ... O(8^sqrt(log2 N))" quote. CSI-FiSh Section 2.1
        "we will assume that the class group Cl(O) is cyclic of order N",
        physical p.4: verbatim match. CJS Section 5 Lemma 5.1 and
        Algorithm 3, physical p.9 and p.11 respectively: section/page
        located exactly as cited (Lemma 5.1's own wording differs slightly
        in phrasing from cjs_group_order.md's paraphrase but the cited
        functions f_0, f_1 and their role are the same object).
        ONE ERROR FOUND: Kuperberg 2005's citation "Section 3, p.2" for
        the quote "We will prove Theorem 1.1 in a convenient case, N=2^n,
        in Section 3" is a MISATTRIBUTION -- that exact sentence is in the
        paper's Introduction (Section 1), physical/printed page 1, not in
        Section 3 (which is titled "3. A BASIC ALGORITHM" and begins on
        physical page 2). Section 3 does independently state the same
        N=2^n restriction in its own words on page 2 ("an algorithm to
        find the slope of a hidden reflection in D_N when the period
        N=2^n is a power of 2"), so the substantive claim survives, but
        the specific citation given does not verify at the stated
        location. Flagged as a citation-accuracy defect, not a fabricated
        quote (the sentence is real and in the paper, just misattributed
        to the wrong section/page).

  # =====================================================================
  # ITEM 2: INDEPENDENT ARITHMETIC VERIFICATION
  # =====================================================================
  metric_recomputations:
    - id: RECOMP-1-PRODUCT-RECONCILIATION
      method: >-
        From-scratch Python script (never reading verify_class_group_order.py
        beforehand for this step) multiplying the five cited factors
        [3, 37, 1407181, 51593604295295867744293584889,
        31599414504681995853008278745587832204909].
      result: >-
        Product == 254652442229484275177030186010639202161620514305486423592570860975597611726191
        (the stated N) EXACTLY. bit_length 258, log2(N) = 257.1369928597118.
        MATCHES raw-result.json and both cited sources exactly.
    - id: RECOMP-2-INDEPENDENT-PRIMALITY-FOUR-METHODS
      method: >-
        The executor's own check used only sympy.isprime (Miller-Rabin),
        disclosed here as a SHARED-LIBRARY DEPENDENCY, not an independent
        method on its own. This validator additionally ran THREE further,
        independent implementations: (a) a from-scratch Python
        Miller-Rabin (40 rounds, independent RNG seed, no sympy import)
        plus a Fermat test at bases {2,3,5,7,11,13}; (b) GNU coreutils
        `factor` (Pollard-rho / trial-division, an entirely separate
        codebase from sympy) on both large factors; (c) OpenSSL's `openssl
        prime` (BN_is_prime, also an entirely separate codebase).
      result: >-
        ALL FOUR METHODS AGREE on all five factors being prime:
        `factor 51593604295295867744293584889` -> returns itself (no
        proper factor found); `factor
        31599414504681995853008278745587832204909` -> returns itself;
        `openssl prime` reports "is prime" for all five factors
        (3, 37, 1407181, and both large factors); the from-scratch
        Miller-Rabin (40 rounds) and Fermat test at 6 bases both return
        True for all five. No disagreement among any of the four methods.
        This satisfies (and exceeds) the task's instruction to cross-check
        at least the two large factors with a second method.

  # =====================================================================
  # ITEM 3: GITHUB REPO CLONE AND SECOND-CITATION CHECK
  # =====================================================================
  control_checks:
    - id: CTRL-1-GITHUB-CLONE-INDEPENDENT
      command: git clone --depth 1 https://github.com/KULeuven-COSIC/CSI-FiSh.git
      result: >-
        SUCCEEDED (git protocol; direct `curl` to github.com HTML and the
        GitHub REST API both returned HTTP 403 from this environment's
        proxy, reproducing the identical restriction the run's own
        environment.json and command.txt disclose -- confirms this is a
        genuine environment property, not a producer fabrication).
        `classgroup_data/"class number"` file content:
        254652442229484275177030186010639202161620514305486423592570860975597611726191
        -- EXACT MATCH to both the CSI-FiSh paper's own N and to the run's
        reconciliation_note.md. README.md text: "This folder contains the
        class number, discrete logarithms and a HKZ reduced basis of the
        relation lattice" -- verbatim match to class_group_order.md's quote.
        CONFIRMED independently, not merely re-asserted from the run's own
        report.
    - id: CTRL-2-CROSS-CITATION-CONSISTENCY-CONTROL
      result: >-
        PASS, confirmed independently (see CTRL-1): both citations agree
        exactly. Per amendments/v1.yaml's CSIDH-OBJ-3 scope disclosure,
        correctly understood by this run as citation-transcription
        consistency between two of the same authors' publications, not an
        independently-computed second derivation -- the run's own prose
        is accurate about this control's epistemic weight, not overstated.
    - id: CTRL-3-KNOWN-ANSWER-CONTROL
      result: >-
        Re-read stdout.log: h(-23)=3 sanity check passed before the
        CSIDH-512-scale check ran. This is a textbook-standard fact for a
        small imaginary-quadratic discriminant; the harness-sanity logic
        (primality + product reconciliation on [3] against 3) is trivially
        correct and consistent with the same procedure applied at scale.
    - id: CTRL-4-VALIDATE-LEDGER-SCHEMA-CHECK
      method: "Ran `python3 tools/validate_ledger.py` against the full repo."
      result: >-
        Reproduces exactly the defect ledger/corrections/CORR-20260906-e1d1de.yaml
        already discloses: "experiments/EXP-CSIDH-c65945/runs/RUN-CSIDH-c65945-001/manifest.yaml:
        run.code.commit missing (not reproducible)" -- the manifest uses a
        three-timestamp commit_at_dispatch/commit_at_run_start/commit_at_run_end
        form instead of the single `code.commit` field the validator
        schema expects. Independently confirmed all three named commits
        (ad681cee0, cced42254, b47237c99) are real, exist, and chain
        correctly (cced42254 is the immediate parent of b47237c99, which
        is the immediate parent of 95cc1fd4c -- consistent with the
        dirty_note's account of two intervening concurrent commits from
        other sessions during this run's wall-clock window). The
        correction's own resolution (use commit_at_run_start:
        cced42254543b4e00ca4259acc9dd3a28536897a for reproducibility) is
        sound and independently verified. This is DISCLOSED AND ALREADY
        SUPERSEDED per AGENTS.md rule 2 (corrections supersede, never
        overwrite); not counted as an open defect in this report's verdict,
        but recorded here since the raw committed manifest, read on its
        own, still fails this specific schema check.
    - id: CTRL-5-BUDGET-WALL-CLOCK-DISCREPANCY
      method: >-
        Compared specification.yaml's budget.wall_clock_seconds_per_run:
        1800 against manifest.yaml's timing.started_at (2026-09-06T15:00:00Z)
        and timing.finished_at (2026-09-06T16:30:00Z).
      result: >-
        DEFECT, UNRESOLVED. The recorded span is 5400 seconds (90 minutes),
        3x the specification's hard per-run cap. manifest.yaml's own
        wall_seconds_note discloses these timestamps are "approximate,
        reconstructed from session activity (no continuous wall-clock
        timer was run alongside the interactive retrieval/reading work)"
        and asserts, without supporting arithmetic, that this is "within
        the 1800s budget's intent as a bounded single-session task." No
        stopping_rule or invalidation_rule in specification.yaml or
        amendments/v1.yaml addresses a wall-clock overrun, and no
        resource_usage.json-equivalent artifact with a genuinely measured
        timer exists in this run (contrast the sibling
        RUN-MLKEM-12d9b8-001, which has a real resource_usage.json with a
        measured wall_seconds of 0.0246). This validator did not
        substitute its own estimate for the missing measurement (per
        agents/validator.md Prohibitions); it reports the gap as found.
        This is the single most substantive open procedural defect in
        this run package and is the primary driver of this report's
        REVISE verdict at the task level.
    - id: CTRL-6-OPERATIVE-TEST-STRICTNESS-CHECK
      description: >-
        Task item 5: was CSIDH-CHG-2's operative test applied as strictly
        as the amendment requires, with no unstated leniency or strictness
        that could flip a marginal case?
      method: >-
        Independently re-read the exact primary-source passages
        applicability_audit.md relies on for each of the four sources
        (Simon 2026, Regev 2004, Kuperberg 2005, Ettinger-Hoyer) and
        checked whether the audit's application of criterion (i) ["an
        EXPLICIT statement... of a NAMED technique... extending N=2^n to
        general N, with page/lemma citation"] and criterion (ii)
        [independently-checked preconditions] matches what the sources
        actually say, in both directions (too lenient toward A, or too
        strict toward B).
      result: >-
        No instance of UNSTATED LENIENCY found: the audit correctly
        declines to credit Regev's, Kuperberg's, or Ettinger-Hoyer's own
        general-N results toward SIMON's specific technique, since none of
        those three sources' own general-N statements name a technique for
        extending SIMON's particular erasure/noise-tolerance proof (as
        opposed to their own, different constructions) -- this is the
        correct, strict reading CSIDH-OBJ-2's resolution requires, applied
        consistently across all three predecessor sources. ONE INSTANCE OF
        UNSTATED (OMITTED, NOT NECESSARILY WRONG) STRICTNESS FOUND: Simon
        2026's own Theorem statement (Section 2.2, p.6, immediately
        preceding the quoted Proof) reads "N is exponential in n" -- a
        broader scope than N=2^n -- and applicability_audit.md quotes only
        the Proof's "For simplicity, let N=2^n" clause, never mentioning
        the Theorem statement's own broader language or explaining why it
        does not satisfy the operative test. On this validator's own
        analysis, it still would not satisfy criterion (i) as amended
        (a bare, unaccompanied assertion of generality is not "a NAMED
        technique" -- the Theorem's proof never actually establishes the
        general case, only asserts it), so outcome B is NOT flipped by
        this omission. But the omission is a real citation-completeness
        gap under this contract's own citation-completeness control
        ("every claim... must cite an exact page/section/lemma... so an
        independent reviewer can re-check the audit's reasoning without
        re-deriving it from scratch") on exactly the passage most likely
        to be raised by a critical reader, and should be addressed by an
        addendum explicitly naming and dismissing this tension, not left
        implicit.

  # =====================================================================
  # ITEM 6: SCOPE-VIOLATION CHECK
  # =====================================================================
  scope_and_overreach_check:
    id: SCOPE-CHECK
    method: >-
      Grepped every artifact under RUN-CSIDH-c65945-001/ (case-insensitive)
      for "lemma 3", "CSIDH... secur", "security... CSIDH", "query
      comparison", "cost comparison", "compare... cost", and read every
      resulting hit in context.
    result: >-
      NO SCOPE VIOLATION FOUND. Every hit is an explicit scope disclaimer
      ("does NOT compute or compare any concrete time/query cost... and
      draws no conclusion about CSIDH's security"; "does not evaluate
      premise (ii), Lemma 3's correctness, any concrete cost, or CSIDH's
      security (all explicitly out of scope)"), matching
      specification.yaml's own stated scope exactly. No claim about Simon
      2026's Lemma 3 correctness, CSIDH security, or a cost/query
      comparison against Kuperberg's sieve is asserted anywhere in the run.
      The commit message (95cc1fd4c) carries the identical, correctly
      scoped disclaimer.

  # =====================================================================
  # ITEM 7: required_artifacts_crosscheck
  # =====================================================================
  artifact_checks:
    - id: ARTIFACT-CROSSCHECK
      method: >-
        manifest.yaml for RUN-CSIDH-c65945-001 contains NO
        `required_artifacts_crosscheck` field or section at all (grepped
        the full manifest; only an unstructured `artifacts:` filename map
        is present). This is a real inconsistency with its own sibling run
        archived in the immediately preceding commit of the same
        session -- RUN-MLKEM-12d9b8-001's manifest.yaml DOES carry a
        `required_artifacts_crosscheck` list, item-by-item, against its
        own specification.yaml. Since no template
        (templates/research-records.md) or role contract
        (agents/executor.md) mandates this exact field name, its absence
        is not itself a contract violation, but the task explicitly
        directed checking it, so this validator performed the crosscheck
        directly, item by item, against specification.yaml's actual
        required_artifacts list (5 items) since the run supplies no
        self-attestation of its own to check.
      per_item_result:
        - item: "1. Applicability-audit report citing exact page/section/lemma references"
          status: PASS
          note: >-
            applicability_audit.md present; citations independently
            spot-checked above (item 1/5) -- accurate except the one
            Kuperberg misattribution and the Simon-Theorem-statement
            omission both flagged in CTRL-6.
        - item: "2. Independently obtained N and full factorization, primality method, citations to both sources"
          status: PASS
          note: >-
            class_group_order.md present; primality method disclosed
            (Miller-Rabin/sympy.isprime); this validator independently
            re-verified with three further methods (RECOMP-2).
        - item: "3. Reconciliation note or explicit exact-agreement statement"
          status: PASS
          note: reconciliation_note.md present, exact-agreement statement, independently confirmed true (CTRL-1).
        - item: "4. Explicit statement of N' supplied by the CJS reduction, with citation"
          status: PASS
          note: >-
            cjs_group_order.md present; CJS Lemma 5.1/Algorithm 3 and
            Kuperberg Proposition 6.1 citations independently verified
            (item 1/5 additional spot-checks). N'=N correctly derived from
            Cl(O)'s disclosed cyclicity (k=1 in CJS's decomposition).
        - item: "5. Run record reaching a terminal status, filed under experiments/EXP-CSIDH-c65945/runs/"
          status: PASS
          note: >-
            manifest.yaml present, status: completed_valid, filed at the
            correct path. Terminal-status classification itself is
            questioned by CTRL-5's budget/timing finding (whether
            resource_exhaustion would have been the more accurate label
            given the recorded 90-minute span against a 30-minute budget),
            recorded there rather than re-litigated here.
      required_artifacts_crosscheck_field_present_in_manifest: false
      recommendation: >-
        Add a required_artifacts_crosscheck section to this manifest (or a
        superseding note) for internal consistency with its sibling run
        archived in the same batch; not independently blocking since the
        substance passes when checked directly against specification.yaml.

  heuristic_validation_checks: []
  heuristic_validation_checks_note: >-
    Not applicable: specification.yaml's own preregistered_prediction is
    explicitly "not_applicable... no probabilistic quantity or
    distributional prediction is made or tested" and heuristic_under_test
    is null. This is a deterministic citation-plus-arithmetic verification
    and literature audit, not a heuristic-validation experiment in the
