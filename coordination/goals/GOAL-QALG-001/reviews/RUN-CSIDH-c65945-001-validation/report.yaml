  proof_architecture_checks:
    - id: PROOF-MAP-STATUS-CHECK
      result: >-
        H-CSIDH-3eaede's proof_search_map.baseline_embedding.reproduction_check
        and .method_ceiling.nearby_object_control are both explicitly
        marked "Not performed by this experiment" / "Not run by this
        experiment" in the frozen hypothesis record, and this run's own
        artifacts (cjs_group_order.md's Scope note; applicability_audit.md's
        header) correctly and consistently do not claim to have closed
        either gap. Confirmed honestly disclosed, not silently dropped.
        This validator did not re-audit the proof_search_map's other three
        audits (observation_collision, quantifier_order, constructive
        transforms) from scratch, as that audit belongs to the design-time
