  scope_violation_check_summary: see scope_and_overreach_check above -- no violation found.

  limitations:
    - >-
      This validation independently re-fetched and re-read all four
      required primary sources plus Simon 2026 plus the CJS reduction
      paper (six PDFs total) and checked ten distinct page/section
      citations against them (eight requested-scope-plus-additional
