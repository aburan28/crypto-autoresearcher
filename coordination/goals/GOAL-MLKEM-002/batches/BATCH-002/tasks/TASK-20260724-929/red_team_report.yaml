schema: crypto.autoresearch.red_team_report.v1
red_team_report:
  id: RT-20260724-004
  task_id: TASK-20260724-929
  goal_id: GOAL-MLKEM-002
  batch_id: BATCH-002
  role: red-team
  official_state_change: none
  claim_under_review: >-
    EXP-MLKEM-005 outcome_classification isolated_to_audited_commits under
    criterion_used=widened_optimized_compare — library-facing adequacy control
    passed; known defect retained; PQClean avx2 verify measured as widened
    peer; no new silent/accept outside known wolfSSL defects; claim_tier
    laboratory_implementation_conformance.

  inference:
    requested_policy: review-xhigh
    resolved_model: cursor-grok-4.5-high-fast
    fallback_used: true
    independent_session: true
    adapter_note: >-
      Independent session from Executor (TASK-20260724-926) and Validator
      (TASK-20260724-928). review-xhigh cannot be resolved on this harness;
      fallback to cursor-grok-4.5-high-fast recorded explicitly per
      inference-amendment-TASK-20260724-929.yaml.

  snapshot_basis:
    status: coordinator_declared_verified_snapshot
    handoff_input: >-
      Verified snapshot commit 63e7467f96b6c1b52f7a8ce25399a875e19ba52f
      (TASK-20260724-927)
    branch_confirmed: cursor/explore-ml-kem-cryptanalysis-a197
    package_gate: experiments/EXP-MLKEM-005/execution-report.yaml exists
    implementation_commit_cited: 655420934c21377712d1992d6759013becbdf350
    archive_commit_observed: >-
      63e7467 research: archive TASK-20260724-927 EXP-MLKEM-005 RUN-MLKEM-017
      RUN-MLKEM-018 RUN-MLKEM-019 RUN-MLKEM-020 run package
    review_policy: >-
      Review used only committed EXP-MLKEM-005 package paths, plus
      H-MLKEM-005, EV-MLKEM-007, DEC-20260724-015, GOAL-MLKEM-002, and
      H-MLKEM-004. No experiment, ledger, or dispatch artifacts were
      modified. No git commit performed.

  outcome_classification_verdict:
    executor_class: isolated_to_audited_commits
    correct_class_under_frozen_precedence: isolated_to_audited_commits
    isolated_to_audited_commits_should_stand: true
    generator_hardening_insufficient_should_displace: false
    synthetic_control_inadequate_should_displace: false
    invalid_harness_or_dispatch_should_displace: false
    systemic_incomplete_comparison_should_displace: false
    second_impl_unavailable_should_displace: false
    changes_outcome_class: false
    verdict: revise
    statement: >-
      Under experiments/EXP-MLKEM-005/specification.yaml
      outcome_classification.precedence, isolated_to_audited_commits is the
      unique class matching the recorded facts on a literal reading of the
      frozen EXP-005 text: CTRL-LIBRARY-FACING-ADEQUACY reported pass
      (analysis/library_facing_adequacy_report.json; execution-report.yaml);
      known-defect retention and negative harness pass; no new silent/accept
      outside known v5.9.1 / EV-MLKEM-005 NEON class; pinned second peer
      PQClean measured under criterion_used=widened_optimized_compare
      (source-lock.yaml; analysis/second_implementation_selection.md). Higher-
      precedence classes do not fire on that literal reading. Objections below
      do not flip the EXP-005 class token; they are fatal to overclaims that
      (1) the adequacy control is truly library-facing against wolfSSL/PQClean
      entry points, (2) the class answers H-MLKEM-004 or GOAL-MLKEM-002
      completion criterion 2, or (3) claim_tier may rise. Verdict is revise:
      leave the class standing only when scoped to
      criterion_used=widened_optimized_compare and refuse GOAL-criterion-2 /
      fixed-bound-neighborhood paraphrase.

  outcome_class_stands: true
  outcome_class_licensing: >-
    isolated_to_audited_commits under EXP-MLKEM-005 licenses only a
    laboratory null on the backends, parameter sets, keys, generator classes,
    and selection criterion actually exercised (widened_optimized_compare /
    PQClean ml-kem-1024 avx2 length-parameterized verify), with instrument
    adequacy decided by a standalone dlopen'd defective SO rather than by
    detection through wolfSSL or PQClean compare/decap entry points. It does
    not license H-MLKEM-004 support, GOAL completion criterion 2, strict
    fixed-bound-tail isolation, library-facing G2/G3 power against real
    library comparators, native-ISA AVX2 attestation, crypto-scale claims,
    or any claim_tier above laboratory_implementation_conformance.

  objections:
    - id: OBJ-RT005-001
      attack_line: 1
      title: CTRL-LIBRARY-FACING-ADEQUACY remains a construction tautology off the library path
      status: landed
      severity: critical
      fatal: true
      fatal_to: >-
        Claim that instrument adequacy against real library comparison/
        decapsulation entry points was repaired; claim that
        added_discriminating_power reflects wolfSSL/PQClean generator power
      contest: >-
        Whether CTRL-LIBRARY-FACING-ADEQUACY cures OBJ-RT004-002 / DEC-015
        library-facing repair, or relocates the harness tautology into a
        standalone injected SO that never rides the library compare path.
      evidence_refs:
        - experiments/EXP-MLKEM-005/implementation/defective_compare.c
        - experiments/EXP-MLKEM-005/implementation/adequacy_probe.c
        - experiments/EXP-MLKEM-005/implementation/library_facing_adequacy.py
        - experiments/EXP-MLKEM-005/analysis/library_facing_adequacy_report.json
        - experiments/EXP-MLKEM-005/execution-report.yaml#class_marginal_information
        - ledger/hypotheses/H-MLKEM-005.yaml#mechanism
        - coordination/goals/GOAL-MLKEM-002/batches/BATCH-001/tasks/TASK-20260724-922/red_team_report.yaml#OBJ-RT004-002
      finding: >-
        defective_compare.c implements the multiplicity gate by construction
        (single-byte diffs confined to R return 0; a second R diff returns
        nonzero). adequacy_probe.c dlopens that SO and calls
        mlkem_injected_defective_compare directly; it never interposes into
        wolfSSL or PQClean compare/decap symbols, never uses LD_PRELOAD, and
        never routes through conformance_probe/decap_boundary_probe. G2/G3
        patterns submitted by the adequacy probe are exclusively multi-byte
        patterns inside R, so detection is guaranteed unless the SO itself is
        broken — the same tautology shape as EXP-MLKEM-004's synthetic_cmp,
        relocated from Python to C. Attestation hard-codes
        library_call_path_exercised: true (adequacy_probe.c mode_attest) and
        the Python scorer hard-codes attributable_via_library_call_path: True
        for every marginal row. H-MLKEM-005 mechanism required marginal
        detection "through the same entry points used for substantive
        probes"; that conjunct is unmet. Separately,
        library_G2_minus_G1_excluding_known_defect and
        library_G3_minus_G1_excluding_known_defect remain empty in
        execution-report.yaml, so real-library G2/G3 discriminating power is
        still unshown. The execution-report marginal note still says
        "Synthetic control G2/G3 detections," revealing the repair remains
        synthetic-control-shaped. Under a literal EXP-005 class definition
        the control "passes," so this does not flip the class token; it is
        fatal to any statement that library-facing instrument power against
        wolfSSL/PQClean was demonstrated.
      does_not_flip_class: true
      class_implication: >-
        Class may stand as EXP-005 literal; instrument-adequacy conjunct of
        GOAL/H-MLKEM-005 must be graded harness-SO-level only, not
        library-entry-point-level.

    - id: OBJ-RT005-002
      attack_line: 2
      title: isolated_to_audited_commits must not answer H-MLKEM-004 or GOAL completion criterion 2
      status: landed
      severity: critical
      fatal: true
      fatal_to: >-
        GOAL-MLKEM-002 completion_criteria[1]; H-MLKEM-004 support; any
        paraphrase of widened isolation as fixed-bound-tail isolation
      contest: >-
        Whether the EXP-005 class token can be paraphrased as deciding the
        strict fixed-bound-tail isolation-versus-systemic question that
        defines H-MLKEM-004 and GOAL completion criterion 2.
      evidence_refs:
        - ledger/goals/GOAL-MLKEM-002.yaml#completion_criteria
        - ledger/hypotheses/H-MLKEM-004.yaml
        - ledger/hypotheses/H-MLKEM-005.yaml#interpretation_limits
        - experiments/EXP-MLKEM-005/specification.yaml#design_time_preflight.widening.claim_boundary
        - experiments/EXP-MLKEM-005/specification.yaml#invalidation_rules
        - experiments/EXP-MLKEM-005/execution-report.yaml#protocol_deviations
        - experiments/EXP-MLKEM-005/analysis/second_implementation_selection.md
        - ledger/evidence/EV-MLKEM-007.yaml
        - ledger/decisions/DEC-20260724-015.yaml
      finding: >-
        GOAL completion criterion 2 requires the isolation-versus-systemic
        question to be asked of a second implementation whose comparison
        routine uses fixed-bound hand-written vector tails, OR explicit
        infrastructure unavailability after exhausting the preference order.
        EXP-MLKEM-005 did neither as its load-bearing outcome: it rejected
        the fixed-bound neighborhood as empty, then measured PQClean under
        widened_optimized_compare and emitted isolated_to_audited_commits —
        not second_impl_unavailable. That is a different question from
        H-MLKEM-004's defect-mechanism neighborhood. H-MLKEM-005 and the
        EXP-005 invalidation rules explicitly forbid paraphrasing a widened
        null as a strict fixed-bound-tail isolation claim; the execution
        report records that disclaimer. The shared class token
        isolated_to_audited_commits nonetheless creates a high overclaim
        surface for GOAL completion / H-MLKEM-004 support. Fatal to those
        paraphrases; nonfatal to the EXP-005 class when criterion_used is
        retained in every citation.
      does_not_flip_class: true

    - id: OBJ-RT005-003
      attack_line: 3
      title: docker amd64-on-arm64 and pqclean-probe repair qualify attestation but do not flip class
      status: landed_with_scope
      severity: medium
      fatal: false
      fatal_to: null
      contest: >-
        Whether docker linux/amd64-on-arm64 execution of AVX2 backends, or
        the post-failure pqclean-probe repair, undermines CTRL-BACKEND-
        ATTESTATION enough to force invalid_harness_or_dispatch.
      evidence_refs:
        - experiments/EXP-MLKEM-005/execution-report.yaml#protocol_deviations
        - experiments/EXP-MLKEM-005/analysis/second_implementation_selection.md
        - experiments/EXP-MLKEM-005/analysis/failed_attempts/
        - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-017/manifest.yaml
        - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-018/manifest.yaml
        - experiments/EXP-MLKEM-005/specification.yaml#controls.CTRL-BACKEND-ATTESTATION
      finding: >-
        AVX2 wolfSSL and PQClean probes ran under docker linux/amd64 on an
        arm64 host after Rosetta SIGILL. That is disclosed infrastructure
        emulation, not silent native-ISA attestation. It qualifies any claim
        about native x86_64 AVX2 microarchitectural fidelity; it does not,
        by itself, erase functional compare/decap observations if backend
        symbols and decap-boundary measurements were recorded for the docker
        builds. Separately, initial pqclean-probe link failure during
        RUN-MLKEM-017 was repaired (scheme-local aliases + common objects)
        and RUN-MLKEM-018/019/020 were re-executed with failed attempts
        archived. That is honest infra accounting, not evidence against the
        mathematical hypothesis, and not a reason to displace the class once
        the repaired probe was measured. Nonfatal; does not flip class.
      does_not_flip_class: true

    - id: OBJ-RT005-004
      attack_line: 4
      title: PQClean widened peer asks a different mechanism question
      status: landed
      severity: critical
      fatal: true
      fatal_to: >-
        Any claim that the measured peer is in the fixed-bound hand-written
        vector-tail defect-mechanism neighborhood of H-MLKEM-004 /
        GOAL-MLKEM-002
      contest: >-
        Whether PQClean ml-kem-1024 avx2 verify under
        widened_optimized_compare is the same isolation question as the
        goal's fixed-bound neighborhood.
      evidence_refs:
        - experiments/EXP-MLKEM-005/analysis/second_implementation_selection.md
        - experiments/EXP-MLKEM-005/source-lock.yaml#second_implementation
        - ledger/evidence/EV-MLKEM-007.yaml
        - ledger/hypotheses/H-MLKEM-004.yaml#mechanism
        - experiments/EXP-MLKEM-005/specification.yaml#design_time_preflight.widening
      finding: >-
        PQClean avx2 verify.c is a length-parameterized SIMD loop (len/32
        intrinsic blocks + scalar remainder) — the same mechanism class
        EV-MLKEM-007 / EXP-MLKEM-004 rejected under strict_fixed_bound. Under
        the widened criterion it is a reachable optimized-compare peer, and
        measuring it was authorized by EXP-005 freeze. It cannot structurally
        exhibit the wolfSSL-style fixed-bound hand-written vector-tail
        omission class that defines the GOAL / H-MLKEM-004 neighborhood. A
        null on that peer answers "no reproducible silent index/accept under
        our grids on this length-parameterized AVX2 verify," not "isolation
        within the fixed-bound-tail neighborhood." Fatal to neighborhood
        equivalence; nonfatal to EXP-005's own widened class token.
      does_not_flip_class: true

    - id: OBJ-RT005-005
      attack_line: 5
      title: No path to upgrade claim_tier beyond laboratory_implementation_conformance
      status: landed_as_defeat_of_upgrade
      severity: high
      fatal: true
      fatal_to: >-
        Any upgrade of claim_tier above laboratory_implementation_conformance;
        crypto-scale, MLWE, attack, oracle, or disclosure-ready claims
      contest: >-
        Whether any artifact path upgrades claim_tier beyond laboratory
        implementation conformance.
      evidence_refs:
        - experiments/EXP-MLKEM-005/specification.yaml#claim_tier
        - experiments/EXP-MLKEM-005/execution-report.yaml#anchor
        - experiments/EXP-MLKEM-005/specification.yaml#interpretation via H-MLKEM-005
        - ledger/hypotheses/H-MLKEM-005.yaml#interpretation_limits
        - docs/claims-and-verification.md
      finding: >-
        No path exists. Anchor remains weak
        (wolfSSL_postfix_scalar_self_consistency_encap_decap;
        file_actually_validated_against
        none_nist_file_validation_failed_or_incomplete). Observations are
        finite-generator laboratory conformance nulls on audited commits /
        a widened peer. H-MLKEM-005 forbids timing/power/EM/cache/fault
        claims, MLWE hardness claims, and crypto-scale generalization.
        Certificate-bearing cryptanalytic advantage is absent. Any attempt
        to raise claim_tier is defeated.
      does_not_flip_class: true

    - id: OBJ-RT005-006
      attack_line: 6
      title: Recurring API-spot and coverage packaging weaknesses persist
      status: landed_with_scope
      severity: medium
      fatal: false
      fatal_to: null
      contest: >-
        Whether post-fix / peer nulls remain underpowered relative to a
        hardened-gate narrative.
      evidence_refs:
        - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-019/raw.json
        - experiments/EXP-MLKEM-005/analysis/class_coverage_report.json
        - coordination/goals/GOAL-MLKEM-002/batches/BATCH-001/tasks/TASK-20260724-922/red_team_report.yaml#OBJ-RT004-003
      finding: >-
        RUN-MLKEM-019 still uses G2G3_spot single-byte offsets at the
        decapsulation boundary for clean backends rather than the primitive
        multi-byte/alignment definitions. class_coverage_report.json includes
        BUILD-PQCLEAN but still omits NEON builds (recurrence of
        OBJ-RT004-003 packaging gap). These qualify the strength of the
        post-fix/peer null; they do not invent a systemic hit or flip the
        class.
      does_not_flip_class: true

  defeated_objections:
    - id: OBJ-RT005-003-subclaim-flip_to_invalid
      summary: >-
        Subclaim that docker amd64-on-arm64 or disclosed probe-repair alone
        forces invalid_harness_or_dispatch is defeated; both are disclosed
        infrastructure with archived failed attempts and subsequent measured
        runs. They qualify native-ISA attestation, they do not erase the
        class on frozen precedence.
    - id: OBJ-RT005-005-subclaim-tier_upgrade_possible
      summary: >-
        Any path to claim_tier above laboratory_implementation_conformance is
        defeated.

  fatal_objections:
    - OBJ-RT005-001
    - OBJ-RT005-002
    - OBJ-RT005-004
    - OBJ-RT005-005
  nonfatal_objections:
    - OBJ-RT005-003
    - OBJ-RT005-006

  required_controls:
    - id: CTRL-RT005-TRUE-LIBRARY-PATH-INTERPOSITION
      method: >-
        Interpose or inject the defective comparator onto the same
        wolfSSL/PQClean compare or decap entry used by substantive probes
        (symbol interposition, wrapper at the library call site, or an
        in-library defect under human-authorized lab build), and show
        G1-silent / G2-or-G3-visible detection via that entry; or explicitly
        accept that instrument adequacy remains harness-SO-only.
      pass_condition: >-
        Non-empty marginals attributable to the control observed through
        conformance_probe/decap_boundary_probe call paths (or an attested
        equivalent library entry), with library_call_path_exercised derived
        from evidence rather than hard-coded true.
    - id: CTRL-RT005-GOAL-CRITERION-2-HONESTY
      method: >-
        Either measure a fixed-bound hand-written vector-tail second
        implementation, or keep second_impl_unavailable / explicit
        infrastructure unavailability as the load-bearing cross-impl
        outcome; never cite widened isolated_to_audited_commits as GOAL
        completion criterion 2 or H-MLKEM-004 support.
      pass_condition: >-
        Coordinator decision text binds criterion_used and refuses
        fixed-bound paraphrase; GOAL criterion 2 marked unmet unless a
        fixed-bound peer is measured or unavailability is the official
        cross-impl class.
    - id: CTRL-RT005-FULL-API-G2G3
      method: >-
        Replace decap G2G3_spot with primitive-equivalent multi-byte/
        alignment mutations, or label API coverage partial.
      pass_condition: >-
        Decap-boundary tables for post-fix and peer backends exercise
        coordinated multi-byte/alignment mutations or are marked
        not_measured / partial.
    - id: CTRL-RT005-COVERAGE-REPORT-NEON
      method: Include NEON builds in analysis/class_coverage_report.json when measured.
      pass_condition: Report keys include BUILD-PREFIX-NEON and BUILD-POSTFIX-NEON if those builds ran.

  counterexample_or_mutation: >-
    Cheapest discriminating mutation: route the injected defective compare
    through the wolfSSL (or PQClean) symbol actually called by
    conformance_probe — e.g. rename/wrap the library compare to call
    mlkem_injected_defective_compare for region R only — without telling the
    classifier. If library_G2_minus_G1_excluding_known_defect stays empty
    while the standalone adequacy_probe still passes, the "library-facing"
    repair is exposed as SO-local tautology. Separately, any Coordinator
    synthesis that cites isolated_to_audited_commits without
    criterion_used=widened_optimized_compare is an immediate overclaim
    counterexample against EXP-005 invalidation rules.

  baseline_comparison: >-
    Closest baseline is EXP-MLKEM-004 / EV-MLKEM-007 / RT-20260724-003:
    same wolfSSL defect retention, same empty strict fixed-bound
    neighborhood, harness synthetic tautology, outcome
    second_impl_unavailable. EXP-MLKEM-005 relocates the tautology into a
    dlopen'd C SO, widens the peer criterion, measures PQClean, and emits
    isolated_to_audited_commits. Relative to H-MLKEM-004 / GOAL criterion 2:
    the fixed-bound question remains unanswered; widening changed the
    question rather than answering it. Relative to cryptanalytic baselines:
    not applicable; claim_tier is laboratory implementation conformance.

  narrowest_supported_statement: >-
    Under EXP-MLKEM-005 frozen precedence, the unique matching outcome class
    is isolated_to_audited_commits scoped to
    criterion_used=widened_optimized_compare. Within that class the package
    supports only: (1) a standalone injected defective comparator SO is
    G1-silent and G2/G3-visible by its own multiplicity-gate construction
    when called via adequacy_probe/dlopen; (2) the known wolfSSL v5.9.1 AVX2
    omission (and known NEON class where present) remains detectable with
    decap accepts; (3) no new reproducible silent index or equal-length
    decap accept was observed on wolfSSL post-fix backends or the PQClean
    avx2 widened peer under the grids actually executed (API coverage still
    partly G2G3_spot); (4) strict fixed-bound neighborhood remained empty;
    (5) this does not support H-MLKEM-004, does not satisfy GOAL completion
    criterion 2, does not show library-entry-point instrument power, and
    does not raise claim_tier above laboratory_implementation_conformance.
    Anchor remains weak. AVX2 observations are docker amd64-on-arm64.

  knowledge_promotion:
    warranted: false
    reason: >-
      Objections are scoped licensing and instrument-adequacy qualifications
      that drive the next Coordinator decision, not a reusable corpus finding
      beyond existing KN-TECH-030 / KN-FIND-001. No new positive technique or
      durable negative result should be promoted until the Coordinator binds
      the widened-criterion scope and library-path gap in an evidence/
      decision record.

  next_concrete_action: >-
    Coordinator should accept isolated_to_audited_commits only with
    criterion_used=widened_optimized_compare bound in EV/DEC text; mark GOAL
    completion criterion 2 unmet; refuse H-MLKEM-004 support; record
    OBJ-RT005-001 as standing (adequacy is SO-local tautology, not
    library-entry-point power); keep claim_tier at
    laboratory_implementation_conformance; do not promote knowledge. Next
    decisive work is either true library-path interposition plus a
    fixed-bound peer, or an explicit goal rewrite that retires the
    fixed-bound neighborhood requirement.

  artifact_paths:
    - coordination/goals/GOAL-MLKEM-002/batches/BATCH-002/tasks/TASK-20260724-929/red_team_report.yaml
    - coordination/goals/GOAL-MLKEM-002/batches/BATCH-002/tasks/TASK-20260724-929/falsification_review.md
