    fallback_used: true
    independent_session_required: true
    independent_session: true
    note: >-
      Independent session from the Executor (TASK-20260724-926). Requested
      review-xhigh is unavailable in this harness; Cursor Grok 4.5 used with
      fallback_used true, matching the handoff / inference amendment.

  verdict: accept_with_qualifications
  terminal_verdict_contract: passed
  admissibility_verdict: accept_with_qualifications
  overall_verdict: accept_with_qualifications

  outcome_classification_supported: true
  outcome_classification_claim: isolated_to_audited_commits
  outcome_classification_note: >-
    Under frozen precedence, invalid_harness_or_dispatch does not apply to the
    terminal package (failed first attempts are archived under
    analysis/failed_attempts/ and superseded by completed_valid runs).
    positive_control_undetected does not fire (PREFIX-AVX2 ML-KEM-1024 silent
    set equals R under G1/G2; G3 hits subset; negative harness detected on all
    three parameter sets). synthetic_control_inadequate does not fire
    (library-facing adequacy G1 silent set equals R, G2/G3 marginal non-empty
    via injected comparator call path, scoring_uses_diff_count_branch false).
    systemic_incomplete_comparison does not fire (postfix backends and pinned
    PQClean peer report empty silent sets; PREFIX-NEON silents are treated as
    the known EV-MLKEM-005 / CVE-2026-6330 class and do not appear in
    new_silent_index_candidates). second_impl_unavailable does not fire
    (criterion_used=widened_optimized_compare; PQClean
    202a8f96315f9ed219387a50f7e40d04af037ea8 avx2 measured).
    generator_hardening_insufficient does not fire (G2/G3 adequacy marginal
    non-empty). Therefore isolated_to_audited_commits is the correct terminal
    class, scoped to criterion_used=widened_optimized_compare and not a strict
    fixed-bound-tail isolation claim.

  library_facing_adequacy_repair:
    answered: true
    evidenced_in_artifacts: true
    verdict: repair_landed
    no_len_diffs_special_case: true
    evidence:
      - experiments/EXP-MLKEM-005/implementation/library_facing_adequacy.py
      - experiments/EXP-MLKEM-005/implementation/defective_compare.c
      - experiments/EXP-MLKEM-005/analysis/library_facing_adequacy_report.json
      - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-017/raw.json
      - experiments/EXP-MLKEM-005/runs/RUN-MLKEM-018/raw.json
      - experiments/EXP-MLKEM-005/execution-report.yaml
    note: >-
      CTRL-LIBRARY-FACING-ADEQUACY uses dlopen-injected defective comparator;
      archived report records scoring_uses_diff_count_branch=false and
      scoring_uses_only_compare_rc_and_g1_silent_set=true. Independent rescore
      of archived G1 flags + G2/G3 observations reproduces pass and identical
      8+8 marginal findings. No len(diffs)==1 branch in multiclass_generator.py
      or run_experiment.py scoring paths.

  second_peer_criterion:
    criterion_used: widened_optimized_compare
    peer: PQClean
    commit: 202a8f96315f9ed219387a50f7e40d04af037ea8
    backend: avx2
    measured_in_primitive_grid: true
    measured_in_decap_malformed: true
    second_impl_unavailable: false
    note: >-
      Strict fixed-bound neighborhood re-checked empty (EV-MLKEM-007); W1 PQClean
      ml-kem-1024 avx2 verify pinned under widened_optimized_compare after probe
      link repair. Selection rationale in
      analysis/second_implementation_selection.md.

  blockers: []

  qualifications:
    - id: Q-SNAPSHOT-RECEIPT-COMMIT-SHA-NULL
      severity: low
      note: >-
        snapshot-receipt.json has commit_sha: null. Dispatch queue binds
        TASK-20260724-927 to 63e7467f96b6c1b52f7a8ce25399a875e19ba52f; all 76
        receipt hashes match that commit and the working tree; receipt file
        hash 61d0f571bed8c477a7703f0d2824fbdb4c922ed708a1d95c706706d56a307b8d
        matches dispatch post-commit record.

    - id: Q-EXECUTOR-RESOLVED-MODEL-TYPO-FAILED-ATTEMPTS
      severity: low
      note: >-
        Failed-attempt manifests under analysis/failed_attempts/ for
        RUN-MLKEM-018/019/020 attempt1 set resolved_model to
        cursor-grok-4.5-high-fast-fast (duplicated -fast). Terminal successful
        run manifests RUN-MLKEM-017..020 and execution-report.yaml correctly use
        cursor-grok-4.5-high-fast. Bookkeeping noise in superseded infra
        attempts; not an integrity failure of the admissible package.

    - id: Q-DIRTY-TREE-AT-EXECUTION
      severity: low
      note: >-
        All four run manifests and execution-report record dirty_tree /
        dirty_tree_at_execution true at implementation_commit
        655420934c21377712d1992d6759013becbdf350. Package content is bound by
        verified snapshot commit 63e7467; dirty-tree disclosure is honest but
        means working-tree-only edits may have existed at measurement time.

    - id: Q-BUILD-RECEIPT-TMP-PRIMARY
      severity: low
      note: >-
        Build timing and several mechanism-evidence paths are under
        /tmp/exp-mlkem-005/... . Build timing receipt content is embedded in
        RUN-MLKEM-017/raw.json (total_recorded_wall_seconds=830; independently
        re-summed from 13 events). Second-peer selection excerpts are inlined
        in analysis/second_implementation_selection.md.

    - id: Q-ANCHOR-WEAK-HONEST
      severity: informational
      note: >-
        NIST ACVP files were downloaded (used_for_validation false) and did not
        upgrade the grade. Final anchor
        wolfSSL_postfix_scalar_self_consistency_encap_decap graded weak with
        file_actually_validated_against=
        none_nist_file_validation_failed_or_incomplete. Honest under the frozen
        CTRL-STRONG-ANCHOR rule.

    - id: Q-AVX2-DOCKER-ON-ARM64
      severity: informational
      note: >-
        Protocol deviation discloses AVX2 wolfSSL and PQClean avx2 probes under
        docker linux/amd64 on an arm64 host (Rosetta SIGILL). Observations are
        still attested artifacts in the committed package; this qualifies
        portability of the measurement environment, not hash integrity.

    - id: Q-ISOLATION-SCOPED-TO-WIDENED-CRITERION
      severity: informational
      note: >-
        isolated_to_audited_commits is supported only under
        criterion_used=widened_optimized_compare. It must not be read as a
        strict fixed-bound-tail isolation claim (frozen specification claim
        boundary).

