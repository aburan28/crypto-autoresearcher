design_report:
  task_id: TASK-20260724-924
  status: completed
  hypothesis_id: H-MLKEM-005
  experiment_id: EXP-MLKEM-005
  selection_decision: DEC-20260724-015
  proposal_ref: IDEA-20260724-002
  evidence_ref: [EV-MLKEM-007, EV-MLKEM-006, EV-MLKEM-005]
  knowledge_ref: [KN-TECH-030, KN-FIND-001]
  summary: >-
    Specified H-MLKEM-005 and froze approved EXP-MLKEM-005: a laboratory-only
    hardened multi-class ML-KEM comparison-conformance gate that replaces the
    EXP-MLKEM-004 harness tautology with CTRL-LIBRARY-FACING-ADEQUACY and that
    pins a second peer under a preflight-or-widen rule so isolation is asked
    of a real optimized-compare peer rather than predetermined unavailable.
  repair_map:
    - defect: RT-20260724-003 / DEC-015 harness tautology
      protocol_element: >-
        CTRL-LIBRARY-FACING-ADEQUACY via external interposition or injection;
        scoring forbids len(diffs)==1 special-casing; synthetic_control_inadequate
        still names the instrument-failure class for continuity with prior
        precedence.
    - defect: DEC-015 empty fixed-bound neighborhood / predetermined unavailability
      protocol_element: >-
        design_time_preflight citing EV-MLKEM-007 exhaustion; run-start re-check
        of strict fixed-bound order; active widening to
        optimized_compare_neighborhood with default PQClean avx2 verify; explicit
        claim_boundary that a widened null does not license strict fixed-bound
        isolation.
    - defect: KN-TECH-030 reachability must remain
      protocol_element: >-
        Retained repaired precedence with both generator_hardening_insufficient
        and isolated_to_audited_commits reachable when the library-facing
        control works and a second peer is measured.
  design_choices:
    - >-
      Adequacy region R defaults to the final 32 bytes of ML-KEM-1024 so the
      control occupies the same indices as the known wolfSSL omission without
      being the same defect; detection-retention uses unmodified library builds.
    - >-
      Widening is declared at freeze because design-time preflight found no new
      fixed-bound target beyond EV-MLKEM-007; Executor must still attempt strict
      order once before locking the widened peer.
    - >-
      Ledger decision ID reserved as DEC-20260724-017 to avoid collision with
      GOAL-P13-001's DEC-20260724-016.
    - >-
      Planned runs are RUN-MLKEM-017..020.
  feasibility_checks_by_coordinator:
    - check: EXP-MLKEM-004 harness is reusable
      method: Inspection of committed package at c3bd8ba / implementation paths
      result: multiclass_generator, probes, and run_experiment.py provide extension points for interposition and widened selection.
    - check: Strict fixed-bound neighborhood status
      method: EV-MLKEM-007 and EXP-MLKEM-004 second_implementation_selection.md
      result: empty among preferred public candidates; widening authorized with recorded rationale.
    - check: Known defect still available as detection-retention control
      method: EV-MLKEM-005 / EV-MLKEM-007
      result: wolfSSL v5.9.1 AVX2 silent set 1536..1567 established and retained.
  scope_guards:
    - No key recovery, oracle construction, query chaining, or attack-cost estimation.
    - No deployed system, network peer, or third-party key.
    - No timing, power, EM, cache, microarchitectural, or fault measurement.
    - No external vulnerability claim or third-party contact.
    - Nothing bears on MLWE hardness or passive ML-KEM security.
    - claim_tier capped at laboratory_implementation_conformance.
  artifact_paths:
    - ledger/hypotheses/H-MLKEM-005.yaml
    - experiments/EXP-MLKEM-005/specification.yaml
  inference:
    requested_policy: coordinator-ultra-code
    resolved_model: cursor-grok-4.5-high-fast
    fallback_used: true
    note: >-
      GPT-5.6 coordinator-ultra-code cannot be resolved on this Cursor runtime;
      recorded fallback_used true.
