design_report:
  task_id: TASK-20260724-917
  status: completed
  hypothesis_id: H-MLKEM-004
  experiment_id: EXP-MLKEM-004
  selection_decision: DEC-20260724-008
  proposal_ref: IDEA-20260724-001
  evidence_ref: [EV-MLKEM-006, EV-MLKEM-005]
  knowledge_ref: [KN-TECH-030, KN-FIND-001]
  summary: >-
    Specified H-MLKEM-004 and froze approved EXP-MLKEM-004: a repaired
    laboratory-only hardened multi-class ML-KEM comparison-conformance gate
    that plants a baseline-invisible synthetic positive control so that both
    generator_hardening_insufficient and isolated_to_audited_commits are
    reachable worlds, and that requires the second implementation to use
    fixed-bound hand-written vector comparison tails rather than a
    length-parameterized verify.
  repair_map:
    - defect: KN-TECH-030 precedence unreachability
      protocol_element: >-
        CTRL-SYNTHETIC-BASELINE-INVISIBLE plus a new synthetic_control_inadequate
        class, and a redefined generator_hardening_insufficient that fires only
        when the synthetic control is missed. Rediscovery of the known wolfSSL
        defect is forbidden as class_marginal_information.
    - defect: OBJ-RT003-001 liboqs representativeness
      protocol_element: >-
        CTRL-MECHANISM-MATCHED-SECOND-IMPL with an explicit rejection of
        length-parameterized-only verify as the load-bearing second
        implementation, and a preference order starting at BoringSSL then PQClean
        assembly.
    - defect: OBJ-RT003-003/C2 exact-command and build accounting
      protocol_element: CTRL-EXACT-COMMAND-AND-BUILD-ACCOUNTING as an invalidation condition.
    - defect: OBJ-RT003-004 anchor rebrand
      protocol_element: >-
        An implementation may not be graded strong against vectors shipped
        inside itself; downloaded-but-unused NIST files must not upgrade grade.
  design_choices:
    - >-
      The synthetic control defaults to the final 32 bytes of ML-KEM-1024 so it
      occupies the same region as the known wolfSSL omission without being the
      same defect: G1 is forced silent on that region for the synthetic
      comparator, while G2/G3 patterns in the region must be visible.
    - >-
      second_impl_unavailable is a distinct class below systemic and above
      generator_hardening_insufficient, so exhausting the preference order does
      not silently become an isolation claim.
    - >-
      Task IDs start at TASK-20260724-917 and the decision ID is reserved as
      DEC-20260724-015 to avoid collisions with origin/main handoffs through
      TASK-916 and decisions through DEC-014.
  feasibility_checks_by_coordinator:
    - check: EXP-MLKEM-003 harness is reusable
      method: Inspection of committed package at e487652
      result: multiclass_generator, conformance/decap probes, and run_experiment.py provide the extension points.
    - check: Known defect still available as detection-retention control
      method: EV-MLKEM-005 / EV-MLKEM-006
      result: wolfSSL v5.9.1 AVX2 silent set 1536..1567 established and re-detected.
  scope_guards:
    - No key recovery, oracle construction, query chaining, or attack-cost estimation.
    - No deployed system, network peer, or third-party key.
    - No timing, power, EM, cache, microarchitectural, or fault measurement.
    - No external vulnerability claim or third-party contact.
    - Nothing bears on MLWE hardness or passive ML-KEM security.
  artifact_paths:
    - ledger/hypotheses/H-MLKEM-004.yaml
    - experiments/EXP-MLKEM-004/specification.yaml
  inference:
    requested_policy: coordinator-ultra-code
    resolved_model: cursor-grok-4.5-high
    fallback_used: true
