schema: crypto.autoresearch.red_team_report.v1
red_team_report:
  id: RT-20260724-003
  task_id: TASK-20260724-922
  goal_id: GOAL-MLKEM-002
  batch_id: BATCH-001
  role: red-team
  official_state_change: none
  claim_under_review: >-
    EXP-MLKEM-004 outcome_classification second_impl_unavailable —
    preference order exhausted without a mechanism-matched second
    implementation; synthetic control passed; known defect retained; no new
    silent/accept on wolfSSL post-fix; isolation across implementations not
    claimed.

  inference:
    requested_policy: review-xhigh
    resolved_model: cursor-grok-4.5-high-fast
    fallback_used: true
    independent_session: true
    adapter_note: >-
      Independent session from Executor (TASK-20260724-919) and Validator.
      review-xhigh cannot be resolved on this harness; fallback to
      cursor-grok-4.5-high-fast recorded explicitly per task card.

  snapshot_basis:
    status: coordinator_declared_verified_snapshot
    handoff_input: Verified EXP-MLKEM-004 snapshot from TASK-20260724-920
    branch_confirmed: cursor/explore-ml-kem-cryptanalysis-a197
    package_gate: experiments/EXP-MLKEM-004/execution-report.yaml exists
    implementation_commit_cited: 6ffc7dc5928486e2d348783f6850f67395ffed8d
    archive_commit_observed: >-
      c3bd8ba research: archive TASK-20260724-920 EXP-MLKEM-004 RUN-MLKEM-013
      RUN-MLKEM-014 RUN-MLKEM-015 RUN-MLKEM-016 run package
    review_policy: >-
      Review used only committed EXP-MLKEM-004 package paths named by the
      handoff, plus ledger/hypothesis/knowledge inputs. No experiment
      artifacts were modified. No git commit performed.

  outcome_classification_verdict:
    executor_class: second_impl_unavailable
    correct_class_under_repaired_precedence: second_impl_unavailable
    isolated_to_audited_commits_should_stand: false
    generator_hardening_insufficient_should_displace: false
    systemic_incomplete_comparison_should_displace: false
    changes_outcome_class: false
    statement: >-
      Under experiments/EXP-MLKEM-004/specification.yaml
      outcome_classification.precedence, second_impl_unavailable outranks
      generator_hardening_insufficient and isolated_to_audited_commits, and
      ranks below systemic_incomplete_comparison and the instrument-failure
      classes. Recorded facts match that class uniquely: synthetic control
      pass (analysis/synthetic_control_report.json; execution-report.yaml
      synthetic_control.pass true) so synthetic_control_inadequate and
      generator_hardening_insufficient do not fire; known-defect retention
      and negative harness pass so positive_control_undetected does not fire;
      new_silent_or_accept_outside_known_v591_defect false so systemic does
      not fire; second_implementation.name second_impl_unavailable with
      exhausted preference-order attempts
      (analysis/second_implementation_selection.md; source-lock.yaml;
      RUN-MLKEM-013/raw.json). isolated_to_audited_commits is unreachable
      because its frozen definition requires a measured mechanism-matched
      second implementation. The class is therefore correct; objections below
      qualify what the null licenses, they do not flip the class.

  kn_tech_030_disposition:
    verdict: answered_for_precedence_reachability_restated_for_library_facing_power
    statement: >-
      KN-TECH-030 required a baseline-invisible positive control so that
      generator_hardening_insufficient and isolated_to_audited_commits are
      both reachable worlds. CTRL-SYNTHETIC-BASELINE-INVISIBLE supplies that
      for the precedence list: G1-silent on R and G2/G3-detected by
      construction (implementation/synthetic_control.py lines 31–48,
      170–205; analysis/synthetic_control_report.json pass true;
      class_marginal_information.synthetic_control non-empty;
      rediscovery of the wolfSSL defect excluded from marginals). That is an
      answer to the protocol-design defect in EV-MLKEM-006 / KN-TECH-030.
      It does not demonstrate that library-facing G2/G3 grids add
      discriminating power against real comparison defects:
      library_G2_minus_G1_excluding_known_defect and
      library_G3_minus_G1_excluding_known_defect remain empty in
      RUN-MLKEM-016/raw.json and execution-report.yaml. On that stronger
      reading, the blindness concern is restated, not cured.

  objections:
    - id: OBJ-RT004-001
      attack_line: 1
      title: second_impl_unavailable used to dodge a harder finding
      status: landed_with_scope
      severity: high
      contest: >-
        Whether mechanism rejections of BoringSSL/PQClean/mlkem-native/aws-lc
        were honest, or the criterion was applied so narrowly that no public
        implementation could qualify, making second_impl_unavailable a
        predetermined escape from isolation-or-systemic adjudication.
      evidence_refs:
        - experiments/EXP-MLKEM-004/specification.yaml#source_lock.second_implementation.selection_rule
        - experiments/EXP-MLKEM-004/analysis/second_implementation_selection.md
        - experiments/EXP-MLKEM-004/source-lock.yaml#second_implementation
        - experiments/EXP-MLKEM-004/runs/RUN-MLKEM-013/raw.json#second_implementation
        - ledger/evidence/EV-MLKEM-006.yaml#unresolved_confounds
      finding: >-
        Per-attempt rejections are mechanism-honest under the frozen text:
        BoringSSL CRYPTO_memcmp, PQClean avx2 len/32+remainder,
        PQClean aarch64 runtime-length scalar verify, mlkem-native
        mlk_ct_memcmp, and aws-lc's mlkem-native path are all
        length-parameterized and explicitly insufficient as the load-bearing
        second implementation. The dodge is not a silent skip of a measured
        systemic hit. However, the preference order named primarily
        candidates that EV-MLKEM-006 already flagged as untested-or-
        length-parameterized, and after exhaustive rejection the living
        public neighborhood appears empty of fixed-bound hand-written
        vector/SIMD comparison tails. That makes second_impl_unavailable
        nearly predetermined at freeze time. Secondary liboqs probe source
        (implementation/liboqs_probe_secondary_ref.c) was retained but not
        executed, so even the weaker non-load-bearing cross-impl null from
        EXP-MLKEM-003 was not re-measured. Raw mechanism evidence files are
        cited under /tmp/exp-mlkem-004/pre-run/ and are not archived inside
        the committed package (only excerpts in
        second_implementation_selection.md).
      does_not_flip_class: true
      class_implication: >-
        Confirms second_impl_unavailable rather than isolated_to_audited_commits;
        does not invent systemic_incomplete_comparison without a measured defect.

    - id: OBJ-RT004-002
      attack_line: 2
      title: Synthetic control is a harness tautology
      status: landed
      severity: critical
      contest: >-
        Whether CTRL-SYNTHETIC-BASELINE-INVISIBLE repairs KN-TECH-030 or is
        a toy only the harness can fail.
      evidence_refs:
        - experiments/EXP-MLKEM-004/implementation/synthetic_control.py
        - experiments/EXP-MLKEM-004/analysis/synthetic_control_report.json
        - experiments/EXP-MLKEM-004/runs/RUN-MLKEM-016/raw.json#class_marginal_information
        - knowledge/techniques/KN-TECH-030.md
      finding: >-
        synthetic_cmp returns equal for every single-byte-confined difference
        in R and unequal for every multi-byte difference in R
        (synthetic_control.py:45–48). G2/G3 pattern runners only submit
        multi-byte patterns, so detection is guaranteed unless the harness
        itself is broken. The control never asks whether the library-facing
        multiclass generator would catch a real comparator that is silent on
        single-byte diffs and noisy on coordinated multi-byte diffs. It
        answers KN-TECH-030's reachability requirement (both outcome classes
        can fire) and does not answer instrument adequacy against libraries.
        Empty library marginal sets after the repair prove the gap remains.
      kn_tech_030: answered_reachability_restated_library_power

    - id: OBJ-RT004-003
      attack_line: 3
      title: Post-fix null remains generator-scoped and API-underpowered
      status: landed
      severity: high
      contest: >-
        Whether the wolfSSL post-fix null is still underpowered despite the
        synthetic control.
      evidence_refs:
        - experiments/EXP-MLKEM-004/analysis/class_coverage_report.json
        - experiments/EXP-MLKEM-004/runs/RUN-MLKEM-014/raw.json#BUILD-POSTFIX-AVX2
        - experiments/EXP-MLKEM-004/runs/RUN-MLKEM-014/raw.json#BUILD-POSTFIX-NEON
        - experiments/EXP-MLKEM-004/runs/RUN-MLKEM-015/raw.json#decap
        - experiments/EXP-MLKEM-004/implementation/decap_boundary_probe.c
        - experiments/EXP-MLKEM-004/execution-report.yaml#new_silent_or_accept_outside_known_v591_defect
      finding: >-
        Primitive post-fix SCALAR/AVX2/NEON grids report silent_byte_count 0
        under the executed G1/G2/G3 definitions, and
        new_silent_index_candidates is empty (RUN-MLKEM-014). That null is
        real as a scoped measurement. It is still underpowered relative to a
        hardened-gate narrative: (a) G3 index_fraction is 0.125 by design;
        (b) analysis/class_coverage_report.json omits both NEON builds even
        though RUN-MLKEM-014 raw contains them (packaging recurrence from
        EV-MLKEM-006); (c) API-boundary "G2/G3" for clean backends is
        G2G3_spot — single-byte xor_0xff at eight fixed offsets
        (decap_boundary_probe.c:271–299), not the multi-byte coordinated
        G2/G3 used at the primitive level or by the synthetic control;
        POSTFIX-AVX2/NEON decap result rows are ~80 G2G3_spot + summary, with
        zero accepts. The synthetic control's pass does not strengthen this
        library null; it only unlocks precedence reachability.
      does_not_flip_class: true

    - id: OBJ-RT004-004
      attack_line: 4
      title: Weak anchor invalidates outcome
      status: defeated
      severity: low
      contest: >-
        Whether anchor grade weak invalidates second_impl_unavailable.
      evidence_refs:
        - experiments/EXP-MLKEM-004/specification.yaml#controls.CTRL-STRONG-ANCHOR
        - experiments/EXP-MLKEM-004/execution-report.yaml#anchor
        - experiments/EXP-MLKEM-004/source-lock.yaml#conformance_anchor
        - experiments/EXP-MLKEM-004/runs/RUN-MLKEM-016/summary.json
      finding: >-
        Anchor is named wolfSSL_postfix_scalar_self_consistency_encap_decap,
        graded weak, with file_actually_validated_against
        none_nist_file_validation_failed_or_incomplete. NIST ACVP files were
        downloaded and explicitly not used to upgrade the grade
        (execution-report protocol_deviations; source-lock attempts). This
        is honest relative to EXP-MLKEM-003's strong-on-self rebranding.
        Frozen CTRL-STRONG-ANCHOR requires naming and grading, not strong.
        Weak anchor qualifies differential-reference strength; it does not
        invalidate or reclassify second_impl_unavailable.
      does_not_flip_class: true

    - id: OBJ-RT004-005
      attack_line: 5
      title: What second_impl_unavailable licenses
      status: landed_as_scope_statement
      severity: medium
      contest: >-
        What the class licenses and does not license.
      evidence_refs:
        - experiments/EXP-MLKEM-004/specification.yaml#outcome_classification.second_impl_unavailable
        - experiments/EXP-MLKEM-004/specification.yaml#outcome_classification.isolated_to_audited_commits
        - experiments/EXP-MLKEM-004/execution-report.yaml#outcome_classification
        - ledger/hypotheses/H-MLKEM-004.yaml#distinguishable_outcomes
      finding: >-
        Per frozen text, second_impl_unavailable is an infrastructure outcome
        for the cross-implementation line only: preference order exhausted;
        wolfSSL-only lines may still be reported; isolation across
        implementations is not claimed. It licenses (i) recording that no
        mechanism-matched second implementation was buildable/measurable,
        (ii) retaining wolfSSL detection-retention and post-fix nulls as
        scoped laboratory observations under the grids run, and (iii)
        blocking isolated_to_audited_commits. It does not license H-MLKEM-004
        support, systemic cleanliness of optimized ML-KEM compare paths,
        cross-implementation isolation, crypto-scale or MLWE claims, or the
        proposition that G2/G3 have library-facing discriminating power
        beyond the harness synthetic control.

  defeated_objections:
    - id: OBJ-RT004-004
      summary: Weak anchor qualifies; does not flip class.
    - id: OBJ-RT004-001-subclaim-dishonest_rejections
      summary: >-
        Subclaim that BoringSSL/PQClean/etc. were dishonestly rejected is
        defeated; rejections match frozen mechanism criterion. The landed
        portion is predetermined emptiness of the preference neighborhood,
        not false mechanism readings.

  required_controls:
    - id: CTRL-RT004-REAL-LIBRARY-BASELINE-INVISIBLE
      method: >-
        Plant or locate a library-side (not harness-only) comparator defect
        that is G1-silent and G2-or-G3-visible, or accept that instrument
        adequacy against libraries remains unshown.
      pass_condition: >-
        Non-empty library_G2_minus_G1 or library_G3_minus_G1 attributable to
        that control, with rediscovery of wolfSSL {1536..1567} excluded.
    - id: CTRL-RT004-MECHANISM-NEIGHBORHOOD-OR-REWRITE
      method: >-
        Either obtain one pinned fixed-bound hand-written vector/SIMD tail
        implementation and run the full primitive+decap grid, or rewrite the
        isolation hypothesis so it does not require a neighborhood that
        currently has no public inhabitant; do not treat second_impl_unavailable
        as soft support for isolation.
      pass_condition: >-
        Measured mechanism-matched second impl, or explicit hypothesis rewrite
        with second_impl_unavailable as terminal infrastructure for the
        cross-impl conjunct.
    - id: CTRL-RT004-FULL-API-G2G3
      method: >-
        Replace decap G2G3_spot single-byte offsets with the same multi-byte
        and alignment mutation definitions used at the primitive level (or
        label API coverage partial).
      pass_condition: >-
        Decap-boundary tables for post-fix backends exercise coordinated
        multi-byte/alignment mutations, not only eight single-byte spots.
    - id: CTRL-RT004-COVERAGE-REPORT-COMPLETE
      method: Include NEON builds in analysis/class_coverage_report.json.
      pass_condition: Report keys include BUILD-PREFIX-NEON and BUILD-POSTFIX-NEON.
    - id: CTRL-RT004-ARCHIVE-MECHANISM-EVIDENCE
      method: >-
        Copy pre-run mechanism evidence files into the experiment package
        instead of /tmp-only paths.
      pass_condition: >-
        Repository-relative evidence files exist under
        experiments/EXP-MLKEM-004/ and are referenced by source-lock.yaml.

  counterexample_or_mutation: >-
    Cheapest discriminating mutation: introduce a harness-injected library
    shim (or a tiny pinned third implementation) whose compare equals on any
    single-byte diff in a designated region and differs on a seeded 8-byte
    contiguous flip there; run G1 vs G2 without telling the classifier. If
    library_G2_minus_G1 stays empty, the widened generator is still blind
    despite synthetic_control pass. Separately, measuring liboqs again as an
    explicitly non-load-bearing secondary cannot unlock isolation but would
    defeat any narrative that second_impl_unavailable was chosen to avoid
    seeing a second null.

  baseline_comparison: >-
    Closest specialized baseline is EXP-MLKEM-003 / EV-MLKEM-006: same
    wolfSSL prefix defect retained, same post-fix zero-new-silent observation
    under finite grids, but outcome was generator_hardening_insufficient
    because marginals were empty and isolation was unreachable. EXP-MLKEM-004
    repairs reachability with a harness synthetic control and correctly
    refuses isolation via second_impl_unavailable after mechanism-matched
    selection fails. Relative to Pollard-rho/BSGS: not applicable; claim tier
    is laboratory implementation conformance, not cryptanalytic advantage.
    Relative to a mechanism-matched second implementation: no baseline was
    measured; length-parameterized verifies remain the only other public
    neighborhood actually available and were barred by design.

  narrowest_supported_statement: >-
    Under the repaired EXP-MLKEM-004 precedence, the unique correct outcome
    class is second_impl_unavailable. Within that class, the package supports
    only: (1) the harness synthetic control is G1-silent and G2/G3-visible by
    construction; (2) the known wolfSSL v5.9.1 AVX2 omission at 1536..1567
    remains G1/G2/G3-detectable with decap accepts; (3) no new reproducible
    primitive silent index and no equal-length decap accept was observed on
    the wolfSSL post-fix backends under the grids actually executed;
    (4) no mechanism-matched second implementation was obtained after the
    recorded preference-order attempts; (5) isolation across implementations
    is not claimed; (6) H-MLKEM-004 is not supported. Anchor weak and
    API-spot G2/G3 further qualify (3).

  next_concrete_action: >-
    Coordinator should accept second_impl_unavailable, refuse any promotion
    of H-MLKEM-004 toward support/isolation, record OBJ-RT004-001..003 as
    standing scope limits, and either (a) procure a true fixed-bound
    hand-written-tail second implementation plus a library-facing
    baseline-invisible control before another isolation attempt, or
    (b) rewrite the systemic/isolation question so it does not require a
    currently empty public mechanism neighborhood.

  artifact_paths:
    - coordination/goals/GOAL-MLKEM-002/batches/BATCH-001/tasks/TASK-20260724-922/red_team_report.yaml
    - coordination/goals/GOAL-MLKEM-002/batches/BATCH-001/tasks/TASK-20260724-922/falsification_review.md
