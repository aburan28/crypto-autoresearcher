  qualifications:
    - id: Q-EXEC-REPORT-WALL-SECONDS-PLACEHOLDER
      severity: medium
      note: >-
        execution-report.yaml lists wall_seconds: 5400.0 for each of the four
        runs and measured_run_wall_sum_seconds: 21600.0. Per-run manifests record
        actual wall_seconds ≈ 2.96 / 1.19 / 8.38 / 0.05 s (sum ≈ 12.58 s). The
        5400 values match the budget cap, not measured run wall. Treat manifest
        timings as authoritative; do not use execution-report run wall fields
        as evidence of compute cost.

    - id: Q-MANIFEST-GIT-COMMIT-MISBIND-013-015
      severity: medium
      note: >-
        RUN-MLKEM-013/014/015 manifests set git_commit to
        ef345b5d2965ccc3c687b14d34d5d7c2b4afde08, which is reachable but is an
        unrelated SRC-P13-WESOLOWSKI snapshot and is not an ancestor of HEAD for
        the EXP-MLKEM-004 package. RUN-MLKEM-016 and execution-report
        implementation_commit correctly cite
        6ffc7dc5928486e2d348783f6850f67395ffed8d (snapshot parent). Package
        content is bound by archive commit c3bd8ba; the 013–015 revision field
        is bookkeeping noise, not evidence the wrong tree was measured.

    - id: Q-SNAPSHOT-RECEIPT-COMMIT-SHA-NULL
      severity: low
      note: >-
        snapshot-receipt.json has commit_sha: null. Dispatch queue binds
        TASK-20260724-920 to c3bd8bab7bcc8a99ff4986822695fe6fa9af624a; all 53
        receipt hashes match that commit and the working tree.

    - id: Q-BUILD-RECEIPT-TMP-PRIMARY
      severity: low
      note: >-
        Build accounting is referenced at
        /tmp/exp-mlkem-004/pre-run/build_timing_receipt.json. Content is also
        embedded in RUN-MLKEM-013/raw.json (total_recorded_wall_seconds=302,
        independently re-summed from events). Some early events are labeled
        reconstructed_from_session_log (disclosed). Standalone receipt is not
        a git-path artifact, but the embedded copy satisfies archival for
        validation.

    - id: Q-ANCHOR-WEAK-HONEST
      severity: informational
      note: >-
        NIST ACVP files were downloaded (n_tested=0 against wolfSSL parser) and
        correctly did not upgrade the grade. Final anchor
