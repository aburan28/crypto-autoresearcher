  outcome_classification_supported: true
  outcome_classification_claim: second_impl_unavailable
  outcome_classification_note: >-
    Under repaired precedence, synthetic_control_inadequate and
    generator_hardening_insufficient do not fire (synthetic control is
    G1-silent and G2/G3-visible). Known-defect retention and negative harness
    pass. No new silent index or equal-length decap accept outside the known
    v5.9.1 defect class. Preference order for a mechanism-matched second
    implementation was exhausted with documented rejections
    (BoringSSL/PQClean/mlkem-native/aws-lc all length-parameterized). Therefore
    second_impl_unavailable is the correct terminal class — not
    isolated_to_audited_commits.

  kn_tech_030_repair:
    answered: true
    evidenced_in_artifacts: true
    verdict: repair_landed
    evidence:
      - experiments/EXP-MLKEM-004/implementation/synthetic_control.py
      - experiments/EXP-MLKEM-004/analysis/synthetic_control_report.json
      - experiments/EXP-MLKEM-004/runs/RUN-MLKEM-013/raw.json
      - experiments/EXP-MLKEM-004/runs/RUN-MLKEM-016/raw.json
      - experiments/EXP-MLKEM-004/execution-report.yaml
    contrast_with_EXP_MLKEM_003: >-
      EXP-MLKEM-003 had empty G2_minus_G1/G3_minus_G1 on the known wolfSSL
      defect and claimed added discriminating power from rediscovery; KN-TECH-030
      marks that design as unreachable for isolation. EXP-MLKEM-004 plants
      CTRL-SYNTHETIC-BASELINE-INVISIBLE (G1-silent on R=1536..1567; G2/G3
      detect multi-byte/alignment patterns), attributes class_marginal_information
      only to synthetic detections, and keeps library rediscovery arrays empty.
      Outcome is second_impl_unavailable rather than generator_hardening_insufficient.

  second_impl_unavailable_correct: true
  second_impl_unavailable_note: >-
    Selection attempts are recorded in analysis/second_implementation_selection.md
    and RUN-MLKEM-013 raw.json with mechanism-criterion rejections. CTRL-MECHANISM-
    MATCHED-SECOND-IMPL pass_condition explicitly allows second_impl_unavailable
    after exhausting preference order. Isolation is correctly not claimed.

