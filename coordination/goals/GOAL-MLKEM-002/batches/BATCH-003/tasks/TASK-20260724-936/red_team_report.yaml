  outcome_classification_verdict:
    executor_class: second_impl_unavailable
    correct_class_under_frozen_precedence: synthetic_control_inadequate
    isolated_to_audited_commits_should_stand: false
    generator_hardening_insufficient_should_displace: false
    synthetic_control_inadequate_should_displace: true
    invalid_harness_or_dispatch_should_displace: false
    systemic_incomplete_comparison_should_displace: false
    second_impl_unavailable_should_displace: false
    changes_outcome_class: true
    verdict: revise
    statement: >-
      Executor recorded second_impl_unavailable after grading
      CTRL-TRUE-LIBRARY-PATH-INTERPOSITION as pass. That ordering is only
      reachable if the adequacy control truly passed. Under H-MLKEM-006 and
      the EXP-006 repair objective (replace SO-local tautology with
      interposition onto wolfSSL/PQClean compare symbols actually called by
      substantive probes), the implemented -DINTERPOSE_COMPARE path is a
      probe-local bypass of those symbols, not symbol interposition: under
      INTERPOSE_COMPARE, library_cmp() never calls mlkem_cmp /
      mlkem_cmp_avx2 / mlkem_cmp_neon; compare_wrap.c implements the
      multiplicity gate by construction; attestation hard-codes
      wrap_linked:true and reports comparison_symbol mlkem_cmp_avx2 while
      that symbol is not invoked; per-symbol wrap_call_counts are three
      aliases of one counter; attributable_via_library_call_path is hard-
      coded True in the Python scorer. This is OBJ-RT005-001 recurrence in
      a different packaging. Under frozen EXP-006 precedence,
      synthetic_control_inadequate (and H-MLKEM-006's "no true library-path
      exercise" limb) outranks second_impl_unavailable, so the load-bearing
      package class should be synthetic_control_inadequate. Separately, the
      empty strict fixed-bound neighborhood disposition remains honest as a
      GOAL-criterion-2 bookkeeping fact and must not be erased — but it must
      not be the sole outcome token while CTRL pass is asserted. Optional
      widened PQClean measurement must not paraphrase EV-MLKEM-008 /
      H-MLKEM-004 / criterion 2. claim_tier stays
      laboratory_implementation_conformance. Verdict is revise: reject the
      true-library-path / CTRL-pass / OBJ-RT005-001-cured narrative; prefer
      synthetic_control_inadequate as the package class; retain empty-
      neighborhood second_impl_unavailable only as scoped criterion-2
      disposition text, never as evidence that instrument adequacy was
      repaired.

  outcome_class_stands: false
  outcome_class_licensing: >-
    second_impl_unavailable may license only the scoped fact that the strict
    fixed-bound preference order was re-checked empty (GOAL completion
    criterion 2's unavailability limb), when that fact is not paired with a
    false CTRL-TRUE-LIBRARY-PATH-INTERPOSITION pass. It does not license
    isolation, H-MLKEM-004 support, curing OBJ-RT005-001, audited-library
    instrument power, GOAL completion criterion 1's adequacy conjunct, native-
    ISA AVX2 attestation, crypto-scale claims, or any claim_tier above
    laboratory_implementation_conformance. A widened_optimized_compare
    PQClean null remains laboratory continuity only (EV-MLKEM-008 /
    OBJ-RT005-002 / OBJ-RT005-004 inheritance).

  objections:
    - id: OBJ-RT006-001
      attack_line: 1
      title: Call-site INTERPOSE_COMPARE is residual probe-local tautology (OBJ-RT005-001 recurrence)
      status: landed
      severity: critical
      fatal: true
      fatal_to: >-
        Claim that CTRL-TRUE-LIBRARY-PATH-INTERPOSITION repaired OBJ-RT005-001;
        claim that instrument adequacy was decided through wolfSSL/PQClean
        compare/decap entry points; CTRL pass; added_discriminating_power as
        library-facing power; GOAL completion criterion 1 adequacy conjunct
      contest: >-
        Whether -DINTERPOSE_COMPARE + compare_wrap.o is true library-path
        interposition onto symbols actually called by substantive probes, or
        a relocated SO-local multiplicity tautology inside the probe binary.
      evidence_refs:
        - experiments/EXP-MLKEM-006/implementation/conformance_probe.c#library_cmp
        - experiments/EXP-MLKEM-006/implementation/compare_wrap.c
        - experiments/EXP-MLKEM-006/implementation/defective_compare.c
        - experiments/EXP-MLKEM-006/analysis/library_path_interposition_report.json
        - experiments/EXP-MLKEM-006/execution-report.yaml#controls
        - experiments/EXP-MLKEM-006/execution-report.yaml#class_marginal_information
        - ledger/hypotheses/H-MLKEM-006.yaml#falsification_conditions
        - coordination/goals/GOAL-MLKEM-002/batches/BATCH-002/tasks/TASK-20260724-929/red_team_report.yaml#OBJ-RT005-001
      finding: >-
        Under INTERPOSE_COMPARE, conformance_probe library_cmp() returns
        mlkem_interposed_defective_compare(...) and never calls mlkem_cmp /
        mlkem_cmp_avx2 / mlkem_cmp_neon. compare_wrap.c encodes the same
        single-byte-in-R silent / multi-byte-in-R unequal multiplicity gate
        as defective_compare.c / EXP-MLKEM-005. Adequacy grids therefore
        exercise a harness-owned comparator by construction, not the audited
        library comparator. library_G2_minus_G1_excluding_known_defect and
        library_G3_minus_G1_excluding_known_defect remain empty in
        execution-report.yaml — real unmodified-library G2/G3 discriminating
        power is still unshown. The execution-report marginal note still says
        "Synthetic control G2/G3 detections," revealing the repair remains
        synthetic-control-shaped. H-MLKEM-006 falsifies adequacy evidenced
        without exercise of wolfSSL/PQClean symbols used by substantive
        probes; that conjunct is unmet. Packaging moved from
        adequacy_probe/dlopen to a compile-time probe bypass; the tautology
        shape recurs. Fatal to CTRL pass and OBJ-RT005-001-cured claims.
      does_not_flip_class: false
      class_implication: >-
        Prefer synthetic_control_inadequate under frozen precedence (outranks
        second_impl_unavailable). Empty strict-neighborhood disposition may
        remain as scoped criterion-2 text only.

    - id: OBJ-RT006-002
      attack_line: 2
      title: Equivalent call-site wrapper not honestly attested; --wrap never used on substantive probes
      status: landed
      severity: critical
      fatal: true
      fatal_to: >-
        Attestation that library_call_path_exercised / wrap_linked evidence
        shows wolfSSL symbol interposition; claim that frozen-spec equivalent
        call-site wrapper was demonstrated on library symbols
      contest: >-
        Whether call_site_wrapper_INTERPOSE_COMPARE is attested as equivalent
        to link-time --wrap of mlkem_cmp* (or PQClean verify), with
        library_call_path_exercised derived from wrap/call evidence rather
        than hard-coded true.
      evidence_refs:
        - experiments/EXP-MLKEM-006/implementation/conformance_probe.c#mode_wrap_attest
        - experiments/EXP-MLKEM-006/implementation/compare_wrap.c
        - experiments/EXP-MLKEM-006/implementation/build_matrix.sh
        - experiments/EXP-MLKEM-006/implementation/library_path_interposition.py
        - experiments/EXP-MLKEM-006/analysis/library_path_interposition_report.json
        - experiments/EXP-MLKEM-006/specification.yaml#true_library_path_adequacy_control
        - experiments/EXP-MLKEM-006/implementation/decap_boundary_probe.c
        - experiments/EXP-MLKEM-006/implementation/pqclean_probe.c
      finding: >-
        wrap_link_flags is empty []; method is call_site_wrapper_INTERPOSE_COMPARE,
        not ld --wrap. mode_wrap_attest hard-codes "wrap_linked": true and
        emits comparison_symbol mlkem_cmp_avx2 while INTERPOSE_COMPARE never
        invokes that symbol. mlkem_wrap_call_count_mlkem_cmp /
        _avx2 / _neon all read the same atomic g_interpose_calls, so the
        reported wrap_call_counts {4,4,4} are not per-symbol library hits.
        library_call_path_exercised is true when that shared counter is
        nonzero — evidence only that the interposed function ran.
        library_path_interposition.py hard-codes
        attributable_via_library_call_path: True on every marginal row and
        sets library_call_path: True before attestation merge. Docstring of
        that module still claims compare_wrap.o is linked "ahead of
        libwolfssl.a so mlkem_cmp* calls hit the interposed comparator,"
        which the INTERPOSE_COMPARE build does not do. decap_boundary_probe.c
        has no INTERPOSE_COMPARE path; pqclean_probe.c never wraps verify.
        Frozen attestation required wrap/call evidence derived, not hard-
        coded; that requirement is unmet on a substantive reading.
      does_not_flip_class: false
      class_implication: >-
        Supports synthetic_control_inadequate / invalid attestation of the
        library-path conjunct; does not invent a systemic hit.

    - id: OBJ-RT006-003
      attack_line: 3
      title: second_impl_unavailable / widened peer must not paraphrase H-MLKEM-004 or EV-MLKEM-008
      status: landed
      severity: critical
      fatal: true
      fatal_to: >-
        GOAL-MLKEM-002 completion_criteria[1] satisfied-via-widened-null;
        H-MLKEM-004 support; any paraphrase of EV-MLKEM-008 or EXP-006
        widened PQClean null as fixed-bound-tail isolation
      contest: >-
        Whether EXP-006's empty-neighborhood second_impl_unavailable plus
        optional widened PQClean measurement can be read as answering
        H-MLKEM-004 / GOAL criterion 2's fixed-bound peer question beyond
        explicit unavailability, or as elevating EV-MLKEM-008.
      evidence_refs:
        - ledger/goals/GOAL-MLKEM-002.yaml#completion_criteria
        - ledger/hypotheses/H-MLKEM-004.yaml
        - ledger/hypotheses/H-MLKEM-006.yaml#interpretation_limits
        - ledger/evidence/EV-MLKEM-008.yaml
        - experiments/EXP-MLKEM-006/analysis/second_implementation_selection.md
        - experiments/EXP-MLKEM-006/execution-report.yaml#protocol_deviations
        - experiments/EXP-MLKEM-006/specification.yaml#invalidation_rules
        - experiments/EXP-MLKEM-006/source-lock.yaml
      finding: >-
        Package text largely discloses the correct split: strict order empty
        => goal_criterion_2_disposition=second_impl_unavailable; PQClean
        under widened_optimized_compare is laboratory continuity only; do not
        paraphrase as H-MLKEM-004 / criterion 2. That honesty must be
        preserved. Overclaim surface remains: (a) citing the widened peer
        null as cross-impl isolation; (b) treating EV-MLKEM-008's
        isolated_to_audited_commits under widened_optimized_compare as
        H-MLKEM-004 support; (c) reading second_impl_unavailable as if a
        fixed-bound peer had been measured. PQClean avx2 verify remains
        length-parameterized SIMD (same mechanism class EV-MLKEM-007/008
        rejected under strict_fixed_bound). Fatal to those paraphrases;
        nonfatal to recording empty-neighborhood unavailability as the
        criterion-2 disposition when scoped.
      does_not_flip_class: true
      class_implication: >-
        Criterion-2 unavailability limb may stand as scoped bookkeeping;
        does not license isolation or H-MLKEM-004.

    - id: OBJ-RT006-004
      attack_line: 4
      title: Outcome class mis-licensed — synthetic_control_inadequate should outrank second_impl_unavailable
      status: landed
      severity: critical
      fatal: true
      fatal_to: >-
        Retaining second_impl_unavailable as the unique package outcome while
        asserting CTRL-TRUE-LIBRARY-PATH-INTERPOSITION pass; any claim that
        frozen precedence uniquely selects second_impl_unavailable given the
        recorded interposition mechanism
      contest: >-
        Whether executor outcome second_impl_unavailable is the unique class
        under EXP-MLKEM-006 frozen precedence given the actual interposition
        artifacts.
      evidence_refs:
        - experiments/EXP-MLKEM-006/specification.yaml#outcome_classification.precedence
        - experiments/EXP-MLKEM-006/specification.yaml#outcome_classification.synthetic_control_inadequate
        - experiments/EXP-MLKEM-006/implementation/run_experiment.py
        - experiments/EXP-MLKEM-006/execution-report.yaml#outcome_classification
        - ledger/hypotheses/H-MLKEM-006.yaml#distinguishable_outcomes
      finding: >-
        Frozen precedence places synthetic_control_inadequate above
        second_impl_unavailable. The EXP-006 synthetic_control_inadequate
        text names SO-local adequacy_probe/dlopen as the OBJ-RT005-001
        recurrence exemplar; the implemented call-site bypass is that
        recurrence under a different packaging and matches H-MLKEM-006's
        distinguishable outcome "adequacy is only SO-local (no true library-
        path exercise)." Executor classification short-circuits on
        adequacy.get("pass") from the probe-local scorer, then emits
        second_impl_unavailable because second_unavail is true — never
        reaching isolated_to_audited_commits. That is preferable to EXP-005's
        isolation overclaim for criterion 2, but it incorrectly assumes the
        adequacy control passed. Correct class under a reading that privileges
        the repair objective and H-MLKEM-006 falsification is
        synthetic_control_inadequate. Coordinator may still record strict-
        neighborhood emptiness as criterion-2 disposition alongside that
        class; the tokens must not be collapsed into a single success narrative.
      does_not_flip_class: false
      class_implication: >-
        Package outcome should revise to synthetic_control_inadequate;
        second_impl_unavailable retained only as scoped GOAL-criterion-2
        disposition, not as the adequacy-passing gate result.

    - id: OBJ-RT006-005
      attack_line: 5
      title: No path to upgrade claim_tier beyond laboratory_implementation_conformance
      status: landed_as_defeat_of_upgrade
      severity: high
      fatal: true
      fatal_to: >-
        Any upgrade of claim_tier above laboratory_implementation_conformance;
        crypto-scale, MLWE, attack, oracle, or disclosure-ready claims
      contest: >-
        Whether any artifact path upgrades claim_tier beyond laboratory
        implementation conformance.
      evidence_refs:
        - experiments/EXP-MLKEM-006/specification.yaml#claim_tier
        - experiments/EXP-MLKEM-006/execution-report.yaml#anchor
        - ledger/hypotheses/H-MLKEM-006.yaml#interpretation_limits
        - docs/claims-and-verification.md
      finding: >-
        No path exists. Anchor remains weak
        (wolfSSL_postfix_scalar_self_consistency_encap_decap;
        file_actually_validated_against
        none_nist_file_validation_failed_or_incomplete). Observations are
        finite-generator laboratory conformance facts. H-MLKEM-006 forbids
        timing/power/EM/cache/fault claims, MLWE hardness claims, and crypto-
        scale generalization. Certificate-bearing cryptanalytic advantage is
        absent. Any attempt to raise claim_tier is defeated.
      does_not_flip_class: true

    - id: OBJ-RT006-006
      attack_line: 6
      title: Residual coverage and documentation weaknesses qualify nulls but do not invent systemic hits
      status: landed_with_scope
      severity: medium
      fatal: false
      fatal_to: null
      contest: >-
        Whether API G2G3_spot coverage, docker amd64-on-arm64 AVX2, stale
        implementation.md dlopen language, or failed-attempt archives undermine
        the package beyond the interposition objections.
      evidence_refs:
        - experiments/EXP-MLKEM-006/runs/RUN-MLKEM-023/raw.json
        - experiments/EXP-MLKEM-006/execution-report.yaml#protocol_deviations
        - experiments/EXP-MLKEM-006/implementation.md
        - experiments/EXP-MLKEM-006/analysis/failed_attempts/attempt1-no-wrap-probes/
        - coordination/goals/GOAL-MLKEM-002/batches/BATCH-002/tasks/TASK-20260724-929/red_team_report.yaml#OBJ-RT005-006
      finding: >-
        Decap-boundary grids still use G2G3_spot rather than primitive-
        equivalent multi-byte/alignment mutations on clean backends (recurrence
        of OBJ-RT005-006). AVX2 probes remain docker linux/amd64-on-arm64 —
        qualifies native-ISA attestation only. implementation.md still
        describes adequacy via dlopen of defective_compare, which contradicts
        the INTERPOSE_COMPARE path actually load-bearing in the report —
        documentation honesty gap. attempt1-no-wrap-probes archived
        no_wrapped_conformance_probe_built before the call-site repair; honest
        infra accounting, not mathematical evidence. Nonfatal; does not invent
        systemic incomplete comparison.
      does_not_flip_class: true

  defeated_objections:
    - id: OBJ-RT006-003-subclaim-criterion2-unavailability-forbidden
      summary: >-
        Subclaim that recording empty-neighborhood second_impl_unavailable as
        GOAL-criterion-2 disposition is itself forbidden is defeated; the
        freeze and selection report authorize that disposition when strict
        order is empty. What is forbidden is pairing it with a false CTRL pass,
        or paraphrasing widened nulls / EV-MLKEM-008 as H-MLKEM-004 support.
    - id: OBJ-RT006-005-subclaim-tier_upgrade_possible
      summary: >-
        Any path to claim_tier above laboratory_implementation_conformance is
        defeated.
    - id: OBJ-RT006-006-subclaim-docker-flips-to-invalid
      summary: >-
        Docker amd64-on-arm64 alone does not force invalid_harness_or_dispatch
        when disclosed; it qualifies native-ISA claims only.

  fatal_objections:
    - OBJ-RT006-001
    - OBJ-RT006-002
    - OBJ-RT006-003
    - OBJ-RT006-004
    - OBJ-RT006-005
  nonfatal_objections:
    - OBJ-RT006-006

  required_controls:
    - id: CTRL-RT006-TRUE-SYMBOL-INTERPOSITION
      method: >-
        Interpose the defective comparator onto the actual wolfSSL
        mlkem_cmp / mlkem_cmp_avx2 / mlkem_cmp_neon (and PQClean verify if
        claimed) symbols invoked by substantive probes — link-time --wrap
        with __real_* fallback, or a call-site wrapper that still calls the
        real library symbol for non-control behavior — and show G1-silent /
        G2-or-G3-visible detection where library_call_path_exercised is
        derived from symbol-level evidence (nm/objdump wrap map, distinct
        per-symbol counters, or runtime resolution), never hard-coded true.
        Alternatively explicitly accept that instrument adequacy remains
        probe-local / harness-owned and fail CTRL-TRUE-LIBRARY-PATH-
        INTERPOSITION.
      pass_condition: >-
        Non-empty marginals attributable to the control observed through a
        path that demonstrably enters the library compare symbol (or an
        attested wrap of that symbol), with wrap_linked / library_call_path_
        exercised not hard-coded; decap_boundary_probe path included if
        API-level adequacy is claimed.
    - id: CTRL-RT006-OUTCOME-PRECEDENCE-HONESTY
      method: >-
        If true library-path exercise is absent, emit
        synthetic_control_inadequate (or invalid_harness_or_dispatch if
        attestation cannot be formed). Record empty strict-neighborhood
        second_impl_unavailable only as GOAL-criterion-2 disposition text,
        not as the unique package class while CTRL pass is asserted.
      pass_condition: >-
        Coordinator EV/DEC binds package class and criterion-2 disposition
        separately; CTRL pass is false unless CTRL-RT006-TRUE-SYMBOL-
        INTERPOSITION passes.
    - id: CTRL-RT006-GOAL-CRITERION-2-HONESTY
      method: >-
        Keep second_impl_unavailable / explicit infrastructure unavailability
        as the load-bearing cross-impl outcome for the fixed-bound
        neighborhood; never cite widened_optimized_compare nulls or
        EV-MLKEM-008 as H-MLKEM-004 support or as satisfying GOAL completion
        criterion 2 beyond the unavailability limb.
      pass_condition: >-
        Decision text refuses fixed-bound paraphrase; widened peer labeled
        laboratory continuity only.
    - id: CTRL-RT006-FULL-API-G2G3
      method: >-
        Replace decap G2G3_spot with primitive-equivalent multi-byte/
        alignment mutations, or label API coverage partial.
      pass_condition: >-
        Decap-boundary tables for post-fix and peer backends exercise
        coordinated multi-byte/alignment mutations or are marked
        not_measured / partial.

  counterexample_or_mutation: >-
    Cheapest discriminating mutation: build the wrapped probe with
    INTERPOSE_COMPARE undefined but link --wrap=mlkem_cmp_avx2 to an object
    that logs entry then calls __real_mlkem_cmp_avx2, and separately build the
    current INTERPOSE_COMPARE probe. If nm/objdump shows the current probe
    never references mlkem_cmp_avx2 while wrap-attest still claims
    comparison_symbol=mlkem_cmp_avx2 and library_call_path_exercised=true,
    the "true library-path" attestation is exposed as label inflation.
    Separately, any Coordinator synthesis that treats CTRL-TRUE-LIBRARY-PATH-
    INTERPOSITION pass as curing OBJ-RT005-001, or that cites the widened
    PQClean null / EV-MLKEM-008 as H-MLKEM-004 support, is an immediate
    overclaim counterexample against EXP-006 invalidation rules.

  baseline_comparison: >-
    Closest baseline is EXP-MLKEM-005 / EV-MLKEM-008 / RT-20260724-004:
    SO-local dlopen adequacy tautology, widened PQClean peer,
    isolated_to_audited_commits under criterion_used=widened_optimized_compare,
    fatal OBJ-RT005-001/002/004/005. EXP-MLKEM-006 relocates the tautology
    into conformance_probe via -DINTERPOSE_COMPARE, correctly prefers
    second_impl_unavailable over isolation for the empty strict neighborhood,
    and largely discloses widened-peer non-licensing — but still asserts CTRL
    pass and true-library-path language. Relative to H-MLKEM-004 / GOAL
    criterion 2: unavailability limb is recordable; isolation limb unmet.
    Relative to GOAL criterion 1: instrument-adequacy conjunct remains unmet.
    claim_tier unchanged (laboratory).

  narrowest_supported_statement: >-
    Under the committed EXP-MLKEM-006 artifacts: (1) a probe-local defective
    comparator linked via -DINTERPOSE_COMPARE is G1-silent on R and
    G2/G3-visible by its own multiplicity-gate construction when called from
    conformance_probe library_cmp — this does not demonstrate interposition
    onto wolfSSL/PQClean library compare symbols; (2) the known wolfSSL
    v5.9.1 AVX2 omission (and known NEON class where present) remains
    detectable with decap accepts on unmodified library builds; (3) no new
    reproducible silent index or equal-length decap accept was observed on
    wolfSSL post-fix backends or the optional PQClean avx2 widened peer
    under the grids actually executed (API coverage still partly G2G3_spot);
    (4) strict fixed-bound neighborhood re-checked empty — GOAL criterion 2's
    unavailability limb may be recorded, and must not be paraphrased as
    fixed-bound isolation or H-MLKEM-004 support; (5) EV-MLKEM-008 remains
    scoped to widened_optimized_compare with SO-local adequacy and must not
    be cited as H-MLKEM-004 support; (6) preferred package class under
    H-MLKEM-006 / repair intent is synthetic_control_inadequate, not
    second_impl_unavailable-as-adequacy-pass and not
    isolated_to_audited_commits; (7) claim_tier stays
    laboratory_implementation_conformance. Anchor remains weak. AVX2
    observations are docker amd64-on-arm64.

  knowledge_promotion:
    warranted: false
    reason: >-
      Objections are scoped licensing and instrument-adequacy qualifications
      that drive the next Coordinator decision, not a reusable corpus finding
      beyond existing KN-TECH-030 / KN-FIND-001 and RT-20260724-004. No new
      positive technique or durable negative result should be promoted until
      the Coordinator binds the probe-local vs library-symbol gap and the
      corrected outcome class in an evidence/decision record.

  next_concrete_action: >-
    Coordinator should revise package outcome toward
    synthetic_control_inadequate (or explicitly fail CTRL-TRUE-LIBRARY-PATH-
    INTERPOSITION); retain strict-neighborhood emptiness only as scoped
    GOAL-criterion-2 disposition; refuse H-MLKEM-004 support and refuse
    paraphrasing EV-MLKEM-008 / widened nulls as criterion 2 beyond
    unavailability; record OBJ-RT006-001/002 as standing (OBJ-RT005-001
    recurrence); keep claim_tier at laboratory_implementation_conformance;
    do not promote knowledge. Next decisive work is true symbol-level
    interposition (--wrap or call-site that still enters library symbols)
    with non-hard-coded attestation, or an explicit goal rewrite that retires
    the library-path adequacy conjunct / fixed-bound neighborhood requirement.

  artifact_paths:
