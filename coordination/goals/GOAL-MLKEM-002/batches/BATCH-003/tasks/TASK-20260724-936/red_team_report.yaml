red_team_report:
  id: RT-20260724-005
  task_id: TASK-20260724-936
  goal_id: GOAL-MLKEM-002
  batch_id: BATCH-003
  role: red-team
  official_state_change: none
  claim_under_review: >-
    EXP-MLKEM-006 outcome_classification second_impl_unavailable with
    CTRL-TRUE-LIBRARY-PATH-INTERPOSITION reported pass via call-site wrapper
    (-DINTERPOSE_COMPARE); strict fixed-bound neighborhood empty; optional
    widened_optimized_compare PQClean peer measured for laboratory continuity;
    known wolfSSL defect retained; no new silent/accept outside known class;
    claim_tier laboratory_implementation_conformance.

  inference:
    requested_policy: review-xhigh
    resolved_model: cursor-grok-4.5-high-fast
    fallback_used: true
    independent_session: true
    adapter_note: >-
      Independent session from Executor (TASK-20260724-933) and any Validator
      session for this package. review-xhigh cannot be resolved on this harness;
      fallback to cursor-grok-4.5-high-fast recorded explicitly per
      inference-amendment-TASK-20260724-936.yaml.

  snapshot_basis:
    status: coordinator_declared_verified_snapshot
    handoff_input: >-
      Verified snapshot commit 658f9e530ac27ab56092501138ce53409c8efb28
      (TASK-20260724-934)
    branch_confirmed: cursor/explore-ml-kem-cryptanalysis-a197
    package_gate: experiments/EXP-MLKEM-006/execution-report.yaml exists
    implementation_commit_cited: 40939c22b544bd850fd266eecca18ba7d848d600
    archive_commit_observed: >-
      658f9e53 research: archive TASK-20260724-934 EXP-MLKEM-006
      RUN-MLKEM-021..024 run package
    review_policy: >-
      Review used only committed EXP-MLKEM-006 package paths, plus
      H-MLKEM-006, EV-MLKEM-008, GOAL-MLKEM-002, H-MLKEM-004 context via
      EV-MLKEM-008 boundaries, and the BATCH-003 archive receipt. No
      experiment, ledger, or dispatch artifacts were modified. No git commit
