design_report:
  task_id: TASK-20260724-931
  status: completed
  batch_id: BATCH-003
  goal_id: GOAL-MLKEM-002
  hypothesis_id: H-MLKEM-006
  experiment_id: EXP-MLKEM-006
  selection_decision: DEC-20260724-017
  evidence_ref: [EV-MLKEM-008, EV-MLKEM-007, EV-MLKEM-005]
  knowledge_ref: [KN-TECH-030, KN-FIND-001]
  choice:
    option: 1
    label: true_library_path_interposition
    rejected_option: 2
    rejected_label: rewrite_goal_completion_criterion_2
  rationale: >-
    Prefer option (1) because a real interposition approach is feasible within
    the remaining campaign budget without modifying wolfSSL/PQClean source.
    EXP-MLKEM-005 probes already declare and call the library compare symbols
    mlkem_cmp / mlkem_cmp_avx2 / mlkem_cmp_neon (and PQClean verify via
    pqclean_probe). OBJ-RT005-001 / CTRL-RT005-TRUE-LIBRARY-PATH-INTERPOSITION
    explicitly admit symbol interposition or a wrapper at the library call site.
    Link-time wrap (-Wl,--wrap=mlkem_cmp and backend variants) or an equivalent
    call-site wrapper can route those symbols through the existing defective
    comparator object during the adequacy stage, with wrap/call-count attestation
    replacing the hard-coded library_call_path_exercised=true of EXP-005.
    Option (2) (retiring GOAL completion criterion 2) remains available if
    interposition proves unreachable as infrastructure, but amending the goal
    before attempting the red-team-required control would prematurely abandon
    the stronger adequacy claim. EV-MLKEM-008 stays scoped to
    criterion_used=widened_optimized_compare with SO-local adequacy and must
    not be paraphrased as H-MLKEM-004 support or as satisfying GOAL completion
    criterion 2.
  summary: >-
    Specified H-MLKEM-006 and froze approved EXP-MLKEM-006: true library-path
    interposition of the defective comparator onto probe-linked wolfSSL/PQClean
    compare entry points, re-check of the strict fixed-bound peer order with
    honest second_impl_unavailable if empty, and explicit bans on H-MLKEM-004 /
    GOAL-criterion-2 paraphrase of widened nulls.
  repair_map:
    - defect: OBJ-RT005-001 SO-local adequacy tautology
      protocol_element: >-
        CTRL-TRUE-LIBRARY-PATH-INTERPOSITION via link-time wrap / call-site
        wrapper on mlkem_cmp* (and PQClean verify if built); adequacy scored
        only from substantive probe observations; attestation from wrap evidence.
    - defect: OBJ-RT005-002 / GOAL criterion 2 honesty
      protocol_element: >-
        Re-check strict fixed-bound preference order; measure peer if reachable;
        otherwise record second_impl_unavailable as load-bearing cross-impl
        outcome; forbid citing widened isolation as criterion 2 or H-MLKEM-004.
    - defect: OBJ-RT005-004 widened peer mechanism mismatch
      protocol_element: >-
        Widened PQClean measurement, if performed for laboratory continuity,
        remains labeled criterion_used=widened_optimized_compare and cannot
        license fixed-bound-tail isolation.
    - defect: OBJ-RT005-005 claim tier
      protocol_element: claim_tier capped at laboratory_implementation_conformance.
  design_choices:
    - >-
      Adequacy region R remains the final 32 bytes of ML-KEM-1024 (1536..1567)
      so the control occupies the same indices as the known wolfSSL omission
      without being the same defect; detection-retention uses unmodified builds.
    - >-
      Standalone adequacy_probe/dlopen may exist as a non-load-bearing diagnostic
      but MUST NOT be the sole evidence for CTRL-TRUE-LIBRARY-PATH-INTERPOSITION.
    - >-
      Ledger decision ID reserved as DEC-20260724-018 (avoid DEC-016 / P13 collision).
    - >-
      Planned runs are RUN-MLKEM-021..024.
    - >-
      Task IDs start at TASK-20260724-931 (after BATCH-002 max 930).
  feasibility_checks_by_coordinator:
    - check: Probe symbols are the real library compare entry points
      method: >-
        Inspection of experiments/EXP-MLKEM-005/implementation/conformance_probe.c
        extern mlkem_cmp / mlkem_cmp_avx2 / mlkem_cmp_neon and dispatch.
      result: >-
        Feasible wrap targets exist; probes already link attested libwolfssl.a
        and call those symbols for primitive compare.
    - check: Red-team admitted methods
      method: CTRL-RT005-TRUE-LIBRARY-PATH-INTERPOSITION text in TASK-20260724-929
      result: symbol interposition and call-site wrapper are explicitly admitted.
    - check: Fixed-bound neighborhood status
      method: EV-MLKEM-007 / EV-MLKEM-008
      result: >-
        Preferred public neighborhood empty at last check; Executor must re-check
        once; honest unavailability remains an allowed criterion-2 outcome.
    - check: Campaign budget
      method: GOAL-MLKEM-002 campaign_budget
      result: BATCH-003 is within maximum_batches=4; wall-clock budget remains.
  scope_guards:
    - No key recovery, oracle construction, query chaining, or attack-cost estimation.
    - No deployed system, network peer, or third-party key.
    - No timing, power, EM, cache, microarchitectural, or fault measurement.
    - No external vulnerability claim or third-party contact.
    - Nothing bears on MLWE hardness or passive ML-KEM security.
    - claim_tier capped at laboratory_implementation_conformance.
    - Do not paraphrase EV-MLKEM-008 as H-MLKEM-004 support.
  artifact_paths:
    - ledger/hypotheses/H-MLKEM-006.yaml
    - experiments/EXP-MLKEM-006/specification.yaml
    - coordination/goals/GOAL-MLKEM-002/batches/BATCH-003/tasks/TASK-20260724-931/design_report.yaml
  inference:
    requested_policy: coordinator-ultra-code
    resolved_model: cursor-grok-4.5-high-fast
    fallback_used: true
    note: >-
      GPT-5.6 coordinator-ultra-code cannot be resolved on this Cursor runtime;
      recorded fallback_used true.
