    - id: Q-DIRTY-TREE-AT-EXECUTION
      severity: low
      note: >-
        All four run manifests and execution-report record dirty_tree /
        dirty_tree_at_execution true at implementation_commit
        40939c22b544bd850fd266eecca18ba7d848d600. Package content is bound by
        verified snapshot commit 658f9e53; dirty-tree disclosure is honest but
        means working-tree-only edits may have existed at measurement time.

    - id: Q-BUILD-RECEIPT-TMP-PRIMARY
      severity: low
      note: >-
        Build timing and several mechanism-evidence / wrap-probe paths are under
        /tmp/exp-mlkem-006/... . Build timing receipt content is embedded in
        RUN-MLKEM-021/raw.json (total_recorded_wall_seconds=531; independently
        re-summed from 24 events). Second-peer selection excerpts are inlined in
        analysis/second_implementation_selection.md. Wrap attestation body is
        archived in analysis/library_path_interposition_report.json.

    - id: Q-STALE-IMPLEMENTATION-MD-DLOPEN-LANGUAGE
      severity: low
      note: >-
        implementation.md (and the auto-generated blurb in run_experiment.py)
        still describes the control as "injected defective_compare object via
        dlopen". Load-bearing artifacts and execution-report correctly document
        compare_wrap / call_site_wrapper_INTERPOSE_COMPARE. Stale prose only;
        not load-bearing.

    - id: Q-WRAP-CALL-COUNTER-ALIASED
      severity: low
      note: >-
        compare_wrap.c increments a single atomic g_interpose_calls; the three
        mlkem_wrap_call_count_* readers return that same counter, so attestation
        wrap_call_counts of 4/4/4 are aliased, not three distinct symbol wraps.
        library_call_path_exercised still correctly derives from count>0 after
        library_cmp exercises the interposed comparator.

    - id: Q-CALL-SITE-WRAPPER-NOT-LD-WRAP
      severity: informational
      note: >-
        Interposition is the frozen-spec equivalent call-site wrapper
        (probe library_cmp -> mlkem_interposed_defective_compare under
        INTERPOSE_COMPARE), not GNU ld --wrap of wolfSSL mlkem_cmp*. Method is
        honestly named call_site_wrapper_INTERPOSE_COMPARE; Darwin ld constraint
        is disclosed in compare_wrap.c.

    - id: Q-SCORE-FROM-GRID-LIBRARY-CALL-PATH-FIELD
      severity: informational
      note: >-
        score_from_grid() sets the non-load-bearing field library_call_path=true
        and attributable_via_library_call_path=true before attestation is
        applied. The load-bearing library_call_path_exercised flag is overwritten
        from wrap-attest evidence in verify_control(); pass requires attested and
        library_call_path_exercised. No hard-coded true on the exercised field.

    - id: Q-ANCHOR-WEAK-HONEST
      severity: informational
      note: >-
        NIST ACVP files were downloaded (used_for_validation false) and did not
        upgrade the grade. Final anchor
        wolfSSL_postfix_scalar_self_consistency_encap_decap graded weak with
        file_actually_validated_against=
        none_nist_file_validation_failed_or_incomplete. Honest under the frozen
        CTRL-STRONG-ANCHOR rule.

    - id: Q-AVX2-DOCKER-ON-ARM64
      severity: informational
      note: >-
        Protocol deviation discloses AVX2 wolfSSL and PQClean avx2 probes under
        docker linux/amd64 on an arm64 host (Rosetta SIGILL). Observations are
        still attested artifacts in the committed package; this qualifies
        portability of the measurement environment, not hash integrity.

    - id: Q-OUTCOME-IS-SECOND-IMPL-NOT-ISOLATION
      severity: informational
      note: >-
        Terminal class is second_impl_unavailable, not
        isolated_to_audited_commits. Adequacy and positive-control evidence are
        consistent with an isolation story, but frozen precedence correctly
        stops at second_impl_unavailable when the strict fixed-bound peer
        neighborhood is empty. Do not paraphrase the package as H-MLKEM-004
        support or GOAL-MLKEM-002 completion criterion 2.

