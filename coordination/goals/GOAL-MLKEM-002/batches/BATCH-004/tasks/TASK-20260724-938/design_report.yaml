design_report:
  task_id: TASK-20260724-938
  status: completed
  batch_id: BATCH-004
  goal_id: GOAL-MLKEM-002
  hypothesis_id: H-MLKEM-009
  experiment_id: EXP-MLKEM-009
  selection_decision: DEC-20260730-005
  evidence_ref: [EV-MLKEM-009, EV-MLKEM-008, EV-MLKEM-007, EV-MLKEM-005]
  knowledge_ref: [KN-TECH-030, KN-FIND-001]
  choice:
    option: 1
    label: gnu_ld_wrap_linux_amd64
    rejected_option: 2
    rejected_label: rewrite_goal_completion_criteria
  rationale: >-
    Prefer option (1) because Docker linux/amd64 with GNU Binutils ld 2.40 is
    available on this host (verified: `docker run --platform linux/amd64
    debian:bookworm-slim` yields x86_64 and `ld -v` reports GNU ld; a minimal
    `-Wl,--wrap=foo` smoke test succeeds). That is exactly the toolchain DEC-
    20260730-001 / GOAL next_action named for curing OBJ-RT006-001: under EXP-
    MLKEM-006, -DINTERPOSE_COMPARE made library_cmp never call mlkem_cmp*, so
    CTRL pass was a probe-local tautology. True -Wl,--wrap=mlkem_cmp{,_avx2,_neon}
    redirects substantive-probe references to __wrap_mlkem_cmp* while leaving
    library source unmodified and keeping per-symbol counters independent
    (OBJ-RT006-002). Host Darwin/arm64 Apple ld cannot provide GNU --wrap, but
    the campaign explicitly allows linux/amd64 execution via Docker. Option (2)
    (rewrite GOAL completion criteria) remains available only if GNU ld wrap
    proves unreachable as infrastructure within this final batch; amending the
    goal before attempting the named repair would abandon the stronger adequacy
    claim after three batches without that attempt. EV-MLKEM-008/009 must not be
    paraphrased as H-MLKEM-004 support.
  feasibility_checks_by_coordinator:
    - check: linux/amd64 Docker available
      result: >-
        Confirmed 2026-07-30; docker server Architecture aarch64; platform
        linux/amd64 via qemu yields x86_64; GNU ld 2.40 after binutils install.
    - check: GNU ld --wrap smoke test
      result: >-
        Minimal archive+wrap binary returned expected wrapped return code
        (GNU_WRAP_OK on linux/arm64 native and WRAP_TEST_OK path on amd64
        after binutils install).
    - check: Campaign budget
      result: BATCH-004 is the final batch (maximum_batches=4).
  scope_guards:
    - No key recovery, oracle construction, query chaining, or attack-cost estimation.
    - No deployed system, network peer, or third-party key.
    - claim_tier capped at laboratory_implementation_conformance.
    - Do not paraphrase EV-MLKEM-008/009 as H-MLKEM-004 support or GOAL criterion 2.
    - -DINTERPOSE_COMPARE is forbidden as load-bearing CTRL pass evidence.
  design_choices:
    - >-
      Adequacy region R remains the final 32 bytes of ML-KEM-1024 (1536..1567).
    - >-
      Load-bearing wrap builds and probes execute under Docker linux/amd64 with
      explicit wrap_link_flags recorded in build_meta_007.json.
    - >-
      Ledger decision ID reserved as DEC-20260730-006 (DEC-20260730-005 used by
      BATCH-003; origin/main has no DEC-20260730-006).
    - Planned runs are RUN-MLKEM-033..028.
    - Task IDs start at TASK-20260724-938 (after BATCH-003 max 937).
  artifact_paths:
