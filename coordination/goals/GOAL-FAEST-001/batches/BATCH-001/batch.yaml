batch:
  id: BATCH-001
  goal_id: GOAL-FAEST-001
  question_ids: [RQ-FAEST-001]
  authorizing_decisions: [GOAL-FAEST-001 launch]
  objective: >-
    OPEN THE GOAL-FAEST-001 CAMPAIGN. Obtain the Round-3 FAEST specification
    and reference implementation, file them as KN-LIT primary-source entries
    (the RQ-FAEST-001 constraint: no experiment may be designed until the
    relevant primary sources are filed as KN-LIT entries), then run the
    object-first ideation that the goal's next_action requires: name the exact
    soundness or reduction object being attacked (consistency-check error term,
    grinding exponent, QROM extractor loss), never "attack FAEST", and write
    the matched AES baseline cost down before any experiment is designed.
    Proposals only: this batch creates no hypothesis, experiment, or evidence.
  status: ready_for_dispatch
  maximum_wall_clock_seconds: 9900
  max_concurrent: 2
  max_concurrent_note: >-
    Two slots allowed by budget, but the six cards form a strictly serial
    dependency chain (sources -> snapshot -> ideation -> snapshot -> review ->
    ledger), so at most one non-archive task is ever eligible and archives run
    alone. Idle capacity is not a reason to admit another lane.

  campaign_budget_position:
    maximum_batches_before_this_decision: 6
    maximum_batches_after_this_decision: 5
    batches_consumed_before_this_one: 0
    consumed_batch_ids: []
    batches_remaining_after_this_one: 5
    exhausts_extended_campaign_batch_budget: false
