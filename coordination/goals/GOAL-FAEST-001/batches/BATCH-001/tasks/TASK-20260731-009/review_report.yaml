      (commit_sha 0e6befda..., parent_sha eb2a5abb...) exactly.
      (c) Changed paths: `git show --stat` on 0e6befda lists exactly the
      5 declared paths (3 IDEA yamls + ideation_report_expansion.md +
      snapshot-receipt.json); no other path changed. Commit message names
      TASK-20260731-007, TASK-20260731-008 and IDEA-20260731-004..006.
      (d) Per-path SHA-256: recomputed `shasum -a 256` on the working-tree
      files AND `git show <sha>:<path> | shasum -a 256` on the blobs at
      0e6befda for all four source paths; both match the receipt's
      source_path_sha256 byte-for-byte (004: b696355c..., 005: 26945f0a...,
      006: d51fb7b9..., report: 67696e39...).
      (e) The standalone receipt records commit_sha/parent_sha as null with
