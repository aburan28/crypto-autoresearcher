      the dispatch queue's archive entry for TASK-20260731-008. This is the
      same legitimate split of records documented in the prior-batch review
      (TASK-20260731-005 CHECK-1 note) and is not a defect.
      (f) Working tree is clean for all reviewed paths (git status shows no
      modification to the IDEA files or the ideation report; the only
      modified files are dispatch_queue.json / plan.json / plan.md and
      unrelated untracked artifacts from other goals).
    per_idea:
      - idea_id: IDEA-20260731-004
        result: passed
      - idea_id: IDEA-20260731-005
        result: passed
      - idea_id: IDEA-20260731-006
        result: passed

  - id: CHECK-2
    name: schema_completeness_and_object_first_discipline
    result: passed
    method: >-
      Checked every field named in agents/idea-generator.md's required output
      plus the matched_baseline block required by the handoff, against each of
      the three records: id, title, class, claim, mechanism, novelty_status,
      assumptions, predictions (metric + direction + minimum_effect),
      minimal_test (design + controls + required_metrics),
      falsification_conditions, confounders, interpretation_limits,
      heuristic_assumptions (statement + rigorous_support + validation_plan),
      matched_baseline (parameter_set + convention + both baseline sides),
      target_complexity (time_exponent + memory_exponent + best_known +
      hidden_overhead + tradeoff_note), estimated_cost, recommended_priority.
    per_idea:
      - idea_id: IDEA-20260731-004
        result: passed
        findings:
          - id: C2-004-F1
            severity: ok
            statement: >-
              All required fields present. Exact attack object named: the
              QROM Fiat-Shamir extractor loss term L_QROM(tau, kappa, q,
              digest, |C|, eps_cc) as instantiated on FAEST's tau-round
              VOLEitH commit-and-open sigma protocol, and the charged QROM
              forgery bound it yields. Never "attack FAEST". Minimal test
              has design + controls + required_metrics; controls include
              unstructured (generic QROM FS loss shape), null-object (random
              challenge function), and scale/decay (q-growth, |C|-decay).
      - idea_id: IDEA-20260731-005
        result: passed
        findings:
          - id: C2-005-F1
            severity: ok
            statement: >-
              All required fields present. Exact attack object named: the
              polynomial system S = (C, F, V) — deployed AES ZK constraint
              family, deployed field, witness variables incl. key/state/
              S-box auxiliaries — augmented with the partial-assignment set
              I_open (positions a transcript's VOLE openings reveal), and the
              concrete cost of the best algebraic solve of S union I_open.
              Never "attack FAEST". Minimal test has design + controls +
              required_metrics; controls include unstructured (random
              degree-3 system vs semi-regular prediction), null-object
              (random-permutation-shaped S-box with the same degree-3
              decomposition shape), and scale (per-S-box cost growth).
      - idea_id: IDEA-20260731-006
        result: passed
        findings:
          - id: C2-006-F1
            severity: ok
            statement: >-
              All required fields present. Exact attack objects named: (1)
              the faest_em_* Even-Mansour one-way function f(k1,k2) =
              EM_{k1,k2}(x) at its deployed definition (widths, key split,
              P, fixed inputs), and (2) the AES-based public permutation P.
              Never "attack FAEST". Minimal test has design + controls +
              required_metrics; controls include unstructured (generic EM
              with random P must saturate T*D = 2^n), null-object
              (EM-with-random-P), and scale/decay (2^n growth in n;
              AES-vs-random ratio must not shrink with n).

  - id: CHECK-3
    name: matched_baseline_correctness
    result: passed
    method: >-
      Compared each idea's stated baseline against the archived knowledge
      records and the RSF-1..5 scope fixes from DEC-20260731-020. Verified
      the AES-128 comparator (2^126.1 biclique, KN-LIT-2701), the quantum
      baselines (Grover 2^64 KN-LIT-679; 2^85.8 / 2^143 labeled UNVERIFIED
      in-repo), the EM toolkit (T*D = 2^n slidex and the D = 2^{n/2}
      memoryless variant, KN-LIT-4930; q_E*q_P^2 ~ 2^n, KN-LIT-5810), and
      the QROM-FS corpus (KN-LIT-6524/969/7137/6386). Cost convention is
      identical in all three records and on both sides of every comparison:
      serial classical cost in AES-128-equivalent evaluations, memory in
      bits charged separately, data charged, quantum stated separately under
      MAXDEPTH.
    per_idea:
      - idea_id: IDEA-20260731-004
        result: passed
        findings:
          - id: C3-004-F1
            severity: ok
            statement: >-
              The matched comparison is correctly the quantum AES baseline
              (Grover 2^64 archived; 2^85.8 / 2^143 explicitly labeled
              UNVERIFIED in-repo) because the adversary in this lane is a
              QROM/quantum adversary; the classical 2^126.1 is recorded for
              completeness. RSF-1 one-pair caveat carried verbatim in the
              aes_key_recovery block (biclique published at ~2^88 chosen
              plaintexts; comparative lower bound on the one-pair cost).
              The VOLEitH/FS baseline is honestly stated as exactly the
              object the idea reconstructs, with the unfiled 2026
              retightening named as the hard dependency.
          - id: C3-004-F2
            severity: nonfatal_precision_issue
            statement: >-
              The secondary comparison "charged bound >= matched quantum AES
              baseline" is nearly content-free: any charged bound below 2^128
              already breaks the claimed category, and any bound at or above
              2^128 satisfies both inequalities. Grover 2^64 (and charged
              ~2^85.8) sit far below the category, so the dual framing can
              mislead a reader into treating a bound in [2^86, 2^128] as a
              "confirmation" of the second clause. The sole falsification
              threshold must remain the claimed category; keep the quantum-AES
              comparison as an informational consistency anchor only (see
              OBJ-4-2).
          - id: C3-004-F3
            severity: nonfatal_revision_item
            statement: >-
              The extractor-loss function lists kappa in its signature, but
              no quantum charging model for the grinding term is stated: a
              quantum forger who must produce a challenge digest with kappa
              leading zeros can search the salt with Grover at ~2^{kappa/2}
              hash queries (depth-limited under MAXDEPTH), versus 2^kappa in
              the classical model. The 2^{kappa/2} discrepancy can exceed the
              slack being probed and must be a named re-derivation item in
              component (1), not implicit in "the q-sweep" (see OBJ-4-1).
      - idea_id: IDEA-20260731-005
        result: passed
        findings:
          - id: C3-005-F1
            severity: ok
            statement: >-
              Matched baseline 2^126.1 (KN-LIT-2701) stated correctly with the
              RSF-1 caveat carried. The algebraic-attack baseline is handled
              honestly: KN-LIT-2288's zero-dimensional AES-128 key-recovery
              ideal (single-pair — matching the OWF game) with security
              implications explicitly left open, and no published full-AES
              algebraic attack below 2^126.1 known to the program, scoped to
              the in-repo grep and labeled UNVERIFIED beyond that scope.
              The witness-recovery object is compared against the OWF-inversion
              baseline, which is the correct mapping (recover key => sign
              honestly => forge).
          - id: C3-005-F2
            severity: nonfatal_precision_issue
            statement: >-
              The confirmation side of prediction P1 is near-vacuous: for any
              sane degree-3 system at the deployed size (n in the thousands),
              the binomial accounting C(n + d_reg, d_reg) at d_reg >= 3
              yields an exponent far above 126.1, so "extrapolated cost >=
              126.1" is expected to hold for almost any system and a
              "confirmation" is low-value evidence about FAEST specifically.
              The non-vacuous content is the falsification direction
              (per-S-box flatness, opening leverage, or a d_reg that does not
              grow). The record should state the confirmation side's low
              epistemic value so the barrier wording cannot be read as strong
              support (see OBJ-5-1).
      - idea_id: IDEA-20260731-006
        result: passed
        findings:
          - id: C3-006-F1
            severity: ok
            statement: >-
              EM toolkit correctly cited against the archives: slidex
              T = Omega(2^n / D) and the memoryless variant restricted to
              D = 2^{n/2} (KN-LIT-4930), and q_E * q_P^2 ~ 2^n in the
              classical-E / quantum-P setting (KN-LIT-5810), with the
              garbled-abstract caveat disclosed. The D = 1 operating point of
              the OWF game is correctly identified (T = 2^n MITM with
              negligible memory). Grover ~2^n over the 2^{2n}-bit key space
              with the charged form labeled UNVERIFIED until the definition
              is pinned. Simon/period attacks mapped out of the fixed-x OWF
              game with a defensible argument (period lives in the plaintext
              input; no keyed oracle in the game) and labeled a derivation
              item (H3). RSF-1 caveat carried in adapted form.
          - id: C3-006-F2
            severity: nonfatal_revision_item
            statement: >-
              The claim sentence "the EM variants' claimed category is backed
              by [the EM baseline]" overstates the boundary condition: the
              derived OWF baseline sits exactly at 2^n = 2^128 — zero slack —
              so it supports but does not establish the category; the category
              holds only if the VOLEitH/FS layer and the commitment/QROM terms
              are also tight at the EM instances' own parameter sets. The
              mechanism and interpretation_limits qualify this correctly, but
              the claim field itself should be softened (see OBJ-6-1).
          - id: C3-006-F3
            severity: nonfatal_gating_note
            statement: >-
              IDEA-20260731-019, IDEA-20260731-002..004 are specified at the AES-instance
              parameter sets (faest_128f/s). The EM instances (faest_em_*)
              have their own (kappa, tau, eps_cc, field) parameters
              (UNVERIFIED placeholders), and with zero slack at the OWF
              baseline the layer terms must be re-checked at the EM
              parameter sets, not carried over. The record's
              voleith_fs_soundness block implies carry-over; that assumption
              must be named explicitly (see OBJ-6-3).
      - idea_id: all
        findings:
          - id: C3-ALL-F1
            severity: ok
            statement: >-
              RSF-1 (one-pair caveat), RSF-4-style pinning gates (spec v2.0 /
              pinned faest-ref commit as hard completion gates before any
              run), and RSF-5 (spec v2.0 PDF-text blocker; deployed values
              UNVERIFIED placeholders) are carried in all three records, and
              every unverified number is labeled UNVERIFIED in place. No
              fabricated figure found; the archived citations (2701, 679,
              4930, 5810, 969, 6524, 7137, 6386, 2288, 2396) are not
              mis-stated.

  - id: CHECK-4
    name: novelty_honesty
    result: passed
    method: >-
      Checked distinctness from IDEA-20260731-019, IDEA-20260731-002..003 (read in full) and
      against the prior-art grep documented in the ideation report's
      "Prior-art search performed" section and the knowledge corpus.
    per_idea:
      - idea_id: IDEA-20260731-004
        result: passed
        findings:
          - id: C4-004-F1
            severity: ok
            statement: >-
              Distinct from 001 (per-round consistency-check error eps_cc,
              classical, at the deployed field), 002 (whose
              interpretation_limits explicitly declare the QROM extractor
              question out of scope — "The model does not address the QROM
              extractor question", IDEA-002 lines 188-190), and 003
              (LeafCommit/bAVC hash-mode collision resistance). 004 is the
              QROM transform/reduction loss — a different link (eps_cc can be
              tight and the transform still lossy). novelty_status
              "unverified" is the calibrated verdict: the tightest-known
              bound (the 2026 Renyi-divergence retightening) is unfiled and
              unread, and the record declines to claim adaptation of a bound
              it has not read. No prior FAEST-specific QROM record exists in
              knowledge/ or ledger/ (grep result in the report). No
              breakthrough claimed; interpretation_limits state C1 = "no".
      - idea_id: IDEA-20260731-005
        result: passed
        findings:
          - id: C4-005-F1
            severity: ok
            statement: >-
              Distinct from 001 (pass probability of error vectors — a
              soundness-error quantity) and from 002/003 (different links).
              005 measures solving-degree indicators (d_ff / d_reg, Macaulay
              size) of the whole constraint system as a witness-recovery
              problem with partial openings — different quantity, different
              toolchain (the program's DREG instrumentation, RQ-DREG-001 /
              EXP-DREG-001..004 / EV-DREG-001..004), different dependency
              profile. novelty_status "speculative" is calibrated: the
              technique is established in-repo, the deployed family is unread,
              and whether the degree-3-with-auxiliaries representation under
              partial openings is algebraically weaker than the ANF system is
              genuinely open. The open-direction #2 of the first ideation
              report explicitly deferred this lane; no record targets FAEST's
              constraint family. No breakthrough claimed.
      - idea_id: IDEA-20260731-006
        result: passed
        findings:
          - id: C4-006-F1
            severity: ok
            statement: >-
              Distinct from 001..003, all of which explicitly declare the EM
              variants out of primary scope with the baseline "NOT
              established in-repo"; 006 is exactly the establishment of that
              baseline plus the AES-instantiation shortcut probe. novelty_status
              "adaptation" is calibrated (classic archived EM toolkit applied
              to the pinned faest_em_* definition, with the definition's
              details honestly UNVERIFIED). No record in knowledge/ or
              ledger/ analyzes FAEST's EM OWF instance. No breakthrough
              claimed.
      - idea_id: all
        findings:
          - id: C4-ALL-F1
            severity: ok
            statement: >-
              No idea is sold as a breakthrough. All three are
              verification/barrier lanes; all state C1 = "no" (no exponent
              move); target_complexity time_exponent blocks say "n/a — no
              attack claimed"; interpretation_limits close exactly one named
              link each. The saturation discipline (inventor-protocol section
              1/4) is followed: the report names the remaining open directions
              with named obstructions and forward guidance rather than
              declaring the space mined.
          - id: C4-ALL-F2
            severity: nonfatal_note
            statement: >-
              The "no structural attack published to this program's knowledge"
              hedges are scoped to in-repo greps, not fresh external
              literature searches; the records state this scoping honestly
              ("prior-art grep of knowledge/ and ledger/"). If any novelty
              claim is ever promoted to "no prior art exists", an external
              search is required — the same caveat as the prior batch
              (C5-F4 in TASK-20260731-005).

  - id: CHECK-5
    name: falsifiability_and_control_adequacy
    result: passed
    method: >-
      For each record: checked that every prediction carries metric +
      direction + minimum_effect with a monotone falsification trigger (no
      ambiguous bands); that every falsification_condition carries a
      re-derivation-at-deployed-parameters gate and toy-tier labeling
      (AGENTS.md rule 7, claim_tier_ceiling of RQ-FAEST-001); and that
      controls include unstructured + null-object + scale/decay
      (inventor-protocol section 3).
    per_idea:
      - idea_id: IDEA-20260731-004
        result: passed
        findings:
          - id: C5-004-F1
            severity: ok
            statement: >-
              Predictions: P1 monotone (charged bound - category >= 0; the
              falsification is a bound below the category at a named
              (q, tau)); P2 monotone (doubling q must grow the measured loss
              by >= 1 bit at every (tau, |C|) — the canonical
              parameter-must-move-the-quantity control, with the slope
              agreement window [0.5, 2] as a secondary shape check); P3
              monotone (doubling |C| must shrink the loss by >= 1 bit); P4
              ratio <= 1. Falsification conditions carry the rule-12
              independent-review gate (if the re-derivation contradicts the
              scheme's stated security), the toy-tier label with
              re-derivation-at-deployed-parameters, and the harness-artifact
              branch. Controls: unstructured (generic QROM FS loss shape on a
              plain sigma protocol — harness calibration), null-object
              (random challenge function — the deployed-shaped hash must not
              add loss), scale/decay (q-growth, |C|-decay).
          - id: C5-004-F2
            severity: nonfatal_precision_issue
            statement: >-
              P4's "direction: lower, ratio <= 1" makes the confirmation side
              a half-infinite band: any ratio below 1 (including an
              arbitrarily loose bound) counts as the confirmation outcome, so
              the prediction cannot discriminate a tight bound from a loose
              one — only the > 1 (undercharge) side carries information. This
              is acceptable for a barrier lane ("must not undercharge") but
              should be labeled a one-sided check, and the toy measurement's
              reach is classical-distribution-only: it cannot certify the
              quantum adversary's loss (the record's confounder says this;
              P4's trigger must be phrased as "undercharges on the classical
              distributional component") (see OBJ-4-3).
      - idea_id: IDEA-20260731-005
        result: passed
        findings:
          - id: C5-005-F1
            severity: ok
            statement: >-
              Predictions: P1 monotone (extrapolated full-size solve cost >=
              126.1; falsification < 126.1 with a certified-solve gate at
              reduced parameters); P2 monotone (per-S-box cost ratio >= 1 at
              every tested size — the structural-accumulation control); P3
              monotone (opening-leverage ratio <= 1 vs the binomial baseline
              — the super-linear-leverage control). Falsification conditions
              carry the re-derivation gate, the toy-tier label, the harness-
              artifact branch, and an extra solver-family-neutrality
              condition (F4/F5/XL/BooleanSolve must not flip the qualitative
              verdict). Controls: unstructured (random degree-3 system must
              match the semi-regular prediction — instrumentation
              calibration), null-object (random-permutation-shaped S-box with
              the same degree-3 decomposition — AES-specific structure is the
              signal), scale (per-S-box cost must not decrease).
          - id: C5-005-F2
            severity: nonfatal_precision_issue
            statement: >-
              The per-S-box and extrapolation quantities are only meaningful
              if the toy family is isomorphic to the deployed family in the
              way that matters for d_reg (degree distribution, field,
              variable layout, S-box decomposition). The record names this as
              a confounder and gates on the pinning; the extrapolation
              sensitivity to d_reg +/- 1 is in required_metrics (good). The
              confirmation side's low epistemic value (C3-005-F2) should be
              carried into the barrier wording (see OBJ-5-1).
      - idea_id: IDEA-20260731-006
        result: passed
        findings:
          - id: C5-006-F1
            severity: ok
            statement: >-
              Predictions: P1 monotone (derived inversion cost >= n; the
              falsification < n fires in the derivation before any run if the
              pinned definition is single-block — H1's validation plan
              handles this correctly); P2 monotone-ish with a named threshold
              (AES-P / random-P inversion-cost ratio >= 1/2 at the largest
              toy size); P3 monotone (charged Grover cost >= 128). Falsification
              conditions carry the re-derivation gate and toy-tier labels for
              every structural-shortcut signal, plus the harness-artifact
              branch. Controls: unstructured (generic EM with random P must
              saturate T*D = 2^n exactly — harness calibration), null-object
              (EM-with-random-P), scale/decay (2^n growth when n doubles;
              AES-vs-random ratio must not shrink with n).
          - id: C5-006-F2
            severity: nonfatal_revision_item
            statement: >-
              P2 is a weak discriminator at the tested toy sizes: MITM/slidex
              search cost is structure-insensitive — the number of
              P-evaluations is 2^n for either P — so the ratio is expected to
              be ~1 by construction and can only move via per-evaluation cost
              differences or an entirely non-search algorithm. The informative
              signals for the "low algebraic degree of P" question are the ANF
              degree profile, differential uniformity, and fixed-point counts,
              which the record measures but demotes to supporting metrics.
              Reframe P2 as a null-trend check and promote the structural
              metrics to primary predictions (see OBJ-6-2).
          - id: C5-006-F3
            severity: nonfatal_note
            statement: >-
              P3 (charged Grover >= 128) is near-vacuous: Grover over the
              2^{2n}-bit key space costs ~2^n = 2^128 evaluations by
              construction; the only failure mode is a modeling or
              parameter-error. Fine as a sanity check; the record labels it a
              "parameter-level finding" — keep that label (see OBJ-6-4).
      - idea_id: all
        findings:
          - id: C5-ALL-F1
            severity: nonfatal_note
            statement: >-
              Agreement-window formulations ("direction: different" / slope
              windows) appear in 004's P2 slope check ([0.5, 2]) and 006's
              P2 threshold (1/2). These are defensible measurement framings,
              but per the prior batch's C3-F4 they must be rendered explicitly
              as agreement windows in the future experiment contracts so the
              Executor cannot read a pass as one-sided evidence.

  - id: CHECK-6
    name: pareto_honesty
    result: passed
    method: >-
      Checked the ideation report's Pareto section against inventor-protocol
      section 5 (dominated_by must be checked against every row of the
      frontier; unchecked null is a fabrication; sota_delta must be
      quantitative).
    findings:
      - id: C6-F1
        severity: ok
        statement: >-
          dominated_by is present and is "n/a (no attack claimed)" for all
          three records, with the frontier checked and justified in the
          report: the only "attacks" referenced are the baselines themselves
          (2^126.1 biclique; generic transcript forgery; EM T*D = 2^n class;
          Grover 2^64 / 2^n), which the records compare against rather than
          claim to beat. This is not an unchecked null: the report explicitly
          states the rows on the frontier it considered and why the known
          results are the baselines, not competing claims (including the
          honest note that for IDEA-006 the known EM bounds dominate the
          *derivation* but are the baseline being established).
          inventor-protocol section 5 explicitly accepts "n/a (no result
          claimed)" as a valid answer.
        per_idea:
          - idea_id: IDEA-20260731-004
            result: passed
            statement: >-
              sota_delta is the matched-baseline inequality (charged QROM
              bound vs the claimed category and the quantum AES baseline),
              with the falsification direction stated. No attack claimed, so
              no improvement delta to quantify; the inequality is the honest
              quantitative content. Note: the confirmation deliverable
              (barrier statement) would duplicate the scheme's own claimed
              analysis once the spec is read — the non-dominated content is
              the independent re-derivation with the charged q-sweep and the
              template-fit question, which the record correctly centers.
          - idea_id: IDEA-20260731-005
            result: passed
            statement: >-
              sota_delta is the extrapolated solve-cost vs 2^126.1
              inequality. The claim is a measurement/barrier contribution;
              nothing is claimed to beat the frontier. The report's
              quantitative commitment (the baseline inequality per record)
              is stated.
          - idea_id: IDEA-20260731-006
            result: passed
            statement: >-
              sota_delta is the derived EM inversion cost vs 2^n and the
              claimed category. The known EM results (KN-LIT-4930/5810)
              dominate the derivation itself, and the report says so
              explicitly rather than hiding it; the non-dominated content is
              the instance-specific pinned definition and the AES-P shortcut
              probe. Honest.
      - id: C6-F2
        severity: nonfatal_note
        statement: >-
          The report's sota_delta field ("no attack; conceptual/measurement
          contribution only") is qualitative; the quantitative content lives
          in each record's predictions. For auditability the report could
          name the specific inequality per idea in the sota_delta field
          (e.g., "barrier claim: charged QROM bound >= 2^128 at the deployed
          set under the MAXDEPTH convention; no attack delta claimed"). Minor
          presentation note; no fabrication.

objections:
  fatal: []
  nonfatal:
    - id: OBJ-4-1
      relates_to: [IDEA-20260731-004, CHECK-3]
      severity: nonfatal_revision_item
      title: "Quantum grinding charge is unnamed in the QROM extractor-loss reconstruction"
      statement: >-
        L_QROM lists kappa in its argument list but the record never states
        how a quantum forger's grinding work is charged. The honest prover
        grinds classically (2^kappa salt searches), but a QROM forger who
        must produce a challenge digest with kappa leading zeros can search
        the salt with Grover at ~2^{kappa/2} hash queries, with the depth
        charged under MAXDEPTH. A 2^{kappa/2} term can exceed the slack
        being probed and changes the charged bound; leaving it implicit in
        "the q-sweep" is a hole in the reconstruction spec. This is exactly
        the class of term the 2026 retightening is reported to address, so
        the re-derivation must confront it explicitly.
      required_scope_fix: >-
        Add a named re-derivation item in component (1): the quantum grinding
        charging model (2^kappa vs 2^{kappa/2} via Grover on the salt, with
        MAXDEPTH depth accounting and the per-query AES-equivalent charge),
        decided from the pinned sources' challenge-verification rule.
      falsification_route: >-
        Cheapest: the |C|-decay toy control (P3) at a single toy tau — a
        loss that fails to decay as the challenge min-entropy doubles is a
        harness artifact. For the grinding charge specifically: a
        derivation-level check — recompute the charged bound with the
        grinding term at 2^{kappa/2} vs 2^kappa; if the difference moves the
        bound across the category threshold, the reconstruction is
        convention-sensitive and must be flagged, not silently resolved.
    - id: OBJ-4-2
      relates_to: [IDEA-20260731-004, CHECK-3]
      severity: nonfatal_precision_issue
      title: "Dual-baseline framing makes the quantum-AES comparison nearly content-free"
      statement: >-
        The claim states the charged bound must be >= 2^128 AND >= the
        matched quantum AES baseline. Since the quantum AES baseline (Grover
        2^64; charged ~2^85.8) is far below the category, any bound that
        clears 2^128 clears both, and any bound below 2^128 is already a
        category break. The second clause cannot discriminate anything and
        risks a reader treating a bound in [2^86, 2^128] as a partial
        confirmation.
      required_scope_fix: >-
        State the sole falsification threshold as the claimed category (2^128)
        at the deployed set; demote the quantum-AES baseline comparison to an
        informational consistency anchor in the experiment contract.
      falsification_route: >-
        None needed (framing fix). The decisive check remains the charged
        bound at a named (q, tau) versus 2^128.
    - id: OBJ-4-3
      relates_to: [IDEA-20260731-004, CHECK-5]
      severity: nonfatal_precision_issue
      title: "P4's toy ratio cannot certify the quantum side and has a half-infinite confirmation band"
      statement: >-
        (i) The toy measurement computes Renyi-2 divergences and
        measure-and-reprogram bad-event probabilities of *classical*
        transcript/query distributions; it cannot certify the loss against a
        quantum adversary (the record's confounder says exactly this). P4's
        trigger must therefore be phrased as undercharging on the classical
        distributional component only. (ii) "direction: lower, ratio <= 1"
        makes every ratio below 1 (including an arbitrarily loose bound) a
        confirmation outcome; only the > 1 side carries information. The
        prediction cannot discriminate a tight from a loose bound.
      required_scope_fix: >-
        Relabel P4 as a one-sided "must not undercharge on the classical
        distributional component" check; state explicitly that a ratio far
        below 1 is neutral (a loose bound is not a finding in a barrier
        lane) and that the quantum side of the loss is carried by the
        derivation alone.
      falsification_route: >-
        The > 1 undercharge trigger at any tested toy point, then
        re-derivation at deployed parameters before any claim (already the
        record's FC2).
    - id: OBJ-4-4
      relates_to: [IDEA-20260731-004, CHECK-4]
      severity: nonfatal_gating_note
      title: "The 2026 Renyi-divergence retightening is unfiled and secondary-sourced"
      statement: >-
        The reconstruction's "current tightest bound" input is a reported
        work (RQ-FAEST-001 motivation, secondary reporting), not filed in
        knowledge/ and not read. Its identity, existence, and exact form are
        unverifiable until filed. The record's novelty_status "unverified"
        is the honest consequence; this is a hard dependency for component
        (1), not a defect in the proposal.
      required_scope_fix: >-
        File the retightening as a KN-LIT entry and read it before any
        reconstruction output is reported; if it cannot be obtained, the
        reconstruction must state it uses the best *archived* bound and the
        comparison is against that, with the unread bound recorded as an
        open ingredient.
      falsification_route: >-
        None needed (dependency, not a hypothesis).
    - id: OBJ-5-1
      relates_to: [IDEA-20260731-005, CHECK-3, CHECK-5]
      severity: nonfatal_precision_issue
      title: "The confirmation side of the algebraic barrier is near-vacuous at deployed size"
      statement: >-
        For any reasonable degree-3 system with n in the thousands, the
        binomial accounting C(n + d_reg, d_reg) at d_reg >= 3 gives an
        exponent far above 126.1. "Extrapolated solve cost >= 2^126.1" is
        therefore expected to hold for almost any constraint system, so a
        confirmation is weak evidence about FAEST's deployed family
        specifically. The discriminating content is the falsification
        direction: per-S-box cost flatness (P2), super-linear opening
        leverage (P3), or a d_reg law that does not accumulate hardness.
      required_scope_fix: >-
        In the experiment contract, state the confirmation side's low
        epistemic value explicitly and require the barrier wording ("this
        link is not the source of a forgery cheaper than AES key recovery")
        to be justified by the measured law and its extrapolation, not by
        the sheer size of the binomial.
      falsification_route: >-
        Cheapest: the per-S-box scale control (P2) at the two smallest toy
        sizes (1 -> 2 S-boxes) with the existing DREG instrumentation: a
        per-S-box cost ratio < 1 anywhere is the flatness tell that the
        extrapolated barrier would be unsound.
    - id: OBJ-5-2
      relates_to: [IDEA-20260731-005, CHECK-3]
      severity: nonfatal_revision_item
      title: "I_open modeling must pin who chooses the openings"
      statement: >-
        The record models the openings as "positions a transcript's VOLE
        openings reveal, modeled as fixed variables". But the forger chooses
        the transcript, hence chooses the openings; the fixed-variable model
        conflates (a) leaks from honest transcripts (irrelevant — the key
        holder has no need to attack) with (b) openings the forger is free
        to set. In (b), "fixing" variables is a freedom that can only make
        the solve easier, which is what P3's leverage ratio is designed to
        catch — but the binomial baseline and the set of fixed positions
        must come from the spec's actual opening pattern (which positions,
        how many, challenge-determined vs prover-chosen), not from memory.
      required_scope_fix: >-
        Elevate the I_open pinning (from spec v2.0 + pinned faest-ref commit,
        per the KN-LIT-7619 layout) to a hard completion gate detail of the
        constraint pinning component, mirroring RSF-4 discipline.
      falsification_route: >-
        The opening-leverage ratio (P3) at toy scale with the pinned I_open:
        a ratio > 1 is the super-linear-leverage structural finding.
    - id: OBJ-5-3
      relates_to: [IDEA-20260731-005, CHECK-5]
      severity: nonfatal_precision_issue
      title: "d_reg is size-unstable; the extrapolation ladder must be a hard gate"
      statement: >-
        The degree of regularity is not a size-stable quantity, and the toy
        census (1 S-box, 1-4 toy rounds) is a very different algebraic object
        from the deployed 10-round family. The record's H4 admits "None
        beyond the method itself" as rigorous support — honest, and correct
        as an assumption under test — but the scaled-down-instance ladder in
        H4's validation plan and the d_reg +/- 1 sensitivity (already in
        required_metrics) must be hard completion gates before any
        extrapolated number is reported.
      required_scope_fix: >-
        Make the ladder (full pin -> census -> extrapolation at each toy
        size, plus predicted negative cases) a completion gate of the
        extrapolation component; report the extrapolated exponent's d_reg +/-
        1 sensitivity as a mandatory metric (it is listed; enforce it).
      falsification_route: >-
        The unstructured control (random degree-3 system must match the
        semi-regular d_reg prediction at each toy size): a mismatch
        invalidates the instrumentation before any census result is read.
    - id: OBJ-6-1
      relates_to: [IDEA-20260731-006, CHECK-3]
      severity: nonfatal_revision_item
      title: "Claim wording overstates: the EM baseline sits at the category boundary with zero slack"
      statement: >-
        The claim's "the EM variants' claimed category is backed by [the EM
        baseline]" overstates a knife's-edge condition. The derived OWF
        baseline is exactly 2^n = 2^128 for faest_em_128* — zero slack — so
        it *supports but does not establish* the category: the category holds
        only if the VOLEitH/FS layer (001/002/004 objects) and the
        commitment terms (003) are also tight at the EM instances' parameter
        sets, and if the charged constants (per-P AES-equivalent cost,
        MAXDEPTH accounting) do not push the derived cost below 2^128. The
        mechanism and interpretation_limits qualify this correctly; the
        claim field itself should say "supported at the boundary, pending the
        other links".
      required_scope_fix: >-
        Soften the claim field to "the EM OWF's matched baseline is
        established at >= 2^n, which supports the claimed category only at
        the boundary and only in conjunction with tightness of the
        VOLEitH/FS and commitment links at the EM parameter sets".
      falsification_route: >-
        The definition-pinning derivation (component 1): if the pinned
        definition is single-block with n-bit output, P1 fires immediately
        with zero compute (any-preimage inversion ~1 P-evaluation) — the
        cheapest falsification in the batch.
    - id: OBJ-6-2
      relates_to: [IDEA-20260731-006, CHECK-5]
      severity: nonfatal_revision_item
      title: "P2's inversion-cost ratio is a weak discriminator at the tested toy sizes"
      statement: >-
        MITM/slidex *search* cost is structure-insensitive: the number of
        P-evaluations is 2^n whether P is AES-shaped or random, so the
        AES-vs-random inversion-cost ratio is expected to be ~1 by
        construction and can move only via per-evaluation cost differences
        or a qualitatively non-search algorithm (which at n = 8..32 is
        unlikely to beat 2^n — a Groebner-style solve of the inversion
        system is slower than 2^n search at those sizes). The informative
        signals for the "low algebraic degree of P" question are the ANF
        degree profile, differential uniformity, and fixed-point counts,
        which the record currently demotes to supporting metrics.
      required_scope_fix: >-
        Reframe P2 as a null-trend check (expected ratio ~1 at every size; a
        controlled null is the honest outcome) and promote the ANF degree
        profile, differential uniformity, and fixed-point counts to primary
        predictions with their own minimum effects.
      falsification_route: >-
        The unstructured control at the smallest toy size (n = 8): generic
        EM with a random P must saturate T*D = 2^n exactly; if it does not,
        the harness cannot measure the ratio meaningfully. For the shortcut
        question itself, the informative check is the toy P's ANF degree
        profile vs the random-P null at matched sizes.
    - id: OBJ-6-3
      relates_to: [IDEA-20260731-006, CHECK-3]
      severity: nonfatal_gating_note
      title: "The EM chain is not closed by the OWF baseline alone"
      statement: >-
        IDEA-20260731-019, IDEA-20260731-002..004 are specified at the AES-instance parameter
        sets (faest_128f/s). The EM instances (faest_em_*) carry their own
        (kappa, tau, eps_cc, field) parameters (UNVERIFIED placeholders), and
        with the OWF baseline at exactly 2^n, the layer terms must be
        re-checked at the EM parameter sets, not carried over from the AES
        instances. The record's voleith_fs_soundness block implies the
        carry-over without naming the assumption.
      required_scope_fix: >-
        Name the carry-over assumption explicitly in the record: the layer
        terms (001/002/004 objects) must be evaluated at the EM instances'
        parameter sets before any statement about the EM variants' full
        chain; the OWF baseline alone is the boundary, not the chain.
      falsification_route: >-
        None needed (scope note). The concrete route is the BATCH-002+
        assembly of 002+004 at the EM parameter sets, mirroring the open
        direction #4 of the ideation report for the AES variants.
    - id: OBJ-6-4
      relates_to: [IDEA-20260731-006, CHECK-5]
      severity: nonfatal_note
      title: "P3 (charged Grover >= 128) is near-vacuous by construction"
      statement: >-
        Grover over the 2^{2n}-bit key space costs ~2^n = 2^128 OWF
        evaluations by construction; the charged value can fall below 128
        only through a modeling error or a smaller-than-assumed key space.
        The record already labels this a "parameter-level finding"; keep it
        as a sanity check and do not treat a pass as evidence for the
        category claim.
      required_scope_fix: >-
        No change needed beyond keeping the sanity-check label; optionally
        drop it from the primary predictions into required_metrics.
      falsification_route: >-
        Re-check the charged model and the pinned key-space size if it ever
        fires (already the record's FC4).

admissibility_verdicts:
  - idea_id: IDEA-20260731-004
    verdict: admit
    rationale: >-
      Schema-complete; exact attack object named (the QROM FS extractor loss
      term L_QROM on FAEST's tau-round VOLEitH commit-and-open instance, and
      the charged QROM forgery bound); matched baseline present with the
      correct quantum convention for the lane, the RSF-1 one-pair caveat
      carried, and every unverified number labeled UNVERIFIED; novelty_status
      "unverified" is calibrated (tightest-known bound unfiled); predictions
      are monotone with named triggers; falsification conditions carry the
      rule-12 gate and toy-tier labeling; controls include unstructured,
      null-object, and scale/decay. No fatal objection. The four nonfatal
      items (quantum grinding charge; dual-baseline framing; P4's one-sided
      classical reach; unfiled retightening dependency) are trackable
      revision items for the BATCH-002 design gate.
    bounded_falsification_route: >-
      Stage 1 (derivation, zero compute beyond the pinned sources): read the
      pinned spec v2.0 security section + eprint 2023/996 full text + the
      filed retightening; compute the charged bound at the deployed set with
      the named quantum-grinding charge and the charged q-sweep; falsifies
      if < 2^128 at a named (q, tau). Stage 2 (cheapest run): the P2/P3
      scaling controls at toy scale (doubling q must grow the measured loss
      by >= 1 bit; doubling |C| must shrink it by >= 1 bit) — any failure
      invalidates the harness, which is the cheapest falsification of the
      measurement. Stage 3: the unstructured control reproducing the generic
      QROM FS loss shape must precede any FAEST-shaped interpretation.
  - idea_id: IDEA-20260731-005
    verdict: admit
    rationale: >-
      Schema-complete; exact attack object named (the polynomial system
      S = (C, F, V) union I_open and the cost of the best algebraic solve);
      matched baseline 2^126.1 correct with the RSF-1 caveat and an honest
      algebraic-attack baseline (KN-LIT-2288 zero-dimensional ideal);
      novelty_status "speculative" calibrated; predictions monotone with
      named triggers; falsification conditions carry re-derivation gates,
      toy-tier labels, and a solver-family-neutrality condition; controls
      include unstructured, null-object, and scale. No fatal objection. The
      three nonfatal items (near-vacuous confirmation side; I_open modeling;
      d_reg extrapolation gate) are trackable revision items.
    bounded_falsification_route: >-
      Stage 1 (calibration, cheapest run): the unstructured control at the
      smallest toy cell — d_reg of a random degree-3 system must match the
      semi-regular prediction; a mismatch invalidates the instrumentation.
      Stage 2 (cheapest decisive): the per-S-box scale control (P2) at 1 ->
      2 S-boxes — a per-S-box cost ratio < 1 is the flatness tell that the
      extrapolated barrier is unsound; then the opening-leverage control
      (P3) with the pinned I_open. Stage 3: if any structural signal fires,
      the extrapolated cost is re-derived at the pinned deployed family and
      a certified solve (recovered key annihilates the public map) at
      reduced parameters is required before any claim about FAEST (rule 7,
      claim_tier_ceiling).
  - idea_id: IDEA-20260731-006
    verdict: admit
    rationale: >-
      Schema-complete; exact attack objects named (the faest_em_* EM OWF at
      its deployed definition, and the AES-based public permutation P);
      matched baseline correctly derived from the construction with the
      archived toolkit (KN-LIT-4930/5810) accurately cited and every
      unverified piece labeled; the single-block risk is named head-on with
      a derivation-level falsification that fires before any run;
      novelty_status "adaptation" calibrated; controls include unstructured,
      null-object, and scale/decay. The zero-slack observation is the
      strongest content in the batch and is honestly framed. No fatal
      objection. The four nonfatal items (claim wording; P2 discriminator
      weakness; EM-chain carry-over assumption; P3 vacuity) are trackable
      revision items.
    bounded_falsification_route: >-
      Stage 1 (derivation, zero compute): the definition-pinning component —
      if the pinned definition is single-block with n-bit output, P1 fires
      immediately (any-preimage inversion ~1 P-evaluation): the cheapest
      falsification in the batch. Stage 2 (cheapest run): the unstructured
      control at the smallest toy size (n = 8) — generic EM with a random P
      must saturate T*D = 2^n exactly; a miss invalidates the harness.
      Stage 3: the informative shortcut probe — toy P's ANF degree profile,
      differential uniformity, and fixed-point counts vs the random-P null
      at matched sizes, with the AES-vs-random inversion-cost ratio as a
      null-trend check. Any structural-shortcut signal is toy-tier until
      re-derived at the deployed scale.

completion_gate_check:
  - fatal_and_nonfatal_objections_named_across_six_checks: true
  - every_idea_has_explicit_verdict: true
  - bounded_falsification_route_for_every_admitted_idea: true
  - no_producer_artifact_changed: true
