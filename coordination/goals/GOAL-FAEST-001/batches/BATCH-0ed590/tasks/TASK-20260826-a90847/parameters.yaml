notes_on_derived_params:
  kappa_definition: "kappa == lambda; VOLE global key Delta in F_{2^lambda}."
  k_tau0_tau1_L: >-
    Route B derives k, tau0, tau1, L from lambda, tau, w_grind via the CALC_* macros
    (instances.c:45-49): k = floor((lambda - w_grind)/tau) + 1; tau1 = (lambda - w_grind) mod tau;
    tau0 = tau - tau1; L = tau1*2^k + tau0*2^(k-1). Only FAEST_128s's derived
    (k,tau0,tau1,L) are transcribed above as an illustration; the rest follow the same macro.
  B_bits: "UNIVERSAL_HASH_B_BITS = 16 (instances.h:17); spec Table 3.1 column B."
  agreement: "All twelve sets: spec v2.0 Table 3.1 and meson.build agree on lambda, tau, w_grind, T_open, B, nleafcom, ell, pk, sig for every row checked."

# ----------------------------------------------------------------------------
# 4. LeafCommit AND bAVC (batch all-but-one vector commitment) MODES
# ----------------------------------------------------------------------------
bavc:
  type: "batch all-but-one vector commitment over a single GGM tree ('one-tree' BAVC, per [BBM+24])"
  structure: "commitment to tau vectors of length N, L = tau * N; opens all-but-tau seeds"
  grinding: "Fiat-Shamir 'grinding': the w_grind upper bits of Delta must be zero; opening size capped at T_open, else a new challenge is drawn"
  api_route_b:
    - "bavc.h:36-45 (bavc_commit / bavc_open / bavc_reconstruct)"
    - "bavc.c:22-42 (GGM seed expansion via prg_2_lambda)"
  source_route_a:
    - "spec v2.0 lines 320-354 (batch of tau all-but-one VCs, L = tau*N, opening threshold T_open)"
    - "spec v2.0 lines 222-223 (grinding optimization)"
leaf_commit:
  faest_aes_mode:
    definition: "sd || buffer = prg_4_lambda(key, iv, tweak) [4*lambda bits]; sd = first lambda bits; com = leaf_hash_lambda(uhash, buffer) [3*lambda-bit universal-hash compression]"
    com_size_bits: "3 * lambda  (nleafcom = 3)"
    source_route_b:
      - "bavc.c:45-67 (faest_leaf_commit_128/192/256)"
      - "bavc.c:119,151,183 (com_size = lambda_bytes * 3)"
      - "universal_hashing.c:501-545 (leaf_hash_128/192/256)"
  faest_em_mode:
    definition: "sd = key [lambda bits]; com = prg_2_lambda(key, iv, tweak) [2*lambda bits]; no universal-hash leaf compression"
    com_size_bits: "2 * lambda  (nleafcom = 2)"
    source_route_b:
      - "bavc.c:69-76 (faest_em_leaf_commit) and bavc.c:79-96 (leaf_commit dispatch, faest_is_em)"
  distinction: "AES variant uses a universal-hash leaf compression (nleafcom=3); EM variant uses a direct PRG leaf commitment (nleafcom=2)."
  source_route_a: "spec v2.0 Table 3.1 nleafcom column (3 for FAEST, 2 for FAEST-EM); lines 333-341 (LeafCommit values comi)"
  prg: "PRG = fixed-key AES/Rijndael in CTR-like mode, tweak-separated (aes.h:72-74 prg_2_lambda / prg_4_lambda)"
  hash_function: "SHAKE128 if lambda==128 else SHAKE256 (hash_shake.h:28-33 / 80-86 / 155-159)"

# ----------------------------------------------------------------------------
# 5. faest_em_* OWF DEFINITION (widths, key split, P instantiation)
# ----------------------------------------------------------------------------
owf_em:
  construction: "Even-Mansour: OWF(k) = P_x(k) XOR k, where P is a fixed-key block cipher keyed by the PUBLIC input x; k is the secret key/plaintext."
  key_split:
    secret: "k (owf 'key'): the lambda-bit Even-Mansour plaintext = the FAEST-EM secret key"
    public: "x (owf 'input'): the public pk material used as the block-cipher key (round-key source)"
    note: "In faest-ref the C arguments are (key=k, input=x); owf_em swaps them relative to the AES OWF and adds the XOR-with-k. See owf.c:257-258 comment."
  P_instantiation_and_widths:
    FAEST_EM_128:
      P: "AES-128 (block 128 bits, Nst=4)"
      definition: "AES128_x(k) XOR k  ->  16-byte output"
      source_route_a: "spec Table 3.1 row 'AES128_x(k) XOR k'; lines 189-199"
      source_route_b: "owf.c:243-259 (owf_em_128 = owf_128(input,key); xor_u8_array(out,key,out,16)); owf.c:71-83 (aesni)"
    FAEST_EM_192:
      P: "Rijndael-192 (block 192 bits, Nst=6)"
      definition: "Rijndael192_x(k) XOR k  ->  24-byte output"
      source_route_a: "spec Table 3.1 row 'Rijndael192_x(k) XOR k' (line 834)"
      source_route_b: "owf.c:262-266 (rijndael192_init_round_keys(input); rijndael192_encrypt_block(rk,key,out); xor 24)"
    FAEST_EM_256:
      P: "Rijndael-256 (block 256 bits, Nst=8)"
      definition: "Rijndael256_x(k) XOR k  ->  32-byte output"
      source_route_a: "spec Table 3.1 row 'Rijndael256_x(k) XOR k' (line ~862)"
      source_route_b: "owf.c:269-273 (rijndael256_init_round_keys(input); rijndael256_encrypt_block(rk,key,out); xor 32)"
  widths_table:
    # Nst = state width in 32-bit words; input/output sizes in bytes; R = rounds
    FAEST_EM_128: { Nst: 4, block_bits: 128, R: 10, owf_input_size: 16, owf_output_size: 16 }
    FAEST_EM_192: { Nst: 6, block_bits: 192, R: 12, owf_input_size: 24, owf_output_size: 24 }
    FAEST_EM_256: { Nst: 8, block_bits: 256, R: 14, owf_input_size: 32, owf_output_size: 32 }
  em_marker: "Ske == 0 identifies an EM instance (instances.h:70-72 faest_is_em)."
  corroborated: true

# For reference, the AES (non-EM) OWF, pinned the same way:
owf_aes:
  FAEST_128: "AES128_k(x)  -> 16-byte output (single block).  owf.c:155-179; spec Table 3.1 'AES128_k(x)'"
  FAEST_192: "AES192_k(x) || AES192_k(x XOR 1)  -> 32-byte output (two blocks).  owf.c:181-211; spec 'AES192_k(x)||AES192_k(x^1)'"
  FAEST_256: "AES256_k(x) || AES256_k(x XOR 1)  -> 32-byte output (two blocks).  owf.c:213-241; spec 'AES256_k(x)||AES256_k(x^1)'"

# ----------------------------------------------------------------------------
# 6. DIGEST LENGTHS (Fiat-Shamir / hash outputs), in bits
# ----------------------------------------------------------------------------
digest_lengths:
  hash_primitive: "SHAKE128 for lambda==128, else SHAKE256 (hash_shake.h)"
  mu:            { bits: "2*lambda", role: "H2_0 hash of pk-input || pk-output || message", route_b: "faest_impl.c:179 (H2_0_final, 2*lambda/8)" }
  hcom:          { bits: "2*lambda", role: "bAVC root commitment digest (H1)", route_b: "faest_impl.c:215 (H2_update hcom, lambda_bytes*2)" }
  chall_1:       { bits: "5*lambda + 64", role: "first FS challenge", route_b: "faest_impl.c:218 (H2_1_final, 5*lambda_bytes + 8)" }
  chall_2:       { bits: "3*lambda + 64", role: "VOLE-ZK / QuickSilver challenge (ZKHash key)", route_a: "spec line 5527 H2_2(...; 3*lambda+64)", route_b: "faest_impl.c:245 (H2_2_final, 3*lambda_bytes + 8)" }
  chall_3:       { bits: "lambda", role: "VOLE global key Delta (final FS challenge)", route_a: "spec line 5535 H2_3(...; lambda)", route_b: "faest_impl.c:267,276 (H2_3_final, lambda_bytes)" }
  u_tilde_v_tilde: { bits: "lambda + 16", role: "VOLE-check response (B=16-bit padding)", route_b: "faest_impl.c:224,234 (lambda_bytes + UNIVERSAL_HASH_B)" }
  root_key:      { bits: "lambda", role: "GGM tree root seed (from H3)", route_b: "faest_impl.c:200 (H3_final, lambda_bytes)" }
  iv:            { bits: 128, role: "128-bit IV (IV_SIZE = AES_BLOCK_SIZE)", route_b: "instances.h:19-20" }
  leaf_com:      { bits: "nleafcom*lambda (3*lambda AES, 2*lambda EM)", role: "per-leaf commitment", route_b: "bavc.c:119,151,183 / bavc.c:69-76" }
  ctr:           { bits: 32, role: "grinding proof-of-work counter", route_b: "faest_impl.c signature_ctr (uint32)" }
  ell_hat_bytes: { formula: "ell/8 + 3*lambda_bytes + UNIVERSAL_HASH_B", route_b: "faest_impl.c:26,210 (UNIVERSAL_HASH_B = 2 bytes)" }
  corroborated_where_both: "chall_2 and chall_3 lengths appear in BOTH routes and agree."

route_agreement:
  statement: >-
    Every value pinned above that is present in both the FAEST v2.0 specification
    (Route A) and the faest-ref source at commit 2a2c36d9 (Route B) was found to
    agree exactly. No placeholder, guess, interpolation, or computed value is
    carried as verified. Values present in only one route are labeled with that
    single source.
  no_assertion_about_faest: true
