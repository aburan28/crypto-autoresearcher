# ----------------------------------------------------------------------------
# 1. FIELD
# ----------------------------------------------------------------------------
field:
  base_field: GF(2)  # F2
  vole_field: "F_{2^lambda}"          # VOLE correlations, global key Delta in F_{2^lambda}
  leaf_hash_field: "F_{2^{3*lambda}}" # used for the AES-variant leaf commitment universal hash
  irreducible_polynomials:
    # Route A: spec v2.0 text, lines 1126-1133 (P8..P768).
    # Route B: fields.c:13-27 (bfN_modulus macros), bit positions match exactly.
    P8:   "a^8 + a^4 + a^3 + a + 1"          # AES base field GF(2^8); route_a L1126, route_b fields.c:13 (bf8_modulus)
    P128: "a^128 + a^7 + a^2 + a + 1"        # route_a L1128, route_b fields.c:17 (bf128_modulus)
    P192: "a^192 + a^7 + a^2 + a + 1"        # route_a L1129, route_b fields.c:19 (bf192_modulus)
    P256: "a^256 + a^10 + a^5 + a^2 + 1"     # route_a L1130, route_b fields.c:21 (bf256_modulus)
    P384: "a^384 + a^12 + a^3 + a^2 + 1"     # route_a L1131, route_b fields.c:23 (bf384_modulus)
    P576: "a^576 + a^13 + a^4 + a^3 + 1"     # route_a L1132, route_b fields.c:25 (bf576_modulus)
    P768: "a^768 + a^19 + a^17 + a^4 + 1"    # route_a L1133, route_b fields.c:27 (bf768_modulus)
  corroborated: true

# ----------------------------------------------------------------------------
# 2. CONSISTENCY-CHECK EQUATION AND ITS DEGREE (the ZK / QuickSilver OWF check)
# ----------------------------------------------------------------------------
consistency_check:
  scheme: "QuickSilver-style VOLE-ZK proof of OWF constraints (FAEST v2 'SSS')"
  equation:
    # Verifier reproduces the prover's a0-tilde and folds it into the FS challenge.
    verifier_recovers: "a0_tilde = q_tilde - a1_tilde * Delta - a2_tilde * Delta^2"
    q_tilde: "q_tilde = ZKHash(chall2, b || q_star)"
    b: "b = <z>_{3*lambda} = OWFConstraints(<w>, pk), parsed as b in F_{2^lambda}^C"
    note_field_char2: >-
      Over characteristic 2, subtraction equals addition; Route B implements the
      identical relation as a0_tilde = q_tilde + a1_tilde*Delta + a2_tilde*Delta^2.
    final_acceptance: "accept iff chall3 == H2_3(chall2 || a0_tilde || a1_tilde || a2_tilde || ctr; lambda)"
  degree: 2
  degree_meaning: >-
    Degree 2 in the VOLE global key Delta: the proof is a degree-2 polynomial
    with three coefficients (a0_tilde, a1_tilde, a2_tilde). OWF constraints are
    degree-2 commitments; the S-box inverse-norm relation (c * a^2 * a^16 = a) is
    stated as a degree-3 constraint but reduced to degree-2 commitments.
  source_route_a:
    - "spec v2.0, Fig. 6.23 / Sec. 6, plain-text lines 5013-5016 and 5152 (return q_tilde - a1_tilde*Delta - a2_tilde*Delta^2)"
    - "spec v2.0, Sec. 7 verify, lines 5530-5537 (chall3' = H2_3(chall2||a0||a1||a2||ctr; lambda); accept on match)"
    - "spec v2.0, degree-2 commitments: lines 3257, 3428, 3597, 3603; degree-3 norm constraint reduced to deg-2: lines 3423, 3428"
  source_route_b:
    - "faest_aes.c.in:1760-1770 (verifier: a0_tilde = q_tilde + a1_tilde*delta + a2_tilde*delta_sq)"
    - "faest_aes.c.in:1702-1708 (prover: zk_hash_SSS_3_init + zk_hash_SSS_3_finalize -> a0_tilde,a1_tilde,a2_tilde)"
    - "universal_hashing.h:38-98 (zk_hash_{128,192,256}_3 emit three digests h_0,h_1,h_2)"
    - "faest_impl.c:270-276 (hash_challenge_3 -> H2_3, length lambda/8)"
  corroborated: true

