claim_ceiling: >-
  PARAMETER-PINNING DESIGN GATE ONLY. THIS BATCH ASSERTS NOTHING ABOUT FAEST --
  no forgery, no soundness slack, no category claim, no barrier statement, no
  margin, and no comparison against published work in either direction. It
  resolves (or fails to resolve) a source-acquisition question and, only if it
  resolves, applies already-recorded scope fixes and designs contracts. The toy
  claim ceiling stands, no hypothesis exists to move, and every BATCH-001
  boundary in EV-FAEST-001 and EV-FAEST-002 remains in force, including that
  toy-scale measurements can never be presented as crypto-scale validation
  (AGENTS.md rule 7).

objective: >-
  A SINGLE DESIGN GATE, fulfilling the instruction DEC-20260731-021
  next_actions[0] records as "BATCH-002", now on a corrected citation basis:
  resolve RSF-5 by pinning the deployed FAEST parameters -- the exact
  consistency-check equation and its degree, (kappa, tau), the field, the
  LeafCommit/bAVC modes, and the faest_em_* OWF definition -- by one of two
  declared routes; then, ONLY IF RSF-5 RESOLVES, apply scope fixes RSF-1..5 and
  the eleven red-team refinements OBJ-4-1..4, OBJ-5-1..3, OBJ-6-1..4 to the six
  admitted IDEA records, and design frozen experiment contracts for the
  highest-priority ideas per the re-derivation outcome. If RSF-5 does not
  resolve, the gate returns an acquisition blocker and stops.

rsf5_routes:
  route_a_primary_text:
    target: >-
      FAEST specification v2.0 section-security text and/or eprint 2023/996 full
      text.
    what_must_be_pinned: >-
      consistency-check equation and degree; (kappa, tau); field; LeafCommit and
      bAVC modes; faest_em_* OWF definition (widths, key split, P
      instantiation); digest lengths.
    known_obstacles: >-
      EV-FAEST-001 records that the spec v2.0 PDF body text was NOT extractable
      by BATCH-001's sources task and that content claims were attributed to the
      official resources page rather than to a reading of the PDF. The
      2026-07-31 probe recorded faest.info and eprint.iacr.org at HTTP 403. No
      KN-LIT entry for the specification exists in this corpus.
    status: OPEN AND UNATTEMPTED IN THIS BATCH; not pre-judged in either direction.
  route_b_pinned_faest_ref_commit:
    target: >-
      A pinned faest-ref commit adopted as ground truth, per the alternative
      DEC-20260731-021 next_actions[0] names explicitly.
    material_verified_present_in_KN_LIT_7619: >-
      main HEAD 2a2c36d96f8e6d2b7acda341741892099e8c5cc1 (2026-07-24); version
      2.0.5 at 55b52681b4d962df9f55f4e403a68bca98b10d37 (2026-07-02); the twelve
      parameter variants faest_128f/s, faest_192f/s, faest_256f/s and the
      Even-Mansour set faest_em_128f/s, faest_em_192f/s, faest_em_256f/s; the
      source layout aes.c/h, bavc.c/h, fields.c/h, vole.c/h, owf.c/h,
      instances.c/h, universal_hashing.c/h, random_oracle.c/h, utils.c/h,
      meson.build.
    honest_limit: >-
      KN-LIT-7619 RECORDS REPOSITORY METADATA, NOT SOURCE TEXT. Its own Limits
      section states that citation_verified: true covers "the repository's
      existence, identity, license, layout, and HEAD/version as observed on
      2026-07-31 via the rendered page and atom feed" and that "Code contents
      were not fetched or audited"; no source checksums were computed and no
      clone was made. It does NOT establish that the C source text is fetchable
      now, and the 2026-07-31 probe recorded faest-sign GitHub repos at HTTP 403.
    version_pin_duty: >-
      Any artifact produced from this route MUST record the exact commit it was
      read or built from. The repository is a moving target (HEAD moved between
      2026-07-02 and 2026-07-24) and the HEAD above is a point-in-time
      observation, not a recommendation.
    status: OPEN AND UNATTEMPTED IN THIS BATCH; not pre-judged in either direction.
  route_order: >-
    Either route may be attempted first and BOTH must be attempted before
    failure is declared. Success on either one satisfies RSF-5, and the artifact
    must state which route produced each pinned value.

stop_condition:
  if_both_routes_fail: >-
    THE GATE RETURNS AN ACQUISITION BLOCKER AND STOPS. It does not substitute,
    guess, interpolate, or carry forward a placeholder parameter; it does not
    design or freeze any experiment contract; and it does not report the failure
    as a finding about FAEST.
  what_that_failure_is: >-
    PAUSE-CONDITION-#2 MATERIAL FOR A COORDINATOR RULING, AND NOTHING MORE.
    GOAL-FAEST-001 pause condition #2 reads "No Round-3 FAEST specification or
    reference implementation can be obtained under the network policy after the
    declared source-preference order is exhausted". A double-route failure is
    reported with the exact URLs attempted, the exact HTTP status or error
    observed, and the timestamps -- and the Coordinator, not the gate, rules on
    the pause.
  what_that_failure_is_not: >-
    IT IS NOT NEGATIVE EVIDENCE ABOUT FAEST, IN EITHER DIRECTION. AGENTS.md rule
    5 and CLAUDE.md core rule 3: a timeout, crash, 403, or acquisition failure is
    infrastructure signal and is never a mathematical result. It says nothing
    about FAEST's soundness, its parameters, or the tightness of its claim chain,
    and no record may present it as though it did.
  prior_state_of_this_blocker: >-
    PAUSE CONDITION #2 DID HOLD ON 2026-07-31 AND WAS SUBSEQUENTLY CLEARED. The
    probe at coordination/goals/GOAL-FAEST-001/source-acquisition-probe-20260731.md
    records the full declared preference order exhausted (NIST CSRC, faest.info
    and eprint.iacr.org all 403; faest-sign GitHub repos 403; GitHub API scoped
    to aburan28/crypto-autoresearcher only). It was cleared by the filing of
    KN-LIT-7619, KN-LIT-7620 and KN-LIT-7638. This batch neither re-asserts a
    cleared blocker nor erases that it once held; it re-tests the narrow
    remainder, which is RSF-5.

planned_task_shape:
  status: PLANNED ONLY. NO HANDOFF FOR ANY CARD BELOW EXISTS YET.
  cards:
    - rank: 1
      role: executor
      purpose: >-
        RSF-5 acquisition and parameter pinning on BOTH declared routes, with a
        fetch table recording every URL attempted, the HTTP status or error
        observed, and the timestamp. Deliverable is either a parameters artifact
        naming the route and the exact source (document section or commit SHA)
        for each pinned value, or an acquisition-blocker report.
      claim_ceiling: >-
        Records what was fetched and what a source says. Asserts nothing about
        FAEST.
    - rank: 2
      role: coordinator
      purpose: >-
        Isolated SNAPSHOT archive of the rank-1 artifacts, alone, before any
        independent review.
    - rank: 3
      role: validator or red-team (independent session)
      purpose: >-
        Independent check that each pinned value is actually supported by the
        cited source location, that no placeholder survived as though verified,
        and that an acquisition failure (if any) is reported as infrastructure
        signal rather than as a finding.
      gate: >-
        REQUIRED before any contract design proceeds. Independence here is
        SESSION independence; model independence is unavailable in this harness
        and must not be claimed.
    - rank: 4
      role: idea-generator or executor
      purpose: >-
        CONDITIONAL ON RSF-5 RESOLVING. Apply RSF-1..5 and OBJ-4-1..4,
        OBJ-5-1..3, OBJ-6-1..4 to the six admitted IDEA records, then draft
        frozen experiment contracts for the highest-priority ideas per the
        re-derivation outcome. NOT DISPATCHED if the gate returns a blocker.
    - rank: 5
      role: coordinator
      purpose: >-
        Isolated LEDGER archive, alone, after review: the batch evidence record,
        the closing decision, and any warranted knowledge entry.
  archival_discipline: >-
    Exactly one archival task per artifact set. Snapshot archives run alone
    BEFORE independent review; the ledger archive runs alone AFTER it. Each
    stages only its declared paths, and the post-commit verifier must accept the
    commit before any result is treated as durable or official.
  reserved_identifiers: >-
    NONE. No EV-*, DEC-*, or TASK-* identifier is pre-named for the cards above.
    Pre-naming forward identifiers in a goal head is a recorded failure mode of
    this program (a head that names an occupied forward ID blocks its own
    batch); the next session allocates each with tools/allocate_id.py --next and
    confirms with --check immediately before use.

