    card would reference a TASK-* record that does not exist, and the dispatcher
    would reject the plan one rule at a time. The queue and its handoffs are
    authored together, by the next session, before anything runs.
  no_worker_dispatched: >-
    NO WORKER IS DISPATCHED, NO EXECUTOR RUN IS AUTHORIZED, NO EXPERIMENT IS
