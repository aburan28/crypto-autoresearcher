coverage_manifest:
  schema: crypto.autoresearch.symmetric_coverage.v1
  as_of: '2026-08-25'
  terminal_states:
    - primary_source_complete
    - primary_source_partial
    - no_result_located_with_search_boundary
    - not_applicable
    - routed_to_another_goal
  batch_1_shards:
    legacy_hashes:
      owner: TASK-20260825-51dfe7
      primitives: [MD4, MD5, SHA-0, SHA-1, RIPEMD-160]
      mandatory_seed: https://eprint.iacr.org/2026/1744.pdf
      special_rule: MD5 path content is quarantined; use internal frontier metadata only.
    modern_hashes_and_permutations:
      owner: TASK-20260825-3da758
      primitives: [SHA-224, SHA-256, SHA-384, SHA-512, SHA3-224, SHA3-256, SHA3-384, SHA3-512, SHAKE128, SHAKE256, Keccak-f-1600, BLAKE2s, BLAKE2b, BLAKE3, Ascon-Hash256, Ascon-XOF128]
    block_ciphers:
      owner: TASK-20260825-7d3441
      primitives: [AES-128, AES-192, AES-256, DES, 3DES, Camellia, ARIA, SM4, Serpent, Twofish, Kuznyechik, LEA, PRESENT, GIFT, SKINNY, SIMON, SPECK, PRINCE, Midori, CLEFIA, CHAM]
  required_attack_families:
    hashes: [collision, chosen_prefix_collision, semi_free_start_collision, preimage, second_preimage, differential_characteristic, internal_differential, distinguisher]
    block_ciphers: [differential, linear, differential_linear, boomerang_rectangle, impossible_differential, integral_division_property, zero_correlation, biclique, algebraic, key_recovery, related_key]
  later_batch_backlog:
    - Whirlpool, Tiger, HAVAL, Skein, Grøstl, JH, ECHO, Luffa, CubeHash, Shabal
    - MISTY1, KASUMI, IDEA, CAST-128, Blowfish, RC5, RC6, XTEA, TWINE, Piccolo, MANTIS
    - dedicated quantum-attack rows and side-channel/fault cryptanalysis, which require separate comparison keys and review expertise
  completeness_rule: >-
    Batch 1 is not globally complete.  It establishes the schema and tier-1
    seed coverage.  Every unsearched primitive remains explicitly in the
    backlog; it may not be described as having no attacks.
