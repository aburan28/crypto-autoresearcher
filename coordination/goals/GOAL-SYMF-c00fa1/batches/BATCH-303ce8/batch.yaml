batch_id: BATCH-303ce8
goal_id: GOAL-SYMF-c00fa1
question_id: RQ-SYMF-5ab172
created_at: '2026-08-25'
created_by: coordinator
opening_decision: DEC-20260825-08a067
objective: >-
  Freeze the frontier ontology and coverage boundary, acquire three disjoint
  primary-source shards, preserve every unresolved or incomparable row, and
  independently test provenance, transcription, notion separation, and Pareto
  claims before any canonical knowledge promotion.
claim_ceiling: >-
  Literature-attribution and frontier-normalization only.  No attack is
  reproduced, no primitive is broken, no security claim is promoted, and no
  paper-reported complexity becomes an internal experimental observation.
coordinator_prior:
  recorded_before_producers: true
  expectation: >-
    The first pass will find many bibliographic candidates but materially fewer
    authoritative rows because primary texts omit at least one cost axis, use
    incompatible round conventions, or report "practical" without a normalized
    exponent.  SHA-1 will require multiple incomparable rows; ePrint 2026/1744
    will advance the reduced-round RIPEMD-160 collision step frontier from 40
    practical steps to 42 practical steps while leaving full RIPEMD-160 intact;
    AES will have no publicly practical full-round single-key key recovery.
  falsifier: >-
    A primary source showing that any one of those statements is wrong must be
    recorded as a prior overturn, not edited out of the batch narrative.
budget:
  declared_seconds: 6300
  arithmetic: "3 * 900 producer + 300 source correction + 300 syntax normalization + 300 snapshot + 900 validator + 1200 red-team + 600 ledger = 6300"
  maximum_runs_note: Every literature task sets maximum_runs=1 as a schema ceiling and performs no experiment run.
source_preference_order:
  - standards and authors' primary paper PDFs or IACR ePrint versions
  - IACR conference or ToSC proceedings pages and DOI landing pages
  - author repositories or institutional copies matching title and version
  - surveys only as discovery pointers, never support for an authoritative row
comparison_rule: >-
  A row may dominate another only when primitive variant, security property,
  attacker model, oracle access, key relation, target component, round/step
  convention, result kind, and success-probability convention all match.  It
  must be no worse on every known cost axis and strictly better on at least one.
  A null axis blocks dominance when the missing value could reverse it.
next_action: Complete syntax-normalization TASK-20260825-30a080, pass the Coordinator parse gate, then run snapshot TASK-20260825-568663 alone.
