    Treating the omitted two-related-key 13-round AES-256 point as a
    full-round single-key recovery immediately makes the proves-too-much
    control fail; restoring key_relation=two_related_keys and rounds=13/14
    localizes it to its proper incomparable cell.
  baseline_comparison: >-
    The frozen compilation improves substantially over a scalar-best table by
    separating notion, result kind, key relation, and round scope. The defects
    are missing cost axes and missing incomparable cells, not a reason to
    collapse those dimensions.
  heuristic_challenges:
    - >-
      Shambles' 2^63.4 chosen-prefix number depends on a heuristic graph
      strategy with simulations and no guaranteed upper bound; that condition
      belongs in the row rather than being hidden behind a bare expected cost.
    - >-
      RIPEMD-160's 2^47.4 uses an explicit uniformity approximation for
      uncontrolled conditions; the practical pairs validate feasibility, not a
      theorem that this exact probability is distribution-free.
  cost_model_challenges:
    - Missing SHA-1 storage, RAM, graph construction, and manual-preparation costs change end-to-end interpretation.
    - The AES-256 four-related-key row omits source-reported 2^77 memory.
    - Platform-normalized exponents and realized calendar/rental costs must remain separate rows.
  reduction_and_scope_challenges:
    - A reduced-round collision is not evidence of a full-function collision.
    - A keyed-permutation boomerang is not a BLAKE hash-construction break.
    - Chosen-key/related-key AES results do not imply single-key key recovery.
    - Long-message second-preimage results do not imply ordinary preimage attacks.
  proof_architecture_challenges: []
  narrowest_supported_statement: >-
