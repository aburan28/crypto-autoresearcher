      outcome: correctly_rejected
      field_level_reasons:
        - security_property separates identical-prefix, chosen-prefix, detector, preimage, and second-preimage
        - result_kind separates theoretical expected cost from demonstrated expenditure
        - costs.time uses different normalized/realized hardware conventions
        - costs.data and costs.memory are nonidentical and sometimes source-explicit
        - success_probability_convention separates expected work from one realized success
    - object: 42-of-80-step RIPEMD-160 collision restated as full break
      outcome: correctly_rejected
      field_level_reasons:
        - round_scope is reduced, not full
        - rounds_attacked is 42 and total_rounds is 80
        - primitive_variant is first_42_steps
        - source conclusion explicitly says the full hash is not broken
    - object: related-key reduced-round AES restated as full-round single-key recovery
      outcome: correctly_rejected
      field_level_reasons:
        - key_relation is two_related_keys or four_related_keys, not single_key
        - round_scope of the 12/13-round rows is reduced, not full
        - rounds_attacked is 12 or 13 versus 14 for AES-256
        - chosen-key distinguishers and partial-key recovery are distinct result kinds from master-key recovery

