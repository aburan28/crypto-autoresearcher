review_plan:
  claim_under_review: >-
    The three archived literature shards faithfully transcribe their primary
    sources into the frozen schema and identify only notion-matched,
    cost-complete nondominated rows as frontier rows as of 2026-08-25.
  coordinator_prior: >-
    Expect several transcription and completeness gaps but no evidence of a
    practical full-round single-key AES key recovery; expect SHA-1 to remain a
    multi-row frontier and RIPEMD-160 ePrint 2026/1744 to be reduced-round only.
  joints:
    - joint: J1_schema_and_comparison_key_separation
      assigned_to: TASK-20260825-bb6d5d
      attack_plan: >-
        Parse every row, reconstruct its comparison key from the stated fields,
        and flag any pair merged across property, model, target, round convention,
        result kind, or success convention.  Recompute declared dominance from
        all populated cost axes.
      breaking_artifact: validation-report.yaml with row ids and the mismatched fields or dominance counterexample.
    - joint: J2_primary_source_transcription
      assigned_to: TASK-20260825-9eda3a
      attack_plan: >-
        Independently open a risk-based sample including every claimed SHA-1,
        RIPEMD-160, and AES frontier row plus at least one row from each other
        primitive family; compare rounds, notion, time, data, memory,
        preprocessing, and success probability to the cited page/table/theorem.
      breaking_artifact: red-team-report.yaml with source URL, exact locator, row id, and field-level discrepancy.
    - joint: J3_coverage_and_frontier_overclaim
      assigned_to: TASK-20260825-9eda3a
      attack_plan: >-
        Search for one newer or stronger primary-source result per shard and one
        missing incomparable cost tradeoff.  Attempt to dominate every
        is_frontier row with a source omitted by the producer; treat failure to
        find one only as a bounded search result.
      breaking_artifact: red-team-report.yaml with omitted source rows or a complete search log and unchanged bounded verdict.
  blindness:
    mutual: true
    lifted_for: []
    rationale: null
  proves_too_much:
    objects:
      - >-
        A deliberately flattened SHA-1 statement "best attack = 2^61".  The
        review must reject it because identical-prefix, chosen-prefix,
        theoretical, demonstrated, time, memory, and success axes differ.
      - >-
        The 42-of-80-step RIPEMD-160 collision from ePrint 2026/1744 restated as
        a full RIPEMD-160 break.  The review must reject it on round_scope.
      - >-
        A related-key reduced-round AES attack restated as full-round single-key
        AES key recovery.  The review must reject it on key_relation and rounds.
    failure_signature: Any control object accepted as a valid canonical frontier statement invalidates the batch compilation.
    assigned_to: TASK-20260825-9eda3a
  blind_rederivation:
    required: true
    quantity: >-
      The exact SHA-1 frontier partition and each row's reported complexity,
      memory/data qualifiers, success convention, and practical/theoretical status.
    parameters: Primary sources and the frozen frontier schema only.
    blind_from:
      - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/tasks/TASK-20260825-51dfe7
    assigned_to: TASK-20260825-9eda3a
  procedure_deviations: []
