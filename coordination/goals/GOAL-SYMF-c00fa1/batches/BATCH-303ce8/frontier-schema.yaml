schema: crypto.autoresearch.symmetric_frontier.v1
as_of: '2026-08-25'
definition: >-
  A frontier is the nondominated set inside one exact comparison_key.  It is not
  a ranking across different notions, models, targets, or round conventions.
required_row_fields:
  identity: [row_id, primitive, primitive_variant, primitive_class]
  comparison_key:
    - security_property
    - attacker_model
    - oracle_access
    - key_relation
    - target_component
    - round_scope
    - rounds_attacked
    - total_rounds
    - round_convention
    - result_kind
    - success_probability_convention
  method: [attack_family, method_summary]
  costs:
    - time
    - data
    - memory
    - preprocessing
    - queries
    - success_probability
  evidence:
    - practicality
    - certificate_or_artifact
    - verification_state
    - citation
    - provenance
    - retrieved_at
    - source_locator
    - exact_claim_location
  frontier: [is_frontier, dominated_by, dominance_reason, limitations]
allowed_null_reason:
  - not_stated_by_source
  - not_applicable
  - source_unavailable
  - incompatible_unit_not_normalized
  - unresolved_transcription
verification_states:
  - author_reported_primary_text_read
  - independently_reproduced_internal
  - machine_verified_certificate
  - secondary_pointer_only
  - recalled_pointer_only
frontier_eligibility: >-
  Only retrieved, kb, or internal provenance may be authoritative.  A row with
  unresolved transcription or recalled_pointer_only stays in candidates and is
  never marked is_frontier=true.
anti_laundering_rules:
  - A differential trail is not an end-to-end distinguisher unless the source supplies the conversion and all charged costs.
  - A distinguisher is not key recovery.
  - A semi-free-start, free-start, compression-function, or chosen-IV collision is not a standard hash collision.
  - A related-key result is not single-key key recovery.
  - Reduced-round reach is not a full-round break.
  - >-
    "Practical" is preserved as practical with measured platform data; it is
    not converted to 2^N without a source-supported operation count.
  - Quantum and classical rows never dominate each other.
  - Time-only comparisons never hide data, memory, preprocessing, or success probability.
sha1_required_partition:
  - identical_prefix_collision_theoretical
  - identical_prefix_collision_demonstration
  - chosen_prefix_collision_theoretical
  - chosen_prefix_collision_demonstration
  - detector_or_countercryptanalysis_scope
  - preimage_and_second_preimage
