  # ─── CHK-1: Claim 2.1 uniqueness (Repair 1) ──────────────────────────────
  chk_1_claim_2_1_uniqueness:
    repair_1_claim_2_1: valid
    original_error: >
      Circular norm argument: computed r₁²r₂²q' = r₁²r₂²q', a tautology that
      did not establish r₁ = r₂.
    repaired_proof: >
      "Both r₁ and r₂ equal min{s ∈ ℤ₊ : sI ⊆ O}; the minimum of a nonempty
      set of positive integers is unique; hence r₁ = r₂ and J₁ = r₁I = r₂I = J₂."
    validity_assessment: valid
    reasoning: >
      The set {s ∈ ℤ₊ : sI ⊆ O} is nonempty because I is a finitely generated
      Z-lattice in B; the LCM of the denominators of its generators clears
      all fractional parts, placing that multiple inside O. A nonempty subset
      of ℤ₊ has a unique minimum by the well-ordering principle. Therefore r is
      uniquely determined by I, both r₁ and r₂ are that same minimum, and
      J₁ = r₁I = r₂I = J₂ follows in one line. The argument is mathematically
      complete and elementary.
    minor_expositional_note: >
      The derivation does not state explicitly that {s ∈ ℤ₊ : sI ⊆ O} is
      nonempty. This is standard and immediate from the definition of a
      fractional ideal (finitely generated over Z with rational denominators),
      but could be stated for completeness. This does not affect validity.

  # ─── CHK-2: Claim 2.2 integral ideal existence (Repair 2) ────────────────
  chk_2_claim_2_2_existence:
    repair_2_claim_2_2: valid
    original_error: >
      Hasse-Minkowski cited as guaranteeing "a Z-point on {nrd = n} for every
      n ≥ 1." Hasse-Minkowski establishes Q-rational isotropy (existence of a
      non-trivial Q-point on the norm-zero quadric) and says nothing about
      Z-integral representations of positive values.
    repaired_citation: >
      Eichler's theorem via strong approximation (Voight, Quaternion Algebras
      (2021), Theorem 17.3 / Section 30.1): for O an indefinite maximal order
      over Q, nrd: O → ℤ_{≥0} is surjective.
    validity_assessment: valid
    reasoning: >
      The correct theorem is Eichler's theorem for indefinite maximal orders,
      proved via strong approximation for the algebraic group of norm-1
      elements. The derivation provides a complete local argument:
        (a) At every finite split prime p: O_p ≅ M_2(ℤ_p); the matrix
            [[n,0],[0,1]] has reduced norm (determinant) = n, establishing
            local surjectivity for every n ≥ 0.
        (b) At every finite ramified prime p: the unique maximal order in the
            ramified division algebra over Q_p is covered by strong
            approximation.
        (c) At the real place: B ⊗_Q R ≅ M_2(R) is indefinite, so the norm
            form represents all positive reals.
      Global Z-integral surjectivity follows by strong approximation for
      spinor genera. The references to Voight §30.1 (strong approximation)
      and Theorem 17.3 (norm representation) are appropriate and consistent
      with the standard treatment.
    hasse_minkowski_distinction_correct: true
    note_on_hm_distinction: >
      The derivation correctly explains that Hasse-Minkowski gives Q-rational
      isotropy of a quadratic form (existence of a Q-point where the form
      vanishes non-trivially), which is categorically different from
      Z-integral representation of a positive target value n.
    step_from_element_to_ideal: >
      The surjectivity claim on elements (nrd: O → ℤ_{≥0}) is used to
      deduce the existence of an integral left O-ideal of each norm. This
      step is via principal ideals: if x ∈ O with nrd(x) = n, the principal
      left ideal Ox is an integral left O-ideal of norm n. The derivation
      makes this implicit; it is immediate and does not constitute a gap.

  # ─── CHK-3: Logical entailment of conclusion ─────────────────────────────
  chk_3_conclusion_entailed:
    conclusion: >
      The set of fractional left O-ideals of reduced norm q' in an indefinite
      maximal quaternion order over Q is infinite.
    entailment_valid: true
    chain: >
      Claim 2.1 (valid after Repair 1): every fractional ideal I of norm q'
      has a unique representation I = (1/r)·J where r = d(I) ∈ ℤ₊ and J is
      integral of norm q'·r².
      Claim 2.2 (valid after Repair 2): for every r ≥ 1, at least one integral
      left O-ideal of norm q'·r² exists (Eichler/strong approximation).
      Claim 2.3 (immediate from 2.1): ideals with distinct canonical
      denominators are distinct.
      Conclusion: there is at least one fractional ideal for each r ∈ ℕ, and
      they are pairwise distinct, so the total count is |ℕ| = ∞. ✓
    numerical_verification: >
      The table (q' = 7, r = 1..10, B = M_2(Q), O = M_2(Z)) was independently
      recomputed: all σ₁(q'r²) values, exact-denominator counts (via Möbius
      inversion), and cumulative sums are exact. The table in the derivation
      is correct in every entry; the cumulative count grows monotonically
      without bound, consistent with the claimed divergence.

