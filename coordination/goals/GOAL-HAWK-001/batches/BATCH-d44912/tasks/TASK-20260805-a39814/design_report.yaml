      Algorithm samples from fractional ideals with denominator d(I) ≤ R for
      a radius R growing with the algorithm's iteration bound.
    pool_size_formula: "O(q'·R³)"
    pool_growth_confirmed_numerically: true
    density_formula: "|E ∩ F_R| / |F_R|"
    density_decay: >
      If |E ∩ F_R| = o(R³) (plausible under bounded easy-instance structure,
      e.g., |E| bounded by class number h(O)), then density → 0 as R → ∞.
    runtime_conclusion: >
