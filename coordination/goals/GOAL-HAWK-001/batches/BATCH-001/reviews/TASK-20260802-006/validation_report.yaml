      - id: SRC-1
        url: 'https://cic.iacr.org/p/2/2/20/pdf'
        http: 200
        bytes_measured: 554496
        bytes_recorded: 554496
        sha256_measured: '56107a8a72a662b2475a70ffc2a02a4b5303a2ae4855af01627c9ef3b40baf50'
        sha256_recorded: '56107a8a72a662b2475a70ffc2a02a4b5303a2ae4855af01627c9ef3b40baf50'
        hash_match: true
        media_type_measured: 'PDF document, version 1.5'
    extraction:
      tool: 'pdfminer.six 20260107, extract_text, default layout parameters'
      SRC-1:
        chars_measured: 39268
        chars_recorded: 39268
        extraction_sha256_measured: '94ff38cf6737e7d3319305851d0ccb5b248b74cc930a1e72028e4a1fd713d035'
        extraction_sha256_recorded: '94ff38cf6737e7d3319305851d0ccb5b248b74cc930a1e72028e4a1fd713d035'
        match: true
        determinism: 'deterministic - 3 consecutive extractions gave one identical hash'
      SRC-4:
        chars_measured: 78015
        chars_recorded: 78015
        extraction_sha256_measured: 'b6b6ed8e84dcaa89eda1b25107939a5a84bd483a75b84a333f9a25997af46c51 (run 1 of 5)'
        extraction_sha256_recorded: 'a5bd24e6e907aeef8d50d1bde97893ca34c72acba051913657d21f17b2c348ca'
        match: false
        finding: >-
          NOT A DEFECT IN THE RECEIPT, AND NOT A DIFFERENT DOCUMENT. pdfminer.six
          extraction of SRC-4 is NONDETERMINISTIC: 5 consecutive extractions of
          the byte-identical PDF produced 3 distinct sha256 values, all of length
          78015. The variation is element-ordering inside a math-heavy region
          (first divergence at char 18729, an orphan "n" token in the W(a,b)
          display migrating between reflowed fragments). I also tested trailing
          newline, form-feed stripping, CRLF, NFC/NFD, utf-8-sig and latin-1
          encodings against the recorded hash - none matched. The PDF sha256, the
          load-bearing binding, is byte-exact, and the char count is stable.
        recommendation: >-
          Treat the SRC-4 extraction sha256 as a non-reproducible secondary
          artifact. If a future receipt needs a text-level hash for this PDF, it
          must record a canonicalized form (e.g. sorted-token or
          whitespace-normalized digest) or state that it is run-specific.
    census_SRC_4:
      claim_under_test: '`Heuristic` occurs 0 times and `Conjecture` 0 times; the single `Assumption` conditions a cost-comparison table, not the reduction.'
      result: CONFIRMED
      measured_case_sensitive_over_3_independent_extractions:
        Heuristic: 0
        Conjecture: 0
        Assumption: 1
        Theorem: 28
        Lemma: 60
        Proposition: 19
        unconditional: 4
      all_seven_match_the_recorded_table: true
      additional_measurements_by_this_validator:
        numbered_environments_matching_'(Heuristic|Conjecture|Assumption)\s*\d+': []
        Hypothesis_capitalized: 0
        Claim_capitalized: 0
        heuristic_lowercase: 14
        split_token_check: 'zero occurrences of "Heuris" or "Conjec" outside full words, so no hyphenation-hidden matches'
      assumption_locus_verified: >-
        The single capitalized `Assumption` is in Appendix C ("The 0.72 βkey
        estimate of §7"): "The blocksize model is the heuristic GSA-intersect
        estimate (GSA: Geometric Series Assumption), as used for [HAWK25,
        Table 8]". It is the standard Geometric Series Assumption naming a
        blocksize model for HEURISTIC cost estimates. It is not a hypothesis of
        Theorem 6.1, whose proof (steps 1-3, §6) uses LLL, Ducas's block
        reduction and an exact-SVP oracle only. CLAIM CONFIRMED.
      material_qualification_this_validator_adds:
        id: Q5
        finding: >-
          The census counts a CAPITALIZED token. It is exact, but the framing
          headline "this attack has no heuristics"
          (disclosed_attack_transcription.md:17) is broader than the measurement.
          Lowercase `heuristic` occurs 14 times, and three components of the
          paper ARE heuristic:
          (1) §6.1/Appendix C heuristic key-recovery gate totals of about 2^80.8
              (HAWK-512) and 2^146.5 (HAWK-1024), against the specification's
              2^150 and 2^288 - separate from the provable totals;
          (2) the end-to-end demonstration - "The released code is the heuristic
              implementation of §6.2, not the provable reduction of §5: its SVP
              stage is progressive BKZ plus a sieve", and §6.2 "replac[es] the
              provable LIP solvers with heuristic lattice reduction and tak[es]
              two shortcuts";
          (3) the scope extension to non-power-of-two conductors: "we expect
              heuristic lattice reduction to find it at blocksize somewhat below
              φ(m)/2".
          The artifact flags only (1)'s Core-SVP sibling (line 148). The correct
          scoping downstream must carry is: the REDUCTION (Theorem 6.1) is
          unconditional and heuristic-free - which I confirm - while several
          COST and DEMONSTRATION claims in the same paper are heuristic. The
          recorded finding is true as stated about numbered heuristics; the
          headline invites a stronger reading than the measurement supports.
        severity: qualification
    census_SRC_1:
      claim_under_test: 'exactly ONE numbered heuristic, `Heuristic 1`'
      result: CONFIRMED
      measured:
        numbered_heuristic_environments: 1
        regex_'Heuristic\s*\d+'_matches: ['Heuristic 1', 'Heuristic 1', 'Heuristic 1']
        note_on_the_three_matches: >-
          One is the environment statement in §4; the other two are back-
          references in the §6 Conclusion. There is exactly ONE distinct numbered
          heuristic. CLAIM CONFIRMED.
        Heuristic_capitalized_total: 6
        breakdown_of_the_six: >-
          "Gaussian Heuristic" (standard name, §2); "4 Heuristic Hardness of SVP"
          (section title); "Heuristic 1." (the environment); "5 Group-theoretic
          Heuristics" (section title); two references to Heuristic 1 in §6.
        Conjecture: 0
        Theorem_capitalized: 7
        Lemma_capitalized: 11
        Proposition_capitalized: 7
        Assumption_capitalized: 1
        all_numbered_environments_found:
          ['Definition 1', 'Heuristic 1', 'Lemma 1', 'Lemma 2', 'Lemma 3', 'Proposition 1', 'Proposition 2', 'Theorem 1']
      qualifications:
        - id: Q6
          location: 'heuristics_transcription.md:30-31 and KN-LIT-7673:49'
          issue: >-
            The enumerated census list ("`Heuristic 1` ×1, `Theorem 1`,
            `Proposition 2`, `Lemma 1`-`Lemma 3`, `Conjecture` ×0") omits
            `Proposition 1` and `Definition 1`, which also exist. It is presented
            as what the census "found", not as an exhaustive list, so it is not a
            false claim; the load-bearing count (exactly one numbered heuristic,
            zero conjectures) is exact.
          severity: minor
        - id: Q7
          issue: >-
            SRC-1 also carries an unrecorded further assumption underpinning
            Heuristic 1's justification: "Note that we use the Geometric Series
            Assumption (GSA) for this estimate ... and there are better
            simulators for these lengths [CN11, BSW18]". Neither transcription
            nor KN-LIT-7673 records it. It strengthens, not weakens, the batch's
            reading (SRC-1's heuristic layer is thicker than one numbered
            environment), and should be carried into ideation.
          severity: qualification

  # ------------------------------------------------------------------
  # DUTY 3 - PROVENANCE-LEVEL CHECK
  # ------------------------------------------------------------------
  duty_3_provenance:
    result: PASS
    kn_lit_7673_level:
      citation_verified: read
      confidence: reported
      matches_required: true
      bibliographic_verification_by_this_validator: >-
        Source PDF header reads "IACR Communications in Cryptology ISSN
        3006-5496, Vol. 2, No. 2, 12 pages. https://doi.org/10.62056/a3qjp2w9p",
        authors "Daniël M. H. van Gent and Ludo N. Pulles", Centrum Wiskunde &
        Informatica, Cryptology Group, Amsterdam. The entry's title, authors,
        year, venue string ("Vol. 2, No. 2, 12 pages") and DOI all match exactly.
      content_claims_verified_verbatim_against_full_text:
        - '"speeds up the key recovery attack on HAWK at least quadratically, which would halve the number of security bits" (abstract) - entry line 26-27 quotes the second half exactly.'
        - '"plausibly no more trivial automorphisms that allow winning the omSVP game easily" (abstract) - entry line 31-32 exact.'
        - '"verified experimentally [AGVW17, DDGR20, PV21]" - entry line 53 exact.'
        - 'Proposition 2 statement: "computes a nonzero sublattice Λ of rot(Q) of rank at most n/2 such that λ1(Λ) ≤ √2" - entry line 38 exact.'
        - 'Theorem 1 blocksize β = n/4 + 1, and §6 "β = rk(Λ)/2 + 1 ≤ n/4 + 1" - entry lines 40, 42 exact.'
        - 'Luo et al. (Asiacrypt 2024) omSVP history - present in abstract.'
      confidence_reported_is_correct: >-
        The entry states "reading a paper is not reproducing it. Nothing here was
        re-derived", and lists what is not verified. Correct at `reported`.
    kn_lit_7592_upgrade:
      claim_under_test: 'the web->read upgrade edited NO existing claim'
      result: CONFIRMED_MECHANICALLY
      measured: >-
        git diff 6027d933:knowledge/literature/KN-LIT-7592.md
        3a39803c:knowledge/literature/KN-LIT-7592.md gives 21 insertions,
        1 deletion. The SINGLE deleted line is `citation_verified: web`. Every
        other change is a contiguous insertion of the annotation blockquote after
        the frontmatter. No body line was modified, reordered, or removed.
      self_referential_claims_in_the_annotation_checked:
        - claim: 'a grep for `upgrade|discharg|heuristic.*pricing` over the pre-upgrade entry returns zero (disclosed_attack_transcription.md:128-131)'
          result: CONFIRMED - zero matches against 6027d933's version.
        - claim: 'KN-LIT-7592 already recorded "unconditional and deterministic, with no numbered heuristics" at its line 73 and cited the [GP25] descent at line 43'
          result: CONFIRMED - both lines are exactly as cited in the pre-upgrade version.
    secondary_reporting_laundering_check:
      result: PASS_WITH_RESIDUAL
      method: >-
        Grepped the full SRC-4 text for each figure and characterization asserted
        in KN-LIT-7592 and KN-LIT-7673, and read the surrounding context.
      primary_source_confirmations:
        - 'Abstract verbatim: "unconditional, deterministic polynomial-time reduction from HAWK-n key recovery over Kn = Q(ζ2ℓ) to poly(n) calls to an exact Shortest Vector Problem (SVP) oracle in dimension n/2 + 1, where n = 2ℓ−1 is the ring degree" - KN-LIT-7592:43-45 accurate.'
        - '2^150 -> 2^108 (HAWK-512) and 2^288 -> 2^182 (HAWK-1024) in the [AGPS20] gate-count model - IN THE ABSTRACT. KN-LIT-7592:71-72 adds "at most", a hedge supported by §6.1 ("the provable totals above are thus conservative"). NOT a secondary figure.'
        - 'β_key ∈ {211, 452, 940} [HAWK25, Table 7] - in §1. Accurate.'
        - 'O(n^2 log n) oracle calls; "In practice, a single progressive sieve sufficed for HAWK-256" - §2.1. Accurate.'
        - 'Proposition 4.5: "(Λ(τ)_I, Q(τ)) ≅ √(n/4) Z^{n/2+1} ⊕ √(n/2) Z^{n/2−1}" - KN-LIT-7592:60-61 exact.'
        - '"recovers a HAWK-256 secret key end-to-end in a few hours on a single server" - abstract. Accurate.'
        - '"The construction does not transfer to Falcon. Conductors m ∈ {p^k, 2p^k} (p an odd prime), i.e. the m > 4 with cyclic (Z/m)^×, evade the attack" - abstract. KN-LIT-7592:77-80 accurate.'
        - 'Exactly two of the 2(n/2+1) candidates, ±V_τ, satisfy Y ≡ I (mod 2) - §5/Appendix D. Accurate.'
      residual_R1:
        location: 'KN-LIT-7592:81-84 (pre-existing, NOT created or edited by TASK-20260802-004)'
        text: '"The attack is exponential, not polynomial: it is a faster exponential-time attack. Per the accompanying blog post, the practical consequence is that HAWK key sizes must roughly double for the claimed security levels..."'
        measurement: 'the strings "exponential", "double", "Claude" and "agentic" occur ZERO times in the SRC-4 PDF.'
        assessment: >-
          NOT laundering. The key-size-doubling consequence is explicitly
          attributed in-line to the blog post, and the discovery attribution
          ("Claude Mythos Preview in an agentic harness") is explicitly
          cross-referenced to [[KN-LIT-7594]]. The one unattributed gloss - "The
          attack is exponential, not polynomial" - is a correct and DEFLATING
          inference from the paper's own "With the provable sieve of [ADRS15] as
          the oracle this gives time 2^{(n/2+1)+o(n)} unconditionally", but it
          uses a word the paper never uses inside a section headed "Key claims
          (as reported)".
        residual_obligation: >-
          `citation_verified: read` now covers an entry two of whose sentences
          are sourced from the accompanying blog post rather than the PDF.
          Downstream must not read the `read` flag as primary-source
          verification of those two sentences. Recommend a one-line note at the
          next supersession; NOT a defect requiring revision of this snapshot.
      residual_R2:
        location: 'KN-LIT-7592 annotation ("The full text was obtained ... and read") vs KN-LIT-7592:119-123 ("read at the level of the abstract, introduction, and technical overview (§§1-2)"; "§§3-9 and appendices were not read line by line")'
        assessment: >-
          Self-consistent under SEEDING.md's definition of `read` ("you fetched
          the actual paper and the claims in this entry reflect its real
          content"), which the entry satisfies - I re-verified every content
          claim above against the full text myself. But the annotation's
