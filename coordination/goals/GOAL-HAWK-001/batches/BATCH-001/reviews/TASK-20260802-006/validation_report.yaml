  limitations:
    - >-
      This validation establishes that the receipt is admissible and the
      transcription faithful. It establishes NOTHING about whether the
      Straznickas-Weis reduction, the van Gent-Pulles descent, or any HAWK
      attack is correct. No lemma was re-derived, no implementation run, no
      certificate produced or checked.
    - >-
