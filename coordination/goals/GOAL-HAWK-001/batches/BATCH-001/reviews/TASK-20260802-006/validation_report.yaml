    - 'It does not establish that the gate-count figures 2^150 -> 2^108 and 2^288 -> 2^182 are correct. They are relayed at `reported` confidence and inherit every modelling assumption of [AGPS20] and of the HAWK specification.'
    - 'It does not establish that any formula in either transcription is mathematically correct. Several are demonstrably damaged; the finding is that no claim depends on one.'
    - 'It does not verify [HAWK25] Tables 7 and 8, §5.1 or §5.3 - the HAWK Round-3 specification remains unread by this program, so every [HAWK25] reference is relayed from SRC-4.'
    - 'It does not adjudicate the pause-condition-2 / source-exhaustion claim (Red Team duty, TASK-20260802-007).'
    - 'It authorizes no promotion, no hypothesis, no experiment, and no claim-tier movement. RQ-HAWK-001''s claim-tier ceiling is untouched and GOAL-HAWK-001.active_hypothesis_ids stays empty.'
    - 'A passing verdict here means the receipt is admissible evidence of what two documents say. It is not evidence about lattices.'

