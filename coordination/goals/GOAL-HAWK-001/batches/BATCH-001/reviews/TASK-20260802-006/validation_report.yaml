      the typeset PDF. I re-read the raw pdfminer output around every quoted
      region; I did not render the PDFs. The producer's own instruction stands:
      no formula from either transcription may be used in an argument without
      checking the typeset PDF.
    - >-
      SRC-2 (eprint 2026/1318, the four heuristics the goal actually asked for)
      and SRC-3 (eprint 2026/890) remain unobtained. Nothing here reduces the
      uncertainty about SRC-2's heuristics; the undischarged remainder is real.
    - >-
      knowledge/INDEX.md is inside the snapshot but outside this task's
      read_scope. Its hash was verified; its content was not.
    - >-
      Single-model independence only. This validator resolves to claude-opus-5,
      the same model as the producer and the red team. Independence here is
      PROCEDURAL (separate session, separate write scope, independent
      re-acquisition and re-measurement), not model-level. Nothing in this
      report is admissible toward the AGENTS.md rule 13 closure quorum.
    - >-
      Both PDFs were re-acquired over the same network path and proxy as the
      producer used. Byte-identical re-acquisition confirms the recorded hashes;
      it does not independently authenticate the documents against their
      publishers.

  what_this_validation_does_not_establish:
    - 'It does not establish that HAWK is broken, weakened, or safe. No security assessment of HAWK is made or supported in either direction.'
    - 'It does not establish that the Straznickas-Weis reduction is correct - only that this program transcribed its claim structure faithfully and that the paper does contain zero numbered heuristics and zero conjectures.'
