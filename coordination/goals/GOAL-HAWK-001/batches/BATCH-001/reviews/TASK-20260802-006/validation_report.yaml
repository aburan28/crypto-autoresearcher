  # ------------------------------------------------------------------
  # DUTY 1 (PRIORITY) - TRANSCRIPTION FIDELITY
  # ------------------------------------------------------------------
  duty_1_transcription_fidelity:
    method: >-
      Re-acquired both PDFs, re-extracted with pdfminer.six 20260107
      (extract_text, default layout params), normalized whitespace and
      quote/dash glyphs, then checked every block-quoted passage in both
      transcription files as 5-word shingles against the extraction, and read
      the raw extraction around each quoted region.
    part_a_damage_markers:
      result: PARTIAL
      markers_found: 5
      marker_locations:
        - heuristics_transcription.md:47 (global caveat, "Every formula below is therefore marked")
        - heuristics_transcription.md:59 (delta_beta approximation, "exponent lost")
        - heuristics_transcription.md:72 (Equation (2) of Heuristic 1)
        - heuristics_transcription.md:136 (Theorem 1 hypothesis, dropped clause)
        - disclosed_attack_transcription.md:74 (the GSA-intersect inequality)
      finding: >-
        heuristics_transcription.md satisfies part (a): it carries an explicit
        global damage caveat (lines 39-50) and marks every non-trustworthy
        formula it quotes. disclosed_attack_transcription.md does NOT: it has no
        global caveat section and carries exactly one marker, while quoting at
        least four further renderings that are damaged in the same way.
      unmarked_damaged_renderings_in_disclosed_attack_transcription:
        - line: 140
          rendered: 'time **2(n/2+1)+o(n) unconditionally**'
          source_text: 'this gives time 2(n/2+1)+o(n) unconditionally (superscript flattened by pdfminer)'
          correct_reading: '2^{(n/2+1)+o(n)}'
          load_bearing: false
          note: >-
            The prose immediately below (line 148) writes the exponent correctly
            in backticks and the reading is forced by the cited [ADRS15] provable
            sieve, but a marker was owed inside the quote.
        - line: 144
          rendered: 'our conversion 20.292β'
          correct_reading: '2^{0.292β} (the standard [BDGL16] Core-SVP exponent)'
          load_bearing: false
        - lines: 105-106
          rendered: 'for which the kernel is n Zn (Proposition D.2)'
          source_text: 'for which the kernel is exactly √n Z^n - the √ glyph and "exactly" are on separate extraction lines and were dropped'
          load_bearing: false
          note: >-
            KN-LIT-7592:65 states this only as "isometric to a scaled Z^n", which
            is the correct hedge and does not depend on the dropped radical.
        - lines: 41-42
          rendered: 'Kn = Q(ζ2ℓ) ... where n = 2ℓ−1 is the ring degree'
          correct_reading: 'K_n = Q(ζ_{2^ℓ}), n = 2^{ℓ-1}'
          load_bearing: false
          note: 'KN-LIT-7592:44-45 records both correctly with explicit markup.'
        - lines: 87-90
          rendered: 'the lattice Λ(τ) B , of rank n'
          correct_reading: 'Λ_B^{(τ)} (sub/superscript flattened)'
          load_bearing: false
    part_b_no_load_bearing_claim_rests_on_a_damaged_formula:
      result: PASS
      checked_statements:
        - statement: 'heuristics_transcription.md:54-77, Heuristic 1'
          damaged_element: 'Equation (2), rendered "p2β/k ≤ δ2β−k−1 β"'
          finding: >-
            Marked, and explicitly disowned: lines 75-77 state the reconstruction
            "is an inference by this task, not a transcription". Nothing
            downstream uses the inequality. KN-LIT-7673:39,51-53 describes
            Heuristic 1 only as "a root-Hermite-factor success condition in the
            2016-estimates methodology", which I verified against clean source
            prose ("let δβ = GH(β)1/(β−1) be the root Hermite factor";
            "We use the methodology based on the '2016 estimates' ... verified
            experimentally [AGVW17, DDGR20, PV21]"). NOT DEPENDENT.
        - statement: 'heuristics_transcription.md:131-140, Theorem 1'
          damaged_element: 'dropped hypothesis clause'
          finding: >-
            Marked. The true dropped clause, recovered by me from the line above
            in the extraction, is "and a Z-automorphism" (nontriviality carried
            by "U ∈ GL_n(Z) \ G_{n,Q}"); the transcriber guessed "a phrase such
            as and a nontrivial automorphism", which is substantively right and
            was correctly declared unreliable. The load-bearing downstream claim
            (KN-LIT-7673:36, "nontrivial Z-automorphism σ ← INPUT") rests instead
            on clean prose I verified verbatim: the §6 Conclusion ("given a
            Hermitian form Q of R2 n and a nontrivial Z-automorphism σ") and the
            abstract ("if an adversary knows a nontrivial automorphism").
            NOT DEPENDENT.
        - statement: 'disclosed_attack_transcription.md:64-81, the single Assumption'
          damaged_element: 'the GSA-intersect inequality'
          finding: >-
            Marked, and the file states the conclusion is "structural, not
            formulaic" (line 77). I confirmed the structural conclusion
            independently from the raw text. NOT DEPENDENT.
        - statement: 'disclosed_attack_transcription.md:110-134, the SRC-4/SRC-1 relationship'
          finding: >-
            Rests entirely on a prose sentence I verified verbatim in the
            extraction: "...and so upgrades the endgame from the heuristic
            pricing of [GP25, Thm. 1] to the unconditional accounting of Theorem
            6.1." No formula involved. NOT DEPENDENT.
        - statement: 'KN-LIT-7673, all claims'
          finding: 'No claim quotes or depends on a damaged formula. NOT DEPENDENT.'
        - statement: 'KN-LIT-7592 annotation (lines 22-40)'
          finding: >-
            Its two load-bearing elements are the census result (re-verified
            below) and the "upgrades the endgame" prose quote (verified
            verbatim). NOT DEPENDENT.
    quote_verification_summary: >-
      16 block quotes checked. The §5 group-theoretic quote
      (heuristics_transcription.md:103-115) matched 109/109 shingles - fully
      verbatim. Every other prose quote matched at >=90% of shingles with all
      residuals traced to line-break/hyphenation reflow (e.g. "asymp-\ntotically")
      or quotation-mark boundaries. Every substantive numeric and named element
      I spot-read against the raw extraction was correct.
    additional_fidelity_qualifications:
      - id: Q1
        location: heuristics_transcription.md:63-70
        issue: >-
          The Heuristic 1 block is presented under a heading reading "verbatim"
          but is a reading-order REASSEMBLY of scattered extraction fragments.
          The raw extraction reads "Heuristic 1. Suppose Λ ⊆ R2 / satisfies /
          n is a nonzero rank-k lattice with λ1(Λ) ≤ / [eq] / then BKZ-β will
          recover ... / 2. If β ∈ Z≥2 / (2) / √ / β". The transcriber moved
          "satisfies", joined the orphan "√" to "2.", and moved "β" under the
          display. Every token appears in the extraction and the reassembly is
          the unambiguous reading - I confirmed it - but the reassembly of the
          HYPOTHESIS is not itself covered by a marker (only the equation is).
        severity: qualification
      - id: Q2
        location: disclosed_attack_transcription.md:68-72
        issue: >-
          The Assumption quote begins mid-phrase at "**Assumption**), as used for
          [HAWK25, Table 8]:", eliding the words immediately before it. The full
          source phrase is "The blocksize model is the heuristic GSA-intersect
          estimate (GSA: Geometric Series Assumption), as used for [HAWK25,
          Table 8]". The elision hides (i) that the counted token is part of the
          standard name "Geometric Series Assumption", not a formal environment,
          and (ii) that the source itself labels the surrounding estimate
          "heuristic". A reader of the transcription alone cannot recover either.
          The conclusion drawn is nonetheless correct.
        severity: qualification
      - id: Q3
        location: disclosed_attack_transcription.md:66
        issue: >-
          "It appears in the **cost-comparison table**" is imprecise. Measured
          locus: Appendix C, "The 0.72 βkey estimate of §7", which supplies the
          blocksize model for §6.1's heuristic gate totals and §7's scope
          estimate - not inside Table 1. The substantive claim ("conditions cost
          estimates, not the reduction") is correct and I confirm it.
        severity: qualification
      - id: Q4
        location: heuristics_transcription.md:117-121
        issue: >-
          "This is the load-bearing claim of the paper for cryptanalytic purposes
          and it is not numbered" is an interpretation stated flatly, unlike the
          dependency-structure section which is correctly labelled "a reading,
          not a transcription". Relevant because the SRC-1 abstract contains a
          sentence neither transcription nor KN-LIT-7673 records: "Although this
          work does not affect the security of HAWK, it opens up a new attack
          avenue involving the automorphism group that may be theoretically
          interesting on its own." Recording the authors' own scope disclaimer
          would strengthen the entry; omitting it permits over-reading.
        severity: qualification

