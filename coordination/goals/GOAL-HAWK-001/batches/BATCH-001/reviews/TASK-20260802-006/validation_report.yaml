  scope_of_this_validation: >-
    A validity check on the BATCH-001 source package: receipts, transcription
    fidelity, the two regex censuses, and provenance level. It is NOT an
    assessment of whether any HAWK attack is correct, and confers no support on
    any HAWK security claim in either direction.

