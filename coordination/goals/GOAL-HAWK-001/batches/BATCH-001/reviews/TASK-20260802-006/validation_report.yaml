          KN-LIT-7673.md                   9f9fa3878a4502a9f621ec06d9dcecea3b0f47eb053dc84adfb68627a2b36d78
          KN-LIT-7592.md                   53b5a15bdfabd4243778fb9366e1b6f50e8c6021078b53d262bfe6e9fe661643
