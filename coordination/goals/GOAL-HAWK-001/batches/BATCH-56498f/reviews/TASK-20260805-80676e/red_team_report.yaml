  narrowest_supported_statement: >
    The set of fractional left O-ideals of reduced norm q' in an indefinite maximal
    quaternion order O over Q is infinite. This follows from: (a) Eichler's theorem
    (not Hasse-Minkowski) gives nrd surjective onto Z_{≥0}, so integral ideals of
    norm q'r² exist for all r ≥ 1; (b) for each r, choosing J with gcd(r, content(J))
    = 1 yields a fractional ideal (1/r)J with exact denominator r; (c) distinct
    denominators yield distinct fractional ideals by the minimality argument (not the
    circular norm argument). Under Case A (unbounded denominators in the sampling
    pool), the density of any fixed finite easy-instance set is 0 and the algorithm
    does not terminate in expectation. Under Case B or bounded-C (consistent with
    short-U re-randomization), the pool is finite, the density is unknown without
    the algorithm body, and the authors' characterization ("super-polynomial time")
    is consistent with Case C. No statement about HAWK security follows from this
    derivation.

