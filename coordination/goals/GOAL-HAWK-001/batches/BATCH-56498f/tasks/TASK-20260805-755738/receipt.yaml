    fractional ideal (1/r)·J has exact denominator r.  Distinct denominators
    give distinct fractional ideals (canonical form uniqueness).  Total: infinite.
  numerical_confirmation: >
    In B=M_2(Q), q'=7: cumulative fractional ideal count grows from 8 (r≤1) to
