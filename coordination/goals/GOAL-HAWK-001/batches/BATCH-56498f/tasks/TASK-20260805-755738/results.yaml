# ─────────────────────────────────────────────────────────────────────────────
# Q1: Cardinality of fractional left O-ideals of norm q'
# ─────────────────────────────────────────────────────────────────────────────
fractional_ideal_count:
  setting: "Maximal order O in an indefinite quaternion algebra B over Q"
  result: infinite
  argument: |
    By norm surjectivity (local-global principle for indefinite B over Q),
    an integral left O-ideal of norm q'·r² exists for every r ≥ 1.
    Each r produces at least one fractional ideal of norm q' with exact
    denominator r, and distinct denominators yield distinct ideals.
    The set therefore contains a copy of N indexed by r, hence is infinite.
  concrete_model: "B = M_2(Q), O = M_2(Z), q' = 7"
  numerical_evidence:
    # cumulative count of fractional left M_2(Z)-ideals of norm 7 by denominator
    cumulative_by_denominator:
      r1:  8
      r2:  56
      r3:  152
      r4:  344
      r5:  584
      r6:  1160
      r7:  1552
      r8:  2320
      r9:  3184
      r10: 4624
    growth_pattern: "strictly increasing without bound"
  algebraic_principle: >
    O is a non-commutative maximal order; the reduced norm quadric {nrd = q'} is
    a non-compact affine variety in A^4_Q with infinitely many rational points
    (the indefinite condition ensures isotropy at the real place).  The
    left O*-orbit count on this variety is infinite.  Contrast: a Dedekind domain
    (commutative) has finitely many fractional ideals of any given norm because
    prime factorization is unique and finite.
  caveat: >
    Verification used B = M_2(Q).  For ramified indefinite B, local counts at
    ramified primes differ but the divergence conclusion holds by the same
    norm-surjectivity argument.

