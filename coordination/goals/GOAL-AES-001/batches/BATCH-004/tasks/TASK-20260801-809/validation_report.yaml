verdicts:
  note: >-
    These two verdicts are kept physically separate in two files and are NEVER merged,
    averaged or carried across. The BATCH-002/BATCH-003 precedent is binding: a sound
    derivation does not validate an unsound screen, and a defect in one group does not
    touch the other. NO COMBINED VERDICT IS ISSUED and no overall grade exists.
  check_a_od4_branching_bound:
    verdict: passed
    file: coordination/goals/GOAL-AES-001/batches/BATCH-004/tasks/TASK-20260801-809/od4_bound_review.md
