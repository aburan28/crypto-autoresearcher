defects:
  - id: U-809-1
    severity: medium
    check: a
    class: unnumbered_conditional_dependence
    statement: >-
      Proposition 806-1 SILENTLY INHERITS PROP-701-I's unrestricted "for EVERY state s"
      quantifier. LEM-806-2's step "the four coordinates are perturbed by four INDEPENDENT
      elements of K" is valid only because each input word ranges over its ENTIRE coset,
      which is hypothesis (H2). Under a restriction to a structured state set - D-705-5 hole
      (ii), the very hypothesis TASK-20260801-807 measured IN THE SAME BATCH - the reachable
      perturbation set is a proper subset of F^S and B >= q DOES NOT FOLLOW. The dependence
      is numbered NOWHERE and appears in NONE of R806-1..7; section 5.5's "not reached at
      all" list names layer-dependence, non-linearity, GF(2)-linearity and multi-word
      objects but NOT the state quantifier. 807's measurement that 12.5% of admissible
      configurations collapse the sweep to reach 1 is direct evidence the restriction bites
      on exactly the freedom LEM-806-2 consumes. GATE (2) FAILS ON THIS.
    severity_reasoning: >-
      Medium not high: the object class in section 2 does state "for every state s" in the
      hypothesis, so the dependence exists in the definition; the defect is that it is never
      carried into the heuristics or limitations, where a reader looks for it.
  - id: D-809-4
    severity: medium
    check: a
    class: scoping_framing
    statement: >-
      The dispatch card asked for a bound on B FOR A GIVEN ENTROPY LOSS. Proposition 806-1's
      bound is INDEPENDENT of L, so there is NO trade-off between L and B in the
      proposition - it is not a cost inequality in the card's sense. Corollary 806-2 restores
      a trade-off shape only by substituting a different quantity (yield Y) and is an
      immediate rearrangement of B >= 2^8 with the trivial ceiling B <= 2^(32-L). The
      package's exponent-relevant yield must be recorded as AN EXACT ONE-INTERFACE BRANCHING
      FORMULA FOR A STRICTLY LINEAR SUBCLASS PLUS A PROOF THAT OD-4's HOPED-FOR INEQUALITY
      SHAPE CANNOT EXIST, and NOT as "a cost inequality was obtained". Raised to medium
      because it is the sentence most likely to be mis-transcribed downstream.
  - id: D-809-5
    severity: low
    check: a
    class: control_attribution
    statement: >-
      CTRL-NULL-1 does not isolate "M has no zero block" either. VALIDATOR-SIB-1 and -2 are
      invertible, are NOT block-decomposable, violate only property P, and BOTH read min
      B = 1 over the exhaustive 78899-subspace enumeration. "No zero block" is sufficient to
      break the bound, not necessary; P is the operative property. Section 7's concluding
      sentence names P correctly; its table sentence and the commit message do not, and the
      package contains no control discriminating the two. Same failure class as V-804-1 at
      reduced severity, found by the method that found V-804-1. Does not affect AES's M.
  - id: D-809-1
    severity: low
    check: cross
    class: evidence_integrity_annotation
    statement: >-
      The snapshot receipt asserts a self-digest (ea8376949968...) that no party can verify
      and that the validator could not reproduce under three reconstructions. Bytes at
      cc660597 hash to d58e80deaffb..., at HEAD to 7ae1d254ae02.... Honest disposition is
      null-with-a-note, as hash_status already does for other fields. NOT A PRODUCER DEFECT
      and nothing turns on it: all eight producer artifacts verify exactly.
  - id: D-809-2
    severity: low
    check: a
    class: prose
    statement: >-
      "all 69 proper minors plus the determinant" - there are 68 proper minors plus the
      determinant = 69 total. The validator computed 69 minors of all sizes, 0 singular.
      Prose only; the computation is right and M is MDS.
  - id: D-809-3
    severity: low
    check: a
    class: overstatement
    statement: >-
      "No lower bound of the shape B >= f(L,n) with f INCREASING in L can exist" is proved
      only for STRICTLY increasing f. A weakly-increasing f capped at 2 is not excluded by
      B <= 2^(32-L), merely vacuous. Substantive claim correct; universal phrasing one notch
      stronger than the argument.
  - id: D-809-6
    severity: low
    check: b
    class: scoping_note
    statement: >-
      6 of 8 OD-3 rejections are memory-dependent and unverifiable in this environment, so
      the outcome NO_ADMISSIBLE_MEMBER is CONDITIONAL ON UNVERIFIABLE RECOLLECTIONS and must
      not be transcribed downstream as an established non-existence result. The producer
      states the posture correctly (recall confidences recorded, strongest form "matches a
      family recalled from memory", never "known to be known"); this is a ledger scoping
      note, not an error.
  - id: D-809-7
    severity: low
    check: b
    class: completion_gate_provenance
    statement: >-
      TASK-20260801-807's artifact_provenance uses kind values machine_readable_prescreen,
      source_code, machine_readable_manifest, prose_report. Part B requires kind to be "one
      of these class names" and machine_readable_prescreen is NOT one of the four. No
      attributability is lost - the artifact is unambiguously a manifest and its digest is
      bound and verified - but it is a literal non-conformance of the clause audited here,
      and the Coordinator's audit recorded 806 as using the class names verbatim without
      making the corresponding negative finding for 807.
