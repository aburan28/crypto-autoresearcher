what_a_passed_verdict_means: >-
  ADMISSIBLE EVIDENCE, AND NOTHING MORE. It does not support any AES claim at any round
  count, does not demonstrate a speedup, does not establish a barrier, does not assign
  evidence strength, and does not authorize promotion. Everything reviewed is TOY SCALE
  in GF(2^8) component algebra and GF(2^4)/GF(2^2) analogues. No official state is changed
  by this report.

