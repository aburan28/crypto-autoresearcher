recomputations_performed:
  general: >-
    All arithmetic below is the validator's own: GF(2^8)/GF(2^4)/GF(2^2) multiplication,
    RREF, subspace enumeration, minors, ShiftRows incidence and the branching and reach
    computations were re-implemented from scratch. No code and no constant was taken from
    od4_branching.py or od3_quantifier.py.
  od4_gf256:
    - {check: "M = circ(02,03,01,01) all 16 entries nonzero", result: TRUE, agrees_with: PRED-1}
    - {check: "MDS: minors of all sizes", computed: 69, singular: 0, result: MDS_TRUE, agrees_with: PRED-2}
    - {check: "dim(W_S cap F^S) over all 16 S", mine: "s=0:0 s=1:0 s=2:0 s=3:2 s=4:4", matches: "max(0,2s-4)", agrees_with: PRED-3}
    - {check: "Assembly minimisation, own derivation", min_exponent: 1, conclusion: "B >= q^1 = 256", verdict: FOLLOWS}
    - {check: "tightness L=8 K=span(e0)", exponent: 1, B: 256, verdict: HOLDS}
    - {check: "tightness L=16 K=W_S cap F^S, S={0,1,2}", exponent: 1, B: 256, verdict: HOLDS}
    - {check: "tightness L=24 K=span(e0,e1,e2)", exponent: 1, B: 256, verdict: HOLDS}
    - {check: "Corollary 806-2 L+Y<=24 from B>=2^8 and B<=|X|=2^(32-L)", verdict: FOLLOWS}
    - {check: "section 6.2: GF(2)-linear functional on >=2 bytes gives proj_i(K)=F all i, B=|X|=2 at L=31", verdict: CORRECT}
  od4_gf16_analogue:
    subspaces_enumerated: 78899   # + 2 trivial = 78901, exactly the producer's count
    B_histogram: {16: 4377, 256: 70303, 4096: 4219}
    min_B: 16
    per_dim_minima: [16, 16, 16]
    agrees_with_producer: EXACT
  od4_gf4_analogue:
    subspaces_enumerated: 527     # + 2 trivial = 529, exactly the producer's count
    min_B: 4
    minors_total: 69
    minors_singular: 24           # producer: 16 vanishing 2x2 + 8 vanishing 3x3 = 24
    MDS: false
    agrees_with_producer: EXACT
  od3_hole_ii_gf16:
    readings:
    - {reading: "admissible configurations over all 2^16 patterns x p x i x k", producer: 2097152, mine: 2097152}
    - {reading: "distinct reach sizes", producer: [1, 16], mine: [1, 16]}
    - {reading: "histogram", producer: {1: 262144, 16: 1835008}, mine: {1: 262144, 16: 1835008}}
