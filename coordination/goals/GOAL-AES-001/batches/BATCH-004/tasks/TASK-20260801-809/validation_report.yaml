controls_and_null_objects:
  inventor_protocol_section_3_check: >-
    A statistical signal without a null-object control is not evidence. Both packages
    carry null objects of the same shape, exhaustively enumerated rather than sampled, and
    in both the statistic DOES decay as it should when the property meant to destroy it is
    negated (min B collapses q -> 1; constancy-forced collapses 60/60 -> 0/60). No
    "quantity that fails to decay" tell is present in either package.
  producer_controls_reproduced_by_validator:
    - {control: "target circ(02,03,01,01)", min_B_mine: 16, reading: "bound holds"}
    - {control: "CTRL-NULL-1, 2x2 zero block", min_B_mine: 1, reading: "bound fails"}
    - {control: "CTRL-NULL-2 sibling, exactly one zero entry", min_B_mine: 16, reading: "bound holds"}
  validator_built_sibling_null_F4:
    why: >-
      A producer catching its own defect does not mean the REPLACEMENT property is
      isolated. V-804-1 was found by building the null nobody built, so the validator
      built the null against the replacement property.
    replacement_property_P: "no proper nonempty S has W_S contained in F^S"
    structural_observation_by_validator: >-
      With all entries of M nonzero every column has full support, so W_S subset F^S is
      IMPOSSIBLE for proper S. "All entries nonzero" therefore IMPLIES P outright, which
      is the mechanism behind PRED-8's inconvenient outcome.
    controls_built:
      - id: VALIDATOR-SIB-1
        matrix: "[[2,3,1,1],[0,2,3,1],[0,1,2,3],[0,1,1,2]] over GF(2^4)"
        invertible: true
        violates_P_at: ["S={0}"]
        has_zero_block: false
        min_B_exhaustive_over_78899_subspaces: 1
      - id: VALIDATOR-SIB-2
        matrix: "[[2,3,1,1],[1,2,3,1],[0,0,2,3],[0,0,1,2]] over GF(2^4)"
        invertible: true
        violates_P_at: ["S={0,1}"]
        has_zero_block: false
        min_B_exhaustive_over_78899_subspaces: 1
    finding: >-
      Property P IS the operative one and is NOW GENUINELY ISOLATED, by a null the producer
      did not build. This STRENGTHENS Proposition 806-1's attribution. But the producer's
      own stated isolation is itself one notch over-strong: CTRL-NULL-1 does not isolate
      "M has no zero block" either, since both validator siblings break the bound with no
      zero block present. See defect D-809-5. None of this touches AES's M, which has all
      entries nonzero and satisfies P unconditionally.

# ---------------------------------------------------------------------
flagged_item_rulings:
  F-1:
    item: "Contradiction between TASK-20260801-801 section 5 and TASK-20260801-807 section 2.5"
    ruling: >-
      BOTH ARE RIGHT IN DIFFERENT SETTINGS, ASYMMETRICALLY. (1) On the NARROW question - does
      u_k range over all of F - 807 is RIGHT and 801 is FALSE AS STATED; the validator
      reproduced 807's measurement exactly and the sweep needs only one free byte in the
      right place. (2) On the WIDE question - does Step 2's CONCLUSION (invariance for all w
      in F^4) survive - 801 is RIGHT and 807 agrees (its own 2.5(2)). (3) On the CONCLUSION
      "does not survive the restriction even partially" 801 is RIGHT, and 807's data support
      it MORE strongly than 801's own argument did. THEREFORE the disagreement is a REFERENT
      disagreement about the phrase "Step 2's sweep": 801 NAMED THE WRONG MECHANISM FOR A
      CORRECT CONCLUSION. The load-bearing use of the full quantifier is Step 2's
      RE-APPLICATION of Step 1, not the sweep.
    recommended_disposition: >-
      Record as a MECHANISM CORRECTION, not as a defect in TASK-20260801-801's disposition:
      nothing that record concluded is overturned and its "hole (ii) stands open, untouched"
      verdict is unaffected. NEITHER RECORD SHOULD BE EDITED. 807's decision to record the
      contradiction rather than smooth it (its 4.4(7)) is correct conduct.
    caveat_against_own_ruling: >-
      807's relocation to the re-application is a description of a measured family,
      explicitly not claimed as a theorem and not exhaustively characterised. The validator
      did NOT re-execute the 2.4 closure fixpoint, so point (3) rests in part on producer
      measurements reproduced only in part (the SCC structure).
  F-2:
    item: "Is Proposition 806-1 a result about OD-4 at all?"
    ruling: >-
      THE FRAMING IS HONEST AND THE SCOPING IS CORRECT. The validator worked every step and
      confirms NO step uses group growth, the (lambda,k) graph, transitivity of invariance,
      or more than one interface: it is coordinate-support and minor algebra at ONE
      interface, exactly as the producer says in the STATEMENT rather than a footnote. Two
      distinct questions are answered NO and both answers are earned - whether the
      Step-1/2/3 machinery forces a B-L-n inequality (no, with a re-derivable breaking
      step), and whether OD-4's hoped-for SHAPE can exist at all (no, by B <= 2^(32-L)).
      The smaller class is declared everywhere it matters (R806-1 forbids quoting it as an
      OD-4 bound) and no place in the package quotes it as one. It is NOT a qualitative
      statement dressed as a cost inequality - the handoff's named target defect - it is an
      EXACT closed form whose minimum the validator recomputed.
    scoping_imprecision_found: D-809-4
  F-3:
    item: "Gate (4)'s review half"
    performed_by_this_report: true
    per_gate_finding_by_validator:
      gate_1_proof_decomposition:
        stands: "FOR THE PROPOSITION ONLY; DEGENERATE FOR THE COST MODEL"
        basis: >-
          LEM-806-1..4 are genuinely single-responsibility and each was worked in isolation;
          the Assembly is a correct finite minimisation the validator recomputed. Section
          5.1 does name an attempt, a per-attempt cost and a success probability and does
          multiply them - but the TABULATED column is the frontier column where p = 1 BY
          CONSTRUCTION, so the inverse-success factor is 1 and the bookkeeping does no work
          in the number actually used. Present and honest; not load-bearing.
      gate_2_numbered_heuristics:
        stands: false
        basis: >-
          HEUR-806-3 (baseline) and HEUR-806-4 (four-word independence) carry NO schedulable
          validation experiment and both are load-bearing for any barrier reading. HEUR-806-1
          and -2 are good specimens with falsifiable experiments.
        unnumbered_conditional_dependence_found: U-809-1
      gate_3_concrete_cost_table:
        stands: false
        basis: >-
          Creditable: memory alongside time, explicit time-memory tradeoff (MITM, which the
          producer notes DESTROYS its own barrier reading at n=7), parallelization, hidden
          overhead (2^72 relation table for general pi), six assumptions each flagged WITH
          DIRECTION, affected-vs-safe statement. Not met because the central column's
          J = 2^32 is MEASURED AT SIX WITNESSES, NOT ESTABLISHED as a minimum (HEUR-806-1)
          and no alternative baseline is costed (HEUR-806-3). Additionally peak RSS was NOT
          MEASURED (/usr/bin/time absent) and is correctly reported as not measured rather
          than estimated, so every memory figure is MODELLED.
      gate_4_independent_review_and_red_team:
        stands: false
        basis: >-
          Satisfied by THIS REVIEW TOGETHER WITH the TASK-20260801-810 RED TEAM and by
          NOTHING TASK-20260801-806 DID. The review half is performed here; the red-team
          half is OUTSTANDING (810 has not run). The review half is itself weakened: this
          session supplies SESSION and NOT MODEL independence.
    plain_statement: >-
      NO GATE PACKAGE STANDS. Gate (1) stands for the proposition only and is degenerate for
      the cost model; gate (2) does NOT stand and now has an unnumbered dependence against
      it; gate (3) does NOT stand; gate (4) is HALF-PERFORMED. No promotion is supportable
      on this material. The producer said the same and asked for nothing.
  F-4:
    item: "Verify 806's self-caught V-804-1-class defect, then build the sibling null nobody built"
    verification: >-
      CONFIRMED on every count by exhaustive recomputation over all 78899 GF(2^4) subspaces:
      CTRL-NULL-2 negates "all entries nonzero" and the bound SURVIVES (min B = q), so
      CTRL-NULL-1 does not isolate that property. PRED-8 was pre-registered and held in the
      INCONVENIENT direction. MDS is NOT load-bearing.
    sibling_null_built: "VALIDATOR-SIB-1 and VALIDATOR-SIB-2 - see controls_and_null_objects"
    outcome: "Replacement property P confirmed operative AND now isolated; producer's stated isolation over-strong by one notch (D-809-5)."
  F-5:
    item: "807's null_3 isolates strong connectivity; does the restraint hold and does anything read it as a discharge?"
    ruling: >-
      RESTRAINT IS CORRECT. null_3 (1,1,1,6) is invertible, has all entries nonzero, and has
      5 SCCs of size 12 - all reproduced from the validator's own edge rule - and reads 0/60
      against the target's 60/60, so it DOES isolate strong connectivity for 807's closure
      statistic. It does NOT discharge V-804-1, for a reason worth stating: ISOLATION IS A
      PROPERTY OF AN INSTRUMENT, NOT OF AN INGREDIENT. V-804-1 is a defect in GATE-701-C v2,
      a different instrument answering a different question.
    downstream_discharge_audit: >-
      CLEAN. Every V-804-1 reference in BATCH-004 (od3_and_hole_ii_report.md lines 22, 81,
      260-264; od3_results.json line 11317; od4_branching_bound_report.md lines 476, 492;
      dispatch_plan.md) scopes the claim or denies discharge. dispatch_plan.md still records
      that no reject_scoped may be considered until a control isolates the ingredient it
      negates. NOTHING READS null_3 AS A DISCHARGE.
  F-8:
    item: "Did either falsified pre-registration silently propagate into a surviving conclusion?"
    PRED-11_806:
      finding: "NO CONCLUSION RESTS ON IT."
      basis: >-
        Sections 5.2/5.3 use J = 2^32 as the MEASURED value - the falsifying measurement
        itself - correctly labelled "measured at those kernels only, not an exhaustive
        minimum". The falsification moved the number UPWARD, i.e. in the direction that
        FLATTERS a barrier reading, and the producer flags exactly this as OPT-5,
        "PESSIMISTIC (favours the barrier reading), and therefore the one to attack", and
        declares gate (3) unmet on it. Correct handling.
    P_b7_807:
      finding: "NO CONCLUSION RESTS ON IT; the falsification is the EVIDENCE FOR the new reading."
      basis: >-
        The 13-active vs 15-active contrast that falsifies P_b7 is precisely what locates
        the binding constraint at Step 2's re-application. Prediction left as written,
        labelled DISAGREES in both directions, the derived reading explicitly NOT claimed as
        a theorem (2.5(4)) and the missing exhaustive characterisation named (4.4(2)).
    also_checked: "P_b3 PARTIAL and P_a1 PARTIAL - both left as written, causes diagnosed, residuals named. Positive control P_b8 did not fire (VOID-A not triggered)."
  D-808-1:
    item: "Coordinator ruling that amendment 004 Part B's MACHINE_READABLE_MANIFEST clause imposes a PER-TASK obligation discharged by the covering manifest, referred here for possible overturn."
    ruling: UPHELD - NOT OVERTURNED
    severity_of_underlying_residual: low
    reasoning:
      - >-
        PURPOSIVE. Part B's own why_here states the clause exists to fix D-803-1, i.e. to
        ensure EVERY DECLARED ARTIFACT IS BOUND BY PATH AND DIGEST TO A TASK-LEVEL INFERENCE
        BLOCK. That purpose is fully served by one covering list per task. A duplicate list
        inside a covered artifact adds ZERO attributability.
      - >-
        EMPIRICAL, AND THIS ARGUMENT WAS NOT AVAILABLE TO THE COORDINATOR. The literal
        reading demands mutually-referencing digest lists, neither of which can contain its
        own digest without a fixed point. The validator OBSERVED exactly this pathology in
        practice: the snapshot receipt's self-declared digest ea8376... could not be
        reproduced under three reconstructions of its byte-state, and both covering
        manifests carry unverifiable self-referential entries. THE LITERAL READING
        DEMONSTRABLY GENERATES DIGESTS NO PARTY CAN VERIFY. That is decisive against it.
      - >-
        TEXTUAL. Both producer cards say "the covering MACHINE-READABLE MANIFEST", singular.
        The Coordinator's reading is the cards' own, not an accommodation invented late.
      - >-
        VERIFIED IN FACT. The validator recomputed both pre-screens' digests from the
        committed bytes: prescreen_od4.json and prescreen_od3.json BOTH MATCH the values
        asserted in their covering manifests' artifact_provenance lists. The obligation's
        substance is met.
    scope_limit_imposed_on_the_ruling: >-
      The ruling is NOT a general licence. It holds precisely when the manifest in question
      is ITSELF AN ENTRY in another manifest's artifact_provenance list of the same task,
      with its digest asserted and verifiable. Both pre-screens satisfy this. A manifest
      bound by nothing would still fail the clause.
    drafting_correction_recommended: >-
      Part B as drafted QUANTIFIES OVER THE CLASS. It should say "AT LEAST ONE
      MACHINE_READABLE_MANIFEST per task, designated the COVERING manifest, carries an
      artifact_provenance list covering every declared artifact of the task; every other
      manifest of the task must appear as an ENTRY in it." Recommended as a Part-B erratum
      in the next amendment. THIS IS A COORDINATOR DRAFTING RESIDUAL, NOT A PRODUCER DEFECT.
    additional_finding_while_auditing_this_clause: D-809-7

