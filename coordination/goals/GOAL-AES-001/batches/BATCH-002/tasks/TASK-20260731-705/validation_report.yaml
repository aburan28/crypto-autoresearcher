  # =====================================================================
  defects:
    - id: D-705-1
      severity: medium
      check: a
      statement: >-
        GATE-701-C's null_2 (circulant (02,00,01,01) over GF(2^4)) does not
        discriminate. Validator measurement: 65535/65535 kernels close to
        dimension 16, the same reading as the AES-shaped matrix, which fires the
        gate's own pre-declared VOID condition. Additionally null_1's predicted
        stall dimension is 4 in the report and 1 in measurement. Cause: "every
        entry nonzero" is a SUFFICIENT hypothesis of the proof's Step 2, not a
        necessary one, so negating it need not change the conclusion — a null
        built by negating a sufficient hypothesis is not automatically
        discriminating.
      mitigation_recorded: >-
        null_1 discriminates sharply and is the report's designated sensitivity
        anchor; the AES-shaped case passes exhaustively when run.
      not_repaired: true
    - id: D-705-2
      severity: low
      check: a
      statement: >-
        verify_derivation.py claim C0 cannot import the BATCH-001 harness because
        the module is not registered in sys.modules before exec_module, so
        @dataclass resolution raises AttributeError. Script defect. C0's intent
