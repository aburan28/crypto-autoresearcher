      not_repaired: true
    - id: D-705-3
      severity: informational
      check: a
      statement: >-
        Derivation note section 2.4's phrase "1073758335 independent binary
        choices" is loose; the number is an orbit count, as the note itself
        states two lines later and again in section 2.7.
    - id: D-705-4
      severity: informational
      check: a
      statement: >-
        PROP-701-I's OD-1 scope text describes the argument as iterating "an
        unbounded number of times", overstating the cost of re-application: the
        hypothesis is a single universally-quantified statement re-applied at no
        extra assumption. The substantive point (layer-dependence breaks the
        proof) is correct.
    - id: D-705-5
      severity: low
      check: a
      statement: >-
        PROP-701-I does not name two scope holes: (i) word-position-dependent
        families pi_0..pi_3 within a single layer, which is neither OD-1
        (layer-dependence) nor OD-2 (multi-word domain) and which breaks the
        index bookkeeping of Steps 1-2; (ii) restriction of the "for EVERY state
        s" quantifier to a structured subset of states. Neither invalidates any
        step; both narrow the closure.
      not_repaired: true
    - id: D-705-6
      severity: low
      check: cross-cutting (evidence integrity)
      statement: >-
        The TASK-20260731-704 snapshot receipt still carries commit_sha: null and
        parent_sha: null. Not blocking — the digest binding is complete and was
        verified against Git by this task.
    - id: D-705-7
      severity: medium
      check: b
      alias: ER-6
      statement: >-
        NEW ESCAPE ROUTE, found by this validator. mutation_control_v2.py returns
        verdict pass with all five components true on an aes_reduced.py that is
        demonstrably wrong for final_mix_columns=True with 24- or 32-byte keys,
        because build_tasks() generates fmc=True only for 16-byte keys. This is
        the H-3 failure shape (a bug in an unexercised regime) recurring on a
        different axis inside the repair that closes H-3. Coverage hole, not a
        scoring bug; the receipt's claims are not falsified, but the bound on
        what a green certifies is not written down.
      not_repaired: true
    - id: D-705-8
      severity: low
      check: b
      statement: >-
        Neither repair_receipt.json nor repair_report.md states the
        (key length x final_mix_columns) coverage boundary of the task set, so a
        reader cannot see from the artifacts which regimes a green covers.
        checks_not_run documents other boundaries carefully; this one is absent.
    - id: D-705-9
      severity: low
      check: c
      statement: >-
        The integer division at gate_601b_impl.c:469 (P[k] / n4, executed
        1310720 times per run at n=4) is a data operation on the reorganized side
        that falls outside all four declared counting classes and is uncounted.
        Charging it at weight 1 moves the ratio 0.04437 -> ~0.04522.
    - id: D-705-10
      severity: low
      check: c
      statement: >-
        Excluding array writes is nominally symmetric but materially favours the
        reorganized side: its uncounted Walsh-Hadamard writes are ~44% of its
        counted total (30408704 writes vs 68625045 counted ops at n=4), versus
        under 1.4% for the direct side's memsets. Counting them moves the ratio
        0.04437 -> 0.06403.
    - id: D-705-11
      severity: informational
      check: c
      statement: >-
        The unweighted-convention caveat names the op-class profile asymmetry but
        does not quantify it. Validator measurement: 0.0444 unweighted, 0.3546
        under a byte-traffic weighting (int64 vs uint8 working arrays); reversal
        of the ratio requires weighting an int64 add about 48x a byte table
        lookup, which is not a defensible weighting. Direction robust, magnitude
        convention-sensitive by roughly an order of magnitude.
    - id: D-705-12
      severity: low
      check: c
      statement: >-
        Memory is reported only as whole-process peak RSS (67412 KiB), not per
        side. From the committed source at n=4 the reorganized side allocates
        ~3211264 bytes against the direct side's ~69904 — a 46x memory ratio not
        tabulated beside the 0.044 operation ratio, which the target-result
        profile's cost-honesty requirement asks for.

  # =====================================================================
  referred_defect_rulings:
    - id: D-701-1
      subject: >-
        The TASK-20260731-701 completion gate asked the PRODUCER to transcribe
        the invocation and output of verify_derivation.py. The producer had no
        execution tool, refused to fabricate a transcript under AGENTS.md rule 9,
        and labelled the note "machine recomputation pending". TASK-20260731-704
        did not waive the gate and referred it here.
      ruling: DISCHARGED, by substitution and at a higher standard.
      basis:
        - >-
          The gate's PURPOSE was machine confirmation of the derived numbers.
          REPRO-705-1 re-executed the script from committed source (16 PASS, 0
          FAIL, 1 SKIP), and REPRO-705-2 independently recomputed every fact in
          both propositions by a different method with no discrepancy. An
          independent session that did not author the note is strictly stronger
          evidence than a producer transcript.
        - >-
          The gate's LETTER remains unmet and is recorded as such rather than
          back-dated. The note's section 6.2 status line was accurate when
          written; it is superseded by this report, NOT by an edit to the note —
          records are immutable and the note must not be amended.
        - >-
          The producer's refusal to fabricate output is correct behaviour under
          rule 9 and is not itself a defect.
        - >-
          The dispatching session's run is Coordinator-side corroboration of an
          artifact it was archiving, explicitly labelled as such in the snapshot
          receipt. It is not independent validation and this ruling does not
          rest on it.
      residual: >-
        Claim C0 alone remains SKIP (D-705-2). Its intent is covered
        independently in REPRO-705-2.
    - id: D-704-1
      subject: >-
        mutation_control_v2.py and gate_601b_impl.c carry no per-artifact
        inference block. TASK-20260731-704 ruled the gate satisfied because each
        producer met its own frozen completion gate exactly (the -702 and -703
        cards name only their manifest pair; only -701's is blanket) and because
        provenance is bound by DIGEST, not proximity.
      ruling: >-
        The TASK-20260731-704 ruling is ACCEPTED for BATCH-002. Manifest-level
        hash-bound coverage adequately discharges the provenance requirement
        HERE, and per-artifact blocks SHOULD be mandated GOING FORWARD by
        protocol amendment.
      basis_for_accepting_it_here:
        - >-
          The binding was verified, not assumed. This task recomputed SHA-256 for
          both source files from the committed blobs: gate_601b_impl.c =
          dc2bc3fe02a08881a048eccfe48c64ebe2c5a35a6a9884b1fc33f0cf4b4789f3,
          matching gate_601b_results.json artifacts.implementation_sha256;
          mutation_control_v2.py = d2b2a5dd7720e36b7ff821737d3b7c299254a58f01dd7382bcb67c7a855a00d7,
          matching repair_receipt.json control_source_sha256. Each manifest
          carrying an inference block names, by digest, the exact source bytes it
          covers. That is a stronger binding than co-location in a directory.
        - >-
          Retroactive enforcement would return two tasks that met the completion
          gates they were actually given. Changing the gate after the fact and
          failing a producer on the new text is a fairness failure, and it would
          discard a run and a repair that both reproduce exactly.
        - >-
          A source file is not an execution record. The inference block describes
          who/what produced a RESULT; the natural home is the record that reports
          the result, which is where both blocks are.
      why_it_should_still_change_prospectively:
        - >-
          The digest binding is only as good as the manifest surviving beside the
          source. A source file extracted or vendored without its manifest
          carries no provenance at all, and this batch's own artifacts are
          plausible candidates for exactly that (mutation_control_v2.py is
          explicitly designed to be reused).
        - >-
          It cost the batch a defect (D-704-1) and a validator ruling to settle a
          question a two-line comment header would have foreclosed. Both files
          are source code with comment syntax available.
        - >-
          The rule as it stands requires the reader to hold two files and a hash
          function to answer "what produced this". That is a checkable but
          expensive invariant, and cheap invariants are the ones that survive.
      recommended_form_of_the_amendment: >-
        PROSPECTIVE ONLY, not retroactive to BATCH-002. Either (i) every declared
        source-code artifact carries a comment-block inference stanza, or
        (ii) the covering manifest carries an explicit artifact_provenance list
        binding each covered path to its SHA-256 and stating that the manifest's
        inference block covers it. Option (ii) is the smaller change and matches
        what BATCH-002 already does in substance; option (i) is more robust to
        the artifact travelling alone. The Coordinator owns the amendment; this
        validator proposes and does not enact it.

