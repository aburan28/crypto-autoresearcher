      coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-701/verify_derivation.py: present
      coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-701/candidate_report.yaml: present
      coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-702/mutation_control_v2.py: ABSENT (source-code artifact; covered by digest from repair_receipt.json — see D-704-1 ruling)
      coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-702/repair_receipt.json: present (twice — executor_meta.inference and top level)
      coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-702/repair_report.md: present
      coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-703/gate_601b_impl.c: ABSENT (source-code artifact; covered by digest from gate_601b_results.json — see D-704-1 ruling)
      coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-703/gate_601b_results.json: present
      coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-703/run_record.md: present
    summary: 7 of 9 carry a filled block; the 2 gaps are the D-704-1 subject and are ruled on above.

  # =====================================================================
  limitations:
    - >-
      NETWORK POLICY. eprint.iacr.org, csrc.nist.gov and arxiv.org are
      unreachable. No primary source was read in this validation. Every
      literature statement made by this validator is UNVERIFIED-FROM-MEMORY and
      is marked as such at the point of use, including the recollection that the
      AES S-box values S(00)=63, S(01)=7c, S(53)=ed are the standard ones and the
      recollection that AES subspace trails have a known two-round ceiling.
      Neither settles a novelty question. Two agreeing recollections are not a
