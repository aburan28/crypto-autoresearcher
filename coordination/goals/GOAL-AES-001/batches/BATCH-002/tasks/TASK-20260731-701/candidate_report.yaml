  # =====================================================================
  open_directions:
    - id: OD-1
      direction: >-
        LAYER-DEPENDENT projection families pi^(0), pi^(1), ... Ranked FIRST
        for the next session: it is the largest hole in CLO-701-1, and it has a
        concrete first step that fits the envelope -- compute the DIAMETER of
        the (lambda, k) graph of verify_derivation.py claim C11. If that
        diameter is d, then a layer-dependent family surviving more than about
        d interfaces inherits the same obstruction, and the closure extends
        from round-independent objects to all objects surviving more than
        roughly 2d rounds. If d is small (a plausible outcome, since one edge
        multiplies by a generator), OD-1 mostly closes with a few lines of
        computation. If d is large, the residual is real.
    - id: OD-2
      direction: >-
        Objects on TWO or more super-box words (64-bit half-state on two
        ShiftRows diagonals). Not covered because Step 1's contribution count
        changes. Requires redoing the bookkeeping, not a new idea.
    - id: OD-3
      direction: >-
        SET-VALUED super-box objects. Named for completeness, with the warning
        that its two most obvious members (integral balance, DS-MITM multiset)
        are already off-limits families. A genuinely new member must be defined
        on something other than a coordinate-wise sum or a single-byte
        multiset.
    - id: OD-4
      direction: >-
        BOUNDED-BRANCHING propagation: projections whose one-step propagation
        is a relation of small out-degree B rather than a function. PROP-701-I
        says nothing about B > 1. The right first question is quantitative:
        does the proof's group-growth argument give a LOWER BOUND on B for a
        given entropy loss? That would convert a qualitative closure into a
        cost inequality, which is the form that could matter.
    - id: OD-5
      direction: >-
        The three classes BATCH-001 left unexamined and this session did not
        enter: AES-192/256 key schedules as objects, non-truncated
        (S-box-dependent) impossible differentials, and anything requiring
        MILP/SAT tooling, which is not installed. Unchanged and still open.

