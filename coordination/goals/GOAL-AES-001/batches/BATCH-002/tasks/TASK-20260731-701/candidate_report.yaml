  # =====================================================================
  falsification_gate:
    note: >-
      There are no candidates, so there is no candidate gate. What follows is a
      falsification gate FOR THE CLOSURE ITSELF. docs/inventor-protocol.md
      section 3 requires controls before belief, and a closure that cannot fail
      is not a closure.
    id: GATE-701-C
    count: 1
    status: >-
      SPECIFIED, NOT RUN. The authoring session had no command-execution tool.
      No output, timing or verdict for this gate is reported anywhere in this
      task's artifacts; an unobserved result is never written as observed
      (AGENTS.md rule 9).
    what_it_tests: >-
      That the engine of PROP-701-I's proof -- the growth of the translation
      invariance group -- actually reaches the whole space, in a fully
      enumerable analogue where the conclusion can be checked EXHAUSTIVELY
      rather than argued.
    construction: |
      Build a scaled-down analogue over GF(2^4) (16 elements) with the same
      shape: a 4x4 state of nibbles, ShiftRows offsets (0,1,2,3), and a 4x4
      circulant MixColumns-shaped matrix M4 over GF(2^4) whose entries are all
      nonzero and generate GF(2^4)^*. A word is 16 bits, so the word space has
      2^16 = 65536 elements and is fully enumerable.
      For EVERY nonzero Delta in GF(2^4)^4 (65535 of them):
        - start with the singleton { Delta_i * m_i } for the least i with
          Delta_i != 0;
        - close under the rule  u |-> { u_j * m_j : j = 0..3 }  together with
          GF(2)-linear span;
        - record the GF(2)-dimension of the resulting span.
      The proposition predicts dimension 16 (the whole word space) in all 65535
      cases, i.e. no nonzero Delta can be the kernel of a propagating
      non-injective GF(2)-linear projection.
    pass_fail:
      PASS: >-
        all 65535 kernels close to dimension 16 on the AES-shaped M4. The
        proof's engine is confirmed exhaustively in the analogue.
      FAIL_ESCALATE: >-
        some nonzero Delta closes to dimension < 16 on the AES-shaped M4. Then
        a lossy propagating projection EXISTS in the analogue, PROP-701-I's
        proof has an error, the closure is WITHDRAWN, and the surviving Delta
        is itself the next object to study. This is a real possible negative
        outcome and it is the reason the gate is worth running.
      VOID: >-
        PRE-DECLARED. The gate is VOID, and no conclusion of any kind is drawn
        from it, if EITHER null object below returns the same verdict as the
        AES-shaped matrix. A computation that cannot tell the two apart is
        measuring the arithmetic of the closure routine, not the structure of
        M.
    null_object_control:
      null_1: >-
        M4 replaced by the IDENTITY matrix (i.e. the interface is ShiftRows and
        AddRoundKey only, with no MixColumns). Then m_k = e_k, the closure of
        { lambda e_k } under the rule is contained in the coordinate line
        GF(2^4) e_k, and the span has dimension 4, NOT 16. So a lossy
        propagating projection provably EXISTS on the null -- explicitly, the
        quotient by that coordinate line, i.e. "the word with coordinate k
        deleted", which anyone can verify propagates by hand.
      null_2: >-
        M4 replaced by a circulant with at least one ZERO entry (e.g. first row
        (02, 00, 01, 01) over GF(2^4), checked invertible before use). Step 2
        of the proof needs every entry nonzero, so the closure is expected to
        stall below dimension 16 for at least some Delta.
      what_the_gate_READS_on_each: >-
        AES-shaped M4: 65535 of 65535 kernels close to dimension 16 -> closure
        HOLDS. null_1: 0 of 65535 close to 16 (all stall at 4) -> closure
        FAILS, and the surviving projection is exhibited. null_2: a nonzero
        fraction stall below 16 -> closure FAILS. The three readings are
        qualitatively different, not different by a threshold.
      why_this_control_discriminates_on_STRUCTURE_and_not_on_activity: >-
        This is the direct answer to EV-AES-001 defect I-3, where a gate's
        positive control fired identically on AES and on a random-S-box null
        because it was reading a byte-activity pattern. GATE-701-C does not
        touch the S-box at all -- PROP-701-I's proof never uses SubBytes -- so
        it cannot be reading an S-box-driven activity pattern. What it varies
        is the LINEAR interface, which is precisely the structure the closure
        is about, and the null objects differ from the target exactly in the
        two properties the proof consumes (all entries nonzero; entries
        generate the multiplicative group). A gate cannot be better aimed than
        varying the hypotheses of its own theorem.
      sensitivity_is_demonstrated_not_assumed: >-
        null_1 is a POSITIVE control with a hand-checkable answer: the
        projection "delete coordinate k" propagates deterministically when
        there is no MixColumns. If the gate does not report a stall on null_1,
        the gate is broken and the run is VOID, before any statement about the
        AES-shaped case is read.
    cost_boundary_end_to_end:
      data: none. This is an algebraic computation with no cipher queries and no plaintexts.
      time: >-
        65535 kernels x (closure over at most 16 GF(2)-dimensions, a few
        hundred nibble multiplications each) ~ 10^8 elementary operations,
        i.e. well under a minute in C and a few minutes in Python, per matrix.
        Three matrices (target + two nulls). Charged: under 15 minutes total
        including implementation checks.
      memory: < 50 MB. Largest structure is a 16-vector GF(2) basis per kernel.
      precomputation: GF(2^4) log/antilog tables, 32 bytes. Charged, negligible.
      verification: >-
        Charged, not free: (a) M4 must be checked invertible before use; (b)
        null_1's stall must be reproduced by an independent hand argument, which
        is given above; (c) the closure routine must be run on a matrix whose
        answer is known analytically (null_1) BEFORE the target is read.
      fits_local_envelope: >-
        YES. 4 cores, < 50 MB of 15 GB, no GPU, no sage, no MILP/SAT. Python 3
        alone suffices.
      remaining_campaign_budget_fit: >-
        YES. Well inside a single executor task at the budgets BATCH-002 uses.

  # =====================================================================
  enumerated_closures:
    - id: CLO-701-1
      object: >-
        Round-independent lossy per-super-box-word projections propagating
        deterministically across the AES super-box interface.
      named_obstruction: >-
        The interface Phi = ARK . MC . SR is not a byte permutation. Because
        every entry of MixColumns is nonzero and those entries generate
        GF(2^8)^*, any single collision of the projection propagates into a
        translation-invariance group that grows to the whole word space.
      argument: PROP-701-I above, with a complete proof.
      standard_met: >-
        closure at the docs/inventor-protocol.md section 4 standard: named
        obstruction + argument + forward guidance. NOT a fatigue report.
      forward_guidance: >-
        A super-box-level object must be layer-dependent (OD-1), defined on
        more than one word (OD-2), set-valued (OD-3), or probabilistic /
        bounded-branching (OD-4). It may not be a single round-independent
        lossy per-word state projection, and a session proposing one is
        re-deriving this closure.

    - id: CLO-701-2
      object: The projective class of a super-box word (OBJ-701-1).
      named_obstruction: >-
        Two independent ones: the GF(2)-affine layer L of the S-box is not
        GF(2^8)-semilinear (companion note Corollary 2.1), and CLO-701-1
        applies at the interface even if the S-box is replaced.
      argument: companion derivation note section 3, plus PROP-701-I.
      standard_met: closure (two named obstructions + arguments)
      forward_guidance: >-
        Projective / scalar-quotient objects are doubly obstructed at
        super-box granularity. The remaining place a projective object pays is
        the one KN-LIT-7593 already took: eliminating a key byte inside a
        DS-MITM fingerprint, which is per-byte and not per-word.

    - id: CLO-701-3
      object: Cycle structure of the key-dependent super-box (OBJ-701-6).
      named_obstruction: >-
        Representation dependence (input/output identification is a coordinate
        choice), plus a 2^32-evaluation and multi-GB cost that exceeds the task
        memory budget.
      argument: >-
        the KN-LIT-7595 whole-state argument, transported; corpus-relayed and
        NOT re-derived here, so this entry is weaker than CLO-701-1 and
        CLO-701-2 and is labelled accordingly.
      standard_met: prior-art closure, corpus-relayed, not re-verified
      forward_guidance: none beyond KN-LIT-7595's own.

