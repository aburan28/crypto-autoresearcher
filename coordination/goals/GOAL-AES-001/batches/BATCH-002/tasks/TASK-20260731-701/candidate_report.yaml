  # =====================================================================
  setting:
    the_object_domain: >-
      Two AES rounds decompose, with ShiftRows moved to the outside, as
      2R = (ARK . MC . SR) . SSB . SR, where SSB applies four INDEPENDENT
      32-bit super-boxes in parallel, one per column, each of the form
      SSB = SB . ARK . MC . SB on GF(2^8)^4. The identity uses only that
      SubBytes is byte-wise and therefore commutes with the byte permutation
      ShiftRows. A "super-box word" is the 4-byte input of one super-box; at
      the level of the ORIGINAL state before the outer SR it is a ShiftRows
      DIAGONAL, e.g. bytes {0,5,10,15} in column-major indexing. This is
      precisely the ShiftRows-invariant byte set the BATCH-001 determinant
      closure named as forward guidance.
    the_interface: >-
      The map separating one super-box layer from the next is
      Phi = ARK . MC . SR. It is the only thing an object must survive to reach
      beyond 2 rounds. Note it is NOT merely ShiftRows: MixColumns sits in the
      interface too. Any account of the super-box lane that treats the
      interface as a byte permutation alone is wrong, and this is where the
      lane's obstruction actually lives.
    round_count_convention: >-
      Rounds are counted under the TASK-20260731-602 documented reduced-round
      convention (C1 final round drops MixColumns; C2 the initial AddRoundKey
      is whitening and is not a round; C3 round keys are an untruncated
      schedule prefix). One super-box spans 2 rounds. Crossing one interface
      reaches 4 rounds. In-scope round counts are 3-7 (RQ-AES-001);
      full-round AES is out of scope.
    the_bar_to_beat: >-
      BATCH-001's column-local objects propagate deterministically through ARK
      and MC and die at ShiftRows and SubBytes: about ONE AND A HALF rounds.
      This lane exists to beat that. The answer this session returns is that it
      beats it by exactly HALF A ROUND -- reaching 2 rounds, one full super-box
      -- and cannot, for the class of object defined below, reach 4.

  # =====================================================================
  interface_proposition:
    id: PROP-701-I
    title: >-
      A round-independent per-super-box-word projection that propagates
      deterministically across the AES super-box interface is either injective
      or constant.
    epistemic_label: >-
      derivation (complete argument, checkable by recomputation). NOT `proven`
      in a machine-checked sense; NOT `empirical`. Its three ingredient facts
      are recomputed by verify_derivation.py claims C9, C10 and C11 in this
      same directory.
    hypothesis: |
      Let F = GF(2^8). Let pi : F^4 -> X be any map, applied to every super-box
      word, at every super-box layer (ROUND-INDEPENDENT: the same pi before and
      after the interface). Suppose pi PROPAGATES DETERMINISTICALLY across
      Phi = ARK . MC . SR, i.e. there is a function
          F_j : X^4 -> X
      such that for EVERY state s and every output word index j,
          pi( word_j( Phi(s) ) ) = F_j( pi(word_0(s)), ..., pi(word_3(s)) ).
    conclusion: >-
      pi is injective, or pi is constant. Equivalently: no GENUINELY LOSSY
      round-independent per-word projection propagates deterministically across
      one super-box interface.
    proof: |
      Write m_i for the i-th column of the AES MixColumns matrix M, and k_j for
      the round-key word added at the interface (the argument is identical on
      DIFFERENCES, where every k_j = 0 and ARK is the identity).

      Suppose pi is not injective: pick a != b in F^4 with pi(a) = pi(b), and
      set Delta = a + b != 0.

      STEP 1 (a local invariance). Compare two states S, S' that are identical
      except that input word 1 equals a in S and b in S'. Under ShiftRows with
      the AES offsets (0,1,2,3), output word j collects, in row i, the byte of
      input word (j+i) mod 4; so input word 1 contributes EXACTLY ONE
      coordinate of the pre-MixColumns vector y^(j) of output word j, namely
      the coordinate i_j = (1-j) mod 4. Hence
          word_j(Phi(S)) = M y^(j) + k_j ,
          word_j(Phi(S')) = M y^(j) + Delta_{i_j} m_{i_j} + k_j .
      All four input pi-values are the same for S and S' (three words are
      identical, and pi(a) = pi(b)), so the hypothesis forces the two outputs
      to have equal pi. Since the three coordinates of y^(j) coming from the
      other input words are free, we obtain, for every i with Delta_i != 0,
          pi(u) = pi(u + Delta_i m_i)   for all u in the affine hyperplane
          U_i = { M y + k_j : y_i = a_i }.
      Every row index i is reached, by choosing j = (1-i) mod 4.

      STEP 2 (upgrade to a GLOBAL invariance). Fix an i with Delta_i != 0 and
      put v = Delta_i m_i. EVERY ENTRY OF M IS NONZERO (verify_derivation.py
      claim C9), so all four coordinates of v are nonzero. For each u in U_i,
      the pair (u, u+v) satisfies pi(u) = pi(u+v), so Step 1 applies to it:
      for every row k,
          pi(w) = pi(w + v_k m_k)  for all w in { M y + k_j : y_k = u_k }.
      As u ranges over U_i, its k-th coordinate u_k ranges over ALL of F,
      because u_k = sum_l M[k][l] y_l + (k_j)_k with y_i fixed, y_l free for
      l != i, and M[k][l] != 0. Taking the union over those values of u_k, the
      constraint disappears:
          pi(w) = pi(w + v_k m_k)   for ALL w in F^4,  for every k.

      STEP 3 (iterate to everything). Global invariance under a translation t
      means every pair (w, w+t) has equal pi, so Steps 1-2 apply again and give
      global invariance under t_j m_j for every j. Writing t = lambda m_k, we
      have t_j = lambda M[j][k], so the reachable translations are exactly the
      nodes reachable in the directed graph on
          { (lambda, k) : lambda in F^*, k in {0,1,2,3} },
      with edges (lambda, k) -> (lambda M[j][k], j). That graph is STRONGLY
      CONNECTED (verify_derivation.py claim C11; the underlying reason is that
      each column of M contains the entry 0x01 twice, which moves the index at
      fixed lambda, and the entry 0x03, which generates F^* -- claim C10).
      Hence pi is invariant under translation by lambda m_k for every lambda in
      F^* and every k. The translations leaving pi invariant form a group,
      hence contain the GF(2)-span of that set, which contains the F-span of
      {m_0, m_1, m_2, m_3} = F^4 because M is invertible. So pi is invariant
      under every translation of F^4, i.e. pi is constant.

      Therefore pi is injective or constant. []
    ingredients_and_where_checked:
      - >-
        (a) ShiftRows with offsets (0,1,2,3) makes each input word contribute
        exactly one coordinate to each output word. Structural; visible in the
        setting above; not a numerical claim.
      - >-
        (b) every entry of M is nonzero -- verify_derivation.py claim C9.
      - >-
        (c) the (lambda, k) graph is strongly connected, which rests on the
        entries of M generating GF(2^8)^* -- verify_derivation.py claims C10
        and C11.
      - >-
        (d) M is invertible -- standard, and implied by claim C1 of the
        companion note (M has finite multiplicative order 4).
    what_the_proof_does_NOT_use: >-
      It does not use SubBytes at all, and therefore does not use any property
      of the AES S-box. The obstruction is entirely in the LINEAR interface.
      That is a strengthening (the closure survives replacing the S-box) and
      simultaneously a limitation (it says nothing about objects whose
      propagation is mediated by SubBytes, e.g. probabilistic differential or
      linear objects).
    lossy_projection_reading: >-
      The conclusion is exactly the docs/inventor-protocol.md section 2 test,
      run as a theorem instead of as a check: an injective pi discards nothing
      and is therefore a change of coordinates rather than an object; a
      constant pi discards everything and propagates vacuously. There is no
      intermediate. This is the cheapest possible answer to "is there anything
      here", and it costs no compute.
    scope:
      - >-
        ROUND-INDEPENDENT ONLY. The proof iterates Steps 1-2 an unbounded
        number of times with the SAME pi. A LAYER-DEPENDENT family
        pi^(0), pi^(1), pi^(2), ... is NOT covered: two interfaces yield only
        that pi^(2) is invariant under one nonzero translation, which is a weak
        constraint. This is the single largest hole in the closure and is named
        as open direction OD-1 below.
      - >-
        SINGLE-WORD ONLY. pi is defined on ONE 32-bit super-box word. Objects
        defined on the union of two or more words (a 64-bit half-state) are NOT
        covered: the counting in Step 1 -- exactly one contributed coordinate
        per output word -- changes. Open direction OD-2.
      - >-
        SINGLE-STATE ONLY. pi is a function of one state. SET-VALUED objects
        (a projection of a whole delta-set, e.g. a coordinate-wise sum or a
        multiset profile) are NOT covered. Open direction OD-3. Note the most
        obvious members of that class are the integral and DS-MITM families and
        are already off-limits.
      - >-
        DETERMINISTIC ONLY. Objects that propagate PROBABILISTICALLY, or
        deterministically only up to a bounded branching factor, are NOT
        covered. Open direction OD-4. Differential, linear and
        differential-linear objects live here and are already off-limits as
        families, but the bounded-branching relaxation is not obviously any of
        them.
      - >-
        This is a statement about a class of ARGUMENT AND OBJECT, not about
        AES's security. It asserts nothing about whether AES is attackable at
        any round count.
    honest_status_of_the_result: >-
      RE-DERIVATION THROUGH A NEW LENS, PROBABLY. I recall
      (`unverified_from_memory`, recall confidence LOW-MEDIUM on the precise
      statement, MEDIUM on the existence of the literature) that AES subspace
      trails are known to be limited to about two rounds, and that this is a
      published structural fact rather than an open question. If that recall is
      right, PROP-701-I re-derives a known 2-round ceiling for a strictly
      larger class of objects (arbitrary lossy projections, not only
      subspace-coset projections) through a different mechanism. Per
      docs/inventor-protocol.md section 5, structure that re-derives an
      established result through a new lens is recorded as EXACTLY THAT and not
      as a discovery. No novelty is claimed. The proposition's local value is
      that it is a PROOF available inside this environment, which the recalled
      literature is not.

  # =====================================================================
  # Object-first enumeration. Every entry names a concrete tracked object, its
  # byte set and its round count. Verdicts are per object, and the
  # deduplication verdict against all nine families is given for each.
  objects_considered:

    - id: OBJ-701-1
      tracked_object: >-
        The projective class [v] in P^3(GF(2^8)) of a super-box word v, i.e.
        the word up to a GF(2^8) scalar.
      byte_set: one ShiftRows diagonal, e.g. {0,5,10,15}, 4 bytes / 32 bits
      round_count: defined at 2 rounds (one super-box); tested for 4 rounds
      projection_arity: 32 bits -> 24 bits (a genuinely lossy 8-bit discard)
      lossy_projection_test: >-
        PASS as a projection (the scalar is not recoverable from the class),
        but the object is then killed twice over, see verdict.
      survival_depth_rounds: >-
        LESS THAN ONE ROUND. It dies inside the super-box at the first
        SubBytes, and not for the reason BATCH-001 gave: Inv preserves
        collinearity (companion note Proposition 2), the GF(2)-affine layer L
        does not (Corollary 2.1). Even if the S-box were pure inversion it
        would then die at the interface by PROP-701-I.
      verdict: CLOSED, twice independently
      mechanism: >-
        (a) L is not GF(2^8)-semilinear, so the projective class is not a
        function of the projective class after SubBytes; (b) [v] is a
        non-injective, non-constant, round-independent per-word projection, so
        PROP-701-I applies directly and forbids deterministic propagation
        across the interface regardless of the S-box.
      dedup:
        differential: NOT an instance; no pair-difference statistic is tracked.
        integral_square: NOT an instance; no set and no coordinate-wise sum.
        impossible_differential: NOT an instance; nothing is asserted impossible.
        mitm_demirci_selcuk: NOT an instance; no table, fingerprint or matching.
        boomerang_and_retracing: NOT an instance; no adaptivity, no quartet.
        biclique: NOT an instance; no key-space structure.
        division_property: NOT an instance; no degree or monomial support.
        differential_linear: NOT an instance; no mask, no junction.
        yoyo: NOT an instance; no involution orbit.
        in_corpus: >-
          ADJACENT to the KN-LIT-7593 Moebius per-byte projective invariant
          (dimension 1 there, 3 here, and no key elimination here); recorded as
          adjacency, not novelty.

    - id: OBJ-701-2
      tracked_object: >-
        The coset of a fixed GF(2^8)-subspace V < GF(2^8)^4 containing the
        super-box word, i.e. the image of v in the quotient GF(2^8)^4 / V
        (a subspace-trail-style object).
      byte_set: one ShiftRows diagonal, 32 bits
      round_count: 2 rounds, tested for 4
      projection_arity: 32 bits -> 32 - 8*dim(V) bits; lossy for dim(V) >= 1
      lossy_projection_test: PASS as a projection
      survival_depth_rounds: >-
        AT MOST 2 (one super-box), and 0 across the interface for any
        1 <= dim(V) <= 3.
      verdict: CLOSED by PROP-701-I
      mechanism: >-
        The quotient map is a non-injective, non-constant, round-independent
        per-word projection. PROP-701-I therefore forbids deterministic
        propagation across the interface. Concretely, Step 2 of the proof shows
        the invariance group generated by any nonzero kernel vector grows to
        all of GF(2^8)^4, which is exactly the statement that no proper
        subspace can be a trail's carrier across the interface.
      dedup:
        differential: NOT an instance (no pair statistic), but structurally adjacent.
        integral_square: NOT an instance.
        impossible_differential: NOT an instance.
        mitm_demirci_selcuk: NOT an instance.
        boomerang_and_retracing: NOT an instance.
        biclique: NOT an instance.
        division_property: NOT an instance.
        differential_linear: NOT an instance.
        yoyo: NOT an instance.
        external_literature: >-
          PROBABLE REDISCOVERY of the known limits of AES subspace trails,
          `unverified_from_memory`, recall confidence LOW-MEDIUM. Recorded as a
          rediscovery, not as a candidate. This is the honest label even though
          the argument here was derived locally.

    - id: OBJ-701-3
      tracked_object: >-
        The byte-activity pattern (support indicator) in {0,1}^4 of a super-box
        word DIFFERENCE.
      byte_set: one ShiftRows diagonal, 32 bits of difference
      round_count: 2 rounds, tested for 4
      projection_arity: 32 bits -> 4 bits
      lossy_projection_test: PASS as a projection
      survival_depth_rounds: >-
        Deterministically 0 across the interface; probabilistically this is the
        truncated-differential object and is a known family.
      verdict: REDISCOVERY (probabilistic reading) and CLOSED (deterministic reading)
      mechanism: >-
        Deterministic reading: a non-injective non-constant round-independent
        per-word projection, so PROP-701-I applies. Probabilistic reading: this
        IS the truncated differential / integral activity pattern, which is
        exactly what the MixColumns branch number governs, and it is
        off-limits.
      warning_recorded: >-
        This object is the specific trap named by EV-AES-001 defect I-3: a gate
        reading a byte-activity pattern fires identically on AES and on a
        random-S-box null, because activity propagation is a property of the
        LINEAR layer alone. Any gate whose positive control is an activity
        pattern is not a gate. Recorded so the next session does not rebuild it.
      dedup:
        differential: IS an instance (truncated differential). Recorded as such.
        integral_square: adjacent; the activity pattern is the integral's carrier.
        impossible_differential: adjacent; IDs are built from activity contradictions.
        mitm_demirci_selcuk: NOT an instance.
        boomerang_and_retracing: NOT an instance.
        biclique: NOT an instance.
        division_property: adjacent; the division property refines exactly this.
        differential_linear: NOT an instance.
        yoyo: NOT an instance.

    - id: OBJ-701-4
      tracked_object: >-
        The multiplicity profile (an integer partition of 256) of one output
        byte of a super-box over a delta-set of its inputs.
      byte_set: one ShiftRows diagonal in, one byte out
      round_count: 2 rounds
      projection_arity: set-valued; not covered by PROP-701-I
      lossy_projection_test: PASS as a projection, but see verdict
      survival_depth_rounds: not evaluated - see verdict
      verdict: REDISCOVERY - this is the Demirci-Selcuk multiset fingerprint
      mechanism: >-
        Tracking the multiset profile of an output byte over a delta-set at
        super-box granularity IS the DS-MITM matching object, one of the nine
        off-limits families and additionally the object of the in-corpus
        KN-LIT-7593 result. Not a candidate.
      dedup:
        mitm_demirci_selcuk: IS an instance. Decisive.
        integral_square: adjacent (the balance property is a coarsening of the profile).
        all_others: NOT an instance.

    - id: OBJ-701-5
      tracked_object: >-
        The key-dependent super-box differential profile: for a fixed input
        difference alpha, the multiset of output differences of
        SSB_k, or its support size N(alpha, k), as a function of the
        interposed key word k.
      byte_set: one ShiftRows diagonal, 32 bits
      round_count: 2 rounds
      lossy_projection_test: >-
        PASS as a projection (the DDT row is projected to its support size),
        but see verdict.
      survival_depth_rounds: >-
        2 by construction; the object is defined ON the super-box and there is
        no proposal for carrying it further.
      verdict: REDISCOVERY, and separately OUT OF ENVELOPE
      mechanism: >-
        This is the Super-Sbox / rebound-style analysis of the two-round AES
        super-box: the observation that the super-box DDT factors as
        (byte-wise DDT) -> M -> (byte-wise DDT) with the key selecting the
        pairing. I recall that this is a published technique
        (`unverified_from_memory`, recall confidence MEDIUM on existence, LOW on
        attribution and parameters), so it is recorded as a rediscovery. It is
        ALSO out of envelope: evaluating N(alpha, k) exactly requires 2^32
        super-box evaluations per (alpha, k) pair, which is minutes per pair in
        C and does not yield a discriminating measurement without many pairs.
      dedup:
        differential: IS an instance at the super-box granularity.
        boomerang_and_retracing: adjacent - the rebound/super-box technique is
          most associated with boomerang-style and hash-function analysis.
        all_others: NOT an instance.

    - id: OBJ-701-6
      tracked_object: >-
        The cycle structure / fixed-point count of the key-dependent super-box
        as a permutation of 2^32 elements.
      byte_set: one ShiftRows diagonal, 32 bits
      round_count: 2 rounds
      lossy_projection_test: >-
        FAIL in the sense that matters: the cycle structure is a projection of
        the permutation, not of the STATE, so there is no one-step propagation
        to define. It is not a tracked object in the
        docs/inventor-protocol.md section 1 sense.
      survival_depth_rounds: not applicable
      verdict: CLOSED (representation artifact) and out of envelope
      mechanism: >-
        Fixed points and cycles presuppose an identification of the input and
        output spaces, which is a choice of representation; a signal is then an
        artifact of coordinates. This is the mechanism KN-LIT-7595 already
        records for the whole-state analogue, and it transports unchanged to
        the super-box. Additionally, computing the cycle structure of a
        2^32-point permutation costs 2^32 evaluations and 4-16 GB of marking
        memory per key, which does not fit the 4 GB task budget.
      dedup: NOT an instance of any of the nine families.

    - id: OBJ-701-7
      tracked_object: >-
        A LAYER-DEPENDENT family pi^(0), pi^(1), ... of per-word projections,
        each lossy, with deterministic propagation across each interface.
      byte_set: one ShiftRows diagonal per layer
      round_count: 4 rounds and beyond
      lossy_projection_test: not evaluated - not examined
