task_card:
  id: TASK-20260810-37042c
  goal_id: GOAL-AES-001
  batch_id: BATCH-005
  role: red-team
  title: >-
    Red-team the bounded-index-subgroup residual, the CTRL-810-A census, and the
    layer-dependence screen v2 this queue enacted
  handoff_ref: ledger/handoffs/TASK-20260810-37042c.yaml
  covering_manifest: redteam_findings.yaml
  review_required: false
  depends_on:
    - TASK-20260810-51fafe
    - TASK-20260810-a0e0ae
    - TASK-20260810-415ed7

  objective: >-
    ADVERSARIAL review of the committed BATCH-005 package on THREE MANDATORY TARGETS,
    all three of which are real work and none of which is a formality. TARGET 1 --
    THE BOUNDED-INDEX-SUBGROUP RESIDUAL. If a proposition is stated, TRY TO BREAK IT:
    find the assumption doing the work, attack the TYPE-STABILITY claim hardest (a
    subgroup that exists but is not emitted-and-consumed by Step 1 does not repair the
    induction, and existence-dressed-as-repair is this batch's most likely
    overstatement), hunt for an UNNUMBERED conditional dependence, and if a
    counterexample certificate is offered try to break the certificate rather than
    accept it. If the package reports that no such subgroup exists, TRY TO CONSTRUCT
    ONE, even crudely, and report how far you got: a negative closure an adversary can
    walk past in one sitting is not a closure, and saying so is the most useful thing
    you can do. TARGET 2 -- THE CTRL-810-A CENSUS. Attack the census as an INSTRUMENT:
    does it measure the quantity RT-2's dimension count is about; are the two
    composition models genuinely separated or is one silently standing in for the
    other; does the leg C disposition rest on the probe or on convenience; is a sample
    shortfall or an unrun leg anywhere doing work it cannot do; and does the reported
    outcome follow from the numbers, INCLUDING outcome (ii), which falsifies your
    predecessor's own RT-2. TARGET 3 -- THE LAYER-DEPENDENCE SCREEN v2, WHICH THE
    COORDINATOR ENACTED IN THE BATCH-005 QUEUE AND WHICH HAS NEVER BEEN ATTACKED. Its
    predecessor was broken by the first red team on first contact (RT-8, RT-9, RT-10,
    RT-11) and the replacement was written by the same role that wrote the rule that
    broke. ATTACK IT.

  why_target_3_is_mandatory: >-
    STATED BY THE COORDINATOR AGAINST ITSELF. The layer-dependence screen v2 is a
    COORDINATOR-AUTHORED RULE CHANGE, enacted in the queue rather than dispatched as
    work, and it is therefore the one artifact in this batch that NO INDEPENDENT PARTY
    HAS SEEN BEFORE IT BOUND TWO PRODUCERS. Its predecessor's failure was
    Coordinator-side in every particular (D-811-2, RT-9, RT-10, RT-11), and the same
    role has now rewritten it. Specific attack surfaces the Coordinator names against
    its own rule: (i) requirement 2 adopts the n = 1 rule for round-independent pi
    campaign-wide, but RT-11 already showed that ANY candidate can be re-posed with a
    round-independent pi and thereby obtain n = 1 -- so does the screen now filter
    ANYTHING, or has it been reformed into a formality? (ii) requirement 4's separate
    tractability judgement is the load-bearing replacement for the filtering the
    screen no longer does, and it is a JUDGEMENT, not a measurement -- is it
    auditable, or is it a licence phrased as a duty? (iii) requirement 3's
    DEFERRED_UNBOUNDED verdict removes fatigue reports from the ruling count, but does
    it also create a verdict that lets a producer decline work with no cost at all?
    (iv) requirement 5 concedes the screen is TOO PERMISSIVE under the tighter
    conversion -- so is it now a screen that kills nothing while still being cited as
    a screen? A REFORM THAT MAKES A BROKEN SCREEN HARMLESS RATHER THAN CORRECT IS
    STILL BROKEN, and that is the finding to look for.

  binding_clauses_carried_in_the_same_words_the_producing_and_archival_cards_carry:

    c2_stamp_duty: >-
      C2 STAMP DUTY, protocol-amendment-GOAL-AES-001-005 PART B. (i) AS YOUR FIRST
      ACT, BEFORE ANY RESEARCH WORK, write budget_stamps.json in your own task
      directory carrying `start_utc`, `start_epoch`, `declared_wall_clock_seconds`
      and `binding_stop_utc` COMPUTED AS YOUR OWN START PLUS YOUR DECLARED BUDGET.
      (ii) Write a further stamp at EACH MAJOR SECTION BOUNDARY with `utc`,
      `elapsed_s` and a `marker`. (iii) HALT at `binding_stop_utc`, record
      `halted_on_budget` truthfully, and NAME the work dropped. (iv) COMMIT those
      stamps as a declared artifact. YOUR PREDECESSOR TASK-20260801-810's `budget`
      block IS THE REFERENCE IMPLEMENTATION OF THIS DUTY -- it did this voluntarily
      when the rule was unclear, and amendment 005 Part B codifies exactly what it
      did. THE QUEUE-COMPUTED binding_stop_utc FOR THIS CARD IS 2026-08-10T00:55:13Z,
      computed from the BATCH-005 dispatch stamp 2026-08-10T00:38:33Z plus this card's
      declared 1000 s; it is the DISPATCH-BASIS REFERENCE. THE STOP YOU HALT ON IS THE
      ONE YOU COMPUTE FROM YOUR OWN START. A HALT AT binding_stop_utc IS
      INFRASTRUCTURE SIGNAL, NEVER A NEGATIVE MATHEMATICAL RESULT (AGENTS.md rule 5),
      and dropped work is SCOPE, NEVER AN ANSWER (rule 8): NAME EVERY ATTACK YOU DID
      NOT RUN, so an unrun attack is never mistaken for an attack that found nothing.

    c4_authoring_inclusive_declaration_basis: >-
      C4 AUTHORING-INCLUSIVE DECLARATION BASIS, protocol-amendment-GOAL-AES-001-005
      PART B. This card's declared budget is calibrated against AUTHORING-INCLUSIVE
      SESSION ELAPSED -- first act to terminal receipt -- and NOT against compute.
      REPORT THE COMPUTE COMPONENT SEPARATELY in its own field
      `compute_wall_clock_seconds`. COMPUTE SECONDS MAY NOT BE OFFERED AS EVIDENCE OF
      BUDGET COMPLIANCE. Your budget duty is discharged ENTIRELY BY THE C2 STAMP DUTY
      (C3), and any residual against the charged figure is a CAMPAIGN-SIDE ACCOUNTING
      FACT, NEVER A DEFECT AGAINST YOU.

    declaration_sized_against_part_a_reference_actuals: >-
      DECLARATION SIZED AGAINST THE PER-ROLE REFERENCE ACTUALS IN
      protocol-amendment-GOAL-AES-001-005 PART A. This card declares 1000 s. Part A's
      red-team line records ONE measured datum, 668 s (TASK-810), well under its
      declared 1000, and SIZES AT 1000 AND NOT AT 668 on the stated ground that ONE
      TASK IS NOT A DISTRIBUTION and a pass which found a live counter-witness early
      is NO EVIDENCE the next will be cheap. Sizing to the single low observation would
      be exactly the error amendment 005 exists to stop making. SIZING AT MAXIMA IS
      THE CONTINGENCY: NO SEPARATE CUSHION IS ADDED AND NONE MAY BE INFERRED. THE
      DECLARATION IS A BINDING STOP CONDITION, NOT AN ALLOWANCE.

  constraints:
    - >-
      READ ONLY COMMITTED ARTIFACTS, and confirm the TASK-20260810-415ed7 snapshot
      receipt against Git before recording any finding. If it does not verify, STOP and
      report an EVIDENCE-INTEGRITY FAILURE.
    - >-
      ALL THREE TARGETS ARE MANDATORY AND EACH IS REPORTED SEPARATELY. You may
      allocate effort between them and you must state the allocation and its reason,
      but you may not silently drop one. If budget forces you to stop, name what you
      did not attack on each target.
    - >-
      TARGET 1, ATTACK THE MATHEMATICS AND THE TYPE-STABILITY CLAIM SEPARATELY. For
      any stated proposition: is the index bound in B actually derived, or asserted?
      Is the subgroup the one Step 1 emits, or a different one that merely exists? Is
      there an UNNUMBERED conditional dependence -- an independence, uniformity,
      genericity or equidistribution assumption smuggled in as an obvious step? AN
      UNNUMBERED ASSUMPTION FOUND IS THE SINGLE HIGHEST-VALUE FINDING AVAILABLE HERE
      AND MUST BE REPORTED AS MAJOR: BATCH-004's package carried THREE (U-809-1, RT-3,
      RT-4) found by two reviewers who found DIFFERENT ONES. For any counterexample
      certificate: re-execute it and try to break IT, not merely to confirm it.
    - >-
      TARGET 2, ATTACK THE CENSUS AS AN INSTRUMENT AND NOT AS A NUMBER. Does the
      measured quantity match the quantity RT-2's ceiling argument is about? Are
      M-affine and M-nonlinear genuinely separated at every n and every witness? Does
      the leg C disposition follow from the probe, or from convenience -- and if leg C
      did not run, is the unrun leg ANYWHERE doing work it cannot do, in EITHER
      direction? Is a leg B sample shortfall being read as a bound on the minimum? A
      package that converts an unavailable dependency into evidence about GF(2^8) is
      committing AGENTS.md rule 5's exact error and that is MAJOR.
    - >-
      TARGET 2, AND HOLD YOUR PREDECESSOR TO THE SAME STANDARD. RT-2 is a DIMENSION
      COUNT, not a measurement, and RT-1 is a WITNESS, not a minimum. If the census
      falsifies RT-2, SAY SO PLAINLY AND RECOMMEND ITS WITHDRAWAL: your predecessor
      named that outcome deliberately against itself and defending a prior red-team
      finding against measurement would be the worst available failure of this role.
    - >-
      TARGET 3, ATTACK THE COORDINATOR'S OWN RULE. Work the four named attack surfaces
      above and any you find yourself. Concretely: try to construct a candidate that
      PASSES the screen v2 and is nonetheless vacuous or intractable; check whether any
      BATCH-005 PURSUE verdict would have been different under the old rule and whether
      that difference is justified; check whether the tractability judgement was
      actually made or merely asserted; and check whether the reform's own claim -- that
      it is TOO PERMISSIVE rather than too strict -- is right, and in which direction it
      errs. IF THE REFORM MERELY MAKES A BROKEN SCREEN HARMLESS RATHER THAN CORRECT,
      SAY SO.
    - >-
      BOTH DIRECTIONS OF FAILURE ARE IN SCOPE, AND PREMATURE CLOSURE IS THE ONE THIS
      CAMPAIGN HAS ALREADY COMMITTED. Overclaiming and premature closure are symmetric
      failure modes (docs/inventor-protocol.md). This campaign was NOT PAUSED
      specifically because it had screened out its best remaining exponent-relevant
      candidate on an erroneous constant. If BATCH-005 declined work it should have
      done, that finding is at least as valuable as breaking a bound.
    - >-
      ATTACK THE ANALOGUE. Every scaled-down computation here runs in a field that is
      not the cipher's, and the GF(2^2) analogue is additionally NOT MDS. Ask whether
      any conclusion is transferred to GF(2^8) or to AES without an argument, and
      whether the transfer argument, where present, actually holds. This campaign's
      standing exposure is that a toy reading gets read as evidence about the cipher.
    - >-
      ATTACK THE HONEST ACCOUNTING. Check dominated_by and sota_delta wherever a
      deliverable claims anything, and check that no recalled literature number is used
      as if it had been read. Every literature statement in this campaign is
      UNVERIFIED-FROM-MEMORY and novelty is UNRESOLVABLE in this environment; a package
      comparing itself to a remembered baseline as if to a citation is committing the
      error, AND SO WOULD YOU BE IF YOU REBUTTED IT WITH ANOTHER RECOLLECTION.
    - >-
      PROPOSE THE NEXT CONTROL, WHICH IS YOUR DISTINCTIVE OUTPUT. For your strongest
      objection on each target, name the CONCRETE, BOUNDED experiment or computation
      that would settle it, specific enough for the Coordinator to schedule -- what to
      compute or sample, at what scale, what each outcome would mean, and WHAT WOULD
      FALSIFY YOUR OWN OBJECTION. An objection without a settling control is an
      opinion. NOTE THE HARD CONSTRAINT ON YOUR PROPOSAL: BATCH-006 IS THE LAST BATCH
      AND IS RESERVED FOR CONSOLIDATION, REVIEW AND THE TERMINAL RECORD, so a control
      you propose is very likely to be recorded as OPEN AND UNATTEMPTED rather than
      run. Propose it anyway, and size it honestly.
    - >-
      DISTINGUISH AN OBJECTION FROM A REFUTATION AND SAY WHICH YOU HAVE. If you
      demonstrate a concrete failure, say DEMONSTRATED and give the reproduction. If
      you have a reason for doubt you could not settle, say UNRESOLVED and say why --
      the V-804-6 precedent, where a confounded probe was correctly recorded as
      unresolved rather than as refuted, is the standard. Absence of evidence is not
      evidence of absence, and an unrun probe is not a null result.
    - >-
      DO NOT FIX ANYTHING. Do not repair, edit, extend or re-run producer artifacts,
      and do not write the proposition you think should have been written. Objections
      are RECORDED, NOT REMEDIED. Write only under this task's own directory.
    - >-
      CHANGE NO OFFICIAL STATE. Propose no hypothesis status, create no ledger record,
      promote nothing to knowledge, assign NO EVIDENCE STRENGTH, and recommend no
      promotion -- those are the Coordinator's transition in TASK-20260810-b26b16. YOU
      MAY RECOMMEND AGAINST PROMOTION AND SHOULD, IF WARRANTED.
    - >-
      RECORD YOUR OWN INFERENCE BLOCK and state plainly that under
      inference-amendment 0137a051 your independence is in SESSION AND NOT IN MODEL --
      you resolve to the same model as both producers, the validator and the
      Coordinator -- that this BLOCKS ANY GOAL-CLOSURE ATTESTATION FROM YOUR SESSION,
      and that a VALIDATOR CONCUR PLUS A RED-TEAM CONCUR IS ONE DRAW FROM A CORRELATED
      PAIR, NOT TWO.
    - >-
      PART C APPLIES TO YOUR ARTIFACTS TOO: redteam_findings.yaml is the COVERING
      MANIFEST of this task and carries an artifact_provenance list covering every
      declared artifact, with budget_stamps.json as an ENTRY and its own entry as
      SELF, every `kind` inside the closed case-insensitive four-class vocabulary, and
      a filled inference block on every artifact with the standing basis 0137a051.

  deliverables:
    - budget_stamps.json
    - redteam_report.md
    - redteam_findings.yaml

  budget:
    wall_clock_seconds: 1000
    memory_gb: 4
    maximum_runs: 6
    queue_computed_binding_stop_utc: '2026-08-10T00:55:13Z'

  completion_gate:
    - >-
      budget_stamps.json exists, was written as the first act with a binding_stop_utc
      computed from this task's own start plus 1000 s, carries boundary stamps,
      records halted_on_budget truthfully, NAMES every attack not run, and is
      COMMITTED; redteam_findings.yaml is the covering manifest and reports session
      elapsed and compute seconds SEPARATELY.
    - >-
      The snapshot receipt is confirmed against Git, or the task stops and reports an
      evidence-integrity failure.
    - >-
      ALL THREE TARGETS are attacked and reported separately, with the effort
      allocation stated and its reason given, and with anything not attacked NAMED per
      target.
    - >-
      TARGET 1: any stated proposition is attacked on whether the index bound is
      derived or asserted and on whether the subgroup is the one Step 1 emits; the
      TYPE-STABILITY claim is attacked SEPARATELY from the existence claim; an explicit
      search for UNNUMBERED conditional dependences is performed and reported, with any
      found recorded as MAJOR; and where the package reports no such subgroup exists,
      an attempt to construct one is made and how far it got is reported.
    - >-
      TARGET 2: the census is attacked as an instrument -- quantity measured versus
      quantity claimed, separation of the two composition models, the basis of the leg
      C disposition, and whether any unrun leg or sample shortfall is doing work it
      cannot do in either direction; and if the numbers falsify RT-2, its withdrawal is
      recommended plainly.
    - >-
      TARGET 3: the layer-dependence screen v2 is attacked on all four named surfaces
      and any found; an attempt is made to construct a candidate that passes it and is
      nonetheless vacuous or intractable; and the report states whether the reform
      makes the screen CORRECT or merely HARMLESS.
    - >-
      The analogue-to-cipher transfer is attacked, and the honest-accounting fields and
      any use of recalled literature numbers are checked.
    - >-
      For the strongest objection ON EACH TARGET, a concrete bounded settling
      experiment is specified -- what to compute or sample, at what scale, what each
      outcome means, and what would falsify the objection itself -- with an honest note
      that BATCH-006 is reserved and the control is likely to be recorded OPEN AND
      UNATTEMPTED.
    - >-
      Every finding is labelled DEMONSTRATED (with a reproduction) or UNRESOLVED (with
      why), and no unrun attack is presented as an attack that found nothing.
    - >-
      redteam_findings.yaml lists every objection with a severity and a settling
      control where one exists, carries the red team's own inference block with the
      SESSION-NOT-MODEL and CORRELATED-PAIR statements, asserts no official state
      change, assigns no evidence strength, and recommends no promotion.
    - >-
      No producer artifact is modified and all writes are under this task's own
      directory.

  return_format: >-
    The three artifacts, plus a plain statement of: (i) the effort allocation across
    the three targets and its reason; (ii) the strongest finding on each target with
    its DEMONSTRATED / UNRESOLVED label; (iii) any UNNUMBERED conditional dependence
    found, named first; (iv) whether the census falsifies RT-2 and whether you
    withdraw it; (v) whether the layer-dependence screen v2 is CORRECT or merely
    HARMLESS; (vi) the settling control for each target; (vii) every attack not run,
    named; and (viii) the authoring-inclusive session elapsed and, separately, the
    compute seconds.
