task_card:
  id: TASK-20260810-9ea72c
  goal_id: GOAL-AES-001
  batch_id: BATCH-005
  role: validator
  title: Independently validate the AES BATCH-005 package as two separate checks
  handoff_ref: ledger/handoffs/TASK-20260810-9ea72c.yaml
  covering_manifest: validation_report.yaml
  review_required: false
  depends_on:
    - TASK-20260810-51fafe
    - TASK-20260810-a0e0ae
    - TASK-20260810-415ed7

  objective: >-
    Independently verify the COMMITTED BATCH-005 producer package as TWO SEPARATE AND
    SEPARATELY REPORTED CHECKS whose verdicts are kept PHYSICALLY SEPARATE and are
    NEVER merged, averaged or carried across: (a) the bounded-index-subgroup residual
    (TASK-20260810-51fafe) -- its layer-dependence screen v2 application, its
    derivation or its counterexample certificate, its type-stability verdict, and IF A
    PROPOSITION OR COST STATEMENT IS STATED its four-gate package; (b) the CTRL-810-A
    saturating frontier census (TASK-20260810-a0e0ae) -- its capability probe, its leg
    A / leg B / leg C dispositions, its two composition models, and its pre-registered
    outcomes. The BATCH-002, BATCH-003 and BATCH-004 precedent is binding: a sound
    derivation does not validate an unsound screen, and a defect in one group does not
    touch the other. ISSUE NO COMBINED VERDICT.

  binding_clauses_carried_in_the_same_words_the_producing_and_archival_cards_carry:

    c2_stamp_duty: >-
      C2 STAMP DUTY, protocol-amendment-GOAL-AES-001-005 PART B. (i) AS YOUR FIRST
      ACT, BEFORE ANY RESEARCH WORK, write budget_stamps.json in your own task
      directory carrying `start_utc`, `start_epoch`, `declared_wall_clock_seconds`
      and `binding_stop_utc` COMPUTED AS YOUR OWN START PLUS YOUR DECLARED BUDGET.
      (ii) Write a further stamp at EACH MAJOR SECTION BOUNDARY, each carrying `utc`,
      `elapsed_s` and a `marker` naming what was completed. (iii) HALT at
      `binding_stop_utc`, record `halted_on_budget` truthfully, and NAME the work
      dropped. (iv) COMMIT those stamps as a declared artifact of this task. The
      TASK-20260801-810 `budget` block is the REFERENCE IMPLEMENTATION. THE
      QUEUE-COMPUTED binding_stop_utc FOR THIS CARD IS 2026-08-10T01:01:53Z, computed
      from the BATCH-005 dispatch stamp 2026-08-10T00:38:33Z plus this card's declared
      1400 s; it is the DISPATCH-BASIS REFERENCE. THE STOP YOU HALT ON IS THE ONE YOU
      COMPUTE FROM YOUR OWN START, and for this card the two differ by construction
      because you begin after the snapshot. A HALT AT binding_stop_utc IS
      INFRASTRUCTURE SIGNAL, NEVER A NEGATIVE MATHEMATICAL RESULT (AGENTS.md rule 5),
      and dropped work is SCOPE, NEVER AN ANSWER (rule 8) -- name every check you did
      not run, so an unrun check is never mistaken for a check that found nothing.

    c4_authoring_inclusive_declaration_basis: >-
      C4 AUTHORING-INCLUSIVE DECLARATION BASIS, protocol-amendment-GOAL-AES-001-005
      PART B. This card's declared budget is calibrated against AUTHORING-INCLUSIVE
      SESSION ELAPSED -- first act to terminal receipt -- and NOT against compute.
      REPORT THE COMPUTE COMPONENT SEPARATELY in its own field
      `compute_wall_clock_seconds`. COMPUTE SECONDS MAY NOT BE OFFERED AS EVIDENCE OF
      BUDGET COMPLIANCE. Your budget duty is discharged ENTIRELY BY THE C2 STAMP DUTY
      (C3), and any residual against the charged figure is a CAMPAIGN-SIDE ACCOUNTING
      FACT, NEVER A DEFECT AGAINST YOU. NOTE THE C5 RULE THAT APPLIES TO YOUR OWN
      FIGURE: the charged figure is the LARGEST session-elapsed figure on the record
      from any source, every other figure is preserved marked `on_record_not_charged`
      with its source named, and a producer stamp SYSTEMATICALLY UNDERSTATES because
      its last stamp is at its final write and the task's tail falls after it. D-811-3
      arose from exactly this and is closed by that rule; report your figure plainly
      and do not reconcile it silently.

    declaration_sized_against_part_a_reference_actuals: >-
      DECLARATION SIZED AGAINST THE PER-ROLE REFERENCE ACTUALS IN
      protocol-amendment-GOAL-AES-001-005 PART A. This card declares 1400 s. Part A's
      independent-validation line records MEASURED SESSION ELAPSED of 1046
      (TASK-804) and 1370 (TASK-809, the charged figure of three) and SIZES AT 1400 --
      AT OR NEAR THE OBSERVED MAXIMUM AND NOT AT THE MEAN. SIZING AT MAXIMA IS THE
      CONTINGENCY: NO SEPARATE CUSHION IS ADDED AND NONE MAY BE INFERRED. THE
      DECLARATION IS A BINDING STOP CONDITION, NOT AN ALLOWANCE.

  constraints:
    - >-
      READ ONLY COMMITTED ARTIFACTS. The TASK-20260810-415ed7 snapshot receipt must
      verify against Git -- reachable from HEAD, expected parent, EXACTLY the declared
      paths, matching hashes -- BEFORE any finding is recorded. If it does not, STOP
      and report an EVIDENCE-INTEGRITY FAILURE.
    - >-
      TWO SEPARATE VERDICTS, PHYSICALLY SEPARATE. Check (a) in
      bis_residual_review.md, check (b) in ctrl_810a_review.md. validation_report.yaml
      carries them SIDE BY SIDE WITH NO COMBINED VERDICT. Issue no overall grade.
    - >-
      CHECK (a), THE MATHEMATICS IS THE HIGH-STAKES ITEM AND MUST BE WORKED, NOT READ.
      If a bounded-index-subgroup proposition is stated, work EVERY lemma and the
      assembly step by step from YOUR OWN arithmetic, as TASK-20260731-705 worked
      PROP-701-I's three steps, TASK-20260801-804 worked Proposition 801-1's four, and
      TASK-20260801-809 worked Proposition 806-1's four plus its Assembly. State
      explicitly whether the statement FOLLOWS, is OVERSTATED, or DOES NOT FOLLOW.
      THEN ATTACK THE TYPE-STABILITY CLAIM SEPARATELY: a subgroup that EXISTS but is
      not emitted-and-consumed by Step 1 does NOT repair the induction, and a package
      that conflates existence with repair is committing the batch's most likely
      error. If a COUNTEREXAMPLE CERTIFICATE is offered instead, RE-VERIFY IT FROM THE
      COMMITTED CODE and say whether it certifies what it claims.
    - >-
      CHECK (a), THE SCREEN IN BOTH DIRECTIONS. Verify screen_bis.json was frozen
      before the derivation as far as the COMMITTED BYTES permit, that every candidate
      carries a verdict from the closed set, that every PURSUE carries its separate
      tractability judgement, that both interface conversions are reported, and that
      DEFERRED_UNBOUNDED is excluded from any count. THEN AUDIT ADVERSARIALLY IN THE
      OTHER DIRECTION: for each candidate killed, is the constant claimed for it
      CORRECT, or was legitimately in-scope work discarded on an inflated constant?
      PREMATURE CLOSURE IS A FAILURE MODE SYMMETRIC WITH OVERCLAIMING, and this
      campaign has ALREADY DEMONSTRATED ONE INSTANCE OF IT (RT-8). Report both
      directions.
    - >-
      CHECK (b), THE COMPUTATION IS RE-EXECUTED, NOT READ. Rebuild the GF(2^4)
      composition census from YOUR OWN arithmetic, taking no code and no constants
      from the producer, for n = 1..5 under BOTH composition models, and report YOUR
      OWN numbers. Any discrepancy with the producer's figures is a DEFECT and is
      reported as one. Independently recompute the frontier ceiling q^(4(4-dim K)) and
      state whether the producer's comparison against it is arithmetically right.
    - >-
      CHECK (b), THE LEG DISPOSITIONS AND THE PROBE. Confirm capability_probe.json
      records exact commands and exit statuses, and that the leg C disposition follows
      from it. IF LEG C DID NOT RUN, CONFIRM IT IS RECORDED AS OPEN AND UNATTEMPTED
      AND AS INFRASTRUCTURE SIGNAL, AND THAT NOTHING IN THE PACKAGE CONVERTS THE UNRUN
      LEG INTO A FINDING IN EITHER DIRECTION. A package that reads an unavailable
      dependency as evidence about GF(2^8) is committing AGENTS.md rule 5's exact
      error and that is a MAJOR defect. Confirm equally that a leg B sample shortfall
      is reported as budget and not as a bound on the minimum.
    - >-
      CHECK (b), THE PRE-REGISTRATION. Confirm the three pre-registered outcomes and
      the RT-1 secondary-leg prediction were written BEFORE measurement as far as the
      committed bytes permit, and that the reported outcome is the one the numbers
      support. IF THE MEASUREMENT FALSIFIED RT-2 (outcome ii) AND THE PACKAGE DID NOT
      SAY SO, THAT IS A MAJOR DEFECT: the red team named that outcome deliberately
      against itself and it must not be quietly dropped.
    - >-
      THE FOUR GATES, INDEPENDENTLY ASSESSED, IF ANY COST OR ASYMPTOTIC STATEMENT
      EXISTS IN EITHER PACKAGE. Return YOUR OWN per-gate assessment: (1) genuine
      single-responsibility lemma decomposition with the assembly carrying explicit
      per-attempt-cost x inverse-success-probability bookkeeping; (2) EVERY conditional
      dependence numbered and formally stated and each paired with archived validation
      evidence or a specification concrete enough to DISPATCH -- NAMING ANY UNNUMBERED
      ASSUMPTION YOU FIND IS THE HIGHEST-VALUE DEFECT AVAILABLE IN THIS CHECK, and
      BATCH-004 proves it: two reviewers found two DIFFERENT unnumbered dependences in
      one package and a third remains open; (3) honest hidden-overhead, memory,
      time-memory-tradeoff and parallelization accounting with optimistic assumptions
      individually flagged and an affected-vs-safe scope statement; (4) recorded as
      satisfied by YOUR review together with the TASK-20260810-37042c red team and by
      NOTHING THE PRODUCER DID. WHERE A GATE IS NOT MET, NAME THE GATE. DO NOT
      RECOMMEND PROMOTION.
    - >-
      PROVENANCE AUDIT, PER ARTIFACT CLASS, UNDER THE PART C COVERING-MANIFEST CLAUSE
      AND THE CLOSED CASE-INSENSITIVE CLASS VOCABULARY. Confirm each task designated
      ONE covering manifest whose artifact_provenance list covers EVERY declared
      artifact of that task and in which EVERY OTHER MANIFEST OF THE TASK APPEARS AS
      AN ENTRY; that every `kind` resolves inside SOURCE_CODE /
      MACHINE_READABLE_MANIFEST / PROSE_REPORT / LEDGER_AND_COORDINATION_RECORD under
      the alias rule with NO FIFTH CLASS INVENTED; that each SOURCE_CODE artifact
      carries its comment-block stanza; that each PROSE_REPORT carries EITHER an
      in-text block OR a manifest pointer, BOTH EQUALLY COMPLIANT; and that every
      asserted digest matches the committed bytes YOU RECOMPUTE. Report any gap as a
      completion-gate defect.
    - >-
      C2 STAMP AUDIT. Confirm both producers' budget_stamps.json exist and satisfy the
      C2 duty, that both covering manifests report session elapsed and compute seconds
      SEPARATELY, and that no producer offered compute seconds as budget compliance.
      Note that a producer-written timestamp is PRODUCER ATTESTATION and not a
      mechanism, and say what you could and could not verify.
    - >-
      SUPERSESSION, IMMUTABILITY AND STAND-DOWN AUDITS. Confirm by
      `git diff --name-status` that no BATCH-001 through BATCH-004 committed artifact
      was modified in place and that each new file names what it supersedes. Confirm
      NEITHER producer performed mutation-control repair, escape enumeration or any
      instrument work. Confirm neither producer quoted, extended or reasoned from the
      STRUCK section 5 cost table, and that any citation of Proposition 806-1 is at ONE
      interface, for the F-linear round-independent subclass, NOT as a cost inequality
      and NOT with U-809-1 dropped. Report any instance as a scope violation.
    - >-
      RECORD YOUR OWN INFERENCE BLOCK and state plainly that under
      inference-amendment 0137a051 your independence is in SESSION AND NOT IN MODEL --
      you resolve to the same model as both producers, the red team and the
      Coordinator -- and that this BLOCKS ANY GOAL-CLOSURE ATTESTATION FROM YOUR
      SESSION and makes agreement between you and the red team CORRELATED rather than
      independent confirmation.
    - >-
      Every literature statement you make is UNVERIFIED-FROM-MEMORY and must be marked
      as such at the point of use. Two agreeing recollections are not a citation.
    - >-
      DO NOT REPAIR, EDIT, EXTEND OR RE-RUN producer artifacts to make them pass.
      Defects are reported, not fixed. Write only under this task's own directory.
    - >-
      CHANGE NO OFFICIAL STATE. Propose no hypothesis status, create no ledger record,
      promote nothing to knowledge, assign NO EVIDENCE STRENGTH, and propose no
      closure or reject_scoped -- those are the Coordinator's transition in
      TASK-20260810-b26b16. Distinguish absence of evidence from impossibility, and
      infrastructure failure from mathematical result. EVERYTHING HERE IS TOY SCALE
      AND NONE OF IT IS CRYPTO-SCALE EVIDENCE.

  deliverables:
    - budget_stamps.json
    - validation_report.yaml
    - bis_residual_review.md
    - ctrl_810a_review.md

  budget:
    wall_clock_seconds: 1400
    memory_gb: 4
    maximum_runs: 8
    queue_computed_binding_stop_utc: '2026-08-10T01:01:53Z'

  completion_gate:
    - >-
      budget_stamps.json exists, was written as the first act with a binding_stop_utc
      computed from this task's own start plus 1400 s, carries boundary stamps,
      records halted_on_budget truthfully, NAMES every check not run, and is COMMITTED
      as a declared artifact; validation_report.yaml is the covering manifest and
      reports session elapsed and compute seconds SEPARATELY.
    - >-
      The snapshot receipt is confirmed against Git, or the task stops and reports an
      evidence-integrity failure.
    - >-
      Two verdicts are issued in two physically separate files and
      validation_report.yaml carries them side by side with NO combined verdict.
    - >-
      bis_residual_review.md returns an explicit verdict -- FOLLOWS / OVERSTATED /
      DOES NOT FOLLOW for any stated proposition, worked lemma by lemma from the
      validator's own arithmetic; a SEPARATE explicit verdict on the TYPE-STABILITY
      claim; and, where a counterexample certificate was offered, an independent
      re-verification of it from the committed code.
    - >-
      bis_residual_review.md audits the layer-dependence screen v2 in BOTH directions
      -- that no IN_SCOPE_VACUOUS candidate was pursued, AND that no in-scope candidate
      was killed on an inflated constant -- and checks that every PURSUE carries its
      separate tractability judgement and that DEFERRED_UNBOUNDED is excluded from
      every count.
    - >-
      ctrl_810a_review.md reports the validator's OWN re-execution of the GF(2^4)
      composition census under BOTH models from its own arithmetic, with its own
      numbers, its own recomputation of the frontier ceiling, and every discrepancy
      named as a defect.
    - >-
      ctrl_810a_review.md returns an explicit finding on the leg dispositions: whether
      the probe supports the leg C disposition, whether an unrun leg is recorded as
      OPEN AND UNATTEMPTED and as INFRASTRUCTURE SIGNAL, and whether anything in the
      package converts an unrun leg or a sample shortfall into a finding in either
      direction.
    - >-
      ctrl_810a_review.md states which of the three pre-registered outcomes the numbers
      support and confirms the package reported it -- expressly including outcome (ii),
      which FALSIFIES RT-2 -- with any silent omission recorded as a MAJOR defect.
    - >-
      IF any cost or asymptotic statement exists, the validator's OWN per-gate
      assessment of gates (1)-(3) is returned with any unnumbered conditional
      dependence NAMED EXPLICITLY, gate (4) is recorded as satisfied by this review
      together with the red team and by nothing the producer did, any unmet gate is
      NAMED, and no promotion is recommended.
    - >-
      validation_report.yaml records the per-artifact-class Part C provenance audit for
      all eleven producer artifacts with digests RECOMPUTED, the C2 stamp audit, the
      supersession and immutability check, the stand-down audit, and the struck-cost-
      table and Proposition-806-1 citation audits.
    - >-
      validation_report.yaml lists every defect with a severity, carries the
      validator's own inference block with the SESSION-NOT-MODEL independence
      statement, asserts no official state change, assigns no evidence strength, and
      recommends no promotion.

  return_format: >-
    The four artifacts, plus a plain statement of: (i) the two verdicts, separately;
    (ii) whether any stated proposition FOLLOWS and whether it is TYPE-STABLE;
    (iii) the validator's own census numbers under both composition models and any
    discrepancy; (iv) which pre-registered outcome the numbers support; (v) every
    defect by severity, with any unnumbered conditional dependence named first;
    (vi) the checks not run, each named; and (vii) the authoring-inclusive session
    elapsed and, separately, the compute seconds.
