task_card:
  id: TASK-20260810-415ed7
  goal_id: GOAL-AES-001
  batch_id: BATCH-005
  role: coordinator
  archive_kind: snapshot
  title: Archive the AES BATCH-005 producer snapshot
  handoff_ref: ledger/handoffs/TASK-20260810-415ed7.yaml
  covering_manifest: snapshot-receipt.json
  review_required: false
  depends_on:
    - TASK-20260810-51fafe
    - TASK-20260810-a0e0ae

  objective: >-
    Commit and verify the exact BATCH-005 producer artifacts -- the
    bounded-index-subgroup residual package (TASK-20260810-51fafe, five artifacts)
    and the CTRL-810-A saturating frontier census package (TASK-20260810-a0e0ae, six
    artifacts), ELEVEN ARTIFACTS IN TOTAL -- before any independent review or red
    team reads them. RUN ALONE. This is a SNAPSHOT archive, not a ledger archive: it
    commits NO ledger record and record_ids is EMPTY.

  binding_clauses_stated_in_identical_language_across_producing_and_archival_cards:

    c2_stamp_duty: >-
      C2 STAMP DUTY, protocol-amendment-GOAL-AES-001-005 PART B, STATED IN IDENTICAL
      LANGUAGE ACROSS PRODUCING AND ARCHIVAL CARDS. (i) AS YOUR FIRST ACT, BEFORE ANY
      RESEARCH WORK, write budget_stamps.json in your own task directory carrying
      `start_utc`, `start_epoch`, `declared_wall_clock_seconds` and
      `binding_stop_utc` COMPUTED AS YOUR OWN START PLUS YOUR DECLARED BUDGET.
      (ii) Write a further stamp at EACH MAJOR SECTION BOUNDARY, each carrying `utc`,
      `elapsed_s` and a `marker` naming what was completed. (iii) HALT at
      `binding_stop_utc`, record `halted_on_budget` truthfully, and NAME the work
      dropped as a consequence. (iv) COMMIT those stamps as a declared artifact of
      this task, so a reviewer reads the timeline from committed bytes rather than
      from a relayed observation. The TASK-20260801-810 `budget` block is the
      REFERENCE IMPLEMENTATION and is named as the model to copy. THE QUEUE-COMPUTED
      binding_stop_utc FOR THIS CARD IS 2026-08-10T00:46:53Z, computed from the
      BATCH-005 dispatch stamp 2026-08-10T00:38:33Z plus this card's declared 500 s;
      it is the DISPATCH-BASIS REFERENCE, recorded so the intended timeline is
      readable from the queue. THE STOP YOU HALT ON IS THE ONE YOU COMPUTE FROM YOUR
      OWN START -- and for this card the two DIFFER BY CONSTRUCTION, because this task
      begins only after both producers complete; the queue figure is a reference and
      is NOT your governing stop. A HALT AT binding_stop_utc IS INFRASTRUCTURE SIGNAL,
      NEVER A NEGATIVE MATHEMATICAL RESULT (AGENTS.md rule 5), and dropped work is
      SCOPE, NEVER AN ANSWER (rule 8).

    c4_authoring_inclusive_declaration_basis: >-
      C4 AUTHORING-INCLUSIVE DECLARATION BASIS, protocol-amendment-GOAL-AES-001-005
      PART B, STATED IN IDENTICAL LANGUAGE ACROSS PRODUCING AND ARCHIVAL CARDS. This
      card's declared budget is calibrated against AUTHORING-INCLUSIVE SESSION
      ELAPSED -- first act to terminal receipt -- and NOT against compute. REPORT THE
      COMPUTE COMPONENT SEPARATELY, in its own field `compute_wall_clock_seconds`, in
      the covering manifest and beside the authoring-inclusive figure, so the two are
      never again conflated. COMPUTE SECONDS MAY NOT BE OFFERED AS EVIDENCE OF BUDGET
      COMPLIANCE (prospective only; TASK-20260801-806's compute-based posture was
      COMPLIANT under the old rule and is NOT re-graded). Your budget duty is
      discharged ENTIRELY BY THE C2 STAMP DUTY: a task that stamps honestly and halts
      at its own binding_stop_utc HAS COMPLIED IN FULL even if the dispatcher-observed
      session elapsed later exceeds this declaration, and any residual is a
      CAMPAIGN-SIDE ACCOUNTING FACT, NEVER A PRODUCER DEFECT AND NEVER A RETURNED
      TASK (C3).

    part_c_covering_manifest_and_closed_class_vocabulary: >-
      PART C PROVENANCE GATE, protocol-amendment-GOAL-AES-001-005 PART C, IN FORCE
      FROM BATCH-005, STATED IN IDENTICAL LANGUAGE ACROSS PRODUCING AND ARCHIVAL
      CARDS. (i) THE COVERING-MANIFEST CLAUSE, which REPLACES amendment 004 Part B's
      literal per-manifest reading (D-808-1 UPHELD on the decisive empirical ground
      that the literal reading demonstrably generates digests no party can verify):
      "AT LEAST ONE machine-readable manifest per task, DESIGNATED THE COVERING
      MANIFEST, carries an `artifact_provenance` list covering EVERY DECLARED
      ARTIFACT OF THE TASK; EVERY OTHER MANIFEST OF THE TASK MUST APPEAR AS AN ENTRY
      IN IT." The covering manifest is named explicitly by the task's card and by the
      manifest itself. Entry fields are UNCHANGED from amendment 004: `path`, `kind`,
      `sha256`, `comment_block_inference_stanza` (boolean, stated honestly including
      when false), `covered_by_this_manifest_inference_block` (boolean). A
      self-referential digest remains impossible and is recorded as SELF.
      (ii) THE CLOSED, CASE-INSENSITIVE CLASS VOCABULARY: the four class names are
      SOURCE_CODE, MACHINE_READABLE_MANIFEST, PROSE_REPORT and
      LEDGER_AND_COORDINATION_RECORD, matched CASE-INSENSITIVELY and ignoring
      underscore/hyphen/space differences. NO FIFTH CLASS MAY BE INVENTED BY A
      PRODUCER OR BY AN ARCHIVAL TASK; a value outside the vocabulary is a DEFECT TO
      REPORT, never a class to create, and the artifact is classified into one of the
      four by what it is. EXPLICIT ALIAS RULE: any `kind` naming a machine-readable
      structured-data artifact -- INCLUDING `machine_readable_prescreen`,
      `prescreen`, `results_json`, `receipt` -- RESOLVES TO
      MACHINE_READABLE_MANIFEST; a prose `.md` deliverable resolves to PROSE_REPORT;
      executable text resolves to SOURCE_CODE; anything under `ledger/**` or
      `coordination/**` authored by the Coordinator resolves to
      LEDGER_AND_COORDINATION_RECORD and carries NO obligation under this gate.
      (iii) INFERENCE BLOCKS: every declared artifact carries a filled `inference`
      block recording policy, requested_policy, the ACTUAL resolved model identifier,
      fallback_used, model_verified (false if `python3 -m orchestration.adapter doctor
      --probe` was not run), and the standing basis
      0137a051eb5828789eb267fa83c8278086578d4c; an unobserved resolved model is
      recorded as `unrecorded`, NEVER GUESSED. Every SOURCE_CODE artifact
      ADDITIONALLY carries a comment-block inference stanza in its own text; every
      PROSE_REPORT carries EITHER an in-text inference block OR a provenance pointer
      naming the covering manifest, BOTH FORMS EQUALLY COMPLIANT AND NEITHER
      PREFERRED. Missing or partial fails this task.

    declaration_sized_against_part_a_reference_actuals: >-
      DECLARATION SIZED AGAINST THE PER-ROLE REFERENCE ACTUALS IN
      protocol-amendment-GOAL-AES-001-005 PART A, STATED IN IDENTICAL LANGUAGE ACROSS
      PRODUCING AND ARCHIVAL CARDS. This card declares 500 s. Part A's snapshot-archive
      line records 378 s MEASURED (TASK-803) and 350 s CHARGED AT DECLARATION AND
      NEVER MEASURED (TASK-808), and SIZES AT 500 -- ABOVE BOTH, on the stated ground
      that the only measured datum PREDATES the provenance gate that now applies at
      this archive. SIZING AT MAXIMA IS THE CONTINGENCY: NO SEPARATE CUSHION IS ADDED
      ON TOP AND NONE MAY BE INFERRED. Part A's own red-team-this note applies: three
      of the eight BATCH-005 sizing lines rest on numbers no clock ever produced, and
      this is one of them. THE DECLARATION IS A BINDING STOP CONDITION, NOT AN
      ALLOWANCE.

  constraints:
    - >-
      THE FOUR BINDING CLAUSES ABOVE APPLY IN FULL AND IN THE SAME WORDS THE PRODUCER
      CARDS CARRY: the C2 stamp duty with a computed binding_stop_utc and the stamps
      COMMITTED; the C4 authoring-inclusive declaration basis with compute reported
      separately; the Part C covering-manifest clause and the closed case-insensitive
      class vocabulary; and a declaration sized against Part A's per-role reference
      actuals.
    - >-
      RUN ALONE. No other task may hold the Git index or HEAD concurrently.
    - >-
      STAGE ONLY the eleven declared producer artifact paths and this task's own two
      artifact paths. A scope-expanding commit blocks downstream review; it is an
      EVIDENCE-INTEGRITY FAILURE, not a research result. In particular DO NOT STAGE
      knowledge/INDEX.md or any coordination/**/dispatch_plan.{json,md}: they are
      GENERATED and .gitignore'd, and staging one is a scope violation.
    - >-
      The commit message names TASK-20260810-51fafe, TASK-20260810-a0e0ae,
      TASK-20260810-415ed7, BATCH-005 and GOAL-AES-001.
    - >-
      VERIFY THE PART C GATE BEFORE COMMITTING, ARTIFACT BY ARTIFACT AND CLASS BY
      CLASS. Confirm each producer designated ONE covering manifest
      (bis_results.json for TASK-20260810-51fafe, census_results.json for
      TASK-20260810-a0e0ae); that the covering manifest's artifact_provenance list
      covers EVERY declared artifact of its task; that EVERY OTHER MANIFEST OF THE
      TASK APPEARS AS AN ENTRY IN IT -- for TASK-20260810-a0e0ae that expressly
      includes capability_probe.json and screen_ctrl810a.json; that every `kind`
      resolves inside the closed case-insensitive four-class vocabulary under the
      alias rule; that each SOURCE_CODE artifact carries its own comment-block
      stanza; and that each PROSE_REPORT carries EITHER an in-text block OR a
      manifest pointer, BOTH EQUALLY COMPLIANT AND NEITHER PREFERRED. A missing or
      partial block, a missing or incomplete artifact_provenance list, a manifest not
      covered by the covering manifest, an INVENTED FIFTH CLASS, or a digest that does
      not match the committed bytes is a COMPLETION-GATE FAILURE AT DISPATCH: the
      producing task is RETURNED AS INCOMPLETE rather than snapshotted, with the
      defect named concretely. DO NOT WAIVE IT AND DO NOT REFER IT FORWARD. If a case
      arises that the four classes do not cover, record it as a NEW REFERRED DEFECT
      AND DO NOT INVENT A CLASS.
    - >-
      RECOMPUTE EACH DECLARED ARTIFACT'S SHA-256 YOURSELF and confirm it matches the
      artifact_provenance entry asserted by its covering manifest. Record BOTH values
      for every artifact. A provenance list that does not match the bytes is a defect,
      not a formality. A self-referential digest is recorded as SELF and is NOT
      asserted -- D-809-1 recorded a snapshot receipt asserting an unverifiable
      self-digest, and that is not repeated here.
    - >-
      VERIFY THE C2 STAMP ARTIFACTS, WHICH ARE THE DISTINCTIVE GATE OF THIS BATCH AND
      CANNOT BE CHECKED LATER. Confirm each producer's budget_stamps.json exists,
      carries start_utc, start_epoch, declared_wall_clock_seconds and a
      binding_stop_utc COMPUTED as start plus declared, carries boundary stamps with
      utc/elapsed_s/marker, records halted_on_budget truthfully, and NAMES any dropped
      work. Confirm each covering manifest reports session_elapsed_seconds and
      compute_wall_clock_seconds AS SEPARATE FIELDS. NOTE HONESTLY IN THE RECEIPT that
      a timestamp inside a producer-written file is PRODUCER ATTESTATION and is NOT
      auditable from committed bytes alone (the V-804-2 lesson, which amendment 005
      Part B restates and does not repair), and record exactly what you could and
      could not verify.
    - >-
      VERIFY THE LAYER-DEPENDENCE SCREEN v2 FREEZE. Confirm screen_bis.json and
      screen_ctrl810a.json exist, are marked as written before any derivation or
      compute with the ordering anchored in COMMITTED BYTES rather than a file mtime,
      carry a verdict for every candidate from the closed set PURSUE /
      IN_SCOPE_VACUOUS / DEFERRED_UNBOUNDED, carry a SEPARATE tractability judgement
      for every PURSUE, report BOTH interface conversions, and EXCLUDE
      DEFERRED_UNBOUNDED from any count of rulings. Confirm no candidate recorded
      IN_SCOPE_VACUOUS was pursued in the accompanying report. A missing, unmarked or
      contradicted screen is a COMPLETION-GATE FAILURE and the producing task is
      returned as incomplete.
    - >-
      VERIFY THAT AN UNATTEMPTED LEG IS RECORDED AS UNATTEMPTED. If
      TASK-20260810-a0e0ae's capability probe failed and leg C did not run, confirm
      the package records leg C as OUT OF SCOPE AS INFRASTRUCTURE SIGNAL and OPEN AND
      UNATTEMPTED, and confirm it is NOWHERE recorded as a negative mathematical
      result, as evidence about |R^(n)| over GF(2^8), or as a confirmation or
      refutation of RT-2 or HEUR-806-1. A package that converts an unrun leg into a
      finding is RETURNED AS INCOMPLETE. THIS IS AGENTS.md RULE 5 AND IT IS THE ONE
      THIS BATCH IS MOST EXPOSED TO.
    - >-
      DO NOT WRITE THE COMMIT'S OWN SHA INTO ANY ARTIFACT INSIDE THAT COMMIT. Record
      the PARENT SHA, and PERFORM the follow-on commit_sha / parent_sha binding write
      after the commit, as TASK-20260801-803 and TASK-20260801-808 did.
    - >-
      CREATE NO evidence, decision, hypothesis or knowledge record in this task. This
      is a snapshot archive: archive.record_ids is EMPTY.
    - >-
      DO NOT REPAIR, EDIT, EXTEND OR RE-RUN any producer artifact to make it pass.
      Defects are RECORDED AND RETURNED, never fixed here.
    - >-
      Do not modify any BATCH-001 through BATCH-004 committed artifact.
    - >-
      BEFORE COMMITTING, fetch origin/main and compare it with this working branch;
      bring new main changes in by MERGING, never rebasing. Record the base commit
      checked and the merge outcome in the receipt. AFTER COMMITTING, push the branch
      and open or refresh a PR against main naming TASK-20260810-51fafe,
      TASK-20260810-a0e0ae and TASK-20260810-415ed7 -- a record that exists only in a
      local commit is UNPUBLISHED, not durable evidence.

  deliverables:
    - budget_stamps.json
    - snapshot-receipt.json

  budget:
    wall_clock_seconds: 500
    memory_gb: 1
    maximum_runs: 1
    queue_computed_binding_stop_utc: '2026-08-10T00:46:53Z'

  completion_gate:
    - >-
      budget_stamps.json exists, was written as the first act, carries start_utc,
      start_epoch, declared_wall_clock_seconds and a binding_stop_utc computed from
      this task's own start plus 500 s, carries boundary stamps, records
      halted_on_budget truthfully, and is COMMITTED as a declared artifact.
    - >-
      snapshot-receipt.json is DESIGNATED THE COVERING MANIFEST of this task, reports
      session_elapsed_seconds and compute_wall_clock_seconds as SEPARATE fields, and
      carries an artifact_provenance list covering both of this task's declared
      artifacts with budget_stamps.json as an ENTRY and its own entry as SELF.
    - >-
      Every one of the ELEVEN producer artifacts carries a filled inference block AND
      satisfies the Part C gate FOR ITS OWN ARTIFACT CLASS under the closed
      case-insensitive vocabulary, or the offending producer task is RETURNED AS
      INCOMPLETE and NOT SNAPSHOTTED, with the defect and the class named. No fifth
      class was invented; any uncovered case is recorded as a NEW REFERRED DEFECT.
    - >-
      Each artifact's recomputed SHA-256 matches the artifact_provenance entry asserted
      by its covering manifest, and the receipt records BOTH values for every artifact;
      no unverifiable self-digest is asserted.
    - >-
      Both producers' budget_stamps.json satisfy the C2 duty, both covering manifests
      report session elapsed and compute seconds separately, and the receipt states
      exactly what was and was not independently verifiable about the stamps, naming
      producer attestation as attestation.
    - >-
      Both layer-dependence screen v2 artifacts exist, are frozen with the ordering
      anchored in committed bytes, use only the closed verdict set, carry a separate
      tractability judgement for every PURSUE, report both interface conversions, and
      exclude DEFERRED_UNBOUNDED from any count; no IN_SCOPE_VACUOUS candidate was
      pursued.
    - >-
      Any unattempted leg -- expressly including TASK-20260810-a0e0ae leg C -- is
      recorded as OPEN AND UNATTEMPTED and as INFRASTRUCTURE SIGNAL, and NOWHERE as a
      negative mathematical result or as a confirmation or refutation of any finding.
    - >-
      Git verifies the commit is reachable from HEAD, has the expected parent, changes
      EXACTLY the thirteen declared paths, and matches the recorded SHA-256 hashes; no
      gitignored generated file was staged.
    - >-
      The receipt names the two source task IDs, the archive kind `snapshot`, the
      parent SHA, the base commit of origin/main checked and the merge outcome, and a
      SHA-256 for every committed path; record_ids is EMPTY because a snapshot archive
      commits no ledger record.
    - >-
      The commit_sha / parent_sha binding write prescribed by the receipt is ACTUALLY
      PERFORMED after the commit, and the branch is pushed with a PR opened or
      refreshed naming the three task IDs.

  return_format: >-
    The snapshot receipt, plus a plain statement of the commit SHA, its parent, the
    base commit of origin/main checked and the merge outcome, the count of paths
    committed, the per-artifact-class Part C verdict for all eleven producer
    artifacts, the C2 stamp verdict for both producers including what could not be
    verified from committed bytes, the layer-dependence screen v2 freeze verdict for
    both producers, and an explicit statement of whether TASK-20260810-a0e0ae leg C
    ran or is recorded OPEN AND UNATTEMPTED.
