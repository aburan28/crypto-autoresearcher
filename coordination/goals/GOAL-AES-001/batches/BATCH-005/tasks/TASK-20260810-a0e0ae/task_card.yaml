    - >-
      The three pre-registered outcomes and the RT-1 secondary-leg prediction (minimum
      2^24 attained on ker(M+I) in dimension 1) appear in a section marked as written
      BEFORE measurement, with the measured values beside them; the report states
      explicitly which outcome the measurement supports, INCLUDING outcome (ii), which
      FALSIFIES RT-2, if that is what was measured.
    - >-
      screen_ctrl810a.json exists, is marked as written before any derivation or
      compute with its ordering anchored in committed bytes, applies the
      LAYER-DEPENDENCE SCREEN v2 by name with verdicts PURSUE / IN_SCOPE_VACUOUS /
