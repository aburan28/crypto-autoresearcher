  why_this_is_rank_2_and_why_it_cannot_be_dropped: >-
    IT SETTLES RT-1, RT-2, RT-3 AND RT-5 IN ONE BOUNDED TASK, and it IS HEUR-806-1's
    OWN ALREADY-SPECIFIED VALIDATION EXPERIMENT, which the Coordinator contract
    requires be PAIRED WITH A CONDITIONAL RESULT IN THE SAME OR THE FOLLOWING BATCH.
    THAT OBLIGATION, NOT ITS RESEARCH RANK, IS WHY IT CANNOT BE DROPPED: it is
    NON-DEFERRABLE PAST BATCH-005, because BATCH-005 is the last batch that may open
    new research questions and BATCH-006 is reserved for consolidation. It is also the
    precondition for any knowledge promotion out of the BATCH-004 material. IT RANKS
    BELOW RANK 1 ON RESEARCH PRIORITY AND ABOVE IT ON SCHEDULING PRIORITY: the two
    DISPATCH CONCURRENTLY under the unchanged max_concurrent of 3, which resolves
    rather than overrules the earlier "first producer item" phrasing and is
    additionally the hedge against this card's named infrastructure blocker.

  the_object_stated_exactly_so_it_is_not_drifted_from: >-
    Compute the ACTUAL composed relation size |R^(n)(x)| for n = 1..5 BY DIRECT
    COMPOSITION, under TWO EXPLICITLY SEPARATED COMPOSITION MODELS: (M-AFFINE) Phi
    composed with itself, NO nonlinear layer; and (M-NONLINEAR) Phi . SB composed,
    WITH THE REAL AES S-BOX. Report |R^(n)| against BOTH the modelled J^n AND the
    frontier ceiling q^(4(4 - dim K)). ADD ker(M+I) = span(1,1,1,1) TO THE GF(2^8)
    WITNESS LIST -- RT-1 found it by re-running the producer's own unmodified code on
    an untried input, it is the unique-up-to-scalar MixColumns eigenvector, it reads
    J = 2^24 where every producer witness reads 2^32, and it is a measure-zero object
    the producer's support-structured witnesses could not reach. RUN HEUR-806-1's OWN
    GF(2^8) CENSUS as the secondary leg. THE THREE OUTCOMES ARE PRE-REGISTERED BY THE
    RED TEAM AND ARE NOT TO BE ADJUSTED AFTER MEASUREMENT: (i) |R^(n)| = min(J^n,
    ceiling) and M-affine differs from M-nonlinear => RT-2 CONFIRMED (the central
    column must be replaced by the capped column throughout) AND RT-3 CONFIRMED
    MATERIAL (the two composition models are not interchangeable, so the n-axis needs
    an explicit class statement before it means anything); (ii) |R^(n)| agrees with
    the UNCAPPED J^n anywhere at n >= 2 => THE RED TEAM'S OWN DIMENSION COUNT IS WRONG
    AND RT-2 IS FALSIFIED, an outcome the red team named deliberately against itself
    and which this task must report as such if it occurs; (iii) M-nonlinear tracks
    M-affine closely => RT-3 MATERIALLY WEAKENED, though still an unstated dependence
    that should be numbered, and the n-axis survives with a stated class caveat. ON
    THE SECONDARY LEG: RT-1 predicts the GF(2^8) minimum is 2^24, attained exactly on
    ker(M+I) in dimension 1; ANY KERNEL WITH J < 2^24 FALSIFIES HEUR-806-1 and makes
    RT-1's "confirms the heuristic" framing wrong.

  the_named_infrastructure_blocker_and_its_resolution: >-
    RESOLVED IN THE QUEUE BEFORE THIS CARD WAS DECLARED, AS next_action REQUIRES, AND
    NOT ASSUMED AWAY. Read
    coordination/goals/GOAL-AES-001/batches/BATCH-005/dispatch_queue.json ->
    batch_notes.rank_2_infrastructure_blocker_resolution IN FULL. In summary, binding
    on this task: THE BLOCKER IS ABOUT SCALE AND COMPOSITION, NOT ABOUT GF(2^8) AS
    SUCH, and the committed record already shows where the line falls -- RT-1
    re-executed the producer's UNMODIFIED PURE-PYTHON code over GF(2^8) SUB-SECOND per
    call, while NR-3 records that what could not be run was DIRECT COMPOSITION OF
    R^(n) FOR n >= 2, which "needs numpy or C for GF(2^8)".
    LEG A -- THE GF(2^4) CENSUS, n = 1..5, BOTH COMPOSITION MODELS, over the
    enumeration the producer already ran: IN SCOPE, PRIMARY, PURE PYTHON ADEQUATE BY
    THE RED TEAM'S OWN COST STATEMENT. THIS LEG ALONE MEETS THIS CARD'S COMPLETION
    GATE.
    LEG B -- HEUR-806-1's GF(2^8) census at n = 1 over the SIX PRODUCER WITNESSES PLUS
    ker(M+I) = span(1,1,1,1): IN SCOPE AND DEPENDENCY-FREE BY DEMONSTRATED
    MEASUREMENT. The seeded sample of 10^3 kernels per dimension is admitted ONLY AS
    FAR AS THE DECLARED BUDGET REACHES: record the ACHIEVED count exactly and name any
    shortfall against 10^3 as OPEN AND UNATTEMPTED. A shortfall is BUDGET, not a
    mathematical finding, and specifically does NOT establish that 2^24 is or is not
    the global minimum -- NR-1 already records that a kernel with J < 2^24 is
    UNRESOLVED, and it stays UNRESOLVED unless this leg resolves it.
    LEG C -- GF(2^8) DIRECT COMPOSITION AT n >= 2: CONDITIONAL, BEHIND A RECORDED
    ONE-SHOT CAPABILITY PROBE THAT IS YOUR FIRST COMPUTE ACT, after the C2 start stamp
    and before any census. Write capability_probe.json recording the EXACT commands
    and exit statuses of (i) `python3 -c 'import numpy; print(numpy.__version__)'` and
    (ii) a trivial C compile-and-link of a hello-world with the system compiler. NO
    NETWORK FETCH OF A PACKAGE IS REQUIRED OR ASSUMED; at most ONE bounded, recorded
    install attempt from an already-available local source may be made, and a failure
    of it is recorded as INFRASTRUCTURE SIGNAL and NOT RETRIED. IF THE PROBE SUCCEEDS,
    run leg C at the scale that fits the declared budget and record the achieved
    n-range exactly. IF THE PROBE FAILS, LEG C IS DECLARED OUT OF SCOPE FOR BATCH-005
    AS INFRASTRUCTURE SIGNAL and is recorded as OPEN AND UNATTEMPTED. IT IS NEVER
    RECORDED AS A NEGATIVE MATHEMATICAL RESULT, never as evidence about |R^(n)| over
    GF(2^8), and never as a confirmation or a refutation of RT-2 or of HEUR-806-1
    (AGENTS.md rule 5). THE BATCH DOES NOT FAIL ON LEG C.
    A CONFLICT IN THE RECORD, STATED RATHER THAN RESOLVED BY PREFERENCE: GOAL-AES-001
    environment_context.verified_tooling records "gcc 13.3.0 with -maes" as verified
    for this campaign, while the dispatching session reports that no C toolchain is
    assumed for BATCH-005. The Coordinator has no shell, cannot test either statement,
    and does not pick the more convenient side. THE PROBE IS THE RESOLUTION, and its
    committed output is the answer.

  binding_clauses_stated_in_identical_language_across_producing_and_archival_cards:

    c2_stamp_duty: >-
      C2 STAMP DUTY, protocol-amendment-GOAL-AES-001-005 PART B, STATED IN IDENTICAL
      LANGUAGE ACROSS PRODUCING AND ARCHIVAL CARDS. (i) AS YOUR FIRST ACT, BEFORE ANY
      RESEARCH WORK, write budget_stamps.json in your own task directory carrying
      `start_utc`, `start_epoch`, `declared_wall_clock_seconds` and
      `binding_stop_utc` COMPUTED AS YOUR OWN START PLUS YOUR DECLARED BUDGET.
      (ii) Write a further stamp at EACH MAJOR SECTION BOUNDARY, each carrying `utc`,
      `elapsed_s` and a `marker` naming what was completed. (iii) HALT at
      `binding_stop_utc`, record `halted_on_budget` truthfully, and NAME the work
      dropped as a consequence. (iv) COMMIT those stamps as a declared artifact of
      this task, so a reviewer reads the timeline from committed bytes rather than
      from a relayed observation. The TASK-20260801-810 `budget` block is the
      REFERENCE IMPLEMENTATION and is named as the model to copy. THE QUEUE-COMPUTED
      binding_stop_utc FOR THIS CARD IS 2026-08-10T01:05:13Z, computed from the
      BATCH-005 dispatch stamp 2026-08-10T00:38:33Z plus this card's declared 1600 s;
      it is the DISPATCH-BASIS REFERENCE, recorded so the intended timeline is
      readable from the queue. THE STOP YOU HALT ON IS THE ONE YOU COMPUTE FROM YOUR
      OWN START. A HALT AT binding_stop_utc IS INFRASTRUCTURE SIGNAL, NEVER A
      NEGATIVE MATHEMATICAL RESULT (AGENTS.md rule 5), and dropped work is SCOPE,
      NEVER AN ANSWER (rule 8).

    c4_authoring_inclusive_declaration_basis: >-
      C4 AUTHORING-INCLUSIVE DECLARATION BASIS, protocol-amendment-GOAL-AES-001-005
      PART B, STATED IN IDENTICAL LANGUAGE ACROSS PRODUCING AND ARCHIVAL CARDS. This
      card's declared budget is calibrated against AUTHORING-INCLUSIVE SESSION
      ELAPSED -- first act to terminal receipt -- and NOT against compute. REPORT THE
      COMPUTE COMPONENT SEPARATELY, in its own field `compute_wall_clock_seconds`, in
      the covering manifest and beside the authoring-inclusive figure, so the two are
      never again conflated. COMPUTE SECONDS MAY NOT BE OFFERED AS EVIDENCE OF BUDGET
      COMPLIANCE (prospective only; TASK-20260801-806's compute-based posture was
      COMPLIANT under the old rule and is NOT re-graded). Your budget duty is
      discharged ENTIRELY BY THE C2 STAMP DUTY: a task that stamps honestly and halts
      at its own binding_stop_utc HAS COMPLIED IN FULL even if the dispatcher-observed
      session elapsed later exceeds this declaration, and any residual is a
      CAMPAIGN-SIDE ACCOUNTING FACT, NEVER A PRODUCER DEFECT AND NEVER A RETURNED
      TASK (C3).

    part_c_covering_manifest_and_closed_class_vocabulary: >-
      PART C PROVENANCE GATE, protocol-amendment-GOAL-AES-001-005 PART C, IN FORCE
      FROM BATCH-005, STATED IN IDENTICAL LANGUAGE ACROSS PRODUCING AND ARCHIVAL
      CARDS. (i) THE COVERING-MANIFEST CLAUSE, which REPLACES amendment 004 Part B's
      literal per-manifest reading (D-808-1 UPHELD on the decisive empirical ground
      that the literal reading demonstrably generates digests no party can verify):
      "AT LEAST ONE machine-readable manifest per task, DESIGNATED THE COVERING
      MANIFEST, carries an `artifact_provenance` list covering EVERY DECLARED
      ARTIFACT OF THE TASK; EVERY OTHER MANIFEST OF THE TASK MUST APPEAR AS AN ENTRY
      IN IT." The covering manifest is named explicitly by this card and by the
      manifest itself. Entry fields are UNCHANGED from amendment 004: `path`, `kind`,
      `sha256`, `comment_block_inference_stanza` (boolean, stated honestly including
      when false), `covered_by_this_manifest_inference_block` (boolean). A
      self-referential digest remains impossible and is recorded as SELF.
      (ii) THE CLOSED, CASE-INSENSITIVE CLASS VOCABULARY: the four class names are
      SOURCE_CODE, MACHINE_READABLE_MANIFEST, PROSE_REPORT and
      LEDGER_AND_COORDINATION_RECORD, matched CASE-INSENSITIVELY and ignoring
      underscore/hyphen/space differences. NO FIFTH CLASS MAY BE INVENTED BY A
      PRODUCER OR BY AN ARCHIVAL TASK; a value outside the vocabulary is a DEFECT TO
      REPORT, never a class to create, and the artifact is classified into one of the
      four by what it is. EXPLICIT ALIAS RULE: any `kind` naming a machine-readable
      structured-data artifact -- INCLUDING `machine_readable_prescreen`,
      `prescreen`, `results_json`, `receipt` -- RESOLVES TO
      MACHINE_READABLE_MANIFEST; a prose `.md` deliverable resolves to PROSE_REPORT;
      executable text resolves to SOURCE_CODE; anything under `ledger/**` or
      `coordination/**` authored by the Coordinator resolves to
      LEDGER_AND_COORDINATION_RECORD and carries NO obligation under this gate.
      (iii) INFERENCE BLOCKS: every declared artifact carries a filled `inference`
      block recording policy, requested_policy, the ACTUAL resolved model identifier,
      fallback_used, model_verified (false if `python3 -m orchestration.adapter doctor
      --probe` was not run), and the standing basis
      0137a051eb5828789eb267fa83c8278086578d4c; an unobserved resolved model is
      recorded as `unrecorded`, NEVER GUESSED. Every SOURCE_CODE artifact
      ADDITIONALLY carries a comment-block inference stanza in its own text; every
      PROSE_REPORT carries EITHER an in-text inference block OR a provenance pointer
      naming the covering manifest, BOTH FORMS EQUALLY COMPLIANT AND NEITHER
      PREFERRED. Missing or partial fails this task.

    declaration_sized_against_part_a_reference_actuals: >-
      DECLARATION SIZED AGAINST THE PER-ROLE REFERENCE ACTUALS IN
      protocol-amendment-GOAL-AES-001-005 PART A, STATED IN IDENTICAL LANGUAGE ACROSS
      PRODUCING AND ARCHIVAL CARDS. This card declares 1600 s. Part A's executor
      producer line records MEASURED SESSION ELAPSED of 792 (TASK-801), 892
      (TASK-802), 1609 (TASK-806) and 1510 (TASK-807) and SIZES AT 1600 -- AT OR NEAR
      THE OBSERVED MAXIMUM AND NOT AT THE MEAN. SIZING AT MAXIMA IS THE CONTINGENCY:
      NO SEPARATE CUSHION IS ADDED ON TOP AND NONE MAY BE INFERRED. The campaign has
      NO CALIBRATED BASIS FOR PREDICTING MEASURED COST -- the over-declaration series
      has FLATTENED TO PARITY (2.51x -> 1.55x -> 1.28x -> ~1.01x) with two producer
      tasks OVER their declarations -- so no ratio may be used as an expectation. THE
      DECLARATION IS A BINDING STOP CONDITION, NOT AN ALLOWANCE.

  the_layer_dependence_screen_v2_binds_this_task: >-
    RANK 3 OF THE BATCH, ENACTED IN THE QUEUE AS A RULE CHANGE AND IN FORCE BEFORE
    THIS TASK APPLIES ANY SCREEN. Read
    coordination/goals/GOAL-AES-001/batches/BATCH-005/dispatch_queue.json ->
    batch_notes.layer_dependence_screen_v2 IN FULL and apply it. Its five
    requirements, none omitted: (1) it is THE LAYER-DEPENDENCE SCREEN, not an
    interface screen; (2) TASK-20260801-807's interface-counting rule is adopted
    campaign-wide and SUPERSEDES the graph-phrased guidance -- for a ROUND-INDEPENDENT
    pi every (lambda,k)-graph step happens AT THE SAME SINGLE INTERFACE and n = 1, and
    reading a graph diameter as an interface count is a CATEGORY ERROR;
    (3) DEFERRED_UNBOUNDED is a verdict and is KEPT OUT OF ANY COUNT OF RULINGS;
    (4) n = 1 IS NOT A LICENCE and every PURSUE carries a SEPARATE, EXPLICITLY
    LABELLED TRACTABILITY JUDGEMENT; (5) the ~7 threshold bounds AVAILABLE CONSECUTIVE
    SUPER-BOX INTERFACES and NOT the argument's iteration count, and every candidate is
    screened under BOTH conversions with the tighter (super-box spans two rounds,
    budget 3) reported beside the looser. WRITE screen_ctrl810a.json FIRST, BEFORE ANY
    DERIVATION OR COMPUTE and before the capability probe, mark it as written first,
    and anchor the ordering claim in COMMITTED BYTES rather than in a file mtime. NOTE
    HONESTLY THAT THIS TASK IS A CENSUS AND NOT AN ARGUMENT: if the screen has little
    to bite on here, RECORD THAT PLAINLY rather than manufacturing candidates for it.

  constraints:
    - >-
      THE FOUR BINDING CLAUSES ABOVE APPLY IN FULL: the C2 stamp duty with a computed
      binding_stop_utc and the stamps COMMITTED; the C4 authoring-inclusive
      declaration basis with compute reported separately; the Part C covering-manifest
      clause and the closed case-insensitive class vocabulary; and a declaration sized
      against Part A's per-role reference actuals.
    - >-
      THE LEG SPLIT ABOVE IS BINDING AND IS NOT YOURS TO RENEGOTIATE. Legs A and B are
      IN SCOPE. Leg C runs IF AND ONLY IF the recorded capability probe succeeds. A
      failed probe puts leg C OUT OF SCOPE AS INFRASTRUCTURE SIGNAL and OPEN AND
      UNATTEMPTED, and it is NEVER a negative mathematical result. Do not substitute a
      sampled or extrapolated GF(2^8) composition for leg C, and do not present an
      analogue reading as though it settled the GF(2^8) question.
    - >-
      THE THREE PRE-REGISTERED OUTCOMES AND THE SECONDARY-LEG PREDICTION ARE FIXED
      BEFORE MEASUREMENT AND MAY NOT BE ADJUSTED AFTER IT. Write them into the report
      in a section marked as written first, anchored in committed bytes, with the
      measured values beside them. OUTCOME (ii) FALSIFIES THE RED TEAM'S OWN RT-2 and
      MUST BE REPORTED AS SUCH IF IT OCCURS -- the red team named it deliberately
      against itself, and suppressing it would be the exact failure this control
      exists to prevent. A prediction adjusted after seeing the reading is a protocol
      violation, not a refinement.
    - >-
      THE TWO COMPOSITION MODELS ARE REPORTED SEPARATELY AND ARE NEVER MERGED,
      AVERAGED OR SUBSTITUTED FOR ONE ANOTHER. M-affine and M-nonlinear are the whole
      point of RT-3: one horn means Phi^n is a single affine map whose branching
      SATURATES at the ceiling and is not J^n; the other means pi.SB is not F-linear
      and PROPOSITION 806-1 GOVERNS NO INTERFACE AFTER THE FIRST. Report both columns
      side by side for every n and every witness, and state which horn the measurement
      supports, or that it supports neither cleanly.
    - >-
      EXHAUSTIVE WHERE THE SPACE PERMITS, NOT SAMPLED-AND-EXTRAPOLATED. Where you
      sample, state the sample size, the seed, the sampling distribution and what the
      sample does NOT establish. The GF(2^4) and GF(2^2) computations are ANALOGUES:
      state that their readings are NOT evidence about GF(2^8) and CERTAINLY NOT about
      AES, give the argument for or against transfer rather than assuming it, and note
      that the GF(2^2) analogue is additionally NOT MDS wherever it is used.
    - >-
      IF THIS CENSUS PRODUCES OR REPAIRS ANY COST OR ASYMPTOTIC STATEMENT, ALL FOUR
      PROMOTION GATES APPLY AND MUST BE ADDRESSED HERE RATHER THAN DISCOVERED LATE:
      single-responsibility lemma decomposition with explicit per-attempt-cost x
      inverse-success-probability bookkeeping; every conditional dependence as a
      NUMBERED heuristic HEUR-a0e0ae-n stated formally and paired with archived
      validation evidence or a concrete validation-experiment specification naming
      distribution, scale, predicted distribution, tail check and falsifying outcome;
      a concrete-cost table with hidden-overhead, memory, time-memory-tradeoff and
      parallelization accounting, individually flagged optimistic assumptions and an
      affected-vs-safe scope statement; and gate (4) named as REQUIRED AND NOT
      PERFORMED BY THIS TASK. THIS TASK IS NOT EXPECTED TO PRODUCE A COST STATEMENT --
      it is expected to tell the campaign whether one is even possible -- BUT THE
      GATES APPLY ANYWAY IF IT DOES. Record gate status machine-readably in
      census_results.json and, IF YOU CANNOT CLEAR A GATE, NAME THE GATE.
    - >-
      YOU MAY NOT REPAIR, REINSTATE OR EXTEND SECTION 5's COST TABLE. It is STRUCK AS
      UNUSABLE IN EITHER DIRECTION. Your measurements are INPUTS to a Coordinator
      decision about whether anything can be built there; they are not a repair, and
      you do not perform one. Report what you measured and what it implies for RT-1,
      RT-2, RT-3 and RT-5, and stop.
    - >-
      NULL OBJECT BEFORE BELIEF, AND IT MUST ISOLATE. V-804-1 is this campaign's own
      demonstration that a control can DISCRIMINATE without ISOLATING the property it
      names, and D-809-5 records that CTRL-NULL-1 did not isolate "no zero block"
      either. If you build any control, state which property it ISOLATES and build the
      sibling that negates the same named ingredient differently, or state plainly
      that no control was built.
    - >-
      STANDING RESEARCH CONSTRAINTS, UNCHANGED AND BINDING ON THIS TASK. GATE-601-A
      remains NOT dispatched. The instrument stand-down remains IN FORCE: no
      mutation-control repair, extension, re-run, probe or escape enumeration; report
      a BLOCKER and STOP if you believe instrument work is needed. NO reject_scoped of
      the round-independent single-word deterministic class may be proposed until a
      control ISOLATES the ingredient it negates (V-804-1). PROPOSITION 806-1 MAY BE
      CITED AT ONE INTERFACE ONLY, FOR THE F-LINEAR ROUND-INDEPENDENT SUBCLASS, NEVER
      AS A COST INEQUALITY (D-809-4) and NEVER WITH U-809-1 DROPPED -- and note that
      RT-3 horn (b) would mean it governs NO INTERFACE AFTER THE FIRST, which is
      precisely what this task measures. NOTHING YOU PRODUCE MAY BE TREATED AS A
      CLOSURE ATTESTATION.
    - >-
      SUPERSEDE, NEVER OVERWRITE. Every BATCH-001 through BATCH-004 artifact is
      committed and IMMUTABLE. You may READ and RE-EXECUTE od4_branching.py from the
      committed snapshot -- RT-1's reproduction is the precedent and it is explicitly
      permitted -- but you may NOT modify it, re-run into its directory, or delete it.
      Copy what you need into this task's own directory under a new name and state the
      supersession.
    - >-
      SCOPE AND CLAIM TIER. This is toy-scale computation about the algebra of AES
      components and a scaled-down analogue. It is NOT a cryptanalytic result, NOT a
      distinguisher, NOT a barrier statement about AES security, and it asserts
      NOTHING about full-round or deployed AES. claim_tier: toy / reduced-round only.
      STATE THAT IN THE REPORT.
    - >-
      Every literature statement is UNVERIFIED-FROM-MEMORY and must be marked inline
      AT THE POINT OF USE. Two agreeing recollections are not a citation.
    - >-
      Seed all randomness deterministically and record every seed. Record exact
      commands, exit statuses, resolved tool versions, git commit and dirty-tree
      state, timestamps, and EVERY CHECK THAT DID NOT RUN WITH ITS REASON. Do not
      fabricate a command, output, count, constant or verdict (AGENTS.md rule 9). A
      quantity you did not compute is recorded as NOT COMPUTED.
    - >-
      A timeout, crash, out-of-budget condition or missing dependency is
      INFRASTRUCTURE SIGNAL reported as such, NEVER a negative mathematical result
      (AGENTS.md rule 5).
    - >-
      Create no ledger record, propose no hypothesis status, promote nothing to
      knowledge, assign no evidence strength, propose no closure or reject_scoped,
      change no official state, and write ONLY under this task's own directory.

