      mutation-control work of any kind was performed; all writes are under this
      task's own directory.

  return_format: >-
    The five artifacts, plus a plain statement of: (i) the screen verdict for every
    candidate with its tractability judgement; (ii) which of outcomes (A), (B) or (C)
    was reached; (iii) if (A), the proposition, the index bound in B, and the
    TYPE-STABILITY verdict on whether it repairs the induction; (iv) if (B), the
    certificate and how to re-verify it; (v) the per-gate status of gates (1)-(3) if
    any is engaged; (vi) the authoring-inclusive session elapsed and, separately, the
    compute seconds; and (vii) everything dropped on budget, named.
