  the_object_stated_exactly_so_it_is_not_drifted_from: >-
    Let F = GF(2^8) and let pi : F^4 -> X be a per-word projection, ROUND-INDEPENDENT
    (the same pi before and after the interface). PROP-701-I's Step 3 argues that the
    translations leaving pi invariant FORM A GROUP, hence contain the GF(2)-span. The
    BATCH-004 OD-4 report showed that under BOUNDED BRANCHING this fails, and
    separately from Steps 1 and 2: B-confinement -- the relation R_B(u, u+v) holding
    when pi(u) and pi(u+v) share a set of size at most B -- is REFLEXIVE and
    SYMMETRIC BUT NOT TRANSITIVE. pi(u), pi(u+v) sharing a <=B-set and pi(u+v),
    pi(u+2v) sharing a DIFFERENT <=B-set implies nothing about pi(u) and pi(u+2v).
    With no transitivity there is no equivalence, no group, no span, and no
    "invariant under every translation". THE RESIDUAL, VERBATIM FROM THE COMMITTED
    REPORT SECTION 3.3 ROUTE 2: "a bounded-index subgroup statement replacing the
    group closure: that the relation 'pi(u), pi(u+v) share a <=B-set' contains a
    subgroup of translations of index bounded in B. That is a genuine open question
    and is not answered here." THE QUESTION FOR THIS TASK: does such a subgroup
    exist; if it does, what is the index bound as a function of B; and does a
    bounded-index subgroup, if it exists, actually REPAIR the Step-1/Step-2/Step-3
    induction -- i.e. is it TYPE-STABLE, emitted by Step 1 under branching AND
    consumed by Step 1 again, so the induction closes?

  what_a_complete_outcome_looks_like: >-
    THREE OUTCOMES ARE ALL COMPLETE AND VALUABLE AND NONE IS A FAILURE. (A) A
    BOUNDED-INDEX SUBGROUP EXISTS, stated as a numbered proposition with explicit
    hypotheses, an index bound in B, and a derivation -- plus an explicit statement
    of whether it is TYPE-STABLE and therefore whether it repairs the induction or
    merely exists. (B) NO SUCH SUBGROUP EXISTS, with a COUNTEREXAMPLE CERTIFICATE:
    an exhibited pi, B and translation set in a named field (analogue permitted and
    labelled) for which the relation provably contains no subgroup of index bounded
    in B, reproducible from committed code. (C) THE QUESTION IS ANSWERED IN THE
    DEGENERATE DIRECTION -- e.g. a subgroup always exists but its index is not
    bounded in B, or is bounded only trivially by |X| -- which is a REAL ANSWER and
    is reported as one, with the exact degeneracy named. A CLEAN, ARGUED OUTCOME AT
    THE docs/inventor-protocol.md SECTION 4 CLOSURE STANDARD -- named obstruction,
    argument, forward guidance -- IS THE DELIVERABLE. "We tried and it did not work"
    is a FATIGUE REPORT and is not acceptable. MANUFACTURING A SUBGROUP STATEMENT
    THAT DOES NOT FOLLOW WOULD BE FAR WORSE THAN RETURNING NONE.

