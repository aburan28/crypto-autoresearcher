    honest_limit_recorded_as_a_defect:
      id: D-4403de-4
      severity: MINOR, procedural
      finding: >-
        C2 IMPOSES A STAMP DUTY THAT A SHELL-LESS COORDINATOR SESSION CANNOT FULLY
        DISCHARGE. Part B was written for producer sessions that can read a clock, and
        the coordination under-count fix then extended the duty to coordination acts
