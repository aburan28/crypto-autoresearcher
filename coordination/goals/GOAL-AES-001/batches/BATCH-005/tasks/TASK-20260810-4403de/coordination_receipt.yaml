  # =====================================================================
  # DEFECTS RAISED BY THIS ACT
  # =====================================================================
  defects_raised:
    - id: D-4403de-1
      severity: MAJOR, procedural, not research-bearing
      title: This campaign's cited decision records are unresolvable in this tree.
      finding: >-
        ledger/decisions/DEC-20260731-029.yaml and -030.yaml are GOAL-ECDLP-001 records
        (BATCH-025 and BATCH-026); DEC-20260731-017 and -018 likewise. A directory-wide
        search for `goal_id: GOAL-AES-001` under ledger/decisions/ returns NOTHING, and
        CORR-20260801-001 independently confirms that the file at
        ledger/decisions/DEC-20260731-010.yaml is the GOAL-AES-001 opening decision
        inherited from origin/main. DEC-20260731-011, -025, -026, -027, -028, -029 and
        -030 AS AES RECORDS ARE NOT PRESENT AT THOSE PATHS. protocol-amendment-
        GOAL-AES-001-005 compounds the ambiguity by recording `decision_ref:
        DEC-20260731-018` while the goal checkpoint records DEC-20260731-030.
      what_this_act_did_about_it: >-
        NOTHING THAT TOUCHES A RECORD. No decision was invented, reconstructed,
        renumbered or remapped, and NO CARD'S read_scope POINTS AT A DECISION PATH THAT
        WOULD SEND A PRODUCER TO READ A GOAL-ECDLP-001 RECORD AS THIS CAMPAIGN'S. In
        their place the cards cite the COMMITTED CARRIERS of the same content:
        ledger/goals/GOAL-AES-001.yaml (next_action, the BATCH-004 checkpoint,
        structural_ruling, defect_severities, promotion_gates, budget_accounting), the
        amendments, and ledger/evidence/EV-AES-004.yaml.
      why_the_act_is_still_executable: >-
        BECAUSE THE BINDING SPECIFICATION OF THIS ACT IS THE GOAL RECORD'S OWN
        next_action, WHICH IS COMMITTED AND WHICH RESTATES THE RANKED SHAPE IN FULL,
        including the three grounds for ranking CAND-806-A's residual first, the
        non-deferrability of CTRL-810-A, the five pre-screen requirements, the rank-4
        rule, and the standing constraints.
      referred_to: >-
        TASK-20260810-b26b16 and the dispatching session. Resolution is by a CORR record
        or by naming the unmerged source, NEVER by renaming a record: AGENTS.md core
        rule 15 makes an identifier remap a last resort and never a repair, and these
        identifiers appear in the binding fields of completed archives.
    - id: D-4403de-2
      severity: MINOR, accounting
      title: The amendment-and-decision act is unmeasured and is charged at declaration.
      finding: >-
        Part A's itemized batch_005 sizing carries a 900 s line for the
        amendment-and-decision act. That act was performed BEFORE this queue existed,
        was NOT dispatched as a queue task, and no duration for it was reported to this
        session. It is charged at its DECLARED 900 s under Part B C6 and is NOT
        reconstructed. Recorded against the campaign's INSTRUMENTATION, not against any
        actor.
    - id: D-4403de-3
      severity: WITHDRAWN AS MOOT
      title: This act's own duration is unmeasured unless the dispatching session supplies it.
      finding: >-
        RAISED CONDITIONALLY AND NOW WITHDRAWN, NOT SILENTLY DROPPED. It was to fire only
        if `measured_session_elapsed_seconds` was never filled. THE DISPATCHING SESSION
        SUPPLIED 3166990 ms = 3167 s, so C6's unmeasured branch never engaged, the act is
        charged at MEASURED and not at declaration, and there is NO instrumentation defect
        here. The withdrawal is recorded rather than the entry deleted, because a defect
        raised and answered is part of the record.
    - id: D-4403de-4
      severity: MINOR, procedural
      title: C2's stamp duty is not fully dischargeable by a shell-less coordinator session.
      finding: >-
        See c2_stamps.honest_limit_recorded_as_a_defect above. IT IS NOW ALSO SHOWN TO
        HAVE A CONSEQUENCE AND NOT ONLY A FORM: this act could not evaluate its own
        binding_stop_utc, so it did not halt at it, and it ran to 4.52x its declaration.
        A stop condition an actor cannot evaluate is not a stop condition -- the exact
        fault Part B closed for producers and left open for shell-less coordination acts.
    - id: D-4403de-5
      severity: MAJOR, accounting and sizing
      title: >-
        Part A's coordination-act sizing is falsified by the role's first measurement,
        and the overrun projects the campaign over its ceiling.
      finding: >-
        Declared 700 s, MEASURED 3167 s, an overrun of 2467 s at 4.52x. Part A sized the
        line by analogy with the ledger-archive role on ZERO measured observations and
        named it as one of three lines resting on numbers no clock ever produced.
      ruling: >-
        A SIZING DEFECT, COORDINATOR-SIDE. NOT an instrumentation defect (the clock
        worked and reported) and NOT a conduct defect against any actor. C3's shelter is
        NOT claimed, because this act only partly discharged C2.
      consequence: >-
        The projected campaign total moves to 36725 against a 34500 ceiling, over by
        2225 -- a breach SMALLER THAN THIS ACT'S OWN OVERRUN and attributable to it
        alone. See budget_position_and_ruling: no pause condition has fired, Part A's
        standing_limit duty is DUE, and BATCH-005 IS HELD until a budget act is taken or
        declined.
      one_task_is_not_a_distribution: >-
        3167 is ONE observation. It must not become a norm for the role any more than the
        red team's 668 became one.
    - id: D-4403de-6
      severity: MINOR, procedural
      title: >-
        The dispatcher's exactly-once archive-assignment rule and the pre-dispatch-commit
        requirement for a coordination act are in tension.
      finding: >-
        tools/research_dispatch.py requires EVERY non-archive task to be assigned to
        exactly one archive task. The coordination act's artifacts must nonetheless be
        COMMITTED BEFORE any producer runs, in the isolated pre-dispatch coordination
        commit, because they carry the gates the producer cards cite -- a gate uncommitted
        when the card is issued is the retroactive enforcement this program refuses.
      resolution_taken_and_its_cost: >-
        TASK-20260810-4403de is declared a source task of the snapshot archive
        TASK-20260810-415ed7, and that archive VERIFIES the sixteen coordination paths BY
        CONTENT DIGEST and NAMES the commit that carries them, rather than re-staging
        already-committed bytes. THE COST, STATED: the declaration says the snapshot
        archives the coordination act while the commit that actually carries it is an
        earlier one, so the assignment is DECLARATION-LEVEL and the content binding is
        what makes it true. This leans on the content-first archive-receipt rule rather
        than on commit reachability.
      referred_to: TASK-20260810-b26b16 and the dispatching session. Not repaired here.
    - id: D-4403de-7
      severity: MAJOR, blocking on dispatch
      title: The ledger archive cannot be made dispatcher-valid without minted record IDs.
      finding: >-
        `_validate_ledger_archive` requires a ledger archive to own at least one
        ledger/evidence/ path and one ledger/decisions/ path, to carry a NONEMPTY
        archive.record_ids, and for each filename to contain one of those IDs.
        TASK-20260810-b26b16 declares none, because its evidence and decision IDs DO NOT
        EXIST YET. The BATCH-004 reservations are dead (EV-AES-005 and KN-FIND-019 both
        exist and belong to other work); rule 14 forbids the legacy three-digit form and
        forbids choosing a token; allocate_id.py needs a shell this session does not have;
        and writing a plausible path for an unallocated record would be fabrication.
      remedy: >-
        Two allocate_id.py calls with --check by the dispatching session, then ONE
        mechanical substitution into artifact_paths and archive.record_ids. Nothing else
        changes. NOT URGENT, because D-4403de-5 holds the queue regardless.

