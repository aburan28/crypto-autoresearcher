    fallback_charge_basis: >-
      protocol-amendment-GOAL-AES-001-005 Part B C6, retaining and tightening the
      goal's unmeasured_work_rule: a completed task whose duration was not reported is
      charged at its DECLARED budget until a measurement is recorded, is NEVER charged
