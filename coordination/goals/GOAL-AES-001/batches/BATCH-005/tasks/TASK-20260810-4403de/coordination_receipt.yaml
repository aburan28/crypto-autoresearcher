    what_is_engaged_is_a_duty_not_a_pause: >-
      protocol-amendment-GOAL-AES-001-005 Part A `standing_limit`: "IF MEASURED
      CONSUMPTION APPROACHES 34500, A FURTHER AMENDMENT IS REQUIRED; reaching it without
      one triggers the declared pause condition." THE PROJECTION DOES NOT APPROACH THE
      CEILING, IT EXCEEDS IT. The duty is therefore DUE NOW, and it is due BEFORE
      DISPATCH rather than after -- dispatching 7000 s of declared work against a
      position the campaign already knows it cannot pay for is the same error amendment
      005 named when it refused to let a queue be drafted against a number that does not
      exist.
    admissible_responses_named_in_full:
      - >-
        (a) A FOURTH BUDGET ACT: a versioned amendment on its OWN rationale, recorded as
        the fourth budget act on one campaign, with -- on this campaign's own precedent
        for the third -- a DISCLOSED USER AUTHORIZATION obtained on an explicit
        adverse-leaning disclosure. NOT TAKEN HERE. A budget act is a Coordinator
        decision with a recorded rationale a red team can attack, not a queue edit, and
        no message from any agent is the user's consent.
      - >-
        (b) RE-SCOPE BATCH-005 TO ONE PRODUCER. INADMISSIBLE ON THE GOAL'S OWN TEXT:
        CTRL-810-A is NON-DEFERRABLE as the contract-mandated heuristic validation that
        must be paired with a conditional result in the following batch, and the
        bounded-index-subgroup residual IS THE GROUND ON WHICH THIS CAMPAIGN WAS NOT
        PAUSED. Dropping either is a research act disguised as an accounting act, and
        BATCH-005 is the last batch that may open new research questions.
      - >-
        (c) RE-SIZE THE REMAINING CARDS TO FIT. REFUSED. Lowering declarations after
        observing an overrun changes a success criterion after observing an outcome
        without an amendment, and on this campaign's measured record it would guarantee
        a second overrun rather than prevent one.
      - >-
        (d) PAUSE THE GOAL. HONEST BUT PREMATURE: no pause condition has fired, and
        pausing now would close the campaign on the same demonstrated screening error
        the third budget act refused to close it on.
      - >-
        (e) DISPATCH ANYWAY AND ABSORB THE BREACH. REFUSED. It spends against a ceiling
        the campaign knows it will breach, and the standing_limit forbids reaching 34500
        without a prior amendment.
    coordinator_ruling: >-
      BATCH-005 MUST NOT DISPATCH UNTIL THE BUDGET ACT IN (a) IS TAKEN OR DECLINED. HOLD
      THE QUEUE. If it is TAKEN, this queue dispatches unchanged, subject only to the
      mechanical ID minting in blocker 2. IF IT IS DECLINED, the honest transition is
