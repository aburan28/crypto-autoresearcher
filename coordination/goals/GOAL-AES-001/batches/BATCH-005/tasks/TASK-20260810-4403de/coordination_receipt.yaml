      BATCH-005's carded work is then recorded OPEN AND UNATTEMPTED and NEVER as tried,
      screened or negative.
    stated_against_this_coordinator: >-
      THE HOLD IS CAUSED BY THIS ACT AND BY NOTHING ELSE. No producer, reviewer or
      archival task has spent a second of BATCH-005. Had this act come in at its
      declaration the projection would be Part A's own 34258 and the queue would
