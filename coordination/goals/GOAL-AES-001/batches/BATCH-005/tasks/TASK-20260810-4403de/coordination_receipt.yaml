      NULL BY NECESSITY AND BY RULE, NOT BY OMISSION. THE DISPATCHING SESSION FILLS
      THIS FIELD FROM ITS OWN MEASUREMENT. This Coordinator session has NO SHELL AND
      NO CLOCK IT CAN READ: it cannot observe its own start, cannot observe its own
      elapsed time, and therefore CANNOT STATE ITS OWN DURATION. Under C1 the charged
      clock is SESSION ELAPSED AS OBSERVED BY THE DISPATCHING SESSION, and under C5
      the charged figure is the LARGEST session-elapsed figure on the record from any
      source, with every other figure preserved marked `on_record_not_charged` and its
      source named, and NO SPREAD RESOLVED SILENTLY. WRITING A NUMBER HERE THAT NO
      CLOCK PRODUCED WOULD BE FABRICATION UNDER AGENTS.md RULE 9, AND IT IS THE EXACT
      ERROR THE COORDINATION UNDER-COUNT FIX EXISTS TO STOP MAKING IN THE OPPOSITE
      DIRECTION. THIS ACT IS ALSO NOT CHARGED AT ZERO: if no measurement is supplied,
      Part B C6 charges it at its DECLARED 700 s AND records defect D-4403de-3 against
      the campaign's INSTRUMENTATION, not against this act.
