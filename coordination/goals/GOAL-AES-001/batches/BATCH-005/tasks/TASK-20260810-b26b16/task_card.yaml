  binding_clauses_stated_in_identical_language_across_producing_and_archival_cards:

    c2_stamp_duty: >-
      C2 STAMP DUTY, protocol-amendment-GOAL-AES-001-005 PART B, STATED IN IDENTICAL
      LANGUAGE ACROSS PRODUCING AND ARCHIVAL CARDS. (i) AS YOUR FIRST ACT, BEFORE ANY
      RESEARCH WORK, write budget_stamps.json in your own task directory carrying
      `start_utc`, `start_epoch`, `declared_wall_clock_seconds` and
      `binding_stop_utc` COMPUTED AS YOUR OWN START PLUS YOUR DECLARED BUDGET.
      (ii) Write a further stamp at EACH MAJOR SECTION BOUNDARY, each carrying `utc`,
      `elapsed_s` and a `marker` naming what was completed. (iii) HALT at
      `binding_stop_utc`, record `halted_on_budget` truthfully, and NAME the work
      dropped as a consequence. (iv) COMMIT those stamps as a declared artifact of
      this task, so a reviewer reads the timeline from committed bytes rather than
      from a relayed observation. The TASK-20260801-810 `budget` block is the
      REFERENCE IMPLEMENTATION and is named as the model to copy. THE QUEUE-COMPUTED
      binding_stop_utc FOR THIS CARD IS 2026-08-10T00:53:33Z, computed from the
      BATCH-005 dispatch stamp 2026-08-10T00:38:33Z plus this card's declared 900 s;
      it is the DISPATCH-BASIS REFERENCE, recorded so the intended timeline is
      readable from the queue. THE STOP YOU HALT ON IS THE ONE YOU COMPUTE FROM YOUR
      OWN START -- and for this card the two DIFFER BY CONSTRUCTION, because this task
      begins only after both reviews complete; the queue figure is a reference and is
      NOT your governing stop. A HALT AT binding_stop_utc IS INFRASTRUCTURE SIGNAL,
      NEVER A NEGATIVE MATHEMATICAL RESULT (AGENTS.md rule 5), and dropped work is
      SCOPE, NEVER AN ANSWER (rule 8).

    c4_authoring_inclusive_declaration_basis: >-
      C4 AUTHORING-INCLUSIVE DECLARATION BASIS, protocol-amendment-GOAL-AES-001-005
      PART B, STATED IN IDENTICAL LANGUAGE ACROSS PRODUCING AND ARCHIVAL CARDS. This
      card's declared budget is calibrated against AUTHORING-INCLUSIVE SESSION
      ELAPSED -- first act to terminal receipt -- and NOT against compute. REPORT THE
      COMPUTE COMPONENT SEPARATELY, in its own field `compute_wall_clock_seconds`, in
      the covering manifest and beside the authoring-inclusive figure, so the two are
      never again conflated. COMPUTE SECONDS MAY NOT BE OFFERED AS EVIDENCE OF BUDGET
      COMPLIANCE (prospective only; TASK-20260801-806's compute-based posture was
      COMPLIANT under the old rule and is NOT re-graded). Your budget duty is
      discharged ENTIRELY BY THE C2 STAMP DUTY: a task that stamps honestly and halts
      at its own binding_stop_utc HAS COMPLIED IN FULL even if the dispatcher-observed
      session elapsed later exceeds this declaration, and any residual is a
      CAMPAIGN-SIDE ACCOUNTING FACT, NEVER A PRODUCER DEFECT AND NEVER A RETURNED
      TASK (C3). NOTE THE STRUCTURAL LIMIT THAT APPLIES TO THIS CARD SPECIFICALLY: A
      RECORD AUTHORED INSIDE A TASK CANNOT STATE THAT TASK'S OWN DURATION, which is
      why both prior ledger archives were charged at declaration and never measured.
      Write your stamps anyway -- they are the auditable floor -- and leave the
      charged figure to the dispatching session under C1 and C5.

    part_c_covering_manifest_and_closed_class_vocabulary: >-
      PART C PROVENANCE GATE, protocol-amendment-GOAL-AES-001-005 PART C, IN FORCE
      FROM BATCH-005, STATED IN IDENTICAL LANGUAGE ACROSS PRODUCING AND ARCHIVAL
      CARDS. (i) THE COVERING-MANIFEST CLAUSE, which REPLACES amendment 004 Part B's
      literal per-manifest reading (D-808-1 UPHELD on the decisive empirical ground
      that the literal reading demonstrably generates digests no party can verify):
      "AT LEAST ONE machine-readable manifest per task, DESIGNATED THE COVERING
      MANIFEST, carries an `artifact_provenance` list covering EVERY DECLARED
      ARTIFACT OF THE TASK; EVERY OTHER MANIFEST OF THE TASK MUST APPEAR AS AN ENTRY
      IN IT." The covering manifest is named explicitly by the task's card and by the
      manifest itself. Entry fields are UNCHANGED from amendment 004: `path`, `kind`,
      `sha256`, `comment_block_inference_stanza` (boolean, stated honestly including
      when false), `covered_by_this_manifest_inference_block` (boolean). A
      self-referential digest remains impossible and is recorded as SELF.
      (ii) THE CLOSED, CASE-INSENSITIVE CLASS VOCABULARY: the four class names are
      SOURCE_CODE, MACHINE_READABLE_MANIFEST, PROSE_REPORT and
      LEDGER_AND_COORDINATION_RECORD, matched CASE-INSENSITIVELY and ignoring
      underscore/hyphen/space differences. NO FIFTH CLASS MAY BE INVENTED BY A
      PRODUCER OR BY AN ARCHIVAL TASK; a value outside the vocabulary is a DEFECT TO
      REPORT, never a class to create, and the artifact is classified into one of the
      four by what it is. EXPLICIT ALIAS RULE: any `kind` naming a machine-readable
      structured-data artifact -- INCLUDING `machine_readable_prescreen`,
      `prescreen`, `results_json`, `receipt` -- RESOLVES TO
      MACHINE_READABLE_MANIFEST; a prose `.md` deliverable resolves to PROSE_REPORT;
      executable text resolves to SOURCE_CODE; anything under `ledger/**` or
      `coordination/**` authored by the Coordinator resolves to
      LEDGER_AND_COORDINATION_RECORD and carries NO obligation under this gate.
      (iii) INFERENCE BLOCKS: every declared artifact carries a filled `inference`
      block recording policy, requested_policy, the ACTUAL resolved model identifier,
      fallback_used, model_verified (false if `python3 -m orchestration.adapter doctor
      --probe` was not run), and the standing basis
      0137a051eb5828789eb267fa83c8278086578d4c; an unobserved resolved model is
      recorded as `unrecorded`, NEVER GUESSED. Every SOURCE_CODE artifact
      ADDITIONALLY carries a comment-block inference stanza in its own text; every
      PROSE_REPORT carries EITHER an in-text inference block OR a provenance pointer
      naming the covering manifest, BOTH FORMS EQUALLY COMPLIANT AND NEITHER
      PREFERRED. Missing or partial fails this task.

    declaration_sized_against_part_a_reference_actuals: >-
      DECLARATION SIZED AGAINST THE PER-ROLE REFERENCE ACTUALS IN
      protocol-amendment-GOAL-AES-001-005 PART A, STATED IN IDENTICAL LANGUAGE ACROSS
      PRODUCING AND ARCHIVAL CARDS. This card declares 900 s. Part A's ledger-archive
      line records 800 s (TASK-805) and 800 s (TASK-811), BOTH CHARGED AT DECLARATION
      AND NEITHER MEASURED, and SIZES AT 900 -- ABOVE THE DECLARATION, since the
      figure has NEVER BEEN TESTED AGAINST MEASUREMENT. SIZING AT MAXIMA IS THE
      CONTINGENCY: NO SEPARATE CUSHION IS ADDED AND NONE MAY BE INFERRED. Part A's own
      red-team-this note applies: three of the eight BATCH-005 sizing lines rest on
      numbers no clock ever produced, and this is one of them. THE DECLARATION IS A
      BINDING STOP CONDITION, NOT AN ALLOWANCE.

  constraints:
    - >-
      THE FOUR BINDING CLAUSES ABOVE APPLY IN FULL AND IN THE SAME WORDS THE PRODUCING
      CARDS CARRY.
    - >-
      RUN ALONE. Stage only the declared paths. No other task may hold the Git index or
      HEAD concurrently. ONLY THE COORDINATOR MAY WRITE OFFICIAL RECORDS.
    - >-
      MINT THE RECORD IDS BEFORE WRITING, AND DO NOT REUSE THE DEAD RESERVATIONS. The
      BATCH-004 reservations ARE GONE: ledger/evidence/EV-AES-005.yaml EXISTS and
      belongs to RQ-AES-003, and knowledge/findings/KN-FIND-019.md EXISTS. AGENTS.md
      core rule 14 additionally forbids any NEW record from using the legacy
      three-digit form. Mint the evidence id, the decision id and any knowledge id with
      `python3 tools/allocate_id.py --next evidence --area AES`,
      `--next decision --date 20260810` and `--next knowledge_finding` respectively,
      CONFIRM EACH WITH `--check` BEFORE USE, and write them into archive.record_ids,
      into the commit message, and into the artifact filenames. DO NOT ALLOCATE BY
      GREPPING FOR THE NEXT FREE NUMBER: that question is the bug.
    - >-
      THE ID-RESOLUTION DEFECT D-4403de-1 IS REFERRED TO THIS TASK AND MUST BE
      ADDRESSED IN THE DECISION RATHER THAN PASSED OVER. THE FINDING: this campaign's
      decision records DEC-20260731-011, -025, -026, -027, -028, -029 and -030 ARE NOT
      PRESENT AT THOSE PATHS IN THIS TREE -- ledger/decisions/DEC-20260731-029.yaml and
      -030.yaml are GOAL-ECDLP-001 records, a directory-wide search for
      `goal_id: GOAL-AES-001` under ledger/decisions/ returns NOTHING, and
      CORR-20260801-001 independently confirms that DEC-20260731-010 in this tree is
      the GOAL-AES-001 opening decision inherited from origin/main. protocol-amendment-
      GOAL-AES-001-005 compounds the ambiguity by recording `decision_ref:
      DEC-20260731-018` while the goal checkpoint records DEC-20260731-030. RESOLVE IT
      BY A CORR RECORD OR BY NAMING THE UNMERGED SOURCE, NEVER BY RENAMING A RECORD:
      AGENTS.md core rule 15 states that an identifier remap is a last resort and never
      a repair, and these identifiers appear in the binding fields of completed
      archives. DO NOT INVENT, RECONSTRUCT OR ESTIMATE ANY MISSING DECISION.
    - >-
      THE ISOLATED PREDECESSOR COMMIT IS PLANNED, NOT DISCOVERED, FOR THE SECOND
      CONSECUTIVE BATCH. The TASK-20260810-9ea72c validation artifacts and the
      TASK-20260810-37042c red-team artifacts are NOT in this ledger commit's declared
      path set. Commit them in an ISOLATED PREDECESSOR COMMIT immediately before the
      ledger commit -- together with any warranted knowledge entry -- and record that
      predecessor SHA as this commit's parent in the receipt, because THE LEDGER COMMIT
      MUST CHANGE EXACTLY ITS DECLARED ARTIFACT PATHS. This was D-805-2 in BATCH-003
      and D-811-1 in BATCH-004.
    - >-
      DO NOT STAGE knowledge/INDEX.md. IT IS GENERATED AND .gitignore'd, and this is a
      FORWARD CORRECTION TO THE BATCH-004 PATTERN, stated so it is not repeated by
      copying. Run `python3 tools/build_knowledge_index.py --check` as a LOCAL
      VERIFICATION STEP ONLY and stage a knowledge entry, if one is warranted, WITHOUT
      the index. The same applies to any coordination/**/dispatch_plan.{json,md}.
      Staging a gitignored generated file is a scope-expanding commit and an
      evidence-integrity failure.
    - >-
      SCOPE THE CONCLUSION TO WHAT WAS TESTED: the exact object class (the
      bounded-index-subgroup relation as defined in the rank-1 card), the interfaces
      actually counted, the field actually worked in, the composition models actually
      composed, the analogue actually used, the witnesses and sample sizes actually
      enumerated, the legs that actually ran, and the budget actually spent.
      claim_tier: toy. A DERIVATION IS A DERIVATION FACT AND AN EXHAUSTIVE TOY
      ENUMERATION IS A COMPUTATION FACT; NEITHER IS EMPIRICAL CRYPTANALYTIC EVIDENCE
      ABOUT AES AND NEITHER SUPPORTS ANY CLAIM ABOUT AES AT ANY ROUND COUNT.
    - >-
      RECORD EVERY UNATTEMPTED ITEM AS OPEN AND UNATTEMPTED, IN THOSE WORDS, AND NEVER
      AS TRIED, SCREENED OR NEGATIVE. This is BINDING because BATCH-005 IS THE LAST
      BATCH THAT MAY OPEN NEW RESEARCH QUESTIONS. At minimum the list includes:
      D-705-5 HOLE (i) (rank 4, not admitted, no producer slot remained on the
      amendment's own sizing); DEV-807-4's three dropped items; OD-2; OD-5's three
      classes; OBJ-701-7; OBJ-701-8; NR-1, NR-2 and NR-4; GATE-601-A, which remains NOT
      DISPATCHED; any DEFERRED_UNBOUNDED candidate from either screen; and
      TASK-20260810-a0e0ae leg C if its capability probe failed. AN UNAVAILABLE
      DEPENDENCY IS INFRASTRUCTURE SIGNAL, NEVER A NEGATIVE MATHEMATICAL RESULT
      (AGENTS.md rule 5).
    - >-
      THE PROMOTION GATES ARE THE CENTRAL CONSTRAINT OF THIS ARCHIVE IF ANY COST OR
      ASYMPTOTIC STATEMENT EXISTS. An asymptotic-complexity claim may not transition
      toward `supported` unless ALL FOUR gates are satisfied by COMMITTED artifacts:
      (1) archived proof decomposition into single-responsibility lemmas with the main
      theorem assembling them under explicit per-attempt-cost x
      inverse-success-probability bookkeeping; (2) every conditional dependence an
      explicit numbered heuristic with archived validation evidence or a SCHEDULED
      validation experiment -- and with BATCH-006 reserved, a merely scheduled
      experiment must be recorded as OPEN AND UNATTEMPTED rather than described as
      scheduled; (3) a concrete-cost table at standardized parameter sets with honest
      hidden-overhead, memory, time-memory-tradeoff and parallelization accounting,
      optimistic assumptions flagged, and an affected-vs-safe scope statement;
      (4) independent review per AGENTS.md rule 12 PLUS a red-team pass -- whose
      INDEPENDENT-CONFIRMATION HALF IS RECORDED AS STRUCTURALLY UNSATISFIABLE UNDER
      THIS HARNESS (RT-13) and is NOT re-scoped here, since re-scoping a review
      requirement after observing an outcome would require its own versioned
      amendment. A CLAIM MISSING ANY GATE MAY REACH `analyzed`, NEVER `supported`. IF A
      GATE IS MISSING, NAME IT IN THE DECISION AND IN THE EVIDENCE RECORD RATHER THAN
      PROMOTING. Record the per-gate status explicitly EVEN IF THE GATES ARE NOT
      ENGAGED.
    - >-
      THE ADVERSE-TRANSITION GATE. No `weaken` or `reject_scoped` may be taken without
      the strongest checkable refutation artifact the result admits -- counterexample
      certificate, then derivation note, then declared `empirical_only` -- ARCHIVED
      BEFORE the decision that relies on it, which for this batch means committed in
      the TASK-20260810-415ed7 snapshot or in the isolated predecessor commit.
      `reject_scoped` ON A SINGLE UNREPLICATED EMPIRICAL-ONLY RUN IS FORBIDDEN; use
      `weaken` plus replication. IN PARTICULAR NO reject_scoped OF THE
      ROUND-INDEPENDENT SINGLE-WORD DETERMINISTIC CLASS MAY BE TAKEN: V-804-1 stands
      UNDISCHARGED FOR THE FOURTH CONSECUTIVE BATCH and no control yet ISOLATES the
      ingredient such a closure would negate.
    - >-
      KNOWLEDGE PROMOTION IS CONDITIONAL AND MUST NOT BE MANUFACTURED. Fill
      `knowledge_promotion` in the decision with EITHER the promoted KN-* ID OR a
      CONCRETE not_warranted reason. Promote a KN-FIND only on `support` or
      `reject_scoped` at replicated/strong evidence, PROVEN BOUNDARIES COUNTING. The
      BATCH-004 decision recorded what WOULD warrant it: BATCH-005 numbering the
      state-quantifier dependence with a paired experiment, RUNNING CTRL-810-A so the
      composition class is stated, and the boundary surviving both. JUDGE THAT AGAINST
      WHAT ACTUALLY RAN -- if leg C did not run, say so and say what that leaves open.
      Follow the /curate-knowledge conventions, mint a fresh KN-FIND id, and write the
      entry in the ISOLATED PREDECESSOR COMMIT, WITHOUT knowledge/INDEX.md.
    - >-
      TWO REVIEW SESSIONS ARE NOT MODEL INDEPENDENCE. TASK-20260810-9ea72c and
      TASK-20260810-37042c resolve to the same model as each other, as both producers,
      and as this Coordinator under inference-amendment 0137a051. Their agreement is
      CORRELATED and must be recorded as such: A VALIDATOR CONCUR PLUS A RED-TEAM
      CONCUR IS ONE DRAW FROM A CORRELATED PAIR, NOT TWO. RECORD NO ATTESTATION.
      `completed` is UNREACHABLE for this goal regardless of outcome.
    - >-
      BUDGET ACCOUNTING MUST BE RECORDED HONESTLY. Record in the decision the DECLARED
      and MEASURED consumption of this batch and the cumulative campaign totals on the
      measured basis; the 900 s amendment-and-decision act CHARGED AT DECLARATION under
      C6 with defect D-4403de-2 recorded against the campaign's INSTRUMENTATION and not
      against any producer; the C5 rule applied to any spread (LARGEST session-elapsed
      figure charged, every other figure preserved marked `on_record_not_charged` with
      its source named, NO SPREAD RESOLVED SILENTLY); the fact that TASK-20260810-4403de
      is THE CAMPAIGN'S FIRST CHARGED COORDINATION ACT and that the historical
      under-count remains UNQUANTIFIED AND UNRECOVERABLE; and HOW MANY BATCHES REMAIN
      OF THE MAXIMUM 6. An unrecorded overrun is not a research result.
    - >-
      THE DECISION RECORDS EXACTLY ONE NEXT ACTION, and that next action must respect
      that BATCH-006 IS THE LAST BATCH AND IS RESERVED FOR CONSOLIDATION, REVIEW AND
      THE TERMINAL RECORD. Do not schedule new research questions into it.
    - >-
      No literature comparison, recalled baseline, sota_delta, bit-margin or
      extrapolation may enter the evidence record or the decision in any form; any
      literature statement that does appear carries the UNVERIFIED-FROM-MEMORY
      qualifier.
    - >-
      UPDATE THE GOAL-AES-001 CHECKPOINT AFTER THIS LEDGER ARCHIVE, in its own
      FOLLOW-ON COMMIT, preserving EXACTLY ONE next action, advancing current_batch_id
      and dispatch_queue_path to BATCH-005 (the queue EXISTS, so naming it is a fact),
      and binding latest_verified_commit forward to THIS ledger commit once the
      post-commit verifier accepts it. A RECORD CANNOT CARRY THE SHA OF THE COMMIT THAT
      CONTAINS IT, which is why that binding is always a separate commit. In the same
      follow-on commit, bind the still-null `commit` fields of amendments 002, 003 and
      005 IF AND ONLY IF the true SHAs are known to that session -- DO NOT INVENT THEM.
    - >-
      DO NOT WRITE THE COMMIT'S OWN SHA INTO AN ARTIFACT INSIDE THAT COMMIT.
    - >-
      BEFORE COMMITTING, fetch origin/main and compare it with this working branch;
      bring new main changes in by MERGING, never rebasing, and never resolve a
      conflict inside an immutable record by picking a side -- create a superseding
      record. Record the base commit checked and the merge outcome in the receipt.
      AFTER COMMITTING, push the branch and open or refresh a PR against main naming
      every new record ID.

  deliverables:
    - budget_stamps.json
    - ledger-receipt.json
    - the minted evidence record under ledger/evidence/
    - the minted decision record under ledger/decisions/
    - a knowledge finding under knowledge/findings/ IF AND ONLY IF warranted

  budget:
    wall_clock_seconds: 900
    memory_gb: 1
    maximum_runs: 1
    queue_computed_binding_stop_utc: '2026-08-10T00:53:33Z'

  completion_gate:
    - >-
      budget_stamps.json exists, was written as the first act with a binding_stop_utc
      computed from this task's own start plus 900 s, carries boundary stamps, records
      halted_on_budget truthfully, and is COMMITTED as a declared artifact;
      ledger-receipt.json is the covering manifest, carries an artifact_provenance list
      with budget_stamps.json as an ENTRY and its own entry as SELF, and reports session
      elapsed and compute seconds SEPARATELY -- noting honestly that a record authored
      inside a task cannot state that task's own duration.
    - >-
      The evidence and decision IDs were MINTED with allocate_id.py and CONFIRMED FREE
      with --check; EV-AES-005, KN-FIND-019 and every legacy three-digit form were NOT
      used; and archive.record_ids, the commit message and the artifact filenames all
      carry the minted IDs.
    - >-
      The evidence and decision records preserve the exact reviewed scope -- object
      class, interfaces, field, composition models, witnesses, sample sizes, legs that
      ran, analogue and claim tier -- and no record asserts anything about full-round or
      deployed AES.
    - >-
      Every unattempted item is recorded as OPEN AND UNATTEMPTED in those words and
      NOWHERE as tried, screened or negative; any unavailable dependency is recorded as
      INFRASTRUCTURE SIGNAL.
    - >-
      If any cost or asymptotic statement was advanced, the per-gate status of all four
      promotion gates is recorded against COMMITTED artifacts, any missing gate is
      NAMED, and no claim missing a gate is moved beyond `analyzed`; if none was
      advanced, the gates are recorded explicitly as NOT ENGAGED with the reason.
    - >-
      Any adverse transition is licensed by a refutation artifact already committed in
      the snapshot or the isolated predecessor commit, with its basis DECLARED
      (counterexample certificate / derivation note / empirical_only); otherwise the
      closure remains withheld and the record says so plainly. NO reject_scoped of the
      round-independent single-word deterministic class is taken.
    - >-
      The isolated predecessor commit carrying the seven review artifacts -- and a
      knowledge entry if and only if warranted -- is made immediately before the ledger
      commit, its SHA is recorded as this commit's parent, and knowledge/INDEX.md is
      NOT staged anywhere.
    - >-
      `knowledge_promotion` is filled with either a minted KN-* ID or a concrete
      not_warranted reason that judges the BATCH-004 stated condition against what
      actually ran.
    - >-
      D-4403de-1 is addressed in the decision: either resolved by a CORR record or by
      naming the unmerged source, with NO decision record invented, reconstructed or
      renamed.
    - >-
      The decision records the declared and measured budget consumption, the 900 s
      amendment act charged at declaration with D-4403de-2 recorded against the
      campaign's instrumentation, the C5 treatment of any spread, the fact that
      TASK-20260810-4403de is the campaign's first charged coordination act, and the
      batches remaining of the maximum 6.
    - >-
      The decision records EXACTLY ONE next action, respecting that BATCH-006 is
      reserved for consolidation, review and the terminal record.
    - >-
      The decision records the correlated-agreement statement about the two review
      sessions and NO ATTESTATION.
    - >-
      Git verifies the commit is reachable from HEAD, has the expected parent, changes
      EXACTLY the declared paths, matches the recorded SHA-256 hashes, and names the
      task and record IDs; the base commit of origin/main checked and the merge outcome
      are recorded; the branch is pushed and a PR opened or refreshed naming the new
      records.
    - >-
      The GOAL-AES-001 checkpoint is updated in its own FOLLOW-ON commit, preserving
      exactly one next action, advancing current_batch_id and dispatch_queue_path to
      BATCH-005, and binding latest_verified_commit forward once the verifier accepts.

  return_format: >-
    The receipt, plus a plain statement of: the minted record IDs and the allocate_id
    --check results; the ledger commit SHA and its parent (the isolated predecessor);
    the base commit of origin/main checked and the merge outcome; the decision taken
    and its single next action; the knowledge_promotion disposition; the full OPEN AND
