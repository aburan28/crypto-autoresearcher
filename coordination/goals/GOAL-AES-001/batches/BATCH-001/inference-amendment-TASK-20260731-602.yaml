inference_amendment:
  id: inference-amendment-TASK-20260731-602
  goal_id: GOAL-AES-001
  batch_id: BATCH-001
  covers_tasks:
    - TASK-20260731-602
    - TASK-20260731-601
  approved_by: coordinator
  approved_at: '2026-07-31'
  archived_by: TASK-20260731-603
  precedent: coordination/goals/GOAL-SSI-001/batches/BATCH-001/inference-amendment-TASK-20260725-501.yaml

  trigger: >-
    TASK-20260731-602 (executor) reported `fallback_used: true` in its
    run_record.md inference block while its handoff
    (ledger/handoffs/TASK-20260731-602.yaml) sets `fallback_allowed: false`.
    Under AGENTS.md "Model policy" a substitution requires `fallback_allowed`
    in the handoff, so the artifact's admissibility cannot be assumed and is
    decided here rather than in the producer's own record. The producer
    explicitly declined to waive the constraint itself, which is the correct
    behaviour under core rule 11.

  per_task:
    - task_id: TASK-20260731-602
      role: executor
      handoff: ledger/handoffs/TASK-20260731-602.yaml
      requested_policy: executor-implementation
      handoff_fallback_allowed: false
      handoff_degraded_allowed: false
      reasoning_effort_requested: null
      resolved_model_id: claude-opus-5
      resolved_model_source: >-
        Recorded by the producer in
        coordination/goals/GOAL-AES-001/batches/BATCH-001/tasks/TASK-20260731-602/run_record.md,
        section "inference", as the `executor` subagent under the Claude Code
        harness.
      fallback_used: true
      fallback_disclosed_by_producer: true
      model_verified: false
      model_verified_note: >-
        `python3 -m orchestration.adapter doctor --probe` was not run in this
        session, so the identifier is unverified configuration in the sense of
        AGENTS.md. Recorded as such; not asserted as probe-confirmed.
    - task_id: TASK-20260731-601
      role: idea-generator
      handoff: ledger/handoffs/TASK-20260731-601.yaml
      requested_policy: research-deep
      handoff_fallback_allowed: false
      handoff_degraded_allowed: false
      reasoning_effort_requested: null
      resolved_model_id: unrecorded
      resolved_model_source: >-
        NOT ATTESTED BY THE PRODUCER. candidate_report.yaml and baseline_map.md
        carry a `provenance` block covering sources and network attempts but no
        `inference` block: no requested policy, resolved model, `fallback_used`
        flag, or `model_verified` status is recorded anywhere in the
        TASK-20260731-601 artifacts, despite the handoff's `harness_note`
        requiring it.
      fallback_used: presumed_true_unattested
      fallback_disclosed_by_producer: false
      model_verified: false
      recording_defect: >-
        Structurally the same substitution must have occurred, because under
        this harness every subagent runs `model: inherit` and the
        `research-deep` alias cannot resolve at all. But the artifact does not
        attest which model served it, and the Coordinator will not fill that in
        by inference: an unattested resolved model is recorded here as
        unattested. This is a recording defect in the TASK-20260731-601
        package, not a substantive inference violation, and it is referred to
        TASK-20260731-604 as a declared defect rather than repaired here.

  rationale: >-
    The substitution is STRUCTURAL, not a silent downgrade, and the two are
    materially different failures. A silent downgrade is an agent choosing a
    weaker backend and not saying so. Here the requested policy identifiers
    cannot be resolved AT ALL in this runtime: CLAUDE.md "Model policy note"
    records that Claude Code subagent frontmatter accepts only Claude models,
    so `.claude/agents/*` all specify `model: inherit` and neither
    `executor-implementation` nor `research-deep` has a resolvable binding
    here. No alternative assignment was available to either producer, and
    neither producer had authority to waive its handoff constraint. The
    handoffs anticipated exactly this: both carry a `harness_note` instructing
    the producer to record `requested_policy` plus the ACTUAL resolved model
    with `fallback_used: true` if they differ, and never to substitute
    silently. TASK-20260731-602 followed that instruction precisely and
    escalated the admissibility question to the Coordinator, which is the
    behaviour AGENTS.md requires. The correct disposition is therefore an
    approved amendment on the record, matching the GOAL-SSI-001 BATCH-001
    precedent, rather than either a silent acceptance or a discard of sound
    work over a runtime limitation the producers did not create.

  degraded_requirements_assessment:
    degraded_allowed: false
    degraded_requirements: []
    note: >-
      No `degraded_allowed` waiver is granted and none is claimed. Because the
      requested policies could not be resolved, their concrete capability
      requirements could not be compared against what was served, so no
      per-requirement gap has been either demonstrated or ruled out. That
      unverifiability is recorded as an open limitation, not as compliance. If
      TASK-20260731-604 identifies a specific capability shortfall in either
      artifact, that becomes a `degraded_requirements` question requiring a new
      amendment; it is not covered by this one.

  decision:
    admissibility: approved
    scope: >-
      The TASK-20260731-601 and TASK-20260731-602 artifacts are ADMISSIBLE for
      archival in TASK-20260731-603 and for independent review in
      TASK-20260731-604, on the structural-substitution basis above.
    what_this_approval_is_not:
      - >-
        It is not an endorsement, ranking, or validity finding for any
        candidate, for the ideation package, or for the AES harness. Those
        remain entirely open to TASK-20260731-604 and then TASK-20260731-605.
      - >-
        It does not raise any claim tier. The batch claim-tier ceiling remains
        toy / reduced-round.
      - >-
        It does not waive the recording defect in TASK-20260731-601; that
        defect is carried forward as a declared defect.
      - >-
        It does not extend to any future task. Each later task's inference
        disposition is decided on its own record.

  constraints:
    - >-
      Record the exact resolved model identifier in every future producer
      artifact in this campaign, including ideation artifacts. An artifact with
      no `inference` block is a recording defect and must be reported as one.
    - >-
      `model_verified` stays `false` for both tasks until a probe is actually
      run. No downstream record may describe either model identifier as
      probe-verified.
    - >-
      Independence requirements for the review chain are NOT downgraded.
      TASK-20260731-604 must still run as an independent session under
      `review-adversarial`, and this amendment supplies no basis for relaxing
      it.
    - >-
      This amendment provides no cover for `review-breakthrough`. Under
      AGENTS.md that policy may never be degraded or run on a backend that
      cannot reach `max` effort. If any BATCH-001 outcome is later proposed as
      a breakthrough, closure, or contradiction of established evidence, the
      required `max`-effort independent review must be obtained on a backend
      that can serve it, or the claim does not advance.
    - >-
      No goal-closure attestation may cite a model resolved under this
      amendment as one of the three pairwise-distinct models required by the
      AGENTS.md closure quorum. A structural fallback to a single inherited
      model is precisely the correlated-judgement failure that rule exists to
      prevent.
    - >-
      Prefer the repository knowledge spine over uncited recollection. Every
      literature baseline in this batch remains unverified-from-memory under
      the campaign network policy.

  residual_risk: >-
    The substituted model is the same one that authored the handoffs and this
    amendment. Cross-model independence is therefore unavailable anywhere in
    BATCH-001, and the batch's later evidence record must scope its confidence
    accordingly rather than treating the validator's agreement as independent
    confirmation in the model-diversity sense.
