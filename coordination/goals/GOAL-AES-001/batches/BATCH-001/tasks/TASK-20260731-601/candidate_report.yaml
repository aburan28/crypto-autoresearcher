  # =====================================================================
  candidates:

    # -----------------------------------------------------------------
    - id: CAND-601-A
      title: >-
        Column-local projective dependency rate: the GF(2^8) rank-1 collision
        rate of column difference vectors of a delta-set, tracked across
        rounds 1-5
      residual_class: multi-byte-coupled
      novelty_status: adaptation
      novelty_status_justification: >-
        Deliberately NOT labeled speculative. The closest in-corpus prior art
        is KN-LIT-7595's recorded measurement "the GF(2^8) rank of the
        Delta-set matrix is always full at r >= 4 (verified over 10^4 keys),
        the rank drop existing only at r = 3". That measurement is the rank of
        the whole-state 17-row matrix. This candidate measures a strictly
        different statistic: the per-column PAIRWISE rank-1 (projective
        collision) rate among the 255 column difference vectors. The two agree
        only in that both are GF(2^8)-linear-algebra statistics on a
        delta-set. The difference is real but narrow, and the honest label is
        `adaptation`, not `speculative`. Novelty against the external
        literature is `unverified` because no primary source was reachable.

      tracked_object:
        name: >-
          The projective class in P^3(GF(2^8)) of the column-restricted
          difference vector of a delta-set element.
        definition: |
          Fix a round count r and a key K. Let D = {p_0, ..., p_255} be a
          delta-set: 256 plaintexts identical in 15 bytes and taking all 256
          values in byte 0. Let x_i = AES_r(K, p_i) under the reduced-round
          convention pinned by TASK-20260731-602. For i = 1..255 let
          d_i = x_i XOR x_0. For each column index j in {0,1,2,3}, let
          v_i^j in GF(2^8)^4 be the restriction of d_i to column j.
          The tracked object is the map
              i  |-->  [v_i^j] in P^3(GF(2^8))  (undefined when v_i^j = 0),
          and the measured statistic is
              R_j(r) = #{ (i,i') : i < i', v_i^j and v_{i'}^j both nonzero
                          and GF(2^8)-linearly dependent } / C(255,2).
        object_class_in_RQ: >-
          A NEW object, named and defined here. It is adjacent to
          RQ-AES-001 object #1 (integral / division-property set) in that it
          uses a delta-set, but the tracked quantity is neither a
          coordinate-wise sum nor an algebraic degree.

      lossy_projection_test:
        verdict: PASS (genuinely lossy), with a stated and short survival depth
        what_is_discarded: >-
          A pair (v_i^j, v_{i'}^j) is 64 bits of state. The projection retains
          exactly one bit: whether the pair is GF(2^8)-collinear. Even the
          weaker per-element projection v |--> [v] discards 8 of 32 bits (the
          GF(2^8) scalar). This is not a change of coordinates: the map is
          32 -> 24 bits per element and 64 -> 1 bit per pair, and the discarded
          scalar is not recoverable from the retained class.
        is_the_discard_compatible_with_the_operations: |
          AddRoundKey: acts as a translation, so it is the IDENTITY on
            differences. The object is exactly preserved.
          MixColumns: acts as left multiplication by a fixed invertible
            M in GL(4, GF(2^8)) on each column. Collinearity is exactly
            preserved: v ~ v' <=> Mv ~ Mv'. The object propagates
            DETERMINISTICALLY.
          ShiftRows: permutes bytes ACROSS columns, so column j of the new
            state draws one byte from each of four old columns. The object is
            destroyed. Note this is the same structural reason KN-LIT-7595
            gives for rejecting matrix rank ("ShiftRows is not of the form
            M |-> PMQ").
          SubBytes: byte-wise L o Inv. Collinearity in GF(2^8)^4 is destroyed
            by Inv and by the GF(2)-affine L alike.
        honest_survival_depth: >-
          Approximately one half-round. The object propagates deterministically
          through ARK and MC and dies at SR and SB. This is stated up front
          because it is the single most important fact about the candidate:
          the a-priori expectation is a NULL at r >= 3, and the candidate's
          primary value is therefore as a cheap, controlled test of a closure
          argument (see `derived_closure_being_tested`), not as an attack.

      derived_closure_being_tested:
        statement: |
          CLOSURE ARGUMENT (derived here, no compute, no recalled literature):
          Let G be the group generated on a single column GF(2^8)^4 by the
          operations AES applies to it linearly, i.e. AddRoundKey
          (translations) and MixColumns (M in GL(4, GF(2^8))). G contains
          AGL(1) x ... but more usefully G contains the full translation group
          together with M; the group generated by GL(4,q) and translations is
          AGL(4,q), which is 2-transitive on GF(2^8)^4.
          Consequences:
            (i) GL(4,q) is transitive on nonzero vectors, so NO nonconstant
                invariant of a SINGLE column state exists.
            (ii) AGL(4,q) is 2-transitive, so NO nonconstant invariant of a
                PAIR of column states exists.
            (iii) For TRIPLES, the only AGL-invariant is the affine ratio
                supported on collinear triples, i.e. exactly the statistic
                measured by this candidate. Collinear triples occur at rate
                O(q^{-2}) for random states.
            (iv) Byte-wise inversion Inv does not preserve GF(2^8)-collinearity
                in dimension > 1, and the GF(2)-affine L does not preserve it
                either, so (iii) is destroyed at the first SubBytes.
          Therefore: the column-local multi-byte ALGEBRAIC lens contributes
          nothing beyond the per-byte lenses already enumerated by
          KN-LIT-7595, and this candidate's measurement is predicted to be a
          controlled null at r >= 3.
        epistemic_label: derivation (checkable argument), never "proved"
        what_would_falsify_it: >-
          A statistically significant, round-decaying excess of R_j(r) over the
          random-permutation control at r >= 3. That would mean an AGL-covariant
          multi-byte structure survives SubBytes in a way the argument does not
          capture, and the argument would be wrong.
        forward_guidance_if_confirmed: >-
          Column-LOCAL algebraic multi-byte coupling is closed. What remains
          open in the multi-byte class is (a) coupling ACROSS columns through
          ShiftRows at the 2-round super-box level, (b) invariants of LARGE
          sets (>= q states), which is the integral / multiple-of-8 family and
          is already mined, (c) information-theoretic (non-invariant)
          statistics, and (d) adaptive objects.

      round_count_asserted: >-
        The object is asserted to propagate deterministically only within one
        linear half-round. The measurement is taken at r = 1, 2, 3, 4, 5. The
        substantive question is r ∈ {3,4,5}; r ∈ {1,2} are positive controls.

      assumptions:
        - id: A1
          statement: >-
            Under the null, the 255 column difference vectors v_i^j behave as
            independent uniform draws from GF(2^8)^4 conditioned on being
            nonzero. Then
            P[two are GF(2^8)-dependent] = 255 / (2^32 - 1) = 5.9371e-8
            ~= 2^-24.0, and the expected number of dependent pairs per column
            per structure is C(255,2) * 5.9371e-8 = 1.923e-3.
          status: >-
            This is a modeling assumption, NOT a claim about AES. It is not
            relied on for the verdict: the verdict is taken against the
            measured null-object control, not against this closed form. The
            closed form is used only as an instrument sanity check.
        - id: A2
          statement: >-
            AES with 10 rounds and an independent random key is an adequate
            stand-in for a random 128-bit permutation at the sample sizes used
            (~2.6e8 encryptions per configuration).
          status: >-
            Explicitly a stand-in. A true random 128-bit bijection cannot be
            instantiated. This limitation is declared rather than hidden, and
            it is why TWO further null controls (random S-box, random linear
            layer) are specified: they randomize the exploited component
            directly and do not depend on A2.
        - id: A3
          statement: >-
            The reduced-round convention (which final-round transformations are
            retained at r < full) is exactly as pinned by TASK-20260731-602.
          status: >-
            Load-bearing. Dropping MixColumns in the final round CHANGES the
            predicted r=1 positive control from rate 1.0 to rate ~2^-24, and
            would silently invert the sanity check. The gate must read the
            convention from the 602 receipt and must report which convention it
            used.

      concrete_prediction:
        - >-
          r = 1 with a final MixColumns retained: R_j = 1.0 exactly in the
          single active column (all 255 difference vectors are scalar multiples
          of the fixed vector (02,01,01,03) up to row rotation), and undefined
          (all-zero) in the other three columns. This is a deterministic
          instrument check with no statistical content.
        - >-
          r = 2: R_j strictly and measurably ABOVE the null rate in all four
          columns, because all four active diagonal bytes derive from the same
          input difference. Magnitude not predicted numerically. This is the
          decay anchor: it is the round at which the corpus's own
          `rounds_structure: 2` figure says structure should still be visible.
        - >-
          r = 3, 4, 5: R_j indistinguishable from the null controls, within 4
          sigma, for all four columns. This is the PREDICTED outcome.
        - >-
          The discriminating shape, not a single number, is what is being
          measured: rate(1) = 1 >> rate(2) > rate(3) ~= rate(4) ~= rate(5)
          ~= rate(null). Any excess at r >= 3 that does NOT decay with r is
          the canonical artifact tell (docs/inventor-protocol.md §3) and is to
          be treated as an instrument fault, not a finding.

      two_explanations_discriminated:
        outcome_X: >-
          R_j(r) matches the null controls at r = 3,4,5 while r = 1,2 fire as
          predicted. MEANING: the derived closure argument's prediction is
          confirmed on the tested range; the column-local algebraic multi-byte
          lens is empirically as well as algebraically empty; the residual
          multi-byte search moves to the cross-column super-box level. The
          instrument is demonstrated to be sensitive (because r=1,2 fired), so
          this is a real null and not a broken measurement.
        outcome_Y: >-
          R_j(r) shows a significant, ROUND-DECAYING excess at r >= 3 that
          survives all three null controls. MEANING: the derivation is wrong;
          an AGL-covariant multi-byte structure survives SubBytes, and the
          mechanism by which it survives becomes the next object. This would be
          a 3-round-or-better structural observation, which is BEHIND the
          5-round frontier and would therefore be a lead, not a result.
        outcome_Z: >-
          Excess present but flat across r, or present in the null controls
          too. MEANING: artifact. Recorded as a controlled null per
          docs/inventor-protocol.md §3, with no positive claim.

      cost_boundary_end_to_end:
        note: >-
          This candidate does not propose an attack, so there is no attack cost
          to charge against a baseline. What is charged below is the full
          end-to-end cost of the MEASUREMENT, per the same discipline.
        data: >-
          2.56e8 chosen-plaintext r-round encryptions per configuration
          (1e6 delta-set structures x 256 texts). Chosen-plaintext, known key
          (this is a structural measurement, not an oracle attack).
        time: >-
          Per structure: 256 reduced-round encryptions + 1020 projective
          normalizations (each 1 GF(2^8) inversion + 3 multiplications via
          log/antilog tables) + 4 collision counts over 255 24-bit values.
          ~1e4 elementary operations per structure; ~1e10 per configuration.
        memory: >-
          < 100 MB. Per-structure working set is 256 states (4 KB) plus a
          255-entry sort buffer. No table larger than the 512-byte GF(2^8)
          log/antilog tables.
        precomputation: >-
          GF(2^8) log/antilog tables (512 bytes) and the AES key schedules.
          Charged, negligible.
        verification: >-
          Charged explicitly and NOT free: (a) the r=1 deterministic check must
          reproduce rate exactly 1.0 or the run is invalid; (b) every
          configuration is re-run under a second independent seed and the two
          rates must agree within 4 sigma; (c) the reduced-round encryptions are
          cross-checked against TASK-20260731-602's aes_reduced.py on a sample
          of 1000 (plaintext, key, r) triples before any statistic is reported.
          Verification adds roughly 100% to the encryption cost and ~1 minute.
        does_it_fit_the_local_envelope: >-
          YES. 4 cores, < 100 MB of the 15 GB, no GPU, no sage. gcc 13.3 with
          -maes for the encryptions and plain C for the field arithmetic.

      dominated_by: >-
        Every row of the reduced-round AES frontier, in the Pareto sense.
        Explicitly checked against each: at r=5, dominated by the multiple-of-8
        distinguisher (~2^32 CP, unverified_from_memory) and by the yoyo
        distinguisher (~2^11 adaptive queries, unverified_from_memory) on the
        data axis, and by both on the time axis, since this candidate claims NO
        distinguisher at all at r=5 under its own predicted outcome. At r=6 and
        r=7 likewise. It is not dominated only in the trivial sense that it is
        not on the same board: it is a structural measurement plus a closure
        test, not an attack. dominated_by is therefore NOT null.
      sota_delta: >-
        Quantitatively: zero. Under the predicted outcome the candidate
        produces no distinguisher and no key recovery at any round count, so
        the delta against every named baseline at every round count in 3-7 is
        0 bits of data, 0 bits of time, 0 bits of memory. Its value is a
        controlled null plus a derived closure with forward guidance, at a
        measurement cost of roughly 15 minutes of local CPU. Under the
        surprising outcome (Y) the delta is still 0 against the 5/6/7-round
        frontier, because a 3-round structural excess is behind it; the delta
        would be informational only.

      deduplication_verdicts:
        integral_square: >-
          NOT an instance. Shares only the delta-set input structure. The
          integral object is the coordinate-wise XOR-sum over the whole set; the
          tracked object here is a pairwise GF(2^8)-collinearity indicator,
          which is invisible to any sum. Closest point of contact: both are
          set-based. Specific difference: the integral property is preserved by
          SubBytes at the level of balancedness for 3 rounds, whereas this
          object dies at the first SubBytes; they are not measuring the same
          thing at any round.
        impossible_differential: >-
          NOT an instance. No pair of truncated differentials is asserted, no
          miss-in-the-middle contradiction is constructed, and nothing is
          claimed to be impossible. The statistic is a RATE, not an
          impossibility.
        meet_in_the_middle_demirci_selcuk: >-
          NOT an instance. There is no offline table, no fingerprint used as a
          table key, no matching step, and no key guessing at all. Contact
          point: DS-MITM also uses a delta-set. Difference: DS-MITM tracks the
          multiset of a single output byte as a table key; this tracks a
          projective class of a 4-byte column and never tabulates it.
        boomerang_and_retracing_boomerang: >-
          NOT an instance. No adaptive queries, no decryption oracle, no
          quartet structure, no switch.
        biclique: >-
          NOT an instance. No key-space structure and no key guessing whatever;
          also biclique targets full-round AES, which is out of scope here.
        division_property_three_subset: >-
          NOT an instance. Nothing about algebraic degree or monomial support is
          tracked. The object is a linear-algebraic collinearity indicator over
          GF(2^8), which the bit-based division property does not represent (it
          works over GF(2) bit patterns). Note: this is the one place where the
          candidate could conceivably see something a division-property search
          could not, which is the only reason it is worth 15 minutes.
        differential_linear: NOT an instance. No linear approximation, no junction.
        yoyo: NOT an instance. No adaptive orbit, no involution.
        in_corpus_mobius_prior_art: >-
          NOT an instance, but ADJACENT and the reason novelty_status is
          `adaptation`. KN-LIT-7593's object is a per-byte projective
          (PGL(2,2^8)) invariant used to eliminate a key byte. This object is a
          per-COLUMN projective class in P^3(GF(2^8)) with no key elimination
          and no attack use. The dimension and the purpose both differ; the
          underlying "projectivize to kill a scalar" idea does not.
        in_corpus_rank_measurement_prior_art: >-
          CLOSEST PRIOR ART. KN-LIT-7595 records "the GF(2^8) rank of the
          Delta-set matrix is always full at r >= 4 (10^4 keys), the rank drop
          existing only at r = 3". Specific difference: that is the rank of the
          whole 17-row state matrix; this is the pairwise rank-1 collision RATE
          restricted to a single column, which is a finer statistic that a full
          whole-state rank cannot detect (a matrix can be full rank while
          containing many collinear column-restricted pairs). If the validator
          judges this difference insufficient, the correct verdict is
          "rediscovery of the KN-LIT-7595 rank measurement at column
          granularity" and the candidate should be dropped. That call is
          explicitly left to the validator; this session does not claim it is
          clear.

      falsification_gate:
        id: GATE-601-A
        count: 1
        description: |
          Single C program (gcc 13.3, -O2 -maes), 4 threads.
          For each configuration below, generate 1e6 delta-set structures with
          independent random keys and random base plaintexts from a recorded
          seed, encrypt with the configuration's cipher, and compute the pooled
          and per-column rate R_j.
          Projective normalization: divide each nonzero column difference
          vector by its first nonzero coordinate (GF(2^8) log/antilog tables),
          pack the canonical representative into 24 bits, sort the 255 values,
          count colliding pairs.
        configurations:
          target: AES-128 reduced to r rounds, r in {1,2,3,4,5}, under the
            TASK-20260731-602 convention.
          null_control_1: >-
            AES-128 at 10 rounds with an independent random key, as a random
            permutation stand-in (assumption A2, declared).
          null_control_2: >-
            AES-r with the AES S-box replaced by a freshly drawn random
            bijection on GF(2^8), r in {3,4,5}. This randomizes the exploited
            component directly and does not rely on A2.
          null_control_3: >-
            AES-r with MixColumns replaced by a random invertible GF(2)-linear
            map on 32 bits (i.e. one that is NOT GF(2^8)-linear), r in {3,4,5}.
            This is the sharpest control: it destroys exactly the GF(2^8)-module
            structure the object claims to exploit while changing nothing else.
        pass_fail_criterion: |
          The gate PASSES (predicted outcome X, closure prediction confirmed)
          iff ALL of:
            (1) r=1 reproduces rate exactly 1.0 in the active column
                [instrument alive];
            (2) r=2 exceeds null_control_1 by more than 4 sigma
                [instrument sensitive];
            (3) for r in {3,4,5}, |R(r) - R(null_control_1)| < 4 sigma in every
                column AND pooled, and likewise against null_control_2 and
                null_control_3.
          The gate FAILS (outcome Y, derivation wrong, escalate) iff (1) and
          (2) hold and some r in {3,4,5} exceeds all three null controls by
          more than 4 sigma AND the excess strictly decreases from r to r+1.
          The gate is VOID (outcome Z, artifact) iff (1) or (2) fails, or an
          excess at r >= 3 is flat or increasing in r, or the excess appears in
          any null control.
        statistical_power: >-
          1e6 structures gives ~1923 expected events per column per
          configuration (Poisson sigma ~44, relative precision 2.3%) and ~7692
          pooled (sigma ~88, 1.14%). A 4-sigma pooled threshold detects a ~4.6%
          excess. Columns are NOT independent under AES, so per-column results
          are reported alongside the pooled figure and the pooled sigma is
          treated as a lower bound on the true uncertainty.
        expected_wall_clock: >-
          10-25 minutes total on 4 cores for all ~12 configurations, plus
          ~10 minutes to write and compile. If it overruns, reduce the r=1,2
          controls to 1e5 structures (their effects are large) and keep 1e6
          only for r in {3,4,5}.
        memory: < 100 MB
        fits_local_envelope: YES

    # -----------------------------------------------------------------
    - id: CAND-601-B
      title: >-
        The partial-sum key-guess aggregation as a Walsh-Hadamard convolution
        over (GF(2)^8)^4, at 6 rounds
      residual_class: >-
        Not a new distinguisher. A cost-term reorganization of an existing
        attack, targeting RQ-AES-001 object #4 directly.
      novelty_status: unverified
      novelty_status_justification: >-
        PROBABLE REDISCOVERY, stated as such up front. I recall, WITHOUT being
        able to verify it under this network policy, that FFT / Walsh-Hadamard
        key recovery for integral attacks is a published technique (a
        Todo-Aoki line of work is what memory returns, recall confidence LOW on
        the attribution and MEDIUM on the existence of the technique), and that
        FFT key recovery for LINEAR cryptanalysis is certainly published
        (Collard-Standaert-Quisquater, recall MEDIUM). If either exists as
        recalled, this candidate is a rediscovery and should be recorded as
        one. It is included NOT because it is believed novel but because the
        gate below settles the LOCAL question (does the reorganization actually
        buy the predicted ratio) for a few minutes of CPU, and because leaving
        RQ object #4 entirely unprobed would be a gap. novelty_status is
        `unverified`, per the rule that novelty may not be claimed from memory.

      tracked_object:
        name: The partial-sum cost term.
        definition: |
          In the 6-round AES-128 integral attack, after collecting a structure
          of ciphertexts, the attacker must evaluate, for every guess
          k = (k_1,k_2,k_3,k_4) in (GF(2)^8)^4, the aggregate
              g(k) = XOR_{c in D} S(c_{sigma(1)} XOR k_1) XOR ... XOR
                                  S(c_{sigma(4)} XOR k_4)
          and test whether it is zero. The tracked object is the
          guess-indexed function g : (GF(2)^8)^4 -> GF(2)^8, together with the
          exact operation count needed to materialize it.
        object_class_in_RQ: >-
          RQ-AES-001 object #4 verbatim: "which key-guess aggregation step is
          claimed to be reorganizable, and the exact operation count before and
          after".
      lossy_projection_test:
        verdict: >-
          NOT APPLICABLE in the strict sense, and this is declared rather than
          faked. The lossy-projection test governs objects tracked through the
          CIPHER. This object is tracked through the ATTACK's arithmetic, not
          through rounds of AES. Applying the test would be a category error.
          The analogous test that IS meaningful — does the reorganization
          discard information the correctness of the attack needs — is answered
          by the gate's correctness check (identical recovered-key sets).
        what_is_discarded: >-
          Nothing about the cipher. The reorganization computes the same
          function g on the same domain; it changes only the evaluation order.
          That is precisely why it is a cost-term claim and not a new object in
          the inventor-protocol sense.

      round_count_asserted: 6 (AES-128)

      assumptions:
        - id: B1
          statement: >-
            For each output-bit mask u in GF(2)^8 \ {0}, the correlation
            C_u(k) = sum_{c} N[c] * (-1)^{<u, S(c XOR k)>} is a
            cross-correlation over the group (GF(2)^8, XOR) in k, and is
            therefore computable for ALL 2^8 values of k_i simultaneously by a
            Walsh-Hadamard transform of size 2^8; the 4-byte case factors as a
            4-dimensional WHT of total size 2^32.
          status: >-
            This is an algebraic claim about the aggregation, checkable
            exactly at small scale by the gate. It is NOT a heuristic about AES.
        - id: B2
          statement: >-
            The recalled partial-sums baseline for 6-round AES-128 is
            approximately 2^34 chosen plaintexts and 2^44 time.
          status: >-
            unverified_from_memory, recall MEDIUM. Recall drift of +-2 in the
            time exponent is plausible. If the true baseline is 2^42 rather
            than 2^44, the candidate's entire claimed margin may vanish. THIS
            IS A DECISIVE LIMITATION and is the reason the candidate is ranked
            second: its margin is smaller than the uncertainty in the baseline
            it is measured against, and that comparison CANNOT be adjudicated
            in this environment.
        - id: B3
          statement: >-
            Full-scale evaluation needs a 2^32-entry accumulator array. At one
            byte per entry that is 4 GB.
          status: >-
            This EXCEEDS the 4 GB task memory budget in the handoff, and fits
            only marginally inside the 15 GB machine limit. The full-scale
            version therefore does NOT fit the declared envelope. Declared, not
            estimated around. The gate is scaled down for exactly this reason.

      concrete_prediction:
        - >-
          On a small-scale AES-shaped cipher with 4-bit cells (guess space
          2^16 rather than 2^32), the WHT aggregation and the partial-sums
          aggregation return IDENTICAL sets of surviving key guesses.
        - >-
          The counted elementary operations satisfy
          ops_WHT / ops_partial_sums = a ratio that is INDEPENDENT of the
          S-box, because the reorganization is S-box-agnostic.
        - >-
          Direction: at the small scale, WHT is predicted to be WORSE than
          partial sums, because partial sums' advantage grows with the number
          of peeled bytes and 4-bit cells give it little room. The interesting
          measurement is the ratio's SCALING in the cell width, extrapolated
          explicitly and labeled as an extrapolation, never as a measurement.

      two_explanations_discriminated:
        outcome_X: >-
          The ratio is S-box-independent and its scaling in cell width shows
          WHT overtaking partial sums before the AES cell width of 8 bits.
          MEANING: the reorganization is real and the 6-round time term may be
          reducible; the next step is a careful matched-accounting comparison
          against the (unverified) 2^44 baseline, which per B2 may not be
          adjudicable here.
        outcome_Y: >-
          The ratio is S-box-independent but WHT never overtakes partial sums
          in the measured cell-width range and the extrapolation puts the
          crossover above 8 bits. MEANING: partial sums already dominates the
          convolution reorganization at AES parameters; RQ object #4 is closed
          in this direction, with a measured ratio as the argument rather than
          an assertion.
        outcome_Z: >-
          The ratio DEPENDS on the S-box. MEANING: artifact. The reorganization
          is algebraically S-box-agnostic, so an S-box dependence can only come
          from the implementation (cache behaviour, branch prediction, an
          accidental data-dependent shortcut). Recorded as an implementation
          fault, and no algorithmic conclusion is drawn.

      cost_boundary_end_to_end:
        baseline_at_same_round_count: >-
          Ferguson et al. partial sums at 6-round AES-128: ~2^34 chosen
          plaintexts, ~2^44 time, memory dominated by the 2^32-entry
          intermediate table. ALL unverified_from_memory (recall medium).
        candidate_data: >-
          IDENTICAL to the baseline (~2^34 CP). The reorganization changes only
          the offline aggregation; it buys nothing on the data axis.
        candidate_time: >-
          The claim, if B1 holds, is O(2^32 * 32) ~= 2^37 elementary operations
          for the 4-dimensional WHT plus 2^34 for the data pass, per output
          mask, times 8 masks -> ~2^40 elementary operations. Against a
          recalled 2^44 baseline that is ~4 bits. Against a recalled 2^42
          baseline it is ~2 bits. AGAINST THE RECALL UNCERTAINTY (+-2 bits) THE
          MARGIN IS NOT RESOLVABLE HERE.
        candidate_memory: >-
          2^32 accumulator entries = 4 GB minimum, versus the baseline's own
          2^32-entry table. Comparable, and both exceed this task's 4 GB budget.
        precomputation: >-
          None beyond the S-box Walsh spectra (2^8 x 2^8 signed table, 64 KB).
          Charged.
        verification: >-
          Charged: every surviving key candidate must be confirmed against a
          full reduced-round encryption under TASK-20260731-602's
          implementation. At the small scale of the gate this is exhaustive and
          free; at AES scale it adds the usual key-confirmation term, which is
          NOT free and is stated as unquantified here rather than assumed zero.
        does_it_fit_the_local_envelope: >-
          The FULL-SCALE version does NOT (4 GB accumulator vs 4 GB task
          budget, plus 2^40 operations). Declared. The GATE does.

      dominated_by: >-
        (i) The Ferguson et al. partial-sums attack at 6 rounds itself, on the
        memory and simplicity axes, and possibly on time (see B2). (ii) In all
        likelihood, published FFT / Walsh-Hadamard key recovery for integral
        attacks, which if it exists as recalled would dominate this exactly and
        completely. (iii) At 7 rounds this is not on the board at all. NOT null.
      sota_delta: >-
        Claimed: at most ~4 bits and possibly ~0 bits on the TIME term of the
        6-round AES-128 integral attack, with data unchanged (~2^34 CP) and
        memory unchanged-to-worse (>= 2^32 entries). Explicitly classified
        under docs/target-result-profile.md A1 as a COFACTOR / CONSTANT-FACTOR
        improvement, NOT an exponent-mover: it does not change the asymptotic
        form of any AES attack, it reorganizes one aggregation. Under the
        target profile this ranks LOW and is presented as such.

      deduplication_verdicts:
        integral_square: >-
          IS an instance, by construction — this candidate lives inside the
          integral/square attack and does not pretend otherwise. What differs
          is only the evaluation order of the key-guess aggregation. Recorded
          as a modification of a known attack, not as a new family.
        impossible_differential: NOT an instance. No contradiction object.
        meet_in_the_middle_demirci_selcuk: >-
          NOT an instance, though it shares the theme of trading time for a
          precomputed structure. There is no fingerprint and no matching.
        boomerang_and_retracing_boomerang: NOT an instance. No adaptivity.
        biclique: NOT an instance.
        division_property_three_subset: >-
          NOT an instance. The division property would be used to FIND the
          integral distinguisher; this candidate takes the distinguisher as
          given and reorganizes the key-recovery arithmetic downstream of it.
        differential_linear: >-
          NOT an instance, but the ENABLING TECHNIQUE is recalled to originate
          in linear cryptanalysis (FFT key recovery). That lineage is the main
          reason to expect this is already known.
        yoyo: NOT an instance.
        in_corpus_prior_art: >-
          No in-corpus prior art. KN-LIT-7593 is a DS-MITM result and does not
          touch partial sums.

      falsification_gate:
        id: GATE-601-B
        count: 1
        description: |
          Implement both aggregations in C on a small-scale AES-shaped cipher
          with 4-bit cells and a 4x4 state (64-bit block), reduced to the round
          count at which its integral distinguisher plus one key-recovery round
          applies. Guess space: 4 cells x 4 bits = 2^16, fully enumerable.
          Instrument BOTH implementations with an explicit operation counter
          (counting table lookups, XORs, and additions identically in both), so
          the comparison is a COUNTED ratio and not a wall-clock ratio.
          Repeat at 3-bit and 5-bit cells to obtain the ratio's scaling in cell
          width, and report the extrapolation to 8 bits as an EXTRAPOLATION.
        pass_fail_criterion: |
          PASS (worth escalating): both implementations return IDENTICAL
            surviving-key sets on 8 random keys, the counted ratio is
            S-box-independent within 1%, and the fitted scaling in cell width
            predicts WHT < partial sums at 8-bit cells.
          FAIL (RQ object #4 closed in this direction, with a measured
            argument): identical key sets, S-box-independent ratio, but the
            fitted scaling predicts WHT >= partial sums at 8-bit cells.
          VOID: the key sets differ (correctness bug), or the ratio depends on
            the S-box (implementation artifact).
        null_object_control: >-
          Re-run the identical comparison with the small-scale cipher's S-box
          replaced by a freshly drawn random bijection on the cell alphabet.
          The reorganization is algebraically S-box-agnostic, so the counted
          ratio MUST be unchanged. A ratio that moves when the S-box is
          randomized proves the measured advantage is an implementation
          artifact rather than an algebraic one. This is the required
          null-object control and it is unusually sharp for a cost-term claim.
        expected_wall_clock: >-
          ~40 minutes to implement, < 5 minutes to run all cell widths and both
          S-box variants on 4 cores.
        memory: < 500 MB (2^16 guess space, 2^20 counters at the largest cell width)
        fits_local_envelope: YES (the gate does; the full-scale attack does not)

  # =====================================================================
  # Objects generated and REJECTED, with mechanisms. These are enumerated
  # closures at the docs/inventor-protocol.md §4 standard where the standard is
  # met, and are labeled `fatigue_report` where it is not.
  enumerated_closures:

    - object: >-
        The 4x4 GF(2^8) matrix formed from four states' columns, tracked by its
        determinant (a MixColumns-covariant object).
      mechanism: >-
        MixColumns acts as D |-> M D so det scales by the constant det(M) —
        genuinely covariant. But ShiftRows is not of the form D |-> P D Q, so
        it does not act on the determinant at all, and SubBytes (byte-wise
        L o Inv) does not either. Survival depth: one MixColumns. This is the
        same obstruction KN-LIT-7595 records for rejecting matrix rank, applied
        to a different invariant of the same matrix.
      standard_met: closure (named obstruction + argument)
      forward_guidance: >-
        Any GL(4, GF(2^8))-covariant object dies at ShiftRows. A multi-byte
        object must be defined on a SHIFTROWS-INVARIANT byte set (a diagonal,
        or a full 2-round super-box), not on a column.

    - object: >-
        The pairwise ratio a/b of two bytes as a point of P^1(GF(2^8)),
        tracked through rounds.
      mechanism: >-
        Inv sends (a:b) to (b:a), so the ratio survives inversion; but
        L(a)/L(b) is not a function of a/b, so it dies at the affine part of
        the S-box. This is exactly the Inv/L duality recorded in KN-LIT-7595
        and exactly the object of KN-LIT-7593.
      standard_met: >-
        rediscovery, not a closure. Recorded so the next session does not
        re-derive it.
      forward_guidance: >-
        The projective per-byte lane is spent. KN-LIT-7593 already extracted
        the one place it pays (eliminating a DS-MITM key-byte guess).

    - object: >-
        Subfield trails: track whether states lie in a coset of the
        GF(2^4)-structured subset of GF(2^8)^16.
      mechanism: >-
        Inv preserves subfields (x^{-1} in GF(16) whenever x in GF(16)*), so
        the object survives inversion. It dies at the GF(2)-affine part L of
        the S-box, which does not preserve GF(16), and at MixColumns, whose
        coefficients 02 and 03 are not in GF(16). Both obstructions are
        independent, so the object cannot be rescued by changing one component.
        This is the dual-cipher / BES-style structure and is recalled to be
        long known to give nothing for AES (recall MEDIUM, unverified).
      standard_met: closure (named obstruction + argument), with a recalled prior-art caveat
      forward_guidance: >-
        Subfield structure is doubly obstructed for AES. Any subfield-flavored
        object must instead target a cipher where the linear layer is defined
        over the subfield.

    - object: >-
        The AES-128 key schedule as a source of exploitable redundancy beyond
        linear key bridging: an invariant crossing the key-schedule S-box.
      mechanism: >-
        The AES-128 key schedule is a BIJECTION producing four words per round
        from four words. There is no redundancy within a round transition, so
        no invariant can reduce the number of independent unknowns below the
        number of distinct master-key bits referenced. Key bridging works
        purely because different attack positions reference the SAME master-key
        bits, which is a rank computation on a GF(2)-linear span; that
        computation is exact and already performed in the published DS-MITM
        analyses. An invariant crossing the key-schedule S-box would have to
        eliminate an unknown XORed AFTER the S-box, which is precisely the
        DKS10 move transported to the key schedule — and it saves nothing,
        because each such position introduces exactly one new unknown byte.
      standard_met: closure (named obstruction + argument). Derived here, not recalled.
      forward_guidance: >-
        RQ object #2 is closed for AES-128 in the single-key setting against
        redundancy-based exploitation. What remains open: (a) AES-192 and
        AES-256, whose key schedules have a genuinely different word-recurrence
        structure and where the ratio of key material to round material differs;
        (b) related-key settings, which are OUT OF SCOPE for this campaign;
        (c) the interaction between key-schedule nonlinearity and the DATA path
        in a specific attack, which is an attack-level question and not a
        key-schedule-object question.

    - object: >-
        The GF(2)-rank of the 255 x 128 binary matrix of delta-set ciphertext
        differences.
      mechanism: >-
        255 vectors in a 128-dimensional GF(2) space span it with probability
        overwhelmingly close to 1 under any model, so the statistic is
        saturated at 128 for both AES and the null at every r >= 2. Zero
        discriminating power by a counting argument alone; no compute needed.
      standard_met: closure (named obstruction + argument)
      forward_guidance: >-
        Rank statistics are only informative when the number of vectors is
        comparable to the dimension. Any rank-flavored object must be defined
        on a restricted byte set (which is what CAND-601-A does at column
        granularity) or on a much larger ambient space.

    - object: >-
        Fixed points and cycle structure of the reduced-round permutation;
        commutators and conjugates of the round function.
      mechanism: >-
        Recorded as already rejected in KN-LIT-7595 with mechanisms:
        commutators/conjugates are differential cryptanalysis with phi drawn
        from a larger group than the translation group; fixed points presuppose
        an identification of input and output space that is a choice of
        representation, so any signal is an artifact of coordinates. Not
        re-derived here.
      standard_met: >-
        prior-art closure (corpus-relayed, not re-verified). Recorded to
        prevent re-treading.
      forward_guidance: none beyond KN-LIT-7595's own.

    - object: >-
        The multiplicity profile (integer partition of 256) of a single output
        byte over a delta-set, as an information-theoretic refinement of the
        integral balance property.
      mechanism: >-
        This is the DKS10 multiset fingerprint. Tracking the multiplicity
        profile at 4 rounds and asking whether it is distributionally
        distinguishable IS the DS-MITM distinguisher question, and its answer
        at r >= 5 is the published frontier. A rediscovery.
      standard_met: rediscovery, not a closure.
      forward_guidance: >-
        The information-theoretic residual class named by KN-LIT-7595 is NOT
        empty, but its most obvious member is already the DS-MITM fingerprint.
        A genuinely new information-theoretic object must be defined on
        something other than the single-byte multiset of a delta-set.

  # =====================================================================
  residual_open_question: >-
    Does any object coupling bytes ACROSS columns — i.e. defined at the level
    of the 2-round 32-bit super-box, where ShiftRows is on the outside — admit
    a lossy projection that propagates deterministically for more than the
    one-and-a-half rounds achieved by column-local objects? This is the
    residual that both KN-LIT-7595's closure argument and this session's
    column-level extension of it point at, and it is the one class where
    neither argument applies.

  object_classes_left_unexamined_this_session:
    - >-
      Super-box-level (cross-column, 2-round) objects. Named as the primary
      residual above. Not examined because defining a lossy projection on a
      32-bit super-box requires enumerating the super-box's own algebraic
      structure, which was beyond this session's budget.
    - >-
      Adaptive objects other than yoyo and boomerang. The adaptive residual
      class named by KN-LIT-7595 was entered only far enough to confirm that
      the obvious members (adaptive orbits, cycle structure) are already taken
      or already rejected. A systematic enumeration of adaptive objects was not
      attempted.
    - >-
      AES-192 and AES-256 key schedules as objects. Excluded by budget, not by
      argument. Flagged in the key-schedule closure as genuinely open.
    - >-
      Non-truncated (S-box-dependent) impossible differentials, which the
      recalled provable-security result on truncated IDs leaves as the only
      residual in that lane. Not examined.
    - >-
      Anything requiring MILP/SAT tooling, which is not installed. This
      structurally excludes independent verification of the division-property
      obstruction recorded in baseline_map.md §8.1.

  honest_accounting:
    objects_considered: 9
    objects_admitted_as_candidates: 2
    objects_closed_with_a_mechanism: 5
    objects_recorded_as_rediscoveries: 2
    depth_of_verified_structure: >-
      NONE. Zero compute was spent in this session. Every statement about AES
      here is either a derivation (checkable argument, labeled as such) or
      recalled literature (labeled unverified_from_memory). No measurement was
      taken and no structure was verified at any tier.
    dominated_by: >-
      n/a (no result claimed). Both candidates carry their own non-null
      dominated_by entries above; the SESSION claims no result and therefore
      dominates nothing and is dominated by everything on the frontier.
    sota_delta: >-
      Zero. No attack, no distinguisher, no measurement. The session's output
      is one derived closure argument (the AGL 2-transitivity argument
      extending KN-LIT-7595's per-byte closure to column-local multi-byte
      objects), one derived closure on the AES-128 key schedule, four further
      enumerated closures, and two falsifiable gates costing roughly 15 and 45
      minutes of local CPU respectively.
    is_this_a_fatigue_report: >-
      Partly, and that is stated rather than hidden. The two closures derived
      in this session (column-local AGL argument; AES-128 key-schedule
      bijectivity) meet the §4 standard: named obstruction, argument, forward
      guidance. The remaining screening — the subfield object, the determinant
      object, the rank object — also carries mechanisms and meets the standard.
      But the SESSION-LEVEL conclusion "the reduced-round AES space looks
      mined" is NOT claimed, is NOT supported, and would be a fatigue report if
      it were. The correct session-level status is `unverified`.

  ranking:
    first_to_test: CAND-601-A
    rationale: >-
      GATE-601-A is the cheapest valid discriminator in the batch and the only
      one whose instrument sensitivity is guaranteed BEFORE the result is
      interpreted. Its r=1 configuration has a deterministic predicted value
      (rate exactly 1.0) and its r=2 configuration has a predicted large
      excess, so a null at r=3,4,5 is demonstrably a real null rather than a
      broken measurement — which is the failure mode that makes most cheap
      cryptanalytic gates worthless. It carries three independent null
      controls, one of which (random GF(2)-linear MixColumns) destroys exactly
      the structure the object claims to exploit while changing nothing else.
      It costs ~15 minutes and < 100 MB. Its predicted outcome is a null, and
      that null is itself the deliverable: it converts this session's derived
      AGL closure argument from an assertion into a measured prediction, which
      is exactly the docs/inventor-protocol.md §6 step-1 obligation.
      CAND-601-B is ranked second because (a) it is a probable rediscovery,
      (b) it is a cofactor improvement rather than an exponent-mover under
      docs/target-result-profile.md A1, and (c) decisively, assumption B2
      records that its claimed margin (~4 bits, possibly ~0) is SMALLER than
      the +-2-bit uncertainty in the recalled baseline it would be measured
      against, so the comparison that matters cannot be adjudicated in this
      environment even if the gate passes.
    expected_information_gain_vs_cost:
      CAND-601-A: >-
        High information per unit cost, low ceiling. ~15 min CPU. Resolves a
        derived closure argument empirically with a guaranteed-sensitive
        instrument. Both outcomes are informative and the surprising outcome is
        immediately checkable.
      CAND-601-B: >-
        Moderate information, ~45 min mostly implementation, and a ceiling that
        is explicitly capped by the unverifiability of its baseline. Worth
        running only if BATCH-002 has spare capacity after CAND-601-A resolves.

  scope_statement: >-
    Everything above is scoped to AES-128 at 3-7 rounds under the reduced-round
    convention pinned by TASK-20260731-602, on the local 4-core/15 GB envelope.
    No statement here concerns full-round AES, AES-NI-deployed AES, or the
    security of any system that uses AES. No candidate has been executed and no
    measurement has been taken.
