          detected: true
        - mutant: rcon_off_by_one
          status: applied
          kat_flagged: 4/4
          random_pairs_flagged: 200/200
          detected: true
      all_three_took_the_applied_path: true
      committed_green_is_uncontaminated: >-
        CONFIRMED. Every mutant in the committed run was detected by a real
        comparison, not by any import-time exception. The historical false-green
        does not touch the archived result.
      is_the_fix_genuine:
        verdict: YES for the failure mode it was introduced to address
        probe: >-
          I reconstructed the original false-green shape - a module raising a
          NON-AssertionError at import (AttributeError: 'NoneType' object has no
          attribute '__dict__', the exact exception the executor reports).
        result: >-
          Control returns verdict=FAIL with all three rows status
          driver_import_error, detected: False. The fix is real: sys.modules
          registration before exec_module, and non-assertion exceptions routed to
          detected: false, both behave as documented.
      residual_false_green_path:
        exists: true
        defect_id: H-1
        probe: >-
          Injected an import-time AssertionError UNRELATED to the mutation.
        result: >-
          Control returns verdict=pass with all three rows
          rejected_by_module_self_check, detected: True - three mutants credited
          as detected without any comparison having been made.
        precise_answer_to_the_question_asked: >-
          The current scoring MOSTLY cannot credit an import error as a
          detection, but not entirely. The failure class is narrowed from ALL
          import exceptions to AssertionError only, not eliminated. The driver
          does not verify that the AssertionError came from the module's own
