    defects:
      - id: H-1
        severity: medium (latent, not realized)
        title: Mutation control still credits any import-time AssertionError as a detection
        evidence: probe C above; control returned pass on three uncompared mutants
        impact: >-
          Does not affect the committed result (all three mutants imported
          cleanly and were caught by comparison). It is a live path for future
          runs.
        suggested_repair_not_performed_by_me: >-
          Require the assertion text to match the module's own self-check, or
          remove the self-check detection path entirely and require every mutant
          to be caught by a comparison.
      - id: H-2
        severity: low
        title: The module self-check is stripped under python3 -O
        evidence: >-
          Under -O a module with provably inconsistent MixColumns/inverse
          matrices imports without raising; without -O it raises
          "AES MixColumns matrices inconsistent".
        impact: >-
          Limited - such a mutant would still be caught by the differential
          comparison. But a check whose behaviour depends on an interpreter flag
          is not a check.
      - id: H-3
        severity: medium (coverage gap, nothing false asserted)
        title: The mutation control has zero coverage of the reduced-round path
        evidence: >-
          All three mutants are scored by comparison at full rounds against
          pycryptodome. No mutant perturbs round-structure logic (_is_final_round,
          encrypt_partial level bounds, round-key indexing at r < Nr) - precisely
          the bugs that would be invisible at r = Nr and would silently corrupt
          every later reduced-round measurement.
        impact: >-
          The receipt's detection-power claim is scoped to the full-round path
          and must be read that way.
      - id: H-4
        severity: declared limitation, correctly stated by the producer
        title: The reduced-round path has no external reference and cannot obtain one
        impact: see circularity assessment below

    circularity_assessment:
      question: >-
        Do the internal consistency checks actually constrain reduced-round
        semantics, or are they circular (checking the implementation against
        itself)?
      answer: PARTLY CIRCULAR, BUT NOT WHOLLY - and the parts must not be conflated.
      not_circular:
        - >-
          COMPONENTS are externally pinned and this genuinely constrains the
          reduced-round path. The reduced cipher uses byte-identical components to
          the full cipher (verified directly: round_keys prefixing and shared
          Components). Any component error would surface at r = Nr, where three
          independent implementations agree over 10440 of my own comparisons.
        - >-
          The PROSE-TO-CODE binding is externally checked by my independently
          authored implementation of the documented convention (A-R5, 468/468).
          A second author's reading of the same written spec computes the same
          function at every reduced round count.
      circular:
        - >-
          The receipt's own reduced_round_convention flat-checks are in part the
          implementation checked against itself. C2_rounds0_is_pure_whitening and
          C4_distinct_ciphertext_per_round_count are definitional or
          near-tautological and constrain nothing beyond internal coherence.
      irreducible:
        - >-
          The round-structure convention itself is a CHOICE, not a fact that
          could be right or wrong against a reference. At r < Nr this is a
          DEFINITIONAL question, not a correctness question. No tool implements
          reduced-round AES, so no external reference is obtainable.
      operative_consequence: >-
        This matters at exactly one point: any future comparison of a
        reduced-round measurement against a recalled literature number silently
        assumes both use the same convention. The producer states that obligation
        explicitly and marks its own recollection UNVERIFIED-FROM-MEMORY. My
        recollection agrees with the module's and is EQUALLY UNVERIFIED - I read
        no source. The commit message's framing, "the instrument is externally
        verified precisely where the research is not happening", is accurate and
        I confirm it.

  # =====================================================================
  check_b_ideation_screening:
    report: ideation_screening_review.md
    verdict: failed
    verdict_scope: >-
      Failed on mathematical substance, not on honesty, novelty presentation, or
      form. Repair-and-resubmit, not discard.
    what_did_not_fail: >-
      The package is well-formed, unusually honest, correctly refuses the
      session-level saturation conclusion as `unverified`
      (docs/inventor-protocol.md section 4), presents NEITHER candidate as novel,
      records depth_of_verified_structure: NONE truthfully, and hands its hardest
      calls to the validator rather than resolving them in its own favour.

    formal_completeness:
      every_candidate_names_a_tracked_object_at_a_round_count: true
      every_candidate_has_end_to_end_cost_boundary: true   # data, time, memory, precomputation, verification all charged
      every_candidate_names_exactly_one_runnable_gate: true
      every_gate_states_its_null_object_control: true
      dominated_by_non_null_and_row_checked: true
      sota_delta_quantitative: true
      lossy_projection_test_recorded_per_candidate: true
      six_family_deduplication_verdicts_present: true
      verdict: PASSES on form

    rediscovery_findings:
      candidates_judged_to_be_a_rediscovery_presented_as_novel: none
      cand_601_a:
        producer_label: 'novelty_status: adaptation'
        my_call_on_the_deferred_question: >-
          NOT a rediscovery of the KN-LIT-7595 rank measurement. The producer's
          distinguishing argument is mathematically correct: a matrix can be full
          rank while containing many collinear column-restricted pairs, so the
          per-column pairwise collinearity rate is a strictly finer statistic that
          a whole-state 17-row rank cannot detect. The label `adaptation` is
          correct and sufficient.
        material_qualifier: >-
          The difference is real but INCONSEQUENTIAL - both statistics are null at
          r >= 3, which I measured directly. Being a different measurement from
          the prior art does not make it an informative one.
        novelty_vs_external_literature: unresolvable in this environment
      cand_601_b:
        producer_label: 'novelty_status: unverified; PROBABLE REDISCOVERY stated up front'
        my_call: >-
          Self-label CORRECT and SUFFICIENT. Sufficiency here means not presenting
          recalled-as-known material as novel, and the candidate does the
          opposite - it leads with the probable rediscovery, ranks itself second
          for that reason, and refuses to claim novelty from memory.
        my_own_recall: >-
          Consistent with the producer's (FFT/WHT key recovery for integral
          attacks; FFT key recovery for linear cryptanalysis), at comparably low
          confidence on attribution. MY RECALL IS UNVERIFIED_FROM_MEMORY TOO. Two
          agreeing recollections settle nothing and I have not treated them as
          settling anything.

    survival_depth_call:
      question_handed_to_me: >-
        Does CAND-601-A's self-reported ~1/2-round survival depth undermine its
        premise?
      my_call: YES
      reasoning: >-
        If the object provably cannot propagate past one half round (dies at
        ShiftRows and SubBytes, verified), then at r >= 3 it tracks nothing and
        the measurement tests only whether unmodelled structure happens to surface
        in this statistic - a fishing expedition, not a test of the object. The
        producer's defence is that the value lies in cheaply testing its closure
        argument, which requires (i) a sound closure argument and (ii) a gate that
        can demonstrate its own sensitivity. NEITHER HOLDS (defects I-4, I-2,
        I-3). With both legs removed, the survival depth does undermine the
        premise.
      not_a_recommendation_to_discard: >-
        The object is legitimately defined and the measurement is cheap. Declining
        to run it because the target looks mined would itself be the
        premature-closure failure mode (docs/inventor-protocol.md section 4). The
        correct disposition is repair-before-run.

    closure_audit:
      claimed_closures: 5
      meeting_the_section_4_standard_as_verified_by_me: 3
      derivation_but_over_firmly_phrased: 1
      not_holding: 1
      per_item:
        - object: determinant of the 4x4 column matrix
          my_verdict: CORRECT closure - named obstruction, argument, forward guidance
        - object: GF(2)-rank of the 255x128 difference matrix
          my_verdict: CORRECT closure by a pure counting argument, correctly needing no compute
        - object: GF(2^4) subfield trails
          my_verdict: >-
            CORRECT closure - the two obstructions (L does not preserve GF(16);
            MixColumns coefficients 02,03 are not in GF(16)) are both real and
            independent
        - object: AES-128 key schedule redundancy
          my_verdict: >-
            A GENUINE derivation at the counting level. The invertibility claim is
            true. The step from "bijective, hence no redundancy" to "therefore no
            invariant can reduce the unknown count" is correct as counting but
            phrased more firmly than it supports - absence of counting redundancy
            does not exclude an invariant that eases an attack's system of
            equations. Scoping (AES-192/256 left open, related-key out of scope)
            is honest. Not counted as a defect.
        - object: AGL(4,q) 2-transitivity column-local closure
          my_verdict: DOES NOT HOLD - see defect I-4. This is the session's flagship derivation.
      two_items_self_labelled_rediscovery_not_closure:
        my_verdict: >-
          Both self-labels correct (the P^1 byte-ratio object; the single-byte
          multiset profile). Neither is presented as a closure. Good practice.

    recomputations_performed:
      - id: B-R1
        what: Order of the AES MixColumns matrix in GL(4, GF(2^8))
        result: >-
          order = 4. |<M>| / |GL(4,q)| = 1.18e-38. Orbit of e1 under <M> has size
          4 versus q^4-1 = 4294967295; at least 1073741823 orbits on nonzero
          vectors.
        bears_on: defect I-4
      - id: B-R2
        what: Does byte-wise Inv preserve GF(2^8)-collinearity?
        result: >-
          YES - preserved on 4000/4000 collinear pairs with all coordinates
          nonzero, and 4000/4000 with a zero coordinate. Inv(lambda*v)_i =
          lambda^-1 * v_i^-1.
        bears_on: defect I-2
      - id: B-R3
        what: Does the S-box affine part L break collinearity?
        result: broken on 4000/4000 collinear pairs - L is the operative obstruction
        bears_on: defect I-2
      - id: B-R4
        what: Dependent-pair rate for random nonzero vectors in GF(q)^4
        result: >-
          (q-1)/(q^4-1) = 5.937e-08 = 2^-24.01 = q^-3, matching the candidate's
          own assumption A1 and contradicting step (iii)'s stated O(q^-2) = 2^-16.
        bears_on: defect I-5
      - id: B-R5
        what: >-
          Recomputation of CAND-601-A's own statistic R_j using the CHECK
          (a)-verified harness, under BOTH reduced-round conventions
        result: >-
          final_mix_columns=TRUE  -> r=1: [1,nan,nan,nan]; r=2: [1,1,1,1]; r=3: [0,0,0,0]
          final_mix_columns=FALSE -> r=1: [1,nan,nan,nan]; r=2: [1,1,1,1]; r=3: [0,0,0,0]
        bears_on: defects I-1 and I-3
      - id: B-R6
        what: Does gate criterion (2) discriminate against the gate's own null_control_2?
        result: >-
          NO. AES and random-S-box AES both give R_j = 1 at r=1 (active column)
          and R_j = 1,1,1,1 at r=2. At r=3 both collapse to the null
          (AES 0,0,0,1.03e-06; random-S-box 0,0,0,0 - consistent with the
          2^-24 rate at my sample size).
        bears_on: defect I-3
      - id: B-R7
        what: Arithmetic check of GATE-601-A's stated statistical power
        result: >-
          CORRECT. C(255,2) = 32385; 1e6 * 32385 * 5.9371e-8 = 1922.6 expected
          events per column, matching the stated ~1923, sigma ~ 44. The power
          arithmetic is sound; the CONTROL DESIGN is not.

    defects:
      - id: I-4
        severity: major
        candidate: CAND-601-A (and the session's flagship in-session derivation)
        title: The AGL 2-transitivity closure is an assertion, not a derivation
        evidence: B-R1
        detail: >-
          The quoted group-theoretic fact (translations plus GL(4,q) generate
          AGL(4,q), which is 2-transitive) is true, but AES does not supply
          GL(4,q) on a column - MixColumns supplies ONE element, of order 4. The
          group generated is at most T semidirect <M>; on differences (where
          translations act trivially) it is just <M>, cyclic of order 4 with
          ~1.07e9 orbits on nonzero vectors. It is neither transitive nor
          2-transitive, so steps (i) and (ii) do not follow and nonconstant
          invariants of a single column difference exist in abundance.
        what_survives: >-
          The elementary and correct fact that collinearity specifically is
          preserved by any invertible M - which is all the candidate's statistic
          needs. What does NOT survive is the closure's stronger claim that the
          column-local algebraic multi-byte lens is empty.
      - id: I-2
        severity: major
        candidate: CAND-601-A
        title: Step (iv) of the AGL argument is false
        evidence: B-R2, B-R3
        detail: >-
          "Byte-wise inversion Inv does not preserve GF(2^8)-collinearity in
          dimension > 1" is false. Inv preserves collinearity exactly (4000/4000,
          including with zero coordinates). The affine L is the operative
          obstruction. The conclusion "dies at the first SubBytes" survives, via a
          different mechanism than stated.
        internal_contradiction: >-
          The report contradicts itself: its own SECOND enumerated closure states
          correctly that "Inv sends (a:b) to (b:a), so the ratio survives
          inversion" - the same Inv/L duality it gets wrong in step (iv).
      - id: I-3
        severity: major
        candidate: CAND-601-A / GATE-601-A
        title: The gate's positive controls do not discriminate against its own null object
        evidence: B-R5, B-R6
        detail: >-
          R_j = 1.0 at r=1 and r=2 for AES AND for the gate's own random-S-box
          null_control_2. Criterion (2) ("r=2 exceeds the null - instrument
          sensitive") fires on a byte-activity pattern (one active byte per column
          after round 2's ShiftRows scatters the active column), not on the
          GF(2^8)-module structure the object claims to exploit. A null at r >= 3
          would therefore NOT be the demonstrated-sensitive null the candidate's
          rationale promises.
        secondary: >-
          The predicted discriminating shape rate(1) >> rate(2) > rate(3) is also
          wrong: rate(2) is saturated at 1.0, so there are only two levels - a
          cliff, not a decay - and the docs/inventor-protocol.md section 3 decay
          test cannot be applied on the positive side. The VOID criterion
          (excess at r >= 3 flat or increasing) is retained and remains correct.
      - id: I-1
        severity: moderate
        candidate: CAND-601-A
        title: Assumption A3, self-labelled load-bearing and decisive, is false
        evidence: B-R5
        detail: >-
          A3 claims dropping the final MixColumns changes the r=1 control from
          rate 1.0 to ~2^-24 and "would silently invert the sanity check". Under
          the pinned default convention the r=1 rate is 1.0, identical to the
          other variant, because with MixColumns dropped each column difference
          has a single nonzero byte and any two such are trivially collinear. The
          error is in the safe direction for criterion (1), but a load-bearing
          assumption stated as decisive is wrong and cost seconds to check.
      - id: I-5
        severity: minor
        candidate: CAND-601-A
        title: Internal numerical inconsistency in closure step (iii)
        evidence: B-R4
        detail: >-
          Step (iii) states collinear triples occur at rate O(q^-2) = 2^-16; the
          true rate is q^-3 = 2^-24.01, which is exactly what the candidate's own
          assumption A1 states. A1 is correct, the closure text is wrong. Nothing
          load-bearing depends on it.
      - id: I-6
        severity: moderate
        candidate: CAND-601-B
        title: sota_delta asserts a bit-margin against a baseline the candidate itself shows is unadjudicable
        detail: >-
          The claimed ~4-bit (possibly ~0-bit) margin is smaller than the
          +/-2-bit recall uncertainty in assumption B2's unverifiable 2^44
          baseline. Any conclusion of the form "beats partial sums by N bits" is
          unreachable here REGARDLESS of how the gate resolves, and should be
          STRUCK from the candidate rather than deferred as an open question.

    cand_601_b_gate_assessment:
      question_handed_to_me: >-
        What, if anything, could GATE-601-B establish given that its ~4-bit
        margin is smaller than the +/-2-bit uncertainty in its baseline?
      unreachable_here: >-
        Any comparison against the recalled 2^44 partial-sums baseline, and
        therefore the candidate's stated sota_delta.
      reachable_and_self_contained:
        - >-
          Correctness equivalence: that the WHT reorganization and partial sums
          return identical surviving-key sets on the small-scale cipher. Pure
          algebra, exactly checkable, needs no literature.
        - >-
          That the counted operation ratio is S-box-independent, via the gate's
          null-object control (re-run with a random bijection on the cell
          alphabet). This is a genuinely sharp control for a cost-term claim and
          is the strongest single element in the ideation package: the
          reorganization is algebraically S-box-agnostic, so a ratio that MOVES
          under S-box randomization proves the advantage is an implementation
          artifact.
        - >-
          A measured ratio between the two aggregations on a scaled-down instance
          whose guess space is fully enumerable (2^16) - which is exactly
          docs/inventor-protocol.md section 6 step 2, the step the protocol names
          as the one this program most often skips. This is independent of B2
          because it compares against a re-implemented baseline, not a recalled
          number.
      correctly_labelled_as_extrapolation: >-
        The crossover at 8-bit cells is stated as an extrapolation from 3/4/5-bit
        measurements and never as a measurement. The report also pre-commits to
        the predicted NEGATIVE case (WHT expected worse at small scale),
        satisfying the section 6 step-2 obligation to check predicted negatives.
      assessment: >-
        The gate is sound and worth running once its baseline comparison and
        sota_delta are struck. Correctly declared, not estimated around: the
        full-scale form needs a 2^32-entry (4 GB) accumulator and does not fit the
        declared envelope.

