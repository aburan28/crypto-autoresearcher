        realized_in_committed_run: false
        severity: medium, latent
      control_of_the_control:
        probe: >-
          A semantics-preserving no-op mutant (S-box construction rewritten as a
          list comprehension plus tuple(); source text changed, cipher unchanged).
        result: 0/200 random pairs flagged, would be scored detected=False
        verdict: >-
          CORRECT. The mutation control discriminates rather than firing on
