  controls:
    null_object_controls_i_built:
      - id: VAL-CTRL-1
        purpose: "inventor-protocol section 3: a statistical/structural signal without a null object of the same shape is not evidence. Isolate WHICH property of null_2 produces the stall."
        object: "the producer's own selection rule run on the OTHER proper nontrivial subgroup of GF(2^4)* (order 5, {1,8,a,c,f}); first invertible circulant (01,01,01,08)"
        same_shape_as_null_2: true   # all entries nonzero, invertible, entries in a PROPER subgroup, (lambda,k) graph NOT strongly connected (3 SCCs of size 20)
        reading: {histogram: {16: 65535}, count_dim16: 65535}
        result: "IDENTICAL TO THE TARGET. This matrix would have fired VOID-A."
        conclusion: >-
          Failure of strong connectivity of the (lambda,k) graph does NOT move
          the gate reading. Three non-strongly-connected matrices read 1, 8 and
          16. The property that produces the stall is SUBFIELD confinement
          (S = GF(4)*mu is closed under addition), which is exactly what the
          producer's own section 0.3 hand argument says - not connectivity.
      - id: VAL-CTRL-2
        purpose: "regression / vacuity control for the instrument"
        object: semantics-preserving no-op mutant on the pristine committed module
        result: "detected: false after 212 EXECUTED comparisons, 0 divergences - the control has not become a detect-everything"
      - id: VAL-CTRL-3
        purpose: "before/after control for the ER-6 repair on my own fault"
        object: same fault under --fmc-coverage legacy
        result: "pass (the ER-6 false green) vs FAIL under full coverage"
    decay_statement: >-
      Required by inventor-protocol section 3. The gate's measured quantity is a
      GF(2)-closure dimension, and the parameter meant to destroy it is
      confinement of the scalar orbit. It DOES decay as intended: 16 (whole
      group) -> 8 (GF(4)-line) -> 1 (trivial). But it does NOT decay under
      failure of strong connectivity, which is the property the report names:
      order-5 confinement breaks connectivity and leaves the reading at 16. The
      quantity does not respond to the parameter the report says destroys it.
      That is recorded as V-804-1.

  # =====================================================================
  rulings_requested_by_the_coordinator:
    F-1_is_proposition_801_1_in_scope_vacuous:
      ruling: >-
        IN-SCOPE VACUOUS. Proposition 801-1 is true, correctly derived, and
        bites nowhere this campaign is looking. Corollary 801-2 permits a lossy
        layer-dependent family to survive up to 31 consecutive interfaces; in-scope
        round counts 3-7 admit at most 7 interfaces, leaving a margin of 24
        interfaces of untouched window. Nothing in scope is excluded, and nothing
        would be excluded even if scope were widened four-fold. The bound is also
        in the wrong DIRECTION: a useful in-scope result must say lossy families
        die quickly; this says they die eventually, at 4.5x the scope ceiling.
      did_the_producer_understate_it: >-
        NO. Residual R1 states it accurately, and the manifest field
        verdicts.od1_extension carries the same limitation in the same sentence
        as the 'FOLLOWS'. There is no gap between the report's honesty and the
        manifest's.
      recorded_as: "a real outcome - a correct theorem that constrains nothing in scope. Recommend the phrase 'in-scope vacuous' be carried verbatim in any downstream record."
    F-2_interface_versus_round_conversion:
      independent_statement: >-
        Phi = ARK.MC.SR is exactly one AES round's linear tail. There is one MC
        per round, so two interfaces cannot be packed into one round: L interfaces
        costs at least L rounds under any consistent reading.
      ruling: >-
        The producer's 1 interface = 1 round is OPTIMISTIC (the most favourable
        possible conversion for the proposition), not conservative. It is flagged
        as a modelling convention in R5 rather than asserted, which is adequate.
        F-1's answer is robust to the conversion: 32 interfaces costs >= 32 rounds
        under every reading, and 32 >> 7.
    F-3_governing_constant:
      n_star_recomputed_by_me: 15
      ruling: >-
        CORRECT, not merely convenient. The governing quantity is forced by the
        derivation's structure - global statements arrive only every two
        interfaces (Lemma 2), each further pair of interfaces advances a held node
        by one G^2 step (Lemma 3), reachability is monotone because every G^2 node
        has a self-loop (Lemma 4, measured 1020/1020), and the start set is 4
        nodes not 1. That makes the constant the covering number of S0 in G^2
        maximised over all 1020 starts, which is what n* is. I could construct no
        reading in which d = 30 on G is the governing quantity. 2 + 2n* = 32
        stands. Non-tightness recorded (producer's R2); nothing shows 32 is tight.
    F-4_pre_registration_margin:
      mechanically_recorded: partially
      auditable_from_committed_bytes: false
      ruling: >-
        The ordering IS in structured manifest fields (execution_order with
        per-step timestamps, prereg_written_at, per-step
        carries_a_preregistered_prediction flags, preregistered_predictions
        separate from prediction_vs_measurement) rather than only in prose. But
        prereg_written_at is a FILE MTIME, Git stores no mtimes, and everything
        landed in one commit, so the ten-second margin is SELF-ATTESTED and I
        could not verify it. Defect V-804-2 (minor): a defect of auditability, not
        of integrity. Materially mitigated by the fact that null_2's predicted
        stall dimension 8 is PROVABLE A PRIORI - I checked the section 0.3 proof
        line by line and then measured exactly 8 with no slack.
    F-5_er7_as_a_class:
      ruling: >-
        THE CLASS IS WIDE OPEN. __name__ is one of at least four immediately
        exploitable under-test signals. Enumerated and reported in
        er6_closeout_review.md section 6: __name__ (producer's), sys.argv[0]
        (EXPLOITED BY ME - false green demonstrated), sys.argv[1..3] including the
        entire tasks JSON, __file__/temp-dir path, plus environment inheritance,
        os.getppid()//proc/<ppid>/cmdline, cwd, module search path and the writable
        runner file. The tasks-JSON channel is the strongest: a mutant can read
        exactly which tuples will be compared and disable itself on precisely
        those, defeating ANY finite task set. Named, not run.
    F-6_the_two_declined_conjectures:
      ii_fmc_true_at_r_eq_Nr:
        ran_it: true
        result: "FALSE GREEN CONFIRMED - verdict: pass on a module I independently proved wrong in k16/k24/k32_fmc1_rfull (4/4 vectors each)."
        mechanism: "build_tasks() sets final_mix_columns=False on EVERY full-round task and every reduced task has r<Nr, so the cell is empty by construction."
        severity: major   # V-804-4
      i_er8_variant_restoring_runner_bytes:
        ran_it: true
        result: UNRESOLVED
        detail: >-
          Control verdict FAIL and runner digests matched, but my probe was
          confounded: the base fault was the plain len(key)!=16 ER-6 shape, which
          the widened coverage catches regardless of any tamper, and the run FAILed
          on the no-op mutant (48/212 divergences) before the tamper could matter.
          No *.d8.py artifacts found. A matching post-run digest is consistent BOTH
          with 'the tamper never landed' and with 'the tamper landed and was
          perfectly reverted'; my run cannot distinguish them. Absence of evidence,
          not evidence of absence (AGENTS.md rule 5). Recorded as V-804-6.
        next_probe_named: "attach the restore-tamper to the (fmc=True AND r=Nr) fault, which coverage does not catch, and read the runner digest IN FLIGHT rather than post hoc."
    F-9_D_803_1_provenance_ruling:
      ruling: ACCEPT (do not overturn)
      basis: >-
        On the merits and on the amendment text, which I read directly.
        protocol-amendment-GOAL-AES-001-002 imposes the comment-block inference
        stanza on 'every DECLARED SOURCE-CODE artifact', and separately requires
        the covering manifest to carry an artifact_provenance list binding 'every
        declared source path' to its SHA-256 with a statement that the manifest's
        inference block covers it. A prose .md report is not a source-code
        artifact, so the stanza requirement does not reach it; the manifest
        requirement does, and od1_gate701c_results.json lists the report with
        kind: report, a matching digest, and covered_by_this_manifest_inference_block:
        true. The amendment's own rationale ('the stanza survives the file
        travelling alone, the digest list survives the file being edited') is
        satisfied in the direction it applies. I recomputed the report digest from
        the COMMITTED blob myself: bf238554d3b6fe4674f0290e8fb9fbb6234faba326970b897e32c582d6089df9, match.
      what_would_have_overturned_it: >-
        A digest mismatch, a missing artifact_provenance entry for the report, or
        amendment text quantified over 'declared artifacts' rather than 'declared
        source-code artifacts'. None of those obtains.
      not_a_double_standard: >-
        The Coordinator did not accept for a prose report what it would have
        refused for a source file: the source file od1_gate701c_v2.py carries BOTH
        the in-text stanza and the manifest digest binding, and I verified both.
    structural_question_on_repair_iteration:
      ruling: >-
        YES - a strong prior against treating false-green escapes as closable by
        enumeration, and my results make it FIVE escapes across THREE repairs, not
        three. V-804-4 is the ER-6 shape recurring inside the ER-6 repair on the
        adjacent axis of the same two-factor table; V-804-5 is the ER-7 shape
        recurring immediately after ER-7 was named, through a different signal.
        The reason is structural, not inductive: each repair closes one CELL of an
        open-ended product of axes or one CHANNEL of an open-ended observation set,
        and the adversary model is strictly stronger than the instrument - the
        mutant is an ordinary child process holding the harness's own inputs on its
        command line, so any distinguishable test condition can be read and evaded.
      bearing_on_DEC_20260731_011:
        H-1: >-
          MEETABLE and it looks met. It is a closed property of one function: the
          only path to detected: true is comparisons_executed > 0 AND divergences >
          0, with every error path returning detected: false and
          infrastructure_outcome: true. Verifiable by inspection over a finite code
          path; I read it and exercised it and nothing moved it.
        H-3: >-
          NOT MEETABLE BY ENUMERATION with an instrument of this design. Closing it
          requires 'no fault escapes' over an open fault space and an open channel
          set; every repair so far has silently weakened it to 'no fault escapes on
          the axes we enumerated', which the next probe falsifies.
        consequence: >-
          On my reasoning, a CERTIFIED reduced-round measurement under
          DEC-20260731-011 is NOT CURRENTLY ATTAINABLE, and the honest available
          statement is that the instrument bounds false greens on NAMED AXES ONLY.
          What would change this is replacing enumeration with closed properties:
          deriving the task set from the module's own declared parameter domain so
          that 'cell not generated' is impossible by construction, and running the
          comparison under conditions indistinguishable from ordinary use so that
          'hide when observed' has nothing to key on.
        status_of_this_view: >-
          A reasoned validator judgement supported by five measured escapes, two of
          them mine in this session. It is NOT a proof of impossibility and NOT a
          decision. The transition is the Coordinator's in TASK-20260801-805.

  # =====================================================================
  defects:
    - id: V-804-1
      check: a
      severity: major
      statement: >-
        The redesigned gate does not isolate the hypothesis the report says it
        negates. My order-5 null (01,01,01,08) - same selection rule, other proper
        subgroup, all entries nonzero, invertible, (lambda,k) graph NOT strongly
        connected (3 SCCs of size 20) - reads 65535/65535 at dimension 16,
        identical to the target, and would have fired VOID-A. Failure of strong
        connectivity does not move the reading; subfield confinement does. Report
        section 2's sentence naming strong connectivity as the negated necessary
        Step-3 ingredient invites a reading the measurement cannot support. The
        producer's own section 0.3 names the true mechanism correctly, so this is a
        labelling-and-isolation defect, not a fabrication - but it is the exact
        precondition DEC-20260731-013 placed on any future reject_scoped.
      not_a_finding_of: outcome selection (see V-804-2 and the exposure note below)
    - id: V-804-2
      check: a
      severity: minor
      statement: >-
        Pre-registration ordering is in structured manifest fields but rests on a
        file mtime and a single commit; the ten-second margin is not auditable from
        the committed bytes. Mitigated by the a-priori provability of the null_2
        prediction, which I verified.
      exposure_note: >-
        Recorded honestly because it is large: the two admissible instantiations of
        'proper subgroup' differ by the entire verdict (one discriminates, one fires
        VOID-A), and the choice between them was justified by a criterion internal
        to the same session on a timeline I could not audit. I found no evidence of
        iterating over nulls - the rule is deterministic, I re-executed it and it
        yields exactly one candidate, nulls_run = 1, nulls_discarded_on_a_reading =
        0, and the stall was proved before measurement. I believe it; I cannot
        verify it mechanically, and I say both.
    - id: V-804-3
      check: a
      severity: informational
      statement: "Proposition 801-1 is in-scope vacuous. Not a producer defect - stated as R1 - but it is the batch's operative outcome."
    - id: V-804-4
      check: b
      severity: major
      statement: >-
        Demonstrated false green: a fault confined to (fmc=True AND r=Nr) returns
        verdict: pass on the repaired control, on a module I independently proved
        wrong in three cells. The cell is empty by construction in build_tasks().
        ER-6's shape on the adjacent axis, live in the committed instrument.
        Predicted and disclosed by the producer; not repaired.
    - id: V-804-5
      check: b
      severity: major
      statement: >-
        Demonstrated false green: an under-test cloak keyed on sys.argv[0] rather
        than __name__ returns verdict: pass. ER-7 is a class, not an instance.
    - id: V-804-6
      check: b
      severity: minor
      statement: "The ER-8-restore conjecture is unresolved, not refuted. Confounded probe; next probe named."
    - id: V-804-7
      check: b
      severity: informational
      statement: "F-7's scoping audit is incomplete in my session - no line-by-line audit of every BATCH-002 mutant source was completed. No contrary evidence found."
    - id: V-804-8
      check: b
      severity: informational
      statement: >-
        Single-vector fault confirmation is unsafe here: a structured key/plaintext
        can whiten to a constant state, on which MixColumns is the identity, hiding
        a real fault entirely. I hit this myself and record it as standing practice.

