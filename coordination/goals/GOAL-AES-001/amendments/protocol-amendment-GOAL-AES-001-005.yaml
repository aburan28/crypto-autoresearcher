  reversibility: >-
    PARTLY REVERSIBLE, STATED HONESTLY BY PART. Part A is reversible on paper —
    restoring 20000 immediately re-fires the pause condition and moves the goal to
    `paused` — but any seconds spent under it cannot be unspent, so it is reversible
    in rule and not in consumption. Part B is reversible only prospectively: stamps
    already committed remain committed and remain the auditable record. Part C is not
    meaningfully reversible, because reverting to a clause the validator demonstrated
    generates unverifiable digests would reinstate a known defect.

