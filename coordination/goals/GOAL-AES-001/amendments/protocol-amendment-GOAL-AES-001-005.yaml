  limitations:
    - >-
      THE MEASURED FIGURES THIS SIZING RESTS ON ARE REPORTED, NOT INSTRUMENTED, and
      Part B does not change that for anything already spent. Three of the eight
      BATCH-005 sizing lines — snapshot archive, ledger archive, coordination act —
      rest on declarations no clock ever tested. A later session cannot re-derive
      any BATCH-001..004 duration from this tree.
    - >-
      THE HISTORICAL COORDINATION UNDER-COUNT IS UNQUANTIFIED AND UNRECOVERABLE, so
      the 19458 s "charged to date" leg of the arithmetic is an UNDERSTATEMENT in the
      direction that favours continuing. It is fixed prospectively and cannot be
      fixed retrospectively without fabricating durations.
    - >-
      COMMITTED UTC STAMPS ARE PRODUCER ATTESTATION, NOT A MECHANISM. The V-804-2
      lesson applies unchanged: a producer-written timestamp is a string the producer
      wrote, and nothing in the committed bytes proves the clock it names. Part B
      makes the timeline READABLE and CONSISTENT, not PROVEN.
    - >-
      34500 IS A SIZING, NOT A PREDICTION. The campaign has no calibrated basis for
      predicting measured cost, and this amendment does not create one. Sizing at
      per-role maxima reduces the chance of a fourth budget act; it does not
      eliminate it.
    - >-
      THIS AMENDMENT ASSERTS NOTHING ABOUT AES, supports no claim at any round count,
      creates no hypothesis, promotes no knowledge, satisfies no promotion gate, and
      records no closure attestation.
    - >-
      CROSS-MODEL INDEPENDENCE REMAINS UNAVAILABLE campaign-wide under
      inference-amendment 0137a051, and `model_verified` remains false throughout
      this campaign. This amendment does not address either.

  open_item: >-
