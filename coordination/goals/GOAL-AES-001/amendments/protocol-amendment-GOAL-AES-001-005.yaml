    task runs — required, because Parts B and C are cited as completion gates in the
    BATCH-005 cards, and a gate uncommitted when the card is issued is exactly the
    retroactive enforcement this program refuses. The branch must be pushed and the
    PR opened or refreshed naming DEC-20260731-018 and this amendment.
