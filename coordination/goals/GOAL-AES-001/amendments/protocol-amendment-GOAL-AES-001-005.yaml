protocol_amendment:
  id: protocol-amendment-GOAL-AES-001-005
  # Filed under the goal, not under experiments/<EXP-ID>/amendments/, for the same
  # reason as amendments 001-004: the protocol being amended is a CAMPAIGN-level
  # constraint on a persistent goal, and GOAL-AES-001 has no EXP-* record.
  experiment_id: null
  goal_id: GOAL-AES-001
  scope_of_amendment: >-
    campaign_budget_ceiling (Part A: total_wall_clock_seconds 20000 -> 34500 on the
    unchanged measured basis, with maximum_batches UNCHANGED at 6 and now ruled the
    BINDING constraint) AND campaign_clock_convention (Part B: naming the binding
    clock, replacing the unevaluable producer stop with an AUDITABLE PROXY DUTY,
    and settling the D-811-3 conflict-resolution rule) AND
    artifact_provenance_gate_errata (Part C: the two Part-B drafting errata owed
    from D-808-1 and D-808-2 / D-809-7)
  version_from: 5
  version_to: 6
  approved_by: coordinator
  approved_at: '2026-08-01'
  decision_ref: DEC-20260731-018

  # ===================================================================
  # AUTHORITY. Recorded so the approval is auditable rather than assumed.
  # ===================================================================
  approval_basis:
    authority: >-
      THE USER, relayed by the dispatching session. This is not a Coordinator
      convenience, not a standing instruction read broadly, and not an agent's
      approval — no message from any agent is ever the user's consent. The
      dispatching session put the position to the user and reports the reply as
      the single word "Continue".
    what_was_disclosed_to_obtain_it: >-
      STATED IN FULL, because an approval is only auditable if what was put is on
      the record. The user was told, plainly, that CONTINUING MEANS RAISING THE
      CEILING A SECOND TIME (the THIRD budget act on one campaign, after the
      10800 -> 20000 raise in amendment 001 and the declared -> measured re-basing
      in amendment 003) on a campaign which, FOUR BATCHES IN, HAS PRODUCED NO
      CLAIM ABOUT AES AT ANY ROUND COUNT and has spent ZERO cryptanalytic compute
      on AES itself; and that against that, the campaign has produced (i) A REAL
      BOUND AT ONE INTERFACE — Proposition 806-1, B >= q = 256 for the F-linear
      round-independent subclass, which an independent session re-derived lemma by
      lemma and reproduced exhaustively in two analogues, and which is NOT a cost
      inequality and is scoped to ONE super-box interface; (ii) TWO KNOWLEDGE
      ENTRIES, KN-FIND-017 and KN-FIND-018; and (iii) AN OPEN CANDIDATE NOW
      DEMONSTRABLY WRONGLY DISCARDED — CAND-806-A's bounded-index-subgroup
      residual, killed at an interface constant of 30 under a rule its own sibling
      pre-screen says gives 1 (RT-8), an error traceable to this Coordinator's own
      prior guidance (D-811-2).
    what_the_reply_authorizes_and_what_it_does_not: >-
      IT AUTHORIZES THE RAISE AND THE CONTINUATION, so the declared pause
      condition does not fire. IT AUTHORIZES NOTHING ELSE. It is not a widening of
      research scope, claim tier, authority, review requirement, completion
      criterion or pause condition; it does not license an overrun, a weaker
      review, an unattested closure, or any claim about AES. maximum_batches is
      NOT raised and is not put to the user as raisable here.
    prior_precedent: >-
      Amendment 001 was approved on a dispatcher-relayed user ruling
      (DEC-20260731-012). Amendment 003 was approved on a DISPATCHER ruling taken
      under a standing instruction and recorded as REVERSIBLE (DEC-20260731-015).
      THIS ONE IS STRONGER THAN BOTH: it rests on a specific disclosure and a
      specific reply, and it is recorded as such rather than inferred from a
      standing instruction.

  # ===================================================================
  # PART A. THE CEILING
  # ===================================================================
  part_a_ceiling:
    change: >-
      campaign_budget.total_wall_clock_seconds 20000 -> 34500, on the UNCHANGED
      measured basis of amendment 003 (accounting_basis:
      measured_wall_clock_of_completed_tasks). maximum_batches STAYS 6.
      max_concurrent STAYS 3.

    the_prior_justification_is_exhausted_and_is_recorded_as_exhausted: >-
      DECISIVE CONTEXT, AND IT IS STATED FIRST BECAUSE IT IS THE THING A RED TEAM
      SHOULD ATTACK. Both prior budget acts rested on ONE fact: declarations ran
      far above measured cost, so the campaign was being exhausted by conservative
      ceilings rather than by spent work. THAT FACT IS GONE. The over-declaration
      series is 2.51x -> 1.55x -> 1.28x -> ~1.01x and HAS FLATTENED TO PARITY at
      the batch level, with TWO INDIVIDUAL PRODUCER TASKS OVER their declarations
      for the first time. Declared and measured are now the same thing, the cushion
      is gone, and no ratio may be used as an expectation again. THIS AMENDMENT MAY
      NOT BORROW EITHER PRIOR RATIONALE. It is justified bottom-up on the merits of
      the remaining work alone.

    the_number_goes_up_because_the_unit_changed_not_because_the_scope_did: >-
      THE HONEST FRAMING OF WHY 34500 IS NOT AS LARGE A CONCESSION AS IT LOOKS, and
      it is offered as an argument to be attacked, not as a defence. When the 20000
      figure was set, declarations ran at ~2.5x measured, so 20000 DECLARED seconds
      bought roughly 8000 MEASURED seconds of work. At parity, the same quantity of
      real work now requires a numerically larger ceiling to express. The scope
      bought by this amendment is FIXED INDEPENDENTLY by maximum_batches, which is
      NOT raised. WHAT THIS ARGUMENT DOES NOT EXCUSE: it does not make the raise
      free, it does not make it the last one by construction, and it does not
      answer the objection that a campaign four batches in with no claim about AES
      is a campaign whose budget should be questioned rather than extended. That
      objection is answered on the merits in DEC-20260731-018 and by the user
      authorization above, not here.

    sizing_basis: >-
      BOTTOM-UP FROM MEASURED PER-ROLE ACTUALS, AT OR NEAR THE OBSERVED MAXIMUM FOR
      EACH ROLE, NOT AT THE MEAN. Sizing at maxima IS the contingency; NO separate
      cushion is added on top, and none may be inferred. The campaign has NO
      calibrated basis for predicting measured cost (amendment 003 limitations, the
      TASK-20260801-808 receipt, DEC-20260731-017 budget_accounting), so a
      point-estimate sizing would guarantee a fourth budget act and a cushioned
      sizing would be the convenience this amendment is forbidden to be. Maxima with
      no cushion is the defensible middle and it is stated as a CHOICE.
    per_role_reference_actuals_measured_session_elapsed:
      executor_producer: >-
        792 (TASK-801), 892 (TASK-802), 1609 (TASK-806), 1510 (TASK-807).
        SIZED AT 1600.
      snapshot_archive: >-
        378 (TASK-803) measured; 350 (TASK-808) charged at declaration, never
        measured. SIZED AT 500, above both, because the only measured datum
        predates the Part B provenance gate that now applies at this archive.
      independent_validation: >-
        1046 (TASK-804), 1370 (TASK-809, the charged figure of three).
        SIZED AT 1400.
      red_team: >-
        668 (TASK-810), the campaign's ONLY red-team datum, well under its declared
        1000. SIZED AT 1000, NOT AT 668: the red team itself warns that ONE TASK IS
        NOT A DISTRIBUTION and that a pass which found a live counter-witness early
        is no evidence the next will be cheap. Sizing to the single low observation
        would be exactly the error this amendment exists to stop making.
      ledger_archive: >-
        800 (TASK-805) and 800 (TASK-811), BOTH charged at declaration and NEITHER
        measured, because a record authored inside a task cannot state that task's
        own duration. SIZED AT 900, above the declaration, since the figure has
        never been tested against measurement.
      coordination_act: >-
        NEVER MEASURED AND NEVER CHARGED. See known_undercount_now_closed. SIZED AT
        900 for an amendment-and-decision act and 700 for a queue-drafting act,
        by analogy with the ledger-archive role, which is the closest measured
        Coordinator work.
    known_undercount_now_closed: >-
      A REAL DEFECT IN THE CAMPAIGN'S ACCOUNTING, FOUND WHILE SIZING THIS
      AMENDMENT AND FIXED HERE RATHER THAN LEFT. charged_to_date has only ever
      counted QUEUE TASKS. Coordination acts performed outside the queue — drafting
      a dispatch queue and its handoffs, authoring an amendment, taking a decision —
      consume real session elapsed and have been charged at ZERO for four batches.
      That is the same species of error amendment 003 corrected in the opposite
      direction, and it means the true cost of BATCH-001..004 EXCEEDS 19458.
      PROSPECTIVE FIX, from BATCH-005: EVERY COORDINATION ACT OF THIS CAMPAIGN IS
      DISPATCHED AS A QUEUE TASK with a declared budget and is charged at measured
      session elapsed like any other. NOT RETROACTIVE: no prior batch is re-charged
      and no committed figure is edited, because re-charging four batches on
      durations nobody recorded would be fabrication (AGENTS.md rule 9). The
      historical under-count is recorded as UNQUANTIFIED AND UNRECOVERABLE.
    itemized_sizing:
      batch_005:
        this_amendment_and_decision_act: 900
        queue_and_handoff_drafting_act: 700
        producer_1: 1600
        producer_2: 1600
        snapshot_archive: 500
        independent_validation: 1400
        red_team: 1000
        ledger_archive: 900
        subtotal: 8600
        note: >-
          TWO producers, because BATCH-005 must carry BOTH the exponent-relevant
          candidate and the contract-mandated heuristic validation and cannot defer
          either (see DEC-20260731-018 next_actions). They are dispatched
          CONCURRENTLY under the unchanged max_concurrent of 3.
      batch_006:
        queue_and_handoff_drafting_act: 600
        producer: 1600
        snapshot_archive: 500
        independent_validation: 1400
        red_team: 1000
        ledger_archive_and_terminal_goal_record: 1100
        subtotal: 6200
        note: >-
          ONE producer. BATCH-006 is the LAST batch under the unchanged
          maximum_batches of 6 and is sized as a CONSOLIDATION AND TERMINAL-RECORD
          batch: validate or repair whatever BATCH-005 produces, promote KN-FIND-019
          if and only if it is then warranted, and write the terminal goal record.
          The ledger line is 1100 rather than 900 because it also carries the
          terminal goal checkpoint.
      arithmetic: >-
        19458 charged + 8600 (BATCH-005) + 6200 (BATCH-006) = 34258. THE CEILING IS
        SET AT 34500. The 242 s difference is ROUNDING TO A REPORTABLE FIGURE AND IS
        NOT A CUSHION; it is smaller than a single task of any role and buys no
        work. It specifically does NOT cover the historical coordination under-count
        above, which is unquantified and is not covered by anything here.

    standing_limit: >-
      THE CEILING IS REAL AND STILL BINDS, AND THIS IS THE THIRD BUDGET ACT ON ONE
      CAMPAIGN. 34500 s of MEASURED wall clock across at most 6 batches, of which 4
      are spent. IF MEASURED CONSUMPTION APPROACHES 34500, A FURTHER AMENDMENT IS
      REQUIRED; reaching it without one triggers the declared pause condition ("the
      six-batch campaign budget is exhausted without an admissible next mechanism")
      and the goal moves to `paused` — never to `completed`, which is unreachable in
      this harness under inference-amendment 0137a051. This amendment does not
      authorize a silent overrun, and an overrun is not a research result
      (AGENTS.md rule 5).

    the_binding_constraint_has_switched_back_and_it_is_now_the_batch_count: >-
      RULED EXPLICITLY, BECAUSE IT SHAPES WHAT BATCH-005 AND BATCH-006 SHOULD
      ATTEMPT AND IS THEREFORE NOT AN ACCOUNTING FOOTNOTE. Before this amendment
      SECONDS BOUND FIRST — 542 s remained against two batches, and DEC-20260731-017
      recorded that correctly. AFTER THIS AMENDMENT, BATCHES BIND FIRST AND SECONDS
      DO NOT. maximum_batches STAYS 6 and is NOT put to the user: BATCH-005 and
      BATCH-006 are the LAST TWO, and 14800 s is a sufficient allowance for them at
      measured maxima. CONSEQUENCE, BINDING ON BOTH QUEUES: BATCH-005 IS THE LAST
      BATCH THAT MAY OPEN NEW RESEARCH QUESTIONS. Any exponent-relevant object not
      attempted in BATCH-005 will, on this campaign, not be attempted at all — it
      will be named as open and unattempted, which is a legitimate outcome, and it
      will NEVER be recorded as tried, screened, or negative (AGENTS.md rules 5 and
      8). BATCH-006 is reserved for consolidation and the terminal record.
      THE HONEST COROLLARY: raising seconds while holding batches fixed does not buy
      the campaign a result. It buys it the ability to finish the two batches it was
      already permitted, at the cost the work actually has.

    what_a_red_team_should_attack_here: >-
      NAMED BY THIS COORDINATOR AGAINST ITSELF, since a rationale that names no
      attack surface is not a rationale. (1) THE SIZING IS FITTED TO A PLAN THAT
      THIS COORDINATOR ALSO WROTE: 8600 is what two producers plus a full review
      chain costs BECAUSE THIS AMENDMENT CHOSE TWO PRODUCERS. A reviewer who thinks
      BATCH-005 should carry one producer should attack the 1600 line, not the
      total. (2) THE SNAPSHOT, LEDGER AND COORDINATION LINES REST ON DECLARATIONS
      THAT WERE NEVER MEASURED — three of the eight BATCH-005 lines are sized
      against numbers no clock ever produced, which is the same weakness amendment
      003's limitations recorded. Part B fixes this prospectively but cannot fix it
      retrospectively. (3) A 72.5 % RAISE ON A CAMPAIGN WITH NO CLAIM ABOUT AES IS
      ON ITS FACE A CAMPAIGN SIZING ITS BUDGET TO ITS AMBITION. The answer is that
      maximum_batches is unchanged, so the scope is fixed by a constraint this
      amendment does not touch — but that answer is only as good as the 6, and if a
      later session wishes to raise the 6 it must do so on its own rationale and
      not on this one. (4) THE HISTORICAL COORDINATION UNDER-COUNT MEANS 19458 IS
      ITSELF AN UNDERSTATEMENT, so the "charged to date" leg of the arithmetic is
      soft in the direction that favours continuing.

  # ===================================================================
  # PART B. THE CLOCK CONVENTION
  # ===================================================================
  part_b_clock_convention:
    why_here: >-
      REQUIRED BEFORE BATCH-005 CAN BE HELD TO A BUDGET AT ALL, per the
      TASK-20260801-808 snapshot receipt's ruling and DEC-20260731-017's next
      action (A). THE DIAGNOSIS, ADOPTED IN FULL: amendment 003 charges a
      DISPATCHER-OBSERVED quantity while imposing the halt duty on a PRODUCER WHO
      CANNOT OBSERVE IT, so the stop condition is UNEVALUABLE. TASK-20260801-806
      measured COMPUTE (67 s of 1600) and reported NO overrun; TASK-20260801-807
      measured SESSION ELAPSED (~1510 of 1200) and SELF-REPORTED one as DEV-807-4
      with the dropped work named. NEITHER MISREAD ITS CARD, BECAUSE THE CARD DOES
      NOT SAY. That is one instrument with no units, it is a COORDINATOR-SIDE
      drafting fault, and neither producer is charged with a defect — a ruling this
      amendment re-affirms and does not reopen.
    the_recommendation_is_ENACTED_and_here_is_the_ruling: >-
      DEC-20260731-017's recommendation is ADOPTED SUBSTANTIALLY AS RECOMMENDED —
      charge session elapsed, replace the unevaluable producer stop with an
      AUDITABLE PROXY DUTY of committed UTC stamps — WITH TWO ADDITIONS THIS
      COORDINATOR JUDGES NECESSARY AND WHICH THE RECOMMENDATION DID NOT CONTAIN:
      C3 makes explicit that discharging the proxy duty is FULL COMPLIANCE even
      when the charged figure exceeds the declaration, without which the producer
      would still be exposed to a clock it cannot see; and C5 supplies the
      conflict-resolution rule the recommendation did not, WITH A MECHANISM for why
      producer stamps systematically understate rather than merely a preference for
      the larger number. THE EVIDENCE THAT THE PROXY DUTY WORKS IS ALREADY ON THE
      RECORD AND WAS PRODUCED VOLUNTARILY: TASK-20260801-809 stamped UTC at start
      and at section boundaries under a named session-elapsed convention, and
      TASK-20260801-810 committed a full stamp list with an explicit
      binding_stop_utc computed from start + declared. BOTH CAME IN WITHIN BUDGET.
      The duty is therefore not speculative; it is the codification of what two
      independent sessions did unprompted when the rule was unclear.

    C1_the_charged_clock: >-
      SESSION ELAPSED. Consumption charged against the campaign ceiling is the
      task's WALL-CLOCK SESSION ELAPSED — from the task's first act to its terminal
      receipt, AUTHORING INCLUSIVE — as observed by the dispatching session. This
      is what the campaign actually consumes and it is what amendment 003 was
      already charging in practice; what changes is that it is now NAMED. COMPUTE
      SECONDS ARE NOT THE CHARGED CLOCK and never were.
    C2_the_stop_condition_clock_and_the_auditable_proxy_duty: >-
      THE PRODUCER'S OWN COMMITTED UTC STAMPS. Every dispatched task of this
      campaign, in every role including Coordinator tasks:
      (i) AS ITS FIRST ACT, before any research work, writes a stamp record in its
      own task directory carrying `start_utc`, `start_epoch`,
      `declared_wall_clock_seconds`, and `binding_stop_utc` COMPUTED as start plus
      declared;
      (ii) writes a further stamp at EACH MAJOR SECTION BOUNDARY, each carrying
      `utc`, `elapsed_s` and a `marker` naming what was completed;
      (iii) HALTS at `binding_stop_utc`, records `halted_on_budget` truthfully, and
      NAMES the work dropped as a consequence;
      (iv) COMMITS those stamps as a declared artifact of the task, so a reviewer
      reads the timeline from committed bytes rather than from a relayed
      observation. The TASK-20260801-810 `budget` block is the reference
      implementation and is named as the model to copy.
      A HALT AT binding_stop_utc IS INFRASTRUCTURE SIGNAL, NEVER A NEGATIVE
      MATHEMATICAL RESULT (AGENTS.md rule 5), and dropped work is SCOPE, never an
      answer (rule 8).
    C3_what_a_producer_does_when_it_cannot_observe_the_charged_clock: >-
      NOTHING. IT IS NOT REQUIRED TO, AND THIS IS THE CLAUSE THAT CLOSES THE FAULT.
      A producer's budget duty is discharged ENTIRELY by C2. A task that stamps
      honestly and halts at its own `binding_stop_utc` HAS COMPLIED IN FULL, even
      if the dispatcher-observed session elapsed later exceeds its declaration.
      Any residual difference between the producer's stamped elapsed and the
      charged figure is a CAMPAIGN-SIDE ACCOUNTING FACT — it is charged under C1
      and C5, and it is NEVER a producer defect and never a returned task.
      Correspondingly, a producer may NOT offer compute seconds as evidence of
      budget compliance: TASK-20260801-806's posture (`compute_wall_clock_seconds_
      used: 67`, `budget_reached: false`) was COMPLIANT under the old rule, is
      NON-COMPLIANT under this one, and that is PROSPECTIVE ONLY — TASK-806 is not
      re-graded, not re-charged and not defect-charged.
    C4_declarations_are_calibrated_against_authoring_inclusive_elapsed: >-
      BINDING ON EVERY FUTURE DECLARATION. Both BATCH-004 overruns were AUTHORING,
      not compute: 67 s and ~254 s of compute against 1609 s and 1510 s elapsed.
      Declarations are therefore calibrated against AUTHORING-INCLUSIVE session
      elapsed, and the compute component is REPORTED SEPARATELY in its own field so
      the two are never again conflated. The per-role reference actuals in Part A
      are authoring-dominated numbers and are to be read as such.
    C5_the_D_811_3_conflict_resolution_rule:
      the_defect_being_settled: >-
        D-811-3: THREE conflicting durations exist on the record for
        TASK-20260801-809 — 1336 s and 1370 s, both dispatcher-reported, and
        ~1180 s self-reported in validation_report.yaml at its final write under a
        named session-elapsed convention — and NONE is re-derivable from the tree.
        DEC-20260731-017 charged the highest and recorded the spread as a defect
        rather than resolving it silently. It is resolved here.
      the_authoritative_figure: >-
        THE CHARGED FIGURE IS THE LARGEST SESSION-ELAPSED FIGURE ON THE RECORD FOR
        THAT TASK, FROM ANY SOURCE. Every reported figure is preserved in the task's
        record; exactly one is marked `charged`, and the others are marked
        `on_record_not_charged` with their source named. NO SPREAD IS EVER RESOLVED
        SILENTLY, and no figure is ever deleted to remove a conflict.
      why_the_largest_and_it_is_not_merely_conservatism: >-
        TWO GROUNDS, THE SECOND OF WHICH IS A MECHANISM. (1) The TASK-20260801-808
        ruling, re-affirmed: the campaign does not get to under-charge itself by
        using the smaller of two clocks. (2) A PRODUCER STAMP SYSTEMATICALLY
        UNDERSTATES, BY CONSTRUCTION. Its last stamp is at its final write, and a
        task's tail — finalizing artifacts, the terminal receipt, the handback —
        falls after that stamp and inside the session the campaign is charged for.
        TASK-20260801-809's ~1180 self-reported against 1370 dispatcher-observed is
        exactly that gap, and it is EXPLAINED rather than treated as one party
        being wrong. The producer stamp is therefore the AUDITABLE floor and the
        dispatcher observation the CHARGED figure, and where two dispatcher figures
        disagree, as 1336 and 1370 do, the larger is charged.
      order_of_precedence_for_the_record_as_opposed_to_the_charge: >-
        For establishing WHAT HAPPENED — the timeline, the halt, the dropped work —
        the PRODUCER'S COMMITTED STAMPS GOVERN, because they are readable from
        committed bytes and a dispatcher observation is not. For establishing WHAT
        IS CHARGED, C1 and the largest-figure rule govern. These are different
        questions and this amendment keeps them apart deliberately.
      retroactivity: >-
        NOT RETROACTIVE. Applied to TASK-20260801-809 this rule returns 1370, which
        is EXACTLY what DEC-20260731-017 already charged, so nothing is re-charged
        and no committed figure changes. D-811-3 IS CLOSED BY THE RULE PRODUCING THE
        SAME ANSWER, which is recorded as a fact rather than presented as a
        vindication.
    C6_the_unmeasured_work_rule_is_retained_and_tightened: >-
      RETAINED UNCHANGED IN SUBSTANCE: a completed task whose duration was not
      reported is charged at its DECLARED budget until a measurement is recorded,
      and is never charged at zero. TIGHTENED PROSPECTIVELY: under C2 every task
      now commits its own stamps, so an unmeasured task should not recur; if one
      does, it is charged at declaration AND a defect is recorded against the
      campaign's instrumentation, not against the producer.
    what_part_b_does_not_do: >-
      It does NOT give any task additional running time — declared per-task budgets
      remain BINDING STOP CONDITIONS, unchanged from amendment 003. It does NOT
      install an instrumented timer in this repository; committed UTC stamps are a
      producer-written record and, like the pre-screen freeze timestamps before
      them, are PRODUCER ATTESTATION rather than a mechanism (the V-804-2 lesson
      applies unchanged and is not smoothed over here). It does NOT make any
      historical figure re-derivable from the tree. It does NOT re-grade, re-charge
      or defect-charge any BATCH-001..004 task.

  # ===================================================================
  # PART C. THE TWO PART-B ERRATA OWED FROM AMENDMENT 004
  # ===================================================================
  part_c_provenance_gate_errata:
    why_here: >-
      DEC-20260731-017's next action (C) assigns both errata to THIS amendment, and
      they belong here on the merits: both are Coordinator-side DRAFTING faults in
      protocol-amendment-GOAL-AES-001-004 Part B, both were found at Part B's FIRST
      exercise at the TASK-20260801-808 snapshot archive, and both bind on the
      BATCH-005 producers and snapshot archive. Deferring them would mean issuing
      BATCH-005 cards under a clause already known to be unsatisfiable as written.
    erratum_1_D_808_1_manifest_clause_quantifier:
      defect: >-
        Amendment 004 Part B's MACHINE_READABLE_MANIFEST clause QUANTIFIES OVER THE
        CLASS: it requires that a manifest carry an artifact_provenance list
        covering EVERY declared artifact of its task, which — read literally, and
        applied to every manifest of a task — demands that each manifest carry the
        digest of every other, including manifests written after it. D-808-1 is
        UPHELD, not overturned, on the TASK-20260801-809 validator's independent and
        DECISIVE EMPIRICAL ground that the literal reading DEMONSTRABLY GENERATES
        DIGESTS NO PARTY CAN VERIFY — an argument that was not available to this
        Coordinator at snapshot time.
      restatement_in_force_from_BATCH_005: >-
        "AT LEAST ONE machine-readable manifest per task, DESIGNATED THE COVERING
        MANIFEST, carries an `artifact_provenance` list covering EVERY DECLARED
        ARTIFACT OF THE TASK; EVERY OTHER MANIFEST OF THE TASK MUST APPEAR AS AN
        ENTRY IN IT." The covering manifest is named explicitly by the task's card
        and by the manifest itself. Entry fields are unchanged from amendment 004:
        `path`, `kind`, `sha256`, `comment_block_inference_stanza` (boolean, stated
        honestly including when false), `covered_by_this_manifest_inference_block`
        (boolean). A self-referential digest remains impossible and is recorded as
        SELF, exactly as the TASK-20260801-808 receipt already did.
    erratum_2_D_808_2_and_D_809_7_class_name_vocabulary:
      defect: >-
        The `kind` vocabulary was never stated as closed or case-normalised, so
        `machine_readable_prescreen` was written by a producer in good faith and is
        not one of Part B's four class names. The Coordinator's asymmetric audit
        note on this point is also recorded as a defect against itself.
      ruling_in_force_from_BATCH_005: >-
        THE VOCABULARY IS CLOSED AND CASE-INSENSITIVE. The four class names are
        SOURCE_CODE, MACHINE_READABLE_MANIFEST, PROSE_REPORT, and
        LEDGER_AND_COORDINATION_RECORD, matched case-insensitively and
        ignoring underscore/hyphen/space differences. NO FIFTH CLASS MAY BE INVENTED
        BY A PRODUCER OR BY AN ARCHIVAL TASK; a value outside the vocabulary is a
        DEFECT TO REPORT, never a class to create, and the artifact is classified
        into one of the four by what it is. EXPLICIT ALIAS RULE, supplied so the
        exact case that generated this erratum resolves without a further ruling:
        any `kind` naming a machine-readable structured-data artifact — including
        `machine_readable_prescreen`, `prescreen`, `results_json`, `receipt` —
        RESOLVES TO MACHINE_READABLE_MANIFEST. A prose `.md` deliverable resolves to
        PROSE_REPORT; executable text resolves to SOURCE_CODE; anything under
        `ledger/**` or `coordination/**` authored by the Coordinator resolves to
        LEDGER_AND_COORDINATION_RECORD and carries no obligation under this gate.
    retroactivity: >-
      PROSPECTIVE FROM BATCH-005 AND NEVER RETROACTIVE. NO BATCH-004 artifact is
      failed, re-scored, re-graded or withdrawn under Part C. The TASK-20260801-808
      acceptance STANDS in full, including its acceptance of both prose reports
      under the manifest-pointer form and its recording of D-808-1 and D-808-2 as
      referred drafting items rather than as producer defects. Applying a corrected
      clause backwards to fail producers against a gate they were never given is
      exactly what amendment 002's retroactive_note refused and what this amendment
      refuses again.

  unchanged:
