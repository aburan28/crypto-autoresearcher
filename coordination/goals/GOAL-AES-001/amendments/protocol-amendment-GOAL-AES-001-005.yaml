  what_this_amendment_is_not:
    - >-
      It is NOT a widening of research scope, claim tier, authority, review
      requirement, completion criterion or pause condition. It changes NOTHING about
      what would count as a result.
    - >-
      It is NOT a raise of maximum_batches. The campaign gets more seconds for the
      two batches it already had; it does not get more batches, and after BATCH-006
      it has none.
    - >-
      It is NOT a licence for larger declarations. Part B C4 tightens the calibration
      duty rather than relaxing it, and per-task budgets remain binding stop
      conditions.
    - >-
      It is NOT a re-scoping of promotion gate (4), and no promotion or transition
      toward `supported` becomes available under it.
    - >-
      It is NOT retroactive in any part. No BATCH-001..004 task is re-graded,
      re-charged, defect-charged or withdrawn, and no committed record is edited.
    - >-
      It asserts NOTHING ABOUT AES. It concerns a resource counter, a clock, and an
      artifact-provenance vocabulary. It supports no claim at any round count and
      changes the strength or scope of no evidence.

  confirmatory_status: preserved
  confirmatory_status_note: >-
    PRESERVED, AND THE CHARGE IS ANSWERED RATHER THAN ASSERTED AWAY. A budget raise
    taken AFTER a batch's outcomes are known is, on its face, a success criterion
    changed after observing an outcome. It is not one, on three checkable grounds.
    (i) It changes NO pre-registered prediction, gate, falsification criterion,
    completion criterion or pause condition — the pause condition stands verbatim and
    will fire against the new figure on the same terms. (ii) The raise was REQUIRED
    BY THE CAMPAIGN'S OWN PRIOR TEXT at exactly this point: amendment 003's
    `standing_limit`, written before BATCH-003 ran, states that a further amendment
    is required when measured consumption approaches the ceiling. This is that
    amendment, not an improvisation. (iii) It admits NO result: no claim, no gate, no
    promotion and no transition becomes available under it, and the batch it funds
    has not been designed to a conclusion. WHAT IS HONESTLY ADVERSE AND IS NOT
    DEFENDED: the DECISION to continue rather than pause was unavoidably taken with
    BATCH-004's outcomes in view, and this record does not pretend otherwise — it
    records what was disclosed to the user and what the user replied, so the judgement
    can be attacked on its merits rather than on its provenance.

  affected_runs: []
  affected_runs_note: >-
    NONE. No run, receipt, evidence record, decision, queue, knowledge entry or goal
    checkpoint is altered, re-scored or reinterpreted by this amendment. BATCH-001
    through BATCH-004 are closed and untouched. The only edit made alongside this
    record is the GOAL-AES-001 checkpoint, which registers this amendment, carries
