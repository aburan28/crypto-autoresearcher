protocol_amendment:
  id: protocol-amendment-GOAL-AES-001-006
  experiment_id: null
  goal_id: GOAL-AES-001
  scope_of_amendment: campaign_budget_ceiling
  change: campaign_budget.maximum_batches 6 -> 7. NO OTHER FIELD MOVES.
  version_from: 6
  version_to: 7
  approved_by: coordinator
  approved_at: '2026-08-12'
  decision_ref: DEC-20260812-f30c6e

  approval_basis:
    authority: >-
      THE USER, via AskUserQuestion, directly to the Coordinator this session
      (2026-08-12). This is a single explicit, program-wide instruction to
      raise campaign_budget.maximum_batches by exactly one batch on every
      currently active research goal with a finite (non-null) cap, applied
      identically across the program rather than negotiated goal by goal.
    what_was_authorized: >-
      EXACTLY ONE THING: campaign_budget.maximum_batches 6 -> 7 on
      GOAL-AES-001. Nothing about claim_tier_ceiling, completion_criteria,
      pause_conditions, objective_and_scope, authority_and_review_requirements,
      total_wall_clock_seconds (34500, unchanged), max_concurrent (3,
      unchanged), or any hypothesis status is authorized or touched by this
      instruction.
    prior_precedent: >-
      This is the SIXTH budget act on this campaign, following
      protocol-amendment-GOAL-AES-001-001 (total_wall_clock_seconds
      10800 -> 20000), -003 (accounting basis re-based to measured), -004
      (provenance gate, not a budget field), and -005 (total_wall_clock_seconds
      20000 -> 34500). Unlike 001, 003 and 005, this act moves maximum_batches
      -- previously held fixed and explicitly NOT raised across every prior
      amendment ("maximum_batches STAYS 6 ... and is NOT put to the user as
      raisable") -- for the first time on this campaign, on the user's own
      explicit direction rather than a Coordinator proposal.

  unchanged:
    total_wall_clock_seconds: 34500
    max_concurrent: 3
    accounting_basis: measured_wall_clock_of_completed_tasks
    declared_budgets_as_binding_stop_conditions: unchanged
    claim_tier_ceiling: >-
      UNCHANGED. toy / reduced-round only. No result from this goal may be
      stated as a claim about full-round AES or deployed AES security.
    completion_criteria: unchanged
    pause_conditions: >-
      UNCHANGED IN TEXT. The batch-count clause of the pause condition now
      binds at 7 rather than 6, and reaching it without a further amendment
      still fires the pause condition on the same terms.
    objective_and_scope: unchanged
    authority_and_review_requirements: unchanged
    provenance_gate: unchanged, in force per amendments 002/004/005 Part C
    goal_closure_quorum: >-
      UNCHANGED AND UNAFFECTED. `completed` remains unreachable for
      GOAL-AES-001 under inference-amendment 0137a051; this amendment records
      no attestation.
    standing_research_constraints: unchanged from amendment 005's part_a

  what_this_amendment_is_not:
    - >-
      It is NOT a widening of research scope, claim tier, authority, review
      requirement, completion criterion or pause condition.
    - >-
      It does NOT open a seventh batch or authorize any run; the campaign's
      next batch remains a separate Coordinator dispatch decision under the
      goal's existing next_action and review chain.
    - >-
      It does NOT raise total_wall_clock_seconds or max_concurrent.
    - >-
      It asserts NOTHING about AES at any round count and changes the
      strength or scope of no evidence.

  confirmatory_status: preserved
  affected_runs: []
  affected_runs_note: >-
    NONE. No run, receipt, evidence record, decision, queue, knowledge entry
    or goal checkpoint besides this one field and its accompanying note is
    altered, re-scored or reinterpreted by this amendment.

  reversibility: >-
    REVERSIBLE ON PAPER: restoring 6 would re-fire the batch-count clause of
    the pause condition immediately if a seventh batch is then in flight or
    consumed. Any seconds or batch spent under the raised ceiling cannot be
    unspent.

  evidence_refs:
    - ledger/decisions/DEC-20260812-f30c6e.yaml
    - ledger/goals/GOAL-AES-001.yaml
    - coordination/goals/GOAL-AES-001/amendments/protocol-amendment-GOAL-AES-001-005.yaml

  limitations:
    - >-
      This amendment asserts nothing about AES, supports no claim at any
      round count, creates no hypothesis, promotes no knowledge, satisfies no
      promotion gate, and records no closure attestation.
    - >-
      Cross-model independence remains unavailable campaign-wide under
      inference-amendment 0137a051; this amendment does not address it.

  open_item: >-
    This amendment record is committed together with DEC-20260812-f30c6e and
    the updated GOAL-AES-001 checkpoint in a single isolated program-wide
    budget-ceiling-raise commit. The branch must be pushed and the PR opened
    or refreshed naming DEC-20260812-f30c6e and the fourteen amended goals.
  commit: 51998a6a
  commit_note: >-
    NULL BY NECESSITY, NOT BY OMISSION. A record cannot carry the SHA of the
    commit that contains it. The dispatching session binds this field in a
    follow-on commit once the post-commit verifier accepts it.
  archived_by: null
  archived_by_note: >-
    NULL because no archival task of this specific amendment exists; the goal
    record registers it in its `amendments:` block in the same commit.
