protocol_amendment:
  id: protocol-amendment-GOAL-AES-001-001
  # docs/task-lifecycle.md section "Protocol amendments" defines this record with
  # `experiment_id` and locates it at experiments/<EXP-ID>/amendments/. That
  # location is experiment-scoped and does not apply here: the frozen protocol
  # being amended is a CAMPAIGN budget on a persistent goal, and GOAL-AES-001 has
  # no EXP-* record (no experiment has been frozen in this campaign). The record
  # is therefore filed under the goal, following the placement precedent of
  # coordination/goals/GOAL-AES-001/batches/BATCH-001/inference-amendment-TASK-20260731-602.yaml
  # and its own precedent
  # coordination/goals/GOAL-SSI-001/batches/BATCH-001/inference-amendment-TASK-20260725-501.yaml.
  # `experiment_id` is null by design and `goal_id` carries the binding target.
  experiment_id: null
  goal_id: GOAL-AES-001
  scope_of_amendment: campaign_budget_ceiling
  version_from: 1
  version_to: 2
  approved_by: coordinator
  approved_at: '2026-07-31'
  approval_basis: >-
    Dispatcher-relayed user ruling. The Coordinator declared BATCH-002 at its
    honest cost (9300 s) against 2700 s of remaining campaign budget, refused to
    shrink the work to fit, and referred the ceiling question upward. The
    dispatching session independently reproduced the budget arithmetic and the
    BATCH-001 measured-time calibration, put the full picture to the user
    including that even a minimal BATCH-002 (derivation note + review + archive
    only, ~5100 s) exceeds what remains, and the user chose to amend to cover the
    full six-task plan with all six tasks approved as ranked and TASK-20260731-703
    NOT cut.
  archived_by: null       # not yet assigned to an archival task; see open_item below

  reason: >-
    THIS IS A BUDGET-CEILING CALIBRATION CORRECTION, NOT A GROWTH IN THE WORK.
    The original ceiling of 10800 wall-clock seconds across at most 6 batches was
    set before any batch had been measured, and it is being exhausted by
    conservative DECLARED ceilings rather than by spent work. BATCH-001 declared
    8100 s and actually consumed approximately 3231 s of wall clock
    (TASK-20260731-601 ~682 s, TASK-20260731-602 ~890 s, TASK-20260731-603 ~179 s,
    TASK-20260731-604 ~1071 s, TASK-20260731-605 ~409 s), measured by the
    dispatching session rather than assumed. Declared budgets are therefore
    running at roughly 2.5x measured time. Under the original ceiling, 75% of the
    campaign's nominal budget would have been consumed by a batch that spent 30%
    of it, and the campaign would have been closed at budget while most of the
    declared allowance had never been used. That is a defect in the original
    number, not a discovery that the research became more expensive.

  changes:
    - >-
      campaign_budget.total_wall_clock_seconds: 10800 -> 20000.
    - >-
      No other field of campaign_budget is touched. maximum_batches stays 6.
      max_concurrent stays 3.
    - >-
      GOAL-AES-001 is updated in the same working change to carry
      current_batch_id: BATCH-002, the BATCH-002 dispatch_queue_path, exactly one
      next_action describing dispatch of TASK-20260731-701/702/703, and a
      reference to this amendment. latest_verified_commit stays
      eb72cac7667e60a15a311a1c0d3d2137e79d186b: it is bound to the last VERIFIED
      LEDGER ARCHIVE and BATCH-002 has produced none.

  unchanged:
    maximum_batches: 6
    max_concurrent: 3
    claim_tier_ceiling: >-
      toy / reduced-round only. UNCHANGED. No result from this goal may be stated
      as a claim about full-round AES or deployed AES security.
    completion_criteria: unchanged
    pause_conditions: unchanged
    objective_and_scope: unchanged
    authority_and_review_requirements: unchanged
    goal_closure_quorum: >-
      UNCHANGED and unaffected. Under
      inference-amendment-TASK-20260731-602.yaml a three-distinct-model closure
      quorum remains unobtainable in this harness, so `completed` remains
      unreachable for GOAL-AES-001 regardless of budget.

  what_this_amendment_is_not:
    - >-
      It is NOT a widening of research scope. The objective, the question set,
      and the reduced-round-only scope of GOAL-AES-001 are untouched.
    - >-
      It is NOT a raising of claim tier. The toy / reduced-round ceiling stands,
      and no batch may assert anything about full-round or deployed AES.
    - >-
      It is NOT a widening of authority. No role gains a permission; the
      Coordinator remains the only role that may change official state, and the
      independent-review chain for BATCH-002 is unchanged.
    - >-
      It is NOT a change to any success criterion, falsification criterion,
      completion criterion, or pause condition. Nothing here alters what would
      count as a result. It changes only how much wall clock the campaign may
      declare before it must return for another ruling.
    - >-
      It is NOT retroactive. No raw run record, receipt, evidence record, or
      decision is altered. BATCH-001's declared 8100 s stands as declared and its
      measured ~3231 s stands as measured.
    - >-
      It does NOT vindicate or license larger per-task budgets going forward. The
      2.5x declared-to-measured ratio is a reason to CALIBRATE future declarations
      downward as measurement accumulates, not a licence to inflate them.

  budget_accounting_after_amendment:
    total_wall_clock_seconds: 20000
    batch_001_declared: 8100
    batch_001_measured_approx: 3231
    batch_002_declared: 9300
    declared_committed_total: 17400
    headroom_remaining: 2600
    headroom_note: >-
      20000 covers BATCH-001's declared 8100 plus BATCH-002's declared 9300 with
      approximately 2600 s of headroom for a possible BATCH-003. That headroom is
      thin: it is roughly one producer plus one archive at BATCH-002 declaration
      rates, or a somewhat larger batch if declarations are recalibrated toward
      measured time. A FURTHER AMENDMENT IS REQUIRED BEYOND THAT. Reaching the
      20000 ceiling without an amendment triggers the declared pause condition
      ("the six-batch campaign budget is exhausted without an admissible next
      mechanism"); it does not authorize silent overrun, and an overrun is not a
      research result.

  affected_runs: []
  affected_runs_note: >-
    None. No run, receipt, or evidence record is altered, re-scored, or
    reinterpreted by this amendment. BATCH-001 is closed and verified (snapshot
    0185c0ff, ledger eb72cac7, goal checkpoint 7fb1a658) and is untouched.

  confirmatory_status: preserved
  confirmatory_status_note: >-
    Preserved. This amendment changes no pre-registered prediction, gate,
    criterion, or protocol step, and it was decided BEFORE any BATCH-002 task ran
    and therefore before any BATCH-002 outcome could be observed. It is not a
    criterion-after-outcome change of the kind AGENTS.md and the Coordinator
    contract forbid.

  evidence_refs:
    - >-
      BATCH-001 measured wall clock per task, measured by the dispatching session:
      TASK-20260731-601 ~682 s, TASK-20260731-602 ~890 s, TASK-20260731-603 ~179 s,
      TASK-20260731-604 ~1071 s, TASK-20260731-605 ~409 s; total ~3231 s against
      8100 s declared.
    - ledger/goals/GOAL-AES-001.yaml (campaign_budget, batch_checkpoints)
    - coordination/goals/GOAL-AES-001/batches/BATCH-001/dispatch_queue.json
    - coordination/goals/GOAL-AES-001/batches/BATCH-002/dispatch_queue.json
    - ledger/decisions/DEC-20260731-011.yaml
    - ledger/decisions/DEC-20260731-012.yaml
    - "BATCH-001 ledger archive commit eb72cac7667e60a15a311a1c0d3d2137e79d186b"

  limitations:
    - >-
      The per-task measured times are reported as measured by the dispatching
      session. They are wall-clock observations about this harness's execution of
      BATCH-001, not a validated performance model, and they are not an
      independent second measurement.
    - >-
      This amendment asserts NOTHING about AES. It concerns a resource ceiling
      only.
    - >-
      The 2.5x ratio is drawn from a single batch of five tasks, three of which
      were short. It is sufficient to establish that the original ceiling was
      mis-calibrated; it is not a precise conversion factor and must not be used
      as one to justify a specific future declaration.

  open_item: >-
    This amendment record is UNCOMMITTED at the time of writing and is therefore
    not yet durable (AGENTS.md "Durable research commits"). It must be assigned to
    exactly one archival task and committed before any official transition relies
    on it; `archived_by` is null until that assignment is made. The BATCH-002
    queue as written declares no path for it, so either it rides an isolated
    Coordinator commit alongside the goal-record update (the pattern BATCH-001
    used for inference-amendment-TASK-20260731-602 at commit 0137a051), or the
    queue is superseded to declare it. The dispatching session must resolve this
    before TASK-20260731-704.
