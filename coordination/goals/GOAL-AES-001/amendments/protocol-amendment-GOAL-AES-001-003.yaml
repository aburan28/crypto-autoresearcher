protocol_amendment:
  id: protocol-amendment-GOAL-AES-001-003
  # Filed under the goal, not under experiments/<EXP-ID>/amendments/, for the
  # same reason as amendments 001 and 002: the protocol being amended is a
  # CAMPAIGN-level constraint on a persistent goal, and GOAL-AES-001 has no
  # EXP-* record. experiment_id is null by design.
  experiment_id: null
  goal_id: GOAL-AES-001
  scope_of_amendment: campaign_budget_accounting_basis
  version_from: 3
  version_to: 4
  approved_by: coordinator
  approved_at: '2026-08-01'
  decision_ref: DEC-20260731-015
  approval_basis: >-
    Dispatcher ruling, taken under the user's standing instruction to continue
    running the harness, recorded by the dispatching session as REVERSIBLE and
    disclosed to the user as such. The Coordinator declared BATCH-003 at its
    calibrated honest cost (5000 s) against 2600 s of remaining DECLARED
    headroom, refused to shrink the work to fit, marked the queue NOT
    DISPATCHABLE, and referred the gap upward with two admissible resolutions
    named and neither taken. The dispatching session rendered the plan
    (`python3 tools/research_dispatch.py`, exit 0, all 10 gates passing, ready
    tasks TASK-20260801-801 and TASK-20260801-802, declared total 5000 s) and
    chose option B over option A.

  reason: >-
    THIS IS AN ACCOUNTING-BASIS CORRECTION. IT DOES NOT MOVE THE CEILING AND IT
    DOES NOT BUY THE CAMPAIGN ANY ADDITIONAL RESEARCH SCOPE. The campaign has
    now hit the same wall twice, and both times the binding constraint was a
    measurement artefact rather than spent work: budgets were CHARGED AGAINST
    THE CEILING AT THEIR DECLARED VALUE, while declarations run well above
    measured time. protocol-amendment-GOAL-AES-001-001 resolved the first
    occurrence by raising the ceiling 10800 -> 20000, and its own text warned
    that the 2.5x declared-to-measured ratio was "a reason to CALIBRATE future
    declarations downward as measurement accumulates, not a licence to inflate
    them". BATCH-002's dispatch queue recorded the same standing limit. BATCH-003
    then did exactly what those records asked — declaring 5000 s where BATCH-002
    declared 9300 s for a comparable package, a 1.86x reduction at similar scope
    — and still did not fit, because the 17400 s already charged is a number the
    campaign never spent. Raising the ceiling a second time would leave the
    defect that caused both crises in place and would, on the third occurrence,
    have to be done again. Re-basing the counter fixes the defect instead. The
    total resource the campaign may consume is UNCHANGED; what changes is that
    the counter now counts consumption.

  changes:
    - >-
      campaign_budget.total_wall_clock_seconds STAYS 20000. IT IS NOT RAISED,
      NOT WIDENED, AND NOT REINTERPRETED UPWARD. Any reading of this amendment
      as an increase in the campaign's resource allowance is wrong.
    - >-
      ACCOUNTING BASIS: consumption charged against that ceiling is the MEASURED
      wall-clock time of COMPLETED tasks, not the sum of declared per-task
      budgets. The ceiling is now a bound on time the campaign actually spends.
    - >-
      DECLARED PER-TASK BUDGETS REMAIN BINDING AS STOP CONDITIONS AND ARE NOT
      DEMOTED TO ESTIMATES. A task that reaches its declared
      `handoff.budget.wall_clock_seconds` STILL HALTS, and its halt is recorded
      as an infrastructure/budget outcome, never as a negative mathematical
      result (AGENTS.md rule 5). This is the safeguard that keeps measured-second
      accounting from becoming an open-ended allowance: no individual task gains
      any additional running time from this amendment.
    - >-
      UNMEASURED WORK IS CHARGED AT ITS DECLARATION. A completed task whose
      wall-clock duration was not reported is charged against the ceiling at its
      DECLARED budget until a measurement is recorded. The campaign may not
      under-charge itself by failing to measure, and an unmeasured task is never
      charged at zero.
    - >-
      RE-BASING IS ARITHMETIC ON THE COUNTER, NOT AN EDIT TO ANY RECORD. Under
      the new basis BATCH-001 and BATCH-002 together are charged 9243 s rather
      than 17400 s. No run record, receipt, evidence record, decision, queue or
      goal checkpoint is altered: BATCH-001's declared 8100 stands as declared
      and its measured 3231 stands as measured, and the same for BATCH-002. Only
      which of the two already-recorded numbers is charged against the ceiling
      changes.

  measured_evidence:
    source: >-
      Per-task wall-clock durations REPORTED BY THE DISPATCHING SESSION from
      observed task durations. THERE IS NO INSTRUMENTED TIMER IN THIS REPOSITORY
      AND NO TIMING ARTIFACT IS COMMITTED: these are the dispatching session's
      observations, recorded as such rather than presented as measurements a
      third party could re-derive from the tree. That is a real limitation of
      the new basis and it is stated here rather than smoothed over.
    batch_001:
      declared: 8100
      measured: 3231
      ratio: "2.51x over-declared"
      per_task: >-
        TASK-20260731-601 ~682, -602 ~890, -603 ~179, -604 ~1071, -605 ~409
    batch_002:
      declared: 9300
      measured: 6012
      ratio: "1.55x over-declared"
    cumulative_before_batch_003:
      declared: 17400
      measured: 9243
    batch_003_position_under_the_new_basis:
      charged_to_date: 9243
      batch_003_declared: 5000
      worst_case_if_every_task_runs_to_its_full_declaration: 14243
      expected_at_this_campaign_s_historical_ratio: >-
        approximately 12000 of 20000. Stated as an expectation derived from two
        observed batches, NOT as a prediction with any evidential status.
    trend_note: >-
      The over-declaration ratio is FALLING (2.51x, then 1.55x) as declarations
      are calibrated toward measurement, which is the intended direction. It
      also means the gap between the two accounting bases will keep narrowing,
      and this amendment's headroom benefit shrinks accordingly. It is not a
      renewable source of budget.

  standing_limit: >-
    THE CEILING IS REAL AND IT STILL BINDS. 20000 s of MEASURED wall clock
    across at most 6 batches. If measured consumption approaches 20000, a
    FURTHER AMENDMENT IS REQUIRED; reaching it without one triggers the declared
    pause condition ("the six-batch campaign budget is exhausted without an
    admissible next mechanism"). It does not authorize silent overrun, and an
    overrun is not a research result. Two batches of six are used and BATCH-003
    is the third; maximum_batches is UNCHANGED at 6 and is an independent
    constraint that this amendment does not touch — the campaign can still run
    out of batches while under the time ceiling.

  unchanged:
    total_wall_clock_seconds: 20000
    maximum_batches: 6
    max_concurrent: 3
    claim_tier_ceiling: >-
      UNCHANGED. toy / reduced-round only. No result from this goal may be
      stated as a claim about full-round AES or deployed AES security.
    completion_criteria: unchanged
    pause_conditions: unchanged
    objective_and_scope: unchanged
    authority_and_review_requirements: >-
      UNCHANGED. No role gains a permission. The Coordinator remains the only
      role that may change official state; the independent-review chain for
      BATCH-003 (snapshot TASK-20260801-803, independent validation
      TASK-20260801-804, ledger archive TASK-20260801-805) is unchanged.
    provenance_gate: >-
      UNCHANGED. protocol-amendment-GOAL-AES-001-002 remains in force
      prospectively for BATCH-003 producers and the snapshot archive.
    goal_closure_quorum: >-
      UNCHANGED and unaffected. Under inference-amendment 0137a051 a
      three-distinct-model closure quorum remains unobtainable in this harness,
      so `completed` remains unreachable for GOAL-AES-001 regardless of budget
      accounting.

  what_this_amendment_is_not:
    - >-
      It is NOT a budget increase. 20000 s stays 20000 s. The campaign may not
      spend one second more than it could before; it may only stop being charged
      for seconds it never spent.
    - >-
      It is NOT a licence for larger declarations. Declarations must continue to
      be calibrated toward measured time, and this amendment removes the pressure
      that was making that calibration futile rather than removing the duty.
    - >-
      It is NOT a relaxation of per-task limits. A task still halts at its
      declared wall_clock_seconds.
    - >-
      It is NOT a widening of research scope, claim tier, or authority, and it
      changes no success criterion, falsification criterion, completion
      criterion or pause condition. Nothing here alters what would count as a
      result.
    - >-
      It is NOT an edit to any committed record. The re-basing is arithmetic on
      a counter.
    - >-
      It asserts NOTHING about AES. It concerns a resource counter only.

  confirmatory_status: preserved
  confirmatory_status_note: >-
    Preserved. This amendment changes no pre-registered prediction, gate,
    criterion or protocol step, and it was decided BEFORE any BATCH-003 task ran
    and therefore before any BATCH-003 outcome could be observed. It is not a
    criterion-after-outcome change of the kind AGENTS.md and the Coordinator
    contract forbid.

  affected_runs: []
  affected_runs_note: >-
    None. No run, receipt, evidence record or decision is altered, re-scored or
    reinterpreted. BATCH-001 (snapshot 0185c0ff, ledger eb72cac7) and BATCH-002
    (snapshot ebac9ba8, index 50a0bec7, ledger d4f7a7e0, goal checkpoint
    5fcb2269) are closed and untouched.

  reversibility: >-
    The dispatching session recorded this ruling as REVERSIBLE and disclosed it
    to the user as such. Reverting means charging DECLARED seconds again, which
    would immediately re-impose the 2400 s BATCH-003 shortfall and return the
    queue to NOT DISPATCHABLE. No research artifact would need to be withdrawn,
    because none of this batch's findings depends on which basis is counted.

  evidence_refs:
    - ledger/decisions/DEC-20260731-015.yaml
    - ledger/decisions/DEC-20260731-012.yaml
    - ledger/decisions/DEC-20260731-013.yaml
    - coordination/goals/GOAL-AES-001/amendments/protocol-amendment-GOAL-AES-001-001.yaml
    - >-
      coordination/goals/GOAL-AES-001/batches/BATCH-002/dispatch_queue.json
      (budget_note_history version 2, `standing_limit`)
    - coordination/goals/GOAL-AES-001/batches/BATCH-003/dispatch_queue.json
    - ledger/goals/GOAL-AES-001.yaml
    - >-
      Dispatching session render of the BATCH-003 plan: exit 0, all 10 gates
      pass, ready tasks TASK-20260801-801 and TASK-20260801-802, declared total
      5000 s.

  limitations:
    - >-
      THE MEASURED FIGURES ARE REPORTED, NOT INSTRUMENTED. They come from task
      durations observed and reported by the dispatching session. No timing
      artifact is committed to this repository, no independent second
      measurement exists, and a later session cannot re-derive them from the
      tree. The new basis is therefore only as trustworthy as that reporting,
      which is a weaker footing than the declared basis it replaces — the
      declared numbers are in committed queue records and are checkable.
      Recorded as a cost of this ruling, not hidden by it.
    - >-
      The 2.51x and 1.55x ratios come from two batches of five and six tasks.
      They are sufficient to establish that declared-second accounting
      systematically over-charges this campaign; they are NOT a conversion
      factor and must not be used as one to justify any specific future
      declaration.
    - >-
      This amendment asserts NOTHING about AES, supports no claim at any round
      count, and does not change the strength or scope of any evidence.
    - >-
      It does not address cross-model independence, which remains unavailable
      campaign-wide under inference-amendment 0137a051, nor model_verified,
      which remains false throughout this campaign.

  open_item: >-
    This amendment record is UNCOMMITTED at the time of writing and is therefore
    not yet durable (AGENTS.md "Durable research commits"). Following the
    precedent of amendments 001 and 002 and of inference-amendment
    TASK-20260731-602 (isolated commit 0137a051), it is committed by the
    dispatching session together with DEC-20260731-015, the updated
    GOAL-AES-001 checkpoint, the superseded BATCH-003 queue and the five
    BATCH-003 handoff records, BEFORE any BATCH-003 task runs. `archived_by` is
    null because no BATCH-003 archival task declares this path; the goal record
    registers it in its `amendments` block in that same commit.
  archived_by: null
