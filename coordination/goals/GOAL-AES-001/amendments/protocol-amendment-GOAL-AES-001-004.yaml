protocol_amendment:
  id: protocol-amendment-GOAL-AES-001-004
  # Filed under the goal rather than under experiments/<EXP-ID>/amendments/ for
  # the same reason amendments 001, 002 and 003 were: the protocol being amended
  # is a CAMPAIGN-level criterion on a persistent goal, and GOAL-AES-001 has no
  # EXP-* record. experiment_id is null by design.
  experiment_id: null
  goal_id: GOAL-AES-001
  scope_of_amendment: >-
    certification_condition_for_a_reduced_round_measurement (restatement of
    DEC-20260731-011's condition), AND artifact_provenance_gate_per_artifact_class
    (clarification of protocol-amendment-GOAL-AES-001-002's base clause, closing
    the D-803-1 drafting residual)
  version_from: 4
  version_to: 5
  approved_by: coordinator
  approved_at: '2026-08-01'
  decision_ref: DEC-20260731-016

  # =====================================================================
  # WHY THIS AMENDMENT EXISTS, AND WHY IT IS AN AMENDMENT AND NOT A RULING
  # =====================================================================
  approval_basis: >-
    Coordinator authority, ENACTING a ruling already made and already committed.
    DEC-20260731-014 ruled DEC-20260731-011's certification condition in three
    parts on the BATCH-003 evidence and DELIBERATELY DID NOT ENACT the
    restatement, on the ground that changing a committed success criterion after
    observing outcomes requires a versioned protocol_amendment
    (agents/coordinator.md). This record is that amendment. It is approved in a
    decision record of its own, DEC-20260731-016, rather than folded into a
    batch decision as amendment 002 was into DEC-20260731-015, because unlike
    amendment 002 THIS AMENDMENT TOUCHES A SUCCESS CRITERION: applying the test
    used for amendments 002 and 003 — does it change what the campaign is
    AUTHORIZED TO DO — the answer for 002 (a bookkeeping gate) and 003 (an
    accounting basis) was no, and the answer here is YES. It changes what a
    future batch may certify. An act of that kind is recorded as its own
    auditable decision, with its own rationale, evidence refs and limitations,
    so that a red team has a single object to attack.

  basis:
    - ledger/evidence/EV-AES-003.yaml
    - ledger/decisions/DEC-20260731-014.yaml
    - knowledge/findings/KN-FIND-018.md
    - ledger/decisions/DEC-20260731-011.yaml
    - coordination/goals/GOAL-AES-001/amendments/protocol-amendment-GOAL-AES-001-002.yaml
    - >-
      coordination/goals/GOAL-AES-001/batches/BATCH-003/tasks/TASK-20260801-804/er6_closeout_review.md
      (V-804-4, V-804-5: the two demonstrated false greens on the repaired
      instrument, and the enumerated observation-channel list)
    - >-
      coordination/goals/GOAL-AES-001/batches/BATCH-003/tasks/TASK-20260801-802/repair_receipt_v3.json
      (the machine-readable (key length x final_mix_columns) coverage boundary,
      25 generated cells, six non-empty cells)

  reason: >-
    DEC-20260731-011 made two harness defects — H-1 (the scoring core must fail
    closed) and H-3 (no fault escapes) — preconditions on certifying any
    cryptanalytic measurement against the reduced-round path. Three batches of
    measurement say the condition AS WRITTEN cannot be discharged by an
    instrument of this design, and say precisely which part cannot: FIVE
    demonstrated false-green escapes across THREE repairs (ER-6, ER-7, ER-8,
    V-804-4, V-804-5), produced by two independent sessions, each an existence
    demonstration reproducible from recorded commands, each faulted module
    confirmed wrong by direct ciphertext comparison BEFORE the control was run,
    and two of the five live in the instrument as committed. The reason they
    recur is structural rather than inductive (KN-FIND-018): each repair closes
    ONE CELL of an open-ended product of axes, or ONE CHANNEL of an open-ended
    observation set, while the adversary model is strictly stronger than the
    instrument — the mutant is an ordinary child process holding the harness's
    own inputs on its command line. Enumeration against an open-ended set does
    not converge, and continuing to enumerate would spend the campaign's
    remaining budget on a method the campaign's own measurements say cannot
    reach its own gate. The three parts are not the same kind of object and must
    not be carried in one sentence: H-1 is a CLOSED property that is MET; the
    coverage family is closable BY CONSTRUCTION but not by enumeration; the
    evasion family is not closable at all by an in-process instrument against an
    adversarial module. This amendment restates the condition in those three
    parts, PROSPECTIVELY, concretely enough that a future batch can tell whether
    it has satisfied it.

  # =====================================================================
  # PART A. WHAT CERTIFICATION OF A REDUCED-ROUND MEASUREMENT NOW REQUIRES
  # Effective PROSPECTIVELY from BATCH-004. Replaces, for tasks dispatched
  # hereafter, the single clause "H-1 and H-3 closed" of DEC-20260731-011.
  # =====================================================================
  changes:
    - id: C1
      title: >-
        CLOSED SCORING-CORE PROPERTY — carried forward at full strength, and
        strengthened from a once-forever finding into a per-use obligation.
      requirement: >-
        The instrument version actually used to certify a measurement must
        satisfy, by inspection over a finite code path: the ONLY route to
        `detected: true` is `comparisons_executed > 0 AND divergences > 0`, and
        EVERY error, exception, timeout and load-failure path returns
        `detected: false` together with `infrastructure_outcome: true`. This is
        a closed property of one function and is verifiable by reading it.
      how_a_future_batch_tells_it_is_satisfied: >-
        (i) The certifying package names the exact instrument file and its
        SHA-256 at a named commit. (ii) The package exhibits the enumeration of
        every return path of the scoring function and shows each one against the
        property. (iii) At least one deliberately injected shape that makes the
        instrument fail (an unloadable module, a crashing module, a hanging
        module, an empty task set) is RUN against that exact instrument version
        and scores `detected: false` with `infrastructure_outcome: true`.
        (iv) An independent reviewer reproduces (ii) and (iii) from committed
        source. Satisfied iff all four hold for the version used.
      status_at_approval: >-
        MET for mutation_control_v3.py as committed at snapshot e2f8facb, on
        inspection by two independent sessions across two batches and eleven
        independently authored injection shapes, none of which moved it
        (DEC-20260731-014 disposition, part 1). C1 is NOT weaker than H-1: H-1
        was met once and would have been assumed thereafter; C1 must be
        re-established for each instrument version actually used.

    - id: C2
      title: >-
        COVERAGE CLOSED BY CONSTRUCTION — replaces "H-3 as an enumerated grid",
        which is refused, with a strictly stronger requirement.
      requirement: >-
        The instrument must DERIVE its task set from the module under test's OWN
        DECLARED PARAMETER DOMAIN, read from the module at run time (its declared
        key lengths, its declared round range INCLUDING the boundary values
        r = 0 and r = Nr, its declared final_mix_columns values, its declared
        direction(s), its declared component set), so that "this cell was never
        generated" is IMPOSSIBLE BY CONSTRUCTION rather than false on the axes
        somebody happened to enumerate. A hard-coded grid does not satisfy C2 in
        any form, however wide, and widening a hard-coded grid after an escape is
        the specific method that produced ER-6 and then V-804-4 inside ER-6's own
        repair.
      how_a_future_batch_tells_it_is_satisfied: >-
        The instrument's machine-readable receipt carries, and an independent
        reviewer re-derives from the module's committed source without using the
        instrument's code: (i) the parameter domain it READ, with the exact
        module attribute, signature default or declaration each axis was read
        from; (ii) the full generated cell list with a count per axis tuple;
        (iii) an EMPTY-CELL LIST over the declared domain, which must be
        literally empty — a non-empty list is a C2 FAILURE, not a documented
        limitation; (iv) the axes the domain itself does not contain, named as
        out of the certificate's scope. Satisfied iff the reviewer's independently
        re-derived domain equals the instrument's, and the empty-cell list is
        empty.
      falsification: >-
        C2 is REFUTED for an instrument version by any demonstrated fault
        confined to a cell INSIDE the declared domain that earns a green. A
        refutation is recorded as a refutation; the instrument version is not
        repaired and re-certified inside the same batch on the same evidence,
        because that is the loop this campaign has already run three times.
      status_at_approval: >-
        NOT MET by any instrument that exists. mutation_control_v3.py generates a
        hard-coded grid, and V-804-4 demonstrated a green on a fault confined to
        (final_mix_columns = True AND r = Nr), a cell EMPTY BY CONSTRUCTION in
        build_tasks(). C2 therefore SETS A HIGHER BAR THAN THE CAMPAIGN HAS EVER
        CLEARED, and nothing is grandfathered under it.

    - id: C3
      title: >-
        EVASION DECLARED OUT OF THE CERTIFICATION THREAT MODEL — the one part of
        this amendment that genuinely narrows what certification asserts, and it
        is labelled as such rather than buried.
      requirement: >-
        A certificate may declare the EVASION class (an object that reads a
        distinguishable feature of its environment and disables its fault when
        observed) OUT of its threat model, on the stated ground that the module
        under test is COMMITTED, READABLE and NON-ADVERSARIAL — authored inside
        this program, in the repository, at a named commit — and that this is a
        property that can be CHECKED BY READING rather than a property the
        instrument can enforce. No in-process instrument bounds the evasion
        class against an adversarial module; declaring that limitation is honest
        and pretending to have closed it is not.
      conditions_on_any_certificate_relying_on_C3:
        - >-
          (a) THE DECLARATION TRAVELS WITH THE CERTIFICATE, in its own text, in
          these terms: "The evasion class is OUT of this certificate's threat
          model. This instrument does not detect, and cannot bound, a module that
          reads its environment and hides when observed. The certificate rests on
          the module under test being committed, readable and non-adversarial."
          A certificate that omits it does not carry C3 and is not certified.
        - >-
          (b) The module under test and EVERY mutant scored are committed at a
          named commit, readable, and recorded with their SHA-256 digests.
        - >-
          (c) NON-ADVERSARIALITY IS CHECKED, NOT ASSUMED. An INDEPENDENT reviewer
          reads the committed source of the module under test and of every scored
          mutant and confirms the absence of an environment-observation
          construction, against the enumerated channel list of KN-FIND-018:
          `__name__`, `sys.argv[0]`, `sys.argv[2]` (the tasks JSON), the
          environment, `/proc/<ppid>/cmdline`, the current working directory, the
          module search path, and the writable shared runner file. New channels
          found are added to the list rather than treated as out of scope. This
          obligation DID NOT EXIST under DEC-20260731-011 and is added here.
        - >-
          (d) BEST-EFFORT HARDENING REMAINS REQUIRED AND IS NOT A CERTIFICATION
          CONDITION: comparisons are run under conditions indistinguishable from
          ordinary use (ordinary module name, ordinary argv, ordinary cwd, no
          harness-shaped paths). It removes the cheap tells. It is not claimed to
          close the class, and a package that claims it does is overclaiming.
      what_C3_does_not_assert: >-
        C3 does NOT assert that evasion is impossible, that the instrument
        detects it, or that the strongest named channel is closed. The strongest
        channel identified in this campaign and deliberately NOT run — a mutant
        that reads the tasks JSON on `sys.argv[2]` and disables its fault on
        exactly the tuples that will be compared, defeating ANY finite task set
        including a C2-compliant one — remains open and unaddressed by C2 or C3.
        C3 RELOCATES the burden from the instrument to the readability of the
        object; it does not discharge it.

    - id: C4
      title: SCOPE OF THE RESTATEMENT.
      requirement: >-
        C1, C2 and C3 together replace DEC-20260731-011's clause "H-1 and H-3
        closed before any cryptanalytic measurement is certified against the
        reduced-round path", for tasks dispatched from BATCH-004 onward. A
        certificate is certified under this campaign iff C1, C2 and C3's
        conditions all hold, each verified by an INDEPENDENT session, and the
        certificate states which of them it relies on. No other certification
        route is opened, and none of GOAL-AES-001's completion criteria is
        altered: a certified reduced-round result still requires everything
        completion_criteria already demands, and this amendment adds to that
        list rather than substituting for any of it.

  # =====================================================================
  # PART B. THE D-803-1 FIX: PROVENANCE STATED PER ARTIFACT CLASS
  # =====================================================================
  part_b_provenance_per_artifact_class:
    why_here: >-
      D-803-1 is the Coordinator's own recorded drafting fault in
      protocol-amendment-GOAL-AES-001-002. Amendment 002's base clause requires
      "every declared SOURCE-CODE artifact" to carry a comment-block stanza, and
      the archival card's base clause requires "every declared producer artifact"
      to carry a filled inference block, WITHOUT saying which artifact CLASSES
      the second clause reaches. TASK-20260801-803 had to rule on it at dispatch
      time, referred it for independent overturn, and the TASK-20260801-804
      validator accepted the ruling on a basis it executed (EV-AES-003 Z-6) while
      recording that the per-artifact-class ambiguity in the card language
      REMAINS. DEC-20260731-014 carried it forward as a drafting item for this
      amendment. It is closed here because this is the right vehicle: it is the
      next versioned amendment to the same protocol, and settling it in a
      producer task card instead would re-create the divergence between cards
      that caused D-704-1 in the first place.
    classes:
      - class: SOURCE_CODE
        examples: ['*.py', '*.c', '*.sh', any executable text]
        requires: >-
          BOTH a comment-block inference stanza in the artifact's own text AND an
          `artifact_provenance` entry in the covering manifest binding its path to
          its SHA-256. Unchanged from amendment 002; restated so the class list is
          complete.
      - class: MACHINE_READABLE_MANIFEST
        examples: ['*_results.json', '*_receipt.json', 'validation_report.yaml']
        requires: >-
          A full `inference` block as a first-class field of its own structure,
          AND an `artifact_provenance` list covering EVERY declared artifact of
          its task, each entry carrying `path`, `kind` (one of these class
          names), `sha256`, `comment_block_inference_stanza` (boolean, stated
          honestly including when false) and
          `covered_by_this_manifest_inference_block` (boolean).
      - class: PROSE_REPORT
        examples: ['*.md reports and reviews']
        requires: >-
          EITHER an in-text inference block, OR a provenance POINTER naming the
          covering manifest — provided that manifest's `artifact_provenance`
          carries the report's digest with
          `covered_by_this_manifest_inference_block: true`. BOTH FORMS ARE
          COMPLIANT AND NEITHER IS PREFERRED. This is the exact question D-803-1
          left open, and it is settled by declaring both admissible rather than
          by demanding uniformity after two producers already chose differently
          in good faith. No comment-block stanza is required of this class: a
          prose report is not source code, and amendment 002 never quantified
          over it.
      - class: LEDGER_AND_COORDINATION_RECORD
        examples: ['ledger/**', 'coordination/**/amendments/*', 'dispatch_queue.json', 'ledger/handoffs/*']
        requires: >-
          NOTHING under the artifact-provenance gate. These records are
          Coordinator-authored, their provenance is the commit that carries them
          and their own declared fields, and they are not producer artifacts.
          Stated explicitly so that a future snapshot archive does not invent an
          obligation the amendment never imposed and then fail a Coordinator
          record against it.
    enforcement_point: >-
      UNCHANGED from amendment 002 — the Coordinator snapshot archive, before
      committing. What changes is that the archival card now states the
      requirement PER CLASS, in the SAME LANGUAGE as the producing cards, so a
      dispatch-time ruling is not needed a second time.
    retroactivity: >-
      PROSPECTIVE from BATCH-004. The BATCH-003 acceptance under Z-6 STANDS on
      the validator's verified digest basis and is not re-scored. Applying a
      class list backwards to re-grade a package that was already independently
      accepted would be exactly the post-hoc criterion change this program
      forbids.

  # =====================================================================
  # THE HONESTY CHECK THAT MATTERS MOST FOR THIS AMENDMENT
  # =====================================================================
  this_is_a_rescoping_not_a_weakening:
    the_charge_being_answered: >-
      An amendment that relaxes a certification condition after three batches of
      failing to meet it is, on its face, indistinguishable from a criterion
      quietly rewritten so that a result can pass. That charge is taken
      seriously and is answered on checkable grounds rather than by assertion.
    ground_1_there_is_no_result_for_it_to_let_through: >-
      DECISIVE, and checkable from committed records. At the moment of approval
      the campaign has produced ZERO admissible candidate mechanisms: BATCH-002's
      ideation returned NO_ADMISSIBLE_NEXT_MECHANISM with 0 of 8 enumerated
      objects admitted; BATCH-003 spent its exponent-relevant task on a theorem
      independently ruled IN-SCOPE VACUOUS; and no cryptanalytic measurement
      exists, is running, or is scheduled anywhere in the BATCH-004 dispatch
      queue. Nothing is currently blocked by the condition, and nothing becomes
      certifiable by this amendment that the campaign has produced. It is
      authored at a moment of maximum distance from any result it could benefit,
      which is the only moment at which such a restatement is credible.
    ground_2_it_is_net_stronger_not_net_weaker: >-
      C1 upgrades H-1 from a once-established finding to a per-instrument-version
      obligation with a mandatory injected-failure run. C2 is STRICTLY STRONGER
      than the enumerated grid it replaces and is NOT MET BY ANY INSTRUMENT THAT
      EXISTS — the currently committed instrument fails it on V-804-4. C3(c) adds
      an independent source-reading obligation that DID NOT EXIST under
      DEC-20260731-011. Exactly one component narrows what a certificate asserts:
      C3's declaration that the evasion class is out of the threat model. The net
      effect of this amendment is that certification became HARDER to obtain and
      NARROWER in what it asserts, simultaneously.
    ground_3_the_narrowing_is_forced_by_measurement_not_by_convenience: >-
      C3 is not adopted because closing the evasion class was inconvenient. It is
      adopted because five demonstrated escapes, a structural argument, and an
      identified-and-unrun channel that defeats ANY finite task set say an
      in-process instrument cannot bound an adversarial module. That judgement is
      recorded at its true strength in KN-FIND-018 and here: a REASONED JUDGEMENT
      supported by five measured instances, explicitly NOT a proof of
      impossibility. If someone bounds the evasion class by a mechanism this
      Coordinator has not considered, C3 should be withdrawn, and that would be a
      wanted outcome.
    ground_4_the_original_condition_is_not_erased: >-
      DEC-20260731-011 is an immutable committed record and is NOT edited.
      Its condition stands in the record as what was originally required and as
      UNDISCHARGED as written; this amendment supersedes it prospectively and
      says so, rather than back-dating a reinterpretation. The three-batch
      history of failing to meet it is preserved in EV-AES-001, EV-AES-002,
      EV-AES-003 and KN-FIND-018 and is not tidied away.

  unchanged:
    campaign_budget: >-
      UNCHANGED. total_wall_clock_seconds stays 20000 on the measured basis fixed
      by amendment 003, maximum_batches stays 6, max_concurrent stays 3.
    claim_tier_ceiling: >-
      UNCHANGED. toy / reduced-round only. This amendment asserts NOTHING about
      AES at any round count and does not raise what any record may claim.
    completion_criteria: >-
      UNCHANGED. Every clause of GOAL-AES-001.completion_criteria stands exactly
      as written. This amendment states what CERTIFICATION of a measurement
      requires; it does not state what counts as a RESULT, and it removes no
      element of the certified-result or scoped-barrier standards.
    pause_conditions: unchanged
    objective_and_scope: unchanged
    authority_and_review_requirements: >-
      UNCHANGED in allocation, ADDED TO in obligation. No role gains a
      permission. The Coordinator remains the only role that may change official
      state. C1(iv), C2 and C3(c) each ADD an independent-review duty.
    goal_closure_quorum: >-
      UNCHANGED and unaffected. Under inference-amendment 0137a051 a
      three-distinct-model closure quorum remains unobtainable in this harness,
      so `completed` remains unreachable for GOAL-AES-001, and nothing in
      BATCH-004 may be treated as a closure attestation.
    provenance_gate_of_amendment_002: >-
      NOT REPLACED. Part B CLARIFIES amendment 002's base clause by artifact
      class; every requirement amendment 002 imposed remains in force with the
      same words.

  what_this_amendment_is_not:
    - >-
      NOT RETROACTIVE, in either part. No BATCH-001, BATCH-002 or BATCH-003
      artifact, receipt, evidence record, decision or acceptance is failed,
      re-scored, re-reviewed, edited or withdrawn under it.
    - >-
      NOT a repair authorization. It does NOT dispatch, schedule or require any
      mutation-control work. DEC-20260731-014's stand-down holds: no further
      repair of that instrument is dispatched until a candidate mechanism exists
      that requires certification, at which point a C1/C2/C3-compliant
      instrument is BUILT BEFORE the measurement, not patched after it.
    - >-
      NOT a claim that a C2-compliant instrument is achievable. C2 is a standard,
      not a prediction. If a future batch tries and fails to build one, that
      failure is reported as a failure against a stated standard, which is
      exactly the reporting the enumerated-grid formulation made impossible.
    - >-
      NOT a statement about mutation testing in general, beyond the instrument
      and threat model described in KN-FIND-018.
    - >-
      NOT a budget amendment, NOT an accounting amendment, and NOT an
      authorization to dispatch BATCH-004. Dispatch authorization for BATCH-004
      rests on DEC-20260731-014's next action and on the queue itself.

  confirmatory_status: preserved
  confirmatory_status_note: >-
    Preserved. This amendment changes no pre-registered prediction, gate, null
    object or protocol step of any experiment that has been run or is scheduled.
    It is authored at BATCH-004's opening, BEFORE any BATCH-004 task runs and
    therefore before any BATCH-004 outcome can be observed, and it governs an
    event — certification of a cryptanalytic measurement — that has not occurred
    anywhere in this campaign.

  affected_runs: []
  affected_runs_note: >-
    None. No run, receipt, evidence record, knowledge entry or decision is
    altered, re-scored or reinterpreted. BATCH-001 (snapshot 0185c0ff, ledger
    eb72cac7), BATCH-002 (snapshot ebac9ba8, index 50a0bec7, ledger d4f7a7e0,
    checkpoint 5fcb2269) and BATCH-003 (coordination c114e515, snapshot e2f8facb,
    receipt binding 14022d40, knowledge/validator predecessor 4a942290, ledger
    a421f72b, checkpoint 613658c6) are closed and untouched.

  applies_to:
    - "every task of GOAL-AES-001 dispatched from BATCH-004 onward"
    - >-
      every future certificate of a cryptanalytic measurement against the
      reduced-round path in this campaign (Part A)
    - >-
      every future producer and snapshot-archive task of this campaign (Part B)
  does_not_apply_to:
    - "every task of BATCH-001, BATCH-002 and BATCH-003, without exception"

  what_would_overturn_this_amendment:
    - >-
      A demonstrated coverage escape inside a declared parameter domain on a
      C2-compliant instrument. That refutes C2's central premise — that deriving
      the task set from the module's own declared domain makes an empty cell
      impossible — and C2 would have to be restated or abandoned.
    - >-
      A demonstration that a committed, readable, program-authored module in this
      repository nonetheless evaded a hardened control. That refutes C3's stated
      ground and the declaration would have to be withdrawn.
    - >-
      A mechanism that bounds the evasion class for an in-process instrument.
      That would make C3 unnecessary, and it is the outcome this Coordinator
      would prefer.

  limitations:
    - >-
      This amendment asserts NOTHING about AES, at any round count, and is not a
      cryptanalytic statement of any kind. It is a certification standard and a
      provenance-recording rule.
    - >-
      The judgement underlying C3 is a REASONED JUDGEMENT supported by five
      measured escapes from two independent sessions plus a structural argument.
      It is NOT a proof of impossibility, and the ER-8-restore conjecture behind
      one of the five remains UNRESOLVED rather than refuted.
    - >-
      C2 has never been implemented and its achievability is untested. Approving
      a standard is not evidence that the standard can be met.
    - >-
      The strongest evasion channel known to this campaign (the `sys.argv[2]`
      tasks-JSON read) defeats any finite task set including a C2-compliant one,
      was NAMED AND NOT RUN, and is not addressed by anything in this amendment.
    - >-
      Cross-model independence is unavailable campaign-wide under
      inference-amendment 0137a051. The BATCH-003 evidence this amendment rests
      on was produced and reviewed by sessions resolving to the same model;
      independence is in SESSION and never in MODEL, and correlated agreement is
      the honest reading of it.

  open_item: >-
    This amendment record is UNCOMMITTED at the time of writing and is therefore
    not yet durable (AGENTS.md "Durable research commits"), and it TAKES EFFECT
    ONLY WHEN COMMITTED. Until then DEC-20260731-011's condition stands
    undischarged AS WRITTEN and is not treated as reinterpreted. Following the
    precedent of amendments 001, 002 and 003, it is committed by the dispatching
    session in the same isolated coordination commit as the BATCH-004 dispatch
    queue, its six handoff records and DEC-20260731-016, BEFORE any BATCH-004
    task runs — required, because Part B is cited as a completion gate in the
    BATCH-004 producer and snapshot cards, and a gate uncommitted when the card
    is issued is exactly the retroactive enforcement this program refuses.
  commit: null
  commit_note: >-
    NULL BY NECESSITY, NOT BY OMISSION. A record cannot carry the SHA of the
    commit that contains it. The dispatching session binds this field, and
    registers this amendment in the GOAL-AES-001 `amendments` list, in a
    follow-on commit once the post-commit verifier accepts the coordination
    commit — exactly as BATCH-001, BATCH-002 and BATCH-003 did.
  archived_by: null
