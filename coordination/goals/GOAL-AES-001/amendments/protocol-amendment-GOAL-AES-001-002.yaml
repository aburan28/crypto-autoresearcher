protocol_amendment:
  id: protocol-amendment-GOAL-AES-001-002
  # Filed under the goal rather than under experiments/<EXP-ID>/amendments/ for
  # the same reason protocol-amendment-GOAL-AES-001-001 was: the protocol being
  # amended is a CAMPAIGN-level dispatch gate on a persistent goal, and
  # GOAL-AES-001 has no EXP-* record. experiment_id is null by design.
  experiment_id: null
  goal_id: GOAL-AES-001
  scope_of_amendment: artifact_provenance_completion_gate
  version_from: 2
  version_to: 3
  approved_by: coordinator
  approved_at: '2026-08-01'
  approval_basis: >-
    Coordinator authority, discharging the THIRD ranked item of
    DEC-20260731-013's next_action, which took up the TASK-20260731-705
    validator's recommendation on referred defect D-704-1. The validator
    PROPOSED the change and explicitly declined to enact it ("The Coordinator
    owns the amendment; this validator proposes and does not enact it"). No
    research scope, claim tier, success criterion, falsification criterion,
    completion criterion, pause condition or authority is touched, so no
    escalation beyond Coordinator authority is required. The separate and
    UNRESOLVED question of the campaign budget ceiling is NOT addressed here and
    is referred upward in the BATCH-003 dispatch queue's budget_note; this
    amendment does not authorize dispatch of BATCH-003 and must not be read as
    doing so.

  reason: >-
    D-704-1: two BATCH-002 source-code artifacts (mutation_control_v2.py and
    gate_601b_impl.c) carried no per-artifact inference block. The
    TASK-20260731-704 snapshot archive ruled the gate satisfied because each
    producer met its own frozen completion gate exactly — the -702 and -703
    cards named only their manifest pair, and only -701's was blanket — and the
    TASK-20260731-705 validator ACCEPTED that ruling for BATCH-002 on a basis it
    verified rather than assumed, recomputing both files' SHA-256 from the
    committed blobs and confirming each matches the digest asserted inside the
    manifest carrying the covering inference block. Provenance in BATCH-002 is
    therefore bound BY CONTENT, not by proximity, and it holds. The validator
    nonetheless recommended a prospective change on three concrete grounds,
    which this Coordinator accepts: (i) a digest binding is only as good as the
    manifest surviving beside the source, and mutation_control_v2.py is
    explicitly designed to be reused elsewhere, so travelling alone is a
    realistic future for it; (ii) settling the question cost the batch a defect
    and a validator ruling that a two-line comment header would have foreclosed;
    (iii) the invariant as it stood required a reader to hold two files and a
    hash function to answer "what produced this", and cheap invariants are the
    ones that survive. A fourth ground is the Coordinator's own: the underlying
    fault was a DRAFTING INCONSISTENCY across task cards in one batch, and the
    fix for that is identical language, not more language.

  changes:
    - >-
      PROSPECTIVE COMPLETION GATE, effective for tasks dispatched from BATCH-003
      onward. Every DECLARED SOURCE-CODE artifact of a producer task carries a
      comment-block inference stanza in its own text, recording policy,
      requested_policy, the actual resolved model identifier, fallback_used,
      model_verified and the standing inference basis.
    - >-
      AND, in the same gate rather than as an alternative: the covering manifest
      of each producer task (its machine-readable results/receipt artifact)
      carries an `artifact_provenance` list binding every declared source path
      to its SHA-256 and stating that the manifest's inference block covers it.
      The validator offered (i) and (ii) as alternatives; both are adopted,
      because they fail in different directions — the stanza survives the file
      travelling alone, the digest list survives the file being edited — and
      each costs the producer a few lines.
    - >-
      THE REQUIREMENT IS STATED ONCE, IN IDENTICAL LANGUAGE, in the producing
      task cards and in the archival task card that enforces it. That identity
      of wording is itself part of the amendment: the D-704-1 fault was a
      drafting divergence between a blanket card and two narrow ones.
    - >-
      ENFORCEMENT POINT: the Coordinator snapshot archive, before committing. A
      missing or partial stanza, a missing artifact_provenance list, or a digest
      that does not match the committed bytes is a COMPLETION-GATE FAILURE at
      dispatch — the producing task is returned as incomplete and NOT
      snapshotted, with the defect named concretely. It is not waived and not
      referred forward.

  unchanged:
    campaign_budget: >-
      UNCHANGED by this amendment. total_wall_clock_seconds stays 20000,
      maximum_batches stays 6, max_concurrent stays 3. The BATCH-003 declared
      budget exceeds the declared remainder and that question is open and
      referred upward SEPARATELY; nothing here resolves it.
    claim_tier_ceiling: >-
      UNCHANGED. toy / reduced-round only.
    completion_criteria: unchanged
    pause_conditions: unchanged
    objective_and_scope: unchanged
    authority_and_review_requirements: >-
      UNCHANGED. No role gains a permission. The Coordinator remains the only
      role that may change official state, and the independent-review chain is
      unchanged.
    goal_closure_quorum: >-
      UNCHANGED and unaffected. Under
      inference-amendment-TASK-20260731-602.yaml (commit 0137a051) a
      three-distinct-model closure quorum remains unobtainable in this harness,
      so `completed` remains unreachable for GOAL-AES-001.

  what_this_amendment_is_not:
    - >-
      It is NOT RETROACTIVE, and this is the load-bearing property. No BATCH-001
      or BATCH-002 artifact is failed, re-scored, re-reviewed, edited or
      withdrawn under it. Applying it backwards would fail two producers against
      a gate they were never given, which is a post-hoc criterion change and is
      exactly what AGENTS.md and the Coordinator contract forbid. The D-704-1
      acceptance for BATCH-002 STANDS on the validator's verified digest basis.
    - >-
      It is NOT a change to any success criterion, falsification criterion,
      completion criterion or pause condition. Nothing here alters what would
      count as a result about AES, or about anything else.
    - >-
      It is NOT a claim-tier change and asserts NOTHING about AES. It is a
      provenance-recording rule for artifacts.
    - >-
      It is NOT a budget amendment and does not authorize dispatch of BATCH-003.
    - >-
      It does NOT assert that provenance in BATCH-002 was defective. It was
      verified sound by content. The change is that the invariant becomes cheap
      to check rather than expensive.

  confirmatory_status: preserved
  confirmatory_status_note: >-
    Preserved. This amendment changes no pre-registered prediction, gate,
    criterion or protocol step of any experiment, and it was decided BEFORE any
    BATCH-003 task ran and therefore before any BATCH-003 outcome could be
    observed. It tightens a dispatch-time bookkeeping gate prospectively.

  affected_runs: []
  affected_runs_note: >-
    None. No run, receipt, evidence record or decision is altered, re-scored or
    reinterpreted. BATCH-001 (snapshot 0185c0ff, ledger eb72cac7) and BATCH-002
    (snapshot ebac9ba8, index 50a0bec7, ledger d4f7a7e0, goal checkpoint
    5fcb2269) are closed and untouched.

  applies_to:
    - TASK-20260801-801
    - TASK-20260801-802
    - TASK-20260801-803
    - "every producer and snapshot-archive task of GOAL-AES-001 dispatched hereafter"
  does_not_apply_to:
    - "every task of BATCH-001 and BATCH-002, without exception"

  evidence_refs:
    - ledger/decisions/DEC-20260731-013.yaml
    - ledger/evidence/EV-AES-002.yaml
    - >-
      coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-705/validation_report.yaml
      (referred_defect_rulings, D-704-1: ruling, basis_for_accepting_it_here,
      why_it_should_still_change_prospectively, recommended_form_of_the_amendment)
    - >-
      EV-AES-002 observations Z-3 (7 of 9 producer artifacts carried a filled
      block) and D-1 (the ruling on D-704-1)
    - coordination/goals/GOAL-AES-001/batches/BATCH-003/dispatch_queue.json

  limitations:
    - >-
      This amendment asserts NOTHING about AES. It concerns artifact provenance
      recording only, and a well-recorded artifact is not a better result.
    - >-
      It does not address model_verified. Every inference block in this campaign
      records model_verified: false because `python3 -m orchestration.adapter
      doctor --probe` has been run by nobody, so every resolved_model_id remains
      unverified configuration. A comment-block stanza carries that same
      unverified identifier and does not improve it.
    - >-
      It does not address cross-model independence, which remains unavailable
      campaign-wide under inference-amendment 0137a051.

  open_item: >-
    This amendment record is UNCOMMITTED at the time of writing and is therefore
    not yet durable (AGENTS.md "Durable research commits"). Following the
    precedent of protocol-amendment-GOAL-AES-001-001 and of
    inference-amendment-TASK-20260731-602 (committed in the isolated commit
    0137a051), it is committed by the dispatching session in the same
    coordination commit as the BATCH-003 dispatch queue and its five handoff
    records, BEFORE any BATCH-003 task runs — which is required, because the
    producer cards cite it as a completion gate and a gate that is not committed
    when the card is issued is exactly the retroactive enforcement this
    amendment refuses. `archived_by` is null because no BATCH-003 archival task
    declares this path; TASK-20260801-805's constraints require the Coordinator
    to register this amendment in the GOAL-AES-001 `amendments` list at the
    goal-checkpoint commit that follows the ledger archive.
  archived_by: null
