    - id: A2
      severity: medium
      location: experiments/EXP-MLKEM-013/specification.yaml
      statement: >-
        The spec names verifyModel/ScoreExperimentalDistribution/Algorithm.py in
        source_refs.files, but Algorithm.py is not in required_artifacts and is not
