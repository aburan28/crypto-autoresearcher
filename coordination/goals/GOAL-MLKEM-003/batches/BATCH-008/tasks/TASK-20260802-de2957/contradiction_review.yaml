    - id: R9
      name: >-
        does the archived data discriminate "no wrong-guess mass beyond T=1802" from
        "not enough samples to see it"?
      measured_local_slope_of_log2_survival_bits_per_score_unit:
        "[200,400]": -0.036231
        "[400,600]": -0.045543
        "[600,800]": -0.019878
