          extrapolated_log2_Pwrong_at_Pgood_median_11964.47: -153.0
          nb_iteration_needed_to_reach_the_median_by_counting: 2^129.3
      verdict: >-
        On the corrected raw scale the operating threshold sits roughly 93 to 117 bits
        of survival probability below the instrument's floor. Reaching it by counting
