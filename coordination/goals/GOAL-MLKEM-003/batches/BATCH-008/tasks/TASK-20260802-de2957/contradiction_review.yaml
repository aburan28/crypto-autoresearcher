    - id: A4
      severity: low
      location: BATCH-008 dispatch_queue.json, TASK-20260802-de2957 read_scope/inputs
      statement: >-
        The task card points at "experiments/EXP-MLKEM-013 archived Pwrong/Pgood .out
        files" and does not include experiments/EXP-MLKEM-011 in read_scope, but the
        only copies of those files are under experiments/EXP-MLKEM-011/vendor-lock/data/.

  # ------------------------------------------------------------------
  # 7. RECOMMENDATIONS — the Coordinator decides; this review performs nothing
  # ------------------------------------------------------------------
  recommendations:
    binding_note: >-
      Recommendations only. This review has no authority to promote, supersede, retire,
      or re-status anything, and per rule12_status it could not do so even if it did.
    KN-FIND-012:
      recommendation: supersede_with_restatement
      is_touched: true
      detail: >-
        Its table is numerically correct and reproduces exactly. Two rows and one
        sentence need restating. The row "fraction of Pgood with T <= 1802 | 0" should
        be labelled a resolution bound; the row "bits below toy floor ≈ 84" should read
        "bits below the toy INSTRUMENT FLOOR" and carry 83.87 / 142.09 / 208.33 for
        512/768/1024; and the sentence "measures Pwrong only on a T-interval that does
        not meet the Pgood≈1/2 operating threshold" should become "measures Pwrong only
        over the band its counting resolution permits, Pwrong ∈ [2^-35.70, 2^-1]; the
        Pgood≈1/2 threshold lies ~93-117 bits of survival probability below that band
        by the file's own measured tail slope". Its "Non-claims" section is already
        correct and should be carried forward with one addition: this is not evidence
        that Approximation 4.9 is wrong.
    KN-FIND-014:
      recommendation: supersede_as_withdrawn_on_the_merits
      is_touched: true
      detail: >-
        Its title, both bullets under "What is established", and every row of its table
        rest on a k_fft normalization asymmetry that recomputation from its own cited
        artifact falsifies (R6), corroborated independently by the archived data's own
        variance (R7). The `erratum` tag is doubly wrong: the archived code is
        self-consistent. Recommend a new finding under a fresh random-suffix id
        recording (a) the cancellation mechanism, (b) that no alignment is warranted,
        and (c) that EV-MLKEM-011's raw figures were already on the correct scale.
        KN-FIND-014 itself stays immutable with superseded_by set by the Coordinator.
        This is the more serious of the two corrections and it is arithmetic, not
        phrasing.
    KN-OPEN-016:
      recommendation: amend_via_supersession
      is_touched: true
      detail: >-
        Three changes. (i) The "Pwrong coverage gap" bullet should be restated as the
        dynamic-range bound above rather than as a coverage claim. (ii) The
        "Score-scale audit (KN-FIND-014 / EV-MLKEM-013)" bullet should be replaced by
        the corrected finding that there is no k_fft asymmetry. (iii) Its stated
        "Residual open piece: measure Pwrong near the aligned operating threshold" is
        not merely unattempted but counting-infeasible by ~93-117 bits; it should be
        replaced by F1-F4 above, with F1 named as the next action. "What would close
        it" should additionally acknowledge that direct measurement at the operating
        threshold requires a rare-event estimator or a proof, not a bigger run.
    other_records_touched:
      - record: EV-MLKEM-011 scale_note field
        detail: defers to EV-MLKEM-013's k_fft alignment; needs a superseding note.
      - record: H-MLKEM-011
        detail: >-
          ledger/hypotheses/H-MLKEM-011.yaml line 12 carries the same -119.57 framing;
          the number is right, the surrounding coverage language inherits the confound.
      - record: H-MLKEM-013 / EXP-MLKEM-013 / RUN-MLKEM-013-001
        detail: >-
          The experiment's success and falsification criteria could not catch a
          scale_factor of 1; a successor experiment should test the composite
          init()+FFT() path against compute_score(), not the two method bodies in
          isolation.
      - record: EV-MLKEM-017 / DEC-20260802-15cadd (BATCH-007 synthesis)
        detail: >-
          Any sentence there that quotes "aligned" score statistics or the 420.56 gap
          inherits the void alignment. Flagged for Coordinator review; not inspected in
