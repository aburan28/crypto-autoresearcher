        CC/1024: 0.0066
        CN/512: -0.0021
        CN/768: 0.0014
        CN/1024: -0.0034
      note: >-
        Reproduced independently of BATCH-007's O3. Included only to confirm that the
        Table C.2 Pwrong values I use in R12 are the ones the paper's own arithmetic
        uses. It asserts nothing about whether those values are correct.

  # ------------------------------------------------------------------
  # 3. PER-RECORD ADJUDICATION
  # ------------------------------------------------------------------
  adjudications:

    - record_id: EV-MLKEM-011
      current_official_status: accepted_with_qualifications
      current_strength: preliminary
      current_claim_tier: medium
      verdict: claim_survives_narrowed
      verdict_may_change_official_status: false

      strongest_case_for_surviving_intact:
        - >-
            Every number the record states recomputes exactly from the archived bytes
            it cites (R1, R4, R5, R12). Nothing in it is fabricated or stale.
        - >-
            Its fourth observation and the second clause of its inference — that the
            Kyber-scale Table C.2 Pwrong figures lie ~84 bits below the toy floor — is a
            statement about the instrument's dynamic range. The counting-resolution
            finding does not weaken it; it explains it, and makes it sharper.
        - >-
          EV-MLKEM-013's k_fft "correction", which had shrunk the reported gap to ~421
          units and made the confound look nearly decisive, is itself wrong (R6, R7).
          On the correct common scale the record's own raw figures stand: the gap to
          the operating threshold is 10162.47 score units, and by the file's own
          measured tail slope roughly 93-117 bits of survival probability (R10).
        - >-
          The record already carries strength preliminary, claim_tier medium,
          status accepted_with_qualifications, and boundaries naming the
          archived-data-only scope. It never claimed a Kyber break.

      why_it_does_not_survive_intact:
        - >-
            Observation 1 ("last positive mass at T=1802 ... first zero at T=1803") is
            reported in the grammar of a measured distribution endpoint. R1 shows it is
            the instrument's counting-resolution floor: the last positive value is
            bit-for-bit one count in nb_iteration * q^k_fft, and all 1804 values are
            exact integer multiples of that quantum.
        - >-
            Observation 2's "fraction of Pgood scores with T <= 1802 is exactly 0" and
            the inference's "does not intersect the Pgood≈1/2 operating threshold" then
            read as a distributional separation. They are a resolution bound. Under
            docs/inventor-protocol.md §3 this is the artifact tell: the parameter meant
            to move the reported quantity (nb_iteration) was never varied, and no
            matched-budget control exists in the archive.
        - >-
            Observation 3's T-gap is quoted against the Pgood MINIMUM. The paper selects
            T so that Pgood ≈ 1/2 (page27 extract), so the operationally relevant
            distance is the one to the Pgood median, 10162.47, which the record does not
            state.
        - >-
            AGENTS rule 5, extended to statistical failures: an instrument that cannot
            resolve a separation is not evidence that the separation is absent. The
            record's inference reads as if it were.

      non_confounded_restatement: >-
        In Carrier's archived Fig 4.1 left-panel run (q=241, m=40, n=43, n_fft=8,
        k_fft=3, n_lat=35, avg_N=25971, nb_iteration=4000), the experimental Pwrong is
        a pooled counting estimate over nb_iteration * q^k_fft = 55,990,084,000 =
        2^35.7045 scored candidates. All 1804 recorded values are exact integer
        multiples of 1/2^35.7045 and the last positive value is exactly one count, so
        the run cannot report any Pwrong below 2^-35.7045 and its zeros at scores
        >= 1803 are an UPPER BOUND, not a measurement of zero: Pwrong(1803) <= 2^-34.12
        at 95% under an independence assumption the pooled design does not satisfy
        (<= 2^-10.38 under maximal within-iteration clustering). On the same raw
        cosine-sum scale — there is no k_fft rescaling; see EV-MLKEM-013 below — the
        4000 archived Pgood scores are min 6667.673616, median 11964.473718, max
        17822.813537, so the threshold at which Pgood ≈ 1/2 lies 10162.47 score units
        above the highest score the instrument can resolve. Therefore: the archived
        data does NOT show that Approximation 4.9 fails, and does NOT show that
        wrong-guess mass is absent at the operating threshold. What it does show is
        that Fig 4.1 validates Approximation 4.9 only over the band
        Pwrong ∈ [2^-35.70, 2^-1], while the Kyber cost table applies that
        approximation at 2^-119.57 / 2^-177.79 / 2^-244.03 — 83.87 / 142.09 / 208.33
        bits below the validated band (Table C.2, CC column) — and that no counting
        experiment at the Fig 4.1 parameters could have extended the validated band to
        the operating threshold, since by the file's own measured tail slope that would
        require ~2^105 to ~2^129 iterations against the 4000 run. This is a
        dynamic-range statement about the experimental validation, not a distributional
        separation, and not a claim about ML-KEM security.

      what_must_be_withdrawn:
        - >-
            the phrase "does not intersect the Pgood≈1/2 operating threshold" as a
            property of the distributions;
        - >-
            "fraction of Pgood scores with T <= 1802 is exactly 0" presented as a
            coverage measurement rather than as a resolution bound;
        - >-
            by consequence of R6/R7, the `scale_note` field, which defers T statistics
            to EV-MLKEM-013's k_fft alignment.
      what_stands:
        - >-
            every recorded number (R1, R4, R5, R12);
        - >-
            the 83.87 / 142.09 / 208.33-bit distances from the toy instrument floor to
            the Kyber-scale Table C.2 CC Pwrong values;
        - >-
            the boundaries and non-claims as written.

    - record_id: EV-MLKEM-013
      current_official_status: draft
      current_strength: preliminary
      current_claim_tier: medium
      verdict: claim_void
      verdict_may_change_official_status: false
      note_on_status: >-
        The record is `status: draft` and was never officially accepted, so nothing
        official turns on this verdict; and per rule12_status this review could not
        change its status in any case.

      strongest_case_for_surviving:
        - >-
            The record's function was a units audit that CORRECTED a prior record — the
            program catching its own error, which is the behaviour the contract wants.
            Rejecting it deserves at least the skepticism that accepting it did.
        - >-
            Its two quoted code facts are literally true of the two method bodies read in
            isolation: FFT_sample.FFT does compute numpy.fft.fftn(T).real/k_fft, and
            Score_Function.compute_score does return a sum of cosines with no division.
        - >-
            Its derived order statistics are arithmetically correct given its premise
            (6667.673616/3 = 2222.557872; 11964.473718/3 = 3988.157906;
            17822.813537/3 = 5940.937846; 2222.557872 - 1802 = 420.557872 — all four
            reproduce exactly).
        - >-
            Algorithm.py, which would show which code path wrote the .out files, is named
            in EXP-MLKEM-013's specification but is not archived, so one could argue the
            audit was working from what it had.

      why_it_is_void:
        - >-
            R6: run against the archived FFT_sample.py that the record itself cites,
            FFT_sample.FFT() reproduces Score_Function.compute_score() with ratio
            1.000000000000 (max abs deviation 1.1e-13 across five parameter settings),
            not k_fft. The reason is on line 18: init()'s
            `for i in range(len(decoded))` loop adds each dual-vector phase
            len(decoded) = k_fft times, and FFT()'s /k_fft cancels it. Removing that loop
            makes the ratio exactly 1/k_fft, which pins the mechanism. The primary metric
            `scale_factor_k_fft` recomputes to 1, not 3.
        - >-
            The `synthetic_check` string archived in RUN-MLKEM-013-001/results.json is
            the result one gets by building the table WITHOUT init(), i.e. the recorded
            check did not exercise the code path it certified.
        - >-
            R7, independently of any code: the empirical standard deviation of BOTH
            archived Pwrong survival functions (113.7914 and 113.9783) matches
            sqrt(avg_N/2) = 113.95 to within 0.15% and misses sqrt(avg_N/2)/k_fft = 37.98
            by a factor of 2.9957 / 3.0007. Under the paper's own Model 4.7 both Pwrong
            files are on the raw scale. This holds whatever script wrote them.
        - >-
            R8, corroborative: Approximation 4.8's threshold formula reproduces the RAW
            Pgood median at alpha = 2.01 (alpha = 2 gives 12021.89 vs the measured
            11964.47, 0.48%); the k_fft-aligned median would need alpha = 4.88.
        - >-
            Consequently all three of the record's observations fail: there is no
            normalization asymmetry; the aligned statistics are an incorrect unit
            conversion; and EV-MLKEM-011 did not "overstate the T-gap by factor 3" — its
            raw figures were already on the correct common scale.
        - >-
            Separately, the same counting-resolution confound that narrows EV-MLKEM-011
            applies to this record's `fraction_inside = 0` and `T_gap ≈ 421`, and bites
            harder there: under its (incorrect) alignment the gap is only ~4 bits of
            survival probability below the floor, which would make the confound close to
            decisive.
        - >-
            Note on the frozen contract: EXP-MLKEM-013's literal falsification criterion
            ("Pwrong FFT/k_fft is NOT a constant multiple of the Pgood cosine sum") is not
            triggered — it IS a constant multiple. The multiple is 1. The criterion was
            written in a form that could not catch this failure.

      non_confounded_restatement: >-
        In kevin-carrier/CodedDualAttack at commit 9c1367f, the file
        verifyModel/ScoreExperimentalDistribution/FFT_sample.py (sha256
        2a5f3dedceb68b0836efc92f0b58294ce4193a9553493e7c0d4e4ce67b922531) computes
        FFT_sample.FFT() as numpy.fft.fftn(T).real / k_fft over a table T whose
        accumulation loop adds each dual-vector phase len(decoded) = k_fft times. The
        two factors cancel: on shared inputs FFT_sample.FFT() reproduces
        Score_Function.compute_score() with ratio 1.000000000000 (max absolute
        deviation 1.1e-13 over five (q, k_fft, m, N) settings), and the ratio becomes
        exactly 1/k_fft only if the duplicated loop is removed. There is therefore NO
        k_fft normalization asymmetry between the archived Pwrong and Pgood score
        files, and no scale alignment is warranted. Independently, the empirical
        standard deviations of the two archived Pwrong survival functions (113.7914 and
        113.9783) match sqrt(avg_N/2) = 113.95 rather than sqrt(avg_N/2)/k_fft = 37.98,
        placing both files on the raw cosine-sum scale under the paper's own Model 4.7.
        The correct common-scale figures are the uncorrected ones: Pgood
        min/median/max = 6667.673616 / 11964.473718 / 17822.813537 against a Pwrong
        instrument whose resolvable range ends at score 1802. Nothing here is a claim
        about ML-KEM security, and nothing here says Approximation 4.9 is wrong.

      what_must_be_withdrawn:
        - >-
            the finding "Carrier verifyModel uses inconsistent normalization";
        - >-
            `scale_factor_k_fft = 3` and every statistic derived from it
            (2222.557872 / 3988.157906 / 5940.937846, T-gap 420.557872);
        - >-
            "Uncorrected EV-MLKEM-011 ... overstated the T-gap";
        - >-
            "after alignment H-MLKEM-011 still holds" and "the qualitative disjointness
            claim survives".
      what_stands:
        - >-
            the two literal method-body quotations, which are true but incomplete;
        - >-
            nothing load-bearing.

  # ------------------------------------------------------------------
  # 4. ADJUDICATION OF THE OBJECTION ITSELF
  # ------------------------------------------------------------------
  objection_adjudication:
    RT_20260802_3a440d_O2_core_arithmetic: upheld_and_exact
    RT_20260802_3a440d_O2_conclusion_in_kind: upheld
    corrections_to_the_objection:
      - id: C1
        statement: >-
          O2 presents "the recorded floor equals the resolution limit to four decimal
          places" as the artifact tell. That coincidence is close to automatic: for any
          counting survival estimator the smallest positive reported value is
          necessarily an integer multiple of 1/(total count), and being exactly 1x is
          the generic case whenever the top unit-width bin holds one sample. The
          genuinely load-bearing fact is the stronger one I verified: EVERY value in
          both files is an exact integer multiple of the quantum (max relative
          deviation 1.36e-16 over 1804 lines and 1.815e-16 over 2311), which is what
          establishes these are unsmoothed pooled counts whose support endpoint is
          budget-determined by construction.
      - id: C2
        statement: >-
          O2's third table row (nb_iteration=1, recorded -23.74) is not checkable from
          repository bytes: that data file is not archived here. Only the floor
          arithmetic -log2(241^3) = -23.738668 reproduces.
      - id: C3
        statement: >-
          O2 concludes the gap "is set by the authors' sample budget" and points to
          Ducas-Pulles as the existence proof that the control is runnable, implying
          the gap would close at a larger budget. On the corrected raw scale that is
          wrong by ~90-120 bits: closing it by counting at the Fig 4.1 parameters needs
          ~2^105 to ~2^129 iterations (R10). The obstruction is not budget parsimony;
          it is that a counting estimator cannot reach a 2^-129 survival probability at
          all. This makes the objection's diagnosis right and its remedy wrong.
      - id: C4
        statement: >-
          O2 (and O10, and D5) inherit EV-MLKEM-013's k_fft alignment when quoting
          "aligned Pgood minimum at score 2222.56, some 420.56 units beyond where that
          budget expires". That alignment is void (R6, R7). The correct figure is
          4865.67 units to the Pgood minimum and 10162.47 to the operating threshold.
    validation_report_D5_assessment: >-
      TASK-20260802-103 defect D5 recorded the same identity, correctly and
      quantitatively, at severity `low` with `affects_verdict: false` and a note that
      it "strengthens Q3's answer rather than weakening it". That reading is right and
      this review agrees with it: the confound explains why the measurement does not
      exist rather than showing the records' numbers are wrong. D5's proposed remedy —
      a superseding note on phrasing — is the correct remedy for EV-MLKEM-011. It is
      NOT sufficient for EV-MLKEM-013, whose defect is arithmetic, not phrasing, and
      which D5 did not detect.

  # ------------------------------------------------------------------
  # 5. CONTROL AND CLOSURE OBLIGATIONS (docs/inventor-protocol.md)
  # ------------------------------------------------------------------
  control_checks:
    - name: null object of the same shape
      status: present_in_the_upstream_experiment
      detail: >-
        The Pwrong measurement IS the null-object control for the Pgood measurement: it
        is the identical score function evaluated on a uniform (wrong) target. That
        part of the design is sound and the program should say so.
    - name: decay control on the destroying parameter
      status: absent
      detail: >-
        The reported quantity is a support endpoint; the parameter meant to move it is
        nb_iteration. It was never varied under otherwise-fixed parameters. The three
        archived files differ in n, n_lat, beta_0, beta_1 and avg_N as well as in
        nb_iteration, so none is a matched-budget control for another. This absence is
        the reason the records' phrasing could not be checked at the time.
    - name: predicted behaviour stated
      status: absent_from_the_records_supplied_here
      detail: >-
        Neither record states what the reported quantity SHOULD do as nb_iteration
        grows. It should move: the endpoint tracks -log2(nb_iteration * q^k_fft)
        exactly, as R1/R2 confirm across the two files that are archived.
    - name: model curve recomputed and compared over the measured band
      status: never_attempted_by_the_program
      detail: >-
        Approximation 4.9's predicted survival curve has never been recomputed by this
        program and overlaid on the archived measurement. That comparison is the only
        direct validation the archived bytes can support, it costs no new sampling, and
        it is the concrete forward action recommended below.
  closure_standard:
    lane_declared_dead: false
    named_obstruction: >-
      At the Fig 4.1 parameters (q=241, k_fft=3, avg_N≈25971) the experimental Pwrong
      is a counting estimator with resolution 1/(nb_iteration * q^k_fft) = 2^-35.7045,
      while the threshold at which Pgood ≈ 1/2 sits at score ≈ 11964 where the file's
      own measured tail slope puts Pwrong at roughly 2^-129 to 2^-153. The obstruction
      is a ~93-117 bit dynamic-range deficit, not an unattempted measurement, and no
      feasible increase in nb_iteration removes it.
    forward_guidance:
      - >-
        F1 (cheap, no sampling, highest value). Implement Approximation 4.9's integral
        (page23/page25 extracts, equations 4.22-4.24) at the Fig 4.1 left- and
        right-panel parameters and compare the predicted survival curve against the
        archived measurement pointwise over the band the instrument actually resolves,
        Pwrong ∈ [2^-35.70, 2^-1] (and [2^-36.29, 2^-1] for the right panel). Report
        the signed discrepancy and, critically, its TREND in T. The paper itself says
        the right panel "suggests our analysis may be slightly optimistic" (page25
        extract); quantifying that is a real measurement the archive supports and the
        program has never made.
      - >-
        F2. Feed F1's discrepancy trend into the existing HEUR-S1 lever: KN-FIND-013 /
        EV-MLKEM-012 already quantify that only ~9.46 / 14.36 / 14.76 bits of Pwrong
        miss erase the CC NIST shortfalls for Kyber-512/768/1024. A measured
        per-decade drift over the resolved band, plus a stated extrapolation
        assumption, converts "unvalidated extrapolation" into a bounded sensitivity
        statement. It does not convert it into a security claim.
      - >-
        F3 (control, cheap). Re-run verifyModel at two or three values of nb_iteration
        with all other parameters fixed, and confirm the support endpoint moves as
        -log2(nb_iteration * q^k_fft) predicts. This is the missing decay control. It
        also fixes the second archival gap: emit per-iteration exceedance counts so the
        effective replicate count, and hence the instrument's true resolution, becomes
        recoverable (R11).
      - >-
        F4 (harder, and the only route to the operating threshold). A counting
        estimator cannot reach 2^-129. Reaching it needs a rare-event estimator —
        importance sampling / tilting of the dual-vector or decoding-distance
        distribution, or bucketed enumeration of the kind Ducas-Pulles use for the
        non-polar score. Whether such an estimator can be built for the polar-coded
        score with a defensible change of measure is genuinely open and is the right
        successor question.
      - >-
        F5. Archive Algorithm.py (sha256 7451846c... is in the input manifest at line
        141 for Algorithm.py; the .out producer path is there) so that the question
        "which code path wrote these files" is answerable from repository bytes. Its
        absence is what allowed the EV-MLKEM-013 error to stand.

  # ------------------------------------------------------------------
  # 6. ARCHIVAL AND ARTIFACT-POLICY DEFECTS FOUND (validator-grade)
  # ------------------------------------------------------------------
  artifact_defects:
