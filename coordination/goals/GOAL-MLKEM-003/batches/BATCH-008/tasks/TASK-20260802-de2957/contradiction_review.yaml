  # ------------------------------------------------------------------
  # 8. SCOPE, LIMITATIONS, NON-CLAIMS
  # ------------------------------------------------------------------
  scope:
    parameters_analysed: q=241, m=40, n=43 and n=50, n_fft=8, k_fft=3, avg_N≈25971
    scale: toy. AGENTS rule 7 applies without exception.
    conclusions_bind_only: >-
      the archived Carrier verifyModel outputs at the two Fig 4.1 parameter sets, the
      archived FFT_sample.py at commit 9c1367f, and the two evidence records named.
  limitations:
    - >-
        numpy is not installed in this session. numpy.fft.fftn was replaced by a direct
        evaluation of its documented definition, self-checked against a closed form. The
        identity R6 is also derivable by hand from the code text; both agree.
    - >-
        The third archived Pwrong file (nb_iteration=1, avg_N=200001) is not in the
        repository, so BATCH-007's row for it was not verified (R3).
    - >-
        Algorithm.py is not archived, so which code path wrote the .out files is not
        determinable from repository bytes. R7 does not depend on this.
    - >-
        R8's alpha was scanned, not read from any archived source; it is corroborative
        only.
    - >-
        R10's extrapolation of the measured tail slope beyond the measured range is a
        diagnostic under a stated functional assumption, not a measurement. No verdict
        rests on it as evidence for a distributional claim; it is used only to size the
        instrument deficit and to reject the "just run longer" remedy.
    - >-
        The archive has no per-iteration breakdown, so the instrument's effective
        resolution is bounded below by 2^-35.7045 and is not determinable exactly (R11).
    - >-
        No G6K run, no new sampling, and no network retrieval was performed. Budget used:
        well under the granted 2400 s / 4 GB / 1 run.
  non_claims:
    - >-
