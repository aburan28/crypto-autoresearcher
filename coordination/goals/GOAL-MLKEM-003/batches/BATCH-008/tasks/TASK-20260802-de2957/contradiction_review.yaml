        "[1000,1200]": -0.010054
        "[1200,1400]": -0.011294
        "[1400,1600]": -0.006112
        "[1600,1802]": -0.012797
      measured_vs_pure_gaussian_at_the_floor:
        T: 1802
        z_equals_T_over_empirical_sd: 15.8360
        measured_log2_survival: -35.704452
        pure_gaussian_log2_survival_at_that_z: -186.2151
        excess_of_measured_over_gaussian_bits: 150.51
      tail_count_structure:
        first_T_with_count_10: 1490
        first_T_with_count_5: 1617
        first_T_with_count_2: 1682
        first_T_with_count_1: 1741
        number_of_T_with_count_1: 62
        number_of_T_with_1_le_count_le_10: 313
      finding: >-
        Nothing in the archived data indicates the wrong-guess distribution ends near
        1802, and two things indicate the opposite. (a) The measured log-survival
        FLATTENS as T grows — the slope magnitude falls from 0.0455 bits/unit on
        [400,600] to about 0.010 bits/unit past T=1000. A distribution approaching a
        genuine right endpoint steepens; it does not flatten. (b) At the floor the
        measured survival exceeds the pure N(0, avg_N/2) survival by ~150 bits, so the
        tail there is carried entirely by the model's D component, which Model 4.7 does
        not truncate. Conclusion: the archived data affirmatively favours "there is mass
        beyond 1802 that the instrument cannot count" over "there is no mass there".

