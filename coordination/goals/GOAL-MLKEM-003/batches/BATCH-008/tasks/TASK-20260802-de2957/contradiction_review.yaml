    - id: R6
      name: >-
        k_fft normalization identity, recomputed directly from the archived
        FFT_sample.py that EV-MLKEM-013 cites
      method: >-
        numpy is not installed in this session, so numpy.fft.fftn was replaced by a
        direct evaluation of its documented definition
        A[k] = sum_n a[n] exp(-2*pi*i*k.n/q) per axis; that implementation was
        self-checked against the closed form for a single-delta table (exact).
        Everything else — the accumulation loop in init(), the /k_fft in FFT(), and
        Score_Function.compute_score() — was transcribed verbatim from the archived file.
      load_bearing_source_lines:
        L18: "for i in range(len(decoded)):"
        L19: "self.T[tuple(decoded)] += math.e**((2j*math.pi/self.q) * dot_product(dual_vector,target,self.q))"
        L21: "self.T_FFT = numpy.fft.fftn(self.T).real/self.k_fft"
        L30: "self.F += math.cos((2*math.pi/self.q)*(dot_product(dual_vector,error,self.q) - dot_product(decoded,z,self.q)  ))"
      mechanism: >-
        init() adds each dual-vector phase into T[tuple(decoded)] len(decoded) times.
        T has shape (q,)*k_fft and T[tuple(decoded)] is used as a scalar accumulator,
        which forces len(decoded) == k_fft. So the table carries a factor k_fft, and
        FFT()'s /k_fft cancels it exactly.
      results_code_as_written:
        - {q: 7,  k_fft: 3, m: 5, nvec: 20, max_abs_FFT_minus_raw: 3.963e-14, ratio_FFT_over_raw: [1.000000000000, 1.000000000000]}
        - {q: 7,  k_fft: 3, m: 5, nvec: 60, max_abs_FFT_minus_raw: 4.563e-14, ratio_FFT_over_raw: [1.000000000000, 1.000000000002]}
        - {q: 11, k_fft: 2, m: 4, nvec: 40, max_abs_FFT_minus_raw: 4.918e-14, ratio_FFT_over_raw: [1.000000000000, 1.000000000001]}
        - {q: 5,  k_fft: 4, m: 6, nvec: 30, max_abs_FFT_minus_raw: 1.688e-14, ratio_FFT_over_raw: [1.000000000000, 1.000000000000]}
        - {q: 13, k_fft: 3, m: 7, nvec: 50, max_abs_FFT_minus_raw: 1.061e-13, ratio_FFT_over_raw: [0.999999999985, 1.000000000004]}
      results_counterfactual_duplicated_loop_removed:
        - {q: 7,  k_fft: 3, ratio_FFT_over_raw: 0.333333333333, equals_one_over_k_fft: true}
        - {q: 11, k_fft: 2, ratio_FFT_over_raw: 0.500000000000, equals_one_over_k_fft: true}
        - {q: 5,  k_fft: 4, ratio_FFT_over_raw: 0.250000000000, equals_one_over_k_fft: true}
      verdict: >-
        EV-MLKEM-013's primary metric `scale_factor_k_fft` recomputes to 1, NOT 3.
        There is no k_fft normalization asymmetry in the archived code. The
        `synthetic_check` recorded in RUN-MLKEM-013-001/results.json
        ("raw cosine sum == fftn.real (no /k_fft); FFT/k_fft == raw/k_fft exactly")
        is what one obtains by building the table WITHOUT the duplicated loop — i.e.
        the recorded check did not exercise the archived init().

    - id: R7
      name: >-
        independent corroboration from the data itself — which score scale are the
        archived Pwrong files on?
      basis: >-
        The paper's own Model 4.7 (page23 extract): F_wrong ~ D + N(0, N/2). So
        Var(raw) = avg_N/2; if the file were on a raw/k_fft scale, Var would be
        avg_N/(2 k_fft^2).
      method: >-
        E[F^2] = 2 * sum_{t>=1} (2t-1) P(F >= t), the exact identity for an
        integer-grid symmetric variable, applied to the archived survival column.
        Symmetry is supported by the files themselves: P(F >= 0) = 0.499003 and
        0.498251.
      results:
        - file: Pwrong_...n43...N25971.out
          empirical_sd: 113.7914
          sqrt_avg_N_over_2: 113.9539
          ratio_measured_over_raw_prediction: 0.998574
          sqrt_avg_N_over_2_div_k_fft: 37.9846
          ratio_measured_over_aligned_prediction: 2.995722
        - file: Pwrong_...n50...N25970.out
          empirical_sd: 113.9783
          sqrt_avg_N_over_2: 113.9517
          ratio_measured_over_raw_prediction: 1.000233
          sqrt_avg_N_over_2_div_k_fft: 37.9839
          ratio_measured_over_aligned_prediction: 3.000698
      verdict: >-
        Both archived Pwrong files are on the RAW cosine-sum scale, to within 0.15% in
        two independent files, and are off the /k_fft scale by exactly a factor of
        k_fft = 3. This is independent of which script wrote the files and therefore
        does not depend on R6.

    - id: R8
      name: >-
        corroboration for the Pgood file's scale via Approximation 4.8 (weaker;
