    - id: A3
      severity: medium
      location: EV-MLKEM-011 proof_refs
      statement: >-
        proof_refs lists experiments/EXP-MLKEM-011/runs/RUN-MLKEM-011-001/results.json
        and the two .out files; the third archived Pwrong file
        (...beta037_beta144_N200001.out) that BATCH-007's O2 tabulates is not in the
