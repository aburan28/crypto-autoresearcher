  gate_checks:
    - id: G1
      name: resolved-band check
      question: >-
        Did the comparison stay inside [2^-35.70, 2^-1] / scores 0..1802 for the
        q=241/m=40/n=43 file, with no extrapolation past the counting floor?
      answer: PASS
      evidence:
        - "per_score has exactly 1803 rows over [0,1802] (n=43) and 2310 rows over [0,2309] (n=50); no row carries measured <= 0"
        - "resolved band probability [1.7860305406935986e-11, 0.4990028428783925] = [2^-35.70445229, 2^-1.00288006], recomputed from the raw bytes"
        - "fit grid band[::20]+last, exponent-scan grid band[::40]+last, anchors 213/1492 and 214/1968, and the K-solved profile (scores 643-1492, 600-1968) are all slices of the band"
        - "the floor is 1/(nb_iteration*q^k_fft), i.e. the instrument's sampling resolution, and the package states this in instrument.note rather than reading the estimator's own bottom as data"
        - "no fit, anchor, scan point, statistic or plotted value lies at or beyond the first zero score"
      caveat: >-
        scale_check sums its moment series over the whole file column including
        the trailing zeros. Those contribute exactly 0, so no unmeasured value is
        used as a value, but the second moment is biased low by the unresolved
        tail (bounded by ~6e-5 relative). It does not affect the raw-vs-/k_fft
        conclusion. Limitation, not a violation.
    - id: G2
      name: score-scale check
      question: >-
        Did the comparison use the raw score scale, given the known
        Pwrong = fftn/k_fft vs Pgood = raw cosine sum asymmetry with k_fft = 3?
      answer: PASS - raw, undivided cosine-sum scale; no k_fft alignment anywhere
      evidence:
        - "moment estimators reproduced: sigma ratios 0.9996/0.9986 (n=43) and 1.0020/1.0002 (n=50) against sqrt(avg_N/2), versus 2.9987/2.9957 and 3.0060/3.0007 against a /k_fft scale"
        - "source corroboration the package does not use: experiments/EXP-MLKEM-013/vendor-lock/FFT_sample.py line 30 defines the score as an unnormalised sum of cosines, whose wrong-guess second moment is N/2"
        - "parameter-free positive control: Q(T) = 0.5*erfc(T/sqrt(N)), zero free parameters, tracks the measurement within 0.1 bit up to score 322 (n=43) / 273 (n=50); a factor-3 scale slip would be immediately visible and is not present"
        - "code audit: k_fft enters only the counting denominator, the /k_fft ratio diagnostic and prose; it multiplies or divides no score and no prediction"

  control_checks:
    - id: C1
      control: parameter-free positive control (Model 4.7's Gaussian component)
      kind: positive
      status: passed
      detail: >-
        Q(T) with N from the header and no free parameter tracks the measurement
        within 0.1 bit over scores 0-322 / 0-273 and is 149.993 / 265.557 bits
        below it at the floor. Both ends reproduce. This simultaneously validates
        the score scale and the use of avg_N.
    - id: C2
      control: model-family control (free-exponent scan)
      kind: negative
      status: passed
      detail: >-
        The one-parameter family is not degenerate: whole-grid rms rises to 1.96 /
        2.35 bits at p=10 and 3.63 / 4.38 bits at p=40 against 0.692 / 0.694 at
        the archived exponents. Reproduced from the committed diagnostic, which is
        itself byte-reproducible from the script.
    - id: C3
      control: null object of the same shape (inventor-protocol section 3)
      kind: null_object
      status: absent
      detail: >-
        The package never runs the same one-parameter fit against a structurally
        null survival curve of the same shape. The exponent scan is a
        within-family sensitivity, not a null object. Because the package reports
        a goodness-of-shape comparison rather than a correlation, bias or excess,
        this is not fatal, but it is the reason the "tracks across 34.7 bits"
        sentence is not a measurement of the model's specificity.
    - id: C4
      control: nearby-object control run by this validator
      kind: nearby_object
      status: informative_negative
      detail: >-
        Fitting the model built from one file's archived (p, N) to the other
        file's measured curve, one free K, whole-band rms: n=43 data under its own
        p=26 gives 0.7055 but under the n=50 file's p=24.5 gives 0.4965 (BETTER);
        n=50 data under p=26 gives 1.0204 versus 0.6969 under its own p=24.5. The
        discrimination is one-sided: the n=43 measurement fits the other file's
        archived exponent better than its own. This is the same fact as the
        producer's own section 4.4 (both files prefer p about 2 lower) in a form
        the free K cannot absorb. Disclosed in substance by the producer; recorded
        here because it bounds what "tracks" is entitled to mean.

  heuristic_validation_checks:
    - id: H1
      check: pre-registered prediction
      status: failed_as_stated_but_disclosed
      detail: >-
        The theoretical prediction is NOT parameter-free. Phi_dlsc, alpha and
        Phi's constants are unavailable, so the curve carries one free scale K
        that is FITTED TO THE DATA BEING COMPARED. Under the validator's
        heuristic-validation rule 1 a prediction whose normalisation is fitted
        after seeing the data is not a validation of that normalisation. The
        producer states this repeatedly and plainly (section 2 "this is a
        shape-and-relative comparison with one free normalisation, not an
        absolute-level test"; section 5.1; section 7). The SHAPE, given the
        archived exponent p, is pre-registered by the archived integers; the LEVEL
        is not tested at all.
    - id: H2
      check: sample integrity - sample size, procedure, and recomputation from raw
      status: passed
      detail: >-
        nb_iteration and all instrument parameters come from each file's own
        header; the empirical survival function and its counting floor were
        recomputed here from the raw bytes, not copied. No new sampling occurred
        and no seed exists (deterministic recomputation), correctly recorded.
        Header-vs-caption disagreement on nb_iteration (6000 vs 4000, n=50) is
        disclosed; the header value is additionally FORCED by the file's own
        quantisation, an argument the producer had available and did not make.
    - id: H3
      check: correspondence validity (substitute sampling)
      status: not_applicable
      detail: >-
        No correspondence substitutes for direct sampling here. The measurement is
        a third-party archived simulation of Algorithm 3.1 read as bytes.
    - id: H4
      check: scale binding
      status: passed
      detail: >-
        Toy parameters (q=241, m=40, n=43/50, n_fft=8, k_fft=3) are recorded as a
        limitation in the report section 7, the receipt non_claims and the results
        JSON. No crypto-scale claim is made anywhere in the package (AGENTS.md
        rule 7 respected). The archived Kyber-scale tables (C.1/C.2) are read but
        never used to extrapolate.
    - id: H5
      check: heuristic numbering and conditional framing
      status: passed
      detail: >-
        The package names Approximation 4.6, Model 4.7, Approximation 4.8 and
        Approximation 4.9 explicitly and keeps the comparison scoped to 4.9, with
        the good-guess statement 4.8 correctly excluded from the Pgood file's
        treatment. It asserts neither validation nor refutation of 4.9.

