  proof_architecture_checks:
    - id: P1
      check: baseline fixture - the archived formulas reproduce exactly
      status: passed
      detail: >-
        I verified the load-bearing identities numerically, in this session:
        (i) the (4.22) weight normalises to exactly the product of an N(0,N/2)
        density in t and an N(mu_lsc, sigma_lsc^2) density in d_lsc - integral
        2419.3413118413 against pi*sigma*sqrt(2N) = 2419.3413118416, ratio
        1.000000000000; (ii) the first factor of (4.19) is exactly
        E_{d~N(mu,s^2)}[exp(-alpha pi^2 d^2/q^2)] - ratio 1.000000000000 at alpha
        in {0.5, 2, 7}; (iii) the second factor of (4.19) is exactly the
        beta_sieve-ball-norm average of exp(-alpha(pi x/q)^2); (iv) the closed
        form G(b,n) = Gamma(b/2)Gamma(n/2)/(2(b+n)Gamma((b+n)/2)) checks to ratio
        1.000000 at (b,n) in {(4,2),(6,4),(3,5)}.
    - id: P2
      check: strictness witness for an improvement claim
      status: not_applicable
      detail: The package claims no improvement over anything.
    - id: P3
      check: interface preservation - what the reading of Phi costs
      status: failed
      detail: >-
        The step from (4.19) to Phi_dlsc(x,y) = exp(-(a x^2 + b y^2)) is described
        as FORCED by the archive. It is not: (4.19) pins the dependence on
        x = ||w_lat|| and shows a Gaussian dependence on the decoding distance
        d_lsc, but constrains nothing about y = ||w_lsc||, which is Phi's second
        argument in (4.17)/(4.23) and which is what carries n_fft into the
        exponent p. See D4.
    - id: P4
      check: quantifier fidelity of the d_lsc average
      status: failed
      detail: >-
        Archived (4.22) specifies E_{d_lsc}[min(1, K(d_lsc) L^p)]; the script
        computes min(1, Kbar L^p). min(1,.) is concave, so by Jensen the collapsed
        form is an UPPER BOUND on (4.22), exact only where the clip does not bind.
        The two headline divergences sit at clipped fractions 0.361 and 0.381. The
        script's docstring states the condition; no bound on the resulting error
        is given. See D5.
    - id: P5
      check: method ceiling and nearby-object control
      status: incomplete
      detail: >-
        The exponent scan is a within-family sensitivity. The nearby-object
        control (C4) was supplied by this validator, not by the package, and its
        result is one-sided against the archived exponent for the n=43 file.

  defects:
    - id: D1
      severity: minor
      title: reported fitting method does not match the executed code
      detail: >-
        comparison_report.md section 3 describes K_fit as "least squares on log2
        residuals over the resolved band". The script fits on band[::20] plus the
        last score - 92 points (n=43) and 117 points (n=50) - and its own stdout,
        embedded in comparison_results.json -> stdout_log, says so verbatim
        ("92-point subsample of the resolved band"). Numerically immaterial: my
        whole-band fit gives -72.711622 against the committed -72.712581. But the
        report's stated method is not the method executed.
      affects_a_reported_number: false
    - id: D2
      severity: minor
      title: report prose contradicts its own recorded data on the drift statistic
      detail: >-
        Section 4.3(1) says the per-score solved scale "drifts by only 1.150 bits
        (n=43, over scores 643-1492, range -73.298 ... -72.038)". The quoted range
        spans 1.2604 bits. The JSON carries both statistics correctly and
        separately (drift_bits_low_to_high 1.1504; min -73.29806, max -72.03763).
        Same for n=50: 1.238 quoted against a min/max span of 1.3603
        (drift_bits_low_to_high 1.2377; min -67.94249, max -66.58214). The
        sentence understates the spread by 0.11-0.12 bits.
      affects_a_reported_number: true
    - id: D3
      severity: moderate
      title: delta(beta_bkz) is over-declared UNAVAILABLE, and a stated conclusion rests on that
      detail: >-
        Report section 2 lists delta(beta_bkz) as UNAVAILABLE with "No archived
        numerical value", and section 2 concludes "the absolute level of
        Approximation 4.9 cannot be checked from the archived extracts at all,
        because delta(beta_bkz) is missing ... No substitute bound would be
        meaningful." But experiments/EXP-MLKEM-013/vendor-lock/utilitary.py line
        16, in the same hash-verified vendor-locked upstream tree that produced the
        Pwrong data, defines root_hermite_factor(beta), i.e. delta(beta). I
        evaluated it: delta(32) = 1.012528410, delta(35) = 1.012604644, hence
        delta^1364 = 2^24.501 and delta^1681 = 2^30.377. The archived (4.24)
        already substitutes Lemma 2.9's result inline as the
        delta^{beta_sieve(m+n_lat-beta_sieve)} factor, so Lemma 2.9 is not
        separately needed either. What actually blocks the absolute level is alpha
        together with Phi's exact functional form. The conclusion is directionally
        right but attributed to the wrong missing quantity, and "no substitute
        bound would be meaningful" is stronger than the archive supports. Note
        that the report claims an explicit repository-wide search only for Phi, not
        for delta.
      affects_a_reported_number: false
    - id: D4
      severity: moderate
      title: the derivational status of the Phi reading is overstated
      detail: >-
        Report section 2 and the script's STEP 2 say the archived (4.19) "forces"
        Phi to be exponential in a negative quadratic form of the two lengths. I
        verified that (4.19)'s two factors are exactly the d_lsc-Gaussian average
        and the beta_sieve-ball-norm average of exp(-alpha(pi*length/q)^2), so the
        dependence on x = ||w_lat|| is indeed pinned. The dependence on
        y = ||w_lsc|| - Phi's SECOND argument, and the one that carries n_fft into
        p = (beta_sieve+n_fft)/2 - is not constrained by (4.19) at all; it is
        inferred by analogy with the d_lsc factor. The report contradicts itself,
        correctly, elsewhere ("The adopted reading of Phi is declared, not
        archived"; section 5.2). The producer's own exponent scan shows the data
        prefer r about 2.2 rather than r = 2, i.e. precisely the unconstrained
        half of the reading.
      affects_a_reported_number: false
    - id: D5
      severity: moderate
      title: the d_lsc average is collapsed to a constant, and the collapse is least valid exactly where the headline divergence peaks
      detail: >-
        Archived (4.22) integrates over d_lsc INSIDE min(1, integral over E(T-t)),
        and E depends on d_lsc through Phi_dlsc. The script replaces
        E_{d_lsc}[min(1, K(d_lsc) L^p)] by min(1, Kbar L^p). Its docstring states
        the reduction is exact only in the unclipped regime and reports the clipped
        fraction per score, which is honest; but no bound on the collapse error is
        given, and the two headline divergences (+1.516 bits at score 471, +1.710
        at score 420) sit at clipped fractions 0.361 and 0.381. Because min(1,.) is
        concave, Jensen makes the collapsed model an upper bound on (4.22), i.e. the
        bias has the same sign as the reported over-prediction in exactly that
        region. I did not quantify the size: doing so requires a further declared
        reading of how d_lsc enters Phi's quadratic form, and adding my own
        unarchived assumption to a package under validation would not be a check.
      affects_a_reported_number: true
    - id: D6
      severity: minor
      title: receipt budget fields contradict each other
      detail: >-
        receipt.json records maximum_runs_allowed 1, script_executions_performed 2,
        and budget_exceeded false. Two executions against a declared maximum of one
        is an overrun and the last two fields cannot both be right. The overrun
        itself is fully and creditably disclosed, with the superseded execution's
        defect named and its changed numbers quoted.
      affects_a_reported_number: false
    - id: D7
      severity: minor
      title: superseded artifact overwritten in place, making one receipt claim unverifiable
      detail: >-
        Execution 1's comparison_results.json was overwritten at the same path, so
        the receipt's "bit-identical between the two runs" claim cannot be checked
        (recorded as M21 unable_to_check). The direction of the disclosed change
        was unfavourable-to-favourable (shape drift 15.39 -> 1.15 bits), which is
        the case where preserving the superseded artifact matters most. AGENTS.md
        rule 4 makes results immutable and corrections superseding rather than
        overwriting; overwriting a superseded run output in place sits against that
        rule even though the change was disclosed.
      affects_a_reported_number: false
    - id: D8
      severity: minor
      title: recorded timestamps that cannot all be true
      detail: >-
        comparison_results.json records generated_at_utc 2026-08-02T23:31:21Z
        (written from the run's start) with wall_clock_seconds 242.965, so the
        final execution ran 23:31:21-23:35:24Z. receipt.json records
        final_script_execution_started_utc 23:47:36Z and task_completed_utc
        23:58:00Z; the latter is after the snapshot commit (author date
        23:49:11Z) whose committed blob already contains that string, i.e. a
        completion time was written before it occurred. The receipt designates
        generated_at_utc authoritative and the two wall-clock figures (243.078 vs
        242.965) are mutually consistent, so this is bookkeeping rather than a
        fabricated measurement - but a recorded time that had not happened is a
        defect under the artifact policy.
      affects_a_reported_number: false
    - id: D9
      severity: cosmetic
      title: a self-description that is factually backwards
      detail: >-
        Report section 5(6) and receipt.json anomalies explain the Pgood median
        difference from EV-MLKEM-018 by saying this run "takes the lower of the two
        central order statistics rather than their average". Recomputed: sorted
        v[1999] = 11964.145101, v[2000] = 11964.802334; the reported 11964.802334
        is the UPPER central order statistic. Nothing depends on it.
      affects_a_reported_number: false
    - id: D10
      severity: minor
      title: kink handling in the quadrature, and the accuracy of the clipped-fraction column
      detail: >-
        The script integrates min(1, K v^p) through its kink at v* = K^{-1/p} on a
        fixed panel grid and reports clipped_fraction_of_pred_Kfit by classifying
        quadrature nodes. Because the integrand is continuous the totals are barely
        affected - my exact-split implementation agrees with the committed
        predictions to at most 0.00066 bits - but the clipped-fraction column is
        accurate only to about 3% relative (mine 0.1409 / 0.3831 / 0.3765 against
        the committed 0.13712 / 0.36876 / 0.36115 at scores 0 / 360 / 471), which
        moves the clip-negligible sub-band boundary by one score (755 vs 756). The
        script's two quadrature self-checks (the K -> infinity limit and
        coarse-vs-fine J) both probe regimes with no interior kink, so neither
        bounds this error.
      affects_a_reported_number: true
    - id: D11
      severity: cosmetic
      title: reproduction note does not name every run-dependent field
      detail: >-
        receipt.json reproduction_note names generated_at_utc and
        wall_clock_seconds as the fields that change on re-execution. My byte-level
        re-run reproduced the committed JSON exactly except for those two AND four
        per-stage elapsed-time strings inside stdout_log.
      affects_a_reported_number: false

  what_the_package_supports:
    - >-
      The measured Pwrong survival curves of the two archived verifyModel files,
      over the band the counting instrument resolved, recomputed exactly.
    - >-
      That a one-parameter family derived from Approximation 4.9 under a DECLARED
      reading of the unarchived Phi, with its exponent fixed by archived integers
      and its normalisation FITTED to the same data, tracks those curves to rms
      0.71 bits over the whole band and 0.28 bits over the sub-band where the
      prediction is carried by the D component.
    - >-
      That the direction of the residual (model above measurement below the
      crossover, below it above) is the same direction as the paper's own remark
      that its analysis "may be slightly optimistic". Whether it is the same
      effect is not adjudicated by the package and is not adjudicated here.
  what_the_package_does_not_support:
    - The absolute level of Approximation 4.9 - untested, by construction.
    - Any statement about Approximation 4.9 below the counting floor.
    - Any validation or refutation of Approximation 4.9 as the paper states it.
    - Any ML-KEM, Kyber or FIPS 203 security claim, at any scale.
    - Any cost-model revision; COST-MLKEM-001 is untouched.
    - Any change of status for EV-MLKEM-011, EV-MLKEM-013 or EV-MLKEM-017.

  limitations:
    - >-
      Toy parameters only (q=241, m=40, n=43/50, n_fft=8, k_fft=3). Toy-scale
      evidence is never crypto-scale validation (AGENTS.md rule 7).
    - >-
      The comparison has one free normalisation fitted to the data it is compared
      against; it is a shape test, not a level test (H1).
    - >-
      Two archived files at two parameter points, un-replicated, from a
      third-party simulation this program did not run.
    - >-
      The pooled counting estimator's effective sample size is not recoverable, so
      the top of the band (counts 1-10) supports indicative reasoning only.
    - >-
      No null-object control of the same shape exists in the package (C3); the
      nearby-object control (C4) is mine and is one-sided against the archived
      exponent for the n=43 file.
    - >-
      AGENTS.md rule 12 is UNMET and UNWAIVED for this batch. This report changes
      no record status and treats no prior evidence record as corrected.
    - >-
      model_verified is false: no backend is reachable, so the resolved model
      identifier was not probe-verified. Not run, not asserted.

  verdict: passed
  verdict_scope: >-
    "passed" here means exactly what the Validator contract means by it: the
    package is an ADMISSIBLE research receipt for the recomputation it performed.
    It is not a verdict on Approximation 4.9, not evidence of any speedup, not an
    ML-KEM security statement, and not an authorisation to promote anything.
  package_verdict: ADMISSIBLE_WITH_DEFECTS
  package_verdict_rationale: >-
    Every quantitative claim I could check reproduced, most of them to the last
    printed digit, using an implementation deliberately independent of the
    producer's; the artifact binding is exact in three directions; the committed
    results JSON is byte-reproducible from the committed script apart from six
    timing fields; and both gate checks - resolved band and score scale - pass
    cleanly. Eleven defects are recorded. D1, D2, D6, D7, D8, D9 and D11 are
    bookkeeping or prose errors that change nothing computed. D10 changes one
    sub-band boundary by one score. D3, D4 and D5 are substantive: they do not
    alter any reported number, but they change what the report's headline sentence
    is entitled to mean - delta is available and the absolute-level claim is
    misattributed; the Phi reading is declared, not forced, in exactly the half
    that fixes the exponent; and the d_lsc collapse biases the reported peak
    divergence upward by an unquantified amount in exactly the region where that
    peak is reported. None of these is a fabrication, and every one of them is
    either self-disclosed elsewhere in the same package or discoverable from its
    own artifacts, which is why the verdict is ADMISSIBLE_WITH_DEFECTS rather than
    INADMISSIBLE.
  recommended_successor_work:
    - >-
      A scoped correction record for D3 (delta availability) and D2 (the drift
      sentence), superseding rather than editing the producer's immutable report.
    - >-
      A bounded task quantifying D5: re-evaluate (4.22) with the d_lsc integral
      kept inside min(1,.) under a declared K(d_lsc), and report how much of the
      +1.516 / +1.710 bit peak survives.
    - >-
      Retrieval of the page defining Approximation 4.6 and Phi_dlsc, which is the
      single change that would convert this from a shape test into a test.

