  control_checks:

    - control: "producer's non-degeneracy control on the exponent (p=10 and p=40 vs the declared p)"
      reproduced: true
      verdict: too_weak_for_the_weight_placed_on_it
      detail: >-
        Reproduced to <= 0.07 bits. But a fine sweep (p from 10 to 40 in steps of
        0.5, refitting K at each p) shows the basin is wide. Whole band:
        {p : rms <= rms at the archived p} = [20.5, 26.0] (n=43, width 5.5) and
