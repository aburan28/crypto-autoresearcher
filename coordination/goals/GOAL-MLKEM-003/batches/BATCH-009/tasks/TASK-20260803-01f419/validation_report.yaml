        [18.5, 25.5]; {p : rms <= 2 bits} = [10.0, 32.0] and [12.5, 30.0]. On the
        clip-negligible sub-band {p : rms <= 1 bit} widens to [15.0, 33.5] and
        [16.5, 29.5]. In BOTH files the archived exponent is the UPPER ENDPOINT
        of its own acceptance set: the whole-band optimum is p=23.0 (rms 0.427 vs
        0.706 at p=26) and p=22.0 (rms 0.431 vs 0.697 at p=24.5). p=10 and p=40
        sit 13-18 units from the optimum, far outside the basin, so the control
        as run tests a regime the data never made plausible. The report DOES
        disclose the preference for a lower exponent and derives r = 2.17/2.23;
        nothing is concealed. Defect D7.

    - control: "NULL-OBJECT CONTROL (inventor-protocol section 3) - required, NOT run by the producer; run here"
      reproduced: not_applicable
      verdict: fail_absent_from_package
      detail: >-
        Best two-parameter fit of log2(measured) on the clip-negligible AND
        count>=10 sub-band, one shape variable each, rms in bits (n=43 / n=50):
        a + b*log2 ln(N/T) (the Approximation 4.9 tail form) 0.1048 / 0.0987;
        a + b*T^(1/3) 0.1051 / 0.1007; a + b*sqrt(T) 0.1110 / 0.1541;
        a + b*log2 T 0.1242 / 0.1092; a + b*T 0.1723 / 0.3455;
        a + b*T^2 0.3481 / 0.7204. Over the window where Approximation 4.9's D
        component actually carries the prediction, its functional form is
        indistinguishable from a cube-root or log-power tail at the same number
        of free parameters; only the Gaussian shape is clearly excluded. Defect
        D8.

    - control: "effective-degrees-of-freedom check - not run by the producer; run here"
      reproduced: not_applicable
      verdict: qualifies_the_headline
      detail: >-
        (a) Lever arm: in the tail variable X = log2 ln(N/T) the sub-band spans
        only 0.3080 (n=43) and 0.4709 (n=50) - a third to a half of one octave.
        (b) Residual lag-1 autocorrelation 0.992 and 0.996; naive AR(1)
        effective sample size 3.1 of 737 points and 2.6 of 1242. The measurement
        is one pooled cumulative count from 4000/6000 iterations, so consecutive
        scores are nearly the same statistic. (c) Regime split: the parameter-free
        Q(T) carries >= 50% of the prediction for scores 0..234 and 0..172,
        covering 4.61 and 2.91 of the claimed 34.7 / 35.3 bits, and over that
        stretch Q alone with ZERO free parameters matches to rms 0.0100 and
        0.0059 bits. That part is Model 4.7, not Approximation 4.9. The report
        says this in section 4.3(6) but the headline sentence merges the regimes.
        Defect D9.

    - control: "confound between the reported divergence profile and the package's own K(dlsc) -> Kbar reduction - not tested by the producer; tested here"
      reproduced: not_applicable
      verdict: unstated_confound
      detail: >-
        The script itself states that collapsing K(dlsc) to one effective Kbar is
        exact only in the unclipped regime and is "an approximation rather than
        an identity" where the clip binds. min(1, K*L^p) is CONCAVE in K, so by
        Jensen the single-Kbar prediction is an UPPER BOUND wherever the clip
        binds - which is the sign of the reported divergence. Measured
        association: corr(residual, clipped fraction) = 0.916 (n=43) and 0.904
        (n=50); mean residual +0.959 / +1.103 where the clipped fraction exceeds
        1%, against -0.231 / -0.193 where it is below 0.1%. The residual peak
        sits at clipped fraction 0.377 / 0.378 and the clip peak at 0.388 / 0.400.
        Upper bound on the effect: zeroing the entire clip contribution moves the
        prediction by at most 0.682 and 0.685 bits at the residual peak, so this
        accounts for at most ~45% of the +1.516 / +1.710 peaks - a partial, not a
        complete, explanation. The report notes the coincidence with the clipped
        fraction but reads it only as the D-vs-Gaussian crossover, not as the
        region where its own reduction is not an identity, and does not state the
        direction of the bias. Defect D6.

    - control: "cross-file consistency of the fitted exponent - not extracted by the producer; extracted here (FAVOURABLE)"
      reproduced: not_applicable
      verdict: supports_the_declared_reading
      detail: >-
        On the clip-negligible AND count>=10 sub-band the FREE two-parameter tail
        fit recovers slope b = 26.515 against the archived-integer prediction
        26.0 (n=43) and b = 24.549 against 24.5 (n=50). The exact-model sub-band
        optimum shifts by exactly 1.50 between the two files (24.50 -> 23.00),
        matching the archived prediction dp = (44-41)/2 = 1.50; equivalently the
        generalised reading's r is 52/24.5 = 2.122 and 49/23.0 = 2.130, agreeing
        across two independent files to 0.4%. A pure fitting artifact would not
        have to pass a cross-file consistency check. This is the strongest single
        piece of support in the package and the producer did not extract it.
        Among integer/half-integer readings r in {1, 1.5, 2, 3, 4}, r=2 gives the
        lowest whole-band rms in both files (0.706 and 0.697 versus 5.943/6.282
        at r=1, 2.492/2.647 at r=1.5, 1.053/1.320 at r=3, 1.566/1.986 at r=4).

    - control: "positive/negative control per the frozen contract"
      status: not_applicable
      detail: >-
        The BATCH-009 handoff for TASK-20260802-8bae8e defines a completion gate
        (band, parameter sourcing, per-score reporting, no comparison past the
        floor) rather than positive/negative controls. All four gate items are
        met. The exponent scan is the package's own self-imposed control and is
        assessed above.

  # ---------------------------------------------------------------------------
  central_question_judgement:
    question: >-
      Is "Approximation 4.9 tracks the measurement with one free normalisation
      constant K" a result, or an artifact of fitting?
    answer: >-
      IT IS A REAL BUT MUCH WEAKER RESULT THAN THE FRAMING SUGGESTS, AND THE
      PRODUCER'S NON-DEGENERACY CONTROL IS NOT STRONG ENOUGH TO ESTABLISH THE
      SHAPE CLAIM. It is not, however, a fabrication or a pure fitting artifact:
      one specific piece of it survives a sharper test.
    supporting_findings:
      - >-
        DEGENERACY. Once K is free, a broad family of exponents fits comparably.
        {p : rms <= rms at the archived p} = [20.5, 26.0] and [20.0, 24.5];
        {p : whole-band rms <= 1 bit} = [18.0, 27.5] and [18.5, 25.5]. The
        archived exponent is the upper endpoint of its own acceptance set in both
        files, and the whole-band optimum is 3.0 and 2.5 units below it. The
        p=10 / p=40 control samples points 13-18 units from the optimum and so
        establishes only that the family is not COMPLETELY degenerate.
      - >-
        THE POINT COUNT IS NOT THE CONSTRAINT COUNT. In the region where the D
        component carries the prediction the model is log2 pred = log2 K + p*X
        with X = log2 ln(N/T), and X spans only 0.31 / 0.47 in the sub-band.
        Residual lag-1 autocorrelation is 0.992 / 0.996 (AR(1) effective sample
        size ~3 of 737 and ~3 of 1242). "Shape matching across ~1800 points" is,
        in the informative region, a one-parameter intercept on a short
        log-log line.
      - >-
        THE DYNAMIC RANGE IS TWO REGIMES. Of the quoted 34.7 / 35.3 bits, 4.6 and
        2.9 bits are carried by the parameter-free Gaussian Q(T), which matches
        there to rms 0.010 and 0.006 bits with ZERO free parameters. That is
        Model 4.7's success, not Approximation 4.9's.
      - >-
        NULL-OBJECT CONTROL FAILS TO DISCRIMINATE. On the informative sub-band,
        a + b*T^(1/3) fits at rms 0.1051 / 0.1007 against the Approximation 4.9
        tail form's 0.1048 / 0.0987. Structurally unrelated two-parameter shapes
        do as well.
      - >-
        THE DIVERGENCE PROFILE IS PARTLY THE PACKAGE'S OWN APPROXIMATION.
        corr(residual, clipped fraction) = 0.916 / 0.904, and Jensen's inequality
        fixes the direction; up to ~45% of the peak divergence is attributable to
        the single-Kbar reduction rather than to the model-versus-data comparison.
      - >-
        WHAT SURVIVES (favourable). The free-slope tail fit on the sub-band
        recovers 26.515 against an a-priori 26.0 and 24.549 against 24.5, and the
        exact-model sub-band optimum shifts by exactly the predicted 1.50 between
        the two files (r = 2.122 vs 2.130). That is a cross-file consistency check
        with no free parameter tuned to pass it, and it is genuine evidence that
        the declared reading of Phi captures something real about the data. It is
        also the part of the result the producer left on the table.
    consequence_for_downstream_use: >-
      The package may be cited as: over the resolved band of two toy-parameter
      archived files, a recomputation of Approximation 4.9 under a declared
      reading of the unarchived Phi, carrying one fitted normalisation, agrees
      with the measurement to rms 0.28 / 0.27 bits over the sub-band where its D
      component dominates, and the empirical tail exponent agrees with the
      archived-integer prediction to 0.5 and 0.05 units with the correct
      between-file shift. It may NOT be cited as evidence that the measurement
      SELECTS Approximation 4.9's functional form over alternatives, nor as any
      statement about the absolute level, nor about behaviour below the counting
      floor where the model is actually used.

  # ---------------------------------------------------------------------------
  heuristic_validation_checks:
    - item: pre-registered prediction
      status: partial
      detail: >-
        The theoretical prediction (Approximation 4.9) is a fixed archived
        artifact predating the comparison, so the shape is pre-registered. The
        exponent p is fixed by archived integers, not fitted. But ONE constant K
        is fitted to the same data it is tested against, and the functional form
        of Phi is a reading declared by the producer rather than an archived
        definition. Both are disclosed.
    - item: sample integrity
      status: pass
      detail: >-
        The "samples" are the archived pooled counting estimates. Sample size
        (nb_iteration 4000/6000, pooled over q^k_fft = 13,997,521 candidates),
        provenance and digests are recorded; I recomputed the survival values,
        the counting floors and the pooled counts from the raw bytes rather than
        copying them. No new sampling occurred. No seed applies.
    - item: correspondence validity
      status: not_applicable
      detail: no substitute-sampling correspondence is used.
    - item: scale binding
      status: pass
      detail: >-
        Toy parameters q=241, m=40, n=43/50, n_fft=8, k_fft=3 are stated
        throughout and recorded as a limitation, never as scale-matched evidence
        (AGENTS.md rule 7). The report's section 7 non-claims are correct and I
        found no sentence in the package that violates them.
    - item: effective replicate count
      status: acknowledged_unrecoverable
      detail: >-
        The q^k_fft candidates inside one FFT share dual vectors and target, so
        the pooled estimate's effective replicate count is not recoverable from
        the archive. Recorded by the producer (section 5.7) and by EV-MLKEM-018.
        My autocorrelation measurement (section 6.5 of the notes) is a
        diagnostic, not a resolution.

