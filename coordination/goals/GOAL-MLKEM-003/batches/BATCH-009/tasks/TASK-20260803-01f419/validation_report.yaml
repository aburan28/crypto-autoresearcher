        not measured zeros, which is the correct reading of a pooled counting
        instrument and matches EV-MLKEM-018.

    - check: "SCORE-SCALE CHECK (explicit answer required by the completion gate)"
      answer: >-
        PASS. No k_fft alignment is applied anywhere in the package, and the raw
        undivided cosine-sum convention is the one the data support. I
        re-derived two independent estimators of sigma from each file's own
        survival column (see metric_recomputations) and obtained ratios
        0.9996/0.9986 (n=43) and 1.0020/1.0002 (n=50) against Model 4.7's raw
        prediction sqrt(avg_N/2), versus 2.9987/2.9957 and 3.0060/3.0007 against
        the /k_fft alternative. Had the archived score been divided by k_fft=3
        the raw ratios would be 3.0. This independently reproduces EV-MLKEM-018's
        finding that FFT()'s /k_fft cancels a duplicate accumulation in init().
        The producer states agreement with EV-MLKEM-018 and uses the raw scale
        throughout. The second prohibited failure mode is absent.

    - check: "parameters declared UNAVAILABLE are genuinely absent from the repository"
      answer: >-
        CONFIRMED for all four. Phi_dlsc appears only in page23 and page25
        extracts, always used and never defined; Approximation 4.6 which
        introduces it is on a page not in the archive. delta(beta_bkz) is
        symbolic in (4.24) only, with no numerical value anywhere;
        knowledge/techniques/KN-TECH-020.md names the root-Hermite factor but
        gives neither a formula nor a number. alpha appears only symbolically in
        (4.19) and in the page-25 locus. n_lsc appears once, in that locus,
        undefined. Searched inputs/, knowledge/, ledger/, coordination/ and
        experiments/, excluding the producer's own task directory.

    - check: "is 'the absolute level of Approximation 4.9 is untestable from archived bytes' right, or an overstatement?"
      answer: >-
        IT IS RIGHT, and if anything under-argued while mis-attributed. The
        report pins the untestability on delta(beta_bkz) entering as
        delta^{beta_sieve(m+n_lat-beta_sieve)}; that arithmetic checks out
        (44*31 = 1364, 41*41 = 1681, and a 0.1% change in delta moves the level
        by 1.97 and 2.42 bits). But alpha and Phi's constants are EACH
        independently sufficient to make the level uncomputable, and delta is the
        weakest of the three links because the root-Hermite factor is a standard
        predictable quantity in the wider literature. The conclusion stands on
        the stronger legs; the stated reason is narrower than the true one.
        Related prose inconsistency, recorded as D11: section 2 says the archived
        (4.19) "forces" the exponential-quadratic form of Phi while section 5(2)
        calls it "a declared reading". (4.19) fixes one functional of Phi (its
        good-guess expectation) and rules out readings with no decay in y, but
        does not determine Phi. The script's own text uses the correct weaker
        phrasing.

