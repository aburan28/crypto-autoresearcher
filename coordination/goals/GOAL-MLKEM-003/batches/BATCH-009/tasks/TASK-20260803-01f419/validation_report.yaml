  verdict: ADMISSIBLE_WITH_DEFECTS
  verdict_role_contract_equivalent: passed
  verdict_rationale: >-
    Every load-bearing quantity in the package reproduces under an independent
    re-implementation. Both counting floors equal exactly 1/(nb_iteration *
    q^k_fft) as bit-for-bit IEEE-754 equalities; both resolved bands, all pooled
    counts, both K anchors, the score-scale check, the Gaussian-only deficits,
    the residual statistics and the exponent scan all reproduce, and my model
    evaluated at the producer's own K agrees with their per-score prediction
    column to better than 7e-4 bits across all 4113 scores. Neither prohibited
    failure mode is present: nothing is compared, fitted or extrapolated past the
    counting floor, and no k_fft alignment is applied. The four unavailable
    parameters are genuinely absent from the repository, alpha was recorded as an
    unverified candidate and never used, the descriptive erratum enters no
    computation, and the nb_iteration choice for n=50 is not merely defensible
    but forced by the data. I found no fabricated command, output, timing,
    statistic, citation or run. The package's non-claims are correct and
    complete.

    The defects are real but none is fatal to admissibility: two misstated
    descriptive definitions (D1, D2), one non-reproducing diagnostic column (D3),
    a transparency gap and a budget-record error (D4, D5), and four
    interpretation-strength findings (D6-D9) of which the most serious are that
    the reported divergence profile is confounded with the package's own
    single-K reduction, that the non-degeneracy control is far too weak to
    support the shape claim, and that the null-object control required by
    docs/inventor-protocol.md section 3 was not run. I ran that control here and
    it does not discriminate. None of these changes a recorded number; they
    change what the numbers may be cited for, and the scoping in
    central_question_judgement.consequence_for_downstream_use is binding on any
    downstream use.

    INADMISSIBLE was considered and rejected: the missing null control is a
    control defect in an observation-only package that makes no promotion claim,
    not an evidence-integrity failure, and the producer's report explicitly
    declines to adjudicate what the agreement means. ADMISSIBLE was rejected
    because of D1, D6 and D8.

