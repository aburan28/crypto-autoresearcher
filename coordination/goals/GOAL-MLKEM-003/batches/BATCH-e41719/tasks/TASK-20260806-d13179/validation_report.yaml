        status: reproduced

  # ------------------------------------------------------------------
  independent_joint_null_construction:
    required_by: completion_gate
    constructions_built:
      - id: JV-M
        description: >-
          exact Multinomial(S,p) by SORTED ORDER STATISTICS -- 98419 uniforms
          sorted once per replicate and merged against the cumulative p. A
          different algorithm from the producer's per-draw bisect inside 4000
          budget blocks, and the same statistical object.
        result: null 1.0011 +/- 0.1075, z = -2.98, band total fixed exactly
      - id: JV-C3
        description: >-
          Gaussian copula: exact Binomial(nb, pi) marginals by inverse CDF
          (identical to N2's and to JN-3's) plus the conditional-Poisson
          rank-one negative coupling. No iterations are simulated at all.
        result: null 0.9958 +/- 0.1085, z = -2.90
      - id: JV-C2
        description: copula with exact Poisson marginals and JN-2's rank-one coupling
        result: null 0.9937 +/- 0.1087, z = -2.88
      - id: JV-C0 / JV-C0p
        description: the same copula machinery with NO coupling (calibration controls)
        result: 0.9885 +/- 0.1071 (z = -2.87) and 1.0040 +/- 0.1152 (z = -2.80)
      - id: JV-AR(r)
        description: >-
          exact N2 marginals with AR(1) cross-cell coupling, r from -0.30 to
          +0.75 -- the class the producer's identity argument excludes.
      - id: analytic
        description: >-
          the projection identity applied to each null's exact second-moment
          matrix, giving the null MEAN with no sampling at all.
    agreement: >-
      YES. JV-M reproduces the producer's JN-2 null mean to 0.001 (0.25 Monte-
      Carlo standard errors) and JV-C3 reproduces JN-3's to 0.0001, from a
      generative mechanism with no iterations in it. Analytic null means
      0.999676 (JN-2), 0.992025 (JN-3), 1.000000 (JN-P, N1) confirm both. Every
      one of my joint nulls gives a z at least as extreme as the producer's:
      -2.88 to -2.98 against -2.82 to -2.84.

  deficit_survival_statement:
    required_by: completion_gate
    verdict: THE DEFICIT SURVIVES EVERY JOINT NULL TESTED
    detail: >-
      z = -2.84 / -2.82 under the producer's JN-2 / JN-3; -2.98 / -2.90 / -2.88
      under my three independent joint nulls; the faithful physical joint null
      JN-P is analytically identical to independent Poisson to one part in 10^7.
      The model-free statistic, which needs no rate model, moves by at most 0.13
      in z under any of them. The n=50 control shows no deficit under any null.
    what_this_does_NOT_establish: >-
      That the deficit is real. It survives everything in the budget-preserving
      family and everything in the fixed-marginal short-range family that the
      data admit, and it remains exposed to an unfitted mixed-Poisson
      alternative (JN-4) at sigma >= about 0.35. It supports no ML-KEM claim,
      demonstrates no speedup, and authorises no promotion.

  # ------------------------------------------------------------------
  control_checks:
    - control: negative control, n=50 file
      finding: >-
        present and behaves as a control should: no deficit under any null,
        joint or independent. The joint nulls neither create nor remove one.
      status: passed
    - control: null objects of the same shape (inventor-protocol section 3)
      finding: >-
        seven null objects, spanning independence, maximal sum-preserving
        negative coupling, the fixed-size 0/1 design, the faithful physical
        multinomial, and a positive-dependence widener. I added five more,
        including the class the producer's framing excludes.
      status: passed
    - control: does the measured quantity decay when the parameter meant to
        destroy it increases?
      finding: >-
        Yes, and it is checked in both directions. Increasing the coupling
        strength in the direction that widens the null (JV-AR r, and JN-4 sigma)
        does drive |z| toward 0, exactly as it should; the finding is not a
        quantity that fails to decay. What stops the rescue is that the coupling
        needed is excluded by the observed residual autocorrelation.
      status: passed
    - control: instrument check that each joint null carries the coupling
        claimed for it
      finding: >-
        present (measured dependence ratio and band-total sd) but noise-limited;
        exact values now supplied. See defect V-4.
      status: passed_with_defect
    - control: calibration of the producer's own generators
      finding: >-
        N1 vs N1x isolates the inherited rounded-Gaussian Poisson sampler and
        bounds it at 0.01 percent in the mean and 1 percent in the sd. The
        disclosure obligation in the handoff is met, not silently inherited.
      status: passed

  # ------------------------------------------------------------------
  defects:
    - id: V-1
      severity: moderate
      kind: argument stated more broadly than it holds
      statement: >-
        Report section 3.5's "pinning identity" is false as a general
        proposition. Var(D_T) is indeed a functional of the marginal law, but
        the statistic is not (D-mu)^2/mu with known mu; it is (D-muhat)^2 /
        (muhat (1-h)) after a degree-5 refit, and the leverage factor (1-h) is
        the first-order correction DERIVED UNDER INDEPENDENCE. Off-diagonal
        terms of Sigma enter the null mean through [(I-A)Sigma(I-A)']_ii. At
        marginals held EXACTLY at N2's, an AR(1) coupling moves the analytic
        null mean from 0.992025 (r=0) to 0.865356 (r=+0.8) and to 1.004864
        (r=-0.6). The room the report says is zero is worth up to -0.127 --
        larger than the entire sd move it allots to the joint family. As
        written the argument would license accepting any joint null, including
        ones that DO rescue the rejection.
      effect_on_conclusions: >-
        None, for the nulls actually run. JN-2 and JN-3 carry RANK-ONE coupling
        that the residual projection almost annihilates: the analytic shift is
        -3.2e-4 (JN-2) and <1e-6 (JN-3). The conclusion is right; the reason
        given for it is not, and the correct reason is sharper.
      repair: >-
        Restate as: the physical coupling is O(mu/M) ~ 1e-7 and inert, and any
        budget-type coupling is rank-one along a smooth direction that the
        degree-5 residual projection filters out. Not: coupling cannot move the
        mean.
    - id: V-2
      severity: moderate
      kind: headline grid row not reproduced; significance measured with a
        Gaussian z against a right-skewed null
      statement: >-
        The producer's JN-4 sigma=0.20, ell=25 row (z = -1.87, 300 replicates)
        does not reproduce. Two independent seeds at 2000 replicates with my own
        samplers give z = -2.10 and -2.15, with empirical one-sided tails of
        12/2000 = 0.0060 and 14/2000 = 0.0070. The sigma=0.35 row does reproduce
        (-1.42/-1.50 against -1.55) but its empirical tails are 0.047 and 0.035,
        still nominally significant one-sided at 5 percent. The JN-4 null is
        right-skewed, so a Gaussian z systematically overstates the rescue.
      effect_on_conclusions: >-
        The live exposure is real but narrower than reported. Report section 0
        sentence 3 and section 5 say sigma ~ 0.2-0.35 supplies the required
        widening; at sigma = 0.20 it does not. The corrected statement is
        sigma >= about 0.35-0.4.
      repair: report empirical tail probabilities, not z, for the JN-4 family
    - id: V-3
      severity: minor
      kind: defect disclosure whose justification is stronger than the facts
      statement: >-
        Producer D-1 is confirmed and is the ONLY collision over all 25 streams
        (24 distinct seed values), which I established by independent
        re-derivation and exhaustive enumeration -- D-1 does not claim to have
        checked exhaustively. But D-1 says "No statistic in this report compares
        them", while section 0 sentence 1 quotes the n43 JN-2 z (-2.84) and
        section 0 sentence 4 / section 4.3 quote the n50 JN-3 control (+0.62) as
        the two sides of one control argument. That is a comparison and it
        crosses the collision.
      effect_on_conclusions: >-
        None quantitatively. The two streams are consumed through different
        transforms at different rates (98419 random() calls per replicate vs
        per-iteration shuffles through getrandbits), and the contrast is
        qualitative (sign of z), not a differenced statistic with an error bar.
        Affected records: job_A.n43_JN2.* and job_A.n50_JN3.*.
      repair: >-
        restate the justification; and replace the additive hash with a
        cryptographic digest of the stream name in any successor run.
    - id: V-4
      severity: minor
      kind: measured instrument quoted where an exact value exists
      statement: >-
        The cross-cell dependence ratio is exactly 0.9480 (JN-2) and 0.9211
        (JN-3, conditional-Poisson second moments), and the JN-3 band-total sd
        is exactly 30.9. The producer reports measured 0.8968 / 0.8931 / 30.1
        and reads the gap from 1 as the size of the coupling. My own independent
        nulls measure 0.8706 and 0.8827 for the same objects; all four
        measurements sit 3-8 percent below the exact values.
      effect_on_conclusions: >-
        None. The sign and existence of the coupling are confirmed exactly. But
        the reported magnitudes overstate the coupling, and producer D-2's own
        statement that the instrument resolves 0.89 "only at roughly 2 sd" is
        the honest reading.
      repair: quote the analytic values; keep the measurement as an instrument check
    - id: V-5
      severity: minor
      kind: artifact-policy gap in the machine-readable manifest
      statement: >-
        AGENTS.md's artifact policy requires the requested model policy, the
        resolved runtime model identifier, probe-verification status, reasoning
        effort, fallback and degraded requirements in the run record, and
        CLAUDE.md requires them in the run manifest's `inference` block. Neither
        results.json nor resource_receipt.json carries one; the provenance
        appears only as prose YAML in report.md.
      effect_on_conclusions: none
      repair: add an `inference` block to results.json and resource_receipt.json
    - id: V-6
      severity: minor
      kind: receipt transcription
      statement: >-
        report.md section 8 records "24 streams"; results.json -> seeds has 25
        entries with 24 distinct values, the shortfall being exactly the D-1
        collision.
      effect_on_conclusions: none
      repair: state 25 streams, 24 distinct seeds
    - id: V-7
      severity: minor
      kind: most favourable member of a family quoted as the requirement
      statement: >-
        The 1.343x sd / 1.803x variance inflation requirement is computed off
        n43_N2, the LOWEST null mean of the five the producer ran, and one that
        my analytic value puts 2.4 Monte-Carlo standard errors low. Off N1x,
        JN-2 and JN-3 the requirement is 1.408x, 1.421x and 1.410x sd; off the
        analytic null mean 1.38x. Separately, a single sd-inflation factor
        presumes the null mean is fixed, which V-1 shows is false for exactly
        the dependence that widens a null: my JV-AR rows rescue by moving mean
        and sd together.
      effect_on_conclusions: >-
        The stated requirement is the easiest one in the family to meet. The
        honest range is 1.34x-1.42x sd.
      repair: quote the range and name the null each figure is computed against
    - id: V-8
      severity: minor
      kind: scope of the finding overstated by the framing, not by a number
      statement: >-
        "The deficit survives every joint null in the iteration-budget family"
        is true and is close to structurally guaranteed. Both joint nulls carry
        rank-one coupling along a smooth direction, and the statistic is a
        quadratic form in residuals after removing a degree-5 polynomial, so it
        is nearly blind to exactly that direction. The survival is therefore
        weak evidence about cross-cell dependence in general and strong evidence
        only about budget-type dependence.
      effect_on_conclusions: >-
        The dispatching hypothesis is refuted for smooth/budget dependence, not
        for dependence as such. The class that WOULD matter is short-range
        coupling, and it is the observed lag-1 autocorrelation of the Pearson
        residuals (0.103955) that excludes it -- see the finding below.
      repair: state which class of dependence the survival covers

  # ------------------------------------------------------------------
  validator_findings_beyond_the_package:
    - id: F-1
      finding: >-
        THERE IS A JOINT CONSTRUCTION THE PRODUCER'S FRAMING EXCLUDES, IT DOES
        RESCUE THE REJECTION, AND THE DATA EXCLUDE IT. At marginals held exactly
        at N2's, AR(1) cross-cell coupling gives z = -2.74 (r=+0.20), -2.27
        (r=+0.40), -1.61 (r=+0.60), -1.26 (r=+0.75). But the same nulls predict
        the lag-1 autocorrelation of the PEARSON RESIDUALS, observed +0.103955:
        +0.1754 +/- 0.0569 at r=+0.20 (observed compatible, -1.25 sd), +0.3676
        +/- 0.0582 at r=+0.40 (observed -4.5 sd), +0.5608 +/- 0.0488 at r=+0.60
        (observed -9.4 sd), +0.7074 +/- 0.0408 at r=+0.75 (observed -14.7 sd).
        The coupling the data support leaves z at -2.74; the coupling needed to
        rescue is excluded at 9 sd on a statistic the producer already computed.
    - id: F-2
      finding: >-
        JN-3 IS NOT THE JOINT MINIMUM-VARIANCE OBJECT. Its marginals are exactly
        N2's (verified: with max pi = 0.7392 < 1 each cell crosses at most one
        integer threshold, so systematic pips with a uniform random start gives
        inclusion probability exactly pi under any order, preserved by the random
        shuffle) and it attains the per-cell floor -- but so does N2. On the
        aggregate it reaches Var(sum_A D) = 4659.4 (ratio 0.9211) where a
        fixed-size design constraining the SUBSET count per iteration reaches
        803.3 (ratio 0.1588): a factor 5.8 unclaimed. BATCH-017 W-10's gap is
        not closed by this construction. The direction is conservative for the
        producer -- a tighter joint null makes |z| larger -- so no number changes.
    - id: F-3
      finding: >-
        THE PER-ITERATION SHUFFLE IS A LEGITIMATE FIX WITH ITS OWN ARTIFACT. It
        removes a real one (unshuffled systematic sampling perfectly couples
        cells 1.0 apart on the cumulative-pi axis, which at subset occupancies
        ~0.005 means cells ~200 apart). It introduces a blind spot: the coupling
        becomes exchangeable and spatially unstructured, which is precisely the
        direction the statistic cannot see. That, not the low occupancy, is the
        sharp reason for the producer's Surprise 2.
    - id: F-4
      finding: >-
        SURPRISE 1 IS CORRECT AND THE CORRECTION MAKES THE FINDING STRONGER.
        Confirmed with no Monte Carlo: E[stat] = [sum_i v_i(1-p_ii) +
        ||(I-P)mu||^2] / ((L-2) mubar), the second term being the straight
        line's lack of fit to the curved rate profile. Analytic null means
        1.0007 / 1.0109 / 1.0474 / 1.1359 / 1.7486 at L = 25/50/75/100/150.
        EV-MLKEM-890e2a W-1 (lines 56-57) and DEC-20260803-95176a (line 59)
        quote "an expectation of 1 with sampling sd 0.29, 0.20 and 0.14". The
        corrected references are expectation 1.001 / 1.011 / 1.136 with sd
        0.28-0.30 / 0.20-0.21 / 0.16-0.18, giving corrected z of about -1.9,
        -2.2 and -2.8 in place of -1.89, -2.17 and -2.40. The L=100 window is
        understated by about 0.4 in z by the archived reference, and the L=150
        reading of 1.551 inverts from an apparent super-Poisson excess to 0.9 sd
        BELOW its own null. A correction record against EV-MLKEM-890e2a W-1 is
        warranted; making it is the Coordinator's authority, not mine.
    - id: F-5
      finding: >-
        RULING REQUESTED BY THE HANDOFF -- A PROCESS WHOSE PER-CELL DISPERSION
        IS ITSELF RANDOM AND SPATIALLY SMOOTH IS AN ALTERNATIVE, NOT A NULL.
        Four grounds. (i) It contradicts the hypothesis under test rather than
        calibrating it: the lane tests whether Var(D_T) = mu_T, and JN-4 asserts
        Var(D_T) = mu_T psi_T with psi random and pointwise not 1. Under
        inventor-protocol section 3 a null object is one of the same shape
        LACKING the property claimed; JN-4 is of a different shape and makes the
        property a free parameter. (ii) sigma is chosen so that z crosses -2,
        not estimated: a reference distribution selected to maximise its own
        p-value is a minimum over a family, which standing binding (g) forbids
        being read as an expected value. The producer correctly flags (g) for
        each individual row, then selects the friendliest rows in sections 0 and
        5; V-2 shows what that selection costs. (iii) It does not explain the
        observation, only widens the reference: E[psi] = 1, so its own model-free
        null mean stays near 1 while the observation is 0.45-0.66. (iv) The
        legitimate version -- (sigma, ell) estimated from the data and then
        tested for goodness of fit across the whole L-profile -- has not been
        done, by the producer or by me. Status: alternative, unfitted, not
        excluded by any statistic tried in this lane.
    - id: F-6
      finding: >-
        I LOOKED FOR A STATISTIC WITH POWER AGAINST JN-4 AND DID NOT FIND ONE.
        The producer's lag-1 acf of t separates the rescuing JN-4 points from
        independence by 0.1-0.4 sd (null means -0.0014, +0.0093, +0.0292 against
        a sampling sd of 0.080-0.086), so "not excluded" there is a statement
        about the instrument, not the data. My candidate -- the spread of the
        model-free statistic across 12 disjoint L=25 windows, which a field of
        correlation length 25 ought to inflate -- also lacks power: observed
        0.6418 against 0.5303 +/- 0.1251 (Poisson), 0.5565 +/- 0.1485 (sigma
        0.20) and 0.5963 +/- 0.1730 (sigma 0.35). Recorded as an honest
        negative. This is the concrete open item the batch leaves.

