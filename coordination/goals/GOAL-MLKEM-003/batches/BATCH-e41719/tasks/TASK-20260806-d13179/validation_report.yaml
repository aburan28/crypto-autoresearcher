  # ------------------------------------------------------------------
  limitations:
    - id: L-1
      text: >-
        My analytic route is first order: Y - muhat ~= (I-A)(Y-mu) neglects the
        log link's curvature, which is why the exact analytic null mean under
        independent Poisson is 1.000000 where Monte Carlo gives 0.9975-1.0064.
        That second-order term is about 0.3 percent, smaller than every effect
        it adjudicates, but it is an approximation.
    - id: L-2
      text: >-
        I did not re-simulate the n=50 nulls; the n=50 control is checked only
        through reproduction of its observed statistics. The producer's n=50
        z values (+0.42 to +0.62) are marked partially_reproduced.
    - id: L-3
      text: >-
        My Gaussian-copula nulls impose the target second moments through a
        Gaussian dependence with exact discrete marginals; induced count
        correlation equals the Gaussian one only approximately. For the rank-one
        nulls the pairwise correlations are ~1e-3 and the approximation is
        excellent; the AR(1) rows at r = 0.6-0.8 should be read as direction and
        order of magnitude, not exact values.
    - id: L-4
      text: >-
        I did not re-derive the GLM leverage correction, the degree selection
        (inherited from BATCH-014), or the occupancy-threshold rule; I did not
        fit JN-4; and I did not find a statistic with power against JN-4.
    - id: L-5
      text: >-
        Toy tier throughout. Two archived files, mid band only, raw undivided
        score scale. Nothing here supports or refutes any ML-KEM or Kyber
        security claim, and nothing bears on Approximation 4.9. A passed or
        admissible verdict means the receipt is admissible evidence; it
        demonstrates no speedup and authorises no promotion.

  package_verdict: ADMISSIBLE_WITH_DEFECTS
  verdict: passed
  verdict_rationale: >-
    Every artifact is present, hash-bound to a reachable commit with the
    declared parent, and the command, revision, dirty-tree state, seeds,
    environment and resource records are complete but for the inference block
    (V-5). Every headline observed statistic reproduces to eight significant
    figures through an entirely independent parser, basis and solver. Both joint
    nulls reproduce through constructions the producer did not use -- an exact
    multinomial by sorted order statistics and two Gaussian-copula nulls with
    exact inverse-CDF marginals -- agreeing to 0.001 and 0.0001 in the null mean,
    and are further confirmed by an analytic route with no Monte Carlo. The
    deficit survives every joint null tested, mine included, at z between -2.82
    and -2.98. The defects are in the report's argumentation (V-1, V-8), in one
    JN-4 grid row and its significance measure (V-2), and in receipt hygiene
    (V-3 to V-7); none of them moves a headline number, and V-1's error runs in
    the direction that would have made the producer's conclusion easier, not
    harder, to reach. The package is admissible evidence. It supports no ECDLP
    or ML-KEM claim, demonstrates no speedup, and authorises no promotion.

