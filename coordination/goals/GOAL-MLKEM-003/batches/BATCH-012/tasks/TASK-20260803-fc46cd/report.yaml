    - id: R5
      claim: passagemath sage.all is a genuine Sage, not a shim-like re-export
      status: reproduced
      detail: >-
        RR is sage.rings.real_mpfr.RealField_class (MPFR, default precision 53);
        RealField is a cython_function_or_method; find_root from
        sage.numerical.optimize; RealDistribution from
        sage.probability.probability_distribution; prod is Cython. Dependency
