  # =====================================================================
  # CONTROL CHECKS
  # =====================================================================
  control_checks:
    - control: positive -- known-answer control on the unpatched committed shim
      status: passed
      detail: Re-run independently, exit 0, PASS, output byte-identical. See R0.
    - control: >-
        negative/null NULL-1 -- Kyber-specificity removed (24 Kyber-shaped
        non-Kyber LWE instances, seed 20260803)
      status: did_not_run
      detail: >-
        0 of 24 points evaluated; all 24 raised the same AttributeError. Root
        cause independently confirmed (R13). Correctly classified by the producer
        as implementation_error, correctly NOT treated as evidence in either
        direction (AGENTS rule 5 / agents/executor.md), and not fabricated or
        silently dropped. It was not rerun because budget.maximum_runs = 1 was
        spent; I did not rerun it either, since that would be repairing a
        producer artifact.
      consequence: >-
        The BATCH-011 validator's DEF-7 null goes UNRUN FOR A SECOND CONSECUTIVE
        BATCH. Under docs/inventor-protocol.md section 3, the ANOM-3 ordering
        therefore still has NO null-object control of the right shape and remains
        an artifact-until-controlled. This is the single largest gap in the
        package and the producer says so itself.
    - control: >-
        negative/null NULL-2 -- RC.MATZOV reduction frame removed (6 other cost
        models x 3 sets)
      status: ran_but_is_not_a_null_object
      detail: >-
        4 of 18 cells recomputed and reproduced exactly (R14). But NULL-2 is NOT
        a null of the right shape for the claim it is nulling. A null object
        under the inventor protocol replaces the OBJECT with a structureless
        one of the same shape (here: non-Kyber LWE instances -- which is
        precisely what NULL-1 was and it did not run). NULL-2 keeps the same
        three Kyber instances and the same two cost functions and varies only
        the reduction cost model. That is a frame-sensitivity sweep, not a null
        object.
      artifact_tell_reading: >-
        Read as the protocol directs, NULL-2's result points TOWARD artifact, not
        away. Removing the frame the signal is attributed to does not reduce the
        ordering -- it AMPLIFIES it by two orders of magnitude, from
        +0.54/+4.59/+8.39 bits under RC.MATZOV to +76/+166/+280 bits under
        CheNgu12 and ABLR21, enumeration models in which such a dual-over-primal
        gap is not credible as an attack comparison. A quantity that fails to
        decay when the parameter meant to destroy it is applied is the canonical
        artifact tell. The producer records this observation honestly (ANOM-C)
        and declines to draw the conclusion, which is correct executor behaviour;
        but the conclusion should not be lost. See defect D-7.
      producer_framing: acceptable
      framing_detail: >-
        The producer does NOT claim NULL-2 is the right-shape null: report.md
        explicitly lists "DEF-7's null of the right shape (NULL-1) did not run"
        under "Remains uncheckable". That is honest and I record it as such.

  # =====================================================================
  # HEURISTIC-VALIDATION AND COST-MODEL CHECKS
  # =====================================================================
  heuristic_validation_checks:
    - check: pre_registered_prediction
      status: not_applicable
      detail: >-
        This package validates no heuristic and pre-registers no distributional
        prediction. It is an instrument-agreement, box-widening, null, decay and
        cost-exponent package. Recorded as not-applicable rather than omitted.
    - check: sample_integrity
      status: passed
      detail: >-
        Seed 20260803 recorded in both receipt.json and results.json. The
        producer correctly notes the only stochastic component is the NULL-1
        ensemble, which produced no data; every reported number is deterministic
        given the estimator pin. I confirmed determinism by reproducing S0, S1,
        S4 and NULL-2 values bit-for-bit in independent processes.
    - check: correspondence_validity
      status: not_applicable
      detail: No correspondence substitutes for direct sampling here.
    - check: scale_binding
      status: passed
      detail: >-
        The run is at the actual FIPS 203 parameter sets (Kyber-512/768/1024),
        so there is no toy-scale-presented-as-crypto-scale problem (AGENTS rule
        7). The binding scope limitation is different and is disclosed: the
        estimator serves only primal_bdd and MATZOV/DualHybrid here, with
        arora_gb, dual and primal_hybrid verified unavailable, so no "best attack
        overall" claim is possible. report.md states this.

  cost_model_checks:
    - check: cost_unit_declared
      status: passed
      detail: >-
        Units are declared throughout: log2(rop) in bits for cost; log2 M in
        Z_q elements for Model A and in cells for Model P; c* dimensionless.
        Memory is reported ALONGSIDE time everywhere c* appears.
    - check: optimistic_assumptions_flagged
      status: passed
      detail: >-
        Model P's p^k_fft term is explicitly labelled an INFERENCE from
        T_fftf's p**(k+1) at lwe_dual.py:513, "not a quotation from
        MATZOV-2022". The dropped asymptotic is flagged twice
        (lwe_dual.py:551 "# p.29, we're ignoring O()"), with the correct
        observation that the K-512 margin of 0.543432 bits is smaller than a
        single dropped factor of 2.
    - check: memory_beside_time
      status: passed
      detail: >-
        S5 reports log2 M under two recipes beside every log2 rop. The blunt
        memory fact is carried forward: at K-1024 Model P's FFT table is 2^240
        cells against a claimed total cost of 2^262.34.
    - check: per_attempt_cost_times_inverse_success_probability
      status: not_applicable_but_noted
      detail: >-
        Neither side of the comparison exposes a success probability, so the
        bookkeeping identity cannot be applied. The producer names this as one
        of the two live model objections ("neither exposes a success
        probability"), which is the correct handling. I record it as an
        outstanding limitation of the comparison, not a defect of this run.

  proof_architecture_checks:
    - check: baseline_fixture
      status: passed
      detail: >-
        The cited baseline (primal_bdd under RC.MATZOV) reproduces EXACTLY --
        delta 0.0 -- against both the archived sagemath 10.9 run and my own
        passagemath and shim runs. Not a close numerical fit; floating-point
        equality.
    - check: strictness_witness
      status: not_applicable
      detail: No improvement over a prior method is claimed by this package.
    - check: observation_collisions_bound_to_scope
      status: passed_with_qualification
      detail: >-
        S2's no-improvement result is correctly bound to its enumerated scope in
        report.md and results.json: a bounded search cannot certify global
        optimality, and the producer says so explicitly and repeatedly. The
        qualification is presentational only -- see defect D-4.
    - check: interface_preservation
      status: passed
      detail: >-
        The S4 subclass changes exactly one interface (Nf's return, scaled by
        2^delta) and re-runs the full optimiser; primal_bdd is held unchanged
        and that asymmetry is stated. I reimplemented it independently and
        reproduced the table, so the recorded recipe is complete enough to
        rebuild from.
    - check: ceiling_and_nearby_control
      status: partial
      detail: >-
        The nearby-object control (non-Kyber LWE of the same shape) is exactly
        NULL-1, which did not run. NULL-2 is a different axis. See D-6.
    - check: quantifier_fidelity
      status: passed
      detail: >-
        Per-set results are reported per-set throughout; no per-instance result
        is presented as uniform. c* is reported per attack and per set with
        owner labels.

  # =====================================================================
  # REPRODUCIBILITY POINTER -- EXERCISED, NOT ASSERTED
  # =====================================================================
  reproducibility_pointer_exercised: true
  reproducibility_detail: >-
    I did not accept the producer's transcript. I rebuilt and re-ran: the Step 0
    control; the S0 identity and anchor block under the shim; the full S1
    six-value comparison under real Sage with the shim verified off sys.path from
    inside the interpreter; 4 of 18 NULL-2 cells; 6 S4 integer-delta rows from a
    from-scratch reimplementation of the inflation recipe; 11 additional
    fractional-delta S4 points in fresh processes; the NULL-1 root cause; the
    S2 coverage arithmetic; both c* models; and the acquisition negatives.
    Artifacts listed under artifact_paths.

  # =====================================================================
  # DEFECTS
  # =====================================================================
  defects:
    - id: D-1
      severity: moderate
      class: mislabelled_machine_readable_field
      title: >-
        results.json's `comparison_vs_shim.shim_anchor` contains the rounded
        published anchor, not a shim value; its delta_bits is therefore not a
        shim-vs-Sage delta
      location: >-
        results.json S1_sage_reference.real_sage_runs[1].comparison_vs_shim;
        reserve_checks.py:281-282 and the ANCHOR_MATZOV table at :68-72
      detail: >-
        ANCHOR_MATZOV holds 139.6560414809 / 196.3662433540 / 262.3356800075 --
        rounded published values. ANCHOR_PRIMAL (:63-67) holds full-precision
        values. That asymmetry makes every primal delta come out exactly 0.0 and
        every matzov delta come out as the anchor's rounding residue
        (4.155e-11 / 3.941e-09 / 2.632e-11), while the block's field names claim
        the comparison is against the shim.
      adjudication: >-
        report.md's table (0.0 / 3.938e-09 / 0.0) is the CORRECT shim-vs-Sage
        comparison and I reproduced it independently. results.json is not
        fabricated -- it computes exactly what its code says -- but the field
        name does not describe the contents, and the Coordinator's snapshot
        commit message propagated the mislabelled reading ("against the shim's
        196.366243354 and 262.3356800075"). A downstream reader taking
        results.json as the machine-readable source of truth would record a
        shim-vs-Sage disagreement that does not exist.
      materiality: >-
        None for any conclusion. All quantities involved are <= 4e-09 bits.
      repair_not_made: >-
        Recorded, not fixed. Both files are committed producer artifacts.

    - id: D-2
      severity: moderate
      class: mischaracterised_quantity
      title: The S4 "flip point" is the location of a discontinuity, not a zero of the margin
      location: reserve_checks.py:553 docstring; report.md S4
      detail: >-
        The stated definition is "the delta at which the margin reaches 0". The
        margin never reaches 0. I measured it constant at +0.0760490 to 7 decimal
        places across delta = 2.0, 2.2, 2.3, 2.4, 2.6, 2.7, 2.75, 2.777 with beta
        pinned at 387, then jumping discontinuously to -0.1218969 with beta 388.
        The margin is piecewise-constant in delta with jumps where the optimiser's
        integer beta increments. Bisection on such a function converges to the
        jump location, not to a root.
      effect_on_the_numbers: >-
        None. 2.77728 and 19.67163 correctly locate the jumps and I bracketed
        both independently. The defect is in what the number is said to be, and
        it matters because a "flip point" of a step function does not support
        the smooth-sensitivity reading a reader would naturally give it: at
        K-512 the margin does not shrink continuously to zero, it holds
        +0.076 bits and then drops 0.198 bits at once.

    - id: D-3
      severity: moderate
      class: stated_mechanism_contradicted_by_own_data
      title: >-
        The explanation offered for correcting the red team's 2.3732 is not what
        the data shows
      location: report.md lines 289-292
      detail: >-
        The report says "Interpolation understates the flip point because the
        optimiser recovers some of the loss." My measurements show the optimiser
        recovers essentially NOTHING across the interval in question: from
        delta=2.0 to delta=2.777 the margin is constant to 7 decimal places and
        beta does not move off 387. The reason linear interpolation fails is
        that the margin is a step function, so interpolating between the
        delta=2 and delta=4 rows has no basis at all.
      status_of_the_correction: >-
        The NUMERICAL correction of the red team stands and is confirmed (R17:
        2.373191 is indeed the interpolation; the true jump is at ~2.7773). Only
        the stated causal explanation is wrong.

    - id: D-4
      severity: minor
      class: misleading_presentation
      title: S2's "best found" column reports the incumbent, which the scan never evaluated
      location: report.md S2 table
      detail: >-
        The column reads "best found | 196.3662433539967" and
        "262.3356800074737" -- these are the INCUMBENT values. results.json is
        explicit (`best_found.source: "incumbent"`) but report.md's table is not.
        Since neither incumbent beta was scanned (R11, confirmed), the scan's own
        best over the evaluated region is necessarily strictly worse, and it is
        not reported anywhere in the package.
      effect: >-
        A reader of report.md alone would infer the scan re-found the optimum.
        The surrounding prose does disclose the truncation and the unscanned
        incumbent beta, so this is presentational rather than substantive.

    - id: D-5
      severity: minor
      class: ambiguous_prose
      title: A mixed list of producer and red-team values is presented under one label
      location: report.md lines 327-329
      detail: >-
        "Model P gives 0.028803 / 0.080877 / 0.040268" -- but 0.080877 is the
        BATCH-011 red team's K-768 value, not the producer's, whose own Model P
        K-768 is 0.081697 (given correctly in the same sentence's continuation
        and in the table). The intended reading (the list is the red team's, and
        the producer matches it at 512 and 1024 but not 768) is recoverable but
        not stated.
      materiality: none -- the table and results.json are unambiguous and correct.

    - id: D-6
      severity: high
      class: missing_control_carried_forward
      title: >-
        The null object of the right shape has now gone unrun for two
        consecutive batches
      detail: >-
        NULL-1 is the only measurement in this package that removes the OBJECT
        rather than the frame, and it produced zero data points. NULL-2 does not
        substitute for it. Under docs/inventor-protocol.md section 3, the
        ANOM-3 ordering therefore remains an uncontrolled signal.
      not_a_producer_fault: >-
        The producer diagnosed the one-line cause correctly, classified it as
        implementation_error, inferred nothing from it, declined to rerun
        because maximum_runs = 1 was spent, and flagged it as the largest gap it
        leaves. That is the correct handling of AGENTS rules 3 and 5. The defect
        is recorded against the EVIDENCE STATE, not against the executor's
        conduct.
      consequence_for_the_batch: >-
        BATCH-012 is the final authorised batch. Absent a Coordinator-allocated
        successor run, ANOM-3's internal comparison closes the campaign with no
        null-object control ever having been run against it.

    - id: D-7
      severity: moderate
      class: conclusion_scope_wider_than_the_axis_tested
      title: >-
        "The artifact tell is not triggered" is asserted from the N-inflation
        axis alone while the package's other axis shows the opposite
      location: >-
        report.md "What survives" bullet 4; propagated into the snapshot commit
        message ("S4 decays on all three parameter sets ... so the
        inventor-protocol artifact tell is not triggered")
      detail: >-
        Two destroying parameters were applied in this package and they disagree.
        Under N-inflation (S4) the margin does decay on all three sets --
        correct and reproduced. Under removal of the RC.MATZOV frame (S3 NULL-2)
        the ordering does not decay; it amplifies from +0.54/+4.59/+8.39 bits to
        +76/+166/+280 bits in models where such a gap is not credible. The
        producer records the second observation (ANOM-C) but does not carry it
        into the artifact-tell statement, which as written reads as a general
        clearance.
      correct_statement: >-
        The artifact tell is not triggered ON THE N-INFLATION AXIS. On the
        cost-model-frame axis the package's own data is consistent with the tell
        being triggered. Neither axis is the null-object control (D-6).

  # =====================================================================
  # VERDICT
  # =====================================================================
  verdict: passed
  terminal_verdict_enum: ADMISSIBLE_WITH_DEFECTS
  verdict_rationale: >-
    Every quantitative claim I could re-derive, re-derived. The package's
    load-bearing numbers are real and reproduce independently: the Step 0
    control passes byte-identically on the unpatched committed shim; a genuine
    Sage (passagemath 10.8.7, confirmed MPFR/Cython, confirmed NOT the shim by
    the PowerSeriesRing discriminator) was really obtained and the estimator
    really was run under it with the shim verified off sys.path from inside the
    interpreter; all six S1 values match to floating-point equality; the S4
    table, both flip points, both c* models, the S2 coverage arithmetic and the
    sampled NULL-2 cells all reproduce. Artifact integrity is clean end to end
    -- 8/8 hashes match across working tree, snapshot commit, snapshot receipt
    and the producer's own receipt. Command, revision, dirty-tree, seed,
    environment, budget and inference provenance are all recorded, including an
    honest fallback_used and an unverified-model flag.
    The defects are of two kinds. D-1, D-4 and D-5 are labelling and
    presentation errors that change no conclusion. D-2, D-3 and D-7 are
    characterisation errors: the numbers are right but what they are said to
    mean overstates or misdescribes them. D-6 is the substantive one and is not
    the executor's fault -- the only real null object in the package did not
    run, for the second batch running.
    The package is admissible as evidence of what it actually measured:
    instrument agreement, box coverage, cost-model-frame sensitivity, N-decay
    sensitivity, and per-attack c*. It is NOT admissible as evidence that
    ANOM-3's internal comparison is a finding rather than an artifact, and the
    producer does not claim it is.
  what_this_report_does_not_support: >-
    A passed validation means this receipt is admissible evidence. It does not
    support an ML-KEM break claim, does not demonstrate a speedup, does not
    validate the MATZOV cost model (two backends agreeing on a truncated
    asymptotic is agreement about arithmetic, not about the asymptotic), does
    not establish global optimality of the incumbent, does not clear ANOM-3 of
    being an artifact, and does not authorize promotion. AGENTS.md rule 12
    remains UNMET and UNWAIVED; no status of EV-MLKEM-011/013/015/017/018/019/
    020/021 or any KN-* entry is changed or proposed to change by this report.

  limitations:
    - >-
      I did not re-execute the ~376k individual MATZOV.cost evaluations behind
      S2 (compute-bounded). I verified the recorded totals, plane arithmetic,
      beta coverage and incumbent-exclusion facts, not each point.
    - >-
      I recomputed 4 of 18 NULL-2 cells, not all 18. All four matched exactly,
      including the sole negative cell.
    - >-
      I did not re-run the producer's 14-iteration bisection end to end. I
      verified both flip points by independent bracketing with a fresh process
      per evaluation.
    - >-
      I did not re-run the pip source build of sagemath-standard (R9b). Its
      PARI/GP failure is verified only by the producer's transcript, though `gp`
      is genuinely absent from this host and the other three acquisition
      negatives were independently reconfirmed.
    - >-
      Upstream sagemath 10.9 remains unobtainable here, so the matzov path is
      verified shim-vs-passagemath only. I added the corroboration that
      passagemath 10.8.7 matches archived sagemath 10.9 exactly on primal_bdd,
      which is the strongest available cross-version evidence but is not a
      10.9 matzov reference.
    - >-
      I did not rerun NULL-1. Doing so would be repairing a producer artifact,
      which the Validator contract forbids.
    - >-
      All figures are cost-model estimates under one pinned estimator revision
      and one reduction cost model family. They are not measurements of any
      attack.

