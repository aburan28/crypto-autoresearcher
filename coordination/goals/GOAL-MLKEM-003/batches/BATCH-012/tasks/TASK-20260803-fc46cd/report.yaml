        DECISIVE DISCRIMINATOR: PowerSeriesRing WORKS under passagemath
        ("Power Series Ring in x over Rational Field") whereas the shim's raises
        NotImplementedError by design. The shim is sage.all._RealField over
        mpmath at 200-bit precision. Two genuinely independent arithmetic
        backends.

    - id: R6
      claim: >-
        THE DISPUTED DELTAS. report.md table says K-512 and K-1024 matzov deltas
        are 0.000e+00; results.json records 4.155e-11 and 2.632e-11.
      status: reproduced
      adjudication: report.md is correct; results.json measures a different quantity under a misleading name
      detail: >-
        I computed both sides at full precision. SHIM: 139.65604148085845 /
        196.36624335399668 / 262.33568000747368. REAL SAGE: 139.65604148085845 /
        196.36624335005874 / 262.33568000747368. TRUE shim-vs-Sage deltas are
        therefore 0.0 / 3.9379e-09 / 0.0 -- exactly report.md's table.
        results.json's comparison_vs_shim.delta_bits compares Sage against
        ANCHOR_MATZOV (reserve_checks.py:68-72), which holds the ROUNDED
        PUBLISHED values 139.6560414809 / 196.3662433540 / 262.3356800075 --
        not shim outputs. Its 4.155e-11 and 2.632e-11 are the rounding residue
        of those anchors. Root cause is an asymmetry: ANCHOR_PRIMAL is stored
        full-precision (so primal deltas come out exactly 0.0) while
        ANCHOR_MATZOV is stored rounded. See defect D-1.
      does_it_matter: >-
        Not for any conclusion. Every figure involved is <= 4e-09 bits against a
        campaign statement scale of 0.001 bits and a NIST-category scale of
        1 bit. It matters only as a machine-readable field whose name does not
        describe its contents, and because the Coordinator's snapshot commit
        message repeated the mislabelled reading.

