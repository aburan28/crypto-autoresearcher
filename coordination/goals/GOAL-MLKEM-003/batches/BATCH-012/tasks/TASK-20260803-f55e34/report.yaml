  # =====================================================================
  # SCOPE LIMITS
  # =====================================================================
  narrowest_supported_statement: >-
    Under the pinned lattice-estimator 3e48ef421ec2 and the reduction cost model
    RC.MATZOV, evaluated at exactly the three FIPS 203 parameter shapes and under two
    arithmetic backends that run the same estimator source, estimator.lwe_dual.matzov
    reports a smaller log2(rop) than estimator.lwe_primal.primal_bdd by
    0.543432 / 4.592472 / 8.387943 bits. That difference is a property of the estimator's
    two functions at those three inputs; it is not stable across the parameter family
    those inputs are drawn from (it changes sign at n between 384 and 512 on the same
    Kyber shape), it is not costed in a common frame (the dual side receives a free-sieve
    accounting and drops an admitted O() that the primal side does not, and the primal
    side alone is amplified to a declared success probability), and essentially all of it
    at Kyber-768 is lattice reduction rather than the dual machinery being compared.
    Separately and independently: the public name LWE.dual_hybrid resolves to class MATZOV
    while EV-MLKEM-015's reproduce_estimates.py imported the module-level dual_hybrid
    (class DualHybrid). That is a verified fact about the archive. It makes EV-MLKEM-015
    incomplete about a different callable; it does not make it wrong, and this batch does
    not have authority to record it either way.
    No ML-KEM break. No security proof. No FIPS 203 parameter set affected or cleared.
    Cost-model estimates, not measurements. certificate.kind: none.

  scope_limits:
    - Everything above is scoped to lattice-estimator 3e48ef421ec2. A different pin is a different question.
    - arora_gb, dual and primal_hybrid do not run in this harness, so no "best attack" claim of any kind is available.
    - My re-derivations used passagemath 10.8.7, the same third implementation the producer used. Upstream sagemath 10.9, which RUN-MLKEM-015-001 used, remains unobtainable here and I did not obtain it.
    - My n-sweep fixes q=3329 and eta=2 and varies only n. It does not establish behaviour off that line, and n is not a free parameter of a deployed scheme.
    - I did not re-run S2's 376k-point scan or S4's bisection; those are marked unable_to_check with reasons above.
    - Nothing here is a statement about whether the dual-sieve attack works. That is Ducas-Pulles's question and this campaign never had the means to answer it.

  # =====================================================================
  # CLOSE OR CONTINUE
  # =====================================================================
  close_or_continue:
    recommendation: CLOSE, and close it as a completed goal rather than as a budget exhaustion.
    this_is_not_premature_closure_because: >-
      docs/inventor-protocol.md section 4 requires a named obstruction, an argument, and
      forward guidance -- not a count of screened mechanisms. All three are available here
      and none of them is "we tried and got tired".
      NAMED OBSTRUCTION: the campaign's instrument cannot answer the campaign's question.
      Every quantity it can produce is a difference of two estimator outputs, one of which
      explicitly drops an unbounded O() (lwe_dual.py:551) on the term that sets its own
      block size, and neither of which was ever intended to be differenced at 0.5-bit
      resolution. That is a method ceiling, and PAC-4 shows it does not reach the headline
      under ANY tuning. It is a statement about the problem, not about the search.
      ARGUMENT: OBJ-2 locates the truncation on the load-bearing term; OBJ-1 shows the
      resulting quantity has no stable value, growing without bound in n and changing sign
      inside the claim's own family; OBJ-3 shows the two sides use different cost
      bookkeeping. Three independent reasons, each checkable in minutes, that a further
      batch of the same kind produces a more precise number of the same unusable sort.
      FORWARD GUIDANCE, naming what remains open: KN-OPEN-016's actual question -- whether
      the dual-sieve attack works as costed -- is UNTOUCHED by twelve batches and is not
      closed by this recommendation. It is not reachable through the estimator at all; it
      needs experimental work on the score distribution of sieve-produced dual vectors,
      which is a different instrument and a different goal. That is the successor, and it
      is a good one.
    what_would_have_justified_a_13th_batch_and_does_not: >-
      CTRL-RT-1 through CTRL-RT-4 total well under 30 minutes of compute. If a batch were
      free I would spend it on CTRL-RT-2 (does the free-sieve accounting explain the whole
      margin?) and CTRL-RT-4 (put a control on the callable the campaign argues about).
      But neither can change the recommendation: CTRL-RT-2 can only reallocate the margin
      between two model components, both of which are inside the truncated side, and
      CTRL-RT-4 is harness hygiene. Neither reaches the obstruction. Spending batch 13 on
      them would be honest work aimed at a question the instrument cannot settle. They
      belong in the successor goal's setup, not in an extension of this one.
    the_honest_closing_statement: >-
      GOAL-MLKEM-003 set out to test whether the pinned lattice estimator's cost figures
      for ML-KEM are stable under independent re-derivation. It answered that, thoroughly
      and in the negative-for-the-interesting-part: the ARITHMETIC is stable to
      floating-point equality across two backends, three sessions and a wider parameter
      box than anyone had checked; the ORDERING between primal and dual is not stable at
      all, because it is a difference between a truncated model and an untruncated one and
      it changes sign inside ML-KEM's own parameter family 128 dimensions below Kyber-512.
      The campaign's most durable products are three facts and one correction, none of them
      the headline: that LWE.dual_hybrid and lwe_dual.dual_hybrid are different callables
      and EV-MLKEM-015 costed the latter; that memory charging at an exponent of order 1e-2
      dissolves every free-memory margin in the campaign (EV-MLKEM-020); that the harness
      has never had a known-answer control on the callable it spent four batches arguing
      about; and that Sage was obtainable here all along by a route four sessions did not
      try. No ML-KEM parameter set was shown to miss its NIST category and none was
      cleared. Rule 12 was never met and ANOM-3 was never promoted, which is the process
      working rather than failing.
    what_must_not_be_written_at_closure: >-
      Any sentence of the form "matzov is cheaper than primal_bdd", unqualified by
      parameter set, frame, pin and the truncation asymmetry. Any citation of S4's decay as
      discharging the inventor-protocol artifact-tell obligation (OBJ-6). Any reading of
      NULL-2's 17/18 as covering the Kyber-specificity question (OBJ-4). Any use of the
      word "verified" for S1 without "the arithmetic, not the model" attached (OBJ-5).

