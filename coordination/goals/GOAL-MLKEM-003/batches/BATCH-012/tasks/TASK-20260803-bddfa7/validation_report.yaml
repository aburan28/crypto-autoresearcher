  claim_verdicts:
    claim_1_whole_band_closed:
      numbers: reproduced
      interpretation: NOT SUPPORTED AS "CLOSED"
      statement: >-
        The measurements are right and the comparative content is real and is
        the first positive result this lane has produced: the exact region
        measure built from (4.10)/(4.11)/(4.24) fits the whole band at
        0.355665 / 0.317216 bits against the surrogate's best-over-two-parameters
        0.427122 / 0.427416 and its at-own-exponent 0.705492 / 0.696882, with ONE
        FEWER FREE PARAMETER and with no exponent fitted at all. I reproduced
        every one of those numbers with an independent implementation, and I
        strengthened the parameter-count claim: two different second parameters
        both select their null value on the whole band and buy nothing. THREE
        BATCHES OF WHOLE-BAND MISFIT FINDINGS WERE INDEED ABOUT A SURROGATE, AND
        THAT SHOULD BE RECORDED AS PLAINLY AS ANY ADVERSE READING. What is not
        supported is the word CLOSED: against a floor corrected for the profiled
        normalisation (D-1) the whole band sits at up to 1.13x (n=43) and 1.06x
        (n=50), not at or below 1.00x. The honest statement is that the exact
        measure removes about 80 percent of the surrogate's whole-band excess
        over the counting floor and lands within about 15 percent of it.
    claim_2_count_ge_1000_not_closed:
      numbers: reproduced for n=43; the n=50 M3 leg unable_to_check
      interpretation: SUPPORTED, AND STRENGTHENED
      statement: >-
        The count>=1000 misfit survives the substitution. 23.9x / 23.4x with the
        exponent frozen and 13.2x at matched parameter count (n=43) all
        reproduce, and both attacks on the matched-parameter construction fail:
        the surrogate's 16.5x baseline is a genuine interior optimum on a scan
        from p=8 to p=32, and a structurally different two-parameter embedding
        reaches 13.57x against M3's 13.23x. Under the corrected floor the ratios
        rise to as much as 26.3x / 26.2x, so the conclusion is strengthened, not
        weakened. ANOM-8 is confirmed as its cause: the residual on that band is
        99.9 percent autocorrelated with 0.00074 bits of high-frequency content
        against a 0.35-bit level - pure systematic shape error.
    claim_3_the_counting_floor:
      numbers: reproduced
      interpretation: SUPPORTED AS ARITHMETIC, WITH D-1 ON ITS USE
      statement: >-
        Third independent derivation; every published digit of both columns
        reproduces. The pooled-count recovery is exact, the C >= 1 conditioning
        is right, the asymptotic branch switch is immaterial, the plug-in lambda
        is defensible to better than half a percent, and an over-dispersion
        control the package did not run comes out in the floor's favour. The
        floor is not wrong. It is the wrong floor for a protocol that profiles a
        normalisation, by 6 to 11 percent, and that must be recorded before it is
        relied on again.

