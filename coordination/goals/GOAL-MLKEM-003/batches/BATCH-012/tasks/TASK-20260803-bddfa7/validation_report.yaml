  # =====================================================================
  limitations:
    - Toy tier only, two archived files, resolved band only. Nothing here bears on ML-KEM or Kyber security in either direction, on Carrier et al.'s cost figures, or on Table 5.1.
    - AGENTS.md rule 12 is UNMET and UNWAIVED. EV-MLKEM-011, EV-MLKEM-013 and EV-MLKEM-017 keep their status; KN-FIND-031 stays withdrawn. A passed validation is not a promotion and authorises none.
    - One execution, one producer implementation. The exact-measure model now has two independent implementations (producer and this validator) and the counting floor has three.
    - beta_sieve is taken as the .out header's beta_1 (44 / 41) rather than beta_0. I could not verify that identification against the source; it is inherited unchanged from BATCH-009 and is consistent with its archived p = 26.0, so it is not a per-model tuning, but it is an unverified premise underneath every number in the lane.
    - The Poisson dispersion control I ran covers the well-measured region only. It is untested where the increments are small, i.e. the deep tail, which is exactly where the whole-band statistic gets most of its weight.
    - The band ends at the last positive score, which imposes a selection effect on the deepest rows (a row whose true expectation is below one enters the band only when it fluctuates upward). Neither the package nor this review quantifies it; RT-12 recorded the same gap.
    - No null-object control exists anywhere in this lane, and no statement is recorded of what the rms/floor ratio should do as the parameter meant to destroy it increases. These are goodness-of-fit statistics rather than a claimed correlation or excess, so docs/inventor-protocol.md section 3 is not violated by their use here, but nothing in this lane may be read as evidence of a mechanism.
    - The normalisation is fitted to the data being compared; this is a shape comparison with one free scale, and RT-12's observation that a mechanism can hide inside the fitted normalisation applies to A exactly as it applied to K.
    - n=50 was not independently rescanned for M1's whole-band argmin, M3's s-curve, the slope table, or the ANOM-7 sensitivity variant. Those four items are marked unable_to_check.
    - dominated_by n/a - no attack is advanced and no cost frontier is occupied. sota_delta zero.

