  counting_floor_verdict:
    status: INDEPENDENTLY RE-DERIVED AND CORRECT AS ARITHMETIC; ONE DEFECT IN HOW IT IS USED
    method_used_by_validator: >-
      Own closed-form truncated-Poisson sum written from the model, not read
      from the producer or the red team. Different Poisson window
      (14 sqrt(lam)+20 vs 12 sqrt(lam)+20), different branch switch (2e5 vs 1e5),
      and a three-term asymptotic 1/lam + (7/4)/lam^2 + 4/lam^3 derived here
      from ln(1+u)^2 = u^2 - u^3 + (11/12)u^4 - (5/6)u^5 + (137/180)u^6 and the
      Poisson central moments mu2=lam, mu3=lam, mu4=3lam^2+lam, mu5=10lam^2+lam,
      mu6=15lam^3+25lam^2+lam.
    pooled_count_recovery: >-
      C_T = value_T * nb_iteration * q^{k_fft} CONFIRMED CORRECT AND EXACT.
      M = 55990084000 (n=43, nb_iteration=4000) and 83985126000 (n=50,
      nb_iteration=6000). Max relative deviation of value*M from an integer
      1.3604664602099005e-16 and 1.8152171959918975e-16 - the producer's
      1.360e-16 / 1.815e-16 reproduced.
    conditioning_on_C_ge_1: >-
      CORRECT. The band ends at the last positive score, so every row in it has
      C >= 1 by construction; dividing by (1 - e^{-lambda}) is the right
      truncation and is implemented correctly.
    validator_independent_values:
      n43_whole:        {n: 1803, truncated_poisson: 0.340570, delta_method: 0.409366}
      n43_count_ge_10:  {n: 1493, truncated_poisson: 0.163689, delta_method: 0.154224}
      n43_count_ge_1000: {n:  852, truncated_poisson: 0.014627, delta_method: 0.014620}
      n43_count_ge_1e5: {n:  551, truncated_poisson: 0.001072, delta_method: 0.001072}
      n50_whole:        {n: 2310, truncated_poisson: 0.327569, delta_method: 0.334742}
      n50_count_ge_10:  {n: 1969, truncated_poisson: 0.155755, delta_method: 0.147603}
      n50_count_ge_1000: {n: 1132, truncated_poisson: 0.015192, delta_method: 0.015185}
      n50_count_ge_1e5: {n:  636, truncated_poisson: 0.001357, delta_method: 0.001357}
    agreement: >-
      EVERY PUBLISHED DIGIT OF BOTH COLUMNS REPRODUCED. The floor now has three
      independent computations (red team C1, TASK-20260803-36f572, this session).
      DEC-20260803-2e82d5 struck one argument and elevated another on this
      number; the number is right.
    asymptotic_branch_switch: >-
      VERIFIED IMMATERIAL. My exact sums put the producer's two-term expansion at
      4.01e-6 / 4.00e-8 / 4.20e-10 relative error at lambda = 1e3 / 1e4 / 1e5,
      exactly the cross-check they report. Switching at 1e5 costs at most
      4e-10 relative.
    plug_in_lambda_defensible: >-
      YES for the value of the floor. Replacing the plug-in lambda = C_T by a
      local log-linear smoother of ln C_T (windows +-5, +-10, +-25) moves the
      whole-band floor by 0.09 / 0.18 / 0.44 percent, and DOWNWARD
      (0.340570 -> 0.339070 for n=43; 0.327569 -> 0.326856 for n=50).
      Consequence for ANOM-4: the report's explanation (i) is worth under half a
      percent and has the wrong sign, so it does not explain the 3 percent by
      which n=50 sits under its floor. Defect D-8; the real explanation is D-1.
    poisson_dispersion_control_run_by_validator: >-
      The producer did not test whether Poisson is the right marginal law when
      1.4e7 candidate scores share a lattice within each iteration. I did, on
      the archived increments D_T = C_T - C_{T+1}, with a local degree-3 fit on
      a window of 81 and an EXACT leverage correction: phi = 0.9166 / 0.9580 /
      0.9549 (n=43) and 1.2255 / 1.0001 / 1.0442 (n=50) against phi = 1 for
      Poisson. Poisson is right to within about +-20 percent in variance in the
      well-measured region. UNTESTED in the deep tail, where the whole-band
      statistic gets most of its weight - the same gap RT-12 recorded. The
      binomial (finite-M) correction is immaterial to six decimals.
    defect_in_use: >-
      SEE DEFECT D-1. The floor as published is the expected rms of a model that
      is exactly right and carries NO free parameter. Every rms in this lane is
      produced by a protocol that profiles one normalisation on the same rows.
      Survival counts are cumulative, so the counting residual is a Brownian
      motion in the time change 1/lambda, and a profiled constant removes a large
      share of it. The protocol-correct floor is 0.89-0.94 times the published
      one. Comparative statements are unaffected; the absolute readings "at the
      floor" and "below the floor" are not.

