  # =====================================================================
  answers_to_the_numbered_review_questions:

    - question: 1 - recompute the counting floor independently; check the branch switch and the plug-in lambda
      answer: >-
        DONE, FROM SCRATCH, WITH A DIFFERENT WINDOW, A DIFFERENT SWITCH POINT
        AND A THREE-TERM ASYMPTOTIC DERIVED HERE. All eight published values
        reproduce to every digit, and so does the delta-method column. The
        branch switch is immaterial (<= 4e-10 relative). The plug-in lambda is
        defensible: smoothing it moves the whole-band floor by at most 0.44
        percent and downward. C_T = value * nb_iteration * q^k_fft is exact.
        Conditioning on C >= 1 is correct. THE FLOOR IS RIGHT. Its USE is not:
        it is a zero-free-parameter floor applied to one-free-parameter fits
        (D-1).

    - question: 2 - verify Claim 1's parameter count and that the exponent is frozen, not tuned
      answer: >-
        CONFIRMED. rho_M2(lnA) = F(lnA + lnG) has exactly one free scalar, a
        normalisation. Every other input is read from the .out header and none
        is fitted. d_lat provably cancels (my implementation never uses it). The
        exponent is not a parameter at all: M2 is not a power law, and its
        effective exponent is a derived quantity - asymptotically
        (beta_sieve+n_fft)/2 = 26.0 / 24.5 as v -> 0 because Upsilon_n(x) ~
        exp(-x^2/(4(n+1))) makes E(v) an ellipse quadrant, drifting over
        [17.9, 26.2] at larger v. Strongest confirmation: on the whole band TWO
        different second parameters (F(A G^s) and F(A G v^c)) both select their
        NULL value exactly and return M2's own rms, so the second degree of
        freedom buys literally nothing there.

    - question: 3 - attack Claim 2's matched-parameter construction
      answer: >-
        IT SURVIVES BOTH ATTACKS, AND A THIRD CHECK BREAKS A DIFFERENT ROW.
        (a) The surrogate baseline is not grid-limited where it matters: scanning
        p from 8 to 32 puts the count>=1000 optimum genuinely interior at p ~ 20
        with rms 0.2419, so 16.5x is real and the 16.5x -> 13.2x comparison is
        fair. (b) M3 is not a flattering family: a structurally different
        two-parameter embedding, F(A G(v) v^c), reaches 13.57x against M3's
        13.23x on the same band. 13.2x is a property of the exact measure plus
        one extra degree of freedom, not of the executor's choice of family.
        (c) HOWEVER the same wide scan shows the count>=1e5 row of table 3.4 is
        wrong: the surrogate reaches 66.5x, not 177x, so "177x -> 61.4x" is not
        a reduction. Defect D-2.

    - question: 4 - check ANOM-1 thoroughly, including whether BATCH-010 is affected
      answer: >-
        FIX CORRECT; ASSERTION FIRES ON THE RIGHT CONDITION; BATCH-010 IS
        GENUINELY UNAFFECTED. build_u_nodes sorts globally in u, which makes the
        kept set an interval and hence contiguous in j; the assertion in
        build_kernel tests exactly j != prev+1 inside the row-building loop for
        every score. BATCH-010 cannot express the defect: exponent_neighbourhood_scan.py
        accumulates J[i] over the FULL band for every node with no index
        bookkeeping and no slice, and jensen_bias_bound.py's integrate() zips
        nodes with values in parallel (and its node list is sorted anyway).
        BATCH-010's numbers do not move; I additionally corroborate its 0.705494
        at 0.705502.

    - question: 5 - check ANOM-4, the n=50 sub-floor reading
      answer: >-
        THE EXECUTOR'S READING IS DIRECTIONALLY RIGHT AND QUANTITATIVELY WRONG,
        AND THE REAL CAUSE IS BIGGER THAN STATED. Reason (i), plug-in noise in
        lambda, is worth under 0.5 percent and has the wrong sign (smoothing
        lowers the floor). Reason (ii), the fitted normalisation, is the whole
        story and is quantifiable: because survival counts are cumulative the
        counting residual is a Brownian motion in 1/lambda, and profiling one
        additive constant removes 8 to 11 percent of its rms. Correcting for it
        puts n=50's whole band at up to 1.06x and n=43's at up to 1.13x. NOTHING
        IS BELOW ITS FLOOR once the floor is computed for the protocol actually
        used. The fit is not wrong and the floor arithmetic is not wrong; the
        yardstick was the wrong one. This is D-1 and it is the single most
        consequential finding of this review.

    - question: 6 - check ANOM-8; is that what the count>=1000 ratio is measuring
      answer: >-
        YES, UNAMBIGUOUSLY. Reproduced the residual profile exactly. On the
        count>=1000 rows the M2 residual has lag-1 autocorrelation 0.99907 and a
        high-frequency (second-difference) content of 0.00074 bits against a
        level of 0.3498 bits - it is essentially pure low-frequency systematic
        shape error, carrying 20x LESS high-frequency content than the counting
        floor while sitting 24x above it in level. Refitting on the sub-band
        moves it by 0.0004 bits (0.349849 at the whole-band fit vs 0.349478 at
        its own), so the ratio is not an artifact of refitting either. The
        count>=1000 ratio is measuring the S-shaped shape error and nothing else.
        Caution recorded against myself: a degree-12 polynomial in T reaches 0.7x
        the floor on that band, but that is NOT an achievability argument,
        because Brownian counting noise puts ~99.6 percent of its energy in its
        first 12 Karhunen-Loeve modes. I decline to use it.

    - question: 7 - mark every quantitative claim
      answer: see metric_recomputations; 20 reproduced, 3 unable_to_check, 1 not_reproduced, 2 qualified

  # =====================================================================
  defects:
    - id: D-1
      severity: moderate
      class: interpretation, affects a headline word and three ledger records
      title: The counting floor is a zero-free-parameter floor applied to one-free-parameter fits
      detail: >-
        C_T is a cumulative survival count, so with D_t independent Poisson,
        Cov(C_T, C_T') = Var(C_max) and the counting residual
        eps_T = ln(C_T/lambda_T) has Cov(eps_T, eps_T') = min(1/lambda_T,
        1/lambda_T'). eps is a Brownian motion in the time change 1/lambda, not
        white noise. Every rms in this lane profiles one normalisation on the
        same rows, and a profiled additive constant removes a large share of a
        Brownian residual. Computed on the archived counts, the achievable floor
        under one profiled constant is 0.923 / 0.915 of the published whole-band
        floor and 0.907 / 0.894 at count>=1000. Measured leverage
        d ln(Pred)/d ln A is ~1 for T >= 700 and small at small T, so the true
        factor is near 0.92 on the whole band and between 0.90 and 1 on
        count>=1000.
      impact: >-
        Whole band: M2 1.04x -> up to 1.13x (n=43) and 0.97x -> up to 1.06x
        (n=50); surrogate best-over-p 1.25x/1.30x -> up to 1.36x/1.43x.
        count>=1000: M2 23.9x/23.4x -> up to 26.3x/26.2x. EVERY MODEL MOVES BY
        THE SAME FACTOR, so no comparative claim in the package changes and
        Claim 2's verdict is unchanged. What must change is the absolute
        language: "CLOSED" and "at the counting-noise floor" are not supported at
        1.04x/0.97x, and "below the plug-in floor" (ANOM-4) is an artifact of the
        wrong yardstick. It also revises EV-MLKEM-2e668d C-1 and C-2 and
        DEC-20260803-2e82d5 in the direction that STRENGTHENS their conclusions.
      requested_action: >-
        Coordinator: carry the corrected floor range forward; downgrade "CLOSED"
        to "consistent with the counting floor to within the floor's own
        protocol correction". Do not restate 0.97x as beating perfection.

    - id: D-2
      severity: moderate
      class: factual error in the report; one table row must be struck
      title: >-
        report.md section 3.2's "the rms value at the edge is not scan-limited,
        only the argmin location" is false, and table 3.4's count>=1e5 row
        depends on it
      detail: >-
        Scanning the surrogate exponent from p=8 to p=32 (n=43) on my own
        implementation gives count>=1e5 rms 0.071339 at p=15.0 against 0.189907
        at the producer's grid edge p=20 - a factor of 2.66. The best-over-p
        surrogate on that band is ~66.5x the floor, not 177x, so table 3.4's
        "count>=1e5: 177x -> 61.4x, 218x -> 125x: reduced, not closed" is not a
        demonstrated reduction; 61.4x against 66.5x is a tie. The n=50 count>=1e5
        argmin is also at its grid edge (p=18.5) and is expected to behave the
        same way, though I did not scan it.
      impact: >-
        Confined to the count>=1e5 rows of tables 3.1, 3.2 and 3.4 and to the
        count>=1e5 endpoint of the drift comparison in 3.4. The count>=1000
        conclusion, which carries Claim 2, is NOT affected: I verified the
        surrogate optimum there is genuinely interior.
      requested_action: >-
        Coordinator: strike the count>=1e5 comparison row and the section 3.2
        sentence; the M2 and M3 count>=1e5 values themselves stand.

    - id: D-3
      severity: low
      class: undisclosed failed control; invalid stated justification, correct conclusion
      title: The region-truncation control's envelope bound fails its own check, in both files, unreported
      detail: >-
        results.json records upsilon_a_envelope_dominates_last_lobe FALSE and
        upsilon_b_envelope_dominates_last_lobe FALSE for both files (n=43: last
        lobe max 1.7450e-07 vs envelope 1.3077e-07 and 2.1119e-06 vs 2.0231e-06;
        n=50: 3.4934e-07 vs 9.0388e-08). The asymptotic Bessel envelope
        Gamma(n+1) 2^n sqrt(2/(pi x)) x^{-n} is not valid at x=34 for n=22, where
        x is not much larger than n. report.md section 4 nevertheless states
        those envelope numbers as bounds and declares the truncation IMMATERIAL,
        and the derived v_exact_max = 13.111 rests on them.
      impact: >-
        None on the numbers. I verified the conclusion directly by enlarging the
        grids to xi<=45, eta<=200: G(v) is unchanged in double precision for
        v <= 14 and differs by 1.09e-04 relative at v=16, while F saturates to
        1-1e-12 at v = 10.72 / 10.47. The truncation is genuinely immaterial; the
        argument given for it is not sound and its failure was not surfaced.
      requested_action: >-
        Record the corrected justification (measured lobe maxima plus the direct
        grid-enlargement test) rather than the envelope.

    - id: D-4
      severity: low
      class: internal inconsistency in the provenance record
      title: Two different peak-RSS values inside one package
      detail: >-
        report.md states 0.0685 GB twice; results.json top level says
        peak_rss_gb 0.06849288940429688 but
        provenance.resource_measurements.peak_rss_gb_ru_maxrss says
        0.07438278198242188.
      impact: none on any result; both are far under the 4 GB budget

    - id: D-5
      severity: low
      class: wording
      title: The count>=1000 "agreement to every digit" compares different estimators
      detail: >-
        The red-team report records 0.0146 (n=43) and 0.0152 (n=50) at
        count>=1000 under `delta_method`. report.md section 2 presents them as
        agreeing with its truncated-Poisson column. My computation gives
        delta 0.014620 / 0.015185 and truncated-Poisson 0.014627 / 0.015192, so
        both agree to four decimals and nothing is numerically wrong, but the
        claimed correspondence is between two different estimators.

    - id: D-6
      severity: low
      class: declared protocol deviation, correctly reported
      title: DEV-1, counting_floor.py named in the handoff deliverables and not produced
      detail: >-
        The handoff's deliverables field names a fourth file while its
        artifact_paths declares three. The executor reported the conflict rather
        than resolving it and shipped the floor behind --mode floor. I ran that
        entry point from the committed snapshot: it writes nothing and reproduces
        all eight values. No admissibility impact.

    - id: D-7
      severity: low
      class: artifact policy
      title: DEV-2, no runs/<RUN-ID>/ package, and an unprobed model identifier
      detail: >-
        Every field docs/evidence-and-reproducibility.md asks for is present
        inside results.json.provenance, which does close the BATCH-010 DEV-1 and
        validator D1 gap. Two residual items: git_dirty_tree was true at run time
        (dirty only in this task's own untracked directory, and the snapshot
        commit then froze exactly those bytes, whose hashes I re-verified); and
        inference.model_verified is false because the adapter probe was not run,
        so the resolved model identifier is unverified configuration by
        AGENTS.md's own standard. The fallback itself is recorded honestly with a
        reason, as CLAUDE.md's model-policy note requires.

    - id: D-8
      severity: low
      class: an anomaly's stated cause is quantitatively too small and has the wrong sign
      title: ANOM-4 reason (i) does not do the work the report gives it
      detail: >-
        Replacing the plug-in lambda = C_T by a local log-linear smoother moves
        the whole-band floor by 0.09 / 0.18 / 0.44 percent at windows +-5 / +-10
        / +-25, and DOWNWARD (0.340570 -> 0.339070; 0.327569 -> 0.326856), which
        makes the ratio worse rather than better. Reason (ii) is the whole story
        and is D-1.

