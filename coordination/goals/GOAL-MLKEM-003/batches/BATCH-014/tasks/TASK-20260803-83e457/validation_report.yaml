    - id: M-9
      quantity: "per-model decomposition and the identity closure"
      status: reproduced
      validator: >-
        From BATCH-012's archived rms values and my own floors: M2 n=43 ratio
        whole 1.044324, ratio C>=1000 23.8924, deep rms 0.361119 bits, deep ratio
        0.77042, identity constant 0.5930256, sqrt(C) = 0.77008; M2 n=50 0.968397,
        23.4140, 0.275206, 0.60028, 0.3599504, 0.59996; M4 n=43 and n=50 likewise.
        The identity ratio_whole^2 = C + ratio_M^2/A closes to 10 digits on every
        model (e.g. M2 n=43 1.0906124573 = 1.0906124573).
    - id: M-10
      quantity: "the red team's identity constant 0.5919 -> 0.769x"
      status: unable_to_check
      reason: >-
        BATCH-012 archived rms SUMMARIES, not per-row residual vectors, so the
        red team's single-whole-band-fit decomposition cannot be reconstructed
        from committed bytes. I independently confirm the producer's 0.5930 ->
        0.7701x and I independently confirm the DIRECTION of their explanation for
        the 0.19 % gap (a sub-band-optimised rms is never larger than the same
        fit's rms restricted to that sub-band, so a two-fit reconstruction
        over-states sum_deep and hence C). ANOM-7's four reconstruction_valid:
        false flags are correct and no unsupported number is reported for them.
        The named successor (archive residuals[T] per model per fit) is the right
        and cheap fix.
    - id: M-11
      quantity: "ANOM-5, the mid-band disagreement between the two files"
      status: reproduced
      producer: "n=43 0.802 +/- 0.084 (-2.29 sd); n=50 1.106 +/- 0.067 (+1.89 sd), stable over degrees"
      validator: >-
        n=43 mid band [551,851]: phi = 0.9067 (p=4), 0.8101 (p=6), 0.8032 (p=8),
        0.8020 (p=10), 0.8037 (p=13), 0.7940 (p=18), 0.7865 (p=23), 0.8024 (p=33).
        n=50 mid band [636,1131]: 1.1082 (p=4) down to 1.0827 (p=33). See
        control C-6 for the null-object control.
    - id: M-12
      quantity: "ANOM-4, the binning-selection control"
      status: reproduced
      producer: "greedy observed-count binning reads 0.9270 (n=43) and 1.2200 (n=50) against 0.8954 / 1.0621"
      validator: >-
        0.9270 (n=43) and 1.2198 (n=50) -- agreement to four decimals, because
        observed-count binning fixes the bin edges from the data alone and a
        degree-2 B-spline with no interior knots spans the same quadratic space as
        a Chebyshev degree-2 fit. This cross-validates BOTH implementations and
        isolates the whole difference between my 0.9494 and their 0.8954 to bin
        PLACEMENT. Two defensible implementations of the same stated
        expected-count rule move phi by 0.054 (n=43) and 0.061 (n=50), about a
        third of a standard deviation. ANOM-4's substance is confirmed; its
        direction is not a rule (my observed-count shift is DOWN for n=43).
    - id: M-13
      quantity: "ANOM-3, analytic sd instability at high leverage"
      status: reproduced
      validator: >-
        Confirmed and worse on my construction: my analytic sd reached 1240.8,
        4.5e7 and 7.5e12 on fits whose maximum bin leverage hit 1.0000 (producer
        records 1560 and 12415 in the C<1e5 region). The mechanism is 1/(1-h) in
        Var(r^2) = (2 + 1/mu)/(1-h)^2 when a wide terminal bin is essentially
        fitted by itself. YES, the Monte-Carlo sd is the one to read throughout,
        and it is what I read. See defect D-3.
    - id: M-14
      quantity: "section 4.4 C>=1000 comparison table"
      status: reproduced
      validator: >-
        M2 n=43 23.89x / 1.044x and M2 n=50 23.41x / 0.968x recomputed from
        BATCH-012's archived rms and my own floors. The n=50 M2 whole-band ratio
        of 0.968x -- a model scoring BETTER than the counting floor -- reproduces
        independently and is the cleanest single illustration of why the
        whole-band statistic is uninterpretable.

  control_checks:
    - id: C-1
      control: "power control, over-dispersed alternative phi_true = 1.5"
      producer: "recovered as 1.4586 +/- 0.2365 (n=43) and 1.5209 +/- 0.2468 (n=50)"
      validator: "recovered as 1.5038 +/- 0.2529 (n=43) and 1.5312 +/- 0.2406 (n=50), 200 replicates each, seed 424242, gamma-Poisson mixing"
      verdict: >-
        HONEST AND REPRODUCED. The estimator recovers a seeded phi_true = 1.5 as
        approximately 1.5, with no attenuation, on a second independently written
        implementation. The null is informative, not empty. Qualification: the
        EXCLUSION of phi = 1.5 by the observed reading is 2.4 sd for n=43 but only
        1.9 sd for n=50 on the producer's own numbers (1.69 sd on mine). "The test
        would have seen real over-dispersion" is fair for n=43 and an
        over-statement for n=50 taken alone.
    - id: C-2
      control: "power control DOWNWARD -- run by this validator, absent from the package"
      validator: >-
        Binomial thinning (m = round(lambda/(1-phi)), p = lambda/m, so Var = phi*lambda
        exactly), 200 replicates each: phi_true = 0.80 recovered as 0.8126 +/- 0.1326
        (n=43) and 0.8079 +/- 0.1288 (n=50); phi_true = 0.60 recovered as
        0.6167 +/- 0.1048 and 0.6232 +/- 0.0958; phi_true = 1.30 as 1.2943 +/- 0.2086
        and 1.2942 +/- 0.1850.
      verdict: >-
        The estimator is unbiased against sub-Poisson alternatives too. But n=43's
        observed reading is only +1.03 sd from phi_true = 0.80 -- NOT excluded --
        and 0.80 is exactly what the same instrument measures at -2.4 sd in n=43's
        mid band. The genuinely unexcluded band is about [0.78, 1.40] for n=43 and
        [0.85, 1.55] for n=50; phi = 0.60 IS excluded (3.2 sd and 5.2 sd), so the
        report's stated "[0.6, 1.4] not excluded" is honest and slightly
        conservative at the low end. See defect D-2.
    - id: C-3
      control: "plug-in lambda = C_T returns phi = 0.000 identically, leverage exactly 1, residual exactly 0"
      status: confirmed_arithmetically_but_vacuous
      validator: >-
        My own evaluation returns 0.0000000000 in both files, so the arithmetic is
        right. But it is a TAUTOLOGY, not a measurement: the shipped code (lines
        772-774) is `lamb = float(b["Y"])` followed by `((b["Y"] - lamb)**2)/lamb`,
        whose numerator is (Y - Y)^2. It is identically zero for any input and no
        archived byte enters it. "Leverage exactly 1" is asserted in the adjacent
        note and never computed. It is also not lambda = C_T: b["Y"] is the bin's
        own INCREMENT count, not the cumulative tail count.
      bearing_on_prior_attempts: >-
        NONE. The two S-11 attempts (BATCH-013 TASK-20260803-b214b1 objections.md
        section 2.7) were (i) a local unweighted quadratic detrend on 51-row blocks
        and (ii) a global log-linear Poisson trend on 16/24/40-row windows. Neither
        is a plug-in; both fit a trend and both returned non-zero phi. The
        producer's report presents this control correctly as a demonstrated failure
        mode. The Coordinator's snapshot headline promotes it to "the construction
        the earlier attempts leaned on cannot produce a dispersion reading at all,
        in either direction", and that does not follow. Defect D-6.
    - id: C-4
      control: "Poisson null object of the same shape, deep tail (docs/inventor-protocol.md section 3)"
      producer: "MC-A mean 0.9850 sd 0.1542 (n=43) and 1.0022 sd 0.1665 (n=50), 300 replicates"
      validator: "mean 0.9935 sd 0.1580 (391 usable of 400) and 1.0143 sd 0.1674 (396 of 400), seed 424242"
      verdict: >-
        PASS. Two independent implementations agree on the null sd to 2-3 % and on
        the estimator bias (<= 1.5 %). The reported signal is measured against a
        null object of the same shape, as the protocol requires.
    - id: C-5
      control: "leverage-trim and no-leverage variants"
      producer: "trim h<=0.5 moves phi by -0.007 / +0.011; Pearson/K 0.858/1.031; Pearson/(K-P) 0.891/1.068"
      validator: "trim moves phi by +0.0117 / +0.0126; Pearson/K 0.9209/1.0913; Pearson/(K-P) 0.9559/1.1303"
      verdict: "PASS. Same structure and same magnitude. The terminal high-leverage bin is not driving either headline."
    - id: C-6
      control: "null object for ANOM-5 -- is the mid-band reading an instrument artifact?"
      validator: >-
        60 replicates per file, my own pipeline. n=43 mid band: observed 0.8020,
        Poisson null of the same shape reads 0.9923 +/- 0.0806, so observed is
        -2.36 sd; a seeded sub-Poisson phi_true = 0.80 is recovered as
        0.8020 +/- 0.0665. n=50 mid band: observed 1.0916, null 0.9924 +/- 0.0639,
        +1.55 sd. Producer's own nulls: 0.9952 +/- 0.0843 (-2.29 sd) and
        0.9804 +/- 0.0667 (+1.89 sd).
      verdict: >-
        ANOM-5 IS REAL. Not an instrument artifact (the estimator is unbiased on a
        null object of the same shape and recovers the alternative exactly) and not
        a rate-model artifact (n=43 is flat at 0.79-0.81 while the rate model is
        given 6 to 33 parameters, and extra parameters can only push phi UP by
        absorbing misfit). The two archived files genuinely disagree about mid-band
        dispersion, at -2.4 sd and +1.6 sd. Note also that n=50 reads over-dispersed
        in EVERY measurable region on the producer's own MC z-scores (mid +1.89,
        shallow +1.54, C<1e5 +1.93) while n=43 does not: this looks like a
        file-level property rather than a band-level one. Unexplained; correctly
        left uninterpreted by the producer; it should not be dropped.
    - id: C-7
      control: "decay check -- does the measured quantity behave as it should as the destroying parameter increases?"
      validator: >-
        Applied to the rate-model order, which is the parameter meant to destroy a
        misfit-driven dispersion reading. n=50's mid-band over-dispersion DOES decay
        with model order (1.251 at p=3 -> 1.108 at p=4 -> 1.083 at p=33), consistent
        with part of it being rate-model misfit. n=43's mid-band UNDER-dispersion
        does NOT decay and cannot, since added parameters only inflate phi; it is a
        genuine variance deficit. In the deep tail neither file shows a trend with
        order among the converging models. The report does not state what its
        measured quantity should do as model order increases; I state it here.

  heuristic_validation_checks:
    - id: H-1
      check: pre-registered prediction
      result: partial
      detail: >-
        The Poisson null and the five design decisions are stated as fixed before
        either prior attempt was read (report section 2, and the comparison in 2.6
        is explicitly written afterwards). I cannot verify the ordering from
        committed bytes -- there is one commit and one script -- so this rests on
        the producer's declaration. ANOM-4 is a genuinely pre-registered prediction
        that was recorded as WRONG (greedy observed-count binning was predicted to
        bias phi down and measured up), which is evidence that the practice is real.
    - id: H-2
      check: sample integrity (sample size, seeds, procedure in the manifest; statistics recomputed from raw)
      result: pass
      detail: >-
        Seed 20260803 and its declared use, replicate counts (300/150/150 per
        region), and the full binning/fitting procedure are in results.json. Every
        headline statistic was recomputed here from the raw .out bytes rather than
        copied, and the whole results.json was rebuilt bit-identically.
    - id: H-3
      check: scale binding
      result: pass
      detail: >-
        Toy tier is declared in the artifact, in the report's first paragraph, in
        section 6, and in every headline. AGENTS rule 7 is observed: nothing is
        presented as crypto-scale. No ML-KEM security claim is made in either
        direction.
    - id: H-4
      check: correspondence validity
      result: not_applicable
      detail: No substitute-sampling correspondence is used; the statistic is computed on the archived data directly.

  cost_model_checks:
    - id: K-1
      check: concrete cost table with declared unit
      result: not_applicable
      detail: >-
        The package reports no cost model and claims no speedup, so the
        docs/inventor-protocol.md section 6 ladder (isolate-and-measure,
        scaled-down whole-pipeline ratio, named cheats, exercised reproducibility
