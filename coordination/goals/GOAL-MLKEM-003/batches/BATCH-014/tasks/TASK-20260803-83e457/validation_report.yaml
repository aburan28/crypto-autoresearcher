    - id: M-4
      quantity: "binning gate: expected count >= 10, and the leverage correction"
      status: reproduced
      producer: "min fitted expected count 10.026 / 10.003; sum(h) = 3.0000000; Var = mu(1-h)"
      validator: >-
        min fitted expected count 10.038 / 10.005 on my own bin placement;
        sum(h) = 3.0000000000 exactly; I re-derived
        sum_j S_kj^2 mu_j = G_k^T I^-1 (sum_j G_j G_j^T / mu_j) I^-1 G_k
        = G_k^T I^-1 G_k = h_kk mu_k, so Var(Y_k - mu_hat_k) = mu_k (1 - h_kk).
        The producer's section 2.1(c) algebra is correct and the correction is
        applied exactly where the report says: to the residual variance of the
        RATE FIT.
      caveat: >-
        Both "sum h = #params" and "expected_count_ge_10_holds" are true by
        construction, not by measurement. sum_k h_kk = tr(I^-1 I) = p holds at ANY
        beta, converged or not; and bins are BUILT by accumulating the fitted rate
        until it crosses 10. Neither is wrong; neither is a diagnostic. See D-5.
    - id: M-5
      quantity: "whole-band noise budget and counting floors"
      status: reproduced
      producer: "209.125905994369 / 247.86602830759918; floors 0.3405697373164575 / 0.32756878812803675"
      validator: >-
        209.125905994 / 247.866028308; floors 0.3405697373165 / 0.3275687881280.
        These also match BATCH-012's own archived counting_floors block to 13
        digits (0.3405697373164576, 0.16368862345983295, 0.014627143423849945,
        0.001071947155002997, delta-method 0.40936556421392906). This is a FOURTH
        independent computation of the floors.
    - id: M-6
      quantity: "effective degrees of freedom, whole band, D-1 covariance with EXACT truncated-Poisson variances"
      status: not_reproduced
      producer: "1.545428738352816 (n=43) and 1.5134820104447422 (n=50), field name nu_D1_min_of_variances_exact, formula stated as (sum a)^2 / sum_{T,T'} min(a_T,a_T')^2"
      validator: >-
        Evaluating that formula literally, by brute force over all 1803^2 and
        2310^2 pairs (and by an order-independent sorted collapse, which agrees):
        1.573411205 (n=43) and 1.519355998 (n=50). The producer's numbers are
        reproduced exactly by a DIFFERENT convention: Sigma_ij = the a of the row
        with the LARGER lambda, equivalently the T-order collapse
        sum_i (1 + 2(n-1-i)) a_i^2. The two differ only because a_exact is
        non-monotone at exactly one step per file (n=43 T=1681 C=3 a=0.678572 ->
        T=1682 C=2 a=0.614974; n=50 at T=2283/2284, same values), which
        results.json itself records as variance_sequence_non_monotone_steps: 1.
        The step lies in the deep tail, which is why EVERY sub-band value agrees
        exactly and only the whole-band figure moves.
      consequence: >-
        Under the as-implemented convention 1.5454 -> 1.55 and the report's "exact
        to published digits" holds. Under the formula as WRITTEN, 1.5734 -> 1.57
        and it does not. Both conventions are defensible; the mismatch between the
        stated formula and the computed value is defect D-1. The
        O(1)-not-O(n) conclusion is unaffected.
    - id: M-7
      quantity: "all other effective-dof values"
      status: reproduced
      validator: >-
        nu_white exact 422.158433 / 471.082747; nu_white delta 245.152756 /
        326.949143; nu_D1 delta 2.059985 / 2.040459; nu_D1 correlation-scaled
        exact 2.348577 / 1.842122; C>=10 sub-band 1.822204 / 1.942108; C>=1000
        sub-band 1.808799 / 1.899175; C>=1000 white 162.465801 / 237.582174;
