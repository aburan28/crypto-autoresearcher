  proof_architecture_checks:
    - id: P-1
      check: baseline fixture reproduces exactly
      result: pass_with_one_exception
      detail: >-
        Every structural quantity in the retirement basis reproduces symbolically
        or to 10+ digits on a third independent implementation (M-5, M-7, M-8,
        M-9). The one exception is the whole-band nu_D1 with exact variances
        (M-6), where the stated formula and the computed value use different
        conventions.
    - id: P-2
      check: quantifier fidelity
      result: pass
      detail: >-
        Every claim is scoped to the two archived toy files, the resolved band, the
        raw score scale and the tested regions. The report states explicitly that
        C1 does not test iteration-level exchangeability and does not test the
        band-truncation selection effect, and that the C_T < 10 rows are untested
        and untestable from this archive.

  claim_status:
    - claim: "Claim A -- the deep tail is consistent with Poisson"
      status: reproduced
      basis: M-2, M-3, C-1, C-2, C-4
      statement: >-
        YES. Under my own windowing, my own rate estimator, my own binning rule and
        my own Monte-Carlo calibration, the deep tail of both archived files is
        consistent with Poisson: n=43 phi = 0.9494 at -0.28 sd of its own null,
        n=50 phi = 1.1229 at +0.65 sd, and no window in either file at any of my
        three windowings departs from 1.0 by more than 1.20 of its own sd. The
        power control is honest and reproduces: a seeded phi_true = 1.5 comes back
        as 1.504 and 1.531 with no attenuation. This lane now has a clean,
        well-powered null where two previous attempts had none, and it should be
        recorded as a real result.
      bounds: >-
        The resolution is +/-0.16 and the point estimate moves by about 0.05-0.06
        between two defensible implementations of the SAME stated binning rule
        (M-12). phi = 0.80 is not excluded for n=43 (1.03 sd), and phi = 0.80 is
        exactly what the same instrument measures at -2.4 sd in n=43's mid band
        (C-6). The correct statement is therefore: the deep tail is consistent with
        Poisson at +/-40 %, and is equally consistent with the sub-Poisson departure
        the same instrument resolves 300 rows shallower in the same file.
    - claim: "Claim B -- both retirement numbers reproduce (six values plus the attenuation identity)"
      status: reproduced_with_one_defect
      basis: M-5, M-6, M-7, M-8, M-9, M-14
      statement: >-
        Five of the six reproduce on a THIRD independent implementation to 6+
        significant figures: white-noise 422.158433 / 471.082747 and C>=1000
        1.808799 / 1.8991753. So do the whole-band budgets 209.125905994 /
        247.866028308, the four counting floors (a fourth independent computation,
        matching BATCH-012 to 13 digits), the measurable budgets, the deep-tail
        floors 0.468731669 / 0.458465706, the attenuation folds 1147.226581x /
        948.726689x, the measurable shares 0.087167 % / 0.105404 %, and the identity
        closure to 10 digits on every model. The sixth -- the headline whole-band
        dof -- is defect D-1.
    - claim: "Claim C -- a new whole-band dof convention sensitivity, 1.51 to 2.35"
      status: reproduced_and_understated
      basis: M-6, M-7
      statement: >-
        The three reported conventions reproduce exactly (1.5454 / 2.0600 / 2.3486
        for n=43; 1.5135 / 2.0405 / 1.8421 for n=50). There is a FOURTH -- the
        formula as literally written -- giving 1.5734 / 1.5194, and it is the one
        that decides whether "1.55 reproduces exactly". The producer's own
        conclusion is correct and, if anything, stronger than stated: the
        O(1)-not-O(n) reading is robust across all four conventions (all between
        1.51 and 2.35 against n = 1803/2310 rows and a white-noise nu of 422/471),
        while the two-significant-figure "1.55" in DEC-20260803-52a750 is not.
    - claim: "phi = 0.000 under the plug-in construction is a strong statement about the earlier attempts"
      status: not_reproduced
      basis: C-3
      statement: >-
        The arithmetic is confirmed (0.0000000000) but it is a tautology of the
        expression (Y - Y)^2 / Y and involves no archived byte. It says nothing
        about the two S-11 attempts, which fitted trends rather than plugging in.
        The producer's report frames it correctly; the Coordinator's headline
        framing is not supported.

  defects:
    - id: D-1
      severity: material
      title: "the headline whole-band dof is computed by a different convention than the one stated"
      detail: >-
        results.json names the field nu_D1_min_of_variances_exact and the report
        states the formula as (sum a)^2 / sum_{T,T'} min(a_T,a_T')^2. Evaluated
        literally that expression gives 1.573411205 (n=43) and 1.519355998 (n=50),
        by brute force over all pairs and by an order-independent sorted collapse.
        The published 1.545428738 / 1.513482010 are reproduced instead by
        Sigma_ij = the a of the LARGER-lambda row, equivalently the T-order collapse
        sum_i (1 + 2(n-1-i)) a_i^2, which differs because a_exact is non-monotone at
        exactly one step per file (C=3 a=0.678572 -> C=2 a=0.614974, the C>=1
        truncation biting at lambda=2). Because the step sits in the deep tail, every
        SUB-BAND value agrees exactly and only the whole-band figure moves.
      consequence: >-
        "1.5454 -> 1.55, exact to published digits" is convention-contingent. Under
        the formula as written the value is 1.57, which does not round to the red
        team's 1.55. I cannot determine which convention the red team used without
        their code, so I cannot say whose number is being reproduced. The
        O(1)-not-O(n) conclusion that justifies retiring the statistic is unaffected
        by either convention.
      fix: >-
        A superseding note stating both values and naming the convention actually
        used, and either renaming the field or changing the collapse. Cheap.
    - id: D-2
      severity: moderate
      title: "the power control is one-sided, and the unexcluded band contains the package's own ANOM-5 value"
      detail: >-
        MC-C tests only phi_true = 1.5. Running the downward control (this report,
        C-2), phi = 0.80 is 1.03 sd from n=43's own deep-tail reading and is not
        excluded -- and 0.80 is what the same instrument measures at -2.36 sd in
        n=43's mid band under a null object of the same shape. The report states the
        resolution honestly (+/-0.16, "[0.6, 1.4] not excluded") but never connects
        it to its own ANOM-5.
      fix: Add a downward power control and one sentence relating the unexcluded band to ANOM-5.
    - id: D-3
      severity: moderate
      title: "the per-window tables use the analytic sd that ANOM-3 declares unstable, unlabelled"
      detail: >-
        report.md section 2.2's per-window "sd" and "(phi-1)/sd" columns are the
        analytic sd (results.json per_window carries only sd_phi_analytic), while
        ANOM-3 concludes "the Monte-Carlo sd is the one to read in every region".
        The headline "no window departs by more than 1.6 sd" inherits that. In the
        primary region the analytic sd is the larger and hence the conservative
        choice (0.185 vs 0.154 MC; 0.178 vs 0.166), so the direction is safe, but if
        the per-window MC/analytic ratio matched the region's, n=50's window 0 would
        read about 1.9 sd rather than 1.57.
      fix: Label the column, or compute per-window MC sds.
    - id: D-4
      severity: moderate
      title: "'a perfect model reads 0.7701x' is model-dependent and is being carried as structural"
      detail: >-
        A = 1147x is a property of the instrument. sqrt(C) = 0.77008 is not: C is
        sum_deep r_T^2 / (n floor^2) for M2's OWN residuals. Had M2's deep-tail
        residuals sat at the counting floor, C would be 208.944/209.126 = 0.99913
        and the same perfect model would read 0.9996x. The 0.77 figure is carried
        entirely by the unexplained sub-floor deficit that S-11 is about.
        report.md section 4.3 places it correctly among model-dependent quantities;
        the snapshot receipt's second_headline lists it among quantities that
        "reproduce exactly on every structural quantity".
      fix: One-line correction in the ledger record that inherits the headline.
    - id: D-5
      severity: minor
      title: "two entries in the control table are algebraic identities, not controls"
      detail: >-
        sum_k h_kk = tr(I^-1 I) = #parameters holds at ANY beta, converged or not,
        so "SUM leverage = #parameters: 3.0000000, hat identity holds" diagnoses
        nothing. Likewise expected_count_ge_10_holds is true by construction of the
        binning rule. Both are correct; neither is evidence, and listing them beside
        genuine controls (MC-A/B/C, the trim, the binning variant) overstates the
        control count.
    - id: D-6
      severity: minor_in_producer_material_in_framing
      title: "the plug-in control is presented as bearing on the two prior attempts"
      detail: >-
        See control C-3. The producer's report is careful ("recorded to show the
        failure mode, not as a measurement"). The snapshot receipt's
        coordinator_notes_for_review and the review task card both promote it to a
        statement about what "the earlier attempts leaned on". The two S-11 attempts
        fitted a local unweighted quadratic and a global log-linear Poisson trend;
        neither is a plug-in and both returned non-zero phi. The control is also
        mislabelled: it plugs in the bin's own INCREMENT count, not C_T.
      fix: Strike the inference in whatever ledger record inherits the headline.
    - id: D-7
      severity: minor
      title: "two 'exact' agreements in the report's Job B table are not exact"
      detail: >-
        "C>=1000 white dof, n=43 | 163 | 162.47 | exact": 162.466 rounds to 162, not
        163, so this row agrees to 0.33 % and not to published digits. And "signs
        alternating" (report section 2.2, repeated in the snapshot headline) is not
        what the tables show: n=43 reads -,+,-,-,+,- and n=50 reads +,-,-,-,+,+,-.
        The intended content -- no systematic drift across windows -- is supported;
        the word is not.
    - id: D-8
      severity: informational
      title: "MC replicate discards"
      detail: >-
        The producer reports replicates_discarded_non_convergent: 0 in every region.
        On my optimiser 9 of 400 (n=43) and 4 of 400 (n=50) null replicates failed
        to converge and were dropped, which could bias my sd slightly. Recorded so
        the difference between the two MC sds (0.1580 vs 0.1542; 0.1674 vs 0.1665)
        is attributable. No action needed.
    - id: D-9
      severity: informational
      title: "large-lambda Poisson sampling in the producer's MC uses a rounded normal approximation"
      detail: >-
        dispersion_control_c1.py poisson_sample falls back to round(lambda + sqrt(lambda) Z)
        for lambda >= 30, which affects only the mid-band and shallow MC sds (per-bin
        lambda 10^2 to 10^7). The induced error in Var(r^2) is order 1/lambda, i.e. below
        0.5 % at lambda = 300, and those regions carry explicit caveats. The deep-tail
        MC, which carries the headline, samples per row at lambda < 1 by exact
        inversion and is unaffected.

  answers_to_the_numbered_review_questions:
    - question: "1. Does phi reproduce under a different windowing and a different rate estimator?"
      answer: >-
        YES. n=43 0.9494 (z = -0.28), n=50 1.1229 (z = +0.65) against my own MC nulls;
        range [0.827, 1.150] and [1.022, 1.798] over bin targets 10/15/20/30 and
        model orders 2-4; every one of my 24 equal-event windows within 1.20 sd.
        The point estimate is NOT stable to better than about 0.05-0.06 under
        equally defensible implementations of the same stated binning rule, which
        confirms ANOM-4's substance while showing its direction is file-dependent.
    - question: "2. Is the power control honest?"
      answer: >-
        YES for what it tests. phi_true = 1.5 comes back as 1.504 +/- 0.253 and
        1.531 +/- 0.241 on my independent implementation against the producer's
        1.459 +/- 0.237 and 1.521 +/- 0.247. Two qualifications: the exclusion of
        phi = 1.5 is only 1.9 sd for n=50; and the control is one-sided, with
        phi = 0.80 unexcluded for n=43 at 1.03 sd (defect D-2). The report's stated
        [0.6, 1.4] is honest and slightly conservative at the low end.
    - question: "3. Are windows genuinely at EXPECTED count >= 10, and is the leverage correction applied where claimed?"
      answer: >-
        YES to both, with a caveat. Min fitted expected count 10.026 / 10.003
        (producer), 10.038 / 10.005 (mine); the leverage correction is applied to the
        residual variance of the rate fit as Var = mu(1-h), and I re-derived the
        supporting identity sum_j S_kj^2 mu_j = h_kk mu_k independently and it is
        correct. Caveat: both the >= 10 gate and sum h = #params are true by
        construction (defect D-5). The gate is on the FITTED expectation, which is
        the standard and only available choice.
    - question: "4. Confirm or refute the plug-in control."
      answer: >-
        CONFIRMED ARITHMETICALLY, REFUTED AS EVIDENCE. phi = 0.0000000000 on my own
        evaluation, but the shipped expression is (Y - Y)^2 / Y: identically zero for
        any input, with no archived byte entering it. "Leverage exactly 1" is asserted
        and never computed, and the plugged-in quantity is the bin's own increment
        count, not C_T. It bears on neither S-11 attempt.
    - question: "5. Third derivation of the dof and the attenuation identity, and Claim C's range."
      answer: >-
        Delivered in validation_notes.md sections 5 and 6. Everything reproduces to
        6-13 digits EXCEPT the headline whole-band dof, where the stated formula
        gives 1.5734 / 1.5194 and the published value 1.5454 / 1.5135 comes from a
        different, unnamed convention (defect D-1). Claim C's range reproduces
        exactly and is understated by one convention. The retirement of the
        whole-band statistic SURVIVES this third computation: every convention puts
        the whole-band effective dof between 1.51 and 2.35 against 1803/2310 rows
        and a white-noise dof of 422/471, the attenuation is 1147x/949x, and the
        n=50 M2 whole-band ratio of 0.968x is below the counting floor.
    - question: "6. Assess ANOM-5. Is it real, and does it undercut Claim A?"
      answer: >-
        REAL, and it does not undercut Claim A but it bounds it. Null-object
        controlled on my own implementation: n=43 mid band 0.8020 against a Poisson
        null of the same shape at 0.9923 +/- 0.0806 (-2.36 sd), flat at 0.79-0.81
        while the rate model is given 6 to 33 parameters; n=50 +1.55 sd. Extra
        parameters can only inflate phi, so a 20 % variance deficit that survives 33
        of them is a variance deficit, not misfit. The bearing on Claim A is that
        the deep tail's unexcluded band CONTAINS 0.80: the same instrument that
        cannot distinguish 0.80 from 1.00 in the deep tail measures 0.80 at -2.4 sd
        300 rows shallower in the same file. Claim A should be stated with that
        bound attached.
    - question: "7. Assess ANOM-3. Is the Monte-Carlo sd the right one to read?"
      answer: >-
        YES, throughout. Confirmed and worse on my construction (analytic sd reaching
        1240.8, 4.5e7 and 7.5e12 at max leverage 1.0000). The report's own per-window
        tables do not follow that instruction (defect D-3), though in the primary
        region the analytic sd is the conservative one.
    - question: "8. Is C1 inconclusive too?"
      answer: >-
        NO. C1 is conclusive at the resolution it claims, and it is the first of the
        three attempts that is. It has a null object of the same shape, a measured
        estimator bias, a working power control, and it survives an independent
        re-derivation with a different basis, a different selection rule, a
        different binning rule and a different Monte Carlo. Three inconclusive
        attempts would have been a finding about the instrument; this is not that
        case. What remains open is not the deep-tail dispersion question but the
        two controls C1 explicitly does not touch (iteration-level exchangeability,
        band-truncation selection), the untestable C_T < 10 region, and ANOM-5.

  limitations:
    - >-
      Toy tier only: two archived files at q=241, m=40, n=43 and n=50, resolved band
      only, raw undivided score scale. Nothing here is crypto-scale evidence
      (AGENTS rule 7) and nothing here bears on ML-KEM or Kyber security in either
      direction.
    - >-
      The C_T < 10 rows -- 310 of 1803 and 341 of 2310, carrying NINE pooled
      increment events each -- remain untested and untestable from this archive at
      any binning. They are the rows the whole-band floor weights most heavily. I
      confirm the producer's count exactly and I confirm that no dispersion
      statistic exists there.
    - >-
      Claim A's resolution is +/-0.16 in phi, and the point estimate moves by
      0.05-0.06 between two defensible implementations of the same stated binning
      rule. "Consistent with Poisson" means at +/-40 %, not to a few percent.
    - >-
      The band-truncation selection effect (the band ends at the last positive
      score, so the deepest rows enter conditional on an upward fluctuation while
      the floor conditions per-row on C >= 1) is untouched by C1 and by this
      validation. S-11's second open control remains open.
    - >-
      The red team's identity constant 0.5919 and four of the six rows of its
      "16-42 percent below the deep-tail floor" table cannot be checked from
      committed bytes, because BATCH-012 archived rms summaries rather than per-row
      residual vectors. ANOM-7 states this correctly and names the fix.
    - >-
      I could not verify the ordering claim that the C1 construction was fixed before
      the prior attempts were read; there is one commit and one script. ANOM-4 (a
      pre-registered prediction recorded as wrong) is indirect support for the
      practice, not proof of the ordering.
    - >-
      Which convention the red team used for its published 1.55 / 1.51 cannot be
      determined from committed bytes, so defect D-1 identifies a mismatch between
      the producer's stated formula and its computed value without adjudicating
      whose number is correct.
    - >-
      This is one independent validation session by one resolved model. It confirms
      admissibility of a receipt; it does not promote anything, does not support an
      ECDLP or ML-KEM claim, does not demonstrate a speedup, and does not authorize
      any state transition.

  package_verdict: ADMISSIBLE_WITH_DEFECTS
  verdict: passed
  verdict_rationale: >-
    The package is a Coordinator-committed snapshot whose artifacts are hash-bound
    to its receipt, whose inputs are hash-verified, and which rebuilds
    bit-identically from the committed script (zero differing leaves outside the
    provenance block). Its headline result -- a clean, well-powered Poisson null in
    the deep tail -- reproduces under an independently constructed windowing, rate
    estimator, binning rule, model-selection rule and Monte Carlo, and its power
    control is honest and reproduces on a second implementation. Its retirement
    basis reproduces on a THIRD independent implementation on every structural
    quantity to 6-13 digits, and the attenuation identity closes to 10 digits on
    every model. Every anomaly it records is real and I reproduce each of them
    independently, including the one it deliberately leaves uninterpreted. The
    defects are D-1 (a material formula-versus-implementation mismatch in the single
    most-quoted number, which does not affect the O(1)-not-O(n) conclusion), D-2 to
    D-4 (moderate scope and labelling issues, two of which sit in the Coordinator's
    headline rather than in the producer's report), and D-5 to D-9 (minor). None is
    a fabrication, none is unrecoverable, and each has a cheap named fix. The
    receipt is admissible evidence with those defects on the record.
  verdict_scope: >-
    A passed validation means this receipt is admissible evidence. It does not
    support an ECDLP or ML-KEM claim, does not demonstrate a speedup, does not
    validate Approximation 4.9, and does not authorize promotion or any change of
    hypothesis, evidence or goal status.

