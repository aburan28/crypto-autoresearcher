    - id: M-8
      quantity: "attenuation identity structural quantities"
      status: reproduced
      validator: >-
        n=43: measurable budget 0.182288233, deep-tail budget 208.943617762 over
        951 rows, deep floor 0.468731669 bits, A = 1147.226581x, measurable share
        0.087167 %. n=50: 0.261261785, 247.604766523 over 1178 rows, 0.458465706
