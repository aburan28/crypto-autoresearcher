      flagged row moves and every valid row does not
    status: reproduced
    detail: >-
      All 24 ratio values in both tables recompute from the archived residuals to four
      decimals. BATCH-014's two-fit values and its reconstruction_valid flags were read
      back from the BATCH-014 archive and match. The rows BATCH-014 called valid land
