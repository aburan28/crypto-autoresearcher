  defects:
  - id: D-1
    severity: material
    title: The floor inequality is proved for the wrong class; the cited Cauchy-Schwarz step points the wrong way.
    where: anom5_investigation.py lines 505-518; report.md section 0; results.json mechanism M-a2; and the Coordinator's snapshot commit message and snapshot_receipt headline, which repeat it.
    finding: >-
      The chain is: Var(X_iT) >= p_i - p_i^2 (correct, X^2 >= X for non-negative integers);
      Var(D_T) >= mu_T - sum_i p_i^2 (correct, independence); then "applying Cauchy-Schwarz
      to sum p_i^2 >= (sum p_i)^2 / N, ... >= mu_T (1 - mu_T/N)". The last step needs
      sum_i p_i^2 <= mu_T^2 / N. Cauchy-Schwarz gives the OPPOSITE, sum_i p_i^2 >= mu_T^2/N,
      which turns the final inequality around: mu_T - sum_i p_i^2 <= mu_T(1 - mu_T/N).
      The conclusion "under ANY model with independent iterations E[phi] >= floor" is
      therefore false. Explicit counterexample, run through the validator's instrument:
      let floor(mu_T) iterations contribute 1 deterministically and one further iteration
      contribute Bernoulli(frac(mu_T)); the rest contribute 0. Iterations are independent
      (not identically distributed), every X_iT is a non-negative integer, E[D_T] = mu_T,
      and Var(D_T) = frac(1-frac) <= 1/4. Through the identical instrument that null
      returns phi = 0.00433 +/- 0.00039, i.e. about 2300 sd BELOW the claimed floor.
    what_survives: >-
      Everything that matters, under the correct hypothesis. If the iterations are
      independent AND IDENTICALLY DISTRIBUTED - which the file header supports ("each time
      a different lattice, target") and which the pooled-rate estimator already assumes -
      then p_i = mu_T/N for every i, the Cauchy-Schwarz step is an equality, and
      Var(D_T) >= mu_T(1 - mu_T/N) holds with equality iff each iteration contributes 0 or
      1. The number 0.9182566445 is correct, and by the {floor(p), ceil(p)} argument above
      it is exactly tight, not merely admissible. A mixture across iterations (M-a3) does
      NOT break it: each iteration's MARGINAL law is still the same mixture, so the bound
      applies unchanged.
    required_correction: >-
      Restate the theorem with the iid/exchangeability hypothesis named as a hypothesis,
      and drop the Cauchy-Schwarz sentence (it is not needed and is cited backwards).
      Do not carry the phrase "under ANY independent-iteration model" into any evidence
      record.
    changes_a_verdict: false

  - id: D-2
    severity: material
    title: M-a4 attributes the possible breach to the wrong broken assumption.
    finding: >-
      M-a4's reason says antithetic or stratified sampling across iterations "would violate
      the independence assumption used to derive the M-a2 floor". Stratified or
      proportional allocation across iterations typically preserves INDEPENDENCE and breaks
      IDENTICAL DISTRIBUTION - and by D-1 that alone is enough to drive phi far below the
      floor. The mechanism the producer named is right; the assumption it breaks is not.
      This matters because it widens the live mechanism class: the floor can be breached
      without any shared random source at all.
    changes_a_verdict: false

  - id: D-3
    severity: moderate
    title: '"Untestable from this archive" is too strong for M-a4; a calibrated negative control was available and unused.'
    finding: >-
      Any cross-iteration mechanism that scales the per-cell variance by a uniform factor c
      must show the same c wherever the Poisson null holds. Explaining the mid-band reading
      needs c = 0.80229/0.91826 = 0.8737. This task's own deep-tail readings, through its
      own instrument and against its own calibrated N1 nulls, are 1.05687 vs 0.99649 +/-
      0.05913 (n=43) and 1.02709 vs 0.99825 +/- 0.04779 (n=50) - that is +3.1 and +3.2 sd
      away from c = 0.8737, and further if the null sd is also scaled by c. Both numbers are
      already in results.json. The uniform version of M-a4 is therefore DISFAVOURED by the
      archive at about 3 sd in each file. This does not exclude an occupancy-selective
      mechanism (one acting only where mu_T/N is O(1)); nor can BATCH-014's binned
      deep-tail reading (0.8954 against a 0.98496 +/- 0.15424 null) make the test, which is
      exactly why the control must be quoted with its instrument. "Untestable" should
      become "not decidable in general; the uniform form is disfavoured at ~3 sd by the
      deep tail, the occupancy-selective form is not testable here".
    changes_a_verdict: partially - it converts one untestable row into a partially tested row.

  - id: D-4
    severity: material_to_the_headline
    title: Job B's arithmetic is right; the sentence drawn from it does not follow for four of six models.
    finding: >-
      See C-23. The M1a whole-band and count>=1000 fits share their shape parameter and
      their deep-tail residuals differ by a rigid constant 0.826803 bits, so the centred
      scatter is IDENTICAL under both fits (0.5656 x floor for n=43, 0.5187 for n=50) and
      remains below the counting floor. The same holds for M4 and SENS exactly and for M2
      to within 0.2 per cent. Only M1 and M3, whose shape parameters actually changed
      between fits, have fit-dependent scatter. "The deep tail sits below its floor is a
      property of the whole-band-fitted normalisation, not a fit-independent fact" is
      therefore not supported for M1a - the ratio moves, the deficit does not. The
      Coordinator elevated exactly this sentence into the snapshot headline as one of the
      three consequences that "cut both ways", so it needs correcting before it is carried.
      The correct and stronger qualification of BATCH-012 is the dof one, which is
      fit-independent - see the binding in C-23.
    changes_a_verdict: yes for the wording of consequence 3 in the snapshot receipt.

  - id: D-5
    severity: minor
    title: n=50 observed-count binner bin count misquoted in the report prose (475, actual 470).
    finding: See C-19. Confined to report.md section 2.4; results.json is correct; the n=43 degeneracy finding is unaffected.

  - id: D-6
    severity: minor
    title: M-c5's summary is contradicted by its own archived sweep.
    finding: See C-28. -1.635, +2.778 and +10.163 sd all appear in the sweep the sentence summarises.

  - id: D-7
    severity: minor
    title: The wrong floor is named as binding in the shallow band.
    finding: See C-29. Correct independent-iteration floor there is 1.04e-2, not the multinomial 0.9991.

  - id: D-8
    severity: minor
    title: '"roughly 1409 bins" is over-precise.'
    finding: See C-26. 1321-1488 depending on which sd is used; quote it as "about four times the available 301".

  - id: D-9
    severity: minor_scope_note
    title: The -1.43 sd residue is itself Monte-Carlo-noise-limited and is if anything slightly overstated.
    finding: >-
      The validator's 3000-replicate N2 gives -1.52. Additionally the mid-band residuals
      carry rho_1 = +0.104, which inflates the true sampling sd of a mean of squares by
      about 1.5 per cent over the independence-based sd used in both N1 and N2, so |z| is
      marginally optimistic. Neither moves the reading off "not an effect", and the report's
      own language ("no honest reading calls an effect") is appropriate.

  # ------------------------------------------------------------------
  answers_to_the_questions_the_snapshot_left_open:
    is_the_floor_derivation_correct: >-
      The NUMBER is correct and reproduces three ways. The DERIVATION as written is not:
      its generality clause is false and its Cauchy-Schwarz step is cited in the direction
      that refutes the conclusion (D-1). Restated for independent and identically
      distributed iterations, it is correct.
    is_it_the_tightest_admissible_bound: >-
      Yes - within the corrected class it is exactly the minimum, not merely a bound. The
      validator confirmed this by deriving the general minimum-variance law for a
      non-negative-integer summand, frac(p)(1-frac(p)), and checking that it coincides with
      1 - mu_T/N at every cell of the band because every occupancy is <= 0.739 <= 1. N2 is
      its exact minimiser and the fitted instrument attains it (validator N2 mean 0.9186
      against the analytic 0.9183). Outside the class no positive floor survives.
    does_the_deep_tail_null_survive: >-
      YES, decisively. Occupancy 0.0023 and 0.0011 give floors 0.99974 and 0.99986 at one
      bin per score, and 0.9969 / 0.9981 even under BATCH-014's coarser binning, against
      measurement sds of 0.05-0.15. BATCH-014's T-1 is untouched by this batch; what it
      loses is only the ANOM-5 bound EV-MLKEM-c50030 attached to it.
    the_new_n50_over_dispersion: >-
      The arithmetic is right (validator +2.31 sd against its own N2, +2.25 in the archive)
      and recording it was the correct and honest thing to do. It is NOT a new anomaly of
      the same kind, and should not be promoted to one. Three reasons. (i) The admissible
      set is [floor, infinity): over-dispersion has no upper bound to violate, so +2.25 sd
      above a floor is categorically weaker evidence than any amount below one.
      (ii) A mechanism is already in the producer's own table - M-a3, a mixture across
      iterations, which can only inflate, and the archived Pgood file shows a 14 per cent
      coefficient of variation in the per-iteration score scale, exactly the ingredient
      such a mixture needs. (iii) It is the largest of six region readings across two
      files; two-sided p = 0.024 becomes about 0.15 after that multiplicity. It is a
      genuine open item, correctly labelled, and it is not evidence of anything yet.
    does_job_B_reconstruct_BATCH_012s_flagged_rows: >-
      YES. All 48 fits, all five index sets each, recompute from the archived residuals to
      2.6e-10 bits; the counting floors reproduce exactly under an independent
      implementation; the BATCH-014 two-fit values and flags were read back and match; the
      rows flagged valid land within 0.1-1 per cent and the rows flagged false move by up
      to 0.47 in ratio. The residual archive delivers the checkability it promises and
      BATCH-014's flags were right. The INFERENCE the producer draws from it is qualified
      by D-4.
    data_estimator_or_format: >-
      FORMAT: excluded, decisively and independently reproduced.
      ESTIMATOR ARITHMETIC: excluded; three independent implementations now agree to 1e-16.
      ESTIMATOR NULL OBJECT: this is where most of ANOM-5 lives, and the finding stands.
      Calibrating a statistic pooled over 4000 iterations against the Poisson point 1 was
      wrong in a region where per-iteration occupancy reaches 0.739; the tightest
      admissible reference is 0.9183 and against it the reading is -1.4 to -1.6 sd, which
      is not an effect. DATA: an unresolved residue remains - a sub-floor gap of about
      1.5 sd and a +0.104 lag-1 residual autocorrelation - and neither is excluded, but
      neither is resolvable at 301 bins.

  verdict: passed
