  - id: C-29
    claim: >-
      report deviation 3 - in the shallow band the N2 family degenerates and "the binding
      constraint there is the multinomial floor, which is 0.9991"
    status: not_reproduced
    detail: >-
      Within the independent-iteration class the minimum-variance member for a cell with
      per-iteration mean p > 1 is the two-point law on {floor(p), ceil(p)}, giving a
      per-cell dispersion floor N frac(p)(1-frac(p))/mu. Summed over the n=43 shallow
      band that is 1.04e-2, not 0.9991. The multinomial floor belongs to a strictly
      stronger model (all M pooled candidate scores independent) and does not bind the
      class the section is discussing. No verdict depends on it - that band reads
      over-dispersed at phi = 1.046 - and reporting the degenerate -12675 openly with
      applicable: false was exactly right. See D-7.

  - id: C-30
    claim: >-
      provenance - 143.31 s wall, 0.043 GB peak RSS against a 3000 s / 4 GB budget, one
      declared run, seed 20260803, git b7bea56a with the dirty subtree limited to this
