  - id: C-28
    claim: >-
      M-c5 - "phi is stable under endpoint shifts and the gap below the
      independent-iteration floor stays inside about 1.5 sd everywhere"
    status: not_reproduced
    detail: >-
      The producer's own archived endpoint sweep contains gap_sd = -1.635 ([626,776]),
