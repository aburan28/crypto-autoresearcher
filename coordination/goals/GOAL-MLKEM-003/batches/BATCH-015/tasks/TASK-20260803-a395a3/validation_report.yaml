      checkability it promises.

  - id: C-23
    claim: >-
      "the deep tail sits below its floor" is a property of the whole-band-fitted
      normalisation for M1/M1a/M3, not a fit-independent fact
    status: reproduced_as_arithmetic_but_the_inference_is_qualified
    detail: >-
      The arithmetic reproduces exactly. The inference does not follow for four of the
      six models. For M1a both fits share the shape parameter (p = 26.0) and the
      validator finds their residuals differ by a RIGID CONSTANT of 0.826803 bits over
      every score with C_T < 1000 (constant to 1e-9). Decomposing the deep-tail rms into
      a bias (mean residual) and a centred scatter: n=43 M1a centred/floor = 0.5656 under
      BOTH fits; M4 0.6148 both; SENS 0.6148 both; M2 0.7684 vs 0.7666. Only M1
      (p = 23 vs 20) and M3 (s = 0.97 vs 0.9), where the shape parameter itself changed,
      actually move (0.8287 -> 1.4502 and 0.8748 -> 1.1405). n=50 shows the same pattern.
      So what is fit-dependent is a normalisation BIAS, not the scatter deficit.
      BINDING (DEC-20260803-52a750): the effective number of degrees of freedom of a
      whole-band ratio is O(1); no single value is quoted here and the published
      defensible range across conventions is 1.51-2.35; restricting to C >= 1000 buys NO
      degrees of freedom, that ratio's effective dof is also O(1) and lies in the same
      1.51-2.35 family. At O(1) dof neither 0.57 nor 2.39 is resolved from 1.0. The
      correct statement is that the deep-tail ratio is UNRESOLVED under both fits, which
      qualifies BATCH-012's standing claim at least as much as the producer's sentence
      does, and by a mechanism that does not depend on choosing a fit. See D-4.

  - id: C-24
    claim: the handoff's reference values 0.9923 +/- 0.0806, -2.36 sd, +1.55 sd and "6 to 33 parameters" are reconciled against the archive
    status: reproduced
    detail: >-
      The reconciliation is honest and accurate on every line. "0.9923" and "0.0806" do
      not occur anywhere in BATCH-014's results.json (validator searched the serialised
      record). The archived MC null is 0.995211358329477 +/- 0.0843102952402972 and the
      archived analytic sd is 0.0837749300035058. -2.359958 is exactly the archived
      ANALYTIC z against the Poisson point null ((0.8022947-1)/0.0837749); the archived
      MC z is -2.288175. For n=50 the archived readings are +1.616147 (analytic) and
      +1.888619 (MC); +1.55 matches neither. The archived n=43 mid-band degree sweep
      carries n_parameters 2..13; there is no 33-parameter fit. NO VERDICT IN THE PACKAGE
      DEPENDS ON THE HANDOFF'S BAD NUMBERS - every mechanism verdict is computed from the
      archived bytes, and the handoff values are carried in a comparison-only block.

  - id: C-25
    claim: the Pgood iteration-sequence probe (r1 = +0.011417, sd 0.015811, runs z = -0.2138, block-mean variance ratios 0.89-1.23)
    status: reproduced
    detail: >-
