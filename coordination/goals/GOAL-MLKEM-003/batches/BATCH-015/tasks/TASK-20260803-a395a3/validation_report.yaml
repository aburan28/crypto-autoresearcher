  control_checks:
  - name: positive control (instrument sensitivity)
    finding: >-
      PASSES. N3 injects phi_true = 1.5 and the instrument returns 1.4975 (producer) and
      1.4978 (validator, independent implementation and seed), about 4.7 sd from the N2
      null. An estimator that resolves 1.5 at four-plus sd is not blind to a 20 per cent
      deficit; the reading is a genuine measurement, not an instrument floor.
  - name: negative control / null object of the same shape (inventor-protocol section 3)
    finding: >-
      SATISFIED, and this is the batch's principal merit. The reported statistic is
      calibrated against TWO null objects of the same shape run through the IDENTICAL
      instrument (N1 independent Poisson, N2 minimum-variance independent iterations),
      not against an analytic point. The validator reran both with its own code and seed
      and reproduced both.
  - name: decay control ("what should the quantity do as the parameter meant to destroy it increases")
    finding: >-
      SATISFIED and explicitly stated. The parameter that destroys the effect is
      per-iteration occupancy mu_T/N. The report states the floor bites only where
      occupancy is O(1), and the deficit does vanish where occupancy goes to 0.0023: the
      deep tail reads phi = 1.057 against a null of 0.996. The canonical artifact tell -
      a quantity that fails to decay - is absent. The producer also gives the decay in
      the other direction (n=50, occupancy 0.227, floor 0.967).
  - name: producer's own controls, audited
    finding: >-
      The phi_leverage_le_0p5 control drops zero bins and is flagged vacuous: true rather
      than quoted as a passed control. The plug-in-lambda control is recorded as a failure
      mode, not a measurement. This is the right discipline and it is applied to the
      producer's own numbers as well as to BATCH-014's.
  - name: control that is missing
    finding: >-
      The deep-tail dispersion is available as a calibrated negative control on M-a4 and
      was not used as one. See D-3.

  proof_architecture_checks:
  - check: baseline fixture (does the claimed construction reproduce the cited baseline exactly?)
    status: passed
    detail: >-
      phi reproduces BATCH-014 to 1.1e-16 under an independent reimplementation and again
      here under a third; the 48 Job-B fits reproduce BATCH-012's archived rms exactly.
  - check: the central inequality
    status: failed_as_stated_correct_under_the_right_hypothesis
    detail: See defect D-1. This is the most important finding of this review.
  - check: tightness / is the floor THE tightest admissible bound?
    status: passed_under_the_corrected_hypothesis
    detail: >-
      Under independent AND IDENTICALLY DISTRIBUTED iterations the bound is not merely
      one bound, it is exactly the minimum. The validator derived the general
      minimum-variance law for a non-negative-integer summand with mean p - the two-point
      law on {floor(p), ceil(p)}, variance frac(p)(1 - frac(p)) - and confirmed that for
      every cell of the n=43 mid band (all occupancies <= 0.739 <= 1) it coincides with
      1 - mu_T/N to 1e-12. So no tighter floor exists inside that class, and the
      operative null N2 is exactly its minimiser. Empirically the validator's own N2 mean
      (0.9186) sits on the analytic floor (0.9183), so the fitted instrument attains it.
      Outside that class - see D-1 and D-2 - no floor above 0 survives.
  - check: quantifier fidelity
    status: failed
    detail: >-
      "under ANY model with independent iterations" is the wrong quantifier for the
      argument actually given (D-1). The class the evidence excludes is
      independent-and-identically-distributed iterations.
