  limitations:
  - Toy tier only (q=241, m=40, n in {43,50}, resolved band, raw undivided score scale). AGENTS.md rule 7 - nothing here is scale-matched to any cryptographic parameter set.
  - >-
    The validator's null objects were run at 3000 replicates with seed 77777 and its own
