    Every artifact is present, hash-matched and bound to a verified Coordinator snapshot
    whose parent is the commit the run declares. Provenance, seeds, environment, resource
    records and sampler approximations are complete and honest. Every quantitative claim in
    the package was recomputed here from an independent implementation and an independent
    seed: of 30 claims 25 reproduce outright, 3 do not (C-19, C-28, C-29 - two report-prose
    slips and one misnamed floor, none of which carries a verdict), 1 (C-23) reproduces as
    arithmetic while the inference drawn from it is qualified, and 1 (C-26) reproduces as
    computed but is over-precise. Positive, negative and decay controls are all present and pass.
    The package is admissible as a research receipt. Two of its stated CONCLUSIONS,
    however, must be corrected before they are carried into an evidence record or a
    decision: the floor theorem's quantifier (D-1, repeated in the Coordinator's own
    snapshot headline) and the Job-B sentence about fit-dependence (D-4). Neither
    correction reverses the batch's principal finding.
  what_this_report_does_not_support: >-
    A passed validation means this receipt is admissible evidence. It does not support any
    ML-KEM or Kyber security claim in either direction, does not validate or refute
    Approximation 4.9, does not demonstrate a speedup, does not authorise a hypothesis
