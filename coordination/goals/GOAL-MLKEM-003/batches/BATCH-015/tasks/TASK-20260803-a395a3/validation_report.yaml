  - id: C-26
    claim: "roughly 1409 bins would be needed to close the M-x3 gap at 3 sd"
    status: reproduced_as_computed_but_over_precise
    detail: >-
      The archived formula is 2/((mean_N2 - phi)/3)^2, i.e. sd^2 ~ 2/K. Using the
