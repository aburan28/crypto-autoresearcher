  objections:
  - id: OBJ-1
    severity: high
    title: >-
      Q3's incommensurability argument is wrong on the load-bearing figure; the
      closest prior art does report the analogous quantity
    target_artifact: >-
      coordination/goals/GOAL-MLKEM-003/batches/BATCH-007/tasks/TASK-20260802-101/adjudication_results.json
      (Q3 -> sources_searched[1].note) and .../source_adjudication.md (section Q3)
