      "Their T is a number of samples/candidates (e.g. T = 2.05n uniform
      samples), not a score threshold, so their Figure 4 log2 T axis is not
      commensurable with Carrier's Fig 4.1 T-axis" / "it transfers nothing".
    finding: >-
      True of Ducas-Pulles Figure 4, false of their Figure 3 - and Figure 3 is
      the object described by the section 5.2 passage the producer actually
      quoted. Verified this session against the identical bytes (sha256
      947f2826...): the Fig. 3 legend reads "distribution of the scores on the
      x-axis and the logarithm (base 2) of the survival function (SF) on the
      y-axis. Dashed blue line: prediction from the heuristic analysis. Red
      line: experimental distribution. 2^45 samples per curve." Fig. 5 is the
      same plot for BDD (good) targets over the same score axis, n = 40..90.
      That is structurally Carrier's Fig 4.1, at roughly 9.4 bits greater
      sampling depth (2^45 vs 4000 * 241^3 = 2^35.70).
    consequence: >-
      Q3's verdict label survives on the narrow reading (nobody reports
      Carrier's Pwrong for Carrier's polar-code score function). KN-FIND-012 and
      KN-FIND-014 survive intact. What dies is "transfers nothing" and any
      reading of Q3 as establishing that the residual measurement is novel in
      kind. The residual is an instantiation gap, not a measurement-type gap.
      Also narrows a headline number honestly - the extrapolation to
      log2(Pwrong) = -119.57 is ~74 bits below a 2^45 floor, not only ~84 bits
      below a 2^35.7 floor; the gap is real at either depth but the "~84 bits"
      figure is instrument-relative.
    cheapest_check: >-
      Zero network. pypdf extraction over the already-hashed CWI PDF
      (947f2826ce64d7a8c09493f9901ef418095b89a8660be075880f8874863eb62e),
      printing the "Fig. 3" caption, its legend block, and the "Fig. 5"
      caption. Run in this session; result quoted above.
    settling_locus: >-
      inputs/MLKEM-DUAL-SOURCES-20260802/extracts/ducas-pulles-2023-sec5.2-5.3-excerpt.txt
      lines 1-9 and 37-43 already carry the section 5.2 / 5.3 sentences; only
      the caption and legend fell outside the extraction window.

  - id: OBJ-2
    severity: high
    title: >-
      The instrument behind "none of them reports the quantity" has zero
      discriminating power, and its null-object control already fails
    target_artifact: >-
      coordination/goals/GOAL-MLKEM-003/batches/BATCH-007/tasks/TASK-20260802-101/fetch_sources.py
      (three occurrences: the Ducas-Pulles, Pouly-Shen and MATZOV blocks)
    quoted_defect: 'r["mentions_Pwrong_token"] = "Pwrong" in joined'
    finding: >-
      "Pwrong" is Carrier's own notation. The test returns False on every
      non-Carrier paper regardless of content - it measures naming conventions,
      not content. The null-object control required by docs/inventor-protocol.md
      section 3 is available and already fails: applied to Ducas-Pulles, which
      does report the quantity (OBJ-1), it returns False. Confirmed this
      session against 947f2826...: '"Pwrong" in text' -> False, '"survival
      function (SF)" in text' -> True. A matched null.
    aggravating_detail: >-
      adjudication_results.json places mentions_Pwrong_token:false immediately
      before reports_pwrong_at_operating_threshold:false in the same object for
      each source, inviting the reader to take the first as support for the
      second.
    cheapest_check: >-
      Re-run the same three cached PDFs with a content vocabulary - {"survival
      function", "score distribution", "uniform target", "BDD target", "false
      candidate", "SF"} - and report per-source hit counts alongside the token
      result. Zero network; all three objects are hashed and were served 200.

  - id: OBJ-3
    severity: high
    title: >-
      The byte-identity observation asserts, for three of four findings,
      precisely what this session could not test
    target_artifact: >-
      coordination/goals/GOAL-MLKEM-003/batches/BATCH-007/tasks/TASK-20260802-101/source_adjudication.md
      (unexpected observation 6) and adjudication_results.json
      (unexpected_observations[5])
    quoted_defect: >-
      "the HAL object the findings were derived from has not changed since it
      was vendored, so none of KN-FIND-012/013/014/016 was derived from a copy
      that has since been silently replaced."
    finding: >-
      The check covers one object, the HAL PDF. KN-FIND-012's evidence is
      experiments/EXP-MLKEM-011/vendor-lock/data/{Pwrong,Pgood}_*.out;
      KN-FIND-014's is experiments/EXP-MLKEM-013/vendor-lock/FFT_sample.py;
      KN-FIND-013 builds on KN-FIND-012's numbers. All three trace to
      kevin-carrier/CodedDualAttack, the exact object Q2 could not reach. Worse,
      experiments/EXP-MLKEM-011/specification.yaml line 22 pins the code source
      to an unpinned branch URL (tree/main/verifyModel, no commit) and
      experiments/EXP-MLKEM-011/runs/RUN-MLKEM-011-001/fig41_left_gaussian_baseline.json
      records the data path as /tmp/CodedDualAttack/... - so KN-FIND-012's
      upstream repository state is recorded nowhere, while KN-FIND-014's is
      (9c1367f85d26038244bc83c025d84c0b7006f2ee). That asymmetry is invisible in
      the package.
    secondary_finding: >-
      Within scope the check also proves less than stated. The HAL object's own
      metadata (extracts/carrier-hal-05406481-pdf-metadata.json) reads /Creator:
      HAL, /CreationDate: D:20260721165108 - HAL regenerates the cover-sheeted
      PDF. EXP-MLKEM-010 ran 2026-07-31 and the re-fetch is 2026-08-02, so the
      demonstrated stability window is two days over a HAL-generated derivative.
      What actually excludes author-side replacement is version_i:1 in the HAL
      API record, which the producer did capture; the hash comparison is
      decorative next to it.
    cheapest_check: >-
      git log --diff-filter=A -- experiments/EXP-MLKEM-011/vendor-lock/data/ to
      date the vendoring, and grep -rn "9c1367f" experiments/EXP-MLKEM-011/ to
      confirm no commit pin exists. Then re-scope observation 6 to KN-FIND-016's
      PDF source only.

  - id: OBJ-4
    severity: medium
    title: >-
      Q1 is a near-vacuous question and its verdict label names the finding
      rather than the proposition tested
    target_artifact: >-
      adjudication_results.json Q1 (verdict, verdict_scope) against
      knowledge/findings/KN-FIND-016.md lines 32-47
    finding: >-
      (a) The answer was determined before the session began. ePrint records the
      last revision as 2025-06-11
      (extracts/eprint-2022-1750-abstract-page.txt line 44); KN-FIND-016 was
      added 2026-07-31; the authors were never notified. There is no
      counterfactual in which the cell had changed, so Q1's informational yield
      over the pre-existing vendored artifact is one HTML line. (b) The defect
      confirmed is immaterial by the program's own finding: KN-FIND-016 records
      Table 5.1 matching the authors' pickle within 0.05 bits, the abstract's
      3.5/11.9/12.3 shortfalls as arithmetically supported, and the typo's only
      effect as an 8.8-bit anomaly in the program's own paper-only
      recomputation, which correcting it removes. (c) The enum
      confirmed_in_current_source reads as "KN-FIND-016 is confirmed", whereas
      KN-FIND-016's substantive claim - "143.30 is a transcription error for
      approximately 134.30" - was explicitly not adjudicated. Enum labels
      travel; verdict_scope strings do not.
    honest_other_side: >-
      Q1 does establish that the four findings target the published CRYPTO 2025
      version of record (DOI 10.1007/978-3-032-01855-7_15), not a superseded
      preprint. That raises the stakes of KN-FIND-012/014 (peer review did not
      close the coverage gap) and lowers the stakes of KN-FIND-016 (peer review
      did not catch the typo either, as expected of an immaterial appendix
      slip). That, plus the retitling discovery reconciling KN-LIT-111's
      bibliography with KN-LIT-7617, is the batch's durable output and should
      lead the headline instead of "the erratum is unfixed".
    constraint: Q1 may not raise KN-FIND-016 above confidence provisional.
    cheapest_check: >-
      Read knowledge/findings/KN-FIND-016.md lines 43-47 against
      adjudication_results.json Q1 verdict_scope; they describe different
      propositions.

  - id: OBJ-5
    severity: medium
    title: >-
      Q1's revision-identity inference is honest only for a proposition the
      package never states, and its stated residual check would misfire
    target_artifact: >-
      adjudication_results.json revision_identifiers.current_source_side and Q1
      verdict_sensitivity; extracts/carrier-hal-05406481-pdf-metadata.json;
      extracts/hal-05406481-api.json
    answer_to_handoff_question: >-
      confirmed_in_current_source is honest for "the authors' own deposit of the
      2025-06-11 build prints 143.30, and ePrint records no revision after
      2025-06-11". It is indeterminate for "the bytes ePrint serves today print
      143.30", which was never tested. The fix is to the proposition, not the
      enum; downgrading to indeterminate would discard a verified fact.
    wrong_inference_scenario: >-
      HAL v1 holds the CRYPTO 2025 camera-ready rather than ePrint revision 3.
      HAL producedDate_s is 2025-08-17 and the conference was August 2025, so
      the deposit is plausibly conference-associated; a camera-ready and an
      ePrint revision built from shared source on 2025-06-11 would carry the
      same /ModDate while differing in body after copy-editing.
    fact_that_would_have_caught_it: >-
      The per-revision listing at
      https://eprint.iacr.org/archive/versions/2022/1750, which enumerates each
      revision's timestamp and archive PDF URL. It is 403 Cloudflare-challenged;
      I re-attempted it independently this session (rt104-eprint-versions-retry)
      and confirm the 403, so this is a harness dead end, not a producer
      omission.
    countervailing_argument_the_package_underuses: >-
      The ePrint Note "This version of the paper differs only in the title"
      implies revisions 2 and 3 have identical bodies, so the HAL-vs-rev2/rev3
      ambiguity is immaterial for Table C.2, and the rev-3 title on the title
      page excludes rev1. That is stronger than the four-point chain given. But
      the Note has a second natural reading - "this ePrint version differs only
      in the title from the published version" - under which it says nothing
      about rev2 to rev3 while resolving the package's "Springer version
      unknown" item. The package commits to one reading silently; the two
      license different downstream statements about the Springer version of
      record.
    misfiring_remedy: >-
      verdict_sensitivity says "the residual is one successful GET of
      https://eprint.iacr.org/2022/1750.pdf", implying a hash comparison. The
      HAL object carries a HAL cover sheet (37 pages, paper title page is page
      2) and /Creator: HAL, /CreationDate: D:20260721165108, so byte-identity
      with any ePrint-hosted PDF is impossible by construction. Executed
      naively the stated remedy returns a mismatch that could be misread as
      contradicting Q1. The check must be content-level - extract the Table C.2
      page from ePrint bytes, read the CN/Kyber-512 cell, compare /ModDate.
    cheapest_check: >-
      The most available ePrint-hosted-bytes target is already in the package's
      own provenance: the Wayback availability API returned 200 naming snapshot
      web/20260114001146/https://eprint.iacr.org/2022/1750.pdf (2026-01-14,
      after both the last revision and the HAL deposit). One GET from any
      session where web.archive.org is permitted; a fixed immutable URL rather
      than a hope that Cloudflare does not fire. Compare content, not hashes.

  - id: OBJ-6
    severity: medium
    title: >-
      Q2 as posed cannot adjudicate the published figure even with GitHub
      access, because the paper cites a mutable branch pointer
    target_artifact: >-
      adjudication_results.json Q2 (remedy, incidental_gain) and
      inputs/MLKEM-DUAL-SOURCES-20260802/extracts/carrier-hal-05406481-fig4.1-validation-section.txt
    rule_5_audit_result: >-
      Clean. No leakage of infrastructure failure into evidence about
      KN-FIND-014. observed_head_commit_sha is set to null explicitly rather
      than omitted; verdict_scope states "neither confirmed nor contradicted"
      and cites rule 5 by name; the numpy/numpy control probe establishes the
      denial is session-wide; the raw.githubusercontent.com non-attempt is
      recorded with its reason. Q2 is the cleanest part of the package and the
      non-attempt was the right call.
    finding: >-
      The paper's footnote cites
      https://github.com/kevin-carrier/CodedDualAttack/tree/main/verifyModel - a
      branch pointer, not a commit. "Does the asymmetry persist at current HEAD"
      is therefore not the question bearing on the published Figure 4.1; HEAD in
      2026-08 is not the object CRYPTO 2025 cited. The Q2 remedy asks only for
      commits/main -> sha plus a diff against 9c1367f, which cannot answer what
      state backed the published figure. Separately, incidental_gain's claim
      that the footnote "confirms that this code is the code the paper itself
      offers as the experimental backing" identifies a directory-as-of-
      unspecified-time with 9c1367f - an inference of the same species as Q1's,
      and unlike Q1's it is not labelled as one. The path itself does line up
      (EXP-MLKEM-013/specification.yaml names
      verifyModel/ScoreExperimentalDistribution/FFT_sample.py, inside the cited
      directory), so this is a labelling defect, not a mis-attribution.
    cheapest_check: >-
      Once access exists, one call - GET
      /repos/kevin-carrier/CodedDualAttack/commits?path=verifyModel/ScoreExperimentalDistribution/FFT_sample.py&until=2025-06-12
      - returns the commit that backed the published figure. Run it before the
      HEAD diff and pin it.

  - id: OBJ-7
    severity: medium
    title: >-
      The corpus sweep never followed an edge out of a retrieved abstract, and a
      published correction to previous Kyber estimates sits unexamined in a
      committed extract
    target_artifact: >-
      inputs/MLKEM-DUAL-SOURCES-20260802/extracts/eprint-2026-1326-abstract.txt
      against adjudication_results.json Q3 sweep
    quoted_locus: >-
      "We also correct a parameter issue in previous Kyber estimates. With this
      correction, LaMS reduces the estimated attack cost by 22/31/41 bits for
      Kyber-512/768/1024, respectively, relative to the corrected CRT-based
      attack of Qu and Xu."
    finding: >-
      The sweep had two seeds: one ePrint full-text search ("coded dual attack")
      and Semantic Scholar citation edges of the Carrier DOI. It never followed
      an edge out of a retrieved abstract, and never searched for the quantity
      under any name (OBJ-2). A published correction to previous Kyber
      dual-attack estimates is the same species of object as KN-FIND-016, and a
      22/31/41-bit re-costing the same species as KN-FIND-013's Delta
      sensitivity. Neither appears in the Q3 discussion, and Qu-Xu (ASIACRYPT
      2025), named in a retrieved document, never entered the retrieval set.
    cheapest_check: >-
      Four requests, all in the permitted HTML class, no PDFs - three ePrint
      searches ("score distribution dual attack", "survival function LWE dual",
      "false candidates FFT distinguisher") plus one landing-page GET for the
      Qu-Xu paper.

  - id: OBJ-8
    severity: medium
    title: >-
      A re-asserted quantity is an estimator resolution artifact and is not
      flagged as one
    target_artifact: >-
      source_adjudication.md section Q3 ("the measured Pwrong support in the
      current text ends at T of roughly 1600-1800") and
      knowledge/findings/KN-FIND-012.md (last T with Pwrong>0 = 1802,
      log2(Pwrong) ~ -35.70)
    finding: >-
      Carrier's estimator is |{z in Z_q^{k_fft} : F(z) >= T}| / q^{k_fft} over
      4000 iterations at q = 241, k_fft = 3, so its smallest attainable non-zero
      value is 1/(4000 * 241^3) and log2(4000 * 241^3) = 35.70 - matching the
      recorded floor to two decimals. The "floor" is the estimator's resolution
      limit, not a property of the distribution.
    what_the_quantity_should_have_done: >-
      The parameter that is supposed to destroy this quantity is the iteration
      count: T_last-positive should march outward as -log2(iters * q^{k_fft})
      deepens. A number fixed by the sample budget carries no information about
      the soundness of Approximation 4.9 - it reports how long the authors ran
      the script. docs/inventor-protocol.md section 3 artifact tell.
    what_survives: >-
      KN-FIND-012's real content is untouched: the gap between the measured
      Pwrong support and the Pgood operating threshold, fraction_inside = 0, and
      the extrapolation distance to log2(Pwrong) = -119.57 all stand. What must
      stop is citing 1802 or -35.70 as evidence about the paper.
    cheapest_check: >-
      One line, no network, no new data: recompute -log2(4000 * 241^3) and
      compare to -35.70.
    constructive_follow_on: >-
      The same closed form inverts, giving the iteration count a Fig-4.1-style
      simulation would need to reach the aligned Pgood threshold and to reach
      -119.57. That converts the KN-OPEN-016 residual from "unmeasured" to
      "costed" at zero compute, which is a stronger deliverable than either.

  - id: OBJ-9
    severity: medium
    title: >-
      Partial access does not license partial novelty claims, and the package
      carries no dominated_by / sota_delta
    target_artifact: >-
      PUBLICATION-CANDIDATES.md lines 7-12 against adjudication_results.json
      (whole file) and docs/inventor-protocol.md section 5
    finding: >-
      Under partial access the no-novelty-adjudication rule does not weaken; it
      sharpens by class. A novelty claim is licensable only where the
      retrievable class is the class in which the prior art would live. Here the
      retrievable class is HTML abstracts and non-ePrint mirrors; the class
      where a re-measurement of a score survival function lives is full-text
      PDFs, and every ePrint PDF path is 403. Four full texts on the direct
      follow-up line (Guo-Johansson 2021/948, 2026/1400, 2026/1326, 2026/599)
      are unread, and the producer itself names 2026/1400 as the likeliest home
      for such a measurement. So novelty for the KN-OPEN-016 residual remains
      not adjudicable - and the one class that was retrievable already contains
      adverse prior art (OBJ-1). Partial access moved the answer toward less
      novel, not toward novel; any document reading this batch as strengthening
      a publication posture has the sign backwards.
    pareto_defect: >-
      adjudication_results.json carries no dominated_by and no sota_delta.
      Inventor-protocol section 5 makes an unchecked null a fabrication under
      AGENTS rule 5; an absent field plus a prose dismissal of the single
      candidate frontier row is the same defect in a different shape.
    required_fields_if_used_downstream:
      dominated_by: >-
        Ducas-Pulles CRYPTO 2023 sections 5.2/5.3 (Fig. 3 uniform-target score
        survival function, Fig. 5 BDD-target scores, 2^45 samples, n = 40..90) -
        for the measurement type
      sota_delta: >-
        no new measurement; the polar-code score-function instantiation is
        undone, and Carrier's own Fig 4.1 coverage gap is the finding
    cheapest_check: >-
      grep -n "dominated_by\|sota_delta"
      coordination/goals/GOAL-MLKEM-003/batches/BATCH-007/tasks/TASK-20260802-101/adjudication_results.json
      -> absent.

  - id: OBJ-10
    severity: low
    title: The abstract-tension observation is over-read in two ways
    target_artifact: >-
      source_adjudication.md unexpected observation 5 against
      extracts/eprint-2022-1750-abstract-page.txt line 13 and fetch_sources.py
      (extraction block)
    finding: >-
      (i) Partial quotation of the referent: the same abstract also says "we
      confirm their strong distortion properties through benchmarks", a second
      experimental component, so "fully back up our analysis" covers more than
      Pwrong and contrasting it with Pwrong coverage alone overstates the
      tension. (ii) fetch_sources.py extracts exactly three regions of the
      37-page PDF - the title page, the page matching "Table C.2" and "143.30",
      and the block after "Validating our Analysis Through Simulations" - so
      "the only experimental validation of Pwrong in the paper" is a universal
      claim over a document read in three slices. Relatedly, "Figure 4.1 plots
      Pwrong only; no Pgood curve appears on it" is inferred from text
      extraction, which cannot see curves.
    narrowest_valid_replacement: >-
      The paper's own Pwrong validation spans T in [200, 1600] at n = 43/50,
      k_fft = 3, while Table C.2 applies the approximation at log2(Pwrong) =
      -119.57. That is KN-FIND-012, already established.
    cheapest_check: >-
      Extract all 37 pages of experiments/EXP-MLKEM-010/vendor-lock/Carrier-2022-1750-hal-05406481.pdf
      and grep "experiment|simulation|benchmark|Figure"; render the Fig 4.1 page
      to an image to confirm the absent Pgood curve. Both zero-network.

  required_controls:
  - id: CTRL-RT-1
    name: notation-null control for the corpus search
    statement: >-
      Re-run the Q3 corpus search with a content vocabulary rather than the
      token "Pwrong", and report the token result beside it. The control is
      already known to fail: the token instrument returns False on a document
      that does report the quantity. Until re-run, every
      mentions_Pwrong_token:false field is a controlled null and may not support
      any conclusion.
    blocks: OBJ-2
  - id: CTRL-RT-2
    name: estimator-resolution control
    statement: >-
      Before citing any "last positive T" or empirical Pwrong floor, compute
      -log2(iters * q^{k_fft}) for the same parameters and confirm whether the
      reported floor is the estimator's resolution limit. For the Fig 4.1
      left panel it is, to two decimals.
    blocks: OBJ-8
  - id: CTRL-RT-3
    name: content-level rather than hash-level revision comparison
    statement: >-
      Any future ePrint-bytes check must compare the Table C.2 cell and /ModDate,
      never sha256, because the HAL object carries a HAL cover sheet and a HAL
      re-stamp and cannot be byte-identical to an ePrint-hosted PDF.
    blocks: OBJ-5
  - id: CTRL-RT-4
    name: provenance-scope control
    statement: >-
      Any statement of the form "artifact X has not been silently replaced" must
      enumerate the artifacts actually hashed against a live source, and must
      exclude every artifact whose upstream host was unreachable in the same
      session.
    blocks: OBJ-3

  counterexample_or_mutation: >-
    Ducas-Pulles CRYPTO 2023, Fig. 3 (uniform-target score survival function
    against heuristic prediction, score on the x-axis, log2 SF on the y-axis,
    2^45 samples per curve, n = 40..90) together with Fig. 5 (BDD-target scores,
    same axis). This is the direct counterexample to "no retrieved source
    reports the quantity" read as a statement about measurement type, and to
    "their T is a sample count, not a score threshold". Retrieved from the same
    bytes the package used, sha256
    947f2826ce64d7a8c09493f9901ef418095b89a8660be075880f8874863eb62e.

  baseline_comparison:
    applicability: >-
      Pollard-rho, BSGS and specialized ECDLP baselines are non-applicable: this
      package makes no algorithmic claim. Recorded as non-applicable rather than
      omitted, per the inventor-protocol audit rule.
    relevant_frontier_row: >-
      Ducas-Pulles CRYPTO 2023 sections 5.2/5.3 is the correct baseline for the
      *measurement* the KN-OPEN-016 residual proposes: same plot type, adjacent
      attack, 2^45 samples versus Carrier's effective 2^35.70, wrong-target and
      good-target distributions both plotted on the score axis.
    delta: >-
      Neither depth reaches the applied regime. Kyber-scale log2(Pwrong) =
      -119.57 sits ~74 bits below a 2^45 floor and ~84 bits below a 2^35.70
      floor. The extrapolation gap is the finding; the specific bit count is
      instrument-relative and must be stated with its instrument.

  heuristic_challenges:
  - >-
    The package does not adjudicate Approximation 4.9 and correctly says so. The
    challenge is to the program's own instrument, not the paper's heuristic: the
    empirical Pwrong floor that KN-FIND-012 reports and Q3 re-asserts from the
    primary source is a sampling-resolution artifact (OBJ-8), so it is not
    evidence about the heuristic in either direction.
  - >-
    The heuristic-validation gap the package points at is real but is now known
    to be a gap in *this* paper rather than in the technique's literature:
    Ducas-Pulles validated the analogous approximation for the adjacent attack
    at greater depth and found an adverse deviation (heavier-than-predicted
    tail). That direction of effect is prior art and should be cited as such
    rather than recorded as a reason the residual is worth measuring.

  cost_model_challenges:
  - >-
    No cost model is claimed by this package and none is challenged. The one
    cost statement worth adding is the inverse of OBJ-8: the sample budget
    required for a Fig-4.1-style simulation to reach the aligned Pgood threshold,
    and to reach log2(Pwrong) = -119.57, is a closed-form consequence of
    -log2(iters * q^{k_fft}) and costs nothing to state. Its absence is why the
    residual reads as "unmeasured" rather than "costed and infeasible".

  reduction_and_scope_challenges:
  - >-
    Scope inflation check on the verdict enum: confirmed_in_current_source is
    applied to a proposition (premise stability) while naming a finding
    (KN-FIND-016) whose substantive claim was explicitly not adjudicated. Fix
    the proposition, not the enum (OBJ-4, OBJ-5).
  - >-
    Scope inflation check on unexpected observation 6: four finding IDs are
    covered by a check that reaches one of them (OBJ-3).
  - >-
    No scheme-scope inflation found. The package asserts no ML-KEM break, no
    crypto-scale claim, and no promotion or closure, in both the markdown and
    the JSON. That discipline is intact and is worth recording as such.

  proof_architecture_challenges:
  - >-
    Observation-fiber attack on the Q1 identity inference: hold the observable
    fixed (/ModDate = 2025-06-11, current title on the title page, HAL filename
    2022-1750.pdf) and vary the underlying object between "ePrint revision 3"
    and "CRYPTO 2025 camera-ready built from the same source". No retrieved fact
    separates them; the separator that would (the per-revision listing) is 403,
    confirmed independently this session. The package's own defence - the ePrint
    Note implying rev2 and rev3 have identical bodies - is stronger than the
    chain it gives, but rests on one of two available readings of the Note
    (OBJ-5).
  - >-
    Quantifier-order attack on Q3: the claim as written slides between "for all
    retrieved sources, none reports Carrier's Pwrong at the aligned threshold"
    (true, narrow) and "for all sources, none reports this kind of measurement"
    (false, OBJ-1) and "therefore the measurement is novel" (unlicensed, OBJ-9).
    The three must be separated explicitly.
  - >-
    Method-ceiling attack on the batch as a whole: the maximum claim this
    retrieval method can support is bounded by its access classes. With ePrint
    PDFs and GitHub both denied, no amount of further effort in this harness can
    reach an ePrint-hosted byte or any repository state. The ceiling therefore
    does not reach "the four findings are confirmed against the authoritative
    text", and no re-run under the same access will change that.

  closure_audit:
    premature_closure_found: false
    premature_closure_note: >-
      The package actively resists it. Unexpected observation 4 cites 2026/1400,
      2026/1326 and 2026/599 and refuses to treat the direction as mined out;
      Q2's remedy names a concrete unblock (add_repo). Endorsed.
    illegitimate_closure_asserted: false
    downstream_closure_risk: >-
      If the batch headline is consumed as "the four findings are confirmed
      against the authoritative current text", that is a closure of the
      source-verification lane and it fails the section 4 standard: three of the
      four findings' upstream objects were never reached, and one of those three
      has no commit pin at all (OBJ-3).
    closure_the_batch_has_earned:
      named_obstruction: >-
        Every eprint.iacr.org PDF path in this harness returns HTTP 403 with
        cf-mitigated: challenge, and the block is path-class wide - demonstrated
        by the 2023/302.pdf control and extending to the HTML
        /archive/versions/ path, which I re-attempted independently this session
        and which also returns 403. web.archive.org is separately blocked by
        egress policy, removing the standard fallback.
      argument: >-
        Therefore no ePrint-hosted byte is obtainable in this harness, and no
        ePrint-hosted-bytes question can be answered here by any amount of
        further effort under the same access.
      forward_guidance: >-
        Route PDF needs through HAL, institutional repositories and Zenodo (all
        200 here); route the code lane through add_repo; and for the one
        question that genuinely needs ePrint bytes, the fixed immutable target
        is the Wayback snapshot the availability API already named
        (web/20260114001146/https://eprint.iacr.org/2022/1750.pdf).
      what_remains_open: >-
        Whether ePrint's own bytes print 143.30; whether the Springer version of
        record prints it; the entire CodedDualAttack code lane at every commit;
        and the four unread full texts on the follow-up line.
    fatigue_report_warning: >-
      "Two of three questions came back unconfident" is not a closure. It is a
      report about this session's network and must be phrased in those terms
      wherever it is summarised.

  cheapest_falsification_of_batch_headline: >-
    One zero-network pypdf extraction of the "Fig. 3" caption, its legend block,
    and the "Fig. 5" caption from the already-retrieved, already-hashed CWI copy
    of Ducas-Pulles (sha256
    947f2826ce64d7a8c09493f9901ef418095b89a8660be075880f8874863eb62e). No
    network, no new source, no new permission; the bytes are already in the
    package's provenance and were re-fetched this session to confirm the hash.
    That one command converts "no retrieved source reports the quantity;
    Ducas-Pulles' T is a sample count, not a score threshold, so it transfers
    nothing" into "a retrieved source plots the wrong-target score survival
    function against its heuristic prediction on a score axis at 2^45 samples -
    roughly 9.4 bits deeper than Carrier's 2^35.70 - and plots the good-target
    distribution on the same axis in the adjacent figure; the residual is an
    instantiation gap for the polar-code score function, not a measurement-type
    gap."

