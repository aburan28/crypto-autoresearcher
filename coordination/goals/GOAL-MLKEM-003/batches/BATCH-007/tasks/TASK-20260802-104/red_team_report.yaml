      None applicable: DEC-20260802-002 authorizes no cost model and the batch
      builds none. Recorded as non-applicable rather than omitted. The one
      cost-adjacent statement in scope - KN-FIND-013's HEUR-S1 crossover deltas of
      9.5/14.4/14.8 bits - is not touched by this batch and is not re-adjudicated
      here.
    - >-
      Budget bookkeeping objection rather than an attack cost model: the producer
      spent 1260 s of 3000 s and left the batch's only falsifier unretrieved. Total
      expected cost of a negative-existence verdict is per-source retrieval cost
      times the number of sources that could refute it; the batch charged itself
      for two of them.

  reduction_and_scope_challenges:
    - >-
      Scope inflation check on Q3: the question's subject ("Pwrong at the aligned
      Pgood operating threshold") silently ranges over two different objects -
      the Dual-Sieve-FFT score of MAT22 and Carrier's polar-coded score - and the
      answer differs between them. The verdict is stated over the union and
      supported only over the intersection with the retrieved set.
    - >-
      Scope check on Q2: the confirmed asymmetry is in
      verifyModel/ScoreExperimentalDistribution/. No retrieved artifact establishes
      that this directory's convention produced Table 5.1 or Table C.2, so the
      finding must not be reduced to a statement about the paper's published
      analysis.
    - >-
      Affected-vs-safe scope: no scheme scope statement is made or implied by this
      batch, and none may be inferred. ML-KEM/FIPS 203 parameter sets are neither
      affected nor cleared by anything in this package.

  proof_architecture_challenges:
    - >-
      Observation-collision (section 8 audit 2): the observable
      `confirmed_in_current_source` collides across two ground-truth states -
      "a freshly retrieved authoritative source agrees" and "the source is the
      identical object already held". Q1 and Q2 sit on the second; the enum
      provides no separator. This is a direct identifiability failure of the
      verdict vocabulary, not of the underlying facts.
    - >-
      Quantifier order (audit 3): Q3 is written as "there does not exist a source
      reporting X" but supported as "for all sources s in the set I retrieved, s
      does not report X", where the retrieval set was chosen after the question and
      not for falsification coverage. The witness set depends on the search, which
      the stated universal conclusion forbids.
    - >-
      Nearby-object control (audit 4): the closest object for which the desired
      conclusion is false is the Dual-Sieve-FFT score of MAT22 as measured by
      Ducas-Pulles. The batch's method - retrieve a small source set and report an
      absence - cannot distinguish it from the Carrier polar-coded score, which
      identifies the missing problem-specific ingredient: a statement of which
      score function the question ranges over.

  narrowest_supported_statement: >-
    Against the vendored Carrier full text (HAL hal-05406481 v1, sha256
    083b1422...757b8005, independently re-fetched 2026-08-02 and byte-identical),
    Table C.2's CN/Kyber-512 log2(Tsample) cell reads 143.30; that value is
    contradicted by Theorem 4.1 applied to the same row together with Table 5.1's
    134.5, which forces about 134.30, and no retrievable source shows an authors'
    correction. The identification of this text with ePrint 2022/1750 revision 3
    rests on metadata, not bytes, and is indeterminate at the byte level.
    kevin-carrier/CodedDualAttack HEAD equals the pinned commit 9c1367f, so
    KN-FIND-014's quoted code facts hold there and nothing about them can have
    changed; their interpretation was not re-derived. Carrier's three archived
    Pwrong files each terminate exactly at their counting-resolution floor, so the
    reported non-coverage of the aligned Pgood ~ 1/2 threshold is a sample-budget
    boundary; for the non-polar Dual-Sieve-FFT score, Ducas-Pulles do report
    measured Pwrong at the measured Pgood = 1/2 threshold at n = 40..90. Nothing
    here is a claim about the security of ML-KEM.

  cheapest_falsification_of_batch_headline: >-
    `python3 -c "import math; print(-math.log2(4000*241**3))"` -> -35.70450...,
    compared against the -35.7045 the batch reports as reproducing EV-MLKEM-011.
    Zero network, one line, bytes already in the repository
    (extracts/codeddualattack/Pwrong_q241_m40_n43_nfft8_kfft3_nlat35_beta032_beta144_N25971.out.header.txt
    supplies nb_iteration = 4000, q = 241, k_fft = 3). Equality shows the Pwrong
    support endpoint the batch endorses - and therefore the fraction_inside = 0 and
    aligned-T-gap statistics resting on it - is the experiment's counting-resolution
    limit rather than a property of the score distribution, which falsifies the
    reading that BATCH-007's three confirmations leave the standing findings and
    their residual undisturbed. The cheapest network falsification, targeting Q3's
    verdict specifically, is objection 1's two-CSV check (about 103 KB, seconds).

