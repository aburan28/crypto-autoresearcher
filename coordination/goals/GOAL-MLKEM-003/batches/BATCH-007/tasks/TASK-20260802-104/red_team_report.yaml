  required_controls:
    - >-
      Null-object / matched-budget control for the coverage gap: re-run or
      re-analyse Carrier's Pwrong measurement at a sample budget chosen so the
      resolution floor lies below the aligned Pgood minimum (score 2222.56), or,
      if that is infeasible, state the required nb_iteration explicitly and record
      "fraction_inside = 0" as budget-limited. Absent this, the gap statistic is
      an uncontrolled measurement (docs/inventor-protocol.md section 3).
    - >-
      Re-derivation control for the k_fft alignment: re-run the EV-MLKEM-013
      synthetic identity (raw cosine sum == fftn(.).real with factor exactly
      k_fft) before any record leans on the aligned 420.56 gap. It is currently a
      single un-replicated run and it sets the Q3 comparison.
    - >-
      Falsifier-parity control for negative-existence verdicts: before recording
      any "no source reports X", apply at least the retrieval routes already used
      for the confirming sources (OpenAlex OA-location enumeration, institutional
      repository, authors' data repository) to the source most likely to contain X.
    - >-
      Byte-level control for revision identity: a `confirmed_in_current_source`
      verdict about a specific hosted revision requires either the hosted bytes or
      an explicit downgrade to `indeterminate`. A metadata chain plus a re-fetch of
      the side you already hold is not the control.

  counterexample_or_mutation: >-
    Direct counterexample to Q3's answer: Ducas-Pulles, ePrint 2023/302
    (https://ir.cwi.nl/pub/33407/33407.pdf, sha256 947f2826..., 1021750 bytes) with
    its published auxiliary data
    (github.com/ludopulles/DoesDualSieveWork @ f390d77b21d40d711add90791fbe86d2c695ce35),
    which measures log2(Pwrong) at the measured Pgood = 1/2 threshold at n =
    40,50,60,70,80,90 as -7.301, -10.135, -14.655, -21.712, -33.151 and -46.415
    respectively, on a common score scale (same N in both files at each n), with the
    uniform-score support extending 1.11x to 4.10x past the threshold. Mutation that
    isolates objection 2: vary nb_iteration in the Carrier Pwrong measurement and
    observe that the reported "last T with Pwrong > 0" moves with it - the statistic
    tracks the sample budget, which is what a genuine distributional feature would
    not do.

  baseline_comparison:
    applicable: partial
    note: >-
      This is a source-adjudication package, not an algorithmic claim, so
      Pollard-rho / BSGS / specialized-baseline comparison does not apply and is
      recorded as non-applicable rather than silently omitted. The comparison that
      does apply is the measurement baseline: the closest existing measurement of
      the quantity KN-OPEN-016's residual names is Ducas-Pulles sections 5.2-5.3,
      which reaches survival probabilities of 2^-44 to 2^-48 by FFT-bucketed
      enumeration over uniform targets, roughly 8 to 12 bits deeper than Carrier's
      archived 2^-35.70, and covers the good-target median at every dimension
      tested. The batch neither cites nor compares against it.
    dominated_by: >-
      For the specific question "has measured Pwrong at the Pgood=1/2 threshold
      been reported for a dual-sieve-FFT score?", the batch's Q3 negative is
      dominated by Ducas-Pulles sections 5.2-5.3 and its published CSVs, on every
      axis that matters here (depth of tail measured, dimensions covered, and
      whether both distributions share a score scale). For the narrower question
      "has it been reported for Carrier's polar-coded score at Carrier's Fig 4.1
      parameters?", I found no dominating source: I checked the Carrier full text
      (R4-R6), the Carrier code archive as vendored, Ducas-Pulles (R11), the
      OpenAlex OA-location enumerations for Ducas-Pulles (R7) and Guo-Johansson
      (R8), and the Lund repository record (R10). Guo-Johansson remains unretrieved
      for me as for the producer, so that row of the frontier is unchecked and this
      field is not asserted as complete.
    sota_delta: >-
      Ducas-Pulles measured log2(Pwrong) at the Pgood=1/2 threshold: -7.301 (n=40)
      to -46.415 (n=90), with a 9.1-bit excess over the model prediction at n=90.
      Carrier archived measurement: support terminates at -35.7045 = -log2(4000 *
      241^3), which is 420.56 score units below the aligned Pgood minimum of
      2222.56 and about 2186 below the aligned median 3988.16. The batch's claimed
      delta over the standing records is zero by construction for Q2 (head == pin)
      and zero at the byte level for Q1 (the adjudicated text is Side A).

  heuristic_challenges:
    - >-
      Approximation 4.9 (Carrier's model for Pwrong) is validated in the paper by
      Figure 4.1 over a printed T-axis spanning 200..1600, while the operating
      threshold set by Approximation 4.8 (Pgood ~ 1/2) lies at aligned score
      2222.56 or above. The heuristic is therefore validated only strictly below
      the regime in which it is used, and the archived data cannot extend the
      validation because its support ends at the counting-resolution floor. Under
      docs/target-result-profile.md this is the "scale honesty" objection: the
      validation regime and the use regime do not overlap. This is a challenge to
      Carrier's heuristic, recorded here so the batch does not mistake objection 2
      for a defence of Approximation 4.9 - it is not; it is a statement that the
      program's evidence about it is confounded.
    - >-
      The k_fft alignment convention is itself a heuristic step in the program's
      own analysis, taken as frozen from EV-MLKEM-013 and not re-derived in this
      batch. Every Q3 number depends on it.

  cost_model_challenges:
