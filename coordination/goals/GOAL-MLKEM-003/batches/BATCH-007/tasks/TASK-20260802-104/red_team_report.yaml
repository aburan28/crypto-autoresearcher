  objections:
    - id: 1
      severity: blocking
      target: Q3 verdict and answer
      title: >-
        Q3's negative-existence answer is false; the falsifying source was three
        cheap hops away and was never attempted.
      statement: >-
        `adjudication_results.json` questions[2].answer states "No. No retrieved
        source reports a MEASURED Pwrong at or near the aligned Pgood ~ 1/2
        operating threshold." The producer names Ducas-Pulles (ePrint 2023/302)
        as the source most likely to contain exactly that, and records it
        unretrieved after two attempts, both against eprint.iacr.org. I retrieved
        it via OpenAlex (R7) -> CWI repository landing (R9) -> PDF (R11) in about
        eleven seconds, and then fetched the authors' published auxiliary data
        (R12-R14). In `data/bdd_scores_nX.csv` the measured CDF of the BDD
        (correct) target's score first reaches 0.5 at exactly the operating
        threshold T that Carrier defines ("we select T ... ensuring that Pgood
        ~ 1/2"). In `data/unif_scores_nX.csv` the column `log2_sf_real` is the
        measured log2 survival function of the uniform (wrong) target's score,
        i.e. measured log2(Pwrong). Both files at each n carry the same N in
        their metadata rows, so the two are on a common score scale with no
        k_fft-style rescaling required. Measured log2(Pwrong) at the measured
        Pgood=1/2 threshold - n=40..90 respectively - is -7.301 (pred -7.403),
        -10.135 (-10.252), -14.655 (-14.729), -21.712 (-21.789), -33.151
        (-33.235), and -46.415 (-55.530), with the measured uniform support
        extending past the threshold by factors 4.10, 3.71, 2.35, 1.94, 1.46 and
        1.11. At n=90 the measured value exceeds the model by 9.1 bits in the
        threshold region - the waterfall-floor, landing where it matters and in
        the direction that increases Pwrong. The producer's scope fence ("over
        the sources actually retrieved in this task") does not make the verdict
        true; it makes it unfalsifiable, which under docs/inventor-protocol.md
        section 4 is a fatigue report about the search whose honest status is
        `unverified`.
      steelman_and_narrowing: >-
        Ducas-Pulles measure the MATZOV/Dual-Sieve-FFT score of [LW21,GJ21,MAT22]
        as reconstructed in their section 2.3, not Carrier's polar-coded score
        under Approximation 4.9, and at n=40..90, which is toy scale against
        Kyber's beta ~ 384-816 (AGENTS rule 7). So this does not settle whether
        Carrier's Pwrong has been measured at Carrier's threshold. The defect is
        that Q3 never says which of the two questions it asks, and the two have
        different answers. The batch must carry the narrowed question explicitly
        and record the Ducas-Pulles data as counter-evidence.
      cheapest_check: >-
        curl -sL the two files
        https://raw.githubusercontent.com/ludopulles/DoesDualSieveWork/main/data/bdd_scores_n90.csv
        (23345 B, sha256 8f16c416...) and .../unif_scores_n90.csv (80027 B,
        sha256 9e5685a3...); take the first `score` whose `cdf_real >= 0.5`
        (3521.49) and read `log2_sf_real` at the first uniform `score >=` it
        (3655.21 -> -46.415).
      checkable_locus:
        - 'https://ir.cwi.nl/pub/33407/33407.pdf sha256 947f2826... sections 5.1, 5.2, 5.3, Fig 3, Fig 4, Table 1, section 6.3'
        - 'https://raw.githubusercontent.com/ludopulles/DoesDualSieveWork/main/data/{unif,bdd}_scores_n{40..90}.csv'
        - 'coordination/.../TASK-20260802-101/adjudication_results.json questions[2].answer and .scope_limits'
        - 'inputs/MLKEM-DUAL-SOURCES-20260802/provenance.json attempts[13], attempts[14]'
        - 'knowledge/literature/KN-LIT-111.md ("confirm these contradictions with experiments"; citation_verified: read = abstract only)'

    - id: 2
      severity: blocking
      target: >-
        source_adjudication.md "Reproduction check"; EV-MLKEM-011 and EV-MLKEM-013
        statistics the batch endorses
      title: >-
        The reproduced Pwrong floor is exactly the experiment's counting
        resolution limit, so "fraction_inside = 0" is confounded with the sample
        budget.
      statement: >-
        The batch reports last T with Pwrong > 0 = 1802 and log2(Pwrong) there =
        -35.7045, as reproducing EV-MLKEM-011 from freshly cloned bytes. The
        archived header gives q=241, k_fft=3, nb_iteration=4000, and states line i
        is P(F >= i) for a uniform target; the FFT scores all q^k_fft candidates
        per iteration, so the run scores nb_iteration * q^k_fft = 4000 * 241^3 =
        55,990,084,000 = 2^35.7045 candidates, whose smallest representable
        non-zero empirical probability is 2^-35.7045. The recorded floor equals
        that to four decimals, and all three archived Pwrong files do the same:
        nb_iteration 4000 -> floor -35.7045 vs recorded -35.7045 (delta 0.0000);
        nb_iteration 1 -> -23.7387 vs recorded -23.74 (0.0013); nb_iteration 6000
        -> -36.2894 vs recorded -36.29 (0.0006). The support endpoint is therefore
        set by run length, not by the score distribution. This is the
        docs/inventor-protocol.md section 3 artifact tell: the parameter that is
        supposed to destroy the coverage gap is nb_iteration, it was never varied,
        and the identical measurement was never run against a matched-budget
        control. It does not show the gap is spurious; it shows the gap is
        confounded and that KN-FIND-012's and KN-FIND-014's headline statistics
        are stated in a form that invites reading a run-length boundary as a
        property of the analysis.
      cheapest_check: >-
        python3 -c "import math; print(-math.log2(4000*241**3))" -> -35.70450...,
        against the -35.7045 the batch reports. Zero network; bytes already in the
        repository.
      checkable_locus:
        - 'inputs/MLKEM-DUAL-SOURCES-20260802/extracts/codeddualattack/Pwrong_q241_m40_n43_nfft8_kfft3_nlat35_beta032_beta144_N25971.out.header.txt (nb_iteration=4000, q=241, k_fft=3)'
        - 'the other two Pwrong *.out.header.txt files in the same directory (nb_iteration 1 and 6000)'
        - 'coordination/.../TASK-20260802-101/adjudication_results.json reproduction_check'
        - 'ledger/evidence/EV-MLKEM-011.yaml, ledger/evidence/EV-MLKEM-013.yaml'

    - id: 3
      severity: material
      target: Q1 materiality; KN-FIND-016 item 3
      title: >-
        The 143.30 cell is arithmetically over-determined by the paper's own
        published data, so it is a self-correcting appendix typo with no
        downstream reach.
      statement: >-
        Recomputed by me from the vendored extract alone, with no pickle and no
        external data. (a) Theorem 4.1, T = Tsample + R*(N*Tdec + TFFT), applied
        to the printed Table C.2 rows reproduces Table 5.1 within 0.05 bits for 8
        of 9 rows (C0 121.82/173.02/238.99; CC 139.53/195.10/259.65; CN-768
        189.80; CN-1024 254.63). The ninth, CN/Kyber-512, gives 143.30 against
        Table 5.1's 134.5; substituting log2(Tsample)=134.30 gives 134.52. The
        corrected value is forced by the paper's own two tables. (b) With
        eps = R * q^k_fft * Pwrong, q=3329 and k_fft read from Table C.1, the
        printed log2(eps) column reproduces for all nine rows within 0.01 bits
        (CN/Kyber-512: 7.71 + 9*11.7009 - 120.51 = -7.492 vs printed -7.49), so
        Pwrong and R in that row are internally consistent and Tsample is the sole
        outlier in the whole table. Detection and repair need nothing beyond the
        published PDF, and no headline number depends on the cell because Table
        5.1 already carries the corrected total. It should be recorded as a
        proofreading observation, not given equal billing with Q2 and Q3.
      cheapest_check: >-
        Recompute Theorem 4.1 and eps = R*q^k_fft*Pwrong from
        extracts/carrier-hal-05406481/page37_tables_C1_C2.txt and compare with
        experiments/EXP-MLKEM-010/runs/RUN-MLKEM-010-001/theorem41_recompute.json
        (whose nine recomputed_log2 values I reproduce exactly).
      checkable_locus:
        - 'inputs/MLKEM-DUAL-SOURCES-20260802/extracts/carrier-hal-05406481/page37_tables_C1_C2.txt'
        - 'experiments/EXP-MLKEM-010/runs/RUN-MLKEM-010-001/theorem41_recompute.json'
        - 'knowledge/findings/KN-FIND-016.md "What is established" item 3'

    - id: 4
      severity: material
      target: DEC-20260802-002 rationale, inherited by the batch
      title: >-
        The authorizing decision overstated what Q1 could falsify.
      statement: >-
        DEC-20260802-002 justifies the batch with "If the Table C.2 transcription
        error is already corrected by the authors, KN-FIND-016 is a finding about
        a superseded document". That is true only of KN-FIND-016 item 3. Items 1
        and 2 - Table 5.1 matches optimized_withExperimentalPolar.pkl for all nine
        cells within 0.05 bits, and the abstract's 3.5/11.9/12.3-bit shortfalls
        are the CC column - rest on the pickle and on Theorem 4.1 and are
        unaffected by whether a printed digit was fixed. Cheap falsification
        before expensive measurement was the right ordering; the target chosen for
        it could not have falsified what the decision said it would.
      cheapest_check: >-
        Read DEC-20260802-002 `why_this_is_not_the_paused_next_action` against
        KN-FIND-016 "What is established" items 1-3.
      checkable_locus:
        - 'ledger/decisions/DEC-20260802-002.yaml'
        - 'knowledge/findings/KN-FIND-016.md'

    - id: 5
      severity: minor
      target: Q1 identification_chain item 6
      title: >-
        The "differs only in the title" note is uninterpretable and should be
        struck, not counted as a sixth corroborating link.
      statement: >-
        The ePrint `Note:` field is free-form author text with no date and no
        stated referent, and is overwritten at each revision; nothing in the
        retrieved bytes says which pair of versions it compares. Under the equally
        natural reading "this ePrint version differs from the published version
        only in the title" it is vacuous here, because the titles are the same
        string: ePrint <title> and OAI <dc:title> = "Assessing the Impact of a
        Variant of MATZOV's Dual Attack on Kyber", the HAL PDF /Title is the same,
        and Springer's JSON-LD headline is the same modulo a typographic
        apostrophe. Presenting six links where three carry the argument inflates
        the apparent strength of a chain the producer itself flags as not a byte
        comparison. Links (1)-(3) are sound and sufficient.
      cheapest_check: >-
        Compare the <strong>Note:</strong> block in
        inputs/MLKEM-DUAL-SOURCES-20260802/eprint-2022-1750/landing.html with the
        <dc:title> in oai_getrecord.xml, the JSON-LD headline in
        springer_landing.html, and /Title in
        extracts/carrier-hal-05406481/pdf_metadata.json.
      checkable_locus:
        - 'inputs/MLKEM-DUAL-SOURCES-20260802/eprint-2022-1750/{landing.html,oai_getrecord.xml,springer_landing.html}'
        - 'inputs/MLKEM-DUAL-SOURCES-20260802/extracts/carrier-hal-05406481/pdf_metadata.json'

    - id: 6
      severity: material
      target: Q1 retrieval record and the /CreationDate gloss
      title: >-
        "HAL unretrieved" was a client artifact - I fetched the file byte-identical
        to vendor-lock - and the download-time-stamping gloss is falsified.
      statement: >-
        The producer records the HAL document/file URLs as unretrieved (Anubis
        proof-of-work interstitial) and uses that, with the ePrint 403, to explain
        why no byte comparison was possible. Plain curl retrieved the same file at
        three URLs (R4, R5, R6): HTTP 200, application/pdf, 1,252,838 bytes,
        sha256 083b1422...757b8005, cmp-clean against
        experiments/EXP-MLKEM-010/vendor-lock/Carrier-2022-1750-hal-05406481.pdf.
        From those fresh bytes I independently confirmed the Q1 locus: PDF page 37
        CN: Kyber-512 reads "-120.51 7.71 143.30 117.91 124.00 0.71 -7.49";
        143.30 occurs once on the page and once document-wide; 134.30 occurs zero
        times document-wide. Two consequences. Favourable and unclaimed by the
        batch - the vendor-lock artifact is now reproducible today from the
        authoritative repository, not merely vendored once. Unfavourable - the
        adjudication's gloss that /CreationDate D:20260721165108+02'00' is "HAL's
        cover-page stamping at download time, 2026-07-21" is falsified, since a
        download on 2026-08-02 carries the same 2026-07-21 stamp. That gloss sits
        inside the argument asking a reader to trust embedded PDF timestamps as
        revision evidence.
      cheapest_check: >-
