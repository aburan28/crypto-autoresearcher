        - 'PDF p.25 verbatim: "Validating our Analysis Through Simulations.We verify here the soundness of Approximation 4.9 for Pwrong ... computing an experimental value forPwrong ... for different values ofT. We plotted it against its theoretical approximation in Figure 4.1."'
        - 'PDF p.26: Fig 4.1 T-axis ticks are 200 400 600 800 1000 1200 1400 1600 in BOTH panels, as claimed. Caption parameters left panel (q=241,m=40,n=43,nlat=35,nfft=8,kfft=3,N=25971,bkz=32,sieve=44) and right panel (n=50,nlat=42,N=25970,bkz=35,sieve=41) match the archived .out filenames exactly, confirming beta_0=bkz, beta_1=sieve.'
        - 'PDF p.23: Approximation 4.8 gives Pgood ~ 0.5 at that T; Approximation 4.9 gives Pwrong = P(F >= T) at the same T. The producer''s reading is entailed.'
