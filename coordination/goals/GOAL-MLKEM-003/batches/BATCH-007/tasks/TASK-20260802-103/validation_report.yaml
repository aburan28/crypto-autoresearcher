    from the committed snapshot; every vendored body matches its provenance record;
    the snapshot commit has the declared parent, path count and reachability, and
    the working tree is clean; the immutable vendor-lock PDF was not touched. I
    re-fetched seven sources independently and reproduced every load-bearing
