      successful GET of https://eprint.iacr.org/2022/1750.pdf or of the HAL file,
      then a text comparison of Table C.2.
    - >-
      I did not attempt hal.science (Anubis proof-of-work) or web.archive.org
      (proxy egress denial). Both are recorded by the producer as blocks and I have
      no reason to believe a retry changes policy; retrying an egress denial is
      contrary to /root/.ccr/README.md.
    - >-
      I did not re-run EV-MLKEM-013's synthetic identity check (raw cosine sum ==
      fftn(.).real) and did not run G6K. The k_fft=3 alignment convention is taken
      as frozen from EV-MLKEM-013, exactly as the producer took it. If that
      convention is wrong, Q3's aligned statistics move, and neither this report
      nor the producer's would catch it.
    - >-
      Reproducing a statistic reproduces a measurement, not its meaning. Nothing in
      this report supports any statement about ML-KEM security, about whether
      143.30 or 134.30 is the arithmetically correct value, about whether the dual
      attack beats the primal attack, or about any cost model. All results here are
      estimate/quotation tier and toy-parameter (q=241, m=40, n=43/50) where they
      touch measured data; they are never crypto-scale (AGENTS.md rules 4 and 7).
    - >-
      Q3 is a negative-existence statement over four retrieved sources. It is not a
      statement about the literature, and the two sources most likely to falsify it
      remain unread.
    - >-
      My independent PDF extractor recovered ~150 KB of text from the 37-page
      document, less than pypdf's full extraction; it is a targeted cross-check on
      the numeral, not a complete second rendering. The two methods agree on the
