  # ------------------------------------------------------------ locus checks
  locus_checks:
    - question: Q1
      claim: Table C.2, block CN, row Kyber-512, log2(Tsample) cell reads 143.30; 134.30 occurs nowhere
      artifact: experiments/EXP-MLKEM-010/vendor-lock/Carrier-2022-1750-hal-05406481.pdf (read-only, sha256 083b1422...757b8005)
      method_1: >-
        Independent extractor written for this validation: no pypdf. Located and
        zlib-inflated all 291 FlateDecode streams, reconstructed the payloads of
        the text-showing operators, and searched. The math font places the
        decimal point at code 0x3A, so the cell renders as "143:30". Result:
