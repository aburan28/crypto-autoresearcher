      method: read from my own shallow clone at 9c1367f
      findings:
        - "FFT_sample.py line present verbatim: self.T_FFT = numpy.fft.fftn(self.T).real/self.k_fft"
        - "Score_Function.compute_score accumulates math.cos(...) with no division; returns self.F"
        - "Algorithm.py sha256 c86909ea...c83e082 matches; score_function_complete (L58) -> FFT_sample.FFT() -> fft.T_FFT -> numpy.concatenate (L62) -> compute_survival (L79) -> Pwrong_*.out (L151)"
        - "score_function_target (L160) -> Score_Function.compute_score (L162) -> value_function (L182) -> Pgood_*.out (L255-256)"
