        that ends with folio "36"; the recovered CN Kyber-512 row is
        "Kyber-512\x00120:517:71143:30117:91124:000:71\x007:49" (\x00 = minus),
        i.e. -120.51, 7.71, 143.30, 117.91, 124.00, 0.71, -7.49. "134:30" and
        "134.30" occur ZERO times document-wide.
      method_2: >-
        pypdf 6.14.2 cross-check: 37 pages; "143.30" appears on page 37 and on no
        other page, once; "134.30" appears on no page.
      producer_row_verbatim: "Kyber-512 -120.51 7.71 143.30 117.91 124.00 0.71 -7.49"
