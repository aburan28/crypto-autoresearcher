    - "No source retrieved in this task reports a measured Pwrong at or near the aligned Pgood ~ 1/2 operating threshold."
    - "EV-MLKEM-011 and EV-MLKEM-013's archived-data statistics reproduce exactly from freshly cloned bytes."
  not_admissible_for:
