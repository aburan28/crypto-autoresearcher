      affects_substance: false
    - id: D4
      severity: low
      class: completeness_of_reported_comparison
      location: source_adjudication.md Q3 table row 2; adjudication_results.json questions[Q3].retrieved_sources_checked[1].detail
      statement: >-
        The second Pwrong file (beta_0=37, avg_N=200001) is reported as reaching
        T=3003 without noting that its own header records nb_iteration=1 - a single
        run, against nb_iteration=4000 for the file carrying the main comparison
        (and 6000 for the third). Placing "T=3003" beside "T=1802" invites a reader
        to treat them as comparable measurements when they differ by 3.6 orders of
        magnitude in sample size.
      note: >-
        The value is present in the producer's own source_reads.json header dump,
        so this is an omission from the narrative, not from the data. It does not
        change Q3's answer, which excludes both files for lack of a Pgood companion.
      affects_verdict: false
    - id: D5
      severity: low
      class: interpretation_risk_inherited_by_the_ledger
      location: source_adjudication.md Q3 ("stops ~420.6 score units below"); also EV-MLKEM-011 and EV-MLKEM-013 phrasing
      statement: >-
        The endpoint "last T with Pwrong > 0" is a sampling-resolution floor, not a
        property of the Pwrong distribution. I verified this quantitatively: in all
        three files the last positive value equals exactly one observed count,
        1/(nb_iteration * q^k_fft). For the main file 1/(4000 * 241^3) =
        1.7860305406935986e-11, which is bit-for-bit the recorded
        value_at_last_positive and whose log2 is exactly the recorded -35.70445;
        every one of the 1804 entries is an integer multiple of that quantum.
        T=1802 is therefore the empirical MAXIMUM of the wrong-guess sample and
        would move upward with more samples; the 420.6 figure measures how far the
        sample reached, not a gap in the underlying distribution.
      direction: >-
        This strengthens Q3's answer rather than weakening it - it explains WHY no
        measurement exists at the threshold - but it should be stated, because
        "measured Pwrong stops 420.6 units below Pgood" reads as a distributional
        claim and the ledger records inherit that phrasing.
      affects_verdict: false
