  # ------------------------------- verdict entailment (the actual adjudication)
  question_reproduction:
    - id: Q1
      producer_verdict: confirmed_in_current_source
      observations_status: reproduced
      verdict_entailment_status: not_reproduced
      overall_status: not_reproduced
      validator_verdict_recommended: indeterminate
      reason: >-
        Every fact the producer cites reproduces exactly, and I found no error in
        any of them. What does not reproduce is the verdict LABEL. The question
        names side B as "the current revision of ePrint 2022/1750"; the producer's
        own comparison block records side_b_full_text_retrieved: false, and I
        independently re-confirmed the block (HTTP 403, Cloudflare, at
        2026-08-02T17:42:52Z). No byte of the ePrint-hosted full text was ever
        observed, by the producer or by me. The observed artifact is a HAL deposit
        (v1, submitted 2025-12-09) whose identity with ePrint revision 3 rests on a
        chain of administrative metadata: revision history, OAI datestamp, an
        embedded /ModDate 6m32s earlier, and OA-location enumeration. None of those
        links touches Appendix C, which is the only thing Q1 asks about. A chain of
        timestamps is an inference, not an observation of the cell, and the enum
        already contains the value for that situation. `indeterminate` is therefore
        the more defensible verdict as the question is worded.
      what_IS_byte_supported: >-
        Two sub-findings survive at full strength and should be carried forward
        rather than lost with the label: (a) the cell reads 143.30 and 134.30
        occurs nowhere in the authors' most recent self-deposited full text
        (verified by me with two independent extraction methods); (b) ePrint's own
        current record shows no revision after 2025-06-11, so no post-deposit
        correction can exist on ePrint. If the authors had corrected 143.30, their
        own December-2025 HAL deposit is where it would have appeared, and it did
        not. "No authors' correction found in any retrievable source" is fully
        byte-supported.
      validator_added_evidence: >-
        The producer's chain is purely administrative. I added the content-level
        link it was missing: the abstract in the CURRENT ePrint record (retrieved
        HTTP 200, byte-identical page) agrees with the vendored PDF's abstract at
        0.888 token similarity, and every divergence is a citation-key or
        text-extraction artifact ([MAT22] vs "Matzov,2022"; "Kyber [SAB+20]" vs
        "CRYSTALS-Kyber"; "L WE" vs "LWE"). All six headline numbers - 3.5/11.9/12.3
        bits below 143/207/272 - appear in both. This materially strengthens the
        identification and still does not reach Appendix C, which is why my
        recommendation stays `indeterminate` rather than moving to confirmation.
      mitigating: >-
        The producer disclosed this residual prominently in three places
        (adjudication_results.json residual_uncertainty, source_adjudication.md
        "Residual uncertainty", receipt.json handoff_back) and explicitly asked the
        Coordinator to route the downgrade question to the Reviewer. This is a
        calibration defect, not concealment and not fabrication.
    - id: Q2
      producer_verdict: confirmed_in_current_source
      observations_status: reproduced
      verdict_entailment_status: reproduced
      overall_status: reproduced
      reason: >-
        Independently re-verified end to end. My own `git ls-remote` at
        2026-08-02T17:42:53Z resolves both HEAD and refs/heads/main to
        9c1367f85d26038244bc83c025d84c0b7006f2ee, advertising no other ref; my own
        shallow clone lands on that commit (2025-04-13T10:02:03+02:00, Kevin
        Carrier, "Add files via upload", 167 tracked files). EXP-MLKEM-013's
        specification.yaml pins source_refs.code_commit to the same sha. Head and
        pin are the same object, so the "has the code changed since the finding?"
        question is closed by identity, not by inference. Both score-path lines and
        the whole pipeline attribution are present verbatim at that commit, and the
        167-file hash manifest I regenerated is byte-identical to the producer's.
        This verdict is entailed by the cited locus with no residual.
      scope_limit: >-
        As the producer states, this confirms only that the code is unchanged and
        that the quoted code facts are accurate at that commit. It is not a
        re-derivation of EV-MLKEM-013's synthetic identity check, which neither of
        us re-ran.
    - id: Q3
      producer_verdict: confirmed_in_current_source
      observations_status: reproduced
      verdict_entailment_status: reproduced_with_labelling_objection
      overall_status: reproduced
      reason: >-
        Every constituent observation reproduces from bytes I fetched myself: the
        paper-side loci (pp. 23/25/26/27/37), all six reproduction_check statistics,
        the three Pwrong files' supports, and the MATZOV and FIPS 203 term counts
        (both PDFs re-downloaded, sha256 exact match). The stated answer - no
        MEASURED Pwrong exists at or near the aligned Pgood ~ 1/2 threshold in any
        source retrieved - is entailed by those observations. My objection is to the
        enum label, not the answer: `confirmed_in_current_source` is a poor name for
        a negative-existence result over a four-source corpus whose two most
        relevant members (Ducas-Pulles 2023/302 full text, Guo-Johansson) were
        unretrievable. The producer states that scope limit explicitly and says the
