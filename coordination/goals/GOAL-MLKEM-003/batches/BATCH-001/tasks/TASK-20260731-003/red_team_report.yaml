schema: crypto.autoresearch.red_team_report.v1
red_team_report:
  id: RT-20260731-001
  task_id: TASK-20260731-003
  experiment_id: EXP-MLKEM-015
  hypothesis_id: H-MLKEM-014
  evidence_id: EV-MLKEM-015
  decision_id: DEC-20260731-007
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-001
  run_ids: [RUN-MLKEM-015-001]
  role: red-team
  audited_by: red-team
  audited_at_utc: '2026-07-31T05:30:00Z'
  independent_session: true
  official_state_change: none
  validator_report_ref: >-
    coordination/goals/GOAL-MLKEM-003/batches/BATCH-001/tasks/TASK-20260731-002/validation_report.yaml
  validator_verdict_observed: accept_with_qualifications

  inference:
    requested_policy: review-xhigh
    resolved_model_id: cursor-grok-4.5
    fallback_allowed: true
    fallback_used: true
    independent_session_required: true
    independent_session: true
    note: >-
      Independent session from the Executor and from VAL-20260731-001.
      Requested review-xhigh is not a distinct reachable backend in this
      harness; Cursor Grok 4.5 used with fallback_used true. This session did
      not author EXP-MLKEM-015, EV-MLKEM-015, DEC-20260731-007, KN-FIND-015,
      or VAL-20260731-001.

  claim_under_review: >-
    That RUN-MLKEM-015-001 / EV-MLKEM-015 support H-MLKEM-014 at claim_tier
    medium under matched RC.MATZOV costing; that DEC-20260731-007 refine and
    KN-FIND-015 promotion are warranted; and that this constitutes a real
    narrowing of KN-OPEN-016 without equating lattice-estimator MATZOV dual
    to Carrier polar repair or claiming an ML-KEM break.

  verdict: pass_with_constraints
  blocks_ledger_record: false

  disposition_on_dec:
    decision_id: DEC-20260731-007
    recorded_decision: refine
    red_team_disposition: accept_with_constraints
    refine_stands: true
    promote_kn_find_010: true
    constraints: >-
      Keep DEC refine and KN-FIND-015 promotion only under the scoped reading
      in narrowest_supported_statement. Do not paraphrase NIST-margin pressure
      as a break; do not treat C2 as falsifying or validating Carrier polar
      decoding; do not mark KN-OPEN-016 closed or "advanced" beyond public-
      instrument non-reproduction; retain Module-LWE→LWE modeling as an
      explicit boundary. Archive/commit the working-tree package before treating
      the receipt as immutable (validator Q-UNCOMMITTED-WORKING-TREE-PACKAGE).

  what_would_set_blocks_ledger_record_true: >-
    Any ledger phrasing that presents EXP-MLKEM-015 as a cryptanalytic break /
    FIPS-203 contradiction; any claim that Carrier polar-decoding heuristics
    were settled by the LE dual gap; any presentation of cross-model dual-vs-
    primal comparison as matched; or any H-MLKEM-014 falsification_condition
    firing on recomputed numbers.

  attack_lines_challenged:
    - id: AL-1
      title: cost-model sleight of hand
      landed_as: constrained_not_fatal
      severity: medium
      summary: >-
        Package correctly separates MATZOV gate-count revision (C3 via
        primal_bdd) from dual-attack superiority (C1). Residual risk is
        reading C3 as algorithmic pressure, and reading Carrier absolute
        costs as commensurate with LE MATZOV without primary-text cost
        arithmetic.
    - id: AL-2
      title: equating LE matzov dual with Carrier polar repair
      landed_as: constrained_not_fatal
      severity: high
      summary: >-
        Explicit non-claims exist and defeat identity. C2 remains a
        non-reproduction finding only. Any paraphrase that "the polar repair
        fails because LE dual is higher" is overclaim; residual of KN-OPEN-016
        is still the polar/coding claim plus cost-arithmetic identity.
    - id: AL-3
      title: overclaiming NIST pressure as a break
      landed_as: defeated_against_written_package
      severity: medium
      summary: >-
        EV/DEC/KN-FIND-015 non_claims refuse break language. Constraint only:
        "category pressure" / "undercuts NIST cutoffs" must stay estimate-
        convention language; Kyber1024 margin is 1.28 bits.
    - id: AL-4
      title: MLWE vs LWE gap
      landed_as: already_bounded
      severity: medium
      summary: >-
        schemes.Kyber* Module-LWE→LWE modeling is disclosed. Does not falsify
        matched LWE-estimate conjuncts; blocks transfer to structured MLWE
        attacks without further work.
    - id: AL-5
      title: whether KN-OPEN-016 is advanced
      landed_as: constrained_narrowing_only
      severity: high
      summary: >-
        Public-instrument half is narrowed (dual does not beat primal under
        LE MATZOV; published dual headlines not reproduced). Carrier
        polar-repair half is untouched. KN-OPEN-016 must remain status open;
        "real narrowing" is allowed only in the public-instrument sense.

  objections:
    - id: OBJ-RT009-001
      number: 1
      attack_line: AL-1
      title: Carrier absolute costs vs LE MATZOV dual are not proven commensurate
      severity: medium
      status: landed
      blocks_ledger_record: false
      fatal_to_refine: false
      contest: >-
        Whether C2's bit gaps measure a missing algorithmic ingredient or
        mix cost-arithmetic conventions when Carrier shortfalls-to-NIST are
        converted to absolute log2 costs and subtracted from LE dual_hybrid.
      finding: >-
        Carrier targets 139.5 / 195.1 / 259.7 are NIST cutoff minus abstract
        shortfalls 3.5 / 11.9 / 12.3 (verified). Comparing those absolutes to
        lattice-estimator dual_hybrid+fft under RC.MATZOV assumes the papers'
        costing matches that instrument. Primary Carrier PDF / Table 5.1 was
        not re-derived (network-blocked; validator and EV agree). Gaps are
        therefore non-reproduction against a named public instrument, not a
        proof that Carrier's own arithmetic understates its attack by 4–16
        bits inside a shared model. DEC already routes BATCH-002 to primary-
        text recompute — that is the correct discharge, not a reason to
        reject refine.
      required_constraint: >-
        Cite C2 only as "published dual headlines undercut LE MATZOV
        dual_hybrid+fft"; never as "Carrier overclaims by N bits under
        matched costing" until Table 5.1 / App. C is re-derived.

    - id: OBJ-RT009-002
      number: 2
      attack_line: AL-2
      title: LE matzov dual must not be equated with Carrier polar repair
      severity: high
      status: landed
      blocks_ledger_record: false
      fatal_to_refine: false
      contest: >-
        Whether the numerical gap to dual_hybrid settles, falsifies, or
        proxies Carrier's polar-decoding / coding-theoretic repair
        (KN-LIT-7617).
      finding: >-
        Validator scope_check.carrier_polar_heuristics_reimplemented is
        false. H-MLKEM-014 interpretation_limits, EV boundaries, DEC
        non_claims, and KN-FIND-015 "does not establish" all refuse identity.
        Attack line fails against the written package. Residual risk is
        KN-OPEN-016 "Current state" language that calls the residual "the
        Carrier polar-repair gap" — that residual is disjunctive (polar
        ingredients ∪ different cost arithmetic ∪ overclaim), as KN-FIND-015
        point 2 already states. Refine stands; promotion stands only with
        that disjunction retained.
      required_constraint: >-
        Do not update KN-OPEN-016 or any ledger text to imply polar heuristics
        were measured. Keep "beyond the public MATZOV dual" wording.

    - id: OBJ-RT009-003
      number: 3
      attack_line: AL-3
      title: NIST-cutoff undercut is cost-model pressure, not a break
      severity: medium
      status: landed_as_constraint
      blocks_ledger_record: false
      fatal_to_refine: false
      contest: >-
        Whether C3 / "category pressure" / primal_bdd below 143/207/272 can
        be read as ML-KEM broken or NIST categories operationally failed.
      finding: >-
        Package non_claims defeat break language. C3 is exactly the
        KN-TECH-040 lesson: MATZOV gate-count revision moves estimates without
        a new dual algorithm. Kyber1024 margin is only 1.276 bits — within
        typical estimator/model noise for medium-tier estimates. DEC refine
        and "not a target-class break" are correct. Constraint binds marketing
        paraphrase only.
      required_constraint: >-
        Any citation of C3 must name RC.MATZOV and refuse FIPS-203 /
        operational-break paraphrase.

    - id: OBJ-RT009-004
      number: 4
      attack_line: AL-4
      title: Module-LWE is estimated as LWE via schemes.Kyber*
      severity: medium
      status: landed_as_boundary
      blocks_ledger_record: false
      fatal_to_refine: false
      contest: >-
        Whether matched LWE estimates under schemes.Kyber* answer ML-KEM /
        Module-LWE security, or leave module structure uncharged.
      finding: >-
        H-MLKEM-014 assumptions and EV boundaries already record
        Module-LWE→LWE modeling. Conjuncts are about that LWE model. This does
        not falsify H-MLKEM-014; it bounds GOAL-MLKEM-003 transfer until
        module-aware or primary FIPS-203 estimation is done. No refine change.
      required_constraint: >-
        EV/DEC/KN-FIND-015 citations must retain Module-LWE→LWE modeling as a
        load-bearing boundary, not a footnote.

    - id: OBJ-RT009-005
      number: 5
      attack_line: AL-5
      title: KN-OPEN-016 is narrowed on the public instrument only
      severity: high
      status: landed
      blocks_ledger_record: false
      fatal_to_refine: false
      contest: >-
        Whether DEC's "real narrowing of KN-OPEN-016" advances the open
        problem's polar-repair / deployed-parameter question, or only the
        public LE dual-vs-primal measurement.
      finding: >-
        KN-OPEN-016 asks what dual costs after heuristics are repaired, and
        whether any deployed set loses security. EXP-MLKEM-015 answers a
        different, useful sub-question: under pinned LE MATZOV, dual_hybrid
        does not beat primal_bdd, and published dual headlines are not
        reproduced by that instrument. The polar-repair half remains open
        (OBJ-RT009-002). The "lose security" half under MATZOV appears via
        primal cost-model revision (OBJ-RT009-003), which is not the dual-
        heuristic question the open problem foregrounds. "Narrowing" is
        warranted; "advanced/closed/settled" is not. KN-OPEN-016 status must
        stay open. DEC refine + BATCH-002 toward Carrier primary text is the
        correct next move.
      required_constraint: >-
        Allow "narrowed residual / public-instrument measurement" language;
        forbid marking KN-OPEN-016 closed, settled, or advanced past the
        public LE dual non-reproduction result.

    - id: OBJ-RT009-006
      number: 6
      attack_line: process
      title: Validator qualifications on receipt completeness remain live
      severity: medium
      status: adopts_validator
      blocks_ledger_record: false
      fatal_to_refine: false
      contest: >-
        Whether missing raw_by_scheme, uncommitted working-tree package, and
        no Sage re-execution weaken ledger adoption.
      finding: >-
        VAL-20260731-001 Q-MISSING-RAW-BY-SCHEME, Q-UNCOMMITTED-WORKING-TREE-
        PACKAGE, and Q-NO-SAGE-REEXECUTION are accepted. They do not falsify
        the four decision-rule conjuncts. They constrain immutability and
        secondary-cell auditability (GJ21, dual_hybrid fft=False).
      required_constraint: >-
        Commit/archive EXP-MLKEM-015 before durable ledger citation; do not
        cite GJ21 or fft=False cells as measured from results.json until raw
        grid is present.

  defeated_attack_readings:
    - >-
      That matched MATZOV dual-vs-primal is itself sleight of hand: CTRL-
      MATCHED-COST-MODEL and validator recomputation show dual and primal
      share RC.MATZOV; ADPS16 is control-only; GJ21 is out of the decision
      rule.
    - >-
      That the package claims Carrier polar repair was reimplemented or
      falsified: multiple explicit non_claims refuse this.
    - >-
      That NIST undercut is presented as a cryptanalytic break: non_claims
      and DEC rationale refuse this.
    - >-
      That H-MLKEM-014 conjuncts fail: validator recomputation confirmed all
      four; this session did not find arithmetic contradiction in the
      published deltas.

  narrowest_supported_statement: >-
    Under pinned lattice-estimator 3e48ef4 and schemes.Kyber*, with dual and
    primal compared inside RC.MATZOV only: (1) dual_hybrid+fft does not beat
    primal_bdd on Kyber-512/768/1024; (2) Carrier and MATZOV-2022 published
    dual headlines sit several bits below that public dual instrument (gaps
    not proven to be same-model algorithmic shortfalls without primary-text
    recompute); (3) primal_bdd under MATZOV sits slightly below NIST classical
    cutoffs 143/207/272 as a named-cost-model estimate, not a break; (4)
    ADPS16 primal_usvp matches Kyber.py classical core-SVP within 1.5 bits.
    This supports H-MLKEM-014 at claim_tier medium, warrants DEC refine and
    KN-FIND-015 as a public-instrument finding, and narrows only the public-
    LE half of KN-OPEN-016. It does not settle Carrier polar decoding, does
    not close KN-OPEN-016, and does not break ML-KEM / FIPS 203.

  required_controls:
    - id: CTRL-RT009-COST-COMMENSURABILITY
      method: >-
        Re-derive Carrier Table 5.1 / App. C from primary text (or archive
        extract) before claiming same-model bit gaps; until then keep C2 as
        instrument non-reproduction.
      pass_condition: >-
        BATCH-002 / EXP-MLKEM-010 either matches Carrier arithmetic under a
        named model or documents irreducible convention mismatch.
    - id: CTRL-RT009-OPEN-016-SCOPE
      method: >-
        Any KN-OPEN-016 or goal update must distinguish public-LE dual/primal
        measurement from unsettled polar-repair heuristics.
      pass_condition: >-
        KN-OPEN-016 status remains open; residual text retains the
        ingredients / cost-arithmetic / overclaim disjunction.
    - id: CTRL-RT009-ARCHIVE-BEFORE-IMMUTABLE-CITE
      method: Commit or snapshot-receipt the EXP-MLKEM-015 package.
      pass_condition: >-
        Verified commit or archive receipt binds results.json and
        source-lock.yaml hashes.

  knowledge_promotion:
    kn_find_010_warranted: true
    kn_open_016_status_change: none
    kn_open_016_allowed_update: >-
      Optional: record public-instrument measurement as current-state bullet
      without changing status from open and without equating residual to
      polar-repair falsification.

  next_concrete_action: >-
    Coordinator may keep DEC-20260731-007 refine and promote KN-FIND-015 under
    the constraints above; open BATCH-002 / EXP-MLKEM-010 for Carrier primary
    recompute or small-dimension polar-decode falsification; archive
    EXP-MLKEM-015; leave KN-OPEN-016 open.

  artifact_paths:
    - coordination/goals/GOAL-MLKEM-003/batches/BATCH-001/tasks/TASK-20260731-003/red_team_report.yaml
    - coordination/goals/GOAL-MLKEM-003/batches/BATCH-001/tasks/TASK-20260731-003/objections.md
