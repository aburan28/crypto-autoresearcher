  qualifications:
    - id: Q-MISSING-RAW-BY-SCHEME
      severity: medium
      note: >-
        Committed-shape results.json omits raw_by_scheme that
        reproduce_estimates.py would write (full MATZOV/ADPS16/GJ21 ×
        dual_hybrid±fft × primal_* grid). GJ21 and dual_hybrid fft=False
        costs are therefore not independently re-readable from the receipt,
        even though specification IVs include them and execution-report says
        GJ21 figures are recorded for completeness. Decision-rule conjuncts
        do not require those cells.
    - id: Q-BEST-ATTACK-OMITS-FFT-FALSE
      severity: low
      note: >-
        best_MATZOV_attack is min over {dual_hybrid+fft, primal_bdd,
        primal_usvp} only; key_findings text says among dual_hybrid±fft.
        Without raw cells, fft=False cannot be confirmed non-cheapest. Does
        not affect conjunct (1), which is explicitly dual_hybrid+fft vs
        primal_bdd.
    - id: Q-UNCOMMITTED-WORKING-TREE-PACKAGE
      severity: medium
      note: >-
        At validation time experiments/EXP-MLKEM-015/, EV-MLKEM-015,
        DEC-20260731-007, and KN-FIND-015 were untracked on
        cursor/goal-mlkem-003-dual-attack (HEAD
        d1cddccf6647cd3100eff3fe392833aac03e166a). Numbers and vendor pins were
        checked on the working tree; there is no snapshot-receipt hash bind yet.
        Archive/commit remains a process gate for immutability, not a numeric
        falsification.
    - id: Q-NO-SAGE-REEXECUTION
      severity: informational
      note: >-
        Validator recomputed conjunct arithmetic from archived results.json and
        verified vendor commit/file hashes. Full Sage lattice-estimator
        re-execution was not performed in this session.
    - id: Q-LEDGER-DRAFTED-BEFORE-VALIDATION
      severity: informational
      note: >-
        EV-MLKEM-015 (status: draft), DEC-20260731-007, and KN-FIND-015 already
        exist and numerically agree with this recomputation. blocks_ledger_record
        remains false because no conjunct fails; draft ledger content is
        consistent with the admissible receipt.

  blockers: []
  failed_controls: []
  failed_artifacts: []

  limitations:
    - >-
      Estimates under named cost models are not key-recovery certificates and
      do not break ML-KEM / FIPS 203.
    - >-
      Carrier polar-decoding heuristics were not reimplemented; gaps are to the
      public lattice-estimator MATZOV dual instrument only.
    - >-
      accept_with_qualifications means the H-MLKEM-014 decision-rule numbers are
      admissible under matched MATZOV costing; it does not by itself change
      official hypothesis/goal status.

