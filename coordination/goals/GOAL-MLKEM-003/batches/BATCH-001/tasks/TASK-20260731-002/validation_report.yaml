    for H-MLKEM-014. All four conjuncts recompute from results.json; dual vs
    primal is matched inside RC.MATZOV; scope stays estimate-only. Qualifications
    do not falsify the decision rule. This does not authorize a cryptanalytic
    break claim or FIPS-203 contradiction.

  what_would_set_blocks_ledger_record_true: >-
    Any H-MLKEM-014 falsification_condition firing; cross-model dual-vs-primal
    comparison presented as matched; estimator/pq-crystals commit or source-lock
    file hash mismatch against the declared pins; or key-recovery / certificate
    language in the evidence package.

  independence:
    session_independence: true
    independent_session: true
    basis: >-
      Fresh validator session. Inputs were working-tree EXP-MLKEM-015 artifacts,
      H-MLKEM-014, and source-lock. Arithmetic recomputed with session-local
      Python, not the executor summary prose.

