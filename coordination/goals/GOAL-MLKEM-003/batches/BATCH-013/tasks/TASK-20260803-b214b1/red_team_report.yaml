  attacks_that_failed_recorded_so_they_are_not_re_run:
    - >-
      "One fitted scale rescues almost any monotone shape over this band."
      REFUTED. Null-object control, four one-parameter families with no source
      content, whole band as a multiple of the published floor: hard step in v
      47.0x/56.9x; logistic slope 1, 30.0x/30.8x; logistic slope 3, 5.67x/7.48x;
      exponential ramp k = p_own/7, 4.86x/6.70x. Against M1a 2.07x/2.13x and M2
      1.04x/0.97x. The statistic is not trivially satisfiable and M2's position
      on it is not manufactured by the fitted normalisation.
    - >-
      "The improvement is a deep-tail artifact." REFUTED. 98.6 percent (n=43) and
      90.8 percent (n=50) of the matched-parameter improvement, and 77.7 percent
      (n=43) of the improvement over the two-parameter surrogate, lands on the
      C>=1000 rows where the counting floor is negligible.
    - >-
      "The exponent is frozen only after a modelling choice that could have gone
      otherwise (beta_sieve = beta_1 versus beta_0)." REFUTED by the source's own
      Fig 4.1 caption in the archived page-26 extract. See O-9.
    - >-
      "The second-parameter null selection is a flat likelihood, i.e. the
      statistic is insensitive to s." REFUTED. Whole-band s-curve curvature 25.9
      (n=43) and 39.6 (n=50) bits per unit squared; the continuous vertex
      improves on s = 1.00 by 1.6e-4 bits in both files.
    - >-
      "The ANOM-1 node-ordering assumption survives elsewhere in the script."
      NOT FOUND. build_u_nodes sorts globally in u; the kept set
      {|T-u| < sqrt(120N)} is then an interval; the assertion elif j != prev + 1
      fires inside the row-building loop for every score and cannot be vacuous.
      My own implementation carries the identical contiguity assertion with a
      different node layout (1520 vs 876) and a different kernel cut (150 vs
      120), never fired it, and reproduces every M2 cell. There is no second
      slice-addressed structure: region_measure and the mixture F do not index
      across nodes.
    - >-
      "The numbers do not reproduce." REFUTED at every point I could reach.
      Twenty-plus quantities reproduced across four fresh implementations.

  narrowest_supported_statement: >-
    On two archived toy files (q=241, m=40, n=43 and n=50), resolved band only,
    raw undivided score scale, one fitted normalisation and no fitted exponent:
    the region measure implied by (4.10)/(4.11)/(4.24) fits the archived survival
    curve strictly and substantially better than BATCH-009's Gaussian-Phi
    surrogate -- 0.3556 versus 0.7055 bits (n=43) and 0.3172 versus 0.6969
    (n=50) at matched parameter count, and versus 0.4271/0.4274 at the
    surrogate's two-parameter best -- with 91 to 99 percent of the
    matched-parameter improvement contributed by rows whose pooled count is at
    least 1000 and whose counting noise is therefore negligible. On those
    well-measured rows the exact measure reduces the misfit from 64.7x/60.5x to
    23.9x/23.9x the counting floor and does NOT close it. No statement about
    where the whole band sits relative to the counting floor is supported at any
    precision, because that statistic has about 1.5 effective degrees of freedom,
    a denominator supplied 99.91 percent by rows on which a 60x-wrong model
    scores the same as the exact one, and a 9.4 percent sensitivity to a
    modelling choice the source does not fix. Nothing here bears on ML-KEM or
    Kyber security in either direction. AGENTS rule 12 remains UNMET and
    UNWAIVED.

  next_concrete_action: >-
    ONE action, zero new sampling: run required control C1 -- a properly
    constructed deep-tail Poisson dispersion test on the archived increments
    beyond the count>=1000 boundary, with a local smooth rate, a leverage
    correction, windows binned to expected count >= 10, and phi reported with its
    own sampling sd. It is the single cheapest computation that decides whether
    the counting floor is calibrated in the region supplying 99.9 percent of the
    whole-band denominator, and it therefore decides whether ANY absolute
    whole-band reading -- favourable or adverse -- is interpretable. Everything
    else in this report is already settled by the numbers above. If the
    Coordinator wants a second item in the same batch, it is the restatement of
    EV-MLKEM-553b83 P-1/P-2 and DEC-20260803-3bba92 in the comparative form given
    under what_the_finding_may_claim, with the whole-band ratio carried only with
    its effective degrees of freedom attached.

  scope_limits:
    - Two archived toy files, resolved band only (scores 0-1802 and 0-2309), raw undivided score scale, toy tier.
    - RT-11 stands - the band reaches ~15 percent of the operating threshold, so no region in this archive is the security-relevant region.
    - Everything recomputed here is a goodness-of-fit statistic on archived counts. No mechanism for the S-shaped residual is advanced, and no claim is made about Approximation 4.9 at any other parameter set.
    - Agreement of four implementations is not proof that a shared premise is right. I verified the R1/R2 reductions algebraically and by construction, but did not re-derive (4.10)/(4.11) from the vendored PDF in this session.
    - My two deep-tail dispersion attempts are inconclusive BY CONSTRUCTION and are reported as such, in neither direction.
    - This is a scoped objection to one statistic, not an impossibility result and not a rejection of the package. The package is the most carefully executed in this goal.
    - dominated_by n/a - no attack advanced, no cost frontier occupied. sota_delta zero.

