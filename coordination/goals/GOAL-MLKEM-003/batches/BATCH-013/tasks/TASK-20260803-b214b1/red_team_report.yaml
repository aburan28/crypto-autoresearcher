      - coordination/goals/GOAL-MLKEM-003/batches/BATCH-012/tasks/TASK-20260803-bddfa7/

  independent_work_done_here: >-
    Three implementations written from scratch in this session, sharing no code
    with the producer or the validator. (1) The counting floor, with my own
    Poisson window 15*sqrt(lam)+30, my own branch switch at 3e5 and my own
    three-term asymptotic -- FOURTH independent computation, all eight published
    values reproduced. (2) The Gaussian-Phi surrogate leg, with my own
    Gauss-Legendre, a 1520-node three-zone panel layout and kernel cut 150 --
    FIFTH implementation of the BATCH-009 cross-check point. (3) The exact
    region measure end to end: Upsilon by POISSON'S INTEGRAL in double precision
    (not the (4.11) alternating series in 120-digit Decimal), the region
    assembled by MONOTONE-SEGMENT INVERSION of Upsilon_a with exact
    xi^{beta_sieve} endpoint measures (not per-eta root-finding, not a tau
    table), my own eta quadrature, my own psi_lsc mixture F built from a
    tabulated J(x)=int_x^inf psi(d) d^{-n_fft} dd, my own u-quadrature and fit
    -- THIRD implementation of M2, agreeing on all eight cells to <=9e-5 bits
    and on every log2 A to five decimals. On top of those: the lane's first
    null-object control (four one-parameter families with no source content);
    the first decomposition of the whole-band statistic into its C>=1000 and
    C<1000 parts for every model; the first computation of the effective degrees
    of freedom of the whole-band statistic; a re-derivation of validator defect
    D-1 with its own measured leverage vector; and the four budget-blocked
    claims. ZERO NEW SAMPLING, no network, no G6K. The vendored PDF was not
    opened in this session; it was not needed. No producer or validator artifact
    was modified and nothing was committed.

  # =====================================================================
  verdict: pass_with_constraints

  survives_statement: >-
    THE POSITIVE FINDING SURVIVES IN ITS COMPARATIVE FORM AND DOES NOT SURVIVE
    IN ITS ABSOLUTE FORM. I could not break Claim 1's numbers (three
    implementations now agree), Claim 1's parameter count, the exponent-frozen
    claim (which I strengthened -- see O-9), the null-selection of the second
    parameter, or the attribution correction. Four of my own candidate
    objections failed outright and are recorded as failed. What does not survive
    is the sentence the decision is built on: "fits the whole band at 1.06-1.13x
    the counting-noise floor" and every variant of it ("at the floor", "CLOSED",
    "below its floor", "consistent with the counting floor to within the floor's
    own protocol correction"). That statistic has ~1.5 effective degrees of
    freedom, a sampling standard deviation near 57 percent, a denominator
    supplied 99.91 percent by rows that provably do not discriminate, and a
    9.4 percent sensitivity to a modelling choice the source does not fix which
    simultaneously fails to improve the fit where the data are good. Also not
    surviving: the unqualified claim that the whole-band misfit was the
    surrogate's and not Approximation 4.9's, and the description "corrects three
    batches of this program's own work".

  what_the_finding_may_claim:
    - >-
      The region measure implied by (4.10)/(4.11)/(4.24), with ONE fitted
      normalisation and NO fitted exponent, fits the two archived toy files
      strictly and substantially better than BATCH-009's Gaussian-Phi surrogate:
      whole-band log2 rms 0.3556 against 0.7055 (n=43) and 0.3172 against 0.6969
      (n=50) at MATCHED parameter count, and against 0.4271/0.4274 at the
      surrogate's two-parameter best. Reproduced here by a third independent
      implementation.
    - >-
      98.6 percent (n=43) and 90.8 percent (n=50) of the matched-parameter
      improvement, and 77.7 percent (n=43) of the improvement over the
      two-parameter surrogate, is contributed by rows with pooled count >= 1000
      where the counting floor is 0.0146/0.0152 bits. The improvement is
      therefore NOT a tail artifact and does not depend on any floor protocol.
    - >-
      On the well-measured sub-band the exact measure reduces the misfit from
      64.7x/60.5x (surrogate at matched one parameter) to 23.9x/23.9x the
      counting floor. It does not close it; at matched TWO parameters the
      surrogate's own best (16.5x/24.8x) is comparable or better.
    - >-
      Two structurally different second parameters buy <= 2e-4 bits on the whole
      band; the continuous s-vertex is 0.9975 (n=43) and 1.0020 (n=50) with
      curvature 25.9 and 39.6 bits per unit squared, so this is genuine
      selection and not a flat likelihood.
    - >-
      The exponent is a derived quantity fixed by the source's own
      beta_sieve = 44 / 41, which I verified against the archived page-26
      extract. This is stronger than the package claimed and discharges a
      validator limitation.
    - >-
      The attribution correction stands: what BATCH-009 and BATCH-010 fitted was
      a surrogate. (First recorded in BATCH-011 as EV-MLKEM-2e668d C-3;
      confirmed positively here.)
    - >-
      NOTHING about ML-KEM or Kyber security in either direction, nothing about
      Carrier et al.'s cost figures, nothing about Table 5.1. Toy tier, resolved
      band only, raw undivided score scale.

  # =====================================================================
  objections:

    - id: O-1
      severity: blocking_for_the_absolute_claim
      title: >-
        The whole-band rms/floor ratio has ~1.5 effective degrees of freedom, so
        it cannot be quoted at the precision the record quotes it
      detail: >-
        This follows from the validator's own D-1 and nobody computed it. D-1
        establishes Cov(eps_T, eps_T') = min(1/lambda_T, 1/lambda_T'), i.e. the
        counting residual is Brownian in 1/lambda. The effective degrees of
        freedom of Q = (1/n) SUM eps^2 is then (SUM a)^2 / SUM_{T,T'}
        min(a_T,a_T')^2. Computed on the archived counts with the EXACT
        truncated-Poisson per-row variances: dof = 1.55 (n=43 whole), 1.51 (n=50
        whole), 1.81 and 1.90 at count>=1000. Under white noise the same
        quantity would be 422 and 471. A model that is exactly right therefore
        produces a whole-band ratio with sampling sd ~= 0.5*sqrt(2/dof) = 57
        percent. Consequences: "1.06-1.13x" is three significant figures on a
        statistic with a 1-sigma spread of +/-0.5; the entire D-1 correction (6
        to 11 percent) and my own refinement of it (O-5, a further 3 percent)
        are an order of magnitude inside that and are corrections to WORDING,
        not evidence; and ANOM-4 was never an anomaly, since a perfect model on
        n=50 reads below 1.00x roughly half the time. NOT affected: the model
        comparison, which is paired on one shared noise realisation and lands
        91-99 percent on rows where the counting noise is negligible.
      cheapest_check: >-
        Four lines on the archived .out counts: recover C_T = value * nb_iteration
        * q^k_fft, set a_T to the per-row truncated-Poisson floor, and evaluate
        (SUM a)^2 / SUM_k a_k^2 (2(m-k)-1) with a ascending. Run in this session.

    - id: O-2
      severity: blocking_for_the_absolute_claim
      title: >-
        99.91 percent of the headline's denominator comes from rows that provably
        cannot discriminate models, and a 60x-wrong model scores the same there
      detail: >-
        Computed from the archived counts: rows with C < 1000 supply 99.91
        percent (n=43) and 99.89 percent (n=50) of the whole-band floor variance,
        and rows with C < 10 -- 310 and 341 rows, 17.2 and 14.8 percent of the
        band -- supply 80.87 and 80.73 percent of it. The 852/1132 rows with
        C >= 1000 supply 0.087 and 0.105 percent. Decomposing every model's
        residual at its own whole-band fit gives, on the C<1000 rows: exact
        measure 0.770x / 0.581x of that sub-band's floor; surrogate at p=23 /
        22.25, 0.837x / 0.644x; surrogate at its own frozen exponent -- which the
        SAME statistic rejects at 64.7x / 60.5x on the measurable rows -- 0.799x
        / 0.817x. All below the floor and mutually indistinguishable. Under
        docs/inventor-protocol.md section 3 that is a CONTROLLED NULL for the
        tail component of the whole-band statistic. The exact identity for n=43
        is (whole ratio)^2 = 0.5919 + (residual variance sum on the 852
        measurable rows)/209.126, so the measurable misfit -- 572x its own floor
        in variance -- is attenuated by 1147x (949x for n=50) before it reaches
        the headline; and a model exactly right on all measurable rows would read
        0.769x (n=43) / 0.581x (n=50), not 1.00x.
      cheapest_check: >-
        Per-row floors from the archived counts, summed per index set; and the
        residual of each model on C>=1000 and C<1000 separately at its own
        whole-band fit. Both run in this session; the M2 n=43 split agrees with
        the validator's own 0.349849 to 8e-5.

    - id: O-3
      severity: blocking_for_the_absolute_claim
      title: >-
        Artifact tell -- an undetermined modelling choice moves the headline 9.4
        percent in the favourable direction without improving the measurable fit
      detail: >-
        (4.22) integrates d_lsc from 0 against a normal density, so the model's
        deep tail is governed by the left tail of a Gaussian approximation to a
        decoding distance where it has no physical support. The producer declares
        this as ANOM-7 and bounds it. I reproduced the variant independently on
        BOTH files (n=43 whole 0.322071 against 0.322072, ln_A -119.30967 against
        -119.3096973737681; n=50 whole 0.306416 against 0.3064170322) and then
        decomposed it, which the package did not. Truncating psi_lsc below
        mu-4sigma improves the whole-band statistic from 1.044x to 0.946x (n=43)
        and 0.968x to 0.935x (n=50), while the C>=1000 fit gets WORSE for n=43
        (23.9x -> 24.3x) and is unchanged for n=50 (23.9x -> 23.9x). The entire
        improvement is bought by descending further below the deep-tail floor,
        0.770x -> 0.616x and 0.581x -> 0.525x. A statistic that rewards a change
        which degrades the fit where the measurement is precise is measuring the
        tail. It also means the package itself reports 1.04x and 0.95x for two
        readings of one undetermined choice, which forbids quoting the headline
        to three significant figures.
      cheapest_check: >-
        Already run: the ANOM-7 variant, plus the C>=1000 / C<1000 split of its
        residual at the whole-band fit. The package has the variant; only the
        split was missing.

    - id: O-4
      severity: moderate
      title: >-
        The yardstick is uncalibrated in the region that supplies 99.9 percent of
        it -- every model sits 16 to 42 percent BELOW the deep-tail floor and
        D-1 explains at most a quarter of that
      detail: >-
        On the C<1000 rows every model tested reads 0.581x to 0.837x of the
        floor. D-1 accounts for ~10 percent at most (O-5); the plug-in-lambda
        smoothing test accounts for <=0.44 percent and has the wrong sign
        (validator D-8). The remainder is unexplained and it is precisely the
        region the headline divides by. Two named unclosed candidates, both
        recorded as limitations by the validator and neither quantified anywhere
        in the lane: (i) deep-tail Poisson dispersion -- the validator's
        leverage-corrected phi test covers T in [150,1400] only and it says so;
        (ii) the band-truncation selection effect, since the band ends at the
        last positive score, an event different from the per-row C>=1
        conditioning the floor uses. I attempted (i) twice and NEITHER ATTEMPT
        SETTLES IT, which I record rather than pass off: a local unweighted
        quadratic detrend on 51-row blocks gives phi = 0.68-0.81 (n=43) and
        0.20-0.65 (n=50) but unweighted OLS overfits sparse counts and biases phi
        DOWN; a global log-linear Poisson trend on 16/24/40-row windows gives
        phi = 1.27-1.54 and 1.82-2.72 but a log-linear rate underfits a rate
        falling three orders across the sub-band and biases phi UP. The control
        has still not been run.
      cheapest_check: >-
        A properly constructed deep-tail dispersion test: bin the archived
        increments D_T into windows with expected count >= 10, fit a LOCAL
        (not global) smooth Poisson rate with a leverage correction as the
        validator did for T in [150,1400], and report phi with its own sd. Pure
        archived-bytes computation, minutes of compute.

    - id: O-5
      severity: moderate
      title: >-
        Validator defect D-1 is understated, and its count>=1000 leg has the
        wrong sign
      detail: >-
        I reproduced the validator's section 1.7 computation exactly (n=43 whole
        0.409366 -> 0.377735, factor 0.923; count>=1000 0.014620 -> 0.013266,
        factor 0.907), then substituted the validator's OWN measured leverage
        vector d ln(Pred)/d ln A = 0.031, 0.097, 0.204, 0.755, 0.997, 0.993,
        0.983, 0.963, 0.924, 0.856 at T = 0..1800, which it printed and did not
        use. Result: whole band factor 0.896, not 0.923; count>=1000 factor
        0.709, not "between 0.90 and 1". The validator reasoned that a mean
        sensitivity of 0.42 on that sub-band means the fit absorbs LESS; the
        opposite holds, because a_T and h_T both increase with T there, so the
        profiled parameter is optimally targeted at the high-variance rows.
        Carried through: M2 whole band 1.16x/1.09x rather than 1.13x/1.06x, M2
        count>=1000 33.7x rather than 26.3x, M3 matched-parameter 18.7x rather
        than 14.6x. Every model moves by the same factor so no comparison
        changes, and by O-1 none of it is evidence -- but DEC-20260803-3bba92
        carries the 1.06-1.13x figures forward as measurements. SEPARATE DEFECT
        IN THE SAME CORRECTION: the factor is derived under the delta-method
        covariance and applied to the truncated-Poisson floor, which differs by
        +20 percent on the whole band precisely because of the low-lambda rows
        that dominate the correction. Safe at count>=1000 (0.014620 vs 0.014627);
        unverified on the whole band, which is where it is used.
      cheapest_check: >-
        Re-run the validator's floor_fitted.py with the h vector printed in its
        own section 1.7 in place of h == 1. Run in this session; the h == 1 case
        reproduces the validator's published numbers exactly.

    - id: O-6
      severity: moderate
      title: >-
        A parameter-free misfit of the exact measure that the "surrogate, not
        4.9" sentence conceals
      detail: >-
        At the whole-band fit the exact measure's residual is +0.46669 bits at
        T=270 where the pooled count is 516,917,328 (delta counting sd 6.35e-5
        bits, so ~7350 sigma) and +0.54764 bits at T=405 where the count is
        12,624,958 (sd 4.06e-4 bits, ~1348 sigma). The measured leverage there is
        0.10-0.20, so removing +0.55 bits at T=405 would need d log2 A ~ 2.7
        bits, which would displace every T>=800 row by 2.7 bits: the discrepancy
        is NOT absorbable by the one free parameter. Approximation 4.9's exact
        region measure is measurably wrong on this archive in the best-measured
        part of the band, at a level no floor-protocol argument touches. P-4 and
        P-5 record the aggregate correctly and are strengthened by this; what
        must not stand is EV-MLKEM-553b83 P-2's unqualified "the whole-band
        misfit ... really was a property of the SURROGATE, not of Approximation
        4.9's region measure" and DEC-20260803-3bba92's "It does not [misfit]."
        The honest form: the DEEP-TAIL component of the whole-band misfit was the
        surrogate's; the well-measured component is shared and stands at 23.9x.
      cheapest_check: >-
        results.json -> files[0].results.M2_residual_profile_whole_band_fit,
        entries T=270 and T=405, against the counts in the same entries.

    - id: O-7
      severity: moderate
      title: Scope inflation in the decision text, not in the evidence record
      detail: >-
        DEC-20260803-3bba92 central_adjudication: "For three batches this goal
        reported that Approximation 4.9's family misfits the archived whole-band
        data. It does not." EV-MLKEM-2e668d (BATCH-011) had already struck both
        halves. C-1: "the whole-band excess is only 1.25x and 1.30x the floor,
        which is a weak basis for any misspecification claim. THAT ARGUMENT IS
        STRUCK." C-3: "What BATCH-009 and BATCH-010 fitted is NOT Approximation
        4.9's family. It is BATCH-009's GAUSSIAN-Phi SURROGATE." So the record
        corrected is one already-struck argument plus one already-corrected
        attribution, one batch earlier -- not three batches of standing findings.
        BATCH-012's genuine addition (first instantiation of the object; it beats
        the surrogate at matched parameter count) is real and sufficient on its
        own. EV-MLKEM-553b83's own relation_to_prior_records states the narrow
        version correctly; the decision's headline does not.
      cheapest_check: ledger/evidence/EV-MLKEM-2e668d.yaml, observations C-1 and C-3, verbatim.

    - id: O-8
      severity: low
      title: '"Selects its null value EXACTLY" is a grid statement'
      detail: >-
        The producer's s-grid (step 0.07) does not contain 1.00; the validator's
        (step 0.05) does, with neighbours 0.95 and 1.05. Neither resolves
        "exactly". The three-point parabolas through the producer's own
        whole-band s-curves put the continuous vertex at s* = 0.9975 (n=43,
        curvature 25.9) and 1.0020 (n=50, curvature 39.6), buying 1.6e-4 bits.
        The c-grid for F(A*G*v^c) is not published and its two reported argmins
        (0.0 and -2.0) suggest integer steps. The claim is true in substance and
        over-stated in word: "within one grid cell of its null value, buying
        <= 2e-4 bits" is what is established. A SECOND instance of the same
        grid-resolution issue, this time changing a published number, is in the
        n=50 M3 count>=1000 row -- see budget_blocked_claim_2.
      cheapest_check: >-
        Golden-section on s and on c instead of a grid; report the vertex and the
        curvature. The parabola computation is three lines on the published curve.

    - id: O-9
      severity: none_favourable_to_the_package
      title: >-
        A validator limitation is dischargeable from an archived extract, and it
        removes the sharpest available attack on "the exponent is frozen"
      detail: >-
        validation_report.yaml limitations records that beta_sieve = header
        beta_1 "is an unverified premise underneath every number in the lane".
        It is verifiable and it verifies:
        inputs/MLKEM-DUAL-SOURCES-20260802/extracts/carrier-hal-05406481/page26_fig41.txt
        lines 48 and 50 give "betasieve = 44" (n=43) and "betabkz = 35,
        betasieve = 41" (n=50), matching the headers' beta_1 = 44/41 and
        beta_0 = 35. Had beta_sieve been beta_bkz the frozen exponent would have
        been 20.0/21.5 -- inside the drift range -- and the one-fewer-parameter
        claim would have rested on a data-selected discrete choice. It does not.
        Recorded in the package's favour.
      cheapest_check: grep betasieve in the archived page-26 extract; two lines.

  required_controls:
    - >-
      C1 (the one that matters). A properly constructed deep-tail Poisson
      dispersion test on the archived increments D_T for T beyond the
      count>=1000 boundary, with a LOCAL smooth rate and a leverage correction,
      binned so the expected count per window is >= 10, reported with its own
      sampling sd. This is the single cheapest control that would settle whether
      the counting floor is calibrated in the region that supplies 99.9 percent
      of the whole-band denominator. Until it is run, no absolute reading of the
      whole-band ratio is interpretable in EITHER direction, including one that
      would favour the package.
    - >-
      C2. Quantify the band-truncation selection effect: the band ends at the
      last positive score, which is not the per-row C>=1 event the floor
      conditions on. Compute the floor under the actual selection rule.
    - >-
      C3. Recompute the D-1 profiled floor with the measured leverage vector
      rather than h == 1, on both files and all four bands, and record the
      count>=1000 factor (0.709 for n=43 here) rather than the asserted 0.90-1.
    - >-
      C4. Report the effective degrees of freedom and the implied sampling sd
      alongside EVERY rms/floor ratio this lane publishes from now on. Any ratio
      quoted without it invites the same over-reading again.
    - >-
      C5 (already run here, recorded so it is not re-run). The null-object
      control for the whole-band statistic: four one-parameter monotone families
      with no source content score 4.86x to 56.9x, so the statistic is not
      trivially satisfiable and the fitted normalisation does not rescue an
      arbitrary shape. This objection FAILED and must not be raised again.

  counterexample_or_mutation: >-
    The decisive mutation is ANOM-7 (O-3): truncating psi_lsc below mu-4sigma --
    a choice the source does not fix -- improves the whole-band headline from
    1.044x to 0.946x (n=43) and 0.968x to 0.935x (n=50) while leaving the
    C>=1000 fit unimproved. The second is the surrogate at its own frozen
    exponent (O-2): a model the same statistic rejects at 64.7x on the
    measurable rows scores 0.799x of the floor on the rows that supply 99.9
    percent of the denominator. Together they show the whole-band ratio responds
    to the tail and not to fit quality.

  baseline_comparison: >-
    dominated_by: null with basis "no attack advanced, no cost frontier
    occupied" is CHECKED AND CORRECT. This package occupies no time, memory or
    data/query axis, advances no algorithm, solves no instance and claims no
    security-bit reduction, so there is no frontier row to compare against and
    the null is not a fabrication under AGENTS rule 5. sota_delta zero is
    likewise correct. There is no Pollard-rho, BSGS or specialized-baseline
    comparison to make because no attack is claimed; recorded explicitly rather
    than omitted. No invariance or precomputation eliminates a search dimension
    here, so KN-LIT-7593's "charge the invariant's own cost" test is
    non-applicable. The only cost-like quantity in the package is the counting
    floor, and its correct use is the subject of O-1, O-4 and O-5.

  heuristic_challenges:
    - >-
      This is not an exponent-first heuristic-conditional claim in the
      docs/target-result-profile.md exemplar sense, so the numbered-heuristic
      inventory is non-applicable rather than omitted. The one modelling
      assumption that behaves like an unstated heuristic is the treatment of
      psi_lsc near d_lsc -> 0, which (4.22) leaves as a normal density with no
      physical support there. It is declared (ANOM-7) but its consequence is
      understated; see O-3.
    - >-
      Random-model transfer: the counting floor's Poisson marginal is the
      random model here, and it is validated only for T in [150,1400]
      (phi = 0.92-1.22, leverage-corrected, by the validator). It is UNVALIDATED
      in the deep tail, which carries 99.9 percent of the whole-band floor
      variance. See O-4 and control C1.
    - >-
      Scale honesty: correctly and repeatedly declared. Toy tier, two archived
      files, resolved band ending at ~15 percent of the operating threshold
      (RT-11). AGENTS rule 7 is satisfied by the package, the review and the
      decision. No scale inflation found anywhere.

  cost_model_challenges:
    - >-
      No cost model is advanced, so per-attempt versus total-expected-cost,
      o(1)/polylog overheads, per-entry constants, memory accounting and the van
      Oorschot-Wiener time-memory interpolation are all non-applicable rather
      than omitted. Recorded so their absence is not read as a gap.

  reduction_and_scope_challenges:
    - >-
      No cited reduction is instantiated, so the reduction-hypothesis audit is
      non-applicable. The scope audit finds ONE inflation, O-7, in the decision
      text rather than the evidence record: EV-MLKEM-2e668d C-1 and C-3 had
      already struck the whole-band argument and corrected the attribution one
      batch earlier, so "corrects three batches of this program's own work"
      overstates the record actually corrected.
    - >-
      Affected-versus-safe scope: correctly empty. Every artifact in the chain
      states that nothing here bears on ML-KEM or Kyber security in either
      direction, on Carrier et al.'s cost figures or on Table 5.1, and I found no
      sentence anywhere in the package, the review or the decision that leaks
      past that. AGENTS rule 12 is stated as UNMET and UNWAIVED throughout, and
      EV-MLKEM-011, EV-MLKEM-013, EV-MLKEM-017 keep their status.

  proof_architecture_challenges:
    - check: baseline reproduction
      result: pass
      detail: >-
        The BATCH-009 archived (p, log2 K) point now has FIVE implementations:
        archived 0.705760/0.696721, BATCH-010 0.705494, producer 0.705494/0.696885,
        validator 0.705502/0.696895, this session 0.705491/0.696880. The counting
        floor has four; M2 has three; the region measure has three.
    - check: observation collision
      result: fail_and_this_is_objection_O-2
      detail: >-
        The observable supporting the headline is the whole-band rms/floor ratio.
        I found the collision the audit asks for: on the sub-band supplying 99.9
        percent of that observable's denominator, the exact measure (0.770x) and a
        model the same statistic rejects at 64.7x elsewhere (0.799x) are
        indistinguishable. That is a direct falsifier of identifiability for the
        absolute reading, and no additional condition separates them.
    - check: quantifier order
      result: pass_with_note
      detail: >-
        Per-file, per-band results are reported per-file and per-band; nothing is
        presented as a uniform witness. The one order-sensitive statement is
        "selects its null value EXACTLY", which quantifies over a grid rather
        than over the continuum -- O-8.
    - check: method ceiling and nearby-object control
      result: fail_for_the_absolute_claim
      detail: >-
        The method ceiling of the whole-band statistic is 0.769x (n=43) and
        0.581x (n=50) -- what a model exactly right on every measurable row would
        read -- not 1.00x. The headline is being read against the wrong ceiling.
        The nearby object where the hoped-for conclusion fails is the surrogate
        at its frozen exponent, and on the tail component the method cannot
        distinguish it from the exact measure (O-2).
    - check: strictness witness
      result: pass
      detail: >-
        The improvement claim is witnessed by matched-index-set,
        matched-quadrature, matched-protocol refits in one run, by two
        independent replications, and by the decomposition showing 91-99 percent
        of the matched-parameter improvement lands on rows with negligible
        counting noise. Strictly better, not merely numerically preferred on a
        grid.
    - check: interface preservation
      result: pass
      detail: >-
        Reductions R1 and R2 are identities. I verified them algebraically and by
        construction: d_lat never appears in my implementation and d_lsc appears
        only through d^{-n_fft}. I did not re-derive (4.10)/(4.11) from the PDF in
        this session; that transcription rests on the producer's and the
        validator's independent readings, which agree.

