  - id: H3
    statement: >-
      `estimator.lwe_dual.matzov` is the pinned estimator's implementation of
      MATZOV-2022 Theorem 7.6, and it is what the estimator's public
      `LWE.dual_hybrid` name resolves to. `estimator.lwe_dual.dual_hybrid` is a
      DIFFERENT function - the Espitau-Joux-Kharchenko dual hybrid with the
      Guo-Johansson FFT solver bolted on - and is NOT the estimator's MATZOV
      attack.
    justification: >-
      Checked against the pinned source. estimator/lwe.py:13 reads
      `from .lwe_dual import matzov as dual_hybrid`. estimator/lwe_dual.py:496
      defines `class MATZOV` documented "See [AC:GuoJoh21] and [MATZOV22]" whose
      `cost` docstring is "Theorem 7.6" and which carries k_enum, k_fft, an
      optimised FFT modulus p, T_fftf/T_tablef from MATZOV Thm 7.6 p.38-39, and
      Nf from MATZOV p.29. estimator/lwe_dual.py:742 defines the unrelated
      `dual_hybrid` over `DualHybrid`, whose distinguisher `fft_solver`
      (lwe_dual.py:191) hardcodes the FFT modulus to 2 and cites the
      Independence Heuristic of ia.cr/2023/302.
    falsifier: >-
      The two functions return the same cost at the same parameters. They do not:
      the difference is D1 = 4.13 / 7.42 / 11.48 bits.
    validation_status: checked_against_pinned_source_and_exercised

  - id: H4
    statement: >-
      Supplying Sage's `RealNumber.n(prec)` to estimator/lwe_dual.py:607 by
      rebinding `estimator.lwe_dual.exp` inside this process is faithful to Sage
      and does not change any value the harness control covers.
    justification: >-
      Without it `matzov` raises AttributeError in this harness - the same class
      of gap BATCH-010 defect D4 found for `dual`/`primal_hybrid`. The patch
      rounds to `prec` bits via mpmath.workprec, which is what Sage's `.n(prec)`
      does. It writes nothing; tools/sage_free_estimator is unmodified.
    falsifier: >-
      Any controlled value moves under the patch, OR the result depends on the
      rounding convention.
    validation_status: validated_this_batch
    validated_by: >-
      CTRL-2 (primal_bdd delta 0.0, dual_hybrid delta <= 3.13e-13 under the
      patch); CTRL-4 (replacing 30-bit rounding with full 200-bit precision moves
      the matzov optimum by 0.0 / 1.41e-11 / 0.0 bits).
    cost_to_the_conclusion: >-
      None detectable. But the patched `matzov` path is NOT covered by the
      harness's own archived Sage reference; its Sage cover comes from H5.

