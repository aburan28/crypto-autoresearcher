    falsifier: Any row's split fails to sum to n.
    validation_status: validated_this_batch
    validated_by: CTRL-5, 9 of 9 rows.
    explicitly_unsourced: >-
      The MEANING of Carrier's `k_fft` column is NOT sourced. The offsets
