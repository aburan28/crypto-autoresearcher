  - id: H15
    statement: >-
      The residual against MATZOV-2022 is NOT attributable in this instrument to
      Carrier's polar-code decoder, to Carrier's replacement of enumeration by
      "assume the secret is zero on the enumerated part and iterate", or to
      MATZOV's own optimiser exploring a parameter space the estimator does not.
    justification: >-
      None of these is implemented in lattice-estimator at the pin. Carrier's
      archived abstract states the polar-code substitution and the zero-secret
      iteration as its two departures from MATZOV; the estimator implements
      neither, and `estimator.lwe_dual.MATZOV.Nf` carries the comment
      "p.29, we're ignoring O()".
    falsifier: >-
      An independent implementation of either ingredient reproduces the residual.
    validation_status: UNSIZED_WITH_REASON
    reason_unsized: >-
      The instrument does not implement them and this task authorises no new
      solver. Sizing them requires code that does not exist in this harness.

  - id: H16
    statement: >-
      Carrier's headline is dominated by its sampling term, so comparing the
      estimator's TOTAL rop against Carrier's headline is comparing quantities
      whose dominant terms are the same object (the sieve sampling cost).
    justification: >-
      Archived Table C.2, CC rows: log2(Tsample) 139.51 / 194.81 / 259.35 against
      log2(TFFT) 124.00 / 183.15 / 242.09 and log2(N*Tdec) 117.71 / 157.74 /
      204.17. Summing the three powers of two moves the total by 3.131e-5 /
      4.458e-4 / 9.192e-6 bits, to 139.510031 / 194.810446 / 259.350009 - which
      reproduces the H6 headline 139.5 to 0.0100 bits but sits 0.2896 / 0.3500
      bits below the 195.1 / 259.7 headlines. The estimator's matzov splits the
      same way: at Kyber512,
      red = 139.5466 against guess = 135.8809.
    falsifier: A non-dominant term becomes comparable at some parameter set.
    validation_status: checked_from_archived_bytes_arithmetically

  - id: H17
    statement: >-
      The success-probability and repetition bookkeeping differs between the two
      sides and is NOT sized here.
    justification: >-
      The estimator's MATZOV.Nf hardcodes mu = 0.5 (lwe_dual.py:539) and
      matzov.__call__ applies no outer repetition factor; `repetitions` is not
      even a field of its cost dictionary. `dual_hybrid(fft=True)` reports
      repetitions = 1 on all three sets. Carrier's archived Table C.2 carries
      log2(R) = 9.39 / 9.49 / 15.15 for the CC variant, which is an outer
      iteration count with no counterpart in the estimator's MATZOV path.
    falsifier: >-
      Exposing mu and the repetition count and sweeping them moves the estimator
      cost by an amount comparable to the residual.
    validation_status: UNSIZED_WITH_REASON
    reason_unsized: >-
      mu is a hardcoded literal inside Nf and R has no estimator counterpart;
      sizing either means changing the cost model, which the frozen-model rule
      forbids without an amendment. Recorded as an unsized named difference, as
      the task card requires, rather than absorbed into the residual silently.

  - id: H18
    statement: >-
      The served attack set is narrower than "the dual attack". `arora_gb`,
      `dual` and `primal_hybrid` do not execute in this harness, and `matzov`
      executes only under the H4 patch and only under reduction cost models whose
      `short_vectors` accepts a `sieve_dim` keyword.
    justification: >-
      The harness control prints the first three by name after running them.
      RC.Kyber additionally fails for `matzov` with
      "Kyber.short_vectors() got an unexpected keyword argument 'sieve_dim'",
      recorded in results.json AXIS A rather than dropped.
    falsifier: One of them runs and returns a finite cost.
    validation_status: validated_this_batch
    cost_to_the_conclusion: >-
      No statement in this package may say "best attack". Every comparison is
      scoped to primal_bdd, dual_hybrid(fft=True) and matzov under the named
      reduction cost models.
