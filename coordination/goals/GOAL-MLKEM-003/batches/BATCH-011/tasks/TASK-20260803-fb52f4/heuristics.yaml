    validation_status: validated_this_batch_against_the_primary_claim

  - id: H12
    statement: >-
      Dimensions-for-free is applied by BOTH sides and is therefore not a
      candidate explanation of the gap; it is nonetheless sized so a reader can
      see what it would have been worth.
    justification: >-
      Estimator side: RC.MATZOV inherits Kyber.d4f (reduction.py:753) through
      GJ21 and applies it at reduction.py:903. Published side: MATZOV's archived
      contribution 3 says the BKZ phase "enjoys the so-called dimensions-for-free
      trick [Duc18]" and the final sieve runs "this time without using
      dimensions-for-free ... we use a different block size for this task" -
      which is exactly the estimator's beta / beta_sieve split. Carrier's
      archived Table C.1 prints beta_bkz and beta_sieve as separate columns with
      beta_sieve near beta_bkz, the same structure.
    falsifier: >-
      Turning d4f off changes the estimator's cost by an amount comparable to the
      gap AND the published analyses can be shown not to use it.
    validation_status: validated_this_batch
    validated_by: >-
      AXIS B. Disabling d4f raises the matzov cost by 7.9984 / 10.3055 / 12.9912
      bits (d4f(beta*) = 35.68 / 47.86 / 61.10). Large, and applied on both
      sides, so it cancels.

