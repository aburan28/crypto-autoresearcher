  - id: H9
    statement: >-
      Stages 2, 3 and 4 relax OPTIMISER choices inside the estimator's own
      MATZOV Theorem-7.6 cost function, not the cost model itself; so each stage
      minimises the same objective over a superset and D2, D3, D4 >= 0 by
      construction, each being a LOWER bound on what that axis is worth.
    justification: >-
      Checked against the pinned source. estimator/lwe_dual.py:657-658 searches
      k_enum and k_fft on a STEP-10 grid via early_abort_range(..., 10);
      lwe_dual.py:583-584 fixes the sample count to m = params.n and never
      optimises it; lwe_dual.py:576 exposes beta_sieve but matzov.__call__ never
      passes it. All four stages call the identical MATZOV.cost.
    falsifier: >-
      A stage returns a value ABOVE its predecessor, or the refinement machinery
      fails to reproduce the estimator's own optimum when restricted to the
      estimator's own grid point.
    validation_status: validated_this_batch
    validated_by: >-
      CTRL-7, per parameter set: the refiner restricted to the coarse optimum
      reproduces stage 1 to < 1e-9 on all three sets. This control CAN fail and
      is not an identity. All D2/D3/D4 came out >= 0.
    cost_to_the_conclusion: >-
      The boxes are LOCAL (p in [2,8], k_enum +-8, k_fft +-8, beta +-8; m over
      [0.6n, n] step 2; beta_sieve over auto +-60 step 2). A global re-optimum
      could be lower still, so D2+D3+D4 UNDERSTATES the estimator-side slack and
      the unattributed residual reported against MATZOV-2022 is an UPPER bound.

  - id: H10
    statement: >-
      The decomposition is additive in log2 and STAGE-ORDERED: D1 then D2 then D3
      then D4. The split of bits between D2, D3 and D4 depends on that order.
    justification: >-
      The axes are not independent - the optimal beta moves when m moves - so
      only the TOTAL attributed (S0 - S4) and the first term D1 (which is
      order-independent, being a change of function at each function's own
      optimum) are order-free.
    falsifier: Running the stages in a different order changes D2/D3/D4.
    validation_status: unvalidated_this_batch
    cost_to_the_conclusion: >-
      D2, D3 and D4 individually must be read as "what this axis is worth GIVEN
      the preceding relaxations", not as canonical shares. D1 and the total are
      not affected.

