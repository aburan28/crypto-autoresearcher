  # =====================================================================
  # JOB 2 -- attacking the 0.426-bit misspecification reading
  # =====================================================================

    - id: RT-6
      severity: BLOCKING (as to the argument, not the conclusion)
      target: EV-MLKEM-eac95b observation O-2; VAL-20260803-54b29b control C-3
      title: >-
        THE 0.426-BIT FLOOR IS COMPARED AGAINST THE WRONG NULL. Zero was never
        achievable, and the achievable floor is computable in CLOSED FORM from
        the archived bytes with no simulation and no random numbers.
      detail: >-
        O-2 reasons: the identifiability control reaches rms 0 on noiseless data,
        the best achievable rms on real data is 0.426, therefore the family is
        misspecified. The null that argument needs is not 0. It is the rms a
        PERFECT model would leave against a POOLED COUNTING MEASUREMENT with these
        counts. The archived survival values are integer multiples of a counting
        quantum -- 1/(4000*241^3) = 2^-35.70445 for n=43, 1/(6000*241^3) =
        2^-36.28941 for n=50 -- so every point's count is recoverable, and the
        expected squared log2 residual of a perfect model is a closed-form sum
        over the Poisson law, E[(log2 lambda - log2 C)^2 | C >= 1].
        Recomputed here from the .out files alone:
          n=43 whole band (1803 scores): delta-method floor 0.4094 bits;
               exact truncated-Poisson floor 0.3406 bits; achieved 0.4257.
          n=50 whole band (2310 scores): delta-method floor 0.3347 bits;
               exact truncated-Poisson floor 0.3276 bits; achieved 0.4274.
        Between 62 and 92 percent of the 0.426, in rms, is the instrument. The
        residual misfit is 0.12-0.26 bits (n=43) and 0.27-0.28 bits (n=50), never
        0.426. Why the whole-band statistic is this bad: 62 scores carry pooled
        count exactly 1 and 121 carry count <= 2 (n=43), and those 121 rows carry
        63 percent of the noise-variance budget while representing roughly two
        independent observations. The equal-weight rms hands the unresolved tail
        the fit.
      it_contradicts_the_same_record: >-
        VAL-20260803-54b29b L-2 states "NO SIGNIFICANCE IS ESTABLISHED FOR THE
        CHECK A DISPLACEMENT ... The control that would - resampling the survival
        curve under its counting model - is a simulation and is forbidden by this
        handoff's ZERO NEW SAMPLING constraint." O-2 is nevertheless graded
        ESTABLISHED on a comparison L-2 declares unavailable. AND L-2's PREMISE
        IS WRONG: the control is not a simulation. The expectation has a closed
        form; ZERO NEW SAMPLING never forbade it. The batch declined a control it
        could have run in five lines.
      cheapest_check: C1 (see required_controls) -- the single cheapest check in this report.
      status_after_check: SUSTAINED (computed by me)

    - id: RT-7
      severity: none (this is where the conclusion survives)
      target: EV-MLKEM-eac95b observation O-2
      title: >-
        THE MISSPECIFICATION CONCLUSION SURVIVES, BY A ROUTE BATCH-010 DID NOT
        TAKE. In the well-measured sub-bands the misfit is 16x to 25x the
        counting floor, and owes nothing to the tail or to the number 0.
      detail: >-
        I ran the profiled-K rms-vs-p scan with my own implementation on four
        sub-bands per file. Cross-check: at the archived exponent my whole-band
        rms is 0.70554 (n=43) against the producer's 0.705494, and at the argmin
        my grid gives 0.42914 at p=23.00 against their 0.425715 at p=23.25 -- the
        difference is my coarser v* search, inside the producer's own declared
        ~0.002-bit K resolution. Results:
          n=43 count>=1000  (852 scores, floor 0.0146): best rms 0.2406 at p=19.5   [16x floor]
          n=43 count>=1e5   (551 scores, floor 0.0011): best rms 0.1394 at p=18.0*  [127x floor]
          n=50 count>=1000 (1132 scores, floor 0.0152): best rms 0.3775 at p=20.0   [25x floor]
          n=50 count>=1e5   (636 scores, floor 0.0014): best rms 0.2089 at p=17.0*  [149x floor]
          (* at my grid edge; the argmin location there is scan-width limited, the
           rms value is not.)
        In the region where the measurement is resolved to 0.015 bits, NO member
        of the fitted one-parameter family gets within 0.24 bits. That is misfit,
        unambiguously. The conclusion of O-2 stands; the argument given for it
        does not, and must be replaced.
      cheapest_check: C1b (see required_controls) -- one-line threshold change in the producer's own script.
      status_after_check: CONCLUSION SURVIVES, ARGUMENT REPLACED

    - id: RT-8
      severity: MATERIAL
      target: EV-MLKEM-eac95b observations O-1 and O-2
      title: >-
        AN INVENTOR-PROTOCOL SECTION 3 ARTIFACT TELL THE RECORD DOES NOT REPORT:
        the argmin does not stabilise when the noise that should be destroying it
        is removed. It drifts monotonically.
      detail: >-
        Ask what the reported quantity SHOULD do as the parameter meant to destroy
        it increases. For an exponent estimate from a correctly specified
        one-parameter family, restricting to better-measured data should make the
        argmin CONVERGE. Measured:
          n=43: 23.00 (whole) -> 22.50 (count>=10) -> 19.50 (>=1000) -> 18.00 (>=1e5)
          n=50: 22.00 (whole) -> 21.50 (count>=10) -> 20.00 (>=1000) -> 17.00 (>=1e5)
        Monotone drift over at least 5 units of p as the noise goes to zero. This
        is simultaneously (a) the canonical artifact tell against the NUMBERS
        23.25 and 22.25, and (b) direct positive evidence of misspecification --
        stronger than anything in the record, because a correctly specified family
        cannot produce it.
      required_of_any_downstream_record: >-
        O-1 reports "argmin p=23.25 rms 0.425715" and "argmin p=22.25" to six
        decimals as located points. No record may quote them as "the exponent this
        comparison selects" without stating that the selected value is a function
        of the sub-band and ranges over at least [18.0, 23.25] and [17.0, 22.25].
        The DIRECTION (below the archived exponent, in every sub-band tested) is
        robust and is strengthened, exactly as O-3 says.
      cheapest_check: >-
        exponent_neighbourhood_scan.py line 483,
        `ge10_idx = [i for i in range(len(band)) if counts[i] >= 10]` -- sweep the
        threshold over {1, 10, 100, 1000, 10^4, 10^5} and tabulate argmin and rms
        beside that sub-band's counting floor. One line changed; ~200 s per file.
      status_after_check: SUSTAINED (computed by me)

    - id: RT-9
      severity: BLOCKING (scope)
      target: EV-MLKEM-eac95b observation O-2, the phrase "Approximation 4.9's family"
      title: >-
        THE OBJECT DECLARED MISSPECIFIED IS NOT APPROXIMATION 4.9. It is
        BATCH-009's Gaussian-Phi power-law surrogate, and there is now a NAMED
        MECHANISM for the misfit that lives entirely inside that surrogate.
      detail: >-
        What was fitted is min(1, K v^p). That equals Approximation 4.9's region
        measure EXACTLY iff Phi is exactly Gaussian in (x,y): with
        Phi = exp(-a x^2 - b y^2), lambda ∝ x^{beta_sieve-1}, mu ∝ y^{n_fft-1},
        the region {a x^2 + b y^2 <= v} has lambda-mu measure exactly
        C * v^{(beta_sieve+n_fft)/2}. So the surrogate is right to the extent Phi
        is Gaussian, and the exponent p = (beta_sieve+n_fft)/2 comes from that
        scaling. The source's actual Phi is (4.10):
          Phi_d(i,j) = Upsilon_{beta_sieve/2}((2pi/q) d_lat i)
                     * Upsilon_{n_fft/2 - 1}((2pi/q) d_lsc j),
          Upsilon_n(x) = Gamma(n+1) J_n(x) / (x/2)^n     [(4.11)]
        which AN-2 has now put in the archive. Evaluating (4.11)'s own series
        against exp(-x^2/(4(n+1))):
          lat side, n = beta_sieve/2 = 22: agreement within 0.08 bits out to x=12.
            Harmless.
          lsc side, n = n_fft/2 - 1 = 3: -0.19 bits at x=4, -0.58 at x=5, -2.05 at
            x=6, and Upsilon_3 CHANGES SIGN at x ~ 6.38 (first zero of J_3). The
            Gaussian surrogate is positive and monotone; Upsilon_3 is neither.
        With (2pi/q)*d_lsc = 0.624 per unit j, x = 6.38 is j ~ 10, inside the
        range the region integral covers. So E(T-t) is not an ellipsoid, its
        lambda-mu measure is not a pure power of v, and its LOCAL LOG-LOG SLOPE IS
        v-DEPENDENT -- which is precisely the drift RT-8 measures. The misfit has
        a mechanism, and the mechanism is the surrogate, not Approximation 4.9.
        Note the degradation is worst exactly on the side that contributes n_fft/2
        = 4 of the exponent, because n_fft = 8 is small.
      consequence: >-
        O-2's "Approximation 4.9's family is misspecified" over-attributes.
        Supported: "the Gaussian-Phi power-law surrogate that BATCH-009
        substituted for Approximation 4.9 is misspecified, with a named
        mechanism." Whether Approximation 4.9 itself is misspecified is UNTESTED
        by this program.
      cheapest_check: C3 (see required_controls).
      status_after_check: SUSTAINED (computed by me)

    - id: RT-10
      severity: MATERIAL (removes BATCH-010's own stated blocker)
      target: EV-MLKEM-eac95b O-6; VAL-20260803-54b29b L-3; report.md section 2
      title: >-
        ALPHA FOR THE TOY RUNS IS IDENTIFIABLE FROM THE ARCHIVE, TO 0.5 PERCENT,
        and the check that identifies it is also the only unfitted absolute-level
        control the archive permits.
      detail: >-
        BATCH-010 records alpha as UNAVAILABLE, therefore Check B's magnitude "is
        a scanned bound and not a number", and explicitly declines to adopt the
        Pgood header's alpha_secret = alpha_error = 2 as the paper's alpha. That
        caution is falsifiable from the archive. (4.19) is a PARAMETER-FREE
        prediction of the threshold at which Pgood ~ 1/2 (4.20), and
        Pgood_q241_m40_n43_...out is 4000 raw values of F(solution) -- whose
        median IS that threshold. Computed here:
          archived median F(solution)                          = 11964.5
          (4.19) at alpha=2, d_lat = 42.00 (Fig 4.1 caption)    = 12021.9   ratio 1.0048
          (4.19) at alpha=2, d_lat = 41.072 (.out header)       = 12326.7   ratio 1.0303
          (4.19) at alpha=1                                     = 17661.7   ratio 1.4762
          (4.19) at alpha=3                                     =  8190.4   ratio 0.6846
          best-fit alpha from the archived median               = 2.012 (caption d_lat)
        The identification is not marginal: neighbouring integers are off by 48
        and 32 percent. alpha = 2 for the n=43 toy run, established by the paper's
        own Approximation 4.8 against the archive rather than by trusting a header
        field.
      it_cuts_against_my_own_case_and_i_record_that: >-
        This also CLOSES a candidate artifact I was hunting. A T-axis scale error
        (a k_fft = 3 slip would be a factor of 3) would show as a 3x ratio or an
        alpha off by ~9. The observed ratio is 1.005 with an unfitted formula. So
        "the 0.426 floor is a score-scale artifact" is dead, independently of the
        validator's C-1.
      direction_of_effect_on_the_record: >-
        It STRENGTHENS O-6's conclusion rather than weakening it. O-6 already
        computed the Jensen correction at a*mu^2 = 0.194761, which is the alpha=2
        value; what it lacked was the licence to call alpha=2 the paper's alpha.
        With that licence, "0.31 percent and 0.27 percent of the over-predictions"
        stops being a scanned bound and becomes a number at an identified alpha.
        The BATCH-009 over-prediction remains unattributed, and now more firmly.
      cheapest_check: C2 (see required_controls).
      status_after_check: SUSTAINED (computed by me)

    - id: RT-11
      severity: MATERIAL (scope, unstated in the record's boundaries)
      target: EV-MLKEM-eac95b boundaries; observation O-4
      title: >-
        THE ENTIRE COMPARISON LIVES AT ROUGHLY 15 PERCENT OF THE OPERATING
        THRESHOLD. O-4's tail region is not the region that matters -- and neither
        is any other part of the resolved band.
      detail: >-
        The record's boundaries name the resolved band (scores 0..1802 for n=43)
        but never say where that band sits relative to the threshold the attack
        actually uses. From the source, PDF page 27 / printed 26: "we constrain
        the parameters N and T such that epsilon := R Pwrong q^kfft ... we select
        T following Approximation 4.8, ensuring that Pgood ~ 1/2." The operating
        threshold is therefore the median good-guess score, which the archive
        carries directly: median of the 4000 F(solution) values = 11964.5. The
        Pwrong measurement's last positive score is 1802. THE OPERATING THRESHOLD
        IS A FACTOR 6.6 BEYOND THE LAST SCORE AT WHICH Pwrong WAS MEASURED AT ALL;
        at the operating point Pwrong sits below the counting floor 2^-35.70 and
        is simply not in the archive. The BATCH-009 headline over-prediction at
        T=471 sits at 3.9 percent of the operating threshold.
        This is a limitation of the SOURCE's own validation as much as of this
        program's -- Carrier et al. can only measure where 4000 iterations reach
        -- and it must be on the record either way, because it bounds what any
        shape agreement or disagreement in this band can mean.
      on_O_4_specifically: >-
        BATCH-010's characterisation of T>1000 as the least informative region is
        CORRECT, and correct for a second reason it does not give.
        (a) Statistically: the truncated-Poisson noise floor on T>1000 is 0.510
        bits (n=43) against the validator's reported residual rms of 0.266. A fit
        that beats its own noise floor by a factor of two on 802 rows is not a
        fit -- the region contains O(10) independent observations spread over 802
        rows (62 rows carry pooled count exactly 1, i.e. ONE datum: the single
        largest wrong-guess score in 5.6e10 candidate scores; 59 carry count 2).
        Recording "the own exponent IS the argmin there, excess +0.000935" to six
        decimals gives it far more standing than it has.
        (b) Operationally: it is not the security-relevant region either. Nothing
        in the resolved band is.
        So O-4 is honestly recorded and should stay recorded, but it is not "the
        region that matters" -- there is no region in this archive that matters in
        that sense, and the record should say so.
      cheapest_check: >-
        One line: statistics.median of the 4000 values in
        experiments/EXP-MLKEM-011/vendor-lock/data/Pgood_q241_m40_n43_....out,
        compared with the last positive index of the matching Pwrong file (1802).
      status_after_check: SUSTAINED (computed by me)

    - id: RT-12
      severity: none (candidate artifacts TESTED AND DISMISSED)
      target: the handoff's candidate list
      title: >-
        Four of the five artifact sources the handoff named do NOT explain the
        floor. Recorded so they are not re-tried.
      detail: >-
        QUADRATURE -- dismissed. The producer's coarse-vs-fine max |delta log2| is
        2.8e-14 bits and its K -> infinity closed-form self-check is exact to
        2.6e-15; the validator reproduced everything at GL 8/12/16 and 3x panel
        density; my own order-10, different-panel implementation reproduces the
        whole-band rms at p=26 to 5e-5 bits. Quadrature is not in play at the
        0.4-bit scale by eleven orders of magnitude.
        FITTED-NORMALISATION PROTOCOL -- dismissed as the cause of the FLOOR.
        Profiling one parameter cannot create a floor, and the validator's C-3
        shows the identical protocol reaches rms exactly 0 on noiseless model
        data. It remains the reason nothing about absolute LEVEL is tested (L-1),
        and it is why RT-9's mechanism can hide inside K.
        COUNTING-MODEL OVERDISPERSION -- dismissed where testable. If the
        5.6e10 pooled candidate scores were strongly correlated within an
        iteration, the Poisson floor of RT-6 would be an underestimate. Tested
        directly on the archived histogram increments (cumulative differences,
        i.e. pooled scores exactly equal to T) with a local log-quadratic fit:
        Pearson-residual variance 0.79 (n=43) and 0.94 (n=50) at window 15, which
        after correcting for the ~20 percent absorbed by the 3-parameter local fit
        is ~1.0-1.2. Poisson is approximately the right marginal noise model in
        mid-band. UNTESTED where increments < 30, i.e. the deep tail.
        SCORE-AXIS SCALE ERROR -- dismissed twice, by the validator's C-1 and
        independently by RT-10.
        RESOLVED-BAND CHOICE -- NOT dismissed; it is subsumed into RT-6. Ending
        the band at the last positive score also introduces a selection bias
        (rows whose true expectation is below one count enter the band only when
        they fluctuate upward), which no member of any family can fit.
      status_after_check: DISMISSED (four), SUBSUMED (one)

    - id: RT-13
      severity: moderate
      target: EV-MLKEM-eac95b observation O-6, "the magnitude is a scanned bound and not a number"
      title: >-
        Applying the closure standard to the record's own negative: "UNATTRIBUTED"
        is currently a fatigue report, because both blockers it names are in the
        archive.
      detail: >-
        docs/inventor-protocol.md section 4: a closure needs a named obstruction,
        an argument, and forward guidance. O-6 closes the attribution question by
        naming two blockers -- "Phi_dlsc and alpha are UNAVAILABLE in the archive"
        -- and both are now false (AN-2 for Phi, RT-10 for alpha). What remains is
        "we scanned two readings and neither absorbed the effect", which is a
        statement about the search, not about the problem. Its honest status is
        unverified until it is either re-derived with (4.10)/(4.11) and alpha=2 in
        hand, or restated with a real obstruction.
      forward_guidance: >-
        RT-9's Upsilon_3 sign change is a candidate obstruction and a candidate
        explanation of the over-prediction at the same time: a region measure that
        is not a pure power of v mis-states the level as well as the shape, and it
        does so on the lsc side where n_fft = 8 makes the Gaussian surrogate worst.
        Test that before "unattributed" is recorded again. C3 does it.
      status_after_check: SUSTAINED

  required_controls:

    - id: C1
      name: >-
        THE CHEAPEST CHECK THAT SETTLES THE 0.426-BIT FLOOR QUESTION -- the
        closed-form counting-noise floor of the whole-band equal-weight rms.
      why_it_is_cheapest: >-
        No model, no quadrature, no exponent scan, no random numbers, no
        simulation. It reads one .out file and evaluates a Poisson sum. Roughly
        five lines and under a second per file. It is strictly cheaper than every
        other check in this report and it answers the question directly.
      method: >-
        For each archived Pwrong file: recover the pooled count of every score as
        C_T = value_T * nb_iteration * q^{k_fft} (the header carries
        nb_iteration and k_fft; the values are exact integer multiples of the
        quantum, max relative deviation 2.2e-16, already verified in M-05).
        Then report
          floor_rms = sqrt( mean_T E[(log2 lambda - log2 C)^2 | C >= 1] )
        under C ~ Poisson(lambda), evaluated at lambda = C_T. Report the
        delta-method value 1/(C ln^2 2) beside it as the cruder bound.
      result_already_obtained_here:
        n43_whole_band: {scores: 1803, delta_method: 0.4094, truncated_poisson: 0.3406, achieved: 0.4257}
        n50_whole_band: {scores: 2310, delta_method: 0.3347, truncated_poisson: 0.3276, achieved: 0.4274}
        n43_count_ge_10: {scores: 1493, delta_method: 0.1542}
        n43_count_ge_1000: {scores: 852, delta_method: 0.0146}
        n50_count_ge_1000: {scores: 1132, delta_method: 0.0152}
      verdict_it_delivers: >-
        The 0.426 figure is dominated by the counting instrument. "0.426 rather
        than 0" is not evidence of anything, because 0 was never achievable.

    - id: C1b
      name: the sub-band rms table, which replaces the argument C1 destroys
      method: >-
        exponent_neighbourhood_scan.py line 483: sweep the count threshold over
        {1, 10, 100, 1000, 1e4, 1e5}; at each, profile K on that index set and
        report argmin, achieved rms, and the C1 floor for that index set.
      result_already_obtained_here: >-
        n=43 count>=1000: best rms 0.2406 vs floor 0.0146 (16x). n=50 count>=1000:
        0.3775 vs 0.0152 (25x). Misfit is real in the resolved region. Argmin
        drifts 23.0 -> 18.0 and 22.0 -> 17.0 as noise is removed (RT-8).
      cost: one line changed; ~200 s per file, unchanged from the producer's run.

    - id: C2
      name: >-
        the unfitted absolute-level control -- (4.19) against the archived Pgood
        median -- which also identifies alpha
      method: >-
        Evaluate (4.19)'s T/N = exp(-a mu^2/(1+2 a sigma^2))/sqrt(1+2 a sigma^2)
        * INT_0^1 beta_sieve t^{beta_sieve-1} exp(-a d_lat^2 t^2) dt with
        a = alpha pi^2 / q^2, and compare alpha*N with the median of the 4000
        F(solution) values in the archived Pgood file.
      result_already_obtained_here: >-
        median 11964.5; (4.19) at alpha=2 with caption d_lat=42.00 gives 12021.9,
        ratio 1.0048; best-fit alpha 2.012. alpha=1 -> 1.476, alpha=3 -> 0.685.
      why_it_matters: >-
        It is the ONLY place in this archive where a Carrier approximation is
        tested with no fitted normalisation, and it passes at 0.5 percent. It
        licenses alpha=2, kills the score-scale artifact hypothesis, and unblocks
        BATCH-010's L-3.

    - id: C3
      name: >-
        THE DECISIVE FOLLOW-ON, NOT YET RUN -- replace K v^p by the exact region
        measure from (4.10)/(4.11)/(4.24) and refit.
      method: >-
        Compute W(v) = INT_{E(v)} lambda(x) mu(y) d(x,y) with
        E(v) = {(x,y) in R2+ : Phi_{d_lsc}(x,y) >= e^{-v}} and Phi from (4.10),
        Upsilon from (4.11)'s series, lambda and mu from (4.24), alpha = 2 (C2),
        d_lat and d_lsc from the .out headers, d_lsc integrated against psi_lsc
        in the (4.22) position (outside min). Refit with the SAME profiled-K
        protocol and report the count>=1000 rms beside its 0.015-bit floor.
      why_it_is_cheap: >-
        In fit_one_p the quadrature never touches the measured values -- the
        accumulator J depends only on (p, N, band), and log2meas enters only in
        the residual line. So the region-measure table is computed once and reused
        across every K, every fit set, and every replicate.
      both_outcomes_are_informative: >-
        If the count>=1000 misfit collapses from 0.24/0.38 bits toward 0.015, the
        misspecification is BATCH-009's Gaussian-Phi surrogate and Approximation
        4.9 is exonerated at toy scale in the resolved band. If it does not, the
        misspecification is Approximation 4.9's, and it is then a real,
        mechanism-backed finding rather than an artifact of a substitution.

    - id: C4
      name: a genuine null object of the same shape (the one control still missing)
      method: >-
        Refit the identical scan against a structureless survival curve carrying
        the same instrument: the pure Gaussian Q(T) = 0.5 erfc(T/sqrt(N)) alone,
        rounded to the same counting quantum and truncated at its last positive
        score. Report whether the scan returns a located argmin and what rms it
        achieves.
      why: >-
        docs/inventor-protocol.md section 3 and the validator's own C-6, which
        recorded this control as "absent_and_not_possible_here" on the ground that
        a structureless archived Pwrong curve does not exist. It does not need to
        exist: a null object of the same SHAPE can be constructed deterministically
        from Q(T) and the archived counting quantum. C-6's "not possible" should
        be superseded.

  counterexample_or_mutation: >-
    The mutation that most cheaply exposes the deviation is RT-9's: hold the
    tracked quantity (the region measure as a function of v) fixed in ROLE and
    vary it in FORM, from the Gaussian-Phi power K v^p to the exact
    Upsilon-based measure. The two agree to leading order and diverge by more
    than half a bit once (2pi/q) d_lsc j exceeds about 5, with Upsilon_{3}
    changing sign at 6.38 where the surrogate is positive and monotone. A model
    whose region is an ellipsoid and one whose region is not cannot share an
    exponent, and the observed sub-band drift of the argmin is exactly the
    signature of forcing a pure power onto a function whose local log-log slope
    varies. This is the cheapest object that sits on the other side of the
    conclusion while producing the same observable at leading order.

  baseline_comparison: >-
    NOT APPLICABLE IN THE POLLARD-RHO / BSGS SENSE, and recorded explicitly
    rather than left blank. This lane advances no attack, claims no time, memory,
    data or query cost, and occupies no point on any frontier. The relevant
    comparators for the OBJECT under review are the published Approximation 4.9
    of Carrier et al. and the MATZOV estimate it is compared against in Table
    5.1, and nothing in this batch touches either: no cost figure of theirs is
    reproduced, revised, confirmed or disputed. dominated_by is "n/a (no result
    claimed)" and sota_delta is zero, per docs/inventor-protocol.md section 5.

  heuristic_challenges:
    - >-
      The exponent p = (beta_sieve + n_fft)/2 is not a free heuristic: it is
      DERIVED, and its derivation is exactly the Gaussian-ellipsoid scaling of
      RT-9. Any record treating it as an assumption to be tested against data,
      rather than as a consequence of an approximation whose validity is
      separately checkable at (4.10)/(4.11), mislocates the thing under test.
      That is what makes C3 the right next experiment and the fitted-exponent
      scan the wrong one.
    - >-
      The archived Pwrong curve is not an i.i.d. sample of anything: each of its
      points pools nb_iteration * q^{k_fft} candidate scores drawn under
      per-iteration values of d_lat, d_lsc and N that the headers report as
      varying (sdv_dlat 1.13, sdv_dlsc 3.38 for n=43). Every rms in this lane
      treats those points as equally informative. RT-6 quantifies what that
      costs; RT-12 shows the marginal Poisson model survives testing in mid-band
      but is untested in the deep tail.
    - >-
      No heuristic in this lane is validated at cryptographic scale and none is
      claimed to be. q=241, m=40, n=43/50, beta_sieve 41/44 against Kyber's beta
      of roughly 384-816. AGENTS.md rule 7 holds; nothing here may be cited as
      bearing on ML-KEM in either direction.

  cost_model_challenges:
    - >-
      No cost model, operation count, memory figure or security estimate appears
      in the reviewed package or in EV-MLKEM-eac95b, and none is asserted here.
      There is no per-attempt-cost x inverse-success-probability bookkeeping to
      audit. Recorded explicitly.
    - >-
      One cost statement IS load-bearing and is recorded in the record's favour:
      C3 is cheap because the model quadrature is data-independent
      (exponent_neighbourhood_scan.py, `accumulate` and `predict_from_J` never
      read log2meas). A successor handoff that budgets C3 as if each refit
      required a fresh quadrature will over-budget it by orders of magnitude.

  reduction_and_scope_challenges:
    - >-
      SCOPE INFLATION, the central one: EV-MLKEM-eac95b O-2 names
      "Approximation 4.9's family". What was fitted is BATCH-009's
      min(1, K v^p). These are the same object only under a Gaussian Phi that
      (4.10) and (4.11) do not provide. See RT-9.
    - >-
      SCOPE OMISSION: the record's boundaries state the resolved band but not
      that the band ends at 15 percent of the operating threshold (RT-11). A
      reader cannot recover that from the record and it bounds every claim in it.
    - >-
      SCOPE NARROWING REQUIRED on O-7: the (4.18) reading does not transfer the
      defect from the BATCH-009 implementation to the source. See RT-3.
    - >-
      Correctly scoped and left alone: the toy-tier statement, the "not a claim
      about Carrier et al.'s Kyber figures or Table 5.1" boundary, and the rule-12
      status. EV-MLKEM-011, EV-MLKEM-013 and EV-MLKEM-017 keep their status;
      nothing in this report touches them, and KN-FIND-031 stays withdrawn.

  proof_architecture_challenges:
    - >-
      BASELINE REPRODUCTION: passes. The package reproduces the BATCH-009
      headline rms and peak delta at the archived (p, K_fit) to 0.00066 bits and
      attributes the difference to the declared clip treatment. I reproduce the
      whole-band rms at p=26 to 5e-5 bits with an independent implementation.
    - >-
      OBSERVATION COLLISION: FOUND, and it is RT-9. The observable is the rms of
      the profiled log2 residual. Two distinct ground-truth objects -- a Gaussian
      Phi and the source's Bessel Phi -- produce the same observable to leading
      order and sit on opposite sides of the conclusion "Approximation 4.9 is
      misspecified". No additional condition in the reviewed package separates
      them. C3 is the separator.
    - >-
      METHOD CEILING: the fitted-exponent scan cannot, under ideal tuning,
      distinguish "the exponent is wrong" from "the region is not an ellipsoid",
      because both appear as a non-power W(v) and both are absorbed identically by
      the single free K at any one v. This ceiling is below the headline O-2
      makes, and it was reachable before any compute was spent.
    - >-
      NEARBY-OBJECT CONTROL: the validator's C-2 cross-exponent control is the
      right shape and is one-sided (n=43 data fits better at the n=50 exponent,
      not conversely). RT-8's sub-band drift is the stronger nearby-object result
      and was not run.

  narrowest_supported_statement: >-
    Over the two archived q=241, m=40, n=43/50 Carrier et al. Pwrong files, in
    the sub-band where the pooled counting estimate is resolved to better than
    0.02 bits (pooled count >= 1000; scores 0-851 for n=43, 0-1131 for n=50), the
    one-free-normalisation family min(1, K v^p) -- which is BATCH-009's
    Gaussian-Phi power-law SURROGATE for Approximation 4.9, not Approximation 4.9
    itself -- leaves a best achievable rms log2 residual of 0.241 and 0.377 bits
    against a counting-noise floor of 0.0146 and 0.0152 bits. No member of that
    surrogate family fits. The exponent minimising the residual is not the
    archived (beta_sieve + n_fft)/2 in either file and lies below it in every
    sub-band tested, but its VALUE is not identified: it drifts monotonically
    over at least [18.0, 23.25] (n=43) and [17.0, 22.25] (n=50) as the
    measurement noise is removed. A named mechanism for the misfit exists and
    lies in the surrogate: (4.11)'s Upsilon_{n_fft/2-1} with n_fft = 8 departs
    from its Gaussian surrogate by more than 0.5 bits at (2pi/q) d_lsc j ~ 5 and
    changes sign at ~6.38, so E(T-t) is not an ellipsoid and its lambda-mu
    measure is not a pure power of v. Whether APPROXIMATION 4.9 is misspecified is
    UNTESTED. Separately, alpha = 2 for the n=43 toy run is established from the
    archive by (4.19) against the archived good-guess median (ratio 1.0048), and
    the resolved band ends at roughly 15 percent of the operating threshold
    (median F(solution) = 11964.5 against last measured score 1802). Toy tier.
    Nothing here bears on ML-KEM security in either direction.

  does_the_misspecification_reading_survive: >-
    YES, IN NARROWED FORM -- AND ITS STATED ARGUMENT DOES NOT.
    SURVIVES: there is genuine, large, unfittable misfit. In the count>=1000
    sub-band the best achievable rms is 16x and 25x the counting floor, and the
    argmin fails to stabilise as noise is removed. Both are stronger evidence of
    misspecification than anything in EV-MLKEM-eac95b, and neither depends on the
    unresolved tail or on the number 0.
    DOES NOT SURVIVE, and must be struck: (i) the argument "the best achievable
    rms is 0.426 bits, not 0". Zero was never achievable; the closed-form
    counting floor is 0.409/0.341 bits (n=43) and 0.335/0.328 (n=50), so most of
    the 0.426 is the instrument, and the validator's own L-2 says no significance
    is established. (ii) the ATTRIBUTION to "Approximation 4.9's family". What is
    shown misspecified is BATCH-009's Gaussian-Phi surrogate, and there is now a
    named mechanism for why, located in the surrogate.
    WHAT O-2 IS ENTITLED TO CLAIM after this pass is the narrowest_supported_
    statement above -- no more, and no less.

  cheapest_check_that_settles_the_0426_question: >-
    C1. Recover the pooled count of every score from the archived .out file
    (value * nb_iteration * q^{k_fft}; the values are exact integer multiples of
    that quantum) and evaluate the closed-form expectation
    sqrt( mean_T E[(log2 lambda - log2 C)^2 | C >= 1] ) under C ~ Poisson(C_T).
    No model, no quadrature, no exponent scan, no random numbers, under a second
    per file. It returns 0.3406 bits (n=43) and 0.3276 bits (n=50) against
    achieved 0.4257 and 0.4274, and thereby settles the question: the 0.426 floor
    is dominated by the counting instrument, and the misspecification case must
    be made in the count>=1000 sub-band instead (C1b), where it succeeds.

  verdict: blocking_objections
  verdict_scope: >-
    BLOCKING ON THE RECORD'S STATED REASONING AND SCOPE, NOT ON ITS CONCLUSION.
    EV-MLKEM-eac95b observation O-2 may not be promoted as written: its argument
    compares against a null the instrument makes unreachable (RT-6), it
    attributes the misfit to the wrong object (RT-9), and it omits an artifact
    tell that re-scopes O-1's numbers (RT-8). The underlying conclusion --
    misspecification -- survives and is in fact better supported than the record
    claims, by the route in RT-7. Also blocking as scope: RT-11 (the band ends at
    ~15 percent of the operating threshold) must be added to boundaries, and
    RT-3 requires O-7 to be narrowed. The D7 source-reading package is sound in
    its loci and its arithmetic and is admissible with the two minor quotation and
    provenance defects RT-1 and RT-2, and with the framing narrowed per RT-3.
    THIS REPORT AUTHORIZES NO PROMOTION AND NO STATUS CHANGE. AGENTS.md rule 12
    is UNMET and UNWAIVED; EV-MLKEM-011, EV-MLKEM-013 and EV-MLKEM-017 keep their
    status; KN-FIND-031 stays withdrawn.

  next_concrete_action: >-
    Run C3: recompute the region measure W(v) exactly from (4.10), (4.11) and
    (4.24) at alpha = 2 with the .out-header d_lat and d_lsc, keep the (4.22)
    position for the d_lsc integral, refit with the same profiled-K protocol, and
    report the count>=1000 rms beside its 0.0146 / 0.0152-bit counting floor. It
    is the separator for the observation collision in RT-9, it is cheap because
    the quadrature is data-independent, and both outcomes are informative: a
    collapse of the misfit exonerates Approximation 4.9 at toy scale in the
    resolved band, and a persistence of it converts the misspecification reading
    from an unattributed residual into a mechanism-backed finding. Run C1 and C2
    alongside it as reported controls; they are already computed here and cost
    seconds. Do NOT run a wider exponent scan before C3 -- RT-8 shows the argmin
    is not a property of the data.

