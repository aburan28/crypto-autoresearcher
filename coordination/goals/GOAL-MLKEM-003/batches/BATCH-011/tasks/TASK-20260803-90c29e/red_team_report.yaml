  # =====================================================================
  # JOB 1 -- the D7 source reading
  # =====================================================================
  objections:

    - id: RT-1
      severity: minor
      target: TASK-20260803-a7861e/d7_source_reading.md, quotation self-check
      title: >-
        The quotation self-check covers 14 of 17 numbered blocks, and one of the
        three uncovered blocks is not verbatim.
      detail: >-
        Section 0 states "All 14 line-numbered blocks below were checked back
        against the extracted page text programmatically ... 14/14 match" and
        "No character has been added, removed, or reordered inside a quoted
        block." There are SEVENTEEN numbered blocks. The three the self-check
        does not reach are the list-indented blocks in section 6 (PDF page 13
        plain 33-36, page 24 plain 1-6, page 36 layout 10-15) -- they use a
        different in-block prefix format and fall outside the pattern the
        self-check matched. I re-extracted the PDF and compared all seventeen.
        Sixteen are byte-exact. ONE IS NOT: page 24 plain line 6 is quoted as
        "follow a chi-distribution11 with degrees of freedom beta_sieve and
        n_fft, respectively." while the extractor's line 6 is
        "follow a chi-distribution11 with degrees of freedom beta_sieve and
        n_fft, respectively. Therefore, we obtain" -- the trailing " Therefore,
        we obtain" is silently dropped from a block declared "verbatim".
      impact: >-
        None on the D7 conclusion. The truncated clause is prose continuation and
        the block's role is to support the alpha identification. But it falsifies
        the package's own no-character-removed statement, and the failure lands
        in exactly the set the self-check did not cover -- the coverage claim was
        itself unchecked.
      cheapest_check: >-
        Parse every fenced block of d7_source_reading.md that carries "NN|" rows
        (handling both the "NN| text" and "NN|text" prefix forms), re-extract the
        declared page with pypdf 6.14.2 in the declared mode, apply the same C0
        escaping, and compare line by line. 17 blocks; 1 mismatch, at page 24
        plain line 6.
      status_after_check: SUSTAINED (verified by me)

    - id: RT-2
      severity: minor
      target: TASK-20260803-a7861e/d7_source_reading.md section 0, provenance table
      title: The page-13 quotation cannot have come from the single declared command.
      detail: >-
        The provenance table declares exactly one command,
        `extract_pages.py --outdir <scratch>`, with no `--pages`. With no
        `--pages` the script emits only PAGES_OF_INTEREST = {9, 20, 23, 24, 25,
