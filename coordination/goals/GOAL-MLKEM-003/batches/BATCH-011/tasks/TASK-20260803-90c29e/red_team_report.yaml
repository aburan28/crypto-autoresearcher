      status_after_check: SUSTAINED (verified by me)

    - id: RT-3
      severity: MATERIAL
      target: >-
        d7_source_reading.md section 3(b); the snapshot commit message
        ("THE SOURCE DOES CONTRADICT ITSELF"); EV-MLKEM-eac95b O-7
      title: >-
        The quoted loci are exactly what they are claimed to be, and the literal
        inconsistency is real -- but a dissolving reading exists, was not weighed,
        and under EITHER reading O-7's suggested defence of the BATCH-009 collapse
        fails. The framing must be narrowed, not confirmed.
      what_i_verified: >-
        Every locus is where the package says it is, byte-exact against my own
        re-extraction: (4.18) at PDF page 23 plain lines 22-43 / layout 11-18,
        with the d_lsc integral outside the max and no min(1,.); (4.22) at page
        23 plain 85-127 / layout 35-46, with min(1,.) closing before the Gaussian
        factor and dd_lsc dt outermost; (4.27)/(4.28)/(4.29) and the closing
        display at page 25. I independently reproduce the document-wide scan:
        standalone `min` occurs at exactly (page 23, line 103) and (page 25, line
        8); Phi occurs on exactly pages 20 (x2), 23 (x3), 24 (x1), 25 (x1). The
        package's arithmetic-of-loci is correct.
      the_reading_not_weighed: >-
        (4.18) is templated on (4.17), whose bracket is a SUM. For a linear
        bracket, "integrate d_lsc out inside the definition" and "let d_lsc be a
        mixing variable" agree in expectation, so the notation
        `INT psi_lsc(d)[...]dd` is harmless there and is a standard abuse for
        "the mixture induced by d ~ psi_lsc". Carrying that same template to
        (4.18) with a max in the bracket yields D | d_lsc = N max_{i,j} Phi_d(i,j)
        with d_lsc ~ psi_lsc -- which is EXACTLY what (4.27), (4.29) and the
        closing display require. Under that reading there is no mathematical
        inconsistency at all, only a notational one. The package's section 3(c)
        correctly declines to say which order the authors intended, but section
        3(b)'s "This is a disagreement internal to the source" and the commit
        message's "THE SOURCE DOES CONTRADICT ITSELF" assert more than the quotes
        carry.
      the_count_that_should_be_on_the_record: >-
        FIVE operative displays place the threshold outside the d_lsc integral --
        (4.22) (dd_lsc outermost), (4.23) (E(T-t) defined via Phi_{d_lsc}, i.e. at
        a fixed d_lsc), (4.27) (P(D>T | d_lsc)), (4.29) (E(T) defined via
        Phi_{d_lsc}), and the closing display P(D>T) = INT psi(d) P(D>T|d) dd.
        ONE display, the definition (4.18), reads the other way as typeset, and
        the paper never uses it again. Any downstream record that says "the source
        contradicts itself" without stating 5-to-1, and without stating that only
        one of the two readings leaves (4.23) and (4.29) well-formed, misleads.
      consequence_for_O_7: >-
        EV-MLKEM-eac95b O-7 says the (4.18) reading "changes the question: the
        collapse may be a defect of the SOURCE rather than of the BATCH-009
        implementation." That does not survive. Under the mixture reading (4.18)
        gives the BATCH-009 collapse NO textual support. Under the literal
        reading it supports the collapse only for a definition of D that the
        paper abandons immediately. O-7 must be NARROWED to: "(4.18) as typeset
        is inconsistent with the four displays that follow it; on the operative
        chain the source is unanimous that min(1,.) sits inside the d_lsc
        integral, so BATCH-009's collapse is not licensed by the source."
      cheapest_check: >-
        Confirm the subscript d_lsc survives on Phi in BOTH region definitions --
        page 23 plain line 125 ("+ : N . Phi_dlsc (x, y) >= T - t", eq 4.23) and
        page 25 layout line 18 ("E(T) := {(i,j) in R2+ : N.Phi_dlsc(i,j) >= T}",
        eq 4.29). Both are quoted in the package and both re-verified here. If
        d_lsc is still a free variable in the region definitions, the operative
        chain is conditional and (4.18) is the outlier.
      status_after_check: SUSTAINED (narrowing, not refuting, the package)

