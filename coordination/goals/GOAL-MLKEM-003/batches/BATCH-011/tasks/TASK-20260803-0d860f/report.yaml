        the over-shoot into negative territory reported rather than trimmed.
        (c) THE MISSING NULL is for the reproduction claim: "the pinned
        estimator reproduces Carrier's published headline" has no measured
        false-positive rate. Nobody ran the identical S1->S4 machinery against a
