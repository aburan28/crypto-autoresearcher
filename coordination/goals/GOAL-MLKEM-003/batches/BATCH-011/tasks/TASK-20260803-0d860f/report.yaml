  # ---------------------------------------------------------------------
  # 10. VERDICT
  # ---------------------------------------------------------------------
  completion_gate:
    - item: every quantitative claim marked reproduced, not_reproduced or unable_to_check
      met: true
      where: >-
        `metric_recomputations` M1-M26 plus `anomaly_checks` ANOM-1..ANOM-4.
        Enum mapping for the compound labels used there: `reproduced`,
        `reproduced_and_extended`, `reproduced_and_the_disclosure_is_present`,
        `reproduced_independently_and_strengthened`,
        `reproduced_by_point_verification_not_by_my_search`,
        `reproduced_with_a_scope_caveat` and
        `reproduced_with_a_reproducibility_defect` all resolve to REPRODUCED.
        NOT_REPRODUCED: none — no producer number failed to reproduce.
        UNABLE_TO_CHECK: the eleven entries in `limitations`, plus the
        c*_matzov arithmetic in `coordinator_note_check.correction`, which is
        explicitly marked unable_to_check for provenance.
    - item: an explicit verdict from the declared enum
      met: true
      where: "`package_verdict: ADMISSIBLE_WITH_DEFECTS` below, with twelve numbered defects."

  verdict: passed
  package_verdict: ADMISSIBLE_WITH_DEFECTS
  verdict_rationale: >-
    Every quantitative claim I was able to check reproduced, on an independently
    written script, on my own clone of the pin, under a DIFFERENT floating-point
    rounding convention from the producer's, with a maximum deviation of
    1.9e-09 bits and most values exact. The instrument validated first and
    passes on the current shim. The artifact set is complete and hash-consistent
    with a real, reachable snapshot commit. The package's central finding —
    that the recorded gap is dominated by a comparison against the wrong
    estimator function — is a verifiable SOURCE FACT (estimator/lwe.py:13) plus
    a deterministic evaluation, and both halves check out. Unexpected
    observations were surfaced rather than suppressed, including the one
    (ANOM-3) most inconvenient to the batch's own premise and the one
    (the negative residual) most inconvenient to its own decomposition. The
    Coordinator's own scouting premise is overturned by the package and the
    Coordinator's snapshot message says so.
    Twelve defects are recorded. None changes a reported number except DEF-8
    (0.01-0.35 bits, in the direction that ENLARGES the residual). The three
    that matter for how the package may be read are DEF-6 (the rejected
    explanations are under-powered at residual resolution), DEF-7 (the
    reproduction claim has no null of the right shape), and DEF-9 (ANOM-3 is
    largest where the instrument is least covered). Those bound how far
    sections 6(2) and 6(3) may be pushed; they do not touch D1, which is the
    finding.
  what_this_verdict_does_not_do: >-
    An ADMISSIBLE_WITH_DEFECTS package is admissible evidence. It is not an
    ML-KEM break, not a demonstration that ML-KEM misses a NIST category, not a
    security proof in either direction, not a validation of any heuristic, not a
    correction of EV-MLKEM-015, and not authorization to promote anything. Rule
    12 is UNMET and UNWAIVED and ANOM-3 stays gated.

  # ---------------------------------------------------------------------
  # 11. LIMITATIONS — WHAT I COULD NOT CHECK
  # ---------------------------------------------------------------------
  limitations:
    - >-
      WHETHER EITHER COST MODEL IS CORRECT. I reproduced arithmetic, source
      citations and controls. I did not and could not establish that
      lattice-estimator's MATZOV cost function, Carrier's analysis, or
      MATZOV-2022's analysis is right. Both sides of the headline comparison rest
      on the same Nf independence law, and neither prices false positives in the
      estimator's implementation.
    - >-
      THE NIST CUTOFFS 143 / 207 / 272. Verified only against archived SECONDARY
      bytes (MATZOV Table 1's NIST column and Carrier's abstract). No FIPS 203 or
      NIST call text is readable under this program's network policy. Every
      margin statement in this report inherits that.
    - >-
      MATZOV AT KYBER-768 AND KYBER-1024 AGAINST REAL SAGE. No reference exists.
      Two independent Sage-free sessions agreeing is not the same as a Sage
      reference, and this is where ANOM-3's large numbers live.
    - >-
      CARRIER'S TABLE 5.1. Not archived, so ANOM-4 cannot be resolved and the
      published target carries a 0.29-0.35 bit ambiguity at Kyber-768/1024.
    - >-
      WHETHER CARRIER'S NEAREST-NEIGHBOUR FIT IS COEFFICIENT-IDENTICAL TO
      RC.MATZOV's NN_AGPS TABLE. This is the hinge of DEF-6 and nothing in the
      archive settles it.
    - >-
      H15 AND H17. Carrier's polar-code decoder and zero-secret iteration, and
      the mu / repetition bookkeeping, are not implemented in this instrument.
      H17 is the larger and is plausibly the whole MATZOV-2022 residual; sizing
      it requires changing the frozen cost model and a Coordinator amendment.
    - >-
      GLOBAL OPTIMALITY OF ANY STAGE. Both the producer's searches and mine are
      LOCAL boxes. DEF-10 is a concrete demonstration that the grids have
      artifacts. No global claim is made by anyone and none should be read.
    - >-
      H10, THE STAGE-ORDER DEPENDENCE. D2/D3/D4 are order-dependent and no
      reordering was run by the producer or by me. D1 and the total are
      order-independent, so the finding is unaffected; the SPLIT between D2, D3
      and D4 is not established.
    - >-
      KN-OPEN-016'S ACTUAL QUESTION — whether the MATZOV-family success
      probabilities survive the Ducas-Pulles objection — is untouched by this
      batch and by this validation. Nothing here bears on it.
    - >-
      MODEL PROVENANCE. `orchestration.adapter doctor --probe` was not run;
      `model_verified: false`. This validation is a `review-adversarial` pass
      with `fallback_used: true`, not a rule-12 `review-breakthrough` pass at
      `max`, and it does not claim to be one.
    - >-
      RESOURCE MEASUREMENTS OF THE PRODUCER'S RUN. I verified the recorded wall
      time and the ulimit invocation are internally consistent and within budget;
      I could not independently measure them after the fact. My own run took
      222.7 s against the producer's 369.5 s, which is consistent given I did not
      re-run the 10-model axis-A sweep.

