  # ---------------------------------------------------------------------
  # 4. THE COORDINATOR NOTE'S TWO SOURCE FACTS
  # ---------------------------------------------------------------------
  coordinator_note_check:
    note_path: coordination/goals/GOAL-MLKEM-003/batches/BATCH-011/coordinator_notes/anom3_significance_note.md
    note_status_as_declared: NOT EVIDENCE, unreviewed Coordinator source-reading note
    treated_as: a claim to check
    fact_1:
      claim: >-
        estimator/lwe_dual.py class MATZOV (line 496), method Nf (line 526),
        derives N from a closed-form advantage law with mu = 0.5 and NO
        correlation term.
      verdict: CONFIRMED
      evidence: >-
        Line numbers exact at the pin: `class MATZOV:` at 496, `def Nf(` at 526,
        `mu = 0.5` at 539. The body computes lsigma_s from Xe.stddev, Xs.stddev,
        q, sqrt(4/3), sqrt(beta_sieve/2/pi/e) and deltaf(beta_bkz)**(m + k_lat -
        beta_sieve), then
        N = exp(4*(lsigma_s*pi/q)**2) * exp(k_fft/3*(Xs.stddev*pi/p)**2)
            * (k_enum*Hf(Xs) + k_fft*log(p) + log(1/mu)),
        annotated "# p.29, we're ignoring O()". Every term is a closed form in
        the parameters; there is no covariance, no correlation coefficient, no
        dependence structure between score contributions, and no data-dependent
        quantity anywhere in the method. mu enters only as log(1/mu) with mu
        fixed at the literal 0.5 and never exposed as an argument. The note's
        quoted excerpt is faithful to the source.
    fact_2:
      claim: >-
        Lines 496-700 contain ZERO occurrences of Pwrong, false_pos, fpfn or
        Phi_inv.
      verdict: CONFIRMED, and stronger than stated
      evidence: >-
        `awk 'NR>=496 && NR<=700' estimator/lwe_dual.py | grep -E
        "Pwrong|false_pos|fpfn|Phi_inv"` returns 0 lines. The same grep over the
        WHOLE 796-line file returns 0 lines. The range 496-700 does contain the
        entire class (matzov = MATZOV() is at 689), so the range is the right
        one. There is no outer repetition factor and no amplification term in
        MATZOV.cost: `repetitions` never appears on that path, and the cost is
        `red + guess` for a single pass.
    corroborating_observation_i_add: >-
      The archived Carrier tables make the asymmetry concrete rather than
      inferential. Carrier's Table C.2 carries BOTH a log2(Pwrong) column
      (-119.57 / -177.79 / -244.03) and a log2(R) repetition column (9.39 / 9.49
      / 15.15), and the table caption reads "We recall that Pgood ~ 0.5". So the
      published side prices a false-positive probability and an outer repetition
      that have no counterpart at all in the estimator's MATZOV path, while
      BOTH sides target a ~0.5 success probability. The producer records this as
      H17 UNSIZED_WITH_REASON and does not absorb it into the residual, which is
      the correct handling.
    split_accepted: ACCEPTED_WITH_ONE_AMENDMENT_AND_ONE_CORRECTION
    amendment: >-
      The note frames the surviving half as "EV-MLKEM-015 ... correct about the
      function it named". That is true of EV-MLKEM-015's OBSERVATION and false
      of its INFERENCE. See the judgement below.
    correction: >-
      The note's third paragraph, "Unchanged and reinforcing", transfers
      EV-MLKEM-020's c* ~ 0.007 to the ANOM-3 undercut. c* is a PER-ATTACK
      quantity — EV-MLKEM-020 says so itself in its boundaries — computed as
      (margin)/(log2 M) for primal_bdd at eta = 422/640/889. The matzov undercut
      has a LARGER margin and a SMALLER sieve, so its c* is larger, not equal.
      Carrying EV-MLKEM-020's own Model A convention across (log2 M = 0.2075*b +
      log2 b at b = beta_sieve = 391/583/804, margins +3.343959 / +10.633757 /
      +9.664320) gives c*_matzov ~ 0.0373 / 0.0817 / 0.0548 against the primal's
      0.0316 / 0.0459 / 0.0071 — up to 7.8x larger at Kyber-1024. THE NOTE'S
      QUALITATIVE POINT SURVIVES (0.08 is still far below every named hardware
      convention and far below 1/3), but the figure "as small as 0.007" is the
      wrong number for the dual and must not travel with ANOM-3. My c*_matzov
      figures are indicative arithmetic under a memory model EV-MLKEM-020 itself
      downgraded to `construction_with_partial_support`; they are NOT a
      validated result and are marked `unable_to_check` for provenance.
    budget_note: >-
      Both source facts confirmed, so per the task card I did not re-derive them
      further and spent the remaining budget on the two questions the note left
      open (the EV-MLKEM-015 judgement below, and independent recomputation of
      the whole decomposition).

  # ---------------------------------------------------------------------
  # 5. JUDGEMENT ON EV-MLKEM-015 (a judgement, NOT a status change)
  # ---------------------------------------------------------------------
  ev_mlkem_015_judgement:
    authority_disclaimer: >-
      I am a validator. This is my reasoned judgement about what a record says,
      offered to the Coordinator. It changes nothing, and under rule 12
      (UNMET, UNWAIVED) nothing may change on this batch's authority.
    finding: NEITHER_CLEANLY. Correct in its measurements, over-general in one clause, and materially wrong in its inference.
    breakdown:
      - locus: "observations[0], first sentence"
        text: "dual_hybrid+fft log2(rop) is 143.79/203.79/273.82 ... while primal_bdd is 140.20/200.96/270.72"
        assessment: CORRECT AND CORRECTLY SCOPED. Reproduced exactly. It names the function.
      - locus: "observations[0], second sentence"
        text: "Dual does not beat primal (gaps +3.59/+2.83/+3.09 bits)"
        assessment: >-
          THE ARITHMETIC IS RIGHT (+3.589005/+2.829148/+3.093644) AND THE
          SENTENCE IS AN OVER-GENERALISATION. "Dual" is the family; what was
          measured is one member. Inside the same instrument, the same pin and
          the same cost model, `matzov` — the estimator's own implementation of
          MATZOV Theorem 7.6 — beats primal_bdd by 0.543432 / 4.592472 /
          8.387943. The clause is not merely incomplete; as written it is a
          claim about the family and it is false of the family in this
          instrument.
      - locus: "inference"
        text: "any dual claim that undercuts these dual_hybrid+fft numbers by several bits (Carrier / MATZOV-2022) must justify ingredients beyond the public MATZOV dual in lattice-estimator"
        assessment: >-
          MATERIALLY WRONG, and this is the load-bearing error. It calls
          dual_hybrid+fft "the public MATZOV dual in lattice-estimator". It is
          not: `estimator/lwe.py:13` binds the public name to `matzov`, and
          `lwe_dual.dual_hybrid` is the Espitau-Joux-Kharchenko hybrid with a
          Guo-Johansson FFT solver. The public MATZOV dual already sits
          4.13 / 7.42 / 11.48 bits below the number the inference treats as the
          bar, i.e. it already delivers most of the undercut with NO ingredient
          beyond the public estimator. The inference's operative reasoning rests
          on the misidentification.
      - locus: "boundaries[1]"
        text: "lattice-estimator matzov dual != Carrier polar-code repair"
        assessment: >-
          Uses "matzov" for an object that is not `matzov`. The boundary's
          intent (the estimator's dual is not Carrier's repaired attack) remains
          true; its wording propagates the same conflation.
    what_i_recommend_a_record_should_say: >-
      Not a retraction and not a status flip. The right instrument is a
      SUPERSEDING evidence record under AGENTS.md rule 4 that (i) preserves
      EV-MLKEM-015's numbers unchanged, (ii) restates the second sentence as
      "`estimator.lwe_dual.dual_hybrid(..., fft=True)` does not beat primal_bdd",
      (iii) replaces the inference with one that names `estimator.lwe_dual.matzov`
      and records that it undercuts primal_bdd by 0.54/4.59/8.39 bits under
      RC.MATZOV at this pin, and (iv) carries the two boundaries this batch
      establishes: the matzov path has a Sage-anchored reference at KYBER-512
      ONLY, and both cost models share the independence law the Ducas-Pulles
      objection targets, so nothing here bears on ML-KEM's security. Gated on
      rule 12.
    what_a_record_should_say_when_a_public_api_name_and_its_function_diverge:
      - >-
        NAME THE CALLABLE, NEVER THE ALIAS. Scope statements must carry the
        fully-qualified object actually invoked — "estimator.lwe_dual.dual_hybrid
        (module-level function, EspJouKha/GJ21 hybrid)" — not "the estimator's
        dual" and not the public alias.
      - >-
        RECORD BOTH SIDES OF EVERY ALIAS EXPLICITLY. Where the package under
        study rebinds a name (`from .lwe_dual import matzov as dual_hybrid`),
        the record states the rebinding, cites the line, and says which side it
        ran.
      - >-
        MAKE IDENTITY MACHINE-CHECKABLE, NOT PROSE. The run wrapper should emit
        `__module__`, `__qualname__` / `type(...).__name__` and the estimator's
        own `f_name` for every costed callable into results.json, so a later
        reader diffs a field instead of trusting a sentence. This batch's own
        history is the argument: a one-line alias went unnoticed through
        EV-MLKEM-015, four batches, and a Coordinator scouting exercise.
      - >-
        STATE NON-COVERAGE POSITIVELY. A record that costs one member of a family
        must name the siblings in the same module that it did NOT run, and say
        why (unavailable, out of budget, not attempted). "Dual does not beat
        primal" would have been impossible to write under that discipline.
      - >-
        SCOPE THE VERB TO THE OBJECT. Where a record generalises from one
        callable to a family, the generalisation is a separate claim needing its
        own evidence, and it inherits the weakest control covering any member.

  # ---------------------------------------------------------------------
  # 6. ANOMALIES AND DEVIATIONS
  # ---------------------------------------------------------------------
  anomaly_checks:
    - id: ANOM-1
      claim: HEAD moved 75f6c8e0d749 -> 428bb71364f0 mid-task; diff over instrument and sources empty
      status: reproduced
      my_result: >-
        Both commits exist (75f6c8e0 "open GOAL-MLKEM-003 BATCH-011" 03:29:53;
        428bb713 "Merge remote-tracking branch 'origin/main'" 03:41:23).
        `git diff --stat 75f6c8e0 428bb713 -- tools/sage_free_estimator
        inputs/MLKEM-DUAL-SOURCES-20260802` is EMPTY. 28 files changed in total.
        The producer's handling is exactly right: recorded, impact checked,
        impact none.
    - id: ANOM-2
      claim: >-
        estimator/lwe_dual.py:589-597 feeds `beta_sieve if beta_sieve else beta`
        into Nf, so the automatic path evaluates the sample-count law at
        beta_sieve = beta while charging reduction at the balanced sieve
        dimension; passing beta_sieve explicitly changes both, so stage 4 is not
        a pure relaxation.
      status: reproduced
      my_result: >-
        Source-confirmed. The consequence is visible in my own numbers: at
        Kyber-512 S1 the automatic path reports beta = 387 and beta_ = 391, i.e.
        beta_ > beta, so Nf is evaluated at 387 while the reduction is charged at
        391. The producer flags this in the stage-4 docstring AND in the report,
        and does not present D4 as a pure relaxation. Correct handling of an
        unexpected observation (AGENTS rule 8). It also means D4's sign is not
        guaranteed a priori, which makes the Kyber-768/1024 zeros informative
        rather than trivial.
    - id: ANOM-3
      claim: matzov cheaper than primal_bdd by 0.543432 / 4.592472 / 8.387943 under RC.MATZOV at the pin
      status: reproduced
      my_result: >-
        +0.5434316267622421 / +4.592471560057106 / +8.387943446048837 (M7), and
        the Kyber-512 instance is independently visible in the pinned upstream
        repository's own committed doctest (M9). HANDLING: the producer surfaced
