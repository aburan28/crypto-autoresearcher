      verdict: pass, low power. See DEF-7.
    - id: CTRL-7
      what: the refinement machinery reproduces the estimator's own optimum on the estimator's own grid
      my_result: >-
        Corroborated from a different direction: my independently written
        searches, sharing no code with the producer's, landed on the IDENTICAL
        argmin points at stages 2 and 3 on all three sets. A refiner optimising a
        different objective could not do that.
      verdict: pass, discriminating
    - id: NULL-OBJECT-OBLIGATION
      what: >-
        docs/inventor-protocol.md section 3 — a reported signal is an artifact
        until the identical measurement is run against a null object of the same
        shape, and the report must say what the quantity SHOULD do as the
        parameter meant to destroy it increases.
      my_assessment: >-
        PARTIALLY MET, and the gap is on the second headline rather than the
        first. (a) For D1 no null is needed: it is a source fact about two
        distinct callables plus a deterministic evaluation, with no statistical
        content. (b) The decay question IS answered for the growth claim, and
        answered well: the parameter meant to destroy the signal is the
        decomposition itself, the report predicts the residual/beta should stop
