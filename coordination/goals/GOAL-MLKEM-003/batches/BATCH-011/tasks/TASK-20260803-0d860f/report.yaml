  # ---------------------------------------------------------------------
  # 7. HEURISTIC-VALIDATION AND COST-MODEL CHECKS
  # ---------------------------------------------------------------------
  heuristic_validation_checks:
    - check: every modelling choice is a numbered heuristic with statement, justification, falsifier and validation status
      status: pass
      detail: >-
        H1-H18 all carry the four fields. The unvalidated ones are labelled as
        such rather than quietly asserted: H8 `unverified_and_unverifiable_in_this_environment`
        (NIST cutoffs), H10 `unvalidated_this_batch` (stage-order dependence),
        H15 and H17 `UNSIZED_WITH_REASON`. H14's unsourced element (Carrier's
        k_fft column semantics) is explicitly marked and nothing depends on it.
    - check: pre-registered prediction
      status: not_applicable_with_reason
      detail: >-
        The exemplar profile's pre-registration test (a theoretical distribution
        recorded before sampling) has no analogue here: there is no sampling and
        no distribution. The nearest analogue that DOES apply is whether the
        comparison object was fixed before the numbers were seen, and it was —
        H2 pins the EV-MLKEM-015 comparison object and the script raises an
        anomaly automatically if the reproduced value drifts by more than
        0.01 bits. None fired.
    - check: sample integrity
      status: not_applicable_with_reason
      detail: >-
        No sampling anywhere. `randomness.seeds` is the empty list, with a
        correct justification recorded beside it.
    - check: correspondence validity
      status: not_applicable_with_reason
      detail: >-
        No correspondence substitutes for direct computation. The one
        substitution in the package is the SHIM standing in for Sage, and that is
        covered by CTRL-1 on two attacks and by the upstream doctest on the
        third at one parameter set — with the uncovered paths named.
    - check: scale binding (AGENTS rule 7)
      status: pass
      detail: >-
        The parameters ARE the FIPS 203 ones (n = 512/768/1024, q = 3329). There
        is no toy-to-crypto extrapolation. Equally, and the package says so,
        nothing was EXECUTED at any scale: this is not crypto-scale validation
        either, it is a cost-model estimate at crypto-scale parameters. Both
        halves stated.
    - check: heuristics that would change the answer are unvalidated and named
      status: pass_with_note
      detail: >-
        H15 (Carrier's polar-code decoder and zero-secret iteration) and H17
        (mu and the repetition count R) are the two named unsized terms, and H17
        is the larger: Carrier prices log2(R) = 9.39 / 9.49 / 15.15 and
        log2(Pwrong) = -119.57 / -177.79 / -244.03 against an estimator path
        with neither. The producer refuses to absorb them into the residual,
        which is right. NOTE: with H17 unsized, the surviving MATZOV-2022
        residual (+1.52 / +0.99 / +2.20) is not bounded by anything in this
        package, and section 6 item 3 says exactly that.

  cost_model_checks:
    - check: cost unit declared
      status: pass
      detail: >-
        log2(rop), gate-count metric under RC.MATZOV, declared on every table and
        traced to both published sources' own unit declarations, both verified
        verbatim in the archive (M22).
    - check: optimistic assumptions flagged
      status: pass_with_note
      detail: >-
        Flagged: mu = 0.5 hardcoded with no outer repetition (section 5(2) and
        H17); "we're ignoring O()" quoted from the source; the local-box
        limitation stated as making D2+D3+D4 an UNDERSTATEMENT of estimator slack
        and the MATZOV-2022 residual an UPPER bound (section 8 item 4).
        NOTE: the single most consequential optimistic assumption is the one
        neither side prices — the Nf independence law with no false-positive
        cost — and the package does name it (section 6 item 5) without sizing it.
    - check: memory reported alongside time
      status: not_applicable_with_reason
      detail: >-
        No memory figure appears anywhere in this package and none is claimed.
        That is a correct scoping decision for a gap decomposition, NOT an
        omission — but it is why ANOM-3 must not be read next to EV-MLKEM-020's
        c* without the recomputation in coordinator_note_check.correction.
    - check: total expected cost as per-attempt cost x inverse success probability
      status: FAIL_ON_THE_INSTRUMENT_NOT_ON_THE_PACKAGE
      detail: >-
        The estimator's MATZOV path does NOT do this bookkeeping: mu = 0.5 enters
        only as an additive log(1/mu) inside the sample count, there is no outer
        repetition factor, and there is no false-positive term (confirmed at the
        source, coordinator_note_check). The published side DOES: Carrier carries
        log2(R) and log2(Pwrong) columns explicitly. So the two sides are not
        doing the same bookkeeping, and the package REPORTS this (H17,
        section 5(2)) rather than papering over it. The failure is a property of
        the instrument being validated, correctly disclosed by the package; it is
        not a defect of the package. It IS a reason no residual below ~2 bits
        should be read as meaningful.
    - check: concrete-cost table at standardised parameter sets
      status: pass
      detail: Three FIPS 203 sets, every stage tabulated, both published baselines carried.

  # ---------------------------------------------------------------------
  # 8. PROOF-ARCHITECTURE CHECKS
  # ---------------------------------------------------------------------
  proof_architecture_checks:
    - check: baseline fixture reproduces the cited baseline exactly
      status: pass
      detail: primal_bdd delta 0.0 against RUN-MLKEM-015-001; dual_hybrid+fft <= 3.13e-13; matzov exact against the pin's own doctest at Kyber-512.
    - check: strictness witness for an improvement claim
      status: not_applicable
      detail: No improvement over a baseline algorithm is claimed. The package explains a discrepancy; it proposes no new attack.
    - check: observation collisions bound to enumerated scope
      status: pass_with_note
      detail: >-
        The stage searches are explicitly local boxes and the package says the
        boxes are local and that the consequence is directional (D2+D3+D4
        understates slack; the MATZOV-2022 residual is an upper bound). No global
        optimality is claimed anywhere. My DEF-10 (the beta_sieve parity) is a
        concrete instance of why that caveat is needed.
    - check: interface preservation across representation changes
      status: pass
      detail: >-
        The only representation change is Sage -> shim, and its losses are
        bounded by CTRL-1/CTRL-3/CTRL-4 and by my cross-convention re-run
        (<= 1.9e-09 bits).
    - check: quantifier fidelity
      status: pass
      detail: >-
        Every claim is per-parameter-set with per-set numbers; no per-set result
        is presented as uniform. The one family-level sentence I found in the
        campaign — EV-MLKEM-015's "dual does not beat primal" — is exactly the
        quantifier failure this check exists to catch, and it is in the older
        record, not in this package.
    - check: Pareto honesty (dominated_by / sota_delta)
      status: FAIL_INHERITED
      detail: >-
        No deliverable in the package carries `dominated_by` or `sota_delta`.
        This is the same omission EV-MLKEM-020 records against BATCH-010
        (OBJ-9). It is arguably ill-posed for a gap decomposition — there is no
        frontier to sit on — but the inventor protocol asks for the field with
        `null` plus a checked justification, not for its absence. Defect DEF-11,
        minor and inherited.

