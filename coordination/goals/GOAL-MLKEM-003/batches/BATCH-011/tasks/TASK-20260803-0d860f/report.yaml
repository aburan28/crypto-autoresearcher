  deviation_checks:
    - id: DEV-1
      what: the handoff's `deliverables` and `completion_gate` were stale BATCH-010 text naming memory_charged_derivation.py, derivation_report.md and c*
      verified: >-
        CONFIRMED from the dispatch queue. TASK-20260803-fb52f4's `objective`
        and `artifact_paths` describe the gap decomposition and name
        dual_gap_decomposition.py / gap_report.md; its `deliverables` and
        `completion_gate` describe BATCH-010's memory-charged derivation. The
        two blocks are mutually inconsistent within one handoff.
      was_following_the_objective_the_right_call: YES, AND IT WAS THE ONLY DEFENSIBLE CALL
      why: >-
        Four independent reasons, in decreasing order of weight.
        (1) THE STALE ITEMS ARE NOT SATISFIABLE, not merely inconvenient. c* =
        margin / log2(M) needs a memory figure; a gap decomposition produces
        none. Producing a c* here would have required inventing a memory model
        for an attack the instrument supplies no memory for — which is precisely
        the defect EV-MLKEM-020 records against BATCH-010 (H4/H5, "the memory
        model is borrowed, not derived"). Obeying the stale gate would have
        manufactured exactly the artifact the previous batch was criticised for.
        (2) THE HANDOFF RESOLVES ITSELF. `objective` and `artifact_paths` are the
        two blocks the dispatcher binds and the archive verifies; the file names
        in `artifact_paths` are the gap-decomposition names, and the Coordinator
        then AMENDED artifact_paths to add the two log files, i.e. acted on the
        gap-decomposition reading. Three signals against one.
        (3) THE ALTERNATIVE IS WORSE FOR THE PROGRAM. An executor that halts on a
        Coordinator specification error burns the batch and produces nothing
        reviewable; AGENTS.md rule 9 treats abandoning a live lead as a failure
        mode symmetric with overclaiming, and KN-OPEN-016's headline question was
        the live lead.
        (4) THE DEVIATION WAS DECLARED, CLASSIFIED AND ITEMISED. DEV-1 in
        receipt.json names it a `specification_error, non-blocking, resolved by
        the handoff's own internal precedence`; the two stale gate items are
        carried in `completion_gate` marked `[STALE GATE ITEM]` /
        `not_applicable` with reasons rather than deleted; and the substantive
        parts of the stale gate that DO transfer (beta and d per set, agreement
        with the control) were satisfied anyway. That is the model handling.
      residual_criticism: >-
        The producer could have named ONE thing it did not: the stale
        completion_gate also carried "the memory unit is stated and the
        conversion shown", and the reply "no memory figure is used anywhere in
