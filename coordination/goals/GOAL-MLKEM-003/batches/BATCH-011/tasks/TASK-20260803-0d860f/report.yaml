          FREE-MEMORY GATE COUNTS. Under EV-MLKEM-020's own (downgraded) memory
          model the undercut of the NIST cutoffs dies at c* ~ 0.037 / 0.082 /
          0.055 for this attack (my indicative arithmetic, see
