      my_result: >-
        +67.2357 and -120.0440 are arithmetic consequences of subtracting
        Kyber-1024 estimator from Kyber-768 published, and Kyber-512 estimator
        from Kyber-1024 published. Reproducible but NOT discriminating: the
        magnitudes are 60-120 bits and no plausible sign-locked bug survives to
