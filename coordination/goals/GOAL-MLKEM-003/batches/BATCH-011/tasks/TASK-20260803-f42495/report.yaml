      - name: MATZOV-2022 published (secondary-sourced)
        value: 137.5 / 193.5 / 257.8
    frontier_axes_checked:
      time: yes, all five rows above
      memory: NO for primal_bdd and matzov - the instrument reports none; I
        reconstructed it in OBJ-4 and the reconstruction inherits EV-MLKEM-020's
        own sourcing downgrade of 2^(0.2075n)
      data_queries: NOT CHECKED by anyone. `matzov` fixes m = params.n
        (lwe_dual.py:583-584) while Carrier optimises m to 475/636/802; the LWE
        sample budget is a real cost axis in a KEM setting and no record in this
        campaign has priced it.
    dominated_by: >-
      NOT SETTABLE TO null. On time alone at c = 0, `matzov` dominates
      `primal_bdd` on all three sets. On the memory axis reconstructed in OBJ-4,
      `primal_bdd` dominates `matzov` at Kyber-512 and Kyber-1024 and is
      dominated at Kyber-768. Neither dominates the other across the frontier, and
      the data/query axis is unmeasured, so the honest entry is "incomparable on
      the checked axes; one axis unmeasured".
    sota_delta: >-
      versus this program's own prior best served attack (primal_bdd): -0.543432
      / -4.592472 / -8.387943 bits of estimated free-memory gate count. Versus
      Carrier's published headline: +0.156041 / +1.266243 / +2.635680 (like-for-
      like). Both are cost-model estimates, neither is a measurement, and the
      second is quoted to more decimals than the unmapped 9-15 bit R factor
      permits (OBJ-9).

  heuristic_challenges:
    - H17 must be RE-SCORED, not left `UNSIZED_WITH_REASON`. Its mu half is now
      sized at <= 0.267033 bits (OBJ-2) and is negligible. Its R half - Carrier's
      log2(R) = 9.39/9.49/15.15 with no estimator counterpart - remains unsized
      and is larger than ANOM-3's entire margin on all three sets. Splitting them
      changes what the next batch should buy.
    - H9's `cost_to_the_conclusion` is correct and its consequence is not drawn
      (OBJ-9b). "D2+D3+D4 UNDERSTATES the estimator-side slack" means the
      Carrier agreement is bounded by the search box, not by the model.
    - H12 (dimensions-for-free) is justified by inference where H11 (sieve model)
      is justified by quotation. The conclusion holds for a better reason the
      report has the data for (OBJ-10).
    - H8 is unverifiable and is the denominator of every headline sentence
      (OBJ-5). No numbered heuristic anywhere in this package covers MEMORY,
      because no memory figure is used - which is itself the omission OBJ-4 names.
    - >-
      MISSING HEURISTIC - nothing numbers the assumption that a distinguishing
      advantage of 0.5 over k_enum+k_fft secret coordinates is comparable to
      primal_bdd's full-secret BDD recovery. Neither cost dict carries `prob` or
      `repetitions` (OBJ-4), so the instrument offers no way to normalise the two
      attacks to a common success probability. That is an unnumbered assumption
      under the package's own standard.

  cost_model_challenges:
    - per_attempt_vs_total_expected_cost: >-
        `MATZOV.__call__` (lwe_dual.py:628-686) takes no `success_probability`
        and applies no repetition; its sibling `dual`/`dual_hybrid`
        (lwe_dual.py:692-, :742-) take `success_probability = 0.99` and report
        `repetitions`. The MATZOV path therefore prices ONE PASS at advantage
        mu = 0.5 and never multiplies by an inverse success probability. Whether
        that is right is a modelling question I cannot settle here; that it is
        UNSTATED, and that ANOM-3 compares it to a differently-conventioned
        primal cost, is the objection.
    - dropped_asymptotic: >-
        lwe_dual.py:551 carries the estimator authors' own comment
        "p.29, we're ignoring O()". The Kyber-512 ANOM-3 margin of 0.543432 bits
        is smaller than a dropped factor of 2 (OBJ-3i).
    - memory_beside_time: >-
        Absent for both compared attacks (OBJ-4). Under the program's own
        target-result-profile requirement that every cost claim carries memory
        beside time, ANOM-3 as currently stated is incomplete rather than wrong.
    - time_memory_interpolation: >-
        Not computed by anyone. The van Oorschot-Wiener style question - what
        does the frontier look like when the attacker is given w < M memory - is
        untouched, and OBJ-4's c_flip = 0.019688 at Kyber-512 says it is where
        the ordering actually lives.

  reduction_and_scope_challenges:
    - no_break_claim: >-
        I assert no ML-KEM break and none is implied anywhere in this report. I
        assert no security proof either; a result that raises an estimated attack
        cost is a statement about one cost model at one parameter set under
        stated heuristics.
    - rule_12: >-
        UNMET AND UNWAIVED. ANOM-3 may not be treated as correcting
        EV-MLKEM-015, and this report performs no such correction. EV-MLKEM-011,
        EV-MLKEM-013, EV-MLKEM-017, KN-FIND-012 and KN-FIND-014 are untouched.
    - scope_inflation_audit: >-
        NONE FOUND IN THE PACKAGE, and it deserves saying twice. The producer
        refuses "best attack" phrasing, names arora_gb, dual and primal_hybrid as
        unserved, records the RC.Kyber failure rather than dropping it, and
        declines to close KN-OPEN-016. Where inflation risk now lives is
        downstream - in the note's phrase "the campaign's most consequential
        number" and in the failed task's receipt calling ANOM-3 "the most
        consequential finding this campaign has produced".
    - kn_open_016: >-
        UNTOUCHED, and the package says so (gap_report section 6.5, section 8.6).
        KN-OPEN-016 asks what the dual attack costs AFTER the heuristics are
        repaired. This batch measured the cost BEFORE repair, in an
        implementation of the unrepaired law. My section I is the closest
        anything here comes to the real question, and it is a sensitivity, not a
        repair.

  proof_architecture_challenges:
    - observation_fiber: >-
        The observable is `log2(rop)` from a pinned callable. Collision found,
        and it is the batch's own central finding - `lwe_dual.dual_hybrid(fft=True)`
        and `lwe_dual.matzov` are distinct ground-truth objects that both
        answered to the observable "the estimator's dual cost", landing
        4.13/7.42/11.48 bits apart and on opposite sides of the conclusion "dual
        beats primal". The missing separator is the resolved callable plus
        binding locus (OBJ-6).
    - quantifier_order: >-
        The sentence "matzov is cheaper than primal_bdd" is stated as if uniform
        over parameter sets. My OBJ-3(iii) and OBJ-4 both show the quantifier
        must be per-set - the fragility exponent (2.37 vs more than 16 bits of N)
        and the memory flip exponent (0.0197 / none / 0.1420) differ by an order
        of magnitude across the three sets, and one of them has no flip at all.
    - method_ceiling: >-
        The largest claim this instrument can support is "one pinned cost model,
        at three parameter sets, over three served attacks, under eighteen
        numbered heuristics of which four are unvalidated and one is
        unverifiable". It cannot reach "ML-KEM misses its NIST category", and no
        artifact in the package claims it does.
    - nearby_object: >-
        The nearby object for which the conclusion should FAIL is a null LWE
        instance whose distribution defeats the dual distinguisher. Nobody has
        run it. That is RC-1.

  narrowest_supported_statement: >-
    Under lattice-estimator pinned at 3e48ef421ec2, driven Sage-free through
    tools/sage_free_estimator with the known-answer control passing (exit 0,
    primal_bdd delta 0.00e+00), and with the `.n(prec)` gap closed by an
    in-process rebinding: the callable `estimator.lwe_dual.matzov` - which is
    what the estimator's public name `LWE.dual_hybrid` resolves to, bound at
    estimator/lwe.py:13 - returns log2(rop) 139.656041 / 196.366243 / 262.335680
    at the three FIPS 203 parameter sets under RC.MATZOV, which is 0.543432 /
    4.592472 / 8.387943 lower than `LWE.primal_bdd` under the same cost model.
    That is a statement about two entry points of one instrument, at one pin, in
    a convention that charges nothing for memory and reports none for either
    attack. It is NOT the statement "the dual attack beats the primal attack":
    the two figures come from cost derivations that differ in what they assume
    (one is an explicitly truncated asymptotic resting on the independence law
    Ducas-Pulles dispute, the other is not), in what event they price (an
    advantage-0.5 distinguisher over k_enum+k_fft coordinates versus a
    full-secret BDD), and in their memory footprint (2^116.10 / 2^131.48 /
    2^240.00 versus 2^88.49 / 2^131.66 / 2^180.92 reconstructed Z_q elements).
    The Kyber-512 margin does not survive 2.4 bits of sample-count inflation or a
    memory-charge exponent of 0.0197; the Kyber-768 and Kyber-1024 margins
    survive 16 bits of inflation and, at Kyber-1024, a charge exponent up to
    0.142. Kyber-768 and Kyber-1024 have no Sage-computed reference of any kind.
    EV-MLKEM-015 is correct about the callable it named and mistaken in the
    inference field that identifies that callable with "the public MATZOV dual";
    correcting it requires a superseding record and a rule-12 review that has not
    happened. No ML-KEM parameter set is affected or cleared. KN-OPEN-016 remains
    open and untouched.

  constraints_binding_downstream_records:
    - EV-MLKEM-021 and DEC-20260803-85adf8 must not state ANOM-3 as "dual beats
      primal". The permitted wording is the `narrowest_supported_statement` above
      or a strict weakening of it.
    - Neither may repeat the note's sentence that the class contains no
      false-positive cost (OBJ-1), nor treat mu = 0.5 as the load-bearing
      assumption (OBJ-2).
    - Neither may cite the anom3_significance_note as validation; it says so
      itself and OBJ-8 gives a second reason.
    - Any "below the NIST cutoff" sentence carries the H8 caveat inline (OBJ-5).
    - The Carrier agreement is quoted to at most one decimal place until R is
      mapped (OBJ-9).
    - >-
      The `dominated_by` and `sota_delta` fields are filled from the
      `baseline_comparison` block above; a null `dominated_by` is not available
      here (OBJ-11).
    - Rule 12 stays UNMET and UNWAIVED. No status change to EV-MLKEM-015.

  next_concrete_action: >-
    THE CHEAPEST SINGLE CHECK THAT WOULD FALSIFY THE BATCH'S HEADLINE: obtain a
    Sage-computed reference for `estimator.lwe_dual.matzov` at Kyber-768 and
    Kyber-1024 under RC.MATZOV at pin 3e48ef4 - install Sage, run
    `LWE.estimate(schemes.Kyber768)` and `LWE.estimate(schemes.Kyber1024)`, or
    simply run the estimator's own doctest suite at the pin - and compare against
    196.3662433540 and 262.3356800075.
    Why this one and not another: every load-bearing number in this batch other
    than Kyber-512 flows through the `.n(30)` rebinding on a path with NO known-
    answer coverage. The harness control covers `primal_bdd` and
    `dual_hybrid(fft=True)` only; the producer's Sage cover for `matzov` (H5,
    CTRL-3) is Kyber-512 only, from the estimator's committed doctest, and my own
    independent CTRL-RT-2 is likewise Kyber-512 only. The two uncovered numbers
    carry ANOM-3's 4.59 and 8.39 bit margins, D1's 7.42 and 11.48 bits, the 1.27
    and 2.64 bit Carrier residuals, and every "below the NIST cutoff" sentence for
    768 and 1024. One disagreement falsifies the headline, ANOM-3, and the Carrier
    agreement simultaneously, and nothing else in the package survives independent
    of it. It is the producer's own section 8 item 1, it costs one Sage
    installation and minutes of compute, and it is the only check in this report
    that can fail catastrophically rather than incrementally.
    RUNNER-UP, if Sage is unavailable in this environment: re-run stages 2-4 with
    the search boxes doubled (OBJ-9b / RC-4, about 60 s). If S4 keeps falling, the
    "the pinned estimator reproduces Carrier's headline" claim is bounded by the
    box rather than by the model, and section 4's "independent convergence"
    corroboration degrades to a property of a local search.

