        value: 140.199473 / 200.958715 / 270.723623
        note: reproduced by me at delta 0.00e+00 against RUN-MLKEM-015-001
      - name: estimator.lwe_dual.dual_hybrid(fft=True) under RC.MATZOV
        value: 143.788478 / 203.787863 / 273.817268
        note: the EV-MLKEM-015 object; reproduced at delta <= 3.13e-13
      - name: estimator.lwe_dual.matzov (== LWE.dual_hybrid) under RC.MATZOV
        value: 139.656041 / 196.366243 / 262.335680
        note: reproduced exactly; Kyber-768/1024 are an UNCOVERED PATH
      - name: Carrier CRYPTO 2025 published (secondary-sourced)
