  objections:

    - id: OBJ-1
      severity: major
      target: the Coordinator note, fact 2's interpretation
      claim_status: reproduced (grep), refuted (interpretation)
      statement: >-
        The note writes "There is no false-positive cost anywhere in the class...
        and here not even the analytic term appears." That is wrong. The analytic
        false-positive term IS present, at lwe_dual.py:555:
        `(k_enum*cls.Hf(params.Xs) + k_fft*log(p) + log(1/mu))`. That bracket is
        the log of the number of candidate hypotheses the distinguisher scores -
        2^{k_enum*H} enumerated guesses times p^{k_fft} FFT bins - plus
        log(1/mu). It multiplies N, i.e. it inflates the required sample count to
        keep the best wrong candidate below the right one. That is precisely
        MATZOV's analytic handling of false positives, and it is precisely where
        the independence assumption is doing its work. The absence of a `Pwrong`
        LITERAL is a fact about naming, not about the cost model.
      why_it_matters: >-
        The note advances two reasons for dissolving the security reading and
        presents them as compounding. Reason 1 (fact 1) is sound and sufficient
        on its own. Reason 2 as stated is not sound. A downstream record that
        repeats "the estimator omits false-positive cost entirely" will be
        repeating an error, and it is the kind of error that gets found later by
        someone reading the source.
      cheapest_check: >-
        Read /tmp/le/estimator/lwe_dual.py lines 552-556 (equivalently
        `git show 3e48ef4:estimator/lwe_dual.py | sed -n '552,556p'`) and ask what
        2^{k_enum*Hf} * p^{k_fft} counts. One minute, no compute.

    - id: OBJ-2
      severity: major
      target: the Coordinator note's emphasis; producer H17; gap_report section 8 item 2
      claim_status: reproduced (my own measurement)
      statement: >-
        mu = 0.5 is NOT load-bearing, by two to six orders of magnitude. I
        subclassed MATZOV, rescaling N by the exact bracket ratio for a new mu
        (no transcription of the hard exp() factors), verified the subclass
        reproduces the pin at delta 0.000e+00, and swept mu with FULL
        re-optimisation inside RC.MATZOV:
          mu = 2^-10   -> cost change +0.109951 / +0.000000 / +0.000000 bits
          mu = 2^-40   -> cost change +0.109952 / +0.000000 / +0.000000 bits
          mu = 2^-128  -> cost change +0.267033 / +0.000001 / +0.000000 bits
        Tightening the target advantage by 128 bits costs the attacker at most
        0.267 bits on Kyber-512 and nothing measurable on Kyber-768/1024. The
        reason is structural and checkable: log(1/mu) is one additive term in a
        bracket dominated by k_fft*log(p) (50*log 5, 60*log 4, 120*log 4), and on
        Kyber-768/1024 the required N sits BELOW the sieve's free output
        (log2 N = 119.7530 vs 0.2075*beta_sieve = 120.9725; 165.9385 vs 166.8300),
        so small inflations of N are absorbed at zero cost.
      why_it_matters: >-
        The note leads with `mu = 0.5` as the visible symptom. Anyone who acts on
        that - e.g. the producer's own remediation proposal, gap_report section 8
        item 2, "Expose mu in Nf ... it is the largest nameable remaining term" -
        will spend a Coordinator cost-model amendment on a knob worth a quarter
        of a bit. The load-bearing objects are `exp(4*(lsigma_s*pi/q)**2)` at
        line 553 (the advantage law itself) and the union-bound bracket at 555.
        H17 should be re-scored: its mu half is now SIZED and negligible; its R
        half remains unsized and large (OBJ-9).
      cheapest_check: >-
        Re-run my section H (about 90 s). Or, with no compute at all: read line
        555 and compare log(1/0.5)=0.693 against k_fft*log(p) = 80.5/83.2/166.4.

    - id: OBJ-3
      severity: major
      target: the Coordinator note's SPLIT - "survives - the internal finding"
      claim_status: >-
        ANOM-3's numbers reproduced independently (primal_bdd 140.199473 /
        200.958715 / 270.723623; matzov 139.656041 / 196.366243 / 262.335680;
        differences +0.543432 / +4.592472 / +8.387943). The note's SURVIVAL
        ARGUMENT is refuted.
      statement: >-
        The note asserts the internal finding "stands or falls on the function
        identity alone". It does not. Three reasons, each checkable:
        (i) NOT ONE FRAME. "Within the estimator's own frame" presupposes a
        single frame. `primal_bdd` is costed in lwe_primal.py from a BKZ
        simulation plus one SVP call at eta+1; `matzov` is costed from an
        explicitly TRUNCATED asymptotic - lwe_dual.py:551 carries the estimator
        authors' own comment "p.29, we're ignoring O()". Comparing a cost that
        discards an O() factor against one that does not is not a within-frame
        comparison, and ANOM-3's Kyber-512 margin of 0.543432 bits is smaller
        than a single dropped factor of 2. The note's split is therefore
        asymmetric in exactly the wrong direction: primal_bdd does not rest on
        the disputed law, matzov does, so sharing a discredited assumption
        contaminates the COMPARISON even though only one side carries it.
        (ii) THE BATCH'S OWN DIAGNOSTIC CONVICTS ANOM-3. The task card and
        gap_report section 4 both rest on "a gap that grows with beta is a
        systematic modelling difference, not noise". ANOM-3's gap grows
        monotonically with beta: margin/beta = 0.0014042 / 0.0077971 / 0.0101919
        at beta 387 / 589 / 823 - the same monotone shape (0.01067 / 0.01411 /
        0.01632) that the batch used to convict the S0 comparison. The batch
        applied its diagnostic to the finding that embarrassed the scouting and
        did not apply it to the finding that flatters the campaign.
        (iii) THE CONTAMINATION HAS A KNOWN DIRECTION AND I MEASURED THE DECAY.
        If the disputed independence law understates the N required for a given
        advantage, matzov is cheap BECAUSE of the disputed assumption. The
        parameter that is supposed to destroy the signal is therefore N-inflation.
        I inflated N by 2^delta with full re-optimisation inside RC.MATZOV:
          Kyber-512:  N x 2^0 -> +0.543432, x2^1 -> +0.276399, x2^2 -> +0.076049,
                      x2^4 -> -0.331512.  delta_flip ~= 2.3732 bits.
          Kyber-768:  survives N x 2^16 at +0.728911. Not bracketed in the sweep.
          Kyber-1024: survives N x 2^16 at +5.233394. Not bracketed in the sweep.
        So the honest answer is PER PARAMETER SET, and the note's global "it
        survives" is wrong at Kyber-512 and defensible at Kyber-768/1024. At
        Kyber-512, understating the required sample count by a factor of 5.2
        erases ANOM-3 entirely; that is well inside the uncertainty the
        Ducas-Pulles objection opens. At Kyber-768/1024 the quantity DOES decay
        under the parameter meant to destroy it, which per inventor-protocol
        section 3 is a point in the finding's favour, not against it - and I
        record that in the direction it falls.
      narrowest_form_that_survives: see `narrowest_supported_statement` below.
      cheapest_check: >-
        For (i), read lwe_dual.py:551. For (ii), divide the three ANOM-3 margins
        by the three matzov betas in results.json. For (iii), re-run my section I
        (about 40 s of the 136 s total).

    - id: OBJ-4
      severity: major
      target: ANOM-3's status as a cost comparison; the free-memory gate convention
      claim_status: reproduced (my own reconstruction, cross-checked against EV-MLKEM-020)
      statement: >-
        The migration from `dual_hybrid(fft=True)` to `matzov` silently DISCARDED
        the only memory figure the instrument supplied on the dual side, and no
        one noticed. Verified programmatically from live cost dictionaries:
          primal_bdd      keys: beta, d, eta, problem, red, rop, svp, tag
          matzov          keys: N, beta, beta_, guess, m, p, problem, red, rop, t, zeta
          dual_hybrid+fft keys: beta, d, m, MEM, problem, REPETITIONS, rop, t, tag, zeta
        `dual_hybrid(fft=True)` reports mem = 2^92.699292 / 2^135.198091 /
        2^184.641891 and repetitions = 1. `matzov` reports NEITHER, and
        `primal_bdd` reports neither. So ANOM-3 compares two attacks in a
        convention where memory is free and unreported, having replaced the one
        attack that at least printed a number.
        Reconstructing matzov's memory (peak, in the Z_q-element unit
        EV-MLKEM-020 used): FFT table p^{k_fft} = 2^116.0964 / 2^120.0000 /
        2^240.0000 cells, sampling sieve database 2^91.0603 / 2^131.4803 /
        2^177.7429; peak 116.0964 / 131.4803 / 240.0000. Against primal_bdd's
        88.494071 / 131.657286 / 180.924993, which MY reconstruction reproduces
        to |delta| < 4.0e-07 of EV-MLKEM-020's published values - so the recipe
        is theirs, not mine, and it is calibrated.
        CONSEQUENCE A (the ordering): the memory-charge exponent that flips
        ANOM-3 is c_flip = 0.019688 at Kyber-512 - BELOW EV-MLKEM-020's own
        primal c* of 0.03164649, and 17x below the 3D-mesh convention 1/3 - and
        0.141988 at Kyber-1024. At Kyber-768 matzov uses 0.1770 bits LESS memory,
        so charging there widens the margin and there is no flip at any c >= 0.
        CONSEQUENCE B (the cutoffs, reported in the direction it falls):
        matzov's own EV-MLKEM-020-style c* against 143/207/272 is 0.028803 /
        0.080877 / 0.040268, versus primal_bdd's 0.031646 / 0.045886 / 0.007055.
        So matzov's undercut is MORE memory-robust than primal_bdd's at
        Kyber-768 and Kyber-1024 and slightly less at Kyber-512. ANOM-3 does not
        rescue the security reading - every one of these is one to two orders of
        magnitude below 1/3, exactly as EV-MLKEM-020 found - but it is not
        uniformly more fragile either, and saying otherwise would be as dishonest
        as the overclaim.
        Finally: at Kyber-1024 the reconstructed FFT table is 2^240 cells against
        a claimed total cost of 2^262.34. A cost model that charges nothing for
        2^240 cells of storage is not costing an algorithm anyone could run.
      labelled_inference: >-
        "FFT table = p^{k_fft} cells" is an INFERENCE from the pinned source's
        own time formula (T_fftf at lwe_dual.py:513 costs an FFT over Z_p^k as
        C_mul*k*p**(k+1); T_tablef at 516-523 updates "the table"). It is NOT a
        quotation from MATZOV-2022, whose primary text I did not retrieve. The
        sieve-database figure inherits every sourcing defect EV-MLKEM-020's own
        red team recorded against 2^(0.2075n) (H4/H5, downgraded to
        `construction_with_partial_support`). Independent cross-check that the
        model is at least self-consistent: log2 N = 81.0788 / 119.7530 / 165.9385
        against 0.2075*beta_sieve = 81.1325 / 120.9725 / 166.8300 - the sieve
        produces just enough vectors, on all three sets.
      cheapest_check: >-
        `print(sorted(matzov(Kyber512, red_cost_model=RC.MATZOV).keys()))` versus
        the same for `dual_hybrid(..., fft=True)`. Ten seconds. Then k_fft*log2(p)
        from the same cost dict.

    - id: OBJ-5
      severity: moderate
      target: every "below the NIST cutoff" sentence, in the package and in ANOM-3
      claim_status: unable_to_check (and that is the objection)
      statement: >-
        The denominator of the whole exercise has never been read from primary
        text by this program. The producer's H8 says so
        (`unverified_and_unverifiable_in_this_environment`), EV-MLKEM-020's H11
        says so, EV-MLKEM-015's boundaries say so. Both sources for 143/207/272
        are secondary: a parenthetical in Carrier's abstract and the "Required
        Security Level By NIST" column of MATZOV Table 1. ANOM-3's most
        quotable sentence - "all three FIPS 203 sets below their NIST classical
        cutoffs at 139.66/196.37/262.34" - is a comparison against numbers nobody
        here has verified, in a free-memory gate-count convention, where the
        convention is a deliberately conservative floor for the DEFENDER
        (EV-MLKEM-020 OBJ-10 established this and cited Wiener's own statement
        that counting only processor steps is conservative for the
        cryptographer). Sitting 3.34/10.63/9.66 bits under a deliberately
        conservative floor computed in a model that charges nothing for 2^240
        cells is a statement about a convention. It is not a statement about
        ML-KEM.
      RECOLLECTION_NOT_EVIDENCE: >-
        I have a general impression that NIST's own category definitions are
        stated relative to AES/SHA key search rather than as hard gate-count
        thresholds. I am not asserting that. It is recollection, it is not
        sourced here, and no record may cite this sentence.
      cheapest_check: >-
        `inputs/MLKEM-DUAL-SOURCES-20260802/fips203_selected_text.txt` is in the
        archive. Read it and determine whether it contains a numeric classical
        gate-count floor at all. If it does not, every "below the cutoff"
        sentence must carry the H8 caveat INLINE, not in an appendix.

    - id: OBJ-6
      severity: moderate
      target: EV-MLKEM-015 - "is it wrong, or right about what it named?"
      claim_status: reproduced
      statement: >-
        RIGHT ABOUT WHAT IT NAMED, WRONG IN ITS INFERENCE. I verified the actual
        invocation: `experiments/EXP-MLKEM-015/implementation/reproduce_estimates.py:16`
        reads `from estimator.lwe_dual import dual_hybrid`, and line 43 calls
        `dual_hybrid(params, red_cost_model=cm, fft=fft)`. So the record imported
        the MODULE-LEVEL function directly and never touched the public alias.
        Its observation - 143.79 / 203.79 / 273.82 for "dual_hybrid+fft" - is
        exactly correct for that callable, and the known-answer control I ran
        reproduces the first two at delta <= 3.13e-13.
        What fails is the `inference` field, which says any dual claim
        undercutting those numbers "must justify ingredients beyond the public
        MATZOV dual in lattice-estimator". That sentence identifies the callable
        it ran WITH the public MATZOV dual. `estimator/lwe.py:13` reads
        `from .lwe_dual import matzov as dual_hybrid`, so they are different
        objects differing by 4.132437 / 7.421620 / 11.481588 bits. The same
        conflation appears in the record's boundary line "lattice-estimator
        matzov dual != Carrier polar-code repair", which uses the word "matzov"
        for a function that is not MATZOV.
        The defect is older and wider than one record.
        `experiments/EXP-MLKEM-015/specification.yaml:45` enumerates
        `attack in {primal_usvp, primal_bdd, dual_hybrid}` - the experiment
        CONTRACT never enumerated the estimator's MATZOV implementation. That
        contract passed a validator and a red team in BATCH-001 and was reused
        through BATCH-010; EV-MLKEM-020's VAL-CTRL-A quotes "dual_hybrid
        145.528285" (the fft=False variant), a third distinct number, so the
        BATCH-010 validator inherited the same binding.
      what_a_record_should_say_when_an_api_name_and_its_function_diverge: >-
        Record the FULLY-QUALIFIED CALLABLE ACTUALLY IMPORTED, its defining
        locus, and the pin - never the public alias alone. Concretely:
        "estimator.lwe_dual.dual_hybrid (module-level function over class
        DualHybrid, lwe_dual.py:25/:742) with fft=True, at pin 3e48ef4". Where an
        alias IS used, record the alias AND its resolution and the binding line:
        "LWE.dual_hybrid -> estimator.lwe_dual.matzov, bound at
        estimator/lwe.py:13". A cost figure without a resolved callable and a pin
        is not reproducible; it is a number with a nickname.
      procedure: >-
        Under AGENTS.md rule 4 the fix is a SUPERSEDING record, never an edit to
        EV-MLKEM-015. Under rule 12 - UNMET AND UNWAIVED - ANOM-3 may not be
        treated as correcting it: a correction of a validated evidence record's
        inference is exactly the "contradiction of established evidence" that
        routes to `review-breakthrough` at `max`. This report does not perform
        that correction and does not authorize it.
      cheapest_check: >-
        `sed -n '16p;43p' experiments/EXP-MLKEM-015/implementation/reproduce_estimates.py`
        and `sed -n '13p' estimator/lwe.py` at the pin. Thirty seconds.

    - id: OBJ-7
      severity: moderate
      target: the TASK-20260803-fb52f4 task card (Coordinator authorship)
      claim_status: reproduced (the card is in the dispatch queue)
      statement: >-
        The card biased the deliverable toward a shape that absorbs the scouting
        error. It states the gap as established fact ("Coordinator scouting found
        it is SUPERLINEAR in beta"), poses a two-branch question ("if the
        published analyses are right... if the estimator is right"), and then
        instructs: "decompose the gap into named, individually-sized modelling
        differences and report what each contributes." That instruction
        PRESUPPOSES the gap is made of modelling differences. It contains no step
        "first verify that the two sides name the same attack." The consequence is
        visible in the deliverable: the wrong-callable finding arrives as
        `D1_attack_function_identity`, one row in a table of "named modelling
        differences", rather than as "the comparison object was misidentified".
        The card's two-branch framing also omitted the branch that actually
        obtained; the producer had to supply it itself (gap_report section 6,
        "supports neither branch of the question as posed").
        I record explicitly that the producer did NOT suppress it: D1 is in the
        one-paragraph headline, it is quantified at 96.4/85.4/81.3 percent, and
        section 9 flags the stale card. That is AGENTS.md rule 9 compliance under
        a card that made it awkward.
        WOULD A DIFFERENT CARD HAVE FOUND ANOM-3 SOONER? Yes, and much sooner.
        ANOM-3 is one call to `lwe_dual.matzov`; it took 14.1 s on this machine
        for Kyber-512 and 48.6 s for all three sets. Any card in BATCH-001 through
        BATCH-010 that had said "tabulate every attack this harness actually
        serves, at all three sets, under RC.MATZOV" would have produced it.
        EV-MLKEM-020's own scope_statement records that the served attack set was
        narrower than claimed and that `dual` and `primal_hybrid` fail: the
        campaign audited what does NOT run, across ten batches, and never once
        enumerated what DOES.
      cheapest_check: >-
        Compare `dispatch_queue.json -> tasks[0].handoff.objective` against
        `experiments/EXP-MLKEM-015/specification.yaml:45`. The counterfactual card
        is one sentence: "before decomposing, name the exact callable each
        published figure should be compared against, and verify it is the
        estimator's implementation of that publication's algorithm."

    - id: OBJ-8
      severity: moderate
      target: the Coordinator note's procedural position
      claim_status: reproduced (commit timestamps)
      statement: >-
        The note pre-empts the review it was written to inform, and it was
        written by the role whose scouting error is under review, about the
        significance of the finding that error produced.
        What it does right, and it is a lot: it is labelled "Status: NOT
        EVIDENCE", dated, attributed, scoped to a named snapshot, committed
        durably (0cf03c06, 2026-08-03 15:43:18 UTC, before the successor task at
        6876940e, 15:45:12), it forbids citation as validation, and every factual
        claim in it is stated at a checkable source locus. That is far better
        than leaving the reading undocumented.
        What it does that a Coordinator input to a review should not: (a) it
        answers the reviewer's DESIGNATED LEAD OBJECTION; (b) it instructs the
        reviewer on budget allocation on that question - "the retry should not
        spend its budget re-deriving it"; and (c) it pre-announces the SPLIT,
        "Dissolved - the security reading" / "Survives - the internal finding",
        which is the interpretive verdict that `agents/red-team.md` assigns to
        the red team as `narrowest_supported_statement`. AGENTS.md's model-policy
        section requires "a reviewer that did not originate the claim"; the note
        does not breach that literally, but supplying the reviewer's conclusion in
        advance produces the correlation the requirement exists to prevent.
        The correct form was a QUESTION in the task card - "verify whether `Nf`
        models dependence between score contributions, and state what follows" -
        not a note supplying both the answer and the verdict.
        NET EFFECT HERE: recoverable, and I judge it informed rather than
        controlled this review, but only because I re-derived both facts and found
        one over-read (OBJ-1) and the note's central emphasis quantitatively
        misplaced by two to six orders of magnitude (OBJ-2). Had I complied with
        "do not spend budget re-deriving it", both errors would have propagated
        into EV-MLKEM-021.
      cheapest_check: >-
        Lay the note's "Consequence" section beside the `red_team_report` schema
        in agents/red-team.md and count which fields it fills.

    - id: OBJ-9
      severity: major
      target: the sizing method, and the negative residuals
      claim_status: reproduced (from results.json)
      statement: >-
        The over-attribution is disclosed honestly and diagnosed too kindly. The
        producer states it plainly (gap_report section 4, results.json
        `unattributed_residual: -0.484118`, `fraction_attributed:
        1.1128880857724617`; 1.070009 at Kyber-768, 0.978413 at Kyber-1024) and
        concludes "the true attribution lies between the two rows". That is a
        bracketing story. The real defect is a category error.
        D2, D3 and D4 are NOT differences between the estimator and the
        publication. They are measurements of the ESTIMATOR'S OWN OPTIMISER SLACK
        - grid resolution, unoptimised m, unpassed beta_sieve - applied to ONE
        SIDE ONLY, with no matching relaxation of Carrier's fixed published
        number. Only D1 is of the type the card asked for. Summing type-(ii)
        quantities into a column headed "total attributed" and comparing it to a
        gap is what produces parts exceeding the whole on two of three sets.
        Two consequences the report does not draw:
        (a) "The residual brackets zero and does not scale" is NOT corroboration.
        A one-sided relaxation started above a target will cross it, for any
        target it started above; the crossing carries no information about
        Carrier. The report presents it as the decomposition landing on the
        answer.
        (b) The producer's own H9 `cost_to_the_conclusion` states the search boxes
        are LOCAL (p in [2,8], k_enum/k_fft/beta +-8, m over [0.6n, n]) and that a
        global re-optimum would be lower still. That means a wider search makes S4
        strictly cheaper than Carrier on all three sets, and "the pinned public
        estimator reproduces Carrier's published headline" degrades into "the
        estimator undercuts Carrier by an amount bounded only by the size of the
        search box." The agreement is a property of the box.
        PRECISION: the D1-only row (+0.156041 / +1.266243 / +2.635680) is the only
        defensible accounting, and even it is quoted to six decimals while H17's R
        = 2^9.39 / 2^9.49 / 2^15.15 (archived Table C.2, CC rows) sits unmapped in
        the source's own intermediate table - a 9 to 15 bit unmapped factor
        against a 0.16 to 2.64 bit residual. One decimal place is the most this
        supports.
      cheapest_check: >-
        Re-run stages 2-4 with the boxes doubled (p in [2,16], k_enum/k_fft/beta
        +-16). If S4 keeps falling, (b) is confirmed. The report's own section 8
        item 4 predicts it will. Roughly 60 s.

    - id: OBJ-10
      severity: minor
      target: were the rejected explanations dismissed too quickly to protect D1?
      claim_status: reproduced (two rejections), strengthened (one)
      statement: >-
        NO - the rejections were not made to protect D1, and I say so plainly.
        Core-SVP-vs-gates: correctly rejected. 24.15/22.04/20.58 bits against a
        4.29/8.69/14.12 gap, and its parameter-scaling has the WRONG SIGN (it
        shrinks while the gap grows). Both sides' units are quoted from archived
        bytes. No objection.
        Sieve cost model: correctly rejected and independently corroborated.
        GJ21-MATZOV = 5.5551/6.5465/6.2462 reproduces MATZOV's own "cost of
        sieving reduced by ~6 bits in rank 400", and it is roughly FLAT in beta,
        so it cannot be the growth term. No objection.
        Dimensions-for-free: this is the one whose stated justification is weak.
        Its magnitude (7.9984/10.3055/12.9912) AND its growth shape both match the
        gap, so it is D1's direct competitor, and the evidence that Carrier applies
        it identically is a paraphrase of MATZOV's text plus "Carrier's Table C.1
        prints two block-size columns" - an inference, where the sieve-model
        cancellation had a quotation. BUT I checked the archive myself and the
        conclusion survives on stronger grounds than the report gives. Carrier CC
        (beta_bkz, beta_sieve, log2 N) from
        inputs/MLKEM-DUAL-SOURCES-20260802/extracts/carrier-hal-05406481/page37_tables_C1_C2.txt
        = (384, 387, 80.31) / (581, 574, 119.12) / (811, 792, 164.35), against the
        estimator's matzov stage-1 (387, 391, 81.0788) / (589, 583, 119.7530) /
        (823, 804, 165.9385). A d4f convention differing by the 8-13 bits at stake
        could not leave two independent optimisers within 2-12 on every block size
        and within 0.63-1.59 bits on log2 N. So: the report's reason is thin, the
        conclusion is right, and the right reason is one the report has the data
        for and does not use.
        ONE CAVEAT ON THAT SAME AGREEMENT: the report calls the parameter
        convergence "the strongest non-numerical corroboration available". It
        corroborates IMPLEMENTATION FIDELITY - which is a genuine, partial,
        affirmative answer to the note's own open question 2 - and it does NOT
        corroborate model soundness. Two near-identical cost models landing on
        near-identical optima is expected, not surprising.
      cheapest_check: The table comparison above, both files already in the repo.

    - id: OBJ-11
      severity: minor
      target: inventor-protocol section 5 compliance
      claim_status: reproduced
      statement: >-
        `grep -rn "dominated_by\|sota_delta"` over the entire package returns
        NOTHING. This is the same defect EV-MLKEM-020 recorded as OBJ-9 for
        BATCH-010, recurring one batch later. It is not cosmetic here: the Pareto
        axis that decides ANOM-3 is memory, and OBJ-4 shows memory is uncharged
