  required_controls:
    - id: RC-1
      name: THE NULL OBJECT ANOM-3 STILL LACKS
      statement: >-
        Nothing in this batch has run the identical comparison against a null
        object of the same shape. The cheapest one that discriminates: cost
        `matzov` and `primal_bdd` under RC.MATZOV on an LWE instance with the
        SAME (n, q, m) as Kyber but a secret/error distribution for which the
        dual distinguisher provably cannot work (e.g. uniform-mod-q secret and
        error). If matzov still "beats" primal_bdd there by a similar per-beta
        slope, the ordering is a property of the two cost formulas rather than of
        the attacks. Inventor protocol section 3 requires this before belief; it
        has not been run.
    - id: RC-2
      name: THE DECAY TEST, EXTENDED
      statement: >-
        My section I is the first decay test ANOM-3 has had, and it is
        incomplete: Kyber-768 and Kyber-1024 were not bracketed at N x 2^16.
        Extend to 2^24 and 2^32 and report delta_flip for all three. A finding
        that survives 32 bits of N-inflation at Kyber-1024 while dying at 2.4
        bits at Kyber-512 is a much more informative object than "dual beats
        primal".
    - id: RC-3
      name: SAGE COVER FOR THE UNCOVERED PATH
      statement: >-
        See `next_concrete_action`. Kyber-768 and Kyber-1024 `matzov` have no
        Sage-computed reference of any kind. Producer H4/H5 say so; my CTRL-RT-2
        covers Kyber-512 only, via the estimator's own committed doctest.
    - id: RC-4
      name: BOX-DOUBLING CONTROL
      statement: OBJ-9(b). Re-run stages 2-4 with doubled search boxes.

  counterexample_or_mutation: >-
    The sharpest single mutation I ran: inflate `Nf`'s output by 2^delta - the
    exact direction in which the Ducas-Pulles objection acts - and let the
    attacker fully re-optimise inside RC.MATZOV. At Kyber-512 ANOM-3 is gone at
    delta = 2.3732 bits; at Kyber-768 and Kyber-1024 it survives delta = 16. The
    subclass reproduces the pinned optimum at delta = 0 to EXACTLY 0.000e+00 on
    all three sets, so the mutation is controlled. I do NOT know Ducas-Pulles's
    repaired constant and did not invent one; this is a sensitivity, not a
    correction, and it is labelled as such.
    Second mutation, cheaper: the mu sweep (OBJ-2), which shows the knob the
    Coordinator note names is worth at most 0.267033 bits.

  baseline_comparison:
    ecdlp_baselines_not_applicable:
      statement: >-
        `agents/red-team.md` responsibility 2 names Pollard-rho, BSGS and the
        closest specialized baseline. The target here is Module-LWE at FIPS 203
        parameters, not an ECDLP instance; rho and BSGS have no meaning against
        it. Recording why rather than silently omitting, per inventor protocol
        section 8's rule on non-applicable audits.
    closest_specialized_baselines_actually_compared:
