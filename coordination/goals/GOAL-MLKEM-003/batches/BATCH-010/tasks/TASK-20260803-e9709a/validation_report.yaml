  independent_implementation:
    summary: >-
      I re-derived the model from the archived text before reading the producer's
      code, and implemented it independently: the survival function is integrated
      in u (the producer integrates in v = ln(N/u)), with the clip kink placed
      exactly at u* = N exp(-K^{-1/p}), the clipped piece in closed form
      Q(T-u*) - Q(T), and the prediction written as
      pred(T) = Q(T-u*) + K * INT_{u*}^{N} phi(T-u) (ln(N/u))^p du.
      Panel layout (geometric near u*, then two linear regimes), Gauss-Legendre
      order, and the K search (golden section on u*) are all my own. Quadrature
      convergence was checked by raising GL order 8 -> 12 -> 16 and by roughly
      trebling panel density: every reported rms and log2 K was identical to
      9 decimal places across all four settings.
    derivation_check: >-
      Integration by parts of E[Q(T-D)] with S(u) = min(1, K (ln(N/u))^p)
      reproduces the BATCH-009 model statement
      Pwrong = Q(T) + INT_0^inf N e^{-v} phi(T - N e^{-v}) min(1, K v^p) dv
      exactly, so the two implementations compute the same object.

