        than its own 26.0 (0.705494). n=50 data under 26.0 gives 1.020420, WORSE
        than its own 24.5 (0.696881). Discrimination remains one-sided, exactly
        as EV-MLKEM-019 O-6 recorded, and the n=43 minimum lies a further 1.25
        below 24.5.

    - id: C-3
      name: >-
        IDENTIFIABILITY / NULL-OBJECT CONTROL (added by this validator; the
        package does not contain it)
      status: added_and_passed
      motivation: >-
        docs/inventor-protocol.md section 3: a reported signal is an artifact
        until the identical measurement has been run against an object of the
        same shape whose answer is known. Check A reports an adverse signal - the
        archived exponent is not the argmin - with no such control. The
        estimator itself (profile K at every p, unweighted rms over 1803
        correlated scores) could in principle be biased low in p.
      method: >-
        Deterministic, no sampling. Replace the measured curve by the model's own
        NOISELESS prediction at the file's archived (p, K-bar), then run the
        identical profiled-rms scan against it. If the estimator is unbiased it
        must return the generating exponent.
      result: >-
        n=43: generating p=26.0, log2 K=-72.712581 -> argmin p=26.00, rms
        0.00000000, recovered log2 K -72.712581. n=50: generating p=24.5,
        log2 K=-67.222505 -> argmin p=24.50, rms 0.00000000, recovered log2 K
        -67.222505. The estimator is exactly unbiased on noiseless data, so the
        observed 2.75 / 2.25 displacement is NOT an artifact of the fit protocol,
        the band weighting or the free scale.
      second_result_worth_recording: >-
        On the same noiseless data a 2.75 displacement costs 0.535 bits of rms
        (n=43; 0.537 at 2.25 for n=50). On the REAL data the excess at the own
        exponent is only 0.280 bits and the BEST ACHIEVABLE rms is 0.426 bits,
        not zero. So the one-free-parameter family does not fit the archived
        curve at ANY exponent in the scanned window: the argmin is the least-bad
        member of a misspecified family, not a competing correct exponent. The
        package does not make this distinction and it materially changes what
        Check A licenses.
      what_this_control_does_NOT_establish: >-
        It says nothing about noise. The control that would - resampling the
        survival curve under its counting model and asking how far the argmin
        moves - is a simulation and is forbidden by the handoff's ZERO NEW
        SAMPLING constraint. No significance can therefore be attached to the
        displacement; see limitation L-2.

    - id: C-4
      name: >-
        band-weighting robustness (added by this validator; the package reports
        one alternative weighting, I ran six)
      status: added
      method: >-
        For each weighting, K is profiled and the rms is reported on the SAME
        index set (a cleaner profile than the package's whole-band-fitted K with
        sub-band rms), on the same own-p +/- 6.0 step-0.25 grid.
      result_n43_own_p_26.00: >-
        whole band (n=1803): argmin 23.25, own 0.705494, excess +0.279779;
        count>=10 (1493): argmin 22.25, excess +0.394369;
        count>=100 (1137): argmin 21.25, excess +0.482704;
        count>=1000 (852): argmin 20.00 AT THE GRID EDGE, excess +0.568423;
        head T<=600 (601): argmin 20.00 AT THE GRID EDGE, excess +0.200198
          (18.00, also at the edge, on a wider 0.5-step grid);
        every 20th (92): argmin 23.25, excess +0.274397;
        tail T>1000 (802): argmin 26.25, excess only +0.000935 - and on a
          0.5-step grid the argmin is exactly the own exponent 26.00 with excess
          0.000000.
      result_n50_own_p_24.50: >-
        whole band (2310): argmin 22.25, excess +0.269469;
        count>=10 (1969): argmin 21.75, excess +0.336507;
        count>=100 (1525): argmin 21.00, excess +0.375763;
        count>=1000 (1132): argmin 20.00 (interior), excess +0.452467;
        head T<=600 (601): argmin 18.50 AT THE GRID EDGE, excess +0.387722;
        every 20th (117): argmin 22.25, excess +0.257880;
        tail T>1000 (1309): argmin 23.75, excess +0.028129.
      interpretation: >-
        The argmin location is NOT weighting-invariant, and the package's own
        section 3.3 says so. But every LOW-NOISE weighting moves it FURTHER below
        the own exponent and makes the excess LARGER, not smaller. The single
        weighting that reverses the direction is the deep tail T>1000, which is
        precisely the region where the counting estimate is least resolved:
        the naive independent-trial sd of log2 P-hat there has rms 0.613 bits
        (n=43) and 0.445 bits (n=50), against residual rms of 0.266 and 0.244 -
        i.e. the tail cannot discriminate anything. By contrast the count>=1000
        sub-band carries a naive sd rms of 0.015 bits and puts the argmin 6.00
        (n=43) and 4.50 (n=50) BELOW the own exponent. So the weighting
        dependence does not undercut the Check A conclusion; if anything the
        whole-band protocol understates it. The tail exception nevertheless
        belongs on the record - see defect D5.

    - id: C-5
      name: negative / degenerate controls inside Check B
      status: reproduced
      result: >-
        R1 at s = 0 and R2 at a = 0 must both reproduce the collapsed model
        exactly; my independent implementation gives Delta = 0 to 1e-13 and 0.0
        respectively, matching the producer's 9.9e-14 / 2.7e-13 / 0.000000.
        R1 at s -> infinity must saturate at the Q(T) floor; it does, at
        -2.026543 and -2.333465, which is the reading-free bound itself.

    - id: C-6
      name: null-object control in the docs/inventor-protocol.md section 3 sense
      status: absent_and_not_possible_here
      note: >-
        The measured quantity in Check A is an rms misfit, not a correlation or
        excess, so the canonical "does it decay when the parameter meant to
        destroy it increases" tell does not directly apply. The nearest available
        analogue is C-3 (does the estimator recover a known answer on an object of
        the same shape), which I ran and which passes. A random-instance null -
        an archived Pwrong curve from a lattice with no dual-attack structure -
        does not exist in the archive and cannot be produced under ZERO NEW
        SAMPLING.

  the_two_checks_answered:

    check_A_exponent_neighbourhood:
      outcome: ONE-SIDED AND ADVERSE TO APPROXIMATION 4.9. Not two-sided, not favourable.
      independently_reproduced: true
      statement: >-
        Recomputing the n=43 rms-vs-p curve from the archived .out bytes with my
        own implementation - reading the data myself, integrating in a different
        variable, with my own quadrature and my own K search, and never reading
        results.json for a value - I obtain the argmin at p = 23.25 with whole-band
        rms 0.425714, against 0.705494 at the file's own archived exponent 26.0,
        an excess of +0.279780 bits. I did the same for n=50 and obtain argmin
        p = 22.25 with rms 0.427412 against 0.696881 at its own 24.5, excess
        +0.269469. Both curves are strictly unimodal over their 49-point grids,
        both argmins are interior (13 and 15 grid steps from the nearest edge,
        with rms rising monotonically on both sides), and quadrature is converged
        to 9 decimals. The producer's numbers are correct.
      is_the_argmin_real: >-
        Yes as a point estimate, and it is not an artifact of the estimator: the
        identifiability control C-3 shows the same scan returns the generating
        exponent exactly, with rms 0, on noiseless data generated by the model
        itself at the archived (p, K-bar). It is also not scan-width limited on
        the whole band. Its STATISTICAL significance is not established and
        cannot be under this handoff's constraints (limitation L-2).
      does_log2_K_absorb_the_exponent_change: >-
        No, but not for the reason the package gives. I confirm the arithmetic:
        the fitted log2 K moves at -1.72910 bits per unit p (n=43, full grid) and
        -1.63376 (n=50 full grid; -1.642 locally, so the report's "-1.65" is the
        local figure), with maximum departure from a straight line of 0.135 and
        0.110 bits over a ~20-bit span. But linearity of log2 K in p is a
        property of the family - K is essentially v_eff^{-p}, so log2 K is
        -p log2 v_eff by construction - and carries no information about
        absorption. What actually establishes non-absorption is that K is
        profiled out at every p and the resulting profiled rms is still strongly
        non-flat, plus control C-3. The conclusion stands; the stated
        justification does not support it (defect D3).
      does_the_sub_band_weighting_undercut_it: >-
        No. It moves the argmin - I reproduce the package's count>=10 shift for
        n=43 (22.50) and find the n=50 one to be an unresolved tie between 21.75
        and 22.00 - but every low-noise weighting I added moves it FURTHER below
        the own exponent and enlarges the excess (count>=1000: -6.00 and -4.50
        grid positions, excess +0.568 and +0.452). The only weighting under which
        the own exponent is competitive is the deep tail T>1000, where for n=43
        the own exponent IS the argmin to 0.001 bits - and where the counting
        uncertainty is more than twice the residual, so nothing is discriminated.
        The package should have said this; it does not (defect D5).
      what_it_does_and_does_not_license: >-
        LICENSED: over the resolved band, with the normalisation fitted to the
        compared data, the archived exponent p = (beta_sieve+n_fft)/2 is not the
        exponent this shape comparison selects, in EITHER file, and both files
        select a lower one. This extends EV-MLKEM-019's single-instance O-6 to a
        full curve and strengthens it. NOT LICENSED: any statement that
        Approximation 4.9 is refuted, that the true exponent is 23.25 or 22.25, or
        that the displacement is statistically significant. The best achievable
        rms is 0.426 bits, not 0, so the family is misspecified at every exponent
        tested; the argmin is the least-bad member of a family none of whose
        members fit. That is a weaker claim than "a neighbouring exponent is
        right" and a different one from "Approximation 4.9's exponent is wrong".

    check_B_jensen_bias:
      outcome: >-
        REPRODUCED IN FULL, INCLUDING ITS OWN LIMITATION. The sign is fixed; the
        magnitude is not, and the package says so correctly.
      independently_reproduced: true
      position_of_the_d_lsc_integral: >-
        CORRECT. Archived (4.22) places min(1, INT_{E(T-t)} lambda mu) inside the
        d_lsc integral, and (4.27)-(4.29) plus the closing display
        P(D>T) = INT psi_lsc(d) P(D>T|d) dd say the same. The producer's
        W(v) = E_d[min(1, k(d) v^p)] is exactly that order, and BATCH-009's
        min(1, K-bar v^p) is exactly the collapsed one. BATCH-009's own STEP 3
        note concedes the collapse is exact only "in the unclipped regime", and
        the clipped fraction at both peak scores is 0.377-0.378, so the collapse
        is not exact where it matters. See D7 for a textual counterweight the
        package omits.
      K_bar_held_fixed: >-
        YES, verified three independent ways (M-36). There is no re-fit and no
        silent re-optimisation. Delta therefore isolates the position of
        min(1,.) alone, which is what the handoff asked for.
      sign_result: >-
        CORRECT AND CORRECTLY DERIVED. min(1,.) is concave, so for any family with
        E_d[k] = K-bar, E_d[min(1, k v^p)] <= min(1, K-bar v^p) pointwise in v,
        hence P_in <= P_out and Delta <= 0. I verify this numerically at every
        scanned point of both readings. The (4.22)-position model predicts LESS,
        i.e. the collapse biases in the SAME direction as the reported
        over-prediction.
      magnitude_provenance_audit: >-
        THE PACKAGE'S ATTRIBUTION IS CORRECT, and this is the claim a reader is
        most likely to invert. Concavity gives only the sign: with the mean held
        at K-bar v^p, a two-point mean-preserving spread (Z = M with probability
        m/M, else 0) drives E[min(1,Z)] to m/M -> 0, so no bound on |Delta|
        follows from concavity at all. The finite lower bound comes from a
        different fact - Model 4.7's D component is non-negative, so
        P_in(T) >= Q(T), hence Delta >= log2 Q(T*) - log2 P_out(T*). I recompute
        that difference as -15.771008 + 13.744464 = -2.026543 (n=43) and
        -13.098605 + 10.765140 = -2.333466 (n=50), matching the package. The two
        over-predictions (+1.515408, +1.710856) do lie inside those bounds, so the
        collapse is NOT excluded on magnitude grounds.
      is_the_bias_large_enough_to_account_for_the_over_prediction: >-
        NOT EXCLUDED, NOT SUPPORTED, AND READING-DEPENDENT WITH THE READING
        UNAVAILABLE. Three answers at three levels of commitment:
        (i) Reading-free: yes, arithmetically it could be - but the bound is close
        to vacuous. It says only that the corrected model cannot fall below its
        own Gaussian floor Q(T*), and that floor happens to sit just 0.511 bits
        (n=43) and 0.623 bits (n=50) BELOW the measurement. Saturating it requires
        the D component to contribute essentially nothing at the peak score,
        which R1 shows needs s >= 12 nats.
        (ii) Under R1, the pure-scale dispersion family - which is, notably, the
        family BATCH-009's own STEP-2 multiplicative Phi implies - absorbing the
        whole over-prediction needs s = 4.480840 / 4.394843 nats, i.e.
        sd(log2 k) = 6.46 / 6.34 bits: the effective normalisation would have to
        swing by ~6.4 bits per standard deviation of d_lsc, on a variable whose
        own mean-to-sd ratio is only 7.08. Nothing in the archive suggests
        dispersion of that size.
        (iii) Under R2, the only reading the archived text motivates ((4.19)
        forces exp(-a d_lsc^2) inside Phi), evaluated at the only numerically
        archived candidate for alpha (=2), the correction is -0.004705 and
        -0.004614 bits: 0.31 % and 0.27 % of the over-predictions. Even at
        a*mu_lsc^2 = 3 (alpha ~ 31) it reaches only about half.
        My verdict on the question as posed: the Jensen collapse cannot be
        excluded as an explanation, but there is no positive evidence for it, and
        the single textually-motivated calibration accounts for about a
        three-hundredth of the effect. The BATCH-009 headline over-prediction
        therefore remains unattributed, which is exactly what the package says.
      caveats_the_package_states_and_I_confirm: >-
        R2's per-L mean-matching normalises away the shift reading's additional
        effect on the unclipped LEVEL (DEP-B4), so 0.31 % bounds only the
        min-position part of that reading, not its total effect. And Delta is
        computed with K-bar frozen; the corrected model's best achievable fit is a
        different question the handoff forbade asking. Both are stated in the
        package.

  heuristic_validation_checks:
    - check: pre-registered prediction
      status: not_applicable_as_stated
      note: >-
        Approximation 4.9 is a published theoretical prediction, fixed before the
        archived simulation and independent of this batch; its exponent
        p = (beta_sieve + n_fft)/2 is determined entirely by archived integers.
        In that sense the prediction is pre-registered. What is NOT pre-registered
        is the normalisation K, which is fitted to the very curve being scored -
        the decisive scope limit EV-MLKEM-019 already records. Neither check in
        this batch relaxes it.
    - check: sample integrity
      status: partial
      note: >-
        The archived .out files carry their own headers (q, m, n, n_fft, k_fft,
        n_lat, beta_0, beta_1, avg_N, avg_dlat/sdv_dlat, avg_dlsc/sdv_dlsc,
        nb_iteration) and their sha256 is verified in the package and again here.
        No seed for the original G6K/polar-code simulation is archived; that is a
        pre-existing property of the vendor data, not a defect of this batch. Both
        BATCH-010 scripts are deterministic and correctly record that no seed
        exists.
    - check: correspondence validity
      status: not_applicable
      note: no substitute-sampling correspondence is used.
    - check: scale binding
      status: satisfied_as_a_limitation
      note: >-
        q=241, m=40, n=43/50, beta_sieve 41/44 - toy, against Kyber's beta of
        roughly 384-816. Recorded as a limitation in the package and here, never
        as scale-matched evidence (AGENTS.md rule 7).
  cost_model_checks:
    - check: cost table present
      status: not_applicable
      note: >-
        The package reports no cost model, no operation counts and no security
        estimate, and explicitly revises none. There is therefore no cost unit to
        declare and no per-attempt-cost x inverse-success-probability bookkeeping
        to check. Recorded explicitly rather than left blank.

  proof_architecture_checks:
    - check: baseline fixture
      status: passed
      note: >-
        The package reproduces the BATCH-009 headline whole-band rms and peak
        delta at the archived (p, log2 K_fit) to within 0.00066 bits, attributes
        the residual difference to the exact-kink clip treatment (DEP-A1), and
        that attribution is corroborated by the BATCH-009 validator's independent
        recomputation with the same treatment. I reproduce all four numbers.
    - check: strictness witness
      status: not_applicable
      note: no improvement over a baseline is claimed.
    - check: bounded-search scope
      status: passed_with_note
      note: >-
        The exponent scan is explicitly bounded to own p +/- 6.0 in steps of 0.25
        and the package reports the grid and the boundary flag. It does not claim
        a global argmin over all p. Under two of my added weightings (count>=1000
        for n=43, head T<=600 for both) the argmin runs to the grid edge, so the
        scan width IS binding there and the package's "neither is scan-width
        limited" applies only to the whole-band protocol it reports. Recorded.
    - check: interface preservation
      status: passed
      note: >-
        Every departure from the BATCH-009 implementation (DEP-A1..A4, DEP-B1..B5)
        is declared with its motivation and its quantified effect on the reported
        numbers, and each is honoured in the committed code as written. I checked
        each against the code and found no undeclared departure.
    - check: quantifier fidelity
      status: passed
      note: >-
        Check A's claims are per-file and stated per-file; no uniform statement
        over both files is asserted beyond "in neither file", which is what the
        two per-file results support. Check B's magnitudes are stated as
        conditional on a declared, scanned parameter and never as a number.

  defects:
    - id: D1
      severity: moderate
      title: >-
        results.json - the only machine-readable receipt - carries none of the
        AGENTS.md artifact-policy provenance fields
      detail: >-
        Missing from results.json: git commit sha, dirty-tree state, exact
        command, the `inference` block (requested_policy, resolved_model,
        fallback_used, model_verified, reasoning_effort), any determinism/seed
        statement, memory measurement, stderr, validity status and reason, and any
        run or execution identifier. All of the first group exist only as prose in
        report.md, which no schema checks; memory, stderr and validity status
        exist NOWHERE in the package, even though `ulimit -v 4194304` was applied
        and the handoff budget names memory_gb: 4.
      on_DEV_1: >-
        The Coordinator has accepted that the absent runs/<RUN-ID>/ tree is the
        handoff's fault, and I agree - the handoff declared exactly four artifact
        paths and a runs/ tree would have expanded scope. But that explains only
        the missing DIRECTORY. Nothing prevented these fields from being carried
        INSIDE results.json, which the handoff did declare. So the answer to
        "are the required provenance fields genuinely present inside
        results.json" is NO: they are present in report.md prose, partially, and
        the machine-readable receipt is not self-describing. This is a packaging
        defect that a schema check would catch, and it is the kind that
        compounds: a future reader of results.json alone cannot bind it to a
        commit.
      not_a_repair_request: reported, not fixed; producer artifacts are untouched.
    - id: D2
      severity: minor
      title: DEV-3's "executed exactly once" is unverifiable from the archive
      detail: >-
        See M-41. No run counter, no execution identifier, and results.json is
        overwritten by the second script by design, so the committed bytes cannot
        witness the first execution. Timestamps are consistent with the claim but
        consistency is not verification. The disclosure itself is creditable -
        it was volunteered, and it directly addresses the BATCH-009 D6 pattern -
        but the package does not carry the one field (a run tally, as BATCH-009's
        own package did carry) that would let a reader check it. Recommendation
        for the successor handoff, not a fault of this executor.
    - id: D3
      severity: moderate
      title: >-
        "log2 K moves linearly, confirming the free scale does not absorb the
        exponent change" is a non sequitur
      detail: >-
        Report section 3.2, repeated in the snapshot commit message. Linearity of
        the profiled log2 K in p is forced by the model family (K is essentially
        v_eff^{-p}) and would hold whether or not the scale absorbed anything. The
        conclusion is nevertheless TRUE - K is profiled out at every p, so the
        rms-vs-p curve already is the profiled objective, and control C-3 confirms
        the estimator recovers a known exponent exactly. But the load-bearing
        sentence in the headline finding rests on an argument that does not carry
        it, and a reader auditing only the report would find no valid support for
        it. Substituting the correct argument costs nothing.
    - id: D4
      severity: moderate
      title: no identifiability / null-object control on an adverse signal
      detail: >-
        docs/inventor-protocol.md section 3 requires a signal to be measured
        against an object of the same shape before belief. The package reports an
        adverse signal with no such control. I supplied the one that is possible
        without new sampling (C-3) and it PASSES, so the finding survives - but a
        validator should not have to be the first to run it, and had it failed the
        entire Check A result would have been an artifact of the estimator.
    - id: D5
      severity: minor
      title: weighting-robustness picture is understated, and the tail exception is unreported
      detail: >-
        Section 3.3 reports one alternative weighting and concludes "the direction
        of the finding is unchanged". Across the six weightings I ran (C-4) that is
        true for five and FALSE for one: on the deep tail T>1000 the n=43 own
        exponent is the argmin to 0.001 bits (exactly the argmin on a 0.5-step
        grid), and for n=50 the tail argmin is only 0.75 below the own exponent
        with excess +0.028. That the tail is also the least-resolved region -
        naive counting sd rms 0.613 / 0.445 bits against residual rms 0.266 /
        0.244 - is what makes the exception uninformative, and it is what the
        package would have needed to say. As reported, the sentence is broader
        than the evidence behind it. The overall direction of Check A is
        unaffected and is in fact strengthened by the low-noise weightings.
    - id: D6
      severity: trivial
      title: report.md prose disagrees with the package's own results.json
      detail: >-
        DEP-B5 in report.md quotes P(d_lsc < 0) = 7.2e-13 for n=43; results.json
        records 6.973e-13 and I recompute Phi(-7.084584) = 6.973e-13. No reported
        number depends on it.
    - id: D7
      severity: minor
      title: >-
        the countervailing textual element for the d_lsc position is not
        mentioned
      detail: >-
        The package's Check-B premise rests on (4.22), (4.27)-(4.29) and the
        closing display, all of which put the d_lsc integral outside min(1,.), and
        I confirm that reading. But the same paper's Model 4.7 DEFINES D at (4.18)
        as D = N INT psi_lsc(d_lsc) max_{i,j: N_{i,j}=1} Phi_{d_lsc}(i,j) d d_lsc -
        with the d_lsc integral INSIDE, which is the textual basis a defender of
        the BATCH-009 collapse would cite, and which makes the very phrase
        "the survival function of D knowing d_lsc" in the (4.27) justification
        ill-typed. The source is internally inconsistent on precisely the point
        Check B is about. This changes nothing about the sign or the bound, but it
        changes how confidently the collapse can be attributed to the BATCH-009
        IMPLEMENTATION rather than to the SOURCE, and a package whose whole
        purpose is to locate that integral should have recorded it.
    - id: D8
      severity: trivial
      title: n=50 count>=10 sub-band argmin does not reproduce as a located point
      detail: >-
        See M-19. Producer: 21.75 with 0.401645. Mine: 21.75 -> 0.401779 and
        22.00 -> 0.401772, a 7e-6 tie. Consistent with the 7.5e-4-bit difference
        in the two implementations' fitted log2 K, which is not optimal for a
        sub-band. The reported location is below the resolution of the method that
        produced it; the direction is unaffected. Reporting it to six decimals
        overstates its determinacy.

  reproduction_tally:
    reproduced: 37
    not_reproduced: 2
    unable_to_check: 4
    tally_basis: >-
      Counted over the 43 rows of metric_recomputations (M-01..M-43). The
      control_checks C-1..C-6 are counted separately below. One further item -
      the statistical significance of the Check A displacement - is not a
      producer claim and is recorded as limitation L-2 rather than as a
      reproduction row.
    controls_added_by_validator: 2
    controls_added_that_passed: 1
    controls_added_that_qualify_the_finding: 1

  limitations:
    - id: L-1
      text: >-
        Shape only, never level. K is fitted to the compared data at every p in
        Check A and frozen at the BATCH-009 fitted value in Check B. Neither check
        tests the absolute level of Approximation 4.9. delta(beta_bkz), alpha and
        the form of Phi_{d_lsc} remain the blockers, exactly as EV-MLKEM-019
        recorded. Nothing here changes that.
    - id: L-2
      text: >-
        NO SIGNIFICANCE IS ESTABLISHED FOR THE CHECK A DISPLACEMENT. The rms is an
        unweighted average over 1803 (or 2310) highly correlated survival points
        with no error model. Control C-3 rules out estimator bias in the absence
        of noise; it says nothing about noise. The control that would - resampling
        the survival curve under its counting model - is a simulation and is
        forbidden by this handoff's ZERO NEW SAMPLING constraint. As an order of
        magnitude only, the naive independent-trial sd of log2 P-hat is 0.002 bits
        at score 500, 0.088 at 1000, 0.456 at 1492 and 1.443 at the floor; the
        counts are strongly positively correlated across scores so this overstates
        point-to-point scatter and understates coherent level error. Read the
        2.75 / 2.25 displacement as a point estimate, not as a test.
    - id: L-3
      text: >-
        Check B's magnitude is conditional on a declared reading that the archive
        does not carry. Phi_{d_lsc} and alpha are UNAVAILABLE; I re-confirmed that
        the archived page extracts give Phi only as an undefined symbol and give
        alpha no numeric value. The Pgood header's alpha_secret = alpha_error = 2
        is not established to be the paper's alpha and neither the package nor I
        adopt it as such. R1 and R2 differ by a factor of about 3.2 at comparable
        dispersion, so the reading matters and is not resolved.
    - id: L-4
      text: >-
        Toy scale, both files. q=241, m=40, n=43/50 against Kyber's beta of
        roughly 384-816. This report establishes nothing about ML-KEM security in
        either direction and must never be cited as bearing on it.
    - id: L-5
      text: >-
        I re-executed neither producer script. My agreement with them is agreement
        between two independent implementations of the same mathematics, which is
        stronger for the numbers and weaker for the code: a bug that lives only in
        the committed scripts' I/O or bookkeeping (rather than in the model) would
        not be caught by this method. Byte-level re-execution of the committed
        scripts remains undone.
    - id: L-6
      text: >-
        The package's own internal self-checks (M-39) were not re-executed; my
        independent convergence evidence supersedes them in substance but is not
        the same check.

  verdict: passed
  package_verdict: ADMISSIBLE_WITH_DEFECTS
  verdict_scope: >-
    ADMISSIBLE_WITH_DEFECTS means: the four artifacts exist, are committed, are
    bound to the snapshot commit, and every headline quantity in them that a
    deterministic verifier can reach was re-derived here from the archived bytes
    by an independent implementation and agreed - Check A's argmins, excesses,
    curves and cross-exponent numbers to 1e-6 bits, and Check B's P_out, Q(T*),
    bounds, R1 and R2 scans and required dispersions to 6 decimals. The eight
    defects are packaging (D1, D2), one unsupported inference behind a true
    conclusion (D3), a missing control that I supplied and that passed (D4), an
    understated robustness picture with one unreported adverse-to-the-finding
    exception (D5, D8), a prose/record mismatch (D6), and one omitted textual
    counterweight (D7). None of them changes a reported number.
    IT DOES NOT MEAN: that Approximation 4.9 is refuted, that its exponent is
    wrong, that the collapse explains the BATCH-009 over-prediction, or that
    anything here bears on ML-KEM. This report authorizes no promotion and no
    status change. AGENTS.md rule 12 remains UNMET and UNWAIVED; EV-MLKEM-011,
    EV-MLKEM-013 and EV-MLKEM-017 keep their status.

  headline_for_the_coordinator: >-
    CHECK A CAME BACK ONE-SIDED AND ADVERSE, AND IT SURVIVES INDEPENDENT
    RE-DERIVATION. Neither file's own Approximation-4.9 exponent minimises rms
    against its own data; both argmins lie below, by 2.75 and 2.25, on strictly
    unimodal interior minima, and the estimator provably recovers a known
    exponent on noiseless data of the same shape. The finding is if anything
    understated: every low-noise sub-band weighting pushes the argmin further
    below. Two qualifications the package does not make and the Coordinator
    should carry forward: (a) the best achievable rms is 0.426 bits, not 0, so
