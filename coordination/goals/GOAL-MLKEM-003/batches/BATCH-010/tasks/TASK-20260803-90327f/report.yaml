  unable_to_check:
    - item: The NIST classical cutoffs 143 / 207 / 272 (H11).
      reason: >-
        Inherited from RUN-MLKEM-015-001 and corpus entries. No FIPS 203 or NIST
        call text is readable under this program's network policy, exactly as
        EV-MLKEM-015 recorded. The validator did not re-derive them and does not
        endorse them. Consequence, quantified by the producer and confirmed by the
        validator: a one-bit cutoff error moves c* by 0.0113 / 0.0076 / 0.0055 --
        which is 78% of Kyber-1024's entire c*.
    - item: BDGL16 as primary source for the 0.2075 exponent (H4).
      reason: >-
        Not retrieved by the producer and not retrieved by the validator. What IS
        verified is the exponent as the pinned instrument uses it (reduction.py:415,
        :854, :936 all write the literal 0.2075) and its closed form
        log2(sqrt(4/3)) at |delta| 1.874964e-05. The corpus citations
        (KN-LIT-104 / 6625 / 6765 / 081, KN-TECH-044, KN-OPEN-017) were not
        independently opened by the validator; they are outside the reviewed
        package and the producer already labels them as relayed, not read.
    - item: Whether a memory-aware attacker's true optimum is materially cheaper (H10).
      reason: >-
        Requires a cost model for lower-memory sieve variants that RC.MATZOV does
        not supply. Not computable with the instrument at hand. The producer
        declares this and correctly marks the c=1/3 and c=1/2 rows as UPPER BOUNDS.
        c* itself is unaffected, because c* is a property of the published
        free-memory operating point.
    - item: Whether any attack outside this harness is cheaper than primal_bdd.
      reason: >-
        The validator checked only the attacks the harness serves and that execute
        (VAL-CTRL-A). Arora-GB, `dual` and `primal_hybrid` could not be run at all
        (D4), and no non-estimator attack was considered. If a cheaper attack
        exists, the undercut is larger and c* rises.
    - item: Model B under the vectors and bits units.
      reason: >-
        The validator independently bisected Model B only in the headline Z_q unit,
        matching the producer at <= 4.7e-09. The producer's stored Model B c* for
        the other units was not separately re-bisected. Low risk: Model A's
        unit scaling is an exact identity and Model B is bracketed by it.

  limitations:
    - >-
      A passed validation means this receipt is admissible evidence. It does not
      support any ML-KEM claim, does not demonstrate a speedup, does not validate
      or refute any heuristic, and does not authorize promotion or a
      hypothesis-status change.
    - >-
      These are cost-model ESTIMATES from a pinned estimator plus twelve numbered
      modelling choices. Nothing in the package was measured. The validator
      reproduced the arithmetic, the source citations and the controls; the
      validator did not and could not establish that the cost model is correct.
    - >-
      Scope is primal_bdd under RC.MATZOV at the three FIPS 203 parameter sets, via
      the Sage-free harness, at lattice-estimator 3e48ef4. Every conclusion is
      confined to that.
    - >-
      The validator's independence is at the artifact level. The validator used the
      SAME instrument at the SAME pin as the producer -- that is what the
      known-answer control makes admissible -- so a defect in lattice-estimator
      3e48ef4 itself, or in the Sage-free shim on a path the control does not
      cover, would be invisible to both. D4 is one instance of exactly that class
      surfacing.
    - >-
      AGENTS.md rule 12 remains UNMET and UNWAIVED. This report is a
      review-adversarial validation, not the review-breakthrough at max effort that
      rule 12 requires. It cannot and does not clear anything for a breakthrough,
      closure, or contradiction claim.

  recommendation_to_coordinator: >-
    Admit the package as evidence of what it is: an independently reproduced,
    honestly scoped cost-model derivation. Defects D1-D8 are documentation,
    control-framing and scope-completeness defects; none changes a number, so a
    superseding record is not required to make the figures usable. If the batch
    proceeds, D2 (H8's misattributed control) and D4 (the incomplete
    served-attack scope statement) are the two worth correcting in a successor
    record, because both could mislead a later reader about how much has been
    checked. D4's root cause is in tools/sage_free_estimator and belongs to a
    separate task; the validator did not touch it. Nothing here bears on
    EV-MLKEM-011, EV-MLKEM-013, EV-MLKEM-017, KN-FIND-012 or KN-FIND-014.

  reproduction_commands:
