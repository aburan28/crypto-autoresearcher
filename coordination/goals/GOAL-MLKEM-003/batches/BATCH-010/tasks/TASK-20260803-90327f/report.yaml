schema: crypto.autoresearch.validation_report.v1
validation_report:
  id: VAL-20260803-f7272f
  task_id: TASK-20260803-90327f
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-010
  reviewed_task_id: TASK-20260803-648a0b
  snapshot_task_id: TASK-20260803-cf95ec
  run_ids: []
  role: validator
  audited_by: validator
  audited_at_utc: '2026-08-03T02:05:00Z'
  independent_session: true
  official_state_change: none
  id_allocation_note: >-
    tools/allocate_id.py does not support a `validation_report` type (choices are
    coordinator_decision, evidence, experiment, handoff, hypothesis, idea,
    research_question), so the 6-hex suffix was minted with
    `python3 -c "import secrets;print(secrets.token_hex(3))"` -> f7272f and
    confirmed unused by a repository-wide grep (0 hits) before use. No state was
    scanned for a maximum; AGENTS.md rule 14's random-token requirement is met.

  inference:
    requested_policy: review-adversarial
    reasoning_effort: xhigh
    resolved_model_id: claude-opus-5
    fallback_allowed: true
    fallback_used: true
    degraded_allowed: false
    degraded_requirements: []
    independent_session_required: true
    independent_session: true
    model_verified: false
    model_verified_note: >-
      No `python3 -m orchestration.adapter doctor --probe` was run in this task.
      The resolved model identifier is self-reported harness configuration.
    fallback_reason: >-
      orchestration/model-policies.yaml routes review-adversarial to a
      GPT-5.6-family policy alias this Claude Code harness cannot resolve;
      .claude/agents/ subagents run model: inherit. Recorded per CLAUDE.md's
      model policy note rather than silently substituted.
    session_independence_basis: >-
      This session did not author TASK-20260803-648a0b, its script, its results,
      its heuristics file or its report. Every number below was recomputed from
      a validator-authored script against a validator-owned clone of the pinned
      estimator.

  verdict: ADMISSIBLE_WITH_DEFECTS
  contract_verdict: passed
  verdict_meaning: >-
    The receipt is admissible evidence: every quantitative claim in the task card
    reproduced independently, the load-bearing sieve-dimension claim is confirmed
    against the pinned source, and the package does not overclaim. ADMISSIBLE is
    withheld only for the eight numbered defects below, all of which are
    documentation, control-framing or scope-completeness defects. None of them
    changes any reported number. This report does NOT support an ML-KEM claim,
    does not demonstrate a speedup, does not validate any heuristic, and does not
    authorize promotion or any hypothesis-status change.

  rule12_status: >-
    AGENTS.md rule 12 is UNMET and UNWAIVED. Nothing in this report changes, or
    treats as corrected, EV-MLKEM-011, EV-MLKEM-013, EV-MLKEM-017, KN-FIND-012 or
    KN-FIND-014. Those records were not read as evidence, were not compared
    against, and are not touched. This is a validation of a fresh derivation.

  # ------------------------------------------------------------------ artifacts
  artifact_checks:
    - check: snapshot commit is the reviewed object, not a working tree
      status: pass
      detail: >-
        HEAD is 7afc38466bb697ac309a89a49e92f396393a5e73, parent
        072629728d35a5a432cf080851b28a0c07844f99, exactly 6 changed paths
        (5 producer artifacts + archives/TASK-20260803-cf95ec/snapshot_receipt.json).
        `git diff HEAD` is clean on all five producer artifacts; the only
        working-tree modification under BATCH-010 is dispatch_queue.json, which is
        Coordinator bookkeeping (task states queued->completed and the archive
        path_sha256 block), not producer content.
    - check: declared path_sha256 vs on-disk bytes
      status: pass
      detail: >-
        sha256 recomputed by the validator for all six declared paths; all six
        match the values recorded in the dispatch_queue archive block.
        derivation_report.md 2efc5000...1524e1; heuristics.yaml fc08ed1e...5a16c2;
        memory_charged_derivation.py f3174028...3e110a; receipt.json
        aa10dd02...5a3ca9c; results.json 99e4da7a...caabb8f; snapshot_receipt.json
        43bf7378...2635d0.
    - check: receipt-internal artifact_sha256 block
      status: pass
      detail: >-
        receipt.json self-declares sha256 for the four non-receipt artifacts; all
        four agree with the validator's own sha256sum and with the archive block.
    - check: command, revision, dirty-tree, environment, resources
      status: pass
      detail: >-
        receipt.json records the exact command chain, repo_commit
        072629728d35 (= the snapshot parent, so the run predates its own
        snapshot as required), repo_dirty_tree true with the dirty path named and
        confined to the task's own write scope, python 3.11.15, mpmath 1.3.0,
        scipy 1.17.1, Linux-6.18.5-x86_64-with-glibc2.39, 4 CPUs, ulimit -v 4 GiB,
        19.5 s of a 3000 s allowance, 1 of 1 run. Sage explicitly not used.
    - check: seeds and randomness
      status: pass
      detail: >-
        randomness.sources and randomness.seeds are both empty with the reason
        recorded. Confirmed correct: the derivation is a deterministic evaluation
        of a pinned estimator with no Monte Carlo step. The validator's own
        re-derivation on a separate clone reproduced bit-for-bit, which is the
        operational test of that claim.
    - check: write scope respected, no worker commit
      status: pass
      detail: >-
        write_scope_respected true, git_commit_run_by_executor false, and the
        commit was made by the Coordinator archival task TASK-20260803-cf95ec.
    - check: instrument provenance
      status: pass
      detail: >-
        The validator cloned github.com/malb/lattice-estimator independently and
        checked out 3e48ef421ec256afddb3e7d2249a77eab6e9ba12 (verified by
        `git rev-parse HEAD`; commit dated Sat Jun 27 10:55:47 2026 +0100). The
        producer's script re-checks this pin and aborts otherwise (lines 240-247).

  # -------------------------------------------------- controls, re-run by hand
  control_checks:
    - id: CTRL-0
      name: known-answer control against the Sage-computed RUN-MLKEM-015-001
      status: reproduced
      substantive: true
      detail: >-
        Run by the validator, not copied. Command:
        PYTHONPATH=<repo>/tools/sage_free_estimator/shim:<validator-clone>
        python3 tools/sage_free_estimator/known_answer_control.py
        Output: Kyber512 140.1994731076 vs reference 140.1994731076 delta
        0.00e+00, beta/eta/d 389/422/1005; Kyber768 200.9587149141 vs
        200.9587149141 delta 0.00e+00, 606/640/1420; Kyber1024 270.7236234535
        (no reference), 855/889/1867. "PASS: every reference value reproduced
        exactly (delta 0.0)". Exit code 0.
    - id: CTRL-1
      name: rop == red + svp, both terms independently recomputed
      status: reproduced
      substantive: true
      detail: >-
        Validator recomputation: red + svp - rop == 0.0 exactly on all three sets.
        log2(MATZOV(beta,d)) matches log2(red) at delta 0.000e+00 on all three;
        log2(MATZOV(eta+1,eta+1) + babai_cost(d-eta)) matches log2(svp) at delta
        0.000e+00 on all three. Kyber512 139.1087303309 / 139.2848445191;
        Kyber768 199.9092057208 / 200.0065813127;
        Kyber1024 269.8125061574 / 269.6289031804.
    - id: CTRL-2
      name: baseline equals RUN-MLKEM-015-001 / EV-MLKEM-015
      status: reproduced
      substantive: true
      detail: >-
        Validator log2(rop) 140.1994731076 / 200.9587149141 / 270.7236234535,
        matching EV-MLKEM-015's recorded 140.20 / 200.96 / 270.72 and the control's
        full-precision references. Residual vs the report's 10-dp printout is
        2.07e-11 / 4.62e-11 / 2.25e-11, i.e. print rounding, not disagreement.
    - id: CTRL-3
      name: 0.2075 vs log2(sqrt(4/3))
      status: reproduced
      substantive: true
      detail: >-
        log2(sqrt(4/3)) = 0.20751874963942182; |0.2075 - that| = 1.874964e-05.
        The producer's reported |delta| = 1.875e-05 is correct to the digits given.
    - id: CTRL-4
      name: c* scales inversely with log2 M across units
      status: reproduced_but_tautological
      substantive: false
      detail: >-
        Reproduced: c*_vectors / c*_bits = log2M_bits / log2M_vectors to 6 dp on
        all three sets (1.152356 / 1.104448 / 1.077516). But this is an algebraic
        identity, not a test: c* is DEFINED as m0/log2M in every unit, so the ratio
        is forced for any log2M whatsoever. It cannot fail. See defect D1.
    - id: CTRL-5
      name: null object, zero-memory attack
      status: reproduced_but_degenerate
      substantive: false
      detail: >-
        Reproduced: with log2 M = 0 the margin is 2.8005268923793096 at every
        c in {0, 1/6, 1/3, 1/2, 1} and max movement is 0.0. But the charge term is
        c * log2M, so c * 0 = 0 identically for any implementation. The control can
        only detect an additive constant bug; it cannot distinguish "the memory
        figure produces the penalty" from "the pipeline manufactures a penalty",
        which is what the report claims for it. See defects D1 and D3.
    - id: CTRL-6
      name: Model A closed form vs bisection
      status: reproduced
      substantive: partially
      detail: >-
        Reproduced with the validator's own 300-iteration bisection on [0,4]:
        Model A c* agrees with m0/log2M to well under 1e-9. This tests the
        bisection routine, not the model, since both evaluate the same closed
        form. results.json describes it as "bisection on the sweep"; the code
        actually bisects the continuous interval [0,4] (line 183). See defect D6.
    - id: CTRL-7
      name: margin non-increasing in c
      status: reproduced_but_tautological
      substantive: false
      detail: >-
        margin(c) = cutoff - log2(rop) - c*log2M is affine in c with slope
        -log2M < 0, so monotonicity is forced. It cannot fail. See defect D1.
    - id: VAL-CTRL-A
      name: "validator-added control: is primal_bdd the cheapest attack the harness serves?"
      status: pass_favourable_to_producer
      substantive: true
      detail: >-
        This is the check H12 records as `falsified_by: n/a`. Validator ran it on
        Kyber512 under RC.MATZOV: primal_usvp 143.771733, primal_bdd 140.199473,
        dual_hybrid 145.528285 (mem 2^140.5106). primal_bdd is the cheapest of the
        attacks that both exist in this harness and execute. `dual` and
        `primal_hybrid` do not execute (see defect D4). The check resolves in the
        producer's favour but was not in the package. See defect D5.
    - id: VAL-CTRL-B
      name: "validator-added control: direction of the d4f-on-memory modelling choice"
      status: pass_conservative
      substantive: true
      detail: >-
        Applying d4f to the MEMORY dimension (not just the gate count) lowers
        log2 M and therefore RAISES c*, i.e. it works against the producer's
        headline. Validator quantification, Z_q units, Kyber512/768/1024:
        with d4f, log2M 88.4941/131.6573/180.9250 -> c* 0.03164649/0.04588645/
        0.00705473; without d4f (raw eta+1), log2M 96.4970/142.3317/194.4727 ->
        c* 0.02902190/0.04244512/0.00656327. The producer took the conservative
        branch. The estimator's own floor(d4f) convention (reduction.py:846,:903)
        gives 0.03157749/0.04582302/0.00704849, within 0.2% of the headline.

  # ------------------------------------------------- per-claim reproduction log
  claim_reproductions:
    - claim: >-
        C1. Known-answer control passes: delta 0.00e+00, beta/eta/d =
        389/422/1005, 606/640/1420, 855/889/1867.
      status: reproduced
      validator_values: >-
        delta 0.00e+00 on both referenced sets; beta/eta/d 389/422/1005,
        606/640/1420, 855/889/1867; exit code 0. Run on a validator-owned clone at
        the pin, not copied from the package.
    - claim: >-
        C2. c* (Model A, Z_q elements) = 0.03164649 / 0.04588645 / 0.00705473,
        from margin / log2(M_peak) with margins 2.800527 / 6.041285 / 1.276377 and
        log2 M_peak 88.494071 / 131.657286 / 180.924993.
      status: reproduced
      validator_values: >-
        margins +2.800527 / +6.041285 / +1.276377 (cutoff - log2 rop, cutoffs
        143/207/272); log2 M_peak in Z_q elements 88.494071 / 131.657286 /
        180.924993; c* = 0.03164649 / 0.04588645 / 0.00705473. Computed by the
        validator's own formula M_zq = 0.2075*n + log2(n) from the estimator's
        d4f, not by re-running the producer's script. Residual vs the report's
        printed values <= 4.6e-07 (print rounding).
    - claim: >-
        C3. Model B bisection gives 0.03277120 / 0.04701194 / 0.00720010.
      status: reproduced
      validator_values: >-
        Validator's own 300-iteration bisection of
        cost(c) = red*M_bkz^c + svp*M_svp^c: 0.03277120 / 0.04701194 / 0.00720010,
        deltas 4.70e-09 / 3.92e-09 / 1.86e-10 vs the reported 8-dp values.
        Sanity: cost(c*_B) evaluates to 143.0000000000 / 207.0000000000 /
        272.0000000000. Structural check passes: c*_B > c*_A on all three sets, as
        it must since M_bkz < M_peak.
    - claim: >-
        C4. Peak memory is set by the FINAL BDD SVP call, not the BKZ sieve:
        RC.MATZOV sieves in the d4f-reduced dimension, and since eta+1 > beta the
        final call dominates, with effective dims 385.08 / 590.13 / 825.24.
      status: reproduced
      load_bearing: true
      validator_values: >-
        See sieve_dimension_finding below. Effective SVP sieve dims
        385.084530 / 590.132012 / 825.235330; BKZ sieve dims 353.197381 /
        557.152930 / 792.144373. Peak is SVP on all three sets.
    - claim: >-
        C5. Memory unit chain: M_vec = 2^(0.2075n), M_zq = n*M_vec,
        M_bits = 12*n*M_vec (q=3329). Unit choice moves c* only ~15%.
      status: reproduced_with_qualification
      validator_values: >-
        Chain confirmed and the instrument citation verified (see
        memory_unit_finding). q = 3329, log2 q = 11.700873, ceil = 12. c* by unit:
        Kyber512 0.03504819 / 0.03164649 / 0.03041438; Kyber768 0.04933579 /
        0.04588645 / 0.04467010; Kyber1024 0.00745389 / 0.00705473 / 0.00691766
        (vectors / Z_q / bits). Spread relative to the smaller value 15.24% /
        10.44% / 7.75%; relative to the larger 13.22% / 9.46% / 7.19%. "~15%" is
        the MAXIMUM over the three sets, not a uniform figure. Correct as an upper
        bound; overstated as a general claim. See defect D7. The substantive
        conclusion the claim rests on -- no order-of-magnitude unit slip -- is
        confirmed and is structural: the three units differ by additive
        log2(n) + log2(12) ~ 12.2 bits on a base of 73-171 bits.
    - claim: >-
        C6. At c = 1/3 margins become -26.70 / -37.84 / -59.03 bits.
      status: reproduced
      validator_values: >-
        Model A: -26.6975 / -37.8445 / -59.0320, cross-checked two ways
        (cutoff - (log2 rop + log2M/3), and m0 - log2M/3). Model B: -26.0295 /
        -37.1417 / -58.2350. Deltas vs the report <= 4.6e-05 (print rounding).
    - claim: >-
        C7. 0.2075 equals the closed form log2(sqrt(4/3)) with |delta| = 1.875e-05.
      status: reproduced
      validator_values: >-
        log2(sqrt(4/3)) = 0.20751874963942182; |0.2075 - that| = 1.874964e-05,
        which rounds to 1.875e-05.
    - claim: >-
        C8. Every charged-cost / margin / c* / access-fraction entry stored in
        results.json under the Z_q unit.
      status: reproduced
      validator_values: >-
        Validator recomputed all five named charges x two charge models x three
        sets, plus c* and the four access-fraction rows per set, and diffed against
        the stored JSON. MAXIMUM absolute discrepancy over every such entry:
        0.000e+00. H9 sensitivity table independently reproduced:
        f=2^-10 -> 0.144648 / 0.121841 / 0.062326; f=2^-20 -> 0.257650 / 0.197796 /
        0.117598; f=2^-30 -> 0.370652 / 0.273751 / 0.172869.
    - claim: >-
        C9. c* is 10.5x / 7.3x / 47.2x smaller than 1/3 and 15.8x / 10.9x / 70.9x
        smaller than 1/2; multiplier at c* is 6.97x / 65.86x / 2.42x; a single
        access costs 2^29.5 / 2^43.9 / 2^60.3 under a 3D bound.
      status: reproduced
      validator_values: >-
        (1/3)/c* = 10.53 / 7.26 / 47.25; (1/2)/c* = 15.80 / 10.90 / 70.87;
        2^m0 = 6.967 / 65.858 / 2.422; log2M/3 = 29.50 / 43.89 / 60.31;
        log2M/2 = 44.25 / 65.83 / 90.46. Note heuristics.yaml H7 prints 47.3x where
        derivation_report section 5 prints 47.2x for the same 47.25; cosmetic.
    - claim: >-
        C10. Report section 2: getting the sieve dimension wrong "would have moved
        log2 M by roughly 7-13 bits and c* by a few percent".
      status: reproduced
      validator_values: >-
        Reproducible once read against heuristics.yaml H2, which decomposes it.
        Using raw eta+1 instead of the d4f-reduced dimension raises log2 M by
        8.00 / 10.67 / 13.55 bits (Z_q; 7.87 / 10.56 / 13.44 in vectors, matching
        H2's "7.9 / 10.6 / 13.4"). Using the BKZ sieve instead of the SVP sieve
        lowers it by 6.74 / 6.93 / 6.93 bits. So the span is ~6.7 to ~13.6 bits;
        "roughly 7-13" is a fair paraphrase. Effect on c*: the BKZ-instead-of-SVP
        error gives +8.25% / +5.55% / +3.98%, i.e. "a few percent" is correct.
    - claim: >-
        C11. All eight controls passed.
      status: reproduced_with_qualification
      validator_values: >-
        All eight reproduce. But four of the eight (CTRL-4, CTRL-5, CTRL-7, and
        CTRL-6 in large part) are algebraic identities of the definitions and
        cannot fail on any input. See defect D1.
    - claim: >-
        C12. "A 1001-point sweep over c in [0,1] is in results.json"
        (derivation_report section 4).
      status: not_reproduced
      validator_values: >-
        results.json stores a 19-point sweep (per_parameter_set.*.sweep, len 19).
        The 1001-point sweep exists only inside the running script and survives in
        results.json as CTRL-7's summary (sweep_points 1001, margin_at_c0,
        margin_at_c1). Section 9 of the same report correctly says "19-point
        sweep". Internal inconsistency; no number is affected. Defect D6.
    - claim: >-
        C13. "Arora-Groebner is unavailable in this harness" is the harness's
        attack-coverage limitation (H12, report section 7 item 4).
      status: not_reproduced_as_complete
      validator_values: >-
        The Arora-GB part is confirmed: shim/sage/all.py:145-155 makes
        PowerSeriesRing a constructor that raises NotImplementedError. But it is not
        the only unavailable attack. Validator ran the others: `dual` raises
        AttributeError: '_RealField' object has no attribute 'pi' at
        estimator/prob.py:213 (amplify_sigma -> RDF.pi()), and `primal_hybrid`
        raises ZeroDivisionError. Neither is named in H12, in report section 7, or
        in tools/sage_free_estimator/README.md's "Scope and limits". Defect D4.

  # ---------------------------------------------------- the load-bearing checks
  sieve_dimension_finding:
    question: >-
      Is peak memory set by the final BDD SVP call rather than the BKZ sieve, and
      is the d4f reduction applied as claimed?
    answer: CONFIRMED
    read_from_source_not_asserted: true
    lines_read_by_validator:
      - "estimator/lwe_primal.py:465 -- `bkz_cost = costf(red_cost_model, beta, d)` -- verbatim match"
      - "estimator/lwe_primal.py:482 -- `eta = svp_dim if params._homogeneous else svp_dim - 1` -- verbatim match; the producer's paraphrase `eta = svp_dim - 1 (Kyber params are non-homogeneous)` is the correct specialisation"
      - "estimator/lwe_primal.py:488 -- `svp_cost = costf(red_cost_model, svp_dim, svp_dim)` -- verbatim match, preceded at :487 by the comment `we make one svp call on a lattice of rank eta + 1`"
      - "estimator/lwe_primal.py:490 -- `svp_cost[\"rop\"] += PrimalHybrid.babai_cost(d - eta)[\"rop\"]` -- verbatim match"
      - "estimator/reduction.py:800 -- `beta_ = beta - self.d4f(beta)` inside Kyber.__call__, with the gate count at :808-:810 being `C * 2 ** (a*beta_ + b)` -- verbatim match"
    inheritance_verified: >-
      type(RC.MATZOV).__mro__ is MATZOV -> GJ21 -> Kyber -> ReductionCost -> object.
      `__call__` is defined ONLY on Kyber (not on MATZOV, not on GJ21), so
      RC.MATZOV(beta, d) executes the reduction.py:800 path. RC.MATZOV.nn is
      'list_decoding-classical'. This is the step that makes the d4f claim binding
      and it was verified programmatically, not assumed.
    call_multiplicity_verified: >-
      Inside Kyber.__call__, svp_calls = C * max(d - beta, 1). For the BKZ term
      that is C * (d - beta) = 3319.53 / 4386.52 / 5453.51 sieve calls at dimension
      beta - d4f(beta). For the final SVP call, invoked as costf(model, svp_dim,
      svp_dim), it is C * max(0, 1) = C = 5.3888 -- i.e. a single sieve, which is
      exactly the "single final BDD/SVP call" the producer describes.
    numbers:
      Kyber512:
        beta: 389
        eta: 422
        svp_dim: 423
        d4f_beta: 35.802619
        d4f_svp_dim: 37.915470
        bkz_sieve_dim: 353.197381
        svp_sieve_dim: 385.084530
        peak: SVP
      Kyber768:
        beta: 606
        eta: 640
        svp_dim: 641
        d4f_beta: 48.847070
        d4f_svp_dim: 50.867988
        bkz_sieve_dim: 557.152930
        svp_sieve_dim: 590.132012
        peak: SVP
      Kyber1024:
        beta: 855
        eta: 889
        svp_dim: 890
        d4f_beta: 62.855627
        d4f_svp_dim: 64.764670
        bkz_sieve_dim: 792.144373
        svp_sieve_dim: 825.235330
        peak: SVP
    conclusion: >-
      eta+1 > beta on all three sets (423>389, 641>606, 890>855) and the
      d4f-reduced SVP dimension exceeds the d4f-reduced BKZ dimension on all three,
      so the final BDD/SVP call sets peak memory. The producer's dims 385.08 /
      590.13 / 825.24 are correct. c* is therefore computed against the right
      dimension. Had the BKZ sieve been used instead, c* would be 0.03425604 /
      0.04843445 / 0.00733552 (+8.25% / +5.55% / +3.98%) -- the sign of every
      statement in the package is unchanged.
    residual_caveat: >-
      One convention wrinkle, immaterial. reduction.py:800 uses the unfloored
      `beta - d4f(beta)` for the RUNTIME model, which is what the producer used for
      memory; the estimator's own vector-count sites (:846, :854, :903, :936) use
      the floored `beta - floor(d4f(beta))`. Under the floored convention c* would
      be 0.03157749 / 0.04582302 / 0.00704849, within 0.2% of the headline.

  memory_unit_finding:
    question: >-
      Is the memory unit consistent throughout, and does unit choice move c* by
      only ~15% rather than orders of magnitude?
    answer: CONFIRMED, with the "~15%" figure identified as a maximum not a uniform value
    unit_chain_verified: >-
      M_vectors = 2^(0.2075*n); M_zq = n * M_vectors; M_bits = ceil(log2 q) * n *
      M_vectors with q = 3329, log2 q = 11.700873, ceil = 12. Implemented at
      memory_charged_derivation.py:148-151 and reproduced independently by the
      validator with identical results. Numerator and denominator are in one
      convention throughout: the gate count is the instrument's rop and the memory
      count is the instrument's own unit.
    instrument_citation_verified: >-
      estimator/lwe_dual.py: `cost["mem"] += sieve_dim * N` is present with the
      surrounding comment "Add the memory cost of storing the `N` dual vectors,
      using `sieve_dim` many coefficients (mod q) to represent them ... so this is
      really an upper bound here", and the docstring entry "``mem``: memory
      requirement in integers mod q" is present. Both citations check out. The
      "upper bound" caveat the producer relays in H5 is in the source verbatim.
    cross_check_attempted: >-
      The validator tried to validate the chain numerically against the
      estimator's own `mem` output. dual_hybrid(Kyber512, RC.MATZOV) returns
      mem = 2^140.5106 at beta = 408, whereas n * 2^(0.2075n) at n = 408 is
      2^93.3324. These do NOT and SHOULD NOT agree: the dual attack requests
      N >> 2^(0.2075*sieve_dim) short vectors for distinguishing, so its `mem` is
      sieve_dim * N with an N set by the distinguisher, not by the sieve database.
      What the comparison DOES establish is the UNIT -- mem is
      (dimension) x (number of vectors) in Z_q elements, exactly H5's chain. No
      inconsistency is asserted; recorded so the check is not silently omitted.
    unit_sensitivity:
      Kyber512:  {vectors: 0.03504819, zq: 0.03164649, bits: 0.03041438, spread_vs_smaller_pct: 15.24, spread_vs_larger_pct: 13.22}
      Kyber768:  {vectors: 0.04933579, zq: 0.04588645, bits: 0.04467010, spread_vs_smaller_pct: 10.44, spread_vs_larger_pct: 9.46}
      Kyber1024: {vectors: 0.00745389, zq: 0.00705473, bits: 0.00691766, spread_vs_smaller_pct: 7.75, spread_vs_larger_pct: 7.19}
    conclusion: >-
      No vectors-vs-bits slip exists. The bound is structural, not coincidental:
      the three units differ only by the additive terms log2(n) ~ 8.6-9.7 bits and
      log2(12) = 3.585 bits, against a base 0.2075*n of 73-171 bits, so the ratio
      max/min log2 M is 1.078-1.152 and c* moves by exactly that ratio. An
      order-of-magnitude unit error is arithmetically impossible in this chain.

  # ------------------------------------------------------------ cost-model gate
  cost_model_checks:
    - check: unit declared
      status: pass
      detail: >-
        The headline unit (Z_q elements) is declared in the report, in the script
        docstring, in results.json.definitions, and in H5, and all four other units
        are tabulated beside it. No table is presented without its unit.
    - check: memory reported alongside time
      status: pass
      detail: >-
        Memory is the subject of the derivation and appears beside every cost
        figure, in four units, for both sieves.
    - check: optimistic assumptions flagged
      status: pass
      detail: >-
        H9 ("every gate in the MATZOV count is charged as one memory access") is
        explicitly labelled "the single most optimistic assumption in the direction
        of the reported conclusion" and carries a four-row sensitivity table that
        the validator reproduced exactly. H10 marks the c=1/3 and c=1/2 charged
        costs as UPPER BOUNDS on a memory-aware attacker. H7 marks c=1/2 and c=1/6
        as this batch's own unsourced construction. This is unusually candid and is
        the package's main strength.
    - check: time-memory tradeoff noted where memory binds
      status: pass_with_gap
      detail: >-
        H10 names the tradeoff (a memory-charged attacker re-optimises toward
        smaller sieve dimensions, lower-memory sieve variants, enumeration hybrids)
        and declines to compute it, with the reason (RC.MATZOV supplies no
        lower-memory sieve model) and it is listed as open item 1. The gap is
        declared rather than hidden, so this is not a defect, but the c=1/3 and
        c=1/2 rows remain upper bounds and must never be cited as an attacker's
        cost.
    - check: per-attempt cost x inverse success probability
      status: not_applicable
      detail: >-
        No probabilistic step and no repeated-attempt structure: primal_bdd's
        success probability is folded into the estimator's own optimisation and no
        success-probability claim is made in the package. Recorded as N/A rather
        than silently omitted, per the Validator contract.

  heuristic_validation_checks:
    - check: every modelling choice numbered
      status: pass
      detail: >-
        The validator read memory_charged_derivation.py line by line looking for an
        unnumbered assumption. Every choice found maps to a heuristic: baseline H1,
        sieve dimension H2, peak-not-sum H3, 0.2075 H4, unit chain H5, c=0 baseline
        H6, charge family H7, fixed cutoff H8, gates-as-accesses H9, no
        re-optimisation H10, cutoff provenance H11, attack scope H12. No unnumbered
        modelling choice was found.
    - check: every heuristic carries a real falsifier
      status: pass_except_H12
      detail: >-
        H1 and H2 carry falsifiers the validator actually EXECUTED (recompute at
        the same pin; recompute red/svp from the two MATZOV calls) and both held at
        delta 0.0. H3, H4, H5, H9, H10 carry concrete, in-principle-checkable
        falsifiers naming what evidence would overturn them. H6 and H11 carry
        genuine falsifiers that are unexecutable under this program's recorded
        network policy, and say so. H7's falsifier (a non-power-law memory cost,
        e.g. hierarchical memory with polylog charge) is real and correctly noted
        not to affect c*. H8's falsifier is real but its `validated_by` is
        misattributed -- defect D2. H12 records `falsified_by: n/a` -- assessed
        below.
    - check: "H12 `falsified_by: n/a` -- acceptable scope statement or gap?"
      status: BOTH; partially acceptable, partially a gap
      detail: >-
        SPLIT THE HEURISTIC. (a) The pure scope declaration -- "every number here
        concerns primal_bdd under RC.MATZOV" -- genuinely is not a claim about the
        world and needs no falsifier. It is verifiable by inspection and the
        validator verified it: the script calls primal_bdd(p,
        red_cost_model=RC.MATZOV) and nothing else. For this half, `n/a` is
        correct and should not be "repaired" into a fake falsifier.
        (b) But H12 also asserts a FACT ABOUT THE INSTRUMENT -- that Arora-Groebner
        is what the harness cannot serve. That is falsifiable, and the validator
        partially falsified it: `dual` and `primal_hybrid` also fail to execute.
        Defect D4.
        (c) And H12's `direction_if_wrong` states a genuine claim -- "if a cheaper
        attack exists at these parameters, the free-memory undercut is larger and
        c* rises proportionally" -- whose falsifier was CHEAP AND AVAILABLE:
        enumerate the attacks the harness does serve. The producer had the
        instrument loaded and did not run it; the validator did (VAL-CTRL-A) and it
        resolved in the producer's favour. Defect D5.
        VERDICT ON THE QUESTION ASKED: `n/a` is acceptable for the scope-declaration
        half and is a gap for the instrument-fact and direction halves. It is not a
        fabrication and not grounds for INADMISSIBLE; it is a documentation defect
        that a five-minute check would have closed.
    - check: null-object control before belief (inventor protocol section 3)
      status: partial
      detail: >-
        See defect D3. The package DOES do the thing section 3 most cares about:
        for every heuristic it states which way c* moves if the heuristic is wrong,
        and the H9 table shows c* rising monotonically as the parameter meant to
        destroy the signal (the access fraction f) shrinks. That is the decay
        statement section 3 asks for and it is present. What is missing is a null
        object of the same SHAPE. CTRL-5 sets the signal to zero by hand
        (log2 M = 0 makes c*log2M identically 0), which is not a null object.
        Mitigating: this derivation is deterministic arithmetic with no sampling,
        no seed and no estimator, so the statistical-artifact failure mode section
        3 targets is not the binding risk here. The defect is the claim made FOR
        CTRL-5, not the absence of statistics.
    - check: pre-registered prediction / sample integrity / correspondence validity
      status: not_applicable
      detail: >-
        No sampling, no empirical distribution, no correspondence substitution.
        Recorded as N/A rather than omitted.
    - check: scale binding (AGENTS rule 7)
      status: pass
      detail: >-
        This is not toy-scale evidence dressed as crypto-scale, and it is also not
        crypto-scale VALIDATION. The parameters are the actual FIPS 203 sets
        (n=512/768/1024, q=3329) and the estimator evaluates its cost formulas at
        those sizes directly, so there is no extrapolation from a small instance.
        But nothing was executed at any scale: these are closed-form cost-model
        evaluations, and the package says so on every page. No rule 7 violation.

  # ------------------------------------------- claims vs what estimates support
  overclaim_assessment:
    ml_kem_break_claimed: false
    security_proof_implied: false
    detail: >-
      The validator specifically hunted for both and found neither.
      (1) NO BREAK. The derivation moves the estimated cost UP. The report's
      opening box, the script docstring, results.json.status_note and receipt.json
      .claims all state that no break is claimed. Nothing in the package computes,
      claims or approaches a solve; receipt.certificate.kind is `none` with the
      correct reason ("no solve, no relation, nothing to certify").
      (2) NO SECURITY PROOF. This is the harder direction and the package handles
      it explicitly: "a memory charge that RAISES the estimated attack cost above a
      NIST cutoff is NOT a proof of security -- it is a statement about one cost
      model, at one parameter set, under the heuristics in heuristics.yaml". That
      sentence appears in the report, the script docstring and results.json. The
      validator finds it accurate and sufficient.
      (3) NO STATUS CHANGE. receipt.claims records hypothesis_status_changed false
      and heuristic_declared_validated_or_refuted false; report section 7 says
      "Observation, not verdict". Confirmed: the package contains no status
      transition and no promotion request.
      (4) NO BEST-ATTACK CLAIM. best_attack_overall_claimed false, and the scope is
      restated at four separate points. Correct in substance, though the reason
      given (Arora-GB only) is incomplete -- defect D4.
      (5) The only wording the validator would tighten is section 7's directional
      sentence -- defect D8.
    residual_risk: >-
      The package's numbers are admissible. The risk is downstream: c* = 0.0316 /
      0.0459 / 0.0071 being one to two orders of magnitude below 1/3 is a striking
      figure that will read as "ML-KEM's NIST margin is comfortable once memory is
      priced". It supports no such thing. It says that AT THE FREE-MEMORY OPTIMUM
      -- which is not the operating point a memory-charged attacker would choose
      (H10) -- a surcharge of 7x / 66x / 2.4x per charged operation closes the
      gap, UNDER the assumption that every MATZOV gate is a memory access (H9),
      against a cutoff held fixed on an argument not verified against the NIST text
      (H8, H11), for the one attack this harness serves and runs (H12, D4). Any
      onward citation that drops those four qualifiers overstates the result.

  # -------------------------------------------------------------------- defects
  defects:
    - id: D1
      severity: minor
      category: control framing
      title: Four of the eight controls are algebraic identities that cannot fail.
      detail: >-
        CTRL-4 is forced because c* is DEFINED as m0/log2M in every unit, so the
        ratio across units is identically the inverse ratio of log2M. CTRL-5 is
        forced because the charge term is c*log2M and c*0 = 0. CTRL-7 is forced
        because margin(c) is affine in c with slope -log2M < 0. CTRL-6 compares a
        closed form against a bisection of the same closed form, so it tests the
        bisection routine only. All four reproduce, and none can fail on any input.
        The report's "All eight passed" and its section 6 table present them as
        eight checks of equal standing. The substantive controls are CTRL-0,
        CTRL-1, CTRL-2 and CTRL-3, and those four are genuinely strong.
      affects_any_number: false
      suggested_repair_by_producer_or_successor: >-
        Relabel the four as self-consistency checks; report the control count as
        4 substantive + 4 identities.
    - id: D2
      severity: moderate
      category: misattributed control
      title: heuristics.yaml H8 cites CTRL-5 as validating it. CTRL-5 tests something else.
      detail: >-
        H8 is "the NIST cutoff is not itself re-charged for memory", i.e. a claim
        about the memory footprint of the AES key-search REFERENCE computation.
        CTRL-5 sets the ATTACK's memory to zero. It supplies no evidence about the
        reference computation at all. H8's direction_if_wrong compounds this:
        "The null-object control confirms the machinery does what is claimed."
        It does not. H8's own validation_status is correctly `unvalidated`, so the
        file contradicts itself: an unvalidated heuristic with a populated
        `validated_by` list.
      affects_any_number: false
      suggested_repair_by_producer_or_successor: >-
        Set H8.validated_by to [] and delete the CTRL-5 sentence from its direction
        clause. H8 is honestly argued from AES using O(1) storage; it does not need
        a borrowed control.
    - id: D3
      severity: moderate
      category: inventor protocol section 3
      title: CTRL-5 is not a null object of the same shape, and is claimed to be one.
      detail: >-
        The report states CTRL-5 "is the inventor-protocol control-before-belief
        check: it distinguishes 'the memory figure produces the penalty' from 'the
        pipeline manufactures a penalty for anything fed into it'." Setting
        log2 M = 0 is setting the signal to zero by hand; the penalty term is
        c*log2M by construction, so the outcome is forced for ANY implementation of
        the charge. A null object of the same shape would be, e.g., the identical
        pipeline applied to a parameter set with NO undercut (c* must fail to
        exist), or to an attack whose memory is polynomial rather than exponential
        in the sieve dimension (c* must blow up). Neither was run. MITIGATION,
        stated fairly: the derivation is deterministic arithmetic with no sampling,
        so section 3's statistical-artifact target is not the binding risk here,
        and the package DOES supply the decay statement section 3 asks for -- the
        H9 table shows c* rising monotonically as the access fraction shrinks, and
        every heuristic records its direction_if_wrong. The defect is the claim
        made for CTRL-5, not an absence of directional reasoning.
      affects_any_number: false
    - id: D4
      severity: minor
      category: incomplete scope statement
      title: >-
        The harness cannot serve `dual` or `primal_hybrid` either, and no artifact
        says so.
      detail: >-
        H12, derivation_report section 7 item 4, results.json.status_note and
        tools/sage_free_estimator/README.md all name Arora-Groebner as THE
        limitation. Validator-run evidence to the contrary, on the pinned clone:
        `dual(Kyber512, red_cost_model=RC.MATZOV)` raises
        `AttributeError: '_RealField' object has no attribute 'pi'` from
        estimator/prob.py:213 (`amplify_sigma` calling `RDF.pi()`); and
        `primal_hybrid(Kyber512, red_cost_model=RC.MATZOV, mitm=False,
        babai=False)` raises `ZeroDivisionError`. Both fail loudly rather than
        returning a wrong cost, which is the shim's stated design and is the safe
        behaviour -- but the scope documentation understates how narrow the served
        set is, and it understates it in the direction that understates how large
        the free-memory undercut might be. ROOT CAUSE is in
        tools/sage_free_estimator/shim (committed at defd0373, outside this package
        and outside the validator's write scope); the defect against THIS package is
        that it repeats the incomplete claim as its own scope statement.
      affects_any_number: false
      affects_scope_statement: true
    - id: D5
      severity: minor
      category: unexecuted cheap check
      title: >-
        H12's `direction_if_wrong` is a falsifiable claim whose cheap falsifier was
        recorded as `n/a` instead of run.
      detail: >-
        The claim is "if a cheaper attack exists at these parameters, the
        free-memory undercut is larger and c* rises proportionally". Enumerating
        the attacks the harness serves costs minutes with the estimator already
        imported. The validator ran it (VAL-CTRL-A): at Kyber512 under RC.MATZOV,
        primal_usvp 143.771733, primal_bdd 140.199473, dual_hybrid 145.528285.
        primal_bdd is the cheapest that exists and runs, so the check resolves in
        the producer's favour and the baseline stands. It belonged in the package.
      affects_any_number: false
    - id: D6
      severity: minor
      category: internal inconsistency in documentation
      title: The 1001-point sweep is not in results.json, and CTRL-6's description misstates its method.
      detail: >-
        (a) derivation_report section 4 says "A 1001-point sweep over c in [0,1] is
        in results.json"; the stored sweep has 19 points, and the 1001-point sweep
        survives only as CTRL-7's count and endpoints. Section 9 of the same report
        correctly says "19-point sweep", so the report contradicts itself.
        (b) results.json describes CTRL-6 as c* "located by bisection on the sweep";
        memory_charged_derivation.py:183-196 bisects the continuous interval [0,4]
        for 200 iterations, not the sweep grid. The code is better than the
        description, but the description is what a reader audits against.
      affects_any_number: false
    - id: D7
      severity: minor
      category: imprecise summary statistic
      title: '"Unit choice moves c* by about 15%" is the maximum, not a uniform figure.'
      detail: >-
        Validator-recomputed spreads relative to the smaller c*: 15.24% (Kyber512),
        10.44% (Kyber768), 7.75% (Kyber1024); relative to the larger: 13.22%,
        9.46%, 7.19%. Both the report (section 5) and H5 state "about 15%" for all
        three. Correct as an upper bound, wrong as a general statement. Direction
        is CONSERVATIVE -- it overstates the sensitivity, so it does not flatter the
        conclusion.
      affects_any_number: false
    - id: D8
      severity: minor
      category: scoping precision in the headline sentence
      title: Section 7's directional sentence carries no inline H9 conditional.
      detail: >-
        "the undercut recorded in EV-MLKEM-015 does not survive any of the memory
        charges examined here" is true for the examined c-values (the smallest
        nonzero named charge, 1/6, exceeds every c*), but it is true BECAUSE H9
        charges every MATZOV gate as one memory access. The package's own table
        shows that at f = 2^-30 Kyber-512's c* is 0.370652, above 1/3, so under a
        sparse-access assumption the undercut WOULD survive a 3D charge. H9 is
        disclosed prominently in section 5 and listed in section 7's unvalidated
        inputs, so this is a precision defect and not a misrepresentation; but
        section 7 is the paragraph a downstream record will quote.
      affects_any_number: false

  strengths_recorded:
    - >-
      The known-answer control is run as step 0 of the derivation itself and the
      script refuses to produce a number if it does not exit 0 with "delta 0.0"
      (lines 216-234). That is instrument discipline enforced in code, not asserted
      in prose.
    - >-
      The sieve-dimension question -- the one the task card warned would change the
      answer -- was resolved by reading the pinned source and citing specific lines.
      The validator read all five cited lines and every one is a verbatim match,
      including the non-obvious inheritance step (MATZOV -> GJ21 -> Kyber, with
      __call__ defined only on Kyber) that makes the d4f claim binding.
    - >-
      Every heuristic carries a direction_if_wrong clause. This is what makes the
      package auditable: the validator could check the SIGN of each assumption's
      effect, and found that the two most consequential choices -- applying d4f to
      the memory dimension, and taking peak = the larger sieve rather than the sum
      -- both push c* in the direction that WEAKENS the producer's headline.
    - >-
      Unsourced inputs are labelled unsourced in the same table as the sourced ones
      (c=1/2 and c=1/6 as "THIS BATCH'S OWN CONSTRUCTION"), and the failure to
      retrieve BDGL16 primary text is stated rather than papered over.

