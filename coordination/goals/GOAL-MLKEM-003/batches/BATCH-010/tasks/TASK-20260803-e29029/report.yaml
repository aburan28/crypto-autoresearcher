  # ------------------------------------------------------------------ objections
  objections:

    - id: OBJ-1
      severity: major
      title: c* is an identity in two pre-existing numbers, presented as a discovery.
      statement: >-
        c* = margin / log2 M. The numerator is EV-MLKEM-015's margin, re-pinned by
        CTRL-2 at delta 0.0 and deliberately not revised (H1); the denominator is
        0.2075*n_peak + log2(n_peak). Holding log2 M fixed, c* is exactly linear in
        the margin, and c* = 1/3 corresponds to a margin of 29.498 bits on
        Kyber-512. So "c* is 10.5x below 1/3" IS the sentence "the Kyber-512 margin
        is 10.5x smaller than 29.498 bits". Because Kyber was parameterised to sit
        within a few bits of a category boundary and any sieve at cryptographic
        dimension has log2 M = O(100), c* = O(1e-2) is forced by the shape of the
        problem before any instrument runs. Worse, the ratio moves INVERSELY with
        the undercut: Kyber-1024's 47.2x is large because its undercut is small,
        which invites a backwards reading.
      what_it_does_not_say: >-
        This is not an accusation of error and not grounds for rejection. Being a
        derived identity does not devalue a quantity. KN-OPEN-017 asked, before
        this batch, for exactly this computation and recorded that no corpus source
        had done it.
      the_finding_that_is_real: >-
        My RT-B3 sweep - run as an attack - is the strongest content in the
        package: c* < 1/3 for EVERY sieve-memory exponent in [0.05, 0.40], for
        every unit, under both charge models, and under within-instrument
        re-optimisation. The conclusion is invariant to the one input the community
        disputes. The package never states this and leads instead with eight
        significant figures.
      cheapest_check: >-
        Hold log2 M at 88.494071 and tabulate c* against margin in {0.5, 1, 2.8005,
        6, 12, 29.498}; then hold margin at 2.8005 and tabulate against n_peak in
        {100, 200, 385.08, 600, 825}. Two loops, no estimator call. Reproduced in
        rt_e29029_probe.out sections RT-A1/A2.
      required_restatement: >-
        Lead with the inequality and its invariance; report c* to at most two
        significant figures; state c* = margin / log2 M in the first sentence.
        H11 already concedes a one-bit cutoff error moves Kyber-1024's c* by 0.006
        (~85% of its value), which every eight-digit table contradicts.

    - id: OBJ-2
      severity: major
      title: The durable commit message overstates what the report itself says.
      statement: >-
        derivation_report.md section 7 is careful - "does not survive any of the
        memory charges EXAMINED HERE". The snapshot commit message drops the
        qualifier: "The EV-MLKEM-015 undercut of the NIST cutoffs survives only
        under literally free memory." Two defects. (i) The undercut survives for
        all c < c*, an interval of positive width; "literally free memory" collapses
        an interval to a point. (ii) The sentence reads as a verdict on
        EV-MLKEM-015 when, by the batch's own H6, EV-MLKEM-015's undercut is a c=0
        statement that a c>0 computation cannot contradict. EV-MLKEM-015 never
        claimed the undercut survives memory charging, so nothing in it is
        corrected, weakened, or qualified here.
      cheapest_check: "git log -1 7afc38466bb6"
      required_restatement: >-
        Any downstream ledger or knowledge record must use the report's qualified
        wording and must state explicitly that this batch does not contradict,
        correct, or qualify EV-MLKEM-015. Record that the commit message is
        stronger than its own artifacts support. Commit messages are immutable;
        this one will be read by every future agent running git log on this path.

    - id: OBJ-3
      severity: major
      title: CTRL-5 is not a null-object control - it cannot fail.
      statement: >-
        CTRL-5 sets log2 M = 0, i.e. M = 1, so M^c = 1 for every c. It asserts that
        x * 1^c == x: a property of exponentiation. It would pass identically if the
        memory figure were off by fifty bits, if the sieve dimension were the wrong
        one, if the unit chain were inverted, or if the pipeline were charging a
        figure read from a different scheme. derivation_report.md section 6 claims
        it "distinguishes 'the memory figure produces the penalty' from 'the
        pipeline manufactures a penalty for anything fed into it'"; it establishes
        only the second, and only degenerately. The inventor-protocol
        controls-before-belief obligation is therefore formally UNMET.
      cheapest_check: >-
        Read results.json["controls"]["CTRL-5_null_object_zero_memory"]: every row
        at every c prints the identical log2_charged_cost. A control whose output
        is constant by construction discriminates nothing.
      required_control: >-
        Two nulls of the right shape, both cheap, both run by me and reproducible
        from rt_e29029_probe.out. (RT-B2, sign null) Score the same costs against a
        cutoff they do not undercut: Kyber-1024 vs 207 gives margin -63.7236,
        c* = -0.352210; Kyber-512 vs 128 gives margin -12.1995, c* = -0.137856 -
        the pipeline does discriminate on sign. (RT-B3, denominator null)
        Substitute an arbitrary sieve-memory exponent: c* = 0.100582 / 0.059462 /
        0.031646 / 0.022564 / 0.017221 at 0.05 / 0.10 / 0.2075 / 0.30 / 0.40, all
        below 1/3. The right null for a memory-charging pipeline is a memory figure
        of the WRONG SHAPE, not a memory figure of zero.

    - id: OBJ-4
      severity: major
      title: >-
        H9's sensitivity is the c=1/3 row re-expressed, and the axis KN-OPEN-017
        actually names - access DISTANCE - is never explored.
      statement: >-
        (i) Not independent evidence. Solving (margin + log2(1/f))/log2 M = 1/3
        gives log2 f* = margin - (1/3)log2 M, which is by construction the charged
        margin at c=1/3. Confirmed exactly: -26.6975 / -37.8445 / -59.0320 in both
        columns. Section 5's table is section 4's table re-expressed and should not
        be presented as separate robustness. (ii) The grid steps f in decades of
        2^10 and the prose says "only near f = 2^-30 does Kyber-512's c* cross
        1/3." The exact crossings 2^-26.70 / 2^-37.84 / 2^-59.03 are readable off a
        table already printed and are not stated; the grid is strictly less
        informative than free information in hand. (iii) The substantive gap: H9
        varies the NUMBER of accesses. Wiener's charge is about the DISTANCE of an
        access. A list-decoding sieve localises work into buckets, so the region an
        access must span is plausibly far smaller than the database, and the charge
        would be M_eff^(1/3) with M_eff << M. KN-OPEN-017's closure condition is
        explicit that a full-cost sieving model must price "the near-neighbour list
        AND ITS ACCESS PATTERN". The batch prices the list and replaces the access
        pattern with the crudest possible model.
      does_this_restore_the_undercut: >-
        NO, and I state it rather than leave it open. For locality alone to rescue
        the undercut at c=1/3 you need (1/3)*log2 M_eff <= margin, i.e.
        log2 M_eff <= 3*margin = 8.40 / 18.12 / 3.83 bits - an effective working
        set of a few hundred elements or fewer. No sieve of this family has that.
        This is a completeness gap in the batch's answer to KN-OPEN-017, not a
        threat to its conclusion.
      cheapest_check: >-
        For (i)-(ii), one subtraction per set. For (iii), grep the pin for any
        bucket/filter space parameter: MATZOV.NN_AGPS at
        /tmp/le/estimator/reduction.py:972-998 holds only fitted time coefficients
        a and b per NN variant, with no space entry - I ran this and it confirms the
        instrument cannot supply M_eff, so the gap must be closed from literature
        or declared open.

    - id: OBJ-5
      severity: moderate
      title: The H9 access-fraction model is multiplicative and at c=0 contradicts CTRL-2.
      statement: >-
        H9 writes charged cost = f * T * M^c. At c = 0 that returns log2 f + log2 T,
        a cost BELOW the estimator's own free-memory gate count which CTRL-2 pins at
        delta 0.0. Reproduced: at f = 2^-20 the model gives 120.1995 / 180.9587 /
        250.7236 against pinned 140.1995 / 200.9587 / 270.7236. Observing that few
        gates touch memory cannot make an attack cheaper than its own gate count.
        The correctly-shaped model is additive, (1-f)*T + f*T*M^c, which returns T
        at c = 0 for every f.
      impact: >-
        At f = 1 the two models coincide exactly, so the HEADLINE c* is untouched.
        The sensitivity rows are not: at f = 2^-10 the additive form gives
        0.142125 / 0.121674 / 0.058086 against the published 0.144648 / 0.121841 /
        0.062326 - a 7.3% relative difference on Kyber-1024. The published form
        INFLATES c*, i.e. is biased against the batch's own conclusion, so this is a
        correctness defect and not a thumb on the scale. It is still a wrong
        equation in a durable artifact.
      cheapest_check: >-
        Evaluate heuristics.yaml H9's own formula at c = 0 and f = 2^-20 and compare
        with results.json per_parameter_set[*].log2_rop_free_memory.

    - id: OBJ-6
      severity: moderate
      title: >-
        results.json reports a memory unit that is 8.15 bits wrong, and it feeds a
        c* row.
      statement: >-
        memory_charged_derivation.py:151 computes
        log2_bits_info = log2_vectors + log2(sieve_dim) + log2_q, i.e. it multiplies
        the Z_q-element count by q = 3329 rather than by log2 q = 11.7009. Reported
        as 100.194944 / 143.358160 / 192.625866; correct information-theoretic value
        is log2 M_zq + log2(log2 q) = 92.042616 / 135.205831 / 184.473537. Error
        +8.152329 bits on all three sets. The unit is carried into the charged-cost
        family (script lines 413-414, 420-421) and produces c* = 0.02795078 /
        0.04214120 / 0.00662619. Direction: an overstated M understates c*, i.e. the
        error runs in the direction of the conclusion.
      scope_of_impact: >-
        NOT in the headline. derivation_report.md tabulates only vectors / Z_q /
        packed-12-bit, and its "c* in bits" column (0.030414 / 0.044670 / 0.006918)
        uses the packed figure, which is correct. But the report's "across three
        units c* moves by about 15%" excludes a fourth unit sitting in the durable
        results.json whose spread is larger and whose value is wrong.
      cheapest_check: >-
        python3 -c "import math;print(88.494071+math.log2(math.log2(3329)))" against
        results.json per_parameter_set.Kyber512.memory_peak.log2_memory_bits_information_theoretic.

    - id: OBJ-7
      severity: moderate
      title: >-
        H7's "SOURCED" label on c = 1/3 is a transfer by analogy, and the unsourced
        c = 1/2 still appears in a headline ratio.
      statement: >-
        Labelling of the unsourced members is as good as labelling gets - the
        provenance table, H7's validation_status, and
        what_this_batch_did_not_validate all say c=1/2 and c=1/6 are the batch's own
        construction. Usage is worse: section 5 states "c* is 15.8x / 10.9x / 70.9x
        smaller than the UNSOURCED 2D exponent 1/2", putting an unsourced number in a
        headline ratio that adds nothing (1/2 > 1/3 makes it arithmetically
        redundant). c=1/6 has no interpretation at all yet occupies a row in all
        three margin tables at equal typographic weight. The larger problem is on the
        sourced side: KN-LIT-094 supplies ONE worked example (BSGS: n^(1/2) steps,
        n^(2/3+o(1)) full cost). The batch back-derives a general T*M^(1/3) law from
        it and applies the law to a sieve. BSGS makes n^(1/2) accesses each spanning
        an n^(1/2)-cell table; a bucketed list-decoding sieve does not, and whether
        the exponent transfers is precisely the question KN-OPEN-017 poses and
        declares unanswered. KN-LIT-094's own corpus entry states under "Not verified
        here" that the 3D wiring bound and the Section 3+ derivations were not
        re-derived. So the headline compares c* against an exponent whose
        applicability to this algorithm is the open problem cited as the motivation.
      cheapest_check: >-
        Read knowledge/literature/KN-LIT-094.md "Key claims (as reported)" and "Not
        verified here" and check whether any sentence states a general T*M^(1/3) law
        for arbitrary access patterns, or only the BSGS instance.
      required_restatement: >-
        Downgrade "SOURCED" to "transferred by analogy from KN-LIT-094's BSGS
        analysis; the transfer to a bucketed sieve is not established." Delete the
        ratio-to-1/2 sentence.

    - id: OBJ-8
      severity: moderate
      title: >-
        H10 declined an in-scope check on a false premise; the check takes 26 s and
        its result corrects H10's stated direction.
      statement: >-
        H10 justifies not re-optimising by saying it "requires a cost model for
        lower-memory sieve variants ... that RC.MATZOV does not provide." True of
        VARIANT sieves; false of the check that matters. Re-optimising beta/eta/d
        WITHIN RC.MATZOV needs nothing new - put the M^c charge inside the reduction
        cost model and the estimator re-optimises itself. I ran it (RT-C, advisory /
        uncovered path). At c=1/3 the re-optimum recovers +0.461 / +0.441 / +0.353
        bits against the package's Model B figures; at c=1/6, +0.147 / +0.131 /
        +0.068. So the "upper bound" caveat is worth under half a bit against an
        undercut of 2.80 bits: a within-family re-optimising attacker CANNOT recover
        the undercut - it would need 26.70 bits and gets 0.46. Separately, H10's
        predicted direction is half wrong: beta moves UP (389->393, 606->609,
        855->858) and eta DOWN (422->418, 640->637, 889->886) - more BKZ
        preprocessing to shrink the final BDD call, which is the sieve that sets peak
        memory per H2/H3.
      ceiling_argument_that_was_available_for_free: >-
        Under RC.MATZOV the charge adds c*0.2075 per unit sieve dimension, i.e.
        0.0692 at c=1/3, while the free-memory term grows at ~0.296 per unit in the
        opposite direction. Recovering 26.70 bits by shrinking the sieve dimension
        would need dn ~ 386, the entire sieve. A two-line method-ceiling argument
        would have replaced an unquantified caveat.
      what_H10_legitimately_leaves_open: >-
        Everything outside RC.MATZOV - tuple sieving, reduced-database sieving,
        enumeration hybrids. That is where the c=1/3 row can still move materially
        and it is the subject of the cheapest falsification below.
      cheapest_check: >-
        Subclass MATZOV, override __call__ to return the gate count times
        2^(c*(0.2075*beta_ + log2 beta_)) with beta_ = beta - d4f(beta), and call
        primal_bdd with it. ~26 s for three sets and two values of c. Reproduced in
        rt_e29029_probe.out section RT-C. Label the output unable_to_check: a charged
        reduction cost model is not covered by the harness known-answer control.

    - id: OBJ-9
      severity: moderate
      title: >-
        c* is a per-attack quantity carrying a scheme-level name, and no time-memory
        frontier is reported.
      statement: >-
        c* = 0.0316 / 0.0459 / 0.0071 is the critical exponent OF primal_bdd under
        RC.MATZOV AT THE FREE-MEMORY OPTIMUM. The scheme-level question - what charge
        is needed before NO attack undercuts the cutoff - is the maximum of c* over
        the attack frontier and is unknown. H12 gestures at this but states the
        direction too weakly: a low-memory attack has a SMALL log2 M, so even a
        modest undercut would give it a LARGE c*, and the scheme-level exponent could
        exceed 1/3 while this one sits at 0.03. Separately, no deliverable carries a
        dominated_by or sota_delta field (grep -c returns 0 across all four
        artifacts). For an Executor observation record that is arguably not required;
        but the package does make a frontier claim in prose (charged sieving costs
        169.70 / 244.84 / 331.03 bits) while reporting ONE point of a time-memory
        frontier against a scalar cutoff. The missing row is the low-memory one - the
        lattice analogue of the van Oorschot-Wiener interpolation this contract
        requires before a memory-heavy cost is charged and compared.
      cheapest_check: >-
        grep -c "dominated_by\|sota_delta" on the four artifacts (returns 0); then
        read H12 and check whether it states the direction as "c* rises
        proportionally" (it does) or as "the scheme-level exponent is a maximum over
        the frontier and is unbounded by this batch" (it does not).

    - id: OBJ-10
      severity: minor
      title: The batch establishes THAT the free-memory convention exists, never WHY.
      statement: >-
        H6 shows the cutoffs are gate counts with no memory term, citing KN-LIT-7617,
        KN-LIT-110 and KN-OPEN-017. Every assertion is about the convention's
        EXISTENCE. Its PURPOSE is nowhere stated: a free-memory gate count is chosen
        as a LOWER BOUND on attack cost so a security claim is not hostage to a
        hardware model. Charging memory always moves the estimate in the defender's
        favour, which is exactly why a conservative standard declines to. KN-LIT-094's
        own corpus entry contains the sentence that makes the point - Wiener "states
        explicitly that counting only processor steps is a conservative choice for the
        cryptographer" - and the batch cites KN-LIT-094 four times without quoting it.
        Consequence: a reader cannot tell from the package whether the free-memory
        result was overturned or merely departed from, and only one of those is a
        criticism.
      cheapest_check: >-
        grep -i "conservative" across derivation_report.md and heuristics.yaml
        (absent), then read knowledge/literature/KN-LIT-094.md "Key claims (as
        reported)", second bullet.

    - id: OBJ-11
      severity: minor
      title: The direction of the result was determined before the run; the package should say so.
      statement: >-
        For M >= 1 and c >= 0, T*M^c >= T. Memory charging can ONLY raise the
        estimate. The direction was fixed by construction and the magnitude was
        pinned to within ~15% (unit slip) and ~10% (H2 sieve-dimension slip) by two
        numbers already in the ledger. The inventor-protocol section-3 test - name the
        parameter whose increase destroys the signal - has no answer here: no
        parameter makes c* stop being small.
      why_this_is_NOT_a_rule_9_concern: >-
        Four reasons, and I hold them. (1) KN-OPEN-017 posed the question on
        2026-07-24, before this batch. (2) The Coordinator's BATCH-010 objective
        pre-registered the direction: "report the margin in whichever direction it
        falls". (3) A program that only ever reports margin-reducing findings and
        suppresses the margin-restoring one is the failure mode rule 9 names;
        reporting an inconvenient direction is compliance. (4) The batch declined the
        overclaim available to it - section 7 item 2 says in terms that a raised
        estimate is not a proof of security, and it wrote its own section 8.
      cheapest_check: >-
        Read the BATCH-010 dispatch_queue.json objective field and KN-OPEN-017's
        "added" date.
      required_restatement: >-
        State plainly that the direction of the result was determined by the algebra
        and only the magnitude was in question, so a determined direction is not
        mistaken for a confirmed one.

  # ------------------------------------------------------------ required controls
  required_controls:
    - id: RC-1
      title: Replace CTRL-5 with a non-degenerate null.
      spec: >-
        Sign null: score the same pinned costs against a cutoff they do not undercut
        (Kyber-1024 vs 207 -> margin -63.7236, c* = -0.352210; Kyber-512 vs 128 ->
        margin -12.1995, c* = -0.137856). Denominator null: substitute an arbitrary
        sieve-memory exponent in [0.05, 0.40] and confirm the inequality c* < 1/3 is
        invariant. Both run in rt_e29029_probe.out; neither requires an estimator call.
      status: run_by_red_team_available_for_reuse
    - id: RC-2
      title: Charge the correct memory unit.
      spec: >-
        Recompute or withdraw log2_memory_bits_information_theoretic; if retained,
        restate the "c* moves by about 15% across units" claim to include it.
      status: not_run
    - id: RC-3
      title: Additive access-fraction model.
      spec: >-
        Recompute the H9 table under (1-f)*T + f*T*M^c and confirm the c=0 row equals
        the CTRL-2-pinned free-memory cost for every f. Publish the exact crossings
        f* = 2^-26.70 / 2^-37.84 / 2^-59.03 instead of, or beside, the decade grid.
      status: not_run
    - id: RC-4
      title: Access-DISTANCE sensitivity, not only access-count.
      spec: >-
        Either source a bucket/filter working-set exponent for the list-decoding
        sieve and recompute c* against M_eff, or record that
        MATZOV.NN_AGPS (estimator/reduction.py:972-998) carries only time-fit
        coefficients so the instrument cannot supply one, and leave KN-OPEN-017's
        access-pattern half explicitly open. Note the bound already established:
        locality alone cannot restore the undercut at c=1/3 unless
        log2 M_eff <= 3*margin = 8.40 / 18.12 / 3.83 bits.
      status: partially_run_by_red_team

  counterexample_or_mutation: >-
    The decisive mutation is on the DENOMINATOR, not the numerator. Replacing the
    sourced sieve-memory exponent 0.2075 with any value in [0.05, 0.40] leaves the
    headline inequality c* < 1/3 intact (c* = 0.100582 / 0.059462 / 0.031646 /
    0.022564 / 0.017221 at 0.05 / 0.10 / 0.2075 / 0.30 / 0.40 on Kyber-512). That
    mutation fails to break the conclusion, which is the batch's best defence and
    simultaneously the demonstration that H4's three-way sourcing effort and H2's
    sieve-dimension resolution are not load-bearing on the headline. The mutation
    that WOULD break the conclusion is on the attack, not the memory model: see the
    named falsification below.

  baseline_comparison:
    note: >-
      Pollard-rho and BSGS are not the relevant baselines for a lattice cost-model
      derivation; BSGS enters only as the source analogue inside KN-LIT-094. The
      applicable frontier is below.
    rows:
      - baseline: primal_bdd / RC.MATZOV at c = 0 (EV-MLKEM-015)
        cost_bits: 140.1995 / 200.9587 / 270.7236
        memory_log2_zq: 88.494 / 131.657 / 180.925
        status: reproduced, delta 0.0
      - baseline: same attack, charged at c = 1/3, free-memory operating point (package headline)
        cost_bits: 169.6975 / 244.8445 / 331.0320
        memory_log2_zq: unchanged
        status: reproduced
      - baseline: same attack, charged at c = 1/3, memory-aware re-optimum inside RC.MATZOV
        cost_bits: 168.5684 / 243.7004 / 329.8818
        note: recovers only 0.461 / 0.441 / 0.353 bits; beta up, eta down
        status: unable_to_check (uncovered path, red-team advisory)
      - baseline: any polynomial-memory (enumeration) reduction cost model, charged at c = 1/3
        cost_bits: NOT COMPUTED
        note: >-
          RC.CheNgu12 / RC.ABFKSW20 / RC.ABLR21 are present in the pin at
          estimator/reduction.py:1040-1049. This is the missing Pareto row and the
          named falsification.
        status: unable_to_check
      - baseline: KN-LIT-094 source analogue - BSGS, n^(1/2) steps -> n^(2/3+o(1)) full cost
        note: the sole worked example from which the batch back-derives a general T*M^(1/3) law
        status: unable_to_check (Sections 3+ not re-derived per the corpus entry)
    dominated_by: >-
      NOT ESTABLISHED - and this is stated as a gap, not as null. The package reports
      one point of a time-memory frontier and compares it to a scalar cutoff without
      checking the low-memory row. Under AGENTS rule 5 and the inventor protocol,
      an unchecked null would be a fabrication; it is therefore recorded here as
      unknown.

  heuristic_challenges:
    - heuristic: H2 (sieve dimensions read from source)
      challenge: >-
        Correctly and carefully sourced, and NOT load-bearing. H2's own direction
        clause concedes it moves c* "by a few percent"; RT-B3 shows the headline
        survives a 8x change in the memory exponent. Good practice, oversold as
        decisive.
    - heuristic: H3 (peak = max over sequential sieves)
      challenge: >-
        Unvalidated but correctly bounded at <= 1 bit, and Model B sidesteps it.
        No objection.
    - heuristic: H4 (2^(0.2075n) database) and H5 (Z_q unit)
      challenge: >-
        "SOURCED THREE WAYS, none of them an assumption made here" is overstated.
        estimator/lwe_primal.py has NO memory field and never calls short_vectors -
        I verified both by grep. The 0.2075 literal cited from
        reduction.py:415/854/936 lives in short_vectors(), a function primal_bdd
        does not invoke, annotated by the estimator's own authors with the comment
        "# pick something". H5's "numerator and denominator live in one convention"
        borrows the convention from lwe_dual.py:172, a different module.
        MATZOV.NN_AGPS carries only time-fit coefficients a and b. The construction
        is defensible; the sourcing claim is not. Note that reduction.py:854 uses
        floor(d4f(beta)) while the gate-count path at :801 does not, so the
        instrument does not even have one sieve dimension.
    - heuristic: H6 (c = 0 is the published convention)
      challenge: Establishes existence, never purpose. See OBJ-10.
    - heuristic: H7 (charge family)
      challenge: See OBJ-7 - the "SOURCED" label on 1/3 is a transfer by analogy.
    - heuristic: H8 (cutoff not re-charged)
      challenge: >-
        The argument (AES key search is O(1) storage, so M_ref^c = 1) is sound in
        shape. But H8 lists CTRL-5 as its validator, and CTRL-5 is the tautology in
        OBJ-3, so H8 is validated_by nothing. Its own validation_status already says
        unvalidated; the validated_by field contradicts it.
    - heuristic: H9 (all gates charged as accesses)
      challenge: See OBJ-4 and OBJ-5 - not independent evidence, wrong model shape, wrong axis.
    - heuristic: H10 (no memory-aware re-optimisation)
      challenge: See OBJ-8 - declined on a false premise; the in-family check is 26 s.
    - heuristic: H11 (NIST cutoffs inherited)
      challenge: >-
        Boundary correctly inherited and correctly flagged. The self-consistent
        consequence - that Kyber-1024's c* is not meaningful to three significant
        figures - is stated in section 8 item 6 and contradicted by every table.
    - heuristic: H12 (scope)
      challenge: See OBJ-9 - direction stated too weakly for low-memory attacks.

  cost_model_challenges:
    - >-
      Total-vs-per-attempt bookkeeping: not applicable here (a deterministic cost
      estimate, no success probability), and the package does not confuse them.
    - >-
      Hidden overhead: the charge multiplies the WHOLE Kyber.__call__ return, which
      includes self.LLL(d) - a memory-light term. A small overcharge in the
      direction of the batch's conclusion; below the reported precision but
      undisclosed.
    - >-
      Memory beside time: reported, and this is a strength. What is missing is the
      frontier - the low-memory row (OBJ-9).
    - >-
      Unit slip: measured and bounded at ~15% across three units (a genuine
      contribution), but a fourth unit in the durable results.json is 8.15 bits wrong
      (OBJ-6).
    - >-
      The o(1) in 2^(0.2075n + o(n)): the corpus entries the batch cites
      (KN-LIT-6625, KN-LIT-6765) state the exponent WITH an o(n) term. The batch
      uses the bare exponent. At n_peak ~ 385-825 an o(n) term is not obviously
      negligible; nothing in the package bounds it. Direction unknown, which is the
      point.

  reduction_and_scope_challenges:
    - >-
      No published reduction is instantiated in this package, so the
      reduction-instantiation audit does not apply and is recorded as such rather
      than silently omitted.
    - >-
      Scope inflation: NONE FOUND, and this deserves saying. The package restricts
      itself to primal_bdd/RC.MATZOV, states Arora-Groebner is unavailable, refuses
      any "best attack overall" phrasing, refuses to close KN-OPEN-016 or
      KN-OPEN-017, and refuses to call the result a security proof. On scope
      discipline this package is better than most.
    - >-
      Scope UNDER-statement: the batch does not state that it computes only half of
      KN-OPEN-017's declared closure condition (the list, not the access pattern).
      See OBJ-4(iii).

  proof_architecture_challenges:
    - audit: exact baseline reproduction
      result: PASS - CTRL-0/CTRL-2 reproduce the archived Sage reference at delta 0.0; I re-ran it.
    - audit: observation-collision search
      result: >-
        FAIL. c* is a lossy projection of (margin, log2 M) onto one scalar. Distinct
        underlying situations - a large margin with a large memory, and a small
        margin with a small memory - map to the same c*. RT-A1/A2 exhibit the fibre
        explicitly. The missing separator is the pair itself: report (margin, log2 M),
        not their ratio.
    - audit: quantifier order
      result: >-
        The claim is "there exists c* such that for all c >= c*, the charged cost
        exceeds the cutoff FOR THIS ATTACK". The interpretation offered is "for all
        attacks", which requires a maximum over the frontier that was not taken
        (OBJ-9). The witness (the attack) is chosen before the quantifier over c,
        which is correct; the error is in the reading, not the derivation.
    - audit: method ceiling
      result: >-
        Not computed by the batch; computable in two lines and I supply it in OBJ-8.
        The ceiling for within-family re-optimisation is far below the 26.70-bit
        headline, which SUPPORTS the batch.
    - audit: nearby-object control
      result: >-
        Absent. The nearest object for which the conclusion is false is a
        polynomial-memory attack. It was never costed. That is the falsification
        below.

  narrowest_supported_statement: >-
    Under lattice-estimator 3e48ef421ec256afddb3e7d2249a77eab6e9ba12 with the
    Sage-free harness whose known-answer control reproduces RUN-MLKEM-015-001 at
    delta 0.0, for the single attack primal_bdd under RC.MATZOV evaluated at the
    parameters that minimise its FREE-MEMORY gate count, the EV-MLKEM-015 undercuts
    of the NIST classical cutoffs (2.800527 / 6.041285 / 1.276377 bits) are erased
    by a uniform charge M^c on the whole gate count for any c above
    0.031646 / 0.045886 / 0.007055 respectively, where log2 M is the peak sieve
    database taken as 2^(0.2075*n_peak) vectors of n_peak coefficients in Z_q. That
    threshold equals the free-memory margin divided by log2 M and is therefore
    determined by two quantities that pre-date this batch. The inequality
    c* < 1/3 is invariant to the sieve-memory exponent across [0.05, 0.40], to the
    unit chain, to both charge models, and (advisory) to within-RC.MATZOV
    memory-aware re-optimisation. NOTHING above is a statement about ML-KEM
    security, about attacks other than primal_bdd, about cost models other than
    RC.MATZOV, or about whether c = 1/3 is the correct wiring exponent for a
    bucketed sieve. In particular it does not contradict, correct, or qualify
    EV-MLKEM-015, whose undercut is a c = 0 statement.

  named_cheapest_falsification: >-
    Run primal_bdd (and primal_usvp) in the same pinned harness under a
    POLYNOMIAL-MEMORY, enumeration-based reduction cost model already shipped in the
    pin - RC.CheNgu12, RC.ABFKSW20 or RC.ABLR21, present at
    /tmp/le/estimator/reduction.py:1040-1049 - and charge it M^c with M polynomial.
    If any lands below 143 / 207 / 272 bits at c = 1/3, the sentence "the undercut
    does not survive memory charging" falls immediately, because the memory-charged
    best attack would then still undercut. One estimator call per set per model;
    seconds of compute; no new mathematics and no new instrument. It is also
    precisely the question KN-OPEN-017 asks - where the enumeration/sieving
    crossover moves under full cost - so the check pays twice. I did NOT run it (the
    handoff budgets one run, spent on the control plus RT-A/B/C) and therefore
    assert nothing about its outcome; marked unable_to_check. The a-priori
    expectation - an ARGUMENT, not a computation - is that the enumeration models'
    super-exponential growth in beta makes recovery of 26.70 bits at beta ~ 389
    implausible. That expectation is exactly what the check exists to test. A second,
    cheaper check falsifies the SOURCING rather than the number: grep -n "mem"
    /tmp/le/estimator/lwe_primal.py returns nothing, so the instrument supplies no
    memory figure for this attack at all and H4/H5's "sourced" language is
    unsupported.

  constraints_attached_to_the_pass:
    - Restate the headline as the inequality and its invariance, not an eight-digit exponent; two significant figures maximum.
    - >-
      Downstream records must use the report's qualified wording ("examined here"),
      never the commit message's "survives only under literally free memory", and
      must state that EV-MLKEM-015 is not contradicted, corrected or qualified.
    - Rename the quantity c*(primal_bdd, RC.MATZOV) and state the scheme-level exponent is a maximum over the frontier and unknown.
    - Correct the multiplicative f-model, or scope it to f*M^c >> 1.
    - Correct or withdraw log2_memory_bits_information_theoretic and restate the 15% unit-robustness claim accordingly.
    - Downgrade "SOURCED" on c = 1/3 to "transferred by analogy from KN-LIT-094's BSGS analysis"; delete the ratio-to-1/2 sentence.
    - Stop describing CTRL-5 as a null-object control; adopt RC-1 or record the controls-before-belief obligation as unmet.
    - Record that the direction of the result was fixed by the algebra and only its magnitude was in question.
    - >-
      Nothing here supports closing KN-OPEN-016 or KN-OPEN-017. KN-OPEN-017 remains
      open on the access-pattern half of its own stated closure condition. The batch
      does not claim otherwise and neither does this report.

  what_this_report_does_not_do:
    - It does not reject the package. The arithmetic reproduced exactly on an independent re-derivation.
    - It does not call a bounded cost-model result an impossibility or a security proof.
    - It does not reject a conditional result for being conditional on stated heuristics.
    - It does not claim ML-KEM is broken or that any parameter set is safe.
    - It does not alter the Executor's receipt or any Validator artifact.
    - It does not commit anything; no git commit was run in this task.

  next_concrete_action: >-
    Coordinator: dispatch ONE Executor task, budget <= 600 s and one run, that
    charges the pinned harness's polynomial-memory reduction cost models
    (RC.CheNgu12 / RC.ABFKSW20 / RC.ABLR21) at c in {0, 1/6, 1/3} for the three
    FIPS 203 sets, and reports the resulting (time, memory) frontier row beside the
    RC.MATZOV row already in hand. That single task closes the one gap that could
    overturn the batch's conclusion (OBJ-9, the named falsification), supplies the
    missing dominated_by determination, and answers the primal-side half of
    KN-OPEN-017 that this batch left open. It must carry the same uncovered-path
    warning: the known-answer control covers primal_bdd/RC.MATZOV only, so any
    result under a different reduction cost model is unable_to_check until a Sage
    reference exists for it.

