schema: crypto.autoresearch.red_team_report.v1
red_team_report:
  id: RT-20260731-002
  task_id: TASK-20260731-011
  experiment_ids: [EXP-MLKEM-011, EXP-MLKEM-012]
  hypothesis_ids: [H-MLKEM-011, H-MLKEM-012]
  evidence_ids: [EV-MLKEM-011, EV-MLKEM-012]
  decision_ids: [DEC-20260731-003, DEC-20260731-004]
  knowledge_ids: [KN-FIND-012, KN-FIND-013]
  goal_id: GOAL-MLKEM-003
  batch_id: BATCH-004
  run_ids: [RUN-MLKEM-011-001, RUN-MLKEM-012-001]
  role: red-team
  audited_by: red-team
  audited_at_utc: '2026-07-31T17:45:04Z'
  independent_session: true
  official_state_change: none
  validator_report_ref: >-
    coordination/goals/GOAL-MLKEM-003/batches/BATCH-004/tasks/TASK-20260731-010/validation_report.yaml
  validator_verdict_observed: accept_with_qualifications

  inference:
    requested_policy: review-xhigh
    resolved_model_id: cursor-grok-4.5
    fallback_allowed: true
    fallback_used: true
    independent_session_required: true
    independent_session: true
    note: >-
      Independent session from the Executor and from VAL-20260731-002.
      Requested review-xhigh is not a distinct reachable backend in this
      harness; Cursor Grok 4.5 used with fallback_used true. This session did
      not author EXP-MLKEM-011/012, EV-MLKEM-011/012, DEC-20260731-003/004,
      KN-FIND-012/013, or VAL-20260731-002.

  claim_under_review: >-
    That EV-MLKEM-011 / KN-FIND-012 establish a durable Carrier Fig 4.1
    Pwrong coverage gap versus the Pgood≈1/2 threshold; that EV-MLKEM-012 /
    KN-FIND-013 show Carrier CC NIST shortfalls are brittle under HEUR-S1;
    that DEC-20260731-003 and DEC-20260731-004 refine plus KN-FIND-012/013
    promotion are warranted; and that these results do not restore ML-KEM
    security or close KN-OPEN-016.

  verdict: pass_with_constraints
  blocks_ledger_record: false

  disposition_on_dec:
    - decision_id: DEC-20260731-003
      recorded_decision: refine
      red_team_disposition: accept_with_constraints
      refine_stands: true
      promote_kn_find_012: true
      constraints: >-
        Keep KN-FIND-012 as an archived-data coverage / extrapolation-distance
        finding. Do not treat the ~84-bit toy-floor→Kyber-512 Table C.2 gap as
        a measured Pwrong underestimation. Retain same-F header reading as
        load-bearing; if primary verifyModel code shows different
        normalizations, reopen H-MLKEM-011 falsification.
    - decision_id: DEC-20260731-004
      recorded_decision: refine
      red_team_disposition: accept_with_constraints
      refine_stands: true
      promote_kn_find_013: true
      constraints: >-
        Promote KN-FIND-013 only as numbered-heuristic Case A sensitivity
        arithmetic. HEUR-S1 is an accounting convention, not derived
        ε-restoration physics. Forbid reading “shortfalls erased” as ML-KEM
        security restored or Carrier falsified. Align EV-012 / RUN-012
        headline / DEC-004 prose Δ to machine-readable 9.46/14.36/14.76.
        Leave KN-OPEN-016 open.

  what_would_set_blocks_ledger_record_true: >-
    Demonstrated incommensurate Pwrong/Pgood score units voiding the T-range
    comparison; any ledger phrasing that equates the ~84-bit floor gap with a
    measured Kyber-scale Pwrong error and treats NIST shortfalls as erased /
    ML-KEM security restored; presentation of HEUR-S1 as experimentally
    validated payment physics; or break / FIPS-203-contradiction language.

  attack_lines_challenged:
    - id: AL-1
      title: Pwrong/Pgood score-scale commensurability
      landed_as: defeated_as_fatal_residual_only
      severity: high
      summary: >-
        Fatal only if units differ. Archived headers claim the same score F
        (Pwrong: P(F≥i); Pgood: F(solution)) on matched left-panel parameters.
        Independent recomputation confirms fraction_inside=0. No positive
        evidence of different normalizations. Residual: headers are claims,
        not a code audit of verifyModel.
    - id: AL-2
      title: equating KN-FIND-012 ~84-bit floor gap with measured Pwrong underestimation
      landed_as: landed
      severity: high
      summary: >-
        The ~84 bits are toy-floor log2(Pwrong)≈−35.70 minus Kyber-512 Table
        C.2 −119.57 — an extrapolation/coverage distance across regimes, not
        a measured model error at the operating threshold. RUN-012 headline
        and H-MLKEM-012 “far below the ~84-bit … gap” invite illicit transfer
        into Δ. cost_sensitivity.json/KN-FIND-013 label “upper reference”
        correctly; adoption language must keep that label load-bearing.
    - id: AL-3
      title: HEUR-S1 realism (does restoring ε cost +Δ in the second term?)
      landed_as: landed
      severity: high
      summary: >-
        From ε ∝ R·Pwrong, holding ε fixed when Pwrong is 2^Δ larger by
        shrinking R moves log2(R·(N·Tdec+TFFT)) by −Δ, not +Δ. HEUR-S1’s +Δ
        payment therefore encodes a particular restoration path (e.g. improve
        decode/FFT at fixed R), not a theorem. Case A table remains valid as
        what-if arithmetic under that convention; it does not establish that
        restoring ε really costs +Δ.
    - id: AL-4
      title: overclaiming NIST shortfalls erased as ML-KEM security restored
      landed_as: constrained_not_fatal
      severity: high
      summary: >-
        Written non_claims refuse break language and mark HEUR-S1 conditional.
        Residual marketing risk: “erase/erased shortfalls” + coupling to the
        84-bit gap reads as security restored / Carrier defeated. Forbid that
        paraphrase; keep GOAL/KN-OPEN-016 open.
    - id: AL-5
      title: whether DEC refine + KN-FIND promotion is warranted
      landed_as: warranted_under_constraints
      severity: medium
      summary: >-
        DEC-003 refine + KN-FIND-012: yes — durable archived coverage gap.
        DEC-004 refine + KN-FIND-013: yes only as conditional Case A
        sensitivity under numbered HEUR-S1, after prose-Δ correction and
        AL-2/AL-3/AL-4 constraints. Neither closes KN-OPEN-016.

  objections:
    - id: OBJ-RT011-001
      number: 1
      attack_line: AL-1
      title: Pwrong/Pgood units match under archived file claims
      severity: high
      status: defeated_as_fatal
      blocks_ledger_record: false
      fatal_to_refine: false
      contest: >-
        Whether comparing Pwrong last-positive index T=1802 to Pgood scores
        (min≈6668) mixes incommensurate units, voiding the coverage-gap claim.
      finding: >-
        Pwrong header: line i = P(F≥i) for score F (first approximation of
        P_wrong). Pgood header: each line is F(solution). Same Fig 4.1
        left-panel stem (q=241,m=40,n=43,…,N=25971), both nb_iteration=4000.
        Recomputed fraction_Pgood_inside_Pwrong_T_range = 0; T-gap ≈4866;
        log2 floor ≈−35.70; Kyber-512 gap ≈83.87 bits. H-MLKEM-011
        falsification on incommensurate normalizations does not fire on the
        artifacts. Residual qualification only: no fresh verifyModel code
        path audited (G6K blocked).
      required_constraint: >-
        Cite coverage gap as same-F archived-header reading. Reopen if
        verifyModel shows distinct normalizations for uniform-target vs
        solution scores.

    - id: OBJ-RT011-002
      number: 2
      attack_line: AL-2
      title: ~84-bit floor gap is not measured Pwrong underestimation
      severity: high
      status: landed
      blocks_ledger_record: false
      fatal_to_refine: false
      contest: >-
        Whether KN-FIND-012’s ~84-bit toy→Kyber-512 log2(Pwrong) distance may
        be used as (or compared as if) a measured underestimation Δ feeding
        HEUR-S1.
      finding: >-
        Gap = (−119.57) − (−35.70) across toy simulation floor vs Table C.2
        claimed Kyber Pwrong. It bounds how far claimed Kyber Pwrong sits
        below the deepest positive toy mass; it does not measure Approx 4.9
        error at the Pgood≈½ operating T (unmeasured). H-MLKEM-012 statement,
        RUN-012 headline (“comparable to or far below the ~84-bit … gap”),
        and EV-012 “much smaller than the Fig 4.1 coverage gap” rhetorically
        couple the quantities. KN-FIND-013/cost_sensitivity anchor text
        correctly says “upper reference, not a measured underestimation” —
        that must bind all citations.
      required_constraint: >-
        Never substitute 84 for a measured Δ. Allow “upper reference /
        coverage distance only”; forbid “Pwrong is underestimated by ~84
        bits” or “15 ≪ 84 therefore shortfalls fail.”

    - id: OBJ-RT011-003
      number: 3
      attack_line: AL-3
      title: HEUR-S1 +Δ second-term payment is not ε-restoration physics
      severity: high
      status: landed
      blocks_ledger_record: false
      fatal_to_refine: false
      contest: >-
        Whether restoring the same ε after a Δ-bit Pwrong underestimation
        necessarily costs at least +Δ in log2(R·(N·Tdec+TFFT)).
      finding: >-
        Under Approx 4.9, ε = R·q^{k_fft}·Pwrong. If true Pwrong is 2^Δ larger
        and R is reduced by 2^Δ to hold ε fixed (other factors fixed), the
        second term falls by Δ bits — opposite HEUR-S1. The +Δ Case A path
        assumes a different restoration (e.g. buy back Pwrong via heavier
        decode/FFT at fixed R) and is not derived from Theorem 4.1. Full
        re-optimization may move Tsample, β, n_fft, etc. (Case B is only a
        crude envelope). DEC-004 already marks HEUR-S1 unvalidated; red-team
        strengthens that to mechanistic non-derivation. Case A crossovers
        9.46/14.36/14.76 remain correct what-if arithmetic under the stated
        convention and still support conditional H-MLKEM-012.
      required_constraint: >-
        Label HEUR-S1 as accounting convention / sensitivity knob, not
        “restoring ε costs +Δ.” Do not claim experimental validation of the
        payment map. Prefer “if second term is charged +Δ” over “Pwrong miss
        of Δ bits erases shortfalls.”

    - id: OBJ-RT011-004
      number: 4
      attack_line: AL-4
      title: Erased shortfalls ≠ ML-KEM security restored
      severity: high
      status: landed_as_constraint
      blocks_ledger_record: false
      fatal_to_refine: false
      contest: >-
        Whether “NIST shortfalls are erased” under HEUR-S1 may be read as
        restoring ML-KEM / defeating Carrier / closing KN-OPEN-016.
      finding: >-
        EV-012, DEC-004, KN-FIND-013 non_claims refuse break language and
        corrected security levels. KN-OPEN-016 correctly keeps residual open
        (measure Pwrong near threshold or defend re-optimization). Constraint
        binds paraphrase only: conditional margin evaporation ≠ security
        restored.
      required_constraint: >-
        Cite only “CC NIST margins evaporate under stated Case A +Δ
        accounting.” Forbid “ML-KEM security restored,” “Carrier shortfalls
        erased” without HEUR-S1 qualifier, or KN-OPEN-016 closed/settled.

    - id: OBJ-RT011-005
      number: 5
      attack_line: AL-5
      title: DEC refine and KN-FIND promotions stand under constraints
      severity: medium
      status: landed
      blocks_ledger_record: false
      fatal_to_refine: false
      contest: >-
        Whether DEC-20260731-003/004 refine and KN-FIND-012/013 promotion are
        warranted given AL-1–AL-4.
      finding: >-
        DEC-003 refine + KN-FIND-012: warranted. Strongest scoped negative on
        Fig 4.1 experimental backup; redirects KN-OPEN-016 residual toward
        threshold-coverage / extrapolation. DEC-004 refine + KN-FIND-013:
        warranted as conditional sensitivity finding with numbered HEUR-S1,
        not as a corrected cost or Carrier falsification. Prose Δ drift
        (OBJ-RT011-006) must be fixed in EV-012/DEC-004 adoption text.
        GOAL-MLKEM-003 stays active; KN-OPEN-016 stays open.
      required_constraint: >-
        Keep both refine decisions; promote both findings under AL-2/AL-3/AL-4
        language locks; do not advance official goal closure on this package.

    - id: OBJ-RT011-006
      number: 6
      attack_line: process
      title: EV-012 / DEC-004 / RUN-012 prose Δ drift vs machine-readable
      severity: medium
      status: adopts_validator
      blocks_ledger_record: false
      fatal_to_refine: false
      contest: >-
        Whether drifted crossover prose (~9.6/14.9/14.6 or 9.61/14.90/14.59)
        undermines ledger adoption.
      finding: >-
        Independent Case A recomputation: 9.4555/14.3597/14.7598. JSON fields
        9.46/14.36/14.76 match. KN-FIND-013 ≈9.5/14.4/14.8 is consistent.
        EV-MLKEM-012 observations, RUN-012 headline, and DEC-004 rationale
        paraphrase a drifted triple. Adopts VAL-20260731-002
        Q-EV012-PROSE-DELTA-MISMATCH. Non-fatal to <15 decision rule; fatal
        to citing the drifted prose as authoritative.
      required_constraint: >-
        Correct EV-012 / DEC-004 / RUN-012 headline prose to 9.46/14.36/14.76
        (or KN-FIND-013’s rounded 9.5/14.4/14.8) before immutable citation.

  defeated_attack_readings:
    - >-
      That Pwrong and Pgood use different score units on the archived left
      panel: headers claim the same F; recomputation is consistent; fatal
      reading does not land.
    - >-
      That the package presents HEUR-S1 as experimentally validated: DEC-004
      non_claims and EV-012 boundaries mark it conditional/stated.
    - >-
      That the package claims an ML-KEM / FIPS-203 break: explicit non_claims
      refuse this.
    - >-
      That H-MLKEM-011/012 decision-rule numbers fail: fraction_inside=0 and
      Case A Δ<15 recomputed independently.

  heuristic_challenges:
    - id: HC-HEUR-S1
      heuristic: HEUR-S1
      challenge: >-
        +Δ second-term payment is not implied by ε∝Pwrong; R-reduction to hold
        ε gives −Δ. No random-model or primary-text derivation supplied for
        the +Δ map. Toy Fig 4.1 does not validate Kyber-scale Pwrong or the
        payment heuristic (scale honesty).
      disposition: constrain_not_reject_conditional_claim

  cost_model_challenges:
    - id: CMC-CASE-A-ACCOUNTING
      challenge: >-
        Case A is log2(2^Tsample + 2^(second_term+Δ)) what-if arithmetic.
        It is not a re-optimized Carrier Table 5.1 and must not be reported as
        a new attack cost.
      disposition: already_bounded_strengthen_language

  reduction_and_scope_challenges:
    - id: RSC-OPEN-016
      challenge: >-
        KN-OPEN-016 asks repaired dual cost vs primal and whether deployed
        sets lose security. This package narrows residual to Pwrong
        threshold-coverage / extrapolation and shows margin brittleness under
        a stated knob. It does not repair heuristics or answer the quantitative
        dual-vs-primal question.
      disposition: keep_open

  narrowest_supported_statement: >-
    On Carrier's archived Fig 4.1 left-panel outputs with headers claiming the
    same score F: empirical Pwrong is positive only through T=1802
    (log2≈−35.70), while all 4000 Pgood scores satisfy T≥6668 (fraction inside
    Pwrong T-range = 0); Kyber-512 Table C.2 log2(Pwrong)=−119.57 lies ~84
    bits below that toy floor as an extrapolation distance, not a measured
    underestimation. Separately, under the stated Case A accounting convention
    HEUR-S1 (charge +Δ to the FFT/decode term), Carrier CC totals cross NIST
    143/207/272 at Δ≈9.46/14.36/14.76. This supports H-MLKEM-011 and
    conditional H-MLKEM-012 at claim_tier medium, warrants DEC-003/004 refine
    and KN-FIND-012/013 under the constraints above, and does not restore
    ML-KEM security, validate HEUR-S1 as ε-restoration physics, or close
    KN-OPEN-016.

  required_controls:
    - id: CTRL-RT011-NO-84-AS-DELTA
      method: >-
        Any citation of KN-FIND-012 beside EXP-MLKEM-012 must call the ~84-bit
        figure a coverage/extrapolation upper reference only.
      pass_condition: >-
        No ledger or KN-OPEN-016 text treats 84 as measured Pwrong
        underestimation.
    - id: CTRL-RT011-HEUR-S1-ACCOUNTING
      method: >-
        Phrase Case A results as sensitivity under a stated +Δ accounting
        convention; note that ε∝Pwrong does not imply +Δ second-term payment.
      pass_condition: >-
        KN-FIND-013 / EV-012 / DEC-004 retain conditional/non-validated
        HEUR-S1 language; no “restoring ε costs +Δ” without the convention
        qualifier.
    - id: CTRL-RT011-PROSE-DELTA-ALIGN
      method: Align EV-012, RUN-012 headline, and DEC-004 to JSON crossovers.
      pass_condition: Prose Δ matches 9.46/14.36/14.76 (or KN-FIND-013 rounding).
    - id: CTRL-RT011-OPEN-016-SCOPE
      method: >-
        KN-OPEN-016 updates may record coverage gap + conditional brittleness
        without status change from open and without “security restored.”
      pass_condition: status remains open; residual stays measurement /
        defended-reoptimization.

  knowledge_promotion:
    kn_find_012_warranted: true
    kn_find_013_warranted: true
    kn_find_013_scope: >-
      Conditional Case A sensitivity under numbered HEUR-S1 accounting
      convention only.
    kn_open_016_status_change: none
    kn_open_016_allowed_update: >-
      Optional: retain/clarify Pwrong coverage gap and HEUR-S1 brittleness
      bullets without equating 84 to measured Δ and without closing the open
      problem.

  counterexample_or_mutation: >-
    Cheapest mutation: (1) audit verifyModel score normalization for
    uniform-target vs solution F; (2) re-optimize Carrier parameters under a
    forced +Δ log2(Pwrong) miss and report actual Δcost vs HEUR-S1; (3) if G6K
    installs, extend Pwrong measurements toward Pgood-median T.

  baseline_comparison: >-
    Not a dual-vs-primal recomputation. Baseline for EV-011 is authors'
    archived Fig 4.1 artifacts; baseline for EV-012 is Carrier CC Theorem 4.1
    intermediates from EXP-MLKEM-010 / Table C.2.

  next_concrete_action: >-
    Coordinator may keep DEC-20260731-003/004 refine and promote KN-FIND-012/013
    under the constraints above; correct prose Δ drift; open BATCH-005 for G6K
    Pwrong extension or a defended re-optimization that tests HEUR-S1;
    leave KN-OPEN-016 open.

  artifact_paths:
    - coordination/goals/GOAL-MLKEM-003/batches/BATCH-004/tasks/TASK-20260731-011/red_team_report.yaml
    - coordination/goals/GOAL-MLKEM-003/batches/BATCH-004/tasks/TASK-20260731-011/objections.md
