schema: crypto.autoresearch.validation_report.v1
validation_report:
  id: VAL-20260731-002
  task_id: TASK-20260731-010
  experiment_ids: [EXP-MLKEM-011, EXP-MLKEM-012]
  evidence_ids: [EV-MLKEM-011, EV-MLKEM-012]
  hypothesis_ids: [H-MLKEM-011, H-MLKEM-012]
  decision_ids: [DEC-20260731-003, DEC-20260731-004]
  knowledge_ids: [KN-FIND-012, KN-FIND-013]
  goal_id: GOAL-MLKEM-003
  batch_ids: [BATCH-003, BATCH-004]
  run_ids: [RUN-MLKEM-011-001, RUN-MLKEM-012-001]
  role: validator
  audited_by: validator
  audited_at_utc: '2026-07-31T17:43:24Z'
  independent_session: true
  official_state_change: none
  package: heuristic-coverage_plus_sensitivity

  inference:
    requested_policy: review-xhigh
    resolved_model_id: cursor-grok-4.5
    fallback_allowed: true
    fallback_used: true
    independent_session_required: true
    independent_session: true
    note: >-
      Independent session from the Executor. Requested review-xhigh is not a
      distinct reachable backend in this harness; Cursor Grok 4.5 used with
      fallback_used true. Session did not author EXP-MLKEM-011/012,
      EV-MLKEM-011/012, DEC-20260731-003/004, or KN-FIND-012/013.

  verdict: accept_with_qualifications
  overall_verdict: accept_with_qualifications
  admissibility_verdict: accept_with_qualifications
  blocks_ledger_record: false

  admissibility_statement: >-
    RUN-MLKEM-011-001 and RUN-MLKEM-012-001 are jointly admissible as the
    heuristic-coverage + conditional-sensitivity package for H-MLKEM-011 and
    H-MLKEM-012. Archived Fig 4.1 left-panel recomputation yields fraction
    Pgood inside Pwrong T-range = 0 and ~84-bit Kyber-512 floor gap; Case A
    NIST-crossover Δ recomputes to ≈9.46/14.36/14.76 (<15 on all sets) from
    CC intermediates. Scope stays non-break; HEUR-S1 is marked conditional;
    archived-data vs missing G6K is disclosed. Qualifications (prose Δ drift
    in EV-012/headline/DEC-004; residual score-scale commensurability risk)
    do not fire either hypothesis falsification_condition.

  what_would_set_blocks_ledger_record_true: >-
    fraction_Pgood_inside_Pwrong_T_range > 0.5 on archived left-panel files;
    demonstrated incommensurate Pwrong/Pgood score normalizations that void
    the T-range comparison; Case A crossover Δ > 15 on any Kyber set under the
    stated CC intermediates; or ML-KEM / FIPS-203 break language presented as
    established by this package.

  independence:
    session_independence: true
    independent_session: true
    basis: >-
      Fresh validator session. Inputs were working-tree EXP-MLKEM-011/012
      artifacts, ledger drafts, and vendor-lock .out files. Pwrong/Pgood
      statistics and Case A Δ recomputed with session-local Python, not the
      executor summary prose.

  recomputed:
    EXP-MLKEM-011:
      source_files:
        - experiments/EXP-MLKEM-011/vendor-lock/data/Pwrong_q241_m40_n43_nfft8_kfft3_nlat35_beta032_beta144_N25971.out
        - experiments/EXP-MLKEM-011/vendor-lock/data/Pgood_q241_m40_n43_nfft8_kfft3_nlat35_beta032_beta144_N25971.out
      sha256:
        Pwrong_left: 50bd293cadf952516b092524c25f4404a1e4ca40983d1751286f96269dbf90bb
        Pgood_left: f1e9cf478928e51fa772549ceb01359d98be0d90af25b784d5966bc1652dc5e1
      method: >-
        Parse numeric lines after '#' headers. Pwrong line i = P(F≥i);
        last_positive_T = max i with value>0; Pgood lines are F(solution)
        scores; fraction_inside = count(Pgood ≤ last_positive_T)/n.
      left_panel:
        Pwrong_last_positive_T: 1802
        Pwrong_value_at_floor: 1.7860305406935986e-11
        log2_Pwrong_at_floor: -35.70445229335197
        Pwrong_first_zero_T: 1803
        Pgood_n: 4000
        Pgood_min: 6667.6736159380725
        Pgood_median: 11964.473717715558
        Pgood_max: 17822.813536802816
        fraction_Pgood_inside_Pwrong_T_range: 0.0
        T_gap_minPgood_minus_lastPositivePwrongT: 4865.6736159380725
        kyber512_Table_C2_log2_Pwrong: -119.57
        log2_extrapolation_Kyber512_vs_toy_floor: -83.86554770664802
      matches_pwrong_scope_gap_json: true
      matches_results_json_scope_gap: true
      H_MLKEM_011_predictions:
        fraction_equals_0: true
        log2_extrapolation_at_most_-80: true
      falsification_conditions_fired: false

    EXP-MLKEM-012:
      source_files:
        - experiments/EXP-MLKEM-012/runs/RUN-MLKEM-012-001/cost_sensitivity.json
        - experiments/EXP-MLKEM-010/runs/RUN-MLKEM-010-001/results.json
      method: >-
        Case A: cost(Δ)=log2(2^Tsample + 2^(second_term+Δ)). Cross over when
        cost(Δ)=NIST; closed form Δ=log2(2^NIST−2^Tsample)−second_term.
        Primary intermediates taken from cost_sensitivity.json
        (Tsample/second_term as recorded); cross-checked against EXP-MLKEM-010
        pickle CC rows R+log2(NTdec+TFFT).
      cc_intermediates_used:
        Kyber-512: {second_term_log2: 133.41, Tsample: 139.51, nist: 143, baseline_log2: 139.53}
        Kyber-768: {second_term_log2: 192.64, Tsample: 194.81, nist: 207, baseline_log2: 195.1}
        Kyber-1024: {second_term_log2: 257.24, Tsample: 259.35, nist: 272, baseline_log2: 259.65}
      pickle_CC_second_term_recomputed:
        Kyber-512: 133.41343588966183
        Kyber-768: 192.63686766260503
        Kyber-1024: 257.24195599446773
      nist_crossover_CaseA_recomputed:
        Kyber-512: 9.455517990900148
        Kyber-768: 14.359691208477557
        Kyber-1024: 14.759775519365576
      nist_crossover_CaseA_json_rounded:
        Kyber-512: 9.46
        Kyber-768: 14.36
        Kyber-1024: 14.76
      all_three_less_than_15: true
      matches_cost_sensitivity_json_min_Delta: true
      H_MLKEM_012_prediction_less_than_15_all_sets: true
      falsification_conditions_fired: false
      prose_vs_machine_readable:
        results_headline_claimed: [9.6, 14.9, 14.6]
        EV_MLKEM_012_observations_claimed: [9.61, 14.90, 14.59]
        DEC_20260731_004_claimed: [9.6, 14.9, 14.6]
        KN_FIND_013_claimed: [9.5, 14.4, 14.8]
        machine_readable_ok: true
        prose_matches_recomputed: false
        note: >-
          Machine-readable min_Delta_CaseA_to_meet_nist fields are correct.
          EV-012 observations, RUN-012 headline, and DEC-004 rationale paraphrase
          a drifted ~9.6/14.9/14.6 triple; KN-FIND-013 ≈9.5/14.4/14.8 matches
          the JSON. Does not change the <15 decision rule.

  scope_check:
    ml_kem_break_claimed: false
    fips203_break_claimed: false
    key_recovery_claimed: false
    heur_s1_marked_conditional: true
    heur_s1_presented_as_experimentally_validated: false
    archived_data_vs_fresh_g6k_disclosed: true
    g6k_available_reported: false
    fresh_verifyModel_blocked_disclosed: true
    non_claims_present_in_EV_DEC_KN: true
    validator_verdict: pass
    note: >-
      EV/DEC/KN-FIND packages explicitly state non-break / conditional-
      sensitivity boundaries. RUN-011 validity is
      valid_for_archived_data_analysis; RUN-012 validity is
      valid_conditional_sensitivity. DEC-004 non_claims mark HEUR-S1 as a
      stated sensitivity heuristic, not experimentally validated.

  score_scale_commensurability:
    risk_id: Q-SCORE-SCALE-COMMENSURABILITY
    severity: medium
    auto_reject: false
    objection: >-
      H-MLKEM-011 falsification_conditions include incommensurate Pwrong/Pgood
      score normalizations. If Pwrong's F (uniform-target first approximation)
      and Pgood's F(solution) were scaled differently, the T-range gap could be
      an artifact.
    file_claims:
      Pwrong_header: >-
        Line i = P(F ≥ i) where F is the score function (first approximation
        of P_wrong(i)).
      Pgood_header: Each line is a value for F(solution).
      shared_params: >-
        Same q,m,n,n_fft,k_fft,n_lat,beta_0,beta_1,avg_N stem
        (q241_m40_n43_..._N25971); both nb_iteration=4000.
    validator_assessment: >-
      Headers claim the same score function F on matching Fig 4.1 left-panel
      parameters. No positive evidence of different normalizations found in
      this session. Flag as residual objection / qualification only — not an
      auto-reject under the stated file claims.
    validator_verdict: pass_with_objection

  hypothesis_checks:
    H-MLKEM-011:
      predictions_hold: true
      falsification_fired: false
      direction_supports: true
    H-MLKEM-012:
      predictions_hold: true
      falsification_fired: false
      direction_supports: true
      conditional_on: HEUR-S1

  artifact_checks:
    - path: experiments/EXP-MLKEM-011/runs/RUN-MLKEM-011-001/results.json
      present: true
      validator_verdict: pass
    - path: experiments/EXP-MLKEM-011/runs/RUN-MLKEM-011-001/pwrong_scope_gap.json
      present: true
      validator_verdict: pass
    - path: experiments/EXP-MLKEM-011/vendor-lock/data/Pwrong_q241_m40_n43_nfft8_kfft3_nlat35_beta032_beta144_N25971.out
      present: true
      validator_verdict: pass
    - path: experiments/EXP-MLKEM-011/vendor-lock/data/Pgood_q241_m40_n43_nfft8_kfft3_nlat35_beta032_beta144_N25971.out
      present: true
      validator_verdict: pass
    - path: experiments/EXP-MLKEM-012/runs/RUN-MLKEM-012-001/results.json
      present: true
      validator_verdict: pass_with_qualification
      qualification_ids: [Q-EV012-PROSE-DELTA-MISMATCH]
    - path: experiments/EXP-MLKEM-012/runs/RUN-MLKEM-012-001/cost_sensitivity.json
      present: true
      validator_verdict: pass
    - path: ledger/evidence/EV-MLKEM-011.yaml
      present: true
      validator_verdict: pass
    - path: ledger/evidence/EV-MLKEM-012.yaml
      present: true
      validator_verdict: pass_with_qualification
      qualification_ids: [Q-EV012-PROSE-DELTA-MISMATCH]
    - path: ledger/decisions/DEC-20260731-003.yaml
      present: true
      validator_verdict: pass
    - path: ledger/decisions/DEC-20260731-004.yaml
      present: true
      validator_verdict: pass_with_qualification
      qualification_ids: [Q-EV012-PROSE-DELTA-MISMATCH]
    - path: knowledge/findings/KN-FIND-012.md
      present: true
      validator_verdict: pass
    - path: knowledge/findings/KN-FIND-013.md
      present: true
      validator_verdict: pass

  qualifications:
    - id: Q-EV012-PROSE-DELTA-MISMATCH
      severity: medium
      note: >-
        Independent Case A Δ is 9.46/14.36/14.76. cost_sensitivity.json and
        results.json nist_crossover_CaseA fields match. EV-MLKEM-012
        observations (9.61/14.90/14.59), RUN-012 headline (~9.6/14.9/14.6),
        and DEC-20260731-004 rationale paraphrase drifted values; KN-FIND-013
        is consistent with the JSON. Correct prose before promoting EV-012 /
        DEC-004 beyond draft. Does not falsify H-MLKEM-012 (<15 still holds).
    - id: Q-SCORE-SCALE-COMMENSURABILITY
      severity: medium
      note: >-
        Residual risk that Pwrong P(F≥i) and Pgood F(solution) could use
        different normalizations. File headers claim the same F on matched
        parameters; treat as objection, not auto-reject. Would become a
        blocker if a red-team shows incommensurate scales.
    - id: Q-ARCHIVED-DATA-NO-FRESH-G6K
      severity: informational
      note: >-
        G6K unavailable; RUN-011 is archived-data analysis only. Disclosed in
        results.json, EV-011, DEC-003, and KN-FIND-012. Does not invalidate
        the coverage-gap measurement on the authors' .out files.
    - id: Q-HEUR-S1-CONDITIONAL
      severity: informational
      note: >-
        H-MLKEM-012 / EV-012 / KN-FIND-013 results are conditional on HEUR-S1
        (Case A second-term payment). Not a corrected Carrier cost and not a
        measured Kyber-scale Pwrong error. Package already marks this.
    - id: Q-LEDGER-DRAFTED-BEFORE-VALIDATION
      severity: informational
      note: >-
        Draft EV/DEC/KN-FIND artifacts already exist. blocks_ledger_record
        remains false because machine-readable decision-rule numbers hold;
        prose Δ drift is a qualification, not a numeric falsification.

  blockers: []
  failed_controls: []
  failed_artifacts: []

  limitations:
    - >-
      Coverage gap and conditional sensitivity are not key-recovery certificates
      and do not break ML-KEM / FIPS 203.
    - >-
      HEUR-S1 is a stated cost-model heuristic; Case B is an envelope only.
    - >-
      accept_with_qualifications admits the package under the stated scopes; it
      does not close KN-OPEN-016 or change official goal status by itself.

  artifact_paths:
    - coordination/goals/GOAL-MLKEM-003/batches/BATCH-004/tasks/TASK-20260731-010/validation_report.yaml
    - coordination/goals/GOAL-MLKEM-003/batches/BATCH-004/tasks/TASK-20260731-010/validation_notes.md
