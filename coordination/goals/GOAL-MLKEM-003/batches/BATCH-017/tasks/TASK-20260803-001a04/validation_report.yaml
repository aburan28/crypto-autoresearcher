      status: passed
    - control: instrument recovers slope -1 under N2, the floor-attaining member
      producer_result: N2 slope means in [-1.108, -0.922]
      validator_result: -1.0049, -1.0022, -0.9831, -0.9632, -1.0156 at the same five cells.
      status: passed
    - control: N2 is genuinely the minimum-variance independent-iteration member
      validator_result: >-
        checked from BATCH-015's own derivation and code, which I read before
        summarising (standing binding c).  Var(X) >= E[X] - E[X]^2 for
        non-negative-integer X, with equality iff X is 0/1, then Cauchy-Schwarz over
        the nb_iteration independent iterations gives Var(D_T) >= mu_T(1 - mu_T/nb).
        Binomial(nb, mu_T/nb) is the sum of nb iid Bernoulli(mu_T/nb), so it attains
        the bound with equality in both steps.  The bound and the attaining member
        are correct AS A PER-CELL statement.  LIMIT, recorded: N2 as implemented is
        independent ACROSS cells, whereas one iteration of the physical process
        deposits q^k_fft candidates that are jointly constrained across cells.  So
        N2 is the per-cell minimum-variance member, not the joint one, and neither
        null carries any cross-cell dependence.  The observed Pearson residuals do
        carry lag-1 correlation +0.104, so both nulls are optimistic on any
        statistic sensitive to it; for the quadratic terms the induced correlation
        is +0.015 and the effect is under 2 %.
      status: passed_with_limit
    - control: N2 reproduces the analytic floor for whole-band phi
      producer_result: '0.9219 +/- 0.0793 (n43) and 0.9704 +/- 0.0611 (n50) against 0.9182566 and 0.9669926'
      validator_result: >-
        0.9203 +/- 0.0784 at n43 degree 5 with my own exact binomial sampler; and I
        derive the analytic floor independently as 1 - sum(D)/(K*nb), which is exact
        and degree-invariant.
      status: passed
    - control: null-object control on the intercept (protocol section 3)
      validator_result: >-
        run and PASSED as a control, but the control is uninformative by
        construction: E[intercept] = 1 under BOTH nulls, so the intercept cannot
        discriminate between them and its agreement across the two nulls is an
        identity, not corroboration.  Defect D-1.
      status: passed_but_uninformative
    - control: decay test -- name the parameter that should destroy the signal
      validator_result: >-
        two such parameters exist.  (i) OCCUPANCY: under N2 the deficit must
        concentrate where occupancy is largest.  Measured across four score
        quartiles the deficit moves the other way (t = 0.973, 0.835, 0.778, 0.621 as
        occupancy falls), so the N2 signature is absent and the observed quantity
        fails to decay where N2 says it must.  (ii) RATE-MODEL RICHNESS: over-fitting
        deflates dispersion, so a spurious deficit should deepen with degree.  n43
        phi is 0.802, 0.805, 0.806, 0.808 at degrees 5-8 and BATCH-014 archives
        0.7998-0.8106 over degrees 5-12; it does not deepen.  Both decay tests are
        recorded.
      status: passed
    - control: positive control -- can the instrument see a real effect
      validator_result: >-
        BATCH-015 archives an N3 negative-binomial power check at phi_true = 1.5;
        the BATCH-017 package does not rerun it, and does not need to, because N2 is
        itself a strong displaced alternative that the instrument resolves at 3 sd
        on n43.  On n50 the instrument demonstrably CANNOT resolve N1 from N2 on the
        slope (separation 0.81-0.98 sd), which is the honest negative power result.
      status: passed
    - control: seeds independent of the producer's and of BATCH-016's
      validator_result: 'validator base 815551; producer 20260806; BATCH-016 20260803.  Disjoint.'
      status: passed

