  proof_architecture_checks:
    - check: baseline fixture
      result: >-
        the package reproduces BATCH-016's printed phi 0.8022946873653165 and floor
        0.9182566445182725 to all digits, and correctly declines to offer that as an
        independent check (standing binding d) since the estimator is imported.  I
        reproduced both by a different basis and a different solver, and derived the
        floor in closed form as 1 - sum(D)/(K*nb).
      status: passed
    - check: strictness witness
      result: >-
        the improvement claimed over BATCH-016 is resolution (301 cells rather than
        3 terciles) plus the degree sweep.  The degree sweep is genuinely new and I
        confirm it appears in no earlier package.  The resolution improvement does
        NOT produce a stronger statement: the direct low-occupancy subset test at
        BATCH-016's tercile resolution gives |z| = 2.55, the per-cell intercept gives
        2.32, and my own 164-cell subset gives 2.91.  Per-cell resolution is not
        shown to buy separation on the level coordinate; what it buys is the slope,
        which was already available at tercile resolution.
      status: incomplete
    - check: observation collisions
      result: >-
        BATCH-016 correctly identified the whole-band mean as an observation
        collision (the two nulls separated by about 1.1 sd there).  This package
        breaks that collision on n43 (3.05 sd on the slope) and demonstrates that it
        is NOT broken on n50 (0.85 sd).  Both are bound to their artifacts.  A new
        collision is introduced and not flagged: the intercept is a coordinate on
        which the two nulls collide EXACTLY (defect D-1).
