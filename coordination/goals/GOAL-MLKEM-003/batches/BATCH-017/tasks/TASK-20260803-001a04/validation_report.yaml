  answers_to_the_five_priority_questions:
    Q1_the_intercept: >-
      The numbers are correct and reproduce, and the claim is over-read.  intercept
      = phi - slope * xbar exactly, with xbar = sum(D)/(K*nb) fixed; and E[intercept]
      = 1 under BOTH nulls as an identity, because N1 and N2 differ by exactly 1 in
      expected slope and by exactly xbar in expected phi.  So the intercept is
      precisely the coordinate along which the two candidate objects are
      indistinguishable, and "-2.3 sd under BOTH nulls" carries no more information
      than "-2.3 sd under one of them".  Centring the regressor at xbar would turn
      the intercept into phi, whose two null means are 1 and the floor 0.9183, and
      the two z's would then differ (-2.40 vs -1.51 in my own MC).  The coincidence
      is an artifact of the regressor origin.  The intercept is also numerically
      almost the pre-existing ANOM-5 statistic: it differs from phi by
      slope * xbar = 0.016, which is 0.17 of its own null sd, and its z of -2.32 is
      slightly WEAKER than the archived phi z of about -2.36 because the slope's
      noise inflates the denominator more than the shift moves the numerator.  It is
      not a new signal, and it is not the right handle: the right handle is the
      direct low-occupancy measurement, which BATCH-016 already reported at
      tercile resolution (-2.55 sd) and which I reproduce here at -2.91 sd on 164
      cells with occupancy below 0.02.  Finally, x = 0 lies just beyond the top score
      of the band, so the intercept is a small extrapolation into the deep tail that
      the band deliberately excludes, whereas the subset test is interpolation.
    Q2_the_degree_control: >-
      Defensible from the archive, and I verified it there rather than in the report.
      BATCH-014's dispersion_control_c1.py selects the degree by forward selection on
      the deviance at chi^2_{1,0.95} = 3.841 with the whole sweep published, and its
      results.json records chosen_degree 5 for the n43 mid band and 3 for the n50 mid
      band.  That criterion predates the BATCH-016 objection and this question, so
      degree 5 and degree 3 are inherited, not chosen after seeing the slope.  For
      n43 the criterion actively REJECTS degree 2 (deviance drop 96.6, twenty-five
      times the threshold), and the conclusion is stable over the entire
      at-or-above-selected family: z vs N2 is +3.57 to +3.98 at degrees 5-8 and
      larger at 3-4.  So the n43 verdict is not carried by the degree choice.  Two
      qualifications.  First, the criterion selects a MINIMUM adequate degree, so the
      defensible family is "at or above", and the producer was right not to discount
      degree 2 on its own post-hoc under-fit diagnostics -- but the archive supplies
      a pre-registered reason to exclude it, which the package did not look for.
      Second, n50's selection is a knife-edge: the degree-3-to-4 deviance drop is
      3.39 against the 3.841 threshold, a 12 % margin, and n50's only above-2-sd
      reading at an admissible degree sits on that margin.  BATCH-016's tercile
      result inherits exactly the same degree exposure, since it used the same
      inherited degrees -- mild for n43, decisive for n50.
    Q3_the_null_calibration: >-
      N2 is correctly the per-cell minimum-variance member: I re-derived
      Var(D) >= mu(1 - mu/nb) from the 0/1 bound plus Cauchy-Schwarz and confirmed
      Binomial(nb, mu/nb) attains both with equality.  It is NOT the joint
      minimum-variance object -- it is independent across cells, while the physical
      process couples cells within an iteration -- and neither null carries any
      cross-cell dependence.  The full refit per replicate is SUFFICIENT for the
      shared-rate-model dependence and I can now say by how much: an analytic
      variance that treats the cells as independent with mu known reproduces the
      refit-calibrated slope sd to within 4 % and the intercept sd to within 3 %, so
      the refit contributes little to the SPREAD (it does move the N2 null mean, from
      -0.980 to -1.005).  The OLS ratio 0.47-1.41 is reproduced exactly (0.469 to
      1.405 across all 28 cells) and I additionally explain it: it is essentially
      sqrt(Var_null(t)/s2_observed), and with Var_null(t) about 2 under N1 and the
      observed scatter s2 about 1.01 at n43 degree 5, sqrt(2/1.01) = 1.41 is the
      measured value.  So the naive SE is unusable because of heteroscedasticity and
      because the observed terms are about half as variable as the Poisson null --
      not, as the package asserts, chiefly because of fit-induced dependence.
      One inherited inexactness: the imported N1 generator is a rounded Gaussian for
      lambda >= 30, which covers 205 of 301 cells; I measured its bias on E[t] and
      Var[t] at under 0.5 %, immaterial here but undisclosed in both packages.
    Q4_n50_power: >-
      CONFIRMED on the slope coordinate and REFINED.  The separation statistic is
      identically 1/sd(slope | N2) because the two nulls differ by exactly 1 in
      expected slope; sd(slope) scales as 1/sqrt(Sxx), and n50's occupancy lever arm
      is 3.2x shorter (max occupancy 0.227 against 0.739), giving Sxx = 1.18 against
      6.56 and a separation of 0.85 against 3.05.  So n50's slope cannot corroborate
      or refute anything and must not be described as either.  But "n50 is
      uninformative" overstates it in the other direction: n50's phi is 1.09-1.11, an
      EXCESS, sitting +2.1 to +2.3 sd ABOVE the floor member, its low-occupancy
      subset shows z = +0.46 (no deficit at all), and a joint (slope, intercept) test
      rejects N2 at 2/400 (degree 3) and 9/300 (degree 5).  n50 is not a weak second
      instance of the same phenomenon; it is a file whose level anomaly has the
      opposite sign.  The package's own section 5 sentence "n=50 at every degree >= 4
      is consistent with the floor-attaining member" is therefore false as a
      file-level statement.
    Q5_the_deflation: >-
      A heuristic, and additionally mis-targeted, and conservative, and inconsistently
      applied.  sqrt(1 + 2 rho_1) is the leading term of the variance inflation of a
      MEAN of a stationary series; the slope is a different linear functional with
      x-centred weights, so it is not a derived correction for this estimator, as the
      producer says.  Beyond that, the rho_1 used is that of the Pearson RESIDUALS
      e_T, while the series being averaged is the SQUARES t_T.  For approximately
      Gaussian e the lag-1 correlation of the squares is rho_1(e)^2 = 0.0108, and I
      measure rho_1(t) = +0.0147 +/- 0.058 directly.  The correct first-order factor
      is therefore sqrt(1 + 2*0.0147) = 1.015, not the applied 1.099 -- the applied
      factor over-states the excess by about 6.5x.  Being conservative it does not
      threaten the conclusion; the undeflated z is the more nearly correct one.  It
      is also applied to the slope z but NOT to the intercept z, so the report's two
      headline numbers use different conventions; the producer's own convention
      applied to the intercept gives -2.11, not -2.32.  And a 12-lag estimate of the
      inflation is 1.385 with a sampling sd of order 0.4 on that factor, so at
      K = 301 no serial-correlation correction is resolvable at all.

  is_the_deficit_structural_at_per_cell_resolution:
    n43: >-
      YES, and on stronger grounds than the package gives.  At per-cell resolution
      the n43 mid-band sub-Poisson deficit is concentrated in the low-occupancy half
      of the band, where the independent-iteration floor moves the reference by at
      most 2 %: 164 cells with occupancy below 0.02 read mean t = 0.6811 against
      calibrated nulls of 0.996 +/- 0.108 (N1) and 1.000 +/- 0.111 (N2), z = -2.91
      and -2.86; it survives restriction to leverage at or below the band mean
      (0.7215 on 145 cells); it is monotone across four occupancy quartiles (0.973,
      0.835, 0.778, 0.621); and it is visible in the RAW increments with no rate
      model at all (linearly-detrended var/mean 0.45 to 0.66 on the last 25 to 100
      cells against an expectation of 1 with sampling sd 0.29 to 0.14).  The
      floor-attaining member is rejected jointly at every degree examined, including
      degree 2.  The deficit is NOT structural in the sense the report's intercept
      language implies: because occupancy is a near-monotone function of the score
      index over this band (3 non-monotone steps in 300 for n43, 0 in 495 for n50),
      an occupancy effect and any smooth score-position effect are not separately
      identified, so "occupancy-independent level shift" attributes a mechanism this
      design cannot establish.  The valid statement is that the deficit lives where
      the floor is inoperative and therefore is not a floor effect.
    n50: >-
      NO -- there is no deficit for the question to apply to.  n50's mid-band phi is
      1.09 to 1.11, an excess; its low-occupancy subset reads +0.46 sd; and its slope
      cannot separate the two nulls at any degree.  n50 neither corroborates nor
      refutes n43.
    joint: >-
      The correct summary is "n43 says one thing at per-cell resolution and n50
      cannot say anything about it, while disagreeing with n43 about the sign of the
      underlying level anomaly."  That is an acceptable and, on this evidence, the
      accurate outcome.

  defects:
    - id: D-1
      severity: major
      kind: over-read of a reported statistic
      statement: >-
        The intercept is not an independent measurement.  intercept =
        phi - slope*xbar exactly (machine precision, all 14 cells), and E[intercept]
        = 1 under BOTH nulls by construction, so "-2.3 sd under both nulls" is an
        identity of the regressor origin rather than agreement between two tests.
        Centring at xbar would separate the two nulls (-2.40 vs -1.51) and change
        what the coefficient means.  The report's section 5 and 7.3 present the
        coincidence as if it eliminated two hypotheses independently.
      remedy_not_applied_here: state the identity, or centre the regressor and report both null means.
    - id: D-2
      severity: major
      kind: framing / prior-art
      statement: >-
        The substance of "the deficit sits where the floor buys nothing" was already
        reported in BATCH-016 objections.md section 3b: low-occupancy tercile
        phi = 0.6371 against 1.0072 +/- 0.1451 (N1) and 0.9971 +/- 0.1430 (N2),
        "-2.55 sd below both", with the explicit sentence "The deficit is entirely
        inside the cells where the floor correction is 0.5 %."  The BATCH-017
        intercept restates that at a WEAKER |z| by extrapolation instead of by direct
        measurement, and is labelled a "second surprise" without citing section 3b.
        The report does not claim novelty for it -- it claims novelty only for the
        degree sweep, which is correct -- so this is a framing defect, not a
        fabrication, but a reader of the report alone would over-read it.
    - id: D-3
      severity: major
      kind: conclusion stated in the wrong quantifier
      statement: >-
        "n=43 at degree 2 is consistent with the floor-attaining member" and "n=50 at
        every degree >= 4 is consistent with the floor-attaining member" are
        slope-only statements presented as file-level ones.  The floor member
        predicts (slope, intercept) = (-1, +1).  At n43 degree 2 the observation is
        (-0.499, +1.278) and a joint Mahalanobis test against the Monte-Carlo null
        cloud gives D2 = 27.97 with 0/400 replicates as extreme -- N2 is rejected
        HARDER at degree 2 than at degree 5 (13.62, 1/400).  At n50 degree 5 the
        joint test gives 9/300.  The one row that appears to rescue the floor member
        in fact rejects it most strongly, and the report does not say so.  Related
        omission: at n43 degree 2 the intercept z is +2.77 (N1) and +3.16 (N2), an
        excess of the same magnitude as the headline deficit, and section 5 discusses
        degree 2 only through the slope.
    - id: D-4
      severity: moderate
      kind: unidentified mechanism / undisclosed confound
      statement: >-
        The regressor mu_T/nb is a near-monotone function of the score index over
        both bands (3 non-monotone steps in 300 for n43; 0 in 495 for n50), so an
        occupancy effect and any smooth score-position effect are perfectly
        confounded by this design.  Testing N2 remains valid, because N2 predicts a
        specific curve; but the interpretive language "occupancy-independent level
        shift" and "occupancy-graded effect" attributes a mechanism the design cannot
        identify.  Not disclosed anywhere in the package.
    - id: D-5
      severity: moderate
      kind: incorrect and inconsistently applied correction
      statement: >-
        sqrt(1 + 2 rho_1) uses the lag-1 autocorrelation of the Pearson residuals
        where the series being averaged is their squares.  Correct first-order factor
        is sqrt(1 + 2 rho_1(t)) = 1.015 against the applied 1.099 (measured rho_1(t)
        = +0.0147, predicted rho_1(e)^2 = 0.0108).  Conservative, so the conclusion
        is unthreatened, but it is applied to the slope z and NOT to the intercept z,
        so the two headline numbers are quoted under different conventions; the same
        convention applied to the intercept gives -2.11 rather than -2.32.  At
        K = 301 no serial-correlation correction is resolvable in any case.
    - id: D-6
      severity: moderate
      kind: undisclosed fragility
      statement: >-
        The slope's design is concentrated: at n43 degree 5 the top 10 of 301 cells
        carry 47.6 % of Sxx and the effective design size is 33.0; at n50 degree 3
        the top 10 carry 27.0 % and the effective size is 73.4.  The package's
        headline framing of "301-cell resolution" versus "3 terciles" implies a gain
        in independent lever arms for the slope that the design does not deliver.
    - id: D-7
      severity: moderate
      kind: second instance mischaracterised
      statement: >-
        "n=50 has almost no power to tell the two null objects apart" is correct for
        the slope but is generalised to the file.  n50's phi is an EXCESS, +2.1 to
        +2.3 sd above the floor member, its low-occupancy subset reads +0.46 sd, and
        a joint test rejects N2 there.  n50 is not a weak second instance of the same
        phenomenon; it is a file with the opposite-sign level anomaly, which
        BATCH-016 section 4 had already noted requires two mechanisms.
    - id: D-8
      severity: minor
      kind: inherited generator inexactness, undisclosed
      statement: >-
        The imported N1 generator is not a Poisson sampler for lambda >= 30 -- it
        returns round(lambda + sqrt(lambda)*Z) with a non-negativity reject -- and
        205 of 301 fitted rates in the n43 mid band exceed 30.  Measured effect on
        E[t] and Var[t] is under 0.5 % (60 000 draws per lambda, no GLM), so the
        consequence is bounded and immaterial, but neither BATCH-015 nor BATCH-017
        records that N1 is a rounded Gaussian over two thirds of the band.
    - id: D-9
      severity: minor
      kind: receipt transcription errors
      statement: >-
        report.md misstates three disclosed values that are correct in results.json
        and in the code: the worked seed example "random.Random(20265002)" (the rule
        and results.json give 20265808); rho_1 "+0.1035" (0.10395642); rho_1
        "+0.0073" (0.00682015).  Separately, snapshot_receipt.json records report.md
        as 407 lines where the committed file is 411.  No computed result depends on
        any of these.
    - id: D-10
      severity: minor
      kind: artifact-policy gap, caused by the frozen contract
      statement: >-
        AGENTS.md artifact policy requires stdout, stderr and resource measurements.
        stdout/stderr are not archived (report.md 7.8 gives the reason: a three-path
        deliverable list), and the "18.1 MB peak RSS" in report.md has no
        machine-readable receipt in results.json.  The cause is the frozen contract,
        so this is a Coordinator-level gap and not producer misconduct; it should be
        fixed by widening the declared artifact list in the next batch, not by the
        producer.
    - id: D-11
      severity: minor
      kind: write outside write_scope (attribution uncertain)
      statement: >-
        __pycache__/anom5_investigation.cpython-311.pyc dated 2026-08-06 01:19:55
        sits inside the previously-archived BATCH-015 task directory, produced by an
        importlib load of that module.  It is gitignored, is not in the snapshot
        commit, and affected no number.  BATCH-016's red team also imported that
        module, so I cannot establish which execution wrote it; recorded rather than
        attributed.  A write into an immutable archived directory is a process defect
        regardless of gitignore.

  amendment_handling:
    AMEND_BATCH_017_001: >-
      Handled correctly, on my check.  (i) The loss of attempt 1 is treated under
      rule 5 as non-evidence and under rule 9 its numbers are cited nowhere; I
      searched the package and the queue and found no attempt-1 statistic, and the
      producer's seeds are its own (master 20260806, differing from BATCH-016's
      20260803).  (ii) The anti-contamination clause -- dispatching attempt 2 without
      telling it the lost numbers -- is the right call and makes attempt 2 an
      independent execution rather than a confirmation.  (iii) The Coordinator's
      added degree-sensitivity requirement is a legitimate contract addition, is
      recorded with its rationale as the amendment requires, and was the single most
      productive control in the package: it is what dissolved the n50 corroboration.
      (iv) The amendment's own verified_by_coordinator find commands are accurate; I
      reran both and they return what it says.  One observation, not a defect: the
      amendment says the degree choice makes a one-degree quote "an uncalibrated
      point estimate", and the archive in fact already contained a pre-registered
      selection rule (BATCH-014 forward deviance selection) that the amendment does
      not mention.  Knowing that would have sharpened the requirement to "report the
      at-or-above-selected family", which is the family that actually matters.

  limitations:
    - >-
      Toy tier throughout.  q=241, m=40, two archived files, one mid band each, raw
      undivided score scale.  Nothing here is scale-matched evidence for any
      cryptographic parameter set and no ML-KEM or Kyber claim is made or implied
      (AGENTS.md rule 7).
    - >-
      Zero new sampling of the physical system.  Every conclusion is about two
      archived byte streams and about the instrument applied to them; it cannot
      distinguish a property of the process from a property of the generator that
      wrote those files.  BATCH-015 tested the file-format mechanisms and found the
      dumps lossless; that remains the only handle on this and it is not exhaustive.
    - >-
      Both null objects are independent ACROSS cells.  The physical process is not.
      Every z in this report and in the package is therefore optimistic to the extent
      of the unmodelled cross-cell dependence; I measure the induced lag-1
      correlation of the terms at +0.015 +/- 0.058 and bound the effect at under 2 %,
      but that is a first-order estimate at K = 301, not a bound.
    - >-
      Empirical tail fractions of 0/500 and 1/500 are at the resolution limit of the
      replicate count.  Every quoted z beyond about 2.9 is a Gaussian extrapolation
      past what the replicates resolve, in this report as in the package.
    - >-
      My low-occupancy subset thresholds (0.01, 0.02, 0.05) were chosen as
      "occupancy small enough that the floor moves E[t] by at most 1/2/5 %", which is
      a pre-specifiable rule, but they were chosen in this session after reading the
      package.  All three are reported, and they give -2.46, -2.91, -2.43 against N1,
      so the reading is not threshold-tuned; the reader should still discount for
      three looks.
    - >-
      The joint Mahalanobis test uses a Gaussian-shaped distance on a null cloud that
      is mildly skewed; I therefore report the EMPIRICAL count of replicates at or
      beyond the observation alongside every D2 and rest the conclusion on the count.
    - >-
      I did not rerun the producer's script.  Its reproducibility claim (report 7.9)
      is stated by the producer as an expectation and not as a measurement, and I
      leave it that way; my check is a from-scratch reimplementation, which is the
      stronger test but does not establish bit-identical reproduction of results.json.
    - >-
      Standing binding (b) observed: I quote no whole-band rms ratio and therefore no
      effective dof value for one.  Where dof-like quantities appear above they are
      design concentration measures for the slope, a different statistic, and are
      labelled as such.  For the DEC-20260803-52a750 statistic the position is
      unchanged: effective dof is O(1), the defensible range across conventions is
      1.51-2.35, no single value is quoted, and restricting to C >= 1000 buys no
      degrees of freedom because that ratio's dof lies in the same O(1) family.
    - >-
      Standing binding (e): I make no fit-dependence inference from an rms ratio, so
      the bias-versus-centred-scatter decomposition that binding attaches to is not
      run.  My fit-dependence statement is a direct measurement at seven degrees plus
      an analytic-versus-Monte-Carlo comparison of the null variance.
    - >-
      Standing binding (g) observed: the floor is a MINIMUM over the
      independent-iteration family and N2 is the member attaining it.  Neither is
      treated as the expected value of the statistic anywhere in this report.

