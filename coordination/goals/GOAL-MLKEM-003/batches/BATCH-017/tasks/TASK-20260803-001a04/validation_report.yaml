  independent_reimplementation:
    what_was_rebuilt_from_scratch: >-
      Nothing was imported from BATCH-015 or BATCH-017 for any number below.  I
      wrote my own .out parser (float*M rounding, not 80-digit Decimal), my own
      re-derivation of the mid-band region rule, a Poisson log-link GLM on a
      LEGENDRE basis fitted by Fisher scoring with my own Cholesky solver and
      Cholesky inverse (the producer's route is a Chebyshev basis with Gaussian
      elimination and partial pivoting), my own per-cell terms and regression, my
      own EXACT Poisson and Binomial samplers by inverse CDF expanded outward from
      the mode (the archive's route is Knuth product / rounded-Gaussian for
      lambda>=30, and a recursive-Beta binomial), an analytic null-moment
      calculation, a joint (slope, intercept) Mahalanobis test, and a model-free
      local index of dispersion that uses no rate model at all.
    steps_actually_checked_by_a_different_route:
      - >-
        THE LINEAR ALGEBRA.  Fitted values and hat diagonals are basis-invariant in
        exact arithmetic, so a Legendre + Cholesky refit is a genuine check of the
        producer's Chebyshev + Gaussian-elimination fit and not the same route.  It
        reproduces slope, intercept and phi at all 14 (file, degree) cells to at
        least six significant figures, and sum(h) = P exactly in every fit.
      - >-
        THE NULL CALIBRATION.  Own exact samplers, own seeds, own replicate counts.
      - >-
        THE VARIANCE TREATMENT.  An analytic slope/intercept variance under
        independent cells with known mu, which the producer never computed, run
        against their Monte-Carlo sd to isolate how much the shared rate model
        actually contributes.
      - >-
        THE DEFICIT ITSELF.  A model-free local index of dispersion on the raw
        increments, which uses neither the GLM, nor the leverage correction, nor
        either null generator.
      - >-
        THE DEGREE PROVENANCE.  Read out of BATCH-014's archived selection code and
        results rather than taken from the BATCH-017 report.

