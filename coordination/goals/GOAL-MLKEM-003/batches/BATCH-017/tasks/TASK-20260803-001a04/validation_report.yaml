  own_measurements_not_in_the_package:
    - name: the intercept is an exact affine function of phi and the slope
      measurement: >-
        intercept = phi - slope * xbar with xbar = sum(D)/(K*nb) fixed and
        degree-invariant.  Verified to machine precision (max deviation 2.2e-16) at
        all 14 (file, degree) cells.  Under N1, E[phi]=1 and E[slope]=0 give
        E[intercept]=1; under N2, E[phi]=1-xbar and E[slope]=-1 give
        E[intercept]=1-xbar+xbar=1.  The two nulls have IDENTICAL expected
        intercept by construction.
    - name: low-occupancy subset test (direct, not extrapolated), n43 degree 5
      measurement: >-
        164 cells with fitted per-iteration occupancy below 0.02, where the
        independent-iteration floor moves E[t] by at most 2 %: mean t = 0.6811
        against calibrated nulls 0.9959 +/- 0.1084 (N1) and 0.9995 +/- 0.1114 (N2),
        z = -2.91 and -2.86.  Thresholds 0.01 and 0.05 give -2.46/-2.45 and
        -2.43/-2.30.  Three thresholds were run and all three are reported.
        Restricting further to leverage at or below the band mean (145 cells) gives
        mean t = 0.7215, so it is not a leverage or edge artifact; the calibrated
        null carries the leverage geometry in any case.
    - name: monotone occupancy gradient across score quartiles, n43 degree 5
      measurement: >-
        mean occupancy 0.2762 / 0.0345 / 0.0099 / 0.0038 gives mean t 0.9725 /
        0.8348 / 0.7782 / 0.6214.  The floor-attaining member predicts the OPPOSITE
        gradient, t -> 1 as occupancy -> 0.  This is the protocol section 3
        decay test with occupancy as the destroying parameter, and the quantity
        moves the wrong way for N2 across four bins rather than two.
    - name: MODEL-FREE local index of dispersion (no rate model at all)
      measurement: >-
        on the last L cells of the n43 mid band, where the fitted rate is flat
        (local log-slope 0.00012 per score) and occupancy is 0.003, the
        linearly-detrended var/mean of the RAW increments is 0.453 (L=25), 0.561
        (L=50), 0.688 (L=75), 0.660 (L=100) against an expectation of 1 with
        sampling sd sqrt(2/(L-1)) = 0.289, 0.202, 0.164, 0.142.  L=150 gives 1.551
        because a linear detrend under-fits the curvature over that span, so the
        usable window is L <= 100.  The same statistic on the last 25/50/100 cells
        of n50 gives 1.042, 0.961, 1.192 -- no deficit.  This route uses neither
        the Chebyshev GLM, nor the leverage correction, nor either null generator.
    - name: joint (slope, intercept) Mahalanobis test against each null
      measurement: >-
        using the Monte-Carlo covariance of the null cloud (corr(slope, intercept)
        is about -0.52 to -0.59 throughout).  n43 deg 2: D2 = 9.40 vs N1 (5/400)
        and 27.97 vs N2 (0/400).  n43 deg 5: 6.14 vs N1 (23/400) and 13.62 vs N2
        (1/400).  n50 deg 3: 3.50 vs N1 (70/400) and 10.67 vs N2 (2/400).  n50
        deg 5: 2.63 vs N1 (85/300) and 6.94 vs N2 (9/300).  N2 is rejected at every
        cell examined, INCLUDING n43 degree 2, where it is rejected hardest.
    - name: analytic null variance versus the Monte-Carlo calibration
      measurement: >-
        treating the cells as independent with mu KNOWN and no refit, Var(slope) =
        sum c_T^2 Var(t_T) with c_T = (x_T - xbar)/Sxx and Var(t_T) =
        (2 + 1/mu_T)/(1-h_T)^2 under N1, and
        [2(1-p)^2 + (1-p)(1-6p+6p^2)/mu]/(1-h)^2 under N2.  n43 deg 5: analytic
        0.5935 (N1) and 0.3399 (N2) against calibrated 0.5916 and 0.3274, i.e. the
        full refit changes the slope's null sd by under 4 %.  Intercept: analytic
        0.0959 / 0.0920 against 0.0947 / 0.0941, under 3 %.  n50 deg 3: 1.3396 /
        1.1616 against 1.3727 / 1.1830.  The refit does move the null MEAN of the
        N2 slope, from -0.980 (known mu) to -1.005 (refit).
    - name: why the OLS standard error is wrong here
      measurement: >-
        the ratio calibrated/OLS is essentially sqrt(Var_null(t) / s2_observed).
        With Var_null(t) about 2 under N1 and the observed scatter of t about the
        fitted line s2 = 1.01 at n43 degree 5, the ratio is sqrt(2/1.01) = 1.41,
        exactly the measured 1.405.  So the OLS error here is driven by
        heteroscedasticity and by the observed terms being about half as variable
        as the Poisson null, NOT by fit-induced dependence, which the analytic
        comparison above bounds at 4 %.  The package asserts both causes and
        quantifies neither.
    - name: autocorrelation of the TERMS, not the residuals
      measurement: >-
        n43 degree 5: rho_1..8 of t = +0.0147, -0.0250, -0.0563, +0.0058, -0.1122,
        +0.1531, +0.0223, +0.0265, each with sampling sd 1/sqrt(301) = 0.0576.
        rho_1 of the Pearson residuals is +0.1040 and its square is 0.0108, which is
        what a Gaussian-residual argument predicts for the lag-1 correlation of the
        squares; the measured +0.0147 agrees.  A 12-lag Newey-West-style inflation
        estimate is 1.385 with a sampling sd of order 0.4 on that factor, so no
        serial-correlation correction is resolvable at K = 301.
    - name: design concentration of the slope
      measurement: >-
        with weights w_T = (x_T - xbar)^2, the top 10 of 301 cells carry 47.6 % of
        Sxx at n43 degree 5 and the effective design size (sum w)^2 / sum w^2 is
        33.0 of 301; at n50 degree 3 the top 10 carry 27.0 % and the effective size
        is 73.4 of 496.  "301-cell resolution" is not 301 independent lever arms
        for the slope coordinate.  This is a separate quantity from the
        DEC-20260803-52a750 binding, which attaches to the whole-band rms ratio of
        log2 residuals; I quote no such ratio and no dof value for it here.
    - name: exactness of the imported N1 generator
      measurement: >-
        BATCH-015 poisson_sample returns round(lambda + sqrt(lambda)*Z) with a
        non-negativity reject for lambda >= 30, which is not a Poisson sampler.
        205 of the 301 fitted rates in the n43 mid band exceed 30.  Measured
        directly on 60 000 draws per lambda with no GLM: E[(D-lambda)^2/lambda] =
        1.0038 to 1.0047 for the approximation against 0.9996 to 1.0009 exact, and
        Var = 2.016 against 1.998 to 2.001 exact.  Bias below 0.5 % and inside my
        own Monte-Carlo noise, so the consequence is bounded and immaterial at this
        resolution.
    - name: rejected variance estimator, recorded rather than dropped
      measurement: >-
        I attempted a moving-block bootstrap of the (x_T, t_T) pairs in score order
        as a dependence-robust slope sd.  It gives 0.45 (L=1), 0.51 (L=5), 1.23
        (L=15) at n43 degree 3 and similarly unstable values elsewhere.  Because
        x_T is near-monotone in T, block resampling changes the design matrix
        between replicates and inflates the slope variance for reasons unrelated to
        serial correlation.  It is not a usable estimator here and none of my
        conclusions rest on it.

