  # ===========================================================================
  # PRIORITISATION
  # ===========================================================================
  prioritisation:
    execution_order: [L0, L1, L8, L6, L10, L2, L3, L4, L5, L7, L9, L11, L12, L13]
    order_rationale: >-
      L0 first because every other lane's arithmetic is conditional on the tuple,
      and CONF-4 is currently open: the program does not yet know that the intake
      decimals equal the retrieved hex. L1 second because scoring a cell against a
      recalled threshold is exactly the failure the role contract forbids, and the
      gate is cheap. Then the three lanes with genuine informational uncertainty -
      L8 (rigidity, where the outcome is genuinely unknown and where CONF-2 is
      live), L6 (transfer, where a surprise would be material and the certificate
      is cheap), and L10 (twist, where the preregistered cell says `false` and
      nobody in this program has the factorisation that would explain why). The
      remaining lanes are near-deterministic given L0 and are scheduled last
      precisely because their information gain is low, which the plan states
      rather than hides.
    first_test_recommendation:
      lane: L0
      why_cheapest_valid_discriminator: >-
        It costs under 900 s, needs no external retrieval beyond a re-fetch, and
        it is the only test that can invalidate every other lane at once. Until
        int(p_hex) == the intake decimal is checked, every downstream certificate
        would be a certificate about a possibly different curve. It also carries
        its own null control (NULL-SHUFFLE), so a pass is informative rather than
        vacuous.
    highest_information_gain_lane:
      lane: L8
      why: >-
        It is the only lane whose outcome this program cannot predict. L2-L5, L9,
        L11-L13 have preregistered predictions that follow from the tuple by short
        arguments; L6 and L7 have predictions that follow from genericity. L8's
        CONF-2 is a live conflict between a primary source that shows no seed and
        a derived database that shows an 8192-bit one, and its observation-collision
        analysis - stated above, before any compute - already constrains what any
        outcome may be used to say.

  # ===========================================================================
  # TARGET COMPLEXITY
  # ===========================================================================
  target_complexity:
    attack_exponent_claimed: NONE
    statement: >-
      No lane proposes, implements, or optimises an ECDLP attack, so no time or
      memory exponent is claimed against any baseline. The best known attack on a
      curve of this shape remains generic: Pollard rho at ~0.886*sqrt(n) group
      operations with O(1) memory, i.e. ~2^127.7 for a 256-bit prime order
      (recalled constant, validated inside L5 rather than assumed). This plan does
      not move that exponent, does not attempt to, and would be misread if
      presented as doing so.
    audit_cost:
      time: >-
        Dominated by L10 (ECM to B1 = 10^6, ~3600 s) and L8 (2^20 SHA-1 plus
        modular multiplications, ~2400 s). Everything else is minutes. Total plan
        ~5.4 hours of single-core compute, which exceeds one 1800 s task budget
        and is therefore proposed as a multi-task schedule for the Coordinator.
      memory: <= 4 GB throughout; no lane needs a large table.
    verification_cost_honesty: >-
      The k > 10^6 certificate of L6 is NOT succinct: verifying it genuinely costs
      10^6 modular multiplications. The ECM bound in L10 is probabilistic, not a
      proof of the absence of small factors. The negative certificates in L8, L11
      and L12 are statements about enumerated finite sets whose sizes are part of
      the certificate. Each is reported that way and none is dressed up as a short
      proof.
    tradeoff_note: >-
      One real tradeoff, inside L6 and L7: an exact value requires a factorisation
      (expensive to produce, succinct to verify) while a bound requires K
      operations (cheap to produce, expensive to verify). The plan takes the bound
      route by default in a pure-Python environment and records which route each
      lane took.
    parallelisation: >-
      L10's ECM curves and L8's candidate space are embarrassingly parallel; the
      plan's serial estimates are upper bounds if the Coordinator allocates the
      goal's max_concurrent = 2.

  # ===========================================================================
  # HONEST ACCOUNTING (docs/inventor-protocol.md section 5)
  # ===========================================================================
  honest_accounting:
    objects_considered:
    - id: OBJ-1
      object: k = ord_n(p), the embedding degree
      status: reused from IDEA-20260807-98a970, not newly proposed
      lossy: yes - see L6
    - id: OBJ-2
      object: (D, f), the CM discriminant and conductor of t^2 - 4p
      status: standard; new only as data for this curve
      lossy: yes - see L7
    - id: OBJ-3
      object: >-
        (|S|, predicate list) - the unexplained choice space of the generation
        history together with the predicates under which it was searched
      status: >-
        The one object in this plan that is not a repackaging of a standard curve
        trait. It is a projection of the GENERATION PROCESS rather than of the
        curve, which is why it can be measured at all when the process itself is
        unpublished.
      lossy: yes, and provably not invertible - see L8's lossy-projection test
      novelty_status: unverified
      novelty_note: >-
        The X9.62 seed-verification predicate is entirely standard and the idea of
        checking it is routine. What this plan adds is the explicit
        observation-collision analysis (four distinct preimages of "no transcript
        found") and the H5 manipulability bound, stated before compute. Neither
        was checked against external literature in this session, so the honest
        label is `unverified`, not `novel`.
    - id: OBJ-4
      object: The exceptional-set divisor X of a model conversion
      status: standard in the implementation literature; new here only as data
      lossy: yes - see L13
    depth_of_verified_structure: >-
      NONE VERIFIED IN THIS SESSION. Zero compute was run. What exists is: three
      independent retrievals agreeing on the parameter tuple at the level of
      summariser-reported digits, one exact hand check (a == p - 3), two
      approximate hand checks, and two exact structural hand checks (n > p; n odd).
      That is the tier claimed, and nothing above it.
    dominated_by:
      as_an_attack: >-
        n/a - no attack claimed, proposed, or run.
      as_an_audit_of_this_curve: >-
        The SafeCurves project's own published table and verification scripts
        dominate this plan on authority, on having been peer-scrutinised, and on
        having been run for over a decade; DiSSECT (eprint 2022/943, AFRICACRYPT
        2022) dominates it on breadth, computing 22 traits across the largest
        public standard-curve database plus 250,000 simulated curves; the ANSI
        X9.62 / SEC 1 / FIPS 186-5 parameter-validation procedures dominate it on
        standardisation. Frontier rows checked: time (all incumbents are cheaper,
        being already run), memory (equal, all are small), data/queries (DiSSECT
        strictly dominates on sample count). This plan is dominated on every axis
        by at least one incumbent.
      what_this_plan_is_not_dominated_on: >-
        Exactly one thing: producing, inside this program's ledger, a
        re-verifiable certificate per cell with its controls and its explicitly
        enumerated negative-result scope. That is a provenance property, not a
        scientific advance, and it is stated as such.
    sota_delta: >-
      Quantitatively: this program currently holds ZERO certificate-bearing rows
      for FRP256v1 - no embedding degree, no bound, no CM discriminant, no twist
      factorisation, no transcript search. The plan would produce 11 criterion
      rows plus 8 diagnostic rows, of which an estimated 5 carry exact
      certificates (L0, L2, L3, L4, L9), 3 carry explicit bounds with stated
      verification cost (L6, L7, L10), and 4 carry enumerated-space negative
      results with |S| stated (L8, L11, L12, L13). Speedup against any attack
      baseline: ZERO, on every axis.
    closures_claimed:
    - closure: >-
        No F_p-rational Montgomery or Edwards model exists for this curve, hence
        the alternate-model conversion route (L13) is empty over F_p.
      mechanism: >-
        NAMED OBSTRUCTION: #E is odd (capsule HC5, conditional on L0), so E(F_p)
        has no rational point of order 2. ARGUMENT: a Montgomery model requires a
        rational point of order 4 and a twisted Edwards model requires 4 | #E;
        both fail. FORWARD GUIDANCE: this closes only F_p-rational conversions to
        Montgomery and Edwards models. It leaves open conversions over extension
        fields, Jacobi-quartic and Hessian models with their own torsion
        requirements, and isogeny-based routes to a curve of different order -
        all named as successors in L13.
      status: >-
        PROVISIONAL. It rests on HC5, which is a hand check, not a certificate.
        It becomes a closure only after L0 certifies the tuple, and until then its
        honest status is `unverified`.
    - closure: >-
        "No transcript found" cannot discriminate among the four generation
        histories enumerated in L8's observation_collision block.
      mechanism: >-
        NAMED OBSTRUCTION: the observable is a single bit produced by a predicate
        applied to public parameters; the four histories differ only in
        information that is not a function of the public parameters. ARGUMENT: any
        auditor's map from (public parameters, predicate) to the observable is
        constant across the four preimages, so no amount of compute inside that
        map separates them. FORWARD GUIDANCE: separation would require evidence
        outside the parameters - archival, procedural or testimonial - which is
        not a computation this program can perform, and which is named here so no
        later session spends compute trying.
      status: >-
        This one is a real closure at the section 4 standard and it costs zero
        compute, which is the point of stating it before the experiment.
    open_directions_for_next_session:
    - Resolve CONF-2 by re-fetching std-curves as raw bytes and tracing the seed field's provenance through repository history; this is the single cheapest open item and it is a prerequisite for interpreting L8.
    - Retrieve the SafeCurves criterion pages when the host is reachable; until then the eleven preregistered cells remain unsourced (CONF-3) and no cell-by-cell comparison should be recorded.
    - Retrieve the DiSSECT PDF body with a real PDF extractor; it is the nearest prior art on FRP256v1's generation and this session could only obtain its metadata.
    - Retrieve the RCB complete-formulas paper and the Elligator papers before L11 and L12 interpret their second answers, which currently rest on recalled claims.
    - Source POS-ANOM and POS-BN254 parameters independently; both are currently only user-supplied intake in other goals' records, which this task did not read.
    - Decide whether the Coordinator can provision Sage/PARI/GMP-ECM. Three diagnostics (full twist factorisation, exact CM discriminant, SEA-based H3 validation) are partial solely because of that, and the deferrals are recorded with that exact successor condition.

  prohibited_outputs_restated:
  - No lane may output a statement that FRP256v1 is safe, unsafe, vulnerable, or free of vulnerabilities.
  - No lane may cite an intake cell as evidence.
  - No lane may report an absence as anything other than an absence over an enumerated space of stated size.
  - No lane may treat a timeout, proxy failure, or missing dependency as mathematical evidence.
  - No lane may test, request, store, or derive a live private key; all objects are public parameters or locally generated controls.
