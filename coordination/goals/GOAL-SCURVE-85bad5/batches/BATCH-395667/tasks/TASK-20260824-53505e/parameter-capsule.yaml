  claim_status: >-
    PLANNING RECORD. No curve attack was run, no experiment result was created,
    and no statement is made anywhere in this file that the curve is safe,
    unsafe, vulnerable, or free of vulnerabilities. Every number below is either
    (a) user-supplied unverified intake, (b) a retrieved source transcription, or
    (c) an explicitly labelled hand check that is not a certificate.

  # ---------------------------------------------------------------------------
  # 1. INTAKE - user-supplied, UNVERIFIED, comparison target only, NOT evidence
  # ---------------------------------------------------------------------------
  intake:
    provenance: user_supplied_unverified
    verification_status: unverified
    comparison_target_only: true
    is_evidence: false
    binding_note: >-
      Every True/False cell below is a PREREGISTERED COMPARISON TARGET supplied
      by the user. It is not evidence, it is not ground truth, and no later
      record may cite it as either. Its only role is to be compared, cell by
      cell, against independently produced certificates.
    curve: ANSSI FRP256v1
    equation: y^2 = x^3-3x+107744541122042688792155207242782455150382764043089114141096634497567301547839
    modulus: '109454571331697278617670725030735128145969349647868738157201323556196022393859'
    details: 2011 ANSSI
    expected_safe: false
    expected_criteria:
      field: true
      equation: true
      base: true
      rho: true
      transfer: true
      disc: true
      rigid: false
      ladder: false
      twist: false
      complete: false
      ind: false
    fields_absent_from_intake:
    - base point coordinates (x, y)
    - subgroup order n
    - cofactor h
    - object identifier
    - generation seed or transcript
    - source citation for the True/False cells

  # ---------------------------------------------------------------------------
  # 2. SOURCES - what was actually fetched in this session, and what was not
  # ---------------------------------------------------------------------------
  retrieval_environment:
    date: '2026-08-25'
    tool: WebFetch / WebSearch through the session's configured agent proxy
    method_caveat: >-
      WebFetch converts a page to markdown and answers a prompt against it with
      a small summarisation model. Long hexadecimal strings reported by that
      model are therefore RETRIEVED-VIA-SUMMARISER, not byte-verified. Where a
      value below is marked `cross_source_agreement`, the identical string was
      reported independently from distinct URLs, which raises confidence but is
      still not a byte-level check. Byte-level verification is lane L0 of the
      audit plan and is explicitly NOT claimed here.
    execution_tools_available_to_this_role: none
    consequence: >-
      This session could not execute arithmetic. No hex-to-decimal conversion,
      no modular arithmetic, and no factorisation was performed. Anything that
      needed computation is deferred to a named lane, never estimated and
      reported as if computed.

