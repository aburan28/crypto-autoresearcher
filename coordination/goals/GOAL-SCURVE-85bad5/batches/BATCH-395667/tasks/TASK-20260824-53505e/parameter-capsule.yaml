  # ---------------------------------------------------------------------------
  # 6. CONFLICTS
  # ---------------------------------------------------------------------------
  conflicts:
  - id: CONF-1
    kind: gap_not_contradiction
    statement: >-
      The intake supplies only the equation and modulus. The base point, order,
      cofactor and OID are absent from intake and were supplied by S1 and
      corroborated by S3/S4.
    status: resolved_by_retrieval
    residual_risk: >-
      The audit is now evaluating a tuple that is strictly larger than the one
      the user supplied. Any later disagreement about the base point cannot be
      blamed on intake, and the audit must say which source it used.
  - id: CONF-2
    kind: metadata_conflict
    statement: >-
      S3 (std-curves anssi/curves.json) carries a `characteristics.seed` field
      for FRP256v1 holding a 2048-hex-character value beginning
      `22210330C1F1D5B1CB62BD35A98AA05D...`. S1 (the Journal Officiel Avis) and
      S2 (the ANSSI publication page) contain NO seed and NO generation
      procedure, and S5 (DiSSECT, from the same research group that maintains
      S3) records no seed for this standard.
    why_it_matters: >-
      The rigidity lane's entire question is whether a checkable generation
      transcript exists. A seed appearing in a derived database but in no primary
      source is exactly the kind of datum that could either (a) be a real
      artifact whose provenance nobody wrote down, or (b) be a database artifact.
      It must be resolved before any statement about rigidity is made.
    additional_structural_observation: >-
      An 8192-bit value is inconsistent in shape with an ANSI X9.62
      verifiably-random seed, whose SHA-1-based transcript uses a seed of at
      least 160 bits and is customarily published at 160 bits. So even if the
      field is genuine, it is not on its face an X9.62 transcript. This is an
      observation about the shape of the value, not a conclusion about it.
    status: unresolved
    resolution_lane: L8 (step L8.1), with the byte-exact re-fetch in L0
    falsifier_that_would_close_it: >-
      Either (i) a byte-exact re-fetch of the JSON confirming the field plus a
      commit-history or upstream citation explaining where it came from, or
      (ii) a byte-exact re-fetch showing the field absent or null, which would
      identify the report as a retrieval artifact.
  - id: CONF-3
    kind: unavailable_source
    statement: >-
      All SafeCurves pages, and the cr.yp.to host generally, returned HTTP 502
      through the session proxy across six attempts. The eleven preregistered
      True/False cells and their numeric thresholds are therefore unsourced in
      this session.
    status: unresolved_operational
    classification: >-
      OPERATIONAL OBSERVATION, never mathematical evidence, per the goal's claim
      boundaries. It does not license substituting a secondary summary of the
      SafeCurves criteria for the criteria themselves, and this capsule does not
      do so.
    resolution_lane: L1 (blocking retrieval gate)
  - id: CONF-4
    kind: unverified_equality
    statement: >-
      Equality between the intake decimal values of p and b and the retrieved hex
      values has NOT been established. Only the approximate hand checks HC2 and
      HC3 and the exact structural check HC1 were performed.
    status: deferred
    resolution_lane: L0
    consequence_if_it_fails: >-
      If the decimals do not match the hex, the goal is auditing a different
      curve than the user named. That is a pause condition on the parameter tuple
      and would be reported to the Coordinator immediately rather than silently
      corrected.
  - id: CONF-5
    kind: uncertified_third_party_values
    statement: >-
      S4 displays computed traits (embedding degree, CM discriminant, trace,
      j-invariant, conductor) with no certificate.
    status: recorded_as_predictions_only
    resolution_lanes: [L5, L6, L7]
  - id: CONF-6
    kind: designer_assertion_without_artifact
    statement: >-
      S2 asserts the curve was generated randomly ("générée de manière
      aléatoire") and selected against the usual security criteria, while
      publishing no seed, no script, no acceptance predicate and no transcript.
    status: open_question_by_design
    framing_rule: >-
      This is an ABSENCE, and an absence is an open question with a stated
      falsifier, never an insinuation. The audit's job in lane L8 is to state
      precisely what an audit could and could not establish from it, and to
