  recalled_references:
    binding_note: >-
      The following are named from memory because a reviewer with retrieval tools
      should be able to find them, and because naming the nearest work is
      required even when it cannot be opened. NONE of them is treated as checked.
      Any lane that depends on one carries a retrieval step before its result is
      interpreted.
    items:
    - ref: ANSI X9.62 / SEC 1 verifiably-random curve generation
      provenance: recalled
      claim: >-
        A seed s is hashed (SHA-1 in the original) to produce an integer r mod p,
        and the curve is accepted iff r*b^2 == a^3 (mod p). This gives a short,
        third-party-checkable transcript for a Weierstrass curve.
      why_it_matters: It is the exact predicate lane L8 proposes to test.
      verified_by: null
    - ref: Renes, Costello, Batina, "Complete addition formulas for prime order elliptic curves" (EUROCRYPT 2016; eprint 2015/1060)
      provenance: recalled
      claim: >-
        Complete addition formulas exist for prime-order short Weierstrass curves
        with a = -3, i.e. completeness is not restricted to Edwards models.
      why_it_matters: >-
        It is the single most important confound for the `complete` cell, and it
        postdates much of the SafeCurves material. Lane L11 is built around it.
      verified_by: null
    - ref: Bernstein, Hamburg, Krasnova, Lange, "Elligator" (CCS 2013); Tibouchi, "Elligator Squared" (FC 2014)
      provenance: recalled
      claim: >-
        Elligator 2 requires a point of order 2 / Montgomery-type model; Elligator
        Squared encodes to essentially any elliptic curve at roughly twice the
        length.
      why_it_matters: The same catalogue-versus-curve confound for the `ind` cell (lane L12).
      verified_by: null
    - ref: Smart / Satoh-Araki / Semaev anomalous-curve additive transfer
      provenance: recalled
      claim: If #E(F_p) == p the ECDLP is solvable in polynomial time.
      why_it_matters: One of the three degenerate checks reused from IDEA-20260807-98a970.
      verified_by: null
    - ref: Menezes-Okamoto-Vanstone / Frey-Ruck multiplicative transfer
      provenance: recalled
      claim: The ECDLP embeds into F_{p^k}^* where k = ord_n(p).
      why_it_matters: The `transfer` cell (lane L6).
      verified_by: null
    - ref: Pollard rho with negation map, cost ~0.886*sqrt(n) group operations
      provenance: recalled
      claim: The generic square-root baseline that the `rho` cell scores against.
      why_it_matters: The `rho` cell (lane L5).
      verified_by: null
    - ref: Internal proposal IDEA-20260807-98a970
      provenance: internal
      claim: >-
        Certificate formats for exact embedding degree (factorisation of n-1 plus
        one witness per prime factor) and for a lower bound k > K (K modular
        multiplications), plus the three degenerate checks p == 1 mod n, n == p,
        n^2 | #E, plus a mandatory planted-positive control set.
      why_it_matters: >-
        Lane L6 REUSES and specialises this record for FRP256v1 rather than
        minting a duplicate mechanism proposal, as the handoff requires.
      verified_by: ledger/proposals/IDEA-20260807-98a970.yaml

