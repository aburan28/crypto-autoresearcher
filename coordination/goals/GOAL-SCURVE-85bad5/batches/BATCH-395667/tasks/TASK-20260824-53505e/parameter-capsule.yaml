  # ---------------------------------------------------------------------------
  # 4. HAND CHECKS - pencil-and-paper only, explicitly NOT certificates
  # ---------------------------------------------------------------------------
  hand_checks:
    disclaimer: >-
      These were performed by inspection during this planning session with no
      execution tool. Each is labelled `exact_by_inspection` or `approximate`.
      NONE is a certificate, NONE may be cited as evidence, and every one of them
      is re-derived with a machine-checkable artifact in lane L0.
    items:
    - id: HC1
      kind: exact_by_inspection
      statement: >-
        p_hex and a_hex are identical in all 63 leading hex digits and differ
        only in the last digit (3 versus 0), so a = p - 3, i.e. a == -3 (mod p).
      consistency_with_intake: >-
        Consistent with the intake equation `y^2 = x^3-3x+b`. This is the one
        structural cross-check between intake and primary source that could be
        made without arithmetic.
    - id: HC2
      kind: approximate
      statement: >-
        The leading hex digits F1FD of p give p / 2^256 ~ 0.94528, hence
        p ~ 1.09455e77, against the intake decimal ~1.0945457e77.
      conclusion: >-
        Consistent to roughly six significant figures. This EXCLUDES a gross
        mismatch; it does NOT establish equality and cannot detect a difference
        in the low-order digits, which is exactly where a transcription error
        would live.
    - id: HC3
      kind: approximate
      statement: >-
        The leading hex digits EE35 of b give b / 2^256 ~ 0.93049, hence
        b ~ 1.0774e77, against the intake decimal ~1.0774454e77.
      conclusion: Same status and same limitation as HC2.
    - id: HC4
      kind: exact_by_inspection
      statement: >-
        p_hex and n_hex share the leading 32 hex digits
        F1FD178C0B3AD58F10126DE8CE42435B and first differ at the 33rd, where n
        has 5 and p has 3. Hence n > p, hence the trace t = p + 1 - n is
        negative.
      conclusion: >-
        Consistent with S4's reported negative trace of Frobenius. Note the
        shared 128-bit prefix is the ordinary consequence of the Hasse interval
        and carries no special significance; recording it here forestalls a later
        reader treating it as structure.
    - id: HC5
      kind: exact_by_inspection_conditional
      statement: >-
        n_hex ends in E1 and p_hex ends in 03, so both are odd. With h = 1 this
        gives #E = n odd, and the twist order #E' = 2p + 2 - n is then also odd.
      downstream_prediction: >-
        An odd group order means E(F_p) has no rational point of order 2, so
        neither a Montgomery model nor a (twisted) Edwards model exists over F_p
        for this curve. Lanes L9, L11 and L12 PREREGISTER this as a prediction to
        be certified, not as a fact. It is conditional on the retrieved values
        being correct, which is lane L0's job.

