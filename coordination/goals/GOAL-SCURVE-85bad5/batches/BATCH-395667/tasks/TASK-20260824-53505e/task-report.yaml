  # ---------------------------------------------------------------------------
  # SOURCES RETRIEVED AND NOT RETRIEVED
  # ---------------------------------------------------------------------------
  retrieval_summary:
    retrieved:
    - Legifrance JORFTEXT000024668816, the primary Journal Officiel Avis (French), carrying p, A, B, x(P0), y(P0), q, cofactor and OID.
    - ANSSI publication page on cyber.gouv.fr, carrying the generation statement and the DER parameter file offer.
    - J08nY/std-curves anssi/curves.json, from two distinct URLs, agreeing with the primary tuple and carrying a disputed seed field.
    - std.neuromancer.sk FRP256v1 page, agreeing with the primary tuple and carrying uncertified computed traits.
    - DiSSECT standards page for ANSSI.
    - DiSSECT paper metadata (eprint 2022/943): title, authors, abstract, dates.
    not_retrieved:
    - id: NR-1
      target: All SafeCurves pages (index, rigid, verify, twist) and the SafeCurves paper on cr.yp.to.
      reason: HTTP 502 Bad Gateway through the session proxy on six attempts across six URLs, including a control fetch of the host root.
      classification: operational observation, never mathematical evidence
      handled_by: audit-plan lane L1 (blocking retrieval gate) and capsule CONF-3
      not_substituted: >-
        No secondary summary of the SafeCurves criteria was silently substituted.
        The numeric thresholds this plan mentions (rho >= 2^100, |D| > 2^100) are
        marked `recalled` in the capsule and every lane that would score against
        them is gated behind L1.
    - id: NR-2
      target: The body text of eprint 2022/943 (DiSSECT).
      reason: The PDF returned raw compressed object streams the fetch tool could not convert to text.
      handled_by: recorded in capsule source S6 as partial, with the search-snippet claim explicitly marked NOT a verified quotation and not cited as support.
    - id: NR-3
      target: The signed Journal Officiel PDF (as opposed to the Legifrance HTML record).
      reason: Not attempted within budget after the HTML record fetched successfully.
      handled_by: audit-plan lane L0, which re-fetches sources as raw bytes with digests.
    primary_french_source_statement: >-
      REQUIRED BY THE HANDOFF AND ANSWERED DIRECTLY: the primary French-language
      source WAS fetched. The Legifrance record of the 16 October 2011 Avis
      (JORF n.0241) returned the curve parameters, and the ANSSI publication page
      returned the generation statement. Neither was replaced by a secondary
      summary. The one qualification, stated plainly rather than buried, is that
      the fetch tool renders a page and answers through a summarisation model, so
      the transcribed hexadecimal digits are retrieved-via-summariser and not
      byte-verified; byte verification is lane L0 and is not claimed here.

  # ---------------------------------------------------------------------------
  # UNRESOLVED CONFLICTS BETWEEN INTAKE AND RETRIEVED SOURCES
  # ---------------------------------------------------------------------------
  unresolved_conflicts:
  - id: CONF-2
    severity: material_for_the_rigidity_lane
    summary: >-
      The std-curves database carries a `characteristics.seed` field for
      FRP256v1 holding an 8192-bit hexadecimal value. No primary source - not the
      Journal Officiel Avis, not the ANSSI publication page - contains any seed
      or any generation procedure, and the DiSSECT standards page, maintained by
      the same group as std-curves, records no seed for this standard.
    why_it_is_not_dismissed: >-
      A seed appearing in a derived database but in no primary source is exactly
      the datum that decides whether the rigidity question is "no transcript was
      published" or "a transcript exists and nobody connected it to the primary
      record". The value's shape (8192 bits) is inconsistent with an ANSI X9.62
      verifiably-random seed, which is customarily 160 bits, so even if genuine it
      is not on its face an X9.62 transcript - an observation about the value, not
      a conclusion about it.
    resolution: audit-plan lane L8 step L8.1, with the byte-exact re-fetch in L0
    status: open
  - id: CONF-3
    severity: blocks_cell_by_cell_comparison
    summary: >-
      The eleven preregistered True/False cells could not be sourced this session
      because SafeCurves was unreachable. The comparison target is therefore
      currently unsourced.
    resolution: audit-plan lane L1
    status: open, operational
  - id: CONF-4
    severity: blocks_everything_downstream
    summary: >-
      Exact equality between the intake decimal values of p and b and the
      retrieved hexadecimal values has not been established. This session had no
      execution tool and performed only one exact structural hand check
      (a = p - 3, consistent with the intake equation y^2 = x^3 - 3x + b) and two
      approximate leading-digit checks consistent to five or six significant
      figures.
    resolution: audit-plan lane L0, ranked first for exactly this reason
    status: deferred, not failed
  - id: CONF-6
    severity: framing
    summary: >-
      ANSSI asserts the curve was "générée de manière aléatoire" and selected
      against the usual security criteria, while publishing no seed, no script and
      no acceptance predicate. This is an absence, not a contradiction with
      intake.
    resolution: >-
      audit-plan lane L8, which is designed around what an audit can and cannot
      establish from an absence, and which states its observation collision
      (four distinct generation histories with the same observable) before any
      compute is spent.
    status: open by design
  no_conflict_found_between:
    intake_equation_and_primary_source: >-
      The intake equation's a = -3 form is corroborated exactly by the primary
      source (p and a differ only in the final hex digit). The intake decimal for
      b is consistent with the primary hex to the precision hand-checkable
      without arithmetic. This is a consistency observation, not a verification.
    parameter_tuple_across_sources: >-
      The primary source and two independent secondary sources reported the same
      p, a, b, Gx, Gy, n, h and OID. On that basis the producer's assessment is
      that the goal's parameter-tuple pause condition is NOT triggered; the
      Coordinator holds the decision.

  # ---------------------------------------------------------------------------
  # WHAT THIS TASK DID NOT DO
  # ---------------------------------------------------------------------------
  no_attack_and_no_safety_conclusion:
    no_curve_attack_ran: >-
      NO CURVE ATTACK OF ANY KIND WAS RUN, ATTEMPTED, OR SIMULATED. No discrete
      logarithm was computed, no transfer was mounted, no factorisation was
      performed, no point count was performed, and no arithmetic of any kind was
      executed in this session.
    no_experiment_result_created: >-
      No experiment record, no run record, and no evidence record was created.
      Nothing in the three artifacts is an experimental outcome.
    no_safety_statement: >-
      This task makes NO statement that ANSSI FRP256v1 is safe, unsafe,
      vulnerable, or free of vulnerabilities, and no such statement may be
      derived from these artifacts. Every quantitative statement in the plan is a
      PREREGISTERED PREDICTION about a measurement that has not been made.
    no_live_key_material: >-
      Only public named-curve parameters and locally generated control objects
      appear anywhere in these artifacts. No private key was tested, requested,
      stored or derived.
    non_insinuation_clause: >-
      The absence of a published generation transcript is recorded as an open
      question with a stated falsifier and a bounded search space. It is not
      presented as, and must not be read as, an allegation that the curve was
      manipulated. The plan states in advance that "no transcript found" has four
      distinct preimages and therefore cannot support any one of them.

  reuse_compliance:
    idea_reused: IDEA-20260807-98a970
    how: >-
      Audit-plan lane L6 SPECIALISES that proposal to FRP256v1 for embedding
      degree, anomalous and full-torsion coverage. Its certificate formats
      (exact-k via the factorisation of n-1 with one witness per prime factor;
      the non-succinct lower bound k > K), its three degenerate checks, its
      planted-positive control set, and its representability wall are taken
      unchanged.
    no_duplicate_minted: >-
      No new IDEA-* record was created by this task, and no identifier was
      allocated. That proposal already names FRP256v1 in its curve list, so this
      goal is a consumer of it, not a competitor.

  successor_handoffs_proposed:
    note: >-
      Proposals only. The Coordinator allocates identifiers, assigns work and
      approves scope; this task does neither.
  - proposal: >-
      Executor task: run lane L0 (byte-exact source reconciliation and tuple
      self-consistency certificate) with its NULL-SHUFFLE control. Budget 900 s.
      Blocking for everything else.
    rationale: cheapest test that can invalidate every other lane at once; resolves CONF-4.
  - proposal: >-
      Executor or idea-generator task: run lane L1 (retrieve the SafeCurves
      criterion definitions and freeze a thresholds file with source digests),
      retrying the host across the batch. Budget 600 s.
    rationale: resolves CONF-3; without it every cell comparison would score against a recalled threshold.
  - proposal: >-
      Executor task: lane L8 step L8.1 only - re-fetch std-curves as raw bytes,
      hash it, and trace the seed field's provenance. Budget 300 s.
    rationale: >-
      Resolves CONF-2, the only live source conflict, at trivial cost, and
      determines how the rest of L8 is scoped.
  - proposal: >-
      Coordinator decision: whether Sage, PARI or GMP-ECM can be provisioned.
      Three declared diagnostics are only partially covered because they cannot,
      and the deferrals are recorded with that exact successor condition.
    rationale: converts three `deferred: partial` diagnostics into full coverage without changing any certificate format.
  - proposal: >-
      Validator task: adversarial review of this plan's control adequacy before
      any lane runs, with specific attention to whether L8's negative controls
      genuinely separate "no transcript exists" from "our verifier knows one
      format".
    rationale: >-
      That confound is the one most likely to produce a confidently wrong
      negative, and it is cheaper to catch before compute than after.

  limitations_of_this_task:
  - No arithmetic was executed, so every numeric consistency statement is a hand check labelled as such and none is a certificate.
  - Parameter transcription is summariser-mediated; three independent sources agreeing raises confidence but does not replace a byte-level check.
  - The SafeCurves criteria themselves are unretrieved, so this plan's descriptions of what each cell means are the producer's reconstruction, gated behind L1 and marked recalled in the capsule.
  - The positive controls for transfer and disc (Anomalous, BN(2,254)) were not sourced, because their records lie outside this task's read scope; the plan pushes that sourcing into the lane that uses them.
  - The claim that the plan's lane set is complete is a statement about this session's search, not a theorem. It is labelled `unverified`, and the goal's own claim boundary that the diagnostic list is deliberately non-exhaustive applies unchanged.
