        The sibling task TASK-20260916-64a93b's directory. NO FILE IN IT WAS
        OPENED AT ANY POINT, and no byte of its content entered this session.
      disclosed_contact: >-
        Full disclosure, because "I did not read it" should be checkable rather
        than trusted. Two contacts, both metadata-only, both during compliance
