  # ------------------------------------------------------------------
  # VERDICTS -- on my joints only.  I did not see the other joints and form
  # no view on the claim as a whole; the Coordinator composes the round.
  # ------------------------------------------------------------------
  verdicts:
    J-1:
      verdict: holds
      answer: >-
        Lemma 2 of Nagao 2013/549 (pymupdf 303-313; frozen md 685-708). Matched on
        content: 2013/549's own Lemma 3 is a different statement about
        deg(wd(monomial)). The restatement in 2015/984 is faithful in content,
        with three transcription defects (an added and unproved
        reduction-to-zero-iff-ideal-membership equivalence; M-versus-N index
        count; and a symbol collision between Lemma 3's field-equation multipliers
        and Lemma 4's system generators).
      confidence: 0.98
    J-2:
      verdict: holds
      answer: >-
        Proved, pymupdf 314-414. The measure is psi(G) under a graded monomial
        order and is well-founded because a monomial order well-orders the
        monomials. The base case is not stated but is present in effect: the
        terminal tuples are those with NUM(G)=1 or deg psi(G)=D. The inductive
        step preserves membership in the representation set and strictly
        decreases psi -- both verified by executing the construction. No
        hypothesis absent from the statement is used; the graded order is chosen
        inside the proof and exists unconditionally, but it IS load-bearing and is
        unreadable in the frozen markdown. Six write-up defects found, of which
        D-3 (claim 1) printed for the whole multiplier rather than its leading
        term) is FALSE AS PRINTED with an exhibited witness; all six are fillable
        without a new idea.
    J-3:
      verdict: breaks_as_printed_holds_conditionally_on_usage_form
      answer: >-
        Lemma 2 does NOT support Lemma 4 as printed, and Lemma 4 as printed is
        FALSE. Lemma 4 puts the union on the FAKE side and leaves the true side as
        {f_1..f_M} alone; the derivation from Lemma 2 necessarily puts multipliers
        on the field equations and so needs them as MEMBERS of the true system.
        What Lemma 2 does deliver is
            d_F({f_1..f_M} u S_fe) <= max_i deg(g_i f_i)   [UNREDUCED]
        for any fake-fall witness, which equals d'_F only under an extra
        hypothesis (U-4) that neither paper states: the realising witness's
        unreduced product degrees must not exceed d'_F. Lemma 2 cannot close that
        gap, because its bound is relative to deg R and deg R is itself governed
        by the unreduced product degree.
      textual_finding: >-
        2015/984's ONLY use of Lemma 4 -- the proof of its Lemma 6 -- applies it
        with the union on the TRUE side and absent from the fake side, the exact
        reverse of Lemma 4's printed placement and the sound direction. 2013/549
        never states Lemma 4 at all; it states the specific estimate with the
        union on the true side ("n + N number equations"), where U-4 is discharged
        by explicit degree bookkeeping (deg g_i <= 1, reduced [f]^down_i) rather
        than by the fake definition.
      terminology_finding: >-
        The card names Lemma 4's printed form the INSIDE form (S_fe inside the
        FAKE system). That placement is INERT: every product h_j (X_j^p - X_j)
        is 0 mod S_fe, so adjoining S_fe to the fake system leaves all three of
        Definition 6's conditions, and hence d'_F, unchanged. Verified
        exhaustively under both readings at recheck.out 92-102. The placement
        that decides the truth value of d_F <= d'_F is on the TRUE side, where
        Lemma 4 as printed puts S_fe OUTSIDE. On my reading, Lemma 4 as printed
        and the object this program verified false are the same statement. I
        report this reading of the definitions; naming and campaign consequences
        are the Coordinator's.
      upstream_hypotheses_the_campaign_inherits: [U-1, U-2, U-3, U-4, U-5, U-6, U-7]
      upstream_hypotheses_detail: see report.md J-3 table
    J-5:
      verdict: control_passes
      answer: >-
        Run against the outside form, my J-3 derivation DOES NOT go through, and
        it fails at exactly the step whose absence makes the outside form false:
        with S_fe outside, the term -G'_j (X_j^p - X_j) is not a member of the
        system, so the only admissible combination is the unreduced sum, of degree
        3, with no drop. A derivation that survived, or that broke somewhere else,
        would have told me the derivation was wrong. It broke in the right place.
      second_control_finding: >-
        Under the ">=" reading of condition (1) printed in 2015/984, the inside
        form holds WITHOUT Lemma 3 at all: any representation of R will do,
        because ">=" condition (1) is helped rather than hurt by large products.
        That is the other kind of proving-too-much -- an argument succeeding
        without its stated ingredient -- and it is evidence about the READING, not
        about the derivation. It independently corroborates
        EXP-SEMBIN-4fa22c's declared equality convention, from the upstream
        lemma's necessity rather than from Assumption 1's degeneracy.

  # ------------------------------------------------------------------
  # THE COUNTEREXAMPLE, so it survives this session
  # ------------------------------------------------------------------
  counterexample_to_lemma_4_as_printed:
    field: F_2
    ring: F_2[X, Y]
    f_1: X^2 * Y
    f_2: X*Y + X
    S_fe: [X^2 + X, Y^2 + Y]
    note_on_mechanism: f_1 is NOT reduced mod S_fe; the fake world sees it as XY, of degree 2
    values:
      fake_d_prime_F_equality_reading: 2
      fake_d_prime_F_ge_reading: 2
      true_d_F_S_fe_OUTSIDE_equality_reading: 3
      true_d_F_S_fe_OUTSIDE_ge_reading: 3
      true_d_F_S_fe_INSIDE_equality_reading: 3
      true_d_F_S_fe_INSIDE_ge_reading: 2
    conclusion: d_F = 3 > 2 = d'_F, so Lemma 4 as printed is false under both readings
    rigour: >-
      Exhaustive, not sampled. The fake quantities range over all 256 reduced
      multiplier pairs, which is complete because every condition of Definition 6
      is stated modulo S_fe. The equality-reading true quantities are searched at
      every d = 0..4 over every multiplier with deg(g_s * s) <= d. The ">="-reading
      lower bounds, which no bounded search can certify, rest on two ring
      homomorphisms (X -> 0 annihilates both generators; Y -> 1 sends f_1 -> X^2
      and f_2 -> 0).
    reproduce: python3 recheck.py   # CHECK 3 and CHECK 4
    independently_derived_before_reading: ledger/corrections/CORR-20260916-96f47d.yaml
    relation_to_the_recorded_one: >-
      A DIFFERENT object from CORR-20260916-96f47d's (f_1 = X1X2 + X3,
      f_2 = X1 + X2), and stronger in one respect: it also kills the inside form
      under the equality reading, which that one does not.

  # ------------------------------------------------------------------
  # COMPLIANCE
  # ------------------------------------------------------------------
  compliance:
    runs_performed: 0
    measurements_performed: 0
    maximum_runs_respected: true
    what_recheck_py_is: >-
      A hand-check of algebraic steps, mechanised. Exact finite arithmetic in
      F_p[X_1..X_N]; no sampling, no timing, no randomness, no property of any
      research object. Labelled a recheck in its own header and in every
      deliverable that cites it.
    deliverables_written: 6
    deliverables:
      - coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-e0a0c1/read-nagao-2013-549/report.md
      - coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-e0a0c1/read-nagao-2013-549/statement-map.json
      - coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-e0a0c1/read-nagao-2013-549/attestation.yaml
      - coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-e0a0c1/read-nagao-2013-549/recheck.py
      - coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-e0a0c1/read-nagao-2013-549/recheck.out
      - coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-e0a0c1/read-nagao-2013-549/reextract.md
    nothing_created_outside_write_scope: true
    scratch_outside_the_repository:
      - path: /tmp/val-9da6e0/n2015.txt
        what: pymupdf extraction of the hash-verified 2015/984 PDF, used to read
          Definitions 5 and 6 and Lemmas 3, 4 and 6 unmangled
        why_not_a_deliverable: >-
          It is a derivative of a frozen artifact, reproducible from it by the
          command recorded in reextract.md, and adding a companion file to another
          package is outside this task's write scope.
    git_status_porcelain:
      mine: "?? coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-e0a0c1/read-nagao-2013-549/"
      not_mine: "?? coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-e0a0c1/read-semaev-2015-310/"
      disclosure: >-
        The completion gate asks that `git status --porcelain` show nothing
        outside the write scope. It shows one other path: the SIBLING task's
        directory, which already existed (mtime 15:03) before I created mine
        (15:11). I did not create, modify, open or list it. Reporting this rather
        than asserting a clean gate, because the gate is about what I did and the
        raw output does not by itself say so.
    git_add_commit_push: none performed
    artifacts_left_on_disk_for_the_coordinator_to_land: true

  # ------------------------------------------------------------------
  limitations:
    - This is a reading of two frozen texts plus exact hand algebra on two and
      three variables over F_2 and F_3. Not a measurement, not evidence about any
      elliptic curve, not a claim about any research object.
    - It rules on nothing the campaign should do, changes no status, discharges no
      joint, and authorises nothing.
    - Verdicts cover J-1, J-2, J-3 and the J-5 control only.
    - The exhaustive searches are exhaustive within their declared bounds (d <= 4;
      multiplier degree bounded by d - deg s). The ">="-reading lower bounds rest
      on the homomorphism certificates, not on the search.
    - Two in-scope documents leaked program conclusions to me
      (errata-extraction-20260921.md on J-1, CORR-20260916-96f47d on part of J-5's
      object). Both are recorded above with what I had derived before reading
      them.
  could_not_determine: [CND-1, CND-2, CND-3]
  could_not_determine_detail: see statement-map.json and report.md
