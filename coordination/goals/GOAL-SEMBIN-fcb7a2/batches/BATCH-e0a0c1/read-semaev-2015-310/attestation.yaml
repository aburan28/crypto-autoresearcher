  # ---------------------------------------------------------------------------
  # VERDICT PER SUB-JOINT
  # ---------------------------------------------------------------------------
  verdict: breaks
  verdict_scope: >-
    `breaks` is the composed verdict FOR THE JOINTS OWNED: a gap between
    statement and argument is found and named (J-4c), and the argument survives
    its own known-false object (J-5). It is NOT a verdict on Semaev's paper, on
    Nagao's Proposition 5, on H-SEMBIN-a7e721, or on the campaign -- none of
    which this task can see whole, and none of which it has authority over. A
    blinded reviewer reports on its own joints; the Coordinator composes.

  verdict_per_sub_joint:
    - joint: J-4a
      question: Which statement of 2015/310 does this program consume, and how determined?
      verdict: answered, with a recorded ambiguity
      finding: >-
        The campaign consumes Semaev's Section 4.5 FIRST FALL DEGREE result --
        the number 4 -- and consumes it THROUGH Nagao 2015/984's Propositions 2
        and 5, not directly. Determined from H-SEMBIN-a7e721's `mechanism`
        LINK 1, Nagao's attribution to [14] at :587-600 / :719-729 / :956-960,
        and source_record.yaml's record that the paper's OTHER consumed
        statements belong to other goals (Section 4.3 to GOAL-RELN-001 and
        GOAL-ICEX-001; Assumption 1 to GOAL-DREG-001).
      ambiguity_reported_not_resolved: true
      ambiguity: >-
        (1) NO record of this campaign cites 2015/310 at all -- not
        H-SEMBIN-a7e721's citations block, not EXP-SEMBIN-4fa22c's, and the
        experiment's dependencies name only the Nagao fulltext. The consumed
        statement exists in the campaign's records only as unanchored prose
        inside a `mechanism` field. (2) Within Section 4.5 the paraphrase does
        not pick between ST-02 (system-level, "proved to be 4") and ST-11
        ("at least t-2 of the equations"), which are materially different --
        ST-11 excludes the terminal equation always and excludes everything at
        t = 2. Not resolved by choosing, per the card.

    - joint: J-4b
      question: What does the argument actually establish? Quantifier order, hypotheses, asserted steps.
      verdict: answered
      finding: >-
        PROVED: the FAKE first fall degree of the NON-TERMINAL links is at most
        4, by a single UNIFORM witness -- the variable x1 -- with the strongest
        available quantifier order (for all n, all V, all B, all non-terminal
        links, there exists a fall at 4, exhibited by one fixed object). For one
        such link taken alone the value is EXACTLY 4 (lower bound supplied by
        this task at RC-1i, not argued in the paper). NOT PROVED: the terminal
        equation (experimental only, and the paper says so); the field-level to
        descended-system transfer (true, but it is Nagao's Lemma 5, not stated
        here); the fake-to-true conversion (absent -- Nagao's Lemma 4, which he
        calls "complicated and not constructive"); and d_ff -> d_F4 (a declared
        assumption the paper itself calls "not generally correct").
      quantifier_order_finding: >-
        The ARGUMENT's quantifier order is strong and clean. The slide is not in
        the argument, it is in the EXPERIMENTAL support for Assumption 1
        (ST-14): "for all values in the tables ... for randomly chosen z. So the
        assumption is very likely to be correct for any values of n, m, t <= m."
        Three quantifier slides in one sentence -- typical z to all z, tested
        (n,m) to all (n,m), one V to any V -- against a statement that
        quantifies over z and B not at all.

    - joint: J-4c
      question: Is there a gap? Name it precisely; which side must a consumer rely on?
      verdict: breaks — gap found, three distinguishable components
      finding: >-
        GAP-1 QUANTITY (heaviest): statement says true first fall degree and
        d_F4; argument delivers the fake degree of a subset of equations. Two
        conversions separate them and neither is in this paper. GAP-2 COVERAGE
        (sharpest, because exact): system (5) has t-1 equations, the argument
        reaches t-2, so exactly one -- the terminal link -- is uncovered at
        every t, and at t = 2 the count is zero while Assumption 1's range
        includes t = 2. GAP-3 QUANTIFIER: universal statements on
        typical-instance evidence at n <= 21 (one cell at 40), m <= 6, against a
        FIPS conclusion drawn at n = 409, 571 and m = 11, 12.
      which_side_a_consumer_relies_on: >-
        A consumer wanting a FAKE first-fall-degree bound on the descended
        chained system may rely on the ARGUMENT; it is sound, uniform, and
        verified here. That is the side H-SEMBIN-a7e721's LINK 1 names. A
        consumer wanting d_F4 <= 4 -- which is what every complexity statement
        in the paper needs -- must rely on the STATEMENT, because the argument
        does not reach it.
      recorded_as_not_a_gap: >-
        Semaev's argument is sometimes described as leaning on a symmetry that
        an affine coset shift would destroy. It does not (RC-2g), because
        squaring over F2 is F2-AFFINE on coordinates. Recorded because it looks
        like a gap and is not, and because it is a fact about the reach of the
        argument, which is this joint's subject.

    - joint: J-5
      question: PROVES-TOO-MUCH control — apply the argument where its conclusion is known FALSE.
      verdict: CONTROL FAILS — the argument survives its own known-false object
      control_outcome: failed
      finding: >-
        The paper supplies the object itself. Section 4.5.1 closes (:1054-1058,
        PDF p.13): "the maximal degree (regularity degree) generally exceeds 4
        when k > ceil(n/m) though the first fall degree is still 4." On the same
        family, measured by the same author with the same instrument, the
        argument's PREMISE holds and its CONCLUSION is false -- he says both.
        The argument runs there UNCHANGED, because k appears nowhere in it.

  # ---------------------------------------------------------------------------
  # CONTROL OUTCOME, in full
  # ---------------------------------------------------------------------------
  control:
    kind: proves-too-much
    required_by: AGENTS.md "Review architecture"; docs/inventor-protocol.md section 3
    object: >-
      Semaev's own reported regime k > ceil(n/m), where he states the regularity
      degree generally exceeds 4 while the first fall degree is still 4.
    object_constructed_by: the paper, not this task
    argument_still_runs: true
    outcome: FAILS
    mechanical_support:
      - "RC-2a/RC-2b: k = 1..n swept over F_2^5 and F_2^7; deg S3 = 3, bound 4, deg(x1*S3) = 3, fall = True at every k."
      - "RC-2d: at n = 7, m = 3 the exceeded regime is k = 4..7, all covered explicitly."
      - "RC-2e: random (non-polynomial) subspaces of dimension 2, 3, n-1, n -- fall survives."
      - "RC-2f: the mixed field/subspace shape of system (5) -- fall survives."
      - "RC-2g: coset-shifted (affine) descents -- fall survives."
      - "RC-4: deg_F2(x^a) = popcount(a), verified a = 1..39. The whole exhibition is that one Frobenius fact, and dim V does not enter it."
    structural_tell_applied: >-
      docs/inventor-protocol.md section 3 asks what a quantity should do as the
      parameter meant to destroy it increases. Applied here to an ARGUMENT
      rather than a measurement: as k grows past ceil(n/m) the conclusion does
      die -- the paper reports it dying -- and the argument does not change at
      all. The parameter that destroys the conclusion is invisible to its
      justification.
    what_it_establishes:
      - "Assumption 1 is NOT refuted; its hypothesis k = ceil(n/m) excludes the regime and it is stated correctly."
      - >-
        The JUSTIFICATION offered for Assumption 1 does not distinguish the
        regime where it is believed from the regime where the author reports it
        false. Everything offered in support of d_F4 <= 4 at k = ceil(n/m) would
        equally support it at k = ceil(n/m) + 1, where the paper says it is
        wrong.
      - >-
        The first fall degree assumption d_F4 <= d_ff is therefore not merely
        "not generally correct" in the abstract. It is reported false by this
        paper's own experiments, on this paper's own family of systems, one
        parameter step from the regime the FIPS conclusion is drawn in.
    what_it_does_not_establish: >-
      Nothing here measures d_F4, at any k. The falsity of the conclusion at
      k > ceil(n/m) is THE PAPER'S OWN REPORT, taken at face value as the
      author's statement about his own experiments. This task performed no
      measurement and makes no claim about the true value of d_F4 anywhere.
    contrast_control_passed: >-
      The argument is not indiscriminate. Run against the terminal equation
      S3(x1,x2,z), where the multiplier x1 gives no fall, it CORRECTLY REFUSES
      (RC-1f/g/h) and Semaev flags the refusal in the text. So it has a working
      discriminator along the equation-type axis and NONE along the dim-V axis.
      That contrast is what makes the k-insensitivity a finding rather than a
      generic complaint about upper-bound arguments.

