      log2_memory_bits: {ML-KEM-512: 98.1, ML-KEM-768: 143.2, ML-KEM-1024: 194.3}
    trivial_strategy_S0_log2_gates:
      ML-KEM-512: 142.6
      ML-KEM-768: 205.5
      ML-KEM-1024: 277.7
    interpretation: >-
      PSSearch lowers the source-matched trivial strategy by 1.2/1.2/1.2 bits
      and the source's previous gate estimates by 4.6/4.6/4.4 bits. These are
      estimator projections, not standardized solves.
  primal_memory_routing:
    evidence_class: estimate
    source_ids: [S04, R07]
    model: memory_routing
    geometry: two-dimensional routing/sorting model with recursive sieving
    sieve_dimension: {ML-KEM-512: 375, ML-KEM-768: 586, ML-KEM-1024: 829}
    log2_sieve_cost: {ML-KEM-512: 145.7, ML-KEM-768: 216.5, ML-KEM-1024: 273.6}
    extrapolated_log2_full_primal_cost: {ML-KEM-512: 158.7, ML-KEM-768: 229.9, ML-KEM-1024: 310.2}
    increase_over_source_updated_no_routing_model:
      ML-KEM-512: 14.3
      ML-KEM-768: 22.6
      ML-KEM-1024: 30.6
    interpretation: >-
      The full-attack values assume all non-sieve terms are unchanged. They are
      not CC values and cannot be used to add a memory penalty to another attack.
  carrier_code_based_dual:
    evidence_class: estimate
    source_ids: [S05, R03]
    models:
      C0: {ML-KEM-512: 121.8, ML-KEM-768: 173.0, ML-KEM-1024: 239.0}
      CC: {ML-KEM-512: 139.5, ML-KEM-768: 195.1, ML-KEM-1024: 259.7}
      CN: {ML-KEM-512: 134.5, ML-KEM-768: 189.8, ML-KEM-1024: 254.6}
    mechanism: polar-code lossy decoding replaces MATZOV modulus switching
    validation: decoder distortion benchmarked on 1000 random words per selected code
    caveats:
      - CC ignores memory access.
      - The product-code nearest-neighbor cost may be optimistic by about 6 bits near sieve dimension 380.
      - The benchmark validates the decoder component, not full ML-KEM key recovery.
  corrected_isometric_code_based_dual:
    evidence_class: estimate
    source_ids: [S09, R01, R02]
    models:
      C0: {ML-KEM-512: 121.9, ML-KEM-768: 173.0, ML-KEM-1024: 237.4}
      CC: {ML-KEM-512: 139.1, ML-KEM-768: 194.7, ML-KEM-1024: 259.0}
