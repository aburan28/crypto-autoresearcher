schema: crypto.autoresearch.cost_baseline_report.v1
task_id: TASK-20260722-206
goal_id: GOAL-MLKEM-001
research_object: passive public-key MLWE underlying ML-KEM-512/768/1024
literature_cutoff: '2026-07-22'
accessed_at: '2026-07-22'
artifact_kind: literature_and_repository_audit
official_state_change: none

inference:
  requested_policy: research-sol-max
  resolved_model_id: gpt-5.6-sol-xhigh
  reasoning_effort: xhigh
  fallback_used: true
  adapter_version: cursor-subagent-2026-07

scope:
  included:
    - primal and uSVP attacks
    - heuristic, code-based, and provable dual attacks
    - dual-sieve-FFT, modulus switching, lossy coding, and LaMS
    - hybrid decoding and batch-CVP
    - BKW, Arora-Ge, Groebner-basis, and resultant approaches
    - memory-routing models
    - quantum sieving, quantum-augmented dual attacks, and quantum Gaussian sampling
    - physical-resource caveats
  excluded:
    - decryption-failure oracles, side channels, faults, and implementation leakage
    - protocol reductions that do not supply an attack on the passive public-key MLWE instance
  kyber_to_ml_kem_mapping: >-
    A Kyber-512/768/1024 estimate is mapped to ML-KEM-512/768/1024 only when
    the attacked public-key MLWE parameters are n=256, q=3329, module rank
    2/3/4, and centered-binomial eta_1=3/2/2. Protocol-dependent claims are not
    transferred automatically.

evidence_classes:
  estimate: analytic or estimator output; no target key was recovered
  toy_execution: implementation or experiment below standardized dimensions
  standardized_solve: independently checkable full-key recovery at a FIPS 203 parameter set
  physical_projection: hardware/error-correction resource estimate, not an execution

cost_model_legend:
  C0:
    meaning: Core-SVP abstraction with one idealized SVP call and lower-order exponent terms suppressed
    prohibition: not comparable to CC, CN, RAM, memory-routing, quantum-query, or physical figures
  CC:
    meaning: classical-circuit/list-decoding-classical model used in the cited dual estimators
    caveat: source implementations omit memory-access cost
  CN:
    meaning: classical nearest-neighbor/query/list-decoding-naive-classical model
    caveat: query count is not a circuit, gate, RAM, or physical cost
  ram_gate_count:
    meaning: source-defined gate count for progressive BKZ plus final search under a RAM abstraction
    caveat: not the dual-attack CC model despite both being reported in bits
  memory_routing:
    meaning: source-defined hardware-time model charging routing/sorting of exponentially large sieve lists
    caveat: depends on geometry, routing exponent, and a large uncertain constant
  GE19:
    meaning: quantum circuit estimate for the lattice sieve used by the cited dual attack
    caveat: still grants unit-cost QRACM in the cited quantum-augmented framework
  QN:
    meaning: quantum nearest-neighbor/query model
    caveat: not a physical gate count
  Q0:
    meaning: quantum Core-SVP abstraction
    caveat: optimistic and not a physical gate count
  source_defined_provable_dual:
    meaning: complete source formula combining BKZ, Gaussian sampling, and guessing in PS24/QX25/LaMS
    caveat: not C0, CC, or CN
  source_defined_quantum_algorithmic:
    meaning: source-level quantum operation/query estimate for QRS Gaussian sampling inside a dual attack
    caveat: not QN, Q0, GE19, or a fault-tolerant physical estimate
  physical:
    meaning: qubit, error-correction, clock, and elapsed-time projection
    caveat: cannot be subtracted from any logarithmic estimator cost

standardized_targets:
  ML-KEM-512: {n: 256, module_rank: 2, flattened_secret_dimension: 512, q: 3329, eta_1: 3}
  ML-KEM-768: {n: 256, module_rank: 3, flattened_secret_dimension: 768, q: 3329, eta_1: 2}
  ML-KEM-1024: {n: 256, module_rank: 4, flattened_secret_dimension: 1024, q: 3329, eta_1: 2}

