      LaMS_over_QX25: {ML-KEM-512: 22, ML-KEM-768: 31, ML-KEM-1024: 41}
    interpretation: >-
      LaMS replaces recovery modulo several CRT primes with repeated p-adic
      recovery at p=2. These values are not CC and are not deltas from Carrier,
      Hou--Jiang, or Li--Zheng.
  hybrid_batch_cvp:
    evidence_class: toy_execution
    source_ids: [S14, R08]
    standardized_values: null
    executed_boundary: >-
      Scaled Kyber-like CBD(3) LWE at n=140..170; up to 3.4x speedup over the
      matched primal implementation. Broader tested distributions reached up to
      5x at dimensions no greater than 210.
    interpretation: no standardized ML-KEM estimate or solve
  module_rotation_prior_art:
    evidence_class: toy_execution_and_estimate
    source_ids: [S08, S09, S15]
    result: >-
      Negacyclic rotations generate equal-norm short vectors and permit same-A
      preprocessing reuse. Wu--Xu's main example is NewHope512; corrected
      ML-KEM gains are the Hou--Jiang values above.
  algebraic_and_combinatorial:
