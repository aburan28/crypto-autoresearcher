bottom_line:
  classical: >-
    Hou--Jiang's 121.9/173.0/237.4 C0, 139.1/194.7/259.0 CC, and
    134.5/188.7/254.1 CN values are the corrected structure-aware
    Ogilvie-family reference. Li--Zheng supplies lower label-aligned values in
    selected columns but retains an unresolved wrong-tail approximation. Primal,
    memory-routing, and provable-dual numbers remain separate model series.
  quantum: >-
    QRACM quantum-augmented estimates exist only in idealized GE19/QN/Q0
    models. QRS improves a Gaussian-sampling subroutine, but its published
    absolute Kyber tables inherit pre-LaMS parameters and are not a corrected
    baseline. No end-to-end physical ML-KEM quantum attack estimate or solve was found.
  standardized_solve_status: none
