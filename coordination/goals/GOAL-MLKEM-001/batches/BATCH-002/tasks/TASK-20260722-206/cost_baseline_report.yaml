        QRS: {ML-KEM-512: 141, ML-KEM-768: 201, ML-KEM-1024: 261}
    correction_status: stale_absolute_values_pending_rerun
    reason: >-
      The QRS paper explicitly keeps Pouly--Shen parameters and substitutes only
      the sampler. LaMS later corrected the Gaussian-width substitution and
      reports PS24 costs 238/347/478 and CRT costs 213/313/431. No source at the
      cutoff recomputes QRS after that correction. The QRS sampling theorem is
      not refuted; only these absolute Kyber tables are not current baselines.
    concurrent_polynomial_memory_variant:
      source_id: S22
      concrete_ML_KEM_values: null
      caveat: >-
        Chevignard--Schrottenloher--Shen give no concrete Kyber table because
        competitive estimates require modulus switching. Their second variant
        uses polynomial online memory but excludes DGS preprocessing memory.
  physical_quantum_sieving:
    evidence_class: physical_projection
    source_ids: [S23]
    model: physical
    lattice_dimension: 400
    physical_qubits: approximately_1e13
    elapsed_years: approximately_1e31
    assumptions:
      circuit_level_noise: 1e-5
      code_cycle_nanoseconds: 100
      reaction_time_microseconds: 1
      memory: bucket_brigade_QRAM
    interpretation: >-
      This is an SVP-dimension-400 case study, not a complete ML-KEM-512,
      ML-KEM-768, or ML-KEM-1024 attack. It cannot be converted into a quantum
      bit-security number or used to revise any QN/Q0 estimate.

execution_status:
  passive_standardized_solves_found: []
  conclusion: >-
    No inspected primary source reports a reproducible passive full-key recovery
    for any standardized ML-KEM parameter set.
  toy_or_component_executions:
    - source_ids: [S03]
      observation: PSSearch/G6K solved selected TU Darmstadt LWE challenges up to dimension 90; not ML-KEM
    - source_ids: [S05]
      observation: polar-code distortion and score components were benchmarked; not a full key recovery
    - source_ids: [S14]
      observation: batch-CVP hybrid was run on scaled Kyber-like LWE dimensions; not standardized
    - source_ids: [S15]
      observation: rotation mechanism was exercised on NewHope/toy settings; not standardized ML-KEM
    - source_ids: [S07]
      observation: covariance score predictions were experimentally checked; not a secret recovery

disputed_values:
  - id: D01
    values: Ogilvie 118.8/137.1/132.2, 170.2/192.7/186.9, 234.8/257.2/252.4
    status: superseded
    resolution: use Hou--Jiang Table 1.1 and pinned corrected repositories
  - id: D02
    issue: Carrier base code used Python XOR in 2^100 where exponentiation 2**100 was intended
    status: fixed_in_corrected_lineage
    effect: small differences in unstructured LWE values
  - id: D03
    issue: Ogilvie rotation code passed nfft instead of beta1 to lambda_2
    status: fixed_and_author_confirmed
    effect: published 2--3-bit MLWE gap shrinks to 0--0.8 bit
  - id: D04
    values: uncorrected PS24 185/273/376 and modulus-switching 141/202/279
    status: superseded_as_absolute_classical_comparators
    resolution: corrected provable-family values are 238/347/478 and 213/313/431
  - id: D05
    values: QRS 176/269/363 and 141/201/261
    status: mechanism_current_but_absolute_Kyber_values_stale
    resolution: requires a corrected, reoptimized estimator rerun
  - id: D06
    issue: MATZOV/Guo-style independent-score success prediction
    status: not_accepted_as_baseline
    resolution: require Ducas--Pulles conditional score/tail analysis or a validated replacement
  - id: D07
    issue: Li--Zheng 2026/1400 normal approximation for wrong-candidate score tails
    status: unresolved
    resolution: retain numerical table as provisional estimate, not validated lower envelope
  - id: D08
    issue: Jaques paper/repository revisions changed routing constants and concrete deltas
    status: latest_eprint_values_used
    resolution: pin repository R07 and report 158.7/229.9/310.2 only under its declared model

reproducibility_gaps:
  - >-
    Hou--Jiang's raw output files include repeated randomized polar-code outputs
    without seeds; rounded publication values are stable, raw decimals are not.
  - >-
    LaMS does not vendor or pin lattice-estimator and publishes no saved optimizer
    output. Its search script requires Sage/Python and an externally supplied
    lattice-estimator checkout; R09 is an audit pin, not an author-declared dependency.
  - >-
    The LaMS script hard-codes the corrected PS24 literature totals while searching
    QX25 and LaMS, so one command does not independently regenerate every comparator.
  - >-
    The sieve-memory README still states a 2^-19.8 routing constant while the pinned
    runall.py and latest paper use 2^-12.8; the executable is authoritative for R07.
  - >-
    Fast Slicer's reproducibility branch is ac_artifact, not the repository default
    branch; the exact branch commit must be checked out.
  - >-
    Li--Zheng 2026/1048 and 2026/1400 expose no pinned public estimator revision in
    the inspected primary records.
  - >-
    No corrected post-LaMS QRS table, physical end-to-end ML-KEM quantum circuit,
    or standardized passive attack certificate was found.
  - >-
    Several papers use Gaussian surrogates for centered-binomial secrets/errors.
    A comparison must match the exact CBD or document and bound that approximation.

