  quantum_rejection_sampling_dual:
    evidence_class: estimate
    source_ids: [S21, S22]
    model: source_defined_quantum_algorithmic
    published_fixed_parameter_values:
      without_modulus_switching:
        classical_PS_comparator: {ML-KEM-512: 185, ML-KEM-768: 273, ML-KEM-1024: 376}
        QRS: {ML-KEM-512: 176, ML-KEM-768: 269, ML-KEM-1024: 363}
