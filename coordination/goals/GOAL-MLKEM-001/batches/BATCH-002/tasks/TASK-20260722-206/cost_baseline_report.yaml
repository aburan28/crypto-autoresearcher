      maximum matched structure gain is 0.8 bit, not the published 2--3 bits.
  modulus_switching_plus_lossy_coding:
    evidence_class: estimate
    source_ids: [S10]
    models:
      C0: {ML-KEM-512: 118.09, ML-KEM-768: 172.36, ML-KEM-1024: 238.12}
      CC: {ML-KEM-512: 139.20, ML-KEM-768: 194.02, ML-KEM-1024: 259.40}
      CN: {ML-KEM-512: 134.42, ML-KEM-768: 189.36, ML-KEM-1024: 253.68}
    mechanism: integrate modulus switching with generalized polar-code lossy source coding
    caveats:
      - The minima use different intermediate moduli across models and parameter sets.
      - CC ignores memory-access cost.
      - The parameter search models wrong-guess scores as normal; the paper acknowledges the disputed tail issue.
      - Short-vector sampling dominates the reported totals.
  label_aligned_screening_minima:
    status: provisional_not_a_jointly_reproduced_baseline
    C0:
