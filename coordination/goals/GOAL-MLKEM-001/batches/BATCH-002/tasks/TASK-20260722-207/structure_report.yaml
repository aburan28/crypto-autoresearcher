completion_gate:
  requested: >-
    Reduce the carry-aware LaMS-isometry score to prior art or separate it by
    an explicit invariant.
  status: resolved
  verdict: reduced_to_weighted_rotated_vector_relabeling
  statement: >-
    For every layer, orbit element, candidate, and dual-vector list, the
    transformed-target LaMS score is exactly an adjoint Fourier score on the
    original target with equal-norm rotated vectors and attached LaMS weights.
    This is the weighted form of the Wu--Xu rotated-vector identity, while
    same-A pool reuse over target isometries is the Ogilvie/Hou--Jiang
    mechanism. Signed p-adic carries and the non-equivariance of entrywise
    modulus switching produce explicit, known candidate-label and rounding
    cocycles; they obstruct naive common-candidate averaging but do not add
    samples or information.
  consequence: >-
    IDEA-20260722-001 has no surviving non-equivalent structural-information
    mechanism. A separately measured implementation saving would have to beat
    the corrected isometry-aware baseline after full reoptimization; no such
    saving is derived here.
  confidence: high_for_algebraic_identity_medium_for_external_cost_ordering

