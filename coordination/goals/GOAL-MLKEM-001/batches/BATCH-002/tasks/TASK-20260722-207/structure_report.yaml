symbolic_gate_summary:
  notation:
    relation: "b = A_G s_G + A_D s_D + e (mod q)"
    digits: "s_G = c_i + p^i t_i; c_i = sum_{r<i} p^r d_r; d_i = t_i mod p"
    layer_target: "b_i = b - A_G c_i = B_i t_i + A_D s_D + e (mod q)"
    layer_matrix: "B_i = p^i A_G (mod q)"
    switched_matrix: "Bhat_i = (q/p) floor((p/q) B_i)"
    rounding_residual: "Delta_i = B_i - Bhat_i"
    rational_lattice: "L_i = L_q([Bhat_i | Delta_i | A_D])"
    sample_pool: "Z sampled from D_{L_q^perp(A_D), q s}"
  signed_digit_action: >-
    For a signed permutation S and canonical x,y in {0,...,q-1}^g, write
    y=Sx+q omega_S(x), where omega is zero on positive rows and, on a
    negative row, equals 1 exactly when the selected input coefficient is
    nonzero. Then c_i'=(S c_i+q omega) mod p^i,
    kappa_i=(S c_i+q omega-c_i')/p^i,
    t_i'=S t_i+kappa_i, and
    d_i'=(S d_i+kappa_i) mod p. The wrap bit is not determined by the
    current digit; omitting omega or kappa is incorrect.
  digitwise_borrow_form: >-
    If q=sum q_r p^r and a negative output has wrap bit omega, its digits
    satisfy q_r omega-d_r-beta_r=d_r'-p beta_{r+1}, beta_0=0. Thus
    d_r'=(q_r omega-d_r-beta_r) mod p. For x=0, omega=0 and all output
    digits remain zero; replacing -x by q-x without this branch is wrong.
  orbit_target_update: >-
    With row action J and an orbit-stable guessed block satisfying
    J A_G=A_G S_G, the carry-aware layer target obeys
    b_i'=J b_i+B_i kappa_i (mod q). Therefore the transformed layer is a
    valid LaMS instance, but it does not generally equal J b_i.
  partition_result:
    fixed_partition: >-
      Applying J to b while retaining fixed G,D keeps A_G,A_D, every L_i,
      and the literal pool Z unchanged. It attacks (S s)_G, usually a
      different original coefficient subset. This is same-A coverage reuse.
    aligned_partition: >-
      Inverse-aligning all orbit candidates to one original subset changes
      the partition to G_j=S_j^{-1}G. The corresponding pool must be rotated
      into the dual lattice for D_j. One literal pool is valid without this
      rotation only when G and D are orbit-stable, such as unions of whole
      polynomial blocks.
  switched_lattice_result: >-
    LaMS's proof-separation lattice is L_i, but its reusable samples are not
    drawn from L_i^perp. They are drawn from L_q^perp(A_D), and the Delta_i
    summation supplies the modulus-switching correction. Across layers and
    fixed-partition orbits A_D is unchanged, so pool reuse is exact.
  rounding_cocycle: >-
    The scalar switch map R_p(x)=(q/p)floor(px/q), on canonical residues,
    is not sign-equivariant. For x nonzero,
    R_p(q-x)=q-q/p-R_p(x) and Delta_p(q-x)=q/p-Delta_p(x); both are zero
    at x=0. If J B_i=B_i S_G, define
    C_i=J Bhat_i-Bhat_i S_G, with
    C_i=Delta_i S_G-J Delta_i modulo q. For aligned candidates
    a'=(S_G a+kappa_i) mod p, the candidate residual satisfies
    x_i'(a')=J x_i(a)+Delta_i kappa_i+C_i a (mod q).
    The known pair (kappa_i,C_i) is the exact carry/rounding cocycle.
  score_identity: >-
    Let alpha_i(z)=sum_{v in Z_q^g}
    exp(-2*pi*i*<Delta_i v,z>/q). For u=A_G c_i+Bhat_i a,
    G_{Z,i}(Jb-u)=Re N^{-1} sum_{z in Z}
    alpha_i(z) exp(-2*pi*i*<u,z>/q)
    exp(2*pi*i*<b,J^T z>/q). This is exactly a weighted score on b with
    the rotated vectors J^T z. Carries and switching alter only known
    weights/candidate labels. They do not create independent samples.
  information_identity: >-
    Because every orbit target is an invertible deterministic function of b
    and includes no fresh sample,
    I(s; b,{J_j b}_j | A)=I(s;b|A). Any gain can only be restricted-algorithm
    coverage or implementation amortization.
  control_implication: >-
    An arbitrary signed permutation is not a matched control: it generally
    fails J A=A S and therefore breaks the same-A MLWE relation. It may be
    retained only as a deliberately broken commutator negative.
  multi_layer_limit: >-
    The recurrence is exact only on the branch where every lower digit and
    wrap state is correct. A wrong lower digit changes c_i, kappa_i, b_i,
    and every later candidate label. Orbit averaging supplies no correction
    mechanism for this error propagation.
  full_derivation_path: >-
    coordination/goals/GOAL-MLKEM-001/batches/BATCH-002/tasks/TASK-20260722-207/derivation_note.md

mechanism_audit:
  - mechanism: coefficient_isometries_automorphisms_and_rotated_vectors
    novelty_status: known
    closest_prior_art:
      - https://eprint.iacr.org/2022/1661
      - https://eprint.iacr.org/2026/279
      - https://eprint.iacr.org/2026/366
    finding: >-
      Negacyclic monomials are distribution-preserving signed permutations.
      Wu--Xu already rotate short vectors; Ogilvie and Hou--Jiang already
      reuse hybrid preprocessing over same-A targets.
    mlkem_result: >-
      Hou--Jiang's corrected isometric dual-hybrid gaps are 0.0/0.2/0.3,
      0.0/0.0/0.8, and 0.1/0.6/0.1 bits in C0/CC/CN for
      ML-KEM-512/768/1024. Sparse-secret FHE gains do not transfer to dense
      centered-binomial ML-KEM.
    survives: false
    reason: exact_prior_art_and_corrected_gain_below_material_threshold
  - mechanism: hybrid_partition_and_preprocessing_reuse
    novelty_status: known
    closest_prior_art:
      - https://eprint.iacr.org/2026/279
      - https://eprint.iacr.org/2026/366
    finding: >-
      Fixed partitions permit literal pool reuse but cover different
      coordinates; aligned partitions require rotated pools or invariant
      whole-polynomial blocks. This is coverage, not added information.
    survives: false
    reason: no_nonoverlapping_amortization_identified
  - mechanism: covariance_aware_dual_scores
    novelty_status: known
    closest_prior_art:
      - https://doi.org/10.1007/s00145-025-09560-7
      - https://eprint.iacr.org/2026/1048
    finding: >-
      Covariance-based expectation, variance, and tail prediction already
      cover original, modulus-switched, and decoded dual attacks. Effective
      covariance rank does not measure correct/wrong separation; even a
      Mahalanobis score requires conditional tail and family-wise calibration.
    survives: false
    reason: measurement_prior_art_with_no_new_signal_direction_or_tail_bound
  - mechanism: lams_p_adic_layering
    novelty_status: known
    closest_prior_art:
      - https://eprint.iacr.org/2025/859
      - https://eprint.iacr.org/2026/1326
    finding: >-
      The primary source fully specifies one-layer targets, rational lattices,
      scores, updates, and pool reuse. With p=2 it reports 191/282/390-bit
      costs versus corrected Qu--Xu 213/313/431, not versus the best matched
      structured dual baseline.
    survives: false
    reason: orbit_composition_reduces_to_weighted_rotation_and_absolute_costs_are_unmatched
  - mechanism: modulus_switching_plus_lossy_source_coding
    novelty_status: known
    closest_prior_art:
      - https://eprint.iacr.org/2022/1750
      - https://eprint.iacr.org/2026/1400
    finding: >-
      MS-first LSC already reduces FFT enumeration from q^n_fft to p^k_fft;
      the source reports only modest total Kyber improvement because
      short-vector sampling remains dominant.
    survives: false
    reason: composition_is_published_and_does_not_supply_structure_specific_gain
  - mechanism: module_bkz_and_subfield_reduction
    novelty_status: known
    closest_prior_art:
      - https://eprint.iacr.org/2025/1904
      - https://eprint.iacr.org/2025/2195
    finding: >-
      For power-of-two cyclotomics, asymptotic module-BKZ needs a blocksize
      larger by d-1+o(1) to match BKZ slope. A later finite-tour simulator
      reports potentially faster terminal-block convergence, but its
      subexponential gain is established only when |Delta_K|<d^d, excluding
      the ML-KEM field.
    survives: false
    reason: no_pinned_full_mlkem_cost_below_matched_unstructured_primal
  - mechanism: subfield_subring_trace_and_evaluation
    novelty_status: known
    closest_prior_art:
      - https://eprint.iacr.org/2015/971
      - https://eprint.iacr.org/2016/127
      - https://eprint.iacr.org/2019/183
    finding: >-
      Known subfield, quotient, trace, and evaluation attacks require
      favorable error images, NTRU norm structure, small evaluation roots, or
      multiplier samples restricted to subring cosets. A passive ML-KEM
      matrix supplies none of those conditions, and projected CBD errors
      rapidly lose smallness.
    survives: false
    reason: required_sample_or_error_invariant_absent
  - mechanism: batch_cvp_and_hybrid_decoding
    novelty_status: known
    closest_prior_art:
      - https://eprint.iacr.org/2025/1910
      - https://eprint.iacr.org/2026/366
    finding: >-
      Fast Slicer reports up to a factor-five speedup over primal at tested
      LWE dimensions 160--210, including Kyber's centered binomial law.
      Orbit-target batching and the entropy tradeoff are already explicit;
      no standardized ML-KEM solve or matched full-scale advantage is shown.
    survives: false
    reason: scaled_practical_result_without_new_structure_or_valid_scaling_bridge
  - mechanism: bkw_and_ring_bkw
    novelty_status: known
    closest_prior_art:
      - https://eprint.iacr.org/2019/183
    finding: >-
      Ring-BKW removes back-substitution and parallelizes testing only after
      obtaining samples in multiplicative cosets of subrings. Public-key
      rotations are correlated transforms, not the exponentially many fresh
      samples BKW consumes.
    survives: false
    reason: passive_sample_cap_and_restricted_sample_requirement
  - mechanism: algebraic_groebner_and_resultant
    novelty_status: known
    closest_prior_art:
      - https://eprint.iacr.org/2024/313
      - https://eprint.iacr.org/2026/688
    finding: >-
      The 2026 dual-enhanced resultant method reports 724/967/1316-bit
      Kyber estimates, improving its Gröbner comparators
      1584/1588/2014 but remaining far above lattice attacks.
    survives: false
    reason: fully_charged_exponent_is_noncompetitive
  - mechanism: robust_regression_nomod
    novelty_status: known
    closest_prior_art:
      - https://arxiv.org/abs/2510.02162
    finding: >-
      NoMod already combines reduced-vector saving, automorphism amplification,
      and Tukey-biweight regression. Its reported Kyber-like recoveries use
      binary or sparse secrets and reduced settings, not all standardized
      dense centered-binomial keys with a matched end-to-end cost.
    survives: false
    reason: secret_regime_mismatch_and_rotation_component_is_prior_art
  - mechanism: sparse_secret_hybrid_dual_2026
    novelty_status: known
    closest_prior_art:
      - https://eprint.iacr.org/2026/1060
    finding: >-
      The improved MITM hybrid dual targets sparse FHE secrets. ML-KEM's iid
      centered-binomial secret is outside the advertised favorable regime.
    survives: false
    reason: scope_mismatch
  - mechanism: claimed_polynomial_quantum_module_attack
    novelty_status: known
    closest_prior_art:
      - https://arxiv.org/abs/2605.17412
    finding: >-
      The advertised algorithm takes a module basis and outputs a generator
      of its determinant ideal. No checked reduction maps the target
      b=A s+e to s; the determinant-ideal output is unchanged when b and s
      change with A fixed. It therefore cannot certify the claimed key
      recovery as written.
    survives: false
    reason: output_invariant_is_secret_independent
  - mechanism: structured_edcp_reductions
    novelty_status: known
    closest_prior_art:
      - https://eprint.iacr.org/2026/155
    finding: >-
      The reduction/equivalence supplies no efficient structured-EDCP solver
      and therefore no ML-KEM attack cost improvement.
    survives: false
    reason: missing_solver

cost_and_baseline_implications:
  corrected_isometric_cc:
    ML-KEM-512: 139.1
    ML-KEM-768: 194.7
    ML-KEM-1024: 259.0
    source: https://eprint.iacr.org/2026/366
  li_zheng_cc:
    ML-KEM-512: 139.20
    ML-KEM-768: 194.02
    ML-KEM-1024: 259.40
    source: https://eprint.iacr.org/2026/1400
  lams_reported_bits:
    ML-KEM-512: 191
    ML-KEM-768: 282
    ML-KEM-1024: 390
    source: https://eprint.iacr.org/2026/1326
    comparison_warning: >-
      These LaMS values are not established in the same CC model and success,
      memory, and sample semantics as the rows above; no direct bit
      subtraction is admissible.
  two_bit_necessity: >-
    If baseline cost is S+U, only S is reduced by factor f, and overhead is H,
    a two-bit total gain requires S/f+U+H <= (S+U)/4. At f=4 this is
    impossible for any positive U or H. Orbit relabeling does not reduce the
    generation cost of the LaMS vector pool, so the BATCH-001 fourfold
    consumed-vector target does not meet this necessity.
  exact_symbolic_gate_cost:
    wall_clock_seconds_budgeted: 2700
    empirical_runs: 0
    maximum_memory_gb: 4
    result: completed_within_declared_nonempirical_scope
  cheapest_optional_implementation_check:
    purpose: verify_only_an_implementation_of_the_derived_cocycles
    dimensions: [8, 16]
    prime_p: 2
    core_hours: '<= 2'
    peak_memory_gb: '<= 1'
    maximum_instances: 64
    stop_rule: >-
      Stop on the first mismatch among scalar and weighted-rotation scores,
      carry recurrence, rounding cocycle, target update, or final residual.
    interpretation: >-
      Passing checks transcription and code only; it cannot revive novelty,
      establish a cost gain, or validate n=256 scaling.

ideas: []
no_survivor:
  status: no_deduplicated_falsifiable_cost_bounded_attack_direction_survives
  reason: >-
    Every screened structural mechanism is either published, restricted to a
    non-ML-KEM secret/sample regime, blocked by an unavailable invariant, or
    far above a matched lattice baseline. The LaMS-isometry candidate is
    algebraically a weighted rotated-vector/same-A reuse construction, and
    its carry and rounding cocycles add bookkeeping rather than information.
  falsification_boundary: >-
    This closes IDEA-20260722-001's claimed non-equivalent orbit statistic and
    its present two-bit path. It does not prove that every future structured,
    covariance-aware, or p-adic MLWE attack is impossible.

ranking_rationale: >-
  No proposal is ranked because none survives deduplication, ML-KEM scope,
  and full-cost screening. The highest-information action was the symbolic
  LaMS gate already completed: at zero experiment runs it proves the exact
  carry/rounding recurrence, establishes literal pool validity only for the
  fixed partition, and reduces every orbit score to weighted rotated-vector
  relabeling. Any empirical covariance or n=32 study would cost more while
  testing a mechanism that the algebra has already removed.
test_first:
  idea_id: null
  flag: false
  reason: >-
    There is no surviving idea to test. If implementation assurance is
    required, the optional n<=16 exact check is the cheapest valid
    transcription test, but it is not a research proposal or attack gate.

