  verdict:
    overall: scoped_repairs_required
    fatal_error_count: 3
    unresolved_source_limit_count: 5
    scoped_negative_count: 5
    statement: >-
      The cost-model firewall, corrected Ogilvie/Hou--Jiang table, FIPS
      interface boundary, conditional-oracle caveats, named CVE scopes, and
      absence of an inspected passive standardized solve largely survive.
      Three synthesis claims do not: the Fourier adjoint identity does not by
      itself prove computational equivalence, the oracle taxonomy collapses
      algorithm and implementation axes, and IDEA-20260722-002's end-to-end
      mutation design cannot guarantee the claimed comparison coverage.
      These defects do not establish a passive MLWE weakness.

  independent_source_inspection:
    accessed_at: '2026-07-23'
    freshness_result: >-
      No post-cutoff revision was visible for the material ePrint records
      checked below. This verifies freshness only for those records, not
      completeness of the literature search. The snapshot does not retain
      hashes of most paper PDFs, so future revisions could make the stated
      access-date text difficult to reconstruct.
    sources:
      - id: FIPS203
        url: https://csrc.nist.gov/pubs/fips/203/final
        observation: >-
          The current potential-errata sheet contains a zeta-array
          clarification and an Algorithm 15 comment correction. Neither
          changes Algorithm 18 implicit rejection or the reported failure
          rates.
      - id: LAMS-2026-1326
        url: https://eprint.iacr.org/2026/1326
        current_history: '2026-07-01 revised'
        observation: >-
          Equations 6--9 and Algorithms 1--2 support the producer's layer
          target, fixed A_dual pool reuse, and weighted score. The source's
          success theorem assumes a uniform unstructured LWE matrix and
          layer-wise rank/shortest-vector conditions; it supplies no theorem
          transferring those conditions to one block-negacyclic FIPS key.
      - id: HOU-JIANG-2026-366
        url: https://eprint.iacr.org/2026/366
        current_history: '2026-03-17 revised'
        observation: >-
          Table 1.1 supports 121.9/173.0/237.4 C0,
          139.1/194.7/259.0 CC, and 134.5/188.7/254.1 CN for the
          structure-aware rows, with a 0.3 success-probability lower bound.
          It also supports the Python XOR and Ogilvie probability-code
          corrections.
      - id: LI-ZHENG-2026-1400
        url: https://eprint.iacr.org/2026/1400
        current_history: '2026-07-12 approved'
        observation: >-
          Table 3 supports the reported model-labelled values. The paper
          explicitly says its normal wrong-score model is conservative at
          Carrier's optimal Kyber parameters, while also acknowledging that
          wrong-score tails can exceed a normal prediction. It does not
          demonstrate conservativeness at every newly selected MS-LSC
          optimum. The producer's provisional treatment is prudent, but its
          summary omits the source's claimed safety argument.
      - id: UNIFIED-DUAL-2026-1048
        url: https://eprint.iacr.org/2026/1048
        current_history: '2026-05-27 approved'
        observation: >-
          The abstract supports covariance-aware correct-score modelling and
          an extension of incorrect-score tail analysis, but does not itself
          validate the 2026/1400 parameter minima.
      - id: LDPC-2026-070
        url: https://eprint.iacr.org/2026/070
        current_history: '2026-01-20 approved'
        observation: >-
          The 2,950-query ML-KEM-768 result is a simulation under a 95%
          oracle. The Apple-M1 experiment reports 73 of 100 runs ending at
          Hamming distance at most four and averages 6,047.84 key-recovery
          measurements over those selected successes. The producer correctly
          does not relabel that physical result as unconditional exact-key
          recovery.
      - id: QRS-2026-979
        url: https://eprint.iacr.org/2026/979
        current_history: '2026-05-26 last of 5 revisions'
        observation: >-
          The quadratic sampler mechanism and 9/4/13-bit same-parameter
          deltas are source claims. The paper predates LaMS's corrected Kyber
          parameterization; no checked source supplies a corrected,
          reoptimized table.
      - id: MODULE-BKZ-2025-1904
        url: https://eprint.iacr.org/2025/1904
        current_history: '2026-02-02 revised'
        observation: >-
          For power-of-two cyclotomics the source states
          abs(Delta_K)=d^d and a d-1+o(1) blocksize loss. ML-KEM is the
          equality boundary, not an instance of the strict gain condition
          abs(Delta_K)<d^d.
      - id: CVE-2026-10097
        url: https://nvd.nist.gov/vuln/detail/CVE-2026-10097
        observation: >-
          NVD/CNA supports the 1536-of-1568 comparison, affected
          wolfSSL 5.7.0--5.9.1 AVX2 class, conditional output-confirmation
          requirement, and vendor-reported approximately 350-query,
          approximately 98-percent PoC.
      - id: WOLFSSL-PR-10430
        url: https://github.com/wolfSSL/wolfssl/pull/10430
        observation: >-
          The patch confirms the omitted final 32 bytes, but also fixes
          unrelated AVX2 5-bit decompression. A release-to-release
          differential therefore needs a comparison-isolating control.
      - id: CVE-2026-6330
        url: https://nvd.nist.gov/vuln/detail/CVE-2026-6330
        observation: >-
          NVD/CNA supports the affected wolfSSL 5.7.4--5.9.1 ARM64 NEON
          class and half-input comparison claim, but reports no key-recovery
          query count.
      - id: WOLFSSL-PR-10192
        url: https://github.com/wolfSSL/wolfssl/pull/10192
        observation: >-
          The patch folds the upper comparison half into the scalar result
          and adds an FO-rejection tamper test. It is direct prior engineering
          art for the proposed regression control, and the multi-fix PR is not
          a clean single-variable experimental contrast.

  objections:
    - id: FATAL-STRUCTURE-001
      classification: fatal_to_claim
      target: >-
        completion_gate.verdict=reduced_to_weighted_rotated_vector_relabeling
        and the claim that no non-equivalent statistic or amortization survives
      finding: >-
        Equation 25 is a correct Fourier adjoint identity, and the mutual
        information identity correctly rules out fresh samples. Neither proves
        computational equivalence. A deterministic representation can still
        reduce an algorithm's operation count, memory traffic, or preprocessing
        when candidate-dependent weights and rotated vectors share a transform.
        The report does not give a cost-preserving reduction from every
        orbit-scoring implementation to the closest Wu--Xu/Ogilvie/Hou--Jiang
        baseline, nor an operation DAG showing that its weights erase all
        reuse. The n<=16 identity test proposed by the producer only checks
        transcription and cannot decide this question.
      narrow_consequence: >-
        Fresh-information and naive digit-commutation claims are closed. The
        broader computational-equivalence claim remains unproved. The current
        fourfold vector-only target still cannot yield a full two-bit gain when
        any positive unaffected cost or overhead remains.
      cheapest_decisive_gate: >-
        Freeze one layer, one orbit-stable partition, and one candidate batch;
        build symbolic operation DAGs for ordinary LaMS, Wu--Xu rotated-vector
        reuse, and the proposed weighted orbit evaluation. Count vector
        generation, alpha_i weights, transforms, candidate phases, memory reads,
        and target updates. Stop if the orbit DAG has no strictly smaller
        charged term after common-subexpression elimination.

    - id: FATAL-ORACLE-001
      classification: fatal_to_claim
      target: clean separation of passive, conditional-oracle, and implementation evidence
      finding: >-
        The single category field mixes algorithmic access models with physical
        instantiation evidence. ORS-006 is labelled conditional_algorithmic_oracle
        while claiming a physical full-key recovery on a Cortex-M4; ORS-004
        combines an iid-oracle simulation and a bursty M1 near-key experiment
        in one row. ORS-005 and ORS-009, which also instantiate PC/DF oracles,
        are instead labelled implementation_leakage. This taxonomy allows a
        physical result and an abstract query count to appear as one evidence
        class even though the prose warns against that transfer.
      narrow_consequence: >-
        The individual metrics can survive, but the category-level synthesis
        must not be used for promotion or cross-row ranking.
      cheapest_decisive_gate: >-
        Split every assisted row into two orthogonal fields:
        backend_access_model and oracle_instantiation_evidence. Require separate
        query, trace, profile, adaptivity, device, exact-key, and protocol
        confirmation fields before reranking.

    - id: FATAL-DEFENSE-001
      classification: fatal_to_claim
      target: IDEA-20260722-002 detects every represented incomplete comparison
      finding: >-
        One end-to-end ciphertext mutation per byte or SIMD lane is not a
        complete comparison test. A mutation can alter decryption and cause
        rejection through compared bytes even when another byte is ignored;
        scalar and optimized paths can also share a defect. For CVE-2026-10097,
        PR 10430 changes both ciphertext comparison and 5-bit decompression, so
        a 5.9.1-versus-5.9.2 output difference is confounded. Existing PR 10192
        already contains an FO tamper regression, reducing novelty to a
        coverage extension.
      narrow_consequence: >-
        The defensive direction survives as an engineering regression control,
        but its universal-detection prediction and current positive-control
        design do not.
      cheapest_decisive_gate: >-
        Call each comparison primitive directly with equal-length buffers that
        differ by one bit at every position, force and attest AVX2/NEON dispatch,
        and bracket the exact comparison-fix commit. Only after that primitive
        positive control passes should one end-to-end Algorithm-18 mutation be
        used to verify integration.

    - id: SOURCE-LIMIT-001
      classification: unresolved_source_limit
      target: literature freshness and exhaustive no-solve/no-rerun statements
      finding: >-
        Access dates and repository pins are useful, but most paper PDFs have
        no retained version identifier or hash, and no query log establishes
        corpus completeness. The newest material sources are rapidly revised
        2026 preprints.
      narrow_consequence: >-
        Statements must remain "no checked source at the cutoff," never "none
        existed" or a closure of the literature.
      cheapest_decisive_gate: >-
        Record PDF SHA-256, ePrint revision date, repository commit, search
        strings, and screened-result list for every claim-moving source.

    - id: SOURCE-LIMIT-002
      classification: unresolved_source_limit
      target: Li--Zheng values as a lower-envelope candidate
      finding: >-
        The paper's conservativeness observation is tied to Carrier's Kyber
        optima and does not validate the wrong-score tail at every new MS-LSC
        optimum. Correct-score expectation experiments do not test maximum
        wrong-candidate family-wise tails.
      narrow_consequence: >-
        The values remain provisional estimates, but they are not falsified.
      cheapest_decisive_gate: >-
        At each reported minimizing parameter tuple, compare normal, conditional
        Ducas--Pulles/unified-covariance, and Monte Carlo maximum-wrong-score
        quantiles at one frozen success probability; reject any minimum whose
        normal tail is not conservative.

    - id: SOURCE-LIMIT-003
      classification: unresolved_source_limit
      target: LaMS 191/282/390 as passive standardized ML-KEM estimates
      finding: >-
        LaMS proves its layers for uniform unstructured LWE matrices. Multiplying
        a flattened block-negacyclic matrix by p^i preserves its structure, so
        "identically distributed to A_guess" in the source does not imply the
        uniform-matrix assumptions used by its rank and lattice heuristics.
        One FIPS key also fixes the sample supply.
      narrow_consequence: >-
        LaMS remains a conditional LWE mechanism and source-formula estimate;
        it is not an established end-to-end passive ML-KEM attack cost.
      cheapest_decisive_gate: >-
        Before further isometry work, prove or explicitly assume the layer-wise
        rank, determinant/shortest-vector, independence, and sample-count
        conditions for the actual flattened FIPS matrix and fixed public-key
        sample set.

    - id: SOURCE-LIMIT-004
      classification: unresolved_source_limit
      target: CVE exploitation metrics
      finding: >-
        The affected byte ranges, versions, and patches are well supported, but
        the approximately 350-query and 98-percent key-recovery figures are
        vendor/CNA-reported. No independent PoC artifact or replication was
        inspected. A remote protocol must additionally reveal valid-key versus
        rejection-key use.
      narrow_consequence: >-
        Treat the logic bugs as confirmed implementation defects and the
        exploitation figures as conditional reported evidence.
      cheapest_decisive_gate: >-
        Reproduce only primitive comparison omission and one laboratory
        valid-versus-rejection confirmation before considering query-count
        replication.

    - id: SOURCE-LIMIT-005
      classification: unresolved_source_limit
      target: IDEA-20260722-003 experiment readiness
      finding: >-
        The factor-two prediction has no named protected backend, frozen trace
        corpus, acquisition count, key/device split, decoder revisions, success
        probability, or stopping rule. It is falsifiable in principle but not
        an approved bounded experiment.
      narrow_consequence: >-
        Retain it as a conditional measurement proposal, not a ready empirical
        survivor.
      cheapest_decisive_gate: >-
        Use one existing time-ordered trace corpus with disjoint keys to freeze
        likelihood calibration and replay adapters. Stop before new acquisition
        if held-out calibration or block-bootstrap prediction already misses by
        more than twofold.

    - id: SCOPED-NEGATIVE-001
      classification: scoped_negative
      target: passive standardized ML-KEM solve status
      finding: >-
        No checked source provides an independently verifiable passive
        full-key recovery at ML-KEM-512/768/1024. All numerical passive rows
        are estimates, component tests, or scaled executions.
      boundary: inspected sources and cutoff only

    - id: SCOPED-NEGATIVE-002
      classification: scoped_negative
      target: IDEA-20260722-001 naive orbit information amplification
      finding: >-
        Negacyclic target orbits are deterministic transforms of one target;
        signed canonical digits require wrap/carry state; and entrywise
        switching contributes a public cocycle. They are not fresh samples.
      boundary: does_not_exclude_restricted_algorithm_or_implementation_savings

    - id: SCOPED-NEGATIVE-003
      classification: scoped_negative
      target: two-bit gain from a fourfold reduction of only one cost term
      finding: >-
        If total cost is S+U, only S falls by four, and U or overhead is
        positive, total cost cannot fall by four. This rejects that exact cost
        path, not larger reuse factors or a different end-to-end algorithm.
      boundary: current_factor_four_vector_only_claim

    - id: SCOPED-NEGATIVE-004
      classification: scoped_negative
      target: abstract oracle query counts as protocol attacks
      finding: >-
        FIPS 203 exports no DF/PC bit. The 2,950-query result assumes a
        memoryless 95-percent bit oracle; CVE-2026-10097 still requires
        valid-versus-rejection key confirmation. Neither is a passive or
        ideal-interface attack.
      boundary: no_claim_about_named_leaky_or_faulted_implementations

    - id: SCOPED-NEGATIVE-005
      classification: scoped_negative
      target: current CVE scope
      finding: >-
        CVE-2026-10097 and CVE-2026-6330 implicate named wolfSSL versions and
        optimized backends and are fixed in 5.9.2. They do not transfer to all
        ML-KEM implementations, protocols, or patched deployments.
      boundary: named_version_backend_and_confirmation_path_only

  required_controls:
    - id: CTRL-STRUCTURE-COST-DAG
      purpose: distinguish algebraic relabelling from computational reuse
      control: >-
        Matched operation DAGs and memory accounting for ordinary LaMS,
        Wu--Xu/Ogilvie/Hou--Jiang reuse, and weighted target-orbit evaluation.
    - id: CTRL-TAIL-FAMILYWISE
      purpose: validate Li--Zheng candidate minima
      control: >-
        Conditional and empirical maximum-wrong-score tails at each optimum,
        one success target, one estimator revision, and frozen random seeds.
    - id: CTRL-LAMS-MLWE
      purpose: prevent unstructured-LWE assumptions from silently transferring
      control: >-
        Explicit theorem or declared heuristic for block-negacyclic rank,
        shortest-vector behavior, dependencies, and passive sample cap.
    - id: CTRL-ORACLE-TWO-AXIS
      purpose: preserve passive/oracle/implementation boundaries
      control: >-
        Separate backend access model from physical instantiation evidence and
        never convert queries to traces without a measured distribution.
    - id: CTRL-LDPC-BURST
      purpose: test iid 95-percent oracle realism
      control: >-
        Time-ordered block bootstrap, shuffled-label negative, iid
        marginal-matched comparator, unconditional trial denominator, and
        exact-key verification.
    - id: CTRL-COMPARE-PRIMITIVE
      purpose: isolate the two wolfSSL comparison defects
      control: >-
        Exhaustive one-bit buffer differences, forced backend attestation,
        exact fix-commit brackets, and a separately checked scalar oracle.
    - id: CTRL-PROTOCOL-CONFIRMATION
      purpose: stop laboratory output visibility from becoming a remote oracle
      control: >-
        Name and charge the application behavior that distinguishes genuine
        from rejection keys; otherwise report no deployable PCO.
    - id: CTRL-SOURCE-FREEZE
      purpose: make rapidly revised preprints reconstructible
      control: >-
        Archive source hashes, revisions, repository commits, and search logs.

  counterexample_or_mutation:
    id: MUT-COMPARE-ONEBIT
    design: >-
      For each supported ciphertext length, initialize two equal-length buffers
      identically and flip exactly one bit at each position. Invoke the scalar,
      AVX2, and NEON comparison primitives directly while attesting dispatch.
      Run on commits immediately before and after each comparison fix, not only
      on releases. Then run one equal-length end-to-end decapsulation mutation.
    expected_discrimination:
      vulnerable_AVX2: differences in bytes 1536--1567 are missed
      vulnerable_NEON: differences represented only in the unreduced upper half are missed
      fixed_backends: every one-bit difference is detected
    why_cheapest: >-
      It is deterministic, needs no key recovery, traces, profiling, or oracle
      calibration, and isolates comparison from PR 10430's decompression fix.

  baseline_comparison:
    pollard_rho_and_bsgs: >-
      Not applicable: passive ML-KEM key recovery is an MLWE problem, not a
      generic cyclic-group discrete logarithm. Forcing Pollard-rho or BSGS into
      this comparison would be a category error. Generic exhaustive secret
      search or Grover gives only a contextual ceiling; the relevant specialized
      baselines are primal/dual lattice attacks and their declared cost models.
    passive_mlwe:
      closest_specialized_baselines:
        - >-
          Corrected isometric code-based dual:
          C0 121.9/173.0/237.4,
          CC 139.1/194.7/259.0,
          CN 134.5/188.7/254.1, at source lower-bound success 0.3.
        - >-
          Li--Zheng MS-LSC label-aligned minima are provisional until
          family-wise wrong-tail validation.
        - >-
          Progressive-primal RAM, two-dimensional memory-routing, provable
          dual, QRS, QN/Q0/GE19, and physical projections remain separate
          series.
      red_team_result: >-
        No fatal cross-model subtraction was found in the producer report.
        There is still no jointly reproduced lower envelope with common success
        probability, score law, exact CBD treatment, memory convention, and
        code revision.
    lams_isometry:
      closest_specialized_baseline: >-
        Wu--Xu rotated short vectors plus Ogilvie/Hou--Jiang same-A hybrid
        reuse, compared inside one operation model; LaMS 191/282/390 may be
        compared only to its corrected QX25 213/313/431 source family.
      red_team_result: >-
        Fresh information is falsified; computational equivalence remains open
        until the charged operation-DAG gate.
    conditional_oracles:
      closest_specialized_baseline: >-
        Channel-capacity lower bound and matched PC/DF backend at the same
        oracle distribution, followed by trace/profile/protocol costs.
      red_team_result: >-
        The 2,950-call result survives only under the iid 95-percent model.
        The M1 evidence is a separate, bursty, selected near-key result.
    implementations:
      closest_specialized_baseline: >-
        FIPS Algorithm 18 scalar reference plus exact vulnerable and fixed
        optimized primitives on named commits.
      red_team_result: >-
        The two CVE mechanisms survive for their named versions/backends.
        Query counts, remote observability, and all-library transfer do not.

  survivors_and_cheapest_gates:
    - survivor: corrected_Ogilvie_Hou_Jiang_family
      status: survives_as_model_specific_estimate
      cheapest_gate: >-
        Seed-fixed rerun of all three rows at success lower bound 0.3, then
        normalize any comparison to the same target success.
    - survivor: Li_Zheng_MS_LSC
      status: provisional
      cheapest_gate: >-
        Family-wise wrong-tail test at every reported optimum before accepting
        any lower-envelope entry.
    - survivor: LaMS_p_adic_layering
      status: conditional_unstructured_LWE_mechanism
      cheapest_gate: >-
        Prove or declare the structured-matrix and sample-cap assumptions before
        spending on orbit experiments.
    - survivor: QRS_sampling_speedup
      status: theorem_level_mechanism_with_stale_Kyber_table
      cheapest_gate: >-
        Apply the LaMS Gaussian-width correction to the fixed published
        parameters and reproduce the comparator before global reoptimization.
    - survivor: adaptive_LDPC_oracle_backend
      status: conditional_oracle_algorithm
      cheapest_gate: >-
        Replay time-ordered M1 outputs with block resampling and require
        unconditional exact-key success, not Hamming-distance-at-most-four on
        selected trials.
    - survivor: IDEA-20260722-002
      status: survives_only_as_repaired_engineering_control
      cheapest_gate: direct_one_bit_comparison_primitive_mutation
    - survivor: IDEA-20260722-003
      status: conditional_measurement_proposal_not_experiment_ready
      cheapest_gate: >-
        Frozen existing-trace preflight with held-out keys; stop before physical
        acquisition if calibration or trace-to-key prediction misses by more
        than twofold.

  narrowest_supported_statement: >-
    In the committed BATCH-002 source set, there is no verified passive
    standardized-parameter ML-KEM key recovery. Corrected structure-aware
    code-based-dual gains are at most 0.8 bit in their source model, and the
    current fourfold vector-only LaMS-isometry path cannot produce a two-bit
    end-to-end gain with positive unaffected cost. Deterministic target orbits
    add no Shannon information, but the supplied identity does not close all
    computational reuse. Conditional PC/DF algorithms and named physical or
    logic-bug recoveries remain separate from passive MLWE and from protocol
    attacks lacking an instantiated confirmation channel. The two wolfSSL
    comparison defects are credible named implementation findings; the first
    defensive idea needs a primitive-level control, and the second needs a
    frozen-trace preflight.

  scope_limits:
    - No result here changes a hypothesis, experiment, evidence, decision, or goal status.
    - Absence from the inspected source set is not an impossibility result.
    - Analytic estimates are not standardized solves or physical executions.
    - The Fourier information identity does not imply a lower bound on every restricted algorithm.
    - Query counts, ciphertexts, traces, profiles, retries, and protocol confirmations are distinct resources.
    - Near-key or selected-success physical evidence is not exact-key unconditional evidence.
    - CVE conclusions are restricted to named versions, backends, and confirmation assumptions.
    - A failed reproduction or unavailable device would be infrastructure evidence only.

  next_concrete_action: >-
    Repair IDEA-20260722-002 first: execute the direct one-bit comparison
    mutation on exact pre-fix and post-fix AVX2 and NEON commits with forced
    backend attestation, then use one equal-length Algorithm-18 mutation as the
    integration check. Stop if either vulnerable primitive is not detected.

  artifact_paths:
    - coordination/goals/GOAL-MLKEM-001/batches/BATCH-002/tasks/TASK-20260722-211/red_team_report.yaml
