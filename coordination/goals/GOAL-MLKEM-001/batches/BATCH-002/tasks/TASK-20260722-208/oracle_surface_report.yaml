  - id: ORS-025
    title: CVE-2026-10097 omitted the final ML-KEM-1024 ciphertext block
    category: implementation_leakage
    claim: >-
      wolfSSL's x64 AVX2 ML-KEM-1024 comparison checked 1,536 of 1,568 bytes.
      The CNA record reports a PoC recovering a static key with about 98%
      success using roughly 350 chosen ciphertexts, provided the caller can
      distinguish genuine from implicit-rejection shared secrets.
    oracle_model:
      name: deterministic_incomplete_re_encryption_comparison_PCO
      output: accepted_real_secret_versus_implicit_rejection_secret
      availability: affected_wolfSSL_AVX2_path_plus_output_confirmation
    affected_class: wolfSSL_5_7_0_through_5_9_1_ML-KEM-1024_x64_AVX2
    evidence_level: vendor_advisory_with_reported_PoC_full_key
    evidence_summary: Deterministic boundary bug; no timing measurement is required.
    metrics:
      compared_bytes: 1536
      required_bytes: 1568
      chosen_ciphertexts: approximately_350
      reported_success: approximately_98_percent
    resource_accounting:
      oracle_construction: >-
        Modify only ignored bytes and obtain a protocol or API confirmation that
        distinguishes the genuine shared secret from J(z || c).
      profiling: none
      traces: none
      adaptivity: chosen_ciphertexts
      device_access: decapsulation_access_under_static_key
      countermeasure_bypass: optimized_backend_skips_security_critical_bytes
      postprocessing: plaintext_checking_key_recovery
    patch_status: fixed_in_wolfSSL_5_9_2_via_PR_10430
    standardized_transfer_limit:
      transfers: This directly violates final FIPS 203 complete comparison semantics.
      does_not_transfer: Only the affected AVX2 ML-KEM-1024 versions and paths are implicated.
    sources:
      - url: https://nvd.nist.gov/vuln/detail/CVE-2026-10097
        accessed: '2026-07-22'
        primary: true
      - url: https://github.com/wolfSSL/wolfssl/releases/tag/v5.9.2-stable
        accessed: '2026-07-22'
        primary: true
    cheapest_defensive_gate:
      design: >-
        Mutate each of the final 32 ciphertext bytes and compare scalar, AVX2,
        and patched outputs with a known-secret reference.
      controls: [wolfSSL_5_9_1_AVX2_positive_control, scalar_backend, wolfSSL_5_9_2]
      pass_condition: Every mutation triggers identical implicit rejection on all patched backends.
      fail_condition: Any optimized backend returns the valid-path secret.

  - id: ORS-026
    title: CVE-2026-6330 compared only half of ARM64 NEON ciphertext input
