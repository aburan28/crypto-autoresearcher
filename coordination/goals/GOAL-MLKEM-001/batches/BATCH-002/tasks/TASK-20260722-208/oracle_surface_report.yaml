    evidence_level: simulation_plus_physical_oracle_on_multiple_devices
    evidence_summary: >-
      The work includes approximate templates, profiling-free vertical
      analysis, horizontal single-trace oracle construction, and physical-device tests.
    metrics:
      vertical_no_profile_chosen_ciphertexts_and_traces: approximately_7000
