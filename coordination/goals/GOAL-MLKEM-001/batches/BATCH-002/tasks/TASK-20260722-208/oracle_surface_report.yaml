classification_boundary:
  passive_core_mlwe:
    definition: >-
      Attacks using only the standardized encapsulation key and public
      ciphertexts, with no decapsulation, failure, leakage, fault, hint, or
      device oracle.
    conclusion: >-
      No source reviewed for this task reports a verified passive
      standardized-parameter ML-KEM key recovery. Physical observation without
      chosen inputs is still implementation leakage, not passive core-MLWE.
  conditional_algorithmic_oracle:
    definition: >-
      A mathematical key-recovery procedure evaluated under a stated PC, DF,
      inequality, or soft-information oracle. Its query count is not an
      end-to-end attack cost until oracle construction and repeated
      measurements are charged.
    conclusion: >-
      Adaptive coding and soft-information work materially reduce conditional
      query complexity, but do not create the oracle exposed by neither FIPS
      203 nor ideal MLWE.
  implementation_leakage:
    definition: >-
      Timing, cache/DMP, DVFS, power, EM, fault, masking-composition, or logic
      behavior tied to a concrete software, hardware, compiler, microarchitecture,
      or protocol confirmation path.
    conclusion: >-
      Several laboratory attacks recover keys or instantiate high-quality
      oracles on tested implementations. None establishes that every protected
      conforming FIPS 203 implementation has the same channel.

fips_203_anchor:
  parameter_sets: [ML-KEM-512, ML-KEM-768, ML-KEM-1024]
  honest_decapsulation_failure_rates:
    ML-KEM-512: '2^-138.8'
    ML-KEM-768: '2^-164.8'
    ML-KEM-1024: '2^-174.8'
  rejection_semantics: >-
    ML-KEM.Decaps_internal re-encrypts and compares the complete ciphertext.
    On mismatch it substitutes J(z || c) and still returns a 256-bit value; it
    does not return a failure symbol.
  transfer_rule: >-
    The K-PKE ring and module parameters largely preserve arithmetic attack
    relevance from round-three Kyber, but final ML-KEM is not byte-for-byte
    Kyber. Claims involving hashes, KDF inputs, input checks, internal
    interfaces, malformed ciphertexts, or code paths require a final-FIPS
    reproduction.
  round_three_differences_material_here:
    - Final ML-KEM derives the shared secret without the round-three hash of the ciphertext.
    - Initial encapsulation randomness is no longer pre-hashed.
    - The shared secret length is fixed at 256 bits.
    - Explicit input checks and key-generation domain separation were added.
    - The final standard corrected matrix indexing from the initial public draft.
  correction_to_common_misstatement: >-
    FIPS 203 includes ML-KEM-512, ML-KEM-768, and ML-KEM-1024. Round-three
    Kyber already used implicit rejection; FIPS 203 changes its exact derivation
    but does not newly replace an explicit failure return.
  source:
    url: https://nvlpubs.nist.gov/nistpubs/fips/nist.fips.203.pdf
    accessed: '2026-07-22'
    primary: true

evidence_levels:
  standard_specification: normative algorithm or parameter statement
  theoretical_estimate: analytic cost without end-to-end physical execution
  simulation: synthetic leakage or oracle experiment
  physical_oracle: measured oracle quality without complete key recovery
  physical_partial_key: measured recovery of only part of a key or near-key
  physical_full_key: end-to-end laboratory recovery on the stated target
  vendor_advisory: vendor or CNA record, with only the reproduction stated there

material_results:
  - id: ORS-001
    title: FIPS 203 exposes no decapsulation-failure bit
    category: standard_boundary
    claim: >-
      Honest ML-KEM failures are defined, but a conforming decapsulation call
      returns a 256-bit value in both match and mismatch cases. A DF or PC bit
      therefore requires an additional observation channel.
    oracle_model:
      name: none_in_ideal_interface
      output: 256-bit shared secret only
      availability: absent
    affected_class: all_conforming_FIPS_203_implementations
    evidence_level: standard_specification
    evidence_summary: >-
      Algorithm 18 performs complete re-encryption comparison and implicit
      rejection; Table 1 gives the three honest-failure rates.
    metrics:
      honest_failure_probability:
        ML-KEM-512: '2^-138.8'
        ML-KEM-768: '2^-164.8'
        ML-KEM-1024: '2^-174.8'
    resource_accounting:
      oracle_construction: not_provided_by_standard
      profiling: none
      traces: none
      adaptivity: none
      device_access: ordinary_KEM_interface_only
      countermeasure_bypass: none
      postprocessing: none
    patch_status: normative_final_standard_with_potential_errata_spreadsheet
    standardized_transfer_limit:
      transfers: This is the final standardized behavior.
      does_not_transfer: >-
        It does not prove constant-time, power-safe, fault-safe, or
        microarchitecturally silent execution.
    sources:
      - url: https://nvlpubs.nist.gov/nistpubs/fips/nist.fips.203.pdf
        accessed: '2026-07-22'
        primary: true
      - url: https://csrc.nist.gov/pubs/fips/203/final
        accessed: '2026-07-22'
        primary: true
    cheapest_defensive_gate:
      design: >-
        For each backend, mutate each ciphertext byte and verify output against
        a scalar Algorithm-18 oracle while checking that no failure status is
        exported.
      controls: [valid_ciphertexts, malformed_lengths, scalar_reference_backend]
      pass_condition: Complete output agreement with the reference for every test.
      fail_condition: Any accepted mismatch, truncated comparison, or distinct failure return.

  - id: ORS-002
    title: Multitarget failure boosting is not a practical Kyber break
    category: conditional_algorithmic_oracle
    claim: >-
      Multitarget failure boosting gives explicit theoretical work/query
      estimates for round-three Kyber, but under the paper's constrained model
      none of the Kyber parameter sets is declared vulnerable relative to its
      comparator, and real execution remains dominated by enormous target,
      online-query, and precomputation assumptions.
    oracle_model:
      name: observable_honest_decryption_failure
      output: one failure/success bit per decapsulation
      availability: assumed_after_failure_boosting_not_exposed_by_KEM
    affected_class: round_three_Kyber_parameter_distributions_with_many_static_targets
    evidence_level: theoretical_estimate
    evidence_summary: >-
      The source evaluates qlimit=2^64 per target, up to 2^64 targets, finite
      message spaces, and depth limits. Its Kyber table entries remain
      model-specific estimates, not executions or standardized-interface
      oracles; the paper's conclusion does not classify a Kyber parameter set
      as broken by the developed attack under its stated constraints.
    metrics:
      target_count_max: '2^64'
      decapsulation_query_limit_per_target: '2^64'
      maximum_search_depth_considered: '2^96'
      cost_unit_warning: W_is_offline_encapsulation_and_Q_is_online_decapsulation
    resource_accounting:
      oracle_construction: >-
        Must expose whether the honest K-PKE message differs; final implicit
        rejection hides this unless a protocol or leakage channel distinguishes it.
      profiling: none_in_cost_model
      traces: not_modeled
      adaptivity: follow-up failures and target allocation are adaptive
      device_access: up_to_exponential_online_queries_across_exponential_targets
      countermeasure_bypass: not_modeled
      postprocessing: failure_boosting_precomputation_and_key_recovery
    patch_status: design_analysis_not_a_patchable_single_bug
    standardized_transfer_limit:
      transfers: K-PKE parameter distributions and final FIPS failure rates are closely related.
      does_not_transfer: >-
        The paper analyzes round-three Kyber and assumes a visible failure bit;
        final FIPS 203 exposes neither that bit nor the paper's huge target pool.
    sources:
      - url: https://eprint.iacr.org/2021/193
        accessed: '2026-07-22'
        primary: true
    cheapest_defensive_gate:
      design: >-
        Instrument a local reference only to measure the boosted conditional
        failure probability, then compare it with the paper's estimator; do not
        expose the instrumentation in a deployed API.
      controls: [unboosted_valid_ciphertexts, independent_keys, exact_FIPS_parameters]
      pass_condition: Estimator and measured toy or moderate-scale rates agree within predeclared intervals.
      fail_condition: The boosted rate or cost accounting fails reproduction.

  - id: ORS-003
    title: Error-tolerant inequality recovery is a reusable implementation-attack backend
    category: conditional_algorithmic_oracle
    claim: >-
      Belief propagation followed by lattice reduction can recover Kyber512
      keys from noisy decryption-error inequalities, with about 5,500 filtered
      or 9,000 unfiltered correct inequalities in the reported setting.
    oracle_model:
      name: signed_decryption_error_inequality
      output: inequality plus an estimated correctness probability
      availability: requires_fault_or_side_channel_observation
    affected_class: Kyber512_fault_or_leakage_sources_that_yield_matching_inequalities
    evidence_level: simulation_plus_fault_attack_demonstration
    evidence_summary: >-
      The source combines statistical and algebraic recovery, models incorrect
      inequalities, and demonstrates the backend with fault-induced errors.
    metrics:
      filtered_inequalities: 5500
      unfiltered_inequalities: 9000
      information_theoretic_uniqueness_reference: just_over_2900
    resource_accounting:
      oracle_construction: one usable inequality per qualifying faulty_or_leaky decapsulation
      profiling: correctness_probabilities_must_be_calibrated
      traces: at_least_one_observation_per_candidate_inequality
      adaptivity: ciphertext_selection_and_optional_filtering
      device_access: thousands_of_faulted_or_observed_decapsulations
      countermeasure_bypass: depends_on_upstream_fault_or_leakage_source
      postprocessing: belief_propagation_plus_lattice_reduction
    patch_status: backend_remains_applicable_wherever_matching_inequalities_leak
    standardized_transfer_limit:
      transfers: Secret distribution and K-PKE arithmetic map closely to ML-KEM-512.
      does_not_transfer: >-
        FIPS 203 does not supply inequalities; each concrete leakage or fault
        source and final code path must be demonstrated separately.
    sources:
      - url: https://eprint.iacr.org/2023/098
        accessed: '2026-07-22'
        primary: true
    cheapest_defensive_gate:
      design: >-
        Feed held-out synthetic inequalities with a swept error rate into the
        published recovery code before any physical campaign.
      controls: [random_wrong_inequalities, perfect_inequalities, no_side_information]
      pass_condition: Recovery threshold reproduces within a predeclared tolerance.
      fail_condition: Reported thresholds or error tolerance do not reproduce.

  - id: ORS-004
    title: Adaptive-LDPC sharply lowers conditional DF-oracle queries
    category: conditional_algorithmic_oracle
    claim: >-
      For ML-KEM-768 and an independently correct 95% one-bit DF oracle, the
      adaptive-LDPC simulation reports full recovery in 2,950 queries, 1.35
      times its Shannon lower bound. The same work materially improves a
      concrete GoFetch oracle but does not remove its calibration and
      co-location assumptions.
    oracle_model:
      name: imperfect_one_bit_decryption_failure
      output: success/failure bit with stated independent accuracy
      availability: assumed_in_algorithmic_table_and_instantiated_separately_with_DMP
    affected_class: ML-KEM-512_and_768_oracles_with_balanced_multi_coefficient_queries
    evidence_level: simulation_plus_physical_partial_or_near_key_GoFetch
    evidence_summary: >-
      The simulation gives 2,400 calls for ML-KEM-512 and 2,950 for ML-KEM-768
      at 95% accuracy. On Apple M1, 73 of 100 ML-KEM-512 trials ended within
      Hamming distance four, averaging 6,047.84 key-recovery traces and about
      25 minutes including calibration; the profile used 1,000 timing measurements.
    metrics:
      ML-KEM-512_queries_at_95_percent: 2400
      ML-KEM-768_queries_at_95_percent: 2950
      ML-KEM-768_ratio_to_Shannon_bound: 1.35
      GoFetch_M1_profile_measurements: 1000
      GoFetch_M1_success_definition: Hamming_distance_at_most_4
      GoFetch_M1_success_trials: '73 / 100'
      GoFetch_M1_mean_key_recovery_traces_on_successes: 6047.84
      GoFetch_M1_elapsed: approximately_25_minutes
    resource_accounting:
      oracle_construction: DMP_pointer_predicate_plus_Prime_Probe
      profiling: eviction_sets_compound_eviction_sets_and_1000_timing_measurements
      traces: about_6048_average_on_reported_successful_ML-KEM-512_trials
      adaptivity: yes_queries_depend_on_LDPC_posterior
      device_access: unprivileged_co_located_process_and_high_resolution_timer
      countermeasure_bypass: none_if_DMP_is_disabled_or_non_DMP_core_is_used
      postprocessing: belief_propagation_no_large_final_lattice_reduction_in_followup
    patch_status: DMP_disable_or_core_restriction_mitigates_the_concrete_oracle
    standardized_transfer_limit:
      transfers: Paper targets final ML-KEM parameter sets and final-style decapsulation arithmetic.
      does_not_transfer: >-
        The 2,950 figure is conditional on a memoryless 95% oracle. The Apple
        experiment has burst errors, platform-specific calibration, and no
        protected final-FIPS backend.
    sources:
      - url: https://eprint.iacr.org/2026/070
        accessed: '2026-07-22'
        primary: true
    cheapest_defensive_gate:
      design: >-
        Replay recorded oracle outputs with block-resampling to preserve burst
        errors and compare recovery with the independent-noise simulation.
      controls: [iid_bit_flip_oracle, burst_noise_oracle, shuffled_labels]
      pass_condition: Held-out recovery and trace quantiles match the declared noise model.
      fail_condition: Gains vanish under measured burst dependence or label shuffling.

  - id: ORS-005
    title: FO re-encryption leakage can instantiate plaintext checking
    category: implementation_leakage
    claim: >-
      Power or EM leakage from re-encryption and its hash/PRF work can reveal
      whether a chosen ciphertext decrypts to a reference message, even when
      the underlying PKE decryption itself is not the leakage target.
    oracle_model:
      name: binary_plaintext_checking
      output: whether_decrypted_message_matches_reference
      availability: derived_from_re_encryption_leakage
    affected_class: FO_transformed_KEM_implementations_with_distinguishable_re_encryption
    evidence_level: physical_oracle
    evidence_summary: >-
      Foundational work demonstrated EM classification on Kyber's FO path and
      later generalized power/EM construction through PRF or PRG leakage.
    metrics:
      output_information_per_call: at_most_one_bit_for_binary_PCO
      full_key_queries: source_family_reports_thousands_for_early_binary_attacks
    resource_accounting:
      oracle_construction: side_channel_classifier_for_two_reference_messages
      profiling: templates_or_points_of_interest_in_reported_instantiations
      traces: one_or_more_per_chosen_ciphertext_depending_on_noise
      adaptivity: yes_for_coefficient_recovery
      device_access: physical_power_or_EM_measurement
      countermeasure_bypass: re_encryption_and_symmetric_primitives_must_also_be_protected
      postprocessing: decision_tree_or_oracle_key_recovery
    patch_status: no_universal_patch_mask_or_harden_complete_decapsulation_path
    standardized_transfer_limit:
      transfers: Final FIPS 203 retains decrypt, hash, re-encrypt, and compare structure.
      does_not_transfer: >-
        Exact round-three KDF inputs differ, and leakage depends on the final
        hash, compiler, masking, and hardware implementation.
    sources:
      - url: https://eprint.iacr.org/2019/948
        accessed: '2026-07-22'
        primary: true
      - url: https://eprint.iacr.org/2021/849
        accessed: '2026-07-22'
        primary: true
    cheapest_defensive_gate:
      design: >-
        Run fixed-versus-random and two-message leakage tests over the complete
        final-FIPS decapsulation, including hashes and comparison.
      controls: [same_ciphertext_repetitions, randomized_messages, masked_and_unmasked_builds]
      pass_condition: No held-out classifier exceeds the predeclared advantage bound.
      fail_condition: A held-out classifier distinguishes the PC classes above that bound.

  - id: ORS-006
    title: Parallel PC oracles exchange offline templates for fewer target queries
    category: conditional_algorithmic_oracle
    claim: >-
      On unprotected pqm4 Kyber768, a P=10 classifier recovered the key and the
      source estimates 232 target queries with a clone device, versus 1,776 for
      its binary baseline; without a clone, template acquisition raises the
      measured P=4 total to 613 queries at five traces per class.
    oracle_model:
      name: multi_class_parallel_plaintext_checking
      output: P_message_bits_or_one_of_2^P_classes
      availability: profiled_side_channel_classifier
    affected_class: unprotected_or_lightly_shuffled_Kyber768_pqm4_on_Cortex_M4
    evidence_level: physical_full_key
    evidence_summary: >-
      The experiment classified 1,024 classes at P=10 with 100% reported
      success and used five traces for each of 1,024 classes (5,120 template
      traces); query tables make clone-device
      and no-clone costs explicit.
    metrics:
      binary_baseline_queries_Kyber768: 1776
      P10_target_queries_with_clone: 232
      P10_template_traces: 5120
      no_clone_P4_queries_at_five_templates_per_class: 613
      full_key_success_reported: 100_percent
    resource_accounting:
      oracle_construction: 2^P_class_templates
      profiling: clone_device_or_online_template_acquisition
      traces: 5120_template_traces_for_reported_P10_experiment_plus_attack_traces
      adaptivity: decision_tree_queries
      device_access: chosen_ciphertexts_and_power_or_EM_acquisition
      countermeasure_bypass: demonstrated_against_low_cost_shuffling_not_masking
      postprocessing: multi_class_tournament_and_coefficient_assembly
    patch_status: masking_recommended_but_not_established_sufficient
    standardized_transfer_limit:
      transfers: Parallel chosen-ciphertext logic applies to the same ML-KEM coefficient distributions.
      does_not_transfer: >-
        The measured target was pre-standard unprotected pqm4 Kyber768; exact
        final code, masks, noise, and template portability were not established.
    sources:
      - url: https://eprint.iacr.org/2022/931
        accessed: '2026-07-22'
        primary: true
    cheapest_defensive_gate:
      design: >-
        Re-run only the held-out message-class classifier on the production
        backend, charging templates separately from attack traces.
      controls: [clone_and_no_clone, shuffled_labels, different_device_holdout]
      pass_condition: Class advantage remains below the implementation's leakage budget.
      fail_condition: P-way held-out classification supports the published query tradeoff.

  - id: ORS-007
    title: Soft-analytic PC attacks remain effective for imperfect oracles
    category: conditional_algorithmic_oracle
    claim: >-
      Soft posterior updates substantially reduce the cost of noisy PC attacks;
      the source reports, for ML-KEM-1024 with eight positions in parallel,
      1,529.6 queries at tournament parameter alpha=0.5, 944.64 at 0.7, and
      706.56 at 0.9.
    oracle_model:
      name: soft_probabilistic_parallel_plaintext_checking
      output: probability_distribution_over_message_classes
      availability: abstract_or_noisy_Hamming_weight_instantiations
    affected_class: ML-KEM_implementations_with_even_weak_re_encryption_leakage
    evidence_level: simulation
    evidence_summary: >-
      The paper evaluates abstract tournament and noisy Hamming-weight oracles,
      masking orders, and open-source solvers; these are not physical
      end-to-end key recoveries for every model.
    metrics:
      ML-KEM-1024_queries_alpha_0_5: 1529.6
      ML-KEM-1024_queries_alpha_0_7: 944.64
      ML-KEM-1024_queries_alpha_0_9: 706.56
      first_order_masked_single_intermediate_example: under_270000_traces_at_sigma_1_0
    resource_accounting:
      oracle_construction: noisy_Hamming_weight_or_other_side_channel_scores
      profiling: score_likelihoods_or_calibrated_class_probabilities
      traces: model_dependent_and_can_greatly_exceed_query_count
      adaptivity: posterior_driven_query_selection
      device_access: chosen_ciphertexts_plus_leakage_measurement
      countermeasure_bypass: masking_is_included_only_through_stated_leakage_models
      postprocessing: joint_distribution_or_BP_or_marginal_approximation
    patch_status: algorithmic_backend_not_patch_specific
    standardized_transfer_limit:
      transfers: The paper directly parameterizes standardized ML-KEM.
      does_not_transfer: >-
        Abstract alpha or sigma does not establish the same distributions on a
        concrete masked final-FIPS device; profiling and calibration are charged.
    sources:
      - url: https://eprint.iacr.org/2025/1496
        accessed: '2026-07-22'
        primary: true
      - url: https://github.com/juliusjh/sasca_imperfect_pc_oracles
        accessed: '2026-07-22'
        primary: true
    cheapest_defensive_gate:
      design: >-
        Replace synthetic likelihoods with held-out traces from one protected
        backend and test calibration error before running key recovery.
      controls: [hard_decisions, intentionally_miscalibrated_scores, shuffled_scores]
      pass_condition: Soft scores remain calibrated and do not support recovery within the trace budget.
      fail_condition: Calibrated soft recovery reproduces within the declared budget.

  - id: ORS-008
    title: Sequential testing reduces noisy-oracle repetition but increases online adaptivity
    category: conditional_algorithmic_oracle
    claim: >-
      SPRT-based handling of noisy PCO responses reduces repeated oracle calls
      by a reported factor of two to three relative to majority or fixed-length
      likelihood tests in the evaluated simulations.
    oracle_model:
      name: repeated_noisy_plaintext_checking_with_scores
      output: sequential_likelihood_samples
      availability: requires_repeatable_side_channel_measurements
    affected_class: noisy_ML-KEM_PCO_implementations
    evidence_level: simulation
    evidence_summary: The result is an early-abort wrapper, not a new physical oracle.
    metrics:
      repeated_query_reduction: '2x to 3x'
    resource_accounting:
      oracle_construction: unchanged_from_underlying_PCO
      profiling: response_distributions_and_error_targets
      traces: sequential_random_count_per_query
      adaptivity: strictly_online_stopping_decisions
      device_access: repeated_decapsulations_until_each_decision_stops
      countermeasure_bypass: none_beyond_underlying_PCO
      postprocessing: low
    patch_status: algorithmic_backend_not_patch_specific
    standardized_transfer_limit:
      transfers: Statistical wrapper is agnostic to the final ML-KEM arithmetic.
      does_not_transfer: >-
        The gain depends on stationary, calibrated score distributions and does
        not remove device, leakage, or online-access costs.
    sources:
      - url: https://eprint.iacr.org/2025/2045
        accessed: '2026-07-22'
        primary: true
    cheapest_defensive_gate:
      design: Replay time-ordered traces to compare SPRT with fixed repetition under drift.
      controls: [randomized_order, injected_drift, fixed_length_test]
      pass_condition: No reduction survives measured nonstationarity at matched error.
      fail_condition: The two-to-threefold reduction reproduces at matched error.

