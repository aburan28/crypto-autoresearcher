  - id: ORS-010
    title: Masked Keccak can dominate FO plaintext-checking leakage
    category: implementation_leakage
    claim: >-
      Profiled attacks against three masked Keccak software implementations on
      Cortex-M4 obtain high-accuracy PCOs through seven shares; for the
      strongest reported seven-share DOM case, a 90% distinguisher uses leakage
      from 104 Keccak rounds, corresponding to about 50 ML-KEM executions.
    oracle_model:
      name: soft_plaintext_checking_from_masked_Keccak
