    sources:
      - url: https://eprint.iacr.org/2024/060
        accessed: '2026-07-22'
        primary: true
      - url: https://eprint.iacr.org/2021/104
        accessed: '2026-07-22'
        primary: true
    cheapest_defensive_gate:
