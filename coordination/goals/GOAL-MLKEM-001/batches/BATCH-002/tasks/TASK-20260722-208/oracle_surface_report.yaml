synthesis:
  strongest_conditional_algorithmic_result: >-
    ORS-004: 2,950 ML-KEM-768 queries at a stipulated 95% DF oracle, but the
    oracle's measurement cost remains separate and can be millions of traces
    under much noisier leakage.
  strongest_direct_logic_bug_result: >-
    ORS-025: about 350 chosen ciphertexts in the reported PoC, but only for a
    specific unpatched wolfSSL AVX2 ML-KEM-1024 path and a distinguishable
    valid-versus-rejection output.
  broadest_physical_lesson: >-
    Protecting only decryption or only timing is insufficient. Re-encryption,
    Keccak, comparison, arithmetic representations, masking conversions,
    microarchitectural features, and fault integrity all participate in the
    effective oracle surface.
  no_breakthrough_conclusion: >-
    No reviewed assisted result is evidence that passive core MLWE is easier,
    and no pre-standard physical result transfers automatically to every
    protected FIPS 203 implementation.

defensive_research_directions:
  - idea:
      id: IDEA-20260722-002
      title: Cross-backend negative-ciphertext conformance matrix
      class: control
      claim: >-
        For a selected ML-KEM library, a backend-differential suite that mutates
        every ciphertext byte and vector lane will detect every incomplete
        re-encryption comparison represented by CVE-2026-10097 and
        CVE-2026-6330 while producing zero scalar-versus-optimized output
        disagreements on patched releases across all three FIPS 203 parameter sets.
      mechanism: >-
        Security-critical comparison bugs are functionally silent on valid KATs
        but become deterministic output differences on malformed ciphertexts.
        A scalar Algorithm-18 oracle plus structured negative tests turns the
        omitted work into an observable conformance failure.
      novelty_status: adaptation
      assumptions:
        - A scalar backend is independently checked against FIPS 203.
        - Tests can observe shared-secret bytes in a laboratory harness.
        - Every optimized backend and runtime dispatch path can be forced.
      predictions:
        - metric: vulnerable_positive_control_detection_rate
          direction: higher
          minimum_effect: 1.0
        - metric: patched_backend_output_disagreements
          direction: lower
          minimum_effect: 0
        - metric: ciphertext_byte_and_lane_coverage
          direction: higher
          minimum_effect: 1.0
      minimal_test:
        design: >-
          Run scalar, AVX2, and NEON backends on valid ciphertexts and on one
          mutation per byte and SIMD lane for ML-KEM-512/768/1024. Include the
          two vulnerable wolfSSL releases as positive controls and 5.9.2 as the
          patched control. Compare exact outputs to the scalar FIPS oracle.
        controls:
          - Valid known-answer tests.
          - CVE-2026-10097 vulnerable AVX2 path.
          - CVE-2026-6330 vulnerable NEON path.
          - Patched wolfSSL 5.9.2 and scalar reference.
        required_metrics:
          - backend_dispatch_path
          - mutated_byte_and_lane
          - exact_shared_secret_agreement
          - implicit_rejection_agreement
          - coverage
        competing_explanations:
          - id: suite_is_discriminating
            meaning: Vulnerable controls fail and patched backends agree.
          - id: generator_is_inadequate
            meaning: A vulnerable control passes, so mutation coverage is not security-relevant.
          - id: residual_backend_bug
            meaning: Vulnerable controls fail but a patched backend disagrees.
      falsification_conditions:
        - Either known vulnerable positive control is not detected.
        - A claimed full-coverage backend or vector lane cannot be forced.
        - The scalar reference disagrees with FIPS 203 on an independent vector.
      confounders:
        - Runtime dispatch silently selecting the scalar backend.
        - Comparing only return codes rather than shared-secret bytes.
        - Treating malformed-length rejection as equivalent to equal-length implicit rejection.
        - Compiler dead-code elimination in the test harness.
      interpretation_limits:
        - Passing addresses deterministic functional comparison omissions only.
        - It does not establish timing, power, EM, cache, or fault resistance.
        - It does not approve a release or change official research state.
      estimated_cost:
        implementation: low
        compute: low
      recommended_priority: high
      novelty_screen:
        local_corpus:
          checked: [knowledge/, ledger/hypotheses/, ledger/proposals/]
          exact_duplicate_found: false
        primary_literature:
          checked_through: '2026-07-22'
          closest_prior_art:
            - https://eprint.iacr.org/2025/450
            - https://nvlpubs.nist.gov/nistpubs/fips/nist.fips.203.pdf
            - https://nvd.nist.gov/vuln/detail/CVE-2026-10097
            - https://nvd.nist.gov/vuln/detail/CVE-2026-6330
          classification_reason: >-
            Negative and verifiable decapsulation testing is known; the proposal
            adapts it into a backend- and lane-complete regression control.

  - idea:
      id: IDEA-20260722-003
      title: End-to-end soft-oracle leakage budget
      class: measurement
      claim: >-
        For at least one protected Cortex-M4 ML-KEM implementation, a
        held-out soft-information model that charges profiling and repeated
        executions will predict median traces-to-key-recovery within a factor
        of two across three noise or masking configurations, while a hard
        oracle-accuracy-only model will miss by more than a factor of two on at
        least one configuration.
      mechanism: >-
        Hard accuracy discards score confidence, correlation, burst errors, and
        profiling cost. Calibrated likelihoods combined with current soft-PC
        and adaptive-LDPC backends should map physical leakage to end-to-end
        trace risk more faithfully, unless model mismatch or nonstationarity dominates.
      novelty_status: adaptation
      assumptions:
        - A laboratory-only protected ML-KEM implementation and traces are available.
        - The published attack backends can consume calibrated likelihoods.
        - Training keys, attack keys, and devices can be held out.
      predictions:
        - metric: soft_model_trace_prediction_multiplicative_error
          direction: lower
          minimum_effect: at_most_2
        - metric: hard_accuracy_trace_prediction_multiplicative_error
          direction: higher
          minimum_effect: greater_than_2_for_at_least_one_configuration
        - metric: total_cost_including_profiling_and_retries
          direction: different
          minimum_effect: changes_the_ranking_of_at_least_one_pair
      minimal_test:
        design: >-
          Use three predeclared leakage configurations on one Cortex-M4
          implementation. Train on disjoint keys, freeze calibration and attack
          parameters, then predict and measure the median trace count on held-out
          keys. Compare hard accuracy, soft likelihoods, and a burst-aware model.
        controls:
          - Shuffled labels.
          - IID synthetic bit-flip oracle at matched marginal accuracy.
          - Time-ordered replay preserving burst errors.
          - Same-key versus held-out-key calibration.
        required_metrics:
          - calibration_error
          - mutual_information_per_execution
          - oracle_queries
          - physical_traces
          - profiling_traces
          - retries
          - wall_clock
          - key_recovery_success_interval
        competing_explanations:
          - id: soft_information_is_predictive
            meaning: Held-out trace counts fall within the factor-two interval.
          - id: nonstationary_or_correlated_leakage_dominates
            meaning: IID soft scores fail but burst-aware replay predicts recovery.
          - id: attack_backend_mismatch
            meaning: No calibrated model predicts held-out recovery.
      falsification_conditions:
        - Soft prediction misses by more than twofold in two or more configurations.
        - Hard accuracy is equally predictive for all configurations.
        - Results depend on training and attacking the same keys or device traces.
      confounders:
        - Treating one oracle query as one physical execution.
        - Omitting template acquisition and failed retries.
        - Calibration drift, autocorrelation, and operating-system bursts.
        - Selecting the best decoder after viewing held-out results.
        - Comparing attack backends at different success probabilities.
      interpretation_limits:
        - Passing validates only the tested device, code, protections, and budgets.
        - It is a defensive evaluation metric, not evidence of passive MLWE weakness.
        - It does not establish a universal leakage threshold.
      estimated_cost:
        implementation: medium
        compute: medium
      recommended_priority: medium
      novelty_screen:
        local_corpus:
          checked: [knowledge/, ledger/hypotheses/, ledger/proposals/]
          exact_duplicate_found: false
        primary_literature:
          checked_through: '2026-07-22'
          closest_prior_art:
            - https://eprint.iacr.org/2025/1496
            - https://eprint.iacr.org/2025/2045
            - https://eprint.iacr.org/2026/070
            - https://eprint.iacr.org/2026/777
          classification_reason: >-
            Soft PCOs, sequential testing, LDPC exploitation, and masked Keccak
            measurements are known. The proposal is a defensive integration and
            validation study, not a claimed novel attack.

ranking_rationale: >-
  IDEA-20260722-002 ranks first because it directly targets two observed
  standardized-implementation failure modes with deterministic positive
  controls, requires no physical acquisition, and can fail cheaply. IDEA-20260722-003
  has higher potential information gain about protected-device residual risk,
  but its profiling, held-out acquisition, calibration, and decoder integration
  make it materially more expensive and easier to confound.
test_first:
  idea_id: IDEA-20260722-002
  flag: true
  reason: >-
    The byte-and-lane mutation matrix is the cheapest valid discriminator:
    vulnerable releases must fail, patched backends must agree, and either
    outcome is actionable without constructing an exploitation path.

scope_limits:
  - No operational instructions for attacking deployed systems are provided.
  - Query and trace figures are retained in each source's model and are not interchangeable.
  - A timeout, failed reproduction, or unavailable device would be infrastructure outcome only.
  - Patch status is version- and backend-specific; absence of a published patch is not proof of present vulnerability.
  - This report changes no hypothesis, experiment, evidence, or goal status.

archival_provenance:
  archived_by: TASK-20260722-209
  status: awaiting_coordinator_snapshot
