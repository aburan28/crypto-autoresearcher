carry_aware_derivation_assessment:
  verdict: supported_with_explicit_preconditions
  reconstructed_invariants:
    - "b_i = b - A_G*c_i = B_i*t_i + A_D*s_D + e (mod q), B_i = p^i*A_G."
    - "For y=[Sx]_q=Sx+q*omega, c_i'=(S*c_i+q*omega) mod p^i."
    - "kappa_i=(S*c_i+q*omega-c_i')/p^i and t_i'=S*t_i+kappa_i."
    - "d_i'=(S*d_i+kappa_i) mod p; the zero branch has omega=0."
    - "If J*A_G=A_G*S_G, then b_i'=J*b_i+B_i*kappa_i (mod q)."
    - "R_p(q-x)=q-q/p-R_p(x) and Delta_p(q-x)=q/p-Delta_p(x) for x!=0."
    - "C_i=J*Bhat_i-Bhat_i*S_G=Delta_i*S_G-J*Delta_i (mod q)."
    - "x_i'(a')=J*x_i(a)+Delta_i*kappa_i+C_i*a (mod q)."
    - >-
      G_Z,i(J*b-u) is exactly the original-target Fourier score with vectors
      J^T*z and known candidate/layer weights.
  partition_verdict:
    fixed: >-
      A_G, A_D and the literal Z subset remain unchanged, but orbit elements
      address signed/permuted original coordinates.
    aligned: >-
      The coordinate partition rotates; the vector pool must rotate with the
      corresponding dual lattice unless the partition is orbit-stable.
  information_verdict: >-
    Orbit targets are deterministic invertible transforms of b, so they add no
    Shannon information. Carries and rounding are known cocycles, not a new
    sample source.
  prior_art_verdict: >-
    The score reduction is the weighted adjoint version of Wu--Xu rotated
    vectors together with Ogilvie/Hou--Jiang same-A coverage reuse.
  limit: >-
    This algebra does not exclude a future restricted-algorithm implementation
    saving, a different statistic, or a new p-adic/module attack. Any such
    claim still requires a matched full-cost comparator.

fips_203_oracle_assessment:
  verdict: supported
  normative_facts:
    parameter_sets: [ML-KEM-512, ML-KEM-768, ML-KEM-1024]
    honest_failure_rates:
      ML-KEM-512: '2^-138.8'
      ML-KEM-768: '2^-164.8'
      ML-KEM-1024: '2^-174.8'
    algorithm: ML-KEM.Decaps_internal Algorithm 18
    behavior: >-
      Decrypt, derive coins, re-encrypt, compare the complete equal-length
      ciphertext, compute J(z||c), select the rejection key on mismatch, and
      return a 256-bit shared secret in either path.
  separation:
    passive_core_MLWE: public key and public data only
    conditional_oracle_algorithm: assumes a DF, PC, inequality, or soft-information channel
    implementation_attack: constructs that channel from named code, hardware, leakage, or faults
  conclusion: >-
    An honest decapsulation-failure probability is not a public failure bit.
    Query counts under a stipulated oracle are not end-to-end attack costs, and
    laboratory implementation recoveries are not evidence that passive MLWE is
    easier.
  final_standard_transfer_rule: >-
    Arithmetic relevance can transfer from Kyber, but hash/KDF inputs, input
    checking, comparison length, backend dispatch, and leakage require
    final-FIPS reproduction.

material_claim_assessments:
  - claim: The six producer artifacts are immutable review inputs.
    verdict: supported
    basis: Snapshot commit, parent, exact path set, and six SHA-256 values independently checked.
  - claim: Ogilvie's 2--3-bit ML-KEM gap is current.
    verdict: incorrect
    basis: Hou--Jiang Table 1.1 and corrected repository history.
  - claim: The corrected isometric gain is at most 0.8 bit.
    verdict: supported
    basis: Hou--Jiang Table 1.1 at success lower bound 0.3.
  - claim: LaMS costs 191/282/390 and gains 22/31/41 over corrected QX25.
    verdict: supported_with_cost_model_scope
    basis: LaMS Table 1 and pinned estimator source.
  - claim: Published QRS absolute Kyber costs form a corrected current baseline.
    verdict: incorrect
    basis: Same-parameter Pouly--Shen comparison predates the LaMS error-width correction.
  - claim: Carry and modulus-switching effects obstruct naive digitwise commutation.
    verdict: supported
    basis: Independent reconstruction of wrap, carry, target, and rounding cocycles.
  - claim: Those cocycles create independent orbit information.
    verdict: incorrect
    basis: Exact weighted adjoint score identity and deterministic-orbit information identity.
  - claim: IDEA-20260722-001's current LaMS-isometry mechanism remains novel.
    verdict: unsupported
    basis: Reduction to Wu--Xu rotated-vector and Ogilvie/Hou--Jiang same-A reuse.
  - claim: All structured or p-adic MLWE directions are closed.
    verdict: incorrect_if_asserted
    basis: The derivation addresses one composition and leaves LaMS-to-MLWE proof/cost transfer open.
  - claim: FIPS 203 directly exports a DF or PC bit.
    verdict: incorrect
    basis: FIPS 203 Algorithm 18 implicit rejection.
  - claim: CVE-2026-10097 and CVE-2026-6330 are deterministic comparison-bug controls.
    verdict: supported
    basis: NVD/CNA records, wolfSSL 5.9.2 release, and PRs 10430/10192.
  - claim: The 2,950-query ML-KEM-768 result is an end-to-end attack cost.
    verdict: incorrect
    basis: Primary source conditions it on a 95%-accurate one-bit oracle; physical construction is separate.
  - claim: No reviewed source gives passive standardized ML-KEM key recovery.
    verdict: supported_with_search_boundary
    basis: Checked record contains estimates, toy/component runs, and implementation/oracle-assisted results.

candidate_assessments:
  - idea_id: IDEA-20260722-002
    title: Cross-backend negative-ciphertext conformance matrix
    classification: defensive_conformance_regression
    cryptanalytic_breakthrough: false
    novelty: adaptation
    verdict: survives_after_protocol_pinning
    information_gain: high
    bounded_cost: low
    strongest_evidence: >-
      FIPS 203 requires complete comparison; CVE-2026-10097 omits the final
      32 bytes on AVX2 and CVE-2026-6330 compares only half on NEON. Both have
      patched positive/negative controls.
    required_protocol_repairs:
      - Pin exact 5.9.1 vulnerable and 5.9.2 patched commits plus build flags.
      - Attest AVX2/NEON dispatch and use architecture-appropriate runners.
      - Mutate every equal-length ciphertext byte and SIMD lane under one fixed key.
      - Compare exact shared secrets with an independent scalar Algorithm-18 oracle.
      - Keep malformed-length rejection separate from equal-length implicit rejection.
    interpretation: >-
      Passing supports functional rejection conformance only, not timing,
      leakage, fault resistance, release approval, or passive MLWE security.
  - idea_id: IDEA-20260722-003
    title: End-to-end soft-oracle leakage budget
    classification: defensive_measurement_and_protocol_security
    cryptanalytic_breakthrough: false
    novelty: integration_and_validation
    verdict: survives_as_question_not_ready_for_execution
    information_gain: high
    bounded_cost: not_yet_demonstrated
    strongest_evidence: >-
      Soft-PC, SPRT, adaptive-LDPC, and masked-Keccak sources show that oracle
      accuracy alone discards calibration, confidence, dependence, and
      executions-per-query. The proposed integration tests a real defensive
      accounting gap.
    required_protocol_repairs:
      - Freeze PC versus DF semantics and match each trace classifier to its backend.
      - Set maximum profiling/attack traces, devices, keys, retries, and wall time.
      - Predeclare three configurations and success probability.
      - Power the median and factor-two comparisons with confidence intervals.
      - Freeze calibration and decoder selection before held-out evaluation.
      - Charge templates, repeated executions, failed traces, adaptivity, and postprocessing.
    cheapest_pre_gate: >-
      On one frozen trace corpus, compare hard, calibrated-soft, and
      time-ordered burst-aware replay without physical key recovery. Advance
      only if held-out calibration and rank prediction discriminate the models.

surviving_direction_ranking:
  ranked:
    - rank: 1
      idea_id: IDEA-20260722-002
      rationale: >-
        Deterministic controls, direct final-FIPS semantics, low compute, no
        acquisition campaign, and immediate failure localization give the
        highest information per bounded cost.
    - rank: 2
      idea_id: IDEA-20260722-003
      rationale: >-
        Potentially high information about protected-device protocol risk, but
        materially higher and currently unbounded profiling, acquisition,
        calibration, and replication cost.
  passive_algorithmic_survivor: null
  optional_nonresearch_check: >-
    An n<=16 exact carry/rounding/score identity test is reasonable
    transcription assurance but has low research information and cannot revive
    IDEA-20260722-001 or validate n=256 costs.

