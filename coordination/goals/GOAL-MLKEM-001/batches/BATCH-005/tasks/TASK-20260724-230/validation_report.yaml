  qualifications:
    - id: Q-SNAPSHOT-RECEIPT-COMMIT-SHA-NULL
      severity: process
      note: >-
        snapshot-receipt.json retains commit_sha=null; dispatch archive block
        binds and verified commit 28608fb8a48ffbb8291c82810f2867553d3fe6f1.
        Parent e829ef7c26549dc3ee62796c89f16b1d1ac2500b matches git history;
        all 39 receipt artifact SHA-256 values match committed blobs and tree.
    - id: Q-BUDGET-WALL-EXCLUDES-BUILD
      severity: medium
      note: >-
        Manifest wall_seconds sum to 0.6655488014221191 s and omit configure,
        compile, and earlier failed-probe repair time under /tmp. Executor
        acknowledges this in implementation.md and execution-report deviations.
        Accounting is therefore incomplete for stage totals, though still under
        the 5400 s cap and not fabricated as a null mathematical result.
    - id: Q-RUN008-RAW-GRID-TRUNCATION
      severity: medium
      note: >-
        RUN-MLKEM-008/raw.json stores only silent_sets and counts for NEON
        builds, not the full parameter_results rows (mutation_events,
        unstable_silent_indices, ct_sha256) present in RUN-MLKEM-006.
        analysis/coverage_maps.json retains silent sets and coverage_fraction=1.0;
        full NEON grid JSON remains only under /tmp (not archived). Primitive
        silent counts still re-derive and match.
    - id: Q-STYLIZED-COMMANDS-AND-QEMU-ARGV
      severity: low
      note: >-
        RUN-006/007/008 command.txt strings are stylized summaries, not exact
        argv. RUN-008 commands_attempted omit qemu -L, while implementation
        probe() always prepends qemu-aarch64-static -L /usr/aarch64-linux-gnu.
        Summary records qemu_sysroot correctly.
    - id: Q-NEON-ATTESTATION-NO-OBJDUMP-IN-RECEIPT
      severity: low
      note: >-
        Committed NEON attestation records macros (WOLFSSL_ARMASM=true),
        comparison_symbol mlkem_cmp_neon, and equal/unequal self-tests, but
        unlike AVX2 they omit objdump vector-instruction windows. Harness
        compile-time PROBE_BACKEND_NEON calls mlkem_cmp_neon directly, so a
        silent scalar fallback is not the measurement path. Validator
        independently confirmed the /tmp aarch64 probe binary contains
        mlkem_cmp_neon with ld4/eor NEON ops (corroboration outside snapshot).
    - id: Q-INTEGRATION-43-OF-64
      severity: low
      note: >-
        Raw integration_checks confirm 43 accept-true and 21 accept-false of 64
        PREFIX-AVX2 silent index/seed pairs (xor_0x01 only). Per-index: 20
        indices accept on both seeds, 9 on neither, 3 disagree across seeds
        (1539, 1544, 1564). Anomaly is recorded; primitive silent set 1536..1567
        remains complete with empty unstable_silent_indices. No attack
        constructed.
    - id: Q-VECTORS-ABSENT-SEED-RECONSTRUCTION
      severity: informational
      note: >-
        experiments/EXP-MLKEM-002/vectors/ is absent. Inputs are reconstructible
        from committed SEED_MATERIAL in comparison_probe.c (seeds 1 and 2) plus
        recorded ct_sha256 digests in raw/coverage artifacts. Sufficient for
        laboratory replay of the recorded grid; no third-party vectors used.
    - id: Q-DIRTY-TREE-AT-RUN
      severity: informational
      note: >-
        All four manifests record dirty_tree=true and git_commit
        e829ef7c26549dc3ee62796c89f16b1d1ac2500b (producer tree). Immutable
        package snapshotted at 28608fb.
    - id: Q-LENGTH-CONTROL-VACUOUS
      severity: informational
      note: >-
        CTRL-LENGTH-VERSUS-CONTENT passes with malformed_length_table=[] and
        label pass_no_malformed_length_counted_as_omission; no malformed-length
        inputs were exercised. Vacuous relative to an active negative test, but
        meets the stated pass condition.
    - id: Q-WEAKEST-CONFORMANCE-ANCHOR
      severity: informational
      note: >-
        Named anchor is deterministic_encap_decap_self_consistency (weakest
        accepted), correctly labeled in the execution report.

