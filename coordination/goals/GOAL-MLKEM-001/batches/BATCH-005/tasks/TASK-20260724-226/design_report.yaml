design_report:
  task_id: TASK-20260724-226
  status: completed
  hypothesis_id: H-MLKEM-002
  experiment_id: EXP-MLKEM-002
  selection_decision: DEC-20260724-006
  prior_repair_decision: DEC-20260722-007
  evidence_ref: EV-MLKEM-002
  proposal_ref: IDEA-20260722-002
  summary: >-
    Specified H-MLKEM-002 and froze approved EXP-MLKEM-002: a laboratory-only,
    byte-complete differential conformance audit of the ML-KEM implicit-rejection
    comparison primitive at exact pre-fix and post-fix wolfSSL commits, with an
    explicit premise-verification control for the two CVE records inherited from
    the BATCH-002 oracle-surface report and a generator-adequacy negative harness
    that does not depend on any library build.
  design_choices:
    - >-
      DEC-20260722-007 required repairing IDEA-20260722-002 to probe comparison
      primitives directly at exact fix boundaries before end-to-end mutation.
      The protocol therefore measures a per-index silent-byte map at the
      primitive level and uses Algorithm 18 only as a confirmation step on
      already-identified silent indices.
    - >-
      ORS-025 and ORS-026 enter as unverified premises. The top non-infrastructure
      outcome class is premise_unverified, so the run can honestly report that a
      recorded CVE claim does not correspond to code at the named version.
    - >-
      A deliberately truncated harness-side comparison wrapper establishes that
      the mutation generator can detect an omission even if no library build
      contains one, so a null library result is interpretable.
    - >-
      Backend attestation is a mandatory control because a silent null could
      otherwise be produced by runtime dispatch quietly selecting the scalar path.
    - >-
      The aarch64 NEON line is conditional on a cross-toolchain and user-mode
      emulator and is recorded as infrastructure_unavailable if absent, never as
      a negative conformance result.
  feasibility_checks_by_coordinator:
    - check: wolfSSL release tags exist and are fetchable
      method: git ls-remote --tags against the public repository
      result: 'v5.9.1-stable resolves to fb2d72b70f4f823efa7dddf9e427700864adf513 and v5.9.2-stable to a82476d144290bf6a786607a16c224acff63d882'
      note: Tag resolution only; no source was read, built, or executed during design.
    - check: execution host supports the x86-64 AVX2 backend
      method: /proc/cpuinfo flag inspection and compiler version query
      result: 'avx2 present; gcc 13.3.0; python 3.12.3'
  scope_guards:
    - No key recovery, oracle construction, query chaining, or attack-cost estimation.
    - No deployed system, network peer, or third-party key; network use is limited to source retrieval and package installation.
    - No timing, power, EM, cache, or fault measurement.
    - No release approval and no external vulnerability claim; a post-fix disagreement escalates to the coordinator only.
  artifact_paths:
    - ledger/hypotheses/H-MLKEM-002.yaml
    - experiments/EXP-MLKEM-002/specification.yaml
  inference:
    requested_policy: coordinator-ultra-code
    resolved_model: cursor-grok-4.5-high
    fallback_used: true
