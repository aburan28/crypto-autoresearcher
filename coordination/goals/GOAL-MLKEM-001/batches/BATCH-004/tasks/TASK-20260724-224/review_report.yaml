validator_context:
  task_id: TASK-20260724-223
  verdict: accept_with_qualifications
  integrity_admissible: true
  note: >-
    Validator admits the run package with process/informational qualifications
    only. Mathematical classification and H-implication are this Reviewer's
    scope.

reported_outcome_classification: implementation_mismatch

verdict_on_outcome_classification:
  accepted: true
  protocol_precedence_compliant: true
  reading_required: >-
    Accept as the primary label under frozen precedence
    (invalid > implementation_mismatch > exact_marginal_discrepancy >
    joint_dependence_only > paper_scale_artifact). Do not read it as
    CTRL-PORT-FIDELITY failure, as Thorns falsification, or as crypto-scale
    evidence. After semantic alignment, the load-bearing H-compatible signals
    are paper_scale_artifact and joint_dependence_only.
  localization:
    estimator_pairing_mismatch: >-
      Pinned no-compression control flow uses
      B1=law_product(CBD(ke),CBD(ks)) rather than algebraic e*y with
      y~CBD(ke_ct). Exact Fraction TV(algebraic, estimator-aligned pairing) is
      about 0.046–0.053 on ML-KEM-512 toys (eta1=3≠eta2=2) and exactly 0 on
      ML-KEM-768/1024 toys (eta1=eta2=2). After pairing alignment, float
      max_abs_delta versus the faithful port is at most ~4e-17 with
      mismatch_count_aligned=0.
    fips_vs_python_ties: >-
      Exhaustive decompress tables for d in {1,4,5,10,11,12} show exactly six
      ties-up versus Python half-even mismatches (one per d); compress tables
      match. These are labeled semantic mismatches, not Thorns effects.
    not_exact_marginal_discrepancy: >-
      No aligned compressed-scalar exact_marginal_discrepancy is claimed or
      evidenced. Aligned no-compression one-coordinate laws agree with the
      faithful estimator model to float presentation tolerance.
  secondary_signals_confirmed:
    paper_scale_artifact: true
    joint_dependence_only: true
    exact_marginal_discrepancy: false
  metric_clarification: >-
    summary.json algebraic_no_compression_float_tv_max=0.010685… is a
    pointwise max_abs_delta, not total variation. The exact algebraic-versus-
    estimator-pairing TV on ML-KEM-512 toys is ~0.046 (n=2,k=2) up to
    ~0.0529 (n=8,k=4). Aligned float TV/max_abs_delta is machine-epsilon
    scale, not a residual mathematical gap.

hypothesis_recommendation: supported_within_toy_boundary

hypothesis_recommendation_rationale: >-
  Within the frozen toy boundary, H-MLKEM-001's core predictions hold after
  required semantic alignment: displayed-surrogate/product second-moment ratio
  equals 4/sigma^2 (0.04 at sigma=10) with equal-moment tail-order change;
  LDP shifted-set repair preserves I(u)=c*(||u||_1-1); aligned no-compression
  one-coordinate float agreement is effectively exact; exact P(any) differs
  from 1-(1-p)^n while 0<=P(any)<=n*p holds at every n=2 threshold; observed
  estimator gaps localize to identifiable pairing/tie semantics rather than a
  Thorns-driven marginal change. Paper-scale and joint-dependence findings are
  explicitly compatible with scoped support under the experiment success
  criterion. Toy evidence does not revise FIPS rates or validate n=256.

claim_boundary:
  tested:
    - Gaussian radial moments/tails at sigma in {1,2,10}
    - Symbolic LDP shift repair with finite sanity at complex d in {2,8}
    - Exact no-compression CBD one-coordinate laws at n in {2,4,8}, k in {2,3,4}
    - Exact joint any-coordinate control at n=2,k=1,eta1=eta2=2
    - Exact n=1,k=1 compressed-scalar identity and failure-indicator enumeration
    - Full-domain FIPS versus Python rounding tables for listed d
    - Faithful port of pinned pq-crystals commit 75c26949
  not_tested:
    - n=256 distributions or failure rates
    - listed FIPS rare-event probabilities 2^-138.8, 2^-164.8, 2^-174.8
    - Monte Carlo / importance sampling
    - deployed ML-KEM systems, oracles, key recovery
  prohibited_inferences:
    - Do not revise FIPS 203 parameters or normative DFR claims
    - Do not present toy TV/slack as crypto-scale validation
    - Do not treat implementation_mismatch as a breakthrough or as H-rejection
  claim_tier: toy_exact_arithmetic_audit_only

objections:
  - id: OBJ-224-01
    severity: material_reading
    claim_challenged: Primary outcome_classification alone decides H-MLKEM-001
    finding: >-
      Protocol precedence correctly elevates implementation_mismatch whenever
      pairing TV>0 or tie mismatches exist. That label describes comparison
      repair against the pinned baseline model, not failure of CTRL-PORT-FIDELITY
      (source_vs_port max_abs_delta=0) and not falsification of the
      no-compression marginal prediction after alignment.
    required_handling: >-
      Evidence/decision text must foreground aligned TV~0, paper_scale_artifact,
      and joint_dependence_only as the H-relevant residue.
  - id: OBJ-224-02
    severity: material_metric
    claim_challenged: algebraic float delta reported as if it were TV
    finding: >-
      User-facing and summary wording can conflate max_abs_delta≈0.0107 with
      TV≈0.046 on ML-KEM-512 toys. Exact Fraction TVs are in
      RUN-MLKEM-002 raw tv_algebraic_vs_estimator_pairing.
    required_handling: Cite exact TV fractions when stating pairing discrepancy magnitude.
  - id: OBJ-224-03
    severity: scope_gap
    claim_challenged: Compressed-scalar half of success criterion fully closed
    finding: >-
      RUN-MLKEM-003 enumerates exact n=1 compressed scalar noise laws with
      identity_failures=0 and failure_probability=0 for all three families and
      both messages, but does not emit aligned compressed-scalar TV versus the
      estimator adaptation. Vacuous failure-indicator agreement is
      non-discriminative at this toy scale and is not a positive proof of full
      marginal estimator agreement. Absence of an asserted
      exact_marginal_discrepancy is accepted; overclaim of compressed closure
      is not.
    required_handling: >-
      Scope support to tested no-compression/alignment/joint/scale predictions;
      treat compressed estimator-TV as unclosed unless a follow-up emits it.
  - id: OBJ-224-04
    severity: informational
    claim_challenged: Pairing mismatch as non-faithful port
    finding: >-
      The ke/ks versus ke/ke_ct product pairing is present in pinned
      Kyber_failure.py control flow and is reproduced faithfully. It is a
      baseline model convention relative to algebraic FIPS e*y, localized by
      the aligned comparator—not a port bug.
  - id: OBJ-224-05
    severity: boundary
    claim_challenged: Any FIPS-rate or n=256 transfer
    finding: >-
      Explicitly out of scope. KN-LIT-080 and H-MLKEM-001 interpretation limits
      forbid crypto-scale promotion from these toys.

required_followups:
  - id: FU-224-01
    priority: recommended_before_strong_compressed_claim
    action: >-
      If the Coordinator wants the compressed prediction closed at claim-tier
      strength, freeze a tiny follow-up that emits exact Fraction TV between the
      n=1 compressed scalar law and a FIPS-ties-aligned estimator adaptation
      for each family/message—without expanding n or estimating rare events.
  - id: FU-224-02
    priority: evidence_hygiene
    action: >-
      In EV/DEC drafting, separate (a) implementation_mismatch localization,
      (b) paper_scale_artifact, (c) joint_dependence_only slack, and (d) aligned
      no-compression TV~0, and cite RUN-MLKEM-00{1,2,3,4} IDs explicitly.
  - id: FU-224-03
    priority: prohibited
    action: Do not authorize n=256 runs, FIPS DFR revision, or oracle/attack claims from EXP-MLKEM-001.

