    status: confirmed_at_float_presentation_tolerance
  exact_any_coordinate_probability_minus_independence_formula:
    predicted: Nonzero allowed; P(any)<=n*p always
    observed: nontrivial_indep_gap true; all_union_ok true (19/19)
    status: confirmed
  aligned_compressed_scalar_total_variation_distance_from_estimator:
