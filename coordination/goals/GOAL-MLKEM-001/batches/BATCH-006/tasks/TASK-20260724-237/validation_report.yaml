    hash_mismatch_count: 0

  run_ids:
    - RUN-MLKEM-009
    - RUN-MLKEM-010
    - RUN-MLKEM-011
    - RUN-MLKEM-012

  inference:
    requested_policy: review-xhigh
    resolved_model: cursor-grok-4.5-high
    fallback_allowed: true
    fallback_used: true
    independent_session_required: true
    independent_session: true
    note: >-
      Independent session from the Executor (TASK-20260724-235). Requested
      review-xhigh is unavailable in this harness; Cursor Grok 4.5 used with
      fallback_used true, matching the handoff.

  verdict: accept_with_qualifications
  terminal_verdict_contract: passed
  admissibility_verdict: accept_with_qualifications
  overall_verdict: accept_with_qualifications
  outcome_classification_supported: true
  outcome_classification_claim: isolated_to_audited_commits
  outcome_classification_note: >-
    Artifacts support the isolation premise: positive control and negative
    harness detected; no reportable new silent index or equal-length decap
    accept on postfix wolfSSL or liboqs; PREFIX-NEON silence matches the
    established EV-MLKEM-005 / EXP-MLKEM-002 defect and is treated as audited,
    not new. A strict reading of outcome precedence also makes
    generator_hardening_insufficient arguable because G2_minus_G1 and
    G3_minus_G1 are empty on every target including the positive control
    (see Q-OUTCOME-PRECEDENCE-TENSION). Isolation evidence itself stands.

  blockers: []

  qualifications:
    - id: Q-BUILDS-OUTSIDE-RECORDED-WALL
      severity: medium
      concern: C1
      note: >-
        Measured run wall sum is ~11.01 s. RUN-MLKEM-009 records 3.51 s whose
        stdout shows only probe recompiles. /tmp/exp-mlkem-003/builds/ holds
        symlinks of all six wolfSSL backends to /tmp/exp-mlkem-002/builds/;
        libwolfssl.a mtimes are ~19:17 (EXP-002) and liboqs.a ~19:55, both
        before RUN-009 started_at 20:05:23. Declared protocol_deviation
        discloses reuse. Recorded runs faithfully cover probe compile,
        attestation, anchor checks, and measurement grids; they are not a
        faithful wall-clock record of building the six wolfSSL libraries or
        liboqs from source.

    - id: Q-STYLIZED-COMMANDS
      severity: medium
      concern: C2
      note: >-
        RUN-MLKEM-009/010/011 command.txt strings use descriptive pipe
        notation (e.g. attest|acvp-anchor|archive-key0) and are not exact
        executable argv. Only RUN-MLKEM-012 records a real python invocation.
        A third party cannot reproduce from command.txt alone; reproduction
        requires run_experiment.py. Precedent in VAL-20260724-230 treated the
        same class as a qualification rather than package invalidation when
        manifests otherwise carry commit, dirty, env, timing, and inference.

    - id: Q-CLASS-MARGINAL-GENUINELY-EMPTY
      severity: informational
      concern: C3
      note: >-
        RUN-MLKEM-012 raw.json class_marginal_information.G2_minus_G1 and
        G3_minus_G1 are empty lists []. Independent recomputation from
        BUILD-PREFIX-AVX2 ML-KEM-1024 silent sets confirms G2-G1=[] and
        G3-G1=[]. execution-report empty YAML fields and null anomalies are
        empty results, not unfilled placeholders. The companion flag
        G2_or_G3_added_discriminating_power_on_positive_control=true means
        retained detection of the known region, not new indices beyond G1.

    - id: Q-ANCHOR-INTREE-NOT-DOWNLOADED-NIST
      severity: medium
      concern: C4
      note: >-
        anchor_attempts records HTTP 200 for NIST ACVP-Server prompt.json and
        expectedResults.json plus liboqs in-tree internalProjection.json.
        Actual pass/fail used the in-tree file
        (.../ACVP_Vectors/ML-KEM-encapDecap-FIPS203/internalProjection.json):
        wolfSSL backends n_tested=9 n_pass=9; liboqs n_tested=1 n_pass=1.
        Downloaded NIST prompt/expectedResults hashes differ from the in-tree
        projection and were not the validation input. Named
        ..._via_liboqs_in_tree and graded strong. CTRL-STRONG-ANCHOR attempts
        are recorded; grade strong is ACVP-projection-based, not a direct
        NIST-download validation.

    - id: Q-LIBOQS-G4-HARNESS-REFUSAL
      severity: low
      concern: C5
      note: >-
        All 72 BUILD-LIBOQS malformed-length rows are disposition
        refused_by_harness_exact_length_api with
        counted_as_comparison_omission=false. This is an honest coverage gap
        for length probing under OQS_KEM_decaps (no length argument), not a
        library reject presented as a conformance result. WolfSSL G4 rows are
        real api_error_reject observations.

    - id: Q-NEON-NO-G4-TABLE
      severity: low
      concern: C6
      note: >-
        NEON backends were exercised under qemu-aarch64 (run_experiment.py
        probe(..., qemu=True)). Primitive grids and decapsulation-boundary
        results exist for PREFIX-NEON (6931 decap rows) and POSTFIX-NEON
        (83 decap rows, 0 accepts). Malformed-length table has no NEON
        build_id rows. Conformance conclusions for NEON rest on
        decap-boundary evidence, satisfying the primitive-only invalidation
        bar; G4 coverage for NEON is absent.

    - id: Q-MUTATION-CAP-REINTERPRETED
      severity: medium
      note: >-
        Spec budget mutation_cap_per_target_parameter_set=20000. Measured
        G1+G2+G3 event sums for each wolfSSL target on ML-KEM-1024 are 28268
        with capped=false. implementation.md reinterprets the cap as per
        (target, parameter_set, class); that reinterpretation is not among
        the three declared protocol_deviations. Does not relax an
        invalidation rule; does silently relax the named budget stop rule.

    - id: Q-OUTCOME-PRECEDENCE-TENSION
      severity: medium
      note: >-
        Empty G2/G3 marginal findings on all targets including the positive
        control match the wording of generator_hardening_insufficient, which
        outranks isolated_to_audited_commits in the frozen precedence list.
        Executor classified isolated_to_audited_commits and argued retained
        detection. Isolation premise is artifact-supported; unique class
        selection under precedence needs Coordinator adjudication.

    - id: Q-LIBOQS-COMBINED-CLASS-GRID
      severity: low
      note: >-
        BUILD-LIBOQS primitive grids report class G1_G2_G3_combined rather
        than separate G1/G2/G3 tables. Cross-implementation baseline is
        measured but not class-identical to wolfSSL accounting.

    - id: Q-IDENTICAL-PEAK-RSS
      severity: informational
      note: >-
        All four manifests record the same peak_rss_bytes=127148032, which is
        weak as a per-run resource measurement (likely process-lifetime RSS).

    - id: Q-SNAPSHOT-RECEIPT-COMMIT-SHA-NULL
      severity: process
      note: >-
        snapshot-receipt.json commit_sha=null by self-reference convention;
        dispatch_queue binds and verifies e487652127433e4cb1f0c1de173dfa197ca23c1f.
        Parent 7bb0502 matches; all 50 receipt SHA-256 values match the tree.

    - id: Q-DIRTY-TREE-AT-RUN
      severity: informational
      note: >-
        All four manifests record dirty_tree=true and git_commit 7bb0502
        (producer tree before snapshot). Immutable package snapshotted at
        e487652.

  coordinator_concerns:
    C1:
      verdict: builds_happened_outside_recorded_runs
      faithful_record_of_measurement: true
      faithful_record_of_library_builds: false
      detail: >-
        WolfSSL backends are symlinks to EXP-002 builds; liboqs was built
        ~10 minutes before RUN-009. RUN-009 performed probe recompilation,
        attestation, second-impl pin, and anchor establishment only.
    C2:
      verdict: descriptive_summary_not_exact_command
      reproducible_from_command_txt_alone: false
      reproducible_via_run_experiment_py: true
    C3:
      verdict: genuinely_empty_results
      G2_minus_G1: []
      G3_minus_G1: []
      anomalies: empty_or_null
    C4:
      verdict: in_tree_acvp_projection_used_nist_download_recorded_but_not_applied
      grade_strong_warranted: qualified_yes_as_acvp_projection
      attempts_recorded: true
    C5:
      verdict: honest_limitation_record
      coverage_gap: true
      presented_as_library_result: false
    C6:
      verdict: neon_exercised_under_qemu_with_decap_boundary
      primitive_only_verdict: false
      g4_neon_rows: absent

  objection_closure:
    - id: OBJ-001
      verdict: answered
      settling_artifact: >-
        experiments/EXP-MLKEM-003/runs/RUN-MLKEM-011/raw.json decap tables
        (accept_honest_ss + message_stable); primitive silence in
        RUN-MLKEM-010/raw.json grids kept separate. PREFIX-AVX2: 94 accepts
        all message_stable=true inside 1536..1567; not universal accept.
    - id: OBJ-002
      verdict: partially_answered
      settling_artifact: >-
        RUN-MLKEM-010 grids for G2/G3; analysis/malformed_length_table.json
        for G4; RUN-MLKEM-012 class_marginal_information. Wider generators
        ran across four keys; marginal new indices beyond G1 are empty;
        liboqs G4 harness-refused; NEON G4 absent.
    - id: OBJ-003
      verdict: answered
      settling_artifact: >-
        RUN-MLKEM-011/raw.json BUILD-PREFIX-NEON (6931 rows) and
        BUILD-POSTFIX-NEON (83 rows) decap-boundary results under qemu;
        CTRL-BACKEND-ATTESTATION path forbids primitive-only verdicts.
    - id: OBJ-004
      verdict: answered
      settling_artifact: >-
        experiments/EXP-MLKEM-003/vectors/*_seed1_{ek,ct,ss}.bin; digests in
        RUN-MLKEM-009/raw.json archive_key0 match file SHA-256; seeds 1..4
        in manifests.
    - id: OBJ-005
      verdict: partially_answered
      settling_artifact: >-
        RUN-MLKEM-009/raw.json anchor_attempts + anchors + conformance_anchor
        (named, graded strong, attempts recorded). Validation input was
        liboqs in-tree ACVP internalProjection, not the downloaded NIST
