  metric_recomputations:
    - id: positive_control_silent_set_PREFIX_AVX2_MLKEM1024
      source: experiments/EXP-MLKEM-003/runs/RUN-MLKEM-010/raw.json
      method: >-
        Recompute silent_byte_set ∩ {1536..1567} per class from
        grids.BUILD-PREFIX-AVX2 parameter_results; compare to
        positive_control_detection_by_class and execution-report.
      recomputed:
        G1_single_byte:
