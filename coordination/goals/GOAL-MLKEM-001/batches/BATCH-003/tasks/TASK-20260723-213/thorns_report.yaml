fips_203_transfer:
  exact_parameters:
    common: {n: 256, q: 3329}
    ML-KEM-512: {k: 2, eta_1: 3, eta_2: 2, d_u: 10, d_v: 4}
    ML-KEM-768: {k: 3, eta_1: 2, eta_2: 2, d_u: 10, d_v: 4}
    ML-KEM-1024: {k: 4, eta_1: 2, eta_2: 2, d_u: 11, d_v: 5}
  exact_input_laws:
    s_e_y: coefficientwise_centered_binomial_CBD_eta_1
    e1_e2: coefficientwise_centered_binomial_CBD_eta_2
    distinction_from_paper: bounded_discrete_non_Gaussian
  lifted_noise_identity:
    definitions:
      c_u: 'Decompress_{d_u}(Compress_{d_u}(A^T y+e1))-(A^T y+e1)'
      c_v: 'Decompress_{d_v}(Compress_{d_v}(t^T y+e2+mu))-(t^T y+e2+mu)'
    expression: 'nu=e^T y+e2+c_v-s^T e1-s^T c_u'
    notes:
      - e^T_y contains k negacyclic products.
      - s^T_e1 contains k negacyclic products.
      - s^T_c_u contains k products with data-dependent quantization error.
      - c_u shares y and e1 with other terms.
      - c_v depends on t=A*s+e, y, e2, and the message representative.
      - The exact decoder applies modular representatives and Compress_1; q/4 is the decision boundary shorthand.
  transfer_failures:
    centered_binomial: >-
      Theorem 1 requires a continuous unbounded density and Theorem 2 requires
      exact Gaussian inputs. CBD(2) and CBD(3) have bounded finite support.
      A central limit approximation in the bulk does not transfer an
      R-to-infinity large-deviation theorem to a fixed-n rare tail.
    multiple_terms: >-
      Theorem 4 gives the norm law of one product. ML-KEM sums 2k principal
      product terms plus compression terms with shared variables.
    compression_rounding: >-
      Quantization errors are nonlinear and data-dependent. They are neither
      present in the theorem nor shown to be independent of the products.
    modular_representatives: >-
      The paper works over the real number field and does not analyze reduction
      modulo 3329, centered lifting, or the coefficientwise decoding boundary.
    fixed_dimension: >-
      The paper's theorem does allow a fixed n in the Gaussian model, but gives
      no explicit finite-R constant. Its informal CBD justification invokes a
      different n-to-infinity CLT, while FIPS fixes n=256.
    failure_functional: >-
      The paper studies Euclidean norm and plane direction. ML-KEM fails when
      any decoded coefficient crosses its modular decision region; it does not
      use an error-correcting decoder whose outcome is determined by Euclidean norm.
  current_FIPS_DFP_record:
    listed_values:
      ML-KEM-512: '2^-138.8'
      ML-KEM-768: '2^-164.8'
      ML-KEM-1024: '2^-174.8'
    estimator_observation: >-
      At pinned commit 75c2694, Kyber_failure.py constructs a one-coefficient
      law from scalar product/convolution laws and returns
      n*tail_probability(F,q/4). The final multiplication by n is a union
      bound and does not require independence among the 256 output
      coefficients.
    residual_estimator_assumptions: >-
      The one-coordinate construction models product inputs and uniform
      compression-error laws as independent. Those assumptions deserve their
      own audit, but ePrint 2026/1022 neither models exact FIPS compression nor
      proves that this one-coordinate law is optimistic.
  normative_verdict: no_change_supported
  normative_reason: >-
    The preprint does not instantiate its theorem for exact FIPS distributions,
    does not compute a new one-coordinate tail or end-to-end DFP, and does not
    invalidate the union-bound step. It therefore supplies no basis for
    revising the FIPS 203 Table 1 values.

equations_needed_for_exact_transfer:
  centered_binomial:
    law: 'Pr[CBD_eta=j]=binom(2 eta, eta+j)/2^(2 eta), -eta<=j<=eta'
    mean: 0
    variance: 'eta/2'
    supports: {CBD_2: [-2, 2], CBD_3: [-3, 3]}
  negacyclic_coefficient:
    equation: >-
      (a*b)_ell=sum_{i=0}^ell a_i b_{ell-i}
      -sum_{i=ell+1}^{n-1} a_i b_{n+ell-i}.
    relevance: >-
      For a fixed ell and independent coefficient arrays, the scalar pairs in
      one product are independent; dependence appears jointly across different
      output coefficients because they reuse the same arrays.
  compression:
    definitions:
      Compress_d_x: 'round((2^d/q) x) mod 2^d'
      Decompress_d_y: 'round((q/2^d) y)'
      Q_d_x: 'Decompress_d(Compress_d(x))-x, using exact FIPS rounding and representatives'
    relevance: 'Q_d(x) is nonlinear and data-dependent, not a Gaussian or CBD input.'
  K_PKE_values:
    equations:
      t: 't=A*s+e'
      u: 'u=A^T*y+e1'
      v: 'v=t^T*y+e2+mu'
      c_u: 'c_u=Q_du(u)'
      c_v: 'c_v=Q_dv(v)'
  lifted_decryption_noise:
    equation: 'nu=e^T*y+e2+c_v-s^T*e1-s^T*c_u'
    embedding_equation_before_modular_decoding: >-
      rho_t(nu)=sum_j rho_t(e_j)rho_t(y_j)
      -sum_j rho_t(s_j)rho_t(e1_j+c_u_j)+rho_t(e2+c_v).
    warning: >-
      This lifted identity does not remove modulo-q representatives and does
      not make c_u or c_v independent embedding coordinates.
  exact_failure_event:
    equation: >-
      F={exists ell: Compress_1((mu+nu)_ell mod q) != m_ell}.
    threshold_shorthand: 'The estimator evaluates a one-coordinate tail at q/4.'
  union_bound:
    equation: 'Pr[F] <= sum_ell Pr[F_ell] = n*p when coefficient marginals are rotation-equivalent.'
    independence_required: false
    independence_formula_not_used: '1-(1-p)^n'
  specialization_requirement: >-
    A numerical revision must derive or rigorously bound the exact
    one-coordinate law under all shared variables and compression, preserve
    modular decoding, and then control the 256-coordinate union. The Gaussian
    one-product norm density alone supplies none of these steps.

claim_by_claim_verdicts:
  - claim: Gaussian product coordinates have exponential rather than Gaussian radial tails.
    verdict: proved_in_model
  - claim: Large-norm iid complex Gaussian-product vectors concentrate near complex coordinate axes.
    verdict: proved_asymptotically_for_fixed_dimension
  - claim: In the power-of-two coefficient basis, those axes become n/2 fixed two-dimensional Fourier planes.
    verdict: proved_for_one_real_Gaussian_polynomial_product
  - claim: The same theorem applies to fixed-n centered-binomial ML-KEM inputs.
    verdict: unsupported
  - claim: The discrete experiment validates ML-KEM's failure tail.
    verdict: false
  - claim: Theorem 4 gives the ML-KEM decryption-noise norm distribution.
    verdict: false
  - claim: Independence systematically underestimates the noise norm.
    verdict: overstated_and_scale_check_required
  - claim: Existing LAC patterns align with selected thorns.
    verdict: supported_by_exact_identities_and_planted_pattern_experiment
  - claim: Existing decryption-failure attacks succeed precisely because of thorns.
    verdict: partially_supported_but_not_an_if_and_only_if_attack_theorem
  - claim: The paper gives a new passive attack on ML-KEM.
    verdict: false
  - claim: The paper improves conditional ML-KEM failure boosting.
    verdict: no_quantified_improvement
  - claim: The paper changes FIPS 203 DFP values.
    verdict: unsupported
  - claim: The paper identifies a useful modeling mechanism for correlated convolution tails.
    verdict: yes_with_Gaussian_and_asymptotic_scope

five_way_implication_assessment:
  honest_DFR_estimation:
    verdict: no_numerical_or_normative_change_supported
    changes: >-
      The paper supplies a geometric warning that an iid-coordinate model can
      miss joint tail direction for a Gaussian polynomial product.
    does_not_change: >-
      It neither changes the exact fixed-coefficient CBD product law nor
      invalidates the FIPS estimator's final union bound. It gives no exact
      treatment of compression, module sums, modulo 3329, or the bit-decoding
      event and therefore cannot revise 2^-138.8, 2^-164.8, or 2^-174.8.
  failure_boosting_geometry:
    verdict: conceptual_generalization_only
    changes: >-
      Known LAC constant-sign and alternating patterns become two instances of
      the score |sigma_t(s)|*|sigma_t(e)| over all embedding indices. This can
      motivate an all-frequency candidate selector.
    does_not_change: >-
      No exact ML-KEM chosen-ciphertext distribution, target count, search
      depth, precomputation, or boosted conditional failure probability is
      computed. Existing BATCH-002 ORS-002 costs remain unchanged.
  conditional_DF_oracle_attacks:
    verdict: no_query_or_end_to_end_cost_change
    reason: >-
      The paper neither creates a visible DF bit nor maps thorn distance to the
      accuracy law consumed by adaptive-LDPC, inequality, or soft-oracle
      backends. The 2,400/2,950 conditional query figures and their separate
      oracle-construction costs are unaffected.
  passive_MLWE_hardness:
    verdict: no_change
    reason: >-
      The analysis conditions on products of secret/error samples and
      decryption-failure geometry. It gives no public-key-only distinguisher,
      key recovery, lattice-cost reduction, standardized solve, or attack
      certificate.
  protocol_or_implementation_guidance:
    verdict: analysis_guidance_only_no_FIPS_change
    useful_guidance:
      - Audit rare-event estimators at exact distributions instead of importing a Gaussian joint-tail picture.
      - Treat any observable failure, comparison leakage, or protocol confirmation as a separately charged oracle surface.
      - For new nonstandard designs, test canonical-embedding extremes before relying on ECC or independence heuristics.
    not_authorized:
      - Do not add sample trimming or rejection to conforming ML-KEM; that would change the standardized distribution and requires a new proof and specification.
      - Do not change q, n, eta_1, eta_2, d_u, or d_v from this paper.
      - Do not expose internal K-PKE or a failure flag.
    unchanged_FIPS_practice: >-
      Preserve exact integer compression, complete re-encryption comparison,
      implicit rejection, internal-interface restrictions, and
      implementation-specific side-channel/fault validation.

