evidence_status:
  verified_from_primary_text_or_code:
    - The paper's theorem assumptions, displayed densities, normalization maps, asymptotic regime, and experiment descriptions.
    - The paper formally maps the LAC Type 1/2 and Type 1b/2b patterns through signed embedding orders.
    - FIPS 203 fixes n=256 and q=3329, specifies CBD sampling and compression, and lists the three Table 1 decapsulation-failure rates.
    - The pinned FIPS-cited estimator ends with n times a one-coordinate tail probability.
  reported_not_independently_reproduced:
    - The trends shown in paper Figures 1, 3, and 4.
    - The assertion that suitable LAC patterns require only moderate search effort.
    - All success and cost claims of the cited failure attacks.
    - The numerical FIPS Table 1 values; they were checked as normative reported values but not recomputed in this task.
  derived_and_checked_in_this_task:
    - The equal-second-moment check exposing the paper's displayed surrogate-scale mismatch.
    - The local containment gap in the lower-bound proof of Theorem 1 and its fixed-shift repair.
    - The exact lifted ML-KEM noise identity and the observation that the final n-fold step is a union bound.
    - The conclusion that no numerical ML-KEM DFR change follows without a full exact specialization.
  empirical_runs_performed: 0

paper_model:
  ring: 'K_R isomorphic to R[x]/(x^n+1), n a power of two'
  arithmetic: real_number_field_arithmetic_without_mod_q_reduction
  main_random_inputs: 'independent a,b with coefficient vectors N(0, sigma^2 I_n)'
  reduced_embedding_inputs: 'independent coordinates CN(0, n sigma^2)'
  main_object: 'one product c=a*b, equivalently rho(c)=rho(a) hadamard rho(b)'
  asymptotic: 'fixed n and tail radius R tending to infinity'
  not_in_main_theorems:
    - discrete centered-binomial coefficients
    - bounded-support tails
    - sums of multiple polynomial products
    - ciphertext compression or decompression
    - modular representatives modulo q
    - a coefficientwise ML-KEM decoding event
    - an oracle construction or passive key-recovery algorithm

distribution_reconstruction:
  real_product:
    inputs: 'X1,X2 iid N(0,sigma^2)'
    product: 'P=X1*X2'
    density: 'f_P(t)=K_0(|t|/sigma^2)/(pi*sigma^2)'
    tail: 'exp(-|t|/sigma^2) times a polynomial prefactor'
  complex_product:
    inputs: 'Z1,Z2 iid CN(0,sigma^2)'
    product: 'W=Z1*Z2'
    planar_density: 'f_W(z)=2*K_0(2|z|/sigma^2)/(pi*sigma^4)'
    radial_density: 'f_|W|(r)=4r*K_0(2r/sigma^2)/sigma^4'
    phase: uniform_on_0_2pi_and_independent_of_radius
  coefficient_to_embedding:
    map: 'tau(a) V = sigma(a)'
    power_of_two_property: 'V/sqrt(n) is unitary after conjugate-pair reduction'
    multiplication: 'coefficient convolution maps to embedding-space Hadamard product'
  independence_surrogate_as_displayed:
    radial_density: 'f_assum(r)=r*exp(-r^2/(4 sigma^2))/(2 sigma^2)'
    claimed_role: equal_standard_deviation_complex_Gaussian_surrogate
    normalization_concern: >-
      Under the paper's CN(0,sigma^2) convention, the real product law has
      E|W|^2=sigma^4, while the displayed surrogate has E|G|^2=4 sigma^2.
      These are not equal except at sigma=2. The equal-second-moment surrogate
      would instead have radial density
      2r*exp(-r^2/sigma^4)/sigma^4.
    consequence: >-
      Figure 4 at sigma=10 and the broad norm-underestimation statement cannot
      be used quantitatively until the notation or scale is repaired.

theorem_reconstruction:
  - id: paper_Theorem_1
    name: conditional_spherical_large_deviations
    assumptions:
      - X has a two-dimensional Lebesgue density on C.
      - 'For every eta>0, its radial tail is sandwiched by constants times exp(-(c +/- eta)|z|).'
      - Z consists of n independent copies of X.
      - n is fixed while R tends to infinity.
    statement: >-
      The conditional direction Z/||Z||_2 given ||Z||_2>R obeys an LDP on the
      complex unit sphere with speed R and rate
      I(u)=c(||u||_1-1).
    proof_status: stated_and_largely_derived_with_repairable_lower_bound_gap
    proof_gap: >-
      The lower-bound proof claims that the fixed-radius polydisc
      product_j{|z_j-R u_j|<=epsilon} is contained in ||z||_2>R for large R.
      It is not: it contains inward perturbations of R*u. Centering at
      (R+C)u for a fixed C larger than the polydisc radius repairs the
      containment without changing the speed-R exponent, but that repair is
      not written in the paper.
    scope: continuous_unbounded_iid_embedding_coordinates
  - id: paper_Corollary_1
    name: complex_axis_concentration
    statement: >-
      The zero set of the rate function is the union of complex coordinate
      axes. Outside any fixed epsilon-neighborhood, conditional mass is at
      most exp(-c_epsilon R+o(R)).
    proof_status: consequence_of_Theorem_1
    finite_R_constant: not_explicit
  - id: paper_Corollary_2
    name: complex_Gaussian_product_case
    assumptions:
      - 'U,V iid CN(0,tau^2)'
      - embedding coordinates are independent copies of U*V
    statement: 'Theorem 1 applies with c=2/tau^2.'
    proof_status: proved_from_Bessel_K0_asymptotics
  - id: paper_Lemma_1
    name: reduced_embedding_of_coefficient_Gaussian
    assumptions:
      - 'tau(a) is N(0,sigma^2 I_n)'
      - 'n is a power of two'
    statement: 'rho(a)_1,...,rho(a)_{n/2} are iid CN(0,n sigma^2).'
    proof_status: proved_by_covariance_and_pseudocovariance
    transfer_warning: >-
      For non-Gaussian CBD inputs, zero covariance and zero pseudocovariance do
      not imply independence.
  - id: paper_Theorem_2
    name: cyclotomic_Fourier_plane_concentration
    assumptions:
      - 'a,b are independent with coefficient vectors N(0,sigma^2 I_n)'
      - 'K=Q[x]/(x^n+1), n a power of two'
      - no modular reduction
    statement: >-
      Conditioned on ||tau(ab)||_2>R, the normalized coefficient vector
      approaches the union of n/2 fixed real planes
      P_i=span{(cos(s theta_i))_s,(sin(s theta_i))_s}, with probability outside
      an epsilon-neighborhood bounded by exp(-kappa_epsilon R+o(R)).
    proof_status: proved_by_unitary_inverse_embedding
    asymptotic_regime: fixed_n_R_to_infinity
  - id: paper_Theorem_3
    name: embedding_adapted_signed_partial_sums
    assumptions:
      - 'n=2^m and t is odd'
      - coefficients may be arbitrary real values
    statement: >-
      Each sigma_t(e) is an exact signed permutation of the coefficient
      sequence evaluated at powers of zeta; after any cyclic cut, Abel
      summation expresses it through signed cyclic partial sums.
    proof_status: exact_deterministic_identity
    does_not_prove: probability_of_large_embedding_coordinate_or_decryption_failure
  - id: paper_Proposition_1
    name: coherent_ternary_interval_bound
    assumptions:
      - 'e_j in {-1,0,1}'
      - an embedding-adapted cyclic interval has l nonzero coefficients of one sign
    statement: >-
      The coherent contribution is a geometric sum; it is at least
      l*cos((L-1)pi/(2n)), and
      |sigma_k(e)| is at least that value minus the residual magnitude |v|.
    proof_status: exact_bound
    limitation: residual_v_is_not_probabilistically_bounded
  - id: paper_Theorem_4
    name: norm_density_for_one_Gaussian_product
    assumptions:
      - 'a,b independent with coefficient vectors N(0,sigma^2 I_n)'
      - 'K=Q[x]/(x^n+1), n a power of two'
    statement: >-
      If g(x)=2*K_0(2 sqrt(x)/(n sigma^2))/(n^2 sigma^4), then
      f_{||tau(ab)||}(r)=n r g^{*(n/2)}(n r^2/2), r>=0.
    proof_status: proved_by_independent_reduced_embedding_coordinates_and_change_of_variables
    limitation: one_continuous_Gaussian_product_only
  - id: paper_Section_5_4_claim
    name: independence_underestimates_norm
    statement: >-
      Replacing the true product coordinates by independent Gaussian
      coordinates is claimed to systematically underestimate noise magnitude.
    proof_status: not_a_stated_theorem
    verdict: unsupported_as_universal_stochastic_or_norm_claim
    reasons:
      - The displayed true and surrogate radial densities do not have matching second moments under one sigma convention.
      - Density crossings do not establish first-order stochastic dominance.
      - If a coefficientwise independence model preserves each coefficient marginal, E||c||_2^2 is unchanged exactly.
      - A heavier far tail can support tail underestimation in a specified regime, but no finite ML-KEM regime is derived.

attack_application:
  target_in_paper: LAC_style_failure_attack_of_Guo_et_al
  known_patterns:
    - Type_1_and_Type_2: coherent constant-sign blocks, associated with the first embedding coordinate
    - Type_1b_and_Type_2b: alternating-sign blocks, associated with the last reduced embedding coordinate
  proved_component: >-
    The signed-permutation and coherent-block identities explain why those
    patterns enlarge selected canonical embedding coordinates and align the
    product with Fourier planes.
  not_proved:
    - that every successful failure attack is characterized only by thorn proximity
    - an end-to-end failure probability from thorn distance
    - an algorithm for finding an unknown secret's large embedding coordinate
    - a query, target, memory, or preprocessing improvement over prior attacks
    - any attack against FIPS 203 ML-KEM
  proposed_generalization_in_paper: >-
    Search for a common index t where both |sigma_t(s)| and |sigma_t(e)| are
    large, instead of enumerating only the four named patterns.
  verdict: modeling_and_candidate_selection_principle_without_costed_attack

