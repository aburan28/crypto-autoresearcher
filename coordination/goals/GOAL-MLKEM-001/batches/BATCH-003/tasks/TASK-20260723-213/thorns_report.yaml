    novelty is made here.

cheapest_replication_or_derivation_gate:
  id: GATE-THORNS-FIPS-001
  title: Equal-scale and FIPS-estimator derivation audit
  claim: >-
    Before any rare-event simulation, a scale-correct reconstruction will show
    either (A) that the thorn result changes only the joint direction law while
    leaving the FIPS one-coordinate tail plus union bound unchallenged, or
    (B) an explicit exact-FIPS step whose one-coordinate probability is
    underestimated and therefore warrants a bounded replication.
  mechanism: >-
    Joint coefficient correlation cannot invalidate a union bound by itself.
    A claim-changing route must alter the exact marginal failure event or an
    input law used to compute it. Separately, the paper's true and surrogate
    radial laws must be compared at equal second moment.
  assumptions:
    - FIPS 203 Algorithms 8 and 13-15 are the reference semantics.
    - The pinned estimator is treated as an auditable calculation, not ground truth.
    - No oracle or physical implementation is needed.
  predictions:
    - metric: displayed_radial_second_moment_ratio_surrogate_over_true
      direction: different
      minimum_effect: 'equals 4/sigma^2 under the paper''s displayed formulas'
    - metric: final_union_bound_requires_coefficient_independence
      direction: lower
      minimum_effect: false
    - metric: exact_FIPS_terms_covered_by_paper_theorems
      direction: lower
      minimum_effect: 'strictly fewer than all terms'
    - metric: claim_changing_one_coordinate_counterexample
      direction: different
      minimum_effect: null
  minimal_test:
    design: >-
      (1) Integrate both displayed radial laws and compare normalization and
      second moments; repeat with the Gaussian surrogate rescaled to variance
      sigma^4. (2) Derive nu from FIPS Algorithms 13-15, label every shared
      variable and compression error, and reconstruct the pinned script's
      one-coordinate law and n-fold union bound. (3) For a toy n=8 version,
      exactly enumerate the no-compression CBD control and a compressed
      variant to determine whether any discrepancy is marginal or only joint.
      Stop before n=256 importance sampling unless the compressed toy case
      finds a marginal optimism not explained by the audit.
    controls:
      - Gaussian one-product control must reproduce paper Theorem 4.
      - No-compression CBD control must match exact one-coordinate dynamic programming.
      - Compare the valid union bound n*p with the independence formula 1-(1-p)^n.
      - Preserve exact modular representatives and rounding ties in the compressed toy case.
    required_metrics:
      - density_integral
      - radial_second_moment
      - one_coefficient_tail_probability
      - exact_any_coefficient_failure_probability
      - union_bound_slack
      - independence_formula_error
      - term_dependency_graph
    competing_explanations:
      - id: joint_geometry_only
        meaning: >-
          Equal-scale tails differ jointly, but exact one-coordinate laws match
          and only the independence formula changes; FIPS's union bound remains valid.
      - id: exact_FIPS_marginal_gap
        meaning: >-
          Compression or shared-variable dependence changes the exact
          one-coordinate tail relative to the estimator; a claim-changing
          finite-n study is justified.
      - id: paper_scale_artifact
        meaning: >-
          The reported norm gap disappears or materially changes after matching
          second moments, so Figure 4 cannot support extrapolation.
  falsification_conditions:
    - The Gaussian control does not reproduce Theorem 4 after conventions are aligned.
    - The derivation cannot match the normative compression and modular semantics.
    - A discrepancy is reported without separating marginal error from union-bound slack.
    - The toy enumerator drops probability mass or fails normalization checks.
  confounders:
    - Reusing sigma for input and product standard deviations.
    - Treating uncorrelated CBD Fourier coordinates as independent.
    - Replacing the union bound with an independence formula.
    - Treating one oracle query, one ciphertext, and one failure as interchangeable.
    - Using floating-point approximations at exact rounding boundaries.
  interpretation_limits:
    - A toy discrepancy is a mechanism check, not a revised n=256 DFP.
    - A matching toy result does not prove the n=256 compression model exact.
    - No outcome demonstrates a passive or deployable attack.
    - Infrastructure failure is not mathematical evidence.
  stopping_rule: >-
    Stop after the symbolic audit if no exact-FIPS marginal assumption is
    challenged. If a toy marginal gap appears, freeze an importance-sampling
    protocol and success criterion before any n=256 run.
  estimated_cost:
    implementation: low
    compute: low
    implementation_components:
      - exact density normalization and moment checks
      - FIPS noise dependency derivation
      - toy exact CBD enumerator
      - compression and modular-rounding controls
    memory_gb: '<1'
  recommended_priority: high

gate_ranking_rationale: >-
  GATE-THORNS-FIPS-001 ranks ahead of n=256 Monte Carlo or attack
  implementation because it directly tests both potential claim-changing
  links—the displayed scale and the exact FIPS marginal/union-bound
  calculation—without attempting to observe a 2^-138.8 or smaller event.
  A full rare-event campaign is more expensive and uninterpretable until these
  identities are fixed.

test_first:
  gate_id: GATE-THORNS-FIPS-001
  flag: true
  reason: >-
    It is the cheapest valid discriminator: outcome A confines the paper to a
    joint-distribution mechanism, while outcome B identifies the exact FIPS
    marginal that needs finite-n replication.

bottom_line: >-
  ePrint 2026/1022 proves a clean fixed-dimension, large-radius geometry for
  one product of continuous Gaussian polynomials and gives exact identities
  explaining known LAC pattern families. It does not transfer that theorem to
  FIPS 203's bounded CBD inputs, multiple dependent convolution and
  compression terms, modular decoding, or n=256 failure probabilities. It
  supplies no passive ML-KEM attack and no quantified improvement to
  conditional failure boosting. Its ML-KEM relevance is presently a modeling
  hypothesis, further weakened by an apparent variance mismatch in the
  displayed independence surrogate.

scope_limits:
  - Literature, theorem reconstruction, and symbolic protocol mapping only; no experiment was run.
  - No official hypothesis, evidence, decision, experiment, proposal, or goal state is changed.
  - No source absence is treated as a hardness or novelty theorem.
  - No operational testing against deployed systems is authorized.
  - Failure-oracle query counts remain separate from traces, targets, preprocessing, and protocol confirmation.

