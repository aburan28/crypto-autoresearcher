    identifiers; explicitly supplied 2023, 2024, and 2025 years are preserved.
  accessed_at: '2026-07-23'
  supplied_count: 69
  screened_count: 69
  primary_index: https://eprint.iacr.org/
  evidence_boundary: >-
    Classification is literature triage, not acceptance of any paper's claim
    and not an official research-state transition.

method:
