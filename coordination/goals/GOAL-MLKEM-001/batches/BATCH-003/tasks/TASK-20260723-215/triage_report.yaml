classification_legend:
  direct_ml_kem_claim_changing: >-
    Directly targets a quantity in the current ML-KEM map and could change a
    scoped claim if its exact assumptions and end-to-end cost bridge survive.
  adjacent_methodology: >-
    Supplies a potentially transferable method or migration/implementation
    lesson but does not itself change an ML-KEM claim.
  background_pedagogy: >-
    Directly discusses ML-KEM but is expository and presents no identified new
    analysis affecting the map.
  irrelevant: >-
    Does not bear on the scoped ML-KEM quantities, or merely uses lattice/LWE
    terminology in a construction without supplying cryptanalysis.

summary:
  direct_ml_kem_claim_changing: 2
  adjacent_methodology: 6
  background_pedagogy: 1
  irrelevant: 60
  research_map_result: >-
    Beyond the two already delegated papers, 2026/1022 and 2026/1465, no
    supplied item changes the current ML-KEM research map at triage depth.

claim_changing_follow_ups:
  - eprint_id: 2026/1022
    task_id: TASK-20260723-213
    status: already_delegated_to_sibling
    bounded_follow_up:
      wall_clock_seconds: 2400
      memory_gb: 4
      maximum_runs: 1
      discriminator: >-
        Map the paper's Gaussian convolution, canonical-embedding, correlation,
        and large-deviation assumptions to the exact FIPS 203 CBD,
        compression, and decapsulation-noise law. Separate honest DFR from
        adversarially forced failure/oracle behavior.
      positive_meaning: >-
        An exact-distribution bridge that changes a named FIPS DFR metric or a
        fully charged conditional failure-attack metric warrants a scoped map
        update.
      negative_meaning: >-
        A result confined to Gaussian inputs, norm surrogates, or an assumed
        failure oracle does not revise passive MLWE or ideal-interface DFR.
      stop_rule: >-
        Stop when the exact FIPS distribution/compression bridge is either
        derived or an explicit violated assumption is identified.
  - eprint_id: 2026/1465
    task_id: TASK-20260723-214
    status: already_delegated_to_sibling
    bounded_follow_up:
      wall_clock_seconds: 2400
      memory_gb: 4
      maximum_runs: 1
      discriminator: >-
        Determine whether the reported 1.5x--8x reduction-probability factors
        alter only a local constant, an asymptotic sieve exponent, or a
        reoptimized end-to-end ML-KEM lattice-attack estimate under one named
        cost model.
      positive_meaning: >-
        A full bridge through list size, iterations, memory/routing, BKZ, and
        final search that changes a matched model-specific ML-KEM cost warrants
        a scoped estimate update.
      negative_meaning: >-
        A constant local pair-reduction advantage with no exponent or
        end-to-end optimizer change leaves the BATCH-002 security-bit rows
        unchanged.
      stop_rule: >-
        Stop once exponent versus constant is proved and every unbridged attack
        term is named; do not substitute the local factor directly into a
        security-bit table.

special_handling:
  eprint_2026_155: >-
    Already reviewed in BATCH-002. It gives MLWE/IP-M-EDCP reductions and
    equivalences but no efficient structured-EDCP solver, standardized solve,
    or attack-cost improvement.
  eprint_2026_1098: >-
    Pedagogical. Its abstract states an undergraduate/early-graduate
    introduction to ML-KEM, ML-DSA, FN-DSA, lattices, LWE, and LLL; no new
    security analysis was identified.
  sibling_scope: >-
    2026/1022 and 2026/1465 are classified here but their theorem-level and
    cost-level conclusions belong to TASK-20260723-213 and TASK-20260723-214.

