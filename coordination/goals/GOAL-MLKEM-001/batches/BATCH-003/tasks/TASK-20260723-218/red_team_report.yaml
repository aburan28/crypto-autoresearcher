red_team_report:
  id: RT-20260723-002
  task_id: TASK-20260723-218
  goal_id: GOAL-MLKEM-001
  batch_id: BATCH-003
  role: red-team
  as_of: '2026-07-23'
  official_state_change: none

  inference:
    requested_policy: review-xhigh
    resolved_model_id: gpt-5.6-sol-xhigh
    reasoning_effort: xhigh
    fallback_used: false
    adapter_version: cursor-subagent-2026-07

  snapshot:
    commit_sha: 7393bb5b2ca09bbc1b55edcccea1ff313d52a668
    parent_sha: 3076dbe0335c4eb7e4fe8a370ca7010438d43c25
    receipt_path: coordination/goals/GOAL-MLKEM-001/batches/BATCH-003/archives/TASK-20260723-216/snapshot-receipt.json
    admissibility: verified
    verification: >-
      The commit is reachable from HEAD, has the receipt's parent, changes
      exactly the six declared producer artifacts plus the receipt, and the
      six reviewed contents match the receipt SHA-256 values. No
      working-tree-only producer artifact was used as durable evidence.

  claim_under_review: >-
    Whether ePrint 2026/1022, ePrint 2026/1465, or any of the 69 supplied
    papers changes a FIPS 203 decryption-failure statement, conditional
    failure-attack cost, passive MLWE conclusion, matched lattice-attack
    estimate, or ML-KEM migration-security conclusion.

  overall_verdict: >-
    No claim-changing ML-KEM transfer survives. The Thorns paper presently
    supplies a Gaussian one-product geometry and a one-way explanation of
    known LAC patterns, not an exact ML-KEM DFR or attack. The sieve paper
    supplies exact iid ball-model pair probabilities and conditional global
    output asymptotics, not a practical sieve or ML-KEM cost. The 69-paper
    screen is useful lead triage but is not evidence that all 60 abstract-level
    exclusions are substantively irrelevant.

  objections:
    - id: O-THORNS-001
      severity: fatal_to_FIPS_transfer
      target: ePrint_2026_1022_theorem_domain
      objection: >-
        Theorems 1, 2, and 4 concern fixed dimension, an unbounded continuous
        radial tail, independent complex embedding coordinates, and one
        product of coefficient-Gaussian polynomials over real number-field
        arithmetic. ML-KEM has bounded CBD inputs, multiple products, shared
        nonlinear compression errors, modulo-q representatives, and a
        coefficientwise bit-decoding event. No theorem bridges those changes.
      cheapest_discriminator: >-
        Derive one exact no-compression CBD output-coordinate law directly in
        coefficient space and compare it with the pinned scalar-convolution
        calculation. Joint thorn geometry cannot change that marginal.
      surviving_scope: Gaussian_one_product_directional_large_deviations_only

    - id: O-THORNS-002
      severity: fatal_to_norm_underestimation_claim_as_written
      target: ePrint_2026_1022_Section_5_4
      objection: >-
        Under the paper's explicit CN(0,sigma^2) convention, the product
        amplitude has E[R^2]=sigma^4, while the displayed surrogate
        f(r)=r exp(-r^2/(4 sigma^2))/(2 sigma^2) has
        E[R^2]=4 sigma^2. At the plotted sigma=10 this is a factor-25
        variance mismatch. Density crossings also do not prove stochastic
        domination of the norm.
      error_classification: >-
        Substantive normalization inconsistency in the printed argument unless
        an unstated redefinition of sigma is supplied; not a parser artifact.
        It does not invalidate Theorem 4.
      cheapest_discriminator: >-
        Replace the surrogate by the equal-second-moment density
        2r exp(-r^2/sigma^4)/sigma^4 and recompute the claimed crossing and
        tail-order statements before any cryptographic extrapolation.

    - id: O-THORNS-003
      severity: repairable_proof_gap
      target: ePrint_2026_1022_Theorem_1_lower_bound
      objection: >-
        The fixed-radius polydisc centered at R*u is not contained in
        {||z||_2>R}; it contains inward perturbations. Centering at
        (R+C)u for a fixed sufficiently large C appears to repair the
        containment without changing the speed-R exponent.
      error_classification: genuine_local_proof_flaw_not_a_disproof
      required_repair: >-
        State the shifted set, prove norm and directional containment
        uniformly, and carry its O(1) shift through the density bound.

    - id: O-THORNS-004
      severity: blocks_exact_FIPS_derivation
      target: producer_lifted_noise_identity
      objection: >-
        nu=e^T y+e2+c_v-s^T e1-s^T c_u is exact in R_q, but a claimed
        integer lift also needs an explicit representative convention and
        possible q-multiple wrap terms. Calling the displayed integer formula
        exact before those choices are frozen risks an agent derivation error.
      cheapest_discriminator: >-
        State and prove the identity first modulo q, then choose centered
        representatives and record every wrap variable before evaluating a
        tail threshold.

    - id: O-THORNS-005
      severity: blocks_DFR_revision
      target: FIPS_203_estimator_transfer
      objection: >-
        The pinned script ends in n times a one-coordinate tail, a union bound
        that does not require coefficient independence. Thorns can change the
        slack or the exact any-coordinate probability, but cannot invalidate
        that inequality. The open issue is instead whether the script's
        independent uniform rounding-error model and Python rounding semantics
        reproduce exact FIPS compression marginals. The Thorns paper supplies
        no counterexample to that marginal.
      scope_correction: >-
        FIPS Table 1 contains listed rates under a random-function heuristic;
        they are not transformed by this review into rigorous exact bounds.

    - id: O-THORNS-006
      severity: fatal_to_attack_claim
      target: conditional_failure_and_passive_attack_path
      objection: >-
        The paper supplies neither an observable failure bit nor an algorithm
        to recover an unknown secret's useful embedding index. Target
        acquisition, chosen-ciphertext validity, oracle construction, target
        count, adaptive queries, source recovery, rank/uniqueness,
        preprocessing, memory, confirmation, and end-to-end key recovery are
        all absent. A geometric score is not an attack.

    - id: O-SIEVE-001
      severity: fatal_to_security_bit_delta
      target: ePrint_2026_1465_probability_ratios
      objection: >-
        Factors 4.5, 3, and 8 compare optimized-sign ball cases to a
        fixed-sign sphere baseline. Against an optimized-sign sphere control,
        the corresponding ratios are 2.25, 1.5, and 4. The practical local
        uniform-ball ratio tends to 1.5. These are pair-probability constants,
        not time, memory, BKZ, or security-bit deltas, and the
        0.2075187496 list exponent is unchanged.

    - id: O-SIEVE-002
      severity: source_statement_error_with_narrow_repair
      target: ePrint_2026_1465_Lemma_1
      objection: >-
        The PDF's Lemma 1 prints min(||X||,||Y||) for the local events, while
        the paper's definition, Section 2 distributions, Lemma 3, and
        Sections 3.4--3.5 use max. Search indexing and independent extraction
        reproduce the printed min, so this is not a parser artifact.
      error_classification: genuine_notation_error_not_failure_of_max_rule_results
      countercheck: >-
        The printed min rule would give asymptotic fixed-/optimized-sign
        factors 0.75 and 1.5 relative to fixed-sign p_n, not the printed
        1.5 and 3.

    - id: O-SIEVE-003
      severity: proof_completeness_gap
      target: ePrint_2026_1465_nonuniform_global_asymptotic
      objection: >-
        The paper derives a pointwise fixed-depth kernel asymptotic and then
        inserts it under an unbounded double integral. Finiteness of
        M_f=integral f(w)e^(w/3)dw is plausible as a domination condition, but
        the displayed proof does not provide a uniform bound, a dominated
        convergence argument, or tail truncation controlling depths that grow
        with n.
      error_classification: >-
        Missing rigor, not a demonstrated false theorem. The exact
        uniform-ball finite-n formulas do not depend on this objection.
      cheapest_discriminator: >-
        Prove a uniform integrable envelope and a truncate-then-limit argument,
        or restrict the result explicitly to the two exponential inputs and
        verify the tails directly.

    - id: O-SIEVE-004
      severity: blocks_estimator_bridge
      target: proposed_R07_radial_rewrite
      objection: >-
        R07's C, W/Wmatched, ngr, eta, popcount pass law, list supply,
        bucket occupancy, recursive false negatives, and routing are all
        spherical and coupled. A radial switch must integrate the joint
        (r_x,r_y,angle,filter) law; replacing C by 1.496071 is invalid.
        Moreover, iid uniform-ball radii are a treatment choice, not measured
        R07/G6K list data. The proposed rewrite is therefore a substantial
        model redesign and sensitivity test, not a cheap paper replication.

    - id: O-TRIAGE-001
      severity: blocks_exhaustive_relevance_claim
      target: 69_paper_screen
      objection: >-
        Sixty exclusions were made at title/abstract depth. That supports
        "no further lead identified at triage depth," not a durable claim that
        all 60 papers are irrelevant. A risk-based independent rescreen found
        no false negative among the nonirrelevant set and the lattice/LWE/KEM
        exclusions checked, but it was not a 60-paper full-text review.
      narrow_survivor: lead_ranking_only

    - id: O-TRIAGE-002
      severity: classification_overreach
      target: direct_claim_changing_label
      objection: >-
        After theorem-level review, 2026/1022 is an adjacent modeling lead for
        ML-KEM unless an exact marginal or oracle bridge is found.
        2026/1465 is a direct sieve-model sensitivity lead but not direct
        ML-KEM evidence. 2026/1467 is directly about migration measurement,
        yet its stated replication URL returned 404 and the abstract leaves
        external predictive validation open. None should be promoted as a
        changed security claim.

  source_error_classification:
    - issue: Thorns_Theorem_1_polydisc
      classification: genuine_repairable_proof_flaw
    - issue: Thorns_Section_5_4_sigma_scale
      classification: mathematical_normalization_inconsistency_or_unstated_notation_change
    - issue: Sieve_Lemma_1_min_vs_max
      classification: genuine_source_notation_error
    - issue: Sieve_nonuniform_limit_exchange
      classification: missing_uniform_integrability_argument
    - issue: producer_integer_lift_of_ML_KEM_noise
      classification: potential_agent_derivation_overclaim_until_representatives_are_fixed
    - issue: PDF_extraction
      classification: >-
        No material objection above rests only on parser damage; the min token
        is independently reproduced and each formula was checked against its
        surrounding definitions and proof.

  required_controls:
    - id: CTRL-THORNS-SCALE
      priority: first
      control: >-
        Symbolically normalize both Section 5.4 radial laws, compute their
        second moments, substitute the equal-moment Gaussian surrogate, and
        restate only threshold-specific tail comparisons that remain true.
      pass_condition: density_integrals_equal_one_and_scale_convention_is_unique

    - id: CTRL-THORNS-LDP
      priority: first
      control: >-
        Independently write the shifted-polydisc lower bound and verify all
        containment and O(1) terms. Do not cite the printed proof as complete.
      pass_condition: repaired_LDP_lower_bound_with_no_changed_rate

    - id: CTRL-FIPS-MARGINAL
      priority: first
      control: >-
        Derive the decryption equation modulo q from FIPS Algorithms 13--15,
        freeze centered representatives and exact tie rules, and compare one
        coefficient's direct CBD/compression law with the pinned estimator.
        Use an exact no-compression DP as the mandatory control. Add a
        compressed toy enumerator only if the symbolic comparison leaves a
        concrete marginal ambiguity.
      pass_condition: >-
        Every discrepancy is classified as marginal error, union-bound slack,
        representative error, or rounding artifact.

    - id: CTRL-SIEVE-LIMIT
      priority: before_nonuniform_theorem_promotion
      control: >-
        Supply uniform domination/tail truncation for the Exp(2/3) global
        output limit. Preserve the exact finite uniform-ball formulas as a
        separate result.
      pass_condition: limit_and_integral_interchange_is_justified

    - id: CTRL-R07-APPLICABILITY
      priority: deferred
      control: >-
        Before a full rewrite, enumerate every sphere-dependent R07 quantity,
        derive one joint radial-angle/filter integral, and identify empirical
        or model evidence for the chosen list radial law. A C-only mutation is
        a deliberately invalid negative control.
      pass_condition: coherent_joint_kernel_and_sphere_identity_control_exist

    - id: CTRL-TRIAGE
      priority: before_knowledge_promotion
      control: >-
        Keep all abstract-only exclusions labeled triage dispositions. Promote
        only 2026/1022 and 2026/1465 as scoped literature mechanisms, and
        record 2026/1467 as unreplicated migration evidence if it is retained.
      pass_condition: no_abstract_only_item_is_used_as_negative_security_evidence

  counterexample_or_mutation:
    name: equal_scale_no_compression_split
    design: >-
      First replace the Thorns Gaussian surrogate with the unique
      equal-second-moment CN law. Separately remove ML-KEM compression in a
      small exact CBD instance and compute both the one-coordinate marginal
      and the exact any-coordinate event. The one-coordinate DP must match
      regardless of convolutional inter-coordinate dependence; only the joint
      event and union-bound slack may move.
    discriminates:
      - paper_scale_artifact
      - joint_geometry_without_marginal_change
      - exact_FIPS_marginal_error
    stop_rule: >-
      Stop before rare-event simulation if the exact marginal matches and the
      only discrepancy is joint dependence or the paper's scale convention.

  baseline_comparison:
    pollard_rho_and_BSGS: >-
      Inapplicable: the reviewed targets are MLWE/DFR and lattice sieving, not
      a generic-group discrete logarithm. No comparison to Pollard-rho or BSGS
      can support an ML-KEM claim.
    DFR_baseline: >-
      The closest calculation is the FIPS-cited pq-crystals
      security-estimates scalar-convolution model followed by an n*p union
      bound; Fang-Wang-Zhao 2022/212 is the closer concrete-key dependency
      analysis. Thorns does not replace either with an exact FIPS marginal.
    failure_attack_baseline: >-
      D'Anvers-Batsleer 2021/193 supplies a costed Kyber multitarget
      failure-boosting framework; Guo-Johansson-Yang 2019/1308 supplies the
      costed LAC pattern attack. Thorns supplies no improved target rate,
      oracle, query count, preprocessing, memory, or recovery probability.
    sieve_baseline: >-
      The closest inspectable bridge is pinned R07
      d197843ddb406102ba101f426ea5a59e8a8a306f, whose list, filters,
      buckets, memory, and routing are coupled to spherical probabilities.
      The paper's local matched ratio is about 1.496071 at d=375, but no R07
      cost or outer ML-KEM optimizer has been rerun.
    end_to_end_path: >-
      Neither paper supplies relation collection, rank/uniqueness, target
      descent, source recovery, final secret recovery, or a standardized solve.
      The sieve paper additionally omits operational list dynamics and memory;
      the Thorns paper omits the oracle and target acquisition.

  gate_choice:
    selected: GATE-THORNS-FIPS-001_narrowed
    rejected_for_now: GATE-SIEVE-BALL-R07-001
    rationale: >-
      The narrowed Thorns audit is lower cost and more claim-relevant. Its
      normalization and modulo-q marginal checks can decide whether the
      paper's central DFR language has any exact FIPS foothold using symbolic
      work and a small DP. The R07 rewrite requires new joint radial/filter
      kernels, a source-wide implementation change, an applicability
      assumption unsupported by operational list data, and outer
      reoptimization; at best it yields a same-model constant sensitivity.
    order: thorns_audit_then_reassess_R07

  narrowest_supported_statement: >-
    At snapshot 7393bb5 and source cutoff 2026-07-23, ePrint 2026/1022
    supports a repairable fixed-dimension LDP for one continuous Gaussian
    polynomial product and deterministic one-way geometry for known LAC
    patterns; it does not change ML-KEM DFR, oracle, passive-hardness, or
    attack-cost claims. ePrint 2026/1465 supports exact finite-dimensional
    iid uniform-ball probabilities for the max local rule and constant-factor
    asymptotics inside its model; it does not change a sieve exponent or an
    ML-KEM estimate. The supplied-paper screen identifies no third lead at
    triage depth, which is not an exhaustive negative literature result.

  next_concrete_action: >-
    Freeze and execute the narrowed Thorns source-and-marginal audit:
    repair the Theorem 1 lower-bound set, resolve the Section 5.4 sigma scale,
    and derive one exact modulo-q FIPS output-coordinate law with representative
    and rounding controls against the pinned script. Stop if no marginal
    discrepancy survives; do not begin the R07 rewrite in that case until a
    separate radial-law applicability control is justified.

  primary_sources_inspected:
    - https://eprint.iacr.org/2026/1022
    - https://eprint.iacr.org/2026/1022.pdf
    - https://eprint.iacr.org/2026/1465
    - https://eprint.iacr.org/2026/1465.pdf
    - https://nvlpubs.nist.gov/nistpubs/fips/nist.fips.203.pdf
    - https://raw.githubusercontent.com/pq-crystals/security-estimates/75c26949a902ca297b181375bfb7cfaf22cce784/Kyber_failure.py
    - https://raw.githubusercontent.com/pq-crystals/security-estimates/75c26949a902ca297b181375bfb7cfaf22cce784/proba_util.py
    - https://github.com/sam-jaques/sieve-memory-estimates/tree/d197843ddb406102ba101f426ea5a59e8a8a306f
    - https://eprint.iacr.org/2022/212
    - https://eprint.iacr.org/2021/193
    - https://eprint.iacr.org/2019/1308
    - https://eprint.iacr.org/2026/802
    - >-
      Primary ePrint records for every nonirrelevant triage item and a
      risk-based sample of lattice/LWE/KEM exclusions.

  scope_limits:
    - No empirical ML-KEM failure run, lattice sieve, BKZ run, or attack was performed.
    - No source absence, timeout, 404, or parser behavior is mathematical evidence.
    - No full-text review of all 60 abstract-level triage exclusions was performed.
    - No FIPS rate, BATCH-002 cost, hypothesis, decision, or goal state is changed.
    - Toy or symbolic controls cannot establish n=256 rare-event probabilities by themselves.
    - All negative conclusions are limited to the named revisions, models, and checked attack paths.

  artifact_paths:
