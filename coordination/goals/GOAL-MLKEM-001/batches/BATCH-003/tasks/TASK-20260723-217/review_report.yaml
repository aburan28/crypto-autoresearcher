overall_review:
  producer_findings: supported_with_qualifications
  fatal_error_found: false
  material_qualifications:
    - >-
      Theorem 1 of 2026/1022 is not literally proved as printed. Its lower-bound
      polydisc has a real containment error, although a fixed outward shift
      repairs the exponent without changing the theorem statement.
    - >-
      The Gaussian-surrogate variance mismatch in 2026/1022 is genuine and
      invalidates the paper's displayed equal-standard-deviation comparison.
      The paper also does not prove universal stochastic norm underestimation.
    - >-
      The R07 follow-up is coherent only after a frozen joint radial-angular
      kernel derivation. Direction-only cap occupancy remains unchanged under an
      isotropic radial law; reduction-conditioned wedge, filter, recursion, and
      list terms cannot be replaced by one scalar factor.
    - >-
      In triage metadata, an ePrint approval date is a history event, not a PDF
      revision timestamp. This does not alter any relevance class.
  claim_changing_map_update_supported: false
  only_bounded_controls_motivated: true

thorns_review:
  source_claim_scope:
    inputs: one product of two independent real coefficient-Gaussian polynomials
    embedding_inputs: independent complex Gaussian coordinates
    asymptotic: fixed_dimension_and_radius_R_to_infinity
    excludes:
      - exact centered-binomial sampling
      - sums of ML-KEM module products
      - compression and decompression
      - modulo-q representatives
      - coefficientwise Compress_1 decoding
      - passive public-key key recovery

  gaussian_surrogate:
    paper_convention: 'Z ~ CN(0,sigma^2) means E[|Z|^2]=sigma^2'
    true_product_radial_density: 'f_real(r)=4r K_0(2r/sigma^2)/sigma^4'
    displayed_surrogate_radial_density: 'f_assum(r)=r exp(-r^2/(4sigma^2))/(2sigma^2)'
    normalization:
      true_product: 1
      displayed_surrogate: 1
    second_moments:
      true_product: 'E[|Z_1 Z_2|^2]=sigma^4'
      displayed_surrogate: 'E[R^2]=4sigma^2'
      displayed_ratio_surrogate_over_true: '4/sigma^2'
      ratio_at_sigma_10: 0.04
    equal_second_moment_surrogate: 'f_eq(r)=2r exp(-r^2/sigma^4)/sigma^4'
    verdict: producer_variance_objection_confirmed
    implication: >-
      Figure 4 at sigma=10 is not a matched-scale comparison. Even after scale
      repair, density crossings and equal finite second moments preclude the
      paper's unqualified claim of systematic norm underestimation. A specified
      far-tail inequality could still be true but is not proved here.

  theorem_1:
    reconstructed_rate: 'I(u)=c(||u||_1-1) on ||u||_2=1'
    speed: R
    denominator_rate: '-c'
    printed_gap: >-
      The fixed-radius polydisc centered at R*u contains inward perturbations
      with Euclidean norm below R, contrary to the proof's containment claim.
    repair: >-
      Center the polydisc at (R+C)u and choose C>sqrt(n)*epsilon. Then every
      point has norm above R, directions still converge to u, and the l1 cost is
      R||u||_1+O(1), leaving the speed-R lower exponent unchanged.
    repair_checks:
      containment: passes
      direction_in_open_set: passes_for_large_R
      tail_lower_bound_on_all_coordinates: passes_after_choosing_nonzero_coordinate_approximation
      exponent_unchanged: true
    verdict: theorem_plausibly_valid_with_local_written_proof_gap

  fips_transfer:
    exact_distributions:
      coefficient_law: 'Pr[CBD_eta=j]=binom(2eta,eta+j)/2^(2eta)'
      coefficient_variance: eta/2
      supports: {CBD_2: '[-2,2]', CBD_3: '[-3,3]'}
      n: 256
      q: 3329
    definitions:
      u0: 'A^T y+e_1'
      v0: 't^T y+e_2+mu'
      c_u: 'Decompress_du(Compress_du(u0))-u0'
      c_v: 'Decompress_dv(Compress_dv(v0))-v0'
      mu: 'Decompress_1(ByteDecode_1(m))'
    lifted_noise_identity: 'nu=e^T y+e_2+c_v-s^T e_1-s^T c_u'
    exact_failure_event: >-
      F={exists ell: Compress_1((mu+nu)_ell mod q) != m_ell}.
    theorem_coverage: >-
      The paper covers none of the exact CBD/compression/modular decoding chain
      as a theorem and covers only one continuous Gaussian product, not the
      dependent sum above.
    estimator_check:
      source_revision: 75c26949a902ca297b181375bfb7cfaf22cce784
      one_coordinate_model: >-
        Kyber_failure.py forms scalar CBD-product and independent
        modulus-switching-error convolutions, then evaluates a q/4 tail.
      final_step: 'return F, n*tail_probability(F,q/4)'
      union_bound: 'Pr[union_ell F_ell] <= sum_ell Pr[F_ell]'
      coefficient_independence_required: false
      independence_formula_not_used: '1-(1-p)^n'
      residual_issue: >-
        The modeled one-coordinate probability still assumes independent,
        uniform modulus-switching error laws. The script is not an exact proof
        of the full FIPS joint law, but 2026/1022 supplies no counterexample or
        corrected marginal.
    verdict: no_FIPS_DFR_change

  attack_implications:
    LAC_pattern_geometry: supported_as_deterministic_embedding_alignment
    all_attacks_succeed_precisely_via_thorns: not_proved_as_end_to_end_or_iff_claim
    passive_MLWE_attack: absent
    conditional_oracle_cost_improvement: absent

sieve_review:
  notation:
    A_n: 'I_{3/4}((n+1)/2,1/2)'
    B_n: 'I_{3/4}((n-1)/2,1/2)'
    fixed_sign_sphere_probability: 's_n=B_n/2'
    optimized_sign_sphere_probability: 's_n_pm=B_n'

  exact_uniform_ball_probabilities:
    G_minus: '3A_n/2'
    G_pm: '3A_n-2^(-n)'
    L_minus_max_rule: A_n
    L_pm_max_rule: '2A_n'
  exact_sign_matched_ratios:
    G_minus: '3A_n/B_n'
    G_pm: '(3A_n-2^(-n))/B_n'
    L_minus: '2A_n/B_n'
    L_pm: '2A_n/B_n'
  asymptotic_sign_matched_ratios:
    uniform_ball_global: 2.25
    uniform_ball_local: 1.5
    Exp_2_over_3_global: 4.0
  verdict_on_ratios: producer_formulas_confirmed
  sign_warning: >-
    The paper's factors 4.5, 3, and 8 use a fixed-sign sphere denominator for
    optimized-sign ball cases. Matched-sign factors are respectively 2.25, 1.5,
    and 4; none is an end-to-end speedup.

  local_min_max:
    printed_lemma_1: min
    model_definition_sections_and_proofs: max
    independent_depth_check:
      max_rule_multiplier_uniform_ball_fixed_sign: 'E[exp(|W_x-W_y|/3)]=3/2'
      min_rule_multiplier_uniform_ball_fixed_sign: 'E[exp(-|W_x-W_y|/3)]=3/4'
    verdict: definite_local_notation_error
    interpretation: The reported 1.5 and 3 constants are max-rule constants.

  exponent_and_cost:
    base_probability: 'p_n=(3/4)^(n/2)/sqrt(3*pi*n/8)'
    list_exponential_coefficient: 0.20751874963942185
    exponent_changed: false
    polynomial_n_minus_half_factor_changed: false
    pair_probability_constant_changed_under_model: true
    practical_list_size_or_round_count_derived: false
    classical_or_quantum_sieve_exponent_changed: false
    any_BATCH_002_cost_row_changed: false

  R07_bridge:
    source_revision: d197843ddb406102ba101f426ea5a59e8a8a306f
    verdict: coherent_only_as_a_new_full_joint_sensitivity_control
    supported_features:
      - R07 exposes reduction probability, list size, pair supply, filters, recursion, memory, routing, and optimizer choices.
      - A sphere-mode replay provides a strong frozen control.
      - The exact uniform-ball local rule is the appropriate first paper model; the global Exp(2/3) limit is not.
    required_repairs_to_candidate_protocol:
      - >-
        Keep C(d,theta) unchanged when it denotes direction-only cap occupancy:
        isotropic radial laws do not alter a normalized direction's cap probability.
      - >-
        Replace the combined reduction-and-common-bucket quantity, not W or C
        independently, by a joint integral over both radii and the angle.
      - >-
        Re-derive ngr, popcount false-negative eta, required pair supply, and
        recursive hit probabilities under the same joint law.
      - >-
        Freeze the conditional radial law after cap filtering and projection;
        it is not automatically uniform-ball in recursive subproblems.
      - >-
        Propagate resulting list, bucket, sorting, routing, and optimizer changes
        before quoting a same-R07 cost delta.
    interpretation_limit: >-
      The paper supplies reduction kernels, not the full R07 bridge. Until the
      above equations and controls pass, R07 is a motivated experiment design,
      not evidence changing 145.7/216.5/273.6 or any other BATCH-002 row.

