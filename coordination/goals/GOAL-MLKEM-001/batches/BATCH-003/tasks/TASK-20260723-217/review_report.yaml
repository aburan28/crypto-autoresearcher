claim_verdicts:
  - claim: The BATCH-003 producer snapshot is immutable and correctly bound.
    verdict: supported
    basis: Commit 7393bb5 has the receipt parent, exact seven-path snapshot, and all six recorded producer hashes.
  - claim: 2026/1022 uses a scale-matched Gaussian independence surrogate.
    verdict: contradicted
    basis: Its displayed second moments are sigma^4 and 4sigma^2.
  - claim: Theorem 1 of 2026/1022 is complete as printed.
    verdict: contradicted_but_repairable
    basis: The R*u polydisc is not contained in the strict outer sphere; a fixed outward shift repairs it.
  - claim: 2026/1022 changes a FIPS 203 decapsulation-failure rate.
    verdict: unsupported
    basis: No exact CBD, compression, modular, or coefficient-tail specialization is supplied.
  - claim: Convolution correlation invalidates the estimator's final n-fold step.
    verdict: false
    basis: The final step is a union bound and needs no coefficient independence.
  - claim: 2026/1022 changes passive MLWE hardness or a conditional-oracle attack cost.
    verdict: unsupported
    basis: No public-key solver, oracle construction, query advantage, or attack certificate is supplied.
  - claim: The sign-matched 2026/1465 uniform-ball factors are 2.25 globally and 1.5 locally.
    verdict: supported_under_iid_isotropic_model
  - claim: The paper's local 1.5 and 3 constants hold for its printed min rule.
    verdict: false
    basis: They are max-rule constants; the literal min fixed-sign constant is 0.75.
  - claim: 2026/1465 changes the lattice-sieve exponent.
    verdict: false_for_the_stated_admissible_models
    basis: Every probability retains the same exponential and n^(-1/2) factors.
  - claim: A 1.5-to-8 local ratio directly changes an ML-KEM security-bit row.
    verdict: false
    basis: Sign matching, lists, filters, recursion, memory, routing, BKZ, and outer optimization are unbridged.
  - claim: R07 is a coherent next control.
    verdict: supported_with_required_symbolic_kernel_stage
    basis: It exposes the relevant dependencies, but a full joint radial-angular rewrite must precede a cost rerun.
  - claim: The 69-paper triage omits another supplied claim-changing paper.
    verdict: not_found

