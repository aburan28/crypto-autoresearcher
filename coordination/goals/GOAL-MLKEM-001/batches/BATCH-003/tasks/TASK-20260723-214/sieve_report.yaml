pair_and_list_consequences:
  fixed_list:
    expected_reducing_unordered_pairs: 'E[R] = binom(N,2) p'
    effect_of_p_to_Cp: 'E[R] is multiplied by C'
    independent_pair_trials_to_one_success: '1/(Cp), a factor 1/C of the sphere value'
  one_pair_birthday_threshold:
    exact_equal_expectation_relation: >-
      N_new = (1 + sqrt(1 + 4*N*(N-1)/C))/2
    asymptotic_relation: 'N_new ~ N/sqrt(C)'
    scope: one expected pair in an iid fixed-list experiment
  saturation_neighbor_heuristic:
    relation: 'N p = Theta(1), hence N_new ~ N/C'
    log2_list_shift_if_transplanted: '-log2(C)'
    scope: >-
      A model-dependent saturation/list-supply heuristic, not a theorem of the paper.
  all_pairs_if_only_list_size_changed:
    relation: 'N^2 would scale by 1/C^2 under the saturation substitution'
    warning: >-
      Real sieve cost also depends on filter hits, false positives, vector
      generation, updates, memory, routing, and repeated rounds; this relation
      is not an end-to-end runtime bridge.

asymptotic_impact:
  reduction_probability_exponent:
    verdict: unchanged
    reason: >-
      Every stated probability retains (3/4)^(n/2)/sqrt(n) and differs only by
      a dimension-independent multiplier for a fixed admissible input law.
  canonical_list_exponent:
    verdict: unchanged
    value: '0.5*log2(4/3) = 0.20751874963942185'
    caveat: polynomial and constant factors can change.
  classical_or_quantum_sieve_time_exponents:
    verdict: not_changed_by_this_paper
    caveat: >-
      The paper analyzes pair reduction probabilities, not the complete
      nearest-neighbor/filter search or quantum circuit.
  polynomial_factor:
    verdict: unchanged
    reason: >-
      Sphere and ball probabilities all retain the n^(-1/2) prefactor; the
      proved advantages are Theta(1), with finite-n corrections.
  concrete_constant:
    verdict: changed_in_the_pair_model
    scope: factors 1.5, 2.25, or 4 in sign-matched comparisons
  list_size:
    verdict: not_derived
    possible_effect: constant_only_under_an_explicit_list_balance_heuristic
  number_of_rounds:
    verdict: not_derived
    reason: >-
      One conditioned global-output transform has limiting Exp(2/3) depth,
      but the paper does not model operational carryover, replenishment,
      dependencies, stopping, or local-reduction rounds.
  memory:
    verdict: no_direct_update
    possible_effect: constant_only_if_a_valid_list-size_bridge_is_proved

batch_002_model_comparison:
  primal_progressive_bkz:
    baseline: '141.4/204.3/276.5 log2 RAM-gate estimates'
    model_dependency: >-
      PSSearch uses a practical Pump fit with time terms based on c=0.367 and
      memory exponent c2=0.2075, plus progressive-BKZ and final-search costs.
    verdict: no_direct_update
    reason: >-
      The practical fit is calibrated to implemented sieve behavior and may
      already absorb the observed sphere-model gap. Adding log2(C) would
      double count unless the Pump fit and strategy search are rebuilt.
  core_svp_C0:
    baseline: '121.9/173.0/237.4 for corrected isometric dual'
    model_dependency: >-
      C0 suppresses lower-order and constant terms and uses an idealized
      Core-SVP call.
    verdict: unchanged_by_definition
  code_based_dual_CC_CN:
    baselines:
      CC: '139.1/194.7/259.0'
      CN: '134.5/188.7/254.1'
    model_dependency: >-
      The source family combines fitted angular sphere-filter costs and
      N=(sqrt(4/3))^beta short-vector supply with a uniform-ball radial model
      in score integrals. The corrected dual literature already uses a
      uniform-ball sieve-output heuristic rather than an all-on-one-sphere
      score model.
    verdict: no_direct_update
    open_effect: >-
      Exp(2/3) conditional reduction outputs could motivate a different radial
      score integral only after proving that the complete supplied short-vector
      list follows that law. All conditional filter probabilities, vector
      counts, score laws, and outer attack parameters then require reoptimization.
  provable_dual_and_QRS:
    verdict: not_targeted
    reason: >-
      Their distinguishing costs are driven by BKZ/discrete-Gaussian sampling
      and guessing formulas; the paper does not replace those samplers or
      repair the already-stale QRS Kyber parameterization.
  memory_routing:
    baseline: '145.7/216.5/273.6 log2 sieve cost at dimensions 375/586/829'
    source_revision: d197843ddb406102ba101f426ea5a59e8a8a306f
    direct_dependency: >-
      The pinned code uses the sphere-cap C(d,pi/3), list size
      2/((1-eta)C), expected-pair terms, and spherical conditional wedge/filter
      probabilities W; routing and sorting are then charged to those lists.
    verdict: closest_open_estimator_bridge
    prohibition: >-
      Replacing only C by a paper ratio while leaving W, eta, bucket loads,
      sign convention, and routing unchanged is not a coherent estimate.
  quantum_QN_Q0_GE19:
    baseline: BATCH-002 model-separated query/circuit tables
    model_dependency: >-
      Q0 suppresses constants. QN/GE19 inherit spherical list/filter
      probabilities, fitted finite-dimensional costs, and unit-cost QRACM
      assumptions.
    verdict: no_direct_update
    reason: >-
      A constant pair-probability change neither changes the published quantum
      exponent nor supplies revised QRACM, filter, circuit, or outer dual costs.
  asymptotic_quantum_sieve:
    baseline: '2^(0.2571*d + o(d))'
    verdict: exponent_unchanged
  physical_quantum_sieve:
    baseline: 'dimension-400 spherical-LSF GaussSieve case study'
    verdict: no_direct_update
    reason: >-
      Qubit and elapsed-time projections require a compiled architecture and
      explicit list/filter/routing changes; the source is not a complete
      ML-KEM attack in the first place.

claim_verdicts:
  - id: C01
    claim: The sphere-to-ball reduction-probability gap is asymptotically constant.
    verdict: supported_under_stated_model
    basis: Lemmas 1--2, Corollaries 1--2, and the shared p_n exponential term.
  - id: C02
    claim: Uniform-ball probabilities have exact finite-dimensional formulae.
    verdict: supported_with_local_notation_repair
    basis: Lemma 3 and Sections 3.2--3.5; local constants use the max rule.
  - id: C03
    claim: Global conditional output scaled depth tends to Exp(rate=2/3).
    verdict: supported_under_moment_and_iid_isotropy_conditions
    basis: Lemma 6, Proposition 1, and Equation 13.
  - id: C04
    claim: Exp(2/3) is the stationary radial law of a complete practical sieve.
    verdict: not_established
    basis: >-
      The theorem concerns conditional outputs of independent model pairs and
      omits carryover vectors, dependencies, collisions, saturation, filtering,
      and lattice discreteness.
  - id: C05
    claim: The paper changes classical or quantum sieve exponents.
    verdict: not_supported
    basis: All derived advantages are constant multipliers of p_n.
  - id: C06
    claim: The largest reported factor eight is an eightfold matched practical speedup.
    verdict: not_supported
    basis: >-
      Eight is global optimized-sign Exp(2/3) probability relative to a
