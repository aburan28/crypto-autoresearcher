bottom_line: >-
  ePrint 2026/1465 closes the sphere-versus-ball asymptotic-gap question inside
  its iid isotropic model: the advantage is constant, not exponential. It
  changes expected local pair counts by explicit multiplicative factors and
  can change list and runtime constants only after a declared list heuristic.
  It does not change a sieve exponent, a current BKZ/SVP cost, any BATCH-002
  model-specific number, or an ML-KEM security estimate. The first valid bridge
  is a coherent pinned R07 radial rewrite and same-model reoptimization, not a
  subtraction of log2 of a local probability ratio.
