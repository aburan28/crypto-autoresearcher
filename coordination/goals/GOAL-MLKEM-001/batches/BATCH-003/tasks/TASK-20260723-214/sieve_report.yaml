cheapest_benchmark_estimator_gate:
  id: IDEA-20260723-001
  gate_id: GATE-SIEVE-BALL-R07-001
  filing_status: task_local_candidate_not_filed_in_ledger
  title: Coherent radial rewrite of the pinned memory-routing estimator
  class: control
  novelty_status: adaptation
  novelty_basis: >-
    The paper's ball laws and R07's estimator are known; the candidate adapts
    the exact local law to a coherent same-model sensitivity test. Corpus,
    hypothesis-ledger, proposal-ledger, and web checks found no prior record of
    this specific R07 rewrite, but no novelty claim stronger than adaptation is made.
  claim: >-
    In the pinned two-dimensional memory-routing estimator, a coherent
    uniform-ball local-reduction rewrite changes finite-dimensional intercepts
    and list/memory terms but not the dimension slope; its reoptimized
    ML-KEM-512 same-model cost delta can be measured without claiming a
    cross-model security-bit change.
  mechanism: >-
    Replace every sphere-dependent reduction and conditional-filter quantity,
    not only the unconditional cap probability, then propagate the resulting
    list size, pair supply, bucket load, memory, routing, and optimizer choices.
  assumptions:
    - The pinned R07 revision and its two-dimensional routing model are the control.
    - The first treatment uses the paper's exact uniform-ball local rule, not its global Exp(2/3) limit.
    - Sign conventions, success target, routing constant, and non-sieve terms are held fixed.
    - Any standardized cost comparison remains within the R07 model label.
  predictions:
    - metric: absolute_treatment_minus_control_log2_cost_slope
      direction: lower
      minimum_effect: 'at most 0.001 per dimension'
    - metric: local_reduction_probability_at_d375
      direction: higher
      minimum_effect: matched uniform-ball ratio 1.49607143992129
    - metric: reoptimized_log2_sieve_cost_at_d375
      direction: lower
      minimum_effect: null
    - metric: reoptimized_log2_list_bits_at_d375
      direction: lower
      minimum_effect: null
  minimal_test:
    design: >-
      Fork pinned R07 only inside a future experiment. Add a radial-law switch
      to C, Wmatched/W, ngr, eta, list-size, expected-solution, bucket, and
      routing paths. First reproduce the sphere control at d=375. Validate the
      uniform-ball local kernel against the exact beta formula, then rerun the
      full d=375 hardware-time optimization with routing constant 2^-12.8 and
      unchanged success target. Run d=586 and 829 only if the d=375 control
      passes and the treatment changes an optimizer choice or at least 0.25
      log2 cost.
    controls:
      - Original R07 sphere mode reproduces 145.7 log2 sieve cost within 0.1.
      - Sphere radial mode is bit-for-bit identical to the pinned control.
      - Uniform-ball unconditional local probability matches Lemma 3 within 1e-8 relative error.
      - Sign handling is matched; no optimized-sign factor two is counted twice.
      - Same routing constant, geometry, success target, optimizer bounds, and non-sieve terms.
    required_metrics:
      - exact and modeled reduction probability
      - list vectors and list bits
      - expected reducing pairs
      - conditional filter hit and false-negative probabilities
      - code/filter count and bucket occupancy
      - routing/sorting cost
      - total sieve cost and extrapolated full-primal cost
      - selected optimizer parameters
  competing_explanations:
    - id: local_constant_only
      meaning: >-
        Exact pair probabilities change, but fitted exponents and optimizer
        structure do not; only an intercept/list prefactor can move.
    - id: optimizer_coupled_concrete_effect
      meaning: >-
        Radial conditional filters change bucket, routing, or optimizer choices
        enough to alter the complete same-model concrete cost, while the
        asymptotic exponent remains unchanged.
    - id: model_not_applicable
      meaning: >-
        Sphere controls fail or operational list data do not support the iid
        uniform-ball law, so the paper cannot be transplanted into R07.
  outcomes:
    - id: constant_only
      meaning: >-
        Controls pass, finite costs move by O(1), and the fitted slope is
        unchanged; the paper is an estimator-intercept refinement only.
    - id: interaction_requires_follow_up
      meaning: >-
        Controls pass but conditional filters or reoptimization produce a
        dimension-dependent shift; this is an algorithm-model interaction
        not implied by the paper and requires independent review and actual
        sieve-distribution validation.
    - id: no_transplant
      meaning: >-
        Actual or model-consistent local data reject both uniform-ball and
        admissible Exp(2/3) inputs, or the radial rewrite cannot reproduce the
        sphere control; no BATCH-002 update is warranted.
  falsification_conditions:
    - The sphere control misses the pinned result by more than 0.1 log2.
    - The treatment changes only C while leaving W, eta, or bucket/routing dependencies spherical.
    - The exact uniform-ball local probability control fails.
    - A factor from optimized signs is counted both in the radial kernel and list convention.
    - Any claimed ML-KEM delta is reported before the same-model outer attack is reoptimized.
  confounders:
    - Uniform-ball output is already used in some dual score models but not in R07 filtering.
    - Practical G6K lists are dependent, partially saturated, and implementation-specific.
    - The paper's Exp(2/3) theorem is global-output only; it does not supply a local steady-state kernel.
    - Routing constants and fitted lower-order terms can dominate a sub-bit local change.
  interpretation_limits:
    - One d=375 replay updates only the pinned R07 model for ML-KEM-512.
    - It does not update C0, CC, CN, QN, Q0, GE19, QRS, or physical costs.
    - It is an estimator sensitivity test, not an observed ML-KEM attack or solve.
  estimated_cost:
    implementation: medium
    compute: medium
    cheapest_first_stage: one pinned d=375 control/treatment pair
    implementation_components:
      - radial-law switch across all sphere-dependent terms
      - exact beta-function probability controls
      - list, bucket, and routing propagation
      - same-model outer optimizer rerun
    memory_gb: '<4'
    maximum_runs_first_stage: 2
  recommended_priority: high
  ranking_rationale: >-
    R07 is the cheapest valid first target because its source exposes the
    sphere cap, conditional wedge, list, pair, bucket, and routing dependencies
    that must all be bridged. PSSearch is empirically fitted, the corrected
    dual family already uses uniform-ball radial scores, and quantum/physical
    models add more assumptions. A d=375 replay is therefore the smallest
    same-model test that can separate a harmless local constant from a
    reoptimized memory-routing effect.

scope_limits:
  - Continuous iid isotropic models are not empirical distributions of a complete lattice sieve.
  - The asymptotic theorem does not quantify finite-dimensional non-uniform-ball error.
  - The Exp(2/3) output theorem is for global reductions, not the practical local rule.
  - No code artifact, benchmark, BKZ run, SVP solve, or ML-KEM attack was provided by the paper.
  - No conclusion here changes an official hypothesis, experiment, evidence, decision, or goal state.

