notation:
  distances:
    fixed_sign: 'D_-(x,y) = ||x-y||'
    optimized_sign: 'D_pm(x,y) = min(||x-y||, ||x+y||)'
  reduction_rules:
    global: 'D(x,y) <= 1 after scaling the active radius to one'
    local: 'D(x,y) <= max(||x||, ||y||), so the longer input can be replaced'
  cases:
    G_minus: global, fixed sign
    G_pm: global, optimized sign
    L_minus: local, fixed sign
    L_pm: local, optimized sign
  beta_terms:
    A_n: 'I_{3/4}((n+1)/2, 1/2)'
    B_n: 'I_{3/4}((n-1)/2, 1/2)'

paper_model_assumptions:
  stated_or_used:
    - >-
      The Gaussian heuristic is used to motivate a continuous isotropic model;
      this is a modeling assumption, not a consequence proved for a sieve list.
    - Pair inputs are independent and identically distributed.
    - Direction is uniform on S^(n-1) and independent of radius.
    - The active ball radius is scaled to one.
    - >-
      A global step replaces the largest list element after a combination of
      norm at most one is found; a local step replaces the longer member when
      the combination is no longer than that member.
    - The optimized-sign case tests both x-y and x+y and keeps the shorter.
    - >-
      Scaled-depth limits hold pointwise near the boundary, and the
      non-uniform global theorem requires a finite exponential moment M_f.
  not_modeled:
    - lattice discreteness, duplicate vectors, or arithmetic cost
    - dependent pair selection, list saturation, and survivor carryover
    - nearest-neighbor indexing, filter false positives, or bucket occupancy
    - vector replenishment, stopping rules, and a complete number of rounds
    - memory traffic, routing, BKZ integration, and outer ML-KEM optimization

probability_distribution_catalog:
  conventions:
    I_x: regularized_incomplete_beta
    B: beta_function
    a_sphere: '(n-1)/2'
    f_star: >-
      Output PDFs are unnormalized when the probability space is restricted
      to reductions; integrating over the reduction range gives the total
      reduction probability.
  directional_coordinate_for_U_on_S_n_minus_1:
    signed_cdf: 'F_U1(z)=I_{(z+1)/2}((n-1)/2,(n-1)/2), -1<=z<=1'
    absolute_cdf: 'F_|U1|(z)=I_{z^2}(1/2,(n-1)/2), 0<=z<=1'
  sphere_output:
    G_minus_cdf: >-
      F_G_sphere(z)=I_{z^2/4}((n-1)/2,(n-1)/2), 0<=z<=2.
    G_minus_pdf: >-
      f_G_sphere(z)=z^(n-2)(1-z^2/4)^((n-3)/2)/
      B((n-1)/2,1/2), 0<=z<=2.
    G_pm_cdf: 'F_Gpm_sphere(z)=2F_G_sphere(z), 0<=z<=sqrt(2)'
    G_pm_pdf: 'f_Gpm_sphere(z)=2f_G_sphere(z), 0<=z<=sqrt(2)'
    local_global_relation: identical_because_both_input_norms_equal_one
  uniform_ball_radius:
    cdf: 'F_R(r)=r^n, 0<=r<=1'
    pdf: 'f_R(r)=n*r^(n-1), 0<=r<=1'
    scaled_depth_survival: 'Pr[W>=w]=(1-w/n)^n, 0<=w<=n'
    scaled_depth_limit: 'W=n(1-R) converges in distribution to Exp(rate=1)'
  uniform_ball_output:
    shared_G_minus_cdf: >-
      F_G(z)=z^n I_{1-z^2/4}((n+1)/2,1/2)
      +I_{z^2/4}((n+1)/2,(n+1)/2), 0<=z<=2.
    shared_G_minus_pdf: >-
      f_G(z)=n*z^(n-1) I_{1-z^2/4}((n+1)/2,1/2),
      0<=z<=2.
    G_pm_cdf: >-
      F_Gpm(z)=2F_G(z)-z^(2n)/2^n*(2F_G(2/z)-1),
      0<=z<=sqrt(2), with F_G(t)=1 for t>2.
    G_pm_pdf: >-
      f_Gpm(z)=2f_G(z)-n*z^(2n-1)/2^(n-1)*(2F_G(2/z)-1)
      +z^(2n-2)/2^(n-2)*f_G(2/z), 0<=z<=sqrt(2).
    L_minus_cdf: >-
      F_L(z)=F_G(z)-(1/2)z^(2n)I_{3/4}((n+1)/2,1/2),
      0<=z<=1.
    L_minus_pdf: >-
      f_L(z)=f_G(z)-n*z^(2n-1)I_{3/4}((n+1)/2,1/2),
      0<=z<=1.
    L_pm_cdf: 'F_Lpm(z)=2F_L(z), 0<=z<=1'
    L_pm_pdf: 'f_Lpm(z)=2f_L(z), 0<=z<=1'
  arbitrary_isotropic_ball:
    input: 'X,Y iid as R*U(S^(n-1)); R has arbitrary PDF f on [0,1]'
    angle_threshold: 'g(x,y,z)=(x^2+y^2-z^2)/(2xy)'
    kernel: >-
      E_n(x,y,z)=z/(xy)*(1-g(x,y,z)^2)^((n-3)/2)/
      B((n-1)/2,1/2).
    fixed_sign_conditional_cdf_kernel: >-
      H_minus(g)=0 for g>=1; 1 for g<=-1; and
      I_{(1-g)/2}((n-1)/2,(n-1)/2) for -1<g<1.
    optimized_sign_conditional_cdf_kernel: >-
      H_pm(g)=0 for g>=1; 1 for g<=0; and
      I_{1-g^2}((n-1)/2,1/2) for 0<g<1.
    output_pdf: 'f_D^star(z)=c_star double_integral_Rstar(z) f(x)f(y)E_n(x,y,z) dxdy'
    cases:
      G_minus:
        c_star: 1
        region: '-1<g(x,y,z)<1'
      G_pm:
        c_star: 2
        region: '0<g(x,y,z)<1'
      L_minus:
        c_star: 1
        region: '-1<g(x,y,z)<1 and max(x,y)>=z'
      L_pm:
        c_star: 2
        region: '0<g(x,y,z)<1 and max(x,y)>=z'
  global_scaled_depth_asymptotic:
    kernel_limit: >-
      (1-g_hat(wx,wy,wz)^2)^((n-3)/2) is asymptotic to
      (3/4)^((n-3)/2) exp(wx/3)exp(wy/3)exp(-2wz/3).
    unnormalized_output_pdf: >-
      fhat_star(wz) is asymptotic to
      c_star*(3/4)^((n-3)/2)/(n B((n-1)/2,1/2))
      *M_f^2*exp(-2wz/3).
    normalized_output_pdf: '(2/3)exp(-2w/3), w>=0'
    scope: global_cases_only

model_reconstruction:
  sphere:
    assumptions:
      - X and Y are independent and uniform on the unit sphere S^(n-1).
      - Directions are isotropic.
      - The threshold radius is one.
    exact_fixed_sign_probability: 's_n = (1/2) B_n'
    exact_optimized_sign_probability: 's_n_pm = B_n = 2 s_n'
    asymptotic_fixed_sign_probability: 'p_n = (3/4)^(n/2) / sqrt(3*pi*n/8)'
    log2_inverse: '(n/2) log2(4/3) + (1/2) log2(3*pi*n/8) + o(1)'
    exponential_coefficient: 0.20751874963942185
  uniform_ball:
    assumptions:
      - X and Y are independent and uniform in the unit ball B^n.
      - Radius has CDF r^n and PDF n*r^(n-1).
      - Direction is uniform and independent of radius.
    exact_probabilities_at_threshold_one:
      G_minus: '(3/2) A_n'
      G_pm: '3 A_n - 2^(-n)'
      L_minus: 'A_n'
      L_pm: '2 A_n'
    exact_ratios_to_fixed_sign_sphere:
      G_minus: '3 A_n / B_n'
      G_pm: '(6 A_n - 2^(1-n)) / B_n'
      L_minus: '2 A_n / B_n'
      L_pm: '4 A_n / B_n'
    exact_matched_sign_ratios:
      G_minus: '3 A_n / B_n'
      G_pm: '(3 A_n - 2^(-n)) / B_n'
      L_minus: '2 A_n / B_n'
      L_pm: '2 A_n / B_n'
    asymptotic_probabilities_relative_to_fixed_sign_p_n:
      G_minus: 2.25
      G_pm: 4.5
      L_minus: 1.5
      L_pm: 3.0
    asymptotic_matched_sign_ratios:
      G_minus: 2.25
      G_pm: 2.25
      L_minus: 1.5
      L_pm: 1.5
    important_sign_boundary: >-
      The paper's 4.5 and 3 factors compare optimized-sign ball cases with the
      fixed-sign sphere probability p_n. Against an optimized-sign sphere
      control, divide those two factors by two.
  non_uniform_ball:
    assumptions:
      - X and Y have independent identical isotropic distributions in the unit ball.
      - Scaled depth is W = n(1-r).
      - The scaled-depth PDF f satisfies M_f = integral_0^infinity f(w)e^(w/3)dw < infinity.
      - The stated asymptotic shape theorem covers the two global cases.
    general_asymptotic_probabilities:
      G_minus: 'p_n * M_f^2'
      G_pm: '2 p_n * M_f^2'
    exponential_input:
      pdf: 'f_a(w) = a e^(-a w)'
      condition: 'a > 1/3'
      moment: 'M_f = 3a/(3a-1)'
      G_minus: 'p_n * (3a/(3a-1))^2'
      G_pm: '2 p_n * (3a/(3a-1))^2'
    output_length_result:
      variable: 'W_out = n(1-D(X,Y))'
      conditional_limit_pdf: '(2/3)e^(-2w/3), w >= 0'
      distribution: Exp(rate=2/3)
      dependence_on_input: >-
        Input f changes the unnormalized mass through M_f^2 but not the
        normalized asymptotic output-depth shape.
      scope: >-
        Conditional global-reduction output under the iid isotropic model; not
        a theorem that a complete operational sieve list is stationary,
        independent, or Exp(2/3).
    special_cases_relative_to_fixed_sign_p_n:
      uniform_depth_Exp_1:
        G_minus: 2.25
        G_pm: 4.5
      stable_depth_Exp_2_over_3:
        G_minus: 4.0
        G_pm: 8.0
      stable_over_uniform_same_global_case: 1.7777777777777777
    special_cases_matched_sign:
      uniform_depth_Exp_1:
        G_minus: 2.25
        G_pm: 2.25
      stable_depth_Exp_2_over_3:
        G_minus: 4.0
        G_pm: 4.0

source_consistency_note:
  issue: apparent_min_max_typo_in_lemma_1_display
  observation: >-
    The parsed PDF text of Lemma 1 displays min(||X||,||Y||) in its two local
    probabilities, while the local-rule definition, Section 2 CDF, Lemma 3,
    and Sections 3.4--3.5 use max(||X||,||Y||).
  resolution_for_this_report: >-
    The exact L-minus/L-pm formulas and the 1.5/3 constants are interpreted for
    the max rule proved in Sections 3.4--3.5.
  implication: >-
    The local constants must not be cited for a min rule without a separate derivation.
  independent_scaled_depth_check:
    method: >-
      For iid Exp(1) depths, |Wx-Wy| is Exp(1). The max-rule angular
      perturbation multiplies the sphere cap by exp(|Wx-Wy|/3), whose
      expectation is 3/2. The printed min rule gives exp(-|Wx-Wy|/3),
      whose expectation is 3/4.
    min_rule_constants_relative_to_fixed_sign_p_n:
      fixed_sign: 0.75
      optimized_sign: 1.5
    conclusion: the paper's 1.5 and 3 constants correspond to max, not min

