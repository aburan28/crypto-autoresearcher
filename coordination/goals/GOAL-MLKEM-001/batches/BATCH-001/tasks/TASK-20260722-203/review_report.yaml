cheapest_decisive_next_gate:
  kind: symbolic_derivation
  execute_empirical_test: false
  objective: >-
    Determine whether a carry-aware one-layer LaMS orbit statistic is anything
    more than f_W(P_j t)=f_{P_j^T W}(t), and whether every rotated vector remains
    valid for the same partitioned/modulus-switched dual lattice.
  required_outputs:
    - Exact LaMS layer state and modulus-switching equations.
    - Signed-permutation action on p-adic digits, carries, and guessed partitions.
    - Proof of vector-pool validity and a comparison to Wu--Xu and corrected Ogilvie.
    - Correct/wrong joint score law or defensible tail bound with multiplicity.
    - Corrected, commit-pinned, model-matched baseline and total-cost inequality.
  pass_condition: >-
    Exhibit a non-equivalent statistic or amortization not already charged by
    the rotated-vector/orbit baselines, with a valid decision rule and a
    plausible path to C_new <= C_baseline/4.
  fail_condition: >-
    The statistic reduces to rotated-vector relabeling, the layer/orbit actions
    do not commute, the vector pool is invalid, or the cost lower bound cannot
    reach two bits.
  rationale: >-
    This pencil-and-paper gate is cheaper and more decisive than the proposed
    n=32 implementation because the current experimental arms are not yet
    mathematically defined.

scope_limits:
  - This report is literature and theory review, not empirical evidence.
  - It does not declare a breakthrough, rejection, closure, or official status transition.
  - Negative findings apply to IDEA-20260722-001 as currently specified.
