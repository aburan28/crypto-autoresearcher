disposition:
  verdict: not_ready_for_experiment_design
  confidence: high
  merit: derivation_only_after_repair
  official_state_change: none
  statement: >-
    The module-isometry identity is correct, but the proposed orbit scores are
    deterministic relabelings of the same target and equivalent to scoring with
    rotated dual vectors unless a non-equivalent statistic is derived. That
    mechanism is close prior art. The LaMS composition, covariance decision
    rule, and matched end-to-end comparator are not specified well enough to
    test. A material current-baseline error also invalidates the frozen 2-bit
    comparison: Ogilvie's published 2--3-bit ML-KEM gaps were produced before
    an author-confirmed estimator correction.

blocking_findings:
  - id: REV-203-F1
    severity: blocking
    category: baseline
    verdict: incorrect
    finding: >-
      The claimed strongest CC baseline 137.1/192.7/257.2 and the associated
      2--3-bit MLWE/LWE gaps are stale outputs from Ogilvie 2026/279.
      Hou--Jiang 2026/366 identify an Ogilvie-confirmed lambda_2 parameter
      mismatch and report corrected CC values 139.1/194.7/259.0 with gaps
      0.2/0.0/0.6 bit. Ogilvie's repository later recorded commit
      77efa3150a2c19809b5499e504bf7c2eab374935, "fix bug in probability
      calculation; better R search."
    impact: >-
      The frozen comparator and every threshold derived from it must be
      regenerated from corrected, pinned estimator commits.
    required_repair: >-
      Rebuild a model-matched baseline table using corrected Ogilvie/Hou--Jiang,
      Li--Zheng, Carrier et al., and a separately re-estimated LaMS comparator.
  - id: REV-203-F2
    severity: blocking
    category: mechanism
    verdict: unsupported
    finding: >-
      Orbit effective rank is not evidence that the transformations add
      information. For a negacyclic signed permutation P_j and score set W,
      f_W(P_j t)=f_{P_j^T W}(t) exactly. The full orbit is deterministic from t,
      so it has the same Shannon information as t; it may only improve a
      restricted algorithm through reuse or coverage.
    impact: >-
      The proposed "structural_information_gain" interpretation and random
      signed-permutation control do not distinguish new information from the
      prior rotated-vector attack of Wu--Xu or Ogilvie's hit-probability reuse.
    required_repair: >-
      Prove a statistic or cost reuse not equivalent to an already charged
      rotated-vector/orbit baseline.
  - id: REV-203-F3
    severity: blocking
    category: composition
    verdict: unsupported
    finding: >-
      No exact LaMS-orbit algorithm is given. The report does not define the
      layer target, modulus-switching map, guessed partition, orbit action on
      p-adic digits and signed carries, or why one dual-vector pool remains
      valid across rotations and layer updates.
    impact: >-
      "Plain LaMS layer scoring" and the proposed composed scorer are not
      reproducible algorithms, so success probability and cost cannot be
      compared.
    required_repair: >-
      Supply a symbolic one-layer derivation and a carry-aware multi-layer
      invariant before implementation.
  - id: REV-203-F4
    severity: blocking
    category: statistics
    verdict: unsupported
    finding: >-
      The participation ratio r_eff=(tr Sigma)^2/tr(Sigma^2) does not imply
      discriminating power or a reduction in required vectors. Ducas--Pulles
      show that score tails depend on a target-norm confounder and invalidate
      the independent-score model; second moments or GLS alone do not repair
      false-positive tails.
    impact: >-
      The rank>=2/rank>=4 gates, fourfold vector prediction, and claimed
      false-positive improvement have no justified link to attack success.
    required_repair: >-
      Define correct/wrong conditional mean vectors and joint laws, use
      delta_mu^T Sigma^{-1} delta_mu or a justified likelihood statistic, and
      bound family-wise false positives over orbit, FFT candidates, and layers.
  - id: REV-203-F5
    severity: blocking
    category: cost_model
    verdict: unsupported
    finding: >-
      A fourfold reduction of one subcost cannot by itself produce a fully
      charged 2-bit total reduction when any unaffected cost or new overhead is
      positive. Li--Zheng independently confirm that short-vector sampling
      dominates while score/FFT savings often have only modest total effect.
    impact: >-
      The toy vector-count target is not an operational proxy for the declared
      end-to-end claim.
    required_repair: >-
      Reoptimize the complete attack and require C_new <= C_baseline/4 in one
      pinned cost model, including memory and success amplification.

nonblocking_findings:
  - id: REV-203-N1
    category: algebra
    verdict: supported_with_precision_fix
    finding: >-
      For R_q=Z_q[X]/(X^n+1), monomial multiplication is a signed coefficient
      permutation and preserves i.i.d. symmetric centered-binomial
      distributions. The precise flattened identity is
      P_j^(m) Abar = Abar P_j^(k), not an unqualified statement that one square
      permutation "commutes with A."
  - id: REV-203-N2
    category: implementation
    verdict: plausible_but_not_novel
    finding: >-
      Batched negacyclic convolution can compute all cyclic score correlations,
      subject to exact arithmetic checks, but FFT-batched dual scoring and
      rotated short vectors are prior art.
  - id: REV-203-N3
    category: experimental_design
    verdict: underpowered
    finding: >-
      Thirty seeds split between training and holdout cannot substantiate rare
      wrong-candidate tails, a fourfold sample reduction, and multiple orbit
      subset searches without a power calculation and multiplicity correction.
  - id: REV-203-N4
    category: bibliography
    verdict: incorrect_attribution
    finding: >-
      ePrint 2022/1661 is by Han Wu and Guangwu Xu, not "Wang et al."

material_claim_assessments:
  - claim: ML-KEM monomial isometries preserve the public module matrix and CBD laws.
    verdict: supported_with_precision_fix
    basis: Ogilvie 2026/279, Definitions 10--11 and the commutative-ring derivation.
  - claim: Ogilvie supplies current CC costs 137.1/192.7/257.2 and 2--3-bit gaps.
    verdict: incorrect_as_current_baseline
    basis: Hou--Jiang 2026/366 correction and Ogilvie repository commit 77efa315.
  - claim: Corrected isometry-aware ML-KEM gains are only 0--0.8 bit.
    verdict: supported
    basis: Hou--Jiang 2026/366, Table 1.1.
  - claim: LaMS reduces corrected CRT estimates by 22/31/41 bits.
    verdict: supported_with_scope
    basis: Primary ePrint 2026/1326 abstract; the comparator is corrected Qu--Xu, not the best dual baseline.
  - claim: LaMS is already a matched CC baseline for this candidate.
    verdict: unsupported
    basis: No model-matched absolute LaMS cost was supplied or independently located.
  - claim: Li--Zheng reports C0/CC/CN minima matching the producer table.
    verdict: supported
    basis: ePrint 2026/1400, Table 3.
  - claim: Short-vector sampling remains the main bottleneck.
    verdict: supported_for_Li_Zheng_parameterizations
    basis: ePrint 2026/1400; not a universal theorem for the proposed composition.
  - claim: Ducas--Pulles invalidates independent-score success predictions.
    verdict: supported
    basis: Journal of Cryptology 39:8 (2026), especially the target-norm confounder and corrected score models.
  - claim: Covariance-aware GLS satisfies the Ducas--Pulles correction.
    verdict: unsupported
    basis: Covariance does not determine the corrected tail distributions.
  - claim: Orbit effective rank greater than one represents new structural information.
    verdict: incorrect
    basis: Deterministic orbit and exact score-relabeling identities.
  - claim: One BKZ vector can generate n same-length rotated dual vectors.
    verdict: supported_with_scope
    basis: Wu--Xu 2022/1661, Theorem 1; their independence treatment remains heuristic.
  - claim: The exact LaMS-plus-orbit-plus-GLS combination is novel.
    verdict: uncertain
    basis: Exact combination not located, but its algebraic core is subsumed by close prior work and no non-equivalent mechanism is yet specified.
  - claim: The proposed n=32 test can decisively gate the 2-bit standardized claim.
    verdict: unsupported
    basis: Undefined LaMS composition, insufficient tail statistics, and no valid total-cost bridge.
  - claim: No reviewed source demonstrates standardized-parameter ML-KEM key recovery.
    verdict: supported_with_search_boundary
    basis: Verified primary sources report estimates or toy/conditional results, not a passive standardized solve.

