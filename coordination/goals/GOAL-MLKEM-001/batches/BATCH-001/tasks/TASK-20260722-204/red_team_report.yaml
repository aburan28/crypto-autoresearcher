red_team_report:
  id: RT-20260722-001
  task_id: TASK-20260722-204
  goal_id: GOAL-MLKEM-001
  batch_id: BATCH-001
  claim_under_review: >-
    IDEA-20260722-001 claims that a covariance-weighted, convolution-batched
    orbit of negacyclic coefficient isometries can be composed with LaMS and
    reduce fully charged classical-circuit attack cost by at least 2.0 bits
    below both matched LaMS and isometry-aware code-based dual-hybrid
    comparators for at least one standardized ML-KEM parameter set.
  inference:
    requested_policy: review-xhigh
    resolved_model_id: gpt-5.6-sol-xhigh
    reasoning_effort: xhigh
    fallback_used: false
    adapter_version: cursor-subagent-2026-07
  snapshot:
    commit_sha: f94da7203a708fd33fc0e7791f8247134d260143
    parent_sha: 4fc43e88e33af77ac2cf6b90269392db9e0a3943
    receipt_path: coordination/goals/GOAL-MLKEM-001/batches/BATCH-001/archives/TASK-20260722-202/snapshot-receipt.json
    verification: >-
      The commit is HEAD and reachable. Its three declared paths and SHA-256
      values match the dispatch archive binding: baseline_map.md
      e09a9597316322f051124776e0c1418de38ac93c46dd0beeab1f9d9ba02a0f1f,
      candidate_report.yaml
      ddb15db841901c2c8b8ed23385db9486a8b6418322f11df4768f59234fd98217,
      and snapshot-receipt.json
      ab88cf9cb83102c80fc1eea272a3efe1ae37592bb756d1ec4a374dd5c9cc4a6d.
  disposition: blocked_as_cost_or_novelty_claim_but_worth_one_cheaper_algebraic_falsification
  fatal_objections:
    - id: F1
      fatal_to:
        - novelty_claim
        - attribution_of_gain_to_a_new_orbit_mechanism
      objection: >-
        Target-orbit scoring is algebraically the adjoint form of rotated-vector
        scoring: for the signed orthogonal negacyclic rotation J_j,
        <v,J_j b>=<J_j^T v,b>. Wu and Xu (ePrint 2022/1661) already generate
        n equal-norm rotated short vectors from one reduced vector and use all
        of them to distinguish; Ogilvie (ePrint 2026/279) already proves
        same-A preprocessing reuse across coefficient isometries. The producer
        also omitted ePrint 2026/1048, published before the cutoff, which gives
        covariance-based score prediction for original, modulus-switched, and
        decoded dual attacks. The exact LaMS-plus-GLS composition was not
        located, but absence of that exact phrase does not establish a novel
        attack.
      narrow_scope: >-
        This defeats a novelty interpretation, not the possibility that a
        carefully engineered composition yields a small implementation or
        estimator refinement.
    - id: F2
      fatal_to:
        - proposed_random_signed_permutation_control
        - claimed_one_bit_ring_specific_discriminator
      objection: >-
        An arbitrary signed permutation P is not a valid same-A MLWE
        transformation. For the flattened block-negacyclic matrix M(A), the
        monomial rotations J_j satisfy J_j M(A)=M(A)J_j, but a random signed
        permutation generally has PM(A) different from M(A)P. Thus Pb is not
        generally M(A)Ps+Pe. A true-orbit advantage over this invalid control
        merely detects that the true orbit preserves the relation; it cannot
        quantify attack gain over generic batching.
      narrow_scope: >-
        Random permutations remain useful as deliberately broken negative
        controls after a commutator check, but not as a matched attack
        comparator or as the required one-bit structural-gain test.
    - id: F3
      fatal_to:
        - effective_rank_gate
        - generalized_least_squares_gain_claim
        - fourfold_vector_reduction_claim
      objection: >-
        Effective covariance rank is not discriminating information. Under a
        common-covariance linear model the relevant quantity is
        (mu1-mu0)^T Sigma^-1 (mu1-mu0), not
        (tr Sigma)^2/tr(Sigma^2); the latter ignores signal orientation,
        different correct/wrong covariances, non-Gaussian tails, and the FFT
        maximum over candidates. Moreover, with only 30 seeds split into
        training and held-out sets, a covariance matrix for up to 32 orbit
        features is singular or severely underdetermined: its centered rank is
        at most n_train-1. Data-dependent subset search worsens selection bias.
      narrow_scope: >-
        This invalidates the declared decision statistic and sample plan. It
        does not show that a regularized, predeclared, held-out likelihood
        score cannot improve discrimination.
    - id: F4
      fatal_to:
        - matched_false_positive_claim
        - extrapolation_from_thirty_seeds
        - current_full_recovery_path
      objection: >-
        Thirty key seeds cannot validate the rare wrong-candidate tails that
        govern an exponential candidate search. Ducas-Pulles and
        Bashiri-Wiemers show why near-orthogonality or zero covariance is not
        independence; ePrint 2026/1048 further models covariance and tail
        behavior for LWE dual scores. The proposal does not specify covariance
        conditional on A, the short-vector pool, target norm, candidate family,
        and p-adic layer, nor an analytic or importance-sampled bound after
        maximizing over candidates and selecting an orbit subset.
      narrow_scope: >-
        Toy empirical ROC results can falsify gross gains, but cannot certify
        cryptographic false-positive rates or a full secret-recovery success
        probability.
    - id: F5
      fatal_to:
        - LaMS_composition_claim
        - inference_from_one_layer_to_full_recovery
      objection: >-
        No score equation, small prime p, digit convention, target-update
        equation, or candidate-alignment map is supplied for the composed
        attack. Negacyclic rotations introduce signs, and p-adic digits of -s
        are not a digitwise signed permutation because carries or borrows
        propagate. For example, at q=3329 and p=2, centered -1 is represented
        by 3328 modulo q, whose digit path is not the signed digit path of +1.
        The proposal's one-layer test therefore does not establish that orbit
        aggregation commutes with every LaMS target update or that an early
        digit error can be recovered from.
      narrow_scope: >-
        This is a missing proof obligation, not evidence that composition is
        impossible. An exact small-instance carry counterexample may either
        reject the proposed alignment or identify the required corrected map.
    - id: F6
      fatal_to:
        - two_bit_fully_charged_claim
      objection: >-
        A fourfold reduction in counted seed vectors does not imply a two-bit
        reduction in end-to-end attack cost. One BKZ-plus-sieve call emits a
        large list, short-vector sampling dominates the closest dual attacks,
        and a smaller consumed list changes total cost only if the reduction,
        sieve dimension, repetitions, and all downstream parameters are
        reoptimized. The proposal supplies no LaMS CC baseline value, no
        concrete p or partitions, no cost conversion for bytes moved and
        memory routing, and no log-sum-exp total. It also mixes CPU
        measurements with a classical-circuit comparator whose memory
        semantics are different. A two-bit delta is within known model and
        parameter sensitivity unless reproduced under identical code and
        assumptions.
      narrow_scope: >-
        Local score-work savings may still be real, but they are not presently
        evidence of a material total-cost reduction.
  uncertainties:
    - id: U1
      statement: >-
        Monomial multiplication is an exact same-A, distribution-preserving
        isometry for the iid symmetric centered-binomial ML-KEM public-key
        secret and error. It remains uncertain whether orbit-generated scores
        provide useful computational discrimination after correct covariance
        and tail accounting.
    - id: U2
      statement: >-
        It is unverified whether a carry-aware alignment makes every LaMS
        layer equivariant under negacyclic signs and target updates.
    - id: U3
      statement: >-
        Negacyclic convolution can compute a family of raw cyclic
        correlations, but it is unverified whether it batches the nonlinear
        modulus-switching, decoding, candidate maximization, thresholding, and
        verification work that determines the attack score.
    - id: U4
      statement: >-
        The stability of any per-key covariance or selected orbit subset from
        n in {32,64} to n=256 is unknown; toy success cannot validate that
        scaling.
    - id: U5
      statement: >-
        The full LaMS paper's abstract and metadata were independently
        recovered, but its detailed proof, parameter tables, and linked
        estimator code were not recovered in this review channel. This limits
        verification of composition and absolute LaMS cost; it is not evidence
        against LaMS.
  objections:
    - reference: F1
      class: fatal
    - reference: F2
      class: fatal
    - reference: F3
      class: fatal
    - reference: F4
      class: fatal
    - reference: F5
      class: fatal
    - reference: F6
      class: fatal
    - reference: U1
      class: unresolved
    - reference: U2
      class: unresolved
    - reference: U3
      class: unresolved
    - reference: U4
      class: unresolved
    - reference: U5
      class: source_recovery_limit
  required_controls:
    - id: C1
      control: >-
        Before n=32, exhaustively test n in {8,16} with exact integer
        arithmetic, explicit p, all signs, and secrets containing -1, 0, and
        +1. Verify each scalar orbit score, convolution score, p-adic digit,
        target update, carry, final reconstruction, and residual certificate.
      discriminates: valid_LaMS_equivariance_from_representation_or_carry_artifact
    - id: C2
      control: >-
        For every proposed permutation P, compute PM(A)-M(A)P exactly. Label
        noncommuting permutations as broken-relation negatives. Replace the
        matched comparator with equal-norm independently sampled short vectors
        and with correctly aligned versus shuffled labels within the valid
        monomial-isometry group.
      discriminates: valid_ring_orbit_gain_from_control_invalidity
    - id: C3
      control: >-
        Freeze the orbit subset and regularization on training keys and
        short-vector pools; hold out both keys and pools. Compare plain sum,
        shrinkage GLS, and a likelihood-ratio score using both correct and
        wrong mean/covariance estimates. Report condition numbers and bootstrap
        stability. Do no subset selection on test data.
      discriminates: stable_score_gain_from_covariance_overfit
    - id: C4
      control: >-
        At an exhaustible dimension, enumerate the complete wrong-candidate
        family and compare the empirical distribution of the maximum score
        with Ducas-Pulles, Bashiri-Wiemers, and ePrint 2026/1048 predictions.
        At larger dimensions require an analytic or validated rare-event bound,
        not thirty-seed counting.
      discriminates: calibrated_false_positive_tail_from_independence_artifact
    - id: C5
      control: >-
        Keep a sample ledger per attacked key: exactly the public key's k
        module equations or kn flattened coefficient equations; mark every
        orbit target as a deterministic transform and never count it as a
        fresh sample. Training keys are evaluation replicates, not attack data.
      discriminates: real_sample_limited_attack_from_synthetic_sample_credit
    - id: C6
      control: >-
        Ablate rotation only, covariance model only, LaMS only, convolution
        only, and the full composition with identical A, target, pool, p,
        partition, success target, and verification rule.
      discriminates: compositional_gain_from_one_known_component
    - id: C7
      control: >-
        Reoptimize primal, Carrier/Li-Zheng, Ogilvie, ordinary LaMS, and the
        candidate in one cost implementation. Charge basis construction,
        reduction, sieving, list production, transforms, covariance training,
        subset search, every layer and retry, memory under one declared model,
        wrong-candidate verification, and final residual verification. Sum
        costs before taking log2.
      discriminates: total_attack_gain_from_non_bottleneck_subcost_gain
  counterexample_or_mutation: >-
    Cheapest mutation: use n=8, q=3329, explicit p=2, one exact short vector,
    and a secret containing -1. Enumerate all eight monomial rotations and all
    p-adic layers. Check J_j M=M J_j, direct-versus-convolution score equality,
    carry-aware digit alignment, and complete secret recovery. In parallel
    apply one fixed random signed permutation and verify that its commutator
    with M is nonzero. A mismatch rejects the current composition or control
    before covariance fitting, n=32, or any estimator work; a match only earns
    the calibrated-score experiment.
  baseline_comparison: >-
    Pollard-rho and BSGS are generic-group discrete-log algorithms and are not
    applicable baselines for MLWE/ML-KEM. The required generic cryptanalytic
    comparator is a matched progressive-BKZ primal attack. The closest
    specialized comparator is Ogilvie's IsometricDualHybrid, whose reported CC
    estimates are 137.1, 192.7, and 257.2 bits for ML-KEM-512/768/1024, with
    matched isometry gains of 2.4, 2.4, and 2.5 bits. Carrier's code-based
    dual-hybrid CC estimates are 139.5, 195.1, and 259.7; Li-Zheng report
    approximately 139.20, 194.02, and 259.40 while noting short-vector sampling
    dominates. Wu-Xu is the closest mechanism baseline for rotating one short
    vector into n score vectors, but its independence analysis cannot be
    imported. The snapshot does not state absolute ordinary-LaMS CC costs, so
    the claimed lower-of-LaMS-and-Ogilvie threshold is not presently
    executable. No cross-model comparison to Core-SVP, query, memory-routing,
    quantum, or physical-resource figures is valid.
  narrowest_supported_statement: >-
    On the committed snapshot, the ring identity and centered-binomial
    invariance justify deterministic same-A negacyclic target transforms.
    Prior work already establishes rotated-vector generation and isometric
    preprocessing reuse. The snapshot supports only a low-cost falsification
    study of a possible covariance-aware LaMS composition; it supports no
    novelty claim, no independent-sample gain, no fourfold vector reduction,
    no full secret recovery, and no two-bit standardized-parameter cost
    improvement.
  scope_limits:
    - Review concerns passive public-key MLWE only and grants no decapsulation, failure, trace, timing, hint, or plaintext-checking oracle.
    - No standardized-parameter execution or solve was reviewed.
    - Negative findings close only the specified decision rules, controls, and current composition, not all covariance-aware or isometry-aware MLWE attacks.
    - Toy dimensions can reject algebraic or statistical necessities but cannot validate n=256 scaling.
    - Primary-source access was strongest for FIPS 203 and ePrints 2022/1661, 2026/279, 2023/1850, 2023/1238, 2026/1048, and 2026/1400; LaMS full-detail recovery remained incomplete.
  primary_sources_inspected:
    - url: https://doi.org/10.6028/NIST.FIPS.203
      use: standardized ring, modulus, ranks, and passive public-key scope
    - url: https://eprint.iacr.org/2022/1661
      use: rotated short vectors, sample accounting, and near-orthogonality assumption
    - url: https://eprint.iacr.org/2026/279
      use: coefficient isometries, same-A preprocessing reuse, dual hybrid, and CC estimates
    - url: https://eprint.iacr.org/2026/1326
      use: LaMS abstract, p-adic target descent, and claimed relative improvements
    - url: https://eprint.iacr.org/2023/1850
      use: Ducas-Pulles score distributions, confounding target norm, and false-positive tails
    - url: https://eprint.iacr.org/2023/1238
      use: covariance counterarguments to score independence
    - url: https://eprint.iacr.org/2026/1048
      use: omitted covariance-based score prior art and tail model
    - url: https://eprint.iacr.org/2026/1400
      use: modulus-switching composition, short-vector bottleneck, and matched cost components
  next_concrete_action: >-
    Run only control C1/C2 as the n=8 exact carry-and-commutator gate, with no
    covariance training or cost extrapolation; archive the exact score formula,
    p-adic convention, exhaustive vectors, and reconstruction certificate
    before deciding whether n=32 is justified.
  artifact_paths:
    - coordination/goals/GOAL-MLKEM-001/batches/BATCH-001/tasks/TASK-20260722-204/red_team_report.yaml
    - coordination/goals/GOAL-MLKEM-001/batches/BATCH-001/tasks/TASK-20260722-204/falsification_review.md
