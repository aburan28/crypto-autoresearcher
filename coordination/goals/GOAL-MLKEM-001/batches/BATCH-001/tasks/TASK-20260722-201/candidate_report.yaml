screening_conclusion:
  disposition: no_credible_breakthrough_candidate_survives
  statement: >-
    The public record supports model-dependent refinements, especially
    coefficient-isometry dual hybrids, but no reviewed mechanism currently
    supports an asymptotic break, a standardized-parameter solve, or a fully
    charged material improvement over the best matched ML-KEM baseline. The
    idea below is a speculative composition retained only because it has a
    cheap negative test; it is not a breakthrough claim or an execution
    recommendation.
  strongest_current_baseline:
    mechanism: coefficient-isometry-aware code-based dual hybrid
    source: https://eprint.iacr.org/2026/279
    classical_circuit_log2_cost:
      ML-KEM-512: 137.1
      ML-KEM-768: 192.7
      ML-KEM-1024: 257.2
    caveat: >-
      These are estimates in the source's CC model, which does not make them
      directly comparable with Core-SVP, query, memory-routing, quantum, or
      physical-resource models.

idea:
  id: IDEA-20260722-001
  title: Covariance-aware isometry-orbit batching for layered dual attacks
  class: composition
  claim: >-
    For at least one of ML-KEM-512, ML-KEM-768, or ML-KEM-1024, a layered
    modulus-switching dual attack that reuses one short-vector pool across a
    selected orbit of negacyclic coefficient isometries and evaluates that
    orbit by batched convolution will reduce the fully charged classical
    circuit log2 attack cost by at least 2.0 bits relative to the lower of
    (a) LaMS instantiated through the ordinary flattened-LWE model and
    (b) the isometry-aware code-based dual hybrid of ePrint 2026/279, at the
    same target success probability, public-key data, and memory model.
    Failure to meet this threshold rejects the candidate as non-material.
  mechanism: >-
    For MLWE b=A*s+e over Z_q[X]/(X^N+1), multiplication by X^j commutes with
    A and acts as a signed coefficient permutation, so X^j*b=A*(X^j*s)+X^j*e
    has the same A and invariant secret/error distributions. LaMS recovers a
    guessed secret component layer by layer in a fixed small-prime p-adic
    representation while repeatedly scoring targets against short dual
    vectors. The proposed composition computes scores for a carefully chosen
    subset of the N=256 isometry orbit from one reduction/sieving output,
    batches the orbit correlations by negacyclic convolution rather than N
    independent scans, and combines scores with generalized least-squares
    weights derived from their covariance. If the orbit has effective
    statistical rank greater than one, this can reduce the number of short
    vectors or repetitions needed per p-adic layer. If it is only a reindexing
    with rank near one, or if orbit evaluation is not amortized, there is no
    gain.
  novelty_status: speculative
  novelty_screen:
    local_corpus:
      checked:
        - knowledge/
        - ledger/hypotheses/
        - ledger/proposals/
      query_terms:
        - ML-KEM
        - Kyber
        - MLWE
        - coefficient isometry
        - rotation
        - p-adic
        - LaMS
        - modulus switching
        - dual attack
      result: >-
        No ML-KEM, LaMS, coefficient-isometry, or matching composition record
        was found in the local knowledge corpus, hypothesis ledger, or
        proposal ledger.
    public_primary_literature:
      checked_through: '2026-07-22'
      closest_prior_art:
        - citation: https://eprint.iacr.org/2026/279
          overlap: >-
            Reuses hybrid preprocessing across coefficient isometries and
            obtains a 2-3 bit MLWE/LWE gap; already covers primal and
            code-based dual hybrids.
        - citation: https://eprint.iacr.org/2022/1661
          overlap: >-
            Generates rotated short dual vectors and invokes a
            near-orthogonality heuristic.
        - citation: https://eprint.iacr.org/2026/366
          overlap: >-
            Uses ring rotations to accelerate hybrid guessing/decoding,
            principally for sparse Ring-LWE.
        - citation: https://eprint.iacr.org/2026/1326
          overlap: >-
            Introduces p-adic layered modulus switching, but analyzes LWE
            without the proposed covariance-weighted MLWE orbit batching.
        - citation: https://eprint.iacr.org/2026/1400
          overlap: >-
            Batches modulus-switched dual scoring with lossy source coding;
            total cost remains dominated by short-vector sampling.
        - citation: https://doi.org/10.1007/s00145-025-09560-7
          overlap: >-
            Shows that naive score independence is invalid and supplies the
            covariance/false-positive discipline required by this test.
        - citation: https://arxiv.org/abs/2510.02162
          overlap: >-
            Reuses reduced samples across negacyclic rotations in a robust
            regression attack on reduced or sparse instances.
      exact_combination_found: false
      classification_reason: >-
        Each component is known, and coefficient-isometry preprocessing reuse
        is particularly close prior art. Only the composition with p-adic
        layers, batched orbit convolution, and covariance-aware selection was
        not located. It is therefore a speculative extension, not a claimed
        novel algorithm.
  assumptions:
    - >-
      The attacked object is the passive public-key MLWE instance with FIPS
      203 parameters; no decapsulation, failure, timing, power, hint, or
      plaintext-checking oracle is available.
    - >-
      Negacyclic monomial multiplication preserves the exact centered-binomial
      secret and error distributions used by the selected ML-KEM parameter set.
    - >-
      A LaMS layer can consume transformed MLWE targets while retaining its
      correctness proof or an explicitly identified replacement heuristic.
    - >-
      A subset of orbit scores has effective covariance rank high enough to
      reduce the required short-vector count or repetition count.
    - >-
      Negacyclic convolution computes all selected orbit scores without hidden
      precision, transform-domain, or modulus-conversion errors.
    - >-
      The same public matrix A permits reuse only within one target key; no
      cross-key preprocessing is credited.
    - >-
      Short-vector score distributions and false-positive tails are modeled
      with the Ducas-Pulles correction, not an independence heuristic.
    - >-
      Any projected full-scale comparison uses identical success probability,
      lattice-reduction cost model, memory accounting, and verification rule.
  predictions:
    - metric: orbit_score_effective_rank
      direction: higher
      minimum_effect: >-
        At least 4.0, where r_eff=(tr Sigma)^2/tr(Sigma^2), on held-out
        n=64 MLWE instances for at least one orbit subset of size at most 32.
    - metric: short_dual_vectors_for_50_percent_layer_success
      direction: lower
      minimum_effect: >-
        At least 4x fewer than LaMS without orbit aggregation at matched
        false-positive probability and p-adic layer.
    - metric: held_out_wrong_candidate_false_positive_rate
      direction: lower
      minimum_effect: >-
        At least 2x lower than an unweighted orbit sum using the same vectors
        and score threshold.
    - metric: fully_charged_classical_circuit_log2_cost
      direction: lower
      minimum_effect: >-
        At least 2.0 bits below both matched comparators for at least one
        standardized parameter set after charging every cost listed below.
    - metric: gain_after_random_signed_permutation_control
      direction: different
      minimum_effect: >-
        The true negacyclic orbit must retain at least 1.0 bit more projected
        total-cost gain than size-matched random signed permutations; otherwise
        the effect is generic batching rather than exploitable ring structure.
  minimal_test:
    design: >-
      Implement only the scoring layer for rings X^n+1 with n in {32,64},
      q=3329, k=2, and centered-binomial eta=3. For 30 fixed seeds per n,
      generate one matched short-vector pool, then evaluate (i) plain LaMS
      layer scoring, (ii) all-orbit unweighted scoring, (iii) covariance-selected
      generalized-least-squares scoring, (iv) the ePrint 2026/279-style
      isometric hit-probability comparator, and (v) random signed-permutation
      controls. Estimate covariance and choose the orbit subset on training
      seeds; report success and false positives only on held-out seeds. Count
      integer operations, transforms, bytes moved, peak resident memory,
      vector-generation work, score work, and verification. Do not run a
      standardized-parameter solve. Stop after the n=32 stage if effective rank
      is below 2 or measured work is no lower than plain LaMS; otherwise run
      n=64 and fit, but do not extrapolate beyond, a transparent cost model.
    competing_explanations:
      - id: structural_information_gain
        meaning: >-
          Effective rank and held-out vector reduction pass, the true orbit
          beats random signed permutations, and charged work falls; ring
          structure supplies reusable information beyond reindexing.
      - id: correlated_reindexing
        meaning: >-
          Orbit scores have low effective rank or generalized weighting gives
          no held-out reduction; the same equations were merely relabeled.
      - id: non_bottleneck_local_gain
        meaning: >-
          Score/vector counts improve but total projected cost does not,
          because lattice reduction, sieving, p-adic guessing, memory, or
          verification dominates.
      - id: generic_batching
        meaning: >-
          Random signed permutations match the true orbit; any gain is a
          generic implementation optimization and not an MLWE structural
          attack.
    controls:
      - Plain LaMS layer scoring with identical A, target, short vectors, and p.
      - >-
        IsometricDualHybrid hit-probability calculation from ePrint 2026/279
        with the same secret distribution and success target.
      - >-
        Size-matched random signed permutations fixed before seeing each
        secret.
      - >-
        Orbit labels independently shuffled between scores and candidate
        coordinates as a negative control.
      - >-
        Correct-secret and uniformly wrong-secret targets to estimate both
        score tails.
      - >-
        Direct scalar score evaluation against batched convolution to verify
        exact numerical equality before timing.
    required_metrics:
      - orbit_score_covariance_matrix
      - orbit_score_effective_rank
      - correct_and_wrong_score_quantiles
      - false_positive_and_false_negative_rates
      - short_vector_count
      - repetitions_per_p_adic_layer
      - integer_operation_count
      - transform_count_and_precision
      - bytes_read_and_written
      - peak_resident_memory_bytes
      - candidate_verification_count
      - end_to_end_wall_clock_seconds
      - success_probability_with_binomial_confidence_interval
    stopping_rules:
      - Stop and reject after n=32 if orbit_score_effective_rank is below 2.0.
      - >-
        Stop and reject if batched and scalar scores disagree on any exact
        small-instance test.
      - >-
        Stop and reject if the 95% confidence interval excludes a 2x vector
        reduction at n=64.
      - >-
        Stop and reject as non-material if a fully charged estimator cannot
        show a 2.0-bit improvement over both comparators.
  test_boundary:
    included:
      - Synthetic MLWE over power-of-two cyclotomic rings at n=32 and n=64.
      - Exact ML-KEM-512 centered-binomial distribution and q=3329.
      - One p-adic layer and its score distribution.
      - Classical CPU operation, memory-traffic, and wall-clock accounting.
    excluded:
      - A solve of ML-KEM-512, ML-KEM-768, or ML-KEM-1024.
      - Quantum speedups, QRAM, GPU-specific advantage, and distributed sieving.
      - Chosen ciphertexts, decapsulation access, leakage, failures, or hints.
      - Cross-key preprocessing or multi-target amortization.
      - Claims about protocol-level IND-CCA security.
  charged_costs:
    data_and_samples: >-
      Public encapsulation key only; charge parsing and coefficient expansion.
      No synthetic fresh samples may be credited at full scale.
    preprocessing: >-
      Basis construction, every BKZ tour, sieve or discrete-Gaussian sampler,
      all saved/rotated vectors, covariance training, and orbit-subset search.
    online_time: >-
      Every p-adic digit layer, secret guesses, target updates, negacyclic
      transforms, score accumulation, thresholding, retries, and final secret
      verification.
    memory: >-
      Lattice bases, short-vector lists, transform buffers, FFT/guess tables,
      covariance matrices, saved targets, and random-access traffic.
    success_amplification: >-
      Repetitions required to reach the matched overall success probability,
      including propagation of an erroneous early p-adic digit.
    oracle_and_trace_cost: >-
      Zero allowed. Any nonzero oracle or trace requirement moves the result
      outside this candidate and into implementation leakage.
    precomputation_reuse: >-
      Reuse is allowed only among isometric targets for the same A and target
      key. The full preprocessing cost is charged once per attacked key.
    verification: >-
      Reconstruct the complete candidate, evaluate residuals against the exact
      distribution, and count every false-positive candidate tested.
    quantum_resources: >-
      Not applicable to the claim; no quantum or QRAM reduction may be
      included in the classical comparison.
  falsification_conditions:
    - >-
      The LaMS proof obligations are not invariant under the proposed isometry
      transforms or p-adic target updates.
    - >-
      Orbit_score_effective_rank is below 2.0 at n=32 or below 4.0 at n=64.
    - >-
      The held-out short-vector requirement is not reduced by at least 4x at
      matched layer success and false-positive rates.
    - >-
      Random signed permutations reproduce the true-orbit gain within 1.0
      projected bit.
    - >-
      Covariance estimation, orbit scoring, memory traffic, or p-adic retries
      consume the apparent saving.
    - >-
      The best standardized projection improves either matched comparator by
      less than 2.0 classical-circuit bits after all charged costs.
    - >-
      The effect depends on an independence assumption ruled out by
      Ducas-Pulles or fails held-out false-positive prediction.
    - >-
      The proposed algorithm is mathematically subsumed by ePrint 2026/279
      after matching success probability and cost accounting.
  confounders:
    - Training and testing orbit weights on the same instances.
    - Treating rotated equations or vectors as statistically independent.
    - Comparing a scoring subcost with another attack's total cost.
    - Using different BKZ quality, vector count, success target, or cost model.
    - Crediting p-adic savings relative to the corrected CRT attack as savings
      relative to the best code-based dual attack.
    - Ignoring early-layer error propagation and restart probability.
    - Omitting NTT/FFT precision conversion or memory-traffic costs.
    - Extrapolating a toy effective rank as constant through n=256.
    - Reusing preprocessing across independent ML-KEM public matrices.
    - Accidentally using sparse, binary, or uniform secrets instead of the
      exact centered-binomial distribution.
  interpretation_limits:
    - >-
      Passing the minimal test would justify only a full derivation and
      estimator study, not a cryptographic-scale attack claim.
    - >-
      A 2-bit estimator reduction is a concrete refinement, not an asymptotic
      breakthrough and not a practical ML-KEM break.
    - >-
      Toy dimensions can falsify the mechanism but cannot validate scaling to
      standardized dimensions.
    - >-
      The classical-circuit result would not transfer to Core-SVP,
      memory-routing, quantum-query, or physical-resource models.
    - >-
      The candidate addresses passive core MLWE only; it says nothing about
      side-channel resistance or oracle-dependent attacks.
    - >-
      Final ML-KEM protocol details differ from pre-standard Kyber wherever
      decapsulation behavior, malformed inputs, or implementation code paths
      matter.
  cheapest_decisive_falsification_gate:
    gate: >-
      Compute held-out covariance effective rank and exact charged scoring work
      for n=32 before any n=64 or standardized estimator work.
    pass_condition: >-
      Effective rank at least 2.0, exact equality with scalar scoring, and at
      least 2x fewer short vectors without greater total measured work.
    fail_condition: >-
      Any one of those three conditions fails.
    why_decisive: >-
      The proposed gain requires both non-redundant orbit information and
      amortized evaluation. This gate measures those two necessary conditions
      directly for the declared small-instance boundary. Failure rejects this
      candidate under its predeclared gate and does not claim that every
      larger dimension or different orbit construction is impossible.
  estimated_cost:
    implementation: medium
    compute: low
    detail:
      implementation_components:
        - exact small-ring MLWE sampler
        - LaMS scoring-layer comparator
        - covariance-selected orbit scorer
        - signed-permutation controls
        - operation and memory instrumentation
      n32_gate_core_hours: '<= 8'
      full_toy_test_core_hours: '<= 32'
      peak_memory_gb: '<= 16'
      full_standardized_solve: prohibited_and_out_of_scope
  recommended_priority: low

ranking_rationale: >-
  This is the only retained idea and therefore the first falsification target,
  but it ranks low as an attack candidate: both constituent mechanisms are
  known, Ogilvie already captures the main isometry benefit, and short-vector
  sampling usually dominates. Its value is information gain per cost. The
  n=32 covariance-and-work gate directly separates structural information
  gain from correlated reindexing for at most eight core-hours; a negative
  result closes the exact composition before estimator engineering, while a
  positive result only earns the more expensive n=64 and full-cost derivation.
test_first:
  idea_id: IDEA-20260722-001
  flag: true
  reason: >-
    The minimal gate is the cheapest valid discriminator and has explicit
    negative outcomes; no other screened direction offered a lower-cost route
    to evidence beyond already published estimator refinements.
