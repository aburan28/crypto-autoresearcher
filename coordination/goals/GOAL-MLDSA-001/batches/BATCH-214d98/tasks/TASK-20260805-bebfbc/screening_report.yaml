      BATCH-004) should open the local PDF to resolve those gaps.
    ePrint_note: >-
      ePrint identifier is null in KN-LIT-3907. The paper is Barbosa, Barthe,
      Doczkal, Don, "Fixing and Mechanizing the Security Proof of Fiat-Shamir
      with Aborts and Dilithium." It appeared at CRYPTO 2023 and is available
      as ePrint 2023/916. This was not independently fetched in this session;
      the screening relies on the KN-LIT abstract text only.
    abstract_key_claims:
      - >-
        "We identify a subtle but crucial gap in the CMA-to-NMA reduction" for
        FS-with-aborts schemes including Dilithium.
      - >-
        "The gap was confirmed by the authors, and there seems to be no simple
        patch for it."
      - >-
        "We provide new, fixed proofs for the affected CMA-to-NMA reduction,
