  # ─────────────────────────────────────────────────────────────────────────
  # ACCESS AUDIT — KN-LIT-3907
  # ─────────────────────────────────────────────────────────────────────────
  kn_lit_3907_access:
    source: "KN-LIT-3907 (knowledge/literature/KN-LIT-3907.md)"
    abstract_available: true
    full_text_available: false
    full_text_note: >-
      KN-LIT-3907 metadata lists a local PDF at downloads/140850158.pdf.
      The abstract text is reproduced in full in the KN-LIT entry (seeded
      from the paper's first two pages, 2026-07-24). Full text was not read
