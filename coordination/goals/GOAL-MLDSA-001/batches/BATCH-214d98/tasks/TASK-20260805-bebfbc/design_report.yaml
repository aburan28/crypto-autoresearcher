  # ─────────────────────────────────────────────────────────────────────────
  # PART 1: SCREENING OUTCOMES FOR GATED PROPOSALS
  # ─────────────────────────────────────────────────────────────────────────
  gated_proposal_screening:

    IDEA-20260805-9c1e04:
      outcome: reframed
      red_team_claim_assessed: >-
        The red team argued the abstract's statement "the claimed security
        level is still valid" satisfies IDEA-9c1e04's falsification criterion.
        This is incorrect: the criterion is a conjunction requiring BOTH
        (a) confirmation of the same security levels AND (b) an EXPLICIT BOUND
        on the tightness loss < 5 bits. The abstract satisfies (a) only.
      kn_lit_3907_coverage_of_question:
        overall_dilithium_security_confirmed: true
        selftargetmsis_specific_analysis: >-
          Not confirmed from abstract alone. The "claimed security level still
          valid" statement refers to Dilithium's overall CMA security (security
          categories), not specifically to SelfTargetMSIS as the binding
          assumption. The mechanism by which the correction was absorbed
          (MSIS slack, parameter adjustment, tightness genuinely small) is not
          stated in the abstract and requires full text.
        explicit_tightness_bound: false
        conclusion: not_self_falsified
      reframed_question: >-
        "What is the tightness factor ε(q_s, q_H) in the corrected
        CMA-to-NMA reduction, and does the corrected concrete analysis
        confirm SelfTargetMSIS as the binding assumption at ML-DSA-44/65/87?"
      batch_assignment: BATCH-004
      deferred_reason: >-
        Medium priority. The abstract substantially reduces urgency (gap not
        operationally damaging). Residual question is about margins and binding
        assumption identity, not about whether the correction was significant.

    IDEA-20260805-e5c308:
      outcome: admitted
      red_team_claim_assessed: >-
        The red team conditioned domination on "the decomposition
        cost_SelfTargetMSIS ≈ cost_MSIS + log₂|C| being a formally verified
        proof obligation in KN-LIT-3907's EasyCrypt mechanization."
        This condition is FALSE. The EasyCrypt mechanization proves reduction
        VALIDITY (that a valid game-hopping proof exists from CMA security to
        SelfTargetMSIS), not the concrete HARDNESS of SelfTargetMSIS. BKZ cost
        estimates are informal/heuristic and are not EasyCrypt proof obligations.
        The independence assumption (τ-independence of BKZ cost) is unverified
        in KN-LIT-3907 and anywhere else in the corpus.
      kn_lit_3907_coverage_of_question:
        easycrypt_proves_reduction_validity: true
        easycrypt_proves_cost_decomposition: false
        bkz_cost_model_verified: false
        independence_assumption_verified: false
        conclusion: not_dominated
      batch_assignment: BATCH-004
      deferred_reason: >-
        Medium priority (requires BKZ implementation). Given three high-priority
        zero-compute tasks in BATCH-003, deferred to BATCH-004.

  # ─────────────────────────────────────────────────────────────────────────
  # PART 2: FROZEN EXPERIMENT CONTRACTS
  # ─────────────────────────────────────────────────────────────────────────
  frozen_contracts:

    - experiment_id: EXP-MLDSA-a8d531
      source_proposal: IDEA-20260805-a8d531
      hypothesis_id: H-MLDSA-f3a291
      hypothesis_note: >-
        Newly allocated ID. Archival task must create H-MLDSA-f3a291 hypothesis
        record and confirm no collision via tools/allocate_id.py --check.
      lane: B
      type: corpus_analysis
      title: >-
        Shin DFA Challenge-Sampling Fault: Adversary-Model Placement vs
        KN-LIT-3907 and KN-LIT-8ce0b5
      specification_path: "experiments/EXP-MLDSA-a8d531/specification.yaml"
      rationale_for_freeze: >-
        The experiment directly addresses whether the Shin DFA fault class is
        within the adversary models of the two existing formal proofs. This is
        a named, bounded question answerable from the corpus. Zero compute cost.
        Result is a citable proof-coverage characterization for RQ-MLDSA-001.
        Admitted proposal; not gated. Highest priority in BATCH-003 (zero cost,
        maximum clarity per resource spent).
      compute_cost: zero
      implementation_cost: zero
      estimated_wall_clock: "≤ 4 hours of reading and documentation"
      key_deliverable: >-
        Placement verdict (inside/outside scope) for Shin DFA vs KN-LIT-3907
        and KN-LIT-8ce0b5, with verbatim cited source text and CTRL-1 passed.
      blocking_conditions:
        - "KN-LIT-3907 full text inaccessible (local PDF + ePrint 2023/916)"
        - "KN-LIT-340675 full text inaccessible"
      fips204_body_constraint: "DEC-20260805-0d59ff gate-1 applies; academic sources only"

    - experiment_id: EXP-MLDSA-2b6f17
      source_proposal: IDEA-20260805-2b6f17
      hypothesis_id: H-MLDSA-c7b4e8
      hypothesis_note: >-
        Newly allocated ID. Archival task must create H-MLDSA-c7b4e8 hypothesis
        record and confirm no collision via tools/allocate_id.py --check.
      lane: B
      type: corpus_analysis
      title: >-
        Jendral Nonce-Erasure Fault: Formal Proof Coverage for Hedged-Mode
        Randomness Failure
      specification_path: "experiments/EXP-MLDSA-2b6f17/specification.yaml"
      jendral_canonical_values:
        year: 2024
        success_probability: 0.582
        source: "DEC-20260805-0d59ff gate-2"
      rationale_for_freeze: >-
        Orthogonal to EXP-MLDSA-a8d531 (different fault class, different
        boundary: seed-derivation vs challenge-sampling). Both are needed to
        characterize the full shape of the formal proof coverage gap.
        Zero compute cost. Questions KN-LIT-056's hedged-mode security claim
        nature (formal vs informal) — relevant to RQ-MLDSA-001 directly.
      compute_cost: zero
      implementation_cost: zero
      estimated_wall_clock: "≤ 5 hours of reading and documentation"
      key_deliverable: >-
        (a) Nature of KN-LIT-056 hedged-mode claim (formal theorem or informal),
        (b) Whether KN-LIT-3907 covers hedged-mode nonce-erasure,
        (c) CTRL-1 confirms deterministic mode is in KN-LIT-3907 scope.
      blocking_conditions:
        - "KN-LIT-3907 full text inaccessible (local PDF + ePrint 2023/916)"
        - "KN-LIT-056 full text inaccessible (IACR TCHES)"
      fips204_body_constraint: >-
        DEC-20260805-0d59ff gate-1 applies. Seed-derivation function exact
        specification requires FIPS 204 body for FIPS 204-specific claims;
        academic hedged-mode spec from KN-LIT-056 is sufficient for this task.

    - experiment_id: EXP-MLDSA-3f7ab2
      source_proposal: IDEA-20260805-3f7ab2
      hypothesis_id: H-MLDSA-d1e509
      hypothesis_note: >-
        Newly allocated ID. Archival task must create H-MLDSA-d1e509 hypothesis
        record and confirm no collision via tools/allocate_id.py --check.
      lane: A
      type: arithmetic_rederivation
      title: >-
        Independent Re-Derivation of SelfTargetMSIS Concrete Security at
        Academic ML-DSA-44/65/87 Parameters from KN-LIT-056 Table 2
      specification_path: "experiments/EXP-MLDSA-3f7ab2/specification.yaml"
      rationale_for_freeze: >-
        The only existing SelfTargetMSIS concrete estimate in the corpus is
        from KN-LIT-056. An independent re-derivation from first principles
        either (a) reproduces it (confirming calibration) or (b) produces a
        discrepancy (a quantitative finding requiring further analysis).
        The experiment also determines which of {MSIS, SelfTargetMSIS} is
        binding at each parameter set — directly answering a core sub-question
        of RQ-MLDSA-001. Arithmetic cost only (no code, no BKZ computation).
      compute_cost: zero
      implementation_cost: zero
      estimated_wall_clock: "≤ 4 hours of arithmetic and documentation"
      key_deliverable: >-
        Result table: (cost_MSIS, log₂|C|, cost_SelfTargetMSIS, published,
        discrepancy_Δ, dominant_component) for ML-DSA-44/65/87; MLWE control
        values; binding-assumption determination.
      blocking_conditions:
        - "KN-LIT-056 full text inaccessible (IACR TCHES DOI)"
        - "BKZ cost model not cited or identifiable from KN-LIT-056"
      fips204_body_constraint: >-
        DEC-20260805-0d59ff gate-1 applies. Results labeled
        "academic parameters from KN-LIT-056" throughout. FIPS 204 body
        required before any claim about FIPS 204 production parameter sets.
      unverified_parameter_warning: >-
        Exact τ values stated in IDEA-3f7ab2 are from the idea-generator's
        memory and are explicitly unverified. The executor MUST read τ and
        all parameters from KN-LIT-056 Table 2 before performing arithmetic.
        Arithmetic with unverified parameters invalidates the run.

  # ─────────────────────────────────────────────────────────────────────────
  # PART 3: BATCH-003 ORDERING AND DISPATCH STRUCTURE
  # ─────────────────────────────────────────────────────────────────────────
  dispatch_ordering:
    rationale: >-
      Lane B tasks (EXP-MLDSA-a8d531, EXP-MLDSA-2b6f17) are ordered first
      because they have zero compute cost and require only corpus reading.
      They can run concurrently (disjoint source sets, disjoint write scopes).
      Lane A task (EXP-MLDSA-3f7ab2) has a blocking condition (KN-LIT-056
      access) that may also be required for Lane B tasks (KN-LIT-056 hedged
      mode), so if KN-LIT-056 access is confirmed for one task, it can be
      reused across tasks in the same run.

    concurrent_tasks:
      - EXP-MLDSA-a8d531
      - EXP-MLDSA-2b6f17
      note: "Disjoint source document sets except for KN-LIT-3907 (shared).
        Write scopes are disjoint. Can run concurrently or sequentially."

    sequential_after_B: EXP-MLDSA-3f7ab2
    sequential_reason: >-
      Lane A benefits from having Lane B access confirmations for KN-LIT-056.
      However, EXP-MLDSA-3f7ab2 can also run concurrently if needed.

    max_concurrent: 3
    total_tasks: 3

