        title: "Jendral nonce-erasure is outside existing formal proof scopes"
      - id: H-MLDSA-d1e509
        for: EXP-MLDSA-3f7ab2
        title: "SelfTargetMSIS hardness re-derivation from academic parameters
          reproduces or reveals discrepancy vs published KN-LIT-056 estimate"
    collision_check_required: true
    collision_check_command: "python3 tools/allocate_id.py --check H-MLDSA-f3a291"

