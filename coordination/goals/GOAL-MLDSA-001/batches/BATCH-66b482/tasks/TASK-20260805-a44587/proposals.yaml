  # ─────────────────────────────────────────────────────────────────────────
  # IDEA 4 — Lane B: Hedged-mode nonce-erasure fault vs signing-model coverage
  # ─────────────────────────────────────────────────────────────────────────
  - id: IDEA-20260805-2b6f17
    lane: B
    class: mechanism
    title: "Jendral Nonce-Erasure Fault: Formal Proof Coverage for Hedged-Mode Randomness Failure"
    novelty_status: unverified

    mechanism: >-
      Hedged ML-DSA derives the signing seed via ρ' = H(ξ || M || rnd), where
      rnd is a per-signing system random value providing randomness freshness.
      The Jendral voltage-glitch attack (KN-LIT-4f3b80) skips the computation
      of ρ', causing the signer to use either a fixed or null seed. The abstract
      states: "the resulting signature allows for the extraction of the secret
      key vector" from a single faulty signature with probability 0.582.

      The key-extraction mechanism: if rnd is erased (ρ' becomes deterministic
      or null), the commitment y = SampleInBall(ρ') is attacker-predictable.
      Given (z, c) from the faulty signature, s₁ can be extracted as
      z - y = c·s₁ (mod q), because z = y + c·s₁ in the rejection-sampling step.
      This is a direct consequence of y being non-secret.

      The mechanism hypothesis for the proof boundary: all formal security proofs
      for ML-DSA (KN-LIT-3907 in ROM/QROM, any classical model) assume the
      commitment y is uniformly distributed and independent of the secret. The
      Jendral attack violates this assumption at the hardware level. The hedged-
      mode specification adds rnd to prevent determinism under weak ξ, but no
      formal proof models the case where rnd is adversarially zeroed or fixed.
      This constitutes a proof coverage gap orthogonal to the Gupta NTT-twiddle
      result: different function boundary (seed generation, not NTT computation),
      different secret extraction mechanism (y-exposure, not coefficient ranking).

    prediction: >-
      (1) No existing KN-LIT entry contains a formal security proof for hedged
      ML-DSA under nonce-erasure adversarial input.
      (2) The hedged-mode specification in the academic paper (KN-LIT-056) provides
      an operational security argument ("provides protection against weak RNG")
      but not a formal reduction. The formal security proof in KN-LIT-3907 covers
      the deterministic case (ξ-dependent) and does not extend to hedged mode under
      fault injection.
      (3) The gap cannot be closed by KN-LIT-8ce0b5 (Gupta), whose formal scope
      is NTT twiddle-constant perturbations, not seed-derivation skipping.

    minimal_discriminating_test: >-
      Three-step corpus placement test:
        Step 1: Check KN-LIT-056 (Dilithium academic paper, abstract available)
          for whether hedged mode has a formal security proof or only an informal
          argument.
        Step 2: Check KN-LIT-3907 abstract and local PDF for whether the corrected
          proof covers hedged mode signing under nonce-erasure adversaries.
        Step 3: Check KN-LIT-8ce0b5 abstract for whether the twiddle-fault scope
          extends to the seed-generation function.
      Discriminates:
      — If all three steps confirm the gap, the proposed mechanism is supported
        (subject to corpus completeness caveat: absence of a search result is not
        evidence the thing was not tried — AGENTS.md knowledge retrieval policy §bounds).
      — If Step 2 shows KN-LIT-3907 explicitly covers hedged-mode nonce-erasure,
        the gap is closed and the proposal is falsified.

    falsification_criteria:
      - >-
        If KN-LIT-3907 or any corpus entry contains a formal proof for hedged
        ML-DSA under adversarially controlled rnd (nonce-erasure), the coverage
        gap is falsified for that proof's scope.
      - >-
        If the Jendral attack's 58.2% success rate is due to probabilistic
        fault-injection success (not a deterministic property of the scheme),
        the formal proof coverage question may be separate from the actual attack
        risk — the scheme could be provably secure but implementable insecurely.
        In that case, the formal gap exists but has no bearing on the scheme's
        mathematical hardness, which is the Lane B boundary question.

    proof_search_map:
      exact_baseline_reproduction: >-
        The baseline is the claim that hedged ML-DSA adds operational security
        against weak RNG. Reproduce this claim by identifying the relevant
        statement in KN-LIT-056 (academic paper) and checking whether it is
        presented as a formal theorem or an operational design justification.
        KN-LIT-3907's abstract states it covers Dilithium CMA security; verify
        whether this includes hedged-mode nonce-erasure adversaries.
      observation_collision_search: >-
        The observable is commitment vector w (= Ay mod q). Under normal signing,
        w is uniformly distributed and unobservable. Under the Jendral fault,
        w is attacker-predictable (since y is derived from a known/null seed).
        A proof-model collision: two signing transcripts that share the same w
        with non-negligible probability. In the standard model, Pr[collision] is
        negligible; under the Jendral fault, it approaches 0.582 on Cortex-M4.
        Any proof that does not model this distinguishable collision provides
        no guarantee against the Jendral attack class.
      quantifier_order_statement: >-
        ∀ formal proofs P of ML-DSA signing security, if P assumes the commitment
        y is uniformly distributed over valid commitment sets, then ∃ fault adversary
        A (Jendral class) such that A forces y to be attacker-computable with
        probability 0.582, and ∀ such P, P's guarantee is vacuous against A.
        The quantifier direction matters: P is stated ∀ classical adversaries; A
        is a physical adversary outside that class. The gap is not a logical error
        in P but a boundary of P's stated scope.
      method_ceiling_and_nearby_object: >-
        This method can confirm that the Jendral class is outside existing formal
        proof scopes. It cannot determine the effective security of hedged ML-DSA
        against a mixed (fault + lattice) adversary — that requires a new formal
