  # ─────────────────────────────────────────────────────────────────────────
  # IDEA 5 — Lane C: Toy-scale SelfTargetMSIS vs MSIS BKZ cost comparison
  # ─────────────────────────────────────────────────────────────────────────
  - id: IDEA-20260805-e5c308
    lane: C
    class: measurement
    title: "Toy-Scale BKZ Cost Comparison: SelfTargetMSIS vs Pure MSIS to Validate Hardness Decomposition"
    novelty_status: unverified

    mechanism: >-
      The SelfTargetMSIS hardness estimate decomposes into two independent costs:
      (1) the MSIS lattice cost: finding z with small norm satisfying Az = ct
          for a given c, using BKZ lattice reduction;
      (2) the hash-programmability cost: log₂|C| ≈ log₂(C(n,τ)·2^τ).

      The independence assumption is: at any fixed c, the MSIS cost is the same
      regardless of how c was chosen. If this holds, the two costs add (in log space).
      If it fails — e.g., if challenge structure (weight τ, coefficients ±1) makes
      the lattice problem easier for the specific instances arising in practice —
      then the decomposition underestimates attack cost (good) or overestimates it
      (bad, a calibration failure).

      A toy-scale experiment can test the independence assumption directly:
        Variant A ("oracle-assisted MSIS"): provide a BKZ solver with the correct
          challenge c and ask it to find a short z with Az = ct mod q. Measures
          the pure MSIS cost at toy parameters with challenge structure baked in.
        Variant B ("SelfTargetMSIS simulation"): give the solver access to a
          random oracle H and ask it to find (z, w, c) with Az = ct, c = H(w, μ),
          ‖z‖ small. Measures the combined cost including oracle queries.
      The predicted ratio: (oracle queries in B) / (BKZ iterations in A) ≈ |C_toy|.
      If the ratio matches |C_toy| within a constant factor, the decomposition holds
      at toy scale, supporting its use for extrapolation.

    prediction: >-
      At toy parameters (n=32, k=l=2, q=7681, τ=5), the ratio of oracle queries
      in Variant B to BKZ iterations in Variant A is within a factor of 2 of |C_toy|
      = C(32,5)·2^5, validating the independence assumption. The BKZ success rate
      for Variant A is constant in the challenge weight τ (i.e., changing τ from 5
      to 3 changes |C| but not the BKZ cost). If the BKZ cost changes with τ,
      the challenge structure interacts with the lattice, and the decomposition is invalid.

    minimal_discriminating_test: >-
      Implement toy instances at (n=32, k=l=2, q=7681). Generate 50 random instances
      of Variant A (oracle-c MSIS) and 50 of Variant B (random-oracle SelfTargetMSIS).
      Run BKZ with block sizes β ∈ {2, 4, 6, 8} on Variant A; count oracle queries
      in Variant B for equivalent success rate. Compare the oracle query ratio to |C_toy|.
      Control: repeat Variant A with τ ∈ {3, 5, 7} and measure whether BKZ success
      rate changes — if it does, challenge structure affects lattice hardness.
      Expected sign of result: the control should show no τ-dependence in BKZ cost.
      If τ-dependence appears, the independence assumption is violated.
      WARNING: All results carry the toy-scale label (AGENTS.md rule 7). No result
      from n=32 may be presented as a statement about ML-DSA-65 (n=256).

    falsification_criteria:
      - >-
        If the oracle query ratio significantly exceeds |C_toy| (by > 3×), the
        independence assumption holds with additional overhead — SelfTargetMSIS is
        harder than the decomposition predicts. This is positive news for the scheme.
      - >-
        If the oracle query ratio significantly undercuts |C_toy| (by > 10×), the
        hash programmability is easier than expected — the attacker can exploit
        challenge structure to reduce the SelfTarget cost. This is a calibration concern.
      - >-
        If BKZ cost in Variant A varies with τ (p-value < 0.05 across τ ∈ {3,5,7}
        controlling for n, q), the independence assumption is violated. This falsifies
        the clean decomposition and requires a revised hardness estimate.

    proof_search_map:
      exact_baseline_reproduction: >-
        The baseline to reproduce is the decomposition formula:
        cost_SelfTargetMSIS ≈ cost_MSIS + log₂|C| (in log₂ bit-operations).
        Reproduction check at toy scale: verify that (oracle queries in Variant B)
        ≈ (BKZ iterations in Variant A) × |C_toy| within a small constant factor
        (< 3×). A discrepancy at toy scale flags a possible extrapolation error in
        the published estimate.
      observation_collision_search: >-
        The observable is the query-count ratio. A collision: two toy parameter
        sets (n₁, τ₁) and (n₂, τ₂) with the same MSIS cost but different |C|,
        resulting in different SelfTargetMSIS costs. If changing τ while holding
        n and q constant changes only the query ratio and not the BKZ cost, the
        decomposition is validated at that dimension. If both change together,
        the decomposition is confounded.
      quantifier_order_statement: >-
        ∀ toy parameter sets (n=32, k=l=2, q=7681) with τ ∈ {3, 5, 7},
        ∃ BKZ-β instantiation such that BKZ success rate for Variant A (oracle-c
        MSIS) is independent of τ within statistical noise (p > 0.05). If this
        ∀-τ independence holds, the decomposition is validated at toy scale.
        Claim is explicitly toy-scale only (AGENTS.md rule 7).
      method_ceiling_and_nearby_object: >-
        At toy scale (n=32), BKZ operates in dimensions too small to reflect
        crypto-scale lattice hardness. The method certifies decomposition validity
        at toy scale; extrapolation to n=256 requires either a separate theoretical
        argument or a scaling study beyond this proposal's budget. Nearby object:
        a random module lattice without the SelfTarget hash constraint (pure MSIS)
        — this IS Variant A. The method is explicitly designed to compare them.
        Toy-scale label required; AGENTS.md rule 7 applies.

    heuristic_assumptions:
      - id: H1
        statement: >-
          The MSIS lattice cost at toy parameters (n=32, k=l=2, q=7681) scales with
          BKZ block size β in the same monotone direction as at crypto parameters
          (n=256), even if the absolute costs differ by many orders of magnitude.
        rigorous_support: >-
          The BKZ cost model (Alkim et al., or Albrecht et al. LWE estimator) is a
          monotone function of lattice dimension and norm parameters. At n=32 the
          lattice is small enough that BKZ-β succeeds for small β; at n=256 larger β
          is needed. The monotonicity of the β-success curve is a consequence of the
          Gaussian heuristic for BKZ output length (rigorous up to the heuristic itself).
        validation_plan: >-
          Measure BKZ-β success rate at n ∈ {16, 32, 64} and confirm monotone
          β-dependence. Compare BKZ success curves at toy scale to the Albrecht et al.
          estimator's predictions for the same dimension. If curves match in shape
          (not absolute value), H1 is supported at toy scale. Label as toy-scale
          validation only.

    target_complexity:
      time_exponent: "not applicable — this is a measurement proposal, not a complexity improvement"
      memory_exponent: "not applicable"
      best_known: >-
        The published SelfTargetMSIS hardness is roughly 2^(128/192/256) for
        ML-DSA-44/65/87. This proposal does not claim to improve on it.
      hidden_overhead: >-
        The toy-scale experiment probes the independence assumption. Any hidden
        overhead in the assumption would show up as a multiplicative factor in the
        oracle-query-to-BKZ-iteration ratio.
      tradeoff_note: >-
        At toy scale, time and memory are both negligible. Scaling behavior is
        not studied here.

    dominated_by: null
    dominated_by_justification: >-
      Frontier check (2026-08-05): No KN-LIT corpus entry describes a toy-scale
      BKZ comparison between oracle-assisted MSIS (Variant A) and full SelfTargetMSIS
      (Variant B) designed to test the independence decomposition assumption.
      KN-LIT-056 asserts the decomposition; KN-LIT-3907 corrects the proof but does
      not test the decomposition experimentally. Setting null.

    sota_delta: >-
      No comparable experiment found in corpus. This proposal provides empirical
      support (or refutation) for the hardness decomposition assumption underlying
      the SelfTargetMSIS estimate. All results are toy-scale only.

    requires_fips204_body: false
    requires_fips204_body_note: >-
      Toy parameters are academically defined and independent of FIPS 204 exact
      parameters. The experiment studies a structural assumption, not a specific
      parameter set.

    estimated_cost:
      implementation: medium
      compute: low

    recommended_priority: medium
