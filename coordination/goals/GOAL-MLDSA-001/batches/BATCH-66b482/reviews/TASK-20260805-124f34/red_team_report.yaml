  verdict: pass_with_constraints
  summary: >-
    All five proposals have substantive proof_search_maps and explicit falsification
    criteria; two constraints require Coordinator adjudication before dispatch:
    (C1) IDEA-9c1e04's dominated_by:null is contested because KN-LIT-3907's abstract
    already answers the proposal's primary question and the full text was admittedly
    unread during the frontier check; (C2) IDEA-e5c308's independence-assumption
    experiment may be pre-empted by KN-LIT-3907's EasyCrypt mechanization if that
    proof formally verifies the decomposition step. Advisory constraints on Lane B
    framing and sota_delta completeness are noted but non-blocking.

  inference:
    requested_policy: review-adversarial
    resolved_model_id: amazon-bedrock/us.anthropic.claude-sonnet-4-6
    fallback_used: false
    independent_session: true
    model_verified: false

  objections:

    - id: OBJ-RT-001
      severity: constraint
      proposal: IDEA-20260805-9c1e04
      axis: OBJ-1 Pareto honesty / dominated_by
      title: >-
        dominated_by:null is inadequately defended; KN-LIT-3907 abstract is already
        in tension with the proposal's novelty claim
      argument: >-
        IDEA-9c1e04 asks whether the CMA-to-NMA correction introduces a concrete
        tightness loss that materially reduces the SelfTargetMSIS security estimate.
        The KN-LIT-3907 abstract — which the ideation agent did read — states
        explicitly: "we perform a concrete security analysis for the case of Dilithium
        to show that the claimed security level is still valid after addressing the gap."

        The proposal's own minimal_discriminating_test lists as Outcome A: "If KN-LIT-3907
        states 'the claimed security level is still valid after addressing the gap'
        (which matches the known abstract), the tightness loss is absorbed at current
        parameters, and the estimate is confirmed." This outcome, if reached, meets the
        proposal's primary falsification criterion: "If KN-LIT-3907's concrete analysis
        confirms the same security levels... the proof gap does not affect the
        SelfTargetMSIS hardness claim at current parameters, and this proposal's concern
        is falsified at the stated scope."

        Yet the dominated_by_justification reads: "KN-LIT-3907 does not dominate
        IDEA-9c1e04 because domination requires an existing result, not a result that
        might be in an unread text." This is circular: the agent chose not to read the
        full text, then defended dominated_by:null on the ground that it was unread.
        The inventor protocol §5 requires checking every row on the frontier; not
        reading an available local PDF (downloads/140850158.pdf) is not a frontier check.

        The defensible position for the Coordinator: IDEA-9c1e04 is a reading task
        whose answer is already partially visible in the abstract. The dominated_by
        field should be flagged as "conditionally null — requires KN-LIT-3907 full-text
        read before this proposal can be dispatched." Reading KN-LIT-3907 §concrete-security
        is the first action, not an experiment to dispatch.

      cheapest_discriminating_check: >-
        Read KN-LIT-3907 (available: downloads/140850158.pdf), locate the concrete
        security section, and extract the tightness factor f(q_s, q_H) for the
        CMA-to-NMA reduction. If f at q_s = 2^64, q_H = 2^64 adds < 5 bits overhead,
        IDEA-9c1e04 is self-falsified by its own criterion. If f is larger, the
        proposal becomes a documentation task (write down the formula and its impact),
        which is low-cost and may not warrant a full hypothesis specification.

    - id: OBJ-RT-002
      severity: constraint
      proposal: IDEA-20260805-e5c308
      axis: OBJ-1 Pareto honesty / dominated_by (KN-LIT-3907 formal scope)
      title: >-
        Independence-decomposition assumption may be formally verified by the
        KN-LIT-3907 EasyCrypt mechanization; dominated_by:null was not checked
        against the mechanized proof's scope
      argument: >-
        IDEA-e5c308 proposes a toy-scale BKZ experiment to validate the independence
        assumption underlying the SelfTargetMSIS cost decomposition: cost_SelfTargetMSIS
        ≈ cost_MSIS + log₂|C|. The proposal states the assumption is unvalidated in
        the corpus.

        However, KN-LIT-3907 provides "a fully mechanized ROM proof for the CMA-security
        of Dilithium in the EasyCrypt proof assistant." A machine-checked security proof
        of Dilithium's CMA security necessarily encodes the SelfTargetMSIS reduction
        as a formal step; if the EasyCrypt mechanization formally verifies the
        decomposition as a proof obligation, then the "independence assumption" IDEA-e5c308
        proposes to test experimentally is already a formally verified theorem under
        the proof's model. In that case, IDEA-e5c308's experiment would validate
        a structurally correct decomposition in the lattice/random-oracle model —
        a circular confirmation — rather than a questionable assumption.

        The dominated_by_justification for e5c308 does not mention KN-LIT-3907's
        mechanized proof or assess whether the decomposition appears as a verified
        step in it. This is an incomplete frontier check.

        Caveat: the EasyCrypt proof establishes security in the random-oracle model,
        and IDEA-e5c308's experimental check tests independence at a different level
        (concrete BKZ behavior under challenge structure). These are orthogonal if the
        concern is "does challenge structure make BKZ easier?", which is NOT the same
        as the formal proof's guarantee. If the proposal is reframed as testing
        "whether challenge structure (weight-τ sparsity) reduces practical BKZ cost
        in a way the formal model ignores," it would be a distinct and undominated
        question. The current framing conflates the two.

      cheapest_discriminating_check: >-
        Reframe the proposal explicitly as: "Does the weight-τ challenge structure
        create a lattice shortcut not modeled by the standard BKZ cost formula?"
        rather than "Is the independence assumption valid?" The former is not
        pre-empted by KN-LIT-3907; the latter may be. This reframing costs nothing
        and sharpens the experimental hypothesis.

    - id: OBJ-RT-003
      severity: advisory
      proposals: [IDEA-20260805-a8d531, IDEA-20260805-2b6f17]
      axis: OBJ-2 Closure standard / terminology precision
      title: >-
        "Proof coverage gap" conflates proof-model boundary with proof incompleteness;
        this risks overstating the finding
      argument: >-
        Both Lane B proposals characterize the Shin DFA (a8d531) and Jendral glitch
        (2b6f17) as falling in a "formal proof coverage gap." The existing formal proofs
        (KN-LIT-3907, KN-LIT-8ce0b5) are neither wrong nor incomplete: they are
        stated over adversary models that exclude physical fault adversaries by
        construction. Every formal cryptographic proof in the standard model has this
        "gap." Calling it a gap implies the proofs should cover it; calling it a
        "proof-model boundary" is more accurate and does not overstate the finding.

        The Gupta proof (KN-LIT-8ce0b5) is the exception: it explicitly extends a formal
        guarantee to a specific fault class (NTT twiddle faults). The correct framing for
        both Lane B proposals is: "KN-LIT-8ce0b5 establishes the template for fault-class
        formal bounds; Shin and Jendral represent fault classes for which an analogous
        KN-LIT-8ce0b5-style result does not yet exist." This is not a gap in an existing
        proof; it is a missing proof in a new space opened by Gupta's methodology.

        The proposals do correctly disclaim ("it cannot determine whether ML-DSA is
        actually insecure..."), and the proof_search_maps correctly bound the method
        ceiling. The issue is presentation, not logic. However, if this framing propagates
        into a hypothesis specification, it risks a hypothesis claiming "the proof has a
        gap" rather than "no formal fault bound exists for this class."

      cheapest_discriminating_check_a8d531: >-
        From KN-LIT-340675 abstract: the Shin DFA requires identifying intended faults
        from public information. Check whether the faulted challenge c must lie in the
        valid set C for the attack's key-recovery step to work. If c ∉ C, the ML-DSA
        verifier rejects the faulty signature deterministically; if c ∈ C, the attack
        operates as a "challenge substitution" — which is a different adversary class
        from a physical fault adversary and might be modelable in an extended formal model.
        This check is purely from the abstract/mechanism and costs zero compute.

      cheapest_discriminating_check_2b6f17: >-
        Check whether KN-LIT-3907's EasyCrypt proof for deterministic ML-DSA explicitly
        discusses the hedged-mode case. The Jendral attack effectively reduces hedged-mode
        signing to deterministic signing by nulling rnd; if KN-LIT-3907's proof for
        deterministic ML-DSA explicitly requires that ξ is honest (and does not model
        adversarial ξ-forcing), then the gap statement for 2b6f17 is: "KN-LIT-3907
        assumes ξ is generated honestly; the Jendral fault violates this for the
        effective seed." This is a sharper boundary claim than "hedged mode is uncovered."

    - id: OBJ-RT-004
      severity: advisory
      proposal: IDEA-20260805-3f7ab2
      axis: OBJ-3 sota_delta honesty
      title: >-
        sota_delta cites KN-LIT-056 as the only concrete estimate; KN-LIT-3907's
        corrected concrete analysis should be listed as the current best estimate
      argument: >-
        IDEA-3f7ab2's sota_delta states "Published SelfTargetMSIS estimates from
        KN-LIT-056 (Dilithium TCHES 2018): ML-DSA-44 ≈ 128-bit, ML-DSA-65 ≈ 192-bit,
        ML-DSA-87 ≈ 256-bit AES-equivalent. No independent re-derivation found in
        KN-LIT corpus."

        Two sub-issues:
        (a) The numbers 128/192/256-bit are the target security levels, not necessarily
        the exact computed SelfTargetMSIS estimates as they appear in Table 2 of the
        Dilithium paper. The actual estimates may be identical or may show margin above
        the target; the proposal conflates "target" with "computed estimate." If the
        re-derivation reveals the computed estimate differs from the stated target level,
        this conflation is a calibration error at the origin.

        (b) KN-LIT-3907 provides a "concrete security analysis for the case of Dilithium
        to show that the claimed security level is still valid after addressing the gap."
        This constitutes a revision or confirmation of the KN-LIT-056 estimates as a
        function of the corrected proof. The sota_delta should acknowledge this as the
        current best published estimate (KN-LIT-3907 corrected analysis, year = Barbosa
        et al.), not only KN-LIT-056 (year 2018). Even if the numbers are the same,
        the provenance is different.

      cheapest_discriminating_check: >-
        Look up KN-LIT-056 Table 2 (or equivalent) for the exact computed SelfTargetMSIS
        cost at ML-DSA-65 before using the target security level as a proxy. The re-derivation
        proposal is checking whether the formula reproduces the table; using the target level
        as the baseline introduces a possible confusion between "does the table meet the
        target?" and "does the formula reproduce the table?"

    - id: OBJ-RT-005
      severity: advisory
      proposals: [IDEA-20260805-3f7ab2, IDEA-20260805-e5c308]
      axis: OBJ-1 cross-proposal redundancy
      title: >-
        Thematic overlap between IDEA-3f7ab2 and IDEA-e5c308 on SelfTargetMSIS
        hardness is unaddressed; domination relationship after IDEA-3f7ab2 result
        is not preemptively analyzed
      argument: >-
        Both proposals concern the accuracy of the SelfTargetMSIS hardness estimate.
        IDEA-3f7ab2 checks whether the published number is correct by re-derivation;
        IDEA-e5c308 checks whether the decomposition underlying that number is structurally
        valid. The proposals are not identical but have a dependency: if IDEA-3f7ab2
        finds that MSIS dominates by > 50 bits at all parameter sets (its own falsification
        criterion), then the decomposition's validity (IDEA-e5c308's question) becomes
        immaterial to binding security. The ideation report mentions this in section 8
        as an "open direction" (comparing all three assumptions) but does not state the
        conditional dependency between the two proposals.

        The ideation report's Pareto frontier check for e5c308 says "no comparable
        experiment found" and cites KN-LIT-056 and KN-LIT-3907. It does not ask: "if
        IDEA-3f7ab2 is run first and shows MSIS dominates, does e5c308 become dominated
        by that result?" This is not a required check at ideation stage, but the
        Coordinator should sequence 3f7ab2 before e5c308 and gate e5c308 on the outcome.

  proof_search_map_audit:
    # All five proposals pass the four-audit check with substantive content.
    # No field says "N/A" without justification.
    IDEA-20260805-3f7ab2:
      exact_baseline_reproduction: PASS - names specific formula and table entry
      observation_collision_search: PASS - concrete collision: two (MSIS_instance, C_size) pairs
      quantifier_order_statement: PASS - explicit forall/exists with δ thresholds
      method_ceiling_and_nearby_object: PASS - ceiling named (formulaic/model errors only); nearby object is pure MSIS
    IDEA-20260805-9c1e04:
      exact_baseline_reproduction: PASS - baseline is KN-LIT-056 estimate; verified via tightness formula
      observation_collision_search: PASS - collision is two proof paths same advantage bound, different tight step
      quantifier_order_statement: PASS - exists R, forall A, with f(q_s, q_H) explicit
      method_ceiling_and_nearby_object: PASS - ceiling is proof-gap impact only, not BKZ accuracy; nearby object is Schnorr
    IDEA-20260805-a8d531:
      exact_baseline_reproduction: PASS - baseline is KN-LIT-8ce0b5 stated scope; explicit boundary confirmation
      observation_collision_search: PASS - collision is c ∈ C vs c ∉ C under fault; determines proof-model class
      quantifier_order_statement: PASS - forall P in {KN-LIT-3907, KN-LIT-8ce0b5}, exists F outside scope(P)
      method_ceiling_and_nearby_object: PASS - ceiling stated; nearby object is detect-and-abort ML-DSA variant
    IDEA-20260805-2b6f17:
      exact_baseline_reproduction: PASS - baseline is hedged-mode operational argument vs formal theorem
      observation_collision_search: PASS - collision is w under normal signing vs w under Jendral fault
      quantifier_order_statement: PASS - forall P assuming uniform y, exists A (Jendral class) making y computable
      method_ceiling_and_nearby_object: PASS - ceiling stated; nearby object is deterministic ML-DSA under KN-LIT-3907
    IDEA-20260805-e5c308:
      exact_baseline_reproduction: PASS - baseline is decomposition formula; toy-scale reproduction check defined
      observation_collision_search: PASS - collision is (n1,τ1) vs (n2,τ2) same MSIS cost different SelfTarget cost
      quantifier_order_statement: PASS - forall toy params with τ ∈ {3,5,7}, BKZ success independent of τ
      method_ceiling_and_nearby_object: PASS - ceiling named (toy-scale only, no crypto-scale extrapolation); nearby object is pure MSIS = Variant A

  ranking_by_actionability:
    # Ordered from most to least actionable using only academic literature
    # (KN-LIT-056, KN-LIT-059, KN-LIT-3907, KN-LIT-340675, KN-LIT-4f3b80, KN-LIT-8ce0b5).
    - rank: 1
      proposal: IDEA-20260805-9c1e04
      rationale: >-
        The entire test is "read KN-LIT-3907 full text (PDF available locally at
        downloads/140850158.pdf) and extract the tightness factor." Zero implementation,
        zero compute. The test is already partially discriminated by the abstract.
        However, see OBJ-RT-001: reading the full text may immediately falsify the
        proposal, so this should be dispatched as a single reading task before any
        hypothesis specification.
    - rank: 2
      proposal: IDEA-20260805-a8d531
      rationale: >-
        Three-step corpus placement test using only abstracts already indexed.
        KN-LIT-3907, KN-LIT-8ce0b5, and KN-LIT-340675 are all in the corpus.
        The cheapest additional check (c ∈ C requirement) adds one logical step.
        Fully actionable from existing corpus materials with no implementation.
    - rank: 3
      proposal: IDEA-20260805-2b6f17
      rationale: >-
        Same structure as a8d531 but with KN-LIT-3907 and KN-LIT-4f3b80; both
        indexed. Requires checking whether the deterministic-vs-hedged distinction
        appears in KN-LIT-3907, which means reading the relevant sections of the
        full text. Slightly more work than a8d531 because the boundary condition
        (does hedged-mode = deterministic under the Jendral fault in the proof's model?)
        requires a close reading.
    - rank: 4
      proposal: IDEA-20260805-3f7ab2
      rationale: >-
        Manual arithmetic re-derivation from KN-LIT-056. Requires reading Table 2
        (exact parameter values for τ, k, l, q, n) and applying the BKZ cost model.
        The note that "exact τ values are from memory (unverified)" adds a verification
        step before the computation. Low compute, but requires careful parameter lookup.
        Should be sequenced before IDEA-e5c308 (see OBJ-RT-005).
    - rank: 5
      proposal: IDEA-20260805-e5c308
      rationale: >-
        Requires a BKZ implementation over toy lattices. Medium implementation work
        even though compute is low. Not actionable from academic literature alone;
        requires code. Recommend gate on IDEA-3f7ab2 result (if MSIS dominates by
        > 50 bits at all parameters, this proposal loses significance). Reframe the
        experimental hypothesis per OBJ-RT-002 before designing the experiment.

  coordinator_decisions_required:
    - >-
      C1: Before dispatching IDEA-9c1e04 to hypothesis specification, require a
      KN-LIT-3907 full-text read (downloads/140850158.pdf) to check whether the
      concrete security section already provides the tightness factor at q_s = 2^64,
      q_H = 2^64. If it does and the loss is < 5 bits, IDEA-9c1e04 is self-falsified
      and should be closed (per its own falsification criterion) rather than dispatched.
    - >-
      C2: Before dispatching IDEA-e5c308 to experiment design, confirm whether
      the KN-LIT-3907 EasyCrypt mechanization formally verifies the SelfTargetMSIS
      cost decomposition as a proof obligation. If it does, reframe IDEA-e5c308's
      hypothesis as "challenge-structure BKZ shortcut" (not "decomposition validity")
      per OBJ-RT-002. If it does not, dispatch as written.
    - >-
      C3: IDEA-3f7ab2 and IDEA-e5c308 should be sequenced (3f7ab2 first);
      IDEA-e5c308 should be gated on the 3f7ab2 result per OBJ-RT-005.
