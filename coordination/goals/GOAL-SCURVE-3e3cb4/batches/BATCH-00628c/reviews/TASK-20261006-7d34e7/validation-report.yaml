  verdict_scope: >-
    Exact frozen arithmetic, certificates, controls, snapshot binding, and
    stated claim boundaries. This report changes no ledger status.
  joint_verdicts:
    - joint: A-oracle-fidelity-and-sign-linkage
      verdict: holds
      evidence:
        - Singular smooth-locus order p+1 and its complete stated prime factorization reproduced; R=(66,536) has exact order p+1.
        - Seed digest f16fdbf87ede32e18b70f853c97659bb0cf20658693385892c918c91970c03af and d=3419090462492416794041408622244871729251768983841006244224 reproduced.
        - All 72 probes, 25-byte status-plus-I2OSP24 KDF inputs, HMAC tags, least matching lifts, and 1,245,111 comparisons reproduced.
        - Residues are exactly 15075375527598908552546067046058862913433216 and 78222222987683236539393919745863586265518464; after eight self-inverse stages there is one coherent global sign class.
        - Every probe is off the valid P-192 curve, so the validated input predicate rejects it; this does not independently replay the binary call path.
      controls:
        - All 72 output-sign tag equalities held while SEC1 input sign remained bound.
        - Exhaustive p=59 control reproduced 60 scalars, 240 queries, 440 comparisons, 138 two-sign classes, and 102 self-inverse classes.
        - Wrong-a, mutated order/factor/target, and one-bit tag mutations were rejected.
    - joint: A-residual-bsgs-and-replay
      verdict: holds
      evidence:
        - Both widths are 67280421310721; m=5800019, stride=11600037, and g=5800018 cover the contiguous interval after final clipping.
        - Final clipped block is [67280411800629,67280421310720] with overshoot 2089945.
        - The match (orientation=-1,i=3159226,c=36647144291380,j=989698,sign=-1,k=36647143301682) satisfies D=-[j]H and T=[k]H.
        - Recovered d is in range and independent scalar multiplication gives Q=(9d10bca9d9a7cf1db18580b3de475a2c874758c496924606,9f2fac7d1d28e8b7cdcb8fceb8d860ea1954f54624371b7e).
      controls:
        - A forced low-eight-bit fingerprint collision at wrong baby index 77 failed full-x comparison and exact replay.
        - The wrong-sign candidate failed replay; a fingerprint match alone was never accepted.
    - joint: B-order-discriminant-and-boundary
      verdict: inconclusive
      evidence:
        - Pinned p/n provenance, independent 20-base probable-prime checks, nG=O, trace identity, and Hasse uniqueness reproduced; this is not a new p/n primality proof.
        - The recursive C Pocklington tree has 9 nodes and 44 valid witnesses; factor, witness, and deleted-child mutations were rejected.
        - D=t^2-4p=-5*11*31*C is squarefree and fundamental, so conductor is 1; all 13 root/form fixtures and the non-scalar norm lower bound 6027344765084027530636040308278493916237318129474216339879 reproduced.
        - Forward and reverse counts independently agree: oriented=9948061, ramified-only fixed=635, canonical including zero=4974348, canonical nonzero=4974347, scalar principal including zero=104, exact 2^48 boundary=0.
        - The empty-boundary digest is SHA-256 e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855.
      unresolved:
        - >-
          canonical_set_digest is not independently reproducible from the
          frozen contract. SHA-256 of each explicit 13xi16-LE vector, aggregated
          by XOR and sum modulo 2^256, gives
          xor=5353f2d2959720a24244c973e76fe74c36758c4f0aba49a71b2c37aa24b80737;
          sum=def37daf5fde2bf2e36fc9391b9e5d25a279d8355076d76b161826f8557a8f41
          in both orders, not the artifact's fa31a647.../8eedade9.... The
          artifact supplies no per-state hash domain, encoding, byte order, or
          accumulator definition, so exact set identity remains inconclusive
          even though all frozen counts reproduce.
    - joint: B-relation-certificate-and-map-payoff
      verdict: holds
      evidence:
        - All 103 unique nonzero even-ramified exponent vectors are present with no extras or omissions.
        - Independent Z[pi] multiplication, canonical rank-two HNF, reduced-form, alpha=(u,v), norm, lambda, degree, and classification checks pass for 103/103 certificates.
        - Independent certificate-set digest is 972b6b3234323619aa49e01c8b2806973e66afeaddc267d5bc49de8a5c26d5fd.
        - D=-23 g2^3 is correctly detected as non-scalar with alpha=(1,1), norm 8, HNF (8,1,1), and principal reduced form [1,1,6].
        - The symbolic C-degree relation verifies algebraically with alpha=(-t,2), norm |D|, and lambda=2-t mod n, while C>113 makes the edge unavailable and the action on E(Fp)[n] scalar.
        - Explicit maps built=0, calibration records=0/368, HOT/COLD=null, payoff passes=0. The honest conclusion is open/not evaluable, not a weakness.
      controls:
        - 1545/1545 per-certificate mutations plus global D/root/form mutations were rejected by an independent checker.

