  # ---------------------------------------------------------------------------
  fail_closed_findings:
    - id: FC-A
      joint: CJ-4 / CJ-5
      finding: >-
        RG-4 (b) makes DV-18 (a) controls, (b) anchor-identity and (e)
        controls-a1 STOP by construction - their child-job outputs
        (child/<tag>.meta.json, child/<tag>.npz; v2_driver 768, 782, 801, 805,
        816, 671; a1_driver 146) are recorder gaps, and RL-6 (c'), RG-7 (i)
        (17) and RG-3 (d) require none.
      cost: the r4 stage STOPs at DV-18; no r4 package runs.
    - id: FC-B
      joint: CJ-2
      finding: >-
        If the r4 host's kernel does not provide /proc/<pid>/task/<tid>/children
        (built without CONFIG_PROC_CHILDREN, recalled) or refuses
        perf_event_open for a per-task software counter on the child
        (perf_event_paranoid policy, missing capability, seccomp; recalled),
        every created child is child_end undetermined and every package with a
        created child FAILs; DV-18 (f) (xiv) STOPs the stage first (RGL-1,
        RGL-5). Host-conditional; not testable in this review.
      cost: the r4 stage STOPs at DV-18 on such a host.
    - id: FC-C
      joint: CJ-2
      finding: >-
        A created child killed before exec - a timeout SIGKILL after the go
        byte (needs a stall of at least the smallest watchdog, 1800 s) or the
        out-of-memory killer (RGL-4) - is ('OK', -9) with no exec, child_end
        undetermined, FAIL.
      cost: that package FAILs and its dependants stop.
    - id: FC-D
      joint: CJ-5
      finding: >-
        When a callgrind child's outcome is not ok, callgrind_instructions
        returns before removing <rd>/solver/<tag>.callgrind.out (v2_solver
        521-524; removal only at 549). RG-4 (b) attributes it only if an argv
        element "--callgrind-out-file=<path>" (516) counts as the argv naming
