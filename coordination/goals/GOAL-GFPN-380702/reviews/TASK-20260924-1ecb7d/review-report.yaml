            (98-99), builds argv [sys.executable, "-B",
            implementation-v2/v2_child.py, <spec path>] (100) and calls run_child
            with stdout_path .../grid_raw_t<i>.stdout and stderr_path
            .../grid_raw_t<i>.stderr (101).
        - step: 4
          where: v2_child.py 96-104
          what: >-
            the exec'd capped child writes <out>.npz (100) and <out>.meta.json
            (104), the meta carrying its own getrlimit pair (103). Under RG-1 the
