  counterexamples:
    - id: PB-2
      joint: CJ-5 (RG-4 attribution reader); also stops DV-18 (FC-A, CJ-4)
      classification: >-
        PLANNED-BASIS REFUSAL as failclosed's definitions word it, BY DESIGN of
        RG-4 (b). Introduced by the difference: under failclosed as worded the
        same outcomes PASS (evaluator R1 and R2x). Reachable on every normal
        path of the kinds named; no interpreter or operating-system behaviour
        needed.
      sequence:
        - step: 1
          where: trial-plan-v2-r3.json 1054-1059 (package RUN-GFPN-5bf619, order 10)
          what: >-
            A cells m = 4 package lists arm raw, disposition run, no condition.
            Every cells m = 4 package of both r3 plans does (v2-r3 orders 10-12,
            17-19, 24-26; a1-r3 orders 6-8).
        - step: 2
          where: v2_driver.py 1016-1092, 1130-1161; census md 357-359
          what: >-
            cmd_cells runs _run_cell for the raw arm; target 0 always runs (no
            early stop; the 86400 s per-cell watchdog cannot fire first) and
