        other solver 161-165, lock 166-169) -> "no_child", class (A);
        refused_to_start with ERR setrlimit and 97 (193-196) or 99, and with the
        empty report and 99 (186-191 via 206-208) -> "frozen_pre_exec_exit",
        class (C); refused_to_start with a soft read-back mismatch (OK, 98;
        returns at 232) and crashed with a hard-only mismatch (OK, 98) or an
        exec that raised (OK, 99) -> "frozen_pre_exec_exit", class (B). The
        frozen hardware counter opened at 235 when count_instructions is true is
        a separate event and changes nothing here.
      rests_on: rule_eval.out section "CJ-2 NORMAL LAUNCHES"; v2_solver 149-308
      where_it_may_break:
        exec_d_child_reading_time_enabled_0: >-
          Only if the counter is not on the task that exec'd (wrong pid, X6a) or
          the host deviates from RGL-1 - both give undetermined and FAIL
          (fail-closed), never a favourable value.
        timeout_kill_between_go_byte_and_exec: >-
          t0 is taken at 180, before fork, and the first timeout test runs in
          the first loop pass after 236 (263); a kill before exec needs a stall
          of the smallest watchdog (1800 s: builder m3, per-target 1800,
          a1_health DEV_TIMEOUT_S 1800; a1_pari 7200). Not a normal path; FAIL
          (FC-C).
      counter_semantics_and_provenance: >-
        RGL-1's four behaviours (enable_on_exec enables the counter at the
        monitored task's exec and time_enabled then grows; a never-enabled
        counter reads 0 and 0; /proc/self/task/<tid>/children lists the calling
        thread's live children; the after-fork-in-parent callback runs in the
        parent after fork() returns and before os.fork() returns) are recalled
        from the perf_event_open and proc manual pages and CPython's posix
        module (provenance recalled; not opened - documentation is outside the
        permitted read set and the web was not used). Internal provenance - the
        frozen code's own perf_event_attr layout (v2_solver 129-131: disabled
        bit 0, inherit bit 1, exclude_kernel bit 5, exclude_hv bit 6,
        enable_on_exec bit 12, read_format 3) and read (141-145), and the stage
        host's ENOENT for the hardware event (implementation-v2.md 132-135,
        395). The verdict depends on these behaviours holding on the r4 host;
        DV-18 (f) (xiv)-(xx) tests them on the delivered code (RGL-5).
      files_and_lines_read: v2_solver.py 1-552; v2_driver.py 92-214, 628-668; a1_health.py 100-297; a1_pari.py 1-148; trial-plan-v2-r3.json watchdogs; implementation-v2.md 128-137, 393-399
      what_would_change_the_verdict: >-
        A normal launch path that ends with a report / returncode pair outside
        RG-1 (c)'s set without exec, or an exec that the kernel does not count
        as enabling the counter.

