    CJ-6_value_classes_and_neutrality:
      verdict: holds
      reading: failclosed RFR-6 (informational), applied to RG-1 (f) and RG-8
      results:
        values_the_frozen_parent_records: >-
          argv, env, cwd, cap, timeout, lock, count_instructions and the order
          of 210-236 are unchanged (the callback completes inside os.fork
          before 182 runs in the parent). The frozen hardware counter
          (v2_solver 126-136, 233-235, 280-282) is a separate event; a software
          task-clock event occupies no hardware counter, so the frozen block's
          multiplexed flag is unaffected (recalled). wall_seconds (272-274)
          DOES include the callback's duration, because t0 is taken at 180
          before fork, and the same interval counts against timeout_s (263);
          childend's transfer assumption (3) discloses the added work, and
          REG-1 excludes wall-clock fields (reg1-exclusion-list.json X2, X3).
        asynchronous_exceptions: >-
          OBSERVATION (OB-C). A Python-level signal handler that runs while the
          callback's bytecode executes raises inside the callback; RG-1 (a)'s
          callback "catches every exception its own code raises", and CPython
          discards an exception escaping an at-fork callback as unraisable
          (recalled CPython source behaviour). So a KeyboardInterrupt that
          without the callback would surface at line 181 in the parent (P-16:
          raise, wrapper-recorded, FAIL) is consumed and the parent continues.
          Not a FAIL-OPEN under (i)-(v) (the child is recorded and its pair
          read); it is a control-flow change of the frozen parent under a signal
          that RG-1 (f)'s list does not name.
        function_replacement: >-
          By the letter of HR-3 / RL-5 (a closed list of in-process replacements
          of module attributes, read back by attribute at install) the
          registration replaces nothing. It is, however, code that runs inside
          the frozen call (between fork() and os.fork()'s return), so RG-8's
          "a registration, not a function replacement" rests on the
          attribute-level reading of HR-3.
      files_and_lines_read: childend 250-336, 510-522, 653-663; v2_solver.py 122-146, 177-308; implementation-v2-r3/reg1-exclusion-list.json (JSON read, first 1500 characters and key counts)
      what_would_change_the_verdict: an RG-1 callback that changes a frozen argument, the order of 210-236, or the frozen counter's event.

