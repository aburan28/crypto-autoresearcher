  interpreter_and_os_behaviours_relied_on:
    - behaviour: >-
        CPython runs Python-level signal handlers in the main thread at
        bytecode-level check points (after a CALL completes, at function entry,
        on backward jumps), not inside C code; the exception a handler raises
        appears there. PyOS_AfterFork_Child clears pending signals in the child.
      provenance: recalled (CPython 3.11 behaviour; source and documentation not opened)
      verdict_dependence: FO-1 reachability (CJ-0 (b), CJ-1 FO-1 rows); OB-C
    - behaviour: >-
        An uncaught exception ends CPython with exit status 1; an uncaught
        KeyboardInterrupt re-raises SIGINT with the default action (wait status
        -2); SystemExit(code) exits with code (a string gives 1, None gives 0);
        a failed flush at shutdown gives 120.
      provenance: recalled
      verdict_dependence: CJ-1 (RGL-2 premise - no escaped exit status in {97, 98, 99}); CJ-1 holds only with it
    - behaviour: >-
        os.fork runs registered after_in_parent callbacks in the parent after
        fork() returns and before os.fork() returns, also when fork() fails; an
        exception escaping a callback is written as unraisable and discarded;
        subprocess (without preexec_fn) does not run at-fork callbacks.
      provenance: recalled (CPython posix module and _posixsubprocess)
      verdict_dependence: CJ-1 (P-5b row; the callback cannot fire from subprocess.run); CJ-6 (OB-C); RG-1 itself (RGL-1)
    - behaviour: >-
        perf_event_open - a per-task counter opened disabled with enable_on_exec
        is enabled when the monitored task execs (inside exec, after the point
        of no return) and time_enabled then grows; a never-enabled counter
        reads value 0 and time_enabled 0; the owner's descriptor stays readable
        after the task exits and is reaped; without inherit the counter is not
        copied to the task's children; opening on an exiting task fails; a
        software task-clock event uses no hardware counter.
      provenance: recalled (perf_event_open manual page and kernel behaviour; not opened); internal for the frozen attr layout (v2_solver 129-131) and read (141-145)
      verdict_dependence: CJ-1 (X3, X7, X8), CJ-2 (every "exec" and "frozen_pre_exec_exit" row), CJ-6
    - behaviour: >-
        /proc/<pid>/task/<tid>/children (Linux 3.5+, CONFIG_PROC_CHILDREN since
        4.2) lists the thread's children, including exited unreaped ones, in the
        reader's pid namespace; the list is unreliable if children exit during
        the read.
      provenance: recalled (proc manual page; not opened); this host's /proc was not read (outside the permitted read set)
      verdict_dependence: CJ-1 (X3, X6), CJ-2 (FC-B)
    - behaviour: >-
        per-task user-only counting on one's own child is permitted at
        perf_event_paranoid <= 2 upstream and refused under stricter
        distribution levels without a capability, or under a seccomp filter;
        ENOENT for a hardware event means the call reached event
        initialisation.
      provenance: recalled; internal for the stage host's ENOENT (implementation-v2.md 132-135, 395)
      verdict_dependence: FC-B only
    - behaviour: the kernel stores RLIMIT_AS as set and getrlimit returns it unless another process changes it.
      provenance: recalled
      verdict_dependence: PB-4 reachability only
    - behaviour: >-
        the signal layer loaded with cypari2 converts SIGINT / SIGHUP / SIGALRM
        outside its protected blocks into Python's SIGINT handling and error
        signals into a diagnostic and signal death; it raises SystemExit only
        inside protected blocks, without a code.
      provenance: recalled (third-party, outside the repository; not read)
      verdict_dependence: CJ-1 residual dependence (no escaped exit status in {97, 98, 99})

