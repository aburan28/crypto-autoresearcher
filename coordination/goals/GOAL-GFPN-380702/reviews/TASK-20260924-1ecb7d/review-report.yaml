      cited to frozen lines, are evaluated under five encodings of the rule
      texts - R0 readbackclose RK-1 (a)/(b) and RK-3 (b) as worded (RL-3 gaps
      gate nothing); R1 failclosed as worded (RF-0 (b), RF-1 (a)/(b), RF-2,
      RF-3 (a); RL-3 as readbackfull 279-282 words it); R2 childend (R1 with
      RG-1 (c)/(d), RG-2 (a)/(b) and RG-4 (b)); R2x (R2 with the RG-4 (b) gap
      rule switched off, which isolates RG-1 and RG-2); R2w (R2 with RG-1 (c)
      weakened as CJ-0 names). Each object sits in a package with k = 0 or 1
      other class (B) launch and is read under two manifest variants of the
      requested cap at v2_check_run 64 (Mr3 - r3_run_wrapper 550, None when the
      wrapper wrote raw-result.json; Mc - recorded independently). RECORD
      LEVEL - per launch record the recorded child_created, the class, under
      R2* the child_end, and whether (iii) holds or a record written in another
      process is detected. PACKAGE LEVEL - the frozen checker items that fail,
      the verdict, FAIL-OPEN iff one of (i)-(v) holds while the verdict is PASS
      or PASS_ZL, and PLANNED-BASIS REFUSAL iff a DESIGNED driver-logic outcome
      that a dependant's frozen logic acts on (or an RFR-2-listed row) gets
      FAIL. Escapes, raises and hypotheticals are marked not designed.
