        writes, FO-1 is not a FAIL-OPEN, but the joint's third claim ("detects
        every record ended in a process other than the installing one") is
        still not met on that sequence. Reachable only through documented
        interpreter behaviour (asynchronous exceptions delivered at bytecode
        boundaries in the fork child, the census's L-11 class), combined
        with either a further asynchronous exception or kill during the
        recorder's foreign-file write, or an operating-system error confined
        to that write. No argv is executed and no capped child is created by
        the foreign process.
      what_holds: >-
