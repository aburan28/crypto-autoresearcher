        effect RFF-3 cites against admitting W-1. Not a FAIL-OPEN under
        (i)-(v); RF-3 (a) admits class (A) by design.
    - id: OB-4
      text: F-4's carve-out (J-2 observation_F-4).
    - id: OB-5
      text: >-
        Children launched outside run_child, uncapped and outside the
        definitions' "capped child": a1_driver 90 -> a1_pari 118-123 (the gp
        version query), v2_solver 531-533 (callgrind_annotate), v2_common
