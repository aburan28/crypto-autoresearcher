    - id: OB-9
      text: >-
        RF-4 (a) (1) "the ladder path": the wrapper reads r3_common.LADDER_PATH
        (r3_run_wrapper 464, a sha256 record only), which the census table
        (md 615-622) does not list; RF-4 (a) (2) does not state that the
        development ladder and fixture files are byte-identical to the real
        ones. Any difference is caught only by RF-4 (d)'s STOP.

  interpreter_semantics_relied_on:
    - rule: >-
        Python signal handlers run in the main thread between bytecode
        instructions, not inside the C-level handler; an exception raised by
        a handler appears at that point.
      where_documented: the standard library documentation of the signal module, section on executing Python signal handlers
      provenance: recalled (not opened; no web access in this review)
      verdict_dependence: FO-1 steps 2 and 4 depend on it; no other verdict does
    - rule: >-
        An exception raised in a finally clause, or while another exception
        is handled, gets the earlier exception as __context__; raise ... from
        sets __cause__ and __suppress_context__, which does not clear
        __context__.
      where_documented: the language reference, the raise statement and the try statement
      provenance: recalled
      verdict_dependence: J-1 (iii) on P-F2 (RF-1 walks both links; a deviation yields undetermined or FAIL, RFL-4)
    - rule: A traceback keeps its frames, and their locals, reachable until it is released; tb_lineno is the line of the traceback entry.
      where_documented: the data model, traceback and frame objects
      provenance: recalled
      verdict_dependence: J-1 (iii); a deviation yields undetermined (RF-1)

  # ---------------------------------------------------------------------------
  red_team_report:
    id: TASK-20260924-f5631b
    task_id: TASK-20260924-f5631b
    claim_under_review: >-
      The DRAFT AMD-EXP-GFPN-05ff43-20260924-failclosed (sha256
      1dec09a9bd6e0a0dea6b8de7f3154c500fa80aafb95a7f862e4b21393b2b834c): its
      fail-closed recording, verdict and development-harness rules, read on
      the card's joints J-1..J-6.
    objections:
      - >-
        FO-1: RF-1 (b)'s detection of a recorder call that ends in a process
        other than the installing one depends on a write by that process; when
        the write fails or is interrupted, the entry's pari-stack.json write
        in that process goes undetected and the parent's class (C) or (B)
        record admits PASS. FAIL-OPEN under (iv) as worded; no argv executed.
      - >-
        PB-1: outcomes with launch records and no collected pair are, by the
        draft's own definitions, planned basis outcomes that RF-2 / RF-3 FAIL
        by design; RF-3 (b) names them designed stops. The definitions and
        RF-3 (b) disagree.
      - >-
        FC-1 / FC-2: RF-4 (c) and (d) as worded make DV-18 STOP by
        construction on the r3 base (three REG-1 items; path-bearing argv).
      - >-
        OB-1: the premise that RK-3 (b) as worded PASSes the "driver died
        after 227" route holds only if the requested cap is recorded
        independently of raw-result.json; on the r3 base item 68-70 fails.
      - >-
        FC-5: the R-12 contingency route RF-0 (d) points to is unavailable for
        FAILs whose recorded failure_class is not infrastructure_error.
    required_controls:
      - >-
        A scratch development check (RF-6 (f) style) in which the child's
        recorder-foreign write is made to fail, and separately interrupted,
        recording what every r4 artifact and the r4 verdict then show.
