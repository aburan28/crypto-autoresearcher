        on any census path or constructed path: false is assigned only when
        rec is unbound or lacks the key AND every _run_child_locked frame on
        the chain has tb_lineno below 181 with no pid; fork is at 181 and pid
        is bound only there (dis of source text: 181 LOAD_GLOBAL os,
        LOAD_ATTR fork, PRECALL, CALL, STORE_FAST pid). P-16, P-F2 after P-16,
        a failing fork, chains longer than 16 and cycles give undetermined.
        (i) the pair is copied on every path on which 227 executed (returned
        record, or rec in the outermost run_child frame on raise); it is lost
        only on a recorder failure in the installing process, which ends the
        frozen driver (no handler; scan (3)) and so FAILs the package
        (RF-0 (b), RF-3 (a)).
      paths_evaluated: >-
        Census rows P-1..P-4, P-5a (rec bound and unbound), P-5b (178-180 and a
        failing fork at 181), P-6, P-7, P-8, P-9, P-10..P-13, P-14a/b/c, P-16,
