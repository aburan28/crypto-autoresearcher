  # ---------------------------------------------------------------------------
  counterexamples:
    - id: FO-1
      joint: J-1
      classification: >-
        FAIL-OPEN under definition (iv) as literally worded; under a reading
        of (iv) limited to records written by the recorder, not a FAIL-OPEN
        (nothing the recorder wrote exists) but J-1's third claim is unmet.
      reachability: >-
        Only through documented interpreter behaviour (asynchronous exceptions
        at bytecode boundaries in the fork child, as L-11), combined with a
        further asynchronous exception or kill during the recorder's
        foreign-file write, or with an operating-system error confined to
        that write (the entry's later pari-stack.json write must succeed).
      sequence:
        - step: 1
          where: v2_solver.py 181
          what: os.fork() creates the child; the parent holds pid > 0.
        - step: 2
          where: v2_solver.py 181-183 (dis - 181 CALL, STORE_FAST pid; 182 LOAD_FAST, COMPARE_OP, POP_JUMP; 183 NOP)
          what: >-
            In the CHILD an asynchronous exception (for example
            KeyboardInterrupt from SIGINT sent to the child's pid) is delivered
            at a bytecode boundary before the try at 183. Variant B: the child
            has written OK at 198 and closed rep_w at 199; a first
            asynchronous exception at 202 is caught at 206 and a second is
            delivered at 207-208 before os._exit(99).
        - step: 3
          where: v2_solver.py 172-174, 114-118
          what: >-
            The exception leaves _run_child_locked in the child; run_child's
            finally calls lk.release() there (flock LOCK_UN on the open file
            description the parent shares, then close).
        - step: 4
          where: failclosed RF-1 (b); readbackfull RL-1 (d)
          what: >-
            The r4 recorder sees the call end in a process other than the
            installing one and starts writing recorder-foreign-<pid>.json in
            the run root; a further asynchronous exception is delivered before
            the file is durable (or the write fails with an error confined to
            it). RF-1 (b) specifies no failure path in the foreign process
            ("It takes no other action there: it does not exit, signal or
            wait"); RL-1 (d)'s "a recording failure ... package failed" has no
            channel from that process.
        - step: 5
          where: scan (3); r3_entry_v2.py 67-79 (r3_entry_a1.py 98-110); r3_common.py 405-417
          what: >-
            The exception crosses the frozen callers with no handler, reaches
            the entry's try, which records the status and in its finally
            writes pari-stack.json IN THE CHILD, then re-raises; the child
            exits (status 1, or by SIGINT).
        - step: 6
          where: v2_solver.py 213-225 (variant C) or 227-308 (variant B)
          what: >-
            Parent, variant C: blocked at 214 until EOF (the child held
            rep_w), reads an empty report, sets the key at 220, closes go_w,
            reaps the child at 223 and returns refused_to_start with report ''
            and a returncode other than 99. Variant B: the parent read OK and
            the pair at 227, wrote the go byte at 236 and reaped the child in
            the 243-271 loop; outcome crashed with the pair equal to the cap.
        - step: 7
          where: failclosed RF-3 (a)
          what: The installing-process recorder writes a class (C) (variant C) or class (B) (variant B) launch record.
        - step: 8
          where: v2_driver.py 77-88 (finish)
          what: The frozen driver treats refused_to_start / crashed as values, continues and writes raw-result.json; raw_result_writer is driver (RF-0 (b)).
        - step: 9
          where: r3_entry_v2.py 75-77
          what: At the parent's exit its entry rewrites pari-stack.json, overwriting the child's record.
        - step: 10
          where: failclosed RF-3 (a); readbackfull RL-4
          what: >-
            Every launch record is class (A), (B) or (C); driver-written; no
            recorder-foreign file; no recorder gap; nothing undetermined; with
            another collected pair the frozen checker exits 0: PASS, and
            dependants are admitted. Definition (iv) holds on the child's
            pari-stack.json write.
      evaluator_rows: >-
        rule_eval.out, objects "P-C before 183, foreign-file write
        FAILED/interrupted; ..." (R1 PASS with (iv) in Mr3 and Mc; R1m FAIL)
        and "P-C after OK (206-208), foreign-file write FAILED/interrupted;
        ..." (R1 and R1m PASS with (iv)).
      substance: >-
        No argv is executed by the foreign process and it creates no capped
        child (no frozen or r3 handler lets it continue; scans (2)-(3)); no
        capped child lacks a recorded cap, so the AC-1 property the draft
        names (options_weighed FB) is not violated. Also written in the child
        and undetected: its traceback on the package's stderr.log. The child's
        LOCK_UN at step 3 releases the parent's host lock during the call.
      cheapest_mutation: >-
        Variant C: class (C) requires returncode 97 with an ERR setrlimit
        report and 99 with the empty report, the frozen child's own pre-exec
        exits (v2_solver.py 196, 208) - positive evidence that the child ended
        through the frozen code; evaluator R1m turns variant C to FAIL.
        Variant B: no parent-side positive evidence was found; a rule that no
        r4 writer (entry, event writer) writes in a process other than the
        installing one removes the undetected record.

    - id: PB-1
      joint: J-3
      classification: >-
        PLANNED-BASIS REFUSAL as the draft's definitions word it;
        definitional (the verdict was FAIL and a designed stop under
        readbackclose RK-3 (c)).
      sequence:
        - step: 1
          where: trial-plan-v2-r3.json cells RUN-GFPN-0983ac (p 4111, ecgfp5_shaped, m 5)
          what: The package runs; every solve launch is refused before fork (v2_solver.py 161-169, another solver-like process or the host lock held), or every created child reports '' or ERR setrlimit (P-6, P-7).
        - step: 2
          where: v2_driver.py 1174-1204, 1235-1236, 1101-1102, 1107
          what: The frozen driver records the targets not_measured, the cell terminal not_measured, run_status failed / resource_exhaustion, and writes raw-result.json (driver-logic outcome).
        - step: 3
          where: v2_check_run.py 65-67; readbackclose RK-3 (b) (ii); failclosed RF-2, RF-3 (a)
          what: No pair is collected, so item 66-67 fails and PASS is unavailable; launch_records is non-empty, so PASS_ZL is unavailable; verdict FAIL.
        - step: 4
          where: failclosed RF-3 (b), RF-0 (d); readbackfull RL-4
          what: The m = 4 dependant RUN-GFPN-5bf619 (requires chain; --prior-run RUN-GFPN-0983ac) is refused - a designed stop.
        - step: 5
          where: v2_driver.py 1006-1013, 1110-1127
          what: >-
            The dependant's frozen logic acts on exactly this outcome:
            _prior_cells reads the m = 5 cells and _condition_met finds
            m5_not_measured met (terminal not_measured, 0 measured), which
            decides whether its conditional arms run. By the definitions the
            outcome is a PLANNED BASIS OUTCOME, and it receives FAIL by
            design.
      also: >-
        build packages with every launch refused before fork or no pair
        (acted on by cells' _load_build, v2_driver 989-1003 and 1068-1075)
        and cells m = 4 packages with launches and no pair (acted on by the
        aggregates, v2_driver 1259-1267 and a1_driver 301-310), and their
        contingencies. Evaluator rows "cells, every launch refused before
        fork (class A only)" and "class C only", and P-1..P-4, P-6, P-7 with
        k_other 0: FAIL in every rule set.
      substance: >-
        Unchanged from readbackclose: the census's RKR-4 (b) table lists
        these rows FAIL with "yes: designed stop" (md 484, 487). RF-3 (b)
        replaced RK-3 (c), whose text excluded them from planned basis
        outcomes; the draft's definition of PLANNED BASIS OUTCOME carries no
        such exclusion, while RF-3 (b) still names "an infrastructure launch
        (as RK-3 (c) defines it)" as a designed-stop class.

  # ---------------------------------------------------------------------------
  fail_closed_findings:
    - id: FC-1
      joint: J-4
      finding: >-
        RF-4 (c) expects exactly one failing checker item on a development
        package (the analogue of r3_check_run 327-330). The r3-base checker
        fails three: 329-330 (verdict NOT_EVALUABLE), 331-332 (d_branch None
        against d-parsed) and 333-334 (exclusion_list_sha256 None against the
        plan's value), because the NOT_EVALUABLE block written at
        r3_run_wrapper 158 and recorded at 565-566 carries neither key. "Any
        other failing item is a STOP."
      cost: DV-18 (a) controls, (b) anchor-identity and (e) controls-a1 STOP as worded; the r4 stage stops for a new decision; no r4 package runs.
    - id: FC-2
      joint: J-4
      finding: >-
        RF-4 (d) makes any difference in argv a STOP, and lists the run
        directory's name and GFPN_RUN_DIR's basename as the only accepted
        label appearances. Every capped child's argv embeds a path under
        GFPN_RUN_DIR (v2_driver 98-101, 160-166, 647-650; a1_pari 91-96;
        a1_health 141-147), which carries the redirected RUNS parent and the
        label; the argv of a development package therefore always differs
        from the plan package's. Flags, binary and thread count are equal.
      cost: DV-18 (a), (b), (e) STOP unless argv is compared after substituting the run-directory path, which the draft does not state.
    - id: FC-3
      joint: J-4
      finding: >-
        Without a commit_sha in the RF-4 (a) (3) synthetic receipt, launch
        (r3_run_wrapper 440) records the stage's phase-A commit as None and
        r3_check_run 255-256 fails; r3_dv12 119 wrote one, and RF-4 (a) (3)
        cites that method without stating it.
      cost: a further DV-18 STOP if the receipt is written without it.
    - id: FC-4
      joint: J-4
      finding: >-
        The r3 child-side shim also wrapped v2_solver.run_child with a
        tracer (r3_dv7 301-314). Carried into an r4 shim it would make the
        RL-5 install read-back refuse (the recorder's captured original
        would not be the frozen function), a W-2 outcome. RF-4 (a) (2)'s
        "only actions" excludes it.
      cost: DV-18 STOP if copied.
    - id: FC-5
      joint: J-3
      finding: >-
        RF-0 (d) offers a designed stop "for a new Coordinator decision,
        which may rule an R-12 contingency". R-12 (r3_run_wrapper 206-228,
        the frozen contingency_rule) replaces only failure_class
        infrastructure_error. A cells package with no measured target is
        recorded failed / resource_exhaustion (v2_driver 1101-1102), and an
        RF-3 FAIL on a completed_valid raw (recorder-foreign file, recorder
        gap, undetermined value) carries failure_class None; neither can be
        replaced under R-12.
      cost: the linear requires chain of either plan stops at that package with no in-protocol contingency; continuation needs a Coordinator decision beyond R-12.
    - id: FC-6
      joint: J-1 / J-2
      finding: >-
        Every raise leaving run_child ends the frozen driver and so FAILs its
        package (wrapper-recorded; raised non-null), including a failing fork
        at 181 with no child (RF-1 undetermined); RF-1's three values bear on
        record exactness only (RF-0 (e)).
      cost: that package fails and its dependants stop.
    - id: FC-7
      joint: J-3 / J-4 (conditional on the unwritten r4 gap test)
      finding: >-
        RL-3 names directories (health/, comparator/, pari/) that also hold
        files no launch writes under its own tag: a1_health 141-143 inputs and
        251 health-<p>.json; a1_pari 91-93 script; the comparator's outputs
        in comparator/. A gap test that maps files to launch records by tag
        would report gaps on controls_a1 and G3.
      cost: controls_a1 or G3 FAIL (a gate stop), or a DV-18 (e) / (c') STOP at stage time.

  observations_outside_the_definitions:
    - id: OB-1
      text: >-
        RF-3 (a)'s parenthetical and RFF-3's last sentence state that under
        RK-3 (b) as worded a package whose driver died after a read pair
        receives PASS. On the r3 base it does not: v2_check_run 68-70 compares
        the collected pair with child_rlimit_as_requested_bytes, which
        r3_run_wrapper 550 takes from raw-result.json's envelope; the
        wrapper-written raw-result.json (500) has none, so the requested cap
        is None and the item fails. The statement holds only if the r4
        wrapper records the requested cap independently of raw-result.json
        (evaluator DIED227: R0 Mr3 FAIL, R0 Mc PASS). RF-3 FAILs the route
        either way.
    - id: OB-2
      text: >-
        RF-0 (b)'s "(written by the frozen command's finish())" is inexact
        for aggregate and aggregate_a1, which write raw-result.json directly
        (v2_driver 1322; a1_driver 388); its test, exists and parses after
        the driver exits, still reads driver; they launch nothing.
    - id: OB-3
      text: >-
        Infrastructure-caused driver-logic outcomes pass: a class (A)
        host-state refusal (v2_solver 161-169) of a build child gives a build
        row refused_to_start that cells read as "polynomial unavailable"
        (v2_driver 1068-1075); a missing or changed cached polynomial (cache
