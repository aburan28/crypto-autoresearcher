red_team_report:
  id: RT-20260923-01af16
  task_id: TASK-20260923-01af16
  review_plan_ref: ledger/handoffs/TASK-20260923-cc166b.yaml
  experiment_id: EXP-GFPN-726eb2
  hypothesis_id: H-GFPN-ee4d45
