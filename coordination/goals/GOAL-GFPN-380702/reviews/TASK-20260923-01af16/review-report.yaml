    control.

  headline: >-
    J5 HOLDS (every tag is defensible under the table's own vocabulary and
    every quoted fragment is verbatim; six EcGFp5 line locators are off under
    ordinary line numbering, and the vocabulary has a gap the 142 row falls
    into). J6 BREAKS, narrowly and repairably: nothing committed reads the
    audit as evidence about attack cost, 128-bit security, index calculus,
    OA-SDH or covers, but "audit complete" is not an honest description of a
    SafeCurves-style audit -- six of the eleven SafeCurves criteria as this
    program's SCURVE lane operationalises them were neither examined nor
    marked not_verifiable, the extension-field transfer criterion is absent
    from the tables, and the row label "PASS" means "computed with a
    certificate" (six rows) or "the search's first hit equals the declared
    tuple" (rigidity), never "the audited curve meets the criterion". THE
    PROVES-TOO-MUCH CONTROL
    FAILED ON THREE OF FOUR OBJECTS: on a supersingular curve the pipeline
    reports embedding_degree PASS with e = n - 1 (320 bits) where the true
    value is 2; on a subfield curve it reports rigidity "reproduced" and files
    a proof of composite order under NOT_VERIFIABLE; on EcMasFp5 with three
    tampered self-reports every affected row reads PASS and the tampered CM
    integer does not reach the audit table at all. Only object D (shifted
    rigidity claim) fails as it must. The contract's falsification criterion
    ("That criterion row is FAIL") is unreachable by construction: of the
    nine row labels only rigidity_reproduced has a FAIL branch. No certified
    number of the two named curves is touched by any of this.

  # ---------------------------------------------------------------------------
  # J5 -- FIGURE-PROVENANCE TAGS
  # ---------------------------------------------------------------------------
  joint_J5:
    verdict: holds
    attacks_performed:
      - step: (a) every row, every citation, against the frozen text and the table's vocabulary
        done: >-
          Opened each of the 17 top-level citations of the 11 tagged figures
          (18 counting the duplicate nested under curve_rho_159_83) in
          inputs/PORNIN-2022-274-ECGFP5/paper_fulltext.md and
          inputs/ECMASFP5-HACKMD-2025/note_fulltext.md and checked quotation,
          line and tag. Mechanised in scratch/harness/small_checks.py (C1) with
          output in scratch/small_checks.out.json.
        found:
          - >-
            All quoted fragments are verbatim lines of the frozen texts, and
            each one is at the cited line under Python
            str.splitlines() numbering, which is what gfpn_audit.cite() uses
            (line 72).
          - >-
            LOCATOR DEFECT, NOT A CONTENT DEFECT: 6 of the 8 EcGFp5 citations
            are NOT at the cited line under ordinary newline numbering (cat -n,
            editors, GitHub, the Read tool). The paper extraction contains 18
            form feeds (page breaks) that str.splitlines() counts as line
            breaks. field_security_142: cited 142/148/150/151, actually at
            140/146/148/149; embedding_degree_n_minus_1_over_5: cited 905/910,
            actually at 894/899. The same passage is cited in the producer's
            own implementation.md with newline numbering ("lines 131-149"), so
            the note and the table disagree by two lines on the same text, and
            a reviewer opening line 142 reads "5 equations with 5 unknowns, and
            a total degree 2k-1 = 16 ..." instead of the quoted fragment. All
            9 EcMasFp5 citations are correct under both numberings (the note
            extraction has no form feeds).
          - >-
            Tag values: 8 of 11 rows carry a bare vocabulary token (computed
            x6, inherited x1, asserted x1). Two EcGFp5 rows carry annotated
            tags, "computed (in note, from the stated factorization of n-1)"
            and "computed (in note)", which are consistent with the
            vocabulary; the third, EcGFp5 twist_security, carries "not stated
            in the paper". That is accurate (the frozen paper contains no
            twist-security statement; its only "twist" hits are "twisted
            Edwards", lines 825 and 831) but it is a fourth state the
            three-token vocabulary does not define.
          - >-
            STRICT READING CONSIDERED AND NOT ADOPTED: the plan asks that each
            fragment be "at the cited line". Six are not, under newline
            numbering. I rule this a locator defect rather than the plan's
            breaking artifact ("a citation that does not say what the table
            says it says") because every quoted fragment is verbatim, is
            uniquely locatable, and sits at the cited line under a
            deterministic convention (str.splitlines) that the producer's own
            code applies; no citation misrepresents its source. The table
            should declare the convention (F-J5-1).
          - >-
            implementation.md line 205 calls the row `figure_security_142`; the
            table id is `field_security_142` (typo, no effect on the table).
      - step: (b) the EcGFp5 142 tag (asserted vs computed)
        done: >-
          Read paper_fulltext.md lines 112-158 (newline numbering) and
          recomputed the stated arithmetic (small_checks C2):
          (2 - 2/5)*log2(p) = 102.4000 and 2*k(k-1) = 40 for k = 5, total
          142.4, i.e. the paper's "at least 2^142" (line 149).
        ruling: >-
          HOLDS AS "asserted". The vocabulary's "computed" requires "derived in
          the note from its own stated computation AND recomputed here"; the
          audit recomputed nothing (audit_recomputation "not attempted"), so
          "computed" is unavailable. "asserted" = "stated from a model or
          argument without a certifiable computation" fits the figure's
          MEANING: 142 is a lower bound on the cost of one attack family, and
          its load-bearing inputs (about p^{2-2/5} systems; a per-system floor
          "unlikely to go below O(D^2)" under "very optimistic assumptions",
          lines 138-149) are modelling judgements no computation certifies.
          What IS certifiable is the arithmetic from those inputs to 142, and
          it reproduces (C2). The vocabulary has no token for "derived by
          stated arithmetic on an uncertified model, arithmetic recomputable",
          which is exactly where this figure sits; the row's tag_rationale
          discloses the derivation ("p^(2-2/5) ~ 2^102.4 systems, each costed
          at 'unlikely to go below O(D^2) ~ 2^40'"), so the reader is not
          misled. DOES THE DIFFERENCE MATTER TO A READER: only if "asserted" is
          read as "stated without derivation", which the rationale prevents.
          It matters for the vocabulary, not for this row. Separately, the
          table records no UNIT for 2^142 (the paper says "total theoretical
          complexity", line 149, with no unit); see finding F-J5-4.
      - step: (c) the EcMasFp5 inheritance, as a category
        done: >-
          Read note_fulltext.md lines 231-281 and paper lines 112-158, 65-79,
          850-855.
        ruling: >-
          The "inherited" tag is correct provenance: the note gives no
          derivation and says "Since the extension field is the same as the
          one in EcGFp5, we inherit by default its security. In particular,
          this field selection approximately achieves a 142-bit security
          level" (line 257). WHAT THE FIGURE IS A PROPERTY OF: in the paper it
          is the author's cost estimate for ONE attack family (Gaudry's
          summation-polynomial index calculus, lines 125-149; Joux-Vitse's
          variant is mentioned separately at 150-152) on the ECDLP of a curve
          over GF(p^k), and the stated model is parameterised by (p, k) alone:
          number of systems p^{2-2/k}, system shape (k equations, k unknowns,
          total degree 2^{k-1}), ideal degree about 2^{k(k-1)}, per-system
          floor D^2. No curve-specific quantity -- coefficients, group order,
          rational torsion -- enters it. The paper itself then frames the
          conclusion as a property of the field choice ("a degree-5 extension
          field, GF(p^5), is sufficient to achieve 128-bit security against
          all known attacks", lines 154-158), and the note inherits under that
          framing. SUPPORT FOR INHERITING ACROSS DIFFERENT TORSION: none in
          either frozen text. EcGFp5 has a rational point of order 2 (paper
          line 74-75, "the only point of order 2") and order 2n; EcMasFp5 has
          prime order (note line 241, cofactor 1). Neither text argues that
          the attack cost is independent of the curve or of its rational
          torsion; the paper's model simply omits curve inputs. So the
          inheritance is supported by the paper's framing and by nothing else,
          and the table's id "field_security_142" (fixed by the contract,
          specification.yaml figures_under_provenance_audit) adopts that
          framing. Whether rational 2-torsion changes the cost is exactly what
          EXP-GFPN-05ff43 measures; I did not and do not rule on the raw vs
          symmetrized system (joint K7 of TASK-20260923-fe27e4). Also: the
          note inherits more than the figure -- "its security", which in the
          paper includes the Weil-descent dismissal via Diem's k >= 11 theorem
          (lines 120-123) that does not cover k = 5; that part is curve-
          specific (J6, below) and cannot be inherited by field identity.
      - step: (d) H-GFPN-ee4d45 prediction wording
        done: >-
          Compared ledger/hypotheses/H-GFPN-ee4d45.yaml lines 123-127 with
          both provenance tables.
        ruling: >-
          Prediction 2 reads "At least the 142-bit figure tagged inherited
          raw-system floor on EcMasFp5; EcMasFp5 twist 101.93 tagged computed
          vs self-report after regeneration." Second clause MET (tag computed,
          101.9321, |delta| 0.0021 <= 0.01). First clause met ONLY IN ITS TAG:
          the table records "inherited"; the qualifier "raw-system floor"
          appears in neither provenance table nor in implementation.md, and
          it could not appear there, because deciding raw vs symmetrized is
          outside this experiment's scientific boundary (no PDP) and is K7's.
          AS WORDED THE FIRST CLAUSE IS NOT MET. No committed record reports it
          met (the producer states "observations only", implementation.md line
          8), so this is not the plan's breaking artifact; it is an
          instruction to the composition: report "tagged inherited" as met and
          leave "raw-system floor" to EXP-GFPN-05ff43 / K7.
      - step: (e) the 159.83 and 101.93 recomputations vs the note's formula
        done: >-
          Searched the note for any rho formula (none: lines 231-281 give the
          figures, the twist factorization at 278-281 and "We follow the
          criteria in Safe Curves" at 235, but no formula). Tested which
          formula reproduces both reported figures (small_checks C3).
        ruling: >-
          THE NOTE STATES NO FORMULA, so "the formula the note itself uses" is
          identified by fit, not by citation. Of the candidates tried, only
          0.5*log2(pi*l/4) (the audit's, = log2(0.886*sqrt(l)), which is the
          SCURVE lane's rho cost model, audit-plan L4) rounds to BOTH 159.83
          and 101.93 (159.8257, 101.9321); 0.5*log2(l) gives 160.0000 /
          102.1064, 0.5*log2(pi*l/2) 160.3257 / 102.4321, 0.5*log2(pi*l)
          160.8257 / 102.9321, log2(sqrt(l)/2) 159.0000 / 101.1064
          (scratch/small_checks.out.json C3).
          The tag "computed" is right on the note's stated inputs (the twist
          factorization and n); the tag_rationale's "the SafeCurves rho
          formula" should say "the formula that reproduces the note's figures;
          the note states none".
    breaking_artifact: null
    breaking_artifact_note: >-
      No row's tag contradicts the vocabulary on the frozen text; every
      citation says what the table says it says (the defect is in six line
      locators, not in what they locate); and no committed record reports
      H-GFPN-ee4d45 prediction 2 met as worded.
    findings:
      - id: F-J5-1
        what: >-
          Six EcGFp5 citation line numbers use str.splitlines() numbering
          (form feeds counted); under newline numbering they are 2 or 11 lines
          late. Repair: record the numbering convention in the table, or cite
          newline numbers.
        artifact: scratch/small_checks.out.json (C1_citations, C1_formfeeds)
      - id: F-J5-2
        what: >-
          Vocabulary gap: no token for a figure derived by stated arithmetic on
          an uncertified model and not recomputed; and no token for "no figure
          stated" (used ad hoc on EcGFp5 twist_security).
      - id: F-J5-3
        what: >-
          The EcMasFp5 inheritance is supported only by the paper's field-level
          framing; neither text argues curve- or torsion-independence. The row
          name "field_security_142" carries that framing into the program.
      - id: F-J5-4
        what: >-
          No unit is recorded for 2^142 (the paper gives none). This matters
          downstream: DEC-20260921-683a85 makes the rerank of
          IDEA-20260920-68b279 conditional on "EXP-GFPN-726eb2's
          figure-provenance table read[ing] the design note's 2^142 unit as
          something the V3 arithmetic cannot convert"; the table reads no unit
          at all, so that trigger cannot be evaluated from it.
      - id: F-J5-5
        what: >-
          H-GFPN-ee4d45 prediction 2's "raw-system floor" qualifier is not
          recorded and is out of this experiment's boundary; not met as worded.
      - id: F-J5-6
        what: >-
          The rho formula is identified by fit (C3), not stated by the note.

  # ---------------------------------------------------------------------------
  # J6 -- SCOPE AND INTERPRETATION
  # ---------------------------------------------------------------------------
  joint_J6:
    verdict: breaks
    verdict_scope: >-
      The break is in the DESCRIPTION, not in any number or certificate: the
      audit does license the narrow statement, and no committed record reads
      it as evidence about attack cost or 128-bit security; but "audit
      complete" for a "SafeCurves-style" audit is misleading as the committed
      records stand, and the row label PASS says more than the pipeline
      checks. Repairable by the scope sentence below; this is not a reason to
      reject the narrow result (RC-6).
    attacks_performed:
      - step: (a) every committed sentence about this experiment
        read: >-
          H-GFPN-ee4d45 (all), RQ-GFPN-c01af8 (all), goal.yaml (all),
          specification.yaml (all), implementation.md (all), both audit tables
          and both provenance tables, snapshot receipt TASK-20260921-b59aad
          (all non-hash fields), IDEA-20260920-63a902 (all),
          IDEA-20260920-10547b (all), KN-LIT-8aff72, KN-LIT-47d541,
          KN-LIT-edd7ba, CORR-20260923-9204ba, and the passages of
          DEC-20260920-fe73de, DEC-20260921-683a85, DEC-20260921-b5c2da,
          DEC-20260923-885c52, DEC-20260920-11b44c, the six IDEA-20260920
          rho-lane proposals and research/gfp5_deployed_curves_20260920.md
          that mention EXP-GFPN-726eb2, H-GFPN-ee4d45 or IDEA-20260920-63a902
          (located by grep, reviews/ excluded).
        found_not_overreading: >-
          NO committed sentence reads the audit as evidence about security
          level, attack cost, index calculus, OA-SDH, covers or the validity of
          the 142 figure. H-GFPN-ee4d45 lines 39 and 151-154 disclaim all of it
          ("This hypothesis asserts no attack cost and no break of either
          curve"; "Does not decide whether 128-bit claims stand; that requires
          EXP-GFPN-05ff43"); the specification's scientific_boundary and
          invalidation rules forbid it; the receipt's asserts_nothing_about and
          DEC-20260920-fe73de's decision_scope agree; KN-LIT-47d541 calls
          101.93 "a self-report ... not a verified SafeCurves certificate".
        found_overreading_or_trap:
          - quote: >-
              "minimum_effect: >- All SafeCurves-style criteria decided with
              regenerated certificates for both EcGFp5 and EcMasFp5 (or
              explicitly marked not verifiable)."
            where: ledger/hypotheses/H-GFPN-ee4d45.yaml lines 118-122 (prediction 1, metric criteria_verified)
            why: >-
              As worded this is not met (see (b)): six of eleven SafeCurves
              criteria as this program operationalises them were neither
              decided nor marked not verifiable -- both audit tables carry
              `not_verifiable: {}`. The frozen success criterion is narrower
              (the nine declared primary metrics) and IS met; a support that
              cites the success criterion while the hypothesis's own prediction
              says "all SafeCurves-style criteria" is how "audit complete"
              becomes misleading. IDEA-20260920-63a902 line 63 carries the same
              wording ("All SafeCurves criteria decided with certificates for
              both curves").
          - quote: >-
              "result: PASS" on order_certificate, cofactor, embedding_degree,
              cm_discriminant_bits, twist_order_factorization,
              twist_security_bits and rigidity_reproduced, with no legend
            where: >-
              experiments/EXP-GFPN-726eb2/runs/RUN-GFPN-b71f2f/audit-table.yaml
              and runs/RUN-GFPN-3bbef2/audit-table.yaml (rows at lines 5-53);
              labels decided at gfpn_audit.py lines 627-633
            why: >-
              In a SafeCurves-style table PASS reads as "meets the criterion".
              In this pipeline it means "a certificate-bearing value was
              computed" on six rows and "the search's first hit equals the
              declared tuple" on rigidity: no row compares any value with any
              threshold, rigidity never looks at the audited curve, and the
              proves-too-much control below shows the same labels emitted for
              a supersingular curve (embedding_degree PASS), a curve with a
              66-bit CM field discriminant (cm_discriminant_bits PASS), an
              89.5-bit twist (twist_security_bits PASS) and a curve outside
              the published search (rigidity_reproduced PASS). On the two
              named curves the SafeCurves-sense reading happens to be
              consistent with the computed values for the rows present (e of
              317 and 320 bits; fundamental |D| of 322 bits; rho 159.83 and
              twist 101.93 / 120.66 bits), but only against thresholds this
              program holds as RECALLED (SCURVE audit-plan capsule C6b), and
              the table does not say which reading is meant.
          - quote: >-
              "EcMasFp5 self-reports twist security of 101.9 bits, which fails
              the SafeCurves twist criterion for any x-only or ladder
              implementation."
            where: ledger/proposals/IDEA-20260920-63a902.yaml lines 16-18
            why: >-
              A pass/fail claim on a SafeCurves criterion that the audit does
              not decide: the audit recomputed 101.9321 bits and labelled the
              row PASS in the completeness sense; it applied no threshold and
              did not compute the combined curve-plus-twist cost that the
              SCURVE lane's twist criterion (audit-plan L9) includes. Neither
              the IDEA's "fails" nor the table's "PASS" is established by this
              experiment. (Predates the run; not an overreading of it, but it
              will be read against it.)
          - quote: >-
              "reranked to design_now immediately if EXP-GFPN-726eb2's audit
              reports a 2-torsion field structure for either curve that differs
              from the design-note reading (that would change the expected
              genus)."
            where: ledger/decisions/DEC-20260921-683a85.yaml lines 152-155
            why: >-
              The audit examines 2-torsion only over F_{p^5} (EcGFp5: one
              rational 2-torsion point and an irreducible quadratic,
              order-certificate.json two_torsion; EcMasFp5: implied by prime
              order). The structure a Diem/GHS genus depends on (Frobenius
              orbits over F_p, per IDEA-20260920-10547b's mechanism) is not
              computed. The trigger's non-firing must not be read as evidence
              about cover susceptibility.
      - step: (b) SafeCurves criteria as the SCURVE lane operationalises them
        source: >-
          Criterion list and definitions: ledger/goals/GOAL-SCURVE-15e805/goal.yaml
          lines 24-76 (eleven criteria: field, equation, base, rho, transfer,
          disc, rigid, ladder, twist, complete, ind) and
          coordination/goals/GOAL-SCURVE-15e805/batches/BATCH-c49aa3/tasks/TASK-20260824-233cd4/audit-plan.yaml
          lanes L1-L11 (lines 144-1082). Numeric thresholds there are marked
          "RECALLED, not sourced (capsule C6b)"; none is used as a verdict here.
        enumeration:
          - {criterion: field (L1), this_audit: NOT EXAMINED, note: "L1 reads 'p must be prime and of the declared size'. The field here is F_{p^5}, so as the program words the criterion it is structurally not met or not applicable; the audit neither certifies p nor the irreducibility of z^5 - 3 (PARI polisirreducible = 1 in scratch/prep/prep.gp.out, not a certificate) and has no field row."}
          - {criterion: equation (L2), this_audit: NOT EXAMINED as a row, note: "non-singularity is implicit in ellinit succeeding; model derivation cross-checks EcGFp5's Weierstrass constants."}
          - {criterion: base (L3), this_audit: NOT EXAMINED, note: "the order certificate uses a searched point P, not a published base point."}
          - {criterion: rho (L4), this_audit: PARTIAL, note: "curve rho bits recomputed (EcMasFp5 159.8257 in the provenance table; EcGFp5 in raw-result curve_rho_bits) but no row; no automorphism/endomorphism adjustment; no threshold."}
          - {criterion: transfer (L5), this_audit: PARTIAL, note: "MOV/Frey-Rueck via embedding_degree row: decided. Anomalous (#E = q): not a row (trivially excluded by the certified orders). EXTENSION-FIELD TRANSFER (Weil descent / GHS / Diem covers at n = 5): NOT EXAMINED -- excluded by the contract's scientific_boundary ('no GHS cover genus'), owned by IDEA-20260920-10547b (status proposed) and goal criterion C3 (OPEN). This is the transfer criterion most relevant to an F_{p^5} curve: the paper dismisses it by citing Diem's theorem for prime k >= 11 (paper lines 120-123), which does not cover k = 5; the frozen Gorla-Massierer text (inputs/GORLA-MASSIERER-2014-1403/paper_fulltext.md lines 1745-1751) introduces cover attacks as transferring 'the DLP in E(F_q5) to the DLP in the Picard group of a curve of larger (but still rather low) genus' and states, for the trace-zero subgroup T5, that 'it is sometimes possible to map the DLP from T5 into the Picard group of a genus 5 curve ... solved with probabilistic complexity O~(q^{4/3})' and that 'only a very small proportion of curves is affected'. The named curves are not subfield curves (OOS-5), so that passage bears on them only as a pointer that susceptibility at n = 5 is curve-specific; whether and how it applies to them is IDEA-20260920-10547b's question (its Diem 2003 and Galbraith-Hess-Smart sources are recalled, not frozen). Either way a per-curve check is owed and this audit does not make it."}
          - {criterion: disc (L6), this_audit: DECIDED, note: "cm_discriminant_bits row with complete factorisation of |D| and fundamental discriminant (label ruling is J2's)."}
          - {criterion: rigid (L7), this_audit: DECIDED under the producer's reading, note: "J4 (validator) owns the enumeration; the proves-too-much control shows the row is not tied to the audited curve (object B)."}
          - {criterion: ladder (L8), this_audit: NOT EXAMINED, note: "no row, not marked. Recalled pointer only: a prime-order short-Weierstrass curve has no Montgomery model."}
          - {criterion: twist (L9), this_audit: PARTIAL, note: "twist order, factorisation, rho bits and twist embedding degree decided; L9's joint curve-or-twist cost for x-only ladders not examined; no threshold."}
          - {criterion: complete (L10), this_audit: NOT EXAMINED, note: "no row. The EcGFp5 paper asserts complete formulas (lines 83, 829); not audited."}
          - {criterion: ind (L11), this_audit: NOT EXAMINED, note: "no row, not marked."}
          - {criterion: "GFPN-specific: summation-polynomial index calculus cost / validity of 142", this_audit: OUT OF SCOPE, note: "EXP-GFPN-05ff43, goal C1."}
          - {criterion: "GFPN-specific: oracle-assisted static DH", this_audit: OUT OF SCOPE, note: "IDEA-20260920-73dc35 / EXP-GFPN-659e34, goal C2."}
        tally: >-
          Decided: disc, rigid (2). Partial: rho, transfer (MOV only), twist
          (3). Not examined and not marked not_verifiable: field, equation,
          base, ladder, complete, ind (6), plus the extension-field transfer.
        breaking_artifact: >-
          The six unexamined criteria and the extension-field transfer
          criterion, whose omission is stated nowhere in the run packages or
          implementation.md (the contract's scientific_boundary names only
          "no GHS cover genus"), while H-GFPN-ee4d45 prediction 1 claims "All
          SafeCurves-style criteria decided" and both tables report
          `not_verifiable: {}` with every row PASS. Repaired by the scope
          sentence below.
      - step: (c) the success criterion itself
        ruling: >-
          NOT INFORMATIVE ABOUT THE CURVES. "Success is audit completeness"
          is satisfied by any run that finishes: it is met on ALL FIVE
          known-false outputs of the proves-too-much control -- objects C and
          D literally (every primary metric certified, both tags present,
          control row PASS, even with rigidity FAIL on D), objects A and B
          with not_verifiable reasons in place of the order certificate and
          the cofactor covered only by that reason
          (scratch/c7_corrected.json; small_checks C7 had a predicate bug,
          disclosed under budget_accounting). And the contract's
          falsification criterion cannot fire through the row labels
          (object C). So a `support` of H-GFPN-ee4d45 under this
          contract would mean exactly: "for the two named curves the
          instrument produced re-verifiable values for the nine declared
          metrics and the eleven provenance tags, and the self-reports were
          compared" -- the information is in the values, in
          matches_self_report and in the certificates (J1-J4), never in the
          PASS labels. It would NOT mean SafeCurves conformance, any
          threshold met, 128-bit security, anything about the 142 figure
          beyond its provenance tag, anything about covers, or that the
          instrument would have caught a bad curve (it would not: objects
          A-C).
    scope_sentence_for_any_support_decision: >-
      "EXP-GFPN-726eb2 establishes, for EcGFp5 (y^2 = x(x^2 + 2x + 263z)) and
      EcMasFp5 (y^2 = x^3 + 3x + 8z^4) over F_p[z]/(z^5 - 3),
      p = 2^64 - 2^32 + 1, only: certificate-bearing values for the group
      order and cofactor, the MOV embedding degree of the prime-order
      subgroup, the CM discriminant and its fundamental discriminant, the
      quadratic-twist factorisation and its Pollard-rho cost, a re-enumeration
      of each published parameter search under the producer's reading, and
      provenance tags for eleven published figures, with the self-reports
      compared (one mismatch: EcMasFp5's '323 bits', recomputed 322). The
      audit tables' 'PASS' means 'computed with a certificate' (for
      rigidity: the published search's first hit equals the declared
      parameters); no SafeCurves threshold was applied. NOT examined: the SafeCurves field (the field is
      F_{p^5}, not prime), equation, base-point, ladder, completeness and
      indistinguishability criteria; the combined curve-and-twist cost for
      x-only ladders; extension-field transfer by Weil descent / GHS / Diem
      covers at n = 5, where the design note's cited k >= 11 theorem does not
      apply (IDEA-20260920-10547b, goal C3, open); summation-polynomial index
      calculus cost and the validity of the 142-bit figure (EXP-GFPN-05ff43,
      C1); oracle-assisted static DH (C2); and whether either curve meets a
      128-bit level. Affected: none -- this audit threatens no deployed
      system. Safe: none certified -- no system using EcGFp5 or EcMasFp5 may
      cite this audit as evidence of SafeCurves conformance or of 128-bit
      security."

  # ---------------------------------------------------------------------------
  # PROVES-TOO-MUCH CONTROL (objects A-D)
  # ---------------------------------------------------------------------------
  proves_too_much:
    harness: >-
      gfpn_audit.py takes no curve or self-report argument (--curve accepts
      only EcGFp5 | EcMasFp5, line 239; every curve coefficient, self-report
      and declared rigidity tuple is a literal inside main()). Per RC-3 the
      only admissible way to feed it another object is to replace those INPUT
      literals. scratch/harness/make_variants.py does exactly that, asserting
      each target string occurs once in the hash-checked pristine copy, and
      writes the unified diff next to each variant
      (scratch/variants/<object>/variant.diff: 2, 2, 10, 4 and 4 changed
      lines; no operator, comparison, branch, label or threshold touched).
      gfpn_arith.py is copied byte-identical. scratch/harness/run_object.py
      imports the variant, sets the module global REPO to the repository
      root (the copy lives outside experiments/, and REPO, line 46, is only
      used to open the frozen texts), and calls main() with
      --rigidity-budget-seconds 14400, --out under scratch/objects/<object>/out
      and --ecm-log-dir holding byte-identical copies of the 12 GMP-ECM logs
      the producer's runs consumed (runs/RUN-GFPN-3bbef2/certificates/ecm/;
      identical in both runs), plus, for object A only, two genuine GMP-ECM
      logs from scratch invocation 1 (scratch/ecm_objA/). Nothing ran through
      run_wrapper.py; nothing was written under experiments/.
    label_decision_map:
      source: experiments/EXP-GFPN-726eb2/implementation/gfpn_audit.py (committed; sha256 d635a89b...)
      rows:
        - {row: order_certificate, line: 627, rule: "PASS if oc['certified'] else NOT_VERIFIABLE", depends_on: "line 379 (primality proven AND [n]P = O AND Hasse unique AND, for h = 2, the 2-torsion checks)", fail_branch: none}
        - {row: cofactor, line: 628, rule: "same condition as line 627; self_report cell is the hard-coded expected_cofactor", fail_branch: none}
        - {row: embedding_degree, line: 629, rule: "PASS if the factorisation of n-1 is complete else BOUND", depends_on: "e from mult_order_from_factorization (lines 227-234) with n = n_cand (line 397) whether or not the order was certified", fail_branch: none}
        - {row: cm_discriminant_bits, line: 630, rule: "PASS if |D| fully factored else PASS_BITS_ONLY; NOT_VERIFIABLE only if no order at all", depends_on: "matches_self_report column = bit-length comparison (line 452); the integer comparison (line 449) never reaches the row", fail_branch: none}
        - {row: twist_order_factorization, line: 631, rule: "PASS if twist order fully factored else BOUND / NOT_VERIFIABLE", fail_branch: none}
        - {row: twist_security_bits, line: 632, rule: "PASS if twist order fully factored else BOUND / NOT_VERIFIABLE", depends_on: "matches_self_report_within_0.01 (line 499) is recorded, not read", fail_branch: none}
        - {row: rigidity_reproduced, line: 633, rule: "PASS/FAIL from metrics['rigidity_first_hit_equals_published'] (line 580) else NOT_VERIFIABLE", depends_on: "`same` at line 573 (EcMasFp5) / 576 (EcGFp5): the search's FOUND tuple compared with a literal tuple; the audited curve (lines 282-285 / 309) is never compared with the search output", fail_branch: "yes -- the only row that has one"}
        - {row: figure_provenance_table, line: 634, rule: "literal PRESENT", fail_branch: none}
        - {row: scurve_control_certificate_match, line: 635, rule: "literal 'PASS (RUN-GFPN-17ed52, recorded before this run)'; the control run's result is never read", fail_branch: none}
      also: >-
        No row compares any computed value with any threshold. matches_self_report
        is never an input to a label. The order row's note (oc['argument'],
        lines 376-378) is a constant string asserting "n prime (ECPP,
        independently verified)" and is printed even when the proof failed.
        check_run.py lines 37-43 check only that labels agree with metrics, so
        the package gate cannot flag a self-report mismatch either (static
        reading; not executed on scratch outputs, which have no manifest).
    objects:
      - object: A
        description: >-
          Supersingular E_A: y^2 = x^3 - 35x + 98 over F_p, viewed over
          F_{p^5}. Construction verified in scratch invocation 1
          (scratch/prep/prep.gp.out): p mod 7 = 6, kronecker(-7, p) = -1
          (so -7 is inert and a CM-by-(-7) curve is supersingular); j(E_A) =
          -3375 mod p; #E_A(F_p) = p + 1; ellissupersingular = 1 over F_p and
          F_{p^5}; #E_A(F_{p^5}) = p^5 + 1 (PARI, and the pipeline's own SEA
          step). Every odd prime l | p^5 + 1 has q = p^5 = -1 (mod l), so its
          embedding degree is exactly 2; the largest,
          l = 981394945332765852739783890042638080022301387020925721 (180
          bits), was factored and ECPP-proved by the pipeline itself in its
          twist step (p^5 + 1 = 2*7*11*179*7361031152998637*
          10726113484980140970011*l).
        harness: >-
          variants/objA_supersingular (one literal, line 309: A = Fq(-35);
          B = Fq(98)); run under the EcMasFp5 flag (prime-order claim); ECM
