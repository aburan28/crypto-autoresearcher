  # ---------------------------------------------------------------------------
  objections:
    - id: O-1
      joint: proves_too_much
      text: >-
        The audit tables' result labels cannot express a failed criterion or a
        failed self-report (only rigidity has a FAIL branch). The contract's
        falsification criterion is unreachable through them.
    - id: O-2
      joint: J6
      text: >-
        "Audit complete" for a SafeCurves-style audit omits, unstated, six of
        the eleven criteria the program operationalises and the extension-field
        transfer criterion; H-GFPN-ee4d45 prediction 1 as worded is not met.
    - id: O-3
      joint: proves_too_much
      text: >-
        Embedding degree is computed on an uncertified n with an order routine
        whose precondition (n prime) is unchecked; wrong answer (n - 1 instead
        of 2) on object A.
    - id: O-4
      joint: proves_too_much
      text: >-
        Rigidity is certified for the published search, not for the audited
        curve; no check ties the two (object B).
    - id: O-5
      joint: proves_too_much
      text: >-
        A proof of composite order is labelled NOT_VERIFIABLE with the same
        reason string a primecert timeout produces, so the table cannot tell a
        disproof from an infrastructure outcome (object B).
    - id: O-6
      joint: J5
      text: >-
        Six EcGFp5 citation locators use str.splitlines() numbering and are
        off by 2-11 lines under ordinary numbering; the vocabulary lacks tokens
        for "model-derived, arithmetic recomputable, not recomputed" and "no
        figure stated".
  required_controls:
    - >-
      Before this pipeline (or a successor) scores any other curve: objects
      A-D of this report as acceptance fixtures -- embedding_degree must FAIL
      (e = 2) on A; order/cofactor must FAIL and rigidity must not read
      "reproduced" on B; order, twist_security and cm rows must FAIL on C;
      rigidity must FAIL on D. The variant files and diffs in
      scratch/variants/ are ready-made.
    - >-
      A positive control for each unexamined SafeCurves criterion before it is
      ever claimed (the SCURVE lane's control_doctrine, audit-plan lines
      88-101).
  counterexample_or_mutation: >-
    Objects A (supersingular), B (subfield) and C (tampered self-reports),
    each a literal-only mutation of the committed pipeline's inputs
    (scratch/variants/*/variant.diff), are counterexamples to "a PASS row
    certifies the named criterion" and to "a non-reproducing self-report makes
    the row FAIL".
  baseline_comparison: >-
    Not applicable as a speedup comparison: the audit claims no attack. The
    Pollard-rho baseline appears in it only as recomputed figures (EcMasFp5
    curve 159.8257, twist 101.9321; EcGFp5 twist 120.6583). The closest
    specialised baseline for an F_{p^5} curve is the summation-polynomial
    index calculus whose paper estimate is the 142 figure; this audit tags
    its provenance and does not evaluate it (EXP-GFPN-05ff43). No Pareto
    frontier exists for an audit; IDEA-20260920-63a902 records dominated_by:
    unchecked, which is honest, not a fabricated null.
  heuristic_challenges:
    - >-
      None in the audit itself (heuristic_assumptions: [] in H-GFPN-ee4d45 and
      the contract; no asymptotic claim). The exemplar-profile checks
      (numbered heuristics, random-model transfer, o(1) overheads, VW
      interpolation, per-attempt x inverse success probability) apply to the
      142 figure, which the audit only tags; they belong to the EXP-GFPN-05ff43
      round (K-joints), and I did not attack them.
  cost_model_challenges:
    - >-
      The 142 figure's unit is unrecorded (F-J5-4). Whether the paper's
      "about p^{2-2/5} systems" counts attempts or successful relations is a
      bookkeeping question the provenance tag leaves open; pointer to the
      EXP-GFPN-05ff43 round, not asserted here.
  reduction_and_scope_challenges:
    - >-
      The EcMasFp5 note inherits "its security" by field identity; the part
      of the paper's 128-bit argument that dismisses Weil descent cites
      Diem's prime k >= 11 theorem (paper lines 120-123), which does not
      cover k = 5, and cover susceptibility is curve-specific (frozen
      Gorla-Massierer lines 1745-1751). No inheritance by field identity can
      carry it; goal C3 owns it.
  proof_architecture_challenges:
    - >-
      Nearby-object attack (agents/red-team.md 5) run as the proves-too-much
      control: the pipeline fails to distinguish a supersingular curve, a
      subfield curve and tampered self-reports from the named curves in its
      result labels. Missing separators: a threshold verdict per row, a
      match-to-FAIL mapping, a certified-n precondition for the embedding
      degree, and a curve-to-search-output check for rigidity.
  narrowest_supported_statement: >-
    PROPOSAL TO THE COORDINATOR, NOT A DECISION, and subject to J1-J4 (owned
    by TASK-20260923-2d8db0): for EcGFp5 and EcMasFp5 over
    F_p[z]/(z^5 - 3), p = 2^64 - 2^32 + 1, EXP-GFPN-726eb2
    (RUN-GFPN-b71f2f, RUN-GFPN-3bbef2) produced certificate-bearing values for
    the nine declared metrics and provenance tags for eleven published
    figures; the self-reported orders, twist factorisation, 101.93 and 159.83
    rho figures and embedding degrees reproduce, and EcMasFp5's "323 bits"
    does not (322). A separately run control (RUN-GFPN-17ed52,
    Ed448-Goldilocks / curve448) precedes both runs; whether it controls the
    instrument that scored the GFPN rows is J3's to rule, and the GFPN
    tables' control row is a literal (OOS-1). The tables' PASS labels record
    that a value was computed with a certificate, not that a criterion is
    met, and the pipeline has been shown to emit PASS on curves that fail
    the criteria. Nothing is
    established about the SafeCurves field, equation, base, ladder,
    completeness or indistinguishability criteria, extension-field transfer
    (Weil descent / GHS / Diem covers at n = 5), index-calculus or OA-SDH
    cost, the validity of the 142-bit figure, or any 128-bit claim.
  next_concrete_action: >-
    Coordinator, in the evidence record that composes this round: carry the
    scope sentence of joint_J6 verbatim, read EcMasFp5's CM mismatch from the
    matches_self_report column and the raw-result (not from the PASS label),
    and record that the tables' PASS means "computed with a certificate";
    then, before the audit pipeline is reused on any curve, mint one
    instrument-repair task whose acceptance test is objects A-D of this
    report (scratch/variants/*), each required to FAIL the named row.
