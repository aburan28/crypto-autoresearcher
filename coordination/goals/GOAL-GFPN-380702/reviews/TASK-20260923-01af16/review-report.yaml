  claim_under_review: >-
    As stated in review_plan.claim_under_review (P1-P7, producer's words) and,
    if read as supporting, the frozen success criterion of
    experiments/EXP-GFPN-726eb2/specification.yaml ("... every primary metric
    is present with a regenerated certificate or an explicit not_verifiable
    reason; figure_provenance_table includes tags for field_security_142 and
    twist_security_101_93. Success is audit completeness, not agreement with
