          p^5, which finds p, and on p^5 + 1).
        rows_emitted:
          order_certificate: "NOT_VERIFIABLE (matches_self_report false; primality: 'fails Miller-Rabin: composite'; note still reads 'n prime (ECPP, independently verified) ...')"
          cofactor: NOT_VERIFIABLE
          embedding_degree: "PASS; e = 2135987033434293902082969833143585405490115481162544232032811052120416417467265840012020259225601 = n - 1 = p^5 (320 bits); matches_self_report TRUE"
          cm_discriminant_bits: "PASS; |D| = 322 bits; fundamental discriminant 66 bits (-4p)"
          twist_order_factorization: "PASS (largest prime factor 180 bits)"
          twist_security_bits: "PASS; recomputed 89.5043 bits"
          rigidity_reproduced: "PASS; reproduced"
          scurve_control_certificate_match: "PASS (literal)"
          run_status: completed_valid
        expected_failure: embedding_degree reports e = 2 (or another small value) and FAIL
        failed_as_it_must: false
        outcome: PROVED TOO MUCH
        where_it_survives: >-
          Line 629 (no FAIL branch; PASS on completeness of the n-1
          factorisation). The reported e is also WRONG: line 397 sets
