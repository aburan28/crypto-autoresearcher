        wrapper from the frozen function's returned result (r3_resolve.py 253, 263-273, 276-279, 310, 313, 383);
        RB-1 and RL-2 require "copied from the result the frozen function RETURNED ... and from nothing else"
        (readbackcover 199-203; readbackfull 256-265). All go through one single atomic event writer (readbackfull
        223-227). At an event tag the event's attempts list IS the attempt-record list (r3_resolve.py 270, 277),
        so (a) (i) and the attempts clause of (a) (ii) read one list (OB-10).
      stderr_and_argv_paths: >-
        RI-1 (b) names stdout_path only. Each call site derives stderr_path from the same tag as stdout_path
        (v2_driver.py 101, 166, 650; v2_solver.py 517; a1_health.py 145; a1_pari.py 95), so the two duplicate
        together. argv paths are shared: the callgrind argv names <dir>/<tag>.ms as the msolve argv does
        (v2_solver.py 516; v2_driver.py 209), which RI-1 (d) keeps (attcount 317-319); a lost msolve record is
        caught by the count, not by the .ms file.
      RI-1_d: >-
