  reconstruction_rule: "CRI-9 RECONSTRUCTION (rteval_v2.py reconstruct()): child/<tag>.spec.json -> one child-job launch record (argv [python, -B, implementation-v2/v2_child.py, <rd>/child/<tag>.spec.json]; stdout/stderr child/<tag>.stdout/.stderr; v2_driver.py 92-102); solver|health/<tag>.ms.log -> one msolve launch record (argv -f <dir>/<tag>.ms -o <dir>/<tag>.ms.out, -g 1 or -P 1; stdout/stderr <tag>.ms.log/.ms.err; v2_driver.py 161-166, a1_health.py 141-147); solver/<tag>.callgrind.stdout -> one callgrind record (v2_solver.py 515-518, v2_driver.py 208-209); comparator/stdout.log -> one comparator record (v2_driver.py 647-651); pari/<tag>.gp.stdout -> one gp record (a1_pari.py 91-96). child_end exec where the child's outputs exist. PER-TAG RB-1 / RL-2 counts (the records do not exist in r3) are taken INDEPENDENTLY of the listing: from the raw-result.json solver argv of the tag where recorded (-P 1: one RB-1 attempt record; -g 1: one RL-2 pass-through record), else from the frozen call site's gb_only argument (v2_driver.py 711 gb_only=True; 786, 787, 841 gb_only default False). Events and site counters are the archived r3 solver-events.json's (sites v2_driver.solve and a1_health.run_system). Paths are compared as absolute paths under each package's recorded GFPN_RUN_DIR, equal to its current path (command.txt line 2). A listing or count check is a reading of r3 artifacts under r4 rule text: never a result about any package's verdict and never evidence about D."
