observations:
  OB-1: RGL-9's undetected class is narrower than stated; consistent losses FAIL whenever the launch left a file (LN-3, LE-3); only no-file launches escape (LN-6 no definition; LN-7b (ii)).
  OB-2: RI-1's WHY sentence on callgrind ("needs no count of its own ... (b) covers a tag solved twice", attcount 340-345) covers duplication (TW-1 FAIL) but not loss (TW-2, CX-A).
  OB-3: The carried V-7 item already FAILs a package whose solver-events.json changed after the manifest recorded its hash; RGL-7 and RGL-9 describe that detection only as after-the-fact listing hashes. An alteration between the launch and the manifest write is not detected by V-7.
  OB-4: RI-5 (a)'s "before any dependant reads it" holds under r4 (RL-4), not under v2 / r3 (R-8 existence admission).
  OB-5: RI-4's particular list omits the launch-record stdout / stderr paths, the S-2 attempt record command and command.txt line 2, and over-includes the controls raw build npz (absent); the general clause covers the prefix values.
  OB-6: RI-5 (b) changes DV-11's expected inventory (adds the RI-1 counts, epsilon); no package rule changes.
  OB-7: k4a_anchor_system.py's own text writes exactly four .ms files and k4a_results.json into its directory (56-57, 279-281, 318) and starts no subprocess; its runtime was not read (option HI's revisit condition not decided here).
  OB-8: pari/<tag>.gp (a1_pari.py 91-93) and health/<tag>.ms (a1_health.py 141-143) are named exactly by their launches' argv (a1_pari.py 94; a1_health.py 144), so RH-1 (ii) can attribute them; listing them as non-launch writes removes the only file a lost gp record would leave.
  OB-9: RI-3 (19)'s "two renamed attempt-1 files" is descriptive; _rename renames each existing .ms.out, .ms.log, .ms.err and records an absent entry for a missing one (r3_resolve.py 228-237).
  OB-10: At an event tag the event's attempts list is the attempt-record list itself (r3_resolve.py 270, 277); RI-1 (a) (i) and the attempts clause of (a) (ii) read one list; the independent counts there are accepted_attempt, the renamed_files keys and the site counters.

