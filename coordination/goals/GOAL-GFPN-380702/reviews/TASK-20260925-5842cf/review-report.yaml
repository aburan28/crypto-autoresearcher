        LAUNCHKIND AS APPROVED, WITHOUT admitdev.
      derivation: >-
        RB-4 requires, for admission, EACH of G1..G4: (a) raw-result
        completed_valid + gate_pass true; (b) "the r4 checker ... exits 0";
        AND "REG-1 (d-parsed) passed". The r4/r3 checker's own main()
        (r3_check_run.py line 400: "return 1 if (errs or pr.returncode) else
        0") exits nonzero whenever its `errs` list is non-empty. reg1() (line
        155-160) returns {"verdict": "NOT_EVALUABLE", "reason": ...} whenever
        the plan's designated G1 package has not run under RUNS -- a
        condition that holds in EVERY development world of a zero-run stage
        (CRA-1; R4S-12: "no repaired run package exists when this stage
        runs"; DP-5), because no development check ever writes a package
        under the real production runs/ path. Given RG-3 (d)'s categorical,
        UNCHANGED rule ("EXPECTED CHECKER ITEMS on a development package are
        EXACTLY the r4 analogues of r3_check_run.py 329-330 ..., 331-332 ...,
        333-334 ..., because the NOT_EVALUABLE block ... carries neither key
        and G1 does not exist"), reg1_recorded_check (r3_check_run.py
        324-334) always appends exactly three errors on a development
        package: "not recorded PASS", d_branch mismatch, exclusion_list_sha256
        mismatch. So `errs` is never empty and the checker never exits 0 on
        ANY development-world copy, so RB-4 (b) can never hold, so "with the
        original, it admits" (RB-5 (d)'s literal requirement) is
        UNSATISFIABLE in every development world the texts permit.
      primary_evidence: >-
        Independently confirmed against the raw DV-18 (d) attempt record
        extracted from the preserved bundle (stage-r4-dv-evidence.tar.gz,
        member dv18/dv18-summary.json, sha256
        c41c79823444b71b195608ed7e5e0bbe95678c6f48e44511c76780f3103d8424,
        verified against stage-r4-dv/MEMBERS.sha256 before reading): key
        "(d).copies.original.r4_checker_on_the_(a)_package" =
        {"exit_status": 1, "verdict": "FAIL", "frozen_checker_exit": 0,
        "stop_classes": ["another checker item: ['gate.regression_REG-1 not
        recorded PASS: NOT_EVALUABLE', 'gate.regression_REG-1 d_branch None
        != d-parsed', \"gate.regression_REG-1 exclusion-list sha256 differs
        from the plan's\"]"]}. This is the FROZEN checker alone exiting 0
        (read-back present) while the FULL r4 checker exits 1 on exactly the
        three RG-3 (d) items -- so RB-4 (b) ("the r4 checker ... exits 0")
        fails, and RB-4 (b) refuses ("R-7 (RB-4 (b)) the r4 checker on gate
        package DEV-DV18-a-controls: exit 1 verdict FAIL") even on the
        UNEDITED, "original" copy.
      r4_note_agreement: >-
        implementation-v2-r4.md section 10.4 (lines 426-433): "Preflight of
        the F-4 package: with the ORIGINAL copy, RB-4 (a) holds and the r4
        checker on the (a) package has frozen exit 0 and exactly the three
        REG-1 items (verdict FAIL); ... Literal reading NOT MET (the original
        also yields an RB-4 (b) refusal, because of the three REG-1 items)".
        AGREES with this derivation exactly.
      flagged: true
    part_b_RF4c_first_worded:
      predicate: >-
        failclosed RF-4 (c) AS FIRST WORDED (v2_addendum_failclosed.yaml
        lines 463-471): "EXPECTED CHECKER ITEM on a development package:
        exactly the r4 REG-1 item" (singular). Read with the r3 layer's
        NOT_EVALUABLE block (r3_run_wrapper.py line 158, recorded at
        565-566), as childend RG-3 (d) and review TASK-20260924-1ecb7d FC-1
        cite it.
      derivation: >-
        r3_run_wrapper.py line 158: reg1() returns a dict carrying ONLY
        {"verdict": "NOT_EVALUABLE", "reason": ...} -- it has NO "d_branch"
        key and NO "exclusion_list_sha256" key. That dict is not None, so
        line 565-566 writes it into every package's manifest verbatim
        (`if info.get("reg1") is not None: run["gate"] = {"regression_REG-1":
        info["reg1"]}`). reg1_recorded_check (r3_check_run.py 324-334) then
        performs THREE independent tests against that manifest block: (1)
        rg.get("verdict") != "PASS" -> "not recorded PASS: NOT_EVALUABLE"; (2)
        rg.get("d_branch") != R.REG1_D_BRANCH -> since the key is ABSENT,
        .get() returns None, which != the real d_branch value -> "d_branch
        None != d-parsed"; (3) rg.get("exclusion_list_sha256") != plan's value
        -> same absent-key mechanism -> "exclusion-list sha256 differs". All
        three unconditionally fire together whenever G1 has not run, because
        the dict's missing keys always read as None, which is always unequal
        to the required values. "Exactly the r4 REG-1 item" (ONE item) is
        therefore UNSATISFIABLE: the mechanism always produces exactly THREE
        failing items, never one, on any development package.
      primary_evidence: >-
