  AJ2_discrimination:
    verdict: holds
    definitions_applied: >-
      W-IGNORE: a wrapper whose RB-4(b) admits whenever RB-4(a) holds,
      whatever the checker's exit status. W-STRICT: a wrapper that refuses
      every later package.
    derivation: >-
      From the texts: W-IGNORE fails AD-1(d1)(ii) (it would ADMIT the F-4
      package on the readback-emptied copy despite the checker's "no child
      RLIMIT_AS read-back recorded" failure, where (d1)(ii) requires a
      refusal) and AD-1(d2)(ii) (it would ADMIT despite one gate image's
      checker failing on the emptied read-back list, where (d2)(ii) also
      requires a refusal naming that image) -- in both cases because
      W-IGNORE's admission rule never reads the checker's exit status at all.
      W-STRICT fails AD-1(d2)(i) as WORDED (it never admits ANY later
      package, so it cannot satisfy (d2)(i)'s "the wrapper's preflight ...
      ADMITS" requirement), independent of whether (d2)(i)'s premise is
      itself ever reachable (see AJ-1 block 4) -- a wrapper is judged against
      the STATED requirement, not against whether that requirement's premise
      can occur.
    delivered_code_cross_check: >-
      Read as text (no import), the DELIVERED r4_run_wrapper.py's
      r7_gate_packages (lines 210-226) implements RB-4 as TWO INDEPENDENT
      conditions ANDed together: "if r.get('run_status') != 'completed_valid'
      or r.get('gate_pass') is not True: ref.append(...)" (RB-4(a)) followed
      by "v = checker_verdict(g); ... if v['exit_status'] != 0 or v['verdict']
      != 'PASS': ref.append(...)" (RB-4(b), reading the checker's actual exit
      status and verdict). This confirms the DELIVERED code is neither
      W-IGNORE nor W-STRICT (it genuinely reads the checker verdict, and it
      genuinely admits when both conditions are met), which grounds the
      discrimination premise in real code behaviour rather than only in the
      amendment's prose.
    other_wrong_wrapper_check: >-
      A wrapper that reads ONLY the frozen checker's exit (ignoring the r4-
      specific REG-1 items) would see frozen_checker_exit=0 on the (d1)(i)
      original copy (confirmed in the raw record) and so would ADMIT the
      later package there -- but (d1)(i) is part of "THE REFUSAL BRANCH" and
      REQUIRES a refusal. So this alternate wrong wrapper fails (d1)(i)
      itself; it does not pass both (d1) and (d2). No other-wrong-wrapper
      candidate was found that passes both.
    conclusion: HOLDS as claimed; independently re-derived, not merely cited from the draft.

