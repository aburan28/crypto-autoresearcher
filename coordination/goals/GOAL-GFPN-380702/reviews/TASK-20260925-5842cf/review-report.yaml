        undetermined route as a side effect of the RG-1 callback's timing;
        RG-1 (unchanged by AD-1..AD-5) does not introduce a fail-open or
        planned-basis-refusal risk on this axis.
    LKA7b_RL5_readback_load_question:
      question: >-
        does the RL-5 read-back load (r4_recorder.py line 475) lie within
        "each [load] lies in the RL-1 installation" (LKA-7(b)) as worded?
      answer: "yes"
      derivation: >-
