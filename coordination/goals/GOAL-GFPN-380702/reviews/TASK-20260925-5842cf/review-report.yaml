    rfr1_rfr2_on_the_difference: >-
      RFR-1 (no fail-open): searched AD-1..AD-5 for a counterexample in which
      a package that should FAIL is admitted/PASS instead. None found: AD-1's
      outcomes are all explicitly non-package development observations; AD-2
      through AD-5 touch no verdict-computing code path (confirmed for AD-2,
      AD-3, AD-4 by their own text and cross-checked for AD-4 against the
      delivered r4_run_wrapper.py inference_block(), whose key content is
      unchanged). RFR-2 (no planned-basis refusal): searched for a planned-
      basis outcome (a PASS/PASS_ZL row, or Z-C5) that would receive FAIL
      under the difference by design. None found: AD-1 is scoped to
      scratch-only development observations; AD-5(b)'s outer-guard
      restriction can only prevent an EXTRA failure mode (an undeclared
      guard killing a legitimate long-running child), not introduce one.
      Both RFR-1 and RFR-2, applied to the difference, name nothing new.
    O1_ESRCH_exec_question:
      question: >-
        r4 O-1 (note lines 675-682): can a child that execs be reached by the
        ESRCH path, given the go byte (v2_solver.py, as text)?
      answer: "no"
      derivation: >-
        Read v2_solver.py's _run_child_locked (lines 175-236, as text): the
        CHILD reaches os.execve/os.execv (line ~203-205) ONLY after
        `os.read(go_r, 1)` unblocks, and the PARENT writes the go byte
        (`os.write(go_w, b"g")`) only AFTER it has already (a) read the
        child's "OK ..." report to completion (blocking read loop until
        rep_w closes) and (b) optionally opened the hardware perf counter.
        Per childend RGL-1 (v2_addendum_childend.yaml, method_limits_
        declared): "the after-fork-in-parent callback runs in the parent
        AFTER fork() returns and BEFORE os.fork() returns" -- i.e. CPython
        guarantees the RG-1 callback (which opens the software task-clock
        counter targeted at the ESRCH-vulnerable window) completes BEFORE
        ANY of the parent's post-fork code executes, which is strictly
        BEFORE the parent could possibly reach the point of sending the go
        byte. Therefore ANY child that reaches the go-byte wait (a
        precondition for exec) is GUARANTEED to have had the callback's
        counter already opened. The ESRCH race is confined to children that
        terminate via os._exit(97) (setrlimit failure) or os._exit(98)
        (hard-limit mismatch, at line ~199-201) -- BOTH OF WHICH OCCUR
        BEFORE the go-byte wait, i.e. before the child's fate depends on the
        parent at all, so they alone can race the callback. This is
        independently corroborated by the r4 note's own D-9 deviation: the
        DV-18(f)(xx) stand-in for a returncode-98 exit needed an ARTIFICIAL
        1.5s DELAY specifically "so that the parent writes its go byte
        first" -- i.e. so that the callback (which fires long before the
        go byte) has time to open the counter before the child exits,
        confirming that WITHOUT deliberate delay this pre-go-byte exit path
        genuinely can race the callback, while an exec-bound child cannot.
        Note O-1 itself records the ESRCH path was observed ONLY in (f)(ix)
        (stdout in a missing directory, a pre-go-byte os.open failure) and
        object O29b's gp child (also a pre-go-byte stdout-open failure),
        never in an exec case.
