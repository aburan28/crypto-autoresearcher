      - {rule: AD-2, scope: "stage conduct after a STOP condition (procedural; what the stage does next, not any package's verdict)"}
      - {rule: AD-3, scope: "paths, id minting, binding-hash count, ceiling count (administrative bookkeeping, no verdict logic)"}
      - {rule: AD-4, scope: "one inference-block metadata key, content unchanged from the frozen v2/r3 wrapper (\"That key selects no provider, backend, endpoint or model identifier\")"}
