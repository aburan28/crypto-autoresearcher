        run_child`, inside `install()`) is the capture load; line 475
        (`attr = getattr(v2_solver_module, "run_child", None)`, inside
        `readback()`) is the RL-5 read-back load. Both `install` and
        `readback` are functions DEFINED IN r4_recorder.py, the file that
        implements RL-1 (the launch recorder) end to end -- "the RL-1
        installation" as the r4 note's own section 12 table names it ("r4_
        recorder.py 475 readback ... (the RL-5 read-back...)"). No other
        load of the frozen run_child object exists in the delivered r4 tree
        (confirmed: the note's section 12 LKA-7 scan lists exactly these two
        loads, both in r4_recorder.py). So the RL-5 load lies within the RL-1
        installation as worded; LKA-7(b) holds.
    conclusion: >-
      No production predicate, verdict, admission, computed/recorded value,
      frozen byte, argv, or envelope changes under AD-1..AD-5. HOLDS.

