    circularity: >-
      None of the six detectors is derived from launch records: the spec and
      the script are written by frozen code before the fork; RB-1 (e), RB-1 /
      RL-2 records, events and counters are copied from the frozen functions'
      returned results by the resolve layer; comparator.child is copied by the
      frozen driver from run_child's returned record.
    six_sites_complete: >-
      scan_v1.py over the 71 .py files of the six trees: one def of run_child
      (v2_solver.py 149) and of _run_child_locked (177, referenced only at
      171); 12 calls, 6 in production closure (v2_driver.py 101, 166, 650;
      v2_solver.py 517; a1_health.py 147; a1_pari.py 96) and 6 in
      development files outside both entries' import closures
      (r1_devchecks.py 177, r1_devchecks_more.py 75, r2_devchecks.py 186,
      r2_devchecks_more.py 75, r3_devchecks.py 190, r3_devchecks_more.py 80).
      No non-call reference, no store, no from-import, no getattr / setattr,
      no default argument referencing run_child. Dynamic imports exist only in
      implementation/ladder_select.py 28 (v1) and a1_run_wrapper.py 278 (the
      retired a1 wrapper), outside the r3 closures. RJ-4 (a)'s six sites are
      all of them. RJ-4 (b)'s six forms match every ordinary launch's
      stdout_path relative to the package's run directory (child/ 93-101;
      solver/ 160-166; solver/ 517 with workdir sd; comparator/ 647-650;
      health/ via a1_driver.py 129 and a1_health.py 145; pari/ via
      a1_driver.py 86-89 and a1_pari.py 95); see FC-7 for the absolute-path
      reading.
