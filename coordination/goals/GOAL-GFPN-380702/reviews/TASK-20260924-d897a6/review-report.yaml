        where_and_when_written: >-
          By the r4 SE-3 wrapper in the installing process AFTER the frozen
          solve returned, through the layer's single event writer; not by the
          launch recorder (RL-1 replaces run_child, beneath SE-3); not derived
          from launch records.
        lost_record_constructions:
          - "record lost on A, pre_stdout_99, err_setrlimit_97, P8, exec_ok, exec_timeout: RJ FAIL (COUNT GAP and SITE COUNT GAP)"
