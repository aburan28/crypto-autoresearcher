      RJ-1 newly reads RB-1 (e) (written by the SE-3 wrapper after the frozen
      solve returned) and RJ-3 reads raw-result.json (written by finish,
      v2_driver.py 84). An escaped fork child leaves the frozen child path
      only by an exception (the child branch 182-208 has no return), unwinds
      through solve / cmd_anchor_identity / curve_facts with no frozen handler
      (scan_v2: no try encloses a launching call), is caught only by the
      entry's except BaseException, which writes pari-stack.json and
      re-raises (r3_entry_v2.py 67-79; r3_entry_a1.py 98-110). It therefore
      never writes an RB-1 record through the returned-result path (in r3
      _bounded writes nothing when the call raises, r3_resolve.py 263) and
      never reaches finish. RJ-2's script is written before the fork. No new
      definition (iv) route; the r4 event writer on a raise stays under
      failclosed RF-1 as carried.
    residuals: >-
      X1, X6b, X10: os._exit only at v2_solver.py 196, 201, 208; exec only at
      204-205; sys.exit with integers only in v2_child.py 60, 69, 81 (the
      exec'd child program) and __main__ guards; SystemExit raised only with
