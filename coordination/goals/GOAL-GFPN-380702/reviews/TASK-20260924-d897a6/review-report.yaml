fail_closed_findings:
  - id: FC-1
    joint: LJ-4
    finding: >-
      RJ-6 lists the second line of command.txt, whose value is
      "# GFPN_RUN_DIR=<run directory>" (r3_run_wrapper.py 468-471; archived
      command.txt line 2 of RUN-GFPN-bfe956 and RUN-GFPN-f5412a, form OTHER in
      rdscan_v1). The run directory there is neither a path prefix of the
      value nor a whole whitespace-delimited element. The command strings
      a1_pari.py 97, a1_health.py 149 and the S-2 attempt record command
      (r3_resolve.py 198) carry it as the leading part of a whole element
      (<rd>/pari/<tag>.gp, <rd>/health/<tag>.ms, ...), never as an element
      equal to it.
    readings: >-
      Reading A (RJ-6's form clause governs every value, listed or not): line
      2 carries the development run directory "in any other form", a DV-18
      STOP by construction on every DV-18 (a), (b) and (e) package. Reading A'
      ("as a whole whitespace-delimited element" means an element equal to
      the run directory): the three command fields carry it in another form,
      a STOP on DV-18 (e). Reading B (a listed value is substituted by RG-3
      (e)'s every-occurrence replacement, childend 404-415, and compared;
      the form clause applies to unlisted values) and B' (an element that is
      a path under the run directory): no STOP.
    cost: under A or A', the r4 stage stops at DV-18 until a Coordinator reading; no package runs and nothing is a result. Zero under B / B'.
  - id: FC-2
    joint: LJ-4
    finding: >-
      RJ-5 (c) (29)'s second object ("and one whose gp child's stdout open
      fails (a stand-in as in (28)...)") needs an os.open stand-in in the
      child. If "one" is read as another DV-18 (e) controls-a1 development
      package, RF-4 (a) (2) as RG-3 (b) words it ("the development shims wrap,
      replace or trace no function of any module", childend 383-386) forbids
      the stand-in in that package.
    readings: Reading P (it is a DV-18 (e) package) gives a STOP by construction; reading S (a separate development object with RF-6 stand-ins, as the preamble of RJ-5 says) gives none.
    cost: a stage-time STOP under P until a Coordinator reading; the object also costs one more controls-a1-shaped development package (OB-6).
  - id: FC-3
    joint: LJ-4
    finding: >-
      RJ-5 (b)'s stand-in level "a function the frozen solve, run_system,
      callgrind_instructions, child_job or curve_facts calls" admits
      V.run_child itself, which all five call and which the r4 launch
      recorder replaces (RL-1). A stand-in at that attribute bypasses or
      replaces the recorder, so (26) / (32) would show COUNT gaps (a STOP).
      Conversely, the (28) / (29) stand-in (os.open, called by
      _run_child_locked, called by run_child) is at an admitted level only if
      "calls" is read transitively.
    readings: Direct-call reading excludes the os.open stand-in (a harness STOP for (28) / (29)); transitive reading admits it and also admits V.run_child (a STOP if chosen). A reading that excludes the recorder's slot and admits transitive callees has neither.
    cost: a stage-time STOP under the unfavourable readings; no package runs.
  - id: FC-4
    joint: LJ-1
    finding: >-
      RJ-4 (c): "no r4 function calls run_child". The launch recorder is an r4
      function that calls the ORIGINAL run_child (RL-1 (a)).
    readings: >-
      Semantic reading: the closure item STOPs on the recorder itself, by
      construction. Syntactic reading (ast calls through V.run_child or the
      module global run_child, as be2daf BJ-5 derived them): the recorder's
      call through its captured object is not such a call and passes, but a
      call through any stored reference in r4 code is then invisible to the
      scan (no r4 code exists to check; a residual for the stage).
    cost: a stage-time STOP under the semantic reading until a Coordinator reading.
  - id: FC-5
    joint: LJ-6
    finding: >-
      readbackcover RB-7 (331-348, unchanged by the draft except RB-1 (e)):
      "RB-1 values ... read at E1-E4 only by the consumers named here"; "any
      other r4 consumer of an RB-1 value at E1-E4 is a DV-11 STOP". RJ-1 (b)
      reads RB-1 (a) tag and RB-1 (e) with effect E2 and is not named in
      RB-7. attcount RI-1 (a) (i) is in the same position (pre-existing).
    readings: Strict reading gives a DV-11 STOP by construction on RI-1 (a) (i) and RJ-1 (b); the reading under which the draft's own normative text names its consumer (RJ-1 (d), VC-1 (b)) gives none.
    cost: a stage-time STOP under the strict reading.
  - id: FC-6
    joint: LJ-6
    finding: >-
      consumercover's DERIVED VALUE definition (547-552: any value computed
      from a site-record field and stored elsewhere, followed transitively)
      admits a reading D under which callgrind_result_present is derived from
      the existence of the S-3 site record (V-1).
    readings: Reading D makes RJ-1 (b) an r3-lineage consumer with effect E2 that CC-2 does not cover, a CC-5 / DV-11 STOP by construction. Reading K (a key of the S-1 site record, 541-542) gives none (LJ-6).
    cost: a stage-time STOP under reading D until a Coordinator reading.
