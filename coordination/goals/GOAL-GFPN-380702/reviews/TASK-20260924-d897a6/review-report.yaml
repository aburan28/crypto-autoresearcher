  task_id: TASK-20260924-d897a6
  claim_under_review: >-
    The DRAFT AMD-EXP-GFPN-05ff43-20260924-launchkind (sha256
    ac41f38f0c27d86fa98341e222a7ddd2b3d50d1e4476aaf46e454ad8a3b6a050), read
    with everything it incorporates, gives each of the six production launch
    kinds a lost-record detector written independently of the launch
    recorder (RJ-1..RJ-4), so that a lost launch record is a named gap or a
    recorder gap (FAIL) outside RGL-10's consistent-loss premise, without
    refusing any planned basis outcome, and its development checks (RJ-5),
    path values (RJ-6) and statements (RJ-7) hold on the r3 base.
  objections:
    - FC-1 .. FC-8 (fail-closed, reading-dependent stage-time stops or added gaps on failed packages; never a bar)
    - OB-1 .. OB-8 (wording and forward guidance)
  required_controls:
    - >-
      At the r4 stage, before any package: DV-18 (28) and (29)'s second
      object on development packages, recording the gap-level results with
      and without RJ-1 / RJ-2 in the scratch evaluator, and (32) on the
      unaltered (28) package (it also exposes a mis-recorded RB-1 (e), RP-5).
    - A Coordinator reading, recorded before the stage, of RJ-6's form clause for command.txt line 2 and the command strings (FC-1), of RJ-5 (b)'s stand-in level (FC-3), of RJ-4 (c)'s "calls" (FC-4), of RB-7's consumer list (FC-5), of consumercover's DERIVED VALUE for RB-1 (e) (FC-6) and of the stdout forms (FC-7).
  counterexample_or_mutation: >-
    No fail-open counterexample and no planned-basis refusal. Cheapest
    discriminating control: DV-18 (28) (the CX-A control) evaluated with RJ-1
    disabled and enabled. Cheapest mutation that would widen the detected
    class: bind S-2 calls to the frozen health-<p>.json entries (OB-3), and
    extend DV-18 (h)'s scan to stored references of run_child (FC-4).
  baseline_comparison: >-
    Not applicable to a recording / verdict repair (no algorithm and no cost
    claim; Pollard-rho, BSGS and specialized baselines are not engaged).
    The comparison made is against the incorporated drafts: under attcount
    (RI) CX-A, CX-A-gp and CX-A-G2 are PASS and fail-open; under launchkind
    (RJ) they FAIL with a named gap or a recorder gap; with RJ-1 (b) weakened
    (RJw) CX-A is fail-open again.
