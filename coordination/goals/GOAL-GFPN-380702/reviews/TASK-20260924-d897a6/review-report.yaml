          - "TW-2 (a tag solved twice with callgrind, first callgrind record lost): FAIL (CALLGRIND COUNT GAP Ncg=1 vs 2); TW-1 (every record present): FAIL (DUPLICATE-PATH GAP, RI-1 (b))"
