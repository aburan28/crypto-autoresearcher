    # -------------------------------------------------------------------------
    K5:
      verdict: breaks
      one_line: >-
        Arm (iii) as built quotients the wrong group on a factor base where only
        a norm form is F_p-rational; after Weil descent its system has the same
        monomial support, the same Bezout / mixed-volume bound and -- computed in
        square analogues -- the same ideal degree as arm (ii) (64 = 64 at
        n = m = 3 at two primes; 4096 = 4096 at n = m = 4), while an
        F_p-rational (Z/2)^{m-1} x| S_m construction gives 16 and 512. Its
        m = 5 exhaustion carries no information about the FHJRV construction.
      attack_performed:
        - >-
          (a) DERIVE THE GROUP. From implementation.md section 1.3 / D-6 and
          symmetrize.rhs_arm_T: Q = S_{m+1}(x; X) * S_{m+1}(b/x_1, x_2..x_m; X),
          Laurent-normalised, rewritten in t_i = x_i + b/x_i and e(t), factor
          base {P : x(P) + b/x(P) in F_p'}, relations accepted = R or R + T
          (pdp_common.sign_search). Pair identity: translating two points by T
          leaves every relation sum eps_i P_i = +-R intact, so
          S(b/x_i, b/x_j, ..) (x_i x_j)^K = b^K S(x) (FHJRV Prop. 7 / Prop. 12
          argument; the exact Laurent invariance is asserted coefficient by
          coefficient in my n = 3 and n = 4 conversions). Consequently Q is
          invariant under x_i -> b/x_i for EVERY i separately (i = 1 swaps the
          two factors; i >= 2 by the pair identity), under S_m, and under
          X -> b/X. The group acting on the unknowns is the full hyperoctahedral
          (Z/2)^m x| S_m (order 2^m m! = 3840 at m = 5), not FHJRV's
          G2 = (Z/2)^{m-1} x| S_m (order 1920; hal-00935050.txt lines 432-440,
          even sign changes only), and implementation.md's "|G| = 2^{m-1} m!"
          and D-6's "quotients by the same group" are not what the polynomial
          does.
        - >-
          Algebraic form of the defect (my derivation): with the
          anti-invariant w = prod (x_i - b/x_i), the G2-invariant summation
          polynomial is S = A(sigma(t)) + w B(sigma(t)) and w^2 = prod (t_i^2 - 4b);
          the producer's Q = S * S^(1) = A^2 - w^2 B^2 is the NORM from the
          G2-invariant field down to the (Z/2)^m x| S_m-invariant field. It
          squares away exactly the generator that FHJRV's invariant ring keeps
          (Prop. 13, lines 668-669: K[s_1..s_{n-1}, e_n], e_n the
          anti-invariant). Weil descent then imposes Q = 0 separately in each
          of the n Frobenius components, and each component may pick the "R"
          or the "R + T" factor independently: 2^{n-1} branch pairs instead of
          one, each contributing about K^m / 2^{m-1} solutions in sigma-space,
          total about 2^{n-m} K^m -- at n = m exactly the S_m arm's K^m =
          2^{m(m-1)}. Only the two coherent branches carry F_p-rational
          relations; the rest are spurious solutions the solver still pays for.
        - >-
          FHJRV's hypotheses checked against EcGFp5. (i) Section 3.2 (lines
          330-335) needs f_T in PGL2(F_q) for a T-invariant factor base and
          section 3.3 (lines 385-387) needs the invariant generators to lie in
          F_q(X_1..X_n). With phi = x and b = 263z not in F_p this fails; the
          producer's phi-base t = x + b/x in F_p is T-stable but w is not
          F_p-rational on it, so only the norm Q is available. (ii) Prop. 8(i)
          (lines 480-490): the affine involution needed for the polynomial-ring
          form (Prop. 7, Prop. 13) exists iff b is a square in K; Remark 9
          (lines 534-541): otherwise only via full 2-torsion (a^2 - 4b a square).
          Pornin, inputs/PORNIN-2022-274-ECGFP5/paper_fulltext.md lines 871-875: a
          curve y^2 = x(x^2 + ax + b) "may be double-odd ... only if neither b
          nor a^2 - 4b is a quadratic residue". EcGFp5 is double-odd, so
          b = 263z is a non-square and neither route of Prop. 8 / Remark 9
          applies; ladder.json records b_is_square_in_Fq false for all three
          ecgfp5_shaped rungs. FHJRV's construction, as literally stated, is
          NOT available for EcGFp5. (iii) What is available (my derivation, not
          in FHJRV's text): because [F_{p^5} : F_p] is odd, every b equals
          lam^2 beta with beta in F_p* a non-square and lam in F_{p^5}; with
          phi = x / lam, f_T(u) = beta / u lies in PGL2(F_p) for EVERY Frobenius
          conjugate, the factor base {P : x(P)/lam in F_p} is T-stable
          (section 3.2), and the G2-invariant field is generated over F_p by
          sigma_k(u_i + beta/u_i) and w = prod (u_i - beta/u_i). This is an
          invariant-FIELD (non-affine) construction analogous to FHJRV's Q_phi,n
          (Prop. 12/14), not their Prop. 13 ring.
        - >-
          (b) BOUND THE SOLUTIONS. Both arm (ii) and arm (iii) are interpolated
          on monomials_total(m, 2^{m-1}) (symmetrize.build_arm_polynomial), and
          the committed build records show full, identical supports: RUN-GFPN-42a000
          raw-result.json, ecgfp5_shaped, m = 5: S5 support_nonzero_monomials
          20349 and torsion_S5 20349 (N = C(21,5) = 20349 each); m = 4: 495 and
          495 (RUN-GFPN-42a000, RUN-GFPN-c16d20); m = 3: 35 and 35
          (RUN-GFPN-405554). Identical Newton polytope (the degree-16 simplex in
          five variables) => identical Bezout number = mixed volume = 16^5 = 2^20
          for the two descended m = 5 systems. Arm (iii) cannot exhibit the
          predicted drop in the solver's input.
        - >-
          (c) COMPUTED, UNFLOORED (optional square analogue, own code, Sage +
          Singular with msolve cross-check): scratch/k5k7/square_analogue.py,
          output scratch/k5k7/square_analogue_n3.json. n = m = 3 over
          F_p[z]/(z^3 - 2), EcGFp5-shaped double-odd curve y^2 = x(x^2 + 2x + b0 z)
          with b and a^2 - 4b both non-squares (p = 4111: b0 = 7; p = 16777291:
          b0 = 1), two random targets per prime, predictions written in the
          script before the run. Every case, Singular vdim = msolve "Dimension
          of quotient": raw 384 (= 3! * 4^3), S3 64 (= 4^3 = 2^{m(m-1)}),
          PRODUCT (arm iii as built) 64 with the identical 35-monomial support
          and total degree 4, and the F_p-rational D3-type quotient
          (sigma(t'), w) on the rescaled base 16 (= 384 / (2^2 * 3!) =
          2^{(m-1)^2}; A of sigma-degree 2, B of sigma-degree 1, 14 monomials).
          Repeated one degree up (scratch/k5k7/square_analogue_m4.py, output
          square_analogue_n4.json; n = m = 4 over GF(4111^4), one target, raw
          omitted, msolve degrees; at even degree an F_p rescaling exists only
          for b a square, so the curve y^2 = x(x^2 + 2x + z^2) is used and
          beta = 1): S4 4096 (= 8^4), PRODUCT 4096 with the identical
          495-monomial support and total degree 8, D4-type 512 (= 2^{(m-1)^2};
          A sigma-degree 4, B sigma-degree 3, 105 monomials). Predictions were
          written in the script before the run. The pattern D_product = D_S_m =
          2^{m(m-1)} and D_quotient = 2^{(m-1)^2} holds at m = 3 and m = 4.
        - >-
          Existing data (card K5 (c)). The supplementary m = 3 and m = 4
          constructed-solvable cells give D = 1 for both symmetrised arms: that
          is the planted orbit (object C), a floor that cannot show any gain.
          The m = 4 proxies agree to 0.03 percent because the F4 runs are the
          same shape: scratch/k6/k6_objB_summary.json shape_identity_target0
          shows the 29 F4 rounds of S4 and torsion_S4 (RUN-GFPN-f888a7 vs
          RUN-GFPN-fb0726, target 0) have identical rows, columns, new and zero
          counts. Consistent with (b); it cannot show a drop, and none exists.
      breaking_artifact: >-
        The derivation above (group = (Z/2)^m x| S_m via the norm Q = A^2 - w^2 B^2;
        FHJRV Prop. 8 excluded for double-odd b by Pornin lines 871-875), the committed
        identical supports (RUN-GFPN-42a000: 20349 = 20349 at m = 5), and the
        computed example scratch/k5k7/square_analogue_n3.json (n = m = 3, p =
        4111 and 16777291, two targets each: D_product = D_S3 = 64, D_D3-type = 16,
        D_raw = 384; Singular and msolve agree), repeated at n = m = 4
        (scratch/k5k7/square_analogue_n4.json: D_product = D_S4 = 4096,
        D_D4-type = 512).
      consequence_for_the_contract: >-
        Were arm (iii) as built ever to complete at m = 5, its D would be about
        D_S5, so falsification branch F1 ("D_raw/D_torsion_S5 < 2^9") would fire
        by construction, and the aggregate's comparisons (pdp_cell.py lines
        679-680) would record ratio_meets_prediction false for it -- a
        falsification produced by the construction, not by the mathematics.
        The run's m = 5 exhaustion of arm (iii) (RUN-GFPN-805701, RUN-GFPN-61a67b)
        is a property of a 20349-term S_5-shaped system; it says nothing about
        the size or solvability of an FHJRV-type system. Worse than
        uninformative for the band: on the phi-base (~p/4 t-values, 4 points
        each) the decomposition probability accepting R or R + T is
        2 / (2^n n!) = 1/1920 at n = 5 (my count; FHJRV line 854 states the
        same 2^4 x 5! for the genuine quotient), against 1/120 for arm (ii), and
        the T-quotient only halves the relations needed; so arm (iii) as built
        needs ~8x more systems than arm (ii) at the SAME per-system degree -- it
        is dominated by arm (ii) and cannot be the symmetrization-aware arm of
        the band.
      lane_status: >-
        NOT a closure (RC-7). The opposite: the F_p-rational quotient exists for
        EcGFp5-shaped (odd degree, double-odd) curves and realised the predicted
        2^{m-1} drop exactly at n = m = 3 (64 -> 16) and, with b a square,
        n = m = 4 (4096 -> 512); at m = 5 it is ~10x sparser than what exhausted
        the cap. The 2-torsion lane is less tested, and more open, than the run
        set suggests.
      what_this_does_not_show: >-
        Nothing about the ideal degree of any m = 5 system (none was measured by
        anyone); nothing about EcGFp5's security; the D3-type count is an
        n = m = 3 computation plus an orbit-count derivation for general m, not
        a measurement at m = 5.

