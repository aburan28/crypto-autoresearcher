    - id: OOS-2
      bears_on: implementation
      text: >-
        pdp_cell.cmd_build crashes (ValueError: max() of an empty sequence,
        line 312) when a torsion arm has no eligible curve shape, instead of
        recording the refusal (object B, step 2).
    - id: OOS-3
      bears_on: EXP-GFPN-659e34 / H-GFPN-3366ea / TASK-20260921-838c4a
      text: >-
        The m = 4 arm (iii) planned there ("t_i = x_i + b/x_i ... (Z/2)^3 x| S_4 of
        order 192", H-GFPN-3366ea lines 70-75) is the same norm construction. By
        K5 its system has the S4 shape and cost (committed m = 4 CPU 203.1 s vs
        203.3 s over 20 targets, identical F4 shapes), while on the phi-base its
        decomposition probability is 2^{m-1} = 8x lower than S4's (about
        1/(192 p') vs 1/(24 p'): ~p'/4 t-values with 4 points each against ~p'/2
        x-values with 2; my count, consistent with FHJRV lines 345-347). As
        built it can only lose; a precondition issue for that run's arm (iii).
    - id: OOS-4
      bears_on: implementation.md D-6
      text: >-
        D-6 calls arm (iii) "a cruder realisation" that "quotients by the same
        group"; it quotients a larger group through a norm, and FHJRV's own form
        is not available for double-odd b at all (K5). The valid alternative at
        m = 5 is ~10x sparser (<= 1287 + 792 vs 20349 monomials), which bears on
        D-6's explanation of the memory exhaustion.
    - id: OOS-5
      bears_on: EXP-GFPN-659e34 rate ladder (reuse of the m = 4 driver)
      text: >-
        At small p' two producer conventions break down (object A):
        build_arm_polynomial cannot interpolate the m = 4 polynomial (it needs
        >= 495 distinct e-points from 4-subsets of an x-pool of size <= p'/2 and
        samples with replacement), and drawing targets from the largest-prime
        subgroup E[n] concentrates the decomposable points pathologically
        (scratch/objA/objA_enumeration.txt: at p' = 11, E[n] with n = 197 or 1117
        contains 2 of the 448-1288 decomposable points; at p' = 31 on C1, none).
        The planned rate ladder (2^10-2^12) has pools of ~500-2000, so the
        construction issue should not bite there; the subgroup-concentration
        effect should be checked against an exact count at one rate-ladder prime.
    - id: OOS-6
      bears_on: EXP-GFPN-05ff43 / EXP-GFPN-659e34 m = 4 driver (object A)
      text: >-
        pdp_cell.cmd_cell treats an msolve "positive dimension" result (and any
        unparseable output) as zero rational solutions without a flag
        (`if par and "error" not in par`), recording a measured non-decomposition
        with D null; and symmetrize.rational_solutions trusts a parametrisation
        that msolve itself flags as degenerate ("minimal polynomial is not
        square-free") without substituting the parsed point back into the
        system. Located in object A (all 22 2-sum targets; 7 of 302 other
        decomposable targets at p' = 11). Expected negligible for rates at
        p' >= 2^10 (extrapolation), but both are silent reclassifications of
        solver outcomes.

