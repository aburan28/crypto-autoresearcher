  out_of_scope_findings:
    - id: OOS-1
      bears_on: K3 (validator's joint)
      text: >-
        RUN-GFPN-ca7b88 degree_ratios_measured pairs the torsion_S3 arm with the
        raw arm at "matched" p', but the two cells use different planted targets
        on different factor bases (x-base vs phi-base; seeds keyed per arm), so
