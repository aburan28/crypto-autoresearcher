    K7:
      verdict: breaks
      one_line: >-
        The design note's "total degree 2^{k-1} = 16" system with D ~ 2^{k(k-1)}
        = 2^20 is the S_5-SYMMETRIZED system, not the raw one; the raw system's
        degree is ~5! 2^20. The frozen prediction (D_raw ~ 2^20, D_S5 ~ 2^20/120,
        D_torsion ~ 2^20/1920, band 2^121-2^132) is mis-anchored by 5! = 120.
      attack_performed:
        - >-
          (a) FROZEN TEXT. Pornin, inputs/PORNIN-2022-274-ECGFP5/paper_fulltext.md
          lines 138-149: "Gaudry's attack entails computing about p^{2-2/5} ~
          2^102.4 systems ... Each system would contain 5 equations with 5
          unknowns, and a total degree 2^{k-1} = 16 ... D the degree of the
          underlying ideal, which should be close to 2^{k(k-1)} = 2^20 ... it is
          unlikely to go below O(D^2) ~ 2^40. This leads to a total theoretical
          complexity of at least 2^142". Joux-Vitse, the source Pornin cites,
          inputs/JOUX-VITSE-2010-157/paper_fulltext.md lines 280-288: "each phi_i
          is a symmetric polynomial over F_q, of degree at most 2^{n-1} in each
          variable ... As advised by Gaudry, it can be written as a system of
          polynomials of total degree 2^{n-1} in terms of the elementary
          symmetric functions e_1, ..., e_n ... This yields a univariate
          polynomial whose degree is generically 2^{n(n-1)} in this case"; and
          line 353 ("n equations defined over F_q with n variables of total
          degree 2^{n-1}"). Pornin's sentence is JV's description of the
          e-symmetrized system.
        - >-
          (b) DEGREES AND BOUNDS (checkable). Raw S_6(x_1..x_5; x_R): degree 16 in
          EACH x_i, total degree up to 5 * 16 = 80. Newton polytope of each
          descended equation is contained in the box [0,16]^5, so the BKK /
          mixed-volume bound is 5! * 16^5 = 2^26.9 (total-degree Bezout
          80^5 = 2^31.6); the n = m = 3 analogue attains the full-box count
          3! * 4^3 = 384 exactly (below), so the bound is not loose there. S_5-symmetrized in e_1..e_5:
          total degree 16, polytope = degree-16 simplex, Bezout = mixed volume
          = 16^5 = 2^20 = 2^{k(k-1)}. Generic S_5 orbits have 120 points, so
          D_raw / D_S5 = 5! = 120. The producer's own implementation says the
          same: arm (ii) is interpolated on C(5+16,5) = 20349 total-degree-<=16
          monomials, arm (i) on the (16+1)^5 box (implementation.md section 1.3).
          Only the symmetrized system has "total degree 16".
        - >-
          (c) SANITY. Computed n = m = 3 (scratch/k5k7/square_analogue_n3.json):
          raw 384 = 3! * 4^3, S3 64 = 4^3 = 2^{n(n-1)} at both primes -- the
          2^{n(n-1)} law is the SYMMETRIZED degree, the raw system is n! larger.
          Committed supplementary m = 3 cells: raw D = 6 vs symmetrized D = 1 on
          one planted orbit = 3! (RUN-GFPN-cdf887 vs RUN-GFPN-49f7c5), sanity only.
        - >-
          (d) RECOMPUTED FLOOR, the design note's own model (p^{2-2/5} = 2^102.4
          systems; per-system D^2 floor and nominal 5 D^3), log2:
          design note as written = the S_5 object, D = 2^20 -> 142.4 / 164.7;
          raw, D = 5! 2^20 = 2^26.9 -> 156.2 / 185.4;
          S_5 plus a valid 2-torsion quotient, D = 2^20 / 2^4 = 2^16 ->
          134.4 / 152.7 (the Coordinator's hand figure 2^134.4 confirmed);
          frozen prediction's torsion, D = 2^20/1920 = 2^9.09 -> 120.6 / 132.0;
          frozen prediction's S_5 (research note's EcMasFp5 row), D = 2^13.09 ->
          128.6 / 144.0. The frozen band 2^121-2^132 is 13.8 bits (D^2 edge) and
          20.7 bits (5 D^3 edge) below the re-anchored figure. This is arithmetic
          on frozen text under the design note's model, not a security finding.
        - >-
          Cost bookkeeping on top (frozen texts): JV lines 365-370, "The cost of
          the first main step becomes thus n! c(n,q) q^{2-2/n}" -- the n! is the
          inverse decomposition probability that Pornin's "p^{2-2/5} systems"
          (and the frozen band) omit; FHJRV line 854, with the 2-torsion quotient
          at n = 5 "the expected time to get one relation is 2^4 x 5! x" one
          decomposition test; FHJRV lines 336-348, the reduced factor base
          halves the relations needed and divides the decomposition
          probability by m^{n-1} = 16. Charged: S_5 -> 5! 2^102.4 = 2^109.3
          systems, D^2 edge 2^149.3 (5 D^3: 171.6); valid torsion quotient ->
          2^4 5! 2^102.4 / 2 = 2^112.3 systems, D^2 edge 2^144.3 (5 D^3: 162.6).
          The producer's aggregate uses nominal success 1/120 (S5) and 2/120
          (torsion_S5) (pdp_cell.py line 708): the torsion figure is 32x FHJRV's
          1/(2^4 5!) -- on the phi-base there are ~p/4 t-values, not p/2
          x-values, which costs 2^5 in multisets (my derivation; agrees with
          FHJRV line 854).
      consequence_for_the_rerun: >-
        Scored against the frozen constants, a rerun that measured everything
        CORRECTLY would be recorded as failing: pdp_cell.py lines 679-680 divide
        the frozen 2^20 by the measured D, so a correct D_S5 ~ 2^20 gives
        ratio 1 < 2^6 ("ratio_meets_prediction: false") and orbit_nonfreeness
        ~ 120 (lines 451-455, 681); a valid torsion arm with D ~ 2^16 gives
        2^20/2^16 = 2^4 < 2^9, i.e. F1 read against the constant fires, although
        the true raw/torsion ratio would be ~2^26.9/2^16 = 2^10.9. A versioned
        protocol_amendment re-anchoring the prediction (and the scoring code's
        constants) is owed BEFORE any rerun.
      breaking_artifact: >-
        Pornin lines 138-149 and JV lines 280-288 and 353 (quoted above); the
        box-versus-simplex degree derivation (mixed volume 5! 16^5 vs 16^5); the
        computed n = m = 3 check (384 vs 64); the recomputed floor table in (d).
      what_this_does_not_show: >-
        No statement about EcGFp5's or EcMasFp5's security level; the
        corrected figures are the design note's model re-anchored, not
        measurements.

  # ---------------------------------------------------------------------------
  proves_too_much:
    object_A:
      object: >-
        The "0/20 is the expected regime" argument at a small prime where
        decompositions are common: exact m = 4 decomposable fraction f by
        independent enumeration, then the producer's m = 4 RANDOM-target cell
        path (arm S4, target_kind random) on N targets with N f >= 10, counting
        verified decompositions.
      expected_failure_signature: >-
        Observed verified decompositions inside the two-sided 99 percent binomial
        interval of N f; materially fewer would mean the regime argument also
        explains away a completeness defect (a precondition failure for
        EXP-GFPN-659e34, which reuses the driver).
      enumeration: >-
        Own PARI/GP code, no producer code (scratch/objA/enumerate_f.gp, INV-1,
        output objA_enumeration.txt). All three primes 11, 31, 41 are prime and
        = 1 mod 5; c = 2 (smallest non-fifth-power) at each, z^5 - 2 irreducible;
        both curves nonsingular at all three. Fractions (4-sums with repetition,
        x(P_i) in F_p'): p' = 11 C1 f = 0.00279, C2 f = 0.00801; p' = 31 C1
        3.2e-5, C2 5.8e-4; p' = 41 C1 8.3e-5, C2 6.8e-4. Selection rule, fixed
        before the pipeline ran: the configuration with the largest f, so that
        N f >= 10 needs the fewest solver calls -> p' = 11, curve C2.
      configuration:
        p_prime: 11
        c: 2
        field: F_11[z]/(z^5 - 2)
        curve: C2, y^2 = x(x^2 + 2x + 10 z)   # 263 mod 11 = 10
        order_E: 160752   # 2^4 * 3 * 17 * 197; group structure Z/80376 x Z/2 (PARI ellgroup)
        factor_base_size_F: 13   # points with x(P) in F_11, T = (0,0) included
        decomposable_points_S4: 1288   # 644 x-values; 84 of the 1288 points (42 x-values) are 2-sums (S2)
        f_exact_over_E: 0.0080123   # 1288 / 160752 = 161/20094
        target_distribution: >-
          R = [k]G, k uniform on [1, ord G - 1], G = the producer's base_point()
          with the harness-supplied group data n := ord G = 80376, cofactor 1:
          G = (3 + 9z + 9z^2 + 8z^3 + z^4, 9 + 4z + 7z^2 + 7z^3 + z^4); 648
          decomposable points lie in <G>.
        f_exact_over_targets: 0.0080622   # 648 / 80375
        N: 1400
        seed: >-
          the producer's targets() stream random.Random('2026092001:targets:11:ecgfp5_shaped');
          base point random.Random('2026092002:basepoint:11:ecgfp5_shaped').
        N_times_f: 11.29
        binomial_99pct_interval: [4, 21]
        observed_verified: 13   # 13/1400 targets with a verified relation; 60 lifted verified points; certificate re-verify pass rate 1.0
        truth_decomposable_among_drawn: 14   # 12 distinct x-values
      harness_deviations_declared: >-
        (1) The S4 polynomial is not built by the producer's
        build_arm_polynomial, which needs >= 495 distinct e-points from 4-subsets
        of an x-pool of <= 10 values at p' = 11 (impossible); it is interpolated
        by the harness from the producer's own point-free evaluator
        gfpn5_core.S_poly_res over all 1001 multisets of F_11 (rref over F_11:
        rank 495, all 506 surplus rows consistent) and checked to vanish at all
        1288 witness decompositions of the independent truth set. (2) Group data:
        subgroup_prime := ord G = 80376 (not prime), cofactor 1; with the
        producer's largest-prime convention (n = 197) only 2 decomposable points
        lie in the target subgroup (f = 1/98), which would turn N f >= 10 into
        ~10 repeats of one system. (3) fcntl lock around each msolve call.
        Specialisation, descent, msolve call, parametrisation parsing, lifting,
        sign search, certificates and independent verification ran unchanged
        (pdp_cell.cmd_cell). A first attempt (INV-2) was aborted by me after 21
        targets because my truth script called ellog (PARI's name is elllog);
        its logs are kept.
      run: scratch/objA/run_objA_pipeline.py (INV-3); scratch/objA/run_rate/raw-result.json and msolve_logs.tar.gz; scratch/objA/objA_summary.json (rate_test, completeness_test); scratch/objA/run_complete/.
      outcome: >-
        INSIDE THE INTERVAL: 13 verified decompositions against N f = 11.29,
        99 percent interval [4, 21]; no false positive; all 1400 msolve calls
        completed (no crash, timeout or memory event at p' = 11). The
        target-by-target comparison with the exact truth set locates one miss
        of 14: target 140 (k = 7028, x_R = 1 + 4z) is a 2-sum R = P_1 + P_2 of
        factor-base points, so R = P_1 + P_2 + P_3 - P_3 for every P_3 and the
        m = 4 system contains the curve x_3 = x_4: msolve printed "Positive
        dimensional Grobner basis ... The ideal has positive dimension" and
        wrote [1, 4, -1, []]; parse_msolve_param returned its error dict and
        cmd_cell kept sols = [] under `if par and "error" not in par`, recording
        the target as MEASURED with D null, zero solutions and no diagnostic.
        All 13 other decomposable draws (D = 1, 3, 6 or 7) were found and
        certified.
      verdict_on_the_argument: >-
        Did not prove too much at the specified signature: the random-target
        path finds decompositions at the rate exact enumeration predicts, so
        "0/20 at p' >= 4111 is the expected regime" is not explaining away a
        gross completeness defect, and this is not a precondition failure for
        EXP-GFPN-659e34 at the level the plan specifies. It does silently drop
        every decomposition whose system is positive-dimensional (2-sums of the
        factor base, a fraction |S2|/|S4| ~ 12/p'^2 of decomposable targets:
        84/1288 = 6.5 percent at p' = 11, ~1e-5 at p' ~ 2^10), and records them
        as measured non-decompositions; that reporting defect should be fixed
        (flag and count positive-dimensional outcomes) before the driver is
        reused.
      supplementary_completeness_test: >-
        Beyond the plan, the same unchanged cell path was run on ONE target per
        decomposable x-value in <G> (324 targets, known scalars by PARI elllog,
        each re-multiplied; run_complete/raw-result.json, objA_summary.json
        completeness_test): 295 of 324 recovered (91.0 percent), zero false
        positives, 1440 lifted verified points, all certificates re-verified.
        The 29 misses are all located. (i) 22 = EVERY 2-sum target in the set
        (22 of 22 in S2): positive-dimensional, dropped silently as above.
        (ii) 7 non-S2 targets with D = 4 or 6 (7 of 302 = 2.3 percent; 164 of
        171 non-S2 targets with D > 1 were recovered): in all 7 msolve logged
        "Mininimal polynomial is not square-free / Degree of the square-free
        part: 1" and returned a single rational point that is NOT the
        decomposition (lifting then rejects it: "x-polynomial does not split over
        F_p" 6x, "x does not lift" 1x). For 6 of the 7 the random linear form
        takes the same value at the returned point and at the decomposition's
        e-point (e.g. target 38: returned e = (6, 8, 9, 5), decomposition
        e = (2, 2, 6, 0), both give 7 mod 11) -- a non-separating form, which a
        random form over F_11 hits with probability ~1/11 per pair; for target
        119 the form separates the two points and the degenerate output is
        presumably msolve's randomised minimal-polynomial step failing at
        characteristic 11 (not established). The producer's path neither reads
        msolve's degeneracy diagnostics nor substitutes a parsed solution back
        into the system, so both mechanisms become silent "no decomposition"
        rows.
      transfer_to_EXP_GFPN_659e34: >-
        Extrapolation, untested: the positive-dimensional loss scales like
        |S2|/|S4| ~ 12/p'^2 and the parametrisation loss needs a system with at
        least two distinct points or a non-reduced point plus a collision of
        probability ~D/p', so both should be negligible at the rate-ladder
        primes 2^10-2^12, where decomposable m = 4 systems are almost always a
        single reduced point (JV lines 443-446). Not a precondition failure at
        the plan's signature; a recommended control for that run: one
        exact-enumeration completeness check at its smallest rate prime, and the
        two silent paths turned into flagged outcomes.
    object_B:
      object: >-
        Arm (iii) (torsion_S3, m = 3, constructed-solvable) built exactly as on
        the EcGFp5-shaped curve, on the random_no2torsion ladder curve at
        p' = 4111 (ladder.json: y^2 = x^3 + a x + b, a6 = [2850, 15, 3930, 376, 117],
        has_rational_2torsion false).
      expected_failure_signature: >-
        Must refuse, or produce only decompositions the S3 arm also finds with no
        orbit gain; proves too much if it reports the same degree, cost and
        "(Z/2)^m x S_m" semantics as on the EcGFp5-shaped curve.
      run: scratch/k6/k6_and_objB.py part B (INV-6); output scratch/k6/k6_objB_summary.json object_B.
      outcome: >-
        REFUSES at three layers, producer code unchanged: pdp_cell.cmd_cell
        raises AssertionError at pdp_cell.py line 324 (`assert
        cv["has_rational_2torsion"] and E.a6 == 0`) before any polynomial or
        target is touched; symmetrize.build_pool_t raises AssertionError
        (`assert E.a6 == 0`); pdp_cell.cmd_build silently skips the torsion arm
        for a shape without rational 2-torsion and then crashes with ValueError
        on max() of an empty list (pdp_cell.py line 312) instead of recording
        the refusal (minor producer defect, out of scope). The independent
        verifier would also reject a torsion certificate on such a curve
        ("torsion arm on curve without (0,0)", verify_independent.py).
      verdict_on_the_argument: >-
        Did not prove too much at this object: the construction does not run
        without T. The location where it DOES prove too much is K5's, not this
        one: on curves where T exists, arm (iii) carries the "(Z/2)^m x S_m"
        label and group order 2^{m-1} m! in every table (pdp_common.py line 221,
        pdp_cell.py line 661) while delivering the S_m degree (64 = 64 at
        n = m = 3). Its dependence on T is syntactic (a6 == 0), not a degree gain.
        This object as specified could not have exposed that.
    object_C:
      object: >-
        The supplementary flatness reading of RUN-GFPN-ca7b88 heur-dflat.yaml
        supplementary_flatness_not_the_frozen_heuristic ("D identical across the
        ladder, therefore flat") applied to the planted-orbit size.
      expected_failure_signature: >-
        If the statistic returns "flat" for a quantity constant by construction
        it cannot discriminate; report whether every supplementary D equals the
        planted-orbit size in every cell.
      run: >-
        Reading of committed artifacts (per-target D and n_rational_solutions in
        each constructed-solvable run's raw-result.json); no computation.
      outcome: >-
        EVERY supplementary D equals the planted-orbit size in EVERY cell and
        target. 18 constructed-solvable runs; 15 measured, 20 targets each: raw
        m = 3 (RUN-GFPN-cdf887, -d3f21e, -d4415d) D = 6 = 3! on all 60 targets;
        S3 (-49f7c5, -64df61, -ae92c4), torsion_S3 (-5f9840, -7580cd, -afc06e),
        S4 (-fa08ca, -9424ba, -7b9ab6), torsion_S4 (-ce58c1, -7795bd, -4892c7)
        D = 1 on all 240 targets; n_rational_solutions = D throughout. The three
        raw m = 4 runs (-b1f5d2, -c7a3e9, -d8e114) measured nothing. So
        D_identical_across_ladder: true and D_relative_variation 0.0 are fixed by
        construction (one planted orbit in an overdetermined m < n system), and
        the accompanying fp_ops_relative_variation is flat because the F4 shapes
        are identical (K6 (b)).
      verdict_on_the_argument: >-
        PROVES TOO MUCH: the statistic returns "flat" on a quantity that is
        constant by construction, so the supplementary flatness block can
        discriminate nothing and must not be read as evidence about the
        p-independence of any degree. It is fenced in the producer's text
        ("decide nothing about the frozen heuristic"); the finding is that it
        also carries no information of its own.

  # ---------------------------------------------------------------------------
  attacked_not_broken:
    - >-
      K6: the shape-based F4 estimate itself. On the one non-trivial cross-arm
      pair the F4-only proxy ratio (148.7) is within 2x of the executed-
      instruction ratio inside core_f4 (81.3); proxies recompute exactly from
      the committed logs in 9/9 cells; S4 and torsion_S4 m = 4 CPU agree with
      the proxy's ~1.0 ratio (203.1 vs 203.3 s at 4111). As a within-shape or
      like-for-like RELATIVE indicator of F4 work it survives my tests.
    - >-
      K6 (b): the p-independence of msolve's F4 matrix shapes on these m <= 4
      systems is real (identical per-round shapes at three primes).
    - >-
      K7: the design note's own arithmetic (2^102.4 systems x D^2 = 2^40 ->
      2^142.4) and the plan's quotations reproduce exactly from the frozen text.
    - >-
      K5: the relation path of arm (iii) (lifting through x^2 - t x + b and
      the R + T fix-up) is not attacked as incorrect; its certificates re-verify
      (producer's 600, and object B shows it refuses without T).
    - >-
      Object A: the m = 4 random-target decision / lifting / certificate path.
      At p' = 11 it found 13 of 14 decomposable draws (inside the 99 percent
      interval of the exact rate) and 295 of 324 in the exhaustive
      completeness test, with zero false positives and 100 percent certificate
      re-verification; every miss is located (positive dimension, or a
      degenerate msolve parametrisation at characteristic 11).

  objections:
    - id: O-1
      joint: K5
      text: >-
        Arm (iii) as built is not a (Z/2)^{m-1} x| S_m construction in the
        solver's input: it is the norm of the G2-invariant polynomial to the
        (Z/2)^m x| S_m-invariant field, whose descended system has arm (ii)'s
        support and degree. D-6's "quotients by the same group" and the tables'
        group order 2^{m-1} m! for it are wrong descriptions.
    - id: O-2
      joint: K5
      text: >-
        FHJRV's Prop. 8(i) / Prop. 13 polynomial-ring form presupposes b a square
        (or full 2-torsion); EcGFp5 is double-odd, so neither holds. H-GFPN-9a29be's
        "EcGFp5's rational 2-torsion enables the (Z/2)^4 x| S_5 symmetrization of
        FGHR/FHJRV" needs the non-affine rescaled construction, which is not in
        the cited text and has to be built and validated (n = m = 3 check here).
    - id: O-3
      joint: K7
      text: >-
        The frozen prediction and H-GFPN-9a29be / RQ-GFPN-c01af8 anchor the
        design note's 2^20 and 2^142 to the raw system; they describe the S_5
        system. Every predicted degree is 120x too small and the band 2^121-2^132
        is 13.8-20.7 bits too low under the note's own model.
    - id: O-4
      joint: K7
      text: >-
        Total cost = per-attempt cost x inverse success probability: the frozen
        band omits the 1/success factor (5! for S_5; 2^4 5! for the torsion
        quotient per FHJRV line 854), and the scoring code's nominal torsion
        success 2/120 is 32x FHJRV's.
    - id: O-5
      joint: K6
      text: >-
        fp_operations_per_pdp mixes a modeled F4 estimate with counted F_q
        operations priced by an unsourced inversion constant, charges
        construction for the symmetrised arms but not for the raw arm, and has
        no bound direction; it cannot score F3's 2^36 and its cross-arm ratios
        are accounting artifacts.

  required_controls:
    - >-
      A square (n = m) small-field analogue of EVERY arm run before m = 5, with
      the arm's ideal degree compared to the orbit-count prediction
      (raw n! K^n, S_n K^n, torsion K^n / 2^{n-1}); arm (iii) as built kept as a
      negative control expected to equal S_n.
    - >-
      The identity/degenerate control for the new arm (iii): its (sigma, w)
      system must reproduce the rescaled raw u-system's solutions orbit by orbit.
    - >-
      For object-A-type rate checks at small p': draw targets over a group
      large enough that the expected success count matches the rate model
      (see object A), and cross-check each target against an exact enumeration.
    - >-
      For any F_p-operation figure used against a threshold: an instrumented
      count or a per-shape calibration against executed instructions, reported
      with the nnz and reduction proxies as a bracket, and construction charged
      identically in every arm.

  counterexample_or_mutation: >-
    The cheapest discriminating mutation is the one run here: build the square
    n = m = 3 analogue of arm (ii), arm (iii) as built, and an F_p-rational
    (Z/2)^{m-1} x| S_m quotient, and compare ideal degrees (64, 64, 16). It
    distinguishes "the construction realises the quotient" from "the construction
    relabels the S_m system" in two seconds of CPU.

  baseline_comparison: >-
    Nothing in EXP-GFPN-05ff43 claims to beat any baseline and none of my
    findings does either. Rulers, from committed records (not recomputed by me):
    Pollard rho 0.886 sqrt(n) ~ 2^159.3 group operations on EcGFp5
    (H-GFPN-3366ea assumptions, internal); BSGS ~2^159.5 time and memory; the
    closest specialised baseline is the design note's Gaudry/Diem figure
    (2^142.4 at the D^2 floor, which by K7 is the S_5 system) and the JV
    variant O(C p^2) (Pornin lines 147-149). Re-anchored under the note's own
    model the torsion quotient sits at 2^134.4 (D^2) to 2^152.7 (5 D^3), and at
    2^144.3 / 2^162.6 with the inverse success probability charged; none of
    these is a measured figure and none decides a security level (RC-7).
    dominated_by / sota_delta are not applicable to a measurement contract with
    no measured headline.

  heuristic_challenges:
    - >-
      HEUR-GFPN-DFLAT's random-model justification ("generic complete
      intersection of those degrees") must be restated per arm with the right
      degrees: the generic degree is n! K^n for raw, K^n for S_n, K^n / 2^{n-1}
      for a genuine torsion quotient, and K^n for arm (iii) as built.
    - >-
      The supplementary "flatness" (object C) and the proxy flatness (K6 b)
      are not evidence for HEUR-GFPN-DFLAT at any m: the first is fixed by
      construction, the second restates F4-shape identity.

  cost_model_challenges:
    - K7 (d) floor table and inverse-success bookkeeping (O-3, O-4).
    - >-
      K6 (d): F3's 2^36 threshold cannot be scored with either committed proxy;
      the conversion constant 150 F_q mul per inversion is ~58x the frozen
      source's Itoh-Tsujii cost.
    - >-
      Linear algebra (~p^{2-2/5} sparse rows) and memory are not charged in the
      frozen band (the producer's own optimistic_assumptions_restated says so);
      a time-memory statement is owed before any band is compared to 128.

  reduction_and_scope_challenges:
    - >-
      Scope: the FHJRV mechanism applies to EcGFp5 only through the non-affine
      rescaled construction (odd extension degree needed: at even degree, e.g.
      n = 4, no F_p rescaling exists when b is a non-square); any claim for
      "curves with rational 2-torsion" must carry that condition.

  proof_architecture_challenges:
    - >-
      Nearby-object attack (object B generalised): run each symmetrised arm on
      the nearest object where its gain is known to be zero or known exactly --
      a curve without T (refuses: fine) AND the square analogue where the
      orbit count is exact (arm iii as built fails there).
    - >-
      Observation-fiber attack: D at m < n on constructed-solvable targets is
      the same (1) for every symmetrised arm whatever the group; it is not a
      separator between arms (object C).

  rerun_proposal_to_coordinator:
    status: proposal only; the Coordinator decides (no record changed here)
    before_any_rerun:
      - >-
        A versioned protocol_amendment under experiments/EXP-GFPN-05ff43/amendments/,
        made before the rerun, re-anchoring the prediction to the design note's
        actual object: D_S5 ~ 2^20 (= the design note's D), D_raw ~ 5! 2^20 ~
        2^26.9 (mixed volume), D_torsion ~ 2^16 = 2^{(m-1)^2} for a genuine
        (Z/2)^4 x| S_5 quotient; degree-drop thresholds stated against the
        MEASURED reference arm (e.g. D_S5 / D_torsion >= 2^4 at free orbits,
        with the non-freeness gap reported), not against the constant 2^20; F1
        restated accordingly; the band recomputed with the inverse success
        probability charged (1/5! for S_5, 1/(2^4 5!) for the torsion quotient,
        FHJRV line 854) and the factor-base halving (FHJRV lines 338-348).
      - >-
        The scoring code re-reviewed with the amendment: pdp_common.py lines
        219-221 and pdp_cell.py lines 451-455, 661, 679-681, 708 hard-code the
        mis-anchored constants and the 2/120 nominal success.
    arm_iii_must_build: >-
      The F_p-rational (Z/2)^{m-1} x| S_m quotient, not the norm: pick beta in
      F_p* a non-square (b is then lam^2 beta with lam in F_{p^5}, because
      [F_{p^5}:F_p] is odd); factor base {P : x(P)/lam in F_p} (T-stable, u ->
      beta/u); unknowns sigma_1..sigma_m of t'_i = u_i + beta/u_i and
      w = prod (u_i - beta/u_i); equations: the n = 5 z-components of
      A(sigma) + w B(sigma) = 0 plus w^2 = prod (t'_i^2 - 4 beta) over F_p;
      lifting: t'_i -> u_i in F_p (reject otherwise) -> points, signs, w-sign
      consistency; certificate condition x(P)/lam in F_p. At m = 5 (K = 16) A has
      sigma-degree <= 8 (<= C(13,5) = 1287 monomials) and B <= 7 (<= 792),
      against 20349 for arms (ii) and (iii)-as-built, so it is also the cheaper
      system to attempt under the 12 GB cap. Validate first on the square
      analogues already computed here (n = m = 3: 16; n = m = 4 with b a square:
      512) and with the identity control.
    arm_iii_as_built: >-
      Keep only as a labelled negative control (expected D = D_S_m at n = m);
      never report its group as 2^{m-1} m!.
    cost_unit: >-
      Either an instrumented F_p-operation count (counter-instrumented F4, or
      executed-instruction counts inside the F4 core with a per-shape
      calibration), or declare F3 undecidable; report the nnz and reduction
      proxies as a bracket that is not a bound; charge construction identically
      in every arm (raw included); replace the 150-mult inversion constant by the
      frozen Itoh-Tsujii cost or a measured one.
    prediction_to_score_against: >-
      The re-anchored numbers above; under the design note's own conventions the
      torsion arm's band would be 2^134.4 (D^2) to 2^152.7 (5 D^3), and 2^144.3 to
      2^162.6 with the inverse success probability charged -- arithmetic, not a
      measurement, and not a security finding.

  records_carrying_k7_premise:
    note: listed, not changed (RC-2); the Coordinator acts.
    records:
      - path: ledger/hypotheses/H-GFPN-9a29be.yaml
        where: >-
          statement lines 26-36 ("computed for the RAW descended n=5, m=5
          system (ideal degree D ~ 2^20 ...)", "~2^9", band "~2^121 (D^2) to
          ~2^132"); citations claim lines 66-68 ("floor >= 2^142 for the raw
          system at k=5"); constructive_transforms predicted_gain lines 128 and
          131 (~2^10.9, ~2^6.9 relative to that raw D); asymptotic_claim
          prior_best line 184 ("raw-system floor"); predictions lines 195-200;
          falsification_conditions line 224. Also mechanism lines 46-48 (arm iii
          "giving (Z/2)^4 x| S_5") -- the K5 premise.
      - path: ledger/questions/RQ-GFPN-c01af8.yaml
        where: >-
          motivation lines 64-75 ("That D is the degree of the RAW descended
          system", "~2^9, not 2^20", bands 2^121-2^132 for EcGFp5 and
          2^129-2^144 for EcMasFp5).
