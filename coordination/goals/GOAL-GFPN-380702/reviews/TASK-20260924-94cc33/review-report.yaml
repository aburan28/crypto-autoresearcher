    Attribution of every file under child/, solver/, health/, comparator/,
    pari/ to launch records under three encodings: RG4 = childend RG-4 (b) as
    worded (childend 423-437); RH1 = gapattr RH-1 (i)-(vi) as worded (gapattr
    246-280) with the same non-launch list; RH1w = RH1 with (v) weakened as
    CRG-4 (e) words it. A file with no attribution and not on the non-launch
    list is a RECORDER GAP.
  layer_2_package_level: >-
    Verdict functions: RK = readbackclose RK-1 and RK-3 as worded (RL-3 gaps
    gate nothing); RF = failclosed as worded (RF-0 (b), RF-1, RF-2, RF-3 (a);
    an RL-3 gap is a file whose writing launch has no launch record); RG =
    childend (RF with RG-1 (c)/(d), RG-2, RG-4 (b)); RH = gapattr (RG with
    RH-1, RH-2 (a)/(b), RH-4); RHw = RH with RH-1 (v) weakened. The frozen
    checker items v2_check_run.py 66-67 (collected list non-empty) and 68-70
    (every collected entry equals the requested cap) are evaluated. Two
    manifest variants of the requested cap: Mr (the r3 base, r3_run_wrapper.py
    550, the raw envelope's cap_bytes, None when the wrapper wrote
    raw-result.json) and Mc (a wrapper that records the requested cap
    independently). k = the number of other class-B launches in the package.
