      - step: 8
        where: "failclosed 608-614"
        event: >-
          The pair the parent read for attempt 2's child (line 227 executed)
          is in no launch record: definition (i). That child executed argv and
          has no pair in a launch record: (ii) on the launch-record reading.
          PASS while (i) holds: FAIL-OPEN.
    variants:
      - "LR-2: attempt 1's record absent; the renamed attempt-1 files are attributed by (vi) to L2 (the wrong attempt); PASS."
      - "LR-3: three attempts, attempt 2's record absent; the renamed attempt-2 files are attributed by (vi) k=2 to attempt 3's record; PASS."
      - "LR-5: HR-3 re-solve at S-2 (a1_health.py 140-147 through r3_resolve.py 397-409, health/), final record absent; PASS."
      - "Every single removal among 2, 3 and 6 attempts (11 cases): no gap, PASS. Two removals of three (LR-4): gap, FAIL."
    contrast_under_childend: "RG-4 (b) leaves the renamed files unattributed: FAIL in LR-1, LR-2, LR-3, LR-5 (and a planned-basis refusal on the designed path, PB-3)."
    evaluator_objects: [LR-1, LR-2, LR-3, LR-5, RH6_19_single_removal]
    cheapest_mutation: >-
      For every tag with an SE-3 or HR-3 event, require the number of launch
      records whose stdout_path is <dir>/<tag>.ms.log to EQUAL the event's
      number of attempts (len(event["attempts"]), r3_resolve.py 270, 277), a
