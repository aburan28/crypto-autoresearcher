    any RB-2 source); (iv) read LITERALLY as "a record written in a process
    other than the installing one that no rule detects". PLANNED-BASIS REFUSAL
    iff a driver-logic outcome (RF-0 (b) as the rule set re-reads it) that a
    dependant's frozen logic acts on or that RFR-2 enumerates, designed (no
    constructed record loss), receives FAIL.
