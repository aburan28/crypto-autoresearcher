counterexamples:
  - id: CX-1
    joint: AJ-1
    classification: FAIL-OPEN
    definitions_met: "(i); (ii) under the launch-record reading of 'recorded pair' (not under the any-RB-2-source reading)"
    class: lost launch record at a re-solved tag (NOT the foreign-process class, definition (iv))
    reachability: >-
      Not through ordinary operation, and not through documented interpreter
      or operating-system behaviour, as far as this review found: it needs a
      launch record to be absent without RL-1 (d) firing (readbackfull
      244-249: a recording failure is an SE-2 (4) consistency violation), or
      solver-events.json altered after the launch (RGL-7, gapattr 470-476:
      visible after the fact, not prevented). It is the lost-record premise
      that CRG-4 (e), the card's AJ-1 worked attack (1), RH-1's own WHY
      sentence (gapattr 284-287) and RH-6 (i) (19), (22) (394-407) use to
      state the property RH-1 is meant to have.
    sequence:
      - step: 1
        where: "r3_resolve.py 373-390; readbackfull 212-243 (RL-1 (a)-(c)); childend 420-422 (RG-4 (a))"
        event: >-
          A cells m = 5 package runs under the r4 entry with SE-3 installed and
          the RL-1 launch recorder in place of v2_solver.run_child. The driver
          calls the SE-3 solve for tag S5_t1 (not gb_only), which enters
          _bounded (389 -> 248).
      - step: 2
        where: "r3_resolve.py 262-263; v2_driver.py 161-166"
        event: >-
          Attempt 1: the frozen solve writes solver/S5_t1.ms (162) and launches
          msolve with argv -f solver/S5_t1.ms -o solver/S5_t1.ms.out (165),
          stdout solver/S5_t1.ms.log, stderr solver/S5_t1.ms.err (166). The
          recorder appends launch record L1 (child_created true, pair read and
          equal to the cap: class B, failclosed 381-383).
      - step: 3
        where: "r3_resolve.py 267-279, 297-310; r3_common.py 88-90; r3_resolve.py 224-238"
        event: >-
          The attempt carries the SSF signature: the event is created
          (277-279); k = 1 < K + 1 = 6; the three files are renamed to
          S5_t1.ms.out.ssf-attempt1, .ms.log.ssf-attempt1, .ms.err.ssf-attempt1
          and listed, by their renamed names, under
          renamed_files["attempt1"] (235, 310).
      - step: 4
        where: "r3_resolve.py 258-263, 295-296, 313; v2_driver.py 161-166"
        event: >-
          Attempt 2 (after spacing, 260-261) rewrites solver/S5_t1.ms and
          launches msolve with the SAME argv, stdout_path and stderr_path; the
          recorder appends L2 (class B). No SSF signature: the loop ends;
          accepted_attempt 2.
      - step: 5
        where: "readbackfull 223-227, 244-249; gapattr 470-476"
        event: >-
          THE PREMISE: L2 is absent from launch_records, L1 present, and no
          consistency violation is recorded.
      - step: 6
        where: "gapattr 250-251, 264-274"
        event: >-
          RH-1 attributes solver/S5_t1.ms.log and .ms.err (written by attempt
          2) to L1 by (i) (L1's stdout_path and stderr_path are the same
          strings); solver/S5_t1.ms.out and solver/S5_t1.ms to L1 by (ii); the
          three .ssf-attempt1 files to L1 by (vi) (event entry present; at
          least one record with stdout_path solver/S5_t1.ms.log; L1 is the
          first). No recorder gap.
      - step: 7
        where: "failclosed 376-395 (RF-3 (a)); v2_check_run.py 66-70"
        event: >-
          RF-3 (a) examines every launch record present: all class B; no gap,
          no recorder-foreign file, no undetermined value; raw_result_writer
          driver. The frozen items pass (attempt 2's pair is collected from its
