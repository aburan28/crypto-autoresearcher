    - id: DV-1
      text: >-
        The reviewer's working context was compacted once during the review.
        The earlier transcript lies under a path the dispatching session
        forbids reading and was not consulted. paths_read and commands before
        the compaction are compiled from the retained working summary; the
        exact argv of individual read-only shell reads (cat, sed, awk, grep,
        wc, ls, sha256sum) before the compaction were not retained and are
        listed by form. Every command after the compaction is listed exactly.
        No verdict rests on an unretained read: every cited line was re-read
        after the compaction or is in a scratch output reproduced verbatim.
    - id: DV-2
      text: >-
        Four evaluator versions exist (v1 never run; v2 run once, TypeError;
        v3 run once, superseded; final). Each superseded version and output was
        kept under a version-suffixed name; no output was overwritten, as
        retained. The argv of the superseded runs is known only in the form
        listed, and the commands that gave the files their version-suffixed
        names were not retained.
    - id: DV-3
      text: >-
        The CRG-2 (a) receipt value came from the dispatching session's
        message; the receipt was not opened (as instructed).
    - id: DV-4
      text: >-
        Directory listings and the spec / command.txt reads of the four
        packages used O_NOATIME, and listing.py compared every directory's
        lstat before and after: unchanged. A method choice to meet CRG-1.
    - id: DV-5
      text: >-
        One python3 -S invocation before the compaction, while locating the
        third-party source text the interpreter would load; its exact argv and
        output were not retained. No other claim is made about it.
    - id: DV-6
      text: >-
        One directory listing under /root/.local before the compaction (outside
        the three permitted classes of outside reads), made while locating
        installed third-party modules; exact argv and output not retained.
        Nothing under the session-configuration directory the dispatching
        session forbade reading was read.
    - id: DV-7
      text: >-
        specout.py read the full bytes of each of the 44 child/*.spec.json
        files and of the four command.txt files (with O_NOATIME) and retained
        only the spec keys, job, to_cache, out and the GFPN_RUN_DIR line.
    - id: DV-8
      text: >-
        Whether the git status invocation before the compaction set
        GIT_OPTIONAL_LOCKS=0 was not retained; without it, git status may
        refresh the index's stat cache (an optional-lock write to .git/index;
        no tracked content, ref or object changes). Every git child after the
        compaction set GIT_OPTIONAL_LOCKS=0.
    - id: DV-9
      text: >-
        Card inputs not read: DEC-20260924-a789e1, DEC-20260924-650068,
        DEC-20260924-1ce186, DEC-20260924-15a77a (context rulings; line counts
        only), implementation-v2-r3.md, the amendments other than the six named;
        CORR-20260924-217903 and CORR-20260924-80009d read in lines 1-40 only.
        No verdict relies on them.
    - id: DV-10
      text: >-
        The evaluator tags any FAIL of a designed planned package as a
        planned-basis refusal. REL-1 (FC-3) carries that tag; this report
        classifies it fail-closed because production checks run at the
        recorded root.
    - id: DV-11
      text: >-
        The listing tables of both deliverables and the md appendix were
        generated by scratch scripts (tables.py, appendix.py) from the kept
        evaluator outputs and scripts and appended to hand-written bodies.
        After appending, one phrase of the appended tables text in the md was
        corrected ("section 3" to "section 2", where the md's Method section
        states the rule); every table row is unchanged.
    - id: DV-12
      text: >-
        The write-scope directory was created (mkdir -p) to hold the two
        deliverables; nothing else is in it. One in-place edit of the md by
        sed -i (replacing four "section 14" references) wrote sed's transient
        temporary file in the same directory and renamed it over the md; no
        other file remains there.

