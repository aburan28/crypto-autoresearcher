fail_closed_findings:
  - id: FC-1
    joint: AJ-1
    finding: >-
      RH-6 (i) (19) third case and (20): "the same copy with one launch record
      of the tag removed yields a recorder gap and FAIL" (gapattr 397-400)
      cannot be met by RH-1 as worded (CX-1: no gap, PASS). DV-18 therefore
      STOPs at (19) / (20) by construction.
    cost: >-
      The r4 stage stops at DV-18 for a Coordinator decision; no result, no
      package. (It is also the development check that would expose CX-1.)
  - id: FC-2
    joint: AJ-1
    finding: >-
      RH-6 (i) (22) expects ".spec.json, .stdout, .stderr, .npz and
      .meta.json" as gaps (404-407). For a raw_grid child job the .npz is
      removed at v2_driver.py 144 on the normal path, so the expectation
      holds only for an uncached build child job (evaluator RH6_22_raw_grid:
      the four gaps, no .npz).
    cost: a DV-18 STOP if the scratch copy chosen for (22) uses a raw_grid child job.
  - id: FC-3
    joint: AJ-2
    finding: >-
      RH-1 compares recorded absolute paths with listed files. A package
      checked at another absolute root (a copy, another checkout) has every
      launch file unattributed (evaluator REL-1: all eight files gaps, FAIL).
    cost: >-
      A dependant's admission (RL-4) run from a different root would be
      refused; costs a Coordinator decision. Not by design in production,
      where the wrapper checks at the recorded root. The evaluator tagged
      REL-1 with its mechanical planned-basis label; this report classifies it
      fail-closed (deviation DV-10).
  - id: FC-4
    joint: AJ-4
    finding: >-
      Development packages record further values that carry the development
      run directory, which RF-4 (d) (failclosed 472-481), RG-3 (e) (argv) and
      RH-3 (a) (spec "out") do not list as accepted label fields:
      raw["build"]["npz"] (v2_driver.py 129, anchor-identity via 671-673 and
      the controls builds), the _slim argv inside raw child records
      (v2_driver.py 128, 150-154; comparator child 652, 655), a1_pari.py 97
      ("script", "command") and a1_health.py 148-149 ("input.path",
      "command"). No computed value differs.
    cost: >-
      If DV-18 reads any of them as "any other frozen read of the label",
      the stage STOPs for a Coordinator decision; never a result.
  - id: FC-5
    joint: AJ-1 / AJ-6
    finding: >-
      RH-4: a Python-level signal exception (for example KeyboardInterrupt)
      raised while the callback's body runs is caught and marked, so the
      package FAILs (H4-a, H4-b), and the interrupt does not stop the driver;
      one pending at the callback's entry makes child_end undetermined (H4-c).
    cost: >-
      A spurious FAIL and, for a consumed interrupt, the driver's continued
      run time until completion or a further signal; a Coordinator decision.
  - id: FC-6
    joint: AJ-1 (carried)
    finding: >-
      A host without the RGL-1 counter behaviour, or a child killed before
      exec, yields child_end undetermined (childend RGL-1; review 1ecb7d
      FC-B, FC-C).
    cost: a FAIL or a stage STOP (RH-5 (d)); a Coordinator decision.
  - id: FC-7
    joint: AJ-1
    finding: >-
      Lost-record constructions that do not match CX-1 FAIL: two of three
      attempt records absent (LR-4), the msolve record of a callgrind tag
      (LR-6), the comparator record (LR-7), a build child-job record (LR-8,
      KA-e1), a crashed raw-grid child's record (KA-e2).
    cost: none beyond a FAIL of a package that lost a record.

observations:
  - id: OB-1
    joint: AJ-1
    text: >-
      RH-1 (iv) attributes a file by the directory an argv names (gapattr
      255-256), while RH-1's WHY sentence says "No clause attributes a file by
      its directory alone" (284-285). A file written under comparator/ by a
      process the rules do not know is attributed to the comparator record
      (evaluator IV-1: PASS). The clause is carried unchanged from childend
      RG-4 (b) (423-427); the only known writers there are the comparator and,
      possibly, its grandchildren (RFL-1, NOT A BAR at failclosed 661). No
      supplying code for another writer was found.
  - id: OB-2
    joint: AJ-1
    text: >-
      RH-4's sentence "with one, the frozen parent may continue where it would
      otherwise have raised at v2_solver.py 181" (353-355) assumes an
      exception in an after-fork parent callback would propagate from
      os.fork; by recalled CPython behaviour (B-2) it is reported through the
      unraisable hook and os.fork returns. H4-d (an exception escaping the
      callback's epilogue or another callback) gets no mark and no FAIL, and
      needs none (no definition holds).
  - id: OB-3
    joint: AJ-3
    text: >-
      A P-9 launch is recorded "crashed"; the m = 4 conditional rule's stated
      basis (stopping rule 3: timeout / OOM / crash, as review
      TASK-20260924-1ecb7d quotes it) would act on a crash. The frozen item
      68-70 FAILs the package before any dependant reads it; RH-2 (d)'s
      condition "no launch of the class released a capped workload under a
      recorded cap equal to the requested cap" is met by pure P-8 / P-9
      packages, not by mixtures at the outcome level (a mixture's measured
      launch did run under the cap); RH-2 (a) classes mixtures by the failing
      item, which they meet.
  - id: OB-4
    joint: AJ-3 / AJ-6
    text: >-
      RH-7 gives the RH-2 class no class letter while its last bullet requires
      DV-11 to list it "with exactly one class"; childend RG-8 left RG-2 the
      same way.
  - id: OB-5
    joint: AJ-6
    text: >-
      Without RH-4's catch, an exception escaping the callback would be
      printed by the unraisable hook to the driver's stderr (recalled, B-2);
      with it, nothing is printed. A report-only difference in the driver's
      stderr.log of a package that FAILs anyway.
  - id: OB-6
    joint: AJ-3
    text: >-
      An environment variable GFPN_V2_CAP_BYTES, if set, would change the
      driver's cap without changing the gp cap (pre-existing in the frozen
      code, not reachable in ordinary operation; not part of the difference).

behaviours_relied_on:
  - id: B-1
    behaviour: CPython runs a Python-level signal handler at a bytecode boundary of the running Python code, so its exception can surface inside the RG-1 callback's body, at its entry, or in its epilogue.
    provenance: recalled (CPython evaluation-loop semantics); not verified in this review
    verdict_dependence: the H4-a..H4-d classifications (all FAIL or no definition); AJ-1's break (CX-1) does not depend on it
  - id: B-2
    behaviour: os.fork runs after-fork parent callbacks registered by os.register_at_fork; an exception escaping one is reported through the unraisable hook and does not propagate from os.fork.
    provenance: recalled; not verified
    verdict_dependence: >-
      H4-d classified "no definition" and OB-2, OB-5. If instead it
      propagated, the parent would raise at v2_solver.py 181 with a created
      child: RF-1 undetermined, FAIL (fail-closed). No verdict changes.
  - id: B-3
    behaviour: CPython stdlib modules (threading, random, logging) register at-fork callbacks.
    provenance: recalled; not verified
    verdict_dependence: only that "another callback" in H4-d can exist; no verdict
  - id: B-4
    behaviour: SystemExit(n) with an integer n ends the interpreter with status n after unwinding unless caught; os._exit(n) ends the process at once; an uncaught KeyboardInterrupt ends it by SIGINT.
    provenance: recalled
    verdict_dependence: the X1 construction (hypothetical) and the FO-1 exit statuses 1 and -2; AJ-1's residual statement
  - id: B-5
    behaviour: open(2) with O_NOATIME does not update the access time for the owner or root.
    provenance: used in listing.py and specout.py; every directory's lstat (atime, mtime, ctime) was equal before and after the listing
    verdict_dependence: CRG-1 compliance (no metadata change under runs/); no verdict
  - id: B-6
    behaviour: numpy's np.savez writes its zip archive directly to the named file, with no temporary file beside it.
    provenance: read (numpy 2.4.6, numpy/lib/_npyio_impl.py 756-800, sha256 557dbdca775fdf05ab660f6694c5d25194634426ddb2a22a7e1706828dc83b82)
    verdict_dependence: AJ-2 (no auxiliary child/ file from v2_child's save at v2_child.py 38 and 100)
  - id: B-7
    behaviour: Python's zipfile writes the archive to the file object it is given, directly.
    provenance: recalled
    verdict_dependence: supports B-6 for AJ-2
  - id: B-8
    behaviour: valgrind writes a core file (vgcore.<pid>) in the child's current directory when the client crashes.
    provenance: recalled
    verdict_dependence: >-
      AJ-2's statement that such a file does not land in solver/ (the cwd is
      the repository root, r3_run_wrapper.py 477, inherited: no call site
      passes cwd, v2_solver.py 186-187). A client crash is not a normal path;
      a file in solver/ would be a gap and FAIL (fail-closed), not a refusal
      by design.
  - id: B-9
    behaviour: msolve with -v 2 -t 1 -f IN -o OUT (-P 1 or -g 1) writes only OUT, stdout and stderr.
    provenance: >-
      NOT read or run (CRG-1). Observed consequence only: 683 files of the
      four gate packages' five directories carry no other msolve file (0 gaps
      under RH-1). Tested scale: the gate invocations (fixture p = 4111 and
      16777291, anchor-identity, controls); transfer to the cells and a1
      invocations assumes the same flags write the same set of files.
    verdict_dependence: AJ-2 holds for msolve outputs on that assumption
  - id: B-10
    behaviour: cysignals' sig_on / sig_off turn a signal inside a guarded block into a Python exception.
    provenance: read as text (cysignals 1.12.5 macros.h lines 1-40, sha256 9263a434e966ee6318f7a2bba11f0e77f18c798e9eea721cc8d29424fc9fff30); compiled parts unread
    verdict_dependence: the RGL-6 residual statement only
  - id: B-11
    behaviour: RH-1's clauses compare recorded path strings with the listed file paths (rule text, no operating-system behaviour).
    provenance: gapattr 246-274
    verdict_dependence: FC-3
  - id: B-12
    behaviour: GIT_OPTIONAL_LOCKS=0 stops git status from refreshing the index as a side effect.
    provenance: recalled (git documentation)
    verdict_dependence: CRG-1 compliance of this report's post-compaction git children; no verdict (see DV-8)
  - id: B-13
    behaviour: sys.addaudithook receives the import and process-launch audit events (os.fork, os.exec*, os.posix_spawn, os.system, subprocess.Popen).
    provenance: recalled; exercised by scan.py's self-test (both refused) and its counts (0 import, 0 launch)
    verdict_dependence: the guard evidence for "no import, no launch"; no verdict

