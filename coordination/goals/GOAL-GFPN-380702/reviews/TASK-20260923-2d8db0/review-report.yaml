    J4:
      verdict: holds
      attacked: >-
        Followed attack_plan (a)-(e). The enumeration was written from the frozen texts,
        not from rigidity.gp. Every predecessor received a SELF-CERTIFYING rejection
        witness, verified in both vlib implementations: the PRIMARY on the published model
        (double-odd for EcGFp5), the SECONDARY on the short-Weierstrass model. PARI was
        used only for discovery (ellcard), never for verification. The producer's trace
        was read only as a hint and for cross-checking.
        Witness types:
        W4: a subgroup of order 4, so 4 | #E.
        Wl: a point of prime order l.
        WN: an N in the Hasse interval, P with [h]P != O and [N]P = O, and N/h composite
        (factor or Fermat witness). If #E = h*r with r prime, then r | N, and
        |N - hr| <= 4 sqrt q < r forces N = hr. So WN does not require N = #E.
      found:
        procedure_pinned_a: >-
          Both enumerations are fully pinned by the frozen text. The coordinator's 0.40
          prior of an unpinned choice is not borne out.
          EcGFp5 (paper_fulltext.md lines 857-875): "1. c <- 1 / 2. For i = 1 to 4:
          (a) If curve y^2 = x(x^2 + 2x + cz^i) has order 2n with n prime, then return
          b = cz^i. (b) If curve y^2 = x(x^2 + 2x - cz^i) has order 2n with n prime, then
          return b = -cz^i. / 3. c <- c + 1 / 4. Loop to step 2." The pre-filter text is
          "may be double-odd (i.e. order 2n for an odd integer n) only if neither b nor
          a^2 - 4b is a quadratic residue; this gives a fast test". Line 880 reads "the
          first usable curve is obtained for b = 263z". This fixes the nesting as c, then i,
          then + before -. The producer's rigidity.gp implements exactly that, with the
          filter issquare(b) || issquare(4 - 4b).
          Left open by the text, all immaterial: (1) whether a QR test counts 0 as a
          residue (b != 0 and 4 - 4b != 0 for b outside F_p); (2) proven vs probable
          primality of n (acceptance is proved by J1; rejections carry witnesses); (3) the
          model used for counting (the producer counted the isomorphic short model
          A = b - 4/3, B = 16/27 - 2b/3); (4) the filter's own validity, which is not
          relied on because each filtered candidate carries an explicit 4 | #E witness.
          EcMasFp5 (note_fulltext.md lines 188-222): find_ec_over_gfp5(initial_a = 0,
          initial_c = 1, attempts = 50, pol_degree = K.degree()) with `for i in range(1,
          pol_degree)`, `B = c * z**i`, `EllipticCurve(K, (A, B))`,
          `is_prime(E.order(algorithm="pari"))`, and on exhaustion `c += 1; if c ==
          attempts: c = initial_c; A += 1`. That is A outer from 0, c = 1..49, i = 1..4,
          prime order. The producer matches it. ellsea(E, 1) with isprime is an equivalent
          acceptance test. Line 220 reads "The first elliptic curve found was:
          y^2 = x^3 + 3x + 8z^4".
          My enumeration agrees with the trace parameters at every index, and it reaches
          the published curve at exactly index 2097 (c = 263, i = 1, +) and index 620
          (A = 3, c = 8, i = 4).
        EcGFp5_2096_predecessors: >-
          ALL 2096 CERTIFIED (scratch/inv2/witnesses.jsonl, idx 1..2097 contiguous). The
          producer's classes are confirmed: 1552 pre-filter, 445 early abort, 99 full count.
          Pre-filter (1552): my Euler criterion (own exponentiation, which agreed with
          FLINT is_square at all 2097 candidates) matches the producer's filter flag at
          every index. Each has an explicit witness: 1034 are a second rational 2-torsion
          point (root of x^2 + 2x + b), and 518 are a point P with 2P = (0,0). In both
          cases 4 | #E, so #E != 2*odd.
          Early abort (445): each has a point of odd prime order l, with l distribution
          3:208, 5:60, 7:52, 11:20, 13:28, ..., max 179. 383 were found by FLINT division
          polynomials (l <= 19) and 62 by PARI ellcard discovery. So an odd small prime
          divides #E for each, which is the producer's claimed reason.
          Full count (99): each has a WN witness with the trace's N (even, in the Hasse
          interval, [N]P = O, [2]P != O). N/2 composite: 92 by an exhibited factor (trial
          division 69, Pollard rho 19, GMP-ECM 4 including idx 1322 in invocation 4) and 7
          by a Fermat witness only (idx 415, 526, 887, 934, 1816, 1910, 1946).
          Published #2097: b = 263z and 4 - 4b are non-squares, so the filter passes.
          Acceptance #E = 2n with n prime is the J1 certificate.
        EcMasFp5_619_predecessors: >-
          ALL 619 CERTIFIED (scratch/inv3/witnesses.jsonl, idx 1..620 contiguous). The
          producer's classes are confirmed: 398 early abort, 221 full count.
          Early abort (398): each has a point of small prime order, with l distribution
          2:299, 3:35, 5:19, 7:10, 11:8, 13:13, ..., max 127. 11 were found via PARI ellcard
          discovery.
          Full count (221, of which 196 are j = 0, A = 0, counted by PARI's CM path rather
          than SEA): each has a WN witness with the trace's N. 220 have an exhibited factor;
          1 has a Fermat witness only (idx 330, A = 1, c = 34, i = 2).
          Independent re-count for all 196 j = 0 curves, by a different routine:
          p = r^2 + 3s^2 (r = 2^31 - 1, s = 2^31) by Cornacchia, then
          pi^5 = R + S sqrt(-3), giving the six sextic-twist orders q + 1 - Tr(u pi^5)
          (scratch/inv3/cm_j0_orders.json). For every curve exactly one of the six kills a
          random point, and it equals the trace's N. All six twists occur.
          Published #620: prime order is the J1 certificate.
        first_hit_e: >-
          Every predecessor is rejected with a witness checkable without trusting PARI's
          counting. The published curves' acceptance is certified in J1. So the first
          accepted candidate in the published order is the published curve, for both
          searches.
      supporting_artifacts:
        - scratch/inv2/witnesses.jsonl (EcGFp5, 2097 records, sha256 514cf474...ecacb)
        - scratch/inv3/witnesses.jsonl (EcMasFp5, 620 records, sha256 105d20f8...3027f)
        - scratch/inv3/cm_j0_orders.json
        - scratch/inv4/deeper_ecm.json
        - scratch/sweep.py, scratch/vlib.py
      deviation_from_attack_plan: >-
        (c) asked me to re-count the full-count rejections with a different routine and to
        exhibit a nontrivial factor of #E/h.
        A different SEA-independent counting routine exists here only for the 196 j = 0
        curves (the CM re-count above). For the 124 j != 0 full counts (99 EcGFp5 + 25
        EcMasFp5) no counting routine independent of PARI is available on this host:
        Sage's order() calls PARI, and BSGS is infeasible at 320 bits. The WN witness
        replaces the re-count. It certifies the rejection without requiring N = #E, which
        is strictly what a rejection needs.
        A factor was exhibited for 312 of 320 full counts. For the other 8 (7 EcGFp5,
        1 EcMasFp5) compositeness is proved by a Fermat witness, which is rigorous, but no
        factor was found (ECM to B1 = 250000 x 60 curves).

