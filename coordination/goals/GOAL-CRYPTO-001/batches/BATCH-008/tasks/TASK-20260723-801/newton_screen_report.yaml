claim_boundary:
  exact_claim: >-
    There is a zero-compute proof route for the canonical short-Weierstrass
    Semaev family which classifies every possible loss of a vertex of the
    target-sectioned Newton box. Let D_m=2^(m-2), let
    f_{m,t}=S_m(x_1,...,x_{m-1},t), and let P_0=(0,beta) with beta^2=B on
    E:y^2=x^3+A*x+B over an algebraic closure of a field of characteristic
    other than 2 or 3. Subject to independent verification of the stated
    coefficient normalization, Newt(f_{m,t})=[0,D_m]^(m-1) whenever
    t is not the x-coordinate of [r]P_0 for any 1<=r<=m-1 with [r]P_0 affine.
    The exceptional x-set has size at most m-1. Thus the generic section is
    box-saturated for every m, while every possible proper-box section is
    confined to an explicit O(m)-sized target set.
  algorithmic_consequence: >-
    For the original target-sectioned support, nonexceptional sections have
    mixed volume (m-1)!*D_m^(m-1), exactly the multigraded box Bezout number.
    An exception-only fresh-target bridge based on uniform scalar masking hits
    at most 2(m-1) subgroup points out of prime subgroup order N and therefore
    costs Omega(N/m+m)=Omega(sqrt(N)) before relation rank, factor logs,
    linear algebra, descent failures, and verification. It receives no
    sub-rho credit. A different target-to-exception bridge would be a new
    typed mechanism and is not supplied here.
  theorem_status: derivation_candidate_not_yet_independently_proved
  cryptographic_advantage_claimed: none
  scope: >-
    Canonical recursively defined S_m on nonsingular short-Weierstrass curves,
    characteristic not 2 or 3, original sectioned formulation, exact
    coefficient support, and prime-order-subgroup cost comparison.

idea:
  id: IDEA-20260723-006
  title: Corner-coefficient induction and exceptional-target saturation theorem
  class: control
  claim: >-
    For every m>=3, the target-sectioned Semaev Newton polytope is the full
    box [0,2^(m-2)]^(m-1) outside the explicit target set
    {x([r]P_0):1<=r<=m-1}; inside that set at least one box-corner coefficient
    vanishes. Consequently, the original support-aware route either has the
    full-box mixed-volume driver or must pay for an exception-only target
    bridge, whose uniform-mask work plus m-entry output is
    Omega(N/m+m)=Omega(sqrt(N)).
  mechanism: >-
    Semaev's known leading-coefficient identity
    LC_{x_i}(S_m)=S_{m-1}^2 turns every corner having at least one maximal
    coordinate into the square of a lower-order corner. The only remaining
    all-zero corner is S_m(0,...,0,t); the defining summation property says
    its roots are exactly x-coordinates of signed sums of m-1 copies of
    P_0=(0,beta), hence x([r]P_0) for the allowed parities. Symmetry collapses
    2^(m-1) corners to m Hamming-weight classes. All box vertices are present
    off the union of those roots, forcing the full Newton box.
  novelty_status: adaptation
  assumptions:
    - Canonical Semaev recurrence and a fixed nonzero normalization are used.
    - The established symmetry, per-variable degree, leading-coefficient, and summation-zero properties of S_m hold in characteristic not 2 or 3.
    - Exact support, not numerical coefficient thresholding, defines the Newton polytope.
    - A fresh masked target Q+[u]P is uniform in the prime-order subgroup when u is uniform.
    - Any accepted decomposition emits or replayably commits to m factor entries and signs; this output is not free.
    - A target-to-exception map must disclose its scalar relation to the original target; target-fitted advice is forbidden.
  predictions:
    - metric: nonzero_corner_Hamming_classes_outside_exception_set
      direction: higher
      minimum_effect: "exactly m classes, representing all 2^(m-1) box vertices"
    - metric: exceptional_target_x_cardinality
      direction: lower
      minimum_effect: "at most m-1 over the algebraic closure, and no larger after restriction to F_p or the subgroup"
    - metric: MV_over_multigraded_box_Bezout_for_nonexceptional_sections
      direction: higher
      minimum_effect: "exactly 1"
    - metric: exception_only_uniform_mask_complete_work_exponent
      direction: higher
      minimum_effect: "at least 1/2 in N after mask trials and m-entry output"
  minimal_test:
    design: >-
      Perform a paper-only replay of the corner lemma. Define c_{m,k}(t) as
      the coefficient of a box corner with k maximal exponents. Verify the
      explicit m=3 values, derive c_{m,k}=c_{m-1,k-1}^2 for k>=1 from the
      leading-coefficient identity, and prove the root set of
      c_{m,0}=S_m(0,...,0,t) from the summation-zero semantics. Then check the
      two cost outcomes: a nonexceptional target gives the full box; an
      exception-only uniform-mask target pays N/(2m)+m operations up to
      constants. No polynomial expansion, finite-field search, or curve run
      is needed.
    controls:
      - Explicit S_3 corner coefficients c_3,0=A^2-4*B*t, c_3,1=t^2, c_3,2=1.
      - Symmetry control: corners with equal Hamming weight have equal coefficients.
      - Negative exception control: t=0=x(P_0) removes the next-to-top corner class.
      - Generic control: a symbolic t outside the finite multiple set leaves every corner nonzero.
      - Normalization control: every recursive resultant scalar is proved nonzero in the working field.
      - Cost control: direct exceptional-target advice is rejected unless its scalar provenance and fresh-target replay are supplied.
    required_metrics:
      - exact_corner_recurrence_verified
      - all_zero_corner_root_set_verified
      - exception_set_cardinality_bound
      - full_box_implication_verified
      - nonexceptional_mixed_volume_formula
      - fresh_target_hit_probability_bound
      - complete_work_exponent_vs_rho
  falsification_conditions:
    - >-
      A verified characteristic-at-least-5 instance has t outside the stated
      multiple set but a missing box-corner coefficient.
    - >-
      Exact coefficient extraction from Semaev's leading term produces an
      extra vanishing factor, cancellation, or normalization failure not
      represented in the stated exception set.
    - >-
      S_m(0,...,0,t) has a root not arising from a signed sum of m-1 points
      above x=0, or an allowed affine signed sum fails to give a root.
    - >-
      A fully typed target-uniform bridge reaches exception sections and
      returns replayable m-source decompositions in o(sqrt(N)) total work,
      including setup, misses, output, rank, factor logs, blind descent,
      traffic, memory, and verification.
  confounders:
    - Overall resultant normalizations and degree drops must be handled over the field, not inferred from an integer lift.
    - B=0 makes P_0 a 2-torsion point; the finite-multiple statement still has a degenerate form but requires a separate one-line check.
    - Small-characteristic torsion can merge exceptional x-values; it cannot increase their number, but multiplicities need not follow the characteristic-zero pattern.
    - Missing interior monomials do not change the hull; only corner coefficients classify full-box saturation.
    - A coefficient-dependent lifted formulation can have a different mixed volume even when the original formulation is box-saturated.
    - Membership polynomials, relation probability, rank, and descent are not determined by the Newton polytope of f_{m,t} alone.
    - The unsectioned S_m polytope is outside the exact claim and is known internally to be non-box-saturated at m=3,4,5.
  interpretation_limits:
    - The route closes only support advantage from the original target-sectioned Newton hull.
    - It is not a lower bound against all algebraic circuits, coefficient-dependent liftings, Gröbner formulations, or non-Semaev ECDLP algorithms.
    - The Omega(sqrt(N)) statement applies to an exception-only route with a uniform scalar-mask bridge and replayable m-entry output.
    - A different nonuniform bridge is not declared impossible; it must be proposed and typed separately.
    - Existing m=3,4,5 observations remain toy-scoped evidence and are not used as proof for larger m.
    - No standardized curve, cryptographic-size instance, key, scalar, relation campaign, or solve is included.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

