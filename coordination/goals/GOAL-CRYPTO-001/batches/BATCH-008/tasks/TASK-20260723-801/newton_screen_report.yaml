derivation:
  definitions:
    curve: "E: y^2=x^3+A*x+B"
    section: "f_{m,t}(x_1,...,x_{m-1})=S_m(x_1,...,x_{m-1},t)"
    degree: "D_m=2^(m-2)"
    corner_class: >-
      c_{m,k}(t) is the coefficient with k of the m-1 free-variable
      exponents equal to D_m and all remaining exponents equal to zero.
  base_case:
    c_3_0: "A^2-4*B*t"
    c_3_1: "t^2"
    c_3_2: "1"
  inductive_corner_identity:
    statement: "c_{m,k}(t)=c_{m-1,k-1}(t)^2 for m>=4 and 1<=k<=m-1"
    reason: >-
      By symmetry choose a maximal-exponent variable as the last variable.
      Semaev's leading coefficient in that variable is S_{m-1}^2. In each
      remaining variable, degree is at most D_m/2; obtaining exponent D_m in
      the square uniquely selects D_m/2 from both factors, while obtaining
      exponent zero uniquely selects zero from both.
  closed_corner_classes:
    for_0_le_k_le_m_minus_3: "c_{m,k}=c_{m-k,0}^{2^k}"
    next_to_top: "c_{m,m-2}=t^D_m"
    top: "c_{m,m-1}=1"
  all_zero_corner:
    identity: "c_{m,0}(t)=S_m(0,...,0,t)"
    root_semantics: >-
      Over the algebraic closure, points above x=0 are P_0 and -P_0.
      A signed sum of m-1 such points is [r]P_0 with
      r in {-(m-1),-(m-3),...,m-1}. The Semaev zero property therefore makes
      the finite roots exactly the x-coordinates of the nonzero affine
      multiples with the corresponding parity.
  union_of_corner_exceptions: >-
    Taking all Hamming weights adds the parity classes from lower orders and
    t=0, yielding a subset of {x([r]P_0):1<=r<=m-1}; conversely each such
    affine x-value occurs in one corner class. Hence the union has at most
    m-1 elements.
  Newton_conclusion: >-
    Support is contained in [0,D_m]^(m-1) by the per-variable degree bound.
    Off the exception set every box vertex occurs. The convex hull of support
    is therefore the full box, and n=m-1 identical nonexceptional section
    polytopes have mixed volume n!*D_m^n.

typed_oracle_admission_card:
  id: NEWTON-CORNER-ADMISSION-001
  purpose: >-
    Type both the theorem certificate and any claimed use of an exceptional
    section before granting support-aware cost credit.
  semantics:
    deterministic: true
    stateful: false
    randomness: none
    equality: exact polynomial or exact field equality
    output_selection: canonical; no root or branch choice is hidden
  inputs:
    theorem_mode:
      - Field or universal coefficient ring with characteristic not 2 or 3.
      - Nonsingular short-Weierstrass parameters A and B.
      - Integer m>=3 and symbolic target t.
      - Canonical recursive Semaev circuit and its declared nonzero normalization.
    specialized_mode:
      - Exact field specialization (p,A,B,t) and subgroup specification H=<P> of order N when a cost claim is made.
      - Provenance of t: public fixed, known-log random relation target, or fresh scalar-blind masked target.
      - Exact factor-base definition, target masking law, decomposition arity m, and success/miss semantics.
      - Complete setup, relation, output, rank, factor-log, descent, verification, traffic, and peak-memory ledger.
  outputs:
    theorem_certificate:
      - D_m and the m corner-class circuit identities.
      - Exact exceptional set described by affine multiples [r]P_0, with points at infinity omitted.
      - SATURATED_GENERIC and the full-box mixed-volume formula.
    specialized_certificate:
      - SATURATED_SECTION when every corner class evaluates nonzero.
      - EXCEPTION_SECTION with the exact missing corner classes when at least one vanishes.
      - NO_COST_CREDIT unless exact support or mixed volume and the complete relation-to-descent ledger are also supplied.
    replay_receipt:
      - Hash or exact reference for the Semaev normalization and each symbolic lemma used.
      - Exact target provenance and all charged operation, output, traffic, and memory terms.
  replay_and_verification:
    - Re-evaluate the explicit S_3 corner classes.
    - Verify symmetry, per-variable degree, and the known leading-coefficient identity.
    - Replay the corner-square induction without expanding S_m.
    - Verify the all-zero root semantics using the defining summation property.
    - Confirm that all box vertices occur before applying the box mixed-volume formula.
    - For an exceptional cost claim, replay target selection, every miss, source tuple, signs, direct group-sum verification, relation rank, factor logs, and fresh masked-target descent.
  forbidden_free_oracles:
    - A dense S_m support table, mixed volume, resultant factorization, or exceptional root supplied without derivation.
    - A target-fitted exceptional t or its scalar relation supplied as advice.
    - A source tuple, sign vector, y-coordinate branch, factor log, target log, rank certificate, or descent witness supplied for free.
    - A bridge mapping an arbitrary target to the exceptional set without exact scalar provenance and charged construction.
    - Treating a failed decomposition, point at infinity, repeated relation, or dependent row as a successful relation.
    - Treating coefficient-dependent lifting, alternate curve models, or unsectioned supports as certified by the original-box certificate.
    - Standardized-curve execution, key recovery, or any cryptographic-size run.
  fully_charged_cost_vs_pollard_rho:
    baseline:
      pollard_rho_work: "N^(1/2+o(1)) expected group operations"
      pollard_rho_serial_memory: "N^o(1)"
      baby_step_giant_step: "N^(1/2+o(1)) work and N^(1/2+o(1)) stored group elements"
    generic_section:
      Newton_driver: "MV=(m-1)!*2^((m-1)(m-2)), equal to box Bezout"
      support_aware_improvement: "none in the original formulation"
      complete_cost: >-
        setup + relation_attempts*full_box_solver + relation_output + rank +
        factor_log_linear_algebra + fresh_target_descent + verification +
        traffic + peak_memory. No missing term is assigned zero, and no
        sub-rho exponent follows from support.
    exception_only_uniform_mask:
      eligible_subgroup_points: "at most 2(m-1)"
      fresh_mask_hit_probability: "at most 2(m-1)/N"
      expected_mask_trials: "at least N/(2(m-1))"
      replayable_output_work: "Omega(m)"
      descent_only_lower_bound: "Omega(N/m+m)=Omega(N^(1/2))"
      additional_charges:
        - exception-set construction and membership checks
        - unsuccessful decomposition attempts
        - relation independence and rank failures
        - factor-log solve
        - fresh-target descent
        - exact source and group-sum verification
        - output traffic and peak memory
      comparison: >-
        The best exponent is at least 1/2, equal to rather than below rho;
        the campaign admission work cap 0.45 is not met. Extra stages can only
        increase this cost.
    direct_exception_selection:
      disposition: no_free_credit
      reason: >-
        Selecting [r]P_0 directly does not provide log_P(P_0), independent
        relation right-hand sides, enough decompositions, or a fresh-target
        bridge. These must be typed and charged rather than treated as free.

