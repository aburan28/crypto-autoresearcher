outcome_interpretation:
  corner_lemma_and_exception_classification_verify: >-
    Admit an all-m generic Newton-saturation theorem candidate. Original-box
    support-aware elimination receives no asymptotic advantage; exception-only
    use must pass the typed target bridge and complete-cost card.
  corner_identity_fails: >-
    The first m, Hamming weight, and extra factor identify a genuine
    support-exception theorem target; no algorithmic credit follows until its
    frequency, mixed volume, relation supply, and fresh descent are charged.
  exception_set_is_larger_than_O_m: >-
    The saturation route is not admitted as a complete classifier. The larger
    set becomes the first object to characterize before any computation.
  different_typed_bridge_beats_uniform_masking: >-
    This report's cost closure is falsified for that new bridge only. It
    becomes a separate proposal requiring independent review, not
    breakthrough evidence.

remaining_review_obligations:
  - Check the exact leading-coefficient normalization for the repository's canonical recursive S_m in every characteristic at least 5.
  - Check the converse in the all-zero-corner root classification, including B=0 and affine/infinity degeneracies.
  - Confirm that the cost statement is retained only for the uniform-mask exception bridge and does not overreach to coefficient-dependent liftings.

ranking_rationale: >-
  This is the single route to test first. Its expected information gain is
  high because one known leading-coefficient identity plus one geometric
  all-zero-corner lemma decides every m and also exposes all possible
  corner-loss targets. Its cost is the cheapest valid discriminator: a
  paper-only induction and exact target-count argument, with no support
  expansion, mixed-volume run, toy curve, or standardized-curve execution.
  A support-exception algorithm is ranked lower because no typed fresh-target
  bridge survives the Omega(N/m+m) uniform-mask and output charge.

