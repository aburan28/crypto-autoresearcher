red_team_report:
  id: RT-20260723-803
  task_id: TASK-20260723-803
  goal_id: GOAL-CRYPTO-001
  claim_under_review: ADMIT_ASYMPTOTIC_NEWTON_SATURATION_PROOF_ROUTE_FOR_REVIEW
  verdict: REVISE
  admission_survives: true
  admission_scope: >-
    The admission survives only as a conditional, zero-compute proof gate for
    the Newton hull of the original target-sectioned canonical Semaev
    polynomial. It is not an established all-m theorem, an end-to-end Semaev
    lower bound, or evidence of a positive sub-rho algorithm.
  breakthrough_claimed: false
  official_state_transition: none

  snapshot_review:
    producer_snapshot_commit: fa347e96d60f73e699f7f0a6c296e5910603a261
    producer_artifact_hashes_match_receipt: true
    working_tree_artifacts_used_as_durable_evidence: false
    reviewed_artifacts:
      - coordination/goals/GOAL-CRYPTO-001/batches/BATCH-008/tasks/TASK-20260723-801/newton_screen_report.yaml
      - coordination/goals/GOAL-CRYPTO-001/batches/BATCH-008/tasks/TASK-20260723-801/newton_saturation_note.md
      - coordination/goals/GOAL-CRYPTO-001/batches/BATCH-008/archives/TASK-20260723-802/snapshot-receipt.json

  inference:
    task_id: TASK-20260723-803
    goal_id: GOAL-CRYPTO-001
    requested_policy: review-xhigh
    resolved_model_id: gpt-5.6-sol-xhigh
    reasoning_effort: xhigh
    fallback_used: true
    adapter_version: cursor-subagent-2026-07
    independent_session: true

  objections:
    - id: RT803-O1
      severity: blocking_for_theorem_status
      subject: coefficient_normalization
      finding: >-
        The recurrence is invoked only "up to the fixed nonzero
        normalization," while the claimed corner recurrence is written as an
        exact equality. A scalar that is nonzero generically need not be a
        unit after a valid curve specialization. The snapshot does not define
        one canonical recursive circuit and prove that every resultant
        normalization factor is a specialization-safe unit.
      consequence: >-
        The conditional corner induction is plausible, but the all-m
        saturation statement is not yet independently proved for every
        nonsingular characteristic-not-2-or-3 specialization.

    - id: RT803-O2
      severity: blocking_for_exact_exception_classifier
      subject: all_zero_corner_and_degeneracies
      finding: >-
        The root-set argument uses the summation-zero semantics to assert an
        exact converse for S_m(0,...,0,t), but does not separately prove that
        the specialized univariate polynomial is nonzero and has no
        recurrence-induced extraneous factor. The B=0 two-torsion case,
        signed sums equal to the point at infinity, torsion collisions, and
        the passage from root-set equality to the union of all corner classes
        are described rather than proved.
      consequence: >-
        The implication outside the proposed set is not certified until these
        cases are discharged in the normalization actually used.

    - id: RT803-O3
      severity: blocking_for_typed_oracle_completeness
      subject: inputs_outputs_and_replay
      finding: >-
        NEWTON-CORNER-ADMISSION-001 is a checklist, not yet a closed replay
        interface. "Field or universal coefficient ring with
        characteristic" is not one precise input type, and a declared
        nonzero normalization is circular without a unit proof. Specialized
        mode omits the encoded target point Q, generator and subgroup
        membership witnesses, random tape or sampler transcript, source-point
        lifts and y-branches, sign orientation, relation matrix and rank
        certificate, factor-log solution, descent witness, rejection reasons,
        and a common operation/traffic/memory cost unit. Declaring the oracle
        randomness-free conflicts with replaying uniform scalar masks unless
        the random tape is an explicit input.
      consequence: >-
        The forbidden-free-oracle list is directionally correct, but the
        current card cannot independently replay or fully charge a claimed
        relation-to-descent execution.

    - id: RT803-O4
      severity: scope_correction
      subject: exception_bridge_charge
      finding: >-
        The bound at most 2(m-1)/N and hence Omega(N/m) expected trials is
        valid only for fresh independent uniform scalar masks and unit-cost
        observable trials. Adding Omega(m) replayable output to obtain
        Omega(N/m+m) also requires one common cost model and an explicit rule
        that all m entries and signs must be materialized or retrievable.
        Exception-set construction, membership, failed decompositions,
        source recovery, relation independence, rank, factor logs, blind
        descent, verification, traffic, and peak memory are named but not
        quantified.
      consequence: >-
        This is a sufficient negative gate for the stated uniform-mask bridge,
        not a complete lower bound for every exceptional-target bridge or for
        the full Semaev index-calculus path.

    - id: RT803-O5
      severity: scope_correction
      subject: BKK_and_toy_evidence
      finding: >-
        The m=3,4,5 toy BKK negatives are consistency controls only. If the
        corner lemmas are proved, all-m full-box saturation follows from those
        lemmas, not by extrapolation from the toy records. Conversely, a full
        Newton box proves equality of the BKK mixed-volume/path-count driver
        with the multigraded box Bezout number; it does not prove equal
        runtime for every sparse resultant implementation, genericity of the
        structured coefficients, or a lower bound for coefficient-dependent
        liftings, Groebner systems, arithmetic circuits, or unsectioned
        formulations.
      consequence: >-
        "Closes BKK advantage" must be narrowed to the original sectioned
        Newton-hull mixed-volume ratio. No broader sparse-versus-dense or
        cryptographic conclusion is supported.

    - id: RT803-O6
      severity: scope_correction
      subject: exceptional_sections_and_end_to_end_path
      finding: >-
        A missing corner proves that one section polytope is proper, but does
        not by itself quantify the mixed volume of a square system, guarantee
        a solver reduction, supply factor-base membership, recover source
        tuples and signs, or produce independent known-right-hand-side
        relations. The square system of section polytopes is not by itself
        the complete factor-base decomposition and fresh-target descent
        system.
      consequence: >-
        Exceptional sections receive no positive algorithmic credit from this
        route.

  required_controls:
    - id: RT803-C1
      control: >-
        Freeze one exact canonical S_m recurrence over a stated coefficient
        domain and prove that its leading coefficient is a
        specialization-safe unit times S_{m-1}^2; propagate that unit through
        every corner class.
      discriminates: >-
        A genuine all-m corner identity from a normalization artifact.
    - id: RT803-C2
      control: >-
        Prove the exact nonzero polynomial and root-set statement for
        S_s(0,...,0,t) for every 3<=s<=m, explicitly treating B=0, affine
        versus infinity sums, and torsion collisions; then prove both
        inclusions for the union of corner exceptions.
      discriminates: >-
        The claimed O(m) exact classifier from a one-way semantic argument.
    - id: RT803-C3
      control: >-
        Replace the specialized oracle checklist with a versioned transcript
        schema containing the random tape, all point/source encodings,
        orientations, success and miss receipts, relation/rank/factor-log and
        descent certificates, and an additive bit-operation, traffic, and
        memory ledger.
      discriminates: >-
        A replayable charged mechanism from hidden advice or omitted stages.
    - id: RT803-C4
      control: >-
        State the result as MV/box-Bezout=1 for nonexceptional original
        sections and keep toy m=3,4,5 results only as checks; test no runtime,
        unsectioned, lifted, Groebner, or general-circuit claim with this
        certificate.
      discriminates: >-
        The valid Newton-hull gate from an unsupported broad no-go.
    - id: RT803-C5
      control: >-
        For any later algorithmic claim, report one common ledger containing
        relation supply, point-decomposition solve, source recovery, rank,
        factor-log linear algebra, blind target descent, verification,
        traffic, and peak memory before comparison with rho, BSGS, and the
        canonical prime-field Semaev index-calculus path.
      discriminates: >-
        A complete sub-rho comparison from a local elimination-cost change.

  counterexample_or_mutation:
    cheapest_discriminating_mutation: >-
      In the stated oracle, replace the unspecified resultant normalization
      by a coefficient-dependent factor that is generically nonzero but
      vanishes on a valid nonsingular specialization. The current phrase
      "declared nonzero normalization" would admit the symbolic identity while
      the specialized polynomial loses all support. Requiring the factor to
      be a unit in the frozen coefficient domain blocks this mutation without
      any curve run or polynomial expansion.
    expected_result_if_route_is_sound: >-
      The frozen canonical recurrence has only specialization-safe unit
      factors, so the mutation is rejected by type and the corner induction
      remains valid after every allowed specialization.

  baseline_comparison:
    pollard_rho: >-
      Pollard rho solves a fresh prime-order target in expected
      N^(1/2+o(1)) group operations with negligible serial memory and direct
      verification. The uniform-mask exception bridge has only a scoped
      Omega(N/m+m) lower bound, whose optimized exponent is 1/2; it therefore
      earns no sub-rho credit, but this is not a constant-factor or
      end-to-end comparison.
    baby_step_giant_step: >-
      BSGS uses N^(1/2+o(1)) work and N^(1/2+o(1)) stored group elements.
      The report states the exponent and memory contrast but provides no
      common bit-operation or parallel-memory accounting, so it establishes
      no advantage over BSGS.
    closest_specialized_baseline: >-
      The closest specialized baseline is canonical prime-field Semaev
      point-decomposition/index calculus using the multigraded box/dense
      section driver. Conditional generic saturation gives
      MV/box-Bezout=1, so the original Newton hull supplies no BKK path-count
      reduction. The snapshot cites a specialized complexity paper only
      qualitatively and supplies no frozen end-to-end baseline formula;
      relation probability, membership constraints, solver cost, source
      recovery, rank, factor logs, and target descent remain unpriced.
    conclusion: >-
      No positive sub-rho claim survives. The defensible result is a negative
      admission gate for one mixed-volume mechanism and one uniform-mask
      exception bridge.

  narrowest_supported_statement: >-
    Conditional on a fixed canonical normalization whose leading-coefficient
    factor is a unit, and on an exact all-zero-corner root-set lemma including
    degeneracies, the corner induction would prove that every
    nonexceptional original target section has Newton polytope
    [0,2^(m-2)]^(m-1) and hence mixed volume equal to its multigraded box
    Bezout number. Independently, a fresh independent uniform-mask strategy
    that must hit at most 2(m-1) eligible subgroup points and materialize a
    replayable m-entry decomposition has no exponent below 1/2 in a common
    charged model. Neither statement is a general ECDLP lower bound or a
    positive cryptographic result.

  next_concrete_action: >-
    Produce one normalization-locked paper proof packet that fixes the exact
    recursive S_m circuit, proves the unit-valued leading-coefficient
    induction and the all-zero-corner root classifier including B=0 and
    infinity/torsion cases, and instantiates those lemmas in a versioned
    theorem-mode replay certificate; do not open an algorithmic experiment or
    change ledger status.

