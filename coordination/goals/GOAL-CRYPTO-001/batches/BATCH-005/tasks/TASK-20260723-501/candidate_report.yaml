corpus_deduplication:
  checked_at: "2026-07-23"
  exact_exclusions:
    - id: OBL-ZR-COMPACT-CONSTRUCTOR-001
      reason: >-
        A support factor, fifth-label replay, compact resultant, common-factor
        update, or renamed source dictionary is the failed IDEA-20260723-001
        interface and is not a new mechanism.
    - id: IDEA-20260723-002
      reason: >-
        A zero-minor, defect loop, normalized hyperplane-signature
        enumerator, or unnamed implicit minor locator is the excluded
        BATCH-003/BATCH-004 route.
  toy_negative_and_scoped_control_exclusions:
    - >-
      First-order jets and free dual-number lifts: EV-JET-001 and
      EV-JETB-001 found no information beyond zeroth order in the tested toy
      scope; P1547 supplies the prime-to-p additive vanishing boundary.
    - >-
      Elliptic-net/EDS recurrence and translated-coordinate annihilator:
      EV-NET-001 and P1540 preserve no direct index locator.
    - >-
      Incidence reporting and EC richness: EV-INC-001 and EV-INCB-001 found
      no output-sensitive or richness advantage in their tested toy scopes;
      P1553 reduces the admitted pair-wedge zero predicate to endpoint sum.
    - >-
      BKK/mixed-volume elimination: EV-BKK-001 and EV-BKKMV-001 show
      sectioned Semaev box saturation for m=3,4,5 in the tested scopes.
    - >-
      Arithmetic-progression displacement structure: EV-STR-001 found
      generic-maximal displacement rank and a relation-supply penalty in the
      tested scope.
    - >-
      Edwards/model, factor-base-shape, and small-isogeny levers:
      EV-REP-001, EV-REP-002, EV-FB-001, and EV-ISO-001 found no exponent
      lever in their tested toy scopes.
    - >-
      Solver-free summation evaluation and prime-field decomposition are
      known routes already covered by KN-LIT-025, FINDING-PF-IC-001, and the
      McGuire-Mueller prior-art screen; changing the backend alone is not a
      mechanism.
  operation_level_result: >-
    The remaining names collapse into source-preserving transforms,
    endpoint aggregation followed by source unranking, scalar-orientation
    return, or cover/correspondence transfer. Each checked instance either
    consumes source-labelled state, returns only an aggregate certificate,
    restores B^3 or larger represented traffic, or moves the original DLP
    without a cheaper return.

literature_deduplication:
  method: >-
    Checked the curated literature index and relevant entries, the P1552 and
    P1553 primary-literature screens, and fresh web searches on 2024-2026
    prime-field ECDLP, classical index calculus, zero-minor methods, and
    kSUM/3SUM preprocessing. This was a relevance screen, not a systematic
    review proving absence.
  checked_sources:
    - >-
      Galbraith and Gaudry, "Recent progress on the elliptic curve discrete
      logarithm problem," Designs, Codes and Cryptography 78 (2016);
      KN-LIT-006.
    - >-
      Petit, Kosters, and Messeng, "Algebraic Approaches for the Elliptic
      Curve Discrete Logarithm Problem over Prime Fields," PKC 2016;
      KN-LIT-025.
    - >-
      McGuire and Mueller, "A New Index Calculus Algorithm for the Elliptic
      Curve Discrete Logarithm Problem and Summation Polynomial Evaluation,"
      IACR ePrint 2017/1262. Its stated prime-field algorithms have
      exponential complexity and are reported worse than Pollard rho.
    - >-
      Mahalanobis, Mallick, and Abdullah (2018), Abdullah and Mahalanobis
      (2023/2025), and Mahalanobis (arXiv:2607.09814v1, 2026); this is the
      excluded zero-minor/hyperplane-signature lineage.
    - >-
      Dinur and Golovnev, arXiv:2512.04258; Kasliwal, Polak, and Sharma,
      arXiv:2410.16784; and Kirkpatrick et al., arXiv:2602.11363. P1552/P1553
      translate their stated preprocessing/query regimes outside the
      B^(9/4)/B^(5/4) rectangle.
    - >-
      Shoup, "Lower Bounds for Discrete Logarithms and Related Problems,"
      EUROCRYPT 1997; KN-LIT-011.
    - >-
      July 2026 searches also returned quantum resource-reduction papers,
      including arXiv:2607.13816. Quantum circuit optimization is a different
      computational model and does not supply the requested matched classical
      fully charged mechanism.
  conclusion: >-
    No checked source supplies a distinct classical prime-field operation
    with exact source return, relation rank, factor logs, blind descent, and
    complete sub-rho time and memory. Because the search is not exhaustive
    and no proposal is being made, novelty_status remains unverified rather
    than claiming novelty or impossibility.

charged_cost_model:
  scope: >-
    Best explicit control for the narrow remaining six-list
    Abel-Jacobi/source-location frontier; it is not a proposed algorithm.
  asymptotic_regime:
    subgroup_order: N
    input_bits: n=ceil(log2(N))
    factor_scale: B=N^(1/5)
    required_independent_rows: Theta(B)
  preprocessing:
    factor_decks:
      work: B^(1+o(1)) group operations
      N_exponent: 0.20
    explicit_source_labelled_pair_tables:
      work: B^(2+o(1))
      live_state: B^(2+o(1)) field/group/source words
      N_exponent: 0.40
    hidden_cost_rule: >-
      Any incidence graph, transform coefficients, source dictionary,
      character orientation, target-fitted advice, or branch catalogue must
      be added here rather than treated as free.
  relation_collection:
    first_generic_campaign_hit:
      work: B^(5/2+o(1))
      N_exponent: 0.50
      limitation: >-
        A first hit does not provide Theta(B) independent rows, factor logs,
        or the fresh-target path.
    current_explicit_complete_campaign:
      work: B^(3+o(1))
      represented_state_if_materialized: B^(3+o(1))
      N_exponent: 0.60
      rank_credit: none_until_rows_are_independently_verified
  linear_algebra_and_factor_logs:
    optimistic_sparse_wiedemann:
      work: B^(2+o(1)) field operations
      live_memory: B^(1+o(1)) field elements
      N_work_exponent: 0.40
      N_memory_exponent: 0.20
      assumptions:
        - Theta(B) independent constant-weight rows have first been collected.
        - No rank defect, duplicate column, or missing factor log is ignored.
  blind_descent:
    current_explicit_endpoint_control:
      work_per_fresh_target: B^(3+o(1))
      reusable_pair_state: B^(2+o(1))
      N_work_exponent: 0.60
      N_state_exponent: 0.40
      required_semantics: >-
        Use a scalar-blind public mask, return exact signed sources, remove
        the mask only after verified factor logs, and reverify the public
        group equality.
  verification:
    relation_certificates:
      work: B^(1+o(1)) group operations for Theta(B) constant-arity rows
      N_exponent: 0.20
    final_certificate:
      work: O(log(N)) group operations
      N_exponent: 0
    acceptance_rule: exactly_zero_certificate_failures
  memory:
    current_materialized_campaign:
      state: B^(3+o(1))
      N_exponent: 0.60
    optimistic_streaming_note: >-
      Even granting B^(2+o(1)) live pair state through an unspecified
      streaming schedule, the B^3 collection/descent work remains N^0.60.
      No simultaneous time-and-memory improvement may be credited without
      an explicit exact schedule.
  aggregate_current_control:
    total_work_exponent: 0.60
    peak_memory_exponent: 0.60
    dominant_stages:
      - relation_collection
      - blind_descent
    status: >-
      Explicit control only; it lacks a promoted independent-rank result and
      is already worse than rho in work.
  required_admission_formula:
    beta: 0.20
    work_exponent: >-
      lambda=max(a,beta+delta+q-r+o,ell,
      delta_t+q_t+o_t+u,beta)
    memory_exponent: >-
      mu=max(a_m,q_m,beta+o,ell_m,u)
    definitions:
      a: preprocessing work exponent
      a_m: preprocessing/live-state exponent
      delta: reciprocal relation success exponent
      q: charged work per relation attempt
      r: independently verified rank credit, constrained by 0<=r<=o
      o: relation source-output exponent
      ell: factor-log linear-algebra work exponent
      ell_m: factor-log memory exponent
      delta_t: reciprocal blind-target success exponent
      q_t: charged blind-target query exponent
      o_t: blind-target source-output exponent
      u: ambiguity/replay exponent
    campaign_threshold: lambda<=0.45
    memory_threshold: mu<=0.45
    fresh_query_rectangle: B^(5/4+o(1))=N^(0.25+o(1))
    rationale: >-
      The 0.45 research threshold requires a reproducible margin below the
      0.50 rho exponent; equality with rho is not an advantage.
  pollard_rho_comparison:
    expected_work: N^(1/2+o(1)) group operations
    serial_memory: N^o(1) bits beyond group elements
    bit_complexity: N^(1/2+o(1))*poly(log(N))
    result: >-
      The current explicit frontier control has work exponent 0.60 and
      therefore loses to rho. An unknown stage cannot be assigned exponent
      zero; without a constructed source operator there is no admissible
      complete cost claim.

narrowest_remaining_open_problems:
  - id: SOURCE-LOCATOR-OPEN
    related_corpus: [P1552, P1553, KN-OPEN-005]
    statement: >-
      Construct an endpoint-derived, subset-stable exact restricted-existence
      operator for the six-list Abel-Jacobi fibre, with charged dyadic source
      recovery, without B^3 provenance, an order-N character dictionary,
      target-fitted advice, or a supplied source object.
    admission_obligation: >-
      Setup/state at most B^(9/4+o(1)), one fresh masked query at most
      B^(5/4+o(1)), and complete lambda,mu<=0.45.
  - id: KN-OPEN-005
    statement: >-
      Exhibit a concrete prime-field coordinate oracle outside the closed
      first-jet, elliptic-net, incidence, scalar-orbit, cover-return, and
      endpoint-aggregation classes, then prove it is not O(1)-overhead
      generic-group simulable.
    admission_obligation: >-
      The oracle must output k-dependent exact relations below the birthday
      bound and include factor logs plus blind descent; a universal identity
      or aggregate statistic is insufficient.
  - id: KN-OPEN-004
    statement: >-
      Prove all-arity Newton saturation for target-sectioned prime-field
      Semaev systems or exhibit a genuine asymptotic support exception beyond
      the m=3,4,5 toy-negative range.
    admission_obligation: >-
      An exception must reduce the complete relation and descent cost, not
      only a solver proxy or total-degree Bezout convention.
  - id: KN-OPEN-006
    statement: >-
      Find a relation-support family other than the tested arithmetic
      progressions whose displacement rank remains subpolynomial while its
      relation-supply penalty and rank loss preserve a complete sub-rho path.
    admission_obligation: >-
      Charge support generation, relation density, structured solve,
      factor-log completion, blind descent, memory, and verification.
  - id: KN-OPEN-001
    statement: >-
      Umbrella problem: no known checked classical prime-field index-calculus
      route beats rho after all stages are charged.

cheapest_decisive_gate:
  name: explicit_operation_and_full_cost_admission_sheet
  type: theorem_only_zero_compute
  design: >-
    For one future candidate, write its exact public operation or identity,
    coefficient provenance, generic-prime typing, restricted-existence
    semantics, signed source recovery, and identical masked-target use. Fill
    one symbolic ledger charging preprocessing, relation probability and
    attempts, independent rank, factor-log linear algebra, descent,
    verification, bit time, memory, failed branches, and output. Compare the
    resulting lambda and mu with rho before any fixture or run.
  controls:
    - >-
      Semantic rename control: reject z_R/common-factor/fifth-label payloads,
      defect-scaled hyperplane signatures, unnamed zero-minor locators, and
      solver/backend substitutions.
    - >-
      Source-relabel control: two inputs with the same aggregate endpoint but
      different occurrence labels must either be distinguished by named
      charged state or reported ambiguous and charged.
    - >-
      Generic-encoding erasure: identify the exact operation that ceases to
      typecheck when curve coordinates are replaced by opaque group labels.
    - >-
      Rank-and-descent control: known-log rows receive no credit unless
      independently ranked, and the fresh scalar-blind masked target must use
      the same source inverse.
    - >-
      Cost control: charge aggregate work, bit memory, memory traffic,
      retries, preprocessing amortization, source output, and exact
      certificate verification.
  required_metrics:
    - exact_operation_identity_complete
    - setup_work_exponent_a
    - setup_memory_exponent_a_m
    - relation_success_exponent_delta
    - relation_query_exponent_q
    - independently_verified_rank_credit_r
    - factor_log_work_exponent_ell
    - blind_descent_exponent
    - total_work_exponent_lambda
    - total_memory_exponent_mu
    - certificate_reverification_failures
  pass_condition: >-
    A semantically distinct explicit operation is proved correct on every
    admitted stratum, exact sources and misses are replayable, the
    non-generic step is named, certificate failures are zero by construction,
    and complete charged lambda,mu are at most 0.45 with one fresh query
    inside B^(5/4+o(1)).
  fail_condition: >-
    No explicit operation is supplied; the source inverse is an oracle or
    hidden advice; any stage is omitted; or complete work or memory is at
    least rho's 0.50 exponent, including equality.
  outcome_interpretation:
    explicit_distinct_operation_and_subrho_ledger:
      meaning: >-
        The no-candidate disposition is superseded only by a new proposal
        requiring independent theorem review; this is not breakthrough
        evidence.
    renamed_or_undercharged_or_non_subrho:
      meaning: >-
        Retain NO_ADMISSIBLE_NEXT_MECHANISM and do not spend a toy or
        cryptographic run on the route.
  estimated_cost:
    implementation: none
    compute: none
    analyst_effort: hours_not_days
  why_cheapest: >-
    Every remaining uncertainty is currently an absent operation or absent
    cost proof. Empirical data cannot instantiate a missing identity or repair
    an omitted source inverse, so a static admission sheet is cheaper and
    more discriminating than any <=32-bit fixture.

ranking_rationale: >-
  SOURCE-LOCATOR-OPEN ranks first by information gain because it is the
  narrowest common obstruction after P1552/P1553 and directly tests whether a
  new operation exists; KN-OPEN-005 is broader, while KN-OPEN-004 and
  KN-OPEN-006 remain useful theorem questions but inherit toy negatives and
  still need a complete target path. The single static admission sheet is the
  cheapest valid discriminator: a passing identity would create an
  independently reviewable candidate, while failure prevents spending compute
  on another renamed source oracle.

safety_scope:
  classification: non_operational_academic_mathematics
  activity: corpus_literature_deduplication_and_zero_compute_cost_screen
  maximum_curve_size_for_any_future_fixture: 32_bits
  real_keys: none
  deployed_systems: none
  standardized_curve_execution: none
  key_recovery_software: none
  operational_cryptanalytic_instructions: none
  permitted:
    - abstract theorem and asymptotic cost analysis
    - literature novelty screening
    - <=32-bit future toy semantics checks only after Coordinator approval
  prohibited:
    - real-key recovery
    - deployed-target analysis
    - standardized-curve execution planning
    - presenting toy or conditional work as cryptographic evidence
  conclusion_boundary: >-
    This report neither proves ECDLP hardness nor closes unrestricted
    non-generic algorithms. It records only that no admissible next mechanism
    was found in the checked scope, and it claims no breakthrough.

