claim_boundary:
  exact_claim: >-
    No operation-level mechanism presently survives the checked internal
    corpus, ledger, and literature screens while remaining distinct from both
    IDEA-20260723-001 and IDEA-20260723-002 and supplying a complete
    classical prime-field relation-to-target path below the matched Pollard-rho
    exponent. This is a no-candidate disposition for the checked sources, not
    an impossibility theorem.
  empirical_results: none
  theorem_claimed: none
  cryptographic_advantage_claimed: none

epistemic_separation:
  established_facts:
    - >-
      In the generic group model, prime-order discrete logarithm requires
      Omega(sqrt(N)) group operations; Pollard rho matches this exponent.
    - >-
      EV-CRYPTO-002 records NO_ADMISSIBLE_CONSTRUCTION only for the compact
      z_R admission sheet, not for every nonlinear representation.
    - >-
      EV-CRYPTO-004 records INCONCLUSIVE_COST_CLAIM only for the
      defect-scaled hyperplane-signature interface.
    - >-
      P1552 and P1553 independently preserve an exact six-list
      Abel-Jacobi/source-location frontier but supply no endpoint-only source
      operator within the B^(9/4) setup and B^(5/4) query rectangle.
    - >-
      The current canonical idea corpus contains exact IDs 001 through 410;
      the independent closeouts for 314 through 410 report no active or
      theorem-deferred survivor from those cohorts.
  derivation:
    - >-
      For B=N^(1/5), the current explicit six-list campaign control costs
      B^(3+o(1))=N^(0.60+o(1)) work, while the first generic collision costs
      B^(5/2+o(1))=N^(0.50+o(1)) and supplies only a first hit rather than the
      B independent rows, factor logs, and blind descent required by a
      complete route.
    - >-
      Optimistic B-by-B sparse linear algebra costs B^(2+o(1))=N^(0.40+o(1)),
      so accelerating that downstream stage cannot repair the N^0.60
      collection and descent controls.
  speculation:
    - >-
      A genuinely non-generic, noncharacter, endpoint-derived restricted
      existence operator with exact source replay could remain logically
      possible outside the checked grammars.
    - >-
      An untested representation could also alter relation density or expose
      structured linear algebra, but no explicit operation and complete cost
      path were found.
  proposed_test: explicit_operation_and_full_cost_admission_sheet

