ldrows if r['path']==p);actual=sha(ROOT/p)\n    drift.append({'path':p,'expected':expected,'actual':actual,'passed':actual==expected,'extent':'hash-only against frozen prior reviewer binding'})\nauthority=[]\nfor p in ['ledger/handoffs/TASK-20260908-2d72fd.yaml',*[f'coordination/goals/GOAL-CRYPTO-001/batches/BATCH-f93d4f/{x}' for x in ['protocol.yaml','review-plan.yaml','source-bindings.json']]]:\n    blob=subprocess.check_output(['git','show','6fb37c90d6f8c5281a5f5369401009715aa6574a:'+p]);actual=sha(ROOT/p);expected=hashlib.sha256(blob).hexdigest()\n    authority.append({'path':p,'authority_commit':'6fb37c90d6f8c5281a5f5369401009715aa6574a','committed_sha256':expected,'live_sha256':actual,'passed':actual==expected})\nout={'semantic_F1':records,'final_drift':drift,'authority':authority,'head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()}\n(S/'final-checks.json').write_text(json.dumps(out,indent=2)+'\\n')\nassert len(records)==6 and all(r['old_failure_retained'] and r['current_rejection_passed'] for r in records)\nassert all(r['passed'] for r in drift+authority)\nprint(json.dumps({'semantic_F1_old_failures_retained':6,'semantic_F1_new_rejections':6,'protected_bindings':len(drift),'authority_bindings':len(authority),'passed':True}))\n"
