          "source": "import hashlib,importlib.util,itertools,json,sys\nfrom pathlib import Path\nimport yaml\nS=Path(__file__).resolve().parent;ROOT=Path.cwd()\nspec=importlib.util.spec_from_file_location('supplemental_vl',S/'pinned/new/tools/validate_ledger.py')\nvl=importlib.util.module_from_spec(spec);sys.modules[spec.name]=vl;spec.loader.exec_module(vl)\ndef sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()\ndef call(fn,*a,**kw):\n    try:return {'value':fn(*a,**kw),'exception':None}\n    except Exception as e:return {'value':None,'exception':f'{type(e).__name__}: {e}'}\nobservations=[]\nfor i,(status,pending,kind) in enumerate(itertools.product(['running','in_progress','completed_valid','planned'],[True,False,None,1,'true'],['none','discrete_log',None])):\n    d=S/'pending'/str(i)/'RUN-REVIEW-001';d.mkdir(parents=True)\n    p=d/'manifest.yaml'\n    body={'id':'RUN-REVIEW-001','experiment_id':'EXP-REVIEW-001','status':status,\n     'code':{'commit':'0'*40,'command':'synthetic only'},'environment':{'python':'synthetic'},\n     'inputs':{'parameters':{'field_bits':16}},'timing':{'wall_clock_seconds':0},\n     'result':{'raw_result_pending':pending,'certificate':{'kind':kind}}}\n    p.write_text(yaml.safe_dump({'run':body},sort_keys=False))\n    for f in ['command.txt','environment.json','stdout.log','stderr.log']:(d/f).write_text('{}\\n')\n    ctx=vl.Ctx(set());result=call(vl.check_run,str(p),ctx,{})\n    expected_missing=not(status in ['running','in_progress'] and pending is True and kind=='none')\n    actual_missing=any(\"missing artifact 'raw-result.json'\" in e for e in ctx.errors)\n    observations.append({'status':status,'pending':pending,'kind':kind,'expected_missing_raw':expected_missing,'actual_missing_raw':actual_missing,'exception':result['exception'],'errors':ctx.errors,'passed':result['exception'] is None and actual_missing==expected_missing})\nhistorical=[]\nfor rid in ['RUN-RELN-141a86-stage0c-pexist-extended','RUN-RELN-141a86-stage1-grammar']:\n    p=ROOT/'experiments/EXP-RELN-141a86/runs'/rid/'manifest.yaml'\n    entry={'run_id':rid,'superseded_path':str(p),'superseded_sha256':sha(p),'superseded_id_extraction':{'kind':'unique_nested_run_id_duplicate_process','line_number':2,'exact_line':'  id: '+rid}}\n    ordinary=call(vl._run_id_of,str(p));opted=call(vl._run_id_of,str(p),superseded_entry=entry)\n    historical.append({'path':str(p.relative_to(ROOT)),'sha256':sha(p),'ordinary':ordinary,'explicit_hash_pinned_identity':opted,'expected_ordinary':None,'expected_opted':rid,'passed':ordinary=={'value':None,'exception':None} and opted=={'value':rid,'exception':None},'scope':'Direct identity parsing with explicitly constructed hash-bound locator, not live registry validation or scientific execution.'})\nproducer=json.loads((ROOT/'coordination/goals/GOAL-CRYPTO-001/batches/BATCH-f93d4f/tasks/TASK-20260908-60c867/synthetic-evidence.json').read_text())\ncomparisons=[]\ndef canonical(d):\n    if isinstance(d,list):return [canonical(x) for x in d]\n    if isinstance(d,dict):\n        return {k:canonical(v) for k,v in d.items() if k not in ['superseded_path','superseding_path','registry_errors','all_errors']}\n    return d\nfor key,file,rows in [('amendment_controls','amendment-reproduced.json','observations'),('previous_controls','prior-reproduced.json','cases')]:\n    target=producer[key];actual=json.loads((S/file).read_text())\n    # Temporary paths differ; preserve error presence and count beside normalized values.\n    def project(o):\n        x=canonical(o)\n        for k in ['registry_errors','all_errors']:\n            if k in o:x[k+'_count']=len(o[k]);x[k+'_suffixes']=[t.split(': registered ',1)[-1] for t in o[k]]\n        return x\n    a=[project(o) for o in target[rows]];b=[project(o) for o in actual[rows]]\n    comparisons.append({'source':key,'producer_count':len(a),'reproduced_count':len(b),'projection_equal':a==b,'projection_rule':'Ignore temporary file path fields; preserve every other value and error-message suffix/count.'})\nout={'pending_gate':observations,'historical_originals':historical,'producer_comparisons':comparisons,\n 'summary':{'pending_cases':len(observations),'pending_passed':sum(o['passed'] for o in observations),'historical_originals':len(historical),'historical_passed':sum(o['passed'] for o in historical),'producer_observations_equal':all(x['projection_equal'] for x in comparisons)}}\n(S/'supplemental-evidence.json').write_text(json.dumps(out,indent=2)+'\\n')\nprint(json.dumps(out['summary']))\nassert all(o['passed'] for o in observations+historical)\nassert all(x['projection_equal'] for x in comparisons)\n"
