    - deployed-target analysis
    - standardized-curve execution planning
    - presenting a conditional or toy route as cryptographic evidence
  conclusion_boundary: >-
    This report neither proves ECDLP hardness nor claims an ECDLP algorithm,
    solve, advantage, or breakthrough. It records only that the checked
    SOURCE-LOCATOR-OPEN material fails the repaired admission sheet.

