ranking_rationale: >-
  The repaired SOURCE-LOCATOR-OPEN sheet remains the cheapest valid
  discriminator because the unresolved object is an explicit mathematical
  operation, not a measurable implementation effect. Requirement 1 fails
  before any compute: no semantically distinct operation is present. The
  independent simulator, rank-tail, replay, and fresh-query failures confirm
  that promoting an open exception would only hide missing work. I would test
  this sheet first for any future claimed locator because its zero-compute
  semantic check rejects supplied-oracle restatements before costlier theorem
  review or experimentation.

