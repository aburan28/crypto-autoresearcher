restricted_replay_accounting:
  occurrence_model: >-
    Each deck entry is an immutable occurrence record
    (colour, occurrence_label, sign, public_point). Equal public points retain
    separate labels. Restrictions act on occurrence labels, not deduplicated
    endpoints.
  conditional_oracle: >-
    Exists(S_1,...,S_k;R) returns only an exact yes/no answer for the frozen
    rectangular occurrence subsets, with k=6 for the known-log campaign and
    k=5 for a fixed fresh target. It must use the same operation and
    preprocessing as the claimed locator.
  deterministic_traversal: >-
    Use a frozen depth-first binary partition of occurrence-label intervals.
    At every non-singleton positive box, query both children and recurse only
    into positive children. A singleton positive leaf is replayed and
    independently verified. This enumerates all witnesses without deleting
    one occurrence that may participate in another row.
  call_bounds:
    relation_campaign:
      depth_per_leaf: D_6=sum_(h=1)^6 ceil(log2(|S_h|))=O(log(B))
      calls_for_s_relation_tuples: at_most_1+2*s*D_6
      required_output_scale: s_at_least_Theta(B)_before_rank_filtering
    one_fresh_masked_target:
      depth_per_leaf: D_5=sum_(h=1)^5 ceil(log2(|S_h|))=O(log(B))
      calls_for_s_t_target_tuples: at_most_1+2*s_t*D_5
    charged_on_every_call:
      - exact restricted query work
      - coefficient or data-structure rebuild induced by the restriction
      - target-dependent translation
      - misses and empty sibling boxes
      - source-label and sign output
      - exact group-equality verification at each positive leaf
  live_state:
    depth_first_stack: O(log(B)) subset descriptors and branch bits
    current_source_tuple: at_most_six_occurrence_labels_signs_and_points
    persistent_state: all_candidate_preprocessing_and_source_sidecars
    query_workspace: maximum_workspace_of_any_restricted_call
    relation_matrix: Theta(B)_constant_weight_verified_rows
    rule: >-
      Breadth-first frontiers, cached restricted coefficients, source
      dictionaries, ambiguity lists, and replay tables are additional live
      state. A depth-first schedule may trade storage for recomputation, but
      all recomputed calls remain charged.
  current_result: >-
    This schedule defines the missing accounting obligation; it does not
    instantiate Exists and therefore cannot admit an operation.

rank_accounting:
  required_rank: rho_star=Theta(B)_over_the_actual_factor_columns
  admissible_credit:
    deterministic_case: >-
      A proof that every accepted campaign batch has rank at least rho_star;
      then the rank-rejection exponent eta_rank is zero.
    probabilistic_case: >-
      A proved lower bound Pr[rank at least rho_star] >=
      N^(-eta_rank+o(1)), with the exact deck and target distribution frozen.
      Expected campaign work is multiplied by N^(eta_rank+o(1)).
  rejected_batch_charge:
    - complete relation-location and restricted-replay work
    - all miss and ambiguity branches
    - exact row verification and rank computation
    - factor-deck or target-deck rebuild when required by the retry policy
    - discarded row storage and memory traffic
  no_credit_rule: >-
    If neither guarantee is proved, eta_rank is unknown and rank credit r=0.
    Observing or expecting Theta(B) rows is not a rank-yield theorem.
  current_control:
    deterministic_rank_guarantee: none
    rank_yield_tail_bound: none
    eta_rank: unknown_not_zero
    credited_rank_exponent_r: 0

charged_cost_model:
  exponent_convention: >-
    All exponents are in N and absorb poly(log(N)) factors only. Field
    operations, group operations, bit operations, and memory traffic retain
    their polynomial-log conversion factors.
  symbols:
    beta: 0.20
    a: target-independent preprocessing work exponent
    a_m: retained preprocessing/live-state exponent
    q_rel: work exponent of one base relation restricted-existence call
    q_rel_replay: >-
      work exponent of one restricted replay call including any restriction
      rebuild
    q_rel_m: maximum live workspace exponent of a relation or replay call
    o_rel: exponent of verified occurrence-level rows output by one accepted batch
    r: independently guaranteed rank-yield exponent per accepted batch
    delta_rel: reciprocal semantic-success exponent
    eta_rank: reciprocal full-rank-acceptance exponent including rejected batches
    ell: factor-log linear-algebra work exponent
    ell_m: factor-log linear-algebra memory exponent
    q_t: base fresh-target query work exponent
    q_t_replay: >-
      work exponent of one fresh-target restricted replay call including
      restriction rebuild
    o_t: fresh-target output exponent
    delta_t: reciprocal fresh-target success exponent
    u_t: ambiguity_sign_orientation_and_retry exponent
    m_replay: replay-stack_cached-restriction_and-source-sidecar exponent
    m_output: maximum simultaneously live output or ambiguity-list exponent
    b_w: explicit bit-operation and memory-traffic work exponent
    b_m: explicit bit-memory exponent
  derived_terms:
    relation_batch_work: >-
      c_rel=max(q_rel,q_rel_replay+o_rel,o_rel)
    relation_campaign_work: >-
      L_rel=max(0,beta-r)+delta_rel+eta_rank+c_rel
    complete_fresh_online_work: >-
      tau=delta_t+u_t+max(q_t,q_t_replay+o_t,o_t)
    total_work: >-
      lambda=max(a,L_rel,ell,tau,beta,b_w)
    peak_memory: >-
      mu=max(a_m,q_rel_m,beta,ell_m,m_replay,m_output,b_m)
  constraints:
    - 0<=r<=o_rel
    - eta_rank=0_only_with_a_deterministic_rank_guarantee
    - probabilistic_rank_credit_requires_a_proved_tail_and_charged_rejections
    - tau<=0.25_for_one_complete_fresh_scalar_blind_target
    - lambda<=0.45
    - mu<=0.45
    - unknown_terms_are_admission_failures_not_zero
  current_explicit_control:
    target_independent_pair_state:
      work: B^(2+o(1))
      memory: B^(2+o(1))
      N_exponents: [0.40, 0.40]
    first_generic_campaign_hit:
      work: B^(5/2+o(1))
      N_work_exponent: 0.50
      limitation: not_a_full_rank_campaign
    complete_relation_campaign:
      work: B^(3+o(1))
      materialized_memory: B^(3+o(1))
      N_exponents: [0.60, 0.60]
      rank_retry_charge: unknown_additional_cost
    optimistic_sparse_factor_log_solve:
      work: B^(2+o(1))
      memory: B^(1+o(1))
      N_exponents: [0.40, 0.20]
      condition: only_after_Theta_B_independent_verified_rows
    complete_fresh_masked_target_control:
      work: B^(3+o(1))
      reusable_pair_state: B^(2+o(1))
      N_exponents: [0.60, 0.40]
    relation_output_and_verification:
      work: B^(1+o(1))
      sparse_row_state: B^(1+o(1))
      N_exponents: [0.20, 0.20]
    final_public_certificate:
      work: O(log(N))_group_operations
      N_work_exponent: 0
    aggregate:
      certifiable_total_work_lower_exponent: 0.60
      direct_materialized_memory_exponent: 0.60
      optimistic_unproved_streaming_memory_exponent: 0.40
      complete_lambda: not_certifiable_below_0.60_due_to_rank_retry_unknown
      complete_mu: not_certifiable_below_0.45_in_the_direct_materialized_route
      result: fails_campaign_and_fresh_query_thresholds

