admission_subject:
  id: SOURCE-LOCATOR-OPEN
  asymptotic_regime:
    subgroup_order: N
    factor_scale: B=N^(1/5)
    beta_in_N: 0.20
    factor_decks: five signed coloured occurrence decks of size Theta(B)
    relation_target_deck: Theta(B) known-log targets
    required_verified_rank: Theta(B)
  required_public_operation: >-
    A target-independent-preprocessed, subset-stable restricted-existence
    operation for the six-list Abel-Jacobi fibre. On known-log relation
    targets and on one fresh scalar-blind masked target, it must return exact
    signed occurrence labels or a certified miss, with deterministic replay
    and no hidden source-bearing state.
  campaign_threshold:
    total_work_exponent_lambda_at_most: 0.45
    peak_memory_exponent_mu_at_most: 0.45
    exhaustive_failure_rule: >-
      Any lambda>0.45, mu>0.45, unassigned exponent, or fresh-query violation
      is an admission failure. The 0.50 exponent is only the Pollard-rho
      baseline and creates no intermediate admissible interval.
  fresh_scalar_blind_query:
    complete_online_bound: B^(5/4+o(1))=N^(0.25+o(1))
    included_costs:
      - target-dependent setup
      - misses and retries
      - every restricted replay call
      - occurrence-level output
      - ambiguity and sign/orientation handling
      - unmasking and final public group-equality verification

epistemic_separation:
  established_facts:
    - >-
      Shoup's generic-group lower bound gives Omega(sqrt(N)) generic group
      operations for prime-order discrete logarithm, and Pollard rho matches
      the N^(1/2+o(1)) work exponent with N^o(1) serial memory.
    - >-
      P1552 and P1553 give an exact source-labelled six-list Abel-Jacobi
      normal form, but their determinant, pair-wedge, and Abel-endpoint
      predicates test supplied tuples or endpoints; they do not locate exact
      source occurrences inside the repaired rectangle.
    - >-
      EV-CRYPTO-002 closes only the named compact z_R/common-factor
      constructor sheet. EV-CRYPTO-005 records a checked-snapshot
      no-candidate disposition, not a universal lower bound.
    - >-
      The explicit source-labelled six-list control uses B^(3+o(1)) complete
      campaign work and B^(3+o(1)) direct fresh-target work.
  derivation:
    - >-
      Since B=N^(1/5), B^3=N^0.60, B^(5/2)=N^0.50,
      B^(9/4)=N^0.45, and B^(5/4)=N^0.25. The current explicit campaign and
      target controls therefore miss both the campaign and fresh-query gates.
    - >-
      A supplied-tuple determinant or pair-wedge zero test is reproducible by
      a generic simulator using a constant number of group additions and one
      equality test on the admitted stratum. Coordinate syntax alone does not
      establish a non-simulable source locator.
    - >-
      Expected Theta(B) relation count does not imply Theta(B) independent
      rank. Without a deterministic rank guarantee or a rank-yield tail bound,
      rejected batches have unknown nonzero cost and no positive rank credit
      is allowed.
  speculation:
    - >-
      A coordinate-sensitive, target-dependent source locator outside the
      checked endpoint, determinant, compact-factor, and zero-minor interfaces
      may remain logically possible. No such operation or simulator
      separation is supplied here.
  proposed_test:
    name: repaired_explicit_operation_and_full_cost_admission_sheet
    result: completed_with_no_admissible_operation
    outcome_meaning:
      pass: >-
        An explicit operation would become an unfiled theorem candidate for
        independent review only; it would not constitute breakthrough
        evidence.
      fail: >-
        Record NO_ADMISSIBLE_OPERATION and spend no compute on this interface.

repaired_requirements:
  - id: requirement_1_explicit_semantically_distinct_operation
    name: explicit_operation_identity_provenance_and_occurrence_signed_output
    status: fail
    reason: >-
      No checked item supplies a new public operation with typed inputs,
      outputs, coefficient provenance, subset semantics, and exact signed
      occurrence output. Direct 3+3 matching is the known generic control;
      the determinant/pair-wedge form is a supplied-tuple predicate; the
      product/common-factor and zero-minor routes are excluded interfaces or
      unnamed oracles. An open exception is not an operation.
  - id: requirement_2_O1_GGM_simulator_exclusion
    name: exact_target_dependent_transcript_unavailable_to_constant_overhead_GGM
    status: fail_independently
    exact_target_dependent_transcript_claimed_nonreproducible_by_O1_GGM: null
    required_transcript_shape:
      relation_mode: >-
        (target occurrence j; signed factor occurrences
        (i_1,s_1),...,(i_5,s_5); public certificate
        sum_h s_h*A_(h,i_h)=R_j)
      fresh_mode: >-
        (fresh masked target tag; signed factor occurrences
        (i_1,s_1),...,(i_5,s_5); public certificate
        sum_h s_h*A_(h,i_h)=Q+[t]P)
    reason: >-
      The mandatory separation cannot be made because there is no candidate
      operation and hence no candidate output distribution or transcript to
      compare with a simulator. For a supplied tuple, the extant
      determinant/wedge zero bit is equivalent to a group-sum equality and
      is reproduced with O(1) generic group operations. The direct
      source-labelled match is itself generic. Merely reading coordinates or
      writing a target-dependent aggregate does not prove that a generic
      simulator cannot reproduce the locator's exact target-dependent output
      with O(1) overhead.
  - id: requirement_3_subset_stable_occurrence_replay
    name: exact_restricted_existence_and_deterministic_signed_source_replay
    status: fail_independently
    reason: >-
      No candidate provides an exact yes/no restricted-existence call on
      occurrence-labelled rectangular subsets while preserving duplicate
      labels, colours, signs, and exceptional strata. Supplying a residue,
      source, scalar, source dictionary, or B^3 provenance would assume the
      missing inverse and is rejected.
  - id: requirement_4_rank_yield_and_rejected_batch_charge
    name: deterministic_rank_or_rank_tail_with_full_retry_accounting
    status: fail_independently
    reason: >-
      The random-occupancy control predicts Theta(B) rows but supplies no
      deterministic rank guarantee and no lower tail for rank Theta(B) over
      the actual factor columns. Rank verification only detects a deficient
      batch. It does not pay for that batch or its replacement. Positive rank
      credit is therefore zero and the rank-rejection exponent is unknown,
      not zero.
  - id: requirement_5_restricted_replay_calls_and_live_state
    name: enumerate_and_charge_every_restricted_call_rebuild_and_state
    status: fail_independently
    reason: >-
      The conditional replay schedule below is fully enumerated, but no
      subset-stable operation supplies its calls or costs. No coefficient
      rebuild, restricted state, miss, or traversal frontier may be free.
  - id: requirement_6_fresh_scalar_blind_query
    name: complete_online_query_inside_B_to_5_over_4
    status: fail_independently
    reason: >-
      No admitted operation supplies the fresh masked-target source inverse.
      The current direct endpoint control costs B^(3+o(1))=N^(0.60+o(1)),
      strictly above B^(5/4+o(1))=N^(0.25+o(1)).
  - id: requirement_7_complete_threshold_and_baseline
    name: complete_lambda_and_mu_at_most_0_45
    status: fail_independently
    reason: >-
      The current explicit control has certifiable work exponent at least
      0.60 before rank-rejected batches are charged. Its materialized memory
      exponent is 0.60. Even an unproved 0.40 streaming state cannot repair
      0.60 work or the 0.60 fresh query. Unknown candidate exponents cannot be
      assigned zero.

