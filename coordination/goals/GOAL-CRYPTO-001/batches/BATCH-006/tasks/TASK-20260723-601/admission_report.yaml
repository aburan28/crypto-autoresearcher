falsification_and_outcome_map:
  explicit_operation_passes_all_requirements: >-
    The present no-operation disposition would be superseded only by an
    unfiled proposal requiring independent theorem review. No empirical or
    breakthrough conclusion would follow.
  explicit_operation_is_GGM_simulable_with_O1_overhead: >-
    It receives no non-generic advantage credit and fails admission.
  no_rank_tail_or_deterministic_rank: >-
    Set r=0, leave eta_rank unknown, charge every rejected batch, and fail
    admission.
  fresh_complete_online_exponent_above_0_25: >-
    Fail admission regardless of total lambda.
  lambda_or_mu_above_0_45: >-
    Fail admission. Values below 0.50 do not create a partial pass.
  hidden_payload_or_unnamed_locator: >-
    Reject semantically before cost scoring.
  present_checked_material: >-
    NO_ADMISSIBLE_OPERATION with requirement 1 as the first failure.

interpretation_limits:
  - No unrestricted arithmetic-circuit, cell-probe, GGM, kSUM, incidence, or ECDLP lower bound is proved.
  - The result does not close coordinate-sensitive operations outside the checked interfaces.
  - Expected random-occupancy relation count is not treated as observed rank.
  - No operation, experiment, proposal, evidence record, decision, or goal status is created or changed.
  - The literature and corpus checks support deduplication only; no novelty claim is made.

estimated_cost:
