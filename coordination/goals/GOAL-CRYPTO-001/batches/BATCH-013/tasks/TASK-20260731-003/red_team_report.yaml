  exact_supported_final_claim: >-
    Over the BATCH-013 finite checked-record set (ePrint 2024/1923; ePrint
    2026/280, 2026/106, 2026/1244; and the reaffirmed classical Semaev / Petit /
    Amadori–Pintore–Sala / McGuire–Mueller / Johari priors) plus prior cited
    CRYPTO route closures, no record is documented as both (a) a semantically
    new, falsifiable ordinary large-prime-order E(F_p) classical mechanism
    outside prior CRYPTO routes and (b) experiment-ready with complete cost /
    certificate interfaces and a fully charged matched Pollard-rho advantage.
    This is not exhaustive literature coverage, an impossibility theorem, a
    crypto-tier breakthrough, or authorization for curve work.

  receipt_verification:
    websearch_lists:
      claimed: 3
      recomputed: 3
      match: true
    websearch_displayed_items:
      claimed: 10
      recomputed: 10
      arithmetic: 3+3+4
      match: true
    crossref_requests:
