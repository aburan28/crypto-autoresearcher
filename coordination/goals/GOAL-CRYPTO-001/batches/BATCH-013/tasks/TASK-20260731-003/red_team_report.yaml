      arithmetic: 3+3+3+5+5+5
      note: >-
        Producer correctly treats Crossref total-results as broad ranking pools,
        not relevant-hit counts; many top bibliographic hits are off-topic.
    canonical_list_hashes:
      status: not_independently_rederived
      note: >-
        Analyst-normalized SHA-256 fields are present on each receipt list.
        Exact normalization convention was not re-derived here; hashes are
        treated as internal integrity labels, not raw provider-response proofs.
    independent_spot_checks:
      - >-
        ePrint 2024/1923 abstract confirms Petit / Momonari–Kudo analysis, a
        proposed "pseudo-index calculus" via summation polynomials, and an
        argument for absence of subexponential prime-field ECDLP methods in the
        present research background — not a falsifiable matched-rho gain.
      - >-
        ePrint 2026/280 abstract confirms quantum Shor resource/circuit work
        (~3.12n qubits), outside GOAL-CRYPTO-001 classical advantage criteria.
      - >-
        ePrint 2026/1244 abstract confirms distributed quantum ECDLP resource
        estimation (roughly ~856–1154 logical qubits/node depending on variant);
        classical relation/direct-solve mechanism is not claimed. Producer's
        "~1080–1140" paraphrase is approximate for one variant band and does
        not affect the out-of-scope disposition.
      - >-
        WebSearch lists re-surface already-screened classical Semaev-neighborhood
        priors without a new typed ordinary-prime-field gain fingerprint.

  discovery_verdict:
    result: FAIL_FOR_NEW_CAMPAIGN_CANDIDATE_IN_CHECKED_SET
    false_negative_risk: NONZERO_BUT_EXPLICITLY_BOUNDED
    assessment: >-
      Gate A correctly fails: 2024/1923 is a prior-route duplicate whose abstract
      argues against subexponential methods rather than stating a falsifiable
      asymptotic/concrete gain; 2026 quantum papers supply no classical
      factor-base / relation / direct-solve fingerprint; classical priors remain
      inside prior CRYPTO Semaev / prime-field IC coverage. Residual risk is
      unsearched databases, inaccessible primary fulltexts not re-ingested here,
      and future publications — all explicitly bounded by the producer.

  readiness_verdict:
    result: FAIL
    assessment: >-
      No checked record supplies oracle transcript, exact source replay,
      relation yield and independent rank, fresh scalar-blind descent or
      complete direct-solve cost, preprocessing/memory/traffic charging,
      certificate interfaces, and fully charged cost versus matched rho for a
      new target-scope candidate. Quantum resource metrics are not substitutes.

  objections:
    - id: RT20260731-001-O1
      severity: scope_guard
      category: finite_checked_set
      objection: >-
        FINAL_NO_CANDIDATE is supported only over the enumerated checked
        records and prior cited closures. Search/access false-negative risk
        remains nonzero.
      consequence: >-
        Do not promote the disposition to impossibility, exhaustive novelty, or
        cryptographic hardness evidence.
    - id: RT20260731-001-O2
      severity: minor
      category: receipt_provenance
      objection: >-
        Normalized WebSearch/Crossref list hashes prove analyst-record integrity
        at best, not fidelity to raw Cursor WebSearch provider internals (which
        remain hidden).
      consequence: >-
        Retain producer tool_limits wording; do not treat receipts as raw
        provider proofs.
    - id: RT20260731-001-O3
      severity: minor
      category: paraphrase_precision
      objection: >-
        The 2026/1244 qubit paraphrase (~1080–1140) is a coarse band relative
        to the abstract's variant-dependent ranges; it does not invent a
        classical candidate.
      consequence: Prefer quoting abstract ranges in any ledger archive summary.
    - id: RT20260731-001-O4
      severity: scope_guard
      category: goal_disposition
      objection: >-
        Budget exhaustion after maximum_batches=13 must not be archived as
        status=paused under DEC-20260730-004 / user policy.
      consequence: >-
        Keep GOAL-CRYPTO-001 active (no pause). Further batches require a later
        Coordinator budget amendment or an externally supplied formal mechanism.

  required_controls:
    - >-
      For any newly retrieved target-scope primary source, quote representation,
      relation/direct-solve predicate, target dependence, witness/source
      semantics, and named metric gain before semantic deduplication.
    - >-
      Compare fingerprints field-by-field against prior CRYPTO Semaev /
      dynamic-base / direct-solve / solver routes; do not collapse on "uses
      summation polynomials" alone.
    - >-
      Keep quantum Shor resource papers out of classical candidate admission
      unless a classical mechanism is explicitly typed.
    - >-
      If Discovery Gate A ever passes, require complete Gate B cost and
      certificate fields before any curve compute.

  counterexample_or_mutation: >-
    Zero-compute control: hold Semaev polynomials fixed but replace a reusable
    fixed factor base + many-relation LA with a challenge-dependent sampled base
    + one-dependency direct solve (Amadori–Pintore–Sala). If a future screen
    labels both identical without recording target dependence, source replay,
    and completion cost separately, Gate A has a false negative. That control
    is already inside prior CRYPTO routes and does not admit a BATCH-013
    candidate.

  baseline_comparison: >-
    Pollard rho was not beaten. No checked record demonstrates a fully charged
    matched-rho advantage on ordinary large-prime-order E(F_p). Quantum qubit /
    Toffoli estimates are outside the classical completion criteria.

  pollard_rho_beaten: false
