candidate_id: OBL-ZR-COMPACT-CONSTRUCTOR-001
title: Compact target-label common-factor construction obligation
candidate_class: representation
record_type: open_construction_obligation
novelty_status: known

claim: >-
  No genuinely new conjecture is supported by this review. The narrowest
  repository-open obligation is to exhibit, not assume, a target-independent
  compact representation that constructs the exact target-label support factor
  z_R(T)=gcd(g_I(T),r_R(T)) from two source-labelled dyadic pair-divisor trees
  for a fresh target R, with complete source replay, using at most
  B^(9/4+o(1)) preprocessing/advice/state and B^(5/4+o(1)) total online
  time/workspace when N=B^5. The obligation is unmet unless every target-
  dependent coefficient and every positive and negative replay query is
  explicitly constructed and charged.

mechanism: >-
  Distinct public fifth-occurrence labels are the roots of the squarefree
  polynomial g_I. Componentwise, the complete-chart intersection resultant
  r_R vanishes at a label exactly when that fifth occurrence extends to a
  labelled pair-pair relation, so z_R is the exact support polynomial for
  extendible labels. A nontrivial z_R would permit dyadic self-reduction to one
  labelled source tuple. The unresolved step is input construction: standard
  component resultants, quotient-ring resultants, split norms, multipoint
  evaluation, modular composition, power projection, subresultants, and
  displacement representations expose Theta(B^3) target-dependent scalar
  coordinates or assume r_R has already been supplied. A qualifying
  representation must act on the compact pair-product generators without
  importing that represented payload, source advice, or scalar orientation.

assumptions:
  - >-
    The academic asymptotic model is a generic ordinary prime-field elliptic
    curve family with a public prime-order subgroup of order N=p^(1+o(1));
    this task does not instantiate any standardized curve or target.
  - N=B^5 and each of five signed, coloured, source-labelled decks has Theta(B) occurrences.
  - >-
    The complete signed projective group-law chart, occurrence multiplicities,
    infinity, tangent, vertical, repeated, and nonreduced strata are retained.
  - >-
    Fresh targets are absent from preprocessing, advice, random seeds, caches,
    pointers, and fitted coefficients.
  - >-
    The favourable constant relation-density and independent-rank assumptions
    are hypotheses to be proved separately, not facts granted to the
    constructor.
  - >-
    Polylogarithmic factors and one constant-degree field extension do not
    change exponents, but their bit costs remain chargeable in any successor.

asymptotic_obligations:
  parameterization:
    subgroup_order: N
    deck_size: B=N^(1/5)
    pollard_rho_reference: N^(1/2+o(1))=B^(5/2+o(1))
  constructor:
    preprocessing_time_max: B^(9/4+o(1))
    retained_advice_max: B^(9/4+o(1))
    retained_state_max: B^(9/4+o(1))
    fresh_target_total_online_time_max: B^(5/4+o(1))
    fresh_target_peak_workspace_max: B^(5/4+o(1))
    replay: >-
      Include every O(log B) positive and negative dyadic restriction query
      and final exact source verification inside the online cap.
    forbidden_unpriced_payloads:
      - a represented degree-B^2 target coefficient vector
      - Theta(B^3) translated pair endpoints or quotient coordinates
      - supplied resultant, residue, common factor, source tuple, or scalar character
      - target-fitted selectors or post-hoc successful branches
  conditional_complete_path:
    relation_campaign_time_max: B^(9/4+o(1))=N^(0.45+o(1))
    factor_log_algebra_max: B^(2+o(1))=N^(0.40+o(1))
    masked_descent_time_max: B^(5/4+o(1))=N^(0.25+o(1))
    total_time_exponent_max: 0.45
    total_memory_exponent_max: 0.40
    still_required:
      - constant verified relation and masked-target success probabilities
      - Theta(B) independent relation rows
      - verified factor-log completion
      - identical scalar-blind masked descent
      - output, retry, ambiguity, verification, bit-time, and bit-memory costs

