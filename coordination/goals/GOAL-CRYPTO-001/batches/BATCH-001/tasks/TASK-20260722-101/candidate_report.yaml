harmless_toy_gate:
  first_gate: theorem_only_typed_dependency_audit
  design: >-
    Require a finite list of representation objects and update maps for one
    fresh symbolic target. For every map, prove its input size, output size,
    gauge invariance, complete-chart semantics, and recurrence cost. Expand
    only the dependency graph, not an elliptic-curve solver. The gate passes
    only if z_R or exact dyadic unit products are derived without a whole-
    divisor translation macro, a represented B^3 payload, supplied source
    factors, or target-dependent advice.
  controls:
    - >-
      Supplied-residue positive control: once r_R mod g_I is supplied, fast
      gcd and label extraction should cost B^(1+o(1)); this isolates output
      extraction from input construction.
    - >-
      Componentwise negative control: B degree-B^2 translated tests should
      expose B^(3+o(1)) work.
    - >-
      No-relation unit control: z_R=1 and no dynamic zero-divisor split may be
      credited.
    - >-
      Single-hit control: z_R is one linear label factor and replay returns
      exactly one public labelled tuple.
    - >-
      Collision and exceptional-strata control: repeated endpoints, tangent,
      vertical, identity, infinity, and nonreduced intersections may change
      multiplicity but not fifth-label support.
    - >-
      Fresh-target mutation: replace the public symbolic target after
      preprocessing; all target-trained coefficients and caches must fail the
      accounting gate.
  required_metrics:
    - typed_gate_count
    - target_dependent_materialized_coordinates
    - fresh_target_online_exponent_in_B
    - support_symmetric_difference
    - labelled_source_replay_error_rate
  outcome_interpretation:
    passing_theorem_gate: >-
      A mechanism-distinct representation may exist and can proceed to
      independent review and, only afterward, a public toy semantic check.
      Passing is not evidence of an ECDLP advantage.
    expansion_or_untyped_macro_found: >-
      The construction merges into the screened P1513/P1551/P1516 routes; no
      toy run or larger study is warranted.
    semantics_fail: >-
      The construction is falsified even if its operation count is low.
    cost_pass_but_complete_path_fail: >-
      Record a representation result only; do not infer an advantage over the
      generic reference.
  optional_toy_after_theorem_pass:
    maximum_group_order_bits: 32
    instance: >-
      A fully public synthetic finite abelian group or non-standard educational
      curve with enumerated source labels and no hidden scalar, real key, or
      deployed-system data.
    test: >-
      Compare the proposed support factor and replayed labels with exhaustive
      public enumeration on no-hit, one-hit, collision, and repeated-source
      cases. Record exact operation counts; do not extrapolate timings.
  estimated_cost:
    theorem_check:
      implementation: low
      compute: none
      wall_clock: hours_not_days
    optional_toy:
      implementation: low
      compute: low
      maximum_instances: 20

falsification_conditions:
  - The proposed operation is Query2P1, PCZT-E, or whole-divisor translation renamed without typed construction maps.
  - Any target-dependent advice, scalar residue, source tuple, resultant term, or common factor is supplied rather than constructed.
  - The exact support biconditional fails on any identity, infinity, tangent, vertical, collision, repeated, or nonreduced stratum.
  - The construction materializes or traverses Theta(B^3) target-dependent coordinates in its stated access model.
  - Total fresh-target work or peak workspace, including all replay calls, exceeds B^(5/4+o(1)).
  - Setup, advice, or retained state exceeds B^(9/4+o(1)).
  - Gauge-equivalent elliptic-net or coordinate presentations change the returned support.
  - The same operation cannot be used for a fresh scalar-blind masked target.
  - The claimed complete exponent relies on unproved density, independent rank, factor logs, or descent as if they were established.

confounders:
  - A degree-B output does not imply a sub-B^3 constructor.
  - Low displacement rank of an already represented matrix does not price construction of its target update.
  - Fast term evaluation in an elliptic net is not orbit-index location or zero-label reporting.
  - A toy low operation count can be caused by tiny-field collisions, special deck structure, or accidental empty support.
  - Polylogarithmic field operations can hide nontrivial log(p) bit and memory factors.
  - Successful known-log relation queries do not establish identical scalar-blind descent.
  - Relation count does not establish independent matrix rank or factor-log completion.
  - Failure of named algorithms is not a circuit, data-structure, generic-group, or coordinate lower bound.

interpretation_limits:
  - This record preserves an existing open construction obligation; it proposes no new algorithm.
  - The theorem gate can reject a representation but cannot prove all compact representations impossible.
  - A public toy check of at most 32 bits tests semantics and accounting only, never cryptographic scaling.
  - The conditional 0.45 time exponent is not achieved until every missing complete-path obligation is proved and independently reviewed.
  - The Pollard-rho comparison is asymptotic and academic only; no implementation or operational procedure is specified.
  - No proposal, identity, or toy result is evidence of a breakthrough.

