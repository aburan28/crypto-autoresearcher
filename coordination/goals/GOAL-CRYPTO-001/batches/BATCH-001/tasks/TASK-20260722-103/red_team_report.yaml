  reconstruction:
    parameterization:
      subgroup_order: N
      deck_size: B=N^(1/5)
      source_tuple_count: B^5=N
    exact_object_claim: >-
      Distinct fifth-occurrence labels are roots of squarefree g_I. The asserted
      complete-chart resultant r_R vanishes at a label exactly when that
      occurrence extends to a signed coloured five-source relation, so
      z_R=gcd(g_I,r_R) is the extendible-label support. Restricted versions of
      this predicate are then used adaptively to replay one exact labelled
      source tuple.
    time_arithmetic:
      pollard_rho: N^(1/2+o(1))=B^(5/2+o(1))
      constructor_preprocessing_cap: B^(9/4+o(1))=N^(0.45+o(1))
      per_target_cap: B^(5/4+o(1))=N^(0.25+o(1))
      B_relation_queries: B*B^(5/4+o(1))=B^(9/4+o(1))=N^(0.45+o(1))
      factor_log_algebra_if_dimension_Theta_B: B^(2+o(1))=N^(0.40+o(1))
      one_masked_descent: B^(5/4+o(1))=N^(0.25+o(1))
      conditional_total_time: B^(9/4+o(1))=N^(0.45+o(1))
      assessment: >-
        The maximum-exponent time arithmetic is correct as a budget identity,
        but it is not an achieved algorithmic exponent because its constructor,
        success, rank, factor-log completion, and blind descent premises are
        all unproved.
    memory_arithmetic:
      allowed_retained_advice_or_state: B^(9/4+o(1))=N^(0.45+o(1))
      asserted_conditional_memory: B^(2+o(1))=N^(0.40+o(1))
      assessment: >-
        The asserted 0.40 memory exponent is undercharged. The obligation itself
        permits retained advice/state of exponent 0.45. A 0.40 claim requires a
        separate B^(2+o(1)) retained-state cap; otherwise the honest conditional
        memory bound is at most 0.45, not 0.40.

  objections:
    - id: RT103-O1
      severity: blocking_before_constructor_review
      topic: exact_semantics_and_oracle_definition
      objection: >-
        The reviewed snapshot states but does not self-containedly define or
        prove the load-bearing biconditional r_R(t_a)=0 iff label a extends to a
        valid relation. "Complete-chart intersection resultant" is an untyped
        macro here. Projective closure, saturation, resultants at infinity,
        repeated roots, and nonreduced fibers can add or remove support. The
        obligation is therefore not yet scoped tightly enough to distinguish a
        compact constructor from construction of the wrong support object.
      cheapest_discriminator: >-
        Require exact rings, chart/saturation conventions, occurrence-label
        maps, and a stratum-complete support proof before accepting any cost
        argument.
      narrow_conclusion: >-
        This is a missing self-contained premise, not evidence that the support
        identity is false.

    - id: RT103-O2
      severity: blocking_for_subgeneric_claim
      topic: generic_preprocessing_oracle
      objection: >-
        The desired rectangle itself proves that a passing constructor cannot
        be generic-group simulable. With generic advice S=B^(9/4) and
        constant-success online time T=B^(5/4), S*T^2=B^(19/4), which is
        polynomially below N=B^5 and conflicts with the generic preprocessing
        tradeoff up to polylogarithmic factors. The proposed theorem gate asks
        for gauge invariance but does not make this generic-simulability test an
        explicit first gate.
      cheapest_discriminator: >-
        Erase concrete coordinates and retain only random group encodings,
        group operation, equality, and the same preprocessing interface. If the
        claimed update still typechecks, reject it at the generic preprocessing
        bound. A survivor must identify and charge a specific non-generic
        coordinate operation.
      narrow_conclusion: >-
        Generic implementations of the requested oracle are excluded; explicit
        non-generic finite-field constructors remain logically open.

    - id: RT103-O3
      severity: major_accounting_error
      topic: retained_memory
      objection: >-
        The report simultaneously permits B^(9/4) retained advice/state and
        claims total memory B^2. These are inconsistent exponents. Peak online
        workspace B^(5/4) does not erase retained preprocessing state.
      cheapest_discriminator: >-
        Add a per-object live-memory ledger and take the maximum over retained
        advice, resident indices, relation storage, linear algebra, and online
        workspace.
      narrow_conclusion: >-
        The conditional time ceiling can remain 0.45, but memory is 0.45 unless
        retained state is separately proved to be B^(2+o(1)).

    - id: RT103-O4
      severity: blocking_for_complete_path
      topic: relation_density
      objection: >-
        B^5=N candidate tuples give expected representation count one only
        under a uniform-endpoint heuristic; they do not imply constant hit
        probability. Structured decks can concentrate many tuples on few
        targets, so E[X]=Theta(1) is compatible with Pr[X>0]=o(1). A
        B^(-delta) hit probability adds B^delta to relation and descent work.
      cheapest_discriminator: >-
        Prove a target-uniform support-size or second-moment bound for the exact
        signed coloured deck distribution, including repeated and exceptional
        strata.
      narrow_conclusion: >-
        Constant density is an explicit unproved hypothesis, not a consequence
        of tuple counting.

    - id: RT103-O5
      severity: blocking_for_complete_path
      topic: independent_rank_and_factor_logs
      objection: >-
        Theta(B) valid rows do not imply Theta(B) independent rows. Colouring,
        signs, duplicated points, and concentrated support can create structural
        nullspaces. The B^2 sparse-linear-algebra term is plausible only after
        the matrix dimension, row distribution, oversampling, modulus, and rank
        success probability are fixed.
      cheapest_discriminator: >-
        State the exact relation matrix and prove a rank-success bound after
        column identification and sign/colour normalization; charge rejected
        rows and oversampling.
      narrow_conclusion: >-
        B^(2+o(1)) is a conditional solver cost, not evidence of factor-log
        completion.

    - id: RT103-O6
      severity: blocking_for_complete_path
      topic: source_recovery
      objection: >-
        z_R reports fifth-label support, not by itself the other four labelled
        sources. The claimed O(log B) dyadic replay is valid only if every
        restricted predicate is constructed from the same compact input,
        remains biconditional after previous choices, and handles cancellation,
        multiplicity, and all exceptional strata. Treating restricted residues
        or parent pointers as pre-existing would reintroduce the forbidden
        source oracle.
      cheapest_discriminator: >-
        Expand one full positive and negative replay transcript symbolically and
        list the constructor input, output, target dependence, and live state of
        every restriction call.
      narrow_conclusion: >-
        Exact replay is correctly recognized as an obligation but is not
        discharged by the support-factor identity.

    - id: RT103-O7
      severity: blocking_for_complete_path
      topic: blind_target_descent
      objection: >-
        Known-log relation targets and a masked target of unknown logarithm are
        not interchangeable unless the exact same constructor, retained state,
        and success analysis are scalar blind. A hidden character, target-fitted
        coefficient, successful-branch cache, or known-scalar orientation would
        make the relation campaign irrelevant to descent.
      cheapest_discriminator: >-
        Require an identical-code theorem for a fresh uniformly blinded target,
        with no target in advice and with all failed masks and final unmasking
        verification charged.
      narrow_conclusion: >-
        The 0.25 descent term is conditional and cannot be inferred from
        known-target relation collection.

    - id: RT103-O8
      severity: scope_correction
      topic: novelty_and_source_completeness
      objection: >-
        The internal "known" classification is well supported: the finding
        already records the P1513 common-factor locator, P1515 source router,
        and P1551/P1552 coefficient/source-unranking interface. External source
        completeness is not established. The corpus contains 41 indexed
        entries, most frontier claims are reported rather than primary-source
        rederived, one citation is explicitly unverified, and the producer gives
        no reproducible database/query/inclusion protocol for the six-source
        external check.
      cheapest_discriminator: >-
        Keep novelty scoped to internal deduplication and "no checked source";
        require a reproducible primary-source search protocol only if external
        novelty is later claimed.
      narrow_conclusion: >-
        No new conjecture appears in this package, but absence of a construction
        in the checked corpus is neither external novelty nor impossibility.

    - id: RT103-O9
      severity: gate_ordering
      topic: proposed_theorem_only_gate
      objection: >-
        A full typed theorem audit is appropriate only after an explicit
        constructor identity exists. At present there is no theorem candidate,
        recurrence, or data structure to audit; repeatedly studying the naked
        existence obligation risks spending capacity on a renamed oracle.
      cheapest_discriminator: >-
        Use a one-page constructor-admission gate first: exact object and
        semantic proof reference, one explicit target-update identity, object
        dimensions, non-genericity witness, and first cost recurrence. Absence
        of any one item returns NO_ADMISSIBLE_CONSTRUCTION without a full audit.
      narrow_conclusion: >-
        The theorem-only principle survives, but its first stage should be
        cheaper and should reject oracle restatements before proof review.

  required_controls:
    - id: RT103-C1
      control: self_contained_support_biconditional
      requirement: >-
        Define g_I, r_R, z_R, all source occurrence maps, projective charts,
        saturations, multiplicities, and exceptional strata, then prove exact
        extendible-label support.
    - id: RT103-C2
      control: generic_encoding_erasure
      requirement: >-
        Demonstrate that the proposed operation fails generic-group simulation
        for a named, costed finite-field reason; otherwise apply the generic
        S*T^2 preprocessing bound.
    - id: RT103-C3
      control: supplied_residue_positive_control
      requirement: >-
        When r_R mod g_I is supplied, gcd, label extraction, and one replay
        output must be quasi-linear in B; this isolates extraction from
        construction.
    - id: RT103-C4
      control: represented_payload_negative_control
      requirement: >-
        Explicit component, quotient, norm, or translated-endpoint routes must
        expose their B^3 target-dependent coordinate traffic and may not be
        charged as unit-cost macros.
    - id: RT103-C5
      control: full_live_memory_ledger
      requirement: >-
        Report retained advice/state separately from peak online workspace and
        correct the claimed memory exponent.
    - id: RT103-C6
      control: exact_replay_transcript
      requirement: >-
        Include every positive and negative restricted query, final signed
        source verification, no-hit, one-hit, repeated-occurrence, collision,
        tangent, vertical, identity, infinity, and nonreduced cases.
    - id: RT103-C7
      control: density_and_rank_proofs
      requirement: >-
        Prove constant target hit probability by support/second-moment analysis
        and independently prove enough rank after all column identifications.
    - id: RT103-C8
      control: scalar_blind_masked_descent
      requirement: >-
        Use identical code and advice for a fresh blinded unknown target, charge
        retries, ambiguity, unmasking, and verification, and forbid scalar
        orientation or target-fitted state.

  counterexample_or_mutation:
    name: generic_encoding_erasure
    cost: zero_compute_static_type_check
    procedure: >-
      Replace every concrete point coordinate by a random generic label while
      retaining group operation, equality, public preprocessing, and the
      claimed API. If the constructor still typechecks, its requested
      S=B^(9/4), T=B^(5/4), constant-success rectangle has
      S*T^2=B^(19/4)<B^5=N and is excluded in the generic preprocessing model.
      A valid survivor must point to the exact coordinate-sensitive operation
      that breaks this simulation and include its construction cost.
    interpretation: >-
      Passing this mutation does not prove a fast constructor; failing it
      cheaply rejects a generic oracle restatement.

  baseline_comparison:
    regime: N=B^5
    pollard_rho:
      work: B^(5/2+o(1))=N^(1/2+o(1))
      memory: asymptotically_small_serial_or_distinguished_point_tradeoff
      assessment: >-
        This is the correct generic work baseline. Any wall-clock comparison
        must also match processors and memory traffic.
    baby_step_giant_step:
      work: B^(5/2+o(1))=N^(1/2+o(1))
      memory: B^(5/2+o(1))=N^(1/2+o(1))
      assessment: >-
        It matches the square-root work exponent but is a much heavier memory
        baseline than rho.
    generic_preprocessing:
      tradeoff: S*T^2=Omega_tilde(N)
      at_S_B_9_over_4: T=Omega_tilde(B^(11/8))=Omega_tilde(N^(0.275))
      desired_T: B^(5/4)=N^(0.25)
      assessment: >-
        The desired query exponent requires a genuinely non-generic operation;
        it cannot come only from group operations plus advice at the stated cap.
    closest_specialized_baseline:
      name: source_reporting_five_sum_or_k_equals_6_indexing_with_B_known_targets
      explicit_split_controls:
        two_plus_three: state_B2_query_B3
        three_plus_two: state_B3_query_B2
        four_plus_one: state_B4_query_B1
        balanced_campaign_with_targets_as_sixth_colour: B3_total_work
      published_indexing_control: >-
        The reviewed corpus records Dinur-Golovnev k=6 indexing with
        S=soft-O(B^(5.5-delta)), T=soft-O(B^delta), and soft-O(B^5)
        preprocessing; its most favorable recorded setup exponent is 4.5. In
        the asymmetric B^2/B^3 form, imposing query exponent at most 1.25
        leaves setup exponent at least 4.75.
      assessment: >-
        All checked positive algorithms miss the B^2.25 setup and B^1.25 query
        rectangle by polynomial factors. This comparison is not a lower bound
        against an unclassified nonlinear finite-field representation.
    proposed_path:
      conditional_time: B^(9/4+o(1))=N^(0.45+o(1))
      corrected_conditional_memory: at_most_B^(9/4+o(1))=N^(0.45+o(1))
      status: budget_rectangle_only_not_an_algorithm

  surviving_uncertainty:
    primary: >-
      Whether there exists one explicit, target-independent, coordinate-sensitive
      non-generic representation that constructs the exact all-strata
      extendible-label predicate or z_R from compact source-labelled pair data,
      supports exact adaptive replay, uses retained state at most B^(9/4+o(1)),
      and uses total fresh-target work/workspace at most B^(5/4+o(1)), without a
      supplied residue, factor, source, scalar orientation, or B^3 represented
      payload.
    downstream_if_primary_is_met:
      - constant target hit probability for the exact structured decks
      - Theta(B) independent relation rank and verified factor-log completion
      - identical scalar-blind masked descent with constant success
      - fully charged bit time, memory, output, retry, and verification costs

  recommended_next_gate:
    name: stage_zero_constructor_admission_and_genericity_gate
    type: theorem_only_zero_compute
    pass_requirements:
      - a self-contained exact definition and support proof for r_R and z_R
      - one explicit compact fresh-target update identity or recurrence
      - dimensions and target dependence for every input, state, and output
      - a generic-encoding-erasure analysis naming the non-generic operation
      - initial time and live-memory recurrences with no supplied forbidden payload
    fail_condition: >-
      If any item is absent or represented by a whole-divisor, resultant,
      common-factor, source, coefficient, or scalar oracle, record
      NO_ADMISSIBLE_CONSTRUCTION and do not run a full theorem audit or toy
      check.
    interpretation: >-
      A pass only admits a concrete theorem candidate. It is not evidence for
      density, rank, descent, an ECDLP advantage, or impossibility.

  narrowest_supported_statement: >-
    The producer correctly found no new conjecture in its package and correctly
    preserved an internally known construction interface rather than claiming
    impossibility. Standard represented-resultant, explicit split, current
    indexing, and supplied-residue routes do not meet the stated rectangle in
    the reviewed corpus. The N^0.45 time figure is only correct conditional
    arithmetic; no constructor or complete path exists, and the stated N^0.40
    memory figure must be corrected to N^0.45 unless retained state is tightened.

  scope_limits:
    - No arithmetic-circuit, Boolean-circuit, word-RAM, cell-probe, coordinate, or ECDLP impossibility theorem is established.
    - Absence from the checked internal and external sources is not proof of absence and is not external novelty.
    - The standard-route B^3 screens do not exclude an unclassified nonlinear compact representation.
    - The generic preprocessing objection applies only if the alleged operation is generic-group simulable.
    - No relation density, rank, factor-log completion, blind descent, or cryptographic-size advantage has been demonstrated.
    - TASK-20260722-102 and its repair affect provenance only, never the mathematical conclusion.

  next_concrete_action: >-
    Require one successor constructor-admission sheet satisfying the five
    stage-zero pass requirements; if none is supplied, record no admissible
    construction for this batch and rerank without a theorem audit or run.

  verdict: >-
    scoped_open_obligation_survives__no_new_conjecture__conditional_time_arithmetic_only__memory_exponent_undercharged__stage_zero_semantics_and_nongenericity_gate_required

  safety_scope:
    classification: non_operational_academic_mathematics
    permitted:
      - symbolic definition and theorem review
      - asymptotic time and memory accounting
      - generic-model and source-reporting baseline comparison
    prohibited:
      - key-recovery software
      - targeting any real key, user, service, or deployed system
      - execution on standardized cryptographic curves
      - cryptographic-scale relation collection or scalar recovery
      - operational instructions for compromising cryptography

