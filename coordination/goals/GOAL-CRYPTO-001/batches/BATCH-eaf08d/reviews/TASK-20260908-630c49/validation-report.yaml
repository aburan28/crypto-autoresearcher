    provenance: internal
    impact_scope: This is a receipt-integrity acceptance gap in the pinned validator. It requires a registered hash-pinned
      original to exercise the new duplicate-process exception. The two actual assigned RELN source records passed
      preservation and binding checks; these fixtures do not demonstrate corruption of those records, process liveness,
      or a mathematical error.
    origin_scope: The new extractor contains the textual-key comparison; the ordinary IdentityLoader has the same
      pre-existing limitation. The review does not attribute all forms of this issue to the maintenance commit.
    recommended_repair: Coordinator-authorized additive correction should enforce semantic key uniqueness under
      the actual safe YAML construction rules, or constrain this narrowly supported duplicate-process recovery to
      string-tagged mapping keys. Independently reject aliases/merges/non-scalar keys and retain exact two-process/source-order
      and hash/path checks. Cover the ordinary parser too if asserting ordinary rejection of every duplicate. Preserve
      current source snapshots and require fresh scoped validation.
