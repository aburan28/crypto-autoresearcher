idea:
  id: IDEA-20260723-002
  title: Defect-scaled hyperplane-signature zero-minor cost gate
  class: algorithm
  claim: >-
    The published defect-scaled hyperplane-signature zero-minor search is a
    mechanism-distinct direct academic ECDLP route, but under its published
    success model q(N,L,d)=1-(1-1/N)^M with
    M=binom(L+d,d), and under its explicit signature enumeration with
    H=binom(L+d,d-1), its expected charged work is
    Omega(N*d/(L+1))=N^(1-o(1)), not below Pollard rho. It survives this gate
    only if a proof exhibits an elliptic central-subarrangement bias or an
    implicit exact locator strong enough to give constant success with total
    target-dependent work N^(1/2-epsilon) for some fixed epsilon>0.
  mechanism: >-
    From O(log N) public sampled curve points, form the Riemann-Roch
    evaluation matrix and its left kernel. After one dimension-halving
    restriction, a defect-d choice determines a d-dimensional intersection
    space. Remaining columns induce d-coordinate hyperplane signatures;
    duplicate normalized penultimate-intersection signatures certify a
    central subarrangement, hence a zero minor and a directly verifiable
    scalar relation. Concrete curve-coordinate evaluation is the named
    non-generic operation. The proposed discriminator couples the mechanism's
    own success law to the number of signatures that must be constructed.
  novelty_status: known
  assumptions:
    - >-
      N is the order of an abstract prime-order ordinary prime-field
      elliptic-curve family and L=Theta(log N); no standardized curve is
      instantiated.
    - >-
      The zero-minor-to-scalar certificate and all dimension/general-position
      premises are checked independently rather than inferred from a hash
      collision.
    - >-
      The manuscript's displayed success law is treated as a hypothesis to
      audit, not as an established asymptotic theorem.
    - >-
      Constructing or examining one distinct normalized signature costs at
      least one field operation or memory access; Gray-code and rank-one
      updates may reduce polylogarithmic factors but not erase entries.
    - >-
      Base-field operations and elliptic-curve group operations have
      poly(log N) bit costs, so polynomial logarithmic conversion factors do
      not change the compared N-exponents.
  predictions:
    - metric: charged_expected_work_exponent_in_N
      direction: lower
      minimum_effect: strictly_below_0.5
      meaning_if_met: >-
        The mechanism survives the Pollard-rho asymptotic gate and warrants a
        fuller independent theorem audit.
      meaning_if_not_met: >-
        The mechanism has no asymptotic advantage over matched rho; equality
        at 0.5 is also insufficient for this goal.
    - metric: central_subarrangement_bias_ratio_qN_over_M
      direction: higher
      minimum_effect: N^(1/2+epsilon)_for_some_fixed_epsilon_greater_than_0
      meaning_if_met: >-
        Elliptic evaluation matrices concentrate useful central arrangements
        far beyond the manuscript's approximately M/N occupancy model, enough
        in principle to offset explicit candidate work.
      meaning_if_not_met: >-
        The probability/work cancellation forces N^(1-o(1)) expected work.
    - metric: exact_signature_entries_processed_per_verified_success
      direction: lower
      minimum_effect: N^(1/2-epsilon)_for_some_fixed_epsilon_greater_than_0
      meaning_if_met: >-
        A nonenumerative exact locator, rather than a full hashtable scan, has
        been supplied and costed.
      meaning_if_not_met: >-
        The duplicate-search stage alone cannot beat rho.
    - metric: zero_minor_certificate_reverification_failures
      direction: lower
      minimum_effect: exactly_0
      meaning_if_met: >-
        Every accepted duplicate reconstructs a genuine zero minor and the
        final public group equality verifies.
      meaning_if_not_met: >-
        Hash collision, general-position failure, or index-union ambiguity
        invalidates the mechanism independently of cost.
  minimal_test:
    design: >-
      Perform a zero-compute static audit of the 2026 manuscript. Reconstruct
      the exact candidate counts
      M=binom(L+d,d) and H=binom(L+d,d-1)=M*d/(L+1), the success bound q for
      the number of signatures actually processed, and the complete stopping
      rule. Charge failed outer restrictions, every defect choice, signature
      construction, duplicate storage or streaming, reconstruction, and final
      verification. The gate passes only if a proved dependence specific to
      elliptic evaluation matrices yields both constant success and total
      target-dependent work N^(1/2-epsilon); an empirical small-field trend or
      the phrase "polynomial for fixed d" does not pass.
    controls:
      - >-
        Random-matrix control: replace the elliptic evaluation kernel by a
        matched random full-rank matrix and verify that candidate success is
        bounded by its enumerated mass over N.
      - >-
        Planted-central-arrangement positive control: confirm that the
        signature and index-union logic reconstructs a supplied singular
        subarrangement without crediting the planting cost.
      - >-
        Generic-encoding erasure: erase curve coordinates. Matrix construction
        must cease to typecheck, identifying the non-generic step; signature
        search after a supplied matrix is ordinary linear algebra.
      - >-
        Early-stop and Gray-code control: allow optimal ordering, rank-one
        kernel updates, and streaming, but count every processed candidate and
        all failed trials.
      - >-
        Hash control: distinguish equality of normalized signatures from
        collision of finite hashes, and reverify the recovered zero minor
        exactly.
      - >-
        P1539 and z_R removal controls: reject any repair that replaces the
        explicit signature search by an unpriced nonlinear zero-minor oracle,
        target-label common factor, source dictionary, or supplied witness.
    required_metrics:
      - M_candidate_completions
      - H_penultimate_signatures
      - success_probability_per_processed_signature
      - expected_failed_outer_trials
      - charged_expected_field_operations
      - charged_expected_group_operations
      - peak_live_field_elements
      - zero_minor_certificate_reverification_failures
  falsification_conditions:
    - >-
      The zero-minor-to-scalar implication, dimension-halving step, signature
      equality implication, or index-union reconstruction fails on any
      admitted stratum.
    - >-
      The audited success probability is at most
      N^o(1)*M/N while at least H=M*d/(L+1) signatures are processed per
      corresponding trial.
    - >-
      Constant success requires d=Theta(L) and an explicit table or stream of
      N^(1-o(1)) signatures.
    - >-
      Fixed d keeps per-trial work poly(log N) but makes the expected number
      of target-dependent trials N^(1-o(1)).
    - >-
      Any proposed repair attains its gain only through uncharged processors,
      target-dependent preprocessing, a supplied zero minor, a secret scalar
      in the search path, or an implicit zero-minor locator.
    - >-
      The complete expected work exponent is at least 0.5 after matrix
      construction, failed trials, memory traffic, reconstruction, and
      verification are charged.
  confounders:
    - >-
      Polynomial time in L for fixed d does not imply polynomial time in the
      input bit length when the success requirement forces d to grow with L.
    - >-
      The manuscript's scalar-based simulation estimates success but is not
      the public search algorithm; simulation speed is not attack cost.
    - >-
      Parallel wall clock can fall while total work and memory traffic remain
      at or above the rho baseline.
    - >-
      A short Riemann-Roch matrix does not imply that one useful zero minor can
      be located in poly(log N) work.
    - >-
      Duplicate hashes can be false positives; exact normalized-vector and
      determinant checks are mandatory.
    - >-
      Small-field fitted defect values do not establish the asymptotic
      defect-success relation.
  interpretation_limits:
    - >-
      This is a literature-derived cost-audit proposal, not a new ECDLP
      algorithm or a claim that the cited papers are incorrect in every scope.
    - >-
      The N^(1-o(1)) prediction is conditional on the manuscript's displayed
      occupancy law and explicit enumeration interface; a proved
      superuniform elliptic bias remains logically open.
    - >-
      A static pass would only justify deeper theorem review. It would not
      justify implementation, standardized-curve execution, or a
      cryptographic-scale claim.
    - >-
      Failure closes only this defect/signature interface, not all nonlinear
      zero-minor locators or all non-generic ECDLP representations.
  estimated_cost:
    implementation: low
    compute: low
    detail: zero_compute_static_derivation_hours_not_days
  recommended_priority: high

charged_cost_model:
  asymptotic_regime:
    subgroup_order: N
    input_bits: n=ceil(log2(N))
    reduced_matrix_dimension: L=Theta(n)
    defect: 1<=d<=L
    candidate_mass: M=binom(L+d,d)
    signature_mass: H=binom(L+d,d-1)=M*d/(L+1)
  target_dependent_setup:
    sampled_point_generation: O(n)_scalar_multiplications_or_O(n^2)_group_additions
    evaluation_matrix_construction: n^O(1)_base_field_operations
    initial_left_kernel_and_reductions: n^O(1)_base_field_operations
    assessment: N^o(1)_work_and_memory_per_outer_trial
    amortization: none_across_fresh_targets_because_the_matrix_contains_the_challenge
  signature_search:
    explicit_work_lower_bound_per_corresponding_trial: Omega(H)_field_operations_or_memory_accesses
    manuscript_style_upper_bound: >-
      O_tilde(binom(L,d)*H*poly(L,d)) base-field operations, before
      failed outer restrictions; incremental kernels may reduce only the
      polynomial factor.
    explicit_memory: O(H*d)_field_elements_for_the_published_hashtable
    streaming_memory: poly(L,d)_possible_but_does_not_remove_candidate_work
  success_and_retries:
    published_model: q=1-(1-1/N)^M<=min(1,M/N)
    expected_signature_work_lower_bound: >-
      H/q >= N*d/(L+1) when M<=N; when M>=N,
      H>=N*d/(L+1). Thus the bound is N^(1-o(1)) for every d>=1.
    fixed_defect_branch: >-
      M and H are poly(log N), but expected target-dependent retries are
      N^(1-o(1)).
    growing_defect_branch: >-
      Constant modeled success forces M=Omega(N); then d=Theta(L) and
      H=Theta(N), giving linear-scale work and memory for the published table.
  reconstruction_and_verification:
    zero_minor_reconstruction: poly(log N)_field_operations
    final_public_group_equality: O(log N)_group_operations
    certificate_requirement: exact_zero_minor_and_scalar_relation_reverified
  absent_stages:
    relation_collection: not_applicable_direct_solver
    factor_base_linear_algebra: not_applicable_direct_solver
    factor_log_completion: not_applicable_direct_solver
    descent: not_applicable_direct_solver
  pollard_rho_comparison:
    matched_reference_work: N^(1/2+o(1))_group_operations
    matched_reference_memory: small_serial_memory_or_distinguished_point_tradeoff
    candidate_work_under_published_model: N^(1-o(1))_base_field_operations
    bit_complexity_note: >-
      Group and field operations each have poly(log N) bit cost in the
      abstract family, so the exponent gap 1 versus 1/2 survives bit-cost
      conversion.
    assessment: >-
      The published occupancy-plus-enumeration model is asymptotically worse
      than Pollard rho. Only a proved superuniform elliptic bias or implicit
      exact locator with complete exponent below 1/2 can reverse this result.

cheapest_decisive_gate:
  name: two_formula_probability_work_audit
  type: theorem_only_zero_compute
  cost:
    implementation: low
    compute: none
    wall_clock: hours_not_days
  derivation: >-
    Verify M, H=M*d/(L+1), the success law q, and the actual stopping rule.
    Compare H/q with N^(1/2). This precedes reconstruction of every geometric
    theorem because the candidate cannot meet GOAL-CRYPTO-001 if its own
    probability and enumeration formulas already force N^(1-o(1)) work.
  pass_condition: >-
    A self-contained proof gives exact zero-minor recovery with constant
    success and total charged target-dependent work
    N^(1/2-epsilon), epsilon>0, by establishing either
    qN/M>=N^(1/2+epsilon) from elliptic structure or a nonenumerative locator
    with equivalent savings; all matrix, retry, memory, and verification costs
    remain included.
  fail_condition: >-
    The published q<=N^o(1)*M/N occupancy law and Omega(H) explicit
    signature processing both survive audit, or any semantic certificate step
    fails.
  outcome_interpretation:
    occupancy_and_enumeration_confirmed: >-
      Reject this interface as N^(1-o(1)) expected work, strictly worse than
      Pollard rho; do not run a toy or standardized-curve experiment.
    proved_superuniform_bias_and_subrho_locator: >-
      Advance only to independent theorem review. This would be a candidate
      mechanism, not evidence of an ECDLP breakthrough.
    semantic_failure: >-
      Reject independently of cost.
    equality_with_rho: >-
      Record no asymptotic advantage and do not advance for this goal.

