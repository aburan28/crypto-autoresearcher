red_team_report:
  id: RT-20260723-303
  task_id: TASK-20260723-303
  goal_id: GOAL-CRYPTO-001
  requested_policy: review-xhigh
  resolved_model_id: gpt-5.6-sol-xhigh
  reasoning_effort: xhigh
  fallback_used: false
  adapter_version: cursor-subagent-2026-07
  independent_review: true
  snapshot:
    producer_task_id: TASK-20260723-301
    archive_task_id: TASK-20260723-302
    commit_sha: e27692bed54f50d0e129ab6809b0fb9581b49bbd
    verification_commit_sha: dad5156b8545c7c8b87836f42c13a080e13cd0a2
    producer_hashes_match_verified_queue: true
  claim_under_review: >-
    Whether the known defect-scaled hyperplane-signature zero-minor route is
    meaningfully outside the failed z_R interface and warrants the proposed
    two-formula static gate as a possible route to fully charged sub-rho work.
  objections:
    - id: RT303-O1
      topic: novelty_and_relation_path
      severity: major
      finding: >-
        The candidate is representation-distinct from the failed z_R sheet:
        it constructs a target-bearing evaluation matrix and explicitly
        enumerates signatures rather than demanding a compact z_R update,
        source dictionary, or labelled replay. That distinction is narrow,
        however. Both routes still require a locator for a target-bearing
        algebraic relation. The report already classifies this exact
        hyperplane-signature mechanism as published prior art, and its
        explicit locator is the charged bottleneck. Renaming any repair as an
        implicit locator would recreate the same unpriced-witness defect that
        invalidated the z_R/P1539-style escape.
      consequence: >-
        Treat this as a distinct representation-level interface but not as a
        novel algorithm or a new bottleneck class.
    - id: RT303-O2
      topic: published_success_model
      severity: decisive_if_aligned
      finding: >-
        The supplied formulas already imply a scoped non-sub-rho result. If
        q<=min(1,M/N) is the success probability for the same trial that
        exposes M candidate completions and necessarily processes at least
        H=M*d/(L+1) signatures, then H/q>=N*d/(L+1) for M<=N, while H has the
        same lower bound for M>=N. Since L=Theta(log N) and d>=1, this is
        N^(1-o(1)), above rho and BSGS time exponents. No empirical run can
        reverse that conditional algebra.
      consequence: >-
        The route is already conditionally negative under its stated model;
        the remaining task is source and loop alignment, not performance
        testing.
    - id: RT303-O3
      topic: formula_alignment_and_stopping
      severity: major
      finding: >-
        The snapshot gives no theorem, equation, page, or pseudocode anchors
        showing that q, M, and H refer to the same outer restriction, defect
        choice, and stopping rule. It also quotes a larger
        binom(L,d)*H-style loop while using H alone in the lower bound. The
        latter is conservative only after proving which candidate completions
        each signature exposes and how failed and successful early stops are
        charged. For d=1, H=1 but M=L+1, making hidden extension, comparison,
        and provenance operations especially visible.
      consequence: >-
        A two-formula algebra check alone is not decisive; a
        manuscript-aligned stopping-time derivation is the cheapest valid
        version of the gate.
    - id: RT303-O4
      topic: rank_certificate_source_recovery_and_scalar_orientation
      severity: major
      finding: >-
        The direct-solver classification can legitimately omit factor-base
        collection, factor-log linear algebra, and descent, but it cannot omit
        the full direct relation path. The audit must include sampled-point
        coefficient provenance, expected rank and general-position failures,
        zero normalization coordinates, exact duplicate-to-zero-minor logic,
        index-union ambiguity, and recovery only when the public relation has
        a nonzero target coefficient. Degenerate scalar orientation and every
        resampling attempt need explicit probability and cost.
      consequence: >-
        An exact zero minor or a hash match is not yet a complete scalar
        recovery certificate.
    - id: RT303-O5
      topic: memory_preprocessing_and_parallelism
      severity: major
      finding: >-
        O(H*d) field elements counts signature coordinates but not necessarily
        subset provenance, combinatorial indices, hash-table metadata,
        collision resolution, retained kernel state, or aggregate worker
        copies. In the constant-success regime d=Theta(L), the published table
        is at least linear-scale in entries and has an additional logarithmic
        coordinate width. The claim that streaming reduces live memory to
        poly(L,d) is unsupported without a RAM or external-memory model:
        exact duplicate recovery generally requires storage, sorting, or
        extra passes and recomputation. Reusable curve-only setup and all
        target-dependent matrix, restriction, defect-loop, resampling, and
        memory-traffic costs must be separated under a declared single-target
        amortization model.
      consequence: >-
        These omissions can only worsen the conditional negative, but they
        prevent calling the current accounting complete.
    - id: RT303-O6
      topic: baseline_completeness
      severity: moderate
      finding: >-
        The producer compares only with Pollard rho. It does not explicitly
        compare BSGS or use the exact published 2018/2023/2026 zero-minor
        algorithm, with its full defect loop and storage model, as the closest
        specialized baseline. P1539 is a useful internal analogy but is not a
        substitute for the method's own prior-art baseline.
      consequence: >-
        Baseline completeness is missing even though the asymptotic
        conditional verdict is unlikely to improve.
  required_controls:
    - id: RT303-C1
      control: >-
        Source-aligned loop table: cite the exact manuscript equations and
        pseudocode and map every q event, M completion, H signature, defect
        choice, outer restriction, and early-stop branch to charged work.
    - id: RT303-C2
      control: >-
        Boundary mutation d=1: explain how H=1 exposes M=L+1 completions and
        charge every extension, equality check, index record, and failed
        trial. Repeat symbolically at the smallest d giving M=Theta(N).
    - id: RT303-C3
      control: >-
        End-to-end certificate table: require rank/general-position checks,
        exact normalized-vector equality, zero-minor reverification, retained
        source coefficients, a nonzero target coefficient, scalar recovery,
        and final public group equality.
    - id: RT303-C4
      control: >-
        Single-target resource ledger: report field operations, group
        operations, bit memory, memory traffic, preprocessing, recomputation,
        failed trials, and aggregate parallel resources without free
        amortization.
    - id: RT303-C5
      control: >-
        Compare the resulting complete cost with rho, BSGS, and the exact
        published hyperplane-signature implementation; use random-matrix and
        planted-arrangement controls only if the static gate unexpectedly
        survives.
  counterexample_or_mutation: >-
    Use the zero-compute d=1 boundary. The stated counts become H=1 and
    M=L+1. If the pseudocode cannot expose and verify all L+1 candidate
    completions from one charged signature without additional extension,
    comparison, or provenance work, H is not the complete operation count.
    If it can, bind the resulting success event to that exact work and the
    q<=M/N model; the expected-work lower bound is then already
    Omega(N/(L+1)).
  baseline_comparison:
    pollard_rho: >-
      N^(1/2+o(1)) expected group operations with small serial memory. Under
      aligned q, M, and H, the candidate needs N^(1-o(1)) field-operation or
      memory-access work, so polylogarithmic bit-cost conversion cannot close
      the exponent gap.
    baby_step_giant_step: >-
      N^(1/2+o(1)) group operations and N^(1/2+o(1)) stored group elements.
      The candidate's fixed-defect or streamed branch may use less peak
      memory but has near-linear expected work; its constant-success
      published-table branch has at least near-linear entries with
      logarithmic-width signatures. It therefore does not improve the
      time-memory frontier shown by BSGS.
    closest_specialized_baseline: >-
      The closest baseline is the cited 2018/2023/2026 zero-minor and
      defect-scaled hyperplane-signature line itself, not z_R. The snapshot
      identifies the mechanism as known and supplies no independently anchored
      cost theorem from that literature. Conditional on the quoted occupancy
      model and explicit enumerator, the method is near-linear; absent those
      source-aligned premises, the cost attribution remains unverified rather
      than positive.
  narrowest_supported_statement: >-
    For the formulas stated in the immutable TASK-20260723-301 snapshot, if
    q bounds success for exactly the M completions reached by a trial that
    charges at least H signatures, the explicit defect/signature interface
    has expected work Omega(N*d/(L+1))=N^(1-o(1)) and has no asymptotic
    advantage over Pollard rho or BSGS. This does not prove the quoted q law,
    validate the zero-minor certificate path, or rule out other nonlinear
    locators or representations.
  verdict: CONDITIONAL_SCOPED_NEGATIVE__SOURCE_ALIGNED_STATIC_AUDIT_ONLY__NO_RUN
  verdict_rationale: >-
    The candidate is outside z_R at the representation level but is known
    prior art and retains the same relation-locator burden. Its own supplied
    success and enumeration formulas already force non-sub-rho expected work
    when they are aligned to one trial. The proposed gate remains the cheapest
    route only after tightening it from a two-formula check to an exact
    source-, stopping-, certificate-, and resource-aligned static audit.
  recommended_next_action: >-
    Perform one zero-compute manuscript-aligned stopping-time and
    end-to-end-cost audit of the exact q/M/H loops, including the d=1 boundary,
    rank and scalar-orientation failures, bit memory, preprocessing, and rho,
    BSGS, and exact-specialized baselines; if the formulas align, record the
    scoped conditional negative and stop, and if they do not, mark the cost
    claim inconclusive rather than opening a toy run.
  next_concrete_action: >-
    Perform one zero-compute manuscript-aligned stopping-time and
    end-to-end-cost audit of the exact q/M/H loops, including the d=1 boundary,
    rank and scalar-orientation failures, bit memory, preprocessing, and rho,
    BSGS, and exact-specialized baselines; if the formulas align, record the
    scoped conditional negative and stop, and if they do not, mark the cost
    claim inconclusive rather than opening a toy run.
