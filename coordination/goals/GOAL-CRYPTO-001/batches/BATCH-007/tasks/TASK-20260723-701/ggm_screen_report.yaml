  key_recovery_software: none
  operational_cryptanalytic_instructions: none
  permitted:
    - abstract generic-group transcript analysis
    - literature and corpus deduplication
    - symbolic asymptotic cost comparison
  prohibited:
    - real-key recovery
    - deployed-target analysis
    - standardized-curve execution planning
    - operational attack tooling
    - presenting conditional or toy evidence as cryptographic evidence
  conclusion_boundary: >-
    This report neither proves ECDLP hardness nor claims an algorithm,
    cryptographic solve, generic-lower-bound improvement, or breakthrough.

