explicit_non_simulable_transcript_criterion:
  id: NS-TX-PRIME-001
  purpose: >-
    Separate a genuinely k-dependent augmentation from a coordinate restatement
    or an oracle whose answers are functions of public data and formal generic
    expressions.
  setup:
    - >-
      Let H=<P> have prime order N, let Q=[k]P, and let a base generic
      transcript contain opaque handles for affine forms
      L_i(k)=a_i+b_i*k modulo N, together with addition, negation, and equality
      answers.
    - >-
      Choose k_0 != k_1 such that all equality and inequality outcomes among
      the queried L_i(k_j) agree and the relabelling preserves every item of
      side information explicitly granted to the base simulator. Before a
      generic collision, the two base transcripts are then isomorphic.
    - >-
      Let the proposed augmentation answer Z_j on the same formal query
      sequence in world k_j.
  mandatory_separation:
    transcript_gap: >-
      Exhibit a public verifier V and epsilon at least
      1/poly(log(N)) such that
      abs(Pr[V(Z_0)=1]-Pr[V(Z_1)=1]) >= epsilon,
      while the underlying generic transcripts remain relabelling-isomorphic.
      For deterministic answers, different verified outputs give epsilon=1.
    simulator_consequence: >-
      A generic simulator limited to O(1) additional group queries and
      O(poly(log(N))) public arithmetic per augmented answer sees the same
      relabelled transcript in both worlds except with collision probability
      O((q+1)^2/N); therefore a gap asymptotically larger than that collision
      term refutes exact O(1)-overhead simulation for the frozen augmentation.
    relation_relevance: >-
      Z_j must contain a target-conditioned exact signed occurrence relation,
      or a certified miss, for a fixed public factor deck and either a
      known-log endpoint or a fresh scalar-blind masked target Q+[t]P.
      A raw coordinate, universal identity, aggregate count, supplied-tuple
      predicate, or unverified existence bit does not satisfy this clause.
    cost_relevance: >-
      The transcript must be produced, replayed, ranked, used for factor logs,
      and reused for blind descent with all setup, failures, output, memory,
      and verification charged. Non-simulability alone is not an advantage.
  outcome_interpretation:
    public_or_formal_factorization: >-
      If every answer factors through public equations, public query
      coordinates, and the simulator's formal expressions and equality
      pattern, the augmentation is exactly simulable and remains under the
      generic square-root barrier.
    encoding_only_gap: >-
      If only raw coordinates of composite handles differ, the oracle has
      merely restored the ordinary concrete curve encoding. It is non-generic
      by definition but supplies no k-dependent relation advantage without
      the relation-relevance and cost clauses.
    source_bearing_gap: >-
      If the verified relation transcript has the required gap and complete
      charged cost below the gates, it becomes an unfiled theorem candidate
      for independent review. It is not breakthrough evidence.

family_inventory:
  - candidate_name: higher_order_public_equation_jets
    family_id: null
    eligibility: prior_audited_not_remaining
    reason: >-
      THM-JETBARRIER1 T2/T4 covers every order r on public-equation varieties;
      smooth lifts are formal smoothness and singular fibers are public
      Hasse-Schmidt systems. The answer is public-data computable with zero
      added group-oracle queries.
    criterion_result: fails_NS_TX_transcript_gap
  - candidate_name: public_affine_or_algebraically_constrained_lifts
    family_id: null
    eligibility: prior_audited_not_remaining
    reason: >-
      Public affine constraints are explicitly covered by T1.3/T4. More
      general fixed public algebraic constraints remain public jet-scheme
      equations under T2; they do not create a hidden-k transcript.
    criterion_result: fails_NS_TX_transcript_gap
  - candidate_name: finite_additive_formal_Witt_or_arithmetic_jet_targets
    family_id: null
    eligibility: prior_audited_not_remaining
    reason: >-
      P1547 gives the prime-to-p filtration and additive vanishing screen at
      every finite order. Higher order does not create an ell-primary scalar
      channel.
    criterion_result: no_nonzero_order_N_relation_channel
  - candidate_name: nonadditive_lift_invariant_point_constraint
    family_id: null
    eligibility: uninstantiated_residual
    reason: >-
      P1547 names this only as an unclassified possibility. No public
      operation, output type, lift-invariance law, scalar/source inverse, or
      transcript distribution exists to test. An adjective-level exception is
      not a representation family.
    criterion_result: cannot_apply_without_oracle
  - candidate_name: composite_handle_coordinate_oracle
    family_id: null
    eligibility: model_seam_not_new_family
    reason: >-
      THM-JETBARRIER1 T6 already identifies this as non-simulable only because
      it restores the concrete curve encoding of arbitrary group elements.
      Raw coordinate dependence fails the relation-relevance clause and no
      sub-birthday source transcript is supplied.
    criterion_result: encoding_only_gap
  - candidate_name: Weil_restriction_or_descent_jet
    family_id: null
    eligibility: outside_prime_field_scope
    reason: >-
      The G2 seam concerns extension-field descent and uncertainty over which
      equations are public. A prime field has no proper subfield for this
      descent, so it is not a remaining family under RQ-CRYPTO-001.
    criterion_result: out_of_scope
  - candidate_name: Hasse_jet_multiplicity_code
    family_id: null
    eligibility: prior_rejected_not_remaining
    reason: >-
      IDEA-268 requires a supplied source-sensitive codeword oracle and exact
      point lift. Without those hidden inputs it produces no candidate
      transcript; with them it assumes the missing source operation.
    criterion_result: hidden_source_oracle
  - candidate_name: other_finding_representation_screens
    family_id: null
    eligibility: prior_audited_not_reopened
    reason: >-
      FINDING-PF-IC-001 already screens elliptic-net translated states,
      supported-divisor S-units, pairing and lift-return targets, ramification
      branches, trace-zero transfers, split-Jacobian projections, torsor deck
      routers, and endpoint/source-aggregation grammars. The handoff also
      excludes incidence, EQJ, and TTN variants. No checked item adds a new
      NS-TX-PRIME-001 source-bearing transcript criterion.
    criterion_result: no_new_transcript_criterion

residuals:
  - id: RESIDUAL-NONADDITIVE-TYPED-INVARIANT
    statement: >-
      An explicit public, target-uniform, lift-invariant nonadditive point
      operation could be screened if it supplied an exact output law and
      source inverse. No such operation is present.
    status: logical_placeholder_not_family
  - id: RESIDUAL-GGM-META-COMPLETENESS
    statement: >-
      THM-JETBARRIER1 G1 asks for a maximal formal language of simulable
      augmentations. This is a generic-model classification problem, not an
      ECDLP representation with a relation transcript.
    status: open_model_theory_not_candidate
  - id: RESIDUAL-DESCENT-G2
    statement: >-
      Publicness of jet equations in Weil-restriction/descent settings remains
      a stated gap, but it lies outside the prime-field family screened here.
    status: extension_field_scope
  - id: RESIDUAL-CONCRETE-COORDINATE-ALGORITHM
    statement: >-
      A concrete coordinate-sensitive ECDLP algorithm can leave the GGM, but
      merely doing so is not a distinct augmentation and provides no
      sub-birthday relation path.
    status: umbrella_open_problem

cheapest_decisive_gate:
  name: symbolic_relabelled_transcript_pair_gate
  type: theorem_only_zero_compute
  current_result: no_candidate_oracle_to_gate
  design: >-
    For any future claimed representation, freeze its exact oracle and one
    formal query schedule. First prove the two-world relabelling condition for
    k_0,k_1. Then derive the augmentation outputs and a public verifier,
    checking the NS-TX-PRIME-001 gap. If the gap exists, require an exact
    signed source certificate and fill the complete relation, rank, factor-log,
    blind-descent, memory, and verification ledger before any fixture.
  controls:
    - public_equation_and_Hasse_Schmidt_simulator
    - formal_expression_and_handle_relabelling_simulator
    - generic_collision_probability_charge
    - raw_coordinate_encoding_only_control
    - supplied_source_and_target_advice_rejection
    - exact_signed_occurrence_certificate
    - identical_fresh_masked_target_operation
    - full_Pollard_rho_cost_comparison
  required_metrics:
    - exact_oracle_definition_complete
    - base_transcript_relabelling_isomorphism_proved
    - verified_transcript_probability_gap_epsilon
    - generic_collision_bound_O_q2_over_N
    - exact_signed_source_replay
    - independently_verified_rank
    - total_work_exponent_lambda
    - peak_memory_exponent_mu
    - complete_fresh_target_exponent_tau
    - certificate_reverification_failures
  pass_condition: >-
    A source-bearing verified transcript has epsilon asymptotically larger
    than O((q+1)^2/N), exact replay on known-log and fresh masked targets, zero
    certificate failures by construction, tau<=0.25, and complete
    lambda,mu<=0.45.
  fail_condition: >-
    The answer is public/formal and simulable; only raw concrete coordinates
    differ; the source is supplied or hidden; no exact relation transcript
    exists; or any required cost is missing or above its gate.
  estimated_cost:
    implementation: none
    compute: none
    analyst_effort: hours_not_days_after_an_exact_oracle_exists
  why_cheapest: >-
    The present residuals lack an oracle, not measurements. A symbolic
    relabelling and output-gap proof decides simulability before source replay
    and cost accounting; a fixture cannot define a missing transcript.

baseline_comparison:
  applicability: no_family_proposed
  subgroup_order: N
  pollard_rho:
    expected_work: N^(1/2+o(1))_group_operations
    serial_memory: N^o(1)
  generic_barrier: >-
    An O(1)-overhead simulable augmentation inherits Shoup's
    Omega(N^(1/2)) generic work bound.
  campaign_admission:
    total_work_exponent_lambda_at_most: 0.45
    peak_memory_exponent_mu_at_most: 0.45
    complete_fresh_target_exponent_tau_at_most: 0.25
  current_candidate_costs: not_applicable
  no_free_parameters_rule: >-
    Because no family and no oracle are proposed, no construction, relation,
    rank, descent, or memory exponent is assigned zero. No advantage over rho
    is claimed.

falsification_and_outcome_map:
  new_exact_family_with_NS_TX_transcript: >-
    Falsifies this checked-corpus no-family disposition only after deduplication
    and independent theorem review; it does not falsify Shoup outside the new
    model and is not breakthrough evidence.
  exact_simulator_constructed: >-
    Places the frozen family on the barrier side and prevents non-generic
    advantage credit.
  coordinate_gap_without_source_relation: >-
    Confirms only that the concrete encoding is non-generic; retain this
    no-family disposition.
  family_requires_hidden_source_or_target_advice: >-
    Reject the family as circular rather than treating simulator failure as
    evidence.
  cost_at_or_above_rho_or_missing: >-
    No algorithmic advantage follows even if raw non-simulability is proved.

confounders:
  - >-
    The checked repository corpus is not an exhaustive external-literature
    review; novelty and absence outside it remain unverified.
  - >-
    THM-JETBARRIER1 G1 is not a universal oracle-classification theorem, so
    the result must not be read as closing every imaginable augmentation.
  - >-
    A representation may be encoding-dependent and therefore non-generic
    without supplying useful k-dependent relations.
  - >-
    Extension-field descent could change which equations are public, but that
    does not make it a prime-field candidate.

interpretation_limits:
  - No universal GGM simulability theorem is claimed.
  - No non-generic ECDLP direction is declared impossible.
  - No empirical run, relation, scalar, key, or curve solve was produced.
  - No proposal, hypothesis, evidence, decision, or goal status is created or changed.
  - Existing toy evidence is used only as scoped prior evidence, not crypto-scale support.

estimated_cost:
  implementation: none
  compute: none
  analyst_effort: bounded_zero_compute_corpus_and_theorem_screen

ranking_rationale: >-
  NO_DISTINCT_UNAUDITED_FAMILY has higher expected information gain per cost
  than relabelling higher-order or constrained jets: the all-order public-jet
  simulator and prime-to-p additive-lift theorem already cover those names.
  The remaining nonadditive, G1, G2, and concrete-coordinate seams do not
  instantiate an oracle, so another KN-OPEN-005 screen would repeat an absent
  operation. The first test for any future exact family should be
  NS-TX-PRIME-001 because a two-world symbolic transcript pair is the cheapest
  valid discriminator between public/formal simulability and genuine
  hidden-k output. Until such a family is supplied, KN-OPEN-004 or
  KN-OPEN-006 offers a more concrete theorem target than another
  representation-name audit.

