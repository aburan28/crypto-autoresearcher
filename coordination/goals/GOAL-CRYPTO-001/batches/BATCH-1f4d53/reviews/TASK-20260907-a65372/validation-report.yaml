        `6cde05e8d5aa686045df31d32ffd95c9718aa751bd79e87e550cb08767adb21e` —
        confirming (c), the historical values were correct at commit time.
      verdict: CONFIRMED IN FULL, on all three sub-claims (a), (b), and (c).
