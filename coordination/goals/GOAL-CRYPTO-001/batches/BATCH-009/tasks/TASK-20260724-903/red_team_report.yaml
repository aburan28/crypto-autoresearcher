        descent, verification, traffic, and peak memory.
      discriminates: >-
        The scoped uniform-mask lower bound from a purported end-to-end
        advantage with hidden stages.
    - id: RT903-C3
      control: >-
        Keep every later BKK statement typed to nonexceptional original
        sections; an exceptional missing corner may be reported only as a
        proper hull until its full square-system mixed volume is separately
        certified.
      discriminates: >-
        The proved full-box negative gate from unsupported positive credit
        for exceptional sections.

  counterexample_or_mutation:
    cheapest_discriminating_mutation: >-
      Multiply one post-resultant S_s by A. The factor is nonzero generically
      but is not a unit of R and vanishes at the allowed nonsingular
      specialization A=0, B nonzero. This mutation can preserve a generic
      zero-set reading while destroying every specialized coefficient.
    expected_result_if_packet_is_sound: >-
      The frozen recurrence and theorem-mode verifier reject the mutation:
      post-resultant coefficient-dependent rescaling is forbidden and the
      leading factor must replay as exactly 1_R.

  baseline_comparison:
    pollard_rho: >-
      Pollard rho has expected N^(1/2+o(1)) work and negligible serial memory
      for a fresh prime-order target. The scoped bridge lower bound is
      Omega(sqrt(N)) in the common word/traffic ledger, so it earns no
      sub-rho exponent credit. No constant-factor or complete-path comparison
      is established.
    baby_step_giant_step: >-
      BSGS has N^(1/2+o(1)) work and N^(1/2+o(1)) stored group elements. The
      packet proves neither a time nor memory advantage over BSGS; its bridge
      ledger supplies a work lower bound while leaving peak memory and an
      implementable upper bound unspecified.
    closest_specialized_baseline: >-
      The closest baseline is the canonical original-section Semaev
      point-decomposition/index-calculus formulation charged by the
      multigraded box driver. For n=m-1 nonexceptional sections, every Newton
      polytope is [0,D_m]^n and normalized mixed volume is n!*D_m^n, exactly
      the multigraded box-Bezout count. Thus this original Newton support
      supplies no BKK path-count reduction. The packet does not compare full
      relation probability, solving, recovery, rank, linear algebra, or
      descent costs.
    conclusion: >-
      The packet closes one negative Newton/BKK mechanism and one explicitly
      scoped uniform-mask escape route; it establishes no general lower bound
      and no positive advantage against rho, BSGS, or specialized Semaev
      index calculus.

  scope_limits:
    - Exact right-comb S_s over the locked short-Weierstrass coefficient ring.
    - Characteristic not 2 or 3 and nonsingular allowed specializations.
    - Original target-sectioned Newton hull and nonexceptional box mixed volume.
    - Fresh independent uniform-mask bridge with mandatory m-entry replay.
    - No exceptional-system runtime, alternative representation, or end-to-end ECDLP claim.
    - No standardized-curve computation, key recovery, or knowledge promotion.

  narrowest_supported_statement: >-
    For the exact locked right-comb Semaev circuit, every allowed specialized
    section outside E_m(E) has Newton polytope
    [0,2^(m-2)]^(m-1), while a section inside E_m(E) loses at least one box
    vertex. Consequently, a square system of m-1 nonexceptional original
    sections has normalized mixed volume equal to its multigraded box-Bezout
    number. Separately, the stated fresh-uniform-mask bridge with mandatory
    expanded replay costs Omega(sqrt(N)) in M_logN/1.0.0. Nothing broader is
    supported.

