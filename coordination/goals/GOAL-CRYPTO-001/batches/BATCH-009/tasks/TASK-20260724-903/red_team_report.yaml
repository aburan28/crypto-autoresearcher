  gap_assessment:
    - id: B008-G1
      subject: unit_valued_leading_factor_and_fixed_normalization
      closed: yes
      basis: >-
        The packet fixes R, the Sylvester/resultant sign convention, S_2,
        S_3, the exact right-comb recurrence, argument order, and forbidden
        postprocessing. Extracting the X_s top coefficient gives
        Res_Z(f,(X_(s-1)-Z)^2)=f(X_(s-1))^2 with factor exactly 1_R.
        Exact symmetry transfers the identity to every variable. The
        corner-square recurrence then has a unique extreme-exponent
        contribution, so no coefficient convolution or specialization-
        vanishing normalization is hidden.
    - id: B008-G2
      subject: all_zero_corner_classifier_and_degeneracies
      closed: yes
      basis: >-
        The pointwise biconditional for the locked circuit gives both
        directions of the finite root classifier. The proof separately
        treats B nonzero, B=0 with its unique order-two lift, partial sums at
        the identity, torsion and sign collisions, degree drops, nonzero
        specialization, and the absence of additional finite roots. The
        union over F_s plus the t corner proves both inclusions in the exact
        exception set.
    - id: B008-G3
      subject: exception_bridge_common_model_lower_bound
      closed: yes
      basis: >-
        For fresh independent uniform masks in a prime-order H, at most
        2(m-1) points are eligible, giving at least N/(2(m-1)) expected
        trials when a hit exists. The same M_logN/1.0.0 ledger charges at
        least one unit per trial and Omega(m) units for mandatory m-entry
        replay. Hence Omega(N/m+m)=Omega(sqrt(N)); no sub-rho exponent credit
        follows. The packet explicitly excludes nonuniform bridges and any
        complete Semaev lower bound.
    - id: B008-G4
      subject: versioned_theorem_mode_replay_obligation
      closed: yes
      basis: >-
        newton-corner-theorem-mode/1.0.0 defines disjoint universal and
        specialized modes, required normalization and branch receipts,
        snapshot/digest binding, allowed outputs, strict boundary fields, and
        fail-closed versioning. It correctly separates the deterministic
        theorem obligation from any later random-mask transcript. This is an
        obligation, not a claim that a specialized replay instance exists.
    - id: B008-G5
      subject: no_scope_inflation
      closed: yes
      basis: >-
        The conclusion is confined to the original target-sectioned,
        normalization-locked Semaev Newton hull and its normalized
        mixed-volume/box-Bezout ratio. Exceptional sections receive no solver
        credit, and lifted, Groebner, circuit, unsectioned, nonuniform,
        standardized-curve, and key-recovery readings are expressly excluded.

  objections:
    - id: RT903-O1
      severity: nonblocking_scope_guard
      subject: bridge_representation_and_nonuniform_advice
      finding: >-
        The Omega(m) term depends on the stated rule that all m canonical
        arity entries are materialized or retrieved. A compressed count,
        nonuniform advice table, or a different target bridge is outside the
        theorem rather than ruled out by it.
      consequence: >-
        Preserve the bridge corollary exactly as a lower bound for fresh
        independent uniform masking with mandatory expanded replay.
    - id: RT903-O2
      severity: nonblocking_scope_guard
      subject: certificate_obligation_versus_instance
      finding: >-
        Version 1.0.0 specifies a fail-closed certificate obligation, but this
        zero-compute packet does not instantiate a specialized section or a
        random-mask bridge transcript.
      consequence: >-
        The theorem packet is complete at its stated paper-proof boundary;
        later replay or algorithmic claims cannot cite the schema alone as an
        executed certificate.
    - id: RT903-O3
      severity: nonblocking_scope_guard
      subject: omitted_end_to_end_stages
      finding: >-
        Relation supply and independence, factor-base representation, source
        recovery and signs, matrix rank, factor-log solving, target descent,
        verification, traffic, and peak memory remain unpriced.
      consequence: >-
        Their omission is consistent with this local negative gate but blocks
        every end-to-end ECDLP or specialized-index-calculus conclusion.

  required_controls:
    - id: RT903-C1
      control: >-
        Before theorem-mode reuse, instantiate
        newton-corner-theorem-mode/1.0.0 with commit
        efcc65cab393e659ef9e43c77735547a4cf6d58c, both reviewed SHA-256
