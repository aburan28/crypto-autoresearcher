exact_claim:
  theorem: >-
    Let k have characteristic other than 2 or 3, let
    E:y^2=x^3+A*x+B be nonsingular, let D_m=2^(m-2), and let S_m be the
    exact right-comb resultant circuit locked below. For beta^2=B and
    P_0=(0,beta), define
    E_m(E)={x([r]P_0):1<=r<=m-1 and [r]P_0 is affine}. Then
    Newt(S_m(x_1,...,x_{m-1},t))=[0,D_m]^(m-1) if and only if
    t is outside E_m(E). If t is inside E_m(E), at least one box-corner
    coefficient vanishes. This classifies box saturation, not the interior
    support or mixed volume of an exceptional square system.
  bkk_corollary: >-
    For n=m-1 nonexceptional original target sections, the normalized mixed
    volume is n!*D_m^n=(m-1)!*2^((m-1)(m-2)), so
    MV/multigraded-box-Bezout=1.
  bridge_corollary: >-
    In the specified common word-RAM/traffic model, a fresh-independent
    uniform scalar-mask bridge that must hit the exception set and then
    materialize or replay the m arity entries has expected work
    Omega(N/m+m)=Omega(sqrt(N)). This receives no sub-rho credit and says
    nothing about an unspecified nonuniform bridge.

normalization_lock:
  coefficient_domain: "R=Z[1/6,A,B,(4*A^3+27*B^2)^(-1)]"
  allowed_specializations: >-
    Fields k with char(k) not in {2,3} and 4*A^3+27*B^2 nonzero.
  resultant_convention: >-
    Res_Z(f,g)=a_d^e*product_{f(alpha)=0} g(alpha), equivalently the
    corresponding Sylvester determinant; in particular
    Res_Z(f,a-Z)=f(a).
  S_2: "S_2(X_1,X_2)=X_1-X_2"
  S_3: >-
    S_3(X_1,X_2,X_3)=(X_1-X_2)^2*X_3^2
    -2*((X_1+X_2)*(X_1*X_2+A)+2*B)*X_3
    +(X_1*X_2-A)^2-4*B*(X_1+X_2).
  recursive_circuit: >-
    For s>=4,
    S_s(X_1,...,X_s)=Res_Z(S_{s-1}(X_1,...,X_{s-2},Z),
    S_3(X_{s-1},X_s,Z)), with the displayed argument order.
  forbidden_postprocessing:
    - primitive-part extraction
    - square-free reduction
    - division or monicization
    - coefficient-dependent rescaling
    - alternate resultant tree substituted without a new certificate
  leading_coefficient_identity: >-
    [X_i^(2^(s-2))]S_s =
    S_{s-1}(X_1,...,hat(X_i),...,X_s)^2 for every i.
  induction_unit:
    value: "1_R"
    specialization_safe: true
    coefficient_dependent: false
  proof_ref: normalization_locked_proof.md#2-exact-leading-coefficient-and-unit-induction

proof_dependencies:
  sources:
    - id: Semaev-2004-Theorem-1
      status: established_exact_theorem
      citation: >-
        Igor Semaev, Summation polynomials and the discrete logarithm problem
        on elliptic curves, IACR ePrint 2004/031, Theorem 1.
      imported_statement: >-
        Exact resultant recurrence, symmetry, per-variable degree, and the
        pointwise summation-zero biconditional.
    - id: Kosters-Yeo-2015-Proposition-2.1
      status: established_exact_theorem
      citation: >-
        Michiel Kosters and Sze Ling Yeo, Notes on summation polynomials,
        arXiv:1503.08001, Section 2 definition and Proposition 2.1.
      imported_statement: >-
        For the exact recursive resultant polynomial over a field, evaluation
        is zero if and only if affine points with the supplied x-coordinates
        sum to the identity.
  dependency_note: >-
    The proof uses the exact pointwise biconditional, not generic
    set-theoretic agreement or an unspecified nonzero normalization.

corner_induction:
  degree: "D_m=2^(m-2)"
  definition: >-
    c_{m,k}(t) is the coefficient of a section-box corner with exactly k of
    the m-1 free-variable exponents equal to D_m and the rest zero.
  base:
    c_3_0: "A^2-4*B*t"
    c_3_1: "t^2"
    c_3_2: "1"
  recurrence: "c_{m,k}=c_{m-1,k-1}^2 for m>=4 and 1<=k<=m-1"
  closed_form:
    inherited: "c_{m,k}=F_{m-k}(t)^(2^k), 0<=k<=m-3"
    next_to_top: "c_{m,m-2}=t^D_m"
    top: "c_{m,m-1}=1"
    all_zero_definition: "F_s(t)=S_s(0,...,0,t)"
  convolution_cancellation: impossible_at_an_extreme_corner
  proof_ref: normalization_locked_proof.md#2-exact-leading-coefficient-and-unit-induction

all_zero_corner_classifier:
  status: proved
  statement: >-
    For R_s={-(s-1),-(s-3),...,s-3,s-1}, F_s is nonzero and its finite
    root set over the algebraic closure is exactly
    {x([r]P_0):r in R_s and [r]P_0 is not the identity}.
  B_nonzero_case: >-
    The lifts above x=0 are P_0 and -P_0. Their signed sums give exactly
    [r]P_0 for r in R_s; an affine sum uniquely determines the cancelling
    last point and the converse follows from the exact Semaev biconditional.
  B_zero_case: >-
    Nonsingularity forces A nonzero. P_0=(0,0) is the unique lift and has
    order two. For odd s the first s-1 lifts sum to the identity and there
    is no finite root; for even s they sum to P_0 and the only root is 0.
    This agrees exactly with the displayed root formula.
  infinity_case: >-
    If [r]P_0 is the identity, cancellation requires the last point to be
    the identity, which has no finite x-coordinate; that r is omitted.
  torsion_and_collision_case: >-
    Torsion can make an index the identity or merge affine points and
    opposite-point x-coordinates. It cannot add a root; roots are a set.
  nonzero_specialization: >-
    The possible first-(s-1)-point sums are finite while the algebraic
    closure is infinite. A target outside their finite x-set evaluates
    nonzero by the exact biconditional, so F_s is never the zero polynomial
    on an allowed curve.
  no_extraneous_finite_factor: >-
    The imported biconditional applies to every tuple for the exact locked
    circuit. It excludes any additional finite root from a degree drop or
    a projective common root in an intermediate resultant.
  multiplicity_claimed: false
  proof_ref: normalization_locked_proof.md#3-exact-all-zero-corner-classifier

exception_union:
  status: proved
  exact_set: >-
    E_m(E)={x([r]P_0):1<=r<=m-1 and [r]P_0 is not the identity}.
  cardinality_bound: "<=m-1"
  union_identity: >-
    E_m(E)=V(t^D_m) union union_{s=3}^m V(F_s).
  both_inclusions: >-
    Every F_s index has absolute value at most s-1<=m-1; conversely r=1
    comes from t^D_m, and each 2<=r<=m-1 comes from s=r+1.
  B_zero_specialization: "E_m(E)={0}"
  Newton_implication: >-
    Outside E_m(E), all box vertices occur and the degree bound contains
    support in the box, so the Newton hull is the full box. Inside E_m(E),
    a named corner class vanishes, so the hull is proper.
  proof_ref: normalization_locked_proof.md#4-exact-exception-union-and-newton-conclusion

uniform_mask_exception_bridge:
  status: proved_scoped_lower_bound
  assumptions:
    - "H=<P> has prime order N and Q is in H."
    - "Each mask U is fresh and independent uniform in Z/NZ."
    - "The masked point Q+[U]P is tested against the exact exception set."
    - >-
      Accepted replay materializes or retrieves all m canonical arity
      entries: m-1 source-point entries plus the masked-target entry, with
      orientation/sign data.
  eligible_point_bound: "K<=2*|E_m(E)|<=2*(m-1)"
  hit_probability: "K/N<=2*(m-1)/N"
  expected_trials: >-
    Infinite if K=0; otherwise N/K>=N/(2*(m-1)).
  common_cost_model:
    id: "M_logN/1.0.0"
    word_size: "Theta(log N) bits"
    additive_units: >-
      Word operations plus words read, written, transmitted, or replayed;
      peak words are recorded separately.
    per_trial_floor: "at least one ledger unit"
    m_entry_floor: "Omega(m) ledger units"
  lower_bound: >-
    E[W_bridge]>=a*N/(2*(m-1))+b*m=Omega(N/m+m)=Omega(sqrt(N))
    for constants a,b>0.
  comparison: >-
    Matches, but does not beat, the Pollard-rho work exponent after
    subpolynomial arithmetic factors. No constant-factor or end-to-end
    comparison is claimed.
  scope_exclusions:
    - unspecified nonuniform target bridges
    - complete Semaev index-calculus lower bounds
    - relation supply and independence
    - source recovery beyond the mandatory replay floor
    - rank and factor-log linear algebra
    - blind descent and verification
    - runtime claims for exceptional polytopes
  proof_ref: normalization_locked_proof.md#5-uniform-mask-exception-bridge-in-one-cost-model

