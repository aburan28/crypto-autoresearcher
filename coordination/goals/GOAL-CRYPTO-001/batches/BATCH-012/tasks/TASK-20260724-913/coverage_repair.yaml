two_gate_definition:
  discovery_gate_A:
    purpose: admit_partial_target_scope_mechanism_without_demanding_review_artifacts
    required:
      - ordinary_prime_field_large_prime_order_target_scope
      - typed_factor_base_or_representation
      - typed_relation_predicate_or_direct_solve_predicate
      - explicit_target_dependence_or_target_independence
      - typed_source_semantics_sufficient_to_identify_returned_witnesses
      - falsifiable_claimed_gain_with_named_metric_and_direction
      - semantic_distinction_from_prior_CRYPTO_routes
    not_required_at_this_gate:
      - complete_adaptive_oracle_transcript
      - complete_cost_or_certificate_package
    result: fail_no_checked_record_satisfies_all_discovery_fields_after_deduplication

  experiment_readiness_gate_B:
    purpose: require_a_complete_zero_unknown_end_to_end_protocol_before_any_experiment
    required:
      - complete_oracle_transcript
      - exact_source_replay
      - relation_yield_and_independent_rank
      - fresh_scalar_blind_descent_or_direct_solve_completion
      - preprocessing
      - memory_and_traffic
      - verification_and_certificate
      - fully_matched_Pollard_rho_cost
    result: fail_no_checked_record_satisfies_all_readiness_fields

candidate_disposition:
  name: FINAL_NO_CANDIDATE
  discovery_gate_A: fail
  experiment_readiness_gate_B: fail
  exact_boundary: >-
    The disposition covers the BATCH-011 17-record table, six focused
    WebSearch result lists totaling 24 displayed results, five exact Crossref
    responses totaling 13 items, the nine repaired/adjacent source screens
    above, EV-CRYPTO-010/011, and the cited prior closure artifacts as observed
    on 2026-07-24. Duplicate URLs and records recur across lists; counts are
    displayed items, not unique works or total literature.
  cheapest_next_gate:
    name: source_semantics_and_gain_discovery_gate
    type: zero_compute_primary_source_typing
    trigger: only_when_a_new_target_scope_source_is_retrieved
    design: >-
      Before any readiness analysis, quote the proposed factor
      base/representation, relation or direct-solve predicate, target
      dependence, exact witness/source semantics, and a claimed metric gain;
      then fingerprint these semantics against every prior CRYPTO route.
    outcomes:
      pass: >-
        Retain one partial discovery candidate and only then fill the eight
        readiness fields. A pass is not crypto evidence or experiment approval.
      fail: >-
        If any discovery field is absent, the scope is not ordinary E(F_p), or
        the interface is a prior route/backend under a new label, retain
        FINAL_NO_CANDIDATE over the expanded checked set.
    why_cheapest: >-
      It directly tests the only live uncertainty created by the BATCH-011
      false-negative objection—whether a partial target-scope mechanism exists—
      without curve work and before expensive transcript or cost reconstruction.
    estimated_cost:
      implementation: none
      compute: none
      analyst_effort: low_per_new_primary_source

