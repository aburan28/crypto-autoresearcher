cheapest_decisive_gate:
  name: support_action_covariance_classification_gate
  type: theorem_only_zero_compute
  current_result: no_typed_action_to_gate
  design: >-
    For one future non-AP support claim, freeze the factor-base occurrences,
    the permutation/action generators, target action, coefficient provenance,
    relation-row transformation, orbit index/unranking algorithm, and exact
    source replay. Prove the covariance identity symbolically. Then classify
    the action as: bounded origin-fixing automorphism; prime-field Frobenius
    identity; scalar/translation orbit; source relabelling; or genuinely other.
    Expand every orbit-index, source, coefficient, and matrix-construction
    operation before assigning displacement-rank or LA savings.
  controls:
    - >-
      Bounded-automorphism control: order 2/4/6 actions may change constants
      but receive zero exponent credit.
    - >-
      Frobenius control: on F_p-rational points the p-power Frobenius is the
      identity; extension-field orbit gains are out of scope.
    - >-
      Translation/scalar-orbit control: charge orbit indexing and reject a
      supplied scalar label, known-log column dependency, or order-N table.
    - >-
      Row-permutation negative control: randomly permute columns while
      preserving row weights; low rank in a chosen ordering is not covariance.
    - >-
      AP and isotypic controls: compare with EV-STR-001 and KN-TECH-012 so a
      renamed translation or finite symmetry is not readmitted.
    - >-
      Source and blind-target control: require exact signed occurrence replay
      and the identical action for a fresh scalar-blind masked target.
  required_metrics:
    - exact_growing_support_action_defined
    - support_action_orbit_size_exponent_in_N
    - covariance_identity_failures
    - orbit_index_and_unranking_work
    - relation_success_and_rank_yield
    - displacement_rank_or_block_dimensions
    - factor_log_linear_algebra_work
    - complete_fresh_masked_target_exponent_tau
    - fully_charged_total_work_exponent_lambda
    - fully_charged_peak_memory_exponent_mu
    - certificate_reverification_failures
  pass_condition: >-
    A growing action outside all classified controls is explicitly proved,
    produces exact source-bearing covariant relations without hidden scalar or
    source advice, preserves Theta(B) independent rank, supports the identical
    fresh masked-target descent, and has tau<=0.25 and complete
    lambda,mu<=0.45 after every cost is charged.
  fail_condition: >-
    No exact action is supplied; the action has bounded orbit; it is
    prime-field Frobenius identity, scalar/translation indexing, source
    relabelling, or a post-relation backend; covariance or replay fails; any
    exponent is unknown; tau>0.25; or lambda>0.45 or mu>0.45.
  outcome_interpretation:
    pass: >-
      Create only an unfiled mechanism candidate for independent theorem
      review. This is not breakthrough or crypto-tier evidence.
    fail: >-
      Retain NO_ADMISSIBLE_NEXT_MECHANISM and do not open a fixture or run.
  estimated_cost:
    implementation: none
    compute: none
    analyst_effort: bounded_paper_proof
  why_cheapest: >-
    The missing object is an exact covariance action and source-preserving
    constructor. Measuring displacement rank cannot define that action and can
    repeat the AP failure; symbolic typing rejects bounded, circular, and
    backend-only variants before any computation.

full_cost_surface:
  exponent_convention: >-
    Exponents are in subgroup order N; polylogarithmic factors alone are
    absorbed. Unknown terms fail admission and are never assigned zero.
  preprocessing:
    required_charge: >-
      Factor-base construction, action generators, orbit representatives,
      coefficient/state construction, advice, indexing tables, and all
      target-independent memory and traffic.
    current_candidate_value: unknown_no_candidate
  relation_yield:
    required_charge: >-
      Number of admissible support orbits, per-orbit hit probability, misses,
      source output, dependent rows, full-rank tail, rejected batches, and
      relation verification.
    explicit_control: N^(0.60+o(1)) complete six-list campaign work
    current_candidate_value: unknown_no_candidate
  linear_algebra:
    required_charge: >-
      Construction of the exact represented matrix or generators, orbit
      quotient, displacement/block solve, recomputation, memory traffic, and
      verification against matched sparse Wiedemann.
    optimistic_control: N^(0.40+o(1)) work after Theta(B) independent rows exist
    current_candidate_value: unknown_no_candidate
  descent:
    required_charge: >-
      Fresh scalar-blind mask generation, target action, misses, orbit
      unranking, exact signed source replay, ambiguity, unmasking, and final
      public equality.
    explicit_control: N^(0.60+o(1)) work with N^(0.40+o(1)) reusable pair state
    required_tau: at_most_0.25
    current_candidate_value: unknown_no_candidate
  memory:
    required_charge: >-
      Retained action/advice state, orbit tables, represented rows or
      generators, provenance, relation matrix, solve workspace, replay state,
      output, traffic, and aggregate parallel copies.
    required_mu: at_most_0.45
    current_candidate_value: unknown_no_candidate
  verification:
    required_charge: >-
      Every relation group equality, source labels and signs, rank and
      factor-log certificates, transformed-row covariance, target unmasking,
      and final scalar-multiplication equality.
    acceptance_rule: exactly_zero_certificate_reverification_failures
  oracle_information:
    required_charge: >-
      Domain, codomain, state, randomness, branch selection, coefficient and
      point provenance, target timing, advice length, orbit-index transcript,
      source inverse, and complete generic-simulator comparison.
    forbidden_free_inputs:
      - scalar orbit indices or target logs
      - represented relation rows, source dictionaries, or occurrence catalogues
      - target-fitted permutations, coefficients, or advice
      - compact z_R/common-factor payloads or implicit zero-minor locators
      - exceptional-target witnesses or rank certificates
    current_candidate_value: absent
  aggregate:
    required_lambda: at_most_0.45
    required_mu: at_most_0.45
    required_tau: at_most_0.25
    certifiable_candidate_values: none
    result: admission_failure

confounders:
  - >-
    A low displacement rank can be tautological for the chosen operator or
    ordering and need not compress relation generation or source provenance.
  - >-
    Orbit closure can multiply rows without multiplying independent rank;
    known endomorphism eigenvalues can make columns algebraically dependent.
  - >-
    Translation is a large curve automorphism action but not an
    origin-fixing group endomorphism; locating a point's translation-orbit
    index can reintroduce the DLP or an order-N table.
  - >-
    Extension-field Frobenius gains do not transfer to E(F_p), where
    p-Frobenius fixes rational points.
  - >-
    Constant-factor automorphism gains must also be applied to the matched rho
    baseline and do not change an N-exponent.
  - >-
    Relation-matrix structure observed after collecting rows may be a
    post-selection artifact whose harvesting cost and failed rows dominate.
  - >-
    Parallel wall time, streamed storage, or compressed generators can hide
    unchanged aggregate work, recomputation, I/O, and source-output costs.
  - >-
    A literature relevance search and corpus index are not an exhaustive
    classification of every possible support action.

falsification_conditions:
  - >-
    This no-candidate disposition is falsified by one explicit support action
    that passes deduplication and every condition of the zero-compute gate.
  - >-
    It is not falsified by a low-rank matrix after rows are supplied, a bounded
    symmetry, a toy displacement-rank trend, or an untyped exception.
  - >-
    The proposed residual classification is falsified if a proved growing
    prime-field covariance action exists outside algebraic automorphisms,
    scalar/translation orbits, source relabelling, and represented backend
    structure.

scope:
  included:
    - classical academic ECDLP mechanisms on abstract ordinary prime-field prime-order families
    - zero-compute theorem and cost screening
    - exact source-bearing relation collection, factor logs, and blind descent
  excluded:
    - standardized-curve execution
    - real or deployed targets
    - key recovery or operational attack code
    - quantum algorithms and extension-field-only Frobenius mechanisms
    - claims above preliminary/toy theory tier
  interpretation_limits:
    - No direction is declared impossible.
    - The disposition is limited to checked sources and exact interfaces.
    - The bounded-automorphism facts do not classify arbitrary combinatorial support permutations.
    - No cryptographic-scale performance, solve, relation, or certificate was produced.

narrowest_residual:
  id: RESIDUAL-SUPPORT-ACTION-COVARIANCE
  statement: >-
    Determine whether an exact growing permutation action on a
    target-independent prime-field factor base can preserve the complete
    signed elliptic relation law without being induced by a bounded
    origin-fixing automorphism, identity Frobenius, a scalar/translation orbit
    requiring DLP-like unranking, source relabelling, or an already represented
    relation matrix.
  why_narrowest: >-
    AP supports have a scoped negative, solver-only structure is already
    post-relation, and finite automorphism/isotypic actions give at most
    constant or subpolynomial savings. The missing implication is exactly the
    covariance-to-action classification needed before any non-AP structured
    relation matrix could be a mechanism rather than a backend.
  future_batch_gate: support_action_covariance_classification_gate

estimated_cost:
  implementation: none
  compute: none
  analyst_effort: bounded_zero_compute_screen

ranking_rationale: >-
  No candidate ranks above the no-admission disposition. The
  RESIDUAL-SUPPORT-ACTION-COVARIANCE theorem gate has the highest remaining
  information gain per cost because it targets the only concrete unchecked
  KN-OPEN-006 seam after the AP negative while rejecting bounded symmetries,
  scalar/source oracles, and solver substitutions symbolically. I would test
  this residual first only after an exact action is written; the minimal test
  is the cheapest valid discriminator because covariance and provenance are
  mathematical preconditions that no toy matrix measurement can supply.

