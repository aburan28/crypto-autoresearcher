exact_claim: >-
  After screening the committed GOAL-CRYPTO-001 record, RQ-CRYPTO-001,
  EV-CRYPTO-001 through EV-CRYPTO-009, their decisions and proposals, the
  indexed knowledge corpus and relevant entries, and the complete BATCH-002
  through BATCH-009 producer/review artifacts, no explicit classical
  prime-field ECDLP mechanism was found that is semantically distinct from the
  closed compact-z_R, hyperplane-signature, SOURCE-LOCATOR, GGM-family, and
  original-section Newton/BKK routes and that also has a fully charged path
  below the campaign gates. This is a checked-source no-candidate disposition,
  not an impossibility theorem or a statement about all external literature.

epistemic_separation:
  established:
    - >-
      EV-CRYPTO-002 closes only the named compact z_R constructor sheet;
      EV-CRYPTO-004 leaves the exact published hyperplane-signature cost
      attribution inconclusive; EV-CRYPTO-006 closes the repaired checked
      SOURCE-LOCATOR sheet; EV-CRYPTO-007 records no distinct typed GGM family;
      and EV-CRYPTO-009 supports only the locked original-section Newton/BKK
      negative gate.
    - >-
      EXP-STR-001 / EV-STR-001 reject only tested arithmetic-progression
      supports: measured displacement rank was generically maximal and the
      relation-supply penalty dominated at toy scale.
    - >-
      Origin-fixing elliptic-curve automorphisms in characteristic other than
      2 and 3 have bounded order 2, 4, or 6; Frobenius is the identity on
      F_p-rational coordinates. These facts permit constant-factor symmetry
      savings but do not by themselves produce an asymptotic prime-field
      relation-matrix gain.
  derivation:
    - >-
      A non-AP group-circulant relation matrix would require a growing,
      target-uniform permutation action on factor-base columns together with
      an exact covariance law taking verified relations to verified relations.
      No checked record supplies such an action without either a supplied
      source index, a scalar orbit, an extension-field Frobenius action, or a
      post-relation solver substitution.
    - >-
      For the current explicit five-factor/six-list control with B=N^(1/5),
      complete relation collection and blind descent remain
      B^(3+o(1))=N^(0.60+o(1)); optimistic factor-log linear algebra is
      B^(2+o(1))=N^(0.40+o(1)). Reducing only the latter cannot beat rho.
  speculation:
    - >-
      An exact non-AP support family might possess a growing covariance action
      that is not induced by an elliptic-curve automorphism, scalar
      translation/orbit, source relabelling, or represented relation matrix.
      No such family, action, relation-yield theorem, or source-faithful
      constructor was found.

mechanism_screen:
  sought_mechanism: >-
    A non-arithmetic-progression, target-uniform support action whose orbit
    closure makes the factor-log relation operator group-circulant or
    constant-displacement-rank while preserving exact signed source replay,
    independent rank, and fresh masked-target descent.
  mechanism_status: not_instantiated
  why_not_admitted: >-
    The checked material supplies no typed support family and no exact
    covariance identity. Origin-fixing automorphisms have bounded order;
    extension-field Frobenius is outside the prime-field scope; scalar or
    translation orbits either expose known log dependencies, require an
    orbit-index/source locator, or cover an order-N orbit whose unranking is
    the original DLP. Applying Fourier, Toeplitz, Hankel, Woodbury, isotypic,
    Krylov, or displacement solvers after rows are represented is a backend
    substitution, not a relation mechanism.

