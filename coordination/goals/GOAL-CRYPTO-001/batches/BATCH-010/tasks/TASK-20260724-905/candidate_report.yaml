deduplication:
  compact_z_R_family:
    excluded_forms:
      - target-label support factors, gcds, resultants, common norms, or unit products
      - translated divisors, coefficient vectors, source dictionaries, or restricted replay over the same support predicate
    disguised_composition_rule: >-
      A circulant or low-rank update applied to r_R, z_R, a represented
      divisor, or its coefficient stream remains the compact constructor
      obligation and is not a new mechanism.
  hyperplane_signature_family:
    excluded_forms:
      - zero-minor enumeration, normalized signature collisions, defect loops, or an implicit minor locator
    disguised_composition_rule: >-
      Fourier/block/displacement processing of the signature table or
      target-bearing evaluation matrix leaves the same unaligned locator and
      certificate path.
  SOURCE_LOCATOR_family:
    excluded_forms:
      - endpoint aggregation followed by occurrence unranking
      - determinant, pair-wedge, Abel-Jacobi, Cauchy, incidence, apolar, resolvent, or Hankel reporters with a hidden source inverse
    disguised_composition_rule: >-
      A structured matrix whose rows or nonzeros are supplied source
      incidences consumes the missing locator rather than constructing it.
  GGM_family:
    excluded_forms:
      - jets, elliptic nets, scalar orbits, Fourier eigenvalues, public-equation lifts, coordinate-only outputs, and simulable supplied-tuple predicates
    disguised_composition_rule: >-
      An orbit action receives no credit unless its complete adaptive output
      transcript is target-conditioned, source-bearing, and unavailable to the
      charged generic simulator; raw non-generic coordinates are insufficient.
  original_section_Newton_BKK_family:
    excluded_forms:
      - right-comb original sections, corner support, mixed-volume/box-Bezout comparisons, and uniform-mask exception targeting
    disguised_composition_rule: >-
      Reordering, lifting only the solver backend, or selecting the proved
      exception set without a new typed target bridge remains inside the
      closed gate.
  structured_linear_algebra_prior_routes:
    excluded_forms:
      - tested arithmetic-progression supports
      - isotypic/equivariant block splitting
      - Cauchy displacement, Woodbury resolvents, balanced Hankel truncation, or post-hoc Toeplitz/circulant solvers
    conclusion: >-
      No non-AP support action with an independently specified relation
      generator survives deduplication.

