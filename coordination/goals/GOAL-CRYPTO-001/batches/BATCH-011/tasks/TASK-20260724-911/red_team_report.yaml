red_team_report:
  id: RT-20260724-911
  task_id: TASK-20260724-911
  goal_id: GOAL-CRYPTO-001
  batch_id: BATCH-011
  claim_under_review: >-
    The committed BATCH-011 producer package reports
    NO_TYPED_CANDIDATE_FOUND: within its recorded internal and external
    coverage, no source simultaneously supplies a typed ordinary-prime-field
    relation action and all twelve end-to-end admission fields.
  verdict: REVISE
  verdict_basis: >-
    The source table supports only that none of its 17 enumerated sources is
    documented as passing the all-fields gate. It does not support calling the
    coverage reproducible or complete: WebSearch has no per-query result
    receipts, the stated Crossref displayed count conflicts with the recorded
    request shapes, relevant OpenAlex/IACR sources are absent from the source
    table, and the one-source twelve-field gate conflates mechanism discovery
    with experiment readiness. No omitted source spot-checked here supplies
    the missing ordinary-prime-field end-to-end path, so the proper correction
    is narrower coverage wording, not admission of a candidate.

  inference:
    requested_policy: review-xhigh
    resolved_model: GPT-5.6 Sol
    reasoning_effort: xhigh
    fallback_used: true
    independent_session: true

  snapshot_review:
    producer_snapshot_commit: 5c8f04776665bf50503467a380c7c5bb0a233627
    snapshot_reachable_from_review_head: true
    snapshot_changed_paths:
      - coordination/goals/GOAL-CRYPTO-001/batches/BATCH-011/archives/TASK-20260724-910/snapshot-receipt.json
      - coordination/goals/GOAL-CRYPTO-001/batches/BATCH-011/tasks/TASK-20260724-909/literature_audit.yaml
      - coordination/goals/GOAL-CRYPTO-001/batches/BATCH-011/tasks/TASK-20260724-909/typed_candidate_note.md
    literature_audit_sha256: ae7e3ac24131f9ce85bc2a2c362b0e3c230d101d14af5b147a1a31d442fbbaed
    typed_candidate_note_sha256: 543786b9dc6eac48f06c7c45d67d0af003a2b524fdf811c683d99acca9cb7677
    hashes_match_committed_receipt: true
    receipt_status: pending_post_commit
    receipt_commit_sha_present: false
    durable_evidence_used: committed_snapshot_only

  exact_supported_claim: >-
    At producer snapshot 5c8f04776665bf50503467a380c7c5bb0a233627,
    zero of the 17 enumerated primary or authoritative source records is
    documented as simultaneously supplying all twelve stated fields for an
    ordinary E(F_p) large-prime-order ECDLP. Independent spot checks found no
    contrary candidate among the specifically checked torsion, Frobenius,
    endomorphism, dynamic-factor-base, summation-polynomial, hyperplane,
    quasi-subfield, and structured-generic-model sources. This is only a
    disposition over enumerated and spot-checked records, not exhaustive
    literature coverage, impossibility, or cryptographic evidence.

  candidate_verdict:
    result: NO_EXPERIMENT_READY_TYPED_CANDIDATE_IN_RECORDED_SET
    status: retain_with_narrowed_wording
    novelty: NOT_ESTABLISHED_NO_CANDIDATE
    rationale: >-
      SRC-08 and SRC-09 type real actions but are extension-field mechanisms;
      SRC-02 and SRC-03 are prime-field relation/direct-solve mechanisms but
      do not type the required action and complete cost path. No checked source
      combines target scope, source-faithful relation supply, rank, fresh
      scalar-blind descent, and matched-rho cost.

  coverage_reproducibility:
    verdict: FAIL_AS_FULLY_REPRODUCIBLE
    verified:
      - >-
        All four exact OpenAlex URLs replayed with first-page counts 25, 25,
        15, and 25 and totals 244, 560, 15, and 4917, matching 90 displayed
        records and the producer totals on 2026-07-24.
      - The 25 WebSearch query strings and intended date language are recorded.
      - Producer artifact hashes and exact snapshot commit scope were independently checked.
    defects:
      - >-
        The aggregate 122 WebSearch displayed records cannot be replayed or
        audited because no per-query displayed count, ranked URL list, raw
        response, provider identity, timestamp, or response hash is retained.
      - >-
        Four Crossref title queries with rows=3 plus one direct DOI lookup
        describe at most 13 displayed records, not the recorded 15; exact
        request URLs and retained responses are absent.
      - >-
        OpenAlex relevance counts 4, 2, 0, and 8 have no coding rubric or
        title-level decisions, so only the raw page sizes and totals reproduce.
      - >-
        OpenAlex ranking is mutable and no cursor, response snapshot, or work-ID
        manifest was archived.
      - >-
        The IACR date description ends at 2025-12-31 although the claimed audit
        horizon is 2026-07-24.

  source_corrections_and_access_gaps:
    citation_accuracy: MOSTLY_ACCURATE_WITH_SCOPE_QUALIFICATIONS
    spot_checks:
      - >-
        FHJRV, EUROCRYPT 2014, DOI 10.1007/978-3-642-55220-5_3:
        author list, pages, extension-field scope, torsion-equivariant map,
        factor-base reduction, and m^(n-1) decomposition-probability penalty
        are supported by accessible IACR/HAL primary text.
      - >-
        Galbraith-Granger-Merz-Petit, ePrint 2020/1315: the q-power
        Frobenius-invariant factor base, 1/n relation-system reduction, n^2
        linear-algebra speedup, E(F_(q^n)) scope, and practical-rho caveat are
        supported. Its rank gain is conditional on transformed relations being
        independent and must not be reported as an unconditional rank theorem.
      - >-
        Tsakou-Ionica ePrint 2021/721 and TMC 1(2): the preprint says
        "Effective Endomorphisms" while the journal title says "efficient
        endomorphisms"; the producer's journal citation is accurate. The
        mechanism uses invariant factor-base orbits in extension-field
        elliptic/hyperelliptic settings and does not furnish the target path.
      - >-
        Petit-Kosters-Messeng PKC 2016, Amadori-Pintore-Sala 2018,
        McGuire-Mueller ePrint 2017/1262, Mahalanobis-Mallick ePrint 2018/134,
        and Hu ePrint 2024/1923 metadata and broad mechanism classifications
        were confirmed.
      - >-
        Sakemi et al. DOI 10.1515/jmc-2019-0029 derives its lower bound under
        stated statistical assumptions and checks experiments only up to
        25-bit prime fields. It is a conditional control, not an unconditional
        impossibility result.
    omitted_relevant_records:
      - >-
        Huang-Kosters-Petit-Yeo-Yun, "Quasi-subfield Polynomials and the
        Elliptic Curve Discrete Logarithm Problem," DOI
        10.1515/jmc-2015-0049, appeared in the replayed first OpenAlex page and
        was directly queried in Crossref but is absent from source_screen.
        Its ECDLP is over F_(p^n), so it is not a target-scope candidate.
      - >-
        Euler-Petit, "New results on quasi-subfield polynomials," DOI
        10.1016/j.ffa.2021.101881, appeared in the replayed second OpenAlex
        page and is absent from source_screen. It reports no speedup and is
        extension-field/small-characteristic adjacent, not a target candidate.
      - >-
        Corrigan-Gibbs-Henzinger-Wu, "The Structured Generic-Group Model,"
        ePrint 2026/384, predates the audit cutoff and directly bears on the
        generic-simulator/oracle comparison. It is a lower-bound framework,
        not a relation-action candidate, but should be screened.
    access_gaps:
      - >-
        The exact Kudo-Yokota-Takahashi-Yasuda CANS 2018 chapter remained
        unavailable as primary full text; author and institutional metadata
        confirm the citation, and a related WCC 2017 "Practical Limit" record
        was found but not source-screened.
      - Google Scholar, MathSciNet, zbMATH, exhaustive forward citations, non-English work, and later OpenAlex pages remain unchecked.

  admission_false_negative_risk:
    verdict: HIGH_FOR_DISCOVERY_LOW_FOR_EXPERIMENT_READINESS
    assessment: >-
      Requiring one paper to provide all twelve fields is a defensible
      experiment-readiness gate but an invalid discovery gate. Full adaptive
      transcripts, certificate protocols, traffic, and matched-rho accounting
      are review artifacts often absent from mechanism papers and can be
      supplied independently. Requiring an action generator also excludes
      typed direct-solve and dynamic-factor-base mechanisms by definition.
      Those routes may still fail cost and source tests, but they should be
      recorded as partial candidates or controls rather than used to imply
      that no typed mechanism exists.

  typed_interface_review:
    factor_base: >-
      Explicit for SRC-02, SRC-03, SRC-08, SRC-09, and the omitted
      quasi-subfield family; only SRC-02/SRC-03 are in ordinary-prime-field
      scope.
    relation: >-
      Semaev and dynamic/direct-solve relations are typed in scope; torsion,
      Frobenius, and endomorphism orbit rewrites are typed only in adjacent
      extension-field regimes.
    action: >-
      SRC-08 torsion translation and SRC-09 Frobenius are genuine. On
      E(F_p), p-Frobenius is pointwise identity; prime-order full groups have
      no nontrivial rational torsion, while cofactor torsion outside a
      large-prime subgroup does not automatically preserve the subgroup.
    target: >-
      Prime-field papers type random aP+bQ targets or challenge-dependent
      bases, but no source supplies the required reusable action on a fresh
      scalar-blind target.
    source: >-
      Root-to-signed-point lifting is partial; orbit representative rewrite is
      not the same as exact occurrence-level replay. Hyperplane subset/minor
      localization remains the unresolved source bottleneck.
    oracle: >-
      No complete adaptive transcript or simulator separation is supplied.
      ePrint 2026/384 is a missing comparator for structured generic access.
    relation_yield_and_rank: >-
      Orbit size is not independent rank. Frobenius results use explicit
      independence conditions; torsion factor-base reduction also reduces
      decomposition probability; prime-field papers retain heuristic or
      unresolved solver/yield tails.
    fresh_scalar_blind_descent: >-
      Absent for every action-bearing source. Dynamic-factor-base and
      hyperplane routes are target-dependent direct solves, not reusable
      factor-log descent.
    preprocessing_memory_traffic_verification: >-
      None of the closest sources supplies a complete aggregate charge.
      Relation equality checks do not replace rank, source, replay, and final
      public-equality certificates.

  novelty_and_deduplication:
    verdict: UNVERIFIED
    assessment: >-
      No candidate exists to establish novelty. Family labels correctly avoid
      re-admitting tuple permutations, extension-field Frobenius, bounded
      torsion, hyperplane/source-locator, and post-relation solvers, but there
      is no source-by-source semantic fingerprint showing the exact prior
      record and interface equivalence. Omitted quasi-subfield and structured
      generic-model records contradict the statement that all relevant unique
      source families are enumerated.

  objections:
    - id: RT911-O1
      severity: major
      category: coverage_reproducibility
      objection: >-
        Aggregate search counts without per-query receipts do not permit
        independent replay of what was screened.
      narrow_consequence: >-
        Replace "reproducible coverage" with "recorded query strings and
        partially replayable aggregate coverage."
    - id: RT911-O2
      severity: major
      category: count_accuracy
      objection: >-
        The recorded Crossref request shapes yield 12 title-query items plus
        one DOI record, not 15.
      narrow_consequence: Correct or evidence the displayed count.
    - id: RT911-O3
      severity: major
      category: source_coverage
      objection: >-
        Relevant first-page quasi-subfield records and the 2026 structured
        generic-group source are absent from source_screen.
      narrow_consequence: >-
        Do not call the 17-source table an enumeration of all relevant unique
        families in the recorded hits.
    - id: RT911-O4
      severity: major
      category: admission_bias
      objection: >-
        The all-in-one twelve-field gate rejects partial but typed mechanisms
        and all non-action direct-solve routes before novelty ranking.
      narrow_consequence: >-
        Separate mechanism discovery, target-scope typing, and experiment
        readiness.
    - id: RT911-O5
      severity: scope_guard
      category: negative_evidence
      objection: >-
        Absence from mutable first pages and conditional paper claims cannot
        establish impossibility or cryptographic security.
      narrow_consequence: Retain only the exact 17-record no-pass statement.

  required_controls:
    - id: RT911-C1
      control: >-
        Archive each query response with timestamp, provider, exact URL,
        ordered IDs/URLs, per-query displayed count, pagination/cursor, and
        hash; deduplicate by stable work identifier.
      discriminates: Reproducible coverage from an unauditable aggregate.
    - id: RT911-C2
      control: >-
        Use a two-stage gate: first type scope, factor base, relation/action,
        target, and source replay; then mark oracle, rank, descent, complete
        cost, and certificates as readiness fields with explicit unknowns.
      discriminates: A partial mechanism worth analysis from an experiment-ready path.
    - id: RT911-C3
      control: >-
        For every action, quotient duplicate occurrences and prove rank after
        orbit closure; replay exact signed sources for a fresh masked target.
      discriminates: Relation relabelling from useful independent supply and descent.
    - id: RT911-C4
      control: >-
        Charge preprocessing, rejected relations, rank tails, source recovery,
        memory, traffic, verification, and descent in one regime against
        symmetry-matched rho, BSGS, sparse Wiedemann, and the closest source.
      discriminates: An end-to-end gain from a constant or backend-only saving.

  counterexample_or_mutation:
    name: split_paper_complete_mechanism
    cost: zero_compute_bibliographic_control
    construction: >-
      Take a paper that fully types a target-scope relation mechanism but omits
      traffic and certificate prose, and pair it with standard independently
      specified verification and cost accounting. The current one-source gate
      returns no candidate even if the composed interface is complete.
    expected_observation: >-
      Discovery fails solely because documentation is split across sources,
      demonstrating that the gate measures paper completeness rather than
      mechanism existence.

  baseline_comparison:
    pollard_rho:
      expected_work: N^(1/2+o(1))
      serial_memory: N^o(1)
      matching: Apply every available negation or automorphism quotient.
      verdict: unbeaten
    baby_step_giant_step:
      expected_work: N^(1/2+o(1))
      memory: N^(1/2+o(1))
      verdict: no demonstrated advantage
    closest_specialized_baselines:
      prime_field_summation:
        sources: [SRC-02, SRC-03, SRC-04, SRC-05, SRC-16]
        verdict: >-
          Typed relation or direct-solve paths exist, but solver/yield, rank or
          descent, and matched-rho costs remain unresolved or conditional.
      torsion_frobenius_endomorphism:
        sources: [SRC-08, SRC-09, SRC-10, SRC-11]
        verdict: >-
          Real orbit savings are confined to extension-field, subfield,
          transferred, or hyperelliptic regimes and do not furnish a
          nontrivial ordinary-prime-field action.
      hyperplane:
        sources: [SRC-15]
        verdict: >-
          The initial subset/minor locator and complete source-faithful cost
          remain unresolved; no matched-rho gain follows from the paper title
          or toy instances.
      structured_generic_group:
        source: IACR_ePrint_2026_384
        verdict: >-
          Relevant oracle/lower-bound comparator omitted from the audit; it
          does not itself supply a candidate or establish a blanket ECDLP
          impossibility.

  narrowest_supported_statement: >-
    In the 17 source records enumerated at committed snapshot
    5c8f04776665bf50503467a380c7c5bb0a233627, no record is documented as an
    experiment-ready ordinary-prime-field relation action satisfying all
    twelve producer fields. Independent spot checks did not identify a
    contrary candidate. Coverage is partial and only partly reproducible, so
    nothing follows about unchecked literature, impossibility, or
    cryptographic-scale security.

  scope_limits:
    - Ordinary prime-field, large-prime-order ECDLP is the admission target.
    - Extension-field and special-curve sources are boundary controls only.
    - No curve execution, key recovery, operational code, or empirical solve was performed.
    - Publication claims and toy data were not promoted to cryptographic evidence.
    - No queue, ledger, Git, hypothesis, experiment, or official status was changed.

  next_concrete_action: >-
    FINAL-BATCH-ACTION: produce one coverage-repair addendum that archives
    per-query receipts, reconciles the Crossref count, source-screens the
    omitted quasi-subfield and ePrint 2026/384 records plus the Kudo/WCC access
    path, and reapplies a two-stage discovery/readiness gate.
  artifact_paths:
    - coordination/goals/GOAL-CRYPTO-001/batches/BATCH-011/tasks/TASK-20260724-911/red_team_report.yaml
    - coordination/goals/GOAL-CRYPTO-001/batches/BATCH-011/tasks/TASK-20260724-911/coverage_review.md
