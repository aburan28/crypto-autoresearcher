source_screen:
  - source_id: SRC-01
    citation: >-
      Igor Semaev, "Summation polynomials and the discrete logarithm problem
      on elliptic curves," IACR ePrint 2004/031 (2004).
    url: https://eprint.iacr.org/2004/031
    retrieved: "2026-07-24"
    access: full_text_accessible
    scope_class: prime_field_programmatic_prior_art
    result: excluded
    reason: >-
      Types the summation-polynomial relation predicate and small-coordinate
      factor-base idea, but supplies no growing relation action, efficient
      bounded-root constructor, complete replay/oracle transcript, blind
      descent, or fully charged matched-rho path.

  - source_id: SRC-02
    citation: >-
      Christophe Petit, Michiel Kosters, and Ange Messeng, "Algebraic
      Approaches for the Elliptic Curve Discrete Logarithm Problem over Prime
      Fields," PKC 2016, LNCS 9615, pp. 3-18,
      doi:10.1007/978-3-662-49387-8_1.
    url: https://iacr.org/archive/pkc2016/96140156/96140156.pdf
    retrieved: "2026-07-24"
    access: full_text_accessible
    scope_class: ordinary_prime_field_large_prime_subgroup
    result: excluded
    reason: >-
      Gives F={(x,y):L(x)=0}, signed Semaev relation recovery, target
      R=aP+bQ, and low-degree map preprocessing. It has no action generator
      beyond tuple permutations, leaves Gröbner complexity asymptotically
      unknown, and does not type fresh factor-log descent, complete adaptive
      transcript, traffic, certificates, or matched-rho cost. It is also prior
      art inside the screened prime-field Semaev/root-finding family.

  - source_id: SRC-03
    citation: >-
      Alessandro Amadori, Federico Pintore, and Massimiliano Sala, "On the
      discrete logarithm problem for prime-field elliptic curves," Finite
      Fields and Their Applications 51 (2018), 168-182,
      doi:10.1016/j.ffa.2018.01.009; IACR ePrint 2017/609.
    url: https://eprint.iacr.org/2017/609
    retrieved: "2026-07-24"
    access: full_text_accessible
    scope_class: prime_field_dynamic_factor_base
    result: excluded
    reason: >-
      Builds the factor base from sampled R=uP+vQ and seeks one S_m dependency.
      The only action is tuple permutation; the factor base is challenge
      dependent, system complexity is explicitly unresolved, and no reusable
      factor-log relation action, fresh blind descent, oracle transcript,
      memory/traffic, verification, or matched-rho bound is supplied.

  - source_id: SRC-04
    citation: >-
      Gary McGuire and Daniela Mueller, "A New Index Calculus Algorithm for
      the Elliptic Curve Discrete Logarithm Problem and Summation Polynomial
      Evaluation," IACR ePrint 2017/1262 (2017, revised 2018).
    url: https://eprint.iacr.org/2017/1262
    retrieved: "2026-07-24"
    access: full_text_accessible
    scope_class: prime_field_algorithm_variant
    result: excluded
    reason: >-
      Avoids selected Gröbner/summation-polynomial steps but provides no
      distinct relation-preserving action. It remains in the prime-field
      decomposition/direct-solve family and lacks the required complete
      action, replay, descent, oracle, memory/traffic, and matched-rho interface.

  - source_id: SRC-05
    citation: >-
      Momonari Kudo, Yuki Yokota, Yasushi Takahashi, and Masaya Yasuda,
      "Acceleration of Index Calculus for Solving ECDLP over Prime Fields and
      Its Limitation," CANS 2018, LNCS 11124, pp. 377-393,
      doi:10.1007/978-3-030-00434-7_19.
    url: https://doi.org/10.1007/978-3-030-00434-7_19
    retrieved: "2026-07-24"
    access: metadata_and_search_snippets_only
    scope_class: prime_field_symmetrization
    result: excluded_access_limited
    reason: >-
      Available metadata and later analyses identify optimization of the
      existing prime-field summation-polynomial route, not a new factor-base
      action. Full chapter text was not accessible in this environment, so no
      unobserved interface is credited.

  - source_id: SRC-06
    citation: >-
      Jianjun Hu, "Implementation analysis of index calculus method on
      elliptic curves over prime finite fields," IACR ePrint 2024/1923 (2024).
    url: https://eprint.iacr.org/2024/1923
    retrieved: "2026-07-24"
    access: full_text_accessible
    scope_class: post_2020_prime_field
    result: excluded
    reason: >-
      The proposed pseudo-index-calculus uses a table of known small scalar
      multiples and scalar scanning. It gives no relation action or independent
      factor-log relation supply, has vanishing hit probability, and does not
      furnish the required oracle, blind-descent, rank, or sub-rho interface.
      Its toy examples are not crypto evidence.

  - source_id: SRC-07
    citation: >-
      Jean-Charles Faugere, Pierrick Gaudry, Louise Huot, and Guenael Renault,
      "Using Symmetries in the Index Calculus for Elliptic Curves Discrete
      Logarithm," Journal of Cryptology 27(4) (2014), 595-635,
      doi:10.1007/s00145-013-9158-5.
    url: https://hal.science/hal-00700555/
    retrieved: "2026-07-24"
    access: full_text_accessible
    scope_class: extension_field_representation_and_invariant_theory
    result: excluded_scope_and_family
    reason: >-
      The D_n action from permutations and rational 2-torsion is explicit, but
      the paper states that the attack applies only to small extension fields
      and has no implication for prime-field NIST instances. The action is
      finite/isotypic symmetry used in polynomial solving, already excluded,
      and no prime-field blind-descent or full cost interface is given.

  - source_id: SRC-08
    citation: >-
      Jean-Charles Faugere, Louise Huot, Antoine Joux, Guenael Renault, and
      Vanessa Vitse, "Symmetrized Summation Polynomials: Using Small Order
      Torsion Points to Speed Up Elliptic Curve Index Calculus," EUROCRYPT
      2014, LNCS 8441, pp. 40-57,
      doi:10.1007/978-3-642-55220-5_3.
    url: https://doi.org/10.1007/978-3-642-55220-5_3
    retrieved: "2026-07-24"
    access: full_text_accessible
    scope_class: extension_field_torsion_translation_action
    result: closest_typed_action_but_inadmissible
    reason: >-
      Explicitly defines F={P in E(F_{q^n}):phi(P) in P^1(F_q)},
      tau_T:P->P+T, phi o tau_T=f_T o phi, transformed decomposition
      tuples with sum k_i=0 mod m, and source recovery from phi preimages.
      However its evaluated regime is n>2 extension fields, m is small and
      bounded, the factor-base reduction lowers decomposition probability by
      m^(n-1), and the source does not type a prime-field fresh scalar-blind
      descent, complete adaptive transcript, independent-rank tail,
      preprocessing/traffic, certificate protocol, or matched-rho end-to-end
      cost. For n=1 the Weil-restriction relation mechanism disappears; a
      prime-order E(F_p) also has no nontrivial rational small torsion.

  - source_id: SRC-09
    citation: >-
      Steven D. Galbraith, Robert Granger, Simon-Philipp Merz, and Christophe
      Petit, "On Index Calculus Algorithms for Subfield Curves," IACR ePrint
      2020/1315 (2020).
    url: https://eprint.iacr.org/2020/1315
    retrieved: "2026-07-24"
    access: full_text_accessible
    scope_class: extension_field_subfield_curve_frobenius_action
    result: excluded_scope
    reason: >-
      This is the strongest fully explicit growing action found: Frobenius
      permutes a Galois-invariant factor base and relations, with orbit
      representatives and conditional independent-rank theorems. Its ECDLP is
      in E(F_{q^n}) for a curve defined over F_q. On E(F_p), p-Frobenius fixes
      every rational point, so the action is identity. The paper also says its
      speedups do not beat Pollard rho on practical instances and leaves exact
      Gröbner cost unresolved.

  - source_id: SRC-10
    citation: >-
      Sulamithe Tsakou and Sorina Ionica, "Index calculus attacks on
      hyperelliptic Jacobians with efficient endomorphisms," Transactions on
      Mathematical Cryptology 1(2) (2022), 102-114; IACR ePrint 2021/721.
    url: https://eprint.iacr.org/2021/721
    retrieved: "2026-07-24"
    access: full_text_accessible
    scope_class: extension_field_or_hyperelliptic_effective_endomorphism
    result: excluded_scope
    reason: >-
      Defines endomorphism-invariant factor-base equivalence classes for
      extension-field elliptic curves and hyperelliptic Jacobians. It does not
      provide an ordinary E(F_p) prime-order relation action with complete
      scalar-blind descent and matched-rho accounting; finite endomorphism
      classes are also bounded/constant in the target regime.

  - source_id: SRC-11
    citation: >-
      Steven D. Galbraith et al., "Extending the GLS endomorphism to speed up
      GHS Weil descent using Magma," IACR ePrint 2021/676 (2021).
    url: https://eprint.iacr.org/2021/676
    retrieved: "2026-07-24"
    access: full_text_accessible
    scope_class: GHS_Weil_descent_hyperelliptic_Jacobian
    result: excluded_scope
    reason: >-
      The action occurs after a GLS/GHS transfer to a hyperelliptic Jacobian
      over a smaller field. It is not an action on an ordinary prime-field
      ECDLP factor base and cannot be imported across that scope boundary.

  - source_id: SRC-12
    citation: >-
      Pierrick Gaudry, "Index calculus for abelian varieties of small
      dimension and the elliptic curve discrete logarithm problem," Journal
      of Symbolic Computation 44(12) (2009), 1690-1702,
      doi:10.1016/j.jsc.2008.08.005.
    url: https://doi.org/10.1016/j.jsc.2008.08.005
    retrieved: "2026-07-24"
    access: abstract_and_corpus_note
    scope_class: extension_field_foundational
    result: excluded_scope
    reason: Weil restriction and point decomposition require n>1 extension fields.

  - source_id: SRC-13
    citation: >-
      Claus Diem, "On the discrete logarithm problem in elliptic curves,"
      Compositio Mathematica 147(1) (2011), 75-104,
      doi:10.1112/S0010437X10005075.
    url: https://doi.org/10.1112/S0010437X10005075
    retrieved: "2026-07-24"
    access: abstract_and_metadata
    scope_class: extension_field_asymptotic
    result: excluded_scope
    reason: Proven asymptotics are for controlled extension-field families, not E(F_p).

  - source_id: SRC-14
    citation: >-
      Antoine Joux and Vanessa Vitse, "Cover and Decomposition Index Calculus
      on Elliptic Curves Made Practical," EUROCRYPT 2012, LNCS 7237, pp. 9-26,
      doi:10.1007/978-3-642-29011-4_3.
    url: https://eprint.iacr.org/2011/020
    retrieved: "2026-07-24"
    access: full_text_accessible
    scope_class: composite_extension_field_cover_attack
    result: excluded_scope
    reason: Requires a composite extension and transfer to a hyperelliptic Jacobian.

  - source_id: SRC-15
    citation: >-
      Ayan Mahalanobis and Vivek Mallick, "A Las Vegas algorithm to solve the
      elliptic curve discrete logarithm problem," IACR ePrint 2018/134 (2018);
      revised as "A new method for solving the elliptic curve discrete
