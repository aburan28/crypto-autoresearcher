exact_claim: >-
  Within the reproducible internal-corpus and external-literature coverage
  recorded below, no source was found that gives one explicit relation action
  for an ordinary prime-field, large-prime-order ECDLP and simultaneously types
  the factor base, signed relation family, action generators, target map, exact
  source replay, complete adaptive oracle transcript, relation yield and
  independent rank, fresh scalar-blind descent, preprocessing, memory and
  traffic, verification, and matched-Pollard-rho cost. This is a
  checked-coverage disposition, not an impossibility theorem or a claim about
  literature not retrieved or indexed.

scope:
  included:
    - classical academic ECDLP algorithms and relation mechanisms
    - ordinary elliptic curves over prime fields
    - large prime-order subgroups and prime-order curve groups
    - index calculus, summation polynomials, point decomposition, and Weil restriction
    - structured relation matrices and relation-preserving actions
    - automorphisms, endomorphisms, torsion translations, and invariant theory
    - non-generic representations and algebraic-geometric relation constructions
    - post-2020 literature through 2026-07-24
  excluded_from_admission:
    - extension-field-only and subfield/Koblitz mechanisms
    - hyperelliptic-Jacobian-only mechanisms
    - supersingular, anomalous, pairing-transfer, or otherwise special-curve reductions
    - quantum and quantum-annealing algorithms
    - supplied-witness, source-locator, target-log, or represented-row oracles
    - post-relation linear-algebra substitutions without relation supply
    - toy timings or publication assertions as cryptographic evidence
  safety:
    classification: systematic_reproducible_academic_defensive_literature_audit
    real_keys: none
    deployed_targets: none
    standardized_curve_execution: none
    key_recovery_software: none
    operational_attack_work: none

