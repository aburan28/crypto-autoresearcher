separation_of_scopes:
  ordinary_prime_field_prime_order:
    retained_sources: [SRC-01, SRC-02, SRC-03, SRC-04, SRC-05, SRC-06, SRC-15, SRC-16]
    finding: >-
      No retained source contains an action generator beyond bounded tuple
      permutations or a previously screened hyperplane/direct-solve mechanism.
  extension_field_or_subfield:
    sources: [SRC-07, SRC-08, SRC-09, SRC-12, SRC-13, SRC-14]
    finding: >-
      These sources contain the clearest explicit actions—torsion translation,
      Frobenius, and invariant-theory actions—but depend on n>1 Weil
      restriction or composite-extension structure. They do not specialize to
      a nontrivial action on E(F_p).
  special_curve_or_transferred_group:
    sources: [SRC-10, SRC-11]
    finding: >-
      Effective-endomorphism gains occur in extension-field elliptic curves,
      hyperelliptic Jacobians, or after GHS/GLS transfer; they are not evidence
      for ordinary prime-field prime-order ECDLP.

access_limits:
  - source: SRC-05
    limit: Springer chapter full text not accessible; metadata and indexed snippets only
  - source: Google Scholar
    limit: not directly queried because no stable API or reproducible result counts were available
  - source: zbMATH_and_MathSciNet
    limit: not queried; authenticated or specialized access unavailable
  - source: WebSearch_total_counts
    limit: provider exposed only displayed links, not total result counts or stable ranking metadata
  - source: OpenAlex_broad_queries
    limit: only first 25 ranked results screened for three large result sets; queries had substantial false positives
  - source: citation_chaining
    limit: backward citations were checked through primary papers and the corpus; exhaustive forward-citation graph traversal was not available
  - source: non_English_literature
    limit: not systematically searched

confounders:
  - >-
    "Prime field" can describe the base characteristic while the actual ECDLP
    lies in E(F_{p^n}); every source was classified by the group containing the
    ECDLP, not title wording.
  - >-
    A finite torsion or automorphism action may reduce constants while matched
    rho receives a related symmetry discount; it does not establish a lower
    N-exponent.
  - >-
    A Frobenius action growing with extension degree becomes the identity on
    F_p-rational points.
  - >-
    Orbiting one relation may create dependent rows; stated orbit size is not
    accepted as independent rank.
  - >-
    Source recovery from a polynomial root or invariant tuple may hide
    desymmetrization, sign, preimage, and occurrence-unranking costs.
  - >-
    Post-2020 search results were dominated by quantum annealing, protocols,
    quasi-subfield extension-field work, and unrelated ECC; publication date
    alone is not target-scope evidence.
  - >-
    Toy computations and paper complexity assertions were used only to
    understand interfaces, never as cryptographic evidence.

falsification_conditions:
  - >-
    This disposition is falsified by an accessible primary source, dated no
    later than 2026-07-24 or demonstrably missed by the recorded search, that
    supplies all twelve admission fields for an ordinary E(F_p) large-prime
    subgroup and lies outside every deduplicated family.
  - >-
    It is not falsified by an extension-field Frobenius orbit, bounded torsion
    symmetry, represented low-rank matrix, toy solve, untyped source oracle, or
    a relation-only construction with no fresh scalar-blind descent.

cheapest_discriminating_test:
  name: primary_source_twelve_field_typing_gate
  type: zero_compute_literature_and_symbolic_interface_check
  design: >-
    For any newly located source, quote the exact definitions of all twelve
    required fields and classify the ECDLP group as E(F_p) or E(F_{p^n}).
    Reject immediately if the action is identity on E(F_p), bounded-only,
    tuple permutation/isotypic, source-supplied, or post-relation. Only then
    derive relation yield, independent rank, fresh masked-target descent, and
    complete cost against matched rho.
  controls:
    - specialize Frobenius to E(F_p) and verify that it is pointwise identity
    - quotient tuple permutations, signs, duplicate occurrences, and finite torsion classes
    - require exact occurrence-level source replay and full adaptive transcript
    - charge preprocessing, rejected relations, rank tail, memory, traffic, verification, and descent
    - apply the same available automorphism discount to Pollard rho
  pass_condition: all_twelve_fields_explicit_and_target_scope_with_no_unknown_cost
  fail_condition: any_field_absent_or_scope_outside_ordinary_prime_field_prime_order
  current_result: fail_no_source_passed
  estimated_cost:
    implementation: none
    compute: none
    analyst_effort: low_per_new_source

estimated_cost:
  implementation: none
  compute: none
  analyst_effort: high_systematic_screen

ranking_rationale: >-
  No candidate can be ranked for experiment. SRC-08 is the closest explicit
  action interface and SRC-09 is the strongest growing action, but both fail
  the prime-field scope before expensive analysis; SRC-02 is in scope but has
  no relation action and leaves decisive costs unknown. The twelve-field
  source-typing gate is therefore the single first test for any future citation:
  it has the highest information gain per cost because scope, action, source
  replay, and descent are logical prerequisites that can be checked without
  curves or code.

