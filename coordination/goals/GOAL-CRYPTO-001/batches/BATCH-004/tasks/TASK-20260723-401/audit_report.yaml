notation:
  N: abstract prime subgroup order; the 2026 manuscript writes p
  n: ceil(log2(N))
  r: >-
    Reduced row dimension ell-prime after the one-step restriction; r is
    Theta(n). This is L in the BATCH-003 formulas.
  d: defect, with 1 <= d <= r
  A: >-
    Number of possible first restrictions a, binom(2*r,r); Algorithm 1 samples
    one a per invocation rather than enumerating A.
  B: >-
    Number of b choices actually generated by Algorithm 1 lines 11-12,
    binom(r,d).
  M: >-
    Number of d-column completions for one fixed b,
    binom(r+d,d).
  H: >-
    Number of (d-1)-row penultimate subsets for one fixed b,
    binom(r+d,d-1) = M*d/(r+1).
  alpha: >-
    Manuscript Equation (4) single-completion partition estimate,
    (N-2*r+1)/(N*(N-r+1)) = (1+o(1))/N.
  q_b: >-
    Manuscript modeled existence probability for one fixed b,
    1-(1-alpha)^M. The simplified BATCH-003 expression replaces alpha by 1/N.

formula_alignment:
  status: not_aligned
  aligned_components:
    - >-
      For a fixed b, the signature matrix has r+d rows and d columns, so
      Algorithm 1's create-intersection-signature loop has exactly
      H=binom(r+d,d-1) penultimate subsets.
    - >-
      For the same fixed b, there are M=binom(r+d,d) possible d-column
      completions, and H=M*d/(r+1) is the correct binomial identity.
    - >-
      Algorithm 1's b loop has B=binom(r,d) iterations, as follows directly
      from choosing r-d elements from a set of size r.
  blocking_mismatches:
    - id: FA-1
      finding: >-
        Section 5 prose says there are binom(r+d,d) choices of b, while
        Algorithm 1 and Section 5.2 give binom(r,d). The former is M, the
        completion count after b is fixed, not the b-loop count.
    - id: FA-2
      finding: >-
        Equation (4) and the concluding q expression use exponent M after a
        fixed b, whereas Algorithm 1 and Algorithm 3 process B different b
        choices for one a. No manuscript equation maps q_b to the success
        probability or stopping time of that complete B-by-H public loop.
    - id: FA-3
      finding: >-
        Section 8 calls the hashtable length M. Section 4.1, Algorithm 1
        lines 19-21, create-intersection-signature lines 34-40, and Section
        5.2 instead give the penultimate table length H. M counts candidate
        completions and H counts stored/processed penultimate signatures.
    - id: FA-4
      finding: >-
        The q event is existence of at least one partition/completion. The
        public algorithm succeeds only after two exact penultimate vectors
        coincide, their index union has cardinality d, the resulting zero
        minor verifies, and the relation has usable scalar orientation. The
        manuscript does not prove equality between these events; Theorem 5
        explicitly warns of a possible error.
    - id: FA-5
      finding: >-
        The prose permits stopping at the first duplicate, but gives no
        prefix success law or expected duplicate position. Endpoint q_b and
        endpoint H therefore do not by themselves determine the expected
        work of the early-stopped successful branch.
    - id: FA-6
      finding: >-
        At d=1, H=binom(r+1,0)=1. The only penultimate subset is empty, so a
        one-entry table cannot contain two distinct duplicate entries.
        Algorithm 1 has no separate d=1 zero-signature or direct-completion
        branch. Thus q_b>0 for M=r+1 cannot be the success probability of the
        stated duplicate procedure at this admitted boundary.
  consequence: >-
    The algebraic non-sub-rho implication is valid only under an additional
    alignment premise. The exact manuscript does not establish that premise,
    so its complete expected exponent cannot be assigned from q_b, M, and H.
  conditional_alignment_premise: >-
    For every processed fixed-b trial with d>=2, public success is bounded by
    the same M completion events used in q_b; a failed trial must process all
    H exact penultimate signatures; the bound applies to every processed
    prefix or an equivalent stopping-time argument; and all rank,
    duplicate-to-minor, orientation, and verification conditions are included
    in the success event.
  conditional_implication_if_premise_is_proved: >-
    q_b <= M/N up to N^o(1), together with failed-trial cost Omega(H), gives
    expected work Omega(H/q_b) = Omega(N*d/(r+1)) = N^(1-o(1)) in the
    low-success regime. If B fixed-b choices are charged together, B cancels
    against at most B times the completion mass; it is not a free success
    multiplier. In a constant-success endpoint with M=Omega(N), full-table
    work is H=Omega(N*d/(r+1)), but an early-stop lower bound still requires
    the missing prefix argument.

exact_loop_audit:
  first_restriction_a:
    source: Algorithm 1 lines 4-8
    count: one sampled a of size r from a dense set of size 2*r per invocation
    charged_work:
      - submatrix extraction and transpose
      - rank and pivot checks
      - anti-diagonal reduction
    stopping_issue: >-
      The manuscript does not specify a complete retry distribution across a,
      reuse of one K across a choices, or when a fresh sampled-point matrix is
      required.
  defect_choice:
    source: Algorithm 1 input
    count: one externally selected d per invocation
    stopping_issue: >-
      No distribution, adaptive schedule, or cost for trying multiple d values
      is part of q_b. Any such schedule must charge every failed d.
  fixed_part_b:
    source: Algorithm 1 lines 11-14
    count: B=binom(r,d)
    per_b_work:
      - extract an r by (r-d) submatrix
      - compute and rank-check its left kernel T
      - require dim(T)=d
  signature_matrix:
    source: Algorithm 1 lines 15-19 and Section 4.1
    shape: (r+d) by d
    per_b_work:
      - compute d nontrivial hyperplane signatures by row reduction
      - materialize or regenerate r structured signatures from transpose(T)
      - check zero signatures and normalization branches
  penultimate_table:
    source: Algorithm 1 lines 20-21 and lines 31-40
    count: H=binom(r+d,d-1)
    per_entry_work:
      - select d-1 rows with retained combinatorial provenance
      - rank-check the (d-1) by d matrix
      - compute its exact right-kernel
      - normalize by the first nonzero coordinate
      - perform hash lookup and exact collision resolution
    published_stop: first duplicate may stop the table
    missing_stop_model: exact prefix probability and expected duplicate position
  postprocessing:
    source: Algorithm 2
    charged_work:
      - recover both penultimate index sets
      - require union cardinality exactly d
      - map structured and dense indices back to K-prime and K
      - reverify the maximal zero minor exactly
      - reconstruct the public source-coefficient relation
      - require nonzero target coefficient
      - solve the oriented scalar equation
      - verify the final public group equality

d1_boundary:
  values:
    B: r
    M: r+1
    H: 1
    q_b_model: 1-(1-alpha)^(r+1)
  public_duplicate_search_result: >-
    No duplicate can occur among one entry. The stated public search therefore
    has success probability zero at d=1 unless an unprovided special branch is
    added.
  audit_meaning: >-
    H=1 cannot be used as the complete per-trial work of a process claimed to
    expose M=r+1 successful completions. Any repair must separately charge all
    extension tests, exact equality checks, provenance, and certificate work,
    and would be a different stated stopping process.

failure_accounting:
  rank_and_geometry:
    - evaluation-matrix rank differs from the assumed value
    - selected K-prime lacks the pivots required for anti-diagonal form
    - fixed-part matrix has rank below r-d, so dim(T) is not d
    - a hyperplane signature is zero
    - a penultimate matrix has rank below d-1
    - general-position assumptions fail on an unhandled stratum
  duplicate_and_indexing:
    - finite hashes collide but normalized vectors differ
    - equal vectors have index-union cardinality other than d
    - two different ultimate intersections share a vector
    - the mapped index set does not reverify as a zero maximal minor
  scalar_orientation:
    - retained source coefficients do not reconstruct the claimed relation
    - the aggregate target coefficient is zero modulo N
    - the relation contains no usable target contribution
    - final public group equality fails
  accounting_rule: >-
    Every such branch is either a charged failed trial or a semantic failure.
    None is included in Equation (4), and none may be counted as success from a
    hash match alone.

charged_costs:
  reusable_curve_only_preprocessing:
    work: n^O(1) bit operations
    examples:
      - monomial ordering and symbolic evaluation formulas
      - curve-only basis conventions
    amortization: reusable only when it contains neither Q nor sampled multiples
  single_target_setup:
    work:
      - n^O(1) group operations to form O(n) sampled public multiples
      - n^O(1) field operations to evaluate and reduce the matrix
      - n^O(1) bit memory for the sampled points, matrix, kernel, and provenance
    amortization: not reusable across fresh targets because Q enters sampled rows
    reuse_within_target: >-
      A fixed K can in principle be reused across multiple a choices; each
      restriction and reduction remains charged. The manuscript does not state
      the complete reuse/rebuild stopping rule.
  per_a_full_enumeration_upper_shape: >-
    B times [kernel(T) + d signature reductions + H penultimate-kernel,
    normalization, exact-lookup, and provenance operations], with polynomial
    factors in n and d.
  retries: >-
    All failed a, d, b, rank, duplicate, union, orientation, and certificate
    branches are charged. Their joint distribution is not supplied.
  verification: >-
    Polynomially many field operations for exact minor/relation checks and
    O(n) group operations for final public equality; these do not repair an
    exponent-one search.

charged_exponents:
  convention: >-
    Exponents are in N; N^o(1) absorbs polynomial factors in n=log2(N).
    These are symbolic charges, not measured outcomes.
  reusable_curve_only_preprocessing:
    total_work_exponent: 0
    bit_memory_exponent: 0
  target_setup_per_rebuild:
    total_work_exponent: 0
    bit_memory_exponent: 0
  conditional_aligned_q_M_H_model:
    expected_total_work_lower_exponent: 1-o(1)
    expression: Omega(N*d/(r+1))
    status: conditional_only
  exact_published_end_to_end_algorithm:
    expected_total_work_exponent: unknown
    reason: q/B/H/stopping/certificate events are not aligned
  fixed_d_branch:
    per_b_work_exponent: 0
    peak_bit_memory_exponent: 0
    conditional_expected_retry_work_exponent: 1-o(1)
  modeled_constant_success_branch:
    premise: M=Omega(N) and d=Theta(r)
    full_H_table_work_exponent: 1-o(1)
    exact_table_bit_memory_exponent: 1-o(1)
    early_stopped_expected_work_exponent: unknown_without_prefix_law
  pollard_rho_total_work_exponent: 0.5+o(1)
  baby_step_giant_step_time_exponent: 0.5+o(1)
  baby_step_giant_step_bit_memory_exponent: 0.5+o(1)

bit_memory:
  signature_matrix: O((r+d)*d*n) bits
  exact_in_ram_penultimate_table: >-
    O(H*(d*n + log2(H) + metadata)) bits if exact normalized vectors and
    subset provenance are retained.
  hash_only_table: >-
    O(H*(lambda + log2(H) + metadata)) bits for lambda-bit hashes and
    combinatorial indices, but a Las Vegas claim additionally requires exact
    collision resolution by retained vectors or charged recomputation.
  constant_success_scale: >-
    When M=Theta(N) and d=Theta(r), H=Theta(N). Hash/provenance records use at
    least near-linear entries of logarithmic bit width; retaining exact
    d-coordinate field vectors costs O(N*n^2) bits up to constants.
  streaming: >-
    The manuscript supplies no exact streaming model. External sorting,
    multiple passes, recomputation, and I/O are alternative charges, not free
    reductions of both work and memory.
  parallelism: >-
    Aggregate table copies, memory traffic, processors, and total work are
    charged. Parallel wall-clock reduction does not change the total-work
    exponent.

preprocessing:
  curve_only: separable and polynomial, if independent of Q and sampled points
  target_dependent: >-
    Sampled Q multiples, evaluation rows, K, restrictions, rank checks, and
    signature searches are single-target costs and cannot be amortized over
    unrelated targets.
  within_target_reuse: >-
    K may be reused across a choices and structured signatures may be derived
    cheaply, but every extraction, reduction, b kernel, table entry, memory
    access, and failed branch remains charged.
  absent_direct_solver_stages:
    - no factor-base relation collection
    - no factor-log linear solve
    - no descent
  caveat: >-
    Their absence is legitimate only because the complete direct
    relation-to-oriented-scalar certificate path above is charged.

baseline_comparison:
  pollard_rho:
    reference: KN-TECH-001, KN-LIT-008, and KN-LIT-012
    total_work: N^(1/2+o(1)) group operations
    serial_memory: O(1) group elements, hence N^o(1) bits
    parallel_note: >-
      Distinguished-point parallelism reduces wall clock while retaining
      square-root aggregate work up to overhead.
    audit_result: >-
      The conditionally aligned q/M/H lower bound has exponent one and is
      asymptotically worse. The exact 2026 algorithm remains unassignable, not
      better, because its success and stopping formulas are incomplete.
  baby_step_giant_step:
    total_work: N^(1/2+o(1)) group operations
    bit_memory: N^(1/2+o(1)) stored group-element bits
    audit_result: >-
      Fixed d can use sub-BSGS peak memory but has conditionally near-linear
      expected work. The modeled constant-success exact-table branch has
      near-linear entries and improves neither BSGS time nor its time-memory
      frontier.
  specialized_2018_problem_L:
    exact_published_claim: >-
      The paper states whole-algorithm success 0.6*(log N)^2/N per
      polynomial-time pass for its multiple-Gaussian-elimination Problem L
      method.
    implied_expected_work: N^(1-o(1))
    audit_result: >-
      This is a near-linear specialized baseline, not a sub-rho baseline. The
      conditionally aligned 2026 route has the same exponent class.
  specialized_2023_2025_minor_families:
    exact_published_claim: >-
      The 2023 manuscript states per-kernel costs O(r^5) for two deviations,
      O(r^7) for three deviations, and O(r^(2*s+1)) for s deviations.
    missing_quantity: >-
      No large-N theorem supplies the expected number of kernels or a
      prime-field success law for these fixed minor families.
    audit_result: >-
      Their complete expected exponent is unknown; small binary-field tables
      are not a matched prime-field or asymptotic sub-rho baseline.
  specialized_2026_hyperplane_signature:
    exact_full_loop_shape: B=binom(r,d) outer b choices and H inner entries per a
    modeled_probability_quantity: M completion events for one fixed b
    audit_result: >-
      This is the closest exact baseline because it is the audited method
      itself. Its published complete expected cost is unresolved by the
      q/B/H and stopping mismatches. Under the explicit additional alignment
      premise, it is N^(1-o(1)) and therefore loses to rho and BSGS.

falsification_and_outcome_map:
  source_alignment_proved: >-
    Preserve the conditional Omega(N*d/(r+1)) result, then independently audit
    the early-stop prefix law and certificate semantics before any stronger
    conclusion.
  source_alignment_not_proved: >-
    The complete cost claim remains inconclusive; do not interpret the gap as
    evidence of an advantage.
  semantic_certificate_failure: >-
    The stated route fails independently of cost, within only that failed
    stratum or interface.
  proved_subrho_bias_or_locator: >-
    Would require independent theorem review and full charging; it would not
    itself be a breakthrough or empirical result.

verdict: INCONCLUSIVE_COST_CLAIM
verdict_rationale: >-
  The conditional cancellation H/q_b >= N*d/(r+1) is mathematically correct
  when q_b, M, H, failed trials, prefixes, and certificate success describe
  one stopping process. The 2026 manuscript does not provide that alignment:
  it confuses the b and completion counts in prose, assigns both M and H as
  hashtable lengths, omits B from the stated whole-loop probability, gives no
  early-stop prefix law, does not fold rank/orientation/certificate failures
  into q, and fails at the admitted d=1 duplicate boundary. Therefore this
  audit cannot assign an end-to-end exponent to the published algorithm. It
  also finds no evidence of sub-rho work and makes no breakthrough claim.

