  derivation:
    contract_language: >-
      specification.yaml metrics.primary[0]: "nonexceptional_full_box_fraction:
      fraction of non-exceptional targets with all 2^(m-1) box vertices present
      (target exactly 1)". specification.yaml success_criterion: "every target
      outside the predicted exceptional set has all 2^(m-1) box vertices present
      in supp(f_{m,t}) (full-box Newton polytope)". The predicted exceptional set
      is Exc_m(E) = {x([r]P_0): 1 <= r <= m-1, [r]P_0 affine}. So "non-exceptional"
      means OUTSIDE the PREDICTED exceptional set, and a target counts in the
      numerator iff it is saturated (full box).
    formula: >-
      fraction = |{t in F_p \ predicted_exception_set : t is classified
      saturated}| / |F_p \ predicted_exception_set|.
      "t is classified saturated" is read from the archived per-cell
      classification: the raw bytes archive the observed exception set
      (observed_exception_set_hull, the primary hull method; observed_exception_set_corner
      is the cross-check and equals the hull set in every cell). The
      classification is binary (SATURATED vs EXCEPTION), so "t is classified
      saturated" iff t is NOT in observed_exception_set_hull. The saturated set
      is therefore the complement of observed_exception_set_hull in F_p.
      Rewritten purely in archived fields:
      fraction = (p - |predicted ∪ observed_hull|) / (p - |predicted|).
    method: >-
      For each of the 8 cells I read predicted_exception_set and
      observed_exception_set_hull directly from the raw-result.json bytes.
      identity_hull is the exact set equality of those two archived lists.
      predicted_size = |predicted_exception_set|. The corrected fraction: the
      numerator is the count of targets that are both outside the predicted set
      and classified saturated, i.e. |F_p \ (predicted ∪ observed_hull)| =
      p - |predicted ∪ observed_hull|; the denominator is |F_p \ predicted| =
      p - |predicted|. In every cell observed_hull == predicted exactly, so
      predicted ∪ observed_hull = predicted and numerator = denominator =
      p - |predicted|, giving fraction = 1 (an exact Fraction with numerator ==
      denominator). No field was absent; nothing was reconstructed.
