  mutation_control:
    construction: >-
      Synthetic cell, p = 101, predicted_exception_set = [0, 76] (size 2),
      observed_exception_set_hull = [0, 76, 50] (size 3). The predicted set and
      the observed classification DISAGREE: 50 is in observed_hull but not in
      predicted, so 50 is a target OUTSIDE the predicted set that is classified
      NOT saturated (an unexplained exception). This is the injected
      misclassification the control requires.
    formula_output: "98/99"
    decays: true
    note: >-
      denominator = |F_p \ predicted| = 101 - 2 = 99; numerator =
      |F_p \ (predicted ∪ observed_hull)| = 101 - |{0,76,50}| = 101 - 3 = 98;
      fraction = 98/99, which is strictly below 1. The formula therefore DECAYS
      under the injected misclassification and is NOT tautological: it returns
      1.0 on the real cells only because observed_hull == predicted there, not
      by construction.
