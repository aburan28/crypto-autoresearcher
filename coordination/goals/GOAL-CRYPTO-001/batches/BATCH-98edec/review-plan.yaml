      archive. Composition asks: is the pre-registered criterion (b) consequence triggered with sufficient
      independent support, and does every raised boundary survive into the official records?'
    composition_use: Owns the official records; the only task in this batch that changes any status.
  proves_too_much:
    objects:
    - object: 'The inference "charged >= rho_bound at the two gate points closes the route as non-sub-rho"
        tested against a model-passing point where its conclusion is KNOWN FALSE: at (N=64, L=16, d=1)
        the pinned formulas give charged ~= 4.25 < 8 = ceil(sqrt(64)), i.e. the route PASSES the gate
        at that point under its own model. The verdict machinery applied there must return survives=True.'
      requirement: J2 executes this control with the same derivation machinery; J1 re-checks it in A6.
        A machinery that returns False everywhere proves too much and voids the closure.
      already_executed_by: null
    - object: 'The same closure reasoning tested against the rho baseline itself (an object for which
        "non-sub-rho vs the rho bound" is KNOWN FALSE by definition): rho''s own cost IS the bound. The
        argument''s comparison semantics (strictly-below-to-survive, meets-or-exceeds-to-close) must be
        explicit and must not misclassify a passing object.'
      requirement: J1 A6 states the comparison semantics exactly and checks them against criterion (b)'s
        "meets or exceeds" language and the success_criterion's "strictly below" language for consistency.
      already_executed_by: null
    - object: 'The inference extended to "the route is closed for ALL d" -- an object whose status is
        KNOWN UNRESOLVED, not false: at d in {2,3} the l-vs-l'' base ambiguity in the manuscript''s H
        formula is live (prior round''s inconclusive_misalignment), so no base-invariant closure exists
        there. A composition sentence claiming closure at d in {2,3} would prove too much.'
      requirement: The composition (J3) confines every closure sentence to d=1 at the two primary gate
        sizes plus the conditional-algebra statement under the PINNED formulas; the general alignment
        question is carried as open in the EV boundaries.
      already_executed_by: null
    failure_signature: If the passing-point control returns survives=False, the verdict machinery is constant-false
      and the closure is VOID (decision falls to P4). If the blind figures match the committed ones only
      after substituting the q <= min(1, M/N) bound for the exact pinned q formula, or after an l -> 2l'
      base substitution at d=1, the derivation is not of the pinned model and does not triangulate. If
      J1's A6 finds the comparison semantics conclude rho itself is non-sub-rho against its own bound,
      the argument is broken somewhere nobody has read closely enough yet. None of these signatures was
      observed at plan time; the controls run under J1/J2 and their outcomes are recorded in their reports
      either way.
