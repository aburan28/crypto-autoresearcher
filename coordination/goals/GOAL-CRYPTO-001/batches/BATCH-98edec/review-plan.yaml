    expectations:
    - id: P1
      joint: J1
      expect: 'Red team HOLDS the scoped closure. Load-bearing reasons expected to survive attack: (a)
        lower-bound direction sound -- true fully charged work = H/q + the eight omitted stages >= H/q,
        so the bottleneck-only figure can only UNDERstate cost and the failure is robust; (b) units fair
        under the declared poly(log N) conversion rule, and the closure rests on the exponent comparison
        N^(1-o(1)) vs N^(1/2) per the pinned formulas, not on the constant margins (4.93x at point 1,
        15.06x at point 2); (c) criterion (b) is pre-registered, disjunctive ("at either primary gate
        size"), and met at both; (d) the l-vs-l'' manuscript base ambiguity cannot affect d=1 figures
        (H = binom(L+1, 0) = 1 for any base; M = binom(L+1, 1) = L+1), per the prior round''s independently
        confirmed MANUSCRIPT-ANCHOR-2 finding; (e) COMMAND-ARTIFACT-DISCREPANCY (validator-flagged archival-fidelity
        gap in command.txt''s timing metadata) remains not-disqualifying given triple independent reproduction
        of every substantive field. Expected outcome: boundary flags, not a break -- the closure does
        NOT adjudicate the external publications'' claims beyond their own pinned model, does NOT resolve
        the general d in {2,3} alignment question, does NOT test the enumeration leg, and names no standardized
        curve.'
    - id: P2
      joint: J2
      expect: 'Blind re-derivation from the spec''s pinned formula language alone (sympy exact arithmetic,
        no producer module, no committed figure read before freeze) matches bit-for-bit: q1 = 0.003169183122016195,
        charged1 = 315.5387244911908 vs rho_bound 64; q2 = 0.00025936775151069735, charged2 = 3855.5294333064226
        vs rho_bound 256; survives=False at both. Passing-point control (N=64, L=16, d=1: M=17, q = 1-(63/64)^17
        ~= 0.2355, charged ~= 4.25 < 8 = ceil(sqrt(64))) returns survives=True, proving the verdict machinery
        is not a constant-false artifact.'
    - id: P3
      composition_clause: 'If J1 holds and J2 agrees: decision reject_scoped. H-HZM-001 moves approved
        -> rejected WITHIN THE SCOPE of its gate-survival claim under the pinned published formulas (AGENTS.md
        rule 6: the negative closes exactly the tested scope). Refutation artifact: derivation note (closed-form
        algebra at d=1: charged = (L+1)/(1-(1-1/N)^(L+1)), which exceeds ceil(sqrt(N)) at both gate points
        and, per the spec''s own conditional-algebra statement, for the asymptotic regime L = Theta(log
        N) wherever sqrt(N) exceeds the L+1 scale -- recorded as conditional algebra from the pinned formulas,
        NOT a toy measurement). EV direction contradicts, strength replicated (independent reproductions:
        producer, Coordinator re-derivation inside DEC-20260907-5b500d, validator RECOMP-1/2/3, and this
        round''s blind J2), proof_status derivation with the derivation note and blind report as proof_refs.
        Obstruction and resource_check blocks filled (direction contradicts). Knowledge promotion REQUIRED
        (reject_scoped + replicated; warrant pre-named in DEC-20260907-5b500d): KN-FIND-3d6f78. EXP-HZM-001
        approved -> analyzed. The general block on RUN-HZM-001-b / full-scope RUN-HZM-001-c STANDS unchanged
        (not lifted by this decision; now moot for gate survival since no enumeration result can lower
        a cost that the model''s own bottleneck term already fails). The general d in {2,3} manuscript-alignment
        question stays open exactly as the prior round recorded it (inconclusive_misalignment).'
    - id: P4
      disagreement_clause: 'If J1 breaks the closure argument, or J2 disagrees with any committed figure,
        or the passing-point control fails: localize the defect; decision inconclusive or replicate, never
        reject_scoped on a contested joint. A J2 disagreement is localized as blind-vs-committed and adjudicated
        before any disposition.'
  joints:
  - id: J1
    joint: J1_closure_interpretation_and_receipt_admissibility
    assigned_to: TASK-20260908-5d29c2
    owner_role: red-team
    source: NEW (the owed red-team review named in DEC-20260907-5b500d review_requirement; no red-team
      report on RUN-HZM-001-c-primary-gate-only exists)
    attack_plan: 'Worked attack on the closure interpretation and the receipt''s admissibility. A1 lower-bound
      direction: read experiments/EXP-HZM-001/implementation/cost_ledger.py and the spec''s frozen_cost_ledger;
      verify charged_expected_signatures = H/q only, that the eight omitted charged_stages can only ADD
      cost, and that the figure is per-solved-target (per-attempt cost H times inverse success probability
      1/q), so failure at the bottleneck term implies failure of the fully charged cost. A2 formula fidelity:
      check the implementation''s q, M, H against the spec''s pinned language (q = 1-(1-1/N)^M; M = binom(L+d,d);
      H = binom(L+d,d-1)); verify no q overestimate could rescue survival (any smaller q only enlarges
      charged). A3 units and exponents: attack whether poly(log N) conversion factors could reverse the
      4.93x / 15.06x margins or the exponent comparison; check the spec''s conversion_rule and that the
      closure claim rests on exponents, not constants. A4 scope language: verify criterion (b) as written
      licenses exactly "the route is closed as non-sub-rho under its own published model" and that no
      composition sentence may extend to: an error claim against the external publications beyond their
      pinned model, the general d in {2,3} alignment question, the untested enumeration leg, or any standardized
      curve. A5 receipt admissibility: adjudicate COMMAND-ARTIFACT-DISCREPANCY (validator-flagged), the
      validator report''s task_id: null disclosure, and the amendment''s status: proposed vs its verbatim
      adoption by DEC-20260907-5b500d -- does the authority chain (amendment -> decision -> handoff ->
      run -> snapshot 3794391b64) hold, and is the receipt admissible for a claim-changing decision? A6
      proves-too-much probe: run the closure argument against the rho baseline itself and against a model-passing
      point; an argument that closes objects known to pass is broken.'
    composition_use: J1's verdict and every boundary flag it raises are carried into EV-CRYPTO-ad7fa2's
      boundaries and the DEC rationale; a J1 break triggers prior clause P4.
  - id: J2
    joint: J2_blind_rederivation_of_the_two_gate_points
    assigned_to: TASK-20260908-422afa
    owner_role: validator
    source: NEW (blind re-derivation of the load-bearing quantities per AGENTS.md review architecture;
      not a replication of the producer's code)
    attack_plan: 'Worked attack: derive M, H, q, charged_expected_signatures, rho_bound, and survives_rho_gate
      at BOTH primary gate points from the frozen contract''s formula language alone (sympy exact rational
      arithmetic plus float evaluation), never reading the producer''s implementation, the committed raw
      figures, the validator''s recomputations, or DEC-20260907-5b500d''s quoted figures before freeze.
      Derive independently the general d=1 inequality stating when charged exceeds ceil(sqrt(N)). Construct
      a passing-point control (a (N,L,d) where the pinned model PASSES the gate, e.g. N=64, L=16, d=1)
      on which the same derivation machinery must return survives=True. Freeze, then compare against raw-result.json.
      Agreement triangulates the committed figures blind; disagreement localizes blind-vs-committed and
      blocks reject_scoped (prior clause P4).'
    composition_use: The Coordinator performs the declared comparison act (post-freeze) between J2's table
      and the committed figures; recorded in the composition analysis and attestation.
  - id: J3
    joint: J3_composition_over_inherited_validator_and_new_joints
    assigned_to: TASK-20260908-79b1b3
    owner_role: coordinator
    source: Inherited validator review VAL-20260907-612101 (verdict passed; triple reproduction RECOMP-1/2/3;
      one flagged limitation COMMAND-ARTIFACT-DISCREPANCY; its null task_id disclosed) composed with J1
