    review_requirement): if survives_rho_gate=False at both primary gate sizes is confirmed under independent
    validator + red-team review, the frozen contract''s falsification_criterion(b) is met and "the route
    is closed as non-sub-rho under its own published model (the prior audit''s expected outcome)"; the
