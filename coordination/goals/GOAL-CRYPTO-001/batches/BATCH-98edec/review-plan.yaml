    attack_plan: 'Worked attack (composition): re-check that VAL-20260907-612101''s passed verdict rests
      on its own fresh derivations rather than the producer''s artifacts; carry its limitation into the
      EV boundaries; author the derivation-note refutation artifact (docs/claims-and-verification.md "Refutation
