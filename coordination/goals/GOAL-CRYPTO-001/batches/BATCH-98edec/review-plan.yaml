  claim_as_stated_by_producer: 'RUN-HZM-001-c-primary-gate-only (status completed_valid, snapshot 3794391b64,
    authorized by DEC-20260907-5b500d / amendment V2-CHG-1, produced under TASK-20260907-d2164a) computed
