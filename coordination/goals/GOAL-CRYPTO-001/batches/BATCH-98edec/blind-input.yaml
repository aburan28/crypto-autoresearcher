blind_input:
  id: BLIND-INPUT-BATCH-98edec-J2
  task_id: TASK-20260908-422afa
  joint: J2_blind_rederivation_of_the_two_gate_points
  review_plan: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-98edec/review-plan.yaml
  recorded_at: '2026-09-08'
  quantity: >-
    The two primary-gate charged-cost points of EXP-HZM-001 under the
    frozen contract's pinned closed-form model: M, H, q,
    charged_expected_signatures, rho_bound, survives_rho_gate at
    (N=4096, L=12, d=1) and (N=65536, L=16, d=1); plus the general d=1
    inequality for when charged exceeds ceil(sqrt(N)); plus a
    passing-point control verdict.

  formula_language_source_of_truth: >-
    experiments/EXP-HZM-001/specification.yaml,
    preregistered_prediction.formula (approved 2026-07-27, re-approved
    2026-09-06, strictly before the run): q(N,L,d) = 1-(1-1/N)^M;
    M = binom(L+d, d); H = binom(L+d, d-1); frozen rho bound =
    ceil(N^(1/2)). Gate semantics per success_criterion / falsification_
    criterion(b): the route survives only if charged expected per-target
    work is STRICTLY BELOW the bound; meets-or-exceeds closes. The run's
    metric under review is charged_expected_signatures = H/q
    (bottleneck term only).

  required_derivations:
    - id: D1
      item: >-
        For each point (N=4096, L=12, d=1) and (N=65536, L=16, d=1):
        derive M = binom(L+d,d), H = binom(L+d,d-1) with sympy exact
        integers; q = 1-(1-1/N)^M with sympy exact rationals AND its
        float evaluation; charged = H/q as exact rational and float
        (report the full float repr); rho_bound = ceil(sqrt(N)) via
        integer arithmetic (math.isqrt); survives = charged < rho_bound.
    - id: D2
      item: >-
        General d=1 inequality, derived independently (not copied from
        any record): state and prove for yourself when
        (L+1)/(1-(1-1/N)^(L+1)) >= ceil(sqrt(N)); verify your statement
        at both gate points and record its scope and any assumptions
        (e.g. L = Theta(log N) per the spec's conditional-algebra
        statement). This is your own derivation; it may agree or
        disagree with the audit bound N*d/(L+1) quoted in the spec --
        record what YOU derived.
    - id: D3
      item: >-
        Passing-point control: choose a public (N, L, d) where the pinned
        model PASSES the gate (suggested: N=64, L=16, d=1; verify your
        own choice from your D1 machinery). Run the SAME derivation
        machinery; it must return survives=True. Report exact values. If
        your machinery returns False at a point where your own exact
        arithmetic shows charged < rho_bound, your machinery is broken:
        say so explicitly.
    - id: D4
      item: >-
        Sensitivity check: evaluate q via the BOUND min(1, M/N) instead
        of the exact formula at both gate points and record how the
        charged figures change. This documents that your D1 figures come
        from the exact pinned formula, not the bound (they must differ).

  blind_from: see review_plan.blind_rederivation.blind_from (absolute until freeze)
  reads_allowed: see review_plan.blind_rederivation.reads_allowed

  freeze_protocol:
    - Derive everything in D1-D4 first, in a scratch directory outside every record path.
    - Write your report with your derived table and control outputs.
    - Commit exactly one file (your report path below) in one freeze commit; report the sha.
    - ONLY THEN read experiments/EXP-HZM-001/runs/RUN-HZM-001-c-primary-gate-only/raw-result.json and record per-field agreement/disagreement in a post-freeze comparison section (this section is added in the same file before the freeze commit is fine too, as long as the comparison happens only after your own values are final and written; simplest compliant order: derive, write values, compare, then freeze once).
    - After freeze: no edits except a schema-conformance addendum disclosed as such.

  output_schema:
    path: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-98edec/reviews/TASK-20260908-422afa/blind-rederivation.yaml
    required_blocks:
      - blind_rederivation.table (per point: M, H, q_exact, q_float, charged_exact, charged_float_full_repr, rho_bound, survives)
      - blind_rederivation.general_inequality (your D2 statement, proof sketch, scope)
      - blind_rederivation.passing_point_control (point, exact values, verdict, machinery_sane boolean)
      - blind_rederivation.sensitivity_q_bound (D4 figures)
      - blind_rederivation.comparison (per-field match booleans vs raw-result.json, filled post-derivation)
      - blind_rederivation.verdict (holds | disagrees | underivable, with reasons)
      - review_attestation (task_id, joints_owned, verdict, read_sibling_reports, sources_read, blind_from_attestation)
