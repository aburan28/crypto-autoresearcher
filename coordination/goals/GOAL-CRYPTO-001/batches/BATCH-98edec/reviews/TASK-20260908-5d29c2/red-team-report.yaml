      re-derivation joint, and the prior round's RUN-HZM-001-a alignment
      audit), so formula fidelity is verified against the SPEC's pinned
      language, not against the manuscript's displayed equations.
    - >-
      The A3 unit-convention analysis rests on the spec's frozen
      conversion_rule and the hypothesis's cost assumption as pre-registered;
      it does not prove the unit convention is the only defensible one, only
      that it is frozen, disclosed, and that the exponent-level closure is
      robust to any polylog unit conversion.
    - >-
      The A5 adjudication of COMMAND-ARTIFACT-DISCREPANCY relies on the
      validator's triple reproduction plus this review's own fresh
      re-execution for the substantive fields; it does not reconstruct the
      original (lost) timing-instrumented script, so the exact provenance of
      the wall-clock value 0.0006182193756103516 remains unverified --
      immaterial to any ChargedCostModel field.
    - >-
      Per the plan's blindness declaration, the coordinator_prior block of
      review-plan.yaml and the sibling J2 report directory
      (TASK-20260908-422afa) were not read; this verdict is formed without
      them.

