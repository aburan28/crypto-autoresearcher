  overall_verdict: holds
  overall_verdict_note: >-
    Joint verdict on J1 only (not a whole-claim verdict). All six attacks
    (A1-A6) hold: the charged figure is a disclosed H/q lower bound whose
    failure implies failure of the fully charged cost; the implementation
    matches the pinned formulas exactly and no in-model q overestimate or
    base reading rescues survival; the closure rests on the unit-robust
    exponent gap N^(1-o(1)) vs N^(1/2), not on the constant margins;
    criterion (b) licenses exactly "the route is closed as non-sub-rho under
    its own published model" with the four enumerated extensions forbidden;
    the authority chain (amendment -> decision -> handoff -> run -> snapshot
    3794391b64) holds logically and temporally and the receipt is admissible
    for a claim-changing decision within its narrow scope; and the closure
    argument is not constant-false (it returns survives=True at the
    model-passing point N=64, L=16, d=1 and handles the rho-baseline
    equality case per the strict-inequality convention). The six objections
    above are carried as boundary flags / notes for the composition; none is
    disqualifying.

  limitations:
