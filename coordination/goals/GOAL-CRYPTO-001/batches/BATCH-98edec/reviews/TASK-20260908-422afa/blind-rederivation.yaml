  # ------------------------------------------------------------------ D2
  general_inequality:
    derived_by: >-
      This session, independently. No record's version was copied; the
      statement, proof, and scope below are my own derivation from the
      pinned formula language.
    statement_as_written_in_task: >-
      E(N,L) = (L+1)/(1-(1-1/N)^(L+1)) >= ceil(sqrt(N)) holds for ALL
      integers N >= 1, L >= 0. In fact E(N,L) >= N for all N >= 1, L >= 0,
      and N >= ceil(sqrt(N)) for all N >= 1. So the "when" answer for the
      expression as written is: always.
    proof_as_written: >-
      Let m = L+1 and q = 1-(1-1/N)^m. Bernoulli's inequality, (1-x)^m >=
      1-mx for x in [0,1], m >= 1 (proof by induction: base m=1 is equality;
      step (1-x)^(m+1) = (1-x)^m (1-x) >= (1-mx)(1-x) = 1-(m+1)x+mx^2 >=
      1-(m+1)x), gives (1-1/N)^m >= 1-m/N, hence q <= m/N, hence
      E = m/q >= N >= ceil(sqrt(N)).
    note_on_gate_metric: >-
      The actual gate metric is charged = H/q with H = binom(L+1, 0) = 1 at
      d=1, i.e. charged = 1/q = E/(L+1). The nontrivial content is therefore
      the characterization of charged itself, stated next.
    statement_gate_metric: >-
      For integers N >= 2, L >= 0, let m = L+1 and s = ceil(sqrt(N)). Then
      charged(N,L) = 1/(1-(1-1/N)^m) >= s  if and only if
      s*(N-1)^m >= (s-1)*N^m (an exact, decidable integer test).
      Sufficient condition: s*m <= (s-1)^2 implies charged > s.
      Boundary: N = m^2 (perfect square, s = m) gives charged >= s, i.e. the
      gate is met-or-exceeded (witness N=169, L=12: charged =
      91733330193268616658399616009/6811242446084424039884741641 ~=
      13.4679 >= 13). The naive condition (L+1)^2 <= N is NOT sufficient
      (counterexample N=10, L=2: charged = 1000/271 ~= 3.6900 < 4 =
      ceil(sqrt(10))).
    proof_gate_metric: >-
      All quantities are positive, so every step is an equivalence:
      charged >= s  <=>  1/q >= s  <=>  q <= 1/s  <=>  1-(1-1/N)^m <= 1/s
      <=>  (1-1/N)^m >= (s-1)/s  <=>  ((N-1)/N)^m >= (s-1)/s  <=>
      s*(N-1)^m >= (s-1)*N^m (cross-multiplication of positive quantities).
      Sufficient condition: s = ceil(sqrt(N)) implies sqrt(N) > s-1, hence
      N > (s-1)^2; if s*m <= (s-1)^2 then N/m > (s-1)^2/m >= s, and by
      Bernoulli charged >= N/m > s. Bernoulli lower bound: charged >= N/m =
      N/(L+1) — this is exactly the spec's audit bound N*d/(L+1) at d=1, so
      my derivation agrees with the spec's bound on the lower bound itself.
    asymptotic_corollary: >-
      For L = Theta(log N) (the spec's conditional-algebra regime),
      charged >= N/(L+1) = N^(1-o(1)), which exceeds sqrt(N) = N^(1/2) for
      all sufficiently large N: the gate is decisively failed asymptotically
      in that regime. This is an algebra statement from the pinned formulas,
      not a measurement.
