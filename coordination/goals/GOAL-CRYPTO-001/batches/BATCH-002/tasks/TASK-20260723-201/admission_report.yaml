    name: exact_r_R_z_R_definition_and_support_proof
    status: pass
    reason: >-
      The companion sheet defines the split fifth-label algebra, complete
      group-law component polynomials, r_R by explicit scalar resultants and
      interpolation, and z_R by a monic gcd. The resultant product formula,
      injectivity of the signed point key, and squarefreeness of g_I prove the
      exact extendible-label support biconditional. Resultant is used here as
      a mathematical definition, not supplied as a constructor input.
  - id: requirement_2
    name: explicit_compact_fresh_target_update_identity_or_recurrence
    status: fail
    reason: >-
      The only exact fresh-target identity found is componentwise point
      translation q_{a,v}(R+Delta)=q_{a,v}(R)+Delta. Expanding it touches
      Theta(B^3) target-dependent point/key components; lifting it to a pair
      divisor is an untyped whole-divisor translation, and lifting it directly
      to r_R assumes represented coefficients or resultants. No compact
      aggregate update was constructed.
  - id: requirement_3
    name: dimensions_and_target_dependence
    status: pass
    reason: >-
      Every object in the exact semantic route and failed update attempt is
      dimensioned in the companion sheet. With m=Theta(B) fifth labels and
      n=Theta(B^2) pair occurrences, the represented target-dependent
      translated family has mn=Theta(B^3) coordinates, r_R and z_R have
      O(m)=O(B) coordinates, and streamed construction still keeps
      Theta(n)=Theta(B^2) target-dependent live state.
  - id: requirement_4
    name: generic_encoding_erasure_and_non_generic_operation
    status: fail
    reason: >-
      Erasure leaves the point-level update as a generic group operation. The
      named non-generic operations--reading affine coordinates, finite-field
      branch masks and inversions, and the signed key kappa(P)--occur only in
      the standard represented component route. No compact update using one
      of those operations was supplied, so the requested rectangle has no
      candidate-specific non-generic witness.
  - id: requirement_5
    name: initial_time_and_live_memory_recurrences_without_forbidden_payload
    status: fail
    reason: >-
      Fully constructing the component route without supplied payload gives
      Q(m,n)=Q(m-1,n)+n^(1+o(1))=Theta(m*n^(1+o(1))) and streamed live memory
      W(n,m)=Theta(n^(1+o(1))+m). At m=Theta(B), n=Theta(B^2), these are
      B^(3+o(1)) time and B^(2+o(1)) live memory, above the B^(5/4+o(1))
      online time/workspace caps. Any recurrence inside the caps found in the
      reviewed material begins by supplying a forbidden divisor, resultant,
      common factor, coefficient vector, source, or scalar.

