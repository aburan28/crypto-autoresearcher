  # TERMINAL VERDICT (joint J-G1 only)
  # ==================================================================
  verdict: HOLDS_WITH_FINDINGS
  verdict_scope: >-
    Joint J-G1 ONLY: the quantitative basis of the execution gate for
    IDEA-20260904-6aed0b - (1) the range-wide status of the 0.171940
    false-plateau bound over phi in [1.0, 2.0] on and off the grid,
