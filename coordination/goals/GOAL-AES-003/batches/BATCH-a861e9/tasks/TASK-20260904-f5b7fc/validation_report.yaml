  # ==================================================================
  # CHECK 2 - RESIDUAL DECOMPOSITION: the 11-17% disclosure, boundary
  # cells, double-counting / dropped mass
  # ==================================================================
  check_2_residual_decomposition:
    verdict: PASS
    disclosure_checked: >-
      The "11-17% disclosed residual" is the tightened-rule FP range
      [0.114124, 0.171940] over the declared grid. CONFIRMED as stated;
      over the full range [1.0, 2.0] the values run in (0.114124,
      0.171940] with the supremum at the degenerate endpoint.
    decomposition_method: >-
      The sample space is partitioned by (stat-conjunct membership) x
      (dispersion-region membership at each point). p_stat = P(Branch 1
      not fired AND nonreject at 0.05 AND CP-contained) = 0.190179310825,
      phi-invariant (verified: the pooled totals are Poisson(64) x
      Poisson(64) at every phi). Within the stat region the mass splits
      into: FP_tight (D < c_margin at both points), blocked_k4_only
      (D_4 >= c_margin, D_16 < c_margin), blocked_k16_only (D_4 <
      c_margin, D_16 >= c_margin), blocked_both. Outside the stat region:
      the complement 0.809821. Separately, the demotions FP_original -
      FP_tight split into the margin-zone cells k4zone / k16zone /
      bothzones, and the gate-blocked stat mass is P(stat AND D >= c_gate
      at either point).
    per_phi_decomposition:
      # all sums exact to every printed digit (run 2, section S9)
      - phi: 1.0
        p_stat_split: {FP_tight: 0.171940, blocked_k4_only: 0.008890, blocked_k16_only: 0.008890, blocked_both: 0.000460, sum: 0.190179310825}
        demotions: {total: 0.014616, k4zone: 0.007159, k16zone: 0.007159, bothzones: 0.000298}
        grand_total: {PLAT: 0.171940, demotions: 0.014616, gate_blocked: 0.003623, outside_stat: 0.809821, sum: 1.000000000000}
