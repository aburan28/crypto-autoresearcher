        demotions: {total: 0.037342, k4zone: 0.030652, k16zone: 0.005413, bothzones: 0.001277}
        grand_total: {PLAT: 0.130056, demotions: 0.037342, gate_blocked: 0.022781, outside_stat: 0.809821, sum: 1.000000000000}
      - phi: 2.0
        p_stat_split: {FP_tight: 0.114124, blocked_k4_only: 0.066706, blocked_k16_only: 0.005898, blocked_both: 0.003452, sum: 0.190179310825}
        demotions: {total: 0.043082, k4zone: 0.036800, k16zone: 0.004749, bothzones: 0.001533}
        grand_total: {PLAT: 0.114124, demotions: 0.043082, gate_blocked: 0.032973, outside_stat: 0.809821, sum: 1.000000000000}
    decomposition_reading: >-
      The mechanism of the residual is fully visible in the split: as phi
      grows, blocked_k4_only rises (0.008890 -> 0.066706; heterogeneity is
      increasingly caught at the k=4 margin/gate) while blocked_k16_only
      FALLS (0.008890 -> 0.005898; the k=16 law is phi-invariant, so this
      cell shrinks only because its D_4 < c_margin conjunct fails more
      often), and blocked_both rises (0.000460 -> 0.003452). The sum stays
      p_stat exactly at every phi - no mass is created or lost.
