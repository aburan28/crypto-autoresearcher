  # ==================================================================
  # CHECK 3 - CONVENTION SENSITIVITY: written order (Branch H first) vs
  # Branches-1-5-only conditional; which convention does 0.171940 use?
  # ==================================================================
  check_3_convention_sensitivity:
    verdict: PASS
    conventions_computed:
      W: written cascade order - Branch H evaluated first; OVERDISPERSED readings removed before Branches 1-5.
      C: Branches-1-5-only, conditional on Branch H not firing (the RT2-SR-2 restatement convention for the former values).
    plateau_mass_identical_across_conventions: true   # at ALL five grid phi, bit-identical
    plat_values_both_conventions: {1.0: 0.171940, 1.25: 0.159843, 1.5: 0.145572, 1.75: 0.130056, 2.0: 0.114124}
    structural_reason: >-
      The tightened Branch-4 region requires D < c_margin at BOTH points;
      the Branch-H region is D >= c_gate at EITHER point; c_margin <
      c_gate strictly (7.814728 < 11.344867), so the two regions are
      disjoint and evaluating Branch H first cannot remove any Branch-4
      mass. Conversely, under convention C no Branch-H removal exists, but
      Branch 4's own conjunct already excludes every D >= c_gate cell
      (they fail D < c_margin). The plateau probability is therefore
      convention-invariant by construction, and the computation confirms
      it to the bit.
    full_routing_both_conventions:
      # run 2 section S9; W rows include OVER (Branch H); C rows have no OVER branch
      - {phi: 1.0,  W: {OVER: 0.018973, COMP: 0.000000, DECAY: 0.019929, INV: 0.019929, PLAT: 0.171940, UNRES: 0.769230}, C: {COMP: 0.000000, DECAY: 0.020313, INV: 0.020313, PLAT: 0.171940, UNRES: 0.787434}}
      - {phi: 1.25, W: {OVER: 0.040630, COMP: 0.000000, DECAY: 0.019362, INV: 0.019605, PLAT: 0.159843, UNRES: 0.760560}, C: {COMP: 0.000000, DECAY: 0.020313, INV: 0.020313, PLAT: 0.159843, UNRES: 0.799532}}
      - {phi: 1.5,  W: {OVER: 0.072712, COMP: 0.000000, DECAY: 0.018485, INV: 0.019154, PLAT: 0.145572, UNRES: 0.744076}, C: {COMP: 0.000000, DECAY: 0.020313, INV: 0.020313, PLAT: 0.145572, UNRES: 0.813802}}
      - {phi: 1.75, W: {OVER: 0.114752, COMP: 0.000000, DECAY: 0.017325, INV: 0.018574, PLAT: 0.130056, UNRES: 0.719293}, C: {COMP: 0.000000, DECAY: 0.020313, INV: 0.020313, PLAT: 0.130056, UNRES: 0.829319}}
      - {phi: 2.0,  W: {OVER: 0.165560, COMP: 0.000000, DECAY: 0.015935, INV: 0.017873, PLAT: 0.114124, UNRES: 0.686507}, C: {COMP: 0.000000, DECAY: 0.020313, INV: 0.020313, PLAT: 0.114124, UNRES: 0.845251}}
      # every row sums to 1.000000000000 under both conventions
    which_convention_the_claim_uses: >-
      The disclosed 0.171940 is the UNCONDITIONAL P(Branch 4 fires |
      M-PH(phi)) (J-R1 FC-1 / pricing-v2 definition; the red team's MC
      used written order). This report proves the value is numerically
      IDENTICAL under both conventions, so the question is moot for the
      bound: 0.171940 holds under the written order, under the
      Branches-1-5-only conditional reading, and as the unconditional
      firing probability. The conventions differ only in the routing of
      NON-plateau mass (OVER absorbs the Branch-H region under W; C folds
      it into UNRES), and in DECAY/INV (W: 0.019929/0.019929 at phi=1.0
      because Branch H pre-empts some rejection cells; C: 0.020313/0.020313
      phi-invariant, matching the exact rejection-path mass 0.040626 split
      symmetrically).
    corroborations:
      - >-
        My exact written-order OVER at phi = 1.0 (0.018973) reproduces
        J-R1's independently computed P_branchH_fires_at_either_point
        0.0189726.
      - >-
        My exact written-order OVER at phi = 2.0 (0.165560 = 0.157530 +
        0.009532 - 0.001502 overlap) corroborates the red-team report's
        consistency note that its MC either-point Branch-H capture 0.1658
        matches the producer's exact k=4-only catch 0.157530 plus the
        k=16 catch ~0.0095.

