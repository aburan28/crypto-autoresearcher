    claimed_values_used_as: >-
      COMPARISON TARGETS ONLY. Every quantity was first computed from the
      model statement and the rule text in fresh code; the claimed 6-digit
      values (FP_tight/FP_orig/gate_catch grids, p_stat, null quantities,
      pgmb, Branch-1 tail, ratios, ncx2 gaps) were loaded into the script as
      constants to diff against, never as inputs to any computation.
    model_statement_used: >-
      M-PH(phi) (OBJ-5A calibration family), verbatim semantics from the
      proposal's sr2_model_statement and the red-team report's object
      definition: at k=4, n=4 independent arms, two arms Poisson(16-d) and
      two arms Poisson(16+d) with d = sqrt(16*(phi-1)); at k=16, n=4 arms
      homogeneous Poisson(16); lambda_plan = 16; exposure 2^30 per arm; all
      arms independent; phi range [1.0, 2.0], declared grid 1.0/1.25/1.5/
      1.75/2.0. Dispersion index D_k = sum_j (x_j - m)^2 / m with m = T_k/4;
      c_gate = chi2_0.99(3), c_margin = chi2_0.95(3). Branch H fires at
      D_k >= c_gate at either primary point. Branch 1 fires iff BOTH points
      fail the one-sided exact Poisson comparator test at alpha_N = 0.001
      against null mean 4 (equivalently T_k <= 11 at both points). Tightened
      Branch 4: Branch 1 not fired AND two-sided min-likelihood binomial
      test does not reject at 0.05 AND the 95% Clopper-Pearson pi interval
      is contained in [0.4, 0.6] AND D_k < c_margin at BOTH points.
    method_note: >-
      Fresh python3/scipy code written this session from the statements
      above; no prior implementation was read or recomputed from. My
      dispersion machinery decomposes each 4-arm point into pair totals
      (u, v = t-u) with a Binomial(t, (16-d)/32) pair-assignment and two
      inner Binomial(u, 0.5)/Binomial(v, 0.5) splits, accumulated as
      region-CDF tables H(t, u) over the exact dispersion regions and mixed
      against the exact Poisson(64) marginal of T (the sum identity T_4 ~
      Poisson(64) for every phi is itself verified, not assumed). This is
      mathematically the same decomposition the producer disclosed for
      pricing-v2 but a different accumulation structure (phi-reused CDF
      tables); it is structurally different from J-R1's direct four-fold
      cartesian enumeration. The primary-conjunct machinery is an exact
      2-D table over (T_4, T_16) with the min-likelihood p-value verified
      cell-by-cell against the binding oracle scipy.stats.binomtest (1240
      probe cells: every cell with |p - 0.05| < 0.005 plus a 2-per-N
      sample), max deviation 1.665e-15. Agreement of all three independent
      implementations (producer, J-R1, this report) to every reported digit
      is therefore an independent-implementation confirmation, not a
      shared-code artifact.
    freely_chosen_conventions_disclosed:
      - id: FC-1
        choice: >-
          FP(phi) defined as the UNCONDITIONAL P(tightened Branch 4 fires |
          M-PH(phi)), matching the disclosed claim's definition (J-R1's
          FC-1 / pricing-v2). Check 3 additionally proves this value is
          numerically identical under the written-order cascade and under
          the Branches-1-5-only conditional convention, so the definition
          is convention-invariant for the plateau mass.
      - id: FC-2
        choice: >-
          Support truncation TMAX = 200 per point with the convention D := 0
          at t = 0 (matching the disclosed enumeration convention, caveat
          C12 lineage). Captured Poisson(64) mass per point: 1 - 3.308e-14;
          joint captured mass 1 - 6.6e-14. The t=0 cell has mass ~1.6e-28
          and cannot move any reported digit.
      - id: FC-3
        choice: >-
          Two-sided min-likelihood tie rule f(j) <= f(k)*(1+1e-7) (scipy's
          own rule, the binding convention). The strict alternative f(j) <=
          f(k) is quantified as a non-binding sensitivity (finding F3): it
          flips 107 cells, none of which carries any mass in the stat
          region, so p_stat and every FP value are identical under both tie
          conventions.
      - id: FC-4
        choice: >-
          Comparator null mean 4 per point (n_k x lambda_op = 4 x 1.0) for
          Branch 1; first rejecting T = 12 verified from the exact Poisson
          tail (P(Poisson(4) >= 12) = 9.152e-4 <= 0.001 < P(>= 11) =
          2.840e-3), so Branch 1 fires iff T_k <= 11 at both points.
      - id: FC-5
        choice: >-
          The k=16 point stays homogeneous Poisson(16) at every phi exactly
          as the model statement says; its dispersion law is phi-invariant
          (verified: the k=16 gate-catch column is constant at 0.009532
          across the sweep).

