  # ==================================================================
  # FINDINGS (classified load-bearing vs non-load-bearing for the gate
  # decision, per the handoff)
  # ==================================================================
  findings:
    - id: F1
      check: 1
      load_bearing_for_gate_decision: false
      statement: >-
        ATTAINMENT-POINT SEMANTICS. The worst case 0.171940 is attained at
        phi = 1.0, where d = 0 and M-PH(1.0) degenerates to the
        homogeneous plateau truth: at the attaining point the Branch-4
        firing is a TRUE POSITIVE under its own null, not a false
        positive. Over the strictly heterogeneous range phi > 1 the bound
        is a supremum approached as phi -> 1+ (largest swept value
        0.1718971 at phi = 1.001), never attained inside the open
        interval. The bound statement "P(FM-PLATEAU-CONSISTENT fires |
        M-PH(phi)) <= 0.171940 for all phi in [1.0, 2.0]" is TRUE as
        stated under both readings, and conservative under the strict
        false-plateau reading. NON-LOAD-BEARING for gate checkability and
        for the bound's validity; LOAD-BEARING-ADJACENT only in that the
        RT2-SR-5 ruling should state which semantics the price refers to
        (see F5b). This mirrors J-R1's own monotonicity_finding note,
        reached here independently from the sweep.
    - id: F2
      check: procedure
      load_bearing_for_gate_decision: false
      statement: >-
        OWN-CODE CRASHES DISCLOSED (rule 5/9; parallel to J-C1's
        FINDING-4). Run 1 crashed mid-S4 with a TypeError from an
        operator-precedence bug in my own fresh code (W * (~B1) & REJ
        parsed as (W * (~B1)) & REJ); fixed by parenthesization and the
        whole derivation re-run as run 2, which completed all 13 sections
        with every self-check passing. Run 3 (scoped follow-up) crashed
        with an IndexError in its section [b] p-value-matrix builder
        AFTER its decisive section [a] had printed; sections [b]/[c] were
        closed without a further run from run-2 data (fine sweep already
        strictly decreasing including phi = 1.001/1.01) and hand
        arithmetic on already-printed values (1.6199/2 = 0.8100,
        6.6564/2 = 3.3282), because maximum_runs = 3 was consumed and an
        exhausted budget is a hard stop. Per rule 5, neither crash is
        evidence against any hypothesis; every reported number comes from
        completed run 2 or run 3's completed section [a].
    - id: F3
      check: 2
      load_bearing_for_gate_decision: false
      statement: >-
        NON-BINDING TIE-RULE SENSITIVITY, ZERO EFFECT. Under the strict
        min-likelihood tie rule f(j) <= f(k) (NOT the binding convention;
        the binding rule is scipy's f(j) <= f(k)*(1+1e-7), oracle-verified
        to 1.665e-15 over 1240 probe cells), 107 binomial cells flip
        rejection status. Run 3 section [a] proves NONE of the 107 lies
        in the joint Poisson(64) x Poisson(64) support AND
        Branch-1-not-fired AND CP-contained region: the flip mass in the
        stat region is exactly 0.000e+00, so p_stat and every FP value
        are identical under both tie conventions. Together with zero
        D-threshold ties, zero p = 0.05 cells, and zero CP boundary ties,
        the gate quantities carry no boundary ambiguity under any of the
        disclosed conventions.
    - id: F4
      check: 4
      load_bearing_for_gate_decision: false
      statement: >-
        RHO MAP-FACTOR LINEAGE NOTE. The committed anchor (38,12) rho
        interval [0.8100, 3.3282] uses the convention-A pooled-reading
        map factor n16/n4 = 1/2 (exposure-weighted reading, per J-R1's
        FC-3); my design-scope factor-1 output [1.6199, 6.6564] halves to
        it exactly. The underlying CP pi interval [0.618309, 0.869390]
        matches to all digits. Definitional choice, not a disagreement;
        recorded so the lineage of the factor is explicit.
    - id: F5
      check: 5
      load_bearing_for_gate_decision: false
      statement: >-
        TWO GATE-STATEMENT PRECISION/HARDENING NOTES. (a) Condition 3's
        trigger ("relies on the skeleton or treats the pricing JSON as
        binding") has no external adjudicator: a gate batch that
        functionally used either document but whose committed records
        never declared reliance could contend the condition does not
        apply. RECOMMENDATION (hardening, not a defect): the
        execution-gate decision should require an explicit
        reliance-status declaration for both documents, making the
        trigger a stated fact rather than an inference. (b) The phrase
        "range-wide false-plateau bound" is precise for phi > 1 but at
        the attained endpoint phi = 1.0 the value is a true-positive rate
        (F1); the RT2-SR-5 ruling should state which semantics it prices.
        Neither note defeats checkability; all three conditions are
        checkable as written.
    - id: F6
      check: 4
      load_bearing_for_gate_decision: false
      statement: >-
        SCOPE OF THE CONFIGURATION-INVARIANCE EXTENSION. The gate names
        the bound on the OBJ-5A calibration family (bimodal equal-mean
        2+2 arms at k=4), which this report verifies EXACTLY and
        range-wide. The producer's extension of the bound to ALL
        fixed-effect equal-mean configurations via non-centrality
        n(phi-1) (pricing caveat C9, an approximation argument) was NOT
        independently re-derived here: it is beyond the named joint
        scope and the run budget is consumed. Its claimed ncx2 gaps
        (+0.000468 ... +0.006323, approx-minus-exact; the approximation
        over-states gate catch at every grid phi) reproduce exactly, and
        the range-wide bound does not depend on the extension: the worst
        case sits at phi -> 1+, where every fixed-effect equal-mean
        configuration degenerates to the same homogeneous limit. Recorded
        as scope disclosure, mirroring J-R1's not_covered_disclosure.

