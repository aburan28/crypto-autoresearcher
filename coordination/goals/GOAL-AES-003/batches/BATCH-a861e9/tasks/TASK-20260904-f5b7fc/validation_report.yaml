    - >-
      Check 5 attests CHECKABILITY, not satisfaction: whether the
      reserved red-team re-review has run, whether RT2-SR-5 will be
      ruled, and whether AC-1/AC-2 are satisfied or triggered are
      facts for the gate decision to establish against committed
