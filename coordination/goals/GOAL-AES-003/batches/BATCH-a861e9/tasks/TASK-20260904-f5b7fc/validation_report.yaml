        p_stat_split: {FP_tight: 0.159843, blocked_k4_only: 0.020987, blocked_k16_only: 0.008264, blocked_both: 0.001086, sum: 0.190179310825}
        demotions: {total: 0.022407, k4zone: 0.015122, k16zone: 0.006655, bothzones: 0.000630}
        grand_total: {PLAT: 0.159843, demotions: 0.022407, gate_blocked: 0.007930, outside_stat: 0.809821, sum: 1.000000000000}
      - phi: 1.5
        p_stat_split: {FP_tight: 0.145572, blocked_k4_only: 0.035257, blocked_k16_only: 0.007525, blocked_both: 0.001824, sum: 0.190179310825}
