      evidence: >-
        jg2_run1.py OBJ-4 written-order output: P_B4 = 0.000093, P_B5 =
        0.028486, sum 1.000000.
    - id: RT2-F1-through-F5-status
      severity: INFORMATIONAL
      statement: >-
        RT2-F1 (provenance pointer), RT2-F2 (branch-only convention), RT2-F3
