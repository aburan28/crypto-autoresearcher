    attack_c_outlier_configuration: >-
      NEW EXACT PROBE (this session, finding RT2-F6). A one-outlier
      fixed-effect configuration - rates [lambda_plan + 3c, lambda_plan - c,
      lambda_plan - c, lambda_plan - c], c = sqrt(lambda_plan (phi - 1) / 3),
