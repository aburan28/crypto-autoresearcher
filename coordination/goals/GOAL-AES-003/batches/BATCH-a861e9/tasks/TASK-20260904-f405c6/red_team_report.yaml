  # ------------------------------------------------------------------
  # FINDINGS
  # ------------------------------------------------------------------
  findings:
    - id: RT2-F6
      severity: DISCLOSE (argument-scope revision; not a gate blocker on J-G2)
      new_this_round: true
      statement: >-
        The class-wide extension of the 0.171940 / 0.186556 false-plateau
        bounds (pricing-v2 plateau_heterogeneity_sensitivity.bound.statement)
        is argued by a configuration-invariance claim whose quantified
        accuracy (C9, <= 0.006323 reference gap on the grid) is broken by
        exact enumeration of a non-bimodal fixed-effect equal-mean
        configuration: the one-outlier family's exact gate-catch at phi = 2.0
        deviates from the bimodal family by +0.010148 and from the disclosed
        ncx2 reference by +0.016471. The CONCLUSION survives numerically on
        every configuration tested (all FP values <= 0.159502 tightened /
        0.182250 original, far below the range-wide bounds, which are
        saturated at phi -> 1+ where all equal-mean configurations coincide),
        but the ARGUMENT as written supports only the bimodal calibration
        family plus an unquantified configuration spread. Recommended remedy:
        restate bound.statement's class-wide extension as (a) exact for the
        M-PH calibration family, (b) empirically consistent with the bound on
        the tested alternative configurations (naming them and the +0.010148
        gate-catch spread at phi = 2.0), and (c) justified in the limit only
        by the phi -> 1+ coincidence argument - or supply a tighter argument.
        This is reserved RT2-SR-5 territory: the finding is input to the
        Coordinator's adoption decision, not a red-team rejection.
      evidence: >-
        jg2_run3.py exact enumeration: outlier FP_tight 0.115933 vs bimodal
        0.114124 (phi = 2.0), outlier gate-catch 0.167678 vs 0.157530;
        outlier FP_tight 0.159502 vs 0.159843 (phi = 1.25). Producer's
        disclosed C9 gaps +0.000468..+0.006323.
