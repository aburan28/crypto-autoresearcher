    attack_b_k4_only_reading: >-
      TESTED AND HANDLED. The k=4-only reading of the OBJ-5B split lowers
      Branch-H capture (0.063829 vs 0.115764 at phi = 2.0) and leaves B4 = 0
      at every phi; the corrected routing text names both readings, so neither
