      bimodal 0.114124, diff +0.001809); original rule 0.181684 vs 0.182250
      and 0.155331 vs 0.157206. All tested configurations remain far below
      both range-wide bounds (0.171940 tightened / 0.186556 original). BUT the
      exact gate-catch at phi = 2.0 is 0.167678 for the outlier vs 0.157530
      for the bimodal family - a configuration spread of 0.010148, LARGER than
      the disclosed C9 reference-accuracy gap of 0.006323 that the
      configuration-invariance argument relies on. The argument as written
      ('the gate-pass probability is the same for every fixed-effect
      configuration at given phi, to the accuracy of the non-central
      chi-square reference') is therefore not tight: against the producer's
      own disclosed ncx2 approximation (0.157530 - 0.006323 = 0.151207 at phi
      = 2.0) the outlier deviates by +0.016471, about 2.6x the disclosed
      worst-case gap. A three-high-one-low probe (MC, phi = 2.0) sits below
      the bimodal family (0.1126), so the outlier is the higher-FP probe
      found; none approaches the phi -> 1+ limit where all equal-mean
      configurations coincide and the bound is saturated. Monte Carlo probes
      of the same attack (400k draws) agree with the exact arithmetic to
      within MC error. See finding RT2-F6.

