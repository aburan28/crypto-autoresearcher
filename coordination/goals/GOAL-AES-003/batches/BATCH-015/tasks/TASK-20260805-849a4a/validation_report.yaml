    verdict: "OUTCOME-A'' on BOTH preregistered comparisons -- the excess STAYS ABSENT at the exposure actually reached"
    decision_rule_source: "PREREGISTRATION.md section 5 (mtime-verified to predate every run output: preregistration mtime 1788219636 < earliest run output 1788219643, re-stamped by me)"
    application:
      M1: "R=1.0, Garwood 95% CI [0.0253, 5.5716] CONTAINS 1, AND exact conditional-binomial p=0.0009765625 < 0.01 -> OUTCOME-A'' per the preregistered rule (my own recomputation, not the producer's)"
