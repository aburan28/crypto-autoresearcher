    recomputation_evidence:
      - "I re-derived the key-stream seeds myself: [4284374398386231716, 9614918541733233340] == M1/M2 reported key_stream_seeds."
      - "I re-derived the first 4 trial keys per thread with my own splitmix64 implementation and they match M1's and M2's first_trial_keys_hex exactly (and M1's equal M2's, consistent with the disclosed prefix relation)."
      - "STRONGEST CHECK: I wrote my own C program (streamcheck.c, from my own reading of the worker, without any Feistel/AES code) recomputing the per-thread plaintext-stream digest AND the order-sensitive key-stream digest over ALL drawn keys. At 2^30: pstream de8dee29c9310a13/01089d650f48ca1b and kstream 160833933c3e4152/b928f0e742831efe -- both match M1-FF-P30.json exactly. At 2^33: pstream a6ff47635ca50ccf/7cb76fd3cca4ac59 and kstream 139c15ed846e7b61/16f9ebed33e3bd18 -- both match M2-FF-P33.json exactly. The archived key digests therefore correspond to the exact key streams the code as written produces, i.e. every trial consumed a freshly drawn (k0,k1)."
      - "Distinctness: splitmix64 advances its state by an odd constant on a single 2^64-cycle with a bijective output mix, so within-thread (k0,k1) pairs cannot repeat within 2^64 draws >> 2^33. Cross-thread: I recomputed the circular-shift gap between the two key streams = 2^62 steps >> the 2^33-step M2 window, matching the reported stream_gap_min_log2_key_threads=62. Empirical: my OWN exact sort-based duplicate check over 4 simulated thread streams x 2^20 keys (same scale as the producer's keycheck, independent implementation) found 0 duplicates among 4,194,304 keys. Disclosed coverage caveat (accepted, not a defect): the empirical keycheck scale (2^20/thread) is below M2's actual draw (2^32/thread); full-scale distinctness rests on the single-cycle argument, which I verified structurally and numerically."
    ruling: "A fresh random 128-bit key is drawn per trial with no global key-state reuse. The property that distinguishes this task from RC-D is genuinely present -- the opposite of RC-D's verified fixed-key determinism."

  duty_3_statistical_quality_argument:
    verdict: "SOUND as a correctly-labeled working assumption; no overstatement found"
    load_bearing_observation_verified: >-
      The argument's crux -- because the key is resampled every trial, each
      trial consumes exactly q=4 oracle queries (2 forward, 2 inverse) against
      ONE permutation instance, so idealness bounds enter PER TRIAL and the
      arm-level quantity is a union bound over independent trials rather than
      a birthday accumulation -- is CORRECT, and I verified it directly in the
      code (per-trial key draw; 2 ff_encrypt + 2 ff_decrypt under that trial's
      RK only). The 2^30-2^33 exposure is a count of independent permutation
      draws, exactly as stated.
    argument_assessment:
      - "Structural bijectivity (any balanced Feistel is a permutation for any round function): trivially sound; additionally gated empirically. My OWN Python re-implementation of the construction exactly as specified (validator-owned code, 16,384 fresh keys) gave 0 round-trip failures, 0 full-output collisions for distinct inputs, byte-0 histogram chi2(df=255)=202.97, byte-0 cross-input match z=0.25 -- consistent with the producer's SELFCHECK battery and with permutation behavior."
      - "Round count: 16 rounds against a 4-round strong-PRP floor leaves a wide margin; inverse queries do require the strong (CCA) notion, correctly identified."
      - "Recalled-citation discipline: every external citation (Luby-Rackoff 1988; Patarin line; Aumasson-Bernstein SipHash 2012; Garwood 1936) is marked provenance 'recalled' per AGENTS.md rule 9. Per rule 9 these are pointers, not support; I rule on the argument AS DERIVED and flag that it leans on unopened citations for the concrete bound's exact form."
      - "Robustness of the conclusion to the recalled bound's form: the producer cites a Patarin-type per-trial advantage of order q^4/2^{2n} = 2^-120 at q=4, n=64. The exact polynomial degree is 'recalled' and unverifiable here. However, under the WEAKEST standard Luby-Rackoff-type SPRP bound form I am aware of (O(q^2/2^n), itself 'recalled' on my side), the per-trial advantage at q=4, n=64 is still <= ~2^-60, and the union bound over 2^33 trials is <= ~2^-27 -- astronomically below the measurement's own Monte-Carlo noise (~0.35 relative on an ~8-event count at 2^33). The argument's conclusion (construction deviation unobservable at this exposure) therefore does NOT hinge on the precise recalled degree."
      - "Round-function heuristic ('keyed SipRound family ~ random function family'): correctly disclosed as the standard working assumption, not a theorem, sanity-checked empirically. Acceptable at this claim tier."
      - "Support-size caveat (2^128 keys vs (2^128)! permutations; claim is transcript-level closeness on the 4-query transcript, matching the level at which perm128 served per EV-AES-e4c091 OBS-B9-2): correctly stated, not buried."
    ruling: >-
      CONSTRUCTION_JUSTIFICATION.md names a specific argument, evaluates it at
      the actual tested parameters, discloses every assumption, and does not
      claim indistinguishability as established fact. It is sound for what it
      claims at the tested exposure. Flagged, per duty: its external citations
      are 'recalled' pointers (none opened by any agent in this program), but
      the conclusion is robust to the exact recalled bound form.

