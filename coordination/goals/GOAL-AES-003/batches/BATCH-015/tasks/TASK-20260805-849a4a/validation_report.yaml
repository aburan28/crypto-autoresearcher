      - "Does NOT establish: absence for all ideal-approximating constructions; absence for other seeds/geometries/round counts; anything about full-round or deployed AES; any mechanism; any crypto-scale claim. Toy tier only, no comparison to published cryptanalysis in either direction."
      - "The construction's closeness to ideal is a WORKING ASSUMPTION (sound per duty 3, but not a proof); a Coordinator citing this result must carry that qualifier."

