    power_reading: >-
      The achieved exposure is the decisive exposure this campaign defined for
      this comparison: 2^30 matched (where ~14 events are expected under the
      AES-level rate; the substitute read 1) plus 2^33 on the substitute
      (where ~112 events are expected under the AES-level rate; it read 10).
