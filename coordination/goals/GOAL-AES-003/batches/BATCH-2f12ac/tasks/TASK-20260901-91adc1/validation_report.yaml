  smask=1, 2^30 trials, seed 531001, armid 1, 2 threads), n = 14 hit trials concentrate in the
  low-wt(e) tail of the run's own miss distribution (exact one-sided exchangeability
  p_small ~ 6.8e-59). Power is limited by the preregistered disclosure: n = 14 hits at ONE seed
  (comparator-side seed variance is on record, 14 vs 19 hits at 531002); second-seed
  replication, interior ramp points, and the known-false amask=15 control are Stage 1, not
  executed here. The r=6 reference (3 hits) is one arm at one seed. Nothing in this validation
  is a statement about full-round or deployed AES, about any S-box outside the frozen nested
  position family, or about e being the only carrier; no published-frontier comparison in
  either direction. The p-value is exact under its stated null but the null is the run's own
  miss distribution at one seed; whether low-wt(e) concentration is tautological given the
  trial-map geometry is an interpretation question assigned to the concurrent red-team review,
  not settled by this integrity validation.

