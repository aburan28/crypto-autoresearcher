      histogram_bins_compared: 13
      bins_differing: 0
      verdict: CONFIRMED

    why_the_producer_timed_out_and_i_did_not:
      finding: >-
        cnt.c's worker sets `lo=0, hi=1ull<<32` for EVERY thread and partitions
        only the VALUE space. Each thread therefore performs the full 2^32
        software encryptions, so the encryption work scales as NTHREADS * 2^32 and
        thread count buys no speedup at all in the software path. The producer ran
        it at 1 thread under a 600 s timeout and at 2 threads under a 900 s
        timeout; the work actually needs ~1980 core-seconds. Neither budget was
        close, and the 2-thread attempt was strictly worse than the 1-thread one.
        The header comment documents the value-partitioned design honestly; what
        was not noticed is its cost in the software path.
      classification: >-
        SCHEDULING DEFECT, not an engine defect, and squarely resource exhaustion
        under AGENTS rule 3. Naming it is what let me finish the run inside budget.
      verdict_on_producer_diagnosis: CONFIRMED -- "both attempts hit their timeouts; resource_exhaustion, not evidence" is exactly right.

    what_is_still_NOT_closed_and_cannot_be:
      - item: the anchor rests on ONE configuration
        status: STILL TRUE, and the producer said so
        detail: >-
          Four engines now agree at r=5, j0=1, AES_MC, one key, one base. That is
          one point in the configuration space. Agreement there does not by itself
          certify agreement at other r, other j0, other keys, or other matrices.
      - item: NO cross-instrument anchor with engine A is possible for ANY M0/M1 arm, ever
        status: STRUCTURAL LIMIT, and the package understates the reason
        detail: >-
          count5.c takes no matrix argument. Its round function is _mm_aesenc_si128,
          i.e. AES's own MixColumns hard-wired in silicon. It CANNOT express M0 or
          M1 at all. The uint8 saturating counter (P2.4) is a real second barrier
          but it is not the first one: even with a 64-bit counter and unlimited
          time, engine A could not have run a single matrix-varying arm. See
          priority_2_4 below.
      - item: the M0/M1 arms are anchored by a THIRD engine, not by engine A
        status: CLOSED BY A DIFFERENT ROUTE, and this is the route that matters
        detail: >-
          Because the engine-A route is structurally unavailable, what actually
          licenses the M0/M1 numbers is independent re-implementation. That now
          exists at three levels and I supply two of them: rank 1's collide.c
          reproduced the r=4 M0 number, and my vcnt reproduced BATCH-002's r=5 M1
          number under their own key to the digit (see priority_2). The
          matrix-varying results do not rest on an unanchored kernel.

    answer_to_the_coordinator: >-
      NARROWED WAS THE RIGHT WORD FOR THE PACKAGE AS SUBMITTED; CLOSED IS THE RIGHT
      WORD NOW, at the anchor configuration, and the closing measurement is the
      producer's own code path executed to completion. The residual is not "is the
      software counting kernel trustworthy" -- that question is answered -- but
      "does one configuration generalise", which is an ordinary scope limit and is
      recorded as one, not as a confound.

  # ------------------------------------------------------------------
  # PRIORITY 1b -- the P2.4 capability-limit claim, verified from source
  # ------------------------------------------------------------------
  priority_2_4_saturating_counter:
    claim_as_stated: >-
      count5.c uses a uint8 SATURATING counter with a 256-bin histogram, so
      BATCH-002's r=4 critical arm, whose max occupancy is exactly 256, could
      never have been cross-checked on engine A -- it would report max_occ 255,
      overflow true, and a wrong n.
    verdict: CONFIRMED from source, and the claim UNDERSTATES its own conclusion.
    source_evidence:
      counter_declaration: "static uint8_t *cnt;  // 2^32 bytes  (count5.c line 16)"
      histogram_declaration: "static uint64_t HIST[4][256];  (line 17)"
      increment: "uint8_t *q=base_cnt+v; uint8_t c=*q; if(c!=255) *q=c+1; else *q=255;  (line 63)"
      max_occ_scan: "for(int v=255;v>=0;v--) if(hist[v]){maxocc=v;break;}  (line 116)"
      overflow_flag: "(maxocc>=255)?\"true\":\"false\"  (line 125)"
    derived_counterfactual:
      note: >-
        DERIVED BY ARITHMETIC FROM THE OBSERVED TRUE HISTOGRAM, NOT MEASURED. I did
        not and could not run count5 on an M0 arm, because count5 cannot express M0.
      true_histogram: {0: 4278190080, 256: 16777216}
      true_n: 547608330240
      what_count5_would_report: "max_occ 255, overflow true, and n = 16777216 * C(255,2) = 543330140160"
      shortfall: 4278190080
    the_understatement: >-
      The producer frames P2.4 as the reason the r=4 critical arm "was never
      cross-checkable on engine A even with unlimited time". That is true but it is
      the SECOND barrier. count5.c has no matrix parameter and computes its rounds
      with _mm_aesenc_si128; it is AES-MixColumns-only by construction. NO M0 or M1
      arm at any round count or any occupancy was ever expressible on engine A. The
      counter width is what would break it if the matrix problem were solved. cnt.c's
      own header comment states the matrix limitation plainly, so the package knows
      this; the P2.4 headline just attributes the impossibility to the narrower cause.
    consequence_for_the_anchor: >-
      This bounds what ANY cross-instrument anchor could ever have shown, exactly as
      the producer says: the anchor is confined to the AES_MC configuration by the
      instrument, not by the budget. The producer's judgement to call it a capability
      limit rather than a convention disagreement is CONFIRMED.

