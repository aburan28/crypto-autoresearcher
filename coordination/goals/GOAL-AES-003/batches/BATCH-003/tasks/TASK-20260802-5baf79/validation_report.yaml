  # ------------------------------------------------------------------
  # AUDIT IN BOTH DIRECTIONS
  # ------------------------------------------------------------------
  understatement_audit:
    instruction: >-
      This campaign has understated its own evidence twice and overstated it once,
      and reviews not told to look for understatement missed them. Findings below
      are graded in both directions.

    UNDERSTATEMENT_1_the_strongest_finding_in_the_batch_is_unstated:
      severity: material
      what_is_claimed: "n mod 8 = 0 under M1 at r=5."
      what_is_actually_measured: >-
        In EVERY M1 arm in this campaign -- BATCH-002 j0=0, BATCH-002 j0=1, rank 1's
        A3 on its own key, and my arm on a fourth key -- EVERY NON-ZERO OCCUPANCY IS
        AN EXACT MULTIPLE OF 256. The occupied bins are {256, 512, 768, ..., 2816}
        with no others. I recomputed this from the raw histograms of all four arms.
      the_arithmetic_consequence: >-
        If every fibre size m_v is divisible by 256 then
        n = sum_v C(m_v,2) = sum_k h_k * 128k(256k-1), which is divisible by 128.
        And indeed n mod 256 = 0 in all four arms, not merely n mod 8 = 0. The
        measured statement is FIVE BITS STRONGER than the claimed one.
      why_this_cuts_BOTH_ways:
        as_understatement: >-
          The package, CORR-20260802-46b73b, DEC-20260802-b226fb and both BATCH-003
          producers all report the mod-8 reading and none reports the divisibility.
          The measured regularity -- 256 divides every fibre of the projection under
          M1 -- is a sharper, more falsifiable and more structurally informative
          statement, it holds across four arms, three engines, three keys and two
          j0 values, and nobody has claimed it.
        as_a_limit_on_the_evidence: >-
          It also means the mod-8 test had LOW DISCRIMINATION on these particular
          arms. Given the fibre structure, n mod 8 = 0 follows by arithmetic alone,
          with no appeal to any round-geometry argument. The frozen falsification
          criterion could only have fired if the fibre structure itself broke. So
          the M1 arms confirm the MECHANISM of CORR-20260802-46b73b's analytic line
          (a) -- which predicts exactly this, that the k=1 class contributes
          multiples of 2^24 -- more than they independently test its CONCLUSION.
      the_contrast_that_makes_this_concrete: >-
        Under real AES MixColumns at r=5, the anchor arm has max_occ 12, no
        divisibility whatsoever, and n mod 16 = 8. There, mod 8 is exactly the right
        modulus and the property is NOT arithmetically trivial. The M1 regime and the
        AES_MC regime are different in kind, and the r=5 half of the rule currently
        states one sentence covering both.
      verdict: UNDERSTATED. The measured content exceeds the claim, and the claim's discriminating power on these arms is weaker than its wording suggests. Both facts should be recorded.
      caution: >-
        I verified the divisibility on four arms at r=5 under M1 only. I did NOT test
        whether it holds for other zero-entry matrices, other round counts or other
        j0 beyond {0,1}. It is a measured regularity over a narrow set, not a theorem,
        and must not be promoted as one.

    UNDERSTATEMENT_2_rank_1_understates_the_adversarial_quality_of_its_own_arm:
      severity: minor
      finding: >-
        Rank 1's A3 arm ran at j0 = 0. As established above, j0 = 0 is exactly the
        alignment at which ALL FOUR of M1's zeros land on the r=4-critical positions
        M[(-c-j0) mod 4][c]. Rank 1 chose the maximally adverse alignment and did not
        say so; its preregistration's "false for every j0" phrasing actually flattens
        the distinction and makes its own configuration sound generic.
      verdict: UNDERSTATED, in rank 1's favour. The arm is more adversarial than claimed.

    ON_RANK_1_DECLINING_TO_CALL_THE_RULE_STRENGTHENED:
      the_producer_position: >-
        "The producer declined to call the rule strengthened by more than one arm's
        worth."
      my_ruling: CORRECT, NOT EXCESSIVE -- as an accounting of what rank 1 itself contributed.
      reasoning: >-
        Rank 1 ran ONE valid r=5 M1 arm on a fresh key and did not obtain the exact
        BATCH-002 numbers. One arm is one arm, and saying so was accurate. Refusing
        to inflate a single measurement is the correct instinct and I decline to
        overturn it; premature closure and overclaiming are symmetric failures and
        this is neither.
      but: >-
        The modesty is correctly calibrated on ARM COUNT and MISCALIBRATED on
        CONTENT. Rank 1 held its own most informative measurement -- the
        256-divisibility visible in its own printed histogram -- without reporting
        it, and understated how adversarial its chosen j0 was. So: right conclusion,
        reached without noticing the two places where it had more than it thought.
      what_changes_now: >-
        The arm-count objection is separately answered by this validation, which adds
        a fourth key and the exact reproduction rank 1 dropped. That is my
        contribution, not rank 1's, and rank 1's own statement remains accurate as
        written.

    OVERSTATEMENT_WATCH_the_digit_identical_framing:
      severity: minor, framing only
      finding: >-
        The snapshot receipt says rank 1's r=4 anchor is "DIGIT-IDENTICAL to
        BATCH-002 and to the BATCH-002 validator's independent reproduction. Three
        implementations now agree exactly." Every word is true. The risk is in how it
        reads. n = 547608330240 is a DETERMINISTIC FUNCTION of the histogram, and the
        histogram here is a single structural fact: the projection image has exactly
        2^24 points and every fibre has exactly 256 preimages. I verified the
        identity: 2^24 * C(256,2) = 16777216 * 32640 = 547608330240 exactly. So the
        three-way agreement is ONE structural agreement plus arithmetic, not twelve
        digits of independent confirmation.
      already_recorded_upstream: >-
        EV-AES-d8a13e OBS-B2-3 limits ALREADY states this: "The exact count and its
        occupancy histogram are ONE structural prediction reported as two, since n is
        a deterministic function of the histogram." The BATCH-002 validator caught it
        and the ledger carries it. BATCH-003 did not restate it, so a reader of the
        snapshot receipt alone would not meet it.
      verdict: >-
        CONFIRMED as a claim; the weight qualification must travel with it and
        currently does not travel with the BATCH-003 framing. Not an overstatement in
        RESULTS.json, which is careful; a framing risk in the receipt summary.

  # ------------------------------------------------------------------
  # PRIORITY 3
  # ------------------------------------------------------------------
  priority_3_third_independent_agreement:
    claim: >-
      Rank 1's r=4 instrument anchor returned 547608330240 with the identical
      histogram, a genuine third independent agreement and not a shared-code artifact.
    verdict: CONFIRMED as genuinely independent, with the weight qualification above.
    basis:
      - >-
        The three implementations are cnt.c (BATCH-002 producer, software T-table,
        value-partitioned, full rescan per thread), vcount.c (BATCH-002 validator,
        written from scratch), and collide.c (rank 1, written for BATCH-003,
        value-WINDOW partitioned with private per-thread arrays, 16-bit counters, no
        AES-NI path). RESULTS.json declares batch002_engine_reused false,
        batch002_engine_compiled_or_executed false, and
        batch002_engine_read_for_conventions TRUE.
      - >-
        The conventions were READ ACROSS rather than derived independently. That is
        disclosed by both cnt.c's header and rank 1's RESULTS.json. It means the
        agreement is weaker evidence about CONVENTION than about IMPLEMENTATION -- a
        shared convention error would propagate. What breaks that concern is the
        external anchor: collide.c passes the FIPS-197 C.1 known-answer vector, which
        pins S-box, key schedule, ShiftRows, MixColumns and byte order against a
        published standard rather than against BATCH-002. My own engine does the same
        and additionally reproduces both producers' single-block pins
        (r=5: 4167e8f8367c38cdb7bde2ade620a7a8; r=10: 8df4e9aac5c7573a27d8d055d6e4d64b).
      - >-
        NOT a shared-code artifact: no source is shared, and I confirmed the source
        hashes against the BATCH-001/002 originals.
    what_i_did_not_do:
      check: I did not myself re-run the r=4 M0 anchor.
      reason: >-
        Budget. It is the most expensive single arm in the batch (rank 1 needed 1138 s
        on 2 cores) and it is the ONE number in this campaign that already has three
        independent reproductions, whereas the r=5 M1 exact numbers had none. I spent
        the time on the unreproduced arm instead. Recorded as a deliberate trade, and
        the r=4 arm is graded from artifact recomputation only.
      what_i_did_instead: >-
        Recomputed n, n_alt, N, cell count and every modulus from rank 1's raw
        histogram: N = 4294967296, cells = 4294967296, n = 547608330240 = n_alt,
        n mod 8 = 0. All internally consistent and matching the reported values.

  priority_3_rank_4_single_slot_corruption:
    claim: >-
      Single-slot corruption at t=1 and t=2 both give {0: 4}; the generalising patch
      reproduces the original exactly when the mask argument is omitted, so the
      comparison is genuinely single-variable.
    verdict: CONFIRMED, and I verified it in the one way the producer did not.
    checks:
      - check: patch semantics, from source
        result: PASS
        detail: >-
          src/sq_slot.diff introduces
          `int slotmask = (argc>9 && !strcmp(argv[9],"mask")) ? nwrong : ((1<<nwrong)-1);`
          and replaces the hint selector `(t<nwrong)` with `((slotmask>>t)&1)`. For
          slotmask = (1<<nwrong)-1 these are identical for all t in {0,1,2} and all
          nwrong in {0..3}. The only other change is two added printf fields.
        precision_note: >-
          "Reproduces the original EXACTLY" is true of the COMPUTATION. It is not true
          of the output bytes: the header printf now emits `slotmask` and
          `false_slots`, so the JSON is a superset, not byte-identical. Harmless, but
          the word "exactly" should carry that footnote.
      - check: patch equivalence, BY EXECUTION -- the control the producer asserted but never ran
        result: PASS
        detail: >-
          commands_rank4.txt contains only three invocations, all with the literal
          "mask" argument. The no-mask reproduction was never executed by the
          producer; the claim rested on reading the diff. I ran it.
        command: taskset -c 1,2,3 ./sq_slot attack6n 2b7e151628aed2a6abf7158809cf4f3c 53787ef6b300ea19f0a43d4915afd440 6 2 90009 3 1
        wall_seconds: 132
        exit_status: 0
        compared_against: coordination/goals/GOAL-AES-003/batches/BATCH-002/tasks/TASK-20260802-9dcca8/runs/PART6-1of3-A.json
        outcome: >-
          IDENTICAL on every field except wall-clock timings, nthreads, and the two
          new output fields. slotmask resolved to 1, false_slots [0]. Structure bases
          5e77f2bad662df57028a36f9fa4894c7 and f9b9980bf046e9cb0e76e0eb00bd295e match.
          Intermediate surviving (k3,k4) pair counts [4080, 8] match. Per-diagonal
          survivor counts [0,0,0,0] match. Every hint_used and hint_true byte matches.
      - check: is the comparison genuinely single-variable?
        result: PASS, after resolving a caveat the producer did not name
        detail: >-
          Strictly, TWO things differ between BATCH-002's t=0 arm and rank 4's t=1/t=2
          arms: the false slot AND nthreads (4 vs 1). The producer asserts nthreads
          affects only work partitioning. I resolved this empirically rather than
          accepting it: my no-mask run used a THIRD thread count (3) and reproduced
          BATCH-002's structure bases and intermediate survivor-pair counts exactly,
          so the plaintext draws and the candidate set are invariant under thread
          count. With that established, the comparison IS single-variable.
      - check: hint bytes, against independently derived key schedules
        result: PASS
        method: >-
          AES key schedule computed with an S-box derived from its algebraic
          definition (GF(2^8) inverse composed with the affine map), verified against
          the FIPS-197 expanded-key vector 13111d7fe3944a17f307a78b4d2b30c5. Not
          copied from any repository source. DIAGP read from sq_null.c.
        detail: >-
          For all three arms and all four diagonals, hint_used carries the HINT key's
          round-6 byte at exactly the named slot and the TARGET key's round-6 byte at
          the other two. hint_bytes_actually_differing = 1 everywhere, as reported.
          The reported true_byte values [253, 65, 253, 122] equal rk[6][DIAGP[d][3]]
          for d = 0..3 as they should.
      - check: outcome recomputation
        result: PASS
        detail: >-
          t=1 gives survivor counts [0,0,0,0] and t=2 gives [0,0,0,0]; both summarise
          to {0: 4}. diagonals_with_survivors = 0 and no survivor set contains the
          true byte or the hint key's byte -- vacuously, the sets are empty.
          Pooled with BATCH-002's t=0 arm this is {0: 12} over 12 diagonals across all
          three slots, as claimed.
    scope_limit_that_must_travel: >-
      This is ONE target key, ONE hint key, ONE seed, nstruct 2, r=6. It shows all
      three hint slots are individually load-bearing FOR THIS INSTANCE. It is not a
      distributional claim and the package does not make one.

  control_checks:
    - control: FIPS-197 C.1 known-answer vector (external positive control)
      engines_passing: [ref.py (producer), pin.c (producer), cnt.c both paths (producer), collide.c (rank 1), vcnt.c (this validator)]
      result: PASS
    - control: single-block cross-engine pin at r=5 and r=10
      values: {r5: 4167e8f8367c38cdb7bde2ade620a7a8, r10: 8df4e9aac5c7573a27d8d055d6e4d64b}
      producer_claim: four-way equal
      my_addition: my independent engine makes it FIVE-way equal on both paths
      result: PASS
    - control: internal cross-check n_alt = (sum m^2 - N)/2 against n = sum C(m,2)
      result: PASS in every arm, mine included
      weight_note: >-
        This is a WEAK control and the ledger already says so (EV-AES-d8a13e
        OBS-B2-3): n and n_alt are two arithmetic functions of the same histogram,
        so their agreement tests the arithmetic, not the counting. The controls that
        actually bind are conservation (sum_b b*hist[b] == N == 2^32) and the paired
        j0 behaviour.
    - control: conservation / counter integrity
      result: PASS in every producer arm and in my valid arms; FAILED in my own first
        M1 attempt and correctly caused me to discard it
      note: This control is demonstrably load-bearing -- see my invalidated attempt.
    - control: negative / null-object control status for this batch
      result: NOT APPLICABLE TO THE ARMS VALIDATED HERE, and correctly not claimed
      detail: >-
        Per docs/inventor-protocol.md section 3, a statistical signal needs a
        null-object control of the same shape. The BATCH-003 arms are DETERMINISTIC
        EXACT COUNTS and structural reproductions, not statistical excesses, so no
        p-value or bias is asserted and none needs a null. The campaign's one
        genuinely statistical claim -- the r=5 yoyo 15.63x -- lives in EV-AES-d8a13e
        OBS-B2-5, where a measured PRP null and a structure-destroyed control reading
        1.00x ARE recorded, and where the decay-with-rounds behaviour IS stated
        (alive at r=5, dead at r=6). That is the correct shape. BATCH-003 adds
        nothing to it and claims nothing from it.
      one_thing_i_would_flag_for_the_next_batch: >-
        The r=4/r=5 counting properties DO have a natural null -- a random bijective
        S-box, already run at 120/120 per the carried-forward note, and a random
        permutation, for which n ~ 2^31. The AES_MC r=5 arm reads 2147661752 against
        that null of ~2147483648, i.e. essentially AT the null, while M1 reads
        ~1.1e12, three orders above it. The package does not present the AES_MC
        number as an excess and is right not to; I record the comparison so that a
        future reader does not mistake the large M1 numbers for a signal about AES.

  metric_recomputations:
    - metric: n and n_alt from raw occupancy histograms, all four M1 arms plus the r=4 anchor
      method: independent python recomputation from the published histograms
      result: EXACT MATCH in every case; n == n_alt in every case; N == 2^32 and
        cell count == 2^32 in every case
    - metric: n for the r=4 M0 anchor as a closed form
      finding: 2^24 * C(256,2) = 16777216 * 32640 = 547608330240, exactly the reported value
    - metric: divisibility of occupancies under M1
      finding: every non-zero bin index is a multiple of 256 in all four M1 arms
    - metric: n mod 8 / mod 16 / mod 256
