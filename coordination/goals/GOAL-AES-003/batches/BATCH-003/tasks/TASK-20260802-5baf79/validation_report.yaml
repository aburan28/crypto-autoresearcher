  priority_1_cross_instrument_confound:
    the_question_as_put: >-
      Does an AES-NI-path agreement plus a single-block software pin license
      trusting the SOFTWARE COUNTING KERNEL's M0/M1 outputs? The producer's own
      read was NARROWED, NOT CLOSED, and the Coordinator did not overrule it.

    ruling: >-
      THE PRODUCER'S READ WAS CORRECT ON THE EVIDENCE IT HAD, AND IS NOW
      SUPERSEDED BY MEASUREMENT. I ran the missing count twice: once on an engine
      I wrote, and once on the producer's OWN unmodified cnt.c software binary.
      Both return the anchor value exactly. For the anchor configuration the
      confound is CLOSED, not merely narrowed. The producer failed only on time,
      as it said, and the reason is a diagnosable design property of cnt.c rather
      than any defect in what it measures.

    what_i_ran:
      - arm: V1 -- my own software engine on the anchor configuration
