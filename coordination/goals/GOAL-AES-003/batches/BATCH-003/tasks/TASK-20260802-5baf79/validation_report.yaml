        for every j0", which is correct for fact 2 AS STATED ("MC has no zero
        entry", a j0-independent sentence) but should not be read as "the critical
        entries vanish for every j0" -- they do so only at j0=0. This matters in
        rank 1's FAVOUR, see the understatement audit.

