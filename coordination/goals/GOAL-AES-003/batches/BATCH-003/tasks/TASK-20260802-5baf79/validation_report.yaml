  verdicts_per_claim:
    - claim: "The engines agree exactly on identical configuration: n = 2147661752, n_alt, max_occ 12, all 13 histogram bins."
      verdict: CONFIRMED
      basis: Reproduced by me on an independent software engine AND on the producer's own previously-unexercised cnt.c software path. Four-way exact agreement, now five-way counting mine.
    - claim: "Engine B's software T-table path never produced a count; that is the path BATCH-002 used for every matrix-varying arm, so the software counting kernel is anchored only at single-block level."
      verdict: CONFIRMED as a description of the package, SUPERSEDED by measurement in this report.
      basis: True of the submitted package. I completed the run (1983 s, exit 0) and it agrees exactly. The cause was a thread-scaling property of cnt.c, not a defect in what it measures.
    - claim: "The confound is NARROWED, NOT CLOSED."
      verdict: CONFIRMED for the package as submitted; NO LONGER THE CASE for the anchor configuration.
      basis: See priority_1. The residual is a one-configuration scope limit plus a structural impossibility of ever anchoring matrix-varying arms against engine A, which is handled by third-engine reproduction instead.
    - claim: "P2.4: count5.c uses a uint8 saturating counter and cannot represent the r=4 critical arm whose max occupancy is exactly 256."
      verdict: CONFIRMED from source, and UNDERSTATED.
      basis: Saturating increment at line 63, 256-bin histogram, max_occ scan from 255. Understated because count5.c also has no matrix parameter at all, so no M0/M1 arm was expressible on engine A for a more basic reason.
    - claim: "Rank 1: the r=5 half of CORR-20260802-46b73b SURVIVES; n mod 8 = 0 on a fresh key and a from-scratch engine."
      verdict: CONFIRMED, and independently extended.
      basis: Reproduced on a fourth key with my own engine (n = 1097582510080, n mod 8 = 0) and BATCH-002's exact number reproduced to the digit under their key.
    - claim: "M1 is non-singular, determinant 20 by two independent methods."
      verdict: CONFIRMED
      basis: My own Leibniz and Gauss-Jordan computations, inverse and both identity products.
    - claim: "Rank 1 did NOT reproduce BATCH-002's exact M1 counts; those exact numbers remain unreproduced."
      verdict: CONFIRMED as of rank 1; NOW RESOLVED for the j0=0 arm by this validation. The j0=1 arm remains unreproduced.
    - claim: "The producer declined to call the rule strengthened by more than one arm's worth."
      verdict: CORRECT MODESTY, NOT EXCESSIVE, on arm count; but rank 1 understated its own content (256-divisibility) and its own adversarial j0 choice.
    - claim: "Rank 1's r=4 anchor returned 547608330240 with the identical histogram -- a third independent agreement, not a shared-code artifact."
      verdict: CONFIRMED as genuinely independent; weight qualification required (n is a deterministic function of a single structural fact, per EV-AES-d8a13e OBS-B2-3).
    - claim: "Single-slot corruption at t=1 and t=2 both gave {0: 4}."
      verdict: CONFIRMED
      basis: Recomputed from the run JSON; hint substitution independently verified against key schedules I derived from the algebraic S-box definition.
    - claim: "The generalising patch reproduces the original exactly when the mask argument is omitted, so the comparison is genuinely single-variable."
      verdict: CONFIRMED, and now verified by EXECUTION rather than by reading the diff. Two footnotes: the JSON output is a superset not byte-identical, and nthreads also differed, which I resolved empirically.
    - claim: "n mod 8 = 0 is the load-bearing measured property of the M1 arms."
      verdict: UNDERSTATED / LOW DISCRIMINATION. The arms measure that 256 divides every fibre, hence n mod 256 = 0. On these arms the mod-8 reading follows arithmetically from the fibre structure and could not have fired the falsification criterion unless that structure broke.
    - claim: Any statement about full-round or deployed AES, or any comparison to published cryptanalysis.
      verdict: NOT MADE by the package, and NOT MADE here. Both producers state the toy tier and its basis explicitly and correctly.
    - claim: Timeouts treated as resource exhaustion, never negative evidence.
      verdict: CONFIRMED throughout, and independently vindicated: I completed one of the timed-out runs and it agreed.

  not_checked:
    - item: BATCH-002's second M1 arm (r=5, M1, j0=1, their key, claimed n = 1097141846016)
      reason: Budget. One 2^32 arm at cw=16 costs ~700 s and I had already reproduced the j0=0 arm exactly.
    - item: Direct re-execution of the r=4 M0 anchor on my own engine
