  instruments_written_for_this_validation:
    - path_in_scratch: vcnt.c
      sha256: 2a612d1eb9872c1cf06619f6393e210755f5e5c4c184538503654096ed01d036
      build: gcc -O3 -march=native -pthread -o vcnt vcnt.c
      what: >-
        Independent counting engine written from FIPS-197 and the object
        description in the two PREREGISTRATIONs. Software T-table SPN with a
        configurable GF(2^8) mixing matrix; no AES-NI path in the counting kernel.
      kernel_design_difference: >-
        A THIRD kernel design, deliberately unlike both producers'. count5.c is
        value-partitioned with a uint8 SATURATING counter; cnt.c is
        value-partitioned with every thread rescanning the whole 2^32 input space
        (NTHREADS-fold redundant encryption, plain non-atomic increments);
        collide.c is value-WINDOW partitioned with private per-thread arrays.
        vcnt.c is INPUT-partitioned -- each input encrypted exactly once, total
        work 2^32 independent of thread count -- writing into one shared array via
        RELAXED ATOMIC increments. Non-saturating, with an exact conservation
        check sum_b b*hist[b] == N == 2^32 and a cell-count check.
      external_correctness_anchor: >-
        FIPS-197 C.1 known-answer vector, r=10 with the AES MixColumns matrix,
        returns 69c4e0d86a7b0430d8cdb78070b4c55a on BOTH internal paths (a
        byte-array reference implementation and the T-table fast path). Every
        counting run additionally self-tests the fast path against the byte-array
        reference on the first 64 coset points before counting begins. This pins
        the S-box, key schedule, ShiftRows, MixColumns and byte order against a
        published standard rather than against any BATCH-001/002/003 artifact.
    - path_in_scratch: gf.py
      sha256: 94efc467f80a667a218f88493a8dde2c1a79fab44a958c51af69302ab3fff8e9
      what: >-
        GF(2^8) linear algebra written for this task. Leibniz determinant over all
        24 permutations of S4 and Gauss-Jordan pivot-product determinant, inverse
        by augmented elimination, both products checked against the identity.
        BATCH-003's matrix_verification.json and BATCH-002's matrices.json were
        NOT read by it.
    - path_in_scratch: (inline python)
      what: >-
        AES key schedule with the S-box DERIVED FROM ITS ALGEBRAIC DEFINITION
        (multiplicative inverse in GF(2^8) composed with the affine map), not
        copied from any source in this repository, checked against the FIPS-197
        expanded-key vector 13111d7fe3944a17f307a78b4d2b30c5. Used to verify the
        rank 4 hint bytes.
    - path_in_scratch: cnt.c, sq_slot.c
