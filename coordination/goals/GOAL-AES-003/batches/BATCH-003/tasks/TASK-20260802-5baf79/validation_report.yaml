        inverse by augmented elimination, both M*Minv and Minv*M checked.
      M1_hex: "00030101010203000101000303000102"
      M1_rows: [[0,3,1,1],[1,2,3,0],[1,1,0,3],[3,0,1,2]]
      det_leibniz: 20
      det_gauss_pivot_product: 20
      methods_agree: true
      non_singular: true
      inverse: [[0,123,246,141],[141,123,123,0],[246,141,0,123],[123,0,141,123]]
      M_times_Minv_is_identity: true
      Minv_times_M_is_identity: true
      zero_entries: [[0,0],[1,3],[2,2],[3,1]]
      agreement_with_rank1: EXACT on determinant, inverse and zero set
      verdict: CONFIRMED. M1 is non-singular. Nothing that depends on it is voided.
      added_precision_rank1_did_not_state: >-
        M1's zeros sit at row (-c) mod 4 of column c. CORR-20260802-46b73b's r=4
        critical entries are M[(-c-j0) mod 4][c]. These two sets COINCIDE only when
