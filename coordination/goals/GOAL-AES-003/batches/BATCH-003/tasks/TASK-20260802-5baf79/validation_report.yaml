    five_way_exact_agreement:
      configuration: r=5, j0=1, full 2^32 coset of D_0, key 2b7e15..., base 001122..., real AES MixColumns, C1 convention
      engines:
        - A1_count5 (BATCH-001, AES-NI, value-partitioned, saturating uint8)
        - B2_cnt_aesni (BATCH-002 engine, AES-NI path)
        - V2 cnt SOFTWARE path (BATCH-002 engine, the previously-unexercised path)
        - V1 vcnt (this validator, independent software engine, input-partitioned atomics)
      n: 2147661752 in all four
      n_alt: 2147661752 in all four
