  priority_2_r5_half:
    m1_non_singularity:
      requirement: verify independently before accepting anything that depends on it
      method: >-
        gf.py, written for this task; rank 1's matrix_verification.json and
        BATCH-002's matrices.json were not read by it. Determinant computed twice
        by genuinely different algorithms (Leibniz sum over all 24 permutations of
