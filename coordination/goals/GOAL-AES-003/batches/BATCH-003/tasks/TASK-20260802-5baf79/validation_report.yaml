  limitations:
    - >-
      TOY TIER. Reduced-round AES-shaped SPN only, r in {4,5,6}. Nothing here is a
      statement about full-round or deployed AES, and no comparison to published
      cryptanalysis is made or implied in either direction.
    - >-
      SESSION AND IMPLEMENTATION INDEPENDENCE ONLY. NO MODEL INDEPENDENCE under
      standing basis 0137a051eb5828789eb267fa83c8278086578d4c. This validation
      counts toward no closure quorum.
    - >-
      The cross-instrument anchor now holds at exactly ONE configuration (r=5, j0=1,
      AES MixColumns, one key, one base). Agreement there is not agreement everywhere.
    - >-
      No cross-instrument anchor against BATCH-001's engine is possible for ANY
      matrix-varying arm, at any budget, because count5.c cannot express a
      non-AES mixing layer. Those arms are anchored by independent re-implementation
