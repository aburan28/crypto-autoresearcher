    - metric: count5.c saturation counterfactual on the r=4 histogram
      finding: 543330140160, short of the true 547608330240 by 4278190080
      status: DERIVED BY ARITHMETIC, NOT MEASURED

  heuristic_validation_checks:
    applicable: false
    reason: >-
      This package makes no heuristic-conditional complexity claim of the
      docs/target-result-profile.md exemplar shape. There is no pre-registered
      analytic distribution, no substitute-sampling correspondence, no asymptotic
      exponent and no extrapolation to cryptographic scale. Every arm is an exact
      deterministic enumeration over a fully materialised 2^32 input set, so the
      quantity measured is a count, not an estimate, and no sampling distribution is
      involved. Preregistration WAS present and WAS honoured -- rank 1's
      PREREGISTRATION.md fixes the falsification criterion and the exact-value
      predictions before measuring, and I confirmed the predicted 1098070622208 was
      written down before the arm that would have produced it was dropped.

