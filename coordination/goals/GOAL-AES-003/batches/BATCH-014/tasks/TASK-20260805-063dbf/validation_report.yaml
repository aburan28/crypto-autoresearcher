  metric_recomputations:
    - claim: >-
        M1 vs r5 (0 hits at 2^30 vs 14 hits at 2^30, same exposure) uses an
        exact conditional-binomial test with p0=0.5: p=0.00012207031250000008,
        ratio_ci lower bound 3.3171226765018393.
      recomputed: >-
        Independently, via scipy.stats.binomtest(14, n=14, p=0.5,
        alternative='two-sided') in a fresh script: p_value=0.0001220703125
        (matches to reported precision). Clopper-Pearson 95% CI on the
        proportion: [0.7683642383498855, 1.0] (matches cp_p_ci exactly).
        Transformed to a rate-ratio CI via p/(1-p) under matched exposure:
        lower bound 3.3171226794871975 (matches the reported 3.3171226765018393
        to 8 significant figures; residual difference is floating-point
        implementation noise, not a discrepancy in method). Noted and
        confirmed as a POSITIVE finding: RESULTS.json's actual p0_null is
        0.500000000225, not a clean 0.5 -- because the test correctly uses
        EXACT nontrivial-trial exposure (r5's 1073741824 vs M1's
        1073741823, which excluded one trivial swap) rather than nominal
        2^30 for both. Recomputing p0 = 1073741824/(1073741824+1073741823)
        gives 0.5000000002328306, matching the reported figure to the digit
        this precision supports. This is a subtle correctness point the
        producer got right, not an error.
    - claim: >-
        M2 vs r5 (9 hits at 2^33 vs 14 hits at 2^30, 8x exposure) uses an
        EXPOSURE-WEIGHTED conditional-binomial test with p0=1/9 (NOT 0.5),
        since M2's trial count is 8x r5's: p=1.336455492547555e-08.
      recomputed: >-
        THIS IS THE EASY PLACE TO GET WRONG, per the task card, and it was
        checked with particular care. Confirmed the null model directly: if
        both arms share one per-trial rate lambda, and E_r5=2^30, E_M2=2^33,
        then conditional on the pooled hit count n=k_r5+k_M2, k_r5 ~
        Binomial(n, p0) with p0 = E_r5/(E_r5+E_M2) = 1/(1+8) = 1/9 -- the
        producer's null probability is the correct one for this asymmetric-
        exposure design, not p0=0.5. Independently ran
        scipy.stats.binomtest(14, n=23, p=1/9, alternative='two-sided'):
        p_value=1.336455488889965e-08 (matches to 11 significant figures).
        Clopper-Pearson 95% CI: [0.38541895738885146, 0.8029235760309856]
        (matches cp_p_ci exactly). Rate-ratio point estimate
        (14/1)/(9/8)=12.444444444444445 (matches ratio_point exactly) and
        ratio_ci [5.016997670495473, 32.59338929986781] (matches
        [5.016997669304085, 32.59338929212693] to reported precision).
    - claim: >-
        M1's own null reading: R_point=0.0, rate-ratio 95% CI [0.0,
        3.688879457433927] against its own analytic null expectation (~1
        event).
      recomputed: >-
        Independently derived the exact (Garwood) Poisson CI for x=0 events:
        lower=0 by convention, upper = chi2.ppf(0.975, 2)/2 / m with
        m=0.9999999991, giving 3.6888794574339268 -- matches to the digit.
    - claim: >-
        M2's own null reading: R_point=1.1250000002671876, 95% CI [0.5144,
        2.1356] against its own analytic null expectation (~8 events).
      recomputed: >-
        Independently derived the exact Poisson count CI for x=9 events:
        [chi2.ppf(0.025,18)/2, chi2.ppf(0.975,20)/2] = [4.115373097378334,
        17.084803451419166]; dividing by m=7.9999999981 gives rate-ratio CI
        [0.5144216372944669, 2.1356004319346007]. R_point = 9/7.9999999981 =
        1.1250000002671876. All match exactly.
    - claim: >-
        The self-check reproduces EV-AES-e4c091's own published (14 vs 1)
        figures: p=0.0009765624999999976, ratio_ci [2.1300416502432267,
        591.9684937326185].
      recomputed: >-
        Independently, scipy.stats.binomtest(14, n=15, p=0.5) gives
        p_value=0.0009765625 (matches); Clopper-Pearson CI [0.6805154334216967,
        0.9983135697586446] transformed to ratio_ci gives
        [2.1300416502432444, 591.9684937316425] (matches to reported
        precision). This self-check is also independently cross-verified
        against EV-AES-e4c091's own text (OBS-B9-3: "p=0.0009765625, rate
        ratio 14.0, 95% CI [2.130, 592.0]"), read directly from that ledger
        record rather than trusted from this task's citation.
    - claim: >-
        All producer JSON/JSONL parses cleanly, including RESULTS.json's
        non-standard `Infinity` token in M1's ratio_point/ratio_ci fields.
      recomputed: >-
        Independently re-ran python3 json.load()/loads() on RESULTS.json,
        runs/decision_analysis.json, every runs/*.json file, and
        budget_stamps.jsonl (line-by-line) in this session; all parse
        cleanly. Noted as a minor style point, not a defect: `Infinity` is
        accepted by Python's json module by default (allow_nan=True) but is
        not strict-RFC8259 JSON; a stricter downstream parser (e.g.
        `json.loads(..., parse_constant=...)` disabled, or a non-Python
        consumer) would reject it. This matches prior campaign convention
        (the same construct appears in BATCH-009's own outputs) and is not a
        parse failure here, but is flagged as a portability caveat.

  control_checks:
    - control: >-
        (a) The Feistel round function shares no vocabulary with AES's
        actual S-box table, MixColumns matrix, or ShiftRows permutation --
        checked against rc8probe.c's actual AES tables, read directly, not
        merely against the producer's own audit prose.
      finding: >-
        CONFIRMED, independently. Read rc8probe.c
        (coordination/goals/GOAL-AES-003/batches/BATCH-007/tasks/TASK-20260803-e55757/rc8probe.c)
        directly and confirmed it contains `SBOX[256]`, `ISBOX[256]`,
        `key_expand` (Rijndael RotWord/SubWord/RCON key schedule),
        `shift_rows`/`inv_shift_rows`, `mix_columns`/`inv_mix_columns`, and
        the `0x1b` GF(2^8) reduction constant at lines 53 and 124. Ran my own
        grep (`GLOG|GEXP|gmul|ginv|SBOX|MixColumns|mix_columns|ShiftRows|
        shift_rows|RCON|key_expand|0x1b\b`) against rc8probe_feistel.c
        directly: every match is inside a `/* ... */` comment (the
        provenance-disclosure block and the "NOT AES's ShiftRows" design-intent
        lines) -- zero matches in any C identifier, table, or executable
        statement. Independently read the round function
        (feistel_F, lines 69-78): 64-bit integer addition, xor-shift-by-33,
        multiplication by 0xff51afd7ed558ccd and 0xc4ceb9fe1a85ec53 (the
        public murmur3 fmix64 finalizer constants), all under plain
        wraparound arithmetic on Z/2^64 -- no GF(2^8) multiply, no byte
        lookup table, no 4x4 byte-array indexing anywhere in the oracle
        (feistel_F/feistel_round_keys/feistel_encrypt/feistel_decrypt). The
        PW/CW probe-geometry arrays ARE copied byte-for-byte from rc8probe.c,
        disclosed as harness measurement machinery (not oracle code) in both
        the file header and INDEPENDENCE_AUDIT.md section 1.3 -- this is
        exactly the reuse the task card permitted and does not implicate the
        oracle.
    - control: >-
        (b) The oracle shares no code with the yoyo_sbox_v2-v4 or
        rc8probe-ideal (perm128) lineage.
      finding: >-
        CONFIRMED, independently. Grepped
        `feistel|Feistel|fmix64|0xff51afd7ed558ccd|0xc4ceb9fe1a85ec53`
        against the actual source files rc8probe.c (BATCH-007),
        yoyo_sbox_v4.c (BATCH-009), rc8probe_ideal.c (BATCH-011),
        rc8probe_ideal.c (BATCH-012) directly -- exit code 1 (grep's
        no-match code), zero matches in any of the four files, reproducing
        the producer's runs/grep_independence.txt result but from a fresh
        invocation against the source rather than trusting the archived
        grep transcript alone. Confirmed by direct read that
        rc8probe_feistel.c contains no `#include` of, or reference to,
        yoyo_sbox.c/_v2/_v3/_v4.c or rc8probe_ideal(_old).c, and contains no
        `dom[]`/`rng[]` pair-storage arrays or injectivity-rejection logic
        (the perm128 architecture's defining feature per EV-AES-837cd8) --
        it is a direct algebraic O(1)-memory evaluation, structurally
        incompatible with a stored-pair table by construction. This meets
        the bar EV-AES-acddd0's OBS-B11-1 set for the prior instrument
        (zero shared symbols in either direction, confirmed by grep and an
        independent validator) AND the additional bar this task's card
        requires (independence from AES's own actual operations, which
        BATCH-011's audit did not need to establish since it reused AES
        itself for its live arm).
    - control: >-
        (c) The oracle is DETERMINISTIC given the key -- same key+input
        always gives the same output, NOT resampled per trial. This is the
        single most important construction property.
      finding: >-
        CONFIRMED DETERMINISTIC, independently, on two grounds. (1) Direct
        code read: `feistel_round_keys(key)` is called exactly once in
        main(), before any worker thread is spawned (line 284, "fixed once,
        NOT resampled per trial" -- verified true by tracing the call graph:
        `main` -> `feistel_round_keys` (once) -> `pthread_create` x nthr ->
        `worker` -> `enc_r`/`dec_r` -> `feistel_encrypt`/`feistel_decrypt`,
        which read the global `RK[]` array and never write it). No RNG call
        appears inside feistel_encrypt/feistel_decrypt/feistel_F -- they are
        pure functions of (RK[], input) with no internal state. (2) The
        mechanical self-check: read runs/detcheck.json directly --
        same_key_same_input_same_output=true, decrypt_inverts_encrypt=true,
        round_key_schedule_reproducible=true, over 4096 trials, with zero
        fixed points -- and confirmed this gate is invoked and its result
        checked BEFORE any measurement arm runs, per PREREGISTRATION.md
        section 2 ("Gate: an arm is invalid_measurement if this check has
        not passed for the key in use before the arm runs"). Both M1 and M2
        use the same key_hex as the frozen r5 comparator
        (bdf3823182ad657dab3d556b3886ba72), confirmed directly from
        runs/M1-FEISTEL-P30.json and runs/M2-FEISTEL-P33.json. Had this
        oracle instead been resampled per trial, it would be a second
        idealness test (an ad hoc, weaker one, without perm128's
        injectivity guarantee) rather than a structuredness test, and this
        batch's entire premise (testing whether idealness specifically, vs
        mere structurelessness, drove BATCH-009's OUTCOME-A) would collapse
        -- but the code and the mechanical gate both independently confirm
        this is not what happened here.
    - control: >-
        Null-object control discipline (docs/inventor-protocol.md section
        3): does the report state what the measured quantity should do as
        the parameter meant to destroy the excess (idealness -> arbitrary
        non-AES determinism) is varied, and does it check that this
        actually happens rather than assuming it?
      finding: >-
        SATISFIED. This task is itself constructed as exactly this kind of
        control: it varies the "kind of null object" from an ideal
        permutation (BATCH-009) to a deterministic, structured-but-non-AES
        Feistel PRP (this task), and preregisters in advance (§4) that the
        excess is expected to stay absent under EITHER outcome being
        reportable without softening (OUTCOME-A' vs OUTCOME-B', with
        OUTCOME-B' explicitly flagged to go in the first line of
        RESULTS.json if it occurred). It did not occur; the excess stayed
        absent at both exposures, and the record states this plainly rather
        than as an assumed default. One gap, correctly disclosed by the
        producer itself in RESULTS.json's `what_was_not_reached`: no decay
        check (varying Feistel round count) was run, so this control
        establishes absence for ONE fixed 16-round construction, not for
        the class of "sufficiently non-AES deterministic PRPs" as the
        parameter varies continuously -- the report is honest about this
        boundary and does not overclaim past it.

