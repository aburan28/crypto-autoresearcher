  power_ruling: >-
    The achieved exposure gives this comparison MEANINGFUL power relative to
    BATCH-009's own design, by direct construction: M1 (2^30 trials) is
    matched exposure to BATCH-009's own N1/P1 primary arm (same analytic
    null expectation of ~1 event), and M2 (2^33 trials, 8x) mirrors
    BATCH-009's own N1/N2 two-level design exactly (same ~8-event analytic
    null expectation N2 achieved). Both targets were reached in full -- no
    shortfall, confirmed from budget_stamps.jsonl (elapsed 1421s of a
    declared 5400s budget, well within margin) and from RESULTS.json's
    exposure_decision block, which records the 2^20 smoke and 2^26 timing
    calibration measured BEFORE any decisive arm, exactly as
    PREREGISTRATION.md section 3 specified. At M1's exposure the power to
    detect a 14-per-2^30-rate excess is the same modest-count regime
    EV-AES-e4c091 itself flagged for its own matched N1 arm (a "modest
    count"; strength_basis explicitly notes this). M2's tighter interval
    (ratio_ci [5.02, 32.59] against the r5-scaled comparator) is the more
    informative reading, exactly mirroring BATCH-009's own precedent of
    citing the 8x-exposure arm over the matched-exposure arm for power. No
    exposure beyond 2^33 was attempted (disclosed, not silently omitted);
    within the exposure that was reached, the design gives comparisons of
    directly comparable power to BATCH-009's own headline figures, which is
    the correct benchmark since this task deliberately mirrors that design.

  deliverable_rulings:
    independence_audit_accuracy: >-
      ACCURATE, independently re-verified against the actual cited source
      files rather than trusted from the audit's own prose. Every specific
      technical claim in src/INDEPENDENCE_AUDIT.md (no S-box array, no
      GF(2^8) tables, no MixColumns constants, no ShiftRows-style byte
      permutation, no key-schedule RCON table, no shared symbol with the
      yoyo_sbox/perm128 lineage) was checked directly against
      rc8probe_feistel.c and against the four named comparison files
      (rc8probe.c, yoyo_sbox_v4.c, both rc8probe_ideal.c files) and found
      true in every instance checked.
    determinism_confirmation: >-
      CONFIRMED via both code-path tracing and the mechanical detcheck gate
      (runs/detcheck.json), independently re-read. The construction is
      deterministic given the key, not resampled per trial. This is the
      correct construction for a structuredness test distinct from an
      idealness test.
    statistical_correctness: >-
      CORRECT. All headline statistics independently recomputed from raw
      counts in fresh scipy code, matching to the reported precision,
      INCLUDING the exposure-weighted p0=1/9 null probability for the
      M2-vs-r5 comparison (the specific place the task card flagged as
      easy to get wrong) and the subtler exact-exposure (not nominal 2^30)
      p0=0.500000000225 used for M1-vs-r5, which is more rigorous than a
      naive p0=0.5 would have been and was independently confirmed correct.
    outcome_reappearance: >-
      OUTCOME-A' on both M1 and M2, independently confirmed: the r=5 excess
      does NOT reappear under this deterministic, structured, non-AES
      Feistel substitute. M1 read 0 hits against a 14-hit comparator
      (p=1.22e-4 that this is consistent with equal rates in the direction
      that favors the null being ABSENT under M1, since M1's own count sits
      at the low end -- the CI on M1's own rate ratio contains 1); M2 read 9
      hits, consistent with its own ~8-event analytic null (CI [0.51, 2.14]
      contains 1) and far below what scaling the r5 rate to 8x exposure
      would predict (~112 hits). This is one additional data point
      consistent with U4 resolving toward "idealness specifically was not
      doing the work in BATCH-009," on ONE fixed 16-round construction, at
      one key -- exactly as the record itself states, no more and no less.

  overstatement_or_understatement_audit:
    - direction: neither overstated nor understated
      finding: >-
        The headline and plain_statement in RESULTS.json are carefully
        scoped: "one additional data point," "does not resolve U4 for the
        space of all non-AES deterministic PRPs," "does NOT establish that
        the r=5 excess is real." Every quantitative claim independently
        checked in this report matches the producer's figures. No
        fabrication found anywhere the source material was independently
        checkable.
    - direction: producer UNDERSTATED, correctly disclosed as a limitation
      finding: >-
        RESULTS.json's own `what_was_not_reached` block already discloses
        the two most consequential gaps this validator would otherwise have
        flagged as omissions: (1) no independent second implementation of
        the statistics machinery was built within this task (the self-check
        against EV-AES-e4c091's published figures is the only cross-check
        performed) -- this validation report supplies exactly that missing
        independent second derivation, and it matches; (2) no decay check
        (varying Feistel round count) was run, so the construction's
        "sufficiently non-AES, structureless-relative-to-AES" property is
        established for one fixed 16-round instance, not as a function of a
        varied parameter. Both gaps are the producer's own honest
        disclosure, not something this review had to surface independently
        -- correctly self-reported, not an overstatement.
    - direction: no finding of understatement by this validator beyond what
        the producer already disclosed
      finding: >-
        Nothing checked in this session (hashes, determinism, independence
        audit, all reported statistics, comparator fidelity, preregistration
        timing, budget accounting) turned up a claim that understates a
        limitation the producer did not already name. The
        `boundaries`/`what_was_not_reached` sections in RESULTS.json are
        thorough and match what independent inspection found.

