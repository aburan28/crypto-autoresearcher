  limitations:
    - >-
      RSS-polling race: rss_monitor.py's final VmHWM read can theoretically
      miss a small increment in the last <50ms before process exit if
      proc.poll() reaps the child before the subsequent /proc/<pid>/status
      read. Given the workload's roughly-monotonic-growth allocation
      pattern and the measured figure already sitting BELOW the
      allocation-arithmetic estimate (not above budget), this is judged a
      negligible risk here, not a defect requiring a re-run -- but it is a
      real gap in the methodology worth carrying forward if this script is
      reused for workloads with sharper end-of-run memory spikes.
    - >-
      Toy-tier scope, unchanged from BATCH-009/BATCH-011: rc8probe_ideal's
      128-bit-block, 5-round, non-AES random-S-box construction. Nothing in
      this task's artifacts, nor in this validation, supports any statement
      about full-round or deployed AES, nor any comparison to published
      cryptanalysis in either direction. This report makes none.
    - >-
      Comparison B remains substantively unresolved after this task, exactly
      as the producer states: 0 hits in both arms at 2^25 is uninformative
      given expected count ~0.44 in the live arm under BATCH-009's linear
      extrapolation (itself a projection, not a re-measurement at this
      scale -- the linear-scaling assumption behind 14/2^30 is itself
      untested at 2^25 specifically). This validation does not extend
      BATCH-009's finding's evidentiary weight in either direction; it only
      certifies that this task's OWN artifacts are internally consistent,
      correctly derived, and honestly reported.
    - >-
      Per docs/inventor-protocol.md section 6 (the ladder for claimed
      improvements executed off the target scale): the memory optimization
      here (load factor 0.5->1.0) IS measured as a ratio against baseline in
      the sense that matters -- both the OLD and NEW binaries were run and
      diffed at 2^24 (equivalence, behavior-preserving) and the memory
      reduction itself is a directly measured quantity (8.590 GB estimate/
      unreachable at 2^25 old vs 6.293 GB measured/reachable new) rather
      than a bare projection -- so step 2 of that ladder (run the whole
      pipeline at reduced scale and measure the ratio, not project it) is
      satisfied for THIS lever. However, no speedup or attack-cost
      improvement is claimed by this task at all (certificate: kind: none),
      so most of that ladder's speedup-specific requirements do not apply
      here; flagging only for completeness since the task card invoked the
      ladder standard generally.
    - >-
      This validator did not independently recompile and re-execute
      rc8probe_ideal / rc8probe_ideal_old from source (no C toolchain
      invocation was performed in this validation pass) to reproduce the
      run outputs bit-for-bit from scratch; verification here is by (a)
      independent sha256 recomputation of every archived path against the
      committed snapshot, (b) independent byte-diffs and patch-reapplication
      using the archived source and patch files, and (c) independent
      arithmetic recomputation of every numeric claim from the archived
      source and JSON. This is a strong but not maximal reproduction bar;
      a from-scratch rebuild-and-rerun was judged unnecessary given the
      determinism argument verified mechanistically in the control_checks
      section above (same seeds + same idx-cap-independent lookup logic
      implies same output, which was independently confirmed at the source
      level, not merely assumed).

