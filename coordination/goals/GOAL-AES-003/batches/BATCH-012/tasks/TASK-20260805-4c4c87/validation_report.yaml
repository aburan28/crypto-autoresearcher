      result: pass

  control_checks:
    - name: equivalence check re-executed independently
      method: >-
        `diff eq_live_old.json eq_live_new.json` and `diff eq_ideal_old.json
        eq_ideal_new.json` both return no output (byte-identical), confirmed
        directly rather than trusting the producer's stated diff result.
        Both arms' .err files hash to the sha256 of the empty string
        (clean stderr, no warnings).
      result: pass
    - name: mechanistic soundness of the equivalence claim (not just output-matching)
      method: >-
        Read perm128_probe, perm128_forward, and perm128_inverse in full.
        perm128_probe(idx, side, idx_mask, key, slot) computes h =
        blk_hash(key) & idx_mask, then walks linear probing (h = (h+1) &
        idx_mask) while idx[h] != EMPTY, comparing side[idx[h]] against key
        by exact byte comparison (blk_eq, memcmp) at each occupied slot --
        never trusting the hash alone. This is standard open-addressing
        with exact-compare collision resolution and no deletions. Its
        found/not-found return value and, when found, the returned pid
        (P->dom_idx[dslot] / P->rng_idx[rslot]) are therefore determined
        purely by which 128-bit keys are ALREADY PRESENT in dom[]/rng[] up
        to P->count -- never by idx_cap itself, as long as idx_cap is large
        enough that the table never fills (both old and new load factors
        here satisfy that: 0.5 and ~1.0 nominal, with the +16 slack term
        giving strict headroom even at ~1.0). idx_cap only changes WHICH
        bucket a given key's probe sequence starts at and how long that
        sequence is -- never WHICH value comes back. perm128_forward and
        perm128_inverse call blk_random(st) (which consumes from the shared
        RNG state st) only on a genuine cache MISS, and the retry loop `do {
        y = blk_random(st); } while(perm128_probe(...))` only re-draws if
        the freshly drawn value happens to already exist in the opposite
        array -- a condition that, by the above, is also idx_cap-independent
        for a fixed RNG stream and fixed prior contents. Consequently, for
        identical seeds/CLI args, the entire sequence of (x,y) pairs
        realised, and every returned value, is provably invariant under the
        idx_cap change, not merely observed to be invariant in this one run.
        The byte-identical eq_* outputs are the expected corollary of this
        mechanism, not a coincidence that happened to hold at 2^24 trials.
      result: pass -- equivalence is mechanistically sound, confirmed at the
        source level, independent of the output-diff check
    - name: RSS measurement methodology (rss_monitor.py)
      method: >-
        Read the full script. It polls VmHWM from /proc/<pid>/status at
        50ms intervals (time.sleep(0.05)) and reports the max sampled
        value. VmHWM is a kernel-maintained, monotonically non-decreasing
        peak-RSS field updated on every page fault by the kernel itself,
        not recomputed by the polling script -- so between polls, VmHWM's
        true value at any instant is not "missed" in the sense of being
        under-tracked by the kernel; the risk is only that the polling
        script's LAST sample could be stale relative to the true peak if the
        process allocates/touches new pages in the gap between the last
        successful poll and process exit.
        Given this workload's allocation pattern -- perm128_init does one
        large malloc for dom/rng (not memset, so pages are touched lazily
        as pairs are written) and one malloc+memset for the two idx arrays
        (memset forces immediate full-table page-in at the START of the
        run) -- the true peak for dom/rng grows roughly monotonically with
        P->count across the whole ~155s run and is maximal near run end,
        which is also where the process is about to exit. There IS a
        theoretical race: `ret = proc.poll()` can reap the child before the
        subsequent `read_vmhwm(pid)` call, in which case /proc/<pid> may
        already be gone and the very last fractional-second's growth could
        be missed. This is a genuine, minor methodology gap, but the
        magnitude of any missed increment is bounded by how much of the
        pair arrays could be touched in under ~50ms of an over-150-second
        run -- a small fraction of the total, not enough to plausibly
        explain the observed measured-vs-estimated 2.3% GAP (which runs the
        other way: measured 6.293 GB is BELOW the 6.442 GB allocation
        estimate, i.e. allocator/page slack, not evidence of a missed
        higher peak). 3070 poll samples over 154.9s (~19.8/s, consistent
        with the 50ms interval) is dense enough that any missed final
        increment would be small relative to the reported figure.
      result: pass, with a noted minor limitation (see limitations)
    - name: RSS figure sanity vs the estimate
      method: >-
        6.293 GB measured vs 6.442 GB allocation-arithmetic estimate: measured
        is below the estimate, consistent with the estimate being an
        allocator-size upper bound (malloc size, not necessarily all pages
        touched, though here memset of idx arrays and full realisation of
        dom/rng, perm_pairs_realised==perm_pairs_capacity, should touch
        nearly all of it) rather than measured exceeding budget. No red
        flag; measured < estimated < 8 GB budget throughout.
      result: pass

