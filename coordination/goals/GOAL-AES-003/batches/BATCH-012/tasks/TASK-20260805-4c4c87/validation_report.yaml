    - name: expected-count arithmetic (14/2^30 * 2^25 = 0.4375)
      method: >-
        Recomputed directly: 14 * (2^25/2^30) = 14/32 = 0.4375. Correct.
        Separately, each run's own JSON output carries a DIFFERENT field,
        "null_expectation_analytic": 0.03125 (matching prefix_model_k4 in
        the live-arm JSON), which is an in-run analytic null model for a
        specific prefix-collision statistic internal to this instrument --
        NOT the same quantity as BATCH-009's empirically-extrapolated
        0.4375 hit-rate figure. RESULTS.json keeps these two numbers
