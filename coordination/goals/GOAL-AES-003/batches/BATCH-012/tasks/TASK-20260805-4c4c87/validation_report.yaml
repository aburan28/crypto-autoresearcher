  metric_recomputations:
    - name: dom+rng and idx-table memory arithmetic (step2 in RESULTS.json)
      method: >-
        Recomputed from first principles against the actual C source, not
        copied from the report. blk128 is `struct { uint8_t b[16] }` = 16
        bytes (confirmed by reading the typedef). dom/rng arrays are each
        `malloc(sizeof(blk128) * max_pairs)`, i.e. 16*max_pairs bytes each,
        32*max_pairs total, with max_pairs = N*4 at the armideal call site
        (confirmed by reading the armideal branch: `uint64_t max_pairs = N *
        4ULL;` with no +16 term there -- the +16 only appears inside
        perm128_init's idx_cap formula). idx_cap = next_pow2_u64(max_pairs *
        mult + 16), each of two index arrays costs idx_cap*4 bytes.
        Recomputed idx_cap by hand for log2N in {24,25,26} and mult in
        {1,2}, accounting correctly for next_pow2 rounding (e.g. at
        log2N=25/mult=1: max_pairs=134,217,728=2^27, value=134,217,744,
        next_pow2=2^28, giving idx bytes = 2^28*4*2 = 2.147483648 GB,
        matching the table). All six table cells (log2N x {old,new}) recompute
        to the reported GB figures exactly, using decimal (1e9) GB
        consistently throughout, which matches the report's convention.
      result: pass, all figures independently reproduced
    - name: 2^26 ceiling claim
      method: >-
        dom+rng alone at log2N=26 (max_pairs=2^28) = 32*268,435,456 =
        8,589,934,592 bytes = 8.589934592 GB, independent of the load-factor
        multiplier since dom/rng sizing never references idx_cap. This alone
        exceeds the stated 8 GB budget before any index-table byte is
        counted. Recomputed directly; matches the report. The "2^26
        unreachable under any load-factor tuning" claim is arithmetically
        sound, not merely asserted.
      result: pass
    - name: 2^25 run counts
