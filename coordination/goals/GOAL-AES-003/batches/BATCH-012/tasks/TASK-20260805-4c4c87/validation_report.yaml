        citing EV-AES-e4c091; the per-run 0.03125 is reported alongside raw
        run fields in step6 without being conflated into the step5
        narrative). This is correct practice -- flagging it here because
        two different "expected count" numbers appearing in the same
        artifact is exactly the kind of thing that COULD be conflated
        sloppily, and it was not; the report keeps them apart in its prose.
      result: pass
    - name: calibration of the "0 hits" framing (honest null vs spin in either
        direction)
      method: >-
        Read step5, step6, and step7 of RESULTS.json in full. The report
        states P(0 hits | mean 0.44, Poisson-ish) ~= e^-0.44 ~= 0.64, i.e.
        0-0 is the SINGLE MOST LIKELY outcome even under the full claimed
        BATCH-009 effect being concentrated entirely in the live arm --
        meaning this result is explicitly and correctly denied any
        power to discriminate between "effect present in live arm only",
        "effect absent everywhere", or anything in between. step7 states
        "resolved: false" and gives the reason as insufficient exposure,
        not as either a confirmation or refutation. No language anywhere in
        RESULTS.json asserts that the null result supports BATCH-009's
        finding, nor that it undermines it. The one substantive claim made
        is narrower and true: this run removes the memory-ceiling confound
        that made BATCH-011's 2^24 null ambiguous between "underpowered"
        and "artificially capped" -- and correctly notes that even with
        that confound removed, the result is STILL underpowered, just for a
        now-cleanly-attributed reason. This is calibrated correctly; it is
        neither spun as evidence nor buried.
      result: pass

