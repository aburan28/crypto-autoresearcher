  - id: RT2-B
    name: NON-MAXIMAL NULL -- does S_obs=2 (not 0) with p_extra=0.7468 weaken the death verdict, and is the c=7 treatment correct?
    coordinator_prior_point: (3) weak-signal interpretation pressure (here inverted -- dead-branch weight under a non-maximal reading)
    status: OBJECTION SUSTAINED AS TO EVIDENTIAL WEIGHT PHRASING; FAILS AS TO BRANCH AND CUTOFF
    objection: >-
      Attack route: does a non-zero S change the branch, the frontier, or the
      strength of the death reading? Findings: (i) BRANCH -- the PX-DEAD
      conjuncts (p_extra > 0.15, S_obs <= null mean) hold: p_extra = tail(2) =
      0.7468051273674896 (re-derived exactly), S_obs = 2 <= 2.6719. The branch
      is rule-faithful. (ii) CUTOFF -- c=7 verified as the unique frozen-rule
      value; size 0.0193 is conservative (discreteness); the branch conjuncts
      do NOT involve c, so no alternative cutoff can change the branch. rho_80
      DOES move with cutoff: 0.0969 at c=6 (INADMISSIBLE -- size 0.0541 >
      0.05), 0.1183 at c=7 (frozen), 0.1394 at c=8 (next conservative choice);
      the frozen rule selects c=7 uniquely, and the scientific conclusion
      (exclusion at ~0.12, open below ~0.075) is stable across the admissible
      range. (iii) WEIGHT -- S_obs=2 is a genuinely weaker reading than the
      design's S=0 best case: single-arm BF against rho=0.05 is 3.66 (vs 15.2
      for a hypothetical S=0 at the realized n=53, vs 49.3 at the design's
      n=76); joint-with-G5 BF against rho=0.05 is 9.69 (vs ~40.4 for the
      hypothetical S=0 joint). Against rho=0.096 the joint BF is 150.3, still
      strong. p_deficit = 0.5002 -- the reading is unremarkable in BOTH
      directions, consistent with the pure null. (iv) BRANCH SENSITIVITY --
      tail(3) = 0.4998: ONE more extra zero among 684 non-forced bytes (S=3,
      above the mean) would have fired PX-WEAK, keeping the lane open. The
      PX-DEAD verdict is therefore one zero away from a different branch.
      This is intrinsic to any preregistered threshold rule and the cascade
      was frozen before the arm; it must nonetheless be disclosed so the
      ledger does not read the verdict as robust to the observation. Honest
      phrasing: the exclusion rests on the test's POWER (a property of the
      design at realized N/composition), with the BF table as the strength of
      the actual reading -- not on 'S=0 again'.
    cheapest_falsification_control: >-
      0 runs beyond the RT2-A script: tail(3) and the c=6/7/8 rho_80 sweep are
      computed there. Any future claim that the branch is robust to the
      observation is falsified by tail(3) = 0.4998.
    falsification_route: >-
      The death verdict would weaken to PX-WEAK if S_obs were 3 (it was 2);
      it would strengthen materially if S_obs were 0 (BFs ~4-13x larger). The
      frozen rule's own branch boundary is the control; no post-hoc re-cut is
      admissible.

  - id: RT2-C
    name: ANCHOR UNEXPECTEDNESS -- 4 dead hits vs expected 8-12; does this threaten anchor validity, the instrument, or make PX-DEAD trivially fire?
    coordinator_prior_point: (1) pressure adjacent to hidden perturbation; anchor power
    status: OBJECTION SUSTAINED AS TO ASSURANCE LEVEL; FAILS AS TO VALIDITY AND DIRECTION
    objection: >-
      Attack route: is the low anchor hit count evidence of perturbation, does
      it void the anchor gate, and does the PX-DEAD conjunct fire trivially on
      dead arms? Findings: (i) PLAUSIBILITY -- under Poisson rates implied by
      the committed 2^30 r=6 arms (2-3 hits per 2^30 -> 8-12 at 2^32),
      P(<=4 hits) = 0.0996 (mean 8), 0.0293 (mean 10), 0.0076 (mean 12): a
      mildly surprising but admissible seed draw. The alive arm is ALSO below
      its bracket (53 vs 56-76), so BOTH seed-531003 arms landed low-rate --
      a coherent low-rate seed draw, not an instrument signature; Gate-0
      independently proves the trial stream is identical to the committed
      lineage at 2^30 (14/14 hit indices, all trial-map fields, G3 detail
      records). The producer recorded the observation per rule 8. (ii) VALIDITY
      -- the anchor still reads exactly the expected envelope: S_obs=0,
      p_extra=1 exact, all four zero_mask_e equal the forced PW-word masks
      (6210/16920/8580/0), gate conjuncts (p_extra > 0.05, hits <= 32) hold.
      TENSION WITH FROZEN TEXT: the spec's falsification_conditions list
      'arms with n_hits < 5 (power floor, recorded, never tested)'; the anchor
      at n=4 is literally below that floor. The power-floor clause governs
      effect-testing arms (the anchor gate is defined independently in the
      cascade), so the pass is technically valid -- but the Coordinator must
      record it as 'anchor passed below the design bracket and below the n>=5
      power floor, at reduced assurance', not as a full-power anchor pass.
      (iii) REDUCED CATCH POWER (re-derived): at n=4 the anchor rejects at
      S>=2 (size 0.01778, verified); against systematic per-hit firing q it
      catches with probability 0.118 (q=0.1), 0.264 (0.2), 0.428 (0.3), 0.591
      (0.4), 0.735 (0.5), 0.930 (0.7) -- i.e. only strong firing (q >= ~0.4)
      is caught with better-than-even odds, vs the design quantification at
      ~10 hits. (iv) DIRECTION -- the weakened anchor does NOT threaten
      PX-DEAD: a statistic that systematically fires on the dead arm would add
      ~53*q extra zeros to the alive arm's S, pushing it AWAY from the dead
      region (S=2) toward PX-ALIVE/PX-WEAK. A false PX-DEAD requires zero
      SUPPRESSION or power loss, which the anchor does not police and nothing
      in this batch detected (p_deficit = 0.5002, overdispersion audit found
      variance BELOW null, no deficit or suppression signal). (v)
      PROVES-TOO-MUCH -- the PX-DEAD conjuncts literally hold on the anchor
      arm itself (S=0 <= mean 0.2031, p_extra=1 > 0.15): trivially, BY
      DESIGN, consistent with the prior red team's RT-D finding that the dead
      conjunct holds on every dead object. The cascade evaluates PX-DEAD only
      at the alive arm, so no misuse occurs. The statistic itself does not
      fire on the dead arm at 2^32 (p_extra=1.0) -- the proves-too-much
      control PASSES for the statistic at this exposure. The anchor is
      informative but weak: necessary control, disclosed ceiling, now
      requantified at n=4.
    cheapest_falsification_control: >-
      0 runs (Poisson plausibility + direction argument + n=4 power
      re-derivation, all executed this session). If the Coordinator wants
      design-level anchor assurance: one fresh 2^32 r=6 anchor arm at a
      different seed (~1 analysis-bearing arm, charged ~108 min baseline;
      minutes on measured campaign hardware). Cheaper interim: pool committed
      r=6 hit counts across seeds to estimate the r=6 rate bracket more
      tightly (0 runs).
    falsification_route: >-
      The anchor-pass assurance would be voided if a systematic firing defect
      at q <= 0.3 existed (catch probability <= 43%); such a defect cannot
      produce PX-DEAD (direction argument), so the branch stands, but any
      future claim that 'the anchor polices the instrument at design power at
      2^32' is falsified by the n=4 numbers.

  - id: RT2-D
    name: HIT_LOG_CAP 64->256 -- hidden perturbation route beyond logging? single-constant diff? Gate-0 identity under the cap change meaningful?
    coordinator_prior_point: (1) HIT_LOG_CAP change as hidden perturbation
    status: OBJECTION FAILS; TWO DISCLOSURE FINDINGS (delta precautionary; >64 branch untested)
    objection: >-
      Attack route: hunt for any behavioral path by which the cap constant
      could perturb the trial stream, the hit set, or the statistics, and
      check whether Gate-0 actually exercises the change. Findings: (i) the
      source diff is EXACTLY the single frozen constant, pre-arm and post-arm
      (extended source sha256 4f5944a662... equals the snapshot-bound hash in
      the TASK-20260901-f7762c receipt); cap semantics verified PER THREAD in
      the instrument source (per-job hit_count/hit_overflow at affarm046ex.c
      lines 449-455; receipt aggregation 658-687; hit_log_cap field 913); no
      RNG, trial stream, round function, or pre-existing counter touched; the
      header-comment staleness at line 52 is deliberate and non-functional
      (DEV-3). (ii) Gate-0 extended rebuild passes with no mismatched fields,
      14/14 hit indices identical vs L1, G3 hit_e_detail/ez counters/
      hit_trials identical, no unexpected added fields, allowed diffs exactly
      the frozen six. (iii) FINDING 1 -- THE DELTA WAS BEHAVIORALLY INERT IN
      EVERY RUN OF THIS BATCH: per-thread hit counts are 11/15/13/14 (P4,
      verified from the receipt hit_trials) and <=2 (P3), ALL below the OLD
      cap 64; hit_overflow=0 everywhere; the cap-64 build would have logged
      byte-identical records on these draws. The perturbation concern is
      therefore dead in practice as well as by construction. (iv) FINDING 2 --
      THE DESIGN-TIME NECESSITY ARGUMENT MISREAD THE CAP SEMANTICS: the spec's
      'expected hits at 2^32 (56-76) EXCEED the cap' compares TOTAL hits to a
      PER-THREAD cap; 56-76 total = ~14-19 per thread of 4 < 64, so even the
      design expectation never overflowed the old cap. The delta was
      precautionary, not required. (v) CONSEQUENCE: Gate-0's identity proof is
      fully meaningful for everything that could have differed (trial map,
      counters, detail records); in the changed region identity holds
      trivially because the cap never binds. The one honest residue: the >64
      per-thread logging path remains UNTESTED in this lineage (no run has
      ever exercised it); if a future arm expects >64 hits in one thread, it
      must carry its own overflow/identity control. Support-script deltas
      (freeze_digest.py smoke caps, gate0x_cmp.py allowed-diff) are disclosed,
      comparator-side, and touch no digest or table check.
    cheapest_falsification_control: >-
      0 runs; executed this session: source read of the cap/overflow lines,
      per-thread hit-count tally from the receipts, Gate-0 comparator read.
      The standing control for any future >64-per-thread arm: preregistered
      hit_overflow=0 gate plus a cap-bound identity rerun at a seat with >=65
      hits in one thread.
    falsification_route: >-
      A hidden perturbation would have shown as a Gate-0 field mismatch, a
      hit-index divergence, a nonzero hit_overflow, or a source-diff line
      beyond the constant; all four routes checked and closed. The necessity
      misreading (finding 2) falsifies the spec's JUSTIFICATION for the delta
      but not the delta's safety.

