  IDEA-20260901-f8294e): the ordered cascade fired PX-DEAD at the powered 2^32
  arm -- anchor P3 (r6, seed 531003) hits=4, S_obs=0, p_extra=1 PASS; alive P4
  (J5-2-P32, r5, seed 531003) hits=53, S_obs=2, p_extra=0.7468 > 0.15, S_obs <=
  null mean 2.6719, realized cutoff c=7, rho_80=0.1183 with N=53 below the
  design bracket N>=56. Proposed interpretation: lane closure for the
  X-statistic excess-zero signature at t=1 at the measured exclusion frontier
  rho_80, with rho < rho_50 named-unmeasured; the ramp-shape question survives
  at most as shape-only.

verdict: stands-with-narrowing
verdict_summary: >-
  The branch firing and the exclusion frontier survive independent attack. I
  re-derived every load-bearing quantity in fresh code (independent exact-
  rational DP built only from the frozen statistic definition and receipt data
  fields; no producer analysis source reused), validated first against the
  committed G5 ground truth (mean 17180538557/17179868864, pmf(0) =
  0.3671453866933061, cutoff 4 -- all digit-for-digit), then against P4: null
  mean 275420510837/103079213808 and variance exact-rationally equal, tails
  P(S>=6) = 0.0541457 and P(S>=7) = 0.0193447 (abs diff <= 6e-17), cutoff c=7
  by the frozen smallest-c rule, the full 10-point power grid (max abs diff
  3.3e-16), rho_50 = 0.075140965 and rho_80 = 0.118331842 (abs diff <= 2e-16),
  the S_obs=2 BF table (max abs diff 7e-15), and the joint BF with committed
  G5 including the (1-rho)^19 closed form (max abs diff 6e-14). The N=53 < 56
  shortfall was disclosed per the frozen confounders clause, not repaired
  post-hoc. The PX-DEAD conjuncts fired correctly under a genuinely
  exhaustive, disjoint, ordered cascade (verified from the frozen text; the
  026d6a RT-B overlap cannot recur). BUT five caveats must ride with any
  closure language: (1) the anchor passed at 4 hits -- below both the design
  bracket 8-12 and the frozen n_hits >= 5 power-floor wording -- with
  quantified catch probability only ~26% against systematic firing at
  q=0.2/hit (59% at q=0.4); this does NOT create a false PX-DEAD route (a
  systematically firing statistic would inflate the alive S toward ALIVE,
  never toward DEAD) but it lowers the anchor's standalone assurance; (2) the
  verdict is branch-sensitive: tail(3) = 0.4998, so ONE more extra zero among
  684 non-forced bytes (S=3 > mean 2.6719) would have fired PX-WEAK instead;
  (3) S_obs=2 is a non-maximal null reading -- the realized joint evidence
  against rho=0.05 is BF 9.69 (vs ~40 for the design's hypothetical S=0
  joint), so the ledger must lean on the power-based frontier, not on
  'strong evidence against weak effects'; (4) the HIT_LOG_CAP delta was
  precautionary, not required: per-thread hit counts were 11/15/13/14 (P4)
  and <=2 (P3), all below the OLD cap 64, and the design-time necessity
  argument misread the per-thread semantics (56-76 total hits = ~14-19 per
  thread < 64); the changed branch was never exercised, which kills the
  perturbation concern but leaves the >64 logging path untested in this
  lineage; (5) 'lane closure' is licensed ONLY as the preregistered stop rule
  for the X statistic at t=1 in this probe cell (no further t=1 exposure
  escalation without a NEW proposal) -- it is not carrier death, not ramp
  closure, and the frontier to record is the realized 0.1183, not the design
  worst case 0.109.

joints:
  - id: RT2-A
    name: POWER/CLOSURE SCOPE -- is rho_80=0.1183 at N=53/c=7 an honest exclusion frontier, and what exactly does PX-DEAD falsify?
    coordinator_prior_point: (2) power/exclusion-frontier language if PX-DEAD
    status: OBJECTION FAILS AS TO ARITHMETIC AND HONESTY; SCOPE DISCLOSURES MANDATED
    objection: >-
      Attack route: re-derive the null, cutoff, power curve, rho_80, BF table,
      and joint BF from the definition, and probe whether the frontier or the
      'closure' language overshoots. Executed (fresh code, exact rationals for
      the null, float64 rho-scan; validated against the committed G5 ground
      truth first). Findings: (i) null mean 275420510837/103079213808 and
      variance 452467655512939327597853/170005189108406045773824 are
      exact-rationally reproduced from the per-hit model (41 inactive hits at
      Bin(4,p_diag)*Bin(8,p_off) + 12 active hits at Bin(4,1/256)*Bin(12,p_off),
      p_diag = 67112459/17179868968, p_off = 100664459/25769803452); (ii)
      cutoff c=7 is the unique frozen-rule value (tail(6) = 0.05415 > 0.05,
      tail(7) = 0.01934 <= 0.05; c > null mean verified, degeneracy clause not
      triggered); (iii) all 10 power-grid points reproduce to <= 3.3e-16;
      rho_50 = 0.075140965, rho_80 = 0.118331842 reproduce to <= 2e-16; (iv)
      the N=53 < 56 shortfall was handled exactly as frozen ('realized rho_80
      reported, shortfall disclosed, not repaired post-hoc') -- the realized
      frontier 0.1183 is WEAKER than the design binding claim 0.109 and the
      record says so; (v) alternative effect model (per-byte rate, first-order
      mean-matched): rho_80 = 0.1206 vs 0.1183 -- the disclosed E-rho
      confounder moves the frontier ~1.9% relative, negligible; (vi) the
      frontier's operational meaning is tighter than the generic '80% power'
      phrasing: P(PX-DEAD conjunct fires | rho = rho_80) = 0.0051 (not 0.20),
      because 19.5% of the miss mass lands in PX-WEAK (lane stays open) and
      only 0.5% in the dead region -- so the false-closure rate AT the
      frontier is ~0.5%, falling with rho (0.11% at rho=0.15, 0.003% at
