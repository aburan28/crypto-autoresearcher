      (named-unmeasured; joint BF 9.69 at 0.05, 2.18 at 0.02 -- moderate to
      uninformative) and the intermediate band (0.0751, 0.1183), which is
      excluded only at 50-80% power (P(false PX-DEAD | rho=0.096) = 1.4%).
      JOINT BF WITH G5 (verified): null-vs-rho 2.18/9.69/55.1/150.3/194.5/
      6058/8.4e5 at rho = 0.02/0.05/0.08/0.096/0.1/0.15/0.214 -- the two-seed
      joint supports the exclusion at rho >= ~0.08 but does NOT extend its
