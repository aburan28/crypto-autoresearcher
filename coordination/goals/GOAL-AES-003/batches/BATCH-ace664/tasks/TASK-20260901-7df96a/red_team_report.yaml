proves_too_much:
  control_executed: true
  known_dead_and_null_objects: >-
    The PX-DEAD conjuncts hold on the batch's own dead anchor (n=4, S=0,
    p_extra=1.0, null mean 0.2031) and, by the same logic, on every committed
    dead arm (both 2^30 r=6 arms, G4) and any future arm whose hits fill
    exactly the forced envelope. This is by design and consistent with the
    prior red team's RT-D: the dead branch is reachable at zero information,
    so it can never carry more weight than the power of the arm that fired it
    -- here, 80% power at rho >= 0.1183 under E-rho at the realized
    composition. The statistic itself does not prove too much: it reads
    p_extra = 1.0 on the 2^32 dead arm (no firing toward extra zeros at this
    exposure), the Stage-0 tautology does not recur, and P(reject | null) =
    0.0193 <= 0.05 by construction at N=53.
  anchor_triviality_check: >-
    The PX-DEAD conjunct fires on the dead arm trivially (checked, by design,
    no misuse -- the cascade evaluates PX-DEAD only at the alive arm). The
    anchor PASS is not trivial by construction (would reject at S>=2, size
    0.0178) but at n=4 its catch probability against moderate systematic
    firing is materially below the design quantification (RT2-C) -- disclosed,
    direction-safe for PX-DEAD.

scope_attack:
  what_the_reading_certifies: >-
    At (aes, r5, amask=1, smask=1, 2^32, seed 531003, armid 1, 4 threads; toy
    tier), under the envelope-relative X statistic with the run-internal
    conditional null (all load-bearing quantities independently re-derived),
    53 hits (12 active / 41 inactive) carry S_obs = 2 extra zero bytes beyond
    the forced envelope vs null mean 2.6719 (p_extra = 0.7468, p_deficit =
    0.5002 -- unremarkable in both directions); the fresh matched-exposure r=6
    dead anchor read S=0 / p_extra=1 at 4 hits; all integrity gates pass; the
    preregistered ordered cascade fired PX-DEAD. This certifies: per-hit
    extra-zero effects rho >= 0.1183 (E-rho model) are ABSENT at t=1 within
    this statistic, this probe cell, this exposure, this seed, at 80% power
    (realized N=53, c=7, size 0.0193; P(false PX-DEAD at the frontier) ~0.5%);
    jointly with G5 (seed 531002 at 2^30), the null is favored over rho=0.096
    at BF 150 and over rho=0.15 at BF 6058. The preregistered stop rule's
    antecedent (two null-direction readings at increasing exposure with rising
    power) is met.
  what_it_does_not_certify: >-
    It does NOT certify: (i) absence of effects rho < rho_50 = 0.0751 (joint
