  proposal/preregistration definitions were consumed). Statistics re-derived by
  an independent common-denominator integer-polynomial dynamic program
  (per-hit Poisson-binomial pmfs over classes D0 = 1/256 exact, D1 =
  ezdiag_miss/(4*n_miss), O = ezoff_miss/(12*n_miss); X(h) = (16 - wt_e_byte) -
