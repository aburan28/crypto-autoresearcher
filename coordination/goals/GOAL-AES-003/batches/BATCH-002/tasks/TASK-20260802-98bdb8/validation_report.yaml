    - id: MR-9
      target: two immaterial numerical discrepancies found in rank 3
      detail: >-
        (a) The 99% two-sided Poisson interval for lam=16 is reported [6,27];
        I obtain [7,27] under the convention P(X<=k) >= 0.005. The observed 12 is
        inside either. (b) The analytic per-trial rate is reported
        9.313225742902179e-10 against the closed form 1-(1-2^-32)^4 =
        9.313225746154785e-10, a 3.5e-10 relative difference consistent with
