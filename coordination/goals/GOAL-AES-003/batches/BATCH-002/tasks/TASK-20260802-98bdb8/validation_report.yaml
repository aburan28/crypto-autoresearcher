  independence_declaration:
    reused_producer_code: none
    detail: >-
      Three programs were written from scratch in this session and are the sole
      source of every number this report calls its own:
        vcount.c  -- software T-table AES-shaped SPN with a CONFIGURABLE GF(2^8)
                     mixing matrix, threads partitioning the INPUT space and
                     relaxed-atomic counter increments (the producer's cnt.c
                     partitions the VALUE space and rescans the coset per thread;
                     no code was shared with it, and cnt.c was not executed).
        vsq.c     -- 6-round hinted integral attack with a configurable hint
                     source, AES-NI. sq_null.c was NOT reused, copied or run.
        vyoyo.c   -- yoyo probe, AES-NI encrypt/decrypt, splitmix64 trial RNG.
        gf.py     -- GF(2^8) Gauss-Jordan, determinant, inverse and MDS test.
      Every S-box is DERIVED at run time from the GF(2^8) inverse plus the
      FIPS-197 affine map, never copied. All three binaries pin to the FIPS-197
      C.1 known-answer vector 69c4e0d86a7b0430d8cdb78070b4c55a; vyoyo also
      passes 5120/5120 encrypt/decrypt round-trip checks over r=1..10.
      Producer sources (cnt.c, ref.py, sq.c, sq_null.c, probe.c) and the frozen
      preregistrations were READ to identify the object under test. That reading
      is the specification; it is not reuse.
    keys_used: >-
      Keys and bases generated in this session with secrets.token_hex(16),
      present in no prior artifact: 365794bfa6be3b16f6323bddc2dfe812,
      82af8bbe5524dc3a8b3d1369fdfa7e49, 238a6d29a07ae780fa866be0bb4c2cf2,
      091a53dd3cbecc56fd2fa47d928be2ed. Producer keys and bases were reused ONLY
      where the intent was bit-exact cross-implementation reproduction, and every
