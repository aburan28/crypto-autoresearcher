  metric_recomputations:
    - id: MR-1
      target: rank 4, M0 non-singularity, INDEPENDENT OF matrices.json
      method: my own gf.py Gauss-Jordan over GF(2^8) with modulus x^8+x^4+x^3+x+1
      result: >-
        AES_MC rank 4, det 0x01, inverse [[14,11,13,9],[9,14,11,13],[13,9,14,11],
        [11,13,9,14]] (the FIPS-197 InvMixColumns matrix, an external check on my
        own routine), M*M^-1 = I. M0 rank 4, det 0x1d, zero entry exactly at
        (0,0), M*M^-1 = I. M1 rank 4, det 0x14, zeros at (0,0),(1,3),(2,2),(3,1),
        M*M^-1 = I. Exhaustive minor test: AES_MC is MDS, M0 and M1 are not.
      verdict: CONFIRMED. M0 IS non-singular. The rank-4 finding does not collapse.
    - id: MR-2
      target: rank 4, R4-P1, the exact large non-zero prediction
      preregistered: "n = 547608330240, occupancy histogram {0: 4278190080, 256: 16777216}, max_occ = 256 (PREREGISTRATION.md 3.3)"
      producer_measured: identical
      validator_measured: >-
        VR-3: n = 547608330240 exactly, n_alt agrees, N = 2^32, occupancy
        histogram {0: 4278190080, 256: 16777216}, max_occ 256, overflow bucket 0,
        counter width 16 bits as the preregistration required.
      arithmetic_check: 2^24 * C(256,2) = 16777216 * 32640 = 547608330240; 16777216*256 = 2^32; 4278190080 + 16777216 = 2^32.
      verdict: CONFIRMED, exactly, by an independent engine on an independent code path.
    - id: MR-3
      target: rank 4, the j0-dependence of the r=4 result
      preregistered: R4-P1 destroyed at j0=0 (critical), R4-P2 survives at j0=1 (non-critical), same matrix, same key, same base
      validator_measured: >-
        VR-3 j0=0: n = 547608330240, max_occ 256. VR-4 j0=1: n = 0, max_occ 1,
        occupancy histogram {1: 4294967296}, i.e. a perfect bijection. One
        parameter changed; a 5.5e11 count and an exact zero on the two sides.
      analytic_check: >-
        Worked independently from the derivation's own algebra: n_4 = 0 iff the
        four entries M[(-c-j0) mod 4][c] are all non-zero, so a single zero at
        (r0,c0) is critical for exactly one j0 = (-c0-r0) mod 4; for M0 that is
        j0 = 0. Confirmed.
      verdict: >-
        CONFIRMED. This paired two-sided behaviour is the strongest single item
        in the batch. It is far harder to produce by accident than either arm
        alone, and it closes the open INSTRUMENT RISK in EV-AES-005 that every
        surviving control predicted zero, so a systematic undercount would have
        passed them all.
    - id: MR-4
      target: rank 4, R4-P3, r=5 mod-8 survival under a zero-entry mixing layer
      producer_measured: M0_r5_j0 n = 2147411968 (mod8 0, mod16 0); M0_r5_j1 n = 2147031240 (mod8 0, mod16 8)
      validator_measured: >-
        VR-1 reproduces M0_r5_j0 BIT-EXACTLY on an independent implementation:
        n = 2147411968 and every one of the 13 occupancy-histogram cells is
        identical. M0_r5_j1 was NOT re-executed (budget); its reported histogram
        is internally consistent (sum m = 2^32, buckets = 2^32, and n recomputes
        from the histogram to exactly 2147031240, mod 8 = 0, mod 16 = 8).
        VR-2 adds the missing INDEPENDENT-KEY arm: n = 2147227472, mod 8 = 0.
      verdict: CONFIRMED, and strengthened by an arm the producer could not run.
    - id: MR-5
      target: rank 2, null residue distribution statistics
      result: >-
        Pooled residue histogram {0:3,1:1,2:2,3:0,4:3,5:0,6:1,7:3} over 13 arms
        recomputes chi-square = 7.3076923076923075 on 7 dof, p = 0.39756131176467
        against the record's 0.3975613117646689 (agreement to 1e-15). The
        record's own stance -- underpowered, uniformity NOT claimed, arms not
        exchangeable -- is preregistered (R2-P2/R2-P3) and correct.
      verdict: CONFIRMED
    - id: MR-6
      target: rank 1, pooled survivor histograms
      method: recomputed all three pooled distributions from the 88 per-diagonal rows in RESULTS.json
      result: >-
        TRUE {1: 16}, ALL-WRONG {0: 44}, PARTIAL {0: 28} -- identical to the
        reported pooled blocks, with 16/16 true-hint diagonals unique AND equal
        to the true byte, and 0/72 wrong-or-partial diagonals containing the true
        byte or the wrong key's byte anywhere. Trials per (nwrong, rounds) cell:
        (0,6)=2 (0,7)=2 (3,6)=8 (3,7)=3 (1,6)=2 (1,7)=2 (2,6)=2 (2,7)=1.
      verdict: CONFIRMED
    - id: MR-7
      target: rank 3, every reported statistic
      result: >-
        Independently recomputed and agreeing to floating-point precision:
        analytic expectations (8.0 / 4.0 / 16.0); excess factors (A1 15.625,
        A1b 15.0, A2 1.5, A2b 0.875, A3 0.625, A3b 0.875, A4 1.0); Poisson tails
