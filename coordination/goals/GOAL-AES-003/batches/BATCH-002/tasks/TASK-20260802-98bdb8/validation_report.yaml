      - claim: "F2: with all three hint bytes per diagonal from an independent wrong key, the filter admits NO survivor. 44 diagonals, histogram {0: 44}."
        verdict: CONFIRMED
        basis: >-
          VR-6, an independent implementation with my own wrong key and my own
          seed, gives {0,0,0,0}: zero survivors on all four diagonals, the true
          byte nowhere and the wrong key's own byte nowhere. This is the batch's
          decisive measurement and it is discharged here by re-execution, not by
          corroboration.
      - claim: "F3: a single wrong hint byte (1 of 3) is enough to empty the candidate set."
        verdict: CONFIRMED
        basis: >-
          VR-7, one wrong hint byte per diagonal from a second independent key:
          {0,0,0,0}. This is the harder of the two partial cells and it is the
          one the conclusion rests on. The 2-of-3 cell was not re-executed here.
      - claim: "F4: hypothesis (B), the structural-singleton explanation, is REFUTED; a false hint yields no survivor rather than a different unique survivor."
        verdict: CONFIRMED
        note: >-
          (B) asserts uniqueness for reasons independent of the hint's truth. A
          false hint yielding ZERO survivors contradicts it directly. The
          statement is scoped to one target key in the record, which is correct.
      - claim: "prediction P3, ~64 * 2^-24 expected diagonals with cnt >= 1 under a false hint, i.e. indistinguishable from zero."
        verdict: CONFIRMED (0 observed of 44; 0 of 28 partial; 0 of 12 in my own arms)
      - claim: "the thinnest cell, 2-of-3-wrong at r=7, has one trial."
        verdict: >-
          CONFIRMED as a fact, and NO CONCLUSION RESTS ON IT. Verified by
          recomputation: deleting PART7-2of3-A leaves 24 partial diagonals all
          reading 0, the 1-of-3 cell intact at 4 trials / 16 diagonals, and F3
          and F4 unchanged in both statement and support.
      - claim: "the r=6 key recovery works and is DOMINATED: 69.39 s against ~25 s exhaustive search over the same hinted residual, sota_delta NEGATIVE."
        verdict: >-
          NOT CHECKED. Carried forward from BATCH-001 by the producer's own
          explicit declaration and not re-measured by the producer or by me. My
          own TRUE6 ran in 103.61 s on this machine, but under a different
          protocol with a differently structured binary, and I offer it as NO
          cost measurement. The dominated_by / sota_delta honesty is preserved
          unchanged in the record, which is the right handling.
      - claim: "the r=7 run is NOT a key recovery and carries no certificate; K7 is supplied as input."
        verdict: CONFIRMED by reading sq.c mode_attack7 and the record's own statement.
      - claim: "r=7 arms (TRUE7, WRONG7, PART7)."
        verdict: >-
          NOT CHECKED by re-execution. Reason: budget. I implemented and ran the
          r=6 object only. The r=7 arms recompute correctly from their own
          per-diagonal rows and are consistent with the r=6 behaviour, but no
          independent implementation of the r=7 construction exists in this
          session.

    rank_2_null_residue_distribution:
      - claim: "the distribution characterisation adds NOTHING OF CONSEQUENCE beyond BATCH-001's deterministic refutation of forcing."
        verdict: CONFIRMED, and pre-registered (R2-P3) before measurement precisely so it could not be an after-the-fact deflation. That is good practice and is recorded as such.
      - claim: "chi-square 7.3077 on 7 dof, p = 0.3976; uniformity NOT claimed; the test is underpowered."
        verdict: CONFIRMED (MR-5).
      - claim: "the rank 2 gate is NOT MET: 1 of >= 3 required new null arms completed; N2-N5 dropped and named."
        verdict: CONFIRMED and correctly self-reported as unmet.

    rank_4_zero_entry_mixing_layer:
      - claim: "M0 is a non-singular column-preserving mixing layer with a zero entry; it is an MDS-SUBSTITUTE and not MDS."
        verdict: CONFIRMED independently of matrices.json (MR-1). The MDS-substitute labelling is correct and the mutual exclusivity argument is right.
      - claim: "R4-P1: at the critical j0 the r=4 bijection is DESTROYED, n = 547608330240, occupancy {0: 4278190080, 256: 16777216}."
        verdict: CONFIRMED EXACTLY (MR-2).
      - claim: "R4-P2: at a non-critical j0 the r=4 bijection SURVIVES, n = 0, max_occ 1."
        verdict: CONFIRMED EXACTLY (MR-3).
      - claim: "R4-P3: the r=5 mod-8 property SURVIVES the zero entry."
        verdict: CONFIRMED, and STRENGTHENED. Two producer arms plus my bit-exact reproduction of one of them plus VR-2, a third arm on an independent key, base and j0, all reading 0 mod 8.
      - claim: "evidential strength: 2 arms, 8^-2 = 1/64 under the destroyed-property alternative."
        verdict: >-
          OVERSTATED AS ARITHMETIC (severity LOW, and self-corrected two fields
          later). The two completed producer r=5 arms share the SAME matrix, key,
          base and round count, so they are two PROJECTIONS OF THE SAME 2^32
          CIPHERTEXTS and differ only in j0. Their residues are not established
          to be independent, so 8^-2 does not follow. The record's own
          `independence_caveat` field says exactly this, so the defect is an
          internal inconsistency of emphasis rather than a concealment. It is now
          moot: VR-2 supplies a genuinely independent third reading, and the
          producer arm at j0=0 combined with VR-2 gives an honest 1/64 across two
          independent keys.
        artifact_and_field: TASK-20260802-142a4b/RESULTS.json, rank4_zero_entry_mixing_layer.finding.evidential_strength_stated_plainly
      - claim: "D-DERIV-1: the derivation is WRONG on a point it explicitly asserted; the no-zero-entry hypothesis is measured FALSE at r=5, and this is NOT SOFTENED into a refinement."
        verdict: >-
          SPLIT. The MEASURED CONTENT is CONFIRMED: a mixing layer with a zero
          entry preserves n_5 = 0 mod 8, so the no-zero-entry condition is
          SUFFICIENT BUT NOT NECESSARY for the r=5 conclusion. The LABEL "the
          derivation is WRONG" DOES NOT FOLLOW on this evidence.
        reasoning: >-
          I read BATCH-001 count5/PREREGISTRATION.md section 3.5 line by line.
          Fact 2 reads "MC has no zero entry, and v_col[t] != 0, so g_col = 0
          with a != a' is impossible", and it is used for one purpose only: to
          declare the k = 1 class empty. As a statement about AES's actual MC it
          is TRUE, and the derivation nowhere asserts that the condition is
          necessary. What the measurement establishes is that the step was not
          needed: I verified the producer's own analytic argument independently
          -- with k = 1 the three inactive columns carry a free shared value, so
          that class contributes 256^3 * N_ord^(1)/2, a multiple of 2^24 and
          hence of 8, whether or not fact 2 empties it; k = 2,3 carry 256^{4-k};
          and k = 4 rests on fact 1, which uses no property of M. So the mod-8
          conclusion survives deleting fact 2 entirely. That makes the derivation
          NON-MINIMAL on this step, not wrong. The producer applies precisely the
          right words at r=4 -- "CORRECT BUT OVERSTATED" -- and then escalates to
          "WRONG" at r=5 while explicitly refusing the softer reading in a
          `not_softened` field. On this evidence the r=4 wording is the accurate
          one at r=5 too.
        where_the_defect_really_is: >-
          EV-AES-005 boundaries, which restate the condition as a SCOPE claim:
          "any column-preserving mixing layer with no zero in the relevant
          entries". That IS an assertion about which layers the result covers,
          and it is measurably too narrow at r=5. The supersession request is
          well founded when aimed there.
        artifact_and_field: TASK-20260802-142a4b/RESULTS.json, rank4_zero_entry_mixing_layer.finding.defect.what_is_wrong and .not_softened
      - claim: "the supersession target: EV-AES-005's boundary clause, as applied to the r=5 mod-8 property."
        verdict: >-
          JUSTIFIED, BUT ONLY IF SPLIT BY ROUND COUNT. The same boundary clause
          scopes BOTH the r=4 bijection and the r=5 mod-8 forcing. At r=5 the
          condition is unnecessary and the clause understates the scope. At r=4
          the condition IS load-bearing -- measured, twice, by the producer and
          again by me -- but it is also imprecise there: only 4 of the 16 entries
          matter and which 4 depends on j0. A blanket supersession that struck
          the condition from the whole clause would introduce a NEW error, in the
          opposite direction, at r=4.
        recommended_wording_for_whoever_mints_the_CORR: >-
          r=5: a non-singular column-preserving mixing layer suffices; no
          condition on zero entries. r=4: the bijection holds iff the four
          entries M[(-c-j0) mod 4][c], c = 0..3, are all non-zero, so a zero
          entry at (r0,c0) destroys it at exactly one projection index
          j0 = (-c0-r0) mod 4 and is harmless at the other three.
      - claim: "the r=5 CONCLUSION itself is untouched by the hypothesis being unnecessary."
        verdict: >-
          CONFIRMED, unreservedly. All the r=5 AES readings in this campaign used
          AES_MC, which satisfies the condition; widening a sufficient hypothesis
          never weakens a conclusion proved under the narrower one. The direction
          of the finding is that the result covers MORE objects than was claimed,
          which is an UNDERSTATEMENT defect in EV-AES-005 and not a retraction of
          anything.
      - claim: "M0_r4_j0_CRIT doubles as the large-non-zero exact instrument control BATCH-001 never had."
        verdict: >-
          CONFIRMED, and UNDERSTATED. This closes the open INSTRUMENT RISK item in
          EV-AES-005 -- that every surviving producer control predicted ZERO, so a
          fault that systematically undercounts would have passed them all -- and
          the record files it in a sub-field of a finding rather than stating it
          as a result of the batch. Independently reproduced here at VR-3 with a
          different partitioning strategy: the same exact 12-digit count and the
          same two-cell occupancy histogram.
      - claim: "the M0_r5_j2_ALTKEY arm's prediction."
        verdict: >-
          NAMED AS A POST-PREREGISTRATION ADDITION. This arm is not in the frozen
          run order of PREREGISTRATION.md section 5; it appears only in
          RESULTS.json, with a prediction attached, and its status is
          not_run_or_terminated_on_budget. It is therefore a prediction added
          after the preregistration was frozen -- though NOT after its own
          measurement, since it has none. The direction is conservative: it adds
          an unrun arm and a caveat that weakens the record's own claim. It is now
          DISCHARGED by VR-2, which ran it, on my key and base, at j0 = 2, and it
          read 0 mod 8 as predicted.
      - claim: "segment 1 produced ZERO measured numbers; that is resource_exhaustion and not evidence in either direction."
        verdict: >-
          CONFIRMED, and this is the single best-handled item in the batch. The
          producer refused to promote its own correct analytic argument into a
          measurement to fill the gap, and PROTOCOL-DEVIATIONS.md D-6 states the
          full cost of the Coordinator's scheduling error against the
          Coordinator. Both are correct under AGENTS.md rule 3.
      - claim: "M1 arms, CTRL_AESMC engine controls, N2-N5."
        verdict: NOT RUN by the producer, correctly named as dropped; NOT RUN by me either (budget). Nothing is asserted about many-zero mixing layers.

    rank_3_yoyo:
      - claim: "r=5 excess factor 15.625x (A1) and 15.0x (A1b), inside the preregistered band [8, 25]."
        verdict: >-
          CONFIRMED and independently REPLICATED. VR-8, my own fourth
          implementation, my own key, N = 2^32: 58 hits against an analytic 4.0,
          excess 14.5x, inside the same band. Exact conditional test against my
          own PRP null gives p = 1.3e-13; the Poisson tail against the analytic
          null gives log10 p = -45.2.
      - claim: "the measured PRP null AGREES with the analytic null: 12 hits against 16.0 expected, ratio 0.75, inside the 99% Poisson interval."
        verdict: >-
          CONFIRMED, and independently corroborated. VR-9, a fresh 10-round AES
          PRP surrogate under my own key at N = 2^32: 4 hits against 4.0
          expected, excess factor 1.000000, one trivial swap detected and
          excluded at exactly the predicted ~2^-32 rate. On my own data the
          analytic 2^-30 table is not contradicted either. V5 does not fire.
      - claim: "the excess decays with r: 15.6x at r=5, 1.5x / 0.875x at r=6, 0.625x / 0.875x at r=10; the structure-destroyed control reads 1.0x."
        verdict: CONFIRMED. The quantity does what the report says it should as the parameter meant to destroy it increases, and the report states that expectation in advance. V4 does not fire.
      - claim: "death round measured by this campaign = 6, with a one-sided 95% upper bound of 1.64x on any r=6 excess."
        verdict: >-
          CONFIRMED as recomputed, and correctly bounded: the record says "no
          excess detectable at these trial counts with this statistic", never
          "no excess exists", and makes no comparison to any published death
          round. That is the correct scoping.
      - claim: "the floating-point defect that produced a negative false-negative rate was corrected to log space before any number was reported."
        verdict: CONFIRMED. Every corrected number reproduces exactly (MR-8), including the log10 = -18.656704647985364 to the last digit.
      - claim: "A3b and A2b were added AFTER the five preregistered arms had completed and after A1 had been read."
        verdict: >-
          DISCLOSED, AND IT DOES NOT CHANGE ANYTHING. Assessed on the individually
          reported readings, as the card asks. Both additions are on the
          null/control side, and both move the result AWAY from the signal:
          A3b (7 hits against 8) RAISES the pooled measured null rate above the
          A3-only rate, so A1's excess against the pooled null is SMALLER than
          against A3 alone; A2b (7 against 8, excess 0.875x) LOWERS the r=6
          excess estimate below A2's 1.5x. A post-hoc addition that makes your own
          result look weaker is conservative, not a forking path in the
          direction that matters. Both individual readings are reported so a
          reviewer can recompute with A3/A2 alone, and I did: A1 against A3 alone
          gives p = 2.1891e-31 against the pooled 1.0299e-45. The r=5 verdict is
          the same under either. The disclosure itself is the correct handling
          and sets the standard the other two producers did not meet.
      - claim: "the PR-2 point prediction of 16x with band [8,25] was set from BATCH-001's prior readings."
        verdict: >-
          LEGITIMATE AND DISCLOSED. The preregistration states the prior readings
          (16.75x, 15.75x, 12.5x) and says the band is set to cover their spread.
          A replication prediction calibrated on the data being replicated is
          proper, and it is frozen before measurement.
      - claim: "the reproduction pointer was exercised: arm A1b re-ran from its recorded command and was BYTE-IDENTICAL."
        verdict: >-
          CONFIRMED as recorded, and this is the only producer in the batch that
          actually re-executed a declared run rather than asserting determinism.
          Rank 4's own completion gate states plainly that its reproduction "has
          NOT been demonstrated by a second execution" -- correct disclosure, and
          it is now demonstrated from outside by VR-1's bit-exact reproduction of
          M0_r5_j0.

