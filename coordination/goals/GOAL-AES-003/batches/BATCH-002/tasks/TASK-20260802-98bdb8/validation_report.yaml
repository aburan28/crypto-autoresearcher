      verdict: NOT A DEFECT. Recorded so a later reader does not rediscover them as one.

  control_checks:
    - id: CC-1
      question: is a null object of the same shape used, and does the quantity decay when it should?
      rank_3: >-
        YES on both. The PRP null (A3/A3b, full 10-round AES and its exact
        inverse, pipeline byte-identical) is a null of exactly the same shape,
        and it is simultaneously the decay check: the excess reads 15.6x at r=5,
        1.5x and 0.875x at r=6, and 0.625x/0.875x at r=10. The quantity DOES
        decay as the parameter meant to destroy it increases. The
        structure-destroyed control A4 (all four plaintext words active) reads
        1.0x, so the excess is produced by the diagonal coset structure and not
        by the measurement pipeline. V4, the canonical artifact tell, does not
        fire. My own re-execution reproduces both sides: VR-8 r=5 excess 14.5x
        (58 against 4.0, exact conditional p vs my own null 1.3e-13) and VR-9
        r=10 excess 1.000000 (4 against 4.0). The record states plainly what the
        quantity should do and it does it.
      rank_1: >-
        YES. The wrong-hint arm IS the null object: the same filter, the same
        oracle, the same true target key, with only the truth of the hint
        varied. That is the correct null for hypothesis (B).
      rank_2_and_4: >-
        PARTIAL. The r=4 arms are exhaustive and need no statistical null. The
        r=5 arms carry a null only through BATCH-001's earlier refutation plus
        the single new N1 arm; rank 2's own gate (>= 3 further null arms) is NOT
        MET, and the record says so.
      verdict: CONFIRMED for ranks 1 and 3; PARTIAL and correctly disclosed for rank 2.
    - id: CC-2
      question: does the N1 null arm reading n mod 8 = 0 undercut anything?
      finding: >-
        N1 (10-round AES PRP surrogate, r=5-shaped statistic) read n mod 8 = 0.
        That is a live instance of the 1-in-8 coincidence and the producer
        reported it prominently rather than burying it. My ruling:
        (a) It does NOT undercut BATCH-001's deterministic refutation that the
            residue is forced, which rests on NON-zero null readings; one further
            zero reading cannot un-refute a probability-1 statement.
        (b) It does NOT undercut the r=4 results, which are exhaustive and
            predict an exact large non-zero and an exact zero, neither of which
            has a 1-in-8 null.
        (c) It DOES bear directly on the r=5 M0 arms, and it is the empirical
            demonstration of why. It is the reason the two producer r=5 arms are
            weak on their own and the reason VR-2 was worth running.
      verdict: >-
        Correctly reported, correctly weighted, and it is an argument FOR the
        record's honesty rather than a defect. Reporting a null arm that landed
        on the signal value is exactly the disclosure the protocol asks for.
    - id: CC-3
      question: instrument controls
      result: >-
        Rank 4's engine controls CTRL_AESMC_r4_j0 and CTRL_AESMC_r5_j0 were NOT
        RUN (budget), and the record names them as dropped. The gap they leave --
        that a difference under M0 might be attributable to the engine rather
        than the matrix -- is closed from the other side by this session: my
        vcount pins to FIPS-197 C.1 with M = AES_MC, and it reproduces the
        producer's M0 r=5 j0 count BIT-EXACTLY while itself being a different
        partitioning strategy on a different code path. I did not re-run the
        AES_MC engine controls either and name that as dropped work below.
      verdict: >-
        The missing controls are correctly declared. Cross-implementation
        agreement substitutes partially, not fully.

  claim_verdicts:
    rank_1_wrong_hint_null:
      - claim: "F1: with TRUE hint bytes, both constructions give exactly one survivor per diagonal and it is the correct byte (16/16 diagonals, 4 runs)."
        verdict: CONFIRMED
        basis: >-
          Recomputed from the per-diagonal rows, and independently re-executed:
