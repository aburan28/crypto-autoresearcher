  understatement_audit:
    note: >-
      Run because CORR-20260802-007 was an understatement defect and it mattered
      as much as an overstatement would have.
    findings:
      - id: US-1
        severity: MEDIUM
        item: >-
          EV-AES-005's boundary clause is measurably TOO NARROW at r=5. The r=5
          mod-8 property holds for a strictly larger class of mixing layers than
          the evidence record claims -- non-singular column-preserving, with no
          condition on zero entries. The batch's own analytic argument shows the
          derivation never needed the condition. This understates the reach of
          the result.
        direction: understates the evidence
      - id: US-2
        severity: LOW
        item: >-
          Rank 4 buries the closure of EV-AES-005's open INSTRUMENT RISK item in
          a sub-field (`r4_doubles_as_instrument_control`). The exact large
          non-zero prediction, matched to 12 significant figures with a
          two-cell occupancy histogram, is the strongest instrument evidence this
          campaign has produced and reads as an aside.
        direction: understates the evidence
      - id: US-3
        severity: LOW
        item: >-
          Rank 1's F4 is stated at 11 all-wrong trials, 7 partial trials and 4
          true-hint trials with 72 wrong-or-partial diagonals ALL reading exactly
          0 and 16 true-hint diagonals ALL reading exactly 1 with the correct
          byte. There is no borderline case anywhere in the design. The record's
          "limits_of_this_statement" is appropriately cautious, but the
          separation measured is total, and the record does not say so plainly.
        direction: understates the evidence
      - id: US-4
        severity: LOW
        item: >-
          Rank 3's r=5 replication is now a FOUR-implementation result (BATCH-001,
          the BATCH-001 validator, rank 3, and this session), and its excess
          factor has landed in [14.5, 16.75] across all of them on independent
          keys. The record correctly declines to claim more than replication.
        direction: neutral to slightly understating

  defects:
    - id: DEF-1
      severity: LOW
      artifact: TASK-20260802-142a4b/RESULTS.json
      field: rank4_zero_entry_mixing_layer.finding.evidential_strength_stated_plainly
      defect: >-
        Quotes 8^-2 = 1/64 for two r=5 arms that are two projections of the same
        2^32 ciphertexts (same matrix, key, base, rounds; only j0 differs), so
        the independence the figure assumes is not established. The record's own
        `independence_caveat` field states the problem correctly; the two fields
        disagree.
      status: MOOT. VR-2 supplies an independent-key arm; on producer j0=0 plus VR-2 the 1/64 figure is honest.
    - id: DEF-2
      severity: MEDIUM
      artifact: TASK-20260802-142a4b/RESULTS.json
      field: rank4_zero_entry_mixing_layer.finding.defect.what_is_wrong and .not_softened
      defect: >-
        Labels the BATCH-001 derivation "WRONG on a point it explicitly asserted"
        and refuses in advance any softer reading. On the evidence the correct
        statement is that fact 2 is a true statement about AES's MC which the
        derivation did not need -- sufficient, not necessary. The defect that IS
        measured lives in EV-AES-005's boundary clause, which does make a scope
        claim. Directionally this is an overstatement AGAINST the batch's own
        prior work, which is an unusual and comparatively benign direction, but
        it would enter the ledger as a finding about a derivation that is not
        defective on this point.
      recommended_disposition: >-
        Mint the CORR against EV-AES-005's boundary clause, split by round count
        (see the recommended wording above), and record the derivation's fact 2
        as non-minimal rather than wrong.
    - id: DEF-3
      severity: LOW
      artifact: TASK-20260802-9dcca8/RESULTS.json
      field: (absent) protocol_deviations
      defect: >-
        The 2-of-3-wrong cell is outside the frozen preregistration's arm table
        and is not declared as a protocol deviation anywhere in the record.
        Rank 3 declared its two added arms; rank 1 did not declare this one.
      impact: none on any conclusion (verified by recomputation)
    - id: DEF-4
      severity: LOW/MEDIUM
      artifact: batch-wide
      defect: >-
        No approved experiment contract (experiments/<EXP-ID>/specification.yaml
        with status approved and non-null approved_by) governs any of this work;
        the authorising record is a dispatch card. Rank 4 declares this; ranks 1
        and 3 do not.
      impact: >-
        The measurements are preregistered and self-contained, so the evidential
        impact is small. The lifecycle impact is not, and it is the same class of
        defect as CORR-20260802-009.
    - id: DEF-5
      severity: NONE (recorded, not charged)
      artifact: PROTOCOL-DEVIATIONS.md D-1, D-6
      note: >-
        The Coordinator's over-subscription destroyed rank 2+4's first segment
        entirely and truncated five of rank 1's trials. Both are recorded as
        resource_exhaustion and excluded from every distribution, which is
        correct under AGENTS.md rule 3, and the Coordinator recorded two
        deviations against itself. This is compliant handling of an infrastructure
        failure, not a defect in the evidence.

  heuristic_validation_checks:
    applicable: false
    basis: >-
      No experiment in this batch is a heuristic-validation experiment in the
      sense of docs/target-result-profile.md. There is no theoretical
      distribution (no rho(u)-analogue) pre-registered against sampled data, no
      substitute-sampling correspondence, and no numbered heuristic is declared
      validated or refuted by any producer. The closest object is rank 3's
      analytic PRP null 1-(1-2^-32)^4, which IS pre-registered before sampling
      (PREREGISTRATION.md section 3), IS checked against an empirically measured
      null of the same shape (arms A3/A3b, and my VR-9), and recomputes exactly
      from the raw counts. Sample sizes, seeds, keys and the sampling procedure
      are in the manifests and every arm reports its own N and resolution in
      bits. Those checks are recorded under control_checks and
      metric_recomputations rather than here.

  cost_model_checks:
    - id: CMC-1
      finding: >-
        NO CONCRETE COST TABLE IS OFFERED BY ANY PRODUCER IN THIS BATCH, and each
        says so explicitly. Rank 1 states its segment-1 wall times were taken
        under contention and its segment-2 times were not taken under BATCH-001's
        protocol, so neither is offered as a cost. Rank 4 states the same and
        PROTOCOL-DEVIATIONS.md D-2 endorses it. Rank 3 states that no wall-clock
        timing enters any reported statistic.
      verdict: CORRECT. A timing taken on a contended machine is not a cost measurement and none is presented as one.
    - id: CMC-2
      finding: >-
        The only cost claim in scope is the CARRIED-FORWARD r=6 result: 69.39 s
        against roughly 25 s for exhaustive search over the same hinted residual,
        dominated_by exhaustive search over the hinted residual, sota_delta
        NEGATIVE. It is carried forward unchanged and unhedged, labelled as a
        BATCH-001 measurement, and is not re-measured by anyone.
      verdict: >-
        NOT CHECKED here, and correctly labelled by the producer. The Pareto
        honesty requirement is met: the construction that loses to the trivial
        alternative is recorded as losing.
    - id: CMC-3
      finding: >-
        Memory is reported alongside time where it is load-bearing (rank 4 records
        peak concurrent counter allocation 8 GiB with measured RSS, and its V6
        void condition caps a single allocation at 4 GiB). Rank 3 records memory
        as NOT MEASURED rather than estimating it. My own r=4 critical arm needed
        an 8 GiB uint16 counter array and I record that here.
      verdict: CONFIRMED
    - id: CMC-4
      finding: no per-attempt cost times inverse success probability is claimed anywhere, because no probabilistic attack cost is claimed.
      verdict: NOT APPLICABLE

  scaled_down_ladder_checks:
    applicable_note: >-
      docs/inventor-protocol.md section 6 governs a claimed improvement that
      cannot be executed at the scale where it would matter. THIS BATCH CLAIMS NO
      SPEEDUP AND NO IMPROVEMENT. Rank 1 explicitly records its only cost-bearing
      construction as DOMINATED with a NEGATIVE sota_delta; ranks 2, 3 and 4
      claim only structural measurements at toy scale. Step 2 of the ladder (a
      measured ratio against a baseline on a scaled-down instance) is therefore
      not owed, and its absence is NOT a failure here.
    what_was_checked_instead:
