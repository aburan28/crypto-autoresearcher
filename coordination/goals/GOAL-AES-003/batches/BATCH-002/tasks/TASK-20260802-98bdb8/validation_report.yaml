      verdict: CONFIRMED
    - id: MR-8
      target: rank 3, the corrected log-space false-negative rate
      the_disclosed_defect: >-
        An earlier draft obtained the false-negative rate as 1 - upper_tail and
        got -4.26e-14, a floating-point artifact. Corrected to log space before
        any number was reported.
      recomputed: >-
        FPR under the analytic null P(X>=40 | lam=8) = 6.7807214e-16 (reported
        6.780721282963691e-16); FPR under the measured null P(X>=40 | lam=6) =
        4.753956472754605e-20 (reported ...598e-20); FNR = P(X<40 | lam=125) =
        2.2044251237254567e-19, log10 = -18.656704647985364 -- identical to the
