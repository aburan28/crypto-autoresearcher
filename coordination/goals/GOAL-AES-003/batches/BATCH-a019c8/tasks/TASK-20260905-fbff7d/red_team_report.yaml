  # ------------------------------------------------------------------
  # VERDICT
  # ------------------------------------------------------------------
  verdict:
    overall: BREAKS
    scope_of_the_break: >-
      The break is NARROW and is at this joint's own subject: the design's
      committed arm plan is self-contradictory and cross-artifact
      contradictory, and P5 admissibility - the precondition that decides
      whether ANY floor sentence is ever composed - hangs on it. As shipped,
      the machine-readable mirror (execution-budget.json) directs an executor
      to run 8 of the 10 floor arms at (seed, armid) pairs that are NOT on
      the binding carrier's committed arm_table: every k=16 arm at armid 4
      instead of 8, both k=8 arms at armid 4 instead of 6, and FM-K8-1 and
      the four positions 10/11/13/14 at shifted seeds. The binding carrier is
      ALSO internally inconsistent: its seed derivation_rule text ("FLOOR
      block 531100 + j for j = 1..10, assigned in committed run order")
      generates the JSON's seed column, not its own arm_table's. No gate
      catches the divergence pre-arm (G1/G2/G3/G4/H2 all pass under either
      table), so the failure surfaces only at the single post-completion
      P5 evaluation - after all 17 arms and the full 27540 s binding compute
      have run - where the operator faces a choice between two pre-committed
      lists: apply the YAML table (every mirror-run floor receipt is
      inadmissible -> FM-INADMISSIBLE-INPUT halt, no sentence, batch burned)
      or treat the JSON column as committed (compose sentences from arms the
      binding carrier does not list). A post-data choice between HALT and
      COMPOSITION is the optional-evaluation seam NARROW-2-class discipline
      exists to eliminate; the mirror's own precedence note ("on any
      discrepancy the design file governs") sits in the subordinate file, not
      in the binding carrier, and the mirror's declaration that "No figure is
      new, re-derived, or rounded here" is FALSE for its arm rows. The
      design is therefore not freezable as-is: an authorization decision
      must first repair the arm plan by a superseding record (RT4-SR-1,
      BLOCK).
    what_holds: >-
      Everything else this joint attacked holds. The outcome-to-sentence map
      is COMPLETE (23 rows audited; every branch verdict of every arm class
      has a row) and no licensed sentence exceeds what the candidate
      licenses under NARROW-1..5, RAT-3/4/5-with-SR-1 and the R5 conditions;
      ZERO sentences rejected. The stopping-rule architecture defeats every
      discretionary-stopping attack on the declared paths: all six early-exit
      verdicts compose NO floor sentence, the floor cascade has no interim
      evaluation, the G4 monotone early-firing clause is deterministic,
      null-arms-only and suppressive-never-selective, resource_exhaustion is
      pre-arm-budgeted and receipt-preserving, and reseeding can never
      produce a favorable re-draw. The known-false objects route away from
      FM-PLATEAU-CONSISTENT, independently reproduced in fresh code (OBJ-3
      type and OBJ-5B EXACT to six digits; OBJ-4 at the committed parameters
      reproduces 0.952538/0.018883/0.028486/0.000093 within MC error). The
      prohibited-sentence search is clean (every occurrence of every
      prohibited class is a mention inside a prohibition, never a use). The
      margin zone maps to FM-UNRESOLVED ONLY and both load-bearing conjuncts
      are non-droppable on every path. R5-1/R5-2/R5-3 are satisfied on the
      face of the design. AC-1 and AC-2 are correctly DORMANT. One further
      REVISE finding: the committed G4 threshold 39 carries a FALSE exactness
      claim (RT4-SR-2).

  # ------------------------------------------------------------------
  # FINDINGS
  # ------------------------------------------------------------------
  findings:
    - id: RT4-F1
      severity: BLOCK (load-bearing; the break)
      statement: >-
        CONTRADICTORY COMMITTED ARM PLAN. execution-design.yaml arm_table vs
        execution-budget.json arms differ on 10 substantive fields across 8
        of the 10 floor arms (fresh diff, RUN-1): FM-K16-1..4 armid 8 (YAML)
        vs 4 (JSON) - 6 seat-convention violations in the JSON against the
        candidate's own committed convention (IDEA-20260904-6aed0b: "4 for
        k = 4, 6 for k = 8, 8 for k = 16, 1 for the r = 6 anchor, 5 for the
        k = 0 anchor"); FM-K8-1/FM-K8-2 armid 6 vs 4; FM-K8-1 seed 531109 vs
        531105; positions 10/11/13/14 seeds shifted by one (531105-531108 vs
        531106-531109). The YAML's own derivation_rule text generates the
        JSON's seed column under the natural reading (all ten floor seeds
        "assigned in committed run order", k=8 arms included at positions 8
        and 15); the YAML table instead follows a primaries-first reading
        (j=1..8 to the eight primaries, 531109/531110 to the k=8 arms). Two
        committed artifacts therefore carry two different P5 (seed, armid)
        lists, and the binding carrier's rule text contradicts its own table.
        Consequences: (a) an executor consuming the machine-readable mirror
        runs 8 floor arms inadmissible against the binding table; no gate
        detects this pre-arm; the batch halts at P5 after full compute with
        no sentence; (b) the choice between the two lists is resolvable
        POST-DATA and swings the outcome between halt-no-sentence and
        compose-sentence - an optional-evaluation seam; (c) the mirror's
        no-new-content declaration is false for its arm rows.
      evidence: >-
        RUN-1 section A: 17 field diffs (10 substantive; 7 are the k:
        null/None formatting artifact on the six null arms and are not
        substantive); JSON seat-convention violations enumerated; derivation
        rule matched reading-1 by JSON and reading-2 by YAML.
    - id: RT4-F2
      severity: REVISE (committed gate constant with a false exactness claim)
      statement: >-
        G4 THRESHOLD DERIVATION IS FALSE AS WRITTEN. The design commits "39
        pooled hits over the six null arms (lambda_hat_null >= 6.5 per 2^30,
        the EXACT Garwood lower bound of the committed single-arm h = 12
        reading)". 6.5 is not the exact Garwood lower bound of h = 12 under
        either convention: two-sided 95% gives 0.5*chi2_0.025(24) = 6.2006
        (the value the derivation source's own U3 inventory carries, 6.201)
        and one-sided 95% gives 0.5*chi2_0.05(24) = 6.9242 (RUN-1 section
        B). The skeleton's G4 definition ("the count at which the pooled
        measured null rate reaches the exact Garwood lower bound") yields 38
        under the two-sided convention (ceil(6*6.2006)) and 42 under the
        one-sided; the committed 39 matches NEITHER, and the source JSON is
        internally inconsistent (rule line: 39 <-> 6.5 "the Garwood lower
        bound"; U3 line: "exact Garwood lower bound 6.201 ... (39 at n =
        6)"). The design sharpened the loose source line by adding "exact".
        Licensing impact is bounded: G4 halts compose no sentence, the
        deviation is 1 count against the two-sided reading (fires LATE at 38
        vs its stated derivation) and the comparator-setting step restates
        the whole cascade against U_null anyway (U(38,6) ~ 8.25 would drive
        lambda_op), so no prohibited sentence becomes reachable. But a
        committed constant may not carry a false derivation in a record whose
        discipline is "every constant committed with its derivation lineage
        named".
      evidence: 'RUN-1 section B: 6.2006 / 6.9242 exact; ceil(6*6.2006) = 38; 39/6 = 6.5; pricing-v2 lines 237 and 247 quoted.'
    - id: RT4-F3
      severity: DISCLOSE (edge-case sentence hygiene)
      statement: >-
        BRANCH-2 ALIVENESS SENTENCE AT A ZERO-COUNT POINT. The Branch-2
        license includes "the floor is alive at both points (NARROW-1
        carried)". A reading with T_16 = 0 and T_4 >= 12 (e.g. (12,0),
        routed FM-DECAY-CONTINUES, RUN-2 V4; reachable with probability
        ~1.7e-5 under an analytic-null-scale k=16 rate) composes that
        sentence beside a zero-hit reading at k=16, where THIS batch's data
        cannot support aliveness at that point. The sentence is a required
        carry of the standing NARROW-1 finding, so it is not an
        over-license; but composed without flagging the zero reading it
        reads as data-supported. The design has no edge-case instruction for
        T_k = 0 at a primary point.
      evidence: 'RUN-2 V4: (12,0) -> FM-DECAY-CONTINUES, minlike p = 4.88e-4; license text quoted from step_5_2.'
    - id: RT4-F4
      severity: DISCLOSE (cross-batch residual of the stopping architecture)
      statement: >-
        BANKING OF PARTIAL READINGS FROM HALTED BATCHES. Within this design
        no early-exit path can convert a favorable interim reading into a
        sentence (verified below). The residual channel is cross-batch: a
        batch halted by any early-exit verdict leaves its completed receipts
        immutable and visible, and this design itself demonstrates the
        legitimate lineage mechanism by which prior readings become planning
        constants of a successor (U1 lambda_plan sizing, U3 G4 calibration).
        A future design citing partial primary readings from a halted batch
        as committed inputs must disclose the halt context in its use
        inventory, so a favorable partial reading banked by an early stop
        cannot silently size a successor's constants.
      evidence: 'design use_inventory_binding (U1/U2/U3) and stopping_rules verdicts_that_end_the_batch_early, read together.'
    - id: RT4-F5
      severity: DISCLOSE (transcription provenance)
      statement: >-
        CARRIED TEXT IS TRANSCRIPTION-PLUS-ADDITIONS. Against skeleton
        Sections 2-5 the carried binding text ADDS: (i) the H2
        stream-distinctness trigger inside the G1 enumeration (skeleton G1
        does not list it; the candidate's C-STREAM-DISTINCT does require it
        as a hard gate, so the content is candidate-sourced and
        safe-direction); (ii) the G4 monotone early-firing clause
        (evaluation_point_committed; absent from skeleton G4; flagged by the
        design itself in design_choices_for_coordinator_attention); (iii)
        explicit boundary conventions - Branch H "at or above" c_gate,
        resolving the skeleton's INTERNAL inconsistency (Step 5.0 "exceeds"
        vs Step 5.6 "D_k >= c_gate") per the FC-2 zero-boundary-mass audit,
        zero content impact; (iv) the R5-1 inline priced-semantics
        requirement appended to the Step 5.4 license (required by
        DEC-20260904-c501b9, not drift). All additions are safe-direction or
        mandated, but transcription_fidelity_note presents the carried text
        as a checked transcription; the authorization decision should record
        these four as design-owned additions so the binding carrier's
        provenance is exact.
      evidence: 'Line-by-line comparison of binding_cascade_text_carried against skeleton lines 171-461 (read in session).'
    - id: RT4-F6
      severity: INFORMATIONAL (record hygiene, three items)
      statement: >-
        (a) live_values_register lists plateau_fp_bound_original_rule:
        0.186556 with no "not the binding price under this design's
        tightened Branch 4" label (the key name carries the scope; a label
        like 0.970869's CONDITIONAL discipline would close it). (b) The
        coverage claim "all six gate/halt verdicts and resource_exhaustion"
        counts five gate/halt verdicts (G1-G4 + FM-INADMISSIBLE-INPUT) plus
        resource_exhaustion = the six rows of Section A; the phrasing
        overcounts by one unless A5a/A5b are counted separately. (c) The
        mirror's kind label "k8_report_only" vs the design's
        "k8_secondary_report_only" (cosmetic). None affects licensing.
      evidence: 'RUN-1 section E; coverage_claim vs verdicts_that_end_the_batch_early.'

  # ------------------------------------------------------------------
  # CHECK 1: OUTCOME-TO-SENTENCE MAP COMPLETENESS AND LICENSING
  # ------------------------------------------------------------------
  outcome_map_audit:
    rows_checked: 23
    rows: >-
      A1 FM-GATE-FAIL; A2 FM-ANCHOR-FAIL; A3 FM-DEAD-ANCHOR-FAIL; A4
      FM-NULL-CONTROL-FAIL; A5a FM-INADMISSIBLE-INPUT (primary/null/anchor
      exclusion); A5b (k=8 report-only exclusion, non-halting); A6
      resource_exhaustion / infrastructure failure (incl. C2 binding_stop_utc
      halt); B1 lambda_op = lambda_0; B2 lambda_op = U_null > 1.0; C
      FM-OVERDISPERSED (sub-cases k=4 only / k=16 only / both, same branch,
      sentence names the points); D1 FM-COMPARATOR-INDISTINGUISHABLE; D2
      FM-DECAY-CONTINUES; D3 FM-INVERTED; D4 FM-PLATEAU-CONSISTENT; D5a
      FM-UNRESOLVED (interval non-containment); D5b FM-UNRESOLVED
      (margin-zone demotion); E1/E2 run-order disclosure (never a verdict);
      F realized-power restatement incl. shortfall sub-case; G1/G2/G3
      report-only surfaces; H single-valuation exhaustiveness row.
    completeness: >-
      COMPLETE. I independently enumerated the outcome space (pre-arm H2;
      per-receipt G1; position-1 G2; per-null-arm G3; running-pooled G4
      incl. early firing; P1-P5 exclusions split by arm class; budget/infra;
      comparator-setting sub-cases; Branch H at either/both points; Branches
      1-5 incl. both Branch-5 sub-cases; run-order significance; realized
      power shortfall; report-only surfaces; simultaneous gate failures -
      the gates' relative order is stated only partially ("themselves
      ordered"; G2 first among alive readings), which is licensing-irrelevant
      because every gate composes no sentence). Every leaf has a row; the
      map's rows quote or point at the carried binding text and never
      paraphrase a conjunct or a prohibition (RAT-3 with SR-1 respected).
    sentences_rejected: 0
    licensing_test_summary: >-
      Every row's licensed sentence was tested against NARROW-1..5,
      RAT-3/4/5-with-SR-1 and R5-1..3, and against the candidate's
      branch_licensing (the candidate licenses "exactly the sentences
      enumerated per branch ... and no others"; the design's carried
      licenses match it, with the mandated R5-1 inline additions). Gate/halt
      rows license nothing about the floor (AGENTS rules 3/5; NARROW-3
      no-rearm quoted). D1 bars extinction explicitly and routes to
      instrument review with the disclosed contradiction. D2 satisfies
      NARROW-2 (4 seeds per named point), SCOPE-1 (no dilution-only
      language; interior-only comparisons inherit schedule-clean
      attribution) and RAT-4 (pair-named). D3 leaves SH2-MONOTONE-DECAY
      untouched (band-vs-count scoping). D4 is confinement-at-resolution
      only, carries 0.171940 with the full R5-1 priced-semantics inline, is
      read artifact-first, licenses no mechanism, and bars
      safe-for-all-phi. D5 licenses only the measured-obstruction and
      successor-pricing sentences. F carries 0.970869 only CONDITIONAL. G
      rows carry no count verdict at k=8 (NARROW-5). One wording edge
      (RT4-F3): the D2 aliveness carry at a zero-count point needs a
      flagging instruction; classified DISCLOSE, not a rejected sentence.
      Note (not a finding): under margin-zone heterogeneity Branch 1 can
      still compose its pooled comparator-indistinguishability sentence (the
      margin conjunct guards Branch 4 only); that sentence is a
      resolution-statement plus instrument-review routing, contains no
      plateau or magnitude content, and is within the candidate's license.
      Note: row C attaches "sentence price 0.018883" to the composed
      FM-OVERDISPERSED sentence; 0.018883 is the decay-alternative MISROUTING
      price (P(overdispersed routing | OBJ-4 truth)), not a false-positive
      probability of the over-dispersion sentence - the inline
      priced-semantics text names that conditional semantics, so the number
      travels with its correct meaning; tightening the label would remove
      any misread risk.

  # ------------------------------------------------------------------
  # CHECK 2: STOPPING-RULE ATTACK (per-path results)
  # ------------------------------------------------------------------
  stopping_rule_attack:
    path_1_six_early_exit_verdicts: >-
      ATTACK DEFEATED. All six (G1, G2, G3, G4, FM-INADMISSIBLE-INPUT,
      resource_exhaustion) compose NO floor sentence of any kind - verified
      in the design's verdicts_that_end_the_batch_early, the map's Section A
      rows, and the candidate's gate licensing. Floor-receipt counts ARE
      visible mid-batch (G1 per-receipt evaluation reads the hit counters as
      part of the saturation-aware identity), so a favorable plateau-shaped
      partial reading CAN be observed; but no early-exit path can convert it
      into any verdict, and the prohibited-sentence register binds "any
      branch, any record, any summary" under the design, with sentences
      composable only through a fired branch of the single post-completion
      valuation. Stopping after a favorable observation therefore buys
      nothing licenseable.
    path_2_g4_monotone_early_firing: >-
      NOT EXPLOITABLE. The clause fires when the running pooled count over
      COMPLETED null arms reaches 39. Math is sound (counts are
      non-negative, so a partial sum >= 39 forces the completed sum >= 39;
      the verdict is identical under both readings; deterministic and
      pre-committed). It reads NULL arms only - floor readings cannot
      trigger it - and its effect is HALT with no sentence: it can only
      SUPPRESS sentences, never select a favorable one. An operator cannot
      manufacture null-arm hits without fabricating receipts (core rule 9,
      preserved outputs, G1 attribution). The RT4-F2 calibration defect
      changes no gameability: 39 is a fixed pre-arm number regardless of its
      mis-stated derivation.
    path_3_single_post_completion_valuation: >-
      HOLDS. Branch H and Branches 1-5 are evaluated EXACTLY ONCE after
      position 17, in fixed written order, on complete data; every
      floor-verdict row of the map requires ALL 17 arms; "A FAVORABLE
      PLATEAU READING IS NEVER A STOPPING POINT" is structural (no interim
      floor evaluation exists) and compositional (the sentence arrives only
      with the realized-power, run-order, operative-comparator and 0.171940
      disclosures). Position-17 (FM-N06) infrastructure failure is covered:
      the null block cannot complete, the comparator step cannot run, and the
      design's pre-arm-committed halt extension halts with no floor sentence.
    path_4_resource_exhaustion_gaming: >-
      NOT GAMEABLE WITHIN THE DESIGN. Budgets are committed pre-arm as
      design constants (27540 s binding, 29500 s declared cap;
      binding_stop_utc stamped from start_utc before the batch), so
      deliberate UNDER-PROVISIONING after seeing favorable readings is
      impossible mid-batch - there is no provisioning knob left to turn. A
      budget halt composes no verdict from partial primary data; receipts are
      preserved untouched; dropped work is named as scope. A fabricated
      crash/timeout is a core-rule-9 fabrication the design does not license
      and that is auditable (pre-stamped stop time, preserved defective
      outputs, named dropped work, checkpoint attribution). The residual
      channel is cross-batch banking of surviving partial receipts as future
      planning constants - disclosed as RT4-F4/RT4-SR-4, not a license of
      this design.
    path_5_reseeding: >-
      HOLDS. Re-invocation is permitted only at the identical committed
      (seed, armid, build) and is recorded as instrument determinism, never
      replication (NARROW-3) - the same reading returns, so no favorable
      re-draw exists; seed changes require a NEW frozen contract and can
      never happen mid-batch; an inadmissible-and-unrepairable exclusion
      halts rather than being absorbed or substituted.
    path_6_p5_admissibility_seam: >-
      BREAKS (RT4-F1). The ONLY post-data discretionary path found anywhere
      in the design is the choice of which committed (seed, armid) list binds
      P5, created by the contradictory arm tables: it swings the outcome
      between halt-no-sentence and compose-sentence and is resolvable only
      by improvisation once receipts exist. Classified BLOCK; repair is a
      pre-arm superseding record (RT4-SR-1).

  # ------------------------------------------------------------------
  # CHECK 3: KNOWN-FALSE OBJECTS (fresh-code routing, RUN-2)
  # ------------------------------------------------------------------
  known_false_routing:
    method: >-
      Fresh implementation of the carried cascade text (Branch H first, then
      Branches 1-5; minimum-likelihood two-sided convention cross-checked
      against scipy binomtest to <1e-12; exact Clopper-Pearson; D := 0 at
      t = 0; strict margin, non-strict gate). Exact enumeration of the
      per-total dispersion law (multinomial compositions / binomial
      two-arm split) and the joint (T_4, T_16) grid.
    constructed_known_answer_readings: >-
      8/8 PASS. Margin-zone at k=4 only (24,32,40,48; D=8.8889) ->
      FM-UNRESOLVED; margin-zone at k=16 ONLY (9,13,18,24; D=7.875) ->
      FM-UNRESOLVED; Branch-H vector (20,30,40,54; D=17.5556) ->
      FM-OVERDISPERSED; non-rejecting containment-fail (60,45) ->
      FM-UNRESOLVED; (11,11) -> FM-COMPARATOR-INDISTINGUISHABLE; (12,12)
      (non-rejecting, CP too wide) -> FM-UNRESOLVED; true equal-rate reading
      (64,64), D=0 both -> FM-PLATEAU-CONSISTENT (a TRUE positive, correct);
      edge (12,0) -> FM-DECAY-CONTINUES (RT4-F3). ABSENCE-OF-DECAY ATTACK:
      a no-decay reading licenses a plateau sentence ONLY with interval
      containment AND affirmative homogeneity margin at both points; every
      constructed absence-of-decay reading lacking either routed to
      FM-UNRESOLVED. Absence of decay never produced plateau evidence.
    obj4_homogeneous_null_decay_object: >-
      ROUTED AWAY FROM FM-PLATEAU-CONSISTENT except through the disclosed,
      budgeted residual. At the COMMITTED generator parameters (expected
      T_4 = 90.51, T_16 = 45.25 per pricing-v2's object definition; per-arm
      lambda 16*sqrt(2) and 16/sqrt(2)): FM-DECAY-CONTINUES 0.952498
      (target 0.952538), FM-OVERDISPERSED 0.018922 (0.018883),
      FM-UNRESOLVED 0.028487 (0.028486), FM-PLATEAU-CONSISTENT 0.000093
      (0.000093 exact), FM-INVERTED 0.000000; grid+MC sum 1.000000. The
      9.3e-5 plateau residual is the disclosed value, dominated by the
      committed per-arm 0.171940 budget, and every composed Branch-4
      sentence must carry that bound with the R5-1 scope inline (map D4) -
      the map's claim "NO known-false object receives FM-PLATEAU-CONSISTENT
      except through the disclosed, budgeted residual" is VERIFIED. (My
      first enumeration used a wrong parameter guess, lambda 16/8 per arm,
      and missed the targets; corrected to the committed definition and
      disclosed as a scoped bug-fix re-run.)
    obj5b_analytic_null_mean_heterogeneous: >-
      ROUTED AWAY FROM FM-PLATEAU-CONSISTENT, EXACTLY. At phi = 2.0
      (rates 2,2,0,0 per arm; pooled T ~ Pois(4) exactly):
      FM-COMPARATOR-INDISTINGUISHABLE 0.884236 and FM-OVERDISPERSED
      0.115764 - both reproduced EXACTLY to six digits against the prior
      round's independently verified values - FM-PLATEAU-CONSISTENT
      0.000000, with the Branch-4 statistical-conjunct mass ceiling
      2.1334e-77 reproducing the prior round's 2.133e-77 exactly. The
      homogeneous analytic-null object (OBJ-3 type) reproduces the full
      prior-round routing exactly (0.989349 / 0.008843 / 0.000449 / 0.000449
      / 0.000909 / 0.000000, sum 1.000000): plateau mass ZERO.
    routing_verdict: >-
      The outcome map's pre-arm paper-routing obligations
      (proves_too_much_paper_routing_pre_arm, incl. the J-D2-inherited
      objects) match my independent fresh-code routings on every named
      value. No known-false object reaches a plateau sentence except via
      the disclosed, budgeted, bound-carrying OBJ-4/OBJ-5A residual.

  # ------------------------------------------------------------------
  # CHECK 4: PROHIBITED-SENTENCE SEARCH
  # ------------------------------------------------------------------
  prohibited_sentence_search:
    method: >-
      Full-text scan of all three artifacts for the seven prohibited classes
      (extinction; completion / decay-has-ended; cliff-at-4 /
      sub-sub-interval; whole-curve; plateau-safe-for-all-phi;
      count-verdict-at-k=8; k=12-as-coverage), every hit line adjudicated by
      hand in context, plus a never-live-value scan.
    result: CLEAN - mentions, never uses.
    detail: >-
      Every occurrence of every prohibited class sits inside a NOT-licensed
      list, the prohibited_sentence_register, a NARROW/RAT verbatim
      quotation, or an operational "run to completion" / "receipt
