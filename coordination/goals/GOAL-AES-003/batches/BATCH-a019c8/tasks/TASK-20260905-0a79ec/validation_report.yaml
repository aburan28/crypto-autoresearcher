    - id: F-6
      check: procedure
      load_bearing_for_future_authorization_decision: false
      statement: >-
        VALIDATOR-SIDE PROCEDURE DISCLOSURES. (a) Prior read after
        sealing (prior_comparison block). (b) One environment probe
        (python3 -c version/import check) was run BEFORE the two sealed
        derivation runs; it computes nothing about the design and is not
        counted against maximum_runs = 3 - interpretation disclosed. (c)
        Occurrence searches (ripgrep) for 0.977 / 29.2 / 0.970869 /
        0.171940 / 0.018883 are tool-level searches, not derivation
        scripts, and are likewise not counted; both interpretations are
        stated so the archive can rule otherwise if it prefers. (d) Run 1
        initially printed "ALL PRODUCER BUDGET FIGURES CONFIRMED: False"
