        - {locus: "r5_conditions.r5_2 verbatim quotation L350-354 ('priced against the 0.171940 worst case')", figures: 0.171940, class: META, ruled: "acceptable - verbatim quotation of the DEC rule text; altering it to insert scope would break verbatim carriage; R5-1's verbatim text sits immediately above in the same block"}
        - {locus: "rt3_successor_requirements RT3-SR-2 item L366 ('against 0.171940')", figures: 0.171940, class: META, ruled: "acceptable - verbatim successor-requirement quotation; RT3-SR-1 item immediately above carries the requirement itself"}
        - {locus: "arm_plan.why_D2.vs_D1 L436-444 ('committed R5-2 prices (0.171940 plateau, 0.018883 decay-branch)')", figures: both, class: BARE, ruled: "MISSING - bound-carrying under the design's own definition ('states, prices'); no scope statement, no pointer. FINDING F-3 item 1"}
        - {locus: "proves_too_much_paper_routing OBJ-4 routing list L1015-1021 ('FM-OVERDISPERSED 0.018883 ... dominated by the committed per-arm 0.171940 budget - PRICED SEMANTICS: ...')", figures: both, class: "ABRIDGED for 0.171940 / BARE for 0.018883", ruled: "0.171940 scope present inline; the 0.018883 companion statement is absent from the sentence. FINDING F-3 item 2"}
