        - {locus: "fp_budget_r5_2.per_arm_commitment numeric fields L1052-1056 and arithmetic strings L1057-1060", figures: both + totals, class: FIELD, ruled: "acceptable with note - structured fields/arithmetic lines; the block's priced_semantics_of_the_budget_bound_carrying (L1071-1090) carries BOTH full statements inline and is explicitly marked 'carried inline because this block is bound-carrying'"}
        - {locus: "per_arm_not_per_family_attestation L1061-1070", figures: both + 0.021493, class: FIELD, ruled: "acceptable with note - same block-level carriage as above"}
        - {locus: "priced_semantics_of_the_budget_bound_carrying L1071-1090", figures: both, class: FULL, ruled: present}
        - {locus: "semantics_of_the_sum L1091-1102 ('remains 0.171940 with the R5-1 priced-semantics statement above'; '0.018883 ... with its companion statement')", figures: both, class: POINTER, ruled: "pointer forms; barred by the design's own rule; full statements in the same block. FINDING F-4"}
        - {locus: "informational_sub_price_disclosed L1115-1122", figures: 0.171940, class: ABRIDGED, ruled: "present - '(PRICED SEMANTICS as above: certified over the OBJ-5A calibration family and the probed configurations, NOT as a theorem for all equal-mean configurations, RT2-F6)' carries the essential scope language inside the sentence"}
        - {locus: "stopping_rules FM-PLATEAU-CONSISTENT requires L1205-1217", figures: 0.171940, class: FULL, ruled: "present - full inline including attainment semantics, residual range, bounded-is-not-small"}
