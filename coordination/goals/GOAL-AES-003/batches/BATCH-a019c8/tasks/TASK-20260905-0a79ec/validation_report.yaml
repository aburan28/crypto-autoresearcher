        - {locus: "step_5_4 LICENSED text L916-919 ('SR-2 disclosed plateau-heterogeneity false-positive bound ... MUST carry that bound ... with the R5-1 priced-semantics scope statement inline')", figures: none (bound named, no numeral), class: META, ruled: "acceptable - composes the forward obligation; numerals absent"}
