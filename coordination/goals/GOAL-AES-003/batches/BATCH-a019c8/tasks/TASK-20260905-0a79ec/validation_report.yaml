  # CHECK 6 - BUDGET FEASIBILITY
  # ==================================================================
  check_6_budget_feasibility:
    verdict: PASS
    wall_clock: >-
      FEASIBLE. Binding serial compute 27540 s sits under the declared
      cap 29500 s with 1960 s headroom, whose stated contents (SR-5
      periodic custody checkpoints - every four completed arms OR every
      3600 s, whichever first, i.e. about 6 arm-cadence checkpoints
      including pre/post plus time-cadence checkpoints on a ~27540 s
      serial span; "short KAT receipts", disclosed small and non-binding)
      are plausible inside the headroom (~245 s per checkpoint event if
      ~8 events). Under the non-binding measured rate the same arms take
      ~2635 s serial; caps are set on the binding baseline regardless,
      which is the conservative direction. The campaign's
      total_wall_clock_seconds is null (no cap; standing directive
      DEC-20260828-1ea24c), so no campaign-budget ceiling binds;
      budget_discipline (C2) makes the declared caps stop conditions with
      truthful halted_on_budget recording, never negative mathematical
      results.
    authoring: >-
      FEASIBLE AND EXACTLY SIZED. 11700 s = 4 producer tasks (4 x 1600)
      + 4 snapshots (4 x 500) + validation 1400 + red team 1000 + ledger
      archive 900 - the per-role lines of GOAL-AES-003
      campaign_budget.sizing_basis used with no cushion and no rounding
      slack (the sizing basis's own discipline), reported SEPARATELY from
      compute per C4. This task's own 1400 s validation budget is the
      sizing basis's validation line.
    memory: >-
      FEASIBLE. Declared 4 GB, the campaign's standing figure (matches
      the candidate's target_complexity.memory_exponent), with an O(1)-
      per-trial basis (table-driven direct evaluation, fixed histograms,
