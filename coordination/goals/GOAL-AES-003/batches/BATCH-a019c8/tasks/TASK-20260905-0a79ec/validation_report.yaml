      as derivation evidence; (e) the map's binding preamble names
      execution-design.yaml as the binding carrier under the NON-RELIANCE
      declaration. The binding verbatim texts the design DOES adopt as
      binding (AMEND-1, SCOPE-1, NARROW-1..5, RAT-3/4/5, R5-1..3,
      RT3-SR items) come from DEC ledger sources, not from either named
