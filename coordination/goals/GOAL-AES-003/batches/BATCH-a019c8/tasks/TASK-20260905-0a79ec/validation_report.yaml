      - {block: SCOPE-1, source: DEC-20260903-63cd8d, result: "IDENTICAL (folded); quotation_status correctly names the DEC-20260903-63cd8d carried form as the binding inheritance"}
      - {block: NARROW-1, source: DEC-20260902-7ad3d9, result: "IDENTICAL (folded)"}
      - {block: NARROW-2, source: DEC-20260902-7ad3d9, result: "IDENTICAL (folded)"}
      - {block: NARROW-3, source: DEC-20260902-7ad3d9, result: "IDENTICAL (folded)"}
      - {block: NARROW-4, source: DEC-20260903-be4472, result: "IDENTICAL (folded)"}
      - {block: NARROW-5, source: DEC-20260903-be4472, result: "IDENTICAL (folded)"}
      - {block: RAT-3, source: DEC-20260903-be4472 ratifications, result: "IDENTICAL (folded); with_sr1_extension present as required"}
      - {block: RAT-4, source: DEC-20260903-be4472 ratifications, result: "IDENTICAL (folded)"}
      - {block: RAT-5, source: DEC-20260903-be4472 ratifications, result: "IDENTICAL (folded) - the TRUE VERBATIM, not the skeleton's Section-0 paraphrase; AC-1 defect not reproduced"}
      - {block: R5-1 / R5-2 / R5-3, source: DEC-20260904-c501b9 rt2_sr5_ruling, result: "each contained VERBATIM (folded) in the ruling scalar"}
      - {block: RT3-SR-1..4 + AC-1/AC-2 item, source: DEC-20260904-c501b9 successor_requirements, result: "all five items VERBATIM (exact list-item match)"}
      - {block: realized readings, source: pricing-v2 committed_inputs / EV lineage, result: "h(4)=17(531001)/21(531002), h(8)=13(531001)/18(531002), h(16)=12(531001), each at 2^30/arm, cell (1,1), r=5, PIN-T0 - all present in YAML and map, all values match"}
      - {block: Garwood CI for 17, source: CORR-20260903-d3cab5 via RAT-5 / pricing-v2, result: "[9.903, 27.219] carried; independently re-derived from the closed form [0.5*chi2_0.025(34), 0.5*chi2_0.975(36)] = [9.903, 27.219] - exact match"}
    rat5_29_2_ruling:
      question: >-
        The producer disclosed one occurrence of the RAT-5 citation-error
        figure (29.2) inside the verbatim RAT-5 quotation, arguing
        mentions-not-uses. Acceptable carriage or FAIL?
      ruling: ACCEPTABLE CARRIAGE (PASS).
      reasoning: >-
        (1) FUNCTION. The never-live prohibition exists to stop the figure
        entering a CI, threshold, budget, conjunct, or composed sentence
        as a value. A verbatim quotation of CORR-20260903-d3cab5/RAT-5 -
        a record whose entire content IS the citation error and its
        correction - RECORDS the error; it does not use it. (2) THE
        ALTERNATIVE READING CREATES AN OBLIGATION CONTRADICTION. The
        batch's standing constraints and this task's check 7 require
        RAT-3/4/5 carried verbatim (RAT-3-with-SR-1 bars paraphrase);
        RAT-5's verbatim text contains the figure. Absolute-literal
        satisfaction of "29.2 must not reappear" would force either
        dropping RAT-5 (violating the carriage requirement) or altering
        the quotation (violating verbatim discipline and reproducing an
        AC-1-class paraphrase defect - the exact thing this design
        explicitly avoids). The only reading on which all binding
        obligations are simultaneously satisfiable is mentions-not-uses.
        (3) VERIFIED FACTS. Ripgrep confirms EXACTLY ONE occurrence of
        "29.2" across the three artifacts - execution-design.yaml L334,
        inside the rat_5 verbatim block; the JSON and the map each state
        the figure is deliberately not reprinted there; no CI, threshold,
        budget, conjunct, or sentence anywhere consumes it; the operative
        CI is [9.903, 27.219], re-derived exactly in run 1. (4)
        PRECEDENT. The design itself cites J-G2's mentions-not-uses
        distinction for the former Branches-1-5-only values, and this
        task's handoff frames the question in those terms. RECOMMENDATION
        (hardening, not a defect): a future authorization decision should
        restate the never-live rule in explicit mentions-not-uses form so
        the absolute-literal ambiguity is closed on the record.

