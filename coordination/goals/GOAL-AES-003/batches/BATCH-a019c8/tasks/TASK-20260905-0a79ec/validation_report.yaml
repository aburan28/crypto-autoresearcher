      remain DORMANT; activation route stated for any future verbatim
      adoption) and execution-budget.json r5_3_reliance (declared_posture
      NON-RELIANCE; effect AC-1/AC-2 dormant; every constant copied into
      the design and mirrored as a committed constant of THIS design,
      sources cited as derivation lineage only).
    consistency_with_actual_reliance: >-
      CONSISTENT. Every reference to either document in all three
      artifacts was enumerated and each is derivation-source or
      transcription-source usage under an explicit non-reliance frame,
      never binding-text treatment: (a) transcription_source - the
      cascade text was transcribed FROM the skeleton's Sections 2-5 in
