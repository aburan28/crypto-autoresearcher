    machine_headroom: >-
      CONSISTENT WITH THE GOAL HEAD. The design's stated assumption -
      four-core host shared by three active AES campaigns under a
      max_concurrent = 3 cap ACROSS ALL THREE; each arm one four-thread
      process; binding wall-clock sized for arms running ONE AT A TIME
      (serial); concurrency divides wall clock only, with the committed
      position order preserved as the logical ordering; caps unchanged by
      scheduling; cross-campaign cap honoured first and if honouring it
      would require running degraded the batch WAITS - matches
      GOAL-AES-003.yaml relationship_to_GOAL_AES_002 ("max_concurrent 3
      is a cap ACROSS ALL THREE, not 3 each. If honouring it would
      require running degraded, this goal's batch WAITS") and
      campaign_budget (max_concurrent: 3). Serial sizing on a four-core
      host with one four-thread process per arm is the correct
      conservative basis; no overcommit is assumed anywhere.

