  # ==================================================================
  # FINDINGS (classified load-bearing for a FUTURE AUTHORIZATION
  # DECISION or not, per the handoff)
  # ==================================================================
  findings:
    - id: F-1
      check: 3
      load_bearing_for_future_authorization_decision: true
      statement: >-
        EXECUTION-BUDGET.JSON ARMS MIRROR DIVERGES FROM THE GOVERNING
        EXECUTION-DESIGN.YAML ARM_TABLE ON 8 OF 17 ARMS. Programmatic
        diff (run 2): ARMID divergences on six arms - FM-K16-1..4 carry
        armid 8 in the YAML but armid 4 in the JSON; FM-K8-1/2 carry
        armid 6 in the YAML but armid 4 in the JSON (the design's own
        seats_armid_convention: k=4 -> 4, k=8 -> 6, k=16 -> 8). SEED
        divergences on five arms - FM-K8-1 (531109 vs 531105), FM-K4-3
        (531105 vs 531106), FM-K16-3 (531106 vs 531107), FM-K4-4
        (531107 vs 531108), FM-K16-4 (531108 vs 531109). Cosmetic: the
        JSON kind label "k8_report_only" vs the YAML's
        "k8_secondary_report_only". Positions, trials, r, k values, the
        anchor and all six null arms agree; the seed MULTISET is
        identical (only the arm<->seed mapping differs). The JSON's own
        mirror note - "Every figure here is committed there ... No figure
        is new, re-derived, or rounded here" - is self-violated: its
        armid/seed values are either new or re-derived by applying the
        derivation_rule in run order. CONSEQUENCE IF FROZEN AS-IS: an
        executor consuming the JSON would run seven arms whose
        (seed, armid) pairs are NOT on the P5 committed list at all
        ((531102,4), (531104,4), (531106,4), (531108,4), (531109,4),
        (531110,4) and (531107,4) is on the list but assigned to a
        different seat), plus one arm whose pair exists on the list under
        a DIFFERENT arm_id - i.e. FM-INADMISSIBLE-INPUT halts on primary
        and report-only arms, or worse, ambiguity about which mapping was
        committed pre-arm. The mirror note's precedence clause ("on any
        discrepancy the design file governs") resolves authority but does
        not cure a frozen package containing two conflicting committed
        arm tables. REMEDY: a superseding design record correcting the
        mirror (or explicitly re-committing one mapping in both files)
        BEFORE any authorization decision freezes the package by exact
        path. No scientific content is affected; the FP budget, priced-arm
        identification, and totals are identical in both files.
    - id: F-2
      check: 3
      load_bearing_for_future_authorization_decision: true
      statement: >-
        THE DESIGN'S DECLARED SEED DERIVATION_RULE DOES NOT REPRODUCE THE
        DESIGN'S OWN ARM_TABLE. The rule commits "the FLOOR block is
        531100 + j for j = 1..10, assigned in the committed run order",
        and the committed run order IS the position column. Applying the
        rule to the floor arms at positions 3,4,6,7,8,10,11,13,14,15
        yields 531101,531102,531103,531104,531105,531106,531107,531108,
        531109,531110 - which matches the JSON mirror but NOT the YAML
        arm_table at five positions (the table assigns the floor block in
        point order with the k8 arms last: K8-1 at position 8 gets
        531109, K4-3 at position 10 gets 531105, etc.; programmatic
        verification, run 2). Root cause shared with F-1: two mappings
        exist and the record does not say which is committed. The P5
        admissibility check and the H2 pre-arm stream-distinctness gate
        ("every (seed, armid, thread) triple of the committed arm table")
        both depend on ONE committed table. REMEDY: the superseding
        record of F-1 must also make the derivation_rule and the
        arm_table consistent (either restate the rule as point-order
        assignment matching the table, or re-commit the table in run
        order matching the rule). Note: under EITHER mapping the seeds
        remain deterministic, pre-arm, on-list, disjoint and
        non-discretionary - the defect is record integrity, not seed
        discipline.
    - id: F-3
      check: 4
      load_bearing_for_future_authorization_decision: true
      statement: >-
        TWO BOUND-CARRYING SENTENCES (UNDER THE DESIGN'S OWN DEFINITION)
        CARRY NO PRICED-SEMANTICS STATEMENT. (i) execution-design.yaml
        arm_plan.why_D2_and_not_the_alternatives.vs_D1: "the committed
        R5-2 prices (0.171940 plateau, 0.018883 decay-branch) ... are
        priced ONLY at the D-2 constants n = 4" - states and prices both
        figures with no scope statement and no pointer in the sentence.
        (ii) proves_too_much_paper_routing_pre_arm: the OBJ-4 routing
        list states "FM-OVERDISPERSED 0.018883" with the 0.171940 scope
        statement inline later in the same sentence but NO companion
        statement for 0.018883. The design's application_rule defines a
        bound-carrying sentence as any sentence that "states, prices,
        budgets, or discloses" either figure and requires the canonical
        statement INLINE "in the sentence itself - not by pointer"; on
        that strict reading, and on a strict reading of RT3-SR-1 ("carry
        the priced-semantics scope statement of R5-1 in every
        bound-carrying sentence"), the design does not satisfy its own
        rule on its face at these two sites. A future authorization
        decision must find RT3-SR-1..2 discharged before any arm runs; it
        should therefore EITHER see these two sites repaired in the F-1
        superseding record (trivial textual fix: append the canonical
        statements) OR adopt on the record an explicit mentions-not-uses
        reading for figure-naming rationale sentences - which would also
        harmonize with the 29.2 ruling in check 7. No composed result
        sentence is at risk: every branch licence and stopping-rule
        obligation independently mandates inline carriage.
    - id: F-4
      check: 4
      load_bearing_for_future_authorization_decision: false
      statement: >-
        POINTER-FORM CARRIAGE VIOLATES THE DESIGN'S OWN STRICTER "NOT BY
        POINTER" RULE AT ~9 SITES WHILE PRESERVING R5-1 SUBSTANCE. Sites:
        YAML "same PRICED SEMANTICS as above" (OBJ-5A paper-routing
        sentence) and "with the R5-1 priced-semantics statement above /
        with its companion statement" (semantics_of_the_sum); JSON
        sentence_level_prices note ("carry their priced-semantics
        statements above wherever quoted"); map live-values preamble
        (statement carried in the immediately adjacent block declared
        applicable to every row) and the row-level attachment formulas
        (Sections C, D2, D4 x2, F: "with its priced-semantics statement
        (preamble) attached"). Each is an explicit NAMED attachment
        inside the same block/file whose head carries the full canonical
        statement, so no figure can travel to a composed sentence without
        its scope; but the design's application_rule says "in the sentence
        itself - not by pointer", and these are pointers. NOT
        LOAD-BEARING: R5-1's substance is intact and the forward
        obligations on composed sentences require true inline carriage.
        REMEDY (optional, textual): the F-1 superseding record may either
        restate the statements inline at these sites or relax the
        application_rule to "inline within the same block, by explicit
        named attachment" so the record's declared discipline matches its
        practice. A design whose self-declared rule is stricter than its
        practice invites exactly this audit every round.
    - id: F-5
      check: observation (rule 8; outside the seven named checks)
      load_bearing_for_future_authorization_decision: false
      statement: >-
        G4 THRESHOLD LABEL IMPRECISION, CARRIED FROM UPSTREAM. The design
        (and the JSON, and the map's A4 row) state the G4 basis as
        "lambda_hat_null >= 6.5 per 2^30, the EXACT Garwood lower bound of
        the committed single-arm h = 12 reading". Re-derived in run 1:
        the exact two-sided 95% Garwood lower bound at h = 12 is 6.2006
        and the exact one-sided 95% lower bound is 6.9242; 6.5 is neither
        (6 x 6.2006 = 37.20; 6 x 6.9242 = 41.55; the committed pooled
        threshold is 39 = 6 x 6.5 exactly). The upstream pricing-v2
        carries the same internal tension (its U3 inventory says "exact
        Garwood lower bound 6.201 ... (39 at n = 6)" while its
        hard_gate_threshold rule says "lambda_hat_null >= 6.5 ... the
        Garwood lower bound"). The COMMITTED gate constant (39) is
        unambiguous and is what the conjunct consumes; 39 is more
        conservative than the one-sided-derived threshold and less
        conservative than the two-sided-derived one, sitting between the
        two conventions. NOT LOAD-BEARING for authorization (the constant
        is committed, the gate direction is safe, the label defect
