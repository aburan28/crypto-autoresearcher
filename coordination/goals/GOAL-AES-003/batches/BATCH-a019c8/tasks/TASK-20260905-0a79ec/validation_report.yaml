  # ==================================================================
  # TERMINAL VERDICT (joint J-D1 only)
  # ==================================================================
  verdict: HOLDS_WITH_FINDINGS
  verdict_scope: >-
    Joint J-D1 ONLY: the execution design's arithmetic and completeness -
    (1) the R5-2 per-arm false-positive budget under blind sealed
    re-derivation, (2) exposure/arm-count/cost arithmetic against the
    candidate's corrected priced tables and the never-live-value
    discipline, (3) seed determinism/declaration/non-discretion, (4) R5-1
    priced-semantics carriage on bound-carrying sentences, (5) R5-3
    declared-reliance consistency, (6) budget feasibility against the
    goal's sizing basis and machine headroom, (7) verbatim carriage of
    the realized readings, the Garwood CI, and AMEND-1/SCOPE-1/
    NARROW-1..5/RAT-3/4/5-with-SR-1/R5-1..3/RT3-SR items, including the
    29.2-in-quotation ruling. NOT a verdict on: licensing and stopping-
    rule semantics or prohibited-sentence search (joint J-D2, blind);
    fidelity of the transcribed cascade text against the skeleton's
    Sections 2-5 (not an input to this task); the acceptability of the
    0.171940 price itself (the Coordinator's ruled standing price); or
    any authorization decision, which remains separate and committed.
  verdict_rationale: >-
    ALL SEVEN CHECKS PASS. (1) The FP budget re-derives EXACTLY in fresh
    sealed code from the bound statements and declared arm count alone:
    per arm 0.171940 + 0.018883 = 0.190823; 8 priced arms; 8 x 0.171940 =
    1.375520; 8 x 0.018883 = 0.151064; total accounting sum 1.526584,
    explicitly not an event probability - every producer number
    CONFIRMED, none refuted, and the pricing is PER ARM, NOT PER FAMILY
    (the family-divided 0.021493 counterfactual is named by the design as
    what it does NOT commit and matches my exact quotient). (2) Exposure
    and cost arithmetic confirms against the candidate's corrected priced
    tables (17 x 2^30 = 18253611008; 17 x 1620 = 27540 with cap 29500;
    authoring 11700 separate per C4; memory 4 GB); 0.977 appears NOWHERE
    as a live value (zero occurrences); 0.970869 appears only labelled
    conditional-on-Branch-H-not-firing (all 5 occurrences verified).
    (3) Seeds are deterministic, declared per arm, PIN-T0 throughout, and
    reseeding is never discretionary. (4) R5-1 priced semantics are
    carried at every locus where either figure carries semantic weight,
    with a full enumeration marking each occurrence; two bare-mention
    sites and pointer forms violate the design's OWN stricter
    application_rule and are recorded as findings. (5) The R5-3
    NON-RELIANCE declaration exists in both machine-readable artifacts
    and matches actual reliance at every locus; AC-1/AC-2 DORMANT is
    supported. (6) Budgets are feasible and exactly sized against the
    goal's sizing basis and the four-core/max_concurrent=3 headroom with
    serial sizing and the WAIT rule. (7) Every carried verbatim block is
    IDENTICAL to its DEC source (folded), the readings and Garwood CI
    verify against pricing-v2 and re-derive from the closed form, and the
    single 29.2 occurrence inside the verbatim RAT-5 quotation is ruled
    ACCEPTABLE CARRIAGE (mentions-not-uses, with reasoning). THREE
    FINDINGS ARE LOAD-BEARING FOR A FUTURE AUTHORIZATION DECISION: F-1
    (the JSON mirror conflicts with the governing YAML arm_table on 8 of
    17 arms - armids and seeds), F-2 (the declared seed derivation_rule
    does not reproduce the declared arm_table), F-3 (two bound-carrying
    sentences lack the priced-semantics statement under the design's own
    strict rule / strict RT3-SR-1). All three are RECORD-INTEGRITY or
    TEXTUAL defects resolvable by one superseding design record or an
    explicit Coordinator ruling BEFORE any authorization decision freezes
    this package; none touches the FP-budget arithmetic, the correctness
    of any price, the seed discipline's substance, or any scientific
