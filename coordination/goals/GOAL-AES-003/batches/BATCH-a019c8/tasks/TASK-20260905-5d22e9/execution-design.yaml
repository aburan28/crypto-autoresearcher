        schedule-clean comparisons.
      application_to_this_design: >-
        This design compares interior points only (k = 4, 8, 16) and
        therefore inherits schedule-clean attribution; the
        schedule-vs-dilution confound attaches only to comparisons against
        identity-schedule counterfactuals (k = 0 anchor comparisons and
        any PINCTRL-1 control), and this design makes none - the k = 0
