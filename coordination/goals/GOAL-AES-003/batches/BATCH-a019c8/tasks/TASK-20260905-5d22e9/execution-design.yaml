      floor_block_r5: [531101, 531102, 531103, 531104, 531105, 531106, 531107, 531108, 531109, 531110]
      null_block_r6: [531201, 531202, 531203, 531204, 531205, 531206]
      anchor_seed: 531001
      anchor_seed_note: >-
        The k = 0 ramp-zero reading (hits = 2^30, W = 3 on 100 percent of
        nontrivial trials, excess ratio 1.0) is saturated by construction
        under PIN-T0 and seed-inert; G2 checks these construction
        properties, not a comparison against a committed receipt. 531001 is
