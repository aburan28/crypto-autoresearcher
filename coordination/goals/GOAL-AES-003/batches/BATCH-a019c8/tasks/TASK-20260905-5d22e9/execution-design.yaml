      arms:
        - {arm_id: FM-A00,   position: 1,  kind: ramp_zero_anchor,        k: 0,  r: 5, seed: 531001, armid: 5, trials: 1073741824}
        - {arm_id: FM-N01,   position: 2,  kind: r6_null_object,          k: null, r: 6, seed: 531201, armid: 1, trials: 1073741824}
        - {arm_id: FM-K4-1,  position: 3,  kind: k4_primary,              k: 4,  r: 5, seed: 531101, armid: 4, trials: 1073741824}
        - {arm_id: FM-K16-1, position: 4,  kind: k16_primary,             k: 16, r: 5, seed: 531102, armid: 8, trials: 1073741824}
        - {arm_id: FM-N02,   position: 5,  kind: r6_null_object,          k: null, r: 6, seed: 531202, armid: 1, trials: 1073741824}
        - {arm_id: FM-K4-2,  position: 6,  kind: k4_primary,              k: 4,  r: 5, seed: 531103, armid: 4, trials: 1073741824}
        - {arm_id: FM-K16-2, position: 7,  kind: k16_primary,             k: 16, r: 5, seed: 531104, armid: 8, trials: 1073741824}
        - {arm_id: FM-K8-1,  position: 8,  kind: k8_secondary_report_only, k: 8,  r: 5, seed: 531109, armid: 6, trials: 1073741824}
        - {arm_id: FM-N03,   position: 9,  kind: r6_null_object,          k: null, r: 6, seed: 531203, armid: 1, trials: 1073741824}
        - {arm_id: FM-K4-3,  position: 10, kind: k4_primary,              k: 4,  r: 5, seed: 531105, armid: 4, trials: 1073741824}
        - {arm_id: FM-K16-3, position: 11, kind: k16_primary,             k: 16, r: 5, seed: 531106, armid: 8, trials: 1073741824}
        - {arm_id: FM-N04,   position: 12, kind: r6_null_object,          k: null, r: 6, seed: 531204, armid: 1, trials: 1073741824}
        - {arm_id: FM-K4-4,  position: 13, kind: k4_primary,              k: 4,  r: 5, seed: 531107, armid: 4, trials: 1073741824}
        - {arm_id: FM-K16-4, position: 14, kind: k16_primary,             k: 16, r: 5, seed: 531108, armid: 8, trials: 1073741824}
        - {arm_id: FM-K8-2,  position: 15, kind: k8_secondary_report_only, k: 8,  r: 5, seed: 531110, armid: 6, trials: 1073741824}
        - {arm_id: FM-N05,   position: 16, kind: r6_null_object,          k: null, r: 6, seed: 531205, armid: 1, trials: 1073741824}
        - {arm_id: FM-N06,   position: 17, kind: r6_null_object,          k: null, r: 6, seed: 531206, armid: 1, trials: 1073741824}
      k_of_null_arms_note: >-
        The r = 6 null-object arms are matched dead anchors: same cell,
        same instrument, same counter path, round count r = 6 (the sealed
        death round), no dilution-grid point; their k field is null by
        declaration, not by omission.

    run_order:
      committed_order: >-
        The position column of the arm table IS the committed run order,
        write-once, pre-arm. The eight primary floor arms STRICTLY
        ALTERNATE k = 4, k = 16, k = 4, k = 16, ... (positions 3, 4, 6, 7,
        10, 11, 13, 14), never blocked by point: any wall-clock or thermal
        drift then acts as a common-mode effect on both points and cancels
        in the conditional statistic, and a run-order trend becomes
        separately testable. A blocked order would confound drift with k
        and is BARRED. The anchor runs first and is analysed FIRST among
        the batch's alive readings (G2). The six null arms are distributed
        across the span (positions 2, 5, 9, 12, 16, 17) so the measured
        null samples the same span as the floor arms; the two k = 8
        report-only arms sit mid and late (positions 8, 15).
      concurrency_clause: >-
        Arms are embarrassingly parallel independent processes. If the
        executing batch runs arms concurrently, the committed position
        order is preserved as the LOGICAL ordering (arm START order follows
        position; the run-order test uses position, not wall-clock
        completion). Concurrency never changes the arm list, the seeds, or
        the cascade.
      custody_checkpoints_sr5: >-
        Build-identity and KAT re-verification checkpoints run every four
        completed arms OR every 3600 seconds of batch wall clock,
        whichever comes first: after positions 4, 8, 12, 16 on the arm
        cadence, plus the pre-arm and post-arm checks of Branch G1. Each
        checkpoint re-checks the build identity hash, the KAT pin receipts,
        and the table-freeze digest against the committed values; a
        mismatch routes to FM-GATE-FAIL with attribution bounded to the
        arms completed since the last passing checkpoint.

    reseeding_discipline:
      statement: >-
        RESEEDING IS NEVER DISCRETIONARY. The seed list above is committed
        write-once pre-arm and is the ONLY seed list of the batch. (1) No
        arm may be run at a seed not on this list; such a receipt is
        inadmissible (P5). (2) No data-dependent seed selection may enter
        at any point. (3) No arm may be re-run to replace an unwelcome
        reading; any re-invocation at an identical (seed, armid, build) is
        instrument determinism and NEVER replication (NARROW-3), and is
        recorded as such. (4) An infrastructure-failed arm (crash, timeout,
        resource_exhaustion) may be re-invoked ONLY at its identical
        committed (seed, armid, build); the re-invocation is recorded as a
        determinism re-run of the same arm, never as a new draw. (5) If a
        receipt remains inadmissible after re-invocation and its exclusion
        removes an arm from a primary point, the null block, or the anchor
        battery, the cascade HALTS (FM-INADMISSIBLE-INPUT); the exclusion
        is never silently absorbed and is never replaced by a substitute
        arm at a different seed. (6) Adding or changing any seed requires
        a NEW frozen contract and a new Coordinator decision; it can never
        happen mid-batch.

  # ==================================================================
  # BINDING CASCADE TEXT CARRIED IN THIS RECORD (R5-3 non-reliance:
  # this record is the binding-text carrier). Conjuncts and
  # NOT-licensed prohibitions are written IN FULL (RAT-3 with SR-1);
  # nothing here is a paraphrase.
  # ==================================================================
  binding_cascade_text_carried:
    transcription_source: >-
      Transcribed in this session from preregistration-skeleton.md
      Sections 2, 3, 4, 5 (Steps 5.0-5.6), with the committed numeric
      constants written in as the skeleton's Branch G4 text directs ("The
      numeric threshold at the adopted null exposure is fixed pre-arm ...
      and written into this file's adopted copy") and with the audited
      boundary conventions of TASK-20260904-f5b7fc committed explicitly.
      Under the R5-3 non-reliance declaration THIS RECORD, not the
      skeleton, is the binding carrier.

    committed_constants:
      alpha_floor_vs_floor_two_sided: 0.05
      alpha_comparator_one_sided_alpha_N: 0.001
      alpha_homogeneity_alpha_H: 0.01
      alpha_run_order_alpha_O: 0.01
      rho_star_equivalence_resolution: 1.5
      equivalence_interval: '[1/1.5, 1.5] = [0.666667, 1.5]'
      rho_1_minimum_detectable_effect: 2.0
      lambda_plan_per_2p30: 16.0
      lambda_0_analytic_comparator_per_2p30: 1.0
      c_gate_chi2_0p99_df3: 11.344867
      c_margin_chi2_0p95_df3: 7.814728
      margin_ratio_of_critical: 0.688834
      branch1_count_threshold_at_n4_lambda_op_1p0: >-
        Reject at T >= 12 per primary point (exact Poisson(4) upper tail:
        P(X >= 12) = 9.152e-4 <= 0.001 < P(X >= 11) = 2.840e-3;
        independently reproduced exact by TASK-20260903-4fdf77 and
        TASK-20260904-f5b7fc FC-4). Fail-to-reject region T <= 11.
      branch1_threshold_if_lambda_op_above_1: >-
        The RULE is pre-committed (one-sided exact Poisson test at
        alpha_N = 0.001 against mean n_k x lambda_op); if the
        comparator-setting step fixes lambda_op > 1.0, the numeric
        threshold is the first T with P(Poisson(n_k x lambda_op) >= T) <=
        0.001, computed exactly from the committed rule at the lambda_op
        value fixed BEFORE the cascade is evaluated. This is a
        deterministic function of a pre-cascade-fixed constant, not a
        post-data choice.
      g3_dead_anchor_tripwire_per_arm: 9
      g4_pooled_null_hard_threshold_at_n6: >-
        39 pooled hits over the six null arms (lambda_hat_null >= 6.5 per
        2^30, the exact Garwood lower bound of the committed single-arm
        h = 12 reading; U3/SR-4 disclosure carried: this is the third
        disclosed use of the five committed readings - a gate calibration,
        not an evidential input; it enters no branch conjunct, no test
        statistic, no equivalence criterion and no composed sentence).
      u_null_closed_form: 'U(T, n) = 0.5 * chi2_{0.95}(2T + 2) / n, per 2^30 (exact one-sided Garwood upper bound).'
      u_null_at_n6_committed_row: {T_0: 0.499, T_1: 0.791, T_2: 1.049, T_3: 1.292, T_4: 1.526}
      lambda_op_determinism_note: >-
        At n = 6, lambda_op = lambda_0 = 1.0 exactly when the pooled null
        count T <= 1 (U = 0.499 or 0.791, both <= 1.0); T >= 2 gives
        lambda_op = U(T, 6) > 1.0 and every branch statement is restated
        against the larger value.
      two_sided_convention_sr6: >-
        MINIMUM-LIKELIHOOD convention, binding: the p-value is the sum of
        all Binomial(T, 0.5) probability-mass values not exceeding the
        observed mass value, matching scipy.stats.binomtest(...,
        alternative='two-sided') with its default exact method, including
        its tie rule f(j) <= f(k)*(1+1e-7) (the binding convention per
        TASK-20260904-f5b7fc FC-3, oracle-verified to 1.665e-15 over 1240
        probe cells). The equal-tail convention is named but NOT binding;
        substituting it is a rule change requiring pre-arm re-pricing, not
        an evaluation choice.
      dispersion_boundary_conventions: >-
        D_k = sum_j (X_kj - Xbar_k)^2 / Xbar_k with Xbar_k = T_k / n_k.
        Branch H fires at D_k >= c_gate at either primary point; the
        Branch-4 margin conjunct requires D_k < c_margin STRICTLY at both
        primary points; the margin zone is c_margin <= D_k < c_gate. At
        T_k = 0 the convention D_k := 0 is committed (the audited
        enumeration convention, TASK-20260904-f5b7fc FC-2).
        TASK-20260904-f5b7fc check 2 proved ZERO boundary-cell mass at
        every decision boundary under these conventions (strict and
        non-strict forms identical), so no reading can sit on a boundary
        ambiguity.
      interval_method: >-
        Exact Clopper-Pearson 95 percent interval for pi, mapped through
        rho = (pi / (1 - pi)) x (n_16 / n_4); at n_4 = n_16 = 4 the map
        factor is 1. No normal approximation anywhere at evaluation time.

    admissibility_preconditions:
      text: |-
        An arm's receipt is ADMISSIBLE to the floor cascade if and only if
        ALL of the following hold. These are conjuncts, not hygiene; the
        rule's correctness on known-false objects rests on them.
        P1 the arm's round count is r = 5;
        P2 the arm's k is in the pre-arm domain (primary k in {4, 16}, or
        secondary k = 8, report-only);
        P3 the arm's exposure is exactly 2^30 trials;
        P4 the receipt is UNSATURATED, i.e. hit_overflow == 0 and
        logged_detail_records == hits;
        P5 the arm's (seed, armid) pair is on the pre-arm committed list
        (the arm_table of this record).
        FM-INADMISSIBLE-INPUT: if any receipt offered to the floor cascade
        fails any of P1-P5, that receipt is excluded, the exclusion is
        recorded with the failing precondition named, and if the exclusion
        removes any arm from a primary point the cascade HALTS with no
        floor sentence composed. An exclusion is never silently absorbed
        and is never replaced by a substitute arm run after the fact.
      this_designs_extension_of_the_halt_rule_committed_pre_arm: >-
        Committed pre-arm, conservatively: an exclusion that removes an arm
        from the NULL block or prevents G2 evaluation of the anchor
        likewise HALTS the batch with no floor sentence, because the G4
        threshold (39) and the U_null row are committed at n = 6 and the
        comparator-setting step cannot run without its full block; an
        exclusion of a k = 8 report-only arm is recorded and does NOT halt
        (no conjunct reads it).

    gates_evaluated_in_fixed_order:
      branch_G1_FM_GATE_FAIL:
        text: |-
          Fires if ANY of the following holds on ANY analysis-bearing
          receipt of the batch: counter INCONSISTENCY as defined verbatim
          in AMEND-1, evaluated in the saturation-aware form
          overflow == hits − logged_detail_records where
          logged_detail_records == min(hits, threads × HIT_LOG_CAP); or the
          build-identity direct hash does not match the frozen source and
          binary; or the KAT pin receipts are not byte-identical to the
          committed lineage KAT receipts; or the pre-arm, periodic, or
          post-arm table-freeze re-verification against the committed
          R3_table_freeze.json reports any mismatch; or the post-arm source
          and binary diff against the snapshot-bound build is non-empty; or
          any periodic custody checkpoint (every four completed arms or
          every 3600 seconds of batch wall clock, whichever comes first)
          fails; or the pre-arm algebraic stream-distinctness check finds
          any two committed (seed, armid, thread) triples deriving the same
          stream seed (H2 hard gate).
          CONSEQUENCE: invalid_measurement, HALT, repair, never evidence
          about the floor (AGENTS rule 5). A periodic-checkpoint mismatch
          is attributed to the arms completed since the last passing
          checkpoint. A budget or tooling failure is resource_exhaustion or
          infrastructure failure and is likewise never a finding about the
          floor.
      branch_G2_FM_ANCHOR_FAIL:
        text: |-
          Fires if the k = 0 ramp-zero anchor arm does not read
          hits = 2^30 exactly, or its excess ratio is not 1.0 exactly, or
          W = 3 does not hold on 100 percent of nontrivial trials, or its
          counter identities are not exact under the saturation-aware form
          (its receipt is saturated by construction and that saturation is
          legal under AMEND-1).
          CONSEQUENCE: invalid_measurement, HALT. This arm is the AMEND-1
          proves-too-much control and it is analysed FIRST among the
          batch's alive readings.
      branch_G3_FM_DEAD_ANCHOR_FAIL:
        text: |-
          Fires if any r = 6 matched dead-anchor arm reads at or above the
          committed lineage tripwire of 9 hits.
          CONSEQUENCE: a boundary falsifier of the sealed verdict; HALT and
          escalate to claim-changing review (AGENTS rule 12), never a floor
          sentence.
      branch_G4_FM_NULL_CONTROL_FAIL:
        text: |-
          Fires if the POOLED count over the null-object arms reaches the
          preregistered hard threshold of 39 at n = 6 (lambda_hat_null >=
          6.5 per 2^30, the exact Garwood lower bound of the committed
          single-arm k = 16 reading; SR-4/U3 disclosure carried).
          CONSEQUENCE: the measured null is no longer separable from floor
          magnitude; HALT, instrument review, and NO floor sentence of any
          kind may be composed.
        evaluation_point_committed: >-
          Evaluated when the null block completes (position 17), and fires
          IMMEDIATELY at any earlier point at which the running pooled
          count over COMPLETED null arms already reaches 39: the pooled
          count is monotone in completed arms, so a partial sum >= 39
          forces the completed value >= 39; the early firing is
          deterministic and pre-committed, not discretionary, and the
          verdict is identical under both readings.

    comparator_setting_step_not_a_branch:
      text: |-
        After G1-G4 pass and before the cascade is evaluated:
        1. Compute U_null, the EXACT one-sided 95 percent Garwood upper
        bound on the pooled measured null rate from the r = 6 null-object
        arms, per 2^30, by the committed closed form.
        2. Set the operative comparator lambda_op = max(lambda_0, U_null),
        where lambda_0 = 1.0 per 2^30 is the campaign's analytic comparator
        under the frozen excess_E convention.
        3. Every branch statement is evaluated against lambda_op and every
        composed sentence DISCLOSES both lambda_0 and U_null and states
        which one was operative.
        This step is what makes the measured null object a control rather
        than a decoration: if the instrument's own null is above the
        analytic comparator, the whole cascade is restated against the
        larger value and the resulting sentences are weaker. Both outcomes
        are informative; neither is a failure.

    step_5_0_branch_H_FM_OVERDISPERSED:
      conjunct_in_full: |-
        Fires if, at EITHER primary point k in {4, 16}, the Poisson
        dispersion index of that point's per-arm counts,
        D_k = sum_j (X_kj − Xbar_k)^2 / Xbar_k, is at or above the
        chi-squared critical value c_gate = chi2_{0.99}(n_k − 1) =
        11.344867 on n_k − 1 = 3 degrees of freedom (alpha_H = 0.01),
        under the committed boundary conventions.
      consequence_and_license_in_full: |-
        CONSEQUENCE: between-arm heterogeneity at that point exceeds the
        Poisson model, so exposure additivity (heuristic H3) fails and the
        arms may not be pooled. NO pooled magnitude sentence of any kind is
        composed. The per-arm tuples are recorded individually, never
        smoothed and never pooled. This is a DETERMINATE FINDING about the
        instrument's seed behaviour at floor magnitude, not a halt of the
        batch, and it names its successors: a larger n to estimate the
        heterogeneity, and a re-priced design that carries the inflation
        explicitly.
        LICENSED BY THIS BRANCH: that the per-arm floor counts at the named
        point are over-dispersed relative to Poisson at alpha_H, with the
        realized dispersion index and its degrees of freedom stated.
        NOT LICENSED BY THIS BRANCH: any magnitude sentence; any plateau,
        decay, extinction, completion or comparator sentence; any statement
        that the floor is or is not constant; any statement about k = 8,
        k = 12 or any point outside the domain.

    step_5_1_branch_1_FM_COMPARATOR_INDISTINGUISHABLE:
      conjunct_in_full: |-
        Fires if BOTH of the following hold: the pooled count at k = 4
        fails to reject the hypothesis lambda_4 = lambda_op under a
        one-sided exact Poisson test against mean n_4 × lambda_op at
        alpha_N = 0.001; AND the pooled count at k = 16 fails to reject the
        hypothesis lambda_16 = lambda_op under a one-sided exact Poisson
        test against mean n_16 × lambda_op at alpha_N = 0.001. At
        lambda_op = 1.0 this is exactly T_4 <= 11 AND T_16 <= 11 (committed
        threshold derivation carried).
      consequence_license_and_prohibitions_in_full: |-
        CONSEQUENCE AND ROUTING: the batch records that at the realized
        pooled exposure neither primary floor point is distinguishable from
        the operative comparator. Because this outcome would contradict
        five committed readings that together carry 81 hits where the
        comparator predicts about 5, it ALSO routes to instrument review
        before any interpretive sentence is composed.
        LICENSED BY THIS BRANCH: exactly one sentence - "at pooled exposure
        n × 2^30 per point, cell (1,1), r = 5, PIN-T0, neither k = 4 nor
        k = 16 is distinguishable from the operative comparator lambda_op
        at alpha_N" - together with the instrument-review routing and the
        disclosed contradiction with the committed readings.
        NOT LICENSED BY THIS BRANCH: ANY extinction sentence.
        "Indistinguishable from the comparator at this exposure" is a
        statement about resolution, not about absence, and NARROW-1 bars
        the extinction reading in this branch as in every other. Also not
        licensed: any completion sentence, any cliff-at-4 reading, any
        statement that the decay finished, any statement about k = 8,
        k = 12 or any untested k, and any re-composition of the immutable
        SH2-MONOTONE-DECAY verdict.

    step_5_2_branch_2_FM_DECAY_CONTINUES:
      conjunct_in_full: |-
        Fires if Branch 1 did not fire AND the exact two-sided conditional
        binomial test of pi = 0.5 on the pair (T_4, T_16), conditional on
        T = T_4 + T_16 and evaluated at equal exposures n_4 = n_16, using
        the binding minimum-likelihood convention, rejects at
        alpha = 0.05, AND the realized pi_hat = T_4 / T is strictly greater
        than 0.5.
      consequence_license_and_prohibitions_in_full: |-
        CONSEQUENCE AND ROUTING: the residual floor is still decaying
        between k = 4 and k = 16 at count level. The estimated rate ratio
        rho_hat and its exact Clopper-Pearson-mapped 95 percent interval
        are recorded.
        LICENSED BY THIS BRANCH: that over the two tested points k = 4 and
        k = 16, in cell (1,1) at r = 5 under PIN-T0 at the realized pooled
        exposure, the floor rate at k = 4 exceeds the floor rate at k = 16
        at alpha = 0.05, with the ratio and its interval named; and that
        the floor is alive at both points (NARROW-1 carried).
        NOT LICENSED BY THIS BRANCH: any statement about the SHAPE of the
        decay between the two points (no intermediate point is in the
        primary domain); any statement about k = 8 at count level; any
        statement about k = 12, which is frozen-never-measured; any
        extrapolation to k > 16 or to any untested k; any extinction,
        completion or cliff-at-4 sentence; any rehabilitation of the
        broken-authority multiplicative prior; any dilution-only
        attribution (SCOPE-1 binds); any whole-curve sentence.

    step_5_3_branch_3_FM_INVERTED:
      conjunct_in_full: |-
        Fires if Branch 1 did not fire AND the exact two-sided conditional
        binomial test of pi = 0.5 on the pair (T_4, T_16) rejects at
        alpha = 0.05, AND the realized pi_hat is strictly less than 0.5.
      consequence_license_and_prohibitions_in_full: |-
        CONSEQUENCE AND ROUTING: a determinate rate INVERSION at floor
        magnitude: the k = 16 floor rate exceeds the k = 4 floor rate. This
        is a count-level non-monotone finding scoped to the two tested
        points. The committed band-level verdict SH2-MONOTONE-DECAY is a
        BAND-trajectory statement and is untouched and unre-composed by
        this branch; a count-level inversion inside the RESIDUAL band is
        not a band rise.
        LICENSED BY THIS BRANCH: the inversion at the two tested points
        with its ratio and interval, and the explicit statement that the
        band verdict is unaffected.
        NOT LICENSED BY THIS BRANCH: any re-composition of
        SH2-MONOTONE-DECAY; any claim of a band rise; any statement beyond
        the two tested points; and all of the exclusions listed under
        Branch 2.

    step_5_4_branch_4_FM_PLATEAU_CONSISTENT:
      conjunct_in_full: |-
        Fires if ALL of the following hold: Branch 1 did not fire; AND the
        exact two-sided conditional binomial test of pi = 0.5 on the pair
        (T_4, T_16), using the binding minimum-likelihood convention, does
        NOT reject at alpha = 0.05; AND the exact 95 percent interval for
        the rate ratio rho = lambda_4 / lambda_16, obtained by mapping the
        exact Clopper-Pearson interval for pi through
        rho = (pi / (1 − pi)) × (n_16 / n_4), is entirely CONTAINED in the
        preregistered equivalence interval [1 / rho*, rho*] with
        rho* = 1.5; AND, at BOTH primary points k in {4, 16}, the Poisson
        dispersion index D_k = sum_j (X_kj − Xbar_k)^2 / Xbar_k is strictly
        below the margin threshold c_margin = chi2_{0.95}(n_k − 1) =
        7.814728, where the Branch-H critical value is
        c_gate = chi2_{0.99}(n_k − 1) = 11.344867. This final conjunct is
        the SR-3 remedy (option a): it requires AFFIRMATIVE homogeneity
        evidence, not mere failure to reject Branch H.
        THE CONTAINMENT CONJUNCT IS NOT OPTIONAL AND MAY NOT BE DROPPED. A
        test that merely fails to reject licenses NOTHING about a plateau;
        absence of evidence for decay is not evidence for constancy.
        Without the containment conjunct this branch would convert an
        underpowered result into a positive claim, which is the precise
        failure NARROW-1 and NARROW-4 bar.
        THE SR-3 MARGIN CONJUNCT IS NOT OPTIONAL AND MAY NOT BE DROPPED OR
        MOVED POST-DATA. The threshold is a named quantile of the
        dispersion index's null reference law and is fixed pre-arm; it
        consults no realized reading and no red-team object.
      consequence_license_and_prohibitions_in_full: |-
        LICENSED BY THIS BRANCH: exactly one sentence - "over the two
        tested points k = 4 and k = 16, in cell (1,1) at r = 5 under PIN-T0
        at the realized pooled exposure, the floor rate ratio is confined
        to [1/1.5, 1.5]; the floor is PLATEAU-CONSISTENT AT RESOLUTION
        1.5" - together with the realized interval, the operative
        comparator, the floor-is-alive statement (NARROW-1), and the SR-2
        disclosed plateau-heterogeneity false-positive bound. Every
        composed sentence under this branch MUST carry that bound as a
        disclosure, with the R5-1 priced-semantics scope statement inline.
        NOT LICENSED BY THIS BRANCH, ITEMISED BECAUSE THIS IS WHERE THE
        BRANCH IS MOST LIKELY TO BE OVER-READ:
        - NOT "the floor is constant". The claim is confinement of a ratio
        to a stated interval at a stated resolution, nothing more.
        - NOT "the decay has ended", NOT "the decay completes", NOT "the
        excess has reached its floor" - none of these is decidable from two
        points at resolution 1.5.
        - NOT any extinction sentence (NARROW-1). A plateau at a rate far
        above the operative comparator is the OPPOSITE of extinction.
        - NOT a cliff-at-4 reading, NOT a sub-sub-interval reading inside
        (3,4] (NARROW-4).
        - NOT a statement about k = 8 at count level (NARROW-5 discipline),
        NOT any statement about k = 12 (frozen-never-measured), NOT any
        statement about untested k.
        - NOT a mechanism. A constant excess that does not decay as the
        parameter meant to destroy it increases is the canonical signature
        of a MEASUREMENT ARTIFACT (inventor-protocol section 3, controls
        before belief). If this branch fires, the leading interpretation on
        the record is artifact-first, and the batch's own measured null
        object is the control that has to be read beside it. Any structural
        or mechanistic reading of a plateau requires a further control - at
        minimum the 256-byte random-bijection null at r = 5 - which this
        design does NOT run.
        - NOT "the branch is safe for all phi". The SR-2 bound is a
        disclosed residual false-positive risk under seed heterogeneity in
        the priced phi range; it is a bound, not a removal, and no sentence
        may present it as eliminating the heterogeneity risk or as making
        the plateau sentence safe beyond the bound's stated conditions.

    step_5_5_branch_5_FM_UNRESOLVED:
      conjunct_in_full: |-
        Fires if Branch 1 did not fire AND the exact two-sided conditional
        binomial test of pi = 0.5 on the pair (T_4, T_16), using the
        binding minimum-likelihood convention, does NOT reject at
        alpha = 0.05, AND EITHER the exact 95 percent interval for rho is
        NOT entirely contained in [1 / 1.5, 1.5], OR the SR-3 margin
        conjunct of Step 5.4 fails at either primary point, i.e.
        c_margin <= D_k < c_gate at that point while Branch H does not
        fire. Such margin-zone readings lack affirmative homogeneity
        evidence and are demoted from a plateau sentence to this branch.
      consequence_license_and_prohibitions_in_full: |-
        CONSEQUENCE AND ROUTING: the realized exposure did not decide the
        question. This is a complete and reportable outcome, not a failure:
        the realized ratio interval is recorded as the measured obstruction,
        and the successor exposure is re-priced from it.
        LICENSED BY THIS BRANCH: the realized rate-ratio interval at the
        realized pooled exposure, recorded as a measured obstruction with
        its scope; and the re-priced exposure a successor would need for a
        named resolution.
        NOT LICENSED BY THIS BRANCH: anything about plateau, decay,
        completion, extinction or comparator equivalence. This branch's
        whole content is "not decided at this exposure".

    step_5_6_exhaustiveness:
      text: |-
        Branches 1 through 5 partition every admissible outcome: Branch 1
        covers the comparator-indistinguishable case; conditional on Branch
        1 not firing, the exact test either rejects (Branches 2 and 3,
        split by the direction of pi_hat, which cannot be exactly 0.5 when
        the test rejects) or does not reject (Branches 4 and 5, split by
        the containment criterion and the SR-3 margin criterion: Branch 4
        requires interval containment AND D_k < c_margin at both points;
        Branch 5 receives every remaining non-rejecting reading, including
        interval non-containment and margin-zone readings with
        c_margin <= D_k < c_gate). Branch H receives every reading with
        D_k >= c_gate at either point before any of Branches 1 through 5 is
        evaluated. No admissible reading lands in two branches and none
        lands in none. Branch H and the gates precede all of them and are
        themselves ordered.

    mandatory_realized_power_restatement:
      text: |-
        Whatever branch fires, the composed record MUST restate the
        achieved discriminating power recomputed at the REALIZED event
        total, beside the power priced pre-arm (written cascade order at
        the MDE rho = 2: FM-DECAY-CONTINUES 0.952538 with 0.018883 to
        FM-OVERDISPERSED - PRICED SEMANTICS: 0.018883 is the
        written-cascade-order FM-OVERDISPERSED routing price of the decay
        branch, priced on OBJ-4, the still-decaying generator at the
        preregistered MDE rho = 2 at the committed constants, a
        design-time exact enumeration independently re-derived to every
        reported digit, NOT a theorem for all decay alternatives). If the
        realized total falls materially below the priced total, the branch
        outcome is reported at the realized power and the shortfall is
        disclosed. Priced power is a design commitment; it is never
        reported as though it had been delivered.

    proves_too_much_paper_routing_pre_arm:
      obligation: >-
        Before any arm runs, the executing batch's stage-0 producer task
        re-runs the six paper controls (skeleton Section 6 objects) through
        the cascade text carried in THIS record and records the routing
        pre-arm, plus the J-D2-inherited known-false objects: the
        homogeneous-null OBJ-4 and the analytic-null-mean heterogeneous
        object OBJ-5B. The priced routings this design commits against
        (all independently re-derived at the gate round): OBJ-4 routes
        FM-DECAY-CONTINUES 0.952538, FM-OVERDISPERSED 0.018883,
        FM-UNRESOLVED 0.028486, FM-PLATEAU-CONSISTENT 0.000093 (priced
        residual, dominated by the committed per-arm 0.171940 budget -
        PRICED SEMANTICS: 0.171940 is certified over the OBJ-5A
        calibration family and the probed configurations, NOT as a theorem
        for all equal-mean configurations, RT2-F6); OBJ-5B routes
        FM-COMPARATOR-INDISTINGUISHABLE 0.989349 falling to 0.884236 and
        FM-OVERDISPERSED 0.008843 rising to 0.115764 as phi runs
        1.0 -> 2.0 at the both-points reading, with
        FM-PLATEAU-CONSISTENT 0.000000 at every phi; OBJ-5A's residual
        false-plateau mass is the disclosed bound itself (0.171940 worst
        case, residual range exactly [0.114124, 0.171940] - same PRICED
        SEMANTICS as above). NO known-false object receives
        FM-PLATEAU-CONSISTENT except through the disclosed, budgeted
        OBJ-5A/OBJ-4 residual, and every such sentence carries the bound.

  # ==================================================================
  # PER-ARM FALSE-POSITIVE BUDGET (R5-2 / RT3-SR-2), COMMITTED
  # PRE-ARM, PRICED PER ARM - NOT PER FAMILY
  # ==================================================================
  fp_budget_r5_2:
    enumeration_of_plateau_composing_arms: >-
      EXACTLY EIGHT arms could compose a plateau-consistent sentence: the
      four k = 4 primary arms (FM-K4-1..4) and the four k = 16 primary arms
      (FM-K16-1..4). Derivation: an FM-PLATEAU-CONSISTENT sentence is
      composed only by Branch 4, which reads only (T_4, T_16) and the
      per-arm dispersion vectors at the two primary points; every other arm
      is excluded by construction - the anchor and the null arms are
      inadmissible to the cascade (P1/P2; OBJ-1/OBJ-2 routing) and enter
      only the gates and the comparator-setting step, and the k = 8 arms
      are declared report-only with no conjunct reading them (NARROW-5).
      The same eight arms are exactly the arms that could compose an
      FM-DECAY-CONTINUES, FM-INVERTED, FM-COMPARATOR-INDISTINGUISHABLE or
      FM-UNRESOLVED sentence, so the decay-branch price attaches to the
      same enumeration.
    per_arm_commitment:
      plateau_price_per_arm: 0.171940
      decay_branch_fm_overdispersed_price_per_arm: 0.018883
      total_per_arm: 0.190823
      priced_arms: 8
      total_commitment_all_priced_arms: 1.526584
      arithmetic: >-
        8 arms x 0.171940 = 1.375520 (plateau); 8 arms x 0.018883 =
        0.151064 (decay-branch FM-OVERDISPERSED); total 1.375520 +
        0.151064 = 1.526584. Per arm 0.171940 + 0.018883 = 0.190823.
    per_arm_not_per_family_attestation: >-
      PER ARM, NOT PER FAMILY, as R5-2 and the DEC-20260905-1ea7a0
      Coordinator prior point (1) require: every one of the eight
      plateau-composing arms carries the FULL range-wide worst-case price
      0.171940 and the full decay-branch price 0.018883. This design does
      NOT divide the bound across the family (which would understate the
      per-arm worst case at 0.021493 per arm) and does NOT charge the
      family once. The named arithmetic error the Coordinator prior would
      look for first - budgeting plateau-consistent sentences per family
      rather than per arm - is explicitly not committed here.
    priced_semantics_of_the_budget_bound_carrying: >-
      PRICED SEMANTICS (R5-1), carried inline because this block is
      bound-carrying: 0.171940 is certified over the OBJ-5A calibration
      family and the probed configurations, NOT as a theorem for all
      equal-mean configurations - RT2-F6 showed the class-wide extension
      ARGUMENT fails on a one-outlier fixed-effect equal-mean
      configuration even though its conclusion survives numerically (max
      probed false-positive rate 0.1595, well under 0.171940); the worst
      case is a supremum attained at phi = 1.0, the degenerate homogeneous
      limit where the Branch-4 firing is a true positive under its own
      null, and over strictly heterogeneous phi > 1 it is approached as
      phi -> 1+ (largest swept value 0.1718971 at phi = 1.001); the
      residual range is exactly [0.114124, 0.171940]; the plateau mass is
      convention-invariant. PRICED SEMANTICS of the companion price:
      0.018883 is the written-cascade-order FM-OVERDISPERSED routing price
      of the decay branch priced on OBJ-4 at the preregistered MDE
      rho = 2 at the committed constants (lambda_plan = 16, n = 4 per
      point, 2^30 per arm), a design-time exact enumeration independently
      re-derived to every reported digit, NOT a theorem for all decay
      alternatives.
    semantics_of_the_sum: >-
      The total 1.526584 is an ACCOUNTING SUM of per-arm budget
      commitments under R5-2's per-arm discipline; it is NOT the
      probability of any composite event and no sentence may quote it as
      one. The sentence-level price of any composed
      FM-PLATEAU-CONSISTENT sentence remains 0.171940 with the R5-1
      priced-semantics statement above; the sentence-level price attached
      to any composed FM-DECAY-CONTINUES sentence is the 0.018883
      decay-branch routing price with its companion statement. A budget
      sum exceeding 1 is the expected shape of a per-arm worst-case
      commitment ledger over eight arms and is the point of the
      discipline: no arm hides behind a family-averaged price.
    non_priced_arms:
      count: 9
      arms: [FM-A00, FM-N01, FM-N02, FM-N03, FM-N04, FM-N05, FM-N06, FM-K8-1, FM-K8-2]
      per_arm_fp_budget: 0.0
      reason: >-
        These arms compose no floor sentence in any branch: the anchor is a
        gate control inadmissible to the cascade; the null arms enter only
        the gates (G3 tripwire 9 per arm, G4 pooled threshold 39) and the
        comparator-setting step; the k = 8 arms are report-only and carry
        no count verdict in any branch (NARROW-5). Their committed prices
        are GATE thresholds, not false-positive budgets, and are carried in
        committed_constants.
    informational_sub_price_disclosed: >-
      Under the decay alternative (OBJ-4), the priced FM-PLATEAU-CONSISTENT
      mass is 0.000093 (written order); it is dominated by the committed
      per-arm plateau price 0.171940 (PRICED SEMANTICS as above: certified
      over the OBJ-5A calibration family and the probed configurations,
      NOT a theorem for all equal-mean configurations, RT2-F6) and is
      disclosed here for completeness only; it adds no separate budget
      line.

  # ==================================================================
  # STOPPING RULES, BOUND EXPLICITLY TO THE CASCADE'S BRANCH VERDICTS
  # ==================================================================
  stopping_rules:
    governing_principle: >-
      NO DISCRETIONARY STOPPING, IN EITHER DIRECTION. The operator holds no
      authority to stop the batch, skip an arm, reorder an arm, or compose
      any verdict after any reading, favorable or unfavorable. The floor
      cascade (Branch H and Branches 1-5) is evaluated EXACTLY ONCE, after
      the last committed arm (position 17) completes, in the fixed written
      order (Branch H first, then Branches 1-5), on the complete data. No
      interim floor-branch evaluation exists at any point in the batch; no
      floor reading is examined mid-batch for verdict purposes. Because no
      interim statistical evaluation exists, optional stopping - the bias
      NARROW-2 exists to forbid - is structurally impossible, not merely
      prohibited. The only mid-batch decision points are the FIXED gate
      battery (per-receipt AMEND-1 identity, G2 anchor, G3 per-null-arm
      tripwire, G4 pooled null threshold, periodic custody checkpoints),
      whose triggers are admissibility and custody, not statistics about
      the floor: a gate halt can never bias a floor verdict because under a
      gate halt NO floor verdict is composed at all.
    verdicts_that_end_the_batch_early:
      - verdict: FM-GATE-FAIL (Branch G1)
        trigger_point: pre-arm battery, any receipt completion, any periodic checkpoint, post-arm battery
        effect: >-
          ENDS THE BATCH EARLY. Remaining arms do not run. Record
          invalid_measurement (or resource_exhaustion / infrastructure
          failure where that is the cause), preserve the defective outputs,
          leave receipts untouched, name the failing gate, bound
          checkpoint attribution to the arms completed since the last
          passing checkpoint. NEVER evidence about the floor (AGENTS rules
          3 and 5); no floor sentence of any kind.
      - verdict: FM-ANCHOR-FAIL (Branch G2)
        trigger_point: analysis of the position-1 anchor receipt, first among alive readings
        effect: ENDS THE BATCH EARLY. invalid_measurement, HALT; no floor sentence.
      - verdict: FM-DEAD-ANCHOR-FAIL (Branch G3)
        trigger_point: completion of ANY r = 6 null arm reading >= 9 hits
        effect: >-
          ENDS THE BATCH EARLY. A boundary falsifier of the sealed verdict:
          HALT and escalate to claim-changing review (AGENTS rule 12);
          never a floor sentence.
      - verdict: FM-NULL-CONTROL-FAIL (Branch G4)
        trigger_point: null-block completion (position 17), or immediately when the running pooled count over completed null arms reaches 39 (monotone, deterministic, pre-committed)
        effect: ENDS THE BATCH EARLY. HALT, instrument review; NO floor sentence of any kind may be composed.
      - verdict: FM-INADMISSIBLE-INPUT (Section 2)
        trigger_point: any receipt offered to the cascade failing P1-P5
        effect: >-
          ENDS THE BATCH EARLY whenever the exclusion removes an arm from a
          primary point, from the null block, or prevents G2 evaluation of
          the anchor; the exclusion is recorded with the failing
          precondition named, never silently absorbed, never replaced by a
          substitute arm. An exclusion of a k = 8 report-only arm is
          recorded and does NOT end the batch (no conjunct reads it).
      - verdict: resource_exhaustion / infrastructure failure (budget, timeout, crash)
        trigger_point: any time
        effect: >-
          ENDS THE BATCH (or the affected arm under the reseeding
          discipline). Recorded as resource_exhaustion or infrastructure
          failure; NEVER negative mathematical evidence about the floor
          (AGENTS rule 3); no verdict is composed from partial primary
          data; dropped work is named as scope, never as an answer.
    verdicts_that_require_completion:
      - verdict: FM-OVERDISPERSED (Branch H)
        requires: ALL 17 committed arms run to completion.
        effect: >-
          Branch H is NOT a batch halt (binding text carried above: "a
          DETERMINATE FINDING ..., not a halt of the batch"). It is
          evaluated only in the single post-completion cascade evaluation;
          if it fires, the batch composes the FM-OVERDISPERSED sentence
          only, records every per-arm tuple individually (never smoothed,
          never pooled), and composes NO pooled magnitude sentence. The
          k = 8 report-only data, the measured null, the operative
          comparator, and the first heterogeneity estimate are all still
          produced and recorded - which is precisely why completion, not
          early stop, is bound to this verdict.
      - verdict: FM-COMPARATOR-INDISTINGUISHABLE (Branch 1)
        requires: ALL 17 committed arms run to completion; single post-completion evaluation.
      - verdict: FM-DECAY-CONTINUES (Branch 2)
        requires: ALL 17 committed arms run to completion; single post-completion evaluation.
      - verdict: FM-INVERTED (Branch 3)
        requires: ALL 17 committed arms run to completion; single post-completion evaluation.
      - verdict: FM-PLATEAU-CONSISTENT (Branch 4)
        requires: >-
          ALL 17 committed arms run to completion; single post-completion
          evaluation. A FAVORABLE PLATEAU READING IS NEVER A STOPPING
          POINT: there is no interim reading to stop after, and the
          composed sentence arrives only with the realized-power
          restatement, the run-order disclosure, the operative-comparator
          disclosure and the full 0.171940 bound disclosure (PRICED
          SEMANTICS: 0.171940 is certified over the OBJ-5A calibration
          family and the probed configurations, NOT as a theorem for all
          equal-mean configurations, RT2-F6; supremum attained at the
          phi = 1.0 degenerate limit; residual range exactly [0.114124,
          0.171940]; 'bounded' is not 'small' or 'removed').
      - verdict: FM-UNRESOLVED (Branch 5, including every margin-zone demotion)
        requires: ALL 17 committed arms run to completion; single post-completion evaluation.
    no_rearm_rule: >-
      No arm may be re-run to replace an unwelcome reading; any
      re-invocation at an identical (seed, armid, build) is instrument
      determinism and NEVER replication (NARROW-3). The batch composes at
      most the sentences its fired branch licenses, and no others.

  # ==================================================================
  # BUDGETS AND MACHINE HEADROOM
  # ==================================================================
  budgets:
    sizing_basis_citation: >-
      Sized against GOAL-AES-003 campaign_budget.sizing_basis (bottom-up
      from GOAL-AES-001's measured per-role actuals, no cushion, no
      rounding slack; compute reported SEPARATELY from authoring per the
      C4 discipline) and the candidate's priced cost_basis
      (pooled-exposure-pricing-v2.json design_ladder.cost_basis, cited as
      derivation source under the R5-3 non-reliance declaration; every
      figure committed here as a constant of this design).
    compute_component:
      binding_baseline_seconds_per_2p30_four_thread_arm: 1620
      binding_baseline_source: about 27 minutes per 2^30 four-thread arm, the lineage cost basis, binding per IDEA-20260903-8f26ac.
      measured_campaign_rate_seconds_per_arm: 155
      measured_rate_status: OPTIMISTIC-RELATIVE and NON-BINDING (2^30 arms measured at 94-155 s on campaign hardware); every cap is set on the binding baseline.
      total_compute_seconds_binding: 27540
      total_compute_seconds_measured_estimate: 2635
      declared_compute_cap_seconds: 29500
      cap_contents: 17 arms x 1620 s = 27540 s plus the SR-5 periodic-checkpoint overhead (short KAT receipts every four completed arms or 3600 s), disclosed small and non-binding per arm count.
      no_gate0x_charge: >-
        No Gate-0x extended rebuild is charged: every point used is already
        on the frozen build's whitelist and in the committed R3 freeze
        (about 54 minutes cheaper than the predecessor batch's extension
        stage).
    authoring_component:
      total_authoring_seconds: 11700
      breakdown: 4 producer tasks (6400) + 4 snapshots (2000) + validation 1400 + red team 1000 + ledger archive 900, per the campaign per-role lines.
      c4_note: reported separately from compute, never folded in, per the goal's C4 discipline.
    memory:
      declared_memory_gb: 4
      basis: >-
        The campaign's standing figure. O(1) per trial: table-driven direct
        evaluation, fixed histograms, per-hit detail capped at 256 records
        per thread (1024 per arm). Pooling adds no per-trial storage - it
        sums counters across independent processes. The declared figure is
        not approached.
    machine_headroom_assumption: >-
      STATED EXPLICITLY: the host is the campaign machine (four cores)
      shared by three active AES campaigns under a max_concurrent = 3 task
      cap ACROSS ALL THREE (goal head, relationship_to_GOAL_AES_002); each
      arm is one four-thread process. The binding wall-clock sizing
      therefore assumes arms run ONE AT A TIME (serial): 27540 s binding
      compute, 29500 s declared cap, authoring 11700 s charged separately
      on the per-role lines. If the executing batch is granted concurrent
      arm slots within the host cap, wall clock divides by the number of
      slots and the committed position order is preserved as the logical
      ordering; the budget caps do not change with scheduling, and
      honouring the cross-campaign cap takes precedence - if honouring it
      would require running degraded, the batch WAITS (goal head rule).
      Under the non-binding measured campaign rate the same 17 arms would
      take about 2635 s serial; the caps are set on the binding baseline
      regardless.
    budget_discipline: >-
      Declared budgets are stop conditions, not estimates (C2): the
      executing batch stamps start_utc, declared_wall_clock_seconds and a
      computed binding_stop_utc, stamps every section boundary, and HALTS
      at binding_stop_utc with halted_on_budget recorded truthfully and
      the dropped work NAMED. A halt is infrastructure signal, never a
      negative mathematical result; dropped work is scope, never an
      answer.

  # ==================================================================
  # CONTROLS, DISCLOSURES, REPORT-ONLY SURFACES
  # ==================================================================
  controls_and_disclosures:
    run_order_test: >-
      Spearman rank correlation between per-arm count and run position
      within each primary point, evaluated at alpha_O = 0.01 and RECORDED
      IN EVERY BRANCH as a disclosure, never as a gate. A significant
      trend does not by itself halt the cascade - the interleaving makes
      drift common-mode and cancels it in the conditional statistic - but
      it is disclosed with the composed sentence. A drift that acts
      differently on the two points is not common-mode, would not cancel,
      and is recorded as an uncontrolled residual nothing in this design
      can detect.
    stream_distinctness_pre_arm: >-
      Pre-arm, zero compute, HARD GATE: enumerate the derived per-thread
      stream seeds over every (seed, armid, thread) triple of the
      committed arm table and verify pairwise distinctness; any collision
      is FM-GATE-FAIL before any arm runs (H2).
    controls_carried: >-
      C-NULL-MEASURED (six-arm pooled r = 6 null with the
      operative-comparator rule that lets the measurement override the
      constant); C-RAMP-ZERO (k = 0 anchor, saturated by construction, the
      AMEND-1 proves-too-much control - it must PASS, showing the rescoped
      gate is not vacuous); C-DISPERSION (per-arm count vector and
      dispersion index as the control for the pooling operation itself,
      evaluated before any pooled sentence, with its weak small-n power
      honestly disclosed); C-INTERLEAVE (committed interleaved order plus
      run-order test, zero marginal cost); C-STREAM-DISTINCT (above);
      C-PAPER-ROUTING (pre-arm paper routing of the known-false objects
      through the cascade text of THIS record).
    control_gap_disclosed: >-
      C-RANDOM-BIJECTION (the 256-byte random-bijection null at r = 5, the
      ideal null of the floor's own shape, RANK 7) is NOT RUN and NOT
      BUDGETED: it needs its own build path and its own Coordinator
      decision. This remains the design's largest control gap and is the
      specific reason a fired plateau branch is read artifact-first and
      licenses no mechanism.
    report_only_surfaces: >-
      (1) k = 8 per-arm counts: recorded individually, NO count verdict in
      any branch (NARROW-5 discipline extended prospectively); after the
      branch fires, a declared REPORT-ONLY consistency comparison of the
      new pooled per-point rates against the five committed readings' exact
      intervals (U2) - it can never move the branch; a gross inconsistency
      is an instrument-review trigger, not a floor sentence. (2) The floor
      W-tail above 1 (O5): counter-derived, AMEND-1-admissible, rides free
      on the receipts, DECLARED REPORT-ONLY - no conjunct consumes it, too
      sparse at this exposure to carry a verdict; named as the successor
      lens. (3) The pooled intensity lambda_k itself: report-only beside
      the ratio (the ratio cannot say whether the floor is high or low).
    heuristic_validation_preregistered: >-
      H1 (Poisson counting model) validated by the Step 5.0 dispersion test
      at each primary point plus the max-per-arm-count tail comparison; H2
      (independence) by the pre-arm algebraic check and the same dispersion
      statistic read in the under-dispersed direction; H3 (exposure
      additivity) by the Step 5.0 test - its failure is Branch H; H4
      (stationarity) by the committed interleaving plus the run-order test
      and the SR-5 custody checkpoints; H5 (no cap interaction) by the
      saturation-aware AMEND-1 identity on EVERY receipt, with the k = 0
      anchor as the saturated proves-too-much control (predicted: every
      floor and null receipt UNSATURATED, overflow exactly 0; the anchor
      saturated by construction, overflow 2^30 − 1024 = 1073740800, legal
      under AMEND-1); H6 (comparator) by the measured null and the
      comparator-setting step.

  # ==================================================================
  # PROHIBITED-SENTENCE REGISTER AND NEVER-LIVE VALUES
  # ==================================================================
  prohibited_sentence_register:
    prohibited_classes: >-
      No sentence composed anywhere under this design - in any branch, any
      record, any summary - may be an EXTINCTION sentence (NARROW-1); a
      COMPLETION or decay-has-ended sentence (NARROW-1, NARROW-4); a
      CLIFF-AT-4 or sub-sub-interval reading (NARROW-4); a WHOLE-CURVE
      sentence (RAT-4: every sentence names its pairs and its per-pair
      resolution); a PLATEAU-SAFE-FOR-ALL-PHI sentence (the SR-2 bound is
