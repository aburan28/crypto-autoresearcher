      document names a branch or composes a fired branch's outcome
      sentence, it must quote this record or point at it.

    realized_readings_carried:
      text: |-
        Realized readings (design INPUTS, never re-measured, never entering
        a test statistic): h(4) = 17 (seed 531001) and 21 (seed 531002);
        h(8) = 13 (seed 531001) and 18 (seed 531002); h(16) = 12 (seed
