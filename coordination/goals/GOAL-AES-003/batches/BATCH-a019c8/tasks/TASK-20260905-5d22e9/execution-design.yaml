      source: DEC-20260901-6f9de3, standing gate for the frozen 582ea9 instrument lineage, ratified as RAT-2 of DEC-20260902-7ad3d9
      quotation_status: >-
        VERBATIM (glyph-faithful: U+2212 and U+00D7 as in the source and
