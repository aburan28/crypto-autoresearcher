    scope1:
      source: DEC-20260902-38227b scoping_adopted id SCOPE-1, carried as the binding attribution rule by DEC-20260903-63cd8d rules_carried
      quotation_status: VERBATIM of the DEC-20260903-63cd8d carried form (the binding inheritance; the grid+{3} extension clause in it is BATCH-060cb4-specific history and grants this design nothing)
      text: |-
        Under PIN-T0 the key schedule is the AES schedule at every
        interior point k >= 1 and constant across interior k;
        interior-to-interior comparisons are schedule-clean; any
        interior decay is attributed to table dilution at fixed
        schedule; no dilution-only language. Extended here to
