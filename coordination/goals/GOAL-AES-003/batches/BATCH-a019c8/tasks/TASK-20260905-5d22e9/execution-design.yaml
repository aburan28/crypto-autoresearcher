  # ==================================================================
  # DESIGN SCOPE, DOMAIN, AND K-LOCATOR
  # ==================================================================
  design_scope:
    question: >-
      Is the residual floor, over the tested points, (a) a constant nonzero
      plateau, (b) still decaying with k, or (c) indistinguishable from the
      operative comparator? Nothing else.
    cell: (amask = 1, smask = 1) - one probe cell, written cell (1,1).
    round_counts: r = 5 for every floor arm; r = 6 for every null-object arm; the two sets never mix inside a conjunct.
    pin: PIN-T0 throughout; SCOPE-1 attribution binds (carried verbatim above).
    exposure: Exactly 2^30 = 1073741824 trials per arm, every arm. No 2^32 arm is run.
    threads: 4 per arm. HIT_LOG_CAP 256 (cap records per arm = 1024).
    build: >-
      The FROZEN build only: source ec748cef..., binary 74e3d65c.... NOT the
      frozen-build-plus-declared-extension (3ccc377c..., R4 k=3 digest
      922e24c9...), whose k = 3 point is outside this design's domain. All
      points used are already on the frozen arm-token whitelist and in the
      committed R3_table_freeze.json: NO source change, NO declared diff, NO
      Gate-0x extended rebuild, NO new freeze commitment. Any future change
      of the per-arm exposure or the point grid requires a NEW freeze
      commitment with a pre-arm digest; this design changes neither.
    tier: >-
      Toy tier throughout (RQ-AES-003 R7 default). No distinguisher, no key
      recovery, no deployed-AES statement, no carrier, no X lane, no
      rho-exclusion, no published-cryptanalysis comparison in either
      direction.
    k_locator:
      primary_locator_pair: >-
        k = 4 (low extreme of the residual floor) and k = 16 (high extreme).
        The floor-magnitude contrast is located at exactly these two points;
        n_4 = n_16 = 4 arms each.
      secondary_locator: >-
        k = 8, n_8 = 2 arms, DECLARED REPORT-ONLY. No conjunct reads it; no
        count verdict at k = 8 in any branch (NARROW-5 discipline extended
        prospectively).
      anchor: k = 0 ramp-zero anchor only (gate G2 control; saturated by construction).
      out_of_domain: >-
        k = 1, 2, 3 (the THRESHOLD regime) are untouched; k = 12 is
        frozen-never-measured in any batch and no sentence may cite it as
        coverage (NARROW-4); the transition position inside (3,4] is
        committed input (CC3-SUBLOCALIZE-LATE), not this design's object;
        no other cell, round count, pin, or exposure anywhere.

  # ==================================================================
  # ARM PLAN - D-2 IN FULL
  # ==================================================================
  arm_plan:
    design_selected: D-2 (the candidate's recommended design), IN FULL - all 17 arms.
    arm_composition:
      ramp_zero_k0_anchor: 1
      r6_null_object: 6
      k4_primary: 4
      k16_primary: 4
      k8_secondary_report_only: 2
      total_2p30_arms: 17
    why_D2_and_not_the_alternatives:
      vs_D1: >-
        D-1 (9 arms, n = 2 per primary point) is DECLINED: the committed
        R5-2 prices (0.171940 plateau, 0.018883 decay-branch) and the SR-3
        margin conjunct are priced ONLY at the D-2 constants n = 4
        (pricing-v2 D-1 row: at n = 2 the margin threshold chi2_{0.95}(1) =
        3.841 against critical 6.635, and its null admissibility and FP
        effect "must be re-derived pre-arm if D-1 is ever adopted"). A
        design committing the R5-2 budget must run at the constants the
        prices were derived at; adopting D-1 would invalidate the committed
        budget before any arm ran.
      vs_D2_lite: >-
        D-2-lite (13 arms) is DECLINED: it drops the k = 8 secondary and
        two null arms, changing the null block to n = 4, which changes the
        committed G4 hard threshold (39 is priced at n = 6) and the U_null
        table row - a re-derivation of gate constants this design is not
        authorized to perform and does not need.
      vs_D0: >-
        D-0 (7 arms, measured null only) is a strict prerequisite SUBSET of
        D-2 (its six null arms and the anchor are positions 1-17 of this
        plan) and composes no floor sentence; running it separately would
        duplicate arms D-2 already contains.
      vs_D3_D4: >-
        D-3 (25 arms) and D-4 (37 arms) buy finer resolution
        (the 17-vs-12 separation named in the historical Coordinator prior)
        and are NOT claimed; D-2 is honestly underpowered, about 74 percent
        against the realized point ratio 1.5833 and about 51 percent
        against a 17-versus-12 separation, and says so pre-arm.
    seats_armid_convention: >-
      Seat-fixed convention (IDEA-20260903-8f26ac): the seat's armid is
      fixed and the seed varies. k = 4 -> armid 4; k = 8 -> armid 6;
      k = 16 -> armid 8; r = 6 dead anchor -> armid 1; k = 0 ramp-zero
      anchor -> armid 5. No new armid is introduced; the frozen armid plan
      is unchanged.
    exposure_per_arm: 2^30 = 1073741824 trials, every arm, exactly.
    pooled_exposure_per_primary_point: 4 x 2^30 = 2^32 trials (realized ONLY as the pool of four independent 2^30 arms; no single 2^32 invocation exists or is committed).
    total_trials_all_arms: 17 x 2^30 = 18253611008.

    seed_blocks:
      derivation_rule: >-
        DETERMINISTIC AND DECLARED, derived by a fixed rule committed here
