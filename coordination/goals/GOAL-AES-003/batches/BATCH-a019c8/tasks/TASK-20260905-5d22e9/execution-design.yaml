  # ==================================================================
  # R5-1 PRICED SEMANTICS - CANONICAL SCOPE STATEMENTS
  # ==================================================================
  priced_semantics_r5_1:
    application_rule: >-
      EVERY bound-carrying sentence in this record, in
      execution-budget.json, and in outcome-sentence-map.md carries the
      applicable canonical scope statement below INLINE, in the sentence
      itself - not by pointer. A bound-carrying sentence is any sentence
      that states, prices, budgets, or discloses the 0.171940
      false-plateau bound or the 0.018883 decay-branch price. The same
      rule binds every composed sentence of any future execution batch
      under this design.
    canonical_statement_0p171940: >-
      PRICED SEMANTICS (R5-1): 0.171940 is certified over the OBJ-5A
      calibration family and the probed configurations, NOT as a theorem
      for all equal-mean configurations - RT2-F6 showed the class-wide
      extension ARGUMENT fails on a one-outlier fixed-effect equal-mean
      configuration (exact gate-catch at phi = 2.0 deviating +0.010148
      from the bimodal construction, exceeding the disclosed C9 gap
      0.006323) even though the bound's CONCLUSION survives numerically on
      every probed configuration (max probed false-positive rate 0.1595,
      well under 0.171940). ATTAINMENT SEMANTICS (J-G1 F1): the worst case
      0.171940 is a supremum attained at phi = 1.0, the degenerate
      homogeneous limit, where the Branch-4 firing is a TRUE POSITIVE
      under its own null rather than a false positive; over the strictly
      heterogeneous range phi > 1 the bound is a supremum approached as
      phi -> 1+ (largest swept value 0.1718971 at phi = 1.001), never
      attained inside the open interval; the disclosed residual range is
      exactly [0.114124, 0.171940]; the plateau mass is
      convention-invariant, bit-identical under the written cascade order
      and under the Branches-1-5-only conditional convention. Any broader
      scope requires the extension argument repaired first (RT3-SR-4).
      'Bounded' must not be read as 'small' or 'removed' (J-G2 successor
      requirement; hand_derivation_caveats C10/C11 phi -> 1+ saturation
      caveat).
    canonical_statement_0p018883: >-
      PRICED SEMANTICS (companion, same discipline): 0.018883 is the
      written-cascade-order FM-OVERDISPERSED routing price of the decay
      branch, priced on OBJ-4 - the synthetic still-decaying generator at
      the preregistered minimum detectable effect rho = 2, lambda_plan =
      16 per 2^30, n = 4 independent arms per primary point, 2^30 trials
      per arm - and independently re-derived to every reported digit
      (TASK-20260904-937822, TASK-20260904-148ed6, TASK-20260904-f5b7fc,
      TASK-20260904-f405c6). It is a design-time exact enumeration at
      those committed constants, NOT a theorem for all decay alternatives
      and NOT a bound at any other n, exposure, lambda_plan, or level set
      (any change of the priced constants requires pre-arm re-derivation,
      pricing-v2 plateau_heterogeneity_sensitivity.bound.what_breaks_the_
      bound item iv).
    superseded_and_conditional_values: >-
      The live written-order decay power is 0.952538 (FM-DECAY-CONTINUES
      under OBJ-4 at the MDE, with 0.018883 to FM-OVERDISPERSED). The
      Branches-1-5-only value 0.970869 is CONDITIONAL ON BRANCH H NOT
      FIRING and is never a live unconditional value. The former arcsine
      power sizing is SUPERSEDED and its numeral is deliberately not
      reprinted anywhere in these artifacts; it is never a live value.
      The OBJ-5B comparator routing is 0.989349 falling to 0.884236 as phi
      runs 1.0 -> 2.0 (FM-OVERDISPERSED capture 0.008843 rising to
      0.115764 at the both-points reading; FM-PLATEAU-CONSISTENT 0.000000
      at every phi).

