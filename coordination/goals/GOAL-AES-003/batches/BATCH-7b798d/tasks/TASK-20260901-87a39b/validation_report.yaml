        failure. The overflow clause was written for the design-time regime
        where interior readings were expected sparse (design_time_power covers
        lambda up to ~150 hits; a few hundred hits cannot breach the 1024
        cap). The realized k=1 reading (12,681,109 hits) is ~5 orders of
