  verdict: stands-with-narrowing
  verdict_summary: >-
    The batch's committed records stand: the producer fired SH-GATE-FAIL on the
    literal, doubly-preregistered overflow conjunct, composed NO shape verdict,
    and retained the readings as rule-8 observations with disciplined
    disclosure. That is the honest outcome and no producer finding is reversed
    here. But the claim-space any downstream record may draw from this batch
    must be narrowed hard, on four grounds: (1) the committed cascade is
    SELF-INCONSISTENT as written (branch 1's literal overflow wording cannot
    coexist with the k=0 anchor under any capped build), and PASS-S0 rests on a
    producer-authored, pre-arm but Coordinator-unauthorized narrowing that must
    be ratified; (2) any post-hoc extension of the section-5 cap-independence
    interpretation to the S1 arms is barred; (3) the signal sits ~5 orders of
    magnitude beyond the design's priced power regime, voiding the design's
    discrimination claims and leaving the only structurally informative interval
    (k=2..8) unmeasured; (4) the k=1 reading co-measures the PIN-T0 schedule
    switch and cannot be attributed to dilution alone. ZERO shape claim is
    licensed by this batch; the ramp-shape question (363851 C3) remains open;
    repair requirements R1-R8 below are mandatory before any successor shape
    verdict.

  coordinator_prior_assessment:
    prior_source: DEC-20260901-fb6f11 review_plan.prior (recorded before any reviewer ran)
    status: OVERTURNED on the gate-survival expectation
    detail: >-
      The prior expected gates/anchors/KATs to survive and the k=16 re-seat to
      land in [6,30]; it named four break joints. Adjudication: (i) widened
      interior surface as hidden perturbation of sealed instruments -- DID NOT
      materialize (Gate-0x field-exact vs P2/L1 including all 14 hit-detail
      records; source diff is the pinned widening only; post-arm diff empty);
      (ii) pinned schedule change misattributed to dilution -- materialized as
      a DISCLOSURE, not a misattribution; the confound stands as repair
      obligation R4; (iii) finite-comparator excess at small hit counts -- did
      not materialize; (iv) cascade composition in the 41-99 ambiguity band --
      never reached. The prior MISSED the break that actually happened: an
      integrity conjunct (hit_overflow > 0) conditioned on sparse-hit
      expectations fired when the signal exceeded the priced regime by ~5
      orders. The prior treated the uncertain joint as which shape branch
      fires; the deeper unpriced risk was instrument-regime validity. Recorded
      as a prior-overturned outcome per the review architecture's obligation;
      future priors should note that gate conjuncts conditioned on sparsity
      assumptions inherit those assumptions. The k=16 re-seat expectation
      (band [6,30]) was met (12 hits) but, because branch 1 fired first, the
      re-seat stands only as an observation, branch 4 having been preempted
      rather than evaluated.

  per_joint_attacks:
    - joint: J1
      name: SH-GATE-FAIL status and the rescue attack
      status: attack lands (rescue barred); producer firing stands
      attack: >-
        The firing is the honest, doubly-preregistered outcome: the literal
        branch-1 wording AND the section-5 note's own non-extension clause
        ("for every arm where hits are expected sparse (... and all S1 arms)
        hit_overflow > 0 remains SH-GATE-FAIL") both bind the k=1/k=2
        receipts, and the note predates every arm (budget_stamps.jsonl:
        preregistration mtime 17:24:31 vs first arm 17:28:30). The RESCUE is
        the attack: extending the section-5 cap-independence rationale to S1
        NOW -- after observing 12,681,109 hits -- is a post-hoc rule change
        motivated by the signal itself. The rationale was priced under the
        sparse-hit expectation (14-150 hits); the S1 overflow occurred
        precisely because the instrument operated in a regime the design never
        priced, which is exactly what the gate exists to flag. Reinterpreting
        a fired gate into a pass at the moment the gate catches an unpriced
        regime is indistinguishable from moving the goalposts to save a
        desired result. No agent downstream may do it: not the validator, not
        the Coordinator by retroactive re-description of this batch. A clean
        repair is one of (a) a NEW Coordinator decision record amending
        branch-1 PROSPECTIVELY (e.g. re-scoping the conjunct to
        counter-inconsistency or overflow != hits - logged) plus a re-run
        under the amended rule; (b) a cap-independence proof committed BEFORE
        the readings it governs (none exists for S1; only the k=0 anchor has
        one); or (c) a re-run with raised cap or sampled detail so the literal
        gate passes on the receipt itself. DEV-S1-2 (continuing k=2/k=8/arms
        after the firing) is defensible under the reading that branch 1's
        conjuncts include the S1-5/S1-6 gates and the overflow status of ALL
        receipts, so the branch cannot be known to have fired until all
        conjuncts are evaluated (branches 2-3, not branch 1, carry explicit
        no-interior-reading language), and the handoff directed the full
        sequence with verdict composed only after all points were read; the
        deviation was disclosed. Under the STRICTEST halt reading, however,
        the k=2 and k=8 readings were taken after a fired HALT and are
        observation-only; the evidence record must carry that caveat.
      falsification_route: >-
        Any downstream record that treats the k=1/k=2 readings as
        gate-validated, or that extends the section-5 note to S1 without a
        prospective Coordinator amendment committed before the re-run it
        governs, is falsified by the preregistration text itself (the note's
        own non-extension clause) and by chronology (the interpretation would
        be adopted after the 12.7M observation).
      may_claim: >-
        SH-GATE-FAIL fired; invalid_measurement with respect to shape; no
        shape verdict composed; all non-overflow branch-1 conjuncts pass.
      may_not_claim: >-
        Any shape verdict; that the readings are gate-valid; any retroactive
        un-firing of branch 1 for this batch.

    - joint: J2
      name: Cap truncation as hidden corruption
      status: attack FAILS for count observables (source-verified); LANDS for any detail-dependent diagnostic
      attack: >-
        Source-level verification (affarm046ex.c lines 440-505): zhist, whist,
        wge1, wword and all ewhist_*/ewbithist_*/ezdiag_*/ezoff_* counters are
        incremented per trial BEFORE and independently of the cap check; only
        the per-hit detail arrays (hit_thread_idx/hit_W/hit_Z/hit_vmask/
        hit_ewb/hit_ewbit/hit_zmask_e) are capped at 256 per thread, with
        overflow counted. Independent re-derivation (one compute run, this
        session): overflow == hits - threads*256 EXACTLY at k=0 (1,073,740,800),
        k=1 (12,680,085), k=2 (148,347); all counter identities hold at every
        point (whist sums to nontrivial trials; wge1 == sum whist[1:]; word
        moment identity; ewhist_hit sums to hits; zhist sums to nontrivial
        trials). The analysis scripts consume hit_trials/hit_e_detail ONLY for
        completeness accounting (record count == hits - overflow; thread-0
        count == hit_trials_logged), never for a statistical quantity.
        SURVIVE truncation: h(k), whist, W_ge1_by_word, excess ratio, Garwood
        CI inputs (count and exposure), run-internal null, zhist, ewhist_*,
        ewbithist_*, ezdiag/ezoff, all consistency checks. DO NOT SURVIVE:
        hit_e_detail and hit_trials as a SAMPLE of hit structure -- the logged
        records are the FIRST 256 hits per thread (at k=1, in_thread_index <
        ~18,500 of 268M per-thread trials, ~0.007% of each thread's stream),
        biased toward early trials, not a random sample; any distributional
        statement over hits derived from detail records (zero_mask_e
        distributions, per-hit diagnostics, any future X-lane computation) is
        unsupported on these receipts. Notable SURVIVOR (red-team derived):
        the full-population structural fact at k=1 -- exactly one hit
        vanishes on word 0 and all 12,681,108 W=3 hits carry mask 14 --
        follows from the cap-independent word counters ALONE (the linear
        system word0==1, words1-3 each == whist[3] has the unique solution;
        verified). Residual finding: the determinism double ran at log2N=20
        with 0 hits, so the overflow/truncation code path is
        determinism-untested (structurally low-risk: a per-trial counter
        increment, but untested).
      falsification_route: >-
        The counter-independence claim would be falsified if any of the
        re-derived identities failed; they all hold. The detail-corruption
        attack is unfalsifiable-away for detail-based diagnostics by
        construction (first-256-per-thread truncation); any future diagnostic
        computed from hit_e_detail on these receipts is pre-falsified.
      may_claim: >-
        Count observables and all histogram counters are intact under
        truncation (source-verified and independently re-derived); the
        mask-14 structural fact at k=1 (cap-independent derivation).
      may_not_claim: >-
        Anything derived from the hit_e_detail/hit_trials sample as if it
        represented the hit population; that the determinism gate covered the
        overflow path.

    - joint: J3
      name: Power honesty at a signal ~5 orders beyond the priced regime
      status: attack lands (design discrimination claims void; informative interval unmeasured)
      attack: >-
        The design-time power table prices lambda up to ~150 (GRADUAL
        threshold 100; STEP residual 13-19; ~8 sd primary-joint separation;
        ambiguity mass 0.487 at lambda=100). Observed h(1) = 12,681,109 is
        5.10 orders of magnitude above the 100 threshold and 4.93 orders
        above the table's maximum lambda (re-derived this session; the
        handoff's "~3 orders" UNDERSTATES it). Consequences: (i) the
        primary-joint discrimination claim is moot -- the observation matches
        neither priced hypothesis; M1 (global fragility, h(1) ~ 13-19) and M3
        (full-table collectivity, h(1) <= 5) are falsified at k=1 IF the
        reading is ever validated, while M2 (tunable dose) was never priced
        for a 98.8% collapse of the law at the first byte; M2 would "win" the
        cascade by elimination in a form nobody designed for. (ii) SATURATION
        AND FLOOR: at declared band resolution the curve is a step function
        (bandranks 3,3,1,1 over k=1,2,8,16): k=1 and k=2 are both THRESHOLD,
        k=8 and k=16 both RESIDUAL; the transition sits in the UNMEASURED
        interval (2,8) -- exactly where the design spent no point (k=4
        withheld as refinement-only). (iii) The design's own declared
        granularity forbids reading the only quantitative structure the data
        offer: the 84.9x decay k=1 -> k=2 is a within-THRESHOLD comparison,
        the 13-vs-12 near-equality is within-RESIDUAL -- both below the
        sentinel's band-level resolution by the proposal's own declaration.
        (iv) The single-seed multiplicative near-coincidence (k0->k1 factor
        84.67 vs k1->k2 factor 84.90, re-derived) dies at k=8: multiplicative
        extrapolation predicts ~4e-7 hits, observed 13 -- the residual floor
        intervenes inside (2,8), confirming the unmeasured interval is the
        informative one. (v) What 2^30 STILL supports at these magnitudes is
        a tight rate measurement at k=1 (Garwood relative half-width ~0.055%,
        CI [12,674,130, 12,688,090] verified against normal approximation) --
        not the branch-discrimination claim priced at lambda 13-19 vs 100.
        The Poisson/binomial model is adequate for the count CI at p=0.0118,
        but the excess-over-null-1.0 comparison spans ~7 orders and is
        mechanistically uninformative as priced.
      falsification_route: >-
        The claim "the monotone pattern discriminates GRADUAL decay" is
        falsified by the design's own band-resolution declaration, by the
        unmeasured (2,8) interval, and by the vacuity finding of J6 (at
        h(1) >= 100 the band-non-rising conjunct cannot fail, so the pattern
        carries no additional branch-selecting information beyond h(1) >=
        100). Any successor that claims the 5-point subset located the
        transition is falsified by the band-step 3,3,1,1.
      may_claim: >-
        A tight per-point rate at k=1 under the run's own counters (if the
        readings are ever validated by a repair); band membership of each
        point as observed.
      may_not_claim: >-
        That the design discriminated M1/M2/M3 at stated power; that the
        transition is located; any within-band trend (including the 85x
        k1->k2 decay and the 13-vs-12 floor) as a resolved feature.

    - joint: J4
      name: Scope leakage
      status: no violation in the producer's records; four leakage routes barred downstream
      attack: >-
        (a) OBS-S1-2 states the pattern "lies in the SH-GRADUAL direction" --
        verdict-flavored language. The producer correctly composed no verdict,
        but the phrase must NOT propagate: under cascade order a verdict
        cannot be composed from readings whose gate branch fired, and even the
        band-sequence description presumes a reading validity that branch 1
        denies. (b) No X-lane or carrier leakage in the records (X statistic
        not computed; no-reopen clause attested per point), but OBS-S1-1's
        zhist/W=3 structural description uses the X-lane's input fields; it
        survives ONLY as report-only enabling data and any downstream citation
        must keep it there -- never "zeros again", never a carrier sentence
        (RT2-E paraphrase discipline from TASK-20260901-7df96a). (c) Closure
        extension: NONE licensed. The batch's closure scope is S0
        instrument/anchor validation plus a fired S1 gate plus retained
        observations; the ramp-shape question (363851 C3 / RT2-E item 6)
        remains OPEN and gated. No record may state "the count excess
        decays/survives/dies with dilution" on this batch, and the closed
        X-lane scope of EV-AES-896ef2 (t=1, cell (1,1), rho_80 = 0.1183) is
        untouched -- reported beside, never merged. (d) The k=8=13 / k=16=12
        near-equality: both RESIDUAL, single seed, Garwood CIs [6.9, 22.2] vs
        [6.2, 21.0] overlap almost completely, and count-level comparison
        within one band is below the declared resolution -- any "extinction
        by k=8" or "floor reached at k=8" language is out of scope.
      falsification_route: >-
        Citation audit of every downstream record (in particular EV-AES-f2da41)
        against the scope-narrowed restatement below; any shape sentence,
        extinction sentence, carrier sentence, or closure sentence drawn from
        this batch is a scope violation the red team will contest.
      may_claim: the retained observations, exactly as scoped in the restatement.
      may_not_claim: >-
        Any shape verdict; closure or partial closure of the ramp-shape
        question; extinction or floor claims at k=8; carrier/X-lane
        statements; anything beyond cell (1,1), r=5, seed 531001, k in
        {0,1,2,8,16}, 2^30, PIN-T0.

    - joint: J5
      name: PIN-T0 perturbation and the k=1 schedule confound
      status: sealed-comparison perturbation attack FAILS (good); dilution-attribution attack LANDS at k=1
      attack: >-
        Two sub-attacks. (i) Does PIN-T0 adoption perturb any sealed-reading
        comparison? NO, verified: Gate-0x rebuild is field-exact against the
        certified cap-256 P2 receipt AND the committed L1-AES-R5-P30 receipt
        (14 hits; all 14 hit-detail records identical; all counters
        identical; only the preregistered additive pin-label fields added);
        the ramp-zero anchor is receipt-exact under PIN-T0's identity
        schedule at k=0; the k=16 re-seat reads 12 vs committed 14/19, within
        the committed +/-16% seed/stream variance. Interior readings are
        pin-invariant across the two endpoint-preserving pins by
        construction (both set the AES schedule for all k >= 1), so the
        shape over {1,2,8,16} is not pin-sensitive. (ii) Can the 12.7M k=1
        excess be attributed to dilution? NO: under PIN-T0 the k=0 -> k=1
        step co-varies the first dilution step (AES round table at position
        0) AND the identity -> AES schedule switch. There is NO committed arm
        separating them -- no interior-AES-table-plus-identity-schedule arm
        exists (the build refused interior arms pre-pin; PIN-T0 was adopted;
        the schedule-separated variant is the proposal's named successor
        control, unbudgeted and unspent). The 84.7x k=0 -> k=1 drop is a
        JOINT effect; OBS-S1-2's "monotone decay in k" treats k as a pure
        dose axis, which it is not at its first step. The proposal disclosed
        this (schedule_pin and confounders blocks) and the batch carried the
        disclosure; the repair must handle it (R4). For k >= 2 the schedule
        is constant (AES), so comparisons along k=2..16 isolate round-table
        dose under a fixed schedule -- only the k=1 point and the k=0->k=1
        step are confounded.
      falsification_route: >-
        Any successor claim attributing the k=1 reading (or the k=0 -> k=1
        drop) to dilution per se is falsified by the absence of any arm
        separating schedule from round table at that step.
      may_claim: >-
        PIN-T0 adoption perturbs no sealed comparison (Gate-0x field-exact);
        interior readings are pin-invariant across the two endpoint-preserving
        pins.
      may_not_claim: >-
        Dilution-only attribution of h(1); any schedule-separated statement
        from this batch.

    - joint: J6
      name: Cascade overlap re-check
      status: no reachable double-assignment; one vacuity finding recorded
      attack: >-
        Given these readings branch 1 fired and branches 2-9 are preempted --
        no overlap reachable this batch. For the repaired re-run the branch
        disjointness was re-checked: SH-DEAD's outcome set is a SUBSET of
        SH-STEP's conjuncts (h <= 5 implies h <= 40; an all-NULLBAND interior
        is band-non-rising), resolved ONLY by branch order (5 before 7);
        SH-DEAD's outcome (interior null, k=16 residual) is band-RISING under
        the sentinel's own definition (rank 0 -> rank 1 rise from k=1 to
        k=16), but branch 6 explicitly requires not-SH-DEAD, so no double
        assignment; SH-STEP vs SH-GRADUAL disjoint on h(1) <= 40 vs h(1) >=
        100; SH-OTHER-RESIDUAL is the declared complement. VACUITY FINDING:
        at h(1) >= 100 the bandrank of k=1 is already maximal (3), so no
        later point can band-rise and SH-GRADUAL's "band sequence non-rising"
        conjunct is automatically true -- under any repair, SH-GRADUAL fires
        iff h(1) >= 100, and k=2/k=8/k=16 play NO role in branch selection
        (only in locating the transition). Additionally branch 5's
        descriptive wording ("exists only at or near k=16, which passed the
        re-seat gate") describes a curve that is band-RISING by the
        sentinel's definition -- harmless under ordering, but the wording
        should be tightened if the cascade is amended anyway (R1).
      falsification_route: >-
        Exhaustive case check over band-rank assignments for branches 5-8 (as
        above); a double-assignment claim would need a band-rank tuple
        satisfying two branches' conjuncts simultaneously, which does not
        exist given the ordered evaluation.
      may_claim: the cascade assigns a unique branch to every outcome, ordered.
      may_not_claim: >-
        That the monotonicity conjuncts do any branch-selecting work when
        h(1) >= 100.

    - joint: J7
      name: Proves-too-much -- the overflow conjunct vs the k=0 anchor
      status: attack lands (the committed cascade is self-inconsistent as written)
      attack: >-
        Applied literally, branch 1 fires on the k=0 ramp-zero anchor itself:
        overflow = 1,073,740,800 > 0 on an analysis-bearing receipt (S0-6 was
        analyzed; S5_rampzero_analysis.json exists). The SAME wording that
        invalidates the k=1/k=2 readings invalidates the PASS-S0 that admits
        them. The cascade as committed in IDEA-20260901-582ea9 is
        self-contradictory: branch 1 (literal) + branch 3's anchor
        requirement (hits = 2^30 exactly) + the certified cap-256 build
        cannot be jointly satisfied -- under any capped build a k=0 anchor
        necessarily overflows. The proposal knew the cap (its memory block
        cites "per-hit detail capped at 256 records, already certified") and
        still wrote the literal conjunct. The S0 producer resolved the
        contradiction via the section-5 note: the anchor's named conjuncts
        are count-based; the overflow is mechanically necessary, recorded
        exactly, and flagged for the validator (rule 8). That resolution is
        defensible in substance and was pre-arm (mtime verified against
        budget_stamps.jsonl), but it is a PRODUCER-authored narrowing of a
        frozen decision rule with NO Coordinator decision record behind it --
        DEC-20260901-fb6f11 authorized execution "under its preregistered
        ordered SH cascade" and never mentions the overflow contradiction.
        The reductio alternative (declare S0 SH-GATE-FAIL on the literal
        wording) would fire on every future k=0 anchor in any capped build,
        including the campaign's own frozen selfcheck_identity_k0 assertion
        pattern which EXPECTS overflow = nontrivial - threads*min(per_thread,
        cap) -- so the defect is in the proposal's wording, not the
        instrument. Net: PASS-S0 stands only under the section-5-note
        reading and must be cited that way until the Coordinator ratifies or
        replaces the narrowing; the S1 firing then follows A FORTIORI from
        the note's own non-extension clause.
      falsification_route: >-
        Construction: branch 1's literal text evaluated on receipt S5_rampzero
        (overflow 1,073,740,800 > 0, analysis-bearing) yields SH-GATE-FAIL,
        contradicting s0_outcome_ordered_cascade = PASS-S0 in the same
        package. Any record citing PASS-S0 as a literal-cascade outcome is
        falsified by this construction.
      may_claim: >-
        PASS-S0 under the section-5-note reading, pending Coordinator
        ratification; all S0 anchor conjuncts (count-based) hold exactly.
      may_not_claim: >-
        PASS-S0 under the literal committed cascade wording; that the cascade
        as committed is internally consistent.

  strongest_attacks:
    - id: RT3-A
      name: The rescue is barred -- post-hoc cap-independence extension after an unpriced signal
      summary: >-
        SH-GATE-FAIL fired on the literal and doubly-preregistered overflow
        conjunct; the section-5 cap-independence rationale was priced under
        sparse-hit expectations and its extension to S1 decided AFTER seeing
        12.7M hits is a post-hoc rule change that converts "instrument
        outside validated envelope" into "pass". Only a prospective
        Coordinator amendment plus re-run, a pre-registered cap-independence
        proof predating the readings, or an instrument fix with the literal
        gate passing on the new receipt is legitimate. (Joints J1, J7.)
    - id: RT3-B
      name: The cascade as committed is self-inconsistent -- proves-too-much confirmed
      summary: >-
        Branch 1's literal wording fires on the k=0 anchor (overflow
        1,073,740,800), so the same conjunct that kills the k=1/k=2 readings
        invalidates the PASS-S0 that admitted them; branch 1 and branch 3
        cannot be jointly satisfied under any capped build. PASS-S0 rests on
        a producer-authored, pre-arm but Coordinator-unauthorized narrowing
        that the closing decision must ratify or replace. (Joint J7.)
    - id: RT3-C
      name: Power voidance plus unmeasured transition interval plus k=1 schedule confound
      summary: >-
        The signal is 5.10 orders above the GRADUAL threshold the power table
        priced (the handoff's "~3 orders" understates it); at declared band
        resolution the curve is the step 3,3,1,1 with the transition inside
        the unmeasured interval (2,8); the only quantitative structures
        (84.9x within-THRESHOLD decay; 13-vs-12 within-RESIDUAL floor) are
        below the design's own declared resolution and single-seed; and h(1)
        co-measures the PIN-T0 schedule switch with no committed separating
        arm. "Monotone decay discriminates SH-GRADUAL" is false at the
        design's own resolution; at h(1) >= 100 the cascade's monotonicity
        conjunct is vacuous and SH-GRADUAL would fire iff h(1) >= 100.
        (Joints J3, J5, J6.)

  scope_narrowed_restatement:
    what_this_batch_may_support:
      - >-
        S0 (under the section-5-note reading, pending Coordinator
        ratification): the PIN-T0 widened build reproduces the sealed k=16
