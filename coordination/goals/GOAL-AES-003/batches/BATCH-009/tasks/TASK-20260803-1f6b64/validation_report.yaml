  # VERDICT — WRITTEN FIRST, PER TASK CARD DISCIPLINE
  # ============================================================
  verdict: passed
  verdict_statement: >-
    PASSED as an admissible research receipt. The 44-artifact snapshot at
    commit db9322b6 hash-verifies exactly against the receipt; the null-object
    construction in yoyo_sbox_v4.c is, on line-by-line inspection, a sound
    exact-conditional-law lazy sampler for a uniform random bijection given the
    four oracle queries a trial makes -- I find no exploitable structure, and
    the cross-trial birthday bound is a valid (if slightly loose) application
    of the union bound. All three headline statistical intervals (matched,
    8x-exposure, pooled) and both null-object R_null readings independently
    reproduce to the reported digit from the raw run JSONs, using code I wrote
    myself, not the producer's analyze.py or the Coordinator's recomputation.
    The RC-11 McNemar-collapses-to-unpaired-binomial claim reproduces exactly
    from the raw hit_trials arrays. The G1-G3-bit-identical-to-N2 explanation
    is code-verified true; G4-G6 are correctly NOT claimed identical, and I
    flag below that the task card handed to me overstated this ("G1-G6...
    bit-identical") relative to what the producer's own RESULTS.json actually
    and correctly says. OUTCOME-A (the r=5 excess did not survive cipher
    substitution at this scale) is the correct reading of the preregistered
    decision rule applied to this data.
    This verdict does NOT mean the r=5 excess is real, does not support any
    ECDLP claim, and does not authorize promotion -- per docs/claims-and-verification.md
    and the task card, those are Coordinator/Reviewer calls, not mine.
  limitations_that_do_not_change_the_verdict:
    - "The 'pooled' null-object statistic (N1+N2, 7 hits / 9,663,676,415 trials) double-counts data: N1 is a byte-for-byte PREFIX of N2's cipher-stream draws (same seed_thread => same seed_cipher for both), and I confirmed N1's single hit trial [0,128282052] IS N2's first hit trial, not a distinct event. Pooling them as independent exposure is a real methodological error the producer did not flag (unlike its correct non-independence flag on G1-G6). It does not change OUTCOME-A: the PREREGISTERED decision rule in PREREGISTRATION.md section 4 is keyed to the MATCHED-exposure test (N1 vs P1) plus R_null's CI, neither of which uses the pooled figure, and the pooled p-value/CI is close enough to the N2-alone reading [p=8.79e-10, CI 6.74-59.27] that no qualitative conclusion moves."
    - "SEARCH_RECORD.md's S1 file-space counts (1040 files / 444 JSON / 13444 experiments files) do not reproduce exactly against a clean checkout of the cited revision 16bbb893 (I get 1016 / 442 / 13430 -- see artifact_checks). This is a ~2% discrepancy, most plausibly explained by transient/untracked files present in the live working tree at search time (e.g. __pycache__) that are absent from a fresh checkout of the same commit. The DECISIVE finding (S4: exactly two sbox_spec forms, aes and rand:<seed>, campaign-wide before this batch) reproduces EXACTLY under my own independent JSON-walk of the cited revision, and the keyword-grep S2 file list (8 files) reproduces exactly. The absence claim itself is not weakened by the S1 count imprecision."

