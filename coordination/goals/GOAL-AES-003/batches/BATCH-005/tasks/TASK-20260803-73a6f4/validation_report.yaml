    the Coordinator, so nothing in this report counts toward a closure quorum
    under AGENTS rule 8. The re-execution reported below is implementation
    independent: engine, S-box construction, key schedule, counting kernel and
    statistics were written in this session and checked against a byte-wise
    Python reference that reproduces FIPS-197 C.1.

