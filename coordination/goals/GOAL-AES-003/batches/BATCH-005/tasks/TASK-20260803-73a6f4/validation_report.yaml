  limitations:
    - id: L-1
      text: >-
        Model independence is ABSENT. This validator resolved to claude-opus-5,
        the same model as both producers and the Coordinator. Session and
        implementation independence only, standing basis
        0137a051eb5828789eb267fa83c8278086578d4c. Nothing here counts toward a
        closure quorum.
    - id: L-2
      text: >-
        The byte-width result stands at ONE round count, ONE matrix pair, ONE
        key, ONE base block and ONE projection index. r=7 is unmeasured in every
        layer, so whether the decay stays gone is unknown.
    - id: L-3
      text: >-
        The deconfounding rests on THREE S-box draws and three keys at 2^30 per
        cell. It removes an objection; it does not establish S-box independence.
        CORR-20260803-791ca7's 0.224 lower bound is untouched, as both the
        producer and the receipt say.
    - id: L-4
      text: >-
        The null-object control the inventor protocol asks for (RC-4) has never
        been run for the mod-8 / divisibility statistic. For the DIVISIBILITY
        endpoint the null is analytically pinned and the decay direction is
        measured (present at r=5, absent at r=6), which is most of what the
        protocol wants. For the RESIDUE endpoint there is no null-object
        control and no arm should ever lean on a single residue reading.
    - id: L-5
      text: >-
        The measured PRP null that does exist (BATCH-002 A3/A3b) is a 10-round
        AES surrogate on a different binary, pins the null only to a factor of
        about 1.3 upward at 95%, and has never been repeated on yoyo_sbox_v2.
        Correcting the receipt's overstated gap does not make the null
        well-measured; it makes it partially measured.
    - id: L-6
      text: >-
        This validator's extra r=6 M0 and r=6 CTRL runs are VALIDATOR
        measurements in a scratchpad, not producer artifacts, and are not part
        of the bound snapshot. They are reported for what they are and confer no
        official state. Anyone wishing to rely on them should have them produced
        and snapshotted properly.
    - id: L-7
      text: >-
        Budget. 4200 s. Dropped work is named in dropped_work below.

  dropped_work:
    - >-
      No independent re-execution of the nine deconfounding arms was attempted.
      Each is 2^30 yoyo trials on a binary this validator did not write, and
      re-implementing the yoyo probe correctly is not a task-budget act. The
      deconfounding was validated by artifact inspection plus full independent
      recomputation of every statistic, not by re-measurement. Stated plainly so
      no reader mistakes the level of the check.
    - >-
      No j0 sweep and no r=7 byte-width arm was run by this validator; each is a
      further full 2^32 pass.
    - >-
      No adapter probe of the resolved inference model exists in this harness, so
      model_verified is false here as it is everywhere in this campaign.

  observations_for_the_coordinator:
    - >-
      The endpoint move in TASK-20260803-6d88ba is the methodologically strongest
      act in this batch. Choosing, in advance, a structural endpoint that a
      single exhaustive pass CAN settle over a statistical endpoint that a single
      pass CANNOT, and writing down that the verdict would be unchanged had the
      1/8 residue landed favourably, is exactly the discipline the inventor
      protocol asks for. It should be recorded as a technique, independently of
      what the campaign decides about the result.
    - >-
      The receipt's "gap this batch surfaced" is the batch's one factual error
      and it runs in the self-critical direction. If a future batch spends
      budget re-measuring the PRP null, it should be told that BATCH-002 A3/A3b
      already exist and that the open part is narrower: the same null on
      yoyo_sbox_v2, and against a true random permutation rather than a
      10-round-AES surrogate.
    - >-
      RANK 1 is discharged. The BATCH-004 segment-2 r=6 arms are now reviewed:
      the pairing is real on the artifacts, and the r=5-to-r=6 decay is
      null-independent, which is a stronger property than any excess factor in
      this campaign has.

