  claim_tier_basis: >-
    Everything checked here is a reduced-round AES-shaped construction. Priority 1
    is one 2^32 diagonal coset of a 6-round AES-shaped SPN over GF(2^8) under one
    key, one base block and one projection index. Priority 2 is r=5 of a
    reduced-round AES-128 permutation at 2^30-2^31 trials on one machine under
    three specific S-boxes. Nothing in this report is a statement about
    full-round or deployed AES, and no comparison to published cryptanalysis is
    made in either direction. No asymptotic or cryptographic-scale claim is made
    or implied. This report assigns no official state, no evidence strength, and
    recommends no promotion.

