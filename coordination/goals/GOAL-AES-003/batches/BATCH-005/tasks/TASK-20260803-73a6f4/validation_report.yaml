  claim_verdicts:
    - id: V-1
      claim: >-
        "At GF(2^8), r=6, four-zero matrix M1, full 2^32 coset, the
        divisibility-by-256 signature is ABSENT (gcd of nonzero fiber sizes 1,
        max_occ 12, Poisson histogram), matching the no-zero control."
      verdict: CONFIRMED
      basis: >-
        Re-executed end to end on an independently written engine and reproduced
        bit for bit, including all 13 histogram bins (M-1). Re-derived from the
        committed histogram without the engine (M-4). Poisson shape checked
        (M-5). The r=5 comparison state re-read from BATCH-002 raw (M-7). The
        producer's check is broader than 256 and I confirm that too: gcd 1 rules
        out divisibility by ANY d > 1, including the d=16 case that would also
        force the residue.
    - id: V-2
      claim: >-
        The endpoint choice: freezing the fiber-divisibility signature as
        primary rather than n mod 8, on the ground that C(256k,2) = 128k(256k-1)
        makes the residue arithmetically entailed whenever divisibility is
        present.
      verdict: CONFIRMED - the reasoning is correct and the endpoint is sound as a primary.
      basis: >-
        (a) The arithmetic is right. If every nonzero fiber has size m = 256k
        then C(m,2) = 128k(256k-1), a multiple of 128, so n is a multiple of 128
        and n mod 8 = 0 necessarily. The entailment is exact, not probabilistic,
        so conditional on divisibility the residue carries literally zero
        information - and the case under test is exactly the case where
        divisibility might be present.
        (b) The power argument is right. One 2^32 pass is one trial at the 1/8
        level on the residue, which cannot distinguish anything. The divisibility
        signature is a simultaneous property of ~2^32 fiber sizes; under any
        non-degenerate null it is astronomically improbable, so one exhaustive
        arm settles it. Preferring a structural endpoint that one arm CAN settle
        over a statistical endpoint that one arm CANNOT is the correct move, and
        it was preregistered before measuring (A-2), which is what makes it a
        methodological choice rather than a post-hoc rescue.
        (c) It is the right endpoint for the question actually asked. OBS-B3-4
        names a MECHANISM (fiber degeneracy forcing the residue independently of
        round count), not a residue value, so the endpoint matches the objection.
      scope_of_the_endpoint_stated_precisely: >-
        Divisibility is SUFFICIENT for the residue but not NECESSARY. Its
        absence at r=6 kills the OBS-B3-4 mechanism; it does not establish that
        no other mechanism could force the residue at r=6. The producer says
        exactly this and does not claim more. Had the residue landed on 0 by
        chance the verdict would indeed have been unchanged, and that
        counterfactual was written down in advance.
    - id: V-3
      claim: >-
        "This closes OBS-B3-4 at byte width for M1, confirming BATCH-004's
        nibble analogue."
      verdict: CONFIRMED AS SCOPED, and the scope is carried in the receipt.
      basis: >-
        The snapshot receipt heads the paragraph with "CONFIRMS THE NIBBLE
        ANALOGUE, FOR M1 AT j0=0 ONLY" and carries a separate byte_width_scope
        entry saying M0 at r=6 is UNMEASURED, that no j0 sweep ran, and quoting
        the BATCH-002 j0-sensitivity precedent (547608330240 at the critical j0
        versus exactly 0 at a non-critical one) with the correct numbers, which I
        re-read from raw (M-7). The batch summary DOES carry the limit. Under
        CORR-20260803-791ca7 this is the pattern to check, and here the
        compression did not occur.
      one_thing_the_receipt_UNDERSTATES: >-
        The j0 caveat is stated more darkly than the evidence requires. The
        547608330240-vs-0 precedent is M0 at r=4. For M1 - the matrix actually
        under test - BATCH-002 measured r=5 at BOTH j0=0 (max_occ 2816, gcd 256)
        and j0=1 (max_occ 2304, gcd 256), so at the round immediately below the
        transition the signature was NOT knife-edge in j0 for this matrix. That
        makes an r=6 j0-sweep less likely to overturn the reading than the
        receipt's phrasing implies. It remains unmeasured and I do not treat it
        as measured.
    - id: V-4
      claim: >-
        "M0 at r=6 at byte width is unmeasured and no j0 sweep ran" - i.e. the
        batch's own summary carries its scope limit.
      verdict: CONFIRMED for the receipt as written, with one addition from this validator.
      addition: >-
        This validator ran the dropped M0 r=6 arm itself; see
        validator_extra_arm_outcomes and limitation L-6. A validator measurement
        does not convert into producer evidence and I assign it no state.
    - id: V-5
      claim: >-
        "The S-box-to-S-box difference does not survive deconfounding" - 3x3
        crossed factorial, same seed set across S-boxes, S-box main effect
        p = 0.458, BATCH-004's p = 0.023 re-tested at p = 0.834 with the sign
        reversed.
      verdict: CONFIRMED
      basis: Pairing verified from artifacts (M-8); every statistic recomputed independently and matching to six figures (M-9); the library's two external anchors reproduced (M-10).
    - id: V-6
      claim: >-
        "The null is not merely underpowered": power 0.816 at the BATCH-004
        rates, 80%-power detectable ratio about 1.73.
      verdict: CONFIRMED for 0.816. CONFIRMED-BUT-PARAMETERIZATION-DEPENDENT for 1.73.
      basis: >-
        0.8156 reproduced exactly by independent enumeration. 1.73 reproduces
        only when one arm is held at the observed pooled rate and the other
        raised; under a sum-preserving alternative the 80%-power ratio is about
        1.9. The dependence is visible in extras.py but not in the sentence.
        This does not disturb the primary conclusion, because the load-bearing
        sensitivity number is 0.816, which is computed at the specific
        BATCH-004 rates and needs no such convention.
    - id: V-7
      claim: >-
        The right claim is "not attributable to the S-box" rather than
        "attributable to the key".
      verdict: CONFIRMED - this is the correct framing and the producer states it unprompted.
      basis: >-
        T2 (key) is also null at p=0.247 and T3 is consistent with a single
        common rate at p=0.457, so nothing here positively attributes the
        BATCH-004 difference to the key. My own cross-batch comparison (M-12)
        agrees: no S-box's rate differs between batches. What the paired design
        DOES buy is that the S-box contrast is now within-key and within-stream,
        so the null bounds the S-box effect specifically rather than a
        three-way-confounded quantity. The producer's phrase "IT DOES NOT
        SURVIVE" is accurate; its own HONEST_LIMIT_ON_THE_WORD_VANISH stanza
        prevents the over-reading. It also declines to revive the retired
        headline and cites CORR-20260803-791ca7's 0.224 bound, correctly.
    - id: V-8
      claim: Structure-destroyed controls at 2^31 - all three inside band, the 4.0x breach did not recur.
      verdict: CONFIRMED (C-3), including the tighter design (sd arms share the K1 master key, verified in M-8).
    - id: V-9
      claim: >-
        RC-7 "removes the arm-level-implementation-offset explanation for the AES arm."
      verdict: OVERSTATED
      basis: >-
        The measurement is CONFIRMED and I reproduced all ten vectors on a third
        implementation (M-13). What it establishes is that the two probes compute
        the SAME enc_r function - which is exactly what OBJ-9 asked and is
        genuinely useful, because the "13.5x reproduces BATCH-002" statement now
        rests on identical functions rather than similar-looking numbers. But an
        ARM-LEVEL implementation offset would live in the swap logic, the coset
        and word selection, the trivial-swap exclusion or the counting - none of
        which enc_r vector equality touches. The thing that actually addresses
        that objection is the r=6 decay control (M-14), which is a different
        artifact in a different batch. The producer wrote the sentence and the
        Coordinator receipt repeated it; the defect is shared.
    - id: V-10
      claim: >-
        "NO ARM IN THIS CAMPAIGN HAS EVER MEASURED THE PRP NULL THAT EVERY
        EXCESS FACTOR DIVIDES BY. Every 13.5x, 20.5x and 15.63x across five
        batches rests on an analytic 4 * 2^-32 that has never been checked
        against a measurement."
      verdict: DOES NOT FOLLOW - the claim is FALSE AS STATED, and it is an UNDERSTATEMENT of the campaign's evidence rather than an overstatement.
      basis: >-
        BATCH-002 TASK-20260802-e4fa63 contains two arms explicitly labelled
        role "measured_prp_null": A3 (seed 424242003, key
        3c568e588f21c4657d42bbaf1b30170b) and A3b (seed 515151007, key
        461742c42c1f9b2d7ed96e64594817bc). Each ran 2^33 trials of the SAME
        statistic (amask=1, smask=1, W_ge1) through the same pipeline with
        full 10-round AES under an independent key as the permutation surrogate.
        A3 read 5 hits against an analytic 8.0 (0.625x, 95% upper bound 1.31);
        A3b read 7 (0.875x, upper bound 1.64). Pooled: 12 observed against 16
        analytic, ratio 0.750 with an exact Poisson 95% interval of
        [0.388, 1.310] on that ratio, which I computed here.
        BATCH-004's own runs/didnotrun.json cites these two arms by name for
        exactly this purpose. So the record contradicting the claim was inside
        the material the producer was reading.
      what_IS_true_and_should_replace_it: >-
        (i) The null has never been measured ON THE yoyo_sbox_v2 BINARY - the
        A3/A3b arms ran BATCH-002's probe. (ii) The surrogate is a 10-round AES
        under an independent key, not an ideal random permutation, so it tests
        the pipeline's null against a strong pseudorandom object rather than
        against a true PRP. (iii) The measurement pins the null only to within
        roughly a factor of 1.3 upward at 95%, and it came in BELOW analytic, so
        using the measured value would make excess factors LARGER, not smaller.
      weight_the_excess_factors_actually_carry: >-
        More than the receipt's gap statement implies. The analytic null is
        corroborated to within a factor well under 2 by an existing measurement,
        and the excess factors in question are 11x-20.5x, so no plausible
        correction to the null erases them. Their real weakness is elsewhere and
        is already on the record: single arms of 22-41 hits, three S-boxes, one
        round count, and - now measured - no S-box main effect. Separately, the
        r=5-to-r=6 decay contrasts (M-14) are conditional and divide by no null
        at all, so they are immune to this question entirely.

  summary_line_audit:
    binding_rule: CORR-20260803-791ca7 - a Coordinator summary must carry its scope or quote the producer.
    - id: S-1
      line: byte_width_arm, byte_width_endpoint_discipline, byte_width_scope
      verdict: ACCURATE, SCOPE CARRIED. All three quote the producer's own numbers and the scope line names both unmeasured directions (M0, j0) with correct prior-batch figures. One direction of understatement noted in V-3.
    - id: S-2
      line: >-
        deconfounding_power - "the 80%-power detectable ratio is about 1.73"
      verdict: OVERSTATED, MILDLY - a parameterization-dependent number is stated unconditionally. Under a sum-preserving alternative it is about 1.9. The companion 0.816 is unconditional and correct.
    - id: S-3
      line: RC_7_reached - "This removes the arm-level-implementation-offset explanation for the AES arm."
      verdict: OVERSTATED - see V-9. The producer's own sentence carries the same leap, so this is not purely a Coordinator compression.
    - id: S-4
      line: the_gap_this_batch_surfaced_and_did_not_close
      verdict: FALSE AS STATED, in the self-critical direction - see V-10. The receipt repeats the producer's own enumeration error. Recorded here because the standing instruction is to audit understatement as well as overstatement, and a campaign that under-credits its own controls will re-spend budget it does not need to spend.
    - id: S-5
      line: deconfounding, deconfounding_limits, structure_destroyed_controls, named_as_not_reached
      verdict: ACCURATE. Every count, p-value and band statement matches the artifacts, the sd arms' shared-key design is real, and the not-reached list matches the producers' own drop lists item for item.

