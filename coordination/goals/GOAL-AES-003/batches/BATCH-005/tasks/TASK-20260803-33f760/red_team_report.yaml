red_team_report:
  id: RT-20260803-33f760
  task_id: TASK-20260803-33f760
  goal_id: GOAL-AES-003
  batch: BATCH-005
  role: red-team
  reviewed_at: 2026-08-03

  assigns_no_state: >-
    THIS REPORT ASSIGNS NO OFFICIAL STATE. It sets no hypothesis status, no
    evidence strength, no claim tier, and recommends no knowledge promotion.
    Only the Coordinator does those things. Per DEC-20260731-019 ruling 3, a
    recollection may be used neither to promote NOR to dismiss, and I have used
    none in either direction: every number below was read off a file in this
    repository or computed by me in this session from such a file, and each is
    cited to its path.

  claim_tier: toy
  claim_tier_basis: >-
    Everything reviewed is a reduced-round AES-shaped SPN at r in {2,4,5,6,7,10}
    on one machine: one 2^32 diagonal coset at byte width under one key and one
    base, and a software T-table / AES-NI yoyo probe at 2^30-2^33 trials.
    Nothing here is a statement about full-round or deployed AES, and no
    comparison to published cryptanalysis is made in either direction
    (RQ-AES-003 R3).

  independence:
    session_independent: true
    model_independent: false
    implementation_independent: partial
    statement: >-
      SESSION INDEPENDENCE ONLY, NOT MODEL INDEPENDENCE, under standing basis
      0137a051eb5828789eb267fa83c8278086578d4c. This review ran in a session
      that produced neither BATCH-005 producer package. It supplies NO model
      independence: the producers, the validator, the Coordinator and this
      report all resolve to claude-opus-5 under this harness. NOTHING IN THIS
      REPORT MAY COUNT TOWARD A CLOSURE QUORUM (AGENTS rule 13 / CLAUDE.md
      rule 8). "implementation_independent: partial" means only that I
      re-executed the producers' STATISTICS from their recorded counts in my own
      code; I re-ran no counting engine and no yoyo arm.

  evidence_basis:
    snapshot_read: coordination/goals/GOAL-AES-003/batches/BATCH-005/archives/TASK-20260803-07605c/snapshot-receipt.json
    snapshot_commit_context: >-
      HEAD at review time 53b43f97 "record the VERIFIED BATCH-005 snapshot
      archive"; the producer archive is 98bbed04. The receipt binds 82 paths by
      sha256. I read the bound producer files, not working-tree-only artifacts.
    unsnapshotted_material_read_under_explicit_card_instruction: >-
      coordination/goals/GOAL-AES-003/batches/BATCH-004/tasks/TASK-20260803-367b1b/runs/
      (the SEGMENT-2 r=6 yoyo arms, committed at 5866d319 and NOT in BATCH-004's
      verified snapshot). My card's constraint 6 assigns their review to me. I
      flag that they carry weaker binding than the BATCH-005 material and say so
      in the finding below.

  claim_under_review: >-
    Three claims. (1) BATCH-005 rank 2: at GF(2^8), r=6, four-zero matrix M1,
    the fiber-divisibility signature is ABSENT, so the mechanism OBS-B3-4 named
    dies between r=5 and r=6 at byte width and the GF(2^4) analogue did not
    mislead. (2) BATCH-005 rank 4: the BATCH-004 S-box-to-S-box difference does
    not survive deconfounding (T1 p = 0.458, T4 p = 0.834 with the sign
    reversed), which strengthens the S-box-independence reading. (3) The
    Coordinator's "gap this batch surfaced": that no arm in this campaign has
    ever measured the PRP null that every excess factor divides by.

  # ============================================================
  objections:

    - id: OBJ-1
      target: The PRP-null gap, as stated in the snapshot receipt.
      severity: HIGH -- this is the most consequential item in the batch and it is FALSE AS WRITTEN.
      quote_in_full: >-
        From coordination/goals/GOAL-AES-003/batches/BATCH-005/archives/TASK-20260803-07605c/snapshot-receipt.json,
        the_gap_this_batch_surfaced_and_did_not_close.what:
        "NO ARM IN THIS CAMPAIGN HAS EVER MEASURED THE PRP NULL THAT EVERY EXCESS
        FACTOR DIVIDES BY. Every 13.5x, 20.5x and 15.63x across five batches
        rests on an analytic 4 * 2^-32 that has never been checked against a
        measurement."
      the_producer_wording_it_compresses: >-
        From coordination/goals/GOAL-AES-003/batches/BATCH-005/tasks/TASK-20260803-48a239/RESULTS.json,
        measured_vs_modeled.optimistic_assumptions_carried[0]:
        "The null expectation P(W>=1) ~ 4*2^-32 is analytic and unverified by
        measurement in this campaign; every excess factor and every ALIVE/DEAD
        verdict divides by it."
      objection: >-
        THE MEASUREMENT EXISTS AND IT IS ON DISK. BATCH-002 arms A3 and A3b are
        the identical yoyo probe run at r = 10 -- the full AES-128 permutation,
        the campaign's own available null object -- with amask = 1 and smask = 1,
        i.e. every parameter identical to the main arms except the round count.
        From BATCH-002/tasks/TASK-20260802-e4fa63/arm_A3.json: rounds 10, trials
        8589934592, W_ge1_nontrivial 5. From arm_A3b.json: rounds 10, trials
        8589934592, W_ge1_nontrivial 7. Analytic null = trials * 4 * 2^-32 = 8.0
        per arm. So 12 observed against 16.0 predicted by exactly the constant
        under dispute, over 2^34 trials. That is a measured null-object control
        at the campaign's largest single exposure, and it AGREES with 4 * 2^-32.
      my_arithmetic: >-
        Computed by me this session with a self-written exact Poisson routine.
        P(X <= 12 | lambda = 16.0) = 0.193, so the agreement is unremarkable.
        Exact 95% Poisson interval on 12 events, divided by 16.0, gives a
        measured-to-analytic rate ratio in [0.388, 1.310].
        Adding the six structure-destroyed arms (BATCH-004 Y-*-sd at 2^30: 2, 0,
        4 hits against 1.0 each; BATCH-005 SD31-* at 2^31: 2, 1, 1 against 2.0
        each) and BATCH-002 arm_A4 (r=5, amask 15, 2^32, 4 hits against 4.0)
        gives a clean should-be-null aggregate of 26 observed against 29.0
        predicted, P(X <= 26 | 29) = 0.330, ratio interval [0.586, 1.314].
        I deliberately EXCLUDE the r=6 arms from that aggregate: their nullity is
        itself a campaign claim, so using them to calibrate the null would be
        circular.
      what_survives_of_the_gap: >-
        A REAL BUT MUCH SMALLER ONE, and it should be restated rather than
        dropped. What has never been run is a null arm at an exposure large
        enough to PIN the constant: at the current 2^34 the constant is known
        only to within roughly a factor 1.3 either way. That is 10x smaller than
        the smallest excess factor the campaign reports (11.0x), so no ALIVE/DEAD
        verdict and no headline excess factor in five batches can move on it.
        The honest sentence is "the analytic null is confirmed by measurement to
        within about +/-31% at 95%, which is far tighter than any claim divides
        by", NOT "never checked".
      why_this_matters_beyond_the_sentence: >-
        The receipt elevates this to "the gap this batch surfaced and did not
        close", i.e. the batch's headline open item. If it enters the ledger in
        that form it will read to a later auditor as five batches of claims
        resting on an unverified constant. That is a fabricated liability, and
        under AGENTS rule 5 an assertion that a measurement does not exist is a
        factual assertion carrying the same burden as one that it does.

    - id: OBJ-2
      target: The endpoint substitution (fiber-divisibility as primary in place of n mod 8).
      severity: MEDIUM-HIGH -- the reasoning offered for the substitution is wrong; the verdict survives by the luck of one draw.
      quote_in_full: >-
        From TASK-20260803-6d88ba/PREREGISTRATION.md section 3:
        "These are **not independent, and B dominates A.** OBS-B4-2 records the
        red team's entailment: fiber divisibility makes the residue CERTAIN
        rather than likely. At byte width, if every fiber is `m = 256k`, then
        C(256k, 2) = 256k(256k-1)/2 = 128k(256k-1),
        which is divisible by 128 and hence by 8, for every k. So **whenever the
        divisibility signature is present, `n mod 8 = 0` is forced arithmetically
        and the residue reading carries ZERO information.** Reading A is only
        informative when Reading B is absent."
        And: "**Reading B is therefore the preregistered primary endpoint, and
        Reading A is secondary and interpreted only conditionally on B.**"
      objection: >-
        "B DOMINATES A" IS FALSE AS AN INFORMATION ORDERING, AND THE CAMPAIGN'S
        OWN DATA IS THE COUNTEREXAMPLE. The implication runs one way only:
        B present => A = 0. It is not true that B absent => A free, and the
        campaign's entire r=5 byte-width counting signal is exactly the case
        B-absent-yet-A-forced. From BATCH-001/tasks/count5/raw.jsonl, the seven
        arms tagged aes_r5 (trial5_0 .. trial5_6, AES MixColumns, no zero
        entries, seven distinct keys and bases, j0 in {0,1,2,3}) read
        n = 2147430696, 2147459328, 2147193296, 2147610584, 2147427792,
        2147022152, 2147144880, 2147660512 -- every one with n_mod8 = 0 and
        max_occ 11-13, i.e. Poisson-shaped histograms with fibers at size 1, so
        gcd 1 and no divisibility whatsoever. Under a free residue that is
        8^-7 = 4.8e-7. So YES: a configuration can force the residue by a route
        that produces neither divisibility nor an anomalous histogram, and the
        campaign has measured that route eight times. BATCH-002 M0 at r=5 does
        the same at both j0 = 0 (n = 2147411968, max_occ 12) and j0 = 1
        (n = 2147031240, max_occ 12).
      consequence_for_what_a_null_means: >-
        Endpoint B is a PROPER SUBSET of the phenomenon, not a dominating
        summary of it. A null on B at r=6 therefore closes a strictly narrower
        question than "is the r=5 residue-forcing mechanism dead at r=6". The
        producer states, in RESULTS.json comparison_to_BATCH004_nibble_figures.
        recorded_because_it_is_inconvenient, "The verdict above rests on the
        divisibility signature, not on the residue, and would be unchanged had
        the residue landed on 0." THAT BRANCH IS THE FAILURE MODE: had the
        residue landed on 0, the verdict "CONFIRMS" would have been recorded
        while the route that actually carries the campaign's r=5 signal -- A
        forced with B absent -- was still alive at r=6 and untested. The
        substitution was safe here by the draw, not by design.
      the_producer_also_UNDERSTATED_its_own_result_in_the_other_direction: >-
        RESULTS.json HEADLINE.what_this_does_NOT_establish[3] says "The residue
        endpoint alone would be 1/8-level." That framing is right for CONFIRMING
        forcing and WRONG for REFUTING it. "Forced" is a deterministic property.
        A single reading of n mod 8 = 6 at r=6 under M1 (RESULTS.json
        arms_measured.r6_M1.engine_report.n_mod8 = 6) refutes forcing outright at
        that configuration, with no 1/8 discount. The same holds for r6_CTRL at 4,
        and for BATCH-001's two r=6 arms at 7 (j0=2) and 4 (j0=1). Four byte-width
        r=6 readings, none of them 0, is decisive against forcing at r=6 and is a
        stronger statement on endpoint A than the producer claimed.
      narrow_correction_requested: >-
        Replace "B dominates A" with "B present entails A = 0; B absent entails
        nothing about A", and state the r=6 verdict on BOTH endpoints, since both
        read negative.

    - id: OBJ-3
      target: '"OBS-B3-4 closes at byte width" -- what one arm at one j0 under one key actually closes.'
      severity: MEDIUM -- the arm is well-designed and the receipt already carries most of the scope; the residual open set needs to be named exactly, and the receipt weights the wrong caveat.
      what_the_arm_genuinely_closes: >-
        More than a sceptic would grant at first sight, and I say so. The arm is
        EXACTLY PAIRED to its r=5 predecessor: same engine (cnt.c sha256
        7a32d928e264e5b3a960108d106f08c7e02f9e2d16db18ed85e04ba160f41c5b,
        byte-identical to BATCH-002's), same matrix, same key
        6fe52e2e9b3ea04085c370f9bc609245, same base, same j0 = 0. BATCH-002's
        M1_r5_j0 read max_occ 2816 with every fiber a multiple of 256; this arm
        at r=6 reads max_occ 12, gcd 1, 12 distinct fiber sizes, a Poisson
        histogram. Only the round count changed. That is a clean single-factor
        contrast, not a cross-configuration comparison, and the counting engine
        is deterministic (no RNG), so the reading is exact rather than sampled.
      the_receipt_weights_the_WRONG_open_dimension: >-
        The receipt says, in outcomes_as_reported_scope_carried.byte_width_scope:
        "BATCH-002's r=4 result -- 547608330240 at the critical j0 against exactly
        0 at a non-critical one -- shows j0 can matter enormously for zero-entry
        matrices."
        That fact is real (BATCH-002 raw.jsonl labels M0_r4_j0_CRIT and
        M0_r4_j1_NONCRIT) but it is about M0 AT r=4, a different matrix at a
        different round. For the matrix and round family actually under test the
        record points the other way: M1 at r=5 carries the divisibility signature
        at BOTH measured indices -- j0 = 0 (max_occ 2816) and j0 = 1
        (max_occ 2304). The r=5 M1 mechanism is NOT j0-selective across the two
        indices anyone has measured, so a j0 sweep at r=6 has a LOW prior of
        surprise and should not head the queue.
      the_dimension_that_is_actually_untested: >-
        THE KEY. Every byte-width zero-entry arm in this campaign -- BATCH-002's
        four and BATCH-005's two -- uses the single pair key
        6fe52e2e9b3ea04085c370f9bc609245 / base e35f00e7631cdd862e59d126e72b8fc9.
        The fiber-degeneracy mechanism is a statement about a keyed permutation;
        it has never been observed to appear or disappear under a second key at
        byte width. That is the one dimension where a contradiction is cheap to
        imagine and has never been looked for.
      the_M0_half_of_RC_2_is_near_worthless_and_should_be_deprioritised: >-
        The queue keeps carrying "GF(2^8) M0 at r=6" as the other half of the
        byte-width question. It is not. M0 at r=5 at byte width ALREADY has no
        divisibility signature -- BATCH-002 M0_r5_j0 max_occ 12, M0_r5_j1
        max_occ 12 -- so there is nothing at r=6 for it to lose. Running it can
        only confirm the absence of an absence. The producer half-said this
        ("the LESS informative of the two"); I say it fully: drop it below the
        second-key arm and below r=7.
      precise_statement_of_what_remains_open: >-
        OBS-B3-4 is closed FOR: the four-zero matrix M1, at j0 = 0, under key
        6fe52e2e9b3ea04085c370f9bc609245 and base e35f00e7631cdd862e59d126e72b8fc9,
        at r = 6, on one engine with no cross-engine replication.
        It remains open FOR: (i) any second (key, base) pair -- untested at byte
        width for any zero-entry matrix at any round; (ii) r = 7, where
        oscillation rather than monotone decay is untested at byte width;
        (iii) j0 in {2,3} at r = 6 -- open but low-prior for the reason above;
        (iv) cross-engine replication of the single r6_M1 count, which rests on
        one engine with an internal n/n_alt identity and an external
        recomputation from the same histogram, i.e. two checks that share the
        histogram and cannot catch a systematic scatter error.
      it_closes_one_corner_not_the_item: >-
        Direct answer to the card: ONE ARM CLOSES ONE CORNER. The corner it
        closes is the one the mechanism actually lived in, which is more than
        nothing and less than the item.

    - id: OBJ-4
      target: The deconfounding null and the inference "not attributable to the S-box".
      severity: MEDIUM -- the design is the best in the campaign; the reporting substitutes a power figure where an interval belongs.
      what_i_verified_myself: >-
        I recomputed all four preregistered tests this session from the nine
        counts in RESULTS.json (AES 14, 14, 8; R1 22, 11, 14; R2 15, 15, 14) in
        my own code, without importing stats_lib.py:
        T1 (S-box, pooled 36 / 47 / 44) G2 = 1.5599, 2 df, p = 0.45842 --
        producer reports 0.458.
        T2 (block, 51 / 40 / 36) G2 = 2.7939, p = 0.24735 -- reports 0.247.
        T3 (nine cells) G2 = 7.7596, 8 df, p = 0.45730 -- reports 0.457.
        T4 (47 vs 44, exact conditional binomial, two-sided by doubling the
        smaller tail) p = 0.83408 -- reports 0.834.
        ALL FOUR REPRODUCE. The pairing audit also holds on inspection: within
        every block the three arms carry identical key_hex AND identical
        thread_seeds, so the S-box is the only factor that moves. This is exact
        pairing and it is verified in the data, not asserted.
      the_power_arithmetic_checks_out: >-
        The card asks whether 0.816 licenses the claim. The arithmetic is
        CORRECT. BATCH-004's 11.0x and 20.5x are per-2^30 rates, so at this
        task's 3 x 2^30 exposure they imply lambda_R1 = 33.0 and
        lambda_R2 = 61.5. My own exact enumeration over Poisson(33) x
        Poisson(61.5), rejecting where the two-sided conditional binomial p is
        below 0.05, gives power 0.8156. The producer reports 0.8156 (extras.py,
        results_extras.json). I could not break it.
      but_the_80_percent_detectable_ratio_is_parameterised_optimistically: >-
        extras.py fixes the LOWER arm at the observed grand mean
        (baseline_rate_used_per_2p30 = 14.11) and scales the upper arm UP by the
        ratio. Under that parameterisation I reproduce power 0.8004 at ratio
        1.73, matching the reported 1.73. But it implies a two-arm total of about
        116 hits, 27% more than the 91 actually observed for R1+R2. Holding the
        total at the observed 91, my exact computation puts the 80%-power ratio
        at about 1.85, not 1.73. The reported minimum detectable effect is
        therefore about 7% optimistic in ratio terms. Not a fabrication -- a
        parameterisation choice that is not stated.
      the_real_objection_powering_against_a_selected_estimate: >-
        0.816 is power against the BATCH-004 POINT ESTIMATE, and that estimate is
        the winner of an uncorrected contrast among three arms at p = 0.023 --
        the producer says so itself ("BATCH-004's p = 0.023 was a single
        uncorrected contrast among three arms"). Selected estimates are inflated;
        powering against one systematically overstates how informative a
        subsequent null is. The honest complement is an interval on the effect,
        which nobody computed.
      the_interval_nobody_computed_and_it_helps_the_producer: >-
        I computed it. From 47 vs 44 at equal exposure, the exact
        (Clopper-Pearson) 95% interval on the R2:R1 rate ratio is
        [0.606, 1.443]. BATCH-004's 1.86 lies OUTSIDE it. So the data do not
        merely fail to detect the BATCH-004 effect -- they EXCLUDE an effect of
        that size at 95%, which is a stronger and more durable statement than the
        power figure and does not depend on a selected estimate. It also bounds
        the claim honestly in the other direction: ratios up to about 1.44 are
        NOT excluded, so "the S-box does not matter" is not licensed; "an S-box
        effect larger than about 1.44x on this statistic at this exposure is
        excluded" is.
      the_key_null_does_not_undermine_the_S_box_conclusion: >-
        Direct answer to the card. T2's p = 0.247 does NOT make the S-box null
        an absence of power dressed as a finding, and the reason is structural
        rather than statistical: the S-box contrast is WITHIN-BLOCK with key and
        stream held byte-identical, so it does not need the key effect to be
        estimable. What the T2 null does forbid is the causal story. The
        preregistration's own sentence -- "It would mean the apparent S-box
        effect was key variation all along" (PREREGISTRATION.md section 1,
        Predictions) -- is NOT supported: this design cannot attribute the
        BATCH-004 difference to the key rather than to chance, and the producer
        corrects itself later (HONEST_LIMIT_ON_THE_WORD_VANISH). The Coordinator
        receipt propagates the earlier sentence in its deconfounding headline and
        the later one only in deconfounding_limits.
      a_design_criticism_the_producer_did_not_make: >-
        THE ANALYSIS THROWS AWAY THE PAIRING IT PAID FOR. The three arms in a
        block consume the identical p0/p1/swap stream, so the hits are indexed by
        the same trials. The preregistered tests are unpaired Poisson G2 and an
        unconditional binomial on pooled counts -- they use only the totals. The
        instrument records whist and W_ge1_by_word but not WHICH trials hit
        (yoyo_sbox_v2.c worker() increments J->wge1 and discards the index), so
        the paired information was never written out. A trial-index log costs
        nothing and buys both power and, more importantly, a discriminating
        control: see RC-11.

    - id: OBJ-5
      target: Coordinator summary lines in the BATCH-005 snapshot receipt (the CORR-20260803-791ca7 check).
      severity: MEDIUM -- one line is wrong on the merits, two compress away a stated scope.
      finding_1_wrong_on_the_merits: >-
        Quoted in full from the receipt,
        outcomes_as_reported_scope_carried.byte_width_endpoint_discipline:
        "The producer froze the FIBER-DIVISIBILITY SIGNATURE as the primary
        endpoint rather than n mod 8, because OBS-B4-2's entailment makes the
        residue arithmetically certain whenever divisibility is present --
        C(256k,2) = 128k(256k-1) -- so the residue carries ZERO information in
        exactly the case under test, and one 2^32 pass is one trial at the 1/8
        level. The verdict rests on the structural endpoint and would be
        unchanged had the residue landed on 0."
        THE CLAUSE "in exactly the case under test" IS FALSE. The producer's
        sentence is conditional -- "Reading A is only informative when Reading B
        is absent" -- and in the case actually under test, r=6 under M1, Reading
        B WAS ABSENT. The residue was therefore informative there, and by OBJ-2
        it was the reading that decisively refuted forcing. The compression drops
        the conditional and so misattributes which endpoint carried the r=6
        result. This is the same defect class CORR-20260803-791ca7 names.
      finding_2_compression: >-
        Receipt, byte_width_arm: "The mechanism OBS-B3-4 named dies between r=5
        and r=6 at byte width, and the 32x-vs-2x mod-8 margin gap the BATCH-004
        validator flagged did not move the transition round." The preceding
        clause of the same field does carry "FOR M1 AT j0=0 ONLY", so the field is
        scoped in context; the sentence is not scoped in isolation and MUST NOT
        be lifted into an evidence or decision record on its own. It also omits
        "under one key and one base", which OBJ-3 identifies as the untested
        dimension.
      finding_3_compression: >-
        Receipt, deconfounding: "THE S-BOX-TO-S-BOX DIFFERENCE DOES NOT SURVIVE
        DECONFOUNDING, AND THIS STRENGTHENS THE S-BOX-INDEPENDENCE READING RATHER
        THAN WEAKENING IT." Removing evidence AGAINST independence is not
        evidence FOR independence. The supportable version is the interval in
        OBJ-4: an S-box effect above about 1.44x is excluded at 95%; effects
        below it are not. The receipt's deconfounding_limits field carries the
        producer's own caveat, so the scope is present in the receipt as a whole
        -- but the headline sentence is the one that travels.
      finding_4: >-
        See OBJ-1: the receipt's "gap" field is not a compression defect but a
        propagated factual error, and it is the receipt's own framing that
        elevates it to the batch's headline open item.
      lines_i_checked_and_found_ACCURATE: >-
        structure_destroyed_controls ("All three inside band (AES 1.0x, R1 0.5x,
        R2 0.5x)") -- verified against runs/SD31-*.json: 2, 1, 1 hits at trials
        2147483648, analytic null 2.0. Correct.
        RC_7_reached -- verified against runs/rc7_aesni_vec.json: ten round
        vectors, roundtrip_failures_r1_to_r10 = 0, and rc7_aesni_vec.c does copy
        the AES-NI path. Correct.
        deconfounding_power (0.816, 1.73) -- arithmetic correct; see OBJ-4 for
        the parameterisation caveat.
        byte_width_scope's list of dropped arms and the 8 GB / 1-thread scatter
        explanation -- matches RESULTS.json deviations D-1 and D-2 and
        runs_not_completed. Correct, and correctly labelled resource exhaustion
        rather than negative evidence (AGENTS rule 3).

    - id: OBJ-6
      target: RANK 1 -- the BATCH-004 SEGMENT-2 r=6 yoyo decay arms, reviewed here for the first time.
      severity: LOW on the reading itself; MEDIUM on its binding.
      what_they_are: >-
        BATCH-004/tasks/TASK-20260803-367b1b/runs/Y-{AES,R1,R2}-main-r6.json.
        rounds 6, amask 1, smask 1, trials 2147483648, analytic null
        1.9999999981. Hits 1, 2, 0.
      the_pairing_is_exact_and_i_checked_it_field_by_field: >-
        Each r=6 arm carries the SAME seed, arm_id, key_hex and thread_seeds as
        its r=5 counterpart:
        AES seed 431001, arm_id 1, key 25b3faa13dbaeaab5491571199979d53,
        thread_seeds [11400714758318102301, 4354685486758105890] -- r=5 gives 27
        hits, r=6 gives 1.
        R1 seed 431002, arm_id 2, key 92798536b7d5707d01e8a69ac805d8d0 -- 22 then 2.
        R2 seed 431003, arm_id 3, key 627ba325224589ece456768ec8c9614b -- 41 then 0.
        Rounds is the only field that differs. This is the strongest single-factor
        pairing anywhere in the campaign and I could not break it.
      adversarial_check_i_ran_against_it: >-
        The obvious artifact hypothesis is that the r=6 path is silently broken
        and returns nothing. It is not: the three arms return 3 hits in total
        against 6.0 expected, i.e. the probe still fires at the null rate rather
        than at zero, and R1 returns 2. A dead code path would have returned 0,
        0, 0. Independently, BATCH-002's AES-NI probe -- a DIFFERENT
        implementation -- reads r=6 at 6 hits / 4.0 (arm_A2, 2^32) and 7 / 8.0
        (arm_A2b, 2^33). Two implementations agree that r=6 sits at the null.
      what_i_will_and_will_not_say: >-
        I VALIDATE NOTHING; that is not my role and this report assigns no state.
        What I record is that I attacked these three arms and found no defect in
        their pairing, their exposure, their arithmetic or their agreement with a
        second implementation. Their binding is weaker than the rest of BATCH-005:
        they sit at commit 5866d319 and are NOT inside any dispatcher-verified
        snapshot, so a Coordinator quoting them should say so.
      residual: >-
        These arms make the r=6 death of the yoyo statistic the most replicated
        negative in the campaign: two implementations, three S-boxes, four keys,
        exposures 2^31 to 2^33.

    - id: OBJ-7
      target: The r-profile of the yoyo statistic -- an artifact tell nobody has checked.
      severity: HIGH as a gap; this is the cheapest unrun measurement with the largest blast radius.
      the_protocol_question: >-
        docs/inventor-protocol.md section 3 asks what the reported quantity
        should have done as the destroying parameter increases. Here the
        destroying parameter is the round count, and the answer is: the excess
        should be MONOTONE DECREASING in r, from saturation at low r to the null.
        The measured profile is r=2 saturated (BATCH-002 arm_PC: 2^20 trials,
        W_ge1_nontrivial 1048576, i.e. 100%), r=5 about 12-15.6x, r=6 about 1x,
        r=10 about 0.75x.
      the_hole: >-
        r=3 AND r=4 HAVE NEVER BEEN RUN ON THE YOYO INSTRUMENT. I enumerated
        every file in coordination/goals/GOAL-AES-003/batches containing a
        W_ge1 field and the round counts present are exactly {2, 5, 6, 10}.
        The profile therefore jumps from 100% at r=2 to 1.4e-8 absolute rate at
        r=5 with nothing in between, and the claim "the effect is round-limited"
        rests on the decreasing half only.
      why_it_matters: >-
        If r=4 does not sit strictly between r=2 and r=5 -- in particular if it
        reads at or near the null while r=5 reads 13x -- the quantity is not
        decaying with rounds at all and the r=5 peak is a property of the probe's
        geometry rather than of the cipher. That would take BATCH-002's A1/A1b,
        BATCH-004's mains and BATCH-005's ITEM 1 with it in one reading.
      cost: seconds -- see RC-9.

    - id: OBJ-8
      target: RC-8's recorded cost, which caused the one upgrade-capable control to be declined.
      severity: MEDIUM -- a ranking error, not an evidence error.
      quote_in_full: >-
        From BATCH-004/tasks/TASK-20260803-cc92f0/red_team_report.yaml, RC-8:
        "control: 27 further random bijective S-box draws at r=5, if a real S-box
        independence claim is wanted rather than a two-point observation (OBJ-7).
        cost: about 75 minutes at 2^30 per arm"
        And from BATCH-005/tasks/TASK-20260803-48a239/RESULTS.json,
        checks_that_did_not_run: "RC-8 27 further random S-box draws ... reason:
        about 75 minutes per arm; far outside this budget."
      objection: >-
        THE COST FIGURE IS WRONG BY ABOUT A FACTOR OF 28 AND THE MEASUREMENT
        CONTRADICTING IT IS IN THE SAME BATCH. A 2^30 arm on two threads took
        158.79, 157.48, 155.74, 156.42, 156.80, 156.72, 155.68 seconds in
        BATCH-005 ITEM 1 (RESULTS.json measurements.item_1_arms[*].timing), and
        BATCH-004's own budget file records 158.04, 157.43, 158.78 s for its
        2^30 arms and 309.31, 303.88, 303.09 s for its 2^31 arms. So 27 draws at
        2^30 cost about 27 x 158 s = 71 MINUTES IN TOTAL, not 75 minutes each.
      consequence: >-
        RC-8 is the ONLY control in the queue that can convert a scoped two-draw
        observation into a real independence statement -- EV-AES-c66a80 OBS-B4-3
        records that 29 consecutive preserving draws are what a 0.90 lower bound
        needs, and two draws currently give 0.224. It has been declined twice on
        a cost figure that the campaign's own timings refute. This is the single
        largest ranking correction I can offer the Coordinator.
      caveat_i_will_not_hide: >-
        Both timing sets are from this hardware under the stated contention. If a
        future box is slower the figure moves; the factor-of-28 discrepancy will
        not.

  # ============================================================
  required_controls:

    - id: RC-9
      control: >-
        Yoyo at r=3 and r=4 on the existing binary, amask 1, smask 1, AES S-box,
        seed 531001 armid 1 so it pairs exactly with D-AES-K1. Trials 2^22 at
        r=4 (analytic null 0.0039) and 2^20 at r=3; raise r=4 to 2^28 if the
        small run reads at chance.
      cost: under 60 s total on two threads, extrapolating from 158 s at 2^30.
      falsifies_if: >-
        r=4 reads at or below the r=5 excess factor, or reads at the null. Either
        breaks monotonicity in the round count and makes the r=5 peak a probe
        geometry artifact rather than a decay phenomenon.
      predicted_if_the_reading_is_right: >-
        r=3 saturated or near it, r=4 strictly and substantially above r=5's
        13-15x, plausibly saturated too.
      priority: 1
      status: NEVER RUN, and never previously named by any reviewer.

    - id: RC-10
      control: >-
        NULL-OBJECT SCALING TEST. Modify worker() to also count trials where d is
        zero on the first k bytes of PW[j] for k = 1, 2, 3 (the existing count is
        k = 4), and run it at r = 10 (the null object) and at r = 5 (the live
        arm), 2^24 trials each. Under the independence assumption behind
        4 * 2^-32 the k=2 rate is about 4 * 2^-16 = 6.1e-5, so 2^24 trials yields
        roughly 1000 events -- enough to pin the constant to a few percent at a
        cost the 32-bit endpoint can never reach.
      cost: about ten lines in yoyo_sbox_v2.c plus two runs of a few seconds each.
      falsifies_if: >-
        the r=10 rate does not fall by a factor of 2^8 for each additional
        constrained byte. That would mean the analytic null is wrong and every
        excess factor in five batches is wrong by the same factor -- the thing
        OBJ-1's "gap" was worried about, tested properly and cheaply instead of
        by brute exposure.
      also_diagnostic: >-
        Run at r=5 it asks whether the excess is a genuine 32-bit word
        coincidence or is already present at k=1, i.e. whether the four-byte
        framing is doing any work. This is the only proposal in the queue that
        could produce a MECHANISM rather than another rate.
      priority: 2
      status: NOT RUN. It is the cheap, correct replacement for RC-6's second half.

    - id: RC-11
      control: >-
        Log the trial index of every hit, re-run one seed block (three arms,
        about 8 minutes), and test the overlap of hit indices across the three
        S-boxes. The streams are byte-identical by construction, so the indices
        are comparable.
      cost: about 480 s plus a trivial code change.
      falsifies_if: >-
        the same trial indices hit under all three S-boxes. That would mean the
        hit is determined by the drawn plaintext pair and the swap, not by the
        cipher, and the statistic is reading the sampler rather than the object.
      predicted_if_the_reading_is_right: >-
        overlap consistent with independence -- with about 14 hits per arm in
        2^30 trials, any overlap at all is a finding.
      priority: 3
      status: NOT RUN. The pairing that makes it possible was bought in BATCH-005 and then discarded by the analysis.

    - id: RC-12
      control: >-
        GF(2^8) M1 at r=6, j0=0, under a SECOND (key, base) pair, everything else
        identical to arm_r6_M1.
      cost: about 2000 s at cw=16 with the 8 GB array, from the measured 1996.27 s.
      falsifies_if: >-
        the divisibility signature is PRESENT. That reopens OBS-B3-4 and shows
        this batch's headline was a one-key accident.
      priority: 4
      status: NOT RUN. This, not the j0 sweep and not M0, is the untested dimension.

    - id: RC-2-REMAINDER
      control: GF(2^8) M1 and CTRL at r=7, byte width, j0=0, same key.
      cost: about 2000 s (M1, cw=16) plus about 800 s (CTRL, cw=8), and they cannot run concurrently under the 8 GB cap.
      falsifies_if: divisibility reappears at r=7 -- oscillation rather than decay.
      priority: 5
      note: >-
        The M0-at-r=6 half of RC-2 as previously written should be DROPPED to
        last: M0 has no r=5 byte-width signature to lose (max_occ 12 at j0=0 and
        j0=1), so its r=6 arm can only confirm the absence of an absence.

    - id: RC-8-REPRICED
      control: 27 further random bijective S-box draws at r=5, 2^30 each.
      cost: about 71 minutes IN TOTAL at 158 s per arm (measured), not 75 minutes per arm.
      what_it_buys: >-
        29 consecutive preserving draws is what EV-AES-c66a80 OBS-B4-3 says a
        0.90 lower bound needs; the current bound is 0.224 from two draws. It is
        the only queued item that upgrades a scoped observation into an
        independence statement rather than tightening an interval.
      priority: 6
      status: DECLINED TWICE ON A COST FIGURE OFF BY ~28x. See OBJ-8.

    - id: RC-4
      control: Null-object control for the mod-8 statistic on the GF(2^4) nibble instrument -- identical projection and statistic applied to a uniformly random bijection and to a uniformly random function.
      cost: seconds of compute; the real cost is standing the harness up in a task directory.
      status: STILL NOT RUN after two batches of being named. inventor-protocol section 3 asks for it before belief, and it is the only outstanding item that is a protocol requirement rather than a preference.
      priority: 7

    - id: RC-5
      control: 400 trials per decayed nibble cell rather than 40, with the paired comparison the design already pays for.
      cost: minutes.
      why_still_wanted: the two engines read 4/9/7 against 7/3/5 at r=6 -- concordant in verdict, unresolved in numbers.
      priority: 8

  # ============================================================
  counterexample_or_mutation: >-
    THE CHEAPEST DISCRIMINATING MEASUREMENT IN THE WHOLE QUEUE IS RC-9, AND IT
    COSTS UNDER A MINUTE. Run the yoyo at r=4 with the AES S-box, amask 1,
    smask 1, seed 531001, armid 1 -- identical to D-AES-K1 in every parameter
    except rounds -- at 2^22 trials. If the excess factor at r=4 is not
    substantially LARGER than the 12-15.6x measured at r=5, the statistic is not
    decaying with round count and the r=5 peak belongs to the probe's geometry
    rather than to the cipher. Every yoyo claim in five batches rests on a
    monotone r-profile that has been measured only on one side of its peak.
    Second cheapest and independent of it: RC-10's k-byte scaling at r=10, which
    tests the analytic null's independence assumption directly instead of by
    brute exposure.

  baseline_comparison:
    applicable: false
    statement: >-
      NO ALGORITHMIC BASELINE COMPARISON IS AVAILABLE OR PERMITTED HERE, and
      saying so is the honest answer rather than an omission. Nothing in
      BATCH-005 is an attack: no key is recovered, no distinguisher is proposed
      for use, no cost is claimed against exhaustive search. Pollard-rho and BSGS
      are ECDLP baselines and are irrelevant to a block-cipher counting statistic.
      RQ-AES-003 R3 forbids comparison to published cryptanalysis in either
      direction, so the closest specialized baseline cannot be invoked to praise
      or to dismiss this work. The only baselines in scope are the campaign's own
      analytic nulls, and those are examined in OBJ-1 and RC-10.
    dominated_by_field_check: >-
      No record in this batch carries a dominated_by field or a sota_delta, and
      none should: there is no claimed speedup and no Pareto frontier to sit on.
      An unchecked null in that field would be a fabrication under AGENTS rule 5;
      an absent field on a pure-measurement record is correct.
    exposure_accounting_check: >-
      The one place a cost was implicitly charged is the excess factor, which
      divides a measured count by an analytic null. I verified the divisor
      against measurement in OBJ-1 rather than accepting it.

  heuristic_challenges:
    - id: HC-1
      heuristic: 'Implicit heuristic 1: P(W>=1) ~ 4 * 2^-32 under a random-permutation model (yoyo_sbox_v2.c line 28: "Analytic null: P(W>=1) ~ 4 * 2^-32, so NULL = trials * 2^-30").'
      status: EXPLICIT IN THE SOURCE, NOT NUMBERED ANYWHERE, and justified by a union bound over four 32-bit words with no stated error term.
      challenge: >-
        The union bound over four words is exact to O(2^-64) only if the four
        word-events are near-independent and each has probability exactly 2^-32.
        Neither is argued. The transfer question is the standard one: q0 and q1
        are decryptions of two ciphertexts that differ in a CONTROLLED way (one
        swapped word), so d = q0 ^ q1 is not a difference of two independent
        uniform draws by construction -- it is the object the whole experiment is
        about. Asserting the random model for it and then measuring deviations
        from that model is the assumption doing the work.
      cheapest_exposure: RC-10. The k-byte scaling law is the direct test and it costs seconds.
      current_empirical_standing: >-
        Confirmed to a rate ratio of [0.586, 1.314] at 95% by 26 events across
        nine should-be-null arms (OBJ-1). Adequate for 11x-15.6x verdicts,
        inadequate to call a 2x effect.
    - id: HC-2
      heuristic: 'Implicit heuristic 2: a GF(2^4) nibble SPN is an adequate analogue for GF(2^8) round structure.'
      status: EXPLICIT AND NOW PARTLY DISCHARGED, which is to the campaign's credit.
      challenge: >-
        The BATCH-004 validator's objection was quantitative -- the mod-8 margin
        is 32x the modulus at byte width against 2x at nibble width -- and the
        r=6 M1 arm answers it for the four-zero matrix at one index under one key.
        What is not discharged is the direction of the analogy: the analogue was
        used to predict WHERE a transition sits, and one confirming instance does
        not license using it to predict anything else (S-box dependence, MDS
        branch number, key dependence), which EV-AES-c66a80's boundary already
        says.
    - id: HC-3
      heuristic: 'Implicit heuristic 3: splitmix64 is an adequate source for plaintext and key draws.'
      status: EXPLICIT AND UNTESTED; the producer names it itself under optimistic_assumptions_carried.
      challenge: >-
        Low priority, with one exception that is not low priority. The exact
        pairing in ITEM 1 makes the three arms of a block share a stream, so any
        structure in that stream is common to all three and cancels in the S-box
        contrast -- pairing protects the primary test. It does NOT cancel in the
        ABSOLUTE excess factors, which are what every headline reports. RC-10 at
        r=10 also tests this indirectly: a sampler pathology would show up as a
        k-scaling deviation under the null object.

  cost_model_challenges:
    - id: CC-1
      challenge: >-
        RC-8 mispriced by about 28x, blocking the one upgrade-capable control.
        See OBJ-8. This is the batch's most actionable cost error.
    - id: CC-2
      challenge: >-
        The byte-width arm's binding constraint is MEMORY, not CPU, and the
        record says so honestly (RESULTS.json budget.memory_discipline: the 8 GB
        cw=16 array for M1 means nothing can run beside it). The consequence is
        under-stated: at 8 GB the campaign can run exactly ONE M1-class arm at a
        time, so the byte-width queue is serialised at about 2000 s per arm
        regardless of core count. Four remaining byte-width arms (RC-12, r=7 M1,
        r=7 CTRL, one j0) is about 2 hours of WALL CLOCK that cannot be
        parallelised under the current cap. A Coordinator ranking these must
        price them serially.
    - id: CC-3
      challenge: >-
        The 1996 s for r6_M1 against about 535 s for the comparable BATCH-002
        r=5 arm is attributed to TLB and cache pressure from a 1-thread scatter
        over 8 GB (deviation D-1). The attribution is plausible and untested. It
        matters for planning: if the cause is instead something r-dependent in
        the engine, every byte-width cost estimate above is 3.7x optimistic. A
        one-line check -- re-run r6_CTRL at 1 thread and compare against its
        measured 807.62 s at 2 threads -- would settle it for about 1600 s, and I
        do not think it is worth 1600 s unless the byte-width queue is continued.
    - id: CC-4
      challenge: >-
        Per-attempt versus total expected cost does not arise here: nothing in
        this batch claims an attack with a success probability, so there is no
        inverse-probability factor to omit. I checked for it and it is genuinely
        absent rather than hidden.

  reduction_and_scope_challenges:
    - id: SC-1
      challenge: >-
        SCOPE IS NOT INFLATED IN THE PRODUCER ARTIFACTS, and I want that on the
        record because it is unusual. Both preregistrations state the toy tier,
        both name their dropped arms with what each would have settled, both
        state what no outcome could establish, and TASK-20260803-6d88ba records
        its inconvenient residue reading under a field literally named
        "recorded_because_it_is_inconvenient". The scope problems in this batch
        are in the Coordinator's compressions (OBJ-5) and in one propagated
        factual error (OBJ-1), not in the measurements.
    - id: SC-2
      challenge: >-
        No corollary in this batch is obtained by citing a reduction, so there is
        no cited-theorem instantiation to audit. The one entailment used --
        divisibility by 256 implies n mod 8 = 0, via C(256k,2) = 128k(256k-1) --
        I verified directly: 128k(256k-1) is divisible by 128 for every integer
        k, hence by 8. The entailment is correct. Its USE as an endpoint ordering
        is what fails, per OBJ-2.
    - id: SC-3
      challenge: >-
        Affected-versus-safe scheme scope: not applicable and correctly absent.
        No scheme is named as affected anywhere in this batch, and RQ-AES-003 R3
        forbids the comparison that would be needed to name one.

  proof_architecture_challenges:
    - id: PA-1
      attack: Observation-fiber attack on the fiber-divisibility endpoint.
      result: SUCCESSFUL -- see OBJ-2.
      detail: >-
        Hold the claimed observation (divisibility ABSENT, Poisson histogram)
        fixed and vary the object: BATCH-001's seven aes_r5 arms and BATCH-002's
        two M0 r=5 arms all sit on the "residue forced" side of the conclusion
        with the observation absent, while BATCH-005's r6_M1 and r6_CTRL sit on
        the "residue free" side with the same observation absent. Preimages on
        both sides. The missing separator is whatever distinguishes r=5 from r=6
        in the no-divisibility regime, and the campaign has no candidate for it.
    - id: PA-2
      attack: Quantifier-order attack on "the mechanism dies between r=5 and r=6 at byte width".
      result: PARTIALLY SUCCESSFUL.
      detail: >-
        The measured statement is "there exists a (matrix, j0, key, base) for
        which the signature is present at r=5 and absent at r=6". The sentence as
        written invites reading "for all". The witness was chosen after the r=5
        result was known -- j0=0 and this key are precisely where the r=5 signature
        was largest -- which is the right design choice for a decay test and the
        wrong one for a universal claim. RC-12 is the fix.
    - id: PA-3
      attack: Nearby-object attack.
      result: SUCCESSFUL AND USEFUL.
      detail: >-
        The nearest object for which the desired conclusion is false is M0 at
        byte width at r=5: it has NO divisibility signature yet forces the
        residue at both measured j0. The reasoning behind the endpoint
        substitution cannot distinguish it, which is exactly OBJ-2. The missing
        ingredient is a characterisation of the non-degenerate residue-forcing
        route, and nobody in five batches has proposed one.
    - id: PA-4
      attack: Method-ceiling attack on the yoyo instrument.
      result: DECISIVE AND WORTH STATING PLAINLY.
      detail: >-
        Ceiling under ideal tuning: the statistic's absolute rate at r=5 is about
        1.4e-8 per trial, and at r=6 it is indistinguishable from 4 * 2^-32 at
        exposures up to 2^33 in two implementations. To resolve a hypothetical
        2x excess at r=6 with 80% power needs of order 100 null events, i.e.
        about 2^37 trials -- roughly 12 hours per arm on this hardware at the
        measured 158 s per 2^30. THE INSTRUMENT'S CEILING IS THEREFORE r=6 AT
        ABOUT A 2x RESOLUTION, and no amount of tuning within the current design
        reaches r=7. This is the quantitative form of "no direction past r=6" and
        it is a fact about the instrument, not a fatigue report.
    - id: PA-5
      attack: Compositional-invariant attack.
      result: NOT APPLICABLE -- no strengthened invariant and no recursion is claimed anywhere in this batch.

  # ============================================================
  the_ruling_this_batch_exists_to_reach:
    ruling: PAUSE GOAL-AES-003 ON A STATED RESUME CONDITION, AFTER DISCHARGING ONE CORRECTION AND TWO ONE-MINUTE CONTROLS.
    i_am_not_recommending_closure: >-
      Explicitly not. A pause is not a terminal barrier statement, needs no
      quorum, and asserts nothing about the problem. I am also NOT endorsing
      outcome (d) yet: a barrier statement at the inventor-protocol section 4
      standard requires a named obstruction with an argument, and PA-4 is the
      first thing in this campaign that looks like one -- but it is an obstruction
      about THIS INSTRUMENT at r=6, which is a much smaller claim than a barrier
      statement for RQ-AES-003, and it has not been reviewed by anyone.
    do_i_have_a_live_direction: >-
      NOT ONE THAT TARGETS THE QUESTION. I will not manufacture one. Outcomes
      (a), (b) and (c) of RQ-AES-003 all require either an executed attack or a
      distinguisher surviving past this program's own measured death round, and
      after five batches there is no candidate mechanism for anything past r=6 --
      my predecessor said it had none, and I have none either. PA-4 now upgrades
      that from a fatigue report to a measured statement about the instrument's
      ceiling, which is progress of a kind but is not a direction.
    what_i_will_name_instead_and_will_not_dress_up: >-
      RC-10 is the ONE item in the queue that could produce a MECHANISM rather
      than another rate: the k-byte scaling law of the hit criterion, measured at
      r=10 and at r=5, costs seconds and would say what the r=5 excess IS rather
      than how large it is. The absence of any mechanism is precisely why nobody
      can name a direction. I am naming RC-10 as the cheapest thing that could
      generate a resume condition -- NOT as a live direction, because success
      there is still an r=5 statement and does not approach outcomes (a), (b) or
      (c).
    is_the_remaining_queue_controls_or_directions: >-
      DIRECT ANSWER: CONTROLS AND REPLICATIONS, WITH ONE DIAGNOSTIC. Of the eight
      items in required_controls, RC-9 and RC-10 are diagnostics that can
      invalidate existing claims, RC-11 is a discriminating control, RC-12,
      RC-2-REMAINDER, RC-4 and RC-5 are replications and controls, and
      RC-8-REPRICED is the only one that upgrades a claim's scope. None of them
      is a direction.
    resume_condition_i_propose: >-
      Resume GOAL-AES-003 when EITHER (a) a mechanism is named -- by any agent, in
      any batch -- that predicts a measurable deviation at r >= 7 in an object
      this repository can build, with a preregistered falsifier; OR (b) RC-9 or
      RC-10 returns a reading inconsistent with the current picture, which would
      make the campaign's existing claims the open question; OR (c) an instrument
      is proposed whose method ceiling (PA-4) exceeds r=6, which the current one
      demonstrably does not.
    what_should_happen_before_the_pause: >-
      Three things, roughly 90 minutes of Coordinator and compute time in total.
      1. A CORRECTION for OBJ-1. The "no arm has ever measured the PRP null"
         statement must not enter a ledger record; BATCH-002 arm_A3 and arm_A3b
         measured it at 2^34 and it agrees.
      2. RC-9 and RC-10, under a minute of compute between them. They are the two
         cheapest measurements in the campaign and each can invalidate five
         batches of claims. Pausing with them unrun would be closure that leaves
         a falsifier unrun, which the previous red team correctly refused.
      3. The endpoint-ordering correction in OBJ-2 and the receipt lines in OBJ-5.
    on_the_100_batch_directive:
      i_have_read_it: >-
        protocol-amendment-GOAL-AES-003-002 removes the wall-clock ceiling and
        states, in its own words: "THIS AMENDMENT IS NOT SUPPORTED BY THE RESEARCH
        EVIDENCE AND DOES NOT CLAIM TO BE ... What changed is that the USER ...
        DIRECTED that the count be pursued."
      my_ruling_is_on_the_research_only: >-
        The directive does not bind this ruling and I have not let it. My ruling
        would be the same with or without it: the research warrants a pause.
      what_i_will_say_about_continuing_anyway: >-
        If the count is pursued, the amendment's own sentence is the right label
        for the queue and should be repeated on every batch card: "Running more
        batches produces more toy-tier evidence, not stronger evidence." I will
        add a research point that is mine and not the amendment's: the queue I
        enumerated above is about 3 hours of compute in total, so a batch count
        in the dozens WILL exhaust it, and the batches after that will have no
        measurement to make. A batch with no measurement should record that it
        measured nothing rather than invent one, and the ranking above is offered
        so that the exhaustion is visible in the record rather than discovered
        one batch at a time.
      i_did_not_recommend_closure_because_the_count_is_unreachable: >-
        Stated for the record: my pause recommendation is independent of the
        quorum problem. Closure is unavailable under CLAUDE.md rule 8 regardless,
        and I would recommend a pause even if three distinct models were
        available.

  enumeration_of_what_remains_measurable:
    total_compute_if_everything_below_is_run: about 3 hours 5 minutes, of which about 2 hours is serialised by the 8 GB memory cap.
    items:
      - {id: RC-9,  what: 'yoyo at r=3 and r=4',                         cost_s: 60,   kind: diagnostic,  can_invalidate_existing_claims: true}
      - {id: RC-10, what: 'k-byte scaling of the hit criterion at r=10 and r=5', cost_s: 60, kind: diagnostic, can_invalidate_existing_claims: true}
      - {id: RC-11, what: 'hit-index overlap across paired S-box arms',  cost_s: 480,  kind: control,     can_invalidate_existing_claims: true}
      - {id: RC-4,  what: 'null object for the mod-8 statistic (nibble)', cost_s: 300, kind: 'control (protocol requirement)', can_invalidate_existing_claims: true}
      - {id: RC-5,  what: '400 trials per decayed nibble cell',          cost_s: 600,  kind: replication, can_invalidate_existing_claims: false}
      - {id: RC-12, what: 'GF(2^8) M1 r=6 under a second key/base',      cost_s: 2000, kind: replication, can_invalidate_existing_claims: true}
      - {id: RC-2-REM-A, what: 'GF(2^8) M1 r=7',                          cost_s: 2000, kind: extension,   can_invalidate_existing_claims: true}
      - {id: RC-2-REM-B, what: 'GF(2^8) CTRL r=7 (required pairing for the above)', cost_s: 800, kind: control, can_invalidate_existing_claims: false}
      - {id: RC-8-REPRICED, what: '27 further random S-box draws at r=5', cost_s: 4270, kind: 'scope upgrade', can_invalidate_existing_claims: true}
      - {id: RC-13, what: 'GF(2^8) M1 r=6 at j0 in {2,3}',                cost_s: 4000, kind: replication, can_invalidate_existing_claims: true, note: 'low prior of surprise -- M1 carries the r=5 signature at both j0 measured'}
      - {id: RC-14, what: 'GF(2^8) M0 r=6',                               cost_s: 800,  kind: replication, can_invalidate_existing_claims: false, note: 'near-uninformative: M0 has no r=5 byte-width signature to lose. DEPRIORITISE.'}
