    what_is_NOT_on_this_list_and_why: >-
      Anything at r >= 7 on the yoyo instrument. By PA-4 the instrument cannot
      resolve a 2x effect at r=6 below about 2^37 trials (12 hours per arm), and
      r=7 is further out. Proposing it would be proposing a measurement that
      cannot answer its own question.

  the_one_finding_that_would_hurt_most: >-
    THE r=4 YOYO ARM READING AT OR NEAR THE NULL WHILE r=5 READS 13x. It costs
    under a minute to produce (RC-9), it has never been run, and no reviewer has
    ever asked for it. Every yoyo claim in five batches -- BATCH-002's A1 15.6x
    and A1b 15.0x on the AES-NI probe, BATCH-004's 27/22/41, BATCH-005's nine
    deconfounded arms -- rests on the statistic being a ROUND-LIMITED decay
    phenomenon, and the evidence for that is entirely on the decreasing side of
    the peak: r=5 high, r=6 null, r=10 null. The only reading below r=5 is r=2 at
    100% (BATCH-002 arm_PC), three rounds away. If r=4 does not sit strictly
    between them, the profile is not a decay at all, the r=5 peak is a property
    of the probe's geometry rather than of the cipher, and the deconfounding I
    spent most of this review verifying would be a careful measurement of an
    artifact. It would not touch the byte-width counting arm, which is a separate
    instrument with its own paired controls and its own r=4/r=5/r=6/r=10
    readings. That is the shape of the worst case: cheap, unrun, and it takes the
    yoyo half of the campaign with it while leaving the counting half standing.
    Runner-up, and the reason I rank it second only because it is less likely:
    RC-12 returning divisibility PRESENT at r=6 under a second key, which would
    make this batch's headline a one-key accident.

  narrowest_supported_statement: >-
    In a reduced-round AES-shaped SPN over GF(2^8) with the AES S-box and the
    AES-128 key schedule, C1 convention, on the full 2^32 coset of diagonal D_0
    under the single key 6fe52e2e9b3ea04085c370f9bc609245 and base
    e35f00e7631cdd862e59d126e72b8fc9, at projection index j0 = 0: with the
    four-zero non-singular mixing matrix 00030101010203000101000303000102 the
    statistic n = sum_v C(m_v,2) reads 2147565862 at r = 6, with gcd of nonzero
    fiber sizes 1, 12 distinct nonzero fiber sizes, max_occ 12, a
    Poisson-shaped occupancy histogram and n mod 8 = 6; under AES MixColumns at
    the same r, key, base and index it reads 2147523716 with gcd 1, max_occ 12
    and n mod 8 = 4; and BATCH-002 measured the same matrix, key, base and index
    at r = 5 as max_occ 2816 with every nonzero fiber size a multiple of 256.
    Separately, in a software T-table AES pinned to FIPS-197 C.1, at r = 5,
    amask 1, smask 1, 2^30 trials per arm, in a fully crossed 3 S-box x 3 seed
    design with key_hex and thread_seeds verified identical within each block,
    the W>=1 counts were AES 14, 14, 8; R1 22, 11, 14; R2 15, 15, 14, giving an
    exact 95% interval of [0.606, 1.443] on the R2:R1 rate ratio and a
    likelihood-ratio S-box main effect of p = 0.458; the three
    structure-destroyed arms at 2^31 read 2, 1 and 1 against an analytic null of
    2.0; and the same probe at r = 6 under the three S-boxes, exactly paired to
    the r = 5 arms by key and stream, read 1, 2 and 0 against an analytic null of
    2.0 at 2^31 each. The analytic null 4 * 2^-32 that all excess factors divide
    by is itself confirmed by measurement to a rate ratio of [0.586, 1.314] at
    95%, from 26 events across nine should-be-null arms including two full
    ten-round arms at 2^33 each. Nothing above is a statement about full-round or
    deployed AES, no comparison to published cryptanalysis is made in either
    direction, and none of it counts toward a closure quorum.

  next_concrete_action: >-
    RUN RC-9 BEFORE ANY LEDGER RECORD IS WRITTEN: the yoyo probe at r = 4, AES
    S-box, amask 1, smask 1, seed 531001, armid 1, 2^22 trials, on the existing
    pinned binary yoyo_sbox_v2 (sha256
    d30e4d720317706043b263742062273d22fbe054f56a58a8b351f3bbb3fd9ff0), identical
    to arm D-AES-K1 in every parameter except rounds. Under a minute of compute.
    It is the cheapest measurement in the campaign that can falsify rather than
    confirm, it tests the monotonicity in the round count that every yoyo claim
    in five batches assumes and that no arm has ever checked, and it should be
    run before a pause is recorded, because a pause with an unrun one-minute
    falsifier is not a pause on the evidence.

