protocol_amendment:
  id: protocol-amendment-GOAL-AES-003-002
  goal_id: GOAL-AES-003
  recorded_at: 2026-08-03
  supersedes: protocol-amendment-GOAL-AES-003-001
  determination: RAISE_THE_WALL_CLOCK_CEILING_ON_USER_DIRECTION

  what_changes:
    field: campaign_budget.total_wall_clock_seconds
    prior_value: 30400
    new_value: null
    meaning: >-
      NO WALL-CLOCK CAP. The campaign no longer halts on a clock. maximum_batches
      is already null from the 2026-08-02 user direction; max_concurrent stays 3
      and is NOT raised.

  THE_JUSTIFICATION_IS_THE_TARGET_AND_NOT_THE_EVIDENCE:
    stated_plainly: >-
      THIS AMENDMENT IS NOT SUPPORTED BY THE RESEARCH EVIDENCE AND DOES NOT CLAIM
      TO BE. protocol-amendment-GOAL-AES-003-001, recorded hours earlier, DECLINED
      to raise this same ceiling, and it declined on the reviewers: both BATCH-004
      reviewers were asked what was still worth running and NEITHER NAMED A
      RESEARCH DIRECTION, and the red team recorded that four batches had produced
      no candidate mechanism for a distinguisher surviving past r=6 and that it
      had none either. NONE OF THAT HAS CHANGED. No new evidence has arrived. No
      reviewer has since named a direction.
      What changed is that the USER, having been told exactly this and having been
      told that the Coordinator would not raise ceilings on its own authority to
      pursue a batch count, DIRECTED that the count be pursued. That direction is
      the whole of the justification and it is recorded as such rather than
      reconstructed as a research rationale.
    why_it_is_recorded_this_way: >-
      Because the alternative is worse. An amendment that invented an
      evidence-based reason for a ceiling raise the evidence does not support
      would be exactly the fabrication this ledger exists to prevent, and it would
      be undetectable to a later reader in a way the true reason is not. A reader
      encountering a campaign of many batches should be able to see, from the
      record, that the batch count was pursued as a target. They can.
    authorization: >-
      User directive of 2026-08-03, in response to an explicit statement of this
      trade-off. The authorization is the user's and is NOT a Coordinator
      self-grant.

  WHAT_THIS_AMENDMENT_DOES_NOT_TOUCH_AND_MAY_NEVER_BE_READ_AS_TOUCHING:
    - >-
      NO EVIDENCE STANDARD IS WEAKENED. Every batch still requires a
      dispatcher-verified snapshot before review, independent validation, an
      independent red team, and a dispatcher-verified ledger archive. Claim tiers,
      scoping rules and RQ-AES-003 R3 are unchanged.
    - >-
      NO FABRICATION IS LICENSED. Commands, outputs, timings, statistics,
      citations and runs are still never invented. A batch that measures nothing
      records that it measured nothing.
    - >-
      NO CLOSURE IS LICENSED. AGENTS.md rule 13 stands: `completed` needs three
      CONCUR attestations with pairwise-distinct resolved models, which this
      harness cannot resolve. Raising a ceiling does not approach completion.
    - >-
      NO CLAIM TIER MOVES. Everything remains toy-tier and reduced-round. Running
      more batches produces more toy-tier evidence, not stronger evidence.
    - >-
      max_concurrent STAYS 3 ACROSS ALL ACTIVE CAMPAIGNS. The BATCH-002
      over-subscription that destroyed a producer's entire first segment is not
      re-licensed by a bigger budget.
    - >-
      A BATCH THAT WOULD MEASURE NOTHING IS STILL NOT WORTH OPENING. This
      amendment removes a CAP; it does not create research. Where no ranked
      falsifiable measurement exists, the honest act remains to say so in that
      batch's own decision record.

  the_honest_forecast: >-
    On the reviewers' present assessment, further batches are expected to yield
    controls, replications and scoping repairs rather than new mechanisms. That
    expectation is recorded BEFORE the batches run, so that a later reader can
    compare it against what they actually produced rather than take a Coordinator's
    word for it afterwards.
  decided_by: coordinator
