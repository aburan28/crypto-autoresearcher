validation_report:
  id: VAL-20260803-fab2b8
  task_id: TASK-20260803-fab2b8
  role: validator
  goal_id: GOAL-AES-003
  batch: BATCH-004
  recorded_at: 2026-08-03
  claim_tier: toy
  claim_tier_basis: >-
    Everything checked here is a reduced-round AES-shaped construction. Priority 1
    is a 4x4-NIBBLE SPN over GF(2^4) at r in {4,5,6,7} on 40 trials per arm.
    Priority 2 is r=5 of a reduced-round AES-128 permutation at 2^30 to 2^31
    trials on one machine. Priority 3 is a 6-round toy key-recovery instrument.
    Nothing in this report is a statement about full-round or deployed AES, and
    no comparison to published cryptanalysis is made in either direction
    (RQ-AES-003 R3). No asymptotic or crypto-scale claim is made or implied.

  binding_snapshot:
    snapshot_task_id: TASK-20260803-9b1482
    receipt_path: coordination/goals/GOAL-AES-003/batches/BATCH-004/archives/TASK-20260803-9b1482/snapshot-receipt.json
    commit_sha: 063356d2
    paths_declared: 101
    paths_present: 101
    paths_sha256_matching_receipt_at_first_read: 101
    paths_sha256_matching_committed_blob: 101
    method: >-
      Every declared path was hashed with sha256 from the working tree and,
      separately, from `git show 063356d2:<path>`. All 101 agreed with the
      receipt on both routes. The snapshot is therefore a real committed
      snapshot and not a working-tree assertion, which is the precondition for
      validating it at all.
    post_snapshot_worktree_drift_detected: true
    post_snapshot_worktree_drift_detail: >-
      At 02:20Z, while this validation was in progress, the rank-3 producer was
      resumed as a declared "continuation segment 2" and four snapshot-bound
      paths diverged in the WORKING TREE from their archived digests --
      TASK-20260803-367b1b/PREREGISTRATION.md (appended to, not edited above the
      line), budget_stamps.jsonl, runs/arms_timing.txt and runs/commands.txt --
      together with roughly a dozen new untracked segment-2 artifacts including
      runs/Y-AES-main-r6.json, runs/Y-R2-main-r6.json, src/yoyo_sbox_v2.c and
      runs/independent_reference_check.json. The Coordinator recorded the
      divergence in commit 7aa67759 and declared segment 2 unreviewed and
      carrying no weight. I ACCEPT that handling and NOTE its cost. Everything
      validated below is read from commit 063356d2, not from the working tree.
      NO SEGMENT-2 ARTIFACT IS VALIDATED HERE, in either direction. In
      particular the producer's own r=6 yoyo decay arms are OUT OF SCOPE for
      this report; the r=6 decay measurement I report under VC-3.6 is my own,
      run on my own engine, and was chosen independently before I knew segment 2
      existed.
    consequence_for_this_report: >-
      A reviewer reading this report against the live tree will find four bound
      files whose digests no longer match. That is expected and is not a defect
      in the producer package; it is the visible cost of resuming a producer
      after its own snapshot. The honest statement is that the archive verifies
      and the worktree does not, and a reader must fetch the commit to reproduce
      my checks.

  independence:
    session_independent: true
    implementation_independent: true
    model_independent: false
    basis: >-
      SESSION AND IMPLEMENTATION INDEPENDENCE ONLY. Under standing basis
      0137a051eb5828789eb267fa83c8278086578d4c this harness cannot resolve the
      GPT-5.6-family policy aliases in orchestration/model-policies.yaml, so
      producer and validator ran on the same resolved model. NOTHING IN THIS
      REPORT MAY COUNT TOWARD A CLOSURE QUORUM. Implementation independence is
      real and is the load-bearing part: for Priority 1 I wrote a nibble SPN
      counter with row-major state, log/antilog GF(2^4) multiplication and a
      splitmix64 stream (the producer uses column-major indexing,
      shift-and-add multiplication and xorshift64); for Priority 2 I wrote a
      BYTE-ORIENTED AES with explicit SubBytes/ShiftRows/MixColumns and no
      T-tables (the producer uses T-tables), with my own key derivation, my own
      random-bijection sampler and my own S-box draws.

  run_ids:
    - VRUN-fab2b8-nib-sweep-18arms
    - VRUN-fab2b8-matrix-verify
    - VRUN-fab2b8-yoyo-r5-3arms
    - VRUN-fab2b8-yoyo-r6-decay-2arms
    - VRUN-fab2b8-pc-true-reexec

  validator_instruments:
    - id: vnib
      language: C
      purpose: independent GF(2^4) nibble-SPN collision counter for Priority 1
      differences_from_producer: >-
        Row-major state s[row][col] rather than the producer's 4*col+row packing;
        GF(2^4) multiplication by log/antilog tables built from a verified
        generator rather than shift-and-add; splitmix64 rather than xorshift64;
        ShiftRows written from the AES specification rather than transcribed.
        Consequence: the key and base streams differ from the producer's, so
        trial-by-trial agreement is neither expected nor sought. Only the arm
        summary statistics are comparable, plus the arms that are deterministic
        in the sense that every trial returns the same n.
    - id: vyoyo
      language: C
      purpose: independent parameterized-S-box AES yoyo probe for Priority 2
      differences_from_producer: >-
        Byte-oriented AES with explicit SubBytes/ShiftRows/MixColumns/AddRoundKey
        and an explicit InvShiftRows/InvMixColumns decryption, rather than the
        producer's T-table forward and equivalent-inverse construction; my own
        key derivation constant; my own random-bijection sampler using an
        ASCENDING Fisher-Yates loop (the producer's is descending) with the same
        rejection rule; my own S-box seeds, so my random draws are DIFFERENT
        bijections from the producer's two.
    - id: sq_slot rebuilt from snapshot source
      language: C
      purpose: re-execution of the Priority 3 positive control
      differences_from_producer: >-
        None by design. This is the identical source at sha256
        13eb85a3a433a7e1d1ce9df292ae696f66075fd55b27ee26c36eb883a7272a79, taken
        from commit 063356d2, recompiled by me and re-run with the recorded
        command. The point of this arm is byte-identity, not independence.

