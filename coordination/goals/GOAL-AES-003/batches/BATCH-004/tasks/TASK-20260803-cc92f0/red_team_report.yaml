red_team_report:
  id: RT-20260803-cc92f0
  task_id: TASK-20260803-cc92f0
  goal_id: GOAL-AES-003
  batch: BATCH-004
  role: red-team
  reviewed_at: 2026-08-03

  claim_tier: toy
  claim_tier_basis: >-
    A 4x4-nibble SPN over GF(2^4) at r in {4,5,6,7} with 40 trials per cell, and
    reduced-round AES-128 at r=5 with at most 2^31 yoyo trials per arm, on one
    machine. Nothing in this report is a statement about full-round or deployed
    AES, and no comparison to published cryptanalysis is made or implied in
    either direction (RQ-AES-003 R3).

  assigns_no_state: >-
    This report assigns no official state, no evidence strength, and recommends
    no promotion. Those are the Coordinator's, on the validator's and this
    report's inputs.

  independence:
    session_independent: true
    implementation_independent: false
    model_independent: false
    statement: >-
      SESSION independence only. This review was produced in a session that did
      not produce either BATCH-004 producer package. It supplies NO MODEL
      independence under standing basis 0137a051eb5828789eb267fa83c8278086578d4c,
      and it supplies no implementation independence because it re-executed
      nothing (the task card forbids competing for CPU with the concurrent
      validator). Nothing in this report may count toward a closure quorum.

  evidence_basis:
    snapshot_verified: >-
      I recomputed sha256 for all 101 paths in
      coordination/goals/GOAL-AES-003/batches/BATCH-004/archives/TASK-20260803-9b1482/snapshot-receipt.json
      excluding the receipt itself. All 100 matched the receipt and none was
      missing. Everything I attribute to BATCH-004 comes from that bound set.
    out_of_snapshot_reads_declared: >-
      Four numbers in this report come from committed campaign records that are
      NOT hash-bound by the BATCH-004 receipt, and I name them so the reader can
      discount them separately - BATCH-002/tasks/TASK-20260802-142a4b/RESULTS.json,
      BATCH-002/tasks/TASK-20260802-e4fa63/RESULTS.json and
      BATCH-003/tasks/TASK-20260802-4500d4/RESULTS.json. `git status --porcelain`
      at review time shows a clean tree apart from one untracked binary, so these
      are the committed versions; they are not, however, bound by any receipt
      naming this batch.
    recollection_rule: >-
      DEC-20260731-019 ruling 3 observed. No recollected fact, no remembered
      literature result and no remembered baseline is used anywhere in this
      report, to promote OR to dismiss. Every number below is either recomputed
      by me in this session from a named file, or quoted from a named file.
    analysis_only: >-
      ANALYSIS ONLY, as the task card requires. I ran no counting arm, no yoyo
      arm and no attack. My only computations were arithmetic and statistics on
      already-recorded numbers, in Python, costing under a second each.

  claim_under_review:
    - >-
      RANK 1 (TASK-20260803-6ba122) - the r=5 half of CORR-20260802-46b73b
      SURVIVES; decay tracks round count, not zero entries; the fiber degeneracy
      dies at r=6; Z1 at r=5 forces the residue with no degeneracy at all.
    - >-
      RANK 3 (TASK-20260803-367b1b) - S-BOX-INDEPENDENT. The r=5 yoyo survives
      uniformly random bijective S-boxes at 11.0x and 20.5x against AES at 13.5x,
      therefore nothing this campaign has found is specific to AES.
    - >-
      RANK 2 (TASK-20260803-367b1b) - the true-hint positive control passes,
      excluding the all-empty regression hypothesis for BATCH-003 rank 4.
    - >-
      The snapshot receipt's standing open items - OBS-B3-4 remains open at
      GF(2^8); two draws bound very little; the structure-destroyed controls
      should be re-run at 2^32.

  objections:

    - id: OBJ-1
      severity: material
      target: the dispatch premise, and the credit assigned to the nibble arm
      finding: >-
        THE BATCH-004 OBJECTIVE'S OWN PREMISE IS INACCURATE, AND CORRECTING IT
        REDUCES WHAT THE NIBBLE ARM ADDS. The dispatch queue objective states, in
        full - "Under M0 and M1 every fiber size is a multiple of 256; under AES
        MixColumns the histogram is Poisson-shaped with max_occ 12." That is not
        true of M0 at r=5. BATCH-002/tasks/TASK-20260802-142a4b/RESULTS.json and
        its BATCH-003 re-execution
        BATCH-003/tasks/TASK-20260802-4500d4/RESULTS.json both carry GF(2^8) arms
        under matrix 00030101010203010101020303010102 (M0, one zero at (0,0)) at
        r=5 with n = 2147411968 and n = 2147031240, BOTH with max_occ 12 - that
        is, Poisson-shaped, with no divisibility signature, and reading
        n mod 8 = 0. OBS-B3-4 in EV-AES-96257a is itself worded precisely
        ("Under M1 at r=5 the occupancy histogram is ... exactly as under M0 at
        r=4"); the dispatch text generalised it and the generalisation is false.
      consequence: >-
        The nibble arm's self-declared strongest contribution (mechanism_findings
        M-3, "Z1 AT r=5 IS FORCED WITHOUT ANY DEGENERACY") already had a
        byte-width counterpart in the campaign before BATCH-004 ran. A
        non-degenerate zero-entry layer forcing the residue at r=5 was already
        measured at GF(2^8), twice. What the nibble arm genuinely adds, and it is
        not nothing, is the DECAY DIRECTION at r=6 and r=7 under a zero-entry
        layer, which exists nowhere at byte width.
      not_claimed: >-
        This does not falsify anything and does not touch F1 or F2. It reassigns
        credit and it corrects a Coordinator source artifact, which
        CORR-20260802-009 as extended after ECDLP BATCH-029 puts in scope.

    - id: OBJ-2
      severity: material
      target: what the degenerate arms can possibly contribute
      finding: >-
        FIBER DIVISIBILITY DOES NOT MAKE n mod 8 = 0 LIKELY, IT MAKES IT CERTAIN.
        For even q, if every fiber size is a multiple of q then each term is
        C(qm,2) = (q/2)*m*(qm-1). At q=16 that is 8m(16m-1), divisible by 8 for
        every m; at q=256 it is 128m(256m-1). I verified both symbolically and
        numerically for m = 1..11. So the residue on any arm carrying the
        divisibility signature is an arithmetic identity with probability
        exactly 1, not a measurement.
      verification: >-
        I recomputed n directly from the M1 GF(2^8) r=5 histogram quoted in
        OBS-B3-4 - {0:4284365663, 256:6167727, 512:3085256, 768:1029383,
        1024:257247, 1280:51908, 1536:8656, 1792:1296, 2048:149, 2304:10,
        2560:1} - obtaining n = 1097953443840, n mod 8 = 0, and a coset sum of
        exactly 4294967296 = 2^32. The residue is entailed by the histogram
        alone.
      consequence: >-
        Three classes of arm carry zero information about round structure and
        should be struck from the support set of the r=5 half rather than counted
        as agreement - nibble Z1 and Z4 at r=4 (40/40 divisible), nibble Z4 at
        r=5 (40/40 divisible), and the GF(2^8) M1 r=5 arms whose max_occ is 2816
        and 2304 (BATCH-002 TASK-20260802-142a4b). The last of these is the arm
        OBS-B3-3 rests on. The producer does flag Z4 at r=5 as "the confounded
        case" and that is correct and creditable, but neither it nor any ledger
        record states the entailment, and no record yet says that OBS-B3-3's own
        M1 arm is information-free for the mod-8 claim.
      what_survives: >-
        The r=5 half is not damaged by this, because after OBJ-1 its measured
        support is the two GF(2^8) M0 r=5 arms at max_occ 12 plus nibble Z1 at
        r=5, all non-degenerate, on top of the reviewed analytic line (a) of
        CORR-20260802-46b73b. It is damaged as a COUNT of agreeing arms.

    - id: OBJ-3
      severity: material
      target: the F1 falsification bar and the 40-trial design
      finding: >-
        F1's bar of >= 36/40 can only fire against a near-deterministic
        mechanism, and 40 trials cannot separate "decays like the control" from
        "decays to a floor several times chance". Computed exactly from the
        binomial with p = 1/8 and n = 40 - P(X >= 36) is 0.0000 for any true
        forcing probability p <= 0.5, 0.016 at p = 0.75, 0.263 at p = 0.85 and
        0.629 at p = 0.90. So a degeneracy that raised the forcing probability
        from 1/8 to 1/2 at r=6 - an enormous real effect - would trip F1 with
        probability essentially zero.
      the_defence_i_accept: >-
        The mechanism OBS-B3-4 actually posited is deterministic (OBJ-2), so a
        bar at 36 is well matched to THAT mechanism, and an intermediate effect
        would not have been mislabelled FALSIFIED - it would have failed F2's
        k <= 15 gate and landed in F3 UNDECIDED, which is a legitimate outcome
        the preregistration names. The bar is not blind; it is narrow.
      the_residual: >-
        F2's k <= 15 gate is itself weak. P(X <= 15 | p = 0.30) = 0.885 and
        P(X <= 15 | p = 0.25) = 0.974, so F2 passes comfortably even if the true
        r=6 forcing rate were 2.4x chance. Clopper-Pearson 95% intervals on the
        observed decayed cells, which I computed by bisection on exact binomial
        tails, are Z1 at r=6 (9/40) = [0.108, 0.385] and Z4 at r=6 (7/40) =
        [0.073, 0.328]. The null 0.125 sits near the LOWER edge of the Z1
        interval. The claim "decays to chance" is therefore supported only in the
        weak sense of "is not distinguishable from chance at n = 40".
      cheapest_fix: >-
        400 trials per decayed cell instead of 40. At the reported nibble cost
        this is seconds. It would shrink the interval by roughly a factor of
        three and would let a paired McNemar test use the design's own pairing,
        which is currently paid for and unused - I checked the per-trial arrays
        and at r=6 the hit sets overlap only 2 (NZ/Z1), 1 (NZ/Z4) and 3 (Z1/Z4)
        of 40, so the pairing carries real information that was discarded.

    - id: OBJ-4
      severity: moderate
      target: the null object for the mod-8 statistic
      finding: >-
        THE "CHANCE EXPECTATION 5/40" NULL IS ASSUMED, NOT MEASURED AGAINST A
        NULL OBJECT. The producer's null is the NZ layer at r >= 6, which is
        still the same SPN with the same S-box and the same coset - a
        within-instrument null, not the identical measurement against a random
        bijection or random function on the same state space. Pooling the six
        decayed arms from RESULTS.json per_trial_n_mod8_all_40 (r=6 and r=7, all
        three layers, 240 trials) the residue distribution over the eight classes
        is [37, 41, 23, 37, 31, 25, 19, 27], giving chi-square 14.13 on 7 degrees
        of freedom, p = 0.049.
      how_i_want_this_read: >-
        As a reason to run a control, NOT as a finding. It is a single post-hoc
        goodness-of-fit test on a pooled sample I chose after seeing the data,
        and at p = 0.049 it is exactly what one marginal test in a handful looks
        like under a true null. I am not asserting non-uniformity.
      what_the_quantity_should_have_done: >-
        n mod 8 is claimed to be uniform once the round structure is destroyed.
        The parameter that is supposed to destroy it is round count, and it does.
        The missing control is the null object - replace the cipher entirely with
        a uniformly random bijection (and separately a uniformly random function)
        on the 64-bit state, run the identical projection and identical statistic
        for 400 trials, and confirm the eight residues are uniform. If they are
        not, every "chance" reading in this campaign is calibrated against the
        wrong null. Cost - seconds.

    - id: OBJ-5
      severity: material
      target: the S-box arm, and this is my principal objection to it
      finding: >-
        THE S-BOX ARM HAS NO DECAY CONTROL. There is no r=6 and no r=10 arm under
        R1 or R2 anywhere. The producer states this itself, in full, in
        RESULTS.json checks_that_did_not_run - "r=6 yoyo arms under the random
        S-boxes (the decay direction)", "ran": false, "reason": "budget; out of
        scope for this task, which asks only about S-box dependence at r=5."
      why_it_matters: >-
        This is structurally the same defect the BATCH-003 red team found for the
        zero-entry matrices - a signal measured at one setting of the parameter
        that is supposed to destroy it, with no reading at the setting where it
        should be gone - reproduced in a new arm, in the batch convened to repair
        it. For the AES S-box the decay control exists (BATCH-002 arms A2/A2b at
        r=6 and A3/A3b at r=10). For R1 and R2 it does not exist, so the excess
        of 11.0x and 20.5x is currently unfalsifiable as a yoyo - a probe-level
        or statistic-level artifact affecting the random-S-box code path would
        produce exactly these numbers.
      what_the_quantity_should_do: >-
        Round count is the parameter that must destroy it. At r=6 the excess
        under R1 and R2 must fall to about 1x, as it does for AES. If it does
        not, the reading inverts.
      cost: >-
        About 310 s per arm at 2^31 by the producer's own calibration
        (6.9e6 trials/s on 2 threads), or about 155 s at 2^30, where a 15x excess
        against a null of 1.0 is still resolvable. Two arms, roughly ten minutes.

    - id: OBJ-6
      severity: material
      target: attribution of the arm-to-arm spread to the S-box
      finding: >-
        S-BOX, KEY AND PLAINTEXT STREAM ARE CONFOUNDED ACROSS THE THREE MAIN
        ARMS. Each arm derives its own AES key from its own seed - key_hex is
        25b3faa13dbaeaab5491571199979d53 for Y-AES-main,
        92798536b7d5707d01e8a69ac805d8d0 for Y-R1-main and
        627ba325224589ece456768ec8c9614b for Y-R2-main - and the preregistration
        declares this deliberately ("Each arm derives its own AES key from its own
        seed, so each S-box arm carries an independent key"). It is defensible for
        generality and fatal for attribution - the three arms differ in three
        things at once.
      consequence: >-
        The observed spread carries no S-box information. Y-R1 at 22 and Y-R2 at
        41 differ at a two-sided binomial p = 0.023 conditional on their total of
        63, which I computed exactly; two S-boxes drawn from the same
        distribution should not differ that way if the S-box is irrelevant, so
        either the S-box matters after all, or the variance is coming from the
        key/stream, or it is a 1-in-44 fluctuation. The design cannot tell these
        apart. Nothing in the report claims otherwise, but the headline sentence
        "the draws bracket AES" invites the reading, and the bracketing is not
        interpretable.
      cheapest_control: >-
        Re-run the AES S-box under seeds 431002 and 431003 - the R1 and R2 arm
        seeds - so that the S-box is held fixed and only key/stream varies. Two
        arms, about 620 s. If the 22-to-41 spread reproduces under a FIXED S-box,
        the spread is arm variance and the S-box explains none of it.

    - id: OBJ-7
      severity: moderate
      target: the inference from two draws to S-BOX-INDEPENDENT
      finding: >-
        TWO DRAWS SUPPORT A MUCH SMALLER STATEMENT THAN THE HEADLINE. Two
        independent uniform draws both preserving the signal give a 95% one-sided
        Clopper-Pearson lower bound of 0.2236 on the fraction of bijections that
        preserve it (sqrt(0.05)). To support a lower bound of 0.90 you need 29
        consecutive surviving draws (ceil(log 0.05 / log 0.9)).
      on_the_bracketing: >-
        Asked directly whether it is suspicious, expected or uninformative -
        UNINFORMATIVE, and specifically so. As a rank test of whether AES is
        extreme among bijections, two random draws give AES one of three ranks
        under exchangeability, so the smallest attainable one-sided p-value is
        1/3. Bracketing is the single most likely outcome under the independence
        hypothesis and is also perfectly compatible with a mild S-box effect. It
        is not suspicious and it is not evidence.
      required_rewording: >-
        "S-BOX-INDEPENDENT" should read, at this evidence level - "not S-box
        dependent on 2 of 2 uniform bijective draws; at least 22% of bijections
        preserve the signal at 95% confidence; the space of 256! bijections is
        otherwise unprobed." The producer's own what_this_cannot_establish says
        almost exactly this; the HEADLINE block does not, and the HEADLINE is
        what downstream records will quote.
      cost_of_the_real_claim: >-
        29 draws at 2^30 trials each, about 155 s per arm, roughly 75 minutes.
        This is affordable and it converts a two-point observation into a claim.

    - id: OBJ-8
      severity: moderate
      target: the Y-R2-sd control breach and what the sd controls can bear
      finding: >-
        The breach itself is an ordinary fluctuation - 4 hits against a Poisson
        null of 1.0 has P(K >= 4) = 0.019, and over three sd arms the family-wise
        rate is about 5.6%. It is disclosed correctly and it does not touch the
        ALIVE/DEAD verdicts, because the frozen decision rule uses the ANALYTIC
        null, not the sd arms. Say that plainly rather than treating the breach
        as damage.
      the_real_limitation: >-
        What the sd arms cannot bear is the ATTRIBUTION claim - that the r=5
        excess is due to diagonal-coset structure. At 2^30 they can only exclude
        an sd excess of roughly 5x or more, by the producer's own declared power
        statement. An arm-level baseline offset of, say, 3x would be invisible to
        them and would inflate the mains.
      the_pattern_i_want_checked: >-
        The sd arms rank-order with the mains exactly - AES 13.5x main / 2.0x sd,
        R1 11.0x / 0.0x, R2 20.5x / 4.0x. With three arms this is p = 1/6 under
        exchangeability and is NOT evidence of anything. It is, however, precisely
        the signature an arm-level offset would produce, and the arm with the
        highest main is the arm with the breaching control. That coincidence
        deserves a measurement rather than a paragraph.
      cheapest_fix: >-
        sd arms at 2^32 (about 620 s each) plus the measured-PRP null the
        producer skipped and declared - RESULTS.json checks_that_did_not_run
        entry "measured-PRP null (BATCH-002 arms A3/A3b ...)", "ran": false,
        "reason": "budget."

    - id: OBJ-9
      severity: moderate
      target: what the FIPS-197 pin cannot catch in the rewritten probe
      finding: >-
        I read src/yoyo_sbox.c. The pin function applies the FIPS-197 C.1 known
        answer vector at TEN ROUNDS ONLY - the calls are enc_r(pt,y,&s,10) and
        dec_r(ct,x,&s,10) - and the 5120 checks are round-trips
        dec_r(enc_r(x)) == x over 512 vectors and r = 1..10. A round-trip pin is
        invariant under EVERY error that is self-consistent between enc_r and
        dec_r - a shared state-layout transposition, a shared ShiftRows
        direction, a shared round-key index, MixColumns retained or dropped in
        the wrong round on both sides. Round-trips cannot see a conjugation.
      how_large_the_residual_gap_actually_is: >-
        Smaller than that list suggests, and I will not overstate it. The r=10
        KAT runs through the SAME enc_r/dec_r code with the same T-tables, the
        same key expansion and the same last-round handling, so it does pin all
        of those. What it does not pin is anything that depends on the loop bound
        - an off-by-one in round-key indexing that happens to be correct at r=10,
        or a truncated-versus-untruncated key-schedule convention mismatch that
        coincides at the last index. That is a narrow but real gap on the exact
        parameter the whole measurement is taken at.
      the_gap_that_is_not_narrow: >-
        For a RANDOM S-box the KAT does not apply at all -
        fips197_c1_kat_applicable is false for R1 and R2 - so those arms have NO
        absolute correctness anchor, only self-consistency. If the random-S-box
        loading path built, say, a mismatched T-table/ISBOX pair in a
        mutually-inverse way, both pins would pass and the arms would measure a
        different object.
      cheapest_discriminating_control: >-
        Two things, both seconds. (1) Dump enc_5(K, P) for one fixed (K, P) from
        this probe and from BATCH-002's AES-NI probe and compare all 16 bytes -
        that pins the exact measured object at the exact measured round count
        against an independent implementation, which the geometry dump comparison
        does not. (2) For R1, check enc_5 against a twenty-line non-T-table
        reference implementation of the same object, which gives the random arms
        an absolute anchor they currently lack.

    - id: OBJ-10
      severity: minor
      target: record hygiene, not mathematics
      finding: >-
        Three defects, none of which touches a number. (a) The rank-3 git_state
        block contradicts itself - it carries "dirty_tree": true and
        "porcelain_line_count": 0 simultaneously, with a dirty_tree_basis
        asserting an unresolved UU merge conflict in .gitignore. (b) The two
        producers record different base commits, f768a352 for rank 3 and
        8ac2eb2e for rank 1, with rank 1 reporting 278 dirty entries; the batch
        therefore has no single base state. (c) `git status --porcelain` at
        review time shows one untracked file, the compiled binary
        TASK-20260803-367b1b/sq_slot, sitting inside a declared artifact
        directory and outside the snapshot's 101-path set. That is the same
        hygiene class as the five zero-byte artifacts DEC-20260802-f04fb0 records
        check_merge_hygiene as having been failing on since BATCH-002, and this
        batch adds further empty .err files to the bound set (sha256
        e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 is the
        empty string).

    - id: OBJ-11
      severity: informational
      target: a second statistic the campaign already pays for and never reads
      finding: >-
        Every yoyo arm records W_ge1_by_word, a four-way profile of where the
        excess lands, and no record has ever used it. The values are - this batch
        AES [2, 9, 4, 12], R1 [5, 7, 6, 4], R2 [9, 17, 8, 7]; BATCH-002
        TASK-20260802-e4fa63 arm A1 [20, 34, 29, 44] and arm A1b [12, 14, 14, 20].
        The two AES arms at highest count share a rank order (word 3 heaviest,
        word 0 lightest) that neither random arm reproduces.
      why_this_is_NOT_an_objection_to_the_verdict: >-
        I tested it and it does not hold up. The 3x4 homogeneity chi-square
        across this batch's three main arms is 9.16 on 6 degrees of freedom,
        p = 0.165 - the profiles are statistically compatible. Per-arm uniformity
        chi-squares are AES 9.30 (p = 0.026), R1 0.91 (p = 0.823), R2 6.12
        (p = 0.106), and BATCH-002 A1 9.47 (p = 0.024) but A1b only 2.40
        (p = 0.494), so the "reproducible AES profile" fails to reproduce in the
        third AES arm. I record this as a rejected line, with its numbers, so
        nobody spends a batch rediscovering that it is noise.
      what_i_do_recommend: >-
        Preregister the by-word profile as a secondary statistic for the
        additional draws in OBJ-7. It costs nothing, it is a second axis on which
        "the same phenomenon" can be checked, and at 29 draws it would have real
        power where at 2 it has none.

  required_controls:
    - id: RC-1
      priority: 1
      control: >-
        r=6 yoyo arms under R1 and R2, same amask/smask/seed convention as the
        r=5 mains. The missing decay control for the S-box arm (OBJ-5).
      predicted_if_the_reading_is_right: excess falls to about 1x, as AES does at r=6
      cost: about 310 s per arm at 2^31, or 155 s at 2^30
      falsifies_if: >-
        either random arm still shows an excess of 5x or more at r=6, which would
        mean the r=5 random-S-box excess is not a round-limited yoyo
    - id: RC-2
      priority: 2
      control: >-
        The GF(2^8) M0 and M1 arms at r=6. Still the only queued measurement that
        can falsify the round-split rule at byte width rather than accumulate
        agreement with it. Unchanged by BATCH-004 and stated as open by the
        producer.
      cost: hours per arm at a 2^32 coset; the reason it keeps being deferred
    - id: RC-3
      priority: 3
      control: >-
        AES S-box re-run under arm seeds 431002 and 431003, to separate key and
        stream variance from S-box variance (OBJ-6).
      cost: about 620 s total
    - id: RC-4
      priority: 4
      control: >-
        Null-object control for the mod-8 statistic - the identical projection and
        statistic applied to a uniformly random bijection and to a uniformly
        random function on the same state, 400 trials each (OBJ-4).
      cost: seconds
    - id: RC-5
      priority: 5
      control: >-
        400 trials per decayed nibble cell rather than 40, with the paired
        McNemar comparison the design already pays for (OBJ-3).
      cost: seconds
    - id: RC-6
      priority: 6
      control: >-
        Structure-destroyed controls at 2^32, plus the measured-PRP null that was
        declared and skipped (OBJ-8).
      cost: about 620 s per sd arm
    - id: RC-7
      priority: 7
      control: >-
        One 16-byte enc_5 vector compared between the software probe and
        BATCH-002's AES-NI probe, and one non-T-table reference check of enc_5
        under a random S-box (OBJ-9).
      cost: seconds
    - id: RC-8
      priority: 8
      control: >-
        27 further random bijective S-box draws at r=5, if a real S-box
        independence claim is wanted rather than a two-point observation (OBJ-7).
      cost: about 75 minutes at 2^30 per arm

  counterexample_or_mutation: >-
    The cheapest single mutation that could overturn a BATCH-004 headline is
    RC-1 - change ONE parameter, the round count, on the R2 arm, and leave the
    S-box, key, seed, code path and trial count alone. R2 is the right arm to
    mutate because it is simultaneously the highest main (41 hits, 20.5x) and the
    arm whose structure-destroyed control breached its band (4 hits, 4.0x). If
    R2's excess persists at r=6, the single coherent explanation covering both
    observations is an arm-level baseline offset in the software probe rather
    than a yoyo, and that explanation also puts the reference arm's 13.5x
    "reproduction" of BATCH-002 in question. Ten minutes of compute against a
    headline the batch has already published.

  baseline_comparison:
    pollard_rho_and_bsgs: >-
      Not applicable. Pollard-rho and BSGS are ECDLP baselines from my role
      contract; this campaign is a block-cipher campaign and importing them would
      be a category error. I record the substitution rather than silently
      skipping the contract item.
    applicable_baselines: >-
      GOAL-AES-003 names its own - REF-A the definitional exhaustive key search,
      REF-B a generic baseline this campaign builds and runs itself, REF-C this
      campaign's OWN measured death rounds. RQ-AES-003 R3 forbids comparison to
      published cryptanalysis in either direction and I make none.
    position_against_them: >-
      Against REF-C, the campaign's own measured AES death round for the yoyo is
      r=6 (BATCH-002 arms A2/A2b), and every BATCH-004 yoyo arm is at r=5. So no
      arm in this batch is a distinguisher surviving beyond the campaign's own
      measured death rounds, and goal outcome (c) is not advanced. Against REF-A
      and REF-B, BATCH-004 contains one attack-shaped object, the rank-2
      positive control, which is a 6-round hint-assisted Square attack already
      recorded in EV-AES-d8a13e and EV-AES-d33b1c as dominated_by "exhaustive
      search over the hinted residual" with sota_delta "negative"; running it
      with a TRUE hint makes it easier, not better, and does not move that entry.
    dominated_by_audit: >-
      I checked the field rather than reading past it. No BATCH-004 artifact
      asserts a dominated_by of null, because no BATCH-004 artifact asserts a
      cost claim at all - both producers set certificate.kind to "none" with a
      written basis. That is the correct handling and it is not an unchecked
      null. The eliminated-search-dimension trap of KN-LIT-7593 does not arise
      here either, because no invariant or precomputation is used to remove a
      search dimension anywhere in this batch.

  heuristic_challenges:
    - id: HC-1
      heuristic: >-
        Implicit and unnumbered - "n mod 8 is uniform on eight residues once the
        round structure is destroyed", the null behind every "chance expectation
        5/40" statement in rank 1.
      status: >-
        Not stated as a heuristic anywhere, not numbered, and justified only by
        the within-instrument NZ arms rather than by a null object. See OBJ-4.
    - id: HC-2
      heuristic: >-
        Numbered and explicit, to the producer's credit - the transfer statement
        in PREREGISTRATION.md section 7, frozen before measurement, separating
        what a GF(2^4) result does and does not carry to GF(2^8).
      status: >-
        Honestly drawn and it holds. It explicitly carries forward this
        campaign's own prior ruling that MINI-AES results transfer nothing to
        AES-128 because 4-bit degree properties differ, and applies it against
        itself.
      residual_challenge: >-
        The rescale argument is exactly right about the CLASS ARITHMETIC - the
        classes carry 16^{4-k} instead of 256^{4-k} and all remain multiples of 8
        - and that is a statement about the derivation, not about the instrument.
        It licenses reading a nibble result as evidence about the SAME statement.
        It does not license reading the nibble DECAY SCHEDULE as the byte-width
        decay schedule, and the producer says so. Direct answer to the question
        asked - a clean nibble result does NOT establish that GF(2^8) M0 or M1
        are decayed at r=6, does NOT establish that the byte-width degeneracy
        dies at the same round, and does NOT establish anything about a mechanism
        that requires 8-bit-specific structure (branch number of a byte-width
        MDS-adjacent matrix, 8-bit algebraic degree, the byte S-box's
        differential profile). A byte-width effect with no 4-bit shadow is
        exactly what the instrument is blind to, and the campaign has already had
        to record one such case.
    - id: HC-3
      heuristic: >-
        Analytic line (a) of CORR-20260802-46b73b - that fact 2's only job is to
        empty the k=1 class, which contributes a multiple of 2^24 whether or not
        it is empty.
      status: >-
        Reviewed and load-bearing per the correction record; NOT re-derived by me
        in this session and NOT re-derived by BATCH-004 either. It is the r=5
        half's actual support, and after OBJ-2 removes the degenerate arms it is
        carrying more weight than the measurement count suggests.

  cost_model_challenges:
    - >-
      No cost claim is made in this batch, so there is no per-attempt versus
      total-expected-cost confusion to find. I looked for one and there is none
      to report; recording that explicitly rather than leaving the section
      implicitly satisfied.
    - >-
      The one cost-shaped number that matters is the budget attribution. Rank 3
      spent about 1400 s of a 2400 s budget on six yoyo arms and 232 s on the
      positive control, and dropped the decay control (OBJ-5) and the measured-PRP
      null for budget. Both dropped items cost less than one of the six arms that
      ran. The allocation bought a third and fourth data point on a signal whose
      falsifier was not run - which is the accumulate-agreement failure mode this
      batch's own objective was written against.
    - >-
      Rank 1 used 18 arms of a 30-run cap and finished far inside a 2400 s
      ceiling, and then declined the j0 sweep as "unpreregistered scope". That is
      correct protocol. It also means spare budget existed in the one task where
      more trials per cell (OBJ-3) would have materially tightened the answer.

  reduction_and_scope_challenges:
    - >-
      SCOPE INFLATION CHECK ON THE HEADLINE. "NOTHING THIS CAMPAIGN HAS FOUND IS
      SPECIFIC TO AES" is stated as a conclusion drawn from the yoyo arm. For the
      counting properties it is not a new conclusion at all - it is a COROLLARY OF
      THE CAMPAIGN'S OWN REVIEWED DERIVATION. Analytic line (a) of
      CORR-20260802-46b73b uses no property of the S-box and requires only a
      non-singular column-preserving mixing layer, so S-box independence there was
      entailed before it was measured. Measuring it confirmed a theorem. Only the
      yoyo half of the headline is new information, because the yoyo has no
      derivation.
    - >-
      SCOPE CHECK ON THE SURVIVING AES-SPECIFIC OBJECT. EV-AES-96257a boundaries
      already name it - the key schedule in the hint construction, "whose r=6
      result is DOMINATED and whose r=7 result is NOT a key recovery". BATCH-004's
      rank 2 exercises that object with a TRUE hint and does not probe its
      key-schedule dependence at all. So the batch does not narrow the
      AES-specific residue any further than BATCH-003 did, and the headline should
      not be read as having done so.
    - >-
      NO REDUCTION OR CITED THEOREM IS INSTANTIATED ANYWHERE IN THIS BATCH, so
      there is no reduction-hypothesis check to perform. Recorded so the absence
      is deliberate.
    - >-
      NO AFFECTED-SCHEME LIST EXISTS AND NONE SHOULD. Both producers restate the
      toy tier and the RQ-AES-003 R3 prohibition correctly and neither drifts
      toward a deployment claim. I found no scope inflation of that kind.

  proof_architecture_challenges:
    - id: PA-1
      attack: observation-fiber
      result: >-
        SUCCESSFUL, and it is OBJ-2. The observation "n mod 8 = 0" has preimages
        on both sides of the conclusion of interest - it is produced by round
        structure at r=5 under a non-degenerate layer, AND it is produced with
        probability 1 by fiber divisibility under a degenerate layer at any round
        count where that divisibility holds. The missing separator is the fiber
        gcd, which rank 1 measures and reports per trial. That separator is the
        right instrument and it is the batch's most useful single addition; the
        campaign should retire the bare residue count in favour of the pair
        (residue, gcd) everywhere.
    - id: PA-2
      attack: quantifier-order
      result: >-
        A weak hit on the S-box arm. The claim wants "for all bijective S-boxes,
        the r=5 excess survives"; the experiment supplies "there exist two draws,
        chosen by seed before measuring, for which it survived". The seeds were
        genuinely fixed in advance (20260803001 and 20260803002, in the frozen
        preregistration), so there is no witness-after-the-fact defect. The
        quantifier gap is one of sample size only, and OBJ-7 quantifies it.
    - id: PA-3
      attack: nearby-object
      result: >-
        The nearest object for which the desired conclusion is false is the
        SINGULAR zero-entry circulant (2,3,0,1), and the batch handles it
        correctly - it reproduces the BATCH-001 abort on the original unmodified
        binary and confirms det 0 and rank 3 by two independent methods. It then
        reports that 12660 of 13500 one-zero circulant rows are non-singular, so
        the original draw was unlucky rather than obstructed. This is the part of
        the batch I would defend hardest against a critic.
    - id: PA-4
      attack: method-ceiling
      result: >-
        The ceiling on the nibble instrument is what OBJ-3 computes - with 40
        trials per cell the largest claim the resource measure can support in the
        decayed regime is "not distinguishable from chance", never "equal to
        chance". The verdict text "decays to chance at r=6 under ALL THREE
        layers" slightly exceeds that ceiling; "decays to a level indistinguishable
        from chance at n = 40" is what the instrument supports.
    - id: PA-5
      attack: boundary-and-strictness
      result: >-
        No boundary embedding claim is made anywhere in this batch, so this attack
        has no target. Recorded rather than skipped.

  audit_did_batch_004_repair_batch_003:
    verdict: >-
      TWO GENUINE REPAIRS, ONE PARTIAL, TWO CARRIED FORWARD UNREPAIRED. It is not
      fair to say the batch merely added arms; it is not accurate to say it closed
      what it was scoped to close.
    repaired:
      - >-
        "Rank 4 has no positive control" (DEC-20260802-f04fb0 limitations) is
        REPAIRED. The same binary, source sha256 byte-identical, with slotmask 0
        returns {1: 4} where every false-hint arm returned {0: 4}. The all-empty
        regression hypothesis is excluded. This is a clean fill.
      - >-
        "The validation report does not parse as YAML" is repaired as a PROCESS
        defect - both producers ran parsers on their own artifacts and recorded
        that they did, and so did I.
    partial:
      - >-
        OBS-B3-4. The new information is the r=6 and r=7 decay direction under a
        zero-entry layer, which existed nowhere before. The byte-width gap is
        explicitly still open by the producer's own statement, and per OBJ-1 the
        "clean r=5 zero-entry arm" part of the contribution was already available
        at GF(2^8).
    carried_forward_unrepaired:
      - >-
        "The software counting kernel is anchored at count level by a single arm."
        Not addressed. nib.c's occupancy histograms rest on one implementation and
        the producer says so in checks_that_did_not_run.
      - >-
        check_merge_hygiene, recorded in DEC-20260802-f04fb0 as failing since
        BATCH-002 on five zero-byte artifacts. Not addressed, and BATCH-004 adds
        further empty artifacts and one untracked binary (OBJ-10).
    new_defect_introduced:
      - >-
        OBJ-5. The S-box arm ships without the decay control, which is the same
        class of defect as the one this batch was convened to repair.

  the_bigger_question_is_anything_here_about_aes:
    direct_answer: >-
      DIFFERENTLY SCOPED, AND ON BALANCE SOMEWHAT LESS VALUABLE THAN THE
      CAMPAIGN'S FRAMING IMPLIES - but not for the reason the question suggests.
      Not "it was never about AES", which would be unfair; the objects measured
      are AES's own reduced-round permutation and its own MixColumns, and the
      instruments are pinned to FIPS-197. The problem is narrower and sharper than
      that.
    why_not_more_valuable: >-
      A general fact about SPN round geometry is more valuable than an AES quirk
      ONLY IF its position relative to what is already known can be stated. Here it
      cannot - RQ-AES-003 R3 forbids comparison to published cryptanalysis in
      either direction, and that prohibition is correct for this environment. So
      the generalisation buys reach the campaign is not permitted to cash. That is
      the honest reason the S-box-independence result does not upgrade the work.
    why_not_less_valuable: >-
      And it is not a devaluation either, because for the counting half nothing
      changed - S-box independence there was already entailed by the campaign's own
      reviewed derivation (see reduction_and_scope_challenges). You cannot lose
      AES-specificity you never claimed.
    what_the_campaign_actually_has: >-
      A toy-tier, scoped characterisation of when two counting properties and one
      two-sided yoyo coincidence hold in AES-shaped SPNs at r = 4 to 7, with a
      reviewed analytic derivation for the counting half, no derivation at all for
      the yoyo half, one correction that was held back from being written wrong
      into the ledger, and a set of controls that is now closer to complete than it
      was. It satisfies none of GOAL-AES-003's outcomes (a), (b) or (c). Outcome
      (d), a scoped barrier statement at the inventor-protocol section 4 standard
      about constructions that were actually built and run, is within reach and is
      the only outcome that is.
    what_is_still_worth_running: >-
      RC-1 through RC-7, in that order, total roughly one hour of compute
      excluding RC-2. Every one of them is a CONTROL, not a new direction, and I
      want that said plainly rather than dressed up as continuation - RC-1 and
      RC-3 can invalidate a published headline, RC-2 can falsify the round-split
      rule at byte width, and the rest calibrate nulls the campaign has been
      assuming.
    on_premature_closure_versus_manufactured_continuation: >-
      I will not manufacture a new lane. Four batches have produced no candidate
      mechanism for a distinguisher surviving past this campaign's own measured
      r=6 death round, and I have none to offer either; that is a real and
      relevant fact and the Coordinator should weigh it. But it is a fatigue
      report about the search, not a statement about the problem, and I am
      labelling it as such per inventor-protocol section 4. What I will say
      without hedging is the asymmetric part - stopping AFTER RC-1 and RC-3 is
      defensible and would leave the record honest; stopping BEFORE them would
      leave a published S-BOX-INDEPENDENT headline standing on an arm with no
      decay control, which is the exact defect this batch existed to repair.
      Closure that leaves a falsifier unrun is not closure.

  the_one_finding_that_would_hurt_most: >-
    THE r=6 YOYO ARM UNDER R2 SHOWING THE SAME EXCESS IT SHOWS AT r=5. It would
    cost about 310 s to produce and it would do more damage than anything else
    available. It would mean the random-S-box "signal" is not round-limited, so it
    is not a yoyo; it would supply the single explanation that also accounts for
    R2's structure-destroyed control breaching its band; it would put an
    arm-level baseline offset in the software probe on the table, which in turn
    puts the reference arm's 13.5x "third independent reproduction" of BATCH-002
    in question; and because the reference arm's agreement is what makes the
    random arms interpretable at all, by the preregistration's own P3.1 rule, the
    entire rank-3 reading would collapse rather than weaken. It would not touch
    rank 1 or rank 2, and it would not touch BATCH-002's AES-NI measurement, which
    has its own decay controls. That is the shape of the worst case - contained,
    but it takes the batch's headline with it.

  narrowest_supported_statement: >-
    In a 4x4-nibble SPN over GF(2^4) with independent uniform round keys, one
    fixed 4-bit bijective S-box, a 2^16 diagonal coset and 40 trials per cell, the
    statistic n mod 8 was 0 on 40 of 40 trials at r=4 and r=5 under all three of a
    no-zero-entry, a one-zero and a four-zero non-singular column-preserving
    layer, and was not distinguishable from a 1/8 rate at r=6 and r=7 under any of
    them; the all-fibers-divisible-by-16 signature was present on 40 of 40 trials
    under Z1 at r=4 and under Z4 at r=4 and r=5, and on 0 of 40 at r=6 and r=7
    under every layer. Under Z1 at r=5 the residue was forced with the fiber gcd
    equal to 1 on all 40 trials, and the same non-degenerate combination was
    already present at GF(2^8) under M0 at r=5 in BATCH-002 and BATCH-003
    (max_occ 12). Separately, in a software T-table AES pinned to FIPS-197 C.1 at
    ten rounds, the r=5 yoyo statistic gave 27 hits against an analytic null of
    2.0 under the AES S-box and 22 and 41 hits under two preregistered uniformly
    drawn bijective S-boxes, each arm carrying a different key; two of two draws
    preserving the signal supports a 95% lower confidence bound of 0.224 on the
    fraction of bijections that preserve it, and no r=6 or r=10 arm was run under
    either draw. Nothing above is a statement about full-round or deployed AES and
    no comparison to published cryptanalysis is made in either direction.

  next_concrete_action: >-
    Run RC-1 - the r=6 yoyo arm under random S-box R2, seed 431003, amask 1,
    smask 1, 2^31 trials, identical to Y-R2-main in every parameter except
    rounds. About 310 s on two threads by the producer's own calibration. It is
    the cheapest measurement in the queue that can falsify rather than confirm a
    BATCH-004 headline, it repairs the one new defect this batch introduced, and
    it should be run before EV/DEC records quote the S-BOX-INDEPENDENT sentence.

