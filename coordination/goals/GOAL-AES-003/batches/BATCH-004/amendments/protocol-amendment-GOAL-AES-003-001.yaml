protocol_amendment:
  id: protocol-amendment-GOAL-AES-003-001
  goal_id: GOAL-AES-003
  recorded_at: 2026-08-03
  determination: DECLINE_TO_RAISE_THE_WALL_CLOCK_CEILING
  what_this_amendment_is_and_is_not_about: >-
    THE BATCH CAP IS ALREADY GONE AND THIS AMENDMENT DOES NOT TOUCH IT. The
    maximum_batches cap of 4 was removed on the user's explicit direction of
    2026-08-02, recorded in the goal's own campaign_budget as
    maximum_batches_amendment_20260802. The Coordinator drafting the BATCH-004
    queue did not have that amendment in hand and wrote "BATCH-004 is the last
    batch under the committed ceiling of 4" into the queue, the goal next_action
    and DEC-20260802-f04fb0. THAT LANGUAGE IS STALE and is corrected here.
    What that amendment did NOT do, in its own words, is raise
    total_wall_clock_seconds or max_concurrent. So the live question is the
    WALL-CLOCK ceiling of 30400 s, and this amendment answers that one.
  determination_detail:
    ceiling: total_wall_clock_seconds
    current_value: 30400
    raised_to: null
    reason: >-
      DECLINED, ON THE REVIEWED EVIDENCE, AND THE REASON IS THE EVIDENCE RATHER
      THAN THE CLOCK. Both BATCH-004 reviewers were asked what is still worth
      running and both answered in the same direction.
      The red team: four batches have produced NO candidate mechanism for a
      distinguisher surviving past r=6, and it has none either -- recorded
      explicitly as a fatigue report about the search rather than about the
      problem. Its recommended work is RC-1 through RC-7, roughly one hour, and
      it says in terms that these are CONTROLS, not new directions, and declines
      to dress them as continuation.
      The validator: verdict passed, with four understatements and three
      overstatements, all of which are scoping repairs to existing claims.
      Neither reviewer named a research direction. A ceiling raised to run
      controls on finished work is a ceiling raised to tidy, and tidying does not
      need 30400 more seconds -- the named controls fit inside what remains.
    what_would_change_this: >-
      A named, falsifiable mechanism for surviving past r=6, or a reviewer
      identifying a live direction rather than a control. Neither exists today.
      This declination is revisitable on either.
  what_is_NOT_claimed_by_declining: >-
    NO completion criterion is met. GOAL-AES-003's outcomes (a), (b) and (c) are
    all UNMET; outcome (d), a scoped barrier statement about a construction that
    was actually built and run, is reachable and is what this campaign has in
    fact produced. NO closure quorum is claimed or claimable -- AGENTS.md rule 13
    requires three CONCUR attestations with pairwise-distinct resolved models and
    this harness resolves one. The goal does NOT move to `completed` on this
    amendment and MUST NOT be moved there by any later act that cites it.
  binding_on_the_ledger_archive: >-
    The goal stays `active` with its remaining wall-clock, and its next_action
    becomes the reviewers' control set plus the segment-2 review. If that set is
    exhausted without a live direction emerging, the honest next act is to PAUSE
    the goal on a stated resume condition, not to close it and not to keep
    opening batches against a clock that has stopped buying research.
  decided_by: coordinator
