outcome_ruling:
  applied_outcome: RX-DEAD
  validator_branch_evaluation:
    r0_anchor_pass: true
    g4_anchor_pass: "true (p_extra=1.0 > 0.05, hits=2 <= 8, tripwire not reached)"
    rx_alive: "false (requires p_extra <= 0.05 at G5; observed p_extra = 1.0)"
    rx_weak_branch1: "false (requires 0.05 < p_extra <= 0.15 at G5; observed 1.0 > 0.15)"
    rx_weak_branch2: "LITERAL MATCH (r0 restatement p_extra = 0.036146531... <= 0.05 AND G5 p_extra = 1.0 > 0.15)"
    rx_dead: "LITERAL MATCH (anchor passes AND G5 p_extra = 1.0 > 0.15 AND S_obs = 0 <= null mean 1.0000389812637862)"
  branch_overlap:
    finding: >-
      The frozen rule (IDEA-20260901-026d6a.preregistered_decision_rule, mirrored verbatim in
      PREREGISTRATION.md section 7) does NOT specify an evaluation order or mutual exclusivity among
      RX-WEAK and RX-DEAD. With the observed inputs (531001 restatement significant at 0.0361; G5
      maximally null with S_obs = 0), RX-WEAK branch 2 ('p_extra <= 0.05 at the 531001 restatement
      but > 0.15 at G5 [direction not reproduced]') and RX-DEAD ('anchor passes AND p_extra > 0.15
      at G5 AND S_obs at or below its null mean') BOTH match literally. This is an ambiguity in the
      frozen rule text itself, reported as such; the validator creates no new policy.
    ruling: >-
      The producer's application of RX-DEAD is CONSISTENT with the frozen rule, and RX-DEAD is upheld
      as the batch outcome. Grounds, all internal to the frozen record: (1) specific-over-generic --
      RX-DEAD's condition set is a strict superset of RX-WEAK branch 2's (it adds the conjunct
      S_obs <= null mean), and the observed S_obs = 0 vs null mean ~1.00004 is the maximal form of
      that conjunct; (2) coherence with FX1 -- the preregistered MAIN CARRIER FALSIFIER is defined as
      'RX-DEAD fires: anchor passes, p_extra > 0.15 at seed 531002 with S_obs at/below its null mean;
      the seed-531001 residual adjudicated as unreplicated', which PRESUPPOSES a significant 531001
      restatement (otherwise there is no residual to be unreplicated); a reading that let RX-WEAK
      branch 2 preempt RX-DEAD would make FX1 unreachable in exactly the experimental situation it was
      designed for, since the 531001 restatement was design-time expected to read p = 0.0361 <= 0.05
      (PR-2); (3) the proposal's own H_null prediction names the observed pattern verbatim ('the
      unadjudicated seed-531001 residual (S_obs = 3) does not replicate at 531002 (S_obs at or below
      its null mean)'). The overlap remains a rule-wording observation referred to the Coordinator
      (as the producer did in DEV-1); the consequential difference (RX-WEAK: signature weakened with a
      named 2^32 successor vs RX-DEAD: signature falsified at t=1 within tested scope, FX1, Stage 1
      carrier spend OFF) is noted so the Coordinator adjudicates with it in view.
  semantic_reading: >-
    At the fresh confirmatory seed 531002, all 19 hits sit exactly at the forced envelope (X = 0 on
    every hit; p_extra = 1.0 maximally null; p_deficit = 0.367, so no significant deficit direction
    either). The committed seed-531001 residual (S_obs = 3; naive p_extra = 0.0361,
    hypothesis-generating only) did not replicate. Under the frozen rule this falsifies the
    excess-zero signature at t=1 within the tested scope (FX1), subject to the Coordinator's decision
    record; it is not a statement about the ramp shape (363851 C3 survives) nor about any other
    statistic or carrier candidate.

scope_and_power:
  scope: >-
    Toy tier; one probe cell (amask=1, smask=1); 2^30 exposure; seeds 531001 (committed,
    hypothesis-generating restatement) and 531002 (fresh confirmatory); r=5 alive arms, r=6 dead
    anchors. Any RX-DEAD conclusion is scoped to t=1 within this statistic/probe cell/exposure/seeds;
    no full-round or deployed-AES statement; no published-frontier comparison in either direction (R3).
  power_disclosures:
    - "n_hits = 19 at the confirmatory seed; null mean ~1.00004: a single hit with X = 1 would have kept S at/below the mean, so the test's resolution at this n is coarse; the observed S_obs = 0 is nonetheless the point FURTHEST from the carrier direction (p_extra = 1.0)."
    - "Anchor power limit (preregistered, disclosed): ~2-3 hits expected at r=6, so the anchor catches systematic firing (the historical failure mode, p = 3.95e-5 on the dead arm under the old statistic) but not subtle miscalibration; the amask=15 known-false seat remains the named second control only if Stage 1 is unblocked (it is not)."
    - "The seed-531001 reading is on inspected data and counts as hypothesis-generating only; the decision rule rested on the untouched 531002 arm, per the preregistered split."
    - "n_hits < 50 on every arm: overdispersion audit not run; small-n variance-calibration limit disclosed with each reading, never smoothed."
    - "G6 determinism seat carries 0 hits, so zero_mask_e byte-identity is vacuously satisfied there (new counters verified)."

findings_and_disclosures:
  - "RULE-WORDING OVERLAP (referred to Coordinator): RX-WEAK branch 2 and RX-DEAD both literally match at G5; the frozen rule declares no precedence. Producer disclosed it (DEV-1 / branch_overlap_disclosure) and applied specific-over-generic; validator concurs and upholds RX-DEAD (grounds in outcome_ruling.branch_overlap.ruling)."
  - "DEV-2 (producer-carried convention) verified consistent: hit_trials_logged counts thread-0 hits only (Stage-0 rc8probe quirk); G4's receipt reads hit_trials_logged=0 while its two hits fell on threads 1 and 2 and are fully recorded in hit_e_detail/W_ge1_nontrivial; no analysis field uses hit_trials_logged."
  - "G7 freeze rerun differs from committed R3_table_freeze.json in exactly the three provenance fields {task_id, idea_record, generated_utc}; all table/digest content identical. Consistent with digest-reverification semantics."
  - "G5 receipt excludes 1 trivial swap trial (trivial_swaps_excluded=1, nontrivial=1073741823, n_miss=1073741804); class-rate denominators use n_miss consistently; effect on all reported quantities is O(2^-30), absorbed in the exact rationals."
  - "Unexpected observations recorded by the producer per rule 8 (mask composition per seed, class rates within 0.04% of 1/256, envelope-exact zero masks on the dead arm) are present in RESULTS.json; validator spot-verified the mask-composition counts against the receipts (531001 r5: 4/10; 531002 r5: 7/12; 531001 r6: 2 active/1 inactive; 531002 r6: 0/2) -- all consistent."

