verdict_summary: >-
  Every load-bearing number re-derived independently from the proposal's definitions and the
  committed/run receipts reproduces the producer's values EXACTLY (exact rationals compared as
  Fraction values, floats to the last printed digit): r0 anchor S_obs=0 / p_extra=1; r0 restatement
  S_obs=3 / null mean 23/32 / p_extra=0.036146531121169896; G4 anchor hits=2 / S_obs=0 / p_extra=1 /
  null mean 216010/2304167; G5 hits=19 / S_obs=0 / p_extra=1 / null mean 17180538557/17179868864 =
  1.0000389812637862 / p_deficit=0.3671453866933061. All gates (G2 KAT, G3 Gate-0 extended identity,
  G6 determinism, G7 digests, FX5 source-diff) verified with fresh validator-authored code, and the
  KAT pins plus the determinism double were independently RE-EXECUTED (4 binary invocations;
  byte-identical to producer receipts modulo timing/labels). Snapshot 0f6b6acf8 verified 45/45 by
  sha256 in both worktree and committed blobs, exact declared path set, correct parent, reachable
  from HEAD. Anchor-first chronology verified from timestamps. Zero discrepancies. The preregistered
  outcome RX-DEAD is upheld; the rule-wording overlap with RX-WEAK branch 2 is real, disclosed, and
  referred to the Coordinator (details in outcome_ruling).

re_derivation:
  method: >-
    Fresh validator-authored code (validator_xstat.py, validator_gates.py under this task dir),
    written BLIND from the definitions in IDEA-20260901-026d6a.repaired_statistic / byte_class_partition
    / null_model and PREREGISTRATION.md sections 1-3 only. Producer src/xstat.py and analysis scripts
    were NOT read before or during re-derivation; no producer code reused. Exact rational arithmetic
    (fractions.Fraction) with exact DP convolution of per-hit Poisson-binomial pmfs.
  definitions_used:
    - "Ze(h) = 16 - wt_e_byte; m(h) = vanishing_word_mask; F(h) = 4*popcount(m & 0b1110); X(h) = Ze - F >= 0; S = sum X(h)"
    - "naive null (r0, committed receipts carry no class baseline): every non-forced byte Bernoulli(1/256)"
    - "run-internal empirical null (fresh arms): D0 = 1/256 exact (active-vanishing diagonal); D1 = ezdiag_miss/(4*n_miss); O = ezoff_miss/(12*n_miss)"
    - "per-hit pmf: inactive W=1 hit -> Bin(4,p_diag) * Bin(8,p_off); active hit -> Bin(4,1/256) * Bin(12,p_off)"
    - "p_extra = P(S >= S_obs) one-sided; p_deficit = P(S <= S_obs) descriptive; exact DP convolution"
  stage_r0_anchor:
    receipt: coordination/goals/GOAL-AES-003/batches/BATCH-2f12ac/tasks/TASK-20260901-7e0b71/runs/R5_r6_reference.json
