    per_hit: "masks {1,1,2}, wt_e_byte {16,16,12} -> X = {0,0,0}"
    S_obs: 0
    p_extra_exact: "1/1"
    p_extra_float: 1.0
    null_mean_exact: "11/64"
    null_mean_float: 0.171875
    p_deficit_exact_formula: "(255/256)^44"
    p_deficit_float: 0.8418010543683498
    subclass_inactive: "n=1, S=0, p_extra=1, p_deficit=(255/256)^12=0.9541190815903949"
    subclass_active: "n=2, S=0, p_extra=1, p_deficit=(255/256)^32=0.8822809129497492"
    rule: "R0-ANCHOR-PASS iff p_extra > 0.05 (expected 1.0 exactly)"
