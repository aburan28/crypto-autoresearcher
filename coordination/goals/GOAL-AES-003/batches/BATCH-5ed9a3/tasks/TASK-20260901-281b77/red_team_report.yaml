boundary_statement: >-
  What would now FALSIFY the survivors, and what would genuinely REVIVE the
  signature. (1) WEAK EXCESS-ZERO EFFECTS (rho <= 0.15): falsified by one
  2^32 t=1 arm reading S at/below its run-internal null mean with p_extra >
  0.15 (80% power against rho >= 0.096; cutoff S >= 9 at ~76 hits) or by >= 2
  adequately-powered interior ramp points reading null under X (campaign-level
  closure per the prior boundary item 4). REVIVED by a 2^32 arm with
  p_extra <= 0.05 and S above its null mean -- that would resurrect the
  signature at t=1 and convert today's non-replication into a measured
  seed-variance event (both outcomes preregisterable). (2) e AS CARRIER via
  other quantities: untouched by this statistic; the one-sided perturbation
  candidate (04606c route (ii)) needs its own preregistered test -- neither
  supported nor weakened here. (3) RAMP SHAPE (363851 C3): survives as
  specified; a shape-only reduced Stage 1 remains the Coordinator's design
  change, gated. (4) STATISTIC CALIBRATION: any future firing toward extra
  zeros on a known-dead or known-false seat (r=6 arm, amask=15 seat) remains
  FX4 indictment; any n>=50 arm must report the overdispersion audit. Budget
  halts and infrastructure failures remain rule-5 non-evidence.

