schema: crypto.autoresearch.red_team_report.v1
task_id: TASK-20260901-281b77
batch_id: BATCH-5ed9a3
goal_id: GOAL-AES-003
role: red-team
claim_under_attack: >-
  RX-DEAD (producer TASK-20260901-ed281d, package snapshot 0f6b6acf8, frozen
  spec ledger/proposals/IDEA-20260901-026d6a.yaml): at fresh seed 531002 the
  r=6 anchor passes (hits=2, p_extra=1.0) and the confirmatory J5-2 r=5 arm
  carries 19 hits with S_obs = 0, p_extra = 1.0, so the excess-zero carrier
  signature is falsified at t=1 within tested scope; the seed-531001 residual
  (S = 3, p_extra = 0.0361, naive null) does not replicate; the producer
  resolved a disclosed literal overlap between RX-WEAK branch 2 and RX-DEAD by
  specific-over-generic. The decision-rule wording additionally says the
  carrier clause of e 'dies an F1-class death at t=1'.
verdict: verdict-must-narrow
verdict_summary: >-
  The arithmetic and the preregistered machinery survive in full: I re-derived
  every load-bearing number in fresh code (independent exact-rational DP; no
  producer source reused) and all committed rationals match digit-for-digit --
  G5 null mean 17180538557/17179868864, null variance, p_deficit, both
  subclass means and p_deficits; r0 restatement p_extra = 0.036146531121169896
  exact; r0 anchor 11/64 and 2805/16384; G4 anchor 216010/2304167. The
  per-hit zero_mask_e values re-check as EXACTLY the forced PW-word envelope
  (16920/8580/6210/0) on all 21 fresh hits, and S recomputes to 0/0/3 on
  G5/G4/r0. The RX-DEAD branch fired under a genuinely preregistered rule
  (PREREGISTRATION.md committed before any fresh arm per budget_stamps.jsonl;
  anchor analyzed first per stamps) and it does falsify the excess-zero
  signature at t=1 within the tested scope. BUT the death reading must narrow
  at three joints: (1) POWER -- the rejection region is S >= 4 (P(S>=4|null) =
  0.01875; P(S>=3) = 0.0799), giving 80% power only against per-hit
  extra-zero probability rho >= 0.225 (~4.8x the null per-hit rate ~0.047)
  and 50% power at rho >= 0.139; power against the seed-531001 point estimate
  itself (rho = 3/14) is 0.77, so a true effect of exactly that magnitude
  would still read dead here 23% of the time; (2) EVIDENTIAL CONTENT -- at
  S_obs = 0, p_extra = P(S >= 0) = 1.0 is an IDENTITY holding for any null
  whatsoever and carries zero information beyond S_obs = 0; the actual reading
  is S_obs = 0 with p_deficit = 0.367 (unremarkable under the null), and the
  two-seed joint (S1 >= 3, S2 = 0) has likelihood ratio 0.57-1.45 for rho in
  [0.02, 0.15] -- the pair of seeds cannot discriminate the pure null from a
  weak effect (it even slightly favors rho ~ 0.05 over the null); S_obs = 0
  alone rules out the 531001 point-estimate magnitude at Bayes factor ~97 but
  touches rho = 0.05 only at BF 2.65; (3) SCOPE -- the X statistic does not
  exhaust the carrier question (proposal's own interpretation_limits; the
  one-sided linear candidate and the ramp shape survive), and the prior red
  team's campaign-level falsifier (TASK-20260901-6efcd8 boundary_statement
  item 4) required no-excess at >= 2 adequately-powered points, which one
  n=19 point does not meet. Additionally, the RX-WEAK branch-2 wording
  LITERALLY matches the same data; the specific-over-generic tiebreak applied
  by the producer is defensible and consistent with the proposal's H_null
  prediction, but it is an interpretation not written into the frozen rule,
  and its consequence (preempting the RX-WEAK-named 2^32 successor) must be a
  Coordinator-recorded ambiguity, not a silent absorption. Honest ledger
  outcome: RX-DEAD stands as the branch verdict falsifying the excess-zero
  SIGNATURE at t=1 within statistic/cell/exposure/seeds at the disclosed
  power; the carrier clause of e is WEAKENED (non-replicated, named-unmeasured
  toward dead at t=1), not dead; the 2^32 successor and the ramp-shape
  question survive with concrete revisit conditions.

joints:
  - id: RT-A
    name: POWER -- is 'dies an F1-class death at t=1' licensed by n=19 and p_extra=1.0?
    coordinator_prior_point: (1) finite-miss-trial null rates / non-replication pressure
    status: OBJECTION SUSTAINED (death wording overclaims; signature falsification within tested scope stands)
    objection: >-
      Fresh-code exact DP on the G5 null (12 inactive hits at Bin(4,p_diag)*
      Bin(8,p_off) + 7 active hits at Bin(4,1/256)*Bin(12,p_off), committed
      rationals p_diag = 2097265/536870902, p_off = 25166857/6442450824):
      tails P(S>=1) = 0.6329, P(S>=2) = 0.2643, P(S>=3) = 0.07995, P(S>=4) =
      0.01875, P(S>=5) = 0.00357. The preregistered RX-ALIVE conjunct
      p_extra <= 0.05 therefore rejects only at S_obs >= 4 (and S >= 4 is
      automatically above the null mean 1.00004). Effect model matching the
      committed residual's shape (each hit independently gains exactly one
      extra zero with probability rho -- all nonzero X at 531001 were X = 1):
      power(rho) at cutoff 4 is 0.051 (rho=0.02), 0.131 (0.05), 0.244 (0.08),
      0.329 (0.10), 0.547 (0.15), 0.771 (0.214), 0.932 (0.30); 50% power at
      rho = 0.139, 80% power at rho = 0.225. Hence: (i) the arm had only 77%
      power against the seed-531001 point estimate rho = 3/14 = 0.214 -- a
      true effect of exactly the unreplicated magnitude would still have read
      RX-DEAD here with probability 0.23; (ii) effects with rho <= 0.15
      (up to ~3x the null per-hit rate) survive this arm with probability
      >= 0.45; (iii) 'n=19 and exact p=1.0' licenses absence of the signature
      at the tested power, not proof of absence of weak effects. The
      F1-class-death wording reads as closure of the carrier question; the
      data close only the excess-zero signature at this exposure within this
      cell (core rule 6).
    cheapest_falsification_control: >-
      0 cipher runs (executed this session, fresh-code DP, seconds): the power
      curve above IS the control. Future arms: preregister the minimum
      detectable rho with each verdict; one 2^32 t=1 arm (~76 hits expected,
      rejection cutoff S >= 9, 80% power at rho = 0.096, power 0.826 at rho =
      0.10, 0.999 at rho = 0.214 -- computed this session) adjudicates exactly
      the weak-effect region this arm cannot touch; ~1 run, minutes on
      campaign hardware.
  - id: RT-B
    name: BRANCH OVERLAP -- RX-WEAK branch 2 and RX-DEAD both literally match
    coordinator_prior_point: disclosed branch overlap; honest ledger outcome
    status: OBJECTION SUSTAINED (tiebreak defensible but unwritten; must be Coordinator-recorded, successor not preempted)
    objection: >-
      Verified from the frozen rule text and the committed numbers: RX-WEAK
      branch 2 requires 'p_extra <= 0.05 at the 531001 restatement but > 0.15
      at G5' -- r0 restatement p_extra = 0.0361 <= 0.05 (exact rational
      re-derived) AND G5 p_extra = 1.0 > 0.15: MATCH. RX-DEAD requires
      'p_extra > 0.15 at G5 AND S_obs at or below its null mean' -- 1.0 > 0.15
      AND 0 <= 1.000039: MATCH. The frozen rule contains no precedence order
      for this intersection. The producer's specific-over-generic resolution
      (RX-DEAD adds the S_obs<=null-mean conjunct that RX-WEAK-b2 lacks) is
      defensible and is exactly the proposal's own H_null prediction ('the
      unadjudicated seed-531001 residual does not replicate at 531002 (S_obs
      at or below its null mean) ... the carrier clause of e is then dead at
      t=1 within the tested scope'), and the proposal assigned P(RX-DEAD) ~
      0.40 knowingly. But the semantic content of RX-WEAK-b2 -- 'direction not
      reproduced' -> WEAKENED, carrier clause stays named-unmeasured, named
      successor one 2^32 t=1 arm -- is ALSO the honest description of what
      happened: a marginal p = 0.036 on inspected, hypothesis-generating data
      failed to replicate at a fresh seed under a test with 77% power against
      its own point estimate. Applying RX-DEAD's default ('Stage 1 carrier
      spend is OFF; default return to idea generation with e named
      non-carrier at t=1') silently preempts the very successor RX-WEAK-b2
      names for this situation. Honest ledger outcome: record RX-DEAD as the
      branch verdict for the SIGNATURE (the preregistered falsifier FX1
      fired), record the rule ambiguity explicitly, and carry the 2^32 arm
      plus ramp shape forward as concrete revisit conditions rather than
      closing the lane.
    cheapest_falsification_control: >-
      0 runs: rule-textual repair for any successor spec -- add an explicit
      precedence clause (when both RX-WEAK-b2 and RX-DEAD match, RX-DEAD
      governs the signature verdict and the RX-WEAK-b2 successor survives as a
      named revisit condition), or fold the S_obs<=null-mean conjunct into
      RX-WEAK-b2 as a distinguishing sub-branch. The ambiguity is a wording
      defect, not a data defect.
  - id: RT-C
    name: CONDITIONAL-NULL VALIDITY -- can the run-internal null bias the reading toward p_extra=1.0?
    coordinator_prior_point: (1) finite-miss-trial estimation of class-wise null rates
    status: OBJECTION FAILS AS TO BIAS; SURVIVING ASSUMPTIONS DISCLOSED
    objection: >-
      The bias route is structurally closed at this observation: p_extra =
      P(S >= S_obs) at S_obs = 0 is the identity 1.0 for ANY null model on
      nonnegative S -- no rate estimation, finite-sample DP conditioning, or
      mask-subclass sizing can move it; it carries NO evidential force beyond
      S_obs = 0 itself (RT-A/RT-E carry the evidence). Checked anyway: (i)
      class rates come from the arm's own miss trials with denominators
      4*n_miss and 12*n_miss (n_miss = 1073741804; committed rationals are the
      reduced forms of zeros/(4 n_miss), zeros/(12 n_miss) -- verified by
      cross-multiplication), relative standard error ~1.4e-4, negligible for
      any reading here; (ii) the DP conditions on point estimates (declared
      approximation) -- harmless at these denominators; (iii) mask subclass
      sizes (7 active/12 inactive) are conditioned on the realized multiset
      per the frozen rule, and the composition is unremarkable under word
      symmetry (Bin(19,1/4) CDF at 7 = 0.92); (iv) the null mean conjunct
      (1.000039, SE negligible) is robust. Surviving disclosed assumptions:
      the Bernoulli-across-bytes independence within a hit (positive
      correlation would misstate p_deficit; for S=0 clustering typically
      RAISES P(X=0), making the observation less remarkable, no reversal) and
      the premise that word-vanishing conditioning does not change the
      zero-rate of the remaining bytes (unproven for AES r=5, two-sided, no
      known mechanism biasing toward 1.0; both r=6 dead arms read X=0 under
      the same conditioning, consistent). Critically, no null calibration can
      HIDE a true excess-zero effect: S_obs = 0 is a raw count -- the 19 hits
      contain zero extra zero bytes (re-verified per hit from zero_mask_e).
      The only route by which a true signal is missed is low power (RT-A), not
      null misconstruction.
    cheapest_falsification_control: >-
      0 runs (identity argument above, executed this session). Future arms:
      the preregistered overdispersion audit at any n_hits >= 50 (first two
      per-hit X moments vs null mean/variance) polices the independence
      assumption; a synthetic null-object arm (hits drawn from the arm's own
      miss distribution) would empirically verify p-value uniformity of the DP
      test if ever budgeted.
  - id: RT-D
    name: PROVES-TOO-MUCH -- death reading on dead arms and null objects; anchor triviality
    coordinator_prior_point: (4) anchor firing on dead data indicting the statistic
    status: CONTROL PASSES FOR THE STATISTIC; DEATH WORDING REACHED A ZERO-INFORMATION FLOOR (recorded)
    objection: >-
      Executed on both committed dead arms and the fresh dead arm. (i) The
      RX-DEAD conjuncts literally hold on the committed r=6 reference (n=3,
      S=0, p_extra=1.0, null mean 11/64 > 0) and on G4 (n=2, S=0, null mean
      0.0937): the 'death' language applies equally to objects where no
      carrier claim ever existed. This is not an indictment of the verdict
      (absence of a signature on a null object is exactly the expected
      reading) but it exhibits RX-DEAD's evidential floor: the branch is
      reachable at n=2 with zero information, so it can never carry more
      weight than the power of the arm that fired it (RT-A). (ii) The
      statistic itself does NOT fire on dead/null objects: P(reject | null) =
      P(S >= 4) = 0.01875 <= 0.05 by construction at n=19, and both dead arms
      read p_extra = 1.0; the Stage-0 proves-too-much indictment (raw
      statistic p = 3.95e-5 on the dead arm) does not recur -- the repair
      behaves exactly as designed (the tautology now reads as the null's
      mode). (iii) The anchor pass is NOT trivial by construction: under the
      G4 null, p_extra <= 0.05 fires at S_obs >= 2 (P = 0.00398) while S_obs
      = 1 still passes (p_extra = 0.0897); the anchor fails iff the dead arm's
      ~2 hits carry >= 2 extra zeros between them -- it catches systematic
      firing (the historical failure mode) and nothing subtler, confirming the
      proposal's disclosed anchor power limit quantitatively. The anchor is
      also structurally satisfied whenever every dead-arm hit fills exactly
      the forced envelope, which the envelope theorem predicts for ANY round
      function, so it cannot detect miscalibration acting only through
      variance or the deficit direction -- disclosed, and policed at future
      n>=50 arms by the overdispersion audit.
    cheapest_falsification_control: >-
      0 runs, executed this session (both dead arms + construction argument).
      Carried named control: the amask=15 structure-destroyed known-false seat
      (363851 Stage 1b) remains the second false-positive control if Stage 1
      is ever unblocked.
  - id: RT-E
    name: SEED VARIANCE -- non-replication vs weak signal; does RX-DEAD preempt the 2^32 successor honestly?
    coordinator_prior_point: (2) non-replication of the weak 531001 residual at 531002
    status: OBJECTION SUSTAINED AS TO PREEMPTION; NON-REPLICATION IS THE HONEST READING, DEATH-OF-THE-SIGNAL IS NOT
    objection: >-
      Fresh-code joint analysis of the two seeds (independent under pinned
      streams): under the pure null, P(S1 >= 3 at 14 hits, naive null) =
      0.03615 (exact rational re-derived) and P(S2 = 0 at 19 hits) = 0.36715,
      joint = 0.01327. Under the Bernoulli extra-zero effect rho: joint(rho =
      0.02) = 0.0198, (0.05) = 0.0234, (0.08) = 0.0210, (0.10) = 0.0177,
      (0.15) = 0.0091, (0.214) = 0.0028 -- likelihood ratio null/effect is
      0.67, 0.57, 0.63, 0.75, 1.45, 4.71 respectively. Reading: the two-seed
      pair is NEARLY UNINFORMATIVE about weak effects -- for rho in [0.02,
      0.15] the LR stays inside [0.57, 1.45], and the pair actually slightly
      FAVORS rho ~ 0.05-0.08 over the pure null (the marginal S1 = 3 is more
      likely under a weak effect than under the null). S2 = 0 alone cuts
      against the 531001 point-estimate magnitude at BF ~ 97, against rho =
      0.15 at BF ~ 22, but against rho = 0.05 only at BF 2.65. So: the correct
      conclusion is NON-REPLICATION of a marginal residual from inspected
      (hypothesis-generating) data, with the strong form of the residual
      (rho ~ 0.21) substantially disfavored and weak forms (rho <= 0.15)
      alive at this exposure. This is not 'the signal is dead'; it is 'this
      arm could not see below rho ~ 0.14-0.22'. The RX-WEAK successor names
      exactly the right discriminant: at 2^32 (~76 hits) the same test
      reaches cutoff S >= 9, 80% power at rho = 0.096, power 0.826 at rho =
      0.10 (computed this session) -- it adjudicates precisely the region the
      two seeds left open. RX-DEAD's default return-to-ideation preempts that
      successor on the strength of one underpowered non-replication plus a
      rule ambiguity (RT-B); the honest disposition keeps the revisit
      condition concrete (inventor-protocol closure standard: named
      obstruction, argument, and what remains open).
    cheapest_falsification_control: >-
      One 2^32 t=1 arm (J5-2 seat family, seed 531002 or a third seed) with
      the same run-internal null and preregistered cutoff: ~1 run, minutes on
      campaign hardware; power table computed above. Cheaper pure-analysis
      control already executed: the joint-LR table above quantifies exactly
      what the two seeds settled and what they did not.

proves_too_much:
  control_executed: true
  known_dead_and_null_objects: >-
    RX-DEAD's literal conjuncts hold on three objects: the committed r=6
    reference (n=3, S=0, p_extra=1.0, null mean 11/64), the fresh G4 dead arm
    (n=2, S=0, null mean 216010/2304167), and -- by the same logic -- any
    future arm whose hits all read X=0, including pure-null synthetic arms.
    No carrier claim existed on the dead arms, so the 'death' wording kills
    objects that were never alive: harmless to the signature verdict, fatal to
    any extra evidential weight in the wording beyond 'no extra zeros
    observed at this arm's power'. The statistic itself does not prove too
    much: P(fire | null) = 0.01875 <= 0.05 by construction at n=19; both dead
    arms read maximally null; the Stage-0 indictment (firing on the dead arm)
    does not recur. The argument 'S_obs=0 with p_extra=1.0 falsifies the
    carrier' does NOT go through on objects where no carrier claim existed --
    it correctly reads 'null' there -- so the proves-too-much control passes
    for the statistic and fires only on the closure LANGUAGE (RT-A/RT-D/RT-E).
  anchor_triviality_check: >-
    The anchor pass is not trivial by construction (fails at S_obs >= 2, P =
    0.00398 under the G4 null; passes at S_obs = 1, p_extra = 0.0897), but
    with ~2-3 expected dead-arm hits it catches only systematic firing, as the
    proposal disclosed (PR-3). Quantified here: the anchor cannot detect
    variance miscalibration or deficit-direction errors, and it is
    structurally satisfied whenever dead-arm hits fill exactly the forced
    envelope (predicted for any round function by J-A). Necessary but weak
    control; its disclosed ceiling stands.

scope_attack:
  what_the_reading_certifies: >-
    At (aes, r5, amask=1, smask=1, 2^30, seed 531002, armid 1, 4 threads; toy
    tier), under the envelope-relative X statistic with the run-internal
    conditional null, 19 hits carry S_obs = 0 extra zero bytes beyond the
    forced envelope (every zero_mask_e equals the forced PW-word mask
    exactly), vs null mean 1.000039; the preregistered RX-DEAD branch fired
    with all gates green and the anchor analyzed first. This certifies: H1
    (excess-zero signature at t=1) is falsified within this statistic, this
    probe cell, this exposure, these seeds, at the arm's measured power (80%
    against rho >= 0.225; 77% against the 531001 point estimate; <= 55%
    against rho <= 0.15); the seed-531001 residual is adjudicated UNREPLICATED
    (its point-estimate magnitude disfavored at BF ~ 97 by S2=0 alone).
  what_it_does_not_certify: >-
    It does NOT certify: (i) absence of weak excess-zero effects rho <= 0.15
    (two-seed joint LR 0.57-1.45 -- uninformative; 2^32 needed); (ii) that e
    is not the carrier via any other quantity (the one-sided linear candidate
    IDEA-20260901-04606c route (ii) survives, unmeasured -- the proposal's own
    interpretation_limits says X does not exhaust the carrier question); (iii)
    the ramp-shape question (363851 C3 survives, Stage 1 stays gated, not
    spent); (iv) campaign-level carrier closure (the prior red team's boundary
    falsifier required >= 2 adequately-powered points; one n=19 point at 77%
    power against its own target is not that); (v) anything beyond toy tier,
    this cell, this family; (vi) anything about full-round or deployed AES; no
    published-frontier comparison in either direction (R3). The sentence 'the
    carrier clause of e dies an F1-class death at t=1' asserts (ii) and (iv)
    and is not licensed; FX1's own scoped wording ('within this statistic/
    probe cell/exposure/seeds') is the licensed form.

branch_overlap_recommendation: >-
  For the Coordinator's composition: (1) record that BOTH RX-WEAK branch 2
  and RX-DEAD literally match the G5/r0 numbers (verified this session from
  the frozen rule text); (2) accept the producer's specific-over-generic
  application of RX-DEAD as the signature verdict -- it is consistent with
  the proposal's H_null prediction and FX1 was the preregistered main
  falsifier; (3) record the missing precedence clause as a rule-wording
  defect of IDEA-20260901-026d6a (repair wording supplied at RT-B) so future
  specs carry an explicit order; (4) do NOT let RX-DEAD's default silently
  preempt the RX-WEAK-b2-named 2^32 successor: the honest ledger outcome is
  signature falsified at t=1 within tested scope (at disclosed power) +
  carrier clause WEAKENED (non-replicated) + 2^32 arm and ramp-shape question
  retained as concrete revisit conditions. Status vocabulary: the hypothesis
  H1/excess-zero-signature moves toward rejected-within-tested-scope per FX1;
  the carrier clause of e itself is weakened, not rejected, because the
  statistic does not exhaust it and the power ceiling is disclosed.

scope_narrowed_restatement: >-
  CANDIDATE LEDGER WORDING. Stage r0+r1 of IDEA-20260901-026d6a at t=1 (toy
  tier; sbox=AES k=16; probe cell amask=1, smask=1; 2^30; seeds 531001
  committed/inspected and 531002 fresh): the envelope-relative X statistic
  (exact DP, run-internal conditional null; all committed rationals
  independently re-derived digit-for-digit) reads: committed r=6 dead arm
  S=0, p_extra=1.0 (anchor on committed data); fresh r=6 seed-531002 anchor
  2 hits (<=8 band), S=0, p_extra=1.0, analyzed first; confirmatory J5-2
  seed-531002 arm 19 hits (12 inactive-word, 7 active-word), every hit's
  zero-byte mask of e EXACTLY the forced vanishing-word envelope and nothing
  beyond, S_obs = 0 vs null mean 1.000039, p_deficit = 0.367 (no deficit
  direction either); all integrity gates pass. HENCE: the preregistered
  RX-DEAD branch fires -- the excess-zero signature of e beyond the forced
  envelope is ABSENT at t=1 within this statistic, this probe cell, this
  exposure, these seeds, at the arm's disclosed power: rejection only at
  S >= 4 (size 0.01875); 80% power against per-hit extra-zero probability
  rho >= 0.225 (~4.8x null rate); 77% power against the seed-531001 point
  estimate rho = 3/14. The seed-531001 residual (S=3, p_extra=0.0361 naive
  null, on inspected data, hypothesis-generating only) is adjudicated
  UNREPLICATED: its point-estimate magnitude is disfavored by S2=0 at Bayes
  factor ~97, but the two-seed joint evidence is uninformative for weak
  effects (likelihood ratio 0.57-1.45 for rho in [0.02, 0.15]) -- weak
