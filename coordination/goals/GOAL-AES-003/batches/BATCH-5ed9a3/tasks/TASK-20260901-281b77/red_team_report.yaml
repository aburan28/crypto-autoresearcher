  by one 2^32 arm (80% power at rho = 0.096, computed). RULE-WORDING NOTE:
  the RX-WEAK branch-2 wording also literally matches; the specific-over-
  generic tiebreak applying RX-DEAD (consistent with the proposal's H_null
  prediction) is recorded as an interpretation of an unordered rule
  intersection, referred to the Coordinator with repair wording. NOT
  ESTABLISHED BY THIS OUTCOME: that e is not the carrier via other quantities
  (one-sided linear candidate IDEA-20260901-04606c route (ii) survives
  unmeasured); the ramp-shape question (363851 C3 survives; Stage 1 stays
  gated and was not spent); campaign-level carrier closure (prior boundary
  falsifier requires >= 2 adequately-powered points). Nothing beyond toy
