joints:
  - id: J1
    name: "'alive at every r<=10' / r*_aff undefined -- round-count coverage"
    coordinator_prior_flag: (a)
    attack: >-
      The census computed r=1..10 only. Within that window the verdict's wording is exactly what
      was computed ('alive at every r <= 10', 'r*_aff undefined within r<=10' -- RESULTS.json
      census_vs_preregistered_table.r_star_aff), so it is NOT an r-extrapolation as worded. The
      genuine gap is inside the window: empirical (cipher-touching) coverage of the identity law
      exists only at r in {2,5,6} -- gate0 keyed trials at r=5 (runs/gate0.json), bridge cells at
      r=2,5,6 (runs/keyed_bridge.json B1-B5), fixture arm at r=6 (runs/fixture_arm.json). At
      r in {1,3,4,7,8,9,10} flatness rests on the r-free derivation alone, conditioned on the
      convention formula M_r = SR.(MC.SR)^{r-1}, D_r = (ISR.IMC)^{r-1}.ISR (runs/census.json
      convention block) being the exact linear part of the pinned cipher at those r. That formula
      is checked per-r only by the census code's own D_r M_r = I guard (self-consistent, see J2)
      and is externally anchored only at r=5 and r=10 by KAT (runs/pin.json). Any reader who
      strengthens 'alive at every r<=10' to 'alive for all r' (the derivation is r-free) imports
      an untested convention assumption beyond r=10; the record discloses this
      (quantifier_order: 'the universal quantifier over r beyond 10 is NOT tested'), but the
      verdict sentence does not carry the disclosure.
    holds_or_breaks: >-
      HOLDS as worded (scoped to r<=10); BREAKS only if read universally over r. Requires an
      attached scope statement, not a retraction.
    evidence_artifacts: [runs/census.json, runs/gate0.json, runs/keyed_bridge.json, runs/fixture_arm.json, runs/pin.json, IDEA-20260901-04606c proof_search_map.quantifier_order]
    cheapest_falsification_control:
      what: >-
        Pre-register a flatness extension at r=11..16 (same law, same rho recursion), then run
        census046.py on the extended range (zero cipher compute) PLUS one keyed bridge cell at
        r=16 (500 trials, fresh seed) to touch the extended range with an actual cipher trial.
      falsifies_if: D_r M_r != I_128 or any non-flat W law at r in 11..16 under the pinned convention.
      cost: seconds of GF(2) algebra (~the 100-instance census took ~61 s by file mtimes) + seconds of keyed trials. One run slot at most.

  - id: J2
    name: the flat census is flat BY CONSTRUCTION -- it confirms the convention, not AES
    coordinator_prior_flag: (b)
    attack: >-
      census046.py builds M_r/D_r from the pinned convention formula written inside census046.py
      and checks P_j(D_r M_r)Pi_A against P_j Pi_A. Since D_r M_r = I_128 holds for ANY
      self-consistent affine convention -- the record itself discloses this under confounders
      ('self-consistent convention drift': 'a wrong-but-self-consistent port would pass every
      algebraic check') -- the 100/100 flat table is a self-consistency verification of the
      census's own convention formula against the derivation, with ZERO cipher evaluations
      (record P2, census.json object line 'zero cipher compute'). It confirms the instrument's
      convention/derivation alignment, not a property of AES or of any cipher. The load-bearing
      data that tie the convention to an actual binary are exactly: gate0's 1000 keyed trials
      (basis-vector simulation of the round functions), the bridge's 2500 keyed trials
      (byte-level round functions), the fixture arm's 2^30 trials (C round functions, KAT-pinned),
      and the KAT pins on external constants (FIPS-197 C.1 r=10, BATCH-003 anchors r=5/r=10,
      runs/pin.json all match). The census's evidential weight is digest discipline and rho-table
      checking, NOT discrimination. Sharpening: every link in this convention-to-cipher chain is
      fresh code of this one producer batch (gate0.py, census046.py, bridge.py, affarm046.c);
      cross-lineage independence is explicitly NOT claimed (INDEPENDENCE_AUDIT.md section 4: the
      02f7c4 arm B3 re-measurement 'is NOT discharged here'), and shared-harness bugs conditional
      on the round function are 'stated, not discharged' (same section, record confounders).
    holds_or_breaks: >-
      HOLDS as a derivation verification; BREAKS if cited as empirical evidence about AES. The
      verdict must attribute empirical weight to the keyed arms and the single fixture arm, and
      name the census as a convention self-consistency check.
    evidence_artifacts: [runs/census.json, IDEA-20260901-04606c confounders, src/INDEPENDENCE_AUDIT.md sections 3-4, runs/pin.json, runs/keyed_bridge.json]
    cheapest_falsification_control:
      what: >-
        Keyed bridge cells at r in {3,7} (two derivation-only round counts), 500 trials each,
        fresh seed -- seconds. Full mitigation remains the named cross-lineage re-measurement
        (IDEA-20260901-02f7c4 arm B3), which this batch does not discharge.
      falsifies_if: any trial with q0^q1 != p0^p1 or W != 4-|A| at r=3 or r=7.
      cost: seconds; no new instrument needed (bridge.py exists).

  - id: J3
    name: single seed / single key at 2^30 vs recorded seed variance of the AES excess
    coordinator_prior_flag: (c)
    attack: >-
      hits=2^30 with T=0 at seed 46063001, key c97a37ee... (runs/fixture_arm.json), while the
      AES-side excess's seed variance is on record (14 vs 19 hits, EV-AES-5478a0 OBS-B16-3).
      Against the AFFINE arm the attack is largely absorbed by structure: the identity law is a
      per-trial, seed-free identity by derivation (P1), the whist is W=3 on
      1073741824/1073741824 nontrivial trials -- a deterministic fact, not an estimate -- T=0
      vs E[T]=0.25 has P=0.779 (verified in my run 1 arithmetic), and three distinct seed
      streams already saw the law at 100% (gate0 '2026090104606c' 1000 trials; bridge
      '46060901b' 2500 trials; arm 46063001 2^30 trials). The surviving exposures are (i) a
      seed-specific implementation fault at 2^30 scale -- byte-identical determinism double-runs
      reused the same seed, so they cannot catch it -- and (ii) the COMPARATOR side: the AES
      death at r=6 is a carried statistical statement (one-sided pooled 1.72x bound, EV-AES-d33b1c
      OBS-B2-5) built from seed-sensitive measurements (OBS-B16-3 shows the r=5 excess moves
      14<->19 across two seeds); the verdict inherits that uncertainty (record confounders: 'THE
      VERDICT INHERITS ITS COMPARATOR'). The mismatch is a contrast between one deterministic
      affine measurement and one statistical, seed-sensitive nonlinear bound.
    holds_or_breaks: >-
      HOLDS for the affine arm (deterministic law, three seed streams); SURVIVES as an open scope
      statement for the comparator side. A second-seed rerun of the arm is cheap insurance, not a
      verdict precondition.
    evidence_artifacts: [runs/fixture_arm.json, runs/gate0.json seed field, runs/keyed_bridge.json seed field, EV-AES-5478a0 OBS-B16-3, IDEA-20260901-04606c confounders]
    cheapest_falsification_control:
      what: >-
        Re-run the fixture arm at one fresh pre-registered seed AND fresh key (~48.7 s wall at
        8 threads per runs/fixture_arm.timing.txt; one run slot).
      falsifies_if: any nontrivial trial with W != 3, or hits below the pre-registered band 2^30-8.
      cost: "~49 seconds + one run slot. Prediction if the claim holds: identical W statistics, hits = 2^30 - T', T' ~ Poisson(0.25)."

  - id: J4
    name: scope gap -- 'affine trial map hits at r=6' vs 'AES's excess is destroyed by nonlinearity'
    coordinator_prior_flag: beyond the prior (scope attack)
    attack: >-
      What hits=2^30 ACTUALLY says: under the pinned AFFINE cipher (SBOX=id), in cell
      (r=6, A={0}, S={0}), at one seed/key, the instrument's W>=1 statistic fires on every
      nontrivial trial. It says nothing about AES. The step to 'nonlinearity-driven destruction'
      chains three facts: (i) affine alive at r=6 [measured here]; (ii) AES dead at r=6 [carried
      comparator, EV-AES-d33b1c OBS-B2-5, one-sided pooled 1.72x bound -- not re-measured this
      batch]; (iii) the only factor differing between (i) and (ii) is the S-box. Step (iii) is
      controlled but NOT sealed: the affine arm ran on a fresh binary (affarm046.c) while the
      AES death measurement ran on the campaign build (BATCH-014/015 lineage); the bridges are
      the KAT pins (all matching, runs/pin.json) and a source-diff against BATCH-b41ba9
      probe_sbox.c -- the archived AFFINE probe lineage, not the campaign AES build itself
      (INDEPENDENCE_AUDIT.md section 2). Also the dead side at r=6 is n=1 S-box: the random-
      bijection arms of EV-AES-048545 O-3 were ALL at r=5; no committed r=6 arm with a
      nonlinear S-box other than the AES table appears in anything I read. So 'nonlinearity-
      driven' at r=6 generalizes from ONE nonlinear S-box (AES) vs ONE affine S-box (identity).
      Two further gaps: (a) 'nonlinearity-driven' is ambiguous between 'nonlinearity alone
      suffices' and 'nonlinearity is the factor that differs between the alive and dead
      measurements'; the data supports only the factor-contrast reading -- the record's own
      mechanism text says 'interaction of nonlinearity with the geometry', and the bare
      shorthand overstates it; (b) 'the death round is not carried by the linear skeleton'
      conflates 'not carried by THIS census's pair-difference identity object' with 'not carried
      by anything linear': the record itself names a linear-geometric quantity it declined to
      census -- the one-sided perturbation q0^p0 = M_r^-1 Z_keep M_r d, of which it says 'the
      linear layer genuinely enters it, and it may carry a death round' (IDEA-20260901-04606c
      object, route (ii)). The census rules out the pair-difference skeleton as the death-round
      carrier; it does not rule out linear geometry generally. Finally a wording slip: 'the
      AES-shaped instrument dies at r=6' -- the instrument is demonstrably alive at r=6 on the
      affine cipher (that is the fixture arm); what dies is the signal under the AES S-box.
    holds_or_breaks: >-
      The factor-contrast core HOLDS (same geometry, one factor varied, huge contrast 2^30 vs
      <=1.72x-null). The bare wording BREAKS in three places and must narrow: (1) 'nonlinearity-
      driven' -> factor-contrast reading with n=1 nonlinear S-box at r=6 disclosed; (2) 'not
      carried by the linear skeleton' -> 'not carried by the instrument's affine-limit
      pair-difference map'; (3) 'instrument dies' -> 'signal under the AES S-box dies'.
    evidence_artifacts: [runs/fixture_arm.json, src/INDEPENDENCE_AUDIT.md section 2, EV-AES-048545 O-3/O-4/O-7, IDEA-20260901-04606c object route (ii) and mechanism, carried citation of EV-AES-d33b1c OBS-B2-5]
    cheapest_falsification_control:
      what: >-
        ONE r=6 arm with a random bijective S-box (the EV-AES-048545 O-3 recipe moved to r=6),
        full 2^30, campaign build, pre-registered band vs the analytic null.
      falsifies_if: >-
        the random-bijection arm is ALIVE at r=6 (excess well above null): then the r=6 death is
        AES-table-value-specific, not nonlinearity-driven, and the factor-contrast reading dies.
      cost: one 2^30 nonlinear arm (~2-4 minutes on the campaign build by EV-AES-048545 O-3 precedent at 2^32 scale).

  - id: J5
    name: "'the residual carrier is e=(q0^q1)^(p0^p1)' -- carrier status is unmeasured"
    coordinator_prior_flag: beyond the prior
    attack: >-
      e is the deviation vector from the identity law. In the affine limit e=0 identically --
      that, and only that, is what the four data points measure (3500 keyed trials + 2^30 arm
      trials with q0^q1 = p0^p1 on 100%). NOTHING in this batch measures e under a nonlinear
      S-box. The claim that the r=5 residual rides on small-e trials is the record's own
      heuristic H2, explicitly 'heuristic', with rigorous support only for the statement that e
      is a well-defined interpolation parameter, and with the record saying 'nothing committed
      yet measures e's distribution under a nonlinear S-box' and 'Not validated in THIS record'.
      'The residual carrier is e' is therefore a DEFINITION plus a routing decision, not an
      established carrier. The claim under attack carries it as conclusion; the ledger wording
      must demote it to 'named candidate carrier, unmeasured (bcb117 H2 owns the test)'.
    holds_or_breaks: >-
      BREAKS as stated (no supporting datum in the batch); survives trivially as a named
      candidate. This is a wording narrowing, not a verdict falsification.
    evidence_artifacts: [IDEA-20260901-04606c heuristic_assumptions H2, runs/keyed_bridge.json identity_law_100pct fields, runs/fixture_arm.json]
    cheapest_falsification_control:
      what: >-
        One r=5 AES arm instrumented to log the per-trial weight of e=(q0^q1)^(p0^p1), full
        2^30, histogram of wt(e) on hit vs non-hit trials -- this is exactly bcb117's first
        ramp point.
      falsifies_if: the residual is isotropic-large-e (hits do not concentrate on small-e trials) -- H2's own falsification condition.
      cost: one 2^30 nonlinear arm with per-trial e logging (~2-4 minutes + small instrument change).

proves_too_much:
  method: >-
    Run the argument against objects for which the conclusion (skeleton alive / excess present)
    is KNOWN FALSE, per the review architecture's known-false control.
  objects:
    - object: >-
        The keyed murmur3-fmix64 balanced Feistel substitute family, shown ABSENT at matched
        2^30 exposure (EV-AES-5478a0 OBS-B16-1: 2,1,0,1 hits at r=4,8,16,32 vs ~14 expected;
        OBS-B16-2: 0 hits at second seed; EV-AES-dec938 single-instance absence, carried via
        EV-AES-5478a0).
      does_the_argument_go_through: false
      reason: >-
        The argument's premises are (a) swap preserves XOR difference -- true for ANY cipher, it
        is a property of the instrument; and (b) D affine with DE = id on differences -- FALSE
        for this family: its decryption is a balanced Feistel network with a nonlinear round
        function (family description in EV-AES-5478a0 tested_parameters: 'keyed deterministic
        balanced Feistel (murmur3-fmix64 round function lineage)'; the nonlinearity of fmix64
        itself is my own background knowledge, provenance RECALLED, flagged not support). With
        nonlinear D there is no global linear part M_r, the census object P_j(D_r M_r)Pi_A is
        undefined, and the identity-law derivation breaks at premise (b). The census's domain is
        affine ciphers of the pinned SPN geometry -- the record's test_boundary says exactly
        this ('nothing transfers to substitute cipher families ... not SPNs of this geometry').
        So the argument does NOT prove the known-dead substitute alive; it does not transfer at
        all.
      residual_risk: >-
        The non-transfer is by derivation, not by measurement, and is not empirically guarded in
        this batch: if someone applied the census's algebra to the substitute by treating its
        input-output map as linear (it is not), the argument FORM would be contagious. Cheapest
        empirical guard: run the identity-law bridge check (q0^q1 == p0^p1?) on the archived
        Feistel substitute at r=5, 500 trials -- seconds; the harness exists and is byte-parity
        verified (EV-AES-5478a0 OBS-B16-1 r=16 detcheck). Prediction: the identity law FAILS on
        most trials. If it HELD, the identity law would not discriminate alive from dead and the
        argument would prove too much. I did NOT run this guard (red-team role: name routes; I
        ran no cipher trials this session).
    - object: >-
        In-geometry known-false object: the structure-destroyed affine cell (A={0,1,2,3}, S={0}),
        where the census predicts P(W>=1)=0 at every r and committed AES readings are ~null
        (EV-AES-048545 O-4, carried).
      does_the_argument_go_through: no_overproof
      reason: >-
        The argument CORRECTLY predicts death here (flat law's |A|=4 row), and the bridge
        measured it: W=0 on 500/500 (runs/keyed_bridge.json B4, control_W0_500of500 true).
        Passes the known-false control.
    - object: >-
        The rho=0 degenerate cells (r in {2,10}, A={0}, S in {1,2,3}), where the argument
        predicts zero nontrivial trials.
      does_the_argument_go_through: no_overproof
      reason: >-
        Bridge B5 measured 500/500 trivial swaps at (r=2, A={0}, S={1}) exactly as predicted
        (runs/keyed_bridge.json control_trivial_500of500 true). Any reported hit there would
        have been manufactured signal; none was. Passes.
  result: >-
    The argument does NOT prove too much against the available known-false objects: it correctly
    predicts death on the in-geometry dead cells (both measured), and it does not transfer to the
    known-dead Feistel substitute (premise (b) fails). One empirical guard (identity-law bridge
    on the substitute, seconds) remains unrun and is named as the cheapest forward control.

scope_attack_summary: >-
  hits=2^30 at the affine arm says: the pinned affine cipher's trial map hits at r=6 in one cell,
  one seed, one key. 'Nonlinearity-driven destruction' says: the r=5->r=6 destruction of the
  excess under AES is caused by nonlinearity. The gap between them is bridged by (i) the carried
  comparator (AES dead at r=6, one-sided pooled 1.72x bound, EV-AES-d33b1c OBS-B2-5, not
  re-measured here), (ii) a single-factor contrast in which the varied factor is the S-box
  (n=1 nonlinear S-box at r=6: the AES table; n=1 affine S-box: identity), and (iii) a
  cross-lineage instrument identification (fresh affarm046.c vs campaign build) sealed only by
  KAT pins + source-diff against the archived affine lineage. What survives the gap: 'the
  instrument's affine-limit pair-difference map is alive at r=6, and the factor that differs
  between this alive measurement and the dead-at-r=6 AES measurement is the S-box'. What does
  not survive unqualified: 'nonlinearity-driven' as a general mechanism claim, 'not carried by
  the linear skeleton' as a claim about all linear geometry, and 'the residual carrier is e' as
  an established fact.

scope_narrowed_restatement: >-
  Candidate ledger wording. Within the pinned r<=10 AES-shaped SPN probe geometry, toy tier:
  (i) the instrument's affine-limit pair-difference trial map is the identity -- established by
  a fresh-code Gate-0 anchor reproduction (ranks 32,0,0,0; D5M5=M5D5=I128 both directions;
  1000/1000 keyed trials), a 100-cell census matching the pre-registered flat table incl. all
  rho values (a CONVENTION SELF-CONSISTENCY check of the pinned affine formula with zero cipher
  compute, whose empirical weight is carried by the keyed arms, not by the census), a
  2500-trial keyed bridge over five cells incl. both known-false controls (structure-destroyed
  W=0 500/500; rho=0 degenerate 500/500 trivial), and ONE 2^30 fixture arm at (r=6, A={0},
  S={0}) at one seed and one key (hits=2^30, T=0 vs E[T]=0.25, W=3 on 100% of nontrivial
  trials, excess ratio 1.0 exact against frozen excess_E=2^30). (ii) Empirical coverage of the
  law is r in {2,5,6}; flatness at the remaining r in 1..10 rests on the r-free derivation
  conditioned on the pinned convention formula, externally anchored by KAT only at r=5 and r=10;
  r*_aff is undefined within r<=10. (iii) Against the carried comparator (AES dead at r=6,
  EV-AES-d33b1c OBS-B2-5, one-sided pooled 1.72x bound, not re-measured this batch, seed-
  sensitivity of the AES excess on record per EV-AES-5478a0 OBS-B16-3), the factor that differs
  between the alive-at-r=6 measurement and the dead-at-r=6 measurement is the S-box: nonlinearity
  -- tested at r=6 with ONE nonlinear S-box (the AES table) against ONE affine S-box (identity)
  -- is the discriminating factor, and the death round is not carried by the instrument's
  affine-limit pair-difference map. This does not rule out other linear-geometric quantities
  (e.g. the record's own one-sided statistic M_r^-1 Z_keep M_r) carrying round dependence, and
  says nothing about the residual magnitude (~15x at r=5, nine orders below the affine law).
  (iv) The deviation vector e=(q0^q1)^(p0^p1) is identically zero in the affine limit and is
  NAMED as the candidate residual carrier; whether the residual rides on e is unmeasured and
  owned by IDEA-20260901-bcb117 (H2). Nothing transfers to substitute cipher families, other
  probe geometries, full-round AES, deployed ciphers, or nonlinear S-boxes beyond the cited
  comparator; no comparison to published cryptanalysis in either direction (RQ-AES-003 R3).

boundary_statement:
  claim: the nonlinearity-driven (factor-contrast) reading, as narrowed above
  would_be_falsified_by:
    - >-
      F4-class: any future committed r=6 EXCESS under the frozen probe (nonlinear S-box, any
      seed) -- the record's own forward falsifier; kills the mismatch.
    - >-
      A committed r=6 arm with a RANDOM bijective S-box that is ALIVE (excess well above null):
      the death is then AES-table-value-specific, not nonlinearity-driven (J4 control).
    - >-
      Any committed affine-limit deviation (nontrivial trial with W != 4-|A|, or fixture-band
      miss): F2-class instrument indictment; voids the alive side of the contrast.
    - >-
      A census extension to r>=11 finding D_r M_r != I_128 or a non-flat W law under the pinned
      convention: 'alive at all r<=10' was a property of the 1..10 convention formula, not of
      the pinned cipher (J1 control).
    - >-
      The identity law holding (~100% of keyed trials) on the known-dead Feistel substitute:
      the identity law would then fail to discriminate alive from dead and the skeleton/death
      contrast would prove too much (proves-too-much guard).
    - >-
      An isotropic-large-e distribution of the r=5 residual (bcb117 H2 falsification): kills the
      carrier clause only, not the mismatch.
    - >-
      A committed cross-lineage re-measurement (02f7c4 arm B3) failing to reproduce the affine
      law: indicts the single-lineage edifice this batch rests on.

pareto_note:
