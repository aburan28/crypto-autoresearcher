power_and_scope:
  tier: toy
  scope_statement: >-
    Everything validated here is a statement about the pinned reduced-round AES-shaped SPN probe
    with SBOX = id, r <= 10, one probe family, one machine, toy tier. The fixture arm is a
    SINGLE arm at a SINGLE seed (46063001) and single exposure (2^30 trials, 8 threads); seed
    variance of the AES-side excess is a recorded phenomenon (EV-AES-5478a0 OBS-B16-3, 14 vs 19)
    and the affine arm's seed-independence is asserted by derivation and confirmed here at the
    algebraic level and at 2^16/2^18/2^22/2^30 across four seeds, but the death-round arm was
    run once. The census is flat BY CONSTRUCTION (it derives from DE = id and swap invariance,
    a theorem of any self-consistent affine convention), so the census confirms the instrument's
    convention rather than a measured property of AES; the load-bearing empirical datum is the
    single fixture arm plus the keyed bridge. The verdict's comparator (AES alive at r=5, dead
    at r=6) is inherited from the committed EV-AES-d33b1c measurement (one-sided bound 1.72x
    pooled), cited and not re-measured here. The census was computed for r=1..10 only; 'alive at
    every r <= 10' does not extend beyond 10 by measurement (the derivation is r-free,
    disclosed). The identity law holds for ANY self-consistent affine convention, so these arms
    cannot distinguish a consistent-but-unpinned port; the KAT pins and source-diff audit are
    the controls and both pass. NOTHING transfers to nonlinear S-boxes (the residual is a
    separate object owned by IDEA-20260901-bcb117), to substitute cipher families, to full-round
    or deployed AES, or to any published cryptanalysis comparison in either direction.
  shared_harness_residual_risk: >-
    Shared-harness bugs conditional on the round function (BATCH-010 red team's class) are not
    ruled out by any affine arm alone; stated, not discharged (record confounders). The
    cross-lineage re-measurement (IDEA-20260901-02f7c4 arm B3) remains the named full
    mitigation and is not discharged here.

