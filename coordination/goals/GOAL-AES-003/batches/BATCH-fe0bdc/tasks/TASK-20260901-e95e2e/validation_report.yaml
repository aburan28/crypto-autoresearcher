    block builder, an SR-direction error in my ISR builder, and a domain-offset error in my
    expected word-map builder) were caught by the same per-r guard / spec-crosscheck discipline
    the record mandates (guards returned not-I, spec-vs-pinned-expression check returned false).
    Fixed in-validator and re-run within the RUN 1 slot; rule 5 applies to the validator too --
    these were implementation failures, never findings about the producer. The final RUN-1
    output (runs/valrun1_algebra.json) is the post-fix result and is internally self-checked
    (sanity_ISR_inverts_SR, sanity_IMC_inverts_MC, mc/imc spec-vs-pinned all true).

