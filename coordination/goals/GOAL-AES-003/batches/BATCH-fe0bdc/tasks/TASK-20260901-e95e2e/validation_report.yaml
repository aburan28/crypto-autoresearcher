  discrepancies. Every load-bearing quantity was re-derived in fresh validator code or
  recounted from the raw committed receipts: Gate 0 (anchor ranks 32,0,0,0; D5*M5 = M5*D5 =
  I128; word-0 map column-equal the 32-bit identity, words 1-3 zero; exact P = 1.0), the full
  100-cell census against the frozen pre-registered table (all ranks, W laws, P laws, and all
  100 rho values including the degenerate rho=0 cells), the keyed bridge (2500/2500 plus both
  known-false controls), and the fixture arm (T=0, hits = 2^30 exactly, whist all W=3, wword
  [0,N,N,N], excess ratio 1.0 exact vs frozen excess_E = 2^30, inside the band hits >= 2^30-8).
  Under the idea record's pre-registered decision rule, all four antecedents hold, so the
  CONFIRMED-MISMATCH-ALIVE arm fires.

