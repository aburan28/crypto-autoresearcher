  attacks:
    - id: ATTACK-1
      name: "Overreach: what does 'reproduce the excess' actually establish?"
      question: >-
        Does the checkpoint outcome text or the EV record say more than two S-box
        instances plus controls can carry? Does "reproduce" support independence,
        or merely non-niqueness of the AES table values? What is a third
        interpretation?
      method: >-
        Compare the three readings the measured facts (R3-A1/A2/A3 = 59/58/51 at
        N=2^32, null 4.0, per f5e58b RESULTS.json) can bear against the wording in
        checkpoint lines 901-913, DEC decision_note lines 15-23, and EV O-5.
        Magnitude distinguishability checked by my own two-sample Poisson
        z-approximation: z = (59-51)/sqrt(59+51) = 0.763.
      findings:
        - >-
          Reading A (class-level independence): "the excess is independent of the
          S-box within {AES, uniform random bijection}" as a statement about the
          class. NOT BOUND by two draws (see ATTACK-4 for the quantitative gap).
        - >-
          Reading B (non-necessity plus instance reproduction): the AES table's
          specific values are not necessary for the excess; two sampled uniform
          random bijections also produce counts far above null (58, 51 vs
          threshold 13; per-arm type-I error 2.74e-4 under Poisson(4), verified by
          my own computation). BOUND.
        - >-
          Reading C (third interpretation, geometry-driven): the hit rate is set by
          the SPN round structure plus the swap-diagonal probe geometry, with the
          substitution table contributing at most noise; the spread 59/58/51 is
          Poisson fluctuation around a geometry-determined rate (my z = 0.763 for
          51 vs 59 is consistent with this). CONSISTENT WITH THE DATA but not
          established by BATCH-713991 alone; it became the recorded reading only
          after BATCH-b41ba9's affine arm (DEC D-6, EV O-8), which is a later
          amendment, not part of this batch's evidence.
        - >-
          The checkpoint's "is NOT attributable to the AES table's specific values"
          is bound ONLY in the weak reading (non-necessity). The strong reading
          (the AES values contribute nothing to the magnitude) is not resolvable:
          the design's own recorded limit (DEC D-2: cannot resolve a 2-3x
          attenuation) plus z = 0.763 means 51/58 vs 59 cannot separate equal
          magnitude from moderate attenuation.
      outcome: PARTIAL_OVERREACH_IN_WORDING
      outcome_detail: >-
        No overreach in the composed ruling (D-2 states the resolution limit in the
        same breath), but the verb "reproduce" and the phrase "NOT attributable"
        each carry an unbound strong reading. The checkpoint sentence is safe only
        when read together with the boundary sentence eight lines below it; quoted
        alone it overstates.

    - id: ATTACK-2
      name: "Control-band logic: does [0,12] do real falsification work?"
      question: >-
        Is the pre-registered [0,12] band doing real falsification work, or is it
        wide enough to be unfalsifiable at these counts? What does the r=10 null of
        3 imply about the band's lower end?
      method: >-
        My own Poisson computations. Pre-registered rule (f5e58b PREREGISTRATION
        R3-P4): a control count > 12 is a V-flag; pass band written [0,12].
      findings:
        - >-
          Upper end does real work: P(X >= 13 | Poisson(4)) = 2.737e-4 (my
          computation; the preregistration's ~2.7e-4 is verified). This is a
          genuine one-sided type-I control against pipeline contamination leaking
          signal into the controls.
        - >-
          Lower end is vacuous by construction: counts are non-negative, so no
          observation can fall below 0. The band "[0,12]" reads as two-sided but
          falsifies only upward. An instrument that UNDERcounts in the control arms
          (e.g., an over-aggressive trivial-swap guard) would pass silently.
          Mitigation that exists in the design: the AES replication arm R3-A1 had
          its own pre-registered band 45-75 (R3-P2), which is the de facto
          low-side guard for the pipeline; it passed (59).
        - >-
          Mid-band leakage is tolerated: a control arm whose TRUE rate were 3x null
          (lambda = 12) would still pass with probability 0.576 (my computation);
          lambda = 15.2 passes with probability 0.251. So the controls cannot
          exclude a residual ~3x geometry leak in the r=10 or struct-destroyed
          arms. In practice the observed controls (3, 4, 2, 4) sit at the null
          expectation 4.0, so no leakage is evidenced; the criticism is about the
          band's resolution, not the observed data.
        - >-
          The r=10 null of 3 implies NOTHING about the band's lower end:
          P(X <= 3 | Poisson(4)) = 0.4335 (my computation), an unremarkable
          fluctuation, and there is no lower end to probe.
      outcome: BAND_HOLDS_ONE_SIDED_WORK_WITH_NAMED_COARSENESS
      outcome_detail: >-
        The band is not unfalsifiable for its intended purpose (V-flag on
        contamination), but it is one-sided in effect and coarse in the middle: it
        conflates "consistent with null" with "anything up to ~3x null". The
        [0,12] notation overstates the design's two-sidedness.

    - id: ATTACK-3
      name: "Scope honesty: liftable sentences about real AES"
      question: >-
        Toy tier (64-bit halves, reduced rounds r=5, structured probe geometry) --
        is any sentence in the bound records one a reader could lift into a
        statement about real AES?
      method: >-
        Line-by-line read of the checkpoint outcome text, DEC decision_note, and EV
        observations for local toy-tier qualifiers; check of every disclaimer.
      findings:
        - >-
          Disclaimers are present and explicit in the bound records: EV sota_delta
          note ("Nothing AES-specific claimed at any scale; no claim about
          full-round or deployed AES"), EV O-8 ("Still toy-tier; no claim about
          AES-128 or deployed AES at any scale"), DEC decision_note line 19 ("it is
          supported at toy tier"), both preregistrations ("TOY TIER"), f5e58b
          RESULTS.json claim_tier "toy" with basis.
        - >-
          Liftable sentence 1: checkpoint lines 901-904, "the round-5 yoyo excess
          (BATCH-002 A1, 15.63x) is NOT attributable to the AES table's specific
          values -- two independent uniform random bijective S-boxes reproduce it".
          No toy qualifier in the sentence; the nearest qualifier ("supported at
          toy tier", line 911) is eight lines later. Quoted alone, it reads as a
          statement about the AES table in general.
        - >-
          Liftable sentence 2: DEC decision_note lines 15-17, the same sentence
          ("The measured facts stand: the round-5 yoyo excess is NOT attributable
          to the AES table's specific values"). The qualifier follows two lines
          later; the first sentence is independently quotable.
        - >-
          Liftable framing 3: "The campaign's last untested specificity is now
          measured" (checkpoint line 901; also snapshot-receipt.json purpose, and
          f5e58b PREREGISTRATION "the ONLY campaign result whose S-box dependence
          has never been measured"). This invites the lift "nothing this campaign
          has produced is about AES". The original fa4906 completion gate demanded
          that consequence be stated plainly; the checkpoint never states it. This
          report states it at toy tier: the r=5 yoyo excess, as measured in this
          campaign's software AES-shaped SPN, is a fact about SPN round structure
          interacting with the swap-diagonal probe geometry, not about the AES
          S-box values; NOTHING in BATCH-713991 supports a statement about deployed
          or full-round AES in either direction.
      outcome: PASS_WITH_TWO_LIFTABLE_SENTENCES_NAMED
      outcome_detail: >-
        The records are disciplined as a whole; the risk is in decontextualized
        quotation of two sentences and one framing, all named above with lines.

    - id: ATTACK-4
      name: "Population statistics: a population of TWO"
      question: >-
        "Two independent uniform random bijections" is a population of two. What
        does that support about the class of uniform random bijections, and what
        does it not? Does BATCH-713991 acknowledge RC-C's finding (EV-AES-d81acf)
        that few points do not mean independent samples?
      method: >-
        Exact binomial bound for 2/2 successes; grep of all BATCH-713991 records
        plus EV-AES-048545 and DEC-20260804-73977c for RC-C / d81acf / sample-size
        caveats.
      findings:
        - >-
          The two draws are generation-independent (distinct seeds 424242201/
          424242202, Fisher-Yates, byte-identical-on-recomputation tables,
          bijectivity verified; f5e58b PREREGISTRATION pins and RESULTS.json). This
          is STRONGER provenance than RC-C's three same-table-different-key points,
          which were not independent draws at all.
        - >-
          But inferentially, 2/2 supports only an instance statement. Exact
          one-sided 95% lower bound on the population fraction p of uniform random
          bijections that would reproduce the excess: p_L = 0.05^(1/2) = 0.2236 (my
          computation). The data is COMPATIBLE with a world in which only ~22% of
          uniform random bijections reproduce the excess and 78% do not.
        - >-
          Therefore "independence within {AES, uniform random bijection}" is class
          grammar supported by instance evidence. What is bound: non-necessity of
          the AES values, plus reproduction in the two sampled instances. What is
          NOT bound: that a typical/most/arbitrary uniform random bijection
          reproduces the excess, or any estimate of the class fraction.
        - >-
          Acknowledgment check: grep for "RC-C", "d81acf", "population", "sample
          size", "independent draws" across BATCH-713991's tasks, EV-AES-048545,
          and DEC-20260804-73977c returns ZERO matches. The lesson BATCH-013 paid
          for (EV-AES-d81acf: three of five points were the same S-box under
          different keys, not independent draws) is not cited, hedged, or
          acknowledged anywhere in this batch's records, even though this batch
          makes exactly the few-points-to-class move that RC-C was dispatched to
          police.
      outcome: UNDER_BOUND_CLASS_WORDING_WITH_UNACKNOWLEDGED_PRECEDENT
      outcome_detail: >-
        The boundary ruling remains defensible only at instance-level resolution.
        The records' silence on RC-C is the notable omission: the program's own
        prior finding about small populations is unmentioned in the batch that
        re-uses the pattern.

    - id: ATTACK-5
      name: "Provenance integrity: the review chain that exists only as prose"
      question: >-
        The original red-team and validator artifacts never landed on disk. What
        does that imply about how much weight the 2026-08-06 checkpoint outcome
        text deserves as written, independent of this re-run's findings?
      method: >-
        Read-only git verification (git log --all --diff-filter=A on both declared
        artifact paths: both EMPTY; git log --all --grep fa4906: only the
        BATCH-903b65 open commit), then line-by-line comparison of every citation
        of the two missing reports against artifacts that exist.
      findings:
        - >-
          Card TASK-20260804-fa4906: state "completed", artifact_paths
          [.../TASK-20260804-fa4906/red_team_report.yaml]; file exists in no
          branch. Card TASK-20260804-91d27e: state "completed", artifact_paths
          [.../TASK-20260804-91d27e/validation_report.yaml]; file exists in no
          branch. Both verified by git log --all in this session.
        - >-
          Despite that, the following committed records cite the missing artifacts
          as performed reviews: ledger-receipt.json review_chain lines 14-25
          (verdict summaries for BOTH missing tasks); DEC decision_note lines
          20-21 ("as the Red Team correctly showed"); DEC D-2 lines 56-58 ("the
          Red Team's power analysis (resolves only relative attenuation >= 0.53 at
          80% power)"); EV O-1 lines 32-33 ("Independently re-verified by the
          Validator, including a from-scratch AES implementation"); EV O-3 lines
          46-47 ("All three counts independently recomputed by the Validator from
          raw receipts; no disagreement"); EV O-5 lines 60-62 (same power-analysis
          citation); checkpoint lines 906-908 (validator sentence).
        - >-
          EV O-8 (BATCH-b41ba9 amendment) cites "(Red Team R3 report + Validator)"
          for the strongest scope conclusion in the record. BATCH-b41ba9's queue
          has no red-team card and no red-team artifact exists anywhere under its
          directories (grep red_team: zero matches); the only "R3" red-team report
          in this lineage is the never-landed fa4906 artifact. Whichever report
          O-8 intends, no such artifact exists on disk as of this audit.
        - >-
          Weight assessment of the checkpoint outcome text AS WRITTEN on
          2026-08-06: its MEASUREMENT sentences (counts 58/51 vs 59, controls
          3/4/2/4 in band, RANK 2 {1:4}) are bound by producer artifacts that do
          exist (f5e58b RESULTS.json, runs/, pins) and deserve their ordinary
          weight. Its REVIEW sentences (validator zero disagreement; the
          Red-Team-backed claim boundary resolution) were bound by NOTHING on disk
          at the time of writing and deserve no independent evidential weight
          until the re-runs land. The quantitative figure 0.53-at-80%-power that
          the boundary ruling leans on had no auditable derivation anywhere in the
          record; my own rough re-derivation (two-sample normal-approx Poisson,
          AES arm lambda=59, 80% power, alpha=0.05) gives minimum resolvable
          relative attenuation 0.41-0.49 depending on one/two-sided and
          excess-over-null vs total-mean convention -- same order as 0.53 and in
          the conservative direction, but this confirms plausibility only; it
          cannot confirm the cited derivation, which no artifact contains.
        - >-
          The checkpoint's own merge_provenance_note already disclosed
          ledger_archive.commit null (the checkpoint was not durable by the goal's
          own gate), but it did NOT disclose that the review artifacts it cites
          were missing; the integrity items it lists (RANK 1 stamps, budget
          amendment) omit the largest one.
      outcome: SUSTAINED_MOST_DAMAGING
      outcome_detail: >-
        The batch that was scoped to repair BATCH-003's review-integrity defects
        (reviewer verdicts rendered without reading reports) reproduced the same
        defect class one level worse: review verdicts recorded without reports
        ever being written to disk. This is the single most hurting finding for
        BATCH-713991 as recorded.

    - id: ATTACK-6
      name: "Decay-control design (original fa4906 completion gate item 1)"
      question: >-
        Does the nibble-scale sweep in TASK-20260804-d7d0ec actually discriminate
        the fiber-degeneracy mechanism, or could it miss it? What would a null
        result there establish and not establish?
      method: >-
        Read d7d0ec PREREGISTRATION.md predictions/falsification criteria against
        RESULTS.json verdict; my own binomial checks on the SURVIVES threshold.
      findings:
        - >-
          The pre-registered falsification criteria (M1 r6 n_0mod8 >= 15/40
          and/or occ16 >= 39/40) are real discriminators: the forced signature is
          near-deterministic under the matrix-degeneracy hypothesis, and the
          instrument's mechanism model is validated in the regime where forcing IS
          expected (r=4 exact prediction hit 40/40; r=5 40/40).
        - >-
          The SURVIVES verdict (6/40 fixed, 2/40 random, occ16 0/40) sits one
          trial below the cutoff 7/40. My computation: P(Binom(40,1/8) <= 7) =
          0.881, so the cutoff is generous under the uniform null; but
          P(Binom(40,0.25) <= 7) = 0.182, i.e., a true forcing rate twice the
          uniform prediction would still pass ~18% of the time. The design could
          miss weak or partial forcing; that is inherent to 40 trials and was
          priced in by the pre-registered thresholds.
        - >-
          A null result here (SURVIVES) establishes only: no strong fiber-degeneracy
          forcing at nibble width, r=6, j0=0, this matrix; it does NOT establish
          the byte-scale r=6 case, and the record says exactly that
          (transfer_statement: "analogue result, not a byte-scale result").
        - >-
          The checkpoint's treatment of RANK 1 ("data validated but completion
          UNSUPPORTED") is accurate and matches DEC D-3; the scientific verdict
          SURVIVES is not overstated in the checkpoint (which does not assert it).
      outcome: NO_OVERREACH_FOUND_FRAGILITY_NOTED
      outcome_detail: >-
        Design discriminates the mechanism it claims to discriminate; fragility is
        threshold-adjacency (6 vs cutoff 7) and insensitivity to weak forcing,
        both within the pre-registered rule's stated resolution.

    - id: ATTACK-7
      name: "BATCH-003 repair audit (original fa4906 completion gate item 3)"
      question: >-
        Did BATCH-713991 repair the BATCH-003 defects it was scoped to repair, or
        merely add arms?
      method: >-
        Compare BATCH-003's recorded defects (goal checkpoint lines 1105-1126)
        against what RANK 1/2 actually delivered.
      findings:
        - >-
          Defect "Rank 4 of that batch lacked a positive control": REPAIRED
          genuinely. RANK 2 supplied the missing object itself -- the true-hint
          arm returning {1:4} vs BATCH-003's {0:4}, byte-identical instrument
          copy, slotmask the only changed parameter (f5e58b RESULTS.json
          comparison_with_BATCH003_false_hint).
        - >-
          The three-batch-old not_executed zero-entry arm (BATCH-001 validator's
          singular-substitute failure): REPAIRED genuinely. RANK 1 ran the arm
          with both matrices verified non-singular and inverse-checked; the
          singular substitute was explicitly re-checked and rejected (d7d0ec
          PREREGISTRATION section 2).
        - >-
          BATCH-003's PROCESS defects (validator marked FAILED without reading the
          57KB report; check_merge_hygiene PASS reported from unread output, per
          DEC-20260802-f04fb0 as summarized in the BATCH-003 checkpoint entry):
          NOT repaired, and BATCH-713991 then reproduced the same defect class in
          aggravated form (ATTACK-5: review verdicts recorded with no report on
          disk at all).
      outcome: REPAIRS_GENUINE_PROCESS_DEFECT_RECURRED_WORSE

  single_most_damaging_finding: >-
    (Original fa4906 completion gate item 5: name the one finding that would hurt
    most.) The checkpoint outcome text and the decision record present a fully
    reviewed batch -- "the Validator independently recomputing every count from
    raw receipts with zero disagreement", "as the Red Team correctly showed", a
    claim boundary "held at the resolution the pre-registered rule has" -- while
