verdicts:
  TASK-20260901-3dffdc:
    idea_record: IDEA-20260901-ec54fe
    producer_claimed: >-
      F1 FIRES - invalid_measurement / derivation defect: the record's census object at the anchor
      gives ranks 32,32,32,32 and P(W>=1)=2^-32, not the required 32,0,0,0 / P=1.0; the archived
      anchor object reproduces exactly; defect localized to the record's P1 derivation; halted per
      design with 0 fixture-arm trials.
    validator_verdict: passed
    validator_verdict_meaning: >-
      Every load-bearing number in the producer package was independently re-derived in fresh code
      and CONFIRMED; the F1 halt was procedurally correct; the verdict rendered (F1 fires,
      invalid_measurement / derivation defect, no mechanism conclusion) is exactly the branch the
      record's own pre-registered decision rule prescribes for these re-derived facts. 'Passed'
      validates the producer package, not the census object (which is VOID under F1).
    decision_rule_applied: >-
      IDEA-20260901-ec54fe F1 (BLOCKING) and preregistered_decision_rule: 'ANY measured cell
      disagreeing with its exact prediction -> F1/F2 fires, all readings VOID as
      instrument/derivation defect ... the run returns as invalid_measurement, never as evidence
      against the skeleton.'
  TASK-20260901-e2e66e:
    idea_record: IDEA-20260901-02f7c4
    producer_claimed: >-
      C4 PASS on both arms - signed W>=1 delta (OFF-ON) equals the trivial-trial count exactly
      (0 = 0 on both arms at 2^30), full trial-by-trial hit-set identity, ENABLED builds reproduce
      committed receipts L1-AES-R5-P30 and M1-FF-P30 field-exact, build-pair diff exactly one
      #define line; power disclosure: T=0 realized so the nonzero-delta path is vacuous.
    validator_verdict: passed
    validator_verdict_meaning: >-
      All signed deltas, trivial counts, hit-set identities, accounting identities, and both
      ENABLED-build reproduction gates were re-derived from the raw receipts and CONFIRMED;
      the C4 PASS verdict is exactly the branch the record's C4/PR-4 rule prescribes.
      The producer's pre-registered power limitation (T=0 at 2^30, nonzero-delta path not
      exercised by data) is CONFIRMED and carried into this report, not smoothed over.
    decision_rule_applied: >-
      IDEA-20260901-02f7c4 claim C4 / PR-4: 'C4 PASS iff the exclusion-toggle delta equals the
      trivial-trial count on both arms, within exact arithmetic ... checkable trial-by-trial.
      Any other delta is F3.'

rederived_values:
  derivation_codebase: >-
    Fresh validator code under tasks/TASK-20260901-d004bb/work/ (val_census.py, val_empirical.py,
    val_b4.py); NO producer code imported or reused. GF(2) matrices built from the pinned
    byte-level formulas of BATCH-b41ba9 probe_sbox.c (sub_shift/inv_sub_shift/mix_columns/
    inv_mix_columns/build_geom) and geom.json, cross-checked against independently constructed
    FIPS-197 standard matrices (all cross-checks pass); byte-level cipher self-checked against its
    own GF(2) matrices plus exact roundtrips at r in {2,5,6,10}. Two bugs found and fixed were in
    the VALIDATOR's own code (a transpose bug in matrix composition, a key-schedule indexing bug);
    after fixes all internal consistency checks pass, and the buggy intermediate outputs were
    discarded, never reported.
  census_mathematics:
    method: >-
      Dense GF(2) 128x128 matrices (rows as integers), M_r = SR.(MC.SR)^{r-1}, D_r =
      (ISR.IMC)^{r-1}.ISR, Gauss-Jordan inverse, word-map restriction to PW diagonals,
      GF(2) rank by pivot elimination, exact W-bin sizes by Mobius inversion over joint kernels.
      Sources of definitions: IDEA-20260901-ec54fe object/claim fields, BATCH-b41ba9
      probe_sbox.c and geom.json (PW[j][row]=4*((j+row)%4)+row, CW[j][row]=4*((j-row)%4)+row),
      producer INDEPENDENCE_AUDIT.md consulted for which objects to recompute (per task brief),
      never for how to compute them.
    consistency_checks_passed:
      - MC harness formula equals FIPS-197 circulant matrix (2,3,1,1)
      - IMC harness formula equals FIPS-197 circulant matrix (14,11,13,9)
      - SR/ISR and MC/IMC are mutual inverses; mat_mul composition self-test vs byte-level apply
      - D_r*M_r = M_r*D_r = I_128 for every r in 1..10 (producer claimed r=5 only; validator verified all ten)
      - swap of ciphertext coordinates between c0 and c1 leaves c0^c1 unchanged (computed on 1000 random pairs)
      - Mobius W-bin sizes non-negative and sum to 2^{32|A|} in every cell
    anchor_cell_r5_A0_S0:
      record_object_T_zero_ranks: [32, 32, 32, 32]
      record_object_T_zero_P_Wge1_all_d: {num: 1, den: 4294967296}
      record_object_exact_W_bins: {W0: 4294967295, W1: 0, W2: 0, W3: 0, W4: 1}
      keep_mask_object_T_keep_ranks: [32, 32, 32, 32]
      archived_object_Pj_DM_P0T_ranks: [32, 0, 0, 0]
      D5_M5_is_I128_both_directions: true
      matches_producer_claim: true
      matches_F1_requirement: false
      F1_requirement: {ranks: [32, 0, 0, 0], P_Wge1: 1.0}
      reading: >-
        CONFIRMS producer claims (a) and (b): the archived pair-difference object reproduces
        32,0,0,0 with D5*M5=I128; the record's census object T = M5^-1 Z_{CW[0]} M5 gives
        32,32,32,32 with P(W>=1)=2^-32 (only d=0 yields W=4), contradicting the F1-required
        32,0,0,0 / P=1.0. CONFIRMS unexpected observation (d): the keep-mask operator also gives
        32,32,32,32, so the mask sign is not the only issue.
    per_round_cell_A0_S0_record_object:
      note: >-
        Validator-chosen subset satisfying 'at least one cell per round count plus the anchor'.
        All readings below are VOID under F1 and reported only as re-derived context.
      r1:  {ranks: [24, 0, 0, 0],  P_Wge1: '4294967296/4294967296'}
      r2:  {ranks: [0, 0, 0, 0],   P_Wge1: '4294967296/4294967296'}
      r3:  {ranks: [24, 0, 0, 0],  P_Wge1: '4294967296/4294967296'}
      r4:  {ranks: [32, 32, 32, 32], P_Wge1: '1/4294967296'}
      r5:  {ranks: [32, 32, 32, 32], P_Wge1: '1/4294967296'}
      r6:  {ranks: [32, 32, 32, 32], P_Wge1: '1/4294967296'}
      r7:  {ranks: [32, 32, 32, 32], P_Wge1: '1/4294967296'}
      r8:  {ranks: [32, 32, 32, 32], P_Wge1: '1/4294967296'}
      r9:  {ranks: [24, 0, 0, 0],  P_Wge1: '4294967296/4294967296'}
      r10: {ranks: [0, 0, 0, 0],   P_Wge1: '4294967296/4294967296'}
    extra_cells_r5_record_object:
      A0_S1:    {ranks: [32, 32, 32, 32], P_Wge1: '1/4294967296'}
      A01_S0:   {ranks: [32, 32, 32, 32], P_Wge1: '4294967296/18446744073709551616'}
      A0123_S0: {ranks: [32, 32, 32, 32], P_Wge1: '79228162514264337593543950336/340282366920938463463374607431768211456'}
  empirical_identity_law:
    method: >-
      Fresh byte-level implementation of the pinned trial semantics (p0 draw, active-word
      re-randomisation with zero-word-diff rejection, enc/enc, CW-word swap with trivial-swap
      detection, dec/dec, W over PW words) with SBOX=id and the FIPS-197 key schedule under
      identity SubWord; validator seed 901125; random key per cell; 1000 keyed trials per cell.
    cells_6_x_1000_trials:
      - {r: 5, A: [0],       S: [0], qdiff_eq_pdiff: '1000/1000', W_eq_4_minus_absA: '1000/1000', trivial_swaps: 0, q0p0_eq_Tkeep_d: '1000/1000', q0p0_eq_Tzero_d: '0/1000'}
      - {r: 5, A: [0],       S: [1], qdiff_eq_pdiff: '1000/1000', W_eq_4_minus_absA: '1000/1000', trivial_swaps: 0, q0p0_eq_Tkeep_d: '1000/1000', q0p0_eq_Tzero_d: '0/1000'}
      - {r: 6, A: [0],       S: [0], qdiff_eq_pdiff: '1000/1000', W_eq_4_minus_absA: '1000/1000', trivial_swaps: 0, q0p0_eq_Tkeep_d: '1000/1000', q0p0_eq_Tzero_d: '0/1000'}
      - {r: 5, A: [0, 1],    S: [0], qdiff_eq_pdiff: '1000/1000', W_eq_4_minus_absA: '1000/1000', trivial_swaps: 0, q0p0_eq_Tkeep_d: '1000/1000', q0p0_eq_Tzero_d: '0/1000'}
      - {r: 2, A: [0],       S: [0], qdiff_eq_pdiff: '1000/1000', W_eq_4_minus_absA: '1000/1000', trivial_swaps: 0, q0p0_eq_Tkeep_d: '1000/1000', q0p0_eq_Tzero_d: '0/1000'}
      - {r: 5, A: [0, 1, 2, 3], S: [0], qdiff_eq_pdiff: '1000/1000', W_eq_4_minus_absA: '1000/1000', trivial_swaps: 0, q0p0_eq_Tkeep_d: '1000/1000', q0p0_eq_Tzero_d: '0/1000'}
    matches_producer_claim: true
    reading: >-
      CONFIRMS producer localization claim (c): the harness pair-difference map in the affine
      limit is the identity (q0^q1 = p0^p1 on 6000/6000 trials; W = 4-|A| deterministic on all
      nontrivial trials), the one-sided yoyo difference equals the keep-mask perturbation
      q0^p0 = M_r^-1 Z_keep M_r d on 6000/6000, and the record's zero-mask operator matches the
      one-sided difference on 0/6000 trials. Scope note: 'matches no instrument quantity' was
      verified for the two instrument quantities checked (pair difference and one-sided
      perturbation), matching the producer's own stated scope.
  b4_signed_deltas:
    method: >-
      Trial-by-trial recount from the four raw 2^30 receipts plus the two committed BATCH-015
      receipts (val_b4.py); hit sets and trivial sets compared as (thread,t) pair sets.
    AES_R5_arm:
      exposure_trials: 1073741824
      W_ge1_ON: 14
      W_ge1_OFF: 14
      signed_delta_OFF_minus_ON: 0
      trivial_count_T: 0
      delta_equals_T_exactly: true
      hits_OFF_minus_hits_ON: []
      trivial_set: []
      hit_set_identity_confirmed: true
      hit_indices: >-
        the 14 committed comparator indices [0,52735906],[0,178745786],[0,266298850],[0,273520598],
        [0,339544647],[0,523527834],[1,67724771],[1,90384281],[1,147208629],[1,286947500],
        [1,336820358],[1,440575768],[1,451495737],[1,490333025] - identical across ON/OFF builds,
        equal to the pre-registered list, and equal to the committed L1-AES-R5-P30 receipt
      whist_ON: [1073741810, 14, 0, 0, 0]
      whist_OFF: [1073741810, 14, 0, 0, 0]
      whist_accounting: 'sum(whist OFF) = 2^30; sum(whist ON) = 2^30 - T; whist[3] delta = T; other bins equal'
      W_ge1_by_word_delta: [0, 0, 0, 0]
      expected_by_word_delta_amask1: [0, 0, 0, 0]
    FF_NULL_arm:
      exposure_trials: 1073741824
      W_ge1_ON: 1
      W_ge1_OFF: 1
      signed_delta_OFF_minus_ON: 0
      trivial_count_T: 0
      delta_equals_T_exactly: true
      hits_OFF_minus_hits_ON: []
      trivial_set: []
      hit_set_identity_confirmed: true
      hit_indices: '[1,270788492] - identical across ON/OFF builds and equal to the committed M1-FF-P30 receipt'
      whist_ON: [1073741823, 1, 0, 0, 0]
      whist_OFF: [1073741823, 1, 0, 0, 0]
      whist_accounting: 'sum(whist OFF) = 2^30; sum(whist ON) = 2^30 - T; whist[3] delta = T; other bins equal'
      W_ge1_by_word_delta: [0, 0, 0, 0]
      expected_by_word_delta_amask1: [0, 0, 0, 0]
    stream_identity: 'plaintext digests equal ON/OFF on both arms; key digests equal ON/OFF on FF; thread seeds equal; smoke arms at 2^20 also stream-identical with delta 0'
    matches_producer_claim: true
  enabled_build_reproduction:
    B4_AES_ON_vs_L1_AES_R5_P30: >-
      field-exact CONFIRMED: thread_seeds, plaintext_stream_digest, trivial_swaps_excluded (0),
      nontrivial_trials (2^30), W_ge1 (14), whist, W_ge1_by_word [4,4,2,4], all 14 hit (thread,t)
      pairs identical to the committed immutable receipt
    B4_FF_ON_vs_M1_FF_P30: >-
