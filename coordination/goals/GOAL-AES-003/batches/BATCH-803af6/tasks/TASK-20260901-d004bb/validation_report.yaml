outcome_ruling:
  per_producer:
    TASK-20260901-3dffdc: >-
      F1 FIRES under IDEA-20260901-ec54fe's own decision rule, exactly as the producer ruled:
      invalid_measurement / derivation defect in the record's census object (ranks 32,32,32,32,
      P=2^-32 at the anchor, vs required 32,0,0,0 / P=1.0); the archived anchor object and the
      instrument's affine-limit identity law reproduce under fresh code; all census readings under
      the record's object are VOID; no mechanism conclusion recorded.
    TASK-20260901-e2e66e: >-
      C4 PASS under IDEA-20260901-02f7c4's own decision rule, exactly as the producer ruled:
      signed delta equals trivial count exactly on both arms (0 = 0), trial-by-trial set identity
      holds, ENABLED builds reproduce the committed immutable receipts field-exact.
  batch_level: >-
    Both producer packages survive independent validation with zero discrepancies. Batch outcome as
    reported stands: (1) ec54fe Stage 0 returns invalid_measurement / derivation defect with F1
    fired and a repair needed before any census reading is meaningful (the producer's forward
    guidance names the two repair routes but is guidance only, unvalidated here); (2) 02f7c4 B4
    returns C4 PASS with a confirmed pre-registered power limitation (T=0 realized at 2^30 on both
    arms, expected 0.25/arm, so the exclusion's nonzero-delta path was not exercised by data at
    this exposure - the audit is exact but its discrimination on that path is vacuous at 2^30).
    B4's pass is a defence-dossier item scoped to this batch's readings per the record's gate, not
    a general pipeline certification, and no mechanism reading follows from either package.

power_and_scope_statement: >-
  Toy tier throughout. The F1 outcome is an instrument/record verdict - a derivation defect in
  IDEA-20260901-ec54fe's census object - and per core rule 5 and the record's F1 it is NOT
  evidence against the skeleton, against the affine anchor, or against any mathematical
  hypothesis; the archived anchor reproduction (32,0,0,0, D5*M5=I128, identity law W=4-|A|) is
  confirmed intact. The B4 outcome audits the trivial-trial exclusion arithmetic for the realized
  2^30 streams of one AES r=5 seat and one fresh-key SipRound-Feistel null object on one machine;
  with zero trivial trials realized it does not exercise the exclusion's non-trivial code path on
  live data, and it says nothing about full-round or deployed AES, other probe families, or any
  mechanism question. This report assigns no hypothesis status, no evidence strength, and no
  promotion (prohibited for the validator role).

independence_attestation:
  independent_session: true
  role: validator
  method: >-
    All re-derived numbers come from validator-written code executed in this session
    (work/val_census.py, work/val_empirical.py, work/val_b4.py; outputs work/census_rederive.json,
    work/empirical_rederive.json, work/b4_rederive.json). Definitions were taken from the idea
    records, the pinned BATCH-b41ba9 artifacts (probe_sbox.c, geom.json, algebra_rank.json,
    results.json), and the FIPS-197 conventions - NOT from the producers' implementations, which
    were read only to identify the claimed quantities (as the task brief directs). The two
    construction paths in the validator code (harness byte formulas vs independently built
    FIPS-197 standard matrices) agree on every layer. Producer run artifacts were consumed
    read-only as immutable receipts.
  blind_rederivation_note: >-
    The census ranks were re-derived from the matrix definitions alone; the validator's first
    (buggy) pass produced values matching NEITHER producer nor archived record, demonstrating the
    re-derivation was not copied; after fixing two validator-side bugs all internal cross-checks
    pass and the values land exactly on the producer's and the archived record's.

