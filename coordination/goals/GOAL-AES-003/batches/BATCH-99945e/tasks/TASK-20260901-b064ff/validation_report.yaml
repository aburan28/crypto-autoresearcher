j4_scope_statement: >-
  The J4 control as executed tested ONE additional nonlinear S-box at r=6: the
  nibble-wise lift SBOX[x]=pi[x>>4]<<4|pi[x&0x0f] of a uniform random
  permutation of 16 symbols (drawn at the pinned seed 46064002). This is a
  strict subclass of the 256-byte bijections; the red-team control text had
  referenced the O-3 recipe (uniform permutation over 256 bytes), while the
  task card's frozen contract wording ('random bijection on 16 symbols') is
  authoritative and is what was implemented. The deviation was PREREGISTERED
  and disclosed before any run (PREREGISTRATION.md section 1; mtime-gated),
  not post-hoc. Consequence for generality: the sealed DEAD reading
  generalizes the r=6 single-factor contrast from {AES S-box} toward
  {nonlinearity} ONLY within the nibble-wise-bijection nonlinear subclass
  (n=1 additional nonlinear S-box at r=6). It says nothing about uniform
  permutations over 256 bytes or other nonlinear bijection classes at r=6;
  the coordinator/reviewer may re-scope the sealed reading accordingly or
  order a 256-byte uniform-bijection arm. The reading's validity WITHIN the
  tested subclass is not weakened by this scope statement: the table was
  frozen pre-data, independently redrawn byte-identically by this validator,
  and the arm result (2 hits at 2^30) sits deep inside the preregistered DEAD
  band.

power_and_scope_statement: >-
  TOY TIER throughout. Evidence power of this battery: one 2^30
  random-bijection arm and one 2^30 affine rerun (single seeds/keys each),
  500-trial keyed bridge cells, a zero-cipher-compute census extension
  (algebraic, convention-conditioned), one 500-trial r=16 keyed cell, and a
  512-trial GUARD stream with a 500-trial read. The comparator (AES dead at
