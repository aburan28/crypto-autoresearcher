        the producer stated.
    derivation_note: >-
      During development this validator's first census implementation contained
      three bugs (ShiftRows direction, M_r composition order, PW/CW bit-set
      mapping); all were validator-owned, found by the guard/KAT checks failing
      on fresh code, fixed, and re-run. The producer's artifacts were never
      consulted while debugging (no producer code reuse).
