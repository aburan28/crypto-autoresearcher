    run: RUN V2
    derivation: >-
      From-scratch FIPS-197 AES (S-box via GF(2^8) inversion + affine transform,
      key schedule, enc/dec) written this session. FIPS-197 Appendix C.1 KAT
      (key 000102...0f / pt 00112233...; spec constants, provenance recalled,
      verified computationally): ciphertext 69c4e0d86a7b0430d8cdb78070b4c55a
      REPRODUCED. BATCH-003 anchors recomputed fresh with the receipt's
      key/plaintext (2b7e1516... / 00112233...): r=5 ciphertext
      4167e8f8367c38cdb7bde2ade620a7a8 and r=10 ciphertext
