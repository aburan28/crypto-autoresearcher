      FRESH sparse GF(2) code written this session from the pinned definitions
      in IDEA-20260901-04606c (M_r = SR.(MC.SR)^{r-1}, D_r =
      (ISR.IMC)^{r-1}.ISR, object A_{r,S,j} = P_j (D_r M_r) Pi_A, rho =
      rank(d|PW[A] -> (M_r d)|CW[S]); FIPS-197 SR/MC built from scratch; PW/CW
      word geometry derived from the pinned column-major layout and checked
      against the census convention block). Validator-chosen subset = ALL r in
      1..16 (requirement was at least two r incl. r=16), all ten frozen cells.
    values:
      guards_DrMr_MrDr_I128: all 16 r-values True (fresh)
      word_map_ranks: flat 32 x [j in A] on all 160 instances (fresh)
      rho_r1_r10: equal to the PR-1 preregistered table of IDEA-20260901-04606c verbatim (0 mismatches, fresh)
      rho_r11_r16_fresh:
        C1: [8, 32, 32, 32, 32, 32]
        C2: [8, 32, 32, 32, 32, 32]
        C3: [8, 32, 32, 32, 32, 32]
        C4: [8, 32, 32, 32, 32, 32]
        C5: [8, 32, 32, 32, 32, 32]
        C6: [8, 32, 32, 32, 32, 32]
