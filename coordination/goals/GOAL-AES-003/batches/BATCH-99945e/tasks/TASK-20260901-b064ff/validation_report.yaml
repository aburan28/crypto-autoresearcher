    run: RUN V3 (runs/v3_j4_table.py + v3_j4_table.json)
    derivation: >-
      Campaign splitmix64 convention PINNED INDEPENDENTLY via the key formula
      kst = seed ^ 0xA5A5A5A5A5A5A5A5 (PREREGISTRATION.md): standard
      post-increment splitmix64 with little-endian 8-byte outputs re-derives
