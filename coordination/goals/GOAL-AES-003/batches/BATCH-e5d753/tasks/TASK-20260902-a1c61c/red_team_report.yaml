  verdict: stands-with-narrowing
  verdict_summary: >-
    The composed SH2-MONOTONE-DECAY verdict stands as a correctly-routed,
    correctly-scoped BAND-LEVEL result, and no producer finding is reversed
    here. I independently re-derived (2 fresh compute runs, no producer
    analysis code) every load-bearing number: the Garwood 95% CIs, the tier-2
    disjoint/overlap declarations, the seed ratios, the band sequence
    [3,3,1,1,1], the floor-vs-null power, and the cascade routing at the
    realized readings. All reproduce. The ordered cascade is free of reachable
    double assignment at these readings and the k=4 locator routes honestly.
    BUT the claim-space any downstream record may draw from this batch must be
    narrowed on three grounds: (1) the verdict's "decays with dilution to
    RESIDUAL-or-below by k=4" invites an EXTINCTION reading that the batch's
    own data refutes — the realized floor (h(4)=17, h(8)=13, h(16)=12) is a
    decisive, decidable excess over the analytic null (P(h>=12 | lambda=1) =
    8.3e-10; P(h>=17 | lambda=1) = 1.1e-15; floor-vs-null power 0.989 at
    lambda=13 per the proposal's own question iii), so MONOTONE-DECAY is a
    THRESHOLD->RESIDUAL band-trajectory statement, never an extinction
    statement; (2) the count-level decay magnitudes (ratios 84.90 and 8786.5)
    and the (2,4] count decay are SINGLE-SEED (primary seed 531001 only; k=2
    and k=8 unseeded) and their seed variance is unmeasured, and the
    count-level completion of the decay by k=4 is COUNT-UNRESOLVED (17 vs 13,
    overlapping CIs); (3) the exact seed-531001 reproduction of the
    BATCH-7b798d counts is instrument DETERMINISM, not independent
    replication, and the only truly independent draws are the second seeds at
    k=1 and k=4 — so seed support for the curve is thin at k=2/k=8/k=16 and
    the k=1 band agreement is nearly free (a ~3561-sd event to depart). The
    ramp-shape question narrows to a scoped monotone-decay band verdict; it is
    NOT closed.

  coordinator_prior_assessment:
    prior_source: DEC-20260902-38227b review_plan.prior (recorded before any reviewer ran)
    status: LARGELY MET on the expected joints; one flagged break joint MATERIALIZES as a narrowing
    detail: >-
      The prior expected S0 gates/anchors to pass (byte-identical build) and
      the k=16 re-seat to land in band — BOTH MET (PASS-S0; re-seat 12 in
      [6,30]). It named three uncertain joints: (1) the k=4 landing band — it
      landed RESIDUAL (17), not the ambiguity band, so the feared cascade
      misroute did NOT materialize; I re-checked the routing at h(4)=17 and at
      the counterfactual h(4)=50 (-> complement) and h(4)=150 (-> PLATEAU),
      and the locator selects honestly. (2) Second-seed agreement at saturated
      k=1 — it agreed (ratio 0.99991), but this agreement is nearly free
      (both seeds deep in THRESHOLD; a band departure is a ~3561-sd event), so
      it measures seed variance/determinism, not shape stability. (3) AMEND-1
      counter bookkeeping on first use — identities exact on every receipt (a
      validator-joint matter; I confirm only that no interpretation rests on a
      counter the record itself flags as inconsistent). Of the three named
      break points, "over-strong attribution language if the decay is monotone"
      is the one that MATERIALIZES: the attribution to dilution-at-fixed-
      schedule is correctly scoped, but the verdict's "RESIDUAL-or-below"
      phrasing carries an extinction reading the data refutes (RT-J1c / RT-A).
      The prior did NOT name the single-seed count-decay limitation or the
      determinism-vs-replication confound; both are recorded here as new
      narrowings.

  per_joint_attacks:
    - joint: RT-J1
      name: Attribution language under SCOPE-1 (dilution-alone / joint-effect / extinction reading)
      status: (a) and (b) FAIL — attribution correctly scoped; (c) LANDS — extinction reading must be barred
      attack: >-
        Three sub-attacks. (a) Does any sentence attribute the interior decay
        to dilution ALONE? NO — the verdict attributes it to "table dilution
        AT FIXED SCHEDULE" and carries the structural reason (AES schedule
        constant across all interior k>=1 under PIN-T0). Since the schedule is
        present but CONSTANT across interior points, the only varying factor
        is the table dose, so the attribution is schedule-clean and licensed by
        SCOPE-1. Note this is an attribution to the dose axis k (which factor
        varies), NOT a mechanism or which-position claim — the design's own
        confounders block states the dose label k does not isolate WHICH
        positions matter. Attack (a) FAILS. (b) Is the k=1 reading
        joint-effect-scoped against the k=0 identity anchor, with no
        dilution-only claim for the 12.7M magnitude? YES — the verdict states
        "h(1) itself and the k=0->k=1 step remain joint-effect-scoped; no
        dilution-only attribution of h(1) is made." The schedule switch
        co-varies with the first dilution step and no committed arm separates
        them, so the h(1) magnitude is correctly NOT attributed to dilution
        alone. Attack (b) FAILS. (c) Can MONOTONE-DECAY be read as "the excess
        vanishes" when the floor magnitude is unresolved? YES — this is the
        live attack. The verdict says "decays with dilution to
        RESIDUAL-or-below by k=4." The realized band at k=4 is RESIDUAL (17),
        not NULLBAND, and the floor (17/13/12 at k=4/8/16) is a DECISIVE
        excess over the analytic null lambda_0=1.0 (re-derived this session:
        P(h>=12|lambda=1)=8.3e-10, P(h>=13|lambda=1)=6.4e-11,
        P(h>=17|lambda=1)=1.1e-15; the proposal's question iii states
        floor-vs-null decidable at 2^30, power 0.989 at lambda=13). So the
        excess does NOT vanish; it decays ~5 orders from THRESHOLD to a live
        RESIDUAL floor. The disjunctive phrase "RESIDUAL-or-below" keeps the
        NULLBAND/extinction reading alive, and the composed verdict does NOT
        carry the floor-is-alive statement the design itself produced.
      falsification_route: >-
        Any downstream sentence reading MONOTONE-DECAY as "the excess
        vanishes/is extinguished by k=4" or "dilution kills the excess" is
        falsified by the realized RESIDUAL floor (17/13/12) being a decidable
        excess over the analytic null (P(h>=12|lambda=1)=8.3e-10). The
        paraphrase discipline already bars "extinction by k=8"; it must be
        extended to bar "extinction by k=4".
      may_claim: >-
        Interior-to-interior decay attributed to table dilution at fixed AES
        schedule (SCOPE-1); h(1) magnitude and the k=0->k=1 step
        joint-effect-scoped.
      may_not_claim: >-
        Dilution-only attribution of the h(1) magnitude; any reading that the
        excess vanishes or reaches null by k=4; any mechanism or which-position
        claim from the dose axis k.

    - joint: RT-J2
      name: Transition localization to (2,4] — band statement vs count statement
      status: band-level localization ROBUST; narrowing to state it is band-level / max-family-resolution and count-completion is unresolved
      attack: >-
        The "(2,4]" localization rests on h(2)=149,371>=100 and h(4)=17<=40.
        This is a BAND-level statement: bandrank drops 3 (THRESHOLD at k=2) ->
        1 (RESIDUAL at k=4). It is robust: h(2)=149,371 is deep in THRESHOLD
        (re-derived: even a +/-16% seed swing, the committed k=16 variance
        scale, leaves ~125k-173k, ~354-416 sd above the 100 boundary, despite
        k=2 being single-seed), and h(4)=17 is deep in RESIDUAL across BOTH
        seeds (17 and 21; CI upper bounds ~27 and ~32, all << 40). Two
        limitations. (i) 17 vs the RESIDUAL floor (13/12) is COUNT-UNRESOLVED
        at this exposure (re-derived Garwood CIs [9.9,27.2] vs [6.9,22.2] vs
        [6.2,21.0] overlap heavily), so whether k=4 is already at the floor or
        the decay continues through (4,8) is unresolved — the verdict must not
        claim the decay COMPLETES by k=4. (ii) k=3 is unmeasured (not a frozen
        family point), so sub-interval localization ((2,3],(3,4]) is
        unavailable; (2,4] is the MAXIMAL resolution the frozen family
        supports, a priced family-extension successor. The (2,4] statement is
        therefore supported as a band-level, maximal-family-resolution
        localization, with the (2,4) count decay itself COUNT-DECAY-RESOLVED
        (8786.5x, disjoint CIs) but single-seed.
      falsification_route: >-
        Any claim that the transition is localized finer than the half-interval
        (2,4] is falsified by the absence of any k=3/5/6 family point. Any
        claim that the decay reaches the floor exactly at k=4 is falsified by
        the overlapping Garwood CIs of 17 vs 13.
      may_claim: >-
        Band-level THRESHOLD->RESIDUAL transition in the half-interval (2,4];
        the (2,4) count decay COUNT-DECAY-RESOLVED (primary seed).
      may_not_claim: >-
        Sub-interval localization; count-level completion of the decay by k=4;
        the (2,4] localization as a count-level (rather than band-level)
        statement.

    - joint: RT-J3
      name: Seed-replication adequacy (k=1 near-perfect ratio; k=4 17 vs 21)
      status: sufficient for the pre-registered verdict-stability condition; narrowing on what it establishes
      attack: >-
        k=1: ratio second/primary = 0.99991 (re-derived; diff -1141). This is
        near-perfect, but BOTH seeds sit deep in the THRESHOLD band where band
        agreement is almost FREE — a band departure at k=1 is a ~3561-sd event
        (re-derived). So the k=1 second seed establishes seed VARIANCE at the
        largest reading (sub-0.01% relative rate variation at matched
        exposure) and instrument rate-stability, NOT shape stability; the
        design says exactly this ("a seed-VARIANCE measurement, not a band
        gamble"). The verdict's "seed stability verified at k=1" is accurate
        for the pre-registered band-agreement criterion but must not be
        over-read as evidence the k=1 excess magnitude is shape-stable across
        seeds. k=4: 17 vs 21 (ratio 1.235, re-derived), overlapping CIs,
        COUNT-UNRESOLVED between seeds. Does this weaken the locator's
        load-bearing role? NO at the level it is used: branch selection runs
        on the BAND reading (h(4)<=40), and both seeds are deep in RESIDUAL
        (CI upper bounds ~27/~32, all << 40), so the routing is robust across
        seeds. The k=4 agreement is MEANINGFUL, not free — k=4 could have
        landed AMBIGUITY or THRESHOLD (the design's seed_stability_power gives
        P(band disagreement)~0.0002 under the lambda=20.7 prior), so the
        RESIDUAL/RESIDUAL agreement is informative. The larger relative seed
        variance at k=4 (1.235 vs 0.99991) is the expected Poisson variance at
        low counts, declared COUNT-UNRESOLVED, never smoothed.
      falsification_route: >-
        Any claim that the k=1 second seed establishes shape stability (rather
        than seed variance/determinism at a THRESHOLD-certain point) is
        falsified by the ~3561-sd distance to the band boundary. Any claim
        that the k=4 count is seed-stable at the count level is falsified by
        the overlapping Garwood CIs of 17 vs 21.
      may_claim: >-
        Band agreement at k=1 and k=4 across seeds (the pre-registered
        verdict-stability condition); k=1 seed variance sub-0.01% relative;
        k=4 band routing robust across seeds.
      may_not_claim: >-
        k=1 agreement as shape-stability evidence; k=4 count-level seed
        stability; seed variance at k=2/k=8/k=16 (unseeded).

    - joint: RT-J4
      name: Determinism vs replication confound
      status: LANDS as a narrowing — exact reproduction is determinism, not replication; curve seed support thin at k=2/k=8/k=16
      attack: >-
        The seed-531001 re-runs reproduce the BATCH-7b798d seed-531001 counts
        EXACTLY (k=1 12,681,109; k=2 149,371; k=8 13; k=16 12). This is the
        DETERMINISTIC expectation (byte-identical build + identical seat +
        identical seed = identical streams; S0 demonstrated cross-batch
        receipt identity at identical seats), NOT an independent replication.
        The only truly INDEPENDENT draws in this batch are the second seeds
        (531002) at k=1 and k=4. So the interior curve has exactly ONE
        independent draw at k=2, k=8, and k=16, and two at k=1 and k=4. The
        decay curve the verdict composes rests primarily on the single primary
        seed at k=2/k=8/k=16. The evidential value of the second seeds must
        not be inflated by conflating the exact seed-531001 reproduction
        (determinism) with replication, and the verdict's "seed stability
        verified" applies ONLY to the two load-bearing points (the
        pre-registered condition), not to the whole curve. The record handles
        the discipline correctly (OBS-S1-2 states reproduction is determinism
        and is never pooled; batch_7b798d_observations_are_inputs is false),
        but downstream citation must keep exact-reproduction != replication
        and != validation of the prior observations.
      falsification_route: >-
        Any citation spending the exact seed-531001 reproduction as
        independent replication, or as validation of the BATCH-7b798d
        readings, is falsified by instrument determinism (identical
        seed/seat/build reproduces identical counts by construction) and by
        AMEND-1's no-post-hoc-rescue clause.
      may_claim: >-
        Instrument determinism at identical seats (cross-batch receipt
        identity); independent second-seed draws at k=1 and k=4 only.
      may_not_claim: >-
        The exact reproduction as replication or as validation of the prior
        observations; seed replication at k=2/k=8/k=16.

    - joint: RT-J5
      name: Power honesty post-verdict (priced non-detections)
      status: attack FAILS — all non-detections remain honestly priced; none quietly discharged
      attack: >-
        The proposal priced six non-detections; I confirm each remains
        unresolved by this batch's data and none is quietly discharged.
        (1) within-RESIDUAL floor magnitude (12 vs 13 vs 14 vs 19): realized
        floor 17/13/12 with overlapping Garwood CIs — still unresolved,
        declared COUNT-UNRESOLVED for (4,8)/(8,16). (2) seed variance of the
        k1->k2 decay ratio: k=2 single-seed — unmeasured, priced successor.
        (3) transition sub-interval within (2,4]: k=3 unmeasured — unresolved,
        priced family-extension successor. (4) schedule-vs-dilution
        decomposition at k=1: no PINCTRL control arm — unresolved, priced
        successor under a new pin. (5) seed variance at k=2/k=8/k=16:
        single-seed — unmeasured, priced successor. (6) anything below the
        per-point floors lambda_80/95: no NULLBAND point read — nothing tested
        below floor. The verdict carries the (4,8)/(8,16) COUNT-UNRESOLVED
        declarations and the priced successors. Power honesty is MAINTAINED.
        The one residual obligation is that these priced non-detections travel
        with the verdict into any downstream evidence record, so none is later
        read as silently resolved.
      falsification_route: >-
        Any downstream record that presents the floor magnitude, the decay-ratio
        seed variance, the transition sub-interval, the schedule decomposition,
        or k=2/k=8/k=16 seed variance as resolved by this batch is falsified by
        the single-seed, overlapping-CI, unmeasured-point record above.
      may_claim: >-
        The priced non-detections exactly as stated; floor-vs-null decidable
        (but floor magnitude not resolvable).
      may_not_claim: >-
        Any of the six priced non-detections as discharged by this batch.

    - joint: RT-J6
      name: Scope leakage
      status: attack FAILS in the composed verdict; four leakage routes barred downstream
      attack: >-
        (a) Beyond-scope language: the verdict statement carries full scope —
        "within the tested nested position family (frozen subset
        {0,1,2,4,8,16}) at the pinned probe cell (amask=1, smask=1), r=5,
        PIN-T0, 2^30 per point ... toy tier." No extension beyond the grid,
        cell, r, exposure, seeds, or pin. (b) Spending BATCH-7b798d
        observations as validation: NONE — OBS-S1-2 characterizes the exact
        reproduction as determinism/agreement, never pooled, and
        batch_7b798d_observations_are_inputs is false; the verdict composes
        from THIS batch's receipts alone. The phrase "reproduced the
        BATCH-7b798d observations exactly" must not be cited downstream as
        validation (it is determinism). (c) Closed-X-lane / carrier leakage:
        NONE — X statistic not computed, no-reopen clause honored, no carrier
        clause, no rho-exclusion; the word-split (W=1/W=3 motif) rides as
        report-only enabling data with no branch conjunct consuming it. (d)
        Crypto-scale / deployed-AES promotion: NONE — "no deployed-AES claims;
        no published-cryptanalysis comparisons." All four routes are clean in
        the composed verdict; the obligation is that downstream citation keeps
        them clean (especially (b) exact-reproduction != validation and the
        RT-J1c extinction reading).
      falsification_route: >-
        Citation audit of every downstream record against the scope-narrowed
        restatement; any decay sentence cited beyond cell (1,1), r=5, PIN-T0,
        2^30, grid {0,1,2,4,8,16}, seeds 531001/531002, or any carrier/X-lane
        or deployed-AES sentence, is a scope violation the red team will
        contest.
      may_claim: >-
        The scoped monotone-decay band verdict exactly as restated below.
      may_not_claim: >-
        Anything beyond the tested grid/cell/r/exposure/seeds/pin; any carrier
        or X-lane sentence; any deployed-AES or published-cryptanalysis
        statement; the exact reproduction as validation.

    - joint: RT-J7
      name: Cascade re-check at realized readings (double assignment / vacuous conjunct)
      status: attack FAILS — no reachable double assignment, no misroute; partial vacuity disclosed and harmless
      attack: >-
        Re-evaluated the ordered cascade at the realized readings (independent
        re-derivation). Branches 1-7 NOT_FIRED on correct conjuncts; branch 8
        SH2-MONOTONE-DECAY FIRES (band non-rising AND h(1)=12,681,109>=100 AND
        h(4)=17<=40); branches 9-10 NOT_REACHED. No reachable double
        assignment: branch 6 needs all interior h<=5 (false), branch 7 needs a
        band rise (none — ranks [3,3,1,1,1]), branch 9 needs h(4)>=100 (false).
        Branches 8 and 9 are disjoint by conjunct (h(4)<=40 vs h(4)>=100), not
        merely by order. The coordinator's feared "cascade misroute if k=4
        lands in the ambiguity band" did NOT materialize (k=4=17 RESIDUAL); I
        confirmed the locator routes honestly at counterfactual h(4)=50 (->
        RESIDUAL complement) and h(4)=150 (-> PLATEAU). VACUITY (prior J6
        inherited): at h(1)>=100 the bandrank at k=1 is already maximal (3), so
        branch 8's band-non-rising conjunct is automatically satisfied for any
        pair involving k=1 and does NO selection work there; it still
        constrains pairs among k>=2. Branch selection between MONOTONE-DECAY
        and PLATEAU is done by the k=4 locator, not the non-rising conjunct, so
        the partial vacuity is harmless; SH2-NONMONO is NOT vacuous (a rise
        among k>=2 would still fire branch 7). The design discloses this
        (cascade_overlap_check item 6). No defect.
      falsification_route: >-
        An exhaustive band-rank case check: a double-assignment claim would
        need a band-rank tuple satisfying two branches' conjuncts under the
        ordered evaluation, which does not exist. A misroute claim would need
        h(4)=17 to satisfy branch 9 or the complement, which it does not.
      may_claim: >-
        The cascade assigns a unique branch (SH2-MONOTONE-DECAY) to the
        realized outcome, ordered, with the k=4 locator as branch selector.
      may_not_claim: >-
        That the band-non-rising conjunct does selection work when h(1)>=100
        (it is partially vacuous there, disclosed).

    - joint: RT-J8
      name: Proves-too-much — verdict logic run against the floor; sensitivity to where RESIDUAL begins
      status: control PASSES; verdict consistent with a live floor; sensitivity NAMED
      attack: >-
        Run the verdict logic against the floor itself: if h(4)=17, h(8)=13,
        h(16)=12 are ALL treated as "excess present" (RESIDUAL), does the
        cascade still route MONOTONE-DECAY? YES (re-derived): branch 8 needs
        only h(1)>=100, h(4)<=40, and band non-rising; the RESIDUAL floor
        satisfies all three. So the verdict is CONSISTENT with the floor being
        a genuine excess — it does NOT require the floor to be null. This is
        exactly why RT-J1c matters: the verdict logic coexists with a live
        floor, so any extinction reading is an interpretation error, not a
        cascade consequence. SENSITIVITY NAMED: MONOTONE-DECAY is sensitive to
        where RESIDUAL begins in one specific way — it requires the floor to
        stay >= RESIDUAL (h>=6). If the floor had dipped to NULLBAND (h<=5) at
        k=8 and recovered to RESIDUAL at k=16, the band sequence would rise
        (rank 0->1) and SH2-NONMONO would fire instead (re-derived: route
        17,5,12 -> NONMONO). So the verdict implicitly depends on the floor
        never dipping below RESIDUAL across the grid; the realized floor
        (12-17) sits comfortably in RESIDUAL, so this sensitivity does not bite
        here, but it is named. The built-in proves-too-much controls pass: the
        r=6 dead anchor reads 0 (correct death), the k=0 ramp-zero reads 2^30
        (correct identity), and the AMEND-1 gate passes the ramp-zero receipt
        (overflow 2^30-1024, identities exact), so the gate is not indicted by
        the very truncation it must tolerate.
      falsification_route: >-
        The verdict logic would be proves-too-much-flawed if it routed
        MONOTONE-DECAY on a floor that dipped NULLBAND and recovered; it does
        not (it routes NONMONO). Any claim that MONOTONE-DECAY asserts the
        floor is null is falsified by the cascade routing MONOTONE-DECAY with
        a live RESIDUAL floor.
      may_claim: >-
        The verdict logic is consistent with a live RESIDUAL floor; the
        built-in dead/ramp-zero and AMEND-1 proves-too-much controls pass.
      may_not_claim: >-
        That the floor is null; that MONOTONE-DECAY is insensitive to the
        RESIDUAL lower boundary (it requires the floor to stay >=6).

  strongest_attacks:
    - id: RT-A
      name: The floor is alive — "RESIDUAL-or-below" invites an extinction reading the data refutes
      summary: >-
        The verdict's "decays with dilution to RESIDUAL-or-below by k=4"
        invites the misreading that the excess vanishes by k=4. The realized
        floor (h(4)=17, h(8)=13, h(16)=12) is a DECISIVE, decidable excess
        over the analytic null lambda_0=1.0 (re-derived: P(h>=12|lambda=1)
        =8.3e-10, P(h>=13|lambda=1)=6.4e-11, P(h>=17|lambda=1)=1.1e-15;
        floor-vs-null power 0.989 at lambda=13 per the proposal's question
        iii). MONOTONE-DECAY is a THRESHOLD->RESIDUAL band-trajectory
        statement, never an extinction statement. The composed verdict omits
        the floor-is-alive finding the design itself produced, and the
        disjunctive "RESIDUAL-or-below" keeps the NULLBAND reading alive.
        Narrowing: specialize to "RESIDUAL" (the realized band) and carry the
        explicit floor-is-alive statement. (Joints RT-J1c, RT-J8.)
    - id: RT-B
      name: Count-level decay magnitudes and the (2,4] count decay are single-seed; count completion unresolved
      summary: >-
