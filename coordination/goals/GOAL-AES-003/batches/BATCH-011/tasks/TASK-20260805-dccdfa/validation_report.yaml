  independence_check: see control_checks above (the load-bearing finding).

  cost_and_power_analysis:
    - question: "Was comparison B's exposure ceiling (2^24) the genuine
        practical ceiling for this construction, or was it avoidably
        underpowered?"
      my_analysis: >-
        The stated memory arithmetic is correct (independently recomputed
        above, matches to 3 sig figs). However, the specific implementation
        choice of a hash-index load factor of 0.5 (idx_cap =
        next_pow2(2*max_pairs)) is not the only viable design: an
        open-addressed table with a load factor closer to 1.0 (denser,
        longer average probe chains, but still functionally correct)
        would roughly HALVE the two index tables' combined footprint,
        which is exactly half of the total budget at every N in this
        design (pairs and index tables are equal-sized at load factor 0.5).
        That could plausibly have let comparison B reach N=2^25 within the
        8 GB budget (pairs 4.295 GB + a denser index ~2.1-3 GB, versus the
        8.590 GB the current 0.5-load-factor design would need at 2^25).
        This is a real, avoidable memory-efficiency gap the producer did
        not name.
      does_it_matter: >-
        Not materially. At N=2^25 the expected excess event count under
        BATCH-009's scaled rate is ~0.44 (double the ~0.22 at 2^24) --
        still far below 1, still overwhelmingly likely to yield 0-1 hits
        in a single run, still uninformative for a confirm/disconfirm
        verdict. Reaching the informative regime (~14 expected events,
        matching BATCH-009's original N=2^30 signal) would require roughly
        64x this task's actual exposure even under the current design, and
        would need N in the 2^28-2^30 range, which under EITHER load-factor
        choice costs 30-140+ GB -- outside any plausible single-machine
        8 GB budget for this table-based construction regardless of
        implementation efficiency. The "genuinely uninformative at the
        achievable exposure" conclusion is robust to this gap.
      verdict: >-
        The producer's specific claim that "N=2^24 is ... the largest
        exposure ... this implementation can run within budget" is
        accurate FOR THE IMPLEMENTATION AS BUILT, but slightly overstates
        the claim by omitting that a moderately more memory-efficient
        hash-table design (not attempted, not disclosed as a gap) could
        plausibly have reached ~2^25. This does not change the
        bottom-line verdict (inconclusive by power either way) and is
        recorded as a minor limitation, not a validation failure.

  what_this_batch_settles:
    ruling: >-
      The producer's own OUTCOME_SUMMARY framing is accurate and
      appropriately narrow, with one nuance worth adding. Comparison A's
      k=1-3 replication IS evidence against a shared-harness explanation
      for THAT SPECIFIC sub-finding (byte-locality absence), and it is
      correctly not extended to a broader claim. However, it is worth
      being explicit about WHY this evidence is weaker than it might sound:
      the k=1-3 "absence of excess" check is largely a sanity check that
      both instruments correctly implement basic RNG draw-and-count
      mechanics against the theoretical binomial-style null -- a
      correctly-coded instrument would pass this regardless of whether the
      deeper r=5/k=4 phenomenon is a real cipher effect or a harness
      artifact, because the check does not touch the k=4 cell where the
      original anomaly actually lives (that cell remains underpowered here,
      as both the producer and I confirm). It is real evidence of SOMETHING
      (independent codebases agree on a well-populated statistic), but it
      bears only glancingly on BATCH-010's specific concern, which was
      about a shared-harness bug that differentiates live cipher structure
      from an ideal-permutation null object -- exactly what comparison B
      was built to test and exactly what comparison B failed to resolve by
      power. The producer's own text ("the more direct test... produced no
      informative signal... neither corroborates nor contradicts") already
      says this correctly; I am only making explicit that comparison A's
      contribution to closing BATCH-010's risk is smaller than "well-powered
      sub-claim replicated" might suggest to a reader skimming only the
      summary line, not the full decision-rule text.
      If BATCH-009 or BATCH-008's finding had FAILED to replicate here
      (e.g. |z_k|>=3 at k=1-3, or a comparable ideal-arm elevation in
      comparison B), that would have been strong, substrate-independent
      evidence that the original finding IS a shared-harness or
      lineage-specific artifact, per the preregistered falsification
      rules -- and per AGENTS rule 3, a null/underpowered RESULT here is
      not itself negative evidence, but an ACTUAL disconfirming signal
      (had one appeared) would have been. Neither disconfirming pattern
      appeared. The residual risk BATCH-010 named for the
      cipher-substitution mechanism claim specifically is UNCHANGED, not
      closed, exactly as the producer states.

