        evaluated against a null object (the analytic binomial model, not
        a second empirical arm) -- appropriate for this comparison, since
        the quantity under test IS "does the observed count match the
        theory-only null," not a signal-vs-null-arm comparison.
      verdict: Appropriately controlled for its stated purpose.
    - control: >-
