  disclosed_gaps_assessment:
    - gap: No digest-based proof that comparison B's live and
        ideal-permutation plaintext streams are bit-identical up to the
        cipher call (rests on a code-level argument instead, unlike
        BATCH-009's own OBS-B9-3 which ran such a check).
      my_check: Read worker() (baseline/pfx path) and run_ideal() side by
        side. Both draw p0 via two sm64() calls in the same order and apply
        the identical PW-indexed active-word rejection loop for amask,
        given the confirmed-identical seed_thread. The code-level argument
        is sound as far as it goes; the gap is honestly named as a
        cheaper-but-real alternative to an executed proof, not silently
        assumed away.
      verdict: Honestly disclosed, correctly not overstated as verified.
    - gap: armideal's ~4.3 GB memory estimate was not independently
        profiled with a peak-RSS tool; only estimated from allocation-size
        arithmetic plus one `free -h` check before the run.
      my_check: Recomputed the allocation arithmetic myself (see
        cost_and_power_analysis) and confirm it is correct; a
        deeper memory-efficiency gap (load-factor choice) exists beyond what
        the disclosed gap names, per above.
      verdict: The disclosed gap (no profiling) is accurate but incomplete
        -- see cost_and_power_analysis for the additional, undisclosed
        efficiency gap. Not severe enough to change the verdict.

  parse_confirmation: >-
    I parsed this entire validation_report.yaml I am writing, in full,
    before finishing -- confirming YAML structure by construction (built
    field-by-field from checks actually run, no placeholder blocks) and
    re-reading it top to bottom as the final step of this task, per the
    task's constraint to parse the whole report and say so inside the
    artifact.

  limitations:
    - "TOY TIER ONLY. Nothing here supports any statement about full-round
      AES, deployed AES, or any comparison to published cryptanalysis, in
      either direction."
    - "This validation does not and cannot resolve whether the underlying
      r=5 W>=1 excess (BATCH-006 onward) is a real cryptanalytic effect or
      an artifact of some property shared by BOTH the v2-v4 lineage and
      rc8probe by design (e.g. a conceptual property of the shared PW/CW
      geometry or the shared yoyo trial definition itself, as opposed to a
      shared IMPLEMENTATION bug). RC-B rules out shared-CODE artifacts by
      construction (independence confirmed above); it cannot rule out a
      shared-DEFINITION artifact, because both instruments deliberately
      implement the same defined statistic. This is a residual risk this
      batch was never positioned to close and does not claim to."
    - "Comparison B's exposure (2^24) is confirmed underpowered by roughly
      2 orders of magnitude relative to what would be needed to observe
      BATCH-009's original signal at its original rate; a moderately
      denser hash-table design could plausibly have reached one more
      power-of-two (2^25) within budget, but this would not have changed
      the inconclusive verdict (see cost_and_power_analysis)."
    - "The k=4 cell in comparison A (2 observed vs 0.125 modeled, z=5.30)
      is descriptive only, as preregistered; it is NOT independent
      confirmation of BATCH-008's original k=4/2^30 finding and must not
      be read as such by any downstream consumer of this report."
    - "This report assigns no official hypothesis status, no evidence
      strength, and recommends no promotion, per the Validator's role
      boundary. A passed verdict makes this receipt admissible evidence;
      it is not itself an ECDLP, AES, or speedup claim."

