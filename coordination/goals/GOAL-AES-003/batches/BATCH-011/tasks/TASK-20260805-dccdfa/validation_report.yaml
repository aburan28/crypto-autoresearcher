  control_checks:
    - control: Independence of the extended instrument from the
        yoyo_sbox_v2-v3-v4 lineage -- this batch's central purpose.
      method: Read rc8probe_baseline.c, rc8probe_pfx.c, and rc8probe_ideal.c
        side by side against yoyo_sbox_v2.c (BATCH-004), yoyo_sbox_v3.c
        (BATCH-008), and yoyo_sbox_v4.c (BATCH-009, which carries the B9
        ideal-permutation addition RC-B is meant to independently
        replicate). Checked for shared variable/function names, shared
        code structure beyond what the shared statistic definition
        requires, and shared algorithmic approach for the two new
        capabilities specifically.
      findings:
        - "PREFIX COUNTER: v3/v4's RC-10 addition (wgek[4]) computes a
          TRIAL-LEVEL statistic -- for each trial, the longest zero prefix
          across any of the 4 words, then increments wgek[k-1] for
          k=1..kmax (an 'at least one word has prefix>=k' indicator per
          trial), with an exact analytic null
          (N-trivial)*(1-(1-1/256^k)^4). rc8probe_pfx.c's addition computes
          a DIFFERENT, WORD-LEVEL statistic -- pfx1[j]/pfx2[j]/pfx3[j] per
          word j, summed across all 4 words and all trials (a per-word
          event count, not a per-trial indicator), with a binomial-style
          null (N-trivial)*4/256^k. These produce numerically close but
          NOT identical values and are conceptually different quantities.
          Checked against BATCH-008's own OBS-B8-2 statement in
          ledger/evidence/EV-AES-8b8dcf.yaml ('16.7M events' at k=1,
          '65k events' at k=2 on N=2^30) -- these figures match a
          WORD-EVENT-COUNT statistic (2^30*4/256=16.78M), i.e. rc8probe_pfx
          correctly reimplements the statistic OBS-B8-2 actually reported,
          which is NOT v4's own wgek field. This is exactly what
          independent-but-correct derivation from a natural-language
          finding (rather than transcription of v4's own field) looks
          like: same target quantity, different code, different exact
          formula, verified against the right primary source."
        - "IDEAL PERMUTATION: v4's B9 addition realises the ideal
          permutation with a SINGLE splitmix64 stream (seed_cipher, offset
          from the plaintext stream by a fixed constant) and NO persistent
          cross-trial state; injectivity is enforced only WITHIN a trial
          (redraw if the second forward draw collides with the first), and
          cross-trial collisions are dismissed by an explicit probability
          bound (<=2^-56 at 2^34 trials), stated as a bound, not measured.
          rc8probe_ideal.c's addition (perm128) is architecturally
          different: it builds and maintains a PERSISTENT, GLOBAL,
          open-addressed hash-indexed table of (domain,range) pairs across
          ALL trials, resolving hash collisions by exact 128-bit compare,
          giving EXACT global injectivity rather than a negligible-collision
          argument. This is the direct cause of the memory-footprint
          problem the producer had to budget around (STEP3's ~4.3-8.6 GB
          figures) -- v4's construction has NO comparable memory-scaling
          problem at all, because it stores no table. A transcription of
          v4 would not have inherited this constraint; the fact rc8probe_ideal
          chose a strictly more rigorous (and more expensive) construction
          is itself evidence the author reasoned from the OBS-B9-2
          specification text (which the producer cites explicitly) rather
          than from v4's code."
        - "NAMING: grepped rc8probe_ideal.c for every v4-specific symbol
          (IDEALPERM, idealperm, stream_gap, pdigest, seed_cipher,
          ideal_redraws) -- zero matches. Grepped yoyo_sbox_v4.c for every
          rc8probe-specific symbol (perm128, blk128, dom_idx, rng_idx,
          blk_hash, blk_random) -- zero matches. No shared vocabulary in
          either direction beyond generic C keywords and the pre-existing
          shared substrate (sm64, PW/CW, amask/smask) that both instruments
          share BY DESIGN as part of the measured object's own definition,
          per rc8probe_baseline.c's own header comment, which states
          explicitly which parts are reproduced because they are part of
          the object's definition and which parts (T-tables vs direct
          cipher, log/antilog S-box vs product search, equivalent-inverse
          vs direct-inverse) are deliberately different."
      verdict: >-
        CONFIRMED INDEPENDENT. The prefix-counter and ideal-permutation
        additions are independently derived, not transcribed. This is the
        strongest and most load-bearing finding of this validation --
        RC-B's stated purpose (converting BATCH-008/009's mechanism claims
        from lineage-internal to lineage-independent) is met by the
        extension itself, regardless of what the comparisons go on to
        show.
    - control: Preregistration-before-measurement (comparison B's
        "inconclusive by power" framing must be stated in advance, not
        adopted after seeing a null result).
      method: >-
        Read PREREGISTRATION.md's text (states the ~0.22-expected-event
        floor and explicitly anticipates 0-or-1 hits as the LIKELY outcome,
        BEFORE either comparison ran). Independently checked this ordering
