        cmpB_live_r5.json 17:24:01; cmpB_ideal.json 17:25:31; RESULTS.json
        (compiled last) 17:28:17.
      verdict: CONFIRMED. Independent physical evidence (mtimes), not just
        the file's own narrative, supports PREREGISTRATION.md predating
        both comparison runs. The "0 hits, INCONCLUSIVE BY POWER" framing
        was stated in advance, not adopted post-hoc.
    - control: Comparison A's decision rule requires a positive control
