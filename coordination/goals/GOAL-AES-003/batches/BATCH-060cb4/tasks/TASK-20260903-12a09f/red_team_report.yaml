        decay-shape stability spending FAILS; (c) window/n=2 attack LANDS as
        narrowing N1 (resolution non-uniformity between (1,2) and (2,4))
      attack: >-
        Three sub-attacks. (a) Is there any reading that spends the k=8 pair's
        now-two draws as count replication, or generalizes COUNT-REPLICATED to
        the whole curve? NO — the S1 verdict sentence names pairs (1,2) and
