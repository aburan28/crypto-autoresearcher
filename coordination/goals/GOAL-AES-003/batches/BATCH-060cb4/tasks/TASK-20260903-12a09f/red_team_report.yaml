      (re-derived) — an unremarkable draw; the pricing was honest and the
      sensitivity stands tested and untriggered. Uncertain joint 3 (k=3
      landing, all four bands live, multiplicative prior flagged
      broken-authority): landed THRESHOLD/THRESHOLD (1830/1777); the prior's
      1-4% proximity is recorded per rule 8 with its broken authority intact
