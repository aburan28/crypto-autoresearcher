      modification): passed with a stronger-than-required non-perturbation
      check (OBS-S2a-5: digested extended freeze differs from the frozen
      digested freeze ONLY by the k=3 entry). Break point (a) over-strong
      count-completion language: MATERIALIZES as narrowing N1 — the producer
      verdict sentence is pair-scoped, but the (2,4) extension's resolution
      is materially weaker than the (1,2) verdict's and the window's
      magnitude-specificity is not yet carried in the verdict sentence. Break
