        n=2 seed environments (531001/531002), a measurement, not a
        population-variance estimate (priced non-detection 7). The verdict is
        exactly as strong as the preregistered rule — BUT the rule's
        resolution is NON-UNIFORM across the two named pairs: (1,2) is
        adjudicated at the 1% window (per-seed ratios 84.8967 vs 84.3016,
