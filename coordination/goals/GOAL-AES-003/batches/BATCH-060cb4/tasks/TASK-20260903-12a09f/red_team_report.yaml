  verdict: stands-with-narrowing
  verdict_summary: >-
    The composed batch content — CC-AGREE (COUNT-REPLICATED for pairs (1,2)
    and (2,4) only), CC8-AGREE (floor seed-stable at band level at k=8), and
    CC3-SUBLOCALIZE-LATE (transition localized to (3,4] at band level) —
    stands as correctly routed under the binding preregistration, correctly
    scoped, and free of any finding reversed here. I independently re-derived
    (2 fresh compute runs, no producer analysis code) every load-bearing
    number: all Garwood CIs (exact to 4 decimals), the count-agreement window
    threshold counts 150,891/147,858 and ratios 1.010176/0.989871, the
    realized seed ratio 1.006969 in-window, all eight per-seed corner-propagated
    decay-ratio CIs and their overlap statuses, the CC8 pricing (0.01073 /
    0.4457), the floor-vs-null tails, the k=3 seed distance (z ~ 0.88-1.25),
    the counter-identity arithmetic on all four new receipts, and the CC3
    cascade routing at the realized readings and at counterfactuals
    h(3)=5/6/40/41/99/100 plus asymmetric configurations. All reproduce.
    BUT the claim-space downstream records may draw from this batch must be
    narrowed on four grounds: (1) the COUNT-REPLICATED verdict is pair-named
    and resolution-NON-UNIFORM — (1,2) is replicated at the preregistered
    ~1% magnitude-specific window while the (2,4) extension rides wide-CI
    overlap under an 18.5% point-estimate spread, n=2 seed environments
    total, and nothing at floor magnitude has been count-evaluated under any
    rule; (2) the (3,4] sub-localization is a band-level family-resolution
    statement that coexists with a ~108x count drop across (3,4] into a live
    RESIDUAL floor (17/13/12, COUNT-UNRESOLVED) — no cliff-at-4, no
    completion-at-k=4, no sub-sub-interval reading; and the broken-authority
    multiplicative prior's 1-4% proximity to h(3) is a recorded coincidence,
    never restored authority; (3) the CC3 routing was governed by the binding
    preregistration AGAINST an inverted CC3-NONMONO paraphrase in the dispatch
    brief (DEV-S2b-1) under which the realized readings would have been
    labeled a non-monotone finding — the closing decision must ratify the
    governing rule; (4) the extended-family scope label {0,1,2,3,4,8,12,16}
    names k=12, which is frozen but has never been measured in any batch —
    the label is a commitment surface, not measured coverage. The producers
    pre-empted all three of the coordinator's named break joints in their own
    text (pair-only count language, explicit floor-alive guard sentences,
    OBS-S2b-4's nearly-free-agreement record); the narrowings below bind
    downstream citation, not a recomposition.

  coordinator_prior_assessment:
    prior_source: DEC-20260903-63cd8d review_plan.prior (recorded before any reviewer ran)
    status: >-
      Expectations MET on S0 and the k=2 landing; of the four named uncertain
      joints, three resolved as designed and the fourth (count agreement at
      k=2) resolved CC-AGREE at 0.7% inside the window; of the three named
      break points, ONE materializes as a narrowing (over-strong
      count-completion language, in the resolution-non-uniformity between
      (1,2) and (2,4)) and two did NOT materialize in producer text
      (extinction creep; quiet spending of the k=3 band agreement) because
      the producers pre-empted them with explicit guard sentences.
    detail: >-
      Expected: S0 pass, k=2 second seed THRESHOLD inside the window — both
      MET (PASS-S0; 150,412 THRESHOLD, ratio 1.006969 in [0.9899, 1.0102]).
      Uncertain joint 1 (COUNT agreement at k=2, a 1-5% seed effect reads
      COUNT-DISAGREE): the realized 0.7% effect landed inside the window;
      COUNT-AGREE is CI-overlap-equivalent at the realized magnitude, so the
      verdict is exactly "agreement within declared ~1% resolution at n=2",
