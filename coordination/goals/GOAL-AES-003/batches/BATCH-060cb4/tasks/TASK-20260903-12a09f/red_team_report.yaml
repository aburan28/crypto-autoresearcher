        spread as report-only). "Extended to count level for (2,4)" is
        therefore a materially weaker sentence than for (1,2), and the
        magnitude-specificity of the window (a ~0.5% Garwood relative
        half-width instrument at 149k; no such window exists at floor
        magnitude) must travel with the verdict.
      falsification_route: >-
        Any downstream sentence reading COUNT-REPLICATED as whole-curve count
        replication, as seed-population stability (n=2), or as count-level
        content for (4,8)/(8,16) is falsified by the preregistered rule domain
        (pairs (1,2)/(2,4) only) and by k=16's single seed. Any sentence
        presenting the (2,4) count replication at the same resolution as (1,2)
        is falsified by the 18.5% per-seed point-estimate spread under
        wide-CI overlap (re-derived: 8786.53 [5459.73, 15168.56] vs 7162.48
        [4661.76, 11633.79]).
      may_claim: >-
        COUNT-REPLICATED for pairs (1,2) and (2,4) only, at per-pair declared
        resolution, n=2 seed environments (531001/531002), per-seed ratios
        with CIs named.
      may_not_claim: >-
        Whole-curve count replication; count sentences for (4,8)/(8,16);
        population-level seed-variance estimates; uniform resolution across
        the two replicated pairs.

    - joint: RT-J2
      name: Sub-localization scope (attack plan 2) — cliff-at-4 reading, prior rehabilitation, extinction creep
      status: >-
        (a) cliff-at-4 invitation LANDS as narrowing N2 (band-level,
        family-resolution, count profile inside (3,4] unresolved); (b) prior
        rehabilitation FAILS on producer text (OBS-S2b-1 pre-empts it),
