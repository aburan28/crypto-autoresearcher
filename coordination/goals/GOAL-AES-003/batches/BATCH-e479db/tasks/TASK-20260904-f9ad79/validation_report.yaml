    step_H_decidability_of_the_tightened_rule:
      pre_arm_domain_fixing: >-
        CONFIRMED. The SR-3 conjunct adds no data-dependent element: c_margin
        and c_gate are named quantiles (0.95 and 0.99) of the chi-squared
        null reference law at df = n_k - 1 = 3, fixed by the adopted arm
        count before any arm runs; Step 5.4's own text states the threshold
        is fixed pre-arm and consults no realized reading and no red-team
        object. The margin routing (Step 5.5) is likewise stated in full, in
        terms of the same pre-arm constants.
      ordering: >-
        CONFIRMED. Gates G1-G4, then admissibility P1-P5, then comparator
        setting (Section 4), then Branch H (Step 5.0, before any pooling),
        then Branches 1-5 in order. The tightened rule inserts the margin
        conjunct INSIDE Branch 4's conjunct and the margin-zone catch INSIDE
        Branch 5's; it creates no new branch and moves no existing one.
      mutual_exclusivity: >-
        CONFIRMED by direct argument. Branch H takes every reading with
        D_k >= c_gate at either point before the cascade exists. Of the
        remainder, Branch 1 is a binary fire/no-fire evaluated first. On the
        rejection path, Branches 2/3 split by the sign of pi_hat - pi0,
        which cannot be zero when the test rejects (the two-sided p-value at
        the symmetric point is 1). On the non-rejection path, Branch 4
        requires interval containment AND D_k < c_margin at both points;
        Branch 5 receives every other non-rejecting reading, explicitly
        including margin-zone readings (c_margin <= D_k < c_gate at either
        point) and interval non-containment. The three dispersion regions
        {< c_margin}, [c_margin, c_gate), [>= c_gate] partition the
        non-negative reals, so no admissible reading lands in two branches
        or in none. ONE OBSERVATION, recorded for the composition: a
        margin-zone reading (c_margin <= D_k < c_gate) can still fire
        Branch 1 if both comparator tests fail to reject, because Branch 1
        does not require the margin; this is consistent with Step 5.5's own
        wording (the demotion applies to Branch-4 candidates) and is a
        licensing question, not a decidability defect - it is flagged for
        J-R2 and not ruled on here.
      exhaustiveness: >-
        CONFIRMED, same argument: the non-rejection residue not captured by
        Branch 4 is exactly Branch 5's stated disjunction.
      verdict: >-
        The tightened rule remains reachable, strictly ordered, mutually
        exclusive, exhaustive, and pre-arm domain-fixed. No reading/routing
        was found where it is unreachable, overlapping, or decided only
        after seeing the data.

