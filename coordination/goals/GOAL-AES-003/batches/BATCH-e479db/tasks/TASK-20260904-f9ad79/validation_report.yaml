      - coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-779393/validation_report.yaml (prior batch/round validator report; format precedent only)
    committed_readings_used:
      h4_531001: 17
      h4_531002: 21
      h8_531001: 13
      h8_531002: 18
      h16: 12
      exposure_per_arm: 2^30 trials
      cell: (1,1)
      r: 5
      pin: PIN-T0
      seeds: [531001, 531002]
    alpha_convention: >-
      Exact Garwood Poisson intervals at alpha = 0.05. The revised
      preregistration was checked for a named alternative: it keeps
      alpha = 0.05 two-sided (floor-versus-floor), alpha_N = 0.001 one-sided
      (comparator), alpha_H = 0.01 (homogeneity), and names no other alpha
      for the Garwood intervals, so 0.05 stands, per the review plan's
      instruction.
    quantity_statement_used: >-
      Per the review plan's blind_rederivation block and the J-R1 attack
      plan: (a) the FM-PLATEAU-CONSISTENT false-positive rate at phi = 1.0,
      1.25, 1.5, 1.75, 2.0 under the revision's stated heterogeneity model
      M-PH at the priced exposure; (b) the tightened Branch-4 conjunct's
      firing region under the homogeneous null (satisfiability - can it fire
      at all?); (c) the tightened rule's routing on the realized readings.
    model_statement_used: >-
      Verbatim from design-revision.yaml sr2_model_statement (permitted
      reading): at k = 4, n = 4 independent arms with deterministic bimodal
      per-arm rates, two arms Poisson(lambda_plan - d) and two arms
      Poisson(lambda_plan + d) with d = sqrt(lambda_plan * (phi - 1)); at
      k = 16, n = 4 arms homogeneous Poisson(lambda_plan); lambda_plan = 16;
      exposure 2^30 per arm; all arms independent (H2 holds); phi grid
      1.0, 1.25, 1.5, 1.75, 2.0. SR-3 remedy statement: at BOTH primary
      points the dispersion index D_k must be strictly below
      c_margin = chi2_0.95(n_k - 1), against the Branch-H critical value
      c_gate = chi2_0.99(n_k - 1); readings with c_margin <= D_k < c_gate at
      either primary point route to FM-UNRESOLVED.
    method_note: >-
      Computed with fresh python3/scipy code written this session (scripts in
      the scratchpad, paths below), never reading or recomputing from the
      producer's file. The dispersion-index part is an EXACT enumeration of
      the four-arm joint law (per-arm count cutoff 72, excluded Poisson mass
      < 1e-13 per point), not an asymptotic approximation; the primary
      conjunct part is evaluated on an exact table over all (T_4, T_16)
      pairs, verified cell-by-cell against the binding oracle
      scipy.stats.binomtest (Section 1 item 17 names it as the binding
      convention). Free methodological choices I made independently are
      disclosed individually below.

    freely_chosen_conventions_disclosed:
      - id: FC-1
        choice: >-
          FPR defined as the UNCONDITIONAL P(Branch 4 fires | M-PH(phi)) at
          the priced exposure (n = 4 per point, 2^30 per arm), including the
          Branch-1-not-fired conjunct. The decomposition quantities
          (P(primary conjuncts), per-point dispersion-region masses,
          tightened/original-rule comparison) are reported alongside so any
          alternative convention a producer may have used can be compared.
      - id: FC-2
        choice: >-
          Design-time operative comparator lambda_op = lambda_0 = 1.0 for the
          Branch-1 evaluation. U_null is a realized quantity the design
          cannot know pre-arm; lambda_0 is the only pre-arm value the
          Section-4 rule admits. Sensitivity is nil at floor truth: the
          Branch-1 firing probability under M-PH is of order 1e-31 at
          lambda_op = 1 and can only shrink as lambda_op grows.
      - id: FC-3
        choice: >-
          Realized-reading routing is a paper exercise, because the rule
          fixes n_4 = n_16 = 4 NEW arms and the five committed readings are
          barred from the test statistic (new-arms-only discipline). I routed
          them under three disclosed conventions: (A) pool both committed
          k=4 draws (exposure 2x2^30) against the single k=16 arm (1x2^30),
          exposure-weighted null pi0 = 2/3, rho map factor n16/n4 = 1/2,
          dispersion thresholds at df = n-1 per point (df=1 at k=4; D_16
          undefined at n=1); (B) single draw 17 vs 12 at n=1 each; (B2)
          single draw 21 vs 12 at n=1 each. The min-likelihood two-sided
          convention of Section 1 item 17 is applied at the exposure-weighted
          pi0 in convention A (the item states it for pi = 0.5; the
          extension to pi0 = 2/3 is the same minimum-likelihood definition
          and is my free choice, flagged here).
      - id: FC-4
        choice: >-
          Two-sided min-likelihood p-value tie handling follows scipy's own
          rule f(j) <= f(k)*(1+1e-7), read from the installed scipy 1.13.1
          binomtest source, since Section 1 item 17 binds the rule to match
          scipy.stats.binomtest.
      - id: FC-5
        choice: >-
          The k=16 point under M-PH stays homogeneous Poisson(16) at every
          phi, exactly as the model statement says (heterogeneity enters at
          k=4 only), so its dispersion law is phi-invariant.

    step_G_garwood_cis:
      formula: >-
        Exact Garwood Poisson CI at alpha = 0.05: lower = 0.5*chi2.ppf(0.025,
        2h) (0 if h = 0); upper = 0.5*chi2.ppf(0.975, 2(h+1)).
      results:
        - {reading: h4_531001, x: 17, ci: [9.903, 27.219]}
        - {reading: h4_531002, x: 21, ci: [12.999, 32.101]}
        - {reading: h8_531001, x: 13, ci: [6.922, 22.230]}
        - {reading: h8_531002, x: 18, ci: [10.668, 28.448]}
        - {reading: h16, x: 12, ci: [6.201, 20.962]}
      cross_check: >-
        My computed CI for x = 17 is [9.903, 27.219], exactly matching
        CORR-20260903-d3cab5's corrected value and NOT reproducing the
        disclaimed 29.2 citation error; my x = 18 upper bound 28.448 is
        consistent with the correction record's own cross-check figure
        (h=18 -> 28.45). Independent confirmation of the correction.

    step_A_thresholds:
      c_margin_chi2_0.95_df3: 7.8147279032511765
      c_gate_chi2_0.99_df3: 11.344866730144373
      c_margin_chi2_0.95_df1: 3.8414588206941205
      c_gate_chi2_0.99_df1: 6.6348966010212145
      ordering_check: >-
        c_margin < c_gate strictly (7.8147 < 11.3449 at df=3; 3.8415 <
        6.6349 at df=1), so the three regions {D < c_margin},
        [c_margin, c_gate), [c_gate, infinity) form a genuine partition; the
        margin zone is non-degenerate. Both thresholds are named quantiles of
        the chi-squared null reference law at fixed df = n_k - 1 = 3,
        consult no realized reading, and are therefore fixable pre-arm.

    step_B_point_distributions:
      method: >-
        Exact enumeration of the four-arm joint law at each point: all count
        vectors (x1..x4) with 0 <= xj <= 72, product Poisson weights at the
        M-PH arm rates, T = sum xj, D = sum (xj - T/4)^2 / (T/4). Per-point
        cutoff-excluded mass <= 1.7e-14. The t=0 cell (mass ~1.6e-28, D
        undefined) is excluded from the D-region accumulators and from E[D].
      k16_point: >-
        Homogeneous Poisson(16) x 4 at every phi (model M-PH); its
        dispersion law is the phi = 1.0 row.
      structural_fact_check: >-
        VERIFIED. The k=4 pooled-total marginal under M-PH equals
        Poisson(4 x 16 = 64) at every phi to max absolute difference
        3.15e-15 over the full count range; the k=16 marginal is Poisson(64)
        by construction. The revision's key_structural_fact (the primary
        statistic's marginal law is unchanged by heterogeneity; heterogeneity
        enters Branch 4 only through the homogeneity gate) is therefore
        correct, and it is what makes the FPR table factorize into a
        phi-invariant primary-conjunct part and a phi-dependent
        dispersion-gate part.
      per_phi_k4_point:
        - {phi: 1.0, d: 0.0, arm_rates: [16.0, 16.0, 16.0, 16.0], E_D4_exact: 3.0000000, P_D4_lt_c_margin: 0.9509484, P_D4_margin_zone: 0.0395198, P_D4_ge_c_gate: 0.0095317}
        - {phi: 1.25, d: 2.0, arm_rates: [14.0, 14.0, 18.0, 18.0], E_D4_exact: 3.9843750, P_D4_lt_c_margin: 0.8866449, P_D4_margin_zone: 0.0819580, P_D4_ge_c_gate: 0.0313971}
        - {phi: 1.5, d: 2.8284271, arm_rates: [13.1715729, 13.1715729, 18.8284271, 18.8284271], E_D4_exact: 4.9687500, P_D4_lt_c_margin: 0.8109560, P_D4_margin_zone: 0.1252554, P_D4_ge_c_gate: 0.0637887}
        - {phi: 1.75, d: 3.4641016, arm_rates: [12.5358984, 12.5358984, 19.4641016, 19.4641016], E_D4_exact: 5.9531250, P_D4_lt_c_margin: 0.7285966, P_D4_margin_zone: 0.1651706, P_D4_ge_c_gate: 0.1062328}
        - {phi: 2.0, d: 4.0, arm_rates: [12.0, 12.0, 20.0, 20.0], E_D4_exact: 6.9375000, P_D4_lt_c_margin: 0.6438065, P_D4_margin_zone: 0.1986634, P_D4_ge_c_gate: 0.1575302}
      k16_point_all_phi:
        {E_D16_exact: 3.0000000, P_D16_lt_c_margin: 0.9509484, P_D16_margin_zone: 0.0395198, P_D16_ge_c_gate: 0.0095317}
      e_d_note: >-
        E[D_4] rises linearly from 3.000 (= df, the homogeneous value) to
        6.9375 at phi = 2.0, i.e. roughly 3 + 3.9375*(phi-1); at phi = 2 the
        mean dispersion index sits BELOW c_margin = 7.8147, so the margin
        conjunct is far from blocking all heterogeneous readings - the
        residual mass is quantified in the FPR table below.

    step_C_primary_conjuncts:
      branch1_comparator_test:
        null_mean_per_point: 4.0   # n_k x lambda_op = 4 x 1.0
        rejection_rule: one-sided exact Poisson, reject iff P(Poisson(4) >= T) <= 0.001
        first_rejecting_T: 12
        p_at_T12: 0.0009152291472700608
        p_at_T11: 0.0028397661205137414
        branch1_firing_prob_under_MPH: >-
          ~5.7e-32 (both pooled totals would need T <= 11 under Poisson(64)
          marginals); negligible at every phi, so Branch-1-not-fired is
          effectively certain under M-PH and the lambda_op convention FC-2
          is immaterial.
      two_sided_test_oracle_verification:
        cells_checked_against_scipy_binomtest: 40400
        mismatches: 0
        tie_rule: f(j) <= f(k)*(1+1e-7), read from scipy 1.13.1 binomtest source
        note: >-
          Every (t4, t16) cell with t4, t16 <= 200 (covering all material
          Poisson(64) x Poisson(64) mass) was checked against the binding
          oracle; zero mismatches at tolerance 1e-12.
      primary_conjunct_probability:
        value: 0.19017931082518919
        definition: >-
          P(Branch 1 not fired AND two-sided min-likelihood test does not
          reject at 0.05 AND CP-mapped rho interval contained in
          [1/1.5, 1.5]) under independent Poisson(64) x Poisson(64) pooled
          totals.
        phi_invariance: >-
          Identical to 1.4e-13 across all five phi (as the structural fact
          requires), so all phi-dependence of the FPR lives in the
          dispersion-gate factor.
        sanity_note: >-
          The small value is expected: containment of the 95 percent ratio
          interval inside [2/3, 3/2] at pooled total ~128 requires
          |pi_hat - 0.5| of order 0.013, far tighter than the non-rejection
          band of order 0.086. It is consistent with the design's own
          honest_prior P(FM-PLATEAU-CONSISTENT) ~0.20 and with the
          prior-round validator's ~22.6 percent under a slightly different
          planning rate.

    step_D_sr2_fpr_table:
      definition: >-
        FPR(phi) = P(the tightened Branch-4 conjunct holds | M-PH(phi)),
        i.e. the unconditional probability that the revised rule fires
        FM-PLATEAU-CONSISTENT when the data-generating process is the
        OBJ-5 calibration family at heterogeneity phi. Exact enumeration;
        the correlation between D_4 and T_4 is handled by the exact joint
        sum, not by assuming independence.
      table:
        - {phi: 1.0, FPR_tightened_rule: 0.1719399, FPR_original_rule_branchH_only: 0.1865562, FPR_tightened_over_stat_only: 0.9040937, FPR_original_over_stat_only: 0.9809489, FPR_tight_phi_over_FPR_tight_phi1: 1.0000000}
        - {phi: 1.25, FPR_tightened_rule: 0.1598427, FPR_original_rule_branchH_only: 0.1822496, FPR_tightened_over_stat_only: 0.8404842, FPR_original_over_stat_only: 0.9583042, FPR_tight_phi_over_FPR_tight_phi1: 0.9296428}
        - {phi: 1.5, FPR_tightened_rule: 0.1455723, FPR_original_rule_branchH_only: 0.1758297, FPR_tightened_over_stat_only: 0.7654478, FPR_original_over_stat_only: 0.9245469, FPR_tight_phi_over_FPR_tight_phi1: 0.8466466}
        - {phi: 1.75, FPR_tightened_rule: 0.1300556, FPR_original_rule_branchH_only: 0.1673980, FPR_tightened_over_stat_only: 0.6838577, FPR_original_over_stat_only: 0.8802114, FPR_tight_phi_over_FPR_tight_phi1: 0.7564014}
        - {phi: 2.0, FPR_tightened_rule: 0.1141236, FPR_original_rule_branchH_only: 0.1572059, FPR_tightened_over_stat_only: 0.6000840, FPR_original_over_stat_only: 0.8266194, FPR_tight_phi_over_FPR_tight_phi1: 0.6637409}
      monotonicity_finding: >-
        UNDER M-PH THE BRANCH-4 FIRING PROBABILITY IS STRICTLY DECREASING
        IN PHI, for both the tightened and the original rule. This is the
        direct consequence of the verified structural fact: M-PH holds the
        pooled means fixed, so the primary-statistic part is phi-invariant,
        while heterogeneity pushes D_4 upward and the dispersion gate
        (c_margin for the tightened rule, c_gate for the original) blocks an
        increasing share. The maximum over the grid is attained at
        phi = 1.0, so a valid bound statement over the disclosed range is:
        P(FM-PLATEAU-CONSISTENT fires | M-PH(phi)) <= 0.17194 for all phi
        on the grid (tightened rule). NOTE for the composition: at phi = 1.0
        the generating process IS the homogeneous plateau truth, so the
        phi = 1.0 entry is the branch's true-positive rate under its own
        null rather than a false positive in the strict sense; the strict
        false-positive entries are phi > 1.0, where they run from 0.15984
        down to 0.11412. Whether this decreasing pattern confirms or
        overturns the Coordinator's prior expectation of a rising rate is
        recorded in the review plan's overturn clause and is flagged here
        rather than resolved: the prior anticipated a rising FPR, and the
        arithmetic under the stated model returns a falling one, because
        OBJ-5-type mean-preserving heterogeneity is detected (partially) by
        the very gate the revision added. The residual false-plateau mass at
        phi = 2.0 is still ~0.114 in absolute terms - the margin conjunct
        REDUCES but does not REMOVE it (it retains 60.0 percent of the
        statistic-only mass at phi = 2.0).
      mc_cross_check_seed_20260904:
        method: >-
          300,000 simulated batches per phi under M-PH, seeded RNG
          (seed 20260904), full cascade evaluated vectorized; this is a
          numeric cross-check of the enumeration, not an experiment arm.
        results:
          - {phi: 1.0, mc_FPR_tightened: 0.1727667, exact: 0.1719399, diff_in_se: 0.9}
          - {phi: 1.25, mc_FPR_tightened: 0.1599467, exact: 0.1598427, diff_in_se: 0.1}
          - {phi: 1.5, mc_FPR_tightened: 0.1453067, exact: 0.1455723, diff_in_se: -0.3}
          - {phi: 1.75, mc_FPR_tightened: 0.1310100, exact: 0.1300556, diff_in_se: 1.0}
          - {phi: 2.0, mc_FPR_tightened: 0.1143900, exact: 0.1141236, diff_in_se: 0.3}
        verdict: all within ~1 binomial SE (SE ~= 0.00091); enumeration confirmed.

    step_E_sr3_satisfiability_homogeneous_null:
      question: Can the tightened Branch-4 conjunct fire at all under the design's own homogeneous null?
      per_point_exact:
        P_D_lt_c_margin: 0.9509484
        P_margin_zone_c_margin_le_D_lt_c_gate: 0.0395198
        P_D_ge_c_gate_branchH_fires: 0.0095317
        chi2_reference: >-
          The chi-squared(3) reference law gives 0.95 / 0.04 / 0.01 by
          construction of the quantiles; the EXACT discrete multinomial law
          at lambda = 16 differs only in the fourth decimal (+0.00095 below
          the margin, -0.00047 in the Branch-H tail). The small-n discrete
          law is well calibrated here.
      joint_both_points:
        P_both_points_D_lt_c_margin: 0.9043029
        P_at_least_one_point_margin_zone_or_worse: 0.0956971
        P_branchH_fires_at_either_point: 0.0189726
      witness_vector:
        counts: [16, 16, 16, 16]
        T: 64
        D: 0.0
        D_lt_c_margin: true
      verdict: >-
        SATISFIABLE AND NOT VACUOUS. The firing region is non-empty (witness
        above), its exact homogeneous-null mass is 0.9043 jointly at the two
        points for the margin conjunct alone, and the FULL tightened
        Branch-4 conjunct fires with probability 0.1719399 under the
        homogeneous plateau truth at the priced exposure - reachable with
        room to spare. The SR-3 conjunct costs about 9.6 percentage points
        of Branch-4 mass under the homogeneous null relative to the
        statistic-only conjuncts (0.1901793 -> 0.1719399, a factor of
        0.9041). The Coordinator prior's worry that 'materially below
        critical' might be vacuous at the design's n is OVERTURNED by the
        arithmetic at n = 4: the margin zone has exact mass 0.0395 per
        point, not 1.0.

    step_F_realized_readings_routing:
      note: >-
        Paper routing of the committed readings through the tightened rule,
        under the three disclosed conventions of FC-3. The k=8 readings
        (13, 18) enter no conjunct (Section 1 item 5, report-only) and are
        not routed. The admissibility preconditions P1-P5 pass on paper for
        all five readings (r=5, k in domain, 2^30, unsaturated, committed
        seeds).
      convention_A_pooled_k4_draws:
        inputs: {T4: 38, n4: 2, T16: 12, n16: 1, pi0_null: 0.6666667, pi_hat: 0.76}
        dispersion: {D4: 0.4210526, D16: 'undefined (n=1, zero residual df)', c_margin_df1: 3.8414588, c_gate_df1: 6.6348966}
        branchH_fires: false
        branch1: {p_k4: 7.5e-35, p_k16: 8.3e-10, fires: false}
        two_sided_test: {p_scipy_oracle: 0.1791022, rejects_at_0.05: false}
        cp_pi_interval: [0.618309, 0.869390]
        rho_interval: [0.8100, 3.3282]
        contained_in_equiv_interval: false
        margin_conjunct: {k4: 'passes (0.421 < 3.8415 at df=1)', k16: 'unevaluably failed (D undefined at n=1)', satisfied_both: false}
        route_tightened_rule: FM-UNRESOLVED
        route_original_rule: FM-UNRESOLVED
        sr3_changed_routing: false
        grounds: >-
          Doubly FM-UNRESOLVED: the ratio interval [0.8100, 3.3282] is not
          contained in [1/1.5, 1.5] (upper bound 3.33 > 1.5), and
          independently the SR-3 conjunct cannot be satisfied at k=16 with a
          single arm (zero residual df - the same arithmetic as SR-7's
          dominated_by argument).
      convention_B_single_draw_17_vs_12:
        inputs: {T4: 17, T16: 12, T: 29, pi0_null: 0.5, pi_hat: 0.5862069}
        two_sided_test: {p_scipy_oracle: 0.4582583, rejects_at_0.05: false}
        cp_pi_interval: [0.389363, 0.764760]
        rho_interval: [0.6376, 3.2510]
        contained_in_equiv_interval: false
        route_tightened_rule: FM-UNRESOLVED
