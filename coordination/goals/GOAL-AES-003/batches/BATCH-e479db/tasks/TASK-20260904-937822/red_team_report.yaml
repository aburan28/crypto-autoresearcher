  # ------------------------------------------------------------------
  # PROVES-TOO-MUCH CONTROL, RUN OBJECT BY OBJECT, TIGHTENED RULE
  # ------------------------------------------------------------------
  proves_too_much_control:
    method: >-
      Independent fresh-code re-derivation in scratchpad scripts (python3 + scipy
      1.18.0 + numpy 2.4.4), never opened by the producer session. Exact
      enumeration over the joint law of the per-point totals (T_4, T_16) using a
      cached minimum-likelihood two-sided conditional-binomial table (validated:
      identical to scipy.stats.binomtest at 1e-12 on 6 probe cells), exact
      Clopper-Pearson intervals via scipy.stats.beta.ppf, exact multinomial gate
      CDFs for the dispersion index under homogeneous truth (Poisson(64) support
      truncated at 200, captured mass 1 - 3.3e-14, matching the producer's
      disclosed convention C12), and exact bimodal gate CDFs for heterogeneous
      objects (sums-of-independent-Poissons decomposition). Routing is computed
      under BOTH conventions: the written cascade order (Section 5.6 of the
      preregistration: "Branch H receives every reading with D_k >= c_gate at
      either point BEFORE any of Branches 1 through 5 is evaluated") and the
      producer's routing-table convention (Branches 1-5 only, Branch H omitted),
      so each producer-claimed probability can be reproduced under its own
      convention and then re-stated under the written order. Monte Carlo (300,000
      draws per phi grid point, seed 20260904, numpy default_rng) for the
      OBJ-5A family where the exact grid is the producer's. Run A (buggy: used
      lambda_plan = 16 as the Branch-1 operative comparator instead of
      lambda_op = 1.0) was discarded for routing; run B corrected it; run B then
      carried a residual bug in the bimodal gate CDF (missing division by the
      point mean m in the dispersion index), caught on post-run code review after
      the run's own internal consistency probe printed a 4.39e-01 disagreement
      that this session initially failed to investigate (disclosed below); run C
      re-ran ONLY the OBJ-5B block with the fix and a self-check (fixed bimodal
      at phi = 1 equals the homogeneous gate CDF to 2.3e-14 over t = 1..59).
    failure_signature_check: >-
      The review_plan's declared failure signature - "a correct tightened rule
      returns 'indistinguishable from comparator' or a halt on the first three
      objects, 'still decaying' on the fourth, and NOT 'PLATEAU-CONSISTENT' on
      the fifth" - is MET on all five named objects under the written cascade
      order. No breaking artifact of the plan's second or third kind was found:
      no null or heterogeneous object receives a floor verdict it should not,
      and Branch 4 is not vacuous. Findings below concern stated ROUTING
      PROBABILITIES and one PROVENANCE passage, not the verdicts.
    objects:
      - id: OBJ-1
        object: The k=0 ramp-zero arm, count 2^30 by construction.
        required_verdict: HALT (not "live floor above comparator")
        producer_claimed_routing: HALT via FM-INADMISSIBLE-INPUT (fails P2 and independently P4)
        independent_check: >-
          CONFIRMED by direct precondition evaluation. k=0 not in {4, 16, 8} =>
          fails P2; hits=2^30, logged=1024, overflow=2^30-1024 => fails P4 under
          the saturation-aware AMEND-1 identity. Statistic-only surrogate
          (preconditions removed): equal huge counts give pi_hat = 0.5 and route
          to the B4-candidate region (-> PLATEAU-CONSISTENT), confirming the
          producer's own disclosure that the preconditions, not the statistic,
          carry this object's correctness.
        status: PASS
      - id: OBJ-2
        object: The r=6 dead anchor at 0 hits, floor absent by construction.
        required_verdict: HALT (not "live floor above comparator")
        producer_claimed_routing: HALT via FM-INADMISSIBLE-INPUT for the floor cascade (fails P1); admissible only to the comparator-setting step
        independent_check: >-
          CONFIRMED. r=6 != 5 fails P1 before any count is examined.
          Statistic-only surrogate (0 vs 64): routes to FM-DECAY-CONTINUES,
          confirming the gate-carried correctness and the producer's disclosure
          that dead-versus-alive is not decay.
        status: PASS
      - id: OBJ-3
        object: Synthetic counts drawn from the analytic null at the proposed exposure (lambda_0 = 1.0, n = 4).
        required_verdict: indistinguishable from comparator, or halt
        producer_claimed_routing: FM-COMPARATOR-INDISTINGUISHABLE
        independent_check: >-
          CONFIRMED as the dominant verdict. Written cascade order (exact):
          FM-COMPARATOR-INDISTINGUISHABLE 0.989349, FM-OVERDISPERSED 0.008843
          (Branch H firing at its own alpha_H level - a legitimate gate event on
          homogeneous draws), FM-DECAY-CONTINUES 0.000449, FM-INVERTED 0.000449,
          FM-UNRESOLVED 0.000909, FM-PLATEAU-CONSISTENT 0.000000 (sum 1.000000).
          Producer convention (Branch H omitted): comparator 0.998170,
          reproducing the predecessor's 0.998170. The branch-1 rejection
          threshold at n=4, lambda_op=1.0 (T >= 12) and its alpha_N calibration
          reproduce. No path from this object to "live floor above comparator"
          or to a plateau sentence was found.
        status: PASS
      - id: OBJ-4
        object: A synthetic still-decaying generator at the preregistered MDE, rho = 2, n = 4.
        required_verdict: still decaying (FM-DECAY-CONTINUES)
        producer_claimed_routing: >-
          "FM-DECAY-CONTINUES with EXACT probability 0.970869" plus residual
          decomposition FM-PLATEAU-CONSISTENT 0.000102, FM-UNRESOLVED 0.029029,
          FM-INVERTED 0.000000 (sums to 1.000000 with no Branch-H mass).
        independent_check: >-
          VERDICT CONFIRMED; STATED PROBABILITY NOT FAITHFUL TO THE WRITTEN
          CASCADE. Under the producer's Branches-1-5-only convention this session
          reproduces 0.970869 / 0.000102 / 0.029029 / 0.000000 to all six digits.
          Under the written cascade order (Branch H first) the exact routing is
          FM-DECAY-CONTINUES 0.952538, FM-OVERDISPERSED 0.018883, FM-UNRESOLVED
          0.028488, FM-PLATEAU-CONSISTENT 0.000091, FM-INVERTED 0.000000 (sum
          1.000000): under decay truth the arms are homogeneous WITHIN each
          point, so Branch H fires at its level (~0.019 at either point) and
          that mass is absent from the producer's table, which is effectively
          conditional on Branch H not firing without saying so. The number
          0.970869 originates in the TASK-20260903-4fdf77 enumeration (same
          convention, verified against that report) and was carried into this
          revision's sr3_remedy.effect.on_the_decay_branch ("Exact decay power
          at rho = 2, n = 4 remains 0.970869") and the design-ladder power claim
          without being reconciled with Section 5.6's ordering. See finding
          RT2-F2. The tightened rule's effect on this object is as claimed in
          direction: false-plateau mass under decay truth shrinks (0.000102
          original -> 0.000091 written order / 0.000093 producer convention) and
          the margin conjunct attaches to Branch 4 only.
        status: PASS (verdict), with finding RT2-F2 on the stated probability
      - id: OBJ-5B
        object: >-
          The review plan's fifth object (producer's variant B): a synthetic
          heterogeneous generator with per-seed rates inside phi = 1.0 to 2.0
          and true per-point arithmetic mean AT THE ANALYTIC COMPARATOR
          lambda_0 = 1.0 at both points, where PLATEAU-CONSISTENT is known false.
        required_verdict: comparator-indistinguishable or halt; NEVER FM-PLATEAU-CONSISTENT
        producer_claimed_routing: >-
          "FM-COMPARATOR-INDISTINGUISHABLE with EXACT probability 0.9981704
          (invariant to the heterogeneity: the marginal totals remain Poisson(4)
          per point...)"; residual 1.8296e-3 split over DECAY/INVERTED/UNRESOLVED;
          "mass reaching Branch 4's STATISTICAL conjuncts is at most 2.133e-77".
        independent_check: >-
          REQUIRED VERDICT CONFIRMED; INVARIANCE CLAIM NOT FAITHFUL TO THE
          WRITTEN CASCADE. (1) The producer's 0.9981704 reproduces EXACTLY under
          the Branches-1-5-only convention at every phi tested (1.0, 1.25, 1.5,
          2.0) - the Poisson-sum identity (T_k ~ Poisson(4) exactly for every
          phi) is correct and makes Branch-1's marginal invariant. (2) But the
          written cascade evaluates Branch H first, and the dispersion index D_k
          is NOT a function of the marginal totals - it reads the within-point
          arm-level spread, which heterogeneity inflates. Corrected exact
          enumeration (run C; this session's run-B version of this block carried
          a missing /m bug, disclosed below): under the written order with the
          bimodal split applied at both points (the producer text says "at both
          points" for the mean but does not state which point carries the split
          - see finding RT2-F4), FM-OVERDISPERSED rises from 0.008843 (phi=1.0,
          where the object coincides with the homogeneous OBJ-3 reference and my
          routing matches it exactly) through 0.028648 (phi=1.25), 0.052924
          (phi=1.5), to 0.115764 (phi=2.0), with comparator mass falling from
          0.989349 to 0.884236. The routing is therefore NOT invariant in phi
          under the written order; the parenthetical justification conflates
          Branch-1 marginal invariance (true) with cascade-routing invariance
          (false). This UNDER-reports the gate's power - Branch H catches 11.6%
          of the phi=2.0 null-mean family - it does not create a plateau path.
          (3) Never-plateau holds robustly: FM-PLATEAU-CONSISTENT mass is
          0.000000 at all four phi grid points under both conventions; my
          enumeration finds the containment region empty within T <= 59 per
          point, consistent with the producer's 2.133e-77 bound, because at
          lambda_0 = 1 the equivalence interval can be contained only at
          per-point totals of order 96 or more (P(Poisson(8) >= 96) is
          astronomically small), and the gate factor can only shrink that mass
          further.
        status: PASS (required verdict), with findings RT2-F2 (convention) and RT2-F4 (ambiguity)
      - id: OBJ-5A
        object: >-
          NOT one of the five plan-named objects; the producer's variant A, the
          SR-2 calibration target: heterogeneous k=4 (two arms at 16-d, two at
          16+d, d = sqrt(16(phi-1))), k=16 homogeneous, per-point arithmetic
          mean held at lambda_plan = 16, where PLATEAU-CONSISTENT is known false.
          Routed here as the attack plan's floor-not-ceiling and because it is
          the object against which the SR-2 bound is calibrated.
        required_verdict: >-
          No clean single verdict exists; the revision's own declared expectation
          is PARTIAL BY DESIGN - the tightened rule still composes a false
          PLATEAU sentence at a quantified, disclosed, bounded rate.
        independent_check: >-
          Monte Carlo routing (300,000 draws per phi, seed 20260904, written
          cascade order, D computed with the correct /m): FM-PLATEAU-CONSISTENT
          under the tightened rule = 0.1130 (phi=2.0), 0.1460 (phi=1.5), 0.1599
          (phi=1.25), 0.1714 (phi=1.0), against the producer's exact
          0.114124 / 0.145572 / 0.159843 / 0.171940 - all within 2 Monte Carlo
          standard errors (se about 0.0006-0.0007 at 300k draws). Branch H
          capture at either point 0.1658 at phi=2.0, consistent with the
          producer's exact k=4-only gate-catch 0.157530 plus the homogeneous
          k=16 point's ~0.0095 level. The false-positive rate is NON-INCREASING
          in phi, independently corroborating the producer's monotonicity claim
          and overturning the coordinator prior's rising-with-phi expectation:
          the Poisson-sum identity keeps the primary statistic's marginal law
          exactly Poisson(64) at both points for every phi, so heterogeneity can
          enter Branch 4 only through missed homogeneity gates, and the gate
          catches more as phi grows. The residual is real: the tightened rule
          still proves too much on THIS family at an 11-17% rate. That is the
          disclosed SR-2 bound, not a new break - but it means "bounded" must
          not be read as "small" or "removed", and every composed plateau
          sentence must carry it, as the preregistration's Branch-4 licensing
          text requires.
        status: PARTIAL BY DESIGN (producer's own declared status), independently corroborated

  # ------------------------------------------------------------------
  # VACUOUS-ADMISSIBILITY CHECK (SR-3, coordinator prior horn 1)
  # ------------------------------------------------------------------
  vacuous_admissibility_check:
    construction: >-
      Homogeneous null at the design's own truth: n = 4 iid Poisson(16) arms per
      primary point (lambda_plan = 16), per-point totals T_k ~ Poisson(64),
      exact multinomial distribution of the dispersion index D_k conditional on
      each total t, support t = 0..200 (captured mass 1 - 3.3e-14), D := 0 at
      t = 0 per the producer's disclosed convention C12, strict inequalities
      throughout. The margin conjunct fires iff D_k < c_margin at both points;
      Branch 4 additionally requires Branch-1 non-firing, non-rejection of
      pi = 0.5, and equivalence containment.
    independent_exact_arithmetic:
      c_gate_chi2_0.99_df3: 11.344867
      c_margin_chi2_0.95_df3: 7.814728
      margin_ratio: 0.688834
      per_point_P_D_below_c_margin_under_null: 0.950948
      per_point_P_D_below_c_gate_under_null: 0.990468
      joint_margin_pass_both_points: 0.904303
      margin_zone_mass_per_point: 0.039520
      p_stat_nonreject_and_containment: 0.190179
      branch4_firing_under_true_plateau_tightened: 0.171940
      branch4_firing_under_true_plateau_original: 0.186556
      agreement_with_producer: >-
        Every value above reproduces the producer's sr3_remedy arithmetic to all
        six reported digits under independent fresh-code enumeration. The
        chi-square reference's nominal 0.95 becomes exact 0.950948 under the
        true multinomial law (approximation error +0.000948), as the producer
        states.
    result: >-
      NOT VACUOUS. The tightened Branch-4 conjunct fires with probability
      0.171940 under the design's own homogeneous plateau truth - strictly
      positive, quantified, and only 7.83% below the original rule's 0.186556.
      The per-point admissibility credential is satisfiable (0.950948), the
      joint credential is satisfiable (0.904303), and the margin zone demoted
      to FM-UNRESOLVED has exact mass 0.039520 per point. A Branch 4 that can
      never fire would be a different design; this is not that design. The
      first horn of the coordinator prior ("may be vacuous - never fires under
      the homogeneous null") is REFUTED by exact arithmetic, independently
      reproduced here.
    second_horn_uncheckability: >-
      The second horn ("or uncheckable - cannot be distinguished from noise")
      is answered, as the producer answers it, by concession rather than
      evasion: at n = 4 no conjunct can distinguish phi = 1 from phi = 1 +
      epsilon, and the margin conjunct's per-point admissibility is saturated
      by construction near phi = 1 (caveat C11 states this plainly). That
      irreducible residual is exactly what the disclosed 0.171940 bound
      quantifies. This session finds no way around the concession and does not
      claim one.

  # ------------------------------------------------------------------
  # SR-3 ADEQUACY ASSESSMENT
  # ------------------------------------------------------------------
  sr3_adequacy:
    what_the_remedy_does: >-
      Option (a), the tightened conjunct, at zero arms: (i) converts the
      unquantified OBJ-5-class false-plateau risk into a quantified, disclosed,
      monotone bound (0.171940 range-wide, tight at phi -> 1+; 0.114124 at
      phi = 2.0; non-increasing across the grid - independently corroborated by
      this session's Monte Carlo); (ii) makes Branch-4 admissibility require
      AFFIRMATIVE homogeneity evidence (D_k below the 0.95 null quantile at
      both points) rather than mere failure to reject at alpha_H = 0.01;
      (iii) routes margin-zone readings (c_margin <= D_k < c_gate) to
      FM-UNRESOLVED, preserving pre-arm determinism, mutual exclusivity and
      exhaustiveness - this session's exact routing sums to 1.000000 in every
      case computed, and no new branch is created; (iv) leaves the decay branch
      untouched in structure (the margin attaches to Branch 4 only) and shrinks
      its false-plateau mass under decay truth; (v) costs 7.83% of the
      true-plateau firing rate, quantified. Option (b), raised n, was declined
      with arithmetic (gate power against phi = 2.0 only ~0.36 at n = 10, ~0.86
      at n = 40, while raised n simultaneously raises the phi -> 1+ baseline);
      the decline is plausible and internally consistent, though this session
      did not re-derive the ncx2 power figures (that arithmetic sits closer to
      joint J-R1's territory and was not attacked here).
    adequacy_assessment: >-
      ADEQUATE AS A BOUND, NOT AS A REMOVAL - and the package says exactly that
      (what_the_remedy_does_not_do: "It does NOT make FM-PLATEAU-CONSISTENT
      safe-for-all-phi"). Whether a standing 11-17% false-plateau rate on the
      calibration family is an ACCEPTABLE price for composing plateau sentences
      that carry the bound as a mandatory disclosure is the trade the
      coordinator prior anticipated ("whichever it is, that trade is the
      revision's real content") and is a Coordinator adoption decision, not a
      red-team verdict. This session's position on joint J-R2: the remedy is
      non-vacuous, pre-arm, decidable, disclosed, and correctly scoped; the
      residual it leaves is quantified and honest; the findings below concern
      the package's WORDING and ROUTING-TABLE fidelity, not the remedy's
      substance.

  # ------------------------------------------------------------------
  # ATTACK: MARGIN PROVENANCE (attack plan's named expected break point)
  # ------------------------------------------------------------------
  margin_provenance_attack:
    finding_id: RT2-F1
    severity: REVISE (wording), not verdict-breaking
    target: >-
      pooled-exposure-pricing.json sr3_remedy.conjunct.
      margin_rationale_preregistered_from_the_null_law, echoed in
      design-revision.yaml sr3_remedy_statement.margin_rationale_pointer.
    what_the_passage_claims: >-
      "The 95th percentile of the null reference law is chosen because it is
      the LARGEST threshold defined purely from the null law (a level quantile;
      no free tuning parameter is introduced and nothing in the choice consults
      OBJ-5, the red-team report, or any realized reading)."
    what_this_session_found: >-
      (1) The superlative is FALSE as written: chi2_0.975(3) = 9.348404 is also
      a level quantile defined purely from the null law, is strictly LARGER than
      c_margin = 7.814728, and still lies below the gate c_gate = 11.344867;
      chi2_0.90(3) = 6.251389 is a smaller alternative. The 0.95 level is one
      of at least three conventional null-law quantiles sitting strictly between
      nothing and the gate, so "the largest threshold defined purely from the
      null law" is not a description of it under any natural reading (if
      "defined purely from the null law and below the gate" were the criterion,
      the supremum would be the gate itself). (2) "No free tuning parameter is
      introduced" elides the one parameter that WAS chosen: the level q. The
      threshold value 7.814728 is indeed a named quantile with no realized
      reading inside it - that part holds - but q = 0.95 was selected from a
      continuum of null-law-only options, and the passage presents that choice
      as forced. (3) "Nothing in the choice consults OBJ-5" is true in the
      narrow numerical sense (no OBJ-5 outcome enters the threshold formula)
      but misleading as stated: the remedy ITSELF (option a over option b) was
      chosen by comparing false-positive outcomes on the OBJ-5 calibration
      family - the package's own option_not_chosen_disclosure says so - and the
      size of the FP reduction the package advertises (0.157206 -> 0.114124 at
      phi = 2.0) depends on the chosen level. The honest statement is: the
      threshold is a pre-arm named null-law quantile, no realized reading or
      OBJ-5 outcome enters its numeric value, and the LEVEL (0.95, the
      conventional level matching the primary test's alpha family) was chosen
      in the revision session that had the OBJ-5 break in view.
    what_survives_the_attack: >-
      The substantive pre-registration requirements survive: the threshold is
      fixed pre-arm, is a named quantile of the null reference law, consults no
      realized reading numerically (verified: 7.814728 = scipy chi2.ppf(0.95, 3)
      exactly), and was not moved post-data. The attack lands on the
      justification's uniqueness rhetoric, not on the conjunct. Repair: rewrite
      the rationale to drop "largest", name the level choice as a conventional
      one among {0.90, 0.95, 0.975} below the gate, and disclose that the
      level was fixed in the revision session with the OBJ-5 calibration
      arithmetic in view.

  # ------------------------------------------------------------------
  # ATTACK: CONTROL-OBJECT ROUTING-TABLE FIDELITY (found beyond the prior)
  # ------------------------------------------------------------------
  routing_fidelity_attack:
    finding_id: RT2-F2
    severity: REVISE (probability statements), not verdict-breaking
    target: >-
      pooled-exposure-pricing.json proves_too_much_routing.objects (OBJ-4's
      "EXACT probability 0.970869" with a residual decomposition summing to
      1.000000 and no Branch-H mass; OBJ-5B's "EXACT probability 0.9981704,
      invariant to the heterogeneity"), and the reuse of 0.970869 in
      sr3_remedy.effect.on_the_decay_branch and in the design-ladder power
      claim ("Meets the preregistered MDE rho_1 = 2 at 0.970869 EXACT power").
    what_this_session_found: >-
      These probabilities are computed under a Branches-1-5-only convention
      that omits Branch H, while the written cascade (preregistration Section
      5.6) evaluates Branch H BEFORE any of Branches 1 through 5. Exact
      re-enumeration under the written order: OBJ-4's decay power is 0.952538
      with 0.018883 of the mass at FM-OVERDISPERSED (Branch H firing at its own
      level on within-point-homogeneous decay-truth draws); OBJ-5B's comparator
      routing falls from 0.989349 to 0.884236 as phi runs 1.0 -> 2.0 while
      FM-OVERDISPERSED rises from 0.008843 to 0.115764. The producer's numbers
      reproduce EXACTLY under their own convention (this session verified both),
      so there is no arithmetic error - but the convention is never stated, the
      word "EXACT" is used, and OBJ-5B's parenthetical proof of invariance
      (marginal totals remain Poisson(4)) is valid only for Branch-1's
      statistic, not for D_k. The 0.970869 figure is inherited from the
      TASK-20260903-4fdf77 enumeration (that report's OBJ-4 table shows the
      same Branch-H-free convention and the same six digits) and was never
      reconciled with Section 5.6's ordering in either generation. Direction of
      the error: the table UNDER-reports the homogeneity gate's power (it
      catches real heterogeneity mass the table assigns to the comparator) and
      OVER-states the decay branch's unconditional verdict probability by about
      1.9 points. No verdict changes; every required signature still holds
      under the written order.
    repair: >-
      Either restate the control-object probabilities under the written cascade
      order (numbers supplied above) or label them explicitly "conditional on
      Branch H not firing (Branches 1-5 only)", and propagate the restated
      decay power to sr3_remedy.effect.on_the_decay_branch and the design
      ladder.

  # ------------------------------------------------------------------
