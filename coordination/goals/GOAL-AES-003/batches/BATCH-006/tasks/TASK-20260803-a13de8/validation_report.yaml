  # ------------------------------------------------------------------
  limitations:
    - >-
      TOY TIER. Everything verified here is scoped to a software T-table AES-128
      permutation reduced to r in {2,3,4,5,6} with the full FIPS-197 key
      schedule; the (amask, smask) geometries actually run; the key blocks
      431001, 531001, 631001 and my two extra probe seeds; at most 2^31 trials
      per arm; and the S-boxes actually drawn. NOTHING here speaks to full-round
      or deployed AES, and no comparison to published cryptanalysis is made in
      either direction.
    - >-
      The RC-8 bound is conditional on ONE key block and one plaintext stream. It
      is not marginalised over keys and must not be quoted as if it were. Its
      i.i.d. assumption is the weakest link and the shared key block is the
      reason.
    - >-
      27 draws out of 256! bijections bound a fraction. They say nothing about
      structure.
    - >-
      My implementation shares the producer's PRNG stream, key derivation and
      trial split by design. Independence is of the cipher, the inverse cipher,
      the geometry and the statistic -- not of the randomness source. A defect in
      splitmix64 or in the seed derivation would be invisible to both of us.
    - >-
      The executed binary is not hash-bound by the archive; only its source and a
      recorded digest are. See artifact_checks.
    - >-
      The archive is hash-bound but NOT dispatcher-verified. Under AGENTS rule 7
      anything derived from it is published but not official, and this report
      inherits that status.
    - >-
      Session-independent, NOT model-independent. Nothing here counts toward a
      closure quorum.

