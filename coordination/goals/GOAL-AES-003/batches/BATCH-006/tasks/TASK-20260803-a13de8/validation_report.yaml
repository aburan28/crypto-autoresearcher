        reproduced it a third time. A rare-event count agreeing to the unit
        across three implementations and two sessions is a much stronger
        statement about instrument correctness than any of the saturated arms,
        and it appears as observation 3 of 3 rather than as a headline.
      - >-
        A5-R4-R1-K1 shows the r=4 saturation holds under a drawn, non-AES S-box.
        The producer labelled it exploratory and did not feature it, but it is
        the single arm that shows the r=4 structure is not a property of the AES
        S-box. I confirmed it at prefix scope. It deserves more weight than
        "exploratory profile fill" gives it.
      - >-
        ZERO DEAD among 27 draws is a stronger negative-result statement than the
        ALIVE count conveys. The two non-ALIVE draws are INDETERMINATE, both
        above the null (X=6 and X=9 against v=1.0), not at it. Under the
        governing rule they cannot be counted as preserving, but "25 alive, 2
