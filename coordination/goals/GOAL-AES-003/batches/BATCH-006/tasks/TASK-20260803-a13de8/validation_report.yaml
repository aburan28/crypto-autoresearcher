  # ------------------------------------------------------------------
  scaled_down_ladder_checks:
    applicability: >-
      docs/inventor-protocol.md section 6 governs claims of an improvement that
      cannot be executed at the scale where it would matter. THIS BATCH MAKES NO
      SUCH CLAIM. It claims no speedup, no complexity improvement, no attack, and
      no advantage over any baseline. It reports counting statistics on a
      reduced-round toy object and explicitly declares no hypothesis supported,
      rejected or closed.
    consequence: >-
      The step-2 requirement (measured ratio against a baseline on a scaled-down
      instance of the same shape) has no referent here and its absence is NOT a
      failure. I record this explicitly so that the absence of ladder evidence is
      not later read as an unmet obligation, and equally so that no reader takes
      this batch as evidence of a speedup. It is not, and does not claim to be.
    reproducibility_pointer_exercised: >-
      YES, and this is the part of the ladder that does apply. I did not accept
      the reproduction instructions as asserted. I rebuilt the measurement from
      the committed source specification with my own implementation, rebuilt the
      27 S-box tables from their seeds in a second language, and re-executed four
      arms to completion (2^31 + 2^30 + 2^24 + 2^20 trials) plus ten control
      arms. Artifacts rebuilt and listed, not asserted.

  heuristic_validation_checks:
    applicability: >-
      NOT APPLICABLE. This batch validates no analytic heuristic in the exemplar
      style of docs/target-result-profile.md: there is no Dickman-de Bruijn style
      pre-registered distributional prediction, no correspondence substituting
      for direct sampling, and no smoothness or tail statistic.
    the_one_modelled_quantity: >-
      The single modelled input is the PRP null P(W>=1) ~ 4*2^-32. It is
      pre-registered (it is compiled into the instrument at yoyo_sbox_v2.c line
      28 and was fixed in BATCH-002, long before these samples), and it has been
      checked against measurement -- see CTRL-6. Its residual +/-31% uncertainty
      is carried explicitly into the excess factors by the producer. This
      satisfies the pre-registration and sample-integrity requirements to the
      extent they apply.
    sampling_integrity: >-
      Sample sizes, all arm seeds, all S-box seeds, thread counts and the trial
      split are in the manifest and in each arm's own JSON. Every statistic in
      this report was recomputed from raw per-arm counts, never copied from the
      producer's tables.

  cost_model_checks:
    applicability: >-
      NO CONCRETE COST TABLE IS PRESENTED by this batch -- no field-operation
      count, no attack cost, no time-memory tradeoff, no success probability
      inversion. There is therefore nothing to check for unit honesty or for
      per-attempt-cost x inverse-success-probability bookkeeping.
    resource_records:
      - >-
        Wall times are recorded per arm and declared as measured under 2-way
        concurrency for Section B, not compared to prior batches' sequential
        timings. Correct handling of a real confound.
      - >-
        PEAK RSS WAS NOT SAMPLED. RESULTS.json says so and gives the reason (no
        /usr/bin/time on the image) and an argument that allocation is well under
        1 MB. Reading the source, the per-arm allocation is 256-entry tables,
        eight 256-entry uint32 T-tables and a small per-thread job struct, so the
        argument is sound, but the 8 GB memory cap is unmeasured rather than
        measured. Recorded as a gap, not a fabrication -- the missing datum stays
        missing and is reported as such.
      - >-
        The RC-8 mispricing recorded in CORR-20260803-9a67de is now settled by
        measurement: the 28 Section B arms plus 28 pins completed in 2584 s of
        the section, against the "75 minutes each" that got the control declined
