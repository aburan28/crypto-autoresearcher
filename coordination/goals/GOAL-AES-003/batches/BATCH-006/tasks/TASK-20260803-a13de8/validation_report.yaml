  # ------------------------------------------------------------------
  rulings_on_the_assigned_questions:

    - priority: 1a
      question: >-
        Is 2^30 the arithmetic ceiling of this statistic rather than an effect
        size?
      ruling: CONFIRMED -- and it should never be quoted as a magnitude.
      basis: >-
        The excess factor is defined as X / (nontrivial_trials * 4 * 2^-32),
        which is identically (hit rate) * 2^30. The hit rate is a probability and
        cannot exceed 1. Therefore the excess factor cannot exceed 2^30 =
        1073741824, and it attains that value if and only if the rate is exactly
        1.0. A1, A2, A3, A4 and A5 all report exactly 1073741824 (A3 reports
        1073741823.976, which is the same ceiling with the analytic null rounded
        to 7 digits in the emitted JSON -- I checked that this is a print
        artifact, not a sub-ceiling reading).
        "Excess 2^30" is therefore a restatement of the null model's assumed
        per-trial probability, and carries NO information about how large the
        r=4 effect is. It is a saturation artifact. The correct statement is
        "rate 1.0, i.e. the statistic is deterministic at r=4 at this geometry".
        A deterministic event compared against a probabilistic null is a category
        difference, not a large effect size, and the ratio 2^30 would be
        identical for any deterministic property whatever.
        I agree with the task card's framing and state it plainly.
      note_in_the_producers_favour: >-
        The producer said exactly this itself, unprompted, in
        observations_not_interpretation[1]: "the ARITHMETIC MAXIMUM ... a
        saturation ceiling, not an unbounded effect size, and must not be read as
        '2^30 times stronger than r=5' in any extrapolative sense." It did not
        need to be caught on this.

    - priority: 1b
      question: Is the pairing real?
      ruling: CONFIRMED, checked field by field from the raw artifacts.
      basis: >-
        I loaded BATCH-004 runs/Y-AES-main.json, runs/Y-AES-main-r6.json,
        BATCH-005 runs/D-AES-K1.json and BATCH-006 runs/A1-R4-MAIN.json,
        runs/A2-R4-K1.json, runs/A0-REPRO-R5-K1.json directly and compared the
        emitted fields myself rather than reading the producer's
        pairing_verification block.
        A1 vs Y-AES-main and vs Y-AES-main-r6: sbox_spec aes, sbox_seed 0,
        sbox_first8, amask 1, smask 1, trials 2147483648, log2N 31, seed 431001,
        arm_id 1, threads 2, key_hex 25b3faa13dbaeaab5491571199979d53,
        thread_seeds [11400714758318102301, 4354685486758105890] -- all equal.
        Only `rounds` differs (4 vs 5, 4 vs 6).
        A2 and A0 vs D-AES-K1: all of the above equal with key_hex
        bdf3823182ad657dab3d556b3886ba72 and thread_seeds
        [11400714758317678269, 4354685486758533762]. Only `rounds` differs for
        A2; A0 matches on rounds too, being the reproduction control.
        I additionally reproduced key_hex and thread_seeds from the seed in my
        own implementation, so the emitted values are not merely equal to each
        other but equal to what the documented derivation produces.
        The structural argument holds independently: key state is
        seed ^ 0xA5A5A5A5A5A5A5A5, thread seed is
        seed ^ armid*0x1234567891 ^ (t+1)*0x9E3779B97F4A7C15, and the plaintext
        pair is drawn from the thread state before any encryption call. None of
        these reads `rounds`.
      one_field_that_differs_and_should: >-
        trivial_swaps_excluded is 0 for A1 and 2 for Y-AES-main-r6. That is an
        OUTPUT of the measurement (a swap is trivial when the swapped ciphertext
        bytes already agree, which depends on the round count), not an input, so
        it does not weaken the pairing. The producer's field list correctly
        contains inputs only.

    - priority: 1c
      question: >-
        Is the profile monotone decreasing and saturated at r <= 4, so that r=5
        is not a peak but the last sub-saturated above-null round count?
      ruling: >-
        CONFIRMED as to the two substantive parts. The Coordinator queue's "peak
        at r=5" is REFUTED. One word of the producer's phrasing is OVERSTATED.
      basis: >-
        Measured on this instrument, at amask=1 smask=1, with r=5 and r=6 taken
        from the paired prior arms:
        r=2 rate 1.0 (ceiling), r=3 rate 1.0 (ceiling), r=4 rate 1.0 (ceiling,
        confirmed by me at full 2^31), r=5 excess 13.5x with exact 95% interval
        [8.90, 19.64] and 14.0x at the other key block, r=6 excess 0.5x (X=1
        against v=2.0).
        The r=5 interval [8.90, 19.64] excludes both the ceiling above and the
        null below. So the ordering r<=4 saturated > r=5 above null > r=6 at or
        below null holds, and there is no round count at which the statistic is
        higher than at r=4. "Peak at r=5" is refuted: a peak requires a lower
        reading on the low side, and there is none.
        "r=5 is the last round count with a sub-saturated, above-null reading" is
        correct on the measured set {2,3,4,5,6,10}.
      the_overstated_word: >-
        MONOTONE. The measured sequence is not monotone decreasing. Taking the
        campaign's own readings: r=6 reads 0.5x (BATCH-004, X=1) and r=10 reads
        0.75x and 1.63x (BATCH-001) and pooled 0.75 (BATCH-002 arm_A3/A3b, 12
        observed vs 16.0 expected). r=10 is not below r=6. What is true is that
        the sequence is non-increasing down to the null and then fluctuates
        AROUND the null, which is exactly what a dead statistic should do and is
        not a violation of anything. "Monotone decreasing" is a stronger claim
        than the data support and should be stated as "decreasing to the null by
        r=6 and consistent with the null at r=6 and r=10".
        This is a wording defect, not a reading defect, and it does not affect
        the refutation of "peak at r=5".
      what_this_does_NOT_establish: >-
        Nothing about round counts outside {2,3,4,5,6,10}, other (amask, smask)
        geometries, other key blocks, other S-boxes, or full-round AES.

    - priority: 2
      question: Which liveness criterion governs, and what bound follows?
      ruling: >-
        THE STRICT BATCH-004 RULE GOVERNS. The bound that follows is 0.7847
        unpooled and 0.7984 pooled. THE 0.90 TARGET IS NOT MET.
      basis: >-
        The campaign froze ONE liveness criterion, not two. BATCH-004's
        PREREGISTRATION, lines 236-239, freezes a three-outcome rule: ALIVE iff
        X/v >= 5 AND P(K>=X|lambda=v) < 1e-6; DEAD iff X/v <= 2.5 AND
        P(K<=X|lambda=15.63v) < 1e-3; otherwise INDETERMINATE.
        BATCH-005's T5 is NOT an independently frozen alternative. Its own text,
        at line 132, reads: "T5 -- per-arm liveness. BATCH-004's frozen rule:
        excess factor >= 5x is ALIVE." It presents itself as a QUOTATION of
        BATCH-004 and drops the Poisson conjunct in the act of quoting. A
        defective restatement of a frozen rule does not create a second frozen
        rule; it creates an error in BATCH-005. Choosing it now, after seeing
        that it is the one that reaches the target, would be selecting the
        criterion on the data.
        Under the governing rule, 25 of 27 draws are ALIVE. Exact binomial
        one-sided 95% lower bound: p_lo = 0.784700. Pooled with the two prior
        draws, both of which I verified qualify under the same strict rule:
        27 of 29, p_lo = 0.798439.
      on_the_third_reading: >-
        The producer's "reading 2", preserving means NOT DEAD, gives 27/27 and
        0.8950 (29/29 and 0.9019 pooled). It is not the frozen criterion and was
        not frozen anywhere before this batch; it was constructed in this task.
        It should not govern. It is a legitimate observation -- see below -- but
        not a basis for the campaign's scoping bound.
      the_honest_summary_line: >-
        The campaign's central scoping figure moves from 0.224 to 0.7847
        (0.7984 pooled) under the criterion the campaign actually froze. That is
        a large and real improvement -- it is the difference between "at least a
        fifth of bijections" and "at least four fifths" -- and it is NOT the 0.90
        the campaign named as its target. Reporting 0.90 here would require
        either a criterion the campaign did not freeze or a definition of
        "preserving" invented after the counts were seen. Do not paper over it:
        the target was missed, by two draws.
      what_would_reach_it: >-
        Not my call to recommend, but stated as arithmetic since the question was
        asked: under the governing rule, 0.90 needs k=n=29, i.e. the two
        INDETERMINATE draws resolved ALIVE. Both sit above the null (X=6 and X=9
        against v=1.0) and below the X>=10 the Poisson conjunct forces at 2^30.
        Re-running those two draws at 2^31 would double v to 2.0, where the
        ALIVE threshold in ratio terms is unchanged but the Poisson conjunct is
        far easier to clear; whether they then read ALIVE is exactly the open
        question and I do not predict it.
      scope_limits_that_survive_either_reading: >-
        All 27 draws share ONE key block (arm seed 631001) and one plaintext
        stream. p is bounded at that key block, at r=5, at 2^30 exposure, at
        amask=1 smask=1. The Clopper-Pearson bound assumes the draws are i.i.d.
        Bernoulli in ALIVE/not-ALIVE; the shared key block is the assumption most
        likely to be violated, and the producer says so. The bound is not
        marginalised over keys and must not be quoted as if it were.

    - priority: 3a
      question: >-
        Do r=3 and r=4 arms already exist in BATCH-001/tasks/yoyo5/analysis.json,
        and is the producer's narrower surviving claim right?
      ruling: CONFIRMED on both counts.
      basis: >-
        I opened the file. Entries 1 and 2 are rounds 3 and rounds 4, amask 1,
        smask 1, trials 4294967296, seed 20260802, W_ge1_nontrivial 4294967296,
        excess_factor 1073741824.0, whist [0,0,0,4294967296,0]. summary.txt
        tabulates them in plain text. A second r=4 arm at 2^33 under seed
        88881111 is also present. So the low side of the profile was measured on
        2026-08-02 and read saturated, and the dispatch queue's assertion that
        the instrument has only ever run at r in {2,5,6,10} is FALSE.
        I then ran the search myself rather than accepting the producer's:
        walked the whole repository, found 106 files containing W_ge1 / W>=1 /
        wge1, extracted every "rounds": <n>, and tabulated. Outside BATCH-006,
        rounds 3 and 4 appear in exactly two files, both
        BATCH-001/tasks/yoyo5/ (analysis.json and analysis_seed1.json), and
        rounds 2 in BATCH-002 (RESULTS.json, arm_PC.json). I also tabulated
        rounds per batch over every object carrying a W_ge1_nontrivial field:
        BATCH-002 {2,5,6,10}, BATCH-003 {}, BATCH-004 {5,6}, BATCH-005 {5}.
        This independently confirms the producer's surviving claims that
        yoyo_sbox_v2 had run only at r in {5,6} and that BATCH-002's probe.c had
        run only at r in {2,5,6,10}.

    - priority: 3b
      question: >-
        Do the PRODUCER's own absence claims meet the CORR-20260803-c92db5 bar?
      ruling: MIXED. Two of its absence claims are sound. One is OVERSTATED.
      sound:
        - claim: "yoyo_sbox_v2 has only ever run at r in {5,6}; probe.c only at r in {2,5,6,10}"
          status: CONFIRMED
          why: >-
            Paths and commands named in RESULTS.json.repository_search
            (grep -rl W_ge1 over coordination ledger knowledge docs experiments,
            103 files enumerated in the artifact, plus a repository-wide grep for
            rounds 3 and 4). I reproduced the search independently and got the
            same answer. This meets the bar exactly.
        - claim: "no r=4 arm has ever been run under a non-AES S-box"
          status: CONFIRMED
          why: >-
            The only prior r=4 arms are BATCH-001's, on yoyo2.c, which is AES-NI
            and hardwires the S-box in silicon -- the substitution is not
            expressible there. No other instrument ran r=4. The claim follows.
        - claim: "arm seed 631001 and S-box seeds 202608037xx appear nowhere else"
          status: CONFIRMED
          why: I re-ran the greps; both return nothing outside this task.
      overstated:
        - claim: "no r=4 arm has ever been PAIRED to an r=5 arm on key and stream"
          status: OVERSTATED -- not established, and contradicted on the best
            available reading of the artifacts the producer itself tabulated.
          why: >-
            BATCH-001's r=4 and r=5 arms at master seed 20260802 share seed,
            trial count 2^32, amask 1 and smask 1. In yoyo2.c the per-thread
            state is seed ^ 0xA5A5A5A5A5A5A5A5*(t+1) and the plaintext pair is
            drawn from that state before any encryption; `rounds` enters only
            inside the AES-NI round loop. BATCH-001's PREREGISTRATION line 247
            states "Master seed 20260802. All keys, plaintexts and per-trial
            randomness ... derived from it." The same second r=4/r=5 pairing
            exists at seed 88881111.
            By precisely the structural argument the producer uses to justify its
            OWN pairing, BATCH-001's r=4 and r=5 arms are already paired on key
            and stream.
            More decisively for the CORR-c92db5 bar: the producer named no search
            for this sub-claim at all. It named paths for the ROUND-COUNT absence
            claim, and then attached the pairing sub-claim to the same bullet
            without evidence. That is the failure mode the correction was written
            about, in miniature and in the producer's own report -- three
            paragraphs after it correctly caught the Coordinator committing it.
          what_i_could_NOT_establish: >-
            BATCH-001's analysis.json does not record a key_hex or the key
            argument passed to yoyo2.c, and no command log survives in that task
            directory. So I cannot verify the pairing from emitted fields the way
            I verified BATCH-006's. The honest status is NOT ESTABLISHED IN
            EITHER DIRECTION, which is itself enough to make the producer's
            unqualified negative wrong.
          what_would_have_been_correct: >-
            "No r=4 arm has previously been paired to an r=5 arm with the pairing
            VERIFIED from emitted per-arm key and thread-seed fields, and none on
            this instrument." That is true, checkable, and materially weaker.
          materiality: >-
            LOW for the batch's conclusions. The r=4 reading stands on its own
            re-measured counts and does not depend on being the first paired one.
            The defect is in the novelty framing, not the measurement.

    - priority: 4
      question: >-
        Is whist = [0,0,0,N,0] at r <= 4, with the active word never preserved, a
        genuine structural fact or an artifact of how W is counted?
      ruling: GENUINE, and I extend the statement. It is UNEXPLAINED.
      basis: >-
        Verified by full re-execution at 2^31 (r=4), 2^30 (r=4, second key
        block), full 2^24 (r=3) and full 2^20 (r=2): whist[3] = N and every other
        bin 0, on every trial, with no exception in 2^31 + 2^30 + 2^24 + 2^20
        trials. W is never 4, so the active word is never preserved; W is never
        2, 1 or 0, so the other three always are.
        NOT an artifact of the counting: CTRL-1 shows that destroying the coset
        structure (amask=15) at the same round count drives the statistic to
        W=0 on every trial. A counting artifact would not switch off when only
        the input geometry changes.
        Extension the producer did not make (CTRL-2): the never-preserved index
        is the ACTIVE word, not the index 0. At amask=2 the pattern is
        [N,0,N,N]; at amask=4 it is [N,N,0,N]. It is insensitive to smask
        (tested 1, 2, 4) and to the key block (tested 4 arm seeds).
        Also holds under a drawn, non-AES S-box (A5 and my prefix re-run), so it
        is not a property of the AES S-box.
        Also present on the OTHER instrument: BATCH-001's yoyo2.c, AES-NI, r=3
        and r=4, records whist [0,0,0,4294967296,0] -- the identical pattern,
        from a different implementation of the same object, a day earlier. Two
        independent instruments and now a third (mine) agree.
      unexplained: >-
        I offer no mechanism and none is offered in the artifacts. Recorded as an
        open structural observation. Under RQ-AES-003 R3 no comparison to
        published cryptanalysis is drawn in either direction, so no attribution
        is made here.
      consequence_for_how_it_is_reported: >-
        Because the event is deterministic, the Poisson machinery does not apply
        to it. "P(K >= 2^31 | lambda = 2.0) = 0.0" is a true but empty statement,
        and the exact-95 interval [2147483648, 2147483648] is degenerate by
        construction. The r <= 4 arms should be reported as a deterministic
        structural property with the geometry named, and kept out of any table
        that lists excess factors as effect sizes.

