  control_checks:
    - id: CTRL-1
      name: "null-object control at r=4 -- RUN BY ME, NOT BY THE PRODUCER"
      why: >-
        docs/inventor-protocol.md section 3: a statistical signal without a
        null-object control is not evidence, and the report must state what the
        measured quantity SHOULD do as the parameter meant to destroy it
        increases. BATCH-004/005 froze a structure-destroyed control (amask=15,
        all four plaintext words active, which destroys the diagonal-coset
        structure). BATCH-006 ran NO such control at r=4. Without it, "rate 1.0
        at r=4" is not distinguishable from "this statistic reads 1.0 at r=4 for
        any input geometry", which would make it an artifact of W-counting rather
        than a property of the coset structure.
      what_i_ran: >-
        My own implementation, r=4, amask=15, smask=1, 2^20 trials, seed 431001.
        Same at r=3 and r=5.
      result:
        r4_amask15: {W_ge1: 0, rate: 0.0, whist: [1048576, 0, 0, 0, 0]}
        r3_amask15: {W_ge1: 0, rate: 0.0}
        r5_amask15: {W_ge1: 0, rate: 0.0}
      reading: >-
        THE CONTROL PASSES. Destroying the coset structure takes the statistic
        from rate 1.0 to rate 0.0 at r=4 -- not to the null, but below it, on
        every trial. The r=4 saturation is therefore bound to the
        single-active-word geometry and is NOT an artifact of how W is counted.
        This is the check the batch needed and did not have, and it comes out in
        the producer's favour.
      verdict: CONFIRMED (control absent from the batch, supplied and passed here)
    - id: CTRL-2
      name: "does the r=4 pattern track the ACTIVE word, or the word index 0"
