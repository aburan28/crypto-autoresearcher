  independent_implementation:
    what: >-
      I wrote a fresh C implementation of the measured object from the
      specification in yoyo_sbox_v2.c's header comment, deliberately NOT reusing
      its code paths: plain byte-oriented AES with an explicit state array, the
      LITERAL inverse cipher (InvShiftRows / InvSubBytes / InvMixColumns) rather
      than the equivalent-inverse U-tables, MixColumns computed per column rather
      than by T-table lookup, the S-box built from a from-scratch multiplicative
      inverse search plus the affine map, and the PW/CW geometry rebuilt from the
      stated diagonal formulas.
    what_is_deliberately_shared: >-
      The splitmix64 stream, the key derivation seed ^ 0xA5A5A5A5A5A5A5A5, the
      thread-seed formula and the N/nthr trial split are reproduced on purpose.
      They are part of the arm's definition, not part of the cipher, and
      reproducing them is what makes an exact count comparison possible. Stated
      plainly so that "independent" is not read as more than it is: the RNG is
      shared, the cryptography and the statistic are not.
    self_check: >-
      FIPS-197 C.1 known-answer test computed 69c4e0d86a7b0430d8cdb78070b4c55a
      (the expected value), decryption round-trip true, and the geometry dump
      reproduced PW=[[0,5,10,15],[4,9,14,3],[8,13,2,7],[12,1,6,11]] and
      CW=[[0,13,10,7],[4,1,14,11],[8,5,2,15],[12,9,6,3]] exactly.
    cost: >-
      About 1.03e6 trials/s at r=4 on 2 threads, roughly 2.3x slower than the
      producer's T-table binary. This is what bounded how much could be
      re-executed.

