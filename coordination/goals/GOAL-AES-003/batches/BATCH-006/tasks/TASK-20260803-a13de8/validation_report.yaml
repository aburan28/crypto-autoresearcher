        The producer records "word 0, the active word, never preserved" but ran
        only amask=1, so word 0 and "the active word" are confounded in its data.
        The two hypotheses are distinguishable in one minute and were not
        distinguished.
      what_i_ran: r=4, 2^20 trials, at amask in {1, 2, 4} and smask in {1, 2, 4}
      result:
        amask1_smask1: {W_ge1_by_word: [0, N, N, N]}
        amask2_smask1: {W_ge1_by_word: [N, 0, N, N]}
        amask4_smask1: {W_ge1_by_word: [N, N, 0, N]}
        amask1_smask2: {W_ge1_by_word: [0, N, N, N]}
        amask1_smask4: {W_ge1_by_word: [0, N, N, N]}
      reading: >-
        The zero-difference index tracks the ACTIVE word, not the index 0, and is
        insensitive to smask. The correct statement of the structural fact is
        "the active word is never preserved and the other three always are", not
        "word 0 is never preserved". The producer's wording is true of its data
        and too narrow as a general statement.
      verdict: CONFIRMED and GENERALISED
