    discrepancy_clause_adjudication: >-
      The transcription_fidelity_note clause is NOT a mismatch-handling
      clause in the barred sense and creates no post-data discretion:
      (1) its subject is provenance fidelity between the carried text and
      its upstream SOURCES, not a record-vs-mirror divergence - the two
      artifacts cannot diverge on the arm list because they are one list
      by construction, and the clause gives an executor nothing to do
      because nothing branches at evaluation time; (2) its resolution
      path is a NEW superseding record (core rule 4, a pre-arm
      Coordinator channel), never mid-batch improvisation; (3) it does
      not create which-record-governs ambiguity - the record declares
      ITSELF the binding carrier ("THIS RECORD, not the skeleton and not
      the superseded record, is the binding carrier"), so the cascade
