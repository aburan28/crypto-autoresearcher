  stopping_rule_attack:
    question: >-
      After the repair, does ANY post-data discretionary path remain
      anywhere, declared or undeclared, that could swing a verdict between
      halt-no-sentence and compose-sentence? ANSWER: NO.
    path_1_six_early_exit_verdicts: >-
