red_team_report:
  id: TASK-20260903-4fdf77
  batch_id: BATCH-b38667
  goal_id: GOAL-AES-003
  question_id: RQ-AES-003
  role: red-team
  joint_owned: >-
    J-S: what the proposed rule would LICENSE - scope, interpretation, the pooling
    assumptions, instrument custody at higher exposure, and Pareto honesty - including
    the required proves-too-much control.
  producer_task: TASK-20260903-92ade4
  producer_artifacts:
    - coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-92ade4/design-proposal.yaml
    - coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-92ade4/pooled-exposure-pricing.json
    - coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-92ade4/preregistration-skeleton.md
  review_plan_source: ledger/handoffs/TASK-20260903-92ade4.yaml (review_plan block, written before either reviewer ran)
  zero_run_confirmation: >-
    ZERO EXPERIMENT ARMS RUN. experiment_runs_authorized was 0 for this task and remains
    0. Two (2) fresh-code, zero-experiment synthetic checks were executed under
    maximum_runs=2, both in a scratchpad script never seen by the producer session
    (independent re-derivation of routing arithmetic plus one self-constructed
    known-false object), and are described in full below. No build ran, no instrument
    was invoked, no arm-token or seed on the committed lists was touched.

  claim_under_review: >-
    "The pooled-exposure design specified in preregistration-skeleton.md, at the
    exposure priced in pooled-exposure-pricing.json and under the AMEND-1 gate,
    discriminates between {constant plateau}, {still decaying}, and {indistinguishable
    from the analytic comparator} at the stated power and alpha, within the priced
    budget, and licenses exactly the sentences enumerated per branch and no others."
    Reviewed here ONLY on joint J-S (what the rule licenses), never on joint J-P
    (the exposure-to-decision arithmetic and decidability, owned by TASK-20260903-779393,
    which this report never read).

  # ------------------------------------------------------------------
  # PROVES-TOO-MUCH CONTROL, RUN OBJECT BY OBJECT
  # ------------------------------------------------------------------
  proves_too_much_control:
    method: >-
      Independent fresh-code re-derivation (scratchpad script
      redteam_proves_too_much.py, python3 + scipy, never opened by the producer
      session, run twice under the task's maximum_runs=2: run 1 surfaced a sign
      error in MY OWN harness at check 3, run 2 is the corrected and reported
      result). Re-derives the branch-1 rejection threshold, the exact routing
      probabilities for objects 3 and 4 by full enumeration over the joint Poisson
      distribution of (T_4, T_16) using scipy.stats.binomtest (minimum-likelihood
      two-sided convention) and scipy.stats exact Clopper-Pearson intervals, and
      confirms the gate logic for objects 1 and 2 by direct evaluation of
      admissibility preconditions P1-P5. A fifth object, NOT among the four named
      by the Coordinator, was then constructed and probed by Monte Carlo
      (150,000 total draws across three heterogeneity strengths) because the plan
      is a floor and not a ceiling.
    objects:
      - id: OBJ-1
        object: The k=0 ramp-zero arm, count 2^30 by construction.
        required_verdict: HALT (not "live floor above comparator")
        design_claimed_routing: HALT via FM-INADMISSIBLE-INPUT (fails P2 and independently P4)
        independent_check: >-
          CONFIRMED by direct gate evaluation. k=0 is outside the pre-arm domain
          {4,16 primary; 8 secondary} => fails P2. hits=2^30, HIT_LOG_CAP=256,
          threads=4 => logged_detail_records=1024, overflow=2^30-1024 != 0 =>
          fails P4 (saturation-aware AMEND-1 identity). Routing is HALT, carried
          entirely by the admissibility gate, not by the statistic.
        status: PASS
        caveat: >-
          The design's own Section 6 / CLOSE-3 admits, and this review confirms
          independently, that on the STATISTIC ALONE (preconditions removed) two
          ramp-zero arms would route to FM-PLATEAU-CONSISTENT (pi_hat = 0.5
          exactly, huge T, trivially inside [0.667, 1.5]). The gate, not the test,
          carries the correctness of this object. This is disclosed by the
          producer, not discovered here, and it motivates OBJ-5 below.
      - id: OBJ-2
        object: The r=6 dead anchor at 0 hits, floor absent by construction.
        required_verdict: HALT (not "live floor above comparator")
        design_claimed_routing: HALT via FM-INADMISSIBLE-INPUT for the floor cascade (fails P1)
        independent_check: >-
          CONFIRMED. r=6 != 5 fails P1 outright, before any count is examined. The
          object never reaches the statistic. Same caveat as OBJ-1: on the
          statistic alone (a dead-anchor-vs-floor contrast with the precondition
          removed) the design itself computes pi_hat=1.0, routing to
          FM-DECAY-CONTINUES, which would be wrong (dead-vs-alive is not decay).
          Gate-carried, confirmed.
        status: PASS
      - id: OBJ-3
        object: Synthetic counts drawn from the analytic null (lambda=1.0) at the proposed exposure n=4.
        required_verdict: indistinguishable from comparator, or halt (never "live floor above comparator")
        design_claimed_routing: FM-COMPARATOR-INDISTINGUISHABLE
        independent_check: >-
          CONFIRMED by exact computation. Branch-1 rejection threshold at n=4,
          lambda_op=1: T >= 12 (P(Poisson(4) >= 12) = 9.1523e-4 <= alpha_N=0.001;
          P(>=11) = 2.8398e-3 > 0.001 -- reproduces the design's claimed threshold
          of 12 exactly). Exact P(rule correctly returns
          FM-COMPARATOR-INDISTINGUISHABLE | true null at both points, n=4) =
          0.998170. The residual 0.183% (branch-1 fails to fire at one point) does
          NOT fall through to a "live floor" verdict either: with T of order 4-11
          per point the exact two-sided conditional-binomial test has essentially
          no power, so the residual case degrades to FM-UNRESOLVED, not to
          FM-DECAY-CONTINUES or FM-PLATEAU-CONSISTENT. No path from this object to
          "live floor above comparator" was found.
        status: PASS
      - id: OBJ-4
        object: A synthetic still-decaying generator at the preregistered MDE, rho=2, n=4.
        required_verdict: 'still decaying (FM-DECAY-CONTINUES)'
        design_claimed_routing: >-
          FM-DECAY-CONTINUES with probability ~0.977 (arcsine/Cohen's-h sizing
          approximation, disclosed as an approximation, caveat C3); false-plateau
          rate "estimated below 0.005" (hand estimate, caveat C6).
        independent_check: >-
          CONFIRMED and TIGHTENED by full exact enumeration (no normal
          approximation): P(FM-DECAY-CONTINUES) = 0.970869, P(FM-PLATEAU-CONSISTENT)
          = 0.000102, P(FM-UNRESOLVED) = 0.029029, P(FM-INVERTED) = 0.000000,
          P(FM-COMPARATOR-INDISTINGUISHABLE) = 0.000000 (total mass 1.000000,
          truncated joint mass captured 1.00000000). The exact power (0.9709) is
          0.006 below the design's own arcsine estimate (0.977), inside the
          disclosed tolerance ("typically agreeing to within 0.02"). The exact
          false-plateau rate (0.0102%) is well inside the design's disclosed
          "below 0.005" bound. Both of the design's own quantitative claims for
          this object are independently verified.
        status: PASS
      - id: OBJ-5
        provenance: >-
          NOT one of the Coordinator's four named objects. Constructed by this
          review because the plan is a floor, not a ceiling, and because the four
          named objects only probe the ADMISSIBILITY GATES (P1-P5), never the
          STATISTIC's own power against the design's single most important,
          self-disclosed, unmeasured risk (heuristic_assumptions H1
          honest_power_disclosure: "a seed-to-seed rate heterogeneity of 20 to 50
          percent is NOT detectable at [n=4]... the recommended design's most
          important unmeasured risk").
        object: >-
          A bimodal-rate seed-heterogeneity generator at k=4: two of four arms
          drawn Poisson(lo), two drawn Poisson(hi), lo and hi chosen so the
          arithmetic mean equals lambda_plan=16 (i.e. the grand total looks
          unremarkable). k=16 is homogeneous Poisson(16) throughout. This object
          PASSES every admissibility precondition P1-P5 (r=5, k in {4,16},
          exposure 2^30, unsaturated at these counts, seed/armid procedurally on
          the committed list) -- there is nothing in P1-P5 that excludes
          heterogeneous seeds, because P1-P5 are procedural facts about the arm,
          not statistical facts about the rate. It is KNOWN FALSE for the purpose
          of any single-rate magnitude sentence: heuristic H3 ("a single rate
          lambda_k governs every arm at point k") is false by construction, so no
          branch conjunct that presupposes a single governing rate at k=4 can be
          correctly fired by this object -- least of all FM-PLATEAU-CONSISTENT,
          whose licensed sentence is "the floor rate ratio is confined to [...]",
          which presupposes there IS a floor rate to confine.
        required_verdict: >-
          FM-OVERDISPERSED (the only branch whose premise -- "between-arm
          heterogeneity ... exceeds the Poisson model" -- is actually true of this
          object), or at minimum never FM-PLATEAU-CONSISTENT, since there is no
          single rate for that sentence to describe.
        independent_check: >-
          Monte Carlo, 50,000 draws per scenario, chi-squared critical value at
          alpha_H=0.01, df=3 independently recomputed as 11.3449 (matches the
          design's own table value 11.345 to the digits shown). THREE
          heterogeneity strengths tested, chosen to bracket the design's own
          disclosed 20-50% "not detectable" band (a lo/hi split of (mean-d, mean+d)
          corresponds to variance-inflation factor phi = 1 + d^2/lambda_plan):
            - mild, d=4 (12 vs 20, ~25% deviation, phi=2.0): FM-OVERDISPERSED
              catches it only 15.70% of the time. When MISSED (84.3% of draws),
              the rule routes to FM-PLATEAU-CONSISTENT 18.88% of the time
              (unconditional: 15.9% of ALL draws of this scenario), to
              FM-DECAY-CONTINUES 1.88% of the time (unconditional 1.6%), to
              FM-INVERTED 2.17% (unconditional 1.8%), and to FM-UNRESOLVED the
              rest.
            - moderate, d=8 (8 vs 24, phi=5.0): caught 83.65% of the time. When
              missed (16.35%), routes to PLATEAU 16.74% of the time
              (unconditional 2.7%).
            - strong, d=12 (4 vs 28, phi=10.0): caught 99.95% of the time;
              negligible residual risk (23 missed draws out of 50,000, of which 1
              produced PLATEAU).
        finding: >-
          Under a MILD, entirely plausible heterogeneity (25% deviation from the
          mean, squarely inside the design's own self-declared "20-50% not
          detectable" band -- this is not a contrived or extreme scenario, it is
          the exact scenario the producer already named as its biggest unmeasured
          risk), the rule licenses a FM-PLATEAU-CONSISTENT sentence -- a positive,
          composed, quotable "PLATEAU-CONSISTENT AT RESOLUTION 1.5" claim -- on
          data with no single governing rate, at a rate of approximately 16% of
          all draws of that scenario. This is not a corner case: it is a larger
          unconditional failure probability than the design's own disclosed and
          quantified false-plateau rate on OBJ-4 (0.01%) by three orders of
          magnitude, and it was never computed by the producer. The producer's
          own overdispersion_sensitivity table quantifies ONLY the effect of
          heterogeneity on the DECAY branch's test size (phi=1.5 -> 0.110,
          phi=2.0 -> 0.166); it contains no corresponding number for the PLATEAU
          branch, which is exactly the branch the Coordinator's own prior names
          as "the strongest temptation" and the one NARROW-1/NARROW-4 are written
          to guard.
        status: BREAKS. This is the breaking_artifact the review_plan pre-declared for
          joint J-S ("a null object on which the rule returns a floor verdict").
          FM-PLATEAU-CONSISTENT is a floor-magnitude verdict; OBJ-5 is a null
          object with respect to that verdict (no single rate exists to confine).
    proves_too_much_summary: >-
      All four Coordinator-named objects route correctly; the design's own
      disclosure that OBJ-1/OBJ-2's correctness is gate-carried, not
      statistic-carried, is independently confirmed and is honest, not a defect
      in itself. The break is in a FIFTH object this review constructed inside
      the design's own admissibility domain, exploiting a gap the design already
      names in prose (H1's honest_power_disclosure) but never quantifies for the
      branch where it matters most (PLATEAU, not DECAY). See successor
      requirements 2-3 below.

  # ------------------------------------------------------------------
  # POOLING MODEL / HETEROGENEITY / INSTRUMENT CUSTODY ATTACKS
  # ------------------------------------------------------------------
  pooling_model_attacks:
    - id: POOL-1
      target: H3 exposure additivity / H1 Poisson counting, as validated by Branch H (FM-OVERDISPERSED)
      objection: >-
        Same finding as OBJ-5 above, stated as a pooling-assumption objection
        rather than a proves-too-much object: the ONLY guard against additivity
        failure is a chi-squared dispersion test with n_k - 1 = 3 degrees of
        freedom, which the design itself concedes "detects only gross
        overdispersion." This review quantifies "not gross" precisely: a 25%
        seed-to-seed rate deviation (which the design's own text calls plausible
        and undetectable) slips past the gate 84% of the time and, when it does,
        produces a licensed PLATEAU sentence about 1 time in 5 of those escapes.
        The pooling operation's own control object (O3 / the dispersion index) is
        under-powered specifically in the direction that matters for the branch
        most prone to over-reading.
      severity: primary break (see OBJ-5)
    - id: POOL-2
      target: H2 independence across arms
      objection: >-
        The pre-arm stream-distinctness check (H2's validation route) is
        correctly designed as a hard, zero-compute, algebraic gate -- no
        objection to its LOGIC. But it cannot be exercised or verified by any
        reviewer today: preregistration-skeleton.md Section 1 item 11 commits to
        "a declared seed block" and "a DISJOINT declared seed block" without
        naming a single concrete seed value anywhere in either artifact. The
        seed-extension convention is honestly flagged by the producer as
        "[convention, new and requiring a Coordinator decision]," which this
        review confirms is the correct characterization -- but it means H2's
        validation is currently a promise, not a check, and cannot be
        independently exercised until a successor batch commits actual seed
        values.
      severity: minor, disclosed by the producer, not a new finding beyond confirming the disclosure is accurate
    - id: POOL-3
      target: H6 the comparator / the operative-comparator rule (Section 4)
      objection: >-
        G4's hard-gate threshold ("the count at which the pooled measured null
        rate reaches the exact Garwood lower bound of the committed single-arm
        k=16 reading") is a THIRD use of the five committed readings. The
        design's own "why_not_a_renamed_known_approach" item (v) claims the
        committed readings enter this design ONLY for (i) bounding the planning
        constant lambda_plan and (ii) a post-hoc report-only consistency
        comparison. Calibrating a HALT-capable gate threshold from the k=16
        reading's exact CI bound is neither (i) (it is not sizing lambda_plan)
        nor (ii) (it operates BEFORE any branch fires and can halt the batch,
        not after). This is very likely a benign, reasonable design choice
        (anchoring a gate to a known interval is ordinary practice) but the
        design's own accounting of "only two uses" of the committed data is not
        accurate as written, and NARROW discipline in this campaign exists
        precisely to prevent an undisclosed use of prior data from creeping into
        an analysis-bearing decision.
      severity: sentence-level scope-precision finding, not a statistical break
    - id: POOL-4
      target: Instrument custody at higher exposure (17 arms, several times any predecessor batch)
      objection: >-
        Section 3 Branch G1 (the correctness gate) checks build identity, KAT
        pins and table-freeze re-verification "pre-arm" and "post-arm" only --
        a batch-level, not a per-arm or periodic, check. H4 (instrument
        stationarity) is explicitly conceded to have "NONE AVAILABLE" rigorous
        support and is "designed around" via interleaving -- but interleaving
        and the Spearman run-order test address STATISTICAL drift in the RATE,
        not a build/environment identity excursion. A transient build,
        environment, or binary drift that occurs and self-reverts between the
        pre-arm and post-arm checks -- more plausible in a batch several times
        longer than any predecessor, which this design explicitly is -- would
        be invisible to G1 entirely, and if the post-arm check happens to still
        pass, no arm-level attribution is possible even if it is later
        suspected. This is a genuine, specific instrument-custody gap that the
        design's own "several times longer than any predecessor" framing
        invites but does not close.
      severity: specific, actionable, not previously named by the design's confounders list

  # ------------------------------------------------------------------
  # NARROW-1..5 SENTENCE-LEVEL AUDIT
  # ------------------------------------------------------------------
  narrow_audit:
    method: >-
      Read design-proposal.yaml and preregistration-skeleton.md in full, hunting
      sentence by sentence for smuggled extinction, plateau-as-constancy,
      completion, cliff-at-4, sub-sub-interval, whole-curve, k=12-as-coverage,
      count-verdict-at-k=8, or prior-rehabilitation language, and for any
      statement exceeding {grid 0,1,2,3,4,8,16; cell (1,1); r=5 floor / r=6 null;
      2^30; seeds 531001/531002 plus dead-anchor 531004; PIN-T0; toy tier}.
    findings:
      - id: NARROW-AUDIT-1
        verdict: HOLD (no violation)
        detail: >-
          NARROW-1 (no extinction). Every branch's "NOT licensed" clause
          explicitly bars an extinction reading, including the comparator branch
          (the one place a naive rule would be tempted to read "indistinguishable"
          as "absent"). No extinction sentence found anywhere in either artifact.
      - id: NARROW-AUDIT-2
        verdict: HOLD (no violation), with a caveat
        detail: >-
          NARROW-2 (no count-level decay sentence without second seeds at the
          named k). Every priced design except D-0 uses n>=2 NEW arms per primary
          point, satisfying the procedural requirement. Caveat: NARROW-2's
          origin text references specific magnitudes (84.90, 8786.5) from an
          earlier batch's decay-ratio object, not this batch's rho; the
          transplant of the RULE (second-seeds-before-count-claims) rather than
          the specific numbers is the correct reading and is what this design
          does.
      - id: NARROW-AUDIT-3
        verdict: HOLD (no violation)
        detail: >-
          NARROW-3 (determinism != replication). Section 9's halt-branch
          discipline explicitly names identical-(seed,armid,build) re-invocation
          as instrument determinism, never replication, and the design's H2
          validation route makes the same distinction explicitly. Correct.
      - id: NARROW-AUDIT-4
        verdict: HOLD (no violation)
        detail: >-
          NARROW-4 ((3,4] no cliff/completion/sub-sub-interval; multiplicative
          prior stays BROKEN-AUTHORITY; k=12 disclosed as frozen-never-measured).
          All four sub-clauses are respected: no branch touches (3,4]; the
          multiplicative prior is named exactly once, as explicitly unconsumed;
          k=12 is named repeatedly and consistently as "frozen-never-measured"
          and "no sentence may cite it as coverage," including in the obstruction
          block and open_directions.
      - id: NARROW-AUDIT-5
        verdict: HOLD (no violation)
        detail: >-
          NARROW-5 (k=8 band-level only, no count verdict). k=8 is declared
          "secondary and report-only" in the pre-arm domain (Section 1 item 5)
          and "No conjunct reads it. No count verdict at k=8 is drawn in any
          branch" is stated twice, in the domain section and in
          interpretation_limits. Correct and consistent.
      - id: NARROW-AUDIT-6
        verdict: FINDING (structural gap in the anti-paraphrase discipline itself, not a violation by this document)
        detail: >-
          RAT-3, on its own text, protects only "branch CONJUNCTS" from
          paraphrase ("No other section of any artifact may paraphrase a branch
          conjunct"). The "NOT licensed" / prohibition clauses of Section 5 --
          which are the operational form of NARROW-1, NARROW-4 and NARROW-5, and
          exactly the class of sentence that DEV-S2b-1 (the historical episode
          that created RAT-3) inverted through paraphrase -- are explicitly
          exempted by design-proposal.yaml's own conjunct_location note
          ("LICENSING STATEMENTS, not conjuncts... no conjunct is paraphrased").
          Nothing in either artifact requires a FUTURE downstream record (an
          EV-AES-* evidence record or a DEC-* decision composing a sentence about
          a fired branch, months from now, by a different session) to quote the
          "NOT licensed" prohibitions verbatim rather than paraphrase them. This
          is not a defect of the current documents -- neither one commits such a
          paraphrase -- it is a gap in the PROTECTION the campaign's own RAT-3
          rule affords to precisely the sentences the rule exists to protect.
        recommended_fix: successor requirement 1, below.

  # ------------------------------------------------------------------
  # PARETO / DOMINANCE CHALLENGE
  # ------------------------------------------------------------------
  pareto_dominance_challenge:
    dominated_by_field_check: >-
      NOT unchecked-null (correctly not fabricated per docs/inventor-protocol.md).
      dominated_by is an 8-row scan across time, memory and data/queries, with a
      clearly stated non-null verdict (Row 3, retrospective pooling, genuinely
      dominates on every cost axis and is declined only on the information axis,
      honestly argued rather than hidden). This satisfies the AGENTS.md /
      KN-TECH-056 requirement that an unchecked null is a fabrication -- this
      null was checked, and is not asserted.
    rank2_challenge: >-
      RANK 2 (family extension, k=5/6 or a finer (3,4] locator) is correctly
      argued to supply ZERO information to THIS design's specific k=4-vs-k=16
      conjunct (its new points fall outside the fixed pre-arm domain of Section
      1 item 4, so they structurally cannot enter the conditional-binomial
      statistic), while costing strictly more (a ~54-minute Gate-0x rebuild this
      design avoids entirely). This review independently confirms the domain
      argument is correct: Section 1's domain-fixing (items 4-5) is written
      BEFORE any arm runs and admits no mechanism by which a k=5 or k=6 reading
      could enter Section 5's conjuncts. The "RANK 2 dominates on info/sec IF the
      next question is transition position" concession is honest and correctly
      flagged as a Coordinator ranking judgment, not pre-empted.
    cheaper_third_draw_challenge: >-
      FINDING: the design's Pareto scan does not price, as its OWN row, the
      cheapest conceivable extension of the existing record for the ACTUAL
      k=4/k=16 pair used here -- one new arm at each point (n=1, 2 floor arms
      total, roughly half of D-1's 9-arm floor). The only citation offered for
      "a cheap hook was priced and declined" is IDEA-20260903-8f26ac's
      k=8-plus-k=16 hook, which is a DIFFERENT point pair with different rates,
      and that finding does not automatically transfer. There is, however, an
      INDEPENDENT and design-specific reason n=1 fails that this record does not
      state: at n=1 the per-point dispersion index has ZERO residual degrees of
      freedom (n_k - 1 = 0), so heuristic H1/H3's homogeneity gate CANNOT be
      computed at all -- not weakly, not at all. A one-arm-per-point design is
      therefore not merely low-power (as D-1's own n=2, 1-df case is candidly
      described: "One degree of freedom carries essentially no power"); it is
      undefined for the pooling operation's own control object. This is a
      sufficient, cheap, design-specific argument against the third-draw
      alternative that the current record does not make -- it borrows a
      precedent from a different point pair instead of deriving its own.
    verdict: >-
      dominated_by is substantively honest and well-argued on RANK 2 and on the
      named alternatives, but incomplete on the cheapest possible variant of its
      OWN route (successor requirement 7).

  # ------------------------------------------------------------------
  # STANDARD RED-TEAM SCHEMA FIELDS (agents/red-team.md)
  # ------------------------------------------------------------------
  objections:
    - >-
      OBJ-5 (see proves_too_much_control): a plausible, self-disclosed-range
      seed-heterogeneity object licenses a FM-PLATEAU-CONSISTENT verdict at
      approximately 16% unconditional probability, three orders of magnitude
      above the design's own quantified false-plateau rate for the DECAY-branch
      analogue (OBJ-4). This is the primary break of joint J-S.
    - >-
      The design's own confounders/overdispersion_sensitivity analysis quantifies
      heterogeneity's effect on the DECAY branch's test size only; it contains no
      corresponding figure for the PLATEAU branch, despite the Coordinator's own
      recorded prior naming plateau over-reading as "the strongest temptation."
    - >-
      G4's null hard-gate threshold is calibrated from the committed k=16
      reading's exact CI bound, a third, undisclosed use of the five committed
      readings beyond the two the design claims are the only uses (POOL-3).
    - >-
      RAT-3's anti-paraphrase protection is scoped to branch-firing conjuncts and
      explicitly does not extend to the "NOT licensed" prohibition text -- the
      exact class of sentence the rule was created to protect against paraphrase
      (NARROW-AUDIT-6).
    - >-
      Instrument custody is checked pre-arm/post-arm only, not per-arm or
      periodically, on a batch explicitly "several times longer than any
      predecessor" (POOL-4).
    - >-
      dominated_by cites, rather than independently re-derives, its argument
      against the cheapest same-pair alternative (n=1 "third draw"); the correct
      and sufficient argument (zero residual degrees of freedom for the
      homogeneity gate at n=1) exists and is cheap, but is not stated.
    - >-
      "Exact two-sided conditional binomial test of pi=0.5" (Section 5.2-5.5) does
      not name its tail-construction convention (minimum-likelihood vs.
      equal-tail); the two can disagree near a branch boundary, and the
      preregistration's own "no normal approximation may be substituted"
      discipline does not extend to naming which EXACT convention is binding.

  required_controls:
    - >-
      Quantify and disclose the FM-PLATEAU-CONSISTENT false-positive rate under
      the SAME heterogeneity range (phi = 1.0 to 2.0) already tabulated for the
      decay branch in overdispersion_sensitivity, before this design is adopted
      for execution. This review's Monte Carlo (150,000 draws, fresh code, method
      disclosed above) can be cited as a starting point but is not a substitute
      for the producer's own exact derivation.
    - >-
      Either strengthen Branch 4's admissibility (a tighter homogeneity margin
      as an explicit secondary conjunct, not merely "fails to reject at
      alpha_H=0.01") or raise n specifically to bound heterogeneity risk before
      any PLATEAU-CONSISTENT sentence is composed.
    - >-
      Name G4's use of the committed k=16 CI bound as a disclosed third use of
      the committed readings (POOL-3), and confirm whether it should instead be
      derived from a pre-registered constant independent of any committed
      reading.
    - >-
      Per-arm or periodic (not merely pre-arm/post-arm) build-identity and KAT
      re-verification for any design running substantially more arms, or a
      substantially longer wall-clock span, than any predecessor batch (POOL-4).

  counterexample_or_mutation: >-
    OBJ-5: a bimodal two-population seed-heterogeneity generator at k=4 (two arms
    Poisson(12), two arms Poisson(20); k=16 homogeneous Poisson(16)) that PASSES
    every admissibility precondition P1-P5 and produces a licensed
    FM-PLATEAU-CONSISTENT verdict on approximately 16% of draws, despite having no
    single governing rate for that verdict to describe. Full construction,
    parameters and Monte Carlo results are in proves_too_much_control.objects[OBJ-5]
    above; the generating script is scratchpad-only (not a durable artifact) and
    its exact logic is reproduced in prose in this record so the finding does not
    depend on an ephemeral file.

  baseline_comparison: >-
    NOT APPLICABLE in the Pollard-rho/BSGS/specialized-ECDLP-baseline sense: this
    is a toy-tier AES-ramp statistical measurement design (class: measurement,
    explicitly "NO ATTACK, NO EXPONENT" in target_complexity), not an ECDLP or
    complexity claim, and the design correctly disclaims any distinguisher,
    key-recovery, or published-cryptanalysis comparison in either direction. The
    applicable "baseline" comparison for this joint is the Pareto/dominance
    challenge above (retrospective pooling, RANK 2, the single-long-arm
    alternative, and the under-priced third-draw alternative), which is addressed
    in full there rather than duplicated here.

  heuristic_challenges:
    - heuristic: H1 (Poisson counting) / H3 (exposure additivity)
      challenge: >-
        Falsification condition (the dispersion test) is real and correctly
        specified, but its POWER against the disclosed 20-50% heterogeneity band
        is quantified only in aggregate ("gross overdispersion only") and only
        for its effect on the DECAY branch's size. This review supplies the
        missing PLATEAU-branch number (OBJ-5) and finds it more consequential
        than the DECAY-branch number the design does report.
      verdict: heuristic statement and falsification condition are sound; the
        validation route's DISCLOSED power gap is real and larger, in its
        practical consequence, than disclosed.
    - heuristic: H4 (instrument stationarity)
      challenge: >-
        Correctly conceded to have "NONE AVAILABLE" rigorous support; the
        interleaving/run-order mitigation is a real, well-reasoned control for
        STATISTICAL (rate) drift but is not a substitute for BUILD-IDENTITY
        custody at a batch length several times any predecessor's (POOL-4).
      verdict: statistical mitigation sound; custody mitigation incomplete.
    - heuristic: H6 (the comparator)
      challenge: >-
        Correctly the weakest and most honestly flagged heuristic in the design;
        the operative-comparator rule is a genuine, well-constructed control. Only
        objection is POOL-3 (an undisclosed third use of committed data in
        calibrating G4, not in H6 itself).
      verdict: sound as stated; adjacent gate (G4) has a disclosure gap.

  cost_model_challenges:
    - >-
      Authoring vs. compute components are honestly separated per the goal's C4
      discipline; no objection to the cost bookkeeping itself.
    - >-
      The cheaper "third draw" alternative is under-priced in dominated_by
      (pareto_dominance_challenge.cheaper_third_draw_challenge, successor
      requirement 7) -- not because its cost is misstated, but because it is not
      priced at all as its own row for the ACTUAL point pair in use.
    - >-
      G4's threshold construction (POOL-3) blends design-time gate calibration
      with the "new-arms-only" cost/evidence discipline the design otherwise
      applies strictly; worth a one-line disclosure rather than a re-design.

  reduction_and_scope_challenges: >-
    Not applicable. No reduction chain (e.g. OneEnd -> EndRing -> Isogeny) is
    claimed or needed; this is a single-cell, single-round-count, toy-tier
    measurement design with an explicit, narrow claim_scope, and the
    interpretation_limits block correctly excludes every adjacent scope (other
    cells, round counts, k values, deployed-AES, distinguisher, key-recovery).
    No scope inflation found beyond the items already listed under narrow_audit
    and pooling_model_attacks.

  proof_architecture_challenges: >-
    proof_search_map.applies: "partially" is a fair self-assessment for a
    measurement (not proof-oriented) design. The two audits it does run were
    independently checked and hold: (1) baseline_embedding/reproduction_check --
    setting n=1 and removing the equivalence criterion does reproduce the
    committed COUNT-UNRESOLVED state, a legitimate and correctly-run sanity
    check. (2) observation_collision -- the claim that the grand pooled total T
    is a colliding observable between plateau and rho=2 decay is independently
    confirmed by inspection of planning_constants.S_of_rho (32.000 at rho=1
    versus 33.941 at rho=2, a 6% difference against Poisson noise of order
    sqrt(32)~5.7 on a per-arm-pair basis, i.e. genuinely near-degenerate), which
    correctly motivates the choice of rho over T as the primary object. No
    objection to either audit. The nearby_object_control (the ramp-zero pair) is
    exactly OBJ-1 above, appropriately reused rather than invented twice.

  narrowest_supported_statement: >-
    On joint J-S: the four Coordinator-named proves-too-much objects (OBJ-1
    through OBJ-4) all route correctly under independent fresh-code
    re-derivation, and the design's own disclosure that OBJ-1/OBJ-2's
    correctness is carried by the admissibility gates rather than by the
    statistic is accurate. However, the design's implicit guarantee that
    FM-PLATEAU-CONSISTENT means "a single floor rate is confined to an
    interval" is BROKEN by a fifth, self-constructed object (OBJ-5) that passes
    every stated admissibility precondition, lies squarely inside the design's
    own disclosed 20-50%-heterogeneity risk band, and produces a licensed
    PLATEAU-CONSISTENT sentence on data with no single rate at all,
    approximately 16% of the time. This does NOT invalidate the DECAY branch
    (independently confirmed to power 0.971, matching the design's own estimate
    within its disclosed tolerance), the gates, or the comparator branch, all of
    which hold. It does NOT mean the pooled-exposure route is dead, saturated,
    or should be abandoned -- it means the PLATEAU branch specifically needs the
    quantified heterogeneity bound named in required_controls before a
    FM-PLATEAU-CONSISTENT sentence from this design should be trusted or
    composed into an evidence record. Pareto/dominance reasoning against RANK 2
    and the single-long-arm alternative holds; the argument against the cheapest
    same-pair alternative (n=1) is directionally correct but currently
    under-derived (successor requirement 7).

  successor_requirements:
    - "1. Extend the RAT-3 verbatim-quotation discipline to also cover each branch's \"NOT licensed\" prohibition text (not only the firing conjunct) for any downstream evidence, decision, or knowledge-promotion record that composes a sentence describing a fired branch's outcome -- this closes the same paraphrase failure mode (DEV-S2b-1) that RAT-3 was created to prevent, which currently leaves the prohibition text unprotected (NARROW-AUDIT-6)."
    - "2. Add an explicit, disclosed quantitative bound on the FM-PLATEAU-CONSISTENT false-positive rate under seed heterogeneity (phi = 1.0 to 2.0), analogous to the existing overdispersion_sensitivity table for the decay branch, before this design is adopted for execution (OBJ-5)."
    - "3. Either (a) add a tightened, explicit secondary conjunct to Branch 4 requiring the dispersion index to fall materially below its critical value (not merely fail to reject at alpha_H=0.01), or (b) raise n specifically to bound heterogeneity risk, before any PLATEAU-CONSISTENT sentence composed under this design is treated as more than provisional."
    - "4. Name G4's use of the committed k=16 reading's exact Garwood lower bound as a disclosed third use of the five committed readings, alongside the two uses ((i) planning-constant sizing, (ii) post-hoc report-only comparison) the design currently claims are exhaustive (POOL-3)."
    - "5. Add per-arm or periodic (not solely pre-arm/post-arm) build-identity and KAT re-verification checkpoints for any design running substantially more arms or a substantially longer wall-clock span than any predecessor batch (POOL-4)."
    - "6. Name the exact tail-construction convention (e.g. minimum-likelihood, matching scipy.stats.binomtest's default, versus equal-tail) for \"the exact two-sided conditional binomial test of pi=0.5\" in the adopted preregistration text; the two conventions can disagree near a branch boundary and the current text specifies alpha and the null but not the convention."
    - "7. Before adoption, price the cheapest same-pair alternative (one new arm at k=4, one new arm at k=16, n=1, 2 floor arms total) as its own explicit dominated_by row for the actual k=4/k=16 pair used by this design, rather than citing IDEA-20260903-8f26ac's k=8-plus-k=16 \"zero sharpening\" finding by precedent. The correct, sufficient, design-specific argument against n=1 is that the per-point dispersion index has zero residual degrees of freedom at n=1, so H1/H3's homogeneity gate cannot be computed at all -- state this rather than relying on a different point pair's result."
    - "8. (Minor.) Resolve or delete the orphaned \"count_threshold_at_n_6_lambda_op_1: 15\" entry in pooled-exposure-pricing.json's branch_thresholds block: it is not consumed by any priced design in the ladder, is marked \"stated WITHOUT its arithmetic\" (caveat C5), and is absent from blind_rederivation_target_list, creating a risk that a successor treats it as load-bearing when it currently is not used anywhere."

  next_concrete_action: >-
    Before any Coordinator decision authorizes execution of D-1 or D-2, require
    the producer (or a scoped successor task) to discharge successor
    requirements 2 and 3 -- the quantified PLATEAU-branch heterogeneity bound and
    its remedy -- since this is the one gap that changes what a FIRED branch of
    this design would actually be safe to compose into an evidence record.
    Requirements 1 and 6 (verbatim-protection scope, test-convention naming) are
    cheap textual fixes to preregistration-skeleton.md and cost nothing to make
    before adoption. Requirements 4, 5, 7 and 8 are disclosure/completeness fixes
    that do not block execution but should accompany the next producer pass.

