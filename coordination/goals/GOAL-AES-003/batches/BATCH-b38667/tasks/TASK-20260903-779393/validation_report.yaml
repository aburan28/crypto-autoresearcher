  # ==================================================================
  # RULE DECIDABILITY (J-P: is every branch reachable, ordered, mutually
  # exclusive, exhaustive, and domain-fixed pre-arm)
  # ==================================================================
  rule_decidability_check:
    domain_fixed_pre_arm: >-
      CONFIRMED. preregistration-skeleton.md Section 1 fixes, as a single write-once block
      "before any arm runs": question, cell, round count, primary points, secondary point
      (report-only, no conjunct reads it), exposure, schedule pin, threads, build identity,
      seats/armids, seed list (disjoint floor/null blocks, no data-dependent selection),
      run order (interleaved, committed pre-arm), significance levels (alpha, alpha_N,
      alpha_H, alpha_O), equivalence resolution rho*=1.5, minimum detectable effect rho_1=2,
      and the new-arms-only test-data discipline (committed readings barred from the test
      statistic). This is a genuine pre-arm domain, not a retrofitted one; nothing in it is
      computed from data that would not exist until an arm runs. Being a SKELETON rather than
      an adopted preregistration, the actual seed list and armid values are not filled in
      here - correctly, since no arm may run under this task, and the rule commits only to
      the DISCIPLINE (fix it write-once pre-arm) rather than to concrete values it has no
      standing to commit.
    ordering: >-
      CONFIRMED, strictly ordered and explicit: Section 3 gates (G1-G4, in stated order) run
      first and any failure halts with invalid_measurement before anything else is evaluated;
      Section 2 admissibility preconditions (P1-P5) are checked next, any failure at a
      primary point halts the cascade; Section 4 sets the operative comparator; Section 5.0
      (Branch H, homogeneity) runs before any pooling and its firing forecloses every pooled
      magnitude sentence; only then does the floor cascade (Branches 1 through 5, Sections
      5.1-5.5) evaluate, itself internally ordered (Branch 1 first, then the reject/no-reject
      split for 2/3 vs 4/5).
    mutual_exclusivity_and_exhaustiveness: >-
      CONFIRMED by direct logical argument (not merely asserted by Section 5.6, independently
      checked here). Conditional on Branch 1 not firing, the exact two-sided conditional
      binomial test either rejects H0:pi=0.5 or does not: (a) IF it does not reject, the
      branch 4/5 split is by containment of the exact CP-mapped rho interval in
      [1/1.5,1.5], a well-defined yes/no with no third option, so 4 and 5 are exclusive and
      exhaustive of the "does not reject" case. (b) IF it rejects, pi_hat cannot equal
      exactly 0.5 (the p-value at pi_hat=0.5, i.e. k=T/2, is 1 by construction of the
      symmetric two-sided test, so a rejecting outcome never occurs at the tie point),
      hence branches 2 and 3 (split by sign of pi_hat-0.5) are exclusive and exhaustive of
      the "does reject" case. Combined with Branch 1's own binary fire/no-fire status, the
      five branches partition every admissible reading with no gap and no overlap. This is
      verified as a matter of logic, independent of any numerical computation, and confirms
      the file's own Section 5.6 argument rather than merely restating it.
    reachability: >-
      CONFIRMED for every branch, both by the proves_too_much_routing table (which
      demonstrates concrete constructions landing in FM-INADMISSIBLE-INPUT via P2/P4 and via
      P1, in FM-COMPARATOR-INDISTINGUISHABLE, and in FM-DECAY-CONTINUES with ~97% probability)
      and by my own exact recomputation of branch-firing probabilities under the file's
      stated priors (FM-DECAY-CONTINUES, FM-INVERTED, FM-PLATEAU-CONSISTENT, FM-UNRESOLVED
      and FM-OVERDISPERSED are all realizable with substantial, non-degenerate probability
      under plausible true rates, per my own step_E plateau-confinement computation
      (22.6 percent under a slightly different lambda_bar) and design-proposal.yaml's
      independently-stated honest_prior_of_survival figures (~20-35 percent for the
      plateau/unresolved pair) - the two are in the same qualitative range though not
      numerically identical, since they use different planning rates and neither is a
      binding conjunct). FM-COMPARATOR-INDISTINGUISHABLE is reachable but improbable under
      the design prior (below 3e-15, confirmed order-of-magnitude by my own exact Poisson
      tail computation P(T<=11|mean=64)=2.4e-16 in an earlier working step, consistent with
      but not identical to the file's Chernoff bound of 2.5e-15 - the exact value is tighter
      than the file's own bound, as expected since Chernoff bounds are not tight); the file
      correctly labels it "a REACHABLE CONTROL BRANCH, not a live outcome" rather than
      claiming certainty either way. No branch is structurally unreachable.
    verdict: HOLDS. No decidability defect found.

