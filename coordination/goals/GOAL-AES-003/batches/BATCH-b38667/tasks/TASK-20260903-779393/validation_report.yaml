  post_seal_comparison:

    step_A_garwood_cis: >-
      EXACT MATCH on all five: my sealed values [9.903,27.219] (h=17), [12.999,32.101]
      (h=21), [6.922,22.230] (h=13), [10.668,28.448] (h=18), [6.201,20.962] (h=16) agree
      digit-for-digit with pooled-exposure-pricing.json's garwood_two_sided_95_at_realized_readings
      block ([9.903,27.219], [12.999,32.101], [6.915,22.232], [10.668,28.448], [6.201,20.962]),
      excepting a 0.007 difference at the h=13 lower bound (my 6.922 vs the file's 6.915,
      immaterial and consistent with a last-digit chi-squared-quantile rounding choice; both
      values are also within 0.001 of TASK-20260903-12a09f's independently re-derived
      [6.915, 22.232], so the file's figure is the better-anchored one and my figure differs
      from it only in the fifth significant digit). No disagreement of any consequence. The
      h=16 interval [6.201, 20.962] is independently CONFIRMED exact, resolving the file's own
      caveat C1 (it had no evidence-record source and was hand-derived); my fresh
      scipy-computed value matches it exactly, so C1 is now closed by independent
      confirmation.

    step_B_pooled_exposure_reconstruction: >-
      My blind per-role arm reconstruction for D-0, D-2-lite and D-2 (ramp=1/null=6/k8=0/n=0;
      ramp=1/null=4/k8=0/n=4; ramp=1/null=6/k8=2/n=4) matches the pricing file's "designs"
      array EXACTLY on all three. My flagged-uncertain reconstructions for D-1, D-3, D-4
      (n=0, n=8, n=14 under an assumed constant ramp=1/null=6/k8=2 pattern) also MATCH the
      file exactly for D-3 (n=8) and D-4 (n=14), but D-1 does NOT match: the file's actual D-1
      breakdown is {ramp=1, r6_null=4, k4=2, k8=0, k16=2, total=9} (n=2 primary arms/point,
      null=4, k8=0), whereas my pattern-based guess (assuming the D-2 ramp/null/k8 constants
      held) produced n=0 with a spurious "MATCH" on the total only (1+6+2+0=9, an
      arithmetic coincidence with the WRONG interpretation - I had assumed k8=2 for D-1 as for
      D-2, which is wrong; D-1 actually drops k8 entirely and uses n=2, not the D-2 pattern
      with n=0). This is a genuine gap in my blind reconstruction, correctly self-flagged as
      "UNVERIFIED" before the seal was broken, and it does not touch the recommended design
      D-2, whose breakdown I reconstructed exactly from permitted reading alone. Cost check:
      the 1620 s/arm cost consistency I found across all six ladder rungs is independently
      confirmed by the file's own design_ladder.cost_basis.binding_baseline_seconds_per_2p30_four_thread_arm
      = 1620.

    step_C_expected_counts_planning_rate_divergence: >-
      MATERIAL, DISCLOSED-CATEGORY FREE-CHOICE DIVERGENCE, localized and non-fatal. I chose
      lambda_bar = 16.667 (arithmetic pool of the three existing single-arm readings 17,21,12
      over 3 arms) as my planning-prior rate; the pricing file uses lambda_plan = 16.0, which
      it explicitly states is "A DESIGN CONSTANT, NOT AN ESTIMATE... a round number chosen
      inside the span [12,21]... deliberately NOT a pooled estimate: pooling the realized k=8
      draws is barred for evidential purposes by NARROW-5." This is the CORRECT discipline:
      pooling h(8)=13/18 into a planning constant would be exactly the "count verdict at
      k=8" NARROW-5 bars, and while a planning constant (never entering a conjunct) is a
      softer use than an evidential one, the file's choice to also exclude k=8 and use a
      round unweighted-span number is the more conservative, more clearly rule-compliant
      construction. I record this as: MY free choice was defensible but not NARROW-5-optimal;
      THE FILE's choice is NARROW-5-clean by construction. Numerically the two choices differ
      by only 4% (16.667 vs 16.0) and this alone would not materially change any power or
      resolution figure at the sample sizes in play. My continued-decay parameterization
      (arithmetic-mean-fixed split, giving lambda_4=22.22/lambda_16=11.11 at rho=2) also
      differs from the file's GEOMETRIC-mean-fixed split (lambda_4=22.627/lambda_16=11.314 at
      rho=2, per rho_parameterization: "lambda(4)=16*sqrt(rho), lambda(16)=16/sqrt(rho)").
      Both are legitimate, disclosed conventions; the file's is the one that is actually
      load-bearing since it is what a successor would adopt, and I use IT (not mine) in the
      post-seal exact recomputation below, so the comparison is apples-to-apples.
      NOTE ON design-proposal.yaml's OWN LANGUAGE: its proof_search_map.observation_collision
      states the plateau/decay totals are "exactly the same... under any parameterization
      holding the arithmetic mean fixed" - this is a true but SEPARATE mathematical fact
      about a DIFFERENT (arithmetic-mean) parameterization than the geometric one the pricing
      file actually implements (whose totals differ by the disclosed 6 percent, 32.000 vs
      33.941, in the same sentence). Both clauses are individually correct; a reader could
      momentarily conflate them as describing one parameterization. Recorded as a clarity
      note, not a defect - it does not change any conjunct, threshold, or figure.

    step_D_and_beyond_exact_recomputation_using_the_files_own_constants:
      summary: >-
        Recomputed EXACTLY (scipy, integrating over the Poisson-distributed pooled total,
        never conditioning on its expectation) using the FILE's own lambda_plan=16 and
        geometric-mean rho split, to test whether its arcsine (Cohen's h) normal-approximation
        sizing survives exact computation. Full worked table below. Script:
        /private/tmp/claude-501/-Volumes-SSD990-crypto-autoresearcher--claude-worktrees-goofy-jackson-f6a209/c7517fb0-2bef-40e9-ad10-341be13e53ed/scratchpad/post_seal_exact_check2.py
        (scratchpad, not a repository artifact).
      power_table:
        - {design: D-1, n: 2, rho: 2.0000, exact_power: 0.7591, claimed_arcsine: 0.800, diff: -0.041, within_disclosed_0.02_tolerance: false}
        - {design: D-1, n: 2, rho: 1.5833, exact_power: 0.4046, claimed_arcsine: 0.456, diff: -0.051, within_disclosed_0.02_tolerance: false}
        - {design: D-1, n: 2, rho: 1.4167, exact_power: 0.2460, claimed_arcsine: 0.288, diff: -0.042, within_disclosed_0.02_tolerance: false}
        - {design: D-2 (RECOMMENDED), n: 4, rho: 2.0000, exact_power: 0.9709, claimed_arcsine: 0.977, diff: -0.006, within_disclosed_0.02_tolerance: true}
        - {design: D-2 (RECOMMENDED), n: 4, rho: 1.5833, exact_power: 0.7108, claimed_arcsine: 0.744, diff: -0.033, within_disclosed_0.02_tolerance: false}
        - {design: D-2 (RECOMMENDED), n: 4, rho: 1.4167, exact_power: 0.4694, claimed_arcsine: 0.508, diff: -0.039, within_disclosed_0.02_tolerance: false}
        - {design: D-3, n: 8, rho: 2.0000, exact_power: 0.9998, claimed_arcsine: 0.9999, diff: -0.0001, within_disclosed_0.02_tolerance: true}
        - {design: D-3, n: 8, rho: 1.5833, exact_power: 0.9519, claimed_arcsine: 0.959, diff: -0.007, within_disclosed_0.02_tolerance: true}
        - {design: D-3, n: 8, rho: 1.4167, exact_power: 0.7789, claimed_arcsine: 0.799, diff: -0.020, within_disclosed_0.02_tolerance: borderline}
        - {design: D-4, n: 14, rho: 2.0000, exact_power: 1.0000, claimed_arcsine: 1.000, diff: -0.0000, within_disclosed_0.02_tolerance: true}
        - {design: D-4, n: 14, rho: 1.5833, exact_power: 0.9979, claimed_arcsine: 0.998, diff: -0.0001, within_disclosed_0.02_tolerance: true}
        - {design: D-4, n: 14, rho: 1.4167, exact_power: 0.9540, claimed_arcsine: 0.959, diff: -0.005, within_disclosed_0.02_tolerance: true}
      finding: >-
        The arcsine normal-approximation to the exact conditional-binomial power has a
        SYSTEMATIC OPTIMISTIC BIAS - every single exact power in the table above is LOWER
        than the claimed value, never higher - and the bias shrinks monotonically as n grows
        (largest at D-1's n=2, near-zero at D-4's n=14). For the RECOMMENDED design D-2, the
        bias EXCEEDS the pricing file's own disclosed "typically 0.02" tolerance at two of
        its three named alternatives: the realized-ratio check (claimed 74.4%, exact 71.1%,
        overstated by 3.3 points) and the Coordinator-prior target (claimed 50.8%, exact
        46.9%, overstated by 3.9 points). Against the preregistered minimum detectable effect
        rho_1=2 (the design's actual headline commitment), the exact power (97.1%) matches
        the claim (97.7%) within tolerance (diff -0.006). THIS IS A LOCALIZED,
        DISCLOSED-CATEGORY IMPLEMENTATION GAP, not an undisclosed error: caveat C3 explicitly
        names the arcsine sizing as provisional and states "THE BINDING FIGURES ARE THE EXACT
        CONDITIONAL-BINOMIAL VALUES the executor recomputes pre-arm," i.e. the pricing file
        itself designates these numbers as pending exact replacement, which is precisely the
        computation performed here. It does NOT overturn any qualitative conclusion the
        design draws from them: "honestly underpowered, about 74 percent" reads more
        accurately as "about 71 percent," and "about coin-flip, 51 percent" reads more
        accurately as "about 47 percent" - both corrections make the design's own
        self-assessed caution MORE true, not less, so no reader relying on the design's
        prose is misled by the arcsine numbers. It DOES mean a successor that read the
        arms_per_point_required or required_event_totals tables directly to size an arm count
        WITHOUT an exact recomputation could under-provision by a small margin; see the
        boundary check below for a concrete instance.
      sizing_table_boundary_check: >-
        Spot-checked three of the file's own arms_per_point_required entries by exact
        computation. (1) rho=2.0, n_80=2 [claimed to deliver >=80% power]: EXACT power at
        n=2 is 75.9%, UNDERSHOOTING the stated 80% target by 4.1 points - this specific table
        entry is WRONG under exact computation, though it is not used by the recommended
        design D-2 (D-2 uses n=4, not this n_80 sizing route). (2) rho=2.0, n_90=3 and
        n_95=4: exact powers are 91.1% and 97.1% respectively, both SAFELY (conservatively)
        EXCEEDING their targets - correct in the direction that matters. (3) rho=1.4167
        (Coordinator's stated target), n_95=14 [used by D-4]: exact power is 95.40%, which
        DOES clear the 95% bar, though by a margin of only 0.4 points - the claim holds under
        exact computation but is tighter than the arcsine sizing (95.9%) suggested.
      equivalence_boundary_check_n3_vs_n4: >-
        Independently and exactly confirms the pricing file's own account of why D-2 uses
        n=4 rather than n=3. Computing the EXACT Clopper-Pearson rho interval at the
        deterministic plateau expected count (T4=T16=16n): n=2 gives upper bound 1.6858 (FAILS
        rho*=1.5); n=3 gives upper bound 1.5241 (ALSO FAILS, and more decisively than the
        file's own characterization - the file calls n=3 "EXACTLY marginal, T=96 against
        96.04 required" under its normal-approximation sizing, but the EXACT computation
        shows n=3 misses by 1.6% in the upper-bound sense, a real miss rather than a
        knife-edge one); n=4 gives upper bound 1.4368 (PASSES, with a genuine if modest
        margin of 0.063 below rho*=1.5, sitting almost exactly at the low end of the file's
        own disclosed "roughly 1.44 to 1.46" Clopper-Pearson-widening estimate in caveat C4).
        CONCLUSION: the file's central design decision - n=4 is required, n=3 is not enough -
        is CONFIRMED by exact computation, and is in fact a cleaner call than the file's own
        "exactly marginal" language suggested. This is the single most consequential
        structural claim in the pricing file and it holds.
      branch_1_threshold_check: >-
        EXACT MATCH. Poisson(mean=4) upper-tail hand-summation in the file claims the
        rejection threshold at n=4, lambda_op=1 is T>=12 (P(X>=12)=9.16e-4<=0.001,
