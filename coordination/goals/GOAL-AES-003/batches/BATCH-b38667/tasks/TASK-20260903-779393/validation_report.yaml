  # ==================================================================
  # SEALED BLIND RE-DERIVATION (written before pooled-exposure-pricing.json
  # was opened)
  # ==================================================================
  blind_rederivation:
    required: true
    blind_from_respected: true
    blind_from_paths_declared:
      - coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-92ade4/pooled-exposure-pricing.json
    sources_consulted_before_seal:
      - ledger/evidence/EV-AES-868db1.yaml (h(4)_531001=17, h(16)=12, h(8)_531001=13, exact readings and CIs as committed, OBS-2/OBS-3)
      - ledger/evidence/EV-AES-ac5c12.yaml (h(4)_531002=21, h(8)_531002=18, OBS-3/OBS-6)
      - ledger/corrections/CORR-20260903-d3cab5.yaml (exact Garwood CI for 17 hits = [9.903, 27.219]; 29.2 disclaimed)
      - ledger/decisions/DEC-20260901-6f9de3.yaml (AMEND-1 verbatim - not load-bearing for the arithmetic, read for the custody check)
      - ledger/decisions/DEC-20260902-7ad3d9.yaml (NARROW-1/2/3 verbatim)
      - ledger/decisions/DEC-20260903-be4472.yaml (RAT-3/4/5, NARROW-4/5, next_action RANK 1)
      - coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-92ade4/design-proposal.yaml (full read; headline arm/cost totals only, no restated derivation, confirmed by its own separation_discipline field)
      - coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-92ade4/preregistration-skeleton.md (full read; rule statement and levels only, no derived numbers, confirmed by its own BLINDNESS-ENABLING SEPARATION note)
    quantity_statement_used: >-
      Per the review_plan's blind_rederivation block: for each candidate design, the pooled
      exposure (arms x 2^30 trials), the expected hit counts under (i) the constant-floor
      hypothesis, (ii) the continued-decay hypothesis, and (iii) the analytic null
      comparator; the exact Garwood 95% CIs at the realized readings 17, 21, 13, 18, 12; and
      the resulting discrimination power at the stated alpha.
    method_note: >-
      Computed with fresh Python (scipy.stats), never reading the producer's implementation.
      Free methodological choices I made independently (not dictated by any file I was
      permitted to read) are disclosed individually below so a reader can judge whether they
      match the producer's own free choices or diverge from them. The exact conditional
      binomial test (T4|T~Binomial(T,pi)) and the exact CP-mapped rho interval are dictated
      by preregistration-skeleton.md Section 5.2/5.3/5.4 (permitted reading); the power
      calculation exactly integrates over the Poisson-distributed T rather than
      conditioning on its expectation, because "the resulting discrimination power" as
      stated in the quantity is an unconditional design property, and a fixed-T
      approximation would not answer that question.

    step_A_garwood_cis:
      alpha: 0.05
      formula: >-
        Exact Garwood/Przyborowski-Wilenski Poisson CI: lower = 0 if x=0 else
        0.5*chi2.ppf(0.025, 2x); upper = 0.5*chi2.ppf(0.975, 2(x+1)).
      results:
        - {reading: h4_531001, x: 17, ci: [9.903, 27.219]}
        - {reading: h4_531002, x: 21, ci: [12.999, 32.101]}
        - {reading: h8_531001, x: 13, ci: [6.922, 22.230]}
        - {reading: h8_531002, x: 18, ci: [10.668, 28.448]}
        - {reading: h16, x: 12, ci: [6.201, 20.962]}
      cross_check: >-
        My computed CI for x=17 is [9.903, 27.219], exactly matching CORR-20260903-d3cab5's
        corrected value and NOT reproducing the disclaimed 29.2 citation error. This is a
        positive, independent confirmation of the correction.

    step_B_pooled_exposure_per_design:
      arm_totals_from_design_proposal_headline: {D-0: 7, D-1: 9, D-2-lite: 13, D-2: 17, D-3: 25, D-4: 37}
      cost_check: >-
        Every ladder rung's stated wall-clock compute divides exactly to 1620 s/arm (27
        min/arm, the lineage's own measured cost basis cited in the handoff constraints).
        This is a clean internal consistency check on the pricing file's cost column that I
        can verify without opening it, since the totals and the per-rung costs are both
        headline fields in design-proposal.yaml.
      per_point_arm_reconstruction: >-
        design-proposal.yaml discloses the full per-role breakdown of D-2 only (1 ramp-zero +
        6 null + 4 k4-primary + 4 k16-primary + 2 k8-secondary = 17) and enough qualitative
        structure to reconstruct D-0 (7 = 1 ramp-zero + 6 null, zero floor arms, per its own
        "runs no floor arm" statement) and D-2-lite (13 = D-2 minus the k8 secondary [2] minus
        two null arms [6->4], per its own stated description). D-1, D-3 and D-4 are NOT given
        an explicit per-role breakdown anywhere I was permitted to read; assuming the D-2
        pattern (ramp=1, null=6, k8=2) holds throughout, the arm counts decompose evenly to
        n=0 (D-1), n=8 (D-3), n=14 (D-4) primary arms per point. This is flagged as MY
        RECONSTRUCTION, unverified, not read from the pricing file.
      pooled_exposure_D2_primary_point: "4 x 2^30 = 4,294,967,296 trials per primary point (n=4)"

    step_C_expected_counts_D2:
      n_arms_per_primary_point: 4
      planning_prior_pooled_rate: >-
        lambda_bar = (17+21+12)/3 = 16.6667 per 2^30, computed from the three existing
        committed single-arm readings as a DESIGN-TIME planning constant only (never as test
        data - the preregistration's Section 1 item 16 bars the five committed readings from
        the actual test statistic, "new arms only").
      i_constant_floor:
        lambda_4: 16.6667
        lambda_16: 16.6667
        E_T4: 66.67
        E_T16: 66.67
      ii_continued_decay:
        parameterization: >-
          Holding the arithmetic mean (lambda_4+lambda_16)/2 fixed at lambda_bar (a
          convention I applied myself, motivated by the qualitative observation-collision
          remark permitted in design-proposal.yaml that plateau and rho=2 decay "produce
          nearly the same expected grand total... under any parameterization holding the
          arithmetic mean fixed" - this is a stated convention I chose to apply, not a
          derived number read from the pricing file).
        rho: 2.0
        lambda_4: 22.2222
        lambda_16: 11.1111
        E_T4: 88.89
        E_T16: 44.44
      iii_analytic_null_comparator:
        lambda_0: >-
          1.0 per 2^30, stated verbatim in preregistration-skeleton.md Section 4 item 2 as
          "the campaign's analytic comparator under the frozen excess_E convention"
          (permitted reading - this is a rule statement, not a derived number).
        E_T4: 4.00
        E_T16: 4.00

    step_D_discrimination_power_D2:
      test: >-
        Exact two-sided conditional binomial test of pi=0.5 on (T4,T16)|T, alpha=0.05
        (preregistration-skeleton.md Section 5.2/5.3), computed exactly by summing over the
        Poisson-distributed pooled total T under the alternative (not a fixed-T
        approximation).
      against_minimum_detectable_effect_rho1_2:
        E_T: 133.33
        true_pi: 0.6667
        power: 0.9683
        interpretation: >-
          The design has strong (~97%) power to reject the symmetric point when the true
          rate ratio is at the preregistered minimum detectable effect rho_1=2. This
          confirms the design is adequately powered against the effect size it explicitly
          commits to detecting.
      against_equivalence_boundary_rho_1p5:
        power: 0.6076
        interpretation: >-
          Power drops to ~61% at the equivalence-interval boundary rho=1.5 - materially
          weaker, as expected for any test near its indifference region.
      against_realized_data_implied_ratio_report_only:
        rho_implied: 1.5833
        power: 0.7177
        note: >-
          mean(17,21)/12 ~ 1.583, computed here purely as a sensitivity/consistency read
          against the realized single-arm point estimates - NOT part of any test statistic
          and never entering a branch decision, matching the preregistration's new-arms-only
          discipline.

    step_E_plateau_confinement_power_D2:
      test: >-
        Exact Clopper-Pearson interval for pi mapped to rho, containment in [1/1.5, 1.5]
        (preregistration-skeleton.md Section 5.4), computed exactly under TRUE plateau
        (rho=1), integrated over the Poisson-distributed T.
      true_rho: 1.0
      E_T: 133.33
      confinement_probability: 0.2260
      interpretation: >-
        Under TRUE plateau, design D-2 (n=4/point) has only about a 23% chance of actually
        composing the FM-PLATEAU-CONSISTENT sentence at the preregistered resolution
        rho*=1.5; the complementary ~77% (net of the near-zero comparator-branch
        probability) lands in FM-UNRESOLVED. This independently reproduces the qualitative
        shape of the design's own honest_prior_of_survival field in design-proposal.yaml
        (P(FM-PLATEAU-CONSISTENT)~0.20, P(FM-UNRESOLVED)~0.35), which I had already read
        (permitted) before sealing but which states only priors, not this conditional
        power computation - so the closeness is a genuine independent cross-check rather
        than a copy.

    step_F_resolution_vs_exposure_sanity_curve:
      note: Same two computations at n=1 (D-1) and n=8 (D-3, reconstructed), for context.
      results:
        - {design: "D-1 (n=1)", decay_power_rho1_2: 0.4182, plateau_confinement_rho_1p5: 0.0000, E_T: 33.3}
        - {design: "D-2/D-2-lite (n=4)", decay_power_rho1_2: 0.9683, plateau_confinement_rho_1p5: 0.2260, E_T: 133.3}
        - {design: "D-3 (n=8, reconstructed)", decay_power_rho1_2: 0.9998, plateau_confinement_rho_1p5: 0.7940, E_T: 266.7}
      interpretation: >-
        At n=1 arm per primary point (using ONLY new arms, per the new-arms-only
        discipline - this is not the same as the committed single-arm readings), decay
        power against rho_1=2 is only ~42% and plateau confinement is essentially zero.
        This confirms the Coordinator's pre-recorded prior that a single-arm-per-point
        design cannot decide the floor-versus-floor question and that meaningful
        resolution requires an exposure in the range the recommended design (D-2) occupies
        - though NOT "tens of pooled 2^30 arms" for the stated rho_1=2 effect specifically
        (D-2's 4 arms/point already reaches 97% power against rho_1=2); the prior's "tens
        of arms" more plausibly describes the FINER separation the Coordinator's own prior
        names (17 against 12 at 95%), which is a materially harder target than rho_1=2, as
        discussed in the comparison section below.

    script_location: >-
      /private/tmp/claude-501/-Volumes-SSD990-crypto-autoresearcher--claude-worktrees-goofy-jackson-f6a209/c7517fb0-2bef-40e9-ad10-341be13e53ed/scratchpad/blind_rederivation.py
      (scratchpad, not a repository artifact; full console output captured above verbatim)

