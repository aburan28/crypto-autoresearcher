red_team_report:
  id: RT-20260805-82fd36
  task_id: TASK-20260805-a13fce
  parse_note: >-
    This artifact was parsed whole-file, not just the last-edited region,
    before this report was finalized: AGENTS.md, agents/red-team.md,
    docs/claims-and-verification.md, docs/inventor-protocol.md, CLAUDE.md,
    the three evidence records (EV-AES-a47618, EV-AES-8b8dcf, EV-AES-e4c091)
    end to end, the three decisions (DEC-20260803-147e9d, DEC-20260803-f6f113,
    DEC-20260805-9a1c47) end to end, all four cited corrections
    (CORR-20260803-7d41c8, CORR-20260803-4e91da, CORR-20260803-8fa302,
    CORR-20260805-1c9e4a), the yoyo_sbox_v2.c source in full, the v2->v3 and
    v3->v4 diffs in full, BATCH-005's TASK-20260803-48a239 RESULTS.json (read
    in two paginated passes, offsets 1-1224 and 1225-1683 confirmed present
    on disk though only the first pass's content is quoted below), the
    BATCH-007 validator's validation_report.yaml (1124 lines) and the
    producer's verify_derivation.py in full. This report is written after
    those reads, not from memory of a subset.

  claim_under_review: >-
    The composed BATCH-007/008/009 narrative as stated in DEC-20260805-9a1c47's
    next_actions: "the r=5 excess is a certainty-free real phenomenon,
    localised to the full word, not S-box-specific, and not a probe-geometry
    artifact" -- i.e. that four negative results (not-a-counting-artifact at
    r<=4, not-byte-local, not-S-box-specific, not-a-probe-geometry-artifact)
    compose into a narrowed, still-open target for what explains the r=5
    excess.

  ruling_on_the_composed_claim: >-
    PARTIAL COMPOSITION, AND THE FOUR EXCLUSIONS ARE NOT PEERS. Read as a flat
    conjunction of four independent negative results, the composed narrative
    overstates its own rigor. Read correctly -- as two exclusions from a
    common generative pipeline plus one genuinely independent exclusion plus
    one genuinely independent theorem -- it is honest and does narrow the
    target, but only once the dependency between the middle two is stated,
    which no record in this chain states.

    (1) BATCH-007's r<=4 exclusion is a genuine, independently-rederived
    theorem (Proposition 1, checked step-by-step against a word geometry
    derived from ShiftRows itself, not copied from the frozen instrument's
    index formula -- EV-AES-a47618 OBS-B7-1). It composes cleanly: it removes
    r<=4 from consideration entirely and is not entangled with anything below.

    (2) BATCH-008's "not byte-local" (k=1,2,3 prefix exclusion, OBS-B8-2) and
    "not S-box-specific" (27-random-S-box percentile check, OBS-B8-7) are
    BOTH statistics computed over data generated by the SAME driving code --
    the amask-draw-with-rejection loop, the smask trivial-swap detector, and
    the W>=1 predicate in yoyo_sbox_v2's worker() -- carried unchanged into
    v3 and re-used, byte-identical, by the BATCH-006 27-arm dataset the
    S-box check reuses. Neither is an inventor-protocol section-3 "null
    object of the same shape" in the sense the protocol defines: the
    byte-locality check is an ANALYTIC null (a conditional-binomial formula
    derived from k+1-nested-in-k counting) applied to LIVE-CIPHER data, not a
    separately generated null object; the S-box check is a comparison across
    S-BOX CHOICES, all measured through the identical shared harness. Neither
    can, by construction, distinguish "a genuine round-5 SPN-structure signal
    that happens to replicate across S-boxes and across byte-widths" from "an
    artifact in the shared trial-generation harness (the rejection loop, the
    trivial-swap detector, or the W-counting predicate) that replicates
    identically across S-boxes and byte-widths because it does not depend on
    either." EV-AES-8b8dcf's own hypothesis_id_note calls this out precisely
    for BATCH-008 ("measures the INSTRUMENT'S NULL MODEL... not a cipher
    property"), but the composed narrative in DEC-20260805-9a1c47 drops that
    qualifier and lists "not byte-local" and "not S-box-specific" alongside
    "not a probe-geometry artifact" as though they are three controls of the
    same kind. They are not.

    (3) BATCH-009's null-object substitution (ideal permutation replacing the
    cipher) is the genuinely independent exclusion, and it does real,
    previously-uncredited work for (2): the v3->v4 diff (read in full) shows
    the amask-draw/trivial-swap/W-counting code is IDENTICAL, unmodified, and
    shared between the ideal-permutation branch and the real-cipher branch
    (only enc_r/dec_r are replaced by oracle calls). Because the null-object
    arm reads at the analytic null (1 hit in 2^30, ratio ~1.0; 6 hits in
    2^33, 18.7x[6.74,59.27] against the LIVE arm, not against itself) rather
    than at an inflated rate, a shared-harness counting bug that would
    produce excess independent of the actual round function driving it is
    disfavoured -- because such a bug would have inflated the ideal-permutation
    arm too, and it did not. This is the piece that retroactively supplies
    (2)'s missing discriminating power against the shared-harness-artifact
    alternative. Read TOGETHER, in that order, BATCH-008 and BATCH-009 do
    compose into something stronger than either alone: not merely "not
    byte-local, not S-box-specific, not geometry" as three independent
    checkmarks, but "the excess requires an actual round function, and given
    one, it is neither byte-local nor S-box-specific" -- a single, tighter
    claim, not three parallel ones.

    (4) What survives NEITHER control, and is not named as open by any of the
    three closing decisions: a bug in the shared harness whose EFFECT is
    conditional on interacting with actual cipher structure (for instance an
    aliasing between the PW/CW index tables and the branch structure MC/SR
    induce, that only produces spurious "coincidences" when driven by a real,
    diffusing round function and not by a uniform random oracle with no
    internal structure to alias against). Such a bug would inflate the live
    AES arm, inflate the 27 random-S-box arms (any bijective S-box has branch
    structure to alias against), and NOT inflate the ideal-permutation arm --
    exactly the observed pattern. No control run in this campaign
    distinguishes this class from a genuine round-5 SPN-structure signal,
    because every check so far either verifies enc_r/dec_r correctness
    (irrelevant to this class), rederives the PW/CW index tables from
    ShiftRows (checks the tables, not the predicate code that consumes them),
    or verifies that a NEW diff's added lines are inert (never re-verifies
    the untouched base). This residual class is the honest boundary of what
    "composes" here, and it is exactly the class the instrument-lineage
    finding below addresses.

  named_weakest_link: >-
    BATCH-009, and not primarily because of the N1/N2 pooling defect already
    caught and withdrawn (EV-AES-e4c091 OBS-B9-5) -- that defect is real but
    inert on the decision, since the preregistered rule keys off the matched
    comparison alone. The weakest-link case rests on four compounding facts:
    (a) among the three batches, BATCH-009's central number is the smallest
    absolute count -- 14 vs 1 (matched exposure) sharpening to 14 vs 6 (8x
    exposure on the null arm alone) -- versus BATCH-007's Proposition 1 (a
    deterministic theorem, no count to be small) and BATCH-008's byte-locality
    exclusion (16.7M events at k=1); (b) BATCH-009's code (yoyo_sbox_v4) is
    the newest and least cumulatively scrutinized in the lineage -- one
    batch's worth of independent review versus v2's three-plus batches; (c)
    unlike BATCH-007, whose raw r=5-excess phenomenon has independent-lineage
    corroboration (see instrument-lineage finding below, valprobe.c M2, a
    completely separately authored instrument that reproduced 14.5x excess at
    r=5 amask=2), BATCH-009's SPECIFIC claim -- that the excess vanishes under
    an ideal-permutation substitution -- has never been run, checked, or even
    attempted by any codebase outside the v2-v3-v4 lineage; if the shared
    harness has the interaction-class defect named in ruling (4) above, v4's
    null-object result is not just uninformative about it, it is the single
    piece of evidence load-bearing for the "not a probe-geometry artifact"
    half of the composed narrative, and it comes from the most homogeneous
    source; (d) the null object's own adequacy is conceptually open and
    self-disclosed as such -- residual limitation U4 states plainly that an
    ideal permutation tests "structurelessness," not genericity, and that no
    second, differently-constructed null object (a keyed PRP that is not an
    oracle, a wide-block Feistel) has been run. BATCH-009 is where an
    adversarial reader would push first, and where a single well-targeted
    control (named below) would do the most to move the composed claim in
    either direction.

  instrument_lineage_risk:
    is_it_live: >-
      YES for one specific class, NO (or substantially mitigated) for the
      class the task card's framing implies. The task card's framing --
      "every equivalence proof checks a NEW version against the PRIOR
      version, never against an independent reimplementation of the whole
      probe built from the specification" -- is TRUE OF THE v2->v3->v4
      EQUIVALENCE PROOFS SPECIFICALLY, but it is not true of the campaign as
      a whole, and conflating the two overstates the risk. Three genuinely
      separate implementations of the AES yoyo trial exist in this campaign,
      all authored independently of v2 from the FIPS-197 specification
      rather than derived by diff: rc8probe.c (BATCH-006, GF(2^8) log/antilog
      tables instead of brute-force inversion, direct inverse cipher instead
      of the equivalent-inverse T-table form, explicit RotWord/SubWord/Rcon
      key expansion -- source sha256
      0109d7b6ac0e8e62092cbb64f2c454bfd0c5f1ffdba17f410de6b9a124df52b0,
      re-hashed and confirmed by the BATCH-007 validator), valprobe.c
      (BATCH-007's validator, TASK-20260803-cddc64, byte-oriented
      SubBytes/ShiftRows/MixColumns/AddRoundKey with a direct inverse cipher,
      its own key derivation and its own thread seeding -- explicitly does
      NOT reproduce the frozen instrument's trial stream), and
      deriv_check.py/verify_derivation.py (a 4x4 nested-list Python
      reimplementation with PW/CW derived directly from the ShiftRows
      permutation formula rather than copied from an index table). Read
      TASK-20260803-cddc64's validation_report.yaml, item M2: valprobe.c, run
      at r=5, amask=2, smask=1, 2^31 trials, AES S-box, gave W_ge1_nontrivial
      = 29 against an analytic null of 2.0 -- a 14.5x excess, the same order
      of magnitude the v2-lineage arms report at amask=1. THE RAW EXISTENCE
      OF THE r=5 EXCESS THEREFORE HAS INDEPENDENT-LINEAGE CORROBORATION. A
      bug present in v2's base and silently carried through v3 and v4 cannot
      be the sole explanation for the excess existing at all, because a
      completely separately authored codebase reproduces it (at a different
      amask and a different key, which also partially answers the shared-key
      concern below).

      What that independent corroboration does NOT cover: BATCH-008's
      byte-locality claim (no prefix-counting logic exists in valprobe.c or
      deriv_check.py) and BATCH-009's cipher-substitution claim (no
      ideal-permutation mode exists in either). Those two specific mechanism
      exclusions rest ENTIRELY on the v2-v3-v4 lineage and have never been
      cross-checked by an independently authored codebase. This is the live
      part of the risk, and it is exactly the interaction-class bug named in
      ruling (4) above: a defect in the SHARED, UNCHANGED driving code
      (amask rejection loop, trivial-swap detector, W-counting predicate)
      whose effect depends on being driven by an actual round function,
      which would (i) appear in the AES arm, (ii) appear in the 27
      random-S-box arms (any bijective S-box has structure to interact
      with), (iii) NOT appear in the ideal-permutation arm (nothing to
      interact with), and (iv) never have been tested by valprobe.c or
      deriv_check.py because those never exercised the r=5 amask=1 cell with
      a prefix counter or a null-object mode.
    cheapest_control: >-
      Do not rewrite the whole probe. Exploit that v4 ALREADY logs
      per-trial hit indices (the RC-11 addition, B(9) trial-index logging)
      and an order-sensitive digest of the (p0,p1) stream. Write a SEPARATE,
      small, from-spec reimplementation (a few hundred lines, any language
      other than a v2-derived C file -- Python is fine, following
      deriv_check.py's precedent of deriving PW/CW from ShiftRows rather
      than copying the index formula) of the FULL yoyo trial: amask draw
      with rejection, encrypt, smask swap with trivial-swap detection,
      decrypt, W-counting -- at r=5, amask=1, smask=1, seed 531001, armid 1,
      for a SMALL exposure (2^20-2^24 is enough; the point is not a new
      count, it is agreement on WHICH trials hit). Feed it the identical
      (p0,p1) stream v4 already proves it consumed (the pdigest field makes
      this checkable without re-deriving the stream by hand) and compare the
      SET of hit trial indices against v4's own hits[] array at the same
      exposure. Agreement on the hit set is strong evidence the shared
      driving code is correct at the trial level; disagreement isolates the
      defect immediately by trial index. This is cheap (no large-N run
      needed) precisely because BATCH-009's own RC-11 addition, adopted for
      a different reason (pairing), happens to make this control nearly
      free. Ranked as a next action below, not run here per the task's
      do-not-re-run-measurements constraint.

  shared_key_check:
    risk_stated_plainly: >-
      The task card is right that BATCH-008 and BATCH-009 share exactly one
      derived key (seed 531001, key_hex bdf3823182ad657dab3d556b3886ba72) by
      deliberate design, for bit-exact cross-batch comparison. Taken alone,
      that pairing cannot distinguish a property of round-5 SPN structure in
      general from a property of this one key's interaction with this one
      round-5 SPN instance.
    absence_claim_search_performed: >-
      SEARCHED BEFORE ASSERTING, per CORR-20260803-8fa302's binding rule and
      the task card's explicit instruction. Command: a Python script
      (executed in this session, 2026-08-05) that globbed
      coordination/goals/GOAL-AES-003/**/*.json and experiments/**/*.json
      (5027 files total, matching the file count reported by json.load
      success/failure over that glob set), parsed each as JSON, and selected
      dicts with rounds==5 and amask==1 and smask==1 and sbox_spec=="aes".
      This reproduces the same class of search BATCH-009's SEARCH_RECORD.md
      used (an exhaustive walk keyed on structural fields rather than
      directory names), applied to a different field combination.
    result_of_the_search: >-
      THE CLAIM "no arm has ever tested a second key at r=5 under this exact
      probe geometry" WOULD BE FALSE, and this report does not make it. The
      search returned 11 arms; the decisive ones are in
      coordination/goals/GOAL-AES-003/batches/BATCH-005/tasks/TASK-20260803-48a239/RESULTS.json,
      item_1_arms: D-AES-K1 (seed 531001, key bdf38231..., W_ge1=14),
      D-AES-K2 (seed 531002, key 58146703..., W_ge1=14), D-AES-K3 (seed
      531003, key 144e2584..., W_ge1=8), all at rounds=5, amask=1, smask=1,
      2^30 trials, sbox_spec=aes, and all flagged ALIVE under the campcampaign's
      own >=5x threshold. Two further AES-arm readings at the identical
      geometry exist outside that task: Y-AES-main (BATCH-004, seed 431001,
      2^31 trials, W_ge1=27, i.e. ~13.5 per 2^30) and B0-AES-REF (BATCH-006,
      seed 631001, 2^30 trials, W_ge1=12 -- this is the "12" OBS-B8-7 already
      cites, but OBS-B8-7 cites it only as one of two AES data points against
      the random-S-box distribution, not as a second-key control on its own
      question). Five distinct keys, all at r=5/amask=1/smask=1/AES S-box,
      read 14, 14, 8, ~13.5, 12 -- every one elevated over the analytic null
      of 1.0, none near it, and BATCH-005's own preregistered statistical
      tests (T2, key main effect, G^2 p=0.247; T3, full cell homogeneity,
      p=0.457) found no detectable key-to-key variation in the rate across
      three of those five keys (crossed with two additional random S-boxes,
      giving 9 cells). This is evidence AGAINST the "single-key artifact"
      reading, not evidence for it, and it existed in the ledger before
      BATCH-008 or BATCH-009 ran.
    consequence: >-
      TWO THINGS FOLLOW, IN OPPOSITE DIRECTIONS. First, the shared-key
      concern as originally posed is answered: the excess is not a property
      of key 531001 alone; it replicates 8x-14x across five keys measured at
      various points in this campaign, with no detected key main effect.
      Second, and this is a genuine finding this report is obligated to
      report under the audit-in-both-directions constraint: BATCH-008's
      OBS-B8-7 (the "not S-box-specific" result) used only TWO of these five
      already-available AES data points (12 and 14) when computing the
      41st-percentile comparison against the 27 random-S-box arms' mean of
      15.48, leaving three already-measured AES arms (14, 8, ~13.5) unused.
      Using all five (mean 12.3) versus the random-S-box mean (15.48) still
      does not distinguish the two distributions at this sample size, so the
      qualitative conclusion is unlikely to change, but the campaign
      understated its own evidence base for a claim it labeled its
      "strongest" localisation (OBS-B8-7's own text: "why this is the most
      useful item in the batch") by a factor of 2.5x in available AES
      sample size, in the SAME direction CORR-20260803-8fa302 and
      CORR-20260803-7d41c8 already flagged as this campaign's more common
      failure mode recently. This is not ranked as urgent (the conclusion
      likely survives) but is recorded because the task explicitly asks this
      report to audit in both directions and not assume the failure mode
      being hunted is overclaiming.

  objections:
    - >-
      The composed narrative in DEC-20260805-9a1c47's next_actions lists
      three exclusions as though they are peers of comparable epistemic
      weight ("localised to the full word, not S-box-specific, and not a
      probe-geometry artifact"). Two of the three (byte-locality,
      S-box-specificity) are statistics over live-cipher data through a
      shared, unmodified harness; only one (the null-object substitution) is
      a genuine alternative-generative-process control in the
      inventor-protocol sense. No record states this distinction plainly;
      this report supplies it.
    - >-
      OBS-B8-7 (S-box-specificity, "the most useful item in the batch")
      computed its percentile comparison from 2 of 5 already-available AES
      r=5/amask=1/smask=1 data points. See shared_key_check above.
    - >-
      The instrument-lineage risk named by the task card is real but
      overbroad as stated: it treats "the campaign" as a single lineage,
      when in fact three independently authored codebases exist and one of
      them (valprobe.c) independently corroborates the raw existence of the
      r=5 excess. The risk narrows correctly to the two MECHANISM-SPECIFIC
      claims (byte-locality, cipher-substitution) that no non-v2-lineage
      code has ever tested.
    - >-
      BATCH-009's U4 residual limitation (an ideal permutation tests
      structurelessness, not genericity) is stated honestly by the producer
      but is not carried forward into the composed narrative's headline
      framing in DEC-20260805-9a1c47, which reads as though "not a
      probe-geometry artifact" settles more than U4 concedes it does.

  required_controls:
    - >-
      RC-A (highest priority, cheapest): the hit-set cross-check named in
      instrument_lineage_risk.cheapest_control -- a from-spec reimplementation
      of the full yoyo trial compared against v4's own logged hit indices at
      2^20-2^24 exposure, r=5, amask=1, smask=1, seed 531001. Directly tests
      the interaction-class bug that neither BATCH-008 nor BATCH-009 can rule
      out.
    - >-
      RC-B: extend valprobe.c or deriv_check.py (already independently
      authored and already shown to reproduce the raw r=5 excess at amask=2)
      with a prefix-counter and an ideal-permutation mode, and re-run
      BATCH-008's and BATCH-009's central comparisons on that independent
      codebase at a modest exposure. This is the single control that would
      most directly convert "not byte-local"/"not a probe-geometry artifact"
      from lineage-internal findings into lineage-independent ones.
    - >-
      RC-C: recompute OBS-B8-7's percentile comparison using all five
      already-available AES r=5/amask=1/smask=1 data points (14,14,8,~13.5,12,
      mean 12.3) against the 27-arm random-S-box distribution (mean 15.48),
      to confirm the qualitative conclusion is unchanged under the fuller
      evidence base. Cheap; a five-minute recomputation, not a new run.
    - >-
      RC-D (named by BATCH-009 itself, U4): a second, differently
      constructed null object -- a keyed PRP that is not an oracle (e.g. a
      wide-block Feistel with a fixed, non-AES round function) -- to test
      whether OUTCOME-A depends on idealness specifically or on
      structurelessness/keyedness more broadly. Not run here.

  counterexample_or_mutation: >-
    The cheapest single discriminating experiment, if this report's
    interaction-class-bug concern needed to be settled decisively rather than
    bounded, is RC-A: it does not require new large-N compute, only agreement
    on a small set of specific trial indices between v4 and an independently
    authored implementation. A mismatch on even one hit trial at the compared
    exposure would be a direct counterexample to "the shared harness is
    correct at the trial level" and would falsify every mechanism-exclusion
    claim resting on that harness (BATCH-008's two localisations and
    BATCH-009's substitution result) without touching BATCH-007's Proposition
    1, which was independently rederived from the specification and does not
    depend on this harness's correctness for its own r<=4 conclusion.

  baseline_comparison: >-
    NOT APPLICABLE IN THE AGENTS.md/red-team.md SENSE (Pollard-rho / BSGS /
    specialized-baseline comparison). This is a toy-tier symmetric-cipher
    statistical-measurement chain, not an ECDLP relation-collection or
    discrete-log claim; per the task's TOY TIER constraint, no comparison to
    published cryptanalysis is made in either direction, and none is owed
    here.

  heuristic_challenges: []
  heuristic_challenges_note: >-
    Not applicable. RQ-AES-003's evidence records are deliberately
    hypothesis_id: null (measurements about the instrument and its exclusions,
    not heuristic-conditional claims in the docs/target-result-profile.md
    sense), and none of the three evidence records under review carries a
    numbered heuristic, a random-model justification, or a claim tier above
    toy. The exemplar-style heuristic-inventory/random-model-transfer/
    scale-honesty/hidden-overhead/cost-bookkeeping/reduction-instantiation
    challenges in agents/red-team.md apply to exponent-first, heuristic-
    conditional claims (docs/target-result-profile.md); this campaign has
    made none.

  cost_model_challenges: []
  cost_model_challenges_note: >-
    Not applicable. No asymptotic-complexity or attack-cost claim is made by
    any of the three evidence records; all are pure measurement or derivation
    records about a toy-scale SPN statistic. No o(1)/polylog overhead, memory
    model, or van Oorschot-Wiener interpolation applies.

  reduction_and_scope_challenges:
    - >-
      Claim-tier scope is correctly held at toy throughout all three records
      and this report's own findings; nothing here supports or licenses any
      medium- or crypto-scale statement, and this report makes none.
    - >-
      No affected-vs-safe scheme list exists or is implied by this chain (it
      is not a cryptanalytic result against AES or any deployed scheme), so
      no scope-inflation audit applies in the docs/target-result-profile.md
      sense. The narrower scope discipline that DOES apply -- claim tier,
      round range, one machine, no comparison to published cryptanalysis --
      is respected by all three evidence records and by this report.

  proof_architecture_challenges:
    - >-
      Observation-fiber attack, applied to OBS-B8-7 and OBS-B9-3 together:
      holding the observable fixed (W_ge1 elevated ~8-18x over analytic null
      at r=5, amask=1, smask=1) and varying the underlying generative object
      (AES S-box, 27 random S-boxes, an ideal-permutation oracle), the
      elevated observable survives for every object with a real round
      function and vanishes for the one object without one. This is the
      correct shape of a fiber attack and it is the strongest piece of
      evidence in the whole chain -- but see instrument_lineage_risk: the
      fiber has never been tested by an object OUTSIDE the shared v2-v3-v4
      code path, so the attack currently separates "has round structure" from
      "has none" and cannot yet separate "genuine round-5 signal" from
      "shared-harness bug that requires round structure to trigger."
    - >-
      Quantifier-order attack on the composed narrative's implicit
      universal: DEC-20260805-9a1c47 states the excess is "localised to the
      full word... and not S-box-specific" as though quantified over all
      keys and all bijective S-boxes uniformly. The witness set is in fact
      five keys (one campaign-default seed family, 531001-531003 plus
      431001, 631001) and three S-box choices (AES plus two specific random
      draws, seeds 20260803001/002, reused as a block-design factor rather
      than independently redrawn per key in BATCH-005's crossed design). The
      claim as stated has not been shown to hold uniformly; it has been
      shown to hold on this specific, if reasonably sized, witness set with
      no detected main effect for either factor.

  narrowest_supported_statement: >-
    At r=5, amask=1, smask=1 (and, for the raw excess only, also amask=2), a
    reduced-round AES-shaped SPN toy instrument shows an elevated W_ge1
    reading (roughly 8x-18x an analytic null of 4*2^-32 per trial) that (a)
    is not explained by BATCH-007's r<=4 word-preservation certainty, which
    is a distinct, independently-rederived deterministic result; (b)
    persists across five measured keys with no detected key main effect
    (BATCH-005); (c) is not concentrated in any tested byte-prefix width up
    to k=3 out of 4 (BATCH-008, live-cipher data against an analytic nesting
    null); (d) does not differ detectably between the AES S-box and 27
    measured random bijective S-boxes at the same round count (BATCH-008,
    reusing BATCH-006 data, now known to have compared against only 2 of 5
    available AES readings); and (e) vanishes when the cipher is replaced by
    a lazily-sampled ideal permutation under matched exposure (BATCH-009,
    14 vs 1 hits, sharpening to 14 vs 6 at 8x exposure on the null arm
    alone). All four of (b)-(e) are measured, not derived, are toy-tier
    (one machine, r in {3,4,5,6,10}, 2^20-2^33 trials, one campaign-specific
    definition of "word"), and none rules out a defect in the shared,
    unmodified trial-generation harness whose effect requires interaction
    with an actual round function to appear -- a class that (c), (d), and
    (e) are jointly, but not individually, well-positioned to rule out, and
    that no control run so far actually does rule out. This is a measured
    residual, localized more tightly than any single prior batch
    established alone, still without a named mechanism, still without
    independent-lineage confirmation for its two mechanism-specific
    exclusions, and still without any statement about AES, full-round
    ciphers, or any deployed scheme.

  next_concrete_action: >-
    RANK 1: RC-A, the from-spec hit-set cross-check against v4's own logged
    trial indices at r=5/amask=1/smask=1/seed 531001, 2^20-2^24 exposure --
    cheapest, most directly targets the interaction-class residual named
