  closure_ruling:
    ruling: >-
      FURTHER PURSUIT IS WARRANTED. This is not a closure candidate and this
      report does not treat it as one; it also does not counsel indefinite
      continuation without a stated boundary.
    evidence_basis: >-
      Three toy-tier, moderate-strength, single-reviewer evidence records
      (EV-AES-a47618, EV-AES-8b8dcf, EV-AES-e4c091), a measured residual that
      has survived four independent exclusions when read correctly (r<=4
      certainty, byte-locality, S-box-specificity, cipher-substitution) with
      one of those four (S-box-specificity, jointly with cipher-substitution)
      only becoming a genuine discriminator once read together rather than
      separately, and one independent-lineage corroboration of the raw
      excess's existence (valprobe.c M2) that has not yet been extended to
      the two mechanism-specific claims.
    budget: >-
      RC-A and RC-C together are well under an hour of compute and analysis
      (RC-A needs no exposure beyond 2^24; RC-C is arithmetic on data already
      on disk). RC-B is comparable to a single BATCH-00x producer task
      (roughly the 5400s scale BATCH-008/009 each used). RC-D is a genuinely
      new instrument and should be budgeted like BATCH-009 was (producer
      task plus independent validator, no red team required until it returns
      a result that changes the picture).
    test_boundary: >-
      Everything above stays inside: toy-tier, r in {3,4,5,6,10}, one
      campaign-specific yoyo statistic and word/byte-prefix definition, no
      claim about full-round or deployed AES, no comparison to published
      cryptanalysis. A revisit condition that would change this boundary
      (e.g., extending to more rounds, other SPN shapes, or any claim beyond
      toy tier) is not proposed here and is out of this report's scope.
    remaining_uncertainty: >-
      No mechanism is named for the r=5 excess by this report or by any of
      the three batches under review, and none should be inferred from this
      report. The residual class named in instrument_lineage_risk (a
      shared-harness defect requiring interaction with an actual round
      function) remains open and untested. The 32-bit-vs-24-bit localization
      question (EV-AES-8b8dcf boundary) remains open. Whether OUTCOME-A
      depends on idealness specifically versus mere structurelessness (U4)
      remains open. Whether the excess is round-5-specific versus a
      broader small-round-count phenomenon that r=6/r=10's near-null
      readings merely fail to have enough exposure to detect is not
      addressed by any record reviewed here and is not addressed by this
      report either.
    concrete_next_construction_or_revisit_condition: >-
      Revisit this closure ruling once RC-A returns: if the from-spec
      hit-set cross-check disagrees with v4's logged hits at ANY trial
      index in the compared exposure, treat BATCH-008's and BATCH-009's
      mechanism-exclusion claims as INVALID_MEASUREMENT pending repair, not
      as weakened evidence -- a harness defect is an infrastructure fact
      under AGENTS.md rule 5, not mathematical evidence in either direction.
      If RC-A agrees exactly, that is real, if partial, corroboration and
      the next construction is RC-B (independent-lineage replication of the
      two mechanism-specific exclusions), ranked ahead of any new
      round-count or geometry sweep, because a lineage-independent
      confirmation of BOTH exclusions is worth more evidentially than any
      single additional measured point on the existing v2-lineage
      instrument.

