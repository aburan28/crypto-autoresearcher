  deliverable_rulings:
    weakest_link_ruling: >-
      CORRECT AS STATED. The red team names BATCH-009 as the weakest link
      on four compounding, independently checkable facts: smallest absolute
      count among the three batches (14 vs 1, sharpening to 14 vs 6 at 8x
      exposure); newest and least cumulatively scrutinized code in the
      lineage; the specific claim that the excess vanishes under an
      ideal-permutation substitution has never been tested outside the
      v2-v3-v4 lineage (unlike the raw excess itself, which valprobe.c
      independently corroborates); and the null object's own conceptual
      adequacy is self-disclosed as open (U4: idealness tested, not
      genericity, no second null-object construction run). I independently
      re-verified the raw counts (14 vs 1/6, from BATCH-009's own numbers as
      quoted and cross-checked against the v3-to-v4 diff's RC-11 logging
      mechanism), the valprobe.c corroboration of the raw excess (M2: 29
      hits vs null 2.0, 14.5x, at a different amask and key), and the
      absence of any prefix-counter or ideal-permutation mode in the two
      non-v2-lineage codebases visible in this session (rc8probe.c and
      valprobe.c via its validator report). This ruling holds and is not
      weakened by the PW/CW correction above, which concerns the
      illustrative mechanism named in the residual-risk discussion, not the
      weakest-link ranking itself.
    instrument_lineage_ruling: >-
      LARGELY HOLDS, with the same qualification the predecessor recorded
      and that I independently re-derived above by direct source
      inspection: the illustrative "PW/CW aliasing" mechanism is not
      mechanically possible in yoyo_sbox_v2.c/v4.c as written, though the
      general class of risk it illustrates (a shared-harness defect whose
      effect requires interaction with actual round-function structure) is
      real, correctly named, and unruled-out by any control run in this
      campaign. The claim that three genuinely independent, spec-derived
      codebases exist (rc8probe.c, valprobe.c, deriv_check.py/verify_derivation.py)
      and that valprobe.c independently corroborates the raw existence of
      the r=5 excess at a different amask and key is independently
      re-verified here (sha256 match on rc8probe.c; exact M2 figures
      reproduced from the BATCH-007 validator's own committed report). The
      narrower claim -- that the two mechanism-specific exclusions
      (byte-locality, cipher-substitution) have never been tested outside
      the v2-v3-v4 lineage -- was checked by directory-scoped inspection of
      the named codebases and their governing validator report in this
      session; no prefix-counter or ideal-permutation logic was found. This
      report did not perform an exhaustive whole-repository grep for such
      logic under a different name, so this narrower sub-claim is confirmed
      to the same partial standard the predecessor recorded, not to a
      stronger one.
    shared_key_ruling: >-
      HOLDS, independently re-derived from BATCH-005's raw RESULTS.json in
      this session rather than trusted from either prior report: three
      distinct AES-keyed arms with distinct key_hex values read 14, 14, 8
      at r=5/amask=1/smask=1, with T2 (key main effect) p=0.247 and T3
      (full cell homogeneity) p=0.457 pulled as raw floats and matching
      exactly. The secondary finding -- OBS-B8-7 used only 2 of 5
      already-available AES data points -- is independently confirmed by
      directly re-reading EV-AES-8b8dcf's own statement text, which reads
      "the AES arms read 12 and 14," not the fuller five-point set the red
      team assembles. This is a real, self-reported understatement of the
      campaign's own evidence base, correctly flagged as non-urgent by both
      prior reports because the qualitative conclusion (AES not
      distinguishable from the random-S-box distribution at this sample
      size) is unlikely to change under the fuller set.
    closure_ruling_proportionality: >-
      PROPORTIONATE. "Further pursuit warranted, not closure" correctly
      avoids both premature closure (docs/inventor-protocol.md section 4's
      binding concern) and unbounded continuation: it names a concrete,
      bounded test boundary (toy-tier, r in {3,4,5,6,10}, one
      campaign-specific statistic, no claim about full-round or deployed
      AES), a concrete revisit condition keyed to RC-A's result (agreement
      -> proceed to RC-B; any disagreement -> treat the mechanism-exclusion
      claims as invalid_measurement pending repair, correctly per AGENTS.md
      rule 5's treatment of infrastructure defects as non-evidence in
      either direction, not as weakened evidence), and a ranked, costed set
      of next controls. My own independent recomputation of RC-A's exposure
      arithmetic means a Coordinator adopting this closure ruling verbatim
      would under-budget RC-A by roughly 16-64x if executed at the exposure
      literally stated; the ruling's qualitative shape (rank-1 priority,
      cheap relative to RC-B/RC-D, revisit condition keyed to its result)
      is otherwise sound and proportionate to what has actually been found.

  overstatement_or_understatement_audit:
    - direction: red team OVERSTATED
      finding: >-
        The "PW/CW index tables aliasing with MC/SR branch structure"
