  control_checks:
    - control: >-
        The illustrative "PW/CW index tables aliasing with MC/SR branch
        structure" mechanism named in the red team's ruling (4) and
        instrument_lineage_risk, checked directly against yoyo_sbox_v2.c
        (the shared ancestor) and the v3-to-v4 diff, independently of the
        predecessor's identical claim.
      finding: >-
        THE PREDECESSOR IS RIGHT; THE RED TEAM OVERSTATED MECHANISTIC
        PRECISION IN THIS ONE ILLUSTRATIVE EXAMPLE. Read yoyo_sbox_v2.c in
        full. build_geom() sets PW[j][row] and CW[j][row] as byte-offset
        constants (0-15) into a flat 16-byte state array. worker() uses
        PW/CW ONLY as array indices: PW indexes p1[]/d[] when drawing the
        active-word randomisation and when counting W (the "all-zero PW[j]
        row" test); CW indexes c0[]/c1[] when performing the ciphertext-word
        swap and its trivial-swap detector. Neither table is ever passed
        into, read by, or referenced from inside enc_r()/dec_r(). Those two
        functions implement the actual SubBytes+ShiftRows+MixColumns
        (forward) and their inverses entirely through the T0-T3/U0-U3
        lookup tables built once in build_tables() from the loaded S-box;
        worker() calls enc_r/dec_r as opaque black-box functions on the
        full 16-byte buffer and never touches their internal per-byte
        indexing. There is consequently no code path in this source where
        the PW/CW index tables and the T/U-table SB+SR+MC internals are
        jointly referenced, so a literal "aliasing" between the two named
        table structures, as stated, is not mechanically possible in this
        implementation as written. Confirmed further by the v3-to-v4 diff
        (read in full independently in this session): the amask-draw
        rejection loop, the CW-indexed swap/trivial-swap detector, and the
        PW-indexed W-counting loop are byte-identical text between v3 and
        v4, with the only branching being on enc_r/dec_r call sites
        (wrapped in `if(J->idealperm)`), so this finding transfers to v4
        (the code actually driving BATCH-009's null-object result) without
        needing to re-derive it from v4's source directly. The red team
        does correctly hedge the example with "for instance" -- it is
        offered as an illustration of a class of risk, not asserted as a
        located bug -- which is the correct epistemic posture, but the
        specific phrase still overreaches: a reader taking "PW/CW aliasing
        with MC/SR" literally would be looking for a bug that cannot exist
        in this code as written. The GENERAL class of risk the illustration
        is meant to gesture at -- an unlocated defect in the harness's own
        shared rejection/swap/counting logic whose apparent behavior could
        differ between structured (real-cipher) and unstructured
        (ideal-permutation) input for a reason not yet identified or
        located -- remains real, remains correctly unruled-out by any
        control run in this campaign, and is not weakened by this
        correction. This finding is a correction to one illustrative
        example, not to the report's substantive conclusion.
    - control: >-
        RC-A's proportionality claim, checked by direct recomputation
        against the campaign's own established rate rather than accepted
        from either prior report.
      finding: >-
        CONFIRMED UNDERSTATED, independently, per metric_recomputations
        above. RC-A remains correctly the right KIND of check (a from-spec
        reimplementation cross-checked against v4's own logged hit indices
        directly tests the interaction-class residual named above without
        needing new large-N compute if targeted correctly) and correctly
        ranked first (it is the cheapest available control that could
        directly falsify the shared harness's correctness at the trial
        level), but its stated 2^20-2^24 exposure ceiling is arithmetically
        inadequate to reliably produce even one comparable hit event, let
        alone enough for a meaningful agree/disagree comparison. A
        Coordinator adopting RC-A should either raise its target exposure
        toward 2^28-2^30, or -- cheaper still, and not proposed by either
        prior report -- target the reimplementation specifically at the
        trial indices already logged in v4's existing hits[] arrays from
        its BATCH-009 2^30-2^33 runs (RC-11's trial-index logging makes
        this possible without any new large-N run at all, since the
        specific indices to reproduce are already known and bounded).
    - control: >-
        Shared-key risk and the absence-claim search discipline
        (CORR-20260803-8fa302), spot-checked independently against
        BATCH-005's raw RESULTS.json.
      finding: >-
        CONFIRMED, independently re-derived from raw JSON (not from either
        prior report's summary). D-AES-K1/K2/K3 read 14/14/8 under three
        distinct key_hex values; T2 (key main effect) p=0.247, T3 (full
        cell homogeneity) p=0.457, both pulled as raw floats from the
        source file. This is evidence against a single-key-artifact
        reading, exactly as both the red team and the predecessor state,
        and it existed in the ledger before BATCH-008 or BATCH-009 ran.
        OBS-B8-7's own text was independently re-read and confirms it used
        only "12 and 14" (two AES data points) in its percentile
        comparison, exactly as both prior reports state -- an
        understatement of the campaign's own available evidence base that
        both reports correctly flag as real but non-urgent (the qualitative
        41st-percentile-style conclusion is unlikely to change using the
        fuller five-point set).

