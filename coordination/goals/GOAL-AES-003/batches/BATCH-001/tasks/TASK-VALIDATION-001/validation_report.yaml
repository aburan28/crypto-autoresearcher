  overstatements_and_scoping_defects:
    - id: OS-1
      severity: high
      where: count5 DISPATCHER-VERIFICATION.json what_this_establishes; and any
             summary describing count5 as a property "of 5-round AES-128"
      text: >-
        THE PROPERTY IS NOT AES-SPECIFIC. Both the r=4 bijection and the r=5
        mod-8 forcing follow from the round GEOMETRY alone: any bijective
        S-box, any column-preserving mixing layer whose relevant entries are all
        nonzero, ShiftRows-style row rotations, and a full diagonal coset. I
        confirmed this by execution - uniformly random bijective S-boxes
        reproduce both properties at 120/120 and 120/120 in my scaled analogue.
        The correct description is "a derived deterministic property of any
        5-round AES-SHAPED SPN, instantiated here on AES-128", and the correct
        consequence is that it distinguishes 5-round AES from a random
        permutation but carries no information about the AES S-box. Nothing in
        the package states this and it is the single largest scoping gap I
        found. It does not weaken C1-C5; it relabels what they are about.
    - id: OS-2
      severity: medium
      where: C9 / scaled7 framing as a "proof of non-transfer"
      text: see C9 overstatement. It is a proof that the DEGREE ARGUMENT does
            not transfer, not that the property does not.
    - id: OS-3
      severity: medium
      where: C6 - the missing and void exact positive controls
      text: >-
        The package's honest-limits lists mention the void r=3 reading, but no
        summary states the consequence: after the void, EVERY surviving PR-A
        control predicts zero, so the instrument was never shown able to produce
        a correct large non-zero count. That is a live instrument risk and it
        should be named as such, not left as a footnote about counter overflow.
    - id: OS-4
      severity: low
      where: ladder LADDER-RESULT.json DATA_COMPLEXITY.distinguishing_advantage
      text: 2^-46.2 is a false-positive rate, not an advantage.
    - id: OS-5
      severity: low
      where: count5 PREREGISTRATION.md section 3.5
      text: index-convention sign error, D-ERR-1 above. Non-load-bearing.
        Correct by AMENDMENT file, never by editing the preregistration.
    - id: OS-6
