      NOT claimed as verified here. The prior verified structure this session builds on is
      cited, not re-claimed - the 4-round integral (16/16 balanced, 0/16 at r=5,
      depth_wall_receipt.json) and the mixture round-1 difference identity (2000 of 2000,
      MEAS-RT-C TEST0) - and both belong to their originating records.
    dominated_by: >-
      UNRESOLVABLE IN THIS ENVIRONMENT. Written INSTEAD OF null, because null would assert
      a row-by-row Pareto check across the published frontier that CANNOT BE PERFORMED
      HERE - no primary source is reachable and every recalled frontier row in
      baseline_map.md section 2 is unverified-from-memory. Writing null would be a
