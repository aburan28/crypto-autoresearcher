report:
  id: RR78-IDEATION-001
  produced_by: idea-generator
  produced_for: >-
    Object-first ideation on structures reaching 7 or 8 rounds of AES-128, for the
    reduced-round lane of RQ-AES-001 / RQ-AES-002. Companion prose map is
    structures_map.md in the same directory.
  written_to: scratchpad only
  repo_or_ledger_writes: none
  commits: none
  state_changes: none
  evidence_strength_assigned: none

  epistemic_preamble:
    timestamps: >-
      The Bash tool is NOT enabled in this subagent session, so no wall-clock UTC stamp
      could be obtained at start, at boundaries, or at halt. The harness-supplied date is
      2026-08-01. Writing an invented UTC time would be a fabrication under AGENTS.md rule
      9, so none is written. The 2400 s budget was tracked by turn count and volume of
      work rather than by clock, and the session halted on judgement. That is weaker than
      the brief asked for and it is reported as such. Precedent for this exact limitation
      is baseline_map.md section 0.1.
    compute_run_this_session: >-
      ZERO. No AES measurement of any kind was taken here. Every quantity marked measured
      is measured in a cited prior record of this repository, never in this session. Every
      gate below is a PROPOSAL and no gate outcome is reported, predicted-as-observed, or
      implied.
    sources: >-
      No primary cryptographic source was read. No WebSearch was run. Every recalled fact
      carries an UNVERIFIED-FROM-MEMORY tag with a recall confidence and, per
      DEC-20260731-019 ruling 3, is used to neither promote nor dismiss any candidate.
      Where a recalled fact would otherwise be load-bearing it is replaced by a gate that
      decides the question on this machine. No citation implying a source was read appears
      anywhere in this file.
    claim_tier: toy

  inherited_corrections_honoured:
    - id: F-2-no-power-statistic
      source: coordination/goals/GOAL-AES-002/CORRECTION-influence-and-O3.json
      correction: >-
        Influence-support density 0.4996 at r=3 was read as a closure; a pure random
        function reads 0.4995 on the same probe. A statistic with no power was read as
        death. The object died one round later and by a different statistic (per-cell
        bias, +43.84 sd at r=3, null at r=4).
      how_honoured: >-
        Every gate below states a detection floor and carries a null object of the same
        shape. The top-ranked candidate deliberately uses a DETERMINISTIC residue rather
        than a bias, because a residue has no detection floor and cannot masquerade.
    - id: F-1-and-O3-premise
      source: >-
        CORRECTION-influence-and-O3.json, O3-resolution.json, O3-residual-closed.json
      correction: >-
        O-3's premise of at least one S-box per candidate is measurably FALSE - mu falls
        194.4 to 125.2 to 12.3 as coset dimension rises from 4 to 12, capped analytically
        at 200 x 256 = 2^15.64 distinct S-box computations over any key set. Its
        CONCLUSION survives on the different ground that full states and every projection
        wider than one byte are fully distinct across a structured key set (4096 of 4096
        at every round, d=12). The 7.64-bit figure is the wrong justification for the
        right bound.
      how_honoured: >-
        No candidate below is promoted or dismissed by the 7.64-bit amortization ceiling,
        and no candidate below is an enumerative class-B object.
    - id: RT-9-fatigue-vs-vacuity
      source: ledger/decisions/DEC-20260731-017.yaml
      correction: >-
        IN_SCOPE_VACUOUS is a predicate on the candidate; no upper bound exhibited is a
        fact about the producer's time. Per inventor-protocol section 4 the latter names
        no obstruction and is a fatigue report about the search.
      how_honoured: >-
        Candidates I cannot bound are recorded DEFERRED_UNBOUNDED and are kept OUT of
        every count of candidates ruled out. See deferred_unbounded below.
    - id: interface-counting-rule
      source: ledger/decisions/DEC-20260731-017.yaml clause (ii)
      correction: >-
        n counts consecutive super-box interfaces over which the tracked object must
        survive; traversal of an invariance group at one fixed interface with a fixed
        projection costs n = 1. n = 1 is NOT a licence and a separate explicit
        tractability judgement is required alongside it.
      how_honoured: >-
        Each candidate states interfaces_required separately from a tractability
        judgement.
    - id: MEAS-RT-C-scope
      source: coordination/goals/GOAL-AES-002/redteam/findings.yaml
      correction: >-
        The mixture quadruple object is VERIFIED TO EXIST (TEST0 round-1 difference
        identity HOLDS, 2000 of 2000 quadruples, every run). Exactly ONE lossy readout of
        it was tested and returned a matched null with an unexplained instrument artifact
        present equally in the null at every round 4 to 10. The red team states that
        calling the object dead on this evidence would be a fatigue report.
      how_honoured: >-
        CAND-RR78-A is built on that opening. The object is treated as UNTESTED AT DEPTH,
        not dead, and the proposed readout is deterministic rather than a collision ratio,
        precisely so the MEAS-RT-C artifact shape cannot recur undetected.

  # =====================================================================
  # OBJECT ENUMERATION (inventor-protocol section 1), object-first, before ideas.
  # Established families declared OFF-LIMITS as the primary lens for this session,
  # per baseline_map.md section 4: raw differential pairs, raw linear masks, raw
  # integral balance, invariant subspaces, biclique recomputation sets, related-key
  # trails, XSL-style ideals.
  # =====================================================================
  objects_enumerated:
    - id: O-A
      name: mixed-space pair-count residue of a full diagonal-subspace coset
      genuinely_new: >-
        Repackaging of a recalled family (recall MEDIUM, see recall_register), but NEVER
        MEASURED IN THIS PROGRAM in any form. Its two enabling facts are re-derivable
        locally in seconds and are not recalled.
      one_step_propagation_definable: >-
        Yes, exactly. SR(D_I) = C_I as a byte permutation, so a coset of a diagonal space
        maps in one round to a coset of a column space and in two rounds to a coset of a
        mixed space. Deterministic, no probability enters.
      survival_depth: >-
        2 rounds deterministically from the trail. Depth beyond 3 is carried entirely by a
        pairing argument whose reach I do not know and decline to guess. THE GATE MEASURES
        IT.
      promoted_to: CAND-RR78-A
    - id: O-B
      name: zero-difference pattern of an adaptive two-directional pair orbit
      genuinely_new: >-
        Repackaging (recall LOW-MEDIUM), but NEVER MEASURED HERE, and the campaign's own
        depth_wall_receipt.json names decryption-direction probing as never run.
      one_step_propagation_definable: >-
        Yes. SubBytes preserves zero-ness bytewise, ShiftRows relabels cells, MixColumns
        maps a wholly-zero column to a wholly-zero column.
      survival_depth: >-
        Derived expectation about 2 layers each side of a free middle. Stated as a
        derivation to be measured, NOT as a result.
      promoted_to: CAND-RR78-B
    - id: O-C
      name: partial-sum register - the running aggregate of a bottom-extension fold
      genuinely_new: >-
        The technique is old; framing the running aggregate plus not-yet-folded ciphertext
        bytes AS THE TRACKED OBJECT is the new part here, and it is what makes the cost
        ladder fall out of a projection argument rather than out of recall.
      one_step_propagation_definable: yes, and it is a projection on the COMPUTATION not on the cipher
      survival_depth: all b rounds by construction; this object has no depth wall
      promoted_to: CAND-RR78-C
    - id: O-D
      name: 16-bit truncated activity support under a miss-in-the-middle contradiction
      genuinely_new: >-
        Repackaging. The campaign's own CAND-FR-1 lossy-projection analysis
        (baseline_map.md section 5.3) applies to it verbatim and PASSES.
      one_step_propagation_definable: >-
        Yes, conservatively - an accidental cancellation at SubBytes makes the pattern an
        over-estimate, which is the safe direction.
      survival_depth: 4 claimed by the two-plus-two trail; the gate measures the sievable form
      promoted_to: CAND-RR78-D
    - id: O-E
      name: DS-MITM parameter tuple
      genuinely_new: >-
        The RELABELLING is the contribution. See objects_dropped/OD-1 - the 255-byte
        sequence is not an object at all, and treating the parameter tuple as the object
        is what makes the binding cost (table size) visible instead of hidden.
      one_step_propagation_definable: yes - parameter support is exactly measurable by perturbation
      survival_depth: >-
        Not depth-limited in the usual sense. The family reaches exactly as deep as 8p
        stays below the key size, where p is the parameter count.
      promoted_to: CAND-RR78-E
    - id: O-F
      name: null objects of the same shape
      genuinely_new: no - mandatory control under inventor-protocol section 3
      one_step_propagation_definable: yes
      survival_depth: by construction
      promoted_to: attached to every candidate as a required control

  objects_dropped_at_the_lossy_projection_test:
    - id: OD-1
      name: the 255-byte delta-set output difference sequence itself
      verdict: FAILS - not lossy
      argument: >-
        255 bytes is 2040 bits, against 128 bits of key. As a map from (key, structure) to
        sequence this discards nothing that matters and almost certainly DETERMINES the
        key. Under inventor-protocol section 2 that makes it a change of coordinates, not
        an object. This is the sigma(K) shape that baseline_map.md section 5.1 caught, one
        family over.
      what_it_yields: >-
        A real correction to how this family is usually framed here. What makes DS-MITM
        work is not lossiness of the sequence; it is PRECOMPUTABILITY - the sequence
        factors through a small parameter tuple. The object is therefore the tuple (O-E)
        and the lossiness is state-to-parameters. Cost zero, no compute.
    - id: OD-2
      name: the full ciphertext difference of a mixture quadruple
      verdict: FAILS - not lossy
      argument: >-
        Tracking the full difference is tracking the pair. The mixture object only becomes
        an object at a projection, which is why the choice of readout is the entire
        content of the candidate and why MEAS-RT-C's null closes a readout rather than an
        object.

  # =====================================================================
  # CANDIDATES, RANKED
  # =====================================================================
  candidates:

    - idea:
        id: IDEA-20260801-901
        internal_id: CAND-RR78-A
        rank: 1
        title: mixed-space pair-count residue as a deterministic depth probe for 5 and 6 rounds
        class: measurement
        claim: >-
          For a full coset V of a diagonal subspace D_I and a mixed space M_J, the integer
          n_r = number of unordered ciphertext pairs from E_K^r(V) whose difference lies
          in M_J has a DETERMINISTIC residue modulo 8 for every key K, every coset V and
          every J, at some depth r >= 4, whereas under a random permutation of the same
          shape the residue is uniform on 8 values. The falsifiable content is the exact
          largest r at which the residue holds.
        mechanism: >-
          Two facts, each re-derivable locally in seconds and neither recalled. (1)
          ShiftRows carries the diagonal space D_I onto the column space C_I as a byte
          permutation, and SubBytes acts bytewise while MixColumns and AddRoundKey are
          GF(2)-affine, so a coset of D_I maps under one round to a coset of C_I. (2)
          Applying the same argument once more, a coset of D_I maps under two rounds to a
          coset of M_I = MC(C_I). That is 2 rounds of purely deterministic structure with
          no probability. Beyond round 3 the trail dissolves, because MixColumns applied
          to a full column space spans; any surviving signature is therefore carried by a
          PAIRING or ORBIT argument on the pair set rather than by the trail. The residue
          is the observable of such an argument - a pairing that is an involution on the
          set of qualifying pairs with fixed-point structure of size a power of two forces
          a residue - and its reach is exactly what is unknown and exactly what the gate
          measures.
        novelty_status: unverified
        novelty_note: >-
          Corpus grepped - knowledge/ and ledger/ contain no mixed-space, subspace-trail,
          or pair-count-residue object, and GOAL-AES-002's own enumeration
          (baseline_map.md section 4) lists subspace trails and mixture/exchange tuples as
          named families but records NO measurement of either. Literature NOT checkable -
          no primary source is reachable in this environment. Therefore unverified, never
          novel. See recall_register RM-1 and RM-2.
        assumptions:
          - the BATCH-001 pinned harness byte order and round convention are used unchanged
          - >-
            the final round drops MixColumns, per the convention pinned in GOAL-AES-001
            BATCH-001 and used by integral_depth_probe.c
        lossy_projection_test:
          verdict: PASSES
          what_is_discarded: >-
            2^24 full 128-bit ciphertexts, about 2^31 bits of state, are projected to ONE
            INTEGER. The values, the ordering, and the identity of which pair qualified
            are all discarded.
          why_the_discard_is_compatible: >-
            The coset structure of V is preserved by every affine layer; membership of a
            difference in M_J is a linear condition invariant under AddRoundKey; and the
            pairing that would force a residue is an involution on the PAIR SET, a
            set-level notion that does not consult values.
          honest_limit: >-
            Whether the retained part still propagates DETERMINISTICALLY past round 4 is
            exactly the experiment and is not assumed anywhere.
        predictions:
          - metric: n_r mod 8 over independent (K, V, J) trials at r = 4
            direction: different
            minimum_effect: >-
              20 of 20 trials reading 0 against a null in which the residue is uniform;
              probability under the null 8^-20 = 2^-60
          - metric: n_r mod 8 at r = 5
            direction: different
            minimum_effect: same, 20 of 20 against 2^-60
          - metric: n_r mod 8 at r = 6
            direction: different
            minimum_effect: >-
              same. THIS ARM IS FREE - one extra AESENC on the same coset and the same
              counter pass - and it is the highest-value single measurement in this file
          - metric: n_r mod 8 at r = 10 (random-permutation surrogate null)
            direction: different
            minimum_effect: >-
              must be UNIFORM. If it reads 0 here too, that is the artifact tell and the
              counting code is suspect, not AES
        minimal_test:
          design: >-
            GATE-RR78-1, stage 1. Take a FULL coset of a 3-byte diagonal subspace - the
            2^24 states varying over byte positions {0,5,10} of a ShiftRows diagonal with
            all 13 other bytes fixed. A 3-byte restriction of a diagonal space is still a
            subspace, so the algebra is intact while the cost falls by 2^8. Encrypt r
            rounds with AES-NI. Fix a mixed space M_J of dimension 96 (three columns'
            worth); membership of a difference in M_J is equivalent to equality under the
            complementary 32-bit quotient projection pi. Bucket the 2^24 ciphertexts by
            pi into a 2^24-entry open-addressed hash table (about 128 MB) and accumulate
            n_r = sum over buckets of C(m_b, 2). Expected n_r is about 2^47 / 2^32 = 2^15
            = 32768 pairs, ample resolution for a mod-8 test. Sweep r = 2,3,4,5,6 and
            r = 10, with 20 independent (key, coset, J) trials each. Runtime about 0.2 s
            per encryption sweep at the campaign's own measured 8.1e7 reduced-round
            AES/s/core, so the whole 120-configuration stage-1 grid is MINUTES on one
            core.
          stage_2_confirmation: >-
            If and only if stage 1 is ambiguous, repeat on the FULL 2^32 diagonal coset:
            53 s per sweep per core (the figure integral_depth_probe.c actually measured),
            with a 2^32-entry uint8 counter array (4 GB, occupancy Poisson(1), overflow
            guard mandatory) rather than a hash table. Run configurations SEQUENTIALLY -
            4 x 4 GB exceeds the 15 GB envelope.
          controls:
            - >-
              NULL 1, random-permutation surrogate. Identical measurement at r = 10. The
              residue must be uniform.
            - >-
              NULL 2, structure-destroying. V replaced by 2^24 uniformly random
              plaintexts of the same cardinality. Separates the property from the coset.
            - >-
              NULL 3, THE ONE MEAS-RT-C DID NOT HAVE. Same code path, same wiring, key
              schedule replaced by fresh independent random round keys. Separates AES from
              AES-shaped, and is the control that would have caught the MEAS-RT-C
              instrument artifact.
            - >-
              NULL 4, sibling-mixed-space. The same selection rule applied to a DIFFERENT
              subspace of the same dimension that is NOT a MixColumns image of a column
              space. Required by KN-FIND-018 practice rule 6 - a null built by negating a
              merely sufficient hypothesis is not automatically discriminating, and the
              sibling null is what tests the label.
            - >-
              POSITIVE CONTROL. At r = 2 the coset maps to a coset of M_I by fact 2, so
              n_2 must be MAXIMAL and structurally forced. If it is not, the instrument is
              broken and every downstream reading is VOID.
          required_metrics:
            - n_r as an exact integer, per trial, recorded raw and never only mod 8
            - n_r mod 8 and mod 16, per trial
            - n_r against its null expectation, as a ratio and as a z-score
            - bucket occupancy histogram, to prove the counter did not overflow
            - per-trial seeds, key, coset base, J index
        falsification_conditions:
          - >-
            The residue is uniform at r = 4 in stage 1 AND in stage 2 on the full 2^32
            coset. The candidate falls; the recalled family shape does not hold here.
          - >-
            The residue reads 0 at r = 10 as well. ARTIFACT TELL - a quantity that fails to
            decay when the parameter meant to destroy it increases. Every reading is VOID
            and the counting code is the suspect.
          - >-
            The positive control at r = 2 fails. Instrument broken, all readings VOID.
          - >-
            NULL 4 (sibling mixed space) reads identically to the target. The label
            mixed space is not what is doing the work and the attribution is withdrawn.
        confounders:
          - >-
            Sub-coset degeneracy. A 3-byte diagonal restriction is a genuine subspace, but
            if the pairing argument needs the FULL 4-byte diagonal coset the residue may
            vanish at stage 1 for a reason that has nothing to do with depth. This is why
            stage 2 exists and why an ambiguous stage 1 does NOT license a negative.
          - >-
            PRNG structure. MEAS-RT-C's unexplained residual excess was flagged by its own
            author as possibly xorshift64. Use a counter-mode AES-NI stream from a
            recorded seed for all randomness, and record the generator.
          - >-
            Counter overflow silently truncating n_r in stage 2. Overflow guard mandatory,
            occupancy histogram reported.
          - >-
            Reading a deterministic residue where the count is small. If n_r is below a
            few hundred the mod-8 statistic is still valid but the magnitude readout is
            not; report both and never substitute one for the other.
        interpretation_limits:
          - >-
            A residue at r = 5 is a DISTINGUISHING SIGNATURE ON THIS INSTRUMENT for the
            tested keys, cosets and mixed spaces. It is NOT an attack, NOT a key recovery,
            and NOT a claim about AES security.
          - >-
            Measured on AES-128 only unless explicitly extended. AES-192 and AES-256 are
            not covered.
          - claim_tier toy, and it stays toy however it returns
        heuristic_assumptions:
          - id: H1
            statement: >-
              For a uniformly random permutation of GF(2)^128 and a fixed 96-dimensional
              subspace M, the count n = #{unordered pairs from a fixed 2^24-set with
              difference in M} satisfies n mod 8 uniform on {0,...,7} up to total
              variation o(1).
            rigorous_support: >-
              n = sum over 2^32 buckets of C(m_b, 2) with the m_b jointly a multinomial of
              2^24 balls into 2^32 boxes. The summands are near-independent Bernoulli-like
              contributions and the sum is over about 2^15 nonzero terms; a
              Chen-Stein / local-limit argument gives asymptotic uniformity of the
              residue. This is the classical local limit theorem for sums of
              near-independent lattice-valued summands, imitated here.
            validation_plan: >-
              DIRECTLY MEASURABLE, no correspondence needed. Run NULL 1 (r = 10) and
              NULL 2 (random plaintexts) at 2000 trials each and compare the empirical
              residue histogram against uniform by an exact multinomial chi-square with 7
              degrees of freedom. Tail check - the largest observed residue count against
              its binomial tail. This is the cheapest heuristic validation in this file
              and it costs about 2000 x 0.2 s = 7 minutes on one core. TOY SCALE, and
              labelled as such - it validates the null model for THIS instrument at THESE
              sizes and nothing else.
          - id: H2
            statement: >-
              The 3-byte diagonal sub-coset used in stage 1 preserves whatever pairing
              structure forces the residue on the full 4-byte diagonal coset.
            rigorous_support: >-
              A 3-byte restriction of a diagonal space IS a subspace, and facts (1) and
              (2) of the mechanism hold verbatim for any subspace of D_I. What is NOT
              proved is that the pairing argument is insensitive to the dimension, and
              this is stated as the gap rather than assumed away.
            validation_plan: >-
              Run stage 1 at diagonal restrictions of 2, 3 and 4 bytes (2^16, 2^24, 2^32
              texts). If the residue appears only at 4 bytes, H2 is FALSE and stage 1 is
              not a valid screen - which is itself a useful measured fact and is
              pre-registered as such. Cost is dominated by the 4-byte arm at 53 s.
        target_complexity:
          time_exponent: >-
            n/a as an attack - this is a MEASUREMENT candidate and no attack complexity is
            claimed. Gate cost - stage 1 about 2^24 AES per trial (0.2 s/core), stage 2
            about 2^32 AES per trial (53 s/core).
          memory_exponent: >-
            stage 1 about 2^27 bytes (128 MB); stage 2 about 2^32 bytes (4 GB), which is
            within the 15 GB envelope ONLY if configurations run sequentially
          best_known: >-
            UNRESOLVABLE in this environment. No primary source is reachable. The one
            adjudicable reference is definitional exhaustive key search on the full
            cipher, which this candidate does not attempt and does not beat.
          hidden_overhead: >-
            None hidden. The residue test is exact integer arithmetic. The stage-2 counter
            pass is a full 2^32-element scan and is charged.
          tradeoff_note: >-
            Stage 1 trades 2^8 in data for a possible loss of the pairing structure - that
            trade is exactly H2 and is measured, not assumed. Parallelization is trivially
            4-way across independent trials in stage 1 and is memory-blocked to 1-way in
            stage 2.
        interfaces_required: >-
          n = 5 or 6 consecutive super-box interfaces under the DEC-20260731-017 clause
          (ii) counting rule. This is NOT within the campaign's stated in-scope budget of
          about 3 interfaces under the tighter conversion, and that is stated rather than
          finessed - the candidate is proposed as a MEASUREMENT of where a signature dies,
          which is legitimate at any n, and NOT as a route to an attack at n = 6.
        tractability_judgement_separate_from_n: >-
          TRACTABLE. Stage 1 is 0.2 s per configuration and the whole grid is minutes.
          This judgement is made explicitly and separately from the interface count, per
          DEC-20260731-017 clause (iv) - n is not a licence and n is not a tractability
          proxy.
        estimated_cost:
          implementation: medium
          compute: low
        recommended_priority: high
        why_ranked_first: >-
          Three reasons, in order. (1) It is the only candidate whose statistic is
          DETERMINISTIC, so it is structurally immune to the F-2 failure mode that has
          already cost this campaign one withdrawn closure. (2) Its r = 6 arm answers the
          single highest-value question in the brief AT ZERO MARGINAL COST. (3) It cannot
          return an uninformative outcome - every branch of the outcome table in
          structures_map.md section 3.1 is a real answer, including the artifact branch.

    - idea:
        id: IDEA-20260801-902
        internal_id: CAND-RR78-B
        rank: 2
        title: yoyo zero-difference pattern as an adaptive two-directional depth probe
        class: measurement
        claim: >-
          The 4-bit zero-difference pattern nu of a state pair is preserved by a
          yoyo swap - exchanging a proper nonempty subset of wide-trail cells between two
          ciphertexts, decrypting, re-pairing and re-encrypting - with probability
          materially above the null of a random re-pairing, up to some depth r, and the
          falsifiable content is the exact largest such r.
        mechanism: >-
          SubBytes preserves zero-ness bytewise because S is a bijection, so S(a) = S(b)
          iff a = b. ShiftRows relabels cells. MixColumns acts within a column, so a
          wholly-zero column maps to a wholly-zero column. The pattern therefore
          propagates deterministically across a super-box layer, and what destroys it is
          MixColumns mixing a zero cell with a nonzero one at the NEXT layer, which the
          branch number 5 makes generic after two mixing layers on each side of the
          middle. The swap is adaptive and two-directional, which is a different object
          class from every static object this campaign has measured.
        novelty_status: unverified
        novelty_note: >-
          Corpus grepped - yoyo appears in baseline_map.md section 4 as a named family
          with a recalled depth of 5 at recall confidence LOW-MEDIUM, and NOWHERE as a
          measurement. depth_wall_receipt.json's own not_established block names
          decryption-direction probing as NEVER RUN. Literature not checkable. Unverified.
        assumptions:
          - the attacker owns the key, so the decryption oracle is free and offline
          - >-
            AES-NI decryption uses the equivalent inverse cipher, so the round keys must
            be passed through _mm_aesimc_si128 for rounds 1..r-1. Getting this wrong is
            the single most likely implementation fault and it must be pinned against a
            known-answer test before any measurement.
        lossy_projection_test:
          verdict: PASSES
          what_is_discarded: 128 bits of difference projected to 4 bits of pattern
          why_the_discard_is_compatible: >-
            Zero-ness of a cell is preserved bytewise by SubBytes, relabelled by
            ShiftRows, and preserved column-wise by MixColumns. This is the SAME
            projection family that baseline_map.md section 5.3 already tested and passed
            for CAND-FR-1 - conservative at SubBytes, so an accidental cancellation makes
            the pattern an over-estimate, the safe direction.
        predictions:
          - metric: Pr[nu(swapped pair) = nu(original pair)] at r = 4
            direction: higher
            minimum_effect: >-
              at least 5 sd above the matched null, with the null measured on the same
              instrument in the same run
          - metric: same at r = 5
            direction: higher
            minimum_effect: at least 5 sd above the matched null
          - metric: same at r = 6 and r = 10
            direction: different
            minimum_effect: >-
              must FALL to the null. A quantity that does not decay as rounds increase is
              the artifact tell and voids the reading
        minimal_test:
          design: >-
            GATE-RR78-2. Implement r-round AES-128 encryption and decryption with AES-NI
            (_mm_aesenc_si128 / _mm_aesdec_si128 with _mm_aesimc_si128 on the inverse
            schedule), pinned first against a known-answer test in both directions with 0
            mismatches. Sample random (K, p1, p2) with p1, p2 differing in a chosen cell
            pattern. Encrypt r rounds. Swap a proper nonempty subset of wide-trail cells
            between c1 and c2 to form c3, c4. Decrypt r rounds to p3, p4. Record
            nu(p1,p2) and nu(p3,p4) and score equality. Sweep r = 3,4,5,6,10 and all 14
            proper nonempty swap subsets, 2^20 trials each. Total about 5 x 14 x 2^20 x 2
            x r AES calls - SECONDS on one core.
          controls:
            - >-
              NULL 1, random re-pairing. Replace the swapped pair by an independently
              sampled pair of the same shape. This is the matched null and it must be
              measured in the same run, not assumed.
            - >-
              NULL 2, independent round keys. Same wiring, key schedule replaced by fresh
              random round keys.
            - >-
              DEGENERACY GUARD, copied from MEAS-RT-C's own self-correction. Require all
              cells in the swapped subset to differ, so that the swapped pair cannot BE
              the original pair. MEAS-RT-C measured that degeneracy at about half its raw
              signal. Not repeating that is the single cheapest thing this candidate
              inherits.
            - >-
              POSITIVE CONTROL at r = 1, where the pattern is preserved by the bytewise
              argument alone and preservation must read essentially 1.
          required_metrics:
            - preservation rate per (r, swap subset), with exact counts not just ratios
            - matched null rate per (r, swap subset), same run
            - z-score of target minus null, and the DETECTION FLOOR at the sample size used
            - known-answer-test result for both encryption and decryption directions
        falsification_conditions:
          - preservation rate at the matched null at r = 4. The candidate falls at depth 4.
          - >-
            preservation rate above null at r = 10 as well. Artifact tell, reading VOID.
          - >-
            positive control at r = 1 below 1. Instrument broken, all readings VOID.
          - >-
            the known-answer test fails in the decryption direction. Infrastructure
            failure, NOT negative mathematical evidence (AGENTS.md rule 5).
        confounders:
          - >-
            The inverse-schedule (_mm_aesimc_si128) trap. Silently wrong decryption
            produces a clean-looking null at every round and would be read as death.
            The known-answer test is not optional.
          - >-
            Wide-trail cell convention. Whether nu is defined on columns or on diagonals
            differs by which side of the middle the swap sits. Both conventions must be
            run; picking one and finding a null proves nothing about the other.
          - >-
            Detection floor. At 2^20 trials the resolution is about 2^-10 per rate. State
            it in the receipt. The campaign's OBJ-7 records that no receipt currently
            states its own floor.
        interpretation_limits:
          - a preservation rate above null is a signature on this instrument, not an attack
          - AES-128 only
          - claim_tier toy
        heuristic_assumptions:
          - id: H3
            statement: >-
              Under a random re-pairing of ciphertexts, the zero-difference pattern nu of
              the resulting plaintext pair is distributed as for two independent uniform
              128-bit states, i.e. each of the 4 cells is zero independently with
              probability 2^-32.
            rigorous_support: >-
              For a uniformly random permutation the decryption of an independently
              sampled ciphertext pair is an independently sampled plaintext pair; the
              cell-zero events are then determined by 32 uniform bits each, independent
              across disjoint cells. This is the elementary uniform-permutation model,
              exactly the model MEAS-RT-B used for its matched null.
            validation_plan: >-
              MEASURED IN THE SAME RUN as NULL 1, at 2^20 trials, compared against the
              closed-form 2^-32 per cell. Because 2^-32 is far below the 2^-10 detection
              floor, the operative check is that the JOINT pattern histogram matches the
              all-cells-nonzero mass to within binomial error. TOY SCALE and labelled as
              such.
        target_complexity:
          time_exponent: >-
            n/a as an attack. Gate cost about 2^25 to 2^30 AES calls total, i.e. seconds.
          memory_exponent: negligible, under 2^20 bytes
          best_known: >-
            UNRESOLVABLE in this environment. No primary source reachable.
          hidden_overhead: none
          tradeoff_note: >-
            The gate is compute-trivial and implementation-dominated. Its cost is entirely
            in getting the AES-NI decryption path right.
        interfaces_required: n = 4 to 6, counted per DEC-20260731-017 clause (ii)
        tractability_judgement_separate_from_n: >-
          TRACTABLE, and it is the cheapest gate in this file by compute. Its risk is
          implementation, not budget.
        estimated_cost:
          implementation: medium
          compute: low
        recommended_priority: high

    - idea:
        id: IDEA-20260801-903
        internal_id: CAND-RR78-C
        rank: 3
        title: >-
          the partial-sum register - measuring exactly what the bottom extension buys, and
          recording the 7-round integral shape as DEFERRED_UNBOUNDED rather than vacuous
        class: composition
        claim: >-
          Folding the bottom-extension key guess one ciphertext byte at a time, with the
          tracked object the pair (running aggregate, not-yet-folded ciphertext bytes),
          reduces the per-structure cost of one bottom round from 2^72 to about 2^50, a
          factor of about 2^22 - and buys ZERO extra rounds. The round itself is bought by
          the 2^32 key guess and by nothing else.
        mechanism: >-
          For a 4-round integral on a 2^32 structure the target is
          Sigma = XOR over x in V of S^{-1}(c1 . S^{-1}(x_1 XOR k1) XOR c2 . S^{-1}(x_2
          XOR k2) XOR c3 . S^{-1}(x_3 XOR k3) XOR c4 . S^{-1}(x_4 XOR k4) XOR k'), with
          c1..c4 the fixed MC-inverse row coefficients and k' the equivalent key absorbing
          MC-inverse. Naive cost is 2^32 texts x 2^32 guesses of (k1..k4) x 2^8 of k' =
          2^72 per structure. Define the partial-sum register y_0 = 0, y_j = y_{j-1} XOR
          c_j . S^{-1}(x_j XOR k_j) and track (y_j, x_{j+1}, ..., x_4). Stage j costs one
          pass over the current table for each new key-byte guess. Derived ladder, per
          structure - stage 1 - 2^8 guesses, table 2^32 in, 2^32 out, cost 2^40. Stage 2 -
          2^16 guesses, 2^32 in, 2^24 out, cost 2^48. Stage 3 - 2^24 guesses, 2^24 in,
          2^16 out, cost 2^48. Stage 4 - 2^32 guesses, 2^16 in, 2^8 out, cost 2^48. Total
          about 4 x 2^48 = 2^50.
        novelty_status: known
        novelty_note: >-
          The TECHNIQUE is old and I do not claim otherwise. What is proposed as new here
          is (a) framing the running aggregate as the TRACKED OBJECT so the cost ladder
          falls out of a projection argument rather than out of recall, and (b) the gate
          that MEASURES the ratio instead of quoting it. The arithmetic above is derived
          in this session and is exposed line by line precisely so it can be attacked.
        lossy_projection_test:
          verdict: PASSES, from stage 2 onward
          what_is_discarded: >-
            At stage j the projection retains 8 + 8(4-j) bits of the 32 bits of
            (x_1..x_4). At j = 1 that is 8 + 24 = 32 - NOTHING IS LOST, so stage 1 is a
            change of coordinates and not yet an object. At j = 2 it is 24 of 32, at
            j = 3 it is 16, at j = 4 it is 8.
          why_the_discard_is_compatible: >-
            Sigma depends on the folded bytes ONLY through y_j, by construction. This is a
            projection on the COMPUTATION rather than on the cipher, which places it in
            baseline_map.md section 3's class B rather than class A.
          honest_note: >-
            That stage 1 loses nothing is recorded rather than hidden. It is the reason the
            first fold is free and the later folds are where the saving lives.
        predictions:
          - metric: measured wall-clock ratio of naive to partial-sum evaluation, scaled down
            direction: lower
            minimum_effect: >-
              the partial-sum path must be faster by a factor consistent with the derived
              ladder to within a factor of 4 at the scaled-down size, or the derivation is
              wrong
          - metric: agreement of the two paths on Sigma for every guess
            direction: different
            minimum_effect: >-
              EXACT agreement on 100 percent of guesses. Any disagreement is an
              implementation fault and voids the timing comparison
        minimal_test:
          design: >-
            GATE-RR78-3. The full-size comparison is not runnable (2^72 naive), so run the
            SCALED-DOWN instance, which is inventor-protocol section 6 step 2 - the step
            this program most often skips. Reduce the structure to 2^16 texts and the
            guess to TWO ciphertext bytes (2^16 guesses of (k1,k2) x 2^8 of k'). Naive
            cost 2^16 x 2^24 = 2^40 - about 1 hour aggregate, or 2^12 texts for a 2^32
            run at seconds. Implement both paths, assert exact agreement on Sigma for
            every guess, and measure the wall-clock ratio. Then check the measured ratio
            against the ladder's prediction at that size. Cost - minutes to about an hour
            on 4 cores, under 1 GB.
          controls:
            - >-
              EXACT-AGREEMENT CONTROL. The two paths must agree on Sigma for every guess.
              This is a correctness control, not a performance one, and it must pass
              before any timing number is read.
            - >-
              NULL OBJECT. Run the identical comparison on a same-shape construction with
              the S-box replaced by a random 8-bit bijection. The ladder is an argument
              about TABLE SIZES and should be insensitive to which bijection is used - if
              the measured ratio changes materially, the saving is being attributed to the
              wrong thing.
            - >-
              SCALING CONTROL. Run at two structure sizes and check the ratio moves as the
              ladder predicts. A ratio that does not move with size is the artifact tell.
          required_metrics:
            - exact Sigma agreement rate, target 100 percent
            - wall-clock per path, per size, with the machine otherwise idle
            - peak RSS measured, not modelled (DEC-20260731-017 struck a table for
              modelling memory)
            - measured ratio against the ladder prediction at the same size
        falsification_conditions:
          - the two paths disagree on any guess. Implementation fault, timing VOID.
          - >-
            the measured ratio is not within a factor of 4 of the ladder at the tested
            size. The derived ladder in the mechanism is WRONG and must be rewritten.
          - the ratio does not scale with structure size. Artifact tell, reading VOID.
        confounders:
          - cache effects dominating at small table sizes and flattering one path
          - compiler auto-vectorizing one path and not the other
          - >-
            the scaled-down instance not being the same shape - fewer folded bytes changes
            the ladder's arithmetic and the prediction must be recomputed at the tested
            size, never copied from the 4-byte case
        interpretation_limits:
          - >-
            A measured ratio at 2^16 texts is a fact about 2^16 texts. Extrapolation to
            2^32 is an EXTRAPOLATION and must be labelled one.
          - This is an implementation-cost measurement and it says nothing about AES security.
        heuristic_assumptions:
          - id: H4
            statement: >-
              The cost of stage j is proportional to the product of the accumulated guess
              space and the input table size, with a constant independent of j and of the
              underlying bijection.
            rigorous_support: >-
              Each stage is a single linear scan of a table with one array read and one
              array write per element per guess; the operation count is exactly
              (guesses so far) x (table size). What is NOT rigorous is the CONSTANT, which
              depends on cache residency, and that is exactly what the gate measures.
            validation_plan: >-
              Measure the per-stage wall-clock at two table sizes and two guess widths and
              fit the constant. If the constant varies by more than a factor of 4 across
              stages, H4 is false as stated and the ladder must carry a per-stage
              constant. TOY SCALE.
        target_complexity:
          time_exponent: >-
            About 2^50 per 2^32-text structure for ONE bottom round on a 4-round integral,
            against 2^72 naive. Derived here.
          memory_exponent: >-
            The largest intermediate table is 2^32 entries at stage 1-2, i.e. about 2^32
            to 2^35 bytes depending on entry width. This is the binding resource at full
            size and it is stated beside time rather than omitted.
          best_known: >-
            UNRESOLVABLE in this environment. baseline_map.md row R8 recalls a 7-round
            single-key key recovery at about 2^100+ at recall confidence LOW-MEDIUM; per
            ruling 3 that row is used to neither promote nor dismiss this candidate and is
            recorded here only to locate the question.
          hidden_overhead: >-
            The 2^50 counts table passes at one operation per element. Memory traffic at
            2^32-entry tables is not free and the constant is unmeasured - that is
            precisely what GATE-RR78-3 measures.
          tradeoff_note: >-
            Straight time-memory trade - the ladder BUYS its 2^22 by paying 2^32 memory.
            At the 15 GB envelope the full-size version is memory-blocked, which is why
            the gate is scaled down. 4-way parallel across guesses of the first folded
            byte.
        the_seven_round_shape_recorded_honestly:
          shape: d = 4 integral, t = 1 top, b = 2 bottom
          top_cost: >-
            Guess 4 bytes of k_0 (2^32) so that a chosen plaintext structure partitions
            into sets that are diagonal cosets at the input to round 2. Time multiplies by
            2^32; data multiplies by the number of structures needed. t is CHEAP IN DATA
            and EXPENSIVE IN TIME.
          bottom_cost: >-
            b = 1 costs 2^32 key guesses at about 2^50 work per structure by the ladder
            above. b = 2 requires the whole of k_10 plus a diagonal of k_9, and the AES-128
            key schedule makes k_9 a function of k_10, so the guess space is 2^128 on its
            face. THE FOLD REDUCES THE COST PER GUESS, NOT THE NUMBER OF GUESSES.
          verdict: DEFERRED_UNBOUNDED
          verdict_justification: >-
            I CANNOT EXHIBIT AN UPPER BOUND BELOW 2^128 FOR d=4, t=1, b=2 WITHOUT
            MACHINERY I WOULD HAVE TO RECALL. Under the RT-9 correction adopted in
            DEC-20260731-017 that is a FACT ABOUT THIS SESSION'S SEARCH and is recorded as
            DEFERRED_UNBOUNDED. It is explicitly NOT an IN_SCOPE_VACUOUS verdict, it is
            NOT a statement that 7-round integral attacks do not exist, and it is kept OUT
            of every count of candidates ruled out in this report.
          asymmetry_that_matters: >-
            t is cheap in data and expensive in time; b is the reverse. That asymmetry is
            why the d=5, t=1, b=1 shape is strictly better than d=4, t=1, b=2 at the same
            R = 7, and it is the second independent reason CAND-RR78-A is ranked first.
        interfaces_required: >-
          n = 1 for the object itself - the register lives at ONE interface, per the
          DEC-20260731-017 clause (ii) rule. n = 1 IS NOT A LICENCE and the separate
          tractability judgement follows.
        tractability_judgement_separate_from_n: >-
          The SCALED-DOWN gate is tractable at minutes to an hour. The FULL-SIZE
          computation is NOT tractable here and is not proposed - it is memory-blocked at
          2^32-entry tables well before it is time-blocked.
        estimated_cost:
          implementation: high
          compute: medium
        recommended_priority: medium

    - idea:
        id: IDEA-20260801-904
        internal_id: CAND-RR78-D
        rank: 4
        title: >-
          the truncated-support miss-in-the-middle object, measured in its SIEVABLE form
          because the impossibility itself is not samplable
        class: measurement
        claim: >-
          There exists a set of ciphertext differences of density about 2^-32 which, for
          pairs drawn from a full diagonal coset after 4 rounds, is hit EXACTLY ZERO
          times, against a null expectation of about 2^15 hits - and the falsifiable
          content is the exact largest r at which the count is exactly zero.
        mechanism: >-
          The tracked object is the 16-bit truncated activity support. A forward truncated
          pattern holding with probability 1 for a rounds and a backward one holding with
          probability 1 for b rounds, whose middles are incompatible, yields an
          (a+b)-round impossible transition. From the same two facts as CAND-RR78-A the
          deterministic reach is 2 rounds forward and 2 backward, so a + b = 4 is what the
          trail supplies and the contradiction sits in the middle. It stops at 4 because
          MixColumns applied to a full column space spans - there is no third
          deterministic layer to harvest in either direction.
        novelty_status: unverified
        novelty_note: >-
          Repackaging of a named family (baseline_map.md section 4 records impossible
          differential with a recalled 4-round impossibility and key recovery to 7, recall
          LOW-MEDIUM, used to neither promote nor dismiss). The campaign's own CAND-FR-1
          projection analysis applies verbatim. Literature not checkable. Unverified.
        lossy_projection_test:
          verdict: PASSES
          what_is_discarded: 128 bits of difference projected to a 16-bit support pattern
          why_the_discard_is_compatible: >-
            Identical to baseline_map.md section 5.3, which this campaign already ran -
            discarded compatibly with AddRoundKey (trivial on differences), ShiftRows
            (permutes supports), MixColumns (branch-number support rule), and
            CONSERVATIVELY at SubBytes (support-preserving; an accidental cancellation
            makes the pattern an over-estimate, the safe direction).
        why_the_obvious_gate_is_inadmissible: >-
          The impossibility cannot be sampled directly. A (1 active byte in, 1 active byte
          out) 4-round transition has null probability 2^-120 and NO MACHINE SAMPLES THAT.
          Any gate of that shape is inadmissible here and I say so rather than proposing
          it. A MILP or SAT search for the longest impossible differential is ALSO
          inadmissible on this machine - no solver is available - and I do not propose
          one.
        the_runnable_substitute: >-
          Two parts. PART 1 - verify the two deterministic halves and the middle
          contradiction SEPARATELY. Each is a probability-1 statement over a coset and
          each is exhaustively checkable on 2^24 texts in under a second, with no solver.
          PART 2 - measure the SIEVABLE form. Over a full diagonal coset at r = 4, count
          pairs whose difference lies in the impossible set of density about 2^-32, where
          the null predicts about 2^15 hits and the property predicts EXACTLY ZERO. That
          is an unambiguous effect at 32768-to-0, and it REUSES GATE-RR78-1's bucketing
          machinery byte for byte.
        predictions:
          - metric: count of pairs hitting the impossible set at r = 4
            direction: lower
            minimum_effect: >-
              exactly 0 against a null expectation of about 2^15. Anything above 0 falsifies
              the impossibility as stated at this density
          - metric: same at r = 5
            direction: different
            minimum_effect: >-
              expected to rise to the null. If it stays at 0 the property is deeper than 4
              and that is the finding
          - metric: same at r = 10
            direction: different
            minimum_effect: must equal the null, or the reading is an artifact
        minimal_test:
          design: >-
            GATE-RR78-4. Shares GATE-RR78-1's program. Same 2^24 or 2^32 diagonal coset,
            same AES-NI sweep, same bucketing pass, different target subspace - the
            impossible set instead of the mixed space. Sweep r = 3,4,5,6,10 with 20
            independent (key, coset) trials. Runtime and memory identical to GATE-RR78-1.
          controls:
            - NULL 1, r = 10 random-permutation surrogate. Count must equal the null.
            - NULL 2, random plaintexts instead of a coset. Count must equal the null.
            - >-
              NULL 3, sibling impossible set - a DIFFERENT subspace of the same density
              that is not the miss-in-the-middle target. Required by KN-FIND-018 practice
              rule 6.
            - >-
              POSITIVE CONTROL. At r = 2 the coset maps to a coset of a mixed space, so
              the count against a target CONTAINING that mixed space must be maximal. If
              not, instrument broken and every reading VOID.
          required_metrics:
            - exact hit count per trial, never only the zero/nonzero bit
            - null expectation computed from the measured density, not assumed
            - the density of the impossible set, computed exactly rather than quoted
        falsification_conditions:
          - nonzero hits at r = 4 in any trial. The 4-round impossibility as posed is false at this density.
          - zero hits at r = 10. Artifact tell - the target set is probably empty or mis-specified. Reading VOID.
          - NULL 3 (sibling set) also reads zero. The attribution to miss-in-the-middle is withdrawn.
        confounders:
          - >-
            Mis-specifying the impossible set so that it is empty or has the wrong
            density. Compute the density exactly by enumeration and report it; a zero
            count on an empty set is not a finding.
          - >-
            The 2^32 coset's counter array overflowing and truncating a nonzero count to
            zero. Overflow guard mandatory.
        interpretation_limits:
          - >-
            A zero count is a scoped observation on the tested keys, cosets and target set.
            It is NOT a proof of impossibility (AGENTS.md - absence of a witness within
            budget is only ever a scoped negative observation).
          - claim_tier toy
        heuristic_assumptions:
          - id: H5
            statement: >-
              Under a random permutation the number of pairs from a 2^24-set whose
              difference lies in a fixed set of density 2^-32 is Poisson with mean about
              2^15.
            rigorous_support: >-
              2^47 pairs each qualifying with probability 2^-32 independently to first
              order; Poisson approximation by Le Cam's inequality with total variation
              error bounded by the sum of squared probabilities, which is negligible here.
              This is the classical Poisson limit for rare events, imitated.
            validation_plan: >-
              MEASURED IN THE SAME RUN as NULL 1 at 2000 trials, empirical mean and
              variance compared against Poisson(2^15) by a chi-square on binned counts,
              with a tail check on the smallest and largest observed counts. TOY SCALE.
        key_wrapping_arithmetic:
          how_many_rounds_key_guessing_wraps: >-
            The distinctive economics of this family is that the extension is a SIEVE, not
            a sum - each pair exhibiting the impossible pattern under a candidate key
            ELIMINATES that key, so the surviving candidate count falls geometrically.
            That tolerates a larger t + b than a summing attack does. The binding resource
            is DATA, not time, because enough pairs are needed to sieve 2^(guessed key
            bits) down to one.
          verdict_on_the_total: DEFERRED_UNBOUNDED
          verdict_justification: >-
            I can state the SHAPE of the economics but I cannot exhibit an end-to-end
            upper bound for the wrapped attack without recalled machinery. Per RT-9 that is
            a fact about this session's search and is recorded as DEFERRED_UNBOUNDED, kept
            out of every count of rulings, and is NOT a vacuity verdict.
        target_complexity:
          time_exponent: n/a as an attack. Gate cost identical to GATE-RR78-1.
          memory_exponent: identical to GATE-RR78-1 - 128 MB at 2^24, 4 GB at 2^32
          best_known: UNRESOLVABLE in this environment. No primary source reachable.
          hidden_overhead: none in the gate; the wrapped attack's overhead is unbounded here by admission
          tradeoff_note: shares GATE-RR78-1's memory-blocked sequential execution at 2^32
        interfaces_required: n = 4
        tractability_judgement_separate_from_n: TRACTABLE - it is GATE-RR78-1's program with one constant changed.
        estimated_cost:
          implementation: low
          compute: low
        recommended_priority: medium-high

    - idea:
        id: IDEA-20260801-905
        internal_id: CAND-RR78-E
        rank: 5
        title: >-
          the DS-MITM parameter tuple - measuring the true parameter support, because the
          table size is what actually binds
        class: representation
        claim: >-
          The number p of byte-parameters on which the 4-round delta-set output difference
          sequence actually depends is exactly measurable by perturbation, and if the
          measured support is strictly below the structural count then the precomputed
          table is smaller than the structural count implies and the family reaches
          deeper.
        mechanism: >-
          The matching object is NOT the 255-byte sequence - see objects_dropped OD-1,
          which fails the lossy-projection test because 2040 bits exceeds 128 bits of key,
          so the sequence almost certainly DETERMINES the key and discards nothing that
          matters. What makes the family work is PRECOMPUTABILITY - the sequence factors
          through a small parameter tuple. The object is therefore the tuple, the
          lossiness is state-to-parameters, and the binding cost is 2^(8p). Everything
          else - data, the online phase, the matching cost - is secondary. The family
          reaches exactly as deep as 8p stays below the key size, which is why differential
          enumeration, which CONSTRAINS the tuple rather than the sequence, is the only
          lever that has ever moved it.
        novelty_status: adaptation
        novelty_note: >-
          The family is named in baseline_map.md section 4 with a recalled table-parameter
          remark at recall confidence LOW, used to neither promote nor dismiss. The
          RELABELLING of the object from sequence to tuple, and its justification by the
          lossy-projection test, is done here. That p itself is exactly measurable by
          perturbation is elementary. Literature not checkable. Adaptation, not novel.
        lossy_projection_test:
          verdict: PASSES for the tuple, FAILS for the sequence
          what_is_discarded: >-
            state-to-parameters discards everything about the internal state except the
            few bytes the sequence depends on
          why_the_discard_is_compatible: >-
            By definition of the parameter set - the sequence is a function of the tuple,
            so the tuple propagates the sequence deterministically. What is NOT known
            without measurement is HOW SMALL the tuple is, and that is the gate.
        predictions:
          - metric: measured parameter support p for the 4-round delta-set sequence
            direction: different
            minimum_effect: >-
              any value. A support strictly below the structural count is a genuine
              finding that shrinks the table; a support EQUAL to the structural count
              confirms the structural count by measurement for the first time in this
              program, which is also a real answer
          - metric: measured support on the independent-round-key null
            direction: higher
            minimum_effect: >-
              must be at least the AES support. If the null is SMALLER, the measurement is
              detecting the wiring rather than the cipher and the reading is VOID
        minimal_test:
          design: >-
            GATE-RR78-5. Fix a delta-set (256 texts differing in one byte) and a target
            output byte after 4 rounds. Enumerate the candidate parameter bytes - the
            round-key and intermediate-state bytes that structurally enter the computation
            of that output byte over 4 rounds. For each candidate independently, vary it
            over all 256 values with everything else fixed and test whether the 255-byte
            output DIFFERENCE sequence changes. A candidate the sequence does not depend
            on is not a parameter. Repeat over 100 random base configurations to exclude
            an accidental degeneracy at one base. Total cost about 100 x (candidates) x
            256 x 256 x 4-round AES - SECONDS on one core.
          controls:
            - >-
              NULL OBJECT - independent random round keys, same wiring. The support should
              be the full structural count; a smaller null support means the probe is
              measuring wiring, not cipher.
            - >-
              POSITIVE CONTROL - a parameter known by construction to matter (a byte of
              the last round key on the target column) must always read as depended-upon.
              If it does not, the probe is blind and every reading is VOID.
            - >-
              DEGENERACY CONTROL - repeat over 100 random bases. A dependency that appears
              at one base and not others is a degeneracy, not a structural fact. This is
              KN-FIND-018 practice rule 4 (confirm with multiple random vectors, never one
              structured vector) applied here.
          required_metrics:
            - per-candidate dependency bit, per base, with exact counts
            - the resulting support p, reported as a range over bases and not a single number
            - the implied table size 2^(8p), and 2^(8p) against the 128-bit key size
            - the null's support under identical treatment
        falsification_conditions:
          - >-
            the positive control reads as not-depended-upon. Probe blind, all readings
            VOID.
          - >-
            the null's support is SMALLER than AES's. The probe is measuring wiring and the
            reading is VOID.
          - >-
            the support varies wildly across bases with no stable value. There is no
            well-defined p at this framing and the candidate falls as posed.
        confounders:
          - >-
            Confusing structural presence with functional dependence. A byte can enter the
            computation and still not change the DIFFERENCE sequence, because the sequence
            is a difference and a constant offset cancels. That cancellation is exactly the
            interesting case and must not be coded away.
          - >-
            Single-base degeneracy. KN-FIND-018 rule 4 records that a structured
            key/plaintext can whiten to a constant state on which MixColumns is the
            identity, hiding a real dependency completely. Hence 100 random bases.
        interpretation_limits:
          - >-
            A measured support is a fact about this framing of the parameter set. A
            DIFFERENT framing (different target byte, different delta-set position) may
            give a different p, and the measurement must be run across framings before any
            p is quoted.
          - >-
            A small p does NOT by itself produce an attack. The table must also be
            constructible and matchable, neither of which this gate touches.
          - claim_tier toy
        heuristic_assumptions:
          - id: H6
            statement: >-
              Functional dependence of the output difference sequence on a parameter byte
              is detected with probability 1 - 2^-k over k random bases, i.e. a genuine
              dependence fails to show at a random base only with probability bounded away
              from 1.
            rigorous_support: >-
              If the sequence depends on the byte at all, the set of bases at which it
              does not is a proper algebraic subset; over 100 independent random bases the
              probability of missing it is bounded by (fraction of degenerate bases)^100.
              What is NOT rigorous is a bound on that fraction, which is why the degeneracy
              control reports the per-base spread rather than a single verdict.
            validation_plan: >-
              Report the per-base dependency histogram rather than a majority vote. A
              parameter depended upon at 100 of 100 bases and one depended upon at 3 of 100
              are different objects and must not be collapsed. TOY SCALE.
        target_complexity:
          time_exponent: >-
            n/a as an attack. The BINDING quantity this candidate measures is the table
            size 2^(8p); the gate itself costs about 2^28 AES calls, i.e. seconds.
          memory_exponent: negligible for the gate. The TABLE it measures is 2^(8p) and that is the point.
          best_known: >-
            UNRESOLVABLE in this environment. baseline_map.md section 4 recalls the family
            capping near 8-9 rounds at recall LOW; used to neither promote nor dismiss.
          hidden_overhead: >-
            None in the gate. In the attack, table CONSTRUCTION cost is separate from table
            size and is not measured here - that gap is named rather than absorbed.
          tradeoff_note: >-
            This family is the purest time-memory object in the file - the whole attack is
            a memory-for-time trade and its position on the frontier is set by p alone.
        interfaces_required: n = 4
        tractability_judgement_separate_from_n: TRACTABLE - seconds, no memory pressure.
        estimated_cost:
          implementation: medium
          compute: low
        recommended_priority: medium

  # =====================================================================
  # THE SIX-ROUND QUESTION - STRAIGHT ANSWER
  # =====================================================================
  six_round_distinguisher:
    question: Is a 6-round distinguisher reachable, and on what basis?
    literature_position: >-
      I DO NOT KNOW AND I REFUSE TO ANSWER FROM MEMORY. baseline_map.md row R10 records
      best structural distinguisher depth 6 rounds at recall confidence LOW-MEDIUM with
      data and time both recorded as large. Per DEC-20260731-019 ruling 3 that row may
      promote nothing and dismiss nothing, and it is used for neither here.
    my_position: >-
      A 6-round distinguisher is PLAUSIBLE, but the version that would matter almost
      certainly is not CHEAP, and that distinction is the whole answer. A distinguisher at
      6 rounds whose data cost approaches the codebook does NOT make 8 rounds a routine
      extension, because the extension multiplies data by the top structure and time by the
      guess space. A 6-round distinguisher that does not fit inside 2^128 divided by the
      extension cost buys nothing at all.
    the_argument_and_it_is_an_argument_not_a_theorem:
      - >-
        Step 1. Every deterministic structure this machine can exhibit bottoms out in the
        subspace trail, worth 2 rounds forward and 2 backward. That is 4 rounds of free
        structure with nothing in the middle.
      - >-
        Step 2. Every object that reaches 5 does so by adding a pairing, orbit or counting
        argument that survives ONE further mixing layer without propagating a difference
        pattern. CAND-RR78-A's residue and CAND-RR78-B's swap are both exactly this, and so
        is the mixture identity this campaign verified 2000 of 2000.
      - >-
        Step 3. To reach 6 an object must survive THREE mixing layers on one side of the
        middle. The branch-number argument gives no handle there - after three layers every
        byte of the difference depends on every byte, so no support-based, coset-based or
        cell-based projection is preserved. What remains is only a counting argument
        insensitive to values, and I CANNOT NAME A MECHANISM THAT SUPPLIES ONE.
      - >-
        Step 4. Therefore my expectation is that any 6-round distinguisher pays for the
        third layer in DATA.
    closure_status: >-
      NOT A CLOSURE. Under docs/inventor-protocol.md section 4 the above has a named
      DIFFICULTY but NO OBSTRUCTION ARGUMENT, so its honest status is `unverified`. It is
      explicitly NOT recorded as a lane closed, and Idea Generator prohibitions forbid
      declaring the direction impossible - which is not done here.
    the_forward_position_which_is_better_than_an_opinion: >-
      GATE-RR78-1 TESTS r = 6 AT ZERO MARGINAL COST. Same program, same coset, same counter
      pass, one extra AESENC. If the residue survives to 6 the answer is affirmative and it
      was obtained in 0.2 s. If it does not, the answer is `not by this object`, which is a
      scoped negative closing exactly one readout of one object. That is the cheapest
      possible purchase of an answer to the highest-value question in the brief and it is
      the primary reason CAND-RR78-A is ranked first.

  # =====================================================================
  # ADMISSIBILITY ON THIS MACHINE
  # =====================================================================
  machine_envelope:
    cores: 4
    memory_gb: 15
    toolchain: gcc with -maes
    throughput_aes_per_sec_per_core: 75000000
    aggregate_reach_log2_aes_per_sec: 28.2
    available: [python3, pycryptodome]
    absent: [numpy, sage, MILP, SAT, GPU]
    measured_reference_points_from_prior_records:
      - >-
        2^32-text AES-NI sweep - 53 s single core, from
        coordination/goals/GOAL-AES-002/depth_wall_receipt.json
      - >-
        implied reduced-round throughput about 8.1e7 AES/s/core, consistent with the
        7.5e7 figure in throughput_receipt.json

  inadmissible_gates_and_their_substitutes:
    - solver_task: MILP search for the longest integral or division property
      inadmissible_because: requires an ILP solver, absent
      runnable_substitute: >-
        DIRECT MEASUREMENT. GATE-RR78-1's r-sweep decides survival empirically at 2^24 to
        2^32 texts, which is what the MILP would only predict. The campaign has already
        done the equivalent for the raw integral (4 rounds balanced, 5 rounds not).
    - solver_task: SAT or MILP search for impossible differentials
      inadmissible_because: requires a solver, absent
      runnable_substitute: >-
        GATE-RR78-4. Verify the two deterministic halves exhaustively over a coset (under
        a second each) and measure the SIEVABLE count against a 2^-32 null.
    - solver_task: MILP bound on the number of active S-boxes
      inadmissible_because: requires a solver, absent
      runnable_substitute: >-
        EXHAUSTIVE SMALL-CASE ENUMERATION. The branch number of the pinned MixColumns and
        the exact DDT and LAT maxima of the pinned S-box are computable by brute force over
        2^16 in seconds, and the 4-round active-S-box count follows from them by hand.
        baseline_map.md O-1 already says any session using it should recompute rather than
        quote.
    - solver_task: Groebner basis or first-fall degree measurement
      inadmissible_because: >-
        declared OUT OF ENVELOPE by baseline_map.md section 7(iv) rather than estimated
      runnable_substitute: >-
        NONE PROPOSED. Left out of envelope rather than estimated. Naming no substitute is
        the honest answer here.

