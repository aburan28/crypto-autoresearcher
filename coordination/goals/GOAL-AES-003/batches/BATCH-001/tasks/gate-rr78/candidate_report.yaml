      definitional exhaustive key search on the full cipher - checked axis by axis - TIME,
      the reference dominates every item here, because nothing here claims an attack;
      MEMORY, every gate uses between negligible and 4 GB against the reference's O(1), so
      every gate is DOMINATED ON MEMORY; DATA, every gate uses 0 oracle queries (all
      encryptions are offline and self-chosen), so nothing here is dominated on data.
    sota_delta: >-
      0 BITS. This session produces no attack, no distinguisher, no speedup and no
      measurement. Its quantitative content is exactly three things - one derived
      partial-sums cost ladder (2^72 to about 2^50 per structure, derived here and exposed
      line by line so it can be attacked), one object relabelling that makes the DS-MITM
      binding cost visible instead of hidden (sequence to parameter tuple, justified by the
