  # =====================================================================
  # ITEM 1. THE MEASURED COST COMPARISON (r=5 key recovery vs REF-A)
  # =====================================================================
  cost_audit_r5:
    reported_number: '25.66 s wall clock (attack/attack5_out.json, field "seconds")'
    what_the_number_actually_covers: >-
      Read from sq.c mode_attack5: t0 is taken AFTER ni_key_expand and srand and
      BEFORE the structure loop; t1 is taken AFTER the last structure and BEFORE
      key_invert. The interval therefore includes (a) chosen-plaintext
      generation, (b) all 2^33 five-round AES-NI encryptions, (c) parity
      accumulation, and (d) all 1,056,768 partial decryptions of the candidate
      sieve. It is the whole solving pipeline including data generation, not
      only the solving phase. 25.66 = 12.70 + 12.96, the two per-structure
      times, so the sieve cost is inside rounding.
    terms_OUTSIDE_the_25_66_s:
      - id: 'C1'
        term: 'compilation of sq.c'
        magnitude: 'order 1 s, once'
        charged: false
      - id: 'C2'
        term: 'ni_key_expand + S-box/tables + srand'
        magnitude: 'microseconds'
        charged: false
      - id: 'C3'
        term: 'key_invert (rk_last -> master), taken after t1'
        magnitude: 'microseconds'
        charged: false
      - id: 'C4'
        term: 'target (plaintext,ciphertext) pair generation via the separate `sq targets` invocation, producing targets_r5.json'
        magnitude: 'milliseconds'
        charged: false
      - id: 'C5'
        term: 'THE CERTIFICATE CHECK ITSELF. certify.py under pycryptodome on 4 blocks, plus interpreter startup.'
        magnitude: 'order 0.5 s'
        charged: false
        note: 'This is the term the harness cares about most and it is not in any reported figure. It is still negligible at this scale, but it must be named, not assumed.'
      - id: 'C6'
        term: 'THREAD COUNT AND MACHINE. The run used 4 threads (visible only in attack/INDEPENDENT-VERIFICATION.json command line, `./sq attack5 ... 4`). Receipt 902 says "on the stated machine" but STATES NO MACHINE: no CPU model, no core count, no clock, no memory, no OS, no compiler flags anywhere in receipt 902.'
        magnitude: 'not a time term; it is a missing denominator'
        charged: false
        severity_pointer: 'DEF-02'
      - id: 'C7'
        term: 'CPU-seconds versus wall-clock. 25.66 s wall on 4 threads is approximately 102.6 CPU-s. Only wall clock is reported. A comparison against REF-A must fix one unit; the package fixes none.'
        magnitude: '4x'
        charged: false
      - id: 'C8'
        term: 'ORACLE QUERY / DATA TRANSPORT. The 2^33 chosen plaintexts are never materialised and never leave the process: sq.c generates the plaintext in a register, encrypts it with AES-NI under the target key in the same loop, and accumulates parity. The attacker plays the oracle. In a real chosen-plaintext model the same attack costs 2^33 oracle queries, i.e. 2^33 * 16 B = 128 GiB of plaintext submitted and 128 GiB of ciphertext returned. That transport is charged at exactly zero here.'
        magnitude: 'unbounded in the query model; zero as measured'
        charged: false
        severity_pointer: 'DEF-01'
      - id: 'C9'
        term: 'MEMORY. Audited by inspection of sq.c: the working set is per-thread parb[16][256] = 4 KiB plus a 16x4 uint64 fold, plus cand[16][256] = 4 KiB in the driver. Total well under 1 MiB, L1/L2 resident, with no 2^33-sized array anywhere. There is no memory term to add back and no time-memory tradeoff to charge.'
        magnitude: '< 1 MiB'
        charged: false
        note: 'This is the one omitted term that is genuinely, verifiably negligible, and the receipt should say so rather than leave it silent. Contrast count5, which mmaps 4 GiB (see cost_audit_count5).'
      - id: 'C10'
        term: 'PRECOMPUTATION. None. attack5 builds no table beyond the S-box; build_gm() is called only in modes 6 and 7. There is no precomputation to amortise and no eliminated search dimension whose cost went uncharged.'
        magnitude: 'zero'
        charged: false
    honest_end_to_end_total: >-
      Adding back every term above: at most 30 s wall clock, at most about 110
      CPU-seconds on 4 threads, under 1 MiB working set, 2^33 chosen plaintexts
      generated in-process, one independent-implementation certificate check.
      Call it 1.2x the reported 25.66 s. Nothing found in the audit is larger
      than a constant factor.
    REF_A_charged_at_the_same_rate: >-
      The measured throughput is 2^33 / 25.66 = 3.35e8 five-round AES-NI
      encryptions per second on this machine at 4 threads. Charging REF-A one
      five-round encryption plus a comparison per trial at that same measured
      rate gives 2^128 / 3.35e8 = 1.02e30 s = 3.2e22 years. This is arithmetic
      from the key length and the package's own measured throughput; no external
      figure enters.
    ruling: >-
      THE COMPARISON HOLDS, with about 28 orders of magnitude of headroom. The
      honest total (<=30 s wall) is roughly 3.4e28 times cheaper than REF-A
      charged at the package's own measured per-trial rate. Multiplying the
      attack side by 1000x for every uncharged term would still leave 25 orders
      of magnitude. RQ-AES-003 BT-1 is met at r=5 on the tested machine, key
      size, round convention and solver. Two things must nevertheless be stated
      alongside it and currently are not: the comparison is in wall-clock on an
      unnamed 4-thread machine, and the attack's 2^33 chosen plaintexts are
      charged at zero transport because the process is its own oracle.
    where_the_cost_comparison_does_NOT_hold:
      - claim: 'the r=6 hinted run'
        finding: >-
          attack/INDEPENDENT-VERIFICATION.json states, in the producer's own
          words, that exhaustive search over the SAME restricted residual would
          take about 25 s against the attack's 69 s. That is a measured LOSS to
          a generic baseline the campaign can implement. Receipt 902's r6 block
          does not contain it, contains no dominated_by field, and its
          cost_comparison block discusses r=5 only. Under AGENTS rule 5 and the
          Pareto-honesty requirement, an r=6 result promoted into EV-AES-005
          without that line would be a fabricated null on the dominated_by axis.
        severity_pointer: 'DEF-03'
      - claim: 'the r=7 run'
        finding: >-
          No baseline is stated at all, and the correct one is free. See
          item_6_the_one_that_would_hurt_most and DEF-01.
    cost_audit_count5:
      finding: >-
        count5.c mmaps 1<<32 bytes = 4 GiB of counter array with MADV_HUGEPAGE,
        4 threads, and each full-coset arm costs 355-517 s (count5/raw.jsonl).
        Fifteen arms were run, roughly 1.7 hours of wall clock and a 4 GiB
        resident working set. Receipt 903 reports NEITHER the memory nor the
        time for any arm. The r=4 bijection and the r=5 residue are the two
        claims that rest on this engine, and neither is costed anywhere in the
        package. This matters concretely for the priority control: adding 7 more
        matched-null arms costs about 1 hour and 4 GiB, which is affordable, and
        that fact is invisible from the receipts.
      severity_pointer: 'DEF-04'
    cost_audit_unreported_positive:
      finding: >-
        attack/compare6_out.json contains the package's only measured
        self-implemented baseline comparison: naive tail 19.191 s versus
        partial-sums tail 0.100 s, measured_speedup 191.89, op_count_ratio
        85.60, same_candidate_set 1, on identical inputs. That is exactly the
        shape RQ-AES-003 BT-2 asks for, and it appears in NO receipt. Recorded
        here so the archiver does not lose it; it is a legitimate `measured`
        result about the partial-sum tail and it is not a claim about AES.

  # =====================================================================
  # ITEM 2. THE REF-A / LITERATURE BOUNDARY (RQ-AES-003 R3)
  # =====================================================================
  ref_a_literature_boundary_audit:
    method: 'read every place the package states a comparison, a superlative, a novelty status, or a "what this is not", and asked whether a reader who knows nothing about published cryptanalysis would be led to import one.'
    verdict: 'MOSTLY RESPECTED, WITH ONE OUTRIGHT BREACH AND ONE STRUCTURAL RISK.'
    breach:
      id: 'DEF-05'
      where: 'coordination/goals/GOAL-AES-003/batches/BATCH-001/tasks/attack/INDEPENDENT-VERIFICATION.json, field what_this_does_NOT_establish[0]'
      text_as_written: '"Novelty. The integral/square attack on 5-round AES is a standard technique and this is very probably a rediscovery."'
      why_this_is_a_breach: >-
        DEC-20260731-019 ruling 3 is symmetric: an unverified recollection of
        the literature may be used neither to promote NOR to dismiss. The
        sentence asserts, as flat fact and from recollection, both that the
        technique is standard and that this work is very probably a
        rediscovery. That it is deployed to DEFLATE the result does not make it
        permitted; ruling 3 exists precisely to stop the deflating direction
        being treated as the safe one. The trailing clause ("recorded as
        unadjudicable rather than as either") does not repair the two assertions
        that precede it.
      the_correct_form_is_already_in_this_package: >-
        newdist/candidates.yaml CAND-ND-1 shows the compliant handling:
        novelty_status "unverified", novelty_note tagged
        "unverified-from-memory, recall confidence MEDIUM-HIGH, used neither to
        promote nor to dismiss", plus an explicit statement that the recollection
        is not load-bearing because D1-D6 are derived in-session. The package is
        internally inconsistent in applying its own rule.
      required_repair: >-
        EV-AES-005 must say "this package does not establish novelty for any
        result in it, and no primary source is reachable here", and must not
        repeat or paraphrase the standard/rediscovery assertion in either
        direction.
    structural_risk_by_omission:
      id: 'DEF-06'
      finding: >-
        The "no literature comparison" disclaimer is present in receipt 902's
        cost_comparison, in receipt 904's r6 block, and in ladder/LADDER-RESULT
        WHAT_THIS_IS_NOT. It is ABSENT from receipt 903 entirely - the r=4 exact
        bijection and the r=5 mod-8 residue, which are the package's two most
        striking-sounding distinguisher statements, carry no novelty or
        literature boundary at all. Uneven disclaimer coverage is exactly the
        mechanism by which a package becomes dishonest without any single
        sentence being false: a reader meets "over the FULL 2^32 coset the
        projection is a bijection" with no boundary attached and supplies the
        missing comparison themselves.
      required_repair: 'the boundary statement attaches to EVERY claim in EV-AES-005, not to the ones that happen to have inherited one.'
    implicature_check_on_the_r5_headline:
      finding: >-
        "A working, executed, certified key recovery on 5-round AES-128 ... in
        ~27 seconds on 4 cores" is a true, self-contained, definitionally
        anchored statement, and REF-A is correctly characterised throughout as
        following from key length and checkable offline. I find no phrasing in
        the four receipts that smuggles a published-cryptanalysis comparison
        into the REF-A comparison itself. The REF-A framing is clean.
    implicature_check_on_the_death_round:
      finding: >-
        Receipt 904's "measured_death_round: between r=5 and r=6 FOR THIS
        STATISTIC AS THIS CAMPAIGN MEASURED IT" plus its explicit not_a_comparison
        clause is the best-scoped sentence in the package. No objection.

  # =====================================================================
  # ITEM 3 + 4. PER-CLAIM TIER RULING AND CHEAPEST FALSIFYING CONTROL
  # =====================================================================
  claims:

    - id: 'RT-C01'
      claim: 'certified 5-round AES-128 key recovery, unique candidate per byte, master key recovered and certified against an independent implementation; 2^33 chosen plaintexts, 25.66 s'
      source: 'receipt 902 r5_key_recovery; attack/attack5_out.json, rerun_attack5.json, k2_attack5.json'
      assigned_tier: 'measured'
      verdict: 'TIER UPHELD. This is the strongest claim in the package and the only one with a solution certificate.'
      scope_that_must_travel_with_it: 'AES-128, r=5, the pinned final-round-drops-MixColumns convention, single key, chosen plaintext, one unnamed 4-thread machine, wall clock, in-process oracle.'
      cheapest_falsifying_control: 'run the identical binary at r=10 (a permutation stand-in) and require it to FAIL to produce a unique key.'
      control_ran: true
      control_result: 'attack/ctl_prp10_out.json: unique 0, and three bytes have EMPTY candidate sets (survivors 0,0,0). The control is rejected. This is what makes the r=5 uniqueness interpretable.'
      second_cheapest_control: 'run on a key the executor never saw.'
      second_control_ran: true
      second_control_result: 'attack/INDEPENDENT-VERIFICATION.json, key 8b0e2b41..., exact match, 27.14 s, certificate at full 10 rounds under pycryptodome. See RT-C02 for its independence status.'
      residual_objection: 'none that threatens the claim. The uncharged terms are constant factors (see cost_audit_r5) and the certificate is at 10 rounds in the corroborating run, which pins the master key rather than a round-equivalent key.'

    - id: 'RT-C02'
      claim: 'the r=5 recovery works on a freshly generated key the producer never saw'
      source: 'receipt 902 r5_on_a_key_the_producer_never_saw'
      assigned_tier: 'measured'
      verdict: 'TIER UPHELD FOR THE MEASUREMENT, BUT ITS SUPPORT IS SINGLE-SOURCE. Only the dispatching session ran it. Under standing basis 0137a051 that is session independence and code-path independence, not model independence.'
      cheapest_falsifying_control: 'a third party runs the same binary on its own fresh key.'
      control_ran: false
      note: 'the receipt already labels this CORROBORATION and not validation. No objection to the labelling; it must survive into EV-AES-005 verbatim.'

    - id: 'RT-C03'
      claim: 'r=6: no unique key; with 3-of-4 K6-prime hint bytes per diagonal, survivors remain on one structure; 74.03 s'
      source: 'receipt 902 r6; attack/attack6_out.json'
      assigned_tier: 'measured'
      verdict: 'TIER NOT SUPPORTED AS STATED. Two defects. (1) attack/attack6b_out.json, same bases, same hint budget, reports unique:1 and recovered_master 2b7e1516...28aed2a6... i.e. the CORRECT FIPS-197 key, in 69.39 s. The receipt reports the failing run as the r=6 outcome and does not mention the succeeding one, and no artifact designates which run is authoritative or what changed between attack6 and attack6b (attack6 also emits a WRONG master, 2bbf6e6c...). (2) No dominated_by: the producer measured that exhaustive search over the same restricted residual costs about 25 s against this run 69 s, so the r=6 hinted attack LOSES to a generic baseline, and receipt 902 does not say so.'
      required_downgrade: 'record as: two discrepant r=6 runs exist; the succeeding one (attack6b, unique:1, 69.39 s) is DOMINATED by ~25 s exhaustive search over the same hinted residual. Not a positive r=6 result under RQ-AES-003 BT-1 or BT-2.'
      cheapest_falsifying_control: 'a WRONG-HINT NULL: rerun attack6 with the three hint bytes per diagonal taken from an unrelated random key. If the filter still returns a unique surviving byte, the uniqueness is a property of the filter, not evidence about r=6.'
      control_ran: false
      note: 'this control was not flagged anywhere in the package and it is the cheapest thing on this whole card: one rerun, ~70 s.'

    - id: 'RT-C04'
      claim: 'r=7 GIVEN full K7 plus 3-of-4 K6-prime bytes per diagonal, the filter isolates the four remaining K6-prime bytes correctly (8034b976), 108.39 s, 2^33 chosen plaintexts'
      source: 'receipt 902 r7; attack/attack7_out.json'
      assigned_tier: 'measured'
      verdict: >-
        TIER UPHELD ONLY FOR THE NARROW READING "the level-4 balance filter
        still isolates a unique correct byte when one round is peeled with a
        given key", AND THE PACKAGE MUST SAY WHY. Reading sq.c mode_attack7:
        argv[2] is the MASTER KEY. The program expands it, computes
        K6' = MC^{-1}(K6) from rk[rounds-1], slices the hints out of k6p, and
        sets truth[d] = k6p[DIAGP[d][3]] from the SAME array. The AES-128 key
        schedule is invertible from any single round key, so "given full K7"
        is "given the master key". The four bytes reported as recovered are a
        closed-form function of the program's own input, already resident in
        memory before the search starts, computable in nanoseconds.
      what_the_receipt_says: 'it says "THIS_IS_NOT_A_7_ROUND_BREAK ... it is GIVEN the entire last round key ... it is NOT a 7-round key recovery." That is true and it is good practice. It does NOT say that K7 determines the master key, nor that the honest baseline for the reported quantity is zero work.'
      required_addition: 'a dominated_by stating that the reported recovery is dominated by free key-schedule arithmetic, and that the 108.39 s and 2^33 chosen plaintexts buy information about the FILTER, not about the key.'
      cheapest_falsifying_control: 'the same WRONG-HINT NULL as RT-C03: supply K7 from the true key but the 3-of-4 hint bytes from an unrelated key, or vice versa, and check whether unique_per_diagonal still reads 1. If it does, the uniqueness is an artifact of the filter geometry and the r=7 reading carries no information at all.'
      control_ran: false
      severity_pointer: 'DEF-01'

    - id: 'RT-C05'
      claim: 'random-permutation control for the key recovery: r=10 AES gives no unique key'
      source: 'receipt 902 random_permutation_control; attack/ctl_prp10_out.json'
      assigned_tier: 'measured'
      verdict: 'TIER UPHELD, LABEL WRONG. The null object is 10-round AES under a related key schedule, not a random permutation. The receipt does say "r=10 AES as a stand-in permutation", which is honest; EV-AES-005 must not compress that to "random-permutation control".'
      systemic_objection: 'SEE cross_cutting_objections.shared_null_object. Every null in this batch is 10-round AES.'
      cheapest_falsifying_control: 'n/a - this IS a control.'
      control_ran: true

    - id: 'RT-C06'
      claim: 'r=4: over the FULL 2^32 diagonal coset the inverse-ShiftRows-diagonal projection is an exact bijection - 0 colliding pairs, every bucket occupied exactly once'
      source: 'receipt 903 r4_exact_bijection; count5/raw.jsonl arm aes_r4; corroborated at N=2^20 and 2^24 by ladder/LADDER-RESULT.json'
      assigned_tier: 'measured'
      verdict: >-
        TIER UPHELD FOR THE MEASUREMENT AND ARGUABLY TOO LOW FOR THE STATEMENT,
        WHILE THE ATTRIBUTION AROUND IT IS OVERSTATED. Two separate rulings.
        (a) The measurement is exhaustive over the tested coset and has no
        detection floor; `measured` is right. Scope it honestly: ONE key at
        j0=3 at N=2^32 (count5/raw.jsonl has exactly one aes_r4 arm), plus 12
        keys at N=2^20 and 3 keys at N=2^24 from the ladder.
        (b) newdist/candidates.yaml derivations D1-D5 PROVE the statement:
        differences in D_0 give a round-1 difference in column 0 (D1); D3 makes
        at least one column of Delta_2 fully active; D4 then shows no column of
        Delta_3 can be zero; D5 transports that through a bytewise-bijective
        SubBytes and ShiftRows to the CW[j] projection at r=4. If that argument
        is sound, this is a theorem, not a measurement, and the tier for the
        MATHEMATICAL statement could rise above `measured` once the derivation
        is checked.
      the_attribution_objection: >-
        D4 and D5 use only three facts: SubBytes is a bytewise bijection,
        MixColumns has no zero entry, and the ShiftRows geometry. Nothing about
        the AES S-box and nothing about the specific MDS matrix. The package's
        own derivation therefore ALREADY answers the question receipt 905 calls
        untested: the r=4 zero is a fact about the round STRUCTURE of a large
        class of byte-oriented SPNs, not about AES-128. Calling it "a
        deterministic 4-round distinguisher for AES-128" (LADDER-RESULT
        WHAT_THIS_IS) is therefore an overstatement that the package's own
        derivation contradicts.
      cheapest_falsifying_control: 'COMPONENT NULL: recompile with a random bijective S-box (and separately with a random MDS-free-of-zeros MixColumns) and rerun the ladder at r=4, N=2^20. Cost: one recompile, seconds. D4/D5 predict 0 collisions in BOTH cases; if the recompile instead shows collisions, the implementation does not realise the derivation and the whole ladder is suspect.'
      control_ran: false
      note: 'the cheapest control here is also a PREDICTED control - the package can say in advance what it should read, which is what makes it worth one minute of compute.'

    - id: 'RT-C07'
      claim: 'the r=5 pair count reads n = 0 mod 8'
      source: 'receipt 903 r5_residue; count5/raw.jsonl'
      assigned_tier: 'analyzed'
      verdict: >-
        TIER UPHELD, BUT THE RECEIPT MISSTATES ITS OWN EVIDENCE IN BOTH
        DIRECTIONS AND BOTH MISSTATEMENTS MUST BE CORRECTED BEFORE THIS REACHES
        EV-AES-005.
      misstatement_1_understates_the_positive: >-
        The receipt says the residue rests on "a small number of trials" with
        "a 1-in-8 per-trial probability". count5/raw.jsonl contains SEVEN aes_r5
        full-coset arms (j0 = 0,3,2,2,1,2,3), and count5/commands.txt shows each
        was run under a DIFFERENT round-key schedule and base. All seven read
        n_mod8 = 0. An eighth arm, null_indep_roundkeys at r=5, also reads 0.
        Under the uniform null over seven independent trials that is 8^-7 =
        4.8e-7, not 1/8.
      misstatement_2_overstates_the_gap: >-
        The receipt lists "MATCHED RANDOM-PERMUTATION NULL on the mod-8
        statistic" under controls_NOT_run and calls it THE LOAD-BEARING GAP.
        The raw file contains arm null_randperm_aes10 (r=10, j0=2, same
        statistic, same N=2^32) reading n_mod8 = 2. The control WAS run, once,
        and read nonzero. The honest statement is "run at n=1, read 2 mod 8,
        underpowered", not "not run". A control reported as absent when the raw
        artifact contains it is a discrepancy between the claim statement and
        the evidence under AGENTS rule 5, even though here it errs toward
        caution.
      what_the_quantity_should_do: >-
        The parameter that should destroy this is r. It does: r=6 reads 7, 4
        (producer) and 0 (dispatcher), consistent with uniform; the sibling
        forward-diagonal projection at r=5 reads 2; the r=10 arm reads 2. This
        is decay in the right place, which is the opposite of the flat-when-it-
        should-decay artifact tell. That argues the residue is not a pure
        counting artifact - but one null trial cannot settle it.
      cheapest_falsifying_control: 'SEVEN MORE null_randperm_aes10 arms at N=2^32 under seven fresh key schedules, matched j0 to the AES arms. If the residues are uniform, the r=5 reading stands at p < 1e-6 and should be promoted; if two or more read 0, the residue is a counting artifact and the claim collapses. Cost, from raw.jsonl timings: ~500 s and 4 GiB each, about 1 hour of wall clock in total.'
      control_ran: 'PARTIALLY - one arm of the seven-arm control exists and read 2.'
      note: 'this remains the single highest-value unrun measurement in the batch, exactly as the queue objective says. The correction is that it is a POWER gap, not an existence gap.'

    - id: 'RT-C08'
      claim: 'r=6 mod-8 readings 7, 4, 0 are consistent with the uniform null; the 0 is a coincidence, not the property surviving a round deeper'
      source: 'receipt 903 r6; count5/raw.jsonl; DISPATCHER-r6-ADDENDUM.json'
      assigned_tier: 'measured'
      verdict: 'TIER UPHELD AND THE RULING IS CORRECT. This is the best piece of self-discipline in the package: the reading that would have been the campaign headline is recorded as a near-miss. No objection. Note only that the third reading is dispatching-session-only.'
      cheapest_falsifying_control: 'more r=6 arms; if they cluster on 0, the ruling is wrong.'
      control_ran: false
      note: 'not urgent. The r=5 null (RT-C07) dominates it in value.'

    - id: 'RT-C09'
      claim: 'the aes_r3 arm at N=65280 is an invalid measurement (V4 counter overflow), not a null result'
      source: 'receipt 903 invalid_measurements; count5/raw.jsonl shows max_occ 255 and overflow true'
      assigned_tier: 'measured (as an invalidity)'
      verdict: 'TIER UPHELD. Correctly recorded as invalid rather than dropped, consistent with AGENTS rule 3. No objection.'
      cheapest_falsifying_control: 'n/a'
      control_ran: 'n/a'

    - id: 'RT-C10'
      claim: 'yoyo-style adaptive distinguisher at r=5: 48 observed hits against a PRP-null expectation of 4.0, excess factor 12, Poisson tail p = 1.3e-34'
      source: 'receipt 904 r5; yoyo6/r5_fresh.json, r5_corr.json; yoyo5/DISPATCHER-REPLICATION.json'
      assigned_tier: 'measured'
      verdict: >-
        SPLIT RULING. The HIT COUNT is `measured` and the tier is upheld. The
        P-VALUE IS NOT `measured` AND SHOULD BE `analyzed`: the null expectation
        4.0 and the tail 1.3e-34 come from the analytic model in
        yoyo6/NULL_PROBS.json (W_ge_1 p = 9.313e-10 = 2^-30), not from an
        empirical null at matched N. That is a claim-tier error the coordinator
        did not flag, and it is the standard way an extreme p-value becomes an
        instrument artifact.
      unreported_control: >-
        yoyo6/iter5_prp.json EXISTS and is not in receipt 904 at all: label
        prp_r5_G8, N=2^30, hits1 = 0 against an analytic expectation of 1.0,
        while yoyo6/r5_fresh.json at HALF that N (2^29) reads hits1 = 10. That
        is the matched-stand-in control RQ-AES-003 explicitly demands for a
        distinguisher, it was run, it separates cleanly, and the receipt omits
        it. Omitting a control that PASSED is still a reporting defect, because
        the archiver cannot credit what the receipt does not carry.
      cheapest_falsifying_control: 'compute the empirical null from the r=10 stand-in arm at the SAME N as the AES arm and re-derive the tail from it instead of from NULL_PROBS.json. Zero new compute if a matched-N prp arm exists; one arm otherwise. Second cheapest: check whether the hits are spread across distinct structures or clustered - clustering breaks the Poisson independence the tail assumes.'
      control_ran: 'PARTIALLY - a prp arm exists at N=2^30, but the reported p-value is analytic and the clustering check is not in any artifact.'

    - id: 'RT-C11'
      claim: 'no usable yoyo signal at r=6 (excess 1.25); the measured death round for this statistic is between r=5 and r=6'
      source: 'receipt 904 r6; yoyo6/r6_main.json (N=2^31, hits1 = 2 against an analytic expectation of 2.0)'
      assigned_tier: 'measured'
      verdict: 'TIER UPHELD, AND THE SCOPING SENTENCE IS EXEMPLARY. One objection: a null result at r=6 needs a power statement. With an expectation of 2.0 at N=2^31, this arm could not have detected an excess factor below roughly 2-3. "No usable signal" is therefore "no signal of size >= X", and X is not stated.'
      cheapest_falsifying_control: 'a positive-control injection: run r=6 with a deliberately weakened round (e.g. identity MixColumns in one round) and confirm the instrument would have seen a signal of the size being excluded.'
      control_ran: false

