      claim: 'GATE-RR78-1 is VOID, not negative: it paired a MixColumns-less final round with an output space valid only when the final round keeps MixColumns'
      source: 'receipt 905 gate_RR78; count5/PREREGISTRATION.md 2.1'
      assigned_tier: 'analyzed'
      verdict: >-
