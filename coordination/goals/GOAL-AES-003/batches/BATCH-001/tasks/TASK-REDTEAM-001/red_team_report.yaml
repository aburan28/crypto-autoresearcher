    - id: 'RT-C14'
      claim: 'CAND-ND-1 projection-multiplicity ladder: pairs 0 / 2146959360 / 0 / 112 / 139 / 125 at r = 2,3,4,5,6,10 against a null of 128 at N=2^20; r=4 zero on 12 of 12 keys; 0 at N=2^24 against a null of 32768'
      source: 'receipt 905 ladder_CAND_ND_1; ladder/LADDER-RESULT.json, ladder/ladder.c'
      assigned_tier: 'measured'
      verdict: >-
        TIER UPHELD FOR THE NUMBERS. THREE OBJECTIONS TO WHAT IS BUILT ON THEM.
      objection_1_double_counting: >-
        THE LADDER r=4 ZERO AND THE count5 r=4 BIJECTION ARE THE SAME STATISTIC.
        Verified in source: count5.c with pimode "id" builds the shuffle index
        4*((j0-t) mod 4)+t and varies plaintext bytes {0,5,10,15}; ladder.c
        projects onto CW = the inverse-ShiftRows diagonal over a D_0-difference
        set. Same object, same projection family; the ladder is a strict
        subsample (N=2^20/2^24) of count5's exhaustive N=2^32. They are TWO
        IMPLEMENTATIONS OF ONE PROPERTY, which is a valuable implementation
        cross-check and must be credited as one, but EV-AES-005 must not list
        them as two independent findings with two independent strengths.
      objection_2_mislabelled_quantity: >-
        LADDER-RESULT.json DATA_COMPLEXITY reports
        distinguishing_advantage 2^-11.5 / 2^-46.2 / 2^-184.7 at N =
        2^18/2^19/2^20. Those numbers are e^-8, e^-32, e^-128, i.e. the
        FALSE-POSITIVE probability of the stand-in null, not an advantage. The
        advantage is 1 - 2^-46. Calling a false-positive rate an "advantage"
        inverts the reading of the headline sentence "~2^19 chosen plaintexts
        give a 2^-46 distinguisher".
      objection_3_a_recorded_prediction_failure_that_is_actually_a_success: >-
        LADDER-RESULT reports "two of four predictions are off": predicted
        saturation at r=2 but measured 0 collisions, and predicted ~2^24 excess
        at r=3 but measured ~2^31. Both are explained by the package's own
        derivations. D6 predicts saturation at r=2 "for every j nonzero", and
