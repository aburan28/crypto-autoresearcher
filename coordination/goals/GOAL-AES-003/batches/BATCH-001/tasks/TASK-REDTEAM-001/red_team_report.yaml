  # =====================================================================
  corroboration_only:
    standing_basis: '0137a051eb5828789eb267fa83c8278086578d4c'
    rule: 'the dispatching session is a different session from the producer, and in several cases a different from-scratch implementation, but the resolved model is claude-opus-5 for producer, dispatcher, validator and red team alike. Nothing in this batch has model independence.'
    claims_whose_ONLY_support_is_the_dispatching_session_re_run:
      - 'RT-C02 - the r=5 recovery on the fresh key 8b0e2b41... (attack/INDEPENDENT-VERIFICATION.json). Producer never ran this key.'
      - 'RT-C08 partial - the third r=6 mod-8 reading, the 0 (count5/DISPATCHER-r6-ADDENDUM.json). The producer contributed only the 7 and the 4.'
      - 'RT-C14 - THE ENTIRE CAND-ND-1 LADDER. ladder/LADDER-RESULT.json states measured_by "dispatching session (Bash), own from-scratch implementation". The r=3 excess, the r=5/6/10 arms, the 12-key r=4 replication, the N=2^24 arms and the whole DATA_COMPLEXITY table have NO producer-side measurement. Only the r=4 zero is corroborated from the other side, by count5.'
      - 'RT-C10 headline - receipt 904 attributes the reported r=5 yoyo implementation to "the dispatching session own from-scratch AES-NI probe". The producer has a reading of its own (a 16x excess per yoyo5/DISPATCHER-REPLICATION.json), so this one has two implementations, but one session-family and one model.'
      - 'count5/DISPATCHER-VERIFICATION.json and DISPATCHER-independent-check.c - the identity cross-check on the counting statistic.'
    consequence_for_EV_AES_005: >-
