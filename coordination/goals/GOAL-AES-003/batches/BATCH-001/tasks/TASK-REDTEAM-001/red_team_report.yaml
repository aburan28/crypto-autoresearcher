      The ladder is the one to watch: it is the package's cheapest-data claim
      and it rests on one implementation written by one session.

  # =====================================================================
  # CROSS-CUTTING OBJECTIONS
  # =====================================================================
  cross_cutting_objections:
    shared_null_object:
      finding: >-
        EVERY "random permutation" control in this batch is 10-round AES:
        attack/ctl_prp10_out.json (r=10 AES), count5 arm null_randperm_aes10
        (r=10), yoyo6.c line 76-77 (prp arm = an independent second key at 10
        rounds), ladder r10_PRP_control. That is a defensible stand-in and the
        902 receipt labels it as one, but it is a SINGLE SHARED ASSUMPTION
        across four otherwise independent statistics: any property of the AES
        round function that persisted to 10 rounds would be invisible to all
        four nulls simultaneously. The exposure is limited here because all four
        signals die at r=5-6, but the null-object control demanded by
        docs/inventor-protocol.md section 3 - a random function or random
        bijection of the same shape - has not been run anywhere in this batch.
      cheapest_remedy: 'one additional stand-in of a structurally different shape (e.g. AES-10 with a random bijective S-box, which costs one recompile and doubles as the RT-C06 component null).'
    wrong_hint_null_absent_everywhere:
      finding: >-
        Both hinted modes (attack6, attack7) derive their hint bytes inside the
        binary from the true key. No arm anywhere supplies hints from a wrong
        key. Without it, "the filter isolates the correct byte uniquely" cannot
        be separated from "the filter isolates A byte uniquely". This is the
        cheapest unrun control in the package and it was not flagged by anyone.
    machine_and_environment_unrecorded:
      finding: 'gate-rr78/environment.json exists; nothing comparable exists for the attack, count5, ladder or yoyo tasks, and no receipt names a CPU, a core count, a compiler or flags. Every wall-clock number in this batch is therefore uninterpretable outside itself.'
    preregistration_internal_inconsistency:
      finding: >-
        count5/PREREGISTRATION.md section 1 gives ID_j = {4*((j-t) mod 4)+t} and
        then enumerates "ID_0 = {0,5,10,15}, ID_1 = {4,9,14,3}". Those enumerated
        sets are D_0 and D_1, the FORWARD diagonals; the formula gives ID_0 =
        {0,13,10,7}. count5.c implements the FORMULA correctly, so no measurement
        is affected. It is nevertheless the exact geometry confusion that
        receipt 904 records as having cost this campaign a failed replication,
        sitting inside a document declared immutable and load-bearing. It must be
        corrected by a dated AMENDMENT file, never by an edit.
    receipts_diverge_from_raw_artifacts:
      finding: 'three separate places (RT-C03 attack6b, RT-C07 the null arm reported as not run, RT-C10 the omitted prp arm) where a receipt and the raw artifact it binds do not agree. Since EV-AES-005 will be minted from the receipts, each divergence propagates. This is the systemic defect of the batch.'

  # =====================================================================
  # ITEM 6. THE ONE THAT WOULD HURT MOST
  # =====================================================================
  item_6_the_one_that_would_hurt_most:
    answer: >-
      The claim that survives only because the control that would kill it was
      not run is CAND-ND-1 AS FRAMED - "a deterministic 4-round distinguisher
      FOR AES-128, cheap in data, with perfect separation from a matched PRP
      control" (ladder/LADDER-RESULT.json WHAT_THIS_IS, carried into receipt 905
      as "the r=4 zero is a sharp deterministic reading").
    why: >-
      The numbers are not in doubt: the r=4 zero is exhaustive at N=2^32 in
      count5 and replicated on 12 keys in the ladder, and no control can kill
      the measurement. What survives unearned is the words "for AES-128". The
      control that would settle it is the random-bijective-S-box component null,
      and the package states it as untested. But the package also contains, in
      newdist/candidates.yaml, its own derivation D4-D5, which establishes the
      r=4 impossibility from three ingredients only - SubBytes bytewise
      bijective, MixColumns free of zero entries, the ShiftRows geometry - and
      uses NOTHING specific to AES. If the component null is run, D4-D5 predicts
      it comes back showing the same zero for any bytewise-bijective S-box. The
      claim then survives as a true and provable statement about a wide class of
      byte-oriented SPNs, and dies as a statement about AES-128 in particular.
      That is the result that would hurt: not a retraction of a measurement, but
      the collapse of the batch's cheapest-data headline from "a distinguisher
      for AES" into "a structural identity of the round function that AES shares
      with any cipher of that shape", established by the package's own algebra
      and confirmable in one recompile.
    runner_up: >-
      RT-C04, the r=7 run. It is not a control gap but a baseline gap, and it is
      the single most severe defect in the batch: sq.c mode_attack7 takes the
      MASTER KEY as argv[2], derives K7 and the hint bytes from it, and reports
      as "recovered" four bytes it had already computed from its own input. The
      receipt says the run is not a key recovery, which is correct and to its
      credit, but it does not say that the honest baseline for the reported
      quantity is a closed-form key-schedule computation costing nothing. A
      reader who takes "recovered_K6prime_bytes matches true_K6prime_bytes,
      108.39 s" at face value has been given a dominated_by of null where the
      true entry is "free arithmetic".
    what_I_am_NOT_saying: >-
      I am not saying the r=4 property is known, standard, or previously
      published. No primary source is reachable here and DEC-20260731-019
      ruling 3 forbids the dismissal as firmly as the promotion. I am saying
      this package does not establish novelty, and that its own derivation
      narrows what the property is about.
    what_I_am_NOT_recommending: >-
      I am not recommending that the ladder lane, the mod-8 lane, or the r=6/r=7
      lane be abandoned. Every one of them has a named, cheap, decisive next
      measurement (the seven matched-null arms; the component null; the
      wrong-hint null), and premature closure is a failure mode symmetric with
      overclaiming. A count of statistics that died at r=5 is a fatigue report
      about this search, not a statement about reduced-round AES.

