  # =====================================================================
  # BASELINE COMPARISON SUMMARY
  # =====================================================================
  baseline_comparison:
    REF_A_definitional:
      basis: '2^128 single-key trials, from key length alone, charged at the package own measured 3.35e8 five-round AES-NI encryptions per second'
      REF_A_cost: '1.02e30 s = 3.2e22 years on the same machine'
      r5_attack_honest_total: '<= 30 s wall, <= 110 CPU-s, < 1 MiB, 2^33 in-process chosen plaintexts'
      ruling: 'BT-1 met at r=5. Holds by ~28 orders of magnitude after every omitted term is added back.'
      r6_ruling: 'NOT met. The hinted r=6 run at 69.39 s is dominated by ~25 s exhaustive search over the same restricted residual.'
      r7_ruling: 'NOT APPLICABLE and dominated. The reported quantity is a free function of the given input.'
    REF_B_generic_baseline_implemented_by_this_campaign:
      only_instance: 'attack/compare6_out.json - partial-sums tail 0.100 s vs naive tail 19.191 s, speedup 191.89, identical candidate sets. Present in no receipt.'
      ruling: 'a legitimate measured BT-2-shaped result about the tail algorithm, not about AES security. Should be surfaced, correctly scoped.'
    distinguisher_baseline:
      requirement: 'RQ-AES-003 requires a distinguisher to survive past the round count at which this program own measured objects die, with a measured false-positive rate against a matched random-permutation control.'
      ruling: >-
        NOT MET BY ANY OBJECT IN THIS BATCH. The integral is exact at r=4, the
        ladder is exact at r=4 and generic from r=5, the yoyo dies between r=5
        and r=6, and the mod-8 residue is at r=5 with a one-trial null. Nothing
        here goes deeper than what the campaign already had; the ladder is
        cheaper in data at the SAME depth, which the artifact itself states. The
        measured false-positive rates that do exist are against 10-round AES,
        not against a matched random permutation.
    dominated_by_audit:
      finding: >-
        No artifact in this batch contains a dominated_by field on any axis.
        Under AGENTS rule 5 and docs/inventor-protocol.md, an absent
        dominated_by is not a null; it is an unmade comparison. Time, memory and
        data/query axes must each be filled before EV-AES-005 asserts a Pareto
        position. The two entries I can already fill from the package own
        artifacts are the r=6 one (dominated by ~25 s residual search) and the
        r=7 one (dominated by free key-schedule arithmetic).

