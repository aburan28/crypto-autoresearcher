        active column, so injectivity is what D6 predicts. D7 says the r=3
        projection takes at most 256 distinct values over any subset of the
        coset, and 256 * C(2^20/256, 2) = 2146959360, which is the measured
        value EXACTLY. Both "misses" are hits. The derivation was never re-read
