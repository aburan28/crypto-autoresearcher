    - id: A3
      severity: recorded_defect
      what: A FALSE ABSENCE CLAIM BY THE RANK-1 PRODUCER
      claim: >-
        PREREGISTRATION.md line 69: "Open before this task, to my search: ...
        any r=5 arm at an amask other than 1".
      finding: >-
