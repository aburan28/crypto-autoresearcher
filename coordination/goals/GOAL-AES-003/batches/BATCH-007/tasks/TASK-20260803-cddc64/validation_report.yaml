  # ==================================================================
  # PRIORITY 1 -- PROPOSITION 1, WORKED RATHER THAN ACCEPTED
  # ==================================================================
  proposition_1_review:
    what_was_reviewed: >-
      The derivation in
      coordination/goals/GOAL-AES-003/batches/BATCH-007/tasks/TASK-20260803-d6ebce/PREREGISTRATION.md
      lines 71-146, restated in RESULTS.json deliverable_3_derivation.

    method: >-
      The algebra was reworked from the instrument source
      (BATCH-004/tasks/TASK-20260803-367b1b/src/yoyo_sbox_v2.c, sha256
      6bda2ab7f3c8e6dee358d3fcba52803e4e43f794f963bafabc51cc0de379bc9c,
      re-hashed by this task and matching) rather than from the producer's
      prose. Two instruments were written for this task and are independent of
      BOTH the frozen T-table instrument and the producer's
      analysis/verify_derivation.py -- a byte-oriented C probe (valprobe.c,
      direct inverse cipher) and a Python structural checker (deriv_check.py)
      whose state is a 4x4 nested list s[row][col] and which derives the word
      geometry from ShiftRows itself rather than from an index formula copied
      from another artifact. Both were pinned to the FIPS-197 C.1 known-answer
      vector in both directions before any structural claim was tested.

    step_rulings:

      - id: L1
        statement_as_written: >-
          "SR maps PW[j] onto column j, and its inverse maps CW[j] onto column
          j. Hence S' carries diagonal j of its input onto column j of its
          output, and a column j of a post-SR state pulls back to the
          antidiagonal CW[j] of the pre-SR state."
        verdict: OVERSTATED
        detail: >-
          The first sentence is correct in both halves. THE SECOND SENTENCE
          REVERSES THE DIRECTION. With ShiftRows out[row][c] = in[row][(c+row)
          mod 4], column j of a POST-SR state pulls back to PW[j] of the
          pre-SR state, not to CW[j]. CW[j] is where column j of the PRE-SR
          state lands after SR. NOT LOAD-BEARING - the lemma is used four
          times (Step 1 twice, Step 2 twice, Step 3 once) and every use takes
          the correct direction, so no downstream step inherits the error. It
          is a wording defect in a stated lemma, and it is the sentence a
          reader checking the argument would most likely trip on.

      - id: L2
        verdict: FOLLOWS
        detail: >-
          SB, SB^-1 and ARK act bytewise with the SAME per-position bijection
          on both members of the pair, so they carry the zero pattern of the
          difference unchanged in both directions and do not carry the value.
          Confirmed against the source: the same S-box and the same round key
          are applied to both texts.

      - id: L3
        verdict: FOLLOWS
        detail: >-
          MixColumns is column-local and invertible, and it is F_2-linear, so
          it commutes with XOR. A column of the difference is zero iff the
          corresponding image column is zero, and the value is carried
          linearly.

      - id: L4
        verdict: FOLLOWS
        detail: >-
          c0'[i] XOR c1'[i] = c1[i] XOR c0[i] = c0[i] XOR c1[i]. Positions
          outside the swap set are untouched, so the WHOLE difference state is
          invariant at the swap point, for any swap set including the empty
          and full ones. Re-verified as a full-state identity 40/40 at each of
          r = 2..7.

      - id: STEP_1_pushback
        verdict: FOLLOWS
        detail: >-
          Reworked hop by hop against the source. The last round computes
          ciphertext cell (row, c) = SBOX[w_{r-1}[row][(c+row) mod 4]] XOR k,
          so cell CW[j][row] = (row, (j-row) mod 4) is fed by cell (row, j) of
          w_{r-1}: ciphertext word j is the image of COLUMN j of w_{r-1} under
          a per-position bijection. Swapping images therefore swaps preimages
          (L2). ARK carries the column swap to z_{r-1}; MC carries a FULL
          column swap to y_{r-1} (L3); SR carries column j of y_{r-1} back to
          PW[j] of SB(w_{r-2}); L2 carries it to w_{r-2} and then to z_{r-2}.
        independent_check: >-
          Verified as an EXACT STATE IDENTITY, not as a prediction match: the
          swapped ciphertext pair was recomputed by re-encrypting forward from
          the PW-swapped z_{r-2} pair and compared byte for byte. 40/40 at
          each of r = 2,3,4,5,6,7 in deriv_check.py, over random keys, random
          and AES S-boxes, all 15 amasks and smasks 1..14. The identity holds
          at every r tested, not only r <= 4.

      - id: STEP_1_stopping_claim
        verdict: OVERSTATED
        the_claim: >-
          "It stops there: a diagonal meets all four columns, so it does not
          commute back through the next MC."
        detail: >-
          MEETING ALL FOUR COLUMNS IS NOT THE OPERATIVE CRITERION. Pulling a
          swap back through MC requires the swapped set to be a union of FULL
          columns; it fails exactly when the set meets some column in a proper
          nonempty subset. A set can meet all four columns and still contain
          full columns - the whole state does. For a single PW diagonal the
          two criteria coincide only because 4 cells meeting 4 columns forces
          exactly one cell per column, and the producer never states that
          cardinality step.
        witness_that_the_two_criteria_differ: >-
          smask = 15. The swapped set at z_{r-2} is then the union of all four
          PW diagonals, i.e. the entire state: it meets all four columns AND
          contains full columns, so by the correct criterion the pushback does
          NOT stop, and by the producer's stated reason it would. Measured
          consequence below (see smask_15_finding). The producer's
          Proposition 1 excludes smask = 15 as degenerate, so its CONCLUSION
          is unaffected for smask in 1..14 - my checker confirms 0/40 of those
          swap sets contain a full column at every r tested - but the reason
          given for the stop is not the reason that works.

      - id: STEP_2_forward_zero_pattern
        verdict: FOLLOWS
        detail: >-
          H5 is enforced by the instrument's rejection loop, which redraws
          until every active word has at least one differing byte (source
          lines: the while(!ok) loop). Delta(p) is supported on the PW
          diagonals in A, nonzero in each; ARK and SB carry the pattern; SR
          sends PW[j] to column j so Delta(y_1) has column j nonzero iff j in
          A; MC preserves column-nonzeroness both ways; SR then sends column j
          of Delta(w_1) onto CW[j] of Delta(y_2). Each link checked
          independently.

      - id: STEP_3_backward_test
        verdict: FOLLOWS
        detail: >-
          Word j preserved iff Delta(q) vanishes on PW[j] iff Delta(y_1')
          vanishes on column j (SR image of PW[j], with ARK_0 and SB^-1
          bytewise) iff Delta(z_1') vanishes on column j (L3).

      - id: STEP_4_join_r_2_3_4
        verdict: FOLLOWS
        detail: >-
          r=2: swap point is the plaintext, Delta(q) = Delta(p) exactly, so
          W = 4-|A| immediately. r=3: swap point IS z_1, Step 3 applies with
          zero S-box layers crossed. r=4: swap point is z_2; MC^-1 is linear
          so Delta(y_2') = MC^-1(Delta(z_2')) = MC^-1(Delta(z_2)) = Delta(y_2)
          as VALUES; one SB^-1 layer is then crossed, which delivers only the
          PATTERN - and the pattern is exactly what Step 3 asks for. r=1 (the
          proposition also covers it) works one layer earlier: the ciphertext-
          word swap is a swap of COLUMN j of the plaintext, and Delta(q) =
          Delta(p) again.

      - id: STEP_4_scope_across_the_S_BOX_layer
        verdict: FOLLOWS, and the producer's reason is weaker than the true one
        the_card_s_question: >-
          Is "the swap leaves the XOR fixed at the swap point" enough to carry
          the argument across the S-box layer?
        ruling: >-
          By itself, no - and the derivation does not rely on it alone, which
          is why it survives. The sharp fact is a two-tier one the producer
          states only implicitly: AT the swap point the pair at each position
          is a TRANSPOSITION of the original pair, so the difference survives
          any bytewise map; but ONE LAYER BELOW the swap point the pair is no
          longer a transposition, and from there MC^-1 carries the difference
          VALUE (linearity) while SB^-1 carries only the PATTERN. r=4 needs
          value across exactly one MC^-1 and then pattern across exactly one
          SB^-1, and that is precisely the budget available. So the argument
          crosses ONE S-box layer, and only one, and only because Step 3's
          test is a zero-pattern test. Had Step 3 required a difference value,
          r=4 would fail too.
        corollary_found_by_this_review: >-
          This also explains the producer's own verifier result at r=2 and
          r=3, which the producer does not explain: there Delta(y_2) is at or
          BELOW the swap point in the bytewise-only sense, so its invariance
          is a transposition fact, not the linear-MC^-1 fact that carries r=4.

      - id: THE_r5_BREAK
        verdict: CONFIRMED as a break of the ARGUMENT; the phenomenon's failure at r=5 is MEASURED, not derived
        detail: >-
          At r=5 the swap point is z_3. Delta(y_3') = MC^-1(Delta(z_3)) is a
          known value; crossing SB^-1 leaves only the pattern of Delta(z_2');
          the argument then needs Delta(y_2') = MC^-1(Delta(z_2')), which
          needs the value. The producer's identification of the failing step
          is CORRECT and I reproduce it independently.
        the_distinction_that_matters: >-
          A derivation that stops proves nothing about whether the phenomenon
          stops. P5 ("at r=5 the structure fails") and falsifier N5 are
          MEASUREMENT claims, not consequences of the derivation. The producer
          measured them (arm B2-r5-a2) and I re-measured them, so the claim is
          supported - but it is supported by the arm, not by the argument, and
          the snapshot receipt's "Measurement and argument fail at the same
          step" invites the stronger reading.
        verifier_method_check: >-
          The producer's delta_y2 probe reports 60/60 at r<=4 and 0/60 at r=5.
          THE "60/60 AT r<=4" IS A COMPRESSION: r=1 is not applicable (the
          probe records delta_y2_applicable = 0 there), and r=2 is vacuous
          (y_2 is the final pre-ARK state, so its difference invariance is
          equivalent to Delta(c') = Delta(c)). The load-bearing contrast is
          r=4 (60/60) against r=5 (0/60). Independently reproduced by this
          task as 40/40 at r=2,3,4 and 0/40 at r=5,6,7.

    verdict_on_proposition_1_as_stated: FOLLOWS
    verdict_detail: >-
      For the instrument's cipher, any bijective S-box, any key, any
      r in {1,2,3,4}, any nonempty active set A and any smask in 1..14:
      W = 4 - |A| on every nontrivial trial and word j is preserved iff j is
      not in A. Each step was reworked from the source rather than checked
      against its predictions, and the conclusion is a theorem given H1-H5,
      not a fit. Two stated justifications inside the argument are defective
      (L1's second sentence, Step 1's stopping reason); neither is
      load-bearing for the conclusion.

    proposition_1_is_UNDERSTATED_in_two_ways:
      - >-
        THE SWAP-MASK RANGE. Nothing in the argument uses smask != 15. L4
        holds for every swap set, including the empty and full ones, and the
        pushback of a union of PW diagonals is the union of the pushbacks. The
        proposition therefore holds for smask in 0..15 at r <= 4, not just
        1..14. Measured: r=4, amask=2, smask=15 at 2^24 gives
        W_ge1_by_word = [16777216, 0, 16777216, 16777216], whist a point mass
        at W=3 - byte-identical to smask 1, 2, 4, 7, 8 and 13.
      - >-
        THE AMASK COVERAGE. The producer measured 11 of the 15 nonempty
        amasks. This task measured all 15 at r=4, adding amask 10, 11, 13 and
        14, which no arm in this campaign had run. All four match Proposition
        1 exactly.

    smask_15_finding:
      what: >-
        AT smask = 15 THE STRUCTURE DOES NOT BREAK AT r=5. Because the swapped
        set is the whole state, c0' = c1 and c1' = c0, so q0 = p1, q1 = p0 and
        Delta(q) = Delta(p) at EVERY round count.
      measured_by_this_task:
        - "r=5, amask=2, smask=15, 2^24 trials: W_ge1_by_word = [16777216, 0, 16777216, 16777216], whist point mass at W=3, 0 trivial"
        - "r=6, amask=2, smask=15, 2^24 trials: identical"
        - "deriv_check.py smask=15 sweep: prop1 holds 40/40 at each of r = 1..8"
      consequence: >-
        P5 as written ("At r=5 the structure fails") is FALSE at smask=15, and
        falsifier N5 ("determinism surviving at r=5 ... would mean Step 4's
        break point is misidentified") would fire spuriously on an smask=15
        arm. P5 and N5 need the restriction smask in 1..14 that Proposition 1
        itself carries. This is a scope defect in the falsification criteria,
        not in the proposition.
      why_it_matters_beyond_bookkeeping: >-
        It is the concrete witness that Step 1's stated stopping reason is the
        wrong criterion. The set that meets all four columns AND contains full
        columns is exactly the one where the pushback continues.

    conventions_checked_against_a_primary_source:
      producer_caveat: >-
        The producer flagged that its verifier is independent in implementation
        but not in specification, so a misread word-geometry convention would
        make both wrong together.
      what_this_task_did: >-
        Wrote an AES from the FIPS-197 specification (state s[row][col] =
        in[row + 4c]; ShiftRows s'[row][c] = s[row][(c+row) mod 4]) and pinned
        it to the FIPS-197 C.1 vector - key 000102...0f, plaintext
        00112233445566778899aabbccddeeff, ciphertext
        69c4e0d86a7b0430d8cdb78070b4c55a - encrypt and decrypt, plus 5120
        reduced-round round-trip checks, 0 failures. THEN derived the word sets
        from that ShiftRows rather than from any campaign index formula.
      result: >-
        The derived sets are exactly the campaign's, as sets:
        PW = {0,5,10,15}, {3,4,9,14}, {2,7,8,13}, {1,6,11,12};
        CW = {0,7,10,13}, {1,4,11,14}, {2,5,8,15}, {3,6,9,12}.
        These equal the instrument's PW/CW (runs/geom.json) up to listing
        order. THE SHARED-SPECIFICATION CAVEAT IS DISCHARGED for the cipher and
        for the internal consistency of the word geometry with ShiftRows.
      residual_that_is_NOT_discharged: >-
        Calling PW[j] a "plaintext word" and CW[j] a "ciphertext word" is a
        campaign definition with no FIPS-197 counterpart; FIPS-197 has no such
        object. That cannot make Proposition 1 wrong, because Proposition 1 is
        a statement ABOUT those sets - but it does mean that any sentence of
        the form "three of four plaintext words are preserved" is using
        "word" in this campaign's sense and must not be read in the AES-column
        sense by a later reader.

  # ==================================================================
  # PRIORITY 1 -- THE THREE CONSEQUENCES, EACH OF WHICH SUBTRACTS
  # ==================================================================
  consequence_rulings:

    - id: C1_blind_to_the_swap_mask
      claim: >-
        "The r<=4 statistic is blind to the swap mask entirely - smasks 1, 2,
        4, 7 and 13 give byte-identical output, so it carries NO information
        about the yoyo swap at those rounds."
      verdict: CONFIRMED for W on nontrivial trials; OVERSTATED as "no information about the swap at all"
      confirmed_part: >-
        Independently measured at r=4, amask=2, 2^24 trials per arm with a
        different implementation, key derivation and trial stream: smask 1, 2,
        4, 7, 8, 13 and 15 all return
        W_ge1_by_word = [16777216, 0, 16777216, 16777216], whist point mass at
        W=3, trivial_swaps_excluded = 0. Byte-identical, and extended to two
        smasks the producer did not run.
      overstated_part: >-
        THE TRIVIAL-SWAP RATE IS NOT BLIND TO smask, AND THE PRODUCER'S OWN
        ARMS SHOW IT. At r=2 with amask=2, smask=1 gives
        trivial_swaps_excluded = 16777216 of 16777216 (arm S2-r2) and smask=2
        gives 0 (arm B1-r2-a2-s2). That is the sharpest possible smask
        dependence, it is a measured quantity in the same JSON, and the
        producer used it as its own quantitative test T1-T4 of Step 1. The
        accurate statement is: at r <= 4 the W statistic CONDITIONAL ON A
        NONTRIVIAL SWAP is independent of smask; the probability that a swap
        is nontrivial is not. Independently reproduced: r=1 amask=2 smask=2
        gives 65455/16777216 = 0.003902 trivial (2^-8 = 0.003906); r=3 gives
        65223/16777216 = 0.003887; r=4 gives 0.
      note: >-
        At r=4 SPECIFICALLY the full arm output is byte-identical across
        smasks, because the trivial rate there is ~2^-32 and rounds to zero in
        2^24. So the sentence is true if read as "at r=4"; it is false if read
        as "at r<=4".

    - id: C2_the_amask_15_control_is_the_same_formula
      claim: >-
        "The BATCH-006 validator's amask=15 null control is the |A|=4 case of
        this same formula: the control and the signal are ONE FORMULA AT TWO
        POINTS."
      verdict: CONFIRMED, and UNDERSTATED
      confirmed_part: >-
        Proposition 1 gives W = 4 - |A|, so |A| = 4 forces W = 0 on every
        trial. Independently reproduced at r=4, amask=15, 2^24 trials, under
        both the AES S-box and a drawn S-box (rand:424242):
        W_ge1_nontrivial = 0, whist = [16777216,0,0,0,0].
      what_it_understates: >-
        The consequence is stronger than "the control behaved as it did
        because of the formula". IT MEANS THE CAMPAIGN HAS NEVER RUN A
        NULL-OBJECT CONTROL FOR THE r<=4 STATISTIC IN THE SENSE
        docs/inventor-protocol.md SECTION 3 REQUIRES. amask=15 is another
        point of the same deterministic parametric family, not a null object
        of the same shape - not a random function, not a random bijection in
        place of the cipher, not a random instance. Substituting a drawn
        bijective S-box does not supply one either, because Proposition 1's H1
        uses only bijectivity, so a random-S-box arm is a positive control.
      but_the_section_3_concern_dissolves_here_and_this_should_be_said_plainly: >-
        Section 3 exists to catch a statistic that is an artifact of counting.
        At r <= 4 the quantity is not statistical at all: it is 1.0 by
        theorem. There is nothing for a null object to disconfirm. And the
        decay test section 3 asks for - does the quantity fall as the
        parameter meant to destroy it increases - is SATISFIED by the round
        sweep: rate 1.0 at r <= 4; 29 and 33 hits in 2^31 at r=5 (14.5x and
        16.5x the analytic null); ~1x null at r=6 and r=10 in prior batches.
        The canonical artifact tell (a quantity that will not decay) is
        ABSENT. The honest reading is that the r<=4 reading needs no control
        because it needs no belief, and the r=5 reading is where the control
        question actually lives.

    - id: C3_excess_2_30_was_never_a_magnitude
      claim: >-
        "'excess 2^30' is rate 1.0 on a certain event and was never a
        magnitude."
      verdict: CONFIRMED
      detail: >-
        Excess = observed rate / modelled null = 1.0 / (4 * 2^-32) = 2^30
        exactly. It is the arithmetic ceiling of the ratio and carries no
        information beyond "the rate is 1".
      attribution_check_run_in_both_directions: >-
        The OBSERVATION is not new to BATCH-007: EV-AES-9794e1 OBS-B6-1
        already records it as "the ARITHMETIC CEILING of the statistic ...
        must never be quoted as a magnitude". WHAT BATCH-007 ADDS IS THE
        REASON - the event is certain by Proposition 1 rather than merely
        measured at 1.0. The snapshot receipt's "The 'excess 2^30' ceiling is
        explained" is the correct attribution and does not claim the
        observation.

  # ==================================================================
  # PRIORITY 1 -- INDEPENDENT RE-MEASUREMENT (completion gate)
  # ==================================================================
  metric_recomputations:

    - id: M1
      what: The by-word structure re-measured independently at r=4
      instrument: >-
        valprobe.c, written for this task. Byte-oriented SubBytes/ShiftRows/
        MixColumns/AddRoundKey, DIRECT inverse cipher, no T-tables, own key
        derivation and own thread seeding, so it does NOT reproduce the frozen
        instrument's trial stream. FIPS-197 C.1 pinned both directions, 5120
        round-trip checks, 0 failures.
      arms: 15 amasks at r=4, smask=1, 2^24 trials each, AES S-box
      result: >-
        ALL 15 MATCH PROPOSITION 1 EXACTLY, zero violations, zero trivial
        swaps. W_ge1_by_word[j] = 16777216 for j not in A and 0 for j in A;
        whist a point mass at W = 4-|A| in every case. Includes amask 10, 11,
        13 and 14, which no prior arm in this campaign had run.
      verdict: CONFIRMED

    - id: M2
      what: The by-word structure re-measured independently at r=5
      arm: r=5, amask=2, smask=1, 2^31 trials, AES S-box, this task's instrument
      result: >-
        W_ge1_nontrivial = 29 in 2^31 (analytic null 2.0, ratio 14.5x),
        W_ge1_by_word = [4, 5, 13, 7], whist = [2147483619, 29, 0, 0, 0], 0
        trivial swaps. Producer's B2-r5-a2 on the same cell with a different
        key and stream: 33 hits, [7, 10, 7, 9], 16.5x.
      verdict: CONFIRMED that the structure is gone at r=5 - a rare event, not rate 1.0, with hits on all four words including the active one.
      a_correction_this_arm_forces: >-
        THE PRODUCER'S PHRASE "the active word taking the largest count" (and
        the snapshot receipt's repetition of it) IS NOISE AND MUST NOT BE READ
        AS RESIDUAL STRUCTURE. In this task's arm the largest count is word 2,
