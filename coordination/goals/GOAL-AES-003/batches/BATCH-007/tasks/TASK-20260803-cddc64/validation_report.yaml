    - >-
      No independent bit-exact re-execution of the 27 RC-8 arms was attempted.
      The BATCH-006 validator measured that at ~10.6 h; TASK-20260803-e55757
      is that re-execution and this report validates it from raw files rather
      than performing a third one.

  limitations:
    - >-
      SESSION AND IMPLEMENTATION INDEPENDENCE ONLY, NOT MODEL INDEPENDENCE.
      This validator, both producers and the BATCH-006 validator all resolved
      to claude-opus-5 under standing basis
      0137a051eb5828789eb267fa83c8278086578d4c, with fallback_used true and
      model_verified false. Correlated judgement is not excluded and no
      closure quorum is advanced.
    - >-
      TOY TIER. r in 1..8, one machine, 2^24 to 2^31 trials. Nothing here is a
      statement about full-round or deployed AES, and no comparison to
      published cryptanalysis is made in either direction.
    - >-
      Proposition 1 is a statement about a yoyo statistic under one cipher
      convention with one campaign-specific definition of "word". It says
      nothing about the security of anything, and it SUBTRACTS from prior
      campaign readings rather than adding to them.
    - >-
      My re-measurements use my own key derivation and trial stream, so they
      confirm the STRUCTURE and cannot confirm the producer's exact counts.
      Exact-count confirmation was done separately by re-running five recorded
      commands against the frozen binary (M6).
    - >-
      The defects at A1, A2 and A3 are recorded, not repaired. This report
      edits nothing.
    - >-
      Timestamp corroboration at A2 rests partly on filesystem mtimes, which
      are mutable and are weaker evidence than the budget stamp they agree
      with.
    - >-
      No memory measurement was taken by anyone; the 8 GB budget is unverified
      in both directions.

  verdict: passed
  verdict_basis: >-
    THE PACKAGE IS ADMISSIBLE EVIDENCE. The snapshot is committed and 199 of
    200 declared digests match (the 200th is the receipt's own path, which is
    unsatisfiable). Every reported number recomputes from raw: 25 arm rows
    against their run files with zero mismatches, 27 RC-8 draws against
    BATCH-006's raw files with zero mismatches across eight fields, 27 S-box
    tables byte-identical, both liveness conjuncts and all 27 Poisson tails,
    and the Clopper-Pearson bound to within 2 ULP. Five recorded commands
    reproduce bit-for-bit, closing the producer's own declared gap. And
    Proposition 1 FOLLOWS: I reworked every step from the instrument source
    rather than checking its predictions, with a cipher and a word geometry
    derived independently from FIPS-197, and the conclusion is a theorem given
    its stated hypotheses.
    IT IS PASSED WITH DEFECTS RECORDED, NOT PASSED CLEAN. Two justifications
    inside the argument are wrong as written (L1's direction, Step 1's
    stopping criterion) without being load-bearing; the falsification criteria
    P5/N5 are stated for a wider smask range than they hold on; one command
    log line is not the command that ran; one addendum timestamp would, if
    believed, void a pre-registration that the budget stamp and mtime both
    rescue; and one absence claim is false in the producer's own named
    directories. None of these changes a measurement, and none is a
    fabrication. The verdict would be failed if the derivation did not follow,
    if a measurement did not recompute, or if a defect had been concealed -
    none of which is the case.
    THIS VERDICT ASSIGNS NO OFFICIAL STATE, NO EVIDENCE STRENGTH, AND
    RECOMMENDS NO PROMOTION.

