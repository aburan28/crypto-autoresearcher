      - id: U2
        finding: >-
          At smask=15 the conclusion holds at EVERY round count tested (1..8),
          because the pushback does not stop. This is a strictly larger true
          statement than the one claimed, and it is the diagnostic that
          locates the defect in Step 1's stated reason.
      - id: U3
        finding: >-
          The producer reports its declared completion gate as unmet. Against
          the four items its card actually declares, it is MET (see G1).
      - id: U4
        finding: >-
          Seven prior r=5, amask=15 arms exist that the producer believed were
          not on disk; they corroborate its r=5 conclusion at no cost (A3).
      - id: U5
        finding: >-
          Consequence C2 is stronger than the producer states: it implies the
          campaign has never run a section-3 null object for the r<=4
          statistic. This report also argues the concern dissolves, because a
          quantity that is 1.0 by theorem is not a statistic - but the two
          halves should be recorded together and only the first half is in the
          package.
      - id: U6
        finding: >-
          The producer's derivation actually establishes r=1 as well as
          r=2,3,4, and the pushback identity holds at every round count. Only
          the join fails at r>=5. The package presents the r=1 case as
          "expected to be uninteresting"; it is a clean case of the same
          argument one layer shorter.

