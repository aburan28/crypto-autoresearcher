        checked that every value quoted in RESULTS.json PER_DRAW came from
        those raw files.
      result: >-
        27 of 27 in EXACT AGREEMENT across all eight fields. ZERO
        disagreements. ZERO discrepancies between RESULTS.json and raw.
      verdict: CONFIRMED

    - id: R2
      what: The two NOT_ALIVE draws fail specifically on the Poisson conjunct
      result: >-
        v = nontrivial_trials * 4 / 2^32 = 1.0 for every draw.
        B11-RAND-20260803711: X = 6, ratio 6.00 (conjunct 1 PASSES),
        P(K >= 6 | 1) = 5.941848e-04 (conjunct 2 FAILS at 1e-6).
        B25-RAND-20260803725: X = 9, ratio 9.00 (conjunct 1 PASSES),
        P(K >= 9 | 1) = 1.125203e-06 (conjunct 2 FAILS, by 12.5%).
        Both classifications recompute; all 27 tails agree with the producer's
        to better than 1.6e-16.
      verdict: CONFIRMED. Both fail only on the conjunct the corrupted BATCH-005 restatement drops, exactly as reported.

    - id: R3
      what: Bound arithmetic recomputed independently
      how: One-sided 95% Clopper-Pearson lower bound on 25/27 by bisection on the binomial upper tail, written for this task.
      result: >-
        This task: 0.784700038857546. BATCH-006: 0.784700038857546 (bit-
        identical). BATCH-007: 0.7847000388575458, which is 2 ULP (2.220446e-16)
        below - and the producer's RESULTS.json FINDING block states that
        difference explicitly rather than eliding it.
      verdict: CONFIRMED
      note_on_the_receipt_wording: >-
        The snapshot receipt's "agreement to double precision" is a
        compression: the two doubles are NOT equal, they are 2 ULP apart. The
        underlying artifact is precise about this and the discrepancy is a
        bisection-tolerance artifact with no scientific content. Recorded only
        because this campaign's recurring failure is prose that outruns the
        artifact it summarises.

    - id: R4
      what: The 27 S-box tables are byte-identical to BATCH-006's
      result: >-
        All 27 full 256-byte tables in
        BATCH-007/.../runs/pin_rand_<seed>.json were compared entry by entry
        against BATCH-006/.../sboxes/sbox_rand_<seed>.json. 27 of 27 identical,
        0 mismatches. A disagreement in counts could therefore not have been
        blamed on drawing a different object.
      verdict: CONFIRMED
      stray_noted: >-
        BATCH-007/tasks/TASK-20260803-e55757/sboxes/ is an EMPTY directory (0
        files) while the INSTRUMENT prose speaks of verifying "BATCH-006's
        archived table". The tables that make the claim checkable live in
        runs/pin_rand_*.json, so nothing is missing; the empty directory is a
        stray that a reader looking for the evidence would waste time in.

    - id: R5
      what: Implementation independence of rc8probe.c
      result: >-
        Verified in source: GF(2^8) log/antilog tables over generator 0x03
        (GLOG/GEXP) rather than an O(256^2) inverse search; DIRECT inverse
        cipher (add_rk, inv_mix_columns, inv_shift_rows, inv_sub_bytes in
        reversed order with forward round keys) rather than the equivalent-
        inverse form with U-tables; explicit RotWord/SubWord/Rcon word-oriented
        key expansion; no T-tables. Source sha256
        0109d7b6ac0e8e62092cbb64f2c454bfd0c5f1ffdba17f410de6b9a124df52b0 and
        binary sha256 f344b0997793b13c28e8b9e7712dc5b80519ecd0d7135f98557edf4bcf141179
        re-hashed by this task and matching the recorded values.
      verdict: CONFIRMED

    - id: R6
      what: The producer's framing of what the replication buys
      claim: >-
        "IMPLEMENTATION AND SESSION INDEPENDENCE, NOT MODEL INDEPENDENCE ...
        THE SAMPLE WAS NOT REDRAWN, so the 27 draws bound the preserving
        fraction exactly as much as before; what changed is that the instrument
        reading them is no longer single."
      verdict: CONFIRMED - the framing is right, and it is the correct framing
      detail: >-
        The replication is bit-exact on the SAME 27 objects with the same arm
        seed, so it can only detect an instrument fault, never sampling error;
        the confidence interval is a property of n = 27 and is untouched. The
        producer says so, declines to compute a second or pooled reading, and
        records why. Both tasks resolved to claude-opus-5 under the standing
        basis, so no distinct resolved model is contributed and nothing here
        moves a closure quorum. THE ONE THING IT DOES SETTLE - that 0.7847 is
        not an artifact of one implementation - is exactly what
        EV-AES-9794e1 unresolved_confounds[0] asked for.

