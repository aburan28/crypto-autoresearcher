    into a frozen EXP-* contract is a separate /design-experiment step for a
    later batch, per the standard lifecycle in CLAUDE.md.
  non_duplication: >-
    See GOAL-ARGON-001.yaml's own non_duplication field (GOAL-BLAKE-001,
