plan_self_limitation: >-
  This plan was written without any arithmetic capability and without access to
  the SafeCurves criterion definitions. Its strongest honest property is that
  every lane measures a quantity whose certificate can be checked by a third
  party in milliseconds, and that no lane's output depends on a threshold this
  program has not read. Its weakest points are named rather than hidden: three
  lanes are blocked on retrieval, the six-twist structure is recalled and rests
  on a toy-scale control, the parameter-matched negative control is size-matched
