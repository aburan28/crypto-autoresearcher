  title: The Eisenstein CM decomposition as the tracked object for the
    invalid-curve surface of a j = 0 curve
  class: measurement
  claim: >-
    For a curve with j = 0 over F_p with p = 1 mod 3, the complete
    invalid-curve/twist surface {y^2 = x^3 + c : c in F_p*} - six distinct group
    orders - is computable from a single decomposition 4p = L^2 + 27M^2 plus six
    subtractions, with a certificate per class consisting of one representative
    point annihilated by its predicted order, and with a free global consistency
    check that the six traces sum to zero. No point counting is required, and
    the cost is independent of the size of p beyond the cost of the
    decomposition itself.
  mechanism: see object_first.OBJ-2 and diagnostic D2 above.
  novelty_status: unverified
  novelty_screen:
