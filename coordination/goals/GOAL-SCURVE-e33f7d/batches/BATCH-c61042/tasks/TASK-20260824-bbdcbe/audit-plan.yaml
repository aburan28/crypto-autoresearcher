      polynomial in log p, dominated by a square-root mod p) plus O(1)
      subtractions, versus O(log^{4+o(1)} p) per curve for SEA point counting
      repeated six times - and SEA is unavailable in this environment at all,
      which is the operative difference.
    memory_exponent: O(log p)
    best_known: SEA point counting per twist; or, for the ECDLP itself, rho at
