  safety_conclusion: none
  vulnerability_conclusion: none
  statement: >-
    A PLAN. Nothing in this file was executed. Every "prediction" is
    preregistered before measurement, exists so that it can fail, and is not a
    result. No curve attack is planned, proposed, or run. No lane concludes that
    this curve is safe, unsafe, vulnerable, or free of vulnerabilities; lanes
    produce certified quantities and the mapping of a quantity to a SafeCurves
    cell is quarantined behind obligation OBL-5 of the capsule.

mandatory_framing:
  positive_control_not_discovery: >-
    BN CURVES HAVE EMBEDDING DEGREE 12 AND j-INVARIANT 0 (CM BY AN ORDER IN
    Q(sqrt(-3))) BY CONSTRUCTION. That is the published design intent of a
    pairing-friendly curve, retrieved in this session from
    draft-irtf-cfrg-pairing-friendly-curves-11 ("The embedding degree k is 12")
    and from ePrint 2005/133's abstract ("elliptic curves of prime order and
    embedding degree k = 12"). Lanes L-TRANSFER and L-DISC therefore exist as
    POSITIVE CONTROLS THAT VALIDATE THE AUDIT INSTRUMENT AGAINST A KNOWN,
    INTENDED, PUBLISHED PROPERTY. Reproducing k = 12 or |D| = 3 here is not a
    discovery, not a newly found flaw, and not an attack.
  different_objectives: >-
    SafeCurves' `transfer` and `disc` criteria and a pairing-friendly curve's
    design goals are DIFFERENT OBJECTIVES optimised for different uses. A curve
    designed to admit an efficient pairing must have small embedding degree; a
    curve designed to satisfy SafeCurves must not. Failing a SafeCurves cell is
    NOT an ECDLP break, and failing `rigid`, `ladder`, `twist`, `complete` or
    `ind` is not by itself an ECDLP break either.
  what_would_be_a_finding: >-
    Not k = 12. A finding would be a DISAGREEMENT: the retrieved tuple failing
    to satisfy the BN parameterization, or a certified quantity contradicting a
    published design claim, or an instrument that returns k = 12 for objects
    that are not BN curves.

# ===========================================================================
# OBJECT-FIRST FRAMING (docs/inventor-protocol.md sections 1-2)
# ===========================================================================
object_first:
  target: parameter-level structure of BN(2,254), not the ECDLP instance
  established_families_named_and_their_role_here:
  - family: MOV / Frey-Ruck multiplicative transfer to GF(p^k)
    status_in_corpus: heavily mined; KN-TECH-032 policy record; internal audit
      lane IDEA-20260807-98a970
    role_here: REUSED AS A CONTROL, not proposed as a new lens. This plan
      specializes IDEA-20260807-98a970 rather than minting a duplicate.
  - family: additive/anomalous transfer (n = p)
    status_in_corpus: KN-TECH-033
    role_here: reused as one of three degenerate flags
  - family: automorphism-discounted rho on CM curves
    status_in_corpus: KN-TECH-018
    role_here: reused, quantified as a constant factor, explicitly NOT an
      exponent change
  - family: exTNFS on GF(p^12)
    status_in_corpus: external (Kim-Barbulescu), surfaced by SRC-R1 (R1-f)
    role_here: cited only to bound what the `transfer` cell means; it concerns
      the embedding field's DLP, not the ECDLP
  off_limits_as_a_primary_lens_for_this_session: all four above, as primary
    lenses. They are instruments here, not hypotheses.
  taxonomy_disclaimer: >-
    This program has no written object-enumeration for the ECDLP; that is
    KN-OPEN-019. The family-to-object mapping used above is a SKETCH, not a
    taxonomy, and no closure claim rests on it.
  candidate_objects_enumerated:
  - id: OBJ-1
    object: the multiplicative order ord_n(p) of the field characteristic in the
      subgroup-order residue ring
    new_or_repackaging: repackaging (IDEA-20260807-98a970 already tracks it);
      reused deliberately
    testable_one_step_propagation: yes - constant under F_p-isogeny, maps to
      k/gcd(k,m) under base change to F_{p^m}
    survival: survives every model change and coordinate change; dissolves when
      the base field or subgroup changes
    score: 1/3 new, 3/3 testable, 3/3 survival
  - id: OBJ-2
    object: >-
      THE EISENSTEIN CM DECOMPOSITION OF p - the pair of integers (L, M) with
      4p = L^2 + 27M^2, equivalently the Eisenstein prime pi in Z[zeta_3] with
      pi * conj(pi) = p, carried together with the unit orbit {u * pi : u in
      mu_6}.
    new_or_repackaging: >-
      KNOWN as classical CM theory (Gauss/Eisenstein; the sextic-residue
      character of 2 mod p). REPACKAGING at the level of mathematics. Within
      THIS PROGRAM it is not recorded for any curve, and it is the object that
      makes several otherwise-expensive diagnostics free, which is why it is
      carried.
    testable_one_step_propagation: >-
      YES, and this is the point. The one-step operation is SEXTIC TWISTING
      b -> c*b for c in F_p*/(F_p*)^6. On the object, that operation is
      multiplication of pi by a sixth root of unity, which permutes the six
      traces t_i and therefore the six curve orders p + 1 - t_i. So the entire
      family of six curves y^2 = x^3 + c*b is computed from ONE pair of
      integers, with no point counting.
    survival: survives all six twists, all F_p-isomorphisms, all coordinate
      systems; dissolves the moment the curve leaves the j = 0 locus (any a != 0
      curve), which is precisely the boundary this audit must respect.
    score: 1/3 new (classical), 3/3 testable, 2/3 survival (j = 0 only)
  - id: OBJ-3
    object: the CM conductor f in t^2 - 4p = D * f^2, tracked SEPARATELY from the
      fundamental discriminant D
    new_or_repackaging: adaptation - the program's records conflate "small
      discriminant" with "small endomorphism-ring index"; for BN these differ by
      about p^{1/2} (capsule ALG-4 conductor_note)
    testable_one_step_propagation: yes - f is fixed by the curve's endomorphism
      ring and is invariant under twisting (the twists share the same order up
      to the trace permutation, and D f^2 is fixed)
    survival: survives twisting and isomorphism; changes under isogeny of degree
      dividing/multiplying the conductor - which is exactly the horizontal /
      vertical isogeny distinction
    score: 2/3 new-within-program, 3/3 testable, 2/3 survival
  selected_object: OBJ-2 (with OBJ-3 as its second coordinate), because it is
    the only candidate that converts a diagnostic the goal explicitly asks for
    (invalid-curve / twist-family confinement costs) from "point counting on
    many curves", which is out of reach without SEA in this environment, into
    "one integer decomposition plus six subtractions".
  lossy_projection_test:
    what_is_discarded: the coefficient b, the base point, the curve model and
      coordinate system, and every field element of the curve; a 254-bit curve
      with a generator collapses to two integers of about 127 bits.
    is_the_loss_compatible_with_the_operations: >-
      YES for the operations this audit performs. Sextic twisting acts on the
      retained pair as multiplication by a unit, so the retained part still
      propagates DETERMINISTICALLY without consulting what was discarded.
      Quadratic twisting is the unit -1 and negates the trace. Isomorphism over
      F_p acts trivially. What is discarded (which of the six twists a given b
      names) is exactly what the audit must re-supply by ONE sextic-residue test
      of b - and that residue test is itself a certificate, not an assumption.
    verdict: >-
      PASSES. It is a genuinely lossy projection and not a change of
      coordinates: nothing about b or the generator is recoverable from (L, M).
      The projection is NOT information-preserving, and the audit must therefore
      state, at every use, which of the six twists a claim refers to.
    cost_of_the_test: zero compute; it is algebraic and was done here, in the
      proposal, as required.

# ===========================================================================
# SHARED CONTROL DEFINITIONS - RUN BEFORE ANY BELIEF IN ANY LANE
# ===========================================================================
control_policy:
  ordering_rule: >-
    THE CONTROL BLOCK IS A HARD GATE. Every control listed as `blocking: true`
    runs, and passes, BEFORE any measurement on BN(2,254) is interpreted. A
    pipeline that has never been shown to fire cannot certify anything, and a
    pipeline that fires on a null object certifies nothing.
  failure_semantics: A failed control voids the lane's output as evidence and is
    reported as instrument failure, never as a fact about the curve.

controls:
  positive:
  - id: C-POS-1
    blocking: true
    object: toy supersingular curve over a small prime with trace 0, so p^2 = 1
      mod n and k = 2 exactly, with #E verified by exhaustive point counting
    used_by: [L-TRANSFER, D4]
    must_return: k = 2 exactly, via the identical code path used for the target
  - id: C-POS-2
    blocking: true
    object: toy curve with p = 1 mod n, i.e. k = 1 (the only case admitting a
      one-point self-pairing, per IDEA-20260807-30868b)
    used_by: [L-TRANSFER, D4]
    must_return: k = 1 and the p = 1 mod n degenerate flag set
  - id: C-POS-3
    blocking: true
    object: >-
      TOY BN CURVE. Take the smallest u for which p(u) = 36u^4+36u^3+24u^2+6u+1
      and r(u) = 36u^4+36u^3+18u^2+6u+1 are both prime and p(u) < 10^7, so that
      #E can be obtained by EXHAUSTIVE point counting rather than by trusting
      the parameterization.
    used_by: [L-TRANSFER, L-DISC, L-LADDER, L-COMPLETE, L-TWIST, D1, D2, D5]
    must_return: exhaustive count equals r(u); k = 12 exactly; t^2 - 4p =
      -3 f^2 with f = |6u^2+4u+1|; quadratic-twist order divisible by 3
    why_it_matters: >-
      This is the control that makes every algebraic identity of the capsule
      (ALG-1..ALG-5) an INSTRUMENT-VERIFIED identity at a scale where brute
      force is possible, before it is applied at 254 bits where it cannot be.
  - id: C-POS-4
    blocking: true
    object: toy j = 0 curve over a small prime p = 1 mod 3, with all six sextic
      twist orders obtained by exhaustive counting
    used_by: [D2, D5]
    must_return: the six exhaustively counted orders equal the six predicted
      p + 1 - t_i derived from 4p = L^2 + 27M^2
    why_it_matters: this is the ONLY validation of recalled item REC-3 that does
      not assume REC-3
  - id: C-POS-5
    blocking: false
    object: an incomplete Jacobian-coordinate addition formula fed its known
      exceptional inputs (P = Q, P = -Q, P = O)
    used_by: [D7]
    must_return: a detected exception on every one of them
  negative_parameter_matched:
  - id: C-NEG-1
    blocking: true
    object: >-
      A SOURCED PRIME-FIELD CURVE OF COMPARABLE SIZE WITH A PUBLISHED GROUP
      ORDER AND LARGE CM DISCRIMINANT AND LARGE EMBEDDING DEGREE - NIST P-256
      (FIPS 186-5 / SP 800-186) as first choice, Curve25519 (RFC 7748) as
      second.
    used_by: [L-TRANSFER, L-DISC, L-RHO, D3, D4, D5]
    must_return: no small k (certified bound k > 10^6 by the K-multiplication
      pass), no degenerate flag, |D| large
    matching_assumptions_stated_explicitly:
    - prime field, same class; 256 or 255 bits versus 254 - NOT an exact size
      match, and the 1-2 bit difference is disclosed rather than smoothed over
    - short Weierstrass with a != 0 (P-256) versus a = 0 (BN) - the models
      differ, and for Curve25519 the model differs more (Montgomery)
    - cofactor 1 (P-256) versus cofactor 8 (Curve25519) - if Curve25519 is used,
      the PRIME subgroup order must be used, never the group order
    - the parameters must be fetched in that lane, not recalled; sibling goals
      GOAL-SCURVE-be9707 (P-256) and GOAL-SCURVE-51437e (Curve25519) exist and
      any transcription there is cross-referenced, not copied as evidence
  - id: C-NEG-2
    blocking: false
    status: DECLARED INFEASIBLE IN THIS ENVIRONMENT, AND SAID SO RATHER THAN
      QUIETLY DROPPED
    object: the ideal negative - a curve over the SAME p = 1679...4723 with
      a != 0 (hence j != 0, large CM discriminant) and known order
    obstruction: obtaining its order requires SEA point counting, which is out of
      reach in a pure-Python environment without Sage (IDEA-20260807-98a970
      environment assumption)
    consequence: the negative control is size-matched but NOT field-matched;
      every lane using C-NEG-1 must state that the negative differs in field as
      well as in structure, so a difference in outcome does not isolate the
      structure alone
    successor_condition: if a SEA implementation or a Sage-capable environment
      becomes available, C-NEG-2 supersedes C-NEG-1 as the primary negative
  null_same_shape:
  - id: C-NULL-1
    blocking: true
    object: arithmetic null - a random 254-bit prime p~ and an INDEPENDENT random
      254-bit prime n~, fed to the identical k pipeline
    used_by: [L-TRANSFER, D4]
    must_return: no small k; the K-multiplication pass certifies k > 10^6
    interpretation: if this returns a small k, the pipeline is measuring
      something other than the (p, n) relation
  - id: C-NULL-2
    blocking: true
    object: >-
      THE SHARPEST NULL. Keep the REAL p and replace n by a random prime of the
      same bit length. All the "size" structure is retained; only the BN
      relation between p and n is destroyed.
    used_by: [L-TRANSFER, L-DISC, D4, D5]
    must_return: k != 12; t~^2 - 4p not of the form -3 * square
    interpretation: this isolates the claim "k = 12 comes from the BN relation"
      from the far weaker claim "k = 12 comes from p being a 254-bit prime"
  - id: C-NULL-3
    blocking: true
    object: NULL OBJECT - a pair of random integers that is not a curve at all
      (p~ composite, n~ not dividing any curve order), plus a "curve" whose
      discriminant is 0
    used_by: [all lanes]
    must_return: an explicit refusal / "no structure" report
    interpretation: A PIPELINE THAT EMITS A VERDICT FOR A NULL OBJECT EMITS
      VERDICTS, NOT MEASUREMENTS, AND ALL ITS OUTPUT IS VOID.
  decay_parameter:
    parameter: K, the bound in the lower-bound embedding-degree pass
    sweep: K in {10^2, 10^3, 10^4, 10^5, 10^6}
    expected_behaviour: the set of objects not yet excluded shrinks monotonically
      to exactly the planted small-k positives and then stops changing
    failure_signature: an object that appears at some K and disappears at a
      larger K indicates a modular-arithmetic bug and voids the pass

# ===========================================================================
# THE ELEVEN SAFECURVES LANES, IN THE DECLARED CRITERION ORDER
# ===========================================================================
lanes:

- id: L-FIELD
  criterion: field
  category: basic_parameter_requirements
  intake_comparison_target: 'true (NOT evidence)'
  mechanism: >-
    The criterion concerns the field. Two threshold-free measurements carry it:
    (F1) is p prime, and what is ceil(log2 p); (F2) DOES p SATISFY THE BN
    PARAMETERIZATION, i.e. does p(z) = 36z^4+36z^3+24z^2+6z+1 evaluate to the
    intake modulus at z = -(2^62+2^55+1) as given by SRC-R4?
  quantitative_prediction:
  - metric: ceil(log2 p)
    direction: exact value
    predicted: 254
    falsifier: any other value contradicts the label "BN(2,254)" and escalates
      to a capsule conflict
  - metric: primality of p
    direction: exact
    predicted: prime
  - metric: p(z) - p_intake
    direction: exact
    predicted: 0
    falsifier: any nonzero difference means the intake modulus is NOT the curve
      that SRC-R4's z generates, which invalidates every structural prediction
      in every other lane of this plan
  certificate_or_bound:
    primary: >-
      PRATT CERTIFICATE for p, attempted via the ALGEBRAIC partial factorization
      p - 1 = 6u(6u^3 + 6u^2 + 4u + 1) (capsule ALG-2, subject to OBL-6). The
      remaining cubic cofactor is about 192 bits; the certificate is completed
      only if it factors.
    fallback_bound: >-
      If the cofactor resists, record BPSW plus 64 independent Miller-Rabin
      rounds with the bases logged. THIS IS A PROBABLE-PRIME STATEMENT AND MUST
      BE LABELLED AS SUCH; it is not a certificate and no downstream record may
      call it one.
    f2_certificate: the evaluated p(z) and the intake modulus side by side, plus
      their difference, which a third party re-checks in microseconds
  controls: [C-NULL-3, C-POS-3 (its p is prime and its p(u) evaluation is
      exhaustively checkable)]
  budget:
    f2_evaluation: < 1 s
    primality_probable_prime: < 60 s
    cofactor_factorization_attempt: ECM, B1 ramp 10^4 -> 10^7, cap 3600 s and 4 GB
  stopping_rule: stop the ECM attempt at 3600 s or when the cofactor splits,
    whichever first; record the largest factor found and the digit count of the
    unfactored remainder. A stop is an operational observation, not a result.
  falsifier: p composite (exhibit a factor); or ceil(log2 p) != 254; or
    p(z) != p_intake.
  honest_limitation: >-
    The SafeCurves `field` criterion's exact content is unretrieved (capsule
    SRC-U1). This lane produces facts about p, not a `field` cell verdict.

- id: L-EQUATION
  criterion: equation
  category: basic_parameter_requirements
  intake_comparison_target: 'true (NOT evidence)'
  mechanism: nonsingularity and model identification. For a = 0, b = 2 the
    quantity 4a^3 + 27b^2 = 108 and the discriminant is -16 * 108 = -1728;
    nonsingularity over F_p is equivalent to p not dividing 1728, i.e. p not in
    {2, 3}. Separately, SRC-R1 (R1-c) requires b to be a PRIMITIVE ELEMENT of
    GF(p)*, which is a checkable and currently unchecked claim.
  quantitative_prediction:
  - metric: 4a^3 + 27b^2 mod p
    direction: exact
    predicted: 108 (nonzero)
  - metric: j-invariant
    direction: exact
    predicted: 0
  - metric: multiplicative order of 2 mod p
    direction: exact
    predicted: p - 1 (i.e. 2 is a primitive root), FOLLOWING R1-c
    falsifier: if ord_p(2) != p - 1 then the intake curve does not satisfy the
      family requirement R1-c quotes, which is a sourced-versus-artifact
      disagreement worth recording (and is NOT a security statement)
  certificate_or_bound:
    nonsingularity: exhibit 108 mod p != 0 - one reduction
    primitivity: requires the factorization of p - 1 from L-FIELD; if incomplete,
      report the certified partial statement "ord_p(2) is divisible by X" with
      the witnesses, plus an explicit "unresolved" for the rest. No assertion of
      primitivity without the full factorization.
  controls: [C-POS-3, C-NULL-3, 'a deliberately singular curve (4a^3+27b^2 = 0
      mod p) that the pipeline must reject']
  budget: < 60 s given L-FIELD's factorization output; no independent cost
  stopping_rule: inherits L-FIELD's ECM stop
  falsifier: singular curve; or j != 0; or a certified ord_p(2) < p - 1.
  honest_limitation: the `equation` criterion's exact content is unretrieved.

- id: L-BASE
  criterion: base
  category: basic_parameter_requirements
  intake_comparison_target: 'true (NOT evidence)'
  status: BLOCKED ON RETRIEVAL - capsule obligation OBL-3. The intake supplies no
    base point and none was retrieved.
  mechanism: once a generator G is sourced, verify (i) G satisfies the curve
    equation, (ii) [n]G = O, (iii) G != O; with n prime, (ii) and (iii) give
    ord(G) = n exactly.
  quantitative_prediction:
  - metric: y_G^2 - (x_G^3 + 2) mod p
    direction: exact
    predicted: 0
  - metric: '[n]G'
    direction: exact
    predicted: the point at infinity
  certificate_or_bound: the two residues above plus n's primality certificate
    from L-FIELD/D1; re-verifiable by a third party in milliseconds
  controls: [C-POS-3 (toy BN generator), 'a deliberately off-curve point that
      must be rejected', C-NULL-3]
  budget: < 1 s once G is retrieved
  stopping_rule: if no primary source for G is obtained within the successor
    retrieval lane's budget, record the lane as UNRESOLVED with the reason. An
    unretrieved generator is a missing datum, not a negative finding.
  falsifier: G off the curve; or [n]G != O; or ord(G) != n.
  honest_limitation: a generator taken from an implementation rather than a
    specification supports a transcription claim only.

- id: L-RHO
  criterion: rho
  category: ecdlp_security_requirements
  intake_comparison_target: 'true (NOT evidence)'
  status: depends on OBL-3 (group order)
  mechanism: the generic-attack cost. Compute n = #E(F_p) and report
    log2(0.886 * sqrt(n)) (KN-TECH-001, KN-TECH-006), then report SEPARATELY the
    automorphism-adjusted figure of diagnostic D3.
  quantitative_prediction:
  - metric: log2(0.886 * sqrt(n)), n the prime subgroup order
    direction: exact value, predicted to fall in the interval [126, 127]
    reasoning: n is predicted to be a 254-bit prime, so 0.5 * log2(n) is about
      127 and the 0.886 factor subtracts about 0.17
    note: THE INTERVAL IS THE PREDICTION; THE EXACT VALUE IS THE MEASUREMENT.
      No exact figure is asserted here because this session had no arithmetic.
  - metric: log2(0.886 * sqrt(n) / sqrt(6)), the automorphism-adjusted figure
    direction: exact value, predicted to fall in [125, 126]
    reasoning: a j = 0 curve has automorphism group of order 6, giving a
      sqrt(6) = 2.449 speedup, i.e. about 1.29 bits (KN-TECH-018)
  certificate_or_bound: >-
    ORDER CERTIFICATE, not an assertion. Exhibit the candidate N = r(z) from the
    BN parameterization, verify N lies in the Hasse interval
    [p + 1 - 2 sqrt(p), p + 1 + 2 sqrt(p)], verify [N]P = O for several
    independent random points P, and verify N is prime. A prime N in the Hasse
    interval that annihilates a point of order N is the unique group order, so
    this is a genuine certificate and not a trusted parameterization.
  controls: [C-POS-3 (order exhaustively counted at toy scale), C-NEG-1, C-NULL-3]
  budget: < 10 s for the order certificate; primality of n as in L-FIELD
  stopping_rule: as L-FIELD
  falsifier: N outside the Hasse interval; or [N]P != O for any P; or N composite.
  honest_limitation: >-
    A rho cost is a cost against ONE attack family in ONE model. It is not a
    safety statement and says nothing about the other ten lanes. SRC-R1's
    "no more than 100-bit security" figure for "BN254" concerns the DLP in the
    embedding field GF(p^12), NOT this rho figure, and the two must never be
    reported in the same column without that distinction.

- id: L-TRANSFER
  criterion: transfer
  category: ecdlp_security_requirements
  intake_comparison_target: 'false (NOT evidence)'
  reuses: IDEA-20260807-98a970 (certified embedding-degree audit), specialized -
    NOT duplicated. This lane inherits that record's certificate formats, its
    three degenerate checks, and its planted-positive control policy.
  specialization_that_avoids_the_expensive_step: >-
    IDEA-20260807-98a970's bottleneck is factoring n - 1 to get exact k. HERE IT
    IS UNNECESSARY: the family is documented (R1-b) to have k = 12, so it
    suffices to certify k | 12 and k not in {1,2,3,4,6} by checking the maximal
    proper divisors. That is THREE modular exponentiations instead of a 254-bit
    factorization.
  mechanism: k = ord_n(p). Certify k = 12 by p^12 = 1 mod n together with
    p^6 != 1 mod n and p^4 != 1 mod n (6 and 4 are the maximal proper divisors
    of 12, so these two exclude every proper divisor). Plus the three degenerate
    checks - p mod n (flag if 1), n vs p (anomalous, flag if equal), and whether
    n divides the cofactor (flag if n^2 | #E).
  quantitative_prediction:
  - metric: k = ord_n(p)
    direction: exact
    predicted: 12
    status_of_the_prediction: THIS IS THE POSITIVE CONTROL. It is predicted
      because it is the published design (R1-b, R2-a), and confirming it
      validates the instrument.
  - metric: number of degenerate flags raised
    direction: exact
    predicted: 0 (n != p since #E is prime and equals n only if the curve were
      anomalous; p mod n != 1; cofactor 1 so n^2 does not divide #E)
  - metric: k for C-NULL-2 (real p, random n)
    direction: higher
    predicted: > 10^6, certified by the K-multiplication pass
  certificate_or_bound:
    exact_k: the three residues p^12, p^6, p^4 mod n; verification cost three
      modular exponentiations, milliseconds
    lower_bound_for_controls: k > K certified by K modular multiplications with
      no shortcut - HONESTLY NOT SUCCINCT, costing K to verify as well as to
      produce, exactly as IDEA-20260807-98a970 requires it to be stated
  controls: [C-POS-1, C-POS-2, C-POS-3, C-NEG-1, C-NULL-1, C-NULL-2, C-NULL-3,
    decay sweep over K]
  budget: < 5 s for the target; < 60 s for the K = 10^6 pass on every control
  stopping_rule: none needed; the lane is deterministic and bounded
  falsifier: >-
    p^12 != 1 mod n. That would mean the (p, n) pair is NOT a BN pair, which
    contradicts SRC-R4 and SRC-R1 and is a capsule-level conflict requiring
    escalation before anything else in this plan is run.
  honest_limitation: >-
    k = 12 is a property of the (p, n) pair. Converting it into a security
    statement needs the crossover threshold k*(p, n) of IDEA-20260807-5f24d7 and
    a finite-field DLP cost model for GF(p^12) including exTNFS; NEITHER IS
    COMPUTED IN THIS LANE, and a `transfer` verdict without them would be the
    partial-cost error KN-TECH-035 forbids. This lane also mounts no pairing and
    computes no discrete logarithm.

- id: L-DISC
  criterion: disc
  category: ecdlp_security_requirements
  intake_comparison_target: 'false (NOT evidence)'
  mechanism: >-
    CM structure. Compute t = p + 1 - n, then write t^2 - 4p = D f^2 with D the
    fundamental discriminant of the CM field and f the conductor. Capsule ALG-4
    predicts the exact identity t^2 - 4p = -3 (6u^2 + 4u + 1)^2, so the split is
    read off rather than searched for. REPORT D AND f SEPARATELY - they are
    different objects and the corpus currently conflates them (OBJ-3).
  quantitative_prediction:
  - metric: '|D| (fundamental discriminant of the CM field)'
    direction: exact
    predicted: 3
    status: POSITIVE CONTROL. j = 0 by construction; this is the design, not a
      discovery.
  - metric: log2 f (CM conductor)
    direction: exact value, predicted to fall in [125, 127]
    reasoning: f = |6u^2 + 4u + 1| with u about 2^62, so f is about 2^127 - the
      endomorphism ring index is LARGE even though the field discriminant is
      minimal
  - metric: '(t^2 - 4p) + 3 f^2'
    direction: exact
    predicted: 0
  certificate_or_bound: >-
    exhibit f and the single product 3 f^2; the identity t^2 - 4p = -3 f^2 is
    verified by one multiplication and one subtraction. This is the cheapest
    certificate in the entire audit. Additionally exhibit (L, M) with
    4p = L^2 + 27M^2 (OBJ-2), verified by one multiplication.
  controls: [C-POS-3, C-POS-4, C-NEG-1, C-NULL-2, C-NULL-3]
  budget: < 1 s
  stopping_rule: n/a
  falsifier: t^2 - 4p not equal to -3 times a perfect square; or the exhibited f
    failing the product check; or no (L, M) solving 4p = L^2 + 27M^2.
  honest_limitation: >-
    WHICH QUANTITY THE SAFECURVES `disc` CELL REFERS TO - the CM FIELD
    discriminant (predicted 3) or the ENDOMORPHISM-RING discriminant D f^2
    (predicted about 2^254) - IS UNRESOLVED HERE because SRC-U1 is unretrieved
    (capsule CONF-1, obligation OBL-5). Both are reported; neither is mapped to
    a cell. Separately, small |D| is a design consequence of choosing j = 0 for
    efficient sextic twists; it enables the sqrt(6) rho discount of D3 and the
    GLV endomorphism, and it is NOT an ECDLP break.

- id: L-RIGID
  criterion: rigid
  category: ecc_security_beyond_ecdlp
  intake_comparison_target: 'true (NOT evidence)'
  merged_with_diagnostic: D8 (deterministic parameter-generation transcript
    audit) - one lane, cross-referenced, not two
  mechanism: >-
    A generation transcript is rigid if a stated public rule regenerates every
    parameter with no unexplained freedom. Two regeneration checks, both
    mechanical: (G1) does p(z) at z = -(2^62 + 2^55 + 1) reproduce the modulus
    (shared with L-FIELD step F2), and is z's Hamming weight minimal (three
    nonzero bits) among z of the same bit length satisfying the primality and
    security constraints the primary text states; (G2) is b = 2 the SMALLEST
    positive integer b for which y^2 = x^3 + b over F_p has order n?
  quantitative_prediction:
  - metric: number of unexplained free choices in the regeneration transcript
    direction: exact
    predicted: 0 for p given z; the count for z itself CANNOT BE PREDICTED until
      the primary text's selection rule is retrieved (OBL-2)
  - metric: smallest positive b with #E_b = n
    direction: exact
    predicted: 2 - i.e. b = 1 is predicted to FAIL
    falsifier: if b = 1 also has order n, then "smallest b" does not explain the
      choice and the transcript has an unexplained step
  - metric: Hamming weight of z
    direction: exact
    predicted: 3
  certificate_or_bound: >-
    for b = 1, exhibit a point P on y^2 = x^3 + 1 with [n]P != O - a single
    scalar multiplication that PROVES the order is not n. For b = 2, exhibit
    [n]P = O for several P plus the Hasse-uniqueness argument of L-RHO. The
    search over b is a bounded enumeration: b = 1..B with B = 100 stated
    explicitly, at about one scalar multiplication per b.
  controls: [C-POS-3 (regenerate the toy BN curve by the same rule and confirm
      the same smallest-b outcome by exhaustive counting), C-NULL-3, 'a
      deliberately non-rigid transcript - a random b that the rule does not
      reproduce - which the audit must flag as unexplained']
  budget: < 300 s for B = 100
  stopping_rule: stop the b-search at B = 100 and record B explicitly; a
    truncated search bounds the claim to "b = 2 is smallest among b <= 100".
  falsifier: p(z) != p; or Hamming weight of z != 3; or b = 1 having order n; or
    an unexplained choice surviving retrieval of the primary text.
  honest_limitation: >-
    RIGIDITY IS A JUDGEMENT ABOUT AN EXPLANATION, NOT A MATHEMATICAL PROPERTY OF
    THE CURVE. It cannot be certified in the sense of the other lanes, only
    documented. Both inputs it needs - the SafeCurves definition (SRC-U1) and
    the primary generation text (SRC-U2/OBL-2) - are unretrieved, so this lane
    is at most PARTIALLY executable now, and its outcome must be reported as a
    transcript reconstruction rather than as a rigidity verdict. A failure of
    rigidity is not by itself an ECDLP break.

- id: L-LADDER
  criterion: ladder
  category: ecc_security_beyond_ecdlp
  intake_comparison_target: 'false (NOT evidence)'
  mechanism: >-
    A Montgomery model B y^2 = x^3 + A x^2 + x over F_p contains the point
    (0, 0) of order 2, so any curve F_p-isomorphic to a Montgomery curve has
    even order. If n = #E is an odd prime, E(F_p) has trivial 2-torsion and NO
    Montgomery model over F_p exists. Equivalently and directly checkable:
    x^3 + 2 has no root in F_p.
  quantitative_prediction:
  - metric: number of roots of x^3 + 2 in F_p
    direction: exact
    predicted: 0
  - metric: '#E mod 2'
    direction: exact
    predicted: 1 (odd)
  certificate_or_bound: >-
    gcd(x^p - x, x^3 + 2) computed in F_p[x]/(x^3+2) - one polynomial modular
    exponentiation, milliseconds. A gcd of 1 certifies no root, hence no
    F_p-rational 2-torsion, hence no Montgomery model over F_p. A found root
    would be a counterexample certificate.
  controls: [C-POS-3 (toy BN, predicted no root), 'a toy Montgomery curve where
      the same code MUST find the root and the order-2 point', C-NULL-3]
  budget: < 5 s
  stopping_rule: n/a
  falsifier: exhibiting a root of x^3 + 2 in F_p, or an even #E.
  honest_limitation: >-
    "NO MONTGOMERY MODEL" IS NOT "NO LADDER". x-only differential-addition
    ladders exist for short Weierstrass curves (Brier-Joye style), so a
    constant-time ladder implementation is not excluded by this measurement. The
    SafeCurves `ladder` criterion's exact content is unretrieved (SRC-U1), so
    this lane reports the 2-torsion fact, not a cell. Absence of a ladder is an
    implementation-security consideration and is not by itself an ECDLP break.

- id: L-TWIST
  criterion: twist
  category: ecc_security_beyond_ecdlp
  intake_comparison_target: 'false (NOT evidence)'
  mechanism: >-
    Twist security depends on the quadratic twist order #E' = p + 1 + t
    = 2p + 2 - n. Capsule identity ALG-5: for the BN parameterization,
    p + 1 + t = 36u^4 + 36u^3 + 30u^2 + 6u + 3 = 3(12u^4 + 12u^3 + 10u^2 + 2u +
    1), SO THE QUADRATIC-TWIST ORDER IS DIVISIBLE BY 3 IDENTICALLY IN u. Measure
    (i) the factorization of #E', (ii) the largest prime factor and the
    corresponding twist rho cost, (iii) the twist embedding degree, (iv) the
    twist anomalous check, and (v) the small-subgroup confinement cost.
  quantitative_prediction:
  - metric: '#E'' mod 2'
    direction: exact
    predicted: 1 (odd - p odd makes 2p + 2 even and n odd, so the difference is
      odd)
  - metric: '#E'' mod 3'
    direction: exact
    predicted: 0 (ALG-5)
  - metric: largest prime factor of #E'
    direction: cannot be predicted without computation
    predicted: NOT PREDICTED. The plan pre-commits to reporting whatever is
      found, with the factorization effort and its stopping point recorded, and
      to reporting an unfactored cofactor as unfactored.
    why_this_matters: this is the one place in the plan where the intake cell
      (twist = false) could be reproduced OR contradicted by a computation whose
      outcome is genuinely unknown to this planning session
  certificate_or_bound:
    full: complete factorization of #E' with a primality certificate per factor
      and a product check
    partial: if factorization is incomplete, the honest output is "largest
      certified prime factor >= X, with an unfactored cofactor of Y digits",
      which BOUNDS the twist rho cost from one side only and must be reported as
      a one-sided bound
  controls: [C-POS-3 (toy BN twist order, exhaustively counted, must be
      divisible by 3), C-POS-4, C-NEG-1 (a curve whose published twist is
      near-prime), C-NULL-3]
  budget: trial division to 10^7 (< 60 s); ECM with B1 ramp 10^4 -> 10^7, cap
    7200 s, 4 GB
  stopping_rule: stop at 7200 s or full factorization, whichever first; record
    the B1 reached, the curve count, and the digit count of the unfactored
    remainder. A budget stop is an operational observation, never a
    mathematical conclusion about the twist.
  falsifier: '#E'' not divisible by 3 (contradicting ALG-5 and therefore
    contradicting family membership); or #E'' even; or the factorization product
    failing to equal #E''.'
  honest_limitation: twist security concerns implementations that accept
    unvalidated x-coordinates; it is not a property of the ECDLP on E, and a
    twist failure is not by itself an ECDLP break.

- id: L-COMPLETE
  criterion: complete
  category: ecc_security_beyond_ecdlp
  intake_comparison_target: 'false (NOT evidence)'
  mechanism: >-
    A (twisted) Edwards model over F_p requires a point of order 4, hence
    4 | #E. If #E = n is an odd prime, no Edwards or twisted-Edwards model
    exists over F_p, and the Edwards-style complete addition law is unavailable.
    Same certificate as L-LADDER, one step stronger.
  quantitative_prediction:
  - metric: '#E mod 4'
    direction: exact
    predicted: not 0 (in fact odd)
  - metric: number of F_p-rational points of order 2 or 4
    direction: exact
    predicted: 0
  certificate_or_bound: n odd prime (certificate from L-RHO/D1) plus the
    x^3 + 2 root test of L-LADDER
  controls: [C-POS-3, 'a toy Edwards-convertible curve with 4 | #E where the
      same code must find the order-4 point', C-NULL-3]
  budget: < 5 s (shared with L-LADDER)
  stopping_rule: n/a
  falsifier: exhibiting an F_p-rational point of order 2 or 4.
  honest_limitation: >-
    LIM-COMPLETE, AND IT IS LOAD-BEARING. SRC-R5 (Renes-Costello-Batina, ePrint
    2015/1060, RETRIEVED THIS SESSION) states complete addition formulas exist
    for EVERY prime order short Weierstrass curve over a field of
    characteristic not 2 or 3. So "no Edwards model" MUST NOT be reported as "no
    complete addition formulas exist for this curve" - the opposite is stated in
    the retrieved literature. Whether the SafeCurves `complete` cell refers to
    the narrower Edwards/Montgomery-style completeness is unresolved here
    (capsule CONF-4, OBL-5/OBL-7).

- id: L-IND
  criterion: ind
  category: ecc_security_beyond_ecdlp
  intake_comparison_target: 'false (NOT evidence)'
  mechanism: applicability of injective string-to-point encodings. Elligator 2
    requires a point of order 2 (Montgomery form); Elligator 1 requires a
    specific curve shape and congruence conditions on p. Measure the
    preconditions rather than assert the conclusion: the 2-torsion test of
    L-LADDER, plus p mod 3, p mod 4 and the sextic-residue class of 2.
  quantitative_prediction:
  - metric: applicability of Elligator 2
    direction: exact
    predicted: inapplicable (no order-2 point)
  - metric: p mod 3
    direction: exact
    predicted: 1 (required for the six sextic twists and the GLV endomorphism to
      exist over F_p; if p = 2 mod 3 the j = 0 curve would be supersingular,
      which the k = 12 prediction of L-TRANSFER already excludes - so this is a
      genuine internal consistency cross-check between two lanes)
  certificate_or_bound: the residues p mod 3 and p mod 4, plus the L-LADDER
    2-torsion certificate; each verifiable in microseconds
  controls: [C-POS-3, 'a toy Montgomery curve where Elligator 2''s precondition
      must be found to hold', C-NULL-3]
  budget: < 5 s
  stopping_rule: n/a
  falsifier: p mod 3 != 1 (which would contradict L-TRANSFER's k = 12 and force
    a capsule-level escalation); or an order-2 point being found.
  honest_limitation: >-
    LIM-IND. SRC-R6 (Tibouchi, "Elligator Squared", ePrint 2014/043, RETRIEVED
    THIS SESSION) states an indistinguishable encoding applicable to essentially
    any elliptic curve including prime-order curves, at about twice the string
    length. So "Elligator 1/2 inapplicable" MUST NOT be reported as "no
    indistinguishable encoding exists for this curve". Capsule CONF-4, OBL-7.
    Indistinguishability is a protocol-layer property and is not by itself an
    ECDLP matter.

# ===========================================================================
# THE EIGHT DECLARED ADDITIONAL DIAGNOSTICS
# ===========================================================================
additional_diagnostics:

- id: D1
  diagnostic: complete curve and twist order factorization with checkable
    certificates
  status: planned
  mechanism: #E = n is predicted prime (Pratt certificate attempted via ALG-3,
    n - 1 = 6u(6u^3 + 6u^2 + 3u + 1)); #E' is predicted composite with the
    identical factor 3 (ALG-5) and is the real factorization work.
  quantitative_prediction:
  - metric: number of prime factors of #E
    direction: exact
    predicted: 1
  - metric: number of distinct prime factors of #E' certified within budget
    direction: reported, not predicted
    predicted: NOT PREDICTED beyond the certain factor 3
  certificate_or_bound: primality certificates per factor plus a product check;
    an incomplete factorization is reported as a one-sided bound with the effort
    log, never as "the twist is secure/insecure".
  controls: [C-POS-3, C-POS-4, C-NULL-3]
  budget: shares L-FIELD and L-TWIST budgets; no additional cap
  stopping_rule: as L-TWIST
  falsifier: the product of the certified factors not equalling the order; or n
    composite.
  honest_limitation: a factorization in a pure-Python environment without Sage
    is expected to be partial for a 254-bit composite; that is disclosed in
    advance so that a partial result is not read as a shortfall or as a finding.

- id: D2
  diagnostic: subgroup, cofactor, and invalid-curve confinement costs
  status: planned
  tracked_object: OBJ-2, and this is where the object earns its place
  mechanism: >-
    The cofactor is predicted to be 1 (prime order), so small-subgroup
    confinement inside E(F_p) is predicted to be unavailable to an attacker with
    zero cost to verify. The INVALID-CURVE surface is the family
    y^2 = x^3 + c for c in F_p*. Naively that needs point counting per c, which
    is infeasible here. Via OBJ-2 it does not: for j = 0 with p = 1 mod 3, the
    six sextic-twist classes have orders p + 1 - t_i with the six t_i determined
    by 4p = L^2 + 27M^2, so the ENTIRE invalid-curve surface is six integers
    obtained from one decomposition and six subtractions.
  quantitative_prediction:
  - metric: cofactor h of E(F_p)
    direction: exact
    predicted: 1
  - metric: number of distinct curve orders in the family y^2 = x^3 + c
    direction: exact
    predicted: 6
  - metric: sum of the six orders
    direction: exact
    predicted: 6(p + 1) (the six traces sum to zero) - A FREE, SHARP,
      INSTRUMENT-INDEPENDENT CONSISTENCY CHECK on the whole computation
  - metric: minimum over the six twist classes of the largest-prime-factor bit
      length
    direction: reported, not predicted
  certificate_or_bound: exhibit (L, M) with 4p = L^2 + 27M^2; exhibit the six
    traces; for each class exhibit a representative c and a random point P with
    [p + 1 - t_i]P = O. The trace-sum identity is checked in one addition.
  controls: [C-POS-4 (exhaustive counting of all six toy twist orders - THE
      BLOCKING VALIDATION OF REC-3), C-POS-3, C-NULL-3]
  budget: < 120 s excluding the factorizations of the six orders, which inherit
    the L-TWIST cap and are run only after the cheap structural checks pass
  stopping_rule: as L-TWIST, per class, with per-class effort logged separately
  falsifier: the six computed orders failing the trace-sum identity; or any
    representative point not being annihilated by its predicted order; or the
    exhaustive toy count in C-POS-4 disagreeing with the predicted six.
  honest_limitation: >-
    THE SIX-TWIST STRUCTURE IS RECALLED (REC-3), NOT RETRIEVED, AND IS
    LOAD-BEARING FOR THIS DIAGNOSTIC. C-POS-4 is what converts it from a
    recollection into an instrument-verified statement at toy scale; without
    C-POS-4 passing, D2's output is void. Invalid-curve attacks are an
    implementation-validation matter and are not an ECDLP statement.

- id: D3
  diagnostic: automorphism- and endomorphism-adjusted rho cost
  status: planned
  mechanism: j = 0 gives Aut(E) of order 6 over F_p when p = 1 mod 3, so rho on
    the quotient by the automorphism group is faster by sqrt(6); the same
    structure gives the GLV endomorphism phi(x, y) = (beta x, y) with beta of
    order 3 in F_p*, acting as multiplication by lambda with
    lambda^2 + lambda + 1 = 0 mod n.
  quantitative_prediction:
  - metric: rho speedup factor from automorphisms
    direction: exact
    predicted: sqrt(6) = 2.449..., i.e. 1.292 bits
  - metric: '|Aut(E)| over F_p'
    direction: exact
    predicted: 6
  - metric: change in the rho TIME EXPONENT
    direction: exact
    predicted: ZERO. The cost stays Theta(sqrt(n)); this is a constant-factor
      discount and IS SAID TO BE ONE. It moves no exponent and is reported as a
      building-block measurement, not as an advance.
  certificate_or_bound: exhibit beta with beta^3 = 1, beta != 1 mod p; exhibit
    lambda with lambda^2 + lambda + 1 = 0 mod n; verify on several random points
    that phi(P) = [lambda]P by direct comparison. Three checks, milliseconds.
  controls: [C-NEG-1 (a curve with j != 0, where |Aut| must come back 2 and no
      such beta exists), C-POS-3, C-NULL-3]
  budget: < 30 s
  stopping_rule: n/a
  falsifier: no cube root of unity in F_p (which would contradict L-IND's
    p = 1 mod 3 prediction); or phi(P) != [lambda]P for any P.
  honest_limitation: a sqrt(6) discount does not change the security exponent
    and must not be presented as an attack improvement.

- id: D4
  diagnostic: embedding-degree certificate or explicit search bound
  status: planned
  disposition: FULLY COVERED BY LANE L-TRANSFER, which reuses and specializes
    IDEA-20260807-98a970. Not duplicated here.

- id: D5
  diagnostic: CM discriminant and conductor structure
  status: planned
  disposition: covered by L-DISC for (D, f) and by D2 for the twist-family
    consequence. The DISTINCT contribution recorded here is OBJ-3 - report D and
    f separately and never as one number.
  quantitative_prediction:
  - metric: 'D f^2 (the endomorphism-ring discriminant) vs |D| (the CM field
      discriminant)'
    direction: different
    predicted: '|D| = 3 while |D| f^2 is about 2^254 - a ratio of about 2^252'
    why_it_is_a_diagnostic: >-
      the program's records treat "small discriminant" as one property; for BN
      the two candidate meanings differ by 252 bits, so any record citing "small
      discriminant" without saying which is ambiguous to the point of being
      unusable
  certificate_or_bound: the ALG-4 product check plus the exhibited f
  controls: [C-POS-3, C-NULL-2, C-NEG-1]
  budget: < 5 s
  falsifier: as L-DISC
  honest_limitation: which meaning SafeCurves uses is unretrieved (CONF-1).

- id: D6
  diagnostic: model-conversion exceptional sets
  status: planned
  mechanism: enumerate the conversions actually available - short Weierstrass
    affine <-> Jacobian <-> projective, and the RCB complete projective formulas
    (SRC-R5) - and characterise each conversion's exceptional set symbolically.
    Montgomery and Edwards conversions are predicted UNAVAILABLE (L-LADDER,
    L-COMPLETE), which is itself the diagnostic's main output.
  quantitative_prediction:
  - metric: size of the exceptional set of affine <-> Jacobian conversion
    direction: exact
    predicted: 1 (the point at infinity, Z = 0)
  - metric: number of available Montgomery/Edwards conversions
    direction: exact
    predicted: 0
  certificate_or_bound: a symbolic derivation of each conversion's denominator
    ideal plus a randomized search over 10^6 sampled points for an undetected
    exception
  controls: [C-POS-5, 'a toy curve WITH an Edwards model where the conversion
      must succeed', C-NULL-3]
  budget: < 600 s
  stopping_rule: stop the randomized search at 10^6 samples and state the bound
    explicitly - "no exception found in 10^6 samples" bounds a rate, it does not
    prove emptiness
  falsifier: a sampled point triggering an exception not in the derived set.
  honest_limitation: a sampling bound is not a proof of an empty exceptional set;
    the symbolic derivation is the stronger half and its scope is the specific
    formula set audited.

- id: D7
  diagnostic: scalar and multiscalar formula exceptional-case search
  status: planned
  mechanism: for each implemented formula (incomplete Jacobian add/double,
    RCB complete add, and a 2-dimensional GLV multiscalar routine using the D3
    endomorphism), search for inputs producing an incorrect or exceptional
    result - adversarial inputs (P = Q, P = -Q, P = O, and GLV scalar splits
    hitting lambda-related collisions) plus 10^6 random inputs.
  quantitative_prediction:
  - metric: exceptions found in the incomplete formulas on adversarial inputs
    direction: higher
    predicted: > 0 - THE INSTRUMENT MUST FIRE HERE OR THE SEARCH IS NOT SEARCHING
  - metric: exceptions found in the RCB complete formulas
    direction: exact
    predicted: 0 - a nonzero count is an IMPLEMENTATION BUG (instrument failure
      under AGENTS rule 3/5), not a property of the curve, because SRC-R5 states
      completeness for every prime-order short Weierstrass curve
  certificate_or_bound: for every exception found, the exact input pair and the
    failing intermediate value, re-runnable by a third party
  controls: [C-POS-5, C-NULL-3]
  budget: < 900 s
  stopping_rule: 10^6 random inputs per formula, then stop and state the bound
  falsifier: an RCB-complete formula failing, which falsifies the
    implementation, not the mathematics.
  honest_limitation: this measures implementations, not the curve; nothing here
    is a statement about the ECDLP.

- id: D8
  diagnostic: deterministic parameter-generation transcript audit
  status: planned
  disposition: MERGED INTO LANE L-RIGID (checks G1, G2), which carries its
    prediction, certificate, budget, stopping rule and falsifier. Partially
    blocked on OBL-2 (primary generation text).
  deferral_reason_and_successor_condition: >-
    The half of the audit that needs the primary text's stated selection rule
    for z cannot run until OBL-2 is discharged. SUCCESSOR CONDITION: once the
    Pereira-Simplicio-Naehrig-Barreto full text (or an equivalent primary
    specification) is fetched and read, re-run L-RIGID check G1 against the
    rule as stated there and record the number of unexplained free choices. Do
    not attempt it from a recollection of the paper.

deferred_or_partially_covered_summary:
  fully_planned_and_unblocked: [L-FIELD, L-EQUATION, L-TRANSFER, L-DISC,
    L-LADDER, L-COMPLETE, L-IND, D2, D3, D5, D6, D7]
  blocked_on_retrieval:
  - lane: L-BASE
    blocker: OBL-3 (no sourced generator)
    successor_condition: fetch a primary specification carrying the generator,
      then run; if none is obtainable, record UNRESOLVED with the reason and do
      not substitute an implementation constant as if it were a specification.
  - lane: L-RHO
    blocker: OBL-3 (group order); partially mitigated because the order
      CERTIFICATE of L-RHO can be produced from the candidate r(z) without a
      sourced order, which is why this lane is only partially blocked
    successor_condition: run the order certificate first; a sourced order then
      becomes a cross-check rather than a prerequisite
  - lane: L-TWIST
    blocker: depends on the order from L-RHO
    successor_condition: sequential after L-RHO
  - lane: L-RIGID / D8
    blocker: OBL-2 (primary generation text) and OBL-5 (criterion definition)
    successor_condition: as recorded in D8
  blocked_for_verdicts_only_across_all_lanes:
    blocker: OBL-5 - the SafeCurves criterion definitions and thresholds are
      unretrieved (host returned HTTP 502 throughout this session)
    consequence: EVERY LANE MEASURES; NO LANE MAPS TO A True/False CELL until
      OBL-5 is discharged. This is a deliberate structural choice, not an
      oversight.

# ===========================================================================
# PRIORITISATION
# ===========================================================================
priority_ranking:
- rank: 1
  item: L-FIELD step F2 - evaluate p(z) at z = -(2^62 + 2^55 + 1) and compare
    with the intake modulus
  cost: one polynomial evaluation, under one second, zero dependencies
  information_gain: MAXIMAL PER UNIT COST. It discriminates between two
    hypotheses that the rest of the plan cannot separate - (A) the intake
    modulus is a genuine BN prime, in which case ALG-1..ALG-5 apply and k = 12,
    D = -3, 3 | #E' and the six-twist structure all follow structurally; versus
    (B) the intake modulus is an unattributed 254-bit prime that merely
    resembles one, in which case every structural prediction in this plan is
    unsupported and the capsule's attribution conflict escalates.
- rank: 2
  item: the blocking control block (C-POS-1..4, C-NEG-1, C-NULL-1..3, decay
    sweep)
  cost: minutes
  information_gain: without it no later measurement is interpretable; C-POS-3
    and C-POS-4 in particular are what validate the algebraic identities and the
    recalled six-twist structure at a scale where brute force can check them
- rank: 3
  item: L-TRANSFER and L-DISC
  cost: seconds
  information_gain: the two first-class certificates the goal names; both are
    positive controls for known design properties, so their value is instrument
    validation plus certified corpus data (the corpus holds zero embedding
    degrees and zero CM decompositions for any named curve)
- rank: 4
  item: L-LADDER, L-COMPLETE, L-IND, D3, D5, D6
  cost: seconds to minutes; all share the 2-torsion and CM certificates
  information_gain: cheap, and each carries a documented literature tension
    (CONF-4) that a synthesis must not flatten
- rank: 5
  item: D1, L-TWIST, D2 factorizations
  cost: up to 7200 s, the only expensive item in the plan
  information_gain: THE ONLY LANE WHOSE OUTCOME IS GENUINELY UNKNOWN TO THIS
    PLANNING SESSION, hence the highest surprise value, but it is ranked below
    the cheap lanes because a partial factorization is the expected outcome
- rank: 6
  item: L-RIGID / D8, L-BASE
  cost: low compute, high retrieval dependency
  information_gain: blocked; run after OBL-2/OBL-3
first_test_recommendation:
  test: rank 1 (p(z) evaluation), immediately followed by the rank 2 control
    block
  why_it_is_the_cheapest_valid_discriminator: >-
    It costs one arithmetic operation, it has a binary outcome, both outcomes
    are informative, and it is a PRECONDITION of every other structural claim in
    this plan. No cheaper test separates "BN curve" from "254-bit prime", and
    running any other lane before it risks producing certificates about an
    object whose family membership is unestablished.

