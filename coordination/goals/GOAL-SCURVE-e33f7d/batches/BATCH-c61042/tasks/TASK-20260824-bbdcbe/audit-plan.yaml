    literature_checked: partial - SRC-R1..R7 fetched; no source stating the
      six-twist order structure was retrieved (REC-3 remains recalled)
    honest_verdict: >-
      KNOWN as mathematics almost certainly - this is classical CM theory and
      the sextic residue character, and a competent number theorist would call
      it textbook. UNVERIFIED as a label here because no source was retrieved
      confirming it, and this agent will not claim `known` from memory. Within
