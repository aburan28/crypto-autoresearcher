unresolved_conflicts:
- id: CONF-1
  severity: blocking-for-verdicts, non-blocking-for-measurement
  description: The SafeCurves criterion definitions and thresholds could not be
    retrieved (SRC-U1). The intake's eleven True/False cells therefore have no
    retrieved definition to be compared against.
  adjudication_status: unresolved
  effect_on_plan: every lane measures a threshold-free quantity with a
    certificate; verdict mapping is quarantined in OBL-5.
  goal_pause_condition_check: This is NOT the goal's pause condition "primary or
    authoritative sources leave an unresolved conflict in the named curve's
    parameter tuple" - it concerns the criteria, not the tuple. Reported to the
    Coordinator as a scope note, not as a pause trigger.
- id: CONF-2
  severity: high (name collision that has produced real-world confusion)
  description: >-
    The label "BN254" is used in the literature and in deployed software for at
    least two DIFFERENT curves. SRC-R4 exhibits both in one document: b = 2 with
    p = 1679810873...864723 (CurveFp254BNb, the intake curve), and b = 3 with
    p = 2188824287...208583 (CurveSNARK, the alt_bn128 curve used in Ethereum).
    SRC-R1's security statement (R1-f) about "BN254" does not say which.
  adjudication_status: partially resolved - the intake tuple matches the b = 2
    curve by modulus and by b. Any later record citing a "BN254" result MUST
    state which prime it means, and must not import R1-f's 100-bit figure onto
    this curve without checking which curve that estimate was computed for.
- id: CONF-3
  severity: medium
  description: Intake supplies no group order, cofactor or base point, but the
    `base` and `rho` cells presuppose them. The audit cannot reproduce those two
    cells until a sourced generator and order exist.
  adjudication_status: unresolved; obligation OBL-3.
- id: CONF-4
  severity: low, but a genuine intake-versus-literature tension worth recording
    now
  description: >-
    The `complete` cell is False in intake, yet SRC-R5 (retrieved) states that
    complete addition formulas exist for EVERY prime-order short Weierstrass
    curve over a field of characteristic not 2 or 3. Similarly the `ind` cell is
    False, yet SRC-R6 (retrieved) states an indistinguishable encoding
    applicable to essentially any curve at about twice the string length. Both
    papers postdate the SafeCurves criteria. There is no contradiction if the
    cells refer to the specific formula/encoding families SafeCurves fixed; but
    that is exactly what SRC-U1 would settle and it is unretrieved.
  adjudication_status: unresolved; obligations OBL-5 and OBL-7. Recorded so that
    no later record reads these two cells as "no complete formulas exist" or "no
    indistinguishable encoding exists".

