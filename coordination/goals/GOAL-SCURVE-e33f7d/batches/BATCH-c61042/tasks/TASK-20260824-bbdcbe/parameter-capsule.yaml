# ---------------------------------------------------------------------------
# LAYER 5 - ALGEBRAIC IDENTITIES IN THE BN PARAMETERIZATION
# ---------------------------------------------------------------------------
algebraic_identities:
  status: SYMBOLIC ALGEBRA, NOT MEASUREMENT. Each identity below is a polynomial
    identity in the BN parameter u, derived in this session from the retrieved
    polynomials R1-a by expansion. NONE of them has been evaluated at the
    concrete u, because this session had no arithmetic capability. Each carries a
    re-verification obligation (OBL-6) and must be re-derived symbolically by the
    executing agent before use.
  base_polynomials_from_R1a:
    p(u): 36u^4 + 36u^3 + 24u^2 + 6u + 1
    r(u): 36u^4 + 36u^3 + 18u^2 + 6u + 1
  derived:
  - id: ALG-1
    identity: p(u) - r(u) = 6u^2
    use: gives the trace via t = p + 1 - r when r = #E, i.e. t(u) = 6u^2 + 1.
    verification_hint: compare the 24u^2 and 18u^2 coefficients.
  - id: ALG-2
    identity: p(u) - 1 = 6u * (6u^3 + 6u^2 + 4u + 1)
    use: an ALGEBRAIC PARTIAL FACTORIZATION OF p-1, which is what makes a Pratt
      primality certificate for p plausibly reachable without a general-purpose
      254-bit factorization (lane L-FIELD).
  - id: ALG-3
    identity: r(u) - 1 = 6u * (6u^3 + 6u^2 + 3u + 1)
    use: same role for a Pratt certificate on the group order (lanes L-BASE,
      L-RHO).
  - id: ALG-4
    identity: t(u)^2 - 4p(u) = -3 * (6u^2 + 4u + 1)^2
    derivation_note: expand (6u^2+1)^2 - 4(36u^4+36u^3+24u^2+6u+1) =
      -3(36u^4+48u^3+28u^2+8u+1) and observe 36u^4+48u^3+28u^2+8u+1 =
      (6u^2+4u+1)^2.
    use: IF ALG-4 survives re-derivation and IF the concrete tuple satisfies the
      BN parameterization, then the CM equation t^2 - 4p = D f^2 is satisfied
      with fundamental discriminant D = -3 and conductor f = |6u^2 + 4u + 1|.
      This is the single cheapest certificate in the whole audit: ONE
      multiplication verifies it. It is also the reason the `disc` cell is a
      DESIGN PROPERTY rather than a discovery.
    conductor_note: >-
      |D| = 3 is small while f = |6u^2+4u+1| is on the order of u^2, i.e. of
      size roughly p^{1/2}. SMALL FIELD DISCRIMINANT AND LARGE CONDUCTOR ARE
      DIFFERENT FACTS ABOUT DIFFERENT OBJECTS (the CM field versus the
      endomorphism ring). Which of the two a SafeCurves `disc` cell refers to is
      UNRESOLVED here because SRC-U1 is unretrieved; both are to be reported
      separately (diagnostic D5, obligation OBL-5).

