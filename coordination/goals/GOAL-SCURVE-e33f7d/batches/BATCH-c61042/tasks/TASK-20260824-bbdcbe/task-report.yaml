- id: CONF-2
  summary: '"BN254" names at least two distinct curves in the literature and in
    deployed software - b = 2 with p = 1679...4723 (this curve) and b = 3 with
    p = 2188...8583 (alt_bn128). Both appear in one retrieved source. The
    retrieved exTNFS security statement about "BN254" does not say which.'
  status: partially resolved - intake matches the b = 2 curve by modulus and b.
  required_of_successors: any record citing a "BN254" result must name the prime
    it means.
- id: CONF-3
  summary: intake supplies no group order, cofactor or base point, which the
    `base` and `rho` cells presuppose.
  status: unresolved; obligation OBL-3.
- id: CONF-4
  summary: >-
    The `complete` and `ind` cells are False in intake, while two sources
    RETRIEVED THIS SESSION state that complete addition formulas exist for every
    prime-order short Weierstrass curve (ePrint 2015/1060) and that an
    indistinguishable encoding applies to essentially any curve at about twice
    the string length (ePrint 2014/043). There is no contradiction if the cells
    refer to the narrower formula/encoding families SafeCurves fixed - but the
    page that would settle it is exactly the one that could not be fetched.
  status: unresolved; obligations OBL-5 and OBL-7.
  why_it_matters: it is the one place where the preregistered comparison target
    and retrieved literature visibly pull in different directions, and a
    synthesis that flattens it would misstate both.

