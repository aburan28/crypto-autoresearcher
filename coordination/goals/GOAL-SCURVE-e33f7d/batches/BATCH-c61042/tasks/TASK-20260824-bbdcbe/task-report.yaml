# ERRATUM - CROSS-ARTIFACT REFERENCE
# ---------------------------------------------------------------------------
erratum:
- id: ERR-1
  affects: audit-plan.yaml lanes L-TWIST and D1, which cite "capsule ALG-5"
  problem: the parameter capsule's `algebraic_identities.derived` list defines
    ALG-1 through ALG-4 only. ALG-5 is referenced but not defined there. This is
    a drafting inconsistency between two artifacts written in one session, and
    the capsule was not rewritten to fix it because an already-written artifact
    is corrected by supersession, not by overwrite.
  correction: ALG-5 is stated here in full, with the same status as ALG-1..ALG-4
    (SYMBOLIC ALGEBRA, NOT MEASUREMENT, carrying re-verification obligation
    OBL-6).
  ALG-5:
    identity: p(u) + 1 + t(u) = 36u^4 + 36u^3 + 30u^2 + 6u + 3
      = 3 * (12u^4 + 12u^3 + 10u^2 + 2u + 1)
    derivation: with p(u) = 36u^4+36u^3+24u^2+6u+1 (retrieved, R1-a) and
      t(u) = 6u^2 + 1 (capsule ALG-1), the quadratic-twist order is
      p + 1 + t = 36u^4 + 36u^3 + (24+6)u^2 + 6u + (1+1+1); factoring 3 out of
      each coefficient gives the stated product.
    consequence_used_in_the_plan: THE QUADRATIC-TWIST ORDER OF A BN CURVE IS
      DIVISIBLE BY 3 IDENTICALLY IN u, so the twist cofactor is at least 3. This
      is a preregistered, falsifiable prediction in lanes L-TWIST and D1.
    status: to be re-derived symbolically by the executing agent before use;
      never to be cited as a measurement.

