- item: The audit plan covers every one of the eleven criteria in the declared
    category, with a certificate or explicit bound, controls, falsifier, budget
    and stopping rule.
  met: true
  where: audit-plan.yaml `lanes` - L-FIELD, L-EQUATION, L-BASE (basic parameter
    requirements); L-RHO, L-TRANSFER, L-DISC (ECDLP security requirements);
    L-RIGID, L-LADDER, L-TWIST, L-COMPLETE, L-IND (ECC security beyond ECDLP).
    Each carries mechanism, quantitative prediction with named metric and
    direction, certificate_or_bound, controls, budget, stopping_rule, falsifier
    and honest_limitation.
  caveat: three lanes (L-BASE, L-RHO, L-TWIST) are planned but BLOCKED on
    retrieval obligation OBL-3, and all eleven are blocked FOR VERDICT MAPPING
    ONLY on OBL-5. Both blocks are recorded with successor conditions in
    `deferred_or_partially_covered_summary`.
- item: The plan covers every declared additional diagnostic, or records a
    concrete reason and successor condition for a deferred diagnostic.
  met: true
  where: audit-plan.yaml `additional_diagnostics` D1..D8, one per declared
    diagnostic in goal order. D4 is dispositioned onto lane L-TRANSFER (reusing
    IDEA-20260807-98a970) and D8 onto lane L-RIGID, each with the disposition
    stated; D8 carries an explicit deferral reason (primary generation text
    unread) and successor condition.
- item: Positive, parameter-matched negative, and same-shape null controls are
    explicit and run before belief in any later task.
  met: true
  where: audit-plan.yaml `controls` - positive C-POS-1..5, parameter-matched
    negative C-NEG-1 (with its matching assumptions stated and its size-versus-
    field mismatch disclosed) and C-NEG-2 (declared infeasible in this
