honest_accounting:
  objects_considered:
  - id: OBJ-1
    object: the multiplicative order ord_n(p)
    verdict: repackaging of IDEA-20260807-98a970's object; reused deliberately as
      a control, not proposed as new
  - id: OBJ-2
    object: the Eisenstein CM decomposition 4p = L^2 + 27M^2 with its unit orbit
    verdict: selected as this session's tracked object; passes the
      lossy-projection test (the projection discards b, the base point and the
      model, and what it discards is discarded compatibly with sextic twisting,
      which acts on the retained pair as multiplication by a unit); classical
      mathematics, new as data within this program
  - id: OBJ-3
    object: the CM conductor f, tracked separately from the fundamental
      discriminant D
    verdict: adaptation; carried because the program's records conflate two
      quantities that differ by about 252 bits on this curve
  dominated_by: >-
    n/a for any attack claim - NO ATTACK, SPEEDUP OR COMPLEXITY IMPROVEMENT IS
    CLAIMED BY THIS TASK. For the one embedded measurement idea (the CM
    decomposition as the tracked object for the invalid-curve surface), the
    Pareto check was run against every attack-frontier row this program records:
    rho at 0.886 sqrt(n) with O(1) memory (KN-TECH-001, KN-TECH-006),
    automorphism-discounted rho on CM curves (KN-TECH-018), BSGS at sqrt(n)
    time and sqrt(n) memory (KN-TECH-031) with its n^{2/3+o(1)} full cost
    (KN-TECH-035), MOV/Frey-Ruck at small k (KN-TECH-032), and the anomalous
    transfer (KN-TECH-033). The idea improves NONE of them on time, memory or
    data/queries, and is dominated by all of them as an attack. As an INSTRUMENT
    it is dominated by any computer-algebra system carrying SEA and Cornacchia
    routines; it dominates that incumbent only in being runnable in a pure-Python
    environment and in emitting a ledger certificate.
    NOTE ON THE FRONTIER CHECK ITSELF: the rows enumerated above are the ones
    named in the internal records read during this task. This agent did not
    re-enumerate the full knowledge corpus in this session, so the check is
    complete against those rows and is stated as such rather than as an
    unqualified null.
  sota_delta:
    attack_axes: zero on time, zero on memory, zero on data/queries. No exponent
      is moved. No constant factor of any attack is improved.
    measurement_axes: >-
      The corpus currently holds ZERO embedding-degree values or bounds, ZERO CM
      decompositions and ZERO twist-family order tables for any named deployed
      curve (per IDEA-20260807-98a970's own novelty screen, which found the same
      gap for embedding degrees in 2026-08). This task adds no measurements at
      all - it is a plan - but it specifies certificates whose third-party
      verification costs are stated exactly: three modular exponentiations for
      k = 12, one multiplication for t^2 - 4p = -3f^2, one multiplication for
      4p = L^2 + 27M^2, one polynomial modular exponentiation for the 2-torsion
      facts, and K modular multiplications (NOT succinct, and said so) for any
      k > K bound.
    exponent_first_honesty: >-
      MEASURED AGAINST docs/target-result-profile.md THIS TASK IS FAR OFF-PROFILE
      AND SAYS SO. It moves no asymptotic exponent of any central hard problem;
      it does not even improve a log cofactor. Its justification is that it is a
      commissioned parameter-audit planning task with a fixed handoff, and that
      certified per-curve parameter data is a building block the program lacks
      entirely. It should be ranked accordingly and not read as a research
      advance.
  closures_enumerated:
  - closure: The ideal parameter-matched negative control - a curve over the SAME
      p with j != 0 and known order - is unreachable in this environment.
    mechanism: obtaining its order requires SEA point counting; the program's
