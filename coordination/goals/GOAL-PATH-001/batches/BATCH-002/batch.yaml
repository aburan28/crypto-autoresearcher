batch:
  id: BATCH-002
  goal_id: GOAL-PATH-001
  status: queued
  opened_at: '2026-09-06'
  opened_by: coordinator
  opening_decision: DEC-20260906-dc6694
  dispatch_queue_path: coordination/goals/GOAL-PATH-001/batches/BATCH-002/dispatch_queue.json
  max_concurrent: 1

  objective: >-
    MAKE GOAL-PATH-001'S ONE COMMISSIONED NEXT ACTION RUN, AND NOTHING ELSE.
    Dispatch TASK-20260810-9e7f4c -- the coordinator-only, ZERO-RUN reconciliation
    of GOAL-DREG-001's mutable head against its committed BATCH-004 and BATCH-005
    archives and against defects CD-1 and CD-2 -- and archive its two deliverables
    under a Coordinator snapshot receipt the post-commit verifier accepts. THE
    BATCH SPENDS NO COMPUTE AND AUTHORISES ZERO CHARGED EXPERIMENT RUNS. Its
    entire output is a reconciliation report, a machine-readable ladder_state.yaml,
    and one archive receipt.

  authority:
    substance: >-
      DEC-20260810-2f92d8 N-1 -- "EXACTLY ONE NEXT ACTION FOR GOAL-PATH-001:
      dispatch TASK-20260810-9e7f4c ... NO DREG BATCH MAY BE OPENED BEFORE THAT
      RECONCILIATION IS COMMITTED." That decision, and the immutable envelope
      ledger/handoffs/TASK-20260810-9e7f4c.yaml it authorises, define everything
      this batch's producer does. NEITHER IS RE-OPENED, RE-ARGUED OR NARROWED HERE.
    archival_task: >-
      ledger/handoffs/TASK-20260810-9e7f4c.yaml `archived_by_note` -- "Exactly one
      snapshot archival task must own this task's artifacts ... THE DISPATCHING
      SESSION MUST ALLOCATE THAT ARCHIVAL TASK AND SET THIS FIELD BEFORE DISPATCH."
      TASK-20260906-b44b88 IS THE DISCHARGE OF THAT STANDING INSTRUCTION. It is not
      an invention of this batch and it supersedes nothing.
    shape_and_pointer: >-
      DEC-20260906-dc6694 -- selects the batch shape, names TASK-20260906-b44b88 as
      the allocated archival task, and authorises the goal-head
      dispatch_queue_path repair. What it SUPERSEDES is one goal-head field. It
      supersedes no prior decision and no next_action.
    what_the_shape_decision_does_not_supply: >-
      NO RESEARCH AUTHORITY OF ANY KIND. DEC-20260906-dc6694 approves no
      experiment, opens no DREG batch, authorises no measurement, moves no claim
      tier, changes no hypothesis and changes no goal status. It authorises a
      DISPATCH.

  batch_identity_note: >-
    THIS QUEUE OPENS UNDER A BATCH THE GOAL HEAD RECORDS AS CLOSED, AND THAT IS
    FACED RATHER THAN LEFT FOR A READER TO NOTICE. GOAL-PATH-001's BATCH-002
    checkpoint records a decision-only batch closed 2026-08-02 whose execution
    artifacts live under GOAL-MONO-001 BATCH-003, and states that BATCH-002 has no
    PATH-owned coordination directory or dispatch queue. Yet the same
    DEC-20260810-2f92d8 that wrote that checkpoint, late, on 2026-08-10 also
    commissioned TASK-20260810-9e7f4c with `batch_id: BATCH-002` and a
    BATCH-002-scoped write_scope. THE READING TAKEN, ARGUED IN FULL IN
    DEC-20260906-dc6694 `the_batch_002_identity_question`: BATCH-002 has two halves
    and only the PRIORITIZATION half closed. This queue serves the EXECUTION half,
    which was commissioned and never dispatched. The checkpoint is accurate as of
    2026-08-10, is IMMUTABLE, and is NOT edited, vacated, reopened or contradicted;
    what changes is the state, not the record of it. Minting a fresh batch
    identifier instead was considered and refused, because the immutable envelope
    declares batch_id BATCH-002 and the goal head's current_batch_id is BATCH-002,
    so a new identifier would need either an edit to an immutable record or a queue
    that disagrees with the handoff it dispatches. NOTHING MECHANICAL CHECKS THIS:
    the driving session reports `batch_id` appears zero times in
    tools/research_dispatch.py. It is a Coordinator record-integrity call and a
    later session that reads it differently should supersede the decision rather
    than re-interpret it quietly.

  what_this_batch_explicitly_does_not_do:
  - >-
    IT DOES NOT OPEN A GOAL-DREG-001 BATCH. The standing prohibition from
    DEC-20260810-2f92d8 N-1 is carried forward verbatim: NO DREG BATCH MAY BE
    OPENED BEFORE THIS RECONCILIATION IS COMMITTED. No task of this batch may open
    one and no record of this batch may be read as opening one.
  - >-
    IT DOES NOT RE-MAKE GOAL-PATH-001'S THREE-WAY PRIORITIZATION CHOICE, and it
    does not select, revive, rank or refuse option (a), (b) or (c).
    CORR-20260905-bbd1a8 left that as a Coordinator prioritization decision on the
    evidence, and TASK-20260810-9e7f4c is itself charged with re-deriving option
    (c)'s reachability against GOAL-MONO-001 as it now stands. Deciding it before
    the task runs would consume the question the task exists to answer.
  - >-
    IT DOES NOT REPAIR CD-1. DEC-20260731-014's misattribution is confirmed three
    times over, and its repair belongs to the GOAL-DREG-001 lane as a SUPERSEDING
    RECORD UNDER A NEW IDENTIFIER (AGENTS.md rule 15; the identifier is named in
    the binding fields of the completed BATCH-005 ledger receipt). Neither
    DEC-20260731-014 nor that receipt is edited or renamed by anything here.
    TASK-20260810-9e7f4c's D4 SURFACES the three-lane exposure, including
    GOAL-AES-001 through commit a421f72bb; it notifies nobody and supersedes
    nothing.
  - >-
    IT AUTHORISES NO MEASUREMENT, NO EXPERIMENT AND NO PROTOCOL FREEZE OR
    AMENDMENT. No solver runs, no rank is computed, no d_reg, deficit, gap(n) or
    exponent is measured or predicted, and no EXP-* contract is frozen.
  - >-
    IT MOVES NO HYPOTHESIS AND NO GOAL STATUS. H-DREG-001, H-SIG-001, H-DS-001 and
    every other hypothesis keep the status they had; GOAL-PATH-001 stays `active`
    with active_hypothesis_ids empty; no goal is completed, closed_at_budget or
    cancelled.
  - >-
    IT EDITS NO GOAL RECORD FROM INSIDE A TASK. TASK-20260810-9e7f4c's committed
    constraints forbid editing any goal record and that constraint is unchanged.
    The one goal-head field this batch's authority touches --
    GOAL-PATH-001.dispatch_queue_path -- is edited by the DRIVING SESSION under
    DEC-20260906-dc6694 OB-3, outside any task's write_scope, so it rides one
    commit with the validator run.
  - >-
    IT DOES NOT ADDRESS THE FOUR ASYMPTOTIC-COMPLEXITY PROMOTION GATES and claims
    no progress toward any of them.
  - >-
    IT DOES NOT WRITE, REGENERATE OR STAGE knowledge/INDEX.md, which is generated
    and gitignored.

  claim_ceiling: >-
    `dispatch_plumbing`. This batch files no evidence record, takes no measurement
    and produces no mathematical content, so there is nothing for a claim tier to
    describe. The reconciliation it dispatches is a READ of committed records: its
    report may state what committed artifacts establish, and must mark every
    unestablished cell UNKNOWN rather than fill it. THAT THIS BATCH'S TASK SAT
    UNDISPATCHABLE FROM 2026-08-10 TO 2026-09-06 IS AN INFRASTRUCTURE FACT AND IS
    NEVER EVIDENCE ABOUT d_reg, ABOUT GOAL-DREG-001'S LADDER, OR ABOUT ECDLP IN
    EITHER DIRECTION (AGENTS.md rule 5 / CLAUDE.md rule 3).

  task_graph:
    shape: >-
      TASK-20260810-9e7f4c (coordinator, producer, zero-run) ->
      TASK-20260906-b44b88 (coordinator, SNAPSHOT archive, runs ALONE).
    every_non_archive_task_is_claimed: >-
      TASK-20260810-9e7f4c is the single entry of TASK-20260906-b44b88's
      `archive.source_task_ids`, and that is the field the dispatcher enforces.
      Its absence is exactly what made the minimal BATCH-002 queue undispatchable:
      "non-archive task TASK-20260810-9e7f4c must be assigned exactly once to an
      archive task", reproduced independently by the 2026-09-04 finding and by the
      driving session at HEAD 84fbc464c.
    archive_kind_is_snapshot: >-
      THREE COMMITTED SOURCES AGREE. The envelope's archived_by_note names "exactly
      one SNAPSHOT archival task"; its completion_gate repeats "committed by a
      Coordinator snapshot archival task run alone, whose receipt the post-commit
      verifier accepts"; and the producer writes NOTHING under ledger/ -- its
      write_scope_note says so in terms -- so there is no ledger record for a
      ledger-kind archive to own. GOAL-PATH-001 BATCH-001's own committed archive
      TASK-20260725-671 is kind snapshot owning a snapshot-receipt.json, so this is
      the shape the goal already uses.
    archive_runs_alone: >-
      By rule. Workers do not commit into a shared worktree and two archives must
      not race on one Git index or HEAD. With max_concurrent 1 and a two-task
      serial graph, isolation here is structural rather than merely declared.
    no_review_round_in_this_batch: >-
      DELIBERATE AND INHERITED, NOT AN OMISSION. TASK-20260810-9e7f4c's committed
      handoff sets independent_session_required false with its reason stated: "this
      task produces no claim requiring adversarial review: it reads committed
      records and returns a reconciliation". Its own note preserves the successor
      obligation verbatim -- if D6 recommends OPEN, the resulting MEASUREMENT batch
      DOES require independent Validator and Red Team review, and that requirement
      is INHERITED BY THAT BATCH, NOT WAIVED HERE. No reviewer is dispatched by
      this batch and no review independence is claimed by it.
    the_ledger_close_is_not_in_this_batch: >-
      STATED AT OPENING SO IT IS NOT DISCOVERED AS A GAP. BATCH-002 ends at a
      verified SNAPSHOT. The LEDGER archive that would disposition the
      reconciliation, checkpoint GOAL-PATH-001 and set its next action is NOT in
      this queue: it needs a DEC-* identifier no session here may mint and content
      that does not exist until TASK-20260810-9e7f4c returns. It is
      DEC-20260906-dc6694 N-3, a separate Coordinator act.

  budget_accounting:
    campaign_ceiling: >-
      UNBOUNDED. ledger/goals/GOAL-PATH-001.yaml records campaign_budget
      maximum_batches null and total_wall_clock_seconds null, set by
      BUDGET-AMEND-20260828-6a48ef on explicit user authorisation and reinforced by
      the ECC unlimited-budget rule (CLAUDE.md rule 11). NO FIGURE BELOW IS A
      REMAINING-ALLOCATION CALCULATION and no ceiling is self-granted, because
      there is no ceiling to raise. Unlimited removes budget as a STOP; it removes
      no gate, authorises no run, and does not make this batch larger.
    charged_experiment_runs_authorised: 0
    charged_runs_note: >-
      ZERO, ON BOTH TASKS, AND THE FIELD SAYS SO LITERALLY. Both tasks declare
      `maximum_runs: 0` with `wall_clock_seconds: null` and `memory_gb: null`.
      THAT IS NOT A WORKAROUND AND NOT A DEVIATION. tools/research_dispatch.py
      `declares_zero_compute` (lines 105-127, called from validate_handoff at lines
      ~404-422) exists precisely so a task that DECLARES it runs no experiments may
      omit the ceilings that bound runs; its docstring names the two goals that sat
      undispatchable under the old rule -- GOAL-ECDLP-001 BATCH-e6c1c9 and
      GOAL-MD5-001 BATCH-ebac02 -- "over a compute ceiling for compute that is
      never spent". The producer's own envelope had already reasoned it correctly:
      "wall_clock_seconds and memory_gb are null BECAUSE NO COMMITTED RECORD FIXES
      A BUDGET FOR A COORDINATOR LEDGER-READ TASK, and inventing one would be a
      fabricated number under AGENTS.md rule 9." NO POSITIVE WALL-CLOCK OR MEMORY
      FIGURE IS INVENTED FOR EITHER TASK AND `maximum_runs: 1` APPEARS NOWHERE IN
      THIS BATCH.
    where_this_was_established: >-
      DEC-20260906-dc6694 `budget_premise_retracted_not_an_obstacle`, including the
      exact division of labour: the DRIVING SESSION ran the check against the real
      committed functions and reports BUDGET ERRORS NONE; the authoring session had
      no shell and reached the same reading from the committed source alone.
    this_tolerance_does_not_transfer: >-
      CARRIED FORWARD VERBATIM FROM THE ENVELOPE AND FROM THE GOAL HEAD: "any
      successor handoff that authorizes a DREG measurement MUST carry non-null
      wall_clock_seconds and memory_gb, derived from a committed cell cost, and a
      Coordinator must reject it otherwise". A zero-compute declaration is
      available ONLY to a task that runs nothing.
    maximum_runs_definition: >-
      COUNTS CHARGED EXPERIMENT RUNS UNDER A CONTRACT -- a run directory, a RUN-*
      identifier, a manifest, an armed deadline and a consumed ceiling. It does not
      count a coordinator reading committed records, a git command, or a validator
      invocation. Defined here because the field has been read two different ways
      in this repository before.

  procedure_deviations:
  - id: PD-1
    what: >-
      AN INSTRUCTION IN A COMMITTED RECORD CANNOT BE LITERALLY OBEYED, AND THE
      REASON IS AN INVARIANT RATHER THAN AN OVERSIGHT.
      ledger/handoffs/TASK-20260810-9e7f4c.yaml orders: "THE DISPATCHING SESSION
      MUST ALLOCATE THAT ARCHIVAL TASK AND SET THIS FIELD BEFORE DISPATCH." The
      allocation is done -- TASK-20260906-b44b88 -- but `archived_by` CANNOT BE
      SET, because that record is committed and immutable and AGENTS.md rule 2
      permits supersession, never overwriting. The field stays null in the envelope
      permanently.
    how_the_substance_is_discharged: >-
      BY THE FIELD THE DISPATCHER ACTUALLY ENFORCES.
      TASK-20260906-b44b88's `archive.source_task_ids: ["TASK-20260810-9e7f4c"]`
      is what makes exactly one archival task own the producer's artifacts, and
      validate_queue rejects any queue in which a non-archive task is unassigned or
      doubly assigned. The driving session reports that the string `archived_by`
      does not appear in tools/research_dispatch.py at all, so the envelope's
      instruction named a field that could never have carried the binding.
    what_the_queue_copy_does: >-
      IT CARRIES `archived_by: null`, THE ENVELOPE'S OWN VALUE, so the queue's
      embedded handoff does not contradict the envelope on this or any other
      field, and THE ENVELOPE GOVERNS wherever wording differs -- this
      repository's standing queue convention. A sibling
      `archived_by_note_queue_copy` key states, in the queue itself, that the
      binding lives in the archive task's `source_task_ids`, so a reader of the
      queue alone is not left with a null and no explanation. See
      queue_additions_note below for the three items the queue ADDS; nothing the
      envelope wrote is altered, narrowed or dropped.
    residual_stated_not_waved_away: >-
      A READER OF THE ENVELOPE ALONE STILL SEES A NULL AND A NOTE SAYING IT MUST BE
      SET. That reader must be able to find the answer, which is why
      TASK-20260906-b44b88 is named as the owning archival task in three committed
      places that are not the immutable file: DEC-20260906-dc6694, this batch
      record, and ledger/handoffs/TASK-20260906-b44b88.yaml.
  - id: PD-2
    what: >-
      THE BATCH IS OPENED UNDER AN IDENTIFIER THE GOAL HEAD'S OWN CHECKPOINT
      DESCRIBES AS A CLOSED, DECISION-ONLY BATCH WITH NO COORDINATION DIRECTORY
      AND NO QUEUE.
    why: >-
      The immutable envelope declares `batch_id: BATCH-002` and scopes its writes
      to coordination/goals/GOAL-PATH-001/batches/BATCH-002/tasks/TASK-20260810-9e7f4c/,
      and the goal head's current_batch_id is BATCH-002. Any other identifier would
      require editing an immutable record or committing a queue that disagrees with
      the handoff it dispatches. See batch_identity_note above and
      DEC-20260906-dc6694 `the_batch_002_identity_question` for the full argument,
      the alternative refused (minting BATCH-992800), and the disclosure that
      nothing mechanical validates this correspondence.
    cost_stated: >-
      A READER OF THE GOAL HEAD ALONE WILL SEE A CLOSED BATCH-002 CHECKPOINT AND A
      LIVE BATCH-002 QUEUE, AND THE TWO ARE RECONCILED ONLY BY PROSE. The
      checkpoint is immutable and stays as written; this note and the decision are
      where the reconciliation lives.

  queue_only_fields_note: >-
    NOT A DEVIATION, RECORDED SO A READER DOES NOT MISTAKE IT FOR ONE.
    `crypto.autoresearch.dispatch_queue.v1` requires per-task fields the handoff
    schema has no counterpart for: `title`, `state`, `priority`,
    `review_required`, `depends_on` and `read_scope`. They are supplied in the
    queue only. TASK-20260810-9e7f4c's `read_scope` IS DERIVED FROM ITS OWN
    COMMITTED `inputs` LIST, widened to containing directories so the paths
    resolve, plus the two remediation records this batch inherits; it grants no
    read the envelope's inputs did not already name. `review_required: false`
    restates the envelope's `independent_session_required: false` and its stated
    reason; it is not a new judgement about reviewability.

  queue_additions_note: >-
    THE QUEUE COPY OF TASK-20260810-9e7f4c'S HANDOFF REPRODUCES EVERY ITEM THE
    ENVELOPE WROTE, UNALTERED, AND ADDS EXACTLY THREE. Each carries the label
    "ADDED BY THE QUEUE, NOT BY THE ENVELOPE, AND FLAGGED AS SUCH" in its own text,
    so no reader can mistake one for the envelope's words. THEY ARE, AND THIS IS
    THE COMPLETE LIST: (1) one `inputs` entry naming the three records that explain
    why this task is only now dispatchable -- the 2026-09-04 finding,
    CORR-20260905-bbd1a8, and DEC-20260906-dc6694; (2) one `constraints` entry that
    NARROWS NOTHING AND WIDENS NOTHING, restating that this task does not open,
    reopen, close or edit BATCH-002, does not re-make the three-way prioritization,
    and does not repair CD-1; and (3) a D6-ADDENDUM under `deliverables`, NOT a
    seventh deliverable, requiring the producer to re-derive option (c)'s
    REACHABILITY against GOAL-MONO-001 as it now stands and to REPORT it without
    SELECTING an option.
    THE AUTHORITY FOR (3) IS NOT THIS BATCH'S INVENTION: CORR-20260905-bbd1a8's
    consequences block already states that "Whoever runs TASK-20260810-9e7f4c
    should re-derive option (c)'s reachability against MONO-001 as it now stands,
    rather than against a paused, budget-exhausted goal that no longer exists in
    that form", and DEC-20260906-dc6694 is the committed decision that binds that
    consequence into the task card. THE COST IS STATED: a committed envelope's
    deliverable list is being read alongside an addition it does not contain, and a
    reader must consult both. Nothing in the envelope is altered, narrowed or
    dropped, and the envelope governs on every item it does carry.

  queue_binding_note: >-
    coordination/goals/GOAL-PATH-001/batches/BATCH-002/dispatch_queue.json IS
    DELIBERATELY NOT AN artifact_path OF ANY TASK AND NO ARCHIVE OF THIS BATCH
    BINDS IT. A content-bound archive stores its sha256 map INSIDE the queue file,
    so binding the queue would require that file to contain its own sha256 -- a
    hash fixed point no write ordering satisfies. THE RESIDUAL IS STATED RATHER
    THAN WAVED AWAY: this file's bytes are NOT cryptographically bound by any
    receipt of this batch, so a later edit to it would go undetected by every
    receipt here. What narrows the gap is that everything the queue carries which
    matters -- the producer's objective, constraints, deliverables, artifact paths,
    write scope, budget and completion gate -- is ALSO carried by the immutable
    envelope ledger/handoffs/TASK-20260810-9e7f4c.yaml, by
    ledger/handoffs/TASK-20260906-b44b88.yaml and by this batch.yaml. The snapshot
    receipt must disclose the queue by name in `staged_not_in_binding_set`.

  binding_mode_note: >-
    TASK-20260906-b44b88's archive declares `binding_mode: content_first`, and it
    is a CHOICE rather than a default -- the field is optional and BATCH-001's own
    archive carries none. The reason is specific to this goal. CORR-20260802-7787de
    records that GOAL-PATH-001's prior latest_verified_commit
    9f80eebbef2df9a521a9cce8da66391cfcb63e73 DOES NOT RESOLVE while its recorded
    parent does -- "the signature of a branch tip replaced by a squash merge" --
    and that no commit in the repository reproduces the 61 declared path hashes of
    the BATCH-001 receipt. CLAUDE.md's answer to exactly that failure is that
    receipts bind to CONTENT first and commit reachability is advisory. A
    content-first binding on this goal's next receipt repairs a demonstrated
    failure mode. A CONTENT MISMATCH REMAINS FATAL.

  completion_gate_of_the_batch:
  - >-
    TASK-20260810-9e7f4c returns D1-D6 with a record ID or an exact path cited for
    every factual claim and every unestablished cell marked UNKNOWN, exactly as its
    immutable envelope's completion_gate requires. That gate is not restated here
    in a weakened form; the envelope governs.
  - >-
    TASK-20260906-b44b88 commits exactly the declared paths, ALONE, and its
    snapshot receipt is accepted by the post-commit verifier. UNTIL THAT
    VERIFICATION PASSES THE RESULT IS NOT DURABLE AND NO DREG BATCH MAY BE OPENED
    ON IT.
  - >-
    The base commit fetched from origin/main and the merge outcome are recorded in
    the task receipt.

  what_would_make_this_batch_fail_honestly:
  - >-
    THE DISPATCHER REJECTING THE QUEUE. That is an INFRASTRUCTURE SIGNAL. Report
    the exact error text to the Coordinator; do not loosen a record, invent a
    budget ceiling, or edit the immutable envelope.
  - >-
    THE RECONCILIATION RETURNING INCONCLUSIVE. If the committed BATCH-004 /
    BATCH-005 artifacts cannot establish whether an archive was verified, the
    envelope's return_format already requires the producer to SAY INCONCLUSIVE
    PLAINLY and name what would settle it. That is a legitimate and complete
    outcome of this batch, not a failure of it.
  - >-
    THE RECONCILIATION FINDING THAT GOAL-DREG-001'S REMAINING BUDGET CANNOT CARRY
    A DECISION-GRADE INCREMENT. D6 may then recommend AMEND or REQUEST rather than
    OPEN. All three are equally reportable and nothing in this batch pushes toward
    OPEN.

  authoring_session_limits: >-
    THIS BATCH RECORD, ITS QUEUE AND ledger/handoffs/TASK-20260906-b44b88.yaml WERE
    WRITTEN BY A COORDINATOR SUBAGENT WITH READ, GREP, GLOB, WRITE AND EDIT AND NO
    BASH. It ran no git command, no tools/allocate_id.py, no
    tools/validate_ledger.py, no tools/research_dispatch.py and no hashing tool,
    and none is recorded as having been run. IT MINTED NO IDENTIFIER, COMPUTED NO
    SHA256, MEASURED NO TIMING AND ASSERTED NO COMMIT SHA. Every dispatcher
    behaviour relied on is cited by file, function and line so the next reader can
    re-check it; the SHAPE was verified by the driving session against
    validate_queue at HEAD 84fbc464c, and THE QUEUE AS WRITTEN IS UNVALIDATED UNTIL
    THAT SESSION RE-RUNS THE DISPATCHER. DEC-20260906-dc6694, TASK-20260906-b44b88
    and the unspent BATCH-992800 were minted and `--check`ed free by the driving
    session before this task ran and are used exactly as bound; BATCH-002 was
    minted by neither, being already named by the committed handoff and the goal
    head.

  reserved_and_unspent_identifiers: >-
    BATCH-992800 WAS ALLOCATED BY THE DRIVING SESSION AND IS DELIBERATELY NOT
    SPENT. It names nothing in this batch and must never be silently reused: an
    identifier allocated but unspent is indistinguishable from a free one unless a
    committed record says otherwise, and DEC-20260906-dc6694
    `identifier_hygiene.allocated_and_not_spent` is that record. NO EV-*, DEC-*,
    KN-* OR EXP-* IDENTIFIER IS PRE-ALLOCATED FOR THIS BATCH, because no evidence
    record is filed, no experiment contract frozen and no knowledge entry promoted
    -- so the closing decision named in DEC-20260906-dc6694 N-3 will need an
    identifier this batch did not reserve. THAT CONSTRAINT IS NAMED HERE RATHER
    THAN DISCOVERED THERE.

  rule_12_status: >-
    NOT APPLICABLE AND NOT WAIVED. AGENTS.md rule 12 governs a claimed
    breakthrough, a proposed closure, or a contradiction of validated evidence.
    This batch is none of the three: it dispatches a read of committed records. No
    review is run, no independence is claimed, and no attestation is recorded
    because none was obtained. If D6 recommends OPEN, the successor MEASUREMENT
    batch inherits the full independent Validator and Red Team requirement, which
    nothing here waives.

  inference_provenance:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    reasoning_effort_basis: >-
      Bound by .claude/agents/coordinator.md `effort: high`, which
      orchestration/roles.yaml derives for role coordinator via default_policy
      coordinator-orchestration-code. Honoured by the runtime binding rather than
      asserted here.
    fallback_used: false
    fallback_allowed: false
    degraded_allowed: false
    model_verified: false
    model_verified_reason: >-
      No adapter probe receipt exists for this session and AUTORESEARCH_POLICY /
      AUTORESEARCH_BACKEND are unset. Recorded as unverified rather than asserted.
    attestations_recorded: >-
      NONE. This opening obtained no attestation from any model or session and
      records none. No completion_quorum block exists here and none is claimed; no
      goal transition is made by this opening.
