audit_plan:
  id: AUDITPLAN-TASK-20260824-ad822c
  task_id: TASK-20260824-ad822c
  goal_id: GOAL-SCURVE-9eb661
  research_question_id: RQ-SCURVE-8ee4ea
  curve: Curve1174
  produced_by: idea-generator
  produced_at: '2026-08-25'
  status: proposed (planning only; no experiment approved, no experiment run)
  reused_internal_lane:
    id: IDEA-20260807-98a970
    reuse: >-
      Lanes L05 (transfer) and A4 (embedding degree) SPECIALIZE that record's
      certified embedding-degree audit to Curve1174 and its twist. Its
      certificate formats (exact-k chain of witnesses; lower-bound k > K by K
      modular multiplications), its three degenerate checks (p = 1 mod l,
      l = p, l^2 | #E), its planted-positive battery and its K-decay control are
      adopted verbatim rather than re-invented. No duplicate mechanism proposal
      is minted.

  claim_boundaries_restated:
    - No lane in this plan runs a curve attack. Nothing here computes or attempts a discrete logarithm on a real instance.
    - No lane may conclude that Curve1174 is safe, unsafe, vulnerable, or free of vulnerabilities. Lanes report certificates, bounds, and disagreements.
    - Every SafeCurves True/False cell is a preregistered comparison target, never evidence, and the staged mirror does not change that.
    - >-
      Curve1174 was introduced by the SafeCurves work itself, so the mirror and
      the intake table are NOT INDEPENDENT. Agreement between them is a
      transcription check on the intake. No lane may report that agreement as
      corroboration.
    - A failure of rigidity, ladder availability, completeness, or indistinguishability is not by itself an ECDLP break.
    - Infrastructure errors, timeouts, unavailable dependencies and budget stops are operational observations, never mathematical evidence.
    - Only public parameters and generated controls are used. No live private key is tested, requested, stored, or derived.

  # ===========================================================================
  # OBJECT-FIRST FRAMING AND THE LOSSY-PROJECTION TEST
  # (docs/inventor-protocol.md sections 1-2; applied before any experiment)
  # ===========================================================================
  object_first:
    honest_preamble: >-
      This is a parameter audit, not an attack-family search. The eleven
      criteria are established, published diagnostics; the tracked objects
      below are chosen for MEASURABILITY and CERTIFIABILITY, and none of them
      is claimed to be a new attack lens. The program has no written
      object-enumeration for the ECDLP (KN-OPEN-019), so nothing here should be
      read as a taxonomy.
    tracked_objects:
      - id: OBJ-1
        object: >-
          The integer pair (p, l) alone, stripped of the curve: everything the
          curve is reduced to two integers.
        used_by: [L05, A4]
        lossy_projection_test: >-
          PASSES. d, the base point, the cofactor, the model and the generation
          seed are all discarded and none is recoverable from (p, l). What
          survives propagates compatibly with the operations that matter:
          ord_l(p) is CONSTANT under F_p-isogeny (p and l are class
          invariants), maps to k/gcd(k,m) under base change to F_{p^m}, and
          must be recomputed only when the subgroup changes. This is not a
          change of coordinates.
      - id: OBJ-2
        object: >-
          The pair (t, D): trace and CM field discriminant, i.e. the curve
          collapsed to its Frobenius and the imaginary quadratic field the
          endomorphism ring sits in.
        used_by: [L06, A3, A5]
        lossy_projection_test: >-
          PASSES for D, PARTIALLY for t. D is an isogeny-class-and-field
          invariant: every curve F_p-isogenous to Curve1174 has the same D, and
          the model (Edwards / Montgomery / Weierstrass) is invisible to it. t
          is preserved by F_p-isogeny and NEGATED by quadratic twisting, which
          is a deterministic and therefore compatible action. The conductor
          f (with t^2-4p = f^2 D_K) is discarded by D alone and must be tracked
          separately when the question is about the order rather than the field
          - lane A5 records this explicitly rather than conflating them.
      - id: OBJ-3
        object: >-
          The small-torsion profile of the pair (E, E'): the multiset of orders
          of points of order dividing 4 on the curve and on its quadratic
          twist, together with (h, h').
        used_by: [L08, L09, L10, A2]
        lossy_projection_test: >-
          PASSES. The full group structure above the cofactor is discarded, and
          l, l' and every large-order point are invisible. What is retained
          propagates deterministically under the single-coordinate ladder,
          because the ladder acts identically on E and E' and the small-order
          points are exactly the ones an attacker can exhaust.
      - id: OBJ-4
        object: >-
          The generation TRANSCRIPT as a program: an ordered list of
          constraints plus a claimed unique output.
        used_by: [L07, A8]
        lossy_projection_test: >-
          PASSES, and this is the least obvious of the four. The transcript
          discards every numeric property of the resulting curve and keeps only
          the DECISION SEQUENCE. It propagates deterministically because
          re-running the constraints must reproduce the same output; a
          transcript whose replay yields a different curve, or yields several,
          has lost the property it claims. This is the only object here that
          can be falsified by a computation costing under a second.
    not_claimed_novel: >-
      None of OBJ-1..OBJ-4 is proposed as new. They are the standard objects of
      published curve validation. What this plan contributes is that each is
      given a certificate format, a control battery and a falsifier inside this
      program's ledger, where the corpus currently holds none of these values.

  # ===========================================================================
  # CONTROL BATTERY - RUN BEFORE BELIEF IN ANY LATER TASK
  # ===========================================================================
  control_battery:
    binding_rule: >-
      Stage 0 is a HARD GATE. If any positive control fails to fire through the
      identical code path used for Curve1174, every result in every lane
      downstream is VOID and nothing is reported as a measurement. An
      instrument that has never been shown to fire cannot certify a negative.
    positive_controls:
      - id: POS-1
        object: 'The Anomalous curve (SafeCurves row "Anomalous")'
        sourced_from: >-
          pages/field.txt, equation.txt, base.txt, disc.txt, transfer.txt,
          index.txt of the staged mirror. Its parameters are UNVERIFIED intake
          in exactly the same sense as Curve1174's and must be re-verified
          before use, per the goal's claim_boundaries.
        must_fire_for:
          - L05 additive transfer (mirror prints 'Safe against additive transfer? False'; the printed trace is 1, so l = p is the expected trigger)
          - L06 small |D| (mirror prints D = -11, approximately -2^3.5, '|D| above 2^100? False')
          - L08 ladder absent (mirror prints 'Montgomery ladder? False')
          - L09 twist insecure (mirror prints combined-attack cost 2^53.5, twist-rho cost 2^53.2, both 'False')
          - L10 completeness absent (mirror prints 'False/False', 0 points of order 2, 0 of order 4)
          - L11 indistinguishability absent (mirror prints 'Elligator 2: No.')
        pass_condition: every listed detector returns the trigger, using the same code path as Curve1174.
      - id: POS-2
        object: 'BN(2,254)'
        sourced_from: pages/transfer.txt, disc.txt, twist.txt, index.txt
        must_fire_for:
          - L05 multiplicative transfer (mirror prints embedding degree 12, 'Safe against multiplicative transfer? False')
          - L06 small |D| (mirror prints D = -3, approximately -2^1.6)
        pass_condition: the embedding-degree routine returns exactly 12 and the discriminant routine returns exactly -3.
      - id: POS-3
        object: 'Synthetic planted small-k curves (from IDEA-20260807-98a970 null_object_control)'
        construction: >-
          (a) a toy curve with p = 1 mod l, for which k = 1; (b) a toy
          supersingular curve with t = 0, for which p^2 = 1 mod l and k = 2;
          (c) a toy BN-shaped curve with k = 12. Generated in-task, no
          external source needed.
        must_fire_for: [L05, A4]
        pass_condition: the routine returns exactly 1, exactly 2 and exactly 12 respectively.
      - id: POS-4
        object: 'NIST P-224 as a non-rigid generation transcript'
        sourced_from: >-
          pages/rigid.txt, which prints for NIST P-224 'manipulatable' and
          'Coefficients generated by hashing the unexplained seed bd713447
          99d5c7fc dc45b59f a3b9ab8f 6a948bc5.'
        must_fire_for: [L07, A8]
        pass_condition: >-
          the transcript-replay auditor reports UNEXPLAINED-INPUT-PRESENT and
          declines to reproduce the coefficients from stated constraints alone.
          A transcript auditor that reports NIST P-224 as fully explained has
          no resolving power and voids L07 and A8.
    parameter_matched_negative_controls:
      - id: NEG-1
        object: E-222
        matching_assumptions_stated_in_full: >-
          MATCHES Curve1174 on: Edwards shape x^2+y^2 = 1+dx^2y^2; small
          integer d; prime of the form 2^e - c with small c; cofactor 4; twist
          cofactor 4 (all read from mirror equation.txt, field.txt, twist.txt).
          DOES NOT MATCH on: size (222-bit vs 251-bit prime), sign of d
          (+160102 vs -1174), designer (2013 Aranha-Barreto-Pereira-Ricardini
          vs 2013 Bernstein-Hamburg-Krasnova-Lange), and p mod 4 (unchecked
          here; Elligator 1 needs 3 mod 4 and this is a lane A8/L11 question,
          not an assumption).
        used_as_negative_for: [L01, L02, L03, L04, L05, L06, L08, L09, L10, A1, A2, A3, A5, A6, A7]
        expected_behavior: the tested weakness does NOT trigger.
        honest_limitation: >-
          Because E-222 is 29 bits smaller, it is NOT size-matched for any
          threshold lane (L04, L09). For those lanes the size mismatch is
          reported alongside the result and the negative control is
          demoted to a shape control.
      - id: NEG-2
        object: M-221
        used_as_negative_for: [L07, A8]
        rationale: >-
          pages/rigid.txt prints for M-221 'fully rigid' with a fully stated,
          replayable transcript: 'p is largest prime smaller than 2^221; B=1;
          A > 2 is as small as possible.' That is a transcript the auditor can
          actually re-run, which is what a negative control for L07 requires.
        expected_behavior: transcript replay reproduces M-221 uniquely; auditor reports EXPLAINED.
        observation_for_the_executor: >-
          E-222 is printed 'fully rigid' in rigid.txt with an EMPTY rationale
          in the extracted text (nothing appears between the E-222 row and the
          NIST P-224 row). Before using E-222 anywhere in L07/A8, check
          pages/rigid.html (sha256
          503df9ebf177adc98b9aee9518721d322cbfe463d7bf1ec8dfd8eab9d1f177ad)
          to determine whether the cell is genuinely empty upstream or whether
          the tag-strip dropped it. This is a fidelity question about the
          mirror, not a finding about E-222.
      - id: NEG-3
        object: Curve25519
        used_as_negative_for: [L08, L11]
        rationale: >-
          Montgomery model with a printed 'Montgomery ladder? True' and
          'Elligator 2: Yes.'; nearest large-prime-field ladder/indistinguish-
          ability comparator (255-bit vs 251-bit).
        honest_limitation: cofactor 8 vs Curve1174's 4; not cofactor-matched.
    same_shape_null_controls:
      binding_rule: >-
        A null object must have the SAME SHAPE and the tested structure
        DELIBERATELY REMOVED, and it must be run through the identical code
        path. A quantity that fails to decay when the parameter meant to
        destroy it increases is the canonical artifact tell.
      - id: NULL-1
        name: random-d Edwards curves over the SAME prime
        construction: >-
          Over p = 2^251 - 9, draw d deterministically from a seeded PRF
          (seed and index recorded), reject d that is a square in F_p when the
          lane needs completeness retained, and otherwise accept whatever curve
          arises. Sample size 100, seeds recorded.
        structure_removed: >-
          The DESIGN. These curves were not chosen to have order 4*prime, not
          chosen for twist security, not chosen for Elligator 1, and not chosen
          for small |d|. Everything Curve1174 was selected for is gone; the
          field, the shape and the coefficient size distribution remain.
        used_by: [L03, L04, L06, L09, L10, A1, A2, A3, A5]
        expected_behavior: >-
          Cofactor structure spread over the possible values rather than pinned
          at 4; twist cofactors typically NOT 4; |D| large for essentially all
          samples. A detector that reports Curve1174-like structure on random d
          is measuring nothing.
      - id: NULL-2
        name: shuffled-digit parameters
        construction: >-
          Take p, l, t and D and permute their decimal digits under a recorded
          seed; feed the results to the same self-consistency checkers.
        structure_removed: the arithmetic relations among the parameters.
        used_by: [L01, L02, L03, A1]
        expected_behavior: >-
          Every self-consistency check FAILS. A checker that passes a shuffled
          tuple is not checking the identity it claims to check. This is the
          cheapest available proof that the L01-L03 checks have teeth.
      - id: NULL-3
        name: K-decay control for the embedding-degree search
        construction: sweep the lower-bound search bound K over 10^2, 10^3, 10^4, 10^5, 10^6.
        structure_removed: none; this is a decay-parameter control on the instrument.
        used_by: [L05, A4]
        expected_behavior: >-
          The set of objects not yet excluded shrinks monotonically to exactly
          the planted positives and then stops changing. A curve that appears
          at one K and disappears at a larger K indicates a modular-arithmetic
          bug and voids the lane.
      - id: NULL-4
        name: transcript-replay null
        construction: >-
          Feed the L07/A8 transcript auditor a transcript with one constraint
          DELETED (for example, drop 'prime 3 mod 4') and one with a constraint
          NEGATED.
        structure_removed: the uniqueness of the transcript's output.
        used_by: [L07, A8]
        expected_behavior: >-
          The deleted-constraint transcript must yield MORE THAN ONE admissible
          output and the auditor must report NON-UNIQUE. An auditor that still
          reports a unique output is reproducing an answer it was given rather
          than deriving one.

  # ===========================================================================
  # EXECUTION ORDER AND GATING
  # ===========================================================================
  execution_order:
    - stage: 0
      name: instrument controls
      contents: [POS-1, POS-2, POS-3, POS-4, NULL-2, NULL-3, NULL-4]
      gate: HARD. No lane result is reported unless stage 0 passes in full.
    - stage: 1
      name: basic parameter requirements
      contents: [L01, L02, L03]
      gate: L03 must pass before any lane that consumes l as a group order.
    - stage: 2
      name: ECDLP security requirements
      contents: [L04, L05, L06]
    - stage: 3
      name: ECC security beyond ECDLP
      contents: [L07, L08, L09, L10, L11]
    - stage: 4
      name: additional diagnostics
      contents: [A1, A2, A3, A4, A5, A6, A7, A8]
  environment_assumption:
    statement: >-
      Cost figures below assume pure-Python big-integer arithmetic with no
      computer-algebra system, carried over from IDEA-20260807-98a970's
      recorded environment assumption.
    if_false: >-
      If a CAS is available the factorization-dependent lanes (A1, A4, A5) move
      from BOUNDED to EXACT and the plan should be re-costed. That is a
      capability change to record, not a result.
    honest_note: >-
      This assumption was NOT verified in this task; the idea-generator role
      holds no Bash. The Executor confirms or corrects it in its run record.

  # ===========================================================================
  # THE ELEVEN CRITERION LANES
  # ===========================================================================
  lanes:

    - id: L01
      criterion: field
      category: basic_parameter_requirements
      tracked_object: OBJ-1
      question: Is p prime and is the field a prime field?
      preregistered_target: 'intake field=true; mirror field.txt prints "p prime? True" (non-independent pair)'
      mechanism: >-
        SafeCurves requires prime fields (field.txt). The audit re-derives p
        from its stated form 2^251-9, checks it equals both the printed decimal
        and the printed hex, and proves primality.
      method:
        - Compute 2^251 - 9 and compare for exact equality against the transcribed decimal AND the transcribed hex. Three-way agreement or FAIL.
        - Baillie-PSW probable-prime test as a screen.
        - >-
          Primality PROOF via the N+1 (Morrison / Brillhart-Lehmer-Selfridge)
          route: p+1 = 2^251 - 8 = 2^3 * (2^248 - 1), and 2^248-1 is a
          Mersenne-type number whose algebraic factors 2^d - 1 for d | 248
          split off by direct division. Attempt a complete factorization of
          2^248-1 from its algebraic factors plus trial division and ECM on the
          primitive parts, then emit a Lucas-sequence certificate.
        - 'Fallback if the N+1 factorization is incomplete: ECPP, or an explicit statement of the largest certified factored part of p+1 and the resulting partial-certificate strength.'
      certificate:
        form: >-
          A chain: (i) the identity 2^251 - 9 = p as an exact integer equality;
          (ii) the factorization of p+1 with a primality proof per factor;
          (iii) Lucas-sequence witnesses. Recursively verifiable.
        verification_cost: 'seconds; O(number of distinct prime factors of p+1) exponentiations'
        fallback_bound: >-
          If the factorization is incomplete, report 'p is a BPSW probable
          prime and the factored part of p+1 exceeds p^{1/3}' (or whatever
          fraction is achieved) as a BOUND, labelled as such, never as a proof.
      quantitative_prediction:
        metric: outcome of the three-way form/decimal/hex equality check
        direction: different
        value: 'exact agreement expected on all three; any mismatch is a transcription error to be recorded, not silently corrected'
      controls:
        positive: 'POS-1 (Anomalous p, also prime) exercises the same path; additionally feed a known composite of similar size, which must be REJECTED'
        negative: NEG-1 (E-222, p = 2^222-117)
        'null': NULL-2 (digit-shuffled p must fail the equality check and, with overwhelming probability, the primality test)
      budget: {cpu_seconds: 600, memory_gb: 1}
      stopping_rule: >-
        Stop at 600 s. If the N+1 certificate is incomplete at that point,
        record the partial certificate and its exact strength. A budget stop is
        an operational observation, never evidence that p is not prime.
      falsifier: >-
        p not equal to 2^251-9; or the decimal and hex transcriptions
        disagreeing; or a nontrivial factor of p being found. Any of these
        supersedes the parameter capsule.
      honest_limitation: >-
        Proving p prime says nothing about the curve. It is a precondition
        check whose only surprise value is catching a transcription error in a
        single-sourced tuple (capsule gap G1).

    - id: L02
      criterion: equation
      category: basic_parameter_requirements
      tracked_object: 'the coefficient d and the quantity d(1-d)'
      question: Is x^2+y^2 = 1-1174x^2y^2 an elliptic curve over F_p, and is it a COMPLETE Edwards curve?
      preregistered_target: 'intake equation=true; mirror equation.txt prints "Elliptic? True" with quantity 3618502788666131106986593281521497120414687020801267626233049500247283921789'
      mechanism: >-
        equation.txt requires d(1-d) nonzero in F_p for ellipticity and
        additionally requires 'd to not be a square' for completeness.
      method:
        - Compute d(1-d) mod p for d = -1174 and compare for exact equality with the transcribed value.
        - Compute the Legendre symbol (d | p) by Euler's criterion d^((p-1)/2) mod p, and independently by the quadratic-reciprocity Jacobi algorithm. Two independent routes must agree.
      certificate:
        form: >-
          (i) the integer d(1-d) mod p with the arithmetic reproducible in one
          line; (ii) the value d^((p-1)/2) mod p, which must be p-1 for a
          non-square; (iii) the Jacobi symbol computed by a disjoint algorithm.
        verification_cost: milliseconds
      quantitative_prediction:
        metric: 'Legendre symbol (d | p)'
        direction: different
        value: >-
          -1 expected (a non-square d, hence a complete Edwards curve),
          because completeness is a stated SafeCurves requirement and the
          mirror prints complete=True. +1 would place the mirror's own
          equation and complete cells in contradiction and is the informative
          outcome.
      controls:
        positive: 'a deliberately square d over the same p, which must return +1 and be flagged NOT COMPLETE'
        negative: NEG-1 (E-222, d = +160102)
        'null': NULL-1 (100 random d over the same p; the Legendre symbol must be near-evenly split between +1 and -1; a routine returning -1 for nearly all d is broken)
      budget: {cpu_seconds: 10, memory_gb: 1}
      stopping_rule: single deterministic computation; no retry.
      falsifier: 'd(1-d) = 0 mod p; or the two Legendre routes disagreeing; or (d|p) = +1'
      honest_limitation: >-
        Ellipticity and completeness of the EQUATION say nothing about the
        group order or about any implementation's addition law (see L10 and A7).

    - id: L03
      criterion: base
      category: basic_parameter_requirements
      tracked_object: 'the point (x_1, y_1) and the integer l'
      question: Does the stated base point lie on the curve, and does it have exactly the stated prime order l?
      preregistered_target: 'intake base=true; mirror base.txt prints "(x_1,y_1) on curve? True", "l prime? True", "l(x_1,y_1) = 0? True"'
      mechanism: >-
        base.txt requires a base point of prime order l. Order is certified by
        l*P = identity together with l prime and P not the identity, which
        forces ord(P) = l exactly.
      method:
        - Evaluate x_1^2 + y_1^2 - 1 + 1174 x_1^2 y_1^2 mod p and require exactly 0.
        - Check the decimal and hex transcriptions of x_1 and y_1 agree.
        - Compute l*P with the complete Edwards addition law and require the identity (0,1).
        - Prove l prime (see A1). Check P is not the identity and P has order neither 1 nor 2 nor 4.
        - 'Independent cross-check: verify 4*l lies in the Hasse interval [p+1-2 sqrt(p), p+1+2 sqrt(p)] and is the UNIQUE multiple of l there, which per disc.txt forces #E = 4l.'
      certificate:
        form: >-
          (i) the on-curve residue, which must be 0; (ii) the scalar-
          multiplication result l*P = (0,1); (iii) the primality certificate
          for l from A1; (iv) the Hasse-uniqueness arithmetic. Verifiable in
          well under a second by a third party.
        verification_cost: 'about 250 doublings plus additions in F_p; milliseconds'
      quantitative_prediction:
        metric: number of multiples of l inside the Hasse interval
        direction: different
        value: >-
          exactly 1 expected (which is what makes #E = 4l a certificate rather
          than an assertion). If 2 or more, the trace is not pinned by the base
          point alone and L06/A5 must obtain t by a separate route; that
          outcome would be recorded, not worked around.
      controls:
        positive: 'a point deliberately perturbed in the last limb, which must FAIL the on-curve test; and a point of order 4l, which must FAIL the prime-order test'
        negative: NEG-1 (E-222 base point and its l)
        'null': NULL-2 (digit-shuffled base point must fail the on-curve test)
      budget: {cpu_seconds: 120, memory_gb: 1}
      stopping_rule: deterministic; a single pass.
      falsifier: 'nonzero on-curve residue; l*P not the identity; l composite; more than one multiple of l in the Hasse interval'
      honest_limitation: >-
        This certifies the order of ONE point in ONE subgroup. It says nothing
        about #E beyond the Hasse-uniqueness argument, and nothing about the
        twist (L09).

    - id: L04
      criterion: rho
      category: ecdlp_security_requirements
      tracked_object: 'the single integer l'
      question: Is l at least 2^200, and what is 0.886*sqrt(l)?
      preregistered_target: >-
        intake rho=true; mirror rho.txt column header 'Cost for rho above
        2^100?' prints True with cost 2^124.3, under the stated requirement
        'SafeCurves requires l to be at least 2^200'
      mechanism: >-
        rho.txt states the rho method costs on average approximately
        0.886*sqrt(l) additions, with 0.886 = sqrt(pi/4), the additions being
        batched affine short-Weierstrass additions. The criterion is a size
        test on a certified prime.
      method:
        - Compute log2(l) exactly enough to compare against 200 (integer comparison l >= 2^200, no floating point in the decision).
        - Compute 0.886*sqrt(l) in exact rational/integer arithmetic and report log2 of it to one decimal place.
        - Compare the reported exponent against the mirror's printed 2^124.3 and record any disagreement in the last digit as a rounding-convention note, not a finding.
      certificate:
        form: >-
          The primality certificate for l from A1, plus two integer
          comparisons: l >= 2^200, and the bracketing integers below and above
          0.886*sqrt(l). No floating-point value is load-bearing.
        verification_cost: microseconds
      quantitative_prediction:
        metric: floor(log2 l)
        direction: higher
        value: >-
          248 expected, from the transcribed form l = 2^249 - (a 125-bit
          number), which puts l above 2^200 by 48 bits or more. A value below
          200 would contradict the mirror's own printed l and is the
          informative outcome.
        second_metric: log2(0.886*sqrt(l)), predicted 124.3 +/- 0.1
      controls:
        positive: 'POS-1 (Anomalous, printed 2^101.6 - above 2^100 yet the mirror still marks the curve unsafe overall, which is exactly the discrimination this lane must not blur)'
        negative: NEG-1 (E-222, printed 2^109.8) - NOT size-matched; see NEG-1 honest_limitation
        'null': NULL-1 (random-d curves over the same p; their largest prime subgroup order must be distributed, not pinned at 2^249)
      budget: {cpu_seconds: 60, memory_gb: 1}
      stopping_rule: deterministic.
      falsifier: 'l < 2^200; or the computed 0.886*sqrt(l) exponent differing from 124.3 by more than 0.1'
      honest_limitation: >-
        This is a SIZE test against a published generic cost model. It measures
        no attack, and a pass says only that generic rho is expensive. Every
        non-generic route is the subject of L05, L06, A3 and A4. Note also that
        POS-1 passes this same lane, which is the clearest demonstration
        available that a rho pass carries no overall verdict.

    - id: L05
      criterion: transfer
      category: ecdlp_security_requirements
      tracked_object: OBJ-1
      question: Is l equal to p (additive transfer), and what is the embedding degree, exactly or as a certified lower bound?
      preregistered_target: >-
        intake transfer=true; mirror transfer.txt prints 'Safe against additive
        transfer? True', 'Safe against multiplicative transfer? True', and an
        embedding degree printed as (l-1)/1
      reuses: IDEA-20260807-98a970
      mechanism: >-
        transfer.txt: additive transfer applies when l = p; degree-k
        multiplicative transfer applies when l divides p^k - 1; the minimum
        such k is the embedding degree, i.e. k = ord_l(p).
      method:
        - 'Degenerate checks, three modular reductions: l vs p (anomalous); p mod l (flag if 1, i.e. k = 1); whether l divides h, i.e. whether l^2 | #E (full rational l-torsion).'
        - 'Lower-bound pass: compute p^j mod l for j = 1..K with K = 10^6, recording the smallest j with p^j = 1 if any.'
        - >-
          Exact pass, best effort: attempt the complete factorization of l-1
          using the primes listed for Curve1174 in pages/primeproofs.txt as a
          CANDIDATE-FACTOR HINT, then recover k by the standard order algorithm
          (divide out prime powers, one exponentiation per prime factor).
        - >-
          Report the REPRESENTABILITY WALL alongside k or its bound: one element
          of F_{p^k} occupies k*ceil(log2 p) bits, which is the binding
          obstruction at large k independently of any index-calculus cost model.
      certificate:
        exact_form: >-
          The complete factorization l-1 = prod r_i^{e_i} with a primality
          proof per r_i, plus the witness p^{(l-1)/r_i} mod l for each i. If
          every witness differs from 1 then k = l-1 exactly. Verification is at
          most omega(l-1) modular exponentiations.
        bound_form: >-
          'k > K', certified by the assertion that p^j is not 1 mod l for all
          j <= K. HONESTLY NOT SUCCINCT: verifying it costs K modular
          multiplications, the same as producing it. The record must say so.
        hint_independence: >-
          Using the primeproofs list as a hint does not import its authority.
          The certificate is self-verifying: the product identity must hold
          exactly and every factor must carry its own primality proof. A wrong
          hint makes verification fail; it cannot make a false certificate pass.
      quantitative_prediction:
        metric: embedding degree k of the order-l subgroup
        direction: higher
        value: >-
          k > 10^6 expected from the bound pass; k = l-1 expected exactly if
          l-1 factors, matching the mirror's printed (l-1)/1. A k below 10^6,
          or l = p, or p = 1 mod l, or l^2 | #E, would each be a material
          finding requiring independent review-breakthrough scrutiny before any
          statement leaves this repository.
      controls:
        positive: 'POS-1 (additive, l = p must fire), POS-2 (BN(2,254), must return exactly 12), POS-3 (planted k = 1, k = 2, k = 12)'
        negative: NEG-1 (E-222, printed (l-1)/1)
        'null': NULL-3 (K-decay sweep 10^2..10^6; the not-yet-excluded set must shrink to the planted positives and then stop changing)
      budget: {cpu_seconds: 1800, memory_gb: 2}
      stopping_rule: >-
        The K = 10^6 bound pass is the deliverable. Abandon the l-1
        factorization at 1500 s and report a BOUNDED row with the reason. A
        bounded row is an honest environment measurement, not a shortfall.
      falsifier: >-
        Any of: k <= 10^6; l = p; p = 1 mod l; l^2 | #E; or the exact pass
        returning a k that does not divide l-1.
      honest_limitation: >-
        A certified 'k > 10^6' is a BOUND, not a value. Reporting it as 'k is
        about l' would overstate the certificate. The lane is scoped to
        transfers only and says nothing about rho, index calculus, or
        implementation attacks.
      unresolved_definitional_gap: >-
        See parameter-capsule retrieved_thresholds.transfer.threshold_gap_flag.
        No numeric SafeCurves embedding-degree bar was found in the retrieved
        text, so this lane reports k or its bound and does NOT adjudicate a
        pass against an unquoted threshold.

    - id: L06
      criterion: disc
      category: ecdlp_security_requirements
      tracked_object: OBJ-2
      question: Is |D| larger than 2^100?
      preregistered_target: >-
        intake disc=true; mirror disc.txt prints '|D| above 2^100? True' with
        D approximately -2^250.8 and t = 45330879683285730139092453152713398836
      mechanism: >-
        disc.txt defines D from t^2-4p by removing the largest square divisor
        s^2 and adjusting by 4 when the quotient is not 1 mod 4, and requires
        |D| > 2^100.
      method:
        - 'Obtain t independently of the printed value: t = p + 1 - #E with #E = 4l pinned by the Hasse-uniqueness argument of L03. Compare against the printed t. Disagreement is a finding.'
        - Compute N = t^2 - 4p exactly and confirm N < 0.
        - >-
          SHORT RIGOROUS ROUTE, the main contribution of this lane. Exhibit a
          single prime q with q dividing N EXACTLY ONCE (q | N and q^2 does not
          divide N) and q > 2^100. Then q does not divide s, so q divides D,
          hence |D| >= q > 2^100. This certifies the criterion WITHOUT any
          complete factorization of N.
        - >-
          Candidate q from the printed factorization in disc.txt, used as a
          HINT only: 161567415114024992333870349255799, which is above 2^100
          if its primality and exact-once divisibility both verify. The
          certificate does not depend on the rest of the printed factorization
          being right.
        - 'Secondary, best effort: attempt the complete factorization of N (trial division to 10^7, then ECM), compute s^2 and D exactly, check D mod 4 and the sign, and compare with the printed D.'
      certificate:
        form: >-
          (i) the integer N = t^2-4p; (ii) the prime q with a primality proof;
          (iii) the two divisions showing q | N and q^2 not | N; (iv) the
          comparison q > 2^100. Four lines, verifiable in milliseconds.
        why_this_is_better_than_the_obvious_route: >-
          The obvious route factors N completely, which is a 250-bit
          factorization and may not finish in this environment. The exact-once
          prime route is rigorous, short, and independent of whether the rest
          of N factors at all. It is the cheapest valid discriminator for this
          criterion.
      quantitative_prediction:
        metric: log2 of the certified lower bound on |D|
        direction: higher
        value: >-
          at least 100 expected, and about 107 from the candidate q above.
          The full-factorization route, if it finishes, is predicted to give
          log2|D| = 250.8 +/- 0.1. Failure to find ANY exact-once prime above
          2^100 would leave the criterion UNCERTIFIED here (not refuted), and
          that outcome must be reported as uncertified rather than assumed.
      controls:
        positive: 'POS-1 (Anomalous, D = -11, must be certified SMALL and must NOT yield an exact-once prime above 2^100), POS-2 (BN(2,254), D = -3)'
        negative: NEG-1 (E-222, printed approximately -2^222.0)
        'null': >-
          NULL-1 (100 random-d curves over the same p). For each, run the same
          detector. Predicted: |D| large for essentially all of them, because
          large |D| is generic. THIS IS THE KEY NULL - it establishes that a
          large-|D| result is NOT a property of Curve1174's design but of
          almost any curve, which bounds how much the disc cell can be read to
          mean. DECAY PARAMETER: the trial-division bound B from 10^3 to 10^7;
          the certified lower bound on |D| must be non-decreasing in B.
      budget: {cpu_seconds: 1200, memory_gb: 2}
      stopping_rule: >-
        The exact-once prime certificate is the deliverable and should complete
        in seconds. Abandon the complete factorization of N at 900 s and report
        the certified bound plus the partial factorization achieved.
      falsifier: >-
        The independently derived t differing from the printed t; or no
        exact-once prime above 2^100 being found while the complete
        factorization also fails (which yields UNCERTIFIED); or a completed
        factorization giving |D| <= 2^100.
      honest_limitation: >-
        disc.txt itself states that small |D| is 'not a complete break' and
        that the concern is that 'the security story is more complicated'. A
        large-|D| certificate therefore closes a specific known speedup family
        (see A3) and nothing wider. And per the null control, large |D| is
        generic, so this cell carries less design-specific information than its
        prominence suggests.

    - id: L07
      criterion: rigid
      category: ecc_security_beyond_ecdlp
      tracked_object: OBJ-4
      question: Does the published generation transcript, replayed from its stated constraints alone, reproduce Curve1174 uniquely?
      preregistered_target: 'intake rigid=true; mirror rigid.txt prints "fully rigid" with the transcript quoted in the parameter capsule'
      mechanism: >-
        Rigidity is a property of a PROCESS, not of a curve. rigid.txt defines
        four levels by how much unexplained input the process takes. The audit
        treats the transcript as a program and re-runs it.
      method: 'See A8, which is the executable form of this lane. L07 is the criterion-level report; A8 is the computation.'
      certificate:
        form: >-
          The replay transcript itself: for each stated constraint, the
          candidate set before and after, ending in a singleton equal to
          Curve1174. Plus an explicit count of unexplained input bits, which
          must be 0 for 'fully rigid'.
        verification_cost: seconds; the searches are over tiny sets.
      quantitative_prediction:
        metric: number of unexplained input bits in the replayed transcript
        direction: lower
        value: >-
          0 expected. Any positive count downgrades the level from 'fully
          rigid' and is a disagreement with the preregistered cell.
        second_metric: 'size of the admissible output set after all constraints; predicted exactly 1'
      controls:
        positive: POS-4 (NIST P-224, must be reported UNEXPLAINED-INPUT-PRESENT)
        negative: NEG-2 (M-221, must replay to a unique output)
        'null': NULL-4 (constraint-deleted transcript must yield NON-UNIQUE)
      budget: {cpu_seconds: 600, memory_gb: 1}
      stopping_rule: bounded by the A8 searches.
      falsifier: >-
        The replay yielding a curve other than Curve1174; or yielding more than
        one admissible curve; or a stated constraint turning out to be
        unfalsifiable as written.
      honest_limitation: >-
        A rigidity failure is NOT an ECDLP break, and a rigidity pass is not
        evidence of security. The claim boundary is stated in the goal record
        and repeated here because this lane is the one most likely to be
        over-read.

    - id: L08
      criterion: ladder
      category: ecc_security_beyond_ecdlp
      tracked_object: OBJ-3
      question: Does Curve1174 admit a simple, fast, constant-time single-coordinate ladder over F_p?
      preregistered_target: 'intake ladder=true; mirror ladder.txt prints "Montgomery ladder? True" with cofactor 2^2'
      mechanism: >-
        equation.txt gives the birational map from a complete Edwards curve to
        a Montgomery curve: substituting x = u/v and y = (u-1)/(u+1) yields
        Bv^2 = u^3 + Au^2 + u with A = 2(1+d)/(1-d) and B = 4/(1-d).
        complete.txt notes Montgomery-form curves always have order divisible
        by 4, consistent with the printed cofactor.
      method:
        - Compute A = 2(1+d)/(1-d) and B = 4/(1-d) in F_p for d = -1174, exactly.
        - Verify B(A^2-4) is nonzero in F_p (the ellipticity condition from equation.txt).
        - Implement the standard Montgomery ladder for that (A,B) and verify against L03's Edwards scalar multiplication on 1000 random scalars, comparing x-coordinates through the birational map.
        - Record the exceptional set of the birational map explicitly (see A6); it is where a naive conversion loses points.
        - Report constant-time structure as a STRUCTURAL property (single chain, fixed double-and-add pattern), not as a timing measurement.
      certificate:
        form: 'the pair (A,B) as exact field elements; the nonzero value B(A^2-4); and 1000 matched scalar-multiplication agreements with the independent Edwards implementation'
        verification_cost: 'about 1000 ladder runs; seconds'
      quantitative_prediction:
        metric: agreement rate between ladder x-coordinates and Edwards-derived x-coordinates on random scalars
        direction: higher
        value: '1000/1000 expected. Any mismatch localises to the birational map, its exceptional set, or one of the two implementations, and A6 says which.'
      controls:
        positive: 'POS-1 (Anomalous, printed "Montgomery ladder? False", cofactor 1; the conversion must FAIL to produce a Montgomery form over F_p, since ladder.txt states curves of prime or 2*prime order can never be converted)'
        negative: 'NEG-3 (Curve25519, native Montgomery) and NEG-1 (E-222, same Edwards-to-Montgomery route)'
        'null': 'a deliberately wrong A (off by one) must produce systematic disagreement; an agreement rate near 1000/1000 with a wrong A would mean the comparison is not comparing anything'
      budget: {cpu_seconds: 600, memory_gb: 1}
      stopping_rule: 'stop after 1000 comparisons or 600 s, whichever first; report the count actually run'
      falsifier: 'B(A^2-4) = 0; or any scalar-multiplication disagreement not explained by the recorded exceptional set'
      honest_limitation: >-
        ladder.txt defines 'fast' and 'simple' comparatively and explicitly
        declines to quantify: 'At this time there are no examples close enough
        to the edge to warrant quantification of "much".' This lane therefore
        certifies EXISTENCE and CORRECTNESS of a single-coordinate ladder, and
        reports simplicity/speed as structural observations only. It measures
        no wall-clock time and asserts no constant-time property of any real
        implementation.

    - id: L09
      criterion: twist
      category: ecc_security_beyond_ecdlp
      tracked_object: OBJ-3
      question: Is the combined small-subgroup-plus-invalid-curve attack cost above 2^100?
      preregistered_target: >-
        intake twist=true; mirror twist.txt prints 'Cost for combined attack
        above 2^100? True' at 2^123.3, 'Cost for twist rho above 2^100? True'
        at 2^124.3, cofactor 2^2, twist cofactor 2^2, twist l' =
        2^249 + 11332719920821432534773113288178349707, twist additive and
        multiplicative transfer both True
      mechanism: >-
        twist.txt specifies the combined attack: recover n mod h by exhaustion,
        n mod (the exhaustible part of h') by exhaustion, CRT them, then run a
        kangaroo attack on the remaining possibilities. The requirement is that
        the optimised total stay above 2^100.
      method:
        - Compute the twist order as p+1+t and verify it equals h'*l' for the transcribed h' and l'.
        - Prove l' prime (A1) and factor h' completely (h' is tiny).
        - >-
          Implement the twist.txt cost optimiser as a small program: over all
          ways of splitting the exhaustible small-order structure on E and E',
          minimise (exhaustion cost) + 0.886*sqrt(l / (product of exhausted
          moduli)). Report the minimising split and the cost, in exact
          arithmetic, as log2.
        - Report the twist rho cost 0.886*sqrt(l') separately.
      certificate:
        form: >-
          (i) the identity p+1+t = 4*l'; (ii) the primality certificate for l';
          (iii) the complete factorization of h and h'; (iv) the optimiser's
          full table of splits with the minimum marked, so a third party can
          re-check the minimum by reading rather than re-running.
        verification_cost: 'seconds; the optimiser table is small because h and h'' are'
      quantitative_prediction:
        metric: log2 of the optimised combined-attack cost
        direction: higher
        value: >-
          123.3 +/- 0.2 expected, matching the printed cell. Second metric:
          log2(0.886*sqrt(l')) predicted 124.3 +/- 0.1. A value below 100 would
          contradict the printed cell and is the informative outcome.
      controls:
        positive: 'POS-1 (Anomalous, printed combined 2^53.5 and twist rho 2^53.2, twist cofactor 3^3 * 5 * 47 * 4093 * 2013751 * 2376645121788851 - the optimiser MUST return a value near 2^53.5 on it, or it is not optimising)'
        negative: NEG-1 (E-222, printed cofactor 2^2 and twist cofactor 2^2) - shape-matched, NOT size-matched
        'null': >-
          NULL-1. For 100 random-d Edwards curves over the same p, run the same
          optimiser. Predicted: a broad spread of combined-attack costs, many
          well below 2^123, because twist security is a DESIGNED property. An
          optimiser that returns approximately 2^123 for random curves is
          measuring the field size and not the design.
      budget: {cpu_seconds: 1800, memory_gb: 2}
      stopping_rule: >-
        The optimiser and the cost table are the deliverable. If l' primality
        does not certify within budget, report the combined cost CONDITIONAL on
        l' prime and label it conditional.
      falsifier: 'p+1+t not equal to 4*l''; or l'' composite; or the optimised cost falling below 2^100; or the optimiser failing to reproduce POS-1''s printed 2^53.5 within 0.5'
      honest_limitation: >-
        The cost model is twist.txt's own and counts group operations under
        stated attacker assumptions (Bob chooses n only up to l, multiplies by
        no cofactor, checks no incoming point). It is a model, not a
        measurement, and no attack is run. The 2^100 bar is SafeCurves' choice,
        quoted, not endorsed.

    - id: L10
      criterion: complete
      category: ecc_security_beyond_ecdlp
      tracked_object: OBJ-3
      question: Do complete single-scalar and multi-scalar formulas exist for this curve, and what is the exact small-torsion count?
      preregistered_target: 'intake complete=true; mirror complete.txt prints True/True with 1 point of order 2 and 2 points of order 4'
      mechanism: >-
        complete.txt states that the Edwards addition law is complete for every
        complete Edwards curve, citing 2007 Bernstein-Lange, and that
        completeness of the curve does not guarantee completeness of a given
        addition law (the 2008 Hisil-Wong-Carter-Dawson dual law is named as a
        counterexample).
      method:
        - Consume L02's certificate that d is a non-square, which is the stated hypothesis of the completeness theorem.
        - Enumerate all points of order 2 and order 4 on the Edwards model directly by solving the defining equations in F_p, and compare the counts against the printed 1 and 2.
        - >-
          EXHAUSTIVE EXCEPTIONAL-CASE SEARCH over the small-torsion subgroup:
          evaluate the Edwards addition law on every pair drawn from the
          4-torsion together with a set of random points, and check for a zero
          denominator. Under the completeness theorem there must be none.
        - Repeat for the dual addition law, where exceptions ARE expected; this is the discriminating comparison (see A7).
      certificate:
        form: >-
          (i) the non-square certificate for d; (ii) the explicit list of
          2- and 4-torsion points with their coordinates; (iii) a zero count of
          denominator vanishings for the Edwards law over the tested set, with
          the tested set size stated; (iv) a NONZERO count for the dual law.
        verification_cost: seconds
      quantitative_prediction:
        metric: number of denominator vanishings of the Edwards addition law over the tested pair set
        direction: lower
        value: >-
          exactly 0 expected. Second metric: the dual addition law must produce
          MORE THAN 0, which is what shows the search can detect an exception
          at all. A search reporting 0 for BOTH laws has no resolving power and
          voids this lane.
        third_metric: 'points of order 2 = 1 and of order 4 = 2, predicted exactly'
      controls:
        positive: 'POS-1 (Anomalous, printed False/False with 0 points of order 2 and 0 of order 4 - short Weierstrass, where standard formulas fail on doubling per complete.txt) and the dual addition law as an in-family positive'
        negative: NEG-1 (E-222, printed True/True with 1 and 2)
        'null': 'a square d over the same p (an INCOMPLETE Edwards curve): the same search must find exceptional cases, and finding none would void the lane'
      budget: {cpu_seconds: 900, memory_gb: 1}
      stopping_rule: 'exhaustive over torsion; 10^5 random pairs, or 900 s'
      falsifier: 'any denominator vanishing for the Edwards law; or torsion counts differing from 1 and 2; or the dual law showing no exceptions'
      honest_limitation: >-
        A finite search cannot prove completeness; the PROOF is the cited
        2007 Bernstein-Lange theorem, whose hypothesis (d non-square) is what
        L02 certifies. This lane verifies the hypothesis and tests the
        implementation. It says nothing about any particular library's code.

    - id: L11
      criterion: ind
      category: ecc_security_beyond_ecdlp
      tracked_object: 'the pair (p mod 4, the shape of d)'
      question: Does an Elligator-style bijection apply to this curve, and which one?
      preregistered_target: 'intake ind=true; mirror ind.txt prints True with the note "Elligator 2: Yes."'
      mechanism: >-
        ind.txt states Elligator 1 requires p = 3 mod 4 and a complete Edwards
        curve with d of the form -(c+1)^2/(c-1)^2 where c = 2/s^2; Elligator 2
        works for any odd prime and any curve y^2 = x^3+Ax^2+Bx with nonzero
        AB(A^2-4B), and includes all Edwards curves except x^2+y^2 = 1-x^2y^2.
      method:
        - Compute p mod 4 and record it.
        - 'Elligator 2 applicability: using the (A,B) from L08, check AB(A^2-4B) nonzero in F_p, and check the curve is not the excluded x^2+y^2 = 1-x^2y^2 (i.e. d not equal to -1).'
        - >-
          Elligator 1 applicability: search for s in F_p with c = 2/s^2 and
          -(c+1)^2/(c-1)^2 = d = -1174. This is a small algebraic solve; report
          the s values found, or report NONE FOUND with the search stated. This
          also feeds A8, because the rigidity transcript asserts d was chosen
          in exactly this form.
        - Implement the map and its inverse and verify round-trip on 1000 random inputs.
      certificate:
        form: >-
          (i) p mod 4; (ii) the nonzero value AB(A^2-4B); (iii) the explicit s
          (or a statement that none was found and over what set); (iv) 1000
          round-trip agreements.
        verification_cost: seconds
      quantitative_prediction:
        metric: round-trip success rate of the implemented encoding on its stated domain
        direction: higher
        value: >-
          1000/1000 expected on the domain where the map is defined, with the
          domain size reported as a fraction of the group (about half, per
          ind.txt's description of a bijection to about half of all points).
        second_metric: >-
          number of s satisfying the Elligator 1 form for d = -1174, predicted
          at least 1. ZERO would directly contradict the rigidity transcript's
          claim that d was chosen in that form, and is the single most
          informative negative outcome available anywhere in this plan.
      controls:
        positive: 'POS-1 (Anomalous, printed "Elligator 2: No."; the applicability checker must REJECT it)'
        negative: NEG-3 (Curve25519, printed "Elligator 2: Yes.")
        'null': 'the excluded curve x^2+y^2 = 1-x^2y^2 (d = -1) over the same p, which the Elligator 2 checker must REJECT by name'
      budget: {cpu_seconds: 900, memory_gb: 1}
      stopping_rule: 'stop at 900 s; report round-trips actually completed'
      falsifier: 'AB(A^2-4B) = 0; or any round-trip failure inside the stated domain; or no s satisfying the Elligator 1 form'
      honest_limitation: >-
        An indistinguishability failure is not an ECDLP break. Also note a
        cross-source tension worth recording rather than resolving: the mirror
        justifies Curve1174's PRIME choice by 'compatibility with Elligator 1'
        (rigid.txt) while the ind row's note reads 'Elligator 2: Yes.'
        (ind.txt). These are not contradictory - both maps can apply - but the
        audit must report which map it actually verified rather than inheriting
        the label.

  # ===========================================================================
  # ADDITIONAL DIAGNOSTICS (all eight declared diagnostics covered)
  # ===========================================================================
  additional_diagnostics:

    - id: A1
      diagnostic: complete curve and twist order factorization with checkable certificates
      status: planned
      tracked_object: 'the integer pair (#E, #E'') = (4l, 4l'')'
      mechanism: 'A complete factorization plus a primality proof per factor converts every order-dependent lane from assertion to certificate.'
      method:
        - Certify #E = 4l via L03's Hasse-uniqueness argument and #E' = p+1+t = 4l'.
        - >-
          Prove l and l' prime. Primary route: Pocklington / Brillhart-Lehmer-
          Selfridge on l-1 and l'-1, using the Curve1174 prime list in
          pages/primeproofs.txt as a candidate-factor HINT (hint-independence
          argument as in L05). Fallback: ECPP, or a stated partial certificate
          with the factored fraction of l-1 reported exactly.
        - Factor the cofactors 4 and 4 (trivial) and confirm h*l = #E, h'*l' = #E'.
      certificate: 'a recursively verifiable primality chain for l and l'', plus two exact product identities'
      quantitative_prediction:
        metric: 'fraction of {l, l''} carrying a complete primality PROOF rather than a probable-prime status'
        direction: different
        value: >-
          Reported as a count with a reason per missing proof. No target is set:
          this is an environment measurement and a mixed proved/probable outcome
          is honest, not a shortfall. The mirror's primeproofs page indicates
          proofs exist upstream, which makes the hint route plausible but
          guarantees nothing about this environment.
      controls: {positive: POS-1 and POS-2 order factorizations, negative: NEG-1, 'null': NULL-2 digit-shuffled orders must fail the product identity}
      budget: {cpu_seconds: 1800, memory_gb: 2}
      stopping_rule: 'abandon a factorization at 900 s each and report BOUNDED with the factored part'
      falsifier: 'h*l not equal to 4l; or l or l'' found composite; or a certificate that does not verify'
      honest_limitation: 'Certifying orders says nothing about the difficulty of the discrete logarithm in those groups.'

    - id: A2
      diagnostic: subgroup, cofactor, and invalid-curve confinement costs
      status: planned
      tracked_object: OBJ-3
      mechanism: >-
        twist.txt gives the attack model: without a cofactor check an attacker
        learns n mod h; without an on-curve check the attacker may use the
        twist, giving n mod (exhaustible part of h'). Confinement cost is the
        exhaustion cost of the reachable small-order structure.
      method:
        - Enumerate the exact subgroup structure of the 4-torsion on E and on E'.
        - 'Tabulate, for each of the four implementor postures named in twist.txt (cofactor check yes/no crossed with on-curve check yes/no), the exact number of bits of n leaked and the exhaustion cost in group operations.'
        - Report the residual kangaroo cost per posture as 0.886*sqrt(l / exhausted modulus), consistent with L09's optimiser.
      certificate: 'the four-row posture table with exact integer moduli, re-derivable from h, h'' and the torsion lists of L10'
      quantitative_prediction:
        metric: bits of n leaked in the worst posture (no cofactor check, no on-curve check)
        direction: lower
        value: >-
          at most log2(h*h') = 4 bits expected from h = h' = 4, hence a
          residual cost within about 2 bits of the L04 rho cost. More than 4
          bits would contradict the transcribed cofactors.
      controls: {positive: 'POS-1, whose twist cofactor has large factors and must show many more leaked bits', negative: NEG-1, 'null': 'NULL-1 random-d curves, whose leaked-bit counts must spread'}
      budget: {cpu_seconds: 300, memory_gb: 1}
      stopping_rule: deterministic enumeration.
      falsifier: 'a torsion structure inconsistent with h = 4 or h'' = 4; or a posture table that cannot reproduce L09''s optimiser minimum'
      honest_limitation: 'This is an ATTACK-MODEL accounting exercise. No attack is executed and no implementation is tested.'

    - id: A3
      diagnostic: automorphism- and endomorphism-adjusted rho cost
      status: planned
      tracked_object: OBJ-2
      mechanism: >-
        rho.txt attributes a sqrt(2) speedup to negation, already inside the
        0.886 constant. Further speedups require extra automorphisms
        (j-invariant 0 or 1728, i.e. D = -3 or -4) or an efficiently computable
        endomorphism of small norm, which requires small |D|. disc.txt states
        the speedups exist 'for some curves where |D| is very small'.
      method:
        - Compute the j-invariant of the curve exactly and test j = 0 and j = 1728.
        - Consume L06's certified lower bound on |D| and state the resulting exclusion.
        - >-
          Derive and state explicitly the bound linking |D| to the minimum norm
          of a non-integer endomorphism, and report the numeric consequence for
          Curve1174. THIS DERIVATION IS AN OBLIGATION, NOT A RESULT: the plan
          does not assert the bound's form in advance, and the executor records
          the derivation with its source or marks the diagnostic UNRESOLVED.
      certificate: 'the exact j-invariant; the |D| bound from L06; and the stated norm bound with its derivation'
      quantitative_prediction:
        metric: additional rho speedup factor beyond the sqrt(2) negation speedup
        direction: lower
        value: >-
          1.0 expected (no additional speedup), conditional on j not in {0,1728}
          and on the norm bound. Any factor above 1.0 would change L04's cost
          and is a material finding.
      controls: {positive: 'POS-2 BN(2,254) with D = -3, where extra automorphisms DO exist and the detector must fire; and POS-1 with D = -11', negative: NEG-1, 'null': 'NULL-1 random-d curves, essentially all of which must show factor 1.0'}
      budget: {cpu_seconds: 300, memory_gb: 1}
      stopping_rule: deterministic.
      falsifier: 'j in {0,1728}; or an efficiently computable endomorphism of small norm being exhibited'
      honest_limitation: >-
        Excluding CM-derived speedups is scoped to the KNOWN speedup families
        cited by disc.txt. disc.txt itself says only that 'the literature does
        not indicate any mechanism that could allow further speedups', which is
        a statement about the literature and not a theorem.

    - id: A4
      diagnostic: embedding-degree certificate or explicit search bound
      status: planned - DELEGATED, NOT DUPLICATED
      delegation: >-
        Fully covered by L05, which specializes IDEA-20260807-98a970 to
        Curve1174 and its twist. No separate mechanism, certificate format or
        control battery is minted here. A4 exists in this plan only so the
        declared diagnostic list is visibly complete.
      additional_scope_beyond_L05: >-
        L05 covers the curve; A4 additionally requires the twist embedding
        degree, whose printed value is (l'-1)/2, using the identical certificate
        format with l replaced by l'.

    - id: A5
      diagnostic: CM discriminant and conductor structure
      status: planned
      tracked_object: OBJ-2, with the conductor tracked SEPARATELY from D
      mechanism: >-
        t^2-4p = f^2 * D_K where D_K is the fundamental discriminant of the CM
        field and f is the conductor of the order. L06 certifies a lower bound
        on |D| = |D_K|; the conductor is a DIFFERENT quantity that L06's short
        certificate deliberately discards (see OBJ-2's lossy-projection test).
      method:
        - From L06's factorization effort, extract the square part s^2 and hence f, to whatever extent the factorization completed.
        - Report D_K, f, and D_K mod 4, and check consistency with disc.txt's printed factorization of D as a comparison target.
        - 'If the factorization is incomplete, report f as BOUNDED: f^2 divides the unfactored cofactor, so f is at most sqrt(cofactor).'
      certificate: 'the triple (D_K, f, s) with the identity t^2-4p = s^2 * (D_K or D_K/4) verified exactly, or the explicit bound on f'
      quantitative_prediction:
        metric: conductor f
        direction: lower
        value: >-
          f = 1 expected (i.e. t^2-4p squarefree up to the factor-4
          convention), because the printed factorization of D lists distinct
          primes and |D| approximately 2^250.8 is close to |t^2-4p|
          approximately 2^250.9. f > 1 would mean the endomorphism ring is a
          non-maximal order, which is worth recording even though it changes no
          criterion cell.
      controls: {positive: 'POS-2, where D = -3 and f is expected large', negative: NEG-1, 'null': NULL-1}
      budget: {cpu_seconds: 600, memory_gb: 2}
      stopping_rule: 'inherits L06''s factorization budget; no additional factoring attempt'
      falsifier: 'the identity t^2-4p = s^2 * D failing; or a computed D disagreeing with the printed D once the factorization completes'
      honest_limitation: >-
        If L06 stops at the short exact-once-prime certificate, f is only
        BOUNDED and this diagnostic is PARTIAL. That is the expected outcome in
        a no-CAS environment and must be reported as partial, not omitted.

    - id: A6
      diagnostic: model-conversion exceptional sets
      status: planned
      tracked_object: 'the fibres of the birational maps Edwards -> Montgomery -> short Weierstrass'
      mechanism: >-
        equation.txt gives x = u/v, y = (u-1)/(u+1) for Edwards-to-Montgomery
        and x = Bu - A/3, y = Bv for Montgomery-to-Weierstrass. These are
        BIRATIONAL, not everywhere-defined: v = 0 and u = -1 are exceptional,
        and the Edwards model has no point at infinity while the other two do.
        A conversion applied blindly loses or invents points exactly there.
      method:
        - Enumerate the exceptional set of each map explicitly by solving the vanishing conditions in F_p.
        - Verify the point counts match across models after accounting for the exceptional set, i.e. that the correspondence is a bijection off a set whose size is computed and stated.
        - Check where the small-torsion points of L10 land, since those are the points most likely to sit in an exceptional set.
      certificate: 'the explicit list of exceptional points per map, with the point-count bookkeeping identity'
      quantitative_prediction:
        metric: size of the exceptional set of the Edwards-to-Montgomery map
        direction: different
        value: >-
          small and exactly enumerable, predicted to consist of the points with
          v = 0 or u = -1 together with the identity handling, on the order of a
          handful of points. The informative outcome is WHICH torsion points
          are exceptional, because that determines whether a ladder
          implementation can silently mishandle an attacker-supplied point.
      controls: {positive: 'a point deliberately chosen in the exceptional set, which must be detected and not silently converted', negative: NEG-1, 'null': 'a random point, which must NOT be flagged exceptional'}
      budget: {cpu_seconds: 300, memory_gb: 1}
      stopping_rule: deterministic enumeration.
      falsifier: 'point counts failing to reconcile across models after accounting for the enumerated exceptional set'
      honest_limitation: 'A property of the MAPS and of any implementation using them, not of the curve''s ECDLP hardness.'

    - id: A7
      diagnostic: scalar and multiscalar formula exceptional-case search
      status: planned
      tracked_object: 'the denominator polynomials of each candidate addition law'
      mechanism: >-
        complete.txt states explicitly that completeness of a curve does not
        guarantee completeness of an addition law, naming the 2008
        Hisil-Wong-Carter-Dawson dual law as an incomplete law on a complete
        curve. The diagnostic is therefore per-FORMULA, not per-curve.
      method:
        - 'For each of: the Edwards addition law, the dual addition law, a standard short-Weierstrass addition, and a standard multi-scalar (Straus/Shamir) routine, search for inputs where a denominator vanishes.'
        - 'Search strategy: exhaustive over the small-torsion subgroup and over P +/- Q for Q in the torsion, plus 10^5 random pairs.'
        - Report a per-formula exception count and, for each exception found, the exact input pair.
      certificate: 'the per-formula exception table with explicit witnesses for every nonzero count and the tested-set size for every zero count'
      quantitative_prediction:
        metric: exception count per formula
        direction: different
        value: >-
          0 for the Edwards law and MORE THAN 0 for the dual law and for the
          short-Weierstrass law. A table that is all zeros means the search is
          not searching and voids A7 and the search half of L10.
      controls: {positive: 'the dual law and the short-Weierstrass law, both of which MUST show exceptions', negative: NEG-1 Edwards law, 'null': 'an incomplete Edwards curve (square d) over the same p, where even the Edwards law must show exceptions'}
      budget: {cpu_seconds: 900, memory_gb: 1}
      stopping_rule: 'exhaustive over torsion plus 10^5 random pairs, or 900 s; report the count actually run'
      falsifier: 'an exception found for the Edwards law on a complete Edwards curve, which would contradict the cited 2007 Bernstein-Lange theorem and require immediate independent review'
      honest_limitation: 'A finite search establishes presence, never absence. Absence rests on the cited theorem, whose hypothesis L02 certifies.'

    - id: A8
      diagnostic: deterministic parameter-generation transcript audit
      status: planned - HIGHEST INFORMATION PER SECOND IN THIS PLAN
      tracked_object: OBJ-4
      mechanism: >-
        The rigid.txt transcript is a sequence of constraints with a claimed
        unique output. Each constraint is independently checkable, and the
        transcript makes several sharp arithmetic claims that a few seconds of
        computation can refute.
      method:
        - 'CLAIM 1 (prime enumeration): enumerate ALL primes congruent to 3 mod 4 within 32 of 2^e for every e from 200 to 300 inclusive, and compare the resulting set against the transcript''s stated six: 2^206-5, 2^212-29, 2^226-5, 2^243-9, 2^251-9, 2^285-9. This is roughly 101 * 65 primality tests on numbers below 2^301 - seconds of work.'
        - 'CLAIM 2 (p = 3 mod 4): compute p mod 4 directly.'
        - 'CLAIM 3 (d minimality): enumerate integers d in increasing absolute value, and for each test the transcript''s stated conditions - d of the form -(c+1)^2/(c-1)^2 with c = 2/s^2 for some s in F_p; d not a square (completeness); curve and twist orders both of the form 4*prime. Report the smallest |d| satisfying all of them and compare against 1174.'
        - 'CLAIM 4 (order shape): confirm that Curve1174''s own curve and twist orders are 4*prime, which L03/A1 already certify.'
        - Count unexplained input bits across the whole transcript.
      certificate: >-
        The full replay log: the enumerated prime set, p mod 4, the ordered
        list of candidate d values with a per-candidate rejection reason, and
        the singleton output. A third party re-runs it in minutes.
      quantitative_prediction:
        metric: smallest |d| satisfying every stated condition
        direction: different
        value: >-
          1174 expected. Any smaller qualifying |d| would falsify the printed
          transcript's minimality claim and would be a genuine, sourced
          disagreement with a SafeCurves statement - obtained without any
          attack, at a cost of minutes.
        second_metric: >-
          'size of the enumerated prime set: exactly 6, matching the six listed.
          A seventh prime, or a listed prime that fails the enumeration, is
          equally falsifying.'
        third_metric: 'unexplained input bits: predicted 0'
      controls:
        positive: 'POS-4 (NIST P-224): the auditor must report UNEXPLAINED-INPUT-PRESENT and must NOT reproduce the coefficients from constraints alone'
        negative: 'NEG-2 (M-221): "p is largest prime smaller than 2^221; B=1; A > 2 as small as possible" must replay to M-221 uniquely'
        'null': 'NULL-4: a constraint-deleted transcript must yield NON-UNIQUE, and a constraint-negated transcript must yield a DIFFERENT curve'
      budget: {cpu_seconds: 900, memory_gb: 1}
      stopping_rule: >-
        The d search is bounded by |d| <= 10^4, which comfortably covers 1174.
        If no qualifying d is found at all below that bound, report NOT
        REPRODUCED with the bound stated rather than widening the search
        silently.
      falsifier: 'a qualifying |d| smaller than 1174; or the prime enumeration differing from the six listed; or p not congruent to 3 mod 4; or any unexplained input bit'
      honest_limitation: >-
        Reproducing a transcript shows the process is replayable. It cannot
        show the CRITERIA in the process were not themselves chosen to reach a
        predetermined curve - rigid.txt concedes exactly this, saying the only
        remaining flexibility 'is in the choice of security and efficiency
        criteria'. A8 therefore bounds manipulation, it does not exclude it.
        And a rigidity result is not an ECDLP result.

  deferred_diagnostics: []
  deferred_note: >-
    All eight declared additional diagnostics are planned above (A4 by explicit
    delegation to L05 plus a twist extension, not by omission). Nothing is
    deferred, so no successor condition for a deferred diagnostic is required.
    Two SCOPE limitations are recorded instead, in open_directions below.

  # ===========================================================================
  # PRIORITIZATION
  # ===========================================================================
  prioritization:
    ranking:
      - rank: 1
        lane: A8 (with L07)
        rationale: >-
          The only lane in the plan whose expected outcome could be overturned
          by minutes of arithmetic against a sourced, quoted claim. Costs
          seconds to minutes, needs no factorization, needs no CAS, and has
          three independent sharp falsifiers (the six primes, p mod 4, minimal
          |d|). Highest information gain per CPU-second by a wide margin.
      - rank: 2
        lane: L01, L02, L03
        rationale: >-
          Everything downstream consumes them, they are cheap, and because the
          tuple is SINGLE-SOURCED (capsule gap G1) their self-consistency
          identities are currently the ONLY available check on a transcription
          error inside SafeCurves itself.
      - rank: 3
        lane: L06 (short exact-once-prime route)
        rationale: >-
          A rigorous certificate for a 2^100 threshold at a cost of seconds,
          avoiding a 250-bit factorization entirely. Highest
          certificate-strength per second among the ECDLP lanes.
      - rank: 4
        lane: L05 / A4
        rationale: >-
          Directly reuses an existing internal record, and the K = 10^6 bound
          pass is decisive against the transfer family in seconds even when the
          exact k is out of reach.
      - rank: 5
        lane: L09, A2
        rationale: >-
          The twist optimiser is the most involved cost model here and depends
          on l' primality, but it is where a genuinely quantitative cell
          (2^123.3) can be independently reproduced.
      - rank: 6
        lane: L04, L08, L10, L11, A1, A3, A5, A6, A7
        rationale: >-
          Cheap and necessary for coverage, but each either restates a size
          comparison (L04), verifies an existence claim (L08, L11), or tests an
          implementation rather than the curve (L10, A6, A7).
    first_test_recommendation:
      lane: A8
      why_it_is_the_cheapest_valid_discriminator: >-
        A8 discriminates between two live explanations of the rigid cell -
        (i) the transcript is a genuine deterministic derivation, so replaying
        it reproduces Curve1174 uniquely, versus (ii) the transcript is a
        post-hoc description, so replay yields a different curve, several
        curves, or a smaller qualifying d. Those two hypotheses predict
        DIFFERENT, EXACTLY COMPARABLE integers (the size of the prime set; the
        minimal |d|), the computation needs only primality testing and a bounded
        integer search, and both outcomes are informative: outcome (i) converts
        a printed label into a replayable certificate this program can hold,
        and outcome (ii) is a sourced disagreement with a published claim
        obtained without running any attack. No other lane offers a sharp,
        falsifiable, minutes-cost test against a quoted claim.

  # ===========================================================================
  # HONEST ACCOUNTING (docs/inventor-protocol.md section 5)
  # ===========================================================================
  honest_accounting:
    objects_considered: [OBJ-1, OBJ-2, OBJ-3, OBJ-4]
    dominated_by: >-
      n/a (no result claimed) for any attack axis: this plan proposes no
      algorithm and claims no time, memory or data improvement on any problem,
      so there is no Pareto frontier row it competes with. As an AUDIT
      INSTRUMENT it is dominated on authority by the SafeCurves verification
      procedure itself (staged as pages/verify.txt, sha256
      9e4acd23f53a27c13410f3fcb7225de74095306d22529c8b13c60c9586151b79, NOT
      read in this task), and by the parameter-validation procedures mandated
      in ANSI X9.62-style and SEC-style standards, both of which have been run
      for decades. This plan dominates them on nothing except that its output
      would sit in this program's ledger with re-verifiable certificates and a
      control battery.
    sota_delta: >-
      Zero speedup against any attack baseline on every axis. Quantitative
      delta as DATA: this program's corpus currently holds zero certified
      parameter values for Curve1174 - no p, no l, no cofactor, no embedding
      degree, no discriminant bound. The plan would produce 11 criterion rows
      plus 8 diagnostic rows, each with a certificate or an explicit bound, a
      control battery, and a falsifier. Delta as METHOD: one genuinely
      cost-reducing certificate design is introduced, the exact-once-prime
      route in L06, which certifies |D| > 2^100 in milliseconds using one
      prime and two divisions instead of a 250-bit factorization.
    closures_enumerated: []
    closures_note: >-
      No lane is closed and no direction is declared impossible. The two lanes
      that could END in a bounded rather than exact result (L05 exact k, A1
      complete primality proofs, A5 conductor) are bounded by a stated
      ENVIRONMENT constraint - no CAS - and not by a mathematical obstruction.
      Recording that distinction is the point; a budget stop is an operational
      observation, never mathematical evidence.
    open_directions:
      - >-
        SCOPE LIMIT 1: the diagnostic list is the goal's, and the goal states
        it is deliberately non-exhaustive. Two families are visible but out of
        scope for this handoff and would need a scoped successor: (a) the
        behaviour of Curve1174's parameters under the special-prime structure
        of 2^251-9, since field.txt notes 'Special primes help index calculus'
        while asserting the point of ECC is to avoid index calculus - that
        remark is a claim this program has never measured; (b) class-number
        structure, which disc.txt explicitly says 'has not been incorporated
        into SafeCurves' though Brainpool requires it above 10^6.
      - >-
        SCOPE LIMIT 2: pages/verify.txt was not read in this task, for budget.
        It is the page most likely to carry the operational definitions behind
        the True/False cells and it should be read first by the successor task,
        particularly for the transfer threshold gap G3.
      - >-
        Cross-goal deduplication is the Coordinator's call, not this task's.
        Three sibling SafeCurves goals were observed to have audit plans naming
        Curve1174 (GOAL-SCURVE-15e805, GOAL-SCURVE-cef9f7, GOAL-SCURVE-137bd9);
        they were NOT READ, because the handoff's read_scope is authoritative
        and forbids reading another goal's records. If they contain a reusable
        control battery, reusing it would cost less than this plan assumes.
