  # ---------------------------------------------------------------------------
  # 3. THRESHOLDS AND CRITERION DEFINITIONS, QUOTED FROM RETRIEVED TEXT
  # ---------------------------------------------------------------------------
  retrieved_thresholds:
    - criterion: rho
      quote: 'SafeCurves requires l to be at least 2^200'
      table_column_header: 'Cost for rho above 2^100?'
      cost_model_quote: >-
        'The rho method breaks ECDLP using, on average, approximately
        0.886 sqrt(l) additions.' The page states 0.886 = sqrt(pi/4) and that
        the additions are batched affine short-Weierstrass additions.
      source_file: inputs/SAFECURVES-20260825/pages/rho.txt
      source_sha256: c70d1f93915d23efc77e80be8cfb7f8a1e812456108ffce011b94e6ad9e79d9c
    - criterion: disc
      quote: >-
        'SafeCurves requires the absolute value of this complex-multiplication
        field discriminant D to be larger than 2^100'
      definition_quote: >-
        'If s^2 is the largest square dividing t^2-4p then (t^2-4p)/s^2 is a
        squarefree negative integer. Define D as (t^2-4p)/s^2 if
        (t^2-4p)/s^2 mod 4 = 1, otherwise as 4(t^2-4p)/s^2.'
      table_column_header: '|D| above 2^100?'
      source_file: inputs/SAFECURVES-20260825/pages/disc.txt
      source_sha256: 666a0adf68bde7d1b5c3d0011486ecc5b93d6b4ee6363b8a98079567758c157c
    - criterion: transfer
      definition_quote: >-
        'Additive transfer: applicable when l equals p.' 'Degree-k
        multiplicative transfer: applicable when l divides p^k-1.' 'The minimum
        possible multiplicative-transfer degree ... is called the embedding
        degree.' The page states SafeCurves 'takes the overkill approach',
        contrasting SEC1/X9.62 (embedding degree at least 20), P1363 (never
        more than 30) and Brainpool (at least (l-1)/100). The page does NOT
        state a single numeric SafeCurves embedding-degree threshold; the
        Brainpool (l-1)/100 figure is the largest explicitly named bar.
      threshold_gap_flag: >-
        UNRESOLVED DEFINITIONAL GAP. Because no explicit SafeCurves numeric
        embedding-degree bar is quoted, the transfer lane below tests the two
        stated applicability conditions (l = p; l | p^k-1 for k up to a
        certified search bound) and reports k or a certified lower bound,
        rather than asserting a pass against an unquoted threshold.
      source_file: inputs/SAFECURVES-20260825/pages/transfer.txt
      source_sha256: ecf87cf91f76cc55650de388718f9e48e27e8e15328e7d818804b665303c5610
    - criterion: twist
      quote: >-
        'SafeCurves quantitatively evaluates combined attacks that use
        small-subgroup attacks ... together with invalid-curve attacks using the
        twist. SafeCurves requires the resulting security level to be at least
        2^100.'
      table_column_headers:
        - 'Cost for combined attack above 2^100?'
        - 'Cost for twist rho above 2^100?'
      source_file: inputs/SAFECURVES-20260825/pages/twist.txt
      source_sha256: 728a3d2721f4ab11e8ba34e92c80aa37c6b2200e664a1bb504620831146b13ab
    - criterion: field
      quote: 'However, SafeCurves requires prime fields.'
      source_file: inputs/SAFECURVES-20260825/pages/field.txt
      source_sha256: df36b29998b4137fa8e490fc2e20dac07e9126adf46132506ba0a226eafb15e9
    - criterion: equation
      quote: >-
        'The Edwards equation x^2 + y^2 = 1 + dx^2y^2, where d(1-d) is nonzero
        in F_p, is an elliptic curve over F_p. ... SafeCurves requires Edwards
        curves to be complete, i.e., for d to not be a square.'
      source_file: inputs/SAFECURVES-20260825/pages/equation.txt
      source_sha256: 40382c67775767a21e76ae5446431078f68f340571d34aaae843500dec126506
    - criterion: base
      quote: >-
        'Along with specifying a curve one specifies a base point (x_1,y_1) of
        prime order l on that curve.'
      source_file: inputs/SAFECURVES-20260825/pages/base.txt
      source_sha256: e085e93dc69b906bb66bbaee4c045e3b688f17ca1d38d4595b5456f14b369185
    - criterion: rigid
      quote: >-
        Four levels are defined: 'Fully rigid: The curve-generation process is
        completely explained.' / 'Somewhat rigid' / 'Manipulatable' /
        'Trivially manipulatable'.
      source_file: inputs/SAFECURVES-20260825/pages/rigid.txt
      source_sha256: 5f1595d64f9d58c61e09e19fbe300db40e20a447bd64c8c158f308e3bed296a7
    - criterion: ladder
      quote: >-
        'SafeCurves requires curves to support simple, fast, constant-time
        single-coordinate single-scalar multiplication'. Table column header is
        'Montgomery ladder?'.
      source_file: inputs/SAFECURVES-20260825/pages/ladder.txt
      source_sha256: d6ea58deeddee3ea43c81d9557d91fadf75203e0c656a484572d9fe7bc9ad078
    - criterion: complete
      quote: >-
        'SafeCurves requires curves to support simple, fast, complete,
        constant-time single-coordinate single-scalar multiplication ...
        SafeCurves also requires curves to support simple, fast, complete,
        constant-time multi-scalar multiplication.' The page also states
        '2007 Bernstein-Lange showed that the Edwards addition law is complete
        for every complete Edwards curve E.'
      source_file: inputs/SAFECURVES-20260825/pages/complete.txt
      source_sha256: 03492668b38d8812f5a3ed27fc36e6f76f32a952096dd19efd85c843de8042cf
    - criterion: ind
      quote: >-
        'Elligator 1 requires a prime congruent to 3 mod 4 and a complete
        Edwards curve x^2+y^2=1+dx^2y^2 where d has the form -(c+1)^2/(c-1)^2
        with c=2/s^2.' 'Elligator 2 works for any odd prime and any curve of the
        form y^2=x^3+Ax^2+Bx with nonzero AB(A^2-4B) ... it includes all
        Edwards curves x^2+y^2=1+dx^2y^2 except for one curve x^2+y^2=1-x^2y^2.'
      source_file: inputs/SAFECURVES-20260825/pages/ind.txt
      source_sha256: f0c1cfe751c66af33df9a72edeacad25bfe0a8515c80c334b47f4c35779674c8

