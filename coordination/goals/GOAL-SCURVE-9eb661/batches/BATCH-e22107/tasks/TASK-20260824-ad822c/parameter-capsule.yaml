    source_sha256: 830355b638e713f4f99da62970e63e606e32c0f25f62af12a5aef4c4570c9e4e
    per_page_detail_cells:
      rho: 'True (checkmark); Cost for rho printed as 2^124.3 (rho.txt)'
      transfer: 'additive True; multiplicative True; embedding degree printed as (l-1)/1 (transfer.txt)'
      disc: '|D| above 2^100 True; |D| printed as approximately 2^250.8 (disc.txt)'
      rigid: 'fully rigid (checkmark), with a stated generation rationale (rigid.txt)'
      ladder: 'Montgomery ladder True; cofactor 2^2 (ladder.txt)'
      twist: >-
        combined attack above 2^100 True, printed 2^123.3; twist rho above
        2^100 True, printed 2^124.3; twist cofactor 2^2; twist additive and
        multiplicative transfer both True (twist.txt)
      complete: 'complete single-scalar True; complete multi-scalar True (complete.txt)'
      ind: 'True; note printed as "Elligator 2: Yes." (ind.txt)'
    rigidity_transcript_as_printed:
      quote: >-
        'Prime chosen "very close to, but not above, a power of 2" for
        efficiency. Prime chosen 3 mod 4 for compatibility with Elligator 1.
        The only primes 3 mod 4 within 32 of 2^e for e between 200 and 300 are
        2^206-5, 2^212-29, 2^226-5, 2^243-9, 2^251-9, 2^285-9; first four
        rejected for security level, and last rejected for efficiency,
        producing 2^251-9. Edwards curve shape x^2+y^2=1+dx^2y^2 chosen for
        efficiency. Complete Edwards curve chosen for security. Curve and twist
        orders chosen as {4*prime,4*prime} for security. d chosen to have the
        form -(c+1)^2/(c-1)^2 with c=2/s^2 for compatibility with Elligator 1.
        d=-1174 is smallest qualifying integer in absolute value.'
      source_file: inputs/SAFECURVES-20260825/pages/rigid.txt
      source_sha256: 5f1595d64f9d58c61e09e19fbe300db40e20a447bd64c8c158f308e3bed296a7
      why_recorded: >-
        This transcript is a machine-checkable claim, not prose. Lane A8 of the
        audit plan re-runs it end to end; it is the single cheapest place in the
        whole campaign where a sourced statement about Curve1174 could be shown
        to be wrong.
    primality_proof_pointer:
      observation: >-
        pages/primeproofs.txt carries a per-curve list headed 'Relevant proven
        primes'. The Curve1174 list begins 2, 3, 5, 7, 11, 13, ... and includes
        33997, 12320708804681 and 20387630040577. Two of those (33997 and
        12320708804681) also appear in the printed factorization of D.
      why_this_matters: >-
        The list is a CANDIDATE-FACTOR HINT for the certificate lanes, not a
        source of truth. Using it as a hint costs nothing evidentially because
        every certificate that consumes it is self-verifying: a product
        identity plus a primality proof per factor plus explicit witnesses. A
        wrong hint makes a certificate fail to verify; it can never make a
        false certificate verify. This hint/verification separation is stated
        here so no later reader mistakes hint reuse for source dependence.
      source_file: inputs/SAFECURVES-20260825/pages/primeproofs.txt
      source_sha256: 4b6c69f64451c946645513073feae6f89806f4c790715ded1a2c7b103545d549

  # ---------------------------------------------------------------------------
  # 5. RECONCILIATION AND CONFLICTS
  # ---------------------------------------------------------------------------
  reconciliation:
    method: >-
      Field-by-field comparison of the user intake tuple against the staged raw
      SafeCurves page text read with the Read tool. No arithmetic verification
      of any value was performed in this task; that is the audit plan's job.
    agreements:
      - field: curve name
        intake: Curve1174
        mirror: Curve1174
        verdict: agree (non-independent)
      - field: equation
        intake: x^2+y^2 = 1-1174x^2y^2
        mirror: x^2+y^2 = 1-1174x^2y^2 (equation.txt and index.txt)
        verdict: agree (non-independent)
      - field: modulus
        intake: 2^251 - 9 (expression only, no digits)
        mirror: 2^251 - 9 with decimal and hex expansions (field.txt)
        verdict: >-
          agree (non-independent); the mirror SUPPLIES digits the intake never
          carried, so this is a completion, not a corroboration
      - field: attribution
        intake: 2013 Bernstein-Hamburg-Krasnova-Lange
        mirror: '2013 Bernstein-Hamburg-Krasnova-Lange (index.txt)'
        verdict: >-
          agree (non-independent). Partially corroborated OUTSIDE the mirror:
          the eprint 2013/325 landing page names the same four authors, the
          same year and the title 'Elligator: Elliptic-curve points
          indistinguishable from uniform random strings'. That corroboration is
          summarizer-mediated and bibliographic only.
      - field: eleven criterion cells
        intake: all eleven True, expected_safe true
        mirror: all eleven True plus Safe? True (index.txt)
        verdict: >-
          agree (NON-INDEPENDENT, and this is the most important caveat in the
          capsule). Agreement here tells us the intake was transcribed
          correctly. It tells us nothing about the curve.
    conflicts_found: []
    conflicts_note: >-
      No contradiction between the intake tuple and the retrieved text was
      found. Under the goal's pause_conditions, "primary or authoritative
      sources leave an unresolved conflict in the named curve's parameter
      tuple" is therefore NOT triggered by anything in this capsule.
    open_gaps:
      - id: G1
        gap: >-
          No source independent of SafeCurves has been read for ANY digit of
          Curve1174. The originating Elligator paper (eprint 2013/325) was
          reachable but its parameters could not be extracted: the PDF path
          returned undecoded compressed streams and the tool refused to quote
          numbers from them, and elligator.cr.yp.to returned HTTP 502.
        consequence: >-
          Every digit in section 2 rests on a single source family. A
          transcription error inside SafeCurves itself would propagate through
          this whole campaign undetected by cross-sourcing, and could only be
          caught by the arithmetic self-consistency checks in the audit plan.
        successor_condition: >-
          A successor task with byte-level fetch capability (the Executor role
          holds Bash) retrieves eprint 2013/325 as text, extracts the Curve1174
          section, and re-verifies p, d, s, c, the base point, l, h, l' and h'
          against section 2 above. Any disagreement supersedes this capsule
          with a new record rather than editing it.
      - id: G2
        gap: >-
          The intake carries no base point, no l, no cofactor, no trace and no
          twist data. Those seven quantities enter this campaign for the first
          time in this capsule, from the mirror alone.
        consequence: >-
