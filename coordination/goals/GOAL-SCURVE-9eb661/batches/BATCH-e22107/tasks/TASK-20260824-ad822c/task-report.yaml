      Only public named-curve parameters and to-be-generated synthetic controls
      appear. No live private key was tested, requested, stored, or derived.
    bedrock: >-
      No provider, backend, endpoint or model identifier containing "bedrock"
      (case-insensitive) was selected, requested, or contacted.
