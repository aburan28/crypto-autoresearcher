    - item: The report states that no curve attack ran and makes no safety or vulnerability conclusion.
      met: true
      where: declarations block above.
    all_items_met: true

  # ---------------------------------------------------------------------------
  # UNRESOLVED CONFLICTS AND LIMITATIONS
  # ---------------------------------------------------------------------------
  intake_vs_retrieved_conflicts:
    conflicts_found: none
    detail: >-
      Every field of the user intake tuple (curve name, equation, modulus,
      attribution, and all eleven expected criterion cells) matches the staged
      SafeCurves text. NO CONTRADICTION WAS FOUND, and therefore the goal's
      pause_condition "Primary or authoritative sources leave an unresolved
      conflict in the named curve's parameter tuple" is NOT triggered.
    why_this_agreement_proves_almost_nothing: >-
      THIS IS THE SINGLE MOST IMPORTANT SENTENCE IN THIS REPORT. Curve1174 is a
      curve that the SafeCurves work itself introduced, and the user intake
      table is itself a transcription of the SafeCurves table. The mirror and
      the intake are NOT INDEPENDENT SOURCES. Their agreement establishes that
      the intake was transcribed correctly and nothing else. It is not
      corroboration, not replication, and must never be reported as two sources
      agreeing. The campaign currently has ONE source family for every digit of
      this curve.
  limitations:
    - Nothing in either artifact was computed. Every value is transcribed and every check is planned.
    - >-
      Single-source risk (capsule gap G1): a transcription error inside
      SafeCurves itself would propagate through this whole campaign undetected
      by cross-sourcing. The only current defence is the arithmetic
      self-consistency identities in lanes L01-L03 and A1, which is precisely
      why they are ranked second in the plan.
    - >-
      Seven quantities (base point, l, h, t, l', h', D) enter the campaign for
      the first time in this capsule and come from the mirror alone. They are
      NOT preregistered comparison targets in the sense the goal uses for the
      eleven cells; they are new unverified inputs.
    - >-
      No numeric SafeCurves embedding-degree threshold was found in the
      retrieved transfer text (gap G3), so lane L05 reports k or a certified
      bound rather than adjudicating a pass against an unquoted bar.
    - >-
      Cost figures in the plan assume a pure-Python, no-CAS environment carried
      over from IDEA-20260807-98a970. That assumption was NOT verified here -
      this role holds no Bash - and the Executor must confirm or correct it. If
      a CAS is available, lanes A1, A4/L05 and A5 move from BOUNDED to EXACT
      and the plan should be re-costed. A capability change is not a result.
    - >-
      pages/verify.txt was not read, for budget. It may contain operational
      definitions that change how several cells should be adjudicated.
    - >-
      Sibling SafeCurves audit plans exist for other goals and were not read,
      because read_scope forbids it. This plan may therefore rebuild a control
      battery that already exists.
    - >-
      The resolved model identifier is self-reported session configuration and
      was not probe-verified, because probing requires Bash.

  # ---------------------------------------------------------------------------
  # PROPOSED SUCCESSOR HANDOFFS (proposals only; the Coordinator assigns work)
  # ---------------------------------------------------------------------------
  proposed_successor_handoffs:
    - proposed_role: executor
      objective: >-
        Break the single-source dependency. Retrieve eprint 2013/325 as raw
        bytes (the Executor holds Bash; curl to eprint.iacr.org returned 200 to
        this session's WebFetch, so the host is reachable), extract the
        Curve1174 parameter section as text, and re-verify p, d, s, c, the base
        point, l, h, l' and h' against parameter-capsule.yaml section 2. Also
        attempt elligator.cr.yp.to by curl, which returned 502 only through the
        WebFetch tool path.
      why_first: >-
        It is the only successor that repairs capsule gaps G1 and G2, and every
        later certificate is only as good as the tuple it certifies.
      constraint_to_carry: >-
        Byte-level extraction only. No summarizer-mediated digit may enter a
        record. Any disagreement supersedes the capsule with a NEW record and
        never edits it.
    - proposed_role: executor
      objective: >-
        Run audit-plan lane A8 with L07 (generation transcript replay) plus the
        stage 0 control battery items POS-4, NEG-2 and NULL-4.
      why_second: >-
        Cheapest valid discriminator in the plan. Minutes of primality testing
        and a bounded integer search, three independent sharp falsifiers, and
        both outcomes informative. See audit-plan
        prioritization.first_test_recommendation.
    - proposed_role: executor
      objective: >-
        Run lanes L01, L02, L03 with NULL-2, then L06's exact-once-prime
        certificate route with POS-1, POS-2 and NULL-1.
      why_third: >-
        Establishes the self-consistency of a single-sourced tuple and delivers
        one rigorous 2^100 threshold certificate in seconds without any 250-bit
        factorization.
    - proposed_role: idea-generator or coordinator
      objective: >-
        Read inputs/SAFECURVES-20260825/pages/verify.txt and adjudicate gap G3
        (whether a numeric SafeCurves embedding-degree bar exists
        operationally), then amend or supersede lane L05's adjudication rule.
      why: A definitional gap should be closed by reading, not by an executor's judgement call mid-run.
    - proposed_role: coordinator
      objective: >-
        Decide whether the three sibling SafeCurves audit plans contain a
        reusable control battery, since cross-goal reads are outside any
        producer's read_scope and only the Coordinator can see across goals.
      why: Avoids rebuilding a battery that may already exist, at zero research cost.

  # ---------------------------------------------------------------------------
  # HONEST ACCOUNTING (docs/inventor-protocol.md section 5)
  # ---------------------------------------------------------------------------
  honest_accounting:
    objects_considered:
      - 'OBJ-1 the integer pair (p, l), i.e. ord_l(p) - used by the transfer and embedding-degree lanes'
      - 'OBJ-2 the pair (t, D), trace and CM field discriminant, with the conductor tracked separately'
      - 'OBJ-3 the small-torsion profile of (E, E'') together with (h, h'')'
      - 'OBJ-4 the generation transcript as a program with a claimed unique output'
      each_object_passed_the_lossy_projection_test: >-
        Yes, and each test is written out in audit-plan.object_first, including
        what is discarded and why the discard is compatible with the operations
        that matter. OBJ-2 is recorded as PARTIAL for the conductor, which is
        why lane A5 tracks f separately from D rather than conflating them.
      novelty_of_the_objects: >-
        None is claimed new. All four are the standard objects of published
        curve validation. novelty_status for this task's contribution is
        ADAPTATION: established diagnostics specialized to Curve1174 with
        certificate formats, a control battery and falsifiers that this
        program's corpus does not currently hold. The one design element that
        is not a straight restatement is the exact-once-prime certificate in
        L06, and it is elementary number theory, not a new technique.
    dominated_by: >-
      n/a (no result claimed) on every attack axis - this task proposes no
      algorithm and claims no improvement in time, memory, or data/queries on
      any problem, so there is no frontier row it competes against. As an AUDIT
      INSTRUMENT it is dominated on authority by SafeCurves' own verification
      procedure (staged as pages/verify.txt, not read here) and by the
      parameter-validation procedures mandated in ANSI X9.62-style and
      SEC-style standards, both run for decades. It dominates them on nothing
      except that its output would sit in this program's ledger with
      re-verifiable certificates, explicit controls, and stated falsifiers.
    sota_delta: >-
      Zero speedup against any attack baseline on every axis. As DATA: the
      corpus currently holds zero certified parameter values for Curve1174 - no
      p, no l, no cofactor, no embedding degree, no discriminant bound - and
      the plan would produce 11 criterion rows plus 8 diagnostic rows, each
      with a certificate or an explicit bound. As METHOD: L06's
      exact-once-prime route certifies |D| > 2^100 with one prime, two
      divisions and a comparison, replacing a 250-bit factorization that may
      not finish in this environment at all.
    closures_enumerated: []
    closures_note: >-
      No lane was closed, no direction was declared impossible, and no
      saturation argument was made. Where a lane may end BOUNDED rather than
      EXACT (L05's exact k, A1's primality proofs, A5's conductor), the cause
      is a stated ENVIRONMENT constraint - no computer-algebra system - and not
      a mathematical obstruction. That distinction is recorded deliberately: a
      budget or capability stop is an operational observation, never
      mathematical evidence.
    open_directions:
      - Break the single-source dependency on SafeCurves for Curve1174's digits (successor 1 above).
      - Close the transfer threshold definitional gap G3 by reading pages/verify.txt.
      - >-
        Two out-of-scope families visible from the retrieved text and worth a
        scoped successor: (a) field.txt's remark that "Special primes help
        index calculus" while asserting the point of ECC is to avoid it - a
        claim this program has never measured against 2^251-9 specifically;
        (b) class-number structure, which disc.txt states "has not been
        incorporated into SafeCurves" although Brainpool requires it above
        1000000.
      - >-
        A methodological observation for the harness rather than the curve: the
        exact-once-prime certificate in L06 generalizes to every curve in this
        campaign family and would let all twenty SafeCurves goals certify their
        disc cell without any large factorization. If that is worth a shared
        technique note, it is the Coordinator's to commission.
