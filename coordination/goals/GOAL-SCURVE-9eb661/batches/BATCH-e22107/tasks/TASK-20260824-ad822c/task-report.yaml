        Read tool from a staged raw pages/*.txt file whose sha256 is recorded.
        The eprint fetch is quarantined in the capsule as bibliographic-only
        and yielded no numbers. The PDF fetch yielded no numbers. No number in
        any artifact rests on the summarizer.

  # ---------------------------------------------------------------------------
  # COMPLETION GATE
  # ---------------------------------------------------------------------------
