    coordinator_integrity_warning:
      received: true
      content_summary: >-
        WebFetch in this environment returns a small-model SUMMARY of a page
        rather than the page, and that summarizer demonstrably corrupts numeric
        data (RFC 7748 case: three distinct constants collapsed into one; a
        cofactor of 4 reported as 2; a subgroup order returned with a 64-hex
        tail where the raw text has 56; two fetches of the same URL disagreeing
        with each other). Two agreeing WebFetch results are one summarizer
        sampled twice, not corroboration.
