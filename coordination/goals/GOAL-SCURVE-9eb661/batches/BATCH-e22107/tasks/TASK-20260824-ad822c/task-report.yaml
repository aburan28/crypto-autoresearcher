    no_safety_or_vulnerability_conclusion: >-
      This task states NOTHING about whether Curve1174 is safe, unsafe,
      vulnerable, or free of vulnerabilities. It reconciles a parameter tuple
      against retrieved text and proposes falsifiable audits. Any reader who
      takes a security conclusion from these artifacts has misread them.
