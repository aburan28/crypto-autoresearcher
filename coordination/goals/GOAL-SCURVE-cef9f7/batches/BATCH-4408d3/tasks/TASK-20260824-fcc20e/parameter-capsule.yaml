    source: SRC-NEUROMANCER
    provenance: retrieved
    recomputation_lane: L-EQ
  - quantity: trace of Frobenius t
    reported_value: >-
      1388124618062372383606759648309780106643088307173319169677
    source: SRC-NEUROMANCER
    provenance: retrieved
    recomputation_lane: L-BASE (t = p + 1 - n) and L-TWIST (n' = p + 1 + t)
  - quantity: '"Discriminant" (label as printed by the source)'
    reported_value: >-
      38275261264050278989862136034342276004573039492779555073863190029182890449044186682105480613137214197175883602718257
    source: SRC-NEUROMANCER
    provenance: retrieved
    AMBIGUITY_FLAG: HIGH
    ambiguity_detail: >-
      The printed value has the same digit-length as p, which is the signature of
      a WEIERSTRASS DISCRIMINANT reduced mod p (e.g. -16(4a^3 + 27b^2) mod p), NOT
      of a CM DISCRIMINANT. The SafeCurves `disc` criterion and the goal's
      "CM discriminant and conductor structure" diagnostic both concern the CM
      discriminant D of the endomorphism ring, obtained from 4p - t^2 = v^2|D|,
      which for a non-CM-constructed curve is expected to have magnitude
      comparable to p but is a DIFFERENT OBJECT with a DIFFERENT SIGN CONVENTION.
      CONFUSING THE TWO WOULD SILENTLY VOID LANE L-DISC. Recorded here explicitly
      so that the confusion is preregistered as a hazard rather than discovered
      later.
    recomputation_lane: L-EQ (Weierstrass) and L-DISC / D5 (CM), separately

