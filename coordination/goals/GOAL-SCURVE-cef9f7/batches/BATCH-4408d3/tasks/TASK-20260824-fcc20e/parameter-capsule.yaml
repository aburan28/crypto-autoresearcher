        The uncompressed-point tail returned by SRC-SEC2V2 shares the leading
        8 characters (3617de4a) and then diverges. Same length/coherence
        reasoning as for b. Listed under unresolved_conflicts.
  - name: n
    role: order of the base point / group order claim
    value_hex: >-
      ffffffffffffffffffffffffffffffffffffffffffffffffc7634d81f4372ddf581a0db248b0a77aecec196accc52973
    sources: [SRC-NEUROMANCER, SRC-SEC2V2]
    agreement: exact
    agreement_detail: >-
      This is the ONE long hexadecimal field on which the degraded SEC 2
