unresolved_conflicts:
- id: CONF-1
  fields: [p, b, Gy]
  parties:
  - SRC-NEUROMANCER + SRC-PYECDSA (mutually character-identical on b and Gy;
    SRC-NEUROMANCER alone on p in hex)
  - SRC-SEC2V2 (degraded PDF extraction)
  nature: >-
    The primary standard's returned strings differ from the two high-fidelity
    retrievals on three fields.
  working_classification: extraction_artifact, not source_conflict
  basis_for_classification: >-
    The SEC 2 strings are not well-formed 384-bit field elements (wrong length in
    all three cases), so they cannot be competing parameter values. The competing
    hypothesis - that SEC 2 genuinely specifies different parameters - is
    inconsistent with SEC 2's own n and S matching exactly.
  status: OPEN
  why_still_open: >-
    The classification was reached by reasoning about string lengths, not by
    reading the SEC 2 page. PDF page rendering is unavailable in this
    environment (pdftoppm absent), so the primary document was never actually
    read at character level.
  resolution_route: >-
    Lane T0. Obtain SEC 2 v2.0 and/or SP 800-186 through a text-extraction path
    that reports its own fidelity (e.g. an extractor whose output can be
    length-checked to exactly 96 hex characters per field), and compare
    character-for-character. Alternative independent route: a third
    high-fidelity non-PDF retrieval (e.g. an RFC or a second implementation) to
    make the cross-check 3-of-3.
  pause_condition_assessment: >-
    DOES NOT YET TRIGGER goal pause_condition #3 ("Primary or authoritative
    sources leave an unresolved conflict in the named curve's parameter tuple").
    The conflict is currently between one high-fidelity pair and one
    self-evidently damaged extraction, which is a tooling failure, and tooling
    failures are operational observations, not evidence. IT WOULD TRIGGER the
    pause condition if a clean, fidelity-checked extraction of SEC 2 or
    SP 800-186 still disagreed with SRC-NEUROMANCER/SRC-PYECDSA. This
    assessment is the Idea Generator's reading; the Coordinator adjudicates.
- id: CONF-2
  fields: [SafeCurves criterion definitions; the SafeCurves P-384 row]
  nature: >-
    ZERO of the nine SafeCurves pages named in the handoff `inputs` were
    retrieved. The eleven criterion DEFINITIONS and the published P-384 row are
    therefore entirely unretrieved in this session.
  consequence: >-
    The audit plan below states each criterion's definition as `recalled`, never
    as `retrieved`. No lane may adjudicate an intake cell against a recalled
    definition. ADJ-DEFN is a blocking precondition for every adjudication.
  status: OPEN
  resolution_route: >-
    Lane ADJ-DEFN. Retry the host from a session whose proxy reaches
    cr.yp.to; failing that, obtain the SafeCurves criteria from the corresponding
    peer-reviewed publication by the same authors (candidate internal pointer:
    KN-LIT-6351, "Safe curves for elliptic-curve cryptography", Bernstein and
    Lange, which the corpus records with a local copy at
    downloads/safecurves-20240809.pdf). NOTE: KN-LIT-6351's own record states its
    metadata was parsed heuristically and its claims are relayed without
    independent verification, so it is a POINTER, not a substitute.
- id: CONF-3
  fields: [deterministic parameter-generation procedure]
  nature: >-
    The specification of the seed-to-coefficient procedure (ANSI X9.62 /
    SEC 1 3.1.3 / SP 800-186) was NOT retrieved on 4 attempts across 3 documents.
  consequence: >-
    Lane L-RIGID, the flagship diagnostic, cannot start. Its procedure statement
    in the audit plan is marked `recalled` and is a HYPOTHESIS TO BE RETRIEVED
    AND THEN TESTED, not a specification to be implemented.
  status: OPEN
  resolution_route: lane R0 in the audit plan (blocking precondition of L-RIGID)

# ---------------------------------------------------------------------------
# 6. LIMITATIONS
# ---------------------------------------------------------------------------
limitations:
  no_compute_tool: >-
    This session had Read, Grep, Glob, Write, WebSearch, WebFetch and SendMessage
    only. NO shell, NO interpreter. Not a single arithmetic operation was
    performed: no primality test, no point-on-curve check, no hex-to-decimal
    conversion, no order computation. Every "agreement" recorded above is
    STRING COMPARISON of transcribed text, and every relation between
    representations (hex vs decimal, a vs p-3) is recorded as an open obligation.
    This is the single largest limitation of the capsule and it is why lane T0
    exists.
  pdf_extraction: >-
    The environment cannot render PDF pages (pdftoppm/poppler absent), so PDFs
    are only reachable through the fetch tool's own text layer. That layer
    returned coherent prose for one small document (SEC 2 v2.0) and unusable
    output for three others (SP 800-186, SEC 1 v2.0, eprint 2014/571), and even
    where it produced prose it corrupted long hexadecimal strings. TREAT EVERY
    PDF-SOURCED CHARACTER STRING IN THIS ENVIRONMENT AS UNRELIABLE UNTIL
    LENGTH-CHECKED.
  primary_source_status: >-
    NO primary standard was read at character level. The tuple's cross-check
    rests on one aggregator and one implementation. This is honestly a
    SECONDARY-SOURCE cross-check, and the capsule does not claim otherwise.
  safecurves_status: >-
    The SafeCurves site was unreachable. Nothing on this site is paraphrased
    anywhere in this task's artifacts.
  no_measurement: >-
    Nothing in this capsule is a measurement of the curve. No attack, no solve,
    no relation search, no order computation was attempted or performed.

corpus_novelty_screen:
  method: >-
    Metadata-level grep only (files_with_matches), to stay close to the
    handoff's authoritative read_scope while honouring the role contract's
    novelty-check requirement. Patterns: "P-384|secp384r1|SafeCurves|safecurves"
    over knowledge/, and "P-384|secp384r1" over ledger/hypotheses/.
  hits:
  - knowledge/techniques/KN-TECH-037.md (P-384 appears only inside a
    cost/parameter-size table row; not a parameter audit)
  - knowledge/literature/KN-LIT-6351.md (Bernstein-Lange "Safe curves for
    elliptic-curve cryptography"; entry self-labels its metadata as
    heuristically parsed and its claims as unverified)
  - ledger/hypotheses/H-JMV-001.yaml, ledger/hypotheses/H-CRYPTO-a928b6.yaml
    (mention only; not read in detail, and not parameter-audit records)
  conclusion: >-
    The corpus holds NO reconciled P-384 parameter tuple, NO SafeCurves criterion
    reproduction for this curve, and NO generation-transcript record. This
    capsule is the program's first. That is a statement about this repository,
    not a novelty claim about the world: reproducing standard curve parameters
    and checking a seeded transcript are routine, long-published activities.
  novelty_status: known
