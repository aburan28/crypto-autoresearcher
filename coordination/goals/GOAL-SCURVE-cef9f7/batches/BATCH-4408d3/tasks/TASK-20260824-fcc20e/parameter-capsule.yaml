# ---------------------------------------------------------------------------
# 3. RECONCILED TUPLE
# ---------------------------------------------------------------------------
reconciled_tuple:
  status: cross_checked_two_independent_retrievals_pending_byte_verification
  authority_rule: >-
    A field is recorded as `agreement: exact` ONLY where two high-fidelity
    independent retrievals (SRC-NEUROMANCER, SRC-PYECDSA) returned
    character-identical values after normalising case and whitespace. That is a
    consistency result between two non-primary sources; it is NOT primary-source
    verification, because both primary PDFs (SEC 1, SEC 2 at character level,
    SP 800-186) failed to extract. Elevating these to primary-verified status
    requires lane T0 in the audit plan.
  normalisation_applied:
  - lowercased hexadecimal
  - removed the 8-character grouping whitespace present in SRC-PYECDSA
  fields:
  - name: p
    role: field characteristic
    value_hex: >-
      fffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffeffffffff0000000000000000ffffffff
    hex_digit_count_asserted_by_source: 96
    sources: [SRC-NEUROMANCER]
    corroboration:
    - source: SRC-PYECDSA
      form: decimal
      value: >-
        39402006196394479212279040100143613805079739270465446667948293404245721771496870329047266088258938001861606973112319
      agreement: not_directly_comparable_without_computation
      note: >-
        Hex-to-decimal equality was NOT computed in this session. Recorded as an
        obligation of lane T0, not as a verified fact.
    - source: SRC-WIKIPEDIA-P384
      form: decimal (truncated by summariser)
      agreement: leading_digits_consistent
    - source: SRC-SEC2V2
      agreement: MISMATCH_ATTRIBUTED_TO_EXTRACTION
      detail: >-
        SRC-SEC2V2 returned a 94-character string. Two hexadecimal characters are
        missing relative to SRC-NEUROMANCER. Classified as an extraction defect
        rather than a source conflict BECAUSE a 94-digit value cannot be a
        384-bit prime at all, so the returned string is not a coherent competing
        parameter. THIS CLASSIFICATION IS A JUDGEMENT, NOT A VERIFICATION, and it
        is listed under unresolved_conflicts.
    intake_relation:
      intake_states: 2^384 - 2^128 - 2^96 + 2^32 - 1
      status: NOT_YET_ADJUDICATED
      note: >-
        The claim "the retrieved hex equals 2^384 - 2^128 - 2^96 + 2^32 - 1" is a
        computation. It was not performed. It is obligation T0-O1.
  - name: a
    role: Weierstrass coefficient a
    value_hex: >-
      fffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffeffffffff0000000000000000fffffffc
    sources: [SRC-NEUROMANCER]
    corroboration:
    - source: SRC-PYECDSA
      form: literal
      value: '-3'
      agreement: consistent_only_if_a_equals_p_minus_3
      note: >-
        Whether the retrieved hex equals p - 3 was NOT computed. Obligation
        T0-O2. The two sources state a in different representations and their
        equality is exactly what T0 must check.
  - name: b
    role: Weierstrass coefficient b
    value_hex: >-
      b3312fa7e23ee7e4988e056be3f82d19181d9c6efe8141120314088f5013875ac656398d8a2ed19d2a85c8edd3ec2aef
    sources: [SRC-NEUROMANCER, SRC-PYECDSA]
    agreement: exact
    agreement_detail: >-
      Character-identical across both high-fidelity retrievals after
      normalisation.
    corroboration:
    - source: SRC-SEC2V2
      agreement: MISMATCH_ATTRIBUTED_TO_EXTRACTION
      detail: >-
        SRC-SEC2V2 returned a string agreeing on the first 44 hexadecimal
        characters and then diverging, with a total length exceeding 96. A
        >96-digit value is not a residue mod a 384-bit prime, so the returned
        string is incoherent as a parameter. Classified as extraction damage;
        listed under unresolved_conflicts because the classification rests on
        length reasoning rather than on inspection of the source page.
    intake_relation:
      intake_states_decimal_in_equation: >-
        27580193559959705877849011840389048093056905856361568521428707301988689241309860865136260764883745107765439761230575
      status: NOT_YET_ADJUDICATED
      note: obligation T0-O3 (hex/decimal equality, not computed here)
  - name: Gx
    role: base point x-coordinate
    value_hex: >-
      aa87ca22be8b05378eb1c71ef320ad746e1d3b628ba79b9859f741e082542a385502f25dbf55296c3a545e3872760ab7
    sources: [SRC-NEUROMANCER, SRC-PYECDSA]
    agreement: exact
    corroboration:
    - source: SRC-SEC2V2
      agreement: consistent_on_returned_prefix
      detail: >-
        SRC-SEC2V2's uncompressed point began 04 followed by a string matching
        the above; its compressed form began 03 followed by the same string. The
        03 prefix asserts an odd y; consistency of that assertion with the Gy
        below is obligation T0-O5.
  - name: Gy
    role: base point y-coordinate
    value_hex: >-
      3617de4a96262c6f5d9e98bf9292dc29f8f41dbd289a147ce9da3113b5f0b8c00a60b1ce1d7e819d7a431d7c90ea0e5f
    sources: [SRC-NEUROMANCER, SRC-PYECDSA]
    agreement: exact
    corroboration:
    - source: SRC-SEC2V2
      agreement: MISMATCH_ATTRIBUTED_TO_EXTRACTION
