  - name: h
    role: cofactor
    value: 1
    sources: [SRC-NEUROMANCER, SRC-SEC2V2]
    agreement: exact
    note: >-
      A cofactor of 1 is an ASSERTION BY THE SOURCES that #E = n. It is not a
      verification that #E = n. Obligation T0-O6 / lane L-BASE.
  - name: S
    role: generation seed
    value_hex: a335926aa319a27a1d00896a6773a4827acdac73
    bit_length_asserted: 160
    sources: [SRC-NEUROMANCER, SRC-SEC2V2]
    agreement: exact
    note: >-
      Both sources return the same 40-hex-character seed. This is the single most
