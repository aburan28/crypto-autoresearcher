honest_accounting:
  objects_considered: >-
    O1 the generation transcript state; O2 the multiplicative order ord_n(p);
    O3 the pair of order factorisation certificates; O4 the CM discriminant and
    conductor; O5 the exceptional divisor of a formula or model conversion;
    O0-NULL the null object. Each carries a lossy-projection test and a survival
    statement in audit-plan.yaml section 0.
  dominated_by: >-
    "n/a (no result claimed)" AS AN ATTACK - no lane computes or proposes to
    compute a discrete logarithm on P-384, so there is no time, memory or data
    exponent to place on any frontier. AS AN AUDIT INSTRUMENT, dominated on every
    axis by the standards' own parameter-validation procedures and by the
    SafeCurves verification scripts themselves, which already implement all
    eleven criteria and which this session could not even retrieve. The frontier
    rows checked before setting this are enumerated in
    audit-plan.yaml honest_accounting.dominated_by.as_an_audit_instrument
    (KN-TECH-001, KN-TECH-006, KN-TECH-018, KN-TECH-031, KN-TECH-032,
    KN-TECH-033, KN-TECH-035); none would be beaten by any lane, because no lane
    computes a discrete logarithm.
  sota_delta: >-
    ZERO against every attack baseline on every axis; no exponent moves. As data
    inside this program: the corpus holds 0 reconciled P-384 tuples, 0 of the 11
    criteria reproduced, 0 generation-transcript records and 0 embedding-degree
    values for any named deployed curve; full execution of the plan would produce
    19 certified rows. Delta 0 -> 19 rows in one repository, which is a
    bookkeeping delta and is not presented as a scientific advance.
  closures_enumerated: >-
    Three, each with a named obstruction, an argument, and forward guidance, in
    audit-plan.yaml honest_accounting.closures_enumerated:
    (1) rigidity cannot be VERIFIED by any transcript computation at any budget,
        because the seed's provenance is not a function of any curve data -
        forward guidance names the designer-freedom counting question as the
        class that remains;
    (2) a certified LOWER bound on |D| is not obtainable by partial
        factorisation, because more square factors monotonically decrease |D| -
        forward guidance names a squarefree-kernel certificate and direct
        End(E) certification as remaining classes;
    (3) full-size invalid-curve confinement is not measurable without 384-bit
        point counting - forward guidance names the reduced-size analogue with
        its transfer assumption and the tooling condition that would lift it.
  premature_closure_refused: >-
    No lane and no direction is declared impossible. The three closures are
    obstruction-plus-argument-plus-guidance, not a fatigue report. The plan
    explicitly names open, measurable questions the corpus has nothing on:
    the designer-freedom counting question, the D7 constructive witness search,
    and the D2 confinement measurement.
  novelty_status: known
  novelty_basis: >-
    Reproducing standardised curve parameters, checking a seeded generation
    transcript, and evaluating SafeCurves-style criteria are routine,
    long-published activities and the plan declares five established families
    (standards-body validation; SafeCurves itself; the seeded-generation /
    manipulated-standards literature; complete-formula and exceptional-case work;
    invalid-curve and small-subgroup work) OFF-LIMITS as sources of novelty
    claims. NOVEL WITHIN THIS PROGRAM ONLY AS DATA - the corpus has zero rows.
    The corpus screen was metadata-level (LIM-4) and the SafeCurves site was
    unreachable (LIM-3), so this label rests on a partial check and is recorded
    as `known` rather than upgraded.
  open_directions: >-
    Recorded in audit-plan.yaml honest_accounting.open_directions_for_the_next_session:
    (i) a fidelity-checked PDF text-extraction path, which is the binding
    constraint on the entire goal; (ii) the designer-freedom counting question,
    a genuinely different object from O1 with a measurable answer and nothing in
    the corpus; (iii) the Solinas-prime structure object, deliberately left open
    rather than closed; (iv) the portfolio question about the
    ecc_security_beyond_ecdlp category.
