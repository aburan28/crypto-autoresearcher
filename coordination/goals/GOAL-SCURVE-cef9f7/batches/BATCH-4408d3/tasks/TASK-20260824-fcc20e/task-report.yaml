# ---------------------------------------------------------------------------
# UNRESOLVED CONFLICTS BETWEEN INTAKE AND RETRIEVED SOURCES
# ---------------------------------------------------------------------------
unresolved_conflicts_summary:
- id: CONF-1
  short: >-
    The degraded SEC 2 v2.0 extraction returned p, b and Gy strings that differ
    from the two high-fidelity retrievals, in all three cases at a length that
    cannot be a 384-bit field element.
  working_classification: extraction artifact, not source conflict
  why_still_open: >-
    The classification rests on string-length reasoning, not on reading the SEC 2
    page. PDF page rendering is unavailable in this environment.
  goal_pause_condition_assessment: >-
    Does NOT yet trigger goal pause_condition #3. A damaged extraction is a
    tooling failure, and tooling failures are operational observations, never
    evidence. It WOULD trigger it if a clean fidelity-checked extraction of a
    primary source still disagreed. THE COORDINATOR ADJUDICATES; this is the Idea
    Generator's reading only.
- id: CONF-2
  short: >-
    Zero of the nine SafeCurves pages named in the handoff inputs were retrieved
    (HTTP 502 on safecurves.cr.yp.to across https and http and three distinct
    paths; web.archive.org refused by the runtime). The eleven criterion
    DEFINITIONS and the published P-384 row are entirely unretrieved.
  consequence: >-
    Every criterion definition in the audit plan is marked `recalled`. No lane
    may adjudicate an intake cell against a recalled definition. Nothing from
    safecurves.cr.yp.to is paraphrased anywhere in these artifacts.
  intake_vs_retrieved: >-
    The intake's eleven True/False cells therefore stand UNCHALLENGED AND
    UNCONFIRMED. That is not agreement; it is absence of a comparison.
- id: CONF-3
  short: >-
    The deterministic generation specification (the seed-to-coefficient hash
    chain) was not retrieved on four attempts across three documents
    (SP 800-186, SEC 1 v2.0, eprint 2014/571). All three PDFs downloaded but
    their text layers were unusable.
  consequence: >-
    L-RIGID, the flagship diagnostic, cannot start. Its procedure statement in
    the audit plan is explicitly marked RECALLED_HYPOTHESIS_NOT_A_SPECIFICATION
    and every detail in it - increment rule, concatenation order, truncation,
    the value of t, the relation's sign and constant - is flagged as a hypothesis
    to be replaced by the R0 retrieval before any implementation.
- id: CONF-4
  short: >-
    A source-labelling ambiguity, not a value conflict: the aggregator prints a
    field called "Discriminant" whose digit length matches p, which is the
    signature of the WEIERSTRASS discriminant reduced mod p, not the CM
    discriminant that the `disc` criterion and diagnostic D5 concern.
  why_it_is_recorded_as_a_conflict: >-
    Silently adopting the printed value as the CM discriminant would void lane
    L-DISC while producing a plausible-looking number. It is preregistered as a
    hazard so it cannot be discovered after the fact.
  resolution_route: L-EQ recomputes the Weierstrass discriminant; L-DISC/D5
    computes the CM discriminant independently; the two are compared.

