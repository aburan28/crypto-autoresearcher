diagnostics_coverage_statement: >-
  All eight declared additional diagnostics are addressed: D1, D2, D3, D5, D6,
  D7 by lanes above; D4 by explicit reuse of IDEA-20260807-98a970; D8 by
  L-RIGID. ONE PARTIAL DEFERRAL IS RECORDED: D2 part (c), the full-size
  invalid-curve confinement measurement, whose reason (no 384-bit point counting)
  and successor condition are written into D2.deferral_record_if_needed. No other
  diagnostic is deferred.

# ===========================================================================
# 4. NAMED HEURISTIC ASSUMPTIONS
# ===========================================================================
heuristic_assumptions:
- id: H-TWIST-1
  used_by: [L-TWIST, D1, D2]
  statement: >-
    The twist order n' = p + 1 + t, as an integer of 384 bits, has the same
    smoothness profile as a uniformly random integer of that size: for u = log
    n' / log y, the proportion of such n' that are y-smooth is asymptotically
    rho(u), the Dickman-de Bruijn function.
  rigorous_support: >-
    The Canfield-Erdos-Pomerance theorem gives this for UNIFORMLY RANDOM
    INTEGERS. It is NOT a theorem about curve orders, and there is no proof that
    p + 1 + t for a standardised curve behaves this way. The assumption is that
    n' imitates the CEP/Dickman distribution.
  validation_plan:
    what_to_sample: >-
      Twist orders n'_b = p + 1 + t_b for curves y^2 = x^3 - 3x + b over the SAME
      p, b ranging over a sample.
    shortcut_making_sampling_feasible: >-
      HONEST PROBLEM: computing t_b at 384 bits requires SEA and is infeasible
      here. The feasible route is to sample at a REDUCED FIELD SIZE (64-96 bit p)
      where counting is cheap, and to sample 200 uniformly random 384-bit
      INTEGERS at full size as the size-matched control (NULL-TWIST). BOTH
      SAMPLES ARE REPORTED; neither alone validates the assumption.
    sample_size: 500 reduced-size curves; 200 full-size random integers
    comparison_distribution: >-
      Empirical CDF of u = log n' / log(largest prime factor) against
      rho(u), plotted and reported with a Kolmogorov-Smirnov statistic.
    tail_check: >-
      The SMOOTHEST observed sample must be consistent with rho(u) at its u -
      i.e. the observed minimum-u sample should not be more extreme than
      rho(u_min) * sample_size would predict by more than a stated factor.
    transfer_assumption_stated: >-
      Transferring the reduced-size curve statistics to 384 bits assumes the
      smoothness profile of p+1-t is size-independent after normalising by u.
      THAT IS AN ASSUMPTION, IT IS NOT VALIDATED BY THIS PLAN, and every
      conclusion depending on it inherits its conditionality.
- id: H-DISC-1
  used_by: [L-DISC, D5]
  statement: >-
    The integer M = 4p - t^2 has the square-part distribution of a uniformly
    random integer of its size: the probability that a prime q > B divides M
    twice is about 1/q^2, so P(M has a repeated prime factor > B) is about
    sum_{q > B} 1/q^2, which is about 1/(B log B).
  rigorous_support: >-
    Exact for uniformly random integers by inclusion-exclusion over q^2. NOT a
    theorem about 4p - t^2 for a standardised curve. It is the assumption that M
    imitates a random integer in this one respect.
  validation_plan:
    what_to_sample: >-
      M_b = 4p - t_b^2 for the reduced-size sample of H-TWIST-1, plus 200
      uniformly random integers of the size of M at full 384-bit size.
    comparison_distribution: >-
      Empirical distribution of log2(square part) against the predicted
      sum_{q > B} 1/q^2 tail, with B = 10^7 the trial-division bound actually
      used.
    tail_check: >-
      The largest observed square part in the sample must not exceed the value
      predicted to occur once in a sample of that size by more than a stated
      factor.
    transfer_assumption_stated: same reduced-size transfer caveat as H-TWIST-1
- id: H-INV-1
  used_by: [D2 part (c1)]
  statement: >-
    For random b, the smooth part below 10^7 of #E_b = p + 1 - t_b has the same
    distribution as the smooth part below 10^7 of a uniformly random integer near
    p.
  rigorous_support: >-
    None at 384 bits. The closest rigorous statements are Deuring-style counts of
    curves with a given trace and the CEP theorem for random integers; the
    assumption is that the composition of the two behaves like the random-integer
    case.
  validation_plan:
    what_to_sample: reduced-size (64-96 bit) curves where t_b is computable
    sample_size: 500
    comparison_distribution: >-
      empirical distribution of log2(smooth part) versus the random-integer
      prediction, reported with the same KS statistic
    tail_check: the smoothest observed order versus the predicted frequency
    transfer_assumption_stated: >-
      Explicit and unvalidated: that the distribution normalises across a
      6x change in field size. Every D2(c1) number is conditional on it.
- id: H-ORD-1
  used_by: [L-TRANSFER, D4]
  statement: inherited verbatim from IDEA-20260807-98a970 (the ord_N(p) random-element
    behaviour used for its arithmetic null control)
  rigorous_support: see IDEA-20260807-98a970
  validation_plan: see IDEA-20260807-98a970.null_object_control ARITHMETIC NULL;
    not restated here

# ===========================================================================
# 5. CONTROL BATTERY SUMMARY (must run before belief in any lane)
# ===========================================================================
control_battery:
  ordering_rule: >-
    For every lane, its positive control runs FIRST, its null control SECOND, its
    parameter-matched negative THIRD, and only then is the P-384 measurement
    INTERPRETED. A lane whose positive control fails emits NO statement about
    P-384. This ordering is preregistered and may not be reordered after seeing a
    result.
  positive_controls:
  - {id: PC-0, target: T0, object: P-384 with Gy+1, must: fail every check}
  - {id: PC-3, target: 'L-LADDER, L-IND, D6', object: Curve25519, must: find
      2-torsion, build Montgomery A, apply Elligator 2, round-trip}
  - {id: PC-4, target: L-RIGID, object: brainpoolP384r1 via RFC 5639 (plain
      text, retrievable), must: reproduce coefficients from published seed
      exactly, BLOCKING}
  - {id: PC-5, target: L-RIGID, object: 'NIST P-256, P-224', must: reproduce
      under the identical code path}
  - {id: PC-DISC-1, target: 'L-DISC, D5', object: BN(2,254) after source
      verification, must: return |D| = 3 and h = 1}
  - {id: PC-TWIST-1, target: 'L-TWIST, D2', object: constructed smooth-twist toy
      curve, must: find the small factors}
  - {id: PC-COMPLETE-1, target: 'L-COMPLETE, D7', object: standard Jacobian
      formulas, must: find their known exceptional cases}
  - {id: PC-RHO, target: L-RHO, object: generated 40-50 bit group, must: match
      0.886*sqrt(N) within a factor 2 over >= 20 instances}
  - {id: PC-ANOM, target: L-TRANSFER, object: the Anomalous row after source
      verification, must: flag n = p}
  positive_control_caveat: >-
    PC-3, PC-DISC-1, PC-ANOM and PC-5 all reference curves whose parameters
    currently exist in this program ONLY as user-supplied intake in the bootstrap
    manifest. Per GOAL-SCURVE-cef9f7.claim_boundaries item 3, THEIR PARAMETERS
    AND BEHAVIOUR REQUIRE SOURCED REPRODUCTION BEFORE USE AS CONTROLS. A control
    built on unverified intake is not a control.
  parameter_matched_negatives:
  - {id: NC-0, target: T0, object: n replaced by a same-length composite}
  - {id: NC-EQ, target: 'L-EQ, D3, D7', object: 'same p, b'' = b + 1'}
  - {id: NC-2, target: L-RIGID, object: same tuple, seed with one bit flipped}
  - {id: NC-LADDER, target: 'L-LADDER, L-IND, D6', object: 'same p, a = -3,
      b'''' = -(r^3 - 3r) for a chosen r, giving rational 2-torsion'}
  - {id: NC-DISC, target: 'L-DISC, D5', object: 'same p, b'' = b + 1'}
  - {id: NC-TWIST, target: 'L-TWIST, D1, D2', object: 20 curves at the same p
      with random b}
  - {id: NC-RHO, target: L-RHO, object: same shape, order 2^-64 smaller}
  same_shape_nulls:
  - {id: NULL-0, target: T0, object: 100 random 384-bit odd integers as p,
      predicted acceptances 0}
  - {id: NULL-1, target: L-RIGID, object: 1000 random 160-bit seeds, predicted
      reproductions 0, BLOCKING}
  - {id: NULL-EQ, target: 'L-EQ, D3', object: 1000 random b at the same p}
  - {id: NULL-LADDER, target: L-LADDER, object: 1000 random b at the same p,
      predicted 2-torsion fraction about 1/2}
  - {id: NULL-DISC, target: 'L-DISC, D5', object: 200 random integers of M's
      size under the identical budget}
  - {id: NULL-TWIST, target: 'L-TWIST, D1, D2', object: 200 random 384-bit
      integers under the identical budget}
  - {id: NULL-RHO, target: L-RHO, object: structureless set of the same size,
      walk must fail}
  - {id: NULL-IND, target: L-IND, object: uniform random strings into the
      decoder, must not round-trip}
  - {id: NULL-COMPLETE, target: L-COMPLETE, object: coefficient-perturbed
      formulas}
  - {id: NULL-D7, target: D7, object: coefficient-perturbed formulas}
  why_the_nulls_matter_here_specifically: >-
    Almost every preregistered prediction in this plan is a NEGATIVE ("no
    degenerate flag", "no small |D|", "no rational 2-torsion", "no exceptional
    case in 10^7 samples"). A pipeline that silently does nothing produces every
    one of those negatives. THE NULLS AND POSITIVES ARE THE ONLY THING SEPARATING
    THIS AUDIT FROM A PIPELINE THAT PRINTS "FINE" - which is why they are
    blocking and why they run first.

# ===========================================================================
# 6. PRIORITISATION
# ===========================================================================
prioritisation:
  first_to_run: L-RIGID (with its blocking precondition R0)
  why_first: >-
    (1) It is the cheapest lane on the board once its source is in hand: three
    SHA-1 evaluations and one modular comparison, under a millisecond of compute,
    against 1800 s and 1200 s for the factorisation lanes.
    (2) It is the only lane that DISCRIMINATES BETWEEN TWO SUBSTANTIVELY
    DIFFERENT EXPLANATIONS (E1 vs E2 above) of an intake cell, rather than
    confirming an expected value. Every other lane's preregistered prediction is
    the expected one; L-RIGID's outcome changes what may honestly be said about
    the `rigid: false` cell either way.
    (3) Its certificate is the strongest and shortest in the plan - about 200
    bytes, re-verifiable by anyone in a millisecond, with no tolerance and no
    model dependence.
    (4) Its controls are unusually sharp: PC-5 (P-256 and P-224 under identical
    code) cleanly separates "our implementation is wrong" from "something is
    specific to P-384", which is the confound that would otherwise dominate.
    (5) Its blocking precondition R0 is a RETRIEVAL, and retrieval is exactly
    what this session failed at - so running it first surfaces the campaign's
    real bottleneck immediately rather than after 5000 s of factoring.
  order:
  - {rank: 0, item: T0, reason: everything else consumes its certified tuple}
  - {rank: 0, item: 'R0, ADJ-DEFN', reason: retrieval preconditions, run in
      parallel with T0 since they need no compute}
  - {rank: 1, item: L-RIGID / D8, reason: see why_first}
  - {rank: 2, item: 'L-FIELD, L-EQ, L-BASE', reason: microseconds each, and D3
      and L-LADDER depend on their outputs}
  - {rank: 3, item: L-LADDER + D6, reason: one gcd settles L-LADDER, half of
      L-IND and two of D6's five conversions - the best certificate-per-second
      ratio after L-RIGID}
  - {rank: 4, item: L-TRANSFER / D4, reason: inherited machinery, 120 s, closes
      a lane the corpus has never populated}
  - {rank: 5, item: 'L-RHO, D3', reason: cheap arithmetic, but the toy
      calibration is 900 s}
  - {rank: 6, item: 'L-IND, L-COMPLETE, D7', reason: implementation-property
      lanes; valuable but they cannot change any ECDLP statement}
  - {rank: 7, item: 'L-TWIST, D1, D2', reason: the most expensive lanes and the
      ones most likely to end in a certified PARTIAL result}
  - {rank: 8, item: 'L-DISC, D5', reason: expensive, and its headline number is
      conditional on H-DISC-1 no matter how long it runs}
  budget_total_estimate_seconds: 13000 CPU across all lanes and controls,
    excluding retrieval; this EXCEEDS the goal's remaining campaign budget and
    the Coordinator must therefore choose a prefix of the order above rather
    than assume the whole plan fits.

# ===========================================================================
# 7. HONEST ACCOUNTING (docs/inventor-protocol.md 5)
# ===========================================================================
honest_accounting:
  objects_considered: [O1, O2, O3, O4, O5, O0-NULL]
  objects_rejected_this_session:
  - object: >-
      The isogeny class of E as a tracked object (walking to a "better" curve
      in the same class)
    reason_rejected: >-
      Fails the usefulness half of the lossy-projection test for THIS goal: it is
      genuinely lossy and genuinely propagates, but IDEA-20260807-98a970's
      reachability_gate already records that no F_p-isogeny changes k, since p
      and n are class invariants. So the object cannot move any quantity this
      audit measures. Recorded because the rejection is itself information: the
      audit's conclusions are class invariants, which is why they are stable.
  - object: The bit-level structure of the Solinas prime p
    reason_rejected: >-
      It is a performance and implementation-correctness object, not a
      parameter-security object, and this program has no measurement that would
      make it discriminating here. NOT DECLARED CLOSED - see open_directions.
  dominated_by:
    as_an_attack: >-
      n/a - NO RESULT IS CLAIMED AND NO ATTACK IS PROPOSED. Every lane is a
      measurement or a certificate. There is no time, memory or data exponent to
      place on any frontier because nothing here computes a discrete logarithm on
      P-384 or claims to.
    as_an_audit_instrument: >-
      Dominated on every axis by the standards' own parameter-validation
      procedures (ANSI X9.62 / SEC 1 style), which are older, mandated,
      independently implemented many times over, and have been run on this curve
      for two decades; and by the SafeCurves verification scripts themselves,
      which already implement all eleven criteria and which this session could
      not even retrieve. This plan dominates neither on speed, coverage,
      authority, nor originality. Its ONLY delta is that its outputs would land
      in this program's ledger with re-verifiable certificates and explicit
      controls attached.
      Frontier rows checked before setting this: rho at 0.886*sqrt(n) with O(1)
      memory (KN-TECH-001, KN-TECH-006), BSGS at sqrt(n) time and memory
      (KN-TECH-031) with its n^{2/3+o(1)} full cost (KN-TECH-035),
      automorphism-discounted rho on CM curves (KN-TECH-018), MOV/Frey-Ruck at
      small k (KN-TECH-032), the anomalous additive transfer (KN-TECH-033).
      Each was checked for whether any lane below would beat it on time, memory
      or data. NONE WOULD, because no lane computes a discrete logarithm.
  sota_delta:
    against_attack_baselines: >-
      ZERO on every axis. No exponent moves. Time, memory and data deltas versus
      every frontier row above are exactly 0.
    as_data_in_this_program: >-
      Quantified: the corpus currently holds 0 reconciled parameter tuples for
      P-384, 0 of the 11 SafeCurves criteria reproduced for it, 0
      generation-transcript records, and 0 embedding-degree values or bounds for
      any named deployed curve (the last per IDEA-20260807-98a970's own novelty
      screen). This plan, if executed in full, would produce 11 criterion rows
      plus 8 diagnostic rows, each with a certificate or an explicit bound, plus
      a base-rate null for each. Delta: 0 -> 19 certified rows.
    honesty_note: >-
      A delta measured in rows added to one repository is a bookkeeping delta. It
      is not a scientific advance and this record does not present it as one.
  closures_enumerated:
  - closure: >-
      Rigidity cannot be VERIFIED by any transcript computation, at any budget.
    named_obstruction: The seed's provenance is not a function of any curve data.
    argument: >-
      A transcript audit certifies b = F(S) for a public F. The rigidity question
      is whether S was chosen to make F(S) land on a curve with an undisclosed
      property. Answering it requires information about the CHOICE of S, which is
      not recoverable from (p, a, b, G, n, h, S) by any computation - S is an
      input, not an output. So the strongest certifiable claim of L-RIGID is
      "b = F(S)", and no amount of compute upgrades it to a rigidity verdict.
    forward_guidance: >-
      What REMAINS open and is not closed by this: (i) FALSIFYING a reproduction
      claim, which L-RIGID does do; (ii) measuring the SIZE of the designer's
      freedom - how many curves a designer trying seeds could have reached within
      a stated work bound, and what fraction of them would carry a given
      property. That is a counting question with a measurable answer, it is a
      different object from O1, and this plan does not attempt it.
  - closure: >-
      A certified LOWER bound on the CM discriminant |D| is not obtainable by
      partial factorisation.
    named_obstruction: >-
      Finding more square factors monotonically DECREASES |D|, so partial
      factorisation yields an upper bound, never a lower one.
    argument: See L-DISC.the_honest_bound_problem.
    forward_guidance: >-
      Remaining classes: (i) a squarefree-kernel certificate for M, if one exists
      cheaply, would close it rigorously; (ii) the conditional route via H-DISC-1
      is what the plan actually uses and it is labelled conditional throughout;
      (iii) an entirely different route - certifying End(E) directly - is not
      attempted and is not claimed impossible.
  - closure: >-
      Full-size invalid-curve confinement (D2 part c) is not measurable in this
      environment.
    named_obstruction: no SEA / point counting over a 384-bit prime field
    argument: 10^4 point counts at 384 bits is far beyond a pure-Python budget.
    forward_guidance: >-
      Reduced-size analogue (c1) with H-INV-1's transfer assumption stated, or a
      scoped handoff once a verified counting capability exists. Deferral, reason
      and successor condition are recorded in D2, not omitted.
  premature_closure_check: >-
    No lane is declared impossible. The three closures above are each a NAMED
    OBSTRUCTION with an argument and forward guidance, not a fatigue report. The
    plan explicitly refuses the claim that this target is exhausted: the D7
    constructive witness search, the D2 confinement measurement and the
    designer-freedom counting question named above are all open, all measurable,
    and none is in the corpus.
  open_directions_for_the_next_session:
  - >-
    THE HIGHEST-VALUE OPEN QUESTION SURFACED BY THIS SESSION IS A TOOLING ONE:
    three primary standards documents (SP 800-186, SEC 1 v2.0, eprint 2014/571)
    and the entire SafeCurves site were unreachable at usable fidelity. A
    fidelity-checked PDF text-extraction path with a length-check acceptance test
    would unblock R0, ADJ-DEFN and CONF-1 simultaneously. Nothing in this goal
    can be adjudicated against a primary source until that exists.
  - >-
    The designer-freedom counting question named in the first closure: how large
    is the reachable set of curves under a stated seed-search work bound, and
    what fraction carries a given measurable property. It is a genuinely
    different object from O1, it has a measurable answer, and this program has
    nothing on it.
  - >-
    The Solinas-prime structure object, deliberately not closed above. If a
    measurement can be defined that makes it discriminating for parameter
    security rather than only for performance, it becomes a lane; none is defined
    here.
  - >-
    The four SafeCurves criteria whose intake cells are `false` (rigid, ladder,
    complete, ind) are all in the "beyond ECDLP" category. Whether the program
    should treat that category as in-scope at all is a Coordinator question, not
    an Idea Generator one, and it is raised rather than answered.

target_complexity:
  time_exponent: >-
    NO ATTACK EXPONENT IS CLAIMED OR PROPOSED. The audit's own cost is stated
    per lane above and totals about 13000 CPU-seconds. The most expensive
    components are two 384-bit partial factorisations (L-TWIST, L-DISC) and one
    10^6-modular-multiplication order bound (L-TRANSFER).
  memory_exponent: >-
    O(log p) working memory for every lane; certificates are O(log p) bytes each
    except L-TRANSFER's lower-bound certificate, which is O(1) to store but costs
    K = 10^6 multiplications to VERIFY - explicitly not succinct.
  best_known: >-
    rho at 0.886*sqrt(n) with O(1) memory (KN-TECH-001, KN-TECH-006) is the
    relevant attack frontier for this curve; this plan does not approach it and
    does not try to.
  hidden_overhead: >-
    The two largest hidden costs are honestly disclosed rather than absorbed:
    (i) L-TWIST and L-DISC will very likely end in CERTIFIED PARTIAL results with
    a large unfactored cofactor, and the plan predicts that in advance;
    (ii) H-TWIST-1, H-DISC-1 and H-INV-1 are validated only at reduced field size
    and their transfer to 384 bits is an unvalidated assumption carried into
    every number that depends on them.
  tradeoff_note: >-
    One real tradeoff internal to the audit, in L-TRANSFER: an exact k requires
    factoring n-1 (expensive to produce, succinct to verify) versus a bound k > K
    (cheap to produce, K multiplications to verify). The run record must state
    which route each row took. No time-memory tradeoff of the van Oorschot-Wiener
    kind arises, because no lane runs a collision search on P-384.

estimated_cost:
  implementation: medium
  compute: medium
recommended_priority_within_goal: >-
  HIGH for L-RIGID / R0 (cheapest valid discriminator, sharpest certificate,
  surfaces the campaign's real bottleneck). MEDIUM for T0, L-LADDER, L-TRANSFER.
  LOW for D3, which by its own admission moves 0.5 bits on a 192-bit exponent and
  is a completeness building block, not a result.
