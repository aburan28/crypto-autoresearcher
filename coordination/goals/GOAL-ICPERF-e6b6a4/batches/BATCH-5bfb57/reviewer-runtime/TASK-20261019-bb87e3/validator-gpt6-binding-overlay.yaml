schema_version: 1
notes: >-
  Local candidate for one independent ICPERF review-adversarial session. Model
  capabilities copy the committed openai-gpt6 coordinator binding; this file
  is operator-supplied and does not assert global model verification.
bindings:
  openai-gpt6:
    review-adversarial:
      model: gpt-6-sol
      provenance: operator-supplied
      last_probed: null
      capabilities:
        max_reasoning_effort: max
        tool_use: true
        structured_output: true
        context_tokens: 180000
        max_output_tokens: 32000
      request:
        max_tokens: 32000
        reasoning: {mode: openai_effort, effort_map: {high: high, xhigh: xhigh, max: max}}
