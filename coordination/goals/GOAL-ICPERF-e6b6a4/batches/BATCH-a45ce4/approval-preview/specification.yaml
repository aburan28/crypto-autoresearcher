    - 5
    - 6
    - 7
    - 8
    positive_cells: 6
    natural_cells: 21
    natural_target_count: 7
    natural_targets: one fixed public known-answer group point per arity, shared by three arms
    representation: chained S3 for m summands; coset quadratic lift, controls direct encoding
    direct_S8_note: Direct S8 represents seven summands plus a target; eight summands require S9 or a chain. No direct S8
      solver comparison is in this panel.
