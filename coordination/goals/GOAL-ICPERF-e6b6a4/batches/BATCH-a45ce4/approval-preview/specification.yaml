  - experiments/EXP-ICPERF-891f7f/runs/<allocated-RUN-ID>/check.stdout.log
  - experiments/EXP-ICPERF-891f7f/runs/<allocated-RUN-ID>/check.stderr.log
  - experiments/EXP-ICPERF-891f7f/runs/<allocated-RUN-ID>/manifest.yaml
  - experiments/EXP-ICPERF-891f7f/runs/<allocated-RUN-ID>/raw-result.json
