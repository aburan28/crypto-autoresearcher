  input_integrity: Re-hash every bound file before any panel output. Independently replay public curve, target, polynomial
    and planted-point identities. The Sage binary and term order are fixed. A mismatch is invalid preparation, not a scientific
    solver outcome. No target-dependent base selection is allowed.
  schedule:
    order: Frozen execute.schedule order; six positives first, followed by 21 archived natural systems in their input order.
    positive: One m=2 and one m=8 planted system per arm, each with a private witness checked only by the independent checker.
    natural: For each m=2..8, exactly one public target is shared by the coset, random and small-x arms; target scalar is
      used only for independent known-answer checking.
    independent_variables:
    - name: base_arm
      levels:
      - coset
      - random
      - small_x
    - name: arity_m
      levels:
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
    - name: cell_kind
      levels:
      - positive
      - natural
    no_adaptive_selection: Every cell is prelisted; no successful arm chooses later inputs or caps.
  solver_and_certificate:
    backend: Bound 63-bit Sage polynomial ring and Groebner basis path; default width guard is not raised in an unvalidated
      engine.
    model_guard: Count standard monomials of the leading ideal; above 64 record model_cap_censored before variety enumeration.
    no_solution: Unit Groebner basis is a certificate only for the exact encoded ideal; other UNSAT reports are not promoted.
    root_check: Independently recompute all polynomials modulo p, exact B=475 base membership, coset gate, curve-point lifts,
      all signed sums and the full target point.
    positive_check: An ok positive response must contain the archived planted witness. A certified_no_solution response for
      a positive with an independently replayed satisfying witness is an invalid solver or encoding contradiction. Timeout,
      memory, scratch and model-cap responses remain censored.
    false_roots: Preserve and classify non-lifting, wrong-base, wrong-sign, duplicate and wrong-point candidates. A rejected
      root is never counted as a relation.
    rank_rule: Distinct certified coefficient vectors are reported separately from modular useful rank; this pilot does not
      perform relation collection or linear algebra.
  controls:
  - Equal-realized-size random and small-x bases share each natural target and per-cell cap with the coset arm.
  - Six separately planted positive systems test m=2 and m=8 in each arm; a solver certificate must pass an independently
    implemented point check.
  - Altered polynomial root, base point, target point, sign and coordinate objects must be rejected by the independent checker
    before launch readiness is accepted.
  - The archived <=32-bit complete-engine regression and independent 63-bit arithmetic vectors must pass on unchanged source
    bytes.
  - The checker replays response bytes from panel/raw.tar.gz and panel/receipt.json without trusting the producer's summaries
    or disposable scratch cell files.
  - All 27 calls use the same backend hash, one-thread configuration, term order, model guard and resource caps.
  metrics:
    primary:
    - Per-cell attempted/unattempted state and exact terminal classification.
    - Per-cell solver wall and CPU seconds, sampled peak process-tree RSS, peak scratch bytes and minimum free bytes.
    - Number of roots returned, independently valid polynomial roots, base-member point lifts, full-point certificates and
      rejected false roots.
    - Number of planted controls certified, censored or invalid by arm and arity.
    - Any exposed maximal intermediate Groebner/Macaulay degree with trace and definition; otherwise degree_of_regularity
      is unmeasured.
    secondary:
    - Input monomial support, equation count, variable count and serialized bytes for direct and lifted systems.
    - Groebner basis size, quotient standard-monomial count, matrix dimensions and density if instrumented; missing measurements
      stay null.
    - Cold base-generation and 16-seed scan time, all failed attempts and false-root filtering CPU when separately measured;
      otherwise null.
    - SHA256 of all source, input, command, raw and checker artifacts; host load and software versions.
    - Natural certified relation count and distinct rows as descriptive counts only; useful rank remains null without modular
      elimination.
  cost_accounting:
    cold_single_target: C_FB + B*C_dec/(q_rel*rho_rank) + C_LA + C_target_attempt/q_target + C_verify, with every quantity
      left unestimated until measured.
    amortized: Report separately only for an explicitly stated target count T sharing the identical setup, with setup charged
      once across T.
    this_pilot_measures: Per-cell bounded solve, checks and selected input-preparation observations where instrumented.
    not_measured: Complete relation-collection yield, marginal rank, linear algebra, held-out target solve, complete cold-start
      S, matched rho and Bernstein-Lange setup-excluded comparison.
    comparison_rule: Any later quantitative E2E claim needs matched complete baseline/candidate evidence, independent verification
      and a passing claims/*.json progress-fidelity record.
  budget:
    enforcement: machine protection and fixed sample count; not a campaign spending cap
    maximum_runs: 1
    maximum_workers: 1
    cells: 27
    per_cell_wall_seconds: 300
    per_cell_sampled_tree_rss_bytes: 8589934592
    scratch_bytes: 8589934592
    start_free_bytes: 17179869184
    continue_free_bytes: 8589934592
    total_panel_wall_seconds: 14400
    model_cap: 64
    note: The panel cap is a safety watchdog and scientific censoring boundary. ECC campaign budget remains unlimited.
  stopping_rules:
  - The Sage runtime guard must match its committed interpreter and imported-package manifest before invoking the unchanged
    panel driver or creating panel output.
  - Refuse before any task output or Sage process if approved plan, source hash, current published claim, ordinary ready selector
    or supervisor-bound launch fails.
  - Stop before the panel on changed input replay, arithmetic regression, checker altered-root control, Sage binary hash or
    insufficient scratch headroom; retain failure evidence.
  - Attempt positives first. An invalid positive certificate or monitor failure stops later cells and records each unattempted
    cell; a well-formed censored positive remains censored and does not become a negative relation result.
  - At 300 seconds, sampled 8 GiB RSS, 8 GiB scratch or minimum-free threshold, stop only the bounded cell, retain logs and
    continue if machine and integrity state remain safe.
  - At four hours, mark every unattempted remaining cell panel_wall_censored and retain the full scheduled list.
  - Never retry an ambiguous call in the same run directory; a retry needs a new run ID and additive authorization.
  invalidation_rules:
  - Any changed bound source or input, unsupported arithmetic, forged status, wrong full-point certificate or missing independent
    replay invalidates the affected instrument, not the mathematical existence of a decomposition.
  - A unit-ideal or certified_no_solution claim for a planted positive with a checked satisfying assignment is invalid instrument
    output, never a censored positive.
  - Missing raw stdout, stderr, request, response when claimed, receipt, tar member, or hash is an archival integrity failure;
    no missing cell is silently removed.
  - A reported ok root without exact polynomial, base, lift and full-point verification is invalid output.
  - Solver-reported UNSAT without a unit-ideal certificate is unvalidated, not proved absent.
  - Host loss, watchdog termination and memory/scratch stops are censored or infrastructure outcomes as appropriate.
  decision_impact:
    on_positive: A planted full-point certificate supports bounded solver-to-certificate feasibility for that exact arm and
      arity; natural certificates justify a separately designed powered yield and full-cost experiment.
    on_negative: A valid at-cap failure weakens only the predicted bounded feasibility of the exact planted cell; natural
      censored or uncertified cells do not decide decomposition coverage or factor-base ranking.
    all_positive_and_backend_controls_pass: Validate bounded solver-to-certificate feasibility for these exact controls; then
      separately design a powered natural-target and complete-cost panel.
    planted_control_censored: Record an unresolved bounded feasibility cell and review the exact cap and solver trace before
      any prospective successor; do not infer no decomposition.
    positive_unit_ideal_contradiction: Stop interpretation, preserve the Groebner basis and witness, and repair and independently
      replay the exact backend and encoding before any new trial.
    backend_or_checker_invalid: Return the exact defect to implementation, preserve raw evidence and do not rank bases.
    natural_certified_relation: Establish only that the exact target has a certified relation under the selected base; require
      deduplication, rank and complete cost before performance inference.
    natural_no_certified_relation_or_timeout: No coverage or yield conclusion from one target per arity; revisit base size
      and powered sampling under a new frozen protocol.
  success_criterion: All arithmetic, independent checker and archived regression controls pass; each of six planted positives
    receives a full-point certificate inside its cap, and all 21 natural calls are attempted or carry an explicit justified
    safety/total-panel censoring record. Success is bounded interface feasibility only, not a speedup.
  falsification_criterion: A reproducible, independently checked wrong accepted root invalidates the interface. A planted
    positive not certified within a valid bounded cell refutes its corresponding at-cap feasibility prediction only. It does
    not refute the known planted point identity or natural decomposition existence.
  required_artifacts:
