  objective: 'Test the validated 63-bit backend and independent full-point checker on a bounded 27-cell panel: six separately
    planted positive systems plus 21 natural common-target systems for B=475 coset, random and small-x bases at m=2..8. Record
    every raw and censored outcome. This is a feasibility pilot; it does not measure a complete index-calculus speedup.'
  scope:
    curve: short-Weierstrass prime-field curve bound by the archived systems and controls
    p: '9223372021248595841'
    subgroup_order_r: '9223372018953067627'
    subgroup_order_bits: 63
    base_points_per_arm: 475
    arms:
    - coset
    - random
    - small_x
    arities:
