  - experiments/EXP-ICPERF-891f7f/runs/<allocated-RUN-ID>/panel/raw.tar.gz
  archive_rule: The fixed panel receipt lists every generated per-cell request, response, stdout and stderr with hashes; panel/raw.tar.gz
    preserves their bytes. The top-level tar is byte-identical. The exact run handoff and archive task must cover all supervisor
    files and all declared fixed panel files. Disposable scratch cell files are replayable from the canonical tar.
  approval_preconditions:
  - Allocate/check a run ID and freeze one trial plan with exact driver/check commands, source/input hashes, artifact list,
    resource limits and canonical queue path.
  - Commit and push the exact specification, trial plan, executor handoff and queue; publish a lawful goal lane with the same
    queue path.
  - Obtain experiment_preapproval.py --packet approvable true for the exact prospective approved specification and every declared
    artifact path.
  - Record and archive a Coordinator approval decision under standing user authorization, then require newest_experiments.py
    to report execution_state ready for this experiment before dispatch.
  - Publish a live executor goal-lane claim with exact owner/epoch; the standard supervisor must bind its launch before driver
    or checker outputs.
  - Use the independently tested additive guard as check_argv; reject a unit-ideal response for any independently satisfying
    planted positive.
  assigned_to: executor
  interpretation_limits:
  - One public natural target per m and sequential arm order make runtime and yield descriptive only; no statistical base
    ranking.
  - Fixed B=475 has very low signed-multiset target-coverage ceilings through m=6, independent of solver quality.
  - Sparse input equations can acquire dense Groebner intermediates; input support is not degree of regularity.
  - Natural relations need verified useful rank, linear algebra and held-out target work before a complete IC cost can be
    computed.
  - This curve and subgroup do not transfer measured costs to Koblitz or ordinary binary curves without separate trials.
