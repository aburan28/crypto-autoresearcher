  # -------------------------------------------------------------------
  # Q2 -- ARE THE PUBLISHED DESCENT ANALYSES ON THE TREE OR THE DAG?
  # -------------------------------------------------------------------

  - id: SRC-SCREEN-BGJT
    short: Barbulescu, Gaudry, Joux, Thome -- quasi-polynomial DLP
    citation: >-
      R. Barbulescu, P. Gaudry, A. Joux, E. Thome, "A quasi-polynomial
      algorithm for discrete logarithm in finite fields of small
      characteristic", arXiv:1306.4244 (= eprint 2013/400; EUROCRYPT 2014).
    provenance: retrieved
    verified_by: red-team (TASK-20260915-532164)
    read_as: >-
      Full text read via the ar5iv LaTeX-to-HTML rendering at
      https://ar5iv.labs.arxiv.org/html/1306.4244 on 2026-09-15. This is the
      arXiv preprint rendering, NOT the published EUROCRYPT 2014 version; the
      two are not certified identical here.
    also_in_corpus: KN-LIT-2078
    also_in_corpus_provenance: kb
    also_in_corpus_note: >-
      The corpus holds an abstract-level literature note only
      (knowledge/literature/KN-LIT-2078.md). The descent-tree passages below are
      NOT in the corpus note and rest on the retrieved full text.
    quotes:
      - id: BGJT-Q1
        where: complexity analysis of the descent, immediately before Theorem 3
        text: >-
          "Each internal node of the descent tree corresponds to one application
          of the algorithm of Proposition 2, therefore each internal node has a
          cost which is bounded by a polynomial in q and k. The total cost of the
          descent is therefore bounded by the number of nodes in the descent tree
          times a polynomial in q and k. The depth of the descent tree is in
          O(log k). The number of nodes of the tree is then less than or equal to
          its arity raised to the power of its depth, which is (q^2 k)^{O(log k)}."
        bears_on: >-
          Q2, first half. The canonical quasi-polynomial analysis is charged on
          the TREE, as arity^depth, not on the DAG. The idea's premise is CORRECT
          for this family; the "already on the DAG" collapse the task card hoped
          for does NOT hold here.
      - id: BGJT-Q2
        where: "section 6.2, 'Practical improvements'"
        text: >-
          "Because of the arity of the descent tree, the breadth eventually
          exceeds the number of polynomials below some degree bound. It makes no
          sense, therefore, to use the descent procedure beyond this point, as the
          recovery of discrete logarithms of all these polynomials is better
          achieved as a pre-computation. Note that this corresponds to the
          computations of the L(1/4+epsilon) algorithm which starts by
          pre-computing the logarithms of polynomials up to degree 2. In our case,
          we could in principle go up to degree O(log q) without changing the
          complexity."
        bears_on: >-
          Q2, second half, and this is the load-bearing quote of the screen.
          "the breadth eventually exceeds the number of polynomials below some
          degree bound" IS mechanism M1 of IDEA-20260915-5c407a and IS the
          pigeonhole crossover j* of H-ICPERF-5f038b, published in 2013. The
          prescribed remedy is to stop descending there and precompute the whole
          pool; and the remedy is stated to be COMPLEXITY-NEUTRAL ("without
          changing the complexity"). Regime R3's exponent content is therefore
          foreclosed for this family by a published argument, even though the
          headline bound is written on the tree.
      - id: BGJT-Q3
        where: concluding section
        text: >-
          "One of the key factors which hinders the practical efficiency of this
          algorithm is the O(q^2 D) arity of the descent tree, compared to the
          O(q) arity achieved by techniques based on Groebner bases [15] at the
          expense of a L(1/4+epsilon) complexity."
        bears_on: >-
          The arity, not the sharing, is the published practical bottleneck.

  - id: SRC-SCREEN-GUILLEVIC
    short: Guillevic -- individual discrete logarithms in GF(p^n) with NFS-DL
    citation: >-
      A. Guillevic, "Computing Individual Discrete Logarithms Faster in GF(p^n)
      with the NFS-DL Algorithm", arXiv:1505.07553 (ASIACRYPT 2015).
    provenance: retrieved
    verified_by: red-team (TASK-20260915-532164)
    read_as: >-
      Full text read via https://ar5iv.labs.arxiv.org/html/1505.07553 on
      2026-09-15 (arXiv rendering, not the published proceedings version).
    also_in_corpus: KN-LIT-3055
    also_in_corpus_provenance: kb
    quotes:
      - id: GUI-Q1
        where: section 1.3 (complexity summary)
        text: >-
          "The NFS algorithm for DL in prime and large characteristic fields has
          a dominating complexity of L_Q[1/3,(64/9)^{1/3} ~= 1.923]. For the
          individual DL in a prime field F_p, the norm of the target preimage in
          the number field is bounded by p. This bound gives the running time of
          this fourth step (much smaller than relation collection and linear
          algebra)."
      - id: GUI-Q2
        where: section 1.2 (history of the individual-logarithm step)
        text: >-
          "In 2013, Barbulescu [4, sec.4, sec.7.3] gave a tight analysis of the
          individual DL computation for prime fields, decomposed in three steps:
          booting (also called smoothing), descent, and final combination of
          logarithms. The booting step has an asymptotic complexity of
          L_p[1/3,1.23] and the descent step of L_p[1/3,1.21]. The final
          computation has a negligible cost."
      - id: GUI-Q3
        where: section 1.2
        text: >-
          "In 2006, Commeine and Semaev [11] analyzed the Joux-Lercier method.
          They obtained an asymptotic complexity of L_p[1/3,3^{1/3} ~= 1.44] for
          computing individual logarithms, independent of the relation collection
          and linear algebra phases."
    bears_on: >-
      Q2. For NFS-DL the SPECIFIC special-q descent step costs L_p[1/3,1.21],
      strictly below the booting step (1.23) that dominates its own phase, which
      is itself far below the L_Q[1/3,1.923] that dominates the algorithm. Any
      reduction in descent node count -- constant, or growing with depth --
      cannot move the NFS-DL exponent, because two other stages bound it from
      above. This forecloses R3's exponent content for the special-q family for a
      reason INDEPENDENT of whether the analysis is written on the tree.

  - id: SRC-SCREEN-COMMEINE-SEMAEV
    short: Commeine & Semaev -- DLP with the number field sieve
    citation: >-
      A. Commeine, I. Semaev, "An Algorithm to Solve the Discrete Logarithm
      Problem with the Number Field Sieve" (PKC 2006).
    provenance: kb
    verified_by: red-team (TASK-20260915-532164)
    read_as: >-
      Resolved through the kb index to the corpus record
      knowledge/literature/KN-LIT-2459.md, which this agent read. The PAPER was
      NOT read. The corpus note itself carries `confidence: reported` and a
      "Not verified here" block stating its claims were relayed from the
      abstract during a 2026-07-24 bulk seeding pass.
    corpus_record: KN-LIT-2459
    quotes:
      - id: CS-Q1
        where: KN-LIT-2459 "Key claims (as reported)"
        text: >-
          "The global running time is again Lp[1/3, 1.9018...], but in contrast
          with Matyukhins method, this algorithm enables us to calculate
          individual logarithms in a separate stage in time Lp[1/3, 3^{1/3}],
          once a Lp[1/3, 1.9018...] time costing pre-computation stage has been
          executed."
    bears_on: >-
      Q2, and it is the exact reference IDEA-20260915-5c407a cites as `recalled`
      for "the conventional tree-charged cost model this idea questions". The
      screen converts that pointer to `kb`: the record exists in this program's
      corpus and its reported claim is that the individual-logarithm stage costs
      L_p[1/3, 1.44] against an L_p[1/3, 1.9018] precomputation -- i.e. the phase
      the idea wants to make cheaper is already asymptotically subdominant. The
      same number is independently confirmed by SRC-SCREEN-GUILLEVIC (GUI-Q3),
      which this agent DID read, so the conclusion does not rest on the
      unverified corpus note alone.

  - id: SRC-SCREEN-KLEINJUNG-WESOLOWSKI
    short: Kleinjung & Wesolowski -- provable quasi-polynomial DLP
    citation: >-
      T. Kleinjung, B. Wesolowski, "Discrete logarithms in quasi-polynomial time
      in finite fields of fixed characteristic", arXiv:1906.10668 (J. AMS 35
      (2022)).
    provenance: retrieved
    verified_by: red-team (TASK-20260915-532164)
    read_as: >-
      ABSTRACT PAGE ONLY (https://arxiv.org/abs/1906.10668), fetched and read on
      2026-09-15. The body was NOT read and the internal descent accounting was
      NOT verified.
    quotes:
      - id: KW-Q1
        where: abstract
        text: >-
          "We prove that the discrete logarithm problem can be solved in
          quasi-polynomial expected time in the multiplicative group of finite
          fields of fixed characteristic. More generally, we prove that it can be
          solved in the field of cardinality p^n in expected time
          (pn)^{2 log_2(n) + O(1)}."
    bears_on: >-
      Q2, WEAKLY and as a pointer only. The exponent 2 log_2(n) + O(1) has the
      shape (per-step factor)^(number of halving levels), which is consistent
      with tree-style accounting, but this screen did NOT read the proof and does
      NOT assert that the bound is charged on a tree. Anyone relying on this must
      read the body. Recorded here so the next reader does not have to rediscover
      the candidate.

