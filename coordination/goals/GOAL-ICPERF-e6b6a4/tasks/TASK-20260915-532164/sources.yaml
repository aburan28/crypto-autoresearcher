  - id: SRC-SCREEN-F2-30750
    short: Granger, Kleinjung, Lenstra, Wesolowski, Zumbragel -- 30750-bit binary DL record
    citation: >-
      "Computation of a 30750-Bit Binary Field Discrete Logarithm",
      arXiv:2008.02717 (Math. Comp.).
    provenance: retrieved
    verified_by: red-team (TASK-20260915-532164)
    read_as: >-
      Full text read via https://ar5iv.labs.arxiv.org/html/2008.02717 on
      2026-09-15 (arXiv rendering).
    quotes:
      - id: F2-Q1
        where: section 10.1 "Descent Analysis"
        text: >-
          "In order to optimise the overall computational cost we employ a
          bottom-up approach in our analysis. This means that for every degree
          d = 2, 3, 4, ... we determine the expected cost of computing a
          logarithm of an element represented by a polynomial of degree d. This
          cost is the sum of finding a (good) representation as a product of
          lower degree polynomials (the 'direct cost'), plus the expected total
          cost of the factors appearing in the product, based on the earlier cost
          estimations for degrees < d (the 'subsequent cost')."
      - id: F2-Q2
        where: Table 2 ("Rounded cost estimations used in the descent phase")
        text: >-
          Degrees 2, 3, 4, 5, 6, 7 and 8 are each assigned cost 0; degree 9 is the
          first nonzero entry (0.3). The cost unit is normalised to one degree-16
          elimination.
      - id: F2-Q3
        where: Table 3 ("Initial split and classical descent: schedule and running times")
        text: >-
          The expensive classical descent processed "#polys" = 1 at each of
          degrees 1024, 672, 466, 130, 106, 64, 45, 40, 38 and 35, i.e. a single
          polynomial per degree, before the counts rise (3, 3, 3, 2, 4, 3, 2, 4,
          8, 5, 9, 12, 12, 19, 43, 39, 116, 209, 592 at degrees 34 down to 13).
      - id: F2-Q4
        where: section 2 / introduction
        text: >-
          "A highly optimised classical descent using the above elimination costs
          as input in order to apply a dynamic programming approach."
    bears_on: >-
      Q1 and Q2, in the concrete-cost register. In the largest published binary
      field DL computation: (a) the EXPENSIVE part of the descent is essentially
      a PATH -- one polynomial per degree down to degree 35 -- so there is no
      sharing to be had where the cost is; (b) the levels where the pigeonhole
      crossover would bite (degrees <= 8) are charged cost ZERO because their
      logarithms are obtained by precomputation and non-classical elimination;
      (c) the per-level counts actually reported (max 592, at degree 13, over
      F_{2^30}) are astronomically below the level pool (monic irreducibles of
      degree 13 over F_{2^30} number ~ 2^{390}/13), so rho_j ~ 1 by many orders
      of magnitude throughout the costed region. The paper reports "#polys"
      eliminated per degree and charges cost per eliminated polynomial; it does
      not state whether duplicates were removed, and this screen does not assert
      that it does.

  - id: SRC-SCREEN-GKZ-128
    short: Granger, Kleinjung, Zumbragel -- breaking '128-bit secure' supersingular binary curves
    citation: >-
      R. Granger, T. Kleinjung, J. Zumbragel, "Breaking '128-bit Secure'
      Supersingular Binary Curves (or how to solve discrete logarithms in
      F_{2^{4.1223}} and F_{2^{12.367}})", arXiv:1402.3668 (CRYPTO 2014).
    provenance: retrieved
    verified_by: red-team (TASK-20260915-532164)
    read_as: >-
      Full text read via https://ar5iv.labs.arxiv.org/html/1402.3668 on
      2026-09-15 (arXiv rendering).
    also_in_corpus: KN-LIT-2804
    also_in_corpus_provenance: kb
    quotes:
      - id: GKZ-Q1
        where: section 2 (overview)
        text: >-
          "Afterwards, in the individual logarithm phase, one applies procedures
          to recursively rewrite each element as a product of elements of smaller
          degree, in this way building up a descent tree, which has the target
          element as its root and factor base elements as its leaves."
      - id: GKZ-Q2
        where: section 5 (computational results)
        text: >-
          "This automatically provided the logarithms of all degree 2 elements
          over F_{2^12}." and, where the pool was too large to precompute, "we
          were able to eliminate degree 2 elements over F_{2^24} on the fly".
    bears_on: >-
      Q1/Q2. The literature word is indeed "tree" (GKZ-Q1), confirming the idea's
      framing claim. GKZ-Q2 shows the operative practice: where the level pool is
      small enough for pigeonhole to bite, ALL its logarithms are precomputed;
      where the pool is too large to precompute, elements are eliminated on the
      fly and sharing does not bite. That is the BGJT-Q2 prescription in action.

  - id: SRC-SCREEN-CADO-DESCENT
    short: CADO-NFS descent implementation
    citation: >-
      CADO-NFS, files `scripts/descent.py` and `sieve/las-descent-trees.hpp`,
      master branch.
    provenance: retrieved
    verified_by: red-team (TASK-20260915-532164)
    read_as: >-
      Source read on 2026-09-15 from the GitHub mirror
      https://raw.githubusercontent.com/sethtroisi/cado-nfs/master/... . THE
      CANONICAL REPOSITORY (gitlab.inria.fr/cado-nfs/cado-nfs) COULD NOT BE
      REACHED from this session (404 on raw paths; api.github.com returned 403),
      so the exact upstream revision is NOT pinned. A reader who needs the
      canonical revision must re-fetch. This is a real provenance limitation and
      is not smoothed over.
    quotes:
      - id: CADO-Q1
        where: scripts/descent.py, todo-list construction for the initial split
        text: |
          for q in fnum + fden:
              if q in large_q:
                  continue
              if self.logDB.has(q,-1,0):
                  continue
      - id: CADO-Q2
        where: scripts/descent.py, todo-list construction from descent relations
        text: |
          ideal = ideals_above_p(p, 1, a, b, side, general)
          if ideal.get_log() != None:
              continue
          else:
              r = a_over_b_mod_p(a, b, p)
              f.write("1 %d %d\n" % (p, r))
      - id: CADO-Q3
        where: scripts/descent.py, class LogBase
        text: |
          class LogBase(object):
              def __init__(self, general):
                  self.known={}
              ...
              def has(self,p,r,side):
                  return (p,r,side) in self.known
              def get_log(self, p,r,side): ...
              def add_log(self,p,r,side,log):
                  self.known[(p,r,side)] = log
      - id: CADO-Q4
        where: sieve/las-descent-trees.hpp
        text: |
          /* This is an ugly temporary hack */
          typedef std::set<relation_ab> visited_t;
          visited_t visited;
          ...
          bool must_avoid(relation const& rel) const {
              relation_ab ab = rel;
              bool answer = visited.find(ab) != visited.end();
              return answer;
          }
    bears_on: >-
      Q3. CADO-NFS maintains a global table `known` keyed on the canonical ideal
      (p, r, side), consults it before putting an ideal on the descent todo list
      (CADO-Q1, CADO-Q2), and writes newly deduced logarithms back into it
      (`add_log`). That is exactly the memo table IDEA-20260915-5c407a proposes,
      in a serious, widely used implementation. TWO HONEST QUALIFICATIONS: (i)
      the `visited` set of CADO-Q4 is a duplicate-RELATION guard, not node
      memoisation, and is self-described as "an ugly temporary hack"; (ii) the
      todo-file writer in CADO-Q1/CADO-Q2 carries no within-file de-duplication
      that this agent could see, so the same (p, r) reached from two relations in
      one level may be written twice. No quantification of the saving was found
      anywhere.

