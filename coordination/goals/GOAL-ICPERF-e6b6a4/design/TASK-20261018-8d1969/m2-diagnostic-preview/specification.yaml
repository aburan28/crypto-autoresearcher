experiment:
  id: EXP-ICPERF-1f13e8
  version: 1
  title: Prime63 m=2 planted-positive phase-traced diagnostic under the repaired monitor
  goal_id: GOAL-ICPERF-e6b6a4
  question_id: RQ-ICPERF-94c86e
  hypothesis_id: H-ICPERF-05021b
  batch_id: BATCH-15089b
  status: approved
  approved_by: DEC-20261018-70e7c5
  execution_authorized: true
  frozen: true
  designed_at: '2026-10-18'
  designed_by: coordinator
  designed_by_decision: DEC-20261018-1e362f
  objective: >-
    Locate, by phase, where each of the three archived m=2 planted positives
    (coset quadratic_lift, random direct, small-x direct) spends wall time and
    sampled process-tree memory under one bounded instrumented call, and
    determine whether any call returns a root that an independent checker lifts
    to a full-point relation. Diagnostic only; no factor-base ranking, natural
    yield, rank, linear algebra or complete index-calculus cost.
  scope:
    curve: short-Weierstrass prime-field curve bound by the archived planted systems
    p: '9223372021248595841'
    subgroup_order_r: '9223372018953067627'
    subgroup_order_bits: 63
    base_points_per_arm: 475
    cells:
    - {cell: coset-m2, arm: coset, encoder: quadratic_lift, variables: 25, equations: 26}
    - {cell: random-m2, arm: random, encoder: direct, variables: 3, equations: 4}
    - {cell: small_x-m2, arm: small_x, encoder: direct, variables: 3, equations: 4}
    historical_censors: >-
      The six 300-second censors of RUN-ICPERF-7ed866 stay historical evidence of
      EXP-ICPERF-891f7f and are not retried under that run or experiment.
  input_bindings:
    positive_public:
      path: research/icperf_prime63_pilot_launcher_20261017/planted_public.json.gz
      sha256: 0e86d86ff133870829c5432e58d08c0907e5e8940c149799b68299c65cfb7309
    positive_witnesses:
      path: research/icperf_prime63_pilot_launcher_20261017/planted_witnesses.json
      sha256: c9049b0c4fac1c83ca057d6da27e0c4a2cbfe52272aeab113beb419e068a2c0c
    natural_systems_reference:
      path: research/icperf_prime_475_target_systems_20261017/systems.json.gz
      sha256: 4bb75b65b843a4b7ce8c0b7d8521d80a95b958f061e0ddf516639296a15fb589
    backend:
      path: research/icperf_prime_wide_backend_retry_20261017/backend.py
      sha256: 30f9310997833836b0ca7a080a84b5b4b2fcc4231167045d9636596dbd46b7c5
    monitor:
      path: research/icperf_prime63_monitor_phase_20261018/monitor.py
      sha256: e788c7f08f6d32e1ca910627559ff923ff01899a5769f1d74fbc309b06663c8a
    phase_trace:
      path: research/icperf_prime63_monitor_phase_20261018/phase.py
      sha256: f91b6725c83e4aec3340080ca14a091c66a4e9e12f29ac9042d54f853a3262d0
    instrumented_backend:
      path: research/icperf_prime63_monitor_phase_20261018/instrumented_backend.py
      sha256: ad90753f42135bc2aeb0c3af12acf85289ae46b3ecc85afec8babafad2179c82
    monitor_source_archive:
      path: coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-4379b2/archives/TASK-20261018-a2cf7c/snapshot-receipt.json
      sha256: f6bcc4556bc5828b91d60763e2732a28d0a6df1dd6429405323436ad165adcf7
    diagnostic_launcher:
      path: research/icperf_prime63_m2_diagnostic_20261018/execute.py
      sha256: UNIMPLEMENTED
    independent_checker:
      path: research/icperf_prime63_m2_diagnostic_20261018/check.py
      sha256: UNIMPLEMENTED
    request_manifest:
      path: research/icperf_prime63_m2_diagnostic_20261018/input_manifest.json
      sha256: UNIMPLEMENTED
  input_integrity: >-
    Re-hash every bound file before any output; extract the three m=2 requests
    byte for byte from planted_public.json.gz and match their published
    digests. A mismatch is invalid preparation, not a solver outcome.
  schedule:
    order: null-monitor-fault control first, then coset-m2, random-m2, small_x-m2
    attempts_per_cell: 1
    no_adaptive_selection: Every cell, cap and order is prelisted; no outcome selects later inputs or limits.
  solver_and_certificate:
    backend: Bound 63-bit Sage polynomial-ring and Groebner path via instrumented_backend.py with the frozen cap-before-variety model guard.
    model_guard: Standard-monomial count above 64 records model_cap_censored before variety enumeration.
    root_check: >-
      The independent checker evaluates every encoded polynomial at each
      returned root modulo p, verifies each selected point is on the archived
      curve and in the archived 475-point base, checks the signed full-point sum
      equals the archived target, and rejects a root with one changed
      coordinate. It does not use the producer's variety() output as proof and
      binds its own source hash.
  controls:
  - A synthetic monitor fault-injection null control runs first with no Sage algebra and must end infrastructure_monitor_error with raw trace retained and no zero-RSS substitution for the unreadable live child.
  - Altered-root, altered-point, altered-sign and altered-target objects must be rejected by the independent checker before any scientific call.
  - All three calls share one backend hash, one-thread configuration, term order, model guard and resource caps.
  metrics:
    primary:
    - Per-cell terminal classification (certified, timeout_censored, model_cap_censored, rss_cap_censored, infrastructure_monitor_error, invalid).
    - Per-phase start/end/error monotonic nanoseconds for input_load, polynomial_ring, groebner, model_count, root_enumeration, response_write.
    - Sampled peak process-tree RSS per phase, scratch bytes and minimum free bytes, with null where telemetry is unavailable.
    - Returned roots, independently valid polynomial roots and full-point certificates per cell.
    secondary:
    - SHA-256 of every source, request, partial trace, response, stdout and stderr; host load and software versions.
  budget:
    enforcement: machine protection and fixed sample count; not a campaign spending cap
    maximum_runs: 1
    maximum_workers: 1
    scientific_calls: 3
    per_call_wall_seconds: 600
    per_call_sampled_tree_rss_bytes: 8589934592
    scratch_bytes: 8589934592
    start_free_bytes: 17179869184
    continue_free_bytes: 8589934592
    model_cap: 64
    total_watchdog_seconds: 2100
  stopping_rules:
  - Refuse before any Sage process if source/input hashes, approved plan, published claim or supervisor binding fail.
  - Stop the scientific sequence if the null monitor control does not produce its expected fail-closed state.
  - Continue after an independently checked certificate, a bounded timeout or a model-cap censor.
  - Stop immediately after a monitor fault, lost raw custody, hash mismatch, checker disagreement or resource cap; record later cells unattempted.
  - Never extend a cap inside this protocol; a retry needs a new run ID and additive authorization.
  invalidation_rules:
  - A returned root accepted without exact polynomial, base, lift and full-point verification is invalid output.
  - A certified_no_solution or unit ideal for a planted positive with an archived satisfying witness is an instrument contradiction, never a censor.
  - Missing raw trace, request, stdout, stderr, response when claimed, or any hash is an archival integrity failure.
  - Missing response after an unclassifiable monitor fault is infrastructure/invalid, never zero roots.
  decision_impact:
    on_positive: >-
      An independently checked certificate shows only that this exact positive
      system has a valid witness under the tested source and limits, with its
      phase cost; it permits designing a separately frozen m=2 natural-yield and
      rank protocol, not a factor-base selection.
    on_negative: >-
      A phase-traced timeout or model-cap censor locates the stage reached and
      its wall/RSS bounds only; it redirects solver or formulation design and
      infers no root count, Groebner degree or absence of decomposition.
    checker_contradiction: Preserve both artifacts and require independent backend/encoding review before any cost comparison.
    monitor_or_null_control_failure: Infrastructure classification; repair and retest instrumentation before a fresh contract.
  success_criterion: >-
    The null monitor control fails closed as specified, and every attempted
    positive call ends in an independently checked certificate or a justified
    bounded censor with a complete hash-bound phase trace. Success is
    diagnostic feasibility of the instrumented interface only, not a speedup.
  falsification_criterion: >-
    A reproducible independently checked wrong accepted root invalidates the
    interface. A valid at-cap censor refutes only that positive's bounded
    feasibility at these limits, not the planted identity or natural
    decomposition existence.
  required_artifacts:
  - experiments/EXP-ICPERF-1f13e8/runs/RUN-ICPERF-2bce53/launch.json
  - experiments/EXP-ICPERF-1f13e8/runs/RUN-ICPERF-2bce53/execution-receipt.json
  - experiments/EXP-ICPERF-1f13e8/runs/RUN-ICPERF-2bce53/command.txt
  - experiments/EXP-ICPERF-1f13e8/runs/RUN-ICPERF-2bce53/environment.json
  - experiments/EXP-ICPERF-1f13e8/runs/RUN-ICPERF-2bce53/stdout.log
  - experiments/EXP-ICPERF-1f13e8/runs/RUN-ICPERF-2bce53/stderr.log
  - experiments/EXP-ICPERF-1f13e8/runs/RUN-ICPERF-2bce53/check.stdout.log
  - experiments/EXP-ICPERF-1f13e8/runs/RUN-ICPERF-2bce53/check.stderr.log
  - experiments/EXP-ICPERF-1f13e8/runs/RUN-ICPERF-2bce53/manifest.yaml
  - experiments/EXP-ICPERF-1f13e8/runs/RUN-ICPERF-2bce53/raw-result.json
  - experiments/EXP-ICPERF-1f13e8/runs/RUN-ICPERF-2bce53/phase-trace.jsonl
  - experiments/EXP-ICPERF-1f13e8/runs/RUN-ICPERF-2bce53/raw.tar.gz
  assigned_to: executor
  interpretation_limits:
  - Three single-attempt positives give descriptive phase observations only; no statistical comparison of arms.
  - Serialized input support is not degree of regularity, Groebner complexity or relative runtime.
  - Sampled RSS can miss short spikes between samples.
  - Nothing here measures natural relation yield, useful rank, linear algebra, target descent, complete cold/online cost or matched rho, nor transfers to Koblitz or ordinary-binary curves.
