      result: >-
        NOT explicitly, in run_manifest.yaml's own DEV-1 through DEV-4 list
        or anywhere in writeup.md. However, this IS textually licensed:
        PREREG-8 section 1 point 1's own frozen text (the document
        BINDING-CARRIED for this Stage-0 task, per this review's own task
        handoff) explicitly allows "BKZ.reduction (or the equivalent BKZ2.0
        entry point the installed version exposes)" -- the BKZReduction
        class is a defensible reading of "equivalent BKZ2.0 entry point."
        The EXP-MLKEM-42ea04 spec's own narrower `method:` field appears to
