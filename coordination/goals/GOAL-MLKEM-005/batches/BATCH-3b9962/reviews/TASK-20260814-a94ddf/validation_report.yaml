        follow-up task is not sized on a false premise.
      probe: none (direct `pip3 index versions fpylll` and `pip3 download`
        output in this session's own transcript).
      status: SINGLE-SOURCE (minor, scopes recommendation 2(b) accurately).

    - id: ART-9-UNDISCLOSED-METHOD-DEVIATION-FROM-EXP-SPEC
      check: >-
        EXP-MLKEM-42ea04/specification.yaml's own `lattice_reduction.method`
