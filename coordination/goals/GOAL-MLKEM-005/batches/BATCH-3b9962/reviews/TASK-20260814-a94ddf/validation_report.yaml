    - id: ART-5-ROOT-CAUSE-NOT-A-PYTHON-API-CHOICE-BUG
      check: >-
        THE TASK'S CENTRAL QUESTION, part 1. Does the ReductionError persist
        if the producer's own choice of the pure-Python
        `fpylll.algorithms.bkz2.BKZReduction` class (which builds its own
        internal GSO at a hardcoded 'double' float_type with no automatic
        precision escalation) is replaced with fpylll's NATIVE C++
        convenience function `BKZ.reduction(A, par)` (float_type=None,
        i.e. fplll's own automatic precision choice -- the SAME general
        call style the producer's own worker_toy_floor() uses successfully
        at d=8/d=12, and the literal method EXP-MLKEM-42ea04's own
        specification names: "method: BKZ.reduction, block_size = beta")?
      result: >-
        NO -- the error persists, and in a WORSE form. `BKZ.reduction(A,
        par)` at the identical (d=256, beta=40, seed=1398073216) also fails
        with "infinite loop in babai" at the C++ level, but the exception is
        NOT cleanly caught as a Python fpylll.util.ReductionError: it
        surfaces as an uncaught `std::runtime_error` that calls
        std::terminate (visible as "terminate called after throwing..." on
        stderr), which this environment's cysignals interception converts
        into a Python-catchable "RuntimeError: Aborted" rather than a clean
        ReductionError -- a DIFFERENT, arguably WORSE failure mode than the
        producer's own reported one. This rules out "the producer chose the
        wrong fpylll API entry point" as the explanation: BOTH the class-
        based and the native, spec-named entry point fail on this exact
        instance.
      probe: probes/probe_native_bkz.py, probes/probe_native_bkz_d256_beta40.json.
      status: SINGLE-SOURCE (new finding; not attempted by the producer).

    - id: ART-6-ROOT-CAUSE-NOT-A-PRECISION-PARAMETER-BUG
      check: >-
        THE TASK'S CENTRAL QUESTION, part 2. The producer's own out-of-band
        diagnostic (environment.json stage0_infrastructure_finding) reports
        float_type="mpfr" also failed "effectively instantly," but this
        session independently confirmed `fpylll.FPLLL.get_precision()`
        defaults to 53 bits -- IDENTICAL to 'double' precision -- unless
        raised explicitly via `FPLLL.set_precision(bits)`, which the
        producer's own disclosed diagnostic gives no indication of having
        called. Does the error resolve if MPFR precision is raised
        EXPLICITLY, well beyond 53 bits?
      result: >-
        NO, even at substantially higher explicit precision. Confirmed
        FPLLL.get_precision() == 53 by default in this environment (own
        direct check, see precision_default_check.txt) -- so the producer's
        own mpfr diagnostic almost certainly ran at the SAME 53-bit
        precision as 'double', which would explain why it "failed
        identically, effectively instantly" without actually testing
        whether MORE precision helps. This session closes that gap: tested
        float_type='mpfr' at 212 bits AND at 424 bits (roughly 4x and 8x
        double precision), both via FPLLL.set_precision() called BEFORE GSO
        construction (the correct API for raising MPFR precision in
        fpylll -- GSO.Mat itself has no `precision=` kwarg, confirmed by a
        TypeError caught in this session's own first, incorrect attempt at
        this test, corrected in a second probe). BOTH FAILED, identically,
        at the SAME point. Also tested float_type='long double' explicitly
        (a cheaper higher-than-double option) -- also failed identically.
        CONCLUSION: this is NOT a precision-insufficiency artifact
        resolvable by raising MPFR precision within the range tested (up to
        424 bits); the producer's own inconclusive mpfr finding is
        independently EXTENDED and CONFIRMED (with the added, load-bearing
        correction that the producer's own diagnostic almost certainly never
        tested a precision above 53 bits, though the substantive conclusion
        --failure persists -- holds regardless once tested properly).
      probe: probes/probe_root_cause_precision.py,
        probes/probe_root_cause_precision_d256_beta40.json,
        probes/probe_root_cause_precision2.py,
        probes/probe_root_cause_precision2_d256_beta40.json,
        probes/precision_default_check.txt.
      status: >-
        SINGLE-SOURCE (new finding -- identifies and closes a real gap in
        the producer's own out-of-band mpfr diagnostic, while confirming
        their bottom-line conclusion).

    - id: ART-7-ROOT-CAUSE-IS-DIMENSION-DEPENDENT-NOT-BETA-DEPENDENT
      check: >-
        THE TASK'S CENTRAL QUESTION, part 3 -- the decisive test. Is the
        failure dimension-dependent (a genuine numerical/algorithmic
        boundary in fplll's own babai/LLL implementation for this q=3329
        q-ary lattice family), or does it also occur at dimensions the
        producer's own toy-floor sweep (d<=20, beta_toy<=10) never actually
        stress-tested with a realistic beta? Swept d in {32,48,64,96,128,
        160,192,224} at a FIXED, cheap beta=10 (well below every main-grid
        beta) using the fastest available reproduction path.
      result: >-
        MAJOR FINDING, SINGLE-SOURCE, LOAD-BEARING. Clean, sharp dimension
        boundary: d in {32,48,64,96,128,160} ALL COMPLETE successfully
        (0.007s-3.8s), d in {192,224} BOTH FAIL identically (infinite loop
        in babai), at beta=10 -- a beta far smaller than any of the 6
        main-grid cells (40/55/70) and far larger than the toy-floor sweep's
        own beta_toy<=10 at its OWN much smaller d<=20. Narrowed the
        boundary further with individually-isolated, fresh-process re-checks
        (avoiding a "terminate called recursively" artifact observed when
        multiple aborts share one process) at d in {160,168,176,184,192,
        224}: d<=184 completes, d>=192 fails, cleanly and reproducibly, in
        every case checked. This demonstrates the failure is DIMENSION-
        DEPENDENT (a real property of this fplll 0.6.4 build's numerical
        behavior on this lattice family around d~190), NOT beta-dependent
        and NOT resolved by the choice of Python entry point (ART-5) or by
        precision (ART-6). This directly answers the task's central
        question: the evidence assembled across ART-5/ART-6/ART-7 is
        substantially MORE consistent with "a genuine fplll/fpylll
        numerical-stability limitation for random q-ary lattices at
        q=3329 above d~190" than with "a producer-script parameter-
        construction or basis-construction bug" -- the basis construction
        itself (`IntegerMatrix.random(d,"qary",k=d//2,q=3329)`) is the
        SAME idiomatic pattern shown in fpylll's own bundled docstring
        example (fpylll/algorithms/bkz.py's own doctest:
        `IntegerMatrix.random(60,"qary",k=30,q=127)`), not an unusual or
        incorrect construction.
      probe: probes/probe_dimension_sweep.py,
        probes/probe_dimension_sweep_results.json,
        probes/probe_dimension_single.py,
        probes/probe_dimension_single_results.txt.
      status: SINGLE-SOURCE (new finding; the producer's own bounded
        diagnostic tested only d=256/512, all failing, and d<=20 at
        beta_toy<=10, all succeeding -- leaving the entire d in
        [21,255] boundary uncharacterized; this review fills that gap and
        pins the boundary to d=184 (works) / d=192 (fails)).

    - id: ART-8-LATEST-PYPI-VERSION-CONFIRMATION
      check: >-
        Is fpylll 0.6.4 (the version this task installed via `pip3 install
