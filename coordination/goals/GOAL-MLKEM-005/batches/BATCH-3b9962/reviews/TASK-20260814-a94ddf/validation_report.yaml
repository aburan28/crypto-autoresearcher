  control_checks:
    - id: CTRL-1-TERMINATION-BRANCH-RE-DERIVATION
      control: >-
        Re-derive, from PREREG-8 section 2.3 and section 4.3 item 1's own
        frozen text (not by trusting the producer's own reading), whether
        T-PROJNOISE-NODATA is the CORRECT branch for "0/6 cells cleared, but
        via a deterministic ERROR well inside the cap, not a cap-timeout
        NOT_COMPUTED" -- a case PREREG-8 section 2.3's own literal words
        ("A cell that does NOT complete within the cap is DROPPED... and
        reported NOT_COMPUTED") do not describe.
      result: >-
        AGREE with the producer's own determination, with the gap
        explicitly named rather than silently smoothed over (matching what
        the producer's own writeup.md section 2.3 already does). Section
        2.3's literal "DROPPED" language is textually tied to the cap-
        timeout/NOT_COMPUTED case specifically; a definite, reproducible,
        non-timeout ERROR is a case its literal words do not anticipate.
        However, section 4.3 item 1's own MEANS clause is broader than
        section 2.3's literal DROPPED wording: "this attempt did not
        produce usable data at the affected scope, for a reason OTHER than
        the hypothesis's own content" -- and an ERROR outcome satisfies that
        MEANS clause exactly as well as a cap-timeout does (in both cases,
        zero cells produced a completed reduction, for a reason unrelated
        to C1/C2's truth). Given that: (a) the executor holds no authority
        to amend PREREG-8's frozen text (explicitly barred by this task's
        own constraints); (b) the only two textually available outcomes are
        CLEARED (plainly false -- no reduction completed) or the
        T-PROJNOISE-NODATA branch under its own broader MEANS reading; and
