run_manifest:
  task_id: TASK-20260814-ffd791
  goal_id: GOAL-MLKEM-005
  batch_id: BATCH-3b9962
  experiment_id: EXP-MLKEM-42ea04
  hypothesis_id: H-MLKEM-7d9bcc
  hypothesis_status_unchanged: proposed
  experiment_status_unchanged:
    status: review_required
    approved_by: null
  prereg_scope: "PREREG-8 section 1 (infrastructure re-verification) and section 2 (Stage 0 feasibility benchmark) ONLY -- section 3 (Stage 1) NOT run"

  base_commit:
    sha: e9894ed0dccd9f555ab13307afdc6d3b8f0361d9
    branch: claude/launch-research-harness-1ns6z3
    confirmed_ancestor_of_head: true
    tree_state_at_run_start: clean (no unstaged/staged changes; only new
      untracked files under this task's own write_scope)

  role: executor
  requested_policy: executor-implementation
  requested_effort: medium
  resolved_model_id: claude-sonnet-5
  fallback_used: false
  fallback_reason: null

  seed_policy:
    seed_root: 715923
    formula: "default_rng([SEED_ROOT, stage_index, d, beta, arm_index, draw_index])"
    stage_index_used: 0   # section-1 checks and Stage-0 draws both use stage_index=0
                            # (section 1's own checks are infrastructure smoke tests,
                            # not Stage-1/NULL-3 draws, and PREREG-8 section 3.5 reserves
                            # stage_index=1/3 for those; 0 is Stage 0's own value)
    per_cell_seeds_main_grid:
      "d=256,beta=40": 1398073216
      "d=256,beta=55": 1615872610
      "d=256,beta=70": 342082949
      "d=512,beta=40": 2074339090
      "d=512,beta=55": 452658293
      "d=512,beta=70": 915347894
    per_point_seeds_toy_floor:
      "d=8": 855696187
      "d=12": 431979803
      "d=16": "not recorded -- worker was killed by external cap before it could reach its own seed-recording line? NO -- seed IS drawn before any lattice work; recorded seed_used field absent from stage0_results.json for d=16/d=20 because those worker JSON outputs were never written (worker process was terminated mid-run by the parent's hard timeout before its own final json.dump call): the ONLY output recorded for those two points is the parent's own NOT_COMPUTED wrapper, not the worker's own seed. This is disclosed here as an artifact of the timeout-enforcement design, not a missing-data omission -- the seed formula itself was still applied identically inside the terminated worker."
      "d=20": "same as d=16 above"
    fpylll_own_rng: "FPLLL.set_random_seed(seed) called with an int derived
      from default_rng([SEED_ROOT, ...]).integers(0, 2**31-1) for every
      IntegerMatrix.random() call; this is fpylll's own separate internal
      RNG stream, seeded deterministically FROM the numpy default_rng
      derivation above, not an independent unseeded source."
    infra_verification_seeds:
      fpylll_smoke_test: "FPLLL.set_random_seed(715923) directly (SEED_ROOT itself, no derivation -- this is a section-1 smoke test, not a Stage-0/1 draw)"
      cbd_and_compression: "default_rng([715923, 0, 0, 0, 0, 0])"
      batched_babai: "default_rng([715923, 0, 0, 0, 1, 0]); FPLLL.set_random_seed(715923 + 1) for the basis generation"

  environment: see environment.json in this same directory (fpylll 0.6.4,
    cysignals 1.12.5, psutil 7.2.2, numpy 2.4.6, scipy 1.17.1, Python
    3.11.15, Ubuntu 24.04.4 LTS, 4 vCPU, ~15GiB RAM)

  budget:
    declared_wall_clock_cap_seconds: 25200
    declared_memory_cap_gb: 16
    declared_maximum_runs: 1
    per_basis_feasibility_cap_seconds: 3600
    toy_floor_feasibility_cap_seconds: 900
    fpylll_install_verify_cap_seconds: 1800
    cbd_compression_rederivation_cap_seconds: 120
    batched_babai_exactness_cap_seconds: 120

  timing:
    dependency_install:
      pip_install_fpylll_seconds: 1.535
      pip_install_cysignals_psutil_seconds: 0.981
    section_1_infra_verification_wall_clock_seconds: 4.940
    section_2_stage0_script_total_wall_clock_seconds: 3466.192
    run_start_utc: "2026-08-14T10:08:04Z"
    run_end_utc: "2026-08-14T11:05:50Z"
    total_wall_clock_used_seconds_approx: 3466   # section 2's own script timer;
      # total session wall clock including setup/diagnosis/writeup is larger
      # but the COMPUTE budget items (fpylll install, section 1, section 2)
      # sum to well under the 25200s cap -- see writeup.md "Budget accounting"
    out_of_band_diagnostic_not_counted_against_budget:
      description: "A separate float_type=mpfr/dd/qd/long-double diagnostic,
        run OUTSIDE the recorded Stage-0 script, to characterize (not fix)
        the ReductionError found in the main grid. Not part of this task's
        own required deliverable computation; disclosed in full in
        environment.json's stage0_infrastructure_finding and in writeup.md."
      wall_clock_seconds_approx: "~650 (mpfr+dd+qd near-instant; long-double
        run for ~630s before being killed)"

  certificate:
    kind: none
    reason: "This task is a pure infrastructure/feasibility measurement run
      (PREREG-8 sections 1-2 only); no discrete-log solve, no factor-base
      relation, and no C1/C2 adjudication of any kind is claimed. No
      certificate is owed or produced."

  runs:
    - run_id: RUN-MLKEM-STAGE0-INFRA-1
      description: "Section 1 infrastructure re-verification"
      status: completed_valid
      command: "python3 infra_verification.py"
      exit_code: 0
      artifact: infra_verification_results.json
    - run_id: RUN-MLKEM-STAGE0-FEASIBILITY-1
      description: "Section 2 Stage 0 feasibility benchmark (6 main-grid
        cells + 4-point toy-floor sweep)"
      status: completed_valid   # the RUN itself completed and produced a
        # fully honest, non-fabricated result for every planned cell/point;
        # "completed_valid" describes the MEASUREMENT PROCESS terminating
        # cleanly and reporting real data, NOT a claim that any cell
        # "succeeded" at reduction -- 0/6 main-grid cells reached a
        # completed BKZ reduction (see writeup.md); this is reported as an
        # infrastructure_error finding per AGENTS.md rule 5, not papered
        # over, and not itself grounds to mark this RUN invalid, since the
        # run's own job (measure and report, honestly, whatever happens at
        # each cell) was fully discharged.
      command: "python3 stage0_feasibility.py"
      exit_code: 0
      artifact: stage0_results.json

  protocol_deviations:
    - id: DEV-1
      description: >-
        Section 1 point 1's BKZ smoke test found the fpylll wheel's own
        baked-in default strategies path
        (/project/local/share/fplll/strategies/default.json, a build-time
        path from the wheel's own build environment) does not exist on this
        host; a functionally equivalent strategies file IS present at the OS
        package path (/usr/share/libfplll8/strategies/default.json) and was
        used instead, for every BKZ.reduction/BKZReduction call in this
        task (section 1 and section 2 alike). BKZ.reduction remains
        callable with an explicit block_size and A default strategies file,
        exactly as PREREG-8 section 1 point 1 requires; only the specific
        path differs from the wheel's own compiled-in default.
      severity: low
      affects_result_validity: false
    - id: DEV-2
      description: >-
        fpylll's own wheel does not declare cysignals as an installable
        dependency in this environment (import fpylll failed with
        ModuleNotFoundError: No module named 'cysignals' immediately after
        a clean `pip3 install fpylll`); cysignals 1.12.5 was installed
        separately before fpylll would import at all. Recorded because it
        is a real, reproducible packaging gap in this environment, not
        because it affected any measurement.
      severity: low
      affects_result_validity: false
    - id: DEV-3
      description: >-
        ALL 6 main-grid (d, beta) Stage-0 cells failed with
        fpylll.util.ReductionError('infinite loop in babai'), raised inside
        BKZReduction's own internal LLL call, NOT a PER_BASIS_FEASIBILITY_CAP
        timeout (53.7s-408.9s per cell, all under the 3600s cap) and NOT a
        completed reduction. This is a THIRD outcome category distinct from
        both NOT_COMPUTED (cap exceeded) and a measured completion, recorded
        explicitly as "status: ERROR" with the exact exception and
        traceback in stage0_results.json, per this task's own instruction
        not to fold a genuine per-cell failure into either bucket silently.
        Recurs identically across every one of the 6 cells (both d values,
        all three beta values) -- a systemic, not one-off, finding. An
        out-of-band diagnostic (float_type=mpfr) also failed identically,
        ruling out a simple default-precision explanation; no further
        fpylll-native remedy was attempted (see environment.json
        stage0_infrastructure_finding and writeup.md). No hand-rolled BKZ
        substitute was used at any point.
      severity: high
      affects_result_validity: "N/A -- this IS the result; see writeup.md
        termination-branch determination"
    - id: DEV-4
      description: >-
        A background task-completion notification for this run's own
        Stage-0 script (job id bnqjhet8v) was received and reported
        'completed' by the harness while the process was independently
        confirmed (via `ps`) to still be running (on cell d=256/beta=55 at
        that point). The Coordinator caught this via direct process-table
        inspection and instructed continued monitoring to the run's actual
        completion. Recorded here because it is exactly the kind of
        harness-level anomaly this program's own discipline requires never
        be silently discarded, even though it did not affect the run's own
        correctness (the script was not touched or interrupted based on the
        false notification).
      severity: medium
      affects_result_validity: false

  anomalies:
    - "6/6 main-grid cells failed identically (see DEV-3); this is the
      dominant, load-bearing finding of this task."
    - "A side CPU-contention concern: the ad hoc float_type diagnostic
      process was deliberately SIGKILLed once it had run >600s without
      resolving, specifically because it was sharing this host's 4 vCPUs
      with the still-running official Stage-0 subprocess and could have
      biased that subprocess's own recorded wall-clock time; the official
      cell it may have overlapped with (d=512, beta=55) is flagged for
      this reason even though its own measured elapsed time (404.9s) looks
      consistent with the other d=512 cells (395.9s, 408.9s) and shows no
      obvious distortion."
