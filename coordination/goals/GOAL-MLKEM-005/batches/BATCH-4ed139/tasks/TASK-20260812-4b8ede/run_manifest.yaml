  anomalies_and_unexpected_observations:
    - >-
      VAR-F at a scale_degenerate cell is decided by bit identity alone, which is
      scale-free: X_gso_k's fibre dispersion of about 9.02e-02 at L7 beta 5 and
      rdet's about 4.18e-11 under route R2 at the same cell (the lead's committed
      number) both PASS, though they differ by about nine orders of magnitude and
      rdet reads zero entries of A. X_gso_k's VAR-F PASS is therefore obtained
      through the same test that float noise passes. Reported as an objection to
      a frozen clause; the clause was implemented and scored as written.
    - >-
      RQ and RG disagree by up to 3.002e-09 at L5 (d = 140, k = 100) with 0 of 8
      bases bit-identical at the five wide-k lattices, against 1.78e-15 or exact
      agreement at the narrow-k ones. No RQ/RG tolerance is pre-registered and
      none was invented. Both routes give identical G-REL1 and G-VAR2 verdicts at
      every cell.
    - >-
      The G-VAR2 half of P-FR1 is scored on an instrument whose own F0 fixture
      the lead records as FAIL (branch T-F0FAIL-PARTIAL). PREREG-1 7.3 states
      that if the instrument fails at its own reference point its behaviour
      elsewhere is uninterpretable. Recorded here; the ruling belongs to the
      Coordinator.
    - >-
      Objection to the frozen definition, recorded and then run as written:
      X_gso_k reads the leading k raw GSO log-norms of B = [[I_k, A],[0, q I]],
      which is close to a statistic of the entries of A as written down -- a
      presentation property of the basis rather than a lattice invariant. Its
      dispersion must not be read as lattice information.

