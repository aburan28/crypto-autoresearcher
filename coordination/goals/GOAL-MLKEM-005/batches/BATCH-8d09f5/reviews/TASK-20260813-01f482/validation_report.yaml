    - "AGENTS.md rule 12 is unmet and unwaived in this goal; model_verified: false (see inference block above), including an unresolved discrepancy between this session's self-reported model identity (claude-sonnet-5) and the orchestration adapter's own configured resolution for this policy (anthropic:claude-opus-5)."
    - >-
      THE MOST SUBSTANTIVE FINDING OF THIS REVIEW (CTRL-2-NULL-OBJECT-FINDING, above): the
