      result: >-
        results_relvar.json sha256 = c5b2918dccf1b58261eed1e9d221f1074ae6143f2a8fc5c0f42
        ff475646ccd6d, matching PREREG-6's declared value exactly. Own cyclic
        adjacent-max-diff recompute: hkz/L7_b5 = 0.0665893489077094 (argmax i=2), hkz/
        L11_b30 = 0.00948000985335451 (argmax i=0) -- BIT-EXACT match to PREREG-6's stated
