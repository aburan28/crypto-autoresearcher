      so T-MUTCTRL-DETECTED fires unsuffixed (|COVERED|=2, no -PARTIAL). Independently
      re-derived directly from the raw route_p_values/route_mut_values arrays (RECOMP-2),
      not from trusting the lead's own R_MC_OUT_4_termination block.
    overclaim_boundary_check: >-
      Read the lead's writeup and PREREG-6's own branch text line by line against section
      2.6/2.8/6's FORBIDS lists. Confirmed: neither the writeup's summary section nor any
      other section claims anything about hkz's own admissibility, T-HKZINDEP-CONFIRMED's
