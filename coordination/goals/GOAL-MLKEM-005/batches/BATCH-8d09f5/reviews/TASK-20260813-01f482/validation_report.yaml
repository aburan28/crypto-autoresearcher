  # ====================================================================
  # THIRD TARGET -- re-derive D_route_mut/VERDICT_mut, and the specific
  # cyclic-shift mechanism check (stronger than "some big deviation")
  # ====================================================================
    - id: RECOMP-2-VERDICT
      what: >-
        Recompute D_route_mut and VERDICT_mut at both cells DIRECTLY from
        results_hkz_mutation6.json's own raw route_p_values/route_mut_values arrays,
        WITHOUT importing measure_hkz_mutation6.py. Confirm the detection mapping
        (PREREG-6 section 2.4 point 5) is applied in the correct direction, not inverted.
      result: >-
        Own D_route_mut recompute (max abs deviation, matched bases): hkz/L7_b5 =
        0.06658934890771118, hkz/L11_b30 = 0.00948000985335451 -- EXACT match to the
        lead's own reported values. Own VERDICT_mut recompute: "DOES NOT EXCEED" at both
        cells (s_c^fib <= D_route_mut) -- EXACT match. Detection mapping confirmed correct
        and NOT inverted: "DOES NOT EXCEED" -> DETECTED at both cells, matching the lead's
        own `detection_reading` field exactly. Confirmed `results_l7l8.json`/
        `results_am4.json` were not used anywhere in the actual computation (only in
        negative prose, see ART-3-SCOPE).
      probe: probes/probe3_verdict_recompute.py, probes/probe3_verdict_recompute_output.json
    - id: RECOMP-3-SPECIFIC-MECHANISM
      what: >-
        THE STRONGER, SPECIFIC CHECK the dispatcher's checklist item 3 requires: confirm
        route_mut_values[i] == route_p_values[(i+1) mod 8] EXACTLY (not merely "some big
        deviation") at every basis index, at both cells.
      result: >-
        Confirmed at every one of 16 (basis, cell) pairs: |route_mut_values[i] -
        route_p_values[(i+1) mod 8]| <= 1.7763568394002505e-15 (== 2^-49, the SAME
        machine-epsilon-scale floor BATCH-a6fab5 established for genuine HKZ-quality
        convergence between two correct implementations) at EVERY index, at BOTH cells --
        never merely "large and unspecific." This is the specific predicted mechanism, not
        an approximate resemblance.
      probe: probes/probe3_verdict_recompute.py, probes/probe3_verdict_recompute_output.json

  # ====================================================================
  # SECOND TARGET / checklist item 2 -- direct, from-scratch independent
  # fpylll re-run, ruling out a convergence-artifact alternative explanation
  # ====================================================================
    - id: RECOMP-4-DIRECT-REPLICATION
      what: >-
        The dispatcher's checklist item 2 asks whether "detection" could be an artifact of
        fpylll's own convergence behavior differing on the mutant's genuinely-different
        matrices for reasons UNRELATED to the seed shift, rather than the seed shift
        genuinely causing basis slot i to compute the true HKZ profile of a DIFFERENT
        basis. Answered by direct, independent re-computation: a Validator-written driver
        (not imported from either route file, though it necessarily reuses the same
        general reduction/enumeration SHAPE -- LLL, one BKZ pass at block_size=d, an
        explicit HKZ sweep via Enumeration -- which PREREG-5 2.2 point 3 licenses both
        routes to share and which is NOT the code path under test) independently computes,
        in THIS session, hkz/L7_b5 basis slot 0 both (a) unmutated (seed [1,20,6,0]) and
        (b) with the mutated formula applied at slot 0 (seed [1,20,6,(0+1)%8]=[1,20,6,1]).
      result: >-
        (a) Own unmutated recompute of slot 0 = -0.17267425560428773, EXACTLY equal (0.0
        residual) to ROUTE-P's own archived X_a[0]. (b) Own mutated-formula recompute at
        slot 0 = -0.19295799685334192, matching ROUTE-P's SHIFTED target X_a[1]
        (-0.1929579968533437) to 1.7763568394002505e-15 (== 2^-49) -- and clearly NOT
        matching X_a[0] (residual 0.0203, i.e. genuinely different). (c) This same
        independently-recomputed mutated value EXACTLY matches (0.0 residual) the lead's
        OWN reported route_mut_values[0] from a completely separate run in a completely
        separate session. This is direct, first-hand, independently-run evidence that the
        seed-index mutation genuinely, mechanically causes the mutant to compute the TRUE
        HKZ profile of a DIFFERENT basis -- not an fpylll convergence quirk unrelated to
        the seed shift -- AND that the lead's own run is independently reproducible
        bit-for-bit.
      probe: probes/probe4_independent_fpylll_recompute.py,
        probes/probe4_independent_fpylll_recompute_output.json (ran in 0.13s wall time in
        this session)

  # ====================================================================
  # positive / negative controls, and the checklist-item-5 structural
  # finding -- the most substantive result of this review
  # ====================================================================
  control_checks:
    - id: CTRL-1-COULD-NOT-FAIL
      control: PREREG-6 3.1's own "could-not-fail" analysis.
      result: >-
        Independently re-derived and CONFIRMED as far as it goes: D_route_mut is a
        measured max-abs-deviation from a freshly, genuinely computed mutant route on
        numerically different input, not fixed by construction; the ACTUAL value could
        have diverged from HEURISTIC-M1's prediction if convergence had failed (it did
        not, per RECOMP-4-DIRECT-REPLICATION and the 8/8-ok basis_status at both cells).
        PREREG-6's own analysis is correct and not contradicted.
    - id: CTRL-2-NULL-OBJECT-FINDING
      control: >-
        docs/inventor-protocol.md section 3 / this review's own standing instruction: "a
        statistical signal without a null-object control is not evidence" -- verify that
        any reported excess was measured against a null object of the same shape, and that
        the report states what the measured quantity should do as the parameter meant to
        destroy it increases. THE DISPATCHER'S CHECKLIST ITEM 5 ASKS EXACTLY THIS QUESTION
        AND THIS REVIEW FINDS AN AFFIRMATIVE, FIRST-CLASS ANSWER.
      result: >-
        MAJOR FINDING, NOT A FOOTNOTE. Direct inspection of BATCH-9e3584's own
        measure_relvar.py (the script that originally produced G_VAR.per_candidate.hkz.
        per_cell.<L>_<b>.float_sd, i.e. s_c^fib) shows `float_sd` is LITERALLY
        `np.std(vals, ddof=1)` where `vals = [base[(lat, beta, i)]["hkz"] for i in
        range(N_BASES)]` -- i.e., the sample standard deviation of THE EXACT SAME 8-point
        per-basis array (X_a for L7_b5, X_b for L11_b30) that PREREG-6 section 2.3's own
        predicted D_route_mut is ALSO computed from (its cyclic-adjacent max difference).
        Independently confirmed by direct recomputation:
        `np.std(X_a, ddof=1) == s_c^fib(hkz/L7_b5)` and `np.std(X_b, ddof=1) ==
        s_c^fib(hkz/L11_b30)` bit-exact. Further: at BOTH cells, PREREG-6's predicted
        D_route_mut (the cyclic-adjacent max difference at shift k=1) numerically EQUALS
        the full sample range (max-min) of that same 8-point array -- so the reported
        "detection margin" (~2.79x, ~2.48x) IS LITERALLY a range-to-standard-deviation
        ratio of an n=8 sample, a well-known generic order-statistics quantity (the
        classical Shewhart/control-chart d2(8) constant is ~2.85, close to what is
        observed here for reasons that have nothing to do with code-sharing or the
        specific injected defect). A cheap, closed-form diagnostic computed entirely from
        already-archived data (no new reduction) confirms this generality directly: ALL 7
        possible non-trivial cyclic shifts k=1..7 (not just the k=1 PREREG-6 chose) would
        be predicted DETECTED at both cells, with margins ranging 1.66x-2.79x at hkz/L7_b5
        and 2.26x-2.48x at hkz/L11_b30 -- every single one exceeds 1.0. PREREG-6's own
        cell-selection rationale (section 2.1: chosen to bracket "the tightest and a
        looser predicted signal-to-s_c^fib ratio among the 6 [BATCH-a6fab5] covered
        cells") independently corroborates this: even the single TIGHTEST margin among
        the full archived 6-cell hkz set is ~2.48x, comfortably above 1. THE MISSING NULL:
        neither PREREG-6 nor the lead's report constructs or discusses a null/negative
        object for this control -- e.g., checking whether detection depends on the
        SPECIFIC defect chosen (a full basis substitution to a different, already-known,
        already-dispersed basis) as opposed to being a near-automatic consequence of
        comparing an admissible observable's own between-basis dispersion (which G-VAR/
        AM-11 already REQUIRES be non-zero for hkz to be admissible at all) against that
        SAME observable's own standard deviation. The parameter that ought to "destroy"
        the signal if it reflected genuine shared-code-defect sensitivity -- e.g., varying
        WHICH shift is injected -- was not varied in the run itself; this review supplies
        that variation post hoc from already-archived data (above) and finds the signal
        does NOT decay for any of the 7 alternatives tested. THIS DOES NOT MEAN THE RUN IS
        INCORRECT, FABRICATED, OR NON-COMPLIANT WITH PREREG-6'S OWN FROZEN TEXT -- every
        number is genuinely, correctly measured and PREREG-6's section 3.1 could-not-fail
        analysis (CTRL-1) is not contradicted. IT MEANS: T-MUTCTRL-DETECTED's own
        "LICENSES" text ("demonstrated real power to flag this specific ... defect") is
        entitled to LESS evidentiary weight than a naive reading suggests. What this run
        actually, positively demonstrates is narrower: (i) fpylll converges reliably on 16
        freshly-drawn matrices at this toy scale (an infrastructure/convergence fact,
        independently corroborated by RECOMP-4-DIRECT-REPLICATION), and (ii) that ANY
        defect causing a full basis-index mislabeling at this instrument's toy scale would
        be flagged, essentially by the generic mathematics of small-sample range-vs-SD
        ratios rather than by anything specific to this being a "shared basis-construction
        code" defect as opposed to any other cause of basis mislabeling. It does NOT, by
        itself, demonstrate that the D_route mechanism has meaningful sensitivity to a
        SUBTLER defect that perturbs a basis slightly rather than substituting an entirely
        different, already-dispersed one -- a materially different and untested question
        this review recommends the Coordinator's decision record and any
        knowledge_promotion language state explicitly, alongside PREREG-6's own already-
        narrow, correctly-stated scope limits.
      probe: probes/probe5_structural_relationship_diagnostic.py,
        probes/probe5_structural_relationship_diagnostic_output.json (diagnostic only --
        computed entirely from already-archived data, injects no new defect, runs no new
        reduction, and asserts no T-MUTCTRL-* branch for any shift other than k=1)
    - id: CTRL-3-NO-REDUCTION-ABOVE-D40
      control: no_new_reduction_above_d40.
      result: Confirmed (ART-3-SCOPE above); CELLS admits only d in {20, 40}.

