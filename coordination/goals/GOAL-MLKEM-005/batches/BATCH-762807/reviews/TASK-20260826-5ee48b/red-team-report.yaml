  # =====================================================================
  # Findings against this Coordinator's own conduct of the round
  # =====================================================================
  findings_against_the_coordinator:
    invited_explicitly_by_the_plan: true
    PD_A_judged:
      question_put_to_me: 'Was the committed envelope right and this Coordinator wrong to depart from it?'
      my_ruling: 'THE DEPARTURE IS SOUND AND I UPHOLD IT. The envelope was wrong on this point.'
      reason: >-
        The envelope required a BLIND re-derivation of the D6 quantity. D6's answer -- the
        closed form q^(1/2 - 1/(2d)), 57.242 at (q=3329, d=512), 54.8457 at (q=3329, d=80)
        -- is published in batch.yaml, in DEC-20260824-5e222e and in EV-MLKEM-59e4a4, all
        three of which are required reading for both reviewers. A blind re-derivation of a
        number the re-deriver has already been handed three times is not a blind. Executing
        the envelope literally would have produced a round CLAIMING an independence property
        it demonstrably did not have, which is worse than the substitution. Substituting a
        cell the producer never ran (d=64, beta=25) makes the blind a property of the
        artifacts rather than of a reviewer's reading discipline, which is the stronger
        construction.
      one_clause_i_do_not_uphold: >-
        PD-A writes that the gate's purpose "is met MORE STRONGLY than the gate's TEXT
        asks". That is the single self-flattering sentence in the trail. The two coverages
        are not comparable along one axis: the substitution buys artifact-level
        independence of the blind and SPENDS independent reproduction of the batch's own
        reported figures. PD-G's `what_it_costs` says exactly that -- "no reviewer
        independently reproduces the beta=20 numbers the producer reported, and this plan
        does not pretend otherwise" -- and therefore contradicts "more strongly" two
        hundred lines later. The honest word is DIFFERENTLY, and the record already
        contains the material to say so. Small; reported because PTM-5 asked whether the
        trail flatters its author, and in exactly one clause it does.
      does_the_departure_drop_coverage_my_completion_gate_requires: >-
        NO. My gate names J4, J5, J6, a per-defect D1..D6 statement, the proves-too-much
        control against BATCH-f9780d, the J6 enumeration and an admissibility ruling. None
        of it touches the blind re-derivation. I can attest to my own gate without it.
    PD_G_judged:
      ruling: 'SOUND, and the trail is better than the fix.'
      reason: >-
        The sequence recorded -- brief names three blind_from paths; the plan's author finds
        the list incomplete and REPORTS THE RESIDUAL AGAINST THE BRIEF rather than
        presenting its repair as sufficient; the brief-writer verifies independently and
        REMOVES THE CONSTRAINT instead of patching around it -- is the correct handling of a
        defect found after a handoff was frozen, and the attribution of each step to a
        different session is what makes it checkable. I find nothing self-serving in it.
        PD-G's `what_it_costs` states the price without softening it.
    P1_the_pre_commitment:
      ruling: 'Declared, mitigated, and carrying one residual that the Coordinator should own at close.'
      residual: >-
        Telling both reviewers IN ADVANCE that a bare ADMIT will be read as under-coverage
        puts a thumb on the scale toward naming a residual, and `what_this_is_not` cannot
        fully remove an incentive it acknowledges. PD-E's widening to four values is the
        right mitigation and I credit it. FOR THE RECORD, AND SO THE CLOSE CAN CHECK IT: I
        reached F1, F4 and M1 from the source and from my own probe BEFORE weighing P1 at
        all, and my ruling below would be identical had P1 not existed. If the close cannot
        verify that ordering from my report, it should discount this paragraph, not credit
        it.
    the_claim_ceiling: >-
      I audited every record of this batch I read for any sentence reading as though a green
      board were a result or as though anything here authorised the 100-bit re-run. I FOUND
      NONE. batch.yaml, acceptance_results.json, implementation_report.md sections 0/8/12
      and review_plan.yaml's `claim_ceiling` each state the opposite, unprompted and
      repeatedly. This is the batch's most consistent property and it deserves saying.

  # =====================================================================
  obstruction:
    do_i_claim_anything_closed_or_weakened: 'YES -- one weakening, no closure.'
    what_is_weakened: >-
      DEC-20260815-3e8e9c condition (i)'s characterisation of the tours-per-hour cost curve
      as "EXACTLY the quantity a Stage-1 sizing decision needs and does not have". I find it
      necessary and not sufficient (J6.M1).
    what_is_NOT_claimed: >-
      No lane is closed. No obstruction is asserted. I do not claim the 100-bit cell cannot
      be sized, that the instrument cannot be made fit, or that this approach is dead. A
      count of gaps I found is a report about my search, not a statement about the problem.
    named_obstruction_if_any: 'None. This is a gap with a named, cheap remedy, not an obstruction.'
    forward_guidance_naming_what_remains_open:
    - 'Whether the AutoAbort slope series, once recorded per tour, actually supports a usable projection of N at d=512. OPEN, and answerable only from a real d=512 record.'
    - 'The true per-tour cost profile at d=512/mpfr_bits=100 -- rising, falling or flat. OPEN.'
    - 'Whether the mid-tour flush deferral is minutes or hours at d=512. OPEN and not measurable by this instrument alone (M7).'
    - 'Whether the target regime''s tour count is tens or thousands. OPEN; F2 argues tens on the only committed evidence and will be settled free by the first d=512 tours_table ever written.'
    resource_check:
      is_the_missing_quantity_within_reach: 'YES.'
      basis: >-
        M1's remedy is O(d) mpfr reads appended to a per-tour row that is already written
        and already fsync'd -- 512 reads against a tour whose order, on the only committed
        comparand, is minutes. M4's is one key. F1's is one journal record per prologue
        phase, using a pattern already implemented. F4's is two lines in an existing
        `finally`. F5's is one `if` at the top of an existing loop. NONE of these requires a
        d=512 run to IMPLEMENT; all of them require one to VALIDATE, which is the ordinary
        condition of this lane and not an obstruction.
      cost_of_not_doing_them: >-
        A capped d=512 run under the current instrument returns a per-tour cost prefix with
        no way to project completion, a memory column that under-reports, and -- if the kill
        lands in the prologue -- a record that states elapsed near zero for a cell that ran
        for minutes. That is much better than one bit and it is not yet a sizing input.

  # =====================================================================
  admissibility_ruling:
    question: 'Is this instrument fit to carry the next capped run at d=512, mpfr_bits=100?'
    ruling: ADMIT WITH NAMED RESIDUAL
    reason: >-
      ADMIT, because the instrument is unambiguously and substantially better than the
      predecessor on the exact axis that failed, and two of its six fixes transfer to d=512
      without qualification: the fsync'd STARTED stub cannot fail to record that a cell
      began, and D6 is dimension-safe arithmetic. Every per-tour row is on disk and fsync'd
      before the next tour starts, so a capped d=512 cell cannot again produce literally
      nothing. Refusing admission would leave the lane with the predecessor, which is
      strictly worse, and premature closure is a failure mode symmetric with overclaiming.
      WITH NAMED RESIDUAL, because five specific things are missing that a capped d=512 run
      would want and that no acceptance test at d=64 could have surfaced. Each is named
      below, each is concrete, and each is cheap. I did not go looking for a residual to
      satisfy P1; I went looking for scale-only failure modes, found these, and only then
      read P1's weight.
    residuals_named_concretely:
    - id: R1
      residual: 'No prologue record. A d=512 cell killed before the first `tour_start` is indistinguishable from one killed at t=0, and the prologue at d=512 is bounded below by the predecessor''s committed 498.96 s outer LLL.'
      remedy: 'One `phase_start` journal record per prologue phase, using the existing `tour_start` pattern.'
    - id: R2
      residual: 'The per-tour row carries only the polled `peak_rss_bytes`, which the GIL-starved sampler makes a tour-boundary maximum; `ru_maxrss` is not in the row. A memory ceiling read off that column under-sizes.'
      remedy: 'One key in the existing row.'
    - id: R3
      residual: 'The AUTO_ABORT stopping criterion is not reconstructible from the record, so tours-to-completion has no empirical handle and the sizing DEC-20260824-5e222e requires stays half-computable.'
      remedy: 'Journal the per-tour GSO log-norm slope, or the AutoAbort statistic, as one more key.'
    - id: R4
      residual: '`_H_PAYLOAD` is never reset and the handlers are never disarmed, so a signal after a cell completes writes a KILLED_PARTIAL with `failed_infrastructure: true` for a cell that COMPLETED. Demonstrated at d=64 in my probe.'
      remedy: 'Two lines in `run_cell`''s existing `finally`.'
    - id: R5
      residual: 'The only cap mechanisms are Python signals, all deferred by the GIL for a whole tour, so a declared cap is only tour-boundary-accurate and the deferral is not measurable from the record.'
      remedy: 'An in-loop deadline test at the top of the driving loop, which needs no signal at all; plus an externally captured kill timestamp if the deferral is ever to be quantified.'
    what_this_ruling_is_not:
    - >-
      IT IS NOT AN APPROVAL. Approval is a frozen contract at a declared path plus a
      committed Coordinator decision, and neither exists for the 100-bit cell.
      DEC-20260824-5e222e's substance is a REFUSAL; this batch discharges the condition that
      refusal names and does not lift it. Nothing in this report may be read as authorising
      any run.
    - 'It is not a statement that R1-R5 must be fixed before a run. It is a statement that a run made without them will return less than a run made with them, and that the difference is cheap.'
    - 'It is not a whole-claim verdict. I own three joints of six and cannot see J1, J2 or J3 by construction. TASK-20260826-70d800 composes.'
    - 'It is not corroboration of anything the producer, my sibling or the closing Coordinator concludes. Rule 12 is unmet: we are expected to resolve to the same model and our agreement is correlated same-model judgement.'

  scope_limits:
    tested_scope_of_every_statement_i_make_from_my_own_measurement: >-
      d=64, beta=20, mpfr_bits=53, q=3329, one seed per cell drawn by the pinned formula,
      strategies resolved from `DEFAULT_STRATEGIES`, fpylll 0.6.4, psutil 7.2.2, Python
      3.11, one 4-core host, two cells in one process, `arm_signals=False`. Nothing I
      measured transfers to d=512, to mpfr_bits=100, to beta=25, to any other dimension or
      precision, or to any cryptographic parameter set.
    statements_i_make_from_committed_records_rather_than_measurement: >-
      498.96 s and 508.58 s outer LLL at d=512/75-bit, 3051.82 s and 2974.33 s cell wall
      clock, 14448 s lower bound, 21538 s cumulative, exit 124, `timeout 17500` -- all from
      BATCH-f9780d's execution_report.md. 26 tours and 274.29/277.56 s at d=80/beta=55 --
      from EV-MLKEM-59e4a4. 9 versus 19 heartbeat samples, 0.000378 s pre-loop LLL, 6.457 s
      suite wall clock -- from implementation_report.md. Each attributed at its point of use.
      I recomputed none of them and do not assert them as my own measurements.
    ml_kem: >-
      NOTHING IS ASSERTED ABOUT ML-KEM AT ANY PARAMETER SET, IN EITHER DIRECTION. The object
      at d=512 is already a structureless random q-ary lattice -- a null object -- and that
      limit is inherited, not established here.
    rule_12: >-
      UNMET AND UNWAIVED, INHERITED. I am expected to resolve to the same model as the
      producer, my sibling and the closing Coordinator. MY AGREEMENT WITH ANY OF THEM IS
      CORRELATED SAME-MODEL JUDGEMENT AND IS NOT INDEPENDENT CORROBORATION. My independence
      in this round is procedural only: a fresh session, a disjoint write scope, sibling
      blindness, and a plan written before I ran.

  next_concrete_action:
    one_action: >-
      BEFORE the next capped d=512 / mpfr_bits=100 attempt is contracted, add R3 -- one
      per-tour key carrying the GSO log-norm slope (or the `BKZ.AutoAbort` statistic itself)
      to the existing `tours_table` row -- and R1, one `phase_start` journal record per
      prologue phase. Together they are the difference between a capped cell that returns a
      cost PREFIX and one that returns a cost prefix plus the only empirical handle on how
      much work remains, which is the half of DEC-20260824-5e222e's sizing requirement that
      is currently missing. Both are additive, neither touches the reduction, neither costs
      lattice compute to implement, and both can be acceptance-tested at d=64 exactly as
      D1..D6 were.
    what_this_action_is_not: >-
      It is not a request to run anything at d=512, and it names no budget. It is an
      instrument change that a Coordinator may or may not require; whether the next attempt
      happens at all, and under what contract, is not mine to say.
