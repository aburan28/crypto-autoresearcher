  where_this_definition_would_bite:
    statement: >-
      RECORDED HERE BECAUSE IT IS A PROPERTY OF THE PINNED STRATEGIES FILE AND OF THE
      INSTALLED fpylll, ESTABLISHED BEFORE ANY PRODUCER ARTIFACT WAS READ. In the pinned
      strategies file, `preprocessing_block_sizes` is EMPTY for every block size from 0
