      surrogate at either block size can distinguish them. At beta=55, the block size of
      this goal's d=512 RT-CTRL-1 cell, they differ by a factor of roughly d.
    scope: >-
      This is a statement about fpylll 0.6.4 and this strategies file. It is not, at the
      time of writing, a statement about any producer artifact.

