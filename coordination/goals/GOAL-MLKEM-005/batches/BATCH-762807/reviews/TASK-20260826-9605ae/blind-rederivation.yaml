  my_definition_of_number_of_tours:
    stated_before_reading_the_instrument: true
    definition: >-
      THE NUMBER OF TOURS is the number of iterations of the `while True:` loop in
      fpylll.algorithms.bkz.BKZReduction.__call__ that ran to completion -- equivalently,
      the number of invocations of `self.tour(...)` made BY THAT LOOP, equivalently the
      value of the loop counter `i` at the moment the loop breaks. It counts a tour that
      returned; a tour that raised would terminate the call and would not be counted.
    what_is_deliberately_excluded: >-
      Recursive `self.tour(prepar, kappa, kappa+block_size, tracer=tracer)` invocations
      made from fpylll.algorithms.bkz2.BKZReduction.svp_preprocessing -- one per entry of
      `params.strategies[block_size].preprocessing_block_sizes`, per svp_reduction, per
      tour. These are PREPROCESSING SUB-CALLS, not tours: they do not advance the
      driving loop, they do not reach a break test, and they are not what the auto-abort
      or max-loops conditions count. Also excluded: enumeration calls, `preprocessing` /
      `pruner` / `postprocessing` tracer contexts, and the pre-loop `lll` context.
    why_this_definition: >-
      It is the quantity the loop's own break tests are evaluated against -- `clean`,
      `params.block_size >= self.M.d`, AUTO_ABORT's `test_abort()`, MAX_LOOPS' `i >=
      params.max_loops` and MAX_TIME -- and therefore the only reading under which
      'tours' composes with fplll's own termination semantics and with a tours-per-hour
      rate.
    my_route: >-
      A subclass of `fpylll.algorithms.bkz2.BKZReduction` holding a re-entrancy DEPTH
      counter around `tour`. It increments the tour count only on depth-0 entry,
      delegates unchanged to `BKZReduction.tour`, and alters no arithmetic. A second,
      independent route was also taken: run the same cell with `bkz(par, tracer=True)`
      and count the direct children of the trace root whose label is a tuple with first
      element "tour". The two routes are reported separately below.
    grounding: >-
      Read directly from the INSTALLED fpylll 0.6.4 sources in the venv named under
      `environment`, not from upstream documentation:
      .../fpylll/algorithms/bkz.py lines 125-144 (the driving loop and its four break
      tests, `with tracer.context("tour", i, ...)`), lines 146-165 (`tour`, which opens
      NO tour context of its own), and .../fpylll/algorithms/bkz2.py lines 72-81
      (`svp_preprocessing` calling `self.tour` recursively).

