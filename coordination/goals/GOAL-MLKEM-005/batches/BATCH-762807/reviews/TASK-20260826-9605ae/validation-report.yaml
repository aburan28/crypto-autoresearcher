    findings:
    - id: J2-F1
      title: 'THE HANDLER''S STDOUT NOTICE IS UNCONDITIONAL AND CAN ASSERT A FLUSH THAT DID NOT HAPPEN'
      disclosed_by_the_producer: false
      demonstrated: true
      how: >-
        I invoked the producer's own `_signal_flush_and_die` (imported from the committed
        file, not reimplemented) with `_H_FD` set to a descriptor that is not open. The
        journal write raised and was swallowed by the handler's `except Exception: pass`;
        the handler nonetheless wrote "[v2] signal received; pre-serialised partial record
        flushed" to fd 1 and exited 143. Same outcome when `_H_PAYLOAD` has no entry for
        the signal (a KeyError, also swallowed).
      why_it_matters: >-
        The three writes are guarded independently, so the fd-1 notice is not evidence that
        the fd-0 write succeeded. The reachable real case is a full filesystem on the
        journal's volume during a long d=512 run -- exactly the run whose whole purpose is
        to leave a record. An operator reading the stdout log would conclude a partial
        record exists when it does not.
      severity: 'moderate; the journal is the durable primary and a reader who checks it is not misled'
      fix_is_one_line: 'write a different byte string on the failure path'
      probe: probes/j2_handler_clause_probes.py handler_write_fails
    - id: J2-F2
      title: 'THE RETURN VALUE OF os.write IS DISCARDED AT BOTH WRITE SITES, AND "CANNOT HAPPEN" IS AN OVERSTATEMENT'
      disclosed_by_the_producer: partially
      what_the_producer_says: >-
        implementation_report.md 3.2 limit 1: "With O_APPEND and a single write() syscall
        per record, the kernel appends the record whole ... it CANNOT INTERLEAVE".
        rebuild_results' docstring hedges correctly: "a partial write cannot happen with a
        single os.write, but the reader must not assume it".
      what_is_actually_true: >-
        `Journal.write` (line 263) and `_signal_flush_and_die` (line 208) both call
        `os.write(...)` as a bare statement. POSIX permits a short write to a regular file
        on ENOSPC or RLIMIT_FSIZE; neither site checks or retries, so a short write would
        append a TRUNCATED JSON line silently. The ATOMICITY claim is about interleaving
        and is right; the COMPLETENESS claim is stronger than the mechanism supports.
      mitigation_that_does_exist: >-
        The reader side is honest: `rebuild_results` and the suite's `read_jsonl` RETAIN
        unparseable lines verbatim under `unparseable_lines` rather than dropping them, so
        the failure would be visible rather than lossy. That is the right design and the
        producer chose it deliberately.
      severity: low
      measured: 'no short write occurred in any of my ten kill runs; this is a code-reading finding, not an observed failure'
    - id: J2-F3
      title: 'A KILLED_PARTIAL CAN NAME A CELL THAT COMPLETED -- THE INTER-CELL AND POST-CELL STALE PAYLOAD WINDOW'
      disclosed_by_the_producer: false
      demonstrated: true
      how: >-
        I ran one cell through the producer's own `run_cell` in-process with
        `arm_signals=True` and inspected the module state AFTER the cell returned COMPLETED
        with 9 tours. `_H_ARMED` is still True, `signal.getsignal(SIGTERM)` is still
        `_signal_flush_and_die`, and `_H_PAYLOAD[SIGTERM]` still holds that cell's payload
        with `status: KILLED_PARTIAL`, `record_kind:
        cell_partial_flushed_from_signal_handler`, `tours: 9`, `failed_infrastructure:
        true`.
      the_consequence: >-
        A signal delivered after a cell completes and before the NEXT cell's line-560
        refresh -- or after the last cell, during the final `rebuild_results` and up to
        process exit -- flushes a KILLED_PARTIAL for a cell that in fact COMPLETED and
        already has its `cell_final` record on disk.
      why_it_is_on_the_next_run_s_path_and_not_a_curiosity: >-
        The matched pair runs TWO cells back to back, and `main` calls
        `rebuild_results(journal_path, results_path)` BETWEEN them (line 962), which
        re-reads and re-serialises the ENTIRE journal. At d=512 with a large tours table
        that is not a microsecond window.
      what_it_does_not_break: >-
        It does not break PTM-2(i): a KILLED_PARTIAL still requires a signal, and I
        verified that. And the journal retains BOTH records with timestamps, so a careful
        reader can resolve it. It contradicts the spirit of "the flushed status is the true
        one" without contradicting its letter -- the status matches the SIGNAL; it does not
        match the CELL.
      severity: 'moderate for a two-cell run whose entire purpose is to produce a trustworthy killed-cell record'
      fix: 'clear or re-stamp _H_PAYLOAD when run_cell returns, or carry the cell''s completion state into the payload'
      probe: probes/j2/T11_between_cells
    - id: J2-F4
      title: 'THE PRE-SERIALISED PAYLOAD IS REBUILT THREE TIMES PER REFRESH, AT LEAST TWICE PER TOUR, EMBEDDING THE UNCAPPED TABLE'
      disclosed_by_the_producer: 'in kind, not in size'
      what_the_producer_disclosed: >-
        Section 8 item 4: the tours table grows without bound in the payload, "each
        refresh's json.dumps progressively more expensive", no cap implemented, none
        tested. That is honest and it is theirs.
      what_it_did_not_say: >-
        (a) EACH refresh serialises the record THREE TIMES, once per entry of
        `_SIGNAL_STATUS`; (b) a refresh happens at every tour START and every tour END as
        well as every heartbeat, so at least twice per tour; (c) no size was measured.
      what_i_measured_no_lattice_compute: >-
        Serialisation of a payload built from a REAL tour_progress row taken from one of my
        own v2 runs, at increasing table sizes: 1 row 3429 bytes / 0.000068 s per refresh
        (all three payloads); 100 rows 135893 bytes / 0.0033 s; 1000 rows 1340094 bytes /
        0.0404 s; 2000 rows 2678094 bytes / 0.0793 s. Linear in rows, hence QUADRATIC
        cumulative over a run of n tours at a fixed >=2 refreshes per tour.
      honest_scoping: >-
        THIS IS A MEASUREMENT OF THE SERIALISATION SHAPE AT LARGER TABLE SIZES ON THIS
        HOST. IT IS NOT A d=512 PROJECTION and I do not offer it as one; whether the cost
        matters depends on tour duration, which I did not and may not measure. The
        placement is checkable though: `tour_t0` is taken AFTER the pre-tour refresh, so
        the refresh cost is excluded from `tour_elapsed_seconds` while being included in
        `bkz_elapsed_seconds` and `elapsed_seconds`. Any rate computed from the per-tour
        column therefore understates wall clock by the flush overhead.
      severity: 'low at acceptance scale; unquantified at the scale that matters, which is the honest statement'
    - id: J2-F5
      title: 'THE STRATEGIES FILE IS STILL BOUND BY PATH AT RUN TIME. ITS SHA256 IS RECORDED AND NEVER CHECKED.'
      disclosed_by_the_producer: false
      this_is_the_batch_s_own_theme_and_it_is_not_closed: true
      how_v2_resolves_it_now: >-
        `_REPO_ROOT = abspath(join(HERE, "..", x7))` and `DEFAULT_STRATEGIES` is a path
        under it (lines 176-184). I verified the seven-level ascent is arithmetically
        correct from the task directory. It is nonetheless A PATH COMPUTED FROM MODULE
        LOCATION -- the same class of binding BATCH-f9780d died of, and the same class that
        produced this task's own DEV-1 `FileNotFoundError`.
      is_the_sha256_verified_at_run_time: >-
        NO. `environment_record` (line 401) and `run_cell` (line 591) each COMPUTE
        `sha256_file(strategies)` and WRITE IT INTO THE RECORD. Neither compares it to
        anything. There is no expected-hash constant for the strategies file anywhere in
        v2. `PINNED_PREDECESSOR_SHA256` exists as a constant but is only copied into the
        run_header (line 947) and is likewise never compared. A RECORDED HASH THAT IS NEVER
        CHECKED IS PROVENANCE, NOT BINDING -- which is exactly what the assignment asked me
        to determine, and the answer is provenance.
      what_it_does_on_each_failure_mode:
        file_missing: 'LOUD AND SAFE. BKZ.Param raises RuntimeError "Cannot open strategies file." (I reproduced it); v2 catches it into `status: ERROR` with a traceback, and the D1 STARTED stub survives. This is a genuine improvement over the predecessor, which lost everything.'
        file_present_but_DIFFERENT_BYTES: 'SILENT. The run proceeds, the divergent hash is recorded, and nothing refuses. A many-hour d=512 run would return a confident record whose numbers are not comparable with anything.'
        strategies_omitted_via_no_strategies: 'SILENT AND WORSE. `run_cell` guards both strategies fields behind `if strategies:` (line 589), so the final record carries NO strategies_file_used and NO strategies_sha256 at all -- the fact is recoverable only from `env["argv"]`, and only by a reader who thinks to look.'
      the_measured_cost_of_getting_it_wrong: >-
        ON MY OWN CELL, at d=64/beta=25/seed 613149553: pinned strategies gives 13 tours and
        b0 130.15375522819156; no strategies gives 26 tours and b0 130.28046668629952. The
        binding is not decorative.
      and_it_bites_harder_at_the_next_run_s_block_size: >-
        Strategies are indexed by block size. beta=55 selects the entry with
        preprocessing_block_sizes [36] -- an entry NO RUN IN THIS GOAL HAS EVER EXERCISED.
      severity: 'the highest of my five, and it is the named residual in my admissibility ruling'
      fix_is_a_few_lines: 'assert the expected sha256 before constructing BKZ.Param and refuse the run otherwise, exactly as my own Part A probe does'

