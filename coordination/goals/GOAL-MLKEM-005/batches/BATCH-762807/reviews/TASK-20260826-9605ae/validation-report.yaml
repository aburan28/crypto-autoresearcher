  # =============================================== the round's own design, judged
  procedure_deviations_judged:
    PD_A:
      what_it_did: >-
        Substituted the blind re-derivation of THE D6 QUANTITY -- required by three items
        of the committed, immutable handoff ledger/handoffs/TASK-20260826-9e9d53.yaml
        (constraints 73-75, deliverables 102-106, completion_gate 185-187) -- for a blind
        re-derivation of a Coordinator-chosen cell's tour count and b0, with D6 re-derived
        NON-BLIND under J3.
      i_was_invited_to_reject_it_and_i_do_not: 'THE COORDINATOR IS RIGHT AND THE ENVELOPE WAS WRONG.'
      why:
      - >-
        A BLIND ON D6 WAS NOT AVAILABLE TO BE HAD. 57.242, 54.8457 and the closed form
        q^(1/2 - 1/(2d)) are published in batch.yaml, DEC-20260824-5e222e and
        EV-MLKEM-59e4a4 -- and, decisively, review_plan.yaml and my own assignment BOTH
        QUOTE ALL THREE AT ME, in documents I am required to read before I can derive
        anything. Calling that re-derivation blind would have asserted an independence
        property this round does not have, which is worse than not doing it.
      - >-
        THE SUBSTITUTE IS STRICTLY STRONGER ON THE PROPERTY THAT MATTERS. The beta=25
        cell's answer existed in NO artifact of this repository. I did not have to be
        trusted not to look; there was nothing to look at. That converts the blind from a
        promise about my reading discipline into a property of the artifacts, which is the
        gate's PURPOSE even though it is not the gate's TEXT.
      - >-
        AND IT BOUGHT SOMETHING A D6 BLIND COULD NOT HAVE BOUGHT. Because I had to define
        "number of tours" for myself before looking, I read bkz2's `svp_preprocessing` and
        found the recursive `self.tour` call -- which is how the beta >= 46 warrant defect
        in J1 Part C was found. A blind re-derivation of a closed-form arithmetic identity
        would have found nothing, because there is nothing there to find: D6 is six lines
        of algebra and its PTM-3 control is the only part with any teeth.
      does_the_departure_drop_coverage_my_committed_gate_requires:
        gate_item_acceptance_results_adjudicated: 'MET UNCHANGED -- acceptance_results.json was not blinded and I adjudicated it directly, entry by entry.'
        gate_item_D6_rederived: 'MET IN SUBSTANCE -- D6 is re-derived by me from the definition under J3(c) with the PTM-3 known-false control attached, which is more than the envelope asked for. Only the word "blind" is not earned, and the plan says so everywhere it appears.'
        gate_item_tour_count_quantity_established: 'MET AND EXCEEDED -- the envelope''s J3 asked whether the count is tours; I answered that AND measured the two candidate readings diverging 20-fold at beta=46.'
        conclusion: 'NO COVERAGE IS LOST. Every substantive item of the committed envelope is discharged; one label is correctly withheld.'
    PD_G:
      the_objection_i_was_invited_to_make: 'that a blind on a cell the producer never ran buys LESS than a blind on the batch''s own figures'
      my_answer: >-
        IT BUYS LESS OF ONE THING AND MORE OF ANOTHER, AND THE TRADE IS THE RIGHT WAY
        ROUND. What is genuinely lost is real and PD-G states it accurately: NO REVIEWER IN
        THIS ROUND INDEPENDENTLY REPRODUCED THE beta=20 FIGURES THE PRODUCER REPORTED. I
        did not either. Its 9 tours and b0 140.93615575855614 are checked only for
        internal consistency against its own raw JSON and against its own equivalence
        control -- both of which I verified, neither of which is an independent
        reproduction. A later reader should not believe otherwise.
      what_is_gained: >-
        A blind that does not depend on my discipline, plus the exercise of the loop
        transcription at a block size the producer never touched -- which is the only
        reason anyone now knows that the instrument does not fail at an unfitted beta, and
        the route by which the beta >= 46 warrant defect surfaced.
      cheap_and_strictly_better_next_time: >-
        BOTH. The beta=20 reproduction costs about two seconds and needs no blind at all --
        it is an ordinary independent recomputation. A future round can have the
        artifact-level blind AND the reproduction of the batch's own figures; this one
        chose one when it could have had both. THAT is my objection to PD-G, and it is an
        objection to the round being narrower than necessary, not to the substitution.
    did_the_plan_or_my_assignment_hand_me_a_beta_25_figure_or_a_route_to_one:
      a_beta_25_figure: 'NO. Neither document contains one, and I found no beta=25 figure anywhere in this batch. The first one in this repository is the one my own probe produced.'
      a_route_to_the_answer: >-
        They gave me the construction and the seed FORMULA, which are the INPUTS -- that is
        what a re-derivation is. They withheld the seed VALUE, correctly, so a transcription
        error in the formula could not be masked by a matching constant; my evaluation
        produced 613149553 and the instrument independently produced the same value.
      one_omission_i_note_for_the_record: >-
        The plan transcribes lines 42-79 of `worker_main_cell` but stops at
        `bkz = BKZReduction(L)` and does not quote line 75, the predecessor's own
        `result["tours"] = getattr(bkz, "tours", None)`, which lies inside that range. I
        judge the omission CORRECT rather than a defect -- quoting it would have supplied
        me a candidate route in the very document that told me to choose my own -- but the
        Coordinator asked to be held to its transcription, so I record that the quoted
        range is stated as complete and is not. Everything the plan DID quote is faithful.
      a_content_level_leak_that_the_file_level_blind_from_cannot_stop:
        what: >-
          `blind_from` names EXECUTOR_ADDENDUM.md as a FILE. But
          implementation_report.md section 5.3 -- required in-scope reading with no
          embargo -- QUOTES two of that file's figures: 26 tours and final b0 134.3540 at
          d=64/beta=20.
        did_it_compromise_my_blind: >-
          NO. Those figures are beta=20 and my cell is beta=25, and the report states
          plainly why they differ (the addendum's probe used `BKZReduction(A)` on a bare
          matrix with fpylll's ROW_EXPO double GSO and no strategies file, not the pinned
          construction). I had already written blind-rederivation.yaml before I read the
          report.
        one_coincidence_i_state_and_lean_on_not_at_all: >-
          MY OWN PTM-1 STRATEGIES-FREE RUN AT beta=25 ALSO RETURNED 26 TOURS. I derived
          that 26 before reading implementation_report.md, at a different block size and a
          different GSO from the addendum's. I attach NO evidential weight to the
          coincidence and no inference of any kind follows from it. I record it only so
          that no later reader discovers the number twice and wonders whether I anchored.
        the_general_point_worth_carrying_forward: >-
          A blind_from list is scoped to FILES but the hazard is CONTENT, and content
          propagates into files that cannot be blinded because a reviewer must read them.
          Here it was harmless. It is the same lesson PD-G already drew from the other
          direction, and it argues the same way: blind a quantity nobody computed, rather
          than police a list of paths.
    the_claim_ceiling_audited_across_this_batch_s_records:
      does_any_record_read_as_though_a_green_board_were_a_result: >-
        NO, in the records I read. implementation_report.md leads section 0 with "A passing
        board is not a result", acceptance_results.json carries `not_evidence_about` and
        `scale_of_every_test`, batch.yaml and review_plan.yaml both fix the ceiling at
        `instrument_repair` and the tier at `toy`, and my own assignment says it four
        times. I looked for the failure and did not find it.
      does_any_record_read_as_though_this_batch_authorised_the_100_bit_re_run: >-
        NO. The instrument's own scale guard message names DEC-20260824-5e222e's refusal;
        implementation_report.md section 12 states that a passing board does not authorise
        the re-run and that approval requires a frozen contract plus a committed decision,
        neither of which exists; the review plan says an ADMIT is not an approval. My own
        ruling below says it again.

  # =====================================================================  ruling
  admissibility_ruling:
    question: 'Is this instrument fit to carry the next capped run at d=512, mpfr_bits=100?'
    ruling: ADMIT WITH NAMED RESIDUAL
    the_residual_named_concretely: >-
      THE STRATEGIES FILE IS NOT BOUND BY CONTENT AT RUN TIME (finding J2-F5).
      `rt_ctrl_1_matched_pair_v2.py` resolves it by a path computed from module location,
      COMPUTES its sha256 at lines 401 and 591, WRITES it into environment.json and into
      the cell record, and COMPARES IT TO NOTHING. There is no expected-hash constant for
      it anywhere in the file. A strategies file that is present but has different bytes is
      accepted silently, and a run launched with `--no-strategies` records no strategies
      field at all. I MEASURED what that costs on one cell: at d=64 / beta=25 / seed
      613149553, the pinned bytes give 13 tours and b0 130.15375522819156 while omitting
      them gives 26 tours and b0 130.28046668629952. At beta=55 the selected strategy entry
      carries preprocessing_block_sizes [36] and has never been exercised by any run in
      this goal.
    why_this_residual_and_not_another: >-
      Because it is the ONE failure mode that turns a many-hour d=512 run into a confident
      record of the wrong thing, silently, with every hash dutifully written down beside
      it. It is also the failure mode BATCH-f9780d actually died of, the one
      DEC-20260824-5e222e's rationale names, the one that produced this task's own DEV-1
      `FileNotFoundError`, and -- per the review plan -- the one that recurred again during
      this round's preparation. Everything else I found is a defect in a message, a
      sentence, or a window; this one is a defect in the binding.
    the_remedy_is_small_and_checkable: >-
      Assert the expected sha256 before constructing `BKZ.Param` and refuse the run
      otherwise -- which is exactly what my own Part A probe does in four lines, and what
      the instrument already has the helper (`sha256_file`) to do. Emit the strategies
      provenance unconditionally, including an explicit null when none was passed. Neither
      change touches the reduction.
    three_further_residuals_i_name_but_do_not_hang_admission_on:
    - 'J2-F3: clear or re-stamp `_H_PAYLOAD` when `run_cell` returns, so a KILLED_PARTIAL cannot name a completed cell. The matched pair runs two cells, so this window is on the actual next-run path.'
    - 'J2-F1: make the handler''s fd-1 notice conditional on the journal write having succeeded.'
    - 'J1 Part C: correct the `tours_definition` because-clause. The code is right; only the stated reason is wrong, and it is wrong precisely at beta >= 46.'
    why_ADMIT_and_not_DO_NOT_ADMIT: >-
      Because the instrument does the thing it was built to do, and I checked it rather
      than took it. Its tour count is right, and right for a structural reason robust to
      the hazard its own docstring misdescribes. Its numbers reproduce EXACTLY against an
      independent construction at a cell it was never fitted to, under strategies bytes
      named on both sides. Its flush fired in every one of nine signalled scenarios, never
      fired in the two where it must not, and I could not truncate its journal in ten
      attempts including a thirty-signal storm. Its artifacts hash 23/23 from disk and
      23/23 from the commit blob. Its report reproduces figure for figure. NONE OF MY FOUR
      RESIDUALS IS A REASON TO WITHHOLD A RUN; the first is a reason to spend four lines
      before launching one.
    what_this_ruling_is_not: >-
      AN ADMIT IS NOT AN APPROVAL. Approval is a frozen contract at a declared path plus a
      committed Coordinator decision, and NEITHER EXISTS for the 100-bit cell.
      DEC-20260824-5e222e's substance is a REFUSAL; this batch discharges a condition that
      refusal names and DOES NOT LIFT IT. Nothing in this report authorises any run, moves
      any status, or says anything about ML-KEM at any parameter set.
    on_the_coordinators_pre_commitment_P1: >-
      P1 records that a bare `ADMIT` will be read as under-coverage. MY RESIDUAL IS NOT
      THERE TO SATISFY P1 AND I WOULD HAVE NAMED IT IF P1 DID NOT EXIST. It is a measured
      difference -- 13 tours against 26, and two different b0 values on the same cell at
      the same seed -- in a mechanism the instrument does not check, in the exact failure
      class this goal was opened over. If my honest ruling had been a bare `ADMIT` I would
      have returned a bare `ADMIT` and let the Coordinator carry the cost of its own
      pre-commitment; it is not, on evidence I measured, and the P1 clause that binds
      harder here is `what_this_is_not`.
    scope_of_this_ruling: >-
      It is a ruling on MY THREE JOINTS ONLY. J4 (whether the d=64 surrogate generalises to
      d=512 at mpfr_bits=100), J5 and J6 are TASK-20260826-5ee48b's and I cannot see them
      by construction. A reviewer who has established that a fix FIRES has not established
      that it fires AT SCALE, and the scale question is not mine.

  what_i_hold_this_coordinator_to:
  - 'P1''s second half. If the close treats my named residual as vindication of the pre-commitment without engaging the measurement behind it -- 13 against 26 on one cell, under two named strategies states -- that is the Coordinator failing its own rule from the other direction.'
  - 'The sealed prior, digest ab97332282caa48480e786a0b4a57f12c164cfce508d3778e7683d962e52ee00, published VERBATIM at close by TASK-20260826-70d800. If it is paraphrased, edited or dropped, the seal was decoration.'
  - 'The two extra files. `blind-rederivation.yaml` and `probes/` are not in my committed handoff''s artifact_paths. They must be either declared and bound, or disclosed BY NAME under `staged_not_in_binding_set`. An undeclared file silently left unstaged is a lost record. The derivation itself is quoted verbatim below so it lands inside the binding set regardless.'
  - 'The claim ceiling, in the closing decision as much as anywhere else.'

  files_i_wrote:
    declared_artifacts:
    - coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/reviews/TASK-20260826-9605ae/validation-report.yaml
