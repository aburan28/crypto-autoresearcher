        57.242 and 54.8457 and the closed form itself are published in batch.yaml, in
        DEC-20260824-5e222e and in EV-MLKEM-59e4a4, and the review plan quotes them at me
        directly. A re-derivation of a number I was handed is not blind. It is an
        INDEPENDENT re-derivation from the definition, which is a different and lesser
        claim, and that is the claim I make. See `procedure_deviations_judged` PD-A.
      my_derivation_from_the_definition:
        step_1: 'delta_0 = ( ||b_0|| / vol(L)^(1/d) ) ^ (1/d). The 1/d exponent is on the RATIO.'
        step_2: 'For IntegerMatrix.random(d, "qary", k=d//2, q) the basis is [[I_k, A],[0, q*I_{d-k}]] with k = d//2, so vol(L) = q^(d-k) = q^(d/2), hence vol^(1/d) = q^(1/2).'
        step_3: 'corrected = (b0 / q^(1/2))^(1/d) = b0^(1/d) * q^(-1/(2d))'
        step_4: 'defective, the predecessor''s line 78 verbatim = b0^(1/d) / (q^(1/2))^(1/1) = b0^(1/d) * q^(-1/2)'
        step_5: 'corrected / defective = q^(-1/(2d)) / q^(-1/2) = q^(1/2 - 1/(2d)), INDEPENDENT OF b0'
        b0_independence_measured_by_me: 'over b0 in {1e2, 137, 130.15375522819156, 5e3, 2.5e4, 1e6, 1.234e9} and d in {64, 80, 128, 512}, max relative deviation 4.441e-16, spread across b0 <= 2.13e-14'
      the_premise_checked_empirically_not_only_asserted: >-
        vol^(1/d) = q^(1/2) is the load-bearing premise, and the producer's OWN committed
        record independently confirms it on a real d=64 basis:
        `vol_root_from_gso_exp_logdet_over_2d = 57.697486947007526` against my
        sqrt(3329) = 57.697486947006624, agreeing to 9.0e-13. I did not have to take the
        volume on faith.
      reproduce_the_two_committed_figures:
      - {quantity: 'distortion at (q=3329, d=512)', committed: 57.242, my_value: 57.24230824954366, rounds_to_committed_at_3dp: true}
      - {quantity: 'distortion at (q=3329, d=80)', committed: 54.8457, my_value: 54.8456813814762, rounds_to_committed_at_4dp: true}
      does_the_get_log_det_correction_change_D6: >-
        NO, AND I CHECKED RATHER THAN ACCEPTED IT. v2's reported `root_hermite_factor` is
        `(b0 / q**0.5) ** (1/d)` and calls `get_log_det` nowhere. The log-det appears only
        in the separate per-tour field `delta_0_from_gso_logdet`, where v2 already uses the
        corrected `exp(logdet/(2d))` and records the precedent's literal form beside it
        under its own label. D6's verdict is untouched. The producer's "it does not change
        D6" is CORRECT.

    PTM_3:
      object: 'D6 AT A DELIBERATELY WRONG d, AND A THIRD WRONG FORMULA (owner TASK-20260826-9605ae, under J3)'
      required_behaviour_stated_in_advance: 'the identity holds for exactly the (corrected, defective) pair at exactly the stated d, and fails everywhere else I push it'
      observed: PASS
      part_i_wrong_d:
        d_values_tested: [2, 8, 16, 32, 64, 80, 128, 256, 511, 512, 513, 1024]
        d_values_whose_closed_form_rounds_to_57.242: [512]
        d_values_whose_closed_form_rounds_to_54.8457: [80]
        nearest_neighbours: 'd=511 gives 57.241421018665854 and d=513 gives 57.24319203510327; neither rounds to 57.242'
        conclusion: 'the test is not passing for every d, so it is testing something'
      part_ii_a_third_wrong_formula:
        why_b0_independence_alone_is_not_enough: >-
          THE RATIO OF THE CORRECTED FORM TO ITSELF IS ALSO b0-INDEPENDENT. A check that
          only asks "is the ratio constant in b0?" accepts the vacuous case and identifies
          no defect. My check therefore requires BOTH b0-independence AND equality with
          q^(1/2 - 1/(2d)).
        results_at_d_in_64_80_512:
        - {candidate: 'corrected / predecessor line 78 (THE REAL PAIR)', b0_independent: true, matches_closed_form: true, MY_CHECK_ACCEPTS: true}
        - {candidate: 'third wrong formula b0**(1/d) / q**(1/(2*d))', b0_independent: true, matches_closed_form: false, ratio: 1.0, MY_CHECK_ACCEPTS: false}
        - {candidate: 'fourth wrong formula (b0/q)**(1/d)', b0_independent: true, matches_closed_form: false, ratio: '1.06541 at d=64, 1.052 at d=80, 1.00795 at d=512', MY_CHECK_ACCEPTS: false}
        - {candidate: 'corrected / ITSELF, the vacuous case', b0_independent: true, matches_closed_form: false, ratio: 1.0, MY_CHECK_ACCEPTS: false}
        conclusion: >-
          MY CHECK REJECTS all three known-false candidates, including the one that is
          b0-independent for the trivial reason. It accepts exactly the
          (corrected, predecessor-line-78) pair at exactly the stated d.
      probe: coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/reviews/TASK-20260826-9605ae/probes/j3_d6_and_ptm3.py

    d_disclosure_completeness:
      the_incidental_finding_against_a_committed_artifact:
        the_claim: 'in fpylll 0.6.4, M.get_log_det(0, d) returns the log-determinant of the GRAM matrix, so TASK-20260815-f14d3c''s exp(log_det/d) computes vol^(2/d) rather than vol^(1/d)'
        is_it_correct_in_the_installed_fpylll: >-
          YES, VERIFIED INDEPENDENTLY ON A MATRIX WITH A KNOWN DETERMINANT rather than on
          the producer's construction. For the diagonal basis diag(3,5,7), det = 105, and
          `M.get_log_det(0,3) = 9.307920700315046`. log(105) = 4.653960350157523, and the
          ratio get_log_det / log(vol) is EXACTLY 2.0. So get_log_det returns
          log(det(Gram)) = 2 log(vol). The observation is right.
        is_it_does_not_change_D6_right: 'YES -- see `does_the_get_log_det_correction_change_D6` above. Both halves of the producer''s statement are correct.'
        my_view_on_taking_no_position: >-
          Correct restraint. It is a finding against a COMMITTED artifact of another task
          and the remedy is a superseding record by whoever owns it, not an edit by this
          producer and not a ruling by me. I record the confirmation so that whoever does
          own it has an independent second observation to cite.
      is_the_producers_disclosure_list_complete_for_my_joints:
        answer: 'SUBSTANTIALLY, BUT NO. Five items are missing, three of them material.'
        what_it_got_right_and_i_will_not_pretend_otherwise: >-
          The five disclosed items are real, specific, self-damaging and accurate: the
          deferred handler inside a long C call, the residual mid-tour loss window at
          d=512, the GIL-starved sampler MEASURED at 9 samples against 19 rather than
          asserted, the uncapped tours_table, and the 24-line stdout_tail cap. DEV-1
          through DEV-4 disclose an ERROR-status smoke run, late edits to the signal path,
          and the fact that the tiny cell says nothing about the handler. That is more
          against-interest disclosure than this program usually sees and it is why the
          package is easy to audit.
        what_is_missing:
        - 'J2-F5, the run-time strategies binding: resolved by a module-relative path, sha256 recorded and never checked, divergent bytes accepted silently. MATERIAL, and it is this goal''s own recurring failure mode.'
        - 'J2-F3, the inter-cell and post-cell stale payload: a KILLED_PARTIAL can name a completed cell, on the two-cell path the next run uses. MATERIAL.'
        - 'J2-F1, the handler''s unconditional stdout notice asserting a flush that may not have happened. MATERIAL for an operator reading a killed d=512 run.'
        - 'J1 Part C, the false because-clause in the tour-count warrant at beta >= 46, i.e. at the next run''s block size. Documentation only; the mechanism is right.'
        - 'The acceptance suite contains NO negative control -- nothing that would fail if the flush fired unconditionally or if a record appeared after SIGKILL. Not a defect of the instrument; a gap in the evidence the board is offered as.'
        the_standard_i_am_applying: >-
          A producer that discloses six real limits and omits a seventh has bought trust it
          has not earned. Measured against that: this producer disclosed a great deal and
          missed five things, none of which it would have found without doing what I did --
          reading the final file clause by clause, killing it ten ways, and running it at a
          block size it was never fitted to. I do not read the omissions as concealment. I
          do read the list as INCOMPLETE, and say so.

    e_the_board_adjudicated:
      read_directly: acceptance_results.json
      summary_map: {D1: PASS, D2: PASS, D3: PASS, D4: PASS, D5: PASS, D6: PASS}
      summary_map_consistent_with_per_defect_status: true
      any_FAIL_or_NOT_REACHED: 'none'
      total_assertions_behind_the_six_entries: 39
      assertions_failed: 0
      per_defect_assertion_counts: {D1: 4, D2: 13, D3: 6, D4: 5, D5: 5, D6: 6}
      i_adjudicate_a_green_board_as_carefully_as_a_red_one: >-
        I checked each entry's `asserted` one-liner against what its cited evidence file
        actually shows, rather than against the status word. Five of six one-liners are
        supported by their checks exactly as written. ONE IS NOT, and it is D1.
      the_one_gap_between_a_one_liner_and_its_checks:
        entry: D1
        the_one_liner_claims: 'a per-cell STARTED stub WRITTEN BEFORE THE CELL BEGAN is on disk after a REAL SIGTERM'
        what_its_four_checks_actually_verify: 'that the process exited 143; that at least one stub exists; that a started-and-never-finished cell left a record; and that the stub carries d, beta, mpfr_bits, role, start time and status. NONE OF THEM VERIFIES THE WORD "BEFORE".'
        is_the_claim_nevertheless_true: >-
          YES, AND I ESTABLISHED IT MYSELF TWO WAYS. In the source, `journal.write(started)`
          is v2 line 551 and the first lattice call is line 593. In the artifacts, an
          O_APPEND journal preserves write order, and in my own T8 journal the
          `cell_started_stub` line precedes the first `tour_start` line. The stub really is
          written first. The gap is between the one-liner and its own evidence, not
          between the one-liner and reality.
      what_the_six_PASSES_DO_confirm: >-
        That on ONE host, at d=64 / beta=20 / mpfr_bits=53 / q=3329, with fpylll 0.6.4 and
        these strategies bytes, the successor instrument writes a per-cell STARTED stub
        before the cell begins, flushes a status-correct partial record when a real signal
        is delivered to a real subprocess, emits and flushes per-tour progress every tour,
        records resources machine-readably with a getrusage cross-check, counts tours by a
        stated mechanism that agrees with upstream `BKZReduction.__call__` at that cell,
