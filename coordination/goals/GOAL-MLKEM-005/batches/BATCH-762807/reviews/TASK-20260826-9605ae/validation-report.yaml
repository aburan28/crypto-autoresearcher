    part_c_the_definitional_question:
      what_the_instrument_declares: >-
        `tours_mechanism: "driving_loop_counter"`, machine-readable in every final record,
        with `tours_definition` giving the text. The instrument does NOT read `bkz.trace`
        on its driving path and does NOT read `getattr(bkz, "tours", None)`.
      is_the_recorded_count_the_number_of_tours: 'YES'
      how_i_established_it_three_ways:
      - >-
        (1) LINE-BY-LINE TRANSCRIPTION AUDIT against the INSTALLED fpylll 0.6.4 source
        (.../site-packages/fpylll/algorithms/bkz.py lines 125-137), not against upstream
        documentation. v2 lines 615-737 retain, IN ORDER: the AUTO_ABORT construction
        `BKZ.AutoAbort(bkz.M, bkz.M.d)`; `cputime_start = process_time()`; THE PRE-LOOP
        LLL `bkz.lll_obj()`; `clean = bkz.tour(par, 0, -1, tracer)` with the same
        argument form upstream's `__call__` uses at its own defaults (min_row=0,
        max_row=-1); `i += 1` after the tour; and all four break tests in upstream's
        order -- `clean or par.block_size >= bkz.M.d`, then AUTO_ABORT `test_abort()`,
        then MAX_LOOPS, then MAX_TIME. NOTHING IS DROPPED AND NOTHING IS REORDERED.
      - >-
        (2) MY OWN DEPTH-0 COUNTER, formed independently, gives 13 on the same cell.
      - >-
        (3) UPSTREAM'S OWN TRACER, `bkz(par, tracer=True)`, gives 13 tour contexts on the
        same cell, with root children exactly `['lll', ('tour',0) .. ('tour',12)]`.
      is_it_something_else_mistaken_for_tours:
        child_nodes_of_another_tracer_label: 'no -- the count is not read from the tracer at all on the driving path'
        preprocessing_sub_calls: 'NO, AND THIS IS THE INTERESTING ONE -- see the finding below'
        an_enumeration_count: 'no'
        a_loop_iteration_that_skips_or_double_counts: >-
          no. `i` is incremented exactly once per returned tour, before the break tests, so
          a tour that did not return is not counted and none is counted twice. The
          auto-abort decision point is OUTSIDE the counted region and AFTER the
          increment, which is upstream's placement.
      the_bkz_trace_claims_checked_against_the_installed_source_and_observed:
        producer_claim: '`bkz.trace` is None after a default `bkz(par)`, and `getattr(bkz,"tours",None)` is None'
        source_basis: >-
          bkz.py line 69 `def __call__(self, params, min_row=0, max_row=-1, tracer=False)`;
          line 101 `tracer = normalize_tracer(tracer)`; lines 943-966 `normalize_tracer(False)
          -> dummy_tracer`; lines 140-143 `try: self.trace = tracer.trace / except
          AttributeError: self.trace = None`. dummy_tracer is a `Tracer` instance with no
          `.trace` attribute.
        my_own_observation: 'partA_run1.json records bkz_trace_is_none: true and predecessor_getattr_bkz_tours: null on my beta=25 cell'
        verdict: 'the producer''s claim is CORRECT, and its refusal to use bkz.trace on the driving path is the right call'
      the_producers_equivalence_control_audited:
        location: acceptance_tests.py test_D5, lines 345-400
        are_the_two_arms_identically_seeded: >-
          YES, AND THE RNG STATE IS RE-INSTALLED FOR THE SECOND ARM RATHER THAN INHERITED.
          The control arm computes the seed from the same formula and calls
          `FPLLL.set_random_seed(seed)` BEFORE `IntegerMatrix.random` (lines 350-353). The
          recorded control seed 1299689790 equals the tiny cell's recorded seed.
        are_the_two_arms_identically_constructed: >-
          Yes, with ONE difference: the control passes `tracer=True` while v2 uses
          `dummy_tracer`. THE PRODUCER DID NOT CONTROL FOR THAT DIFFERENCE. I DID, at
          beta=25: `bkz(par)` and `bkz(par, tracer=True)` give the same 13 tours and the
          same b0 130.15375522819156, so on this construction the tracer is not
          load-bearing. That closes the gap at my cell; it is not closed at beta=20 by
          anyone, and it is a cheap check the producer could have shipped.
        result_recomputed_by_me_from_the_raw_json: 'upstream 9 == v2 9; b0 140.93615575855614 on both sides, bit-identical; trace child labels [lll, tour x9]'
      part_c_finding_the_warrant_is_wrong_where_the_next_run_lives:
        severity: 'a defect in a stated justification, NOT in the count and NOT in the control'
        the_sentence: >-
          rt_ctrl_1_matched_pair_v2.py `tours_definition` (lines 745-751) and
          implementation_report.md 5.1 both assert that the counted set "is exactly the
          set of ('tour', i) tracer contexts upstream opens, BECAUSE UPSTREAM OPENS ONE
          SUCH CONTEXT AROUND EACH self.tour(...) CALL AND AROUND NOTHING ELSE."
        why_the_because_clause_is_false: >-
          In the installed fpylll 0.6.4, `fpylll/algorithms/bkz2.py` lines 77-79,
          `svp_preprocessing` calls `self.tour(prepar, kappa, kappa + block_size,
          tracer=tracer)` once for every entry of
          `params.strategies[block_size].preprocessing_block_sizes`, per `svp_reduction`,
          per tour. NO TOUR CONTEXT IS OPENED AROUND THOSE CALLS -- the context is opened
          only by `__call__`. So `self.tour(...)` calls and ('tour', i) contexts are NOT
          in bijection whenever that list is non-empty.
        in_the_pinned_strategies_file_f516b0a6:
          preprocessing_block_sizes_empty_for_block_sizes: 0..45
          first_non_empty: '46 -> [18]'
          at_beta_50: '[26]'
          at_beta_55_THE_NEXT_RUNS_BLOCK_SIZE: '[36]'
          at_beta_56: '[38]'
          at_beta_100: '[76]'
        MEASURED_not_argued:
          cell: d=64, beta=46, mpfr_bits=53, q=3329, seed 2049284461
          strategies_sha256: f516b0a6f0c580cff72e1e2c3562c44dc6f17e8f99613e9e4020e35481b27a18
          top_level_loop_iterations_the_correct_reading: 13
          tour_calls_including_preprocessing: 260
          trace_root_children_labelled_tour: 13
          ratio: '20x divergence between the two readings on one d=64 cell'
          b0: 121.57302332343306
          probe_output: coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/reviews/TASK-20260826-9605ae/probes/partC_beta46_tracer.json
        what_this_does_and_does_not_impugn:
          the_instruments_count: >-
            UNAFFECTED AND CORRECT. v2 counts loop iterations, not `tour` calls, so it
            returns 13 in this regime too. The mechanism is robust to exactly the hazard
            its own justification misdescribes -- it is right for a better reason than the
            one given.
          the_equivalence_control: >-
            UNAFFECTED AND STILL VALID at beta >= 46, because it counts trace ROOT
            CHILDREN, which are only the driving loop's contexts.
          what_is_affected: >-
            The stated warrant, which a later reader may inherit instead of the mechanism.
            A reviewer or successor who accepted "one context per self.tour call" and
            reimplemented the count as a `tour`-call counter would overcount by a factor
            of about d at beta=55 -- and would be exactly right at beta=20 and beta=25.
        why_no_acceptance_test_could_have_caught_it: >-
          AT beta=20 AND beta=25 THE TWO READINGS ARE NUMERICALLY IDENTICAL, because
          `preprocessing_block_sizes` is empty below 46. The producer's whole board is
          beta=20, and even the Coordinator's chosen beta=25 blind cell sits below the
          threshold. This is a parameter-only blind spot, demonstrated by MEASUREMENT at
          acceptance dimension with no d=512 compute, not by projection.
        recommended_and_cheap: 'correct the sentence; the code needs no change'

    PTM_1:
      object: 'THE STRATEGIES-OMITTED CONSTRUCTION (owner TASK-20260826-9605ae, under J1)'
      required_behaviour_stated_in_advance: >-
