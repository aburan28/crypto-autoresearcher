        b0_r00: 130.28046668629952
      the_control_had_teeth_it_did_not_pass_vacuously: >-
        THE STRATEGIES-FREE CONSTRUCTION RETURNS A DIFFERENT ANSWER ON THE IDENTICAL CELL
        AT THE IDENTICAL SEED: 26 tours against 13, and a different b0. Had either side of
        any comparison in this review been built without `strategies=`, I would have
        reported a "mismatch" that measured nothing. That is the failure this object
        exists to catch and it is live on this cell.
      i_draw_no_comparison: >-
        13 and 26 are NOT compared, and 130.15375522819156 and 130.28046668629952 are NOT
        compared. A difference obtained under different strategies bytes localises to
        nothing.
      what_a_strategies_free_param_actually_does_in_this_container:
        it_does_not_raise: true
        what_it_produces: >-
          A TRIVIAL strategy set: 26 entries (block sizes 0..25) with ONE pruning parameter
          set at block size 25, against the pinned file's 101 entries and 21 pruning
          parameter sets at block size 25.
        BKZ_DEFAULT_STRATEGY_in_this_build: "b'/project/local/share/fplll/strategies/default.json' -- a build-time path that does not exist in this container"
        the_asymmetry_that_matters: >-
          AN EXPLICIT `strategies=` POINTING AT A MISSING FILE RAISES LOUDLY
          (`RuntimeError: Cannot open strategies file.`, which I reproduced). OMITTING
          `strategies=` DEGRADES SILENTLY to the trivial set. The loud path is the safe
          one; the silent one changes the answer without saying so.

