      TASK-20260826-602395: 1800
      TASK-20260826-9e9d53: 150
      TASK-20260826-9605ae: 900
      TASK-20260826-5ee48b: 900
      TASK-20260826-70d800: 300
    arithmetic: '420 + 1800 + 150 + 900 + 900 + 300 = 4470 seconds declared.'
    per_task_basis:
