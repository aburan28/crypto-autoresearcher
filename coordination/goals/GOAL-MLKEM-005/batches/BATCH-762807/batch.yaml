    reviewer_overrun_policy: >-
      REVIEWER OVERRUN IN AGENT TIME IS EXPECTED, MUST BE DISCLOSED IN THE ATTESTATION,
      AND MUST NOT BE MET BY REALLOCATING A CEILING. A reviewer that runs out reports
      its unreached joint as NOT REACHED with what it tried; it does not silently drop
