    maximum_runs_definition: >-
      `maximum_runs` COUNTS CHARGED EXPERIMENT RUNS UNDER A CONTRACT -- a run
      directory, a `RUN-*` identifier, a manifest, an armed deadline and a consumed
      ceiling. IT DOES NOT COUNT acceptance-test executions, read-only probes, unit
