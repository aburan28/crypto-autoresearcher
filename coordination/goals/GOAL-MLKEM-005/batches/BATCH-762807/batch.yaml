      field has been read two different ways in this repository before
      (DEC-20260824-af6d5c budget_adjudication.red_team_run_count).
    charged_runs_authorised_this_batch: 0
    charged_runs_note: >-
      THIS BATCH HAS ZERO CHARGED EXPERIMENT RUNS. No experiment contract is frozen, no
      RUN-* identifier is minted, no run directory is created, no manifest is written
      and no ceiling is consumed. EV-MLKEM-59e4a4 already records that the predecessor
