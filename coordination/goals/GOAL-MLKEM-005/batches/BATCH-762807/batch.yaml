batch:
  id: BATCH-762807
  goal_id: GOAL-MLKEM-005
  question_id: RQ-MLKEM-001
  opened_by: TASK-20260826-f1340b
  opened_at: '2026-08-26'
  opening_decision: DEC-20260824-5e222e
  opening_decision_note: >-
    THIS BATCH MINTS NO OPENING DECISION AND REQUESTS NONE. The authority already
    exists and is committed: DEC-20260824-5e222e (decided 2026-08-26) closed
    BATCH-f9780d as INCOMPLETE and set exactly one next_action, which
    ledger/goals/GOAL-MLKEM-005.yaml carries verbatim at its `next_action` field.
    That next_action IS this batch's contract. Authoring a second opening decision
    would be re-litigation of an authority that is already durable, so
    `opening_decision` points at DEC-20260824-5e222e and nothing else. The
    substance of that decision is a REFUSAL -- re-running the 100-bit cell under a
    larger budget is refused until the instrument fixes exist -- and this batch
    exists to discharge the condition that refusal names, not to work around it.
  objective: >-
    ZERO-LATTICE-COMPUTE INSTRUMENT REPAIR. Implement DEC-20260815-3e8e9c's binding
    condition (i) as a successor instrument to the RT-CTRL-1 matched-pair runner,
    repairing six named defects (D1..D6 below), and PROVE EACH FIX FIRES with a
    cheap acceptance test that consumes no d=512 reduction. The deliverable is an
    instrument plus a machine-readable acceptance ledger, not a measurement. One
    executor task, six acceptance tests, zero charged experiment runs.
  what_this_batch_explicitly_does_not_do:
    - >-
      IT DOES NOT RE-ATTEMPT THE 100-BIT (mpfr_bits=100) CELL. That re-run is
      REFUSED by DEC-20260824-5e222e until this instrument exists, and the refusal
      is the substance of the decision authorising this batch. No task of this
      batch may run it, and no record of this batch may report a figure as if it
      had.
    - >-
      IT DOES NOT RE-ATTEMPT THE 75-BIT CELL AS A RESEARCH MEASUREMENT. The 75-bit
      cell is already recorded twice in this container (EV-MLKEM-59e4a4) and once
      on the predecessor's host; re-running it here would buy nothing and would
      spend roughly 3000 s per attempt.
    - >-
      IT RUNS NO d=512 REDUCTION OF ANY KIND, at any precision, under any label.
    - >-
      IT PRODUCES NO EVIDENCE ABOUT ML-KEM, about lattice hardness, about the
      obstruction RT-CTRL-1 targets, or about precision response at tour level.
      An instrument that can now record an outcome has not observed one.
    - >-
      IT MOVES NO HYPOTHESIS. H-MLKEM-7d9bcc stays `proposed` and EXP-MLKEM-42ea04
      stays `review_required` with `approved_by: null`, carried verbatim from
      DEC-20260815-3e8e9c's binding list, until a follow-up's own results are
      reviewed and archived.
    - >-
      IT DOES NOT SIZE, AUTHORISE, OR PRE-APPROVE THE NEXT CAPPED RUN. When the
      100-bit cell is eventually re-attempted its budget must be sized from the
      14448 s LOWER BOUND BATCH-f9780d measured, never from the predecessor's
      2502.74 s, which DEC-20260815-3e8e9c calls a FAILURE cost in terms. Whether
      the repaired instrument makes that sizing computable is a question for this
      batch's Red Team joint J6, not a decision this opening takes.
    - >-
      IT DOES NOT WRITE, REGENERATE OR STAGE knowledge/INDEX.md, which is generated
      and gitignored.
    - >-
      IT DOES NOT ADDRESS (d=512, beta=40), (d=256, *), CTRL-3's full-tour-level
      precision search, Stage 1, any >= 8-draw grid, any 2^20 target generation, any
      NULL-1/2/3/SENS control, or any Branch-B hand-rolled reduction substitute.
      Scope carried unchanged from DEC-20260815-3e8e9c condition (iv).
  claim_ceiling: >-
    `instrument_repair`. Every record this batch produces is `analyzed` AT BEST and
    NEVER `supported`. CLAIM TIER STAYS `toy`. A PASSING ACCEPTANCE TEST IS NOT A
    RESULT: it says the instrument now records what it always should have recorded,
    which is a statement about the instrument and about nothing else. A FAILING
    acceptance test is an equally legitimate and equally reportable outcome, and
    the executor is told so explicitly so that nothing pushes it toward a green
    board. The four supported-promotion gates are not attempted and this batch
    carries no asymptotic-complexity claim.
  authority_chain:
    - >-
      DEC-20260815-3e8e9c condition (i) -- 'RT-CTRL-2's ZERO-COMPUTE INSTRUMENT
      FIXES LAND FIRST, BEFORE ANY FURTHER CAPPED RUN'. Names cpu_times() on the
      psutil handle, tour progress persisted on SIGTERM, stdout_tail retained for a
      timed-out cell, and load average captured into environment.json. Ends: 'They
      cost no lattice compute.'
    - >-
      DEC-20260824-5e222e -- closed BATCH-f9780d INCOMPLETE, recorded that condition
      (i) 'was not implemented, not mentioned, and recorded as no deviation -- and
      its pre-quantified cost was then incurred verbatim', and set the single
      next_action this batch discharges.
    - >-
      ledger/goals/GOAL-MLKEM-005.yaml `next_action` -- carries that action verbatim
      and is the goal head's one preserved next action.
    - >-
      EV-MLKEM-59e4a4 -- the evidence record whose `not_admissible_now` and
      `arithmetic_errors_disclosed` blocks are the committed source for D5 and D6.
  the_six_defects:
    instrument_under_repair:
      path: coordination/goals/GOAL-MLKEM-005/batches/BATCH-f9780d/tasks/TASK-20260824-b3e9da/rt_ctrl_1_matched_pair.py
      sha256: bc0524ee432a2327bc4a5cfff5d8f5d79b590d37b2f38ea428c78af5abb25035
      immutability: >-
        THAT FILE IS IMMUTABLE AND MUST NOT BE EDITED. It is bound by the completed
        snapshot receipt of TASK-20260824-c7248f, whose 15 declared path_sha256 the
        Validator recomputed 15/15 from both the commit blob and disk. The successor
        is a NEW file in this batch's own task directory. Editing the predecessor
        would break a completed archive permanently.
    successor_path: coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/tasks/TASK-20260826-602395/rt_ctrl_1_matched_pair_v2.py
    defects:
      - id: D1
        defect: >-
          The results JSON is written only AFTER `worker_main_cell` returns, so a
          SIGTERM'd cell leaves NO RECORD AT ALL. This is exactly the loss
          BATCH-f9780d suffered: 21538 s spent and the 100-bit cell wrote nothing.
        where: >-
          line 112, `with open(out, "w")`, which sits after line 106's call to
          worker_main_cell and after line 109's append.
        required_fix: >-
          Write a per-cell STARTED stub to the results file BEFORE the cell runs,
          carrying cell identity (d, beta, mpfr_bits, role), start time and
          `status: "STARTED"`, and flush it to disk before the cell begins.
        provenance: >-
          Validator R-1 ('A cell killed before that return contributes nothing --
          not a partial entry, none') and R-2; Red Team; EV-MLKEM-59e4a4
          observation 3; the snapshot commit's own prescription of a STARTED stub,
          which the Validator records as WEAKER than condition (i) because a stub
          yields 'started and did not finish' where a per-tour flush yields the
          tours-per-hour curve. Both are required here, D1 and D3 respectively.
      - id: D2
        defect: >-
          No SIGTERM handler. A hard kill loses all partial state; CPython installs
          no SIGTERM handler, so the interpreter dies without unwinding and the
          except/finally recording path never runs.
        where: 'absent from the runner entirely.'
        required_fix: >-
          Install a `signal.SIGTERM` (and `SIGINT`) handler that flushes the partial
          record -- tours so far, elapsed time, and `status: "KILLED_PARTIAL"` --
          then exits. It must be safe to call from a signal context: state the
          mechanism used (for example a pre-opened file descriptor and a
          pre-allocated buffer written with os.write, rather than json.dump into a
          freshly opened path) and state its safety argument honestly, claiming no
          more than the mechanism supports.
        provenance: >-
          DEC-20260815-3e8e9c condition (i); Validator C-2 ('no signal handler, no
          per-tour flush, no use of bkz.trace at all, no psutil, no cpu_times(), no
          environment.json, no load average'); Validator R-1 on CPython SIGTERM.
      - id: D3
        defect: >-
          No per-tour progress. A timeout therefore teaches exactly one bit
          ('> N s') instead of a tours-per-hour curve. BATCH-f9780d's 100-bit cell
          ran >= 14448 s and the machine-readable record learned '> 14448 s'.
        where: 'absent from the runner entirely.'
        required_fix: >-
          Emit per-tour progress -- tour index, wall clock at that tour, and the
          basis-quality readout obtainable cheaply at that point -- to the results
          file AND to stdout, flushed each tour, so a killed cell still carries a
          tours table.
        provenance: >-
          DEC-20260815-3e8e9c condition (i), which names the tours-per-hour cost
          curve as 'exactly the quantity a Stage-1 sizing decision needs and does
          not have'; Validator C-2; DEC-20260824-5e222e next_action.
      - id: D4
        defect: 'No machine-readable resource record.'
        where: >-
          absent. Peak RSS (~175 MB) and CPU occupancy appear in
          execution_report.md PROSE ONLY; the Validator records this as CM-3 and
          notes AGENTS.md 'Artifact policy' requires timestamps and resource
          measurements among the retained artifacts of every run.
        required_fix: >-
          Record peak RSS and CPU time machine-readably. DEC-20260815-3e8e9c(i)
          names the mechanism: call `.cpu_times()` on the psutil handle the polling
          loop already holds. Also capture LOAD AVERAGE into `environment.json`, and
          retain `stdout_tail` FOR A TIMED-OUT CELL -- both named by the same
          condition and both currently absent.
        provenance: >-
          DEC-20260815-3e8e9c condition (i) verbatim; Validator CM-3; the
          predecessor results JSON of BATCH-0d5018 had a peak_rss_mb field that this
          runner dropped.
      - id: D5
        defect: >-
          `result["tours"] = getattr(bkz, "tours", None)` -- fpylll never assigns a
          `tours` attribute, so this is ALWAYS None. THE INSTRUMENT COULD NOT HAVE
          RECORDED A SUCCESS EVEN IF IT HAD GOT ONE.
        where: 'line 75.'
        required_fix: >-
          Obtain the tour count from `bkz.trace` (the BKZ tree/trace object), not
          from a non-existent attribute. The committed predecessor at sha256
          58a1fdc21f45730789feeff69c6a6fd7c24bf4938be15d6e878afd246d0de485 did this
          with `bkz(par, tracer=True)` followed by
          `sum(1 for child in bkz.trace.children if child.label[0] == "tour")`, and
          that is the precedent to follow. STATE THE DEFINITION USED AND WHY IT IS
          THE NUMBER OF TOURS. If `bkz.trace` is unavailable in the installed fpylll
          0.6.4, count tours in the driving loop and SAY SO EXPLICITLY in the record
          -- do not silently substitute one quantity for another.
        provenance: >-
          Reached independently by both reviews. Validator R-3a: 'the string occurs
          0 times in either module', with a live probe under the runner's exact
          calling convention returning `getattr(bkz,'tours',None) -> None` and
          `hasattr -> False`. Red Team M-6/OBJ-1. EV-MLKEM-59e4a4
          arithmetic_errors_disclosed item 1.
      - id: D6
        defect: >-
          `root_hermite_factor = b0**(1/d) / (Q**0.5)**(1/1)` is the WRONG FORMULA.
          The trailing `**(1.0/1)` is a no-op and the 1/d exponent is applied to b0
          alone rather than to the ratio.
        where: 'line 78.'
        required_fix: >-
          Use `(b0 / Q**0.5) ** (1/d)`. For this q-ary construction with k = d//2 the
          volume^(1/d) is q^(1/2), so the definition requires the 1/d exponent to
          apply to the ratio. The written form is smaller than the correct one by a
          factor q^(1/2 - 1/(2d)). AN ACCEPTANCE TEST MUST ASSERT THAT RATIO IN
          CLOSED FORM.
        provenance: >-
          Validator M-6 and R-3b, which record the distortion factor as 57.242 at
          d=512 and cross-check it at d=80 on a genuinely reduced basis -- runner
          formula 0.018481105, standard delta_0 1.0136088, ratio 54.8457 =
          3329^(1/2 - 1/160), as predicted. DEC-20260824-5e222e records the same
          figure as 'wrong by 57.242 at d=512'. EVERY ONE OF THOSE NUMBERS IS QUOTED
          FROM A COMMITTED ARTIFACT AND NONE WAS COMPUTED BY THIS OPENING SESSION,
          WHICH HELD NO SHELL.
  condition_v_verbatim_and_binding:
    source: 'DEC-20260815-3e8e9c condition (v)'
    text: >-
      PRESERVE EVERY ARTIFACT OF EVERY EXECUTION, INCLUDING AN
      INFRASTRUCTURE-KILLED ONE, UNDER A `failed_infrastructure` LABEL. Do not
      direct their deletion.
    how_it_binds_here: >-
      Reproduced verbatim in TASK-20260826-602395's constraints and in its task
      card. It binds every acceptance-test execution, including a surrogate the
      executor deliberately kills: a killed surrogate's results file, stdout and
      timestamps are artifacts and are preserved under the `failed_infrastructure`
      label with the naming convention disclosed. BATCH-f9780d discharged this
      condition in substance (attempt 1's full artifact set preserved as
      *.attempt1_killed.*) while not using the literal label; this batch requires
      the literal label so the deviation is not carried a second time.
  how_the_fixes_are_proven_without_lattice_compute:
    principle: >-
      Each of D1..D6 gets its own cheap acceptance test that proves the fix FIRES,
      not merely that the code contains it. Every test runs in seconds to a couple
      of minutes. NO TEST USES d=512 AND NO TEST USES mpfr_bits=100 AT d=512.
    per_defect:
      D6: >-
        PURE ARITHMETIC UNIT TEST, no lattice at all. Assert in closed form that
        (correct / written) = q^(1/2 - 1/(2d)) for the two parameter pairs the
        committed record already carries -- (q=3329, d=512) reproducing 57.242 and
        (q=3329, d=80) reproducing 54.8457 -- and assert the v2 formula equals
        (b0/q^(1/2))^(1/d) on symbolic or synthetic b0 values. This test needs no
        basis and no fpylll.
      D5: >-
        A TINY LATTICE (for example d=64, beta=20) that COMPLETES in seconds and
        yields a NON-None INTEGER tour count from the v2 instrument's own tour-count
        path. The test asserts the value is an int, is >= 1, and is obtained by the
        declared mechanism; and it records the mechanism name in the result file so
        a reviewer can check that the quantity counted is tours.
      D1_D2: >-
        LAUNCH A SURROGATE CELL, SEND IT SIGTERM MID-RUN, AND SHOW THE RESULTS FILE
        CONTAINS BOTH THE STARTED STUB AND THE FLUSHED PARTIAL RECORD with
        `status: "KILLED_PARTIAL"`. THE SURROGATE MAY BE A TINY LATTICE OR AN
        OUTRIGHT SLEEP STUB; THE EXECUTOR MUST SAY WHICH IT USED, RECORD
        `surrogate: true` WITH THE SURROGATE KIND, AND ROUTE IT THROUGH THE V2
        INSTRUMENT'S OWN STUB/HANDLER/FLUSH CODE PATH rather than a re-implementation
        of it -- a test that exercises a copy of the mechanism proves nothing about
        the mechanism.
      D3_D4: >-
        THE SAME TINY CELL. Assert a tours table with MORE THAN ONE ROW, a NON-ZERO
        CPU time from `.cpu_times()`, a peak RSS, a load average present in
        `environment.json`, and a NON-EMPTY `stdout_tail` for the timed-out or
        killed cell.
    what_the_surrogate_cannot_show: >-
      RECORDED AT OPENING RATHER THAN DISCOVERED AT REVIEW. A tiny-d surrogate
      cannot show that a fix survives at d=512 with mpfr_bits=100: it cannot exercise
      per-tour flush cost against a tour that takes hours, cannot show that the
      handler fires when the process is deep in an fplll C call that does not return
      to the interpreter between signal delivery and death, and cannot bound the
      overhead the per-tour flush adds to a real reduction. That gap is assigned to
      Red Team joint J4 and is not to be papered over by a green acceptance board.
  acceptance_results_contract:
    path: coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/tasks/TASK-20260826-602395/acceptance_results.json
    shape: >-
      A machine-readable map from each of D1..D6 to PASS / FAIL / NOT_REACHED, each
      entry carrying the evidence path it is read from, the command that produced
      it, and a one-line statement of what was actually asserted.
    a_fail_is_a_legitimate_outcome: >-
      STATED EXPLICITLY SO NOTHING PUSHES THE EXECUTOR TOWARD A GREEN RESULT. A FAIL
      is a real, reportable, valuable outcome and is reported as one. A NOT_REACHED
      is reported as NOT_REACHED with what was tried. Retuning a test until it
      passes, weakening an assertion after seeing it fail, or reporting a fix as
      firing on the strength of reading the code is a contract violation, not a
      shortcut. Under AGENTS.md rule 3 an infrastructure failure inside an acceptance
      test is infrastructure signal and is never evidence that a fix is impossible.
    every_declared_file_is_written: >-
      EVERY DECLARED artifact_path IS WRITTEN EVEN WHEN ITS TEST DOES NOT RUN,
      carrying `"status": "NOT_REACHED"` and the reason, rather than being absent. A
      completed archive's path_sha256 must cover EVERY declared artifact, so an
      absent file makes the snapshot unsatisfiable. This is the mechanism by which
      hard rule 3 of this batch is honoured.
  task_graph:
    shape: >-
      TASK-20260826-f1340b (coordinator, opening) -> TASK-20260826-602395 (executor,
      producer) -> TASK-20260826-9e9d53 (coordinator, SNAPSHOT archive, ALONE) ->
      {TASK-20260826-9605ae (validator), TASK-20260826-5ee48b (red-team)} in
      parallel and sibling-blind -> TASK-20260826-70d800 (coordinator, LEDGER
      archive / close, ALONE).
    archives_run_alone: >-
      TASK-20260826-9e9d53 and TASK-20260826-70d800 each run ALONE, by rule. Workers
      do not commit into a shared worktree and two archives must not race on one Git
      index or HEAD.
    every_task_is_claimed: >-
      TASK-20260826-f1340b and TASK-20260826-602395 are archived by
      TASK-20260826-9e9d53. TASK-20260826-9605ae and TASK-20260826-5ee48b are
      archived by TASK-20260826-70d800. Every non-archive task is claimed by exactly
      one archive task.
    opening_task_state: >-
      `state: "completed"` IS THE CHOICE THIS OPENING MAKES, and the reason is that
      TASK-20260826-f1340b IS the opening control plane: it completes when this
      authoring session finishes writing batch.yaml, the queue, the producer card
      and the six handoffs, and there is no later moment at which it could become
      complete. It is the same choice BATCH-171407's TASK-20260826-fc9e5e made and
      the driving session reconciles it against the dispatcher. The cost of the
      choice is stated: a `completed` non-archive task whose artifacts are not yet
      committed is complete as WORK and not yet durable as EVIDENCE, and durability
      arrives only when TASK-20260826-9e9d53's snapshot receipt is accepted by the
      post-commit verifier.
  routing_justification: >-
    RECORDED EXPLICITLY RATHER THAN LEFT UNARGUED. Both reviewers run at
    `review-adversarial` (xhigh), NOT `review-breakthrough` (max). The routing rule
    in docs/dynamic-subagent-dispatch.md sends `claimed_breakthrough`, a proposed
    closure, or a result contradicting prior validated evidence to
    `review-breakthrough`. THIS BATCH IS NONE OF THE THREE. It is an instrument
    repair: it claims no breakthrough, proposes no closure of GOAL-MLKEM-005 or of
    any lane, moves no hypothesis, and contradicts no validated evidence record --
    it IMPLEMENTS what two committed reviews and two committed decisions already
    agreed was missing. Paying the top tier here would price review out of the loop
    for the ordinary work it exists to cover, which AGENTS.md names as the reason
    the tiers are separate. The tier would change if this batch's producer returned
    a result contradicting EV-MLKEM-59e4a4's committed observations; it does not
    change because the work feels important. Role-to-agent binding follows the table
    in docs/dynamic-subagent-dispatch.md: coordinator + coordinator-orchestration-code
    -> `coordinator` at high; executor + executor-implementation -> `executor` at
    medium; validator + review-adversarial -> `validator` at xhigh; red-team +
    review-adversarial -> `red-team` at xhigh.
  max_concurrent: 2
  max_concurrent_basis: >-
    THE MACHINE IS 4 CORES / 16075 MiB (measured and recorded in BATCH-f9780d's
    execution_report.md, not by this session). GOAL-MLKEM-005's own campaign_budget
    allows max_concurrent 3, and this batch DELIBERATELY DECLARES 2 INSTEAD.
    GOAL-AES-003 BATCH-002 degraded at 3 concurrent producers on this shape
    (DEC-20260802-b226fb, cited by AGENTS.md 'Dynamic dispatch'), and more
    importantly the widest stage of THIS batch is exactly 2 -- the two sibling-blind
    reviewers -- while every other stage is serial and both archives run alone by
    rule. Declaring 3 would be decoration: no third task is ever eligible at the
    same time. Claims held by other sessions on this goal count toward this cap,
    since they run on the same repository and often the same host.
  queue_binding_note: >-
    coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/dispatch_queue.json IS
    DELIBERATELY NOT AN artifact_path OF ANY TASK AND NO ARCHIVE OF THIS BATCH BINDS
    IT. A content-bound archive stores its sha256 map INSIDE that file, so binding it
    would demand the file contain its own sha256 -- a hash fixed point that no write
    ordering satisfies. THIS IS MEASURED, NOT THEORETICAL: BATCH-145531 made its own
    snapshot unsatisfiable this way, DEC-20260824-257f35 F-4 ruled the defect was AT
    THE OPENING and set the successor gate in terms, and the driving session repaired
    the identical defect on BATCH-f9780d today. THE RESIDUAL IS STATED RATHER THAN
    WAVED AWAY: this file's bytes are NOT cryptographically bound, so a later edit
    would go undetected by any receipt of this batch. What closes the gap instead is
    that everything the queue carries which matters to the review round -- each
    reviewer's read and write scope, the joint decomposition, the budgets, the claim
    ceiling and every task's completion gate -- is ALSO carried by batch.yaml, by the
    producer task card and by the six ledger/handoffs/ envelopes, ALL OF WHICH ARE IN
    THE SNAPSHOT BINDING SET. The snapshot receipt must disclose the queue in
    `staged_not_in_binding_set` by name.
  handoff_authority_note: >-
    Each queue task carries an embedded `handoff` which is the queue-schema copy. THE
    AUTHORITATIVE ENVELOPE IS ledger/handoffs/<TASK-ID>.yaml, and where the two differ
    in wording the envelope governs. Budgets, inference blocks, artifact_paths,
    archive blocks and completion gates are identical in both by construction.
  review_plan_note: >-
    `review_plan` IS NULL ON ALL SIX HANDOFFS AT OPENING AND THAT IS DELIBERATE. Per
    AGENTS.md 'Review architecture' the review round is opened by the SNAPSHOT archive
    task TASK-20260826-9e9d53, AFTER that archive lands and BEFORE either reviewer
    runs. The plan's path and both assignment documents are declared in
    TASK-20260826-9e9d53's artifact_paths AT OPENING, because the dispatcher requires
    a completed archive's path_sha256 to be a subset of the declared set and to cover
    it exactly, so artifact_paths cannot be retrofitted later. The plan must carry
    `claim_under_review` as the PRODUCER stated it, the Coordinator's `coordinator_prior`
    written before any report returns, the six joints below each owned by exactly one
    reviewer with a worked attack plan, `blindness.mutual: true` with an empty
    `lifted_for`, a `proves_too_much` block, and `blind_rederivation` for the D6
    quantity. It must also require an `admissibility_ruling` block from each reviewer.
  reserved_identifiers_note: >-
    TWO IDENTIFIERS ARE RESERVED AND ARE NOT SPENT BY THIS OPENING. EV-MLKEM-09d715
    (evidence) and DEC-20260826-9d7d93 (closing decision) are both written by
    TASK-20260826-70d800, the ledger archive, and by nothing else. They appear in this
    batch only as that task's declared artifact_paths and archive.record_ids. NO OTHER
    RECORD OF THIS BATCH MAY USE THEM. They were minted and `--check`ed free by the
    driving session; this authoring Coordinator subagent holds no shell, ran
    tools/allocate_id.py zero times, and minted nothing. No hypothesis id, no
    experiment id and no knowledge id was allocated for this batch, because no
    hypothesis moves and no experiment contract is frozen -- if the close finds a
    knowledge promotion warranted it will need an identifier this batch did not
    pre-allocate, and that constraint is named HERE rather than discovered there.
  suggested_joints:
    status: >-
      THE COORDINATOR'S SUGGESTED JOINT DECOMPOSITION, SEEDED AT OPENING SO THE
      SNAPSHOT TASK IS NOT INVENTING IT COLD. TASK-20260826-9e9d53 writes the binding
      review plan and may refine these; any departure is recorded in the plan's
      `procedure_deviations` rather than absorbed. Six joints, three per reviewer,
      disjoint, one owner each.
    joints:
      - id: J1
        owner: TASK-20260826-9605ae
        role: validator
        joint: 'D6 -- the root-Hermite correction.'
        attack: >-
          RE-DERIVE THE CORRECTION INDEPENDENTLY from the definition of the root
          Hermite factor and the parameters alone, and confirm the q^(1/2 - 1/(2d))
          ratio -- 57.242 at (q=3329, d=512) -- from the formulas, not from the
          executor's implementation or report. BLIND RE-DERIVATION CANDIDATE: this is
          the load-bearing quantity of the batch and it is re-derivable in closed
          form, which is precisely the case where recomputing from the producer's own
          artifacts would faithfully reproduce a wrong-but-self-consistent
          implementation.
        breaking_artifact: >-
          A closed-form derivation disagreeing with the executor's formula or with
          the committed 57.242 figure, localised to one of the two implementations.
      - id: J2
        owner: TASK-20260826-9605ae
        role: validator
        joint: 'D1 and D2 -- do the STARTED stub and the SIGTERM flush actually fire?'
        attack: >-
          Do they produce a record UNDER A REAL KILL, or only on the happy path?
          ATTACK THE SIGNAL-SAFETY OF THE HANDLER: what does it allocate, what does it
          open, what does it do if the signal arrives while the results file is
          already open for writing, and what happens if SIGTERM lands while the
          process is inside an fplll C call. Re-run the executor's own kill test and
          try to produce a truncated or empty results file.
        breaking_artifact: >-
          A kill that leaves no record, an empty record, or a truncated/unparseable
          JSON file.
      - id: J3
        owner: TASK-20260826-9605ae
        role: validator
        joint: 'D5 -- is the recorded tour count really the number of tours?'
        attack: >-
          Is the value read from `bkz.trace` the number of TOURS, or something else
          the executor mistook for it -- child nodes of another label, preprocessing
          sub-calls, or an enumeration count? Check the label predicate against fpylll
          0.6.4's own tracer, and cross-check the count against an independently
          instrumented driving loop on the same tiny lattice.
        breaking_artifact: >-
          A tiny-lattice run where the instrument's tour count and an independent
          count of tours disagree, or a demonstration that the label predicate selects
          the wrong nodes.
      - id: J4
        owner: TASK-20260826-5ee48b
        role: red-team
        joint: 'THE SURROGATE DOES NOT GENERALISE.'
        attack: >-
          The acceptance tests run at tiny d. NAME WHAT A d=512, mpfr=100 RUN WOULD DO
          THAT THE SURROGATE CANNOT SHOW, and say whether any of the six fixes could
          SILENTLY FAIL ONLY AT SCALE -- per-tour flush cost against multi-hour tours,
          signal delivery inside a long C call, RSS or file-handle behaviour over
          hours, a tours table that grows unboundedly, a stdout_tail that truncates
          the only interesting part.
        breaking_artifact: >-
          A named, concrete scale-only failure mode of a fix that the acceptance suite
          reports as PASS.
      - id: J5
        owner: TASK-20260826-5ee48b
        role: red-team
        joint: 'PROVES-TOO-MUCH.'
        attack: >-
          IF THESE FIXES HAD BEEN APPLIED TO THE PREDECESSOR RUN, WOULD THEY HAVE
          CHANGED ITS VERDICT? Run the argument against the object where its
          conclusion is known: BATCH-f9780d's own executions. If the answer is 'no',
          say what this batch actually buys and whether that is worth its cost. An
          instrument repair that would not have changed a single committed verdict is
          not thereby worthless, but it must be defended on what it enables next
          rather than on what it would have fixed.
        breaking_artifact: >-
          A demonstration that the repaired instrument, applied to BATCH-f9780d's
          exact executions, yields the same one bit -- or, conversely, a demonstration
          that it changes a verdict the ledger has already recorded, which would be a
          contradiction with validated evidence and would re-route the review tier.
      - id: J6
        owner: TASK-20260826-5ee48b
        role: red-team
        joint: 'COST AND NEXT-RUN SIZING.'
        attack: >-
          DEC-20260824-5e222e requires the next 100-bit attempt to be sized from the
          14448 s LOWER BOUND, NEVER from the predecessor's 2502.74 s failure time.
          DOES THE REPAIRED INSTRUMENT MAKE THAT SIZING COMPUTABLE, AND WHAT IS STILL
          MISSING? A tours-per-hour curve from a killed cell is the quantity
          DEC-20260815-3e8e9c(i) said a Stage-1 sizing decision needs; check whether
          the v2 instrument would actually produce it under a cap, and what else a
          sizing decision would still lack.
        breaking_artifact: >-
          A demonstration that the instrument still cannot produce a sizing input from
          a capped cell, or an enumeration of what it would additionally need.
    admissibility_ruling_required: >-
      EACH REVIEWER MUST RETURN AN `admissibility_ruling` BLOCK, SEPARATE FROM ITS
      JOINT FINDINGS, answering ONE question: IS THIS INSTRUMENT FIT TO CARRY THE NEXT
      CAPPED RUN? as ADMIT / DO NOT ADMIT / NOT IN MY SCOPE, WITH THE REASON. A
      `breaks` on an owned joint is not by itself a refusal of admission, and an ADMIT
      is not an approval of any re-run -- approval is a frozen contract plus a
      committed decision, and neither exists for the 100-bit cell. SILENCE IS NOT AN
      ADMISSION and may not be read as one.
  blindness_boundary: >-
    THE TWO REVIEWERS ARE SIBLING-BLIND. Neither may read the other's directory:
    coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/reviews/TASK-20260826-9605ae
    is outside TASK-20260826-5ee48b's read scope, and
    coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/reviews/TASK-20260826-5ee48b
    is outside TASK-20260826-9605ae's read scope. The boundary lists ONLY the sibling's
    review directory and its assignment document; it never lists a reviewer's own two
    documents. Each reviewer attests to what it read. Their write scopes are disjoint
    by construction, which is what lets them run concurrently under max_concurrent 2.
    Blindness is not lifted in this round and `lifted_for` is empty.
