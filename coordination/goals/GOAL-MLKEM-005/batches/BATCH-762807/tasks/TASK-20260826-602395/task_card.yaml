task_card:
  id: TASK-20260826-602395
  goal_id: GOAL-MLKEM-005
  batch_id: BATCH-762807
  question_id: RQ-MLKEM-001
  role: executor
  requested_policy: executor-implementation
  opening_decision: DEC-20260824-5e222e
  title: >-
    BUILD THE SUCCESSOR RT-CTRL-1 MATCHED-PAIR INSTRUMENT, repairing the six named
    defects D1..D6 of the pinned runner, and PROVE EACH FIX FIRES with one cheap
    acceptance test per defect. ZERO LATTICE COMPUTE.
  the_one_sentence_version: >-
    Make the instrument capable of recording an outcome, and show that it does --
    without running the experiment whose outcome it would record.

  what_authorises_this_task:
    committed_next_action: >-
      ledger/goals/GOAL-MLKEM-005.yaml carries EXACTLY ONE next_action, set by
      DEC-20260824-5e222e on 2026-08-26: implement DEC-20260815-3e8e9c's binding
      condition (i) -- the RT-CTRL-2 zero-compute instrument fixes -- BEFORE any
      further capped run at this basis. At minimum: a per-cell STARTED stub written
      before the cell runs; a SIGTERM handler that flushes partial state; per-tour
      progress; a machine-readable resource record (peak RSS, CPU time); `tours`
      taken from bkz.trace rather than a non-existent attribute; and the
      root-Hermite factor corrected to (b0/q^(1/2))^(1/d).
    what_the_authority_refuses: >-
      THE SAME DECISION REFUSES THE THING THIS TASK MIGHT OTHERWISE BE MISTAKEN FOR.
      'RE-RUNNING THE 100-BIT CELL UNDER A LARGER BUDGET IS EXPLICITLY NOT THE NEXT
      ACTION AND IS REFUSED UNTIL THOSE FIXES EXIST: BATCH-f9780d spent 21538 s and
      its 100-bit cell wrote NO RECORD AT ALL, which is precisely the loss condition
      (i) was written to prevent and which it already prevented once.' That refusal
      is the substance of the decision you are working under. Do not work around it.
    why_it_costs_no_lattice_compute: >-
      DEC-20260815-3e8e9c condition (i) ends: 'They cost no lattice compute.' The
      budget for this task is sized on that premise.

  scope:
    this_task_does:
      - Write ONE new instrument module repairing D1..D6.
      - Write SIX cheap acceptance tests, one per defect, each proving its fix FIRES.
      - Write a machine-readable acceptance board and the per-defect evidence files.
      - Write an implementation report of observations only.
    this_task_does_not:
      - >-
        IT DOES NOT RE-ATTEMPT THE 100-BIT (mpfr_bits=100) CELL. Refused by
        DEC-20260824-5e222e until this instrument exists.
      - >-
        IT DOES NOT RE-ATTEMPT THE 75-BIT CELL AS A RESEARCH MEASUREMENT. That cell
        is already recorded twice in this container and once on another host.
      - >-
        IT RUNS NO d=512 REDUCTION OF ANY KIND, at any precision, under any label.
      - >-
        IT DOES NOT ADDRESS (d=512, beta=40), (d=256, *), CTRL-3's full-tour-level
        precision search, Stage 1, any >= 8-draw grid, any 2^20 target generation,
        any NULL/SENS control, or any hand-rolled reduction substitute.
      - >-
        IT DOES NOT INTERPRET, does not move a hypothesis, does not write a ledger
        record, does not write or regenerate knowledge/INDEX.md, and NEVER COMMITS.
    claim_ceiling: >-
      `instrument_repair`, `analyzed` at best, NEVER `supported`. CLAIM TIER STAYS
      `toy`. A PASSING ACCEPTANCE TEST IS NOT A RESULT: it says the instrument now
      records what it always should have recorded, and nothing more. NOTHING THIS
      TASK PRODUCES IS EVIDENCE ABOUT ML-KEM AT ANY FIPS 203 PARAMETER SET, about
      lattice hardness, or about the obstruction RT-CTRL-1 targets.

  the_instrument_under_repair:
    path: coordination/goals/GOAL-MLKEM-005/batches/BATCH-f9780d/tasks/TASK-20260824-b3e9da/rt_ctrl_1_matched_pair.py
    sha256: bc0524ee432a2327bc4a5cfff5d8f5d79b590d37b2f38ea428c78af5abb25035
    status: >-
      IMMUTABLE. MUST NOT BE EDITED. It is bound by the completed snapshot receipt
      of TASK-20260824-c7248f, whose 15 declared path_sha256 the Validator
      recomputed 15/15 from both the commit blob and disk. Editing it would break a
      completed archive permanently. THE SUCCESSOR IS A NEW FILE IN THIS TASK'S OWN
      DIRECTORY.
    successor_path: coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/tasks/TASK-20260826-602395/rt_ctrl_1_matched_pair_v2.py
    precedent_to_reuse:
      path: coordination/goals/GOAL-MLKEM-005/batches/BATCH-0d5018/tasks/TASK-20260815-f14d3c/stage0_d512_beta5570_precision_bisection_and_reattempt.py
      sha256: 58a1fdc21f45730789feeff69c6a6fd7c24bf4938be15d6e878afd246d0de485
      why: >-
        THIS COMMITTED PREDECESSOR ALREADY DID TWO OF THE SIX THINGS CORRECTLY and
        is the precedent for both. It called `bkz(par, tracer=True)` and then
        `sum(1 for child in bkz.trace.children if child.label[0] == "tour")` for the
        tour count (D5), and it computed
        `delta_0 = (sqrt(M.get_r(0,0)) / exp(M.get_log_det(0,d)/d)) ** (1.0/d)` --
        the standard definition from the GSO's own log-determinant (D6). Its
        environment.json is the shape precedent for D4. READ IT AS PRECEDENT; DO NOT
        RUN IT AT d=512.

  the_six_defects:
    - id: D1
      defect: >-
        The results JSON is written only AFTER `worker_main_cell` returns, so a
        SIGTERM'd cell leaves NO RECORD AT ALL. This is exactly the loss BATCH-f9780d
        suffered: 21538 s spent, and the 100-bit cell wrote nothing -- no status, no
        tours, no root-Hermite factor, no seed_used, no error string.
      where: >-
        line 112, `with open(out, "w")`, which sits after line 106's call to
        worker_main_cell and after line 109's append. A cell killed before that
        return contributes nothing -- not a partial entry, none. A SIGTERM-killed
        process additionally never reaches the except/finally path, since CPython
        installs no SIGTERM handler.
      required_fix: >-
        Write a per-cell STARTED stub to the results file BEFORE the cell runs,
        carrying cell identity (d, beta, mpfr_bits, role), start time and
        `status: "STARTED"`, flushed to disk before the cell begins.
      proven_by: >-
        A surrogate cell launched and SIGTERM'd mid-run, whose results file is then
        shown to contain the STARTED stub.
    - id: D2
      defect: >-
        No SIGTERM handler. A hard kill loses all partial state.
      where: 'absent from the runner entirely.'
      required_fix: >-
        Install a `signal.SIGTERM` (and `SIGINT`) handler that flushes the partial
        record -- tours so far, elapsed time, and `status: "KILLED_PARTIAL"` -- then
        exits. IT MUST BE SAFE TO CALL FROM A SIGNAL CONTEXT. State the mechanism you
        used (for example a pre-opened file descriptor plus a pre-allocated buffer
        written with os.write, rather than json.dump into a freshly opened path) and
        STATE ITS LIMITS HONESTLY: what happens if the signal arrives mid-write, and
        what happens if it arrives while the process is inside an fplll C call.
      proven_by: >-
        The same surrogate: the results file after the kill contains the flushed
        partial record with status KILLED_PARTIAL, and it parses.
    - id: D3
      defect: >-
        No per-tour progress. A timeout therefore teaches exactly one bit ('> N s')
        instead of a tours-per-hour curve. BATCH-f9780d's 100-bit cell ran at least
        14448 s and the machine-readable record learned '> 14448 s'.
      where: 'absent from the runner entirely.'
      required_fix: >-
        Emit per-tour progress -- tour index, wall clock at that tour, and the
        basis-quality readout obtainable cheaply at that point -- to the results file
        AND to stdout, FLUSHED EACH TOUR, so a killed cell still carries a tours
        table.
      proven_by: >-
        A tiny cell whose results file carries a tours table with MORE THAN ONE ROW.
    - id: D4
      defect: >-
        No machine-readable resource record. Peak RSS (~175 MB) and CPU occupancy
        appear in the predecessor's execution report as PROSE ONLY. AGENTS.md
        'Artifact policy' lists timestamps and resource measurements among what every
        run must retain.
      where: 'absent from the runner entirely.'
      required_fix: >-
        Record peak RSS and CPU time machine-readably. DEC-20260815-3e8e9c(i) names
        the mechanism: call `.cpu_times()` on the psutil handle the polling loop
        already holds. ALSO capture LOAD AVERAGE into `environment.json`, and retain
        `stdout_tail` FOR A TIMED-OUT CELL. All three are named by the same condition
        and all three are currently absent.
      proven_by: >-
        The same tiny cell: a non-zero CPU time, a peak RSS, a load average present
        in environment.json, and a NON-EMPTY stdout_tail.
    - id: D5
      defect: >-
        `result["tours"] = getattr(bkz, "tours", None)` -- fpylll NEVER assigns a
        `tours` attribute, so this is ALWAYS None. THE INSTRUMENT COULD NOT HAVE
        RECORDED A SUCCESS EVEN IF IT HAD GOT ONE. The Validator probed it live under
        the runner's exact calling convention: `getattr(bkz,'tours',None) -> None`,
        `hasattr(bkz,'tours') -> False`, and the string occurs 0 times in either
        fpylll.algorithms.bkz or fpylll.algorithms.bkz2.
      where: 'line 75.'
      required_fix: >-
        Obtain the tour count from `bkz.trace` -- the BKZ tree/trace object -- not
        from a non-existent attribute, following the committed predecessor's
        precedent. STATE THE DEFINITION USED AND WHY IT IS THE NUMBER OF TOURS. IF
        `bkz.trace` IS UNAVAILABLE IN THE INSTALLED fpylll 0.6.4, COUNT TOURS IN THE
        DRIVING LOOP AND SAY SO EXPLICITLY IN THE RECORD -- DO NOT SILENTLY
        SUBSTITUTE ONE QUANTITY FOR ANOTHER.
      proven_by: >-
        A tiny lattice (for example d=64, beta=20) that completes in seconds and
        yields a NON-None INTEGER tour count >= 1, with the mechanism recorded.
    - id: D6
      defect: >-
        `root_hermite_factor = b0**(1/d) / (Q**0.5)**(1/1)` is the WRONG FORMULA. The
        trailing `**(1.0/1)` is a no-op and the 1/d exponent is applied to b0 alone
        rather than to the ratio.
      where: 'line 78.'
      required_fix: >-
        Use `(b0 / Q**0.5) ** (1/d)`. For this q-ary construction with k = d//2 the
        volume^(1/d) is q^(1/2), so the definition requires the 1/d exponent to apply
        to the RATIO. The written form is smaller than the correct one by a factor
        q^(1/2 - 1/(2d)).
      proven_by: >-
        A PURE ARITHMETIC UNIT TEST, no lattice at all. ASSERT THE RATIO IN CLOSED
        FORM and REPRODUCE the committed cross-checks rather than quoting them: the
        Validator's M-6 records the distortion as 57.242 at (q=3329, d=512), and its
        d=80 measurement on a genuinely reduced basis gives runner formula
        0.018481105, standard delta_0 1.0136088, ratio 54.8457 = 3329^(1/2 - 1/160).
      note_on_the_numbers: >-
        EVERY FIGURE IN THIS ROW IS QUOTED FROM A COMMITTED ARTIFACT -- the
        BATCH-f9780d Validator report and EV-MLKEM-59e4a4 -- AND NONE WAS COMPUTED BY
        THE COORDINATOR SESSION THAT WROTE THIS CARD, WHICH HELD NO SHELL. Your test
        must recompute them, not trust them.

  how_each_fix_must_be_proven:
    principle: >-
      PROVE THE FIX FIRES, DO NOT ASSERT THAT THE CODE CONTAINS IT. Every acceptance
      test must OBSERVE the repaired behaviour in an artifact on disk. A test that
      reads the source and concludes the fix is present is not an acceptance test.
      Each test must run in SECONDS TO A COUPLE OF MINUTES.
    route_through_the_instrument: >-
      EVERY TEST MUST EXERCISE rt_ctrl_1_matched_pair_v2.py's OWN CODE PATHS, never a
      re-implementation of the mechanism under test. A test that exercises a copy of
      the stub, handler or flush proves nothing about the stub, handler or flush.
    surrogates:
      allowed: >-
        THE D1/D2 SURROGATE MAY BE A TINY LATTICE OR AN OUTRIGHT SLEEP STUB. Say
        WHICH you used, record `surrogate: true` with the surrogate kind in the
        evidence file, and say why that kind is adequate for what the test asserts.
      what_they_cannot_show: >-
        DECLARED HERE IN ADVANCE, NOT DISCOVERED AT REVIEW. A tiny-d surrogate cannot
        show that a fix survives at d=512 with mpfr_bits=100: it cannot exercise
        per-tour flush cost against a tour that takes hours, cannot show the handler
        fires when the process is deep in an fplll C call, and cannot bound the
        overhead the per-tour flush adds to a real reduction. Say this in your report
        rather than letting a green board imply otherwise. KN-FIND-f54a82 binds the
        analogous point for isolated-step probes and is the reason this is written
        down at opening.
    acceptance_board:
      path: coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/tasks/TASK-20260826-602395/acceptance_results.json
      shape: >-
        A machine-readable map from EACH of D1..D6 to PASS / FAIL / NOT_REACHED, each
        entry carrying the evidence path it is read from, the exact command that
        produced it, and a one-line statement of WHAT WAS ACTUALLY ASSERTED.
      a_fail_is_legitimate: >-
        STATED EXPLICITLY SO NOTHING PUSHES YOU TOWARD A GREEN RESULT. A FAIL is a
        real, reportable, valuable outcome and is reported as one. A NOT_REACHED is
        reported as NOT_REACHED with what you tried. DO NOT RETUNE A TEST UNTIL IT
        PASSES, do not weaken an assertion after seeing it fail, and do not move a
        threshold to make a board green. AN ERROR OR A FAIL SATISFIES THE COMPLETION
        GATE PROVIDED IT IS REPORTED VERBATIM: the gate is about the completeness of
        the record, not about the outcome.
      every_file_is_written: >-
        EVERY ONE OF THE TWELVE DECLARED ARTIFACT PATHS IS WRITTEN EVEN IF ITS TEST
        DOES NOT RUN, carrying status NOT_REACHED and the reason, rather than being
        absent. A completed archive's path_sha256 must cover every declared artifact,
        so an absent declared file makes the snapshot archive unsatisfiable. The two
        logs are written even if empty and are then reported as empty-not-omitted.

  binding_condition_v_verbatim:
    source: 'DEC-20260815-3e8e9c condition (v)'
    text: >-
      PRESERVE EVERY ARTIFACT OF EVERY EXECUTION, INCLUDING AN
      INFRASTRUCTURE-KILLED ONE, UNDER A `failed_infrastructure` LABEL. Do not
      direct their deletion.
    how_it_binds_you: >-
      IT BINDS YOUR DELIBERATELY-KILLED SURROGATE TOO. Its results file, its stdout
      and its timestamps are artifacts and are preserved, under the LITERAL
      `failed_infrastructure` label. BATCH-f9780d discharged this condition in
      substance while not using the literal label (its Validator's C-4 records the
      deviation); this task requires the literal label so the deviation is not
      carried a second time.

  prohibitions:
    - DO NOT RUN ANY d=512 REDUCTION, AT ANY PRECISION, UNDER ANY LABEL.
    - DO NOT RE-ATTEMPT THE mpfr_bits=100 CELL. DEC-20260824-5e222e refuses it.
    - DO NOT RE-ATTEMPT THE 75-BIT CELL AS A RESEARCH MEASUREMENT.
    - >-
      DO NOT EDIT rt_ctrl_1_matched_pair.py, whose sha256 must remain
      bc0524ee432a2327bc4a5cfff5d8f5d79b590d37b2f38ea428c78af5abb25035, and do not
      edit the archived strategies file or any other BATCH-f9780d artifact.
    - DO NOT INTERPRET, do not move a hypothesis, do not write any ledger record.
    - DO NOT WRITE, REGENERATE OR STAGE knowledge/INDEX.md.
    - NEVER COMMIT. Write nothing outside this task directory.
    - >-
      NEVER FABRICATE a command, an output, a timing, a statistic, a citation or a
      run. Missing data stays missing and is reported as missing.
    - >-
      DO NOT RETUNE ANYTHING IN RESPONSE TO A FAILURE. An infrastructure failure is
      infrastructure signal (AGENTS.md rule 3) and is never evidence that a fix is
      impossible; report it verbatim and stop.

  what_to_run:
    interpreter_note: >-
      THE SYSTEM PYTHON HAS NEITHER fpylll NOR numpy. BATCH-f9780d's task card
      records the interpreter that worked in this container and KN-TECH-14efa5
      records how fpylll 0.6.4 was obtained; KN-TECH-797223 records the recipe's
      container dependence. VERIFY THE INTERPRETER BEFORE USING IT and record what
      you verified. If you install anything or create a venv, SAY SO in the report;
      do not do it silently.
    psutil_note: >-
      D4's mechanism is `.cpu_times()` on a psutil handle. IF psutil IS NOT AVAILABLE
      IN THE CHOSEN INTERPRETER, THAT IS AN INFRASTRUCTURE FACT AND IS REPORTED AS
      ONE: name the substitute you used (for example resource.getrusage and
      /proc/self/status), say exactly what it measures and what it does not, and mark
      D4 accordingly on the board. DO NOT SILENTLY SUBSTITUTE.

  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 1
    charged_runs_authorised: 0
    charged_runs_note: >-
      THIS TASK HAS ZERO CHARGED EXPERIMENT RUNS. No experiment contract is frozen,
      no RUN-* identifier is minted, no run directory is created, no manifest is
      written and no ceiling is consumed. `maximum_runs: 1` is the dispatcher's
      minimum positive integer (tools/research_dispatch.py validate_handoff) and is
      NOT an authorisation to run a charged experiment run. See batch.yaml PD-1.
    justification: >-
      ONE module plus SIX cheap acceptance tests against a fully committed substrate
      you may not edit. NO d=512 REDUCTION. The only compute is a tiny acceptance
      cell of order d=64/beta=20 and a deliberately-killed surrogate, both of order
      seconds to a couple of minutes. The figure is dominated by agent time, not by
      compute, and is sized on DEC-20260815-3e8e9c(i)'s own premise that these fixes
      cost no lattice compute -- NOT against the 21600 s BATCH-f9780d consumed.

  completion_gate:
    - >-
      rt_ctrl_1_matched_pair_v2.py exists as a NEW file and the pinned predecessor's
      sha256 is unchanged.
    - >-
      acceptance_results.json maps EACH of D1..D6 to PASS / FAIL / NOT_REACHED with
      an evidence path, the producing command, and one line stating what was
      asserted. A FAIL or NOT_REACHED SATISFIES THIS GATE provided it is reported
      verbatim.
    - >-
      All twelve declared artifact paths exist, including any whose test did not run,
      which carries status NOT_REACHED and its reason.
    - >-
      The D1/D2 evidence shows BOTH the STARTED stub AND a flushed KILLED_PARTIAL
      record produced by a REAL signal, from the v2 instrument's own code path, with
      the surrogate kind declared.
    - >-
      The D3/D4 evidence shows a tours table with MORE THAN ONE ROW, a non-zero CPU
      time, a peak RSS, a load average in environment.json, and a non-empty
      stdout_tail.
    - >-
      The D5 evidence carries a NON-None INTEGER tour count, the mechanism used, and
      the stated definition of what was counted.
    - >-
      The D6 evidence asserts the correction in CLOSED FORM and reproduces the
      committed distortion factors rather than quoting them.
    - >-
      NO EXECUTION AT d=512 AND NO EXECUTION AT mpfr_bits=100 ON A d=512 BASIS
      OCCURRED, and the report says so.
    - Raw artifacts and the implementation report agree figure for figure.
    - >-
      Every execution's artifacts are preserved, including any killed one, under the
      failed_infrastructure label.
    - >-
      The report carries an explicit toy-scale / transfer statement and asserts
      nothing about ML-KEM at any parameter set.
    - Nothing outside the declared write_scope was written and nothing was committed.

  deliverables:
    - rt_ctrl_1_matched_pair_v2.py
    - acceptance_tests.py
    - acceptance_results.json
    - acceptance_stdout.log
    - acceptance_stderr.log
    - evidence/D1_D2_sigterm_surrogate.json
    - evidence/D1_D2_sigterm_surrogate_stdout.log
    - evidence/D3_D4_tiny_cell.json
    - evidence/D3_D4_environment.json
    - evidence/D5_tour_count.json
    - evidence/D6_root_hermite.json
    - implementation_report.md

  what_happens_next:
    review: >-
      This package is snapshot-archived by TASK-20260826-9e9d53, then reviewed
      independently and sibling-blind by TASK-20260826-9605ae (Validator: the D6
      arithmetic as a blind re-derivation, the D1/D2 signal safety, and whether the
      D5 count is really tours) and TASK-20260826-5ee48b (Red Team: what the
      surrogate cannot show, whether these fixes would have changed BATCH-f9780d's
      verdict, and whether the next-run sizing is now computable).
    what_it_does_not_authorise: >-
      A PASSING BOARD DOES NOT AUTHORISE THE 100-BIT RE-RUN. Approval is a frozen
      contract at a declared path plus a committed Coordinator decision, and neither
      exists for that cell. Whether the instrument is fit to carry the next capped
      run is adjudicated by TASK-20260826-70d800 from both reviewers'
      admissibility_ruling blocks, and its budget, if it is ever authorised, must be
      sized from the 14448 s LOWER BOUND and never from the 2502.74 s failure time.

  rule_12_status: >-
    UNMET AND UNWAIVED, INHERITED. Producer, both reviewers and the closing
    Coordinator are expected to resolve to the same model, so their agreement is
    correlated same-model judgement and is NOT independent corroboration.
    Independence here is procedural and never model-level. Record your requested
    policy and the model that actually answered your session, and record
    model_verified false with its reason if no adapter probe receipt exists.

  authoring_note: >-
    THIS CARD WAS WRITTEN BY A COORDINATOR SUBAGENT WITH NO SHELL. It minted no
    identifier, computed no sha256, measured no timing and asserted no commit sha.
    Every number in it is quoted from a committed artifact and attributed to the
    session that measured it. The two sha256 values it pins are read from committed
    records (BATCH-f9780d's execution_report.md and Validator report for
    bc0524ee...; the v2 predecessor's docstring and the Validator's R-3 for
    58a1fdc2...); VERIFY THEM YOURSELF BEFORE RELYING ON THEM.
