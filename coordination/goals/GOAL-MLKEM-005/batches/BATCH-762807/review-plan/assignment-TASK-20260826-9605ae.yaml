  j1_blind_rederivation:
    what_to_compute: >-
      FOR A COORDINATOR-CHOSEN CELL THE PRODUCER NEVER RAN -- d=64, beta=25,
      mpfr_bits=53, q=3329 -- NOT for the batch's beta=20 acceptance cell:
      (1) THE NUMBER OF BKZ TOURS the reduction performs before it stops, and (2) THE
      FINAL b0 NORM -- the Euclidean norm of the first row of the reduced basis after
      the BKZ call returns. Report (2) under BOTH readings and say whether they agree:
      the norm of row 0 of the reduced integer matrix, and the value obtained from the
      GSO's r_00. For (1), CHOOSE AND STATE YOUR OWN DEFINITION of 'number of tours'
      and your own route to it. YOU HAVE NOT BEEN GIVEN THE PRODUCER'S MECHANISM OR ITS
      CONTROL DESIGN, AND THAT IS DELIBERATE.
    there_is_no_answer_to_look_up: >-
      THE PRODUCER RAN ONLY beta=20. No artifact of this batch states this cell's tour
      count or b0, so you cannot cross-check your figure against anything and MUST NOT
      GO LOOKING FOR ONE. The comparand is one you create yourself, in Part B below. If
      you find a beta=25 figure anywhere in this batch, THAT IS ITSELF A FINDING and you
      should report it -- the dispatching Coordinator states it verified zero hits for
      this cell's seed, tour count and b0 across `tasks/`, `batch.yaml` and
      `dispatch_queue.json`, and this authoring session held no shell and verified
      nothing.
    the_construction: >-
      TRANSCRIBED FROM THE PINNED PREDECESSOR, NOT FROM THE PRODUCER'S NEW FILE:
      `coordination/goals/GOAL-MLKEM-005/batches/BATCH-f9780d/tasks/TASK-20260824-b3e9da/rt_ctrl_1_matched_pair.py`,
      sha256 `bc0524ee432a2327bc4a5cfff5d8f5d79b590d37b2f38ea428c78af5abb25035`
      (quoted from batch.yaml; this Coordinator computed no hash), function
      `worker_main_cell`, lines 42 to 79, EVALUATED AT d=64, beta=25, mpfr_bits=53
      (the predecessor's own module-level D and BETA are 512 and 55 and are NOT what you
      use; the function takes them as arguments). In order:
      `seed = int(np.random.default_rng([715923, 0, d, beta, 0, 0]).integers(0, 2**31-1))`;
      `FPLLL.set_random_seed(seed)`; `A = IntegerMatrix.random(d, "qary", k=d//2, q=Q)`
      with Q=3329; `LLL.reduction(A)`; `FPLLL.set_precision(mpfr_bits)` BEFORE the GSO
      is constructed; `M = GSO.Mat(A, float_type="mpfr")` with EXPLICITLY NO
      `flags=GSO.ROW_EXPO`; `M.update_gso()`;
      `L = LLL.Reduction(M, flags=LLL.DEFAULT)`;
      `par = BKZ.Param(block_size=beta, strategies=STRATEGIES, flags=BKZ.AUTO_ABORT)`;
      `bkz = BKZReduction(L)` from `fpylll.algorithms.bkz2`.
      VERIFY THIS TRANSCRIPTION AGAINST THE PINNED FILE YOURSELF, line by line, AND
      REPORT ANY DISCREPANCY AS A FINDING AGAINST THIS PLAN. A Coordinator
      transcription error is a live risk and checking it is cheap. Note also that the
      predecessor's SEED_ROOT, seed formula and ROW_EXPO-free mpfr construction are
      binding across this goal without re-litigation (DEC-20260815-3e8e9c), and that the
      seed VALUE is deliberately not given to you here -- only the formula -- so that an
      error in the formula cannot be masked by a matching constant.
    the_strategies_file_and_why_it_decides_this_joint: >-
      READ THIS TWICE. USE
      `coordination/goals/GOAL-MLKEM-005/batches/BATCH-f9780d/tasks/TASK-20260824-b3e9da/inputs/fplll_strategies_default.json`
      AND VERIFY ITS SHA256 IS
      `f516b0a6f0c580cff72e1e2c3562c44dc6f17e8f99613e9e4020e35481b27a18` BEFORE YOU USE
      IT. Abort if it differs. STATE IN YOUR REPORT WHICH STRATEGIES BYTES YOU USED --
      the absolute path AND the sha256 -- and state it beside every tour count and
      every b0 you report. WHY: strategies drive per-block preprocessing and pruning,
      so a `BKZ.Param` built WITHOUT `strategies=` describes a DIFFERENT reduction with
      a different trajectory. A tour count obtained under one is not comparable with a
      tour count obtained under the other, and A RE-DERIVATION THAT REPORTS A MISMATCH
      WITHOUT NAMING ITS STRATEGIES BYTES HAS MEASURED NOTHING. THIS IS NOT
      HYPOTHETICAL AND IT IS NOT A DRILL: BATCH-f9780d's original failure was BKZ
      strategies resolved BY PATH with no hash, so a byte-identical re-run failed in a
      different container (DEC-20260824-5e222e rationale, and the pinned predecessor's
      own docstring); the SAME failure mode recurred, in a new place, during
      preparation of this round, on the beta=20 acceptance cell. Note too that the
      pinned predecessor resolves the file RELATIVE TO ITS OWN DIRECTORY
      (`HERE/inputs/...`), so transcribed code run from anywhere else silently points at
      a path that does not exist -- use the absolute path above.
      AND IT BITES HARDER AT beta=25 THAN IT WOULD HAVE AT beta=20: STRATEGIES ARE
      INDEXED BY BLOCK SIZE, so this cell selects a strategy entry that no run in this
      batch has ever exercised. If that entry is missing, if resolution silently falls
      back to a default, or if the file's schema does not cover 25, SAY SO -- that is a
      finding about the instrument's input binding, not a broken probe.
    determinism_check: >-
      Run your construction at least twice in SEPARATE PROCESSES at the same seed and
      the same strategies bytes, and report whether both numbers reproduce. A quantity
      that does not reproduce across processes at fixed inputs is a break in itself and
      changes what any comparison can mean.
    ptm_1_control_you_own: >-
      REQUIRED, AND STATED IN ADVANCE SO IT CAN FAIL. THIS IS THE SHARPEST OBJECT IN THE
      PLAN AND IT IS YOURS. Build the SAME d=64, beta=25, mpfr_bits=53 cell a second time
      with `BKZ.Param(block_size=25, flags=BKZ.AUTO_ABORT)` and NO `strategies=`
      argument, everything else identical. THE PASS: your method SEPARATES the two
      constructions, reports each with the strategies bytes it used (or the explicit
      statement that none was passed), and REFUSES to read one against the other. If
      your write-up would let a reader compare a strategies-bearing number with a
      strategies-free one, your control is not controlling anything.
    what_goes_in_blind_rederivation_yaml: >-
      Your two numbers; your stated definition of 'number of tours' and your route to
      it; the absolute path and sha256 of the strategies bytes you passed; the seed
      value your evaluation of the formula produced; the interpreter and library
      versions; the PTM-1 second construction with its own numbers, clearly separated;
      the determinism check; and your exact probe source or its path.
    j1_part_b_create_your_own_comparand: >-
      THERE IS NO PRODUCER NUMBER FOR THIS CELL, SO YOU MAKE THE COMPARAND. Run the v2
      instrument's OWN tour-count path on the SAME d=64, beta=25, mpfr_bits=53 cell, at
      the same seed and the SAME strategies bytes, and compare against your Part A
      figures. THIS IS WHY beta=25 WAS CHOSEN: the producer never ran, tuned or checked
      this block size, so its loop transcription is being exercised on a cell it was not
      fitted to. Report both sides with their strategies sha256. Note the instrument's
      `--max-toy-d` guard is on DIMENSION, not block size, and d=64 is far below its
      default of 128, so nothing here needs a scale authorisation -- and you have none.
      AN INSTRUMENT THAT ERRORS, MISBEHAVES OR SILENTLY CHANGES QUANTITY AT beta=25 IS A
      RESULT, not a broken probe -- unless the failure is an infrastructure failure of
      YOUR environment, which is AGENTS.md rule 3 and is never a finding against the
      producer. Distinguish the two explicitly.
    j1_part_c_the_definitional_question: >-
      Answer the question the batch actually turns on: IS THE RECORDED COUNT THE NUMBER
      OF TOURS, or something mistaken for it -- child nodes of another tracer label,
      preprocessing sub-calls, an enumeration count, or a loop-iteration count that skips
      or double-counts an iteration the upstream loop does not? Find out for yourself
      what mechanism the instrument declares and judge the reason it gives for choosing
      that one -- I have deliberately not told you, so that your own definition in Part A
      is formed independently of it. WHERE I THINK THIS BREAKS IF IT BREAKS: not in the
      arithmetic but in the CORRESPONDENCE
      between whatever is counted and upstream's own tour iterations. Are the pre-loop
      LLL and EVERY break test retained, in order? Is a tour that did not complete
      counted, or not? Is the auto-abort decision point inside or outside the counted
      region? If the producer offers any equivalence control, check that its two arms
      really are identically seeded and identically constructed -- including whether the
      RNG state is re-installed for the second arm rather than inherited from the first.
      And check any claim about `bkz.trace` against the installed fpylll 0.6.4 source
      rather than against upstream documentation.

  j2_kill_and_signal_safety:
    what_to_do: >-
      Launch `rt_ctrl_1_matched_pair_v2.py` AS A SUBPROCESS -- only a real subprocess
      can be really killed -- and try to break the flush. Re-run the producer's own kill
      test, then go past it: signal twice; signal during a refresh; signal immediately
      at startup and immediately at exit; SIGINT as well as SIGTERM; and SIGKILL, which
      by construction must leave no handler-written record. TRY TO PRODUCE A TRUNCATED,
      EMPTY OR UNPARSEABLE JOURNAL LINE.
    the_mechanism_as_claimed_check_every_clause: >-
      The producer's safety argument is precise, which makes it attackable clause by
      clause. It claims: the results journal is a JSON-Lines file opened ONCE with
      `os.open(..., O_WRONLY|O_CREAT|O_APPEND)` and the fd held in a module-level int; a
      COMPLETE partial record is PRE-SERIALISED to bytes, one payload per signal, so the
      flushed status matches the signal actually delivered with no work in the handler;
      the payload dict is rebuilt and REBOUND WHOLESALE on each refresh, so the handler
      reads either the old dict or the new one and never a half-updated one; the handler
      does exactly one `os.write(fd, payload)`, one `os.fsync`, one short `os.write` to
      fd 1, then `os._exit(128+signum)`, allocating nothing, opening nothing, importing
      nothing, calling no json function and touching no buffered Python stream; and
      `os._exit` is deliberate so that no atexit hook and no buffered-stream flush runs
      from signal context. CHECK EACH CLAUSE AGAINST THE SOURCE. Is the payload
      genuinely pre-serialised at EVERY point the code claims, including the pre-tour
      refresh? Is the O_APPEND single-write argument actually what the code does, on
      every path? Is the aggregate `*_results.json` view ever written from signal
      context?
    where_i_think_it_breaks_if_it_breaks: >-
      MY ARTIFACT-SPECIFIC PRIOR, GIVEN TO YOU AND NOT TO YOUR SIBLING. Three places.
      (a) THE LATE EDITS. The producer discloses (DEV-2) that the instrument was edited
      between its development smoke runs and the acceptance suite, and that the
      per-signal payloads and the PRE-TOUR PAYLOAD REFRESH were among those edits. Late
      edits to a signal path are where pre-serialisation invariants get broken, and the
      acceptance suite ran ONCE, against the final file. Read the final file, not the
      description of it.
      (b) DEV-3. The tiny cell runs IN-PROCESS with `arm_signals=False`, so the arming
      path is exercised ONLY by the D1/D2 subprocess surrogates. 'The tiny cell passed'
      therefore says nothing at all about the handler, and the producer says so. Check
      that nothing in the package leans on the tiny cell for a signal claim.
      (c) THE STRATEGIES PATH RESOLUTION, WHICH IS THIS BATCH'S OWN THEME. The
      producer's first smoke run ended `status: "ERROR"` with a `FileNotFoundError` on
      the STRATEGIES PATH, from a wrong repo-root depth computed inside the module. That
      was fixed -- but it means the successor still resolves its strategies file by a
      path computed from module location, exactly the class of failure BATCH-f9780d
      died of. Determine how v2 resolves that file NOW, whether it verifies the sha256
      AT RUN TIME or merely records it after the fact, and what it does if the file is
      missing or has different bytes. A recorded hash that is never checked is
      provenance, not binding.
    ptm_2_control_you_own: >-
      REQUIRED. (i) Run the instrument to NORMAL COMPLETION with NO signal delivered: a
      `KILLED_PARTIAL` record MUST NOT APPEAR. (ii) Kill a run with SIGKILL: NO
      handler-written record may appear. THE PASS IS ABSENCE IN BOTH CASES. A
      `KILLED_PARTIAL` without a signal would prove the flush fires UNCONDITIONALLY
      rather than on signal, and D2's PASS would then be measuring the existence of a
      code path rather than its trigger. A handler-written record after SIGKILL would
      prove the record is written somewhere other than the handler and that the whole
      safety argument is about the wrong mechanism.
    condition_v: >-
      Verify DEC-20260815-3e8e9c condition (v) discharged with the LITERAL
      `failed_infrastructure` label: in the artifact directory names, INSIDE each
      flushed record, and in the evidence file. batch.yaml requires the literal label
      because BATCH-f9780d discharged the condition in substance without it and the
      deviation is not to be carried a second time. Confirm nothing was deleted.

  j3_integrity_d6_and_disclosure:
    a_integrity: >-
      All TWELVE declared artifacts present, each hashing to the value in
      TASK-20260826-9e9d53's snapshot receipt -- recomputed by you from disk AND from
      the commit blob, both directions, as BATCH-f9780d's validator did 15/15. THE
      RECEIPT IS AT
      `coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/archives/TASK-20260826-9e9d53/snapshot-receipt.json`,
      declared at that exact path in `dispatch_queue.json` and in the committed handoff
      `ledger/handoffs/TASK-20260826-9e9d53.yaml` deliverables. It is NOT `receipt.yaml`,
      which is the older convention used by this goal's BATCH-f9780d archives -- do not
      go hunting, and report it as a defect if the declared path is absent.
      `acceptance_stderr.log` is a ZERO-BYTE FILE THAT
      EXISTS, which is a different fact from a missing file -- say which you found.
      Confirm the pinned predecessor's sha256 is still
      `bc0524ee432a2327bc4a5cfff5d8f5d79b590d37b2f38ea428c78af5abb25035` and that it was
      not edited: editing it would break a completed archive permanently. Confirm the
      two `failed_infrastructure` artifact sets are COMPLETE against the producer's own
      enumeration in implementation_report.md section 7, that the
      undeclared-but-disclosed artifacts are exactly the ones on disk with nothing extra
      and nothing missing, and that no output anywhere in the package reports d=512 or
      mpfr_bits=100 as having been RUN.
    b_figure_for_figure: >-
      WALK IT, DO NOT SPOT-CHECK IT. Every quantitative figure in
      `implementation_report.md` must reproduce from the raw JSON it cites. WHERE I
      THINK THIS BREAKS IF IT BREAKS: report tables are hand-transcribed from JSON and
      hand transcription is where figures diverge. Two things are NOT breaks because
      they are declared: the two RSS figures differ (a polled current-RSS sample versus
      the kernel high-water mark) and the producer explicitly does NOT reconcile them;
      and `cpu_times().user` exceeds the cell's elapsed time because it is
      process-wide, which the producer states.
    c_d6_closed_form: >-
      Re-derive independently from the DEFINITION of the root Hermite factor and the
      parameters: for this q-ary construction with k = d//2, vol^(1/d) = q^(1/2), so the
      definition puts the 1/d exponent on the RATIO. Show that
      (corrected / defective) = q^(1/2 - 1/(2d)), independent of b0, where corrected is
      `(b0/q**0.5)**(1/d)` and defective is the predecessor's line 78
      `b0**(1/d) / (q**0.5)**(1/1)`. Reproduce the two figures the ledger already
      carries: 57.242 at (q=3329, d=512) and 54.8457 at (q=3329, d=80). THIS STRAND IS
      NOT BLIND AND MUST NOT BE DESCRIBED AS BLIND: both figures are published in
      batch.yaml, in DEC-20260824-5e222e and in EV-MLKEM-59e4a4, all of which you read.
      See review_plan.yaml PD-A for why the blind moved elsewhere.
    ptm_3_control_you_own: >-
      REQUIRED. (i) The identity must FAIL to reproduce 57.242 at any d other than 512
      and 54.8457 at any d other than 80 -- a test that passes for every d is testing
      nothing. (ii) b0-INDEPENDENCE ALONE DOES NOT IDENTIFY THE DEFECT, because the
      ratio of the corrected form to ITSELF is also b0-independent. So evaluate your
      check against at least one THIRD, deliberately wrong formula that is not the
      predecessor's -- for example `b0**(1/d) / q**(1/(2*d))` or `(b0/q)**(1/d)` -- and
      show that your check REJECTS it. THE PASS: the identity holds for exactly the
      (corrected, defective) pair at exactly the stated d and fails everywhere else you
      push it.
    d_disclosure_completeness: >-
      The producer records an incidental finding against a COMMITTED artifact: in
      fpylll 0.6.4 `M.get_log_det(0, d)` returns the log-determinant of the GRAM matrix,
      so TASK-20260815-f14d3c's `exp(log_det/d)` computes vol^(2/d) rather than
      vol^(1/d). The producer says this does not change D6 and takes no position on what
      should be done about it. JUDGE BOTH: is the observation correct in the installed
      fpylll, and is 'it does not change D6' right? Then judge the disclosure as a
      whole. The producer's self-disclosed limits are listed in review_plan.yaml
      `already_disclosed_items`; ASK WHETHER THAT LIST IS COMPLETE for your joints. A
      producer that discloses six real limits and omits a seventh has bought trust it
      has not earned.
    e_the_board: >-
      Adjudicate the six-PASS board for what it does and does NOT confirm, READING
      `acceptance_results.json` DIRECTLY -- it is not blinded and your committed
      completion gate requires you to adjudicate it. Check each entry's `asserted`
      one-liner against what its cited evidence file actually shows, and check the
      `summary` map against the per-defect `status` values. ADJUDICATE A GREEN BOARD AS
      CAREFULLY AS A RED ONE. If any entry were FAIL or NOT_REACHED you would adjudicate
      it rather than pass over it; the same duty applies to PASS.

