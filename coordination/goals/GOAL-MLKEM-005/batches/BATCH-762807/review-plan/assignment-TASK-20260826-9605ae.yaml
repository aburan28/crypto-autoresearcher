  - >-
    RULE 12 IS UNMET AND UNWAIVED, INHERITED. You are expected to resolve to the same
    model as the producer, your sibling and the closing Coordinator. YOUR AGREEMENT
    WITH THEM IS CORRELATED SAME-MODEL JUDGEMENT, NOT INDEPENDENT CORROBORATION. Say so
    in your report; do not let procedural independence pass as the other kind.
  - >-
    ZERO LATTICE COMPUTE AT SCALE. Your probes stay at acceptance scale. RUN NO d=512
    REDUCTION AND DO NOT RE-ATTEMPT THE 100-BIT CELL. That re-run is REFUSED by
    DEC-20260824-5e222e and no review authorises it. The instrument carries a
    `--max-toy-d` guard (default 128) overridable by `--scale-run-authorisation`: YOU
    HAVE NO SUCH AUTHORISATION AND MUST NOT SUPPLY THAT FLAG.
  - >-
    A TIMEOUT, CRASH OR MISSING DEPENDENCY IN YOUR OWN PROBE IS INFRASTRUCTURE SIGNAL
    (AGENTS.md rule 3) -- never a finding against the producer and never a mathematical
    result. Report it as infrastructure and move on.
  - >-
    NEVER FABRICATE a command, an output, a timing, a hash or a run. Recompute what you
    assert; attribute what you quote. Missing data stays missing and is reported as
    such.
