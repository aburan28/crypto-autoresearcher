  j4_the_surrogate_does_not_generalise:
    what_to_do: >-
      NAME, CONCRETELY, WHAT A d=512 / mpfr_bits=100 RUN WOULD DO THAT THE d=64
      SURROGATE CANNOT SHOW, and then say FOR EACH OF D1..D6 whether that fix could
      SILENTLY FAIL ONLY AT SCALE. SILENTLY is the operative word: a fix that fails
      loudly at scale costs a run, a fix that fails silently produces a confident record
      of nothing -- which is the exact harm this whole goal is trying to stop.
    where_i_think_it_breaks_if_it_breaks: >-
      MY ARTIFACT-SPECIFIC PRIOR, GIVEN TO YOU AND NOT TO YOUR SIBLING. I expect J4 to
      HOLD on the producer's disclosed items -- they are honest and correctly stated --
      and I think the value is elsewhere, in four places nobody has covered.
      (a) THE PRODUCER MAY HAVE NAMED THE WRONG SCALE LIMIT. Its named failure mode is
      unbounded `tours_table` growth making each refresh's serialisation progressively
      more expensive -- but that needs THOUSANDS of tours. CHECK THE TARGET REGIME'S
      OWN TOUR COUNTS AS ALREADY COMMITTED IN THIS GOAL'S RECORDS before accepting it as
      a d=512 risk: if that regime's tours are counted in tens and last hours, then the
      producer has named a scale limit that is not the scale limit, and the one that
      does bite -- the handler deferred for the whole of an hours-long tour -- is
      precisely the one for which it has no mitigation and offers only a lower bound.
      (b) WHERE THE FLUSH COST LANDS, NOT HOW BIG IT IS. The producer states the payload
      is refreshed IMMEDIATELY BEFORE each tour is entered. That puts the serialisation
      and two `fsync`s ON THE CRITICAL PATH of every tour rather than off it. At d=64
      that is invisible. Ask whether it is bounded at d=512, and note that the producer
      itself labels its 'negligible against an hours-long tour' claim AN ARGUMENT, NOT A
      MEASUREMENT -- judge the argument.
      (c) WHICH SIGNAL ACTUALLY ARRIVES. DEC-20260815-3e8e9c records the predecessor's
      beta=70 cell HARD-KILLED BY SIGTERM at 14400.08 s, so at the cap the realistic
      signal IS SIGTERM and the mechanism is aimed at the right case. The unhandled
      cases are a container stop and an OOM kill, both SIGKILL, which runs nothing. Say
      which of these the next capped run is actually exposed to, and whether anything
      cheap would narrow the window -- and if nothing would, say that too.
      (d) RESOURCES OVER HOURS. fd and file-handle lifetime, journal file size, the
      journal's filesystem filling, and the GIL-starved sampler's consequence that a
      flushed record's RSS and cpu figures can be A WHOLE TOUR STALE at d=512. THE
      PRODUCER MEASURED THE STARVATION RATHER THAN ASSERTING IT: over its
      d=64/beta=20 cell it observed 9 heartbeat samples against 19 expected if the
      thread were never starved, a shortfall of about 53 per cent concentrated in
      exactly the intervals when a tour is running, and it records
      `sampler_samples_observed` and `sampler_samples_expected_if_never_starved` in
      every final record so the shortfall is visible without re-deriving it. It then
      recorded `staleness_bound_seconds: null` rather than a number the mechanism cannot
      support -- which is the right call, and you should say so rather than attack it.
      THE UNCOVERED QUESTION IS WHAT FOLLOWS FROM IT: at d=64 a 53 per cent shortfall
      over a sub-second cell is a curiosity; at d=512 the sampler is starved for the
      whole of an hours-long tour, which is a different statement. Ask what a run that
      NEEDED intra-tour resource resolution would have to do instead -- the producer
      says sampling from a SEPARATE PROCESS, which this instrument does not do -- and
      whether that is in reach, cheap, and worth it before the next capped run.
    the_hard_limit_on_you: >-
      WHERE A DECISIVE ANSWER WOULD NEED A SCALE MEASUREMENT, NAME THE MEASUREMENT AND
      DO NOT TAKE IT. You may run NO d=512 reduction and may NOT re-attempt the 100-bit
