  j5_proves_too_much_and_what_this_buys:
    what_to_do: >-
      RUN THE ARGUMENT AGAINST THE OBJECT WHERE ITS CONCLUSION IS ALREADY KNOWN. IF
      THESE SIX FIXES HAD BEEN IN PLACE FOR BATCH-f9780d'S OWN TWO EXECUTIONS, WOULD ITS
      VERDICT HAVE CHANGED? Take the two cells SEPARATELY, because they are not alike,
      and state for each what the repaired instrument would have left on disk and what
      DEC-20260824-5e222e would then have ruled.
    ptm_4_control_you_own: >-
      REQUIRED, AND STATED IN ADVANCE SO IT CAN FAIL. THE 75-BIT REFERENCE CELL is the
      known-false object: it terminated ON ITS OWN, raised `ReductionError('infinite
      loop in babai')` at 2502.74 s well inside its cap, and its outcome WAS recorded.
      None of D1..D6 changes an outcome that a returning run already recorded. THE PASS:
      your argument must visibly FAIL on the 75-bit cell, and may succeed -- if at all
      -- only on the 100-bit cell that wrote nothing. IF YOUR REASONING GOES THROUGH ON
      BOTH, IT HAS PROVED TOO MUCH and is wrong somewhere nobody has read closely
      enough. Report the object, whether the required behaviour was observed, and where
      the argument went through if it did.
    ptm_5_control_you_own: >-
      REQUIRED. The proposition 'the instrument now records partial state on kill' is
      KNOWN FALSE UNQUALIFIED, by the producer's own disclosure: SIGKILL runs nothing at
      all, and at d=512 a mid-tour SIGTERM's flush is deferred until the C call returns.
      THE PASS: every record of this batch that states the guarantee states it WITH
      those carve-outs. AUDIT batch.yaml, `acceptance_results.json`,
      `implementation_report.md` section 0, AND `review-plan/review_plan.yaml` -- the
      last is a Coordinator artifact, is explicitly in scope, and is the one most likely
      to be given the benefit of the doubt. An overstatement in MY plan is a finding and
      I want it reported as one. WHILE YOU ARE IN THAT FILE, READ PD-A AND PD-G: PD-A is
      a superseding record against three items of an IMMUTABLE committed handoff that is
      deliberately not being edited to match, and PD-G changed the blinded cell after the
      round was designed. Both are departures declared rather than absorbed, and both are
      fair game -- if you judge either self-serving, or judge that the trail as written
      flatters the Coordinator who wrote it, SAY SO.
    where_i_think_it_breaks_if_it_breaks: >-
      MY ARTIFACT-SPECIFIC PRIOR. I expect the honest answer on the 75-bit cell to be
      'nothing would have changed' and on the 100-bit cell to be 'the record would have
      changed in KIND but the verdict probably not in DIRECTION': DEC-20260824-5e222e
      closed BATCH-f9780d as INCOMPLETE because the 100-bit arm wrote NOTHING, and under
      v2 it would have written a STARTED stub, every completed tour's row, and a
      `tour_start` naming the in-flight tour -- a structured lower bound instead of one
      bit -- but it would still not have COMPLETED the cell, so `incomplete` would very
      likely still be the verdict. IF THAT IS RIGHT, THE WHOLE WEIGHT OF THIS BATCH
      RESTS ON WHETHER 'INCOMPLETE WITH A TOURS TABLE' IS MATERIALLY DIFFERENT FROM
      'INCOMPLETE WITH ONE BIT'. Push on exactly that. An instrument repair that would
      not have changed a single committed verdict is NOT thereby worthless -- but it
      must then be defended on WHAT IT ENABLES NEXT, which is J6's object, and that
      defence must be checkable rather than rhetorical. Both halves of that sentence are
      binding: do not conclude 'worthless' any more readily than 'fine'. Premature
      closure is a failure mode symmetric with overclaiming.

  j6_next_run_sizing:
    what_to_do: >-
      DEC-20260824-5e222e REQUIRES THE NEXT 100-BIT ATTEMPT TO BE SIZED FROM THE 14448 s
      LOWER BOUND BATCH-f9780d MEASURED, AND NEVER FROM THE PREDECESSOR'S 2502.74 s,
      WHICH DEC-20260815-3e8e9c CALLS A FAILURE COST AND NOT A BASELINE. DOES THE
      REPAIRED INSTRUMENT MAKE THAT SIZING COMPUTABLE, AND WHAT IS STILL MISSING? Walk
      it end to end on the artifacts: what does a capped, SIGTERM'd d=512 cell actually
      leave on disk under v2, what can be computed from that, and what cannot.
    where_i_think_it_breaks_if_it_breaks: >-
      MY ARTIFACT-SPECIFIC PRIOR, AND IT POINTS AT A COMMITTED DECISION RATHER THAN AT
      THE PRODUCER. I suspect the honest answer is 'PARTIALLY computable, and the
      missing piece is the one nobody has'. Two reasons, both worth checking properly.
      (a) PER-TOUR COST IS NOT CONSTANT ACROSS TOURS, so a rate taken from the first k
      tours and extrapolated to completion is an ASSUMPTION, not a measurement, and the
      instrument records nothing that bounds the error in that extrapolation.
      (b) THE NUMBER OF TOURS TO COMPLETION IS NOT KNOWN A PRIORI, because
      `flags=BKZ.AUTO_ABORT` ends the run on a basis-quality criterion rather than a
      tour count. A killed cell therefore yields a lower bound on elapsed time and a
      partial rate, but sizing needs to know HOW MANY TOURS REMAIN -- and no fix in
      D1..D6 records that.
      IF BOTH HOLD, THEN DEC-20260815-3e8e9c(i)'S 'TOURS-PER-HOUR COST CURVE' MAY NOT
      ANSWER THE SIZING QUESTION IT WAS PRESCRIBED FOR -- i.e. that decision may have
      named the wrong quantity, and this batch faithfully implemented it. THAT WOULD BE
      A FINDING AGAINST A COMMITTED DECISION OF THIS COORDINATOR'S LINEAGE AND IT IS
      EXACTLY THE KIND OF THING THIS ROUND EXISTS TO SURFACE. If instead the curve does
      answer it, say how, because that is the batch's strongest defence under J5 and it
      should not be left implicit.
    the_hard_limit_on_you: >-
      ENUMERATE WHAT IS MISSING. DO NOT SIZE, RECOMMEND OR AUTHORISE ANY BUDGET. J6 asks
      whether the sizing is COMPUTABLE; authorisation is a Coordinator decision plus a
      frozen contract, and neither exists for the 100-bit cell. A number you write down
      as 'what it would take' will be read as a recommendation however you label it, so
      express the answer as WHAT IS COMPUTABLE AND WHAT IS NOT.

