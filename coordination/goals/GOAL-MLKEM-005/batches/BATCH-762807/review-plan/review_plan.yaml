  already_disclosed_items:
  - >-
    (1) CPython runs a Python signal handler only at an interpreter check IN THE MAIN
    THREAD, so inside a long fplll C call the flush is DEFERRED until the call returns
    -- at d=512 potentially hours. SIGKILL runs nothing at all, by construction.
  - >-
    (2) The residual loss window at d=512: a mid-tour SIGTERM leaves the STARTED stub,
    every completed tour's row, and a `tour_start` record naming the in-flight tour --
    which is a LOWER BOUND on that tour, not its cost, and not an up-to-date resource
    figure.
  - >-
    (3) The producer MEASURED its own resource sampler being starved by the GIL: over
    its d=64/beta=20 acceptance cell it observed 9 heartbeat samples against 19 expected
    if the thread were never starved, a shortfall concentrated in exactly the intervals
    when a tour is running. It therefore recorded `staleness_bound_seconds: null` rather
    than a number the mechanism cannot support. THOSE TWO COUNTS WERE ORIGINALLY WITHHELD
    FROM THIS PLAN, and the reasoning is preserved in
    `blind_rederivation.leak_channels_closed_in_this_plan` because it generalises: they
