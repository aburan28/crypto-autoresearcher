      THE STRATEGIES FILE, PINNED BY CONTENT AND NOT BY PATH.
      `coordination/goals/GOAL-MLKEM-005/batches/BATCH-f9780d/tasks/TASK-20260824-b3e9da/inputs/fplll_strategies_default.json`,
      sha256 `f516b0a6f0c580cff72e1e2c3562c44dc6f17e8f99613e9e4020e35481b27a18`. VERIFY
