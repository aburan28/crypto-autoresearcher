    observed sample count is a partial channel to that run's tour count. THEY ARE
    RESTORED HERE because the blinded cell is now beta=25, which the producer never ran,
    so no beta=20 figure can carry its answer (PD-G).
  - >-
    (4) Unbounded `tours_table` growth inside every flushed payload -- no cap
    implemented and none tested -- and a `stdout_tail` capped at 24 lines inside the
    record (the full stdout is separately retained).
  - >-
    (5) An incidental finding against a COMMITTED artifact: in the installed fpylll
    0.6.4, `M.get_log_det(0, d)` returns the log-determinant of the GRAM matrix, so
