  proves_too_much:
    required_note: >-
      CONTROLS BEFORE BELIEF, APPLIED TO AN ARGUMENT RATHER THAN A MEASUREMENT. A null
      object detects an artifactual signal; a known-false object detects an artifactual
      proof. Each object below states, IN ADVANCE, what its PASS looks like -- a
      control that cannot fail is not a control.
    objects:
    - >-
      PTM-1 (owner TASK-20260826-9605ae, under J1) -- THE STRATEGIES-OMITTED
      CONSTRUCTION. Build the d=64, beta=25, mpfr_bits=53 cell a second time with
      `BKZ.Param(block_size=25, flags=BKZ.AUTO_ABORT)` and NO `strategies=` argument,
      everything else identical. The claim 'my independently derived tour count agrees /
      disagrees with the instrument's' is KNOWN FALSE as a comparison when the two sides
      were reduced under different strategies bytes, because strategies drive per-block
      preprocessing and pruning -- and therefore the reduction trajectory -- AND ARE
      INDEXED BY BLOCK SIZE, so beta=25 selects a different entry than any beta the
      producer exercised. REQUIRED BEHAVIOUR (the PASS): your method must SEPARATE the
      two constructions, report each with the sha256 of the strategies bytes it used (or
      the explicit statement that none was passed), and refuse to read one against the
      other. This object exists because BATCH-f9780d's original failure was strategies
      bound BY PATH rather than BY CONTENT, and because that same failure recurred
      during preparation of this very round. THE MOVE TO beta=25 MAKES THIS OBJECT BITE
      HARDER, not less: a new block size is exactly where a by-path resolution or a
      missing strategy entry would surface.
    - >-
      PTM-2 (owner TASK-20260826-9605ae, under J2) -- THE UNKILLED RUN AND THE SIGKILL
      RUN. Run the v2 instrument to normal completion with NO signal delivered; a
      `KILLED_PARTIAL` record MUST NOT APPEAR. Then kill a run with SIGKILL; NO
      handler-written record may appear, because SIGKILL runs nothing. REQUIRED
      BEHAVIOUR (the PASS): absence in both cases. A `KILLED_PARTIAL` in a run where no
      signal was delivered would prove the flush fires UNCONDITIONALLY rather than on
      signal, and D2's PASS would then be measuring the code path's existence rather
      than its trigger; a handler-written record after SIGKILL would prove the record is
      written somewhere other than the handler and that the entire signal-safety
      argument is about the wrong mechanism.
    - >-
      PTM-3 (owner TASK-20260826-9605ae, under J3) -- D6 AT A DELIBERATELY WRONG d, AND
      A THIRD WRONG FORMULA. The identity (corrected / defective) = q^(1/2 - 1/(2d))
      must FAIL to reproduce 57.242 at any d other than 512 and 54.8457 at any d other
      than 80 -- a test that passes for every d is testing nothing. Separately, note
      that b0-INDEPENDENCE ALONE DOES NOT IDENTIFY THE DEFECT: the ratio of the
      corrected form to ITSELF is also b0-independent. So evaluate your D6 check
      against at least one THIRD, deliberately wrong formula that is not the
      predecessor's -- for example `b0**(1/d) / q**(1/(2*d))` or `(b0/q)**(1/d)` -- and
      show that your check REJECTS it. REQUIRED BEHAVIOUR (the PASS): the identity
      holds for exactly the (corrected, defective) pair at exactly the stated d, and
      fails everywhere else you push it.
    - >-
      PTM-4 (owner TASK-20260826-5ee48b, under J5) -- BATCH-f9780d'S 75-BIT REFERENCE
      CELL. That cell terminated ON ITS OWN, raised `ReductionError('infinite loop in
      babai')` at 2502.74 s well inside its cap, and its outcome WAS recorded. The
      argument 'the repaired instrument would have changed BATCH-f9780d's verdict' is
      KNOWN FALSE on that cell: none of D1..D6 changes an outcome that was already
      recorded by a run that returned. REQUIRED BEHAVIOUR (the PASS): your argument
      must visibly FAIL on the 75-bit cell and may succeed, if at all, only on the
      100-bit cell that wrote nothing. If your reasoning goes through on both, it has
      proved too much and is wrong somewhere nobody has read closely enough.
    - >-
      PTM-5 (owner TASK-20260826-5ee48b, under J5) -- THE KILL-TIME GUARANTEE AS
      STATED BY THIS PROGRAM'S OWN RECORDS. The proposition 'the instrument now records
      partial state on kill' is KNOWN FALSE unqualified, by the producer's own
      disclosure: SIGKILL runs nothing at all, and at d=512 a mid-tour SIGTERM's flush
      is deferred until the C call returns. REQUIRED BEHAVIOUR (the PASS): every record
      of this batch that states the guarantee states it WITH those carve-outs. Audit
      batch.yaml, acceptance_results.json, implementation_report.md section 0, and THIS
      REVIEW PLAN -- a Coordinator artifact, explicitly in scope, and the one most
      likely to be given the benefit of the doubt.
    failure_signature: >-
      WHAT A REVIEWER WOULD SEE IF THIS BATCH WERE WRONG, stated in advance so the
      control can fail. A tour count that VARIES ACROSS RUNS at fixed seed and fixed
      strategies bytes. A tour count or b0 from an independent construction that differs
      from what the v2 instrument produces on the SAME beta=25 cell under IDENTICAL
      strategies bytes, with both sha256 values stated -- or a 'match' or
      'mismatch' verdict reported WITHOUT the strategies sha256 on both sides, which is
      the same failure wearing the shape of a result. A journal line that does not
      parse, or a journal that is truncated or empty after a kill. A `KILLED_PARTIAL`
      record in a run where no signal was delivered, or a handler-written record after
      SIGKILL. A declared artifact absent from the package or hash-mismatched against
      TASK-20260826-9e9d53's snapshot receipt. A figure in `implementation_report.md`
      that disagrees with the raw JSON it cites. A D6 identity that reproduces 57.242
      at a d other than 512, or a D6 check that also passes a formula it should reject.
      An argument that the repair would have changed the verdict of a cell that
      terminated and was recorded. Any sentence in any record of this batch --
      including this plan -- asserting the kill-time guarantee without the SIGKILL and
      mid-tour carve-outs.
    assigned_to: >-
      TASK-20260826-9605ae owns PTM-1 (under J1), PTM-2 (under J2) and PTM-3 (under
      J3); TASK-20260826-5ee48b owns PTM-4 and PTM-5 (both under J5). One owner per
      object, for the same reason there is one owner per joint. Each owner reports the
      object, whether the required behaviour was observed, and -- where the control
      failed -- the exact step at which the argument went through and what the correct
      behaviour would have been.

  blind_rederivation:
    required: true
    quantity: >-
      STATED AS A STATEMENT AND NOT AS A METHOD. TWO NUMBERS, FOR A COORDINATOR-CHOSEN
      CELL THAT THE PRODUCER NEVER RAN -- d=64, beta=25, mpfr_bits=53, q=3329:
      (1) THE NUMBER OF BKZ TOURS the reduction performs before it stops, and (2) THE
      FINAL b0 NORM -- the Euclidean norm of the first row of the reduced basis once the
      BKZ call has returned. Report (2) under BOTH readings and say whether they agree:
      the norm of row 0 of the reduced integer matrix, and the value obtained from the
      GSO's r_00. For (1), CHOOSE AND STATE YOUR OWN DEFINITION of 'number of tours' and
      your own route to it before you look at what the instrument does; the definitional
      question is half the joint.
      THE PRODUCER RAN ONLY beta=20, AND THIS CELL'S ANSWER THEREFORE EXISTS IN NO
      ARTIFACT OF THIS BATCH. You cannot cross-check it against anything, and THAT IS
      THE POINT: the independence of this derivation is a property of the artifacts
      rather than of your reading discipline, and the producer's loop transcription is
      being exercised at a block size it was never fitted to. The comparand is one you
      create yourself, by running the v2 instrument on the same cell (J1 Part B). THE
      PRODUCER'S OWN MECHANISM AND ITS CONTROL DESIGN ARE NOT GIVEN TO YOU HERE,
      DELIBERATELY.
    parameters: >-
      THE CELL. d=64, beta=25, mpfr_bits=53, q=3329. SEED drawn by the pinned formula
      `int(np.random.default_rng([715923, 0, d, beta, 0, 0]).integers(0, 2**31-1))` and
      installed with `FPLLL.set_random_seed(seed)`; SEED_ROOT=715923 is carried
      verbatim from this goal's lineage and is binding without re-litigation per
      DEC-20260815-3e8e9c. CONSTRUCTION, transcribed from the PINNED PREDECESSOR
      `coordination/goals/GOAL-MLKEM-005/batches/BATCH-f9780d/tasks/TASK-20260824-b3e9da/rt_ctrl_1_matched_pair.py`
      (sha256 `bc0524ee432a2327bc4a5cfff5d8f5d79b590d37b2f38ea428c78af5abb25035`, quoted
      from batch.yaml), function `worker_main_cell`, lines 42 to 79 -- NOT from the
      producer's new file: `A = IntegerMatrix.random(d, "qary", k=d//2, q=Q)`;
      `LLL.reduction(A)`; then `FPLLL.set_precision(mpfr_bits)` BEFORE the GSO is
      constructed; `M = GSO.Mat(A, float_type="mpfr")` with EXPLICITLY NO
      `flags=GSO.ROW_EXPO`; `M.update_gso()`; `L = LLL.Reduction(M, flags=LLL.DEFAULT)`;
      `par = BKZ.Param(block_size=beta, strategies=STRATEGIES, flags=BKZ.AUTO_ABORT)`;
      `bkz = BKZReduction(L)` from `fpylll.algorithms.bkz2`. VERIFY THIS TRANSCRIPTION
      AGAINST THE PINNED FILE YOURSELF and report any discrepancy as a finding against
