  - id: PD-B
    what: >-
      batch.yaml's suggested Validator J3 ('is the recorded tour count really the
      number of tours?') is FOLDED INTO J1, and the vacated third slot takes ARTIFACT
      AND RECEIPT INTEGRITY plus the D6 closed form plus disclosure completeness.
    why: >-
      The blind re-derivation and the definitional question are the same object
      approached from two sides; splitting them across two joints would put half the
      attack on each and would let each half assume the other. Meanwhile integrity --
      twelve declared artifacts, hashes against the snapshot receipt, the
      `failed_infrastructure` sets, and report-versus-raw-JSON agreement figure for
      figure -- is required by TASK-20260826-9605ae's committed completion gate and had
      NO OWNER in the suggested decomposition. This plan gives it one.
  - id: PD-C
    what: >-
      TASK-20260826-9605ae's committed handoff `assigned_joints` names J1 as D6 and J3
      as the tour count. This plan's joint definitions differ. Its completion-gate item
      requiring `acceptance_results.json` to be adjudicated IS MET UNCHANGED: that file
      is NOT in `blind_from` and the Validator reads it.
    why: >-
      batch.yaml `review_plan_note` gives TASK-20260826-9e9d53 the authority to write
      the binding plan and to refine the suggested joints, and both reviewer handoffs
      point at `review-plan/` for 'your joints, your attack plans, your read boundary
      and your blind_from list'. THE HANDOFF'S SUBSTANCE IS PRESERVED IN FULL: D6, D1
      and D2, the tour-count definition, artifact integrity, the board adjudication and
      the admissibility ruling are all still owned by TASK-20260826-9605ae. An earlier
      draft of this plan DID place `acceptance_results.json` in `blind_from`, on the
      dispatch brief's instruction, which would have conflicted with that gate item; the
      conflict is gone because the file carries no beta=25 figure and there is nothing in
      it to withhold (PD-G).
  - id: PD-D
    what: >-
      THE DISPATCH BRIEF'S `blind_from` LIST WAS INCOMPLETE, AND THE INCOMPLETENESS WAS
      FOUND BY THIS AUTHORING SESSION WHILE WRITING THE PLAN, NOT BY THE SESSION THAT
      WROTE THE BRIEF. The brief mandated three paths. Measured against the package, the
      then-blinded cell's final b0 and tour count appear in far more:
      `evidence/D5_tour_count.json`, `evidence/D3_D4_tiny_cell.json`,
      `acceptance_stdout.log`, `artifacts/D3_D4_D5_tiny_cell/`,
      `implementation_report.md` (sections 4.1, 5.3, 6), HARDCODED AS A LITERAL AT
      `acceptance_tests.py:175`, and `evidence/D1_D2_sigterm_surrogate.json` with its
      stdout log and both D1/D2 surrogate artifact directories -- the last group because
      the D1/D2 surrogate ran the SAME cell at the SAME seed. The dispatching
      Coordinator subsequently verified the count independently as eleven files carrying
      the b0 and twelve carrying the tour count.
    why_it_mattered: >-
      Seven of those paths are REQUIRED READING for J2 and J3, so they could not be
      placed in `blind_from` without forcing an honest reviewer to fail
      tools/check_review_independence.py. The draft plan therefore widened `blind_from`
      to six, embargoed the remaining seven by attested READ ORDER, and STATED IN TERMS
      that for those paths the independence rested on the Validator's discipline rather
      than on a mechanical check. That was the best repair available inside the
      constraint. IT WAS NOT A GOOD ENOUGH BLIND, and saying so is what produced PD-G.
    disposition: RESOLVED BY PD-G. Retained as the record of how the defect surfaced.
  - id: PD-E
    what: >-
      The `admissibility_ruling` vocabulary is FOUR-VALUED here -- `ADMIT` / `ADMIT
      WITH NAMED RESIDUAL` / `DO NOT ADMIT` / `NOT IN MY SCOPE` -- where batch.yaml and
      both handoffs name three.
    why: >-
      A WIDENING, NOT A NARROWING: every ruling expressible under the three-valued
      scheme is still expressible, and no reviewer is pushed toward a verdict it does
      not hold. It exists because P1 pre-commits the Coordinator to disbelieving a bare
      `ADMIT`; a reviewer forced to choose between a bare `ADMIT` and `DO NOT ADMIT`
      would be pushed to overstate in one direction or the other, which would corrupt
      the very signal P1 is trying to preserve.
  - id: PD-F
    what: >-
      This plan quotes no measurement of its own and computed none. Its author held no
      shell.
    why: >-
      Stated so that no figure here is mistaken for a fresh measurement. Every number
      is attributed at its point of use to the committed artifact or to the dispatch
      brief it was read from. The snapshot receipt, the hashes, the commit and the
      validator runs are the driving session's, and this plan asserts none of them.
  - id: PD-G
    what: >-
      THE BLINDED CELL WAS CHANGED, AFTER THE PLAN WAS FIRST DRAFTED, FROM THE BATCH'S
      OWN ACCEPTANCE CELL (d=64, beta=20, mpfr_bits=53) TO A COORDINATOR-CHOSEN CELL THE
      PRODUCER NEVER RAN (d=64, beta=25, mpfr_bits=53). `blind_from` collapsed from six
      paths to one, the seven-path read-order embargo was retired, and the Phase 0 /
      Phase 1 ordering gate was demoted to ordinary practice that nothing relies on.
    the_trail_which_matters_more_than_the_fix: >-
      RECORDED IN ORDER, AND ATTRIBUTED. (1) The dispatching Coordinator's brief named
      three `blind_from` paths. (2) THIS AUTHORING SESSION FOUND THAT LIST INCOMPLETE
      while writing the plan, enumerated the additional files carrying the answer,
      implemented the widest honest repair available inside the constraint -- six
      blinded paths plus a seven-path read-order embargo -- AND REPORTED THE RESIDUAL
      AGAINST THE BRIEF rather than presenting the repair as sufficient (PD-D).
      (3) The dispatching Coordinator verified the finding independently, measured the
      leak surface as eleven files for the b0 and twelve for the tour count, AND REMOVED
      THE CONSTRAINT INSTEAD OF PATCHING AROUND IT by choosing a cell that was never
      run. (4) This plan was revised accordingly. THE DEFECT WAS FOUND AGAINST THE BRIEF
      AND THE FIX IS THE BRIEF-WRITER'S RESPONSE TO IT; neither half is this session's
      alone, and the sequence is recorded so that a later reader sees a plan that
      IMPROVED AFTER ITS HANDOFF WAS FROZEN rather than a Coordinator who was right all
      along.
    why_the_new_cell_is_better_and_not_merely_cheaper: >-
      THREE REASONS, NONE OF THEM CONVENIENCE. (1) THE BLIND STOPS BEING A DISCIPLINE
      AND BECOMES A PROPERTY OF THE ARTIFACTS: there is no answer anywhere to leak, so
      the round no longer claims an independence it can only promise. (2) IT TESTS
      SOMETHING STRONGER: the producer never ran, tuned or checked beta=25, so its loop
      transcription is exercised on a cell it was not fitted to, and an instrument that
      only works where it was tuned is a finding this round can now make. (3) BKZ
      STRATEGIES ARE INDEXED BY BLOCK SIZE, so beta=25 selects a different strategy
      entry and the strategies-by-content requirement -- this goal's own recurring
      failure mode -- BITES HARDER rather than less.
    what_it_costs: >-
      STATED PLAINLY. The re-derivation no longer checks the batch's own recorded
      figures against an independent construction: no reviewer independently reproduces
      the beta=20 numbers the producer reported, and this plan does not pretend
      otherwise. What it checks instead is the INSTRUMENT that produced them, at a point
      the producer never touched. The dispatching Coordinator states the cell costs
      about 2.3 s, the same class as the acceptance cell, so no reviewer budget moves;
      this session measured nothing and attributes that figure to it.
    what_did_not_change: >-
      The seed formula and SEED_ROOT=715923 in the `[715923, 0, d, beta, 0, 0]` shape;
      the transcription from the pinned predecessor's `worker_main_cell` rather than
      from v2, with the instruction to verify that transcription and report a
      discrepancy as a finding against this plan; the strategies file pinned by content
      at `f516b0a6f0c580cff72e1e2c3562c44dc6f17e8f99613e9e4020e35481b27a18` with
      abort-on-mismatch and the relative-path warning; the interpreter; the two-readings
      requirement for b0; the 'state your own definition of tours first' clause; PTM-1;
      and the requirement that the derivation be quoted VERBATIM into
      `validation-report.yaml` so it lands inside the binding set. ONLY THE BLOCK SIZE
      MOVED, 20 -> 25.
