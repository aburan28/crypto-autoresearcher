  joints:
  - joint: 'J1 -- BLIND RE-DERIVATION of the coordinator-chosen beta=25 cell tour count and final b0, and whether the counted quantity really is tours'
    assigned_to: TASK-20260826-9605ae
    role: validator
    attack_plan: >-
      THREE PARTS, IN THIS ORDER. THE CELL IS ONE THE PRODUCER NEVER RAN: d=64,
      beta=25, mpfr_bits=53, q=3329. Its answer exists in no artifact of this batch, so
      there is nothing for you to look up, nothing to anchor on, and nothing for this
      plan to embargo.
      PART A (INDEPENDENT DERIVATION). From the construction statement in
      `blind_rederivation.parameters` ALONE -- transcribed from the PINNED PREDECESSOR,
      not from the producer's new file -- build that cell yourself and obtain (a) the
      number of BKZ tours the reduction performs and (b) the final b0 norm. Choose and
      STATE your own definition of 'number of tours' and your own route to it BEFORE
      you look at what the instrument does. PIN THE STRATEGIES FILE BY CONTENT BEFORE
      YOU USE IT: verify its sha256 against the value in
      `blind_rederivation.parameters`, abort if it differs, and RECORD IN YOUR REPORT
      THE ABSOLUTE PATH AND THE SHA256 OF THE STRATEGIES BYTES YOU ACTUALLY PASSED.
      Strategies drive per-block preprocessing and pruning AND ARE INDEXED BY BLOCK
      SIZE, so beta=25 selects a different strategy entry than beta=20 and a
      `BKZ.Param` built WITHOUT strategies describes a DIFFERENT reduction entirely; a
      tour count obtained under one is not comparable with a tour count obtained under
      the other, and A RE-DERIVATION THAT REPORTS A MISMATCH WITHOUT NAMING ITS
      STRATEGIES BYTES HAS MEASURED NOTHING. This is not a hypothetical:
      BATCH-f9780d's whole failure mode was BKZ strategies resolved BY PATH with no
      hash, so a byte-identical re-run failed in a different container
      (DEC-20260824-5e222e rationale), and the pinned predecessor itself resolves the
      file relative to its OWN directory, so transcribed code run from anywhere else
      silently points at nothing. Write Part A to
      `reviews/TASK-20260826-9605ae/blind-rederivation.yaml` and quote it VERBATIM into
      your validation report.
      PART B (THE COMPARAND YOU MUST CREATE). There is no producer number for this
      cell, so you make one: run the v2 instrument's OWN tour-count path on the SAME
      cell, at the same seed and the same strategies bytes, and compare it against your
      Part A figures. THIS IS THE POINT OF CHOOSING beta=25 -- the producer never ran,
      tuned or checked this block size, so its loop transcription is being exercised on
      a cell it was not fitted to.
      PART C (THE DEFINITIONAL QUESTION). IS THE RECORDED COUNT THE NUMBER OF TOURS, or
      something mistaken for it -- child nodes of another tracer label, preprocessing
      sub-calls, an enumeration count, or a loop-iteration count that skips or
      double-counts an iteration the upstream loop does not? Find out for yourself what
      mechanism the instrument declares, judge the reason it gives for choosing that
      one, and judge whether whatever it counts corresponds one-for-one to upstream's
      own tour iterations -- pre-loop LLL and every break test retained, in order.
    breaking_artifact: >-
      A tour count or final b0 from your own construction that differs from what the v2
      instrument produces on THE SAME beta=25 cell UNDER IDENTICAL STRATEGIES BYTES,
      with both sha256 values stated; or a demonstration that the quantity the
      instrument records is not the number of tours; or a transcribed loop that has
      dropped or reordered a break test relative to upstream; or a tour count that
      varies across repeated runs at fixed seed and fixed strategies, which would break
      determinism itself; or an instrument that fails, misbehaves or silently changes
      quantity at a block size it was never fitted to.
  - joint: 'J2 -- D1 and D2 under a real kill, and the signal-safety of the flush mechanism'
    assigned_to: TASK-20260826-9605ae
    role: validator
    attack_plan: >-
      DO THEY FIRE UNDER A REAL KILL, OR ONLY IN THE HAPPY PATH? Re-run the producer's
      own kill test by launching `rt_ctrl_1_matched_pair_v2.py` AS A SUBPROCESS -- only
      a real subprocess can be really killed -- and try to break it. The producer's
      safety argument is precise, so attack it precisely: it claims the journal is a
      JSON-Lines file opened ONCE with `os.open(..., O_WRONLY|O_CREAT|O_APPEND)`, that
      a COMPLETE partial record is PRE-SERIALISED to bytes (one payload per signal, so
      the flushed status is the true one), that the payload dict is rebuilt and REBOUND
      WHOLESALE on each refresh so the handler reads either the old dict or the new one
      and never a half-updated one, and that the handler does exactly one `os.write`,
      one `os.fsync`, one short `os.write` to fd 1, then `os._exit` -- allocating
      nothing, opening nothing, importing nothing, calling no json function and
      touching no buffered Python stream. CHECK EVERY CLAUSE OF THAT AGAINST THE SOURCE.
      Is the payload genuinely pre-serialised at EVERY point at which the code claims
      it is, including the pre-tour refresh? Can two writes interleave -- try delivering
      a signal repeatedly, delivering two signals, and delivering one while a refresh is
      in flight. Can you produce a TRUNCATED, EMPTY or UNPARSEABLE journal line? Does
      the handler's own claim survive SIGINT as well as SIGTERM, and what does SIGALRM
      do differently? Check that the aggregate `*_results.json` view is never written
      from signal context and that its absence after a kill is the documented
      behaviour rather than a lost file. Finally verify DEC-20260815-3e8e9c condition
      (v) discharged with the LITERAL `failed_infrastructure` label -- in the directory
      names, inside each flushed record, and in the evidence file -- and that nothing
      was deleted.
    breaking_artifact: >-
      A kill that leaves no record, an empty record, a truncated or unparseable journal
      line, two interleaved writes, a handler that allocates or opens under signal, a
      flushed status that does not match the signal actually delivered, or an artifact
      of a killed execution that is absent rather than preserved under the literal
      label.
  - joint: 'J3 -- artifact and receipt integrity, the D6 closed form, and completeness of the producer disclosure'
    assigned_to: TASK-20260826-9605ae
    role: validator
    attack_plan: >-
      THREE STRANDS, ALL MECHANICAL, ALL CHEAP.
      (a) INTEGRITY. All TWELVE declared artifacts present, each hashing to the value
      in TASK-20260826-9e9d53's snapshot receipt, recomputed by you from disk AND from
      the commit blob. `acceptance_stderr.log` is EMPTY, NOT OMITTED -- a zero-byte
      file that exists is a different fact from a missing one, and say which you found.
      Confirm the two `failed_infrastructure` artifact sets are COMPLETE against the
      producer's own enumeration, and that the undeclared-but-disclosed artifacts named
      in implementation_report.md section 7 are the ones actually on disk, with nothing
      extra and nothing missing. Confirm the pinned predecessor's sha256 is still
      `bc0524ee432a2327bc4a5cfff5d8f5d79b590d37b2f38ea428c78af5abb25035` (quoted from
      batch.yaml) and that it was not edited. Confirm no output anywhere in the package
      mentions d=512 or mpfr_bits=100 as having been RUN.
      (b) FIGURE FOR FIGURE. Every quantitative figure in `implementation_report.md`
      must be reproduced from the raw JSON it cites -- not spot-checked, walked. A
      report figure that disagrees with its own raw JSON is the cheapest possible
      break and nobody has looked for it.
      (c) D6 IN CLOSED FORM, RE-DERIVED BY YOU. From the DEFINITION of the root Hermite
      factor and the parameters, show that (corrected / defective) = q^(1/2 - 1/(2d))
      for the q-ary construction with k = d//2 where vol^(1/d) = q^(1/2), and reproduce
      the two figures the ledger already carries: 57.242 at (q=3329, d=512) and 54.8457
      at (q=3329, d=80). BOTH ARE QUOTED FROM COMMITTED RECORDS (batch.yaml D6
      provenance, DEC-20260824-5e222e), so this strand is NOT blind and is not
      described as blind -- see `procedure_deviations` PD-A. Then run the known-false
      control PTM-3 below: a D6 check that cannot distinguish the defective form from
      some OTHER wrong form is testing nothing.
    breaking_artifact: >-
      A declared artifact absent or hash-mismatched against the receipt; a report figure
      that does not reproduce from its cited raw JSON; a `failed_infrastructure` set
      that is incomplete; an edited predecessor; a D6 identity that does not reproduce
      57.242 or 54.8457; or a D6 check that also passes on a formula it should reject.
  - joint: 'J4 -- the d=64 surrogate does not generalise to d=512 at mpfr_bits=100'
    assigned_to: TASK-20260826-5ee48b
    role: red-team
    attack_plan: >-
      NAME, CONCRETELY, WHAT A d=512 / mpfr_bits=100 RUN WOULD DO THAT THE d=64
      SURROGATE CANNOT SHOW, and then say FOR EACH OF D1..D6 whether that fix could
      SILENTLY FAIL ONLY AT SCALE -- silently being the operative word: a fix that
      fails loudly at scale is a recoverable run, a fix that fails silently produces a
      confident record of nothing. THE PRODUCER'S OWN DISCLOSURES ARE YOUR OPENING, NOT
      YOUR CONCLUSION: the deferred handler inside a long C call, the GIL-starved
      sampler, the uncapped `tours_table` inside every flushed payload, the 24-line
      `stdout_tail` cap, the unmeasured per-tour flush overhead. Those are already
      disclosed, so restating them earns nothing; what is unowned is whether the list
      is COMPLETE and whether each mitigation is the right one. Candidate territory
      nobody has covered: file-handle and fd lifetime over hours; journal file size and
      fsync cost over thousands of tours; what happens if the journal's filesystem
      fills; whether `os.fsync` per tour is itself a cost at d=512; whether a
      pre-serialised payload embedding a growing `tours_table` makes each refresh
      progressively more expensive and whether that cost lands INSIDE the tour or
      between tours; whether the scale guard (`--max-toy-d`, default 128, overridable
      by `--scale-run-authorisation`) is a guard or a speed bump. WHERE A DECISIVE
      ANSWER WOULD NEED A SCALE MEASUREMENT, NAME THE MEASUREMENT AND DO NOT TAKE IT:
      you may run NO d=512 reduction and may NOT re-attempt the 100-bit cell, which
      DEC-20260824-5e222e refuses and which no review authorises. KN-FIND-f54a82 binds
      how a tiny cell may be described.
    breaking_artifact: >-
      A named, concrete, scale-only failure mode of a fix that the acceptance suite
      reports as PASS -- with the mechanism stated and the measurement that would
      settle it named; or a demonstration that the producer's disclosed list of
      scale limits is materially incomplete.
  - joint: 'J5 -- proves-too-much against BATCH-f9780d own executions, and what this batch actually buys'
    assigned_to: TASK-20260826-5ee48b
    role: red-team
    attack_plan: >-
      RUN THE ARGUMENT AGAINST THE OBJECT WHERE ITS CONCLUSION IS ALREADY KNOWN. IF
      THESE SIX FIXES HAD BEEN IN PLACE FOR BATCH-f9780d'S OWN TWO EXECUTIONS, WOULD
      ITS VERDICT HAVE CHANGED? Take the two cells separately, because they are not
      alike: the 75-bit reference arm terminated ON ITS OWN, raised
      `ReductionError('infinite loop in babai')` at 2502.74 s inside its cap, and WAS
      recorded -- so an argument concluding that the repair would have changed THAT
      verdict has proved too much and is wrong somewhere (PTM-4). The 100-bit target
      arm ran at least 14448 s, was capped, and wrote nothing at all. State plainly
      what the repaired instrument would have left behind in each case, and what
      DEC-20260824-5e222e's ruling would have been on that record. IF THE ANSWER IS
      'THE VERDICT WOULD NOT HAVE CHANGED', SAY SO AND THEN SAY WHAT THIS BATCH
      ACTUALLY BUYS. An instrument repair that would not have changed a single
      committed verdict is not thereby worthless -- but it must then be defended on
      what it ENABLES NEXT rather than on what it would have fixed, and that defence
      must be checkable. Also run PTM-5: check whether ANY record of this batch --
      batch.yaml, acceptance_results.json, implementation_report.md section 0, and THIS
      REVIEW PLAN, which is a Coordinator artifact and is in scope -- states 'the
      instrument now records partial state on kill' without the SIGKILL and
      mid-tour-at-d=512 carve-outs the producer itself disclosed.
    breaking_artifact: >-
      A demonstration that the repaired instrument, applied to BATCH-f9780d's exact
      executions, yields the same one bit; or, conversely, a demonstration that it would
      change a verdict the ledger has already recorded -- which would be a
      contradiction with validated evidence and would re-route this batch's review tier
      per batch.yaml `routing_justification`; or a record of this batch, including this
      plan, that overstates the kill-time guarantee.
  - joint: 'J6 -- next-run sizing from the 14448 s lower bound, computable or not'
    assigned_to: TASK-20260826-5ee48b
    role: red-team
    attack_plan: >-
      DEC-20260824-5e222e REQUIRES THE NEXT 100-BIT ATTEMPT TO BE SIZED FROM THE 14448 s
      LOWER BOUND BATCH-f9780d MEASURED, AND NEVER FROM THE PREDECESSOR'S 2502.74 s,
      WHICH THAT DECISION AND DEC-20260815-3e8e9c BOTH CALL A FAILURE COST AND NOT A
      BASELINE. DOES THE REPAIRED INSTRUMENT MAKE THAT SIZING COMPUTABLE, AND WHAT IS
      STILL MISSING? DEC-20260815-3e8e9c(i) names the tours-per-hour cost curve from a
      killed cell as 'exactly the quantity a Stage-1 sizing decision needs and does not
      have'. Walk it end to end on the artifacts: what does a capped, SIGTERM'd d=512
      cell actually leave on disk under v2, what can be computed from that, and what
      cannot? Specifically -- does a lower bound on the in-flight tour plus the
      completed tours' rows give a usable rate estimate, or only an interval? Is a
      tours-per-hour rate even the right shape when BKZ tour cost is not constant
      across tours and AUTO_ABORT may end the run for reasons unrelated to time? What
      would a sizing decision still lack: the number of tours to completion, the
      precision-dependence of per-tour cost, the variance across seeds, the load
      average of the host it runs on? ENUMERATE WHAT IS MISSING. DO NOT SIZE, RECOMMEND
      OR AUTHORISE ANY BUDGET: J6 asks whether the sizing is COMPUTABLE, and
      authorisation is a Coordinator decision plus a frozen contract, neither of which
      exists for the 100-bit cell.
    breaking_artifact: >-
      A demonstration that the instrument still cannot produce a sizing input from a
      capped cell; or an enumeration of what a sizing decision would additionally need
      that this batch does not provide; or a demonstration that the tours-per-hour
      framing DEC-20260815-3e8e9c(i) prescribes does not answer the question it was
      prescribed for.

  joint_ownership_note: >-
    SIX JOINTS, THREE PER REVIEWER, DISJOINT, EXACTLY ONE OWNER EACH. Two reviewers on
    one joint would mean another joint has none. REPORT ON YOUR OWN JOINTS AND NOT ON
    THE WHOLE CLAIM: you cannot see the other three by construction, so a whole-claim
    verdict from you is an opinion formed from a fraction of the evidence. THE
    COORDINATOR COMPOSES, at TASK-20260826-70d800. Copy your three joint strings
    VERBATIM from this file into `review_attestation.joints_owned` --
    tools/check_review_independence.py matches them as exact strings and a paraphrase
    reads to it as an unowned joint.
    ONE STALE PHRASE IN J1'S TITLE, LEFT STALE ON PURPOSE. J1 reads 'the tiny
    acceptance cell tour count and final b0'. Since PD-G the blinded cell is d=64,
    BETA=25 -- a Coordinator-chosen cell the producer never ran -- and NOT the batch's
    beta=20 acceptance cell. THE STRING IS PRESERVED BYTE-FOR-BYTE ANYWAY because it is
    the checker's exact-match key and both assignments quote it; editing it in three
    places to fix four words would risk the one failure mode the key exists to prevent.
    The joint's SUBSTANCE is `blind_rederivation` and J1's attack plan, both of which
    name the cell correctly.

  admissibility_ruling_required: >-
    EACH REVIEWER RETURNS AN `admissibility_ruling` BLOCK, SEPARATE FROM ITS JOINT
    FINDINGS, answering ONE question: IS THIS INSTRUMENT FIT TO CARRY THE NEXT CAPPED
    RUN AT d=512, mpfr_bits=100? Answer as one of `ADMIT` / `ADMIT WITH NAMED RESIDUAL`
    / `DO NOT ADMIT` / `NOT IN MY SCOPE`, WITH THE REASON, and with the residual named
    concretely where the third word is used. A `breaks` on an owned joint is not by
    itself a refusal of admission, and an `ADMIT` IS NOT AN APPROVAL OF ANY RE-RUN --
    approval is a frozen contract at a declared path plus a committed Coordinator
    decision, and neither exists for the 100-bit cell. SILENCE IS NOT AN ADMISSION and
    may not be read as one. A BARE `ADMIT` WILL BE READ AGAINST THE PRE-COMMITMENT IN
    `recorded_priors` P1 -- and P1's `what_this_is_not` clause binds just as hard.

