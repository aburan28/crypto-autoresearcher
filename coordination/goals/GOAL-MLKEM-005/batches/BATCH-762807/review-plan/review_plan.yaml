    STARTED stub before a cell begins, flushes a partial record on a real signal,
    emits and flushes per-tour progress, records resources machine-readably, counts
    tours by a stated mechanism that agrees with upstream `BKZReduction.__call__` at
    d=64, and computes the root-Hermite factor by the standard definition. The
    producer further states that no d=512 reduction of any kind was run at any
    precision under any label, that no mpfr_bits=100 cell was run, that every lattice
    it touched was d=64/beta=20/mpfr_bits=53 (plus one d=32/beta=10 probe of the
    defect itself), that the claim tier is `toy` and the ceiling `instrument_repair`,
    that nothing here transfers to d=512, to mpfr_bits=100, to any other dimension or
    precision, or to any cryptographic parameter set -- and that whether the
    instrument is FIT TO CARRY THE NEXT CAPPED RUN is explicitly NOT its own call but
    is left to the two reviewers' `admissibility_ruling` blocks and to
    TASK-20260826-70d800.

