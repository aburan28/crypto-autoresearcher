    - The 38-cell X_null table - re-derived at 40 digits by exact parameter arithmetic AND matched against the run's doubles. Two routes, one of them independent of the producer entirely.
    - The three Student-t quantiles - inverted through the exact incomplete beta AND cross-checked by direct quadrature. Two routes.
