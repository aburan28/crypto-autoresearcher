  own_null_objects_and_observables_BUILT_not_proposed:
  - id: V-P1
    what: >-
      THREE parameter-determined observables of my own, never seen by the
      producer, pushed through THE PRODUCER'S OWN GATE AND CODE PATH - its
      rho_both, its summarize, its bit_identical, and its G-REL1, G-REL2 and
      G-VAR aggregation, imported from the committed measure_relvar.py rather
      than re-implemented, so the comparison is against the same instrument.
    observables:
    - id: V1_gsa_tail
      definition: (beta - d) * log(delta_0(beta)), the GSA root-Hermite prediction of exactly what X10 = hkz measures
      designed_to: FAIL, because it is blind to k and to q by construction
      result: >-
        G-REL1 passes at 8 of 10; G-REL2 passes at 0 of 19 with best mean exactly
        0.0. G_REL overall FAILS. THIS IS MY OWN COULD-NOT-PASS CONTROL: my probe
        can fail, and one of my three did.
    - id: V2_logdens
      definition: ((d-k)/d) * log(q) * log1p(beta) / 8, a closed form in all four parameters, NOT proportional to X_null
      result: >-
        G-REL1 10 of 10, G-REL2 19 of 19, best mean 0.6000, bit-identical over
        the 8 bases at 38 of 38 cells. Walks the gate; G-VAR refuses it.
    - id: V3_nullscaled
      definition: X_null / 8, chosen so its magnitude lies INSIDE X10 = hkz's own realized range
      result: >-
        G-REL1 10 of 10, G-REL2 16 of 19, bit-identical at 38 of 38 cells, with
        max |X| over all cells of 0.5322 - smaller than hkz's own scale floor
        s_X = 1.0 and comparable to hkz's realized magnitudes. It walks the gate
        anyway.
    why_V3_matters: >-
      THIS KILLS THE STRONGEST AVAILABLE OBJECTION TO THE PRODUCER'S HEADLINE. A
      reader could say X_null only clears an absolute 0.10 test because its
      magnitude runs up to 3.93 while hkz's runs to 0.45, so the refusal is about
      size rather than about blindness. V3 is blind AND small - it is bounded by
      0.53 - and it still clears both clauses at 10 of 10 and 16 of 19. The gate
      admits a blind closed form inside the failing candidate's own magnitude
      range.
  - id: V-P2
    what: independent re-verification of the UNPLANNED finding OBS-R1 (rdet zero dispersion)
    method: rebuilt all 8 frozen bases at all 10 lattices myself and evaluated rdet through slogdet on the actual matrix
    result: >-
      CONFIRMED. Bit-identical over the 8 bases at every one of the 10 lattices,
      hence at all 38 cells. Precise note for the record - the realized double is
      NOT bitwise equal to Python's q**((d-k)/d); the two differ in the last ULP
      because one goes through an LU log-determinant and the other through pow.
      The producer never claimed bitwise equality to the closed form, only the
      exact-arithmetic identity and bit-identity ACROSS BASES, and both of those
      hold.
  - id: V-P5
    what: >-
      The counterfactual that the sharpest objection to R-OUT-1 needs. The
      producer evaluates X_null MATRIX-FREE from the closed form, so a reader can
      say its zero dispersion is an artifact of never touching a basis. I
      computed X_null the way its definition literally reads - (beta/d)(1/d) times
      slogdet of the ACTUAL matrix B - at all 38 cells over all 8 bases.
    result: >-
      THE OBJECTION FAILS. X_null from the actual matrix is bit-identical over the
      8 bases at 38 of 38 cells, exactly as the matrix-free form is, and at L7
      beta 5 the two routes even agree bitwise. The implementation choice is
      DISCLOSED (F-9) but it is NOT load-bearing, and I establish that by
      measurement rather than by argument. Reported at the same weight as my
      adverse findings, because it goes against a line of attack I opened myself.
  - id: V-P4
    what: TWO null families of my own for the Section B-prime item, built rather than accepted
    method: >-
      Reused the producer's byte-for-byte carried downstream path - errors,
      projection, chunking, quantile estimator, SE construction, closed-form step
      and cell scoring, imported from the committed measure_nullfam.py - and
      replaced the ONE thing the producer chose, the seed family drawing the 13
      independent Haar frame stacks. FAMILY-A uses a different additive offset;
      FAMILY-B uses a sequence-seeded generator, a different RNG stream shape
      entirely rather than a translation of the producer's scalar formula.
      Full N = 2^20, four cells, 13 grid points each, 170 s total.
    result: >-
      FAMILY-A gives n_fire(c=6) = 35 of 48. FAMILY-B gives 39 of 48. The
      producer reports 35 of 48. All three lie at or above the committed real
      count of 29 of 48, which is only reportable beside the Red Team's exact-null
      benchmark of 47 of 48, and all three therefore FAIL the pre-registered decay
      check. 48 live steps and 0 degenerate in both of my families.
    validator_judgement: >-
      THE PRODUCER'S NULL-FAMILY RESULT IS NOT AN ARTIFACT OF ITS SEED CHOICE. I
      did not accept the producer's null; I built two and both reproduce the
      direction and one reproduces the number exactly. The decay check fails on
      objects the producer never touched.
    where_my_measurement_qualifies_the_producer: >-
      My families' median se_step/se_diff ratios span 0.75 to 1.22 per cell,
      wider than the 1.05 to 1.08 the report quotes, and my median c_min values
      span 4.21 to 5.92 against the report's 5.30 to 5.70. So the report's "~1 +
      4.2071 * 1.07 ~ 5.5" is a description of ITS OWN seed draw, not a stable
      constant of the statistic. The conclusion is more robust than the mechanism
      sentence implies, since the count stays at or above the real arm across a
      much wider ratio range - but the quoted ratio range should not be cited as
      a property of the estimator.
  - id: V-P6
    what: G-NUM for the parameter-determined observables, since no producer artifact records or argues it (see F-8)
    result: >-
      max rho_T0, the repeat-run residual, is exactly 0.000e+00 for X_null and for
      both of my own passing observables, against tau_num = 1e-6. G-NUM passes for
      all three. I closed this gap by my own measurement rather than by assertion,
      and I record that the producer did not.

  # ------------------------------------------- 7. the two questions, answered SEPARATELY
  admissibility_gate_statement:
    question_1_is_the_gate_INADMISSIBLE_under_G_VAR:
      answer: >-
        YES. On the criterion as frozen in the notarized text at 1aa7db53 -
        tau_var exactly 0, decided by bit identity of the 8 IEEE-754 doubles and
        not by a tolerance - G-VAR fires, and the AM-4/AM-8 admissibility gate is
        INADMISSIBLE. NO ADMISSIBILITY CLAIM IS REPORTABLE FROM THAT GATE IN
        EITHER DIRECTION, and none is made here.
      why_I_believe_it_beyond_the_producer_s_own_evidence: >-
        Because it does not rest on the producer's evidence. Two observables I
        built myself and the producer never saw - V2_logdens and V3_nullscaled -
        walk both G-REL clauses through the producer's own gate and code path
        while being bit-identical across all 8 bases at all 38 cells, and one of
        them does so with a magnitude inside the failing candidate's own range.
        A third observable of mine fails the same gate, so the demonstration is
        not that my probes pass everything. Separately, the objection that the
        zero dispersion is an artifact of matrix-free evaluation is refuted by my
        own measurement (V-P5).
      scope: >-
        Tested at d in {20, 30, 40, 100, 140}, the listed k, the listed beta grid,
        q = 3329, 8 frozen bases, with the reduction-dependent candidates at
        d <= 40 only. TOY. Nothing transfers upward.
    question_2_did_any_candidate_pass_STATED_SEPARATELY:
      answer: >-
        Under the gate's own arithmetic, and recomputed by me from raw: TWO of the
        five scored candidates pass both G-REL clauses at the mean-over-8 reading
        - X_null, a blind closed form, and X_mp = rawtail, an instrument control
        declared MUST-PASS in advance. X8 = rdet passes G-REL2 at 19 of 19 with
        best mean 0.9691 but its G-REL1 is forced identically zero by algebra, so
        it is held out. X9 = lam1n passes no G-REL2 cell (best mean 0.0662) and
        X10 = hkz passes none (best mean 0.0378 at the scale-floor normalization,
        0.1914 at |X|).
      what_this_does_and_does_not_mean: >-
        It means "R1 is empty" was a statement about which ten items were on a
        list. It does NOT mean any observable in this goal is admissible: the gate
        that would say so is inadmissible by question 1, so neither passing
        candidate is an admissible observable and no admissibility claim follows
        in either direction. The two questions are answered separately here
        precisely because conflating them is how a refusal gets read as a result.
    R3_for_hkz_both_readings_verified:
      normalization_artifact_half: >-
        CONFIRMED. The two normalizations disagree at exactly 3 of the 9 hkz
        cells, all three at L7/L8, where s_X = 1.0 exceeds |hkz| by 5.06x, 7.79x
        and 16.95x. At that whole pair the |X| normalization returns pass where
        max(|X|, s_X) returns fail. Across all 9 cells the scale floor is binding
        at 8 of 8 bases in every cell and s_X/|X| runs from 2.29 to 16.95.
      surviving_conclusion_half: >-
        CONFIRMED, and it is the stronger half. All 9 mean gaps lie below their
        own paired-test detection floors and |t| < 2.3646 at all 9, ranging from
        -0.946 to +0.940. The quantity being thresholded has an expectation
        indistinguishable from zero against a spread many times its mean, so
        neither the realized value nor the 0.10 threshold carries information at
        this scope. Recomputed by me from raw at both normalizations.
      the_two_are_not_conflated_in_the_report: CONFIRMED - the report states them separately and I agree with the separation.

  not_computed_cell_audit:
    total: 28 - eight G-REL1 entries and twenty G-REL2 entries
