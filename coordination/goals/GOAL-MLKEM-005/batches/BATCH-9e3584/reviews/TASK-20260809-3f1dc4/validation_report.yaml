  # ------------------------------- 1. the arrangement in which MY OWN check could not fail
  could_not_fail_arrangement_named_before_running:
    declaration: >-
      Named in-session before any probe was executed, in both directions, as the
      task card requires. Both are live failure modes for a validator, not
      rhetorical.
    could_not_FIRE:
      arrangement: >-
        I re-arithmetic the producer's own summary numbers using the producer's
        own code and its own intermediate values, so any defect living in the
        GENERATION of those numbers - a wrong observable, a wrong seed family, a
        wrong constant, a wrong denominator - is invisible to me, and I report
        agreement that was structurally guaranteed.
      i_am_not_in_it_and_here_is_the_evidence: >-
        Every reported statistic was recomputed by MY OWN implementation from the
        rawest quantity each artifact retains - the per-basis X_a and X_b pairs
        in Section R, the per-step delta and SE pairs in Section B-prime, and the
        committed raw 8x4 Delta tables in Sections C1 and C2 - never from a
        producer summary. Every forced constant was re-derived at 40 decimal
        digits with mpmath, by a path that touches neither scipy nor any producer
        code. I built THREE observables of my own and TWO null families of my own
        and pushed them through the producer's gate. And it did fire: findings
        F-1 through F-8 below are defects I found, one of which - F-1 - is a
        false numeric range in the lead's own headline paragraph.
    could_not_PASS:
      arrangement: >-
        I set a tolerance so tight that ordinary float rounding reads as a
        defect, or I demand bitwise agreement across environments that no rule
        requires, so nothing could ever be validated and the verdict is decided
        by my tolerance rather than by the artifacts.
      i_am_not_in_it_and_here_is_the_evidence: >-
        The tolerance is 1e-12 relative on every derived statistic and exact
        IEEE-754 hex identity ONLY where the producer's own criterion is a bit
        test (G-VAR), which is the criterion's own frozen definition and not a
        choice of mine. At that tolerance 936 per-basis entries, 117 scored
        cells, 48 null-family steps across 11 c values and the entire C1 and C2
        target sets passed with ZERO mismatches, and a full from-scratch
        re-execution of the lead reproduced its results file bitwise except for
        wall-clock timings. A check that produces zero mismatches on ten thousand
        comparisons is not a check tuned to refuse.
    what_would_have_forced_the_other_verdict:
      to_have_forced_failed: >-
        Any of: a recomputed mean gap, between-basis sd, paired t or detection
        floor disagreeing with its record beyond 1e-12; a NOT COMPUTED cell
        entering a count as a zero, a pass or a fail; a producer artifact first
        appearing anywhere other than c034ef38; the frozen text present at
        3d5dd80a or carried by more than one commit; a declared hash not matching
        at HEAD; a missing durable command.txt, stdout.log or stderr.log; a null
        family of mine landing materially BELOW the committed real count where
        the producer's landed above; or my own parameter-determined observables
        being REFUSED by the gate the producer says admits them.
      to_have_forced_passed_with_no_findings: >-
        The eight defects in the findings block not existing. Each is a specific
        checkable string or number in a committed artifact, and each is cited to
        its file and line.
      live_direction: >-
        The live direction here was FAILED, not passed. This batch's headline is
        a REFUSAL, and a refusal is the cheapest thing in the world to
        manufacture: an observable evaluated matrix-free will trivially have zero
        dispersion, and a gate can be made to look broken by feeding it something
        built to break it. I therefore attacked the refusal itself - see
        control_checks V-P1 and V-P5 - rather than only auditing arithmetic.

