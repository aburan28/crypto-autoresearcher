  # --------------------------------------------------------- 5. metric recomputations
  metric_recomputations:
  - id: M-1
    scope: Section R, every G-REL1 and G-REL2 entry, FROM RAW
    what_I_did: >-
      Recomputed, from the per-basis X_a, X_b and s_X triples only, at all 936
      per-basis entries across 117 scored cells - value at the max(|X|, s_X)
      normalization, value at the |X| normalization, the ratio s_X/|X| at EVERY
      entry, and the scale-floor-is-binding flag; then per cell, the mean, sd,
      min, median and max of both normalizations, the count of passing bases at
      each normalization, the legacy i=0 reading and the mean-over-8 reading, and
      the normalizations-disagree flag.
    result: 0 mismatches at 1e-12 relative
    note: >-
      s_X/|X| was checked at every one of the 936 entries, not per cell, as the
      completion gate requires.
  - id: M-2
    scope: Section R, the paired statistics, FROM RAW, per candidate and per pair
    what_I_did: >-
      For all 95 G-REL2 cells with data, recomputed the per-pair mean difference
      as mean_i (X_b - X_a), the between-basis sd on the k side and on the mirror
      side, the paired sd of the gap at ddof 1, the paired t as mean_g divided by
      sd_g/sqrt(8) at df 7, the detection floor as t_crit(7,0.05)*sd_g/sqrt(8),
      the below-floor flag, the significance flag and the gap-as-fraction-of-its-
      own-spread.
    result: 0 mismatches at 1e-12 relative
    degenerate_handling_checked: >-
      38 of those cells have sd_g exactly 0 - the 19 rdet cells and the 19 X_null
      cells. In every one the producer records paired_t, significant_at_0.05,
      mean_gap_below_detection_floor and the spread fraction as JSON null, never
      as 0 and never as a pass or a fail. I verified all 38. That is the correct
      handling and it is worth naming: a zero-variance cell is exactly where a
      fabricated t would be easiest to hide.
  - id: M-3
    scope: Section R, full from-scratch re-execution
    what_I_did: >-
      Ran the committed measure_relvar.py end to end with --out into a scratch
      path outside the repository, then compared the entire results tree against
      the committed results file key by key, comparing floats by IEEE-754 hex.
    result: >-
      BITWISE IDENTICAL on every key except wall-clock timings. All 49 differences
      are per-reduction "secs" fields and reduction total_seconds. The 48 HKZ
      reductions, max hkz_violation 0.0, every G-VAR bit test, every G-REL entry,
      every paired t and every outcome row reproduce exactly. Outcome rows
      realized in my re-run: R-OUT-1, R-OUT-4, R-OUT-6, R-OUT-8, R-OUT-10 -
      identical to the record.
    scope_limit_stated_plainly: >-
      THIS IS A REPRODUCIBILITY CHECK, NOT AN ENVIRONMENT-INDEPENDENCE CHECK. My
      environment is the SAME machine as the producers' - host vm,
      Linux-6.18.5-fc-v20-x86_64, Python 3.11.15, numpy 2.4.6, scipy 1.17.1,
      fpylll 0.6.4 - so bitwise agreement is expected and carries no
      cross-platform weight. I say so rather than let it read as more than it is.
  - id: M-4
    scope: Section B-prime, n_fire FROM RAW
    what_I_did: >-
      For all 48 live steps recomputed c_min as 1 + (t_crit*SE_step - Delta)/
      SE_diff and the AM-3 statistic as (Delta + (c-1)*SE_diff)/SE_step at all 11
      c values, then re-derived n_fire under BOTH definitions - the count of steps
      with c_min <= c, and the count of steps whose statistic exceeds t_crit.
    result: >-
      0 mismatches. Both definitions give 0, 0, 1, 1, 10, 35, 47, 48, 48, 48, 48
      across the c grid, matching the record exactly, with 48 live steps and 0
      degenerate. n_fire at the negative control c = -6 is 0.
  - id: M-5
    scope: Section C1, every target FROM THE COMMITTED RAW 8x4 TABLES
    what_I_did: >-
      Re-implemented the two-way support-by-pool variance decomposition from the
      formulas - not by importing the producer's function - including the
      negative-variance-component fallback to residual df, and recomputed for all
      ten targets - Delta_bar, SE, Satterthwaite nu_eff, t_crit at alpha_pair =
      0.10/11, |t|, |t|/|t|crit, the relative difference against the committed
      denominator, the relative detection floor, SE_naive, the SE ratio, both
      clause verdicts at 0.15 and at 0.025, the floor-below-tau flag and both
      SUGGESTIVE bands.
    result: 0 mismatches at 1e-12 relative on every field of every target
    headline_counts_independently_reproduced: >-
      0 FALSIFYING pairs at 0.15 and 0 at 0.025; 4 targets with floor below 0.15
