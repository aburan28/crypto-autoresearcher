  # ----------------------------------------------------------------- 8. findings
  findings:
  - id: F-1
    severity: MAJOR (a false numeric claim in the lead's headline paragraph; no verdict changes)
    where: report_relvar.md section 2
    claim: >-
      "X_null clears a 0.10 relevance threshold by a factor of 6 to 31, in both
      clauses, at every cell."
    what_I_measured: >-
      FALSE AS WRITTEN. The minimum over all scored cells is 4.87x, at L1/L2 beta
      15. Thirteen further G-REL2 cells sit at exactly 5.71x and one at 4.97x, so
      15 of the 19 G-REL2 cells fall BELOW the stated lower bound of 6x. The
      G-REL1 range is 12.17x to 31.03x; the G-REL2 range is 4.87x to 6.00x. The
      honest statement is "by a factor of 4.9 to 31".
    consequence: >-
      The verdict is untouched - every cell still clears tau_rel = 0.10, so
      R-OUT-1 stands - but the stated margin is overstated at the low end and the
      sentence is not citable as written.
  - id: F-2
    severity: MINOR
    where: report_relvar.md section 5(i), the nine-row hkz table
    finding: >-
      Two entries are mis-rounded in the last digit. L7/L8 beta 10 |X| column
      prints 0.1354 where the value is 0.135349, which rounds to 0.1353; L11/L12
      beta 20 max(|X|,s_X) column prints 0.0071 where the value is 0.007048,
      which rounds to 0.0070. The other 25 entries of that table round correctly.
    consequence: >-
      Immaterial to every verdict. It does establish that the report tables were
      transcribed by hand rather than emitted from the results file, which is
      worth knowing about the other tables.
  - id: F-3
    severity: MINOR (and it errs in the SELF-CRITICAL direction)
    where: report_relvar.md section 6
    claim: >-
      "Four of the seven (P-R2, P-R3, P-R5, and G-Q/G-INV inside P-R2) are forced
      by algebra."
    finding: >-
      This double-counts a sub-clause of P-R2 as a fourth member of a list whose
      members are P-R1 through P-R7. Of the seven predictions, THREE are forced by
      algebra - P-R2, P-R3 and P-R5 - and P-R2 is forced in each of its five
      clauses. The count overstates how much of the section was forced, which is
      the direction that costs the producer rather than helps it, but it is still
      wrong.
  - id: F-4
    severity: MAJOR (it bears directly on how much empirical content the lead has)
    where: report_relvar.md section 6, final paragraph
    claim: >-
      "The three that could genuinely have failed are P-R1, P-R6 and P-R7. Those
      three are the section's actual empirical content."
    what_I_established:
    - >-
      P-R6 is a REPRODUCTION CHECK, not a prediction. It asks whether this run's
      L7/L8 beta-5 paired t is below t_crit, against a quoted figure of -0.064
      that the BATCH-cbe023 Red Team obtained from the SAME frozen basis
      construction with the SAME carried seed formula through the SAME carried
      HKZ pipeline. Its falsifier is empty unless the two implementations or the
      two platforms differ, and the record does not establish that they differ
      (see F-5). AM-14's sibling clause in AM-13 names exactly this shape - "a
      prediction whose falsifier is empty conditional on a bit-exact reproduction
      check is not a prediction and must be labelled a CONSISTENCY CHECK" - and
      P-R6 is not so labelled. I do not adjudicate whether AM-13's clause, whose
      surrounding text is about Section B, formally reaches Section R; that scope
      call is the Coordinator's. I record the fact.
    - >-
      P-R7 asks whether the two normalizations disagree anywhere. A disagreement
      at L7/L8 beta 5 and beta 10 was ALREADY MEASURED AND COMMITTED before this
      batch, in the BATCH-cbe023 red-team objection RT-A2 and restated in
      DEC-20260808-05b684 rationale (ii) - frozen REL-2 0.0697 against 0.4036 and
      0.1315 under the ordinary relative difference - and the pre-registration
      cites that observation as P-R7's own basis. Its answer was in the record
      before the run.
    consequence: >-
      Exactly ONE of the seven predictions, P-R1, the X_mp MUST-PASS guard, was an
      open empirical question at the moment of notarization. That is a real and
      valuable prediction - it is the could-not-PASS guard and it had a live
      R-OUT-5 branch - but "three predictions of actual empirical content" should
      read "one". The section's genuinely new empirical content is P-R1, the
      8-basis replication of hkz at the four pairs the Red Team did NOT cover, and
      the unplanned OBS-R1.
  - id: F-5
    severity: MAJOR (an unsupported provenance claim used to upgrade the weight of a result)
    where: report_relvar.md sections 5(i) and 8, and repeated in the c034ef38 commit message
    claim: >-
      The L7/L8 agreement was "reproduced on a different operating system, a
      different CPU architecture, a different Python and a different numpy from
      the reviewer's", which "makes the digit-for-digit agreement a stronger
      result than it would be on a matched host".
    what_I_established: >-
      THE REVIEWER'S ENVIRONMENT IS NOT RECORDED ANYWHERE. I searched the
      BATCH-cbe023 red-team report and all six files in its probes directory: no
      platform, no Python version, no numpy version, no host, no environment
      block of any kind. What the producer's own run_manifest.yaml correctly
      contrasts against is BATCH-cbe023's SECTION A PRODUCER environment, which I
      verified in that section's committed results file as macOS-26.6-arm64,
      Python 3.13.1, numpy 2.4.0, scipy 1.15.3, fpylll 0.6.4. The manifest is
      accurate; the report and the commit message escalate "the Section A
      producer's" to "the reviewer's", which the record does not support.
    consequence: >-
      The AGREEMENT ITSELF IS REAL and I verified it independently - the Red
      Team's committed per-basis hkz values at L7/L8 beta 5, -0.172674 and
      -0.242366 at basis 0, match this run's -0.17267425560428773 and
      -0.24236623908861565 to the printed precision at every basis, and the
      derived mean gap, both between-basis sds and the paired t agree to every
      reported digit. What is NOT established is that the two runs were on
      different platforms, so the inference that the agreement is stronger than a
      matched-host agreement does not follow. That sentence is not citable as
      written.
  - id: F-6
    severity: MAJOR (provenance and novelty, not correctness)
    where: report_relvar.md section 2 and the whole framing of Section R's headline
    finding: >-
      X_null, its exact definition, its scale floor s_X = 1.0, and BOTH of the
      headline figures the report gives for it - G-REL1 best mean 3.1035 and
      G-REL2 best mean 0.6000 - were already BUILT, MEASURED AND COMMITTED by the
      BATCH-cbe023 Red Team as objection RT-A1, in probe_A1_null_observable.py and
      its output file, and were quoted verbatim in DEC-20260808-05b684 rationale
      (iii) together with G-NUM 3.33e-14 and G-INV 4.71e-14. I re-derived both
      figures in closed form and they are digit-identical to RT-A1's. The report
      presents them as its own headline and cites RT-A1 nowhere; only RT-A2 is
      cited anywhere in the batch. The pre-registration's section 0.4 declares
      three committed numbers as READ and RT-A1's figures are not among them,
