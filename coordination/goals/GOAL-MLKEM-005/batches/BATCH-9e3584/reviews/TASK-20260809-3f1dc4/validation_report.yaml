    - F-5's negative finding - that the BATCH-cbe023 reviewer's environment is recorded nowhere - rests on my search of one report and one probes directory. An environment record elsewhere would overturn it. I searched and found none; absence of a search result is not proof of absence.
    - F-6's provenance finding rests on reading RT-A1 and DEC-20260808-05b684 and re-deriving the two figures. The re-derivation is exact; the attribution judgement is mine alone.
