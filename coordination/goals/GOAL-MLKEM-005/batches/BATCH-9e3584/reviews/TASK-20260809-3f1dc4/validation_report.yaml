        M-3 (full re-execution from source), M-7 (mpmath re-derivation of every
        constant and of the whole X_null table), V-P1 (my own observables through
        the gate), V-P2 (bases rebuilt from their seed formula), V-P4 (my own null
        families with my own seed constructions), V-P5 (the matrix-route
        counterfactual), V-P6 (G-NUM measured), and the entire notarization and
        coordination-record block. These are what would catch a generation-side
