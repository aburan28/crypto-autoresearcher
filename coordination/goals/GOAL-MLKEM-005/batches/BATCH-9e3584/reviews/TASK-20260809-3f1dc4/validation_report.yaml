      cells I recomputed the verdict under the legacy i = 0 reading, the
      mean-over-8 reading and a majority-of-8 reading. THE THREE AGREE ON THE
      VERDICT AT EVERY ONE OF THE 117 CELLS - zero disagreements. Every per-basis
      value needed to rescore under any other rule is present. The producer's
      claim "at every cell the three readings agree on the verdict" is CORRECT.
