  verdict_rationale: >-
    ALL FOUR PRODUCER PACKAGES ARE ADMISSIBLE RESEARCH RECEIPTS. The notarization
    chain holds in both directions under git plumbing I ran myself, with the
    frozen text absent at the parent, zero producer files at the notarizing
    commit, every producer artifact first appearing at c034ef38 and exactly one
    commit for the frozen text. All 30 declared hashes match, three times over,
    at two HEADs. The artifact policy passes for every producer, closing the
    BATCH-cbe023 Section C gap. Every reported statistic in all four sections
    recomputes from the rawest retained quantity at 1e-12 with ZERO mismatches
    across roughly ten thousand comparisons, the lead re-executes bitwise from
    scratch except for timings, nineteen forced or carried values re-derive
    independently - several by paths that touch no producer code - and all 28 NOT
    COMPUTED cells are genuinely structural and enter no count as a zero, a pass
    or a fail. The controls that decide the batch were BUILT, not proposed, and I
    built my own on top of them: two parameter-determined observables of my own
    walk the producer's gate through the producer's own code path while a third
    correctly fails it, and two null families of my own reproduce the Section
    B-prime direction with one reproducing its number exactly. The sharpest
    objection to the headline - that X_null's zero dispersion is an artifact of
    matrix-free evaluation - I opened myself and then refuted by measurement.
    THE VERDICT IS NOT `incomplete` because nothing required is missing and no
    measurement is unverifiable; it is not `failed` because no number, count,
    control or outcome row is wrong. The eight findings are all in report TEXT,
    labelling or provenance, and three of them - F-1's false 6-to-31 range, F-5's
    unsupported "different from the reviewer's" environment claim, and F-8's
    unargued G-NUM clause - make specific SENTENCES not citable as written, while
    F-6 changes the headline's status from new to replicated-and-extended and F-4
    reduces the count of genuinely open predictions from three to one. Those are
    corrections the ledger archive must apply to what it writes down; they are not
    grounds to refuse the receipts. Everything above is scoped to d in {20, 30,
    40, 100, 140}, the listed k and beta, q = 3329 and 8 bases, at CLAIM TIER TOY.

