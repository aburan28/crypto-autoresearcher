  - F-3 and F-2 - use three forced predictions, not four, and 0.1353 and 0.0070 in the hkz table.
  - F-7 - do not quote report_nullfam.md line 89 or results_nullfam.json line 4382 in isolation; carry the exact-null benchmark of 47 of 48 alongside the committed real count of 29 of 48 in the same sentence.

