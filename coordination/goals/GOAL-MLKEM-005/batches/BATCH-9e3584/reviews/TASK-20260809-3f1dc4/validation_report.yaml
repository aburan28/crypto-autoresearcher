    which_of_my_checks_are_arithmetic_on_the_producer_s_numbers_and_which_are_not:
      declared_because_the_task_card_requires_it: >-
        A defect living in the GENERATION of a producer's numbers rather than in
        their use is invisible to arithmetic on those numbers, so I say which
        class each check is in.
      class_A_arithmetic_on_the_producer_s_own_values: >-
        M-1, M-2, M-4 and the raw-to-summary agreement in M-5 and M-6 - these
        recompute derived quantities from the producer's retained raw inputs with
