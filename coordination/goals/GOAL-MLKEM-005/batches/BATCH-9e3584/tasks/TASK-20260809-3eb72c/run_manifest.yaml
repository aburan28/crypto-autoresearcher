      statement: 'NO target returns FALSIFYING at delta/SE <= 1.0'
      realized: '1 target does -- d140_b40 / graded_t0.0050, at delta/SE = 1.0, at both floors'
      verdict: FALSIFIED
      diagnosis: >-
        The declared consequence ("the instrument fires on nothing and is
        OVER-SENSITIVE") does NOT follow, and the report says so rather than
        letting it stand. That target's committed |Delta_bar| was already
        4.5295 SE -- 88.5% of its own |t|crit = 5.1179 -- before anything was
        injected; adding 1 SE moves |t| to 5.5295 by arithmetic unrelated to the
        instrument's sensitivity. A CONSTANT ADDITIVE injection on top of an
        already-near-critical Delta_bar cannot distinguish "fires on nothing"
        from "fires on the sum of a pre-existing near-critical quantity and a
        small offset". The other nine targets, with committed |t|/|t|crit
        between 0.012 and 0.552, do NOT fire at delta/SE <= 1.0.
      defect_owner: >-
        THIS SECTION'S OWN PRE-REGISTRATION, prereg 5.2's "SHOULD NOT catch"
        clause. Recorded as a defect of the section, NOT as a finding about the
        instrument.
      repair_pre_registered_for_a_successor_NOT_run_here: >-
        A CENTERED variant of this control, injecting into a table whose own
        Delta_bar has been subtracted off, so the rung value is the only signal
        present. Deliberately NOT run in this task: it is not in the notarized
        text, and adding an unregistered analysis to rescue a falsified
        prediction is the failure mode this batch exists to close.
    P-C2d:
      statement: 'every target with |t|crit < 8 returns FALSIFYING at delta/SE = 12 under the floor in use'
      realized: '6 of 6 at tau_rel 0.15 and 6 of 6 at tau_rel 0.025'
      verdict: HOLDS
    P-C2e:
      statement: 'the recovered SE at delta > 0 equals the committed SE to 1e-12 relative at every target; a departure IS the SE inflation AM-14(b) was written to detect'
