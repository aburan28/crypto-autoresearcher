    result: >-
      0.00645684051343375, 0.009769582776659185, 0.007683188103031379,
      0.014964430918357436 (top). 1.67 x top = 0.024990599633656917 from the full
      precision source, and 1.67 x 0.01496443 = 0.024990598100000001 from the
      prereg's own 8-dp restatement. Both round to 0.025. The two excluded N-C
