  # ==================================================================
  # 3.  RE-DERIVATION OF FORCED VALUES  --  FIRST-CLASS, NOT ARITHMETIC
  # ==================================================================
  check_classes_declared:
    GEN: >-
      re-derives a producer number from parameters, from the frozen text, or
      from a basis I built myself with my own code. A defect in the GENERATION
      of the number is visible to this class.
    USE: >-
      arithmetic on the producer's own recorded raw per-basis / per-draw values.
      Only a defect in the USE of the numbers is visible. A defect living in
      their generation is INVISIBLE to this class, and I say so where it matters.
    MINE: >-
      an object of my own construction (null, control, null family) pushed
      through the producer's own committed code or through my own reimplementation.

  metric_recomputations:
  - id: RD-1
    class: GEN
    what: the 38 pre-registered X_null values
    method: >-
      I PARSED THE 38 VALUES OUT OF THE NOTARIZED BLOB at 1aa7db53 (prereg
      section 2.6 table) and independently evaluated
      X_null = (beta/d)(1/d)(d-k)log q with my own code and my own math.log(3329).
      This path touches no producer code and no producer output.
    result: >-
      38/38 agree with the pre-registered 6-decimal table (0 mismatches) and
      38/38 agree with the producer's stored values BIT-FOR-BIT as IEEE-754
      doubles (0 mismatches). My log(3329) = 8.110427237575024 is bit-equal to
      the frozen constant.
    consequence: >-
      prereg 2.10's R-OUT-3 branch (code path fails to reproduce the closed form,
      = DEFECT IN THE INSTRUMENT) is REFUTED by an independent evaluation, not
      merely by the producer's self-check.
  - id: RD-2
    class: GEN
    what: X8 = rdet, and whether its zero dispersion is real
    method: >-
      I rebuilt all 80 frozen bases (10 lattices x 8 indices) from the FROZEN
      TEXT's specification (prereg 1.1: A from numpy default_rng([1,d,k,i]),
      B = [[I_k, A],[0, q I_{d-k}]] in exact int64) with my own code, took
      slogdet myself, and separately evaluated the closed form q^((d-k)/d) in
      50-digit decimal arithmetic.
    result: >-
      rdet is BIT-IDENTICAL across all 8 bases at every lattice in MY OWN
      computation, matching the producer's float_sd of exactly 0.0 at 38/38
      cells; my values agree with the closed form to <= 7e-15 relative; and my
      values are BIT-EQUAL to the producer's at all 304 stored per-basis entries.
    consequence: >-
      the producer's UNPLANNED finding OBS-R1 - that rdet, a member of the
      ORIGINAL frozen ten-candidate list and not planted by this batch, is itself
      parameter-determined - is independently confirmed. This is the single most
      consequential unplanned claim in the batch and it is now two-source.
  - id: RD-3
    class: GEN
    what: X_mp = rawtail, the declared MUST-PASS instrument control
    method: >-
      from my own bases, my own QR of B^T, my own log-diagonal, my own suffix
      mean minus logdet/d. I did not call any producer function.
    result: 304/304 stored per-basis values reproduce BIT-EXACTLY; max |dev| 0.000e+00
  - id: RD-4
    class: USE
    what: >-
      the lead's per-pair mean difference, between-basis sd on BOTH sides, paired
      sd, paired t with df 7, and the detection floor - per candidate, per pair,
      per beta, at BOTH normalizations, with s_X/|X| at every entry
    method: >-
      recomputed from the raw per-basis X_a / X_b arrays stored in
      results_relvar.json, using my own implementations of mean, sd(ddof=1),
      t = mean_g/(sd_g/sqrt(8)) and floor = t_crit*sd_g/sqrt(8).
    coverage: 75 G-REL2 cells (all five candidates) and 38 G-REL1 lattice entries
    result: >-
      MAX |recomputed - stored| = 0.00e+00 on EVERY statistic for EVERY candidate:
      mean_gap, sd_between_bases_k_side, sd_between_bases_mirror_side,
      sd_paired_gap, paired_t, detection_floor_on_mean_gap, mean of the
      max(|X|,s_X) criterion, mean of the |X| criterion, and mean s_X/|X|.
      0 verdict disagreements and 0 disagreements on the NORMALIZATIONS_DISAGREE
      flag.
    limitation_stated_plainly: >-
      THIS IS A [USE] CHECK. It proves the statistics were computed correctly
      FROM the recorded values. It cannot see a defect in how those values were
      generated. For rdet, rawtail and X_null that gap is closed by RD-1..RD-3
      above; for lam1n and hkz it is NOT closed by me - see limitation L-1.
  - id: RD-5
    class: GEN
    what: the two extreme G-REL entries for X_null, re-derived in closed form
    result: >-
      best REL-1 = (95-20)*100*log q / 140^2 = 3.103480 at L4, matching the stored
      3.103480; best REL-2 = 1 - k/(d-k) = 1 - 40/100 = 0.600000 at L4/L5 wherever
      X_null >= 1, matching the stored 0.600000 exactly. The smallest entry,
      0.486626 at L1/L2 beta=15, is the very value the frozen prereg 2.6 works out
      as its own REL-2 example, and it reproduces exactly. See finding F-1.
  - id: RD-6
