  # ==================================================================
  # 5.  MY OWN NULLS AND CONTROLS  [MINE]
  # ==================================================================
  validator_own_null_objects:
    why: >-
      The card requires me to build my own null wherever a producer's calibration
      is load-bearing, including my own parameter-determined observable pushed
      through the producer's own gate and code path, and my own null family for
      the Section B item. I did both. For the Section R objects I imported the
      producer's COMMITTED measure_relvar.py as a module and called its own
      rho_both(), summarize() and bit_identical(), so the code path is literally
      theirs; the objects are mine.
    O-1_my_parameter_determined_null:
      definition: V_pdnull(d,k,beta,q) = ((d-k)/d) * log q  -  beta/(2d)
      why_this_one: >-
        a DIFFERENT functional form from X_null, and deliberately chosen so that
        |V_pdnull| > s_X = 1.0 at every cell. X_null sits below the scale floor
        at 9 of its 19 REL2 cells, so the producer's null exercises the
        floor-binding regime; mine exercises the regime where the floor does not
        bind. If the finding were an artifact of the s_X = 1.0 floor, mine would
        behave differently.
      result: >-
        bit-identical across the 8 bases at 38 of 38 cells (max float sd 0.0), so
        G-VAR REFUSES it; passes G-REL2 at 19 of 19 cells and G-REL1 at 5 of 10
        lattices.
      consequence: >-
        The producer's headline is NOT specific to the producer's choice of null
        and NOT an artifact of the scale-floor regime. An observable of my
        choosing, in the other normalization regime, walks the relevance clauses
        while carrying no information about any basis.
    O-2_MY_ADVERSARIAL_FINDING_G_VAR_IS_EVADABLE:
      definition: V_evade(B,beta) = X_null(B,beta) + 1e-9 * A[0,0] / q
      what_it_is: >-
        the producer's own blind null plus a basis-dependent term of relative
        size about 1e-10, carrying no usable information about the basis.
      result: >-
        NOT bit-identical at ANY of the 38 cells (max between-basis float sd
        3.91e-10), so G-VAR ADMITS it; and it passes G-REL1 at 10 of 10 and
        G-REL2 at 19 of 19 - i.e. it walks the relevance clauses under EVERY
        aggregation rule, including the strictest.
      consequence: >-
        G-VAR AS FROZEN IS NECESSARY BUT NOT SUFFICIENT. It refuses only EXACTLY
        zero-dispersion closed forms; an additive perturbation of relative size
        1e-10 defeats it entirely. prereg 2.5 names the could-not-FIRE hazard of a
        LOOSE TOLERANCE (float noise lifting a closed form above the bar) and
        chooses bit identity to close it. The SYMMETRIC hazard of the bit test -
        an arbitrarily small deliberate or incidental basis-dependent term
        escaping refusal - is not named in the frozen text and is not addressed in
        any producer artifact.
      what_this_does_and_does_not_do: >-
        It does NOT weaken R-OUT-1: the gate is still inadmissible, because
        X_null and rdet do have exactly zero dispersion. It BOUNDS what adding
        G-VAR to the gate would repair, and it is a live objection to any
        successor that proposes G-VAR as the fix. I offer it as a finding about
        the CRITERION, not about any candidate.
    O-3_negative_control_on_my_own_check:
      definition: V_const = 42.0, a pure constant, same code path
      result: >-
        G-VAR refuses it (38 of 38 bit-identical) and G-REL FAILS it everywhere
        (REL1 0 of 10, REL2 0 of 19).
      why_i_ran_it: >-
        to show my [MINE] path can return a clean NON-PASS. Without it, "my
        objects passed the gate" would be uninterpretable. It also independently
        confirms prereg 2.5's stated reason for refusing X7 = tr(P^2) as the
        control: a constant tests only whether the gate refuses a constant, not
        whether it refuses parameter arithmetic.
    O-4_MY_OWN_SECTION_B_NULL_FAMILY:
      method: >-
        I reimplemented the carried pipeline from the frozen text (prereg 3.1)
        WITHOUT importing the producer's script - CBD_{eta=2} errors from
        seed_error(d) = 20260805 + d with N = 2^20 and chunk = 2^15, the carried
        Haar arm from seed_haar for SE_diff, R = ||Q^T e||^2/||e||^2, q_emp at
        p = 2^-10, n_draw 8, t_crit 4.2071245566046755, the same 4 cells and the
        same c grid - and changed EXACTLY ONE thing, the seed formula for the 13
        independent frame stacks:
          producer  seed_nullfam(d,beta,j,m) = 700000 + d*1000 + beta*10 + j + 100000*(m+1)
          mine      seed_val(d,beta,j,m)     = 424242 + 8191*(m+1) + 31*d + 17*beta + j
      result_my_family: >-
        n_fire by c = 0, 0, 1, 2, 11, 34, 47, 48, 48, 48, 48 over
        c = 0,1,2,3,4,6,8,12,16,24,32. Per cell at c = 6: d100_b30 8, d100_b40 9,
        d140_b30 11, d140_b40 6. n_fire at the negative control c = -6 is 0.
        Monotone non-decreasing in c. 0 degenerate steps. Mean Delta over live
        steps +1.979e-05. 87.3 s wall clock.
      the_required_sentence_in_the_required_form: >-
        On the rebuilt null family, n_fire(c = 6) is 35 of 48 for the producer and
        34 of 48 on my independently seeded family, against the committed real
        count of 29 of 48 and the Red Team's exact-null benchmark of 47 of 48.
      consequence: >-
        The Section B' verdict REPLICATES on an independently drawn family. The
        producer's FAIL branch (null at or above the quoted real count) fires on
        my family too, and the producer's own pre-registered P-B1 falsifier
        (n_fire(c=6) <= 21 of 48) does NOT fire on mine. My 34 differs from their
        35 by one step of 48, which is EXACTLY the detection floor the section
        pre-registered (2.083 percentage points), so the two are indistinguishable
        at the resolution the section declares. This is a two-source result and I
        say so.
      what_it_does_not_show: >-
        It is a null object. It carries no information about whether AM-3 has
        power against a REAL violation, in either direction. AM-3 IS NOT RETIRED
        and I do not treat this as retiring it. BATCH-a44d08 is not rescored here
        in any respect.

  # ==================================================================
  # 6.  THE ADMISSIBILITY GATE  --  STATED PLAINLY, AND SEPARATELY
  # ==================================================================
  gate_status_stated_plainly:
    question_1_is_the_gate_INADMISSIBLE_under_G_VAR:
      answer: >-
        YES, on the frozen definition of G-VAR. TWO candidates on the scored list
        hold BIT-IDENTICAL values across all 8 frozen bases at all 38 scored
        cells while satisfying every gate clause that was evaluated: X_null, which
        this batch planted for the purpose, and X8 = rdet, which it did NOT plant
        and which is a member of the ORIGINAL frozen ten-candidate list. I
        verified both zero-dispersion facts by building all 80 bases myself
        (RD-1, RD-2). Under prereg 2.5 that makes the AM-4/AM-8 gate INADMISSIBLE
        and NO ADMISSIBILITY CLAIM IS REPORTABLE FROM IT IN EITHER DIRECTION.
      how_much_of_this_is_empirical: >-
        Very little, and the producer says so first. R-OUT-1 is essentially an
        ALGEBRAIC result: X_null is a closed form in (d,k,beta,q), its gate
        passes are forced or are arithmetic on parameters, and rdet = q^((d-k)/d)
        exactly. The empirical content of Section R is P-R1 (the MUST-PASS guard,
        which had a live failure branch), P-R6 (an independent replication that
        could have disagreed) and P-R7 (which could have found no disagreement).
        report_relvar.md section 6 states this against its own interest and it is
        correct.
      caveat: see O-2 - the criterion that establishes this is itself evadable.
    question_2_did_any_candidate_pass_STATED_SEPARATELY:
      answer: >-
        Under the producer's (undeclared, see F-2) ANY-cell rule, two of five
        candidates pass both G-REL clauses: X_null and X_mp = rawtail. Under a
        MAJORITY-of-cells rule, the same two. Under an ALL-cells rule, only
        X_null. rdet passes G-REL2 at 19 of 19 cells but its REL-1 is identically
        zero by algebra and is UNTESTED, not failed; lam1n and hkz pass neither
        clause at any cell under any of the three rules.
      what_follows: >-
        NOTHING about admissibility, in either direction, because the gate that
        would confer it is inadmissible. Neither passing candidate is a research
        result: X_mp is an instrument control declared MUST-PASS in advance and
        X_null is blind. I record the two answers separately, as the card
        requires, precisely because conflating them is how "R1 is populated"
        could be misread as a finding about lattices.
    what_was_FORCED_and_is_therefore_UNTESTED:
      verified_as_forced: >-
        REL-1 for rdet and lam1n (neither takes a beta argument; difference is 0
        bit-for-bit); G-INV for rdet and X_null (determinant invariance);
        T1 for lam1n, hkz (computed through the integer Gram matrix, where
        G(BH) = BB^T identically - binding carry 8); T1 for rawtail (Gram-Schmidt
        is equivariant under an ambient isometry). The producer reports every one
        of these as UNTESTED rather than as passed, which is correct.
      three_of_five_gate_clauses_for_X_null_were_never_run: >-
        G-NUM, G-INV and G-Q are not evaluated for X_null under any code path.
        G-Q's value IS computed (0.851594860, which I re-derived) but its pass is
        algebraic. G-NUM is covered by the recorded argument in
        forced_arithmetic.X_null_all_transforms - "every transform residual is 0
        identically; X_null consumes no matrix at all" - and G-NUM is max rho_T0,
        the residual of the round trip B -> BHH^T, which is a transform in that
        family. So the argument exists and is sound; but the falsifier of P-R2 as
        frozen says "under the identical code path", and for three of the five
        clauses no code path was exercised. The report discloses this in sections
        4 and 6. I confirm the disclosure is accurate and I do not treat the
        omission as a defect.
    NOT_COMPUTED_cells_audited:
      declared: >-
        8 keys - lam1n and hkz at each of L1, L2, L4, L5 - each with the same
        structural reason: d exceeds the frozen d <= 40 reduction bound of prereg
        2.13 and NO NEW REDUCTION is permitted. Declared IN ADVANCE in the
        notarized blob.
      genuinely_structural: >-
        CONFIRMED. d = 100 and d = 140 for those four lattices, against a bound of
        40 fixed in the frozen text before any measurement. This is not a budget
        outcome and not a failure; R-OUT-11 did not fire and no cap bound.
      entered_into_no_count: >-
        CONFIRMED BY DIRECT COUNTING. For lam1n and hkz the code carries a
        "status" stub instead of a scored entry, and every count filters on the
        presence of a scored entry. Realized counts: G-VAR cells 18 (not 38),
        G-REL1 lattices scored 6 (not 10), G-REL2 cells scored 9 (not 19), with 4
        REL1 and 10 REL2 entries carrying NOT COMPUTED status. rdet, X_null and
        rawtail carry the full 38 / 10 / 19. No NOT COMPUTED cell is entered
        anywhere as a zero, a pass or a fail, and none contributes to any
        denominator.

  # ==================================================================
  # 7.  FINDINGS
  # ==================================================================
  findings:
  - id: F-1
    severity: material - a FALSE NUMERIC RANGE in the lead report's headline section;
      changes no verdict
    class: use
    where: report_relvar.md section 2
    what_the_record_claims: >-
      "X_null clears a 0.10 relevance threshold by a factor of 6 to 31, in both
      clauses, at every cell."
    what_i_measured: >-
      Over all 29 X_null G-REL entries (10 REL1 lattices + 19 REL2 cells) at the
      mean-over-8 reading the range is 0.486626 to 3.103480, i.e. a factor of
      4.87 to 31.03. TWO entries fall below 6x: 0.486626 (REL2, L1/L2, beta 15)
      = 4.87x and 0.496557 (REL2, L4/L5, beta 20) = 4.97x.
    why_it_matters_more_than_its_size: >-
      0.486626 is the exact value the FROZEN pre-registration works out at
      section 2.6 as its own REL-2 worked example. The report therefore
      contradicts a number in its own governing frozen text, in the same
      paragraph as its headline. I re-derived both the stored value and the frozen
      text's value in closed form and they agree with each other; only the
      report's prose is wrong.
    effect_on_evidence: >-
      NONE. Every one of the 29 entries still clears tau_rel = 0.10, X_null still
      passes both clauses at every scored entry, and R-OUT-1 is untouched.
    correction: the range is 4.87x to 31.03x.
  - id: F-2
    severity: material - an UNDECLARED implementation completion that selects an
      outcome row
    class: contract
    where: measure_relvar.py lines 816-819, and the counts it feeds in
      report_relvar.md sections 2, 3 and 5(ii)
    what_i_found: >-
      The producer declares ONE aggregation completion - collapsing 8 per-basis
      criterion values into a verdict - and reports three readings side by side.
      That completion is honestly disclosed AND I verified it is non-load-bearing:
      across all 117 scored entries the legacy i = 0 draw, the majority of 8, and
      the mean of 8 AGREE ON THE VERDICT at every single entry, 0 disagreements.
      But there is a SECOND, UNDECLARED aggregation: G_REL_PASS collapses ACROSS
      lattices and cells with an ANY rule - REL1 passes if at least one scored
      lattice passes, REL2 if at least one scored cell passes. That rule is not in
      the frozen text and is not listed among the implementation completions,
      and it is what selects R-OUT-4 over R-OUT-5 and produces the "2 of 5" count.
    POST_HOC_counterfactual_LABELLED_AND_UNCITABLE_AS_A_RESULT: >-
      Computed under a rule the producer did not freeze, therefore POST-HOC and
      NOT citable as a result of this batch. Under an ALL-cells rule rawtail
      (REL2 14 of 19) would fail G-REL, R-OUT-5 would fire, and prereg 2.10 would
      then suppress every G-REL verdict on every other candidate in either
      direction. Under a MAJORITY-of-cells rule rawtail passes and the reported
      outcome stands.
    my_reading: >-
      The reported R-OUT-4 is CORRECT under the frozen text's own language: P-R1
      says "PASSES both G-REL clauses at a MAJORITY of pairs" and its falsifier is
      failure "at a majority of computable pairs". REL1 10 of 10 and REL2 14 of 19
      are both majorities. So the defect is the NON-DISCLOSURE, not the verdict.
      X_null passes under all three rules (10 of 10 and 19 of 19), so the headline
      R-OUT-1 is INVARIANT to the choice.
    remedy_for_a_successor: >-
      freeze the across-cell rule explicitly, or report the verdict under all
      three rules as this report does.
  - id: F-3
    severity: minor - citation-hygiene breach of a binding carry, inherited from the
      frozen text itself
    class: use
    what_i_found: >-
      Binding carry 4 / prereg 3.2 states that "29 of 48" may not appear in any
      artifact of this batch without "47 of 48" in the same sentence. The REQUIRED
      headline sentence IS present verbatim in report_nullfam.md section 1, in
      results_nullfam.json THE_REQUIRED_SENTENCE, and in stdout.log line 87. But
      the string also appears at THREE places without the benchmark in the same
      sentence: report_nullfam.md line 37 (a code block), report_nullfam.md line
      89 (the P-B1 table row), and results_nullfam.json line 4382 (the P-B1
      statement).
    the_part_that_is_not_the_producers_fault: >-
      All three restate prereg section 3.4's P-B1 bullet, and THE FROZEN TEXT
      ITSELF puts "at or above 29 of 48" in one sentence and "47 of 48" in the
      next. The frozen document is internally inconsistent with its own section
      3.2. I record this because a successor asked to enforce the carry needs to
      know the carry is unsatisfiable while quoting P-B1 verbatim.
    effect_on_evidence: NONE. No number, threshold or verdict depends on it.
    also_checked_and_CLEARED: >-
      "CONSISTENT", "the obstruction is relocated" and "AM4-OBS-1" occur ONLY
      inside verbatim restatements of their own prohibitions - I read every hit.
      The "3.91" hits in results_nullfam.json line 3845 and results_c2.json line
      473 are unrelated statistic values (3.9167..., 3.9126...), NOT citations of
      the detection floor; I checked rather than flagging them. C1's genuine use
