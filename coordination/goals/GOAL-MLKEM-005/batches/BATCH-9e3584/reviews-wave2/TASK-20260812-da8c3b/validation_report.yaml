      C1 report as required.
  - id: RD-8
    class: GEN
    what: the whole Section C1 scoring table, rebuilt from the committed raw 8x4 Delta tables
    method: >-
      my own two-way random-effects decomposition (MS_S, MS_P, MS_res,
      Satterthwaite nu_eff, negative-variance-component fallback to residual df
      21), my own scipy t quantile at alpha_pair = 0.10/11, my own SE_naive.
    result: >-
      All ten rows of the C1 report table reproduce: |t|/|t|crit, relative
      difference, detection floor and SE_2way/SE_naive to the printed precision.
      My counts: 0 FALSIFYING at tau_rel 0.15, 0 FALSIFYING at 0.025, 1 target in
      the WIDENED suggestive band (d140_b40/graded_t0.0050), 4 targets with
      SE_2way/SE_naive < 1 (0.3635, 0.8495, 0.9651, 0.8397), 4 floors below 0.15
      and 0 below 0.025. Every one matches the producer.
    additional_check_the_producer_claimed_and_i_verified_independently: >-
      C1 claims it reproduces the COMMITTED BATCH-cbe023 scoring to 0.0 relative
      deviation. I checked that claim against the committed scoring block itself,
      with my own decomposition: max relative deviation 0.000e+00 across
