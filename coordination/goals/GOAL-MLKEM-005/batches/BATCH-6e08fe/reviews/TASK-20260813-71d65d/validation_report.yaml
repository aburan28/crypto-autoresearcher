        invocation this validator made.
    - id: AC-14
      check: no path inside a folded YAML scalar in run_manifest.yaml (artifact-policy carry from BATCH-fbb639's F-2)
      method: manual read of run_manifest.yaml
      result: PASS
      detail: >-
        No repository-relative path appears inside a `>` folded scalar in the lead's
        run_manifest.yaml (the one place a path-like string appears in a folded block --
        the git.note field -- contains no path, unlike BATCH-fbb639's F-2 defect).

  # ==================================================================
  # 3. METRIC RECOMPUTATIONS
  # ==================================================================
  metric_recomputations:
    - id: MR-1
      metric: lam1n' at every matched basis, L7 and L9 (16 of 16 bases this validator's budget reached)
      method: >-
        THIRD, independently-implemented route (probe_indep_reimpl.py): QR-recompute-per-
        LLL-swap Gram-Schmidt (not incremental mu bookkeeping), iterative worklist
        enumeration with a different offset-visiting order (not the lead's recursive
        zig-zag). No import of measure_route_reimpl.py or any barred-lineage function.
      result: >-
        L7: all 8 bases exact, abs_diff 0.0 to 2.220e-15 (full float64 precision).
        L9: all 8 bases exact at 6-decimal display precision (one invocation) and 6 of 8
        bases confirmed again at full float64 precision (0.0 to 2.665e-15) in a second,
        higher-precision-printing invocation of the same probe's functions.
        See probes/probe_indep_reimpl_summary.json for the full, honestly-labelled
        per-basis table, including exactly which numbers came from which of the two
        invocations.
      matches_lead: >-
        YES, at the same order of magnitude the lead itself reported (D_route' 2.220e-15
        to 9.992e-15 across the 6 lam1n cells). This is independent confirmation of
        T-INDVERIFY-CONFIRMED's factual basis for lam1n at L7/L9, computed via a route
        this validator built without consulting the lead's code.
    - id: MR-2
      metric: lam1n' at L11 (d=40)
      method: same probe, same functions
      result: >-
        NOT COMPLETED. 1 of 8 bases attempted; this validator's own enumeration function
        checks its timeout only once every 300000 nodes (a coarser granularity than
        intended), causing real overshoot past the nominal 45s per-basis cap (observed:
        532.62s before the check fired) at d=40's larger search tree. This is an
        INFRASTRUCTURE LIMITATION of this validation probe specifically, disclosed
        honestly rather than silently omitted or converted into a false confirmation.
      matches_lead: NOT INDEPENDENTLY CONFIRMED. See limitations L-1.
    - id: MR-3
      metric: D_route' / VERDICT' at every one of the 12 covered cells
      method: >-
        Re-derived from PREREG-3 3.3's frozen formula, applied to route_p (read directly
        from results_relvar.json) and this validator's own route_i_prime values, at the
        cells this validator's own budget reached (L7/L9, 12 lam1n+hkz sub-checks
        combined with the pattern-correlation analysis of the LEAD's own hkz numbers for
        cells this validator did not itself re-run the reduction for).
      result: >-
        lam1n cells: this validator's own recomputed D_route' at L7/L9 matches the lead's
        reported values at the same order of magnitude (both are measuring the SAME
        algorithm-independent quantity, lambda_1, so near-exact agreement between three
        implementations -- lead's, this validator's, and route_p's own HKZ pipeline -- is
        the EXPECTED and CORRECT behavior, not a red flag; see MINE-3 for why this is not
        vacuous). hkz cells: this validator did NOT re-run an independent reduction/
        enumeration to recompute D_route' itself at every hkz cell (would require the
        same LLL-quality-vs-HKZ-quality apples-to-oranges comparison the lead already
        performed and flagged); instead this validator (a) independently re-derived the
        hkz D_route' PATTERN from the lead's own already-committed per-basis numbers
        (probe_pattern_correlation.py, zero new reduction) and (b) built a genuinely new
        control probe (probe_reduction_quality.py) to test whether reduction quality
        alone can account for the hkz gap -- see section 6.
    - id: MR-4
      metric: aggregate ALL-SURVIVE/SOME-ARTIFACT and termination branch
      method: read off from R_IV_OUT_3_aggregate and R_IV_OUT_4_termination_branch, independently checked against PREREG-4 2.6's precedence text
      result: >-
        SOME-ARTIFACT = True (6 hkz cells all DOES NOT EXCEED), |COVERED|=12<18, correctly
        firing T-INDVERIFY-ARTIFACT-PARTIAL under PREREG-4 2.6's stated precedence
        (SOME-ARTIFACT dominates ALL-SURVIVE whenever both could be read from the data,
        which is exactly this case: lam1n's 6 covered cells independently satisfy
        ALL-SURVIVE among themselves). The lead's per-cell application of the "reports
        BOTH" rule (lam1n cells under T-INDVERIFY-CONFIRMED's license, hkz cells under
        T-INDVERIFY-ARTIFACT's license) is the CORRECT reading of PREREG-4 2.6's own text,
        confirmed by this validator's independent re-reading of that clause. See section 4.

  # ==================================================================
  # 4. TERMINATION BRANCH -- READ CORRECTLY? (asked to be answered separately, in aggregate AND per-cell)
  # ==================================================================
  termination_branch_reading:
    aggregate_reading: >-
      CORRECT. COVERED=12 (non-empty) rules out T-INDVERIFY-NODATA. SOME-ARTIFACT holds
      (at least one covered cell, in fact all 6 hkz covered cells, VERDICT'=DOES NOT
      EXCEED), which under PREREG-4 2.6's stated precedence ("SOME-ARTIFACT takes
      precedence over ALL-SURVIVE whenever both could otherwise be read from the same
      data") correctly fires T-INDVERIFY-ARTIFACT rather than T-INDVERIFY-CONFIRMED as
      the AGGREGATE branch label. |COVERED|=12<18 correctly triggers the -PARTIAL suffix.
      T-INDVERIFY-ARTIFACT-PARTIAL is the CORRECT aggregate branch.
    per_cell_reading: >-
      CORRECT, and moreover REQUIRED by PREREG-4 2.6's own explicit per-cell rule, quoted
      there: "A batch that fires T-INDVERIFY-ARTIFACT at some cells and would
      independently have fired T-INDVERIFY-CONFIRMED at others reports BOTH." This
      validator re-checked this rule's application independently: the 6 lam1n covered
      cells, considered alone, show VERDICT'=EXCEEDS at every one with D_route' at machine
      epsilon (1.3e-15 to 1.0e-14) -- this IS what T-INDVERIFY-CONFIRMED would fire on if
      lam1n were the only candidate, so citing BATCH-fbb639's EXCEEDS verdicts WITHOUT the
      F-1/RT-1 qualification is licensed for exactly these 6 cells. The 6 hkz covered
      cells, considered alone, show VERDICT'=DOES NOT EXCEED at every one -- this IS what
      T-INDVERIFY-ARTIFACT fires on, licensing (per PREREG-4 2.6/2.8) a methodological-
      artifact flag on exactly these 6 cells' BATCH-fbb639 EXCEEDS verdicts. The lead's
      report states this per-cell split explicitly and correctly (report_route_reimpl.md,
      "Termination branch" section). This validator finds NO misapplication of the
      precedence rule, the -PARTIAL suffix rule, or the per-cell "reports BOTH" rule.
    revisit_condition_2_8: >-
      Stated, not silently absorbed: the lead's report names the 6 hkz cells explicitly
      as the set requiring a superseding methodological-unsupported flag
      (flagged_cells_for_revisit_condition_2_8 in results_route_reimpl.json lists exactly
      the 6 hkz DOES-NOT-EXCEED cells). Confirmed correct by this validator's own read.

  # ==================================================================
  # 5. INDEPENDENCE RULING -- BUILT NOT TRUSTED
  # ==================================================================
  objection_rulings:
    - id: OR-1
      objection_tested: "Is ROUTE-I' genuinely non-code-shared? (primary target of this task)"
      method: >-
        Direct line-by-line body comparison of measure_route_reimpl.py's
        lll_reduce/enumerate_svp against hkz_profile in measure_am4.py, measure_relvar.py
        and replicate_l7l8.py (BATCH-4ed139's copy), plus grep for barred imports/opens.
        probe_code_independence_diff.sh, full output in
        probe_code_independence_diff_output.txt.
      finding: >-
        THE REDUCTION/ENUMERATION STEP (the substantive part -- the step that actually
        determines every reported number): GENUINELY INDEPENDENT. hkz_profile in all
        three barred sources is a verbatim-shared (each file's own docstring says so)
        fpylll-based pipeline: `from fpylll import IntegerMatrix, GSO, LLL, BKZ,
        Enumeration, EnumerationError`, one BKZ pass at block_size=d via BKZReduction,
        explicit HKZ sweeps via Mg.get_r/Enumeration(Mg).enumerate, and an independent
        per-index verification enumeration. The lead's lll_reduce/enumerate_svp are
        textbook floating-point LLL with incremental Gram-Schmidt bookkeeping and a
        from-scratch recursive Schnorr-Euchner enumeration, using only numpy dot products,
        with `import fpylll` appearing exactly once, inside a try/except purely to CHECK
        (and report as unavailable) whether the library exists -- never called for any
        computation. No import of measure_am4.py/measure_relvar.py/replicate_l7l8.py or
        any function from them appears anywhere. results_l7l8.json/results_am4.json are
        never opened. This is not a renamed wrapper around the same kernel; it is a
        different algorithm, a different library dependency (in fact, no library
        dependency), and a different code structure end to end.
      finding_continued_the_make_A_build_basis_nuance: >-
        THE BASIS-CONSTRUCTION HELPER (make_A_indep/build_basis_indep): STRUCTURALLY
        IDENTICAL to make_A/build_basis in the barred lineage -- line for line, differing
        only in the function/variable names (probe_code_independence_diff_output.txt
        section 6, both bodies printed side by side). PREREG-4 2.2(3) explicitly and
        unambiguously licenses reconstructing "the SAME numeric matrix A" from the
        published seed formula as NOT code-sharing. This validator judges that the further
        step -- assembling A into the block matrix B=[[I_k,A],[0,qI_{d-k}]] -- is properly
        read as covered by the SAME license, for three reasons stated so a reader can
        check them rather than trust this validator's prose: (i) this assembly is a
        DETERMINISTIC, ZERO-DEGREES-OF-FREEDOM function of A and the lattice's own public
        definition -- there is no algorithmic CHOICE space here the way there is in a
        reduction algorithm (LLL vs BKZ vs enumeration strategy); any two independent
        implementers building "the q-ary lattice basis for A" in numpy would write
        functionally identical code; (ii) PREREG-4 2.2(3)'s own final sentence -- "What
        must be independent is the CODE PATH that turns that instance into a REDUCED
        basis and extracts the observable, not the numeric input" -- names the REDUCED
        basis and the OBSERVABLE EXTRACTION as the protected surface, and the reduction
        step is where this validator finds genuine, verified independence; (iii) treating
        the identical B-assembly as a violation would make PREREG-4's own construction
        UNSATISFIABLE by design, since every "route" in this corpus, including ROUTE-P,
        necessarily reduces the SAME numeric basis for the comparison to test anything
        at all. This validator does NOT treat MINE-4 as a CONSTRAINT VIOLATION, but does
        NOT silently pass over it either: PREREG-4 2.2 point 1's literal text ("(a) turns
        the frozen instance matrix A into a basis object ready for reduction ... is NOT
        copied") is in tension with point 3's narrower "numeric matrix A" carve-out, and a
        stricter reader could reasonably reach a different conclusion. This gap in
        PREREG-4's own drafting is named here as a finding (F-1) for a future
        pre-registration to close explicitly, not resolved unilaterally by this report.
      verdict: >-
        PASS on the substantive independence requirement (reduction/enumeration).
        QUALIFIED-PASS, WITH THE GAP NAMED, on the basis-construction helper. This
        validator's OWN verdict AGREES with the lead's self-declaration on substance and
        does not disagree with it in a way this task's completion gate would classify as
        a CRITICAL FINDING (the lead's own declaration already discloses the identical
        block-structure choice and its own justification for it, prominently, before any
        D_route' number -- it is not hidden, merely argued rather than settled).
    - id: OR-2
      objection_tested: "Was ROUTE-P correctly restricted to results_relvar.json's own G_REL1 array, with results_l7l8.json/results_am4.json never pulled in anywhere?"
      method: grep across the committed script and results JSON for both filenames and for every open() call
      finding: >-
        CONFIRMED. Neither filename is ever opened by measure_route_reimpl.py.
        results_c3lane.json IS read (out of band, by the executor agent's own shell, for
        the sha256 recorded in run_manifest.yaml's input_shas -- not by the script, and
        never as a ROUTE-P source; this validator independently recomputed that hash from
        the committed file and it matches). RESULTS_C3LANE_PATH is defined in the script
        but never opened -- dead code, harmless, noted for completeness.
      verdict: PASS.

  # ==================================================================
  # 6. THE CRUX -- DOES HKZ'S DISAGREEMENT MEAN "CODE-SHARING ARTIFACT" OR
  #    "LOWER-QUALITY INDEPENDENT ROUTE"? INVESTIGATED DIRECTLY, AS INSTRUCTED.
  # ==================================================================
  the_crux_reduction_quality_vs_code_sharing:
    question_restated: >-
      PREREG-4 2.6's frozen text, quoting DEC-20260813-28d7b2's own next_actions
      verbatim, names T-INDVERIFY-ARTIFACT's meaning as "a methodological artifact of
      CODE-SHARING." The lead's own report already flags, honestly and prominently, that
      its ROUTE-I' uses LLL(delta=0.99)-only reduction for hkz' (infrastructure necessity:
      no fpylll or comparable library available), compared against ROUTE-P's genuinely
      HKZ-quality pipeline -- and states it "cannot and does not distinguish" code-sharing
      from reduction-quality as the cause. This validator's task is to investigate this
      distinction directly rather than accept either reading by default.
    sub_question_1_theoretical_empirical_bound: >-
      This validator built probe_reduction_quality.py: for each tail index j in a beta
      window, compute lambda_1(pi_j(L)) -- the EXACT minimum of the trailing PROJECTED
      lattice, via enumeration on the LLL basis's OWN existing Gram-Schmidt submatrix (no
      basis modification, no rank-preservation risk -- a rigorous LOWER BOUND on what any
      reduction sharing the same LLL-determined head/subspace decomposition could achieve
      in the tail). RESULT (7 of 9 planned bases completed, L7 4/4 + L9 3/3, L11 not
      completed within this probe's own budget -- see limitations L-3): this specific
      mechanism explains, on average, 0.35% of the LLL-vs-route_p gap, and in 9 of 14
      sub-cases makes the gap WORSE, not better (probes/probe_reduction_quality_summary.json).
      This is a genuine, measured, HYPOTHESIS-DISCONFIRMING result for the naive "any
      local tail-strengthening converges toward route_p" mechanism -- reported as
      measured, not argued away (see MINE-3). It does NOT mean reduction quality is
      irrelevant; it means the SPECIFIC mechanism this probe tested (tail-only local
      improvement, head/subspace fixed) is not the right one. A more specific, INTERNALLY
      CONSISTENT account, offered as theory and NOT independently verified by a further
      targeted experiment within this validator's own budget: HKZ reduction concentrates
      its gain at achieving the TRUE global minimum at the head (b*_0=lambda_1 exactly,
      often much shorter for a q-ary lattice than an LLL-quality profile predicts at index
      0), and because the geometric mean of ALL Gram-Schmidt norms is a
      reduction-invariant (fixed at exp(logdet/d) regardless of reduction quality), a
      much-shorter head under HKZ mechanically forces the TAIL vectors to be
      correspondingly LARGER on average than a more evenly-distributed LLL profile gives
      -- a documented qualitative property of HKZ/large-block-BKZ profiles on structured
      (q-ary) lattices. This account is CONSISTENT WITH but not independently confirmed
      beyond the pattern evidence in sub_question_2 below.
    sub_question_2_pattern_distinguishing_the_two_hypotheses_from_data_already_present: >-
      probe_pattern_correlation.py re-analyzes ONLY the lead's own already-committed
      per-basis numbers (results_route_reimpl.json, read directly, zero new reduction).
      THREE independent signatures, all pointing the same direction:
      (a) SIGN CONSISTENCY: across all 48 hkz basis-comparisons (6 cells x 8 bases),
      route_i_prime (LLL) is MORE NEGATIVE than route_p (HKZ) in 41/48 (85.4%) -- a
      strongly one-directional pattern, not noise scattered around zero.
      (b) DIMENSION SCALING AT MATCHED beta/d: at beta_lo (beta/d~0.25-0.33), D_route'
      grows 0.0586 (d=20) -> 0.1076 (d=30) -> 0.2235 (d=40); at beta_hi (beta/d=0.73-0.75),
      D_route' grows 0.0153 (d=20) -> 0.0499 (d=30) -> 0.0964 (d=40) -- roughly geometric
      growth with dimension, in BOTH beta classes.
      (c) BETA-WINDOW-SIZE EFFECT WITHIN EACH LATTICE: D_route' consistently SHRINKS as
      the averaging window (beta) widens at fixed d (L7: 0.0586->0.0153; L9:
      0.1076->0.0499; L11: 0.2235->0.0964 -- all roughly 2.2x-3.8x smaller at beta_hi than
      beta_lo).
      CONTRAST WITH WHAT A CODE-SHARING ARTIFACT LOOKS LIKE IN THIS EXACT GOAL: this
      goal's own prior instance of a genuine code-sharing artifact (F-1/RT-1,
      EV-MLKEM-965a37) produced D_route = EXACTLY 0.0 at every one of 18 covered cells --
      same code, same answer, no scaling behavior of any kind, because it was RUNNING THE
      SAME DETERMINISTIC PIPELINE TWICE. A code-sharing artifact does not have a natural
      reason to grow smoothly and geometrically with lattice dimension, or to shrink as
      the observable's own averaging window widens; a REDUCTION-QUALITY gap has an
      obvious reason to do exactly both (LLL's approximation quality relative to
      HKZ/large-block-BKZ degrades with dimension in this size range, and averaging over
      more indices dilutes a defect concentrated in part of the profile). This pattern is
      the single strongest piece of evidence in this validator's entire investigation, and
      it required ZERO new reduction to obtain.
    sub_question_3_lam1n_re_derivation: >-
      See metric_recomputations MR-1/MR-2 and section 0 above: independently confirmed at
      L7 (8/8) and L9 (8/8) via a third implementation, matching route_p to 0-2.665e-15,
      the same order of magnitude the lead reported. L11 not independently reached within
      this validator's budget (limitation L-1). This corroborates that the lam1n' pipeline
      genuinely measures an algorithm-independent invariant (as PREREG-4 2.2 point 3
      argues), reinforcing by contrast that hkz' -- which does NOT show this
      algorithm-independence property, being a raw GSO-tail statistic that is intrinsically
      reduction-quality-dependent -- was never expected to behave the same way, and its
      large disagreement is therefore NOT evidence of the same KIND as lam1n's would be if
      it had disagreed.
    conclusion_on_the_crux: >-
      The evidence assembled here (sign consistency, dimension scaling, beta-window
      shrinkage -- all from data the lead already computed and committed, reproduced
      independently by this validator; plus this validator's own negative floor-mechanism
      result, which rules out one naive account and points toward a more specific,
      theoretically-grounded one; plus the independently-confirmed absence of any code
      sharing in the reduction/enumeration step) SUBSTANTIALLY FAVORS the
      reduction-quality-confound explanation over the code-sharing explanation PREREG-4's
      frozen prose names by default for T-INDVERIFY-ARTIFACT. This validator does NOT
      claim to have PROVEN reduction-quality is the sole or complete explanation -- a
      quality-matched independent HKZ route (fpylll, or a from-scratch full HKZ
      implementation with substantially more budget than this task or the lead's task
      had) was not built by either this validator or the lead, and remains the one
      experiment that would settle the question directly rather than by pattern
      inference. The correct reading is: THE HKZ ARTIFACT-FLAG SHOULD BE QUALIFIED, not
      left to travel under PREREG-4's default "code-sharing" attribution unmodified, and
      not treated as if fully resolved in the reduction-quality direction either.
    proposed_precise_wording_for_the_ledger_record: >-
      "For the 6 hkz covered cells (L7_b5, L7_b15, L9_b7, L9_b22, L11_b10, L11_b30),
      T-INDVERIFY-ARTIFACT fires correctly and BATCH-fbb639's EXCEEDS verdicts at these
      cells are flagged methodologically unsupported per PREREG-4 2.8. Independent
      validation (VAL-20260813-71d65d) finds NO evidence of code-sharing in the
      reduction/enumeration step (verified independent: from-scratch LLL + Schnorr-Euchner
      vs the barred lineage's fpylll BKZ+HKZ+Enumeration pipeline) and instead finds
      strong, pattern-based evidence (sign consistency in 41/48 basis-comparisons,
      geometric growth of D_route' with lattice dimension at matched beta/d, and shrinkage
      of D_route' as the averaging window widens -- none of which a same-code artifact
      would produce, contrasted directly against this goal's own F-1/RT-1 precedent, which
      produced EXACTLY ZERO disagreement) that the observed D_route' scale (0.015-0.223) is
      substantially attributable to a REDUCTION-QUALITY MISMATCH: ROUTE-I' used
      LLL(delta=0.99)-only reduction for hkz' (fpylll and every alternative
      lattice-reduction library were unavailable in the run environment, confirmed
      independently) compared against ROUTE-P's genuinely HKZ-quality (BKZ block=d +
      explicit HKZ sweeps + independent enumeration verification) pipeline -- i.e., two
      computations of DIFFERENT QUALITY, not merely different CODE, were compared. This
      measurement therefore does NOT positively confirm PREREG-4 2.6's default
      code-sharing attribution for T-INDVERIFY-ARTIFACT at these 6 cells, and should be
      read as A REDUCTION-QUALITY-CONFOUNDED ARTIFACT FINDING, not a code-sharing finding.
      It also does not rule code-sharing out completely, since a quality-matched
      independent HKZ route was not built by either this batch or its validation. The
      hkz EXCEEDS flag from BATCH-fbb639 remains methodologically unsupported and
      uncitable without qualification (T-INDVERIFY-ARTIFACT's license is unchanged), but
      any successor citing WHY should cite reduction-quality mismatch, not code-sharing,
      as the validated, better-supported account, and the natural next measurement is a
      quality-matched rerun once fpylll (or an equivalent library) is available in the run
      environment -- not a rerun of this same LLL-only route at a larger sample."

  # ==================================================================
  # 7. THE L11 TIMEOUT-EXCLUSION CALL
  # ==================================================================
  l11_timeout_exclusion_ruling:
    question: "Was excluding the 3 timed-out L11 bases (rather than using their LLL upper bound as an approximate value) the correct call under PREREG-4's own rules?"
    finding: >-
      YES. PREREG-4 2.2(2)(iii) requires "the EXACT shortest nonzero lattice vector", and
      point 3's entire justification for treating lam1n' as "mathematically the identical
      quantity" to ROUTE-P's own value rests on the vector being EXACT ("an exact
      independently-found lambda_1 is mathematically the identical quantity... regardless
      of which algorithm found it"). A basis whose enumeration timed out provides only an
      UNVERIFIED UPPER BOUND (the LLL vector's own norm), which is not guaranteed to equal
      the true lambda_1 -- using it as if exact would silently break the exact-equality
      justification the whole lam1n' comparison depends on, and could manufacture either a
      spuriously small D_route' (if the upper bound happens to be close) or a spuriously
      large one (if not), neither traceable to a genuine algorithmic property. Exclusion
      matches PREREG-4 3.2's general spirit (distinguish UNCOVERED/NOT-COMPUTED from a
      computed value, never merge or default) even though 3.2 speaks to cell-level, not
      basis-level, budget exhaustion; extending that discipline to the basis level is the
      correct, conservative reading. hkz' correctly did NOT need this exclusion, since it
      is computed from the LLL-reduced GSO directly and does not depend on exact SVP
      completion -- confirmed structurally correct in AC-11.
    one_precision_note_not_a_defect: >-
      The lead's implementation-choice declaration states a timed-out basis is "EXPLICITLY
      FLAGGED per basis as 'LLL_UPPER_BOUND (exact enumeration timed out)'" -- that exact
      string does not appear anywhere in the committed results_route_reimpl.json; the
      ACTUAL mechanism is a boolean `svp_exact: false` field plus `status: "ok"`, which
      this validator confirmed is used correctly and consistently to drive the exclusion
      (AC-11). This is a prose-vs-implementation precision gap (the declared FUNCTIONAL
      BEHAVIOR is correct and verified; the specific STRING claimed to appear does not
      literally appear), not a constraint violation, and is recorded as finding F-2.

  # ==================================================================
  # 8. HEURISTIC-VALIDATION, COST-MODEL AND PROOF-ARCHITECTURE CHECKS
  # ==================================================================
  heuristic_validation_checks:
    - id: HV-1
      applicable: false
      reason: >-
        no Dickman-de Bruijn-style distributional prediction, sampling procedure or
        correspondence substitution in the exemplar sense of docs/target-result-profile.md.
        This batch reruns a frozen deterministic comparison formula (PREREG-3 3.3) against
