        description of HOW is imprecise; the WHAT (correct exclusion) is not.
      does_not_change: any number or verdict.
    - id: F-3
      severity: MINOR, INFORMATIONAL
      statement: >-
        run_manifest.yaml's input_shas entry for results_c3lane.json was necessarily
        computed OUT OF BAND by the executor agent (via a separate shell command), not by
