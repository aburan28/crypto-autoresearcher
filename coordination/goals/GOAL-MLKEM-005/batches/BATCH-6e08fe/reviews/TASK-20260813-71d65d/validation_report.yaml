      does_not_change: the substantive claim, which is true and independently confirmed.
    - id: F-4
      severity: CENTRAL, ALREADY TREATED IN FULL IN SECTION 6
      statement: >-
        The hkz T-INDVERIFY-ARTIFACT-PARTIAL finding, correctly read per PREREG-4's own
        frozen precedence, is nonetheless attributed by that same frozen text's default
        prose to "a methodological artifact of code-sharing" -- a specific causal claim
        this validator's own investigation finds SUBSTANTIALLY BETTER EXPLAINED by a
        reduction-quality mismatch than by code-sharing (which was independently checked
        and NOT found). See section 6 for the full treatment and proposed precise ledger
        wording.

