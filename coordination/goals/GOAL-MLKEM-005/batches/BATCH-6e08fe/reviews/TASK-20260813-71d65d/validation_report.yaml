        make_A_indep/build_basis_indep are line-for-line structurally identical to the
        barred lineage's make_A/build_basis. This validator judges the extension
        defensible (see OR-1) but names the textual gap rather than silently resolving it,
        since a future, stricter pre-registration in this lineage should close it
        explicitly (e.g. by naming the block-matrix assembly step, not only the matrix A
        itself, as licensed).
      does_not_change: >-
        No number, verdict, or termination-branch reading in this batch. The reduction/
        enumeration step -- the part that actually determines every reported D_route'
        value -- is independently verified genuinely non-code-shared regardless of how
        this drafting gap is resolved.
    - id: F-2
      severity: MINOR, PROSE-VS-IMPLEMENTATION PRECISION GAP
      statement: >-
        The lead's implementation-choice declaration states a timed-out L11 basis is
        "EXPLICITLY FLAGGED per basis as 'LLL_UPPER_BOUND (exact enumeration timed out)'"
        -- that literal string does not appear anywhere in the committed
        results_route_reimpl.json. The actual mechanism (`svp_exact: false` +
        `status: "ok"`) is verified to produce the CORRECT functional behavior (AC-11):
