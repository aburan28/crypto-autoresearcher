validation_report:
  id: VAL-20260813-71d65d
  task_id: TASK-20260813-71d65d
  goal_id: GOAL-MLKEM-005
  batch_id: BATCH-6e08fe
  role: validator
  claim_tier: toy
  claim_tier_statement: >-
    CLAIM TIER TOY, UNCONDITIONALLY. Nothing in this report bears on ML-KEM security, on
    any FIPS 203 parameter set, on any attack cost or on any cost model, and no number
    here transports to beta = 606, to d = 1420 or to any parameter set by extrapolation,
    analogy or any other route. This report verifies EVIDENCE INTEGRITY and investigates
    a specific interpretive ambiguity in the lead's own reported result. It does not
    decide what the evidence means for any hypothesis, and it authorizes no promotion.
  run_ids: []
  run_ids_note: >-
    No RUN-* identifier is minted or declared anywhere in this batch's committed
    artifacts (checked by grep across run_manifest.yaml and results_route_reimpl.json;
    none found). Matches this goal's established pattern for tasks not requiring one.

  reviewed_snapshot:
    notarization_commit: 1e1acf08b151dd31b4d41b8afd287d261adce1e5
    notarization_parent: d2ee472a4913e2b0b4a71d26ac481ca7c3624c88
    lead_producer_snapshot_commit: 6ad64048dfee5b87b9df7ebcd9d7f7b80baf44cb
    lead_producer_snapshot_parent: dcfa099d4309049bf14e0f22cfaa753e8fbe85c3
    prereg_sha256: ff577564dcdbb45b1b19885297ffc512888f9442dc99f2057fdf7f86f63fbbda
    head_at_review: 9ee2cbd70277a2ea1ec941678b8b4867a0227ad4
    branch_at_review: claude/launch-research-harness-1ns6z3
    both_commits_confirmed_ancestors_of_HEAD: true
    refusal_note: >-
      Both commits named in the task envelope were read as committed history via git
      plumbing (git diff --name-status, git ls-tree, git show, git merge-base
      --is-ancestor -- see probes/probe_checks.sh sections A-E and its output). I did not
      validate any working-tree-only producer receipt. Had either commit turned out
      unreachable from HEAD, or had prereg.md been present at the notarizing commit's
      parent, or had any producer artifact been present at the lead commit's parent, this
      report would say INVALID rather than proceed. None of those conditions held; see
      probe_checks_output.txt sections A-E for the raw git plumbing output.

  # ==================================================================
  # 0. HEADLINE
  # ==================================================================
  headline:
    change_set_equality: >-
      BOTH archives verify at full change-set equality with 0 extra and 0 missing,
      confirmed by this validator's own git plumbing, not taken on the Coordinator's or
      producer's word (per this batch's explicit instruction that a Validator in this
      goal has twice found Coordinator git claims wrong). Notarization: 3/3 declared paths,
      all additions, prereg.md absent at the parent (only task_card.md present). Lead:
      8/8 declared paths, all additions, zero producer artifacts at the parent (only
      task_card.md present). All 11 committed path hashes recomputed by this validator
      from `git show <commit>:<path> | sha256sum` match the queue's declared
      `path_sha256` values exactly (probe_checks_output.txt section E).
    what_reproduced: >-
      RC-3 is carried verbatim in substance (the only difference from PREREG-4 section 1's
      blockquote is markdown code-backtick formatting, confirmed by direct string
      comparison after stripping backticks/bold markers -- probe_checks_output.txt section
      F) and its two 0.0 true_abs_deviation values are independently re-confirmed against
      probe_coverage_beta_mismatch_output.json directly (section G). The obligation-0
      coverage table (12/18 covered, all 6 middle-beta cells genuinely UNCOVERED) is
      independently RE-DERIVED by this validator from results_relvar.json's own G_REL1
      block, without importing the lead's coverage table, and matches the lead's reported
      12/18 exactly, cell for cell (probe_checks_output.txt section H). No reduction above
      d=40 occurred anywhere (grep-confirmed: LATTICES is the sole source of (d,k) pairs
      and is fixed at {L7:(20,6), L9:(30,9), L11:(40,12)} -- section I). results_l7l8.json
      and results_am4.json are NEVER opened by the lead's script anywhere (grep-confirmed,
      probe_code_independence_diff_output.txt sections 2-3), and the RESULTS_C3LANE_PATH
      variable the script defines is likewise never opened -- dead code, not a defect, but
      worth recording since the run_manifest.yaml's input_shas entry for results_c3lane.json
      was necessarily computed OUT OF BAND (by the executor agent directly, via a shell
      sha256sum, not by the script) rather than by the script itself; this validator
      independently recomputed that same hash from the committed file and it matches
      (e70cb2d4...).
    the_lam1n_confirmation_reproduced_independently: >-
      This validator built a THIRD, differently-structured implementation
      (probes/probe_indep_reimpl.py: full-QR-recompute-per-LLL-swap Gram-Schmidt, not
      incremental mu-matrix bookkeeping; an iterative worklist-driven enumeration with a
      different offset-visiting order, not the lead's recursive one) without importing
      measure_route_reimpl.py or any barred-lineage function. At every one of the 16 L7+L9
      bases this validator's own budget could complete (8/8 at L7 full float64 precision,
      8/8 at L9 -- 6/8 at full float64 precision, 8/8 at 6-decimal precision from an
      earlier invocation), the independently-computed lam1n' value matches route_p to
      between 0 and 2.665e-15 -- the SAME order of magnitude the lead itself reported
      (2.220e-15 to 9.992e-15). This is a genuine THIRD confirmation of
      T-INDVERIFY-CONFIRMED's factual basis for lam1n, not a re-check of the lead's own
      arithmetic. L11 (d=40) was NOT independently re-derived by this validator within
      its own probe budget (see limitations L-1); this is disclosed, not smoothed over.
    the_central_question_this_batch_exists_to_answer: >-
      See section 6 (THE CRUX) below for this validator's full, dedicated treatment of
      whether hkz's T-INDVERIFY-ARTIFACT-PARTIAL finding should be qualified by a
      reduction-quality confound. Summary: YES, it should, and this validator finds the
      confound explanation substantially better supported by the available evidence than
      the code-sharing explanation PREREG-4 section 2.6's frozen prose names by default
      for this branch -- though this validator's own probe could not fully settle the
      question (a genuinely HKZ-quality independent route was not built; fpylll remains
      unavailable in this environment too).
    one_provenance_nuance_on_the_independence_claim: >-
      make_A_indep/build_basis_indep in the lead's script are STRUCTURALLY IDENTICAL
      (line-for-line, module renaming aside) to make_A/build_basis in the barred lineage.
      PREREG-4 section 2.2(3) explicitly anticipates and licenses this for the numeric
      INSTANCE (matrix A); this validator judges the extension of that license to the
      mechanical block-matrix embedding B=[[I_k,A],[0,qI_{d-k}]] to be DEFENSIBLE but not
      literally spelled out by section 2.2(3)'s text (which names only "the SAME numeric
      matrix A", not the basis object). See section 5 (independence ruling) for the full
      reasoning and why this validator does not treat it as a CONSTRAINT VIOLATION.

  # ==================================================================
  # 1. THE ARRANGEMENT IN WHICH MY OWN CHECK COULD NOT FAIL
  #    NAMED IN BOTH DIRECTIONS, BEFORE THE RUN, AND WHY I AM NOT IN IT
  # ==================================================================
  my_own_could_not_fail_arrangements:
    - id: MINE-1
      direction: COULD-NOT-FIRE
      arrangement: >-
        If my code-independence check only grepped for exact top-level FUNCTION NAME
        matches (make_A, build_basis, hkz_profile) against the lead's script, renaming
        (make_A_indep, build_basis_indep, lll_reduce/enumerate_svp) would trivially defeat
        it and the check would ALWAYS pass regardless of whether the actual algorithm was
        copied -- exactly the loophole PREREG-4 section 2.2's "even if it calls a different
        top-level function name" clause exists to close.
      why_i_am_not_in_it: >-
        probe_code_independence_diff.sh diffs the FULL BODY of the reduction/enumeration
        functions side by side (section 5 of its output): the lead's lll_reduce/
        enumerate_svp are textbook incremental-LLL and recursive Schnorr-Euchner in pure
        numpy; the barred lineage's hkz_profile calls fpylll's IntegerMatrix/GSO.Mat/
        LLL.Reduction/BKZReduction/Enumeration directly, a C-extension-backed library call
        chain with no numpy dot-product arithmetic of its own. These are not
        renamed-but-equivalent; they are different programs computing the observable via
        different data structures and different libraries. I also positively DID find and
        report the ONE place where the lead's code IS structurally identical to the barred
        lineage (make_A_indep/build_basis_indep) rather than silently passing over it --
        see MINE-4.
    - id: MINE-2
      direction: COULD-NOT-PASS
      arrangement: >-
        If I had imported measure_route_reimpl.py's own module to get "my" ROUTE-I'
        values, or copied its JSON-path logic before writing my own coverage-table
        re-derivation, agreement with the lead's reported numbers would be guaranteed by
        construction and would prove nothing about independence.
      why_i_am_not_in_it: >-
        probe_indep_reimpl.py imports nothing from measure_route_reimpl.py (confirmed:
        no `import measure_route_reimpl`, no `from measure_route_reimpl import` anywhere
        in the probe, grep-checkable against the committed probe file itself). Its
        make_A_v2/build_basis_v2/lll_v2/enumerate_svp_v2 functions were written from
        PREREG-4's frozen formulas and this validator's own understanding of LLL/SVP
        enumeration, not by reading measure_route_reimpl.py's source first -- I DID read
        measure_route_reimpl.py (required for the independence-diff and route-p-exclusion
        checks this task also owes), so I record the honest caveat that this happened in
        the same session, mitigated by MINE-3: my numbers disagree with nothing only
        because the underlying mathematical quantity (lambda_1) is genuinely
        algorithm-independent, not because my check cannot disagree.
    - id: MINE-3
      direction: COULD-NOT-PASS (decisive evidence this one is not vacuous)
      arrangement: >-
        If my independent lam1n' recomputation had a latent bug that happened to always
        agree with SOMETHING, I would "confirm" a claim without genuinely testing it.
      why_i_am_not_in_it: >-
        This validator's OWN reduction_quality probe (a THIRD, differently-motivated
        computation using the same build_basis_v2/lll_v2 machinery) DID disagree with its
        own working hypothesis: the "tail-only projected-minimum floor" experiment
        predicted the floor should move hkz' TOWARD route_p and it did not -- in 9 of 14
        sub-cases the floor moved AWAY from route_p, explaining a mean of 0.35% of the
        LLL-vs-route_p gap (probes/probe_reduction_quality_summary.json). A probe built
        from the same code family that is capable of returning a negative, hypothesis-
        disconfirming result, and did, is not a probe that can only pass.
    - id: MINE-4
      direction: COULD-NOT-FIRE (the make_A/build_basis nuance specifically)
      arrangement: >-
        If I had treated "PREREG-4 licenses reconstructing the SAME instance from its
        public formula" as licensing ANY structural similarity whatsoever in the
        basis-construction code, I would never be able to find a violation there even if
        one existed, since every route in this corpus (by design) must produce the
        identical numeric basis to make the comparison meaningful.
      why_i_am_not_in_it: >-
        I read PREREG-4 section 2.2 point 1 literally: it bars copying "(a) [the code that]
        turns the frozen instance matrix A into a basis object ready for reduction" --
        which on its face DOES cover build_basis, not merely make_A. I report the
        line-for-line structural identity of make_A_indep/build_basis_indep to
        make_A/build_basis PLAINLY (section 5, MINE-4-continued below), rather than
        silently absorbing it into point 3's narrower "numeric instance" carve-out. I do
        not treat it as a full-weight CONSTRAINT VIOLATION, but I name the textual gap
        between what point 3 literally licenses (the matrix A) and what the lead's
        declaration claims it licenses (also the block-matrix embedding), and I give my
        own reasoning for judging the extension defensible rather than asserting it.
    - id: MINE-5
      direction: COULD-NOT-FIRE (the notarization/hash checks)
      arrangement: >-
        If I had compared declared path_sha256 values against a FRESH working-tree copy
        of the files, or trusted dispatch_queue.json's own printed hashes without
        recomputing them from the actual committed blob, a stale or fabricated hash would
        pass undetected.
      why_i_am_not_in_it: >-
        Every hash in probe_checks_output.txt section E was recomputed with
        `git show <commit-sha>:<path> | sha256sum` -- reading bytes out of the actual git
        object database at the named commit, never the working tree -- and compared
        against dispatch_queue.json's declared values by direct string equality (all 11
        matched exactly, 0 mismatches).

  # ==================================================================
  # 2. ARTIFACT CHECKS
  # ==================================================================
  artifact_checks:
    - id: AC-1
      check: notarization commit change-set equality (TASK-20260813-e24ad9)
      method: "git diff --name-status d2ee472a..1e1acf08b, run by this validator"
      result: PASS
      detail: "3 paths changed, all additions, matches declared set exactly (probe_checks_output.txt A)"
    - id: AC-2
      check: prereg.md absent at notarizing commit's parent
      method: "git ls-tree -r d2ee472a --name-only | grep TASK-20260813-cdcd88"
      result: PASS
      detail: "only task_card.md present at the parent; prereg.md and prereg_sha256.txt first appear at 1e1acf08b (probe_checks_output.txt B)"
    - id: AC-3
      check: lead producer commit change-set equality (TASK-20260813-2d6b5e)
      method: "git diff --name-status dcfa099d..6ad64048d, run by this validator"
