    - id: AC-12
      check: fpylll genuinely absent in the producer's declared environment
      method: "this validator's own environment, confirmed identical host/stack"
      result: PASS
      detail: >-
        `import fpylll` raises ModuleNotFoundError in this validator's session too (same
