      applicable: false
      reason: "no theorem, asymptotic bound, reduction or certificate family is proposed; docs/inventor-protocol.md section 8's proof_search_map is not owed by this task."

  # ==================================================================
  # 9. NULL-OBJECT / CONTROL DISCIPLINE (docs/inventor-protocol.md section 3)
  # ==================================================================
  control_checks:
    - id: CC-1
      control: "does the hkz D_route' signal decay when the parameter meant to destroy it (reduction-quality mismatch) is removed?"
      statement: >-
        The one case in this batch's own data where NO reduction-quality mismatch exists
        -- lam1n, whose exact-enumeration value is algorithm-independent by definition
        regardless of preprocessing quality -- shows D_route' at machine epsilon (1e-15
        scale), independent of dimension. The hkz statistic, which DOES depend on
        reduction quality, shows D_route' at 0.015-0.223, GROWING with dimension. This is
        the canonical decay/non-decay contrast the inventor protocol's control discipline
        asks for: lam1n (control, quality-independent) decays to noise floor; hkz
        (candidate, quality-dependent) does not, and grows with the parameter (dimension)
        that would be expected to amplify a genuine quality gap. This is reported
        explicitly because a quantity that fails to decay when it should is the canonical
        artifact tell -- here it is the EXPECTED behavior given the mechanism identified,
        not an unexplained anomaly.
      this_batch_own_null_object: >-
        This batch is not itself a "signal vs null-candidate" search (that discipline
        governs A-1/C3-lane candidate screening in this goal, e.g. AM-10 through AM-18,
        which are carried unmodified and NOT rescored by anything in this report). The
        relevant control question here is narrower and answered directly above: whether
        the OBSERVED DISAGREEMENT PATTERN looks like a quality effect or a code-sharing
        artifact, and the lam1n/hkz contrast within this SAME batch serves that role.
    - id: CC-2
      control: "reduction-quality floor probe (probe_reduction_quality.py)"
      statement: >-
        See section 6, sub_question_1. This is a genuine attempted control/calibration
        measurement, honestly reported to have FAILED to confirm its own working
        hypothesis in the specific form tested (see MINE-3) -- included here because a
        control that can fail, and did, is worth more than one that always confirms.

  # ==================================================================
  # 10. FINDINGS
  # ==================================================================
  findings:
    - id: F-1
      severity: MINOR-TO-MODERATE, A DRAFTING GAP IN PREREG-4 ITSELF, NOT A PRODUCER DEFECT
      statement: >-
        PREREG-4 section 2.2 point 1 literally bars copying "(a) [the code that] turns the
        frozen instance matrix A into a basis object ready for reduction", which on its
        face covers build_basis, while point 3 explicitly licenses only reconstructing
        "the SAME numeric matrix A" -- narrower language that does not, in so many words,
