    - id: AC-9
      check: results_l7l8.json / results_am4.json never used as a ROUTE-P source
      method: "grep for 'open(' calls and for the two filenames anywhere in the committed script and results JSON"
      result: PASS
      detail: >-
        Neither file is ever opened by measure_route_reimpl.py (probe_code_independence_diff_output.txt
        sections 2-3); results_route_reimpl.json's own
        results_l7l8_json_used_as_route_p_source/results_am4_json_used_as_route_p_source
        fields are both false, confirmed by direct grep of the committed JSON.
    - id: AC-10
      check: no reduction above d=40 anywhere
      method: "grep for LATTICES definition and every call site of lll_reduce/enumerate_svp/build_basis_indep"
      result: PASS
      detail: "LATTICES is the sole (d,k) source, fixed at {20,30,40}; all three functions are called only inside the loop that draws d,k from it (probe_checks_output.txt I)"
    - id: AC-11
      check: L11 timeout exclusion handling
      method: "read route_i_prime_per_basis_log and R_IV_OUT_2_per_cell directly"
      result: PASS
      detail: >-
        3 of 8 L11 bases (indices 1,5,6) show svp_exact=false with enum_secs pinned at
