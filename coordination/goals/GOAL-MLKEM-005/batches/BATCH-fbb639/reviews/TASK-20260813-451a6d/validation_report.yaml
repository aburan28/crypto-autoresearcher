    - id: MR-1
      name: "obligation 0 (R-C-OUT-0) -- coverage audit, re-derived from scratch"
      l7l8_l7_only_extraction: >-
        Independently extracted comparison.per_cell's 6 lam1n/hkz L7 keys, discarding the
        6 L8 keys present in the same file (hkz/L8_b5,10,15 and lam1n/L8_b5,10,15,
