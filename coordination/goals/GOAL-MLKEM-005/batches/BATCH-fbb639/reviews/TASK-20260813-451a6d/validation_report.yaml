      result: >-
        Texts equal in substance; the only residual differences after normalization are
        typographic (an em-dash "--" in the report standing in for PREREG-3's "--" long
        dash, and "section 10" vs "section10" spacing from my own extraction). Confirmed
        by a line-level unified diff in probe_rc_carry_and_artifact_policy_output.txt: no
        substantive word differs. This satisfies the completion gate's "verbatim (or by
        unambiguous restatement)" bar.
      verdict: PASS
    - id: CC-3
      name: "RC-2's substance, re-confirmed by DIRECT READ of results_a1.json (never via any report's prose)"
      method: >-
        probes/probe_rc_carry_and_artifact_policy.py loads results_a1.json independently
        and reads PREDICTION_REGISTER.items["P-A12a"].OUTCOME literally, plus counts every
        occurrence of the raw substrings "HELD" and "FALSIFIED" and attributes each to its
        own key
      result: >-
        P-A12a.OUTCOME = "FALSIFIED" (literal). "HELD" occurs exactly 3 times in the raw
        file, against P-F0Xa, P-F0Xb and P-G2 -- never against P-A12a. "FALSIFIED" occurs
        5 times, one of which is P-A12a. This independently confirms, from the primary
        artifact and not from any transcription, that the commit-message/report_a1.md
        narrative ("mis-scored HELD ... left unedited") is false against the committed
        JSON, exactly as RC-2 states.
      verdict: PASS
    - id: CC-4
      name: "null-object-style contrast -- is D_route = 0.0 plausible, or an artifact tell?"
      binding: >-
        docs/inventor-protocol.md section 3 and this task's own explicit instruction: a
        statistical signal (here, D_route = 0.0 at every covered cell) is an artifact
        until checked against a null/contrast of the same shape, and the report should
        state what the measured quantity SHOULD do as the parameter meant to destroy the
        agreement (here: genuine algorithmic independence) is present or absent.
      what_i_did: >-
        traced the provenance of the actual numerical kernel (hkz_profile, make_A,
        build_basis) that produces every lam1n/hkz value at every covered cell, across all
        three named ROUTE-P/ROUTE-I sources, by diffing function bodies line for line
        (probes/probe_shared_code_provenance.sh). Then located a CONTRAST inside the same
        corpus: rdet_T1_ambient_isometry_residual (3.865e-12), rdet_T2/T3
        (0.0, algebraically forced), and rawtail_T1_ambient_isometry_residual_beta5
        (5.809e-13) -- comparisons between a computation and a DIFFERENT, genuinely
        distinct transform of the SAME input (an ambient isometry, a permutation, a
        unimodular transform), not between two runs of THE SAME transcribed code.
      finding: >-
        the pattern in this corpus is: same code, same input, different host -> EXACTLY
        0.0 (as observed at all 18 covered cells here); different-but-related computation
        on the same input -> near-machine-epsilon but NONZERO (1e-9 to 1e-13, as observed
        elsewhere in results_relvar.json's own forced_arithmetic block, itself labelled
        "UNTESTED -- not a test that could have failed" for exactly this reason). D_route
        = 0.0 at every covered cell in THIS batch is consistent with, and fully explained
        by, the shared-code mechanism -- it is NOT independent evidence that lam1n/hkz are
        measured to bit-identical precision by two algorithmically distinct pipelines. See
        finding F-1 for the consequence.
      verdict: >-
        THE SIGNAL DOES NOT SURVIVE AS "INDEPENDENT ROUTE AGREEMENT". It survives, and is
        confirmed, as "cross-environment reproducibility of one deterministic pipeline" --
        a real and not-nothing result (this goal's own binding carries already establish
        this distinction for the L7 case: "genuinely cross-platform" NOT citable,
        "PORTABILITY result across textually distinct implementations" IS citable), but a
        substantially weaker claim than "genuinely independent computation" as
        report_c3lane.md's own words characterize the L9/L11 contribution.
    - id: CC-5
      name: "robustness of the termination branch under the stricter (L7-only) coverage reading"
      method: >-
        recomputed the aggregate and termination branch after EXCLUDING all 12 am4-derived
        L9/L11 cells (the ones affected by CC-4's finding), keeping only the 6 L7 cells
        whose ROUTE-I is results_l7l8.json
      result: "COVERED (L7 only) = 6 of 27, all 6 EXCEEDS. Termination branch: T-C3LANE-OPEN-PARTIAL -- SAME branch as the full 18/27 reading."
      verdict: >-
        PASS -- the termination branch is ROBUST to whether the L9/L11 cells are counted
        at all; only the coverage fraction (6/27 vs 18/27) and the strength of the
        evidentiary claim change, not the branch. This directly answers the task's
        question of whether T-C3LANE-OBSTRUCTED could have fired under any other reading:
        it could not, under either the full or the narrower coverage reading, because
        every covered cell (under both readings) verdicts EXCEEDS and none verdicts DOES
        NOT EXCEED.

  # ==================================================================
  # 5. RULINGS ON ITEMS CARRIED FOR REVIEW
  # ==================================================================
  objection_rulings:
    - id: RULING-PRODUCER-OBJECTION
      subject: >-
        the producer's own recorded objection: L9/L11's D_route rests on n_matched_bases =
        1 (not L7's 8), a weaker disagreement estimate, and PREREG-3 does not ask the
        producer to weight or qualify the verdict on that basis
      my_ruling: >-
        THE PRODUCER'S HANDLING IS CORRECT AS FAR AS IT GOES. PREREG-3 3.3 literally
        defines D_route as "max over the matched bases ... or the subset both routes
        actually cover -- report the subset size", and the producer reported
        n_matched_bases = 1 honestly rather than assuming 8 or discarding the cell. I
        confirm this is the right reading of the frozen clause and that no weighting rule
        is specified anywhere in PREREG-3. HOWEVER, the objection as recorded stops one
        step short: a 1-basis disagreement estimate is weak not only because of small
        sample size but because (per CC-4/F-1) even an 8-basis estimate at these same
        cells would not measure independent-algorithm disagreement, since the code is
        shared regardless of how many bases are compared. The producer's own objection,
        read narrowly, is correctly scored against the frozen clause; it does not reach
        the deeper point this report adds.
    - id: RULING-PREREG-2-7.5-REPAIR-BAR
      subject: >-
        PREREG-3 section 3.6's claim that PREREG-2 7.5's repair bar (six conditions plus
        an absolute bar on an eighth consecutive gate repair) does not apply to part (c)
      independent_re_derivation: >-
        I read PREREG-2 section 7.5 directly (BATCH-6b6e78/TASK-20260813-25cb95/prereg.md,
        lines 812-851), not merely PREREG-3's citation of it. 7.5 bars "a further
        dispersion criterion, fibre clause or gate repair" unless six conditions hold
        (numbered assumption; uncalibrated threshold declared; null-object calibration;
        named blind spot; stated repair count; stated alternative-is-worse reasoning),
        plus an absolute bar on an eighth consecutive gate repair without a Coordinator
        decision. Checking PREREG-3 section 3.5's three actual branches against this
        text: T-C3LANE-NODATA licenses recording an infrastructure/corpus gap (no
        criterion of any kind); T-C3LANE-OBSTRUCTED licenses CLOSING the lane (an
        admission of failure, the opposite of a repair attempt); T-C3LANE-OPEN licenses
        only "a bare statement that a domain is worth stating", and explicitly FORBIDS
        "specifying any dispersion criterion, fibre clause or gate on the strength of this
        branch alone". None of the three branches proposes, adopts or repairs a
        criterion, clause, gate or threshold that a future candidate would be scored
        against -- which is the specific class of act 7.5's six conditions and the
        eighth-repair bar govern. I independently concur with PREREG-3 3.6's conclusion
        for the reasons it gives (no criterion specified; a previously-untouched class of
        objects, not a repair of an existing gate; a measurement result, not a repaired
        gate's pass/fail).
      what_i_did_not_re_derive: >-
        the literal count "seven consecutive instrument batches, not eight" is attributed
        to a chain of prior Coordinator decisions across this goal's history
        (DEC-20260812-781961 and others) that I did not re-audit; doing so would require
        litigating the full batch history, which PREREG-3 section 7 and this task's own
        constraints bar ("do not re-litigate AM-10 through AM-18"). I re-derived the
        STRUCTURAL argument (why 7.5's conditions target criterion-proposals and part (c)
        makes none), not the arithmetic of the count.
      verdict: >-
        PREREG-3 3.6's reasoning is SOUND on independent re-derivation from PREREG-2's own
        text, for the scope I checked.

  # ==================================================================
  # 6. THE TERMINATION BRANCH, READ INDEPENDENTLY
  # ==================================================================
  branch_reading:
    was_T_C3LANE_OPEN_PARTIAL_read_correctly_off_the_committed_rows: >-
      YES, stated plainly and separately as asked. Under PREREG-3 3.5's frozen precedence:
      COVERED is non-empty (18 of 27, or 6 of 27 under the stricter reading in CC-5), so
      T-C3LANE-NODATA does not fire. SOME-EXCEEDS holds (in fact every covered cell
      EXCEEDS, under either coverage reading) and ALL-CLEAR cannot hold on this data
      (there is no cell with s_c^fib <= D_route among those covered), so T-C3LANE-OPEN
      fires and T-C3LANE-OBSTRUCTED is precluded by 3.5's own stated precedence
      ("SOME-EXCEEDS ... takes precedence over ALL-CLEAR whenever both could otherwise be
      read from the same data"). Coverage is 18/27 (or 6/27) < 27/27, so the -PARTIAL
      suffix applies per 3.5's own rule. BRANCH: T-C3LANE-OPEN-PARTIAL.
    could_T_C3LANE_OBSTRUCTED_have_fired_under_any_other_reading: >-
      NO. T-C3LANE-OBSTRUCTED requires ALL-CLEAR -- every covered cell DOES NOT EXCEED.
      Given D_route = 0.0 exactly at every one of the 18 covered cells and s_c^fib
      strictly positive at every one (no ties, confirmed to full float64 precision by my
      own independent recomputation), ALL-CLEAR is arithmetically impossible on this
      data under ANY defensible reading of "covered" I could construct, including the
      stricter L7-only reading tested in CC-5. The only way T-C3LANE-OBSTRUCTED could fire
      is if the underlying s_c^fib or D_route VALUES were different from what is
      committed, which is not a reading question but a different measurement.
    what_does_change_under_a_stricter_independence_reading: >-
      NOT the branch (CC-5). What changes is the coverage fraction (18/27 vs 6/27) and,
      more importantly per F-1, the strength of the claim that "EXCEEDS" establishes: with
      shared-code routes, EXCEEDS establishes only that s_c^fib is nonzero at
      machine-observable scale (true almost by construction for a genuinely dispersing
      statistic), not that it exceeds a genuine cross-implementation uncertainty floor.

  # ==================================================================
  # 7. FINDINGS
  # ==================================================================
  findings:
    - id: F-1
      severity: MAJOR (interpretive/evidentiary, not arithmetic)
      title: "\"ROUTE-I\" independence is overstated; D_route is a same-code reproducibility floor, not an algorithmic cross-validation floor"
      statement: >-
        At every one of the 18 covered cells (all of lam1n/hkz at L7, L9, L11), the source
        code that PREREG-3 designates as ROUTE-P (measure_relvar.py) and ROUTE-I
        (replicate_l7l8.py at L7; measure_am4.py at L9/L11) shares its core numerical
        kernel VERBATIM: make_A, build_basis and hkz_profile are explicitly labelled
        "CARRIED VERBATIM" in each downstream file's own docstring, forming a documented
        transcription chain measure_am4.py -> measure_relvar.py -> replicate_l7l8.py
        (confirmed by direct line-for-line diff, probes/probe_shared_code_provenance.sh).
        The only genuine difference between "routes" is EXECUTION ENVIRONMENT (host, OS,
        fpylll/numpy/scipy versions -- report_c3lane.md's own text: macOS-arm64/Python
        3.13.1/numpy 2.4.0 vs measure_relvar.py's Linux-x86_64/Python 3.11.15/numpy
        2.4.6), not ALGORITHM. D_route = 0.0 at all 18 cells is fully explained by this:
        identical deterministic code, identical seeded input, IEEE-754 double-precision
        arithmetic reproducing bit-for-bit across the observed platforms. This is
        materially the SAME underlying fact this goal's own binding carries already
        address for the L7 case ("'genuinely cross-platform' is NOT citable; the citable
        form is a PORTABILITY result across three textually distinct implementations")
        -- but report_c3lane.md's characterization of the L9/L11 contribution goes
        further than that established, careful framing: "This is a genuinely independent
        computation ... It is not read from results_relvar.json" is true narrowly (it is
        a separate execution) but is not disclosed alongside the shared-kernel fact, and
        invites a stronger reading than the evidence supports.
      consistency_with_prereg-3s_own_text: >-
        PREREG-3 3.1 is more careful for L7, describing ROUTE-I there as having "ran the
        FROZEN HKZ pipeline once per basis" -- which, read closely, already discloses
        same-code re-execution rather than independent implementation. PREREG-3's own
        LABEL for this concept ("ROUTE-I", "independent replication route") nonetheless
        invites a stronger reading than its own careful prose delivers, and PREREG-3 3.2's
        obligation-0 specification for L9/L11 asks only for CONSTRUCTION comparability
        (d,k; seed; AM-9 convention; bit-identical basis-0), never for a check of
        algorithmic independence -- so the producer discharged obligation 0 exactly as
        specified (MR-1: PASS), and this finding is not a claim that the producer violated
        PREREG-3's frozen text. The gap is in (a) PREREG-3's own naming/labelling
        (frozen, so not a producer defect, but worth a Coordinator's attention for any
        successor pre-registration), and (b) the producer's OWN ADDED characterization
        of the L9/L11 comparison as "a genuinely independent computation," which goes
        beyond anything PREREG-3 required it to establish or itself claims for L7.
      contrast_confirming_the_mechanism: >-
        elsewhere in the SAME corpus (results_relvar.json's own forced_arithmetic block),
        comparisons between a computation and a genuinely distinct transform of the same
        input (an ambient isometry, a permutation, a unimodular transform -- NOT the same
        code re-run) produce near-machine-epsilon but NONZERO residuals (rdet_T1:
        3.865e-12; rawtail_T1: 5.809e-13), and the corpus's own convention labels these
        "UNTESTED -- not a test that could have failed" for exactly the algebraic reason
        that makes them uninformative as tests. D_route = 0.0 here is the same kind of
        "not a test that could have failed" situation, for a different (code-sharing
        rather than algebraic) reason, but is presented in report_c3lane.md without that
        caveat.
      consequence: >-
        Does NOT change any committed number, the aggregate verdict, or the termination
        branch (T-C3LANE-OPEN-PARTIAL is confirmed and robust -- see branch_reading and
        CC-5). DOES weaken what the EXCEEDS verdicts and T-C3LANE-OPEN's licensed
        statement ("a domain worth stating") can be read to support: the batch does NOT
        establish that lam1n/hkz's fibre dispersion exceeds a genuine cross-implementation
        uncertainty floor, only that it exceeds the residual of running the same
        deterministic code twice on different hosts, which is a much lower and less
        informative bar. Any future citation of this batch's EXCEEDS verdicts should carry
        this qualification in the same sentence, mirroring how this goal already requires
        "the citable range 4.87x-31.03x" and "PORTABILITY not cross-platform" to travel
        with their respective headline numbers.
      not_a_re-litigation_of_BATCH-4ed139/BATCH-9e3584/BATCH-cbe023: >-
        this finding does not rescore or revalidate any of those batches' own verdicts
        (P-L1's replication success, the AM-4 gate's own scoring, etc.), which remain
        untouched, per PREREG-3 section 7's binding carry. It is a finding about how
        THIS batch (BATCH-fbb639) newly reuses an existing, correctly-labelled fact in a
        new context (as a stand-in for "route disagreement") without carrying its
        established caveat forward.
    - id: F-2
      severity: MINOR (artifact-policy / documentation hygiene)
      title: "A repository-relative path is embedded inside a folded YAML scalar in run_manifest.yaml, contrary to the stated rule"
      statement: >-
        run_manifest.yaml's `git.note` field (a folded ">" scalar starting at line 47)
        reads "...this task adds exactly the 7 declared paths under
        coordination/goals/GOAL-MLKEM-005/batches/BATCH-fbb639/tasks/
        TASK-20260813-7b3039/." -- a repository-relative directory path inside prose
        inside a folded scalar. This task's own completion gate and PREREG-3 section 7's
        binding carries state plainly: "no path appears inside a folded YAML scalar
        anywhere in the manifest." I scanned all 7 folded blocks in the manifest and this
        is the only one containing an embedded path.
      severity_assessment: >-
        LOW. It is a directory prefix in a sentence, not one of the 7 declared artifact
        paths hidden from a machine check -- artifacts_declared is a plain (non-folded)
        YAML list and is fully greppable. It does not affect the completeness or
        discoverability of any declared artifact.
      not_caught_by_the_archive: >-
        TASK-20260813-7ac7cd's snapshot receipt records a "no_reduction_check" note but
        does not record a folded-scalar check, so this defect passed through the archive
        commit uncaught. Recorded here rather than silently repaired (I do not edit
        producer artifacts).
      consequence: does not affect the verdict on its own; contributes to `incomplete` alongside F-1.

