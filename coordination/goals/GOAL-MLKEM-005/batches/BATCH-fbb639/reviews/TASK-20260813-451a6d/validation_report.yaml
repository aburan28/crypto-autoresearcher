        consistent with PREREG-1 2.9's TAG-1 declaration); k_convention_AM9 field present
        and textually matches AM-9 (k = |K_I|, identity block, not fpylll's q-scaled-row
        convention); basis-0 bit-identical cross-check TRUE at all 4 (candidate, lattice)
        pairs (lam1n/L9, lam1n/L11, hkz/L9, hkz/L11), each to the full printed float64
        value (e.g. lam1n/L11: 1.6104875871694129 on both sides, abs_deviation 0.0).
