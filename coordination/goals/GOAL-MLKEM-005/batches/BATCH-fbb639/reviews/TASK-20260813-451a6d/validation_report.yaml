        n_matched_bases = 8 at every one of the 6 L7 cells -- matches the producer exactly.
      am4_construction_comparability_check: >-
        Re-implemented all four of PREREG-3 3.2 item 3's named checks independently: (d,k)
        read from am4's own instrument_checks.x9_pipeline_crosscheck block --
        {L7:(20,6), L9:(30,9), L11:(40,12)}, matching F0 exactly; seed-formula string
