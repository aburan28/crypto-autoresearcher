validation_report:
  id: VAL-20260813-451a6d
  task_id: TASK-20260813-451a6d
  goal_id: GOAL-MLKEM-005
  batch_id: BATCH-fbb639
  role: validator
  claim_tier: toy
  claim_tier_statement: >-
    CLAIM TIER TOY, UNCONDITIONALLY. Nothing in this report bears on ML-KEM security, on
    any FIPS 203 parameter set, on any attack cost or on any cost model, and no number
    here transports to beta = 606, to d = 1420 or to any parameter set by extrapolation,
    analogy or any other route. This report verifies EVIDENCE INTEGRITY. It does not
    decide what the evidence means for any hypothesis, and it authorizes no promotion.
  run_ids: []
  run_ids_note: >-
    No RUN-* identifier is minted or declared anywhere in BATCH-fbb639's committed
    artifacts (checked by grep across the whole batch directory, including
    run_manifest.yaml, which carries no run_id field). This differs from BATCH-6b6e78's
    own producer manifest, which declared RUN-20260813-2ce014-a1. Recorded as an
    observation, not asserted as a defect: PREREG-3 and the dispatch queue do not require
    one for this task.
  reviewed_snapshot:
    notarization_commit: 3d2eabf8ddfa9e33ed3c9cf5b0cc0d9f14ebcd82
    notarization_parent: 743a2fb312090e5eef4d99cd68a0d38d71c6f394
    producer_snapshot_commit: 391f811e7b6b23fb40235a0608aebeb05b5b9c4a
    producer_snapshot_parent: 18bf286348fabc13114f200509ee12f65d6c9756
    prereg_sha256: 3f64e2688f0d52b93ad2428ffa99883b0234edeb47aff0c242628a6d880c7138
    head_at_review: 463b46487888b3adbfe9f56304ebc531ed13e0cd
    branch_at_review: claude/launch-research-harness-1ns6z3
    refusal_note: >-
      Both commits named in the task envelope were read as committed history via git
      plumbing (git show / git diff-tree / git log), never from the working tree. I did
      not validate any working-tree-only producer receipt. If either had turned out
      uncommitted at review time, this report would say INVALID rather than proceed; both
      were committed and reachable from HEAD, confirmed below.

  # ==================================================================
  # 0. HEADLINE
  # ==================================================================
  headline:
    what_reproduced: >-
      RC-1 and RC-2 are carried verbatim (RC-1 exactly; RC-2 by unambiguous restatement,
      differing only in em-dash-vs-double-hyphen and "section 10" vs "section10"
      typography) and both are independently re-confirmed against the primary source
      (results_a1.json read directly, never via any report's prose). Every one of the 27
      cells' coverage classification, D_route, s_c^fib, per-cell verdict, the aggregate
      SOME-EXCEEDS verdict and the termination branch T-C3LANE-OPEN-PARTIAL reproduce
      EXACTLY from an implementation I wrote from PREREG-3's frozen prose and the raw
      corpus JSON, importing nothing from measure_c3lane.py. No reduction of any kind was
      performed by the producer or by me. Both archive commits verify at full change-set
      equality in both directions, and the notarization chain holds in both directions.
    what_did_not: >-
      The producer's own characterization of results_am4.json's L9/L11 contribution as "a
      genuinely independent computation" of lam1n/hkz does not hold at the strength
      claimed. Reading the actual source code of all three scripts PREREG-3 names as
      ROUTE-P/ROUTE-I sources (measure_relvar.py, replicate_l7l8.py, measure_am4.py) shows
      their basis-construction (make_A, build_basis) and reduction/enumeration kernel
      (hkz_profile) are VERBATIM-TRANSCRIBED across all three, each file's own docstring
      explicitly saying so ("CARRIED VERBATIM from ..."), forming a documented chain
      measure_am4.py -> measure_relvar.py -> replicate_l7l8.py. D_route = 0.0 at every one
      of the 18 covered cells is therefore explained by same-code re-execution in a
      different environment, not by independent-algorithm cross-validation -- see finding
      F-1. This does not change any reported number or the termination branch (both are
      independently confirmed, including under a stricter reading that would exclude the
      am4-derived cells entirely -- see branch_reading), but it materially weakens what
      the EXCEEDS verdicts and T-C3LANE-OPEN-PARTIAL's "domain worth stating" license can
      be read to support.
    and_one_minor_artifact_policy_defect: >-
      run_manifest.yaml's git.note field (a folded ">" YAML scalar) contains an embedded
      repository-relative directory path, contrary to the explicit rule stated in this
      task's own completion gate and PREREG-3 section 7's binding carries ("no path
      appears inside a folded YAML scalar anywhere in the manifest"). Minor, does not
      affect discoverability of any of the 7 declared artifacts, but it is a real,
      checkable non-compliance that TASK-20260813-7ac7cd's archive check did not catch
      (its own note addresses only fpylll, not this rule) -- see finding F-2.

  # ==================================================================
  # 1. THE ARRANGEMENT IN WHICH MY OWN CHECK COULD NOT FAIL
  #    NAMED IN BOTH DIRECTIONS, AND WHY I AM NOT IN IT
  # ==================================================================
  my_own_could_not_fail_arrangements:
    - id: MINE-1
      direction: COULD-NOT-FIRE
      arrangement: >-
        If I had imported measure_c3lane.py, or built my JSON-path logic by reading its
        source first and copying its structure, agreement with the producer would be
        guaranteed by construction and would prove nothing.
      why_i_am_not_in_it: >-
        probes/probe_independent_recompute.py imports nothing from measure_c3lane.py. Its
        paths (G_VAR.per_candidate.<X>.per_cell.<L>_<b>.float_sd; comparison.per_cell in
        results_l7l8.json; instrument_checks.x9_pipeline_crosscheck and
        gates.<X>.G_REL1.all in results_am4.json) were located by my own direct
        exploration of the raw JSON structure (recorded in
        probe_independent_recompute_output.txt's earlier interactive session, and visible
        in this report's own tool trace), driven by PREREG-3's prose, not by reading
        measure_c3lane.py's variable names. I DID read measure_c3lane.py (required for
        the fpylll-absence and no-undeclared-file checks this task also owes), so I record
        the honest caveat that this happened in the same session; I mitigate it with
        MINE-2: my independent script disagrees with nothing only because it is in fact
        correct, not because it cannot disagree -- see the decisive evidence there.
    - id: MINE-2
      direction: COULD-NOT-PASS
      arrangement: >-
        If I had mistranscribed a frozen path, formula or beta grid, my numbers would
        disagree with the producer's at most or all of the 27 cells, and I would "find" a
        defect in a correct run -- the mirror failure, and the one that makes a validator
        look rigorous while being useless.
      why_i_am_not_in_it: >-
        probe_independent_recompute.py's per-cell loop DIFFS every one of the 27 cells
        against the committed results_c3lane.json explicitly (s_c^fib, D_route,
        n_matched_bases, verdict) and prints "MISMATCH" on any divergence. Run twice
        (probe_independent_recompute.py and, restructured, inside
        probe_rc_carry_and_artifact_policy.py's sibling checks), it reports 0 mismatches
        across 27/27 cells, matching to full float64 precision (e.g. lam1n L9/L11's
        0.0847592417001852 and 0.0388473945796316, hkz L7's 0.023887966155964283, and
        every other of the 18 EXCEEDS cells' s_c^fib to the last printed digit). A
        mistranscription of any of the three source JSON paths would not reproduce all 27
        cells including the 8 UNCOVERED and 1 ROUTE-W-excluded cell's classification.
    - id: MINE-3
      direction: COULD-NOT-FIRE (git)
      arrangement: >-
        If I had copied the "declared path set" for either archive commit FROM its own
        receipt, the equality check against the commit would be tautological (both sides
        from one source).
      why_i_am_not_in_it: >-
        The declared sets I checked against (3 paths for TASK-20260813-6ad846, 8 for
        TASK-20260813-7ac7cd) come from dispatch_queue.json's own `declared_path_set`
        arrays (lines 180-184 and 389-397), written at dispatch time before either commit
        existed, NOT from the `archive.path_sha256` blocks filled in after the commit. The
        "actual" side is `git diff --name-status <parent> <commit>`, read directly from
        the object database. These are two genuinely separate sources; see AC-1/AC-2.
    - id: MINE-4
      direction: COULD-NOT-FIRE (the shared-code finding is not a trivial relabelling)
      arrangement: >-
        If my F-1 finding were just "the files have different names" or an unfalsifiable
        impression, it would not be a real check.
      why_i_am_not_in_it: >-
        F-1 rests on a line-for-line diff of the actual function bodies (hkz_profile,
        make_A) across measure_am4.py, measure_relvar.py and replicate_l7l8.py
        (probes/probe_shared_code_provenance.sh, section 2/3), each file's own docstring
        independently confirming the transcription ("CARRIED VERBATIM from ..."). It also
        explains a SPECIFIC, quantitative, falsifiable phenomenon (D_route = 0.0 exactly,
        to full float64 precision, at every one of 18 cells across two different host
        environments) via a mechanism I verified directly rather than asserted, and I
        located a CONTRAST CLASS inside the same corpus (rdet_T1/T2/T3 and
        rawtail_T1 residuals, which are near-zero but NOT bit-identical -- 3.865e-12,
        5.809e-13 -- precisely where the comparison is a real algebraic transform rather
        than re-executed identical code) that makes the pattern a checkable prediction,
        not a post-hoc story: same code -> exact 0.0; related-but-distinct computation ->
        near-epsilon but nonzero. Both are visible in probe_shared_code_provenance_output.txt.

