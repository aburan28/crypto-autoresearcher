      verdict: "PASS -- 27 of 27 cells, 0 mismatches"
    - id: MR-3
      name: "obligation 2 (R-C-OUT-2) -- aggregate verdict"
      my_result: "COVERED = 18, EXCEEDS = 18, DOES NOT EXCEED = 0, UNCOVERED = 8, ROUTE-W excluded = 1, aggregate_verdict = SOME-EXCEEDS"
      producer_result: identical in every count
      verdict: PASS
    - id: MR-4
      name: "obligation 3 (R-C-OUT-3) -- termination branch, read off PREREG-3 3.5's frozen precedence by hand"
      my_derivation: >-
        COVERED non-empty, so T-C3LANE-NODATA does not fire. Between T-C3LANE-OBSTRUCTED
        (requires ALL-CLEAR, i.e. every covered cell DOES NOT EXCEED) and T-C3LANE-OPEN
        (fires if ANY covered cell EXCEEDS, and takes precedence when both readings are
        possible): all 18 covered cells verdict EXCEEDS and 0 verdict DOES NOT EXCEED, so
        ALL-CLEAR cannot hold on this data and SOME-EXCEEDS holds trivially (not merely
        "at least one" but "all 18"). T-C3LANE-OPEN fires. Coverage 18/27 < 27/27, so the
        -PARTIAL suffix applies per 3.5's own rule.
      result: T-C3LANE-OPEN-PARTIAL -- matches the producer exactly
      verdict: PASS

