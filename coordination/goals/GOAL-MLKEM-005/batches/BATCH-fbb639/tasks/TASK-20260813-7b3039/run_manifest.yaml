    PREREG-3 section 4's own attributed spot-checks exactly (lam1n L7
    0.04339249931620648 rounds to PREREG-3's quoted 0.0434; hkz L7 b5/b10
    round to PREREG-3's quoted 0.0239/0.0106). No number changes; only the
    JSON path used to find it.
  - >
    COVERAGE FINDING BEYOND PREREG-3's OWN STATED EXPECTATION: PREREG-3
    section 3 states results_am4.json's L9/L11 comparability is "genuinely
    open pending the lead's own... check" and its section 3.5 -PARTIAL note
    says full coverage "is not expected" and specifically flags
    lam1n/hkz "covered at L7 only" as the expected outcome. This task's own
    obligation-0 check found results_am4.json DOES verifiably share the
    frozen construction (matching (d,k), matching seed formula, matching
    AM-9 convention, bit-identical basis-0 cross-check) and so counted L9/L11
    as covered (at 1 matched basis each) for lam1n/hkz, giving 18/27 coverage
    rather than the 6/27 PREREG-3's own prose anticipated as the likely
    floor. This is reported as a coverage finding, not argued away; see
    report_c3lane.md obligation 0 item 3 and the "Objection" section.
  - >
    A second candidate ROUTE-I source for rawtail was found beyond what
    PREREG-3 named (BATCH-4ed139/TASK-20260812-56b9da) and explicitly
    excluded as non-independent (transcribed code, same deterministic
