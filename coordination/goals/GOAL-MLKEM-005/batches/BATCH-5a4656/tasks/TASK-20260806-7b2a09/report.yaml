  they are evidence of, at the scope they declare. It does not support any
  ML-KEM claim, does not demonstrate a speedup, does not validate any
  heuristic, and does not authorise a status change or a promotion.
  AGENTS.md rule 12 remains UNMET and UNWAIVED and this report changes the
  status of no EV-MLKEM-* record and no KN-* entry. The mechanism studied is
  SESSION recovery, not key recovery; no number in this package or in this
  report may be subtracted from the in-repo primal_bdd margins of
  2.80 / 6.04 / 1.28 bits. My own independent re-derivation of B2-A's P3,
  P4 and P5 (Sections 1-3 below) CONFIRMS the reported figures exactly; the
  D-1 defect claim is CONFIRMED both empirically and mathematically. Two
