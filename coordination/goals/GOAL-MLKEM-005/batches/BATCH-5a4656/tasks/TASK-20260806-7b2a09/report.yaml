    status: reproduced
    method: "Read census.json rows R20, R21 directly and diffed against bound.md's quoted text."
    result: "Verbatim match, including 'Sec. 6'/'Sec. 3' section numbers."
  - id: B2B-2
    claim: "the lane (a) X=0 bound is curvature-independent (uses only the sign of f'', not its magnitude)"
    status: reproduced
    method: "Re-derived from first principles (notes.md Sec 5), independent of bound.md's own prose."
    result: >-
      CORRECT, and doubly so. For M=1, log2(M)=0 is pure arithmetic, no
      convexity needed. The general inequality G <= log2(M) for M>1 needs
      only the SIGN of f'' (convexity) to license the tangent-line
      argument, not its magnitude -- which lane (a) never evaluates
      numerically anyway. bound.md's own additional argument ("a selection
      over one candidate is not a selection") is an even more elementary,
      convexity-independent justification of the same X=0 result. "No f''
      table applies to this lane" is justified.
