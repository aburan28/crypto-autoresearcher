controls_and_null_objects:
  inventor_protocol_section_3_check: >-
    B2-A's P4 arm IS the required null-of-the-null control for the repaired
    C3 instrument: it applies the coordinate-aligned projector to a
    rotation-invariant (Gaussian) error law, under which the marginal law
    of R is EXACTLY Beta for any fixed projector, so P4 must return 1.000
    within sampling noise if the instrument is sound -- it does, in all
    four cells (B2A-1), and the card's own completion_gate required P4 be
    adjudicated BEFORE P3/P5/the real arm, which report.md honours in
    order. This is the correctly-designed null this campaign's prior
    instrument (BATCH-a51f91 T2) lacked. B2-A's falsifier (P5) is the
    "does the signal decay when the parameter meant to destroy it grows"
    check the protocol requires, and it is checked and reported honestly
    even though the magnitude misses the naive formula by 7.8-11.3% (B2A-3)
    -- not rounded away, not silently rescued.
  the_one_place_this_check_was_missing: >-
    B2-D's hash-instability finding (DEF-2) is exactly the pattern this
    check exists to catch: an unusual signal (sha256 instability) reported
    without the identical measurement run against a null object of the
    same shape (an unrelated resource fetched through the same local
    network path) to see whether the parameter that should distinguish
    "TU/e-specific" from "generic to this environment's proxy" was varied.
    It was not varied, and the causal claim is accordingly overclaimed
    (see DEF-2).

heuristic_validation_checks:
  applicable: yes
  pre_registered_prediction: >-
    prediction_frozen.json is written and its sha256 recorded, per its own
    frozen_prediction_verified/frozen_prediction_sha256 fields cross-checked
    in-process by measure.py at both run starts (confirmed in
    stdout_run1.log/stdout_run2.log's FROZEN PRE-REGISTERED PREDICTION
    header, timestamped 2026-08-06T15:43:11Z, before either run started at
    15:48:15Z/16:02:06Z). P1-P5, including the falsifier's numeric
    prediction at both beta values, are all frozen before any research
    number -- confirmed directly from the timestamps.
  sample_integrity: >-
    Sample size (2^20 CBD_eta2 errors per basis, shared across arms), seeds
    (five explicit families, all deterministic functions of (d,beta,index),
    printed in results.json.seed_scheme), and the sampling procedure are in
    prediction_frozen.json and results.json. I recomputed the empirical
    statistics (P3, P4, P5) from the raw per-draw arrays myself, not copied
    from the report (Sections 1-3 above).
  correspondence_validity: not_applicable
    # No substitute-sampling correspondence (e.g. Deuring) is used by this
    # experiment; the graded family Q_t interpolates directly between the
    # coordinate-aligned and Haar projectors on the actual object under
    # study, and I re-derived (B2A-5) why that interpolation is
    # mathematically well-founded at its endpoints.
  scale_binding: >-
    d in {100,140}, beta in {30,40} -- toy scale throughout, explicitly and
    repeatedly disclosed as such in every producer artifact (report.md Sec
    9, receipt.json scope_statements, prediction_frozen.json
    scope_constraints_binding_on_the_report). Nothing is transported to
    beta=606/d=1420; I found no instance where a toy-scale number is
    presented as scale-matched evidence.
  cost_unit_honesty: >-
    B2-B's fpp_sensitivity.json declares its unit (bits/block, blocks) in
    every field name and labels the whole table "MODEL READOUT, NOT A
    MEASUREMENT" throughout. Memory is reported alongside time in B2-A's
    receipt.json (peak_rss_gb 2.434 against a 6 GB budget).
  cost_bookkeeping: >-
    B2-B's bound.md Sec 5 explicitly separates C_reduction (priced) from
    C_query/C_storage/C_selection (unquantified, named as >=0 line items),
    and states every bit figure in the document as a LOWER bound on
    attacker cost from the reduction term alone -- it does not compute a
    total expected cost as if success were certain, and does not attempt
    one, since no M is sourced for the lane where a total would be needed.

