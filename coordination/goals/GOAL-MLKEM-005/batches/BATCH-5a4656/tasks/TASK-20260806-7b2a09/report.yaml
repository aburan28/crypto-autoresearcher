    result: >-
      Exact match in all four cells to the digits shown: dev/SE =
      0.732885 / 0.878785 / 0.060324 / 0.517036, all PASS against 4 SE.
      Range 0.06-0.88 SE CONFIRMED.
  - id: B2A-2
    claim: "P3 (coordinate-aligned vs Haar, SE-of-the-difference) holds in all four cells by 46.8-73.2 SE against a 4-SE gate"
    status: reproduced_with_correction
    method: >-
      INDEPENDENTLY RE-DERIVED from raw per-draw graded['t0.00'] and
      graded['t1.00'] data (not the summary block); computed mean_t0,
      sd_t0, mean_t1, sd_t1, unpaired SE, signed shift, and SE-multiple
      from scratch.
    result: >-
      Exact match in all four cells: shift/SE = 46.815800 / 73.145511 /
      52.939560 / 53.990135, all PASS at >=4 SE (46.8-73.1 SE range
      confirmed -- see DEF-3: the UPPER bound "73.2" quoted in my own
      launch instructions and in the Coordinator's commit message is a
      rounding error; the true maximum (73.14551134617912) rounds to 73.1,
      not 73.2. Report.md's own text never states "73.2"; it states "73.15"
      (2dp, correct) and "47-74 SE" (integer rounding, correct). Does not
      change the PASS verdict at 4 SE either way.)
  - id: B2A-3
    claim: "P5 falsifier: measured decay ratios 0.8926/0.8903 vs predicted 0.8018/0.8257, direction-consistent, magnitude 7.8-11.3% off"
    status: reproduced
    method: >-
      INDEPENDENTLY RE-DERIVED departure = my own P3 shift (not the
      report's), computed departure(beta40)/departure(beta30) at each d,
      compared against prediction_frozen.json's pre-registered prediction.
    result: >-
      Exact match: measured ratios 0.892575/0.890255 (rounds to
      0.8926/0.8903), predicted 0.801784/0.825723 (rounds to 0.8018/0.8257),
      relative discrepancy 11.3237%/7.8152% (rounds to 11.3%/7.8%). Both
      cells: departure positive in both cells, decay in the predicted
      direction, no artifact tell.
  - id: B2A-4
    claim: >-
      D-1 (unnormalised G matrix in the graded family) affects ONLY interior
      t-points, leaving t=0/t=1 -- and every P1-P5 figure -- bit-for-bit
      identical between run 1 and run 2
    status: reproduced
    method: >-
      Bit-for-bit JSON comparison, run entirely by me
      (compare_run1_run2.py, notes.md Sec 4a), of results.json vs
      results_run1_raw.json across P4_gaussian_null_of_null, P3_sensitivity,
      verdict_on_the_real_arm, verdict_on_the_null_arm_FIRST, arms.real,
      arms.coord_aligned, arms.haar_null, arms.gaussian_null_of_null,
      arms.graded['t0.00'/'t1.00'], forced_values, P5_falsifier_adjudication,
      and frozen_prediction, in all four cells (44 field-group comparisons).
      This is a STRONGER check than the report's own claim: I additionally
      diffed forced_values and the raw arms sub-objects, not just the
      summary P-blocks.
    result: >-
      44/44 field groups bit-for-bit identical. The 5 interior t-points
      (0.05/0.10/0.25/0.50/0.75) x 4 cells = 20/20 DIFFER, matching the
      described "cliff" collapse exactly (run1 interior means already near
      1.00/Haar-like by t=0.05). Run1's monotone_nonincreasing flag is False
      in exactly 3 of 4 cells (d100_b40, d140_b30, d140_b40) and True in 1
      (d100_b30) -- an EXACT match to receipt.json's "3 of 4 cells failed
      strict monotonicity" claim. unreduced_qary and lll_only arms (which
      don't touch E_S/G) are identical between runs in all 4 cells, as
      expected. CONFIRMED.
  - id: B2A-5
    claim: >-
      "standard unpivoted QR is invariant under independent positive
      per-column rescaling of its input, in the way that leaves t=0 and
      t=1 unaffected while changing 0<t<1"
    status: reproduced
    method: >-
      Re-derived from first principles (notes.md Sec 4b), independent of
      the producer's own docstring argument, then checked against
      measure.py's actual build_graded_Q implementation (lines 180-216).
    result: >-
      MATHEMATICALLY CORRECT. At t=0 the mixed matrix is E_S exactly (G
      does not appear); trivially unaffected by any rescaling of G. At t=1
      the matrix is G alone; independent positive per-column rescaling of
      a full-rank matrix does not change the column SPACE it spans (each
      column is only rescaled along its own line), and the orthogonal
      projector onto a fixed subspace is unique regardless of which
      orthonormal basis represents it, so R = e^T P e is provably
      unaffected. At interior t, each column is a WEIGHTED SUM of an E_S
      column and a G column; rescaling the G component alone changes the
      relative weight of the two terms and hence the DIRECTION of the sum
      (they are not parallel), so the per-column-rescaling-invariance
      argument does not apply there -- correctly matching what I observed
      empirically in B2A-4 (only interior points move). measure.py's code
      implements exactly what the docstring describes.
  - id: B2A-6
    claim: "artifact set and hashes as declared in snapshot_receipt.json"
    status: reproduced
    result: "All 21 files verified byte-identical to the 8a121df9 git blobs (see snapshot_integrity I1)."
  - id: B2A-7
    claim: "protocol runs, budget, seeds, environment as declared in receipt.json/command.txt/environment.json"
    status: reproduced
    method: >-
      Cross-read stdout_run2.log (frozen-prediction header, P5 tail, [done]
      line) against results.json and receipt.json's own figures; checked
      stderr_run1.log/stderr_run2.log sha256 against the known sha256 of an
      empty file (e3b0c44298fc1c...855).
    result: >-
      Consistent throughout: wall=256.55s peak_rss=2.433GB in stdout_run2.log
      matches results.json/receipt.json exactly; both stderr logs are
      genuinely empty (0 bytes, correct empty-file hash); command.txt's two
      blocks match the receipt's description of run1 (unnormalised G) vs
      run2 (fixed, cache-reused, 0.1s stage A) exactly.
  limitation: >-
    receipt.json's D-1 entry additionally cites specific principal-angle
    diagnostic numbers (67.7 deg / 81.2 deg / 89.1 deg at t=0.01/0.02/0.05)
    from a standalone script explicitly described as "not part of
    measure.py" and not among the delivered artifacts. I cannot
    independently verify those three specific numbers. They are
    illustrative motivation for the fix, not load-bearing for the D-1
    conclusion, which I verified independently of them (B2A-4, B2A-5).
  diagnostic_not_a_defect: >-
    P3's "unpaired SE is conservative" justification rests on a plausibility
    claim about the sign of a correlation between t=0 and t=1 draws that
    cannot be confirmed from only 8 points. My own check found sample
    correlations ranging from -0.57 to +0.72 across the four cells --
    consistent with a true correlation near 0 but not confirmable either
    way at this n. Immaterial: every alternative SE I computed, including
    the smallest, still leaves P3 passing by tens of SE.

