red_team_report:
  id: RT-20260806-f1df35
  task_id: TASK-20260806-1b95a1
  goal_id: GOAL-MLKEM-005
  batch_id: BATCH-5a4656
  reviewed_snapshot_commit: 8a121df975c8665b7b7a62436b228822d4fe9545
  reviewed_snapshot_parent: da16e6d3d4274304fcf4f3a42f81d63bab88ca4a
  independent_session: true
  independence_note: >-
    PROCEDURAL ONLY, recorded honestly per this campaign's own convention.
    This session's resolved model is not distinct-verified against the
    producers'; no claim of model-level independence is made.
  rule12_status: >-
    UNMET and UNWAIVED, inherited. No status change to any EV-MLKEM-* or KN-*
    record is proposed by this report. Objections and challenges only.

  claim_under_review: >-
    That BATCH-5a4656's four producers (B2-A repaired C3 instrument, B2-B the
    C1 bound per lane, B2-C the normative-gap write-up, B2-D the acquisition
    procedure) discharge or advance completion criteria C1-C3 of
    GOAL-MLKEM-005 -- specifically B2-A's claim that its repaired P3/P4/P5
    sensitivity demonstration licenses reading the real arm's P1/P2 result
    "as interpretable," and B2-B's claim that the normative lane's bound is
    "<= 0 bits, exactly ... not merely 'may be'."

  objections:
    - id: O1
      severity: material
      statement: >-
        BATCH-5a4656 is a divergent, un-reconciled duplicate of a lineage
        that already progressed past it. DEC-20260805-4823db's next_actions
        were executed TWICE: once as BATCH-436ddd (commit c9a7794fa, whose
        own message cites DEC-20260805-4823db), which iterated forward
        through two Coordinator supersession decisions (DEC-20260806-00deff,
        then DEC-20260806-14ac13) into BATCH-f19c37 and then BATCH-a44d08
        (opened by commit a2fdca0ed) -- and again as BATCH-5a4656 (opened by
        commit a582a7991), CHRONOLOGICALLY AFTER a2fdca0ed on this same
        branch. None of BATCH-5a4656's four task cards' read_scope, nor its
        dispatch_queue.json objective or coordinator_amendment, cites
        EV-MLKEM-94f036, EV-MLKEM-94c773, DEC-20260806-00deff, or
        DEC-20260806-14ac13. ledger/goals/GOAL-MLKEM-005.yaml's own
        batch_log (committed on this same branch) shows current_batch_id:
        BATCH-a44d08 and never mentions BATCH-5a4656 at all. This batch was
        dispatched, executed and archived as if it were the sole successor
        to BATCH-a51f91, when a more-advanced sibling lineage carrying two
        binding amendments (AM-3, AM-4) already exists in the same
        repository history.
      cheapest_check: >-
        git log --oneline claude/mlkem-campaign-005 -- confirms a2fdca0ed
        (BATCH-a44d08 opened) precedes a582a7991 (BATCH-5a4656 opened);
        grep -L for "DEC-20260806-14ac13\|DEC-20260806-00deff\|AM-3\|AM-4"
        across BATCH-5a4656/dispatch_queue.json and all four task
        directories confirms zero hits. Both checks run this session (see
        notes.md sec 1).
      required_remedy: >-
        The Coordinator's ledger archive for this batch must explicitly
        state which lineage is authoritative and reconcile the two. At
        minimum, BATCH-5a4656's C3-relevant claims (B2-A) must be evaluated
        against AM-3 (declared false-failure rate for any monotonicity/decay
        criterion, refused above 0.10) and AM-4 (invariance under ambient
        isometry, row permutation, unimodular change of basis, refused
        otherwise "regardless of how well it separates") before being read
        as advancing C3. This report finds B2-A's P3 does not clear AM-4
        (see O3).

    - id: O2
      severity: material
      statement: >-
        P3/P4/P5 test a different decision rule than P1/P2, the only test
        that actually reads the real (BKZ-reduced) arm. P3 compares two
        synthetic arms (coordinate-selector E_S vs Haar) against each other;
        P1/P2 compares the real arm against the theoretical Beta CDF.
        Passing P3/P4/P5 shows the ratio_2em10 statistic has dynamic range on
        synthetic extremes and that this range is genuinely CBD-driven (P4 is
        a real, well-designed control on this point) -- it does NOT show
        P1/P2 has power to detect a partial coordinate-alignment departure in
        the real tail-GSO frame. B2-A's own report.md sec 6 concedes exactly
        this in prose ("P1/P2 cannot ... tell 'the real arm obeys Beta' apart
        from 'the real arm's departure ... is too small for this decision
        rule to see'") without drawing the consequence for whether C3 is
        discharged.
      cheapest_check: >-
        Apply P1's own frozen rule (|ratio-1| <= 0.05 at 2^-10) to the
        already-computed, already-committed unreduced-arm ratio_2em10 values
        in report.md sec 7 (a departure the report itself calls "real,
        non-forced"): d100_b30 1.03784 (dev 0.038, PASS-missed), d100_b40
        1.05540 (dev 0.055, FAIL-caught), d140_b30 1.02326 (dev 0.023,
        PASS-missed), d140_b40 1.02943 (dev 0.029, PASS-missed). 3 of 4
        cells: P1's own threshold scores a known, real, non-forced Beta
        departure as a PASS. Computed at zero new compute, from numbers
        already in this batch's own committed artifacts.
      required_remedy: >-
        Before any real-arm PASS is read as informative about the Beta tail
        law, report a power/false-negative-rate table for P1/P2 itself at
        the departure magnitudes this batch's own unreduced/LLL-only arms
        exhibit, computed from already-committed data at zero new compute.
        Until that table exists, "the real arm's P1/P2 reading is
        interpretable" is not supported and C3 should not be marked
        discharged on this batch's strength.

    - id: O3
      severity: material
      statement: >-
        The t=0 endpoint of B2-A's graded family (E_S, "beta distinct
        standard basis vectors ... selected by a random permutation") is the
        identical object that BATCH-f19c37's committed, independent
        investigation (predicate_report.md sec 6(a); p3_attack.py sec D;
        DEC-20260806-14ac13 rationale) proved attains the maximum possible
        departure for ANY rank-beta projector in the standard coordinate
        basis (V = beta(1-beta/d) exactly, zero draws needed) and inverts its
        verdict under an ambient isometry, row permutation, or unimodular
        change of basis of the SAME lattice (identity -> DEPARTURE at
        z=+465.48, DCT rotation -> ANOMALY_BELOW_NULL/instrument-fault at
        z=-17.98, Haar rotation -> AGREEMENT at z=-0.50). That investigation
        concluded "P3 IS REFUSED AS AN ADJUDICATOR" and bound all successors
        in this goal to AM-4's invariance requirement. B2-A's P3 uses a
        different statistic (ratio_2em10, CBD-drawn, vs V, deterministic) but
        the SAME t=0 construction, and was not tested for isometry
        invariance. B2-A's headline "the instrument CAN discriminate a real
        effect" is not established free of the presentation-artifact concern
        the program's own (uncited) sibling batch raised about the identical
        object one statistic over.
      cheapest_check: >-
        Re-run p3_attack.py's section D pattern (already written and
        committed at BATCH-f19c37/reviews/TASK-20260806-ca8dc7/p3_attack.py)
        against B2-A's own E_S/graded-family construction: apply an ambient
        isometry (e.g. a DCT or Haar rotation) to the whole coordinate
        system before drawing E_S as "beta columns of a random permutation
        of that rotated basis," and check whether B2-A's ratio_2em10-based
        P3 verdict is preserved. Zero new BKZ needed; pure numpy, seeds
        already fixed.
      required_remedy: >-
        Either demonstrate B2-A's P3 is isometry-invariant (in which case it
        differs materially from f19c37's P3 and the concern is discharged),
        or, if it is not, retire "coordinate-aligned vs Haar via a synthetic
        E_S" as an adjudicator in this goal's successor batches, consistent
        with AM-4, and record that B2-A's P3 pass is a presentation fact
        rather than evidence the instrument is sensitive to a lattice
        property.

    - id: O4
      severity: moderate
      statement: >-
        B2-B's lane (a) bound for R20 (SSH) is stated as "<= 0 bits, EXACTLY
        ... not merely 'may be'," resting on the quoted clause "generating an
        ephemeral key exchange keypair for ECDH and ML-KEM per connection is
        REQUIRED." No committed artifact in this campaign addresses whether
        this "per connection" language governs SSH transport-layer
        re-keying (RFC 4253 sec 9, SSH_MSG_KEXINIT re-exchange within an
        existing connection, which does not terminate or restart the
        "connection"). I fetched the primary source directly this session
        (https://www.ietf.org/archive/id/draft-ietf-sshm-mlkem-hybrid-kex-10.txt)
        and confirmed: the document does not address re-keying at all;
        "per connection" is the only granularity stated. R21 (IKEv2)'s
        quoted text -- "for each ML-KEM key exchange" -- is more robust to
        this concern, since IKEv2 rekeys (CREATE_CHILD_SA) are themselves
        key-exchange events under the draft's own terms.
      cheapest_check: >-
        WebFetch of draft-ietf-sshm-mlkem-hybrid-kex-10 (already performed
        this session; see notes.md sec 4). Confirms the gap is real, not
        merely hypothetical -- the source text is silent, not merely
        differently worded.
      required_remedy: >-
        Soften "EXACTLY 0 ... not merely may be" for R20 specifically to
        acknowledge the rekey-granularity gap the source text leaves open
        (near-certainly benign, since rekeying's cryptographic purpose is
        fresh key material, but not textually established), or check the
        SSH working group's mailing list / errata for an explicit rekey
        statement before asserting textual certainty. Does not change the
        M=1 conclusion; changes only the confidence qualifier.

    - id: O5
      severity: minor
      statement: >-
        P5's "roughly the predicted factor" adjudication criterion carries
        no pre-declared numeric tolerance band in prediction_frozen.json.
        The measured 7.8-11.3% discrepancy from the naive formula is
        therefore adjudicated as "consistent" against no frozen threshold --
        the same "a decision rule must partition the space of outcomes, not
        the range of a quantity" defect (DF-3) already named twice earlier
        in this campaign (K1's malformed branches; T2's original 4s gate).
      cheapest_check: >-
        Read prediction_frozen.json P5_falsifier.adjudication verbatim: "no
        additional pass/fail band is imposed on the magnitude beyond
        direction, per the handoff's own qualifier 'roughly'." Confirms no
        band was declared before measurement.
      required_remedy: >-
        A successor task must pre-declare a numeric tolerance band for the
        magnitude check (e.g. a stated percent or SE-of-discrepancy bound)
        before any future P5 rerun, consistent with AM-3's requirement that
        false-failure/adjudication tolerances be computed and declared in
        advance.

    - id: O6
      severity: minor
      statement: >-
        The graded family's interior points (0<t<1) have no principled
        statistical interpretation. Q_t = QR(sqrt(1-t) E_S + sqrt(t) G) is
        not a canonical distribution on the Grassmannian (e.g. a
        matrix-variate Bingham or von Mises-Fisher family); it is an ad hoc
        "normalize-then-add-then-QR" parametrization. "Strictly monotone
        non-increasing across the 7-point grid" is a true, verified fact
        about this particular construction's geometry, but should not be
        over-read as a validated statement about a physically meaningful
        continuum of "degree of coordinate alignment."
      cheapest_check: >-
        No standard-family closed form is cited anywhere in
        prediction_frozen.json or measure.py for 0<t<1; only t=0 and t=1
        have derived laws (E_S exact V, Haar exact Beta).
      required_remedy: >-
        None required for P1-P5 (they only read t=0, t=1, verified
        unaffected by D-1). Any future task that assigns quantitative
        meaning to an interior-t value should state explicitly that it is a
        property of this parametrization, not a physical alignment measure.

    - id: O7
      severity: minor
      statement: >-
        POSITIVE FINDING, recorded for completeness. The D-1 defect-fix claim
        ("does not affect P1-P5") is independently re-derived and confirmed
        correct: QR is invariant under independent positive per-column
        rescaling of its input; at t=0 the G-term vanishes identically
        (independent of G's normalization) and at t=1, QR(G) = QR(G
        normalized) exactly by the same invariance applied to G alone. No
        objection to this specific claim.
      cheapest_check: n/a -- verified algebraically, see notes.md sec 6.
      required_remedy: none.

  required_controls:
    - id: RC-1
      priority: 1
      control: >-
        Compute and report a false-negative / power table for P1/P2 itself
        (not P3) against the already-collected unreduced, LLL-only, and
        interior-graded-t arms, at the same N=2^20, 8-basis budget used for
        the real arm. Zero new compute; the numbers already exist in
        results.json / report.md sec 7.
      blocks: >-
        Any claim that the real arm's P1/P2 PASS is informative about the
        Beta tail law (blocks the C3 "AGREEMENT" branch specifically).
    - id: RC-2
      priority: 1
      control: >-
        Reconcile BATCH-5a4656 against the BATCH-436ddd/f19c37/a44d08
        lineage in the Coordinator's ledger archive for this batch: state
        explicitly whether AM-3 and AM-4 apply to B2-A's demonstration and,
        if so, whether B2-A's P3/G3-equivalent construction clears them.
      blocks: Any C3 adjudication that treats this batch as self-contained.
    - id: RC-3
      priority: 2
      control: >-
        Run the ambient-isometry / row-permutation control (adapting the
        already-committed p3_attack.py) against B2-A's own E_S construction
        to test whether its ratio_2em10-based P3 verdict is presentation-
        dependent, the same way f19c37's V-based P3 was shown to be.
      blocks: The claim that "the instrument CAN discriminate a real effect."
    - id: RC-4
      priority: 2
      control: >-
        Check the SSH ML-KEM hybrid draft's working-group list/errata for
        an explicit rekey statement, or soften R20's certainty qualifier.
      blocks: >-
        The "EXACTLY 0 ... not merely may be" certainty qualifier
        specifically for R20; does not block the M=1/G<=0 conclusion itself.
    - id: RC-5
      priority: 3
      control: >-
        Pre-declare a numeric tolerance band for P5's magnitude check before
        any rerun, per AM-3's stated requirement.
      blocks: nothing in this batch; binds the next rerun.

  counterexample_or_mutation: >-
    RC-1's table (O2's cheapest_check) is itself the counterexample: it shows
    P1's frozen rule, applied to a KNOWN, already-measured, genuinely
    non-forced departure (the unreduced arm), returns PASS in 3 of 4 cells.
    This is a concrete demonstration that a real Beta-departure of the
    magnitude actually present in this campaign's own toy-scale arms would
    be invisible to the exact predicate used to adjudicate C3's real arm.

  baseline_comparison: >-
    Not a Pollard-rho/BSGS-scoped result; the relevant baseline here is the
    goal's own single-target primal_bdd/RC.MATZOV cost (Kyber512/768/1024:
    140.1994731076207 / 200.9587149140538 / 270.7236234535225 bits, beta
    389/606/855) against which best-of-M selection is measured. B2-B's lane
    (a) result (<=0 bits) leaves this baseline untouched by construction
    (M=1 admits no selection). Lane (b) states no bound, so no comparison is
    computed there, correctly. The van Oorschot-Wiener time-memory
    interpolation is not directly applicable (this is not a birthday-style
    search), but its cost-bookkeeping analog -- CM-2, the unpriced
    C_query/C_storage/C_selection terms -- is named explicitly by B2-B as an
    unquantified >=0 lower-bound gap. No baseline-comparison defect found in
    B2-B beyond O4.

  heuristic_challenges:
    - The convexity bound (G <= log2 M) used for B2-B's lane (a) zero result
      is unconditional (uses only the sign of f'', not its magnitude), so no
      heuristic challenge applies there.
    - B2-A's P5 falsifier formula (sd(R)/E[R] ~ sqrt(2(1-beta/d)/beta)) is
      explicitly labeled by the producer as "a proxy for how the
      coordinate-alignment excess should scale, not a fully re-derived
      prediction" -- the batch itself flags this rather than overclaiming
      derivation; the open question (a next-order term vs a second
      slower-decaying component) is correctly left open, not resolved by 2
      beta points. See O5 for the missing pre-declared tolerance.

  cost_model_challenges:
    - B2-B's CM-2 treatment (naming C_query, C_storage, C_selection as
      explicit unquantified >=0 line items) is sound and matches this
      campaign's prior red-team/validator objections. No new challenge
      beyond what B2-B already discloses.

  reduction_and_scope_challenges:
    - >-
      B2-C's affected-vs-safe scope is not inflated: it explicitly disclaims
      any vulnerability claim at any count, in any of the eight
      count-unstated modes, and the R09/R22/R12/R14 caveats are carried
      forward rather than dropped. No objection.
    - >-
      B2-B's scope is correctly split per-lane and never blends the two
      lanes into one figure, as its own completion gate required. No
      objection beyond O4.

  proof_architecture_challenges: []

  c1_c2_c3_adjudication:
    C1: >-
      PARTIALLY MET, on the goal's own terms. Lane (a) (R20, R21): a
      genuine, curvature-independent zero bound is established (G <=
      log2(1) = 0), with O4's caveat that "EXACTLY, not merely may be"
      overstates textual certainty for R20 specifically (SSH rekeying is
      unaddressed in the source). Lane (b) (eight count-unstated modes):
      correctly and honestly reports no bound is sourceable, matching the
      goal's own ceiling_known_in_advance framing and the K1 precedent
      against manufacturing a number from an absence. C1's own text is
      satisfied by "X may be 0" for the lane where a number exists and by an
      honest non-statement for the lane where none does; the Coordinator
      should record this split explicitly rather than as a single global
      bound.
    C2: MET, unchanged from BATCH-a51f91 (CX-1 restated verbatim by B2-C, no
      new objection raised here).
    C3: >-
      NOT CLEANLY MET -- this report's central finding. The repaired
      instrument's own sub-tests (P3, P4) genuinely demonstrate that
      ratio_2em10 has dynamic range on synthetic extremes and that this
      range is CBD-driven rather than a pure-geometry artifact (P4 is a real
      and well-designed control). But three compounding problems remain
      unaddressed: (1) O2 -- P3/P4/P5 exercise a DIFFERENT decision rule
      than P1/P2, the only test that reads the real arm, and this batch's
      own already-computed numbers show P1's frozen rule would MISS a known,
      real, non-forced departure of the magnitude this batch's own
      unreduced arm exhibits, in 3 of 4 cells; (2) O3 -- the t=0 endpoint
      P3 relies on is the identical object this program's own (uncited)
      sibling batch proved is a presentation artifact, refused as an
      adjudicator under AM-4, and this batch's P3 was never tested for
      isometry invariance; (3) O5 -- P5's magnitude match is adjudicated
      against no pre-declared tolerance band. C3's own text requires that
      "AGREEMENT SATISFIES C3 AS FULLY AS DEPARTURE" -- but only if the
      instrument DEMONSTRATES power to detect departure, and that has not
      been shown for P1/P2 specifically. This report reads C3 as still
      closer to BATCH-a51f91's original NEITHER / instrument-outcome
      adjudication than to a clean pass, notwithstanding real, useful
      narrowing of the diagnosis (P3/P4 work as designed on their own,
      different, terms). The goal MAY NOT close under its own stop rule on
      the strength of this batch alone. This is a finding for the
      Coordinator's adjudication, not a status change made by this report.

  narrowest_supported_statement: >-
    B2-B's lane (a) zero bound and B2-C's normative-gap write-up are sound
    and stand largely as reported, with O4's confidence-qualifier caveat on
    R20. B2-D's acquisition procedure and its disclosed hash-instability
    finding are sound and honestly reported; no objection. B2-A's P3/P4
    genuinely establish that the ratio_2em10 statistic responds to a
    CBD-driven, coordinate-alignment contrast on SYNTHETIC test objects at
    the toy cells measured (d<=140, beta<=40) -- this is real, verified
    progress over BATCH-a51f91's dead instrument. It does NOT establish that
    P1/P2, the predicate that actually reads the real arm, has power to
    detect a departure of the magnitude this campaign's own toy-scale data
    shows is achievable, nor that P3's own construction is free of the
    presentation-dependence this program's own uncited sibling batch already
    proved for the identical extreme object. C3 is not discharged by this
    batch. Nothing here is crypto-scale evidence (toy tier, d<=140, beta<=40,
    unchanged).

  should_batch_3_run_guidance: >-
    Before any further C3 attempt in this goal: (1) reconcile the two
    lineages (O1/RC-2); (2) compute P1/P2's own power table on already-
    collected data (O2/RC-1) -- this is free and should happen before any
    new BKZ work; (3) test B2-A's P3 for isometry invariance (O3/RC-3) using
    the already-committed p3_attack.py pattern; (4) if a genuinely
    AM-4-admissible statistic is still not found, treat "no admissible
    predicate exists, here is the obstruction" as a legitimate outcome per
    docs/inventor-protocol.md sec 4 rather than continuing to iterate
    variants of the same coordinate-vs-Haar contrast.

  verdict: fail
  verdict_note: >-
    Per-producer: B2-B pass_with_constraints (O4), B2-C pass (no material
    objection), B2-D pass (no material objection). B2-A, and therefore the
    batch's central claim that C3 is now advanced to a clean, interpretable
    real-arm reading, is FAIL: O1-O3 are material and compounding, and O2 in
    particular is a concrete, already-computable demonstration (not a
    hypothetical) that the predicate actually used on the real arm lacks
    demonstrated power at the relevant magnitude. The overall batch verdict
    is recorded as `fail` because the batch's stated purpose (repair the C3
    instrument so it can discharge a completion criterion) is not achieved,
    notwithstanding genuine partial progress (P3/P4 work as designed, on
    their own narrower terms) and three sound, zero-compute sibling
    deliverables (B2-B/C/D).

  next_concrete_action: >-
    Coordinator: before any ledger archive treats C3 as advanced by this
    batch, require RC-1 (P1/P2's own power table against already-collected
    unreduced/LLL-only/interior-t arms, zero new compute) and RC-2
    (reconciliation against BATCH-436ddd/f19c37/a44d08 and explicit AM-3/AM-4
    applicability) before deciding whether this batch's C3 state is NEITHER,
    INVALID, or something narrower than either. Do not mark C3 met on this
    batch's evidence alone.

