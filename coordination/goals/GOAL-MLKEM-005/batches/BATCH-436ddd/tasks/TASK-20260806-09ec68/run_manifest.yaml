# ---------------------------------------------------------------- config
configuration:
  cells: [[100, 30], [100, 40], [140, 30], [140, 40]]
  k: d/2
  q: 3329
  error_law: CBD_{eta=2} (FIPS 203), plus an iid N(0,1) law for the null of the null
  errors_per_cell: 1048576          # 2^20
  draws_per_arm: 8
  bases_per_cell: 8
  reduction: LLL, then BKZ-beta with max_loops=2, pruning-free in-process strategies
  statistic: R = ||Q^T e||^2 / ||e||^2, Q the orthonormal tail-beta GSO frame
  quantile_estimator: q_emp(p) = sort(R)[round(p*N)-1]   # frozen in BATCH-a51f91
  tail_levels: [2^-10, 2^-16]
  gate: '|mean_A - mean_haar| >= 4 * sqrt(sd_A^2/8 + sd_haar^2/8)'
  graded_t: [0.0, 0.05, 0.10, 0.25, 0.50, 0.75, 1.00]
  beta_trend_betas: [30, 40, 50, 60]
  beta_trend_reduction_held_fixed_at: LLL + BKZ-40
  arms:
  - haar_null        # the null arm, seeds identical to BATCH-a51f91
  - real_bkz         # tail-beta GSO of the LLL+BKZ-beta basis
  - lll_only         # NEW: tail-beta GSO after LLL, before BKZ
  - unreduced        # NEW: tail-beta GSO of the raw q-ary basis
  - graded_t{0,0.05,0.10,0.25,0.50,0.75,1.00}   # NEW sensitivity demonstration
  - '<all of the above under an iid N(0,1) error>'   # NEW: null of the null

