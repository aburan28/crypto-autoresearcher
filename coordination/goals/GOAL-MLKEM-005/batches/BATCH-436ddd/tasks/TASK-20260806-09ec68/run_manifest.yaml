    G2_low_end_t1_gate_does_NOT_clear: {d100_b30: true, d100_b40: true, d140_b30: true, d140_b40: true}
    G2_shift_in_se_of_difference: {d100_b30: 2.19, d100_b40: 2.03, d140_b30: -1.36, d140_b40: 1.02}
    G3_monotone_non_increasing_in_t: {d100_b30: false, d100_b40: false, d140_b30: false, d140_b40: false}
    verdict: {d100_b30: INVALID, d100_b40: INVALID, d140_b30: INVALID, d140_b40: INVALID}
    dynamic_range_in_se_of_difference: {d100_b30: 46.6, d100_b40: 64.2, d140_b30: 53.7, d140_b40: 75.9}
    both_ends_exhibited: true
    self_reported_defect_in_MY_pre_registration: >-
      G3 required a strict ordering across all seven t. The single step
      t = 0 -> 0.05 carries 98.8-101.4% of the dynamic range and every later
      step is <= 0.78 SE, i.e. noise; six exchangeable draws are non-increasing
      with probability 1/720. The family's own algebra shows why: the expected
      coordinate overlap is A(t) = (1 + (beta-1)t)/(1 + (d-1)t), whose range
      midpoint is at t = 1/(d+1) = 0.0099 (d=100) / 0.0071 (d=140), so the
      grid's first interior point t = 0.05 is already past the informative
      region. That algebra was available before the run. G3 was therefore very
      nearly unsatisfiable by construction -- the mirror image of the superseded
      demonstration's condition that could not fail, and the same DF-3 failure
      mode. See b2a_report.md Part 6.3.
    what_was_NOT_done: >-
      The verdict was NOT re-scored, NOT relaxed, NOT reclassified to PARTIAL
      (the PARTIAL branch excludes adjacent violations and all violations were
      adjacent), and the run was NOT repeated on a better grid. Diagnosing my
      own threshold is not the same as changing it.
  null_of_the_null:
    N1_all_arms_within_P1_tolerances: {d100_b30: true, d100_b40: true, d140_b30: true, d140_b40: true}
    N2_coord_gate_does_NOT_clear_under_gaussian_error: {d100_b30: true, d100_b40: true, d140_b30: true, d140_b40: true}
    verdict: PASS in all four cells
  falsifier_1_over_sqrt_beta:
    tested_at_beta: [30, 40, 50, 60]
    beyond_30_40: [50, 60]
    unreduced: {d100: FALSIFIED, d140: FALSIFIED}
    unreduced_observed_D60_over_D30: {d100: 1.1805, d140: 2.0949}
    unreduced_predicted: {d100: 0.5345, d140: 0.6030}
    coord_t0: {d100: NEITHER, d140: NEITHER}
    coord_t0_observed_D60_over_D30: {d100: 0.7249, d140: 0.7544}
    lll_only: {d100: NOT APPLICABLE, d140: NOT APPLICABLE}
    real_bkz40: {d100: NOT APPLICABLE, d140: NOT APPLICABLE}
    not_applicable_reason: >-
      D(beta=30) does not clear its own 4*SE gate on those arms, so there is no
      departure to decay. This branch was declared in advance.
  P1_P2:
    null_arm_first: PASS/PASS in all four cells (P1 passes BY CONSTRUCTION; the unit test that is not a control)
    real_arm: PASS/PASS in all four cells
    prominently_reported: >-
      P1 AND P2 EMIT THE SAME VERDICT ON THE NULL ARM AS ON THE REAL ARM IN ALL
      FOUR CELLS, so the real-arm verdict is NOT read as discriminating.
    interpretation_status: >-
