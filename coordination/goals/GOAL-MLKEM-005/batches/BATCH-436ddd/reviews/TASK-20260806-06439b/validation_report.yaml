findings:
  - id: F-1
    severity: minor
    class: harness, not producer
    title: The self-freeze is code-enforced but not externally notarised.
    detail: >-
      B2-A's freeze is the strongest I have seen in this campaign and I could
      verify everything about it except its wall-clock ordering, because the
      snapshot commit landed after the whole task. The producer did more than
      the harness asked; the harness is what should change.
    suggested_remedy: >-
      Have the dispatcher require a pre-run commit (or any external timestamp)
      of the pre-registration hash alone before authorising the measure phase.
      Cheap, and it converts a self-report into a verifiable ordering.
    blocks_admission: false

  - id: F-2
    severity: minor
    class: reporting accuracy
    title: 'Two numbers in the deliverables do not match the data.'
    detail: >-
      (a) b2a_report.md Part 4 states "Largest deviation at 2^-10 is 0.0016";
      the actual maximum over all Gaussian arms and cells is 0.001711
      (d100_b30, unreduced). (b) run_manifest.yaml explicit_non_claims
      describes "the 27-42 SE departure on the unreduced q-ary arm"; the actual
      range across the four cells is 15.62 to 42.26 SE -- the manifest's floor
      is the d = 100 floor, not the range's. Neither touches a verdict: (a) sits
      against a tolerance of 0.05 and (b) appears in a disclaimer where it
      overstates the minimum effect rather than the maximum.
    blocks_admission: false

  - id: F-3
    severity: minor
    class: reproducibility
    title: The measured A(t) table is report-only.
    detail: >-
      The A(t) diagnostic in Part 6.3 -- the table that carries the
      self-diagnosis -- is not in b2a_results.json and no shipped script emits
      it. The report labels it honestly as a post-hoc deterministic diagnostic
      outside the pre-registered adjudication. I REPRODUCED IT MYSELF from
      seed_graded to every printed digit, so it is correct and it is
      reproducible; but a reader who did not do that would be taking on trust
      the one table that determines what the successor should do.
    suggested_remedy: emit the diagnostic into the results JSON, or ship the helper.
    blocks_admission: false

  - id: F-4
    severity: cosmetic
    class: presentation
    title: Part 7's "pooled" column header sits beside a mean-of-draws shift column.
    detail: see V4.presentation_note. No verdict affected.
    blocks_admission: false

  - id: F-5
    severity: none -- recorded as commendation, and recorded because the incentive matters
    title: The producer wrote and enforced tests against its own interest, four separate times.
    detail: >-
      It hash-froze a pre-registration containing no tunable quantity; it
      declared a low-end condition (G2) its instrument could have failed; it
      declared a falsifier that then fired against the largest number it
      measured; and it declined a PARTIAL reclassification that was available in
      the more lenient of its own two rule statements. It also reported a
      defect in its own pre-registration WITHOUT acting on it. That combination
      is what makes the package's negatives worth something, and it should be
      recorded so the next executor knows it is the behaviour that gets a
      package admitted.

no_findings_of_the_following_kinds:
  - No fabricated number. Every quantity I sampled traced to shipped raw data or to a closed form.
  - No overclaim. The scope statements are accurate and if anything understate the arms' breadth (F-2b).
  - No status change, hypothesis disposition, heuristic validation or knowledge promotion by the producer.
  - No ML-KEM or FIPS 203 claim in either direction anywhere in the package.
  - No re-scoring of BATCH-a51f91's P1/P2 against a different rule.
  - No transport of any d <= 140, beta <= 60 number to beta = 606, d = 1420.
  - No write outside the declared scope; no git operation by the producer.

