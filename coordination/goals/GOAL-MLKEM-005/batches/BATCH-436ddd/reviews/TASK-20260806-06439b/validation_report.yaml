    partial_clause_as_written: >-
      "if G1 holds, G2 holds and G3 fails only at non-adjacent interior points
      within 1 * SE_diff, the outcome is PARTIAL"
    adjudication_under_three_readings:
      reading_1_prose_full: >-
        Requires non-adjacent AND interior AND within 1*SE. Every cell has at
        least two violations at CONSECUTIVE grid indices (|3-2|, |5-4|, |4-3|,
        |5-4|), so non-adjacency fails in all four. Additionally, three of four
        cells place a violation at t = 1.00, the grid ENDPOINT, which is not an
        interior point. PARTIAL excluded 4/4.
      reading_2_as_coded: >-
        b2a.py checks only within-1-SE and pairwise non-adjacency of
        consecutive violations; it omits the interior test, i.e. the CODE IS
        MORE LENIENT TO THE EXECUTOR THAN ITS OWN PROSE. Even so, PARTIAL
        evaluates False in all four cells on adjacency alone. PARTIAL excluded
        4/4. I re-ran this predicate myself on the JSON and reproduced False in
        every cell.
      reading_3_most_lenient_i_could_construct: >-
        Read "non-adjacent" as a property of the grid POINTS at which the mean
        rises rather than of the violating steps. d100_b30 rises into t =
        0.10 and 0.25 (adjacent); d100_b40 into 0.50, 0.75, 1.00 (adjacent);
        d140_b30 into 0.25 and 0.50 (adjacent); d140_b40 into 0.50, 0.75, 1.00
        (adjacent). PARTIAL excluded 4/4 again.
      degenerate_reading_rejected: >-
        One could read "adjacent" as "between adjacent grid values", which is
        trivially true of every successive difference and would make PARTIAL
        unreachable by construction. I reject that reading precisely because it
        is degenerate -- but note it also yields INVALID, so the verdict is
        robust to it.
    finding: >-
      THE VERDICT IS ROBUST UNDER EVERY READING I CAN CONSTRUCT, INCLUDING THE
      ONES THAT FAVOUR THE EXECUTOR. The executor did NOT over-punish itself.
      It did not have a PARTIAL available and correctly declined to invent one.
      The PARTIAL branch is implemented and reachable in the code (the smoke run
      is recorded as exercising it), so it was not a dead branch written for
      appearance.
    on_the_self_diagnosis: >-
      SEPARATELY VERIFIED AND CORRECT, and this is the finding the successor
      needs. The closed form A(t) = (1 + (beta-1)t)/(1 + (d-1)t) has range
      midpoint at t = 1/(d+1) exactly -- I solved it: 1 + (beta-1)t = 0.65(1 +
      (d-1)t) at beta/d = 0.3 gives t = 1/101 = 0.009901 at d = 100 and 1/141 =
      0.007092 at d = 140, matching the report's 0.0099 and 0.0071. I then
      reproduced the report's MEASURED A(t) table independently from
      seed_graded alone, in a script of my own, and got every printed digit:
      0.38032 +- 0.01121 and 0.35401 +- 0.00383 at t = 0.05, then 0.33871 /
      0.32028, 0.31193 / 0.29896, 0.30267 / 0.29167, 0.29957 / 0.28920, 0.29806
      / 0.28792. The "88.5% of the alignment excess is gone by t = 0.05" and
      "98.3% by t = 0.25" figures recompute exactly at d = 100 (and 90.4% /
      98.1% at d = 140, which the report does not state). THE GRID IS IN THE
      WRONG PLACE AND THE ALGEBRA SAYING SO WAS AVAILABLE BEFORE THE RUN. G3
      demanded a strict ordering among six arms that are statistically
      indistinguishable, which for exchangeable draws succeeds with probability
      1/6! = 1/720. The diagnosis is correct, it is verifiable from shipped
      seeds, and it is a defect in the SPECIFICATION the executor was handed as
      much as in the executor's own pre-registration -- the seven t values are
      fixed verbatim in DEC-20260805-4823db next_actions.
    what_i_will_not_say: >-
      I do not conclude that the demonstration "really" passed, that the
      verdict should be reclassified, or that the real arm may now be
      interpreted. It may not. The rule was frozen, the rule was applied, and
      the rule returned INVALID. Diagnosing a bad threshold after the fact is
      exactly as impermissible for me as it was for the executor.

