scope_of_this_validation:
  what_i_checked: >-
    Artifact integrity against the snapshot receipt; the pre-registration
    freeze by three independent routes; the gate arithmetic recomputed from raw
    per-draw values for every arm in every cell; G1/G2/G3 and the twelve
    monotonicity violations; the PARTIAL predicate under three readings; the
    falsifier's predicted and observed ratios; the Gaussian null of the null;
    the 32-lattice reduction reproduction against the prior batch's own file;
    the cache-absence claim; the A(t) self-diagnosis reproduced from seeds; and
    the adjudication code itself.
  what_i_did_not_check:
    - B2-B, B2-C and B2-D (b2bcd_notes.md). Not in my remit for this task.
    - >-
      The fpylll reductions themselves. I verified they reproduce BATCH-a51f91
      bit-for-bit; I did not independently re-derive that BKZ-40 on those seeds
      is correct, which would require the same solver.
    - The primal_bdd optimize_d anomaly, carried forward unchecked.
    - Anything about ML-KEM. Nothing here is about ML-KEM.
  claim_tier_of_everything_above: TOY
  explicit_non_claim: >-
    Nothing in this report supports any statement about ML-KEM security or any
    FIPS 203 parameter set, in either direction. The measurements are at d in
    {100, 140} and beta in {30, 40, 50, 60} on a q-ary lattice with q = 3329.
    They are not evidence about beta = 606, d = 1420.

