    is_this_the_canonical_artifact_tell:
      answer: YES, and the numbers show exactly that
      reasoning: >-
        The pre-registration named beta as the parameter that should DESTROY an
        alignment departure, derived a ~1/sqrt(beta) decay from the Beta law's
        own coefficient of variation, and declared FALSIFIED at ratio >= 0.90
        BEFORE the run. Doubling beta from 30 to 60 should have left 53.5% of
