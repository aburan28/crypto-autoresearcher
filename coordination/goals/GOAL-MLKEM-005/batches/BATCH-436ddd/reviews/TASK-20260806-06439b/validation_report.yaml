    the_proposed_mechanism:
      claim: >-
        For beta <= d-k = d/2 the tail-beta GSO window lies inside the q*I block
        of [[I_k, A],[0, q I_{d-k}]], which is exactly coordinate-aligned, so
        alignment does not dilute as beta grows within that range.
      status: PLAUSIBLE, CONSISTENT WITH BOTH SERIES, NOT TESTED
      my_assessment: >-
        The mechanism predicts a break at beta > d/2. At d = 100 that is beta =
        50, and beta = 60 is the only point in either table past a boundary --
        and it is the only point where the d = 100 series falls (0.0786 ->
        0.0481). At d = 140 the boundary is beta = 70, no point crosses it, and
        the series rises throughout. The prediction and the data agree at the
        one place they can. THAT IS SUGGESTIVE AND IT IS NOT A TEST: two series
        with one crossing point between them is a single coincidence with a
        story attached. The decisive experiment is cheap and the executor names
        it -- VARY k AT FIXED d AND beta and watch the boundary move. The
        executor explicitly lists this under "what I could not evaluate" and
        claims nothing from it. That is the correct handling and I endorse it.
    marginal_call_i_am_flagging: >-
      coord_t0 at d = 140 returns 0.7544 against a CONSISTENT band whose upper
      edge is 0.7537 -- outside by 0.0007, about 0.1%. NEITHER is the correct
      call on the frozen band and the executor took it without comment. I
      checked whether the rounding of the band's inputs could flip it: the band
      is built from the 4-dp-rounded predicted ratio (1.25 * 0.6030 = 0.75375),
      and from the unrounded ratio it would be 0.75374 -- still below 0.7544.
      THE CALL STANDS UNDER BOTH. I record it because a reader should know the
      NEITHER at d = 140 is a knife-edge and the one at d = 100 (0.7249 vs
      0.6681) is not, and because it is a place where a less careful producer
      would have rounded itself into CONSISTENT.

  # -----------------------------------------------------------------
  - id: V6
    question: 'Criterion discharge: does B2-A discharge a completion criterion?'
    verdict: NO. B2-A DISCHARGES NO COMPLETION CRITERION. C3 IS NOT MET.
    this_is_the_answer_to_the_question_the_batch_was_dispatched_to_ask: true
    reasoning:
      - id: R1
        title: The governing decision already adjudicated this exact structure and ruled it unmet.
        detail: >-
          C3's third branch reads "or NEITHER, with the sensitivity
          demonstration's failure recorded as an INSTRUMENT outcome". A literal
          reading might hold that reaching that branch discharges C3. THAT
          READING IS FORECLOSED BY THE GOVERNING DECISION, which faced the
          identical situation one batch ago: DEC-20260805-4823db K3 records
          that EV-MLKEM-d146a5 "adjudicates T2 to C3's NEITHER branch", and the
          same decision's what_is_NOT_established states without hedging "C3 is
          unmet. The instrument failed its own gate; its real-arm numbers are
          uninterpretable until the missing arm runs." B2-A's instrument failed
          its own gate (G3) and B2-A's real arm is likewise uninterpretable by
          its own pre-registration. The precedent binds and it points one way.
      - id: R2
        title: A second, independent reason that survives even if R1 is disputed.
        detail: >-
          C3 asks for the projected-error left-tail measurement WITH ITS
          PRE-REGISTERED PREDICTION ADJUDICATED. The prediction is P1/P2. B2-A
          reports, prominently and correctly, that P1 AND P2 EMIT THE SAME
          VERDICT ON THE NULL ARM AS ON THE REAL ARM IN ALL FOUR CELLS. I
          confirmed this: the Haar arm passes P1 at 0.998570 / 0.999141 /
          1.001023 / 0.999897 and P2 at a between-fraction of 0.0000000, and
          the real arm passes at 0.998295 / 1.000538 / 0.999538 / 1.000998 with
          between-fractions 5.0e-07 to 7.4e-07. A predicate that returns PASS on
          an arm constructed to satisfy it cannot adjudicate anything when it
          returns PASS on the real arm. C3's own text anticipates this failure
          mode -- "Reporting only E[R] does NOT satisfy C3: E[R] = beta/d is
          forced" -- and the same objection applies with equal force here. SO
          EVEN A VALID DEMONSTRATION WOULD NOT HAVE DISCHARGED C3 ON THESE
          NUMBERS.
      - id: R3
        title: No other criterion is in play.
        detail: >-
          C1 is B2-B's, and B2-B ran at zero new compute and produces a stated
          bound, not a measurement -- outside my remit here and not assessed.
          C2 was already met in BATCH-a51f91. C4 and C5 are procedural and, per
          the decision's own citation of the DEC-20260803-64b55b and
          DEC-20260805-0b3e11 precedent, CANNOT carry a completion on their own.
    consequence_for_the_goal: >-
      The stop rule requires C1-C3 MET. C3 is not met. GOAL-MLKEM-005 cannot
      close on this batch. I record this as a validator's finding and change
      nothing; only a Coordinator decision moves the goal.
    and_the_symmetric_warning_which_i_consider_equally_binding: >-
      B2-A IS NOT A NULL BATCH AND MUST NOT BE READ AS ONE. Premature closure is
      a failure mode symmetric with overclaiming (CLAUDE.md rule 9,
      docs/inventor-protocol.md), and this package moves C3 materially closer,
      in a way I verified rather than took on trust:
        - The instrument's discriminating power is now DEMONSTRATED rather than
          assumed -- 47.8 to 77.2 SE at the high end, correctly silent at the
          low end, and correctly silent again under a spherical error. The DF-1
          and DF-2 defects that broke BATCH-a51f91's demonstration are repaired.
        - The obstruction to C3 has changed KIND. In BATCH-a51f91 it was a
          broken control. Now it is a MISPLACED GRID -- a one-line change to the
          t values, with the correct placement derived from a closed form I
          reproduced from the frozen seeds. The cost of the repair is one more
          run at under half this task's budget.
        - The three missing arms ran and produced a sharp, verified pattern.
        - The falsifier fired, which retires the largest number in the package
          rather than promoting it.
      A decision that cites "C3 unmet" as grounds to pause or retire this goal
      would be citing a non-terminal condition the goal record bars by name
      ("a measurement returns a negative result"; "a task's declared control
      failed"). The honest position is the one DEC-20260805-4823db already
      took and which is now MORE strongly supported, not less: C3 is reachable,
      by this instrument, after a specified repair.
    what_the_successor_needs_and_who_must_decide_it:
      - >-
        The seven t values are frozen in DEC-20260805-4823db next_actions, so
        the executor was RIGHT not to substitute a better grid, and a successor
        cannot fix this either. IT REQUIRES A COORDINATOR DECISION amending the
        grid. That is the single blocking item.
      - >-
        A grid placed where A(t) moves, e.g. t in {0, 0.002, 0.005, 0.01, 0.02,
        0.05, 1}, which brackets 1/(d+1) = 0.0099 and 0.0071 on both sides.
      - >-
        A monotonicity condition that is tie-tolerant: score a step as a
        violation only where the pairwise mean difference exceeds 1 * SE_diff,
        and report indistinguishable points as ties. As written, G3 penalised
        noise at p = 1/720 for a perfectly working instrument.
      - >-
        A discriminating replacement for the P1/P2 adjudication, or an explicit
        Coordinator ruling on what C3's "adjudicated" requires given that P1/P2
        pass identically on the null arm. WITHOUT THIS, A REPAIRED GRID ALONE
        STILL WILL NOT DISCHARGE C3 (see R2). I consider this the more
        important of the two repairs and I do not think it has been named
        before.

