      b0_norm and gso_log2_slope_per_index directly.
    result: n_common = 32; max relative deviation in b0_norm = 0; max absolute deviation in slope = 0
    verdict: CONFIRMED EXACTLY. The same 32 lattices.
    cache_absence_claim: >-
      ALSO CONFIRMED. BATCH-a51f91/tasks/TASK-20260805-708b70/command.txt line 7
      shows --cache-dir pointing at
      /tmp/claude-0/.../5cc33d08-.../scratchpad/bkzcache, an ephemeral
