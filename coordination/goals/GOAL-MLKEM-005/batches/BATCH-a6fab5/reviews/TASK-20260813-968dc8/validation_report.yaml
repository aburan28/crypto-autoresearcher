      result: >-
        All 6 D_route'' values, all 6 VERDICT'' values, the aggregate
        (COVERED=6/6, ALL_SURVIVE=true, SOME_ARTIFACT=false), and the termination branch
        (T-HKZINDEP-CONFIRMED, no -PARTIAL suffix warranted since |COVERED|=6) all
        mechanically re-derive to EXACTLY the producer's own recorded values. Precedence
