        BATCH-6e08fe's own already-archived LLL-quality comparison at these same cells
        (context note above), which this task correctly did not re-run.
    - id: CTRL-3
      control: no_new_reduction_above_d40.
      result: >-
        Confirmed by direct read of measure_hkz_indep.py: CELLS is the sole source of
