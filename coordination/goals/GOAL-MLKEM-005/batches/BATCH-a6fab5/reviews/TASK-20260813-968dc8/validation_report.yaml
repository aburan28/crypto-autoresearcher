  # ====================================================================
  # TARGET 1 -- genuine independence (code) AND genuine HKZ-quality (fidelity)
  # ====================================================================
  independence_and_fidelity_checks:
    - id: IND-1
      check: >-
        Direct grep of the committed measure_hkz_indep.py against calls to
        make_A(/build_basis(/hkz_profile( (the barred kernel of measure_am4.py /
        measure_relvar.py / replicate_l7l8.py) and lll_reduce(/enumerate_svp( (BATCH-6e08fe's
        own ROUTE-I' reduction/enumeration code in measure_route_reimpl.py).
