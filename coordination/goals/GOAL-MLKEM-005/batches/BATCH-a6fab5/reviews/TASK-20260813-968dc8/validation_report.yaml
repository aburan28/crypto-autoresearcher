  # ====================================================================
  # TARGET 3, continued -- is the uniform ~epsilon agreement plausible or suspicious?
  # THE SUBSTANTIVE METHODOLOGICAL FINDING OF THIS REVIEW
  # ====================================================================
  finding_on_the_uniform_D_route_pp:
    the_producers_own_explanation: >-
      hkz_indep_writeup.md section 8 states the identical D_route''=1.7763568394002505e-15
      at all 6 cells "reflects that both routes reach the identical true HKZ profile and
      differ only by floating-point summation-order rounding of order a few 2**-52 in the
      final mean()/log() arithmetic of the hkz observable's own formula, not by any true
      disagreement in the reduced basis itself." This is directionally correct and NOT
      fabricated -- but it is an assertion, not independently demonstrated in the
      producer's own artifacts.
    what_this_review_independently_established: >-
      Using probes/probe1 and probes/probe2 (from-scratch reimplementations of both
      routes' reduction algorithms, never importing either committed script), this
      review DIRECTLY MEASURED the raw HKZ-reduced Gram-Schmidt norms (`r`) produced by
      each route's own reduction/enumeration code, separately from the final `hkz` scalar.
      Result, at every one of 21 tested (cell, basis) pairs spanning all 3 lattice
      dimensions (d=20, 30, 40): **the `r` vectors are BIT-IDENTICAL between ROUTE-P's
      Gram-based/`fpylll.algorithms.bkz.BKZReduction` path and ROUTE-I'''s
      basis-based/`fpylll.fplll.bkz.BKZReduction` path, with ZERO exceptions.** Isolating
      the logdet-formula choice alone (computing `hkz` from the SAME bit-identical `r`
      via BOTH ROUTE-P's `logdet=0.5*sum(log(r))` and ROUTE-I'''s
      `logdet=(d-k)*log(q)` exact closed form) reproduces the FULL observed difference
      exactly, at every basis tested. The entire measured D_route'' is therefore proven
      -- not merely asserted -- to be a deterministic artifact of a downstream
      logdet-computation choice, with ZERO measured disagreement in the actual reduction
      output.
    what_this_implies_the_lam1n_signature_comparison_the_task_card_asked_for: >-
      The task explicitly asks whether this looks more like `lam1n`'s own signature (an
      exact, algorithm-independent invariant) than a fidelity-sensitive statistic's
      signature. The answer, now empirically demonstrated rather than argued: YES. Once
      both routes are genuinely HKZ-quality (this batch's whole purpose, verified per
      IND-5), the `hkz` observable's underlying quantity -- the HKZ-reduced GSO norm
      profile r_i = lambda_1(pi_i(L))^2 -- is itself an essentially unique invariant of
      the lattice for a generic (non-degenerate) instance, exactly the property
      KN-FIND-7de6b6 already established distinguishes `lam1n` from a fidelity-sensitive
      statistic. This review extends that finding (without restating it) to the
      fidelity-MATCHED regime for `hkz` specifically: bit-identical convergence here is
      the EXPECTED, non-suspicious signature of two correct HKZ-quality implementations,
      not evidence of hidden code-sharing (which is separately ruled out by IND-1
      through IND-4) and not a numerical coincidence.
    the_limitation_this_implies_for_what_T_HKZINDEP_CONFIRMED_can_be_read_to_support: >-
      This is a genuine, positive finding for the letter of PREREG-5's own text (Branch
      A explicitly licenses using fpylll's own library, and this measurement satisfies
      that license). It ALSO narrows what the resulting discharge should be understood to
      verify. Both ROUTE-P's `hkz_profile` and ROUTE-I'''s `hkz_route_ii` call the SAME
      underlying `fpylll.Enumeration(...).enumerate(...)` class and method for their
      respective decisive HKZ-sweep and verification-enumeration steps (this review
      confirmed via IND-4 that the surrounding BKZ orchestration classes differ, but the
      shortest-vector-in-a-projected-block primitive that actually determines the final
      `r` values is textually and functionally the same call in both scripts). This
      measurement therefore has genuine power to catch a WRAPPER-level bug (basis
      construction, GSO initialization order, insertion/postprocessing bookkeeping,
      tolerance handling) -- which is exactly the class of bug BATCH-fbb639's original
      code-sharing concern (F-1/RT-1) was about, and exactly what PREREG-5 2.2's license
      was written to permit checking this way. It has essentially NO power to catch a
      defect shared by both routes at the fpylll C++ Enumeration/LLL kernel level, since
      such a defect would be reproduced identically by construction. This is not a
      violation of PREREG-5 (whose own text anticipated and explicitly pre-empted the
      "same library" objection) and does not change the correctly-fired termination
      branch. It IS a scope caveat this review recommends the Coordinator's decision
      record and any knowledge-promotion language carry explicitly alongside "DISCHARGES
      hkz's status to T-INDVERIFY-CONFIRMED-equivalent," so a future reader does not
      read that phrase as ruling out a fpylll-library-level correctness question that
      this specific instrument cannot address.
    context_the_instrument_is_not_vacuous_in_general: >-
      This is not a claim that the D_route mechanism lacks power altogether: BATCH-6e08fe's
      own LLL-quality ROUTE-I' (genuinely no fpylll dependency at all) measured real,
      structured disagreement (0.015-0.223) against the SAME ROUTE-P baseline at these
      SAME cells (already archived, not re-run here), confirming the instrument can and
      does detect a genuine fidelity mismatch when one exists. What this review adds is
      specific to the fidelity-matched, same-library regime this batch newly reaches.

  # ====================================================================
  # positive / negative controls
  # ====================================================================
  control_checks:
    - id: CTRL-1
      control: PREREG-5 3.1's "could-not-fail" check.
      result: >-
