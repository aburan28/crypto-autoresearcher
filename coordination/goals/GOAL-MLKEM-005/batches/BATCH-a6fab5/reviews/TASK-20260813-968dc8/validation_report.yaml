        confirmed). The only ROUTE-P source opened is RESULTS_RELVAR_PATH, pointing at
        BATCH-9e3584's results_relvar.json.
      probe: probes/probe4_independence_grep.out (section 3)
    - id: IND-3
      check: lam1n must not be computed anywhere (out of scope, PREREG-5 section 0).
      result: >-
        Confirmed: both occurrences of the string "lam1n" in measure_hkz_indep.py are
        prose (a comment and a `reads_toward` description string), never a variable name,
        function name, or computed value.
      probe: probes/probe4_independence_grep.out (section 4)
    - id: IND-4
      check: >-
        Structural comparison of the reduction/enumeration code path against BOTH barred
        lineages, beyond a bare function-name grep (the loophole this goal's own history
        requires guarding against -- see KN-FIND-9b5df0).
      result: >-
        `hkz_route_ii` builds its fpylll IntegerMatrix directly from the basis B and
        constructs GSO via `GSO.Mat(A, float_type="double")` (basis-based). ROUTE-P's
        `hkz_profile` (measure_relvar.py) instead builds an integer Gram matrix first and
        constructs GSO via `GSO.Mat(A, gram=True)` (Gram-based) -- a genuinely different
        GSO-construction code path, not merely a renamed copy. More decisively:
        `hkz_route_ii` imports `fpylll.fplll.bkz.BKZReduction` (the low-level Cython
        class, 3-positional-argument constructor `BKZReduction(M, lll_obj, param)`,
        confirmed in this session), while ROUTE-P's `hkz_profile` imports
        `fpylll.algorithms.bkz.BKZReduction` (the high-level pure-Python class, 1-argument
        constructor `BKZReduction(Mg)`, with its own Python-level `tour`/`svp_reduction`
        orchestration -- confirmed by reading its source in this session). These are TWO
        DIFFERENT CLASSES with different constructors and different Python-level
        orchestration code, not the same wrapper under two names. BATCH-6e08fe's own
        ROUTE-I' (`lll_reduce`/`enumerate_svp` in measure_route_reimpl.py) uses NO fpylll
        at all -- pure textbook numpy LLL and a from-scratch Schnorr-Euchner enumeration.
        Three structurally distinct code paths, confirmed by direct read, not by name
        matching alone.
      probe: probes/probe4_independence_grep.out (section 5-7); probes/probe1_reproduce_l7b5.py (lines 63-133, both reduction paths reimplemented independently and verified functionally distinct)
    - id: IND-5
      check: >-
        Branch A fidelity requirement (PREREG-5 2.2 point 2): one BKZ pass at
        block_size=d, an explicit HKZ sweep via Enumeration, an independent per-index
        verification enumeration -- not merely LLL under a different name.
      result: >-
        Confirmed by direct read of `hkz_route_ii`: `BKZ.Param(block_size=d, max_loops=1,
        flags=BKZ.MAX_LOOPS)` + `BKZReduction(...)()`, then an explicit sweep loop calling
        `Enumeration(M).enumerate(idx, d, r_idx, 0)` per index with `svp_postprocessing`
        insertion until convergence (MAX_ROUNDS=40 cap), then a SEPARATE verification loop
        re-enumerating each index at a relaxed bound and reporting
        `verify_max_residual`. This is genuinely the three-part HKZ-quality structure
        PREREG-5 2.2 requires, not LLL relabeled -- and it is NOT Branch B (no from-scratch
        pure-Python reduction anywhere in this script).
      probe: direct read of measure_hkz_indep.py lines 244-330 (cited in this report)

