        ZERO calls to any barred function name. The only hits are the script's OWN
        licensed-reuse helpers `route_ii_make_A`/`route_ii_build_basis` (PREREG-5 2.2
        point 3 explicitly licenses reconstructing the same numeric instance from the
        published seed formula) and one comment referencing `hkz_profile()` by name in
