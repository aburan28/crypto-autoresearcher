    - id: ART-4
      check: raw_summary_agreement
      result: >-
        hkz_indep_writeup.md's per-cell table (section 4) matches
        results_hkz_indep.json's R_V_OUT_2_per_cell exactly at every cell: D_route''
        1.776e-15, VERDICT'' EXCEEDS, matched bases 8/8, s_c^fib values all consistent to
        the digits shown.
    - id: ART-5
      check: resource_measurements (AGENTS.md "Artifact policy")
      result: >-
        GAP, MINOR: no actual memory/RSS measurement is recorded anywhere in
        measure_hkz_indep.py, results_hkz_indep.json, or run_manifest.yaml -- only the
        budget LIMIT (2 GB) is declared, never a measured usage. BATCH-9e3584's own
        predecessor script (measure_relvar.py) DID record `resource.getrusage(...).ru_maxrss`;
        this script does not carry that forward. Given the run completed in 8.38s at
        d<=40 (small dense integer matrices, far below any plausible 2GB pressure), this
        is judged a completeness gap rather than a correctness or budget concern, and
        does not change the verdict, but is recorded as a limitation for a future
        producer script in this lineage to close.
      probe: >-
        direct read of measure_hkz_indep.py, results_hkz_indep.json, run_manifest.yaml
        (grep for resource/rss/memory -- zero hits outside the budget LIMIT field)

