  binding_mode: content_first
  binding_mode_reason: 'Declared rather than assumed. Commit-scope binding requires the archive commit
    to change exactly its declared archive-plus-source set, and 3df2bede4 does not: the two review.md
    files were each committed WHEN THEY LANDED -- the Validator review at abe25e340 and the Red Team
    review at a3c435a99 -- rather than held back for this archive. That was the right call at the time
    and reversing it would mean rewriting pushed history. content_first binds every declared artifact
    byte at HEAD instead, and still requires a reachable commit, a matching parent, and the record IDs
    in the commit message. What is relaxed is the binding to one commit; the binding to bytes is not.'
