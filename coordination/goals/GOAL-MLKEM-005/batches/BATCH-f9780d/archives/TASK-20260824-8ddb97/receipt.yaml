  path_sha256_note: 'Two files this archive touched are deliberately absent here, and neither omission
    is a gap in the binding. (1) This receipt does not hash itself: a hash written inside the bytes it
    hashes can never match them. The receipt is bound instead by the dispatch queue''s archive block,
    which the dispatcher reads and which carries this file''s sha256 -- a mutual binding, not a
    self-binding. (2) dispatch_queue.json is not a declared artifact for the same structural reason: it
    is the container that holds every hash above, so any hash of it would live inside itself. It stays
    in write_scope, so the archive commit is still authorized to change it, and it is bound by nothing
    -- stated plainly rather than papered over with a value that could not be checked. An earlier draft
    of this file did carry an unsatisfiable self-hash (ffc2923d...), which matched neither the bytes at
    HEAD nor the blob at 3df2bede4; it was never committed.'
