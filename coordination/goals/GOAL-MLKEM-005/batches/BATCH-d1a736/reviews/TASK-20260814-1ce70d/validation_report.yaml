        (ERROR vs. NOT_COMPUTED) individually. Reported here because a future
        reader who consults stage0_v2_results.json's own top-level fields in
        isolation, without reading its own per-cell array or run_manifest.yaml,
        would be misled into believing 0 cells produced a definite ERROR and
        6 cells simply were not attempted -- the opposite of what actually
        happened (all 6 were attempted to a definite outcome; 5 errored, 1 hit
