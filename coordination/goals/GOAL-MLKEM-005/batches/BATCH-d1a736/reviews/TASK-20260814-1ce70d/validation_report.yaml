      result: >-
        MINOR, NON-LOAD-BEARING LABELING DEFECT FOUND IN THE RAW JSON'S OWN
        SUMMARY, NOT IN THE HUMAN-FACING REPORT. stage0_v2_feasibility.py's own
        summary computation is `n_cells_not_computed = len(main_grid) -
        len(completed_cells)`, which lumps the 5 genuinely ERROR-status cells
        together with the 1 genuinely NOT_COMPUTED-status cell under a single
        field literally named "n_cells_not_computed" (reporting 6, when only 1
        cell actually carries status: "NOT_COMPUTED" -- the other 5 carry
        status: "ERROR", a THIRD, distinct outcome category per this goal's
        own established three-way ERROR/NOT_COMPUTED/COMPLETED taxonomy, see
        EV-MLKEM-ef0261's own infrastructure_separation field). This appears
        identically in stdout.log (the script's own printed summary). It does
        NOT propagate to the documents a reader is actually pointed to:
        run_manifest.yaml's own main_grid_outcome_summary block correctly
        separates n_cells_error: 5 from n_cells_not_computed_cap_exceeded: 1
        and n_cells_not_computed_budget_exhausted: 0, and writeup.md's own
