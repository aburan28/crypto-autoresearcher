    - id: ART-9-BISECTED-PRECISION-INSUFFICIENT-AT-FULL-TOUR-EVEN-AT-SAME-CELL
      check: >-
        Whether the bisected, "minimum adequate" isolated-LLL-step precision
        (65 bits, determined AT (d=256, beta=40)) is sufficient for a full BKZ
        tour AT THAT SAME (d=256, beta=40) cell -- the most direct possible
        test of whether the isolated-step bisection transfers to the full
        operation it was performed to support, since this is the one cell
        where bisection instance and main-grid instance coincide exactly.
      result: >-
        SIGNIFICANT, INDEPENDENTLY CONFIRMED OBSERVATION (ART-2 and ART-3
        above, taken together): NO. At (d=256, beta=40), 65-bit mpfr precision
        is confirmed sufficient for the isolated LLL-preprocessing step
        (ART-2: COMPLETED in 0.0026s) but confirmed INSUFFICIENT for the full
        BKZ tour at the identical (d, beta, seed) (ART-3: ERROR, chained
        ReductionError/ValueError). This is a THIRD, independently observed
        instance of the exact generalizable pattern KN-FIND-f54a82 already
        promotes from BATCH-3b9962 ("an isolated LLL/GSO-preprocessing-step
        probe... is measurably, non-trivially more numerically permissive than
        the full BKZ tour... naturally reached for as a cheap stand-in when
        validating a fix or characterizing a numerical-stability boundary"),
        now recurring even AFTER a formal, budget-capped bisection was
        performed specifically to determine a rigorous minimum for that
        isolated step. A plausible (UNTESTED by this review -- stated as a
        hypothesis, not a finding) mechanistic contributor: the bisection
        exercises `lll_obj()` once over the FULL matrix (a single, full-window
        LLL call), while BKZ's own `svp_preprocessing` repeatedly invokes
        `self.lll_obj(lll_start, lll_start, kappa + block_size)` -- LLL calls
        over ARBITRARY SUB-WINDOWS of the basis, many times per tour -- which
        may have different numerical precision requirements than a single
        full-matrix call. This review does not test that hypothesis and does
