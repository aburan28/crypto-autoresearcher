      result: >-
        NO DRIFT. (a) Source confirms exactly the mechanism writeup.md section
        1 claims: `elif isinstance(A, LLL.Reduction): L = A; M = L.M; ...`,
        then later `self.M = M` (M is not None) and `self.lll_obj = L` (L is
        not None) -- the `self.M = GSO.Mat(A, flags=GSO.ROW_EXPO)` line only
        executes in the `M is None` branch, which is never taken when
        BKZReduction is constructed from an LLL.Reduction instance. (b) Line-
        level check of worker_main_cell(): FPLLL.set_precision(mpfr_bits) at
        line 190 precedes M = GSO.Mat(A, float_type="mpfr") at line 191 (no
        flags=GSO.ROW_EXPO on that call); M.update_gso() present;
        LLL.Reduction(M, flags=LLL.DEFAULT) present; BKZReduction(L) (not
        BKZReduction(A)) present. Matches ADJUDICATION.md's own validated
        shape exactly, no deviation. CRITICAL FINDING: NONE.
