    - id: ART-6-BUDGET-AND-CAP-ARITHMETIC
      check: >-
        Independently recompute total_script_wall_clock_seconds and
        bisection_wall_clock_seconds as sums of their own constituent
        subprocess timings, and confirm PER_BASIS_FEASIBILITY_CAP_V2=7200s and
