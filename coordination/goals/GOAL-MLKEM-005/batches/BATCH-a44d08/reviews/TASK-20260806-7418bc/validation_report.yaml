# =====================================================================================
# 9. FINDINGS
# =====================================================================================
findings:
- id: F-1
  severity: blocking for Section C only
  finding: >-
    The Section C falsification criterion fails a null-object control at the same V as the scored
    pairs: 5 of 7 null pairs would be recorded as FALSIFYING PAIRS with a true effect of exactly
    zero, and resampling the shared error pool flips the sign of the scored d100_b40 falsifying
    pair. The declared verdict "L2 TAIL-SUFFICIENCY FALSIFIED" is not admissible evidence, and
    neither are the eight non-falsifying pairs' detection floors, which use the same SE.
    Mechanism: the frozen SE is a between-frame dispersion over ONE shared error pool and omits the
    pool-selection variance of a single 2^-10 order statistic.
  who_disclosed_what: >-
    The producer disclosed the structural fact (deviation 6) and the missing calibration
    (deviation 7) honestly and in its own words, and named the follow-up. It then still stated the
    verdict. The measurement that closes deviation 7 is in this report.
  concrete_repair: >-
    Replicate over error pools, not over frames: draw n independent pools per cell and take the SE
    of the paired difference across pools. A pre-registered TL-vs-TL' null at every scored V, with
    enough pool replicates to estimate a false-falsification rate, is the calibration prereg 4.4
    assumes it already has. Cost is trivial — my whole control ran in minutes.
- id: F-2
  severity: material, correction
  finding: >-
    Section B's INADMISSIBLE verdict is procedurally correct but its premise is false in the three
    failing cells: the injection never made the step increasing, so no monotonicity violation was
    presented to the gate. The gate declining to flag a net decrease is correct behaviour. The
    frozen clause's rationale does not apply, and the one cell that presented a real +2.4 SE_diff
    increase fired at c = 3.
- id: F-3
  severity: material, scope narrowing
  finding: >-
    Section A's E_I arm is a near-algebraic property of the frozen presentation at q = 3329, not a
    stochastic signal (CC-4). It refutes M-D as a claim about this basis presentation, which is a
    real and previously unrun result that five records deferred; it does not carry the evidential
    weight its 36-of-36 count and 3e8 z-scores suggest. Any evidence record drawn from Section A
    should say "algebraically forced by the q-ary presentation and confirmed numerically", not
    "falsified at 36 independent points".
- id: F-4
  severity: minor, receipt correction
  finding: >-
    The Coordinator's producer snapshot receipt states the E_I departure betas as "30/70/45/105",
    mixing beta = k for two cells with the next grid point above k for the other two. The
    substantive claim (the boundary tracks k, never d-k) is confirmed; the list should be either
    30/70/40/100 or 35/75/45/105 consistently. report_k.md is not the source of the error.
- id: F-5
  severity: minor
  finding: >-
    Objection O-1 in report_k.md (line 520) and the Coordinator receipt describe the floor-driven
    falsifications as occurring "at misses as small as +0.78%". The +0.78% point is not falsified.
    The correct range of falsifying misses is +2.86% to +32.94%, with a clean gap from the largest
    surviving residual (+1.87%). O-1's factual claim about the 2% floor stands; its characterisation
    of the affected points does not.
- id: F-6
  severity: minor, artifact policy
  finding: >-
    TASK-20260806-c973e6/run_manifest.yaml carries no `inference` block; its inference record exists
    only in vmatch_report.md section 11. None of the three manifests records `model_verified` or a
    probe status, which AGENTS "Artifact policy" and the model-policy note require to be carried
    into every manifest. Recorded as an incompleteness, not a fabrication.
- id: F-7
  severity: none — commendation, recorded because it is load-bearing for the verdict
  finding: >-
    All three producers ran the frozen specification exactly as written where they disagreed with
    it (prereg 5.5), recorded every objection and deviation rather than resolving it silently,
    refused to round 2.22e-16 to 0.0, marked their own post-hoc computations UNCITABLE, and
    disclosed the two defects (Section B's coupled control, Section C's missing null calibration)
    that this validation then confirmed. Nothing in this batch was rerun until favourable, omitted,
    or presented above its tier. The failures below are failures of the frozen design, not of
    execution or of candour.

