  does_k_not_equal_d_over_2_separate_the_mechanisms:
    plain_answer: >-
      YES for the preregistered boundary-location predictions, at the exact toy
      boundary tested; NO as support for the broader full mechanisms.
    exact_tested_boundary: >-
      d=100 with k in {30,70} and beta in {15,25,30,35,50,65,70,75,85};
      d=140 with k in {40,100} and beta in
      {20,35,40,45,70,95,100,105,120}.
    separating_observation: >-
      E_I follows min(1,k/beta), with maximum absolute error about 0.0013 against
      the frozen 0.02 floor, and falsifies M-D at all 36 points. Confinement/spill
      remains at or near one through beta=k and first drops at the first tested
      beta above k: 35, 75, 45, and 105 for the four cells respectively. Thus the
      observed transition tracks k rather than d-k within this grid.
    why_the_broader_claim_is_not_supported: >-
      M-K also forces a generic-spreading V magnitude. That component is
      falsified at 22 of the 32 non-degenerate points, while M-D is falsified at
      32 of 32. The combined preregistered verdict is therefore NEITHER in every
      cell. The separation is narrow, presentation-specific, and TOY; it is not
      evidence for a full mechanism, a basis-independent lattice property, or a
      cryptographic-scale claim.
  protocol_discrepancy:
    id: A-1
    severity: material_but_disclosed
    finding: >-
      Frozen null N-A3 prints the bottom-left block as A^T. For A of shape
      k by (d-k), that expression is dimensionally incompatible with the stated
      block matrix: the bottom-left block must be k by (d-k), so A itself is the
      unique shape-consistent reading. The producer used A, disclosed the issue,
      and did not amend the preregistration. The independent regeneration used
      the same shape-consistent interpretation and reproduces the artifact.
    effect: >-
      This is an unamended textual defect in a null construction, not a hidden
      arithmetic discrepancy. It limits claims to the implemented and disclosed
      null object.
  disposition: ADMITTED_AT_TOY_TIER_WITH_DISCLOSED_PROTOCOL_TYPO

section_b_am3_validation:
  producer_task: TASK-20260806-e17677
  raw_reduction:
    steps_checked: 48
    positive_control_scores_checked: 20
    mismatches: 0
    realized_positive_deltas: 9
    frozen_real_arm_threshold_violations: 0
  positive_control_at_c6:
    d100_beta30: {hardest_step: 0, score: TIE, returns_AM3_FAIL: false}
    d100_beta40: {hardest_step: 7, score: FAIL, returns_AM3_FAIL: true}
    d140_beta30: {hardest_step: 0, score: TIE, returns_AM3_FAIL: false}
    d140_beta40: {hardest_step: 1, score: TIE, returns_AM3_FAIL: false}
  frozen_admissibility_result:
    verdict: INADMISSIBLE
    independently_confirmed: true
    reason: >-
      Only one of four positive-control cells returns AM3-FAIL at c=6; the
      frozen admissibility rule requires all four. The three real-arm AM3-TIE or
      AM3-PARTIAL labels are therefore withheld and are not admitted results.
  declared_false_failure_rate:
    nominal_arithmetic: >-
      The preregistered one-sided Student-t reference gives an upper-tail
      per-step probability of 0.002 and 48 family members, so the union-bound
      arithmetic 48*0.002=0.096 is
      arithmetically correct. The Sidak independence reference is
      0.09162330873768.
    frozen_assumption: >-
      A flawless instrument is defined only by a non-increasing true mean and
      exchangeable paired differences.
    independent_verdict: NOT_ESTABLISHED
    reason: >-
      Exchangeability does not make a Studentized sample mean exactly t_7.
      Exact Student-t calibration requires substantially stronger distributional
      assumptions, such as independent Gaussian paired differences. Those
      assumptions are not in the frozen preregistration.
    exact_counterexample:
      construction: >-
        At one flat flawless step, let the eight paired differences be iid
        Rademacher values in {-1,+1} with equal probability. This is exchangeable
        and has true mean zero. Let all lower-endpoint observations be zero and
        all Haar endpoint observations be zero; let each upper-endpoint
        observation equal its paired difference.
      frozen_rule_behavior: >-
        On the event that all eight differences equal +1, the paired sample
        standard deviation and both endpoint standard errors are zero. The
        frozen degenerate branch therefore has epsilon=0 and flags the step
        because delta=1>0.
      event_probability: 0.00390625
      comparison_to_declared_per_step_rate: '1/256 = 0.00390625 > 0.002'
      forty_eight_times_counterexample_event_probability: 0.1875
      independent_steps_reference_probability: 0.17127521842284255
      conclusion: >-
        The claimed 0.002 per-step false-failure probability, and hence 0.096
        family-bound derivation, does not follow from the frozen definition.
        The 0.1875 product is not asserted as a replacement family bound, and
        the independent-steps figure is a reference rather than a property of
        the endpoint-sharing design. This check validates the frozen rule
        against an admissible per-step null; it does not rescore the data with a
        post-hoc alternative rule.
  post_hoc_counterfactual:
    computed: false
    note: >-
      No alternative multiplicity correction, threshold, standard-error rule,
      or repaired positive-control verdict was substituted. The frozen
      admissibility outcome remains INADMISSIBLE. The Sidak value is reported
      only because the preregistration names it as a reference.
  infrastructure_discrepancy:
    id: B-1
    finding: >-
      The producer records corruption of its stdout capture by a sibling task
      sharing a scratchpad. The immutable measurement JSON is intact and every
      stored reduction checked here reproduces.
    evidentiary_effect: infrastructure_issue_not_mathematical_evidence
  disposition: >-
    ADMIT only the mechanically confirmed frozen instrument result
    INADMISSIBLE; do not admit real-arm AM-3 verdicts or the claimed 0.096 bound
    under the frozen exchangeability definition.

