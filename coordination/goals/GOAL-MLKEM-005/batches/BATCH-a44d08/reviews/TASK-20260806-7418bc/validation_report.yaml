# =====================================================================================
# 7. THE ARRANGEMENT IN WHICH THIS VALIDATION COULD NOT FAIL
# =====================================================================================
could_not_fail_self_audit:
  named_before_running:
  - form: >-
      F1 — RE-EXECUTION DRESSED AS INDEPENDENCE. If I run the producers' own scripts, or
      reimplement them by reading their code, agreement is a property of determinism and the check
      cannot fail. Six times this program has scored a control exactly where its defect was
      invisible (G3, P3, F-A1, CTRL-BS, CTRL-POSHOM, CTRL-IDXMAP); a validator who only re-executes
      is the seventh instance in a new costume.
  - form: >-
      F2 — SCORING MY OWN CONTROL WHERE IT IS LOUDEST. If I build a null object and run it only at
      the two pairs the producer already flagged, I have chosen my sample after seeing the answer.
  - form: >-
      F3 — ARITHMETIC-ONLY VALIDATION. If I check only that the numbers recompute and never ask
      whether the observable can distinguish anything, then a perfectly reproduced artifact of a
      degenerate statistic passes.
  - form: >-
      F4 — SCORING THE PRODUCERS AGAINST THE PREREG AND CALLING THAT VALIDATION. If the frozen
      observables are the wrong observables, "conforms to the frozen contract" is a statement about
      compliance and not about the world.
  why_this_validation_is_not_in_them:
  - against_F1: >-
      For Section A I wrote the measurement from prereg 2.1/2.5/2.6 BEFORE and WITHOUT reading
      measure_k.py's measurement code, and it agreed at 0.0 on 576 values. For Section B I wrote the
      AM-3 scorer from prereg 3.2 and applied it to the raw r_values, not to the producer's derived
      steps. For Section C I DID read vmatch.py for the CBD sampler and the projection/chunking
      convention, so MR-C2 is an independent RE-EXECUTION and not an independent implementation, and
      I label it as such rather than claiming more. Independence there is instead supplied by
      MR-B3/MR-C3, which check the producers against a record committed in a different batch, and by
      CC-8, which builds an object no producer built.
  - against_F2: >-
      CC-8 was run at ALL 7 scored graded targets, including the 5 the producer did not falsify. It
      fires at 3 targets the producer did not falsify, which is the opposite of a selected sample.
      CC-6 was run over all 12 Section B steps at 5 pools, not at the failing steps only.
  - against_F3: >-
      CC-4 (the q-sweep) and CC-8/CC-9 (the null object and pool resampling) both ask whether the
      observable can distinguish anything, and both had a real chance of vindicating the producer.
      CC-4 could have shown E_I insensitive to q, which would have made the M-D refutation a pure
      artifact; it did not — the quantity decays as it should. CC-8 could have returned |t| ~ 1 and
      relative differences ~ 0.1%, which would have upgraded Section C's falsification from
      uncalibrated to corroborated; it did not.
  - against_F4: >-
      This is the residue I cannot close, and I state it rather than let a reviewer find it. My
      verdicts on items (a)-(e) are conformance judgements against a contract written inside this
      program. Where I could get outside it I did — CC-4, CC-8, CC-9, and the cross-batch checks —
      but nothing in this report establishes that E_I, V or D are the right observables for anything.
      prereg 1.1 already scopes them to a basis PRESENTATION, and I did not test that scoping.
  further_residues:
  - >-
      My Section C null control is one realization per target (7 targets), not a replicated
      false-falsification RATE. 5 of 7 firing at a nominal family-wise 0.10 is unambiguous as a
      direction; it is not an estimate, and I do not report one.
  - >-
      CC-6 covers one cell (100,40) at 5 pools. It shows Section B's statistic is far from its
      threshold under pool resampling; it is not a proof that the declared 0.096 bound holds, which
      is an analytic bound resting on a t_7 reference I did not certify.
  - >-
      I ran no LLL, no BKZ and no new reduction, so the A-lll arm and every reduced-arm statement in
      the batch are checked only for internal consistency.

# =====================================================================================
# 8. HEURISTIC-VALIDATION AND COST-MODEL CHECKS
# =====================================================================================
heuristic_validation_checks:
- check: pre-registered prediction (recorded before or independently of sampling)
  result: >-
    PASS, and verified in the git record rather than accepted (section 1). Every Section A
    prediction is a closed form in (d, k, beta); every threshold is [carried] from a committed
    decision or [closed form]. I re-derived all 216 Section A predictions and all 9 Section B/C
    critical constants independently before comparing.
- check: sample integrity — sizes, seeds, procedure in the manifest; statistics recomputed from raw
  result: >-
