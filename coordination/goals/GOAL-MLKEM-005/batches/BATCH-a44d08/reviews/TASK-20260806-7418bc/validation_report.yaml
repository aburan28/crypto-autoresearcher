# =====================================================================================
# 5. CONTROL CHECKS — INCLUDING CONTROLS THIS VALIDATOR RAN THAT NO PRODUCER RAN
# =====================================================================================
control_checks:
- id: CC-1
  section: A
  control: N-A1 Haar frame (prereg 2.6)
  frozen_prediction: E_I = k/d, V = 2 beta(d-beta)/(d(d+2))
  recomputed_by_me: bit-exact
  finding: >-
    PASS. The Haar arm returns E_I = 0.2857-0.7150, i.e. k/d, strictly interior and nowhere near
    min(1,k/beta). The observable is not returning the M-K curve on any frame handed to it.
    2 of 72 Haar comparisons exceed |4| SE against ~0.2 expected under an exact t_7 reference;
    the producer reports this plainly rather than smoothing it and correctly notes that the 9
    beta per cell are nested slices of the same 8 matrices, so the effective multiplicity is far
    below 72. Absolute deviations <= 0.057 in V units, two to three orders below the scored
    separations. No verdict turns on it.
- id: CC-2
  section: A
  control: N-A2 ambient coordinate permutation
  recomputed_by_me: bit-exact
  finding: >-
    PASS. E_I returns to k/d within 0.032 absolute at all 36 points, 22 to 68 SE from the M-K
    prediction. The statistic is not measuring low coordinate indices.
- id: CC-3
  section: A
  control: N-A3 block swap
  recomputed_by_me: >-
    exact, under the unique shape-consistent reading B' = [[q I_{d-k}, 0],[A, I_k]]
  finding: >-
    PASS on its declared criterion. Scored against the RELOCATED I-block, E_I = min(1, k/beta)
    exactly; scored against the OLD index range 1..k, E_I = max(0, 1-(d-k)/beta) exactly. The
    quantity follows the block, not the coordinate range, so Section A is ADMISSIBLE by its own
    frozen test. The producer's anomaly A-4 (V changes by up to 2.3x under the swap because B'
    makes the tail vectors coordinate-aligned rather than generic within the block) is correct
    and is a real limitation of N-A3 as a V control; it is disclosed, not buried.
- id: CC-4
  section: A
  control: >-
    VALIDATOR-ADDED, not in the prereg. q-sweep: hold the construction and the seeds fixed and
    vary the one parameter that should destroy the effect if the effect is an artifact of the
    q-scaling rather than a fact about block geometry.
  method: >-
    Rebuild B = [[I_k, A],[0, q I_{d-k}]] at (d,k) = (100,30) for q in {1,2,3,5,17,101,1009,3329}
    and measure E_I at beta = 15, 35, 75 (mean over the same 8 seeds).
  observed: |
      q      beta=15    beta=35    beta=75     (M-K predicts 1.0000 / 0.8571 / 0.4000)
         1   0.819884   0.650257   0.374665
         2   0.819884   0.650257   0.374665
         5   0.969809   0.801572   0.396461
        17   0.997337   0.850444   0.399698
       101   0.999924   0.856949   0.399991
      1009   0.999999   0.857141   0.400000
      3329   1.000000   0.857143   0.400000
  finding: >-
    IMPORTANT AND NOT PREVIOUSLY RECORDED. The quantity DOES decay when the destroying parameter
    is reduced, so this is not the canonical artifact tell. But it establishes the converse: at
    the frozen q = 3329 the E_I curve is pinned to min(1, k/beta) to 1e-7 by the q-scaling of the
    presentation itself. Section A's E_I arm is therefore a near-ALGEBRAIC property of the frozen
    basis presentation, not a stochastic signal that could plausibly have come out otherwise.
    Consequence for reading the receipt: "M-D falsified at 36 of 36 points, z up to 3e8" carries
    the evidential weight of an algebraic refutation of M-D as a claim about THIS presentation,
    not the weight of 36 independent measurements. The producer's own objection O-2 says exactly
    this about the SE denomination; my sweep supplies the mechanism behind it. The prereg's 2.7
    argument that the region beta <= min(k,d-k) "carries the section's primary weight" because
    both predictions are free of the capacity bound is correct as far as it goes and is
    incomplete: the predictions are free of the CAPACITY bound there but not of the CONSTRUCTION.
- id: CC-5
  section: B
  control: the mandatory injected positive control of prereg 3.5
  recomputed_by_me: exact (MR-B2)
  finding: >-
    FIRES IN 1 OF 4 CELLS. See section 6 item (d) for the full analysis; in short, the control
    is mis-specified and its failure in 3 cells is not a demonstration that the gate cannot fire.
- id: CC-6
  section: B
  control: >-
    VALIDATOR-ADDED, not in the prereg. Error-pool resampling of the AM-3 statistic. The frozen
    design draws ONE error pool per cell (seed_error(d)) and shares it across all 8 draws and
    every arm, so the recorded SEs are between-frame dispersions over a shared pool and contain
    none of the pool's own sampling error. I re-ran the identical graded family at (100,40)
    against 5 independent error pools and re-scored all 12 steps.
  observed: >-
    60 statistics (5 pools x 12 steps). All 60 are negative; the maximum over everything is
    -0.47, i.e. 4.68 below the +4.2071 threshold. The frozen-pool row reproduces the recorded
    values (step 7 = -6.00 vs recorded -5.999553).
  finding: >-
    PASS, and it is a real pass rather than a formality. Section B's paired statistic compares
    two frames on the SAME graded path at adjacent t, so they are nearly identical and the
    pool-selection offset is common-mode and cancels. This is exactly the property Section C
    lacks (CC-8), and the asymmetry is what makes it worth stating: Section B's monotonicity
    reading is robust to the one nuisance the design does not resample.
- id: CC-7
  section: C
  control: the frozen Form-2 degenerate instrument check (prereg 4.6)
  recomputed_by_me: exact
  finding: >-
    RUN, AND ITS OWN NUMBERS ARE A WARNING THE REPORT UNDER-WEIGHTS. At V = beta(1-beta/d) the
    two families are the same object up to a coordinate permutation, so the null is true by
    construction. The realized |t| values are 2.084 / 1.013 / 0.670 / 4.527. The d140_b40 value
    4.527 EXCEEDS the n_C = 12 critical value 3.6358. Only condition (ii) — the 4.53% relative
    difference falling under the 5% bar — kept it from scoring as a FALSIFYING PAIR. The producer
    records the number and its factor-of-3 mis-scaling caveat; it does not draw the conclusion
    that condition (i) has already been observed to over-fire on a true null.
- id: CC-8
  section: C
  control: >-
    VALIDATOR-ADDED, and the decisive check of this validation. A null object of the same shape,
    at the SAME V as the scored pairs: TL versus TL', where TL' is the identical two-level frame
    with its coordinate support translated by 2 beta. V and m3 agree between TL and TL' to
    <= 7.1e-15 at every draw, and under an i.i.d. exchangeable CBD error law TL and TL' are equal
    in distribution. The proposition Section C tests — "D depends on the frame only through V" —
    is therefore TRUE BY CONSTRUCTION for every such pair, and a correctly calibrated falsifier
    must not fire on it. I ran it at all 7 scored graded targets, not only the falsifying ones.
  observed: |
      cell      target             SCORED GR vs TL          NULL TL vs TL' (true effect = 0)
                                   |t|      rel%   FALS      |t|      rel%    FALS
      d100_b30  graded_t0.0025     0.080    0.23%  no        27.608    9.71%  YES
      d100_b30  graded_t0.0050     1.300    5.38%  no         5.959    6.84%  YES
      d100_b40  graded_t0.0025     0.474    0.98%  no        21.011    2.46%  no
      d100_b40  graded_t0.0075     3.689   17.48%  YES       24.417   21.05%  YES
      d140_b30  graded_t0.0025     0.485    1.07%  no        19.622    4.72%  no
      d140_b40  graded_t0.0025     0.819    2.55%  no        18.510    6.50%  YES
      d140_b40  graded_t0.0050     8.148   23.74%  YES       11.817   12.14%  YES
      frozen bars: |t| > 3.6358 (n_C = 12) AND relative > 5%
  finding: >-
    THE FROZEN SECTION C FALSIFIER FAILS ITS NULL-OBJECT CONTROL. On an object where the tested
    proposition is true by construction, condition (i) is exceeded at 7 of 7 targets (|t| from
    5.96 to 27.61 against a 3.6358 bar) and BOTH conditions are met at 5 of 7, so 5 of 7 null
    pairs would be recorded as FALSIFYING PAIRS. The null |t| at d100_b40 t=0.0075 (24.4) is
    6.6x the |t| that pair was actually scored on (3.69), and the null relative difference there
    (21.05%) EXCEEDS the scored one (17.48%).
- id: CC-9
  section: C
  control: >-
    VALIDATOR-ADDED. Error-pool resampling of the scored falsifying pair itself, at
    d100_b40 graded_t0.0075, over 5 independent error pools (frames and V-matching unchanged).
  observed: |
      pool seed     SCORED GR-TL  t     rel%    FALS     NULL TL-TL'  t     rel%    FALS
      20260905 (frozen)    +3.689   +17.48%   YES            +24.417  +21.05%   YES
             1             -2.038    -6.20%   no              +1.149   +1.79%   no
             2             +6.065   +29.56%   YES            -25.114  -28.52%   YES
             3             -1.493    -5.35%   no             +29.572  +15.59%   YES
             4             -2.219   -11.31%   no              +7.373   +4.94%   no
  finding: >-
    The scored pair's difference CHANGES SIGN across error pools (+17.5%, -6.2%, +29.6%, -5.4%,
    -11.3%) and scores FALSIFYING in only 2 of 5. The null behaves identically. This identifies
    the mechanism precisely: D is a single order statistic, sort(R)[1023] of 2^20 values, and
    which error vectors land in the 2^-10 tail depends on the frame's coordinate support. Two
    frames evaluated on ONE shared pool therefore carry a pool-dependent offset that does not
    average away over the 8 draws, because the 8 draws vary the frame and never the pool. The
    frozen SE — sd_j of the paired difference over 8 frames — omits the dominant variance
    component, so condition (i)'s t_7 reference is invalid and condition (ii)'s 5% relative bar
    is exceeded by pool noise alone. The producer's own deviation 6 states the structural fact
    ("the frozen SE is a between-frame dispersion at n = 8 over a SHARED error sample") and
    deviation 7 states that no null calibration exists. Deviation 7 is now closed by measurement,
    and the answer is unfavourable.
  citation_discipline: >-
    This control is a measurement of the INSTRUMENT's behaviour on a null object, which
    docs/inventor-protocol.md section 3 makes mandatory before belief. It is NOT an alternative
    scoring rule and it is NOT a rescoring of the frozen verdict, which stands as what the frozen
    rule returned on the frozen pool. It may be cited as an instrument finding about the Section C
    criterion. It may NEVER be cited as evidence for or against L2 tail sufficiency in either
    direction, and it says nothing about the variance-level identity, which prereg 4.1 already
    records as established.

# =====================================================================================
# 6. THE SPECIFIC ITEMS THE COORDINATOR ASKED TO BE TESTED, NOT TAKEN ON TRUST
# =====================================================================================
coordinator_items:
- item: a
  question: >-
    Section A claims the confinement boundary tracks k and never d-k: E_I departs from 1.0 at
    beta = 30/70/45/105 for k = 30/70/40/100 against d-k = 70/30/100/40. Verify from results_k.json.
  verified_from: results_k.json, and independently regenerated from seeds (MR-A1)
  measured_E_I_around_the_boundary: |
      (100, k=30):  beta 25 -> 1.000000 | beta 30 (=k) -> 0.999024 | beta 35 -> 0.857143 = 30/35
      (100, k=70):  beta 65 -> 1.000000 | beta 70 (=k) -> 0.998672 | beta 75 -> 0.933333 = 70/75
      (140, k=40):  beta 35 -> 1.000000 | beta 40 (=k) -> 0.999945 | beta 45 -> 0.888889 = 40/45
      (140, k=100): beta 95 -> 1.000000 | beta 100(=k) -> 0.999990 | beta 105 -> 0.952381 = 100/105
  finding: >-
    THE SUBSTANTIVE CLAIM IS CONFIRMED; THE COORDINATOR'S NUMBERS ARE INTERNALLY INCONSISTENT.
    In every one of the four cells E_I holds at 1.0 for beta <= k, dips by 1e-5..1.3e-3 exactly at
    beta = k, and takes the value k/beta at the next grid point above k. At beta = d-k the measured
    E_I is 0.428571 / 1.000000 / 0.400000 / 1.000000 — nothing happens there that a boundary would
    produce. Since (k, d-k) are mirrored pairs with the same block SIZES and the roles of K_I and
    K_q exchanged, a statistic responding to block size or index position would give the same answer
    in both members; it does not. So the confinement boundary tracks k and never d-k, and it does so
    in a design that could have detected the alternative.
    The receipt's list "30/70/45/105" mixes two conventions: 30 and 70 are beta = k (the tiny dip,
    far below the tol_E = 0.02 floor), while 45 and 105 are the first grid point ABOVE k. Under one
    convention the list is 30/70/40/100; under the other it is 35/75/45/105. Both are available in
    all four cells because k is a grid point at both d. This is an error in the Coordinator's
    snapshot receipt summary, NOT in report_k.md, which prints the values themselves and does not
    make a "departs at" claim. It should be corrected before the phrase propagates into an evidence
    record.
- item: b
  question: >-
    Objection O-1: the V arm's 2% relative floor is claimed to sit BELOW the closed form's own
    committed error on 3 of 5 k = d/2 anchors, which would make M-K's 22/32 V-arm falsifications
    an artifact of the floor.
  rederived_by_me: |
      (d=100, beta=30)  closed form V_50(30) = 9.000000  vs committed 9.3628   -> -3.87%   >2%
      (d=140, beta=30)  closed form V_70(30) = 6.428571  vs committed 6.7504   -> -4.77%   >2%
      (d=140, beta=40)  closed form V_70(40) = 11.428571 vs committed 11.8075  -> -3.21%   >2%
      (d=100, beta=40)  closed form V_50(40) = 16.000000 vs committed 16.2446  -> -1.51%   <2%
      (d=100, beta=60)  closed form V_50(60) = 16.000000 vs committed 16.269   -> -1.65%   <2%
  finding: >-
    O-1's FACTUAL CLAIM IS CONFIRMED AND ITS INFERENCE IS OVERSTATED. Confirmed: prereg 2.5
    justifies the 2% absolute floor by "the <= 2% agreement the closed-form V already shows against
    committed k = d/2 values", and that justification is false — 3 of the 5 anchors disagree by
    3.2% to 4.8%. The floor is set below the closed form's own already-committed disagreement with
    measurement, and the producer was right to record the objection and right to run the frozen rule
    anyway (prereg 5.5).
    Overstated: the falsifications are not sitting on the floor. The smallest |residual| among the
    22 falsified M-K points is +2.86%; the largest among the 10 surviving points is +1.87%; there is
    a clean gap around the 2% boundary and no falsification is a rounding away from surviving. Of
    the 22, only 4 lie below +5% (+2.86%, +3.04%, +4.32%, +4.93%); the other 18 miss by +5.0% to
    +32.94%. The absolute component governs at 22 of the 32 points and 4 x SE_V governs at 10.
    Two further defects in how O-1 is phrased, which matter because the objection's force depends on
    proximity to the floor: report_k.md line 520 says the floor produces falsifications "at points
    where it misses by +0.78% to +7.5%", and the Coordinator's receipt says "at misses as small as
    +0.78%". The +0.78% point is (140,40) beta=35 and it is NOT falsified — its residual 0.171 is
    inside tol_V = 0.4375. The correct range of falsifying misses is +2.86% to +32.94%. The
    +0.78%..+32.9% range quoted in report_k.md section 4 is the range over ALL 32 points, not the
    falsified subset, and the two are conflated at line 520.
  post_hoc_counterfactual:
    label: POST-HOC — MUST NEVER BE CITED AS A RESULT
    computed: >-
      Raising the V-arm absolute floor to the level of the closed form's own worst committed error
      moves M-K's V-arm falsification count from 22 of 32 (frozen 2%) to 20 (4%) to 18 (5%), and
      the per-cell counts from 6/6/5/5 to 5/5/4/4. No cell reaches zero, so no cell verdict would
      change from NEITHER under any of these floors.
    status: >-
      Computed only to bound the objection's reach. It is a post-hoc alternative rule beside a
      frozen verdict and prereg 5.6 and AM-3 forbid citing it as a result or as grounds for
      preferring a repair. The frozen verdict is NEITHER x 4 and that is what stands.
- item: c
  question: >-
    Deviation D-1: prereg 2.6 writes the block-swap null as [[qI,0],[A^T,I_k]], which the producer
    says is dimensionally inadmissible with A of shape (k, d-k). Confirm or refute.
  finding: >-
    CONFIRMED. With row- and column-blocks of sizes (d-k, k), the lower-left block must be
    k x (d-k). A has shape (k, d-k); A^T has shape (d-k, k). At (100,30) the block must be 30x70 and
    A^T is 70x30; at (140,40) it must be 40x100 and A^T is 100x40. The frozen text is dimensionally
    inadmissible as literally written for every k != d/2, which is every cell in Section A, and is
    admissible only at k = d/2 — where the control was never needed. The unique shape-consistent
    object that "the same A" can denote in that position is A itself. The producer used A, obtained
    a non-singular B' of determinant q^{d-k} with the block roles exchanged, disclosed the reading
    rather than resolving it silently, and ran no other reading. I rebuilt N-A3 under that reading
    and reproduced all 36 points exactly (MR-A2). The deviation is correctly classified as a
    resolved transcription ambiguity, not a protocol violation.
- item: d
  question: >-
    Section B: the mandatory positive control fails to return AM3-FAIL at c = 6 in three of four
    cells, so the gate is INADMISSIBLE by prereg 3.5's own clause. Verify, and check the producer's
    explanation (A-5: step-selection and injection scale are coupled through SE_diff).
  verified: >-
    CONFIRMED by independent re-scoring (MR-B2). d100_b30, d140_b30 and d140_b40 return AM3-TIE at
    every c in {1,2,3,4,6}; d100_b40 returns AM3-FAIL at c = 3. By the frozen clause the AM-3 gate
    is INADMISSIBLE for this goal, and the producer correctly reports that as the run's result, with
    the four PARTIAL readings marked WITHHELD.
  post_injection_delta_at_c6_recomputed_by_me: |
      d100_b30  i=0 (t 0.0 -> 0.0025)   true Delta -0.037829,  after +6 SE_diff:  -0.025682  STILL A DECREASE
      d100_b40  i=7 (t 0.03 -> 0.05)    true Delta -0.000849,  after +6 SE_diff:  +0.008039  an increase
      d140_b30  i=0 (t 0.0 -> 0.0025)   true Delta -0.045354,  after +6 SE_diff:  -0.034764  STILL A DECREASE
      d140_b40  i=1 (t 0.0025 -> 0.005) true Delta -0.017249,  after +6 SE_diff:  -0.007921  STILL A DECREASE
  finding: >-
    THE PRODUCER'S EXPLANATION IS CORRECT, AND THE CONSEQUENCE IS STRONGER THAN THE RECEIPT STATES.
    prereg 3.5 asserts that adding c x SE_diff at t_{i+1} creates "a known monotonicity violation of
    exactly that size at step i". That identification holds only where the true Delta_i is 0. The
    step-selection rule maximises SE_diff(A,t_i); SE_diff is largest where the arm's dispersion is
    largest, which on this family is at the head of the descent, which is also where |Delta_i| is
    11x to 26x the injection unit. In three of four cells the injected step therefore remains a NET
    DECREASE at c = 6, and NO MONOTONICITY VIOLATION OF ANY SIZE WAS EVER PRESENTED TO THE GATE.
    A monotonicity gate that declines to flag a decrease is behaving correctly.
    Therefore: the INADMISSIBLE verdict is procedurally right — the frozen clause fired and the
    producer was correct to run it and report it — but the clause's stated rationale ("a gate that
    cannot flag a violation 1.5 times the width its own design calls detectable is not a criterion")
    does not apply to what happened. The single cell where the rule happened to select a near-flat
    step (d100_b40, true Delta = -0.57 SE_diff) fires at c = 3 with target statistic +5.44, and my
    own re-run confirms the post-injection Delta there is a genuine +2.4 SE_diff increase. The
    control is mis-specified; the gate is not shown to be unable to fire. That distinction is the
    Coordinator's to act on, and the repair is cheap and obvious: select the injection step by a
    data-independent rule that does not maximise the quantity the injection is denominated in, or
    denominate the injection so that the post-injection Delta is positive by construction.
    Recorded scope: nothing here is evidence about lattices in either direction. INVALID,
    INADMISSIBLE and PARTIAL are instrument outcomes (prereg 3.2, AGENTS rule 5).
- item: e
  question: >-
    Section C: 2 falsifying pairs of 10 under both n_C = 12 and n_C = 10; 0 of 10 detection floors
    below the 5% bar. Verify, and check DEV-1 and DEV-2.
  counts_verified: >-
    CONFIRMED (MR-C1). 2 FALSIFYING PAIRS under both critical values — d100_b40 graded_t0.0075
