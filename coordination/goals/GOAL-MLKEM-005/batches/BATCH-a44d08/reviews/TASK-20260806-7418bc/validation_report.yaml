validation_falsifiability:
  arrangement_in_which_this_validation_could_not_fail: >-
    Validation could not expose a shared implementation error if it merely
    imported or reran producer programs, compared prose reports to summaries
    already computed by those programs, and checked only a notarization
    commit's parent rather than the notarizing commit itself. In that
    arrangement producer and validator share the same bug and the ancestry
    check passes even if the notarizing commit is absent.
  why_this_validation_is_not_in_that_arrangement:
    - Actual notarization and producer snapshot commit IDs were checked directly.
    - Commit parents, exact path sets, reachability, and per-path first appearance were checked independently.
    - Forced values were derived from formulas in a separate scratch implementation.
    - Raw arrays, rather than producer verdict labels, were reduced independently.
    - Section A primary and null objects were regenerated by independent small deterministic code that did not import measure_k.py.
    - The AM-3 false-failure claim was challenged against the frozen assumption, producing a concrete counterexample.
  residual_shared_observation_boundary: >-
    In accord with the no-new-BKZ/LLL constraint, Sections B and C raw
    measurement generation was not independently rerun. Their stored raw arrays
    were independently reduced. Findings about raw-generation correctness remain
    bounded by that prohibition and are not promoted beyond TOY observation.

forced_value_rederivations:
  implementation: >-
    Independent scratch code using explicit algebra, NumPy only for primitive
    array reductions, and mpmath for high-precision Student distribution
    integration/inversion. Producer modules were not imported. A first complete
    check reached result serialization but the scratch serializer rejected a
    NumPy integer; I corrected only the scratch encoder and reran the same checks.
    This was a validation-tooling issue, not evidence about the experiment.
  section_a_mechanism_predictions:
    formulas:
      E_MK: 'min(1, k / beta)'
      E_MD: 'max(0, 1 - (d - k) / beta)'
      V_c_le_c: 'beta^2 * (d - c) / (c * d)'
      V_c_gt_c: 'c * (1 - beta / d)^2 + (d - c) * ((beta - c) / (d - c) - beta / d)^2'
      V_MK: 'V_c(d, beta, k)'
      V_MD: 'V_c(d, beta, d-k)'
    independent_check_method: >-
      Evaluated the piecewise projection-diagonal variance formula directly for
      c=k and c=d-k at all 36 (d,k,beta) points, then compared every stored
      expected value and every producer verdict with the preregistered tolerances.
    expected_values: >-
      E_MK and E_MD as above; V_MK and V_MD as above. At beta <= min(k,d-k),
      the V_MK/V_MD ratios are 49/9 = 5.444444444444444 for (100,30),
      25/4 = 6.25 for (140,40), and their reciprocals for the mirrored k values.
      V_MK equals V_MD at beta=d/2.
    observed_values: >-
      All 36 stored E_MK values, all 36 stored E_MD values, all 36 stored V_MK
      values, and all 36 stored V_MD values agree with the independent closed
      forms. The maximum absolute closed-form disagreement was below 2e-14.
    tolerance:
      printed_forced_values_absolute: 0.0001
      printed_forced_ratios_absolute: 0.001
    verdict: PASS
  section_a_haar_null:
    formula: 'V_Haar = 2 * beta * (d-beta) / (d * (d+2))'
    distribution_basis: 'P_aa ~ Beta(beta/2, (d-beta)/2) for a Haar beta-projector'
    independent_check_method: >-
      Derived E[(P_aa-beta/d)^2] from the Beta variance and summed over d
      diagonal entries; independently regenerated every seeded Haar-null frame.
    expected_values: formula above
    observed_values: every stored null summary and per-instance value reproduced
    tolerance: exact stored-float comparison in the independent regeneration
    maximum_absolute_deviation: 0.0
