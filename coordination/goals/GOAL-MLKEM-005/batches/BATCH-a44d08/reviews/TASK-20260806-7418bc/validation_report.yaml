  overriding_finding: >-
    THE COUNTS ARE RIGHT AND THE VERDICT THEY PRODUCE IS NOT ADMISSIBLE EVIDENCE. See CC-8 and CC-9.
    A null object with V and m3 identical to 7.1e-15 — the same object up to a coordinate
    permutation, under an exchangeable error law, so the tested proposition is true by construction —
