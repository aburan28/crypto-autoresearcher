# =====================================================================================
# 1. NOTARIZATION CHAIN — CHECKED BY ME, NOT ACCEPTED FROM ANY PRODUCER ASSERTION
# =====================================================================================
notarization_chain:
  method: >-
    Every step below was executed by this validator against the git object store in the
    reviewed worktree. No producer's ancestry claim was accepted as input to any conclusion.
  carried_correction_being_guarded: >-
    V-7. BATCH-f19c37's executor asserted the notarizing commit's PARENT, so its own check
    would have passed had the notarization never happened. Guarded here by asserting the
    notarizing commit ITSELF in both directions and by an independent introduction census.
  checks:
  - id: NC-1
    check: sha256(prereg.md) in the working tree
    command: shasum -a 256 <prereg path>
    observed: 8d00ca3f0977e7367cfd10f4eb01cc0d4d24dfdc1ecf9739ba3cc299ee2a6c80
    expected_from_task_card: 8d00ca3f0977e7367cfd10f4eb01cc0d4d24dfdc1ecf9739ba3cc299ee2a6c80
    result: MATCH
  - id: NC-2
    check: sha256 of the prereg BLOB INSIDE the notarizing commit
    command: 'git show 9cb2d3e28...:<prereg path> | shasum -a 256'
    observed: 8d00ca3f0977e7367cfd10f4eb01cc0d4d24dfdc1ecf9739ba3cc299ee2a6c80
    result: MATCH — the notarized text and the reviewed text are the same bytes
  - id: NC-3
    check: sha256(prereg_sha256.txt) against archive.path_sha256 of TASK-20260806-0a1072
    observed: eb7a867534ba11872447f77e614ae6ca09484160011f7573732b1eafe9e30bdf
    result: MATCH
  - id: NC-4
    check: notarizing commit contents
    command: git show --stat 9cb2d3e28ae7a474edbb116d694969470829e112
    observed: >-
      exactly three files, all pure additions: prereg.md (996 lines), prereg_sha256.txt (1),
      archives/TASK-20260806-0a1072/snapshot-receipt.json (41). No measurement artifact.
      parent = 68168fc9e205f44fe5ba4e3cce06c9390759490e, equal to the receipt's parent_sha.
    result: PASS
  - id: NC-5
    check: ancestry, asserted against the NOTARIZING COMMIT ITSELF
    commands:
    - git merge-base --is-ancestor 9cb2d3e28 7700090428ae7f8b5dbaaf7bb54a7a253c53fae8   -> TRUE
    - git merge-base --is-ancestor 9cb2d3e28 HEAD                                        -> TRUE
    - git merge-base --is-ancestor 7700090428 HEAD                                       -> TRUE
    - git merge-base --is-ancestor 7700090428 9cb2d3e28   -> FALSE  (the direction that MUST fail)
    result: >-
      PASS. The reverse-direction check is included precisely because its absence is what let
      BATCH-f19c37's defective check pass. The notarization strictly precedes the producer
      snapshot in the commit DAG and the relation is not symmetric.
  - id: NC-6
    check: introduction census of every measurement artifact (git log --follow, full history)
    observed: >-
      All twelve measurement artifacts are introduced by exactly one commit,
      7700090428ae7f8b5dbaaf7bb54a7a253c53fae8, which is a descendant of the notarizing commit.
      git log --follow returns exactly one commit per artifact. No earlier version of any of
      them exists anywhere in history.
    result: PASS — no measurement artifact predates the pre-registration
  - id: NC-7
