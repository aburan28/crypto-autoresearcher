# =====================================================================================
# 3. FORCED VALUES — RE-DERIVED INDEPENDENTLY, AS FIRST-CLASS ARTIFACTS
# =====================================================================================
forced_value_rederivations:
  standard_applied: >-
    Re-derived from the defining mathematics in a scratchpad outside the repository and
    compared with `==` on the float64 bit pattern, not by eyeballing printed digits. Where the
    producer's value is a rounding of an exact quantity I say so instead of claiming bit-exactness.
  values:
  - name: t_{7,0.998}
    declared: 4.2071245566046755
    rederived_by: scipy.stats.t.ppf(0.998, 7)
    mine: 4.2071245566046755
    bit_exact: true
  - name: alpha per step = P(t_7 > t_crit)
    declared: 0.002
    rederived_by: scipy.stats.t.sf(4.2071245566046755, 7)
    mine: 0.0019999999999982102
    bit_exact: false
    note: >-
      Differs from the declared 0.002 by 1.79e-15, i.e. the declared value is the exact design
      level and t_crit is its inverse to float64. Correct, and the artifacts record both.
  - name: family-wise union bound 48 x 0.002
    declared: 0.096
    mine: 0.096
    bit_exact: true
    note: 48 x the recomputed alpha gives 0.0959999999999141; both are recorded in results_g3.json.
  - name: Sidak reference 1 - (1-0.002)^48
    declared: 0.0916233087376801
    mine: 0.0916233087376801
    bit_exact: true
  - name: P(|t_7| > 3.0)  (prereg 4.4 suggestive band)
    declared: 0.019942126131992522
    mine: 0.019942126131992522
    bit_exact: true
  - name: P(t_7 > 1.0)  (the WITHDRAWN AM-1 rule's rate)
    declared: 0.175309
    mine: 0.17530833141010374
    bit_exact: false
    note: declared value is a 6-figure rounding of the exact quantity; correct as printed.
  - name: Bonferroni |t| crit at n_C = 12
    declared: 3.6358074219539622
    rederived_by: scipy.stats.t.ppf(1 - 0.10/24, 7)
    mine: 3.6358074219539622
    bit_exact: true
  - name: Bonferroni |t| crit at n_C = 8
    declared: 3.3352949398170852
    mine: 3.3352949398170852
    bit_exact: true
  - name: Bonferroni |t| crit at the REALIZED n_C = 10
    declared: 3.4994832973505026
    mine: 3.4994832973505026
    bit_exact: true
  - name: E[V]_haar = 2 beta (d-beta) / (d (d+2))
    rederived_from_scratch: >-
      P_aa ~ Beta(beta/2, (d-beta)/2) => Var(P_aa) = ab/((a+b)^2(a+b+1)) with a = beta/2,
      b = (d-beta)/2 => 2 beta (d-beta) / (d^2 (d+2)); E[V] = d x Var = 2 beta (d-beta)/(d(d+2)).
      This is the same Beta-derivation the previous batch's validator used, applied here to all
      36 Section A null points.
    result: bit-exact against every V_haar entry in results_k.json (36 of 36)
  - name: q_Beta(2^-10) = betaincinv(beta/2, (d-beta)/2, 2^-10)
    checked_cell: d=100, beta=40
    declared: 0.2053686670775116
    mine: 0.2053686670775116
    bit_exact: true
  - name: Section A closed-form prediction table (prereg 2.3), all 216 entries
    rederived_from: >-
      E_I^{M-K} = min(1, k/beta); E_I^{M-D} = max(0, 1-(d-k)/beta); V_c two-regime form; Haar
      E_I = k/d and E[V]_haar — written by me from prereg 2.1 alone
    result: >-
      216 of 216 BIT-EXACT (`==`) against the `pred` block of results_k.json. Zero mismatches.
  - name: Section A V-prediction ratio ((d-k)/k)^2
    mine: 5.4444... at (100,30)/(100,70) and 6.25 at (140,40)/(140,100)
    result: reproduces the prereg 2.2 table
  - name: TL reachable V interval, V_TL(u), m3_TL(u) and the closed-form inverse (prereg 4.2)
    result: >-
      Reproduced. In particular V_TL(1/2) at (140,30) = 8.571428571428571 exactly, which is the
      value that decides deviation DEV-1 below.

# =====================================================================================
# 4. METRIC RECOMPUTATIONS FROM RAW DATA (independent implementations)
# =====================================================================================
metric_recomputations:
- id: MR-A1
  scope: Section A, entire primary arm
  method: >-
    I wrote an implementation from prereg 2.1/2.5/2.6 only, WITHOUT reading measure_k.py's
    measurement code: rng = default_rng(810000 + d*1000 + k*10 + i), A = rng.integers(0,q,(k,d-k)),
    B = [[I_k, A],[0, q I_{d-k}]], frame = last beta columns of Q from QR(B^T) in float64,
    E_I = sum_{a<k} P_aa / beta, V = sum_a P_aa^2 - beta^2/d.
  result: >-
    max |E_I(mine) - E_I(recorded)| = 0.0 and max |V(mine) - V(recorded)| = 0.0 over all
    4 cells x 9 beta x 8 bases = 288 E_I values and 288 V values. BIT-EXACT.
- id: MR-A2
  scope: Section A, all three nulls
  method: N-A1 Haar, N-A2 ambient permutation, N-A3 block swap, rebuilt from prereg 2.6
  result: >-
    N-A1 max |dev| = 0.0 on both E_I and V; N-A2 max |dev| = 0.0; N-A3 reproduces all 36 points
    to < 1e-9 (in fact E_I = 1.0 and 0.0 exactly, V = beta(1-beta/d) exactly) under the
    shape-consistent reading of the block-swap basis. BIT-EXACT / EXACT.
- id: MR-A3
  scope: Section A frozen verdicts
  method: >-
    tol_E = max(4 SE_EI, 0.02) and tol_V(m) = max(4 SE_V, 0.02 V_pred(m)) recomputed from MY
    measurements with ddof = 1, then every per-point falsification recomputed.
  result: >-
    Every one of the 36 E_I decisions and 32 V decisions agrees with the recorded decision.
    Tally reproduces exactly: E_I arm 36 points, M-K falsified 0, M-D falsified 36; V arm 32
    discriminating (4 correctly excluded at beta = d/2), M-K falsified 22, M-D falsified 32;
    per cell M-K V-falsifications 6 / 6 / 5 / 5. Cell verdicts NEITHER / NEITHER / NEITHER /
    NEITHER confirmed.
- id: MR-B1
  scope: Section B, AM-3 scoring
  method: >-
    Scorer written by me from prereg 3.2, applied to the raw per-draw r_values in
    results_g3.json: Delta_i, paired SE_step(i) with ddof = 1, epsilon_i = SE_diff(A,t_i) with
    the frozen degenerate fallbacks, statistic (Delta_i - epsilon_i)/SE_step(i) vs t_crit.
  result: >-
    All 48 statistics reproduce to < 1e-12 and every per-step violation flag matches. Outcomes
    AM3-TIE in all four cells; 0 of 48 violations; 9 of 48 steps with Delta > 0; max statistic
    over the family -0.19342160540508713, i.e. 4.40 below the +4.2071 threshold.
- id: MR-B2
  scope: Section B, mandatory positive control (prereg 3.5)
  method: >-
    Hardest step re-selected by the frozen data-independent rule (argmax over the twelve LOWER
    endpoints of SE_diff), injection c x SE_diff(A,t_i) added to every draw at t_{i+1}, full
    12-step re-scoring, for c in {1,2,3,4,6}.
  result: >-
    Hardest step reproduces (i = 0 / 7 / 0 / 1). Smallest c returning AM3-FAIL reproduces
    (none / 3 / none / none). returns_AM3_FAIL_at_c6 reproduces (False / True / False / False).
    Target-step statistics reproduce to the printed precision.
- id: MR-B3
  scope: Section B, cross-batch data provenance
  method: >-
    I compared BATCH-a44d08's per-draw r values directly against the COMMITTED BATCH-f19c37
    record (tasks/TASK-20260806-ca4377/results.json) myself.
  result: >-
    416 graded per-draw r values + 32 Haar-null values = 448 compared; max |dev| =
    2.220446049250313e-16; 208 of 416 graded values bitwise identical, all d = 100. This
    independently confirms the producer's own reproduction claim and its honest refusal to
    round 2.22e-16 to "0.0".
- id: MR-C1
  scope: Section C, all 10 scored pairs
  method: >-
    |t|, relative difference, m3 separation and detection floor recomputed by me from the raw
