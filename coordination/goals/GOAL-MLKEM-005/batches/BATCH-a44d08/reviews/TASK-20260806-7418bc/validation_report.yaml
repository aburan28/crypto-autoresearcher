admission_note: >-
  Section A is mechanically reproducible and its narrow boundary observation is
  admitted at TOY tier, while its combined frozen cell verdict is NEITHER.
  Section B's frozen admissibility control is mechanically reproducible as
  INADMISSIBLE, so its real-arm AM-3 readings remain withheld; moreover, the
  declared 0.096 family false-failure bound is not justified by the frozen
  exchangeability assumption. Section C's raw reductions are internally
  reproducible, but every actual projected pair fails the frozen 1e-9 V-match
  requirement, and its t calibration does not account for common finite-sample
  quantile error. Section C's confirmatory falsification conclusion is therefore
  not admitted. These are protocol and statistical-validity failures, not
  mathematical evidence about ML-KEM.

