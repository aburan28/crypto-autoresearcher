does_k_not_equal_d_over_2_separate_the_mechanisms:
  answer: >-
    YES on the E_I arm, decisively and in the direction of k; NO on the V arm, where both
    mechanisms are falsified.
  stated_plainly: >-
    k != d/2 does separate the two spill mechanisms. The tail GSO window of the unreduced q-ary
    presentation lies in the identity block K_I, and the confinement boundary is beta <= k, not
    beta <= d-k. E_I follows min(1, k/beta) to within 1.3e-3 at all 36 points against a 0.02 floor,
    while M-D's max(0, 1-(d-k)/beta) is falsified at all 36, missing by 0.167 to 1.000. The mirrored
    (k, d-k) pairs make this a real discrimination rather than a size or index-position effect, and
    N-A3 confirms the statistic follows the block and not the coordinate range.
    Three qualifications that must travel with that sentence:
      1. The separation is delivered ANALYTICALLY, not statistically. At q = 3329 the E_I curve is
         pinned to min(1, k/beta) by the presentation itself (CC-4). M-D was refutable by algebra
         before any datum existed; the measurement confirms it rather than discovering it.
      2. It is a statement about a basis PRESENTATION, not about a lattice (prereg 1.1), not about
         reduction, not about the 2^-10 tail law, and not about ML-KEM. It is not offered as, and
         does not satisfy, an AM-4 adjudicator.
      3. The V arm does NOT separate them: M-D is falsified at 32 of 32 discriminating points and
         M-K at 22 of 32, so every cell verdict is NEITHER. Block identity and V magnitude come
         apart, and the honest summary is that M-K's block-identity content survives at these k
         while its V-magnitude content ("the excess beta - c dimensions spread generically over the
         complement") does not.

