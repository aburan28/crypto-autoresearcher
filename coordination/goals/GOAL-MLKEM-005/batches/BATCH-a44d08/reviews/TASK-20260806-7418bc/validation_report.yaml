    The producer applied the frozen UNREACHABLE rule of prereg 4.2, excluded the target, recorded
    the objection, changed no threshold, and reported both the declared n_C = 12 and the realized
    n_C = 10 with both Bonferroni critical values, exactly as prereg 4.3 step 4 requires. The
    verdict is identical under both. Correct handling of an error in the frozen contract.
  dev_2: >-
    CONFIRMED, AND IMMATERIAL — WITH THE ARITHMETIC. The frozen 1e-9 absolute V-match is met by the
    closed-form inverse in float64 (<= 5.33e-15 at every draw of every pair) and is NOT met at the
    committed float32 frame precision (<= 2.31e-06); float32's ULP at V ~ 6-24 makes 1e-9
    unattainable, so the frozen number is not achievable as written. The producer reports both
    residuals per pair, does not edit the frozen number, and sets V_match_within_frozen_tolerance
    = false on every pair rather than quietly passing it. I bounded the consequence myself:
    estimating dD/dV from the GR grid gives 2.8e-03 to 4.6e-03 per unit V, so a 2.3e-06 V-mismatch
