  verdict: >-
    NOTARIZATION CHAIN VERIFIED BY THIS VALIDATOR. The pre-registration provably predates every
    measurement it governs in the git record, in the strong sense: the notarizing commit is an
    ancestor of the unique commit that introduces all twelve artifacts, the reverse is not true,
