  dev_1: >-
    CONFIRMED, AND THE PREREG IS WRONG. prereg 4.3 step 5's parenthetical states that the four
    unreduced V values "all [lie] inside the reachable intervals above". At (140,30) the committed
    unreduced V = 6.750435 and the TL-reachable interval is [8.571429, 23.571429]; I re-derived
