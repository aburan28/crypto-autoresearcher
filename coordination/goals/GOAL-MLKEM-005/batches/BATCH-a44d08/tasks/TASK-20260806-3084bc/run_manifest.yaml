      frozen_call: 'IntegerMatrix.random(100, "qary", k=50, q=3329): identity part
        rows/cols 0..49; q rows/cols 50..99'
      additional_asymmetric_read: 'IntegerMatrix.random(100, "qary", k=30, q=3329):
        30 q-rows at indices 70..99, identity part rows/cols 0..69'
      conclusion: "fpylll's k counts the q-SCALED rows |K_q|, not |K_I|. The
        prereg's k is |K_I|. Indistinguishable at k = d/2. This report's cell
        (d=100,k=30) corresponds to the generator call k=70."
    instrument_check_k_eq_d_over_2:
      "V(100,30)": {here: 9.3773, committed: 9.3628, dev_percent: 0.155}
      "V(100,60)": {here: 16.2626, committed: 16.2690, dev_percent: -0.039}
      "V(140,30)": {here: 6.7901, committed: 6.7504, dev_percent: 0.588}
      "V(140,40)": {here: 11.7891, committed: 11.8075, dev_percent: -0.156}
