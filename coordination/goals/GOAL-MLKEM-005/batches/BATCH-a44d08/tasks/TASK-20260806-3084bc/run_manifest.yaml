  protocol_deviations:
    - id: D-1
      severity: resolved_transcription_ambiguity
      text: >-
        Prereg section 2.6 writes the N-A3 block-swap basis as
        B' = [[q I_{d-k}, 0],[A^T, I_k]]. With A of shape (k, d-k) as the same
        section fixes, A^T has shape (d-k, k) and cannot occupy a block that must
        be (k, d-k); the frozen text is dimensionally inadmissible as literally
        written. The unique shape-consistent object that "the same A" can denote
        there is A itself, which was used, giving a non-singular B' of determinant
        q^{d-k} with the block roles exchanged -- the stated intent of the control.
        No other reading was run. Disclosed rather than silently resolved.

  objections_recorded_frozen_spec_run_anyway:
    - id: O-1
      text: >-
        The V arm's absolute tolerance component is 2% of the prediction,
        justified in prereg section 2.5 by "the <= 2% agreement the closed-form V
        already shows against committed k = d/2 values". The committed anchors do
        not show that: -3.9%, -4.7%, -3.2%, -1.5%, -1.7% against 9.3628, 6.7504,
        11.8075, 16.2446, 16.269. The 2% floor was set below the closed form's
        own already-committed disagreement with measurement on three of five
        anchors, and that is the mechanism by which M-K is falsified on the V arm
        at points where it misses by +0.78% to +7.5%. Nothing scored was changed:
        the frozen rule was applied exactly as written, per prereg section 5.5.
    - id: O-2
      text: >-
        Separations reported in SE alone are not meaningful on this arm.
        E_I and V are exact deterministic scalars of each frame, SE reaches
        6.6e-11, and the frozen tol_E floor is governed by its absolute
        component at all 36 points. Both denominations are reported.

  anomalies:
    - id: A-1
      class: infrastructure
      text: >-
        The worktree HEAD advanced during the session by a concurrent
        branch-sync merge of origin/main not initiated by this task:
        a240a854a -> adf55b0d4 (recorded by the script at run time) -> 974ad5794.
        9cb2d3e28 is an ancestor of all three; a240a854a is an ancestor of
        974ad5794, so no history was rewritten; prereg.md is byte-identical at
        all three commits and in the working tree with an empty git diff across
        the range; python/numpy/scipy/fpylll unchanged before and after. No input
        to the measurement changed. The run was NOT repeated (maximum_runs = 1).
    - id: A-2
      class: host_condition
      text: >-
        Load average 424/479/425 at start and 375/421/415 at end on 14 shared
        cores. Single process, all BLAS thread counts pinned to 1, no internal
        parallelism.
    - id: A-3
      class: budget
      text: >-
        The budget did not bind. Every planned cell, every beta, both arms and
        all three nulls were measured. Nothing truncated, nothing extrapolated.
    - id: A-4
      class: unexpected_observation
      text: >-
        N-A3 leaves E_I exactly invariant but changes V by up to a factor of 2.3
        (V_swap = beta(1 - beta/d) exactly, the global maximum of V). In B' the
        first d-k rows span K_q exactly, so the tail GSO vectors are the unit
        vectors of K_I -- coordinate-aligned within the block rather than generic
        within it. N-A3 is therefore a valid control for block identity and is
        NOT V-comparable to the real arm. It also re-derives, from a second
        direction, the batch's section 1.1 scope limit that V is a property of a
        basis presentation.
    - id: A-5
      class: unexpected_observation
      text: >-
        On the secondary A-lll arm the residual E_I - k/d is positive at all 36
        points in all four cells, +0.0037 to +0.175, decreasing with beta. A
        statement about the LLL-reduced presentation of these 32 bases at
        d <= 140 and n = 8, and about nothing else.
    - id: A-6
      class: nomenclature_hazard
      text: >-
        fpylll's k counts q-rows; the prereg's k counts identity rows. Off the
        k = d/2 diagonal these are different parameters with the same name. Any
        committed record that read fpylll's k as the identity-block size is
        mislabelled off that diagonal.

  post_hoc_uncitable:
    id: APPENDIX
    text: >-
      A Haar-within-block refinement of V for beta <= min(k,d-k) was computed
      AFTER the frozen verdicts, labelled POST-HOC per prereg section 5.6, and is
      recorded in report_k.md. It is not a result, not a rescoring, and may not
      be cited as evidence for or against either mechanism. It moves the residual
      from +0.78%..+19.10% to -0.02%..-11.09% and does not close the gap.

  wording_rule_compliance:
