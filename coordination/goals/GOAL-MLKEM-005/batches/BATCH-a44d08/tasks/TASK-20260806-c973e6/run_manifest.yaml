protocol_deviations_and_objections:
  - id: DEV-1
    kind: specification_defect_recorded_and_run_anyway
    what: >-
      prereg.md section 4.3 step 5 states parenthetically that all four committed
      unreduced V values lie inside the TL-reachable intervals. That is not
      correct for (140,30): V = 6.750435 is below that cell's V_TL(1/2) =
      8.571429, in all eight draws.
    action: >-
      The frozen section 4.2 UNREACHABLE rule was applied, the (140,30) unreduced
      target excluded and the exclusion reported. No threshold was changed and no
      amendment was made. Realized n_C fell from 12 to 10 as a result.
  - id: DEV-2
    kind: tolerance_not_attainable_at_the_committed_precision
    what: >-
      The frozen 1e-9 absolute V-match tolerance is met by the float64 closed-form
      inverse (max residual 5.33e-15 over all 80 draws) but NOT by the realized
      float32 frame the committed projection consumes (max residual 2.31e-06).
      1e-9 is unattainable at float32 frame precision.
    action: >-
      The committed float32 frame convention was kept so that the GR and unreduced
      arms bit-reproduce the committed measurement; the frozen tolerance was not
      edited; both residuals are reported per pair. At dD/dV <= 0.0048 the worst
      residual moves D by ~1.1e-08 against falsifying differences of 4.0e-03 and
      6.3e-03.
  - id: DEV-3
    kind: implementation_choice_within_the_frozen_specification
    what: >-
      prereg.md section 4.2 does not state whether V is matched per draw or at the
      arm mean. This run matched u_j to V_GR,j PER DRAW.
    action: >-
      Recorded. Per-draw matching is the stricter reading and makes D_GR,j - D_TL,j
      a paired difference at equal V. Mean-level matching would have made all 8 TL
      frames identical, giving sd(D_TL) = 0 and inflating abs-t by exactly
      sqrt(1+n) = 3, which is what the degenerate instrument check exhibits.
  - id: DEV-4
    kind: defect_in_the_immutable_run_record_prose
    what: >-
      The prose field could_not_fail_demonstration.form_1_within_path_co_monotonicity.
      committed_path_evidence_note inside vmatch.json asserts the inversion count
      "is 0 IDENTICALLY". The computed field beside it is correct and reads 9 / 4 /
      4 / 5 out of 156 ordered pairs.
    action: >-
      vmatch.json is IMMUTABLE and was NOT edited. The correction is recorded in
      vmatch_report.md section 6 Form 1 and here, and is flagged for the Validator. The
      corrected, narrower statement still supports Form 1: all 22 inversions lie
      between grid points with t >= 0.05, on the Haar plateau, and none is in the
      t <= 0.01 region the scored comparison inhabits.
  - id: DEV-5
    kind: instrument_fact
    what: "One-ULP scipy.special.betaincinv difference in the two d = 140 cells versus the committed run, giving 2.22e-16 in D."
    action: "Recorded; below every reported precision and quantified in instrument_checks."
  - id: LIM-1
    kind: limitation_of_the_frozen_statistic
    what: >-
      The frozen SE is a between-frame dispersion at n = 8 over a SHARED N = 2^20
      error sample. It does not contain the finite-N sampling error of the 2^-10
      order statistic, which is common-mode within an arm and cancels only to the
      extent the two frames are alike.
    action: "Recorded, not re-derived. For the Validator and the Reviewer to weigh."
  - id: LIM-2
    kind: missing_control_named_rather_than_asserted
    what: >-
      No null calibration of the frozen falsifier exists in this batch. The
      degenerate instrument check is one point of a statistic mis-scaled there by a
      known factor of 3.
    action: >-
      Named as a concrete follow-up for the Coordinator: two genuinely exchangeable
      frame families at matched V, replicated enough to estimate a false-
      falsification rate. NOT claimed to have been done.

