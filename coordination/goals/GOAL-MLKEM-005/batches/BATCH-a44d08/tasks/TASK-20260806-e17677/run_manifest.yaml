    deviation_localization:
      finding: >-
        The deviation is exactly 0.0 in all 224 values at d = 100 and exactly
        2.220446049250313e-16 (one ULP near 1.09) in all 224 values at d = 140,
        uniformly across 28 of 56 arms including the Haar null arm.
      cause_identified: >-
        q_Beta(2^-10) = betaincinv(beta/2,(d-beta)/2,2^-10) is bitwise identical
        to the committed value at d = 100 and differs by exactly -1 ULP at
        d = 140: 0.08929288718043772 vs 0.08929288718043771 and
        0.14038737713830948 vs 0.14038737713830945. That divisor is a
        deterministic special-function evaluation, not a measurement.
      honest_limit: >-
        Reconstructing q_emp = r * q_Beta from recorded values agrees to
        <= 3.85e-16 and is bitwise identical in 393 of 448, but that round trip
        is not an exact inverse, so a residual ULP-level difference in the order
        statistic itself is NOT excluded by this check.
      effect_on_anything_scored: >-
        none at any reported digit. Relative size 2e-16 against smallest scored
        quantities of order 1e-4.
