  protocol:
    frozen_source: prereg.md Section B (sections 3.1 - 3.6)
    grid: "the AM-1 13-point t grid, RETAINED and NOT re-litigated"
    graded_t: [0.0, 0.0025, 0.005, 0.0075, 0.01, 0.015, 0.02, 0.03, 0.05, 0.1, 0.25, 0.5, 1.0]
    cells: [[100, 30], [100, 40], [140, 30], [140, 40]]
    q: 3329
    error_law: CBD_eta2 (mu_4 = 2.5 exactly)
    statistic: "R = ||Q^T e||^2 / ||e||^2"
    estimator: "q_emp(p) = sort(R)[round(p*N) - 1]; index 1023 at p = 2^-10, N = 2^20"
    r_definition: "r = q_emp(2^-10) / q_Beta(2^-10)"
    draws_per_arm: 8
    graded_family: >-
      Q_t = QR( sqrt(1-t)*E_S + sqrt(t)*G ), (S_j, G_j) drawn ONCE per (d,beta,j)
      from seed_graded BEFORE and independently of the t list and reused across
      every t, so the family is a path.
    null_arm: "Haar frames from seed_haar, scored on the identical code path"
    bkz_run: false
    lll_run: false
    gate_carried: "SE_diff(A) = sqrt(sd_A^2/8 + sd_haar^2/8); gate clears iff |shift| >= 4.0 * SE_diff"
    gate_disclosure: >-
      4.0 is a NOMINAL FACTOR, NOT A P-VALUE. The validator measured this gate's
      realized one-sided false-positive rate at 0.0015-0.0025 against a nominal
      3e-5, a factor of about 60 [quoted: BATCH-f19c37 validation_report.yaml
      item 4 / V-5].
    am3_gate_frozen:
      delta: "Delta_i = m(t_{i+1}) - m(t_i), m(t) = mean_j r_A(2^-10)"
      se_step: "SE_step(i) = sd_j( r_j(t_{i+1}) - r_j(t_i) )/sqrt(8), ddof=1, paired"
      epsilon: "epsilon_i = 1.0 * SE_diff(A, t_i)"
      violation: "(Delta_i - epsilon_i)/SE_step(i) > t_crit"
      t_crit: 4.2071245566046755
      t_crit_label: "t_{7,0.998}"
      t_crit_recomputed_here: 4.2071245566046755
      t_crit_agrees_to_last_bit: true
      alpha_per_step_declared: 0.002
      alpha_per_step_recomputed_here: 0.0019999999999982102
      multiplicity_family: "12 steps x 4 cells = 48 comparisons, and nothing else"
      declared_family_wise_false_failure_rate: 0.096
      declared_rate_basis: "union bound 48 x 0.002, valid under ANY dependence"
      sidak_reference_not_the_declared_rate: 0.0916233087376801
      sidak_recomputed_here: 0.0916233087376801
      degenerate_branch: implemented; not taken (0 degenerate steps of 48)
    withdrawn_rule_status: >-
      The AM-1 G3 tolerance withdrawn by DEC-20260806-14ac13 (a fixed multiple of
      SE_step_paired with no absolute floor and no multiplicity policy) is NOT
      implemented anywhere in measure_g3.py. It was not computed, not reported,
      and not reached for. SE_step_paired appears only as the denominator the
      frozen AM-3 statistic specifies.
    post_hoc_alternatives_computed: none
    validator_item_3_counterfactual_cited: false

