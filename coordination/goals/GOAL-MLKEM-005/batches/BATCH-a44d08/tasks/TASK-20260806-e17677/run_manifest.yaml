    - id: A-3
      class: budget
      text: >-
        The budget did not bind. 28.97 s of 5400 s wall, 1.264 GB of 4 GB peak
        RSS, 1 run of 1. All four cells, all 13 grid points, all 48 comparisons
        and all 20 positive-control scorings completed. Nothing truncated,
        nothing extrapolated, no rerun.
    - id: A-4
      class: unexpected_observation
      text: >-
        The seed-cache reproduction returned 2.220446049250313e-16 rather than
        the carried 0.0 on the Section B path. Located: exactly 0.0 at d = 100
        and exactly one ULP at d = 140 across all 28 d = 140 arms, coinciding
