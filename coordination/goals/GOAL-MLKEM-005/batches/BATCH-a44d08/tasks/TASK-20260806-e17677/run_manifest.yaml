  could_not_fail_demonstration:
    named_by_the_prereg_for_section_B: prereg section 3.6
    form_1: >-
      the mirror of AM-1 -- setting alpha and epsilon so loose that no real path
      can ever violate, so that "the instrument is VALID" becomes a property of
      the gate
    form_1_disposition: >-
      This is what the frozen positive control exists to detect, and on this run
      it detected something: three of four cells returned AM3-TIE at every c up
      to 6 x SE_diff. The frozen response is the INADMISSIBLE branch, and that is
      this run's reported result. The one cell whose injected step was not in the
      descent region fires at c = 3 with target statistic +5.4430, so the gate is
      not incapable of firing in principle.
    form_2: >-
      the AM-3 loophole -- declaring a rate secretly conditional on a nuisance
      quantity the run supplies
    form_2_disposition: >-
      Checked mechanically: the bound of prereg 3.3 uses only epsilon_i >= 0
      pointwise, and all 48 realized epsilon_i are >= 0 with minimum 7.98423e-04.
      The declared 0.096 recomputes from t_crit and the family size alone, with
      no measured input. The one conditional statement (3.4's power figure) is
      labelled conditional and its realized ratios are printed.
    the_arrangement_in_which_THIS_RUN_could_not_have_failed:
      named_before_the_run: >-
        A re-run that (i) re-derived the gate from the data it then scores, or
        (ii) scored only the injected positive control and not the real arms, or
        (iii) chose the "hardest" step after seeing where the gate fires most
        easily, or (iv) quietly computed the withdrawn SE_step_paired tolerance
        and reported whichever verdict read better.
      demonstration:
        - >-
          (i) Every threshold is a module-level literal in measure_g3.py,
          transcribed from a prereg.md whose sha256 is checked against five
          carriers including the blob inside the notarizing commit, with an
          implemented abort-on-mismatch. The ordering is a property of the git
          record.
        - >-
          (ii) The real arms and the injected control are both scored and both
          reported, and every control run carries the cell's uninjected outcome
          beside it.
        - >-
          (iii) The step choice is argmax over the twelve lower endpoints of
          SE_diff, frozen before any datum, with the full SE_diff table recorded
          so a reader can recompute it. This run had every incentive to choose
          differently -- the frozen choice is what produced INADMISSIBLE -- and
          did not.
        - >-
          (iv) The withdrawn rule is not implemented in measure_g3.py and is
          verifiable by grep. No post-hoc alternative rule was computed and none
          is presented beside the verdict. The validator's item-3 counterfactual
          is not cited.
      scorer_implementation_check:
        status: IMPLEMENTATION CHECK of the frozen scorer. Not a result, not a
          control, not an alternative rule.
        case_strictly_decreasing: {expected: AM3-PASS, got: AM3-PASS}
        case_large_injected_increase: {expected: AM3-FAIL, got: AM3-FAIL}
        case_negligible_increase: {expected: AM3-TIE, got: AM3-TIE}
      residue_not_closed: >-
        Off-repository pre-computation; the run's own reading of the frozen text
        against its author's intent; and every limit of the instrument --
        presentation-dependence of V (prereg 1.1), n = 8 draws, and the fact that
        a criterion with a correctly declared false-failure rate is still only a
        criterion about this instrument.

