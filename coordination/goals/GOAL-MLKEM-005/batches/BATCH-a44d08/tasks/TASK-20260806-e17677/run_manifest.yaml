run_manifest:
  task_id: TASK-20260806-e17677
  batch_id: BATCH-a44d08
  goal_id: GOAL-MLKEM-005
  section: B
  title: >-
    AM-3 -- the AM-1 graded family re-run and scored under the notarized
    replacement gate
  role: executor
  kind: measurement
  status: completed_valid
  status_note: >-
    completed_valid describes the RUN, not the gate. The measurement executed to
    completion inside budget, every planned comparison is terminal, and the
    reproduction re-verified. The frozen positive control of prereg section 3.5
    returned its INADMISSIBLE branch, which is a recorded RESULT of a valid run,
    not a failure of the run.
  claim_tier: toy
  claim_tier_note: >-
    Nothing in this run bears on ML-KEM security, on any FIPS 203 parameter set,
    on any attack cost, or on any cost model. Every number is measured at
    d in {100,140}, beta in {30,40}, n = 8 draws, N = 2^20 error vectors, and is
    transported to no other parameter set by extrapolation or analogy. No
    hypothesis status moves, no evidence record is written, and no heuristic is
    declared validated or refuted.

  headline_result:
    frozen_clause: >-
      prereg section 3.5: if any cell fails to return AM3-FAIL at c = 6, the AM-3
      gate is declared INADMISSIBLE for this goal and the demonstration reports
      that as its result, with no verdict on the real arms.
    outcome: THE AM-3 GATE IS INADMISSIBLE
    basis: >-
      d100_b30, d140_b30 and d140_b40 return AM3-TIE at every c in {1,2,3,4,6}.
      Only d100_b40 returns AM3-FAIL, at c = 3.
    consequence: >-
      The per-cell AM-3 readings on the real arms were computed and are recorded
      in full in results_g3.json and report_g3.md section 4. Under section 3.5
      they do NOT stand as a verdict on the real arms and are marked WITHHELD
      wherever a verdict would otherwise be stated.
    it_is_an_instrument_outcome: >-
      INADMISSIBLE is a statement about the criterion. It is never evidence
      about lattices in either direction, and it is not a judgement on whether
      amendment AM-3 is adequate -- that judgement belongs to the Reviewer and
      the Coordinator.

  certificate:
    kind: none
    reason: >-
      Pure measurement run. No discrete-log solve and no factor-base relation is
      claimed, so docs/claims-and-verification.md requires no solution
      certificate. Independent re-verification carried by this run instead:
      (1) the whole Section B measurement path regenerated from seeds and
      compared value-by-value against the committed BATCH-f19c37 record,
      448 per-draw values, max deviation 2.220446049250313e-16;
      (2) the six shared t means against BATCH-436ddd, 24 values, max deviation
      4.440892098500626e-16;
      (3) the basis-generation half of the 32 seed-cache reductions regenerated
      with NO LLL and NO BKZ, 32 bases, b0_norm_raw max relative deviation 0.0
      and raw GSO log2 slope max absolute deviation 9.325873406851315e-15;
      (4) t_crit, the per-step alpha, the union bound and the Sidak reference
      each recomputed from scratch and matching the notarized declaration;
      (5) an implementation check of the frozen scorer on three synthetic inputs
      whose correct AM-3 outcome is fixed by construction, all three correct.

