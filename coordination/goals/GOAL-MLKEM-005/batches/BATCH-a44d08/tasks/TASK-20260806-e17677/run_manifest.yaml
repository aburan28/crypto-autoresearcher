  objections_recorded_frozen_spec_run_anyway:
    - id: O-1
      recorded_under: prereg section 5.5
      text: >-
        The positive control of section 3.5 cannot demonstrate what section 3.6
        needs it to demonstrate at the step its own selection rule chooses. The
        rule selects argmax SE_diff(A,t_i), and SE_diff is largest where the
        arm's own dispersion is largest, which on this family is at the top of
        the steep descent -- the same steps where |Delta_i| is 10 to 40 times the
        injection unit. In d100_b30, d140_b30 and d140_b40 the measured Delta_i
        at the selected step is -1.72e-02 to -4.54e-02 while 6 x SE_diff is only
        9.3e-03 to 1.2e-02, so the injected Delta stays negative at c = 6 and no
        positive increase exists to be flagged. Section 3.5's premise that adding
        c x SE_diff creates "a known monotonicity violation of exactly that size"
        holds only where the true Delta_i is 0. The step-selection rule and the
        injection scale are coupled through the same quantity. The frozen text
        was implemented exactly as written, the frozen INADMISSIBLE branch was
        taken, and no repair, alternative injection point, alternative c grid or
        rescoring was computed anywhere. Any adjustment is an amendment for the
        Coordinator to record as a new decision; this run does not make one and
        does not propose a specific one.

  anomalies:
    - id: A-1
      class: infrastructure_error
      text: >-
        The stdout capture of the authorized run was corrupted by a concurrent
        writer. A concurrently running sibling subagent -- the Section C task
        TASK-20260806-c973e6, executing in the same worktree -- resolved to the
        same scratchpad directory and wrote to the same stdout.log path. The
        captured file contains that task's Section C verification header, a run
        of padding, and only the TAIL of this run's output (from the
        "[arms] d140_b40" line onward); the lost lines are four progress lines.
        The measurement process itself is unaffected -- separate OS process,
        separate memory, deterministic seeds, its own output file at its own
        path -- and every number that was printed is also recorded in
        results_g3.json, with the surviving tail agreeing at every digit. The
        seed-cache reproduction independently corroborates that the computation
        was not disturbed. THE RUN WAS NOT REPEATED (maximum_runs = 1). Nothing
        in report_g3.md is transcribed from the damaged file. Classified as
        infrastructure_error, not invalid_measurement: it damaged an artifact of
        the reproduction package, not a measurement. Forward note for the
        Coordinator: concurrent subagents in this harness can share a scratchpad
        path, so per-task log filenames should be namespaced by task id.
    - id: A-2
      class: host_condition
      text: >-
        Load average 177.97/249.19/385.03 at start and 185.90/244.33/378.56 at
        end on 14 shared cores. Single process, all BLAS thread counts pinned to
