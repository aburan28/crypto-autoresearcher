        Reported rather than rounded to "identical". No scored digit is affected.
    - id: A-5
      class: unexpected_observation
      text: >-
        The frozen control's step-selection rule and its injection scale are
        coupled through SE_diff, which is what makes three of four cells
        unflaggable at the frozen maximum c. See O-1. Recorded as an observation
