  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-c347e1/tasks/TASK-20260812-2a3aa0/reconciliation_notes.md
  proof_status_note: >-
    `derivation` in the sense of docs/claims-and-verification.md, and it is claimed FOR THE
    NARROWING READINGS ONLY -- the statements that a named sentence in one chain reaches
    further than what was shown. IT IS NOT CLAIMED FOR THE AGREEMENT LIST, WHICH IS
    EMPIRICAL AND IS LABELLED PROCEDURAL.
    (a) THE FAMILY-CONDITIONALITY NARROWING (that G-VAR's firing is a joint property of
    (observable, family) and that AM-16(d)'s validation object is F0-only) rests on a BUILT
    COUNTEREXAMPLE INSTANCE, packaged as a re-executable probe with its recorded output:
    probe_gvar_family.py, in which G-VAR fires 38 of 38 on both rdet and X_null in F0 and 0
    of 38 on both in F1 while X_null still walks G-REL1 10 of 10 and G-REL2 19 of 19 and
    still reads zero entries of A_i; with the separate witness probe
    probe_gvar_relabel_witness.py reporting F1's X_null taking 8 distinct IEEE-754 values
    strictly increasing in the basis index at 6 of 6 cells against 1 distinct value at 6 of 6
    in F0. Both are committed in this tree BEFORE this record.
    (b) THE ROUTE-CONDITIONALITY finding it complements, from wave 1, likewise rests on a
    BUILT COUNTEREXAMPLE: probe_nullroute.py, in which the same closed form evaluated by QR
    of B^T or on an ambient-isometry presentation BH is 0 of 38 cells bit-identical, agrees
    with the closed form to 5.07e-14 and 3.11e-14 relative, reproduces the notarized prereg
    2.6 table at 304 of 304 cell-by-basis entries and is ADMITTED. It is corroborated inside
    the producer's own committed artifact by
    forced_arithmetic.rdet_T1_ambient_isometry_residual = 3.865352482534945e-12.
    (c) THE EVADABILITY finding (O-2) rests on a built construction executed through the
    producer's own committed gate code -- its own rho_both(), summarize() and bit_identical()
    -- rather than on a standalone packaged probe. THAT WEAKER PACKAGING IS STATED RATHER
    THAN HIDDEN, and it is why the finding is labelled single-source.
    (d) THE OVER-CLOSURE NARROWING (RT-R3) IS A DERIVATION NOTE AND NEEDS NO MEASUREMENT: a
    demonstration that PASSING a gate carries no information cannot bound the gate's REFUSAL
    side, and no party has measured a false-refusal rate. The wave-2 Red Team says exactly
    this of it and the argument is archived in its report.
    EMPIRICAL_ONLY, DECLARED AS SUCH: every count, every mean, every paired t, every
    detection floor, every null distribution, the two waves' n_fire replicates and Monte
    Carlo, the effect-free 8x4 null tables, and both waves' centered C2 ladders. These are
    measurements at the stated scope and carry no derivation.
    NO REFUTATION ARTIFACT IS OWED FOR AN ADVERSE TRANSITION, BECAUSE NONE IS MADE. The
    decision this record supports is `revise`; no hypothesis status moves; nothing is
    weakened or rejected; and no theory is called wrong. The narrowings above are narrowings
    of the REACH of recorded readings, and the artifacts backing each are archived in this
    tree AHEAD of the decision that cites them, so a successor can check them rather than
    take them.

