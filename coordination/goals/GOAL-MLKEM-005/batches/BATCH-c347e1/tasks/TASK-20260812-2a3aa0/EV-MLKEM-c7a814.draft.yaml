  direction_note: >-
    NEUTRAL, and this is the honest reading rather than a hedge. Nothing here supports,
    weakens or contradicts any hypothesis about lattices, about reduction, about the Beta
    tail law, or about ML-KEM. What this record establishes is (i) which findings the two
    independent review waves reached IN COMMON, labelled precisely as a TWO-SAMPLE
    AGREEMENT OF ONE MODEL; (ii) which are unique to each; (iii) that the two waves' operative
    VERDICTS AGREE, with one substantive divergence and one unresolved numeric discrepancy;
    and (iv) that DEC-20260809-afe29b's "R-OUT-1 STANDS" SURVIVES as scoped, AM-15 survives
    untouched, AM-16 survives with its validation clause (d) shown insufficient, and the
    "in either direction" closure survives only as an ABSTENTION and not as a demonstrated
    closure.

  # ==================================================================
  # WHAT THIS RECORD COVERS
  # ==================================================================
  scope_of_this_record: >-
    THIS IS THE EVIDENCE RECORD FOR THE RECONCILIATION OF TWO INDEPENDENT REVIEW WAVES OVER
    ONE PRODUCER SNAPSHOT, AND FOR NOTHING ELSE. It supports DEC-20260812-2233ed. IT
    SUPERSEDES BY REFERENCE AND EDITS NOTHING: EV-MLKEM-9346bb, DEC-20260809-afe29b,
    KN-FIND-2a35aa, EV-MLKEM-e45478 and DEC-20260812-15d3b2 all remain valid, immutable and
    citable, and none of their superseded_by fields is touched. BOTH CHAINS ARE VALID AND
    NEITHER IS DELETED. It adjudicates no producer outcome row into a claim about lattices,
    moves no hypothesis, promotes nothing to knowledge/, and asserts nothing about ML-KEM.

  strength: replicated
  strength_basis: >-
    `replicated` IS CLAIMED FOR A NAMED SET OF INSTRUMENT FACTS THAT TWO INDEPENDENT REVIEW
    WAVES REACHED SEPARATELY OVER ONE PRODUCER SNAPSHOT, AND FOR NOTHING ELSE. IT IS NOT
    CLAIMED FOR ANY STATEMENT ABOUT LATTICES, NOT FOR ANY PRODUCER HEADLINE AS ORIGINALLY
    STATED, AND NOT FOR ANY SINGLE-SOURCE CONSTRUCTION IN EITHER WAVE.
    (i) THE LABEL'S EXACT MEANING HERE, STATED BEFORE ANYTHING IT COVERS. All four reviewer
    sessions across both waves resolve to the same model: wave 2 records resolved_model_id
    claude-opus-5 for both of its sessions, wave 1 records resolved_model_id null with the
    identical verification gap, and ALL FOUR record model_verified false with their reasons.
    AGENTS.md RULE 12 IS UNMET AND UNWAIVED. So `replicated` here means PROCEDURALLY
    REPLICATED -- two samples of one model, formed in separate sessions on separate branches
    without reference to each other -- AND IT DOES NOT MEAN MODEL-LEVEL CORROBORATION, DOES
    NOT MEAN INDEPENDENT REPLICATION, AND DOES NOT ADD ONE STEP TO THIS GOAL'S
    INDEPENDENCE BUDGET. It discriminates against a SESSION-LEVEL artifact and NOT AT ALL
    against a shared model-level bias or blind spot.
    (ii) THE STRONGER SUBSET, WHERE BOTH WAVES BUILT THE OBJECT RATHER THAN READING THE SAME
    BYTES. Exactly two items. THE CENTERED C2 CONTROL: built independently in both waves, and
    both report 0 OF 10 TARGETS FIRING AT delta/SE <= 1.0, corroborating the producer's own
    diagnosis of P-C2c which the producer correctly declined to test. n_fire's DISPERSION:
    wave 1 by a 20000-rep Monte Carlo of the frozen statistic giving a sampling sd of about
    4.2 of 48, wave 2 empirically over 8 independently seeded replicates giving 32.1 +/-
    3.60 with 3.60 declared a LOWER bound -- two disjoint constructions, consistent answers,
    and the same conclusion that the single reported value of 35 is not a property of the
    estimator.
    (iii) THE WEAKER SUBSET, RE-READ OR RE-COMPUTED FROM THE SAME COMMITTED BYTES. The
    producer arithmetic reproducing from raw at zero mismatches in both waves; the
    notarization chain in both directions; the 30-for-30 content match, verified by both at
    the DECLARED COMMITS as well as the working tree; the D3 table at 9 dangling and 9
    undeclared; the 117-cell agreement of every 8-basis aggregation reading; the
    zero-dispersion bit-identity of X_null and of the UNPLANTED X8 = rdet at 38 of 38 cells in
    the frozen family; the decay-check FAIL surviving eleven independently seeded families
    across the two waves with none within seven steps of the pre-registered PASS threshold of
    21 of 48; Section C1's re-score changing no verdict; and the corrected range endpoints
    4.87x to 31.03x. These may be cited as REPRODUCED TWICE, BY ONE MODEL, IN TWO SESSIONS.
    (iv) SINGLE-SOURCE, AND NOT COVERED BY THE LABEL IN ANY DEGREE. Wave-1's RT-1 six-route
    table; wave-2's RT-R1 nearby family F1 and its witness probe; wave-2's Validator O-2
    evasion; wave-2's RT-C1a and RT-C1b effect-free null tables; wave-2's F-2 across-cell
    aggregation finding; wave-1's RT-3 amplitude table, RT-4 falsifier probability, RT-6
    saturation result and RT-10 tau_rel dispersion reading. Each exists in exactly one review
    session and has been re-executed by no party independent of the reviewer that built it.
    THE TWO-WAVE AGREEMENT DOES NOT REACH ANY OF THEM.
    (v) AND WHAT THE LABEL DOES NOT SOFTEN. The two waves DISAGREE about whether a closure was
    earned, and they report incompatible counts of one quantity from one committed file. Both
    are recorded below rather than smoothed, and neither is adjudicated by me.

  claim_tier: toy
  claim_tier_note: >-
    TOY, UNCONDITIONALLY. The union of the two waves' tested scope: q = 3329 and q <= 3329 in
    the C-sections, d in {20, 30, 40, 100, 140}, k the identity block, the frozen beta grid, 8
    frozen bases per lattice drawn from the carried seed formula, 48 HKZ reductions with
    reported max hkz_violation 0.0 at d <= 40 ONLY and no reduction beyond the frozen HKZ
    pipeline, N = 2^20 CBD_{eta=2} draws and 13 independent Haar frame stacks in Section
    B-prime, S = 8 supports and E = 4 error pools and the 2^-10 quantile only in Sections C1
    and C2, and one committed 8x4 Delta table per target. NOTHING IN THIS RECORD, IN EITHER
    WAVE, OR IN BATCH-9e3584 BEARS ON ML-KEM SECURITY, ON ANY FIPS 203 PARAMETER SET, ON ANY
    ATTACK COST, OR ON ANY COST MODEL. No number here is transported to beta = 606, d = 1420
    or any other parameter set by extrapolation, by analogy, or by any other route. THERE IS
    NO ALGORITHM, NO ATTACK AND NO COST MODEL, HENCE NO CRYPTOGRAPHIC BASELINE, and
    dominated_by and sota_delta are NOT APPLICABLE FOR THAT REASON -- checked against time,
    memory and data/queries by establishing that neither wave claims any of them -- and not by
    omission. Both waves report searching all four producer reports and the pre-registration
    for an operation count, a bit-security figure or a parameter-set cost and finding none.

