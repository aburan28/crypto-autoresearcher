  inference: >-
    TWO INDEPENDENT REVIEW WAVES OVER ONE PRODUCER SNAPSHOT AGREE ON EVERY OPERATIVE VERDICT AND
    ON EIGHTEEN NAMED INSTRUMENT FACTS, DISAGREE SUBSTANTIVELY ABOUT EXACTLY ONE THING, AND
    REPORT INCOMPATIBLE COUNTS OF EXACTLY ONE QUANTITY -- AND THE AGREEMENT IS WORTH STRICTLY
    LESS THAN IT LOOKS, BECAUSE ALL FOUR REVIEWER SESSIONS RESOLVE TO ONE MODEL. That last
    sentence governs everything before it: this is a TWO-SAMPLE AGREEMENT OF ONE MODEL, it
    discriminates against a session-level artifact and not at all against a shared model-level
    bias, and AGENTS.md rule 12 remains UNMET AND UNWAIVED in this goal.
    ON THE SCIENCE. R-OUT-1 SURVIVES AS SCOPED and both waves agree on the proposition: in the
    frozen family, under the criterion as frozen, a parameter-determined closed form and the
    UNPLANTED X8 = rdet both walk the relevance clauses while bit-identical across all 8 bases at
    38 of 38 cells, so PASSING THE GATE CARRIES NO INFORMATION ABOUT A BASIS AT FIXED
    (d, k, beta, q). BOTH RED TEAMS INDEPENDENTLY CONCLUDE THAT ADDING G-VAR DOES NOT REPAIR THE
    GATE, by two disjoint mechanisms with two built counterexamples -- wave 1 by changing the
    ARITHMETIC ROUTE, wave 2 by changing the FAMILY -- and neither ran the other's construction.
    The convergence of two independent attacks on one conclusion is the strongest result of this
    reconciliation, and it is a convergence of mechanisms rather than a replication of a
    measurement.
    ON THE INSTRUMENT. AM-15 survives untouched and its grounds are now two-wave. AM-16 survives
    as an amendment, and its VALIDATION CLAUSE (d) IS SHOWN INSUFFICIENT: every route in
    probe_nullroute.py lives in F0, which is precisely the family in which a dispersion criterion
    has the most power against a determinant-only functional, so a criterion validated only there
    would be scored in the one arrangement where its own family-blindness cannot appear. The two
    waves' validation objects are complementary and neither alone suffices. Independently, wave-2
    O-2 shows G-VAR AS FROZEN IS NECESSARY BUT NOT SUFFICIENT: an additive perturbation of
    relative size about 1e-10, carrying no usable information about the basis, is ADMITTED while
    walking both relevance clauses.
    ON THE ONE DISAGREEMENT. "No admissibility claim is reportable from this gate in either
    direction" SURVIVES AS AN ABSTENTION AND NOT AS A DEMONSTRATED CLOSURE. Both waves agree on
    what to do; they disagree on what was shown. Only the PASS side was demonstrated vacuous; the
    REFUSAL SIDE IS UNTESTED IN EITHER DIRECTION and its false-refusal rate has never been
    measured. Wave 1 does not record that gap at all and wave 2 does, and only wave 2 generates
    the cheap, named, pre-registerable experiment that would close it. THAT IS THE CONCRETE RETURN
    ON A SECOND WAVE, and it is the single most consequential difference between the two chains.
    ON WHAT NEITHER WAVE DECIDES. No hypothesis status moves. No producer outcome row becomes a
    claim about lattices. No admissibility claim is made in either direction. AM-3 is not retired,
    BATCH-a44d08 is not rescored in any respect, AM-10 through AM-14 and their carries are in
    force and are not re-litigated, and the BATCH-cbe023 non-citable carries stand unchanged. "A
    factor of 6 to 31" is corrected to 4.87x to 31.03x and may never be re-cited; the count of
    entries below 6x is additionally non-citable from either wave pending re-measurement. CLAIM
    TIER STAYS TOY: nothing in BATCH-9e3584, in either wave, or in this record bears on ML-KEM
    security, on any FIPS 203 parameter set, on any attack cost, or on any cost model.

