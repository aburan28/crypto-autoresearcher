      WAVE 2 AND NEITHER REPAIRED BY ME: TASK-20260809-97d6cf's manifest records no max_rss
      and TASK-20260809-3eb72c's carries no resources block, both figures being present in the
      corresponding results JSON. Wave 1 reports 4 of 4 schema-complete manifests declaring
      seven artifacts each under their COMMITTED names with zero undeclared and zero missing;
      wave 2 reports the same plus the BATCH-cbe023 folded-scalar defect NOT recurring, at 12
      of 12 declared paths plain, resolving and unfolded. THE TWO WAVES ARE CONSISTENT AND
