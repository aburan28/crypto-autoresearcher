      returned, 20 probe files declared and 20 present by my own listing. Wave 2: two review
      slots (TASK-20260812-da8c3b, TASK-20260812-aadafd), both returned, 28 probe files
      declared with 7 .py files present by my own listing. Four producer tasks at 1 of 1 run
      each, verified by both waves independently. NO RUN WAS DISCARDED IN EITHER WAVE, no
      selection was applied by any producer, and both waves' reviewers disclosed their own
      execution counts against maximum_runs 1 rather than stretching the number silently.
    schema_complete_manifests: >-
