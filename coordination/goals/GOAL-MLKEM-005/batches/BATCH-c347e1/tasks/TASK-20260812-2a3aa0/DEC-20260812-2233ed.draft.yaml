      cells and 38 G-REL1 entries at max deviation 0.00e+00 on each of nine statistics,
      and the whole C1 table and C2 ladder rebuilt from the committed raw 8x4 tables.
    - >-
      C-3 THE NOTARIZATION CHAIN HOLDS IN BOTH DIRECTIONS. The prereg sha256
      190cf4740b0ecefdbe7d1da0868a6258352b044ae5e99da470060f94049c70ea agrees from the
      working tree, from the blob at 1aa7db53, from the committed sidecar, and with all
