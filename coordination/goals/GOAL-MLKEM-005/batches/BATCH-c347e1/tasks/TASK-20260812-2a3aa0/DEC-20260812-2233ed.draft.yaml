  # ==================================================================
  # WHERE EACH WAVE IS NARROWED BY THIS RECORD -- BY REFERENCE, NEVER BY CORRECTION
  # ==================================================================
  narrowing_by_reference:
    principle: >-
      AGENTS.md rule 4 gives one instrument for a conflict inside an immutable record: a
      new record under a new id. NOTHING BELOW IS AN EDIT, A CORRECTION OR A RETIREMENT.
      EV-MLKEM-9346bb, DEC-20260809-afe29b, KN-FIND-2a35aa, EV-MLKEM-e45478 and
      DEC-20260812-15d3b2 stand as written, remain citable, and keep their superseded_by
      fields untouched. What is narrowed is the REACH of named sentences, and every
      narrowing below is about NOVELTY or about BASIS, never about correctness of a
      measurement.
    EV_MLKEM_e45478_is_narrowed_here_not_corrected:
    - >-
      N-1 RT-R1'S CONSEQUENCE WAS ALREADY ESTABLISHED BY WAVE 1; ITS MECHANISM WAS NOT.
      EV-MLKEM-e45478's inference states that in F1 "adding G-VAR is NOT the repair the
      report proposes". THAT CONCLUSION WAS ALREADY REACHED, ARCHIVED AND PROMOTED TO THE
      CORPUS BY WAVE 1, on independent grounds -- RT-1's six-route table, OBS-2, OBS-14's
      compositional statement, KN-FIND-2a35aa section 5, and AM-16 enacted on those
      grounds. RT-R1 IS A SECOND, DISJOINT ESCAPE MECHANISM FOR AN ALREADY-ESTABLISHED
      CONCLUSION, NOT ITS DISCOVERY. The narrowing cuts the novelty claim and RAISES the
      evidential weight of the conclusion itself: two independent escape mechanisms, two
      built counterexamples, from two waves that did not read each other.
    - >-
      N-2 THE CENTERED C2 LADDER IS NOT A CONTROL "THE BATCH DID NOT CONTAIN".
      DEC-20260812-15d3b2's rationale lists "the centered ladder Section C2 deferred"
      among four controls the batch lacked. Wave 1's Red Team had ALREADY BUILT IT
      (probe_c2_centered.py), obtained the identical result of 0 of 10 targets firing at
      delta/SE <= 1.0, and archived it, and wave 1's decision cites it. NARROWED as to
      novelty -- and independently built TWICE with the same answer, which is stronger
      than new.
    - >-
      N-3 THE 8-REPLICATE n_fire DISPERSION ESTIMATE AND THE INDEPENDENTLY SEEDED NULL
      FAMILY ARE NOT THE FIRST OF THEIR KIND. Wave 1 had already built TWO independently
      seeded null families (35 and 39 of 48) and had already measured n_fire's sampling
      dispersion at about 4.2 of 48 by a 20000-rep Monte Carlo, recording explicitly that
      n_fire is reported without any dispersion anywhere. NARROWED as to novelty; wave 2's
      empirical 3.60 (declared a lower bound) and wave 1's modelled 4.2 are two
      differently constructed estimates of one quantity and they are CONSISTENT.
    - >-
      N-4 NOT NARROWED, AND RECORDED SO THE NARROWING IS NOT READ AS WHOLESALE: the
      effect-free 8x4 null tables (RT-C1a, RT-C1b) have NO wave-1 counterpart, and RT-R3
      says something wave 1 neither said nor refuted. Both stand in full.
    EV_MLKEM_9346bb_is_narrowed_here_not_corrected:
    - >-
      N-5 "G-VAR IS NON-VACUOUS IN BOTH DIRECTIONS"
      (EV-MLKEM-9346bb.validity_verification.control_comparability) IS NARROWED. G-VAR is
      non-vacuous ON THE FROZEN FAMILY AND AGAINST EXACTLY-ZERO-DISPERSION CLOSED FORMS.
      It ADMITS a 1e-10 perturbation carrying no usable information about the basis (wave-2
      O-2) and it refuses NOTHING in the nearby family F1 (wave-2 RT-R1). The measurement
      wave 1 reports is correct; what is narrowed is what it licenses.
    - >-
      N-6 THE "IN EITHER DIRECTION" CLOSURE IS NARROWED TO AN ABSTENTION. See
      d_survival_of_R_OUT_1 below, which is the full ruling.

  # ==================================================================
  # (c) DO THE TWO WAVES' VERDICTS AGREE?
  # ==================================================================
  c_verdict_agreement:
    answer: >-
      YES ON EVERY OPERATIVE VERDICT, WITH ONE SUBSTANTIVE DIVERGENCE AND ONE UNRESOLVED
      NUMERIC DISCREPANCY.
    where_they_agree:
    - Both Validators returned `passed`, with the same stated meaning.
    - >-
      Both Coordinator decisions are `revise`; neither moves a hypothesis, neither
      adjudicates a producer outcome row into a claim about lattices, and both hold claim
      tier TOY.
    - >-
      NEITHER RED TEAM OVERTURNS THE CORE OF R-OUT-1. Both state in their own narrowest
      supported statements that in the frozen family, under the criterion as frozen,
      X_null and the unplanted rdet walk the relevance clauses while bit-identical across
      all 8 bases at 38 of 38 cells -- so PASSING THE GATE CARRIES NO INFORMATION ABOUT A
      BASIS AT FIXED (d, k, beta, q).
    - >-
      BOTH RED TEAMS CONCLUDE THAT ADDING G-VAR DOES NOT REPAIR THE GATE, by two disjoint
      mechanisms, each with its own built counterexample. THIS IS THE STRONGEST AGREEMENT
      IN THE TWO CHAINS AND IT IS EMPHATICALLY NOT A REPLICATION: neither wave ran the
      other's construction and neither knew of it.
    - Both agree the decay-check FAIL survives and the single reported n_fire does not.
    - >-
      Both agree Section C1 changed no verdict, and both agree Section C2's own diagnosis
      of P-C2c is right -- each reporting the latter against its own red-team thesis.
    - Both agree "6 to 31" is false at the same low endpoint and that no verdict moves.
    the_one_substantive_divergence:
      what: >-
        THE REACH OF "NO ADMISSIBILITY CLAIM IS REPORTABLE FROM THIS GATE IN EITHER
        DIRECTION." Wave 1 asserts it -- it is the citable form of R-OUT-1 in
        DEC-20260809-afe29b, OBS-1's closing sentence in EV-MLKEM-9346bb, and wave-1's Red
        Team endorses it verbatim in its own narrowest supported statement -- and
        KN-FIND-2a35aa carries it into the corpus IN ITS OPENING PARAGRAPH, supported by
        "One refused blind observable is sufficient for that verdict". Wave-2's RT-R3
        holds that it OVER-CLOSES: what was demonstrated is that PASSING the gate carries
        no information, because a blind closed form clears every clause evaluated, and
        NOTHING WAS SHOWN ABOUT THE REFUSAL SIDE. EV-MLKEM-e45478 states in its boundaries
        that the sentence is not supported as stated and is not recorded there.
      ruling: >-
        THE TWO WAVES AGREE ON WHAT TO DO AND DISAGREE ON WHAT WAS SHOWN, AND THAT IS A
        REAL DISAGREEMENT ABOUT EVIDENTIAL BASIS RATHER THAN A VERBAL ONE. It is not
        dissolvable by reading more carefully; I tried and record the attempt because it
        is where the reconciliation lands. The sentence has two readings and wave 1 uses
        both. AS AN ABSTENTION -- "no admissibility claim is reportable from that gate in
        either direction AND NONE IS MADE HERE" -- it SURVIVES INTACT and is REINFORCED by
        wave 2, since an untested refusal side licenses a fortiori nothing. AS A
        DEMONSTRATED CLOSURE -- the reading KN-FIND-2a35aa's opening paragraph invites and
        toward which DEC-20260809-afe29b's what_is_not_decided leans -- IT IS NOT
        SUPPORTED, and RT-R3 is right. docs/inventor-protocol.md treats premature closure
        as a failure mode symmetric with overclaiming, and this is an instance of it.
      concrete_consequence: >-
        Wave 1 lists no unresolved confound for the refusal side; wave 2 does; and only
        wave 2 generates the false-refusal control as an owed experiment. That experiment
        is pre-registered behind the successor's lead in this goal's carried next action.
    the_unresolved_numeric_discrepancy:
      what: >-
        HOW MANY ENTRIES FALL BELOW 6x. Both waves agree the ENDPOINTS are 4.87x to
        31.03x and that no verdict moves. WAVE 1 (F-1) reports the minimum 4.87x at L1/L2
        beta 15, THIRTEEN further G-REL2 cells at exactly 5.71x and one at 4.97x, "so 15
        of the 19 G-REL2 cells fall BELOW the stated lower bound", with the G-REL1 range
        12.17x to 31.03x and the G-REL2 range 4.87x to 6.00x. WAVE 2 (F-1) reports the
        range over all 29 X_null G-REL entries at the mean-over-8 reading as 0.486626 to
        3.103480, i.e. 4.87x to 31.03x, with TWO entries below 6x (0.486626 at REL2 L1/L2
        beta 15 and 0.496557 at REL2 L4/L5 beta 20). Wave 1's G-REL2 range implies most
        G-REL2 cells sit below 0.6; wave 2's count implies 27 of 29 entries sit at or
        above it.
      ruling: >-
        I DID NOT RECOMPUTE EITHER AND I HOLD NO SHELL, SO I DO NOT ADJUDICATE IT. It is
        recorded as an OPEN NUMERIC DISCREPANCY between two review waves over one
        committed file. BINDING, and it costs nothing to obey: the corrected ENDPOINTS
        4.87x TO 31.03x ARE CITABLE, the false range "a factor of 6 to 31" MAY NEVER BE
        RE-CITED, and THE COUNT OF SUB-6x ENTRIES IS NOT CITABLE FROM EITHER WAVE until it
        is re-measured from the committed results_relvar.json -- a read of a committed
        file and no new compute.
    a_scope_divergence_that_is_not_a_disagreement: >-
      Wave 1 had fpylll 0.6.4 and covers the reduction-dependent rows; WAVE 2 HAD IT IN
      NEITHER SESSION and covers none of them, so the L7/L8 portability result and its
      C-F5 correction exist only in wave 1 and no wave-2 finding bears on lam1n, hkz, the
      48 reductions or their reported max violation of 0.0. INFRASTRUCTURE SIGNAL, NEVER
      NEGATIVE MATHEMATICAL EVIDENCE, and never a defect of any producer or of either
      wave. Both waves price the fix identically at one install plus about 20 s of
      reduction at d <= 40 and both call it the cheapest unclosed check.

  # ==================================================================
  # (d) DOES "R-OUT-1 STANDS", WITH AM-15 AND AM-16, SURVIVE RT-R1 AND RT-R3?
  # ==================================================================
  d_survival_of_R_OUT_1:
    d1_R_OUT_1_as_a_scoped_proposition: >-
      SURVIVES, UNCHANGED. DEC-20260809-afe29b's citable form of R-OUT-1 is already scoped
      to q = 3329, d in {20, 30, 40, 100, 140}, the frozen (k, beta) grid, EIGHT FROZEN
      BASES, and no reduction beyond the frozen HKZ pipeline at d <= 40. Those 8 frozen
      bases ARE the family that F1 differs from. RT-R1 exhibits no counterexample inside
      that scope; it exhibits a NEARBY FAMILY OUTSIDE IT, and EV-MLKEM-e45478's own
      boundary agrees in terms -- "R-OUT-1 IS CORRECT WITHIN THE FROZEN FAMILY F0". THE
      TWO WAVES AGREE ON THE PROPOSITION and differ only in how loudly the family is
      named. WHAT IS ADDED IS A CITATION RULE AND NOT A CORRECTION: every downstream
      citation of R-OUT-1 must name THE FAMILY AS A SCOPE PARAMETER, not only the
      (d, k, beta, q) grid, because RT-R1 MEASURED that the family is load-bearing --
      flipping G-VAR from 38 of 38 to 0 of 38 under a change in exactly one respect. Wave
      1's scope lines name the family only implicitly, through "8 frozen bases"; that is
      now insufficient and the rule binds forward.
    d2_AM_15: >-
      SURVIVES UNTOUCHED, AND WAVE 2 STRENGTHENS ITS GROUNDS. Nothing in wave 2 bears
      against it. Wave-2's F-3 independently reports that the frozen pre-registration is
      INTERNALLY INCONSISTENT on the 29-of-48 carry -- it puts the count and its benchmark
      in adjacent sentences while its own section 3.2 requires them in the same sentence
      -- so a successor enforcing the carry as an OCCURRENCE rule finds it unsatisfiable
      while quoting P-B1 verbatim. That is precisely AM-15(b)'s diagnosis, reached
      independently in a second wave. AM-15 IS ADOPTED UNCHANGED AND ITS GROUNDS ARE NOW
      TWO-WAVE.
    d3_AM_16: >-
      SURVIVES AS AN AMENDMENT, BUT ITS VALIDATION CLAUSE (d) IS SHOWN INSUFFICIENT, AND
      THIS IS THE RECONCILIATION'S OPERATIVE FINDING ON THE INSTRUMENT. AM-16(d) validates
      G-VAR2 against the six routes already built and committed in probe_nullroute.py,
      whose committed output declares the target behaviour in advance. EVERY ONE OF THOSE
      SIX ROUTES LIVES IN F0. RT-R1 shows that F0 is the family in which a dispersion
      criterion has the MOST power against a determinant-only functional, precisely
      because it holds |det B| fixed across the basis index -- so a criterion validated
      only against probe_nullroute.py would be scored in the one arrangement where its own
      FAMILY-BLINDNESS cannot appear. That is the could-not-fail pattern this goal has
      recorded repeatedly, now one level up, at the level of the FAMILY rather than the
      threshold. THEREFORE: AM-16 (a), (b), (c), (e), (f) and (g) SURVIVE UNCHANGED AND
      ARE ADOPTED; AM-16(d) SURVIVES AS NECESSARY AND IS RECORDED AS NOT SUFFICIENT. A
      criterion that passes it has been shown to resist re-presentation through a float
      path; it has NOT been shown to resist a change of family (RT-R1) or an
      information-free perturbation of relative size about 1e-10 (O-2). The two waves'
      validation objects are COMPLEMENTARY AND NEITHER ALONE SUFFICES --
      probe_nullroute.py on the route axis, probe_gvar_family.py and
      probe_gvar_relabel_witness.py on the family axis, all three committed in this tree.
      This is enacted as AM-17(a). AM-16 IS NOT RE-LITIGATED: what is added is a clause
      its own validation object cannot supply.
    d4_the_either_direction_closure: >-
      SURVIVES AS AN ABSTENTION, NOT AS A DEMONSTRATED CLOSURE, AND THIS IS THE ONE PLACE
      A WAVE-1 SENTENCE IS NARROWED. THE OPERATIONAL CARRY STANDS: no admissibility claim
      may be reported from this gate, in either direction, and none is made anywhere in
      either chain or in this one. THE DEMONSTRATED BASIS IS ONE-SIDED: the PASS side is
      shown vacuous on the frozen family; the REFUSAL SIDE IS UNTESTED IN EITHER DIRECTION
      and its false-refusal rate has never been measured by anyone. KN-FIND-2a35aa's
      opening paragraph and DEC-20260809-afe29b's what_is_not_decided carry the closure
      reading and ARE NOT EDITED; the narrowing travels by reference in this record, and
      the corpus debt it creates is recorded in knowledge_promotion below. EV-MLKEM-e45478
      IS NOT NARROWED ON RT-R3: it is the one wave-2 finding that says something wave 1
      neither said nor refuted, and it is credited in full. Enacted as AM-17(b).
    refutation_artifact_basis_for_this_narrowing: >-
      Declared because a narrowing of a recorded reading owes the strongest checkable
      basis it admits, archived ahead of the decision that relies on it. FOR RT-R1: a
      BUILT COUNTEREXAMPLE INSTANCE, probe_gvar_family.py with its recorded output plus
      the separate witness probe probe_gvar_relabel_witness.py, both committed in this
      tree before this decision, re-executable at 0.24 s per candidate. FOR O-2: a built
      counterexample described in the wave-2 validation report and executed through the
      producer's own committed gate code; the construction is described rather than
      packaged as a standalone probe, and that weaker packaging is stated rather than
      hidden. FOR RT-R3: a DERIVATION NOTE and not a measurement -- the argument that a
      demonstration on the PASS side cannot bound the REFUSAL side needs none, as the
      wave-2 Red Team says of it, and the argument is archived in that report. NO
      REFUTATION ARTIFACT IS OWED FOR ANY ADVERSE TRANSITION, because none is made: this
      decision is `revise`, no hypothesis status moves, and nothing is weakened or
      rejected.

  # ==================================================================
  # AMENDMENT
  # ==================================================================
  amendment_disposition:
    preamble: >-
      AM-10 THROUGH AM-14 OF DEC-20260808-05b684 AND THEIR BINDING CARRIES ARE IN FORCE
      AND ARE NOT RE-LITIGATED. AM-1 THROUGH AM-9 ARE UNDISTURBED. AM-15 AND AM-16 OF
      DEC-20260809-afe29b ARE ADOPTED AND ARE NOT RE-LITIGATED. What follows is ONE new
      amendment with three clauses, PROSPECTIVE ONLY.
    AM-17:
      title: >-
        A dispersion criterion must be validated across FAMILIES as well as routes; a
        closure over a gate must state its two sides separately; and every aggregation
        that selects a verdict must be declared, including collapses across cells.
      requirement_a: >-
        VALIDATION SCOPE. AM-16(d) is NECESSARY AND NOT SUFFICIENT. Any successor
        dispersion criterion in this goal -- G-VAR2 or any replacement -- must
        ADDITIONALLY be scored on at least one NEARBY FAMILY constructed to hold the
        candidate's own declared arguments fixed (the fibre condition named in wave-2
        RT-R1), with that family's single point of difference declared IN ADVANCE, AND
        must be shown to REFUSE at least one perturbation of relative size of order 1e-10
        that carries no usable information about the basis (the wave-2 O-2 class). The
        target behaviour of both checks must be declared before the run. Validation
        objects already built and committed: probe_nullroute.py (route axis, wave 1),
        probe_gvar_family.py and probe_gvar_relabel_witness.py (family axis, wave 2).
        NEITHER WAVE'S OBJECT ALONE SUFFICES.
      requirement_b: >-
        CLOSURE SYMMETRY. A closure over a gate must state SEPARATELY what was
        demonstrated on the PASS side and what on the REFUSAL side. The phrase "in either
        direction" may be used only when BOTH sides were measured, or when it is
        explicitly labelled an ABSTENTION with its untested side named in the same
        sentence. Grounds: wave-2 RT-R3 and docs/inventor-protocol.md section 4, which
        holds a closure to a named obstruction, an argument, and forward guidance naming
        what remains open.
      requirement_c: >-
        AGGREGATION DISCLOSURE. Every aggregation that collapses a per-unit array into a
        verdict must be declared as an implementation completion in the pre-registration
        or in the run manifest, with the rule named, BEFORE the run -- INCLUDING
        collapses ACROSS CELLS AND LATTICES and not only across bases. Grounds: wave-2
        F-2, the undeclared ANY rule in G_REL_PASS, which selects an outcome row.
      grounds: >-
        Wave-2 RT-R1, RT-R3, F-2 and Validator O-2; wave-1 RT-1, OBS-2 and OBS-14, which
        establish the route axis this amendment leaves unchanged and extends.
      prospective_only: >-
        AM-17 BINDS SUCCESSOR PRE-REGISTRATIONS AND SUCCESSOR CRITERIA. It is applied to
        BATCH-9e3584 ONLY as a citation ruling on this decision's own records and NEVER as
        a finding of non-compliance against any producer or against either review wave.
        The producers read the frozen text defensibly, the ambiguity is the amendment
        set's rather than theirs, and ruling otherwise would change a success criterion
        after observing the outcome, which my own contract forbids.
      consequence_for_the_record: >-
        UNTIL A DISPERSION CRITERION SATISFIES AM-16 AND AM-17(a) TOGETHER, NO "REPAIRED
        GATE" MAY BE BUILT ON G-VAR AND NO ADMISSIBILITY CLAIM IS REPORTABLE FROM THIS
        GOAL'S GATE IN EITHER DIRECTION -- an ABSTENTION under AM-17(b), whose untested
        side is the REFUSAL side. This decision asserts no admissibility claim.

