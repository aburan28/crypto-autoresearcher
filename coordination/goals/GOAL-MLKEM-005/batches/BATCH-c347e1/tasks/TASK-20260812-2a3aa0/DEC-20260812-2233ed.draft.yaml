  # ==================================================================
  # (b) WHAT IS UNIQUE TO EACH WAVE
  # ==================================================================
  b_unique_to_wave_1:
  - >-
    RT-1, THE SIX-ROUTE TABLE -- ROUTE DEPENDENCE, AND WAVE 2 HAS NO COUNTERPART. X_null
    through six arithmetic routes to log|det B|: R0 closed form, R1 slogdet(B) and R3
    slogdet(UB) are 38 of 38 bit-identical and REFUSED; R2 QR of B^T, R4 0.5 slogdet(BB^T)
    and R5 slogdet(BH) are 0 of 38 and ADMITTED -- all six reproducing the notarized
    prereg 2.6 table at 304 of 304 cell-by-basis entries and walking G-REL2 at 19 of 19.
    WAVE 2 NEVER TESTED R2, R4 OR R5: its RT-R2 computed the definitional matrix path,
    which is wave-1's R1, and found the same refusal.
  - >-
    RT-2 and OBS-3: the producer's OWN COMMITTED NUMBER already carried route dependence.
    forced_arithmetic.rdet_T1_ambient_isometry_residual = 3.865352482534945e-12 against
    report_relvar.md section 4's blanket "Residuals are 0 identically". Wave 2 does not
    name it.
  - >-
    THE AM-13 SCOPE RULING FOR P-R6 and the official Section R open-prediction count of
    ONE (P-R1). Wave 1's two reviewers divided (Validator one, Red Team two) and the
    Coordinator ruled the clause general. Wave 2 touches the prediction count nowhere.
  - >-
    C-F5, THE CROSS-PLATFORM FRAMING IS NOT CITABLE, with its citable replacement: a
    portability result across three textually distinct implementations at 24 of 24
    per-basis pairs to 6 decimals, max absolute deviation 4.84e-07, fpylll pinned at 0.6.4
    in both runs and the reduction input bit-identical by construction. Wave 2 could not
