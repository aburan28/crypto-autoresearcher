  b_unique_to_wave_2:
  - >-
    RT-R1, THE FAMILY (FIBRE) CONDITIONALITY, AND THE WAVE'S SHARPEST OBJECT. The frozen
    family B_i = [[I_k, A_i],[0, q I_{d-k}]] holds |det B| = q^(d-k) CONSTANT across the
    basis index by construction, so every determinant-only functional is bit-identical
    there and G-VAR COULD NOT HAVE FAILED TO FIRE ON ONE. The Red Team built the nearest
    family differing in EXACTLY ONE respect -- F1 with [[I_k, A_i],[0, diag(m_i)]] and
    m_i[0] = q + i, the same A_i draw, the same grid, the same tau_rel and s_X and the
    identical code path -- and G-VAR fires 38 of 38 on both rdet and X_null in F0 and 0 OF
    38 ON BOTH IN F1, while X_null still walks G-REL1 10 of 10 and G-REL2 19 of 19 and
    still reads ZERO entries of A_i. A witness probe reports F1's X_null taking 8 distinct
    IEEE-754 values strictly increasing in the basis index at 6 of 6 cells against 1
    distinct value at 6 of 6 in F0. THE MISSING SEPARATOR IS NAMED: dispersion on the
    FIBRE of the family over the observable's own declared arguments. 0.24 s per candidate
    at d <= 140, no reduction. SINGLE-SOURCE.
  - >-
    VALIDATOR O-2, G-VAR AS FROZEN IS EVADABLE, I.E. NECESSARY BUT NOT SUFFICIENT.
    V_evade = X_null + 1e-9 * A[0,0] / q, pushed through the producer's OWN committed
    measure_relvar.py using its own rho_both(), summarize() and bit_identical(): NOT
    bit-identical at any of the 38 cells (max between-basis float sd 3.91e-10), so G-VAR
    ADMITS it, while it walks G-REL1 10 of 10 and G-REL2 19 of 19 under every aggregation
    rule including the strictest. prereg 2.5 names the could-not-FIRE hazard of a LOOSE
    tolerance and closes it by choosing bit identity; THE SYMMETRIC HAZARD OF THE BIT TEST
    IS NAMED IN NO PRODUCER ARTIFACT AND IN NO WAVE-1 RECORD. SINGLE-SOURCE.
  - >-
    RT-R3, THE OVER-CLOSURE: only the PASS side was shown vacuous, the gate's REFUSAL SIDE
    IS UNTESTED IN EITHER DIRECTION, and its false-refusal rate has never been measured.
    Names and prices the cheapest test -- one observable informative by construction and
    structurally refused, e.g. a statistic over the leading k raw-GSO log-norms, which
    depends on A and k but takes no beta argument and so fails REL-1 by algebra exactly as
    rdet and lam1n do; minutes of numpy, one QR per basis, no reduction -- and CORRECTLY
    DECLINES TO RUN IT, because introducing a candidate observable is the Idea Generator's
    and the Coordinator's act and not the Red Team's. That restraint is correct conduct.
  - >-
    F-2, A SECOND AND UNDECLARED AGGREGATION, THIS ONE ACROSS CELLS. G_REL_PASS
    (measure_relvar.py lines 816-819) collapses across lattices and cells with an ANY rule
    -- REL1 passes if at least one scored lattice passes, REL2 if at least one scored cell
    passes. It is not in the frozen text and is not among the declared implementation
    completions, and it is what selects R-OUT-4 over R-OUT-5 and produces the reported "2
    of 5". A grep of the wave-1 validation report for G_REL_PASS, "816", "across-cell" and
    "ANY rule" returned ZERO matches, which is my basis for calling this wave-2's alone.
    THE DEFECT IS THE NON-DISCLOSURE: the reported outcome is correct under the frozen
    text's own "majority" language, X_null passes under all three rules, and R-OUT-1 is
    INVARIANT to the choice.
  - >-
    RT-R2, R-OUT-3 IS UNREACHABLE BY CONSTRUCTION: x_null_of implements the closed form
    and never touches the matrix, so the outcome row for "passes the gate but dispersion is
    non-zero, therefore a defect in the instrument" cannot fire, and P-R3 is forced by the
    SOURCE CODE, strictly stronger than "forced by algebra". The remedy was supplied in the
    same probe: the definitional matrix path reproduces the notarized 2.6 table at 38 of 38.
  - >-
    RT-C1a, SECTION C1'S ONLY LIVE OBSERVATION REDUCES TO A CONTROLLED NULL. 200,000
    effect-free iid-normal 8x4 tables through the identical carried se_decomposition give
    P(SE_2way/SE_naive < 1) = 0.3982, so the expected count is 3.98 OF 10 AGAINST 4
    OBSERVED, with null median 1.0896, p05 0.3871 and p01 0.1785; a permutation null agrees
    target by target within 0.03 in percentile; the extreme 0.3635 sits at the 4.4th
    percentile and across ten targets the chance at least one falls that low is about 36%.
    A CONTROLLED NULL IN BOTH DIRECTIONS -- equally not evidence that the instrument is
    sound. Wave-1's RT-10 attacked tau_rel's dispersion but built no effect-free null here.
  - >-
    RT-C1b, THE DEGENERACY IS A PROPERTY OF THE S = 8, E = 4 DESIGN AND NOT OF THE DATA.
    On 100,000 draws per model, an unstructured iid-normal 8x4 table gives P(nu_eff <= 1.5)
    = 0.357, P(|t|crit >= 8) = 0.527 (expected 5.27 of 10) and P(negative variance
    component) = 0.143; with support and pool structure (0.4 / 0.2 / 0.4) those are 0.006,
    0.014 and 0.0003. The committed profile is 4 of 10 degenerate and 1 of 10
    negative-variance-component. THE BINDING CONSTRAINT ON SECTION C IS E = 4, NOT THE
    RELATIVE FLOOR -- and the four non-firing targets are UNINFORMATIVE, which is not the
    same as null, a distinction wave 2 keeps and this record keeps.
  - >-
    THE n_fire DISPERSION PROFILE ACROSS THE WHOLE c GRID: sd 1.20 at c = 4, 3.60 at c = 6,
    1.19 at c = 8 and 0.00 at every c >= 12, so the carried headline constant sits exactly
    on the steep part of the transition.
  - >-
    F-7 AND THE DISCOVERY OF THE COLLISION ITSELF, with both halves of its mechanism named,
    and the wave-2 Validator's report that it did NOT open the other validation report,
    reading only that blob's git metadata -- which is the property that makes wave 2 worth
    comparing at all.
  - >-
    OBS-W13, THE RED TEAM'S REFINEMENT OF THE RECORDED DEFECT IN THE COORDINATOR'S FAVOUR:
    for both archive tasks the receipt's own path_sha256 path set EQUALS its commit's
    change set exactly, so D3 is a defect of the QUEUE'S artifact_paths and NOT of the
