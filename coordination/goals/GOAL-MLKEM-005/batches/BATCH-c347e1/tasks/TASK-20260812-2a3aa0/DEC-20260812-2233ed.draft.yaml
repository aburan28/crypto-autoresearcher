  # ==================================================================
  # (a) WHAT THE TWO WAVES REACHED IN COMMON, AND EXACTLY WHAT THAT IS WORTH
  # ==================================================================
  a_findings_in_common:
    label_first_because_the_label_is_the_finding: >-
      THIS IS A TWO-SAMPLE AGREEMENT OF ONE MODEL. IT IS PROCEDURAL AND IT IS NOT
      MODEL-LEVEL CORROBORATION, NOT INDEPENDENT REPLICATION, AND NOT A SECOND
      INDEPENDENCE BUDGET. All four reviewer sessions across both waves resolve to the
      same model: wave 2 records resolved_model_id claude-opus-5 for both of its
      sessions; wave 1 records resolved_model_id null with the identical verification
      gap and states in its own boundaries that two reviews resolving to one model are
      not two independent judgements. All four record model_verified false. AGENTS.md
      RULE 12 REMAINS UNMET AND UNWAIVED IN THIS GOAL AND TWO WAVES DOES NOT MOVE IT ONE
      STEP.
    what_the_agreement_does_buy: >-
      It discriminates against the hypothesis that any listed finding is a SESSION-LEVEL
      artifact -- a fluke of one session's attention, prompt path or reading order. Two
      sessions formed without reference to each other, on two branches, landed on the
      same place. That is worth having and it is worth exactly this much.
    what_the_agreement_does_not_buy: >-
      It discriminates NOT AT ALL against a shared model-level bias, a shared blind spot,
      or a shared misreading of the frozen text. Four correlated judgements of unknown
      and unmeasured correlation are not four judgements, and every agreement below
      should be discounted accordingly, as EV-MLKEM-e45478 says of itself.
    the_internal_gradient_that_matters: >-
      Where BOTH waves BUILT the object and measured it, the agreement is stronger than
      where both merely READ the same committed artifact -- the former agrees on a
      construction, the latter can agree by copying one number twice. Exactly two entries
      below are of the stronger kind: C-11 (the centered C2 ladder, built independently
      in both waves with the identical 0-of-10 result) and C-10 (n_fire's dispersion,
      estimated by a 20000-rep Monte Carlo in wave 1 and by 8 seeded replicates in wave
      2, giving consistent answers). WHEN THIS RECORD IS CITED, C-10 AND C-11 MAY BE
      CITED AS PROCEDURALLY CORROBORATED; EVERY OTHER ENTRY MAY BE CITED ONLY AS
      "REPRODUCED TWICE, BY ONE MODEL, IN TWO SESSIONS".
    common_findings:
    - >-
      C-1 BOTH VALIDATORS RETURNED `passed`, with the same stated meaning: the four
      producer receipts are admissible evidence and nothing more, adjudicating no outcome
      row, retiring nothing, rescoring BATCH-a44d08 in no respect, and bearing on nothing
      about ML-KEM.
    - >-
      C-2 THE PRODUCER ARITHMETIC REPRODUCES FROM RAW WITH ZERO MISMATCHES, in both
      waves, each with its own implementation. Wave 1: roughly ten thousand
      recomputations at 1e-12 relative, zero mismatches, plus a bitwise from-scratch
