  - >-
    THE INSTRUMENT ACTS: AM-15 and AM-16; the prospective protocol amendment PA-1; the
    program defect PD-d49e35 (a receipt cannot state the sha of the commit it must ride
    inside); the supersession of archive tasks TASK-20260809-91cf76 and
