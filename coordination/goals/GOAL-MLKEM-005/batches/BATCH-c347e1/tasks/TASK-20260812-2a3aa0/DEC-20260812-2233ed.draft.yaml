  - >-
    C-F8 and V-P6, THE G-NUM GAP AND ITS CLOSURE BY THE REVIEW: section 6 contains no
    G-NUM row, so "X_null walks the ENTIRE AM-4 gate" is a universal over five clauses
    asserted from four; the Validator measured G-NUM itself, max rho_T0 = 0.000e+00
    exactly against tau_num = 1e-6.
  - >-
    C-F6 and OBS-1, THE PROVENANCE AND NOVELTY FINDING, AND IT IS THE LARGEST THING WAVE 2
    HAS NO COUNTERPART TO. X_null, its definition, s_X = 1.0 and both headline figures
