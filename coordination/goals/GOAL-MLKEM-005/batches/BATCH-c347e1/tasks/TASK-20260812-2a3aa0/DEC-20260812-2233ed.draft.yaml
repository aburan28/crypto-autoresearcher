    and -aadafd), the one producer snapshot commit c034ef38 and the one notarizing commit
    1aa7db53, and THIS reconciliation (DEC-20260812-2233ed, EV-MLKEM-c7a814). TWO ENTRIES
    FOR ONE BATCH WOULD MISREPRESENT THE BATCH AS TWO. If the committed goal record already
    carries an entry written by either chain, the archive task must EXTEND rather than
    duplicate it, and must record in its receipt what it found and what it wrote.

  # ==================================================================
  # RATIONALE
  # ==================================================================
  rationale:
  - >-
    THE COMPARISON IS THE SINGLE MOST INFORMATIVE THING AVAILABLE FROM THESE TWO CHAINS,
    AND IT COULD ONLY BE MADE AFTER THE MERGE. DEC-20260812-15d3b2 said so and deliberately
    declined to attempt it, on the ground that a Coordinator who has read only one wave
    cannot make it and a wave 2 formed with reference to wave 1 would not have been worth
    comparing. I have now read both, and the comparison delivers exactly one thing neither
    chain could deliver alone: A SEPARATION OF WHAT IS ROBUST TO A CHANGE OF SESSION FROM
    WHAT IS NOT. Eighteen findings survive it; RT-1, RT-R1, RT-R3, O-2, F-2, RT-C1a and
    RT-C1b do not appear in both, and one numeric count actively disagrees.
  - >-
    THE AGREEMENT IS PROCEDURAL AND I REFUSE TO LET IT READ AS MORE, INCLUDING WHERE THAT
    COSTS THIS RECORD ITS STRONGEST-SOUNDING SENTENCE. Two review waves over one snapshot
    is TWO SAMPLES OF ONE MODEL. The temptation here is precise and worth naming: an
    eighteen-item agreement list between two independent waves reads like corroboration,
    and under rule 12 it is worth strictly less than that. What it rules out is a
    session-level artifact. What it does not touch is a model-level one. Every one of the
    four reviewer sessions records model_verified false with its reason, so this is a
    verification GAP rather than a settled fact, and resolving it in the other direction
    would upgrade the agreement list and nothing else in this decision.
  - >-
    NEITHER CHAIN IS RETIRED, AND THAT IS A RULING RATHER THAN A COURTESY. Both were
    produced by sessions doing exactly what their cards required, against the same
    committed snapshot, with every byte intact. The collision was a coordination defect in
    a mutable record, and AGENTS.md distinguishes a dispatch queue from evidence. Deleting,
    renaming or editing either chain would destroy measurements to tidy bookkeeping, which
    no coordination defect justifies -- and it would destroy the one property that makes
    the comparison possible, that wave 2 was formed without reference to wave 1.
  - >-
    THE DISAGREEMENT IS THE MOST VALUABLE OUTPUT, NOT AN EMBARRASSMENT TO BE SMOOTHED.
    RT-R3 identifies a gap that wave 1 does not merely under-state but does not record at
    all: wave 1's unresolved_confounds contain no entry for the gate's refusal side. Two
    reviewers of one model, given the same artifacts, disagreed about whether a closure was
    earned -- and the one who said it was not generated a cheap, named, pre-registerable
    experiment that the other did not. THAT IS WHAT A SECOND WAVE IS FOR, and it is the
    concrete return on a coordination defect that cost this goal a dispatch cycle.
  - >-
    THE ADVERSE FINDINGS OF BOTH WAVES ARE CREDITED BECAUSE ALL FOUR REVIEWERS AUDITED
    THEIR OWN COULD-NOT-FAIL ARRANGEMENTS AND ALL FOUR REPORTED AGAINST THEMSELVES. Wave-1's
    Red Team recorded that its predicted regime-mismatch objection was WRONG, that its
    predicted unimodular escape DID NOT ESCAPE, that the producer's P-C2c diagnosis is
    right, that the N-C exclusion mechanism is confirmed, that the cross-implementation
    agreement is STRONGER than claimed, and that its own task card's premise about lost
    predecessor probes was FALSE. Wave-2's Red Team's audit fired against its thesis three
    times and it disclosed post-hoc provenance for two of seven probes in the probes' own
    docstrings. Both Validators named in advance the outcomes that would have forced
    `failed` and secured the other direction with a negative control their own instruments
    refuse. That conduct is why RT-1, RT-R1, RT-R3, O-2, F-2 and RT-C1a/b are recorded as
    findings here rather than discounted as an adversary's framing.
  - >-
    fpylll'S ABSENCE IN BOTH WAVE-2 SESSIONS IS INFRASTRUCTURE SIGNAL AND IS RECORDED AS
    COVERAGE LOST, NEVER AS COUNTEREVIDENCE. It means the reduction-dependent rows are
    covered by wave 1 and by a BATCH-cbe023 review measurement, and by nothing in wave 2.
    Nothing is inferred from the gap in either direction, and the fix is priced identically
    by all four reviewers at one install plus about 20 s of reduction at d <= 40.
  - >-
    THE NUMERIC DISCREPANCY IS RECORDED UNRESOLVED RATHER THAN ADJUDICATED, BECAUSE I RAN
    NOTHING. Two waves report incompatible counts of the G-REL entries below 6x from one
    committed file. I hold no shell, I recomputed neither, and inventing a resolution would
    be exactly the fabrication my contract forbids. The endpoints they agree on are binding;
    the count neither may be cited until someone re-reads the committed results file.
  - >-
    NO OFFICIAL TRANSITION IS MADE FROM UNCOMMITTED ARTIFACTS. This decision, EV-MLKEM-c7a814
    and reconciliation_notes.md are uncommitted as written -- PD-4, open and inherited.
    Nothing here is durable or official until TASK-20260812-a03011 stages the drafts
    verbatim, commits once and alone, the post-commit verifier ACCEPTS BEFORE THE PUSH, and
    the branch is pushed with an open PR against main naming every new record.

