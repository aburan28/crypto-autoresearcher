  - >-
    RT-4 and RT-5: P(P-B1 falsifier) = 0.00175 over 20000 reps under the null AM-13
    mandates; the PASS clause's second conjunct is a tautology true of any family; the
    null's shape parameter differs from the real arm's by a factor 2.19.
  - >-
    RT-10: tau_rel = 0.025 is a MAXIMUM OF FOUR NUMBERS spanning a factor 2.32, the most
