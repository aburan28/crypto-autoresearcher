    - id: Q18
      claim: "T4/Bernstein sec A.4: DHKLS's claim is conditional on unlimited-sample MLWE, and footnote 2 cites Arora-Ge and calls the distinct-secret game a 'plausibly much harder problem'."
      status: reproduced
      how: >-
        Verified AT FIRST HAND against the copy retrieved above, on the paper's
        third page (running page 2724; the paper begins at 2722), i.e. exactly the
        '[47, page 3]' and '[47, footnote 2]' locations Bernstein cites.
        Body: "we do not have self-reductions that allow us to directly conclude
        that Adv^{IND-CPA}_{PKE} ~ Adv^{(n,qC)-IND-CPA}_{PKE} ... Nevertheless, if
        we assume the hardness of MLWE as originally defined for the purpose of
        worst-case to average-case reductions [28, 30, 32] where the number of
        samples (using the same secret) is unlimited, then we can show that
        Adv^{IND-CPA}_{PKE} ~ Adv^{(n,qC)-IND-CPA}_{PKE}. In particular, if we
        assume that distinguishing {(Ai, Ai*si + ei)}_{1<=i<=k} from uniform is
        hard for k = max(n, qC),2 then using the transformation from [2] ..."
        Footnote 2: "Unless k is so large that the Arora-Ge [3] attack applies, it
        is not known that seeing more samples makes the MLWE problem any easier in
        practice. ... the secrets in the (n, qC)-IND-CPA game are all distinct, and
        so it is a plausibly much harder problem than MLWE with many samples for
        the same secret."
        Bernstein's characterisation is ACCURATE on every point I could check:
        the conditionality, the unlimited-sample wording, the max(n, qC) sample
        count, the Applebaum-Cash-Peikert-Sahai transformation, the Arora-Ge
        footnote, and the "plausibly much harder problem" phrase.

    - id: Q19
      claim: "T4: KILL (iii) DOES NOT FIRE -- the DHKLS reduction is not shown to be concretely tight at ML-KEM parameters."
      status: reproduced
      how: >-
        CONFIRMED, and on a stronger basis than the package had. Reading the paper
        directly: the authors themselves write that they "do not have
        self-reductions that allow us to directly conclude" the equivalence, and
        obtain it only under an explicitly stated assumption. The passage contains
        no concrete parameters, no tightness constant, no Kyber or ML-KEM bit
        figure, and no claim about the cost of the best known lattice attack. A
        conditional asymptotic-flavoured equivalence between advantage functions
        is not a concrete-cost bound on a primal attack against many ciphertexts
        under one key. The kill condition does not fire. I attacked this verdict
        and it survived first-hand checking; that is my report's clearest negative
        result and it removes the verdict's stated main caveat.

    - id: Q20
      claim: "The goal record's ceiling G <= log2 M holds UNCONDITIONALLY by convexity."
      status: reproduced
      how: >-
        With f = -log2 p convex and f'(beta_1) = -0.292 at the single-target
        optimum, f(beta_M) >= f(beta_1) + f'(beta_1)(beta_M - beta_1) =
        f(beta_1) + 0.292(beta_1 - beta_M) = f(beta_1) + G, and log2 M >=
        f(beta_M) for M attempts to yield one success. So G <= log2 M - f(beta_1).
        The record writes "= G", i.e. drops f(beta_1) >= 0. The dropped term is
        NONNEGATIVE, so the stated cap OVERSTATES the attainable gain and is
        conservative in the defensive direction. Two conditions are nonetheless
        carried silently by the word "unconditionally": convexity of
        f(beta) = -log2 p(beta), which is a modelling assumption about the
        success-probability curve rather than a theorem, and p(beta_1) <= 1.
        Recorded as a scope note, not an objection.

  # ------------------------------------------------------------------
  objections:

    - id: OBJ-1
      severity: material
      target: snapshot commit message 7983a474
      title: >-
        "P1 and P2 passed by 30-100x" is a Coordinator-authored number that
        appears in no producer artifact and is false for both predicates.
      detail: >-
        Recomputed from results.json, real arm, pooled, against the frozen
        tolerances (P1: 0.05 at 2^-10 and 0.10 at 2^-16; P2: 0.20):
          P1 @ 2^-10 margins  29.3x, 92.9x, 108.1x, 50.1x
          P1 @ 2^-16 margins  10.6x, 200.5x, 24.5x, 95.7x
          P2 margins          290,246x  268,923x  359,398x  403,519x
        The stated band is wrong at both ends for P1 (true range 10.6x-200.5x) and
        wrong by three to four orders of magnitude for P2. `grep -rn "30-100"`
        over the whole batch task tree returns nothing: neither endpoint is a
        producer number. The commit's own preamble reads "Producer numbers stated
        as the producers', with their own qualifiers", so this sentence breaches
        the commit's own declared standard. Direction of the error is deflationary
        (it makes an astronomically wide pass look marginal) and the clause that
        follows it is the correct deflationary point, so nothing downstream is
        inflated -- but a false number in an immutable commit message is the exact
        propagation hazard KN-TECH-1a5b7e records ("an unchecked claim is
        inherited by everything downstream").
      cheapest_check: >-
        `grep -rn "30-100" coordination/goals/GOAL-MLKEM-005/batches/BATCH-a51f91/`
        returns nothing; then divide each frozen tolerance by the corresponding
        |ratio - 1| and by between_fraction_raw in results.json. Under one minute.
      required_remedy: >-
        A CE-class correction in the batch's evidence or decision record quoting
        the true margins with their denominators named, on the CE-1/CE-2 precedent
        of DEC-20260804-485fa6 and DEC-20260805-0b3e11. The commit is immutable and
        must not be rewritten.

    - id: OBJ-2
      severity: material
      target: T1 census.md distribution sentence; census.json row_counts; snapshot commit
      title: >-
        The "6 of 14 fix M = 1" bucket is heterogeneous and two of its six members
        are contradicted by their own rows.
      detail: >-
        census.json assigns m_class "one" to R09, R12, R14, R20, R21, R22. But:
        - R12 and R14 carry m = "1 per handshake", not M = 1 per KEY. R14's own
          key_role field literally reads "ephemeral (client-generated), reuse
          permitted", and R12's own m_derivation says "This is structural, not a
          normative single-use rule: see R13 for the governing reuse clause, which
          permits key-share reuse." R13 then delegates the count to "any bounds in
          the specification of the KEM", and R01 records FIPS 203 states none. A
          row whose governing clause permits unbounded reuse cannot sit in the
          bucket that caps G at log2 1 = 0.
        - R09 (MLS KeyPackage) is a SHOULD with an explicit last-resort exception,
          and R11 records that RFC 9420 registers NO ML-KEM cipher suite at all.
        - R22 (Signal PQXDH) is caveated by the producer itself: the retrieved
          text names Crystals-Kyber-1024, not FIPS 203 ML-KEM.
        The rows that unambiguously carry a normative, per-key, ML-KEM single-use
        rule are R20 (SSH, "REQUIRED by this specification") and R21 (IKEv2,
        "REQUIRED by this specification"). So the count supporting a G <= 0 cap is
        2 firm plus 2 caveated, not 6. census.md is honest at ROW level -- every
        qualifier above is the producer's own text -- and the compression happens
        in the one-sentence distribution summary, which the snapshot commit then
        repeats without those qualifiers.
      cheapest_check: >-
        Read the m and key_role fields of R12 and R14 in census.json against their
        m_class. Zero compute.
      required_remedy: >-
        Restate the distribution with the bucket split: "2 deployment modes carry a
        normative per-key single-use REQUIREMENT for ML-KEM (R20, R21); 2 more are
        single-use with a named caveat (R09 SHOULD with a last-resort exception and
        no ML-KEM cipher suite registered; R22 specified over Kyber-1024); 2 state
        one ciphertext PER HANDSHAKE under a governing clause that permits key
        reuse (R12, R14); 8 state no count bound at all."

    - id: OBJ-3
      severity: material
      target: T2 frozen design (prediction_frozen.json null_sufficiency), Coordinator card
      title: >-
        The sensitivity demonstration was run against a different (object,
        statistic) pair than the null. The object the null removes is the
        PROJECTOR; the demonstration manipulated the ERROR LAW.
      detail: >-
        prediction_frozen.json object_removed is "The PROVENANCE OF THE PROJECTOR",
        and sensitivity_demonstration_arm is "Projector stays Haar-random (the SAME
        8 draws). The isotropic CBD error is replaced by a two-block anisotropic
        error". Obligation 3 of KN-TECH-1a5b7e is a property of an (object,
        statistic) PAIR -- the entry's own mode-2 catch line is "Obligation 3
        applied per statistic, not per null". This design satisfies it per
        statistic and violates it per OBJECT. Whatever the demonstration's expected
        contrast is, it is a demonstration that the statistic reads the ERROR LAW,
        which is not what the null removes and not what the experiment is about.
        The frozen file's own closed-form justification compounds this: it predicts
        the anisotropy "widens the distribution of R by a factor of approximately
        sqrt(1.36) = 1.166 in standard deviation and therefore pushes the lower
        quantiles down". Under a Haar projector the marginal law is EXACTLY Beta
        for any Sigma, so the widening is exactly zero, and the second-order effect
        that does exist has the OPPOSITE sign (the within-draw sd SHRINKS, so the
        lower quantile rises; both my closed form and the sign of the executor's
        V6b give +). The frozen derivation is wrong in magnitude and in direction.
      cheapest_check: >-
        Two lines of algebra: for Haar P and any fixed e != 0, ||Pe||^2/||e||^2 has
        the law of the first beta coordinates' squared norm of a uniform point on
        the sphere. Zero compute. This was available on the day the card was
        frozen.
      required_remedy: >-
        Record as the batch's principal design finding that a sensitivity
        demonstration must manipulate THE OBJECT THE NULL REMOVES, and add
        `sensitivity_manipulates_the_removed_object` to the KN-TECH-1a5b7e
        checklist at the next supersession. (Creation of that entry is not this
        report's to make; rule 12 is unmet.)

    - id: OBJ-4
      severity: material
      target: T2 frozen threshold; snapshot commit's single-cause explanation
      title: >-
        A second, independent defect in the gate that the commit does not mention:
        the threshold is expressed in per-draw sds of the WRONG arm.
      detail: >-
        The gate is |mean_8(demo) - mean_8(haar)| >= 4*s with s the HAAR arm's
        per-draw sd. The Haar arm is the arm whose between-draw location variance
        is structurally ~0, because E[R|P] = beta/d deterministically when Sigma is
        isotropic. The demonstration arm's per-draw sd is 4.33x, 5.79x, 4.33x and
        5.75x the Haar arm's in the package's own results.json (my independent run
        gives 5.57x). The SE of the difference of two 8-draw means is therefore
          sqrt(sd_demo^2 + sd_haar^2)/sqrt(8) = 1.75 s, 2.08 s, 1.57 s, 2.06 s
        in the package's four cells, and 2.00 s in mine. So "4 s" is a ~2.0-2.5
        sigma test, and the four observed shifts are 0.45, 0.52, 1.25 and 1.81
        sigma of the correct SE -- an ordinary null. This is a calibration defect
        independent of the forcing defect: it would have degraded the gate even for
        a demonstration with a large true effect.
        Consequence for the record: the commit's "The frozen 4s gate failed in all
        four cells BECAUSE the demonstration ... has expected contrast exactly zero"
        states one cause as THE cause. Both are operating and neither is
        established as sufficient alone (see also OBJ-8 on the "exactly zero").
      cheapest_check: >-
        Read `ratio_2em10_over_draws.sd` for all three arms in results.json and
        form sqrt(sd_a^2+sd_b^2)/sqrt(8), then divide by s. Four divisions.
      required_remedy: >-
        Any successor gate declares its threshold in units of the SE OF THE
        DIFFERENCE at the declared draw count, with the draw count stated, and
        never in per-draw sds of one arm.

    - id: OBJ-5
      severity: material
      target: T4 acquisition-failure record; snapshot commit "unobtainable from four routes"
      title: >-
        The paper is obtainable. "Unobtainable" is a statement about the search,
        not about the document, and the commit reports it as the latter.
      detail: >-
        reads.md sec 3.2 lists eight route rows and states "no institutional copy
        found"; receipt.json records the fetches. The snapshot commit compresses
        this to "unobtainable from four routes" -- and "four" appears in no
        producer artifact; the producers' own list has at least seven failed routes
        for the body. Both the count and the framing are Coordinator-authored.
        More importantly: no route in the list is an OPEN-ACCESS AGGREGATOR. One
        OpenAlex call on the DOI returns is_oa true, oa_status gold, and a green-OA
        repository location at TU/e; that URL returns HTTP 200 and the full 17-page
        paper. Total cost: two commands. Under docs/inventor-protocol.md sec 4 a
        count of routes that failed is a fatigue report about the search; its honest
        status is `unverified`, and it may not be presented as a property of the
        document. The good news for the package: I then used the retrieved copy to
        check Bernstein's citations at first hand and they are accurate (Q18), so
        the kill verdict survives and is STRENGTHENED (Q19). The objection is to the
        acquisition record and the commit's framing, not to the verdict.
      cheapest_check: >-
        `curl -s https://api.openalex.org/works/doi:10.1145/3460120.3484819` then
        curl the returned repository `pdf_url`. Ninety seconds.
      required_remedy: >-
        Record the retrieval (URL, HTTP status, byte count, page count, sha256) as a
        correction to the acquisition-failure table, and add an OA-aggregator
        resolution step (OpenAlex / Unpaywall -> institutional repository) to the
        program's literature-acquisition path before any further "unobtainable"
        finding is recorded. With 7,809 literature entries of which 7,421 name
        `downloads/` paths that never existed, this is the highest-leverage cheap
        fix in the batch.

    - id: OBJ-6
      severity: minor
      target: snapshot commit; corpus_hygiene.json root_cause_note
      title: '"5,582 entries carry citation_verified: read with every identifier null" states no denominator.'
      detail: >-
        The sentence is headed "is SYSTEMIC" and flanked by two properly-fractioned
        figures ("1,938 of 1,939", "7,421 of 7,809"), so an unfractioned count in
        the same list reads as a proportion. The denominator is 7,809
        (`ls knowledge/literature | wc -l`), giving 71.5%. KN-TECH-1a5b7e's second
        caution on move 3 -- "A ratio is not restated without naming its denominator
        in the same sentence" -- has now cost three Coordinator commit messages
        rather than two.
      cheapest_check: "`ls knowledge/literature | wc -l`."
      required_remedy: "Restate as '5,582 of 7,809' wherever the figure is carried forward."

    - id: OBJ-7
      severity: minor
      target: snapshot commit T4 paragraph
      title: The KILL (iii) headline drops the producer's own precondition on treating the verdict as settled.
      detail: >-
        reads.md sec 3.5 states, in bold: "A Reviewer should obtain 2021/1351 and
        check the quotes at page 3 and footnote 2 before this verdict is treated as
        settled." The commit carries "its body was NOT summarised", which is a
        weaker and different qualifier, under a capitalised headline "KILL (iii)
        DOES NOT FIRE". The producer also wrote "The Executor does not decide
        whether the campaign closes." Since the precondition is now SATISFIED by
        this report (Q18), the remedy is cheap: record the satisfaction rather than
        the omission.
      cheapest_check: Read reads.md sec 3.5 against the commit's T4 paragraph.
      required_remedy: >-
        Record in the evidence/decision record that the precondition was discharged
        by RT-20260806-d008e0 against the CCS'21 published version, with the scope
        caveat in Q17 that this is not the ePrint PDF itself.

    - id: OBJ-8
      severity: minor
      target: snapshot commit; T2 report.md sec 5.3
      title: '"EXPECTED CONTRAST EXACTLY ZERO" is exact for the marginal law and unproved for the declared statistic.'
      detail: See Q7. The adjudication it supports (INSTRUMENT FAILURE) is unaffected.
      cheapest_check: >-
        Note that E_P[q_p(R|P)] is not q_p of E_P[F_{R|P}], then compute the
        second-order term from Var_P(E[R|P]) which the package already measured.
      required_remedy: >-
        Restate as "expected contrast zero to leading order in the marginal law,
        predicted ~+0.8 s at second order, unresolved at n = 64".

    - id: OBJ-9
      severity: material
      target: the kill condition K1 as written in dispatch_queue.json (TASK-20260805-d23bf0 handoff)
      title: K1 is unadjudicable by any documentary census and its consequent is malformed.
      detail: See the k1_adjudication block below.
      cheapest_check: >-
        Read K1's antecedent ("no standardised mode YIELDS M > 2^20") beside T1's
        deliverable ("no retrieved specification STATES a numeric M above 1"). Zero
        compute; available before T1 was dispatched.
      required_remedy: The adjudication recorded below, in place of a K1 verdict.

  # ------------------------------------------------------------------
  k1_adjudication:
    question_as_the_card_posed_it: >-
      Did K1 fire, not fire, or was it the wrong question?
    verdict: >-
      K1 DID NOT FIRE, AND IT WAS THE WRONG QUESTION. It is unadjudicable from a
      documentary census, and had it been adjudicated as written it would have
      manufactured a bound in the wrong direction.
    reasons:
      - id: K1-a
        title: Antecedent/instrument mismatch -- "yields" against "states".
        detail: >-
          K1 quantifies over what deployment modes YIELD. A census of specification
          text can only report what specifications STATE. For 8 of the 14
          deployment-mode rows the specification states nothing, and for two of them
          the specification's own design intent argues the other way: R15 (ECH)
          records that "anonymity sets will typically involve many connections even
          with fairly fast rotation intervals", and R18 (CMS) that the recipient key
          "is expected to be carried in a long-lived certificate and used over and
          over". In those modes M is a traffic fact, not a document fact. T1 was
          right to refuse to convert a cryptoperiod into a count without a rate, and
          says so explicitly (census.md: "inventing one and reporting it would be an
          estimate presented as a source, which AGENTS.md rule 9 forbids").
      - id: K1-b
        title: The rule's branches do not exhaust its outcomes.
        detail: >-
          K1 admits "yields > 2^20" and "does not". The actual outcome -- "8 of 14
          modes state nothing at all in either direction" -- is in neither branch.
          This is KN-TECH-1a5b7e mode 4 (the decision rule that cannot discriminate)
          transposed from a statistical lane to a documentary one: the rule
          partitions the range of the quantity, not the space of outcomes, and has
          no NEITHER branch. The batch has now produced this failure twice in one
          dispatch -- once in T2's 4s gate and once in K1 -- from the same root.
      - id: K1-c
        title: The consequent is malformed and would have manufactured a bound.
        detail: >-
          "the mechanism is capped at <= log2 M bits" leaves M unbound. Read as
          "M <= 2^20 everywhere", it licenses a 20-bit cap. But where the census
          finds a number at all, that number is 1, giving G <= log2 1 = 0 bits --
          the mechanism has EXACTLY ZERO room there, not 20 bits of room. And where
          it finds no number, no cap follows at all. A rule that converts "no number
          found" into "the number is 2^20" is manufacturing a bound, in the
          unsafe direction, from an absence.
      - id: K1-d
        title: '"closes with a measured cap" is a category error.'
        detail: >-
          A documentary census is not a measurement: no contrast, no comparator, no
          surrogate, no spread. T1 states this correctly and refuses to invent a
          null in order to look rigorous. Calling its output "measured" would import
          an evidential status the artifact cannot carry.
    what_the_census_does_establish:
      lane_closure: >-
        A LANE closure with a named obstruction, at the docs/inventor-protocol.md
        sec 4 standard. In deployment modes carrying a normative per-key single-use
        rule for ML-KEM -- R20 (SSH: "generating an ephemeral key exchange keypair
        for ECDH and ML-KEM per connection is REQUIRED by this specification") and
        R21 (IKEv2: "Generating an ephemeral keypair and ciphertext for each ML-KEM
        key exchange is REQUIRED by this specification") -- M = 1, so G <= log2 1 =
        0 by the goal record's own convexity bound. Best-of-M ciphertext selection
        has provably zero room in those modes. Obstruction: named. Argument: the
        convexity bound, with the caveat in Q20. Forward guidance: the static/reuse
        lane below.
      lane_left_open: >-
        In the eight count-unstated deployment modes (R06 HPKE recipient keys, R10
        MLS last-resort KeyPackages, R15 ECH configs, R16 X-Wing, R17 LAMPS X.509
        certified decapsulation keys, R18 CMS KEMRecipientInfo, R19 PKCS#11 token
        objects, R23 Signal last-resort prekeys) NO specification supplies a count
        in EITHER direction, and the one normative count delegation --
        draft-ietf-tls-hybrid-design-16 sec 2, "implementations that do reuse KEM
        public keys MUST ensure that the number of reuses of a KEM public key abides
        by any bounds in the specification of the KEM" -- terminates at FIPS 203,
        which states none (R01), with SP 800-227 sec 4.1 explicitly describing the
        static case as "many connections ... over a long period of time" (R03) and
        the CFRG draft endorsing reuse for "multiple incoming ciphertexts" without a
        count (R24).
      the_real_finding: >-
        This is the campaign's most transportable product so far and it is a
        DEFENSIVE one, which is this goal's remit. The one free parameter of the
        mechanism is not bounded by mathematics and is not bounded by the standards
        stack either: it is bounded by nothing. That is a normative gap in deployed
        specifications, sourced at row level with section, mechanism, citation and
        retrieval date, and it is a candidate for a standards-side recommendation
        rather than for another batch of measurement.
    answer_to_the_cards_lead_question: >-
      The card asks whether "M = 1 in every mode a reader would actually care
      about" is the honest reading. It is NOT, and T1 is right to decline it. M = 1
      is firm in 2 of 14 deployment modes and caveated in 2 more; 2 are per-handshake
      counts under a clause that permits key reuse; 8 state nothing. Whether the
      M = 1 modes are "the dominant deployment" is itself unmeasured and the census
      does not claim it -- and the count-unstated set contains HPKE recipient keys,
      CMS/S-MIME, X.509-certified decapsulation keys, ECH configs and PKCS#11 token
      keys, which is not a minority of real ML-KEM usage. The 8-row absence
      genuinely does leave the door open, exactly as T1 carefully says.
    does_this_close_the_campaign: >-
      NO. C1 is untouched (no numeric dbeta bound with a core-SVP bit value was
      produced; T3's design_audit is explicitly labelled NOT A FINDING and its
      quantities are forced a priori). C3 is unmet (instrument outcome). The stop
      rule requires C1-C3 to be met. GOAL-MLKEM-005 non_terminal_conditions
      additionally bar closing on a refuted candidate, a negative result, a lane
      closure, or a judgement that the problem is hard.

  # ------------------------------------------------------------------
  is_C3_unmeetable_by_this_design:
    verdict: >-
      NO. C3 is measurable by this exact instrument, and the missing piece is one
      arm that costs about ninety seconds of numpy. The rotation-invariance
      argument does NOT undermine the real-basis arm, and I measured the control
      that proves it.
    why_rotation_invariance_does_not_generalise: >-
      Rotation invariance applies to the Haar arm because that projector's LAW is
      O(d)-invariant. The real arm's projector comes from a q-ary lattice
      Lambda_q(A), whose law is invariant under the signed-permutation
      (hyperoctahedral) group, not under O(d). A CBD_{eta=2} error is a product
      measure over coordinates -- also hyperoctahedral-invariant, not
      rotation-invariant. So real projector and error share exactly the symmetry
      that would have to be broken for a signal to exist, and a signal is therefore
      possible. The mechanism is concrete: for a coordinate-aligned rank-beta P,
      R = sum_{i in S} e_i^2 / sum_i e_i^2, and Var(sum_{i in S} e_i^2) =
      beta*(E[e^4] - 1) = 1.5*beta for CBD_{eta=2} (E[e^4] = 2.5, excess kurtosis
      -0.5) against 2*beta for a Gaussian. R is under-dispersed by a factor 0.75 in
      variance, so its lower quantiles sit ABOVE the Beta quantiles.
    the_measurement:
      what: >-
        My own independent run, d = 100, beta = 30, k = d/2, q = 3329, 2^20
        CBD_{eta=2} errors shared across arms, the package's own frozen quantile
        estimator (sort ascending, q_emp(p) = R_sorted[round(p*N)-1]), 8 draws per
        arm. This is NOT a repair of the package and NOT a re-scoring of its frozen
        rule; it answers whether headline (b) can read the projector at all.
      results_ratio_2em10_mean_pm_sd_over_8_draws:
        haar_null:                  "1.00116 +- 0.00236   (matches the package's own haar arm)"
        coordinate_aligned:         "1.09402 +- 0.00396"
        unreduced_qary_tail_GSO:    "1.03719 +- 0.00236"
      contrast_against_the_packages_own_gate:
        s_haar_per_draw_sd: 0.00236
        coord_minus_haar: 0.09286
        coord_shift_in_units_of_s: 39.32
        unreduced_qary_minus_haar: 0.03603
        unreduced_qary_shift_in_units_of_s: 15.25
        comment: >-
          The frozen gate demanded 4 s. A PROJECTOR-side demonstration clears it by
          a factor of about 10, and the scientifically interesting arm -- the tail
          GSO of an UNREDUCED q-ary basis at the same (d, k, q) -- clears it by a
          factor of about 4. Against the correctly computed SE of the difference of
          two 8-draw means these are ~57 sigma and ~30 sigma.
      monotonicity_check_KN_TECH_1a5b7e_obligation_3_refinement:
        family: "Q_t = QR( sqrt(1-t) * E_S + sqrt(t) * G ), E_S a random beta-subset coordinate selector, G Gaussian; t = 0 coordinate-aligned, t = 1 Haar"
        grid_t:      [0.00, 0.05, 0.10, 0.25, 0.50, 0.75, 1.00]
        ratio_2em10: [1.09304, 1.08590, 1.07675, 1.05055, 1.01755, 1.00159, 1.00098]
        monotone: true
        n_interior_points: 5
        comment: >-
          Strictly decreasing across all seven points, so a DIRECTIONAL reading is
          available. GOAL-MLKEM-004 never achieved this: DEC-20260805-0b3e11 records
          that its sensitivity curve was provably non-monotone with a crossing at
          t* = 0.7259, which is why no operational direction was available there.
          This statistic does not have that defect.
    what_this_means_for_the_real_arm: >-
      The package's real-arm ratios (report.md sec 4.1: pooled 2^-10 ratios 0.99829,
      1.00054, 0.99954, 1.00100) sit within ~0.4 s of the Haar arm while an
      unreduced q-ary basis of the same shape sits 15 s away. Read WITH the missing
      arm, that is a real and interesting observation about what BKZ reduction does
      to the tail GSO subspace relative to a CBD error. Read WITHOUT it, it is
      uninterpretable, because it conflates "the BKZ tail subspace is not
      coordinate-aligned" with "CBD is close enough to spherical at d = 100-140".
      I emphatically do NOT read the package's numbers that way here: its gate
      failed, and re-reading them now is exactly the post-hoc statistic substitution
      the executor correctly refused. The point is that a SUCCESSOR batch with a
      valid pre-registered demonstration can read them.
    the_decay_prediction_that_must_be_pre_registered:
      statement: >-
        The parameter that should destroy this signal is beta. The coordinate-
        alignment departure scales like sd(R)/E[R] ~ sqrt(2*(1 - beta/d)/beta), so
        it should DECAY as ~1/sqrt(beta) at fixed beta/d. A departure that stays
        flat as beta grows is the canonical artifact tell
        (docs/inventor-protocol.md sec 3) and must be treated as one.
      consequence_at_crypto_shapes: >-
        At beta = 606, d = 1420 the same alignment would produce roughly a fifth of
        the toy-scale departure. STATED AS A PROPERTY OF THE FORMULA ONLY. Nothing
        measured at d <= 140, beta <= 40 is transported to beta = 606, d = 1420;
        the contract forbids it and this report does not do it.

  # ------------------------------------------------------------------
  required_controls:
    - id: RC-1
      priority: 1
      control: >-
        THE MISSING ARM. Tail GSO of an UNREDUCED q-ary basis and of an LLL-ONLY
        basis at the same (d, k, q), same error vectors, same code path, alongside
        real and Haar. Without it the real arm's agreement with Beta is
        uninterpretable. Measured cost: ~1 s per draw at d = 100 in numpy; the
        reductions the real arm needs are already cached.
    - id: RC-2
      priority: 1
      control: >-
        A sensitivity demonstration that manipulates THE PROJECTOR, declared before
        the run, with (i) the comparator named as the Haar arm, (ii) a numeric
        threshold expressed in units of the SE OF THE DIFFERENCE at the declared
        draw count, (iii) both ends of the dynamic range exhibited, and (iv) at
        least three interior points with monotonicity reported. The graded family
        above supplies all four and is verified above.
    - id: RC-3
      priority: 2
      control: >-
        Comparator replication for the REAL arm. The Haar arm was drawn 8 times
        (mode 5 satisfied) but the real arm is 8 bases of ONE (d, k, q) family per
        cell, all sharing ONE set of 2^20 errors (the producer's own D6). Draw at
        least 8 independent error sets so the real arm's per-basis tail-quantile sd
        is a clean 8-sample standard error rather than a common-mode one.
    - id: RC-4
      priority: 2
      control: >-
        The beta-decay control in the_decay_prediction_that_must_be_pre_registered,
        pre-registered as a falsifier at >= 2 beta values beyond {30, 40}.
    - id: RC-5
      priority: 3
      control: >-
        A Gaussian-error arm at matched variance. It isolates how much of any
        coordinate-alignment departure is CBD's platykurtosis rather than the
        projector: under a Gaussian error the coordinate-aligned arm returns EXACTLY
        Beta, so the arm is a null of the null and must return 1.000.

  counterexample_or_mutation: >-
    The decisive mutation is RC-1 + RC-2 above and it is already run at one cell:
    replacing the Haar projector by a coordinate-aligned one moves the frozen
    headline statistic by 39.3 s while leaving the forced E[R] at beta/d to six
    figures. That single number simultaneously (a) refutes any reading that headline
    (b) is a dead or forced statistic, (b) exhibits the dynamic range obligation 3
    required and the frozen design never supplied, and (c) shows the batch's
    INSTRUMENT FAILURE verdict is a defect of one declared arm, not a property of
    the design.

  baseline_comparison:
    dominated_by: "n/a (no result claimed by this batch, and none claimed by this report)"
    dominated_by_check: >-
      Checked, not asserted. The package claims no attack, no speedup, no bit
      figure, no cost reduction and no exponent movement, so there is no frontier
      row to compare against on time, memory or data/queries. T3's numbers are
      explicitly labelled "DESIGN AUDIT, NOT A FINDING" and its binding_statement
      correctly records that the omitted/retained denominator ratio 1/(4 beta ln
      delta) is fixed a priori. T2's P1/P2 passes are explicitly not admissible as
      validation. T1 reports no derived quantity. I found no smuggled claim in any
      of the four packages.
    sota_delta: >-
      No attack; no cost model improved; no bound tightened. The batch's
      contributions are (i) a sourced deployment census with a named normative gap,
      (ii) two design-level negative results about controls, (iii) a verified
      norm-ratio-to-block-size conversion instrument that has not yet been pointed
      at a non-forced quantity, and (iv) a corpus-integrity finding at scale. This
      report adds (v) first-hand confirmation of Bernstein's Appendix A.4
      quotations against the source document and (vi) the exhibited 39.3 s dynamic
      range of the T2 statistic under a projector-side manipulation.
    against_the_published_dominator: >-
      Bernstein ePrint 2022/1580 remains the dominator for the mechanism and is
      undisturbed: it gives Kyber-error-distribution-specific asymptotic constants
      (0.56984... for eta = 3, 0.54668... for eta = 2 at Q0 = 0.501, per reads.md
      sec 1.3) and no ML-KEM bit figure, and its footnote 19 names the concrete
      question as "not addressed by this paper's asymptotics". That leaves the
      concrete question open. It does NOT leave it wide -- Bernstein's sec 1.3 also
      declines to say the heuristics are right and flags "Perhaps Kyber-512 is too
      small for the heuristic multi-target speedups to be applicable" -- and this
      campaign's own ceiling_known_in_advance already forecloses moving an exponent.
      The remaining space is a CONSTANT-factor, deployment-parameterised question,
      and the honest reason it is worth further batches is that it is a DEFENSIVE
      vetting question with a cheap decisive experiment, not that it might yield an
      exponent.

  heuristic_challenges:
    - id: H-1
      target: GOAL-MLKEM-005 ceiling_known_in_advance ("G <= log2 M holds UNCONDITIONALLY")
      challenge: >-
        Two conditions ride silently on "unconditionally": convexity of
        f(beta) = -log2 p(beta), which is a modelling assumption about the
        success-probability curve rather than a theorem, and p(beta_1) <= 1. The
        derivation as written also drops f(beta_1) >= 0 when it writes
        "f(beta_1) + f'(beta_1)(beta_M - beta_1) = G". The dropped term is
        nonnegative, so the stated cap OVERSTATES the attainable gain and errs in
        the defensive direction; this is a scope note, not a defect.
      falsifier: >-
        Exhibit a parameter regime where -log2 p(beta) is concave over the relevant
        interval. T3's own scan_staircase already shows beta*(c) is non-monotone in
        c, which is a discretisation artefact rather than a concavity witness -- but
        it is the cheapest place to look.
    - id: H-2
      target: T2's stated heuristic under test
      challenge: >-
        prediction_frozen.json states the content under test as "a BKZ-reduced
        basis's tail Gram-Schmidt directions behave as a Haar-random beta-subspace
        RELATIVE TO THE CBD ERROR", justified by "CBD coordinates are directionally
        uniform to O(d^{-1/2}) in the body". That justification is about the ERROR's
        directional uniformity, and the heuristic is a joint statement about the
        PROJECTOR and the error. It is exactly the conflation OBJ-3 identifies, in
        the heuristic statement rather than in the demonstration, and it is why a
        Gaussian-error arm (RC-5) is needed to separate the two.
    - id: H-3
      target: the iid extreme-value step underlying every multi-ciphertext bit figure
      challenge: >-
        P2 was meant to test it and its verdict is not admissible (the gate failed,
        and the frozen rule emits the same label on the null arm in all four cells).
        Worse, the producer's own scoping caution is the load-bearing one and is
        easy to miss: the (c) decomposition is of Var(R), i.e. of the MEAN of R
        across bases, and does not bound the between-basis variation of the LEFT-TAIL
        QUANTILE, which is what best-of-M actually consumes. So the assumption that
        matters is untested, not merely inadmissibly tested.

  cost_model_challenges:
    - id: CM-1
      challenge: >-
        The batch objective's "~4-6% at ML-KEM shapes" matches no quantity T3
        reproduces. T3 shows the a-priori omitted/retained ratio is 12.7-15.9% at
        beta = 389/606/855, the slope gap has inconsistent sign, and the 4-6% band
        fits only the 0.292-versus-MATZOV constant mismatch (6.51%, 4.14%, 4.25%),
        a different effect. The Coordinator records this as its own fourth defect
        and I confirm the arithmetic: 0.292/0.27416 - 1 = 6.51%, 0.292/0.28039 - 1
        = 4.14%, 0.292/0.28009 - 1 = 4.25%.
    - id: CM-2
      challenge: >-
        Memory is nowhere costed in this campaign. Best-of-M ciphertext selection
        requires collecting M ciphertexts under one key and evaluating a selection
        statistic on each; at the M values that would make G interesting, the
        data/queries axis and the storage axis both bind, and the van
        Oorschot-Wiener style time-memory interpolation back to single-target primal
        BDD has never been written down here. No number in this batch depends on
        that, because no cost claim is made -- but C1 cannot be discharged without
        it, since C1 asks for a bit value under one NAMED cost model and a cost model
        that prices only BKZ blocks is not a cost model for a multi-ciphertext attack.
    - id: CM-3
      challenge: >-
        T3's delta_beta_fd is quantised to integers and the producer says so; at
        |dbeta| of order 1-3 the difference between the finite-difference and
        linearised values is dominated by quantisation, not by the dropped terms.
        Any successor that uses this instrument for C1 must either work at |dbeta|
        large enough that quantisation is subdominant or report the staircase
        interval rather than a point.

  reduction_and_scope_challenges:
    - id: RS-1
      challenge: >-
        The DHKLS corollary chain is correctly NOT instantiated. I checked the
        cited theorem's hypotheses at first hand (Q18) and the hypothesis is
        "hardness of MLWE ... where the number of samples (using the same secret) is
        unlimited", which the paper itself does not assert holds concretely. No
        corollary is drawn from it in this package and none should be.
    - id: RS-2
      challenge: >-
        Affected-vs-safe scope is NOT inflated anywhere in this package, and I
        looked. Every producer artifact and the snapshot commit carry "session
        recovery, not key recovery", the primal_bdd margins are named as untouched,
        and rule 12 is declared UNMET in each. The census explicitly declines to say
        any deployment does or does not achieve a large M. This is the cleanest
        scope discipline this reviewer has seen in the three MLKEM campaigns.
    - id: RS-3
      challenge: >-
        My own retrieval scope: I read the TU/e green-OA copy of the CCS'21
        PUBLISHED version of Duman et al., not ePrint 2021/1351. Bernstein's [47]
