    - id: Q6
      claim: "T2 sec 5.3: for a Haar-random rank-beta projector drawn independently of e, R = ||Pe||^2/||e||^2 is EXACTLY Beta(beta/2,(d-beta)/2) for every fixed e != 0."
      status: reproduced
      how: >-
        Re-derived: conditional on any fixed e != 0, rotation invariance of the
        Haar subspace makes ||Pe||^2/||e||^2 equal in law to the sum of squares of
        the first beta coordinates of a uniform point on S^{d-1}, which is
        Beta(beta/2,(d-beta)/2); the law does not depend on e, so it survives
        marginalisation over any error law with P(e = 0) = 0. Independently
        measured: e = (1,0,...,0), 16,384 Haar draws at d=100, beta=30, KS
        statistic 0.00794 against Beta(15,35), p = 0.2506, mean 0.29938 against
        beta/d = 0.3. (The executor's own V6a reports KS 0.00611, p = 0.572 on
        its own draws; both are consistent with exactness.)

    - id: Q7
      claim: "T2 sec 5.3 and the snapshot commit: the declared demonstration statistic therefore has EXPECTED CONTRAST EXACTLY ZERO."
      status: not_reproduced
      how: >-
        The inference is invalid as stated and the conclusion is not established.
        Rotation invariance gives exactness for the MARGINAL law of R. The
        DECLARED statistic is the mean over 8 Haar draws of the PER-DRAW empirical
        2^-10 quantile ratio, and E_P[q_p(R|P)] is not the p-quantile of the
        mixture E_P[F_{R|P}]; equality of the mixtures does not transfer to the
        mean of the conditional quantiles.
        I derived the leading correction BEFORE measuring it. Var_total is Beta's
        variance on both arms; Var_total = E_P[Var(R|P)] + Var_P(E[R|P]); the
        isotropic arm has E[R|P] = beta/d deterministically so Var_P(E[R|P]) ~ 0,
        while the anisotropic arm has Var_P(E[R|P]) = v > 0. Hence the anisotropic
        arm's WITHIN-draw sd is smaller by sqrt(1 - v/Var_total) and its per-draw
        lower quantile sits HIGHER by
        shift_ratio ~= (q_Beta - beta/d)/q_Beta * (sqrt(1 - v/Var_total) - 1).
        Measured at d=100, beta=30, 64 Haar draws, 2^20 CBD errors, the card's own
        c1=sqrt(1.6)/c2=sqrt(0.4) two-block scaling:
          Var_P(E[R|P]) isotropic   3.407e-09 (at the sampling floor Var/N ~ 3.9e-09)
          Var_P(E[R|P]) anisotropic 1.697e-05
          PREDICTED shift_ratio     +0.002718  (= +0.84 s in the card's own units)
          OBSERVED  shift_ratio     +0.001366 +- 0.002295 (0.60 SE)
        The observation is 0.60 SE from zero and 0.59 SE from my prediction: at
        n = 64 it excludes neither. The executor's own V6b, at 64 draws and 2^18
        errors, measured +0.00267, which is closer to my closed form than to zero.
        NARROWEST SUPPORTED STATEMENT: the expected contrast is zero to leading
        (marginal) order, is predicted nonzero at second order at roughly +0.8 s,
        and is unresolved by any measurement in or around this package. It is in
        every case far below the 4 s gate, so the adjudication of INSTRUMENT
        FAILURE is correct; only the stated cause is over-claimed.

    - id: Q8
      claim: "T2: the demonstration is not rescuable by more draws (V6b: 64 draws moves the statistic by 1.09 standard errors)."
