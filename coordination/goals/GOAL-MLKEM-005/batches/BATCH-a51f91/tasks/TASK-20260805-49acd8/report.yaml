  narrowest_supported_statement: >-
    BATCH-a51f91 established no mathematical result about ML-KEM and claims none.
    What it did establish: (i) across 24 sourced rows no retrieved ML-KEM
    specification states a numeric per-key ciphertext count above 1, two deployment
    modes (SSH, IKEv2) carry a normative per-key single-use REQUIREMENT under which
    best-of-M selection has provably zero room, and eight deployment modes state no
    count in either direction with the one normative delegation dead-ending at FIPS
    203; (ii) the frozen T2 sensitivity demonstration manipulated the error law
    while the null removed the projector, so it could not demonstrate the
    instrument's sensitivity to the object under study, and its threshold was
    additionally mis-calibrated by expressing 4 s in the per-draw sd of the arm with
    the structurally smallest between-draw variance -- INSTRUMENT FAILURE is the
    right verdict for the right reasons plus one wrong one; (iii) the DHKLS
    one-out-of-many kill condition does not fire, and I confirm that at first hand
    against the source document rather than through an adversarial party's
    rendering; (iv) T3's conversion instrument reproduces its reference exactly and
    its finite-difference table is dominated by integer quantisation, so it carries
    no finding, as the producer says. Independently of the package, I establish that
    the T2 headline statistic moves 39.3 comparator sds under a projector-side
    manipulation and is monotone across a seven-point graded family, so C3 is
    reachable by this design and the design should be repaired rather than retired.

