T2_measurement_TASK-20260805-708b70:
  - id: T2-1
    claim: >-
      For a Haar-random rank-beta projector P drawn independently of e,
      R = ||Pe||^2/||e||^2 is EXACTLY Beta(beta/2,(d-beta)/2) for every fixed
      e != 0, hence the marginal law of R is Beta for ANY error law.
    status: reproduced
    verdict_on_the_derivation: CORRECT
    proof_i_reconstructed: >-
      Write u = e/||e||. P is distributed as V P0 V^T with V Haar on O(d) and
      P0 = diag(1_beta, 0). Then R = u^T P u = ||P0 V^T u||^2 = squared norm of
      the first beta coordinates of V^T u, and V^T u is uniform on S^{d-1} for
      every fixed unit u. The squared norm of any beta coordinates of a uniform
      point on S^{d-1} is Beta(beta/2,(d-beta)/2). The law therefore does not
      depend on u at all, so mixing over any error law leaves it unchanged.
    numerical_check: >-
      My own code, 16384 Haar draws at d=100, beta=30, for three maximally
      different fixed unit vectors: e=(1,0,...,0) KS p=0.809; e=all-ones/sqrt(d)
      KS p=0.480; a single CBD draw KS p=0.068. Means 0.30000 / 0.29973 / 0.29888
      against beta/d = 0.3. This independently reproduces the producer's V6a
      (KS p=0.572 for e=(1,0,...,0)) under a different seed and different code,
      and extends it to two further vectors.
  - id: T2-2
    claim: "the declared demonstration statistic has EXPECTED CONTRAST EXACTLY ZERO"
    status: reproduced_with_a_precision_correction
    result: >-
      The operational conclusion holds and is independently reproduced. The word
      "exactly" is an overstatement of one step. The declared statistic is the
      mean over projector draws of an EMPIRICAL order statistic computed on N
      samples that SHARE one projector, so its expectation is a functional of the
      CONDITIONAL law of R given P, not of the marginal. The two arms differ in
      that conditional law - which is exactly what the producer's own V6c
      measures - so equality of the marginals does not force equality of the
      expectations. The honest statement is "zero to leading order, with any
      residual far below the declared gate", not "exactly zero".
      This is an instance of the finite-sample caution in KN-TECH-1a5b7e's own
      "How to run obligation 4" section, applied to the producer's own
      derivation. Defect DEF-1. It does not disturb the negative.
  - id: T2-3
    claim: "the declared statistic does not separate the isotropic and anisotropic arms"
    status: reproduced
    method: >-
      My own script, d=100, beta=30, N=2^18 CBD errors, 64 Haar projector draws,
      per-draw empirical 2^-10 quantile with the frozen estimator (k = round(pN),
      R_sorted[k-1]), scored against the Beta(15,35) quantile.
    result: >-
      Signed shift -0.0010883, i.e. 0.50 pooled standard errors of the difference,
      and 0.17 times the isotropic arm's own between-draw sd (denominator: the
      isotropic arm's between-draw sd of the 2^-10 quantile ratio over its 64
      draws), against a gate that requires 4. The producer's V6b obtained +0.00267
      at 1.09 pooled standard errors. Two independent measurements with OPPOSITE
      SIGNS, both far below the gate: that is what a near-zero expected contrast
      looks like, and it is stronger corroboration than either alone.
  - id: T2-4
    claim: "Var_P(E[R|P]) moves by a factor 1198, against a closed form it matches to 0.69%"
    status: not_reproduced_at_the_stated_precision
    result: >-
      The CLOSED FORM reproduces exactly: I evaluated
      Var_Beta * (d/(d-1)) * (sum s_i^4 - (sum s_i^2)^2/d) / (sum s_i^2)^2
      by hand and by code and obtained 1.4973262032085532e-05, digit-for-digit
      the producer's value. The two MEASURED figures do not carry the precision
      claimed for them. Both are sample variances of 64 draws (verify.py reuses
      V6b's NP=64), whose own relative standard deviation is sqrt(2/63) = 17.8%.
      My independent 64-draw measurement gives an anisotropic value 22.7% below
      the closed form (1.3 sd - unremarkable) and a ratio of 827, where the
      denominator of that ratio is the isotropic arm's between-draw variance of
      E[R|P], which the producer itself records as sitting at the sampling floor
      Var(R)/N. A ratio whose denominator is an estimator floor is not a physical
      contrast, and "1198" and "827" are the same quantity measured twice.
      The honest statements are: the closed form is confirmed exactly as algebra
      and confirmed to within roughly one 18% sampling sd as a measurement; and
      the anisotropy is loud in the between-draw variance by two to three orders
      of magnitude, with the leading digit unresolved. Defect DEF-2. This matters
      because the producer's proposed D2 amendment rests on both figures.
  - id: T2-5
    claim: "the producer did NOT substitute the statistic that works"
    status: reproduced
    result: >-
      Verified in three places. results.json and receipt.json both adjudicate
      branch NEITHER with classification invalid_measurement. report.md Sec. 5.3
      states "These do not rescue the demonstration and are not offered as a
      substitute" and Sec. 6 states the P1-and-P2 branch is NOT taken. The
      Var_P(E[R|P]) result appears only under V6c and under defect D2 as a
      REQUESTED amendment for the Coordinator to grant. The frozen threshold was
      not adjusted and no run was re-scored. This is the correct behaviour and it
      is the single most creditable thing in the batch.
  - id: T2-6
    claim: "two of four entries in the frozen variance_values LIST are arithmetically wrong; the formula is correct"
    status: reproduced
    result: >-
      Recomputed 2*beta*(d-beta)/(d^2*(d+2)) myself. d100_b30 and d100_b40 agree
      to float precision. d140_b30: frozen 0.0024152803180914513 against the
      formula's 0.0023713710836447254, relative error 1.85e-02. d140_b40: frozen
      0.0028747433264887066 against 0.002874389192296637, relative error
      1.23e-04. Exactly as reported. measure.py computes from the formula, never
      from the list (FROZEN_SHA256 is a module constant at line 50 and the file
      is hash-checked at run start), so no reported number depends on the wrong
      entries. The file was correctly NOT edited.
  - id: T2-7
    claim: "prediction_frozen.json is the file that was hashed at run start"
    status: reproduced
    result: >-
      sha256 of the archived file equals the value in prediction_frozen.sha256,
      the value hardcoded in measure.py line 50, the value in receipt.json, and
      the value printed in stdout.log as both `sha256` and `expected`. The
      binding is real.
  - id: T2-8
    claim: "the frozen prediction's timestamp precedes the first research number"
    status: reproduced_with_an_internal_inconsistency
    result: >-
      Freeze 16:38:29Z (filesystem mtime; the file's own declared field says
      16:38:00Z). The receipt's runs[] block gives protocol-run start 16:42:58Z
      and first_research_number_at_utc 16:42:58Z, which is arithmetically
      consistent with finish 16:48:36Z and wall 337.32 s. But the receipt's
      completion_gate and report.md both say the run started 16:44:53Z. Two
      different start times for the same run appear in the same receipt. Both are
      after the freeze, so the ORDERING claim survives; the record is internally
      inconsistent. Separately, the freeze time is a self-reported mtime that git
      does not preserve, and the smoke run (SMOKE-...-000) carries no timestamp
