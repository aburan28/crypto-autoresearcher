controls_and_null_objects:
  inventor_protocol_section_3_check: >-
    Every reported signal in this batch that could be an artifact was measured
    against a null object of the same shape. T2's Haar-random-subspace arm is a
    null of the correct shape (it deletes the projector's provenance and
    preserves the error law, beta, d, the statistic, the code path and the exact
    error vectors), it was scored FIRST, and the producer reports that the frozen
    rule fires identically on it - which is the honest reading and is the reason
    P1 and P2 carry no information. T3's C1 null object (identical code path with
    c = 1) returns delta exactly 0 and simultaneously reproduces the Sage-archived
    baselines, which is what licenses the DiscreteGaussian substitution. T1 has no
    contrast, states so, and does not invent a null in order to look rigorous -
    which is the correct application of the rule rather than an evasion of it.
  decay_check: >-
    The canonical artifact tell (a quantity that does not decay when the parameter
    meant to destroy it increases) does not arise here, because the batch reports
    no surviving positive signal. Its closest analogue - "does the demonstration
    move when the projector draw count is raised?" - was run: V6b at 8x the
    declared draws still returns nothing, which is the correct diagnosis of a
    zero-power demonstration rather than an underpowered one, and my independent
    64-draw run agrees with the opposite sign.
  comparator_replication: >-
    T2 drew its comparator 8 times and reported the interval, per KN-TECH-1a5b7e
    mode 5. The one comparator NOT replicated is the 64-draw sample variance
    behind V6c, which is exactly where DEF-2 bites.

heuristic_validation_checks:
  applicable: partially
  notes: >-
    T2 is the batch's only heuristic-validation experiment. The theoretical
    prediction (the Beta(beta/2,(d-beta)/2) law and its variance formula) was
    pre-registered in prediction_frozen.json, hash-bound into measure.py, and
    hash-verified in-process at run start, before sampling - I confirmed the
    binding at four independent places. Sample sizes, the three seed families and
    the quantile estimator are all in the frozen file and in results.json, and I
    recomputed the sensitivity table from the archived raw per-draw arrays. The
    theoretical prediction is a theorem, and I reconstructed its proof rather than
    accepting it. The parameter sizes (d <= 140, beta <= 40) are NOT the claimed
    scale and the producer records that as a binding limitation under AGENTS.md
    rule 7, computing no extrapolation - which is why no heuristic is validated
    here and none is claimed to be.
  cost_model_checks: >-
    T3 is a cost-model readout, not a cost table. Every rop/beta/eta/d is labelled
    MODELLED and not measured, both models in play (the card's 0.292 and
    RC.MATZOV's own bits-per-block) are named as different models, and the
    disagreement between them is quantified against a named denominator. Memory is
    reported beside time for both compute tasks (T2 peak RSS 1.124 GB against a
    6 GB budget; T3 0.1184 GB against 4 GB). No per-attempt-cost x
    inverse-success-probability claim is made because no attack is costed.

