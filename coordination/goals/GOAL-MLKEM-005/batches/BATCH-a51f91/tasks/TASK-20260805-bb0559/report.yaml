defects:
  - id: DEF-1
    severity: low
    new: true
    where: "TASK-20260805-708b70/report.md Sec. 5.3; verify.py V6 comment block; receipt.json D2"
    what: >-
      "Expected contrast EXACTLY ZERO" overstates one step. Equality of the two
      arms' MARGINAL laws is proved and correct; the declared statistic is an
      empirical order statistic over N samples sharing one projector, so its
      expectation depends on the CONDITIONAL law given P, which the two arms do
