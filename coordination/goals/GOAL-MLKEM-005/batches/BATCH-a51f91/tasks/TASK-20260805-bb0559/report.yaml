T3_conversion_TASK-20260805-9672b3:
  - id: T3-1
    claim: "known-answer control PASSED verbatim at delta 0.00e+00"
    status: reproduced
    method: >-
      Called primal_bdd under RC.MATZOV myself, through the committed shim and
      the pinned estimator 3e48ef421ec2, from a script sharing no code with
      convert.py.
    result: >-
      Kyber512 140.1994731076207 beta 389 eta 422 d 1005; Kyber768
      200.9587149140538 beta 606 eta 640 d 1420; Kyber1024 270.7236234535225
      beta 855 eta 889 d 1867. Digit-for-digit identical to the control stdout
      and to results.json baselines.
  - id: T3-2
    claim: "cost_zeta is SEQUENTIAL, so no reported beta is ever the argmin over the joint (beta,d) grid"
    status: reproduced
    verdict_on_the_finding: CORRECT
    method: "Read estimator/lwe_primal.py at the pinned revision myself."
    result: >-
      cost_zeta step 1 searches beta with `local_minimum(40, max_beta+precision)`
      calling f(beta, ...) with d supplied by the closed-form heuristic inside
      cls.cost; step 2 then runs `local_minimum(params.n - zeta, cost["d"]+1)`
      with `f(beta=cost["beta"], d=d)` - beta pinned. There is no loop back to
      step 1. The reported beta is therefore the argmin of a one-dimensional
      search along the heuristic curve d(beta), never the joint argmin. The
      producer's own precision_note ("d follows beta through the closed form; what
      it never does is hold d fixed INDEPENDENTLY of beta") is the correct
      qualifier and is present. Measured consequence: at the baselines, step 2
      moves d by +8 / +31 / +35 and log2(rop) by 0.0088 / 0.0263 / 0.0263 bits.
  - id: T3-3
    claim: "primal_bdd(params, optimize_d=False) SILENTLY DISCARDS the kwarg"
    status: reproduced
    method: "Both by reading the source and by executing it."
    result: >-
      Source: PrimalHybrid.__call__ builds `f = partial(self.cost_zeta, ...)`
      with no **kwds, and the explicit-zeta branch - the one primal_bdd always
      takes, since primal_bdd passes zeta=0 - is `cost = f(zeta=zeta)`. Every
      extra kwarg is dropped without warning. Execution: primal_bdd(Kyber512,
      RC.MATZOV, optimize_d=False) returns 140.1994731076207 / beta 389 / d 1005,
      identical to the default call, while PrimalHybrid.cost_zeta(...,
      optimize_d=False) returns 140.20824345474767 / d 1013. Exactly the numbers
      the producer records. The anomaly is upstream, it is real, and the producer
      correctly recorded it without patching the shim.
  - id: T3-4
    claim: "beta*(c) is a non-monotone integer staircase, falling as c rises 3/2/3 times"
    status: reproduced
    method: "Re-ran the estimator myself at five c values around the named example."
    result: >-
      Kyber512: c = 0.975 -> beta 386, 0.9775 -> 387, 0.98 -> 389, 0.9825 -> 387,
      0.985 -> 388. The named non-monotone pair reproduces exactly (387 -> 389 ->
      387). Recomputing the counts from results.json's own recorded scan points
      with my own code gives 3 / 2 / 3 anomalous pairs for 512/768/1024, matching
      the recorded beta_non_monotone_in_c_count. ADDITIONAL OBSERVATION: over the
      same three points log2(rop) is monotone increasing (139.4838 < 139.6277 <
      139.6341), so beta is a non-monotone readout of a monotone cost - which
      sharpens the producer's caution rather than contradicting it.
  - id: T3-5
    claim: "0.292 is not the slope of the model that produced these beta; RC.MATZOV's own is 0.2742/0.2804/0.2801"
    status: reproduced
    method: "My own OLS of log2(rop) on beta over results.json's 41 recorded scan points per set."
    result: >-
      0.27416 / 0.28039 / 0.28009 for Kyber512/768/1024, matching to five
      decimals. 0.292 exceeds each by 6.51% / 4.14% / 4.25%, where the
      denominator in each case is that set's own estimator OLS bits-per-block.
