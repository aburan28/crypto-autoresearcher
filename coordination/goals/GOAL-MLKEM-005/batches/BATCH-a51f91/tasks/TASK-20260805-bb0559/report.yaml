  - id: T3-6
    claim: "OLS slopes 118.445/166.608/224.480, residual sd 0.494/0.452/0.685, se 2.477/2.266/3.432"
    status: reproduced
    result: "All nine figures reproduce exactly from the recorded raw points with independently written OLS."
  - id: T3-7
    claim: "the a-priori omitted/retained ratio 1/(4 beta ln delta) is 0.159/0.139/0.127 at beta = 389/606/855"
    status: reproduced
