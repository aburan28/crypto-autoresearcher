      reasonable and is stated in advance in the frozen file. Defect DEF-4.
  - id: T2-9
    claim: "the sensitivity table: shift/s = 0.79, 1.09, 1.97, 3.73, gate not met in any cell"
    status: reproduced
    method: >-
      Recomputed the shift and s myself from the per-draw ratio arrays archived
      in results.json (cells.*.arms.*.per_draw[*].p2em10.ratio).
    result: >-
      Every `s` and every `signed_shift` in receipt.json's
      sensitivity_adjudication reproduces from the raw arrays to better than
      1e-12 in all four cells. Signs alternate +,-,-,+ as reported.
  - id: T2-10
    claim: "the 4*s gate is a 4-sigma gate"
    status: not_reproduced
    result: >-
      Not claimed in those words by the producer, but it is what "4*s" reads as,
      and the yardstick is mis-specified. The quantity thresholded is a PAIRED
      difference of means: the demonstration arm reuses the SAME 8 projector draws
      as the Haar arm (frozen file, sensitivity_demonstration_arm). The declared
      spread `s` is the UNPAIRED per-draw sd of one arm. Computing the paired
      per-draw difference from the archived arrays gives sd 0.0108 / 0.0143 /
      0.0117 / 0.0121, so the proper standard error of the shift over 8 draws is
      0.0038 - 0.0050 and the observed shifts are 0.53, 0.55, 1.47 and 1.68 of it.
      On that scale nothing is resolved at all. Meanwhile 4*s = 0.0102 / 0.0101 /
      0.0124 / 0.0078 is SMALLER than 4 proper standard errors, so the frozen gate
      was more LENIENT than a 4-sigma test - and it still failed in every cell.
      Defect DEF-3. The direction is favourable: the negative is robust to the
      correction, and is if anything understated.
  - id: T2-11
    claim: "the anisotropy is invisible at the declared 8 draws"
    status: additional_observation
    result: >-
      Not asserted by the producer, and worth recording because the run's own
      archived data refute it for a different statistic. The demonstration arm's
      between-draw sd of the 2^-10 quantile ratio is 4.86, 5.79, 4.33 and 5.75
      times the Haar arm's, where the denominator in each case is the Haar arm's
      between-draw sd of the same ratio over the same 8 draws. So a demonstration
      declared on the SPREAD of the declared statistic, rather than on its mean,
      would have moved by roughly a factor of 5 at the declared 8 draws, inside
      the protocol run, with no extra compute. This is an observation about what
      the archived data show; adopting it is a Coordinator decision and I have
      neither adopted nor implemented it.
  - id: T2-12
    claim: "the frozen P1/P2 rule emits the identical verdict on the null arm and the real arm in all four cells"
    status: reproduced
    result: >-
      stdout.log shows the null arm scored FIRST in every cell, per
      KN-TECH-1a5b7e mode 4's null-first check, and receipt.json's
