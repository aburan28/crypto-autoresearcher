validity:
  status: completed_valid
  reason: >-
    All planned cells terminal; every missing cell explained and enumerated; all
    required artifacts present; the summary tables in report_a1.md were recomputed from
    the complete per-block record in results_a1.json and agree with it; the result
    reproduces from the recorded command and revision. The measurement finished at
    26.947 s of a 600 s cap with no timeout, no crash and no resource exhaustion.
  partial_coverage: true
  partial_coverage_reason: >-
    114 cell evaluations uncovered, all of them X_gso_k through RG_cholesky_of_gram at
    binary32, where numpy raises LinAlgError Matrix is not positive definite on the
    float32 Gram at every lattice and basis. This is numerical and infrastructure
    signal under AGENTS.md rule 5 and PREREG-2 7.6, it forces the -PARTIAL suffix, and
    it is NEVER a falsifier of A-1 and never negative mathematical evidence.
  failure_classification: not applicable -- the run neither failed nor was invalidated

anomalies_recorded_none_discarded:
  - X_gso_k through RG at binary32 failed at every lattice and basis (float32 Cholesky not positive definite)
  - P-GRAM failed on route RG at five lattices and passed on route RQ everywhere; scored as frozen, derivation not patched
  - X_gso_k certified UNCERTIFIED, contradicting PREREG-2 2.4's NON-CONSTANT expectation; the certification binds
  - every FC-3a and FC-3b firing comes from the null object X_hash, because the only candidate that reads the instance is uncertified
  - two implementation defects found by reduced-scope smoke tests BEFORE the declared run and fixed before it (guard argument union; 240-digit exact-route statistic)
  - peak RSS not instrumented; recorded as missing data rather than estimated
  - FC-3a and FC-3b instance lists in results_a1.json truncated to 200 entries with the truncation count recorded; the complete record is per_block
  - the automated P-A12a register line in results_a1.json is mis-scored HELD; corrected to FALSIFIED at 22 cells in report_a1.md against the raw data, with the uncorrected value left visible
  - the model that answered is not the model the adapter binds to the requested policy

executor_objections_recorded_and_scored_as_frozen_anyway:
  - id: OBJ-1
    clause: PREREG-2 2.9 P-GRAM, tolerance 1e-10 absolute against BOTH committed float64 routes
    objection: >-
      The two committed float64 routes RQ and RG disagree with each other by up to
      3.0015181451403805e-09 in the committed results_falserefusal.json, so no single
      exact value can reproduce both to 1e-10 at L2, L5, L8, L10 or L12. The clause is
      unsatisfiable there by any exact route, and the observed failure is a property of
      route RG rather than of the derivation.
    action_taken: >-
      Scored exactly as frozen. R7_exact_gram reported UNAVAILABLE, FC-1 recorded as
      fired, the derivation NOT patched, no substitute route introduced, and no
      replacement tolerance proposed.
  - id: OBJ-2
    clause: PREREG-2 1.3 precision_degenerate, strict versus frozen reading
    objection: >-
      Under the strict reading A-1.2 is falsified at 4788 cells purely by the definition
      of route R0 and the bit-identity of R1 and R3 on the fibre, which PREREG-2 6.3
      itself names as the live could-not-HOLD instance.
    action_taken: >-
      The frozen reading was applied in the scoring. Both readings are reported at every
      one of the 4788 cells as R3-OUT-7 requires.

