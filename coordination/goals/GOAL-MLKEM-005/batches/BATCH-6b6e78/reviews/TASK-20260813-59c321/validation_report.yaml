  # ==================================================================
  # 3. METRIC RECOMPUTATIONS
  # ==================================================================
  metric_recomputations:
    - id: MR-0
      name: REPRODUCIBILITY OF THE PRODUCER RUN ITSELF
      method: >-
        the committed measure_a1.py re-run unmodified from its committed path with --out
        redirected into my own write scope; the two results JSONs then flattened to
        leaves and compared key-by-key
      leaves_compared: 379,149 shared
      keys_only_in_committed: 2 (both entries of git_dirty_paths)
      differing_leaf_values: 44
      differing_leaves_that_are_not_timings: 0
      finding: >-
        EVERY scientific value in results_a1.json reproduces exactly from the committed
        code at the recorded revision. The 44 differences are wall clocks; the 2 extra
        keys are working-tree state. This is the strongest reproducibility result I have
        been able to establish in this goal, and it is recorded as such.
      class: generation-class (reproducibility), arithmetic-class (comparison)
      verdict: PASS
    - id: MR-1
      name: THE HEADLINE -- does the committed VAR-F verdict CHANGE with precision
      frozen_clause: PREREG-2 3.2, AM-18(b)
      producer_reports: 1,416 cells in 49 of 330 blocks; R4 1,396; R2 20; all else 0
      my_blind_re_derivation_from_the_frozen_text: >-
        1,313 cells in 49 of 330 blocks; R4 1,293; R2 20; all else 0
      my_re_derivation_under_the_producers_resolution_of_the_2_6_ambiguity: >-
        1,416 cells in 49 of 330 blocks; R4 1,396; R2 20; all else 0 -- IDENTICAL to the
        producer on every axis: by route, by candidate (X_null 96, rdet 10, X_parfree 10,
        V_evade 98, X_lambda 98 at each of the ten lambda, X_hash 96 / 95 / 31 / 0), and
        by fibre family (108 / 104 / 126 under PIN-DET; 352 / 341 / 385 under
        PIN-DET+PIN-A00)
      independent_recomputation_from_the_committed_per_cell_record: >-
        1,416 cells in 49 blocks, R4 1,396, R2 20, with the same by-candidate and
        by-family vectors, recomputed cell by cell from
        R3_OUT_2_two_precision_table.per_block[*].per_cell and NOT from any summary
      invariant_under_both_readings:
        - 330 blocks, 12,540 declared cells, 12,426 covered, 114 uncovered
        - 49 blocks contain at least one changing cell
        - route R2 contributes exactly 20
        - routes R0, R1, R3, R5, RQ, RG contribute exactly 0
        - "the AM-18(b) statement itself: the clause is reading a representation on R4
          and R2 and is not doing so on the other four float routes"
      variant_under_the_two_readings:
        - the total (1,416 vs 1,313) and the R4 component (1,396 vs 1,293)
        - the by-candidate and by-family decompositions of the changing cells
      verdict: >-
        STRUCTURE CONFIRMED, COUNT NOT REPRODUCIBLE FROM THE FROZEN TEXT ALONE. See
        finding F-1.
    - id: MR-2
      name: A-1.1 exact-route certification (R3-OUT-1)
      my_result: >-
        14 CONSTANT (X_null, rdet, X_parfree, V_evade, X_lambda at all ten lambda),
        4 NON-CONSTANT (X_hash at all four amplitudes), 1 UNCERTIFIED (X_gso_k)
      producer_result: identical, 14 / 4 / 1
      X_gso_k_reason: >-
        R7_exact_gram TERMINATES everywhere -- I ran it at every lattice including
        d in {100, 140} -- and is reported UNAVAILABLE solely because P-GRAM failed. The
        producer's rule application is exactly as PREREG-2 2.9 freezes it. It is NOT a
        timeout, NOT a crash and NOT a missing dependency, so 7.3's infrastructure
        exclusion does not apply to it and it is correctly scored as an FC-1 firing
        rather than as coverage.
      verdict: PASS -- exact agreement
    - id: MR-3
      name: PREREG-2 2.9 CHECKED AS MATHEMATICS, not as arithmetic
      step_i: >-
        prod_{j=1..k} ||b*_j||^2 = det Gram(b_1..b_k), verified over Fraction by running
        exact Gram-Schmidt on 12 integer row sets I built myself, including a
        rank-deficient case and a zero-row case. TRUE in all 12.
      step_ii: >-
        for the frozen families, Gram(b_1..b_k) = I_k + A A^T, verified ENTRYWISE in
        exact integer arithmetic at all 10 declared lattices. TRUE at all 10.
      step_iii: >-
        (1/k) sum_j log||b*_j|| = (1/(2k)) log det(I_k + A A^T), verified at 80 decimal
        digits against exact Gram-Schmidt at L7, L9, L11, L12; agreement to within 4e-79.
      step_iv: >-
        det G_k is an integer -- TRUE; and Sylvester's identity
        det(I_k + A A^T) = det(I_{d-k} + A^T A) verified exactly at all 10 lattices
        (determinants of 43 to 317 decimal digits), which is an independent second
        computation of the same quantity.
      step_v: >-
        my multi-modular determinant cross-checked against fraction-free Bareiss at
        L7, L9, L11 -- identical.
      verdict: >-
        THE COORDINATOR'S DERIVATION IS CORRECT. FC-1's firing for the raw-GSO class is
        NOT evidence against it. This is the single most consequential mathematical
        check in the batch and it passes cleanly.
    - id: MR-4
      name: P-GRAM (R3-OUT-8)
      my_result: >-
        640 comparisons of my exact R7_exact_gram against my own float64 RQ and RG on
        family F0 and the three PIN-DET fibre draws. Worst RQ deviation
        1.4210854715202004e-13; worst RG deviation 3.00154967547428e-09 at F0/L5.
        P-GRAM FALSIFIED at the frozen 1e-10 tolerance.
      producer_result: >-
        RQ 1.421e-13 (passes), RG 3.002e-09 at F0/L5 (fails). Identical to every printed
        digit.
      verdict: PASS -- exact agreement, and see OBJ-1 ruling in objection_rulings
    - id: MR-5
      name: A-1.2 / A-1.3 falsifier scoring (R3-OUT-2)
      FC_1: >-
        FIRES for the raw-GSO class (1 of 2 in-scope classes); does NOT fire for the
        determinant-only class, whose R6_exact exists, is defined and terminates
        everywhere. Confirmed independently.
      FC_2a: >-
        FIRES at 153 cells, route R2_QR_of_BT ONLY, across every certified-CONSTANT
        candidate and all six fibre families. Identical under BOTH of my readings and
        under the per-cell recomputation. By candidate: X_null 12, rdet 10, X_parfree 10,
        V_evade 10, X_lambda 10 at each lambda except lambda = 1 at 21. Extreme cell
        rho32 = 0.0 against rho64 = 5.108933096583503e-14 for rdet on
        F0|fib_s4|PIN-DET at L5. (The producer labels that cell L5_b95 and I label it
        L5_b20; rdet is beta-free, so all five L5 cells carry the identical rho and the
        extreme is a tie. Not a discrepancy.)
      FC_2b: >-
        DOES NOT FIRE. Under my exact route every certified-CONSTANT candidate has all
        eight exact fibre values EQUAL, so rho is exactly 0. Confirmed, and confirmed
        against the committed per-cell record, which carries FC-2b at zero cells.
      FC_3a: >-
        FIRES at 868 cells under the producer's reading (684 / 113 / 60 / 11 at
        c = 1e-9 / 1e-3 / 1e-2 / 1e-1) and at 867 under mine (684 / 114 / 56 / 13). The
        c = 1e-9 component, 684 = every cell of that amplitude, is IDENTICAL under both.
        The difference is entirely on route R4 at binary32.
      FC_3b: >-
        FIRES at 354 cells, X_hash[c=1e-09] only, routes R0 114 / R1 114 / R3 114 /
        R2 12. IDENTICAL under both readings and under the per-cell recomputation.
      A_1_verdict: >-
        A-1 does NOT hold. Four of the five frozen falsifiers fired and any one is
        independently sufficient. Confirmed under both readings.
      verdict: PASS
    - id: MR-6
      name: R3-OUT-7 precision_degenerate, both readings
      my_result: >-
        4,788 cells with rho(binary64) == 0 exactly, all of certified class CONSTANT,
        split R0 1,596 / R1 1,596 / R3 1,596 and 342 per certified-CONSTANT candidate
        instance (14 x 342 = 4,788). Under the STRICT reading, rho(binary32) is ALSO
        exactly 0 at ALL 4,788, so A-1.2 is falsified at every one of them and 0 satisfy
        the strict reading.
      producer_result: identical in every number
