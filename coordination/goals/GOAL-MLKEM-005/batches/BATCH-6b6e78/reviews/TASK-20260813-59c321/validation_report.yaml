  findings:
    - id: F-1
      severity: MATERIAL -- the batch's headline count is not reproducible from the frozen text
      class: generation-class
      statement: >-
        measure_a1.py's binary32 route R4 does not implement what results_a1.json's own
        route_provenance field declares it implements, and the batch's single headline
        number depends on the difference.
      the_declared_rule: >-
        results_a1.json.route_provenance["routes at binary32"] states: "the committed
        float64 expressions with the cast to np.float64 replaced by a cast to np.float32
        AND NOTHING ELSE CHANGED". measure_a1.py:273-276 repeats it in its own docstring.
      the_committed_float64_expression: >-
        probe_nullroute.py:183 and measure_gvar2.py:219 both compute
        G = (B @ B.T).astype(np.float64) -- the Gram is formed in EXACT int64 and cast
        ONCE. Replacing that cast with np.float32 gives (B @ B.T).astype(np.float32).
      what_measure_a1_py_actually_does: >-
        measure_a1.py:295 computes dt(0.5) * np.linalg.slogdet(Bf @ Bf.T)[1] with
        Bf = B.astype(dt) -- the Gram is ACCUMULATED AT THE WORKING PRECISION. That is a
        change beyond the cast, and it is the one thing the provenance statement says did
        not happen. The same file is internally inconsistent about it: measure_a1.py:314
        keeps the exact integer Gram for route RG.
      why_it_was_invisible_to_the_producer_s_own_check: >-
        at binary64 the two are BIT-IDENTICAL -- I verified this at all ten lattices --
        because every entry of B B^T is an integer below 2**53 on these families, so the
        float64 accumulation is exact. The producer's consistency check "480 of 480 route
        values bit-identical to the committed measure_gvar2, max abs diff 0.0" is
        therefore TRUE and CANNOT DETECT the deviation, because the deviation exists only
        on the axis the check does not cross. That is a check that could not fail on the
        axis that mattered, and it is worth naming as such.
      magnitude_at_binary32: >-
        the two R4 values differ by 0.70 to 69.70 in absolute terms across the ten
        lattices (L5 worst at 69.70, against a route value of about 324). This is not a
        ULP effect; it is a catastrophic float32 accumulation in forming the Gram.
      consequences_measured_not_argued:
        - "VAR-F verdict changes: 1,416 cells (producer) vs 1,313 (verbatim carry);
          route R4 1,396 vs 1,293"
        - "the by-candidate and by-fibre-family decompositions of those changes"
        - "FC-3a: 868 vs 867 (per amplitude 684/113/60/11 vs 684/114/56/13; the c=1e-9
          component, 684, is identical)"
        - "R4|binary32 K_min/K_max: 5.272e+06 / 1.750e+04 vs 6.531e+06 / 1.279e+04
          (EMPTY under both)"
        - "the binary32 DIAGNOSTIC X_null|R4 REFUSE count: 6 of 38 vs 8 of 38"
      what_does_NOT_change: >-
        the block count 49; route R2's 20; the zero contribution of R0, R1, R3, R5, RQ,
        RG; every certified class; every falsifier firing and non-firing including FC-2a
        at exactly 153 and FC-3b at exactly 354; every precision_degenerate number; the
        joint K-interval and its emptiness (and its emptiness restricted to binary64
        alone); all three frozen F0 readings V6/V7/VX at the frozen binary64 reading; and
        THE TERMINATION BRANCH.
      root_cause_is_a_SPECIFICATION_GAP_in_PREREG_2_2_6: >-
        stated in the producer's favour as well as against it. PREREG-2 2.6 declares the
        six routes BY REFERENCE to committed float64 code and then declares a SECOND
        working precision without saying how a carried expression generalizes to it. Both
        readings are defensible from the frozen text; only one is defensible from the
