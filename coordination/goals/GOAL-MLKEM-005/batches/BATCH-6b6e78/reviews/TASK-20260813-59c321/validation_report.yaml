validation_report:
  id: VAL-20260813-59c321
  task_id: TASK-20260813-59c321
  goal_id: GOAL-MLKEM-005
  batch_id: BATCH-6b6e78
  role: validator
  claim_tier: toy
  claim_tier_statement: >-
    CLAIM TIER TOY, UNCONDITIONALLY. Nothing in this report bears on ML-KEM security, on
    any FIPS 203 parameter set, on any attack cost or on any cost model, and no number
    here transports to beta = 606, to d = 1420 or to any parameter set by extrapolation,
    analogy or any other route. This report verifies EVIDENCE INTEGRITY. It does not
    decide what the evidence means for any hypothesis, and it authorizes no promotion.
  run_ids:
    - RUN-20260813-2ce014-a1        # the producer run under validation
  reviewed_snapshot:
    producer_snapshot_commit: 4e466c6bf221ea002fe84311baccdb816081a8cd
    notarization_commit: 60ac819982793e8ed402bc3b2f4b7ad1b1824f92
    prereg_sha256: 6c7c0800f0fdd94f62443262e5283aadc2149bad97d377634581d7aceba405ed
    head_at_review: e7b3d2aceec652c37559a79f0d4aa0564215634d
    branch_at_review: claude/launch-research-harness-1ns6z3

  # ==================================================================
  # 0. THE ONE-LINE VERDICT, AND THE SPLIT IT RESTS ON
  # ==================================================================
  headline:
    what_reproduced: >-
      An implementation written by me from the frozen text alone -- producer module NOT
      imported, bases rebuilt from their seeds, no producer artifact read as an input to
      any number -- reproduces EVERY committed structural verdict of this batch, and
      reproduces the producer's numbers TO EVERY PRINTED DIGIT once the single
      under-specified implementation choice in PREREG-2 2.6 is resolved the producer's
      way. The termination branch T-A1-FALSIFIED-PARTIAL is the branch the frozen clause
      actually fires on the committed rows.
    what_did_not: >-
      The batch's single headline COUNT -- "the committed VAR-F verdict changes with
      precision at 1,416 cells" -- is NOT reproducible from the frozen text alone. It is
      1,313 under the binary32 route construction that results_a1.json's own
      route_provenance field DECLARES was used, and 1,416 under the one measure_a1.py
      actually uses. The two differ only at binary32 and only on route R4. No certified
      class, no falsifier firing or non-firing, no K-interval emptiness, no F0 reading
      and NOT the termination branch changes between them.
    and_one_false_statement_about_a_committed_artifact: >-
      report_a1.md section 10 and anomaly 8 -- and, inherited from it, the committed
      snapshot receipt of TASK-20260813-48240d -- state that results_a1.json's automated
      P-A12a register line is mis-scored HELD and was left unedited. The committed
      results_a1.json records OUTCOME FALSIFIED, a fresh run of the committed
      measure_a1.py reproduces FALSIFIED, and the scorer as written cannot produce HELD.
      The SUBSTANCE of the correction (P-A12a is FALSIFIED, at 22 cells) is right and I
      confirm it independently; the account of the artifact is wrong.

  # ==================================================================
  # 1. THE ARRANGEMENT IN WHICH MY OWN CHECK COULD NOT FAIL
  #    NAMED IN BOTH DIRECTIONS, AND WHY I AM NOT IN IT
  # ==================================================================
  my_own_could_not_fail_arrangements:
    - id: MINE-1
      direction: COULD-NOT-FIRE
      arrangement: >-
        If I had imported the producer's measure_a1.py, or read results_a1.json as an
        input to any number I compute, agreement would be guaranteed and my
        "re-derivation" would be a tautology. This is the arrangement a validator falls
        into by default, because importing is easier than transcribing.
      why_i_am_not_in_it: >-
        probe_rederive_a1.py imports NOTHING from TASK-20260813-2ce014. Its only inputs
        are the frozen constants, grids, seeds and formulae of PREREG-2 sections 2.1-2.9
        and the frozen constructions PREREG-2 2.6 and 3.2 declare to be carried
        (make_A_seed, fixed_unimodular, fixed_isometry, bit_identical, sd_mean,
        var_s_from_cells, var_f_from_cells, gvar2), which are TRANSCRIBED from their
        committed source text rather than imported. Decisive evidence that this is real
        and not asserted: my primary run DISAGREES with the producer (1,313 vs 1,416).
        A check that cannot fire cannot produce a disagreement.
    - id: MINE-2
      direction: COULD-NOT-PASS
      arrangement: >-
        If I had mis-transcribed a frozen construction -- a seed, a route expression, the
        VAR-F threshold, the fibre pinning -- nothing would ever agree, and I would
        "find" a defect in every row. This is the mirror failure and it is the one that
        makes a validator look rigorous while being useless.
      why_i_am_not_in_it: >-
        Under the producer's resolution of the R4 ambiguity my implementation reproduces,
        bit-for-bit or to every printed digit: 330 blocks; 12,540 declared cells; 12,426
        covered; 114 uncovered; 1,416 changing cells in 49 blocks; R4 1,396 and R2 20 and
        every other route 0; the by-candidate vector (96, 10, 10, 98, 98x10, 96, 95, 31,
        0); the by-family vector (108, 104, 126, 352, 341, 385); FC-2a 153 on route R2
        only with X_null 12 and rdet 10; FC-2b 0; FC-3a 868 split 684/113/60/11; FC-3b
        354 split R0 114 / R1 114 / R2 12 / R3 114; 4,788 precision_degenerate cells
        split 1,596 / 1,596 / 1,596 over R0 / R1 / R3 and 342 per certified-CONSTANT
        candidate instance; strict-reading FALSIFIED at 4,788 and SATISFIED at 0; the
        certified class counts 14 / 4 / 1; P-GRAM worst RQ 1.421e-13 and worst RG
        3.0015e-09 at F0/L5; the joint K_min 2.6079e+07 and K_max 0.0; V6 FAIL, V7 FAIL,
        VX PASS with rdet ADMIT 38/38 under R2, R4 and R5 and REFUSE 38/38 elsewhere; the
        binary32 diagnostic X_null|R4 at 6 of 38; and the extreme cells to every digit
        (FC-2a rho64 5.108933096583503e-14; FC-3b rho64 3.3972870369241765e-10; FC-3a
        ratio 1.1714e+09 with rho32 1.813e-01 and rho64 1.548e-10). A mis-transcription
        does not reproduce eight independent vectors of counts and four extreme cells.
    - id: MINE-3
      direction: COULD-NOT-FIRE (git)
      arrangement: >-
        If I had checked each archive commit's change set against the DECLARED SET COPIED
        FROM ITS OWN RECEIPT, the two sides would come from one source and the test could
        not fail.
      why_i_am_not_in_it: >-
        probe_git_chain.py computes the declared set from the dispatch queue's task
        objects (own artifact_paths UNION source-task artifact_paths, per
        tools/research_dispatch.py:574) and the change set from `git diff-tree`. Neither
        side is read from a receipt. The receipts' path_sha256 values are then checked as
        a THIRD independent source against the blobs at the commit and against the
        working tree.
    - id: MINE-4
      direction: COULD-NOT-FIRE (null)
      arrangement: >-
        If my "own null" were a relabelling of X_hash, exhibiting it would prove nothing
        that PREREG-2 2.4 does not already assert.
      why_i_am_not_in_it: >-
        X_indexnoise = X_null + c*g(i) where g depends on the BASIS INDEX ALONE. It reads
        no entry of any basis, not even a hash of one, so it is not a relabelling of
        X_hash (which reads every entry of A). Its behaviour is reported in
        control_checks CC-3 and it is the sharpest result in this report.
    - id: MINE-5
      direction: ORDERING, DECLARED AGAINST MYSELF
      statement: >-
        The R4 switch in probe_rederive_a1.py was added AFTER my first run, not before.
        My first, blind implementation -- written from the frozen text with no line of
        measure_a1.py read -- chose the integer Gram and produced 1,313. I then read
        measure_a1.py:295, located the cause, and added the switch so both readings could
        be measured. That ordering is recorded here rather than narrated away; it favours
        the independence of the 1,313 figure and it is why the 1,416 figure is reported
        as a RE-DERIVATION UNDER THE PRODUCER'S RESOLUTION rather than as a blind one.

  check_classes:
    arithmetic_class:
      - probe_results_audit.py -- producer summaries recomputed against the producer's
        own complete per-cell record. Blind to any defect in how those numbers were
        GENERATED, by construction.
      - the manifest / archive / receipt hash checks.
    generation_class:
      - probe_rederive_a1.py -- bases rebuilt from seeds, routes and candidates
        re-implemented, statistics re-derived. This is the class that can see a
        generation defect, and it is the class that found F-1.
      - probe_gram_derivation.py -- PREREG-2 2.9 verified as mathematics in exact
        rational arithmetic on cases the probe builds itself.
      - probe_own_null.py -- objects PREREG-2 never names, pushed through the same path.
      - the re-run of the producer's own measure_a1.py, which tests reproducibility of
        the generation but NOT its correctness.

