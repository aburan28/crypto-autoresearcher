  # ==================================================================
  # 4. CONTROL CHECKS
  # ==================================================================
  control_checks:
    - id: CC-1
      name: the per-candidate fibre guard P-G2, RE-RUN BY ME
      what_i_did: >-
        rebuilt every candidate's fibre family from PREREG-2 2.3 and 2.4 -- PIN-DET for
        X_null, rdet, X_parfree, X_gso_k and X_hash; PIN-DET + PIN-A00 for V_evade and
        X_lambda -- over all three draws and all ten lattices, and checked per candidate,
        per family and per lattice that every declared nuisance argument is constant
        across the basis index. |det B_i| by exact integer equality (a verified
        consequence of the entrywise-verified block structure, which I also re-verified
        at every basis), A[0,0] by integer equality.
      result: 210 guard records, 0 violations. P-G2 HELD. R3-OUT-V did not fire.
      exhibit: >-
        at F0|fib_s2, L1, the eight A[0,0] values are 2122, 1620, 2918, 1188, 791, 1315,
        895, 2284 under the unpinned BATCH-4ed139 construction -- the same multiset and
        the same order PREREG-2 6.1 records, attributed there -- and 2122 at all eight
        indices under this batch's PIN-A00, with |det B_i| untouched at q^(d-k).
      HOW_THIS_IS_REPORTED: >-
        NOT AS A CONTROL. PREREG-2 6.1 freezes the point and it binds me: under PIN-A00
        the void row is reachable only through an implementation error, because the
        pinning is by construction. Its non-firing is evidence about the IMPLEMENTATION
        and about nothing else, and it may not be cited as a control, as a validation of
        the fibre clause, or as evidence about any object. I cite it that way and no
        other way.
      guard_scope_note: >-
        the producer widened the guard to range over the UNION of the declared argument
        set and the declared nuisance set, because PREREG-2 2.4 lists abs(det B) as
        X_gso_k's nuisance without listing it among X_gso_k's arguments. I implemented
        the same union independently, from the same reading of the table, before reading
        their code. The widening is required for the table to be scorable at all and it
        makes the guard STRICTER, not weaker. It is not a change to the frozen table.
    - id: CC-2
      name: MY OWN BLIND NULLS, named nowhere in PREREG-2, through the identical path
      objects:
        - "X_dk = log|det B| / (d + k)  -- determinant-only, reads nothing free"
        - "X_rowsum = X_null + c * ((sum of every entry of A) mod q) / q  -- reads A"
        - "X_indexnoise = X_null + c * g(i), g a fixed pseudorandom function of the
          BASIS INDEX ALONE -- reads NOTHING of the instance"
      certified_classes: >-
        X_dk CONSTANT, X_rowsum NON-CONSTANT, X_indexnoise NON-CONSTANT -- each equal to
        my pre-stated prediction. The certification machinery is keyed to the OBJECTS and
        not to the declared candidate names.
      X_dk_scored: >-
        684 cells, FC-2a 10, FC-3a 0, FC-3b 0, 342 precision_degenerate, VAR-F verdict
        changes at 10 cells -- i.e. it reproduces X_parfree's profile exactly, which is
        the correct behaviour for a blind determinant-only null.
      result: PASS -- the instrument does what it claims on objects it has never seen
    - id: CC-3
      name: THE SHARP NULL -- X_indexnoise, and what it costs the batch
      measurement: >-
        X_indexnoise is certified NON-CONSTANT by the exact route and scores 684 cells
        with FC-3a 114, FC-3b 0 and 92 VAR-F verdict changes -- IDENTICAL, number for
        number, to X_rowsum, which does read the instance.
      what_this_establishes: >-
        "certified NON-CONSTANT on the fibre" carries NO information whatever about
        whether an object reads the instance. An object that reads only the basis INDEX
        -- not one entry of any basis, not even a hash of one -- is admitted to the
        certified-NON-CONSTANT class on exactly the same terms as one that reads all of
        A. This is strictly stronger than the producer's own scope note, which observes
        only that the class happens to be populated by X_hash alone.
      consequence_for_A_1_3: >-
        A-1.3 was tested exclusively on objects carrying no lattice information. That is
        a real limit on what T-A1-FALSIFIED means and it is stated in limitations L-3.
      inventor_protocol_binding: >-
        docs/inventor-protocol.md section 3 -- a signal is an artefact until the
        identical measurement has been run against a null object of the same shape. This
        IS that measurement, and it was missing from the batch.
    - id: CC-4
      name: DECAY CONTROL -- what the measured quantity SHOULD do, and whether it does
      parameter_meant_to_destroy_the_signal: >-
        the X_hash amplitude c. As c -> 0, X_hash -> X_null, which is EXACTLY constant on
        this fibre, so rho must decay to 0 and should do so essentially linearly in c at
        binary64.
      amplitudes_used: >-
        1e-1, 1e-2, 1e-3, 1e-5, 1e-7, 1e-9, 1e-10, 1e-11, 1e-12, 0 -- five of them
        OUTSIDE the declared grid and chosen by me
      measured_rho_binary64: >-
        3.2027e-02, 3.3768e-03, 3.3952e-04, 3.3973e-06, 3.3973e-08, 3.3973e-10,
        3.3973e-11, 3.3973e-12, 3.3972e-13, 0.0 -- monotone non-increasing, with rho/c
        flat at 0.3397 across twelve decades, and EXACTLY 0 at c = 0
      verdict: >-
        DECAYS AS IT SHOULD. NO ARTEFACT TELL. The canonical failure mode -- a quantity
        that does not decay when the parameter meant to destroy it is turned down -- is
        absent.
      binary32_collapse_located: >-
        rho(binary32) is exactly 0 for every c <= 1e-9 and nonzero for every c >= 1e-7.
        FC-3b's firing on X_hash[c=1e-09] is that collapse and nothing else: it is a
        property of the FORMAT against the AMPLITUDE, not of the object. This does not
        weaken FC-3b -- FC-3b is defined as exactly this event -- but it fixes what it
        means.
    - id: CC-5
      name: the 60-digit exact-statistic artefact the producer disclosed fixing
      independent_reproduction: >-
        I reproduced it. Taking the sd of eight IDENTICAL exact Decimals in a 60-digit
        context gives sd = 3.207e-60 and rho = 3.766e-60, both strictly positive, which
        would spuriously fire FC-2b (an existence test with no threshold). At 400 digits
        the same eight values give sd EXACTLY 0.
      ruling: >-
        THE FIX IS SOUND AND CHANGES NO FROZEN CLAUSE. The defect was in the arithmetic
        context of the STATISTIC, never in the route: PREREG-2 2.6 freezes R6_exact's
        route precision at 60 significant digits and that is unchanged. The statistic's
        working precision is not a frozen constant -- results_a1.json says so explicitly
        in frozen_constants under the key
        implementation_statistic_significant_digits_NOT_A_FROZEN_CONSTANT: 240 -- and
        raising it converts a rounding artefact into the correct value 0. My own
        implementation reaches the same conclusion by a different route (exact equality
        of the eight Decimals), and both agree that FC-2b does not fire.
    - id: CC-6
      name: the guard-scope defect the producer disclosed fixing
      ruling: >-
        SOUND AND CHANGES NO FROZEN CLAUSE. PREREG-2 2.4's table gives X_gso_k the
        declared arguments {d, k, q, raw GSO profile} and the nuisance {abs(det B)};
        abs(det B) is therefore in the nuisance column and not in the argument column. A
        guard ranging over declared_arguments alone reports abs(det B) as unchecked for
        X_gso_k and fires R3-OUT-V on a bookkeeping mismatch rather than on a fibre
        defect. Ranging over the UNION is the only reading under which PREREG-2 3.1's
        instruction ("the whole declared nuisance set, not abs(det B) alone") is
        satisfiable for every row of the table. I reached the same union independently.
        The fix makes the guard cover MORE arguments, never fewer.
    - id: CC-7
      name: negative control on the falsifiers themselves
      statement: >-
        FC-2b is the one falsifier that did NOT fire, and I verified it does not fire for
        the right reason rather than because it is unreachable: it fires whenever a
        certified-CONSTANT candidate has rho > 0 under the exact route, and the
        60-digit-context computation in CC-5 SHOWS IT FIRING when the statistic is
        computed carelessly. So FC-2b is reachable by the instrument, and its non-firing
        is a measurement rather than a construction.

  # ==================================================================
  # 5. RULINGS ON THE ITEMS CARRIED FOR REVIEW
  # ==================================================================
  objection_rulings:
    - id: RULING-OBJ-1
      subject: >-
        P-GRAM's 1e-10 tolerance may be UNSATISFIABLE BY ANY EXACT ROUTE, because the two
        committed float64 routes disagree with EACH OTHER by up to 3.0015e-09
      my_ruling: >-
        THE OBJECTION IS CORRECT, AND STRONGER THAN THE PRODUCER STATED IT. P-GRAM
        requires ONE value within 1e-10 of BOTH committed float64 routes at every basis
        and lattice. By the triangle inequality that is possible only where the two
        routes themselves agree to 2e-10. I recomputed the RQ-vs-RG disagreement from MY
        OWN float64 evaluation on family F0: L1 1.776e-15, L2 1.331e-09, L4 1.776e-15,
        L5 3.002e-09, L7 1.776e-15, L8 4.354e-10, L9 0.0, L10 3.420e-10, L11 1.776e-15,
        L12 6.189e-10. At L2, L5, L8, L10 and L12 the disagreement exceeds 2e-10, so at
        those five lattices NO REAL NUMBER WHATEVER satisfies P-GRAM -- not merely no
        exact route. The producer said "by any exact route"; the true statement is "by
        any value".
      therefore: >-
        FC-1's firing for the raw-GSO class is an artefact of an UNREACHABLE TOLERANCE
        and is NOT a property of the raw-GSO class, and it is NOT evidence against the
        2.9 derivation, which MR-3 verifies as correct mathematics at every step. The
        derivation in fact reproduces RQ -- the route whose diagonal IS the Gram-Schmidt
        norm sequence -- to 1.42e-13 at every basis and lattice, and at the five lattices
        where the two float routes agree bit-closely it agrees with BOTH.
      what_this_does_and_does_not_change: >-
        IT DOES NOT CHANGE THE SCORING. PREREG-2 2.9 froze the consequence in advance
        ("it is never patched"), and the producer applied it as frozen, patched nothing,
        substituted no route and proposed no replacement tolerance. That is correct
        conduct and I confirm it. What it changes is the MEANING of the FC-1 firing, and
        therefore what may be said about it: FC-1 fired because a frozen consistency
        check was unsatisfiable as written, and any successor that cites FC-1 as evidence
        about the raw-GSO class, about X_gso_k, or about the decidability of exact
        constancy for it, is citing an artefact of PREREG-2's own tolerance.
      does_the_branch_change: >-
        NO. T-A1-FALSIFIED fires on FC-2a, FC-3a and FC-3b independently of FC-1, each of
        which is independently sufficient under PREREG-2 1.2, and all three are confirmed
        by my own re-derivation. T-UNSTATABLE could not fire in any case (see
        branch_reading below).
      it_is_a_specification_defect_in_PREREG_2: >-
        RECORDED AS ONE, in the same class as the 1.3 hole PREREG-2 itself declares. It
        is not repairable in this batch: the frozen text is immutable, so a correction is
        a superseding record under a new identifier. I propose no replacement tolerance;
        that is a Coordinator act and not a Validator's.
    - id: RULING-OBJ-2
      subject: >-
        under the strict precision_degenerate reading, A-1.2 is falsified at 4,788 cells
        BY THE DEFINITION of route R0; the frozen reading exempts them
      is_the_frozen_reading_the_right_one: >-
        AS A MATTER OF INSTRUMENT DESIGN, YES, AND THE REASON IS THAT THE STRICT READING
        IS NOT A TEST. A-1.2 asks for a STRICT DECREASE of rho with precision. R0 is
        (d-k) log q and never touches the matrix, so rho(R0) = 0 at every precision by
        construction; the same holds for R1 and R3 on these fibres. Under the strict
        reading A-1.2 would be falsified at those cells before any measurement was taken,
        which makes it a could-not-HOLD arrangement -- and PREREG-2 6.3 names it as
        exactly that, in advance, and 1.3 exempts precisely those cells. A falsifier that
        fires by definition measures the definition, not the object.
      does_the_strict_reading_s_EXISTENCE_change_what_T_A1_FALSIFIED_MEANS: >-
        YES, IN ONE PRECISE WAY, AND IT SHOULD BE STATED WHEREVER THE BRANCH IS CITED.
        It bounds how much of A-1.2's content survives. Of the 4,788 exempted cells,
        0 satisfy the strict reading and 4,788 falsify it -- I recomputed both numbers
        independently and they match the producer exactly. So on routes R0, R1 and R3 --
        three of the six declared float routes, and 4,788 of the 12,426 covered cells,
        38.5 per cent -- A-1.2's directional test is VACUOUS: it neither confirms nor
        falsifies, by the frozen rule, at every one of them. A-1.2's real empirical
        content in this batch lives on R2, R4 and R5 only, and FC-2a in fact fired only
        on R2. A successor stating "A-1.2 was tested at 12,426 cells" would be
        overstating it by 4,788.
      but_it_does_not_soften_the_branch: >-
        T-A1-FALSIFIED fires on the NON-exempt cells: FC-2a's 153 firings are all on
        route R2 at cells explicitly NOT precision_degenerate, and FC-3a/FC-3b are A-1.3
        firings to which 1.3's exemption does not apply at all. The frozen reading is
        therefore the CONSERVATIVE one here: it removes cells that would have added
        falsifications, and A-1 is falsified anyway.
      disclosure_obligation_discharged: >-
        R3-OUT-7 reports both readings at every one of the 4,788 cells, as 1.3 requires,
        and I verified the disclosure is present in results_a1.json per cell and not
        only in aggregate.
    - id: RULING-SCOPE-LIMIT
      subject: >-
        the certified-NON-CONSTANT class is populated ONLY by the null object X_hash,
        because X_gso_k -- the only in-scope candidate that reads the instance -- is
        UNCERTIFIED, so every FC-3a/FC-3b firing comes from the null object
      does_T_A1_FALSIFIED_survive_it: >-
        YES, BUT NOT ON A-1.3. It survives on A-1.2, whose 153 FC-2a firings are on the
        certified-CONSTANT class, which is populated by fourteen candidate instances
        including three -- X_null, rdet, X_parfree -- that are determinant-only objects
        of the goal's own candidate list and not null constructions. FC-2a alone is
        independently sufficient under PREREG-2 1.2 and it is confirmed by my own
        implementation at exactly 153 cells. So the branch does not rest on a class
        containing no real object.
      but_A_1_3_DOES_rest_on_one_and_this_is_the_batch_s_TRUE_LIMITATION: >-
        STATED PLAINLY, AS THE TASK ASKS. A-1.3 -- the invariance clause, the half of A-1
        that is about objects that DO read the instance -- was scored against a class
        containing no such object. Every one of the 868 FC-3a and 354 FC-3b firings comes
        from X_hash, which PREREG-2 2.8 itself declares "carries no lattice information
        whatever". And my own CC-3 shows the class is equally open to X_indexnoise, which
        reads nothing at all. Therefore: A-1.3 IS UNTESTED ON ANY OBJECT THAT READS THE
        INSTANCE, at this scale, in this batch. It is not that A-1.3 failed on real
        objects; it is that no real object was available to it, because the one candidate
        that qualifies was disqualified by an unsatisfiable consistency check (OBJ-1).
        THIS IS THE BATCH'S TRUE LIMITATION and it should appear in the same sentence as
        any statement that A-1 was falsified.
      compounding: >-
        the two items compound. OBJ-1 removed X_gso_k from the certified classes; the
        scope limit is the consequence. A successor that repairs P-GRAM's tolerance would
        recover the one candidate that could give A-1.3 empirical content -- and that,
        rather than a new dispersion statistic, is what the numbers point at.
    - id: RULING-P-A12a
      subject: >-
        results_a1.json's automated P-A12a line is said to be mis-scored HELD, corrected
        to FALSIFIED in the report, with the JSON left unedited
      is_the_correction_right: >-
        YES. P-A12a as frozen predicts rho(f32) > rho(f64) at every non-degenerate
        covered cell for X_null and rdet. I recomputed FC-2a from the complete per-cell
        record and independently from my own implementation: it fires at 12 cells for
        X_null and 10 for rdet, all on route R2_QR_of_BT, total 22. P-A12a is therefore
        FALSIFIED at 22 cells and the report's corrected value is correct and supported
        by the raw data.
      is_the_ACCOUNT_of_the_artifact_right: >-
        NO. The committed results_a1.json records
        PREDICTION_REGISTER.items["P-A12a"].OUTCOME = "FALSIFIED". The string "HELD" does
        not appear against P-A12a anywhere in the file; "P-A12a" occurs exactly twice and
        neither occurrence carries HELD. Re-running the committed measure_a1.py produces
        FALSIFIED. Reading the scorer (measure_a1.py:1570-1578) shows it filters the FULL
        FC["FC-2a"] list, which is never truncated in place -- truncation happens only at
        serialization (measure_a1.py:1274) and FC-2a's 153 entries are below the 200-entry
        cut in any case -- so it CANNOT produce HELD on this data.
      most_likely_benign_explanation_offered_without_asserting_it: >-
        the manifest records three reduced-scope smoke invocations over 3 of the 10
        lattices. The FC-2a firings for X_null and rdet occur only at L5 and L11, so a
        3-lattice smoke run could plausibly have produced HELD. The producer may have
        carried an observation about a smoke run into a paragraph about the committed
        artifact. I offer this as a hypothesis and assert none of it as fact.
      severity_and_reach: >-
        LOW on the science and NOT NEGLIGIBLE on the record. No measurement is affected;
        the committed JSON already carries the correct value; the falsifier counts are
        unaffected. But it is a false statement about a committed artifact appearing in
        report_a1.md section 10, again in its anomaly list item 8, and again -- inherited
        verbatim -- in the COMMITTED snapshot receipt of TASK-20260813-48240d, where a
        Coordinator ledger decision would inherit it. Under AGENTS.md rule 9 a disclosure
        must be true; a self-reported defect that did not happen is a defect in the
        disclosure. It must be superseded, not left standing.

  # ==================================================================
  # 6. THE BRANCH, READ INDEPENDENTLY
  # ==================================================================
  branch_reading:
    was_T_A1_FALSIFIED_PARTIAL_read_correctly_off_the_committed_rows: >-
      YES. Stated plainly and separately, as asked. Under PREREG-2 7's frozen precedence:
      (1) R3-OUT-V dominates and did not fire -- I re-ran the guard myself, 210 records,
      0 violations, so T-VOID does not fire; (2) T-UNSTATABLE requires FC-1 to fire for
      EVERY in-scope candidate class and it fired for exactly one of two, so it does not
      fire; (3) T-A1-FALSIFIED fires when any of FC-1 (some but not all classes), FC-2a,
      FC-2b, FC-3a or FC-3b fires at any covered cell -- FC-1 (one class of two), FC-2a
      (153 cells), FC-3a (868, or 867 under my reading) and FC-3b (354) all fired, and I
      confirm each independently; (4) T-A1-HELD requires none of the first three, so it
      does not fire. Coverage is not full -- 114 declared cell evaluations are uncovered
      -- so 7.6's -PARTIAL suffix applies. THE BRANCH IS T-A1-FALSIFIED-PARTIAL. It is
      read off R3-OUT-1 and R3-OUT-2 under R3-OUT-V's precedence and nowhere else, as 7
      requires, and it does not change under EITHER resolution of the R4 ambiguity.
    did_T_UNSTATABLE_correctly_NOT_fire: >-
      YES, and for the right reason. PREREG-2 7.2 fires only if the exact route is
      unavailable, undefined or non-terminating for EVERY in-scope candidate class -- the
      determinant-only class AND the raw-GSO class. R6_exact exists, is defined and
      terminates for all eighteen determinant-only candidate instances; I ran it myself
      at every cell and it certified 14 CONSTANT and 4 NON-CONSTANT. FC-1 fired for ONE
      class, not every class, so 7.3 applies with the scope named and 7.2 does not. The
      producer's TERMINATION_BRANCH_BASIS records FC_1_fires_for_EVERY_class: false,
      which is the correct predicate and the correct value.
      I ADD WHAT PREREG-2 7.2 ITSELF DEMANDS BE ADDED: this branch was NEARLY FORECLOSED
      BY AN ARCHIVED ARTIFACT before the run, because R6_exact was already built, already
      run and archived at 0.4 s. Its non-firing is therefore NOT evidence that the
      assumption is well-founded, and no successor may cite this branch's silence. That
      sentence is frozen in 7.2 and I repeat it rather than let it be inferred.
