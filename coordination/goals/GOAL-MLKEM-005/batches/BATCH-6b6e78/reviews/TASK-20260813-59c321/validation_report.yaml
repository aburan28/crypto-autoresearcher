        declares for precision_degenerate and 3.2 declares for the VAR-F clause -- found
        by an independent implementation rather than by writing the pre-registration, and
        landing on the batch's single headline number.
      required_action: >-
        a superseding record that either (i) restates the headline as 1,313 under the
        declared provenance, or (ii) amends the provenance statement to declare the
        float-accumulated Gram at binary32 and re-states 1,416 as conditional on that
        declaration. Either is acceptable; leaving a count whose declared derivation does
        not produce it is not. NO RE-RUN IS REQUIRED for this.
      what_it_is_NOT: >-
        not a fabrication, not a protocol deviation from a frozen clause (PREREG-2 2.6
        does not freeze the Gram formation at binary32), and not a reason to discard any
        measurement.
