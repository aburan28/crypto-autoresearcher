review_plan:
  claim_under_review: >-
    The successor accurately records one fixed-cap toy RT-CTRL-1 lifecycle and
    does not infer a mathematical or ML-KEM conclusion from terminal status.
  coordinator_prior: >-
    The controlled SIGTERM receipt should verify; any target terminal status
    will be an instrument observation bounded to one host and one random basis.
  joints:
    - joint: frozen_target_identity
      owner: validator
      attack_plan: Independently hash worker/strategy and verify every manifest field against the frozen specification.
    - joint: terminal_telemetry_integrity
      owner: validator
      attack_plan: Recompute the manifest and event-chain hashes without importing supervisor code; inspect controlled SIGTERM control.
    - joint: interpretation_boundary
      owner: red-team
      attack_plan: Attempt to turn timeout, error, or completion into a prohibited security or cost claim; identify any excess.
  blindness:
    lifted_for: []
    rationale: Reviews are independent and no reviewer reads the sibling report before its own verdict.
  proves_too_much:
    objects: [synthetic SIGTERM self-test, pre-checkpoint SIGTERM control]
    failure_signature: A receipt or claimed progress survives when no such progress was durably recorded.
  blind_rederivation:
    quantity: target manifest digest and event-chain link values
    blind_from: [rt_ctrl_1_supervisor.py]
    method: Recompute from raw JSON bytes using independent verifier logic.
