    n_suggestive_pairs: 0
    tightest_detection_floor_relative: 0.039086083312392855
    verdict: CONSISTENT
    verdict_scope: >-
      The output of the frozen rule on 10 matched-V targets at d <= 140,
      beta <= 40, S = 8, E = 4, N = 2^20, at the 2^-10 quantile only. Six of the
      ten pairs individually carry detection floors at or above tau_rel and for
      those the honest reading is an upper bound at their own floor. It moves no
      hypothesis, closes nothing and validates no heuristic.
    predictions:
      PRED-C1: PASS
      PRED-C2: FAILS (structural share reaches 50% at 2 of 10 targets)
      PRED-C3: HOLDS (0 of 120)

