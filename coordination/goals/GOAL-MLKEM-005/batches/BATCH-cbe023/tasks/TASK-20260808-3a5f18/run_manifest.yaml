    pool_bank_per_cell: 20
    G_CAL: 0.040
    delta_admissibility_clause: 0.50

  results_summary:
    se_construction: >-
      two-way random-effects decomposition over S = 8 independent supports x
      E = 4 independent error pools, SE^2 = (MS_S + MS_P - MS_res)/(S*E), with
      Satterthwaite nu_eff; all three components reported per target as
      absolute values and as percentages.
    error_pools_per_cell: 4
    error_pools_minimum_required_by_AM7: 3
    D_is_one_order_statistic_of_a_single_shared_pool: false
    null_calibration:
      N-A_d100_b40: {R: 300, x: 0, wilson95_upper: 0.012642971224546036}
      N-A_d140_b40: {R: 300, x: 0, wilson95_upper: 0.012642971224546036}
      N-B_d100_b40: {R: 300, x: 0, wilson95_upper: 0.012642971224546036}
