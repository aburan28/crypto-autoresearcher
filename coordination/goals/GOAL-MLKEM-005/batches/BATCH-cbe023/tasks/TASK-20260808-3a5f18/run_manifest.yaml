  protocol_deviations:
  - id: D-1
    kind: protocol_deviation_recorded
    what: the order in which the four (null, cell) units were computed
    frozen_text: >-
      contract 4.9 lists N-A (100,40), then N-A (140,40), then N-B in the same
      two cells, and declares the priority order "N-A both cells first, then
      N-B, then N-C" if the budget binds.
    what_was_done: >-
      each unit was taken to the hard floor R_min = 200 first, in exactly the
      declared priority order, and only then topped up to R_target = 300 in the
      same order.
    why: >-
      G-CAL is UNDECIDED and the verdict WITHHELD unless ALL FOUR units reach
      R_min = 200; on a host whose load ran 39 to 383 during the run, finishing
      one unit at 300 before another reached 200 risked an instrument outcome.
    effect_on_thresholds: >-
      none. Replicate r is the same object whenever it is computed -- its
      supports, permutations and pool quadruple are functions of r alone. No
      seed, replicate identity, cluster membership, criterion or threshold
      changed.
    realized_effect: >-
      none at all: the budget did not bind, all four units reached R = 300 and
      N-C ran in full. ladder_notes is empty; nothing was cut.
  - id: D-2
