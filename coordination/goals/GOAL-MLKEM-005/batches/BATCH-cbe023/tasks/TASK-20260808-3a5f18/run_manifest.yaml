    effect_on_measurements: none; only recorded git metadata is affected

  objections_recorded_and_frozen_specification_run_anyway:
  - id: O-1
    what: >-
      At S = 8 and E = 4 the Satterthwaite nu_eff is small (1.00 to 21.00,
      median about 2.5), so |t|crit ranges from 2.874 to 70.023 across targets
      and is data-dependent by construction. The |t| bar is therefore very
      uneven across targets. The contract declares the data-dependence in
      advance (4.3); the frozen rule was run exactly as written and this changes
      no verdict.
  - id: O-2
    what: >-
      The declared n_C = 11 presumes two graded survivors in every cell;
      (140,30) yields one under the frozen selection rule. Both declared and
      realized counts and levels are reported, with the declared (more
      conservative) level primary. No selection was made after the fact.

  implementation_completions:
  - replicate coordinate in the null TL support seeds ([5,d,beta,s,r] and
