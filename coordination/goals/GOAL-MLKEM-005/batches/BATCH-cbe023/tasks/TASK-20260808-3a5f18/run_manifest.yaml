  randomness:
    determinism: >-
      Every draw is seeded. Re-running the recorded command on the recorded
      revision reproduces every reported number exactly, apart from wall-clock
      timings and load averages.
    streams:
      seed_error: 20260805 + d                    # main arm error pool p = 0
      seed_graded: 500000 + d*1000 + beta*10 + j  # GR family
      seed_basis: 700000 + d*1000 + beta*10 + i   # unreduced arm (fpylll)
      TAG5_TL_support_real_arm: default_rng([5, d, beta, s])
      TAG5_TL_support_null_side_A: default_rng([5, d, beta, s, r])
      TAG6_TL_support_null_side_B: default_rng([6, d, beta, s, r])
      TAG7_cbd_pool_bank: default_rng([7, d, p]), p = 0..19
      TAG8_gaussian_pool_bank_NC: default_rng([8, d, p])
      TAG10_ambient_permutation_NB: default_rng([10, d, beta, r])
      cluster_bootstrap: default_rng(20260808), B = 20000
    no_unseeded_randomness: true

  frozen_design:
    cells: [[100, 30], [100, 40], [140, 30], [140, 40]]
    null_cells: [[100, 40], [140, 40]]
    S_supports: 8
    E_error_pools: 4
