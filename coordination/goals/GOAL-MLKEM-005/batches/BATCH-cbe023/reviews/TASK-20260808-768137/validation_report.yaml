      Three candidates -- rdet, lam1n, hkz -- pass G-NUM, G-INV and G-Q and FAIL
      G-REL. That is outcome R3, ADMISSIBLE BUT NOT RELEVANT. For rdet this is
      forced by algebra and was predicted in the prereg in advance; under the
      strict reading of R5 (the L11 budget cap) rdet is the only one of the
      three that may be cited, and R3 still holds.
    was_the_obstruction_ESTABLISHED: >-
      NO. R2 and R2' were never reached, because R3 fires before them in the
      frozen order. No "no admissible predicate exists at the declared scope"
      claim may be cited from this run in any form. The GEN-1/2/3 conditions
      were evaluated anyway and hold under the arm-level reading (GEN-2 fails
      under the strict reading), but they adjudicate nothing here.
    the_honest_one_line_reading: >-
      The obstruction is RELOCATED, not removed: the AM-4-invariant observables
      this run could exhibit are the ones that carry no beta-dependence or no
      block attribution, and the observables that carry block information are
      the ones AM-4 refuses. hkz is the sharpest new fact -- it is admissible at
      machine precision with verified-HKZ canonicality, and it still fails
      REL-2, the block-attribution clause, at every mirrored pair. That closes
      the cheap version of the prereg's repair (ii) and leaves both repairs open.
    section_B_plain_statement: >-
      The AM-3 gate CAN fire: 29 of 48 steps at a fixed c = 6, PRED-B1 met in
      every cell on the frozen full-table scoring. This is NOT a statement that
      it DID fire in BATCH-a44d08 (it did not), does NOT reinstate any withheld
      reading, does NOT retire AM-3, and is NOT a demonstration that the gate
      fires on a REAL violation -- only on an injected one. In d100_b30 half the
      firings sit on already-increasing steps and the cell fails PRED-B1 under
      the mandated exclusion.
    section_C_plain_statement: >-
      CONSISTENT, and it refutes nothing and validates nothing. The instrument
      was rebuilt, its two gates passed in opposite directions, and it did not
      separate the two families at any of 10 matched-V targets. Six of ten pairs
      have detection floors at or above tau_rel, for which the only honest
      reading is an upper bound at their own floor. BATCH-a44d08's Section C
      verdict remains VOID IN BOTH DIRECTIONS and was correctly neither cited
      nor used as a baseline.

