  # =====================================================================
  # 2. DEFECT D-2 -- WHICH PRODUCER DID WHAT, AND THE DISCLOSURE IS WRONG
  # =====================================================================
  defect_D2_adjudication:
    finding_id: F-1
    severity: material -- a FALSE statement in three committed artifacts and in
      the Coordinator receipt; changes no measurement
    what_the_record_claims: >-
      report_am7.md sec.0, run_manifest.yaml (3a5f18) git.recorded_defect, and
      snapshot-receipt.json open_for_the_reviews[4] all state that
      measure_am7.py resolves REPO_ROOT FIVE levels above batches/, landing in
      the ENCLOSING checkout, and that the recorded head_commit 111d04124 is
      "that checkout's HEAD, not this worktree's". measure_g3.py (Section B)
      inherited the claim into a source comment and into
      results_g3.json.prereg_verification.defect_D2_guard.
    what_I_measured:
      - check: path arithmetic of the COMMITTED measure_am7.py
        method: executed the committed file's own TASK_DIR/TASKS_DIR/BATCH_DIR/
          BATCHES_DIR chain and both the 4x'..' and 5x'..' candidates
        result: >-
          the committed script uses FOUR '..' and resolves to
          /Volumes/SSD990/.../crypto-autoresearcher-kb-adfc38 -- THIS worktree.
          The five-level path would be .../.claude/worktrees.
      - check: what HEAD does the five-level path actually report?
        command: git -C /Volumes/SSD990/crypto-autoresearcher/.claude/worktrees rev-parse HEAD
        result: d724be4c984e3435a143079cc29c209c5eda3934 (main), NOT 111d04124
      - check: is 111d04124 on main at all?
        command: git branch -a --contains 111d04124 ; git merge-base --is-ancestor 111d04124 d724be4c9
        result: >-
          contained ONLY by feat/crypto-autoresearcher-kb-adfc38 and its remote;
          NOT an ancestor of main. main cannot ever have reported it.
      - check: enclosing checkout's HEAD at AM-7's start time
        command: git -C /Volumes/SSD990/crypto-autoresearcher reflog --date=iso
        result: >-
          the enclosing checkout sat on codex/crypto-autoresearcher-plugin at
          6e490922d from 2026-08-08 16:45:57 -0700 until it moved to main at
          19:55:25 -0700. AM-7 started 01:38:42Z = 18:38:42 -0700, inside that
          window. It could not have read 111d04124 from there.
      - check: this worktree's HEAD at AM-7's start time
        command: git reflog --date=iso (this worktree)
        result: >-
          111d04124 committed 18:27:03 -0700; next commit 64fdf09aa at
          18:54:00 -0700. AM-7 started 18:38:42 -0700. This worktree's HEAD WAS
          111d04124 at that instant -- exactly what the run recorded.
      - check: recorded dirty paths
        result: >-
          results_am7.json.git.worktree_dirty_paths lists untracked
          BATCH-cbe023 producer directories, which exist only in this worktree
          and are invisible from the enclosing checkout. Corroborates the same
          conclusion.
    verdict: >-
      DEFECT D-2 AS RECORDED IS A MIS-DIAGNOSIS. Section C resolved its repo
      root to THIS worktree and made the required ancestry assertion HERE. The
      committed script is consistent with the recorded outputs, so this is a
      false DISCLOSURE, not a substituted artifact.
    which_producer_did_which:
      section_A_TASK-20260808-2a9085: >-
        resolves the root with `git rev-parse --show-toplevel` from the process
        CWD (not anchored to __file__). command.txt shows relative paths run
        from the worktree root, and its recorded head 111d04124 confirms the
        CWD was this worktree. Self-consistent (it hashes the prereg at the same
        root it asserts ancestry at) but it would not detect having read a
        different checkout entirely.
      section_B_TASK-20260808-cece0c: >-
        __file__-anchored FOUR-level REPO_ROOT **plus an explicit guard** that
        `git -C REPO_ROOT rev-parse --show-toplevel` equals REPO_ROOT, with
        git_common_dir recorded. This is the strongest of the three. It is also
        the one that inherited the false D-2 narrative into its own text.
      section_C_TASK-20260808-3a5f18: >-
        __file__-anchored FOUR-level REPO_ROOT, all git calls via `git -C
        REPO_ROOT`, but NO show-toplevel verification. Structurally correct;
        unverified in-band. It is the producer that recorded D-2 against itself.
    direction_of_the_error: >-
      AGAINST the producer's own interest -- it declares its git bookkeeping
      worse than it was. This is not concealment. But it is a false statement in
      an immutable record that propagated to two further artifacts and was
      repeated by the Coordinator without independent checking, which is the
      same failure mode a sibling validator recorded against the GOAL-MCE-001
      Coordinator's archive-scope diagnosis this session.
    required_action: >-
      A superseding correction record, not an edit. Section B's D2 guard remains
      a good practice regardless of the phantom it was built against.

