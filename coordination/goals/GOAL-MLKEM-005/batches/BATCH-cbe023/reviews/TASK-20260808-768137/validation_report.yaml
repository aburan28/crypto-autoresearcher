  findings_on_specific_claims:
    a_section_A_R3_classification:
      claim: >-
        all six diag-determined candidates fail G-INV (E_I 0.740, V 10.31,
        m3 88.95, D 1.099, W 1.379, OD 70.10 vs tau_inv 0.01); rdet/lam1n/hkz
        pass G-INV, G-NUM, G-Q and FAIL G-REL; R3 follows the frozen map applied
        in order
      verdict: CONFIRMED
      detail: >-
        Producer values are 0.7402074303569426, 10.308384120311045,
        88.95097211783316, 1.0990778616645653, 1.3793650793650793,
        70.09739227645926 -- the receipt's rounded quotations are faithful. My
        independent implementation reproduces the same order of magnitude on a
        subgrid (IND-1). Map order verified: R5 no (all ten pass G-NUM, max
        6.20e-11); R4 no (see (c)); R1 empty (no candidate passes BOTH G-REL
        clauses); R3 fires on rdet, lam1n, hkz; R2/R2' are exclusive of R3.
      one_audit_point_the_producer_had_already_raised: >-
        R5's text also fires on "a declared budget cap binds before that
        candidate's arm completes", and the X9/X10 arm at L11 DID hit its 300 s
        cap at 300.4 s. The producer reports BOTH readings in report_am4.md 1.1:
        arm-level (headline, R3 = {rdet, lam1n, hkz}) and strict (R3 = {rdet}
        alone, GEN-2 fails). The headline R3 is robust either way because rdet's
        arm completed in full and reaches R3 by itself. I confirm this is the
        correct handling and that the strict reading changes nothing that is
        cited, since R2/R2' were never reached.
      what_R3_actually_carries: >-
        For X8 = rdet, R3 is FORCED by algebra given the frozen thresholds:
        G-INV holds because det is a unimodular/orthogonal invariant, G-Q is the
        closed form q^{(d-k)/d} vs 1 = 0.9969 (I re-derived it bit-exactly), and
        G-REL1 is exactly 0 because rdet has no beta dependence at all. The
        prereg predicted R3 for X8 and X9 in advance. The informative content of
        Section A is therefore NOT the R3 headline but (i) the six G-INV
        refusals, (ii) the D collision separation, and (iii) hkz being
        admissible yet failing REL-2 at every mirrored pair.
    b_section_A_controls:
      claim: >-
        TRIV refused by G-Q at 3.55e-16; rdet/lam1n pass G-INV at 2.5e-13 /
        7.2e-15; these two clauses are what make the six refusals meaningful
      verdict: CONFIRMED, and checked hardest
      detail: see control_checks CC-A1, CC-A2, CC-A3 and FV-1, FV-3, FV-8.
        TRIV's G-Q refusal is forced by tr(P^2) = beta. rdet's G-INV pass is
        forced by determinant invariance and is the half the frozen clause rests
        on; I verified no NaN entered it despite the slogdet warnings and that
        its logabsdet is correct to 6.758e-15. lam1n's 7.150430661174418e-15
        rounds to the quoted 7.2e-15.
      residual_caveat: >-
        rdet does not traverse the QR path, so it is not by itself a control for
        the mechanism that could manufacture a false non-invariance. T0 covers
        that path per candidate at <= 6.20e-11. Reported as a pair, the two
        controls do cover both directions; neither alone would.
    c_AM4_OBS_1_premise_and_R4:
      claim: >-
        AM4-OBS-1's premise is REFUTED for D (identical diagonals, D separated
        15.8% of scale at L3, 7.5x floor) while R4 did NOT fire because prereg
        2.7 excludes X4 from the trigger list -- is that reconciliation correct?
      verdict: THE RECONCILIATION IS CORRECT. R4 should NOT have fired.
      detail: >-
        Both prereg 2.4 and prereg 2.7 restrict R4's premise clause to
        X1, X2, X3, X5, and its measured-conclusion clause to X1..X5 passing
        G-INV at every replicate. coll = 0 for X1, X2, X3, X5, so the premise
        clause has no trigger; the minimum G-INV maxima over X1..X5 are 0.740,
        0.987, 1.04, 1.10, 1.12, all far above tau_inv, so the
        measured-conclusion clause has no trigger either. The producer applied
        the frozen text exactly and reported the D result separately.
      arithmetic_check: 0.1583725534036054 / 0.02113695528562117 = 7.493, so
        "7.5x floor" is faithful; at L4 the separation is 0.03447 against a
        0.02674 floor, only 1.29x, and the receipt quotes only the L3 figure
        while the report gives both.
      would_it_have_changed_the_headline: NO -- prereg 2.7 says R4 is "reported
        first, then the remaining rows are evaluated on the rest", so R3 would
        still be the outcome for rdet/lam1n/hkz.
      but_see: finding F-4 -- the R4 premise clause could not have fired for any
        candidate it lists, under any collision probe.
    d_six_exact_zeros_disclosure:
      claim: the six exact zeros are ARITHMETIC not corroboration, since those
        six are manifest closed-form functions of diag(P)
      verdict: THE DISCLOSURE IS COMPLETE. It neither understates nor overstates.
      detail: >-
        report_am4.md lines 340-346 states it explicitly and correctly, and
        snapshot-receipt.json repeats it. I verified the algebra independently:
        E_I, V, m3 and W are explicit sums over diag(P); TRIV = tr(P^2) = tr(P)
        = beta identically; and OD = beta - V - beta^2/d by the projector
        identity, which I confirmed to 2.84e-14 on my own frames. Since the
        probe fixes diag(P2) = diag(P1) exactly, coll = 0 is forced for all six.
        My own rebuild of the probe (FV-9) returns the same six zeros and the
        same 0.433013 off-diagonal separation.
      one_thing_the_disclosure_stops_short_of: it is stated about the CANDIDATES
        ("the only one on which the premise had content was X4") rather than
        about the R4 TRIGGER. Stated about the trigger it is stronger -- see F-4.
    e_G_RANK_not_adjudicated:
      claim: G-RANK is NOT ADJUDICATED because A = A1 @ A2 mod q forces rank
        over F_q but not over R
      verdict: CONFIRMED INDEPENDENTLY (FV-5)
      detail: >-
        I built the rank-r factors myself and measured rank_R(A) = min(k, d-k)
        = 30 / 40 at EVERY rung r in {1,5,10,20,k}, while rank_Fq(A) = r
        exactly. The GSO frame from QR(B^T) is computed over R, so the rank
        ladder does not vary the quantity G-RANK's departure index is meant to
        track; min(rank(A_S), beta) and min(k, beta) coincide at every rung and
        the criterion cannot discriminate. NOT ADJUDICATED is right.
      stale_field_correctly_superseded: >-
        results_am4.json still carries the script's mechanical verdict "REFUSED
        as a block-content adjudicator -- b* tracks rank(A_S)" for E_I at L4
        (b* = 28 at r=1 vs 41 elsewhere). report_am4.md 8.2 explicitly supersedes
        it and explains that with rank_R(A) constant the difference is a
        different random draw of A (the rank-variant seed includes r), not a
        rank effect. My measurement supports the report's reading over the JSON
        field. The immutable JSON was correctly left unaltered.
    f_HKZ_repair_and_verification:
      claim: >-
        the HKZ reducer was REPAIRED because fpylll's svp_call discards
        improvements below lll_delta; unrepaired, hkz showed a spurious 1.7e-2
        T3 residual and would have been refused as an artifact; 1530/1530
        reductions verified HKZ
      verdict: CONFIRMED, by an independent re-run through a different code path
      detail: >-
        FV-7: with one BKZ pass at block_size = d and no explicit sweep I
        measured HKZ violations of 7.5500e-03 at L9 (d=30) and 3.0205e-03 at
        L10, and 0.0 at d = 20 -- reproducing the producer's "up to 7.6e-3 at
        d = 30". With the sweep added my violation is 0.0 at all four lattices.
        FV-6: lambda_1^2 reproduces bit-exactly at L7/L8/L9/L10 (123237.0,
        218.0, 167027.0, 290.0) through the BASIS GSO path, where the producer
        used the integer Gram path -- two different fpylll entry points agreeing
        exactly.
      what_the_verification_does_and_does_not_establish: >-
        The producer's verifier re-enumerates every index i over the projected
        block [i,d) with radius r_i*(1+1e-7) and reports max_i (r_i - min)/r_i.
        That is a genuine independent check that r_i = lambda_1(pi_i(L))^2, and
        it returned 0.0 at 1530/1530. It uses fpylll's own Enumeration on the
        same GSO, so a systematic fault in fpylll's enumerator would not be
        caught by it -- but my independent reproduction through a different
        entry point removes most of that residual. The 1.7e-2 unrepaired T3
        residual is a producer-only counterfactual (the unrepaired run is not
        an artifact of this batch); I did not attempt to reproduce it and it is
        not load-bearing on any reported number.
    g_section_B_counts_and_PRED_B1_scoring:
      claim: >-
        c_min(i) > c_pos(i) at 48/48, min margin 1.8608, post-injection Delta
        strictly positive at c_min; n_fire(c=6) = 6/7/9/7; excluding
        already-increasing steps 3/5/7/5, and d100_b30's 3 is BELOW PRED-B1's
        threshold of 4
      verdict: BOTH COUNTS CONFIRMED, bit-exactly, twice
      detail: >-
        FV-B1/FV-B2: all 48 c_min and c_pos re-derived from the raw
        (Delta_i, SE_step, SE_diff) with max deviation 0.000e+00; fires(c) and
        the post-injection Delta reproduced at all 48 x 11 grid cells;
        min margin 1.8607641914511006; min post-injection Delta at c_min
        0.0024147884953880493 > 0. FV-B3: the same 48 c_min re-derived from the
