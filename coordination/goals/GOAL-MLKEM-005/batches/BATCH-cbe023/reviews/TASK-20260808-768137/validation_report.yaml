  # =====================================================================
  # 9. THE ARRANGEMENT IN WHICH MY OWN CHECK COULD NOT FAIL -- BOTH DIRECTIONS
  # =====================================================================
  my_own_could_not_fail_arrangement:
    direction_1_my_check_could_not_FAIL:
      form: >-
        A validation that only re-runs the producer's own arithmetic on the
        producer's own numbers agrees by construction. Recomputing SE from a
        JSON's own mean squares, or c_min from a JSON's own c_min inputs, tests
        transcription and nothing else. Every such check passes whatever the
        producer did upstream.
      why_I_am_not_in_it:
        - >-
            Section A's decisive residuals were regenerated FROM SCRATCH: my own
            basis construction, my own QR path, my own Haar generator, my own seed
            (20260808). No producer number entered IND-1 or IND-2, and they
            reproduce the refusals and PRED-A1 independently.
        - The HKZ repair was re-tested through a DIFFERENT fpylll entry point
          (basis GSO rather than the integer Gram matrix), reproducing
          lambda_1^2 bit-exactly at four lattices and the 7.55e-3 pre-repair
          violation at d = 30.
        - Section B's 48 c_min were re-derived from a DIFFERENT COMMITTED
          SNAPSHOT (BATCH-a44d08 at 770009042), not from this batch's JSON.
        - Section C's calibration was re-tested with a null I BUILT MYSELF from
          the prereg text, with my own seeds, my own pool bank, my own u and my
          own order-statistic path -- the same TL vs TL' construction that
          decided BATCH-a44d08.
        - Every closed-form constant (E[V]_haar, rdet, TL reachable intervals,
          Wilson endpoints, Student-t criticals, alpha_pair) was recomputed from
          its definition, never read from the record.
        - The notarization chain was checked with git plumbing run by me in this
          worktree, in both directions, including the negative test that the
          prereg is ABSENT at the notarizing commit's parent.
      residue_I_cannot_close: >-
        Off-repository pre-computation before the freeze. Nothing in the git
        record can exclude it; prereg 0.1's declaration is what answers it, and
        it is closed by harness structure rather than by cryptography.
    direction_2_my_check_could_not_PASS:
      form: >-
        The mirror, and the live one here. A validator that has just returned
        `failed` on a sibling batch, and is briefed that a sibling broke 5/5 of
        that batch's audit commands and corrected its Coordinator, has a
        standing incentive to find a fatal defect. Applied that way, `failed`
        is a property of the reviewer, not of the receipt, and any batch fails.
      why_I_am_not_in_it:
        - >-
            I fixed in advance what would force `failed`: (i) a broken notarization
            chain in either direction, (ii) any producer number failing to reproduce
            under independent re-derivation, (iii) a frozen control not behaving as
            its clause required, (iv) an artifact hash mismatch or a scope-exceeding
            snapshot commit.
        - >-
            Every one of those four checks PASSED, each with its number recorded
            above, and I report them as passes rather than looking past them: 18/18
            hashes, 19/19 commit scope, 48/48 c_min at deviation 0.0, 10/10 SE
            decompositions, both directions of the chain.
        - >-
            The one material defect I found (F-1) makes the record MORE sound than
            it claimed, not less. A could-not-pass arrangement cannot produce that
            result: it was found by testing a claim the producer made AGAINST its
            own interest, which is the opposite of adversarial cherry-picking.
        - F-2, F-3 and F-4 are reading and CONTRACT defects that leave every
          computed number standing; I say so explicitly rather than converting
          them into an integrity failure.
      residue_I_cannot_close: >-
        I chose which quantities to rebuild from scratch and which to
        re-derive from the record. A different choice tests a different
        proposition. In particular I did not independently regenerate the 10
        Section C target D-tables at the producer's u values, so the CONSISTENT
        verdict rests on one run's TL arm (see claim (i)).

