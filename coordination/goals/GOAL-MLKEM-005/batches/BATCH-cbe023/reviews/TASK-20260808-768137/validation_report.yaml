      measured: 7.11e-15 / 1.78e-15 (N-A); 5.33e-15 / 1.78e-15 (N-B)
      independently_verified: >-
        YES structurally -- V_TL and m3_TL depend on u alone and not on the
        support or the pairing, which I re-derived in closed form, so the two
        sides are equal in distribution and the true effect is exactly zero
      result: PASS
    - id: CC-C4
      control: N-C, the Gaussian instrument check (PRED-C3)
      measured: 0 falsifying of 120
      producer_disclosure_confirmed: >-
        N-C's relative-difference condition is degenerate by construction (both
        D values sit at the sampling floor, so M is tiny and the median relative
        difference is 100-102%); the criterion there is carried entirely by
        condition (i). The producer states this. N-C is therefore a check on
