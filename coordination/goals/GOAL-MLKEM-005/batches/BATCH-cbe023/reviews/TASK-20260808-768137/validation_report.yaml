        n_fire(c=6) = 6/7/9/7 from that record alone. Excluding the 9
        already-increasing steps: 3/5/7/5, and 9 of 48 matches the committed 9.
      is_scoring_PRED_B1_on_the_full_table_right: >-
        PROCEDURALLY YES, and it is the only defensible choice. Prereg 3.5
        freezes the threshold as a count out of 12 and 3.8 Form 3 says in terms
