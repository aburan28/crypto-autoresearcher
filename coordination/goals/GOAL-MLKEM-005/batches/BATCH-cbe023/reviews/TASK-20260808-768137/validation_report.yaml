      one_framing_correction: >-
        "c_min(i) > c_pos(i) at 48/48" is an ALGEBRAIC IDENTITY verified
        numerically, not an empirical finding: c_min - c_pos = 1 +
        t_crit*SE_step/SE_diff >= 1 whenever SE_diff > 0. The prereg says as
        much ("a violation is an implementation error, not a finding") and the
        producer repeats it. It must not be cited as evidence about the gate.
