  # 10. WAS AN ADMISSIBLE OBSERVABLE EXHIBITED, OR THE OBSTRUCTION ESTABLISHED?
  # =====================================================================
  plain_statement_required_by_the_completion_gate:
    was_an_admissible_observable_exhibited: >-
      NO. Admissible under the frozen contract means passing G-NUM, G-INV, G-Q
      AND BOTH clauses of G-REL. No candidate did. R1 is empty.
