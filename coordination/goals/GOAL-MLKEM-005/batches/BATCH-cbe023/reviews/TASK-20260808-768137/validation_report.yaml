  # =====================================================================
  # 6. CONTROL CHECKS AGAINST THE FROZEN CONTRACT
  # =====================================================================
  control_checks:
    - id: CC-A1
      control: X7 = TRIV, the LAXITY control -- must PASS G-INV and must FAIL G-Q
      frozen_consequence: if TRIV PASSES G-Q the gate is INADMISSIBLE and no
        admissibility claim may be reported (prereg 2.10 Form 1)
      measured: G-INV 1.3026616822268502e-15 (pass); G-Q 3.552713678800501e-16
        against tau_q = 0.10 -> REFUSED
      independently_verified: >-
        YES, and it is FORCED: tr(P^2) = tr(P) = beta for any rank-beta
        projector, so |X(q=3329) - X(q=1)| is identically 0. The clause behaved,
        and it could not have done otherwise.
      result: PASS
    - id: CC-A2
      control: X8 = rdet and X9 = lam1n, the POSITIVE controls -- exact
        invariants that MUST pass G-INV
      frozen_consequence: if rdet FAILS G-INV the gate is INSTRUMENT-LIMITED and
        NO REFUSAL OF ANY CANDIDATE MAY BE REPORTED (prereg 2.10(b))
      measured: rdet 2.514254164288223e-13 (T1 2.51e-13, T2 0.0, T3 9.73e-16);
        lam1n 7.150430661174418e-15; both far under tau_inv = 0.01
      independently_verified: >-
        YES for rdet, and it is the load-bearing half. det(BH) = +-det(B),
        det(Pi B) = +-det(B), det(UB) = +-det(B) exactly, so rdet's invariance
        is algebra; I confirmed the residual is float noise only and that the
        slogdet RuntimeWarnings do NOT produce NaN (FV-8).
      caveat_recorded_by_the_producer_and_confirmed_by_me: >-
        lam1n and hkz go through the integer Gram matrix, which an ambient
        isometry preserves EXACTLY, so their T0/T1 residuals measure only
        Gram-formation noise and are a WEAK test of T1. Their T2/T3 residuals
        are genuine. rdet does NOT share this weakness -- it goes through the
        float64 BH product -- so the frozen clause rests on the strong control.
      the_QR_path_is_separately_controlled: >-
        rdet does not exercise the QR/GSO path where a spurious residual would
        live. That path is controlled per candidate by T0, the mathematically
        identity round trip, whose maximum over all ten candidates is 6.20e-11
        against tau_num = 1e-6. The pair (rdet, T0) covers both.
      result: PASS
    - id: CC-A3
      control: T0, the numerical round trip B -> B H H^T, required for every
        candidate (G-NUM)
      measured: max rho_T0 = 6.20e-11 (D), 6.54e-12 (m3), 6.66e-16 (E_I);
        all under tau_num = 1e-6
      result: PASS -- the noise floor is 4 to 10 orders below tau_inv, so the
        six refusals cannot be manufactured by float noise
    - id: CC-B1
      control: NC-B1, c = 0 -- the un-injected family must return 0 of 48
      measured: 0 of 48; max AM-3 statistic -0.19342160540508713, abs deviation
        0.0 from the committed value
      independently_verified: YES -- my 48-step recomputation reproduces
        fires(c=0) = false at every step
      result: PASS
    - id: CC-B2
      control: NC-B2, c = -6 -- a reinforced decrease must return 0 of 48
      measured: 0 of 48; max statistic -8.211428539209706
      independently_verified: YES
      result: PASS
    - id: CC-B3
      control: NC-B3 -- every step with Delta_i > 0 flagged, n_fire reported
        with and without them
      measured: 9 of 48 flagged (matches the committed 9); n_fire(c=6) 29 with,
        20 without
      independently_verified: YES, 9/48 and both counts reproduced exactly
      result: PASS
    - id: CC-B4
      control: reproduction floor -- 448 per-draw r values regenerated from the
        carried seeds with NO new BKZ/LLL
      measured: >-
        0.0 against BATCH-a44d08's committed record; 2.220446049250313e-16
        against BATCH-f19c37's, confined to d = 140 -- the exact one-ULP
        deviation declared IN ADVANCE by prereg 3.5, and explicitly NOT rounded
        to 0.0. c_min reproduction 0.0 in c units on both legs.
      result: PASS -- and the declared-in-advance non-zero deviation is the
        strongest single sign that this reproduction was not smoothed
    - id: CC-C1
      control: G-CAL -- Wilson 95% upper bound <= 0.040 for BOTH N-A and N-B in
        BOTH null cells
      measured: 0 of 300 in all four units; Wilson upper 0.012642971224546036
        in each; R_min = 200 cleared everywhere, so no unit is UNDECIDED
      independently_verified: >-
        Wilson bound recomputed by me to 1 ulp; rate corroborated by my own
        independently constructed null (IND-3, 0 of 30)
      result: PASS, with the power caveat in F-3
    - id: CC-C2
      control: the delta = 0.50 admissibility clause -- the criterion must fire
        at a 50% relative offset at EVERY target or the instrument is declared
        UNDERPOWERED BY CONSTRUCTION
      measured: fires at delta = 0.50 at all 10 targets; largest delta_min is
        0.4242 (d100_b30 unreduced), so the clause passes with 0.076 to spare
        at its tightest target
      independently_verified: YES -- delta_min = max(floor, tau_rel) - realized
        relative difference recomputed from my own SE and floor at every target
      result: PASS
    - id: CC-C3
      control: N-A / N-B exactness (|V - V''| and |m3 - m3''| <= 1e-12) and the
