    clauses behaved: the laxity control was refused by G-Q and the positive
    control passed G-INV, so the six refusals are not instrument artifacts, and
    I confirmed both are forced rather than fortunate. All eight controls across
    the three sections behaved as their clauses required, and my own
    independently constructed TL vs TL' null corroborates the G-CAL rate.
    The four defects I found are a false DISCLOSURE (F-1), a headline
    qualification (F-2), two frozen-contract design defects (F-3, F-4), and
    artifact-policy gaps (F-5, F-6). None is a fabrication, a hash mismatch, a
    control failure, a scope violation, or a broken chain, and none changes a
    computed number. The receipt is admissible evidence with the corrections and
    qualifications recorded above attached to it.
  what_this_verdict_does_not_mean:
