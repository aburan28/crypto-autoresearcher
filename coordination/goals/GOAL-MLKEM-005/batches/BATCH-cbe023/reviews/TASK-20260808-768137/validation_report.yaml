  # =====================================================================
  # 8. FINDINGS
  # =====================================================================
  findings:
    - id: F-1
      severity: material
      title: Defect D-2 as recorded is a MIS-DIAGNOSIS, and it propagated
      detail: see defect_D2_adjudication above. The AM-7 run DID resolve its
        repo root to this worktree and DID make the ancestry assertion here.
      affected_artifacts:
        - tasks/TASK-20260808-3a5f18/report_am7.md (section 0)
        - tasks/TASK-20260808-3a5f18/run_manifest.yaml (git.recorded_defect)
        - tasks/TASK-20260808-cece0c/measure_g3.py (source comment)
        - tasks/TASK-20260808-cece0c/results_g3.json (prereg_verification.defect_D2_guard)
        - archives/TASK-20260808-a6a336/snapshot-receipt.json (open_for_the_reviews[4])
      effect_on_evidence: NONE. No measurement, seed, threshold or verdict
        depends on it. The notarization chain holds independently.
      required_action: a superseding correction record. Do not edit the
        immutable artifacts.
      note_on_the_coordinator: >-
        The receipt asserts the diagnosis as established fact, and adds
        "the fix propagated within the batch". Neither half survives checking.
        This is the same class of error a sibling validator recorded against
        the GOAL-MCE-001 Coordinator's archive-scope diagnosis in this session:
        a Coordinator claim about the git record, repeated rather than verified.
    - id: F-2
      severity: material
      title: the family-level upper bound "3.91 percent relative" is taken at
        the ONE target where the rebuilt SE degenerated to residual-only
      detail: >-
        The tightest detection floor, 3.91%, occurs at d100_b40 / graded_t0.0025
        -- the single target flagged NEGATIVE-VARIANCE-COMPONENT, where
        MS_S + MS_P - MS_res <= 0 and the frozen degenerate branch replaces the
        two-way estimate with MS_res/(S*E) and nu_eff with the residual df 21.
        That substitute estimator is precisely the residual-only variance model
        AM-7 exists to replace. The report discloses the flag (section 2 table)
        and discloses the nu_eff = 21 completion (implementation_completions),
        but it does not connect either to the headline, and report_am7.md 8 and
        the Coordinator receipt both quote "3.91 percent relative" as the
        family-level upper bound with no such qualification.
      quantification: >-
        The second-tightest floor, at a NON-degenerate target, is 10.83%
        (d100_b30 / graded_t0.0025). A family-level upper bound stated only over
        targets whose two-way SE is well defined is therefore ~10.8%, not 3.91%.
      required_action: >-
        Any downstream citation of the upper bound should carry the qualifier,
        or use the 10.83% figure. This is a reading correction, not a
        computational error -- every number reproduces.
    - id: F-3
      severity: material (contract, not producer)
      title: tau_rel = 0.15's stated justification does not hold against the
        instrument it now governs
      detail: >-
        The prereg sets tau_rel = 0.15 as "1.67x the top of the measured null
        median range 8.4-9.0%", from two nulls built against the SUPERSEDED
        instrument. The rebuilt null's median relative difference is 0.65%
        (producer N-A) and 1.39% (my own independent null), with p95 at 2.3% and
        2.7%. So tau_rel now sits 17x-23x above the null's median and 5.5x-6.5x
        above its p95, not 1.67x above its median.
      consequence_measured: >-
        The nearest approach to falsification -- d140_b40 / graded_t0.0050 with
        |t| = 4.529 against |t|crit = 5.118 and relative difference 14.12%
        against tau_rel = 15% -- is roughly 5x the rebuilt null's p95 relative
        difference, yet it is recorded as NEITHER falsifying NOR suggestive,
        because the frozen SUGGESTIVE band additionally requires relative
        difference ABOVE tau_rel. The contract's "so a near miss is on the
        record rather than discarded" clause therefore does not capture the one
        near miss the run produced. The producer records it in prose anyway,
        which is the right call.
      why_the_prereg_guard_did_not_catch_it: >-
        Section C's Form-1 guard against "the falsifier could not FIRE" is the
        delta = 0.50 positive control. A 50% injected offset is more than 3x
        tau_rel, so that control is insensitive to tau_rel being set an order of
        magnitude above the instrument's own noise. G-CAL and the delta = 0.50
        clause do point in opposite directions as designed, but the gap between
        them is wide enough that both can pass while the criterion is far less
        sensitive than either implies.
      required_action: a successor amendment should re-derive tau_rel from the
        REBUILT null's measured distribution, and should widen the SUGGESTIVE
        band so a pair inside 0.8*|t|crit is recorded regardless of tau_rel.
    - id: F-4
      severity: material (contract, not producer)
      title: R4's premise clause could not have fired for any candidate it lists
      detail: >-
        R4's premise clause triggers on coll > tau_inv for X1, X2, X3 or X5.
        Every one of those four is a manifest closed-form function of diag(P)
        (E_I, V, m3 and W are explicit sums over the diagonal), and the frozen
        probe fixes diag(P2) = diag(P1) EXACTLY. So coll = 0 is forced by
        algebra for all four, and no collision probe of this design could ever
        fire that clause. The one frozen candidate on which the premise has
        testable content, X4 = D, is the one the clause excludes.
      consequence: >-
        prereg 2.10 Form 4 claims a guard against "AM4-OBS-1 could not be
        refuted" by naming two refutation events. One of those two is dead by
        construction. The guard is half-effective; only the second event (a
        carried observable passing G-INV at every replicate) remained live, and
        it did not fire.
      what_the_run_did_right: >-
        The producer names the underlying fact plainly ("their coll = 0 is
        arithmetic, not discovery ... so that a reader does not read six exact
        zeros as six independent corroborations") and reports D's separation
        with both cells and both floors. The defect is in the frozen map, not in
        the execution.
      required_action: >-
        A successor R4 clause should trigger on ANY candidate whose collision
        residual exceeds its own measured floor, X4 included, with the floor
        reported per candidate.
    - id: F-5
      severity: minor (artifact policy)
      title: Section C retains no durable stdout/stderr and its recorded exact
        command is not executable as written
      detail: >-
        AGENTS.md's artifact policy requires each run to retain stdout and
        stderr and the exact command. TASK-20260808-3a5f18 carries neither a
        command.txt nor stdout.log nor stderr.log; its manifest states the logs
        went to a session scratchpad and are "NOT durable" (stderr empty).
        Separately, the manifest's `command:` uses a YAML folded scalar (>-),
        so the long path is joined with a space and parses as
        ".../tasks/ TASK-20260808-3a5f18/measure_am7.py" -- not runnable. The
        same folding corrupts artifacts.write_scope. report_am7.md gives a third,
        abbreviated form. Sections A and B do this correctly.
      effect_on_evidence: >-
        LIMITED. exit_code 0, invocation_cwd, wall/cpu/RSS, environment, seeds
        and the full observation set are recorded in results_am7.json, and the
        producer states every stdout line is also in the JSON. But the run
        package is one artifact class short of the policy and its command cannot
        be copy-pasted, so reproduction requires reconstruction.
      required_action: successors must emit command.txt/stdout.log/stderr.log as
        durable artifacts and must not put paths in folded YAML scalars.
    - id: F-6
      severity: minor
      title: three small record defects, two already disclosed
      items:
