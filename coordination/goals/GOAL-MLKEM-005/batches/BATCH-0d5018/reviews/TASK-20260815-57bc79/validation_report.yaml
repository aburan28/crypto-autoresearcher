  - id: F-2
    severity: informational, in the producer's favour
    kind: under-reported positive observation
    finding: >-
      THE PRODUCER UNDERSTATES WHAT ITS OWN RECALIBRATION ACHIEVED, and the
      evidence is in the committed tracebacks. writeup.md lines 130-141
      describes the beta=55 phase (b) failure as "the SAME failure signature
      ... and the same pattern KN-FIND-f54a82 already names". The error STRING
      is the same; the FAILURE SITE is not. From
      BATCH-279acb/TASK-20260815-6e4c02's own committed main_grid file, at the
      BORROWED 69 bits both beta=55 and beta=70 died at fpylll bkz.py line 123
      -- the first, full-range self.lll_obj() call inside BKZReduction.__call__,
      BEFORE ANY TOUR BEGINS -- after 389.4 s and 396.4 s, essentially just the
      outer LLL time. At the OWN-BISECTED 75 bits, beta=55 dies at bkz.py line
      186, inside a DOUBLY-NESTED svp_preprocessing (tour -> svp_reduction ->
      svp_preprocessing -> tour -> svp_reduction -> svp_preprocessing), on a
      RANGE-RESTRICTED lll_obj(lll_start, lll_start, kappa + block_size), after
      2502.74 s of which only 413.63 s was the outer LLL. So roughly 2089 s of
      genuine BKZ work happened before failing, where previously there was
      none. The same "correct calibration moves the failure deeper" pattern
      already appears at beta=40 in the prior batch (bkz.py:186 after 631.7 s),
      so this is its third instance.
      INDEPENDENTLY CONFIRMED BY THIS VALIDATOR, not merely read off the
      producer's file: valprobe2b re-ran the cell on a different OS and Python
      and obtained the SAME nine frames in the same order, ending at bkz.py:186,
      with 1104.40 s of BKZ work before the failure. So the deeper failure site
      is a reproducible property of the computation at 75 bits and not an
      artifact of the producer's host.
    consequence_for_this_verdict: >-
      None adverse. Recorded under AGENTS.md rule 8 because it is a real,
      checkable observation that the record currently flattens into "same as
      before", and because it is the concrete answer to the uncertainty this
      batch was opened to reduce: the per-basis recalibration measurably DID
      something, converting an immediate entry-point failure into roughly
      35 minutes of genuine BKZ progress before a deeper one. That is a
      narrower and better-supported statement than either "it worked" or "same
      as before", and it is available to a later Coordinator without any
      further compute.
  - id: F-3
    severity: moderate
    kind: interpretation bound established by a validator-run control
    finding: >-
      THE 75-VS-73 DIFFERENCE CANNOT BE ATTRIBUTED TO beta. Both minima rest on
      a single lattice draw (draw_index 0 in the seed formula), so the reported
      difference carries no variance estimate. This validator ran the matching
      null object -- SAME cell (d=512, beta=55), same construction, same
      SEED_ROOT, same stage and arm indices, ONLY the formula's free draw_index
      moved 0 -> 1 (seed 724982883) -- and measured a threshold of 71 BITS,
      monotone over all nine points 69-77. Against the producer's 75 at the
      same cell, that is a FOUR-BIT within-cell, draw-to-draw effect, TWICE the
      two-bit cross-beta gap. At (d=512, beta=70), draw 1 (seed 312532458)
      gives 69 ERROR and 73 COMPLETED, so that cell's threshold stays in
      (69,73] across the draw change -- variability is real and asymmetric
      between the two cells.
    consequence_for_this_verdict: >-
      Does not change it, and contradicts nothing the producer wrote. The
      producer never claims beta-dependence; its wording is "each BASIS has its
      own ... minimum", which is literally what was measured. The control
      POSITIVELY REINFORCES the batch's central design choice -- if thresholds
      move per draw, then borrowing one basis's precision for another is
      unsound, which is exactly the defect BATCH-279acb had and this batch
      fixed. What the control forbids is a downstream record turning
      "75 at beta=55, 73 at beta=70" into a statement about beta or about the
      (d, beta) cell. Any such record would be unsupported by this run.
  - id: F-4
    severity: moderate
    kind: confounded observation, correctly unexplained but incompletely framed
    finding: >-
      THE ERROR-VERSUS-TIMEOUT ASYMMETRY IS CONFOUNDED WITH BLOCK-SIZE COST,
      and the confound is not named where the asymmetry is advertised. beta=70
      blocks are far more expensive to enumerate than beta=55 blocks, so
      "raised nothing within 14400 s" at beta=70 is fully consistent with the
      reduction simply not having REACHED the failing kappa window yet, rather
      than being in a qualitatively different regime. writeup.md lines 158-161
      handles this correctly and says "No conclusion is drawn about WHY". But
      the snapshot receipt's own `note` and the snapshot commit message both
      present it as "a new, disclosed asymmetric observation" and as the first
      cell "to exceed PER_BASIS_FEASIBILITY_CAP_V3 ... rather than raising that
      ReductionError signature" WITHOUT naming the block-size confound -- and
      those two texts are what a later reader meets first.
    consequence_for_this_verdict: >-
      Does not change it; nothing is asserted that is false. Recorded so that
      the confound travels with the observation wherever it is quoted.
