  verdict: passed
  verdict_rationale: >-
    TASK-20260815-f14d3c's receipt is ADMISSIBLE EVIDENCE for exactly what it
    records, and every item of this task's own completion gate is discharged.

    The notarization chain holds in both directions under first-hand git
    plumbing -- the dispatcher's prior assertion was not accepted and was
    independently reproduced: 12 of 12 declared digests recompute from the
    snapshot commit's own blobs, the commit's changed set equals the receipt's
    declared set with both symmetric differences EMPTY, the commit is an
    ancestor of a freshly fetched origin/main, its parent is as declared, and
    the working tree is byte-identical to the committed blobs, so every figure
    quoted here was read as committed content.

    The two bisections are genuine and genuinely SEPARATE. Each ran seven
    trials, five of them interior, so neither is remotely a 2-point bracket;
    each replays deterministically from its own raw statuses to its own
    recorded probe ORDER and its own reported minimum; the two probe sequences
    diverge at the sixth trial; the minima are distinct (75 and 73), so no
    precision was reused across bases; and neither used the disclosed fallback.
    Both window endpoints were re-confirmed as real trials with real wall clock
    and correct seeds, and the endpoint_reproduction_ok predicate recomputes
    true at both bases.

    Construction and seed fidelity are exact. Under AST-normalized comparison
    the producer's worker_bisect is IDENTICAL to both validated references and
    its worker_main_cell is IDENTICAL to its reference; ROW_EXPO appears only
    in prose; set_precision precedes GSO.Mat at both sites; SEED_ROOT is
    715923; and all three seeds recompute exactly in a fresh process on a
    different host with a different numpy. The gate declares any drift a
    CRITICAL FINDING -- there is none, so none is raised.

    PER_BASIS_FEASIBILITY_CAP_V3 = 14400 s is applied EXACTLY at each cell:
    present in source, propagated to both cells, recorded on both cell records,
    independently echoed in stdout, enforced to within 0.084 s at the cell that
    hit it, and not reduced by the script's own budget guard, which this
    validator re-evaluated from the recorded elapsed times and confirmed did
    not fire.

    Scope discipline holds completely: (d=512, beta=40) was not re-attempted
    and (d=256, *) was not touched, every textual mention of either being a
    negative scope declaration; H-MLKEM-7d9bcc stays `proposed`;
    EXP-MLKEM-42ea04 stays `review_required` / `approved_by: null`;
    certificate.kind is none and nothing above TOY is asserted anywhere.

    And the receipt survives independent RE-EXECUTION, not merely re-reading.
    On a different host, OS, Python and numpy, 8 of 8 producer-reported
    isolated-step trial outcomes reproduced with matching seeds and 0
    disagreements, and the (d=512, beta=55) full-tour re-attempt reproduced to
    the same terminal error at the same nine-frame failure path.

    WHAT `passed` DOES NOT MEAN, stated because it is easy to over-read. It
    means the receipt is admissible evidence. It does NOT support an ECDLP
    claim, does NOT demonstrate a speedup -- none is claimed, and 0 of 2 cells
    completed -- and does NOT authorize promotion of anything. It makes no
    statement about ML-KEM security, no C1/C2 statement, and no recommendation
    on Stage-1 sizing or on whether DEC-20260814-4ac30a's escalation branches
    are ripe; those are the Coordinator's to decide on this batch's record.

    The verdict is `passed` rather than `incomplete` because every gate item is
    discharged and no required check is missing. The gaps that exist are
    scope-and-interpretation bounds, not absent evidence: the deleted
    first-attempt artifacts (F-1) bear on ONE unverifiable sentence that nothing
    relies on and that this review has now replaced with real replication; the
    timed-out cell's missing in-worker record (F-5) is inherent to a hard kill
    rather than an omission; and the draw-variation control (F-3) narrows how
    two reported numbers may be generalized without contradicting anything the
    producer wrote. Each is recorded in `limitations` so it travels with the
    evidence.

