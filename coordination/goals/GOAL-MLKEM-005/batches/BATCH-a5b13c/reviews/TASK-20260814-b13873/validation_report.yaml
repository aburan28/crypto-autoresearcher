      result: >-
        Kyber512: beta(best)=max(404,404)=404 >= beta(key-side)=389 ->
        CLOSED. Kyber768: beta(best)=633 >= 606 -> CLOSED. Kyber1024:
        beta(best)=max(872,872,617)=872 >= 855 -> CLOSED. All three agree
        CLOSED, so under section 3.6's precedence (NODATA dominates and did
        not fire; among the remaining three, MIXED fires on disagreement,
        CLOSED/OPEN fire only on full agreement) T-CIPHNOISE-CLOSED fires,
        aggregate CLOSED-ALL -- MATCHES the producer's own R-CN-OUT-4
        reading exactly. F(b) (not fired) reported alongside, not folded
        into the branch determination, matching PREREG-7 3.5/3.6's
        requirement.
        ROBUSTNESS NOTE: this CLOSED-ALL reading at Kyber1024 does NOT
        depend on M2's 617 figure being reliable -- beta(best) at
        Kyber1024 is determined by max(M0,M1,M2) = max(872,872,617) = 872
