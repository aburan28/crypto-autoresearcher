  # ==========================================================================
  # TARGET 1 -- independently re-derive the M0==M1 identity claim from
  # scratch, and check it against what PREREG-7 3.2 actually specifies
  # ==========================================================================
  artifact_checks:
    - id: ART-1-M0M1-IDENTITY-PROBABILITY
      check: >-
        Is "convolution distributes over mixtures" (Law(Xe+D) = sum_i p_i
        Law(Xe+D_i) for D a mixture of D_1..D_k with weights p_1..p_k) a
        correct statement of probability, and does it correctly describe
        what PREREG-7 section 3.2 specifies for M1 (a SINGLE effective
        distribution fed to the estimator, not a per-coordinate
        heterogeneous model)?
      result: >-
        CONFIRMED, both symbolically and numerically, independently derived.
        Symbolically: for independent Xe and mixture D = sum_i p_i D_i, the
        pmf of Xe+D at value v is sum_e P(Xe=e)P(D=v-e) =
        sum_e P(Xe=e) sum_i p_i P(D_i=v-e) = sum_i p_i sum_e
        P(Xe=e)P(D_i=v-e) = sum_i p_i * pmf(Xe+D_i)(v) -- a direct
        application of the law of total probability to a sum of independent
        variables, requiring no further assumption. Since the fibre-size
        classes PARTITION Z_q exactly, M0's population-average distribution
        IS BY DEFINITION the same law-of-total-probability mixture over
        those classes that M1 explicitly constructs; PREREG-7 3.2's own
        text specifies M1 as producing "a single effective distribution"
        fed to the estimator once (not a per-coordinate heterogeneous
        noise model, which primal_bdd's variance-only cost path -- see
        ART-2 below -- could not represent even if intended). Given that
        specification, M1 cannot differ from M0 by construction; this is
        forced by PREREG-7's own frozen text, not an artifact of the
        producer's implementation. Independently re-verified numerically
        (RECOMP-1 below): my own from-scratch mixture-pmf construction
        (independent_stage_b_readout.py's m1_variance(), which builds the
        exact per-class pmf and the exact CBD(eta1) pmf via
        math.comb-based binomial convolution, NOT variance shortcuts) gives
        a total variance bit-identical to my own independent M0 variance at
        all three parameter sets.
      probe: >-
        probes/independent_stage_b_readout.py,
        probes/independent_stage_b_readout.output.json
        (M0_M1_variance_identical_exact = true at Kyber512/768/1024).
      status: REPLICATED (independently re-derived from PREREG-7's own text
        and from raw census data, matching the producer's own argument and
        numbers).

    - id: ART-2-API-SURFACE-OBLIGATION-4A-SPOTCHECK
      check: >-
        Spot-check the producer's own obligation-4(a) finding (primal_bdd's
        entire call graph reads only Xe.stddev, never a pmf or higher
        moment) since the M0==M1 identity argument's practical bite (an
        estimator that DID consume the full per-coordinate pmf might, in
        principle, distinguish M0 from M1 even though their MARGINAL
        mixture is identical) depends on it.
      result: >-
        Not re-derived by grepping the estimator source myself line by
        line (would duplicate the producer's own obligation-4 work
        exactly); instead spot-checked functionally: this session's own
        independent_stage_b_readout.py constructs Xe via
        `estimator.nd.DiscreteGaussian(stddev)` (a DIFFERENT, more native
        constructor than the producer's own hand-built raw
        NoiseDistribution(...) call) and reproduces IDENTICAL beta/rop
        figures at every cell to the producer's own readout. If primal_bdd
        consumed anything beyond stddev (e.g. is_Gaussian_like, bounds,
        which DiscreteGaussian and the producer's raw NoiseDistribution set
        differently), this cross-construction agreement would not be
        guaranteed. This functionally corroborates the variance-only
        finding without re-deriving it from source.
      probe: probes/independent_stage_b_readout.py (see call_primal_bdd_variance_only).
      status: REPLICATED (functional cross-check, not a source-level re-derivation).

  # ==========================================================================
  # TARGET 3 -- independently re-verify Stage A's census
  # ==========================================================================
    - id: ART-3-STAGE-A-CENSUS-FROM-SCRATCH
      check: >-
        Recompute the fibre-size histograms at d in {4,5,10,11,12}, the
        d_u=11 roundtrip-agreement count, and the d=12 mutual-information
        gate directly from FIPS 203's own Compress/Decompress definitions
        (independently fetched, see ART-4 below), WITHOUT importing
        ciphertext_noise_census.py.
      result: >-
        EXACT MATCH at every cell. d=4: {208:15,209:1}; d=5: {104:31,105:1};
        d=10: {3:767,4:257}; d=11: {1:767,2:1281}; d=12: {1:3329} (every
        fibre singleton). d_u=11 roundtrip: 2048/3329 total matches, 0
        mismatches among the 767 singleton residues. d=12 gate:
        delta identically 0 for all x, I(delta;bin) forced 0. F(a) CLEARS,
        F(d) CLEARS -- both independently re-read from my own census, both
        agreeing with the producer's own R-CN-OUT-1 reading.
      probe: probes/independent_stage_a_census.py,
        probes/independent_stage_a_census.output.json.
      status: REPLICATED.

    - id: ART-3B-FIPS203-SCOPE-FINDING
      check: >-
        FIPS 203 eq (4.7) literally states "For d < 12, define Compress_d
        ...". Does the d=12 "gate" (used by both PREREG-7 and the
        producer's own script) actually fall inside FIPS 203's own stated
        domain for Compress_d/Decompress_d?
      result: >-
        NEW FINDING, SINGLE-SOURCE. Confirmed by direct reading of the
        independently-fetched primary source (see ART-4): NO. FIPS 203
        restricts Compress_d/Decompress_d formally to d<12; d=12 in FIPS
        203 is handled by a DIFFERENT mechanism (ByteEncode12/ByteDecode12,
        a lossless integer-mod-q encoding, not a "compression" map) in the
        same section 4.2.1. PREREG-7 section 2.3 point 1 and the producer's
        own ciphertext_noise_census.py both apply the SAME
        round((2^d/q)x) mod 2^d formula at d=12 anyway, without stating
        this domain extension explicitly (the producer's writeup DOES quote
        "For d < 12, define" verbatim from the source, but its own
        implementation and its own "d=12 degenerate gate" framing do not
        flag that this specific extension goes beyond that stated domain).
        This does NOT invalidate the d=12 result: the extended map is a
        well-defined function of x for any d, and (independently checked:
        decompress_range_check in the same probe, 0 out-of-range values
        across all d in {4,5,10,11,12}) it stays inside the codomain Z_q
        throughout; because 2^12=4096 > q=3329, the extended map is
        injective by a straightforward pigeonhole argument, which the
        exhaustive census (not merely the pigeonhole argument alone)
        independently confirms field-by-field. This is a naming/scope
        precision gap, not an arithmetic or conclusion error -- flagged
        because a strict reading of "FIPS 203's own Compress_12" is
        technically inaccurate, and the frozen PREREG-7 text and producer
        writeup should be read with that caveat.
      probe: probes/independent_stage_a_census.py (fips203_scope_finding
        field), probes/fips203_fetch_and_verify.sh,
        probes/fips203_fetch_and_verify.output.log.
      status: SINGLE-SOURCE (this validator; not raised by the producer or
        by PREREG-7's own text).

  # ==========================================================================
  # TARGET 6 -- protocol deviations, independently checked for honesty
  # ==========================================================================
    - id: ART-4-DEVIATION-1-PDF-FETCH
      check: >-
        Is the producer's claim that the committed
        inputs/MLKEM-DUAL-SOURCES-20260802 corpus lacked the Compress/
