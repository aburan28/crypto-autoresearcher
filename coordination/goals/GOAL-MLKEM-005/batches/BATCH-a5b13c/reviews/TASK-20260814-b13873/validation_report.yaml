        variance-only finding, spot-checked at ART-2).
      probe: probes/m_sensitivity_sweep.py, probes/m_sensitivity_sweep.output.json.

    - id: CTRL-2-M-SWEEP-SMOOTHNESS-CONTROL
      control: >-
        THE TASK'S OWN REQUESTED CONTROL: sweep m from 236 toward 1024 (and
        below) to check whether beta(M2)=617 sits on a smooth curve or is
        an outlier. Framed as the closest available analogue to the
        null-object-control discipline (docs/inventor-protocol.md section
        3 / AGENTS.md): as m increases back toward the base scheme's own
        m=n=1024 (i.e., as the "signal" -- the dimension reduction that
        drops compression noise -- is progressively reversed/diluted), a
        genuine, well-behaved security effect should relax SMOOTHLY back
        toward beta(M0)=872, not swing wildly.
      result: >-
        MAJOR FINDING, LOAD-BEARING, SINGLE-SOURCE (built by this
        validator; not attempted anywhere in PREREG-7 or the producer's own
        artifacts, whose own K-sensitivity sweep concerns RC.MATZOV's `nn`
        parameter, not m). THE CURVE IS NOT SMOOTH. Coarse sweep (step
        ~50-100, m=1024 down to 220): beta = 855, 855, 856, 863, 882, 917,
        942, 972, 983, [peak] 966 (m=300), 876 (m=260), 617 (m=236, MATCHES
        the producer's reported value exactly), 759 (m=220) -- already
        non-monotonic below m~350. Fine sweep (step 5, m=200-300) around the
        M2 point resolves this further: m=235 -> beta 611 (close to the M2
        point), m=240 -> beta 905 (a JUMP OF 294 BITS for a change of only
        5 in m, and 905 EXCEEDS beta(M0)=872 -- if reduced_m had landed at
        240 instead of 236, F(b) WOULD HAVE FIRED). m=270 -> beta 1000 (another
        large jump from m=265's 875). Below m=220 (down through m=200),
        primal_bdd itself returns rop=+inf (`Cost` object carries no finite
        `beta`/`rop` at all -- independently confirmed by direct
        inspection, not merely a KeyError in this validator's own wrapper
        code) -- i.e. the estimator's own optimizer cannot find ANY finite-
        cost attack construction in that regime. CONCLUSION: beta(M2)=617
        sits inside a demonstrably chaotic, near-breakdown region of
        primal_bdd/RC.MATZOV's own cost landscape at this severely
        sample-starved (m<<n) construction, immediately flanked by a much
        higher value 5 units away (759 at m=220, and 905/1000 at m=240/270)
        and by total optimizer failure roughly 20-35 units further down.
        This is POSITIVE, independently-measured evidence -- not merely
        "cannot rule out" -- that the 255-bit M0-vs-M2 gap is more likely
        dominated by primal_bdd/RC.MATZOV's own numerical/optimization
        instability in a regime it was not calibrated or validated for
        (the harness's own README states the known-answer control "covers
        primal_bdd under RC.MATZOV" only at the base scheme parameters,
        m=oo/native, not at m<<n) than by a genuine, security-relevant
        consequence of "removing compression noise" (H-MLKEM-11aabf's own
        stated mechanism). The producer's own writeup already declined to
        draw a conclusion here ("this task does not conclude whether the
        255-bit figure represents a sound security-relevant effect...");
        this control does not contradict that caution, it independently
        substantiates it with concrete, reproducible evidence and moves the
        balance of evidence clearly toward "artifact," without proving it
        with certainty (a full characterization of primal_bdd's optimizer
        in this regime is out of this task's scope).
      probe: probes/m_sensitivity_sweep.py, probes/m_sensitivity_sweep.output.json,
        probes/m_sensitivity_sweep_fine.py, probes/m_sensitivity_sweep_fine.output.json.

    - id: CTRL-3-TERMINATION-BRANCH-ROBUST-BUT-Fb-FRAGILE
      control: >-
        Given CTRL-2, separate what the M2 instability DOES and does NOT
        threaten.
      result: >-
        DOES NOT THREATEN: the CLOSED-ALL termination branch (RECOMP-4
        above; robust because M2 never sets "best" at Kyber1024, M0/M1
        already dominate it and are themselves stable -- confirmed by
        CTRL-1/RECOMP-3 showing no analogous instability at the base m=1024
        object). DOES THREATEN: the specific "F(b) NOT FIRED" reading and,
        by extension, HEUR-MLKEM-11aabf-1's own validation status. CTRL-2's
        fine sweep shows a value (m=240, beta=905) only 4 above the actual
        reduced_m=236 that WOULD have flipped F(b) to FIRED had the
        rounding of `round(1024*767/3329)` landed even slightly differently
        (it did not: 785408/3329 = 235.929..., rounding unambiguously to
        236 regardless of tie-breaking convention -- independently
        recomputed, no rounding ambiguity exists at this specific value).
        So F(b)'s reported NOT-FIRED status is technically correct as
        computed, but this control shows it is NOT ROBUST to small,
        plausible alternative choices in how the "clean-samples-only"
        construction could have been discretized (e.g. a different rounding
        rule for reduced_m, or a slightly different m-computation formula),
        which is a genuinely new, decision-relevant limitation for the
        Coordinator to weigh when recording HEUR-MLKEM-11aabf-1's own
        status.
      probe: same as CTRL-2 (probes/m_sensitivity_sweep_fine.py,
        probes/m_sensitivity_sweep_fine.output.json), plus this report's own
        arithmetic (785408/3329 = 235.929...).

    - id: CTRL-4-FALSIFICATION-COVERAGE-GAP-M1
      control: >-
        H-MLKEM-11aabf.predictions bundles beta(M1) AND beta(M2) together
        under one predicted metric ("beta(M1), beta(M2) relative to
        beta(M0) at ML-KEM-1024 ... minimum_effect: a reduction of 2 to 4
        core-SVP bits"), but HEUR-MLKEM-11aabf-1's own falsification_condition
        (F(b)) checks ONLY beta(M2) >= beta(M0). Does the frozen
        falsification design actually cover M1's own predicted effect?
      result: >-
        NEW FINDING, SINGLE-SOURCE. NO, it does not. M1's own result is not
        merely "below the predicted 2-4 bit range" -- it is PROVABLY,
        EXACTLY 0 bits at every parameter set (ART-1 above: a forced
        mathematical identity given M1's own frozen construction), directly
        contradicting the predicted minimum_effect for the M1 half of that
        bundled prediction row. Neither PREREG-7 nor H-MLKEM-11aabf's own
        falsification_conditions (F(a)-(d)) name a check for "beta(M1) fails
        to show ANY gain over beta(M0)" -- only F(b), M2-only, is wired to
        a falsification branch. This is a genuine gap in H-MLKEM-11aabf's
        own falsification design (present in the hypothesis record before
        PREREG-7, correctly and verbatim transcribed by PREREG-7, so it is
        not an artifact of this batch or its producer), worth the
        Coordinator's explicit attention when characterizing what this
        batch's CLOSED-ALL outcome does and does not establish about
        HEUR-MLKEM-11aabf-1 as a whole (as opposed to F(b)'s own narrow
        M2-only condition).
      probe: none (textual analysis of ledger/hypotheses/H-MLKEM-11aabf.yaml
        @ 4e0d3a0eb75da7240214d48b0e0c4bd24ff46307 and PREREG-7 section 3.5,
        both already read for other checks above; no new script needed).

    - id: CTRL-5-SCOPE-COMPLIANCE
      control: >-
        Confirm no lattice reduction of any kind, and only RC.MATZOV/
        primal_bdd/ML-KEM-512-768-1024/d in {4,5,10,11,12} anywhere in the
        producer's committed artifacts.
      result: >-
        CONFIRMED. `grep -inl "fpylll|BKZ|HKZ"` across all producer .py/
        .txt/.yaml/.json/.md/.log files finds matches ONLY inside
        ciphertext_noise_writeup.md's own two NEGATION sentences ("No
        lattice reduction ... was used anywhere", and the unrelated
        FORBIDS-list mention of the hkz/HKZ-independence lineage) -- zero
        invocations. `grep "RC\.|dual_hybrid|arora_gb|primal_hybrid"` across
        ciphertext_noise_readout.py finds only primal_bdd/RC.MATZOV calls
        (plus the K-sensitivity sweep's own RC.MATZOV(nn=...) variants,
        still RC.MATZOV). command.txt contains no other cost model or
        attack invocation.
      probe: direct grep in this session (bash transcript above; no
        separate probe file needed, fully reproducible from the one-line
        commands shown).

