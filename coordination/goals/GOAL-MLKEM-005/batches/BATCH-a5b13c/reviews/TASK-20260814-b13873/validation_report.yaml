        M0/M1 (which are independently confirmed robust, see CTRL-1 below)
        and so never sets "best" at this parameter set. See CTRL-2 for
        what IS sensitive to M2's reliability (F(b) and
        HEUR-MLKEM-11aabf-1's own validation, NOT the termination branch).
      probe: probes/independent_stage_b_readout.py,
        probes/independent_stage_b_readout.output.json (this report's own
