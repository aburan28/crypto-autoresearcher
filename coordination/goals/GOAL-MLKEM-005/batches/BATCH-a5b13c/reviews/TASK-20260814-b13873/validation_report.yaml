        (sha256 fe1f12f32a7e44ec9fdebbf400cda843a40b506dee676725234dc6f7923b6cac,
        a DIFFERENT fetch, DIFFERENT session, DIFFERENT ephemeral path from
        the producer's own /tmp/fips203.pdf, whose own hash was not
