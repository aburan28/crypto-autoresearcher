      probe: probes/fips203_fetch_and_verify.sh,
        probes/fips203_fetch_and_verify.output.log.
      status: REPLICATED.

    - id: ART-5-DEVIATION-2-CENTERING-BUG
      check: >-
        Is the disclosed mod-q delta-centering bug (naive integer
        subtraction producing one spurious huge outlier per d, inflating
        variance by orders of magnitude) a genuine, correctly-described
        defect that was actually fixed before any final number was
        reported?
      result: >-
        CONFIRMED. Independently reproduced the UNCENTERED (buggy) delta
        computation at d=10: exactly one residue has |raw delta| > 10 (the
        value 3328, the true signed distance being -1), and the resulting
        uncentered stddev is 57.6795... -- matching the producer's own
        claimed "~57.7 instead of ~1.4-1.6" almost to five significant
        figures. This validator's own from-scratch Stage A/B
        implementation used centered, signed-residue arithmetic from the
        start (never had this bug), so the corrected final numbers this
        report independently reproduces (ART-3, RECOMP-2/3 below)
        constitute independent confirmation that the fix, as described,
        produces the reported numbers.
      probe: probes/centering_bug_and_histogram_crosscheck.py,
        probes/centering_bug_and_histogram_crosscheck.output.json.
      status: REPLICATED.

