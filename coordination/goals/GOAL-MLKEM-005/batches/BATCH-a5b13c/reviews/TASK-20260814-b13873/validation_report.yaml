      result: >-
        Fresh clone confirmed at exactly
        3e48ef421ec256afddb3e7d2249a77eab6e9ba12 (`git rev-parse HEAD`).
        PASS, exit 0. primal_bdd reproduces the archived Sage reference for
        Kyber512/768 at EXACT delta 0.0 (140.1994731076207 / 200.9587149140538);
        Kyber1024 read as 270.7236234535225 (no reference, as declared);
        beta/eta/d = 389/422/1005, 606/640/1420, 855/889/1867 --
        bit-identical to the producer's own reported table.
        dual_hybrid(fft=True) within its declared 1e-9 tolerance (observed
