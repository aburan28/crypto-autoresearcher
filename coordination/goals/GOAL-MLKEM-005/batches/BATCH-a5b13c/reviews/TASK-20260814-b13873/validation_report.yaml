    - id: RECOMP-3-M0-M1-M2-BETA-READOUT
      what: >-
        Independently build M0 (population-average), M1 (per-class
        mixture) and M2 (clean-samples-only, reduced m) from PREREG-7
        section 3.1-3.3's frozen text, and call the SAME pinned
        primal_bdd/RC.MATZOV directly, at every parameter set where each
        model is defined, WITHOUT importing ciphertext_noise_readout.py.
      result: >-
        BIT-IDENTICAL to the producer's own readout at every one of 8
        defined cells. Kyber512: M0/M1 stddev 1.556920306446095, beta 404,
        log2(rop) 144.32857855991793. Kyber768: stddev 1.3870835737705938,
        beta 633, log2(rop) 208.4823987987427. Kyber1024: stddev
        1.176775318435065, beta(M0)=beta(M1)=872, log2(rop) 275.609974951563;
        M2 (reduced_m=236, base_m=1024) beta=617, log2(rop)=363.8696662484242.
        M0==M1 variance identity CONFIRMED exact (Fraction arithmetic
        equality, not float rounding) at all three parameter sets. F(b)
        (beta(M2)>=beta(M0) at Kyber1024) independently confirmed NOT
        FIRED (617 < 872).
      probe: probes/independent_stage_b_readout.py,
        probes/independent_stage_b_readout.output.json.

    - id: RECOMP-4-TERMINATION-BRANCH
      what: >-
