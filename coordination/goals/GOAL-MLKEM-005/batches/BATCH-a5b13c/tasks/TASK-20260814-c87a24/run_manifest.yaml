  protocol_deviations:
    - "Fetched the primary FIPS 203 PDF directly from nvlpubs.nist.gov
      because the committed source corpus lacked the needed passage (see
      above); this is an ADDITION beyond the protocol's stated inputs list,
      not a substitution of an uncited claim, and is fully sourced/hashed."
    - "Discovered and fixed a delta-computation bug during development: the
      first working version of compression-error variance used a naive
      integer subtraction (x - Decompress(Compress(x))) instead of the
      mod-q CENTERED signed residue, producing one spurious huge outlier
      per d (e.g. delta=3328 for one residue at d=10 from wraparound near
      the q-1/0 boundary) that inflated M0/M1's computed variance by orders
      of magnitude. Fixed before any number was reported as final (see
      ciphertext_noise_census.centered_delta and its docstring). The buggy
      intermediate run's numbers are NOT reported anywhere in this task's
      deliverables; only the corrected run is."
    - "mpmath was not present in this session's Python environment at task
      start (scipy was) and was installed via pip3 this session; recorded
      as an environment fact, not silently assumed present."
  anomalies:
    - "beta(M0) == beta(M1) EXACTLY (bit-identical log2(rop) and stddev,
      not merely equal integers) at all three parameter sets. This is
      reported as a FORCED mathematical identity (convolution distributes
      over mixtures: 'convolve Xe with the population-average mixture' and
      'mixture of Xe-convolved-with-each-class, fed as PREREG-7 section
      3.2's own specified single effective distribution' are the same
      distribution to full precision), not an implementation defect --
      see results_ciphertext_noise.json's own
      IDENTICAL_TO_M0_variance_exactly / finding_why_identical fields and
      ciphertext_noise_writeup.md for the full argument."
    - "beta(M2) at ML-KEM-1024 (617) is 255 bits BELOW beta(M0) (872) --
      qualitatively consistent with H-MLKEM-11aabf's predicted direction
      (M2 < M0) but roughly two orders of magnitude larger than the
      predicted minimum_effect magnitude (2-4 bits). The reduced sample
      count driving M2 (m=236 vs the base object's m=n=1024) is a severely
      underdetermined regime (m << n); this task does not conclude that
      the 255-bit figure represents a sound security-relevant effect size
      versus an artifact of feeding primal_bdd a sample count far below
      what the base scheme object uses -- both readings are recorded, see
      writeup."
