# =====================================================================
# ITEM 2 -- RE-MEASURED G3 STEPS UNDER BOTH SE CONVENTIONS
# =====================================================================
item_2_g3_remeasurement:
  question: reproduce the paired-vs-unpaired numbers that decide the verdict.
  method: >-
    I recomputed, from results.json per-draw values only (ratio_2em10_values, 8 per
    t per cell), every one of the 12 steps in each of the 4 cells:
    delta = mean(t_{i+1}) - mean(t_i);
    SE_paired = sd_j(r_j(t_{i+1}) - r_j(t_i))/sqrt(8), ddof=1;
    SE_unpaired = sqrt(sd(t_{i+1})^2/8 + sd(t_i)^2/8), ddof=1.
    No producer-computed SE was read before recomputing.
  verdict: CONFIRMED. All 48 steps reproduce EXACTLY (agreement to < 1e-12 on delta,
    SE_paired and SE_unpaired in every one of the 48).
  the_two_steps_that_decide_the_verdict:
  - cell: d100_b30
    step: t = 0.05 -> 0.10 (step index 8)
    delta_recomputed: +0.000608023557
    se_step_paired_recomputed: 0.000452753049
    delta_in_se_paired: +1.3429
    se_step_unpaired_recomputed: 0.001430655898
    delta_in_se_unpaired: +0.4250
    scores: FAIL under paired (> 1.0 SE); TIE under unpaired
  - cell: d140_b40
    step: t = 0.5 -> 1.0 (step index 11)
    delta_recomputed: +0.001245590
    se_step_paired_recomputed: 0.000573610
    delta_in_se_paired: +2.1715
    se_step_unpaired_recomputed: 0.001705085
    delta_in_se_unpaired: +0.7305
    scores: FAIL under paired (> 1.0 SE); TIE under unpaired
  per_cell_recomputed:
    d100_b30: {paired: FAIL, paired_max_increase_se: 1.3429, unpaired: TIE, unpaired_max_increase_se: 0.5381, recorded: FAIL, cell_verdict: INVALID}
    d100_b40: {paired: TIE, paired_max_increase_se: 0.7662, unpaired: TIE, unpaired_max_increase_se: 0.3678, recorded: TIE, cell_verdict: PARTIAL}
    d140_b30: {paired: TIE, paired_max_increase_se: 0.7113, unpaired: TIE, unpaired_max_increase_se: 0.5512, recorded: TIE, cell_verdict: PARTIAL}
    d140_b40: {paired: FAIL, paired_max_increase_se: 2.1715, unpaired: TIE, unpaired_max_increase_se: 0.7305, recorded: FAIL, cell_verdict: INVALID}
  overall_verdict_as_the_frozen_rule_computes_it: INVALID
  the_producer_applied_the_frozen_rule_correctly: >-
    prereg.md section 4.1 declares the paired form "the correct SE for this design"
    and freezes "the recorded G3 outcome is the MORE SEVERE of the two readings".
    Both are pre-registered text at the notarized sha256. The executor applied
    them as written and requested no change. Confirmed.

# =====================================================================
# ITEM 3 -- ADJUDICATION OF THE SECTION 7.5 OBJECTION  (THE SUBSTANTIVE ITEM)
# =====================================================================
item_3_section_7_5_objection:
  question: >-
    Is it true that G3-paired resolves steps below the instrument's own detection
    floor -- making INVALID an artifact of the gate's construction rather than a
    statement about the instrument?
  verdict: >-
    UPHELD, AND UNDERSTATED BY THE PRODUCER. The INVALID verdict is a property of
    the G3 threshold's construction, not a measured failure of the instrument.
    The arithmetic checks out and the strongest form of the argument is one the
    executor did not make.
  what_the_executor_claimed_and_whether_it_holds:
  - claim: both G3 FAILs are steps smaller than the gate width at the points compared
    validator_arithmetic:
      d100_b30_step_0.05_to_0.10:
        delta: 0.000608024
        gate_width_4xSE_diff_at_t0.05: 0.005032250
        gate_width_4xSE_diff_at_t0.10: 0.005772141
        delta_as_fraction_of_gate_width: 0.121 (lower endpoint) / 0.105 (upper endpoint)
      d140_b40_step_0.5_to_1.0:
        delta: 0.001245590
        gate_width_4xSE_diff_at_t0.5: 0.005426155
        gate_width_4xSE_diff_at_t1.0: 0.005664931
        delta_as_fraction_of_gate_width: 0.230 / 0.220
    holds: YES
    minor_correction: >-
      The report quotes "a gate width of ~0.0058" for the d100_b30 step. That is
      the UPPER endpoint's width; the lower endpoint's is 0.005032. The conclusion
      is unchanged (0.000608 is 12% of even the smaller width), but the quoted
      figure is the more favourable of the two.
  - claim: neither endpoint of either failing step clears its own gate
    validator_arithmetic:
      d100_b30: {t0.05_shift_in_se_diff: 0.9629, t0.10_shift_in_se_diff: 1.2608, both_cleared: false}
      d140_b40: {t0.5_shift_in_se_diff: 0.1440, t1.0_shift_in_se_diff: 1.0174, both_cleared: false}
    holds: YES. Both failing steps compare two frames the same design declares to carry no information.
  - claim: paired SEs at large t are tiny because (S_j, G_j) is shared across t
    validator_arithmetic:
      se_step_unpaired_over_se_step_paired_over_all_48_steps: {min: 0.864, median: 2.161, max: 5.113}
      same_ratio_over_the_24_saturated_steps: {min: 1.239, median: 2.083, max: 4.045}
      se_step_paired_over_gate_se_diff_at_the_failing_steps: {d100_b30: 0.3599, d140_b40: 0.4228}
    holds: YES
    consequence_in_plain_terms: >-
      The gate calls a difference detectable at 4 x SE_diff. G3 calls a step a
      violation at 1 x SE_step_paired = 0.36-0.42 x SE_diff. G3-paired is
      therefore roughly 10x (d100_b30: 11.1x; d140_b40: 9.5x) more sensitive than
      the gate the same document uses to decide whether an arm carries any signal
      at all.
  the_stronger_argument_the_executor_did_not_make:
    finding: >-
      The graded family SATURATES well before the top of the grid, and the frozen
      G3 rule then applies a 1-SE threshold to a long run of steps that are, by
      the design's own gate, pure noise. The failure was near-certain before any
      number was drawn.
    measured_saturation:
      d100_b30: {r_at_t: [1.09542, 1.05759, 1.03705, 1.02475, 1.01765, 1.00844, 1.00360, 1.00146, 0.99986, 1.00047, 1.00121, 1.00131, 1.00115], gate_cleared_at_first_n_t: 6, saturated_steps: 6}
      d100_b40: {gate_cleared_at_first_n_t: 7, saturated_steps: 5}
      d140_b30: {gate_cleared_at_first_n_t: 5, saturated_steps: 7}
      d140_b40: {gate_cleared_at_first_n_t: 6, saturated_steps: 6}
      definition_of_saturated_step: neither endpoint clears its own 4 x SE_diff gate vs the Haar null
      total_saturated_steps_across_the_four_cells: 24 of 48
    both_paired_G3_violations_lie_inside_the_saturated_region: true
    false_flag_arithmetic:
      model: >-
        For a step whose TRUE difference is zero, delta_hat / SE_step_paired is
        Student-t on 7 df (8 draws, ddof=1). This is the exact reference
        distribution for the statistic G3 computes; no approximation is involved.
      P_one_sided_t7_gt_1: 0.175309
      P_at_least_one_flag_per_cell_given_all_saturated_steps_truly_zero:
        d100_b30: 0.6854
        d100_b40: 0.6185
        d140_b30: 0.7406
        d140_b40: 0.6854
      P_at_least_one_FAIL_somewhere_across_all_24_saturated_steps: 0.9902
    conclusion: >-
      Even for a PERFECTLY behaving instrument -- one whose graded family is
      exactly flat everywhere the gate says it carries no signal -- the frozen
      G3-paired rule returns at least one FAIL, and hence an overall INVALID, with
      probability 0.99. The G3-paired verdict is therefore not informative about
      the instrument. It is informative about the threshold.
  the_more_severe_clause_is_not_the_two_sided_safeguard_it_was_written_as:
    prereg_intent: >-
      Section 4.1 justifies "record the MORE SEVERE of the two readings" as making
      it "impossible to gain permissiveness by choosing an SE convention".
    what_it_actually_does: >-
      SE_paired < SE_unpaired in 47 of 48 steps, so "more severe" reduces almost
      deterministically to "always score paired". It does not average two readings
      or hedge between them; it selects the uniformly more powerful test and then
      applies a 1-SE threshold to it. The safeguard against permissiveness is real;
      what is absent is any symmetric safeguard against the over-rejection that the
      selected convention produces.
  did_AM_1_fix_the_problem_DEC_20260806_00deff_identified:
    the_superseded_defect: >-
      DEC-20260806-00deff records that under the old grid G3 "was left demanding a
      strict ordering among six exchangeable noise arms -- probability 1/720",
      i.e. a ~0.9986 chance of INVALID by construction.
    what_AM_1_achieved: >-
      The GRID fix worked and I confirm it: the gate crossing now falls inside the
      sampled range in all four cells, G1 clears at 47.80 / 66.24 / 52.56 / 77.24
      SE, G2 does not fire anywhere, and the dynamic range is 46.56-75.90 SE of
      difference. Both ends of the family are now exhibited. That is a genuine
      repair and it is the headline result of this batch.
    what_AM_1_did_not_achieve: >-
      The TIE-TOLERANCE fix did not remove the structural over-rejection; it
      relocated it. Construction-driven P(INVALID) moved from ~0.9986 to 0.9902.
      The reason is that AM-1 expressed the tolerance in SE_step units, and
      SE_step_paired collapses in exactly the region where the effect it is meant
      to tolerate has vanished. A tolerance denominated in the statistic's own
      shrinking noise cannot tolerate a saturated regime.
  counterfactual_under_a_gate_commensurable_tolerance:
    rule_tested: a step is a violation only if it exceeds K x SE_diff of the arm-vs-Haar
      gate at the step's lower endpoint (the same SE the design already uses to decide detectability)
    results:
      d100_b30: {max_increase: 0.511 x SE_diff, = 0.128 x gate_width, verdict_at_1xSE_diff: TIE, verdict_at_gate_width: TIE}
      d100_b40: {max_increase: 0.376 x SE_diff, = 0.094 x gate_width, verdict_at_1xSE_diff: TIE, verdict_at_gate_width: TIE}
      d140_b30: {max_increase: 0.383 x SE_diff, = 0.096 x gate_width, verdict_at_1xSE_diff: TIE, verdict_at_gate_width: TIE}
      d140_b40: {max_increase: 0.918 x SE_diff, = 0.230 x gate_width, verdict_at_1xSE_diff: TIE, verdict_at_gate_width: TIE}
    counterfactual_overall_verdict: PARTIAL in all four cells, under BOTH the 1 x SE_diff and the 4 x SE_diff readings.
    status_of_this_counterfactual: >-
      IT IS NOT A VERDICT AND MUST NOT BE RECORDED AS ONE. It is a post-hoc rule
      computed after seeing which steps violated, which is exactly the move
      prereg.md section 7.5 forbids and exactly the move the executor correctly
      declined to make. Its ONLY legitimate use is forward: it shows the choice of
      denominator, not the data, decides this verdict, and it costs nothing to fix
      in advance.
  what_this_changes_for_the_next_batch:
  - The AM-1 overall verdict INVALID stands as recorded and must not be softened,
    reinterpreted, or restated as PARTIAL. The frozen rule was run and this is its output.
  - But INVALID here does NOT mean "the instrument failed to demonstrate sensitivity".
    G1 and G2 both pass in all four cells at 47.8-77.2 SE. The demonstration exhibited
    both ends of the family and the crossing between them. What failed is a monotonicity
    criterion whose threshold has ~99% probability of firing on a flawless instrument.
  - >-
    A successor MUST fix the denominator BEFORE seeing data. The specific defect is
    naming the tolerance in SE_step units. Three pre-registrable repairs, in order of
    how much they change.
    (a) denominate the tolerance in the gate's own units (K x SE_diff), so G3 and the
    gate speak one language -- the fix the executor's forward_guidance points at;
    (b) restrict G3 to steps where at least one endpoint clears the gate, so the
    criterion is never evaluated on frames the design calls uninformative;
    (c) state G3 as an equivalence test (TOST) against a pre-registered
    practically-negligible increase, which is what "tie-tolerant" was reaching for.
  - >-
    Whichever is chosen, the multiplicity must be declared -- 12 steps x 4 cells = 48
    comparisons at a per-step threshold. AM-1 did not state a multiplicity policy and
    the 0.99 figure above is mostly multiplicity.

# =====================================================================
# ITEM 4 -- IS mu0 A THEOREM?
# =====================================================================
item_4_mu0_is_a_theorem:
  claim_under_test: mu_0 = 2*beta*(d-beta) / (d*(d+2)) is the exact Haar expectation
    of V = sum_a (P_aa - beta/d)^2, not a calibration.
  verdict: >-
    IT IS A THEOREM. Confirmed by derivation and by independent Monte Carlo. The
    predicate's null LOCATION requires no reference arm and no fitted constant, so
    the overfit objection is structurally answered FOR THE LOCATION PARAMETER. It
    is NOT answered for the SCALE, and that distinction matters -- see below.
  derivation_checked_by_validator: >-
    For Q a d x beta orthonormal basis of a Haar-random beta-dimensional subspace
    of R^d and P = Q Q^T, the marginal law of P_aa = ||e_a^T Q||^2 is
    Beta(beta/2, (d-beta)/2) -- the standard law of the squared norm of the
    projection of a fixed unit vector onto a uniformly random beta-subspace.
    Hence E[P_aa] = beta/d and
      Var(P_aa) = ab/((a+b)^2 (a+b+1)) with a = beta/2, b = (d-beta)/2
                = (beta(d-beta)/4) / ((d^2/4)((d+2)/2))
                = 2*beta*(d-beta) / (d^2 (d+2)).
    V is a sum over a of (P_aa - E[P_aa])^2, so by linearity of expectation --
    which needs NO independence among the P_aa, and they are not independent since
    they sum to beta --
      E[V] = d * Var(P_aa) = 2*beta*(d-beta) / (d(d+2)).  QED.
    Exact for every d and beta, no large-d limit, no approximation.
  formula_vs_recorded_values: 4 of 4 cells agree in IEEE-754 double to the last bit
    (0.4117647058823529 / 0.47058823529411764 / 0.3319919517102616 / 0.4024144869215292).
  independent_monte_carlo_by_validator:
    method: my own code; Q from QR of a d x beta standard normal matrix; 20000 frames per cell.
    results:
      d100_b30: {theorem: 0.41176471, MC_mean: 0.41163815, MC_SE: 0.00040820, deviation: -0.31 MC-SE, sd_V: 0.057728}
      d100_b40: {theorem: 0.47058824, MC_mean: 0.46978964, MC_SE: 0.00046411, deviation: -1.72 MC-SE, sd_V: 0.065635}
      d140_b30: {theorem: 0.33199195, MC_mean: 0.33224372, MC_SE: 0.00027891, deviation: +0.90 MC-SE, sd_V: 0.039444}
      d140_b40: {theorem: 0.40241449, MC_mean: 0.40239157, MC_SE: 0.00033710, deviation: -0.07 MC-SE, sd_V: 0.047673}
      d140_b60: {theorem: 0.48289738, MC_mean: 0.48309581, MC_SE: 0.00040394, deviation: +0.49 MC-SE, sd_V: 0.057126}
    verdict: consistent with an exact identity at 20000-frame precision in all five (d, beta).
  the_supporting_algebra_also_checks_out:
    projector_identity: >-
      sum_{a,b} P_ab^2 = tr(P^2) = tr(P) = beta, and
      sum_a P_aa^2 = V + beta^2/d (since sum_a P_aa = beta), so
      sum_{a != b} P_ab^2 = beta - beta^2/d - V exactly. CONFIRMED.
    sufficiency_identity: >-
      For iid mean-zero unit-variance coordinates with fourth moment mu_4 and
      symmetric A, Var(e^T A e) = (mu_4 - 3) sum_a A_aa^2 + 2 tr(A^2). With A = P
      this is 2*beta + (mu_4 - 3)(V + beta^2/d). CONFIRMED. Since d, beta and mu_4
      are fixed per cell, V is the only frame-dependent term, so P3 computes
      exactly the quantity whose noisy estimate drove the incumbent T2.
  a_correction_that_STRENGTHENS_the_producers_argument:
    id: P-1
    producers_text: predicate_report.md section 2.1(b) -- "At second order in the entries
      of P there are exactly two such invariants".
    validator_finding: >-
      There are THREE quadratic invariants of P under the signed-permutation group,
      not two: sum_a P_aa^2, sum_{a != b} P_ab^2, and sum_{a != b} P_aa P_bb. The
      producer omitted the third. The omission does not weaken the argument, it
      strengthens it: the third is also affine in V, because
      sum_{a != b} P_aa P_bb = (sum_a P_aa)^2 - sum_a P_aa^2 = beta^2 - (V + beta^2/d).
      So ALL quadratic signed-permutation invariants of a rank-beta projector
      collapse to the single degree of freedom V. There was no candidate set to
      search over and therefore nothing to overfit at this order. Recorded as a
      correction, not a defect.
  where_the_theorem_does_NOT_reach_and_why_it_matters:
    finding: >-
      mu_0 is a theorem; Var(V) is not. The predicate's SE is estimated from the
      same 8 frames it judges, so the z it reports is a Student-like ratio, not a
      normal deviate, and it is over-dispersed.
    validator_monte_carlo_of_the_z_statistic:
      method: my own code; 4000 independent arms of n = 8 Haar frames each; z = (Vbar - mu_0)/(s/sqrt(8)).
      d140_b30: {z_sd: 1.194, one_sided_FP_rate_at_gate_4.0: 0.00150}
      d140_b40: {z_sd: 1.193, one_sided_FP_rate_at_gate_4.0: 0.00175}
      d140_b60: {z_sd: 1.196, one_sided_FP_rate_at_gate_4.0: 0.00250}
      producer_claimed: z_sd ~ 1.19, FP 0.00145-0.00295
      agreement: EXACT within Monte Carlo error. The producer's self-objection in
        section 7 is confirmed independently and was not softened.
    consequence: >-
      The "4 SE" gate operates near the 0.15-0.25 percent one-sided level, not at
      3e-5. A reader who reads "4 sigma" as a normal tail is misled by roughly a
      factor of 60. The producer states this itself and I confirm the number.
      The correct summary is: P3's null LOCATION is a theorem; P3's null SCALE at
      n = 8 is an over-dispersed sample estimate and its gate is a ~0.2 percent
      test. A DEPARTURE in the 4-5 SE band should not be trusted at n = 8.
    named_and_costed_successor_the_producer_declined_to_adopt: >-
      Substituting the null SE sd_0(d,beta)/sqrt(n) for the sample SE removes the
      over-dispersion. The producer refused to adopt an undemonstrated improvement,
      which is exactly right under AM-2's prohibition. I tested the substitution
      myself as a robustness check only -- see item 5 -- and every verdict is unchanged.

# =====================================================================
# ITEM 5 -- RE-MEASURED AM-2 SEPARATION
