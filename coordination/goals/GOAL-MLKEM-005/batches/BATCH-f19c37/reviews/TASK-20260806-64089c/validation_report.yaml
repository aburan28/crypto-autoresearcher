# =====================================================================
findings_summary:
- id: V-1
  severity: material, forward-looking
  finding: >-
    The AM-1 INVALID verdict is an artifact of the G3 threshold's construction. On 24 of 48
    steps neither endpoint clears the design's own gate, and a 1.0 x SE_step_paired threshold
    flags a true-zero step with probability 0.1753 (t_7). P(at least one FAIL across the 24) =
    0.9902. AM-1's tie tolerance moved construction-driven P(INVALID) from ~0.9986 to 0.9902:
    it relocated the defect rather than removing it, because the tolerance is denominated in
    a noise scale that collapses exactly where the effect vanishes.
  action: the next batch must denominate G3 in gate-commensurable units, or restrict G3 to
    steps with a clearing endpoint, or state it as an equivalence test -- pre-registered and
    notarized, before any data.
- id: V-2
  severity: material, positive
  finding: >-
    The AM-1 GRID fix worked and is the batch's real result. The gate crossing falls inside the
    sampled range in all four cells, G1 clears at 47.80-77.24 SE, G2 fires nowhere, dynamic
    range 46.56-75.90 SE. The stated reason C3 was UNMET in EV-MLKEM-94f036 -- that the
    demonstration could not show sensitivity to the object under study -- no longer holds.
- id: V-3
  severity: material, positive
  finding: >-
    The notarization gap recorded as open in EV-MLKEM-94f036 is closed by construction for
    BATCH-f19c37. Six carriers agree on the sha256, the notarizing commit is an ancestor of the
    run HEAD (validator-verified against 17203307, not merely its parent), no commit has touched
    prereg.md since, and no measurement artifact appears anywhere in the git record before the
    pre-registration does. Not retroactive for BATCH-436ddd.
- id: V-4
  severity: material, positive
  finding: >-
    P3 is admissible under AM-2 on every clause, and on stronger grounds than the bar requires:
    mu_0 is a theorem (validator-derived and MC-confirmed), the statistic is forced rather than
    selected (all quadratic signed-permutation invariants of a rank-beta projector reduce to V),
    and every verdict is invariant to the SE convention. Its floor of 0.068-0.087 V-units sits
    below the 0.111-0.138 residual it measures, which is exactly the condition T2 fails.
- id: V-5
  severity: qualification that must travel with any citation of P3
  finding: >-
    P3's null LOCATION is a theorem; its null SCALE at n = 8 is a sample estimate, over-dispersed
    by a validator-measured factor 1.193-1.196, so the "4 SE" gate is a ~0.15-0.25 percent
    one-sided test and not a 3e-5 one. Producer-disclosed and independently confirmed.
- id: V-6
  severity: minor, strengthens the producer
  finding: >-
    predicate_report.md section 2.1(b) counts two quadratic signed-permutation invariants; there
    are three. All three are affine in V, so the no-search-space argument is stronger than stated.
- id: V-7
  severity: minor
  finding: >-
    The AM-1 ancestry check asserted the notarizing commit's PARENT rather than the commit; the
    report quotes the more favourable of the two gate widths for the d100_b30 failing step
    (0.0058 vs the lower endpoint's 0.005032); predicate_report.md section 5 uses the banned word
    "absent" about a computation stage rather than a measured arm. None changes any verdict.
- id: V-8
  severity: standing gap, now named in five records
  finding: >-
    k != d/2 remains unrun. It is the cheapest discriminating test between L2's beta <= k spill
    boundary and the superseded beta <= d-k mechanism, both d tested have k = d/2, and it is the
    largest single hole in L2's support. It should be a first-class task in the next batch.

