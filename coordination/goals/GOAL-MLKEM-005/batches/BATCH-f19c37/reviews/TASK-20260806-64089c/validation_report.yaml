# =====================================================================
# ITEM 6 -- DOES AM-2 MEET THE BAR, AND IS C3 DISCHARGED?
# =====================================================================
item_6_am2_bar_and_C3:
  am2_bar:
    verdict: MET, in all four cells on the weaker-reduction arms and in two of four
      on the strict real_bkz arm. AM-2 required at least one.
    requirement_by_requirement:
    - requirement: different verdicts on the Haar null arm and the real arm in at least one cell
      status: MET
      evidence: >-
        Strictest reading ("the real arm" = real_bkz): verdicts differ at d140_b30
        (real_bkz DEPARTURE, haar_null AGREEMENT) and d140_b40. Broader reading
        (any real-data arm): verdicts differ in all four cells on lll_only and on
        unreduced. I regenerated d140_b30 from seeds myself and confirm it.
    - requirement: separation stated in SE of the difference
      status: MET
      evidence: +5.4845 SE (d140_b30) and +6.3653 SE (d140_b40) on real_bkz;
        +5.31 to +13.04 SE on lll_only; +249.92 to +587.32 SE on unreduced. All recomputed.
    - requirement: demonstrated on ALREADY-COMMITTED BATCH-436ddd / BATCH-a51f91 data
      status: MET
      evidence: >-
        Zero error draws, zero new seeds, zero new arms. Frames regenerated from the
        committed seed scheme, with regeneration verified against 32 bases x 6
        committed diagnostics at max relative deviation 0.0 before any predicate
        number was computed. I independently reproduced two cells and the b0_norm
        cross-check above.
    - requirement: floor_clause -- declare the detection floor in the statistic's units,
        report every negative verdict as an upper bound at that floor
      status: MET
      evidence: >-
        FLOOR = 4 * sd(V)/sqrt(n) declared per arm per cell in V-units (table in
        section 4 of the predicate report, and detection_floor_V_units on every arm
        in separation.json). Every AGREEMENT carries upper_bound_on_excess_V_units
        and a reported_as string that names it an upper bound. The predicate has no
        code path that can emit the word "absent". Verified in the artifact fields,
        not merely in the prose.
    - requirement: prohibition -- accepted on demonstrated separation, not plausibility
      status: MET, on stronger grounds than the bar requires
      evidence: >-
        The statistic is forced rather than selected: at second order every
        signed-permutation invariant of a rank-beta projector reduces to V (item 4,
        finding P-1, which corrects and strengthens the producer's own count), and V
        is the exact sufficient statistic for the incumbent instrument's own
        frame-dependence. The only tunable constant, the gate K = 4.0, is inherited
        verbatim from DEC-20260805-4823db and was not chosen by this task. mu_0 is a
        theorem. There is no fitted parameter to overfit.
    qualifications_that_must_travel_with_the_acceptance:
    - >-
      The demonstration was NOT blind, and the producer says so unprompted in
      predicate_report.md section 8.6 -- the red team had already published approximate
      V values for these arms. AM-2 does not require blindness -- it requires demonstrated
      separation on committed data -- so this does not block admission. But P3's first use
      on NEW data should be pre-registered and notarized on the AM-1 pattern, and this
      batch has just shown that pattern works.
    - The gate is a ~0.2 percent one-sided test, not a 4-sigma-normal test (item 4).
      Any record citing P3 must state this or it misrepresents the evidence strength.
      A DEPARTURE in the 4-5 SE band is not trustworthy at n = 8; the two qualifying
      real_bkz departures are at 6.37 and 6.54 with 8/8 sign consistency and survive
      the null-SE substitution, so they are not in that band.
    - P3 sees ONE thing. AGREEMENT from P3 is a statement about V at the stated floor.
      Third-order and higher structure, off-diagonal patterns at fixed total energy,
      and alignment with any secret direction are invisible to it at any n. The
      producer states this (section 8.2) and it is correct.
    - V is a property of a basis PRESENTATION, not of a lattice. A P3 DEPARTURE on
      real_bkz at d = 140 says the tail GSO frame of those bases from that pipeline
      has excess coordinate-participation dispersion. Nothing more.
    - >-
      Cosmetic defect, producer-disclosed in section 8.7 -- for the graded t = 0 anchor
      all 8 frames give the identical exact V, so SE ~ 0 and separation.json records
      z ~ 3e16 and floor 0.0. Read as "exactly determined". Verdict and value are correct.
      A successor should flag SE == 0 as degenerate rather than dividing.
  C3:
    verdict: NOT DISCHARGED. Nothing in this batch discharges C3, and no producer
      claims otherwise -- both say so explicitly and both are right.
    C3_as_written: >-
      "The projected-error left-tail measurement with its pre-registered prediction
      adjudicated to one of three declared branches: the Beta tail law holds at the
      measured cells; it fails by a measured factor; or NEITHER, with the sensitivity
      demonstration's failure recorded as an INSTRUMENT outcome. AGREEMENT SATISFIES
      C3 AS FULLY AS DEPARTURE."
    why_it_is_still_unmet:
    - The AM-1 demonstration's own declared verdict is INVALID in two cells, so the
      instrument does not certify itself under the rule frozen to govern it. Under
      prereg.md section 7.5(3) the real arms are measured but NOT interpreted, so no
      adjudication of the Beta tail law is available from this batch at all.
    - Even a VALID demonstration would not have discharged C3 on this instrument.
      T2 at 8 draws is 9-13x too coarse to resolve the residual that actually survives
      reduction (item 5). Its AGREEMENT is an upper bound above the effect it would
      need to see, and DEC-20260806-00deff makes an upper-bound-reported-as-absence
      unacceptable in this goal. A bound of zero is a bound only if it is a bound
      below the thing being bounded.
    - P3 adjudicates V, not the projected-error left-tail law. It is an instrument
      admissibility result under AM-2, not a measurement of the object C3 names.
    what_HAS_moved_and_should_be_recorded:
    - The reason EV-MLKEM-94f036 gave for C3 being UNMET -- that "the frozen sensitivity
      demonstration manipulated the error law while the null removed the projector, so
      it could not demonstrate sensitivity to the object under study" -- is now GONE.
      The AM-1 graded family is projector-side, the gate crossing falls inside the
      sampled range in all four cells, G1 clears at 47.80-77.24 SE and G2 does not fire
      anywhere. Sensitivity to the object under study is demonstrated. What remains
      unmet is a monotonicity criterion whose threshold fires on a flawless instrument
      with probability 0.99.
    - The notarization defect is closed by construction (item 1).
    - >-
      The detection floor is now MEASURED rather than asserted, in two independent
      instruments and two unit systems. AM-1 reports bracket midpoints of 2.2080 /
      1.6084 / 2.8510 / 2.1074 in V-units for T2, and P3 reports 0.069081 / 0.076887 /
      0.086902 / 0.067925 for the same four cells. P3's floor is 25-30x lower, and
      lower than the residual it measures (0.111-0.138 at d = 140), which is precisely
      the condition T2 fails.
    shortest_remaining_path_to_C3_that_i_can_see:
    - Re-run the AM-1 demonstration with G3 denominated in gate-commensurable units,
      pre-registered and notarized on this batch's split-producer pattern. On the data
      already in hand that yields PARTIAL in all four cells, but it must be declared
      in advance to count, and the counterfactual in item 3 must NOT be cited as a result.
    - Adjudicate the Beta tail law with an instrument whose floor sits below the residual.
      P3 is that instrument for V. Whether an analogous exactly-computable statistic
      exists for the left-tail quantile C3 actually names is open and is the question
      worth asking next.
    - Run k != d/2. It is named as unevaluated in EV-MLKEM-94f036, in the AM-1
      could_not_evaluate block, in DEC-20260806-00deff next_actions, and in the AM-2
      report's section 8.5 -- four records, no run. It is the cheapest discriminating
      test outstanding in this goal and it is the largest single hole in L2's support.
      It should be carried as a first-class task, not a carriage note, in the next batch.

