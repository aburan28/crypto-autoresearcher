  method: >-
    I did NOT read the producer's per-frame values before computing my own. I wrote
    an independent script (validator scratchpad, outside the repository) that sets
    the fplll seed 700000 + d*1000 + beta*10 + i, builds IntegerMatrix.random(d,
    "qary", k = d//2, q = 3329), takes the tail-beta GSO frame as the last beta
    columns of Q from QR(B^T) at each of the three reduction stages (raw, after
    LLL, after BKZ-beta with max_loops = 2), draws the Haar arm from
    default_rng(900000 + d*1000 + beta*10 + j), and evaluates
    V = sum_a (P_aa - beta/d)^2 with mu_0 from the closed form.
    fpylll 0.6.4, numpy 2.4.6, Python 3.11.15 -- the versions the run manifest records.
  cell_d140_b30:
