# ---------------------------------------------------------------- objection
self_reported_objection:
  status: >-
    Recorded under prereg.md section 7.5, which permits an objection PROVIDED the
    frozen specification is run regardless. It was. The verdicts above stand
    exactly as the frozen rule computes them.
  objection: >-
    The paired SE_step and the gate's SE_diff are not commensurable, and both G3
    FAILs live where the gate has no resolution. Because (S_j, G_j) is shared
    across t, adjacent frames at large t are nearly the same frame, so paired step
    differences are strongly correlated and SE_step_paired becomes very small.
    The d140_b40 step t=0.5->1.0 is +0.001246 absolute against a gate width of
    ~0.0057 at those points, yet scores +2.171 SE_step. The d100_b30 step
    t=0.05->0.1 is +0.000608 against a gate width of ~0.0058, scoring +1.343
    SE_step. In BOTH cases neither endpoint clears its gate, i.e. they are frames
    the same design declares to carry no information.
  what_it_is_not: >-
    Not a request to change either threshold, not a claim that the PARTIAL
    reading is correct, and not a reason to discount the INVALID verdict.
  forward_guidance: >-
    A successor wanting G3 and the gate to speak the same language must state the
    relation between SE_step and SE_diff IN ADVANCE, before seeing which steps
    violate.

# ---------------------------------------------------------------- limits
could_not_evaluate:
- item: k != d/2
  why: >-
    L2 puts the spill boundary at beta <= k, the superseded mechanism at
    beta <= d-k; both tested d have k = d/2, so they are numerically
    indistinguishable in every cell here. The prereg names this the cheapest
    falsification of L2 and places it OUT OF SCOPE. Not tested, not claimed.
    It remains the largest single hole in L2's support.
- item: matched real arm at beta > 40
  why: budget; see budget.budget_bounded_gap. Infrastructure limit, not a result.
- item: whether the notarization closes the EV-MLKEM-94f036 harness gap
  why: the prereg assigns that judgement to the validator against the git record. Hashes and ancestry reported; no verdict offered.
- item: any statistical statement about the LLL/BKZ V residuals
  why: >-
    Exactly computed and positive at 5.5-13.0 sd of the frame mean, but the
    sampling layer cannot resolve their effect on r(2^-10) at 4 SE; roughly 1000
    frames per arm would be needed against the 8 this design runs. Not attempted.

