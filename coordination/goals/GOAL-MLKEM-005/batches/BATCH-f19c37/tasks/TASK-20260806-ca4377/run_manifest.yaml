# ---------------------------------------------------------------- seeds
seeds:
  fplll_basis: 700000 + d*1000 + beta*10 + i
  numpy_cbd_error: 20260805 + d  (PCG64)
  numpy_haar: 900000 + d*1000 + betap*10 + j
  numpy_graded: 500000 + d*1000 + betap*10 + j
  numpy_gauss_error: 20260806 + d  (PCG64)
  note: These five families are the ONLY sources of randomness in the run. All carried unchanged from BATCH-436ddd.
  graded_path_draw_order: >-
    prereg.md 1.1 requires (S_j, G_j) to be drawn BEFORE and INDEPENDENTLY of the
    t list. measure.py hoists the draw into graded_paths(d, beta, n_draw) and
    reuses the result across every t. This is bit-identical to BATCH-436ddd's
    graded_frames (fresh rng per j, then choice, then standard_normal, with t
    consumed only afterwards) and makes the independence structural. The
    consequence is verified, not asserted: all 24 shared points are bitwise
    identical across the two runs.
  reduction_cache:
    state: ABSENT, as the task card states. No .npz file exists anywhere in the repository.
    action_taken: >-
      THE SEEDS ARE THE CACHE. All 32 reductions regenerated from seed_basis at
      fpylll 0.6.4, costing 1058.32 of this task's 1898.56 core-seconds.
    verification:
      vs_BATCH_436ddd: {n_compared: 32, max_b0_norm_rel_dev: 0.0, max_gso_log2_slope_abs_dev: 0.0}
      vs_BATCH_a51f91: {n_compared: 32, max_b0_norm_rel_dev: 0.0, max_gso_log2_slope_abs_dev: 0.0}
      verdict: EXACT against BOTH predecessors. The same 32 lattices.

# ---------------------------------------------------------------- config
configuration:
  cells: [[100, 30], [100, 40], [140, 30], [140, 40]]
  k: d/2
  q: 3329
  error_law: CBD_{eta=2} (FIPS 203), plus an iid N(0,1) law for the null of the null
  errors_per_cell: 1048576          # 2^20
  draws_per_arm: 8
  bases_per_cell: 8
  reduction: LLL, then BKZ-beta with max_loops=2, pruning-free in-process strategies
  statistic: R = ||Q^T e||^2 / ||e||^2, Q the orthonormal tail-beta GSO frame
  quantile_estimator: q_emp(p) = sort(R)[round(p*N)-1]   # frozen in BATCH-a51f91
  tail_levels: [2^-10, 2^-16]
  gate: 'abs(mean_A - mean_haar) >= 4.0 * sqrt(sd_A^2/8 + sd_haar^2/8)'   # pooled two-arm SE
  graded_t: [0.0, 0.0025, 0.005, 0.0075, 0.01, 0.015, 0.02, 0.03, 0.05, 0.1, 0.25, 0.5, 1.0]
  graded_t_provenance: DEC-20260806-00deff AM-1 new_grid, verbatim, 13 points
  g3_rule: >-
    TIE-TOLERANT at 1.0 * SE_step. PASS if no step increases; TIE if every
    increase is within 1.0 SE_step; FAIL if any exceeds it. Adjacency is
    IRRELEVANT. SE_step computed BOTH paired and unpaired, both reported, and the
    MORE SEVERE reading recorded (FAIL > TIE > PASS).
  beta_trend_betas: [30, 40, 50, 60]
  beta_trend_reduction_held_fixed_at: LLL + BKZ-40
  arms:
  - haar_null
  - real_bkz
  - lll_only
  - unreduced
  - graded_t{0, 0.0025, 0.005, 0.0075, 0.01, 0.015, 0.02, 0.03, 0.05, 0.1, 0.25, 0.5, 1.0}
  - '<haar_null, unreduced, lll_only, real_bkz, graded_t0, graded_t0.5 under an iid N(0,1) error>'
  added_relative_to_BATCH_436ddd:
  - V = sum_a P_aa^2 - beta^2/d, computed EXACTLY (zero error draws) for every frame touched
  - the detection floor as a MEASURED bracket in V units, per cell
  - L2 (the geometry law) evaluated at each frame's own exact V, zero fitted parameters
  - F-A scored twice, with the 25-point NOVEL subset separated from the reproduction subset
  - the shared-point reproduction check against BATCH-436ddd

