producer_reported_outcome_recorded_verbatim_not_endorsed:
  decision_branch: DATA-UNAVAILABLE-BLOCKED
  smoke_test: Measured average cost 1.9574 s/vertex at p=21601 (3 vertices, both-sided tables,
    B=23/X=23, ~284-328 Phi_ell evaluations per vertex-pair including ell>2). All 3 resolved;
    largest bound in sample 5 vs theoretical ceiling ~22.10.
  truncation_fallback: Fired. Applying the pre-registered T_prime=300s formula using ONLY
    the single largest-prime per-vertex measurement (never re-measured per prime, per the
    non-improvisation rule), even the SMALLEST prime (2437, 194 vertices needing search) estimated
    at ~379.7s > 300s. The ascending-prefix confirmatory set is therefore EMPTY (0 of 12 primes).
  phi_ell_sourcing: Succeeded. All Phi_ell for ell in {3,5,7,11,13,17,19,23} fetched from
    Sutherland's classical modular polynomial database, vendored and logged. Phi_23 independently
    verified via a from-scratch Velu-formula route (3/3 test curves); Phi_3 verified as an
    additional sanity check; Phi_2 cross-checked exact match against BATCH-003's independently-sourced
    polynomial.
  c_search_bias: Run regardless of the Phase -1 outcome, at p=2437, 20 sampled vertices. True-target
    arm correlation=0.0961; random-target arm=0.0308 (both weak/near-zero, n=20). Producer
    flags these as 'comparable' under the contract's own disclosed comparability rule, though
    this does not change the terminal branch since the Phase -1 gate is checked first.
  descent_metrics_not_run: 'C-NULL-LABEL and M-GAMMA-GREEDY/RANDOM/M-GAP were NOT run: both
    require a full per-vertex delta_E multiset for >=4 primes, which does not exist under
    DATA-UNAVAILABLE-BLOCKED.'
  anomaly_A1_flagged_by_producer: An informal, non-official development-time measurement at
    the SMALLEST prime suggested a lower per-vertex cost that might have passed T_prime --
    explicitly NOT substituted for the official largest-prime measurement per the frozen non-improvisation
    rule, and flagged by the producer itself as a design tension for a possible future amendment,
    not smoothed over.
