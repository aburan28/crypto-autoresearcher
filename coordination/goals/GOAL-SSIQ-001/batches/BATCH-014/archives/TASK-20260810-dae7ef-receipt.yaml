- check: g0c_comparison_independently_reverified_against_run_h
  result: PASS
  detail: >-
    G-0c's defer rests on a comparison against RUN-SSIQ-a85692-h's archived
    environment.json. That archived file was read DIRECTLY and independently
    rather than trusted from the execution report, and it genuinely records
    platform "Linux-6.18.5-fc-v18-x86_64-with-glibc2.39" and
    cpus_available 4. The execution host recorded by RUN-k is
    "macOS-26.6-arm64-arm-64bit-Mach-O", machine "arm64",
    os.cpu_count() = 14. All three compared dimensions (OS family, ISA, CPU
    count) mismatch. THE GATE FIRED ON TRUE ARCHIVED DATA, NOT ON A MISREAD
    OR A MISSING FILE. Gate order was the exact frozen order
    [G-0c, G-0, G-0b, G-1, G-2, G-2b, G-3]; G-0c fired on first evaluation
    and G-0/G-0b/G-1/G-2/G-2b/G-3 were never evaluated, as the frozen
    contract's own first-fires-wins structure requires.
- check: graph_identity_step0_verified
  result: PASS
  detail: >-
    STEP (0)'s graph rebuild and two-part graph-identity re-verification ran
    and PASSED BEFORE G-0c was evaluated: n_built_vertices = 203 (archived
    203), degree_sequence_check.pass = true, vertex_count_match = true. This
    was the ONLY genuine in-session computation performed against the
    p = 2437 graph. It establishes that the instrument was correctly
    assembled on this host; it establishes nothing about delta_E.
- check: certificate_and_scale_labelling
  result: PASS
  detail: >-
    certificate.kind = "none", with the run's own statement that this is a
    pure measurement/probe run claiming no discrete log, no factor-base
    relation, and no solved isogeny problem instance -- correct for a run
    that computed nothing but a graph rebuild. scale_qualifier reads
    "toy; N (graph size) = 203; single prime p=2437". Both are consistent
    with docs/claims-and-verification.md and neither asserts above its tier.
- check: stderr_empty_corroborated
  result: PASS
  detail: >-
    execution_report.yaml states stderr.log is empty. Independently
    corroborated by hash rather than by reading the claim: stderr.log's
    sha256 is
    e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855, which
    is the sha256 of the empty string.
- check: disclosed_deviations_reviewed
  result: PASS_HONESTLY_DISCLOSED
  detail: >-
    THREE deviations were disclosed by the Executor rather than silently
    absorbed, and each is reproduced here without softening.
    (1) INFRASTRUCTURE_ERROR: `ulimit -v 2097152` -- the mechanism by which
    the frozen budget.maximum_memory_gb = 2 was enforced for runs a..j -- is
    unsupported on macOS (setrlimit rejects RLIMIT_AS), so it was NOT
    applied. The binding cap actually in force was `timeout 1000`. The
    frozen memory bound was therefore UNENFORCED on this run. Its practical
    effect is nil for this specific run (one 203-vertex graph build, then
    defer), but the enforcement gap is real and is left to the Validator to
    test rather than dismissed here.
    (2) SPECIFICATION_ERROR (ambiguity in frozen text, reported not
    guessed): specification_v11's load_defer_gate_v11 does not pin down
    whether CAL-1/CAL-2 run BEFORE G-0c is evaluated, or whether G-0c gates
    whether they run at all. The Executor adopted the latter reading (G-0c
    gates), yielding cal1_records = [] and cal2_records = []. This
    Coordinator finds the reading defensible on three independent grounds
    stated by the Executor -- G-0c's own frozen text "FIRST, BEFORE ANY
    CALIBRATION IS INTERPRETED"; the frozen defer-artifact language "to
    whatever extent they exist"; and the dispatching handoff
    TASK-20260808-d458a3's own stated evaluation order -- but it is an
    interpretation of ambiguous frozen text, not a settled reading, and it
    is named explicitly in the Validator handoff TASK-20260810-098fad as a
    thing to attack.
    (3) SPECIFICATION_ERROR (citation drift, no functional effect): the
    frozen spec cites "AGENTS.md rule 3" for the timeout/environment-failure
    principle; the live AGENTS.md numbers that identical principle as rule 5.
    Numbering drift only; the principle invoked is the same one and its
    application here is unaffected.
non_official_observation:
  status: NOT_A_MEASUREMENT_OF_RUN_SSIQ_a85692_k
  boundary: >-
    THE FIGURES BELOW ARE NOT RUN-k's OFFICIAL MEASUREMENTS AND MUST NEVER BE
    CITED AS SUCH. They come from a PRE-EXECUTION VERIFICATION exercise that
    was explicitly not part of the official run and was never written into
    the run's own artifacts. RUN-SSIQ-a85692-k's official measurement set is
    empty of timing data beyond its own 0.1884760856628418 s wall clock:
    n_sweep_points_attempted/succeeded/failed = 0/0/0, cal1_records = [],
    cal2_records = []. Any record, review, or later citation that reproduces
    these numbers must carry this boundary with them.
  what_was_observed: >-
    The pre-execution exercise ran CAL-1 standalone on this host: 8 records,
    0 timed out, measured wall range [0.5095, 0.5937] s against the archived
    reference range [1.1499, 1.3147] s, giving a measured/archived ratio
    range of [0.4308, 0.4703]. That is, this host is roughly 2.0x-2.3x
    FASTER than the archived reference host on this exact workload.
  why_it_matters: >-
    specification_v11's own text states that the b = 1.10 s arm's
    "guaranteed truncated" control rests on the execution host NOT being
    faster than the archived host, and that the margin protecting that
    control is only 49.93 ms (4.3%). A ~2x speedup would very plausibly have
    broken that control outright had the sweep been allowed to run. This is
    measured vindication of the round-3 reviewer's required G-0c control:
    the gate did not merely fire on a bureaucratic host-identity mismatch,
    it fired on a host difference large enough to invalidate a
    pre-registered control. It is recorded here as a non-official
    observation precisely so that a reviewer can weigh it without any record
    treating it as data RUN-k produced.
