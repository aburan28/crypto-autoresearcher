process_deviation:
  id: PD-ARCH-BATCH-014-producer-committed
  severity: named_deviation_recorded_not_waived
  what_the_frozen_process_requires: >-
    The COORDINATOR makes the snapshot commit of the producer's declared run
    package, before any independent reviewer reads it, with the receipt
    committed inside that same commit (commit_sha: null, "Null by
    construction"). That is this goal's own immediately preceding precedent:
    BATCH-013's TASK-20260806-5af708-receipt.yaml.
  what_actually_happened: >-
    The Executor committed its own run package at 5471247e6. By the time this
    Coordinator opened the package, the artifacts were already in history.
    This receipt is consequently authored after the fact and must be
    committed separately.
  what_is_preserved: >-
    The snapshot-before-review INTEGRITY property is preserved. The ten
    declared artifacts are immutably frozen at 5471247e6; their sha256 values
    are declared verbatim in path_sha256 below and were independently
    computed by the orchestrating session from the working tree, which
    `git diff --stat 5471247e6 -- <run dir> <impl file>` shows is EMPTY
    against that commit. No independent reviewer has read the package: the
    two review handoffs (TASK-20260810-098fad validator, TASK-20260810-971cfa
    red team) are written as pending and were not dispatched by this session.
  binding_basis: >-
    Per CLAUDE.md "Archive receipts bind to CONTENT first", commit
    reachability is advisory and declared content hashes are authoritative.
    5471247e6 is in fact reachable, so both bindings hold here; but the
    binding this receipt RESTS on is the content hash set, and this archive
    is properly characterized as CONTENT-VERIFIED.
  what_is_genuinely_lost: >-
    The Coordinator's ability to inspect the package BEFORE it entered
    history. Every check in coordinator_precommit_checks below was performed
    AFTER the producer commit existed, so none of them could have prevented a
    defective package from entering the repository -- they could only have
    detected one already there. The name "precommit" is retained for schema
    compatibility with BATCH-013 and is, for this batch only, a misnomer:
    read it as "pre-REVIEW checks". This is stated so a later reader does not
    infer a stronger gate than was applied.
  not_a_finding_against_the_executor: >-
    Recorded as a process deviation in the archival chain, not as a defect in
    RUN-SSIQ-a85692-k. The run package itself was found clean on every check
    below.
