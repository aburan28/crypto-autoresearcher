    evidence_id or outcome, and asserts none. Closing state lives in the
    write-once checkpoint shard ledger/goals/GOAL-SSIQ-001/checkpoints/BATCH-014.yaml,
    which is NOT touched by this archive, and is recorded by a later closing
    decision and a superseding record, never by editing that shard.
  writes_no_evidence_record: >-
    NO EV-* IS WRITTEN, GRADED, OR IMPLIED. No evidence strength (anecdotal /
    preliminary / replicated / strong) is asserted anywhere by this task. A
    reviewer verdict committed here is a committed report, not a graded evidence
    record.
  moves_no_hypothesis: >-
    H-SSIQ-36e970 DOES NOT MOVE, and neither does any other hypothesis. It
    remains at whatever status it already carries.
  completes_no_goal: >-
    GOAL-SSIQ-001 is not completed, not paused, and not closed_at_budget by this
    task. No completion criterion is claimed met, no attestation was obtained,
    and none is recorded. latest_verified_commit is NOT updated here.
  adjudicates_nothing: >-
    The Coordinator states NO verdict of its own in this receipt, selects
    NEITHER forward branch (A) matched host nor (B) re-baselined reference from
    DEC-20260810-616fd5's next_actions, adopts NO reviewer recommendation, and
    makes NO approval determination. In particular the Red Team's RC-2 finding
    and its recommended option (C) are recorded below as WHAT THE REVIEWER SAID,
    not as a Coordinator adoption. Where the returned reviews contradict
    DEC-20260810-616fd5 -- which both handoffs explicitly invited them to do --
    that contradiction is committed verbatim and adjudicated LATER, in a
    decision written against this committed, hash-bound reviewer text. It is not
    adjudicated by the act of filing it.
  why_the_split_is_honest: >-
    Separating this archive from the evidence record and closing decision is
    deliberate: it lets the reviewers' output become durable and hash-bound
    BEFORE anyone writes the evidence record that will cite it, so that record
    is authored against committed text rather than against recollection.

