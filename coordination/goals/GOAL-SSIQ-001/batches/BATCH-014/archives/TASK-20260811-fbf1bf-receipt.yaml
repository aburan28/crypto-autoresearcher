reviews_archived:
- review: validator
  task_id: TASK-20260810-098fad
  report_id: VAL-20260810-098fad
  paths:
  - coordination/goals/GOAL-SSIQ-001/batches/BATCH-014/reviews/VAL-BATCH-014.md
  - coordination/goals/GOAL-SSIQ-001/batches/BATCH-014/reviews/TASK-20260810-098fad/validation_report.yaml
  verdict_string_verbatim: valid
  verdict_role_contract_equivalent_as_recorded_by_the_reviewer: passed
  reported_gate_recomputation: >-
    The Validator reports independently recomputing the gate outcome as
    DEFERRED_AT_G0C, MATCHING the recorded outcome. It states it applied the
    frozen G-0c text itself to raw recorded host data and to RUN-h's directly
    read environment.json, and found all three compared disjuncts fire
    INDEPENDENTLY (platform prefix, ISA, CPU count) and that the frozen clause
    MANDATES a defer rather than merely permitting one.
  reported_check_outcomes: >-
    VC-1, VC-2, VC-5, VC-6, VC-7 and VC-8 confirmed. Under VC-8 the reviewer
    reports recomputing ALL TEN of the snapshot receipt's declared hashes and
    finding all ten matching, though the card asked for a minimum of three.
  reported_vc3_outcome: >-
    ANSWERED. The reviewer reports finding BOTH CAL-1/CAL-2 orderings admissible
    and the frozen document SELF-CONTRADICTORY between lines 1844 and 1386, but
    the two readings OUTCOME-EQUIVALENT BY CONSTRUCTION for this contract in
    general. It states explicitly that this is a different finding from "the
    Executor guessed correctly".
  reported_vc4_outcome: >-
    PARTIALLY ANSWERED, with the boundary named rather than the gap dropped.
    Part 1 the reviewer reports as SETTLED ANALYTICALLY: an enforced RLIMIT_AS
    on this un-try/except-ed code path could only have DELETED the artifact,
    never perturbed a value inside a written one. Part 2 the reviewer reports as
    NOT PERFORMED, because settling the run's peak memory would require an
    execution its own task constraints forbade it to run, and it substitutes no
    estimate for the missing measurement. Within part 2 it reports TESTING AND
    REJECTING the Coordinator's own "trivially far under 2 GiB" characterization
    as UNESTABLISHED, on the ground that it reasons from workload size to a
    bound on virtual address space, which are different quantities.
  reported_findings: >-
    Five findings, F-1 through F-5, all recorded by the reviewer as minor,
    non-material, or limitations of the frozen contract's own checks, and none
    as an evidence-integrity defect against the run.
  coordinator_position: >-
    NONE TAKEN. The Coordinator neither adopts nor contests the verdict, the
    recomputation, VC-4's rejection of its own prior characterization, or any of
    F-1..F-5. Reading them is a later decision's work.

- review: red_team
  task_id: TASK-20260810-971cfa
  report_id: RT-BATCH-014
  paths:
  - coordination/goals/GOAL-SSIQ-001/batches/BATCH-014/reviews/RT-BATCH-014.md
  verdict_string_verbatim: CHALLENGE-narrow
  reported_basis_for_not_blocking: >-
    The reviewer states it is not BLOCK and not for politeness: it reports
    recomputing 10/10 declared hashes and finding them matching, the tree clean
    under git status --porcelain over experiments/ and coordination/, and the
    declared path set exactly equal to specification_v11.yaml's own
    required_artifacts list plus the one new implementation module.
  reported_surviving_findings:
  - id: RC-2
    reported_as: SUSTAINED
    reported_content: >-
      The reviewer reports that every branch of load_defer_gate_v11 EXCEPT G-0c
      is one-sided against a SLOW host, and that NO LOWER BOUND ON F_cal EXISTS
      ANYWHERE in the gate. It reports recomputing from RUN-h's own records a
      minimum wall time of 1.149932861328125 and a count below 1.10 s of 0, so
      the b = 1.10 s "guaranteed truncated" control breaks at a 4.34 % speedup.
      Because G-0c compares identity and ignores clock speed, it reports that a
      newer matched Linux/x86_64/4-CPU host passes every gate branch and reaches
      G-3 PROCEED, CLEAN while silently invalidating the control. It therefore
      states that FORWARD BRANCH (A) IS INADEQUATE as stated.
  - id: RC-3
    reported_as: NOTHING STRANDED, THREE RECORDS NEED FOOTNOTES
    reported_content: >-
      The reviewer reports that re-baselining strands NO prior conclusion, but
      that three records cite a host-specific constant as though it were an
      instrument constant and each needs a re-derivation footnote:
      EV-SSIQ-48d274, EV-SSIQ-c3df82 observation O-2, and EV-SSIQ-69ba8b
      observation O-4. It reports all three rescuable from already-committed
      data at ZERO COMPUTE and with no re-run, and reports verifying the
      load-bearing rescue DIRECTLY from RUN-j's own artifact: 194/194 timed out
      at every budget, resolved-and-not-timed-out = 0/0/0.
  - id: RC-4
    reported_as: THE CONTRACT PRE-REGISTERED A DO-NOT-DISPATCH RULE AND THE CHECKLIST OMITTED IT
    reported_content: >-
      The reviewer reports that specification_v11.yaml's contribution_accounting_v11
      pre-registered, in frozen text, a do-not-dispatch rule for exactly this
      condition and named round-4 verification as where it applies; that no item
      of the round-4 checklist asks whether G-0c CAN BE SATISFIED on the
      executing host; and that the Coordinator's own PF-26 correction record,
      dated the freeze date, already recorded the orchestration host as 14 arm64
      Darwin cores. Its conclusion as stated: dispatching was the error and the
      gate caught it. The reviewer states EXPLICITLY that this is NOT a finding
      against the Executor.
  - id: RC-1
    reported_as: THE PRE-REGISTERED DEFER YIELD WAS HALF DELIVERED
    reported_content: >-
      The reviewer reports that contribution_accounting_v11 pre-registered TWO
      yields on a defer and only one landed, so describing the outcome as "fully
      successful" overstates it BY EXACTLY ONE PRE-REGISTERED ITEM. It states
      this holds under either side of the CAL ordering ambiguity, which it does
      not adjudicate.
  reported_forward_recommendation:
    reviewer_option: (C)
    reported_content: >-
      The reviewer recommends adding a LOWER-BOUND branch to load_defer_gate_v11
      that defers if the load-adjusted predicted count at b = 1.10 s exceeds 0.
      It reports that the artifact ALREADY CARRIES that value keyed "1.1" and
      that NO GATE BRANCH READS IT, so the change costs ZERO COMPUTE and needs
      no new host; on its account this makes forward branch (A) safe and branch
      (B) optional.
    coordinator_status: >-
      RECORDED, NOT ADOPTED. No forward branch is selected by this archive and
      option (C) is not approved, scheduled, or endorsed here. It becomes a
      Coordinator position only if and when a later decision record, written
      against this committed reviewer text, says so.
  coordinator_position: >-
    NONE TAKEN on RC-1, RC-2, RC-3, RC-4, on any of the reviewer's numbered
    objections OBJ-1..OBJ-10 or required controls C-1..C-7, or on the
    CHALLENGE-narrow verdict itself.

