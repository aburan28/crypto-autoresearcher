# =====================================================================
# WHAT THE REVIEWERS RETURNED
# Recorded as REPORTED CONTENT, with attribution. The Coordinator neither
# endorses nor disputes any item below; every one is a pointer into committed,
# hash-bound reviewer text that a later decision must read for itself.
