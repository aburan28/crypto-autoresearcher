    later_branches: >-
      G-0, G-0b, G-1, G-2, G-2b, G-3 are unreachable once G-0c fires: the
      frozen branches are an else-chain and the module implements that
      structure exactly. The recomputed branch is identical under BOTH
      admissible readings of the CAL-1/CAL-2 ordering (see VC-3).
    epistemic_boundary: >-
      Recomputed as a check on the gate's operation only. A gate defer is an
      infrastructure outcome under AGENTS.md rule 5, never negative
