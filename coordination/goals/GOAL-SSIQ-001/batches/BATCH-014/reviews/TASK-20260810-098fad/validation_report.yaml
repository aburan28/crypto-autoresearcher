        classification: "FINDING F-5: a limitation of the frozen check, not a defect of the run. Contract-compliant - the frozen text names verify_graph_identity and the Executor called it unchanged."
      scope_statement: "What step (0) establishes is that the instrument was assembled to the right shape on this host. Nothing more, and nothing about delta_E."

    - id: VC-7
