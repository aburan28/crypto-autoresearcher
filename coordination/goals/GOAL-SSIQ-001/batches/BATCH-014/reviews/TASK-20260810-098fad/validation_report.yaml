    as partially answered rather than passed, with the boundary named.
  verdict_scope_note: >-
    A `valid` verdict means this package is admissible evidence OF ITS OWN
    EXECUTION. It does not support any ECDLP or isogeny claim, does not
    demonstrate a speedup, and does not authorize promotion, an EV-* record,
