    - id: VC-3
      outcome: answered
      title: Whether the disclosed CAL-1/CAL-2 ordering interpretation could have changed the recorded outcome
      sub_answers:
        a_other_reading_admissible:
          answer: yes
          basis: >-
            The frozen document contradicts itself at line level.
            load_defer_gate_v11's opening (line 1844) says the gate "is
            evaluated immediately after step (0b)'s host capture AND
            CALIBRATION", which is the ungated reading;
            pre_freeze_review.round4_verdict (d) (line 1386) says G-0c is
            "evaluated FIRST ... immediately after step (0b)'s HOST CAPTURE",
            which is the gated reading. Both are frozen text.
          further_support_for_ungated_reading_not_previously_cited:
            - "spec budget note (~line 2216): 'IF A DEFER BRANCH FIRES the run costs roughly 140 s (host capture plus CAL-1 and CAL-2 worst case) and produces the calibration and host facts and nothing else'."
            - "TASK-20260808-d458a3 completion gate: 'If deferring: the specific gate branch that fired, the measured values that triggered it, and the ~140s calibration cost ...'."
            - "RT-PREFREEZE-...-round3.md, the review that invented the gate, asked for G-0c 'ordered with the other infrastructure branches' G-0/G-0b, which by construction read calibration output."
          strongest_support_for_the_executors_gated_reading_identified_by_this_validator:
            clause: "PF-29(b), specification_v11.yaml lines 1968-1973"
            text: "'on G-0c or G-0 they may be uncomputable (no CAL-1 ratios, or only timed-out ones)'"
            argument: >-
              Under the ungated reading CAL-1 always produces eight records
              before G-0c is evaluated, so "no CAL-1 ratios" is unreachable
              except in the all-timed-out case, which is the second disjunct -
              making the first redundant. Under the gated reading the two
              disjuncts map one-to-one onto G-0c and G-0. Read against
              surplusage, PF-29(b) favours the Executor's reading. Neither the
              Executor nor the Coordinator cited it.
          assessment_of_executors_stated_grounds: >-
            (i) 'BEFORE ANY CALIBRATION IS INTERPRETED' is weak and arguably
            points the other way, since "interpreted" is distinct from "run".
            (ii) 'to whatever extent they exist' is suggestive but equally
            satisfied by the G-0/G-0b/G-1 branches. (iii) economy is an
            argument about what the contract should say. (iv) the dispatching
            handoff is defective on two counts - see FINDING F-4. The
            Coordinator's "defensible on three independent grounds" is
            overstated; the conclusion (defensible) is nonetheless right, on a
            ground nobody in the chain identified.
        b_could_it_have_changed_the_recorded_outcome:
          answer: no
          strength: >-
            OUTCOME-EQUIVALENT BY CONSTRUCTION, for this contract in general -
            not merely on this run. This is explicitly a different finding
            from "the Executor guessed correctly".
          proof:
            - "evaluate_g0c's inputs are the run-start host capture and RUN-h's environment.json only (module lines 354-412); no calibration output enters it."
            - "the host capture is taken at run start, before STEP (0); platform/machine/cpu_count are load-invariant, so running CAL-1/CAL-2 first cannot change any G-0c input."
            - "the frozen branches form an else-chain (G-0 'Else if', G-0b 'Else if', G-1 'Else if', G-3 'Else'); once G-0c fires no later branch applies under either reading."
          what_would_have_differed: >-
            Artifact richness only: cal1_records would hold 8 entries,
            cal1_summary / f_cal_seconds /
            measured_load_inflation_ratio_median_non_timed_out would be
            populated, and load_adjusted_predicted_counts would carry integers
            instead of null-with-reason. gate_g0_result / gate_g0b_result /
            gate_g1_result would still be null, since those branches are never
            EVALUATED under either reading.
          outcome_shopping_cross_check: >-
            Tested adversarially: the Executor's pre-execution exercise had
            established before the official run how the later branches would
            resolve on this host, so the interpretation choice could in
            principle have been outcome-selection. It could not be. G-0c heads
            an else-chain and fires unconditionally on this host under either
            reading, so every later branch - including any proceed branch - is
            unreachable. There is no reading of the frozen text on which this
            run reaches a sweep. Clean.
        c_downstream_dependency_on_non_empty_cal1_records:
          answer: none
          basis: >-
            PF-29(b) explicitly provides for null-with-reason LAC on a G-0c
            defer; the closed list says "to whatever extent they exist"; the
            BATCH-010 in-band obligation requires the CAL-1/CAL-2 records to
            be PRESENT, which empty lists satisfy; reading rules P-1/P-2/P-3
            are per sweep point and there are none; P-4 forecloses any reading
            regardless.
          non_contractual_loss: >-
            RUN-k's own artifacts record the FACT of a host mismatch but no
            measured MAGNITUDE of host difference. G-0c is defined on identity,
            not magnitude, so the gate is unaffected.
        d_should_the_frozen_text_be_amended:
          answer: yes
          reason: >-
            Independently of (b). A frozen contract that contradicts itself at
            lines 1386 and 1844 forced an Executor to interpret rather than
            execute, and the ambiguity bites only on the branch where the
            contract is least observable.
          requested_amendment_items:
            - "pin the CAL-1/CAL-2 vs G-0c ordering in one sentence"
            - "make the defer-cost note branch-specific rather than a flat ~140 s"
            - "list graph_identity_verification and the schema-null gate fields explicitly in the closed list (F-1)"
            - "resolve the caveats-list conflict on defer branches (F-2)"

    - id: VC-4
      outcome: partially_answered
      title: Whether the unenforced `ulimit -v` genuinely had no effect on this run
      not_performed_component:
        what: "Establishing the run's actual peak memory / peak address space."
        why_not_performed: >-
          No peak-memory figure of any kind was measured
          (manifest.yaml resources.peak_rss_bytes: null, "not instrumented";
          environment.json resource_caps_applied.address_space_ulimit_kb:
          null). Settling it would require executing the module under
          instrumentation, and this task's constraints forbid re-running the
          artifacts under review ("do not originate, edit, repair, or re-run
          the artifacts under review"). Reported as not-performed with the
          reason rather than silently dropped, and NO estimate is substituted
          for the missing measurement.
      what_was_actually_executed:
        source: experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-k/command.txt (lines 118-122)
        command: "timeout 1000 python3 delta_e_floor_straddling_sweep_v11.py --run-dir <run dir> > stdout.log 2> stderr.log"
        ulimit_present: false
        binding_cap_in_force: "timeout 1000 (wall clock) only"
      part_1_could_it_have_altered_any_recorded_value:
        answer: no
        status: settled_analytically
        argument:
          - "`ulimit -v` sets RLIMIT_AS; its only effect is to make an allocation fail once address space exceeds the cap, raising MemoryError."
          - >-
            The G-0c code path (imports -> host_capture -> STEP (0) build +
            verify -> read RUN-h environment.json -> evaluate_g0c -> write two
            JSON files) is not wrapped in try/except anywhere, by the module's
            own frozen discipline (docstring lines 63-78, code lines 812-825).
            A MemoryError therefore propagates uncaught and the run terminates
            with NO truncation_sweep_comparison.json written at all.
          - >-
            Hence, with the cap enforced, exactly one of two things happens:
            peak address space stayed under 2 GiB and every recorded value is
            bit-identical, or it did not and no artifact exists. The cap
            cannot silently perturb a value inside a written artifact. This is
            a ONE-SIDED property and is what makes the gap benign for this run.
          - >-
            Sole exception, stated rather than glossed: wall_clock_seconds
            (0.1884760856628418) could in principle be perturbed by allocator
            pressure without removing the artifact. It feeds nothing - it is
            compared only against the 1000 s budget (0.02% consumed), no gate
            reads it, and no frozen threshold depends on it.
      part_2_is_trivially_far_under_2_gib_established:
        answer: no
        status: tested_and_rejected_as_unestablished
        objections:
          - >-
            IT IS AN INFERENCE ABOUT THE WRONG QUANTITY. `ulimit -v` caps
            VIRTUAL ADDRESS SPACE, not resident set or workload size. The
            receipt, DEC-20260810-616fd5, manifest.yaml, environment.json,
            command.txt and execution_report.yaml all argue from workload
            ("one 203-vertex graph build, then defer") to a conclusion about
            RLIMIT_AS. Workload size bounds working set; it does not bound
            address space, which on a modern arm64 runtime is inflated by
            interpreter arenas, thread stacks and mmap'd regions unrelated to
            vertex count.
          - >-
            IT IS UNMEASURED. manifest.yaml discloses honestly
            (peak_rss_bytes: null, "not instrumented") and then asserts in the
            next sentence that "actual peak memory use was trivially far under
            the 2 GiB budget". That assertion is supported by nothing in the
            package.
        recommendation: >-
          The receipt's budget_compliance detail and the decision's
          corresponding rationale should be restated as "no evidence of
          over-budget use, and no measurement either way" in any superseding
          record. Never edited in place (AGENTS.md rule 4).
      part_3_must_the_gap_be_repaired_before_a_future_non_linux_run:
        answer: yes_with_scope
        scope: >-
          Under THIS contract a non-Linux host defers at G-0c before CAL-1,
          CAL-2 and both sweep passes, so it can never reach the workload
          where a 2 GiB cap could plausibly bind; the gap is therefore not
          urgent for re-running specification_v11 as frozen. It IS required
          more broadly: any contract declaring budget.maximum_memory_gb and
          executed on Darwin currently declares a budget it does not enforce,
          and no run in that situation can demonstrate compliance.
        required_before_next_memory_budgeted_non_linux_run:
          - "a portable enforcement mechanism (in-process resource.setrlimit on a limit Darwin accepts, or an external RSS watchdog)"
          - >-
            MANDATORY recording of resource.getrusage(RUSAGE_SELF).ru_maxrss
            in every run. It costs nothing and would have converted this
            entire check from an inference into a measurement.

    - id: VC-5
      outcome: confirmed
      title: Gate order and short-circuit verified against the real module
      evaluation_order_in_module:
        - {branch: G-0c, line: 841, guard: unconditional}
        - {branch: G-0, line: 880, guard: "not g0c['fired']"}
        - {branch: G-0b, line: 897, guard: "not g0_result['fired']"}
        - {branch: G-1, line: 908, guard: "not g0b_result['fired']"}
        - {branch: G-2/G-2b/G-3, line: 926, guard: "not g1_result['fired']"}
      order_matches_frozen: true
      g0c_precedes_any_sweep_point: true
      g0c_precedes_any_sweep_point_basis: "sweep loop is guarded by `if deferred_branch is None:` at line 943; deferred_branch is set to 'G-0c' at line 859."
      finding_confirmed_or_refuted: confirmed_on_stronger_grounds
      resolution_of_the_open_question: >-
        The card asked whether a null in gate_g0_result / gate_g0b_result /
        gate_g1_result could also mean "evaluated and produced nothing", which
        the artifact alone cannot distinguish. It CANNOT mean that, and the
        module settles it: those three variables are initialized to None at
        lines 850-852 and assigned ONLY inside the else-branch of `if
        g0c["fired"]:`, each nested one level deeper; and evaluate_g0,
        evaluate_g0b and evaluate_g1 return a dict on EVERY path (lines
        495-507, 510-520, 531-541) and can never return None. Therefore
        `gate_g0_result: null` is logically equivalent to "evaluate_g0 was
        never called". The code cannot reach those assignments on the G-0c
        path at all.
      f_cal_and_ratio_nulls: >-
        Treated separately because compute_f_cal CAN return None (line
        526-527) and compute_measured_load_inflation_ratio CAN return None
        (line 550-552), so those nulls are ambiguous in isolation.
        compute_f_cal is called only at line 907, immediately followed by
        evaluate_g1 which always returns a dict; so gate_g1_result: null
        implies compute_f_cal was never called. The ratio is computed at line
        918, only after G-1 does not fire. The joint null pattern in the
        artifact is consistent with exactly one execution path.
      lac_null_with_reason: >-
        load_adjusted_predicted_counts carries {value: null, reason:
        "undefined: G-0c fired before CAL-1 calibration was run/interpreted"}
        at both 1.1 and 1.45. Traced to module lines 1073-1079: the reason is
        generated by "undefined: %s fired before CAL-1 calibration was
        run/interpreted" % deferred_branch, and the keys come from
        str(b) for b in SWEEP_BUDGETS. Recorded strings and keys match the
        template exactly. PF-29(b)'s "ABSENT, not zero" discipline behaving
        correctly; NOT a contradiction of the never-evaluated claim.
      log_corroboration: >-
        stdout.log shows host capture -> STEP (0) build -> STEP (0) verify ->
        STEP (0b) archived-host read -> "GATE G-0c: fired=True" -> "DEFERRING
        at G-0c" -> gate complete -> run-end capture. No "GATE G-0:",
        "GATE G-0b:", "GATE G-1:" or "GATE G-2/G-2b/G-3:" line appears, and
        the module emits one for each whenever it evaluates one (lines 881,
        898, 909, 929).

    - id: VC-6
      outcome: confirmed_with_limitation
      title: Step (0) graph-identity re-verification
      ran_exactly_once: true
      ran_exactly_once_basis: "one call site for verify_graph_identity (line 822) and one for build_graph_for_prime (line 816); both outside any loop and outside any try/except."
      ran_before_g0c: true
      ran_before_g0c_basis: "build 816, verify 822, archived-host read 835, evaluate_g0c 841; corroborated by stdout.log line ordering (STEP (0) at lines 4-7 precedes STEP (0b)/GATE G-0c at lines 8-9)."
      recorded_values:
