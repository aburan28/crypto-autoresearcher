      measured_machine: arm64
      measured_os_cpu_count: 14
      archived_platform: Linux-6.18.5-fc-v18-x86_64-with-glibc2.39
      archived_cpus_available: 4
    predicate_evaluation:
      - "startswith('Linux') on 'macOS-26.6-arm64-arm-64bit-Mach-O' -> False -> disjunct 1 satisfied"
      - "'arm64' != 'x86_64' -> True -> disjunct 1 satisfied independently"
      - "os.cpu_count() 14 != cpus_available 4 -> True -> disjunct 2 satisfied"
