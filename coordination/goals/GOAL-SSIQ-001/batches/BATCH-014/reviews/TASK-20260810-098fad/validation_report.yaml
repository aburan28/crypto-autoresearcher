  # =====================================================================
  findings:
    - id: F-1
      severity: minor_non_material
      title: Seven top-level keys present beyond the explicitly closed list
      detail: >-
        The closed list (spec lines 1943-1955, "the word ONLY is
        load-bearing") does not enumerate gate_g0_result, gate_g0b_result,
        gate_g1_result, f_cal_seconds,
        measured_load_inflation_ratio_median_non_timed_out,
        graph_identity_verification or ordering_interpretation_note, all of
        which are present. Five are nulls that make the artifact more honest
        about what was not evaluated (the same "ABSENT, not zero" discipline
        PF-29(b) mandates for LAC); one is a step-(0) instrument-integrity
        value that precedes the gate and is not sweep-derived; one is the
        Executor's honesty-rule disclosure. No delta_E quantity and no sweep
        result. Strict-letter deviation with no substantive consequence.
      action: "Coordinator amendment: name these fields in the closed list so a future reader is not left to adjudicate."
    - id: F-2
      severity: minor_non_material
      title: Required top-level `caveats` list absent from the defer artifact
      detail: >-
        The BATCH-010 in-band obligation (spec lines ~674-690) requires
        truncation_sweep_comparison.json to carry a top-level caveats list
        containing the execution-host/host-identity and cross-hardware
        caveats. No caveats key exists. Two frozen clauses conflict on a defer
        branch (the same obligation also demands the measured final-pop
        overshoot distribution, definitively excluded on a defer), and the
        Executor resolved in favour of the explicitly closed list, which is
        the coherent resolution. The substance of both caveats is in-band
        anyway under pre_registered_reference_curve_v11.transferability_note,
        b_1_10.conditions and statement.
      action: "Coordinator amendment: resolve the conflict explicitly for defer branches."
    - id: F-3
      severity: advisory
      title: Non-official calibration figures live inside a declared, hash-bound artifact
      detail: >-
        execution_report.yaml carries, in a section fenced three separate
        times as not part of the official run, pre-execution calibration
        figures and one probe-derived resolved count from a smoke test at a
        NON-FROZEN budget. None of these is a delta_E value, a delta_E
        histogram, an equality cross-check, a final-pop overshoot
        distribution, or a per-vertex record at a frozen sweep budget, and the
        frozen closed list constrains truncation_sweep_comparison.json only -
        so this is NOT a closed-list breach and NOT a leak of a sweep-derived
        quantity. But the figures now sit inside a declared run artifact. That
        this task card had to open with an explicit prohibition against citing
        them shows the risk is not hypothetical.
      action: >-
        Any downstream EV-* record, decision or review citing this package
        must carry the receipt's own non_official_observation.status
        (NOT_A_MEASUREMENT_OF_RUN_SSIQ_a85692_k) boundary with it. This report
        cites none of those figures.
    - id: F-4
      severity: minor_citation_hygiene
      title: A quoted phrase attributed to TASK-20260808-d458a3 does not occur in it
      detail: >-
        execution_report.yaml lines 54-56 justify the ordering interpretation
        by the handoff "which lists G-0c ahead of 'any of the 8 CAL-1
        calibration vertices timing out' in its own evaluation order". That
        quoted phrase does not appear in TASK-20260808-d458a3.yaml: across the
        whole 109-line record, "CAL" occurs twice - once inside the word
        "specifically" (line 45) and once as "the ~140s calibration cost"
        (line 105) - and "timing out"/"timed out"/"timeout" occur zero times.
        What the handoff says (line 43) is "evaluate load_defer_gate_v11
        (G-0c, then G-0, G-0b, G-1, G-2, G-2b, in that exact order)". The
        gloss is substantively faithful (G-0 IS the CAL-1-timeout branch), so
        this is a citation defect and not a fabricated fact - but AGENTS.md
        rule 9 forbids fabricating citations, and quotation marks around a
        paraphrase of a named ledger record are the wrong side of that line.
        The ground is separately NON-PROBATIVE: the handoff states a gate
        EVALUATION order, on which both readings agree.
      action: "Correction belongs in a superseding record, never an edit of the immutable run artifact (AGENTS.md rule 4)."
    - id: F-5
      severity: limitation_of_the_frozen_check
      title: '"Graph-identity re-verification" verifies shape, not identity'
      detail: >-
        verify_graph_identity checks vertex count against a frozen scalar and
        3-regularity. Two different 203-vertex 3-regular graphs would both
        pass. The link to the archived graph rests on the determinism of
        build_graph_for_prime(2437, 20260805) against byte-identical vendored
        modpoly_data - a reasonable but unverified-in-band premise for this
        run, since the only coordinate-level assertion in the module sits on
        the never-executed CAL-1 path. Contract-compliant: the frozen text
        names this function and the Executor called it unchanged.
      action: "Coordinator amendment: either rename the check or add a coordinate-level comparison against the archived vertex set at step (0)."

  # =====================================================================
  # LIMITATIONS
  # =====================================================================
  limitations:
    - >-
      NO delta_E MEASUREMENT EXISTS IN THIS PACKAGE, at any budget, in any
      partial form. n_sweep_points_attempted/succeeded/failed = 0/0/0;
      cal1_records = []; cal2_records = []. This report offers NO interpretive
