        - "git rev-parse 5471247e6^ -> a58be638..., subject 'coord: freeze EXP-SSIQ-a85692 v11 (DEC-20260808-c2a470), dispatch executor'"
        - "git rev-list --count a58be638..5471247e6 -> 1. Exactly one commit between freeze and package, and it IS the package."
        - "git show --stat a58be638 -> 4 files: specification_v11.yaml, DEC-20260808-c2a470.yaml, GOAL-SSIQ-001/goal.yaml, TASK-20260808-d458a3.yaml. a58be638 genuinely is the freeze-and-dispatch commit."
        - "specification_v11.yaml blob at a58be638 (83a84feb9a...) equals its blob now. The contract has not moved since the freeze."
      dirty_note_scoping_verified: true
      dirty_note_scoping_method: >-
        The dirty flag itself CANNOT establish the note's claim: git_state()
        (module lines 746-756) computes dirty = bool(git status --porcelain),
        a single boolean that does not distinguish "only new untracked paths"
        from "tracked files modified". Verified by other means instead:
        (a) git diff-tree --name-status -r 5471247e6 marks all ten paths A
        (added) - zero M, zero D, and git show --stat reports 0 deletions;
        (b) git diff --stat a58be638 HEAD over BOTH implementation trees shows
        the ONLY change is the addition of delta_e_floor_straddling_sweep_v11.py
        - delta_e_truncation_probe_v9.py, delta_e_truncation_sweep_v10.py,
        compute_delta_e.py, trapping_diagnostic_v5.py,
        delta_e_independent_rng_probe_v8.py, build_isogeny_graph.py and
        calibration_synthetic.py are byte-unchanged; (c) RUN-h's
        environment.json, the one archived file read, is unchanged since its
        own snapshot commit.
      timing_of_git_state: >-
        git_state() runs late - at line 1162, after
        truncation_sweep_comparison.json was written at 1151 and while
        stdout.log/stderr.log were open under shell redirection - so the two
        untracked paths the note names are exactly what git status
        --porcelain would have reported at that moment. The note is consistent
        and not understated on all available evidence.
      residual_uncertainty: >-
        Stated rather than glossed: the run executed in an ephemeral worktree
        (/tmp/wt-ssiq-b014-cont per command.txt). A tracked file modified
        there and never committed would be invisible to every check above.
        Nothing suggests it happened - the run's own outputs (203 / 194 /
        3-regular) reproduce RUN-h's archived figures exactly, which is what
        unmodified modules predict - but the dirty boolean cannot rule it out
        and this report does not claim it does.
      repair_recommended: >-
        Record the git status --porcelain OUTPUT, or per-input file hashes,
        rather than a boolean. source_access_log.yaml already names the inputs
        but records hashing: n/a.

    - id: VC-8
      outcome: audited
      title: Audit of the archive receipt TASK-20260810-dae7ef and its process deviation
      hashes_recomputed: 10
      hashes_requested_minimum: 3
      hashes_matching: 10
      hash_method: >-
        Recomputed twice over: once against the working tree with shasum -a
        256, and once for six of the ten by piping `git show
        5471247e6:<path>`, which is independent of the worktree entirely. All
        ten match the receipt's declared path_sha256 exactly.
      stderr_empty_corroborated_by_hash: >-
        stderr.log is 0 bytes and its sha256 is
        e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855,
        which this Validator confirmed by hashing the empty string.
      declared_paths_vs_commit_file_set:
        result: exact_set_equality_both_directions
        basis: "git diff-tree --no-commit-id --name-status -r 5471247e6 returns exactly the ten declared paths, all A (added)."
        receipt_self_exclusion: "Correct - the receipt does not exist at 5471247e6 and its hash would be unverifiable there."
      tree_matches_producer_commit: "git diff --stat 5471247e6 -- <run dir> <impl file> is empty; the tree read is byte-identical to the producer commit."
      is_content_first_binding_sufficient_here:
        answer: yes
        grounds:
          - "all ten hashes verify against both the tree and the commit object"
          - "the producer commit's parent is exactly the freeze commit, with git rev-list --count = 1, so no post-freeze state could have influenced the executed code"
          - "the one archived artifact the gate depends on has a single commit in its entire history and an unchanged blob id at the execution commit, at HEAD and in the tree"
          - "the package is small, complete against the frozen required_artifacts list, and internally consistent across five independent files"
      is_the_lost_inspection_window_a_material_integrity_gap:
        answer: "a real process gap, but NOT a material integrity gap for this package"
        sharper_statement_than_the_receipts: >-
          When the producer chooses what enters history, anything the producer
          did NOT write is unrecoverable and undetectable by any later check,
          including this one. Had a first artifact been written, found wanting
          and replaced before the single commit, no hash, tree diff or
          reachability check in this repository would show it. The risk is
          BOUNDED here - one commit, parented directly on the freeze commit,
          no amends or intervening commits in the range, and a package whose
          every recomputable value this Validator independently reproduces -
          but it is not ELIMINATED, and content-first binding cannot eliminate
          it by construction. Content binding proves what the bytes are; only
          a snapshot-before-review ordering proves what the bytes were FIRST.
        scope_of_acceptance: >-
          This Validator would not accept the same argument for a package with
          recomputable scientific content. Here there is none to misreport,
          which is precisely why content binding suffices.
      disagreements_with_the_coordinators_characterization:
        - >-
          closed_list_compliance_on_defer returns an unqualified PASS on a
          TOP-LEVEL enumeration only. At depth the artifact carries the
          pre-registered reference curve's nested counts and histograms
          (correct, and required), and at the top level it carries seven keys
          the closed list does not enumerate (F-1). Neither is material, but
          "not one sweep-derived field is present" was verified over a smaller
          domain than the check's phrasing implies.
        - >-
          budget_compliance asserts "actual peak memory was trivially far
          under 2 GiB" in the same breath as "No figure for peak memory was
          measured and none is asserted here." The second sentence is right;
          the first is an assertion about an unmeasured quantity that reasons
          from workload to a bound on address space (VC-4).
        - >-
          DEC-20260810-616fd5 calls the ordering interpretation "defensible on
          the Executor's three stated grounds", one of which rests on a
          quotation that is not in the record it cites and which does not
          discriminate between the two readings anyway (F-4). The conclusion
          is right; the support offered for it is weaker than stated, and the
          strongest actual ground (PF-29(b)) went unnoticed.
      overall: >-
        Receipt accurate on every fact this Validator could recompute; process
        deviation honestly and adequately recorded, including its own
        disclosure that "precommit" is a misnomer for this batch.

