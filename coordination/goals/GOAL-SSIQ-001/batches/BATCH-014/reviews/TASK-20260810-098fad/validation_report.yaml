    - >-
      THE PRE-EXECUTION CAL-1 FIGURES ARE NOT MEASUREMENTS OF
      RUN-SSIQ-a85692-k and are not cited as such anywhere in this report. No
      conclusion here rests on them.
    - >-
      RESIDUAL PRODUCER-COMMIT RISK. Because the package was producer-
      committed, anything the producer did not write is undetectable by any
      later check including this one. The risk is bounded by the single
      commit, its direct parenting on the freeze commit, and the independent
      reproduction of every recomputable value - but it is not eliminated, and
      content-first binding cannot eliminate it by construction.
    - >-
      SCOPE. This validation covers the ten declared artifacts at 5471247e6,
      specification_v11.yaml at blob 83a84feb9a..., RUN-h's archived
      environment.json, TASK-20260808-d458a3, DEC-20260808-c2a470,
      DEC-20260810-616fd5, the archive receipt, and the five pre-freeze
      reports. Toy scale: p = 2437, N = 203, single prime. Nothing here
      transfers to cryptographic scale and the package does not claim it does.
    - >-
      A VALID VERDICT IS NOT A PROMOTION. It means the receipt is admissible
      evidence of its own execution. It does not authorize an EV-* record, a
      hypothesis-status move, or batch closure; those remain the
      Coordinator's, on the Validator and Red Team reviews taken together.
      BATCH-014's measurement objective is unmet, for reasons of
      execution-host availability alone.

