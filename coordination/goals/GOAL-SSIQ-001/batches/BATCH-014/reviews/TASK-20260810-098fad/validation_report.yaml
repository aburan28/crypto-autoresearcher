    method: >-
      Applied specification_v11.yaml lines 1859-1872 (branch G-0c) directly
      to the raw recorded host data, without reference to the execution
      report, truncation_sweep_comparison.json's own summary, the archive
      receipt, or DEC-20260810-616fd5. RUN-h's archived environment.json was
      read directly from disk.
    inputs_used:
