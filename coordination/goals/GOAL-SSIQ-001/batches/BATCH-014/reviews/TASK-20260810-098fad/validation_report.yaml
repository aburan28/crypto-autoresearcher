      was never measured and cannot be established without an execution this
      task forbids. The Coordinator's "trivially far under 2 GiB" is tested
      and reported as UNESTABLISHED - it reasons from workload size to a bound
      on virtual address space, which are different quantities - rather than
      adopted. No estimate is substituted for the missing measurement. What IS
      settled is that the enforcement gap could not have altered any recorded
