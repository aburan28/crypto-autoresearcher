- check: anomaly_disclosure
  result: FLAGGED_FOR_INDEPENDENT_REVIEW
  detail: >-
    THE EXECUTOR DISCLOSED ANOM-1: a floating-point precision artifact in
    the frozen, unchanged dht.ols_loglog_fit -- at exactly N=500 with a
    3-point bootstrap resample, sxx fails to round-trip to bit-exact 0.0,
    so the degeneracy guard silently misses that resample pattern. The
    Executor worked around it by choosing CHECK 3's length-3 subset to
    exclude N=500, disclosed as a data-construction choice within the
    spec's own stated freedom, not an assertion/tolerance change. This
    snapshot records the anomaly VERBATIM AND NOT ENDORSED. The next
    review should independently verify: (a) the anomaly is genuine and
    correctly characterized (reproduce the sxx non-zero-round-trip
    directly); (b) whether it has ANY bearing on prior batches' results
    that used bootstrap_gap_ci on real data (BATCH-004/005/006 all called
    this same function); (c) whether working around it by excluding N=500
    from CHECK 3's construction is a legitimate exercise of the spec's
    "constructed as two exact power laws" freedom or an undisclosed
    narrowing of what the check actually tests.
