    of this run''s budget, the same reason EXP-SSIQ-4de240''s M_GRAD arm declined it. The
    producer explicitly refused to fabricate a random assignment, on the ground that doing
    so would silently destroy whatever true correlation exists and make the ''real'' arm statistically
    indistinguishable from another instance of C-NULL-LABEL.'
  what_passed_before_the_blocker: C-CAL-GAP (Phase 0, all three synthetic pairs); C-CONNECTIVITY,
    M-DEGSEQ, C-EDGELIST and the delta_E=1-locus cross-check, all 12 primes; C-NULL-LABEL's
    own machinery ran to completion with C-REPRO bit-identical reproduction, though with nothing
    to compare it against since the real arm was never produced.
  anomaly_recorded: 'PD-2: a small number of vertices per prime (0-3 of 203-1800) have a genuine
    double edge to their own Frobenius conjugate, contradicting the frozen contract''s ''genuine
    simple graph'' claim for p = 1 mod 12. Handled via multiset adjacency (total degree 3
    always holds) and documented rather than silently smoothed over.'
