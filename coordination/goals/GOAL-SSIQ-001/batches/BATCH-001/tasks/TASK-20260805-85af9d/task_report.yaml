# ------------------------------------------------------------- findings
observations:
  opening_reading_audit:
    - row: F1
      verdict: CONFIRMED_SUBSTANCE_LOCATOR_CORRECTED
      detail: >-
        The statement is accurate. Its home is line 81 (Theorem 1.5), not the
        proof of Theorem 1.1; it enters the argument at line 177, which opens
        the proof of LEMMA 3.4. Status CITED-NOT-VERIFIED, reference [4].
    - row: F2
      verdict: CORRECTED
      detail: >-
        The split bound is NOT in the statement of Lemma 3.4 (line 160 contains
        no X). It lives in Algorithm 2 step 1 (line 167) and the proof at lines
        177-181. "1/2 of F1" is true of X's exponent but understates the
        operative identity: X = (B*D)^{1/2} exactly, so X^2 = B*D, which is why
        the total exponent equals the F1 exponent.
    - row: F3
      verdict: CORRECTED
      detail: >-
        The list-cardinality bound is LEMMA 3.2 (line 133), not Lemma 3.3.
        Lemma 3.3 (line 154) is the running-time lemma. The paper states an
        INEQUALITY; the matching lower bound appears only in Section 4.1
        (lines 226-230), outside the proof of Theorem 1.1. The quadratic
        character (q = 2) is confirmed and is pinned two-sidedly for the FULL
        list, so no better counting is available and any q-lever must restrict
        to a sub-family.
    - row: F4
      verdict: CONFIRMED_AND_STRENGTHENED
      detail: >-
        Exponent 0 is correct. Strengthened from observation to argument:
        r >= 0 because P0 is a probability, so F4 is the unique factor on which
        the required movement cannot be placed. One narrowing recorded: the
        batch opening's "refuted at the whiteboard" is correct about the
        EXPONENT and would overstate if carried to practical impact, since
        Remark 1 (line 191) calls the same phenomenon "practically relevant".
  factors_added:
    ids: [F5, F6, F7, F8]
    detail: >-
      Smoothness parameter B, walk length n, collision mechanism, per-step
      modular-polynomial cost. ALL CARRY EXPONENT 0, so the opening reading's
      exponent accounting is unchanged by them. They are added because levers
      act on them and a factor absent from the table is a factor no lever can be
      attributed to. F7 in particular was the unnamed target of both L3 and L5.
  master_identity: >-
    Total time exponent = exponent of the Theorem 1.5 degree bound; memory
    exponent equals it. F2 halves the degree exponent and F3 is quadratic in the
    result, so they exactly cancel. Derivation in exponent_budget.md section 3.
  conditions_for_1_over_4:
    equation: T = c*q*d/k + r ; M = q*d/k
    source_values: {d: 1/3, k: 2, q: 2, c: 1, r: 0}
    single_factor:
      d: '1/4 (degree bound exponent 1/4)'
      q: '3/2 (family cardinality X^{3/2}, i.e. delta = 1/2 in L2 notation)'
      k: '8/3 (NOT AN INTEGER; k=3 gives 2/9, k=4 gives 1/6)'
      c: '3/4, but NO ADMISSIBLE SOLUTION alone: M > T would follow, violating
          memory <= time, which line 158 gives directly for this algorithm'
      r: 'NONE EXISTS: would need r = -1/12, i.e. P0 = p^{1/12} > 1'
    whole_target_in_one_number: >-
      The product c*q*d/k must be multiplied by 3/4 (or k by 4/3). That single
      movement is the entire arithmetic content of "reach 1/4", and it can be
      placed on c, q or d, inverted onto k, and NOT on r.
    memory_consequence: >-
      Every admissible route takes memory to 1/4 as well. Time and memory are
      equal here precisely because r = 0 and c = 1; separating them requires
      c > 1 or r > 0, both of which RAISE the time exponent.
  levers:
    added_routes: [A1, A2, A3, A4, A5]
    anti_lever_register: [A6]
    count_added_routes: 5
    uncovered_symbol_found: >-
      k (split arity) had NO lever in L1-L5; A1 addresses it. Separately, L3's
      c-lever was found to carry an unstated prerequisite (A3) that the memory
      inequality makes binding.
    not_found_entries: 7
  deviations_and_findings:
    - kind: protocol_deviation
      present: false
      detail: >-
        No deviation from the approved handoff. Zero compute respected, write
        scope respected, no record status changed, no hypothesis minted, no
        experiment designed.
    - kind: defect_in_an_upstream_record
      severity: locator_error
      records: [ledger/goals/GOAL-SSIQ-001/goal.yaml, ledger/questions/RQ-SSIQ-9702af.yaml]
      detail: >-
        Both say the decomposition was read from "the proof of Theorem 1.1,
        lines 177-218". The proof of Theorem 1.1 is lines 193-220; lines 177-185
        are the proof of Lemma 3.4. The cited range also OMITS the sources of
        two of the four factors: Theorem 1.5 (line 81, all of F1) and Lemmas
        3.2/3.3 (lines 133/154, all of F3). The same wording appears in
        BATCH-001-OPENING section 2. Out of this task's write scope; reported,
        not edited. Correct span for exponent-carrying material: lines 77, 81,
        131-135, 154-158, 160-189, 193-218, 226-230.
    - kind: unexpected_observation
      detail: >-
        Under the two-event null model of target_conditions.md section 4.1, a
        PERFECTLY ALIGNED restricted family returns T = 1/3 for every delta --
        exact break-even, not a gain. L2's proposed measurement (the exchange
        rate) therefore has a null outcome L2 does not name. Recorded because an
        unnamed null is how a break-even measurement gets read as a signal.
    - kind: unexpected_observation
      detail: >-
        Heuristic 1 is a floor-holder, not a lever: since r >= 0, strengthening
        it cannot lower the total exponent, while its failure in the adverse
        direction would raise it. It can only cost, never gain, in exponent
        terms.
    - kind: unexpected_observation
      detail: >-
        The arithmetic admits solutions with a WORSE degree bound than the
        source's: d = 3/8 with k = 3, or d = 1/2 with k = 4, both give T = 1/4.
        d and k trade against each other, so the target does not logically
        require improving Theorem 1.5. Whether the deeper split's collision is
        findable at c = 1 is precisely what the frozen text does not address.
  cited_not_verified:
    - {ref: '[4] Yves Aubry, Roger Oyono, and Christelle Vincent. Minimal degree of an
             isogeny between a supersingular elliptic curve and its conjugate. 2026.
             arXiv: 2607.14624 [math.NT].',
