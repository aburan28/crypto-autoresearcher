- line: 19
  quotation: '**Theorem 1.1.** Assuming Heuristic 1, there is a Las Vegas algorithm which, given a supersingular
    elliptic curve E/F_{p^2}, finds a non-scalar endomorphism α ∈ End(E) \ Z in expected time and memory
    p^{1/3+o(1)}.'
  what_it_establishes: 'The claim whose exponent is being decomposed. Note the three qualifiers carried
    in the sentence itself: ''Assuming Heuristic 1'', ''expected'', and ''time AND memory''.'
- line: 13
  quotation: The impact on concrete parameter sets remains to be clarified, as the asymptotic advantage
    of the new algorithm is mitigated by a superpolynomial overhead hiding in the o(1) exponent, and by
    its high memory requirement.
  what_it_establishes: The source's own disclosure that the o(1) is superpolynomial and that memory is
    high. Any restatement of the 1/3 tier that omits this is an overstatement of the source.
- line: 39
  quotation: However, its memory cost is essentially as high as the complexity p^{1/3+o(1)}, a serious
    obstacle for any deployment of the algorithm on instances of cryptographic size.
  what_it_establishes: Memory is stated to be essentially as high as the time complexity, and is called
    a serious obstacle at cryptographic size.
- line: 39
  quotation: While the new algorithm improves the asymptotic cost from p^{1/2} · (log p)^{O(1)} to p^{1/3+o(1)},
    the practical impact is still unclear, as the overhead hiding in the o(1) term is superpolynomial,
    much larger than the previous (log p)^{O(1)} cofactor.
  what_it_establishes: The o(1) overhead is superpolynomial and larger than the (log p)^{O(1)} cofactor
    of the p^{1/2} predecessors.
- line: 69
  quotation: '**Heuristic 1.** Let p be a prime number, and let E/F_{p^2} be a uniformly random supersingular
    elliptic curve. The degree of the smallest isogeny φ : E → E^{(p)} is B-smooth with probability at
    least u^{−u(1+o(1))}, where u = log(p/2)/(3 log(B)) (uniformly as p → ∞, if (log p)^ε < u < (log p)^{1−ε}
    for a fixed constant ε).'
  what_it_establishes: Heuristic 1, stated formally. The whole p^{1/3+o(1)} tier is conditional on this
    and on nothing weaker.
