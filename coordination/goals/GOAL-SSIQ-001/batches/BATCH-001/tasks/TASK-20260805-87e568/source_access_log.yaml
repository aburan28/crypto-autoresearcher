    # ---------------- L1: Aubry-Oyono-Vincent, arXiv:2607.14624 ----------------

    - id: aov_abs
      purpose: L1 - locate the source of frozen-text Theorem 1.5 and confirm identity
      url: https://arxiv.org/abs/2607.14624
      timestamp_utc: '2026-08-05T01:25:19Z'
      http_status: 200
      bytes: 40090
      sha256: 09768304a2cb8d6edfae58be192d08e79e0066a007d62fbc9d6a489fdb047cf7
      content_type_detected: HTML document
      outcome: success
      what_it_established: >-
        Title "Minimal degree of an isogeny between a supersingular elliptic
        curve and its conjugate"; authors Yves Aubry, Roger Oyono, Christelle
        Vincent; citation_date 2026/07/16; v1 submitted 16 Jul 2026. Abstract
        states the bound is "both asymptotically optimal as well as sharp in
        many cases" - the phrase that led to Remark 4.3.

    - id: aov_html
      purpose: L1 - obtain the paper BODY (Prop 3.1, Prop 4.1, Thm 4.2, Rmk 4.3, Sec 5.1)
      url: https://arxiv.org/html/2607.14624v1
      timestamp_utc: '2026-08-05T01:25:36Z'
      http_status: 200
      bytes: 382190
      sha256: eec18aefad605f879e92b1174d16f161a9d1ea6ea9fa8ce42406cac62bb4e98d
      content_type_detected: HTML document, UTF-8
      outcome: success
      what_it_established: >-
        PRIMARY TEXT for the whole L1 audit. Gross lattice definition and rank-3
        Hermite bound (Sec 2.2); Theorem 2.2 from [AV]; Proposition 3.1
        (delta_E = min over rank-2 sublattices of det/(4p)); Proposition 4.1
        (Discr(Q) = det(G)^2 = 16 p^4, det(G) = 4p^2 by [CG14, Lemma 3.1]);
        Theorem 4.2 (delta_E <= (p/2)^{1/3}) with Cassels Theorem III;
        Remark 4.3 (the exponent 1/3 is asymptotically optimal, via
        [Yan08, Prop 1.4]); Section 5.1 (the rank-3 lattice R with degree form
        Q' = Q/(4p) of discriminant p/4, N_1 = delta_E, and
        p/4 <= N_1 N_2 N_3 <= p/2); Section 6 conjectures and data.
      extraction_note: >-
        Text extracted twice. The FIRST extraction unescaped MathML alttext
        BEFORE stripping tags, which silently deleted every '<' and the
        inequality it introduced - Remark 4.3 rendered as "if \eta 0 there
        exists". Detected and re-extracted with alttext left escaped until
        after tag-stripping. All quotations in L1_ceiling_audit.md are from the
        CORRECTED extraction. Recorded because a lost inequality sign in a
        quantifier is exactly the failure a ceiling audit must not make.

    - id: aov_pdf
