  # ---------------------------------------------------------------- results
  results_summary:

    L1:
      verdict: CLOSED
      verdict_scope: >-
        Scoped to the target E^{(p)} and to targets obtained from it by an
        isogeny of known small degree. NOT scoped to structurally different
        auxiliary targets (oriented curves, prescribed-torsion targets,
        higher-dimensional targets), which the argument does not reach.
      one_sentence_reason: >-
        Aubry-Oyono-Vincent Remark 4.3 proves unconditionally that the exponent
        1/3 is asymptotically optimal for a universal bound - for every
        eta < 1/3 and every C' > 0 there exist p and a supersingular E/F̄_p with
        delta_E >= C' p^eta - which kills L1's "for all E" disjunct; and a
        class-number counting bound derived in this task bounds the fraction of
        curves with delta_E <= p^{1/4} by p^{-1/8+o(1)}, which is not p^{-o(1)},
        killing L1's second disjunct.
      pillars:
        - id: P1
          closes: "L1 disjunct 1 (bound holding for all supersingular E)"
          basis: "AOV Remark 4.3, quoted verbatim; unconditional given [Yan08, Prop 1.4]"
          proof_status: cited_primary_text
          independent_verification_required: false
          inherited_unverified_dependencies: ["Yan08 Prop 1.4", "GL25 Prop 3.7", "CCO14 2.1.5", "HKTV Lemma 2.6.1"]
        - id: P2
          closes: "L1 disjunct 2 (bound holding for a p^{-o(1)} fraction)"
          basis: "Derivation D1, L1_ceiling_audit.md section 6"
          proof_status: derivation
          independent_verification_required: true
          unverified_ingredients:
            - "Deuring/Eichler optimal-embedding count (ingredient c) - standard background, not fetched this session"
            - "h(D) << |D|^{1/2} log|D| (ingredient d) - classical, not fetched this session"
            - "#{supersingular j-invariants} = p/12 + O(1) (ingredient e) - standard, not fetched this session"
      reversion_condition: >-
        If a Validator finds D1 unsound, the verdict for disjunct 2 reverts to
        UNRESOLVED. Disjunct 1 stays CLOSED regardless, since P1 does not depend
        on D1.
      nearby_object_control:
        ran: true
        changed_verdict: false
        outcome: >-
          The ceiling extends to the neighbours a lever would substitute rather
          than deflecting to them, so the result is a closure and not a
          redirection. N1 other Galois conjugates: DEGENERATE, since
          E^{(p^2)} = E over F_{p^2} and no other conjugate exists. N2 twists:
          same j-invariant, same maximal order, isometric lattice - ceiling
          transfers exactly. N3 small-degree-modified targets E^{(p)}/G with
          #G = m: the bound applies with T -> mT, so the invariant is the
          PRODUCT mT and escaping requires moving the target by degree
          >= p^{1/3}/T. N4 NULL OBJECT (a generic supersingular target): the
          trace-zero reduction is unavailable, the governing lattice is rank 4
          of determinant p^2/16, and the exponent is 1/2 not 1/3 - the method
          DISTINGUISHES the intended object from the structure-free surrogate,
          which is the control passing. N5 structurally different auxiliary
          targets: NOT COVERED - the single residual redirection component
          inside the CLOSED verdict.
      lattice_stated_before_argument: true
      lattice:
        governing_object: "R, the trace-zero sublattice of Hom(E, E^{(p)})"
        rank: 3
        quadratic_form: "Q' = Q/(4p), which is the degree form on R"
        discriminant: "p/4"
        first_minimum: "N_1 = delta_E"
        two_sided_constraint: "p/4 <= N_1 N_2 N_3 <= p/2 (Hermite, both directions)"
        provenance: "AOV arXiv:2607.14624v1 Section 5.1, quoted verbatim"
        rank4_ambient:
          object: "P, the unique two-sided ideal of reduced norm p in a maximal order O of B_{p,infty}"
          rank: 4
          quadratic_form: "Nrd/p"
          isometric_to: "Hom(E, E^{(p)}) with the form deg"
          provenance: "inputs/P13-WESOLOWSKI-2026/paper_fulltext.md line 244, quoted verbatim"
      three_quantities:
        i_proven_upper_bound_all_E: >-
          EXISTS. delta_E <= (p/2)^{1/3} unconditionally for all supersingular E
          and all p. AOV Theorem 4.2 = frozen text Theorem 1.5, via Cassels
          Theorem III applied to a ternary form of Discr(Q) = 16p^4.
        ii_typical_minimal_degree: >-
          EXISTS as a size model plus extremal data, and is NOT used as (iii)
          anywhere in this audit. Frozen text Heuristic 1 models deg(phi) as a
          random integer of size (p/2)^{1/3}; AOV data show delta(p) = max_E
          delta_E tracks floor((p/2)^{1/3}) within 4-5 for p <= 265,207
          (Conjecture 6.8). AOV also record that every value 1 <= n <= delta(p)
          occurs at p = 234,959, and conjecture delta is surjective onto Z_{>0}
          (Conjecture 6.3) - so small values are abundant, and (ii) is not a
          per-curve floor.
        iii_lower_bound_forcing_a_floor: >-
          EXISTS in two proven forms plus one derived form. (iii-a) AOV
          Remark 4.3: exponent 1/3 is asymptotically optimal, infinitely often
          in p, on the EXTREMAL curve. (iii-b) delta_E >= 1 always, with
          equality EXACTLY on the F_p locus (AOV sections 1 and 2.2), so there
          is NO universal floor at any positive exponent. (iii-c) derived here:
          the fraction of curves with delta_E <= T is << T^{3/2} p^{-1/2+o(1)}.
        conflation_guard: >-
          The audit's quantifier-order table (L1_ceiling_audit.md section 8)
          records that (iii-a) and (iii-b) are both "lower-bound shaped" and
          both exists-quantified over E, but point in opposite directions, and
          that neither alone closes L1. Only (iii-c), which quantifies over the
          population, closes the disjunct the algorithm needs.
      baseline_reproduction_check:
        ran: true
        outcome: >-
          D1 combined with the goal record's opening cost reading gives
          total >> p^{1/2 - theta/2} at degree threshold p^theta, which returns
          p^{1/3} at theta = 1/3 - the frozen source's exponent, reproduced from
          an independent direction (a class-number count rather than
          Hermite/Cassels plus a smoothness heuristic) - and p^{3/8} at
          theta = 1/4. theta = 1/3 is the interior optimum of the method.
        conditionality: >-
          The bookkeeping step alone (not D1) uses the goal record's
          self-declared-unverified opening reading of the exponent budget.
          TASK-20260805-85af9d is re-deriving that reading; if F1<->total is
          corrected, this step must be recomputed. D1 and the verdict do not
          depend on it.

    L4:
      published_figure_obtained: partial
      what_was_obtained: >-
        The PUBLISHED ABSTRACT (Springer publisher metadata relayed by the
        Semantic Scholar Graph API), which states: "We give an algorithm to
        construct isogenies between supersingular curves over F_p that works in
        O~(p^{1/4}) bit operations", and also "It takes an expected O~(p^{1/2})
        bit operations, and also O~(p^{1/2}) space" for the F_{p^2}
        meet-in-the-middle. Bibliographic identity independently confirmed by
        Crossref (DCC 78(2):425-440, 2016-02).
      what_was_NOT_obtained: >-
        The PUBLISHED DCC BODY. SpringerLink returns HTTP 200 with a JavaScript
        bot-challenge page for the DOI redirect, the article page and the
        content PDF (three byte-identical responses); Unpaywall and OpenAlex
        both report the work closed with no open-access location and no
        repository full text. RECORDED AS AN INFRASTRUCTURE OUTCOME
        (AGENTS.md rule 5), never as a mathematical finding.
      body_level_source_obtained: >-
        The arXiv v1 PREPRINT body via ar5iv, labelled as preprint throughout.
        Section 3: "By the birthday paradox, the heuristic running time of the
        algorithm is O~(p^{1/4}) binary operations", attached to "the
        high-storage bi-directional-search algorithm ... given as Algorithm 1".
      figure_characterisation:
        problem: "F_p-RESTRICTED (both curves supersingular AND defined over F_p)"
        status: "HEURISTIC (birthday paradox), not proven"
        algorithm: "high-storage bi-directional search (Algorithm 1)"
        memory: "NOT STATED by the source; see below"
        mechanism: "p^{1/4} = (p^{1/2})^{1/2}, a birthday bound over an F_p locus of size ~p^{1/2}"
      rc4_status: RESOLVED_WITH_MECHANISM
      rc4_mechanism: >-
        arXiv holds exactly one version (v1, 2013-10-29). Its METADATA abstract,
        served by the abs page and the API, contains no complexity figure at all
        ("works faster than the usual algorithm"). Its LATEX SOURCE abstract,
        rendered by ar5iv, carries O~(p^{1/2}) time, O~(p^{1/2}) space and
        O~(p^{1/4}) - and is word-for-word the PUBLISHED Springer abstract. So
        the split is arXiv metadata vs the paper's own text, NOT
        preprint-vs-published as KN-TECH-058 conjectured, and the published
        version sides with the paper's own text. Both earlier retrievals were
        correct readings of what they fetched. Contributing factor: the arXiv
        record carries no "Journal reference:" and no "Related DOI:" field, so
        nothing on the arXiv side points a retriever at the published version.
      memory_profile_status: STILL_NOT_OBTAINED
      memory_profile_note: >-
        Sharper than before: an exhaustive search of the extracted preprint for
        storage/space/memory finds NO space bound for the F_p algorithm anywhere
        in the body. It was not obtained because, in the preprint at least, it
        is not there. Whether the published DCC version adds one is UNKNOWN and
        UNTESTED. Any L4 cost model must carry O~(p^{1/4}) time with memory
        unstated, and must not assume either O~(p^{1/4}) or polynomial memory.
      confidence_label_changed: false
      confidence_label_note: >-
        No confidence label is upgraded on the strength of "sources agreeing",
        per the task's named duty, and none is downgraded on the absence of the
        published body, per KN-TECH-058's own rule that absence of a stable
        source is not evidence the figure is wrong. What changed is that the
        defect is now explained rather than unexplained, and that the figure now
        has a body-level occurrence. Whether that warrants a corpus change is
        the Coordinator's decision.
      most_decision_relevant_observation: >-
        From the source itself (preprint section 4): the descent costs
        O~(p^{1/2}) steps, then the F_p algorithm "only requires O~(p^{1/4})
        steps", and "The second stage has no effect on the asymptotic running
        time." Independently corroborated by Corte-Real Santos-Costello-Shi
        (CRYPTO 2022, frozen reference [15], IACR ePrint 2021/1488), whose
        abstract states the subfield search "is the bottleneck step of the
        Delfs-Galbraith algorithm for the general supersingular isogeny problem"
        and that "the asymptotic O~(p^{1/2}) complexity ... remains unchanged
        from that of the original Delfs-Galbraith algorithm". The p^{1/4} phase
        is asymptotically FREE in the source's own accounting.
      l4_verdict_returned: false
      l4_verdict_note: >-
        NO verdict on L4 is returned. This deliverable is a baseline
        acquisition; L4's method-ceiling audit is not in this task's scope. The
        observations above are recorded for whoever runs it.

