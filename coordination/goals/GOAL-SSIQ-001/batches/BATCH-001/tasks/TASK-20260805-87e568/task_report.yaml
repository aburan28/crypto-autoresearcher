  # ---------------------------------------------------------------- anomalies
  anomalies:
    - id: A1
      class: implementation_error
      severity: caught_before_use
      description: >-
        The first HTML-to-text extraction of the AOV paper unescaped MathML
        alttext BEFORE stripping tags, so every '<' introduced by the unescape
        was consumed by the tag-stripper along with the inequality it began.
        AOV Remark 4.3 rendered as "if \eta 0 there exists", silently deleting
        "< 1/3, then for any constant C'". Detected because the sentence was
        ungrammatical, and re-extracted with alttext left escaped until after
        tag-stripping.
      impact: >-
        None on the deliverables: every quotation in L1_ceiling_audit.md is from
        the corrected extraction, and the corrected text is what the verdict
        rests on. Recorded because a lost inequality inside a quantifier is
        precisely the failure a ceiling audit must not commit, and because the
        same defect would silently corrupt any future MathML extraction in this
        harness.
    - id: A2
      class: infrastructure_error
      severity: bounded
      description: >-
        No PDF text extractor is available in this environment. pdftotext is
        absent; `import pypdf` and `import fitz` both fail; an attempted
        `pip install pypdf` terminated with a pyo3_runtime PanicException
        ("Python API call failed").
      impact: >-
        Two consequences, both recorded rather than worked around: (a) the AOV
        PDF was fetched and hashed but not read, so the AOV audit rests on the
        arXiv HTML rendering alone rather than on two independent renderings of
        the same paper; (b) the IACR ePrint 2021/1488 PDF body was not
        extracted, so the peer-reviewed corroboration of the Delfs-Galbraith
        cost structure rests on that paper's abstract only, and the
        Delfs-Galbraith memory profile was not pursued through it. Named in
        L4_baseline_acquisition.md section 6 as the cheapest environment fix
        before the next literature task.
    - id: A3
      class: infrastructure_error
      severity: bounded
      description: >-
        SpringerLink returns HTTP 200 with a JavaScript "Client Challenge"
        bot-protection interstitial for all three routes to the published
        Delfs-Galbraith article (DOI redirect, article landing page, content
        PDF). All three responses are byte-identical (SHA-256
        32ed6315...ef0e18ea).
      impact: >-
        The published DCC body was not obtained. This is an infrastructure
        outcome under AGENTS.md rule 5 and is never presented as evidence about
        the paper's content. Corroborating routes (Unpaywall, OpenAlex) confirm
