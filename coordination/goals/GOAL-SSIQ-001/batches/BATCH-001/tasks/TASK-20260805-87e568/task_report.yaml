    - id: A5
      class: observation
      severity: for_coordinator
      description: >-
        knowledge/literature/KN-LIT-1732.md, the corpus entry for
        arXiv:2607.14624, declares a local copy at "downloads/2607.14624v1.pdf".
        No such file exists in this working tree and a filesystem-wide search
        found nothing matching 2607.14624*. The same entry records "ITS
        CONJUGATE" as an author (the authors are Yves Aubry, Roger Oyono and
        Christelle Vincent) and carries a truncated title - both consistent with
        the entry's own disclosure that it was bulk-seeded and heuristically
        parsed on 2026-07-24.
      impact: >-
        None on this task, which fetched the paper directly. Reported and not
        edited: knowledge/ is outside this task's write_scope, and correcting an
        immutable corpus entry is a supersession, which is the Coordinator's
        act. Relevant because a Validator following that entry's "Local copies"
        pointer will find nothing.
    - id: A6
      class: observation
      severity: for_reviewer
      description: >-
        AOV Remark 4.3's concluding sentence, as printed, reads "there exists
        ... E ... with an isogeny E -> E^{(p)} of degree at least C' p^eta",
        which taken literally is trivially true of any curve. The derivation two
        sentences earlier makes the intent unambiguous - it lower-bounds
        D_1D_2 - t_12^2, which for a Minkowski-reduced rank-3 lattice is the
        MINIMUM rank-2 sublattice determinant, and Proposition 3.1 converts that
        minimum into delta_E - so the intended statement is
        delta_E > (3C^2/16) p^{2theta-1}.
      impact: >-
        The audit uses the derived statement and records the printed wording so
        that a Validator checks the same object. This is a wording imprecision
        in the source, not an error in its conclusion, and not a defect in
        pillar P1.
    - id: A7
      class: observation
      severity: for_reviewer
      description: >-
        The goal record's named_obstruction_to_audit_first for L1 ("Minkowski-
        type lower bounds on the minimum of the rank-4 quaternion lattice") is a
        category error in two independent respects: Minkowski/Hermite/Cassels
        bounds are UPPER bounds on a lattice minimum and cannot force a floor;
        and applied to the rank-4 object they give exponent 1/2, weaker than the
        known 1/3, because 1/3 comes from a rank-3 object obtained after the
        arithmetic constraint p | trd has been spent.
      impact: >-
        Recorded rather than silently repaired (L1_ceiling_audit.md section 3).
        The named obstruction was nevertheless a good pointer - right lattice
        family, one rank off - and identifying the rank-3 object is what made
        the nearby-object control decidable rather than a guess.

  unexpected_observations_preserved:
    - >-
      Derivation D1 saturates exactly at exponent 1/3: at T = (p/2)^{1/3} it
      returns fraction << p^{o(1)}, i.e. it goes vacuous precisely where AOV
      Theorem 4.2 says the true fraction is 1. A counting bound that goes
      vacuous exactly at the known truth cannot be improved at that exponent.
      This was not anticipated when the count was set up and is the strongest
      internal consistency signal the audit produced.
    - >-
      The same derivation independently reproduces the frozen source's p^{1/3}
      exponent from a class-number count, a direction entirely unrelated to the
      source's own Hermite/Cassels-plus-smoothness route. That is the
      KN-TECH-080 audit-1 baseline reproduction, obtained as a by-product rather
      than as a separate exercise.
    - >-
      The in-task cross-check of section 2.3, starting from the frozen text's
      rank-4 statement, lands on discriminant p/4 and the constant (p/2)^{1/3}
      exactly - matching AOV Section 5.1's independently stated discriminant and
      AOV Theorem 4.2's constant. Two different starting objects, same two
      numbers.
    - >-
      AOV record a lattice-level observation collision: for p = 22,273 a Gram
      matrix satisfies every constraint of their sieve yet "there is no
      supersingular elliptic curve realizing this quadratic module". The
      lattice-level observable is therefore NOT identifying for the curve-level
      object. Harmless to D1 (an upper bound is unharmed by counting
      non-realised lattices) but it would matter to any lever that tried to
      CONSTRUCT a curve from a desired lattice.
    - >-
      AOV Conjecture 6.3 and the p = 234,959 datum (every value 1 <= n <= 48 is
      attained by some E) show that curves with very small delta_E are abundant
      at every prime. This is why no per-curve floor exists and why the closure
      had to be a population statement.

