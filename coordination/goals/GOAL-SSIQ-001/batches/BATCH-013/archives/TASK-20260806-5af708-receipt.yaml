    (truncation can only ever return a valid-but-non-minimal upper bound
    found from an incompletely-built table, never a smaller one) that
    this Coordinator flags as the batch's most significant unanticipated
    result, requiring the closest independent scrutiny from both
    reviewers before any evidence record characterizes it.
