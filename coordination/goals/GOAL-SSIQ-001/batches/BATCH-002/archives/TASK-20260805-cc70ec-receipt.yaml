claim_boundary: M-ALPHA IS VOID and may not be cited as evidence about D1 in either direction.
  The primary question is UNDECIDED. Sub-toy throughout (log2 p <= 18.0168) and the lever's
  regime is not sampled at all. Nothing asserts that a p^{1/4} algorithm exists, is likely,
