unexpected_observations:
  - id: U1
    observation: >-
      The citation "[35, Theorem 1]" has no literal referent in any obtained
      rendering of [35]; its companion "[35, Proposition 8.5]" matches the
      EUROCRYPT proceedings exactly while the author full version numbers the
      same statement 8.4. Recorded, not resolved.
  - id: U2
    observation: >-
      [35, Proposition 8.5], which frozen line 21 says is applied to obtain
      Corollary 1.2, is stated "Assuming the generalised Riemann hypothesis",
      while Corollary 1.2 is stated "Assuming Heuristic 1" and restates no other
      assumption. Both facts recorded with locators; the record-keeping
      consequence under docs/claims-and-verification.md is a Coordinator action,
      not this task's.
  - id: U3
    observation: >-
      link.springer.com/content/pdf/<DOI>.pdf served the complete 30-page
      proceedings chapter, not a preview, while eprint.iacr.org is Cloudflare
      challenged. For proceedings-numbered citations, Springer was the working
      route in this environment.

