reference_35_identification:
  identified_from: "inputs/P13-WESOLOWSKI-2026/paper_fulltext.md line 328 (the frozen text's own reference list)"
  identified_before_any_fetch: true
  quoted_verbatim: >-
    [35] Aurel Page and Benjamin Wesolowski. "The Supersingular Endomorphism
    Ring and One Endomorphism Problems are Equivalent". In: EUROCRYPT 2024, Part
    VI. Vol. 14656. LNCS. Springer, 2024, pp. 388-417. doi:
    10.1007/978-3-031-58751-1_14.
  identifiers_in_the_frozen_entry: [ "DOI 10.1007/978-3-031-58751-1_14", "LNCS 14656", "pp. 388-417" ]
  identifiers_NOT_in_the_frozen_entry:
    - "iacr:2023/1399 and arXiv:2309.10432 come from this repository's corpus entry knowledge/literature/KN-LIT-131.md, not from the frozen text; labelled as such wherever used."
  obtained: true
  obtained_how: >-
    The exact version the reference names (EUROCRYPT 2024 proceedings chapter,
    30 pages, pp. 388-417) via
    https://link.springer.com/content/pdf/10.1007/978-3-031-58751-1_14.pdf,
    HTTP 200, sha256 55c054a8b4e75041fc2aef62438ac1bd5071f34fec7dea298bafecd6a62280ff.
    Two further renderings (arXiv 2309.10432v2, HAL hal-04209824v2) were also
    obtained for numbering comparison.
  unobtained: [ "IACR ePrint 2023/1399 - HTTP 403 Cloudflare managed challenge, two attempts, recorded as unobtained" ]

costs_recorded:
  - cited_as: "[35, Proposition 8.5]"
    resolved_to: "Proposition 8.5 (Isogeny reduces to EndRing), EUROCRYPT 2024 proceedings, p. 413"
    numbering_match: exact
    what_it_does: "lets an EndRing solver answer the Isogeny problem: Isogeny -> l-IsogenyPath -> EndRing"
    multiplies_complexity_by: "probabilistic polynomial time in the instance length, i.e. (log p)^{O(1)}, with lambda(log p) = O(log p)"
    degree_of_that_polynomial: NOT_ASSIGNED
    oracle_call_count: NOT_ASSIGNED
    conditional_on: "the generalised Riemann hypothesis (stated in the theorem)"
    steps_with_no_assigned_cost:
      - "Isogeny -> l-IsogenyPath: the source assigns no cost to this step."
      - "l-IsogenyPath == EndRing: the source assigns no cost to this step (delegated to [Wes22b]; only the path length O(log p) is restated)."
  - cited_as: "[35, Theorem 1]"
    resolved_to: >-
      NO LITERAL MATCH. No obtained rendering of [35] contains a result numbered
      "Theorem 1". Costed under both candidate readings; this task does not
      resolve between them. Reading (a): Theorem 1.1 (p. 389), stated precisely
      as Theorem 7.2 (p. 409). Reading (b): [33, Theorem 1] (HAL hal-04954150v3),
      which does exist literally.
    numbering_match: none
    what_it_does: >-
      Reading (a): Algorithm 3 builds End(E) from polynomially many OneEnd calls
      with saturation and index bookkeeping (EndRing reduces to OneEnd_lambda).
      Reading (b): unconditional equivalence of Isogeny, EndRing, MaxOrder,
      MaxOrder_Q, HomModule, OneEnd, MOER.
    multiplies_complexity_by: >-
      Reading (a): "expected polynomial time in log(p) and lambda(log p)";
      "polynomially many instances of OneEnd". Reading (b): "probabilistic
      polynomial time".
    degree_of_that_polynomial: NOT_ASSIGNED
    oracle_call_count: "polynomially many; degree NOT_ASSIGNED"
    only_explicit_exponent_anywhere_in_the_cascade: "12, in the per-iteration success probability Omega((log N)^{-12}), p. 410, with log N = O(log p * lambda(log p)) via Eq. (1)"
    conditional_on: "Reading (a): probabilistic (Las Vegas) only - no GRH, no heuristic stated. Reading (b): unconditional, per that statement."
  - cited_as: "the frozen source's own application of both reductions in Corollary 1.2"
    resolved_to: "inputs/P13-WESOLOWSKI-2026/paper_fulltext.md lines 21 and 23"
    verdict: "the source assigns no cost to this step"
    detail: >-
      Line 21 reads only "applying the computational reductions [35, Theorem 1]
      and [35, Proposition 8.5], we deduce the following consequences". No
      multiplier, no cofactor and no exponent is stated, and GRH is not restated
      in Corollary 1.2, which is stated as "Assuming Heuristic 1".
  - cited_as: "the lambda at which the EndRing -> OneEnd_lambda reduction is applied"
    verdict: "the source assigns no cost to this step"
    detail: >-
      Theorem 7.2's cost is a function of lambda(log p), but the frozen source's
      Problem 2.2 is the unbounded OneEnd problem and its Theorem 1.1 states no
      bound on deg(alpha). A candidate value is DERIVED in cascade_cost_note.md
      section 5.3 and is explicitly labelled as derived by this task, not stated
      by any source.

