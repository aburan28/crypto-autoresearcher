extractor_outcome:
  blocked_before: true
  unblocked: true
  root_cause: >-
    The pyo3_runtime panic is not a pypdf or PDF-parsing fault. `import pypdf`
    pulls the distro-packaged `cryptography`, whose pyo3 0.20.2 Rust bindings
    import `_cffi_backend`; `cffi` was absent, and the resulting
    ModuleNotFoundError raised inside the pyo3 boundary surfaces as
    pyo3_runtime.PanicException.
  minimal_fix: "python3 -m pip install cffi"
  routes_working: [ "pypdf 6.14.2 (after cffi 2.1.1)", "poppler pdftotext 24.02.0 (apt poppler-utils 24.02.0-1ubuntu9.9, after apt-get update)", "pdfminer.six 20260107 via pdf2txt.py", "PyMuPDF 1.28.0 / MuPDF 1.29.0" ]
  routes_failed: [ "pypdf as found (pyo3 panic)", "apt-get install poppler-utils without apt-get update (404 on a superseded .deb)", "python3 -m pdfminer.high_level (exit 0, 0 bytes - not a CLI entry point)" ]
  routes_not_attempted: [ "standalone mutool binary", "pure-Python zlib/Flate fallback decoder" ]
  not_attempted_note: "Recorded as untried, not as known-broken; four routes already succeeded."
  packages_installed:
    pip: [ "cffi 2.1.1", "pdfminer.six 20260107", "pymupdf 1.28.0" ]
    apt: [ "poppler-utils 24.02.0-1ubuntu9.9", "libpoppler134 24.02.0-1ubuntu9.9" ]
  fidelity_hazard_recorded: >-
    All four routes flatten superscripts and subscripts (Eq. (1) of [35] extracts
    as "23k1 lambda(log p)+2" for 2^{3k_1*lambda(log p)+2}). Any exponent read out
    of an extracted PDF must be confirmed before use in exponent bookkeeping.
  html_fallback_needed: false

