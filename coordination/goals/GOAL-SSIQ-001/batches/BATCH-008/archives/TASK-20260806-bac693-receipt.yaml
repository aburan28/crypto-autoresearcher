- check: part_a_regression_tests_reported_passing
  result: PASS
  detail: >-
    Both required regression tests report passing, with a genuine
    contrastive design: ols_loglog_fit_v2 raises ValueError on the
    N=324/n=3 and N=611/n=6 anomaly cases while the frozen, unmodified
    dht.ols_loglog_fit silently returns spurious gammas (-0.5, 0.5) on
    identical inputs; bootstrap_gap_ci_v2 correctly discards every
    degenerate resample (0/2000 valid draws) in both cases while the
    frozen, unmodified dht.bootstrap_gap_ci accepts a spurious gamma=0.5
    on all 2000/2000 resamples on identical inputs/RNG state. This
    snapshot records the claim VERBATIM AND NOT ENDORSED pending
    independent review.
- check: part_b_coverage_and_rebuild_verification_reported_passing
  result: PASS
  detail: >-
    All four primes report coverage-assertion pass and
    graph-rebuild-independently-verified-correct pass; this run's own
    rebuilt trapped-fraction is reported bit-identical to
    RUN-SSIQ-a85692-b's archived value for all four primes, an additional,
    unrequested-but-informative consistency signal. Structural
    local-minimum fractions reported: 2437: 0.4680, 3889: 0.4074, 5737:
    0.4059, 7333: 0.4697 -- explicitly stated as a DIFFERENT statistic from
    the archived greedy_trapped_fraction (0.8374/0.7222/0.8201/0.8511),
    per PF-8.
- check: part_b_exhaustive_crosscheck_reported_FAILING
  result: FAIL_HONESTLY_DISCLOSED
  detail: >-
    THE SINGLE MOST IMPORTANT ITEM FOR INDEPENDENT REVIEW. The frozen
    contract's own required cross-check (PF-6) reports crosscheck_pass:
    False on ALL FOUR primes (93/203, 138/324, 234/478, 267/611
    disagreements). The Executor did NOT improvise past this: it
    hand-traced a concrete counter-example (p=2437, vertex (148,37)) using
    only the imported, unmodified greedy_descent_hitting_time and
    demonstrated that the frozen contract's own operational instruction
    (comparing the walk's "trapped" flag against
    is_structural_local_min(START)) tests the wrong vertex --
    greedy_descent_hitting_time's own documented invariant is
    mathematically correct about the walk's TERMINAL vertex, a
    potentially different vertex the frozen function's return value does
    not expose. This is classified by the Executor as a
    specification_error in the frozen contract's own PF-6 text, not a bug
    in this run's code -- disclosed fully, with the full per-vertex
    disagreement list preserved in trapped_vs_structural_crosscheck.json,
    not silently reconciled, not redefined, and the process was not
    halted before producing artifacts (which the contract's literal "halt
    with an explicit error" instruction would have prevented on the
    first prime, for all four primes). This snapshot records the
    diagnosis VERBATIM AND NOT ENDORSED. The next review must
    independently verify: (a) the hand-traced counter-example is
    correctly reasoned; (b) whether this is best understood as a defect
    in the pre-freeze review's own PF-6 finding (both review rounds) or
    in the Coordinator's transcription of it into contract text; (c)
    whether a new defect (GD-12?) should be named against this campaign's
    own specification-authoring process; (d) whether the structural
    local-minimum fractions reported (independent of the failed
    cross-check, computed directly from delta_map + rebuilt graph) remain
    valid and informative regardless of this finding.
