  findings:
    - id: F-J3-1
      joint: J3
      severity: load_bearing_for_composition
      classification: DISCLOSE
      title: Raw 0.10-band booleans are not fixture_gate_v2 PASS
      evidence: >-
        Amendment fixture_gate_v2.pass_rule (PA-ECDLP-869870-v1-to-v2): a mixer
        PASSES iff |mean scaled_cost - 1.79| <= 0.10 AFTER the O(theta)
        correction WHEN that correction is evaluated, AND the relative P band.
        Snapshot execution-report-v2.yaml (13bf12d0): both mixers report
        residual_cost_corrected: null, corrected_gate: not_evaluated, and
        raw_abs_residual_cost_le_0.10: true (splitmix mean 1.7088051287982124,
        residual -0.08119487120178759; murmur3 mean 1.7241929018744482,
        residual -0.06580709812555186). Recomputed from the 16 snapshot
        summary.json files in results/j3_gate_bookkeeping.json; 0 disagreement
        with the report's MEASURED means. The executor did not write
        fixture_gate_v2: PASS. The raw boolean is a fact about the uncorrected
        residual. Because the gate is defined on the corrected residual and
        that correction is not_evaluated, neither mixer PASSES fixture_gate_v2
        this cell.
      required_successor: >-
        The Coordinator must not compose a fixture_gate_v2 PASS from
        raw_abs_residual_cost_le_0.10. Record: raw cost band met per mixer;
        corrected gate not_evaluated; therefore fixture_gate_v2 is not a PASS.
    - id: F-J3-2
      joint: J3
      severity: not_load_bearing
      classification: DISCLOSE
      title: Mixers were not pooled; walk projections stay labelled
      evidence: >-
        execution-report-v2.yaml carries two sibling blocks, splitmix64 and
        murmur3_fmix64, each with its own 8 seeds, run_ids, mean, raw residual,
        and corrected_gate. All 8 splitmix summaries have mixer=splitmix64 and
        walk_projection=top_bits; all 8 murmur3 summaries have
        mixer=murmur3_fmix64 and walk_projection=mod_N. No 16-key pooled gate
        exists. Per-seed raw residuals are reported: splitmix s2 (-0.1532) and
        s3 (-0.1297) sit outside 0.10 individually; murmur3 s1 (-0.2111) and
        s2 (-0.1433) likewise. The amendment evaluates the 8-key MEAN per
        mixer; the executor did that and did not hide the tails.
    - id: F-J3-3
      joint: J3
      severity: not_load_bearing
      classification: DISCLOSE
      title: O(theta) not_evaluated is the honest reading of v1 (B4)
      evidence: >-
        v1 specification.yaml (B4) is a precomputation form,
        P/sqrt(NT)=sqrt(a)*r*(1+r*a/2), plus the prose that closed forms hide
        O(theta) corrections and that N/T=1 cells carry the largest
        duplicate-discard residual. source/model.py exposes b4_scaled_precomp
        and B4_CONTRACT_VALUES and no subtractable coefficient for
        published-weight scaled cost. The amendment requires reporting raw AND
        corrected, and marking the corrected gate not_evaluated rather than a
        silent skip dressed as a pass. The executor did that, citing those two
        sources. The v1-read-only n_drift fit (theta 0.01105 at 2^22 residual
        -0.0004; theta 0.00781 at 2^24 residual -0.077; slope 23.71 over 2
        points, labelled not_a_V5_verdict) does not supply a missing
        coefficient either: |residual| grew as theta shrank, which is the
        opposite of a decaying O(theta) term one could subtract to move a raw
        miss inside the band. There is therefore no instantiated correction
        that could turn this cell into a corrected-gate PASS.
    - id: F-J3-4
      joint: J3
      severity: not_load_bearing
      classification: DISCLOSE
      title: Claim stayed inside the amendment ceiling; H status line is stale, not a transition
      evidence: >-
        execution-report-v2.yaml records observations only; DEV-3 states
        HEUR-BLT-2, unselected-law, sigma decay, and extra selection rules
        were not computed; n_drift is labelled not_a_V5_verdict;
        claim_ceiling: toy; hypothesis_not_transitioned: true. Survival slope
        and top-T / C_max(1/4)=0.39 are reported as MEASURED numbers the
        amendment asked for, not as V1/M1/M3 verdicts. The line
        "hypothesis_H-ECDLP-3550b8: not transitioned (stays specified)" is
        stale about CURRENT status: ledger/hypotheses/H-ECDLP-3550b8.yaml is
        `analyzed` (DEC-20260906-1f5b71). The executor did not write a new
        status and this reviewer transitions nothing. Amendment
        falsification_of_this_amendment_not_of_H: this cell cannot support or
        weaken H-ECDLP-3550b8 by itself; even a later fixture PASS would only
        license scoring V2-V5 / M1-M5 in a LATER batch.
    - id: F-J4-1
      joint: J4
      severity: load_bearing
      classification: CONTROL_RUN
      title: Identity walk f(x)=x+1 misses the 1.79 band (failure signature did not fire)
      evidence: >-
        results/j4_identity_walk.json, independent of source_v2/ and of the 16
        fixture cells. N=2^24, T=256, a=1/4, W=128, cap=8W, published-weight
        r=2, M=40000. Walk f(x)=(x+1) mod N. DP predicate murmur3 fmix64
        (x XOR K2) < floor(2^64/W), constants from the amendment text.
        3 seeds: scaled_cost 89.7658, 104.1143, 89.3762; mean 94.4188;
        residual_cost_raw_mean +92.63; top-T share mean 0.01405 vs C_max
        contract 0.39; published-weight coverage mean 0.00511.
        fixture_gate_v2_raw_would_pass: false. Periodic-DP identity walk
        (x ≡ 0 mod W): mean scaled_cost 136.6378, top-T share exactly
        256*128/2^24 = 0.001953125, also a miss. Prior-batch internal
        control (TASK-20260906-90e7cf results/j4_perm_pipeline_verdicts.json,
        provenance internal): affine-xorshift bijection G2_fixture_cost_pooled
        50.2105, G2_cost_within_tolerance false. The review_plan failure
        signature is "fixture_gate_v2 PASSES for an identity or permutation
        walk". It did not trigger.
    - id: F-J4-2
      joint: J4
      severity: load_bearing
      classification: DISCLOSE
      title: Mixer-near-1.71 is distinguished from the identity null and is still not a promotion
      evidence: >-
        Inventor-protocol §3 (controls before belief): a mixer-only signal is
        an artifact until the identical measurement is run on a null / nearby
        object. The identity walk is that object. Mixer means on the snapshot
        (1.7088 splitmix, 1.7242 murmur3) sit near 1.79; the identity object
        sits near 94 with top-T share ~0.014 instead of ~0.39. The quantity
        that is supposed to destroy a random-function fixture signal is the
        replacement of the keyed mixer by a Hamilton cycle; it does. That
        discriminates the mixer measurements from the identity artifact. It
        does not make them a fixture_gate_v2 PASS (F-J3-1), does not score
        V2-V5 / M1-M5, does not move a, and does not promote H-ECDLP-3550b8.
        What should happen as the walk becomes less mixing (identity,
        periodic, bijection) is that scaled cost should leave the 1.79 band
        upward and top-T share should collapse toward T*W/N; that is what
        was measured. A matching result on the identity object would have
        been a controlled null; the mismatch is the control working.
    - id: F-J4-3
      joint: J4
      severity: load_bearing
      classification: DISCLOSE
      title: A raw band-hit at N=2^24 a=1/4 licenses neither a=1/8, a=1/16, nor H-ECDLP-3550b8
      evidence: >-
        Amendment scope.what_is_run is a=1/4 only. what_is_not_run names no
        2^20/2^22/2^30 cells and no other a. claim_ceiling: toy.
        falsification_of_this_amendment_not_of_H: this cell cannot support or
        weaken H-ECDLP-3550b8 by itself (v1 rule 3 already fired at 2^24;
        EV-ECDLP-31e91c direction neutral). H-ECDLP-3550b8 remains analyzed
        with no evidential direction. EV-ECDLP-2e9680 (EXP-ECDLP-6ac801 /
        H-ECDLP-37dc01, a=1/16 ceiling-feasibility on a different instrument)
        does not transfer here and was not used as support. Coordinator prior
        expected murmur3 8-key mean near the sealed 1.6814 (raw FAIL by
        ~0.009); this cell's murmur3 mean is 1.7242 (raw residual -0.066).
        That disagreement is a J1/J2 observation this reviewer does not
        verdict; either number, even if later confirmed, still does not
        license a smaller a or a hypothesis promotion.

  objections:
    - id: OBJ-J3-1
      joint: J3
      severity: composition
      statement: >-
        Treating raw_abs_residual_cost_le_0.10: true as fixture_gate_v2 PASS
        would collapse a not_evaluated corrected gate into a pass and would
        violate PA-ECDLP-869870-v1-to-v2. The producer did not write that
        collapse; a composer still could.
      evidence: F-J3-1
    - id: OBJ-J4-1
      joint: J4
      severity: scope
      statement: >-
        Any reading that a mixer raw-band hit at N=2^24, a=1/4 supports
        H-ECDLP-3550b8, scores V2-V5 / M1-M5, or transfers to a=1/8 or a=1/16
        exceeds the amendment ceiling and the review_plan claim_under_review.
      evidence: F-J4-3

  required_controls:
    - id: RC-J3-1
      joint: J3
      what: >-
        Compose fixture_gate_v2 as not_evaluated / not a PASS for both
        mixers. Keep raw and corrected columns. Do not pool mixers.
    - id: RC-J4-1
      joint: J4
      what: >-
        Keep the identity-walk (and the prior bijection 50.21) as a permanent
        negative nearby-object fixture. A later positive gate under this
        instrument class must still miss on f(x)=x+1.
    - id: RC-J4-2
      joint: J4
      what: >-
        Do not promote H-ECDLP-3550b8. Do not score V2-V5 / M1-M5 from this
        cell. Do not treat a=1/4 as licensing a=1/8 or a=1/16.

  counterexample_or_mutation: >-
    Cheapest discriminating control, already run: replace the keyed mixer by
    f(x)=x+1 (mod N) with the same DP predicate (results/j4_identity_walk.json).
    Expected: leave the 1.79 band upward and collapse top-T share toward
    T*W/N ≈ 0.00195. Observed: mean scaled cost 94.42 (hash DP) / 136.64
    (periodic DP); top-T 0.014 / 0.00195. A second cheap mutation is the
    already-committed affine-xorshift bijection (50.21 vs 1.79). The parameter
    that should destroy a mixer-only 1.79 hit is "stop mixing"; it does.

  baseline_comparison: >-
    This cell is a toy-tier fixture reproduction of Bernstein-Lange Section 4
    scaled cost 1.79 and scaled P 1.24 at (a,r)=(1/4,2), N=2^24, T=256, not
    an attack. Pollard-rho / BSGS are not competing algorithms here; the
    closest specialized baseline IS the published 1.79 / 1.24 pair (KN-LIT-013
    S T^2 = Omega~(eps N) ceiling unchanged; kn_lit_013_constant_factor true
    on the amendment). dominated_by: the Bernstein-Lange published-weight
    procedure at this (a,r) — the instrument is trying to match it, not
    dominate it. sota_delta: no attack claimed; measurement only.
    Time / memory / data axes: exact-basin enumeration at N=2^24, peak RSS
    ~0.78 GB on the snapshot runs, M=40000 online walks, no cryptographic N.
    An unchecked null on dominated_by would be a fabrication; the check is
    against the published fixture, van Oorschot–Wiener interpolation, and
    generic rho. None is beaten. KN-LIT-013 constant-factor scope is the
    ceiling, not a speedup.

  heuristic_challenges:
    - id: HC-J4-1
      heuristic: HEUR-BLT-1 (random-function / r-adding as random mapping)
      challenge: >-
        The random-model justification is for a uniformly random function
        (trees-on-cycles, Borel basins), not for a Hamilton cycle. The
        identity walk is the cheapest experiment that exposes the deviation:
        basin sizes become geometric gaps of mean W, top-T share ~0.014
        instead of C_max(1/4)=0.39, scaled cost ~94 instead of ~1.7. That is
        the nearby-object control, not a claim that HEUR-BLT-1 fails on the
        keyed mixers. Flajolet–Odlyzko and Aldous–Pitman remain recalled
        pointers on H-ECDLP-3550b8 and were not opened here; they are not
        used as support.

  cost_model_challenges:
    - id: CC-J3-1
      challenge: >-
        The amendment asked to subtract the model's O(theta) form before
        comparing 2^24 scaled cost to 1.79. v1 (B4) is a precomputation
        closed form, not a subtractable scaled-cost term. Hidden-overhead
        honesty: the o(1)/theta residual is disclosed as not_evaluated, not
        absorbed into a pass. Per-attempt vs total-expected-cost bookkeeping
        is not engaged (no attack; the fixture metric is already
        total_steps/hits/sqrt(N/T)). Memory ≈ the 5 int32 arrays of N
        (~0.4 GB analytic; ~0.78 GB peak RSS recorded). No van
        Oorschot–Wiener interpolation is claimed or needed to reject a
        headline exponent, because no exponent is claimed.

  reduction_and_scope_challenges:
    - id: RS-J3-1
      challenge: >-
        Affected-vs-safe scheme lists are not in play. Scope inflation to
        score would be scoring V2-V5 / M1-M5 or promoting H-ECDLP-3550b8
        from a single a=1/4 re-keyed cell whose corrected gate is
        not_evaluated. The executor did not inflate; the composer must not.
    - id: RS-J4-1
      challenge: >-
        No corollary via OneEnd/EndRing/Isogeny or any other cited reduction
        is instantiated by this cell. claim_tier toy. Transfer beyond
        N=2^24, a=1/4, these two mixers, this published-weight r=2 cell is
        an assumption, never a result.

  proof_architecture_challenges:
    - id: PA-J4-1
      kind: nearby_object / proves_too_much
      result: >-
        The argument "a 1.79-band hit validates the instrument" applied
        unchanged to f(x)=x+1 does not go through: the object misses.
        Observation-fiber: holding the DP predicate and the scaled-cost
        formula fixed while replacing the mixer by +1 separates the two
        sides of the conclusion. Quantifier order: the amendment's a-grid
        is {1/4} this cell; a later a is a new instance, not a witness
        chosen after seeing this outcome. Method ceiling: claim_ceiling toy;
        the resource measure cannot support an exponent move or an H
        promotion.

  narrowest_supported_statement: >-
    On the Coordinator-committed snapshot 13bf12d0 of EXP-ECDLP-869870 v2
    (PA-ECDLP-869870-v1-to-v2), J3: the executor reported raw residuals and a
    not_evaluated corrected gate per mixer, did not pool mixers, did not
    score V2-V5 / M1-M5, and did not transition H-ECDLP-3550b8; fixture_gate_v2
    is therefore not a PASS even though both 8-key raw cost means lie inside
    0.10 of 1.79. J4: f(x)=x+1 with the same DP-predicate form misses 1.79
    (mean scaled cost 94.42, 3 seeds); a raw a=1/4 band-hit does not license
    a=1/8, a=1/16, or promotion of H-ECDLP-3550b8 (status remains analyzed,
    no evidential direction). Timeouts and OOM did not occur and are not
    being read as misses. No whole-claim verdict.

  next_concrete_action: >-
    Coordinator composes J1–J4 after the validator returns. On these joints:
    record fixture_gate_v2 as not_evaluated / not a PASS for both mixers;
    leave H-ECDLP-3550b8 unpromoted; do not score V2-V5 / M1-M5; do not open
    an a=1/8 or a=1/16 cell as a consequence of this package. Bind this
    report at the ledger archive TASK-20260907-c264db. If a later amendment
    instantiates a subtractable O(theta) term, it must be versioned and must
    still fail on the identity-walk fixture archived here.

