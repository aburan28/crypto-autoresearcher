      what: >-
        survival-slope estimator (gate G1): the contract fixes the range 10 <= n <= W^2/4 but not the
        weighting; the declared primary estimator is least squares on 60 log-spaced integers, with the
        integer-grid estimator and the value the EXACT Borel(1 - theta) law gives under the identical
