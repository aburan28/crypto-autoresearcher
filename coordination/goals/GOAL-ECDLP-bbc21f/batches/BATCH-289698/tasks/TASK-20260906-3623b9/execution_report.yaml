        instrument.py was extended AFTER all 32 generic runs (logarithm hook and N_override for the curve
        arm); every manifest pins the hashes it ran with (instrument.py c39e45b1... for RUN-001..032). RUN-001
        re-executed from its recorded command with the final source reproduces raw-result.json
        byte-for-byte and summary.json up to timing fields (scratchpad check 2026-09-06, not a run record).
    - id: D5
      what: primary sources (Bernstein-Lange 2012/458, Corrigan-Gibbs-Kogan 2017/1113) were NOT fetched over the network; the contract's published numbers were used exactly as frozen
    - id: D6
      what: >-
        RHO on the curve certifies nothing: a collision between two walks of the same target, both of the
        form Q_u + [c]P, yields (c + s - c' - s')P = O and no logarithm. RHO's collision count is reported
        as the contract's floor metric (24 collisions over 3 seeds x 2048 targets); certificate count 0
        for that arm, stated explicitly.
    - id: D7
      what: implementation notes are written at experiments/EXP-ECDLP-612fb1/source/IMPLEMENTATION.md because the experiment-root implementation.md is outside this task's write_scope
    - id: D8
      what: >-
        readings of under-specified bookkeeping rules are declared in IMPLEMENTATION.md (one (length, +1)
        per walk; NULL-A relabelling to a random entry of the pool as of round start with new DPs entering
        at zero evidence; PHI admission per target including the hit credit; fixture restarts as the next
        40000 draws of stream 100 + s; precomputation restarts from default_rng(s); pools for r = 4, 8
        extending the r = 2 generation sequence; ties by a 63-bit key from stream 400 + s).

