        (not a run record) showed the integer-grid estimator biased by the cutoff (Borel itself gives
        -0.68 on the integer grid and -0.63 on the log grid at W = 64). Tolerances untouched; both
        estimators reported per seed so the reviewers can re-score under either.
    - id: D4
