  J1_findings:
    - id: J1-F1
      joint: J1
      severity: not_load_bearing
      title: fixture-gate verdicts produced after the gated stages executed
      evidence: >-
        869870: RUN-015 finished 15:32:23Z; RUN-016 (analysis, the intended
        gate report) failed at 15:35:33Z; RUN-017 (2^30) started 15:35:34Z;
        RUN-020 (curve search) 15:36:06Z; first gate verdict RUN-024 at
