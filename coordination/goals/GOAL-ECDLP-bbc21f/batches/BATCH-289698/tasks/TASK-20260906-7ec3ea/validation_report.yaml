  J2_findings:
    - id: J2-F1
      joint: J2
      severity: load_bearing
      scope: EXP-ECDLP-869870 V1 at the (1/4, 2) cell only; not load-bearing for EXP-ECDLP-612fb1 G2
      title: the 2^24 (1/4, N/T=2) fixture sits at the edge of the +-0.10 band on this instrument class
      evidence: >-
        Sealed 2^24 scaled cost: 1.6814 (murmur, 8 keys), 1.7323 (splitmix,
        5 keys), 1.7007 (13 keys pooled); executors 1.705 (612fb1) and 1.708
        (869870); published 1.79. All three instruments agree within the
        seed spread (|t| <= 0.7) and all lie 0.06-0.11 BELOW 1.79 at
        theta = 1/128. The 869870 tolerance (0.10) is the size of that
        O(theta) residual plus the key-to-key standard error (0.02-0.04 with
        5-8 keys): the murmur primary FAILS the band by 0.009 while splitmix,
        the pooled value and both executors PASS by 0.005-0.02. The 612fb1
        band (0.18) is passed by every variant with margin >= 0.07.
      repair: >-
        The Coordinator should not read the 869870 (1/4,2) 2^24 pass as
        stable under re-keying; a gate at +-0.10 needs either the 2^30 cell
        (theta = 1/512, where 612fb1 reads 1.727 and 869870 reports PASS) or
        an amendment stating the O(theta) correction before comparing at
        2^24. No producer artifact needs repair.
    - id: J2-F2
      joint: J2
      severity: not_load_bearing
      title: the 2^20 fixture disagrees with 869870 beyond the combined spread; localised to capped (DP-free-cycle) mass under 8W cap charging
      evidence: >-
        Sealed 2^20 cost 1.7301 (murmur; 1.774 splitmix) vs 869870's 1.988
        (per seed 1.845-2.144; t = -3.88) with 612fb1's 1.843 in between
        (t = -1.07 vs mine, -1.02 between the executors). At theta = 1/64 the
        mass that never reaches a DP is 0.1-2.3% of N per seed on both
        executors' instruments (612fb1: 0.12, 2.3, 0.95, 0.03, 1.1%; 869870:
        0.1, 1.6, 1.2, 0.3, 1.8%) and 0.01-1.5% on mine (mean 0.3-0.6%); a
        capped walk is charged 8W = 8x the mean walk and never hits, so 1.6%
        capped mass adds about +0.25 to the scaled cost -- exactly the 869870
        seed-2 reading (2.144). The 2^20 fixture is REPORTED, not gated, in
        both contracts; the gated 2^24 cell agrees across all three
        instruments (J2-F1).
      repair: >-
        None for the receipts. Any future use of a 2^20 fixture must report
        the capped-mass fraction beside it and the cost with capped walks
        excluded, or gate only at N >= 2^24.
    - id: J2-F3
      joint: J2
      severity: not_load_bearing
      title: procedure sensitivity confirms the Coordinator's prior on the distinct-DP pool
      evidence: >-
        At 2^24: generating exactly 2T walks instead of continuing to 2T
        DISTINCT DPs raises the cost to 1.817 (+0.136, would cross the
        869870 band the other way) and lowers P to 0.973 (426 distinct DPs);
        discarding duplicate walks uncharged leaves the cost near 1.715 but
        reads P at 0.820 (-32%, outside the 12% band). Not charging capped
        walks moves P by -0.8%; requiring one step from a DP start moves the
        cost by -0.007. Both executors implement the distinct-DP procedure
        with every walk charged (612fb1 instrument.generate_pools lines
        243-289; 869870 run_generic_exact.py lines 127-141 and 248-256), and
        their P values (1.243, 1.274 at 2^24) sit where that procedure puts
        them.
      repair: none.

