        before that N's arms are REPORTED, which the execution reports honour
        (gate first, rule 3 labelling applied), and running later stages
        after a failure is permitted "if budget remains"; but no run record
        shows a gate verdict existing when the later stages were launched.
      repair: >-
        In any later batch, evaluate and record the gate in its own run
        record before launching the next stage; for this batch the labelling
        is correct and nothing needs re-scoring.
    - id: J1-F2
      joint: J1
      severity: not_load_bearing
      title: pinned source hashes differ from the archived source; reproduction verified by the validator
      evidence: >-
        612fb1 RUN-001..032 pin instrument.py / analysis.py / harness_run.py
        hashes that differ from the snapshot files (declared D4). 869870
        RUN-001..015 pin instrument.py and run_generic_exact.py hashes that
        differ from the snapshot files, RUN-006..020 also analysis.py,
        RUN-022..024 make_execution_report.py; the 869870 report calls the
        change an "additive extension" for the curve arm but does not state
        that the archived source is not the bytes those runs executed, and
        records no reproduction check. Validator reproduction from the
        archived source (logs/repro_612fb1_RUN001, logs/repro_869870_N20_s1;
        exact recorded commands): 612fb1 RUN-001 raw-result.json reproduced
        BYTE-IDENTICALLY (sha256 9c7fba54...); 869870 RUN-001-N20-s1
        summary.json identical minus elapsed time and raw-result.json
        identical except one added key online_extra_raw (null on generic
        cells). The pinned pre-extension bytes are not in the archive.
      repair: >-
        Record in the 869870 package (amendment note or report addendum) that
        runs 001-019 executed earlier versions of the pinned files and that
        the change was additive, citing this reproduction; archive the pinned
        versions if byte-level provenance is wanted.
    - id: J1-F3
      joint: J1
      severity: not_load_bearing
      title: RHO arm raw 'solved' arrays count collisions without certificates
      evidence: >-
        612fb1 curve runs: raw arms['RHO'].solved marks 3 / 13 / 8 targets
        (24 total) as solved; these are same-target walk collisions that
        yield no logarithm and carry no certificate (declared D6). The
        contract's "certificate pass count equals solved count exactly" holds
        for the five certificate-bearing arms (19850 = 19850) and the report
        states RHO's count separately as a collision floor.
      repair: >-
        Label the RHO array as collisions, not solves, in any later version;
        no re-scoring needed since no RHO count is quoted as a solve.
    - id: J1-F4
      joint: J1
      severity: not_load_bearing
      title: declared readings that depart from the contract's letter
      evidence: >-
        869870 walk f(x) = top log2N bits of mix64(x XOR K) instead of the
        contract's "mod N" (item 1; a different projection of the same
        class); generation-stream seed 200+s and bootstrap 600+s unnamed by
        the contract (item 2); both packages label as cycle_mass the whole
        set of points that never reach a DP (DP-free cycle points AND the
        tails feeding them), whereas the contract's definition names only
        points on DP-free cycles -- the mass excluded from every basin is
        the same set, only the label differs; 612fb1 precomputation-restart
        stream default_rng(s) (D8). All are disclosed in IMPLEMENTATION.md.
      repair: none required; carry the readings into any amendment.
    - id: J1-F5
      joint: J1
      severity: not_load_bearing
      title: one artifact under a bound run directory is not bound by the snapshot receipt
      evidence: >-
        experiments/EXP-ECDLP-869870/runs/RUN-ECDLP-869870-016-analysis-stages12/raw-result.json
        exists in the worktree (1097 bytes) but is absent from the receipt's
        path_sha256 (539 bound vs expected_path_count 540) and absent from
        the tree at 840df8a5 (git ls-tree lists 5 files for that run). git
        log shows it was added by Coordinator commit 81398284f
        ("correction(RUN-ECDLP-869870-016): add the missing raw-result.json
        companion ... derived from its stderr.log; manifest untouched") AFTER
        the snapshot, during this review session (mtime 16:14:53Z); its body
        records status failed_infrastructure, the SyntaxError, and
        superseded_by RUN-024, and asserts nothing. It is a Coordinator
        companion, not a producer artifact, and is outside the validated
        snapshot.
      repair: >-
        The ledger archive should bind the companion in its own receipt as a
        Coordinator correction (it is not part of snapshot 840df8a5); no
        producer action.
    - id: J1-F6
      joint: J1
      severity: not_load_bearing
      title: observations recorded, not defects
      evidence: >-
        (a) 869870 fixture gate at 2^24 FAILED on 4 of 7 cells (P residual
        +19.0% at (1/2,2), +20.9% at (1,1), +15.5% at (1,2); cost +0.1005 and
        P +14.6% at (1,8)); the (1/4,2) headline cell passed (1.708, P 1.274);
        rule 3 fired and the report labels 2^24 and 2^30 invalid-for-
        interpretation; the 2^30 gate is reported PASS as measured. (b)
        869870 2^20 seed 1 a=1/4 global share 0.4393 is 1.126 x C_max
