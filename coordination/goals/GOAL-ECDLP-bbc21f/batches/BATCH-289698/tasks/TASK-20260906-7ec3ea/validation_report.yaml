  J2_blind_rederivation:
    sealed_file: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-7ec3ea/blind_rederivation_sealed.json
    seal_sha256: 0cd4c9e6f400954421f7bdfd01837854967776a6d88f54f87b6de80104ecb08e
    seal_utc: '2026-09-06T16:15:54Z'
    code: src/j2_rederive.py (sha256 in the sealed file); outputs logs/j2_rederive_output.json, logs/j2_full_stdout.log
    instrument: >-
      Own implementation from the statements: f(x) = mix64(x XOR K) mod N with
      murmur3 fmix64 as the primary mixer (deliberately not the contract's
      splitmix64 example) and splitmix64 as a sensitivity mixer; DP predicate
      mix64(x XOR K_dp) < floor(2^64/W) with an independent key; keys from
      sha256 of a validator-specific string; 8 primary keys + 5 sensitivity
      keys per cell; basins by pointer jumping over the whole graph (DP in its
      own basin at distance 0; points never reaching a DP and points beyond
      the cap excluded and reported); fixture by the paper's distinct-DP
      procedure (walks until 2T distinct DPs, every walk charged, capped at
      the cap, (length,+1) credited, weight S_d + 4 W h_d, top-T with seeded
      tie permutation, M = 40000 uniform-start trials, cap 8W). Resource:
      192 s, peak RSS 1.58 GB.
    sealed_values:
      a_topT_share_2^20_a_quarter:
        murmur3_8_keys: {mean: 0.3793, sd: 0.0159, min: 0.3536, max: 0.4064, per_key: [0.4064, 0.3700, 0.3799, 0.3536, 0.3753, 0.3953, 0.3797, 0.3743]}
        splitmix64_5_keys: {mean: 0.3819, sd: 0.0215, min: 0.3555, max: 0.4143}
        ratio_to_model_Cmax_0.39: 0.973 (murmur), 0.979 (splitmix); inside G1's [0.85, 1.05] as a mean; single keys span 0.907-1.062
        top_T_half_share: 0.2615 (murmur; model C_max(1/8) = 0.27)
        capped_mass_fraction: 0.0032 mean (max 0.0134); DP-free-cycle points 1e-4
        sensitivity: cap 8W vs 20W vs uncapped changes the share by <= 0.0002 (identical at 2^20 for murmur); in-degree-0 DPs do not enter the top 64 (no effect); dividing by non-capped mass instead of N adds +0.0013
