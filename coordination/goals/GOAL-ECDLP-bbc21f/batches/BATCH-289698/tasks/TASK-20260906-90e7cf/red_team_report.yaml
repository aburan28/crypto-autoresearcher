        lacks one. results/j3_curve_pool_hook_seed1.json: an in-process re-execution of the seed-1
        curve cell with the producer's unmodified modules and a hook registering every Pool: every
        pool entry's stored log L satisfies key([L]G) == entry (RESEL-L(T) 1690 entries, RESEL-L(T/2)
        1516, NULL-A(T/2) 1297, precomputation 512; 0 failures, 0 None logs); every round's table
        is a subset of the pool; 0 new pool entries not explained by a solved target's used walk;
        per-round table hashes, k_found and solved arrays bit-identical to RUN-ECDLP-612fb1-34
