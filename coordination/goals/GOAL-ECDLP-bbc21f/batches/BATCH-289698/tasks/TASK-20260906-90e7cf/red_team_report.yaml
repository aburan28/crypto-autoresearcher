      required_successor: >-
        Amendment: S1 requires (a) STATIC(T) eps_ss CI-separated above RHO by at least 0.30 (or
        eps_ss >= 0.5) on the cell, (b) the tolerance stated relative to the STATIC(T) - RHO gap
