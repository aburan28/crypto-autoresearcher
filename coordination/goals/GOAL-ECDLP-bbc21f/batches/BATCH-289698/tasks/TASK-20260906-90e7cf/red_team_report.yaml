  baseline_comparison: >-
    Pollard rho with DPs and no table (RHO arm): 0.005-0.007 per target at 2^24, 0.001-0.002 at
    2^30, 0.0039 collisions on the curve -- every table arm is far above it, so no comparison here
    is vacuous on the real object (contrast: on the bijections STATIC(T) is 0.037-0.047 above RHO).
    BSGS is not a comparator at this frontier (it stores N^{1/2} entries; the frontier is T =
    N^{1/3}). The closest specialised baseline is the Bernstein-Lange selected table itself at
    r in {2, 4, 8}, and STATIC2T; numbers in the frontier table above. The re-selected T table
    matches the r = 8 static table at r = 2 precomputation (P-axis gain 6.3x at fixed T, paid in
    S_peak and early batch); the re-selected T/2 table matches a static T/2 table at r about 5-6
    and does not reach static T. Under RQ-ECDLP-78dbc5's fewer_DP definition the record is a
    tradeoff point, not an improvement.

  heuristic_challenges:
    - "HEUR-BLT-7 (batch-pool equivalence): the random-model justification transfers (regression slopes and coverage within the 10% band per the executor), but the formula's evidence volume U k p_s should be the admitted-walk count U x mean walks used by solved targets (about 1.7 not 4); tested scale N in {2^24, 2^30}; no transfer to cryptographic N is claimed or tested."
    - "HEUR-BLT-1/2 (random-function basin law, size-biased sampling): validated by G1 at 2^20 and the information-only quantities at 2^24; the bijection control shows the gates are sensitive (slope -1.6, share 0.025) -- the gate discriminates the random-function object from a bijection of the same size, which is the cheapest deviation that could have fooled it."
    - "The model constant 0.51 rested on an EQUALITY of two independently derived constants (C_max(1/8) = 0.2716 and p_static from 1.79 = 0.27) with zero margin; each input reproduced within its tolerance (0.271; 0.289) and the claim still failed. A heuristic-conditional prediction whose sign depends on a difference of two constants inside their own error bars is not a prediction; it needed the ceiling gate G3."

  cost_model_challenges:
    - "S_peak is the weakest point of the fewer-DPs framing, as the Coordinator's prior said: 8.7-9.9 T uncapped, 2.6-2.8 T at CAP(2T) (not 2 T -- capping happens after a round's admissions); every re-selected cell stores more entries at the online site than STATIC(T)."
    - "eps_ss (last two rounds) is the favourable reading; the RQ's U-indexed epsilon is cumulative: rho_T 0.75-0.77 at 8T; U* unreachable; early-batch penalty 0.13-0.15."
    - "Restart scalar multiplications are counted and excluded from L as the paper does (84-100 group ops per target at 2^24 against L about 300-350 -- 25-30% of L at toy scale, reported); re-selection integer ops 6.3% (2^24) / 1.9% (2^30) of group ops at R = T -- the 5% frozen expectation is exceeded at 2^24 and 2^20 (9.3%), reported not hidden."
    - "L is not equal across the S1 pair (RESEL-L(T/2) 354.0 vs STATIC(T) 327.2 walk steps per target at 2^24); at the interpolated T_sel = 0.65 T it would be about equal, so rho_T is the fixed-(L, eps) quantity, the raw T/2 difference is not."
    - "Total expected cost per success: L per solved target RESEL-L(T/2) 355.5 vs STATIC(T) 319.6 (2^24) -- per-attempt cost x inverse success is reported per arm, not per-attempt alone."

  reduction_and_scope_challenges:
    - "No exponent moves and none is claimed; the CGK S T^2 = Omega~(eps N) ceiling and the multi-instance line S T^2/M + T^2 = O(MN) are respected by construction (no relations stored); the cited Theorem 8/11 readings were not re-read by this reviewer (primary source fetch blocked) and are taken as frozen."
    - "Scope: one toy curve TOY-P24-1ca86fe9187c at a = 1/4, 3 seeds, U = 8T, two arms under control (m); the generic instrument at 2^20, 2^24, 2^30. Nothing about skewed targets, other (a, r, k), other curves, or cryptographic N."
    - "Affected-vs-safe inflation: none present; the record names no scheme."

  proof_architecture_challenges:
    - "Method ceiling (KN-TECH-080 audit 4): the largest claim the mechanism could support is rho_T -> rho_ORACLE about 0.55 at a = 1/4 (2^24); the headline 0.51 exceeded the ceiling. Nearby-object control: the bijection (no trees) collapses the ceiling to a few percent and the pipeline's gates detect it; the a = 1/2 cell is NOT a nearby object with a different conclusion because the same inequality holds at a = 1/4."
    - "Quantifier order: S1's tolerance was chosen absolute before the object's dynamic range was known; on an object with range 0.04 it is satisfied for all tables -- a witness that depends on the object's scale."
    - "Baseline embedding: G2 reproduces 1.79 within tolerance (1.705 / 1.727) and P within [1.05, 1.40] (1.243 / 1.246); the boundary U = 0 equals STATIC bit-for-bit (round-0 identity) -- the old method is genuinely embedded."

  narrowest_supported_statement: >-
    At claim_tier toy, on the generic keyed-random-function instrument at N in {2^24, 2^30} and on
    TOY-P24-1ca86fe9187c (a = 1/4, r = 2, k = 4, cap 8W, uniform independent targets), letting the
    batch's solved walks feed the Bernstein-Lange pool and re-selecting by the published weight
    moves a fixed-size table toward the exact-basin oracle: by U = 8T the full-T re-selected table
    matches the static T table built from 6.3x the precomputation (r = 8), at lower online walk
    cost, paying 2.7-9.8 T entries of working storage, 2-6% re-selection integer operations and
    an early-batch penalty; the T/2 re-selected table reaches a static table of 0.65-0.69 T
    (steady-state; 0.75-0.77 cumulative) with CIs excluding 1.0, bounded below by the oracle floor
    about 0.55, and does NOT reach the static T table -- which no T/2 table can on this instrument,
    since the exact top-T/2 share is below STATIC(T)'s coverage in every exact seed. The gain
    shrinks with r and decays with phi; the relabelled null shows no spurious gain. Nothing about
    exponents, other parameters, or cryptographic N.

