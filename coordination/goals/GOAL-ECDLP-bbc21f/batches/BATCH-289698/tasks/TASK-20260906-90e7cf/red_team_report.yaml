  objections:
    - >-
      OBJECTION 1 (J3, load-bearing, comparator: ORACLE arm on the same seeds). The pre-registered
      headline was infeasible on the instrument: a T/2 table's ceiling (exact top-T/2 share, 0.271
      mean at 2^24) is below STATIC(T)'s exact coverage (0.291) in 10/10 exact seeds at a = 1/4.
      S1's failure is a ceiling failure, not a mechanism failure, and F1's 0.85 threshold was set
      against a model (0.51) that sits below the oracle floor (0.55). The contract gated G1 on
      "STATIC(T) below the top-T share" but never on the inequality the T/2 claim actually needs.
    - >-
      OBJECTION 2 (J3, load-bearing, comparator: STATIC(T) at the online site). "Fewer stored DPs"
      survives on no cell with S_peak counted: the smallest re-selected cell CAP(2T,T/2) holds 2.6 T
      entries against 1 T; and with the RQ's cumulative epsilon the advice ratio is 0.75-0.77 at 8T
      with U* unreachable. The record is a tradeoff point (advice 0.65 T, working 2.6-8.9 T), which
      the RQ's fewer_DP definition explicitly declines to call an improvement.
    - >-
      OBJECTION 3 (J4, load-bearing for the criterion). S1 proves too much: the pipeline reports
      S1_met on the affine-xorshift bijection (T/2 table covering 1.4% of the space) because its
      tolerance is absolute; U_ss and U* report 2T there. S2's positive form is unsatisfiable by
      the null's own design (-0.11 to -0.22 in every real cell). The composite acceptance therefore
      could neither accept correctly (S2) nor reject vacuity (S1) on its own; it was saved on the
      known-false objects by G1, the fixture and S3.
    - >-
      OBJECTION 4 (J3/J4, not load-bearing, comparator: STATIC2T, RSWEEP-STATIC(r=8,T), the
      growth-type table IDEA-20260906-a3d6ae, the CGK multi-instance line). At equal advice T the
      re-selected table equals the r = 8 static table (P 6.3x) at P(r=2) and lower L (297.7 vs
      327.2 at 2^24), so on (P, L, eps) at fixed T it dominates STATIC(T); it pays in S_peak
      (2.8 T capped, 9.8 T uncapped) and the early batch. Against STATIC2T (2 T advice, no working
      storage, no re-selection ops, eps_cum(8T) 0.800 vs CAP(2T,T) 0.804 at 2.76 T entries) the
      capped re-selected T table is not dominated on L (297.9 vs 305.0) but is on entries stored at
      U <= 8T; against a growth table storing the same 10 T known-log DPs (a3d6ae-type; coverage
      at least ORACLE(T) 0.863 > 0.833) it is dominated on (S_peak, eps) as the contract itself
      predicts. The CGK line is not approached: no exponent moves, and the mechanism stores no
      relations. dominated_by for the T/2 headline: STATIC(T) itself (it is not reached).
    - >-
      OBJECTION 5 (J3, not load-bearing). HEUR-BLT-7's r_eff = r + U k p_s / T overcounts the
      admitted evidence by about 1.7x (solved targets stop at the first hit); the executor's
      regression used the formula (r_eff 23.3 at 8T) where the admitted-walk count gives 13.3.
      The heuristic's 10% coverage tolerance is met marginally (0.253 re-selected vs 0.275 at the
      formula's r_eff pool, seed 1) and would read better against the honest r_eff.

