        table (a hit) and no logarithm exists anywhere (certificate kind none, stated in every
        generic manifest); instrument.run_arm admits walks through the single branch `elif solved
        and admit` with solved = anyhit on both arms, so the generic LOWER pool is exactly the set
        of used walks of hit targets -- the same admission rule as the curve arm's, where every
        hit yields a certified log. No generic number is quoted as a solved logarithm in the
