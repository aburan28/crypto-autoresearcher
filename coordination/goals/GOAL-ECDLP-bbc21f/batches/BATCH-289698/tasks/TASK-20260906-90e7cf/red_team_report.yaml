    - id: F-J4-2
      joint: J4
      severity: load_bearing
      classification: REVISE
      title: S2 as written is unsatisfiable -- NULL-A cannot be within CI of zero by construction, so the composite S1-S4 could never accept; the one-sided rule 5 is the operative null test
      evidence: >-
        results/j4_nulla.json (from RUN-037 ci_tables.json and raw arrays). NULL-A(T/2) gain per
        round at 2^24 a=1/4: 0 at round 0, then -0.12 to -0.22 with every CI below zero from round
        1 on (largest -0.220 [-0.251, -0.195], round 14); 2^30: -0.11 to -0.20, all CIs below zero.
        Reference levels: a uniformly random T/2 subset of the r = 2 pool would have single-walk
        coverage 0.25 x 0.336 = 0.084 (per-target 0.30 at k = 4); NULL-A(T/2) reads 0.122 single-
        walk and eps_ss(16T) 0.389 (2^24) / 0.415 (2^30), i.e. NULL-A progressively randomises the
        table from STATIC(T/2) 0.607 toward the random-subset level. That is what uniform
        relabelling over a pool of 2T-9T entries must do; "within CI of zero at every round" is not
        a possible outcome of this null. S1-S4 applied with NULL-A(T/2) in RESEL-L(T/2)'s role:
        S1 fails (-0.32 [-0.34, -0.30] at 2^24, -0.31 [-0.32, -0.30] at 2^30), S3 not applicable,
        S4 holds vacuously (max hit rate 0.21); no round's gain CI is above zero; invalidation rule
        5 does not fire -- the argument fails on this object as required, and the one-sided rule
        is informative: an artifact that credits the table regardless of allocation would raise
        NULL-A, and none does. On the bijection objects NULL-A is at zero (-0.003 [-0.016, +0.010])
        because there is no selection signal to destroy.
      required_successor: >-
        Amendment: S2 becomes one-sided (NULL-A gain CI upper bound <= 0.5 x RESEL-L gain at every
        round and not CI-separated above zero), and the executor's magnitude (-0.11 to -0.22) is
        recorded as the null's own perturbation, 2-3x the effect size, so the null bounds artifacts
        only in the spurious-gain direction. A shape-matched null does not exist for this
        mechanism (the signal IS which entries receive evidence); PHI decay is the stronger
        control and it passed.
