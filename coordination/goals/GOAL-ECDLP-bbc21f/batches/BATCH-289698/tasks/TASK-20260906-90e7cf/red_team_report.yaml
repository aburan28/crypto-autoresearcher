    - id: F-J3-4
      joint: J3
      severity: not_load_bearing
      classification: DISCLOSE
      title: Borrowed precomputation -- the gain is batch evidence in disguise (legitimately charged to L), not operations in disguise; the r_eff formula overcounts by about 1.7x
      evidence: >-
        results/j3_frontier.json borrowed_precomputation. HEUR-BLT-7's r_eff = r + U k p_s / T at
        U = 4T/8T/16T: 12.0 / 22.6 / 44.5 for RESEL-L(T/2) at 2^24 (12.1 / 22.7 / 44.6 at 2^30);
        counted from walks actually admitted (solved targets stop at the first hit, mean 1.7 walks
        not k = 4): 7.5 / 13.3 / 24.9. Priced as static precomputation from the executor's own
        r_eff pools (RUN-013 heur_blt7_regression, seed 1): r_eff 8.2 costs P = 575464 = 8.8
        sqrt(NT); r_eff 14.8 costs 1431402 = 21.8 sqrt(NT); r_eff 28 costs 66 sqrt(NT), against
        P(r=2) = 1.24 sqrt(NT). What the re-selected table actually reaches: RESEL-L(T/2) single-
        walk hit rate over rounds 6-7 = 0.244 (2^24) / 0.241 (2^30), between RSWEEP-STATIC(r=4,T/2)
        0.234 / 0.230 and RSWEEP-STATIC(r=8,T/2) 0.252 / 0.253, i.e. equivalent to a static T/2
        table at r about 5-6 (P about 4-5 sqrt(NT), 3-4x the r = 2 precomputation); RESEL-L(T)
        eps_ss(8T) 0.833 equals RSWEEP-STATIC(r=8,T) 0.830 (2^24) and 0.825 vs 0.837 (2^30), i.e.
        the r = 8 static table at 6.3x the precomputation. Equal-TOTAL-operations static comparator:
        RESEL-L(T/2) spends 26.8 more walk steps per target than STATIC(T) at 2^24 (354.0 vs
        327.2); over 8T targets that is 0.84 sqrt(NT), which buys a static T/2 table at r about 3
        (eps_ss about 0.62) -- below RESEL-L(T/2)'s 0.675 and far below STATIC(T)'s 0.740. So the
        "equal P" framing does not hide an operations subsidy; it hides that the comparison is
        against a static table whose selection is starved of evidence (N/T = 2), which the
        contract states openly (C3) and the r-sweep confirms (gain 0.094 -> 0.048 -> 0.014 over
        r = 2, 4, 8 at T; 0.076 -> 0.032 -> 0.015 at T/2, 2^24).
      required_successor: >-
        State HEUR-BLT-7 with the admitted-walk count (U times mean walks used by solved targets)
        instead of U k p_s, and price the batch's evidence in P-equivalents beside the r-sweep so
        that the P-axis reading ("r = 8 quality at r = 2 precomputation, at S_peak 2.7-10 T and an
        early-batch penalty") is the one the ledger quotes.
    - id: F-J3-5
      joint: J3
      severity: not_load_bearing
      classification: DISCLOSE
      title: LOWER bracket verified -- no unknown-log entry ever enters a pool or a table on the curve arm; the generic admission predicate is the same set of walks
      evidence: >-
