        closed by RESEL-L at 2^24: T/2 0.66 (8T), 0.71 (16T); T 0.76 (8T), 0.90 (16T). Measured
        rho_T(8T) 0.654 / 0.688 and rho_T(16T) 0.619 / 0.632 sit between the floor 0.55 and 1.0
        with CIs excluding 1.0 and (at 2^30) excluding the pre-registered band; the residual
