      joint: J3
      severity: load_bearing
      classification: REVISE
      title: rho_T is a steady-state statement; the RQ's U-indexed frontier is cumulative, where the ratio is 0.75-0.77 and U* is unreachable
      evidence: >-
        results/j3_rho_cumulative.json and results/j3_frontier.json. rho_T on the cumulative
