        fraction as the tested quantity, and report rho_ORACLE beside rho_T on every exact cell.
    - id: F-J4-1
      joint: J4
      severity: load_bearing
      classification: REVISE
      title: S1 proves too much -- it is met on the affine-xorshift bijection where every table is at the floor; U_ss and U* likewise
      evidence: >-
        results/j4_perm_pipeline_verdicts.json (pipeline's own analysis.py, unchanged except two
