      required_successor: none required; keep the hook (src/j3_curve_pool_hook.py) as a regression control for any future curve cell.
    - id: F-J3-6
      joint: J3
      severity: not_load_bearing
      classification: DISCLOSE
      title: The honest reading of the constant -- the mechanism converges toward the oracle as HEUR-BLT-7 says, but the oracle floor on rho_T is about 0.55, above the pre-registered 0.51
      evidence: >-
        results/j3_oracle_floor.json. rho_ORACLE (T_sel/T at which the exact-basin ORACLE(T_sel)
        matches STATIC(T), same interpolation as the producer's rho_T): 2^24 a=1/4 0.553 at 8T
