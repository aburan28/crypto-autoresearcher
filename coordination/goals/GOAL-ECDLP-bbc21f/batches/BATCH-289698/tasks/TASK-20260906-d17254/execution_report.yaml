  anomalies:
  - Stage 1 seed 1 showed mean online walk length 1.25-1.36 W; diagnostics/walk_quality_check.py (12 keys) found
    the construction indistinguishable from a true random table with per-instance sd ~ sqrt(a/T); recorded as a
    finite-N feature, not an error.
  - RUN-ECDLP-869870-016-analysis-stages12 failed_infrastructure (SyntaxError, Python 3.11 f-string); superseded
    by the analysis run named above; kept in the ledger.
  - The concurrent executor (EXP-ECDLP-612fb1) overwrote this task's scratchpad console log stage2.log; run records
    unaffected.
  - Peak RSS at 2^24 (about 0.95 GB) exceeds the analytic 5 x 4 x N = 0.34 GB because bincount and where() temporaries
    are int64/bool copies; far below the 8 GB ceiling.
  - 'Exact-vs-sampled cross-check: at N = 2^20, a = 1/8 (29/130) and a = 1/4 (22/130) the exact coverage lies outside
    the sampled Wilson interval far more often than 5%; the misses are marginal (exact value at the interval edge,
    e.g. 0.1265 vs [0.1265, 0.1331]) and the 130 checks per (N, a) are correlated: the 26 tables of a seed share
    one set of 40000 online walks and the six r = 1 tables are the same table. Recorded as observed; V3 is scored
    by the reviewers.'
  - 'Sigma decay: a few cells at r = 2 (and one at r = 4, one at r = 16) show a non-monotone step in the exact coverage
    curve (exact numbers per seed in the analysis summary nulls block); no cell is flat for r > 1; relabelling minus
    unselected lies within 1.96 seed-sd at every cell except (2^22, a = 1, published_weight/r = 16).'
  - 'Curve arm: the r_walk = 16 walk gives KS rejection at alpha = 0.01 in 3/3 seeds at both a and generic-minus-curve
    differences whose seed-spread CI excludes 0 for the top-T share and the r = 2 coverage; at r_walk = 32 the KS
    majority does not reject and most constants'' differences include 0 (exception: sampled scaled cost at a = 1/2,
    r = 2). Reported as a walk-quality observation per the contract; not interpreted here.'
  - 'N-drift block: the linear O(theta) trend fitted on 2^20-2^24 extrapolated to theta(2^30) lies outside the 2^30
    bootstrap intervals for every fixture cost cell (drift 0.18-0.42); the 2^30 values themselves sit within 0.10
    of the published values (2^30 gate PASS) while the 2^24 gate reads FAIL; both are recorded as measured under
    the rule-3 label.'
  - The (B4) note in the contract expected measured precomputation 1-12% above the published values; the measured
    residuals at 2^24 are recorded in fixture_gate['24'] as they are.
