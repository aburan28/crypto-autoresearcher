  # ------------------------------------------------------- cost model
  cost_model_challenges:
    - id: C1
      severity: material
      uncharged_term: >-
        The cost of FINDING the T_sel table. TopShare(T_sel) is the top 128 basins
        by TRUE EXACT SIZE. Obtaining it requires exact basin computation, which
        is Theta(N) time and Theta(N) memory. The advertised cost tuple charges
        S = 6144 bits of advice and P = 34509-51762 group operations of pool
        generation. It does not charge the Theta(N) term at all.
      is_it_recorded_anywhere: >-
        Yes, as a run resource: 23.7 s CPU and 497 MB peak RSS per seed at
        N = 2^24 in cost_table.json measured_run_resources. It is measured and
        disclosed. It is simply not in any S or P column.
      why_it_matters: >-
        This is precisely why the result is a CEILING and not a MECHANISM, and it
        is the single largest uncharged term in the package. At cryptographic
        scale Theta(N) = Theta(2^256), which is worse than the ECDLP instance the
        table is meant to help solve. Any reader who takes the S and P columns as
        the cost of the a = 1/16 object is off by the entire problem.
      producer_at_fault: false
      producer_at_fault_note: >-
        The Executor asserts no mechanism and disclaims attainment explicitly. The
        risk is in how the cost table reads to a later consumer, not in what was
        written.
    - id: C2
      severity: material
      uncharged_term: >-
        The online cost of USING the table -- the batch size U and the per-query
        walk cost. No online arm of any kind ran. EV-ECDLP-60e266's rho_T(U)
        steady-state and cumulative terms are the relevant quantities and none of
        them is in this batch.
      why_it_matters: >-
        "Batch ECDLP with precomputation" is a statement about amortising over U
        targets. This batch measures a single-walk hit probability and says
        nothing about U.
    - id: C3
      severity: low
      uncharged_term: >-
        Inverse success probability. The >= 4-of-5 rule tolerates one failing
        seed, so an instance drawn at random from the same family carries a
        per-seed success rate, not 1. Measured over 20 seeds it is 20/20 at
        a = 1/16 and 19/20 at a = 1/8, so the correction is between 1.00x and
        1.05x -- small here, but it is set to 1 implicitly rather than derived.
      why_it_matters: >-
        Small at these parameters; named because per-attempt cost times inverse
        success probability is the bookkeeping the target profile requires and it
        is currently absent rather than negligible-by-argument.
    - id: C4
      severity: low
      uncharged_term: >-
        Capped walks. capped_walk_fraction_mean is reported (0.2-0.4% at r = 2)
        but the cost of a capped walk is folded into P rather than accounted
        separately, and a capped walk contributes no DP.
      why_it_matters: minor at this cap (8W); would matter if the cap were tightened

  # ------------------------------------------------- scope and reduction
  reduction_and_scope_challenges:
    - >-
      No group. The instrument is a keyed random function on Z_N with an
      independently keyed DP predicate. There is no curve arm, no cryptographic
      N, and no named scheme. Nothing in this batch is an ECDLP result, and the
      producer does not say it is.
    - >-
      No exponent. Every statement is a constant-factor statement under the
      Corrigan-Gibbs--Kogan S*T^2 = Omega~(eps*N) preprocessing ceiling
      (KN-LIT-013, cited via the v1/v2 contracts; provenance internal -- this Red
      Team did not open the corpus entry). No asymptotic promotion gate is
      engaged, so the coordinator's asymptotic promotion gates do not apply and
      must not be recorded as passed.
    - >-
      The scale gap, in orders of magnitude. Tested N spans 2^20 -> 2^24: a factor
      of 16, 1.2 orders of magnitude. A cryptographically relevant group order is
      about 2^256, another ~70 orders of magnitude, with T = N^(1/3) moving from
      256 to about 2^85 -- roughly 25 orders of magnitude in T. The batch's entire
      N-dependence evidence is two points: the pooled a = 1/8 margin is +0.004724
      at N = 2^20 and +0.006933 at N = 2^24. It did not shrink. Two points do not
      carry a trend and I do not read one.
    - >-
      What breaks first, named: estimator_loss(T, r = 2). See O7. If it drifts
      with T the a-crossing moves with T and nothing transfers.
    - >-
      claim_tier: toy is correctly stated and correctly scoped. 4-core container,
      N <= 2^24, five seeds, one instrument family.

  # ----------------------------------------------------- heuristics / proof
  heuristic_challenges:
    - >-
      There is no numbered heuristic in this batch to challenge, and no
      conditional theorem. The amendment states a predicate and measures it. I
      record this rather than manufacturing a heuristic objection: the
      exemplar-style heuristic inventory does not apply to a pure measurement
      batch, and pretending it does would be a fabricated objection.
    - >-
      The one implicit modelling assumption I did find is the a-monotonicity of
      feasibility, which the known-false labelling depends on. I checked it:
      mean per-seed margin over 20 seeds at N = 2^24, r = 2 is +0.020494,
      +0.009196, -0.006078, -0.018394 for a = 1/16, 1/8, 3/16, 1/4. Monotone
      decreasing. The known-false labelling is consistent with the measured
      ordering.
  proof_architecture_challenges:
    - >-
      No proof, lemma decomposition, or asymptotic argument is offered in this
      batch, so there is no proof architecture to attack and no proves-too-much
      test to run against an ARGUMENT. The proves-too-much control here is run
      against OBJECTS, which is J4, and is answered there.

  # ---------------------------------------------------------- obstruction
  obstruction:
    name: estimator-loss saturation
    what_it_obstructs: >-
      G3 feasibility at a >= 3/16 under this instrument, T_sel = T/2, r = 2 --
      and, if the saturation persists in T, the transfer of the a-crossing to
      larger parameters.
    quantity: >-
      estimator_loss = TopShare(T) - StaticCov(T, r), the coverage the w(d)
      selection gives up against a full-table oracle
    units: exact single-walk hit probability (dimensionless coverage fraction of N)
    measured_values:
      N_2_24_T_256_r_2_five_frozen_seeds:
        - {a: 0.0625, mean: 0.086427, sd: 0.005424, min: 0.080709, max: 0.093891}
        - {a: 0.1250, mean: 0.099115, sd: 0.002594, min: 0.095507, max: 0.102094}
        - {a: 0.1875, mean: 0.098247, sd: 0.010995, min: 0.088372, max: 0.111361}
        - {a: 0.2500, mean: 0.099258, sd: 0.011700, min: 0.084919, max: 0.112768}
      N_2_20_T_64_r_2_five_frozen_seeds:
        - {a: 0.0625, mean: 0.080968}
        - {a: 0.1250, mean: 0.095537}
        - {a: 0.1875, mean: 0.103840}
        - {a: 0.2500, mean: 0.099049}
    error_bars: >-
      sample standard deviation over the five frozen seeds, quoted above. With
      n = 5 these are indicative only; the 20-seed extension I ran covers the
      margin, not the decomposition, so I do not quote a tighter interval than
      the data supports.
    source_runs:
      - RUN-ECDLP-612fb1-v3-g3x24-s1
      - RUN-ECDLP-612fb1-v3-g3x24-s2
      - RUN-ECDLP-612fb1-v3-g3x24-s3
      - RUN-ECDLP-612fb1-v3-g3x24-s4
      - RUN-ECDLP-612fb1-v3-g3x24-s5
      - RUN-ECDLP-612fb1-v3-rep20-s1
      - RUN-ECDLP-612fb1-v3-rep20-s2
      - RUN-ECDLP-612fb1-v3-rep20-s3
      - RUN-ECDLP-612fb1-v3-rep20-s4
      - RUN-ECDLP-612fb1-v3-rep20-s5
    derivation_note: >-
      recomputed by this Red Team from each measurement run's own raw-result.json;
      the decomposition is arithmetic on quantities the runs already record and
      introduces no new measurement.
    claimed_scope: >-
      The frozen v2 splitmix64 instrument with an independently keyed DP
      predicate, exact basins, T in {64, 256}, T_sel = T/2, r = 2, N in
      {2^20, 2^24}, five seeds. NOTHING outside that. In particular this is not
      claimed for any group, any curve, any other selection weight, or any T
      beyond the two measured.
    reading: >-
      The estimator loss saturates near 0.099 for every a >= 1/8 at BOTH tested N
      while the halving loss tracks TopShare(T) and grows with a. G3 is feasible
      exactly where TopShare(T) is small enough that roughly a third of it sits
      under that ~0.099 ceiling. The crossing lies between TopShare(T) = 0.271
      (a = 1/8, PASS) and 0.339 (a = 3/16, FAIL).
    resource_check:
      examined: true
      which_theory_reads_this_as_an_asset: >-
        A ~0.099 saturating estimator loss that is nearly INDEPENDENT of a and of
        N is a much more interesting object than the boolean it was reduced to.
        If it is genuinely a constant of the w(d) estimator rather than a
        parameter-dependent quantity, then it is a reusable budget: it says how
        much coverage ANY w(d)-selected table gives up, and it converts the
        feasibility question at any (a, T) into the single arithmetic test
        "is the halving loss below the constant?". That would make the crossing
        predictable rather than measurable-only, and would let a successor
        predict the crossing a for parameters too large to measure. The same
        saturation that kills a >= 3/16 is the hypothesis of that successor.
      what_would_have_to_be_true: >-
        estimator_loss(T, r = 2) must stay near 0.099 as T grows. Measured at
        exactly two T points. This is the same quantity as O7 and the same
        experiment tests both: the asset reading and the transfer claim stand or
        fall together, which is convenient rather than suspicious -- one T-sweep
        resolves both.
      recorded_as_a_resource_not_a_verdict: true

  # --------------------------------------------------- narrowest statement
  narrowest_supported_statement: >-
    CONDITIONAL on J1 and J2, which I am blind to: at N = 2^24, on the frozen v2
    splitmix64 keyed-random-function instrument with an independently keyed DP
    predicate, T = 256, T_sel = 128, r = 2, exact basins and the five declared
    seeds, the exact single-walk coverage of the best-possible 128-entry table
    reached or exceeded the exact coverage of the w(d)-selected 256-entry table at
    a = 1/16 (5/5, pooled margin +0.020565) and at a = 1/8 (5/5, pooled margin
    +0.006933), and did not at a = 3/16 (0/5) or a = 1/4 (0/5). This is a
    statement about the basin-size distribution and the w(d) estimator's loss at
    those parameters and nothing else. It survives four independent attacks I ran:
    a uniform-bias control-power analysis, a 15-seed extension, a halving-loss null
    the batch did not have, and a cost/scope audit. It licenses NO mechanism (the
    T_sel table is an oracle and zero online arms ran), NO exponent, NO statement
    about any group or curve, and NO statement about batch ECDLP with
    precomputation at cryptographic scale, which is roughly 70 orders of magnitude
    in N and 25 in T beyond the tested cells.
  remaining_uncertainty_named_rather_than_rounded:
    - >-
      I could not break the measured result. That is NOT the same as saying it is
      correct. Correctness at the predicate level -- does g3_predicate implement
      the contract's G3 -- is J1, and independent re-derivation is J2. Both are
      the Validator's and I am blind to both. If the predicate is wrong, every
      control I ran is wrong in the same direction, because they all run on the
      producer's code path.
    - >-
      All four of my attacks share that single point of failure. Running my
      controls through the producer's own measure_cell was the right call for
      comparability -- a difference cannot then be an instrumentation difference --
      but it means my agreement with the producer carries no independence about
      the instrument itself. Only J2 can supply that.
    - >-
      The a = 1/8 PASS is roughly four times less robust than the a = 1/16 PASS on
      two unrelated measures (verdict-statistic headroom 0.005128 vs 0.017438;
      NULL_A ratio 0.089 vs 0.360). Both PASS; they should not be quoted as
      equally strong.
    - >-
      R3 is open. This batch supplies no independent angle from my side, and
      whether it supplies one at all depends entirely on J2.
    - >-
      Whether any of this transfers rests on estimator_loss(T) flatness measured
      at two T values.
  did_the_claim_survive: >-
    Yes, on my joints, with the qualifications above. I attacked the mechanism
    rather than the presentation, built the control the contract was missing,
    built two known-false objects the contract did not have, and measured the
    frozen control's type-I error rate. The claim survived all of it, and it
    survived a proves-too-much object roughly 20x stronger than the one it was
    given. The thing this batch does NOT have -- and the amendment asserted it
    would -- is an independent implementation.

  next_concrete_action:
    ranked:
      - rank: 1
        action: >-
          Run the T-sweep of O7: T in {64, 128, 256, 512, 1024} at fixed
          N = 2^24, r = 2, five seeds, reporting estimator_loss and halving_loss
          separately rather than the boolean.
        why_first: >-
          It is the cheapest experiment that could still overturn the interesting
          part of the claim, it discharges the obstruction's resource_check, and
          exact basins are already affordable at these parameters. Minutes of
          compute.
      - rank: 2
        action: >-
          Discharge residual R3 with a genuinely independent implementation --
          different random-function family, independently written basin closure,
          written by an agent that has not read source_v2/instrument.py.
        why: >-
          R3 is open and this batch cannot close it. Until it is closed, the
          a = 1/8 disagreement inside EV-ECDLP-2e9680 stands unresolved.
      - rank: 3
        action: >-
          Adopt RC1 and RC2 in any successor contract: NULL_T (or an equivalent
          halving-loss null) in the declared control set, and 20 seeds at
          known-false cells with the type-I rate reported.
      - rank: 4
        action: >-
          Report the zero-crossing rho_ORACLE(a) = t*/T instead of the boolean at
          t = T/2. EV-ECDLP-60e266 already names this quantity; it is continuous,
          far more informative, and costs one extra sort per (a, seed) once the
          exact basins exist. Four numbers in place of four bits.
      - rank: 5
        action: >-
          Ledger housekeeping (O8): record EXP-ECDLP-612fb1 in
          H-ECDLP-37dc01.test_boundary.boundary_amendments alongside
          EXP-ECDLP-6ac801.
    what_i_do_not_recommend: >-
      I do not recommend closing this lane, and I record that explicitly. Nothing
      I found is a named obstruction against the direction; the one obstruction I
      measured reads at least as well as a resource (see resource_check) as it
      does as a barrier. A negative reading of this batch would be premature
      closure.

