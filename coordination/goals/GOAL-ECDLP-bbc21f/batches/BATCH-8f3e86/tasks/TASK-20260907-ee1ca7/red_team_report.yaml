red_team_report:
  id: RT-20260907-ee1ca7
  id_note: >-
    Derived from this task id, following the convention of
    coordination/goals/GOAL-AES-003/batches/BATCH-002/tasks/TASK-20260802-958bac/red_team_report.yaml.
    tools/allocate_id.py has no `redteam` type: this is a review artifact, not a
    ledger record, and it mints no ledger identifier.
  task_id: TASK-20260907-ee1ca7
  goal_id: GOAL-ECDLP-bbc21f
  batch_id: BATCH-8f3e86
  experiment_id: EXP-ECDLP-612fb1
  contract: experiments/EXP-ECDLP-612fb1/amendments/v2_to_v3.yaml
  role: red-team
  recorded_at: '2026-09-07'
  reviewed_snapshot_commit: fe6cdf59f
  session_independence:
    independent_session: true
    originated_the_claim: false
    read_sibling_reports: false
    blindness_declared_in_plan: 'lifted_for: []'
  citation_provenance_note: >-
    Every quantity in this report is provenance `internal` -- read from committed
    artifacts under experiments/EXP-ECDLP-612fb1/ and ledger/, or computed by this
    Red Team's own scratch diagnostics under this task directory. No external
    source was opened. The one external result named anywhere in my joints is the
    Corrigan-Gibbs--Kogan preprocessing ceiling, cited via the v1/v2 contracts as
    KN-LIT-013 with provenance `internal`: this Red Team did not open the corpus
    entry and it backs nothing here.

  # ---------------------------------------------------------------- policy
  inference:
    requested_policy: review-breakthrough
    requested_reasoning_effort: max
    routing_rule: unrecoverable-result-review
    routing_basis: >-
      the result can contradict validated evidence EV-ECDLP-2e9680 and
      EV-ECDLP-f6b3f5
    degradable: false
    fallback_allowed: false
    fallback_used: false
    degraded_requirements: []
    served:
      runtime: claude_code
      subagent: red-team-breakthrough
      resolved_model_id: claude-opus-5
      provider: anthropic
      reasoning_effort: max
      effort_binding_source: >-
        .claude/agents/red-team-breakthrough.md frontmatter `effort: max`, which
        tools/check_runtime_bindings.py holds equal to review-breakthrough's
        `reasoning_effort: max` in orchestration/model-policies.yaml
      configuration_resolution_checked: >-
        `python3 -m orchestration.adapter resolve --role red-team --policy
        review-breakthrough --independent-session` returned
        `review-breakthrough -> anthropic:claude-opus-5 (effort=max)`
      model_verified: false
      model_verified_note: >-
        This is a CONFIGURATION resolution, not a probe. I did not run
        `doctor --probe` and I cannot verify from inside the session that the
        effort actually applied. I report what the binding declares and mark it
        unverified rather than asserting a probe I did not run.
    accepted: true
    refusal: null
    refusal_note: >-
      The policy is degradable: false and I was instructed to refuse rather than
      proceed at a lower tier. I did not refuse: the resolved binding is the one
      the policy requires and no fallback or degradation was applied.

  # ---------------------------------------------------------------- claim
  claim_under_review: >-
    That the G3 feasibility predicate returns PASS at N = 2^24, T = 256,
    T_sel = 128, r = 2 on the frozen v2 splitmix64 instrument with exact basins
    over seeds {1..5}, at a = 1/16 (5/5) and a = 1/8 (5/5), and FAIL at
    a = 3/16 (0/5) and a = 1/4 (0/5); that the same grid at N = 2^20 gives
    5/5, 4/5, 1/5, 0/5; and that the declared controls -- proves-too-much,
    NULL_A_G3, NULL_B_G3 and DECAY_G3 -- returned the outcomes the contract
    requires.
  joints_owned: [J4, J5, J6]
  joints_not_owned: [J1, J2, J3]
  joints_not_owned_note: >-
    J1 (predicate fidelity), J2 (blind re-derivation) and J3 (the 2^20
    replication) belong to TASK-20260907-b2a8ad. I did not read that task
    directory and I take no position on those joints. Several of my conclusions
    are explicitly conditional on them.

  # ---------------------------------------------- per-joint verdicts
  per_joint_verdicts:
    - joint: J4
      name: proves-too-much
      verdict: holds
      qualifier: >-
        holds with a measured and material limitation on the control's power,
        which I then closed with a control I built and ran
      reason: >-
        The control did not fire as executed and I could not make it fire on the
        frozen draw. But the Section 6 set as a whole is weak: it detects a
        uniform upward bias in the margin only once that bias reaches 0.017737,
        while a bias of only 0.005128 would manufacture the a = 1/8 PASS. That
        leaves a blind band 2.46x as wide as the a = 1/8 PASS headroom. I then
        constructed a much stronger known-false object (NULL_T, see J5) whose
        bias-to-fire is 0.000869 -- 5.9x SMALLER than the a = 1/8 headroom -- and
        it returned FAIL at every a. Under that strengthened control the blind
        band is empty at both primary cells. The claim survives a control
        materially stronger than the one the contract froze.
      artifact: j4_proves_too_much.json
    - joint: J5
      name: nulls and decay
      verdict: holds
      qualifier: >-
        holds as written; a structural gap in the control SET is reported as a
        finding, and the missing control was supplied and run
      reason: >-
        NULL_A_G3 relabels the SAME pool draw (verified by code reading), its
        margin exceeds the signal margin in 120/120 rows, and the Coordinator's
        named artifact tell -- margin_null not materially larger than margin --
        does not fire. NULL_B_G3's 120/120 is a genuine invariance between two
        materially different implementations, not two names for one path.
        DECAY_G3 destroys the sign, not merely the magnitude. The gap: all three
        declared controls act on the ESTIMATOR loss and none touches the HALVING
        loss, which is what produces the a-dependence the claim is about. I built
        NULL_T to close that gap and it returned 0/5 at every a.
      artifact: j5_controls_audit.json
    - joint: J6
      name: cost, scope, and what a PASS licenses (including U1)
      verdict: breaks
      breaks_on: >-
        NOT the producer's package, which I could not break. It breaks on the
        frozen amendment's own residual R3, whose premise the batch's numbers
        refute.
      reason: >-
        I audited the Executor's package for the four failure modes the review
        plan named -- ceiling read as mechanism, a bare ratio without its
        frontier tuple, measured and modeled mixed, scope overreach -- and found
        none of them. The break is one level up: R3 asserts STAGE 3B is a third
        INDEPENDENT angle with a different random-function family and basin-closure
        implementation. Exactly one of its three stated differences is true (the
        experiment identifier). STAGE 3B imports source_v2/instrument.py
        unchanged, which is the same module EV-ECDLP-2e9680 records
        EXP-ECDLP-6ac801's production arm as reusing. The bitwise agreement U1
        flags is the proof, not a coincidence.
      artifact: j6_cost_scope_audit.md
  terminal_verdict_on_my_joints: >-
    J4 holds, J5 holds, J6 breaks on the contract's premise for U1 and holds on
    everything the producer wrote. I attacked the measured claim on four
    independent routes -- control power under a uniform bias model, fifteen fresh
    seeds, a null object nobody had built, and the cost/scope audit -- and it
    survived all four. I could not break the measured result. That is different
    from saying it is correct: correctness at the predicate level is J1 and J2,
    which I am blind to by construction, and every statement below is conditional
    on them.

  # ---------------------------------------------------------------- objections
  objections:
    - id: O1
      joint: J4
      severity: material
      status: raised_and_then_closed_by_a_control_this_red_team_built_and_ran
      statement: >-
        The six Section 6 known-false objects do not protect the a = 1/8 PASS.
        Under a uniform additive bias model, the binding object (a = 3/16,
        r = 2, N = 2^24) fires only at bias b = 0.017737, whereas b = 0.005128
        already manufactures the a = 1/8 PASS. Every uniform upward bias in
        (0.005128, 0.017737) -- a band 2.46x the PASS headroom -- would produce
        the reported a = 1/8 result with all six controls still returning FAIL.
      why_it_matters: >-
        a = 1/8 is the load-bearing new cell: it is the cell where
        EV-ECDLP-2e9680 records a blind/production disagreement, so it is
        precisely where an undetected common-mode bias would do the most damage.
      a_1_16_by_contrast:
        blind_band: [0.017437577, 0.017736971]
        width: 0.000299394
        width_over_pass_headroom: 0.01717
        reading: >-
          almost fully protected -- the band is 1.7% of the headroom
      bias_model_limits: >-
        A uniform additive bias is ONE model of how the argument could be wrong.
        A bias that varies with a is not covered by this analysis and would need
        a different control. I state the model rather than implying generality.
      falsification_route_cheapest: >-
        Add NULL_T (O3 below) to the declared proves-too-much set. Its
        bias-to-fire is 0.000869 at a = 1/8 and 0.000626 at a = 1/16, both
        strictly below the corresponding PASS headrooms, so the blind band
        becomes empty at both primary cells. Cost: 20 measure_cell calls,
        114.6 s wall on this container -- already run, see scratch/tail_null.json.
      outcome: >-
        Closed. Under the strengthened control the objection does not stand.
        I report it because the CONTRACT's set was insufficient and a later
        reader should not take "proves-too-much did not fire" as protection it
        did not provide.
    - id: O2
      joint: J4
      severity: material
      status: open
      statement: >-
        a = 3/16 at r = 2, N = 2^24 is not decisively known-false at five seeds.
        Over 20 seeds, 4 have margin >= 0 (seeds 13, 15, 17, 20); over all
        C(20,5) = 15504 five-seed draws, 16 return G3 PASS -- a measured type-I
        error rate of 1.03e-3 for the control at this object. The frozen draw's
        m(4) is -0.017737 but the MEDIAN draw's m(4) is -0.008719, so the
        contract froze a draw that is roughly twice as favourable to the control
        as a typical one.
      answers_the_handoff_question: >-
        The handoff asks whether a known-false object landing 5.5e-5 from the
        sign boundary means the control passed or nearly failed. Neither, as
        stated: -5.525e-5 is a SINGLE-SEED maximum and the frozen ">= 4 of 5"
        rule cannot see it. Moving that one seed across zero takes pass_count
        from 0 to 1, still FAIL. The object's real distance from firing is
        0.017737 in m(4) -- it was not close. The genuine concern is the
        different one this objection states: over draws it is much closer than
        the frozen draw shows.
      why_it_matters: >-
        Any later reading that treats "a = 3/16 FAILS 0/5" as a sharp separator
        between feasible and infeasible a is reading more than the data supports.
      falsification_route: >-
        Raise the seed count at the known-false cells from 5 to 20 in any
        successor contract. Already measured here: it does not change any
        verdict, and it converts a boolean into a rate.
      what_survives_unchanged: >-
        a = 1/4 is 0 of 20 seeds positive and 0 of 15504 draws PASS.
        EV-ECDLP-60e266's obstruction is corroborated at four times the seed
        count, not eroded. a = 1/16 is 20/20 and 15504/15504; a = 1/8 is 19/20
        and 15504/15504. Both PASS cells are robust to the draw.
    - id: O3
      joint: J5
      severity: material
      status: raised_and_answered_by_a_null_this_red_team_built_and_ran
      statement: >-
        The declared control set has a structural gap. Writing
        margin = [TopShare(T) - StaticCov(T, r)] - [TopShare(T) - TopShare(T_sel)]
        = ESTIMATOR loss - HALVING loss, all three declared controls act on the
        estimator loss and none touches the halving loss. NULL_A drives the
        estimator loss to its uninformative maximum; DECAY_G3 shrinks it by
        improving the comparator; NULL_B checks the selection that produces it.
        But the halving loss is what carries the a-dependence, and therefore what
        the claim is about.
      mechanism_this_makes_visible: >-
        The estimator loss SATURATES near 0.099 for every a >= 1/8 at BOTH tested
        N (0.0955 / 0.1038 / 0.0990 at N = 2^20, T = 64; 0.0991 / 0.0982 / 0.0993
        at N = 2^24, T = 256), while the halving loss tracks TopShare(T) and grows
        with a. G3 is feasible exactly where TopShare(T) is small enough that
        roughly a third of it sits under that ~0.099 ceiling. The crossing lies
        between TopShare(T) = 0.271 (a = 1/8, PASS) and 0.339 (a = 3/16, FAIL).
      falsification_route_taken: >-
        I constructed NULL_T, a tail null: keep N, the map, the DP set, the pool
        draw, w(d), the tie-break, the selected table, the reachable basin mass M
        and the DP count D exactly as measured; replace only the basin SIZES with
        a uniform multinomial allocation of M over D basins, preserving rank
        order. Prediction declared before the run: if the stated mechanism
        produces the PASS, NULL_T must FAIL at every a including a = 1/16.
      result: >-
        NULL_T returns 0/5 at every a. The margin collapses from +0.020565 to
        -0.000626 (a = 1/16) and from +0.006933 to -0.000869 (a = 1/8). The
        halving loss collapses from 0.0659 to 0.00069 and from 0.0922 to 0.00092.
        Basin-size tail concentration is what produces the PASS.
      honest_limit: >-
        The FAIL is close to structurally forced -- under a flat allocation every
        T-subset covers about T*(M/D)/N and TopShare(T_sel) about half of that,
        so a negative margin is near-inevitable. Its value is attribution and
        control power, not surprise, and I do not present it as a surprising
        result.
    - id: O4
      joint: J5
      severity: material
      status: open
      statement: >-
        DECAY_G3's power is materially weaker than it looks. instrument.
        generate_pools generates ONE walk sequence and snapshots it at each target
        size -- its own docstring says pools for larger r extend the smaller ones
        -- so the r = 4 and r = 8 pools are supersets of the r = 2 pool, not
        independent draws. And TopShare_s(T_sel) is BITWISE IDENTICAL across
        r = 2, 4, 8 at every (N, a, seed): at N = 2^24, a = 1/16, seed 1 it is
        0.12206727266311646 at all three r. So r acts only on the comparator
        StaticCov(T, r), never on the signal.
      consequence: >-
        A monotone decrease of the margin in r is close to structurally forced:
        more pool can only improve a top-T selection from it, while the oracle
        term is fixed. The control cannot fail to decay for reasons that have
        anything to do with the hypothesis.
      what_it_still_licenses: >-
        The sign does flip -- 40/40 rows monotone non-increasing, FAIL by r = 4
        at all eight (N, a) cells, every per-seed margin negative at r = 4 and
        r = 8. That is destruction, not attenuation, and it does rule out the
        specific artifact of a margin that never decays. It just does not test
        the mechanism.
      falsification_route: >-
        Vary r with INDEPENDENT pool draws per r rather than nested snapshots,
        and separately sweep T_sel/T at fixed r so that a parameter acts on the
        oracle term. Either would give the decay control power it currently lacks.
        Cost: one flag in generate_pools and a re-run of the r-sweep,
        ~ 5 minutes at N = 2^24.
    - id: O5
      joint: J5
      severity: low_on_the_package_material_on_the_review_chain
      status: open
      statement: >-
        The "pooled ratio margin/margin_null of 0.32-0.36 at r = 2" that the
        review chain is carrying is the a = 1/16 row ONLY -- 0.3180 at N = 2^20
        and 0.3599 at N = 2^24. At a = 1/8, the load-bearing new cell, the ratio
        is 0.0651 [0.0072, 0.0958] and 0.0888 [0.0604, 0.1200]: four to five
        times lower.
      not_a_producer_defect: >-
        The producer published all four ratios in the analysis artifacts. This is
        a summarisation risk in the review chain, not an overclaim in the package.
        I flag it because the summary figure is the one that travels.
      reading_of_the_ratio_asked_for_by_the_handoff:
        does_w_carry_real_signal: 'YES'
        basis: >-
          The Coordinator's named artifact tell is margin_null NOT materially
          larger than margin, i.e. a ratio near 1. Measured ratios are 0.36 and
          0.09 at N = 2^24, margin_null exceeds margin in 120/120 rows, and w(d)
          recovers 64% (a = 1/16) and 91% (a = 1/8) of the gap between an
          information-free selection and the ceiling. The tell does not fire and
          the comparator is not degenerate.
        the_adversarial_reading_of_the_same_number: >-
          The ratio also measures how much of the instrument's dynamic range the
          claim survives on. At a = 1/8 the PASS rests on the last 8.9% of the
          gap between random selection and the ceiling; at a = 1/16 on 36.0%.
          Read that way the null says the a = 1/16 PASS is about four times more
          robust than the a = 1/8 PASS -- the SAME ordering my independent J4 bias
          analysis produces from the verdict statistic (headroom 0.017438 against
          0.005128). Two unrelated routes agreeing is worth more than either alone.
        what_the_ratio_does_NOT_license: >-
          NULL_A tests "is w(d) better than an information-free selection". That
          is a low bar and clearing it was close to a priori certain. It is NOT a
          null for the SIGN of the margin, which is the load-bearing quantity.
          Passing NULL_A licenses "the comparator is not degenerate" and nothing
          stronger.
    - id: O6
      joint: J6
      severity: material
      status: open_and_unresolved_by_this_batch
      statement: >-
        U1: STAGE 3B is not a third independent angle. The amendment's residual
        R3 describes it as "a different experiment identifier, a different
        random-function family, a different basin-closure implementation from
        either 6ac801 arm." Exactly one of the three is true. Section 3's
        reading_P1_frozen_instrument REQUIRES STAGE 3B to use v2's splitmix64 map
        and DP predicate verbatim and REQUIRES run_stage3.py to import
        source_v2/instrument.py unchanged; g3_predicate.exact_basins is a one-line
        delegation to I.exact_basins. EV-ECDLP-2e9680's
        a_1_8_disagreement.root_cause records EXP-ECDLP-6ac801's production Stage
        B as reusing that same module unchanged.
      the_numbers_confirm_it: >-
        STAGE 3B's r = 2 margins at N = 2^24 reproduce 6ac801's PRODUCTION
        margins to all six quoted decimals at every a (U1), and STAGE 3A
        reproduces the committed a-scan bitwise, maximum absolute difference
        exactly 0.0 over 20 rows (U3). Two deterministic programs sharing a
        module, a seed policy and a pool draw agreeing bitwise is a determinism
        check, not corroboration. It is a valuable determinism check -- it proves
        the new driver did not corrupt the frozen instrument -- but it carries no
        independence.
      three_consequences:
        - >-
          STAGE 3B does not resolve the a = 1/8 disagreement inside
          EV-ECDLP-2e9680. That disagreement is blind (1/5) against production
          (5/5); STAGE 3B re-executes the production side. Re-running one side of
          a disagreement cannot settle it, however many decimals it reproduces.
          The Executor states this correctly and claims nothing else.
        - >-
          R3 is still owed. The amendment's own text is what asserted it had been
          discharged.
        - >-
          Whether this batch delivers ANY independent angle rests entirely on the
          Validator's J2 blind re-derivation, which I am blind to by construction.
          I cannot judge it and I record the limit rather than filling it. The
          frozen plan already discloses that J2's independence is itself partial:
          the re-deriver must read the amendment, whose Section 1 quotes the prior
          lane's per-seed margins.
      falsification_route: >-
        A genuinely independent angle needs a different random-function family
        (not splitmix64) and an independently written basin-closure, run by an
        agent that has not read source_v2/instrument.py. Until that exists, R3 is
        open. This is not expensive -- the predicate is ~200 lines -- but it
        cannot be satisfied by anything already in this batch.
      is_this_producer_error: false
      producer_conduct_note: >-
        The Executor flagged the bitwise coincidence itself, as U1, without
        drawing the conclusion. The defect is in the frozen contract's premise.
    - id: O7
      joint: J6
      severity: material_for_transfer_only
      status: open
      statement: >-
        The load-bearing extrapolation is that estimator_loss(T, r = 2) stays
        near 0.099 as T grows. It is measured at exactly two points, T = 64 and
        T = 256 -- 2 bits of T -- where it is remarkably flat (0.099049 ->
        0.099258 at a = 1/4). Any transfer of the a-crossing to larger parameters
        rests on that flatness continuing over roughly 77 further bits of T. Two
        points do not carry a trend and I do not read one.
      falsification_route_cheapest_of_all_i_identified: >-
        A T-sweep at fixed N = 2^24, T in {64, 128, 256, 512, 1024}, r = 2, five
        seeds. Exact basins already cost 0.46 GiB and ~24 s per seed and are
        computed once per seed regardless of T, so the marginal cost is one extra
        sort per (T, seed): minutes, not hours. If estimator_loss drifts
        materially with T, the a-crossing moves with T and nothing about this
        result transfers. That single measurement discriminates more than another
        PASS/FAIL at another N would.
    - id: O8
      joint: J6
      severity: low
      status: open
      statement: >-
        H-ECDLP-37dc01.test_boundary.boundary_amendments carries exactly one
        entry, dated 2026-09-07, widening a to include {1/16, 1/8, 3/16}, and it
        names experiment_id: EXP-ECDLP-6ac801. It does not name EXP-ECDLP-612fb1
        or its v3 item. The widening is disclosed, but a later reader auditing
        "which experiments were evaluated outside the stated boundary" would miss
        this one.
      addressed_to: the ledger-archive task TASK-20260907-33a736, not the producer
    - id: O9
      joint: J6
      severity: low
      status: open
      statement: >-
        S_bits_oracle_T_sel_table, S_bits_static_T_table and
        S_peak_bits_pool_working_storage sit in cost_table.json's `measured` block
        but are pure arithmetic in (T_sel, T, r, n) -- nothing was measured to
        obtain them. The producer followed the contract exactly: the amendment's
        required_artifacts_per_run.notes classifies bit counts as MEASURED. The
        contract's classification is what is loose, and a later reader could take
        "measured storage" for an observation.
  objections_i_looked_for_and_did_not_find:
    - >-
      A sentence anywhere in the producer's package reading the ceiling result as
      a mechanism result. DEC-20260907-9b1b02 recorded exactly that slide once in
      the concurrent lane, so I searched for it specifically rather than
      generically. All seven hits are disclaimers.
    - >-
      A bare advice ratio without its frontier tuple. No ratio appears anywhere in
      the package, because the producer quotes none.
    - >-
      A measured/modeled column collision in cost_table.json. The blocks are
      disjoint; `modeled` holds only N, T, T_sel, W, theta, cap and the formula.
    - >-
      A claim reaching outside the run cells. tested_parameters is exact,
      transfer_assumptions_made_by_this_report is `none`, and cells_not_run is
      empty with every planned cell executed.
    - >-
      Weakening of EV-ECDLP-60e266. a = 1/4 returns 0/5 at both N with every
      per-seed margin negative, and my own 20-seed diagnostic extends that to
      0/20 seeds and 0/15504 draws.
    - >-
      NULL_B_G3 being two names for one code path. instrument.numpy_select is a
      three-line numpy lexsort on (keys, -weights) returning order[:t];
      instrument.CountedSelector.select is a hand-written streaming selection.
      Materially different implementations; 120/120 agreement is a genuine
      invariance. Its scope is narrow -- it cannot detect a shared conceptual
      error in what w(d) should be -- and I found no defect.

  # ------------------------------------------------------- controls
  required_controls:
    - id: RC1
      control: >-
        Add NULL_T, or an equivalent halving-loss null, to the declared control
        set of any successor contract.
      rationale: >-
        It is simultaneously the missing null for J5 (the only declared control
        that touches the halving loss) and by far the strongest proves-too-much
        object for J4 (bias-to-fire 0.000869 against the Section 6 set's
        0.017737). One control closes both gaps.
      already_run_here: true
      artifact: scratch/tail_null.json
    - id: RC2
      control: >-
        Raise the seed count at known-false cells from 5 to 20 and report the
        control's type-I error rate rather than a boolean.
      rationale: O2 -- the frozen five-seed draw at a = 3/16 is unusually
        favourable to the control and the boolean hides a 1.03e-3 firing rate.
      already_run_here: true
      artifact: scratch/seed_dispersion_analysis.json
    - id: RC3
      control: >-
        Re-run the r-sweep with independent pool draws per r, and separately sweep
        T_sel/T at fixed r.
      rationale: O4 -- as built, r acts only on the comparator and the pools are
        nested, so the decay is close to structurally forced.
      already_run_here: false
    - id: RC4
      control: >-
        A genuinely independent implementation -- different random-function
        family, independently written basin closure, written by an agent that has
        not read source_v2/instrument.py.
      rationale: O6 -- residual R3 is still owed and nothing in this batch can
        discharge it.
      already_run_here: false

  # ------------------------------------------- counterexamples and mutations
  counterexample_or_mutation:
    summary: >-
      I constructed and ran three objects the batch did not have. Two are
      known-false objects for J4; one is a null for J5. All three ran through the
      producer's own frozen g3_predicate.measure_cell on the same code path as the
      primary cells, so a difference cannot be an instrumentation difference.
    objects:
      - id: KF-A
        kind: additional known-false object (seed extension at a declared
          known-false cell)
        construction: >-
          The SAME cell the contract declares known-false -- a = 3/16, T_sel = 128,
          r = 2, N = 2^24, frozen v2 instrument -- evaluated on FIFTEEN FRESH
          SEEDS {6..20}, disjoint from the frozen {1..5}. The cell, not the seed
          index, is what the contract declares known-false, so a different valid
          five-seed draw at the same cell is the same known-false object.
        returned: >-
          4 of 20 seeds have margin >= 0. 16 of the 15504 five-seed draws return
          G3 PASS, e.g. seeds {1, 13, 15, 17, 20} with m(4) = +0.002615. There
          EXIST valid five-seed draws at a cell the contract declares known-false
          on which the predicate returns PASS.
        honest_reading: >-
          Those 16 were found by MAXIMISING over 15504 draws, and finding them at
          a 1.0e-3 rate is exactly what a 1.0e-3 false-positive rate predicts. This
          is a MEASUREMENT OF THE CONTROL'S TYPE-I ERROR, not a demonstration that
          the control fired. It did not fire: the contract's frozen draw is
          governing and it returned 0/5. I report the firing rate, not a firing.
        artifact: scratch/dispersion_s6_s20.json,
          scratch/seed_dispersion_analysis.json
      - id: KF-B
        kind: nearby-object control at the cell where the conclusion must be false
        construction: >-
          The same seed extension applied to a = 1/4, r = 2, N = 2^24 -- the cell
          carrying EV-ECDLP-60e266's standing obstruction.
        returned: >-
          0 of 20 seeds positive, 0 of 15504 five-seed draws PASS. The nearby
          object where the effect must be absent produces a decisively different
          number from the primary cells (20/20 and 19/20 positive). The measurement
          is not an artifact of the instrument.
        artifact: scratch/seed_dispersion_analysis.json
      - id: NULL-T
        kind: null object of the same shape (halving-loss null)
        construction: >-
          Keep N, the map, the DP set, the pool draw, w(d), the tie-break, the
          selected table, the total reachable basin mass M and the DP count D
          exactly as measured. Replace ONLY the basin sizes with a uniform
          multinomial allocation of M over D basins, preserving rank order.
          Null stream seed 900, declared before the run.
        prediction_declared_before_running: >-
          if the amendment's stated mechanism is what produces the PASS, NULL_T
          must FAIL at every a including a = 1/16
        returned: >-
          0/5 at every a. Margin collapses +0.020565 -> -0.000626 (a = 1/16) and
          +0.006933 -> -0.000869 (a = 1/8). Halving loss collapses 0.0659 ->
          0.00069 and 0.0922 -> 0.00092. Estimator loss collapses to ~5e-5.
          Prediction confirmed.
        also_serves_as_the_strongest_proves_too_much_object:
          null_T_bias_to_fire_a_1_16: 0.000626266
          null_T_bias_to_fire_a_1_8: 0.000869393
          section_6_binding_object_bias_to_fire: 0.017736971
          a_1_16_pass_headroom: 0.017437577
          a_1_8_pass_headroom: 0.005128205
          blind_band_under_NULL_T_a_1_16: empty
          blind_band_under_NULL_T_a_1_8: empty
          reading: >-
            NULL_T fires at a uniform bias 5.9x smaller than the bias that would
            manufacture the a = 1/8 PASS and 27.8x smaller than the one that would
            manufacture the a = 1/16 PASS. As a proves-too-much object it is
            roughly 20x stronger than the whole frozen Section 6 set, and under it
