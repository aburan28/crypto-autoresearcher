        artifact: scratch/tail_null.json
    the_single_cheapest_falsification_i_identified:
      for_the_claim_as_stated: >-
        Re-run a = 1/8 and a = 1/16 at N = 2^24, r = 2 on a pre-declared fresh
        five-seed draw. Cost: ~2 minutes of the container's time. If the PASS is a
        property of the frozen seeds rather than of the cell, it fails.
      i_ran_it: true
      it_did_not_refute: >-
        Extended to seeds {6..20}: a = 1/16 is positive on 20/20 seeds and PASSes
