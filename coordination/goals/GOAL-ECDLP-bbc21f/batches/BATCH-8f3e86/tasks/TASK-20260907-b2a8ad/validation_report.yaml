      They answer different questions in different vocabularies and their
      disagreement is intended, not an inconsistency:
      (a) `validation_report.verdict: passed` is the TERMINAL ARTIFACT-INTEGRITY
      verdict in the agents/validator.md vocabulary (passed|failed|incomplete|
      invalid). It says the receipt is ADMISSIBLE and nothing more.
      (b) `review_attestation.verdict: breaks` is the REVIEW-ROUND verdict in
      the AGENTS.md "Review architecture" vocabulary (holds|breaks|
      inconclusive), aggregated over the joints I own. It says an independent
      reading DISAGREES WITH THE CLAIM at one cell.
      A run package can be perfectly kept and still be contested by an
      independent re-derivation; that is exactly this case. Neither field was
      adjusted to agree with the other.
