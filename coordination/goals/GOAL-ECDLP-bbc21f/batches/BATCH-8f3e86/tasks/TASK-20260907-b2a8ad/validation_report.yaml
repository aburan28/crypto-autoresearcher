  task_id: TASK-20260907-b2a8ad
  goal_id: GOAL-ECDLP-bbc21f
  batch_id: BATCH-8f3e86
  experiment_id: EXP-ECDLP-612fb1
  amendment: experiments/EXP-ECDLP-612fb1/amendments/v2_to_v3.yaml
  role: validator
  recorded_at: '2026-09-07'
  reviewed_package: TASK-20260907-aad514 (Executor), at snapshot commit fe6cdf59f
  scope_of_this_report: >-
    J1, J2 and J3 of the frozen review_plan, plus run/control integrity. THIS
    REPORT ISSUES NO WHOLE-CLAIM VERDICT and recommends no hypothesis status.
    J4 (proves-too-much), J5 (nulls and decay) and J6 (cost and scope) belong to
    TASK-20260907-ee1ca7, which this session is blind to by construction; a
    whole-claim verdict from here would be an opinion formed from half the
    evidence. The Coordinator composes.

  run_ids:
    - RUN-ECDLP-612fb1-v3-rep20-s1
    - RUN-ECDLP-612fb1-v3-rep20-s2
    - RUN-ECDLP-612fb1-v3-rep20-s3
    - RUN-ECDLP-612fb1-v3-rep20-s4
    - RUN-ECDLP-612fb1-v3-rep20-s5
    - RUN-ECDLP-612fb1-v3-g3x24-s1
    - RUN-ECDLP-612fb1-v3-g3x24-s2
    - RUN-ECDLP-612fb1-v3-g3x24-s3
    - RUN-ECDLP-612fb1-v3-g3x24-s4
    - RUN-ECDLP-612fb1-v3-g3x24-s5
    - RUN-ECDLP-612fb1-v3-analysis-001

  # =====================================================================
  # PER-JOINT VERDICTS -- J1, J2, J3 ONLY
  # =====================================================================

  joint_verdicts:

    - joint: J1
      title: predicate fidelity
      verdict: holds
      artifact: j1_predicate_audit.md
      summary: >-
        source_v3/g3_predicate.py computes the predicate Section 3 defines, not a
        nearby one. Every clause was audited: parameters and the exact parameter
        table, reading P1's map and DP test, `basins` (cap, DP-free cycle, DP
        self-basin), `top_share`, `pool`, `selection`, `static_coverage`,
        `predicate_per_seed` and `predicate_per_cell`.
      the_named_invalidation_rule: >-
        NO EXACT BASIN SIZE IS READ IN THE SELECTION PATH. Established two
        independent ways rather than one. (a) DATA FLOW: selection_weight's only
        inputs are the pool's own (S_d, h_d) and the modeled scalar W; those
        trace to generate_pools -> walk_to_dp, which construct no Basins object
        and no length-N array; PoolEvidence has no basin field; the three REGION
        C functions cannot reach a basin size. (b) EMPIRICALLY, running the
        review_plan's own attack (2): replacing the weight vector with TRUE
        BASIN SIZES on the same pool and keys changes the a = 1/8 cell verdict
        from 5/5 to 0/5, flipping every one of the five seeds, and moves every
        a = 1/16 per-seed margin by 0.006-0.010 in the expected direction. Had
        the selection already been reading basin sizes, that substitution would
        have been a no-op. It is the opposite of a no-op.
      the_clause_the_plan_expected_to_break: >-
        The plan named the capped-mass denominator convention as the most likely
        break ("a denominator convention that quietly drops capped mass would
        inflate every share"). IT DOES NOT OCCUR. Basins.top_share and
        Basins.coverage both divide by the FULL N; capped and DP-free-cycle mass
        are excluded from the numerator (they are in no basin) and retained in
        the denominator, and basin_mass_total + cycle_mass + capped_mass = N
        holds in the run records. My own independent implementation, written
        from the same text before reading any of this, used the same convention.
      per_cell_threshold: >-
        The >= 4-of-5 rule is applied PER (N, a, r) CELL and never pooled across
        r: g3_verdict_table.json holds 24 rows, one per distinct (N, a, r), each
        with its own pass_count and threshold. I recomputed all 24 from the ten
        run records (0 mismatches) and recomputed margin and the g3 flag in all
        120 measured cells (0 mismatches).
      findings:
        - id: F1
          class: scope-of-guarantee observation; NOT a break
          what: >-
            The invariant holds as information flow, but two things are narrower
            than they are advertised to be. (i) measure_cell(P, basins, r) carries
            `basins` in its ENCLOSING LEXICAL SCOPE at the line where
            selection_weight is called. Nothing reads it, and the amendment's rule
            is about READING, which does not occur -- so the invalidation rule is
            not triggered. But the task card's stricter structural phrasing ("no
            exact-basin array in scope at the point the weight is computed") is
            satisfied only at the granularity of the REGION C functions, not of
            their caller. (ii) _assert_evidence_only is advertised in the module
            docstring as making the invariant "mechanically checkable"; it is a
            LENGTH TRIPWIRE, not an information-flow proof, and would pass a
            PoolEvidence whose S array had been derived from basin sizes as long
            as its length were r*T.
          consequence: >-
            None for this batch's numbers. It matters for how the invariant should
            be cited: the evidence for it is the data-flow read plus the
            substitution test, not the guard. A successor amendment wanting the
            structural guarantee would pass the pool to a selector returning a
            table and score in a function that never sees the pool.
        - id: F2
          class: DEFECT IN THE AMENDMENT'S TEXT, not in the implementation
          what: >-
            Section 3 `selection` leaves the tie-break stream unfixed on the
            stated ground that "ties in a real-valued w are measure-zero and the
            choice cannot change a verdict". THE PREMISE IS FALSE.
            w(d) = S_d + 4*W*h_d with S_d, h_d non-negative INTEGERS is supported
            on a countable set, and at a = 1/16 (W = 64 exactly, 4W = 256) w is an
            INTEGER. MEASURED on the producer's own ten primary cells: 383-434 of
            512 pool entries (75-85%) lie in some tie at EVERY cell, and the tie
            STRADDLES the T = 256 selection cut in 6 of the 10 cells. Varying the
            tie-break stream over 64 alternatives moves the margin by up to
            1.16e-03 (a = 1/8 seed 3) and 6.58e-04 (a = 1/16 seed 3).
          does_it_change_a_verdict: >-
            NO, at these cells, as measured. Across all 640 (cell x stream)
            combinations tested, no per-seed sign flipped. At the tightest cell
            (a = 1/8 seed 3, margin +0.003084) the minimum over 64 streams was
            +0.002003, still positive -- about 2.7x headroom over the
            tie-break-induced spread.
          why_it_is_reported_anyway: >-
            Section 3's own `what_a_reviewer_needs_and_this_section_does_not_give`
            requires it ("If a reviewer believes either DOES change a verdict,
            that is itself a finding and must be reported, not absorbed"), and the
            amendment reached a right answer by a wrong argument. The wrong
            argument would license ignoring the tie-break at cells with less
            headroom, and a = 1/8 is already the least robust cell in this batch
            (see J2). A successor amendment should restate the clause as a
            measurement carrying its headroom, and should FIX the tie-break stream
            rather than declare it irrelevant.
          not_the_producer_s_fault: >-
            IMPLEMENTATION.md section 3 discloses both open choices explicitly
            (pool starts: default_rng(s) in batches of 4*T; tie-break: a fresh
            default_rng(400+s) per selection, ascending), which is exactly what
            the clause asks of an implementer.

    - joint: J2
      title: blind re-derivation of the load-bearing quantity
      verdict: breaks
      verdict_scope: >-
        BREAKS NARROWLY AND PRECISELY, and the break is confined to ONE of the
        ten (a, seed) pairs. Recorded as `breaks` because the review_plan's
        agreement_criterion is explicit -- "Verdict and per-seed SIGN, never
        magnitude ... A verdict difference or a per-seed sign difference is a
        break" -- and its breaking_artifact names "a sealed per-seed margin SIGN
        differing at any of the ten (a, seed) pairs". One does. The constraint
        also says not to explain it away, so it is not explained away here.
      seal:
        held: true
        artifact: j2_seal_manifest.yaml
        sealed_at_utc: '2026-09-07T04:55:36Z'
        sha256_j2_blind_rederivation_py: 01db6edc6f57fab921964d0f58fed0ce6d8b1434e3a7e423a7ed5aa9d0e69c60
        sha256_j2_output_json: 2ade1968e7bade1fd5822f3a75eaa92be6398e3cb5842bed27b72d621f41ce17
        ordering: >-
          The implementation was written, self-checked against a brute-force
          reference, and executed, and both hashes computed, BEFORE any tool call
          in this session touched source_v2/, source_v3/, any
          RUN-ECDLP-612fb1-v3-* directory, TASK-20260907-aad514/,
          TASK-20260907-ee1ca7/, or either EXP-ECDLP-6ac801 path. All three
          sealed-artifact mtimes precede sealed_at_utc.
        implementation_self_check_before_the_seal: >-
          My exact-basin routine was verified against a naive per-point
          brute-force walk on six randomized fixtures spanning N = 2^9..2^12 and
          cap in {1, 3, 8, 16, 40, 200}: basin dictionaries identical and
          capped/unreachable mass identical in all six, including the cap
          boundary and DP-free cycles. A wrong re-derivation would be worse than
          none, so this check preceded the sealed run.
      my_sealed_result:
        cell: N = 2^24, T = 256, T_sel = 128, r = 2, seeds {1..5}, exact basins, reading P2
        a_1_16: {pass_count: 5, verdict: G3 PASS, signs: '+++++',
                 margins: [+0.013539135, +0.022640705, +0.015803695, +0.010085523, +0.022760868]}
        a_1_8:  {pass_count: 4, verdict: G3 PASS, signs: '+-+++',
                 margins: [+0.016867876, -0.002952278, +0.000260115, +0.018436968, +0.007488966]}
      producer_result_for_comparison:
        source: RUN-ECDLP-612fb1-v3-g3x24-s1..s5 raw-result.json, read by me after the seal
        a_1_16: {pass_count: 5, verdict: PASS, signs: '+++++',
                 margins: [+0.028603315, +0.023278654, +0.013718963, +0.017437577, +0.019787014]}
        a_1_8:  {pass_count: 5, verdict: PASS, signs: '+++++',
                 margins: [+0.009002209, +0.005128205, +0.003084064, +0.005594254, +0.011855125]}
      comparison_at_the_declared_criterion:
        a_1_16:
          verdict_agreement: AGREE (PASS vs PASS, 5/5 vs 5/5)
          per_seed_sign_agreement: AGREE on all five seeds
          reading: >-
            HOLDS. Both readings are comfortably positive -- my smallest margin is
            +0.010086, the producer's is +0.013719 -- so this cell is robust
            across two different random-function families. Magnitudes differ, as
            the criterion says they must.
        a_1_8:
          verdict_agreement: AGREE at the >= 4/5 bar (my 4/5 PASS vs the producer's 5/5 PASS)
          per_seed_sign_agreement: >-
            DISAGREE AT SEED 2. Mine is -0.002952 (NEGATIVE); the producer's is
            +0.005128 (POSITIVE). This is the break.
          how_close_to_zero_exactly_as_the_plan_asked: >-
            My a = 1/8 has TWO of five seeds within 0.003 of zero, ONE ON EACH
            SIDE: seed 2 at -0.002952 and seed 3 at +0.000260. It is not a 4/5
            with one decisive negative; it is a 4/5 sitting on the boundary. And
            the producer's own a = 1/8 margins are ALL within 0.012 of zero, the
            smallest being +0.003084 (seed 3). So a = 1/8 is a marginal cell under
            BOTH readings.
          reading: >-
            The plan predicted this cell and this mechanism in advance: "a
            different random-function family can plausibly flip a seed's SIGN
            there without any implementation error at all." I have no evidence of
            an implementation error in either direction, and I am not asserting
            one. What I am reporting is that the a = 1/8 PASS IS NOT ROBUST TO THE
            INSTRUMENT FAMILY, while the a = 1/16 PASS IS.
          direction_relative_to_the_coordinator_s_diagnosis: >-
            My result CONFIRMS THE DIRECTION of the diagnosis and does not
            reproduce its magnitude. EV-ECDLP-2e9680's post-seal diagnostic moved
            a = 1/8 from 1/5 to 5/5 when re-selecting by w(d); my independent P2
            implementation, selecting by w(d) as Section 3 now specifies, returns
            4/5 rather than 1/5 -- so the missing weight formula was indeed the
            root cause of the old disagreement -- but it does not return a clean
            5/5. The honest label for a = 1/8 is therefore NEITHER "confirmed
            feasible" NOR "still contested in the old sense": it is
            RESOLVED AS TO ROOT CAUSE AND MARGINAL AS TO VERDICT.
      what_this_joint_does_and_does_not_deliver:
        delivers: >-
          A code-independent reading of both primary cells: an implementation
          written from Section 3's text alone, with its own uniformly random
          function on Z_N and its own independent Bernoulli(theta) DP marking,
          which never read the producer's code or output before sealing. That is
          the failure mode this joint exists to reach, and it is the failure mode
          the 6ac801 disagreement actually was -- a selection-rule gap between two
          implementations.
        does_not_deliver: >-
          EXPECTATION-INDEPENDENCE. Two disclosed contaminations (seal manifest
          C1, C2) mean the expected per-seed signs and pass counts at both cells
          were known to me before I wrote a line of code: C1 is the plan's own
          declared limitation (the amendment quotes the prior lane's per-seed
          margins, and I must read the amendment); C2 is NOT anticipated by the
          plan and I disclose it -- the dispatching instruction that launched this
          session itself carried producer-outcome information, namely U1 and the
          STAGE 3A bitwise claim. My a = 1/16 agreement with an already-read
          target is therefore weak corroboration and I do not present it as
          strong. My a = 1/8 DIVERGENCE was produced against the pull of a known
          all-positive target, which is the condition the plan itself names as
          making a divergent sealed result correspondingly strong.

    - joint: J3
      title: the 2^20 replication anchor
      verdict: holds
      verdict_qualifier: >-
        HOLDS AS A WIRING AND REPRODUCIBILITY CHECK, WHICH IS ALL IT CAN BE. The
        bitwise exactness is NOT evidence of correctness and must not be read as
        independent corroboration.
      artifact: j3_replication_table.json
      measurements:
        rows_compared: 20
        rows_bitwise_identical: 20
        max_absolute_difference_r2: 0.0
        top_share_and_static_cov_bitwise_identical_separately: true
        pass_counts_stage3a: {a_1_16: 5, a_1_8: 4, a_3_16: 1, a_1_4: 0}
        pass_counts_committed_ascan_recomputed_by_me: {a_1_16: 5, a_1_8: 4, a_3_16: 1, a_1_4: 0}
        seed_2_fails_at_a_1_8_in_both: true
      the_cheapest_available_break_does_not_fire: >-
        The plan invited me to check whether the Coordinator misread the committed
        table, since "if the Coordinator misread the committed table, the entire
        premise of this batch is wrong and that is the single cheapest break
        available to you". IT DID NOT MISREAD IT. I recomputed every margin myself
        from each RUN-ECDLP-612fb1-v2-ascan-s*/raw-result.json as
        cells[a].top_share["T/2"] - cells[a].static_by_r["2"], and my values agree
        with DEC-20260906-bcc097's quoted readings at EVERY quoted digit and at all
        four a values: a = 1/16 -> +0.019553, +0.012215, +0.023987, +0.016334,
        +0.009157; a = 1/8 -> +0.003183, -0.001996, +0.010345, +0.004992,
        +0.007094; a = 3/16 -> +0.018691, -0.009538, -0.015742, -0.008542,
        -0.003351; a = 1/4 -> -0.014133, -0.003534, -0.053352, -0.019899,
        -0.023048. The decay pass counts also reproduce (0/5 at r = 4 and r = 8 at
        every a). The producer's own stage3a_vs_ascan_comparison.json agrees with
        my recomputation on all 20 rows.
      why_bitwise_exactness_carries_no_corroborative_information: >-
        THE TASK ASKED ME TO TAKE THIS SERIOUSLY AND THE ANSWER IS CLEAR: a
        bitwise match is the DETERMINISTIC AND NECESSARY outcome of the declared
        architecture, not a strong claim surviving a hard test.
        source_v2/run_ascan.py computes each cell as I.exact_basins ->
        Basins.top_share(T//2) -> I.generate_pools(P, [r]) -> w = S + 4*W*h ->
        default_rng(P.seed_tiebreak).integers(...) -> I.numpy_select ->
        Basins.coverage. source_v3/g3_predicate.measure_cell makes the SAME calls
        on the SAME frozen functions with the SAME Params-derived seed streams.
        Same deterministic code, same inputs, therefore same bits. 0.0 WAS THE
        EXPECTED VALUE; A NON-ZERO DIFFERENCE WOULD HAVE BEEN THE FINDING.
      is_the_shared_code_a_contract_violation: >-
        NO. It is DECLARED, not hidden. The amendment's own
        required_implementation_files says run_stage3.py "IMPORTS
        experiments/EXP-ECDLP-612fb1/source_v2/instrument.py unchanged for the
        walk map, DP predicate, exact-basin closure, pool generation and both
        selection code paths; it does not copy or re-implement any of them." So
        the two paths share exactly what the contract says they share -- no more.
        I verified non-modification independently: each of the eleven manifests
        hash-pins the five source_v2 .py files and all nine pinned digests
        (4 source_v3 + 5 source_v2) match the tree exactly.
      what_the_agreement_does_establish: >-
        Real but narrow, and worth having: the committed a-scan table is
        faithfully reproducible from the committed code, so the numbers this whole
        lane rests on are neither a transcription error nor a stale artifact; and
        the v3 driver wires the frozen instrument identically, so STAGE 3B is not
        interpreted on top of a mis-wired baseline. That was the amendment's
        stated purpose for STAGE 3A (residual R4: the reading "has never been
        reproduced by any run -- only re-read, twice, off the same committed
        table") and it is discharged.
      credit_where_due: >-
        The producer did NOT overclaim this. execution_report.yaml U3 records the
        bitwise result and states it "so a reviewer reads it as identity of code
        path rather than as independent corroboration of the a-scan numbers by a
        different implementation." My reading agrees with the producer's own
        disclosure.
      scope_note_on_the_amendment_s_wording: >-
        The amendment's STAGE_3A `purpose` ("Reproduce, BY A FRESH RUN, the exact
        contested a-scan numbers") is literally true but reads as stronger than it
        is. A later reader could take "fresh run" for "independent replication".
        Worth one clarifying sentence in any successor amendment.

  # =====================================================================
  # THE CARRIED OPEN ITEM U1 -- addressed from J2, as routed
  # =====================================================================

  u1_third_angle_independence:
    routed_by: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/archives/TASK-20260907-7bf406/snapshot-receipt.json carried_to_review U1
    routing_as_recorded: >-
      primary owner TASK-20260907-ee1ca7 joint J6; "also bears on" this task's
      J2, which the receipt names as "the frozen plan's designed source of
      independent corroboration for exactly these two cells". The receipt also
      records, correctly, that NO joint in the frozen review_plan names the
      third-angle independence question in these words -- a gap in the plan's
      joint enumeration. I address it from J2 only and amend no plan text.
    what_i_verified_myself:
      - >-
        THE NUMERICAL IDENTITY IS REAL. STAGE 3B's r = 2 margins at N = 2^24,
        read by me from RUN-ECDLP-612fb1-v3-g3x24-s1..s5/raw-result.json, equal
        EV-ECDLP-2e9680's production-arm margins to ALL SIX QUOTED DECIMALS at
        every a and every seed: a = 1/16 -> 0.028603, 0.023279, 0.013719,
        0.017438, 0.019787; a = 1/8 -> 0.009002, 0.005128, 0.003084, 0.005594,
        0.011855; a = 1/4 -> -0.012918, -0.008373, -0.036196, -0.016829,
        -0.022216. Every digit matches.
      - >-
        THE CAUSE IS ESTABLISHED, NOT CONJECTURED.
        experiments/EXP-ECDLP-6ac801/source/run_stageb.py lines 43-49 put
        experiments/EXP-ECDLP-612fb1/source_v2/ on sys.path and do
        `import instrument as I`. EV-ECDLP-2e9680 `strength_note` records the
        production arm as "reusing
        experiments/EXP-ECDLP-612fb1/source_v2/instrument.py unchanged, commit
        22e80f13361a6eb307864c52f51740db419e9e54", and its `scope` records
        N = 16777216, T = 256, T_sel = 128, r = 2, seeds [1,2,3,4,5]. Those are
        EXACTLY STAGE 3B's parameters, and source_v3/g3_predicate.py imports the
        same module unchanged (digest verified against the tree).
      - >-
        THEREFORE the agreement is DETERMINISTIC AND NECESSARY, not corroborative.
        Two experiment identifiers, one frozen instrument, the same seeds, the
        same selection rule -> the same bits. It is the same phenomenon as J3, one
        scale up and across an experiment boundary.
    my_reading:
      finding: >-
        THE AMENDMENT'S RESIDUAL R3 IS NOT DISCHARGED BY STAGE 3B. R3 claims that
        running this predicate on the frozen v2 instrument is a third angle --
        "a different experiment identifier, a different random-function family, a
        different basin-closure implementation from either 6ac801 arm". The first
        clause is true and the second and third are FALSE: it is the same
        random-function family (mix64 with the same K, K_dp derivation) and the
        same basin-closure implementation (I.exact_basins), because it is the same
        file. STAGE 3B therefore supplies ZERO independent third-angle
        corroboration of a = 1/16 or a = 1/8.
      not_a_defect_in_the_producer_s_work: >-
        The Executor ran exactly the contract it was given -- the contract
        REQUIRED importing instrument.py unchanged -- and it RAISED U1 itself
        rather than absorbing it. The error is in the amendment's characterization
        of what its own STAGE 3B could deliver, authored before execution.
      consequence_for_this_batch: >-
        It relocates all of the batch's independent-corroboration weight onto J2.
        With STAGE 3B non-independent, MY J2 RE-DERIVATION IS THE ONLY GENUINELY
        INDEPENDENT READING OF THESE TWO CELLS IN THIS BATCH -- and that is
        precisely where the a = 1/8 seed-2 sign disagreement lands. So a = 1/8 at
        N = 2^24 cannot be read as two independent confirmations at 5/5: it is one
        reading re-executed twice, against which the one independent reading
        returns 4/5 with a negative seed and a second seed positive by 0.00026.
      a_further_point_a_reader_needs: >-
        6ac801's own Stage A blind arm WAS a P2-family implementation like mine
        (numpy RNG, independent Bernoulli(1/W) marking, pointer-doubling closure),
        but it selected by TRUE BASIN SIZE -- the diagnosed root cause -- so it is
        not comparable to mine. My run is, as far as the committed records show,
        the FIRST P2-family reading of these cells under the corrected w(d) rule.
      what_i_do_not_claim: >-
        Nothing here says a = 1/16 is not G3-feasible; my own independent reading
        agrees it is, 5/5, with comfortable margins. What it says is that the
        NUMBER OF INDEPENDENT CONFIRMATIONS is one fewer than the amendment's R3
        implies, at both primary cells.

