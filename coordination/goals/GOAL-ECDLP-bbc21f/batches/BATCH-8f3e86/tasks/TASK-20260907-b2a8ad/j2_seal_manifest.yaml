  # ---------------------------------------------------------------------
  # THE TWO CHOICES SECTION 3 DELIBERATELY LEAVES OPEN -- MY OWN, DISCLOSED
  # ---------------------------------------------------------------------
  disclosed_open_choices:
    i_pool_start_prng: >-
      numpy PCG64 through
      `default_rng(SeedSequence([0xB2A8AD, a_index, seed, 2]))`, where
      a_index is 0 for a = 1/16 and 1 for a = 1/8. Starts are drawn as uniform
      int64 on [0, N) in BATCHES OF 4096, consumed in order, and generation
      halts on the walk that first brings the pool to exactly r*T = 512
      distinct DPs (that walk's credit included). Batching is disclosed
      because Section 3 names "nor its batching" as unfixed.
    ii_tiebreak_key_stream: >-
      numpy PCG64 through
      `default_rng(SeedSequence([0xB2A8AD, a_index, seed, 3]))`; one float64
      key per pool entry; selection is `np.lexsort((tiekey, -weight))` taking
      the first T = 256, i.e. w(d) DESCENDING with the tie-break key
      ASCENDING, as `selection` specifies.
    iii_instrument_family_reading_P2: >-
      Not on the amendment's list of open items but disclosed for completeness,
      since P2 makes it my choice: numpy PCG64 through
      `default_rng(SeedSequence([0xB2A8AD, a_index, seed, 1]))`;
      f(x) = uniform on [0, N) drawn independently per point (a uniformly
      random function on Z_N, NOT a permutation and NOT mix64); D(x) = 1 iff an
      independent uniform(0,1) draw is < theta, i.e. an independent
      Bernoulli(theta) marking, independent of f.
  finding_recorded_at_seal_time_about_choice_ii: >-
    RECORDED IN THE SEAL, NOT AFTERWARDS, because it bears on the amendment's
    own justification for leaving the tie-break unfixed. Section 3's
    `selection` asserts that "ties in a real-valued w are measure-zero and the
    choice cannot change a verdict". MY RUN OBSERVED TIES IN w AT EVERY ONE OF
    THE TEN CELLS (`weight_ties_present: true` in all ten per-seed records of
    j2_output.json). The reason is structural rather than incidental:
    w(d) = S_d + 4*W*h_d with S_d and h_d non-negative INTEGERS, so w is
    supported on a countable set, and at a = 1/16 (W = 64 exactly, 4W = 256
    exactly) w is an INTEGER, where ties are not merely possible but common.
    Whether any tie straddles the T = 256 cut and can therefore move
    StaticCov -- which is what would make the choice verdict-relevant -- is a
    separate question that I measure AFTER this seal and report under J1. The
    sealed numbers above are unaffected by that measurement and are not
    revised by it.

  # ---------------------------------------------------------------------
  # DISCLOSED LIMITATIONS ON THE INDEPENDENCE THIS SEAL CAN CLAIM
  # ---------------------------------------------------------------------
  contamination_disclosures:
    - id: C1
      severity: material
      required_by: review_plan.blind_rederivation.disclosed_limitation
      what: >-
        I had to read the amendment, because it is the source of the formal
        statement I implement. The amendment's Section 1 blocks
        `residual_after_EXP_ECDLP_6ac801` and `recomputed_by_this_authorship`
        QUOTE THE PRIOR LANE'S PER-SEED MARGINS at N = 2^24 for a = 1/16
        (blind +0.019620, +0.012236, +0.014379, +0.006727, +0.009929;
        production +0.028603, +0.023279, +0.013719, +0.017438, +0.019787) and
        for a = 1/8 (blind -0.000788, -0.001764, -0.022761, -0.003387,
        +0.001168; production +0.009002, +0.005128, +0.003084, +0.005594,
        +0.011855), and the committed N = 2^20 a-scan margins.
      consequence: >-
        I am blind to THIS batch's producer but NOT to the prior lane's
        numbers. A sealed result of mine that MATCHES the prior lane is
        therefore weaker corroboration than one produced in true ignorance.
      how_it_cuts_here: >-
        It cuts toward strength rather than weakness at the contested cell. The
        numbers I had read gave a = 1/8 as either 5/5 all-positive (production)
        or 1/5 (the old blind reading under the wrong selection rule). My
        sealed result is NEITHER: 4/5 with seed 2 negative. It was produced
        against the pull of both numbers already read, which is the condition
        the review_plan itself names as making a divergent sealed result
        correspondingly strong.
    - id: C2
      severity: material
      required_by: >-
        Not anticipated by the review_plan. Disclosed here because it is a real
        hole in the independence property and reporting it is cheaper than
        having it found.
      what: >-
        THE DISPATCHING INSTRUCTION THAT LAUNCHED THIS SESSION ITSELF CARRIED
        PRODUCER-OUTCOME INFORMATION, which reached me before the seal even
        though I opened no `blind_from` path. Specifically it told me (i) that
        the producer claims STAGE 3A reproduces the committed a-scan BITWISE,
        with maximum absolute difference exactly 0.0 across all 20 (a, r = 2,
        seed) rows, and (ii) open item U1: that STAGE 3B's r = 2 margins at
        N = 2^24 reproduce, to all six quoted decimals at every a, the
        production-arm margins recorded in EV-ECDLP-2e9680.
      consequence: >-
        Combined with C1 -- the amendment quotes those production margins in
        full -- (ii) means I effectively knew the producer's per-seed STAGE 3B
        margins, and hence its expected all-positive signs and 5/5 pass count
        at both a = 1/16 and a = 1/8, BEFORE I wrote a line of code. I cannot
        un-read that, and no seal can restore what it removed. The honest
        statement of what J2 delivers must be discounted accordingly, and I
        discount it in the report rather than claiming a cleanliness this seal
        does not have.
      how_it_cuts_here: >-
        Again toward strength at the contested cell, for the same reason as C1:
        the known target at a = 1/8 was five positive signs, and my sealed
        result has four. A negative seed produced against a known all-positive
        target is not the failure mode this disclosure is guarding against.
        Where it DOES bite is a = 1/16, where my sealed 5/5 all-positive agrees
        with a target I had already read; that agreement is correspondingly
        weak corroboration and I report it as such.
    - id: C3
      severity: minor
      what: >-
        The review_plan's `coordinator_prior` -- which I must read, since it is
        in my handoff -- states what the Coordinator expects the review to find
        (a = 1/16 at 5/5; a = 1/8 at 4/5 or 5/5). I read it before sealing.
      consequence: >-
        A prior is not a measurement, and it was recorded before any reviewer
        ran, which is the point of recording it. But it is still a number-shaped
        expectation read before the derivation, so it is listed rather than
        omitted.
      how_it_cuts_here: >-
        My sealed a = 1/8 result (4/5) falls inside the Coordinator's stated
        expectation band. I cannot rule out anchoring. What I can say is that
        the per-seed structure I found -- one negative seed and one seed
        positive by 0.00026 -- is not in the prior at all, and is the part of
        my result that carries information.
  independence_property_this_seal_can_honestly_claim: >-
    STATED NARROWLY ON PURPOSE. This seal establishes that the implementation
    computing my numbers was written without reading the producer's
    implementation or any of its outputs, and that my numbers were fixed before
    I opened either. It does NOT establish that I derived them in ignorance of
    what answer was expected: C1 and C2 together mean the expected per-seed
    signs and pass counts at both primary cells were known to me in advance.
    The strongest claim available is therefore CODE-INDEPENDENT, NOT
    EXPECTATION-INDEPENDENT -- and code independence is precisely the failure
    mode this joint exists to reach, since the 6ac801 disagreement was a
    selection-rule gap between two implementations rather than an anchoring
    effect.

