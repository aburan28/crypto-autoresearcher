    why: AGENTS.md core rule 11 forbids silently altering the model or reasoning level; recording what actually
      served, including what could not be verified, is the disclosure that rule requires. No requirement of executor-implementation
      is unmet, so fallback_used is false and degraded_requirements is empty; the resolved model sits above the
