      both. Both choices are the frozen v2 instrument own, reached by importing generate_pools unchanged and by
      reproducing run_ascan.py key draw exactly, which is what makes STAGE 3A a replication of the committed a-scan
      pool draw rather than of its law only.
    affects_a_measured_number: Yes by construction (a different stream would give a different pool), which is what
      the five seeds are for; it is disclosed, not hidden.
  - id: D3
    kind: disclosed interpretation of a secondary-metric phrase; REPORTED TO THE COORDINATOR
    what: 'The amendment asks for a stratified-by-seed BCa bootstrap 95% CI on each pooled margin. Each cell holds
      exactly one margin per seed, so resampling WITHIN a seed stratum is degenerate: it returns that seed single
      value every time and yields an interval of zero width. This implementation takes the SEED as the resampling
      unit and resamples the five seed-level values.'
    why: 'It is the only non-degenerate reading of the phrase. The choice was NOT resolved silently: it is recorded
      here, in source_v3/IMPLEMENTATION.md section 5, and in g3_verdict_table.json bootstrap_method.'
    affects_a_measured_number: It affects only the CI endpoints. It cannot affect a margin, a pass_count or a verdict,
      all of which are computed from the per-seed margins directly and never from the bootstrap.
    coordinator_action_invited: If the Coordinator intended a different resampling unit, that is a further versioned
      amendment; the per-seed margins in every run raw-result.json permit any CI to be recomputed without re-running
      anything.
  - id: D4
    kind: measured property of the estimator, stated rather than interpreted
    what: With n = 5 seeds there are at most 5^5 = 3125 distinct bootstrap resamples, so every CI in this batch
      is a coarse discrete object whose endpoints can only fall on attainable resample means.
    why: The seed count is frozen at five by the contract and was not changed.
    affects_a_measured_number: No; it is a property of the reported intervals, recorded per row as max_distinct_resamples
      and z0_proportion_clamped in g3_verdict_table.json.
