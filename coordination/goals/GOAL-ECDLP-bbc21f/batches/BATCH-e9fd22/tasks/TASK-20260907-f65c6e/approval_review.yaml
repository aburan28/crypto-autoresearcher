approval_review:
  id: APPROVAL-REVIEW-TASK-20260907-f65c6e
  task_id: TASK-20260907-f65c6e
  goal_id: GOAL-ECDLP-bbc21f
  question_id: RQ-ECDLP-78dbc5
  batch_id: BATCH-e9fd22
  experiment_id: EXP-ECDLP-6ac801
  role: coordinator
  gate: >-
    approval gate on PA-ECDLP-6ac801-v1-to-v2 as proposed in BATCH-e9fd22 --
    experiments/EXP-ECDLP-6ac801/amendments/v1_to_v2.BATCH-e9fd22-proposed.yaml
    and experiments/EXP-ECDLP-6ac801/specification.v2.BATCH-e9fd22-proposed.yaml
  decision_record: ledger/decisions/DEC-20260907-4e34c5.yaml
  verdict: revise
  recorded_at: '2026-09-07'

  gated_object:
    paths_as_archived:
      amendment: experiments/EXP-ECDLP-6ac801/amendments/v1_to_v2.BATCH-e9fd22-proposed.yaml
      contract: experiments/EXP-ECDLP-6ac801/specification.v2.BATCH-e9fd22-proposed.yaml
    paths_as_read_by_this_gate:
      amendment: experiments/EXP-ECDLP-6ac801/amendments/v1_to_v2.yaml
      contract: experiments/EXP-ECDLP-6ac801/specification.v2.yaml
    why_the_paths_moved: >-
      This gate ran BEFORE commit 465c01cba, when BATCH-e9fd22's proposed draft
      occupied the two live canonical paths; those are the bytes this report
      reasons about. Commit 465c01cba -- authored by the concurrent session
      coordinator-ecdlp-8f3e86, not by this lane -- then moved this lane's draft
      to the two `.BATCH-e9fd22-proposed.yaml` sidecars, because the origin/main
      merge had made the live canonical paths BATCH-8f3e86's already-approved,
      frozen narrow a = 1/8 amendment. The live paths are another lane's
      approved records and are byte-unchanged by this lane.
    pointer_correction:
      corrected_by: TASK-20260907-ceb8cf
      corrected_at: '2026-09-07'
      what_changed: >-
        PATH IDENTITY ONLY. The archive task repointed the gated-object pointers
        in this report's `gate` field and added this block before committing it.
        No check, verdict, defect, magnitude or scope statement in this report
        was altered. This is not a supersession: the report had not been
        committed when the repointing was performed. Every blocking defect was
        independently re-checked against the current sidecar and queue text
        before the archive committed it; the results are recorded in
        DEC-20260907-4e34c5 `defect_status_at_archive`, and all three still
        hold.
    path_reference_convention: >-
      BINDING ON THIS FILE. Every remaining reference below to
      `experiments/EXP-ECDLP-6ac801/specification.v2.yaml` or
      `experiments/EXP-ECDLP-6ac801/amendments/v1_to_v2.yaml`, and every
      reference to "v2" as the gated object, denotes THIS BATCH's proposed draft
      at the sidecar paths above as it stood when this gate read it. It never
      denotes origin/main's approved narrow re-seal now living at those literal
      paths. Field names quoted inside those references are fields of the
      sidecar contract.

  session_independence: >-
    This gate ran in a FRESH Coordinator session that did not author
    PA-ECDLP-6ac801-v1-to-v2, specification.v2.yaml, BATCH-e9fd22's dispatch
    queue, or DEC-20260907-38e5ae. It read the artifacts rather than a summary
    of them, and it recomputed the load-bearing formula against committed
    bytes rather than accepting the amendment's own citation of it.

  leak_discipline: >-
    BINDING ON THIS FILE. Neither this artifact nor DEC-20260907-4e34c5 is on
    specification.v2.yaml `blind_rederivation.blind_from`, so neither may
    become a leak channel into Stage A'. This file therefore states NO per-cell
    G3 verdict, pass-count, margin value, margin sign, or crossing bracket from
    BATCH-3c7493 or from any recomputation performed here. Where a magnitude is
    load-bearing for the gate's own reasoning it is reported as a DIFFERENCE
    between two conventions, or as a relation to dispersion, never as a level.
    Defect D3 below concerns exactly this hazard on a path the contract does
    not currently cover.

  # ==========================================================================
  # CHECK 1 -- THE FORMULA AGAINST THE IMPLEMENTATION, LINE BY LINE
  # ==========================================================================
  check_1_formula_versus_implementation:
    question: >-
      Is `definitions.STATIC(T)_r exact coverage (v2, CORRECTED, item a)`,
      whose central act is weight_d = S_d + 4*W*h_d, the SAME rule the v1
      production implementation actually computed -- including the meaning of
      each symbol, the units, the indexing, and any normalisation, truncation
      or tie-breaking?
    what_was_read:
      - experiments/EXP-ECDLP-6ac801/source/run_stageb.py (the actual v1 Stage B production script, lines 82-100)
      - experiments/EXP-ECDLP-612fb1/source_v2/instrument.py (Pool.weights, line 445-446; generate_pools, 243-289; walk_to_dp, 126-151; Params.__post_init__, 72-91; Basins.coverage/top_share/index_of, 169-191; exact_basins, 194-215; numpy_select, 359-363)
      - experiments/EXP-ECDLP-6ac801/runs/RUN-ECDLP-6ac801-001..005/{raw-result.json,summary.json} (committed v1 outputs)
      - coordination/experiments/EXP-ECDLP-6ac801/batches/BATCH-3c7493/tasks/TASK-20260907-80e198/validation_report.yaml (`a_1_8_disagreement_root_cause`)
    line_by_line:
      - clause: 'v2 (1) POOL: run pool-construction walks from uniformly random restarts until r*T DISTINCT distinguished points have been reached; P is that set of r*T distinct DPs.'
        implementation: >-
          generate_pools (instrument.py 243-289) draws starts uniformly
          (rng.integers(0, N)) in batches of 4*T, and snapshots at the exact
          walk on which len(dps) reaches r*T, then breaks. |P| = r*T exactly.
        verdict: MATCHES
        recomputed: >-
          |P| = 512 = r*T at T = 256, r = 2, observed on every committed cell
          re-generated here.
      - clause: 'v2 (2) h_d = the NUMBER of pool-construction walks that terminated at d.'
        implementation: 'generate_pools: h[j] += 1 on every walk whose terminal DP is d (h.append(1) on first sight). Integer count.'
        verdict: MATCHES
      - clause: 'v2 (2) S_d = the SUM of the LENGTHS of those walks; every walk charged in full, including walks from restarts; length counted in steps from the restart point to the DP.'
        implementation: >-
          generate_pools: S[j] += L with L = int(length[i]) from walk_to_dp.
          walk_to_dp (126-151) returns length = number of applications of f
          from the start to the first DP, and 0 when the start is itself a DP.
          Every restart walk is charged; the pool is built only from restarts,
          so "including walks from restarts" is the whole population.
        verdict: MATCHES
      - clause: 'v2 (2) Both are properties of the pool construction, not of the basin partition.'
        implementation: 'True in the code: S and h are accumulated in generate_pools and never touch Basins.'
        verdict: MATCHES
      - clause: 'v2 (3) WEIGHT: weight_d = S_d + 4 * W * h_d, with W as defined above.'
        implementation: >-
          Pool.weights(W) (instrument.py 445-446) returns
          np.asarray(S, float64) + 4.0 * W * np.asarray(h, float64).
          run_stageb.py line 92 inlines the identical expression
          `np.asarray(snap.S) + 4.0 * P.W * np.asarray(snap.h)`. The two are
          the same arithmetic; the production script does not route through
          Pool.weights but computes the same closed form.
        verdict: MATCHES EXACTLY
      - clause: 'v2 `definitions.W`: W = sqrt(a N / T).'
        implementation: 'Params.__post_init__ line 75: self.W = math.sqrt(self.a * self.N / self.T). Float64 throughout; S_d is an integer-valued float, so 4*W*h_d is the only irrational term and the units are consistently "walk steps".'
        verdict: MATCHES
      - clause: 'v2 (4) SELECTION: Sel_static = the T entries of P with the largest weight_d, ties broken by ASCENDING pool key; |Sel_static| = T exactly.'
        implementation: >-
          run_stageb.py 93-97: keys = default_rng(P.seed_tiebreak).integers(0,
          2^63, size=|P|), then numpy_select(w, keys, T) =
          np.lexsort((keys, -weights))[:T] -- weight descending, key ascending,
          exactly T entries. The COUNT and the ORDERING DIRECTION match v2.
          The IDENTITY of "pool key" does not: see defect D4.
        verdict: MATCHES IN FORM; the tie-break key is under-specified (D4)
      - clause: 'v2 (5) COVERAGE: cov_static = (1/N) * sum_{d in Sel_static} b(d), b(d) the TRUE exact basin size from the exact basin partition.'
        implementation: >-
          run_stageb.py 98: basins.coverage(static_T_r) =
          size[index_of(vals)].sum() / N (instrument.py 177-182), reading true
          exact basin sizes of exactly the selected DPs, normalised by N (not
          by the covered mass).
        verdict: MATCHES
      - clause: 'v2 (5) NOTE: distinct DPs index DISTINCT basins, so no basin is double-counted.'
        implementation: 'True: Basins.dps are distinct DP values and index_of is a bijection onto them; Sel_static holds distinct DPs by construction.'
        verdict: MATCHES
      - clause: 'v2 `definitions.exact top-T_sel basin share`: share_top(T_sel) = (1/N) * sum of the T_sel largest b(d).'
        implementation: 'Basins.top_share(t) = sort(size)[::-1][:t].sum()/N (instrument.py 184-186). Ties among equal sizes cannot change a prefix sum, so no tie-break is needed here.'
        verdict: MATCHES
      - clause: 'v2 `definitions.G3 margin`: margin = share_top(T_sel) - cov_static.'
        implementation: 'run_stageb.py 100: margin = top_T_sel_share - static_T_r2_exact_coverage.'
        verdict: MATCHES
      - clause: 'v2 `definitions.exact basin partition`: point x belongs to basin d iff the walk from x first reaches a distinguished point at d; sum over all d of b(d) = N.'
        implementation: >-
          exact_basins (instrument.py 194-215) restricts to
          ok = reach & (dist <= P.cap) with P.cap = ceil(8*W) (CAP_MULT = 8,
          line 31/77) and reports cycle_mass and capped_mass separately. Points
          on DP-free cycles, and points whose first DP lies beyond the cap,
          belong to NO basin.
        verdict: DOES NOT MATCH -- v2 asserts an identity the production partition does not satisfy (D2)
    end_to_end_reproduction:
      method: >-
        For each of the 20 committed v1 cells (5 seeds x 4 a-values), the pool
        was re-generated from the pinned instrument at the committed seed, the
        weight computed as S_d + 4*W*h_d, the top-T selected by (weight
        descending, tie-break key ascending), and share_top(T_sel), cov_static
        and margin recomputed against the basin sizes stored in each run's own
        committed raw-result.json. Zero experiment runs; no run record written;
        no committed artifact modified.
      result: >-
        The Sel_static DP SET is reproduced identically at all 20 cells, and
        share_top(T_sel), cov_static and margin are each reproduced with a
        worst absolute deviation of 0.000e+00 over all 20 cells and all three
        quantities.
      conclusion: >-
        weight_d = S_d + 4*W*h_d REPRODUCES THE PRODUCTION POOL-WEIGHT
        COMPUTATION EXACTLY, symbol for symbol, with the symbol meanings,
        units, indexing and normalisation v2 states. The amendment's central
        act is correct and is the reason this gate is a revise and not a
        reject.
    derivability_by_a_reader_who_never_opens_the_implementation:
      question: >-
        Reading ONLY specification.v2.yaml, the amendment record and the
        parameters -- never opening run_stageb.py or instrument.py -- does an
        independent re-deriver recover EXACTLY ONE function?
      answer: 'NO -- not yet. The weight is now recoverable; four other conventions it depends on are not.'
      recoverable_from_v2_alone:
        - 'weight_d = S_d + 4*W*h_d, and the meaning of S_d, h_d and W (this is the repair, and it works)'
        - 'the selection count (T, not T_sel) and the ordering direction (weight descending)'
        - 'the coverage read-off from TRUE basin sizes of the selected entries, normalised by N'
        - 'that distinct DPs index distinct basins, so the coverage sum does not double-count'
        - 'the pool stopping rule (r*T distinct DPs) and that every walk is charged'
      not_recoverable_from_v2_alone:
        - 'T at N = 2^20 (v2 states 102; the pinned instrument computes 64) -- D1'
        - 'the walk / basin cap, cap = ceil(8*W), and the existence of unassigned cycle and capped mass -- D2, contradicted outright by v2 asserting sum b(d) = N'
        - 'what "pool key" is, in a tie -- D4'
        - 'the exact BCa bootstrap variant on which the FEASIBLE / INFEASIBLE endpoints turn -- D5'

  # ==========================================================================
  # CHECK 2 -- THE NEXT UNDERSPECIFICATION, READ ADVERSARIALLY
  # ==========================================================================
  check_2_further_underspecification:
    defects:
      - id: D1
        blocking: true
        field: 'specification.v2.yaml definitions.T, definitions.T_sel'
        finding: >-
          v2 states "T: nominal table size, round(N^{1/3}): T = 256 at
          N = 2^24, T = 102 at N = 2^20" and "T_sel ... 51 at N = 2^20". The
          arithmetic of the stated rule is right (round(2^20^(1/3)) = 102) and
          the value contradicts BOTH governing sources: EXP-ECDLP-612fb1
          specification.v2.yaml line 223 states T is "64 at 2^20, 256 at 2^24,
          1024 at 2^30", and the commit-pinned production instrument freezes
          T_OF_NBITS = {20: 64, 24: 256, 30: 1024} with no code path to 102.
          At 2^24 and 2^30 the frozen table and round(N^{1/3}) agree; 2^20 is
          the single scale where they do not, and 2^20 is the scale v2 adds.
        why_it_is_blocking: >-
          T is not a cosmetic label. It fixes T_sel = T/2, and W = sqrt(aN/T),
          hence the DP rate, the cap, the basin partition, the pool size r*T
          and every quantity read off them. A re-deriver working from v2 alone
          uses T = 102, T_sel = 51, and W smaller by a factor sqrt(64/102)
          (about 26% lower at every a); Stage B' reusing the pinned instrument
          uses T = 64, T_sel = 32. That is a MANUFACTURED, GUARANTEED
          blind-versus-production divergence at every N = 2^20 cell -- the
          exact v1 failure mode this amendment exists to repair, reproduced at
          the newly added scale. It also breaks the amendment's own item (e)
          rationale, since the N = 2^20 arm was added to be comparable under
          the SAME definition to the Stage 0 a-scan, which ran at T = 64.
        required_change: >-
          State T as the frozen table the instrument implements -- T = 64 at
          N = 2^20, 256 at 2^24, 1024 at 2^30 -- naming EXP-ECDLP-612fb1
          specification.v2.yaml as its source, and correct T_sel = T/2 to 32
          at N = 2^20. If instead the intent is genuinely to measure at
          round(N^{1/3}) = 102, that is a NEW instrument at that scale, not a
          reuse, and it must say so and drop the claim that the instrument is
          unchanged from v1. Alternatively drop the N = 2^20 arm, which
          DEC-20260907-9b1b02 RANK 1 did not ask for.
      - id: D2
        blocking: true
        field: 'specification.v2.yaml definitions.exact basin partition; inputs.pool_construction; definitions.W'
        finding: >-
          v2 defines the partition as covering everything -- "sum over all d of
          b(d) = N" -- and describes pool construction as walking "until a
          distinguished point is reached". The production implementation does
          neither. exact_basins keeps only points with dist <= cap, where
          cap = ceil(8*W) (CAP_MULT = 8), and reports cycle_mass (points that
          reach no DP) and capped_mass (points whose first DP lies beyond the
          cap) as unassigned. Measured directly on the committed v1
          raw-result.json basin arrays at N = 2^24, the unassigned fraction
          (N - sum_d b(d)) / N ranges from 4.67e-4 to 2.09e-3 across the four
          a-cells of RUN-ECDLP-6ac801-001, rising with a. walk_to_dp likewise
          stops at the cap and returns terminal = -1, so a capped
          pool-construction walk is charged but credits no S_d or h_d.
        why_it_is_blocking: >-
          This is a second definitional gap of exactly the class D1 and the
          original v1 defect belong to, and it is worse in one respect: v1 was
          SILENT about the weight, whereas v2 states an identity that is FALSE
          of the object both readings must compute. A re-deriver who takes the
          stated identity as a self-check will either implement no cap -- which
          does not terminate on a DP-free cycle -- or assign the residual mass
          to some basin, and will compute a different b(.), hence a different
          share_top and a different cov_static, in a direction v2 gives no way
          to predict. The cap value 8*W appears nowhere in v2's text, so it is
          not derivable at all.
        required_change: >-
          State the cap as part of the instrument -- cap = ceil(8*W) -- state
          that a point whose first DP lies beyond the cap and a point on a
          DP-free cycle belong to NO basin, replace "sum over all d of
          b(d) = N" with the true relation sum_d b(d) = N - cycle_mass -
          capped_mass, require both readings to report cycle_mass and
          capped_mass per cell, and state that a pool-construction walk
          reaching the cap is charged and credits no S_d or h_d.
      - id: D3
        blocking: true
        field: 'specification.v2.yaml blind_rederivation.blind_from; blind_history_contamination'
        finding: >-
          `blind_history_contamination` scopes the leak hazard to git commit
          messages. It is not the only committed leak path on this branch. The
          Stage A' re-deriver TASK-20260907-6a2b2e declares
          `review_plan_path: ledger/handoffs/TASK-20260907-e423d5.yaml`, and
          must read that file to learn which joints it owns; that file, and the
          committed BATCH-e9fd22 dispatch_queue.json, each state the
          Coordinator's directional expectation at the decision-changing cell
          in plain text (`review_plan.coordinator_prior`, item 2, and items 3
          and 4). Neither path is on `blind_from`, and neither is covered by
          the mitigation, which speaks only of git history commands.
        why_it_is_blocking: >-
          The whole purpose of the re-seal is independence at a = 1/8, and the
          re-deriver is currently instructed to read, before sealing, a file
          that states which way the Coordinator expects a = 1/8 to fall. A
          prior is weaker than a committed verdict, and AGENTS.md "Review
          architecture" REQUIRES the prior be recorded before any reviewer
          runs, so the answer is not to stop recording it -- but leaving it on
          the re-deriver's required reading path spends exactly the
          independence the batch is buying, and it is undetectable afterwards
          for the same reason v2 gives for the commit-message leak.
        required_change: >-
          Keep the prior, move it off the pre-seal reading path: put
          `coordinator_prior` in its own file, add that file plus
          ledger/handoffs/TASK-20260907-e423d5.yaml and the batch
          dispatch_queue.json to `blind_from` until the seal exists, and give
          the Stage A' handoff a joints-and-deliverables extract that carries
          no prior, no verdict and no margin. Add
          coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/tasks/TASK-20260907-f65c6e/
          and ledger/decisions/DEC-20260907-4e34c5.yaml to `blind_from` as
          well: this gate necessarily reasons quantitatively about the same
          cells, and belt-and-braces costs nothing. Widen
          `blind_history_contamination` from "commit messages" to "every
          committed path the re-deriver is instructed or likely to read before
          sealing", and enumerate them.
      - id: D4
        blocking: false
        field: 'specification.v2.yaml definitions."STATIC(T)_r exact coverage (v2, CORRECTED, item a)" item (4)'
        finding: >-
          "ties broken by ASCENDING pool key" does not name what the key is.
          Production uses a per-entry pseudorandom 63-bit integer drawn from an
          independent stream (Params.seed_tiebreak = 400 + seed) in
          pool-insertion order -- not the DP value, not the pool index. A
          re-deriver reading v2 would most naturally use the DP value.
        materiality_measured: >-
          The convention is load-bearing in the committed data, not a corner
          case: a tie AT the T-th largest weight occurs in all 20 committed
          cells and is SPLIT by the tie-break -- some tied entries selected,
          some not -- in 16 of the 20. Its effect on the load-bearing margin
          quantity is nevertheless small: re-selecting under ascending-DP-value
          instead of the production key changed the margin by at most 3.7e-4
          absolute across the four cells of the one seed measured, which is
          below the committed per-seed dispersion of that same quantity. Hence
          non-blocking on magnitude, and stated here because it is free to fix
          and is precisely the class of convention this amendment exists to
          eliminate.
        required_change: >-
          Either name the production convention exactly (an entry-specific
          uniformly random 63-bit key from an independent stream, ascending,
          keyed as the instrument keys it) AND state that the two readings'
          key streams necessarily differ so tie-broken selections may differ,
          with the resulting margin difference declared as within-noise and
          reported; or specify a reading-independent rule (ascending DP value)
          and accept that Stage B' must then implement that rule -- in which
          case control (f)'s 1e-9 reproduction tolerance against the committed
          v1 cells must be restated, because the committed cells were produced
          under the pseudorandom key.
      - id: D5
        blocking: false
        field: 'specification.v2.yaml definitions."G3-feasibility predicate (v2, stated as a formula)"'
        finding: >-
          The predicate turns on the SIGN of a bootstrap interval endpoint
          (FEASIBLE requires L > 0; INFEASIBLE requires U < 0), but "95% BCa
          bootstrap ... 10000 resamples and RNG seed 20260907" does not
          determine an implementation: BCa's bias-correction and jackknife
          acceleration have variants, and two independent implementations
          cannot produce the same resamples from the same integer seed. A cell
          whose mean margin sits near zero can therefore receive different
          verdicts from the two readings for reasons that have nothing to do
          with the quantity -- presenting as an S4 DISAGREEMENT that is an
          artifact of the interval machinery, which is the v1 failure mode
          relocated from the weight to the CI.
        note: >-
          The authoring Coordinator's own recorded prior (item 5) already
          expects joint J2 to raise this and says it regards the objection as
          likely correct. Fixing it in the contract now is cheaper than
          discovering it after the batch runs, and it removes the round's
          dependence on a reviewer happening to catch it.
        required_change: >-
          Either state the BCa variant precisely enough to reimplement (which
          estimator of z0 and of the acceleration, and the resampling
          procedure), or -- preferably -- decouple agreement from the
          interval: judge blind-versus-production AGREEMENT on the pass-count k
          and the sign of the mean margin, use the interval only to route a
          cell to UNRESOLVED, declare a percentile interval as the primary
          with BCa reported beside it, and state an explicit tolerance on the
          endpoints below which a verdict difference is reported as
          interval-method sensitivity rather than as S4.
      - id: D6
        blocking: false
        field: 'specification.v2.yaml blind_history_contamination.consequence_on_scope; interpretation (NEW bullet 5)'
        finding: >-
          v2 verifiably and honestly declares the contamination -- both named
          commits exist on this branch with the quoted subjects, `git log
          --oneline | grep` surfaces exactly those two and no others, and no
          commit message reachable from this branch states the a = 1/8 or
          a = 3/16 verdict -- and then sets a = 1/16's independence to
          "WEAKENED", leaving to joint J5 the question of whether that is the
          right word. But v2 itself records that the contamination is
          undetectable downstream ("a re-derivation that agrees because it was
          told the answer is indistinguishable from one that agrees because the
          answer is right"), and an unfalsifiable weight is not a weight.
        required_change: >-
          Make the rule asymmetric and binding in the contract rather than
          deferring it: AGREEMENT at a = 1/16 carries ZERO independence weight
          from the outset; DISAGREEMENT at a = 1/16 retains FULL weight, and
          additionally triggers F2 and AGENTS.md rule 12. This costs nothing --
          a = 1/16 already earns its place in v2 as control (f)'s reproduction
          target and as DECAY-A's low-a endpoint, neither of which needs
          independence -- and it removes a judgement call from a post-hoc
          reviewer. J5 keeps the ceiling-versus-mechanism joint and gains a
          stated rule to attack rather than a word to arbitrate.
      - id: D7
        blocking: false
        field: 'specification.v2.yaml controls (g) NULL-RANDSEL'
        finding: >-
          v2 claims NULL-RANDSEL is the real measurement's shape "in every
          respect ... with exactly one substitution". It is two substitutions.
          The real quantity's treatment arm, share_top(T_sel), ranges over the
          ENTIRE basin partition (order 10^5 basins at these parameters); the
          null's arm ranges over the r*T = 512-entry pool P only. So the null
          changes the selection rule AND the universe, and its guaranteed
          negativity is bought largely by the universe change and by the
          T_sel/|P| = 1/4 size ratio rather than by the weight carrying
          information. Recomputed on the committed cells, the null's quantity
          sits one to two orders of magnitude beyond its own declared firing
          threshold at every cell -- so the control is falsifiable in principle
          (see check 3) but has almost no discriminating power against the
          claim actually under test.
        required_change: >-
          Keep NULL-RANDSEL as a check on the weight estimator, and add a
          null of the REAL measurement's shape: replace the ORACLE side --
          top-T_sel-by-size over the whole partition -- with a random
          T_sel-subset drawn over the SAME universe (uniform over basins, and
          a size-biased variant), holding cov_static fixed, with its own stated
          firing signature. This is the properly-shaped null the inventor
          protocol's "controls before belief" asks for, and it is the joint the
          red team is already assigned to break (J3); giving it a null that can
          plausibly fail is what makes that assignment worth running.

  # ==========================================================================
  # CHECK 3 -- CAN THE CONTROLS FAIL?
  # ==========================================================================
  check_3_control_falsifiability:
    method: >-
      Each control's declared firing signature was read against what the
      committed v1 artifacts permit, recomputing the control's own quantity
      from the basin arrays and re-generated pools rather than trusting the
      contract's description of it. The question asked of each was the
      inventor-protocol one: does a state of the world exist in which this
      control fires on a correct implementation?
    decay_tsel_repair_verified:
      claim_by_authoring_session: >-
        A DECAY-TSEL monotonicity clause was found vacuous -- cov_static does
        not depend on T_sel, and share_top(T_sel) is a prefix sum of a
        descending sequence, so margin(T/2) > margin(T/4) > margin(T/8) holds
        by arithmetic on every correct implementation -- and was removed and
        replaced.
      verdict: CONFIRMED, and the repair is genuine.
      evidence: >-
        run_stageb.py line 96 selects T entries, never T_sel, so cov_static is
        independent of T_sel by construction; Basins.top_share is a prefix sum
        of sort(size)[::-1], strictly decreasing in the prefix length whenever
        the omitted basin sizes are positive, which they are for every DP. The
        removed clause was therefore an arithmetic identity, and the two
        replacement clauses are not implied by any identity in the code.
    controls:
      - control: 'NULL-RANDSEL (g) -- margin_null < 0 in >= 24 of 25 seeds AND bootstrap CI upper bound on mean margin_null strictly below 0'
        can_it_fail: 'YES -- falsifiable'
        state_of_the_world_in_which_it_fires: >-
          Nothing in the code or in arithmetic forces margin_null < 0. It fires
          if the pipeline computes cov_static over the wrong universe (e.g.
          over the selected T_sel entries rather than the T weight-selected
          ones), if the "random subset" is drawn with a size- or weight-biased
          RNG rather than uniformly, if the coverage read-off double-counts, or
          if the weight ceases to carry information about basin size at some a.
        strength: >-
          WEAK. Recomputed on the committed cells, the quantity sits one to two
          orders of magnitude beyond the firing threshold everywhere, and D7
          explains why: the null is not of the same shape as the measurement,
          so most of that distance is bought by the universe change rather than
          by the mechanism under test. It is a valid control that will
          essentially never fire on anything but a gross defect.
        verdict: 'falsifiable, but low power; see D7'
      - control: 'DECAY-A (h)(i) -- mbar(a) strictly decreasing across a = 1/16, 1/8, 3/16, 1/4'
        can_it_fail: 'YES -- falsifiable'
        state_of_the_world_in_which_it_fires: >-
          Each a is a DIFFERENT instrument -- different W, different DP rate,
          different cap, different basin partition -- so no arithmetic identity
          relates the four means. A single non-monotone step, which the
          contract requires to be strict, fires it.
        strength: 'MODERATE, and the strongest of the three internal clauses.'
        verdict: falsifiable
      - control: 'DECAY-A (h)(ii) -- CI on the paired difference mbar(1/4) - mbar(1/16) excludes 0 on the negative side'
        can_it_fail: 'YES -- falsifiable'
        state_of_the_world_in_which_it_fires: 'Fires whenever the a-endpoints do not separate at 25 seeds, e.g. if the weight estimator degrades similarly at both endpoints.'
        strength: MODERATE
        verdict: falsifiable
      - control: 'DECAY-A (h)(iii) -- mbar(1/4) < 0 with its own CI excluding 0'
        can_it_fail: 'YES -- falsifiable, and this is the one clause anchored OUTSIDE the batch'
        state_of_the_world_in_which_it_fires: >-
          Fires if this batch's a = 1/4 cell does not reproduce the
          independently established a = 1/4 infeasibility of EV-ECDLP-60e266.
          Because the anchor is external, a self-consistent but wrong
          implementation does not pass it automatically -- which is the
          property the other clauses lack.
        strength: 'STRONGEST clause in the batch. v2''s own claim that DECAY-A "carries the load" is correct.'
        verdict: falsifiable
      - control: 'DECAY-TSEL (i)(i) -- margin < 0 at T_sel = T/8 in >= 24 of 25 seeds at EVERY a'
        can_it_fail: 'YES -- falsifiable'
        state_of_the_world_in_which_it_fires: >-
          Fires if a table of T/8 entries already matches STATIC(T)''s
          coverage, i.e. if the comparison is not measuring stored-advice
          efficiency at all. Not forced by any identity: cov_static is
          T_sel-independent, so the sign at T/8 is an empirical fact about the
          basin size distribution.
        strength: 'WEAK -- comfortably satisfied on every committed cell, and internal to the batch.'
        verdict: falsifiable
      - control: 'DECAY-TSEL (i)(ii) -- rho_ORACLE non-decreasing in a'
        can_it_fail: 'YES -- falsifiable, but with very coarse resolution'
        state_of_the_world_in_which_it_fires: 'Fires on any inversion of the sign-change location across a.'
        strength: >-
          WEAK. Given clause (i), rho_ORACLE can take only three values on the
          read grid {T/8, T/4, T/2}, and on the committed cells it takes only
          two, so this is effectively a two-level ordering check on the same
          directional claim DECAY-A already makes. v2's own disclosure that
          DECAY-TSEL is the weaker control is accurate.
        verdict: falsifiable
      - control: 'Reproduction control (f) -- Stage B'' margins reproduce the committed v1 cells at seeds 1..5, N = 2^24, to 1e-9'
        can_it_fail: 'YES -- falsifiable, and independently confirmed SATISFIABLE here'
        note: >-
          This gate reproduced all three quantities at all 20 committed cells
          to 0.000e+00 from the pinned instrument, so the target is real and
          the tolerance is achievable. Note the interaction with D4: if the
          revision changes the stated tie-break convention, control (f)'s
          tolerance against the committed cells must be restated, because those
          cells were produced under the production key.
        verdict: falsifiable and satisfiable
      - control: 'NULL-SHUF (j) -- diagnostic only'
        can_it_fail: 'not applicable'
        note: >-
          Correctly labelled a diagnostic and explicitly excluded from every
          verdict. v2''s statement that it fires in the wrong direction to
          serve as a G3 null is right, and disclosing that rather than dropping
          it is the correct handling.
        verdict: 'correctly scoped as a diagnostic; no verdict depends on it'
    summary: >-
      Every declared control is falsifiable: for each there exists a state of
      the world in which it fires on a correct implementation, so none is a
      control that cannot fail. The DECAY-TSEL repair is genuine and was
      verified against the code, not accepted on the authoring session's word.
      What the check also shows is a power gradient the contract only partly
      discloses: DECAY-A clause (iii) is the only externally anchored clause
      and carries essentially the whole artifact-detection load, while
      NULL-RANDSEL -- nominally the null object -- is shape-mismatched (D7) and
      sits far from its own threshold. That is a reason to strengthen the null,
      not a reason to refuse the amendment.

