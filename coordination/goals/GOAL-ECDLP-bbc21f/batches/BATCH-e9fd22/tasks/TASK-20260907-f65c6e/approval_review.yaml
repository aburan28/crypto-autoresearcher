  # ==========================================================================
  # CHECK 5 -- BLIND-HISTORY CONTAMINATION
  # ==========================================================================
  check_5_blind_history_contamination:
    declared_condition_verified:
      commits_named_by_v2: ['84233e8c3', '376c6660e']
      checked: >-
        Both commits exist and are reachable from this branch, and their
        subjects state the a = 1/16 verdict in plain text exactly as v2 quotes
        them. A history scan of every commit subject on this branch surfaces
        those two and no other commit stating any cell's verdict; the only
        other subject matching an infeasibility phrase belongs to an unrelated
        isogeny lane (H-IT-001). The six commits of BATCH-e9fd22 itself state
        no verdict, margin or number.
      verdict: 'v2''s declaration is ACCURATE and was verified independently, not accepted on its word.'
    mitigation_assessment:
      adequate_as_far_as_it_goes: >-
        Instructing the re-deriver not to run git history commands before
        sealing, declaring the condition instead of concealing it, and scoping
        the strength of the claim per cell are all correct handling, and
        disclosing an unrepairable limitation rather than engineering around it
        is the right instinct.
      but_incomplete: 'It is scoped to commit messages only. See D3: the re-deriver''s own declared review_plan_path and the committed dispatch queue state the Coordinator''s directional prior at the decision-changing cell, and neither is on blind_from.'
    ruling_on_the_a_1_16_independence_weight:
      question: >-
        Is "weakened, disclosed, and left to joint J5" adequate, or must the
        a = 1/16 cell carry ZERO independence weight from the outset?
      ruling: >-
        ZERO for agreement, FULL for disagreement, fixed in the contract now
        rather than routed to J5.
      reasoning: >-
        v2 itself records that the contamination is undetectable downstream: an
        agreement produced because the re-deriver was told the answer is
        indistinguishable from an agreement produced because the answer is
        right. A weight that no observation can revise is not a weight, so any
        nonzero independence credit at a = 1/16 is unfalsifiable and should not
        be carried. The converse does not hold and must be preserved: a
        DISAGREEMENT at a = 1/16, arrived at despite two commit messages
        stating the opposite verdict, is strong evidence and additionally
        triggers F2 and AGENTS.md rule 12. Making the rule asymmetric and
        binding costs the batch nothing, because a = 1/16 already has two jobs
        in v2 that need no independence at all -- it is control (f)'s
        reproduction target and DECAY-A's low-a endpoint. J5 retains the
        ceiling-versus-mechanism joint and now has a stated rule to attack
        rather than an adjective to arbitrate.
      relation_to_the_recorded_prior: >-
        The authoring Coordinator's `review_plan.coordinator_prior` item (7)
        anticipated this exact recommendation from J5 and said it would accept
        it. That is recorded here as concurrence with a pre-registered prior,
        NOT as an independent attestation: no reviewer has run, and this gate
        obtained no attestation from anyone.
      verdict: 'REVISION ITEM D6 -- non-blocking on its own, folded into the same revision'

