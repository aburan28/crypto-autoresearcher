review_plan:
  claim_under_review: 'TO BE STATED BY THE PRODUCER IN ITS OWN execution_report.yaml, and reviewed
    as the producer states it, not as the Coordinator would restate it. Its expected shape: "Under
    specification.v2.BATCH-e9fd22-proposed.yaml''s corrected STATIC(T)_r definition, at N in {2^20, 2^24}, r = 2, T_sel
    = T/2, over the pre-registered 25-seed set, the G3 margin resolves each a in {1/16, 1/8, 3/16,
    1/4} to FEASIBLE / INFEASIBLE / UNRESOLVED per the contract''s predicate, with controls (f), (g),
    (h) and (i) passing." Reviewers read the producer''s actual wording first and attack that.'
  coordinator_prior: 'RECORDED BEFORE ANY REVIEWER RUNS, 2026-09-07, by the Coordinator opening this
    batch. What I expect this round to find, so that later concurrence can be told apart from agreement
    with me. (1) I expect Stage A'' and production to AGREE at every cell at both N. The amendment
    removes the only diagnosed divergence source, and if they still disagree the validator''s root-cause
    diagnosis was incomplete -- which would be the most informative outcome available here and would
    be worth more than the a = 1/8 answer itself. (2) At a = 1/8, N = 2^24, I hold a WEAK prior toward
    FEASIBLE and I mark it weak deliberately. The only reading pointing that way is a post-hoc, non-blind
    diagnostic that DEC-20260907-9b1b02 explicitly refused to treat as resolving. I think there is
    a substantial chance -- roughly one in three -- that 25 seeds land the cell UNRESOLVED, because
    the committed 5-seed margins there sit very close to zero. (3) I expect a = 1/16 to remain FEASIBLE
    and a = 1/4 to remain INFEASIBLE. A reversal at a = 1/16 would contradict EV-ECDLP-2e9680 and
    would trigger AGENTS.md rule 12 rather than being recorded. (4) I expect J4 to report DECAY-TSEL
    as the WEAKEST of the four controls. I already removed its tautological monotonicity clause from
    the contract after noticing that cov_static does not depend on T_sel; I expect the red team to
    find that what remains is still largely internal corroboration and that DECAY-A carries essentially
    the whole artifact-detection load. If the red team instead finds DECAY-TSEL substantive, that
    overturns my prior and I want it recorded as such. (5) I expect J2 to surface a genuine methodological
    objection to the BCa bootstrap at n = 25 -- most likely that the acceleration constant is poorly
    estimated at this sample size and that a paired sign test or a simple percentile interval would
    be more defensible. I regard this as likely to be RIGHT and I am recording it in advance so that
    acting on it is a review result rather than a Coordinator preference applied after the fact. (6)
    I expect J3 to hold: I believe NULL-RANDSEL''s known-false argument is sound. The place I think
    it is most likely to break is at the smallest a, where W is largest, basins are fewest and largest,
    and a random half-size subset of the pool might occasionally rival a weight-selected full-size
    one. If the red team breaks it there, the null must be replaced before any cell is believed. (7)
    I expect J5 to hold on the ceiling-versus-mechanism distinction, which the contract states repeatedly,
    and to find the blind-history contamination disclosure adequate but insufficient -- i.e. I expect
    it to argue that a = 1/16''s agreement should carry no independence weight at all rather than
    reduced weight. I would accept that.'
  joints:
  - joint: J1 -- the G3 margin
    assigned_to: TASK-20260907-6a2b2e
    attack_plan: 'Do not check the producer''s arithmetic. Re-derive the quantity from specification.v2.BATCH-e9fd22-proposed.yaml
      `definitions` and `inputs.pool_construction` alone, in your own code, and SEAL it before opening
      any blind_from path. Build the exact basin partition from the DP-truncated functional graph;
      construct the pool by the stated restart-and-walk procedure to r*T distinct DPs; accumulate
      h_d and S_d over ALL pool walks including repeats; select the T largest weight_d = S_d + 4*W*h_d
      with ascending key tiebreak; read coverage from the TRUE basin sizes of the selected set. Verify
      your own basin-closure code against exhaustive brute force at a small N (the prior review used
      N = 1024 and found a real bug that way) and report that check inside the seal. WHERE I THINK
      IT BREAKS: in the pool accumulation, not the selection. S_d "summed over every pool-construction
      walk terminating at d, including restarts" is the clause the v1 re-derivation could not read
      because it did not exist; a re-deriver that charges only the first walk to each DP, or that
      counts walk length from the DP backwards, or that stops the pool at r*T WALKS rather than r*T
      DISTINCT DPs, will produce a self-consistent but different weight and reproduce v1''s failure
      mode under a new cause. State explicitly which reading you took for each of those three choices.'
    breaking_artifact: A sealed per-(N, a, seed) margin table disagreeing with production beyond seed-to-seed
      noise at any cell, with the disagreement localised to one of the three named accumulation choices.
  - joint: J2 -- the verdict rule and its interval
    assigned_to: TASK-20260907-6a2b2e
    attack_plan: 'Attack the mapping from 25 margins to a verdict, independently of whether the margins
      are right. Recompute k, mbar and the 95% BCa bootstrap CI at every cell from the producer''s
      own raw-result.json (this part IS a recomputation and is meant to be). Then attack the method:
      is BCa''s acceleration constant estimable at n = 25, and does the interval differ materially
      from a percentile interval, a BCa with a different resample count, or a paired sign test? Check
      whether any cell''s verdict FLIPS between those choices -- a verdict that depends on the interval
      method is not a verdict. Check the thresholds too: k >= 20 and k <= 5 leave the band 6..19 mapping
      to UNRESOLVED. Confirm the contract''s predicate is applied exactly as written and that no cell
      was resolved by the pass-count while its CI straddled zero, or vice versa. WHERE I THINK IT
      BREAKS: BCa at n = 25. See coordinator_prior (5).'
    breaking_artifact: A cell whose verdict changes under a defensible alternative interval method,
      with both intervals and the resulting verdicts tabulated.
  - joint: J3 -- NULL-RANDSEL, the null object
    assigned_to: TASK-20260907-3dff63
    attack_plan: 'The contract asserts that NULL-RANDSEL''s G3-feasibility is known false BY ARGUMENT:
      a uniformly random T_sel-subset of the pool cannot match a weight-selected subset of twice the
      size from the same pool, because weight is positively correlated with basin size. Try to break
      that argument. Construct or find a regime where it fails -- push a toward the small end where
      W is large and the basin count is small, or consider what happens when the pool''s weight ranking
      is nearly uninformative. Compute, do not argue: run the null at the smallest tested a at N =
      2^20 (cheap) with many extra seeds and look at the right tail of margin_null, not its mean.
      Then run the PROVES-TOO-MUCH control below: apply the producer''s entire pipeline and predicate
      unchanged to the objects listed in `proves_too_much.objects` and confirm it returns INFEASIBLE
      on each. WHERE I THINK IT BREAKS: the smallest a. See coordinator_prior (6).'
    breaking_artifact: A (N, a, seed) instance where margin_null >= 0, or a cell where the null's
      pass-count exceeds the contract's 24-of-25 signature, or a known-false object on which the producer's
      argument returns FEASIBLE.
  - joint: J4 -- the decay controls DECAY-A and DECAY-TSEL
    assigned_to: TASK-20260907-3dff63
    attack_plan: 'Ask of each control the only question that matters: could it have failed? For DECAY-A,
      check whether mbar decreasing in a is forced by any identity in the definitions rather than
      being a property of the object, and check whether its externally anchored clause (mbar(1/4)
      < 0, anchored on EV-ECDLP-60e266) is actually independent of this batch or is quietly re-derived
      from the same runs. For DECAY-TSEL, verify my own claim that the monotonicity clause is tautological
      because cov_static does not depend on T_sel, and then judge whether the two clauses that remain
      -- margin < 0 at T_sel = T/8 in 24 of 25 seeds, and rho_ORACLE non-decreasing in a -- have real
      content or are near-certain to pass on any correct implementation. Report a control that cannot
      fail AS a control that cannot fail; that finding is worth more than a passing verdict. WHERE
      I THINK IT BREAKS: DECAY-TSEL. See coordinator_prior (4).'
    breaking_artifact: A demonstration that a declared control's firing signature is satisfied by
      construction, or that DECAY-A's external anchor is circular, with the identity or the shared
      dependency exhibited.
  - joint: J5 -- scope, interpretation, and the blind-history contamination
    assigned_to: TASK-20260907-3dff63
    attack_plan: 'Attack what the batch would be allowed to CLAIM if every number came out as the
      producer reports it. Three specific targets. (i) The ceiling-versus-mechanism boundary: confirm
      that nothing in the execution report, or in the shape of the result, licenses a statement that
      the online LOWER-bracket re-selection mechanism reaches the ceiling at any batch size U -- zero
      online arms are run. (ii) The blind-history contamination at a = 1/16 (specification.v2.BATCH-e9fd22-proposed.yaml
      `blind_history_contamination`, commits 84233e8c3 and 376c6660e): judge whether "weakened independence"
      is an adequate disposition or whether that cell''s blind-production agreement should carry NO
      independence weight; state which and why. (iii) Scale and transfer: confirm every reported conclusion
      is scoped to the tested (N, a, r, T_sel, seed set, instrument) and that no N-dependence conclusion
      is drawn from two scales that would not survive a third. Also check the arithmetic of the claim
      tier: this is a toy-scale, constant-factor measurement under KN-LIT-013 and no exponent may
      be implied anywhere. WHERE I THINK IT BREAKS: (ii). See coordinator_prior (7).'
    breaking_artifact: A specific sentence in the producer's report, or a specific structural feature
      of the result, that would license a claim the contract's `interpretation` forbids -- quoted,
      with the forbidding clause beside it.
  - joint: J6 -- the reproduction control against the committed v1 cells
    assigned_to: TASK-20260907-6a2b2e
    attack_plan: 'AFTER sealing J1, open experiments/EXP-ECDLP-6ac801/runs/ and check control (f)
      yourself rather than accepting the producer''s residuals: recompute the seeds 1..5, N = 2^24
      margins from the NEW raw-result.json and compare them against the COMMITTED RUN-ECDLP-6ac801-001..006/summary.json
      values. These are exact enumerations of a deterministic instrument at fixed seeds, so any residual
      above floating-point summation noise is a genuine pipeline divergence, not a tolerance question.
      WHERE I THINK IT BREAKS: the pool draw, if the v2 implementation changed the restart RNG or
      the distinct-DP stopping test. That would change the pool and therefore cov_static while leaving
      share_top untouched -- so look at the two components separately, not only at the margin, because
      a divergence in cov_static alone is invisible in a difference that happens to land close.'
    breaking_artifact: A seed where the new and committed share_top or cov_static differ above 1e-9,
      with the two components reported separately.
  blindness:
    mutual: true
    lifted_for: []
    rationale: null
    note: TASK-20260907-6a2b2e and TASK-20260907-3dff63 may not read each other's reports in this
      round. They own disjoint joints and are dispatched concurrently; each attests in its own report
      to what it read. Nothing here is lifted, and lifting would require a new Coordinator decision
      naming the task and the rationale, not a mid-round choice.
  proves_too_much:
    objects:
    - 'OBJ-1, a = 1/4 at N = 2^24, T_sel = T/2: G3-feasibility is KNOWN FALSE here on external evidence
      -- EV-ECDLP-60e266 (10/10 FAIL) and EV-ECDLP-2e9680 (0/5 under both readings). This is the primary
      known-false object and it is inside the batch''s own grid.'
    - 'OBJ-2, NULL-RANDSEL at every (N, a): G3-feasibility is KNOWN FALSE by construction and by the
      argument in `controls` (g), independently of any measurement.'
    - 'OBJ-3, T_sel = T/8 at every (N, a): a table of one eighth the static size cannot cover as much
      as STATIC(T)''s weight-selected T entries on this instrument. Known false by the same correlation
      argument as OBJ-2, at a different point.'
    - 'OBJ-4, the affine-xorshift keyed BIJECTION fixture from coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-90e7cf/src/pipeline_perm
      and results/j4_perm/: a permutation has no basin structure at all, so every basin has size 1
      and no selection rule can beat any other. Any pipeline that reports a positive margin, or a
      G1/G3 PASS, on a bijection is detecting something that is not basin structure. This is the lane''s
      existing permanent negative fixture and it is reused rather than reinvented.'
    failure_signature: 'Run the producer''s pipeline and the contract''s predicate, UNCHANGED, on
      each object. A correct argument must return G3-INFEASIBLE on OBJ-1, OBJ-2 and OBJ-3, and must
      return either G3-INFEASIBLE or an explicit structural refusal (never a PASS, never a crash)
      on OBJ-4. An argument that returns FEASIBLE, or UNRESOLVED, on any of the four has proved too
      much: it is producing feasibility from something other than top-basin structure, and every cell
      in the batch is then uninterpretable regardless of how clean it looks. Report the object, the
      returned verdict, and the per-seed numbers behind it.'
    assigned_to: TASK-20260907-3dff63
  blind_rederivation:
    required: true
    quantity: 'The G3 margin: margin(N, a, seed) = share_top(T_sel) - cov_static, where share_top(T_sel)
      is the exact fraction of the N points lying in the T_sel largest basins of the exact DP-truncated
      basin partition, and cov_static is the exact fraction lying in the basins of the T pool entries
      with the largest weight_d = S_d + 4*W*h_d. The STATEMENT is specification.v2.BATCH-e9fd22-proposed.yaml `definitions.STATIC(T)_r
      exact coverage (v2, CORRECTED, item a)` together with `definitions.exact top-T_sel basin share`
      and `inputs.pool_construction`. Derive from those alone.'
    parameters: N in {2^20, 2^24} (T = 102 and 256 respectively); a in {1/16, 1/8, 3/16, 1/4}; r =
      2; T_sel = T/2; seeds 1..25; W = sqrt(a*N/T); DP predicate and walk as specification.v2.BATCH-e9fd22-proposed.yaml
      `instrument` states.
    blind_from:
    - experiments/EXP-ECDLP-612fb1/source_v2/
    - experiments/EXP-ECDLP-6ac801/source/
    - experiments/EXP-ECDLP-6ac801/source_v2/
    - experiments/EXP-ECDLP-6ac801/runs/
    - coordination/experiments/EXP-ECDLP-6ac801/batches/BATCH-3c7493/tasks/TASK-20260907-80e198/
    - coordination/experiments/EXP-ECDLP-6ac801/batches/BATCH-3c7493/tasks/TASK-20260907-0a8773/
    - ledger/evidence/EV-ECDLP-2e9680.yaml
    - ledger/evidence/EV-ECDLP-f6b3f5.yaml
    - ledger/evidence/EV-ECDLP-60e266.yaml
    - ledger/decisions/DEC-20260907-9b1b02.yaml
    - experiments/EXP-ECDLP-6ac801/specification.v2.yaml
    - experiments/EXP-ECDLP-6ac801/amendments/v1_to_v2.yaml
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/tasks/TASK-20260907-e423d5/
    assigned_to: TASK-20260907-6a2b2e
    note: 'specification.v2.BATCH-e9fd22-proposed.yaml and experiments/EXP-ECDLP-6ac801/amendments/v1_to_v2.BATCH-e9fd22-proposed.yaml
      are deliberately NOT on this list and MUST be read: they are the statement being derived from.
      The live canonical specification.v2.yaml and v1_to_v2.yaml ARE on this list: after the 2026-09-07
      merge they are origin/main''s approved narrow a=1/8 re-seal and they narrate prior per-cell
      verdicts, including the a=1/8 production-side flip. Opening them before sealing is a blind_from
      violation. The re-deriver opens blind_from paths only AFTER sealing, for the required cell-by-cell
      comparison, and attests to the ordering.'
  blind_phase_hygiene:
    declared: true
    condition: 'PARTIAL CONTAMINATION ALREADY EXISTS AND CANNOT BE UNDONE. Two commit messages reachable
      from this branch state the a = 1/16 verdict in plain text: 84233e8c3 and 376c6660e. `git log
      --oneline` displays them and is in nobody''s blind_from list. Per CORR-20260905-547849 this
      is exactly the hole tools/check_review_independence.py --blind-history exists to catch, and
      it is unfixable here: the commits are immutable archive commits and reverting them would break
      the receipts bound to them without retracting the messages.'
    mitigation: TASK-20260907-6a2b2e is instructed not to run git history commands before sealing.
      Neither this batch's snapshot nor its ledger commit messages may state any per-cell verdict,
      margin or numeric result.
    scope_of_the_independence_claim: FULL at a = 1/8 and a = 3/16, whose verdicts appear in no commit
      message. WEAKENED at a = 1/16 whatever the re-deriver does. a = 1/4 was never blind -- its infeasibility
      is public in EV-ECDLP-60e266. Any evidence record from this batch must state this beside the
      a = 1/16 result. J5 owns the question of whether "weakened" is the right word.
  composition: The Coordinator composes the verdicts; no reviewer votes on the whole claim. Each reviewer
    owns its joints and reports on those. Before the round is treated as complete the orchestrating
    session runs `python3 tools/check_review_independence.py --batch coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22`
    and reports its exact output.
  procedure_deviations: []
