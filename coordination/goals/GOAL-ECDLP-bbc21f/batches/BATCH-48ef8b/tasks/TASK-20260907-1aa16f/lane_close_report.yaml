        - 'EXP-BREAK-4, the second scale as added surface for no required purpose: PASSED. The gate took the smaller change seriously and declined it, on the ground that N-dependence of the feasibility boundary is a live possibility a single-scale batch cannot see.'
    the_miss_prediction_was_overturned:
