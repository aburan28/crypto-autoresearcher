        YES, and that is not the operative answer. Nothing in the gate's conduct
        needs changing, and the second gate in particular did the expensive work
        its own author predicted it would skip.
      does_contract_authorship_need_a_different_method: >-
        YES, AND THIS IS THE OPERATIVE ANSWER. Two successive one-pass
        authorships of the same contract each failing on the SELF-CONSISTENCY OF
        THEIR OWN TEXT does not have bad luck as its failure mode. Every defect
        of both rounds' cross-reference class is MECHANICALLY CHECKABLE and none
        requires judgement.
      the_method_named: >-
        AM-1, "derive-then-assert": one machine-checkable source for the item
        and condition tables, plus a MANDATORY PRE-GATE SELF-CONSISTENCY PASS
        that is a script rather than a reading, archived as a task artifact.
        Five checks -- C-1 item-set identity, C-2 partition arithmetic, C-3
        quantifier range, C-4 cross-reference resolution, C-5 pointer freshness.
        By inspection of the gate's own defect list it would have caught five of
        the seven blocking findings; it would NOT have caught CF-2 or CF-4, and
        that is the point -- those two need a reader, and they are the two
        findings a gate's judgement is worth paying for. AM-1 IS UNTESTED: no
        such pass has been run in this program and this close implements none of
        it, which is why it is carried as a required deliverable of RANK 1 so
        the claim gets tested rather than asserted. Full statement and cost:
        DEC-20260907-de6b71 `two_gates_two_refusals.contract_authorship_method`.

