    benefit: >-
      Four of the ten blocking defects would have produced invalid or
      uninterpretable output, discovered if at all AFTER compute; Round 1's D2
      is still LIVE in the approved, execution-authorized v2, which is the
      strongest available evidence that the gate caught something real; and each
