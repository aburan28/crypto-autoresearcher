    cross_reference_defects_found:
      - id: XR-1
        severity: BLOCKING (see rationale in the decision record)
        where: 'experiments/EXP-ECDLP-6ac801/amendments/v2_to_v3.yaml lines 104-199'
        what: >-
          THE FOUR CR-1 CONDITIONS ARE PERMUTED AGAINST THEIR SOURCE. In
          DEC-20260907-b6bcf4 `compatibility_read.the_four_conditions_v3_must_meet`
          the conditions are: COND-1 (line 94) the second arm / T at N = 2^20;
