  # ===================================================================
  # J1 -- CAP FIDELITY
  # ===================================================================
  J1_cap_fidelity:
    status: PASS
    what_was_checked: >-
      The cap convention as v3 states it, symbol by symbol, against the two
      named source files, and then re-derived arithmetically at every cell of
      v3's own W/cap table.
    sources_read:
      - experiments/EXP-ECDLP-612fb1/source_v2/instrument.py
      - experiments/EXP-ECDLP-6ac801/source/run_stageb.py
      - experiments/EXP-ECDLP-6ac801/specification.v3.yaml (`definitions`)
    symbol_by_symbol:
      - symbol: T
        contract_says: 'T = T_OF_NBITS[n_bits]'
        code_says: 'instrument.py line 74: self.T = T_OF_NBITS[self.n_bits]'
        verdict: IDENTICAL
      - symbol: W
        contract_says: 'W = sqrt(a * N / T)'
        code_says: 'instrument.py line 75: self.W = math.sqrt(self.a * self.N / self.T)'
        verdict: IDENTICAL
      - symbol: CAP_MULT
        contract_says: 'the multiplier is 8'
        code_says: 'instrument.py line 31: CAP_MULT = 8'
        verdict: IDENTICAL
      - symbol: cap
        contract_says: 'cap = ceil(8 * W)'
        code_says: 'instrument.py line 77: self.cap = int(math.ceil(CAP_MULT * self.W))'
        verdict: >-
          IDENTICAL, INCLUDING THE ROUNDING. ceil, not round and not floor, and
          the multiplication happens before the rounding (ceil(8W), never
          8*ceil(W)). Both were checked as distinct claims because they are
          distinct ways to be wrong, and both hold.
      - symbol: 'how a capped walk is charged'
        contract_says: >-
          a walk that reaches the cap without hitting a DP is terminated and
          its mass is charged to capped_mass, not to any basin
        code_says: >-
          instrument.py `walk_to_dp` (lines 126-151) terminates on the step
          counter reaching cap and returns a non-DP outcome; `exact_basins`
          (lines 194-215) routes exactly those points to capped_mass and
          excludes them from the bincount. In pool construction
          (`generate_pools`, lines 243-289) a capped walk is counted in
          capped_walks and contributes no pool entry.
        verdict: IDENTICAL
    recomputed_by_this_gate: >-
      W and cap were recomputed independently, in Python, from
      W = sqrt(a*N/T) and cap = ceil(8W) using the frozen T at each scale, for
      ALL EIGHT (N, a) cells of v3's grid -- N in {2^20, 2^24} crossed with
      a in {1/16, 1/8, 3/16, 1/4}. Every recomputed W and every recomputed cap
      equals the value v3 tabulates in `definitions` item 6. Zero
      discrepancies. This is a recomputation, not a reading of the table.
    derivable_from_the_contract_text_alone:
      answer: true
      worked: >-
        A reader who never opens the source can reach the cap from v3's text
        alone: `definitions` states T's source (the frozen table, with both
        scales' values given), states W = sqrt(a*N/T) explicitly, states the
        multiplier 8 explicitly, states the rounding as ceil explicitly, and
        states the charging rule for a capped walk. This gate confirmed
        derivability by computing the table from the contract's own strings
        before comparing against the code, and the two agree. This is the
        precise gap D2 opened and v3 closes: v1 and v2 named no multiplier and
        no rounding, so a re-deriver had to invent one.
    finding: >-
      The stated formula is IDENTICAL to the implementation, not merely close.
      The comparison was performed here rather than inherited from
      DEC-20260907-4e34c5's TF-1, as DEC-20260907-b6bcf4 `limitations`
      requires.
    one_citation_defect_found:
      severity: minor, non-blocking
      where: 'specification.v3.yaml line 558'
      what: >-
        v3 cites "instrument.py line 84" for
        `K = mix64( 0x9E3779B97F4A7C15 + seed )`. The assignment
        `self.K = mix64_int(0x9E3779B97F4A7C15 + self.seed)` is at line 81;
        line 84 is `self.bits_entry`. Off by three.
      why_non_blocking: >-
        The FORMULA v3 quotes is correct and is what the code computes; only
        the line pointer is stale. It misdirects a reader by three lines
        inside the same method. Contrast with the cap citations (lines 31, 74,
        75, 77), which this gate checked individually and found exact.

  # ===================================================================
  # J2 -- RESIDUAL ACCOUNTING
  # ===================================================================
  J2_residual_accounting:
    status: PASS
    what_was_checked: >-
      Whether `sum_d b(d) + cycle_mass + capped_mass = N` is TRUE of the
      implementation; whether the three classes are disjoint and exhaustive;
      whether integer arithmetic makes it exact; whether both readings must
      report the residual quantities; whether a DP can carry an empty basin;
      and whether D2's false assertion is gone rather than restated elsewhere.
    structural_check_on_the_code:
      source: 'instrument.py `exact_basins`, lines 194-215'
      what_the_classes_are:
        ok: >-
          points whose walk reached a DP within the cap. `sat`/`reach` carry
          the per-point termination state; `ok` is the boolean mask selecting
          exactly the DP-terminating points.
        cycle_mass: >-
          points whose walk entered a cycle containing no DP. Counted as a
          mass, assigned to no basin.
        capped_mass: >-
          points whose walk hit the cap without reaching a DP. Counted as a
          mass, assigned to no basin.
      bincount_scope: >-
        CONFIRMED: `np.bincount` is taken over the `ok` subset ONLY. The two
        residual classes never enter a basin count. This is the specific thing
        that makes the three-term identity true and the old two-term assertion
        false.
      disjoint: >-
        YES, by construction. Each point has exactly one termination state --
        reached a DP, entered a DP-free cycle, or hit the cap -- and the three
        masks are complementary selections on that single state. No point can
        satisfy two.
      exhaustive: >-
        YES. The three states are the only terminations `walk_to_dp` can
        produce: it either returns a DP, detects a DP-free cycle, or exhausts
        the cap counter. There is no fourth exit.
      exactness: >-
        GENUINELY EXACT, and the word "exact" is load-bearing rather than
        decorative. Every term is an integer count of points (bincount output,
        and two integer mass counters); the identity is a partition of N
        integers into three integer classes. No float enters it, so "zero
        tolerance" is meaningful rather than aspirational. Contrast the
        margins elsewhere in the contract, which are floats and are compared
        with an explicit 1e-9 tolerance in control (h).
    recomputed_by_this_gate: >-
      The identity was recomputed on COMMITTED DATA, not merely reasoned
      about: `sum_d b(d) + residual = N` was evaluated cell by cell from the
      basin arrays in the raw-result.json of RUN-ECDLP-6ac801-001..005, at all
      20 committed cells. In every cell the identity closed with the residual
      non-negative, and min_b over the DPs was at least 1, so no committed
      cell carries an empty basin. Per-cell figures are withheld under this
      record's leak discipline; the finding is that the identity closed
      everywhere it could be evaluated.
    an_honest_limit_on_that_recomputation:
      what: >-
        The v1 runs record the basin array and N but do NOT record cycle_mass
        and capped_mass as separate fields, so this gate could recompute
        `sum_d b(d) + residual = N` and confirm the residual is non-negative,
        but could NOT split the residual into its two named components on
        committed data. The SPLIT is verified structurally from the code, not
        empirically from a run.
      why_it_does_not_weaken_the_finding: >-
        v3 recognises exactly this gap and closes it prospectively:
        `required_artifacts` line 1752 makes cycle_mass, capped_mass,
        capped_walks, residual_fraction and the recorded exact satisfaction of
        the identity REQUIRED per cell of BOTH readings. So the component
        split becomes checkable for the first time under v3, which is the
        right response to the limit rather than an evasion of it.
      status_of_the_claim: >-
        The two-component split is READ (from code structure), not RECOMPUTED
        (from committed run data). Recorded as such rather than presented as
        an empirical verification it is not.
    both_readings_must_report_it: >-
      CONFIRMED. `required_artifacts` line 1752 says "per cell of BOTH
      readings", so the production reading and the blind Stage A'' reading are
      each bound. A one-sided report does not satisfy it.
    b_of_d_at_least_one: >-
      CONFIRMED as stated in v3 `controls` item (o1) and as structurally true:
      a DP is a DP because some point's walk terminated there, and that point
      is in `ok`, so it is counted into that DP's bin. A zero bin for a
      recorded DP is unreachable on a correct implementation -- which is why
      (o1) is correctly labelled a structural self-check and not a control.
    d2_gone_not_restated: >-
      CONFIRMED by a sweep for the two-term form. The false exhaustive
      assertion `sum_d b(d) = N` does not survive anywhere in v3 as an
      operative statement. Where the two-term form appears at all, it appears
      inside v3's own account of what D2 was and why the assertion was wrong.
      It is not restated in `definitions`, in `controls`, in `metrics` or in
      `invalidation_rules`.
    finding: >-
      The three-term identity is TRUE of the implementation, its classes are
      disjoint and exhaustive, and its exactness is real integer exactness.
      This is the blocking defect D2's substantive repair and it is sound.

