          a fresh label; COND-3 (line 128) controls (e) SEED-COUNT PARITY and
          the seed set; COND-4 (line 145) blind_rederivation `frozen: true` and
          its appended sub-key. The amendment's blocks carry `id:` values that
          do not match: its `cond_2` (line 120, id COND-2) states the
          BLIND_REDERIVATION condition, which is the source's COND-4; its
          `cond_3` (line 145, id COND-3) states the SUCCESS_CRITERION
          condition, which is the source's COND-2; its `cond_4` (line 171, id
          COND-4) states the SEED-COUNT condition, which is the source's
          COND-3. Only COND-1 is correctly numbered -- and it is the only one
          of the four that carries a `condition_quoted_from` pointer back to
          the source, so the pointer that would have caught the permutation is
          present exactly where the permutation does not occur.
        why_it_matters: >-
          A downstream reader who checks "was CR-1 COND-3 discharged?" against
          the amendment is directed to the wrong condition. The permutation is
          silent: each block's own content is internally coherent, so nothing
          reads as broken until the two documents are laid side by side, which
          is what this gate did.
        what_is_NOT_wrong: >-
          THE SUBSTANCE. All four conditions ARE discharged, and this gate
          verified each on its merits independently of its label. The defect
          is in the labels, not in the compliance.
      - id: XR-2
        severity: BLOCKING (see rationale in the decision record)
        where: >-
          experiments/EXP-ECDLP-6ac801/amendments/v2_to_v3.yaml line 1058 versus
          experiments/EXP-ECDLP-6ac801/specification.v3.yaml lines 1129 and 2057
        what: >-
          THE TWO NORMATIVE DOCUMENTS CONTRADICT EACH OTHER ON WHICH CONDITION
          PINS THE SEED SUBGROUP, quoting the SAME phrase and attributing it to
          two different conditions. The amendment at line 1058 says
          "CR-1 COND-3 pins 'seeds 1..5 as the subgroup serving the
          reproduction control'" -- which is correct against
          DEC-20260907-b6bcf4 line 128. v3 at line 2057 says "CR-1 COND-4 pins
          'seeds 1..5 as the subgroup serving the reproduction control'" --
          the same quoted phrase, a different condition id. v3 line 1129
          likewise attributes the un-edited control (e) to "CR-1 COND-4", and
          v3 lines 1418, 1427, 1461 and 2121 attribute metrics.primary to
          "CR-1 COND-3", which is the source's COND-2.
        why_it_matters: >-
          This is not the same defect as XR-1. XR-1 is one document numbering
          its own blocks wrongly; XR-2 is the two normative documents of one
          contract giving DIFFERENT answers to the same question, with the same
          words quoted on both sides. A gate or executor resolving "which
          condition governs the seed subgroup" gets a different answer
          depending on which of the contract's two documents it opens.
        correct_attribution: >-
          The seed subgroup is pinned by DEC-20260907-b6bcf4 COND-3
          (lines 128-143). metrics.primary and success_criterion are pinned by
          COND-2 (lines 111-127). blind_rederivation is pinned by COND-4
          (lines 145-165).
      - id: XR-3
        severity: minor, non-blocking
        where: 'experiments/EXP-ECDLP-6ac801/specification.v3.yaml line 1212'
        what: >-
          Control (h) defers the tie-break key stream question to "(o)": "It
          does NOT apply to the blind reading, whose key stream necessarily
          differs (see (o) and `definitions` item on the tie-break)." Item (o)
          is STRUCTURAL SELF-CHECKS and contains (o1) basin-mass accounting,
          (o2) exact-coverage nesting and (o3) margin nesting. None of the
          three concerns the tie-break key stream.
        why_it_matters: >-
          The pointer is dangling. The second half of the same parenthesis
          ("`definitions` item on the tie-break") is correct and does carry the
          content, so a reader recovers -- but only by ignoring the first
          pointer. This is the same class of hazard as XR-1 and XR-2 and is
          listed with them rather than separately.

  # ===================================================================
  # J4 -- D3 MECHANISM AND PACKET SUFFICIENCY
  # ===================================================================
  J4_allowlist_mechanism:
    status: PASS
    verdict_in_one_line: >-
      The allowlist works as a mechanism: every hash matches, it is sufficient,
      it is leak-free, and its discipline is self-detectable from the packet's
      own text.
    hash_verification:
      method: >-
        Recomputed the sha256 of every file MANIFEST.yaml lists, against the
        worktree, and cross-checked each against the TASK-20260907-6077f2
        snapshot receipt.
      mismatches: []
      result: >-
        ZERO MISMATCHES. Every listed file's recorded hash equals its actual
        hash, and equals the snapshot receipt's hash for the same path. The
        manifest binds the bytes it claims to bind.
    sufficiency:
      answer: SUFFICIENT
      how_checked: >-
        Read deliverables.md field by field and asked, for each demanded
        output, whether the allowlisted files contain everything needed to
        produce it: the instrument definition, the walk and DP rules, the cap
        convention with its multiplier and rounding, T and T_sel at both
        scales, the weight formula, the selection rule, the tie-break, the seed
        policy and seed count, the a-grid, and the output format. Each was
        located inside the allowlist.
      the_cap_is_the_decisive_case: >-
        Sufficiency turns on the cap, because the cap is exactly what v1 and v2
        left underspecified and what forced the original re-deriver outside the
        packet. quantity.md now states the multiplier, the rounding and the
        charging rule explicitly, so the re-deriver no longer has to open the
        source to learn a convention. This gate confirmed derivability
        independently at J1 by computing the W/cap table from contract text
        alone.
      residual_risk_stated: >-
        Sufficiency is judged by this gate's reading, not demonstrated by an
        actual re-derivation, which no one has yet performed under this packet.
        A packet is only proven sufficient when a re-deriver completes without
        reaching outside it. Recorded as a judgement, not as a measurement.
    leak_freedom:
      answer: LEAK-FREE
      how_checked: >-
        Read every allowlisted file in full, then swept them programmatically
        for numeric patterns that could encode a margin, a share, a coverage or
        a pass-count. No allowed file states a prior, an expectation, a
        verdict, a margin, a pass-count or a numeric value of the quantity
        under test at any cell.
      the_one_disclosed_inclusion:
        what: >-
          The packet tells the re-deriver that a = 1/4 at T_sel = T/2, r = 2,
          N = 2^24 is G3-INFEASIBLE per EV-ECDLP-60e266, and that the a = 1/4
          cell must be reported first.
        is_it_a_leak: >-
          NO, and this gate agrees with the packet's own reasoning. a = 1/4 is
          the batch's KNOWN-FALSE OBJECT. docs/inventor-protocol.md "controls
          before belief" requires the identical measurement to be run against
          an object whose answer is known, and a re-deriver cannot run that
          control without being told which object it is. Withholding it would
          not be blindness; it would be removing the control. The inclusion is
          bounded to a = 1/4, is disclosed in the packet's own text rather than
          buried, and says nothing about a in {1/16, 1/8, 3/16}, which are the
          cells the batch exists to resolve.
        one_qualification: >-
          See J5 finding CF-2: the packet and v3 both describe this anchor as
          "established" / "independently established", and the underlying
          evidence record carries `strength: preliminary`. The inclusion is
          legitimate; its STRENGTH is overstated.
      does_any_allowed_file_point_outward:
        answer: 'NO -- no allowed file points outward'
        how_checked: >-
          Followed every path, record id and citation appearing in the
          allowlisted files. Citations that name outside records (for example
          the a = 1/4 anchor) appear as attributions for a stated fact, never
          as instructions to go and read them; the packet states what the
          re-deriver needs inline rather than by reference. This is the
          property a denylist cannot have and is the substance of the D3
          repair.
    self_detectability:
      answer: SELF-DETECTABLE
      how_checked: >-
        Read the packet as a re-deriver who has opened no decision record. The
        packet states in its own text that the list is CLOSED and POSITIVE,
        that opening anything not on it is a violation, that the re-deriver
        must attest to exactly which files it read before sealing, and that the
        seal must predate any packet-external read. prohibitions.md restates
        this as an operational checklist. A re-deriver can therefore tell it is
        under an allowlist, and can tell whether it has broken it, without
        reading DEC-20260907-4e34c5, DEC-20260907-b6bcf4 or any ledger record.
      why_this_is_the_property_that_matters: >-
        A blindness rule a blinded agent cannot check is not a rule, it is a
        hope. The predecessor's denylist failed precisely here: it enumerated
        forbidden paths, so a path nobody thought of was permitted by default,
        and the re-deriver had no way to notice. Inverting the default is what
        fixes it, and the inversion is legible from inside.
    finding: >-
      D3's mechanism is sound. The allowlist is the right shape of fix, not
      merely a longer list, and the three properties that decide whether an
      allowlist works -- sufficiency, leak-freedom, self-detectability -- all
      hold on the committed bytes.

  # ===================================================================
  # THIS LANE'S OWN LEAK DISCIPLINE
  # ===================================================================
  lane_leak_audit:
    status: PASS
    why_it_is_here: >-
      Not a numbered joint, but the specific failure the predecessor gate
      committed (D3, DEC-20260907-4e34c5): the leak was in five places in a
      committed queue and in two immutable commit messages. A lane that repairs
      a leak while leaking is not repaired.
    what_was_audited:
      - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-48ef8b/dispatch_queue.json
      - 'every task card under BATCH-48ef8b/tasks/'
      - 'every handoff of this batch under ledger/handoffs/'
      - ledger/decisions/DEC-20260907-52f2a0.yaml
      - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-48ef8b/archives/TASK-20260907-6077f2/snapshot-receipt.json
      - 'commit messages of 176b7d93e, c94a71b47, 58d256293 and the lane-open commit b9be2983d'
    result: >-
      CLEAN. No prior, no expectation, no verdict, no margin, no pass-count and
      no numeric value of the quantity under test appears in any of them. The
      commit messages in particular are descriptive of WHAT was archived and
      say nothing about what it shows -- the specific discipline the
      predecessor broke, and the one that cannot be repaired afterwards because
      a commit message is immutable.
      Contract facts that ARE stated (the a-grid, T, T_sel, W, the seed count,
      task budgets) are inputs a re-deriver reads from the contract anyway and
      are correctly not treated as leaks.
    one_residual_observation:
      what: >-
        The sealed prior's PATH is named in the task card, the handoff and the
        queue's leak_discipline text.
      is_it_a_leak: >-
        NO. A path is not a content. Naming it is what makes the constraint
        checkable -- a reader can verify the prior exists and was committed in
        advance, which is what AGENTS.md "Review architecture" requires of a
        pre-recorded prior. The content stays sealed, and the packet's
        allowlist excludes the path so the re-deriver never sees it.
      recorded_because: >-
        It is the one place where this lane's own text touches the prior at
        all, and a gate that swept for leaks should say what it found near one
        rather than only what it found in one.

  # ===================================================================
  # J5 -- CONTROL FALSIFIABILITY, ITEM BY ITEM
  # ===================================================================
  J5_control_falsifiability:
    status: PASS_ON_LABELS_WITH_TWO_SUBSTANTIVE_FINDINGS
    method: >-
      For each of the fifteen declared items (a)-(o) of
      specification.v3.yaml `controls`, this gate constructed -- or refused to
      construct -- a state of the world in which the item fires on a CORRECT
      implementation. The contract's own labels were NOT accepted as given;
      each was re-derived. Reported per item, never in aggregate.
    items:
      - id: '(a) BLIND RE-DERIVATION CONTROL'
        contract_label: control
        gate_label: control
        agree: true
        failing_world_constructed: >-
          A run set completes and a verdict is reported with no sealed Stage
          A'' artifact, or with a seal whose timestamp postdates a
          packet-external read. Both are procedural states reachable on a
          perfectly correct implementation of the mathematics -- the arithmetic
          cannot prevent them -- and v1's own history contains the near miss
          that motivated the control.
      - id: '(b) a = 1/4 REPLICATION CONTROL'
        contract_label: control
        gate_label: control
        agree: true
        failing_world_constructed: >-
          The instrument has drifted such that a known-infeasible cell scores
          feasible: a changed seed policy, a changed coverage universe, a cap
          defect, a double-counted DP. Nothing in the code or in arithmetic
          forces this cell's outcome; it is an empirical property of the basin
          size distribution at that a, anchored externally. So it can fire.
        see_also: 'finding CF-3 (the anchor is mis-scoped, inherited from the approved v2)'
      - id: '(c) EXACT-COVERAGE NON-EXCEEDANCE'
        contract_label: structural self-check
        gate_label: structural self-check
        agree: true
        refused_to_construct: >-
          NO failing world exists on a correct implementation. share_top(T_sel)
          is a prefix sum of a descending sort of non-negative basin sizes over
          N, so it cannot exceed 1 nor exceed share_top(T) for T > T_sel; and
          Sel_static is a set of T DPs whose exact coverage cannot exceed the T
          largest basins. All three clauses hold by arithmetic. It fires only
          on a defect, which makes it a self-check, not a control.
        note: >-
          v3 is CORRECT to carry (c) verbatim from the approved v2 (CR-1
          forbids editing it) while re-describing it honestly in (o2). That is
          the right way to fix an inherited mislabel without touching a frozen
          field, and this gate endorses the pattern.
      - id: '(d) DEFINITIONAL IDENTITY WITH THE v2 G3 RULE'
        contract_label: control
        gate_label: control
        agree: true
        failing_world_constructed: >-
          Contract text and production source disagree. This is not
          hypothetical for this experiment: D1 and D2 were BOTH found by
          exactly this comparison against a contract asserting its citations
          were accurate. The control has fired before, on this experiment.
      - id: '(e) SEED-COUNT PARITY'
        contract_label: control
        gate_label: control
        agree: true
        failing_world_constructed: >-
          A truncated batch, a silently dropped shard, or a control arm run on
          a different seed set from the treatment arm. A property of the
          execution plan, not of the arithmetic, so reachable on a correct
          implementation.
      - id: '(f) SELECTION-FORMULA IDENTITY'
        contract_label: control
        gate_label: control
        agree: true
        failing_world_constructed: >-
          Exactly the world v1 was in: a re-deriver adopts an oracle true-size
          selection or another defensible-but-different reading of "the
          published weight" instead of weight_d = S_d + 4*W*h_d. This gate
          confirmed the stated formula against instrument.py `weights`
          (lines 445-446) and it is what production computes, so a divergence
          is attributable rather than ambiguous.
      - id: '(g) SEED-COUNT PARITY EXTENSION'
        contract_label: control
        gate_label: control
        agree: true
        failing_world_constructed: >-
          An analysis composites the 25-seed reading and the seeds 1..5
          subgroup reading into one number, or omits the subgroup reading, or
          runs fewer than 25 seeds at a cell whose verdict is reported. All
          three are ordinary analysis mistakes on a correct measurement.
      - id: '(h) CROSS-SCALE REPRODUCTION CONTROL'
        contract_label: control
        gate_label: control
        agree: true
        failing_world_constructed: >-
          The new pipeline is not the old pipeline: a changed import, seed
          stream, cap, pool batch size or tie-break key. The target is known
          achievable, so a nonzero residual is a real signal rather than a
          tolerance artifact.
        checked_separately: >-
          That it re-scores nothing. CONFIRMED: (h) reads the committed
          RUN-ECDLP-6ac801-001..005 summaries as a REFERENCE and compares fresh
          production output against them. It writes nothing under runs/ and
          assigns the committed runs no new verdict, so it does not violate the
          approved contract's `invalidation_rules` item 7.
        see_also: 'finding XR-3 (dangling pointer to (o) at line 1212)'
      - id: '(i) NULL-ORACLE-RAND (UNIFORM) -- THE GATING NULL'
        contract_label: 'control (null object, conclusion KNOWN FALSE)'
        gate_label: 'control (null object)'
        agree: true
        the_structural_argument_examined: >-
          THE CONTRACT SAYS THIS NULL'S NEGATIVITY RESTS ON A STRUCTURAL
          ARGUMENT, AND THE TASK ASKED THIS GATE TO CHECK THE ARGUMENT RATHER
          THAN THE LABEL. The argument is: a uniformly drawn T_sel-subset of
          DPs has expected coverage equal to the mean basin size times T_sel,
          whereas the weight-selected static table concentrates on large
          basins, so the null margin should be negative. This gate's assessment
          is that the argument is SOUND AS AN EXPECTATION but is NOT an
          identity -- and that is exactly what makes (i) a control rather than
          a self-check. Nothing in the arithmetic forces a uniform draw's
          coverage below the static table's at every cell: the gap depends on
          how heavy the basin-size tail is at that a, which is an empirical
          property of the instrument, not a theorem. A world in which it fires
          is concrete: cov_static computed over the wrong universe; a "uniform"
          draw that is silently size- or weight-biased; a coverage read-off
          that double-counts a DP; or weight_d ceasing to track basin size at
          small a. Because (i) is shape-matched to the real measurement,
          failing it indicts the real measurement, which is the property D7
          asked for and which NULL-RANDSEL does not have.
        verdict_on_the_argument: >-
          The argument is correctly characterised BY THE CONTRACT as structural
          rather than arithmetic, and the contract says in its own text that
          structural arguments can be wrong. That is the honest framing. This
          gate finds no error in it.
      - id: '(j) NULL-ORACLE-RAND (SIZE-BIASED)'
        contract_label: diagnostic
        gate_label: diagnostic
        agree: true
        could_it_leak_into_a_verdict: >-
          NO, on the committed text. (j) is defined as the size-biased
          counterpart of (i), and the GAP between them is described as
          interpretive -- it measures how much of the oracle's advantage comes
          from size-biasing. This gate traced every mention of (j) through
          `success_criterion`, `falsification_criterion`,
          `invalidation_rules` and `interpretation`: no verdict, no criterion
          and no invalidation rule depends on it. The fencing holds.
        one_exception_flagged: 'see finding CF-1 -- required_artifacts line 1754 demands a FIRED/NOT-FIRED status for it'
      - id: '(k) NULL-RANDSEL'
        contract_label: 'control, retained, NON-GATING, low power DISCLOSED'
        gate_label: 'control, low power, correctly disclosed'
        agree: true
        failing_world_constructed: >-
          A gross defect only. Its arm ranges over the pool while the real arm
          ranges over the whole partition (D7), so its threshold sits far from
          its typical value. It CAN fire, so it is not vacuous, but only on
          something large. The contract states this power limit in its own text
          rather than leaving a reviewer to discover it, which is the correct
          handling of a weak control -- demote and disclose, rather than drop
          or over-claim.
      - id: '(l) DECAY-A'
        contract_label: 'control (declared decay parameter: a)'
        gate_label: 'control, but clause (i) is mis-calibrated'
        agree: partially
        clause_i_failing_world: >-
          EXISTS. Each a is a different instrument with its own W, DP rate, cap
          and basin partition, so no arithmetic relates the four means. A
          correct implementation can produce a non-monotone sequence. Clause
          (i) is therefore falsifiable and is NOT the tautology the previous
          gate correctly removed from DECAY-TSEL.
        clause_iii_failing_world: >-
          EXISTS, and this is the load-bearing one, because its reference is
          external to everything the batch computes -- a self-consistent but
          wrong implementation does not pass it automatically.
        the_anchor_verified: >-
          THE ANCHOR EXISTS AND SAYS SUBSTANTIALLY WHAT IS CLAIMED.
          ledger/evidence/EV-ECDLP-60e266.yaml records a = 1/4 G3-infeasibility
          on exactly enumerated basins, with the per-seed comparison all of one
          sign, and a red-team derivation note (lines 145-164) giving the
          disjointness argument for why a T/2-entry table cannot reach
          STATIC(T) on those instances. So clause (iii) has a real external
          anchor and is not self-referential.
        see_also: 'findings CF-2 (anchor strength overstated) and CF-4 (clause (i) calibration)'
      - id: '(m) DECAY-TSEL'
        contract_label: 'control, weaker than (l), weakness DISCLOSED'
        gate_label: 'control, low power, correctly disclosed'
        agree: true
        failing_world_constructed: >-
          Clause (i) fires if a T/8-entry oracle table already matches
          STATIC(T)'s coverage -- i.e. the comparison is an everything-passes
          artifact rather than a measurement of stored-advice efficiency. This
          gate re-checked the independence claim against the code rather than
          carrying it on trust: cov_static is computed from the T
          weight-selected pool entries and does not depend on T_sel
          (run_stageb.py line 96 selects T, never T_sel), and share_top(T/8) is
          a strict prefix of share_top(T/2). Nothing forces the inequality, so
          the clause is not an identity.
        the_removed_tautology_stays_removed: >-
          CONFIRMED. margin(T/2) > margin(T/4) > margin(T/8) holds by
          arithmetic on every correct implementation. It appears in v3 ONLY
          inside item (o3), labelled a structural self-check. The previous
          gate's correction is respected rather than quietly reversed, which
          this gate specifically checked for.
      - id: '(n) NULL-SHUF'
        contract_label: 'diagnostic, explicitly NOT a G3 null'
        gate_label: 'diagnostic, correctly declared unusable as a null'
        agree: true
        why_the_declaration_is_right: >-
          Permuting basin sizes across the pool's DPs while holding the size
          multiset and the weights fixed makes cov_static COLLAPSE, which makes
          G3 pass MORE easily. A null that fires in the DIRECTION OF THE CLAIM
          is worse than no null at all, because it manufactures corroboration.
          v3 keeps it, states plainly why it cannot serve as a null, and fences
          it from every verdict. Declaring a broken control broken, in the
          contract, is better practice than deleting it and leaving no record
          that it was considered.
        could_it_leak_into_a_verdict: >-
          NO on the committed text; same trace as (j). Subject to finding CF-1.
      - id: '(o) STRUCTURAL SELF-CHECKS (o1), (o2), (o3)'
        contract_label: structural self-checks
        gate_label: structural self-checks
        agree: true
        refused_to_construct: >-
          (o1) BASIN-MASS ACCOUNTING: cannot fail on a correct implementation
          -- the three classes are disjoint and exhaustive over the N points by
          construction (verified at J2), and b(d) >= 1 holds because a DP is a
          DP by virtue of some point terminating there. (o2) EXACT-COVERAGE
          NESTING: cannot fail -- prefix sums of a descending sort are
          non-decreasing in their length. (o3) MARGIN NESTING IN T_sel: cannot
          fail -- it is (o2) minus a quantity independent of T_sel.
        why_labelling_them_correctly_matters: >-
          A self-check that passes tells a reader "no defect of this kind",
          which is worth having. A self-check MISCOUNTED as a control inflates
          the apparent control coverage of the batch: eleven controls plus four
          checks that cannot fail is a materially different evidential posture
          from fifteen controls. v3 gets the labels right. It gets the COUNT
          wrong -- see finding CF-5.
    substantive_findings:
      - id: CF-1
        severity: BLOCKING
        title: 'required_artifacts demands a firing status for items with no firing condition'
        where: 'specification.v3.yaml line 1754'
        what: >-
          The clause reads: "the control report: for every declared control
          (a)-(o), per cell, FIRED or NOT FIRED, with the quantity and cell it
          was read from; an absent entry counts as NOT RUN." The range (a)-(o)
          spans all fifteen declared items. But the SAME contract declares that
          six of those fifteen are not controls with a firing condition in that
          sense: (c) and (o1)-(o3) are structural self-checks that "cannot
          fail" on a correct implementation, and (j) and (n) are diagnostics
          "explicitly fenced off from every verdict".
        why_it_is_operative_and_not_cosmetic: >-
          It leaves an executor with no correct action for six of the fifteen
          items. Reporting NOT FIRED per cell for a diagnostic asserts a firing
          status for an item the contract says gates nothing -- and puts (j)
          and (n) into the control report, which is precisely the surface
          through which a fenced diagnostic can start reading as a control.
          Omitting them makes the entry ABSENT, and the same clause converts an
          absent entry into NOT RUN, i.e. a recorded negative against items
          that were never runnable in that sense. Both readings are wrong and
          the contract offers no third. This is a required-artifact clause, so
          it binds execution rather than merely describing it.
        remedy: >-
          Narrow the range to the eleven controls -- (a), (b), (d), (e), (f),
          (g), (h), (i), (k), (l), (m) -- and require the self-checks and
          diagnostics under a SEPARATE artifact entry with its own semantics
          (self-checks: HELD or VIOLATED, a violation stopping the batch per
          (o); diagnostics: reported value only, with no firing status). This
          is an edit to a v3-appended clause, so it touches nothing frozen.
      - id: CF-2
        severity: BLOCKING
        title: 'the external anchor''s strength is overstated in v3-appended text'
        where: 'specification.v3.yaml line 1298 (control (l) clause (iii)); also line 1030'
        what: >-
          v3 describes the anchor as "EV-ECDLP-60e266's independently
          established a = 1/4 G3-infeasibility" and, in the derivation packet
          disclosure, as "ESTABLISHED G3-INFEASIBLE".
          ledger/evidence/EV-ECDLP-60e266.yaml records `strength: preliminary`
          (line 87), and its own `strength_note` (lines 88-97) says it rests on
          ONE execution batch and states that NO INDEPENDENT IMPLEMENTATION
          EXISTS, which is the reason it is preliminary.
        why_it_matters_here_specifically: >-
          v3 itself designates clause (iii) as THE ONLY clause anchored outside
          this batch and as carrying MOST of the artifact-detection load. The
          contract's own account of its evidential weight therefore rests on
          the anchor, and the word "independently" asserts of the anchor the
          exact property its evidence record says it lacks. This is a scope-
          honesty defect under AGENTS.md core rule 4, in the one place the
          contract can least afford it.
        what_is_NOT_wrong: >-
          The anchor is real, is committed, is external to this batch, and
          supports the direction claimed. Nothing about the control's DESIGN is
          affected; it remains the load-bearing detector. Only the strength
          adjective is wrong.
        remedy: >-
          Replace "independently established" with a formulation that carries
          the evidence record's own strength -- e.g. "EV-ECDLP-60e266's
          a = 1/4 G3-infeasibility (`strength: preliminary`; one execution
          batch, no independent implementation)". This is v3-appended text and
          is freely editable.
      - id: CF-3
        severity: 'NON-BLOCKING for v3 -- INHERITED FROM THE APPROVED v2; reported as a program finding'
        title: 'the a = 1/4 anchor is mis-scoped, and the approved v2 contradicts itself about it'
        where: >-
          specification.v2.yaml line 537 versus line 584; reproduced
          byte-identically at specification.v3.yaml lines 1135-1136 and 1423
        what: >-
          The approved v2's control (b) says a = 1/4 at N = 2^24 "is ALREADY
          established as G3-INFEASIBLE (G3 FAIL 10/10 seeds, EV-ECDLP-60e266)",
          attributing all ten seeds to N = 2^24. The same document's
          `metrics.primary` says the control is "compared against
          EV-ECDLP-60e266's 5/5 FAIL at 2^24". Both cannot be right, and the
          evidence record settles it: EV-ECDLP-60e266 lines 150-155 show five
          seeds at N = 2^24 (RUN-013..017 of EXP-ECDLP-612fb1) and five seeds
          at N = 2^20 (RUN-001..005), which is where "10/10" comes from. The
          ten seeds span TWO SCALES; only five are at N = 2^24. metrics.primary
          is correct and control (b) is not.
        why_v3_is_not_at_fault: >-
          Control (b) and metrics.primary are two of the blocks CR-1 COND-2 and
          COND-3 require to be reproduced BYTE-IDENTICALLY from the approved
          v2. v3 could not have corrected either without violating the very
          conditions it was gated against. It reproduced them faithfully,
          including the contradiction. That is the correct behaviour and this
          gate does not hold it against the amendment.
        why_the_program_should_still_act: >-
          The approved v2 is `execution_authorized` TODAY. An executor running
          under it reads control (b) as establishing a ten-seed N = 2^24
          anchor, and would overstate the reproduction control's external
          support by a factor of two in seed count while silently attributing
          N = 2^20 seeds to N = 2^24. The remedy is a superseding record, not
          an edit -- this gate names it and does not perform it.
      - id: CF-4
        severity: BLOCKING
        title: 'DECAY-A clause (i) routes a severe falsification off a zero-tolerance point comparison'
        where: 'specification.v3.yaml lines 1287-1289, with falsification_criterion F6 at lines 1737-1741'
        what: >-
          Clause (i) requires the mean margin to be STRICTLY DECREASING across
          the four a-values at each scale and states that "A SINGLE
          non-monotone step fires it". Firing it triggers F6 (DECAY FAILS),
          which the contract says "falsifies the batch's claim to be measuring
          stored-advice efficiency at all rather than an artifact of the
          pipeline". No tolerance, no interval and no minimum step size is
          stated for the comparison. Meanwhile clause (ii) -- the paired
          per-seed differences reported WITH percentile intervals, the one
          construct in the item that could bound a false-positive rate -- is
          declared CONTEXT ONLY and "BINDS NOTHING".
        why_it_is_a_defect_and_not_conservatism: >-
          Adjacent a-values sit on a grid fine enough that two neighbouring
          means can be close, and each mean is an average over 25 finite
          samples. A strict inequality on such a pair, with zero tolerance, can
          be violated by sampling noise on a perfectly correct implementation
          -- and the consequence is not a flag but the batch's most severe
          self-falsification. The contract has the machinery to calibrate this
          (clause (ii)'s intervals) and explicitly declines to use it, so the
          detector with the stated power is non-binding and the binding one has
          no stated power. That inverts the contract's own careful practice
          elsewhere of disclosing each control's power.
        it_is_still_falsifiable: >-
          YES, and that is not in question -- clause (i) is a genuine control
          with a reachable failing world, as recorded above. The defect is
          calibration, not vacuity. A control that is too easy to fire and a
          control that cannot fire are different defects; this is the first.
        remedy: >-
          Either (1) state a tolerance or a minimum step for the strict
          decrease, pre-registered rather than chosen after seeing the data; or
          (2) make clause (i)'s F6 routing conditional on clause (ii)'s
          interval excluding the non-monotone direction, which uses the
          machinery already present; or (3) downgrade a single non-monotone
          step to a REPORTED FLAG requiring review, reserving F6 for a
          non-monotonicity that survives the interval test. Any of the three
          suffices; the choice is the author's. What is not acceptable is
          leaving a zero-tolerance point comparison as the trigger for the
          batch's strongest falsification while the interval estimator that
          could calibrate it is declared to bind nothing.
      - id: CF-5
        severity: BLOCKING
        title: 'the falsifiability summary does not partition its own item set'
        where: 'specification.v3.yaml lines 1378-1385'
        what: >-
          The summary opens "Of the fifteen declared items:" and then gives
          ELEVEN controls (enumerated: (a), (b), (d), (e), (f), (g), (h), (i),
          (k), (l), (m) -- this gate counted them and there are indeed eleven),
          THREE structural self-checks ("(c) ... and (o1)-(o3)"), and TWO
          diagnostics ((j) and (n)). 11 + 3 + 2 = 16, against fifteen declared
          items. The self-check count is the inconsistent term: by top-level
          letter it is TWO ((c) and (o)); by sub-item it is FOUR ((c), (o1),
          (o2), (o3)). It is three under neither reading.
        why_it_is_not_a_typo_to_wave_through: >-
          This paragraph labels itself "REQUIRED READING FOR THE GATE" and is
          the contract's single authoritative statement of which of its items
          are controls and which are not. A gate, an executor or a reviewer
          that wants to know the batch's control coverage reads exactly this
          sentence, and the sentence does not partition the set it claims to
          partition. Combined with CF-1 (which ranges over the same fifteen
          items with the wrong semantics) and with the letter-offset defect
          (finding LO-1, where the amendment's table has FOURTEEN items and
          claims fifteen in its own summary), the contract's two normative
          documents give three different accounts of how many controls it has.
        remedy: >-
          State the partition once, by top-level letter, and make it add up:
          eleven controls, two structural self-check items ((c) and (o), the
          latter comprising (o1)-(o3)), two diagnostics, fifteen total. Then
          make CF-1's required-artifact range and the amendment's table agree
          with it.

  # ===================================================================
  # THE AUTHOR'S SELF-REPORTED DEFECT (joints J3 and J5)
  # ===================================================================
  letter_offset_ruling:
    id: LO-1
    severity: BLOCKING
    ruling: >-
      NOT ACCEPTABLE AS A RECORDED REMEDY. The contract must not be frozen with
      it outstanding.
    what_the_defect_is: >-
      The amendment's `control_falsifiability.items` (v2_to_v3.yaml lines
      802-857) enumerates FOURTEEN items, (a) through (n). The specification's
      `controls` enumerates FIFTEEN, (a) through (o). The amendment's table
      omits the specification's (j) NULL-ORACLE-RAND (SIZE-BIASED) diagnostic,
      so from that point every letter runs one behind: the amendment's (j)
      NULL-RANDSEL is the spec's (k); its (k) DECAY-A is the spec's (l); its
      (l) DECAY-TSEL is the spec's (m); its (m) NULL-SHUF is the spec's (n);
      its (n) BASIN-MASS ACCOUNTING is the spec's (o1). The amendment's own
      summary (lines 858-866) then says "Eleven items are controls; three are
      structural self-checks; one is a diagnostic" -- which sums to fifteen
      over a table of fourteen, and says ONE diagnostic where the
      specification says TWO.
    what_the_author_said: >-
      The author declined to fix it on the ground that the files are
      snapshot-archived with bound hashes.
    why_that_ground_does_not_hold: >-
      It confuses two different immutabilities. A COMPLETED ARCHIVE is
      immutable: TASK-20260907-6077f2's snapshot commit and its receipt cannot
      be rewritten, and this gate would refuse any proposal to rewrite them.
      But the v3 DOCUMENTS ARE NOT YET APPROVED -- they read
      `approved_by: null`, they are `execution_authorized: false`, and no run
      exists under them. A superseding revision committed as a NEW snapshot,
      leaving the old one intact and referenced, breaks nothing: the archived
      commit keeps its bytes and its hashes, and the receipt keeps describing
      what it described. That is the ordinary correction path this program
      uses for every immutable record, and it is available here at its cheapest
      possible moment -- before approval, before any run, before any evidence
      depends on the text.
    why_this_one_must_not_be_waived: >-
      Three reasons, in order of weight.
      (1) IT IS NOT ISOLATED. Had it been the only cross-reference slip, a
      recorded remedy would be defensible -- this gate would have accepted it.
      It is instead one of six independent cross-reference defects this gate
      found in the same two documents (LO-1, XR-1, XR-2, XR-3, CF-5, and the
      instrument.py line-84 slip at J1). A single stale pointer is an
      accident; six is a systematic failure of the pass that should have
      reconciled the two documents against each other, and waiving them
      individually approves the systematic failure one instance at a time.
      (2) THE DISAGREEMENT IS ABOUT THE IDENTITY OF THE CONTROLS. Controls are
      what stands between this batch and believing an artifact
      (docs/inventor-protocol.md, "controls before belief"). The two normative
      documents of one contract disagree on how many controls it has, which
      items they are, and which letters name them. A reviewer asked to confirm
      "control (l) fired" cannot resolve the reference without knowing which
      document the writer had open -- and in this contract (l) is DECAY-A in
      the specification and DECAY-TSEL in the amendment. That is a live
      mis-reading, not a hypothetical one, and it lands on the item v3 itself
      designates as carrying most of the artifact-detection load.
      (3) THE COST OF FIXING IS AT ITS MINIMUM NOW AND RISES MONOTONICALLY.
      Fixing it before approval costs one superseding snapshot. Fixing it after
      approval means amending an approved contract. Fixing it after execution
      means amending a contract that runs already depend on, with
      `invalidation_rules` item 7 forbidding re-scoring what has executed. This
      gate exists to catch defects at the moment they are cheapest, and this is
      that moment.
    what_this_gate_explicitly_does_NOT_require: >-
      It does not require editing any snapshot-archived file, and would refuse
      that remedy if offered. The archived bytes stay exactly as archived. The
      remedy is a NEW revision at a NEW snapshot, with the superseded one
      retained and cited.
    the_defensible_opposite_answer_stated_fairly: >-
      The contrary ruling is genuinely available and this gate records it
      rather than pretending it is not: none of the six cross-reference defects
      changes a formula, a threshold, a definition or a control's substance,
      and a reviewer who reads both documents in full recovers the correct
      reading every time. On that view the contract is mathematically sound and
      the defects are editorial, so approval with a recorded remedy list would
      accept a small navigational risk in exchange for not spending another
      revision cycle. This gate weighed that and rejected it, because the
      recovery it relies on requires reading both documents in full and
      noticing the disagreement -- and the first reader who did that is this
      gate, at the last checkpoint before execution. A contract whose
      correctness depends on every future reader repeating this audit is not
      the same object as a contract that is simply consistent.

  # ===================================================================
  # J6 -- AUTHORITY (including D1)
  # ===================================================================
  J6_authority:
    status: PASS
    d1_sweep:
      T_at_2pow20: 64
      T_sel_at_2pow20: 32
      checked_against: 'experiments/EXP-ECDLP-612fb1/specification.v2.yaml line 223'
      frozen_table_says: >-
        "T: nominal table size N^{1/3} rounded, i.e. 64 at 2^20, 256 at 2^24,
        1024 at 2^30". v3's appended N = 2^20 arm declares T = 64 and
        T_sel = T/2 = 32, which matches the frozen table exactly. The N = 2^24
        values (T = 256, T_sel = 128) are carried unchanged from the approved
        v2.
      W_carried_consistently: >-
        CONFIRMED. Every appearance of W in v3 -- `definitions`, the W/cap
        table, the weight formula's 4W term, the DP threshold's 1/W, and the
        cap's 8W -- is consistent with W = sqrt(a*N/T) at the frozen T. This
        gate recomputed W at all eight cells (J1) and found no cell where a
        stated W disagrees with the formula.
      stale_values_found: NONE_AS_OPERATIVE_VALUES
      sweep_detail: >-
        Swept specification.v3.yaml, amendments/v2_to_v3.yaml, this batch's
        dispatch_queue.json, every task card and every handoff for the stale
        `T = 102` and `T_sel = 51` of the refused sidecar draft. Every hit is
        inside an explicit NEGATION -- text describing what the sidecar got
        wrong and why v3 does not adopt it. Not one occurrence is an operative
        value, a definition, or a parameter a reader could act on. D1 is
        discharged, and discharged in the stronger of the two ways
        DEC-20260907-4e34c5 offered: by stating the correct value from the
        frozen table rather than by dropping the arm.
    warrant_tracing:
      - change: 'the second scale (N = 2^20 arm)'
        warrant: 'approved v2 `invalidation_rules` item 7, plus CR-1 COND-1'
        holds: true
        why: >-
          Item 7 requires a versioned protocol_amendment for a change to N, and
          this IS one. CR-1 COND-1's finding is that the approved v2 states
          NOTHING at N = 2^20 -- there is no value to contradict, only a blank
          to fill -- so the arm is additive rather than conflicting. Verified
          by reading v2's five N-frozen sites; none mentions 2^20.
      - change: 'the cap convention statement'
        warrant: 'item 7 (the G3-style criterion''s definition), and D2''s repair'
        holds: true
        why: >-
          The cap was always what the code did; v3 STATES it rather than
          changing it. Nothing about the measurement moves. This is the
          cheapest kind of amendment -- closing a derivability gap without
          touching an operative value -- and this gate confirmed at J1 that the
          stated convention is the implemented one.
      - change: 'the seed-count extension from 5 to 25'
        warrant: 'control (e)''s own stated rationale, NOT invalidation_rules item 7'
        holds: true
        why: >-
          THIS IS THE WEAK WARRANT AND THE AMENDMENT SAYS SO ITSELF rather than
          assimilating it to item 7. This gate verified the gap independently:
          item 7 enumerates the a-grid, N, r, T_sel and the feasibility
          criterion, and DOES NOT NAME THE SEED SET, so it confers no authority
          over it. The authority actually used is (e)'s own rationale -- "so
          this batch's statistical power is comparable, not thinner, than the
          batch that produced the original discrepancy" -- which 25 seeds
          satisfy a fortiori, since 25 > 5 and the seed streams are the same
          construction, so power is strictly greater and never thinner.
        this_gate_accepts_it: >-
          YES, and records why. The rationale states the property the control
          exists to protect, and the extension satisfies that property more
          strongly. Refusing it would require holding that a control's stated
          purpose cannot license a change that serves that purpose better,
          which would make (e) a bare number rather than a control with a
          reason. The reproduction subgroup (seeds 1..5, reported separately
          and never composited) preserves exact comparability with the
          committed cells, which is the thing parity was protecting. The weaker
          warrant is DISCLOSED in the amendment rather than papered over, and
          this gate treats that disclosure as the correct handling.
      - change: 'the appended blind_rederivation sub-keys'
        warrant: 'CR-1 COND-4 and the approved v2''s own precedent against itself'
        holds: true
        why: >-
          The approved v2 appended `v2_rerequirement_a_1_8` inside a block
          carrying `frozen: true`, so in this program's practice `frozen: true`
          means the existing fields are byte-identical, not that no sub-key may
          be appended. v3 appends two new sub-keys and touches none of the
          eight v1 fields; verified byte-identical at J3.
    reproduction_control_rescores_nothing: >-
      CONFIRMED, checked as a distinct question. Control (h) reads the
      committed RUN-ECDLP-6ac801-001..005 summaries as a REFERENCE for fresh
      production output. It assigns them no new verdict, writes nothing under
      experiments/EXP-ECDLP-6ac801/runs/, and does not re-score them. The
      approved contract's `invalidation_rules` item 7 prohibition on re-scoring
      executed runs is respected.
      This gate likewise wrote nothing under runs/ -- it read raw-result.json
      files to recompute the accounting identity (J2) and wrote nothing back.

  # ===================================================================
  # J7 -- SCOPE
  # ===================================================================
  J7_scope:
    status: PASS_WITH_A_RECORDED_RESERVATION
    the_question: >-
      Is any part of the wide scope added surface for no required purpose?
      RANK 1 did not require a second scale, and DEC-20260907-4e34c5 offered
      dropping the N = 2^20 arm as a COMPLETE discharge of D1.
    the_smaller_change_stated_fairly: >-
      Drop the N = 2^20 arm. D1 disappears entirely (there is no second scale
      to state T for), the run count roughly halves, the CT-2 anchoring problem
      dissolves (every cell would sit at the scale that has committed
      reference runs), and RANK 1 is still fully served. It is a real and
      cheaper option and this gate took it seriously.
    why_the_wider_scope_is_nevertheless_defensible: >-
      Three reasons.
      (1) The N = 2^20 arm is not decoration: the batch's whole question is
      where the feasibility boundary sits in a, and N-dependence of that
      boundary is a live possibility the contract's own `interpretation`
      addresses directly (a reversal at small a would be "a genuine
      N-dependence finding"). A single-scale batch cannot see it at all.
      (2) D1 is now discharged by STATING the frozen value rather than by
      avoiding the question, which is the stronger of the two discharges
      DEC-20260907-4e34c5 offered -- it leaves the program with a
      cross-checked second scale instead of a deferred one.
      (3) The marginal cost is bounded and disclosed: N = 2^20 needs 16x less
      memory than the binding scale, the control arms read off the same basin
      partition as the primary arms, and `cost_model.memory_accounting` states
      that N = 2^24 remains the binding constraint. The wide scope does not
      change what the batch can afford.
    the_reservation:
      what: >-
        The added scope is not free of evidential cost, and the cost lands in
        exactly one place: the N = 2^20 arm's control coverage. See CT-2 below.
      why_it_does_not_change_the_verdict_on_this_joint: >-
        Because the coverage gap is narrower than the contract declares (CT-2
        finding), and because the remedy is a disclosure edit rather than a
        scope reduction. If the CT-2 remedy were refused, this gate would
        prefer the smaller change.
    finding: >-
      The wider scope is justified and this gate does not require the smaller
      change. It DOES require the N = 2^20 arm's control coverage to be stated
      accurately, which it currently is not.

  # ===================================================================
  # CT-2 -- CROSS-SCALE ANCHORING AT N = 2^20
  # ===================================================================
  CT2_judgement:
    status: 'GAP IS REAL BUT NARROWER THAN DECLARED; the declaration must be corrected'
    verified_no_committed_2pow20_cells: >-
      CONFIRMED. This gate enumerated every run under
      experiments/EXP-ECDLP-6ac801/runs/ and every cell in their
      raw-result.json and summary.json. All committed cells of THIS experiment
      are at N = 2^24. EXP-ECDLP-6ac801 has never run at N = 2^20, so control
      (h) genuinely cannot be anchored there, and DEC-20260907-52f2a0's CT-2 is
      correct that the reproduction anchor must sit at N = 2^24.
    what_v3_says: >-
      specification.v3.yaml lines 1216-1217: "AT N = 2^20 THERE IS NO REFERENCE
      -- this experiment has never run there". The N = 2^20 comparison is
      declared explicitly NOT a control.
    what_this_gate_found: >-
      The statement is TRUE as written of THIS EXPERIMENT, and the explicit
      non-control declaration is the right call for control (h). But read as a
      statement about the N = 2^20 arm's control coverage, it understates what
      is available -- and it understates it in a way that hides an anchor the
      contract is already relying on elsewhere.
      ledger/evidence/EV-ECDLP-60e266.yaml (lines 150-155) records five seeds
      at N = 2^20 -- RUN-001..005 of EXP-ECDLP-612fb1, the pinned instrument --
      whose a = 1/4 comparison runs in the same direction as the five seeds at
      N = 2^24, on exactly enumerated basins. That is an EXTERNAL reference at
      N = 2^20, in the same evidence record v3 already cites for control (l)
      clause (iii), on the same pinned instrument.
    the_consequence_that_matters: >-
      Control (l) clause (iii) requires the a = 1/4 anchor to hold AT EACH
      SCALE, and v3 nowhere records that its N = 2^20 half has an external
      reference too. So the contract simultaneously (a) tells a reader there is
      no reference at N = 2^20 and (b) imposes an externally anchored clause
      there. Both are defensible in isolation; together they leave the N = 2^20
      arm looking less controlled than it actually is, and leave the reader no
      way to check clause (iii) at that scale against anything.
    coverage_assessment_of_the_2pow20_arm:
      controls_that_DO_apply_at_2pow20: >-
        (a) blind re-derivation, (b) the a = 1/4 replication control, (d)
        definitional identity, (e) and (g) seed-count parity, (f) selection-
        formula identity, (i) the gating null, (k) NULL-RANDSEL, (l) DECAY-A
        (both binding clauses, which the contract requires "at each N
        separately"), (m) DECAY-TSEL. Ten of the eleven controls apply at
        N = 2^20.
      the_one_that_does_not: >-
        (h) cross-scale reproduction -- and only because this experiment has no
        committed cells there. That is a genuine and unavoidable gap, correctly
        identified by CT-2.
      judgement: >-
        The N = 2^20 arm is ADEQUATELY CONTROLLED for what it is asked to do,
        and is NOT entering with an undeclared gap in the sense that would
        block approval. Ten of eleven controls apply; the missing one is
        pipeline-identity reproduction, whose absence at that scale means the
        arm cannot self-certify that its pipeline matches a previously
        committed one -- a real limitation, correctly declared. What is wrong
        is not the coverage but the CHARACTERISATION of it, in both directions
        at once: the contract overstates the reference vacuum and understates
        the anchor it already relies on.
    required_correction: >-
      State, in the N = 2^20 arm's own text, (1) that control (h) is
      unavailable at that scale and why, which v3 already does; and (2) that
      control (l) clause (iii)'s a = 1/4 anchor at N = 2^20 rests on
      EV-ECDLP-60e266's five N = 2^20 seeds on the pinned instrument
      EXP-ECDLP-612fb1, carrying that record's own `strength: preliminary`
      (per finding CF-2). Both are additive disclosures to v3-appended text.

  # ===================================================================
  # PER-DEFECT AND PER-CONDITION ROLL-UP
  # ===================================================================
  cr1_conditions:
    note: >-
      Reported under the SOURCE numbering of DEC-20260907-b6bcf4, not the
      amendment's permuted numbering (finding XR-1). Each was judged on its
      substance.
    COND-1:
      subject: 'second arm; T = 64 and T_sel = 32 at N = 2^20 from the frozen table'
      result: PASS
      basis: 'checked against experiments/EXP-ECDLP-612fb1/specification.v2.yaml line 223; every N = 2^24 field byte-identical'
    COND-2:
      subject: 'success_criterion S1/S2/S3 and metrics.primary verbatim; interval-routed outcome under a FRESH label'
      result: PASS
      basis: >-
        S1/S2/S3 and metrics.primary byte-identical to the approved v2
        (programmatic comparison). Approved-S3 still means DISAGREEMENT. The
        fresh label SU (CONFIRMED UNRESOLVED) collides with no approved outcome
        label in v1 or v2.
      precedence_rule_checked: >-
        COHERENT. v3 states S3-over-SU precedence: if the two readings
        disagree, that is S3 (DISAGREEMENT) regardless of whether either
        reading's interval would have routed to SU. This gate checked the rule
        for a case where it could be incoherent -- both readings individually
        interval-routed AND disagreeing with each other -- and the rule
        resolves it cleanly to S3. That is the right ordering: a disagreement
        between readings is a stronger and more urgent finding than either
        reading's own inconclusiveness, and routing it to SU would let a
        genuine disagreement be reported as a shrug.
    COND-3:
      subject: 'controls (e) SEED-COUNT PARITY not edited; new control appended quoting it verbatim; seeds 1..5 pinned as the reproduction subgroup'
      result: PASS
      basis: >-
        (e)'s text is byte-identical to the approved v2's. Appended control (g)
        quotes (e) in full and argues a fortiori from (e)'s own rationale.
        Seeds 1..5 are pinned as the subgroup, reported separately and never
        composited. See J6 for the warrant analysis; the weaker warrant is
        disclosed rather than assimilated to item 7.
      caveat: 'the condition is mis-numbered in both normative documents -- findings XR-1 and XR-2'
    COND-4:
      subject: 'blind_rederivation frozen: true; existing fields byte-identical; may only gain new sub-keys'
      result: PASS
      basis: >-
        All eight v1 fields plus v2's own appended `v2_rerequirement_a_1_8` are
        byte-identical to the approved v2. Two new sub-keys appended
        (`v3_derivation_packet`, `v3_rerequirement_stage_a_dprime`). `blind_from`
        is not edited -- not one entry added or removed -- and AO-3's "name ONE
        authoritative blind list" is satisfied by making the allowlist
        authoritative and demoting every denylist to corroborating, without
        touching a frozen field. This gate regards that as the elegant
        resolution: it satisfies AO-3 without an edit that COND-4 forbids.
    all_four_pass: true
    but: >-
      All four pass ON SUBSTANCE while the LABELS are permuted between the two
      normative documents (XR-1, XR-2). Compliance is real; the audit trail
      that would let a future reader confirm it cheaply is not.

  defect_discharge:
    D1:
      status: DISCHARGED
      basis: 'J6 d1_sweep -- T = 64 / T_sel = 32 stated from the frozen table; no stale value survives as an operative value'
    D2:
      status: DISCHARGED
      basis: 'J1 and J2 -- the cap convention is stated and is identical to the implementation; the three-term identity is true, disjoint, exhaustive and exactly integer'
    D3:
      status: DISCHARGED
      basis: 'J4 -- the allowlist is sufficient, leak-free and self-detectable, with zero sha256 mismatches; and this lane''s own artifacts and commit messages are clean'
    D4:
      status: DISCHARGED
      basis: >-
        the tie-break convention is stated in `definitions` and its effect is
        made measurable: required_artifacts line 1753 requires the count of
        pool entries tied at the T-th largest weight and the symmetric-
        difference cardinality of the two readings'' Sel_static sets, per cell.
        A convention that was unstated is now stated AND instrumented.
      caveat: 'the cross-reference to it from control (h) is dangling -- finding XR-3'
    D5:
      status: DISCHARGED
      basis: >-
        the interval estimator is named in `definitions` and DECAY-A clause
        (ii) is explicitly CONTEXT ONLY, binding nothing.
      caveat: >-
        discharged in a way that creates finding CF-4: making the interval
        non-binding removes the only calibration available to clause (i)'s
        zero-tolerance strict-monotonicity test, which routes to F6.
    D6:
      status: DISCHARGED
      basis: 'the a = 1/16 cell carries full weight for DISAGREEMENT; no independence down-weighting survives'
    D7:
      status: DISCHARGED
      basis: >-
        control (i) NULL-ORACLE-RAND (uniform) is the shape-matched gating null
        D7 asked for -- it ranges over the whole partition rather than the pool
        -- and NULL-RANDSEL is retained, demoted to non-gating, with its low
        power disclosed in the contract text rather than left for a reviewer to
        discover. Structural argument examined at J5 item (i) and found sound.

  blocking_defects:
    - CF-1
    - CF-2
    - CF-4
    - CF-5
    - LO-1
    - XR-1
    - XR-2
  non_blocking_defects:
    - XR-3
    - 'J1 instrument.py line-84 citation'
    - 'CT-2 characterisation correction (required, but additive disclosure)'
  program_findings_outside_this_contract:
    - CF-3

  # ===================================================================
  # VERDICT
  # ===================================================================
  verdict_block:
    verb: revise
    the_one_sentence_that_decided_it: >-
      The mathematics is right and the mechanism is right -- the cap
      convention, the three-term accounting identity, D1, the allowlist and
      this lane's own leak discipline all pass on recomputation this gate
      performed itself -- but the contract's two normative documents give three
      different accounts of how many controls it has and which letters name
      them, and its required-artifact clause demands a firing status for six
      items it elsewhere declares have no firing condition, so the contract is
      sound in what it measures and not yet coherent in what it instructs.
    why_not_approve: >-
      Because CF-1 is operative rather than editorial: it binds execution and
      leaves an executor with no correct action for six of fifteen items. And
      because the control-identity disagreement (LO-1, CF-5) lands on the
      controls, which are the batch's entire defence against believing an
      artifact, and lands hardest on the item v3 itself names as carrying most
      of the detection load.
    why_not_reject: >-
      Because rejection would misdescribe the state of the work. Every blocking
      defect the predecessor gate raised -- D1, D2, D3 -- is genuinely
      discharged, and discharged well: D2's repair is a correct three-term
      identity this gate verified against the code AND recomputed on committed
      data, and D3's repair is a mechanism change (denylist to closed positive
      allowlist) rather than a longer list, which is the right shape of fix.
      The defects that remain are cross-reference and calibration defects in
      v3-appended text, every one of which is repairable without touching a
      frozen field, an approved record or a snapshot-archived byte. That is a
      revision, not a refusal.
    what_a_revision_must_contain:
      - 'CF-1: narrow required_artifacts line 1754 to the eleven controls; give self-checks and diagnostics their own artifact entry with their own semantics'
      - 'CF-2: state EV-ECDLP-60e266''s own strength (`preliminary`) wherever v3 characterises the anchor, at lines 1030 and 1298'
      - 'CF-4: calibrate DECAY-A clause (i) -- a tolerance, or an interval condition, or downgrade a single non-monotone step from F6 to a reported flag'
      - 'CF-5: restate the falsifiability summary so it partitions its fifteen items'
      - 'LO-1: reconcile the amendment''s falsifiability table with the specification''s controls list, letter for letter, including the summary counts'
      - 'XR-1: renumber the amendment''s cond_2 / cond_3 / cond_4 to match DEC-20260907-b6bcf4''s COND-2 / COND-3 / COND-4, and add `condition_quoted_from` to all four'
      - 'XR-2: make v3 lines 1129, 1418, 1427, 1461, 2057 and 2121 agree with the source numbering and with the amendment'
      - 'XR-3: repoint control (h) line 1212 from "(o)" to the `definitions` tie-break item'
      - 'J1 citation: instrument.py line 81, not 84, at v3 line 558'
      - 'CT-2: record that control (l) clause (iii)''s N = 2^20 anchor rests on EV-ECDLP-60e266''s five N = 2^20 seeds on the pinned instrument, carrying that record''s own strength'
    how_the_revision_must_be_made: >-
      As a NEW revision at a NEW snapshot, superseding rather than editing. Not
      one byte of the TASK-20260907-6077f2 snapshot may be rewritten, and no
      approved or frozen record may be touched. Every item above sits in
      v3-appended text or in the amendment, so none of them requires it.
    what_is_explicitly_NOT_required: >-
      No re-derivation of the cap. No re-verification of the accounting
      identity. No change to the allowlist mechanism. No narrowing of scope. No
      change to any block CR-1 pins byte-identical. This gate checked all of
      those and they pass; a revision that reopened them would be spending
      effort where none is owed.

  # ===================================================================
  # PRIOR COMPARISON -- APPENDED AFTER THE ABOVE WAS WRITTEN TO DISK
  # ===================================================================
  prior_comparison:
    read_at: >-
      AFTER every section above was written to disk, including the full defect
      list, the per-joint findings, the letter-offset ruling and the verdict
      verb. Nothing above this block was edited after the prior was opened. The
      only additions to this file after the read are this block and nothing
      else.
    prior_read: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-48ef8b/priors/coordinator_prior.SEALED.yaml
    prior_id: PRIOR-BATCH-48ef8b

    did_it_change_anything:
      answer: 'NO -- nothing was changed'
      statement: >-
        Not one finding, not one severity, not one remedy and not the verdict.
        The prior identifies no defect this gate missed, and this gate found no
        reason in it to withdraw or soften anything already recorded. This is
        reported as an outcome, not as a virtue: the file was written to
        constrain the gate's honesty afterwards, and the honest report is that
        it constrained nothing because there was nothing to correct.

    the_headline_expectation_matched:
      prior_expected: 'REVISION REQUIRED on at least one item, not clean approval (confidence moderate-high)'
      gate_found: revise
      how_to_read_the_agreement: >-
        THIS AGREEMENT IS WORTH VERY LITTLE AND SHOULD NOT BE CITED AS
        CORROBORATION, for the reason the prior itself gives: the author
        reasoned that "predicting clean approval of one's own work would be the
        least credible prior available", so `revise` was the near-certain
        prediction for any competent author to make about any large document.
        A prior that predicts the modal outcome of every gate this lineage has
        run discriminates between almost nothing. What is informative is not
        the verb but WHERE the two disagree, below -- and they disagree almost
        everywhere.

    every_predicted_break_point_was_overturned:
      summary: >-
        THE AUTHOR NAMED FOUR PLACES IT EXPECTED THE CONTRACT TO BREAK FIRST.
        THIS GATE PASSED ALL FOUR. Not one of this gate's seven blocking
        findings is at a location the prior named. That is the substantive
        result of the comparison and it runs against the author's own
        expectation in every case.
      items:
        - prior_id: EXP-BREAK-1
          predicted: 'control (g)''s authority argument for 25 seeds; a strict gate could reasonably refuse it'
          gate_found: PASS
          gate_reasoning: >-
            Recorded at J6 before the prior was read. The gate verified the
            authority gap independently -- `invalidation_rules` item 7 does not
            name the seed set -- and accepted control (e)'s own stated
            rationale as the warrant, because the rationale names the property
            the control protects and 25 seeds satisfy it more strongly than 5.
            Refusing it would require holding that a control's stated purpose
            cannot license a change serving that purpose better, which would
            make (e) a bare number rather than a control with a reason. The
            gate also credited that the weaker warrant is DISCLOSED in the
            amendment rather than assimilated to item 7.
        - prior_id: EXP-BREAK-2
          predicted: >-
            the cap formula's fidelity to the code, in some subtle detail --
            "the likeliest error is not the cap itself but a detail of
            pool-construction crediting or of the saturation constant"
          gate_found: PASS
          gate_reasoning: >-
            The gate re-derived the convention symbol by symbol from the code
            and recomputed W and cap at all eight cells with zero
            discrepancies, and it checked the two specific details the prior
            worried about: pool-construction crediting (`generate_pools`, where
            a capped walk is counted in capped_walks and contributes no pool
            entry) and the cap constant itself (CAP_MULT = 8 at line 31, with
            ceil applied after the multiplication). Both are as stated. The
            author's self-doubt here was unfounded, which is a useful thing for
            the record to show.
        - prior_id: EXP-BREAK-3
          predicted: 'the packet''s leak-freedom, or its completeness -- "both are my own assertions about my own text"'
          gate_found: PASS
          gate_reasoning: >-
            Zero sha256 mismatches; sufficient; leak-free; self-detectable.
            The gate also independently reached the author's own conclusion
            about the one disclosed inclusion: telling the re-deriver that
            a = 1/4 is the known-false object is required by "controls before
            belief" rather than a leak, because withholding it would remove the
            control. The gate qualifies this only on the anchor's STRENGTH
            (finding CF-2), not on the inclusion.
        - prior_id: EXP-BREAK-4
          predicted: 'the second scale as added surface for no required purpose; a gate may prefer the smaller change'
          gate_found: PASS
          gate_reasoning: >-
            Recorded at J7. The gate took the smaller change seriously and
            declined it: the second scale is not decoration, since N-dependence
            of the feasibility boundary is a live possibility a single-scale
            batch cannot see, and D1 is discharged more strongly by stating the
            frozen value than by deleting the arm.

    the_prior_also_predicted_what_the_gate_would_MISS:
      what_it_said: >-
        The prior records, as the most useful thing it can contain, that it
        expects the gate to focus on the cap formula because it is legible and
        checkable, and to UNDER-ATTACK (i) the control falsifiability table --
        whether each item really has a reachable failing world, which requires
        arguing about each rather than reading code -- and (ii) whether the
        derivation packet is SUFFICIENT, which can only be properly tested by
        implementing from it. It concludes: "If the gate confirms the cap
        formula and stops, the review has checked the easy joint."
      what_actually_happened:
        answer: 'THIS PREDICTION WAS OVERTURNED, and overturned in the most direct way available.'
        detail: >-
          The control falsifiability table is not merely where this gate looked
          hardest; it is where FOUR of the seven blocking findings came from.
          CF-1 (the required-artifact clause demanding a firing status for six
          items with no firing condition), CF-5 (the summary that does not
          partition its own item set), LO-1 (the two documents disagreeing on
          the identity of the controls) and CF-4 (DECAY-A clause (i)'s
          calibration) all come out of working through the fifteen items one at
          a time and constructing or refusing a failing world for each -- which
          is exactly the expensive, argue-about-each-item work the prior
          predicted would be skipped. The cap formula, by contrast, took the
          least argument of any joint: it is checkable, so it was checked, and
          it was clean.
        on_sufficiency: >-
          The prior is RIGHT that sufficiency cannot be settled by reading, and
          this gate agrees with it explicitly rather than by accident: J4
          records that sufficiency is "judged by this gate's reading, not
          demonstrated by an actual re-derivation" and that "a packet is only
          proven sufficient when a re-deriver completes without reaching
          outside it". That limitation was written before the prior was opened
          and stands unchanged. On this one point the author and the gate
          reached the same caveat independently.
      why_this_is_the_most_informative_line_in_the_comparison: >-
        A prior that names its own review's likely blind spot, and is then
        wrong about it because the review looked precisely there, is doing the
        job AGENTS.md "Review architecture" describes: it is unrecoverable
        after the fact, and it converts "the gate checked the controls" from an
        assertion into a checkable claim about where the effort went.

    the_one_place_the_prior_and_the_gate_agree_on_a_weakness:
      what: >-
        The prior's expectation_5 says control (i) NULL-ORACLE-RAND's
        negativity "rests on a STRUCTURAL argument about weight_d tracking
        basin size, which is an argument and can be wrong -- which is why F5
        exists", and gives it only moderate confidence. This gate reached the
        same characterisation independently at J5 item (i): the argument is
        sound as an expectation but is not an identity, and that is precisely
        what makes (i) a control rather than a self-check.
      significance: >-
        Modest. Two readings of one document by two sessions under one policy
        are not independent in the sense AGENTS.md means, so the agreement is
        recorded as a fact and not offered as corroboration.

    prior_a_was_read_and_bears_on_nothing_here:
      statement: >-
        The prior's Section A states expectations about cells of a run under
        specification.v3.yaml. NO SUCH RUN EXISTS, none is authorized, and this
        gate produced no measurement, so nothing in Section A could bear on any
        finding above and nothing in it did. Its contents are deliberately not
        restated in this report, which is bound by the same leak discipline it
        audited.
      one_procedural_observation: >-
        Section A is the reason the read-time constraint on this gate was worth
        having. A gate that had opened this file first would have carried the
        author's expectations about the open cells into an audit of the
        document that defines how those cells get scored. The constraint cost
        the gate the guidance a stated prior gives, as the prior's own
        `read_rule` acknowledges, and this gate judges the trade correct.

    a_provenance_observation_for_the_program:
      what: >-
        The prior records `resolved_model: 'claude-opus-5 (Cursor cloud agent
        runtime)'` for the authoring session; this gate recorded
        `claude-opus-4-5-20251101` for its own. Both sessions requested
        coordinator-orchestration-code, neither used a fallback, and NEITHER IS
        PROBE-VERIFIED -- both disclose that
        `orchestration.adapter doctor --probe` was not run.
      why_it_is_recorded: >-
        Two sessions of one lane recorded different model-identifier strings
        for the same requested policy, in different formats, with neither
        confirmed against a backend. AGENTS.md "Model policy" treats an
        identifier as unverified configuration until a probe confirms it, and
        both records honour that by disclosing it -- so this is not a contract
        violation by either session. It is a legibility problem for whoever
        later asks whether this lane's independence was independence of
        SESSION or also of MODEL: on the committed records, that question
        cannot currently be answered either way.
      it_changes_no_finding: >-
        Nothing in this gate's audit depends on it. Recorded as a program
        observation, not as a defect of PA-ECDLP-6ac801-v2-to-v3, and not as a
        gate condition.

    net_effect_on_the_verdict:
      verdict_before_reading_the_prior: revise
      verdict_after_reading_the_prior: revise
      blocking_findings_added_after_the_read: 0
      blocking_findings_withdrawn_after_the_read: 0
      severities_changed_after_the_read: 0
