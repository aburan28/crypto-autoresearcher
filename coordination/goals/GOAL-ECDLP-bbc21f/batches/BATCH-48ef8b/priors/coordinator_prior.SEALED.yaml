coordinator_prior:
  id: PRIOR-BATCH-48ef8b
  goal_id: GOAL-ECDLP-bbc21f
  batch_id: BATCH-48ef8b
  written_by_task: TASK-20260907-058c69
  written_at: '2026-09-07'
  written_at_note: >-
    Runtime-supplied calendar date; this role holds no independent clock. THE
    COMMIT TIME IS THE AUTHORITATIVE PROOF OF PRECEDENCE, and it is the whole
    point of this file: it is committed in BATCH-48ef8b's OPENING snapshot,
    before any reviewer, gate or re-deriver of this lane exists.

  # =====================================================================
  # WHY THIS FILE EXISTS, AND WHY IT IS SEALED RATHER THAN DELETED
  # =====================================================================
  purpose: >-
    AGENTS.md "Review architecture" REQUIRES the Coordinator to record what it
    expects a review to find, BEFORE any reviewer runs: "three reviewers
    concurred" and "three reviewers concurred with what the Coordinator
    already believed" are different findings, and only a pre-recorded prior
    separates them. A prior the review OVERTURNS is one of the most
    informative results this program can produce, and it is unrecoverable if
    written afterwards.
  why_sealed_and_not_inline: >-
    Blocking defect D3 (DEC-20260907-4e34c5) was that the previous lane's
    Coordinator prior sat in plain text in a handoff, in a committed dispatch
    queue, and on the blind re-deriver's own declared required-reading path.
    THE ANSWER TO A LEAKING PRIOR IS NEVER TO STOP RECORDING IT. So the prior
    is recorded in full, here, and moved OFF every reader's reading path:
      - it is NOT in the derivation packet
        (experiments/EXP-ECDLP-6ac801/derivation-packet/PA-ECDLP-6ac801-v2-to-v3/MANIFEST.yaml),
        so under that packet's allowlist it is unreadable before a Stage A''
        seal without an explicit, self-detectable violation;
      - it is named on the corroborating denylist in
        specification.v3.yaml `blind_rederivation.v3_derivation_packet`;
      - BATCH-48ef8b's queue, its six task cards, its six handoffs, its
        opening decision and its commit messages state NO prior, NO verdict,
        NO margin and NO number at any cell of the quantity under test. This
        file is the only place in the lane that does.
  it_confers_no_authority: >-
    THIS FILE IS NOT AN INSTRUCTION AND NOT A PERMISSION. It contains no task
    assignment, no approval, no deliverable and no joint. A reviewer's joints
    and deliverables come from its handoff and, for the Stage A'' re-deriver,
    from the derivation packet alone -- which is exactly why that packet can be
    prior-free. Nothing in this file may be cited as evidence, and an outcome
    that matches it is not thereby corroborated.

  # =====================================================================
  # WHO MAY READ IT, AND WHEN
  # =====================================================================
  read_rule:
    stage_a_prime_prime_rederiver: >-
      NEVER before its seal exists. Not before, not "just the gate section",
      not at all. After sealing, it may read this file freely.
    approval_gate_TASK_20260907_9c0626: >-
      NOT UNTIL ITS OWN FINDINGS ARE WRITTEN. The gate may read this file only
      AFTER `approval_review.yaml` records its own defect list and its own
      verdict, and it must attest in that report to when it read this file
      (before or after). This is stricter than the program's default, where a
      reviewer ordinarily reads the review plan including the prior. It is
      stricter on purpose: the gate is an adversarial reader of a document
      this Coordinator wrote, and a prior that tells the gate what its author
      expects it to find is a thumb on that scale. The cost is real and is
      accepted: the gate loses the guidance a stated prior gives.
    lane_close_TASK_20260907_1aa16f: 'May read it freely. Comparing the outcome against this prior is part of closing the lane honestly.'
    anyone_else: 'May read it. It is committed, not secret. "Sealed" here means OFF THE READING PATH OF TWO NAMED ROLES, not confidential.'

  # =====================================================================
  # PRIOR A -- THE OPEN CELLS. NEVER READABLE BEFORE A STAGE A'' SEAL.
  # =====================================================================
  prior_a_open_cells:
    scope: >-
      What this Coordinator expects a Stage A''/B'' run under
      specification.v3.yaml to find, IF it is ever approved and executed. No
      such run exists, none is authorized by this lane, and this lane produces
      no evidence at all -- so every line below is an expectation about a
      measurement that has not been made.
    basis_is_committed_record_only: >-
      Every number cited below is read off a committed record of this program,
      at that record's own stated scope. NONE is a new measurement and none
      was computed by this session.
    what_is_already_committed_at_N_2_24_5_seeds: >-
      DEC-20260907-9b1b02 records a = 1/16 as S1, a = 3/16 as S2 and a = 1/4
      as S2, settled by BATCH-3c7493 under v1's definitions. The approved v2's
      `blind_rederivation.v2_rerequirement_a_1_8.trigger` records the Stage A
      blind reading as 5/5 at a = 1/16, 1/5 at a = 1/8, 0/5 at a = 3/16 and
      0/5 at a = 1/4, against a production a = 1/8 reading of 5/5 -- the S3
      DISAGREEMENT this whole lineage exists to resolve. Those are the numbers
      a v3 run would be compared against; they are not predictions.
    expectation_1_a_1_8_at_N_2_24:
      expect: >-
        The re-sealed blind reading at a = 1/8 AGREES with production, i.e.
        the cell resolves to S1 CONFIRMED FEASIBLE rather than to a second S3.
      confidence: 'moderate, and lower than the confidence of the reasoning behind it'
      why: >-
        The recorded root cause of the original disagreement was definitional,
        not physical: v1 named the selection weight without stating it, and a
        controlled post-seal diagnostic on the IDENTICAL sampled pool showed
        that switching from an oracle true-size selection to
        weight_d = S_d + 4*W*h_d alone flips a = 1/8 from 1/5 to 5/5. v2 now
        states the formula, so a re-deriver applying it should land where
        production lands.
      what_would_overturn_it: >-
        A second S3 at a = 1/8 under the corrected definitions. That would be
        the most interesting outcome available to this lineage, because it
        would mean the residual disagreement is NOT definitional -- and the cap
        convention D2 exposes is then the leading suspect.
    expectation_2_the_cap_changes_no_verdict:
      expect: >-
        Stating cap = ceil(8*W) explicitly changes NO cell's verdict relative
        to the committed v1 readings at N = 2^24, seeds 1..5.
      confidence: 'LOW. This is a guess and is recorded as one.'
      why: >-
        Production has always applied the cap, so its committed numbers
        already reflect it; and the previous gate measured the unassigned mass
        at 4.67e-4 to 2.09e-3 of N across the four a-cells of ONE committed
        run, which is small. But "small mass" does not imply "small effect on
        a near-zero margin", the affected mass is concentrated in the LONG
        walks that a size-correlated weight also favours, and the direction of
        any induced difference is unpredictable from the contract text. THE
        GATE AND THE RUN, NOT THIS EXPECTATION, DECIDE THIS.
      what_would_overturn_it: >-
        Falsification condition F4 of specification.v3.yaml firing: a cell
        whose confirmed verdict differs from the committed v1 reading while
        control (h) does NOT fire. That would falsify an assumption implicit
        in every prior record of this lineage.
    expectation_3_the_crossing_bracket:
      expect: 'The crossing bracket stays between a = 1/8 and a = 3/16 at BOTH scales.'
      confidence: 'moderate at N = 2^24, LOW at N = 2^20 as a CONFIRMED (two-reading) bracket'
      why: >-
        The N = 2^20 Stage 0 reading and the N = 2^24 v1 production reading
        both put it there. But this experiment has never run a blind reading
        at N = 2^20 at all, so a CONFIRMED bracket there is genuinely new, and
        two scales do not establish N-independence -- which
        specification.v3.yaml `interpretation` states as a binding limit.
      what_would_overturn_it: 'A bracket that moves with N, or a cell inside the bracket routed to SU or to S3 at either scale.'
    expectation_4_su_is_used:
      expect: >-
        At least one cell -- most plausibly a = 1/8 -- is routed to the fresh
        label SU CONFIRMED UNRESOLVED at at least one scale.
      confidence: 'low-moderate'
      why: >-
        a = 1/8 is the cell whose committed margins straddle zero most
        closely, and SU exists precisely because a straddling interval should
        not be called either way. If SU is never used, that is worth noticing:
        a routing label that never fires is either unnecessary or
        mis-specified.
      what_would_overturn_it: 'No cell routed to SU, at either scale, with every interval clear of zero.'
    expectation_5_the_controls:
      expect: >-
        Control (b) reproduces INFEASIBLE at a = 1/4; control (h) does not
        fire; control (i) NULL-ORACLE-RAND is comfortably negative at every
        cell; control (l) DECAY-A clause (i) holds; controls (k) and (m) hold
        with low power, as the previous gate found on the committed cells.
      confidence: 'high for (b) and (h); moderate for (i); moderate for (l)'
      why: >-
        (b) and (h) have external or committed references and the previous
        gate reproduced all three quantities at 20 committed cells to
        0.000e+00. (i)'s negativity rests on a STRUCTURAL argument about
        weight_d tracking basin size, which is an argument and can be wrong --
        which is why F5 exists. (l) clause (i) is a monotonicity claim across
        four different instruments and nothing forces it.
      what_would_overturn_it: 'Any of F5, F6 or outcome (h) of `distinguishable_outcomes`.'
    what_this_prior_does_not_do: >-
      It sets no threshold, moves no criterion, and licenses no reading. Every
      threshold this batch uses is fixed in specification.v3.yaml before
      execution. If a result contradicts this file, THE RESULT WINS and this
      file is one of the more useful records in the lane.

  # =====================================================================
  # PRIOR B -- THE APPROVAL GATE. NOT READABLE BY THE GATE UNTIL ITS OWN
  #            FINDINGS ARE WRITTEN.
  # =====================================================================
  prior_b_approval_gate:
    claim_under_review: >-
      As its producer states it: that
      experiments/EXP-ECDLP-6ac801/specification.v3.yaml and
      experiments/EXP-ECDLP-6ac801/amendments/v2_to_v3.yaml discharge blocking
      defects D2, D3 and D1 and non-blocking defects D4-D7 of
      DEC-20260907-4e34c5; are ADDITIVE to the approved v2 and to v1; satisfy
      the four binding conditions of the compatibility read CR-1
      (DEC-20260907-b6bcf4); and declare every control such that each can
      actually fail on a correct implementation.
    expected_overall_outcome:
      expect: 'REVISION REQUIRED on at least one item, not clean approval.'
      confidence: 'moderate-high'
      why: >-
        Every gate this lineage has run has found something, and the previous
        one found seven defects in a document its author believed complete.
        A contract this size, written in one pass, with a formula transcribed
        from source and a four-file packet asserted leak-free, is not likely to
        be clean. Predicting clean approval of one's own work would be the
        least credible prior available.
    where_i_expect_it_to_break_first:
      - id: EXP-BREAK-1
        where: 'CONTROL (g)''s AUTHORITY ARGUMENT for 25 seeds.'
        why: >-
          It is the one wide-scope item `invalidation_rules` item 7 does not
          name, and the warrant used -- control (e)'s own rationale, a fortiori
          -- is weaker than item 7 and is recorded as such. A strict gate can
          reasonably hold that changing a frozen control's seed count needs a
          warrant the contract actually grants, and refuse.
        if_the_gate_agrees_with_me: 'The fallback is seeds 1..5 only, which costs the wide scope its power and is stated in control (g) itself.'
      - id: EXP-BREAK-2
        where: 'THE CAP FORMULA''S FIDELITY TO THE CODE, in some detail I got subtly wrong.'
        why: >-
          I read cap = ceil(8*W) off three lines and the residual accounting
          off `exact_basins` and `generate_pools`, and DEC-20260907-b6bcf4
          `limitations` requires the gate to REPEAT that comparison rather than
          inherit it. A formula that is close but not identical is worthless
          here. The likeliest error is not the cap itself but a detail of
          pool-construction crediting or of the saturation constant.
        if_the_gate_agrees_with_me: 'A correction to the formula in a superseding record; the amendment does not get edited.'
      - id: EXP-BREAK-3
        where: 'THE PACKET''S LEAK-FREEDOM, or its COMPLETENESS.'
        why: >-
          I assert the four packet files carry no prior and are sufficient to
          compute every field in `deliverables.md`. Both are checkable and both
          are my own assertions about my own text. The a = 1/4 known-false
          anchor is a disclosed, deliberate inclusion; a gate might judge it
          too much, or might find that `quantity.md` omits something a
          from-scratch implementer actually needs.
        if_the_gate_agrees_with_me: 'An additive packet amendment under a new manifest and new hashes -- never a reader deciding to open something else.'
      - id: EXP-BREAK-4
        where: 'THE SECOND SCALE (N = 2^20) AS ADDED SURFACE FOR NO REQUIRED PURPOSE.'
        why: >-
          DEC-20260907-9b1b02 RANK 1 never asked for it and
          DEC-20260907-4e34c5 RANK 2 offers dropping it as a complete
          discharge of D1. A gate may reasonably prefer the smaller change.
        if_the_gate_agrees_with_me: 'Every N = 2^20 field is written to be separable; dropping the arm discharges D1 by deletion and costs the rest nothing.'
    where_i_do_not_expect_it_to_break:
      - 'ADDITIVITY. Four sha256 are recorded and re-checkable; nothing frozen was touched.'
      - 'THE FRESH LABEL SU. It collides with nothing and the precedence rule S3-over-SU is stated.'
      - 'D1''s VALUE. T = 64 at N = 2^20 is quoted from a frozen table and corroborated by a dictionary lookup with no code path to 102.'
    what_i_expect_the_gate_to_MISS: >-
      Recorded because it is the most useful thing a prior can contain. I
      expect the gate to focus on the cap formula, which is legible and
      checkable, and to under-attack (i) the CONTROL FALSIFIABILITY TABLE --
      whether each of the eleven items really has a reachable failing world,
      which requires arguing about each rather than reading code -- and (ii)
      the question of whether the derivation packet is SUFFICIENT, which can
      only be tested by trying to implement from it and is far more expensive
      than reading it for leaks. If the gate confirms the cap formula and
      stops, the review has checked the easy joint.
    if_this_prior_is_wrong: >-
      Then it is wrong in the file where being wrong is cheap and legible. A
      gate that approves cleanly, or that breaks the contract somewhere I did
      not name, is a MORE informative result than one that finds what I
      expected -- and that is the entire reason this file was written before
      the gate ran rather than after.

  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_used: false
    resolved_model: 'claude-opus-5 (Cursor cloud agent runtime), recorded beside the requested policy per AGENTS.md "Model policy"'
    model_verified: 'NOT probe-verified; `orchestration.adapter doctor --probe` was not run by this session. Disclosed rather than asserted.'
  asserts_nothing: >-
    THIS FILE IS NOT EVIDENCE AND IS NOT A FINDING. No run was executed by the
    session that wrote it, no measurement originates in it, no hypothesis or
    goal status moved, and nothing in it may be cited in support of any claim
    about the ECDLP or about G3 feasibility at any a.
