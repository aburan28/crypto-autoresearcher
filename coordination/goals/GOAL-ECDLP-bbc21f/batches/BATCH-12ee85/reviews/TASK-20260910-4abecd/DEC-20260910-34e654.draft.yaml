  question_id: RQ-ECDLP-78dbc5
  batch_id: BATCH-12ee85

  context: >-
    Composes the four independently completed, mutually blind review reports
    of BATCH-12ee85's review round (review-plan.yaml, joints
    J1_blind_rederivation_and_cross_implementation split into phase 1
    (TASK-20260910-19bd7b) and its successor phase 2 (TASK-20260913-9863af),
    J2_record_integrity_conformance_and_comparison_recompute
    (TASK-20260910-c8cb36), J3_interpretation_and_proves_too_much
    (TASK-20260910-59d885)) into EV-ECDLP-5035ed and this decision, per
    ledger/handoffs/TASK-20260910-4abecd.yaml. The round reviewed Stage A''
    (the blind re-derivation seal of TASK-20260907-7afa98) against Stage B''
    (the production grid, RUN-ECDLP-6ac801-v3-n20-s01..25 and
    RUN-ECDLP-6ac801-v3-n24-s01..25), both already-recorded ceiling-
    feasibility measurements underlying H-ECDLP-37dc01's clause (C1)
    (EV-ECDLP-2e9680, EV-ECDLP-6783b8). This decision's own composition
    follows review-plan.yaml's own binding instruction: "If the reviewers
    break a joint this prior expected to hold, the composition follows the
    reports, not this prior."

  decision: support
  decision_rationale_for_verb: >-
    `support` is recorded, scoped EXACTLY to the definition-exact,
    ceiling-level arithmetic and record-integrity corroboration EV-ECDLP-5035ed
    establishes -- not to the coordinator_prior's own optimistic expectation
    for the round's interpretive headline, which the reports broke on
    several points (see joint-by-joint `rationale` below). This is not
    `weaken` or `reject_scoped`: nothing in this round contradicts
    H-ECDLP-37dc01 at a pre-registered effect size, and the definition-exact
    fields' three-way agreement is, if anything, a second consecutive
    positive integrity finding on top of EV-ECDLP-2e9680's and
    EV-ECDLP-6783b8's own ceiling-feasibility results. It is not
    `inconclusive`: the ten fields the review plan itself named as expected
    definition-exact came back EXACT at every one of 80 checked triples, and
    J2's 496 identity/comparison checks returned zero discrepancies -- these
    are clean, reportable, standalone findings even though several
    interpretive readings the prior expected to accompany them did not
    survive. `expand`/`replicate` are not used because this round performed
    no new run and expanded no test boundary; it re-examined already-
    recorded findings from a fresh angle. `refine` is not an available verb
    in this program's decision template (`templates/research-records.md`
    `coordinator_decision.decision` enum:
    approve|revise|replicate|expand|support|weaken|reject_scoped|pause|supersede),
    so the refinements this round produced (the crossing-bracket
    disambiguation; the D2 companion-statistics requirement) are carried in
    `rationale` and `limitations` rather than in the decision verb itself.

  target_ids:
    - H-ECDLP-37dc01
    - EXP-ECDLP-6ac801
    - GOAL-ECDLP-bbc21f
    - TASK-20260910-19bd7b
    - TASK-20260913-9863af
    - TASK-20260910-c8cb36
    - TASK-20260910-59d885
    - EV-ECDLP-5035ed

  rationale:
    - >-
      JOINT J1 PHASE 1 (blind re-derivation, TASK-20260910-19bd7b) -- PRIOR
      HELD. The coordinator_prior expected the derived values at the eight
      frozen cells to agree with the production grid on definition-exact
      fields, and to disagree only qualitatively on seed-dependent fields,
      with the live named risk being that the packet's own convention gaps
      would surface rather than be silently resolved. This held exactly: the
      known-false a=1/4 control reproduced G3-INFEASIBLE at both scales, and
      six genuine packet ambiguities (cap_boundary_at_step_cap, rho_ORACLE,
      null_shuf_scope, size_biased_draw, pool_stop_rule, weight_arithmetic)
      were disclosed as results rather than silently resolved, exactly as
      the prior anticipated this joint's behavior would look.
    - >-
      JOINT J1 PHASE 2 (cross-implementation comparison, TASK-20260913-9863af)
      -- PRIOR MOSTLY HELD, ONE CLAUSE OVERTURNED. The prior expected
      agreement with BOTH implementations on definition-exact fields
      (accounting_identity_holds, residual_fraction, cap, rho_ORACLE) and
      qualitative-only agreement on seed-dependent fields. Three of those
      four named fields (accounting_identity_holds, residual_fraction, cap)
      came back EXACT at every cell against both sources, as did six further
      fields the review plan implicitly treated as deterministic
      (share_top_Tsel, share_top_T, share_top_Tover4, share_top_Tover8,
      cycle_mass, capped_mass) and min_basin_size -- ten fields, 80/80
      triples EXACT. rho_ORACLE, the fourth named field, came back
      UNDERDETERMINED at every cell against both sources -- this is the
      prior's OWN named live risk materializing exactly as anticipated, not
      an unanticipated break: the packet supplies no formal definition, so
      the honest verdict is UNDERDETERMINED rather than a false EXACT or a
      false DISAGREES. The ONE genuine surprise, named nowhere in the prior:
      margin_null_randsel is DISAGREES at all 8/8 cells against Stage B''
      only, a 100%-consistent sign inversion unlike any other field's
      behavior in this round. This is recorded in EV-ECDLP-5035ed
      `unresolved_confounds` per core rule 8 and is NOT resolved by this
      decision -- it is neither read as evidence against H-ECDLP-37dc01 (it
      is a control-arm field, not a clause-relevant one, and its cause is
      undetermined) nor silently dropped.
    - >-
      JOINT J2 (record integrity, conformance, recompute, TASK-20260910-c8cb36)
      -- PRIOR HELD IN FULL. The prior expected the Stage A'' seal hashes to
      match byte for byte, both snapshot receipts to verify, the margin and
      accounting identities to hold on all 200 cells, and Stage B'''s
      parameters to conform to v3's stage plan with bootstrap CIs
      reproducing from the recorded seeds. Every one of these held exactly,
      with zero discrepancies across 360 path-hash checks and 496
      identity/comparison checks (200 margin + 200 accounting + 200 residual
      identities on Stage B'', a bonus 200+200+200 on Stage A'', 96
      cross-implementation field comparisons at the 8 frozen cells, 8
      bootstrap-CI reproductions). The independent per-(N,a) recompute
      matched the coordinator_prior's own pre-recorded numbers to their
      stated precision on all 8 groups. No DISAGREES-level finding on this
      joint; verdict `passed`, `review_attestation.verdict: holds`.
    - >-
      JOINT J3 (interpretation and proves-too-much, TASK-20260910-59d885) --
      PRIOR'S HEADLINE EXPECTATION REFINED, NOT FLATLY OVERTURNED, BUT THREE
      SPECIFIC UNQUALIFIED READINGS BREAK CLEANLY. Item 4 of the
      coordinator_prior expected the comparison headline to read: the
      crossing bracket corroborated between a=1/16 and a=3/16, stable in
      location across N, with visible N-dependence AT a=1/8 only
      (leaning-infeasible/straddled at 2^20, feasible with CI excluding zero
      at 2^24) -- this is, precisely stated, what J3 confirms holds, but ONLY
      as two SEPARATE readings that must each be named: the OUTER-INTERVAL
      reading (a=1/16 feasible, a=3/16 infeasible, both scales, both
      implementations) is N-STABLE and SURVIVES; the BORDERLINE-POINT
      reading (does a=1/8 itself sit on the feasible side) IS NOT STABLE and
      an unqualified "N-stable" claim covering it BREAKS -- a=1/8 flips
      INFEASIBLE-to-FEASIBLE between the two tested scales in both
      implementations independently (D4). This is a REFINEMENT of the
      prior's own already-hedged expectation, not its flat contradiction:
      the prior's own words ("visible N-dependence AT a=1/8 only") already
      distinguished the stable outer bracket from the moving borderline
      point; J3 supplies the formal disambiguation the prior's own phrasing
      needed but did not spell out, and corroborates the direction the prior
      named (straddled/leaning-infeasible at 2^20, CI-excluding-zero-feasible
      at 2^24) from a fresh in-session recomputation (production k_25=17->24,
      matching the direction of Stage A'''s own 16->20). THREE items break
      cleanly and were not part of the prior's own item 4 language: D1 (the
      a=1/8 N=2^24 CI as a confirmed feasible ONLINE operating point) --
      BREAKS, because zero online RESEL-L arms exist anywhere in this record
      set and ceiling-feasibility is, by the v3 contract's own text, silent
      on whether any online mechanism reaches it; D3 (the margin identity
      validating a walk-based estimator) -- BREAKS, because it is a
      tautological single-program self-check and Stage B'' runs no walk at
      all (certificate kind "none"); and the UNQUALIFIED "confirmed
      infeasible" reading of D2 at a=1/8, N=2^20 -- BREAKS, because the mean
      margin is positive in both readings, the bootstrap CI straddles zero,
      and the pre-registered 5-seed subgroup rule gives the opposite family
      at the identical cell (the LITERAL, contract-defined 25-seed verdict
      itself does survive in both readings). Five self-generated objects
      (A1-A5) were also run: A1, A2, A3, A5 break (respectively: overstating
      quantitative/robustness agreement when one implementation's N=2^24
      confirmation sits at the exact minimum passing count; conflating an
      INFEASIBLE label with a negative average effect; compositing two
      contract-forbidden rules; extrapolating past two tested N values whose
      only interior point already reverses); A4 splits (exact per-cell
      agreement validates shared arithmetic correctness, not
      implementation-choice robustness, since all three implementations
      independently chose the identical splitmix64 finalizer).
    - >-
      EXPECTED DISPOSITION (coordinator_prior item 5) -- HELD, WITH THE
      SCOPE NARROWING J3 REQUIRES. The prior expected EV-ECDLP-5035ed to
      record the two-implementation corroboration at the tested scope with
      no hypothesis-status promotion, and this decision to name the RANK-2
      online-RESEL-L lane as successor. Both hold. What the prior called "the
      robustness reading" is recorded here with the exact qualifications J3's
      `required_controls` demand (quote k_25, the CI, and the 5-seed subgroup
      verdict together at a=1/8 N=2^20 rather than the k_25 count alone;
      disclose that the a=1/8 N=2^24 confirmations sit at different distances
      from their respective thresholds; disambiguate "crossing bracket"
      between its two readings; treat the online-RESEL-L follow-up as the
      only route to any online-operating-point claim) rather than as an
      unqualified headline, per this program's premature-closure-is-
      symmetric-with-overclaiming standard.

  evidence_refs:
    - ledger/evidence/EV-ECDLP-5035ed.yaml
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-12ee85/review-plan.yaml
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-12ee85/reviews/TASK-20260910-19bd7b/blind-rederivation.yaml
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-12ee85/reviews/TASK-20260913-9863af/phase2-comparison.yaml
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-12ee85/reviews/TASK-20260910-c8cb36/integrity-report.yaml
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-12ee85/reviews/TASK-20260910-59d885/red-team-report.yaml
    - ledger/evidence/EV-ECDLP-2e9680.yaml
    - ledger/evidence/EV-ECDLP-6783b8.yaml
    - ledger/hypotheses/H-ECDLP-37dc01.yaml
    - experiments/EXP-ECDLP-6ac801/specification.v3.yaml

  limitations:
    - >-
      claim_tier toy: generic keyed-random-function / exact-basin-enumeration
      instrument only, N in {2^20, 2^24}, no cryptographic scale, no curve
      arm. Transfer beyond N in {2^20, 2^24} and beyond this exact a-grid is
      an assumption, never a result of this decision.
    - >-
      Ceiling-only: zero online RESEL-L arms exist in this record set or in
      any record it cites. Per specification.v3.yaml `interpretation` and
      per goal.yaml's own current `next_action` RANK 2, no hypothesis-status
      promotion beyond ceiling-feasibility on any clause of H-ECDLP-37dc01
      may be considered before an online arm exists. This decision does not
      promote H-ECDLP-37dc01's `status` beyond `analyzed`.
    - >-
      margin_null_randsel's 8/8 sign inversion against Stage B'' is recorded
      in EV-ECDLP-5035ed as an unresolved confound, per core rule 8. Its
      root cause (undisclosed sign-convention difference vs a genuine
      computational discrepancy) is NOT determined by this decision or by
      any cited report; a future record reading it as resolved in either
      direction is reading past what this decision and its evidence
      establish.
    - >-
      rho_ORACLE remains formally undefined by the derivation packet; its
      UNDERDETERMINED verdict at all 8 cells against both sources is a
      disclosed packet-definition gap, not a computational finding either
      way. A future amendment to the packet's own text, if one is written,
      is the only route to resolving this, and this decision does not
      author one.
    - >-
      The a=1/8 N=2^24 FEASIBLE confirmation is NOT equally robust across
      the two implementations compared: Stage A'' sits at the exact
      k_25=20/25 minimum passing count while Stage B'' sits four seeds clear
      (k_25=24/25, recomputed in-session by J3). A future record citing
      "both confirm FEASIBLE at 2^24" without this asymmetry overstates the
      weaker of the two confirmations, per J3's own `counterexample_or_mutation`.
    - >-
      This decision does not edit ledger/goals/GOAL-ECDLP-bbc21f/goal.yaml,
      the hypothesis record, or any of the four review reports -- all are
      outside this task's declared write_scope. Any hypothesis-status or
      goal-ranking transition this round's findings warrant is the work of a
      SUBSEQUENT Coordinator ledger-archive/checkpoint task, not this one.

  next_actions:
    - >-
      (THIS ROUND, NOW COMPLETE: the review round named at RANK 1 of the
      goal head's `next_action` at the time this batch was dispatched -- the
      dispatch and review of Stage A'' and Stage B'' -- is discharged by
      EV-ECDLP-5035ed and this decision. No further action is owed under
      that item by this decision; a subsequent checkpoint task records the
      goal-head transition.)
    - >-
      RANK 2 per the CURRENT `ledger/goals/GOAL-ECDLP-bbc21f/goal.yaml`
      `next_action` head (read in full before drafting this decision, per
      this task's own instruction to verify rather than trust a restatement):
      the ONLINE RESEL-L arm at the confirmed-feasible a values (a=1/16 per
      EV-ECDLP-2e9680, a=1/8 per EV-ECDLP-6783b8), mirroring
      EXP-ECDLP-612fb1's own online-arm design, with a heuristic-validation
      component against HEUR-BLT-7. Its blocking precondition -- a confirmed-
      feasible ceiling operating point to run an online arm at -- now exists
      at both a-values and is, per this round, more thoroughly integrity-
      verified than before. This decision explicitly does NOT rename this
      RANK; it affirms the CURRENT goal head's own RANK 2 language and does
      not invent a different ordering. NOTE ON A DISCREPANCY: this task's own
      assigning instruction described the online-RESEL-L successor as "RANK
      3" in one place; the goal head as actually read at the time of this
      decision names it RANK 2 (promoted from third on the new facts that
      its blocking precondition now exists at two a-values). This decision
      follows the goal head as read, not the assigning instruction's
      restatement of it, per that same instruction's own directive to verify
      against the actual files. If the goal head has since moved again, ONLY
      a subsequent Coordinator ledger-archive/checkpoint task may reconcile
      that -- this decision does not itself edit goal.yaml.
    - >-
      Per J3's own `required_controls` and `next_concrete_action`, any FUTURE
      decision record that cites this round's findings must: (1) quote
      k_25, the CI, and the seeds-1..5 subgroup verdict together at a=1/8
      N=2^20, never the k_25 count alone; (2) disclose the asymmetry between
      Stage A'''s knife-edge and Stage B'''s comfortable a=1/8 N=2^24
      confirmations when citing either; (3) name which of the two crossing-
      bracket readings (outer-interval vs borderline-point) is meant before
      asserting stability or movement with N; (4) treat an eventual online
      RESEL-L run (RANK 2 above) as the only route to any claim about an
      achievable online operating point.
    - >-
      RANK 3+ (carried forward unchanged, not touched by this decision): the
      goal head's own RANK 3 (completion criterion C2 / EXP-ECDLP-869870)
      and its further-ranked items remain exactly as the current goal.yaml
      states them.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      `support` is recorded at evidence strength `preliminary`
      (EV-ECDLP-5035ed `strength_note`), below the `replicated`/`strong` bar
      this program's own rule requires for a mandatory KN-FIND promotion. The
      strength gate is not met for three disclosed reasons: the
      three-way arithmetic agreement corroborates one shared deterministic
      construction (identical splitmix64 finalizer across all three
      implementations, per J3 object A4) rather than three independent draws
      of the underlying phenomenon; a genuinely new, unresolved anomaly
      (margin_null_randsel's 8/8 sign inversion) surfaced this round; and the
      interpretive headline the coordinator_prior expected required an
      explicit two-reading disambiguation rather than closing cleanly (D4).
      Independent of the strength gate, promotion is not warranted on the
      merits either: this round's finding is that already-recorded ceiling-
      feasibility measurements are better arithmetic-verified and more
      precisely scoped, not a new durable claim about the mechanism under
      test -- a KN-FIND entry summarizing "the ceiling numbers checked out a
      third time, with narrower interpretive scope" would not carry the kind
      of durable, reusable content KN-FIND entries are meant to hold. This
      mirrors DEC-20260907-8d8782's and DEC-20260907-9b1b02's own
      `not_warranted` reasoning for the underlying ceiling-feasibility
      findings themselves. Revisit after the RANK 2 online RESEL-L follow-up
      either confirms or fails to reach the ceiling at an achievable batch
      size U -- THAT result, whichever way it falls, is the one this
      hypothesis's lane has been building toward a KN-FIND entry for, not
      this round's integrity/interpretation review of a ceiling measurement
      already on the record.
    knowledge_paths_staged: []

