  type: empirical
  direction: supports
  direction_note: >-
    `supports` is scoped to EXACTLY the definition-exact, ceiling-level
    corroboration this round actually delivered -- NOT to the prior's
    optimistic expectation about the round's interpretive headline. Three
    structurally independent implementations (Stage B'' production,
    Stage A'' blind re-derivation, and this round's own freshly blind J1
    re-derivation) now agree EXACTLY, at all 8 frozen cells, on every field
    the review plan itself named as "supposed to be definition-exact" except
    rho_ORACLE (see `unresolved_confounds`): share_top_Tsel, share_top_T,
    share_top_Tover4, share_top_Tover8, cycle_mass, capped_mass, cap,
    residual_fraction, accounting_identity_holds, min_basin_size (J1 phase 2:
    183/320 field/cell/source triples EXACT, all ten of these fields at
    100% EXACT against both sources; J2: 0 hash mismatches across 360
    path-hash checks, 200/200 + bonus 200/200 identity checks, 96/96
    cross-implementation field comparisons at the 8 frozen cells with 0
    disagreements). J2's own conformance check independently confirms Stage
    B'' matches v3's `stage_plan_v3` exactly, with no parameter or method
    divergence found. This is what `supports` credits: the exact-basin
    partition arithmetic underlying every already-recorded ceiling-feasibility
    finding on this hypothesis's clause (C1) (EV-ECDLP-2e9680, EV-ECDLP-6783b8)
    is now independently, blindly, and record-integrity-verified corroborated
    by a THIRD implementation, at the tested scope. This record does NOT
    claim: (i) that the interpretive readings the coordinator_prior expected
    to hold survived J3's attack -- D1 (ceiling as a confirmed online
    operating point) and D3 (margin identity as walk-based-estimator
    validation) BOTH BREAK outright, and the unqualified "confirmed infeasible"
    reading of D2 and the unqualified "N-stable"/"moves with N" readings of D4
    BOTH BREAK as stated (see `observations` and DEC-20260910-34e654
    `rationale` for the joint-by-joint account); (ii) any resolution of the
    margin_null_randsel 8/8 sign inversion against Stage B'' (recorded,
    unresolved); (iii) any promotion of H-ECDLP-37dc01's status beyond
    `analyzed`; (iv) any statement about an achievable online RESEL-L
    operating point, N outside {2^20, 2^24}, r != 2, T_sel != T/2, or the
    curve arm.
  strength: preliminary
  strength_note: >-
    The record-integrity and cross-implementation-arithmetic finding (J2's
    360 hash checks, 200+200+96 identity/comparison checks, all with zero
    discrepancies) is, on its own, about as thorough a corroboration as this
    program's methodology produces. It does not, however, raise this round's
    overall evidentiary strength above `preliminary`, for three disclosed
    reasons: (1) the object it corroborates is exact-partition ARITHMETIC
    shared by all three implementations via an identical splitmix64
    finalizer and K/K_dp formula (J3 object A4) -- one deterministic
    functional graph computed three times, not three independently-drawn
    random instances agreeing, so it strengthens confidence in the
    implementations' correctness without adding a fourth independent draw of
    the underlying phenomenon; (2) a genuinely new, unresolved anomaly
    surfaced this round (margin_null_randsel's 8/8 sign inversion against
    Stage B'' only) whose root cause -- undisclosed sign-convention
    difference vs a genuine computational discrepancy -- could not be
    determined within J1 phase 2's declared scope; (3) the interpretive
    layer the coordinator_prior expected to close cleanly (item 4: the
    crossing-bracket robustness/N-dependence reading) instead required J3's
    explicit disambiguation between two readings that support opposite
    stability claims, which is itself evidence that the headline finding was
    less settled than the prior anticipated. This mirrors, and does not
    exceed, the `preliminary` tier EV-ECDLP-2e9680 and EV-ECDLP-6783b8 both
    recorded for the underlying ceiling-feasibility findings this round
    reviews; a third-angle-confirmed cell is not automatically a
    `replicated`-strength cell when the confirming implementation shares the
    first two implementations' key construction and the round's own
    comparison surfaced an unresolved disagreement elsewhere.
  claim_tier: toy
  claim_tier_note: >-
    Generic keyed-random-function / exact-basin-enumeration instrument only,
    N in {2^20, 2^24}, no curve arm, no cryptographic size. Constant-factor,
    exact-enumeration statement under the Corrigan-Gibbs-Kogan
    S T^2 = Omega~(eps N) ceiling (KN-LIT-013); no exponent claimed or
    approached; certificate.kind "none" at every one of the 50 inspected
    production runs (no online algorithm is even run by any of the three
    reviewed implementations).
  certificate_refs: []
  certificate_refs_note: >-
    No certificate exists for anything reviewed this round: all three
    implementations are ceiling/ratio measurements by exact enumeration, not
    solved ECDLP instances. Stage B'''s own certificate block reads
    {"kind": "none", "note": "Stage B'': exact-basin closed form, zero
    re-selected arms"} at every one of the 50 inspected run summaries.
  proof_status: empirical_only
  proof_refs: []
  proof_status_note: >-
    Every implementation reviewed this round is a direct measurement (full
    exact-basin enumeration or closed-form computation from it), never a
    sampled estimate and never a derivation from a theorem. Agreement between
    implementations on definition-exact fields is a measured concordance
    (strengthened this round to three implementations from two), not a proof;
    the margin_null_randsel disagreement and the interpretive breaks below
    are likewise measured/argued findings, not resolved by any further
    checkable artifact available to this record.

  scope:
    instruments: >-
      Stage B'' production (run_stageb_v3.py, exact-basin closed form, zero
      re-selected arms, reuses experiments/EXP-ECDLP-612fb1/source_v2/instrument.py
      per v3's explicit reuse clause); Stage A'' (TASK-20260907-7afa98's own
      blind re-derivation implementation, prohibited from reusing that
      module); this round's own J1 (TASK-20260910-19bd7b's rederive.py, a
      wholly separate from-scratch implementation built only from the
      derivation packet's text, per its own `reading_attestation`).
    N: [1048576, 16777216]
    a_grid: [1/16, 1/8, 3/16, 1/4]
    T_T_sel: "T=64/T_sel=32/T4=16/T8=8 at N=2^20; T=256/T_sel=128/T4=64/T8=32 at N=2^24"
    r: 2
    seeds: >-
      Full 200-cell recompute (J2): seeds 1..25 at both scales, all four
      a-values (50 runs x 4 a-values = 200 cells). Cross-implementation
      comparison (J1 phase 1/2, J2 bonus check): 8 frozen cells only (3
      a=1/8 seeds + 1 a=1/16 seed at each of N=2^20 and N=2^24).
    method: >-
      Exact-basin partition by full enumeration in all three implementations
      (no walk-based sampling anywhere in this round); ceiling-only, zero
      online re-selection arms in any of the three.
    transfer_assumption: >-
      Nothing in this record transfers beyond N in {2^20, 2^24}, r=2,
      T_sel=T/2, the generic instrument, and this exact a-grid. Whether any
      finding here extends to other N, other r, other T_sel, the curve arm,
      or an actually-achievable online RESEL-L batch size U is an assumption
      for a future record, never a result of this one (specification.v3.yaml
      `out_of_scope`; J3's own `narrowest_supported_statement`).

  observations:
    - joint: J1_phase1_blind_rederivation
      task_id: TASK-20260910-19bd7b
      summary: >-
        From-scratch re-derivation of every blind-input field, from the
        derivation packet's text alone (MANIFEST.yaml, quantity.md,
        deliverables.md, prohibitions.md, blind-input.yaml -- nothing else),
        at all 8 frozen cells plus the a=1/4 known-false control at both
        scales. The control reproduced G3-INFEASIBLE at both N (k_25=3/25 at
        2^20, k_25=1/25 at 2^24), matching the batch's own proves-too-much
        expectation. Six packet ambiguities were disclosed as results, never
        silently resolved: cap_boundary_at_step_cap (two readings tested,
        empirically identical at these parameters -- vacuous here but a
        genuine packet underdetermination); rho_ORACLE (no formal packet
        definition anywhere; a working definition was supplied and flagged);
        null_shuf_scope, size_biased_draw, pool_stop_rule (never encountered),
        weight_arithmetic (W computed in float64, disclosed per cell). Sealed
        and frozen (2026-09-11T00:00:34Z) before any cross-implementation
        read; phase 2 explicitly not started at freeze time.
    - joint: J1_phase2_cross_implementation_comparison
      task_id: TASK-20260913-9863af
      summary: >-
        320 field/cell/source triples (20 fields x 8 cells x 2 sources):
        183 EXACT, 105 QUALITATIVE, 8 DISAGREES, 24 UNDERDETERMINED. All ten
        fields the coordinator_prior and the review plan named as expected
        definition-exact -- share_top_Tsel, share_top_T, share_top_Tover4,
        share_top_Tover8, cycle_mass, capped_mass, cap, residual_fraction,
        accounting_identity_holds, min_basin_size -- came back EXACT at every
        cell against BOTH sources (80/80 triples for these ten fields). This
        is the round's strongest, most direct hold of the prior. rho_ORACLE,
        also named as expected definition-exact, came back UNDERDETERMINED
        at all 8 cells against both sources (16 triples) because the packet
        supplies no formal definition -- materializing exactly the "live
        risk" the coordinator_prior itself named in advance, not an
        unanticipated failure. n_dps is UNDERDETERMINED vs Stage B'' only (8
        triples): Stage B'' simply does not report this field in its schema
        (EXACT vs Stage A'' at all 8 cells). The margin_null_randsel field is
        a NEW, UNANTICIPATED finding: DISAGREES at all 8/8 cells against
        Stage B'' only -- Stage B'''s reported value is negative at every
        cell while both J1's own derivation and Stage A'' are positive at
        every cell, a 100%-consistent sign inversion unlike the sporadic,
        partial sign variation seen on `margin` itself. The reviewing task
        could not determine the root cause (undisclosed Stage B''
        sign-convention difference vs a genuine computational discrepancy)
        because reading Stage B'''s source code was out of its declared
        scope; recorded verbatim as DISAGREES, unresolved. One further
        flagged (non-DISAGREES) finding: cell C6 (N=2^24, a=1/8, seed=11)
        shows J1's own derived margin sign (negative) disagreeing with BOTH
        Stage A'' and Stage B'' (both positive) -- textually matching the
        review plan's own named breaking_artifact pattern, scored QUALITATIVE
        rather than DISAGREES because margin is not a definition-exact field
        and all three magnitudes are small at this borderline cell.
    - joint: J2_record_integrity_conformance_and_recompute
      task_id: TASK-20260910-c8cb36
      summary: >-
        Verdict `passed`, `review_attestation.verdict: holds` (scoped to J2's
        own joint). Zero hash mismatches: 7/7 Stage A'' seal files, 8/8 +
        352/352 declared path_sha256 entries across both snapshot receipts
        (360 total path-hash checks against both committed bytes and live
        disk). 200/200 margin identity, 200/200 accounting identity
        (basin_mass_accounting_sum == N plus self-check SATISFIED), 200/200
        residual_fraction identity on all Stage B'' cells, plus a bonus
        200/200 on Stage A'' raw cells for the same three identities (0
        violations anywhere). Bootstrap CIs reproduce bit-for-bit on all 8
        (N,a) aggregate groups from the recorded seeds. Independent
        per-(N,a) recompute of mean margin and k_25 (from raw run summaries,
        no shared code path with the coordinator's own prior recomputation)
        matches the coordinator_prior's own pre-recorded numbers exactly on
        all 8 groups, including max residual fraction (recomputed 0.023177
        vs claimed 0.0232). Stage B'' parameters (T/T_sel/T4/T8/r/seed-count/
        a-grid/scale-grid/kind string/certificate kind/control-arm presence/
        commit-pinned instrument reuse) all conform to v3's `stage_plan_v3`
        exactly; no parameter or method divergence found. Bonus check beyond
        task scope: J1's own frozen cycle_mass, capped_mass, share_top_T,
        share_top_Tsel agree exactly with Stage A'' and Stage B'' at all 8
        frozen cells (96/96 comparisons, 0 disagreements) -- a THIRD
        independent implementation corroborating the exact-partition
        arithmetic, reported as an observation only per J2's own declared
        interpretation boundary.
    - joint: J3_interpretation_and_proves_too_much
      task_id: TASK-20260910-59d885
      summary: >-
        Of the four review-plan-declared objects: D1 ("a=1/8 @ N=2^24 CI is
        a confirmed feasible ONLINE operating point") BREAKS -- certificate.kind
        is "none" at every one of the 50 production runs; the ceiling
        measurement is silent on whether any online mechanism reaches it at
        any batch size U. D2 ("a=1/8 @ N=2^20 is G3-INFEASIBLE") is MIXED:
        the bare, contract-defined 25-seed verdict survives in both readings
        (blind k_25=16/25, production k_25=17/25 independently recomputed
        in-session, both <20), but the unqualified "confirmed infeasible"
        reading breaks (mean margin positive in both readings, bootstrap CI
        straddles zero [-0.00018,+0.00875], the pre-registered 5-seed
        subgroup rule gives the opposite family (verdict_5=G3-FEASIBLE,
        k_5=4/5) at the identical cell); the symmetric "the straddle really
        means feasible" override breaks outright (the contract walls the
        k-rule off from bootstrap override). D3 ("the margin identity on all
        200 cells validates the walk-based estimator") BREAKS on two
        grounds: it is a tautological single-program self-check (margin is
        DEFINED as that subtraction), and Stage B'' is not walk-based at all
        (certificate kind "none", exact-basin closed form). D4 ("the crossing
        bracket is N-stable", and its converse) is reading-dependent: under
        the OUTER-INTERVAL reading (a=1/16 feasible, a=3/16 infeasible, both
        scales, both implementations) N-stability SURVIVES; under the
        BORDERLINE-POINT reading (a=1/8 itself) it BREAKS -- a=1/8 flips
        INFEASIBLE-to-FEASIBLE between N=2^20 and N=2^24 in both
        implementations independently (blind k_25 16->20; production k_25
        17->24 recomputed). Five additional self-generated objects (A1-A3,
        A5) BREAK (categorical agreement overstates quantitative/robustness
        agreement, since the N=2^24 blind confirmation sits at the exact
        k=20 minimum passing count while production sits four seeds clear;
        conflating the INFEASIBLE label with a negative average effect, when
        mean margin is positive in both readings at that cell; compositing
        the contract-forbidden 5-seed and 25-seed rules; extrapolating past
        the two tested N values when the only interior/borderline point
        already reverses between them). A4 SPLITS: the eight-cell EXACT
        agreement across three implementations on definition-exact fields
        validates shared arithmetic correctness but NOT implementation-choice
        robustness, because all three chose the identical splitmix64
        finalizer and K/K_dp formula -- one deterministic functional graph
        computed three times, not three independently-drawn random instances
        agreeing; no cell in this round varies the mix64 choice.

  inference: >-
    The round strengthens, at the tested scope, the exact-basin-partition
    ARITHMETIC underlying this hypothesis's already-recorded ceiling-
    feasibility findings (EV-ECDLP-2e9680, EV-ECDLP-6783b8): a third
    independent implementation, blindly derived from the packet's own text
    with no access to either production implementation, agrees exactly with
    both on every definition-exact field except rho_ORACLE (packet-
    underdetermined, as anticipated) at all 8 frozen cells, and record
    integrity holds with zero discrepancies across 360 path-hash checks and
    496 identity/comparison checks. This is real corroboration, credited
    narrowly at exactly this scope. It does NOT strengthen, and in several
    places actively narrows, the interpretive layer the coordinator_prior
    expected this round to close: no reading survives that treats the a=1/8
    ceiling measurement as an online operating point (D1), that reads the
    margin identity as validating a walk-based estimator that does not exist
    in this package (D3), that states the a=1/8 N=2^20 cell as decisively
    settled in either direction (D2), or that asserts the crossing bracket's
    stability or movement without naming which of two readings is meant
    (D4). A genuinely new anomaly (margin_null_randsel's 8/8 sign inversion
    against Stage B'' only) is recorded, unresolved, per core rule 8. Net
    effect: the ceiling-feasibility measurements this hypothesis's clause
    (C1) already rests on are now better-verified at the arithmetic level and
    more precisely scoped at the interpretive level; nothing here changes
    what kind of claim a ceiling-only, zero-online-arm result can support.

  boundaries:
    - >-
      N in {2^20, 2^24}; a in {1/16, 1/8, 3/16, 1/4}; T/T_sel/T4/T8 =
      64/32/16/8 at N=2^20 and 256/128/64/32 at N=2^24; r=2; 25 seeds per
      (N,a) cell for the full 200-cell integrity/recompute (J2); 8 frozen
      cells only for the three-way cross-implementation comparison (J1
      phase 1/2, J2's bonus check). Exact-basin closed form (Stage B'') and
      full exact enumeration (Stage A'', J1); zero online re-selection arms
      anywhere in this record; certificate.kind "none" at every one of the
      50 inspected production runs.
    - >-
      claim_tier toy; constant-factor under KN-LIT-013; no exponent moves and
      none is claimed; no algorithm is even run in any of the three reviewed
      implementations (exact enumeration only, no walk-based sampling).
    - >-
      `supports` is scoped to the definition-exact, ceiling-level arithmetic
      corroboration and record-integrity/conformance finding ONLY (J1 phase
      1/2's ten always-EXACT fields; J2's 360 hash checks and 496
      identity/comparison checks, all zero-discrepancy). It is explicitly
      NOT a claim that any interpretive reading the coordinator_prior
      anticipated survived unqualified (D1, D3 both break cleanly; D2 and D4
      break in their unqualified forms and require the disambiguation stated
      in `observations` above); NOT a claim about an achievable online
      RESEL-L operating point at any a (zero online arms run); and NOT a
      claim that this round changes H-ECDLP-37dc01's `status`.
    - >-
      The 200-cell J2 recompute verifies Stage B'''s own internal identities
      and conformance to v3's contract at every one of its 200 cells, but the
      three-way cross-implementation COMPARISON (the part that lets this
      record speak to a third independent implementation) covers only the 8
      frozen cells the review plan named; nothing here extends the
      three-way-comparison finding to the other 192 Stage B'' cells.

  unresolved_confounds:
    - >-
      margin_null_randsel: Stage B'''s reported "control_k_null_randsel_pool_margin"
      is negative at all 8/8 frozen cells while both J1's own from-scratch
      derivation and Stage A'''s independent blind re-derivation are positive
      at all 8/8 cells -- a perfect, 100%-consistent sign inversion isolated
      to exactly this one of four null-arm controls (the other three --
      oracle-uniform, oracle-size-biased, cov_static_shuf -- agree in sign
      across all three implementations at every cell). J1 phase 2 could not
      determine whether this reflects an undisclosed sign-convention
      difference in Stage B'''s own definition of this control (a legitimate,
      if undisclosed, implementation choice) or a genuine computational
      discrepancy against the packet's own NULL-RANDSEL definition, because
      reading Stage B'''s source code was out of its declared scope.
      Recorded here per core rule 8 (unexpected observations must be
      recorded, not silently discarded); NOT resolved by this record or by
      any cited report, and not read as evidence for or against
      H-ECDLP-37dc01 in either direction on its own.
    - >-
      rho_ORACLE: UNDERDETERMINED at all 8 frozen cells against both Stage
      A'' and Stage B'' (16 of the round's 24 UNDERDETERMINED triples),
      because the derivation packet supplies no formal definition of this
      quantity anywhere (quantity.md s12 names it only parenthetically; J1's
      own working definition was supplied and flagged as such). This is one
      of the four fields the review plan itself named as "supposed to be
      definition-exact," so the underdetermination is a genuine, disclosed
      gap in the packet's own text -- carried forward here as an open
