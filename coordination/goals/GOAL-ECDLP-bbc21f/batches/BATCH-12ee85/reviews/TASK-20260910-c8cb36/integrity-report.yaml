    - >-
      The seal's "declared before any non-packet read" ordering claim is
      corroborated (origin commit contents + timestamps + packet-hash
      attestation) but no read-event transcript exists inside the package,
      so it is not machine-auditable step-by-step.
    - >-
      J2 recomputed Stage B'' structural quantities from the recorded raw
      arrays (basin sizes, DP ids, pool arrays, null arrays). It did NOT
      re-run the instrument from its seed to regenerate the arrays
      themselves; that regeneration-level reproduction belongs to a
      re-execution control, which this round's plan does not assign to J2.

