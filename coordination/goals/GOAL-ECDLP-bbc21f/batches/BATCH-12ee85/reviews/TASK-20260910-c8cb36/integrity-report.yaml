      (only basin_mass_accounting_sum, which per
      experiments/EXP-ECDLP-6ac801/source/run_stageb_v3.py is already computed
      as sum_d b(d) + cycle_mass + capped_mass). The checkable identity from
      Stage B'''s actual reported fields is therefore
      basin_mass_accounting_sum == N, corroborated by the producer's own
      self_check_o1_basin_mass_accounting flag and by min_basin_size >= 1.
    identity: "basin_mass_accounting_sum == N AND self_check_o1_basin_mass_accounting == SATISFIED AND min_basin_size >= 1"
