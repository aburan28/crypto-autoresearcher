  # ==========================================================================
  # (d) BOOTSTRAP CI REPRODUCTION (STAGE A'')
  # ==========================================================================
  - check: bootstrap_ci_reproduction_stage_A_pp_8_of_8_groups
    method: >-
      Read run_full.py to find the EXACT seed-derivation and bootstrap
      procedure actually implemented (not assumed): boot_seed = 20260907 +
      1000*n_bits + round(10000*float(a)); n_bits = N.bit_length()-1;
      np.random.default_rng(boot_seed); B=10000 resamples of size 25 with
      replacement via rng.integers(0,25,size=(10000,25)); ci_lo/ci_hi =
      2.5th/97.5th percentile of resample means. Reproduced this exactly from
      raw per-seed margins parsed from cells.jsonl (in file order, verified
      to be seeds 1..25 in order for every (N,a) group), for ALL 8 (N,a)
      groups (task asked for "at minimum the 8 frozen cells J1 addressed";
      all 8 (N,a) aggregate groups were reproduced, which is a superset
      covering every frozen cell's (N,a) family).
    groups_checked: 8
    results:
    - {N: 1048576, a: 1/4, boot_seed: 20283407, seed_match: true, ci_lo_match: true, ci_hi_match: true, mean_match: true}
    - {N: 1048576, a: 1/8, boot_seed: 20282157, seed_match: true, ci_lo_match: true, ci_hi_match: true, mean_match: true}
    - {N: 1048576, a: 1/16, boot_seed: 20281532, seed_match: true, ci_lo_match: true, ci_hi_match: true, mean_match: true}
    - {N: 1048576, a: 3/16, boot_seed: 20282782, seed_match: true, ci_lo_match: true, ci_hi_match: true, mean_match: true}
    - {N: 16777216, a: 1/4, boot_seed: 20287407, seed_match: true, ci_lo_match: true, ci_hi_match: true, mean_match: true}
    - {N: 16777216, a: 1/8, boot_seed: 20286157, seed_match: true, ci_lo_match: true, ci_hi_match: true, mean_match: true}
    - {N: 16777216, a: 1/16, boot_seed: 20285532, seed_match: true, ci_lo_match: true, ci_hi_match: true, mean_match: true}
    - {N: 16777216, a: 3/16, boot_seed: 20286782, seed_match: true, ci_lo_match: true, ci_hi_match: true, mean_match: true}
    result: "8/8 groups reproduce bootstrap_seed_used, ci_lo, ci_hi, and mean_margin bit-for-bit exactly (Python float ==)."
  - check: k_25_k_5_mean_margin_independent_recompute_stage_A_pp
    result: >-
      All 8 (N,a) groups: independently recomputed k_25 (count margin>=0
      of 25), k_5 (count margin>=0 of first 5 seeds), and mean_margin
      directly from cells.jsonl margins; all match Stage A'''s own
      summary.json exactly (k25=3/16/25/11/2/20/25/9 respectively per
      the 8 groups; see recomputations above). 0 mismatches.
  - check: j1_frozen_cell_cross_implementation_corroboration_bonus
    note: >-
      Beyond the task's stated scope: cross-checked the 8 frozen cells'
      cycle_mass, capped_mass, share_top_T, and share_top_Tsel values as
      recorded in the FROZEN J1 report (blind-rederivation.yaml,
      TASK-20260910-19bd7b, phase-1 frozen, phase_2 status: not-started)
      against the corresponding Stage A'' (cells.jsonl) and Stage B''
      (run summaries) values at the SAME (N, a, seed).
      This is permitted reading (J1 is the frozen report this task's inputs
      explicitly name as readable) and required no re-derivation; it
      strengthens rather than substitutes for the required checks above.
    result: >-
      All 8 frozen cells: J1's from-scratch blind derivation, Stage A'''s
      blind re-derivation, and Stage B'''s production exact-basin
      computation agree EXACTLY (bit-for-bit on the reported floats, and
      exactly on the integer cycle_mass/capped_mass) on cycle_mass,
      capped_mass, share_top_T, and share_top_Tsel at every one of the 8
      frozen (N, a, seed) triples. 0 disagreements across 3 independent
      implementations x 8 cells x 4 fields = 96 comparisons.
    interpretation_boundary: >-
      This is reported as an OBSERVATION only, exactly the schema this task
      is bound to. It corroborates, without further comment, the Stage B''
      snapshot receipt's own disclosed `observation_for_stage_cpp` (a 6-of-200
      spot check finding the same pattern) now against a THIRD independent
      implementation (J1) and against all 8 frozen cells rather than 6. No
