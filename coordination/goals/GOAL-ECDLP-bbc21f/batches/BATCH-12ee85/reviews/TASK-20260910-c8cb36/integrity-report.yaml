      enumeration (raw basin_sizes/basin_dps arrays present per cell), the
      STATIC(T)_{r=2} coverage read exactly from the same partition via the
      recorded pool, and the four null arms read off the same partition. No
      online re-selection arm exists in any of the 50 runs. CONTRACT-
      CONFORMANT on method as well as on parameters.
    observations_only_adjudication: >-
      Regex scan of both packages (Stage A'' seal/summary/attestation/notes/
      run.log/instrument/run_full; Stage B'' run_stageb_v3.py and
      implementation.md) for interpretation-language patterns
      (confirm/prove/demonstrate/validate, feasible operating point,
      hypothesis support/refute/promote, N-extrapolation, crossing
      confirmed/robust/stable): ZERO hits in either package. Both packages
      record; neither interprets. The Stage B'' certificate is explicitly
      kind "none".

  # --------------------------------------------------------------------------
  observations_no_interpretation:
    - >-
      Stage A'' and Stage B'' per-seed margin magnitudes differ at the same
      (N, a, seed) cells (e.g. N=2^20 a=1/16 s=1: Stage A margin +0.008420
      vs Stage B +0.019553), as does cov_static (0.099824 vs 0.088691) --
      recorded as an observation of method/seed-convention difference between
      an independently keyed blind instrument and the production exact-basin
      closed form. Whether this constitutes the expected qualitative
      agreement is NOT adjudicated here; it is the composed round's work.
    - >-
      Bootstrap CIs computed by the identical frozen procedure on the Stage
      B'' margins (observation only, no comparison drawn): a=1/8 at 2^20
      [+0.00194, +0.01209] (does not straddle zero); a=1/8 at 2^24
      [+0.00770, +0.01277] (does not straddle); a=1/16 both scales positive
      and excluding zero; a=3/16 and a=1/4 negative and excluding zero at
      both scales.
    - >-
      Ties at the T-th pool weight occur at 173 of 200 production cells
      (n_tied between 2 and 9), i.e. the tie-break key stream is exercised
      pervasively, not vacuously.

  verdict: passed
  limitations:
    - >-
      Tie-break reproducibility: at the 173/200 cells with a tie at the
      T-th weight, the tie-break RNG stream is not recorded, so the exact
      STATIC(T) selection SET is not independently recomputable from the
      recorded arrays; boundary consistency (selected weights >= T-th,
      unselected <= T-th) was verified instead, and the tie COUNTS
      themselves match the recorded field on 200/200.
    - >-
      NULL-SHUF cov_static_shuf is not independently recomputable (permutation
