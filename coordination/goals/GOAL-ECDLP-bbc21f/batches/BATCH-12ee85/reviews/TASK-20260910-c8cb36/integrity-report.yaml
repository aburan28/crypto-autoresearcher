  # --------------------------------------------------------------------------
  params_vs_stage_plan_conformance:
    verdict: conformant
    detail:
      - "N in {2^20, 2^24}: 50/50 runs"
      - "T = 64 at 2^20 / 256 at 2^24 (frozen T_OF_NBITS): 50/50"
      - "T_sel = T/2 (32 / 128): 50/50"
      - "T4 = T/4, T8 = T/8 (control (l)/(m) readings): 50/50"
      - "r = 2: 50/50"
      - "a_grid = {1/16, 1/8, 3/16, 1/4} exactly: 50/50"
      - "seeds 1..25 per scale, walk_key_seed == run seed: 50/50"
      - "kind = stageBpp_exact_ceiling_v3: 50/50"
      - "zero online re-selected (RESEL-L) arms, certificate kind none: 50/50 (manifest text + certificate note)"
      - "any_cell_invalid false on 50/50"
      - "N = 2^20 arm committed before the 2^24 arm in the snapshot commit's staged path order (n20 runs precede n24 runs)"
    method_adjudication: >-
      v3 stage_plan_v3 STAGE B'' specifies "PRODUCTION, exact-basin
      generation ... Zero online re-selected (RESEL-L) arms -- this is an
      exact-enumeration measurement only, as in v1", with the control arms
      (i)-(iv) and the T/4, T/8 readings added on the same exact basin
