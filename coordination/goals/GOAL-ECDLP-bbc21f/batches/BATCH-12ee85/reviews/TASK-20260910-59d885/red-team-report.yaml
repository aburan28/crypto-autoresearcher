        BOTH, but of two different things, and the distinction matters.
        (1) THE MARGIN IDENTITY IS EXACT BY CONSTRUCTION: `margin ::=
        exact_top_T_sel_share - static_T_r2_exact_coverage` is how margin is
        DEFINED (quantity.md s7); it is a tautology that holds in any correct
        implementation and its "SATISFIED" self-check (o3, run_stageb_v3.py
        lines 176-189) verifies only that the program performed its own
        declared subtraction without a coding error. This can never fail to
        hold except by an implementation bug, so its holding on all 200
        cells is a (useful, but narrow) arithmetic sanity check, not a
        finding about the world. (2) THE NUMERIC VALUES THEMSELVES (b(d),
        n_dps, cycle_mass, capped_mass, share_top(k), cov_static) ARE EXACT
        BY COMPUTATION, not by construction: nothing in the definitions
        GUARANTEES their particular values; they are the deterministic
        output of exhaustively enumerating a SPECIFIC seed-derived
        functional graph (quantity.md s4: "Compute dist exactly by full
        enumeration") with zero statistical/sampling error -- as opposed to
        being ESTIMATED via a walk-based Monte Carlo process (which is what
        v1/v2's original online arm did, and what "exact-basin closed form"
        in the Stage B'' certificate note is explicitly contrasted against).
        "Exact" therefore means "computed by errorless full enumeration of a
        fixed instance," not "provably fixed by the definitions alone."
        (3) "CEILING" IS A ROLE LABEL, NOT A PROVEN UPPER BOUND OVER ALL
        ALGORITHMS. It names the errorless value of the weight_d-based
        selection statistic that a real, budget-limited online walk-based
        estimator would only approach noisily and with finite exploration.
        specification.v3.yaml states this precisely: G3-feasibility is "a
        CEILING test (can a re-selected table exceed static's coverage in
        principle)" -- "in principle" is the tell that this is a best-case
        reference computed under an idealization (exhaustive enumeration, no
        walk budget) rather than a mathematically demonstrated bound on
        every possible online selection heuristic's achievable coverage.
        Whether ANY online mechanism can reach this errorless value at any
        finite budget U is exactly the unresolved question D1 breaks on.
      evidence_cited:
        - "experiments/EXP-ECDLP-6ac801/derivation-packet/PA-ECDLP-6ac801-v2-to-v3/quantity.md s4, s7"
        - "experiments/EXP-ECDLP-6ac801/source/run_stageb_v3.py lines 176-189"
        - "experiments/EXP-ECDLP-6ac801/runs/RUN-ECDLP-6ac801-v3-n20-s01/summary.json certificate block"
        - "experiments/EXP-ECDLP-6ac801/specification.v3.yaml interpretation bullet 2 (lines 1852-1861)"

    - item: (b) epistemic status of the a=1/8, N=2^20 straddled-CI cell
      answer: >-
        WHAT CAN HONESTLY BE SAID. (i) By the contract's own resampling-free
        rule, this cell is G3-INFEASIBLE in both independently-implemented
        readings: k_25=16/25 (Stage A'') and k_25=17/25 (Stage B'',
        recomputed in-session), both < 20. (ii) The mean margin is POSITIVE
        in both readings (+0.0043 blind, +0.0069 production) -- the
        INFEASIBLE label reflects a strict 20-of-25 seed supermajority rule,
        not a negative average effect (A2). (iii) The pass-count sits close
        to, not decisively below, the k>=20 threshold: a swing of 3-4 seeds
        (12-16 percentage points) separates this cell from a FEASIBLE
        verdict. (iv) The bootstrap CI on the mean margin straddles zero
        (Stage A'': [-0.00018, +0.00875]); the contract computes this
        specifically because "one downstream label depends on whether it
        straddles zero" (quantity.md s11) -- it is a designed indicator of
        exactly this kind of ambiguity, not noise to discard. (v) The
        seeds-1..5 subgroup rule gives the OPPOSITE categorical family
        (verdict_5=G3-FEASIBLE, k_5=4/5) at this identical cell, in both
        readings -- two of the contract's own pre-registered rules disagree
        at this cell. (vi) Two independently-seeded pool-selection
        implementations corroborate the direction (both INFEASIBLE by the
        25-seed rule, both with positive mean margin, both with the same
        5-seed/25-seed split) despite differing in the exact pass-count.
        WHAT CANNOT HONESTLY BE SAID. "Confirmed infeasible" in a strong,
        settled sense -- the margin is close to the exact resampling-free
        boundary and the CI straddles zero, which is the contract's own
        signal that this cell does not cleanly separate. "Really feasible"
        because of the straddle or the subgroup reading -- both would
        override or composite a rule the contract explicitly forbids
        overriding (D2(iv), A3). "The two implementations agree closely at
        this cell" in a magnitude sense -- k differs by 1/25 and mean margin
        by ~63% relative (0.0043 vs 0.0069) even though the categorical
        label and mean-margin sign agree. THE HONEST STATEMENT: this cell is
        a genuinely underpowered, borderline operating point by every
        measure the contract itself computes for it, whose 25-seed verdict
        happens to be INFEASIBLE in both implementations, with a positive
        mean effect too small and too close to the threshold for that
        verdict to be read as decisive.
      evidence_cited:
        - "coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-4433c1/reviews/TASK-20260907-7afa98/summary.json (a_den=8, N=1048576 entry, full)"
        - "in-session recomputation from the 25 RUN-ECDLP-6ac801-v3-n20-s*/summary.json files"
        - "objects D2, A2, A3 above"

    - item: (c) is any N-extrapolation beyond N=2^24 supportable from this data?
      answer: >-
        NO -- shown by the data, not merely asserted. Two independent
        arguments, both grounded in what was actually measured: (1) The
        contract's own text states two points cannot establish a trend
        (specification.v3.yaml interpretation, v3 amendment, quoted in full
        under A5) -- this is definitional, not something this batch's data
        could overturn even if it wanted to, since the grid literally
        contains N in {2^20, 2^24} and nothing else. (2) Substantively: the
        one a-value in this grid positioned to test monotonic-in-N behavior
        at the crossing point -- a=1/8 -- does NOT behave monotonically or
        stay put; it reverses categorical verdict between the two tested
        points (D4), a reversal reproduced independently in both
        implementations (k_25 16->20 blind, 17->24 production). A series
        whose only interior/borderline data point already reverses across
        the only two measured scales gives no basis to project a third,
        much larger scale in either direction; the reversal itself is
        explicitly flagged by the contract as something "this hypothesis's
        model does not currently predict" (spec v3 lines 1862-1869), meaning
        there is not even an unvalidated model on file to extrapolate WITH.
        Any statement about behavior at N=2^30 or at cryptographic N is
        therefore not licensed by anything in this record set; it would be
        pure conjecture dressed as inference from data that does not speak
        to it.
      evidence_cited:
        - "D4 and A5 above"
        - "experiments/EXP-ECDLP-6ac801/specification.v3.yaml lines 1862-1869, 1884-1890"

