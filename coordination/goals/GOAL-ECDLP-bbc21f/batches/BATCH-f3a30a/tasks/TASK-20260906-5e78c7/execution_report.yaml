  protocol_deviations:
    - >-
      ITEM A JUDGMENT CALL (own, disclosed): the contract's g3_gate_procedure
      names a "SAMPLED ORACLE(T_sel)" reading at N=2^30 without specifying
      how to obtain it, and the amendment's own judgment_calls explicitly
      declined to invent one. This executor built ORACLE_SAMPLED(T_sel): top-
      T_sel DPs of an AUXILIARY r=32 pool (walks not charged to the
      algorithm's own P) ranked by raw hit-count, measured through the same
      k=4-restart online walk sequence as every other arm. A first attempt
      (r=2 online pool + bare single-walk fixture hit rate) was internally
      inconsistent (produced a "ceiling" reading BELOW STATIC(T)'s own
      coverage on the identical pool, which is impossible for a genuine
      ceiling) and was replaced before any run was recorded as a deliverable;
      both attempts and the reasoning are disclosed in source_v2/IMPLEMENTATION.md.
      This reading remains explicitly INFORMATIONAL and non-binding at N=2^30,
      exactly as the contract requires; it is never used to gate S1/F1.
    - >-
      ITEM C SIMPLIFICATION (own, disclosed): S2_v2's magnitude condition
      ("<= 0.5x the RESEL-L gain point estimate AT THE SAME ROUND") is
      evaluated once at the U=8T steady-state window in this analysis code,
      not recomputed at each of the 16 rounds against that round's own
      RESEL-L gain (the CI-separated-above-zero condition IS checked at
      every round). Given the measured magnitude (NULL-A's perturbation
      0.16-0.17 versus RESEL-L's own gain 0.06-0.08, i.e. 2-3x the effect
      size, matching v1's own finding), a full per-round recomputation is not
      expected to change the qualitative S2_v2 verdict (NOT MET in every
      cell measured), but this was not implemented under this task's effort
      budget. Disclosed here and in source_v2/IMPLEMENTATION.md as an open
      item for Validator/Red Team review.
    - >-
      GATE G1 AT N=2^20 for the real object (unchanged from v1, per the
      contract's own text) was NOT RE-DERIVED by this task: it is CITED from
      v1's own already-computed, already-reported result
      (experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-037/ci_tables.json
      gates block: G1_literal_all_four = true at both 2^20,a=1/4 and
      2^20,a=1/2), since v2 changes nothing about the instrument's basin law
      itself (only the pool-admission/gate/reporting logic around it) and
      the contract's own field_provenance does not name a G1 re-measurement
      as one of items (a)-(h). The PERMANENT NEGATIVE FIXTURE check (item g)
      IS freshly re-run by this task's own analysis code (see below) and is
      not merely cited.
    - >-
      STATIC2T, RSWEEP, RSWEEP-R, NULL-B, PHI arms and the r in {4,8} sweep
      at the v2 T_sel grid are NOT run by this task: the v2 contract's own
      stage_plan restricts STAGE 1v2/2v2 to a=1/4, r=2 only ("STATIC(T),
      STATIC(T_sel), RESEL-L(T_sel), NULL-A(T_sel), CAP(2T, T_sel),
      ORACLE(T_sel), RHO"); the retained r-sweep/PHI/NULL-B mechanism clauses
      (S3, S5, S6) already stand on v1's own measurements per the contract's
      success_criterion ("v1's own S3, S4, S5, S6 results already stand as
      toy-scale support ... not required to be re-measured to hold") and are
      not re-run here. This is not an omission but the contract's own scope.

