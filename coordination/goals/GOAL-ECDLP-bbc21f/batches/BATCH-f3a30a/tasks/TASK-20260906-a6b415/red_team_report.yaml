  proof_architecture_challenges: []
  narrowest_supported_statement: 'On the two joints assigned to this task: J3''s per-admission pool-cap
    mechanism is correctly implemented and its S_peak_bits headline is verified, by independent code trace
    and by direct inspection of every tested run''s raw summary.json (20/20 CAP(2T,T_sel) cells), to equal
    exactly 2T*bits_per_pool_entry, with the frontier tuple reported as a bundled JSON object (never a
    bare ratio) in both the raw ci_tables.json and the human-readable reports -- HOLDS, with two non-breaking
    findings about the robustness of that guarantee''s internal wiring and about an unreported CI on a
    secondary "retention" metric. J4''s item (g) fix (fit_cutoff None -> G1 FAIL, never crash) is independently
    confirmed twice (a direct re-run of the production check, and a deliberate reintroduction of the pre-fix
    bug that confirms it would genuinely crash on these fixtures) -- HOLDS. The broader "proves-too-much"
    control the review plan also asks for (does the corrected HEUR-BLT-7 / re-selection mechanism collapse
    to no gain on a structurally null bijection object) was NOT exercised by anything in the batch under
    review; when I constructed and ran that test myself against the real, unmodified v2 production code,
    it also collapsed to no positive gain in every tested cell, corroborating the claim -- but this is
    red-team-supplied evidence filling a real gap in the deliverable, not evidence that the deliverable
    itself contains this check. This narrow conclusion does not extend to J1 or J2 (the ceiling-feasibility
    gate and the Stage-0 a-scan ordering claim), which this task did not review and could not read.'
