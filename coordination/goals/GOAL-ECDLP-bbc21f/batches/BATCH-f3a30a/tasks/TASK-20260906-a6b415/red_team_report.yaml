  counterexample_or_mutation: 'For J4 Part 1, deliberately reintroduced the pre-fix (v1-style) unguarded
    dict indexing ("x[''cutoff''][''n_c_theta2_over_2'']" plus a bare "0.5 <= nc <= 2.0" with no is-not-None
