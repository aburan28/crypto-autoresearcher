    anomaly" without relying on prose.'
  - 'J3: compute S_peak_bits directly from res.max_pool_within_round (already tracked) rather than from
    the separately-tracked res.max_pool, removing reliance on the currently-true-but- unstated invariant
    that the two must coincide whenever the validity gate passes.'
  - 'J4: commit a v2-native permutation-null (and/or affine-xorshift-null) fixture that runs the FULL
    v2 arm list (RESEL-L, CAP, HEUR-BLT-7-v2 regression, frontier tuple) through source_v2/run_generic.py''s
    own code path, with its own frozen expected result (gain <= 0 at every T_sel), as a permanent STAGE
