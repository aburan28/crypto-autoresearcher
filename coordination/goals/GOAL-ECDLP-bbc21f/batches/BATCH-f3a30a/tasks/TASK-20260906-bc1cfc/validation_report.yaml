    result: 'G3(0.65T) at N=2^30 correctly reported "FAIL (informational)" with binding=false as labelled,
      BUT S1_v2(0.65T) and F1_v2(0.65T) STILL became UNTESTABLE there -- identically to the binding N=2^24
      case. The `binding` flag is cosmetic in the current code (analysis.py:350-355, 400): `g3_pass =
      g3v["G3_verdict"]. startswith("PASS")` is computed the same way and consumed the same way regardless
      of nb.'
    finding: 'This CONTRADICTS a specific claim in the executor''s own execution_report.yaml (protocol_deviations,
      "ITEM A JUDGMENT CALL"): "This reading remains explicitly INFORMATIONAL and non-binding at N=2^30,
      exactly as the contract requires; it is never used to gate S1/F1." Directly tested: it IS used to
      gate S1/F1 at N=2^30, identically to N=2^24. This did NOT affect any verdict actually reported in
      this batch, because all four tested cells (including both N=2^30 cells) passed G3 5/5 in the real
      run -- so no reported S1_v2/F1_v2 line in execution_report.yaml or ci_tables.json is wrong. The
      behavior is also on the SAFE side of the joint''s own breaking-artifact definition: it fails toward
      UNTESTABLE, never toward a silently-defaulted PASS. But it is a genuine inaccuracy in the executor''s
      own disclosure, and it surfaces a real ambiguity in specification.v2.yaml''s own text (`inputs.
      g3_gate_procedure` / the "G3 CEILING-FEASIBILITY GATE" control both state a blanket "G3 FAIL ->
      S1/F1 UNTESTABLE" with no N-conditioned exemption, so the CODE''s behavior is arguably contract-compliant
      and it is the EXECUTOR''S DISCLOSURE TEXT that overstates the "non-binding" character of the informational
      reading) that a future amendment should resolve explicitly one way or the other.'
    verdict: FINDING (not a breaking artifact per the joint's own definition; a disclosure-accuracy and
      contract-clarity issue)
