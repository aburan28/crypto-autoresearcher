    known_methodological_difference_disclosed: My basin resolution does NOT apply the contract's 8W-step
      walk cap when determining basin membership (I trace any finite path to its DP or to a DP-less cycle,
      with no length cap); the executor's exact_basins() (instrument.py) DOES apply the cap, excluding
      longer-than-8W tails from `capped_mass` (contributing to neither a DP's basin nor `cycle_mass`).
      At W=64 (N=2^20,a=1/4) this affects an expected ~(1-1/W)^(8W) ~ e^-8 ~ 0.03% of points, far smaller
      than the seed-to-seed spread (~13-16 percentage points) that dominates both derivations' variance,
      so it does not explain or call into question the observed agreement, but it means my derivation
      is not a bit-identical replication of the contract's own exact-basin definition. Disclosed per the
