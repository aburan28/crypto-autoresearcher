j2_seal_manifest:
  purpose: >-
    Seals the J2 blind re-derivation of rho_ORACLE(a, r) at a in {1/4, 1/2},
    N=2^20, r in {2,4,8}, BEFORE opening any of the task's declared
    blind_from paths (experiments/EXP-ECDLP-612fb1/source_v2/,
    experiments/EXP-ECDLP-612fb1/runs/,
    coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-f3a30a/tasks/TASK-20260906-5e78c7/).
  sealed_at_utc: '2026-09-06T23:22:26Z'
  sources_read_before_writing_this_script: # in order
    - agents/validator.md
    - AGENTS.md
    - ledger/handoffs/TASK-20260906-bc1cfc.yaml
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-f3a30a/tasks/TASK-20260906-bc1cfc/task_card.yaml
    - experiments/EXP-ECDLP-612fb1/specification.v2.yaml
    - experiments/EXP-ECDLP-612fb1/amendments/v1_to_v2.yaml
  note_on_allowed_sources: >-
    specification.v2.yaml and amendments/v1_to_v2.yaml are explicitly listed
    in the handoff's `inputs` and are NOT members of the task's
    `blind_rederivation.blind_from` set (which names only source_v2/, runs/,
    and TASK-20260906-5e78c7/). Reading the frozen contract that STATES the
    quantity and its exact basin-partition definitions is the derivation's
    own required starting point, not a violation of blindness -- blindness
    here is from the EXECUTOR'S IMPLEMENTATION AND RESULT, not from the
    contract that defines the quantity being derived.
  artifacts_sealed:
    - path: j2_blind_derivation.py
      sha256: b4baadfed7eabad1f2ab882e05a179bf85bb882242a533aabc7dabd0f4965867
    - path: j2_output.json
      sha256: 8bddf589eac095978926720f17be2d28bf6add821e086e58cbfa76e6dc16bb32
    - path: j2_stderr.log
      sha256: 0330a37d7fda06b8c828f4801faa44f4c209ba662364df66f914776f78787019
  headline_result_sealed:
    rho_ORACLE_a_quarter_r2_mean_5seeds: 0.57768
    rho_ORACLE_a_quarter_r2_range: [0.5155, 0.6434]
    rho_ORACLE_a_half_r2_mean_5seeds: 0.66812
    rho_ORACLE_a_half_r2_range: [0.6162, 0.6927]
    ordering_a_quarter_lt_a_half_at_r2: true
    ordering_a_quarter_lt_a_half_at_r4: true
    ordering_a_quarter_lt_a_half_at_r8: true
  sealing_method: >-
    This manifest is written and committed to the task directory's working
    tree with a wall-clock UTC timestamp taken from `date -u` immediately
    after the script's run, and the sha256 digests of the script and its
    exact stdout/stderr are recorded above. This git worktree has no
    external notarization service available to this role; the seal's
    integrity rests on (a) this manifest being written before any
    blind_from path is opened (attested in the validation_report's
    `review_attestation.sources_read`, which records read order), and (b)
    the fact that the script and its output are content-addressed by
    sha256, so any later tampering with either file after this point would
    change its hash and be detectable against this record.
  disclosure: >-
    No blind_from path (experiments/EXP-ECDLP-612fb1/source_v2/,
    experiments/EXP-ECDLP-612fb1/runs/, or
    coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-f3a30a/tasks/TASK-20260906-5e78c7/)
    had been opened by this session at the time this manifest was written.
    The validation_report.yaml's review_attestation records the full,
    honest read order for independent audit.
