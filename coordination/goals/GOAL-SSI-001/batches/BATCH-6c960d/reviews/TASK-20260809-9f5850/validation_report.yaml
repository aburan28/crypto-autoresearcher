        - experiments/EXP-SSI-1d0f36/specification.yaml:1-43,395-463@840212b06599eed472a8b937aab027b0255d91d9
    - id: EB-SSI-4
      check: snapshot_receipt_internal_post_commit_fields
      status: caveat
      evidence: >-
        The queue archive and Git verifier correctly bind the snapshot commit and
        all four path hashes, but the immutable snapshot-receipt JSON itself
        retains commit_sha=null, an empty path_sha256 object, and
        verification.status=pending_post_commit. This does not invalidate the
