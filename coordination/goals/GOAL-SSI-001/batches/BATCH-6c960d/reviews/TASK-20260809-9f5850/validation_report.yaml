      reference: experiments/EXP-SSI-1d0f36/specification.yaml:280-285@840212b06599eed472a8b937aab027b0255d91d9
    - id: CTRL-SSI-10
      control: CTRL-S-P-HARDCODED
      status: verified_as_preregistered_design_only
      evidence: >-
        The full distinct V_p order-tagged table is explicitly a symbolic
        known-answer corner and is not evidence that a random sampler builds it
        at the same charge. It was not executed.
      reference: experiments/EXP-SSI-1d0f36/specification.yaml:286-291@840212b06599eed472a8b937aab027b0255d91d9
    - id: CTRL-SSI-11
      control: CTRL-RANDOM-ADVICE
      status: declared_byte_matched_but_incomplete_acceptance_specification
      evidence: >-
        The control fixes a same-width typed record and index, distinct curve
        sampling, independently generated SHAKE256 payload bytes, validity_tag=0,
        the identical lookup/parse/validation/walk/restart/budget path, a
        no-witness output gate, and a separate 32-byte seed requirement. The
        contract does not itself give a concrete finite-size tolerance or
        statistic for deciding the forced T_inc outcome; the freeze receipt is
        only prospective. No null result was observed.
      reference: experiments/EXP-SSI-1d0f36/specification.yaml:292-309@840212b06599eed472a8b937aab027b0255d91d9
    - id: CTRL-SSI-12
      control: CTRL-SHUFFLED-FIBER
      status: declared_byte_negative_but_incomplete_acceptance_specification
      evidence: >-
        The treatment curve IDs and order payloads are preserved byte-for-byte,
        payloads are assigned across curve IDs by a recorded deterministic
        permutation, and curve/order identity is checked before witness
        acceptance; reinterpretation is forbidden and charged as failure. The
        contract does not pin the permutation construction, finite-size
        tolerance, or acceptance statistic beyond the forced-result sentence.
        No shuffled result was observed.
      reference: experiments/EXP-SSI-1d0f36/specification.yaml:310-320@840212b06599eed472a8b937aab027b0255d91d9
    - id: CTRL-SSI-13
      control: CTRL-C-PAIR-NULL
      status: verified_as_scoped_design_only_with_unresolved_numeric_gate
      evidence: >-
        The null is restricted to Construction C, matches treatment marginals,
        pair count, endpoint encoding, and lookup path, and removes the declared
        middle-factor correlation. H-ADV-4 is separately registered as
        unverified and conditional; the diagnostic requires a binned collision
        statistic, identical seeds/bins/access, and a declared tolerance before
        any C row. No pair statistic was executed.
      references:
        - experiments/EXP-SSI-1d0f36/specification.yaml:236-248,321-330@840212b06599eed472a8b937aab027b0255d91d9
        - experiments/EXP-SSI-1d0f36/specification.yaml:340-350@840212b06599eed472a8b937aab027b0255d91d9
    - id: CTRL-SSI-14
      control: CTRL-NEARBY-ORIENTED
      status: verified_as_non_gating_diagnostic
      evidence: >-
        The oriented/CSIDH-shaped nearby object is explicitly typed as a
        non-gating sanity diagnostic with no forced result. Its distinct problem
        type cannot validate or refute the SSI frontier; if run later, its input,
        baseline, and output encoding must be recorded.
      reference: experiments/EXP-SSI-1d0f36/specification.yaml:331-338,267-270@840212b06599eed472a8b937aab027b0255d91d9

  heuristic_validation_checks:
    - id: HV-SSI-6
      check: fixed_advice_worst_case_quantifier_and_H-ADV-1_diagnostic_scope
      status: verified_as_explicitly_separated_unverified_models
      evidence: >-
        A_p is fixed after p and before E, cannot depend on E, and query cost is
        expectation over query randomness only with E at the worst case in V_p.
        Advice-generation randomness is charged to T_build. H-ADV-1-W is
        unverified and restricted to named branches; H-ADV-1-R is an unverified
        toy random-set/sampled-start diagnostic that explicitly cannot establish
        H-ADV-1-W. No universal hitting claim is promoted.
      references:
        - experiments/EXP-SSI-1d0f36/specification.yaml:74-97@840212b06599eed472a8b937aab027b0255d91d9
        - experiments/EXP-SSI-1d0f36/specification.yaml:201-219,263-266,347-350@840212b06599eed472a8b937aab027b0255d91d9
    - id: HV-SSI-7
      check: exact_rational_sigma_labels_and_typed_A_B_C_records
      status: verified_as_design_only
      evidence: >-
        The sigma grid carries labels 0, 1/6, 1/3, 1/2, 2/3, 4/5, and 1 with
