      reference: coordination/goals/GOAL-SSI-001/batches/BATCH-6c960d/archives/TASK-20260809-3c76a9/snapshot-receipt.json:1-20@e17eeccdf5870580c9b87fc2a29d66d5ef4dfb72

  unresolved_defects:
    - id: UD-SSI-1
      severity: execution_blocking
      finding: >-
        CTRL-RANDOM-ADVICE and CTRL-SHUFFLED-FIBER have byte-level layouts,
        generators/query identity rules, and no-content/identity semantics, but
        do not pin their own concrete finite-size acceptance statistic and
        tolerance. The C-pair diagnostic requires such a tolerance to be
        reported, but the random-advice and shuffled controls do not declare an
        equivalent pre-registered numeric/statistical rule.
      consequence: >-
        These controls are reviewable declarations, not fully reproducible
        execution gates. No control outcome is accepted or inferred.
      required_successor_action: >-
        Add a freeze-time statistic, sample count, tolerance, and acceptance rule
        for both controls, including deterministic shuffled-permutation handling.
    - id: UD-SSI-2
      severity: execution_blocking
      finding: >-
        Construction B's threshold parameter theta is not explicitly mapped to
        every exact sigma label, including below-threshold behavior, unused-slot
        padding, and branch applicability. The requirement to emit every typed
        branch at every label is present but does not itself define that map.
      consequence: >-
        A future Stage 1 table could make an unregistered branch or silently
        change the advice-size convention. No B row is treated as observed.
      required_successor_action: >-
        Add a machine-readable theta-to-sigma mapping and finite-size,
        duplicate/saturation, and padding rules before authorization.
    - id: UD-SSI-3
      severity: provenance_caveat
