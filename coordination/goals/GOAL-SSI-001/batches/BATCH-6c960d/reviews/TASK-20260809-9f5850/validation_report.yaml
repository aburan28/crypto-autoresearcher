      references:
        - experiments/EXP-SSI-1d0f36/specification.yaml:364-370,454-460@840212b06599eed472a8b937aab027b0255d91d9

  cost_model_checks:
    - id: CM-SSI-7
      check: build_query_amortization_and_break_even_axes
      status: verified_as_design_only
      evidence: >-
        The contract separates T_build from per-successful-output T_q, charges
        inverse success probability and all listed restart/pullback/saturation
        work, defines T_amort=T_q+T_build/Q, and requires Q_break_even. It also
        separately charges failed construction attempts, duplicate rejection,
        serialization, index construction, and terminal membership-only work.
      references:
        - experiments/EXP-SSI-1d0f36/specification.yaml:79-97,149-174@840212b06599eed472a8b937aab027b0255d91d9
    - id: CM-SSI-8
      check: physical_bytes_and_working_memory_axes
      status: verified_as_design_only
      evidence: >-
        The successor declares measured widths for curve IDs, order tags, path
        descriptors, and indexes; reports M_adv_bytes with shared/index/padding
        terms; and keeps M_work_bytes, build memory, query memory, and incumbent
        entry-model memory separate. No physical byte measurement exists yet.
      references:
        - experiments/EXP-SSI-1d0f36/specification.yaml:128-179,352-362@840212b06599eed472a8b937aab027b0255d91d9
    - id: CM-SSI-9
      check: construction_B_sigma_grid_mapping
      status: unresolved_incomplete
      evidence: >-
        The successor requires every typed branch at every exact sigma label and
        lists Construction B's typed branches, but it does not explicitly bind
        B's threshold parameter theta to the seven sigma labels or specify the
        below-threshold evaluation, padding, or branch applicability at each
        label. This is the surviving RT-8 parameter-mapping gap and prevents
        treating the future all-row output requirement as fully determined.
      reference: experiments/EXP-SSI-1d0f36/specification.yaml:250-278,352-370,383-394@840212b06599eed472a8b937aab027b0255d91d9

  proof_architecture_checks:
    - id: PA-SSI-9
      check: baseline_controls_and_strict_scope
      status: present_and_scoped_not_executed
      evidence: >-
        S=0 and S=p^(1/2) are retained as known-answer controls, while the
        method ceiling is explicitly restricted to the named typed branches.
        Neither control is evidence and no strictness or global lower-bound
        claim is accepted.
      references:
        - experiments/EXP-SSI-1d0f36/specification.yaml:250-278@840212b06599eed472a8b937aab027b0255d91d9
        - experiments/EXP-SSI-1d0f36/specification.yaml:280-291@840212b06599eed472a8b937aab027b0255d91d9
    - id: PA-SSI-10
      check: observation_collision_and_typed_representation_separation
      status: verified_as_audit_only
      evidence: >-
        The A/B collision is explicitly preserved as a representation-collision
        audit, while order-tagged B and membership-only B have distinct record,
        terminal, and cost obligations. No collision-free or redundancy theorem
        is asserted.
      reference: experiments/EXP-SSI-1d0f36/specification.yaml:149-174,258-262@840212b06599eed472a8b937aab027b0255d91d9
    - id: PA-SSI-11
      check: output_producing_fiber_and_pullback_saturation_accounting
      status: verified_as_explicit_obligation_not_proof
      evidence: >-
        R_t(a) counts only distinct inputs for which a typed query produces an
        explicit admissible non-scalar OneEnd witness. R_t(A) is a set union
        performed before counting, overlaps are not double-counted, shared bits
        are charged once, and path direction, field encoding, validation,
        saturation, and conversion to the explicit output are charged to T_q or
        stored bytes. The closure remains an unproved obligation.
      references:
        - experiments/EXP-SSI-1d0f36/specification.yaml:181-199,271-278@840212b06599eed472a8b937aab027b0255d91d9
    - id: PA-SSI-12
      check: nearby_object_method_ceiling
      status: verified_as_non_gating_demotion
      evidence: >-
        The nearby oriented/CSIDH comparison is explicitly non-gating and cannot
        serve as a proof-map method ceiling because its problem type is distinct.
      reference: experiments/EXP-SSI-1d0f36/specification.yaml:267-270,331-338@840212b06599eed472a8b937aab027b0255d91d9

