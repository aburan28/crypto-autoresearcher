        membership-only B, and C pair entries have separate record layouts and
        charges. The former A/B (p^(4/5),p^(1/5)) collision is retained as a
        representation audit and is not used to infer redundancy.
      references:
        - experiments/EXP-SSI-1d0f36/specification.yaml:99-126@840212b06599eed472a8b937aab027b0255d91d9
        - experiments/EXP-SSI-1d0f36/specification.yaml:128-179,250-262@840212b06599eed472a8b937aab027b0255d91d9
    - id: HV-SSI-8
      check: H-ADV-4_pair_law_and_pair_null
      status: verified_as_conditional_unverified_design
      evidence: >-
        H-ADV-4 is explicitly named, scoped only to Construction C, and paired
        with an independently generated matched-marginal endpoint-pair null.
        The contract preserves the conditional boundary: a failed pair null
        invalidates C rows only, and a pass proves no theorem.
      references:
        - experiments/EXP-SSI-1d0f36/specification.yaml:236-248,321-330,340-346@840212b06599eed472a8b937aab027b0255d91d9
    - id: HV-SSI-9
      check: preregistered_prediction_and_scale_boundary
      status: verified_as_unobserved_conditional_input
      evidence: >-
        T_min(S) is labelled conditional_symbolic_input_not_observation; every
        declared exact sigma label and the random-null prediction are listed.
        The scale tier is derivation, Stage 1 is arithmetic only, optional
        diagnostics are toy/model checks, and correspondence is null. No result
