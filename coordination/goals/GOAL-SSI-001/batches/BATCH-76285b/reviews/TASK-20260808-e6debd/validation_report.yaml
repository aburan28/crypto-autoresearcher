raw_json_validation:
  source_path: experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-001/raw-result.json
  parser: Python json.load(parse_float=Decimal, parse_int=Decimal)
  parse_status: passed
  selector: per_field["log2p=512"]
  source_fields_used:
    - per_field["log2p=512"].optimal.log2T
    - per_field["log2p=512"].optimal.log2M
    - per_field["log2p=512"].baseline_log2TDG
  extracted_values:
    P: "512"
    T_full_from_optimal_log2T: "206.1038967394178"
    L_mem_from_optimal_log2M: "181.43583267427067"
    baseline_log2TDG: "256.0"
  arithmetic:
    baseline_formula:
      formula: "T_DG(P) = P / 2"
      substitution: "512 / 2"
      result: "256.0"
    crossover:
      formula: "log2(w*) = L_mem - 2 * (T_DG - T_full)"
      substitution: >-
        181.43583267427067 - 2 * (256.0 - 206.1038967394178)
      intermediate_baseline_minus_T_full: "49.8961032605822"
      intermediate_twice_baseline_minus_T_full: "99.7922065211644"
      result_log2_w_star: "81.64362615310627"
      memory_branch_check: >-
        81.64362615310627 < 181.43583267427067; the max branch is active at
        the crossover.
    evaluated_budget:
      log2_w: "80"
      charging_law: "T_A = T_full + 0.5 * max(0, L_mem - log2(w))"
      substitution: >-
        T_A = 206.1038967394178 + 0.5 * max(0,
        181.43583267427067 - 80)
      memory_residual: "181.43583267427067 - 80 = 101.43583267427067"
      memory_charge: "0.5 * 101.43583267427067 = 50.717916337135335"
      result_T_A: "256.821813076553135"
      signed_difference_formula: "T_A - T_DG"
      signed_difference_substitution: "256.821813076553135 - 256.0"
      signed_difference: "+0.821813076553135"
      interpretation: >-
        The positive signed difference means T_A is 0.821813076553135 bits
        slower than the 256.0-bit Delfs-Galbraith baseline at log2(w)=80.
      memory_branch_check: >-
        80 < 181.43583267427067; the max branch is active at the evaluated
        budget.
  raw_derived_fields_boundary: >-
    The recomputation used only the three source fields listed above and the
    corrected charging law. The raw JSON's stored van_oorschot_wiener and
    crossover fields were not used as inputs because cost_model.py retains its
    separate source-level vOW anchor implementation. This is a direct parse
    and Decimal arithmetic check, not acceptance of the Coordinator arithmetic
    on trust.
  arithmetic_conclusion: >-
    The P=512 fitted-opt anchor independently reproduces the corrected exact
    crossover log2(w*) = 81.64362615310627 and the positive w=2^80 difference
    +0.821813076553135 bits.

