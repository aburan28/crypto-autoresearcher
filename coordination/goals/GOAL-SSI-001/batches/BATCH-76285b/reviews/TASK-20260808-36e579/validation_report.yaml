raw_json_validation:
  source_path: experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-001/raw-result.json
  parser: Python json.load with Decimal float parsing
  parse_status: passed
  selector: per_field["log2p=512"]
  extracted_values:
    P: 512
    T_full_from_optimal_log2T: "206.1038967394178"
    L_mem_from_optimal_log2M: "181.43583267427067"
    baseline_log2TDG: "256.0"
  arithmetic:
    crossover_formula: "log2(w*) = L_mem - 2 * (T_DG - T_full)"
    crossover_working: "181.43583267427067 - 2 * (256.0 - 206.1038967394178)"
    crossover_expansion: "181.43583267427067 - 2 * 49.8961032605822"
    log2_w_star: "81.64362615310627"
    memory_active_check: "81.64362615310627 < 181.43583267427067, so the max branch is active at the crossover"
    charging_law: "T_A = T_full + 0.5 * max(0, L_mem - log2_w)"
    log2_w_evaluated: 80
    memory_charge_at_80: "0.5 * max(0, 181.43583267427067 - 80) = 0.5 * 101.43583267427067 = 50.717916337135335"
    T_A_at_log2_w_80: "206.1038967394178 + 50.717916337135335 = 256.821813076553135"
    baseline_difference_at_80: "256.821813076553135 - 256.0 = 0.821813076553135"
    comparison_at_80: slower_than_Delfs_Galbraith_by_0.821813076553135_bits
  arithmetic_conclusion: >-
    The committed raw JSON independently reproduces the amendment's displayed
    values: log2(w*) = 81.64362615310627 and a positive 0.821813076553135-bit
    difference at log2(w)=80. The positive difference means T_A is slower than
    the 256.0-bit Delfs-Galbraith baseline at that budget.
  raw_derived_fields_boundary: >-
    The stored raw van_oorschot_wiener and crossover fields were not used for
    this recomputation. The requested values were derived directly from the
    raw optimal T_full, raw optimal L_mem, baseline_log2TDG, and the corrected
    charging law stated in CORR-20260808-c792f8. This is necessary because
    cost_model.py remains unmodified and contains its separate source-level
    vOW anchor implementation.

