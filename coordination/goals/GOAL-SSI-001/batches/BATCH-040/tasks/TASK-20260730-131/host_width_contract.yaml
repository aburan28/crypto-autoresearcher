  # ---------------------------------------------------------------------------
  # Structural gap surfaced by this contract (recorded, not filled):
  # ---------------------------------------------------------------------------
  emission_gap:
    hooks_with_width_declaration_channel: [M_tail]
    hooks_without_width_declaration_channel:
    - B_input
    - B_attempt
    - W_label
    - R_label
    - W_sieve
    - R_sieve
    - B_sieve
    - accepted_transcript
    - B_post
    - B_recovery
    - B_candidate
    statement: >-
      Exactly one of the twelve frozen lifetime hooks (M_tail) exposes a per-slot
      width-declaration channel, and it is symbolic-only. The other eleven have no
      width-declaration parameter in the current BATCH-022 scaffold, so there is
      presently no emission point for their real per-slot widths. A real-width
      contract therefore requires either (a) a host-sourced width accessor per
      object handle, or (b) an extension of each birth_* signature to carry a
      host-populated width_decl. Neither is invented here; both are recorded as
      prerequisites for the validation plan.

  # ---------------------------------------------------------------------------
  # STAGE LIVE SETS (read verbatim from scaffold state_machine.STAGE_LIVE_SETS,
  # which equals BATCH-023 peak_live_set_accounting). Non-null: sourced structure.
  # ---------------------------------------------------------------------------
  stage_live_sets:
    preparation: [B_input, B_attempt, W_label, R_label]
    sieve_attempt: [B_input, B_attempt, W_sieve, R_sieve, B_sieve]
    recovery: [B_input, B_attempt, B_post, B_recovery, accepted_transcript]
    tail_verification: [B_input, B_attempt, B_recovery, M_tail, B_candidate]

  # ---------------------------------------------------------------------------
  # COMPOSITION OPERATOR CONSUMPTION.
  # Identity is the sourced accounting rule; it consumes per-slot REAL widths that
  # are all null here, so it yields no numeric bound. bound_units and peak are
  # null (inherited from unsourced widths). This is a specification of consumption,
  # not an instantiation.
  # ---------------------------------------------------------------------------
  composition_operator:
    id: max_over_stages_of_sum_of_live_member_slot_widths
    invented: false
    two_level: true
    within_stage_rule: sum_of_real_per_slot_widths_of_live_members
    across_stage_rule: max_over_stages
    consumes:
      per_slot_widths_from: width_emission_hooks[*].real_per_slot_width
      stage_membership_from: stage_live_sets
    bound_units: null            # inherited from per-slot width units; unsourced
    peak:
      value: null                # NO numeric peak; not the toy 24; unsourced
      peak_stage: null
      units: null
      reason_null: real_per_slot_widths_unsourced_host_gap
    reuses_toy_numeric: false
    is_numeric_instantiation: false

  # ---------------------------------------------------------------------------
  # Explicit null inventory + non-claims.
  # ---------------------------------------------------------------------------
  unsourced_values_null:
    all_real_per_slot_widths_null: true
    all_real_units_null: true
    real_peak_null: true
    tau_null: true
    security_bits_null: true
  scale_label: host_integration_boundary_specification_no_scale
  cryptographic_scale: false
  query_memory_clearance: false
