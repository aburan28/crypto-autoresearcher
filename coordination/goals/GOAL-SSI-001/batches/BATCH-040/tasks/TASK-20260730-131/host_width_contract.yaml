    note: >-
      The host is the ONLY admissible source of real per-slot widths and their
      units. It is host-gap-certified and untouched; there is no admissible pin to
      read from. Consequently every real width / unit / peak field is null. No
      CollimationSieve method name, signature, or return value is invented here.

  object_classes:
