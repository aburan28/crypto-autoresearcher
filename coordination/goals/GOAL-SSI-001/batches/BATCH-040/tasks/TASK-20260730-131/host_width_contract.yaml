  # which a per-slot width WOULD be declared. In the current scaffold, exactly ONE
  # hook (M_tail) carries a width-declaration parameter, and it is SYMBOLIC ONLY
  # (numeric_width is rejected by birth_M_tail). The other 11 hooks currently have
  # NO width-declaration parameter, so there is presently NO emission point for
  # their real per-slot widths. This gap is recorded, not filled with an invented
  # API or value.
  # ---------------------------------------------------------------------------
  width_emission_hooks:
  - hook_id: B_input
    object_class: B
    live_in_stages: [preparation, sieve_attempt, recovery, tail_verification]
    birth_signature_ref: lifetime_hooks.py::birth_B_input(x)
    scaffold_width_declaration_param: null
    width_emission_point_exists_in_scaffold: false
    real_per_slot_width:
      value: null
      units: null
      sourced_from: CollimationSieve@6f9188e4
      source_available: false
      reason_null: host_gap_no_admissible_pin

