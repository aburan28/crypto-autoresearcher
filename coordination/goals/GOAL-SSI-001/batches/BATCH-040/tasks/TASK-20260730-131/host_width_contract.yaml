    scaffold_pin_untouched: true
    scaffold_modified: false
    lifetime_hooks_module: scaffold/lifetime_hooks.py
    state_machine_module: scaffold/state_machine.py
    stage_membership_source: scaffold/state_machine.py::STAGE_LIVE_SETS
    toy_operator_reference: >-
      coordination/goals/GOAL-SSI-001/batches/BATCH-039/tasks/TASK-20260730-127/instantiation_ledger.yaml
    toy_operator_reference_note: >-
      The composition-operator IDENTITY (accounting rule) below is the same rule
      instantiated at TOY scale in BATCH-039 under FC0-PEAKBYTE-TOY-PROTOCOL-R1.
      Here it is specified as a consumer of REAL widths; NO toy numeric is reused,
      re-scaled, or presented as real.

  host:
    name: CollimationSieve
    commit: 6f9188e4eb5611bcfdf29a3e1ec3cd69a29a50e9
    status: host_gap_certified_retained_untouched
    apis_invented: false
    admissible_pin: false          # BATCH-020 no_admissible_pin retained
