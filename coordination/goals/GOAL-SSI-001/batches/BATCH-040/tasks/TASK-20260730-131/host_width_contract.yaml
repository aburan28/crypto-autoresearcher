  purpose: >-
    Specify the host-integration WIDTH CONTRACT for the FC0 lifetime hooks: which
    hooks would emit REAL per-slot widths, in what units, and how the composition
    operator would consume them. This is a boundary specification only. It invents
    NO numeric width, NO unit, NO peak, NO tau, and NO CollimationSieve API. Every
    quantity that cannot be sourced from an admissible pin is left null. It does NOT
    iterate the BATCH-039 toy peak-byte lane and asserts no numeric bound.

  # ---------------------------------------------------------------------------
  # Sources. Structural facts below (hook ids, stage membership, object classes,
  # operator id, pin commit) are READ from committed in-repo artifacts and are
  # therefore non-null. Every REAL numeric width / unit / peak is null because
  # its only admissible source (the CollimationSieve host) is unavailable.
  # ---------------------------------------------------------------------------
