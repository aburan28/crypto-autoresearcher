    role: oracle-labelled 'W' object class (ObjectClass.W)
  - id: R
    role: oracle-labelled 'R' object class (ObjectClass.R)
  - id: B
    role: bookkeeping/classical 'B' object class (ObjectClass.B)
  - id: M_tail
    role: residual-tail object class after recovery transition (ObjectClass.M_tail)

  # ---------------------------------------------------------------------------
  # WIDTH-EMISSION HOOK CONTRACT.
