  objections:
    - id: OBJ-1
      severity: minor
      title: >-
        composition_operator.invented:false is scoped to "not invented in THIS
        batch"; the additive-within-stage / max-across-stage MODEL is an
        unvalidated modeling assumption carried from the toy protocol.
      detail: >-
        host_width_contract.composition_operator sets invented:false and cites
        the BATCH-039 FC0-PEAKBYTE-TOY-PROTOCOL-R1 accounting rule as its source.
        That rule is a PROGRAM artifact, not a host-sourced or independently
        justified fact: consuming future REAL per-slot widths through
        within_stage_rule=sum and across_stage_rule=max bakes in an additivity
        and a max-selection assumption about real memory that has never been
        validated against a real object. This is NOT an overclaim in the reviewed
        ledger — the producer pre-registers exactly these assumptions as
        falsifiable (F1 additivity/dimension, F2 peak ratio, F3 selector/membership)
        and leaves bound_units/peak null — but a future reader must not read
        invented:false as "host-sourced or validated operator." It is
        "not-newly-invented-here." Recommend future batches state the operator's
        modeling status explicitly beside invented:false. Non-blocking.
      blocks_confirm: false
    - id: OBJ-2
      severity: minor
      title: >-
        The entire validation/falsification plan (F1–F5) is gated on an
        admissible pin that does not exist, so no F-condition can fire in the
        current program state — the width lane yields no near-term discriminator.
      detail: >-
        validation_falsification_plan.requires_admissible_pin_before_execution is
        true and BATCH-020 no_admissible_pin is retained, so F1–F5 and the null
        control are falsifiable-in-principle but non-executable-now. The plan is
        honest about this (measurement_performed:false; PRE-1/PRE-2 unresolved).
        The consequence for direction: BATCH-040 produces a checkable CONTRACT but
        no runnable next step for the width lane; the only executable forward
        lever in the current state is the §6 host-INDEPENDENCE reduction for
        QM-STOPPING (see OBJ-3 / next_concrete_action). Non-blocking, feeds next
        action.
      blocks_confirm: false
    - id: OBJ-3
      severity: minor
      title: >-
        The obstruction analysis's honest "availability/host gap, not a proven
        obstruction (AGENTS.md rule 5)" framing is correct, but risks becoming a
        permanent excuse that keeps QM-STOPPING perpetually `unverified` unless
        the §6 host-independence reduction is actually attempted.
      detail: >-
        stopping_obstruction_analysis.md §2/§3 correctly refuses to convert
        8-batch FAIL retention into a mathematical obstruction, and §3 shows the
        candidate (Verify-relativity of τ) fails §4 on quantifier order
        (∀ hosts untouched), method ceiling, and observation collision. This is
        exactly the right posture and is NOT a fake closure. The residual risk is
        symmetric with the fatigue failure mode it diagnoses: repeatedly
        re-recording "unverified because the host is absent" is itself a fatigue
        report unless the one host-INDEPENDENT lever it names — §6 item 1: test
        whether τ's finiteness reduces to a mixing-time / collision-distribution
        property statable WITHOUT the full Verify body — is dispatched. That
        reduction attempt (which either refutes the candidate or earns the
        ∀-hosts quantifier) is the concrete next gate, not another width pass.
        Non-blocking, feeds next action.
      blocks_confirm: false
    - id: OBJ-4
      severity: informational
      title: >-
        model_verified:false — resolved model identifier was not probe-verified;
        producer and this review ran under authorized fallback.
      detail: >-
        classification.yaml records requested_policy executor-implementation
        resolving under fallback to Cursor Agent (Claude Opus 4.8),
        fallback_allowed:true, model_verified:false, no separate BATCH-040
        inference-amendment file. Acceptable for a zero-compute boundary
        specification that makes no cryptographic claim (same posture as
        RT-20260730-129 OBJ-4); flagged for ledger completeness only.
      blocks_confirm: false
    - id: OBJ-5
      severity: informational
      title: >-
        Clearance guard remains a denylist (now expanded); a wholly novel
        clearance-like key name would still pass, but substantive clearance is
        positively pinned.
      detail: >-
        ledger_checks._FORBIDDEN_TRUE_KEYS now includes query_memory_solved,
        clearance, cleared, problem_closed, pin_complete — hardening the
        BATCH-039 RT-20260730-129 OBJ-1 denylist gap (test_novel_clearance_like_key_rejected
        passes on my re-run). It is still a denylist, so a never-before-seen key
        could slip through, but check_no_illicit_clearance POSITIVELY pins
        query_memory_clearance:false and check_memory_map_status pins
        clearance:false / query_memory_cleared:false, which cannot be flipped
        without harness failure. Residual defense-in-depth note only.
      blocks_confirm: false

