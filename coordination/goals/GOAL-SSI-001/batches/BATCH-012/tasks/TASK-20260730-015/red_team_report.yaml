red_team_report:
  id: RT-20260730-015
  task_id: TASK-20260730-015
  goal_id: GOAL-SSI-001
  batch_id: BATCH-012
  verdict: CONFIRM
  claim_under_review: >-
    TASK-20260730-013 pins Peikert's CollimationSieve at commit
    6f9188e4eb5611bcfdf29a3e1ec3cd69a29a50e9, extracts an ideal-random
    conditional collimation branch kernel and a lexical PhaseVector lifetime
    trace, rejects only the lexical simulator-PhaseVector subcase of C3, leaves
    C2 and the end-to-end error-map audit live, and retains
    FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED with QM-STOPPING,
    QM-MEMORY-MAP, and QM-ERROR. It makes no numeric-security, breakthrough,
    or completion claim and performs zero curve, isogeny, simulator, or
    circuit computation.
  exact_supported_final_claim: >-
    At immutable snapshot aedd55676f03032f1a74f2da5f815754affdad2a, the
    public author repository and pinned source support an exact combinatorial
    expression for the selected collimation bin conditional on already-returned
    child vectors and the ideal-uniform interpretation of getRandomR. The
    source also shows that a discarded local PhaseVector is neither stored nor
    passed to the same-level retry, giving a bounded lexical-reference count
    at fixed recursion depth. Neither result is an exact concrete-DRBG
    end-to-end transition law or a runtime/quantum memory schedule. No uniform
    retry-tail bound, recovery/tail process, complete W/R/B/M_tail map, or map
    to final key-recovery failure F is supplied. C2 and the error-map audit
    remain live; C3 is rejected only for unbounded retention of lexical
    simulator PhaseVector references. QUERY_MEMORY therefore remains
    unreconciled.

