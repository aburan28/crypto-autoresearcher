preregistration_manifest:
  task_id: TASK-20260730-031
  goal_id: GOAL-SSI-001
  batch_id: BATCH-016
  supersedes:
    task_id: TASK-20260730-025
    batch_id: BATCH-015
    tape_machine_version: ttm-v1
    reason: >-
      ttm-v1 is not closed under its first base-return transition
      (TTM-RETURN-MODULUS) and leaves requested-length undefined
      (TTM-REQUESTED-LENGTH). Both were recorded by TASK-20260730-027, upheld by
      RT-20260730-029, and adopted by DEC-20260730-007. The ttm-v1 spec is left
      UNEDITED; ttm-v2 supersedes it.

  no_results_inspected: true
  no_results_inspected_note: >-
    This task wrote preregistration artifacts only. No audit was run, no trace
    was produced, no panel row was executed, and no result of any kind was read
    while these artifacts were being written. The BATCH-015 material this task
    read is the DIAGNOSIS of ttm-v1's typing (specification_errors) and the red
    team's next_concrete_action - both of which are inputs the task was directed
    to consume by its own handoff read_scope - not audit outcomes for the rows.

  tape_machine_version: ttm-v2
  panel_row_ids:
    - CSIDH-CS-6f9188e4-logn2-logl2-logs0-theta3over4
    - CSIDH-CS-6f9188e4-logn3-logl2-logs0-theta3over4

  panel_unchanged: true
  panel_unchanged_method: >-
    schedule_panel.yaml was produced by copying the BATCH-015 panel BYTE FOR BYTE
    and editing only task_id and a provenance block. The rows were not retyped
    and not re-derived from the construction rule. Re-derivation would risk a
    silent transcription difference in exactly the values the rerun must hold
    fixed; post-selecting a schedule after seeing BATCH-015's audit is the
    failure this preregistration exists to prevent. Equality of the parsed rows
    against BATCH-015 was checked and holds.

  gaps_closed:
    - id: TTM-RETURN-MODULUS
      closed_by: >-
        ttm-v2 section 1. Return type of a call at index r is a sorted vector
        over Z/s_r Z for every r, base included; child_store at a call of index r
        holds vectors over Z/s_{r+1} Z (the CHILD's modulus), which is the
        correction - ttm-v1 named the owner's modulus where it meant the child's.
        The two types then agree, so store_coerce is the identity, stated
        explicitly and undefined on any other modulus.
      alternative_rejected: >-
        Keeping child_store at Z/s_r Z and coercing at return time was considered
        and rejected in the spec: collimation already reduces to Z/s_r Z, so
        reducing at return as well would apply the reduction twice and silently
        change the binning.
      character_of_the_fix: >-
        A TYPING REPAIR TO THE SPECIFICATION, not a finding about the underlying
        scheme. Recorded plainly so that no downstream reader mistakes a fixed
        spec bug for a mathematical result. EV-SSI-015 already records
        TYPE-ERROR-NOT-MATHEMATICAL-EVIDENCE as upheld.
    - id: TTM-REQUESTED-LENGTH
      closed_by: >-
        ttm-v2 section 2. Requested length ell = L at every call, uniform across
        the schedule and independent of r. A base call delivers at most L
        elements (subset sums may collide modulo n); a collimating call delivers
        |v| bounded by |v1|*|v2| and possibly zero, never truncated or padded.
        The decision rule keep = alwaysKeep OR (|v|/L >= theta) uses requested L
        as denominator and delivered |v| as numerator, which ttm-v1 left
        ambiguous between the two.
      scope_limit: >-
        ttm-v2 supplies a definition for THIS machine. It does NOT claim to
        reproduce the BATCH-014 static analyzer's requested-length semantics;
        EV-SSI-015 records the two as not_comparable and that stands.

  trace_obligation_added: >-
    ttm-v2 section 3 makes a frame-by-frame all-zero-tape trace MANDATORY before
    any rerun may be described as an execution or as exhaustive, and requires the
    trace to exhibit the first base return crossing into its parent's
    child_store - the single frame pair ttm-v1 could not produce. An audit that
    cannot emit it must report SCOPED_NO_GO. This discharges
    RT-20260730-029 TTM-EXECUTION-TRACE-OVERSTATEMENT prospectively.

  inference:
    requested_policy: executor-terra
    authorization_ref: >-
      coordination/goals/GOAL-SSI-001/batches/BATCH-016/inference-amendment-TASK-20260730-031.yaml
    fallback_allowed: true
    resolved_model_id: claude-opus-5
    fallback_used: true
    model_verified: false
    fallback_note: >-
      executor-terra resolves through orchestration/model-bindings.yaml, which
      Claude Code cannot evaluate (CLAUDE.md model policy note). Recorded, not
      silently substituted, as the amendment requires. The artifacts are a
      specification and a byte-copied panel; neither carries a measurement whose
      value could depend on which model wrote it.
    produced_by_note: >-
      Written by the orchestrating session acting in the executor role rather
      than by a separate executor subagent. TASK-20260730-031 carries
      review_required: false, so no independence claim is made or lost here; the
      independence in this batch is the downstream review of the rerun. Declared
      rather than left to be inferred.

  claim_boundary: >-
    These artifacts preregister only a finite schedule selection (carried forward
    unchanged) and a bounded typed-tape/history transition specification. They
    contain no analysis outputs, keep probabilities, pair-set enumerations,
    witnesses, reachability or recurrence results, concrete-HashDRBG equivalence
    claim, stopping-law claim, query/memory reconciliation, numeric-security
    claim, breakthrough claim, or goal-completion claim. Zero curve, isogeny,
    simulator, or quantum-circuit computation was performed. Recovery
    implementation and object-lifetime tracing remain out of scope as a separate
    later gate. QUERY_MEMORY (QM-STOPPING, QM-MEMORY-MAP, QM-ERROR) remains open
    and is untouched by this task.
