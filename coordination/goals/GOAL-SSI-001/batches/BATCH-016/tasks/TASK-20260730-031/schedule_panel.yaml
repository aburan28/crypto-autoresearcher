schedule_panel:
  task_id: TASK-20260730-031
  purpose: >-
    Immutable pre-analysis panel for the bounded typed-tape transition audit
    under ttm-v2 required by DEC-20260730-007 (BATCH-016). Identical two-row
    schedule selection as BATCH-015 / TASK-20260730-025; no post-selection.
  selection_rule: >-
    Hold logl=2, logs=0, and threshold=3/4 fixed. Include the BATCH-014
    source row logn=2, then include its immediately larger small logn
    neighbor logn=3. Generate each interval list directly from the
    pinned Main.hs construction: n = 2^logn; L = 2^logl; S_0 = 2^logs;
    takeWhile (< n) (iterate (\t -> (2*t*L) div 3) S_0) ++ [n].
    A candidate is valid only when this finite construction yields a
    strictly increasing interval list ending at n; no selection depends on
    audit outcomes.
  includes_batch014_row: true
  rows:
    - schedule_id: CSIDH-CS-6f9188e4-logn2-logl2-logs0-theta3over4
      n: 4
      L: 4
      interval_list: [1, 2, 4]
      threshold: "3/4"
      alwaysKeep_policy:
        root_call: true
        all_recursive_calls: false
        bounded_audit:
          designated_retry_site: internal_S2
          retry_horizon: one_same_level_retry
          all_other_internal_calls: keep_on_first_attempt
      source_params:
        repository: https://github.com/cpeikert/CollimationSieve
        commit: 6f9188e4eb5611bcfdf29a3e1ec3cd69a29a50e9
        path: src/Main.hs
        logn: 2
        logl: 2
        logs: 0
        construction: >-
          n = 2^logn; L = 2^logl; S_0 = 2^logs; takeWhile (< n)
          (iterate (\t -> (2*t*L) div 3) S_0) ++ [n].
    - schedule_id: CSIDH-CS-6f9188e4-logn3-logl2-logs0-theta3over4
      n: 8
      L: 4
      interval_list: [1, 2, 5, 8]
      threshold: "3/4"
      alwaysKeep_policy:
        root_call: true
        all_recursive_calls: false
        bounded_audit:
          designated_retry_site: internal_S2
          retry_horizon: one_same_level_retry
          all_other_internal_calls: keep_on_first_attempt
      source_params:
        repository: https://github.com/cpeikert/CollimationSieve
        commit: 6f9188e4eb5611bcfdf29a3e1ec3cd69a29a50e9
        path: src/Main.hs
        logn: 3
        logl: 2
        logs: 0
        construction: >-
          n = 2^logn; L = 2^logl; S_0 = 2^logs; takeWhile (< n)
          (iterate (\t -> (2*t*L) div 3) S_0) ++ [n].
