  schedule_arithmetic_spot_check:
    construction: >-
      n=2^logn, L=2^logl, S_0=2^logs; takeWhile (<n) iterate
      t |-> floor(2*t*L/3) starting at S_0; append n.
    rows:
      - schedule_id: CSIDH-CS-6f9188e4-logn2-logl2-logs0-theta3over4
        n: 4
        L: 4
        S0: 1
        iterates_below_n: [1, 2]
        next_iterate_ge_n: 5
        resulting_schedule: [1, 2, 4]
        matches_preregistration: true
      - schedule_id: CSIDH-CS-6f9188e4-logn3-logl2-logs0-theta3over4
        n: 8
        L: 4
        S0: 1
        iterates_below_n: [1, 2, 5]
        next_iterate_ge_n: 13
        resulting_schedule: [1, 2, 5, 8]
        matches_preregistration: true

  attack_surface_assessment:
    return_modulus_repair_complete: true
    return_modulus_detail: >-
      ttm-v2 preregisters total reduce-mod-parent:
      v = sort((x mod s_r) for x in v*). All-zero-tape return_store events
      record return_modulus_rule: reduce-mod-parent with matching
      child_vector_pre_coercion -> child_store_post_coercion arithmetic
      (0 mismatches on 6 stores for [1,2,4] and 14 stores for [1,2,5,8],
      including base Z/8Z into S=5 parent modulus 5). Exhaustive explorer
      applies the same coercion on every labeled keep-return. No ill-typed
      modulus refusal branch remains under ttm-v2.
    requested_length_semantics_complete: true
    requested_length_detail: >-
      Traces and explorer implement ceil_sqrt(3*ell) on spawn_left,
      ceil((3*ell)/|v1|) on spawn_right, retry length inheritance, and
      base_draw_count = round(log2 ell) with the preregistered finite table
      (1->0, 2->1, 3->2, 4->2), including empty-draw (0) emission of (0).
      Observed zero-tape length chains match the text.
    traces_real_frame_by_frame: true
    traces_detail: >-
      zero_tape_traces.yaml retains 53 events ([1,2,4]) and 114 events
      ([1,2,5,8]) with call_history, r, phase, requested_length, retry_count,
      tape_position, consume symbols, return_emit/return_store coercion,
      collimate, and decide fields — not aggregate modulus checks alone.
      Sole schema nits: terminal root_return events omit call_history; this
      does not defeat the recursive prefix audit.
    s5_frames_present_on_second_row: true
    s5_detail: >-
      [1,2,5,8] enter prefix includes four S=5 frames (r=2, modulus=5)
      between S=2 and base S=8, repairing the BATCH-015 SECOND-ROW-HISTORY-OMISSION
      defect.
    illicit_global_tail_inference_detected: false
    premature_QUERY_MEMORY_clearance_detected: false
    numeric_security_claim_detected: false
    breakthrough_claim_detected: false
    parameter_recommendation_detected: false
    goal_completion_claim_detected: false
    goal_completion_criteria_met: false
    batch014_not_equated: true
    batch014_detail: >-
      comparison_status: definitions_differ_not_equated is honest: ttm-v2
      post-coercion Z/s_r Z stores and threshold-rejected decide zp differ
      from BATCH-014's static Z/nZ pair enumeration and all-q-bins predicate.
      Finite ideal-choice observation labels are present on both rows.

  independent_metric_recompute:
    status: matched
    method: >-
      Re-ran TTMV2.audit_row() from the out-of-snapshot helper against the
      preregistered panel; compared to committed panel_audit_results.yaml.
    rows:
      - interval_list: [1, 2, 4]
        projected_S2_pair_set_count: 8
        zero_progress_occupancy_index_outcomes: 0
        jointly_reachable: false
        recurrent_within_one_retry_horizon: false
        match: true
      - interval_list: [1, 2, 5, 8]
        projected_S2_pair_set_count: 2703
        zero_progress_occupancy_index_outcomes: 946
        unique_decide_keys_ell_rc_v1_v2_q_v: 558
        S2_states_with_at_least_one_discarding_index_outcome_claimed: 558
        jointly_reachable: true
        recurrent_within_one_retry_horizon: true
        match: true

  disposition_assessment:
    claimed: FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED
    supported: true
    query_memory_support: supported
    named_blockers_supported:
      - QM-STOPPING
      - QM-MEMORY-MAP
      - QM-ERROR
    closed_specification_blockers_supported:
      - TTM-RETURN-MODULUS
      - TTM-REQUESTED-LENGTH
    qualification: >-
      Finite ideal-choice S=2 metrics are now computable under preregistered
      ttm-v2, but they do not supply a history-uniform stopping law, W/R/B/M_tail
      lifetime map, or component-to-final-failure implication. Closing the
      TTM-* specification blockers therefore correctly does not clear
      QUERY_MEMORY. Recovery/object-lifetime remain out of scope and unperformed.

  objections:
    - id: ZP-OCCUPANCY-INDEX-VS-STATE
      severity: non_blocking_qualification
      title: Published zp occupancy counts index outcomes, not unique decide states
      detail: >-
        zero_progress_occupancy: 946 on [1,2,5,8] equals
        retry_triggering_index_outcomes and counts (i,j) decide outcomes.
        Unique (requested_length, retry_count, v1, v2, q, v) keys number 558,
        matching S2_states_with_at_least_one_discarding_index_outcome.
        classification.yaml surfaces only 946. This does not falsify
        jr=true/rec=true (both counts are positive) but durable wording
        should call 946 an index-outcome occupancy.
      required_control: >-
        In the Coordinator ledger archive, quote both 946 (index outcomes)
        and 558 (unique decide keys / states-with-discard), and avoid reading
        946 as the cardinality of the syntactic decide-state class alone.
    - id: REACHABILITY-DEFS-OPERATIONAL-NOT-PREREGISTERED
      severity: non_blocking_qualification
      title: jointly_reachable / recurrent are audit-operationalized
      detail: >-
        ttm-v2 preregisters the zero-progress decide-state class for [1,2,4]
        and the one-retry horizon, but does not formally define the boolean
        jointly_reachable / recurrent_within_one_retry_horizon predicates.
        The explorer sets jointly := (zp index count > 0) and recurrent from
        zp presence at retry_count markers (with a soft OR across ells).
        Results are still finite ideal-choice observations under an explicit
        operational reading, not global claims.
      required_control: >-
        When promoting to evidence/decision text, state the operational
        predicates explicitly and keep them scoped to this toy panel.
    - id: TYPE-ERROR-NOT-MATHEMATICAL-EVIDENCE
      severity: blocking_for_scope_expansion
      title: Finite panel metrics are not sieve evidence or QUERY_MEMORY clearance
      detail: >-
        Successful ttm-v2 execution yields ideal-choice observations only.
        It is not evidence of HashDRBG reachability, a global stopping tail,
        concrete FC0 memory, or final key-recovery failure mapping, and it
        does not change Peikert CollimationSieve asymptotics.
      required_control: >-
        Keep QUERY_MEMORY unreconciled; do not infer clearance from this
        panel; keep recovery/object-lifetime as a separate gate.
    - id: QUERY-MEMORY-REMAINS-OPEN
      severity: blocking_for_query_reconciliation
      title: Recovery and lifetime gates remain absent
      detail: >-
        No recovery, verification, object-lifetime, backing-store, or final
        error-event analysis was performed.
      required_control: >-
        Preserve QM-STOPPING, QM-MEMORY-MAP, and QM-ERROR until those gates
        are separately executed under a committed protocol.

  required_controls:
    - id: LEDGER-SCOPE-WORDING
      control: >-
        Archive evidence/decision text that (a) confirms durable ttm-v2
        preregistration-before-audit order, (b) reports finite ideal-choice
        row metrics with index-vs-state occupancy qualification, (c) retains
        FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED, and (d) does not equate
        BATCH-014 static counts.
      pass_condition: >-
        Official ledger language matches the narrowest supported statement
        below and introduces no numeric-security, breakthrough, or completion
        claim.
    - id: RECOVERY-LIFETIME-GATE
      control: >-
        Keep recovery implementation and W/R/B/M_tail object-lifetime tracing
        as a separate later gate; do not schedule it as a silent side effect
        of this panel success.
      pass_condition: >-
        Next QUERY_MEMORY work has an explicit protocol and preregistration
        distinct from ttm-v2 panel metrics.

  counterexample_or_mutation: >-
    Cheapest discriminating control already partially satisfied by
    all-zero-tape traces: re-run one non-zero tape (e.g. BaseDraw=1 where
    enabled) on [1,2,5,8] and confirm the same reduce-mod-parent and S=5
    recursive prefix appear. For occupancy wording, recompute unique
    (ell,rc,v1,v2,q,v) zp cardinality (558) beside the published 946
    index-outcome count — already matched in this review. No second
    retain-representatives mutation is required inside this batch because
    reduce-mod-parent was preregistered before result inspection.

  baseline_comparison:
    pollard_rho: >-
      No ECDLP solve path or complete resource vector exists, so no
      Pollard-rho comparison is admissible.
    bsgs: >-
      No query/time/memory/data point exists for comparison with BSGS.
    closest_specialized: >-
      Peikert's CollimationSieve remains the closest specialized baseline.
      A successful auxiliary ttm-v2 ideal-choice panel neither strengthens
      nor weakens its concrete or asymptotic accounting.
    conclusion: >-
      No quantitative sota_delta, Pareto dominance, numeric-security,
      breakthrough, parameter, or completion claim follows.

  heuristic_challenges:
    - >-
      A finite ideal-choice machine does not establish equivalence to concrete
      HashDRBG evolution.
    - >-
      A two-row, one-retry panel cannot establish an unbounded,
      history-uniform stopping tail.
    - >-
      Presence of zp decide outcomes on [1,2,5,8] under reduce-mod-parent is
      a syntactic observation about this abstraction, not a validated heavy-tail
      probability for the source sieve.

  cost_model_challenges:
    - No stopping distribution or finite joint Q/S/P/C expectation was obtained.
    - W/R/B/M_tail widths, overlap, cleanup, and backing-store peaks remain absent.
    - Recovery, verification, residual-tail, and final error costs remain absent.

  reduction_and_scope_challenges:
    - >-
      Representation, relation collection, rank, scalar orientation, source
      recovery, target descent, and verified key recovery remain outside this
      batch.
    - >-
      Nothing transfers to generic ECDLP, numeric CSIDH security, SIDH/SIKE,
      SQIsign/CGL path finding, or GOAL-SSI-001 completion (KN-TECH-051 /
      KN-OPEN-014 remain the security-model locus).
    - >-
      Closing TTM specification blockers is not a global impossibility or
      saturation conclusion about CollimationSieve.

  recovery_and_object_lifetime_assessment:
    remained_out_of_scope: true
    recovery_implemented: false
    object_lifetime_traced: false
    memory_map_cleared: false
    final_error_map_cleared: false

  scope_limits:
    - >-
      Review is limited to Coordinator-committed snapshots 1801e2a5 and
      3b90c3cd (bound at HEAD 56104051), plus DEC-20260730-007, EV-SSI-015,
      RT-20260730-029, and KN-TECH-051.
    - >-
      No curve, isogeny, quantum-circuit, recovery, or object-lifetime
      computation was run.
    - >-
      Supported conclusions concern only preregistered ttm-v2 on the two toy
      rows under ideal-choice collecting semantics.

  pareto_assessment:
    applicable_attack_point: false
    dominated_by: not_evaluable_incomplete_resource_vector
    sota_delta:
      query: not_claimed
      time: not_claimed
      memory: not_claimed
      data_or_oracle: not_claimed

  claim_creep_detected: false
  claim_creep_detail: >-
    Scope conclusions and disposition are conservative. BATCH-015 claim-creep
    modes (static checker sold as recursive execution; omitted S=5 frames;
    illicit global-tail / QUERY_MEMORY clearance) are not repeated. The only
    residual wording debt is non-blocking: zp occupancy 946 is an
    index-outcome count beside a 558 unique-decide-key figure already present
    in panel_audit_results.yaml.
  query_memory_disposition_supported: true
  ttm_v2_repair_supported: true
  finite_panel_metrics_supported: true

  narrowest_supported_statement: >-
    Commit 1801e2a5 durably preregistered the two arithmetically correct panel
    rows and ttm-v2 (reduce-mod-parent; adaptive requested-length) before the
    descendant audit snapshot 3b90c3cd. Under that frozen machine, both rows
    admit real frame-by-frame all-zero-tape recursive traces — including the
    S=5 frames on [1,2,5,8] — and exhaustive ideal-choice enumeration yields
    finite S=2 observations: [1,2,4] jointly_reachable=false,
    recurrent=false, zp index-outcomes=0; [1,2,5,8] jointly_reachable=true,
    recurrent=true, zp index-outcomes=946 (558 unique decide keys). These are
    not equated to BATCH-014. TTM-RETURN-MODULUS and TTM-REQUESTED-LENGTH are
    closed as specification blockers. QUERY_MEMORY remains unreconciled
    (QM-STOPPING, QM-MEMORY-MAP, QM-ERROR); recovery/object-lifetime stayed
    out of scope; no global-tail, numeric-security, breakthrough, or
    completion conclusion follows.

  next_concrete_action: >-
    Coordinator should ledger-archive a CONFIRM decision that adopts the
    finite ideal-choice ttm-v2 panel observations with the index-vs-state
    occupancy qualification, retains
    FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED, keeps recovery/object-lifetime as
    a separate later gate, does not equate BATCH-014, and introduces no
    numeric-security, breakthrough, or GOAL-SSI-001 completion claim.

  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-016/tasks/TASK-20260730-035/red_team_report.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-016/tasks/TASK-20260730-035/falsification_review.md
