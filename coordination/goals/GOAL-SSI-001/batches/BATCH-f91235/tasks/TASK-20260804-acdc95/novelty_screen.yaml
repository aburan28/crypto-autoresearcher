  proposed_object_screen:
    - idea_id: IDEA-20260804-84328c
      object: frobenius_orbit_endpoint_quotient
      potential_collision_routes:
        - >-
          Could be a repackaging of Frobenius descent or quotient graph search
          in Delfs-Galbraith follow-on work.
        - >-
          Could collapse to an ordinary endpoint-hash/MITM bucket optimization
          with no nontrivial algebraic content.
      required_resolution: >-
        Search primary supersingular path-finding and Frobenius-quotient
        literature before labeling the object adaptation or novel.
    - idea_id: IDEA-20260804-4c9ac0
      object: internal_kernel_frobenius_type_profile
      potential_collision_routes:
        - >-
          Could be standard torsion-module bookkeeping, an isogeny-walk
          invariant, or a renamed auxiliary-structure test.
        - >-
          Could duplicate a known kernel-orbit partition without yielding an
          exact-lift reduction.
      required_resolution: >-
        Search primary work on Frobenius actions on isogeny kernels and
        supersingular path algorithms; separately audit against the
        SIDH/SQIsign auxiliary-data literature.
    - idea_id: IDEA-20260804-170692
      object: bounded_local_transport_signature
      potential_collision_routes:
        - >-
          Could be a local quaternion/Eichler invariant, Brandt-graph
          quotient, or an orientation coordinate in different notation.
        - >-
          Could be an injective coordinate change at selected radii and fail
          the lossy-projection test.
      required_resolution: >-
        Search primary literature on local quaternion orders, Brandt graphs,
        local isogeny transport, and graph quotients; enumerate toy fibers
        before treating it as a new object.
