      severity: blocking_for_scope_expansion
      title: Host-gap certificate is not mathematical impossibility of FC0
      detail: >-
        Relative to CollimationSieve@6f9188e4, Verify and FC0 W/R/B/M_tail
        APIs are absent and cannot be hosted in-repo without inventing
        pin-absent code. That does not prove FC0 lifetimes/Verify are
        impossible on every host, does not close IDEA-20260729-001 as a
        lane under inventor-protocol §4, and does not change Peikert
        asymptotics or KN-TECH-051 security-model dispute status.
      required_control: >-
        Keep conclusions host-scoped to CollimationSieve@6f9188e4; introduce
        no impossibility, numeric-security, breakthrough, parameter, or
        GOAL-SSI-001 completion claim; do not treat host_gap_certified as
        lane closure.
    - id: CITATION-PRINTF-IMPRECISION
      severity: non_blocking_qualification
      title: Minor Main.hs citation says printf; exit uses putStrLn/showFFloat
      detail: >-
        lifetime_verify_attempt evidence tags reference
        "statistics_printf" / report printing; independent inspection of
        Main.hs@6f9188e4 shows putStrLn / showFFloat LaTeX-row emission at
        the report-only exit (lines ~276–348). The substantive claim
        (report-only exit; no Verify) remains correct.
      required_control: >-
        Prefer putStrLn/showFFloat wording in any superseding citation; do
        not treat this as evidence of a Verify or recovery API.

