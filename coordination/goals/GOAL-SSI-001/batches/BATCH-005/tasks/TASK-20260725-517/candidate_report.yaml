candidate:
  id: IDEA-20260725-003
  title: >-
    Frozen SQIsign Fiat-Shamir transcript model SQI-FS-T0 and KN-OPEN-015
    auxiliary-sufficiency test
  class: structure-attack
  target_problem: >-
    SQIsign static verification transcripts (commitment, Fiat-Shamir challenge,
    KLPT connecting-isogeny responses) as an auxiliary-information channel on
    the endomorphism-ring / path-finding foundation, without published torsion
    images under a secret isogeny.
  target_open_problem: KN-OPEN-015
  secondary_open_problem_not_selected: KN-OPEN-014
  mechanism_summary: >-
    Freeze spine-minimal transcript model SQI-FS-T0 before any Kani or embedding
    claim: public key curve E with no published End and no torsion images;
    signature parsing to commitment C, challenge c = H(pk, m, C), and response
    connecting isogenies of publicly recoverable degree between publicly named
    curves (KN-TECH-028 / KN-LIT-072 / KN-LIT-073). Then run a KN-OPEN-015
    sufficiency test: (i) check KN-TECH-026 necessary conditions (degree AND
    torsion action) against SQI-FS-T0; (ii) check whether Petit unbalanced
    improvement (KN-LIT-077) applies without torsion images; (iii) only if a
    named non-torsion residual survives without inventing protocol fields,
    compare its charged cost to KN-TECH-050 / End baselines. Expected
    spine-consistent outcome is Kani-pathway fail-closed; admission is for the
    typed model and falsifiable classification, not a SQIsign break.
  assumptions:
    - Transcript leakage is exactly SQI-FS-T0; no invented SQIsign/SQIsign2D bit fields beyond the knowledge spine.
    - No torsion-point images under a secret isogeny; no adaptive torsion oracle; no free End(E).
    - KLPT responses appear as connecting isogenies of publicly recoverable degree between publicly named curves (KN-TECH-028 reported structure).
    - IDEA-20260725-002 orientation Cl-cost remains closed (DEC-20260725-005); not reopened.
    - Zero curve/isogeny computation in the falsification gate.
  predictions:
    - metric: sqi_fs_t0_meets_kani_necessary_conditions
      direction: false_expected
      minimum_effect: >-
        Derivation outputs T0_FAILS_KANI_AND_PETIT_NECESSARY_CONDITIONS, or else
        documents a typed counterexample that torsion action is present in
        SQI-FS-T0 contrary to KN-TECH-028 (would force a spine correction, not a
        silent embedding claim).
    - metric: named_non_torsion_auxiliary_vs_kn_tech_050
      direction: lower_or_absent
      minimum_effect: >-
        Either identify a named non-torsion auxiliary pathway inside SQI-FS-T0
        with charged cost strictly below the regime-appropriate KN-TECH-050 /
        End baseline, or emit fail-closed / spine-insufficient without claiming
        advantage.
  frozen_leakage_model:
    name: SQI-FS-T0
    includes:
      - public_key_curve_without_published_End
      - fiat_shamir_commitment_challenge_response_parse
      - connecting_isogenies_public_degree_named_curves
    excludes:
      - torsion_basis_images_under_secret_isogeny
      - adaptive_torsion_oracles
      - free_End_or_connecting_ideal
      - orientation_cl_cost_reopen_IDEA-20260725-002
      - uncited_version_specific_sqisign2d_fields
  matched_baseline_comparison:
    reference: KN-TECH-050
    attack_template_checks:
      - KN-TECH-026
      - KN-LIT-077
    rule: >-
      No embedding claim before SQI-FS-T0 is shown to meet that attack's
      necessary conditions. Classical advantage claims (if any residual)
      must beat KN-TECH-050 under the same cost convention; memory-free MITM
      and uncharged torsion oracles are forbidden.
  full_cost_boundary:
    charged:
      - signature parse and algebraic work on publicly named curves and degrees
      - any End / path-finding reduction cost under KN-TECH-050 if a non-torsion residual is claimed
    not_charged_here:
      - torsion-image oracles (forbidden)
      - free End(E)
      - quantum Kuperberg queries (KN-OPEN-014 secondary lane, not selected)
      - orientation Cl-vectorization (IDEA-20260725-002 closed)
      - invented protocol fields not in the knowledge spine
    cost_convention_name: sqi_fs_t0_aux_sufficiency_plus_kn_tech_050_if_classical_residual
  cheapest_falsification_gate:
    type: derivation
    description: >-
      Zero-compute derivation: restate SQI-FS-T0 from KN-TECH-028 / KN-LIT-072 /
      KN-LIT-073; check KN-TECH-026 necessary conditions; check Petit without
      torsion images; emit exactly one of
      T0_FAILS_KANI_AND_PETIT_NECESSARY_CONDITIONS,
      T0_SUPPLIES_NAMED_NON_TORSION_AUXILIARY, or
      SPINE_INSUFFICIENT_TO_FREEZE_T0.
    budget:
      wall_clock_seconds: 1800
      memory_gb: 2
      maximum_runs: 0
    falsifies_if:
      - Embedding / Kani claims are made without meeting necessary conditions under SQI-FS-T0.
      - Derivation invents SQIsign version fields not present in the knowledge spine (SPINE_INSUFFICIENT_TO_FREEZE_T0 blocks promotion).
      - Only outcome is documentation already fully contained in KN-TECH-028 with no KN-OPEN-015 decision delta (Coordinator demotes; not a structure-attack track).
      - Any path reopens IDEA-20260725-002 orientation Cl-cost.
  novelty_screen:
    against_knowledge_spine:
      - KN-TECH-028 / KN-LIT-072 assert SQIsign reveals no torsion images but do not freeze a named transcript object or run a KN-OPEN-015 sufficiency classification.
      - KN-OPEN-015 records the general auxiliary-structure question; survivors are listed, not transcript-typed.
      - KN-TECH-026 requires degree AND torsion action; this candidate uses that as a necessary-condition template against SQI-FS-T0, not as a rediscovery target.
      - KN-TECH-050 applies only if a named classical non-torsion residual is claimed.
    against_known_sidh_attacks:
      - Not Castryck-Decru / Maino-Martindale / Robert rediscovery (torsion images excluded from SQI-FS-T0).
      - Not GPST adaptive torsion misuse.
    dedup_verdict: >-
      Distinct from closed IDEA-20260725-001 (full-cost re-baseline) and closed
      IDEA-20260725-002 (orientation Cl-cost). Instantiates the BATCH-001 / BATCH-003
      deferred SQIsign-transcript route by freezing SQI-FS-T0 first, as required by
      DEC-20260725-005.
  interpretation_limits:
    - Novelty-screen admission only; not a cryptanalytic break of SQIsign, CGL, or CSIDH.
    - Does not count toward GOAL-SSI-001 completion until a confirmed charged advantage or decision-relevant KN-OPEN-015 classification exists under independent review.
    - Prefer fail-closed / spine-insufficient over untyped slogans.
    - Independence weakened by same-lineage fallback model.

