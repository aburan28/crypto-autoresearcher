falsifiable_criteria:
  task_id: TASK-20260730-135
  goal_id: GOAL-SSI-001
  batch_id: BATCH-041
  idea_id: IDEA-20260729-001
  decision_ref: DEC-20260730-038
  evidence_input_ref: EV-SSI-040
  registered_before_claim: true
  zero_compute: true
  question: Does τ's finiteness reduce to a host-INDEPENDENT property (mixing-time / re-randomization
    / collision-distribution of the sieve) that is statable WITHOUT the full Verify body?
  outcomes:
    reduction_exists:
      id: OUTCOME-R
      earns: refute_verify_relativity_candidate
      requires_all:
      - 'P: a named property Prop that does not quantify over the full Verify predicate body'
      - 'I: an argument that Prop is host-independent (identical across admissible host acceptance semantics
        compatible with FC0, or else independent of host Verify body by construction)'
      - 'F: a falsifiable criterion for Prop (an observable that would refute Prop if observed)'
      - 'B: a bound or implication Prop ⇒ (∃ source-compatible finite τ) OR Prop ⇒ E[τ]<∞ / joint QSPC
        finiteness in the BATCH-018 sense, within a stated scope'
      - 'N: Prop is not an inflation of a merely local collimation kernel (BATCH-012 K_v1,v2 / p(v1,v2))
        into an end-to-end Verify-relative stopping law'
      falsified_if:
      - Prop secretly reintroduces Verify(x,k') acceptance semantics
      - Prop is only local (one collimate step) with no end-to-end coverage of BATCH-018 required τ slots
      - Prop invents transition_kernel / iid_or_mixing_hypothesis / uniform_success_lower_bound without
        a committed citation
    dependence_essential_scoped:
      id: OUTCOME-D
      earns: named_inventor_protocol_s4_obstruction
      requires_all:
      - 'S: an explicit scope (class of admissible host acceptance semantics compatible with FC0)'
      - 'U: a discharged ∀-hosts argument: for every host in S, ¬∃ finite source-compatible Verify-relative
        τ (or joint finiteness fails)'
      - 'A: the argument is about the object/class, not about current program availability (host gap /
        missing pin)'
      - 'G: forward guidance naming stopping-rule families that remain open after the obstruction'
      falsified_if:
      - Argument only shows (current state ⇒ τ unsourced) — availability gap (AGENTS.md rule 5)
      - ∀-hosts quantifier untouched
      - Method equally concludes no-τ for a solvable nearby instance whose host is merely unpinned (method
        ceiling)
    neither_pause:
      id: OUTCOME-N
      earns: qm_stopping_lane_pause_with_revisit
      requires_all:
      - Neither OUTCOME-R nor OUTCOME-D is earned from committed in-repo structure in this bounded step
      - Do NOT re-record obstruction analysis as unverified a ninth time as the primary disposition
      - 'Revisit conditions name at least one of: admissible CollimationSieve pin; host-independent collision-distribution
        result satisfying OUTCOME-R requirements'
      falsified_if:
      - A ninth unverified obstruction re-record is presented as the batch disposition
      - Pause lacks concrete revisit conditions
      - Illicit clearance / breakthrough / fake-τ claimed alongside pause
  null_object_control_note: 'Per inventor-protocol §3 / BATCH-040 §5: any future purported τ or Prop signal
    must be run against a random/permuted acceptance distribution of the same shape before belief. No
    τ/Prop signal is claimed in this batch, so no control measurement is owed yet; registered for successors.'
