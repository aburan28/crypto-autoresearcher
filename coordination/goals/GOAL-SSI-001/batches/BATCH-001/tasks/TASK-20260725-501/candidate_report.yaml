candidate:
  id: IDEA-20260725-001
  title: Full-cost re-baselining of classical supersingular path-finding
  target_problem: >-
    Pure supersingular isogeny path-finding / CGL preimage hardness
    (no torsion images; survivor regime of KN-TECH-024 and KN-TECH-029).
  target_open_problem: KN-OPEN-013
  mechanism_summary: >-
    The commonly quoted classical baselines mix a high-memory meet-in-the-middle
    algorithm (O~(p^{1/2}) time and space on the F_{p^2} graph) with the
    Delfs-Galbraith F_p-subgraph improvement (O~(p^{1/4})). Under the program's
    Wiener-style full-cost discipline (KN-LIT-094, KN-TECH-035), exponential
    MITM tables are not free: the matched baseline for 'beating path-finding'
    must charge memory and wiring, exactly as the program already requires for
    BSGS vs rho (ECDLP) and sieving vs enumeration (lattices, KN-TECH-044).
    The proposed mechanism is a cost-model correction that (i) instantiates
    full-cost accounting for isogeny-graph MITM, (ii) compares it to low-memory
    distinguished-point / parallel-collision-search analogues on the same graph,
    and (iii) states which algorithm is the honest matched baseline before any
    claimed algorithmic speedup is measured. This does not assert a sub-p^{1/4}
    endomorphism-ring break; it asserts that several published comparisons may
    be ranking algorithms under inconsistent accounting.
  assumptions:
    - Pure path-finding instance: two supersingular curves, no torsion images under a secret isogeny.
    - Graph model as in KN-TECH-024 / KN-TECH-029 (Ramanujan ell-isogeny graph; Delfs-Galbraith F_p subgraph available when both curves are F_p-rational).
    - Wiener-style three-dimensional wiring / full-cost model of KN-LIT-094 applies to large random-access tables of j-invariants or path nodes.
    - Low-memory collision-search analogues are expressible as walks with distinguished points on the isogeny graph (standard distinguished-point technique; exact isogeny-graph variant must be specified in the derivation gate).
    - No SQIsign transcript, no CSIDH secret, no SIDH torsion oracle.
  predictions:
    - metric: full_cost_exponent_of_MITM_vs_step_count
      direction: higher
      minimum_effect: >-
        MITM's full-cost exponent strictly exceeds its step-count exponent
        (qualitative Wiener-style separation), or a documented proof that the
        isogeny-graph table access pattern escapes the Wiener bound.
    - metric: matched_baseline_identity
      direction: different
      minimum_effect: >-
        Under a single named cost convention, either (a) low-memory collision
        search becomes the cheaper classical baseline on the F_{p^2} graph for
        some asymptotic regime, or (b) Delfs-Galbraith remains dominant and MITM
        is relegated to a high-memory footnote — with the comparison stated
        explicitly so later candidates cannot silently pick the weaker baseline.
  full_cost_boundary:
    charged:
      - isogeny / j-invariant evaluations (step count)
      - storage of MITM lists / distinguished-point tables
      - wiring / memory-access cost under KN-LIT-094 model
      - classical parallelization only when processors and interconnect are priced
    not_charged_here:
      - quantum queries (separate CSIDH lane; KN-OPEN-014)
      - torsion-image oracles (forbidden; SIDH regime)
      - SQIsign signing transcripts as leakage (separate lane if ever proposed)
    cost_convention_name: wiener_full_cost_plus_isogeny_step_count
  cheapest_falsification_gate:
    type: derivation
    description: >-
      Write a short derivation note that (1) restates MITM and a low-memory
      distinguished-point walk on the supersingular ell-isogeny graph with
      explicit time/space exponents, (2) applies KN-LIT-094 full-cost accounting
      to the MITM table, (3) compares to Delfs-Galbraith O~(p^{1/4}) under the
      same convention, and (4) outputs a single matched-baseline recommendation
      for GOAL-SSI-001. No curve computation required.
    budget:
      wall_clock_seconds: 1800
      memory_gb: 2
      maximum_runs: 0
    falsifies_if:
      - The derivation shows MITM full cost collapses to the same exponent as step count under stated wiring assumptions (mechanism has no effect).
      - The low-memory isogeny-graph collision-search analogue is not well-defined without uncharged oracles or nonstandard graph access.
      - Delfs-Galbraith already strictly dominates both under every honest convention, and the candidate adds no decision-relevant correction (then demote to documentation-only, not a cryptanalytic mechanism).
  novelty_screen:
    against_knowledge_spine:
      - KN-TECH-029 states MITM time-and-space and Delfs-Galbraith p^{1/4} but does not apply Wiener full-cost accounting.
      - KN-TECH-035 / KN-LIT-094 develop full cost for ECDLP (BSGS vs rho); not yet applied to isogeny-graph path-finding.
      - KN-TECH-044 applies full cost to lattice sieving memory; methodological sibling, different domain.
      - KN-OPEN-013 asks about sub-p^{1/4} structure attacks; this candidate does not claim one — it re-baselines the cost model used to judge them.
    against_known_sidh_attacks:
      - Not Castryck-Decru / Maino-Martindale / Robert (requires torsion images).
      - Not GPST / Petit torsion misuse.
      - Not KLPT (quaternion side; trapdoor use, not attack on unknown endomorphism ring).
    dedup_verdict: >-
      Distinct from SIDH breaks and from structure-attack proposals. Closest
      siblings are program-internal cost-discipline entries; the isogeny-graph
      instantiation is not present in the spine.
  interpretation_limits:
    - A cost-model correction is not by itself a cryptanalytic break of CGL, SQIsign, or CSIDH.
    - Asymptotic full-cost results have unextracted constants; they settle baseline identity, not a concrete bit-security number.
    - If the gate only confirms Delfs-Galbraith as dominant under all conventions, the correct Coordinator disposition is documentation / knowledge update, not a claimed advantage.
    - Oriented-curve and CSIDH-quantum questions (KN-OPEN-013 remainder, KN-OPEN-014) remain open and are not addressed by this candidate.

screened_and_excluded:
  - route: Rediscover SIDH torsion-image / Kani glue-and-split key recovery
    reason: Closed known attack (KN-TECH-026); forbidden as novelty target by GOAL-SSI-001 / RQ-SSI-001.
  - route: Ordinary-curve l-isogeny neighbor Semaev yield (RQ-ISO-001 / EXP-ISO-001)
    reason: Wrong problem class; already scoped-negative for PDP yield, not supersingular PQ hardness.
  - route: Vague 'orientation makes endomorphism rings easier' without typed mechanism
    reason: KN-OPEN-013 already records the question; slogan without a cheapest gate is not admissible.
  - route: New CSIDH quantum exponent claim without circuit/query model
    reason: KN-OPEN-014 requires contested concrete constants; no cheap decisive gate without a pinned cost convention and numeric claim.
  - route: SQIsign transcript leakage → Kani-style embedding
    reason: >-
      Requires a precise leakage model of Fiat-Shamir responses; higher setup cost
      than the full-cost re-baseline gate; defer unless BATCH-001 candidate fails
      review as non-decision-relevant.

