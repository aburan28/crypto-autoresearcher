    - every predecessor review path resolves to the exact committed c057fd artifact
    - C-HELPER-v1 entry/header/capacity/digest widths include middle_factor_code
    - all declared frames, bounded counters, manifests, query keys, terminal outcomes, and cost equations are explicit
    - HNF/output, edge certificate, replay, null, C-pair, and synthetic diagnostic contracts are serialized
    - execution_authorized remains false
