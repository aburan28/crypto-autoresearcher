  repairs:
    - id: R1
      issue: successor_provenance_and_immutable_input_paths
      repair: >-
        The successor names the exact c057fd Validator and Red Team artifacts and
        records their snapshot commit. Future review directories and mutable goal
        pointers are excluded from runtime input scope.
    - id: R2
      issue: physical_c_helper_undercount
      repair: >-
        C-HELPER-v1 now has an exact header, static capacity H_C, occupancy bytes,
        digest coverage, and entry bytes b_curve+b_slot+16+4. The final four bytes
        are the committed middle_factor_code, so helper capacity and memory cannot
        omit that field.
    - id: R3
      issue: incomplete_ssi_bytes_and_counter_bounds
      repair: >-
        Build/query/null/graph frames include domain, version, p/branch codes,
        generator identity, all seeds, target and manifest digests, and bounded
        counter_biguint values. Length prefixes have allocation maxima and reject
        noncanonical encodings.
    - id: R4
      issue: manifest_order_and_target_query_binding
      repair: >-
        SSJ-MANIFEST-v1, ORDER-MANIFEST-v1, and C-HELPER-v1 have exact header/body
        fields and digests. ORDER-MANIFEST-v1 is committed setup or named generator
        output, never a hidden full-order oracle. Query keys derive from target_curve_id
        and query-accessible committed digests.
    - id: R5
      issue: finite_terminal_and_cost_semantics
      repair: >-
        The hard 32768-attempt protocol has serialized terminal codes for success,
        finite no-hit saturation, invalid setup/certificate, overflow, and external
        unavailability. q_run, T_attempt, T_total, T_q_run, and exact integer
        break-even are defined without turning symbolic q into a finite observation.
    - id: R6
      issue: hnf_output_and_edge_certificate_boundary
      repair: >-
        HNF pullback and finite saturation are named algorithms with caps and per-step
        traces. A/B/C terminal order sources are explicit. EDGE-CERT-v1 binds the exact
        edge bytes, transition root, availability class, provider receipt where needed,
        digest verification, and invalid-certificate outcome.
    - id: R7
      issue: paired_replay_and_null_serialization
      repair: >-
        Paired traces carry certificate and event bytes, witness bytes, continuation,
        and delta_path fields. Next-distinct, Fisher-Yates rejection, singleton rules,
        and small-universe outcomes are fully serialized and bounded.
    - id: R8
      issue: c_pair_calibration_and_synthetic_reference
      repair: >-
        C pair generation uses committed marginal histograms, descriptor recomputation,
        rejection accounting, a hard cap, and matched null access. The graph diagnostic
        binds all seeds and counters and states an exact rational first-hit recurrence
        and max-cell aggregation; it remains non-SSI and non-gating.
  protected_history:
    - experiments/EXP-SSI-357363/specification.yaml
    - experiments/EXP-SSI-8e589d/specification.yaml
    - ledger/evidence/EV-SSI-736443.yaml
    - ledger/decisions/DEC-20260809-7a7099.yaml
  completion_gate:
