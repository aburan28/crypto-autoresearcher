    - metric: declared_prime_and_order_widths
      status: verified_as_static_arithmetic
      result: >-
        From exact bit lengths 251 and 505, b_p is 32 and 64 and b_curve is
        65 and 129. b_mag=2*b_p+5 gives 69 and 133, b_scalar=1+b_mag gives
        70 and 134, and 1+b_curve+16*b_scalar gives b_order 1186 and 2274.
        These are direct width consequences, not run data.
      references:
        - experiments/EXP-SSI-8fbe66/specification.yaml:67-95
        - experiments/EXP-SSI-8fbe66/specification.yaml:225-235
    - metric: count_widths_and_shared_header
      status: verified_as_declared_formula_with_scope_gap
      result: >-
        b_count=ceil((bit_length+1)/8) gives 32 and 64; b_attempt=ceil((bit_length+20)/8)
        gives 34 and 66; b_shared=17+3*b_attempt+b_count gives 151 and 279.
        The formulas are consistent for the named H, vertex, and attempt
        fields, but not every counter that appears later is assigned one of
        these widths.
      references:
        - experiments/EXP-SSI-8fbe66/specification.yaml:175-180
        - experiments/EXP-SSI-8fbe66/specification.yaml:217-220
        - experiments/EXP-SSI-8fbe66/specification.yaml:247-250
