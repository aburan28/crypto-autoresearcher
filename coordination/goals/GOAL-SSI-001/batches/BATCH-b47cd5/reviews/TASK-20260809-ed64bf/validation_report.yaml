    - label: synthetic_reference_binding
      severity: diagnostic_contract
      finding: >-
        The recurrence itself is explicit, but the graph frame omits required
        common seed fields and the target-set/start derivation is only named.
        The text alternates between an exact average over the uniform target-set
        population and an average over the sampled target sets represented by
