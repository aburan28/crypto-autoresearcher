      references:
        - experiments/EXP-SSI-357363/specification.yaml:96-119
        - experiments/EXP-SSI-357363/specification.yaml:330-381
        - coordination/goals/GOAL-SSI-001/batches/BATCH-c057fd/reviews/TASK-20260809-ad1631/validation_report.yaml:507-599
        - coordination/goals/GOAL-SSI-001/batches/BATCH-c057fd/reviews/TASK-20260809-bcd3d9/red_team_report.md:158-217

  unresolved_defects:
    - label: snapshot_receipt_self_binding_caveat
      severity: provenance_caveat
      finding: >-
        The queue archive binding proves commit 9b476537a and all path hashes,
        but the immutable snapshot-receipt.json itself still has commit_sha:null
        and verification.status:pending_post_commit.
      required_successor_action: >-
        Preserve the receipt and let the Coordinator's archival workflow record
        any separate post-commit verification; do not rewrite this receipt.
    - label: canonical_experiment_schema_drift
      severity: schema_integrity
      finding: >-
        The successor parses as YAML but fails the checked-in experiment JSON
        schema because the random-six-hex ID, null hypothesis_id, custom controls
        mapping, missing independent_variables/replication, and custom fields
        are outside the legacy schema. The predecessor fails the same legacy
        schema, so this is unresolved repository/schema drift rather than a new
        YAML syntax error.
      required_successor_action: >-
        Add or bind a design-only experiment schema compatible with the current
        record contract and six-hex IDs, or record an explicit schema
        supersession before treating the successor as schema-valid.
    - label: direct_predecessor_input_binding
      severity: provenance_integrity
      finding: >-
        experiment.supersedes and the batch manifest identify EXP-SSI-357363,
        while experiment.inputs.predecessor_contract identifies
        EXP-SSI-8e589d. The direct predecessor being reviewed is therefore not
        named consistently in the successor input map.
      required_successor_action: >-
        Add an immutable additive correction that binds EXP-SSI-357363 as the
        direct predecessor while retaining the older chain references.
    - label: ssj_manifest_generator_commitment
      severity: execution_blocking
      finding: >-
        SSJ-ENUM-v1 remains a procedural name. Exact polynomial serialization,
        root multiplicity and normalization rules, generator-version bytes, and
        a committed S_p digest preimage/value are absent from SSJ-MANIFEST-v1.
      required_successor_action: >-
        Freeze the polynomial and generator byte encodings, version commitment,
        root rules, and complete manifest generator/digest contract.
    - label: order_manifest_wire_schema
      severity: execution_blocking
      finding: >-
        ORDER-MANIFEST-v1 names fixed header and entry fields but does not give
        its digest preimage, exact record_sha256 preimage, generator-version
        wire bytes, or a complete distinction between committed setup and
        ORDER-GEN-v1 output bytes.
      required_successor_action: >-
        Freeze the ORDER-MANIFEST header/body bytes, generator/version fields,
        digest preimages, source receipt, duplicate/capacity rules, and helper
        memory equation.
    - label: c_helper_physical_layout
      severity: execution_blocking
      finding: >-
        C-HELPER-v1 repairs the logical entry width and states H_C=2*max(1,A_C),
        but no exact body layout says how H_C occupancy bytes and A_C entries
        are ordered, whether entries are compact or per-slot, how empty slots
        are represented, or the resulting header/body byte formula. H_C is
        derived in prose rather than serialized as an explicit capacity field.
      required_successor_action: >-
        Specify the physical slot array, retained payload array if any, empty
        slot encoding, exact body length, H_C wire field or canonical derivation,
        endpoint-slot uniqueness, and helper-specific probe width.
    - label: c_helper_digest_preimage_conflict
      severity: execution_blocking
      finding: >-
        The earlier auxiliary-manifest text calls the C-helper digest the hash
        of the framed binary body, while contract_repair_v6 defines it as
        SHA256(header_without_body_digest||body). The field is named body_sha256
        although the latter preimage includes header bytes.
      required_successor_action: >-
        Choose one non-circular digest preimage and use the same definition in
        the header, body, receipt, and query-key binding.
    - label: ssi_bytes_domain_and_frame_completeness
      severity: execution_blocking
      finding: >-
        Used domains edge_transition and null are absent from literal domain_codes.
        The graph frame omits p_code, branch_code, and seed_version; the builder
        and null frames omit the required generator_id/version fields; and replay
        is simultaneously said to have no seed and to require a replay seed
        frame. These are not uniquely framed SSI-BYTES-v1 inputs.
      required_successor_action: >-
        Add every literal domain/version code and enumerate one complete frame
        for each build, query, replay, pair-null, graph-null, manifest, and edge
        transition input, including generator identity and absent-manifest
        markers.
    - label: ssi_bytes_wire_rule_conflicts
      severity: execution_blocking
      finding: >-
        The generic frame requires length-prefixed fields and permits u64
        counters, while the repair contract requires seed_version and only
        length-prefixed fields, and many concrete frames use raw u32 fields.
        EDGE-CERT uses a u32 length despite the global uint16 length-prefix rule;
        digest-to-integer endianness and hash_domain bytes are also unspecified.
      required_successor_action: >-
        State explicit exceptions or unify all fixed/variable fields, lengths,
        byte order, digest-to-integer conversion, hash-domain bytes, and parser
        maxima in one SSI-BYTES-v1 table.
    - label: cryptographic_scale_counter_overflow
      severity: execution_blocking
      finding: >-
        counter_biguint is capped at four magnitude bytes and max value
        4294967295, yet builder record_counter_biguint ranges to
        C_attempt=2^20*S_req. At the smallest positive cryptographic sigma row
        this already exceeds 2^32, and the declared saturation cap
        2^(b_p*8+4) also exceeds both the four-byte counter and the stated
        uint64 bounded-count maximum. edge_index_biguint, event_index, and
        delta_path_u64 likewise lack proved scope-safe maxima.
      required_successor_action: >-
        Assign each counter a wire type and declared maximum sufficient for its
        actual bound, including builder, saturation, edge, trace, and delta
        counters, or reduce the declared bounds with a typed terminal outcome.
    - label: query_key_not_connected_to_lookup
      severity: execution_blocking
      finding: >-
        The successor defines a target-derived query_key_frame, but the common
        probe rule still derives initial_slot from the record hash_key and
        table_capacity_bytes. No branch-specific mapping from query_key to a
        selected slot, equality predicate, or secondary index is specified.
        The probe input is also outside the generic framed grammar.
      required_successor_action: >-
        Define the target-key lookup algorithm and its collision/equality path,
        including branch-specific absent helper/order digest markers, and charge
        every probe and comparison.
    - label: finite_manifest_saturation
      severity: execution_blocking
      finding: >-
        The builder stops at S_req or C_attempt. It has no terminal outcome for
        S_eff=|V_p|<S_req, no exact finite-manifest saturation stop, and no
        reconciliation of attempted, duplicate, padding, and setup costs for
        that case. saturation_failure is only described in the HNF saturation
        context and does not repair this builder case.
      required_successor_action: >-
        Add a deterministic finite-manifest saturation terminal and complete
        counter/trace/cost semantics before cap exhaustion.
    - label: terminal_code_and_counter_serialization
      severity: execution_blocking
      finding: >-
        Terminal outcomes are named but terminal_code_u8 and reason_code_u16le
        values are not assigned. completed_attempt_count, success_count,
        rejection/cap counts, and outcome-specific continuation are not all
        assigned exact frame locations, widths, or overflow behavior.
      required_successor_action: >-
        Freeze literal terminal/reason codes and serialize every finite outcome
        counter with exact scope, denominator, cap, and overflow semantics.
    - label: hnf_algorithm_and_bounds
      severity: execution_blocking
      finding: >-
        HNF pullback says to apply one named row-operation sequence per edge but
        does not name or define that sequence, edge-degree/orientation mapping,
        pivot/remainder normalization, or equivalent-basis transformation.
        Saturation says to use a named step without defining it; degree_product
        has no derivation or allocation maximum; and the stated saturation cap
        is not representable by the declared bounded counters.
      required_successor_action: >-
        Specify executable HNF and saturation algorithms, scalar envelopes,
        degree-product derivation/maximum, intermediate bounds, and exact
        per-step trace bytes.
    - label: output_witness_bytes
      severity: execution_blocking
      finding: >-
        output_gate_bytes names owner and witness bytes, but normalized_output
        separately names scalar_sign and scalar_magnitude without assigning
        them to the gate schema. Rank-one/scalar classification, normalized HNF
        envelope, output digest preimage, and treatment/replay witness containers
        are not complete physical schemas.
      required_successor_action: >-
        Define one canonical output witness record with type codes, all lengths,
        scalar rejection predicate, digest preimage, fixed bounds, and separate
        treatment/replay serialization where paired.
    - label: edge_certificate_wire_and_transition
      severity: execution_blocking
      finding: >-
        EDGE-STREAM-v1 carries edge_count as uint32_le while EDGE-CERT-v1 carries
        edge_count as b_count, with no explicit outer/inner equality field rule.
        The transition-root initial value is undefined, edge_transition has no
        literal domain code, edge_count<=L_steps is not a certificate parse
        condition, and certificate versus edge-byte digest identity is unclear.
      required_successor_action: >-
        Unify the outer and inner count encodings, set the initial root and
        edge-index bounds, add the domain code, bind edge_count to L_steps, and
        define certificate/edge digest preimages and storage references.
    - label: edge_availability_metadata
      severity: execution_blocking
      finding: >-
        Availability code 0x02 is said to require provider identifier,
        retrieval receipt, local content digest, and byte length, but the
        EDGE-CERT wire format contains only availability_code and edge digest/
        length fields. The provider and receipt bytes are not assigned to an
        exact committed artifact schema.
      required_successor_action: >-
        Bind provider/receipt metadata and byte recheck evidence in an explicit
        certificate or immutable run-input record while keeping unavailable
        bytes operational rather than mathematical evidence.
    - label: replay_trace_and_witness_bytes
      severity: execution_blocking
      finding: >-
        paired_trace_fields have one witness_bytes field, no witness_count,
        no pre_gate_trace_sha256 field, no separate treatment/replay trace
        containers, no event-code literals or field widths, and only a
        certificate digest while replay_contract says replay consumes certificate
        bytes. delta_path_u64 has no sign, formula, denominator, or aggregation,
        and early success is not reconciled with the 32768-attempt paired scope.
      required_successor_action: >-
        Freeze the complete paired record, event stream, certificate reference,
        both witnesses, trace hash bytes, signed/exact delta calculation, and
        continuation/attempt pairing rules.
    - label: null_generator_and_permutation
      severity: execution_blocking
      finding: >-
        next_distinct uses an unregistered domain and returns
        singleton_not_applicable when no distinct value is found even for N>=2.
        CTRL-SHUFFLED-FIBER applies modulo S_eff but only checks |V_p|<2, so
        S_eff=0 or 1 is not fully handled. Fisher-Yates rejection below 2^32
        lacks a canonical draw-to-index and rejection-frame encoding.
      required_successor_action: >-
        Define non-singleton generator exhaustion, S_eff<2 applicability,
        exact permutation words/counters/thresholds, and all null seed/domain
        frames.
    - label: owner_specific_null_path_identity
      severity: execution_blocking
      finding: >-
        Tagged nulls regenerate an order for a different owner and owner-mismatch
