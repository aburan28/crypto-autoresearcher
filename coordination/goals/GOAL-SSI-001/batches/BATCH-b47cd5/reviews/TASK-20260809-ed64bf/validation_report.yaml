        owner-specific EDGE-CERT binding or construction proves that edge tuples,
        HNF operations, and certificate bytes remain identical after the owner
        changes.
      required_successor_action: >-
        Either serialize and compare a separately generated owner-specific path
        as a distinct control, or provide a formal byte-identity construction;
        do not infer path identity from matching stage names.
    - label: c_pair_generation_and_calibration
      severity: execution_blocking
      finding: >-
        C-pair generation names treatment-matched endpoint histograms and
