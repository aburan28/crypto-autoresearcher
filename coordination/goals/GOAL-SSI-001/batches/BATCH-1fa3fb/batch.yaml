  entailed_control_analysis:
    why_this_block_is_here: >-
      THIS CAMPAIGN HAS NOW FOUND SIX INSTANCES OF A CHECK WHOSE PASS WAS ENTAILED BY
      ITS OWN CONSTRUCTION - AC-1's pass region being exactly how AC-1's input is built
      (RT-3, CF-21); AC-4's eighth pattern carrying an uppercase literal against a
      lowercased haystack so it can never fire (F-1, CF-13); the shape-only parse
      control that would have passed on the very file it exists to detect the amendment
      of; and CF-28's still-missing object. A BATCH OF THREE CONFIRMATION TASKS IS THE
      MOST EXPOSED SHAPE THIS FAILURE MODE HAS, because the assignment already contains
      the shape of its own answer. The question is therefore asked IN ADVANCE of
      whatever these producers return, not after.
    what_would_make_this_batchs_output_vacuous:
      - >-
        ENTAILED BY THE ASSIGNMENT. Asked "confirm that X exists", any agent returns
        "X exists". A confirmation set whose content is guaranteed by the question
        carries no information about the object.
      - >-
        ENTAILED BY THE PROMPT. This control plane names the exact key paths, the exact
        line range and the exact question. A report that is those names populated into
        "present / present / present" is the dispatching session's outline with a
        confirmation header.
      - >-
        ENTAILED BY THE CAMPAIGN RECORD. Re-stating what DEC-20260904-4c81b6 already
        says about the locator, or what the redraft already says about clause_2's
        incorporation, and relabelling it as a confirmation, is a bibliography and not
        a reading.
      - >-
        AN INSTRUMENT THAT CANNOT FAIL. A leak scan that never fires; a shape predicate
        that is true of any five lines of any document; an existence check that would
        report a key path present whether or not it is there.
    the_named_entailed_control_objects:
      OBJ-A:
        name: THE KNOWN-ABSENT KEY PATHS, for P-2.
        what: >-
          Run the same key-path existence procedure, UNCHANGED, on three probe key
          paths in the SAME record - `amendment.corrected_model.log_two_law_restated`,
          `amendment.corrected_model.sign_convention` and
          `amendment.corrected_model.invariants` - which this control plane does not
          expect to exist and which it has NOT checked. The probe names are chosen to
          contain no digits so that reporting them cannot itself carry a value.
        what_it_must_do: >-
          RETURN ABSENT ON EACH. If the procedure reports a probe key path PRESENT, the
          existence check is not discriminating and THAT IS A BREAK, reported as one,
          and P-2 is not satisfied. IF A PROBE KEY PATH TURNS OUT GENUINELY TO EXIST,
          THAT IS NOT A BREAK - it is a fact about the record, reported as one, and the
          control is reported as inconclusive for that probe.
      OBJ-B:
        name: THE WRONG-SHAPE RANGE, for P-3.
        what: >-
          Run the same shape predicate list S1-S7, UNCHANGED, on
          inputs/P13-WESOLOWSKI-2026/paper_fulltext.md lines 1-5, the document head,
          which is known not to be the anchor table and which carries no governed value.
        what_it_must_do: >-
          RETURN "DOES NOT HAVE THE DECLARED TABLE SHAPE" - concretely S2 FALSE. If S2
          is TRUE on the document head, the shape predicate is vacuous and every S2
          answer on the real block is worthless. THAT IS A BREAK, reported as one.
      OBJ-C:
        name: THE NON-RESOLVING LOCATOR, for P-3.
        what: >-
          Run the same resolution procedure on a line range of the same file that is
          beyond its end, chosen by the task from its own measured line count and
          reported as chosen that way.
        what_it_must_do: >-
          RETURN "DOES NOT RESOLVE". A resolution procedure that resolves a locator past
          the end of a file resolves anything, and a confirmation from it means nothing.
          THAT IS A BREAK.
      OBJ-D:
        name: THE COUNTERFACTUAL, for P-1.
        what: >-
          The ruling names the positions available on RT-4's licensing question, names
          which committed bytes decide between them, and names AT LEAST ONE COMMITTED
          ARTIFACT THAT, HAD IT READ DIFFERENTLY, WOULD HAVE FORCED THE OTHER POSITION.
        what_it_must_do: >-
          PRODUCE SUCH AN ARTIFACT. A ruling that cannot name what would have changed it
          has not ruled, it has restated, and THAT IS A BREAK. This is the only control
          available for an object whose merits nobody in this batch may attack.
      OBJ-E:
        name: THE LEAK-SCAN POSITIVE CONTROL, for both P-2 and P-3.
        what: >-
          Exercise the digit scan on a synthetic string written OUTSIDE the repository -
          `SYNTHETIC-LEAK-PROBE 1234.5678` - which has no relation to any campaign
          quantity, any anchor, any crossover and any margin.
        what_it_must_do: >-
          FIRE. A leak scan that stays silent on a plainly leaking string is not a scan,
          and its silence over the real artifacts carries no information. THAT IS A
          BREAK.
    both_directions_are_required: >-
      A PROCEDURE THAT RETURNS NOTHING ON EVERY OBJECT - INCLUDING THE REAL ONE - IS
      EQUALLY UNINFORMATIVE, and its silence is not evidence that a precondition is
      satisfied. The positive object in each case is the real one, and each task must
      report what its procedure ACTUALLY DID on it.
    the_reviewer_runs_them_too: >-
      TASK-20260906-28e6de OWNS J5 AND RUNS OBJ-A, OBJ-B, OBJ-C AND OBJ-E ITSELF, and
