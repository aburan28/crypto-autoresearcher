      Coordinator. THE CAMPAIGN DOES NOT STOP AND THE GOAL STAYS `active`.
    - >-
      A KEY PATH IS ABSENT, AN INVARIANT IS NOT SATISFIED, OR THE LOCATOR DOES NOT
      RESOLVE. THIS IS NOT A STOP - IT IS A RESULT, AND A VALUABLE ONE. The task records
      it precisely, the round completes, and the closing decision records that the
      corresponding precondition is NOT SATISFIED and that the enacting batch may not
      open on the current precondition text. A task that softens such a finding to keep
      the enactment on schedule has committed the exact defect DEC-20260906-f709b2 named
      and refused.
    - >-
      AN ENTAILED-CONTROL OBJECT RETURNS THE WRONG ANSWER - a probe key path reported
      PRESENT by the procedure, S2 TRUE on the document head, a locator past end-of-file
      reported as resolving, a ruling with no counterfactual, or a leak scan silent on
      the synthetic probe. THE INSTRUMENT IS BROKEN AND ITS CONFIRMATION MEANS NOTHING.
      Report the BREAK, do not repair the instrument mid-round, and return the object to
      the Coordinator.
    - >-
      THE SNAPSHOT COMMIT CANNOT BE MADE, or does not change exactly the nine declared
      paths. THE REVIEW IS NOT DISPATCHED; the batch stops and returns to the
      Coordinator. Reviewing uncommitted producer artifacts is not a fallback.
    - >-
      A PRODUCER ARTIFACT'S SHA256 AT LEDGER-ARCHIVE TIME DOES NOT MATCH WHAT THE
      SNAPSHOT ARCHIVE RECORDED. That means the reviewed object changed after it was
      reviewed. The archive stops and returns to the Coordinator; it is NOT a note and is
      NEVER repaired by re-hashing.
    - >-
      Any task that cannot complete within its declared budget stops and reports the
      exhaustion as an operational observation. A TIMEOUT, CRASH, MISSING DEPENDENCY OR
      EXHAUSTED BUDGET IS INFRASTRUCTURE SIGNAL AND IS NEVER NEGATIVE MATHEMATICAL
