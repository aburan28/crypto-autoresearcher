  no_blind_phase:
    declared: false
    statement: >-
      THIS BATCH HAS NO BLIND PHASE. No value is protected by hash, no
      `protected_sha256` map is armed, no commit-message history check gates any
      dispatch, and no task is handed a pre-merge worktree.
      `tools/check_review_independence.py --blind-history` IS NOT APPLICABLE to this
      batch; it MUST NOT be run or recorded, and a report of UNCHECKABLE from that
      mode would be CORRECT rather than a defect.
    ground_1_the_mechanism_describes_something_this_batch_does_not_have: >-
      `blind_rederivation` DESCRIBES AN AGENT RE-DERIVING A QUANTITY ANOTHER AGENT
      PRODUCED WHILE BLIND FROM THAT AGENT'S IMPLEMENTATION - the tool's own words are
      "name the producer's implementation, notes and report, or the independence is not
      checkable", and `assigned_to` must name an agent that FILES a review_attestation
      whose declared `sources_read` is then checked against `blind_from`. NO AGENT OF
      THIS BATCH RE-DERIVES ANOTHER AGENT'S OUTPUT. The one agent that could - the
      reviewer, which re-runs the P-3 digest, the shape predicates and the leak scan
      from the file itself - MUST READ EVERY PRODUCER ARTIFACT because they are its
      object, so any `blind_from` naming them collides with an honest `sources_read`.
      THAT IS THE IDENTICAL MECHANICAL REASON BATCH-314308 RECORDED, and it survives
      this batch's different shape.
    ground_2_i_will_not_put_a_false_description_in_a_machine_read_FIELD_TO_GET_A_GREEN_CHECK: >-
      THIS BATCH DOES HAVE A REAL FILE-LEVEL SEPARATION - the mutual containment
      between the P-2 and P-3 readers - AND IT IS TEMPTING TO DECLARE IT AS
      `blind_rederivation` PURELY TO OBTAIN THE MECHANICAL sources_read CHECK. I
      considered exactly that and refused it. `quantity` would have had to describe a
      re-derivation that does not exist, and putting a false description into a field a
      tool reads, so the tool returns green, is one notch from the mislabelled-control
      defect this campaign has now found six times - CF-21's AC-1, CF-13's AC-4 pattern
      that can never fire, and the shape-only parse control. THE CHECK I WANT IS REAL;
      THE FIELD THAT WOULD BUY IT IS THE WRONG FIELD.
    ground_3_this_authoring_task_could_not_arm_the_hygiene_map: >-
      `blind_phase_hygiene.protected_sha256` declares protected values BY HASH, and
      THIS AUTHORING TASK HOLDS NO SHELL - it cannot compute a sha256 and may not
      invent one. Arming it would additionally have required some session to run the
      governed numeric tokens through a hashing command, which is a new exposure for a
      channel - the commit message - that no artifact of this campaign has ever carried
      a governed value through and that a standing rule already forbids. A blind-phase
      declaration whose hygiene map is empty announces a protection that protects
      nothing, and a declaration that protects nothing teaches every later reader to
      skip the one that does.
    what_replaces_it_and_all_of_it_is_weaker: see containment_separation below.
    cf_15_first_limb_is_now_owed_for_a_FOURTH_batch_and_that_is_recorded_not_faded: >-
      CF-15's FIRST LIMB - naming the launching prompt as a protected channel INSIDE
      A BLIND-PHASE DECLARATION - HAS NO OBJECT HERE, FOR THE FOURTH BATCH RUNNING,
      because this batch declares no blind phase. IT REMAINS OWED. THIS BATCH CAME
      CLOSER THAN ANY PREDECESSOR AND FELL SHORT AT A NAMED PLACE, which is worth more
      to a successor than another bare deferral - it HAS a genuine, non-colliding
      file-level separation between two agents, which the previous three batches did
      not, and what it lacks is a QUANTITY one agent re-derives from another and a
      session with a shell to arm the digest map before dispatch. THE OBJECT THAT
      WOULD CREATE ONE, NAMED EXACTLY: a batch in which a SECOND agent independently
      re-derives a quantity a FIRST agent produced - the P-3 block digest and the
      seven shape predicates are exactly such a quantity - with the first agent's
      output in its OWN FILE so `blind_from` can name it without colliding with an
      honest `sources_read`, and with `protected_sha256` armed BEFORE DISPATCH by a
      session that HOLDS A SHELL. Its SECOND limb IS applied here: see
      launching_prompt_disclosure.

  containment_separation:
    what_it_is: >-
      THE ONE STRUCTURAL PROTECTION THIS BATCH HAS, AND IT IS A READ-SCOPE SEPARATION
      RATHER THAN A BLIND PHASE. TASK-20260906-6c5e0a (P-2) has NOTHING UNDER inputs/
      in its read_scope and may not open paper_fulltext.md. TASK-20260906-decbd5 (P-3)
      does NOT have BATCH-2e6130, cost_model.py, or BATCH-256a94's
      anchor_reconciliation.json in its read_scope. NEITHER PRODUCER READS THE OTHER'S
      GOVERNED OBJECT, so neither artifact can carry the other's governed content.
    the_launching_prompt_is_named_here_as_a_protected_channel: >-
      CF-15's SECOND LIMB, APPLIED, AND ITS FIRST LIMB'S SUBSTANCE APPLIED IN THE
      WRONG CONTAINER AND SAID TO BE. THE DISPATCHING SESSION MAY NOT REPAIR THIS
      SEPARATION BY SPEAKING ACROSS IT. It may not tell the P-2 agent anything it
      learned from the P-3 agent's transcript or from the block; it may not tell the
      P-3 agent anything about the charging law's crossover form; and IT MAY NOT
      RESTATE ANY GOVERNED VALUE TO ANY AGENT OF THIS BATCH FOR ANY REASON. If it does
      any of these, IT RECORDS IT VERBATIM in the relevant receipt - a disclosed
      contamination is a discount, an undisclosed one is a fabrication.
    it_is_weaker_than_a_blind_phase_and_is_recorded_as_weaker: >-
      A read_scope declaration is enforced by the dispatcher's scope validation and by
      each agent's own honest `sources_read`, and it is CHECKED AT A REVIEWER JOINT
      RATHER THAN BY A TOOL. A reviewer joint is weaker than
      `check_review_independence.py`'s mechanical `blind_from` comparison, and this is
      recorded as weaker rather than described as equivalent. The launching-prompt
      channel is closed by NO tool at all, in either design.
    the_second_separation: >-
      review_plan.yaml, which carries the Coordinator's prior, is OUTSIDE ALL THREE
      PRODUCERS' READ SCOPES. Everything a producer needs from it is reproduced on its
      own card and in the queue's handoff block. IF A CARD AND THE PLAN EVER DIFFER,
      THE PLAN GOVERNS and the divergence is a defect of this control plane, reported
      as one and never worked around inside a task.

