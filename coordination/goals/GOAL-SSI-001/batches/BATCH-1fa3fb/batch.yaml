# BATCH-1fa3fb - THE PRECONDITION-DISCHARGE BATCH FOR GOAL-SSI-001.
#
# THIS IS NOT THE ENACTING BATCH AND MUST NEVER BE PRESENTED AS ONE. Its whole
# object is to bring THREE of the eight preconditions of DEC-20260906-f709b2
# NA-1 INTO EXISTENCE - P-1, P-2 and P-3 - so that the enacting batch can be
# opened against a CHECKABLE SET rather than by re-arguing whether it is time.
# P-4 through P-8 are properties OF THE ENACTING BATCH ITSELF and are expressly
# NOT this batch's to satisfy.
#
# IT APPROVES NOTHING AND ENACTS NOTHING. EXP-WESOVOW-001 remains `approved` and
# UNAMENDED AT VERSION 1. The redraft at
# coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/protocol_amendment_redraft.yaml
# remains `status: draft`, `in_force: false`, `approved_by: null`. No hypothesis,
# experiment, research-direction or goal status transition occurs anywhere in it.
# GOAL-SSI-001 stays `active`.
#
# THIS BATCH HAS NO BLIND PHASE. There is no `blind_phase_hygiene` block below
# and no `protected_sha256` map. The reasoning is at no_blind_phase, and CF-15's
# FIRST LIMB IS THEREFORE OWED FOR A FOURTH BATCH, which is recorded rather than
# allowed to fade. `tools/check_review_independence.py --blind-history` is NOT
# APPLICABLE, MUST NOT be run, and an UNCHECKABLE from it would be CORRECT.
#
# THE SINGLE EASIEST PLACE IN THIS BATCH TO LEAK A GOVERNED VALUE IS P-3, WHICH
# READS A BLOCK THAT SITS DIRECTLY ON TOP OF ONE. The design that separates
# CONFIRMING A LOCATOR from CITING WHAT IT SAYS is at the_p3_anti_leak_design and
# is reproduced on the P-3 card. LOOKING IS NOW REQUIRED. LEAKING IS STILL
# FORBIDDEN.
batch:
  id: BATCH-1fa3fb
  goal_id: GOAL-SSI-001
  question_ids:
    - RQ-SSI-001
  title: >-
    THE PRECONDITION-DISCHARGE BATCH - produce the three substantive
    preconditions of the enacting batch and nothing else. P-1 a committed
    Coordinator ruling on RT-4's licensing question, drafted BEFORE any enacting
    producer runs so that producer can ATTACK the ruling rather than supply it.
    P-2 a committed reading of the BATCH-2e6130 amendment record that four
    consecutive rounds passed by on scope grounds. P-3 a committed confirmation
    of the clause_3 locator against the file, designed so that confirming the
    locator does not restate the governed value it sits on.
  status: ready_for_dispatch
  status_note: >-
    Successor control plane to BATCH-314308, which DEC-20260906-f709b2 closed as
    `revise` with exactly ONE next research action - the enacting batch, and only
    when its named precondition set exists. SIX TASKS: three producers in a
    strict priority order, one snapshot archive alone, one independent review,
    one ledger archive alone. This file authorizes no execution by itself;
    dispatch_queue.json is the bounded dispatch contract. NO hypothesis status,
    experiment status, version transition, or goal status moves in this batch.

  opened_under_next_action: >-
    Quoted from the committed GOAL-SSI-001 head (ledger/goals/GOAL-SSI-001/goal.yaml,
    field `next_action`), which this batch serves without being it - "THE NEXT
    RESEARCH ACTION is to open ONE bounded batch whose object is the Coordinator
    decision that would approve the redraft and move EXP-WESOVOW-001 off version 1
    - a status and version transition of an `approved`, frozen contract and the
    strongest act this campaign has taken - AND TO OPEN IT ONLY WHEN ALL EIGHT
    PRECONDITIONS OF DEC-20260906-f709b2 NA-1 EXIST, WHICH ARE NAMED SO A SUCCESSOR
    CAN CHECK THEM RATHER THAN RE-ARGUE WHETHER IT IS TIME."
  opened_under_next_action_how_it_was_obtained: >-
    THIS AUTHORING TASK HOLDS Read, Grep, Glob, Write, Edit AND NO SHELL. It could
    not run `python3 tools/goal_head.py show GOAL-SSI-001 --field next_action`. It
    read ledger/goals/GOAL-SSI-001/goal.yaml directly and independently read
    ledger/decisions/DEC-20260906-f709b2.yaml NA-1 and
    ledger/goals/GOAL-SSI-001/checkpoints/BATCH-314308.yaml `next_action`; all three
    agree on the eight preconditions, on the six items reserved to the enacting
    decision's own text, and on the express NON-preconditions. READING A FILE A TOOL
    RENDERS IS WEAKER THAN RUNNING THE TOOL and is recorded as such. THE DISPATCHING
    SESSION SHOULD RE-RUN THE TOOL AND RECORD ANY DIVERGENCE AS A FINDING rather
    than reconciling it silently.

  # =====================================================================
  what_this_batch_is_and_what_it_is_not:
    it_is_not_the_enacting_batch: >-
      STATED FIRST AND IN ITS OWN BLOCK SO IT CANNOT BE READ OUT OF ANYTHING BELOW.
      This batch does not compose, draft, rehearse, pre-approve or schedule the
      enacting decision. It does not decide whether the amendment should be
      enacted. It does not move EXP-WESOVOW-001 off version 1 and does not touch
      experiments/EXP-WESOVOW-001/specification.yaml, whose bytes must be identical
      at every instant of this batch. If a task of this batch finds itself about to
      approve, enact, or settle a reserved item, IT STOPS and returns the object to
      the Coordinator.
    what_it_is: >-
      A BOUNDED, THREE-ITEM DISCHARGE. It brings P-1, P-2 and P-3 into existence as
      COMMITTED objects, so that the enacting batch's own control plane can point at
      three files and say "these exist" rather than re-arguing readiness. That is
      the whole of it.
    why_this_and_why_now: >-
      THE PRECONDITION SET IS THE ONE THING STANDING BETWEEN THE COMMITTED RECORD
      AND A CHECKABLE ENACTING BATCH, and two of its three substantive items are
      CHEAPER THAN ANY ALTERNATIVE USE OF A ROUND. P-2 is ONE FILE READ that four
      consecutive rounds passed by on defensible scope grounds - the BATCH-79a0cb
      red team, the BATCH-60d6b9 validator, the BATCH-314308 producer, its reviewer,
      and the BATCH-314308 composing Coordinator - each correctly, and a fifth
      round passing it the same way would be the pattern DEC-20260906-f709b2 promoted
      it to a precondition to stop. P-3 is one locator confirmation that clause_3's
      OWN TEXT directs an enacting Coordinator to make. P-1 is the item
      DEC-20260906-6a620e called "the one the campaign can arrange cheapest", and it
      MUST be arranged BEFORE the enacting producer runs or the asymmetry it exists
      to create is lost.
    ranking_statement_required_by_the_unlimited_ecc_budget: >-
      GOAL-SSI-001 is an ECC goal - SSI is in the declared ECC area set at
      orchestration/research-priority.yaml line 47, READ THERE AND NEVER INFERRED
      FROM AN IDENTIFIER PREFIX - so its campaign budget is unlimited under CLAUDE.md
      rule 11. UNLIMITED REMOVES THE BATCH CEILING, NOT THE DUTY TO RANK. This batch
      is ranked first because the goal head names exactly one next research action
      and names this batch's three items as its gate; because its objects are all
      committed and immutable, so the round is cheap and fully re-checkable; and
      because every alternative use of a round - CF-7's remainder, CF-8, CF-12(a) -
      depends on what an ENACTED amendment says the reconciliation is FOR, and
      nothing is enacted. Re-checkable with `python3 tools/ecc_priority.py --classify
      GOAL-SSI-001`, which this authoring task holds no shell to run and therefore
      records with its source rather than as a tool output.

  # =====================================================================
  the_three_preconditions_this_batch_produces:
    P-1:
      what_the_goal_head_requires: >-
        A COMMITTED COORDINATOR RULING ON RT-4's LICENSING QUESTION, DRAFTED AND
        COMMITTED BEFORE THE ENACTING BATCH'S PRODUCER RUNS, so that the producer can
        ATTACK the ruling rather than supply its material.
      assigned_to: TASK-20260906-6afb30
      artifact: coordination/goals/GOAL-SSI-001/batches/BATCH-1fa3fb/tasks/TASK-20260906-6afb30/rt4_licensing_ruling.yaml
      what_rt_4_is_exactly: >-
        RT-4, at BATCH-79a0cb/reviews/TASK-20260905-6d5c9c/red_team_report.yaml
        findings id RT-4, target `proposed_replacement.clause_4.replacement_text_in_full`
        key `licensing`, severity low - "The licensing summary that would become
        contract text drops both provisos the analysis attaches, and incorporates
        them only by pointer into a batch task directory." The redraft CARRIED the
        two provisos into clause_4's own text as ORDERED (change 3, source RT-4 /
        DEC-20260905-3b8e94 next_actions[0](A)) and added
        `licensing_provisos_are_operative` and a demoted `fuller_statement` pointer.
        DEC-20260906-f709b2 records that this CARRYING IS NOT A SETTLEMENT - "the
        redraft carried the two provisos into clause_4's text as ORDERED but did not
        and could not SETTLE" the enacting decision's question about that clause.
      the_question_the_ruling_must_settle_stated_narrowly: >-
        WHETHER A LICENSING STATEMENT WHOSE OPERATIVE CONDITIONS ARE CARRIED IN THE
        CLAUSE'S OWN TEXT, WITH A RESIDUAL POINTER TO A FULLER DISCUSSION IN A BATCH
        TASK DIRECTORY, IS ACCEPTABLE AS CONTRACT TEXT - that is, whether the
        redraft's repair DISCHARGES RT-4, or whether RT-4 requires more (for example
        that no pointer into a coordination directory survive in contract text at
        all, or that the fuller analysis be relocated or carried by a companion
        record). THAT IS RT-4's LICENSING QUESTION AND IT IS THE WHOLE OF WHAT THE
        RULING SETTLES.
      what_the_ruling_may_not_reach: >-
        AF-4's INTERVAL RULING and F-J2-1's NAMING of clause_4's licence and its
        foreclosure among the effects enacted are items (iv) and (v) of the SIX the
        ENACTING decision must settle in its own text, and this ruling settles
        NEITHER; it may cite them as material and must state that it does not settle
        them. It may not rule on how an ENACTED clause_4 foreclosure interacts with
        the standing citation prohibition - DEC-20260906-f709b2 citation_boundary
        adds exactly that as a thing that would SUPPORT A LIFT, and this batch lifts
        nothing. It may not approve or enact anything, may not settle CF-10's
        placement or its `travels with` authority limb, may not settle F-2, F-3 or
        CF-22, and may not settle RT-6, RT-9(a) or RT-12.
      when_p_1_is_satisfied_and_not_before: >-
        WHEN THE CLOSING DECISION OF THIS BATCH, DEC-20260906-2e712f, ADOPTS THE
        RULING BY NAME AND RESTATES ITS OPERATIVE TEXT, AND THAT DECISION IS
        COMMITTED AND PUSHED WITH AN OPEN PR AGAINST main. A ruling that exists only
        as a coordination artifact is a draft; a ruling that exists only in a local
        commit is unpublished. IF THE REVIEW FINDS THE RULING OVER-REACHES, the
        closing decision records it as NOT ADOPTED, P-1 as NOT SATISFIED, and the
        enacting batch is not opened. That contingency is real and is written down
        before the round rather than after it.
    P-2:
      what_the_goal_head_requires: >-
        A COMMITTED READING OF
        coordination/goals/GOAL-SSI-001/batches/BATCH-2e6130/tasks/TASK-20260809-ef3e58/protocol_amendment.yaml
        recording (a) that `amendment.corrected_model.log2_law`,
        `.endpoint_behavior` and `.crossover` exist, (b) that record's own `status`
        and `in_force` fields, and (c) whether the law it states satisfies clause_2's
        three invariants.
      assigned_to: TASK-20260906-6c5e0a
      artifact: coordination/goals/GOAL-SSI-001/batches/BATCH-1fa3fb/tasks/TASK-20260906-6c5e0a/incorporated_law_reading.yaml
      why_it_matters: >-
        AF-3. After enactment, clause_2 makes that record THE CONTRACT'S ONLY
        STATEMENT OF ITS GOVERNING CHARGING LAW, by a TRANSITIVE POINTER into a
        coordination batch directory that NO ROUND OF THIS CHAIN HAS BEEN SCOPED TO
        OPEN, now four rounds running. It is the only load-bearing external
        reference in the whole amendment.
      clause_2s_three_invariants_quoted_verbatim_from_the_redraft: >-
        From `proposed_replacement.clause_2.replacement_text_in_full`, key
        `invariants_that_any_incorporated_law_must_satisfy` - (1) "Control C3 of this
        contract: T(w) non-increasing in w for every (p, overhead) scenario, and T(w)
        = T_full for w >= M." (2) "Control C4 of this contract: T(M) = T_full
        exactly, before the declared overhead multiplier." (3) "The crossover closed
        form used to report metrics[5] must be the crossover OF THAT SAME LAW, i.e.
        it must solve log2 T(w*) + overhead_bits = log2 T_DG under it."
      the_reserved_item_this_task_must_not_settle: >-
        RT-6 CONCERNS INVARIANT (2) DIRECTLY - it is that C4 is restated there with
        the added qualifier "before the declared overhead multiplier", which is not
        in C4's own text, inside an amendment that lists C4 as untouched. RT-6 IS
        RESERVED TO THE ENACTING DECISION. The task reports whether the incorporated
        record's stated endpoint behaviour matches the invariant AS THE INVARIANT IS
        WRITTEN, and it may NOT rule on whether the qualifier belongs there.
      its_own_leak_surface_is_real: see the_p2_secondary_leak_surface below.
    P-3:
      what_the_goal_head_requires: >-
        A COMMITTED CONFIRMATION OF THE LOCATOR
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md:234-238 AGAINST THE FILE, as
        clause_3's own text directs an enacting Coordinator to do before enactment.
      assigned_to: TASK-20260906-decbd5
      artifact: coordination/goals/GOAL-SSI-001/batches/BATCH-1fa3fb/tasks/TASK-20260906-decbd5/locator_confirmation.yaml
      what_clause_3_actually_says_quoted: >-
        From `proposed_replacement.clause_3.replacement_text_in_full`, key
        `what_the_five_pairs_are` - "PROVENANCE OF THAT CHARACTERIZATION, STATED
        EXACTLY: it is recorded by DEC-20260904-4c81b6 next_actions[0] limb (ii), and
        that decision's next_actions[1] records the source location as
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md:234-238. THE DRAFTING TASK DID
        NOT OPEN THAT FILE - it is outside its read scope - so the locator is cited
        to the decision that records it and not to a reading. ... AN ENACTING
        COORDINATOR SHOULD CONFIRM THE LOCATOR AGAINST THE FILE BEFORE ENACTMENT."
      rt_9_a_stays_reserved: >-
        WHETHER THE PRECONDITION SHOULD ALSO EXTEND TO THE CHARACTERIZATION IS RT-9(a)
        AND STAYS RESERVED. Confirming the locator does not settle it, and no artifact
        of this batch may be cited as having settled it or as having made it moot.
        The P-3 card records ONE incidental observation bearing on it (shape predicate
        S6) under an explicit, mandatory scope sentence forbidding exactly that
        inference.
      the_hazard: see the_p3_anti_leak_design below. IT IS THE MOST IMPORTANT BLOCK IN THIS FILE.

  # =====================================================================
  p4_through_p8_are_not_this_batchs_to_satisfy:
    ruling: >-
      P-4, P-5, P-6, P-7 and P-8 of DEC-20260906-f709b2 NA-1 ARE PROPERTIES OF THE
      ENACTING BATCH ITSELF - what its control plane must name, that its enactment
      is independently reviewed, that it states a position on the companion record,
      that it binds the ENACTED artifact by sha256 and re-runs the committed
      structural diff against it, and that its identifiers are checked and its queue
      rendered with its prior recorded before its producer runs. NONE OF THEM CAN BE
      SATISFIED BY A BATCH THAT IS NOT THE ENACTING BATCH, and this batch does not
      attempt any of them.
    the_six_items_are_deliberately_not_restated_here: >-
      DEC-20260906-f709b2 findings_by_what_they_change_about_enactability
      .must_be_resolved_in_the_enacting_decision is their authoritative text and the
      goal head carries them too. RESTATING THEM IN THIS FILE WOULD INVITE A READER
      TO TREAT THIS CONTROL PLANE AS DISCHARGING P-4, WHICH IT DOES NOT AND MAY NOT.
      They are named by number only - AF-1, AF-2, AF-3, AF-4, F-J2-1 and RT-4's
      licensing question - and P-1 settles the LAST of those six AND ONLY THAT ONE.
    what_this_batch_does_hand_forward: >-
      Three committed objects and nothing else. It hands forward NO ruling on AF-1,
      AF-2, AF-3 or AF-4, NO naming of clause_4's licence and foreclosure among the
      effects enacted, and NO position on whether the companion record's existence
      gates enactment.

  # =====================================================================
  p1_placement_ruling:
    the_question_i_had_to_decide: >-
      WHETHER P-1's RULING IS PRODUCED BY A DEDICATED COORDINATOR TASK IN THIS BATCH
      OR AUTHORED INSIDE THE LEDGER ARCHIVE, AND WHETHER IT GETS ITS OWN INDEPENDENT
      REVIEW. Both are recorded either way, per the dispatching session's own
      instruction, because a decision taken silently cannot be attacked.
    what_i_decided_on_production: >-
      A DEDICATED COORDINATOR TASK, TASK-20260906-6afb30, WRITING A STANDALONE
      RULING ARTIFACT AT A STABLE PATH. Three reasons. (1) A ruling composed inside
      an archive task that is already composing a round, checkpointing a goal and
      writing a receipt is a paragraph, not an object; P-1's whole value is that the
      enacting producer has an OBJECT to attack. (2) A ruling authored by the ledger
      archive would be read by NOBODY before it was committed, which is the exact
      defect DEC-20260906-6a620e recorded about enacting decisions composed in the
      task that first reads the material. (3) A dedicated task has its own card, its
      own budget, its own completion gate and its own runtime receipt, so its
      launching-prompt disclosure and its inference provenance are recorded per
      CF-15 rather than folded into an archive's.
    what_i_decided_on_review_and_this_is_the_harder_half: >-
      IT IS REVIEWED HERE, BUT ON SCOPE AND ANCHORING ONLY, AND EXPRESSLY NOT ON ITS
      MERITS. The reviewer owns J1 (does it settle RT-4's licensing question AND ONLY
      THAT) and J2 (is every operative proposition anchored in committed bytes at a
      named key path, and does the ruling state what would have changed it). THE
      REVIEWER IS FORBIDDEN TO ATTACK WHETHER THE RULING IS RIGHT.
    why_that_split_and_not_a_full_review: >-
      BECAUSE THE ATTACK ON THE MERITS IS THE THING P-1 EXISTS TO BUY FOR SOMEBODY
      ELSE. DEC-20260906-f709b2 P-1 says the ruling must be committed before the
      enacting batch's producer runs "so that the producer can ATTACK the ruling
      rather than supply its material". A full merits review here would spend that
      attack in advance, in the same session and the same model family as the author,
      with blindness lifted - buying correlated agreement and handing the enacting
      producer an object that has already absorbed the cheapest objections, so that
      its "nothing found" would carry LESS information, not more. THE ASYMMETRY IS
      DELIBERATE AND IT IS THE POINT.
    what_that_leaves_unchecked_stated_plainly_and_not_argued_away: >-
      NOBODY IN THIS BATCH CHECKS WHETHER THE RULING IS CORRECT. That is a real
      cost, it is accepted knowingly, and a successor must not read the reviewer's
      J1 and J2 verdicts as any kind of endorsement of the ruling's substance. What
      IS checked here is CONTAINMENT - that the ruling settles one question and not
      six - because a ruling that over-reaches would corrupt the checkable set the
      enacting batch is supposed to open against, and that IS this batch's business.
    the_entailed_control_on_the_ruling_itself: >-
      A RULING THAT CANNOT NAME WHAT WOULD HAVE CHANGED IT IS A RESTATEMENT WEARING A
      RULING'S HEADER. The card requires the ruling to record the positions available,
      which committed bytes decide between them, and AT LEAST ONE COMMITTED ARTIFACT
      THAT, HAD IT READ DIFFERENTLY, WOULD HAVE FORCED THE OTHER POSITION. If it
      cannot name one, that is a BREAK, reported as one, and P-1 is not satisfied.

  # =====================================================================
  p2_and_p3_are_two_tasks_and_here_is_why:
    the_decision: >-
      TWO TASKS, NOT ONE, AND THE REASON IS CONTAINMENT RATHER THAN TIDINESS.
    the_reason_that_actually_decided_it: >-
      P-2 HAS ITS OWN LEAK SURFACE AND IT IS NOT THE ONE ANYBODY EXPECTS. Clause_2's
      THIRD invariant is about a CROSSOVER - "the crossover closed form used to
      report metrics[5] must be the crossover OF THAT SAME LAW" - and the record P-2
      opens may state crossover material of its own. So the split cannot be justified
      as "P-3 has a leak profile and P-2 does not"; both do. What the split BUYS is
      that the agent which reads the governed anchor block NEVER opens the charging-law
      record, and the agent which reasons about the charging law and its crossover
      invariant NEVER opens the anchor block. NEITHER AGENT'S ARTIFACT CAN CARRY THE
      OTHER'S GOVERNED CONTENT, BECAUSE NEITHER AGENT CAN READ IT. That is a
      structural property of the read scopes, not a promise about behaviour.
    the_secondary_reasons: >-
      Failure isolation - the highest-hazard task runs FIRST, so a leak stop costs
      the least. Different read scopes - P-3 touches inputs/ and P-2 does not, and
      inputs/ is read-only absolutely. And two narrow cards each carrying one
      concrete anti-leak rule beat one card carrying a diluted rule for both.
    the_cost_of_splitting_stated_plainly: >-
      TWO AGENTS RATHER THAN ONE, TWO RECEIPTS, TWO LEAK SCANS AND ONE MORE JOINT
      FOR THE REVIEWER TO CARRY. And the coupling this batch could not avoid - ONE
      snapshot archive owns all three producers, so a STOP on any producer means the
      archive cannot complete against its declared expected path set and NONE of the
      three packages is archived by this batch. That coupling is why the ordering
      below is what it is, and it is recorded rather than discovered.

  # =====================================================================
  the_p3_anti_leak_design:
    the_hazard_stated_exactly: >-
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md LINES 234-238 ARE A PER-FIELD-SIZE
      TABLE, AND ONE OF ITS ROWS IS KEYED TO THE FIELD SIZE THIS CAMPAIGN CALLS
      P=512 AND CARRIES AN OPERATIONS COUNT AND A MEMORY BOUND. The standing citation
      prohibition governs the `P=512` crossover value and its `w=2^80` sign, and its
      predicate extension governs reconciliation rows; the block's 512 row is the
      ANCHOR from which this campaign's governed crossover at that field size is
      derived, and the anchor disagreement at that field size is the very thing the
      prohibition exists about. THE CONSERVATIVE AND BINDING RULE OF THIS BATCH IS
      THEREFORE THAT THE NUMERIC CONTENT OF LINES 234-238 IS TREATED AS GOVERNED.
    how_this_hazard_was_established_and_by_whom: >-
      REPORTED TO THIS AUTHORING TASK BY THE DISPATCHING SESSION, WHICH OPENED THE
      LINES ITSELF AND CONFIRMED THE FILE EXISTS AND IS READABLE. THIS AUTHORING TASK
      DID NOT OPEN LINES 234-238 AND DELIBERATELY DID NOT, on the ground that the
      confirmation is P-3's to make and that every additional reader of a governed row
      is an additional leak surface for no gain. That is an ATTRIBUTED report, not
      this task's own measurement, and it is recorded as such. It is used here only
      to establish the SHAPE of the hazard, which is not a governed value.
    the_discriminating_sentence_that_must_appear_on_the_p3_card_verbatim: >-
      CONFIRMING THAT THE LOCATOR RESOLVES, THAT THE BLOCK HAS THE DECLARED SHAPE,
      AND THAT IT IS WHERE clause_3 SAYS IT IS, IS NOT THE SAME AS CITING WHAT IT
      SAYS AT 512. The first is a fact about a POINTER. The second is the governed
      CONTENT. P-3 buys the first and is absolutely forbidden the second.
    permitted_output_1_resolution: >-
      RECORD THAT THE LOCATOR RESOLVES, AND HOW. That the file exists at
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md; its total line count; that lines
      234 through 238 exist and are non-empty; and the byte length of the five-line
      block. A line count and a byte length are facts about a file and are not values
      of the table.
    permitted_output_2_shape_as_booleans_and_counts_only:
      rule: >-
        A CLOSED, PRE-DECLARED PREDICATE LIST, EACH ANSWERED TRUE, FALSE OR A COUNT,
        WITH NO QUOTATION OF ANY LINE THAT CONTAINS A DIGIT. The list may not be
        extended by the task; a predicate the task wants and does not have is
        reported as WANTED AND NOT ANSWERED.
      S1: The block is a contiguous run of exactly five lines. TRUE or FALSE.
      S2: >-
        The block presents as a TABULAR per-field-size listing - rows keyed by a
        field-size parameter - rather than as running prose. TRUE or FALSE.
      S3: The number of rows in the block that carry a field-size key. A COUNT.
      S4: >-
        A row keyed to the field size this campaign's committed records call P=512 is
        PRESENT in the block. TRUE or FALSE - A PRESENCE BOOLEAN, NEVER THE ROW'S
        CONTENTS.
      S5: The number of value columns per row. A COUNT.
      S6: >-
        The block states, IN WORDS, that its figures are lower bounds or come from an
        underestimation. TRUE or FALSE. A quotation is permitted here ONLY if the
        quoted span contains NO DIGIT AT ALL; if any candidate span contains a digit,
        the answer is the boolean alone with no quotation.
      S7: >-
        This block is the location a reader of clause_3's `what_the_five_pairs_are`
        would reach for the five (time, memory) pairs C1 anchors on. TRUE or FALSE.
      S6_scope_sentence_which_is_mandatory_and_verbatim: >-
        This records that the block does or does not contain a lower-bound
        characterization. IT DOES NOT RULE THAT CONFIRMING THE CHARACTERIZATION IS,
        OR IS NOT, PART OF clause_3's ENACTMENT PRECONDITION. That is RT-9(a), it is
        RESERVED TO THE ENACTING DECISION, and no successor may cite this observation
        as discharging any extension of the precondition or as making the reserved
        question moot.
    permitted_output_3_binding_by_digest: >-
      A sha256 OVER THE EXACT FIVE-LINE BLOCK, AND A sha256 OVER THE WHOLE FILE, each
      recorded with the exact command that produced it and with the fact that the
      command EMITS ONLY THE DIGEST. A DIGEST BINDS THE BLOCK WITHOUT CARRYING IT,
      and it lets any successor - including the enacting decision - re-confirm that
      the block it reads is the block this task confirmed, without either of them
      restating a value. If no shell is available, the digest is recorded as
      OUTSTANDING with that reason and NEVER reconstructed, estimated or guessed.
    forbidden_absolutely: >-
      TRANSCRIBING, PARAPHRASING, ROUNDING, ORDERING, BUCKETING, RANGING, COMPARING,
      UNIT-CONVERTING OR PARTIALLY QUOTING ANY NUMERIC CONTENT OF LINES 234-238, IN
      ANY ARTIFACT, IN ANY RETURN MESSAGE, AND IN ANY COMMIT MESSAGE. No operations
      count, no memory bound, no exponent, no ratio and no relation between two of
      them. No statement of which row is largest or smallest, or of how two rows
      compare. No digit that appears in the block, other than the line numbers
      234-238 themselves and the counts S3 and S5 explicitly require. Naming the
      field size 512 is permitted ONLY as the locator label already published in
      committed records, and NEVER on a line, in a sentence, or in a table cell
      adjacent to anything read out of the block.
    the_command_shape_that_keeps_the_block_out_of_the_transcript: >-
      WHERE A SHELL IS HELD, A DIGEST OR A COUNT IS OBTAINED BY A COMMAND THAT PRINTS
      ONLY THE DIGEST OR THE COUNT, NEVER BY PRINTING THE BLOCK AND THEN HASHING WHAT
      WAS PRINTED. Pipe directly into the hash; emit booleans and counts from a
      predicate script; never `sed -n '234,238p'` to standard output as a step of its
      own. THE AGENT WILL STILL READ THE BLOCK - it must, to answer S2 through S7 -
      and reading is permitted. What is forbidden is putting the content anywhere it
      persists or anywhere a later agent will read it.
    the_negative_control_that_makes_no_leak_a_CHECKED_RESULT_RATHER_THAN_AN_ASSERTION: >-
      THE TASK RUNS A DIGIT SCAN OVER ITS OWN THREE ARTIFACTS AND FILES
      leak_scan_report.yaml, classifying EVERY digit run it finds as exactly one of -
      a line number, an identifier, a date, a version, a count that S3 or S5 requires,
      or a digest fragment. A DIGIT RUN IT CANNOT CLASSIFY INTO THAT CLOSED LIST IS A
      STOP: the task halts, reports it, writes nothing further, and returns the object
      to the Coordinator. AND THE SCAN ITSELF IS CONTROLLED - it must be exercised on a
      synthetic string written OUTSIDE the repository, `SYNTHETIC-LEAK-PROBE
      1234.5678`, which has no relation to any campaign quantity, AND IT MUST FIRE ON
      IT. A leak scan that never fires on anything is not a scan, and its silence over
      the real artifacts would carry no information.
    why_this_is_stronger_than_the_previous_four_rounds_handling: >-
      THE PREVIOUS FOUR ROUNDS AVOIDED THIS LEAK PARTLY BY NOT LOOKING AT ALL, on
      scope grounds that were defensible each time and that a fifth repetition would
      have made a habit. This design looks, and replaces "we did not go near it" with
      three checkable things - a resolution fact, a closed predicate list, and a
      digest - plus a scan that can fail and a control that proves the scan can fire.
      IT IS WEAKER THAN NOT LOOKING IN EXACTLY ONE RESPECT AND THAT IS STATED HERE -
      an agent will hold the governed row in its context, and no tool can check what an
      agent saw. What is checkable is what it WROTE, and that is what the scan checks.

  # =====================================================================
  the_p2_secondary_leak_surface:
    what_it_is: >-
      CLAUSE_2's THIRD INVARIANT IS ABOUT A CROSSOVER, and the record P-2 opens -
      BATCH-2e6130/tasks/TASK-20260809-ef3e58/protocol_amendment.yaml - states a
      corrected model with an `amendment.corrected_model.crossover` key. If that key
      carries a numeric table or a per-field-size value, reading it puts governed or
      governed-adjacent material in front of the P-2 agent.
    the_rule: >-
      THE THREE INVARIANTS ARE ANSWERED AS QUESTIONS ABOUT WHAT THE RECORD STATES,
      IN FORM, AND NEVER BY EVALUATING ANYTHING. Invariant (1) is answered from the
      FORM of `log2_law` and `endpoint_behavior` - does the record state monotonicity
      in w, and does it state the w >= M endpoint, and in what words. Invariant (2)
      is answered from the record's stated endpoint behaviour against the invariant AS
      WRITTEN, with RT-6 expressly not settled. Invariant (3) is answered as an
      IDENTITY-OF-FORM question - does the record's `crossover` state a closed form
      DERIVED FROM the `log2_law` the same record states, i.e. one that solves
      log2 T(w*) + overhead_bits = log2 T_DG under THAT law. NO FIELD SIZE IS
      SUBSTITUTED, NO NUMBER IS EVALUATED, NO SIGN IS COMPUTED AND NO MARGIN IS
      STATED. WHERE AN ANSWER WOULD REQUIRE A GOVERNED SIGN OR A GOVERNED VALUE, THE
      CORRECT OUTPUT IS THE STATEMENT THAT IT WOULD, NEVER THE VALUE - RT-2's
      antecedent `A > 0` IS the governed sign.
    if_the_record_carries_a_numeric_table: >-
      THE TASK RECORDS ONLY THAT IT DOES, AND ITS SHAPE - rows, columns, whether a
      row keyed to P=512 is present - BY EXACTLY THE SAME PREDICATE-AND-COUNT RULE
      P-3 uses, AND TRANSCRIBES NO ENTRY. The two tasks are given the same anti-leak
      discipline precisely so that neither has to invent one.
    the_same_negative_control_applies: >-
      P-2 FILES ITS OWN leak_scan_report.yaml under the same closed classification
      list and the same synthetic positive control, and an unclassifiable digit run is
      the same STOP.

