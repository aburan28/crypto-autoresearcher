  # =====================================================================
  archive_topology:
    shape: >-
      SIX TASKS, THREE PRODUCERS, TWO ARCHIVE BLOCKS, AND THE FULL DISPATCHER-ENFORCED
      REVIEW CHAIN. TASK-20260906-decbd5 (P-3, executor, `review_required: TRUE`),
      TASK-20260906-6c5e0a (P-2, executor, `review_required: TRUE`) and
      TASK-20260906-6afb30 (P-1, coordinator authoring task, `review_required: TRUE`)
      -> TASK-20260906-94009d (SNAPSHOT ARCHIVE, coordinator, `kind: snapshot`,
      `binding_mode: commit`, owning all three producers, RUNS ALONE) ->
      TASK-20260906-28e6de (validator, independent session, depending on all three
      producers AND on the snapshot) -> TASK-20260906-f62e26 (LEDGER ARCHIVE,
      coordinator, `kind: ledger`, `binding_mode: commit`, owning the review, RUNS
      ALONE).
    why_all_three_producers_carry_review_required_true: >-
      TRUE OF THE FLAG AND TRUE OF THE WORLD. Each package is reviewed by
      TASK-20260906-28e6de at joints it owns, each is snapshot-committed before that
      review is dispatched, and the whole chain is enforced by
      `tools/research_dispatch.py` `_validate_review_chains`. A WRONG CONFIRMATION IS
      WORSE THAN NO CONFIRMATION, because the enacting batch would then open against a
      FALSE checkable set - which is the one failure mode a precondition set exists to
      prevent - so none of the three may be unreviewed.
    why_a_coordinator_task_is_a_producer_here: >-
      BECAUSE ONLY THE COORDINATOR MAY RULE. P-1's object is a Coordinator ruling and
      no other role may author one. TASK-20260906-6afb30 is a coordinator AUTHORING
      task, not an archive: it carries no `archive` block, writes no ledger record,
      commits nothing, and its ruling becomes official only when the closing decision
      adopts it. `validate_archive_shape` forbids `review_required` on ARCHIVE tasks
      only, and this task is not one.
    the_producer_order_is_a_design_choice_and_here_is_the_reason: >-
      PRIORITIES ARE 100 FOR P-3, 95 FOR P-2, 90 FOR P-1, AND `max_concurrent` IS 1,
      SO THE HIGHEST-HAZARD TASK RUNS FIRST. One snapshot archive owns all three
      producers, so a STOP on any one of them means the archive cannot complete against
      its declared nine-path expected set and NONE of the three packages is archived by
      this batch. Given that coupling, the cheapest place to discover a stop is BEFORE
      anything else is spent, and the likeliest stop by far is a leak-scan STOP in P-3.
      THAT IS THE REASON, AND ITS COST IS NAMED: if P-3 stops, P-1 and P-2 do not run
      at all, so the batch buys nothing. The alternative ordering would have bought two
      of three - but they would be UNARCHIVED and therefore not durable, which is worth
      less than it sounds.
    what_happens_if_one_producer_stops: >-
      THE BATCH RETURNS TO THE COORDINATOR AND THE ARCHIVE IS NOT FORCED. Completed
      packages are NOT archived by this batch, are NOT durable, and MUST NOT be
      described as satisfying their precondition. The Coordinator may open a successor
      batch with a narrowed queue and fresh identifiers. NO ARCHIVE IS EVER COMPLETED
      AGAINST A PARTIAL SET, and no path_sha256 map is ever trimmed to make one fit.
    binding_mode_reasoning: >-
      `commit` FOR BOTH, DELIBERATELY, AND NOT INFERRED FROM A FAILED SCOPE CHECK.
      Every path in each archive's expected set is uncommitted when that archive runs -
      the snapshot's nine are the three producers' eight artifacts plus its own
      receipt, and the ledger's eight are its own five plus the reviewer's three - so
      ONE exact changed-path commit CAN express custody of the whole set, which is the
      stronger binding. `content_first` exists for source packages committed before
      their archive task ran, which is not this batch's situation for either archive.
    expected_path_set_snapshot_archive:
      task: TASK-20260906-94009d
