      bounded by the fact that this batch changes no status.
    a_confirmation_that_confirms_is_a_full_result_and_so_is_one_that_does_not: >-
      RECORDED IN THE CONTROL PLANE, BEFORE THE ROUND, SO NEITHER CAN BE READ AS RELIEF
      AFTERWARDS. TWO SYMMETRIC FAILURE MODES ARE NAMED. (1) MANUFACTURED CONFIRMATION:
      a task that reports "confirmed" because confirming is what it was asked to do.
      That is what the entailed-control objects exist to detect. (2) A MANUFACTURED
      PROBLEM: a task that invents a defect in a committed record so its round looks
      productive, which would corrupt the precondition set in the more damaging
      direction. IF A KEY PATH IS ABSENT, IF AN INVARIANT IS NOT SATISFIED, OR IF THE
      LOCATOR DOES NOT RESOLVE, THAT IS A COMPLETE AND VALUABLE RESULT and this batch
      contracts in advance to record it as one - it would be the single most
      enactment-relevant thing this round could return, and it would mean the enacting
      batch must not open on the current precondition text.

