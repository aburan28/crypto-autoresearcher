      MY DISCHARGE READS RT-4's SCOPE OFF ITS SUGGESTED REPAIR RATHER THAN OFF
      ITS FINDING SENTENCE, AND A CRITIC IS ENTITLED TO SAY THAT IS BACKWARDS. A
      finding's scope is what it FINDS; the smaller repair is a suggestion the
      finder was not obliged to get right, and red teams routinely name the
      cheapest repair rather than the sufficient one. RT-4's finding sentence has
      two clauses joined by "and" - it "drops both provisos ... AND incorporates
      them only by pointer into a batch task directory" - and it closes by
      calling this "the identical structural weakness the draft itself flags for
      clause_2's incorporation by reference, unflagged here". READ THAT WAY, RT-4
      STATES A STRUCTURAL OBJECTION TO POINTER-BORNE CONTRACT CONTENT WHICH
      SURVIVES MOVING THE PROVISOS, and POSITION 2 follows. My answer is that the
      pronoun "them" in the second clause refers to the provisos, so the second
      clause is parasitic on the first and empties when the first is repaired -
      but that is a reading of a pronoun, and a reader who takes the structural
      sentence as the finding's centre of gravity will not be moved by it. IF
      THIS ATTACK LANDS, MY RULING IS WRONG AND POSITION 2 IS RIGHT. I could not
      dissolve it and I am not pretending to have.
    W_2: >-
      THE REDRAFT'S OWN constraint_compliance.constraint_iii LISTS THE ANALYSIS
      FILE AS A DISCHARGE LOCATION, AND I DISTINGUISHED IT ON A LINE I DREW
      MYSELF. I say `constraint_compliance` describes how the DRAFTING satisfied
