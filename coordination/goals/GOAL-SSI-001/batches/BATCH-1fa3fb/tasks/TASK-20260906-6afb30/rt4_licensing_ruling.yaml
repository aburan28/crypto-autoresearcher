      contract text, so the analysis being a discharge location says nothing
      about where the licence's conditions live. That distinction is sound as
      far as I can see, but the record does not draw it in terms, and an
      adversary can reply that a record which says its constraint is discharged
      partly AT a coordination file has admitted the file is load-bearing.
    W_3: >-
      AF-4 RECORDS THAT THE ONLY PLACE PER-FIELD REACHABILITY STATUSES ARE
      RECORDED IS THE POINTED-TO ANALYSIS, and its own narrowing note says a
      report CAN cite those statuses and satisfy the licence proviso. An
      adversary will say: the pointer is load-bearing in practice, because
      without it nothing exists to put "in the same breath". My answer is that
      this is a fact about where DATA satisfying the licence's predicate happens
      to be recorded, not about where the licence's CONDITIONS are stated, and
      that whether statuses recorded in a coordination analysis discharge
      clause_4's raw-output requirement is EXACTLY AF-4's interval question,
