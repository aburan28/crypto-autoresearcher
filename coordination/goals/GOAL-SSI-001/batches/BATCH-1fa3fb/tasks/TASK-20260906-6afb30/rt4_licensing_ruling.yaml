schema: crypto.autoresearch.coordinator_ruling.v1
# P-1 - THE COORDINATOR RULING ON RT-4's LICENSING QUESTION, AND ON NOTHING ELSE.
#
# THIS IS A COORDINATION ARTIFACT AND NOT A LEDGER RECORD. It approves nothing,
# enacts nothing, moves no status and performs no version transition.
# EXP-WESOVOW-001 remains `approved` and UNAMENDED at version 1. The redraft at
# coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/protocol_amendment_redraft.yaml
# remains `status: draft`, `in_force: false`, `approved_by: null`.
#
# IT IS WRITTEN TO BE ATTACKED. Its merits are checked by NOBODY in BATCH-1fa3fb
# by deliberate design (batch.yaml p1_placement_ruling); the attack it exists to
# buy belongs to the enacting batch's producer. The weakest point of my own
# reasoning is stated in its own key, on purpose, and I have not hidden it.
ruling:
  id_note: >-
    THIS RULING BEARS NO LEDGER IDENTIFIER AND MINTS NONE. It is identified by
    its task and its path. If DEC-20260906-2e712f adopts it, that decision's
    identifier is the one that carries it.
  task_id: TASK-20260906-6afb30
  goal_id: GOAL-SSI-001
  batch_id: BATCH-1fa3fb
  precondition: P-1 of DEC-20260906-f709b2 NA-1
  authored_by: coordinator
  authored_at: '2026-09-06'
  artifact_path: coordination/goals/GOAL-SSI-001/batches/BATCH-1fa3fb/tasks/TASK-20260906-6afb30/rt4_licensing_ruling.yaml

  status_of_this_artifact: >-
    A COORDINATION ARTIFACT, NOT OFFICIAL, AND NOT A LEDGER RECORD. It becomes
    the campaign's ruling ONLY IF the closing decision DEC-20260906-2e712f
    ADOPTS IT BY NAME, restates its operative text, and is committed and pushed
    with an open PR against main. Until every one of those has happened this
    file is a draft position and nothing more, and no successor may cite it as
    settling anything. If the independent review at TASK-20260906-28e6de finds
    that it over-reaches on scope or is unanchored, the correct outcome recorded
    in advance is that it is NOT adopted and P-1 is NOT satisfied.

  # =====================================================================
  the_question_restated_narrowly_in_my_own_words: >-
    Clause_4 of the redraft would, on enactment, put into the frozen contract a
    statement of what an `off_curve` and a `reachable` anchor reachability
    status LICENSE and FORECLOSE. RT-4 attacked the SUPERSEDED draft's version
    of that statement for dropping the two provisos the BATCH-752ef2 licensing
    analysis attaches to the licence, and for leaving those provisos reachable
    only through a pointer into a coordination batch task directory. The
    redraft carried both provisos into clause_4's own text as ordered, added a
    key declaring them operative, and demoted the pointer to a
    `fuller_statement` that expressly carries no operative condition. THE
    QUESTION I SETTLE IS WHETHER THAT IS ENOUGH - whether the repair DISCHARGES
    RT-4, or whether RT-4 requires more, such as that no pointer into a
    coordination directory survive in contract text at all, or that the fuller
    analysis be relocated or carried by a companion record. THAT IS THE WHOLE
    OF WHAT I SETTLE.

  # =====================================================================
  # THE POSITION - ONE SENTENCE, BEFORE THE REASONS.
  the_position: >-
    THE REDRAFT'S REPAIR DISCHARGES RT-4: a licensing statement whose operative
    conditions are carried in clause_4's own text, leaving only a residual
    `fuller_statement` pointer that carries no operative condition, IS
    ACCEPTABLE AS CONTRACT TEXT, and RT-4 requires NOTHING FURTHER - it does not
    require that no pointer into a coordination directory survive in contract
    text, and it does not require the fuller analysis to be relocated or carried
    by a companion record.

  what_the_position_deliberately_does_not_say: >-
    STATED IMMEDIATELY AFTER THE POSITION SO NO EXCERPT CAN OVER-READ IT. It
    does not say the amendment should be enacted. It does not say clause_4 is
    correct, well drafted, or free of other defects - I record two residual
    observations below and leave both UN-PROMOTED. It does not say that the
    licence and the foreclosure clause_4 would create are named among the
    effects enacted; that is F-J2-1 and it is not mine. It does not say a
    pointer of this shape is acceptable ANYWHERE in the amendment - clause_2's
    `incorporated_by_reference` is an OPERATIVE incorporation, is a different
    structure, is the subject of AF-3, and is expressly untouched here. And it
    does not say anything about how an enacted clause_4 foreclosure interacts
    with the standing citation prohibition, which I decline below.

  # =====================================================================
  the_alternatives_i_did_not_take:
    preamble: >-
      THREE, EACH STATED SO A PARTY COULD ACT ON IT TOMORROW. An alternative
      nobody could act on is not an alternative and I have not padded the list
      with one.
    ALT_1:
      name: RT-4 NOT DISCHARGED - NO POINTER INTO A COORDINATION DIRECTORY SURVIVES IN CONTRACT TEXT.
      what_a_party_would_do: >-
        The enacting decision rules RT-4 undischarged; it directs, before any
        enactment, a NEW successor record (never an edit to the redraft, which
        is immutable and snapshot-bound) whose clause_4 text strikes the
        `fuller_statement` key entirely and either (a) carries the analysis's
        licensing discussion into the contract, or (b) points instead at a
        companion record created under experiments/EXP-WESOVOW-001/. The
        enacting batch's control plane names that successor record's path, and
        enactment waits on it.
      why_i_did_not_take_it: >-
        Because it is not a reading of RT-4; it is a new general drafting rule
        about where contract text may point, imposed under RT-4's number. RT-4's
        own words locate the grievance in the PROVISOS - "drops both provisos
        the analysis attaches, and incorporates THEM only by pointer into a
        batch task directory" - and its own named repair is two lines of
        carrying, not a relocation. A ruling that adopted ALT-1 would also
        reach clause_3's and clause_2's pointers into coordination directories,
        which are AF-3's and RT-9(a)'s territory and are reserved to the
        enacting decision, so I could not adopt it without settling something
        that is not mine.
    ALT_2:
      name: DISCHARGED CONDITIONALLY - ONLY IF THE POINTER IS MADE A COMPLETE, COMMIT-BOUND LOCATOR.
      what_a_party_would_do: >-
        The enacting decision rules RT-4 discharged subject to one condition:
        that a successor record replace `fuller_statement`'s descriptive
        reference with a full repository path plus the sha256 or the commit sha
        that binds the pointed-to file, the sha to be established by a session
        that holds a shell. Enactment then waits on that successor record.
      why_i_did_not_take_it: >-
        Because making it a CONDITION of the discharge would require more of
        clause_4 than RT-4 asked, and DEC-20260905-3b8e94's disposition of RT-4
        names two sufficient routes of which the redraft took one. Imposing a
        third would be over-reach in the opposite direction from ALT-1, and it
        would manufacture a new blocker in the round whose whole purpose is to
        produce a CHECKABLE precondition set rather than a longer one. I record
        the locator-completeness point instead as a RECOMMENDATION below,
        labelled as one, carrying no condition and blocking nothing.
    ALT_3:
      name: DECLINE TO SETTLE - RESERVE RT-4's LICENSING QUESTION TO A LATER ROUND.
      what_a_party_would_do: >-
        The closing decision DEC-20260906-2e712f records that no ruling was
        made, that P-1 is not satisfied, and that the enacting batch does not
        open on the current precondition text; the campaign either amends the
        precondition set by a committed decision or dispatches a further round
        to produce the ruling.
      why_i_did_not_take_it: >-
        Because the question is settleable on committed bytes without touching
        anything reserved, and I demonstrated that by settling it. DEC-20260906-f709b2
        NA-1 P-1 requires the ruling to exist BEFORE the enacting batch's
        producer runs precisely so the producer can attack it; declining would
        forfeit that asymmetry for no gain, and the card's own escape hatch is
        conditioned on the question being unsettleable without settling
        something reserved, which I do not find. I would have taken ALT_3 if I
        had found otherwise, and I say so here so the reviewer can check the
        condition rather than take my word for the conclusion.

  # =====================================================================
  the_reasons:
    preamble: >-
      SIX REASONS, EACH ANCHORED IN COMMITTED BYTES AT A NAMED KEY PATH WITH THE
      WORDS QUOTED. Every clause text below was confirmed BY ME AGAINST THE FILE
      ITSELF and not through any report; the anchoring ledger below states
      exactly what I confirmed and what I did not.
    R1:
      proposition: >-
        RT-4 NAMED ITS OWN SUFFICIENT REPAIR, AND THE REDRAFT PERFORMED EXACTLY
        THAT REPAIR. A red-team finding whose author writes down the repair that
        would answer it, and which then receives that repair, is discharged
        unless something else in the finding survives the repair.
      anchor_path: coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/reviews/TASK-20260905-6d5c9c/red_team_report.yaml
      anchor_key_path: r4.c.finding_RT_4
      quoted_words: >-
        "SMALLER REPAIR: carry the two provisos into clause_4's own text; it is
        about two lines."
      how_it_bears: >-
        The repair RT-4 names is a CARRYING and its stated size is two lines. It
        is not a relocation, not a companion record and not the removal of a
        pointer. The redraft carried the two provisos into clause_4's own text.
        On RT-4's own measure, that is the repair.
    R2:
      proposition: >-
        THE COMMITTED DECISION THAT ROUTED RT-4 STATED TWO SUFFICIENT
        DISPOSITIONS IN THE DISJUNCTIVE, AND THE REDRAFT PERFORMED THE FIRST OF
        THEM. This is the strongest anchor in the ruling because it is a
        Coordinator decision in the ledger and not a reviewer's suggestion.
      anchor_path: ledger/decisions/DEC-20260905-3b8e94.yaml
      anchor_key_path: coordinator_decision.findings_by_what_they_change_about_enactability.RT-4
      quoted_words: >-
        "RESOLVE-IN-ENACTING-DECISION. clause_4's licensing summary WOULD BECOME
        CONTRACT TEXT and drops both provisos the analysis attaches, leaving
        them in a coordination directory. Two lines of redraft, or an explicit
        ruling in the enacting decision that the provisos travel. It concerns
        the text the contract would carry, which is why it cannot simply be
        noted."
      how_it_bears: >-
        Three things follow from those words and I claim no more than these
        three. FIRST, the grievance is located precisely: the provisos are
        "left in a coordination directory". SECOND, TWO dispositions are named
        as alternatives - "Two lines of redraft, OR an explicit ruling in the
        enacting decision that the provisos travel" - so neither is uniquely
        required and the first is sufficient on the decision's own terms.
        THIRD, the reason RT-4 "cannot simply be noted" is that "It concerns
        the text the contract would carry"; once the provisos ARE the text the
        contract would carry, that reason is satisfied rather than evaded.
      what_it_does_not_establish: >-
        It does not establish that the redraft's carrying is a SETTLEMENT of
        this question - DEC-20260906-f709b2 says in terms that it is not, and I
        agree. The carrying is the material; the ruling is the act; this
        artifact is the act, subject to adoption.
    R3:
      proposition: >-
        BOTH PROVISOS ARE IN CLAUSE_4's OWN TEXT, AND THE CLAUSE DECLARES THEM
        CONDITIONS RATHER THAN COMMENTARY.
      anchor_path: coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/protocol_amendment_redraft.yaml
      anchor_key_path: >-
        amendment.proposed_replacement.clause_4.replacement_text_in_full - and,
        inside that block scalar's own YAML text, the keys
        anchor_reachability.licensing and
        anchor_reachability.licensing_provisos_are_operative. I name it this
        precisely because the clause keys are not key paths OF the redraft
        record; they are keys of the text the redraft proposes to splice.
      quoted_words_licensing: >-
        "An `off_curve` status LICENSES two things and no more. FIRST, reporting
        the anchor as the source's stated lower bound for that field size, CITED
        BY LOCATOR AND CARRYING ITS RELATION AND ITS UNIT - a bare number is not
        licensed. SECOND, comparing this model's attained value against it and
        reporting the signed difference, PROVIDED THE REACHABILITY STATUS IS
        REPORTED IN THE SAME BREATH AS THE DIFFERENCE - a signed difference
        emitted without its status is not licensed."
      quoted_words_provisos_are_operative: >-
        "The two conditions stated in capitals above - locator, relation and
        unit; and status in the same breath as the signed difference - are
        CONDITIONS ON THE LICENCE and not commentary. A report that omits either
        is outside the licence, exactly as if the status had not been recorded
        at all."
      how_it_bears: >-
        RT-4's two dropped provisos are the locator/relation/unit condition and
        the same-breath condition. Both are in the clause's own words, both are
        stated as restrictions on what is licensed rather than as advice, and a
        separate key states the consequence of omitting either. The defect RT-4
        described - the contract carrying "the unprovisoed sentence" - is not a
        description of this text.
    R4:
      proposition: >-
        I OPENED THE POINTED-TO FILE MYSELF AND LOOKED FOR A CONDITION THAT DID
        NOT TRAVEL, AND FOUND NONE. This is the check that makes the ruling
        something other than a restatement of clause_4's own self-description.
      anchor_path: coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/category_and_licensing_analysis.yaml
      anchor_key_path: analysis.licensing
      what_i_did: >-
        I read the whole `licensing` block and compared it item by item against
        clause_4's licensing text. The two items the analysis states as
        CONDITIONS on a licence are, in the analysis's own words, "cited by
        locator and carrying its relation and unit" and "PROVIDED the
        reachability status is reported in the same breath". Both are carried.
        NO OTHER ITEM IN THAT BLOCK IS A CONDITION ON A LICENCE.
      what_is_in_the_analysis_and_not_restated_in_clause_4_stated_honestly: >-
        Two kinds of item, and I name both because an adversary should not have
        to find them. (a) LICENCE ITEMS not restated - the analysis licenses
        recording the status itself as an observation about this cost model's
        grid, and at a `reachable` field size licenses reporting the signed
        difference as a comparison of two values of one function. Their absence
        NARROWS what clause_4 licenses; it cannot widen it. (b) FORECLOSURE
        ITEMS not restated - the analysis's off_curve block forecloses two
        further things and its reachable block forecloses three further things
        which clause_4 does not restate in those words. This is the direction
        that would matter, and the reason it does not defeat the ruling is
        clause_4's own closure operator, quoted at R3: "An `off_curve` status
        LICENSES two things and no more." A licence closed by its own text
        cannot be widened by a foreclosure that was not restated, because
        nothing outside the enumerated licences is licensed in the first place.
      how_it_bears: >-
        Clause_4 asserts, at `fuller_statement`, that "a reader who never opens
        the pointer is not missing a condition". I did not take that assertion
        on trust: I opened the pointer and checked it. The assertion holds on
        the analysis's `licensing` block as I read it. That is a checked result
        and not a self-certification, and the reviewer can re-run exactly the
        comparison I ran.
      the_limit_of_this_check_stated_plainly: >-
        It is a prose-to-prose comparison performed once, by one reader, in one
        session, over ONE named block of one file. I did not attempt to
        establish that no condition bearing on clause_4's licence exists
        anywhere else in that file, in any other BATCH-752ef2 artifact, or in
        any record either of them points to. No mechanical check was run,
        because I hold no shell.
    R5:
      proposition: >-
        THE STRUCTURE RT-4 OBJECTED TO IS OPERATIVE CONTENT BEHIND A POINTER,
        AND THAT IS A DIFFERENT STRUCTURE FROM A NON-OPERATIVE REFERENCE. The
        redraft keeps the two apart in its own text, and this campaign's record
        already treats them as different objects.
      anchor_path: coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/protocol_amendment_redraft.yaml
      anchor_key_path: >-
        amendment.proposed_replacement.clause_4.replacement_text_in_full, key
        anchor_reachability.fuller_statement; contrasted with
        amendment.proposed_replacement.clause_2.replacement_text_in_full, keys
        vow_charging_law.incorporated_by_reference and vow_charging_law.binding_effect
      quoted_words_fuller_statement: >-
        "A longer discussion of what each status licenses and forecloses, and of
        the explanations that do and do not follow from a status, is at
        category_and_licensing_analysis.yaml of the BATCH-752ef2 drafting task.
        THAT POINTER IS TO A FULLER DISCUSSION ONLY. Every operative condition
        of the licence is stated in this clause's own text above, and a reader
        who never opens the pointer is not missing a condition."
      how_it_bears: >-
        RT-4's own words draw the analogy that makes this decisive: the defect
        it names is "the identical structural weakness the draft itself flags
        for clause_2's incorporation by reference". Clause_2's structure is an
        INCORPORATION - it names a record, names three keys, and states a
        binding effect, so the contract's governing charging law is the pointed-to
        record's. Clause_4's `fuller_statement` names no key, incorporates
        nothing, and states no binding effect. The analogy RT-4 drew is what the
        redraft dissolved; a reference that carries no operative weight is not
        the weakness RT-4 identified by analogy to one that does.
      what_it_does_not_establish: >-
        NOTHING WHATEVER ABOUT CLAUSE_2. I use clause_2 here only as the
        contrasting STRUCTURE the red team itself invoked. Whether clause_2's
        incorporation is sound is AF-3 and is reserved; I do not reach it, and
        nothing in this ruling may be cited as bearing on it.
    R6:
      proposition: >-
        THE NARROW READING IS ALSO THE ONLY READING AVAILABLE TO ME. A ruling
        that no pointer into a coordination directory may survive in contract
        text would decide the same question for clause_2's incorporation and
        clause_3's provenance pointer, both of which are reserved.
      anchor_path: ledger/decisions/DEC-20260906-f709b2.yaml
      anchor_key_path: coordinator_decision.findings_by_what_they_change_about_enactability.must_be_resolved_in_the_enacting_decision
      quoted_words: >-
        "RT-4's LICENSING QUESTION, STANDING AND UNCHANGED. Carrying the two
        provisos into clause_4's own text is what the redraft was ORDERED to do
        and is NOT a settlement of the enacting decision's question about that
        clause. This round supplies material (AF-4, F-J2-1) and no ruling."
      how_it_bears: >-
        The same block reserves AF-3's transitive pointer and AF-4's interval
        ruling to the enacting decision. A general rule about pointers in
        contract text would settle AF-3 by implication. My card and the queue
        both forbid that, and the forbidding is not merely procedural - the
        general rule is a bigger question with different material, and deciding
        it inside a narrow licensing ruling is exactly how a checkable
        precondition set gets corrupted. So the narrow ruling is the one I am
        able to make, and I record that this constraint pushes in the same
        direction as R1, R2 and R5 rather than against them.

  # =====================================================================
  anchoring_ledger:
    what_i_confirmed_against_the_file_myself:
      - >-
        protocol_amendment_redraft.yaml `amendment.status`, `amendment.in_force`,
        `amendment.approved_by`, `amendment.approved_by_task` - read directly;
        they are `draft`, `false`, `null`, `null`.
      - >-
        protocol_amendment_redraft.yaml
        amendment.proposed_replacement.clause_4.replacement_text_in_full, in
        full, including the embedded keys anchor_reachability.requirement,
        .why_it_is_required, .licensing, .licensing_provisos_are_operative,
        .fuller_statement and .relation_to_the_standing_citation_prohibition.
        Every clause_4 sentence I quote is quoted from that read.
      - >-
        protocol_amendment_redraft.yaml
        amendment.proposed_replacement.clause_2.replacement_text_in_full, keys
        vow_charging_law.incorporated_by_reference,
        .invariants_that_any_incorporated_law_must_satisfy and .binding_effect -
        read directly, and used ONLY for the structural contrast at R5.
      - >-
        protocol_amendment_redraft.yaml amendment.changes_from_the_superseded_draft,
        item n 3, classification `ordered`, source "RT-4 / DEC-20260905-3b8e94
        next_actions[0](A)" - read directly.
      - >-
        protocol_amendment_redraft.yaml
        amendment.constraint_compliance.constraint_iii, both `answer` and
        `discharged_at` - read directly. This is the record's own internal
        disclosure of clause_4's licence and foreclosure, cited here as
        DEC-20260906-f709b2 permits and WITHOUT naming them among the effects
        enacted, which is F-J2-1's act and not mine.
      - >-
        protocol_amendment_redraft.yaml amendment.reserved_to_the_enacting_decision -
        read directly; it names RT-6, RT-9(a) and RT-12 and records that the
        redraft decided none of them.
      - >-
        red_team_report.yaml `findings`, the entry with id RT-4 (severity low,
        joint R4, target "protocol_amendment_draft.yaml
        proposed_replacement.clause_4.replacement_text_in_full, key licensing"),
        and its fuller statement at r4.c.finding_RT_4 - both read directly, in
        the finding's own words and not through any summary.
      - >-
        category_and_licensing_analysis.yaml analysis.licensing, in full,
        including its off_curve and reachable licence and foreclosure lists and
        `what_a_reader_may_and_may_not_cite_the_anchor_for_after_this_amendment`.
        Also analysis.limitations, read directly.
      - >-
        DEC-20260905-3b8e94 coordinator_decision.findings_by_what_they_change_about_enactability.RT-4
        and coordinator_decision.next_actions item [0](A) - read directly.
      - >-
        DEC-20260906-f709b2 coordinator_decision.findings_by_what_they_change_about_enactability.must_be_resolved_in_the_enacting_decision
        (the AF-4, F-J2-1 and RT-4 items) and coordinator_decision.next_actions
        NA-1's named precondition set P-1 through P-5, and NA-2 - read directly.
      - >-
        BATCH-314308 reviews/TASK-20260906-918585/validation_report.yaml,
        findings id F-J2-1, and tasks/TASK-20260906-dc4905/act_analysis_red_team_report.yaml,
        findings id AF-4 including its
        `i_narrowed_this_finding_after_checking_a_committed_artifact` key - read
        directly, and cited ONLY as material I decline to settle.
    what_i_did_not_confirm_and_am_not_presenting_as_confirmed:
      - >-
        I DID NOT VERIFY ANY SHA, DIGEST, COMMIT OR TREE STATE. I hold no shell.
        The redraft's `repo_head_commit_at_drafting` and its
        `supersedes.snapshot_commit` are quoted by nobody here as verified, and
        I did not check that the BATCH-752ef2 analysis file is bound by that or
        any other commit.
      - >-
        I DID NOT READ THE WHOLE OF ANY FILE I CITE except category_and_licensing_analysis.yaml.
        For the redraft, the red-team report and the two decisions I read the
        named key paths and their surroundings, not the entire record. A
        condition bearing on clause_4 that lives somewhere in those files that I
        did not open would not have been seen by me, and R4's check is scoped to
        analysis.licensing.
      - >-
        I DID NOT OPEN inputs/, BATCH-2e6130, or experiments/EXP-WESOVOW-001/cost_model.py.
        Every statement anyone else has made about their contents is outside my
        evidence and none of my reasons rests on one.
      - >-
        I DID NOT RE-CHECK RT-4's TARGET AGAINST THE SUPERSEDED DRAFT. RT-4's
        target names `protocol_amendment_draft.yaml`, the BATCH-752ef2 record,
        and I ruled on the REDRAFT's clause_4 because that is the text the
        question is about. I did not open the superseded draft's clause_4 to
        confirm that the redraft's licensing text differs from it in the way the
        change log says; I took `changes_from_the_superseded_draft` item n 3 as
        the record's own statement of what changed and I say so rather than
        implying I diffed them.
    what_this_confirmation_is_not: >-
      DEC-20260906-f709b2 PD-14 records that PD-9's standing gap is now closed on
      three halves and REMAINS OWED BY THE ENACTING DECISION. MY CONFIRMATION IS
      NOT THAT DISCHARGE, is not offered as it, and no successor may cite it as
      such. I confirmed the clause texts my own reasons rest on; that is all.

  # =====================================================================
  whom_it_binds_and_from_when:
    right_now_it_binds_nobody: >-
      STATED FIRST BECAUSE IT IS THE OPERATIVE FACT TODAY. This artifact is a
      coordination artifact. It binds nothing and nobody at the moment of
      writing. It is not a ledger record, it changes no status, and it is not
      evidence of anything except that a position was written down before an
      adversary was asked to attack it.
    from_when: >-
      IT BINDS FROM THE INSTANT DEC-20260906-2e712f ADOPTS IT BY NAME, restates
      its operative text, and is COMMITTED AND PUSHED WITH AN OPEN PR AGAINST
      main. A ruling adopted in a decision that exists only in a local commit is
      unpublished and binds nothing (batch.yaml P-1
      when_p_1_is_satisfied_and_not_before).
    whom_it_would_then_bind:
      - >-
        THE ENACTING DECISION, on the RT-4 item of the six it must settle in its
        own text. It would take this ruling as the Coordinator position and
        either adopt it, or supersede it by its own reasoned committed decision.
        IT IS NOT RELIEVED OF DECIDING - it is relieved of having to SUPPLY the
        material, which is the whole point of authoring this in advance.
      - >-
        ANY SUCCESSOR TASK THAT WOULD RE-OPEN RT-4's LICENSING QUESTION. It must
        attack this ruling on its reasons and its anchors rather than re-derive
        the question from scratch, and a successor that disagrees records a
        superseding decision, never an edit to this file.
    whom_it_would_NOT_bind:
      - Any implementation. This ruling imposes no requirement on cost_model.py or on any other program, and authorizes no change to one.
      - Any run. No run is authorized, scheduled or implied.
