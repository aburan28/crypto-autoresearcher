      concurrence involving my artifact may ever be presented as agreement
      between distinct models.
    blindness_lifted_for_this_task_by_name: true
    blindness_note: >-
      BLINDNESS WAS DELIBERATELY LIFTED FOR THIS TASK BY NAME. I was given and
      required to read the prior rounds' committed reports and decisions,
      because RT-4 is identified BY NUMBER there and a ruling on a numbered
      finding cannot be made without them. THE COST, STATED IN THE RULING'S OWN
