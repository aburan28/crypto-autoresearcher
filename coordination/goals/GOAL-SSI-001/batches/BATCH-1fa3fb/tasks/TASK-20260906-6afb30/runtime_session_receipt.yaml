      ATTACK the ruling rather than supply it. Write it to be attacked. A ruling
      hedged into unfalsifiability defeats its own purpose: state the position,
      state what would defeat it, and state what it does not decide."
    verbatim_on_the_scope_of_the_question: >-
      "RT-4's licensing question is the one item the redraft carried into
      clause_4's own contract text as ordered but did not and could not SETTLE.
      You settle it - and only it."
