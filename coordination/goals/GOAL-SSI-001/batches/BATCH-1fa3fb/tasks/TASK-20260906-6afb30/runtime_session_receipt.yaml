      unresolved divergence between the adapter's binding target and their
      session self-report, and asked me to escalate rather than absorb it if I
      saw the same. I COULD NOT SEE IT EITHER WAY: with no shell and with
      orchestration/ outside my read_scope, I hold only one of the two terms of
      the comparison, so I can neither confirm nor deny a divergence for this
      task. WHAT I ESCALATE IS THE STANDING CONDITION ITSELF - that a
      Coordinator subagent on this runtime cannot check its own binding target,
      so a divergence reported twice in this batch remains UNRESOLVED and
      UNRESOLVABLE FROM INSIDE A PRODUCER TASK. The check belongs to a session
      that holds a shell, before dispatch and not after. I record no result I do
      not have.
    bedrock_prohibition: >-
      NO PROVIDER, BACKEND, ENDPOINT OR MODEL IDENTIFIER CONTAINING `bedrock`,
      CASE-INSENSITIVELY, WAS SELECTED, REQUESTED, CONFIGURED OR NAMED BY THIS
      TASK. I selected no provider, backend, endpoint or model at all; I have no
      mechanism to.

  # =====================================================================
  round_independence:
    session_independent: true
    model_independent: false
    statement: >-
      THIS ROUND IS SESSION-INDEPENDENT AND NOT MODEL-INDEPENDENT. Every agent
