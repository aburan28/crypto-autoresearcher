      link to `metrics[5]` is asserted by clause_2 and not by the record.
      Clause_2 describes that record as 'committed, frozen, and already governs
      cost_model.py' - committed and frozen are supported; 'already governs' is
      not stated by the record and it carries no field that would state it. P-2
      recorded that difference and left the stronger claim un-promoted, because
      asserting clause_2 is wrong needs `review-breakthrough` at `max`, which
      IMP-1 makes unservable. Preserve that boundary exactly: you may rule on
      RT-4's licensing question; you may not rule that clause_2 is wrong."
    verbatim_finding_it_gave_me_from_sibling_task_TASK_20260906_decbd5_P_3: >-
