      SELF-REPORT AND NOT AS A VERIFIED IDENTITY. A model's statement about its
      own identity is not evidence of it.
    model_verified: false
    probe_run: false
    probe_run_note: >-
      NO PROBE OF ANY KIND WAS RUN BY ME. I ran no `adapter doctor --probe`, no
      `adapter resolve`, and no request that would report a serving model. AN
      `adapter resolve` OUTPUT WOULD IN ANY CASE READ A COMMITTED BINDING TARGET
