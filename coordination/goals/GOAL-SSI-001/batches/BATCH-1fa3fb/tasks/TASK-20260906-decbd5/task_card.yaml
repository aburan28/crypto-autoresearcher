      COMPUTE A sha256 OVER THE EXACT FIVE-LINE BLOCK AND A sha256 OVER THE WHOLE
      FILE, each recorded with the exact command that produced it and with the fact
      that the command EMITS ONLY THE DIGEST. A DIGEST BINDS THE BLOCK WITHOUT
