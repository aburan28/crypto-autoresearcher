# PERMITTED OUTPUT TWO - SHAPE, AS BOOLEANS AND COUNTS ONLY.
shape_predicates:
  the_list_was_not_extended: true
  method: >-
    Two instruments, both outside the repository and both emitting only booleans and
    counts, plus one reading step. (a) A mechanical predicate script over the
    declared line range, which computed the limbs of S1, S3, S4, S5 and the S6
    lexical search and printed nothing but names, booleans and counts. (b) A
    DIGIT-REDACTING FILTER that renders the range with EVERY MAXIMAL DIGIT RUN
    REPLACED BY A SINGLE `#` character, so that neither the value nor the length of
    any numeral reached this agent, used to judge S2, S6 and S7, which are judgments
    a regular expression cannot make. THE UNREDACTED BLOCK WAS NEVER PRINTED AS A
    STEP OF ITS OWN, AND NO CONTENT OF IT WAS WRITTEN ANYWHERE. The same
    numeral-redacting device is recorded by DEC-20260906-f709b2 citation_boundary as
    having been used by a producer of the previous round.
  residual_this_method_does_not_close: >-
    A redacting filter keeps numerals out of the transcript; it does not keep the
    block's WORDS out. This agent read the block's non-numeric text and its
    structure. THAT IS THE RESIDUAL THE CONTROL PLANE ALREADY DECLARED - an agent
    holds the row and no tool can check what an agent saw - and it is restated here
    from this agent's own side rather than left to the control plane.

  S1:
    predicate: The block is a contiguous run of exactly five lines. TRUE or FALSE.
    answer: TRUE
    basis: >-
      Five lines were extracted for the range, the range is contiguous by
      construction, and all five carry non-whitespace content.
  S2:
    predicate: >-
      The block presents as a TABULAR per-field-size listing - rows keyed by a
      field-size parameter - rather than as running prose. TRUE or FALSE.
    answer: TRUE
    basis: >-
      One row per line, five parallel-structured rows, each row opening with a
      field-size key and carrying the same labelled columns in the same order. It is
      not running prose.
    the_qualification_that_keeps_this_answer_honest: >-
      THE ROWS ARE LIST ITEMS, NOT CELLS OF A DELIMITED TABLE. There is no pipe
      table, no column-header row and no fixed-width alignment. `TABULAR` is
      answered TRUE on the sense the predicate defines - rows keyed by a field-size
      parameter - and a reader who expected a delimited table should read this
      qualification rather than the bare boolean. THE QUALIFICATION CARRIES NO
      NUMERIC CONTENT.
  S3:
    predicate: The number of rows in the block that carry a field-size key. A COUNT.
    answer: 5
    basis: >-
      A regular expression for a field-size key matched on five of the five lines,
      and a field-size key VALUE was parsed from five of the five, with five
      DISTINCT key values. The parsed values themselves were never printed, never
      compared and never recorded.
  S4:
    predicate: >-
      A row keyed to the field size this campaign's committed records call P=512 is
      PRESENT in the block. TRUE or FALSE. A PRESENCE BOOLEAN, NEVER THE ROW'S
      CONTENTS.
    answer: TRUE
    basis: >-
      The predicate script tested membership of the published locator label among
      the parsed field-size keys and emitted only the boolean. NO CONTENT OF THAT
      ROW, AND NO OTHER PROPERTY OF IT, IS RECORDED, DERIVED OR IMPLIED ANYWHERE IN
      THIS PACKAGE. No value read out of the block appears in this artifact at all,
      so no adjacency to the published locator label can arise.
  S5:
    predicate: The number of value columns per row. A COUNT.
    answer: 2
    basis: >-
      Each of the five rows carries a time column and a memory column, labelled by
      the same two words in every row, in the same order. Mechanically - all five
      rows carry at least one time-labelled column, all five carry at least one
      memory-labelled column, and the per-row mention counts are uniform across the
      five rows.
    the_counting_rule_is_declared_rather_than_derived_and_here_it_is: >-
      EACH ROW ALSO CARRIES A PARENTHETICAL CLAUSE REFERRING TO PRIOR METHODS, WHICH
      THIS ANSWER DOES NOT COUNT AS A VALUE COLUMN AND WHOSE CONTENTS ARE NOT
      CHARACTERIZED ANYWHERE HERE. The count of two is taken over the per-row pair
      that clause_3's `what_the_five_pairs_are` refers to. A reviewer counting
      numerals rather than columns will get a different number, which is why the
      rule is written down instead of left implicit. THE COUNT IS NOT A VALUE AND NO
      VALUE IS IMPLIED BY IT.
  S6:
    predicate: >-
      The block states, IN WORDS, that its figures are lower bounds or come from an
      underestimation. TRUE or FALSE. A quotation is permitted here ONLY if the
      quoted span contains NO DIGIT AT ALL; if any candidate span contains a digit,
      the answer is the boolean alone with no quotation.
    answer: FALSE
    quotation_offered: >-
      NONE. The predicate permits a quotation only where the candidate span contains
      no digit at all. The answer is FALSE, so there is no candidate span, and no
      quotation is offered.
    basis: >-
      A case-insensitive search over the block for eleven lexical terms covering the
      lower-bound and underestimation senses - including `lower bound`,
      `lower-bound`, `underestimate`, `underestimation`, `rough`, `at least`,
      `minimum`, `conservative` and `bound` - returned a hit on none of them. The
      search terms were declared in the script before it was run and are recorded
      here; the searched text was never printed.
    scope_of_this_answer_stated_because_the_bare_boolean_would_mislead: >-
      S6 IS ANSWERED OVER LINES 234-238 ONLY, WHICH IS THE SCOPE THE PREDICATE
      DECLARES, AND OVER THE `IN WORDS` TEST AS THE PREDICATE WRITES IT. WHETHER THE
      CHARACTERIZATION APPEARS ELSEWHERE IN THE FILE WAS NOT EXAMINED - the closed
      predicate list may not be extended by this task, and a range outside the
      locator is not this task's object. RECORD THIS AS NOT EXAMINED, NEVER AS
      ABSENT FROM THE SOURCE.
    the_difference_from_clause_3_is_NAMED_AND_THE_STRONGER_CLAIM_IS_LEFT_UN_PROMOTED: >-
      clause_3's `what_the_five_pairs_are` opens by characterizing the figures as
      stated in the FROZEN SOURCE as lower bounds from an underestimation the source
      itself describes as rough. THAT SENTENCE IS ABOUT THE FROZEN SOURCE AND IS NOT
      RESTRICTED BY ITS OWN TERMS TO LINES 234-238. S6 IS THEREFORE NOT A
      CONTRADICTION OF IT AND IS NOT PRESENTED AS ONE. This task ASSERTS NO DEFECT IN
      ANY COMMITTED IMMUTABLE RECORD: the difference is NAMED - the words are not in
      the located block - and every stronger reading of that difference is LEFT
      UN-PROMOTED, because asserting a committed record wrong requires
      `review-breakthrough` at `max`, which is `degradable: false` and unservable
      here under IMP-1, and no lower tier may be substituted.
    S6_mandatory_scope_sentence_verbatim: >-
      This records that the block does or does not contain a lower-bound
      characterization. IT DOES NOT RULE THAT CONFIRMING THE CHARACTERIZATION IS,
      OR IS NOT, PART OF clause_3's ENACTMENT PRECONDITION. That is RT-9(a), it is
      RESERVED TO THE ENACTING DECISION, and no successor may cite this observation
      as discharging any extension of the precondition or as making the reserved
      question moot.
  S7:
    predicate: >-
      This block is the location a reader of clause_3's `what_the_five_pairs_are`
      would reach for the five time-and-memory pairs C1 anchors on. TRUE or FALSE.
    answer: TRUE
    basis: >-
      The locator recorded by DEC-20260904-4c81b6 next_actions[1], which clause_3
      cites, names exactly this line range of exactly this file; the block at that
      range is a per-field-size listing of five rows, each carrying a time column
      and a memory column, which is the object `the five pairs` names. A reader
      following clause_3's pointer arrives here and finds a five-row listing of that
      form.
    what_this_answer_does_not_say: >-
      IT DOES NOT SAY THAT ANY VALUE IN THE BLOCK AGREES WITH ANY VALUE ANYWHERE
      ELSE. No comparison of any kind was made, none is recorded, and none may be
      read out of this answer. Fidelity of the extracted values to the source is
      settled elsewhere in the campaign record and is not this task's object.
  wanted_and_not_answered: []
  wanted_and_not_answered_note: >-
    EMPTY, AND THAT IS A REPORT RATHER THAN A DEFAULT. Every one of the seven
    predicates was answerable with the instruments this task held. Nothing was
    invented and nothing was substituted.

