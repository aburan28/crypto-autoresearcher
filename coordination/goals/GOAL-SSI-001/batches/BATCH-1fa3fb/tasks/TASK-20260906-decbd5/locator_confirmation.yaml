      S3's count and S5's count are consistent with what the campaign record already
      implies about the number of pairs at that locator. A reader may treat those
      two counts as corroborated rather than as new.
    - >-
      THE ASSIGNMENT ITSELF HAS THE ENTAILMENT SHAPE - `confirm that X` invites
      `confirmed` - and this package returns `confirmed` on the resolution question.
      That is stated plainly rather than defended.
  not_entailed:
