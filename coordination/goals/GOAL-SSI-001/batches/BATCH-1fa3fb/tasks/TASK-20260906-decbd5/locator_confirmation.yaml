      this package a successor can re-run most cheaply.
    - >-
      OBJ-B AND OBJ-C EACH CAME OUT WRONG-WAY, so at least two ways the instruments
      could have been vacuous were tested and did not obtain.
  the_honest_residual: >-
    NOBODY CHECKED WHETHER I ANSWERED S2, S6 AND S7 CORRECTLY. They are judgments
