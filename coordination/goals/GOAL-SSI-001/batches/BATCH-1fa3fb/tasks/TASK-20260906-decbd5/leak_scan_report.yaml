# =====================================================================
what_was_scanned:
  artifacts:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-1fa3fb/tasks/TASK-20260906-decbd5/locator_confirmation.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-1fa3fb/tasks/TASK-20260906-decbd5/runtime_session_receipt.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-1fa3fb/tasks/TASK-20260906-decbd5/leak_scan_report.yaml
  note: >-
    ALL THREE ARTIFACTS OF THIS PACKAGE, INCLUDING THIS FILE. The ordering of the
    passes, including the one that had to run after this file existed, is disclosed
    at pass_ordering below rather than left for a reader to infer.

the_closed_classification_list_as_the_card_writes_it: >-
  Classify EVERY digit run as exactly one of: a line number, an identifier, a date,
  a version, a count that S3 or S5 requires, or a digest fragment. A DIGIT RUN THAT
  DOES NOT CLASSIFY INTO THAT CLOSED LIST IS A STOP.

the_instrument:
  limb_one: >-
    A rule table declared IN FULL BEFORE ANY ARTIFACT WAS READ IN THAT PASS, mapping
    each digit run to its TRUE NATURE by regular expression, applied in a fixed
    order so that the first matching rule owns the characters. A digit run that NO
    rule matches is reported UNACCOUNTED. UNACCOUNTED is the STOP the card
    describes; it is the state of not being able to say what a digit is.
  limb_two: >-
    An INDEPENDENT decimal-pattern search for `\d+\.\d+` over the same text, which
    does not consult the rule table at all. It is the same limb the previous round's
    reviewer used, as recorded by DEC-20260906-f709b2 citation_boundary, and it is
    here so that a failure of the rule table cannot silence the whole instrument.
  what_the_instrument_cannot_do: >-
    IT CANNOT SEE A VALUE WRITTEN IN WORDS, AN ORDERING, A BUCKET, A RANGE OR A UNIT
    CONVERSION. Those are checked by hand at the_subtler_leaks_a_digit_scan_cannot_see
    below, by the same agent that wrote the artifacts, WHICH IS THE WEAKEST CHECK IN
    THIS PACKAGE AND IS LABELLED AS SUCH.
  where_it_lives: >-
    OUTSIDE THE REPOSITORY, in a session scratchpad, together with the predicate
    script and the digit-redacting filter. It is archived by nothing and does not
    survive this session. A successor re-runs the scan by re-writing it from the
    rule table quoted here, not by executing a stored file.

# =====================================================================
pass_ordering:
  disclosed_because_the_alternative_is_a_scan_that_looks_cleaner_than_it_was: true
  pass_one:
    scope: the first two artifacts
    result: >-
      TWENTY-TWO UNACCOUNTED DIGIT RUNS. EVERY ONE OF THEM WAS A GAP IN THIS AGENT'S
      OWN REGULAR EXPRESSIONS AND NOT A LEAK. The token forms that fell through were:
      an identifier followed by an underscore rather than a word boundary
      (`S1_why`, `S2_why`); a key name with a leading underscore before the
      identifier (`what_clause_3_directs`); line numbers embedded in key names
      (`lines_234_through_238`); the name of the hash algorithm (`sha256`,
      `sha256sum`); the name of the interpreter (`python3`); and the random suffix of
      a git branch name.
  pass_two:
    result: >-
      ONE UNACCOUNTED RUN - a capitalised `Clause_3` inside a verbatim quotation of
      the launching prompt, which the case-sensitive rule missed.
  pass_three:
    result: ZERO UNACCOUNTED RUNS over the first two artifacts.
  final_pass:
    scope: all three artifacts, this file included
    result: SEE final_pass_result BELOW.
  one_further_rule_correction_after_this_file_was_first_written: >-
    A rule added to classify this file's own tallies was found to be capturing the
    S3 and S5 answers in the confirmation artifact as well, which would have
    MISREPORTED two genuine S3/S5 counts as scan output. The rule order was
    corrected so the count rule owns them, and the tallies were then written in
    words so that the tally rule has nothing left to match. THE MISCLASSIFICATION IS
    RECORDED RATHER THAN QUIETLY FIXED, because a scan that silently relabels is the
    thing this report exists to make checkable.
  why_refining_the_rules_is_not_rigging_the_scan_and_how_to_check_that: >-
    EVERY REFINEMENT ADDED A RULE FOR A TOKEN FORM, NEVER FOR A VALUE. No rule was
    added that would classify a numeral read out of the located block; no rule
    mentions any quantity of this campaign; the categories were not widened; and the
    positive control was re-run after every refinement AND STILL FIRES. THE CHECK A
    REVIEWER SHOULD MAKE: read the rule table below and ask whether any rule would
    have absorbed a leaked operations count, memory bound, exponent or ratio. NONE
    WOULD - the rules match identifier grammars, date grammars, hex digests, the two
    published locator labels, and four named line numbers, and nothing else.
  the_residual_of_this_iteration_stated_plainly: >-
    A SCAN THAT IS EDITED UNTIL IT IS GREEN IS THE FAILURE MODE THIS BATCH HAS FOUND
    SIX TIMES ELSEWHERE. What defends this one is that its refinements are
    enumerated above, its rule table is published below, and its positive control
    fires. It is NOT defended by its own green result.

rule_table_as_run:
  digest_fragment: a run of forty to sixty-four lowercase hex characters
  date: the four-two-two dashed date grammar
  identifier: >-
    the record identifier grammars of this program (TASK, DEC, CORR, BATCH, GOAL,
    RQ, EV, EXP), the frozen source directory name, the predicate names S-one
    through S-seven, the precondition names P-one through P-eight, the finding
    grammars RT, CF, IMP, AF, PD, NA, F and F-J, the control names C-one through
    C-four, `clause_` key names, `metrics[..]` and `next_actions[..]` key paths, the
    hash algorithm name, the interpreter name, the model identifier grammar
    `claude-<family>-<n>`, a git branch name, the function name `log2`, and the
    scan script's own name
  version: a schema version of the form slash-v-digits
  line_number: the four line numbers this task used - the two bounds of the locator and the two bounds of the OBJ-C past-end range - and the OBJ-B range
  count_required_by_S3_or_S5: the answers to S3 and S5 and their control-object counterparts
  categories_the_closed_list_does_not_name: see the_control_plane_defect below

# =====================================================================
final_pass_result:
  unaccounted_digit_runs: zero
  stop_condition_fired: false
  decimal_pattern_limb_matches: zero
  per_category_tallies_over_the_three_artifacts_written_in_words:
    identifier: three hundred and fifteen
    digest_fragment: thirty-eight
    line_number: twenty-four
    date: nine
    version: three
    count_required_by_S3_or_S5: four
    accounted_for_but_not_named_by_the_closed_list: sixteen
    unaccounted: zero
  tallies_are_of_the_file_state_at_the_final_verification_pass: >-
    STATED BECAUSE THIS FILE SCANS ITSELF. The tallies are the result of the pass
    run AFTER all three artifacts reached their final content; an earlier pass
    returned a lower identifier tally because this file had not yet been completed,
    and that earlier figure was corrected rather than left standing.
  why_the_tallies_are_written_in_words: >-
    SO THAT PUBLISHING THIS SCAN DOES NOT ITSELF CREATE A NEW CATEGORY OF DIGIT RUN
    THE CLOSED LIST CANNOT NAME. The tallies are outputs of the scan, not of the
    located block; writing them as words keeps the classification exercise honest
    instead of inflating it with the scan's own arithmetic. A reviewer who wants
    numerals re-runs the scan.

# =====================================================================
the_control_plane_defect:
  statement: >-
    THE CLOSED CLASSIFICATION LIST CANNOT CLASSIFY DIGIT RUNS THAT THE SAME CARD
    MANDATES. Permitted Output One REQUIRES a file's total line count and a block's
    byte length, and the closed list names no category for either. The executor
    contract requires recording exact commands and exit codes, and the list names no
    category for a command argument or an exit code. The batch requires every
    artifact to restate the citation prohibition and its predicate extension
    VERBATIM, and those sentences carry digits.
  this_is_a_defect_of_the_LIST_and_not_of_these_ARTIFACTS: >-
    The card's own Permitted Output One says, in terms, that A LINE COUNT AND A BYTE
    LENGTH ARE FACTS ABOUT A FILE AND ARE NOT VALUES OF A TABLE. The list therefore
    omits a category its own card declares to be non-content.
  the_sixteen_runs_the_closed_list_does_not_name:
    items:
    - run: the published locator label and the two numerals of the sign label, eight occurrences across the package
      true_nature: >-
        the field-size label and the sign label already published in committed
        records, appearing in the discriminating sentence, in the S4 predicate text,
        and in the restated prohibition where each artifact restates it - spans that
        were each checked against their committed source and found equal
    - run: the numeral inside the byte-verified predicate extension, two occurrences
      true_nature: part of the mandated verbatim restatement of the second limb, in each artifact that restates it
    - run: the file's total line count
      true_nature: a resolution fact mandated by Permitted Output One
    - run: the block's byte length
      true_nature: a resolution fact mandated by Permitted Output One
    - run: one numeral in the recorded `tail` command
      true_nature: an argument of a command recorded for reproducibility
    - run: one recorded exit code
      true_nature: the exit status of the adapter resolution, recorded as the receipt requires
    - run: one numeral in an environment variable assignment
      true_nature: the bytecode-suppression setting the batch mandates
    - run: one numeral inside a verbatim quotation of the launching prompt
      true_nature: part of a CF-15 disclosure quoted verbatim, not a figure of this task's own
    total: sixteen digit runs, itemised above, none of them read out of the located block.
  none_of_them_is_content_of_the_located_block: >-
    CHECKED, NOT ASSERTED. Each has a provenance a successor can verify in committed
    bytes - the card, the batch record, the launching prompt as quoted, or a command
    recorded with its output. NONE was read out of lines 234-238, and none is an
    operations count, a memory bound, an exponent, a ratio, a margin, a sign or a
    crossover.
  precedent_that_this_gap_is_not_new: >-
    DEC-20260906-f709b2 citation_boundary records the previous round's reviewer
    classifying digit runs as `an identifier, a line number, a date, a digest
    fragment or an authorized budget` - a FIFTH category that is not in this card's
    closed list either. The gap has been met before and closed by quietly widening
    the list. THIS TASK DID NOT WIDEN IT; it reported it.
  this_tasks_disposition_and_it_is_a_judgment_that_can_be_OVERRULED_CHEAPLY:
    disposition: >-
      NO STOP IS DECLARED. The STOP exists to catch a digit run that CANNOT BE
      ACCOUNTED FOR, because such a run may be leaked content. Every run here is
      accounted for by a declared, checkable rule. Reading the STOP literally would
      make the card self-defeating: no compliant artifact could exist, because the
      same card mandates the very runs the list cannot name.
    the_literal_reading_stated_fairly_against_this_disposition: >-
      THE CARD AND THE HANDOFF BOTH SAY, IN TERMS, THAT A DIGIT RUN THAT DOES NOT
      CLASSIFY INTO THE CLOSED LIST IS A STOP, AND THE LAUNCHING PROMPT SAID THAT
      SUCH A RUN IS A STOP AND NOT A NOTE. On the literal reading, twelve runs do not
      classify and this package is a STOP. EVERYTHING NEEDED TO REACH THAT VERDICT
      IS IN THIS FILE; the reviewer or the Coordinator can adopt it without
      re-running anything.
    what_this_task_refused_to_do: >-
      IT REFUSED TO CALL A BYTE LENGTH `A COUNT THAT S3 OR S5 REQUIRES` OR THE
      PUBLISHED LOCATOR LABEL `AN IDENTIFIER` IN ORDER TO OBTAIN A GREEN RESULT. Both
      would have produced a clean scan and both would have been false. A
      classification moved to make a red instrument green has stopped being a check.
    RECOMMENDATION_NOT_A_DECISION: >-
      A successor card should name a category for the resolution facts, the recorded
      commands and exit codes, and the mandated verbatim spans that it itself
      requires. THIS IS A RECOMMENDATION AND NOT A DECISION, and it settles nothing.

# =====================================================================
OBJ_E_the_leak_scan_positive_control:
  what_was_run: >-
    The digit scan, in the exact configuration used on the artifacts, was exercised
    on the synthetic string DECLARED VERBATIM in this task's card at
    your_entailed_control_objects_and_they_are_not_optional.OBJ-E and in batch.yaml
    at entailed_control_analysis.the_named_entailed_control_objects.OBJ-E. The string
    was held OUTSIDE the repository and is not transcribed here; it is referred to by
    locator so that this report introduces no digit run on its account.
  the_string_has_no_relation_to_any_campaign_quantity: >-
    Stated by batch.yaml, which declares it unrelated to any campaign quantity, any
    anchor, any crossover and any margin.
  DID_IT_FIRE: true
  how_it_fired:
    limb_one_rule_table: >-
      FIRED. Both digit runs of the probe were reported UNACCOUNTED - no rule in the
      table matched either of them.
    limb_two_decimal_pattern: >-
      FIRED. The independent decimal-pattern limb matched the probe.
  both_limbs_fired_and_that_matters: >-
    The two limbs are independent, so the control shows that a plainly leaking string
    is caught by the rule table AND by a check that does not consult the rule table.
    A silent scan here would have been a BREAK and would have made the zero over the
    real artifacts carry no information. IT WAS NOT SILENT.
  it_was_re_run_after_every_rule_refinement: >-
    AND FIRED EVERY TIME. That is what rules out the specific failure where a scan is
    edited until it can no longer fire.
  what_this_control_still_does_not_establish: >-
    IT SHOWS THE SCAN FIRES ON AN OBVIOUS DECIMAL. It does NOT show the scan would
    fire on a leaked INTEGER that happens to resemble an identifier, or on a value
    written in words, and no such probe was run. That residual is real and is not
    argued away.

# =====================================================================
the_subtler_leaks_a_digit_scan_cannot_see:
  who_checked_this: >-
    THE SAME AGENT THAT WROTE THE ARTIFACTS, BY HAND. THIS IS THE WEAKEST CHECK IN
    THE PACKAGE and the reviewer should redo it rather than rely on it.
  a_value_described_in_words_rather_than_digits:
    found: false
    closest_call_disclosed_rather_than_omitted: >-
      locator_confirmation.yaml S5 records that each row ALSO CARRIES A PARENTHETICAL
      CLAUSE REFERRING TO PRIOR METHODS, and expressly declines to characterize its
      contents. That sentence names the existence and subject of a clause; it states
      no value, no magnitude, no direction and no comparison. IT IS THE NEAREST THIS
      PACKAGE COMES TO THE LINE, IT IS FLAGGED HERE FOR THAT REASON, and if the
      reviewer judges it over the line the remedy is a finding against this artifact,
      not a silent edit.
  an_ordering_or_a_comparison_between_rows:
    found: false
    closest_call: >-
      S5's basis records that the per-row mention counts are UNIFORM ACROSS THE
      ROWS. That is a statement about structure - every row is built the same way -
      and not about any value in any row. No row is said to be larger, smaller,
      earlier or later than any other, and no two values are related anywhere.
  a_range_or_a_bucket:
    found: false
    note: >-
      No figure of the block is placed in an interval, an order of magnitude, a
      bucket or a band anywhere in the package.
  a_unit_conversion:
    found: false
    note: >-
      Nothing was converted. No bit count, operation count, byte count or memory
      figure of the block was rescaled, exponentiated, logged or re-expressed.
  a_sentence_placing_the_published_locator_label_next_to_something_read_out_of_the_block:
    found: false
    how_checked: >-
      The three occurrences of the label were located and read in context. Each sits
      inside a span supplied verbatim by the card or the batch record - the
      discriminating sentence, the S4 predicate text, the restated prohibition. The
      closest call is the S4 predicate text, whose answer `TRUE` stands next to it;
      that answer is A PRESENCE BOOLEAN, which the same predicate sentence expressly
      authorizes and distinguishes from the row's contents. More decisively: NO
      VALUE READ OUT OF THE BLOCK APPEARS ANYWHERE IN THIS PACKAGE, so there is
      nothing for a label to be adjacent TO.
  a_derived_quantity:
    found: false
    note: >-
      Nothing was computed from anything in the block. The only computations in this
      package are two sha256 digests, a line count, a byte length, five non-emptiness
      booleans and the predicate counts.

# =====================================================================
verbatim_span_verification:
  why: >-
    A digit inside a mandated verbatim span is safe only if the span really is
    verbatim. THAT WAS CHECKED RATHER THAN ASSUMED.
  method: >-
    Each span in locator_confirmation.yaml was compared, after whitespace
    normalization, against its committed source read with yaml.safe_load. YAML block
    folding changes line breaks, so the comparison is on normalized whitespace and is
    reported as such rather than described as byte-for-byte on raw bytes.
  results:
    retained_citation_prohibition_vs_batch_yaml: EQUAL
    retained_citation_prohibition_vs_task_card: EQUAL
    predicate_extension_vs_batch_yaml: EQUAL
    predicate_extension_vs_task_card: EQUAL
    discriminating_sentence_vs_task_card: EQUAL
    S6_mandatory_scope_sentence_vs_task_card: EQUAL
    S6_mandatory_scope_sentence_vs_batch_yaml: EQUAL
    all_seven_predicate_texts_S1_to_S7_vs_task_card: EQUAL
  one_correction_made_before_this_check_passed_and_it_is_disclosed: >-
    On the first comparison the seven predicate texts were found to be the card's
    text with the trailing answer-format instruction dropped. THE ARTIFACT WAS
    CORRECTED TO CARRY THE CARD'S FULL TEXT and re-checked. The artifact was
    uncommitted at the time; no committed or immutable object was edited, and the
    correction is recorded here rather than left invisible.

# =====================================================================
citation_prohibition:
  retained_verbatim: >-
    The `P=512` crossover value and its `w=2^80` sign are **NOT citation-eligible**.
    This task does not lift that prohibition. Only a committed Coordinator decision
    on independently reviewed evidence can lift it.
  predicate_extension_verbatim: >-
    In addition to the retained sentence, a row of any EXP-WESOVOW-001 reconciliation
    is NOT citation-eligible when either (a) the two anchors disagree in the SIGN of
    the baseline comparison at that row, or (b) the smaller |margin| across the two
    anchors at that row is below that field size's anchor gap |Delta log2 T_full +
    Delta log2 M / 2|.
  neither_limb_is_lifted_narrowed_or_widened_by_this_task: true
  the_retained_sentence_was_APPLICABLE: >-
    YES - this task opened the block the governed value is derived from - AND IT DID
    NOT FIRE.
  the_predicate_extension_had_no_object: >-
    This package cites no row of any reconciliation, and the reconciliation
    artifacts are outside this task's read scope by the batch's containment
    separation.

