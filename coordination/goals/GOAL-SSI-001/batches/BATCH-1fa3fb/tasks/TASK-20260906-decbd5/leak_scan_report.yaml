headline:
  unaccounted_digit_runs: zero
  stop_condition_fired: false
  digit_runs_accounted_for_by_a_rule_whose_category_the_closed_list_DOES_NOT_NAME: sixteen
  OBJ_E_synthetic_leak_probe_FIRED: true
  independent_decimal_limb_matches_over_the_three_artifacts: zero
  verdict: >-
    NO LEAK FOUND, AND THE CLOSED CLASSIFICATION LIST WAS FOUND UNABLE TO NAME A
    CATEGORY ITS OWN CARD MANDATES. Both findings are reported below in full, the
