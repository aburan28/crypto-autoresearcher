launching_prompt_disclosure:
  a_launching_prompt_was_received: true
  it_named_the_reading_order_and_stated_that_it_overrides_nothing: >-
    It directed this agent to read, in order, the task card, the queue handoff block
    (which it said GOVERNS on overlap, with the completion_gate authoritative), the
    materialized ledger handoff, batch.yaml, AGENTS.md, CLAUDE.md and the executor
    role contract, and stated that those documents are authoritative and that the
    prompt adds dispatch facts and emphasis and overrides nothing.
  verbatim_statements_it_made_about_an_expected_outcome_a_known_finding_or_a_suspected_defect:
    - >-
      "It is the highest-hazard task in the batch."
    - >-
      "Clause_3's own text directs an enacting Coordinator to confirm this locator
      before enactment, and four consecutive rounds declined to open it on scope
      grounds. Opening it is now required."
    - >-
      "But the block at that locator is a per-field-size table that includes a row at
      the governed field size, so confirming the locator sits directly on top of the
      value the citation prohibition covers."
    - >-
      "The controls are the point, not paperwork ... They must come out wrong-way if
      your instruments are sound - including the synthetic leak probe, which must
      fire."
    - >-
      "A digit scan whose run you cannot classify against the closed list is a STOP,
      not a note: stop, write what you have, and say so."
    - >-
      "A STOP is a complete and acceptable result here, and a far better one than a
      leak."
    - >-
      "You will hold the governed row in context, and no tool can check what you saw
      - only what you wrote."
    - >-
      "Whether P-3 extends to the CHARACTERIZATION is RT-9(a) and STAYS RESERVED"
    - >-
      "runs_authorized: 0 - ZERO experiment runs."
    - >-
      "Record inference provenance honestly: requested executor-implementation at
      effort medium, fallback_allowed: false."
  what_it_did_NOT_tell_me_which_matters_as_much: >-
    IT DID NOT TELL ME WHETHER THE LOCATOR RESOLVES. It did not state any predicate
    answer, did not state the number of rows or columns, did not say whether the
    block states a characterization in words, did not restate any governed value or
    any part of the block's numeric content, and did not tell me anything about the
    charging law or its crossover form. It did not hand me the Coordinator's prior
    and did not tell me any sibling agent's conclusion.
  the_channel_this_disclosure_leaves_open_and_it_is_named: >-
    THE PROMPT PRE-STATED THE BLOCK'S SHAPE - a per-field-size table with a row at
    the governed field size - BEFORE I LOOKED. batch.yaml expressly permits that
    (shape is not a governed value) and the same description is on the card. IT IS
    NONETHELESS AN EXPECTATION HANDED TO THE AGENT ABOUT TO CONFIRM, and it is
    counted as such in this package's entailment analysis rather than discounted.
  contamination_across_the_containment_separation: >-
    NONE OBSERVED. Nothing in the launching prompt conveyed anything about the P-2
    object, the BATCH-2e6130 record, the charging law, its crossover form, or any
    reconciliation row.
  telling_me_a_STOP_is_acceptable_is_a_WEAKER_mitigation_than_silence: >-
    Recorded because batch.yaml records it in advance. Being told that a STOP is
    acceptable and that manufacturing a finding is the failure mode is weaker than
    being told nothing, and it is disclosed rather than treated as neutral.

