      characterisation of that record as `committed, frozen, and already governs
      cost_model.py`. YOU MAY NOT CONCLUDE THAT clause_2 IS WRONG - that stronger claim
      needs `review-breakthrough` at `max`, which is `degradable: false` and UNSERVABLE
      HERE (IMP-1). Name the difference and LEAVE THE CLAIM UN-PROMOTED.
    part_c_the_three_invariants: >-
      ANSWERED AS QUESTIONS ABOUT WHAT THE RECORD STATES, IN FORM, AND NEVER BY
      EVALUATING ANYTHING. See clause_2s_three_invariants_verbatim and
      how_you_answer_them below.
  clause_2s_three_invariants_verbatim: >-
    Quoted from `proposed_replacement.clause_2.replacement_text_in_full`, key
    `invariants_that_any_incorporated_law_must_satisfy`, of the committed immutable
    redraft. (1) "Control C3 of this contract: T(w) non-increasing in w for every (p,
    overhead) scenario, and T(w) = T_full for w >= M." (2) "Control C4 of this
    contract: T(M) = T_full exactly, before the declared overhead multiplier." (3)
    "The crossover closed form used to report metrics[5] must be the crossover OF THAT
    SAME LAW, i.e. it must solve log2 T(w*) + overhead_bits = log2 T_DG under it."
    READ THAT KEY YOURSELF RATHER THAN TRUSTING THIS QUOTATION, AND SAY THAT YOU DID.
  how_you_answer_them:
    invariant_1: >-
      Answer from the FORM of `log2_law` and `endpoint_behavior` AS THE RECORD STATES
      THEM. Does the record STATE monotonicity in w? Does it STATE the w >= M endpoint?
      In what words? You are reporting what a document says, not evaluating a function.
    invariant_2: >-
      Answer from the record's stated endpoint behaviour against the invariant AS
      WRITTEN. RT-6 IS THIS INVARIANT'S OBJECT AND IS RESERVED - see
      the_reserved_item_that_touches_you_directly.
    invariant_3: >-
      Answer as an IDENTITY-OF-FORM QUESTION. Does the record's `crossover` state a
      closed form DERIVED FROM the `log2_law` the same record states - one that solves
      log2 T(w*) + overhead_bits = log2 T_DG under THAT law? NO FIELD SIZE IS
      SUBSTITUTED. NO NUMBER IS EVALUATED. NO SIGN IS COMPUTED. NO MARGIN IS STATED.
      WHERE AN ANSWER WOULD REQUIRE A GOVERNED SIGN OR VALUE, THE CORRECT OUTPUT IS THE
      STATEMENT THAT IT WOULD, NEVER THE VALUE.
    an_unanswerable_invariant: >-
      AN INVARIANT YOU CANNOT ANSWER AT THE FORM LEVEL IS REPORTED `WANTED AND NOT
      ANSWERED`, WITH WHAT WOULD HAVE BEEN NEEDED. THAT IS CORRECT BEHAVIOUR AND NOT A
      SHORTFALL. Guessing, or evaluating something in order to settle it, is the
      failure.

