      handling: ESCALATED, NOT ABSORBED AND NOT RESOLVED HERE
      escalated_to: the Coordinator, via this receipt and the returned report
      why_not_resolved_here: >-
        RESOLVING IT WOULD MEAN DECIDING WHICH OF THE TWO IS AUTHORITATIVE FOR THIS
        ROUND'S PROVENANCE, WHICH IS NOT AN EXECUTOR'S CALL. I record both, name the
        divergence, and change nothing about my own model or reasoning level - an
        agent may request a stronger policy but may never silently alter either
        (AGENTS.md core rule 11).
      note_from_the_launching_prompt: >-
        MY LAUNCHING PROMPT TOLD ME, BEFORE I LOOKED, THAT THE SIBLING TASK HAD
        RECORDED A DIVERGENCE OF THIS SHAPE. I disclose that I was told, because being
        told what to expect is exactly the hazard this receipt exists to make visible.
        I ran the adapter resolution myself and report its verbatim output above.
      what_this_divergence_does_not_do: >-
        IT IS AN INFRASTRUCTURE AND CONFIGURATION OBSERVATION. IT IS NEVER NEGATIVE
        MATHEMATICAL EVIDENCE about the incorporated law, the contract, or any isogeny
        problem, and it is not a research finding.
