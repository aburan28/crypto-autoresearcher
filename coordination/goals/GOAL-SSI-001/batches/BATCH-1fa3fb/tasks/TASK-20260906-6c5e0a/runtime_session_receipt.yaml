        kind: instruction plus a statement about the campaign record
      - quote: >-
          NEVER EXECUTE cost_model.py (CF-10), with or without WESOVOW_RAW_PATH set.
          Do not execute the record's law by hand either.
        kind: absolute prohibition
    how_i_handled_being_told:
