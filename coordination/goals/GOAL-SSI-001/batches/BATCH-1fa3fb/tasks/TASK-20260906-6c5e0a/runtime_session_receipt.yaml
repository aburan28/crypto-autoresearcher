          that does not fit or silently dropping it.
        kind: instruction on how to handle an anticipated finding
      - quote: 'Do not relabel a run to get a green scan.'
        kind: prohibition
      - quote: >-
          An unclassifiable run is a STOP, and a STOP is a complete and acceptable
