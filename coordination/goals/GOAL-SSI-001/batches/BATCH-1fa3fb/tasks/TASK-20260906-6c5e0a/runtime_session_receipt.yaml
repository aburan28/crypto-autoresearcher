        I DID NOT TREAT ANY OF IT AS A RESULT. The control was run with the same
        unchanged procedure as the real key paths and its actual output is reported;
        the leak scan was run over my own artifacts and its actual classification
        outcome is reported, including the outcome the prompt anticipated, which I
