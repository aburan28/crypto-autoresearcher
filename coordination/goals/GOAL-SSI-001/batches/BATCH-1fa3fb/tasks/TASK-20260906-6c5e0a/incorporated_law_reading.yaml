    observation_on_consistency_with_clause_2s_characterisation:
      this_is_an_observation_and_not_a_ruling: true
      clause_2s_characterisation_quoted: 'committed, frozen, and already governs cost_model.py'
      limb_by_limb:
        committed:
          observation: >-
            SUPPORTED BY WHAT I CAN CHECK. The record is tracked and reachable in git
            history at commit 28d49206b, whose subject names the archiving task the
            record itself declares in `archived_by_task`.
        frozen:
          observation: >-
            SUPPORTED BY THE RECORD'S OWN WORDS. Its `status` string carries the word
            `frozen` as the second half of `prospective_and_frozen`.
        already_governs_cost_model_py:
          observation: >-
            NOT STATED BY THE RECORD IN THOSE TERMS, AND THE RECORD CARRIES NO FIELD
            THAT WOULD STATE IT. Three things I read bear on this and I record them
            as observations only. (i) The first half of the record's own status
