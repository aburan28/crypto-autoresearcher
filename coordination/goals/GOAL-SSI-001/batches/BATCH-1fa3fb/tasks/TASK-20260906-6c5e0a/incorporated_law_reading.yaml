  # ===================================================================
  part_c_the_three_invariants:
    standard_applied:
      source: coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/protocol_amendment_redraft.yaml
      key: amendment.proposed_replacement.clause_2.replacement_text_in_full
      subkey: invariants_that_any_incorporated_law_must_satisfy
      i_read_that_key_myself: >-
        YES. I loaded the redraft, descended to
        `amendment.proposed_replacement.clause_2.replacement_text_in_full` - which is
        a scalar block string containing an inner YAML-shaped body - and read the
        `invariants_that_any_incorporated_law_must_satisfy` list there in its own
        words, RATHER THAN TRUSTING THE QUOTATION ON MY TASK CARD. The card's
        quotation of all three invariants agrees verbatim with what that key says.
      redraft_status_as_i_read_it:
        status: draft
        in_force: false
        approved_by: null
        note: >-
          THE REDRAFT REMAINS A DRAFT, `in_force: false`, `approved_by: null`, IN
          EVERY SENTENCE OF THIS REPORT. EXP-WESOVOW-001 STAYS `approved` AND
          UNAMENDED AT VERSION 1. I perform no version transition and enact nothing.
    the_contracts_own_controls_read_in_their_own_words:
      source: experiments/EXP-WESOVOW-001/specification.yaml
      access: READ-ONLY, not modified
      C3_id: C3-monotonicity
      C3_description_quoted: >-
        T(w) must be non-increasing in memory budget w for every (p, overhead)
        scenario; T(w) must equal T_full for w >= M.
      C4_id: C4-vow-asymptote
      C4_description_quoted: >-
        At w = M, vOW time must equal T_full exactly (cap check).
      why_recorded: >-
        Two of the three invariants are stated as restatements of these controls, and
        the accuracy of one of those restatements is the object of RT-6, which is
        RESERVED and which I do not settle.

    invariant_1:
      invariant_as_written: >-
        Control C3 of this contract: T(w) non-increasing in w for every (p, overhead)
        scenario, and T(w) = T_full for w >= M.
      answered_as: A FORM QUESTION ABOUT WHAT THE RECORD STATES. Nothing was evaluated.
      does_the_record_state_monotonicity_in_w: >-
        YES, AND IN ITS OWN WORDS, at `amendment.required_controls.C3_monotonicity`:
        "Verify non-increasing corrected vOW time as w increases for every field size
        and overhead scenario through and beyond the cap."
      in_what_form_is_the_law_itself_stated:
        log2_law_quoted_verbatim: 'log2(T(w)) = log2(T_full) + 0.5*max(0, log2(M) - log2(w)) + overhead_bits'
        linear_law_quoted_verbatim: 'T(w) = T_full * sqrt(M / min(w, M))'
        form_observation: >-
          THE RECORD STATES A LAW WHOSE ONLY w-DEPENDENCE IS CARRIED BY A CLAMPED
          SHORTFALL TERM IN log2(M) - log2(w), AND IT STATES THE MONOTONICITY
          REQUIREMENT SEPARATELY AS A CONTROL TO BE VERIFIED. I report those two
          facts about the text. I DO NOT EVALUATE THE FUNCTION, substitute any field
          size, or assert that the stated law does or does not satisfy the stated
          control - that would be an evaluation and it is forbidden here.
      does_the_record_state_the_w_greater_equal_M_endpoint: >-
        YES, at `amendment.corrected_model.endpoint_behavior.w_above_M`, in these
        words: "T(w) = T_full before overhead; the high-memory cap is flat".
      a_form_level_difference_i_record_because_it_is_there:
        what: >-
          THE INVARIANT AS WRITTEN SAYS "T(w) = T_full for w >= M" WITH NO QUALIFIER.
          THE RECORD'S CORRESPONDING SENTENCE CARRIES THE QUALIFIER "before
          overhead". The record's law adds `overhead_bits` to log2(T(w)) at every w,
          including above the cap, so the record's endpoint sentence and the
          invariant's endpoint clause are not word-for-word the same statement.
        status: >-
          RECORDED AS AN OBSERVATION OF FORM. THIS IS THE MIRROR IMAGE OF RT-6 rather
          than RT-6 itself: RT-6 concerns an invariant carrying a qualifier its
          control does not, and this concerns a RECORD carrying a qualifier the
          invariant does not. I DO NOT RULE ON WHETHER EITHER QUALIFIER BELONGS. Any
          reconciliation of the two readings is RESERVED TO THE ENACTING DECISION.
      form_level_verdict: >-
        THE RECORD STATES BOTH LIMBS OF INVARIANT 1 IN ITS OWN WORDS - monotonicity as
        a required control, and the flat cap at and above M as an endpoint behaviour -
        WITH THE QUALIFIER DIFFERENCE NAMED ABOVE. Whether the stated law satisfies
        the invariant as a mathematical matter is NOT ANSWERED HERE AND WAS NOT
        ATTEMPTED; answering it would require evaluating the law.

    invariant_2:
      invariant_as_written: >-
        Control C4 of this contract: T(M) = T_full exactly, before the declared
        overhead multiplier.
      answered_as: >-
        A FORM QUESTION - the record's STATED endpoint behaviour against the invariant
        AS WRITTEN. Nothing was evaluated.
      the_records_stated_endpoint_behaviour_quoted_verbatim:
        w_equals_M: 'T(M) = T_full before overhead'
        w_equals_1: 'T(1) = T_full*sqrt(M) before overhead'
        w_above_M: 'T(w) = T_full before overhead; the high-memory cap is flat'
      a_second_place_the_record_states_the_same_endpoint: >-
        the FIRST entry of `amendment.required_controls.required_boundary_assertions` states: "At
        log2w=log2M, log2T(w) - overhead_bits equals log2T_full within numeric
        tolerance."
      match_against_the_invariant_as_written: >-
        THE RECORD'S `w_equals_M` SENTENCE MATCHES THE INVARIANT AS WRITTEN IN BOTH OF
        ITS PARTS: it states the endpoint identity T(M) = T_full, and it states it
        under the qualifier "before overhead", which is the same qualifier the
        invariant carries as "before the declared overhead multiplier".
      the_two_wording_differences_i_record_rather_than_resolve:
        - >-
          THE WORD "exactly" IS IN THE INVARIANT AND IS NOT IN THE RECORD'S
          `w_equals_M` SENTENCE. The record's second statement of the same endpoint,
          in the first of its required boundary assertions, instead says "within numeric
          tolerance". Whether "exactly" and "within numeric tolerance" are the same
          requirement is a question I do not answer.
        - >-
          THE INVARIANT SAYS "before the declared overhead multiplier"; THE RECORD
          SAYS "before overhead" and its law adds `overhead_bits` additively in the
          log2 domain. Whether "multiplier" and an additive log2-domain term name the
          same operation is a question about the invariant's wording and I do not
          answer it.
      RT_6_is_reserved_and_is_not_settled_here: >-
        RT-6 IS RESERVED TO THE ENACTING DECISION AND IS NOT SETTLED BY THIS REPORT.
        RT-6, at BATCH-79a0cb/reviews/TASK-20260905-6d5c9c/red_team_report.yaml
        finding RT-6, is that C4 is restated in clause_2's second invariant with the
        added qualifier "before the declared overhead multiplier", which is not in
        C4's own text - and I confirm, purely as a text fact I read myself, that the
        contract's C4 description reads "At w = M, vOW time must equal T_full exactly
        (cap check)" and contains no such qualifier. I REPORT ONLY WHETHER THE
        INCORPORATED RECORD'S STATED ENDPOINT BEHAVIOUR MATCHES THE INVARIANT AS THE
        INVARIANT IS WRITTEN, WHICH IT DOES. I DO NOT RULE, AND MAY NOT RULE, ON
        WHETHER THE QUALIFIER BELONGS IN THE INVARIANT. Nothing in this block is a
        recommendation, and nothing anywhere in this report is phrased as a ruling.
      form_level_verdict: >-
        THE RECORD STATES THE ENDPOINT THE INVARIANT AS WRITTEN REQUIRES, UNDER THE
        SAME "before overhead" QUALIFIER THE INVARIANT CARRIES, WITH THE TWO WORDING
        DIFFERENCES NAMED ABOVE LEFT OPEN.

    invariant_3:
      invariant_as_written: >-
        The crossover closed form used to report metrics[5] must be the crossover OF
        THAT SAME LAW, i.e. it must solve log2 T(w*) + overhead_bits = log2 T_DG under
        it.
      answered_as: >-
        AN IDENTITY-OF-FORM QUESTION. NO FIELD SIZE WAS SUBSTITUTED, NO NUMBER WAS
        EVALUATED, NO SIGN WAS COMPUTED AND NO MARGIN WAS STATED.
      what_the_record_states:
        crossover_baseline_quoted_verbatim: 'log2(T_DG)'
        crossover_equation_quoted_verbatim: 'log2(w_star) = log2(M) + 2*(log2(T_full) + overhead_bits - log2(T_DG))'
        crossover_feasible_condition_quoted_verbatim: 'log2(w_star) <= log2(M)'
        crossover_interpretation: >-
          PRESENT as a prose subkey. It carries no numeric entry, no field size and no
          table. ITS CONTENT IS NOT RESTATED HERE, because restating a conditional
          reading of a crossover is closer to the governed material than this report
          needs to go. Its existence and its non-numeric character are what I record.
        the_record_contains_no_numeric_table_anywhere:
          table_like_nodes: 0
          row_keyed_to_the_field_size_the_records_call_P_512_present: false
          note: >-
            THE ANTI-LEAK RULE FOR A NUMERIC TABLE DID NOT FIRE, BECAUSE THERE IS NO
            TABLE TO FIRE ON. The `crossover` key is four scalar strings, not a table
            and not a per-field-size value. No entry of anything is transcribed
            anywhere in this report.
      identity_of_form_reading_A_overhead_inside_the_law:
        premise: >-
          The record's `log2_law` already carries `overhead_bits` as an additive term
          INSIDE log2(T(w)). Under that reading the equation to solve is
          log2 T(w*) = log2 T_DG.
        finding: >-
          ON THE NON-FLAT BRANCH - the branch on which the clamped term is the
          positive one - SOLVING THAT EQUATION FOR log2(w_star) UNDER THE RECORD'S OWN
          `log2_law` YIELDS EXACTLY THE FORM THE RECORD'S `crossover.equation` STATES,
          TERM FOR TERM AND SIGN FOR SIGN AS A SYMBOLIC REARRANGEMENT. The
          rearrangement substitutes nothing and evaluates nothing.
        so_under_reading_A: >-
          THE RECORD'S CROSSOVER IS THE CROSSOVER OF THE SAME LAW THE SAME RECORD
          STATES. IDENTITY OF FORM HOLDS.
      identity_of_form_reading_B_the_invariants_equation_taken_literally:
        premise: >-
          The invariant as written adds `overhead_bits` OUTSIDE T, as
          `log2 T(w*) + overhead_bits = log2 T_DG`. Applied literally to the record's
          law, which already contains `overhead_bits` inside log2 T(w), the equation
          would carry that term TWICE.
        finding: >-
          UNDER THAT LITERAL READING THE SOLVED FORM WOULD CARRY THE OVERHEAD TERM
          TWICE, AND THE RECORD'S STATED `crossover.equation` CARRIES IT ONCE. THE TWO
          FORMS ARE THEREFORE NOT THE SAME FORM UNDER READING B.
        what_this_is_and_is_not: >-
          THIS IS A DIFFERENCE BETWEEN TWO READINGS OF THE INVARIANT'S OWN SENTENCE,
          NOT A DEFECT I ASSERT IN THE INCORPORATED RECORD, AND NOT AN ASSERTION THAT
          clause_2 IS WRONG. Which reading governs is a question about the text of a
          clause that is in a DRAFT redraft with `in_force: false` and
          `approved_by: null`. IT IS RESERVED. Asserting that either reading is the
          correct one would be a contradiction claim against a committed record and
          would need `review-breakthrough` at `max`, which IMP-1 records as
          unservable here; THE CLAIM STAYS UN-PROMOTED.
      the_feasibility_question_that_i_do_not_answer: >-
        THE RECORD STATES A FEASIBLE CONDITION ON log2(w_star) AGAINST log2(M).
        ANSWERING WHETHER IT IS MET WOULD REQUIRE SUBSTITUTING A FIELD SIZE AND
        EVALUATING A GOVERNED QUANTITY, AND THE CORRECT OUTPUT IS THIS STATEMENT
        RATHER THAN THE VALUE. NO VALUE, SIGN, MARGIN, ORDERING OR COMPARISON IS
        PRODUCED HERE. The same refusal covers RT-2's antecedent that `A` be POSITIVE, which is
        the per-row baseline-comparison sign the retained sentence governs: I did not
        check that antecedent at any declared field size, and two independent sessions
        reaching this point in BATCH-314308 output the statement instead of the value,
        as I do.
      a_form_level_fact_about_the_pointer_i_record_because_it_is_there: >-
        THE INVARIANT SPEAKS OF "the crossover closed form used to report metrics[5]".
        THE INCORPORATED RECORD CONTAINS NO OCCURRENCE OF THE TOKEN `metrics` AT ALL -
        zero occurrences in its raw bytes. The linkage between the record's crossover
        key and the contract's metrics list is asserted by clause_2, not by the
        incorporated record. RECORDED AS AN OBSERVATION OF FORM; it settles nothing
        and I make no recommendation from it.
      form_level_verdict: >-
        IDENTITY OF FORM HOLDS UNDER READING A AND DOES NOT HOLD UNDER READING B, AND
        WHICH READING GOVERNS IS RESERVED. To the extent the invariant is asking
        whether the record's crossover was DERIVED FROM the record's own log2_law
        rather than from some other law, the answer at the level of form is YES.

    an_unanswerable_invariant_check:
      any_invariant_marked_WANTED_AND_NOT_ANSWERED: false
      note: >-
        ALL THREE WERE ANSWERABLE AT THE LEVEL OF FORM WITHOUT EVALUATING ANYTHING, SO
        NONE IS MARKED `WANTED AND NOT ANSWERED`. What is deliberately NOT answered,
        and is named as such above, is the mathematical question inside each invariant
        - whether the stated law is in fact monotone, whether the endpoint holds
        numerically, and whether the feasible condition is met - because each would
        require an evaluation this task forbids. I did not guess and I did not
        evaluate anything to settle any of them. THIS TASK RAN AT `medium`, ITS ROLE'S
        POLICY EFFORT, AND I DID NOT FIND THE FORM-LEVEL JUDGEMENT IN INVARIANT 3 TO
        EXCEED IT; the two-reading structure above is the honest shape of the answer
        rather than a hedge, and the reviewer checks it at `xhigh`.

  # ===================================================================
  OBJ_A_the_known_absent_key_path_control:
    what_it_is: >-
      THE EXISTENCE PROCEDURE OF PART (a), APPLIED UNCHANGED - same script, same
      descent, same __ABSENT__ sentinel, same independent raw-text search - to three
      probe key paths in the SAME record.
    what_the_procedure_actually_did:
      - key_path: amendment.corrected_model.log_two_law_restated
        verdict: ABSENT
        parse: returned the __ABSENT__ sentinel at the final segment
        search: zero occurrences of the token in the raw bytes
      - key_path: amendment.corrected_model.sign_convention
        verdict: ABSENT
        parse: returned the __ABSENT__ sentinel at the final segment
        search: zero occurrences of the token in the raw bytes
      - key_path: amendment.corrected_model.invariants
        verdict: ABSENT
        parse: returned the __ABSENT__ sentinel at the final segment
        search: zero occurrences of the token in the raw bytes
    control_outcome: >-
      ALL THREE PROBES CAME OUT ABSENT. THE CONTROL IS CLEAN AND NO BREAK IS REPORTED.
      No probe genuinely exists, so the inconclusive branch did not arise for any of
      them.
    why_this_is_not_a_check_whose_pass_is_entailed_by_its_construction: >-
      THE PROCEDURE DISCRIMINATED IN BOTH DIRECTIONS ON THIS RECORD IN THIS RUN. It
      returned PRESENT on the three real key paths and ABSENT on the three probes, and
      the SAME procedure independently returned ABSENT on `in_force` - a field my task
      card, my handoff and my launching prompt all spoke of as though it existed.
      THAT LAST OUTCOME IS THE STRONGEST EVIDENCE AVAILABLE THAT THE READING IS NOT
      ENTAILED BY ITS OWN CONSTRUCTION: the control plane's own phrasing presupposed a
      status/in_force pair and the record carries only one of them.
    a_construction_hazard_i_report_rather_than_hide: >-
      MY LAUNCHING PROMPT AND MY TASK CARD BOTH TOLD ME THE PROBES "MUST COME OUT
      ABSENT" BEFORE I RAN THEM. That is an expectation supplied to me in advance and
      it is disclosed here and in my receipt. What defends the result is not my
      compliance with it but that the same unchanged procedure returned PRESENT on
      three paths and ABSENT on four, and that the raw-text search is independent of
      the parse.

  # ===================================================================
  is_this_reading_entailed_by_its_own_construction_its_prompt_or_the_campaign_record:
    explicit_answer: >-
      NO, NOT WHOLLY - AND THE PLACES WHERE IT COULD HAVE BEEN ARE NAMED. The
      construction supplied three expectations: that the three named key paths exist,
      that the three probes do not, and that the record has a `status` and an
      `in_force` field. TWO OF THOSE HELD AND ONE DID NOT: there is no `in_force`
      field anywhere in the record. A reading entailed by its construction could not
