  # ===================================================================
  part_a_existence_of_the_three_key_paths:
    method: >-
      RESOLVED BY BOTH PARSE AND SEARCH, and the two agree on every path. PARSE:
      yaml.safe_load, then a walk that descends the exact named segments in order and
      reports the sentinel __ABSENT__ the moment a segment is missing from a mapping.
      SEARCH: an independent regex pass over the raw bytes counting occurrences of
      each key token and reporting the line numbers where it occurs. The parse
      procedure is the SAME procedure applied unchanged to the OBJ-A probes below.
    results:
      - key_path: amendment.corrected_model.log2_law
        verdict: PRESENT
        at_exactly_that_path_under_exactly_that_parent: true
        resolved_by: parse and search
        parse: descends amendment -> corrected_model -> log2_law; value is a scalar string
