          four occurrences of the token `crossover` in the raw text, at lines 22, 61,
          68 and 69; the occurrence at line 61 is the key itself and the others are
          prose and subkey text. No occurrence resolves to a second key at a
          different path.
        found_at_any_other_path: false
    summary: >-
      ALL THREE KEY PATHS THAT clause_2's `incorporated_by_reference.keys` NAMES EXIST
      AT EXACTLY THOSE PATHS UNDER EXACTLY THAT PARENT. No key was found at a
      different path than clause_2 names, so the both-paths finding rule did not fire.
    what_this_does_and_does_not_settle: >-
      It settles that the pointer RESOLVES to existing keys. It settles nothing about
      enactment, and it is not a ruling on AF-3, which stays RESERVED.

