    - >-
      DO NOT EXECUTE experiments/EXP-WESOVOW-001/cost_model.py EVER, with or without
      WESOVOW_RAW_PATH set (CF-10). IT IS DELIBERATELY ABSENT FROM YOUR READ SCOPE - no joint
