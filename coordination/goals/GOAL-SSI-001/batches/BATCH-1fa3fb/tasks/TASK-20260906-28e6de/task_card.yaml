    - Change no status, write no ledger record, approve nothing, enact nothing, commit nothing, perform no version transition, and make no security, SQIsign, CSIDH, standardized-parameter, exponent or asymptotic claim in either direction.
    - Never select a provider, backend, endpoint, or model identifier containing Bedrock, case-insensitively.

