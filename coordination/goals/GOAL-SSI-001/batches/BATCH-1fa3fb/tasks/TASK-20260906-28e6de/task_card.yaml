# THE INDEPENDENT REVIEW OF ALL THREE PRECONDITION PACKAGES OF BATCH-1fa3fb.
#
# A WRONG CONFIRMATION IS WORSE THAN NO CONFIRMATION. The enacting batch is supposed
# to open against a CHECKABLE precondition set; a false element in that set is the
# one failure mode a precondition set exists to prevent. That is why all three
# producers carry `review_required: true` and why you exist.
#
# TWO THINGS ABOUT YOUR SCOPE THAT ARE UNUSUAL AND DELIBERATE.
# (1) AT J1 AND J2 YOU ARE FORBIDDEN TO ATTACK THE MERITS OF THE RT-4 RULING. You
#     check its SCOPE and its ANCHORING only. The merits attack belongs to the
#     enacting batch's producer, which P-1 exists to arm; spending it here - same
#     session, same model family, blindness lifted - would buy correlated agreement
#     and blunt the later attack. If you have a merits objection, RECORD ONLY THAT
#     YOU HAVE ONE AND WITHHELD IT.
# (2) YOU HAVE BOTH GOVERNED OBJECTS IN YOUR READ SCOPE, because J3 and J4 require
#     you to check both readings at their own files. THE CONTAINMENT SEPARATION DOES
#     NOT PROTECT YOU AND YOU ARE UNDER THE ANTI-LEAK RULE DIRECTLY.
#
# WHERE THIS CARD AND dispatch_queue.json OVERLAP, THE QUEUE'S handoff BLOCK GOVERNS.
