  joints_owned:
    - J1 whether the RT-4 licensing ruling settles RT-4's licensing question AND ONLY THAT
    - J2 whether every operative proposition of the ruling is anchored in committed bytes at a named key path, and whether the ruling states what would have changed it
    - J3 whether the incorporated-law reading reports what the BATCH-2e6130 record actually says, checked by you at the file itself
    - J4 whether the locator confirmation confirms the locator WITHOUT restating the governed value
