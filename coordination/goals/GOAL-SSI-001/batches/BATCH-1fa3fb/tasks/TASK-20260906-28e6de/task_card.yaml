  # =====================================================================
  the_anti_leak_rule_binds_you_too: >-
    YOU WILL OPEN inputs/P13-WESOLOWSKI-2026/paper_fulltext.md LINES 234-238 YOURSELF AT
    J4, AND LINES 1-5 FOR OBJ-B. THAT BLOCK IS A PER-FIELD-SIZE TABLE WITH A ROW KEYED TO
    THE FIELD SIZE THE RECORDS CALL P=512, CARRYING AN OPERATIONS COUNT AND A MEMORY
    BOUND, AND THIS BATCH TREATS ITS NUMERIC CONTENT AS GOVERNED. NOTHING YOU READ THERE
    MAY APPEAR IN validation_report.yaml, IN independent_precondition_check.md, IN YOUR
    RECEIPT, OR IN YOUR RETURN MESSAGE - not transcribed, paraphrased, rounded, ordered,
    bucketed, ranged, compared or unit-converted; no operations count, no memory bound, no
    exponent, no ratio, no statement of which row is largest, no comparison between rows,
    and no digit from the block other than the line numbers themselves and the counts S3
    and S5 require. NAMING THE FIELD SIZE 512 IS PERMITTED ONLY as the published locator
    label and NEVER adjacent to anything read out of the block. RUN THE DIGIT SCAN OVER
    YOUR OWN THREE ARTIFACTS AND SAY THAT YOU DID. Obtain digests and counts with commands
    that PRINT ONLY THE DIGEST OR THE COUNT.

  how_to_run_each_joint:
    J1: >-
      DO THIS ONE FIRST, BECAUSE AN OVER-REACHING RULING CORRUPTS THE PRECONDITION SET THE
      ENACTING BATCH IS SUPPOSED TO OPEN AGAINST, WHICH IS WORSE THAN NO RULING AT ALL. GO
      ITEM BY ITEM AND SAY SETTLED, NOT SETTLED or OVER-REACHED, quoting the ruling's own
      words, for each of: RT-4's licensing question itself; AF-4's interval ruling; F-J2-1's
      naming of clause_4's licence and foreclosure among the effects enacted; CF-10's
      placement and its `travels with` authority limb; F-2, F-3 and CF-22; RT-6, RT-9(a) and
      RT-12; AF-1, AF-2 and AF-3; the standing citation prohibition and any ruling on how an
      enacted clause_4 foreclosure would interact with it; and approval, enactment or
      scheduling of anything. THEN CHECK THE CONVERSE, WHICH IS THE HALF PEOPLE SKIP - does
      the ruling settle LESS than RT-4's licensing question? A ruling that carries the
      question forward, or that rules only that the question is hard, has produced NO OBJECT
      FOR THE ENACTING PRODUCER TO ATTACK, and P-1 IS NOT SATISFIED BY IT.
    J1_the_merits_prohibition: >-
      YOU ARE FORBIDDEN TO ATTACK WHETHER THE RULING IS RIGHT. Do not argue the merits, do
      not state which way you would have ruled, do not record a preference, do not hint. IF
      YOU FIND YOURSELF WITH A MERITS OBJECTION, RECORD ONLY THAT YOU HAVE ONE AND THAT YOU
      WITHHELD IT - so the enacting batch's producer knows a first reader had one WITHOUT
      BEING TOLD WHAT IT WAS. That asymmetry is deliberate; its reason and its cost are at
      batch.yaml p1_placement_ruling.
    J2: >-
      OPEN EVERY KEY PATH YOURSELF AND READ THE BYTES - never through the ruling's
      quotations. Per operative proposition: does the artifact carry the quoted words after
      whitespace normalisation; does the proposition FOLLOW from those words, or only if
      some further decision is also taken; and is it about what the TEXT does or about what
      a party would in practice have to do. The key paths it will rest on are
      `proposed_replacement.clause_4.replacement_text_in_full` keys `licensing`,
      `licensing_provisos_are_operative`, `fuller_statement` and
      `relation_to_the_standing_citation_prohibition` in the committed redraft; RT-4 and its
      fuller statement at r4.c.finding_RT_4 in the BATCH-79a0cb report; and the BATCH-752ef2
      licensing analysis. A PROPOSITION WHOSE KEY PATH DOES NOT CARRY THE QUOTED WORDS IS A
      BREAK. THEN RUN OBJ-D: OPEN THE COUNTERFACTUAL ARTIFACT THE RULING NAMES and ask
      whether a different reading of it really would have forced the other position. NO
      COUNTERFACTUAL NAMED, OR ONE THAT DOES NOT BEAR, IS A BREAK - the ruling restated
      rather than ruled.
    J3: >-
      OPEN
      coordination/goals/GOAL-SSI-001/batches/BATCH-2e6130/tasks/TASK-20260809-ef3e58/protocol_amendment.yaml
      YOURSELF AND ANSWER INDEPENDENTLY BEFORE COMPARING. (a) Do
      `amendment.corrected_model.log2_law`, `.endpoint_behavior` and `.crossover` exist, at
      exactly those key paths under exactly that parent? Report per key path and say how you
      resolved it. Then run OBJ-A on the three probe key paths
      `amendment.corrected_model.log_two_law_restated`, `.sign_convention` and `.invariants`
      - a probe reported PRESENT BY THE PROCEDURE is a BREAK; a probe that GENUINELY EXISTS
      is a fact about the record, reported as one, with the control inconclusive for it. (b)
      Read that record's own `status` and `in_force`, quote them, report absence as absence,
      and state SEPARATELY AND AS AN OBSERVATION whether what you read is consistent with
      clause_2's characterisation of it as `committed, frozen, and already governs
      cost_model.py`. YOU MAY NOT CONCLUDE clause_2 IS WRONG - that needs a tier this
      environment cannot serve; leave it UN-PROMOTED. (c) Check that the three invariants
      were answered AS FORM QUESTIONS. IF THE READING EVALUATED ANYTHING AT A FIELD SIZE,
      THAT IS BOTH A BREAK AND A CITATION-PROHIBITION EVENT. (d) CHECK SPECIFICALLY THAT THE
      READING DID NOT SETTLE RT-6, whose object is invariant 2, and did not phrase a
      recommendation as a ruling. NOR MAY YOU SETTLE IT.
    J4: >-
      TWO HALVES THAT PULL IN OPPOSITE DIRECTIONS. YOU MUST DO BOTH. HALF ONE - IS THE
      CONFIRMATION REAL? Open paper_fulltext.md yourself, READ-ONLY, and independently
      establish the file's existence, its total line count, that lines 234-238 exist and are
      non-empty, and your own answers to S1 through S7. RECOMPUTE THE BLOCK DIGEST AND THE
      WHOLE-FILE DIGEST with commands that emit ONLY the digest and compare them with what
      locator_confirmation.yaml recorded; A DIGEST MISMATCH IS A STOP, NOT A NOTE, AND IS
      NEVER REPAIRED BY RE-HASHING. Run OBJ-B on lines 1-5 - S2 MUST come out FALSE - and
      OBJ-C on a past-end-of-file range - it MUST return DOES NOT RESOLVE. HALF TWO - DID IT
      LEAK? Re-run the digit scan yourself over ALL P-3 and P-2 artifacts, classifying every
      digit run into the closed list; exercise your scan on `SYNTHETIC-LEAK-PROBE 1234.5678`
      written OUTSIDE the repository (OBJ-E) and CONFIRM IT FIRES. AND CHECK THE SUBTLER
      LEAKS A SCAN CANNOT SEE: a value described in words, an ordering or comparison between
      rows, a range or bucket, a unit conversion, and any sentence placing the label 512 next
      to something read out of the block.
    J4_the_reservation: >-
      RT-9(a) - WHETHER THE PRECONDITION EXTENDS TO THE CHARACTERIZATION - IS RESERVED. Check
      that the S6 observation carries its MANDATORY SCOPE SENTENCE and that it is not
      written, or citable, as discharging any extension or as making the reserved question
      moot. NOR MAY YOU SETTLE IT.
    J5: >-
      THE CAMPAIGN'S RECURRING FAILURE, ASKED DIRECTLY, AND A BATCH OF CONFIRMATIONS IS THE
      SHAPE MOST EXPOSED TO IT. FOR EACH PACKAGE ANSWER IN WRITING: would this artifact look
      the same if the object it describes were different? Four named sources of entailment
      per package - the ASSIGNMENT, the PROMPT, the CAMPAIGN RECORD, and AN INSTRUMENT THAT
      CANNOT FAIL. THE ORDERING IS ATTESTED AND BINDING AND IS NOT A BLIND PHASE - nothing is
      forbidden to you at any time: PRODUCE YOUR OWN OBJ-A, OBJ-B, OBJ-C AND OBJ-E RESULTS
      BEFORE OPENING THE PRODUCERS' OWN CONTROL SECTIONS, record them in
      independent_precondition_check.md, THEN open theirs and say where yours differ. RECORD
      THAT YOU DID IT IN THAT ORDER, OR RECORD HONESTLY THAT YOU DID NOT. Report OBJ-D's
      result here too, because the P-1 ruling has no other control. FINALLY, CHECK THE
      CONTAINMENT SEPARATION MECHANICALLY: read TASK-20260906-6c5e0a's declared
      `sources_read` and confirm it contains NOTHING under inputs/; read
      TASK-20260906-decbd5's and confirm it contains NEITHER BATCH-2e6130 NOR cost_model.py
      NOR BATCH-256a94's anchor_reconciliation.json. A BREACH IS A FINDING ABOUT THIS BATCH'S
      ONLY STRUCTURAL PROTECTION. SAY PLAINLY THAT THIS IS A REVIEWER JOINT AND NOT A TOOL
      RESULT, AND IS WEAKER THAN A MECHANICAL `blind_from` COMPARISON.

