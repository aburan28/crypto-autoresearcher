  blind_rederivation:
    required: false
    why_not_required: >-
      A DELIBERATE `false`, WITH ITS REASON, AND THE REASON IS THAT THE FIELD DESCRIBES
      SOMETHING THIS BATCH DOES NOT HAVE. `blind_rederivation` names an agent RE-DERIVING A
      QUANTITY ANOTHER AGENT PRODUCED while blind from that agent's implementation - the
      tool's own words are "name the producer's implementation, notes and report" - and
      `assigned_to` must name an agent that FILES a review_attestation whose declared
      `sources_read` is then compared with `blind_from`. NO AGENT HERE RE-DERIVES ANOTHER
      AGENT'S OUTPUT. The only candidate is the reviewer, which does re-derive the P-3
      digest and the seven predicates - but it MUST READ every producer artifact because
      they are its object, so any `blind_from` naming them would collide with an honest
      `sources_read` or force joints to be skipped. THAT IS THE SAME MECHANICAL COLLISION
      BATCH-314308 RECORDED.
      AND A SECOND REASON, WHICH IS THE MORE IMPORTANT ONE. THIS BATCH DOES HAVE A REAL
      FILE-LEVEL SEPARATION - the containment between the P-2 and P-3 readers - AND
      DECLARING IT HERE PURELY TO OBTAIN THE MECHANICAL sources_read CHECK WOULD REQUIRE
      PUTTING A FALSE DESCRIPTION IN `quantity`, since nothing is re-derived. A false
      description in a field a tool reads, so the tool returns green, is one notch from the
      mislabelled-control defect this campaign has now found six times. THE CHECK IS REAL;
      THIS IS THE WRONG FIELD FOR IT, and it is taken at J5 instead.
    what_replaces_it_and_all_of_it_is_weaker: >-
      THREE THINGS, EACH DECLARED AS WEAKER RATHER THAN DESCRIBED AS EQUIVALENT. (i) THE
      READ_SCOPE CONTAINMENT, armed in dispatch_queue.json and checked at J5 by a reviewer
      reading declared `sources_read` - a reviewer joint, not a tool result. (ii) THE
      ATTESTED ORDERING at J5 - the reviewer's own control results before the producers'.
      (iii) THE PROHIBITION ON SPEAKING ACROSS THE SEPARATION AT LAUNCH, which is closed by
      no tool at all and rests on the dispatching session's own disclosure.
    quantity_if_it_were_required: >-
