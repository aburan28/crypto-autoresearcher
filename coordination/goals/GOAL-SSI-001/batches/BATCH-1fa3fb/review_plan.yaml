# objects and its prohibitions from its own task card and from the queue's handoff
# block. THE COST: the control-object list exists in two places and two copies can
# disagree. IF THEY EVER DIFFER, THIS FILE GOVERNS, and the reviewer reports the
# divergence as a defect of the control plane rather than of a producer.
#
# THIS BATCH HAS NO BLIND PHASE. `blind_rederivation.required` is deliberately FALSE
# below with its reason, and `--blind-history` is NOT APPLICABLE and must not be run.
