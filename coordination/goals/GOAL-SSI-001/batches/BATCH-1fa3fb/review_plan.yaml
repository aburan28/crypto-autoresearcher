# THIS FILE IS OUTSIDE ALL THREE PRODUCERS' READ SCOPES, DELIBERATELY. The
# coordinator_prior below is an expectation about what the readings will return, and
# handing it to an agent that is about to look is the CF-15 channel with extra steps.
