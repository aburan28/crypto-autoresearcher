#       coordination/goals/GOAL-SSI-001/batches/BATCH-1fa3fb
# resolves exactly one plan and `--plan` names this file directly. No task card of
# this batch carries a `review_plan` mapping; each carries a `review_plan_ref`
# STRING, which the tool's plan resolver ignores. That is CF-11's first limb,
# discharged by construction here and DEMONSTRATED only if the dispatching session
# actually runs the checker.
