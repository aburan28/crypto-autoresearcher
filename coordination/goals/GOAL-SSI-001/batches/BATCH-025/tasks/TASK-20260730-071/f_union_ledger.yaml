f_union_ledger:
  task_id: TASK-20260730-071
  goal_id: GOAL-SSI-001
  batch_id: BATCH-025
  idea_id: IDEA-20260729-001
  decision_ref: DEC-20260730-022
  evidence_ref: EV-SSI-024
  role: executor
  convention: CSIDH-COLLIMATION-FC0-R2
  recorded_at: '2026-07-31T20:33:48Z'
  git_revision_at_execution: 490d61c60dda8bd4d24ecdb2e9ccbe687d8d7ed9
  launch_tip: 490d61c60dda8bd4d24ecdb2e9ccbe687d8d7ed9
  maximum_runs: 1
  runs_attempted: 1
  curve_isogeny_quantum_circuit_compute: false

  package_id: FC0-EXT-PKG-SSI-001
  package_ref: >-
    coordination/goals/GOAL-SSI-001/batches/BATCH-021/tasks/TASK-20260730-055/fc0_extension_package.yaml
  batch022_scaffold_ref: >-
    coordination/goals/GOAL-SSI-001/batches/BATCH-022/tasks/TASK-20260730-059/
  batch022_scaffold_modified: false
  batch023_composition_ref: >-
    coordination/goals/GOAL-SSI-001/batches/BATCH-023/tasks/TASK-20260730-063/f_star_composition.yaml
  batch024_path_justification_ref: >-
    coordination/goals/GOAL-SSI-001/batches/BATCH-024/tasks/TASK-20260730-067/path_justified_inclusions.yaml
  batch024_f_sim_ref: >-
    coordination/goals/GOAL-SSI-001/batches/BATCH-024/tasks/TASK-20260730-067/f_sim_treatment.yaml
  recovery_spec_ref: >-
    coordination/goals/GOAL-SSI-001/batches/BATCH-013/tasks/TASK-20260730-017/recovery_spec.md

  common_event_F_definition: >-
    F = { the procedure fails to return a k' with Verify(x,k')=true within its
    declared stopping policy }. Success requires a true Verify result; a
    report-only completion, unverified candidate, or exhausted residual search
    is a failure constituent, not success (recovery_spec).

  method: >-
    Assemble BATCH-024 path-justified F_* constituents into an explicit
    symbolic union ledger U = ⋃ F_* with checkable membership rules and a
    Verify=true success exit. Advance beyond per-channel path justification
    to a named union membership ledger without inventing probabilities,
    numeric error bounds, security bits, or τ. Zero curve/isogeny/
    quantum-circuit computation.

  harness_entrypoint: python3 -m composition_ledger_harness.run_harness
  harness_receipt: composition_ledger_harness/harness_receipt.json

  prior_batch024_status: >-
    All seven constituents path_justified_on_scaffold;
    composition_status=path_justified_partial; F_sim maps_to_F=false.

  symbolic_union:
    expression: >-
      U = F_input ∪ F_oracle ∪ F_cleanup ∪ F_stop ∪ F_recovery ∪ F_tail ∪ F_verify
    inclusion_into_common_F: U ⊆ F
    full_expression: >-
      F_input ∪ F_oracle ∪ F_cleanup ∪ F_stop ∪ F_recovery ∪ F_tail ∪ F_verify
      ⊆ F
    members:
      - F_input
      - F_oracle
      - F_cleanup
      - F_stop
      - F_recovery
      - F_tail
      - F_verify
    status: f_union_ledger_partial
    justification_scope: scaffold_path_justified_prior_batch024
    probability_composition: false
    crypto_verify_body: false

  membership_rules:
    - id: R1_named_constituent_in_union
      statement: >-
        Each path-justified F_* is a member of the symbolic union U.
      predicate: constituent_id ∈ U
    - id: R2_union_subseteq_common_F
      statement: >-
        U ⊆ F under the recovery_spec common-event definition.
      predicate: U ⊆ F
    - id: R3_success_exit_verify_true
      statement: >-
        Success exit requires Verify(x,k')=true. Report-only, unverified
        candidate, or exhausted residual search is a failure constituent of F,
        not success.
      predicate: exit_kind == success ⇔ verify_true_returned == true
      verify_crypto_required: false
    - id: R4_channel_fire_without_verify_true_in_F
      statement: >-
        If a named F_* channel fires and no Verify=true k' is returned under
        the declared symbolic stopping policy, the exit is a member of
        common F.
      predicate: >-
        channel ∈ CONSTITUENTS ∧ ¬verify_true_returned ⇒ classified_as_common_F
    - id: R5_f_sim_not_in_union_map
      statement: >-
        F_sim is not a recovery_spec union constituent and has no
        implementation-derived implication into F (maps_to_F=false).
      predicate: F_sim ∉ U ∧ maps_to_F(F_sim)=false
      maps_to_F: false

  success_exit:
    kind: success
    requires: Verify_true
    verify_true_returned: true
    classified_as_common_F: false
    crypto_body: false
    note: >-
      Contrasting success criterion retained from recovery_spec / BATCH-024
      no-crypto scaffold control. Not a cryptographic Verify body and not
      CollimationSieve.

  constituents:
    - id: F_input
      recovery_spec_role: parse_or_parameter_failure
      member_of_symbolic_union: true
      subseteq_common_F: true
      prior_batch024_status: path_justified_on_scaffold
      probability_assigned: false
      membership_rule_refs: [R1_named_constituent_in_union, R2_union_subseteq_common_F, R4_channel_fire_without_verify_true_in_F]
    - id: F_oracle
      recovery_spec_role: oracle_or_label_approximation_or_implementation_failure
      member_of_symbolic_union: true
      subseteq_common_F: true
      prior_batch024_status: path_justified_on_scaffold
      probability_assigned: false
      membership_rule_refs: [R1_named_constituent_in_union, R2_union_subseteq_common_F, R4_channel_fire_without_verify_true_in_F]
    - id: F_cleanup
      recovery_spec_role: retry_or_handoff_cleanup_failure
      member_of_symbolic_union: true
      subseteq_common_F: true
      prior_batch024_status: path_justified_on_scaffold
      probability_assigned: false
      membership_rule_refs: [R1_named_constituent_in_union, R2_union_subseteq_common_F, R4_channel_fire_without_verify_true_in_F]
    - id: F_stop
      recovery_spec_role: stopping_policy_breach
      member_of_symbolic_union: true
      subseteq_common_F: true
      prior_batch024_status: path_justified_on_scaffold
      probability_assigned: false
      tau_invented: false
      qm_stopping_cleared: false
      membership_rule_refs: [R1_named_constituent_in_union, R2_union_subseteq_common_F, R4_channel_fire_without_verify_true_in_F]
      note: >-
        Symbolic union membership of F_stop is not QM-STOPPING clearance; no
        Verify-relative τ or jointly finite ΣQ/ΣS/ΣP/ΣC(+H).
    - id: F_recovery
      recovery_spec_role: algebraic_or_reconstruction_error
      member_of_symbolic_union: true
      subseteq_common_F: true
      prior_batch024_status: path_justified_on_scaffold
      probability_assigned: false
      membership_rule_refs: [R1_named_constituent_in_union, R2_union_subseteq_common_F, R4_channel_fire_without_verify_true_in_F]
    - id: F_tail
      recovery_spec_role: tail_exhaustion_timeout_or_omitted_residual_branch
      member_of_symbolic_union: true
      subseteq_common_F: true
      prior_batch024_status: path_justified_on_scaffold
      probability_assigned: false
      numeric_width_invented: false
      membership_rule_refs: [R1_named_constituent_in_union, R2_union_subseteq_common_F, R4_channel_fire_without_verify_true_in_F]
    - id: F_verify
      recovery_spec_role: false_Verify_result_or_verification_fault
      member_of_symbolic_union: true
      subseteq_common_F: true
      prior_batch024_status: path_justified_on_scaffold
      probability_assigned: false
      crypto_body: false
      membership_rule_refs: [R1_named_constituent_in_union, R2_union_subseteq_common_F, R4_channel_fire_without_verify_true_in_F]

  f_sim_honesty:
    definition_ref: BATCH-012 process_extraction / recovery_spec / BATCH-024 f_sim_treatment
    definition: >-
      F_sim = { the invocation does not emit its complete declared simulator
      report for the supplied arguments }.
    member_of_symbolic_union: false
    maps_to_F: false
    map_status: no_implementation_derived_implication
    illicit_F_sim_to_F_map_refused: true
    query_memory_cleared_by_f_sim: false
    retained_from_batch024: true
    note: >-
      F_sim honesty retained: maps_to_F=false. Report-only completion remains
      a failure relative to Verify under recovery_spec without being an
      F_sim→F implication and without clearing QUERY_MEMORY.

  non_claims:
    - no_probabilities
    - no_numeric_error_bounds
    - no_security_bits
    - no_tau_or_joint_finiteness
    - no_query_memory_clearance
    - no_qm_error_clearance
    - no_qm_stopping_clearance
    - no_crypto_verify_body
    - no_collimationsieve_api_invention
    - no_probability_composed_union_inclusion
    - not_pin_complete

  dependency_assumptions_identified:
    - scaffold_no_crypto_Verify_token_semantics
    - symbolic_stopping_policy_halt_without_verify_true
    - batch024_path_justified_on_scaffold_prior
    - overlaps_among_F_star_permitted_without_independence_claim

  collimation_sieve_negative_control:
    name: CollimationSieve
    commit: 6f9188e4eb5611bcfdf29a3e1ec3cd69a29a50e9
    status: host_gap_certified_retained_untouched
    apis_invented: false

  summary:
    composition_status: f_union_ledger_partial
    all_constituents_in_symbolic_union: true
    success_exit_verify_true: true
    f_sim_maps_to_F: false
    verify_crypto_implemented: false
    tau_invented: false
    probabilities_invented: false
    qm_error_cleared: false
    qm_stopping_cleared: false
    query_memory_cleared: false
    honesty_note: >-
      Advances BATCH-024 path_justified_partial to an explicit symbolic
      F-union membership ledger (f_union_ledger_partial) over the seven
      path-justified constituents with Verify=true success exit and retained
      F_sim maps_to_F=false. Still partial: no probability composition, no
      crypto Verify, no CollimationSieve end-to-end. Not QM-ERROR or
      QUERY_MEMORY clearance.
