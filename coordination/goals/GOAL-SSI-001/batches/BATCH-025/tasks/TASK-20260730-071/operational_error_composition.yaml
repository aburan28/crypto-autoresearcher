    composition_structure_ok: true
    probabilities_invented: false
    numeric_error_bounds_invented: false
    security_bits_invented: false
    tau_invented: false
    query_memory_cleared: false
    qm_stopping_cleared: false
    honesty_note: >-
      Operational-error composition is recorded as symbolic set-union under
      common-event F with an explicit checklist. No invented probabilities,
