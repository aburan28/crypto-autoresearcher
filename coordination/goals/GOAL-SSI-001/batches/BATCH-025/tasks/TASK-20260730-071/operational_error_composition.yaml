  recorded_at: '2026-07-31T20:33:48Z'
  git_revision_at_execution: 490d61c60dda8bd4d24ecdb2e9ccbe687d8d7ed9
  launch_tip: 490d61c60dda8bd4d24ecdb2e9ccbe687d8d7ed9
  maximum_runs: 1
  runs_attempted: 1
  curve_isogeny_quantum_circuit_compute: false

  package_id: FC0-EXT-PKG-SSI-001
  f_union_ledger_ref: f_union_ledger.yaml
  recovery_spec_ref: >-
    coordination/goals/GOAL-SSI-001/batches/BATCH-013/tasks/TASK-20260730-017/recovery_spec.md
  batch024_path_justification_ref: >-
    coordination/goals/GOAL-SSI-001/batches/BATCH-024/tasks/TASK-20260730-067/path_justified_inclusions.yaml

  composition_kind: symbolic_set_union_under_common_event_F
  not_composition_kind:
    - probability_sum
    - probability_union_bound_with_numeric_epsilons
    - security_bit_reduction
    - independent_Bernoulli_product

  common_event_F: >-
    F = { the procedure fails to return a k' with Verify(x,k')=true within its
    declared stopping policy }

  operational_failure_rule: >-
    An exit is an operational failure exactly when it is not a success exit.
    Success requires Verify=true. Any fired F_* channel without Verify=true is
    a constituent of F.

  combination_rule: >-
    Operational failure set is the symbolic union of the seven path-justified
    constituents; membership in any constituent without Verify=true places the
    exit in F. Overlaps among channels are permitted; no disjointness or
    independence assumption is asserted.

  expression: >-
    F_input ∪ F_oracle ∪ F_cleanup ∪ F_stop ∪ F_recovery ∪ F_tail ∪ F_verify
    ⊆ F

  channel_to_operational_failure:
    - channel: F_input
      combines_as: union_member
      fires_implies_operational_failure_when: no_Verify_true_returned
      probability_weight: not_assigned
    - channel: F_oracle
      combines_as: union_member
      fires_implies_operational_failure_when: no_Verify_true_returned
      probability_weight: not_assigned
    - channel: F_cleanup
      combines_as: union_member
      fires_implies_operational_failure_when: no_Verify_true_returned
      probability_weight: not_assigned
    - channel: F_stop
      combines_as: union_member
      fires_implies_operational_failure_when: no_Verify_true_returned
      probability_weight: not_assigned
      note: Not QM-STOPPING clearance; τ not invented.
    - channel: F_recovery
      combines_as: union_member
      fires_implies_operational_failure_when: no_Verify_true_returned
      probability_weight: not_assigned
    - channel: F_tail
      combines_as: union_member
      fires_implies_operational_failure_when: no_Verify_true_returned
      probability_weight: not_assigned
    - channel: F_verify
      combines_as: union_member
      fires_implies_operational_failure_when: no_Verify_true_returned
      probability_weight: not_assigned

  f_sim_relation:
    combines_as: not_a_union_member
    maps_to_F: false
    note: >-
      Retained BATCH-024 honesty. Incomplete simulator report ∈ F_sim does not
      imply membership in F via an F_sim→F map. Report-only completion may still
      be in F by the Verify-relative recovery_spec rule without that map.

  composition_checklist:
    - id: C1_all_constituents_named
      required: true
      passed: true
      description: All seven recovery_spec F_* names present in ledger.
    - id: C2_prior_path_justification
      required: true
      passed: true
      description: >-
        BATCH-024 path_justified_on_scaffold retained as prior justification
        scope (scaffold-only).
    - id: C3_union_membership_explicit
      required: true
      passed: true
      description: Each F_* has an explicit member_of_symbolic_union=true rule.
    - id: C4_success_exit_verify_true
      required: true
      passed: true
      description: Success exit is Verify=true only.
    - id: C5_no_probability_weights
      required: true
      passed: true
      description: No Pr[F_*], no union-bound epsilons, no security bits.
    - id: C6_f_sim_honesty
      required: true
      passed: true
      description: F_sim maps_to_F=false retained; not a union constituent.
    - id: C7_no_tau
      required: true
      passed: true
      description: No Verify-relative τ or joint Q/S/P/C finiteness invented.

  dependency_assumptions_identified:
    - scaffold_no_crypto_Verify_token_semantics
    - symbolic_stopping_policy_halt_without_verify_true
    - batch024_path_justified_on_scaffold_prior
    - overlaps_among_F_star_permitted_without_independence_claim

  what_is_recorded:
    - symbolic_union_membership
    - set_theoretic_combination_into_common_F
    - verify_true_success_exit
    - checklist_of_dependency_assumptions
  what_is_not_recorded:
    - Pr_F_star
    - numeric_union_bound
    - security_bits
    - tau
    - joint_Q_S_P_C_expectations
    - crypto_verify_implementation
    - QUERY_MEMORY_clearance

  harness_entrypoint: python3 -m composition_ledger_harness.run_harness
  harness_receipt: composition_ledger_harness/harness_receipt.json

  collimation_sieve_negative_control:
    name: CollimationSieve
    commit: 6f9188e4eb5611bcfdf29a3e1ec3cd69a29a50e9
    status: host_gap_certified_retained_untouched
    apis_invented: false

  summary:
