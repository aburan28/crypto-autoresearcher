        is the explicit named-union ledger + R1–R5 / C1–C7 checklist +
        Verify=true success exit + F_sim honesty, not an independent
        probabilistic membership argument. Reading harness-pass as a
        distributional inclusion proof would invent evidence.
      required_control: >-
        Ledger language must call the advance symbolic F-union /
        set-theoretic operational-error composition ledger only; require
        probability composition (and crypto/host Verify where claimed)
        before any operational error-bound or clearance reading.
