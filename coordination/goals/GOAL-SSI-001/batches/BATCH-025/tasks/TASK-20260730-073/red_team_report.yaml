      required_control: >-
        Keep composition_status=f_union_ledger_partial and
        probability_composition=false in all official claims; next ERROR
        work remains probability-composed union inclusion and/or
        crypto-or-host Verify under an explicit protocol, still without
        CollimationSieve API invention.
