      severity: blocking_for_scope_expansion
      title: U ⊆ F checklist is definitional under recovery_spec common-event F
      detail: >-
        union_subseteq_common_f checks that U equals the CONSTITUENTS
        constant set; subseteq_F_by_recovery_spec is hardcoded true;
        classify_exit marks any non-Verify=true exit as common F by
