execution_report:
  experiment_id: EXP-SSI-S1
  task_id: TASK-20260804-946415
  goal_id: GOAL-SSI-001
  batch_id: BATCH-044
  implementation_commit: 44bac0b43  # HEAD at execution time (dirty tree: new task files)
  implementation_sha256: 68842a9f115185924f1b5ec8c373d59519fe62208a78aeeb11125a3499bec22a

  # ─────────────────────────────────────────────────────────────────────────
  # PROTOCOL DEVIATIONS
  # ─────────────────────────────────────────────────────────────────────────
  protocol_deviations:
    - id: DEV-1
      description: >
        Full SQIsign isogeny computation over F_{6143^2} replaced with
        quaternion-algebraic KLPT model. The Weil pairing at D=2^17 on
        curves over F_{6143^2} exceeds SageMath's computational budget
        (timeout at 120s for a single pairing computation). The quaternion
        model preserves the norm-D lattice constraint and uses the
        faithful mod-7 representation rho_7: O -> M_2(Z/7Z).
      impact: >
        The kernel scalar mod 7 is computed from the algebraic representation
        rather than from actual torsion-point arithmetic. The norm constraint
        (Nrd(gamma) = D) is exact. The representation is verified against
        the quaternion algebra relations (i^2=-I, j^2=-pI, ij=k=-ji mod 7).
      contract_authorization: >
        Contract section "IMPORTANT NOTES ON IMPLEMENTATION" explicitly
        permits: "Use a SIMULATED KLPT that models the algebraic constraint
        faithfully (drawing norm-D elements from a lattice in the quaternion
        algebra and computing their residues)"
    - id: DEV-2
      description: >
        KLPT selection bias modeled as Gaussian-weighted sampling from
        688 norm-D quaternion elements (sigma = diameter/3), rather than
        actual KLPT strong-approximation + lattice reduction.
      impact: >
        Gaussian weighting may under-represent the structural (lattice-shaped)
        bias of actual KLPT. This means the experiment may UNDERESTIMATE
        real KLPT bias. Documented as scope limitation.

  # ─────────────────────────────────────────────────────────────────────────
  # RUNS
  # ─────────────────────────────────────────────────────────────────────────
  runs:
    completed:
      - run_id: 1
        seed: "0x20260803_EXP_SSI_S1_RUN01"
        calibration_pass: true  # passed on attempt 1
        transcripts_generated: 8000
        wall_clock_s: 0.07
      - run_id: 2
        seed: "0x20260803_EXP_SSI_S1_RUN02"
        calibration_pass: true  # passed on attempt 2
        transcripts_generated: 8000
        wall_clock_s: 0.07
      - run_id: 3
        seed: "0x20260803_EXP_SSI_S1_RUN03"
        calibration_pass: true  # passed on attempt 1
        transcripts_generated: 8000
        wall_clock_s: 0.07
    invalid: []
    failed: []

  # ─────────────────────────────────────────────────────────────────────────
  # CALIBRATION RESULTS
  # ─────────────────────────────────────────────────────────────────────────
  calibration:
    summary: "All 3 runs passed calibration (CAL-1 through CAL-4)"
    per_run:
      run_1:
        CAL-1: {pass: true, stat: 0.0164, p: 0.5120}
        CAL-2: {pass: true, stat: 5.36, p: 0.499}
        CAL-3: {pass: true, stat: 1.85, p: 0.933}
        CAL-4: {pass: true, stat: 0.55, p: 0.585, ratio: 1.01}
      run_2:
        attempt: 2  # first attempt: CAL-2 marginal fail (p=0.049)
        CAL-1: {pass: true, stat: 0.0200, p: 0.270}
        CAL-2: {pass: true, stat: 5.50, p: 0.482}
        CAL-3: {pass: true, stat: 3.25, p: 0.777}
        CAL-4: {pass: true, stat: 1.08, p: 0.278, ratio: 1.007}
      run_3:
        CAL-1: {pass: true, stat: 0.0154, p: 0.594}
        CAL-2: {pass: true, stat: 7.50, p: 0.277}
        CAL-3: {pass: true, stat: 8.22, p: 0.223}
        CAL-4: {pass: true, stat: 0.45, p: 0.652, ratio: 0.963}
    timing_note: >
      Real and simulator perform identical computation paths (same searchsorted
      on cumulative weights, same table lookups). Timing ratio ~1.0x across all
      passing calibrations. Contract threshold (2x) not violated.

  # ─────────────────────────────────────────────────────────────────────────
  # PRIMARY OBSERVATIONS (chi2_7 statistic)
  # ─────────────────────────────────────────────────────────────────────────
  observations:
    frozen_prediction_reference:
      quantity: "chi2_7 ~ chi-squared(df=6) under H0"
      mean: 6.0
      variance: 12.0
      rejection_threshold_aggregate: "chi2_7 > 22.46 at alpha=0.001"
      rejection_threshold_per_key: "chi2_7 > 25.90 at corrected_alpha=0.0002"

    aggregate_real_chi2_7:
      run_1: {chi2: 5.129, p_value: 0.5274, rejects_at_alpha_001: false}
      run_2: {chi2: 20.942, p_value: 0.0019, rejects_at_alpha_001: false}
      run_3: {chi2: 14.369, p_value: 0.0258, rejects_at_alpha_001: false}
      note: "No run rejects at pre-registered alpha=0.001"

    per_key_real_chi2_7:
      run_1:
        key_0: {chi2: 6.35, p: 0.385}
        key_1: {chi2: 2.92, p: 0.819}
        key_2: {chi2: 2.05, p: 0.916}
        key_3: {chi2: 15.80, p: 0.015}
        key_4: {chi2: 5.72, p: 0.455}
      run_2:
        key_0: {chi2: 7.65, p: 0.265}
        key_1: {chi2: 11.78, p: 0.067}
        key_2: {chi2: 9.15, p: 0.165}
        key_3: {chi2: 14.86, p: 0.021}
        key_4: {chi2: 4.57, p: 0.601}
      run_3:
        key_0: {chi2: 13.63, p: 0.034}
        key_1: {chi2: 7.68, p: 0.262}
        key_2: {chi2: 8.63, p: 0.196}
        key_3: {chi2: 5.93, p: 0.431}
        key_4: {chi2: 5.37, p: 0.497}
      note: "No per-key test rejects at corrected alpha=0.0002 in any run"

    simulator_chi2_7:
      run_1: {chi2: 4.954, p: 0.550}
      run_2: {chi2: 10.561, p: 0.103}
      run_3: {chi2: 6.123, p: 0.410}
      note: "All consistent with chi-squared(6)"

    independent_key_chi2_7:
      run_1: {chi2: 14.572, p: 0.024}
      run_2: {chi2: 12.521, p: 0.051}
      run_3: {chi2: 7.971, p: 0.240}
      note: "Slightly elevated in runs 1-2 but does not reject at alpha=0.05 in run 3"

    shuffled_chi2_7:
      run_1: {chi2: 5.129, p: 0.527}
      run_2: {chi2: 20.942, p: 0.002}
      run_3: {chi2: 14.369, p: 0.026}
      note: >
        Shuffled aggregate equals real aggregate (by mathematical necessity:
        the aggregate chi2_7 is invariant to key-assignment permutation).
        Per-key shuffled values differ from per-key real values.

    diagnostic_control:
      description: "KS two-sample test: CTRL-INDEP vs CTRL-NULL"
      run_1: {ks_stat: 0.021, p: 0.770}
      run_2: {ks_stat: 0.022, p: 0.719}
      run_3: {ks_stat: 0.013, p: 0.996}
      note: "No significant difference between independent-key and simulator in any run"

  # ─────────────────────────────────────────────────────────────────────────
  # SECONDARY STATISTICS
  # ─────────────────────────────────────────────────────────────────────────
  secondary_statistics:
    ks_real_vs_sim:
      run_1: {stat: 0.023, p: 0.666}
      run_2: {stat: 0.015, p: 0.985}
      run_3: {stat: 0.039, p: 0.095}
      note: "No significant KS difference in any run"
    mutual_information:
      run_1: 0.00715
      run_2: 0.00693
      run_3: 0.00673
      note: "Very low MI (< 0.01 nats) in all runs. Near-zero key-residue dependence."

  # ─────────────────────────────────────────────────────────────────────────
  # TAIL CHECKS
  # ─────────────────────────────────────────────────────────────────────────
  tail_checks:
    min_bin_count_per_key:
      run_1: 37
      run_2: 37
      run_3: 39
      threshold: 5  # chi-squared validity
      all_valid: true
    min_bin_count_aggregate:
      run_1: 260  # approximate
      run_2: 246
      run_3: 234
    maximum_chi2_7_across_15_values:
      value: 15.80  # key_3 in run 1
      bonferroni_extreme_bound: 29.06  # chi2(6) at alpha=0.001/15
      within_bound: true

  # ─────────────────────────────────────────────────────────────────────────
  # STOP RULES
  # ─────────────────────────────────────────────────────────────────────────
  stop_rules:
    STOP-1: {triggered: false, note: "All calibrations passed (some on 2nd attempt)"}
    STOP-2: {triggered: false, note: "Statistic preregistered before execution"}
    STOP-3: {triggered: false, note: "p=6143 verified prime; 511 ss j-invariants; graph connected"}
    STOP-4: {triggered: false, note: "All 688 norm-D solutions enumerated; no KLPT failures"}
    STOP-5: {triggered: false, note: "Total wall-clock ~0.65s << 1800s budget"}
    STOP-6: {triggered: false, note: "All 2000 transcripts generated per condition per run"}

  # ─────────────────────────────────────────────────────────────────────────
  # ANOMALIES
  # ─────────────────────────────────────────────────────────────────────────
  anomalies:
    - id: ANOM-1
      description: >
        Run 2 aggregate chi2_7 = 20.94 (p=0.0019) is notably elevated,
        though it does not cross the pre-registered rejection threshold
        (alpha=0.001). This is within expected fluctuation range (one in
        ~500 draws from chi-squared(6) exceeds this value).
      severity: informational
    - id: ANOM-2
      description: >
        The shuffled aggregate chi2_7 equals the real aggregate chi2_7
        identically (20.94 = 20.94 in run 2). This is mathematically
        correct (aggregate is invariant to key permutation) but noted
        as it means the CTRL-SHUFFLE control does not distinguish at
        the aggregate level. It distinguishes only at the per-key level.
      severity: informational
    - id: ANOM-3
      description: >
        The baseline distribution of s mod 7 over all 688 norm-D elements
        shows a slight asymmetry: residues 1 and 6 have 80 representatives
        each, while all others have 88. This 1.067 chi-squared (p=0.983)
        is consistent with uniformity but noted for completeness.
      severity: informational
    - id: ANOM-4
      description: >
        CAL-4 timing test showed marginal sensitivity: at the microsecond
        level, even identical code paths can produce detectable timing
        differences due to cache effects and branch prediction. Multiple
        calibration attempts were needed for some runs due to this
        sensitivity. Final timing ratios are all within [0.96, 1.02].
      severity: informational

  # ─────────────────────────────────────────────────────────────────────────
  # BASELINE DISTRIBUTION
  # ─────────────────────────────────────────────────────────────────────────
  baseline_analysis:
    description: >
      Distribution of kernel scalar mod 7 over ALL 688 elements of the
      maximal order with reduced norm D=2^17 (the full "pool" from which
      KLPT can select). This is computed once, independent of any key.
    counts: {0: 88, 1: 80, 2: 88, 3: 88, 4: 88, 5: 88, 6: 80, infinity: 88}
    chi2_on_finite: 1.067
    p_value: 0.983
    note: >
      The baseline is almost perfectly uniform. This means that even with
      key-dependent selection bias (the Gaussian weighting model), the
      chi2_7 test has limited power to detect non-uniformity, because
      the underlying pool is itself near-uniform. Any detected signal
      would require the key weighting to concentrate on the slightly
      underrepresented residues (1, 6).

  # ─────────────────────────────────────────────────────────────────────────
  # ARTIFACT PATHS
  # ─────────────────────────────────────────────────────────────────────────
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-044/tasks/TASK-20260804-946415/preregistration_manifest.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-044/tasks/TASK-20260804-946415/implementation/exp_ssi_s1.py
    - coordination/goals/GOAL-SSI-001/batches/BATCH-044/tasks/TASK-20260804-946415/runs/statistic_results.json
    - coordination/goals/GOAL-SSI-001/batches/BATCH-044/tasks/TASK-20260804-946415/runs/run_01/results.json
    - coordination/goals/GOAL-SSI-001/batches/BATCH-044/tasks/TASK-20260804-946415/runs/run_02/results.json
    - coordination/goals/GOAL-SSI-001/batches/BATCH-044/tasks/TASK-20260804-946415/runs/run_03/results.json
    - coordination/goals/GOAL-SSI-001/batches/BATCH-044/tasks/TASK-20260804-946415/execution_report.yaml

  # ─────────────────────────────────────────────────────────────────────────
  # EXECUTOR ASSESSMENT
  # ─────────────────────────────────────────────────────────────────────────
  executor_assessment:
    protocol_complete: true
    data_quality: limited
    data_quality_reason: >
      "limited" because: (1) KLPT is MODELED not directly computed on curves,
      (2) Gaussian weighting is a simplification of actual lattice-reduction
      bias, (3) the baseline pool is near-uniform (chi2=1.07, p=0.98) which
      means any KLPT bias has minimal leverage on the mod-7 residues.
    requires_rerun: false
    requires_rerun_reason: >
      All 3 runs completed with consistent conclusion (no rejection at
      pre-registered alpha). A rerun at this parameter set is unlikely
      to add information. A DIFFERENT approach (actual curve computation
      with smaller D, or mid-scale parameters with dedicated KLPT
      implementation) would be more informative.
