    and_the_real_positive_control_that_matters_most: The real article, retrieved independently, ACCEPTED, and its ten values agreeing exactly with the transcript. The gate that rejected three decoys admitted the one true object.
  is_any_pass_entailed_by_its_own_construction: 'DISCLOSED PLAINLY, BECAUSE THE PLAN ASKS AND BECAUSE DEC-20260904-166ab5 ON RG-4 AND DEC-20260904-4c81b6 F-3 MAKE THIS THE PROGRAM''S RECURRING DEFECT. (a) Objects 1 and 2 run through solve_joint(alpha, beta, delta), whose three coefficients are INPUTS. Their outcomes are therefore not entailed: I verified this by feeding it seven shapes and getting four distinct verdict classes back, including three the producer never used. (b) Object 4''s pass IS PARTLY ENTAILED by the size of the offset relative to the tolerance, as stated in its own caveat above - a +6.0-bit shift cannot pass a +/-0.05 test, so that particular decoy could not have been absorbed by any procedure with a tolerance. The informative part of object 4 is not the rejection but the ASYMMETRY, that only the memory coordinate moved. (c) Object 3b''s rejection is NOT entailed: the decoy passes the title, author and partial-value checks and is caught only by the checksum, which is precisely why the plan says a checksum and a version field exist to catch it. (d) Object 5''s acceptance is not entailed by anything: the same gate that accepted it rejected three objects.'
citation_prohibition_application:
  retained_sentence_restated_verbatim: The `P=512` crossover value and its `w=2^80` sign are **NOT citation-eligible**. This task does not lift that prohibition. Only a committed Coordinator decision on independently reviewed evidence can lift it.
  predicate_extension_restated_verbatim: In addition to the retained sentence, a row of any EXP-WESOVOW-001 reconciliation is NOT citation-eligible when either (a) the two anchors disagree in the SIGN of the baseline comparison at that row, or (b) the smaller |margin| across the two anchors at that row is below that field size's anchor gap |Delta log2 T_full + Delta log2 M / 2|.
  neither_is_lifted_by_this_report: NEITHER IS LIFTED, AND THIS REPORT CANNOT LIFT EITHER. Only a committed Coordinator decision on independently reviewed evidence can.
  did_either_fire_on_the_RC6_package:
    answer: NO. NEITHER LIMB FIRED.
    how_i_checked_rather_than_assumed:
    - Grepped all six RC-6 artifacts for `2^80`, `2**80`, `w = 2`, `P = 512`, `speedup`, `margin` and `anchor gap`. EVERY occurrence is inside a verbatim restatement of the prohibition itself, inside a statement that the prohibition did not fire, or inside a FORECLOSURE clause telling a reader they may not cite such a thing. Not one is an assertion of a value or a sign.
    - 'Enumerated EVERY decimal number appearing in all five prose artifacts. The complete set is: 0.75 (C1''s tolerance, quoted from the contract), 4.1 (the source''s section number), 1.0 / 60.0 / 0.1 (the optimizer grid, quoted from the contract), 0.0 / 0.5 / 1.0 / 2.0 (the declared overhead c values, and the AC engine''s alpha/beta/delta coefficients), and 1.1 (a schema version). THERE IS NO OTHER DECIMAL NUMBER IN THE PACKAGE. No crossover value, no margin, no baseline sign, no speedup, and none of the ten source-derived values appears anywhere in it - which I could check directly because I hold the ten from my own retrieval.'
    - 'Checked specifically for the five Delfs-Galbraith baseline figures as a tuple: ABSENT. The defect_reproduction says of C2 `Its five parenthesised baseline figures are not restated here and are not needed`, and that is true.'
    - 'Checked the amendment''s own design choice: it DELIBERATELY STATES NO CORRECTED CLOSED FORM for w*, and gives the prohibition as the first of three reasons. It incorporates the law by reference to a committed record instead.'
    the_predicate_limb_specifically: Limb (a) needs a SIGN of a baseline comparison at a row and limb (b) needs a MARGIN and an anchor gap. The package cites no reconciliation row, computes no per-row margin, and evaluates no anchor gap. Neither limb has an object to fire on.
  did_either_fire_on_the_OBJ4_package: 'NO. It computes no crossover, no baseline comparison, no margin and no speedup. It states the paper''s own log2 p = 512 cost pair, which is a source figure and not a crossover value or a baseline-comparison sign, and its own artifact says so in note_on_the_512_row. I agree with that reading: the prohibition names a CROSSOVER at P=512, not every quantity indexed by 512.'
  did_either_fire_on_THIS_REPORT:
    answer: NO, AND THE ONE PLACE THIS REPORT COMES CLOSEST TO THE BOUNDARY IS FLAGGED HERE RATHER THAN LEFT FOR A READER TO FIND.
    the_close_call: Finding F-11 records that I read the committed protocol amendment at coordination/goals/GOAL-SSI-001/batches/BATCH-2e6130/tasks/TASK-20260809-ef3e58/protocol_amendment.yaml and that its `corrected_model.crossover.equation` at lines 64-66 is a SYMBOLIC equation carrying an additive log2(M) term that specification.yaml:39-40 lacks. I state that STRUCTURAL fact and its locator. I do NOT reproduce the closed form in this report, I evaluate it at no field size, I attach no number to it, and I compute no crossover, margin, sign or speedup anywhere.
    my_reasoning_that_neither_limb_fires: The retained sentence names a crossover VALUE at P=512 and a SIGN; a symbolic identity with no parameters bound is neither. The predicate extension names ROWS of a reconciliation; I cite none. I note that the RC-6 draft reads the prohibition slightly more conservatively than its text - as also forbidding it to ASSERT what the corrected crossover is - and I have respected that stricter reading by not reproducing the form. THE COORDINATOR SHOULD CHECK THIS JUDGEMENT RATHER THAN INHERIT IT.
    and_the_ten_values: This report DOES carry the ten values, in the phase_a block and in the J4 comparison table. That is expressly permitted by my card - `Your report is a review artifact and may carry them where the joint requires it` - and the joint requires it. They appear in NO control-plane file and in NO message. My return message to the orchestrating session states no value.
  recommendation_marked_as_a_recommendation_and_not_a_decision:
    this_is_a_RECOMMENDATION_AND_NOT_A_DECISION: true
    recommendation: 'RETAIN BOTH LIMBS IN FULL. Nothing this round produced bears on either. This round measured no crossover, no anchor, no margin and no sign; it read a contract, did algebra on two of its blocks, retrieved a document and diffed ten numbers. Every ground DEC-20260904-166ab5 and DEC-20260904-4c81b6 recorded for refusing the lift is untouched by it - and note that this round STRENGTHENS the case for retention on one point rather than weakening it: J1 establishes that the contract''s own crossover statement is defective, so any crossover figure derived under contract version 1 was derived under a metrics line that does not agree with the contract''s own controls.'
    what_would_change_my_recommendation: Not this round's evidence. A lift needs the RC-4 resolution measurement for the RECONCILIATION procedure, the CF-8 null-object recount, and the CF-9 attestation of the two dirty_tree runs - all three of which this batch records as carried forward and not dispatched.
    authority: A reviewer may recommend; only a committed Coordinator decision on independently reviewed evidence can lift. batch.citation_prohibition.lift_procedure.
findings:
- id: F-1
  severity: moderate
  joint: J2
  target: TASK-20260905-28c89d/amendment_controls.py FRAMING_DRIFT_VOCABULARY, pattern 8 of 8, and amendment_controls_report.yaml commands_run[0].remedy / protocol_deviations PD-C
  finding: AC-4 CARRIES A PATTERN THAT CAN NEVER FIRE, AND THE PACKAGE'S OWN DISCLOSURE OF AC-4'S DEFECT STOPS ONE STEP SHORT OF IT. scan_text() lowercases the haystack (`low = norm.lower()`) and calls `re.finditer(pat, low)` with no re.IGNORECASE, but pattern 8 is `C1.{0,120}?(?:should|must)\s+be\s+one-?sided`, carrying the uppercase literal `C1`. It cannot match a lowercased string.
  how_i_demonstrated_it: 'I fed AC-4 the sentence `Control C1 should be one-sided.` It returns verdict `pass` with zero hits. The same pattern matches the same sentence against an original-case haystack, so the pattern is well-formed and merely unreachable. I then scanned all three vocabularies for uppercase literals that can never match a lowercased haystack: this is the ONLY one, in AC-4; AC-3 has none and AFFIRMATION_PATTERNS has none.'
  why_it_matters: It is the SAME DEFECT CLASS the package discloses about its own ordinal-1 run - a control pattern that cannot match the thing it exists to catch - surviving the repair, inside the same control. The recorded remedy reads `The gap class was changed from [^.] to a bounded . in EVERY AC-4 pattern`, which is TRUE of gap classes and is not the same as `every AC-4 pattern can now fire`. The audit stopped at the gap class. DEC-20260904-4c81b6 rationale item 7 names F-3 of the prior round - `a control whose firing condition was asserted from a plausible mental model rather than read out of the instrument` - as this program's recurring defect class, and this is another instance of it.
  what_it_does_NOT_overturn: 'J2''s substantive answer. The draft contains no `C1 should be one-sided` sentence: I confirmed that by a full sentence-level hand scan independent of the scanner, and a SIBLING pattern (`(?:test|tolerance)\s+(?:should|must|ought\s+to)\s+be\s+one-?sided`) does catch the commoner phrasings. What is overturned is the completeness of the disclosure, not the verdict.'
  remedy_i_recommend_and_do_not_perform: Do NOT edit the snapshot-bound artifact. A successor record should note that AC-4's pattern 8 is unreachable and that any re-use of this instrument should either pass re.IGNORECASE or lowercase the vocabulary, and should add a meta-check that every pattern fires on at least one constructed input before the control's pass is relied on.
- id: F-2
  severity: minor
  joint: J1
  target: TASK-20260905-28c89d/defect_reproduction.yaml scope_audit.question, final sentence
  finding: THE EXHAUSTIVENESS WARRANT IS FALSE AS WRITTEN. The audit asserts `The file is 167 lines and every line is inside exactly one entry of this enumeration, so the enumeration is exhaustive by construction.` Its 26 entries cover 165 of 167 lines with no overlaps. LINES 108 AND 133 ARE IN NO ENTRY.
  how_i_demonstrated_it: 'Parsed every `lines:` range in blocks_examined into a coverage map over 1..167 and printed the complement. Result: [108, 133], zero double-covered lines, max covered line 167.'
  what_those_two_lines_are: Line 108 is `  scenario_definitions:` and line 133 is `  controls:` - bare mapping keys with no content. I read both myself.
  why_it_matters_anyway: '`exhaustive by construction` is the warrant the audit''s completeness rests on, and J1''s whole load-bearing question is a scope question. A reader who checks the claim finds it false and has no way to know from the artifact that the two uncovered lines are harmless. They ARE harmless, and I verified that.'
  what_it_does_NOT_overturn: The scope conclusion. I performed my own 25-key partition of the file and reached the same conclusion, and the two omitted lines cannot scope anything.
- id: F-3
  severity: moderate
  joint: J1
  target: TASK-20260905-28c89d/defect_reproduction.yaml scope_audit, C3 entry and scope_audit_conclusion final sentence; carried into protocol_amendment_draft.yaml gating_reproduction.summary_without_restating_it
  finding: THE CLAIM THAT C3 CORROBORATES 'INDEPENDENTLY OF C4' OVERSTATES THE LOGIC, AND IT IS A NEW CLAIM NOT IN THE PRIOR RECORD. C3's second clause is `T(w) must equal T_full for w >= M`. C4 is `At w = M, vOW time must equal T_full exactly`. C4's assertion is that clause restricted to the single point w = M, so C3 LOGICALLY ENTAILS C4. The producer's C3 route uses only that clause. It is therefore the same inference drawn from a strictly stronger premise, not a second independent derivation, and `the finding does not rest on a single control` invites a reader to count it as two-source corroboration when it is one.
  the_weaker_statement_that_IS_true: If C4 were deleted from the file, C3's text would still assert the same thing, so the finding is robust to a reading that dissolves C4 as a mere `cap check` on an implementation detail. That is worth recording; it is not independence.
  what_C3_DOES_add_that_the_package_did_not_record: 'C3''s FIRST clause, monotonicity, gives a genuinely different and STRONGER objection that needs no charging law at all: for A > 0 the overhead-inflated time never falls below the baseline at any budget, so NO crossover exists - yet the metrics line returns a finite one. See joint_verdicts.J1.my_own_rederivation.derivation_3. I offer this as an addition to the record, not as a correction of the result.'
  what_it_does_NOT_overturn: The satisfying set. It is R x {0} either way, and my independent derivation reaches it without C3 at all.
- id: F-4
  severity: minor
  joint: J1
  target: TASK-20260905-28c89d/defect_reproduction.yaml derivation.step_4_the_implied_law
  finding: STEP 4 RESTS ON A FUNCTIONAL-FORM POSIT THAT IS NAMED BUT NOT JUSTIFIED FROM THE FILE. It obtains g(y) = -y/2 identically from agreement at `at least twenty points` plus `the one-parameter power-law family that any single charging law of this form inhabits`. The file nowhere restricts the charging law to such a family. The instrument makes the same posit explicitly in its header comment (`Positing the law's memory term affine in (x, m)`), which is honest.
  why_it_is_nonetheless_repairable_and_i_record_the_repair: The posit is unnecessary. The metrics line declares itself `analytic:`, i.e. an identity in its arguments rather than a tabulation over the grid; an identity over a CONTINUUM of A determines g on an interval with no family assumption. Additionally the twenty points are not twenty points of ONE function - t and log2 T_DG vary with the field size, so the grid gives four points per field size for a per-scenario law, which is weaker than the artifact's phrasing suggests.
  what_it_does_NOT_overturn: Anything. My derivations 1 and 2 avoid the posit entirely and reach the same set, and derivation 3 needs no law at all. Recorded so an enacting Coordinator knows the conclusion does not depend on the weakest step of the argument as written.
- id: F-5
  severity: minor
  joint: J1 and J3
  target: the RC-6 package as a whole; disclosed by the producer at protocol_deviations PD-D and at category_and_licensing_analysis.yaml limitations[0]
  finding: THE RC-6 PACKAGE NEVER OPENED inputs/ AT ALL. The characterization that the source states the anchors as lower bounds from an explicitly rough underestimation - which is the premise of the entire category diagnosis and of clause_3 - is cited to DEC-20260904-4c81b6, not to a reading; and the source locator paper_fulltext.md:234-238 is likewise cited to a decision. The producer discloses this in three places and flags it for an enacting Coordinator to confirm.
  status_after_this_review: 'CLOSED BY THIS REVIEW, ON BOTH LIMBS, INDEPENDENTLY. (a) My Phase A retrieval of the published article confirms the characterization directly: Section 4.1 opens `Let us estimate a LOWER BOUND on the concrete cost`, every one of the ten carries `>=`, and the section closes `these numbers are obtained via a rough underestimation of the size of the table and the cost of its generation`. (b) My Phase B check confirms the locator: lines 234-238 of the frozen transcript are exactly the five bullets. The RC-6 package on its own does not establish either; this round does.'
  why_it_is_still_recorded_as_a_finding: Because the artifact is immutable and a later reader of the package alone inherits only the decision's evidence. The disclosure is exemplary; the gap was real.
- id: F-6
  severity: minor
  joint: J1 scope audit / J3
  target: experiments/EXP-WESOVOW-001/specification.yaml:49 versus :139 and :151 - THE FROZEN CONTRACT ITSELF, not a producer artifact
  finding: A SECOND INTERNAL INCONSISTENCY IN THE FROZEN CONTRACT, WHICH THIS AMENDMENT DELIBERATELY DOES NOT REPAIR. success_criterion_note at line 49 describes C1 as `an INSTRUMENT SANITY GATE carrying a 3-bit tolerance`, while C1's own tolerance at line 139 is `abs deviation <= 0.75 bit on both time and memory`. The 3-bit figure is the STOPPING RULE's rerun threshold at line 151 (`stop after first valid run unless C1 fails by more than 3 bits`). A note describing a control has taken the stopping rule's number as the control's tolerance.
  who_found_it: I found it independently while reading the whole file for the J1 scope audit. The RC-6 package found it too and records it at category_and_licensing_analysis.yaml note_on_the_two_tolerances, states it is orthogonal to the defect being amended, states the amendment does not touch it, and flags it so a later reader does not assume it was missed. That is the correct handling and I endorse it.
  why_it_is_recorded_here_anyway: Because it is a live defect in a frozen contract that no record of this campaign carries as a carried-forward item, and because it bears on how a reader interprets C1 - the very control clause_3 annotates. It is a candidate CF item for the successor batch.
  what_it_does_NOT_do: It does not scope, override or dissolve either J1 target. I checked.
- id: F-7
  severity: minor
  joint: J3
  target: TASK-20260905-28c89d/protocol_amendment_draft.yaml constraint_compliance.constraint_i and proposed_replacement.clause_3.what_the_five_pairs_are
  finding: AN OVER-READING PATH, AND THE SHORTEST ONE IN THE PACKAGE. `EV-SSI-7a3e91 established their fidelity to the frozen source ... and this amendment takes that as settled and closed`, and `Their fidelity to that source is settled`. `That source` and `the frozen source` mean inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, this program's OWN transcript. A later reader who quotes either sentence without the qualifier `frozen` reads it as fidelity to the PUBLISHED ARTICLE - which is precisely the gap OBJ-4 was dispatched to close, and which no record of this program had closed when the draft was written. The word `closed` carries the most weight.
  the_ironic_part_stated_so_it_is_not_mistaken_for_vindication: On this round's evidence the stronger reading now happens to be TRUE for the ten values. It was not true on the evidence the draft cites, and a sentence that is accidentally right is still an over-reading path.
  recommendation_not_a_decision: An enacting decision should scope that sentence explicitly to the frozen transcript and cite this round separately for the external limb.
  severity_note: Minor, because the draft is a DRAFT with an explicit in_force_statement saying no reader may cite any clause of it as governing, and because the surrounding text is otherwise scrupulous about scope.
- id: F-8
  severity: informational
  joint: J1 and J3
  target: the RC-6 package's citations that I structurally could not verify
  finding: 'SIX CLASSES OF CITATION IN THE PACKAGE ARE UNVERIFIABLE BY ME BY CONSTRUCTION, AND I REPORT THEM AS UNVERIFIED RATHER THAN AS CORRECT. They are: (a) everything cited to ledger/evidence/EV-SSI-5d954c.yaml (observations 1, 2, 3, 7) - in my blind_from; (b) everything cited to ledger/evidence/EV-SSI-7a3e91.yaml - deliberately outside my read scope; (c) the three BATCH-256a94 artifacts named in blast_radius (source_state_census.md:108-110, anchor_reconciliation.json, outstanding_fix.md R1-R8) - in my blind_from; (d) RC-2''s per-field reachability statuses, which are cited from DEC-20260904-4c81b6 and could only be recomputed by executing cost_model.py, which is prohibited; (e) every cost_model.py line-number locator in category_and_licensing_analysis.yaml (60-66, 72, 181-191, 232-233, 256, 257-258, 260-262, 288, 298-319, 302, 303-305, 309-313, 344-345) - the file is in my blind_from and I did not read one line of it; (f) DEC-20260904-166ab5:178 and CORR-20260905-547849, which are in my read scope and which I did not read (VD-3).'
  consequence: My J1/J2/J3 verdicts rest on the frozen contract, on the package's own text, on DEC-20260904-4c81b6, on the committed BATCH-2e6130 amendment, and on my own algebra and control runs. They do NOT rest on any of the above, and where the package's reasoning depends on one of them my verdict is conditional on it. This is a structural consequence of a blind-from list that is correctly drawn for J4 and that necessarily blinds J1-J3 to some of their citations. It is a cost of this round's design and it is stated as one.
  the_one_i_DID_verify: See F-11.
- id: F-9
  severity: informational
  joint: all
  target: batch.yaml blind_phase_hygiene, around line 183
  finding: 'A YAML SHAPE ANOMALY IN THE BATCH CONTROL PLANE, COSMETIC AND REPORTED FOR COMPLETENESS. An eight-space-indented `protected_sha256_status: >-` block appears inside the folded scalar of `not_protected_and_deliberately_so`, so its text is carried as PROSE inside that field and then again as real DATA in the sibling key that follows. The file parses, the armed eleven-digest map parses, and no protected value is exposed. It is a duplicated paragraph, not a defect in the arming.'
  why_recorded: Because a reader diffing the batch file may see the phrase twice and suspect a partial edit, and because a control-plane file that is deliberately handed to a blind agent should be exactly what it appears to be.
- id: F-10
  severity: moderate
  joint: all - a property of this ROUND, not of either package
  target: TASK-20260905-28c89d/runtime_session_receipt.yaml and this review's own session
  finding: 'THIS REVIEW IS NOT MODEL-INDEPENDENT, AND IT IS PROBABLY NOT EVEN MODEL-DIFFERENT FROM THE PRODUCER. The RC-6 producer''s receipt records `resolved_model_id: claude-sonnet-5` from the adapter and `resolved_model_id_self_reported: claude-opus-5` from the session that served it, with `model_verified: false`, no probe run, and the divergence escalated to the Coordinator rather than absorbed. My own session self-reports as claude-opus-5. So on the producer''s own self-report, the same model served the package and this review.'
  why_it_matters: 'batch.yaml inference_environment.declared_limitation already says the review is SESSION-independent and not MODEL-independent and may never be presented as agreement between distinct models. This finding sharpens it: the correlation is not merely `not excluded`, it is positively indicated by the producer''s own receipt. DEC-20260904-4c81b6 rationale item 2 names exactly the failure this leaves open - `a shared misreading, a mis-parsed glyph, a systematically preferred slot on a line that carries two time figures, a shared assumption about which figure is the figure`.'
  what_partially_mitigates_it_for_J4_and_only_for_J4: The ten values were read through THREE different extraction engines across two sessions - the producer used pypdf 6.17.0 and pdfminer.six, both pure-Python; I used pymupdf 1.28.2, which wraps the MuPDF C library and is a genuinely different codebase lineage. A font- or encoding-level corruption would have to be reproduced identically by all three. That mitigation does NOT extend to J1, J2 or J3, which are acts of reading and reasoning by one model family.
- id: F-11
  severity: informational, and it is the strongest external corroboration in this report
  joint: J1
  target: coordination/goals/GOAL-SSI-001/batches/BATCH-2e6130/tasks/TASK-20260809-ef3e58/protocol_amendment.yaml (read under deviation VD-1)
  finding: 'I VERIFIED THE TWO CITATIONS THE RC-6 SCOPE AUDIT RESTS ITS SIXTH DISSOLVING READING ON, AND BOTH HOLD, AND ONE OF THEM CORROBORATES J1 FROM OUTSIDE THE FROZEN FILE. (a) That record''s `immutable_exclusions` at lines 37-42 does list `experiments/EXP-WESOVOW-001/specification.yaml` as its first entry. So the earlier amendment explicitly did NOT supersede metrics[5], the `superseded remnant` reading is refuted, and the contract''s text remains governing and unamended - exactly as the package says. (b) Its `corrected_model` block, committed on 2026-08-09 and governing cost_model.py, states a charging law and a crossover equation. WITHOUT REPRODUCING THE CLOSED FORM HERE: that committed crossover equation carries an additive log2(M) term, and specification.yaml:39-40 does not. The difference is exactly the term my derivations 1 and 2 identify as missing.'
  why_this_matters: 'THREE INDEPENDENT SOURCES NOW AGREE ON THE SAME MISSING TERM: my own derivation from the frozen file; the vOW law the PUBLISHED ARTICLE states in its own words on page 2, which I read in Phase A; and this program''s OWN already-committed corrected model, authored a month before this batch by a different task. J1 is not resting on one blind re-derivation that nobody repeated, which is precisely the concern review_plan.yaml J1 records.'
  hygiene_check_i_made_before_quoting_anything: 'I confirmed that record states none of the ten values (grep -c for each of the ten decimal strings: zero on all ten). It also carries no field-size-indexed crossover figure that I read or reproduce.'
- id: F-12
  severity: moderate
  joint: J4 - AND IT IS AN OBJECTION AGAINST MY OWN WORK
  target: this review
  finding: MY OWN BLINDNESS WAS PARTIALLY COMPROMISED BEFORE PHASE A, BY MY LAUNCHING PROMPT AND NOT BY ANY ARTIFACT. Before I retrieved anything I had been told (a) that OBJ-4 reported the outcome `retrieved_and_agree`, (b) that its copy came from the IACR ePrint Archive and that arXiv had rate-limited the host, and (c) the sha256 prefix `ccc85233...d3d7` of the PDF.
  what_it_costs: My venue choice was NOT independent of the producer's, so a shared-venue failure - both of us fetching the same wrong bytes from the same archive - is not excluded by my retrieval. And my checksum agreement was not blind, because I knew the expected digest prefix before I computed mine. Knowing the expected OUTCOME also creates confirmation pressure on a comparison whose whole value is that it could have disagreed.
  what_it_does_not_cost: NONE OF THE TEN VALUES WAS DISCLOSED TO ME, and I opened no producer artifact and no transcript before writing and hashing my Phase A block. The extraction that the joint exists to duplicate is intact.
  why_i_report_it: 'An entailment disclosure that is itself incomplete is the failure mode this program keeps hitting. Nobody else could have found this one: it is in a prompt, not in a file, and it leaves no auditable trace. Recorded so a successor sizes J4''s independence correctly. STANDING SUGGESTION for successor blind tasks: the launching prompt is part of the tree a blind agent is handed, and blind_phase_hygiene should say so - CORR-20260905-547849 made the same discovery about commit messages.'
- id: F-13
  severity: informational
  joint: all - a property of this ROUND
  target: the session topology
  finding: THE OBJ-4 PRODUCER AND I SHARE A SCRATCHPAD, AND THEREFORE A TOP-LEVEL SESSION. Its retrieval_log.yaml and external_provenance_diff.yaml publish an absolute scratch path whose session identifier is the same one my own scratch directory carries. I confirmed the directory exists and is readable by me, and used it for the procedure audit.
  what_it_means_for_the_independence_claim: '`independent_session_required: true` on my handoff is satisfied in the sense that matters most - separate contexts, separate task cards, no shared reasoning state, and I wrote and hashed my Phase A before opening anything of the producer''s. But we are subagents of ONE orchestrating session sharing one filesystem, which is weaker than two unrelated sessions on two machines, and a reader should size it that way.'
  what_it_bought: 'It is also why the procedure audit could be as strong as it is: I could check the producer''s retained bytes against my own rather than take its checksums on trust. I record the cost and the benefit together.'
