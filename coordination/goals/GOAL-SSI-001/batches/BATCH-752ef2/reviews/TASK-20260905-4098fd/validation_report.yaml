recommendations:
  status: RECOMMENDATIONS ONLY. NONE IS A DECISION. I approve nothing, promote nothing, change no status, write no ledger record, and commit nothing. The Coordinator composes the round and decides.
  items:
  - id: R-1
    to: the ledger-archive task TASK-20260905-5090ae
    recommendation: Record F-1 (AC-4's unreachable pattern) as a carried-forward item in its own right, not merely as a review finding. It is the third instance in three rounds of this program's named recurring defect class - a control whose firing condition was reasoned about rather than exercised - and the cheap general fix is a meta-check asserting that every pattern of a scanning control fires on at least one constructed input before that control's pass is relied on.
  - id: R-2
    to: the Coordinator, before approving the amendment
    recommendation: Resolve cf_10_raw_path_placement.recorded_tension_the_coordinator_must_resolve explicitly. The draft asks for the ruling and states it would be wrong on that point alone if the Coordinator reads next_actions[4] as requiring one record. Leaving it unresolved is the one way this package's best-handled item becomes a silent inheritance.
  - id: R-3
    to: the Coordinator, before approving the amendment
    recommendation: Scope the F-7 sentence. Any enacting decision that carries `fidelity ... settled and closed` forward should say `to the frozen transcript` in the same sentence, and may cite this round separately for the external limb, which this round establishes for the ten values and for nothing else.
  - id: R-4
    to: the Coordinator
    recommendation: Do NOT treat F-2 or F-3 as reasons to reject the RC-6 package. Both are defects in the package's WARRANTS, both are checkable in a minute, and the conclusion they support survives without them - I re-derived it independently and F-11 corroborates it from two sources outside the frozen file. A successor record noting the two is the proportionate response; superseding an immutable artifact over a two-line coverage gap is not.
  - id: R-5
    to: the successor batch
    recommendation: F-6 - the 3-bit versus 0.75-bit inconsistency at specification.yaml:49 versus :139 and :151 - is a live defect in the frozen contract that no carried-forward item names. It is orthogonal to CF-1, it is cheap, and it bears directly on how any reader interprets the control that clause_3 annotates. It belongs on the CF list.
  - id: R-6
    to: whoever writes the next blind-phase declaration
    recommendation: 'blind_phase_hygiene enumerates control-plane FILES and, since CORR-20260905-547849, commit MESSAGES. F-12 shows the LAUNCHING PROMPT is a third channel: it reached me with the producer''s venue, its outcome and an expected checksum prefix, it is not a file, it leaves no auditable trace, and only the receiving agent can report it. Name it in the rule and require the dispatching session to state what it told the blind agent.'
  - id: R-7
    to: the Coordinator, on the citation prohibition
    recommendation: RETAIN BOTH LIMBS IN FULL. See citation_prohibition_application.recommendation_marked_as_a_recommendation_and_not_a_decision for the reasoning. Marked as a recommendation and not a decision.
  - id: R-8
    to: the successor batch, on J4
    recommendation: The single-venue exposure cannot be closed by a second venue, because there is not one - the paper is not on arXiv and is not journal-published. If the campaign wants more than two same-venue retrievals, the remaining independent channels are the author's own institutional page and the Panny proof-of-concept script that source_record.yaml already names and that nobody has re-fetched. Both are cheap. Neither is the article.
  - id: R-9
    to: any consumer of this report
    recommendation: 'proves_too_much object 3b is worth carrying forward on its own: a DIFFERENT paper on the SAME archive, assessing the same algorithm, contains four of the ten values and matches the title phrase and the author, and would partially pass a containment-style identity check. Only the checksum rejects it. Any future provenance procedure in this program should bind to a checksum and not to value containment.'
