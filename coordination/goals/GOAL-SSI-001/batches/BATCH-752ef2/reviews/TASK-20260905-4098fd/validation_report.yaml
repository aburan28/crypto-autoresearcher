        found: '`then extend into the van Oorschot-Wiener middle-memory regime and explicit superpolynomial-overhead scenarios`. Confirms one regime and one overhead mechanism. No override.'
      - block: frozen_source, created
        lines: 31-32
        found: No scoping effect.
      - block: metrics - the target's own container
        lines: 33-41
        found: A SINGLE FLAT LIST. Seven items, no scenario keys, no conditional items, no per-field-size restriction, and `metrics:` occurs exactly once in the file. metrics[4] at :38 names the same T(w) and the same crossover flag. Nothing scopes metrics[5].
      - block: budget
        lines: 42-45
        found: Run budget only. No scoping effect.
      - block: success_criterion and its note
        lines: 46-52
        found: 'Scopes C1 (declares it an INSTRUMENT SANITY GATE), not C4. Says nothing about the charging law or the crossover. IT ALSO CONTAINS A SEPARATE INTERNAL INCONSISTENCY I found independently: line 49 calls C1''s tolerance `3-bit` while C1''s own tolerance line 139 says `abs deviation <= 0.75 bit`; the 3-bit figure is the STOPPING RULE''s rerun threshold at line 151. The RC-6 package found the same thing and records it as out of scope. See F-6.'
      - block: falsification_criterion and its note
        lines: 53-57
        found: Null with a stated reason. It says no OUTCOME falsifies a hypothesis; it does NOT say a control may fail. C4's force as a contract constraint is untouched.
      - block: model_definition.quantities
        lines: 58-70
        found: 'THE MOST IMPORTANT NEGATIVE FINDING, AND I REACHED IT BEFORE READING THE PACKAGE. It defines seven quantities and DOES NOT DEFINE T(w), so there is no third governing statement of the law. It also carries a REAL NAME COLLISION: `w` at :62 is the Dickman argument log2X/log2B (confirmed by optimizer constraint `w >= 1` at :78 and `w within Dickman grid range`), while `w` in metrics[4], metrics[5], C3, C4 and scenario_definitions.memory_budgets_log2w_entries is the MEMORY BUDGET IN ENTRIES. I tested this as a dissolving reading and it FAILS to dissolve: metrics[5] says `crossover MEMORY log2(w*)` and `capped by M`, and C4 says `At w = M` - all three only type-check in the memory sense. Both targets use the memory sense, so the collision is a separate notational defect and not a scope separation.'
      - block: model_definition.unit_of_cost / unit_of_memory
        lines: 71-73
        found: ONE unit of cost and ONE unit of memory for the whole contract, with byte conversions declared as SCENARIO PARAMETERS rather than as an alternative unit for M or w. A differing-unit reading, in which block A's M and C4's M are one symbol in two units, is CHECKED AND EXCLUDED.
      - block: model_definition.optimizer
        lines: 74-78
        found: Minimizes log2(T_full) over log2B in [1.0, 60.0] step 0.1, constraints on the DICKMAN w. This DETERMINES m rather than freeing it, which is why the m = 0 slice is degenerate rather than a free choice. No scoping effect on either target.
      - block: model_definition.dickman_rho and its four sub-keys
        lines: 79-107
        found: Numerical method for rho only. Read in full. Contains no statement about T(w), the cap, or the crossover.
      - block: scenario_definitions - the container key itself
        lines: '108'
        found: 'A BARE MAPPING KEY, `  scenario_definitions:`, carrying no content. THE RC-6 SCOPE AUDIT OMITS THIS LINE - see F-2. I checked it myself: it cannot scope anything.'
      - block: scenario_definitions.field_sizes_log2p
        lines: 109-114
        found: Five field sizes. No per-field-size override of any metric or control.
      - block: scenario_definitions.memory_budgets_log2w_entries
        lines: 115-121
        found: 'THE PLACE A SCENARIO-SCOPED OVERRIDE WOULD LIVE, AND THE READING THE PLAN MOST WANTS CHECKED. There is none: six bare integers with no attached law, cap, tolerance or exception. Its key NAME is what fixes w''s unit as entries.'
      - block: scenario_definitions.overhead_scenarios
        lines: 122-129
        found: 'Declares the multiplier 2^{c*sqrt(log2 p)} `on T(w)` with c in {0.0, 0.5, 1.0, 2.0}. Block A''s own factor. BINDS the targets together. Note c = 0.0 is declared, so the conflict is not an artefact of the overhead: at c = 0, A reduces to t - dd and every derivation above is unchanged.'
      - block: scenario_definitions.bytes_per_entry
        lines: 130-132
        found: Byte conversion parameters only. No scoping effect.
      - block: controls - the container key itself
        lines: '133'
        found: 'A BARE MAPPING KEY, `  controls:`, carrying no content. THE RC-6 SCOPE AUDIT OMITS THIS LINE TOO - see F-2. I checked it myself: it cannot scope anything.'
      - block: controls[0] C1-sanity-paper-pairs
        lines: 134-141
        found: A DIFFERENT QUANTITY OF A RELATED NAME. It governs reproduction of the source's five pairs against a two-sided 0.75-bit tolerance. It constrains neither T(w), nor the cap, nor the crossover, and it does not scope C4.
      - block: controls[1] C2-baseline-consistency
        lines: 142-144
        found: Fixes log2(T_DG) = log2(p)/2, which is block A's own T_DG. BINDS block A into the controls' scope rather than separating it. Its five parenthesised baseline figures are not restated in this report and are not needed for any derivation here.
      - block: controls[2] C3-monotonicity
        lines: 145-147
        found: Same scope, no qualifier. Its SECOND CLAUSE (`T(w) must equal T_full for w >= M`) logically CONTAINS C4's assertion, which is that clause at the single point w = m - the basis of F-3. Its FIRST CLAUSE (monotonicity) is what powers my derivation 3 and is genuinely additional.
      - block: controls[3] C4-vow-asymptote
        lines: 148-149
        found: The target. No qualifier, no scenario restriction, no exception clause, no tolerance.
      - block: stopping_rules
        lines: 150-154
        found: Rule 1 conditions a rerun on C1, not on C3 or C4. Rule 2 is the infrastructure rule. Neither weakens, scopes or excuses C4, and neither mentions the crossover.
      - block: honesty_constraints
        lines: 155-159
        found: 'Checked for the reading that metrics[5] is a QUOTATION of the source''s convention rather than this contract''s own statement. NOT SUPPORTED: the line stands in this contract''s metrics list, in this contract''s own symbols (T_full, T_DG, M, c), and the honesty clause governs interpretation of results, not ownership of formulas.'
      - block: required_artifacts
        lines: 160-167
        found: No scoping effect.
      my_scope_conclusion: THE TWO TARGETS ARE IN THE SAME SCOPE. One regime, one T(w) (undefined but singular), one T_full, one M, one unit of memory, one overhead multiplier applied to that same T(w), one version, one flat metrics list and one flat controls list with no scenario restriction anywhere, and no superseding block. The one name collision found (`w`) resolves to the memory sense in BOTH targets. The coordinator_prior's 0.2 alternative - that the blocks are not in the same scope - is REFUTED, and I refute it from the file myself rather than by agreeing with the producer.
      coverage_audit_of_the_producers_claim: The RC-6 scope audit asserts `The file is 167 lines and every line is inside exactly one entry of this enumeration, so the enumeration is exhaustive by construction.` I checked that mechanically. Its 26 entries cover 165 of 167 lines with no overlaps; LINES 108 AND 133 ARE IN NO ENTRY. Both are bare container keys (`  scenario_definitions:` and `  controls:`) with no content, which I verified by reading them, so the omission hides no scoping block and changes no conclusion - but the sentence as written is false, and `exhaustive by construction` is the warrant the whole audit's completeness rests on. Recorded as F-2.
    the_seventh_reading_i_looked_for:
      why: The plan asks whether there is a reading the author missed that makes the contract satisfiable. The RC-6 package examines six and rejects each. I examined its six, agree with all six rejections, and constructed two more it does not consider.
      new_reading_1:
        reading: '`crossover memory log2(w*)` is a memory FRACTION w*/M, not an absolute memory in entries. Under that reading w*/M = (T_full*2^h/T_DG)^2, i.e. w* = M*(...)^2, which is EXACTLY the m-carrying form, and the contract becomes satisfiable for every m.'
        why_it_is_the_strongest_purely_algebraic_candidate: It repairs the formula by reinterpretation alone, changes no character of the file, and would turn a `reproduced` verdict into a misread of a units convention - precisely the outcome the batch contracts as valuable.
        verdict: REJECTED, and rejected from the file's own text.
        why_rejected: '(a) The clause `capped by M` is incoherent for a fraction: capping a ratio w*/M at M has no meaning, while capping an absolute memory at M is exactly right. (b) scenario_definitions.memory_budgets_log2w_entries at spec:115 names w in ENTRIES, and metrics[5] uses the same symbol. (c) C4''s `At w = M` compares w to M directly, which only type-checks if w is absolute. (d) metrics[6] at :41 converts memory to BYTES at 64 and 256 bytes per ENTRY, which presupposes an absolute entry count.'
      new_reading_2:
        reading: The token `analytic:` marks the closed form as a declared APPROXIMATION rather than as this contract's definition of the crossover, so it need not be the exact inverse of the law C3 and C4 constrain, and a contract may legitimately carry both an exact routine and a rough analytic estimate.
        why_it_is_the_strongest_candidate_overall: It is the one reading that does not need the algebra to be wrong. It concedes every step of the derivation and denies only that the two blocks are required to agree.
        verdict: REJECTED, but it is the one an enacting Coordinator should see stated, because it is the reading a defender of the contract would actually take.
        why_rejected: '(a) It is the ONLY statement of w* anywhere in the file, so under any reading it is the definition by default - there is no exact routine for it to approximate. (b) `analytic` contrasts with `numeric` or `grid-searched`, not with `exact`; the same list at :36 declares log2M and log2T_full with units and nobody reads those as non-binding. (c) THE DECISIVE ONE: the omitted term is exactly log2 M - the whole memory scale, and precisely the quantity the same clause caps the result BY. A discrepancy equal to the cap is not an approximation error of the capped quantity. (d) metrics[4] at :38 declares a per-scenario `crossover flag`, which cannot be computed from an avowed approximation without a definite crossover to flag against.'
      the_six_the_package_examined: I read all six and independently agree with each rejection. The one I checked hardest is the sixth - that metrics[5] is a superseded remnant already replaced by a recorded amendment - because it is the only one that could be settled by a fact outside the file. I verified that fact myself; see F-11.
    concrete_objection_recorded_for_J1: F-2 (the exhaustiveness warrant is false in two lines) and F-3 (the C3-independence claim overstates the logic). I also searched for the breaking artifact the plan names - a block that scopes, overrides or supersedes either target, a satisfying set larger than {m = 0}, a step that does not follow from the file, or a producer argument claiming contradiction at m = 0 as well - and FOUND NONE. The search is the twenty-six-block enumeration above plus the two new dissolving readings, and it is recorded so the absence is auditable rather than asserted.
