proves_too_much_control:
  assigned_by: review_plan.yaml proves_too_much, assigned_to TASK-20260905-4098fd
  instruction_i_followed: Run it on ALL FIVE declared objects including the positive control, and report what each procedure ACTUALLY DID on each, not what it should have done. A pass where the conclusion is known false is a BREAK and is reported as one.
  objects:
  - object: 1. SATISFIABLE CONTROL CONTRACT - a synthetic pair of blocks in the shape of a metrics line and a control, constructed so a single charging law satisfies both on an OPEN SET. `This contract is internally unsatisfiable` is KNOWN FALSE for it.
    required_behaviour: must return SATISFIABLE
    how_i_built_it: 'THREE of my own, not the producer''s: (alpha=1, beta=3, delta=0), (alpha=1, beta=-2, delta=0), (alpha=1, beta=0.5, delta=0). Each is the real shape with the log2 M term restored in the crossover, at three different betas including a negative one.'
    what_the_procedure_ACTUALLY_DID: Returned `satisfiable_unconstrained` on all three, with the reason `the cap condition is an identity in m`, and AC-1 verdict `pass` on all three.
    verdict: CORRECT. NOT A BREAK.
    and_my_own_argument_on_the_same_object: My derivations 1-3 applied to alpha=1 give G(y) = t - (y - m)/2, hence G(m) = t, hence C4 is satisfied for EVERY m. My argument returns satisfiable too. It does not prove too much.
  - object: 2. DEGENERATE WITNESS - the REAL pair of blocks evaluated at the one point where the reproduction itself concedes they are jointly satisfiable. `There is no satisfying assignment` is KNOWN FALSE at that point.
    required_behaviour: must return SATISFIABLE AT THAT POINT and must say so in the same words the real derivation uses
    how_i_built_it: Called ac2_degenerate_witness_control on the real shape (alpha=0, beta=2, delta=0) with witness m = 0, and separately re-derived the point myself.
    what_the_procedure_ACTUALLY_DID: Returned `satisfiable_only_on_slice` with m_solution = -0.0, degenerate = true, witness_is_in_satisfying_set = true, AC-2 verdict `pass`. The reproduction's prose says the same thing in the same words - satisfying_set.complement reads `The defect is therefore "unsatisfiable except on the degenerate slice m = 0", NOT "unsatisfiable unconditionally"`.
    verdict: CORRECT. NOT A BREAK. Neither the producer's argument nor mine reports a contradiction at m = 0.
    and_my_own_argument_on_the_same_object: My forced law G(y) = t - y/2 gives G(m) - t = -m/2, which is 0 exactly at m = 0. My argument concedes the point too.
  - object: '3. DECOY EXTERNAL SOURCE - a retrieved document that is NOT the article: an abstract or landing page, a different paper by the same author, or a differently-dated version, offered to the provenance procedure as `the published copy`.'
    required_behaviour: must REJECT the document as not the article, NAMING THE FIELD THAT CAUGHT IT
    how_i_built_it: 'THREE decoys, all real objects I fetched or constructed. (3a) The ePrint LANDING PAGE for 2026/1486, offered as the published copy. (3b) A DIFFERENT PAPER: ePrint 2026/1821, Maher Mamah, `Concrete Security Assessment of Isogeny-based Cryptography with the new Isogeny-Path algorithm`, 31 pages, which ASSESSES THIS VERY ALGORITHM and cites it by number - the nastiest available decoy, and a real document I fetched from the same archive. (3c) A byte-mutated copy of the real article (one bit flipped at offset 100000), standing in for a differently-dated version, since the archive has only one version so no real second version exists.'
    what_the_procedure_ACTUALLY_DID:
    - '3a LANDING PAGE: REJECTED. Field that caught it: content-type - it is text/html, not application/pdf, so it is not the article.'
    - '3b THE CITING PAPER: REJECTED. Field that caught it: sha256 does not equal the declared digest. AND THE INSTRUCTIVE PART: this decoy CONTAINS FOUR OF THE TEN VALUES (at log2 p = 256 and 512, both coordinates), matches the title phrase, and matches the author name. A containment-style identity check - `does this document contain these numbers and mention this title and author?` - would have PARTIALLY ACCEPTED IT. Only the checksum rejects it. This is a live instance of the BATCH-dc1424 OBJ-3 failure mode in a NEW place, and it is the concrete demonstration that a value-containment check is not an identity check.'
    - '3c BYTE-MUTATED COPY: REJECTED. Field that caught it: sha256. Note it contains ALL TEN values and matches title and author - only the checksum separates it from the real article.'
    verdict: CORRECT ON ALL THREE. NOT A BREAK. The procedure named a different catching field on the landing page than on the two PDFs, which is what a real gate does.
    what_the_producers_procedure_did_on_the_same_class: Its retrieval_log records the landing page explicitly as `ABSTRACT / LANDING PAGE. THIS IS NOT THE ARTICLE and NO VALUE WAS TAKEN FROM IT`, and records that 2026/1821 cites 2026/1486 and `was NOT used as a source of any value`. It handled both decoys correctly, unprompted, before any reviewer raised them.
  - object: 4. UNIT DECOY - the ten values with the five of one kind transformed by a constant additive offset corresponding to a different declared unit; the transformation DEC-20260904-4c81b6 OBJ-1 identifies as producing a clean, symptomless error. `These agree with the frozen transcript in the same unit` is KNOWN FALSE.
    required_behaviour: must return DISAGREE or NOT COMPARABLE, and must NEVER return agreement by silently absorbing a unit change
    how_i_built_it: Took MY OWN ten from the hashed phase_a block and added +6.0 bits to the five MEMORY values (the 64 bytes/entry conversion the contract declares at spec:130-132 and that cost_model.py emits per OBJ-1), leaving the five time values untouched; then repeated at +8.0 bits (256 bytes/entry). Ran my comparison procedure unchanged.
    what_the_procedure_ACTUALLY_DID: '+6.0 decoy: 5 of 5 memory values DISAGREE beyond tolerance; 0 of 5 time values disagree. Verdict DISAGREE. +8.0 decoy: 5 of 5 memory values DISAGREE; 0 of 5 time values disagree. Verdict DISAGREE.'
    verdict: CORRECT ON BOTH. NOT A BREAK. The procedure does not absorb a unit change, and the asymmetry - memory disagrees, time does not - is exactly the signature the decoy is designed to produce, which shows the procedure is discriminating on the right coordinate rather than rejecting everything.
    the_honest_caveat_on_this_object: My procedure catches it because +6.0 bits is far larger than the +/-0.05 tolerance, NOT because it type-checks units. A unit change with an offset SMALLER than the tolerance would pass. The real defence against OBJ-1 is the serialization requirement the RC-6 amendment drafts, not this comparison.
  - object: 5. POSITIVE CONTROL, WHICH IS NOT OPTIONAL - the real contract for the first two objects, and the frozen transcript compared against itself for the last two. A procedure that rejects EVERY object has rejected the decoys for no reason.
    required_behaviour: must ACCEPT
    what_the_procedure_ACTUALLY_DID:
    - 'Objects 1-2 limb, the REAL contract: solve_joint(alpha=0, beta=2, delta=0) returns `satisfiable_only_on_slice` with m_solution = -0.0 and degenerate = true. That is the ACCEPT for the reproduction''s own claim - it is exactly the finding the reproduction records, neither stronger (`unsatisfiable_everywhere`) nor weaker (`satisfiable_unconstrained`). The engine placed the real contract in a THIRD verdict class distinct from both decoy classes.'
    - 'Objects 3-4 limb, the article and the transcript against themselves: my identity gate ACCEPTED the real article I retrieved (13 pages, title phrase present, author present, sha256 matches the declared digest, all ten values locatable). My comparison procedure ACCEPTED the frozen transcript compared against itself, 10 of 10 within tolerance.'
