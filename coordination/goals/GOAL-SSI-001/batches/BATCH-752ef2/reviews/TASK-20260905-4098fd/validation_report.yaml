joint_verdicts:
  J1:
    joint: J1 independent reproduction of the contract defect, from the frozen file alone
    verdict: CONFIRMED WITH CAVEAT
    one_line: 'The defect is real and reproduces from the frozen file alone. I re-derived it myself, by a different route from the producer''s, reached the SAME satisfying set R x {0}, and independently corroborated it against two sources the producer did not use. The caveats are about the package''s WARRANTS, not its conclusion: its exhaustiveness claim is literally false in two lines (F-2), and its claim that C3 corroborates ''independently of C4'' overstates the logic (F-3).'
    i_read_the_whole_file: experiments/EXP-WESOVOW-001/specification.yaml, all 167 lines, rendered with line numbers, before reading any producer artifact. I did not work from the producer's two quoted excerpts.
    my_own_rederivation:
      notation_all_base_2_logs:
        t: log2 T_full, the full-memory time in F_{p^2}-operations. Defined once, at spec:70.
        m: log2 M, the full-memory table size in entries. Defined at spec:65-66; declared `(memory, entries)` at spec:36.
        y: log2 w, a memory budget in table entries. The unit is fixed by the key name at spec:115, `memory_budgets_log2w_entries`.
        dd: log2 T_DG, the Delfs-Galbraith baseline. Control C2 at spec:142-144 fixes it as log2(p)/2.
        h: the overhead in bits, c*sqrt(log2 p). spec:122-125 declares it as an explicit MULTIPLIER 2^{c*sqrt(log2 p)} ON T(w).
        A: t + h - dd, the overhead-inflated gap of the full-memory time to the baseline.
        G: G(y) := log2 T(2^y), i.e. the charging law in log-log form. NOWHERE DEFINED IN THE FROZEN FILE - see the next key.
      the_fact_that_makes_the_two_blocks_bear_on_each_other: THE FROZEN CONTRACT DEFINES NO T(w) ANYWHERE. model_definition.quantities (spec:58-70) defines log2X, w (the Dickman argument), log2Psi, log2M, u, log2P0 and log2Tfull, and stops. metrics[4] at spec:38 NAMES `log2 T(w)` as a reported quantity without defining it. So the only statement in the whole file from which a charging law can be recovered is metrics[5] at :39-40, and C3/C4 are constraints on that same law. I established this myself by reading the file; the RC-6 package states it too and it is correct.
      what_block_A_says: 'spec:39-40, verbatim: `- crossover memory log2(w*) per (p, overhead c), analytic: w* = (T_full * 2^{c*sqrt(log2 p)} / T_DG)^2, capped by M`. In logs: log2 w* = 2*(t + h - dd) = 2A, capped at m; i.e. log2 w* = min(2A, m). THERE IS NO m TERM IN THE UNCAPPED EXPRESSION.'
      what_crossover_means_in_this_file: 'metrics[4] at spec:38 reports `log2 T(w), log2 speedup vs T_DG, crossover flag` per (p, w, overhead c). So the crossover memory is the budget at which the overhead-inflated time meets the baseline: G(y*) + h = dd.'
      what_block_B_says: 'C4 at spec:148-149, verbatim: `At w = M, vOW time must equal T_full exactly (cap check)`. In symbols: G(m) = t.'
      what_C3_says: 'C3 at spec:145-147, verbatim: `T(w) must be non-increasing in memory budget w for every (p, overhead) scenario; T(w) must equal T_full for w >= M`. In symbols: G non-increasing in y, and G(y) = t for all y >= m.'
      derivation_1_the_slice:
      - 'Block A read as the analytic identity its own text declares (`analytic:`) means: for every attainable A, the value 2A IS the crossover, so G(2A) + h = dd, i.e. G(2A) = t - A.'
      - 'Substituting y = 2A gives G(y) = t - y/2 on the uncapped range. This is FORCED, not posited: an identity over a continuum of A determines G on an interval. (The producer instead posits an affine family over ~20 grid points; see F-4.)'
      - C4 requires G(m) = t. Evaluating the forced form at y = m gives t - m/2 = t, hence m = 0.
      - 'SATISFYING SET: S = { (t, m) in R x R : m = 0 } = R x {0}. t is entirely unconstrained; the whole conflict lives in the memory coordinate.'
      - This is the SAME set the RC-6 package records, reached without its step-4 posit.
      derivation_2_the_same_thing_from_the_law_the_ARTICLE_states:
      - 'The published article I retrieved in Phase A states the vOW law in its own words on page 2: `The time-memory tradeoff of van Oorschot-Wiener [43] solves a claw-finding problem of this size in time essentially sqrt(N^3/w) = p^{1/2+o(1)}/w^{1/2} with memory w`, with N the claw-set size and, in Section 4.1, memory ~= M and time ~= M/P0.'
      - 'In logs, with T_full = M/P0: G(y) = t + (m - y)/2 for y <= m, and G(y) = t for y >= m. I checked this law against the contract''s own controls with sympy: G(m) - t = 0 (C4 SATISFIED) and dG/dy = -1/2 <= 0 (C3 SATISFIED). So the article''s law is a legitimate witness law for the two controls.'
      - The TRUE crossover under that law solves G(y) + h = dd, giving log2 w* = m + 2A.
      - Block A says log2 w* = 2A. The symbolic difference (true minus stated) is EXACTLY m. The two agree for all parameters if and only if m = 0.
      - 'Reproduce with: sympy, logT = t + (m - y)/2; solve(Eq(logT + h, d), y) -> -2*d + 2*h + m + 2*t; subtract 2*(t + h - d) -> m.'
      derivation_3_a_stronger_objection_the_package_did_not_record:
      - This one needs NO functional form for the law at all, only C3's two clauses and the meaning of `crossover`.
      - C3 gives G non-increasing in y with G(y) = t for y >= m, hence G(y) >= t for EVERY y.
      - 'Therefore, whenever A > 0, G(y) + h >= t + h = dd + A > dd for every y: the overhead-inflated time never meets the baseline and NO CROSSOVER EXISTS ANYWHERE.'
      - Block A nevertheless returns the finite, well-defined value min(2A, m) in that regime. It asserts the existence of an object C3 forbids.
      - And when A < 0, block A's uncapped branch returns log2 w* = 2A < 0, i.e. a `crossover memory` of LESS THAN ONE TABLE ENTRY, in a contract whose unit_of_memory is table entries (spec:72) and whose declared budgets start at 2^30 (spec:115-121).
      - 'OFFERED AS AN ADDITION TO THE RECORD, NOT AS A CORRECTION: it strengthens the finding and it is what C3 genuinely contributes beyond C4. It is NOT the argument the RC-6 package makes from C3, which is why F-3 says the package''s C3 route is not independent while C3 itself does add something.'
      degenerate_witness_confirmed: 'AT m = 0 THE PAIR IS SATISFIABLE, and I confirm it in the same words: the forced law G(y) = t - y/2 satisfies C4 exactly when m = 0. The finding is `unsatisfiable except on the degenerate slice m = 0`, NEVER `unsatisfiable unconditionally`. The RC-6 package says exactly this (satisfying_set.complement) and does not overclaim.'
      why_m_equals_0_is_degenerate_and_not_a_rescue: 'M = 1 table entry puts the entire declared memory-budget grid {2^30..2^80} above M, so every declared scenario sits in the flat cap regime and metrics[4]''s log2 T(w) is constant across the whole grid; it makes C3 vacuous; and it makes metrics[6] (`memory in bytes for 64 and 256 bytes/entry`) pointless. I reached these independently and the RC-6 package records the same three plus a fourth. NEITHER IT NOR I EVALUATES WHAT m ACTUALLY IS at any field size: that would require executing cost_model.py, which is absolutely prohibited, and it is not needed.'
    my_scope_audit:
      question: Are metrics[5] and C4 in the same scope at all - not one scenario-scoped and the other global, not one superseded, not two different quantities sharing a name?
      method: 'I partitioned specification.yaml mechanically: the file has exactly 25 top-level keys under `experiment:` (verified by yaml.safe_load and by a regex over two-space-indented keys), plus line 1 `experiment:`. I then checked each for a scoping, overriding, restricting, superseding or redefining effect on either target.'
      blocks_that_could_have_scoped_either_target_and_what_i_found:
      - block: experiment header id/version/status/approved_by/approved_by_task
