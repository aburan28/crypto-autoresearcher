        found: 'BINDS THE TWO TOGETHER rather than separating them: it names `the van Oorschot-Wiener middle-memory regime` as the single regime of the whole contract, which is the regime C4''s `vOW time` and block A''s crossover both speak about.'
      - block: role
        lines: '11'
        found: '`role: executor`. No scoping effect.'
      - block: schema_repair_note
        lines: 12-18
        found: DECISIVE FOR THE VERSION QUESTION. It records that the 2026-08-02 nesting under CORR-20260802-013 was `Field renames only` and that `No objective, model definition, scenario, control, metric, budget, stopping rule or honesty constraint is added, removed or reworded.` So both targets are original approved text and neither is a stale remnant of the repair.
      - block: hypothesis_id and its note
        lines: 19-23
        found: Observation-only declaration. No scoping effect on either target.
      - block: objective
