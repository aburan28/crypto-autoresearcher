      why: A declared scan-exempt region is a hole in a control, and the question is whether the hole is the size it is declared to be.
      what_i_did: Called exempt_line_ranges() directly on all three artifacts.
      result: 'EXACTLY ONE exempt region exists in the whole package: category_and_licensing_analysis.yaml lines 181-189, nine lines. It begins at `    superseded_broad_framing_quoted_for_disclaimer_only: >-` and ends at `      \`>=\` figures is itself the defect."`, and the very next line is `    plain_statement_of_what_is_not_asserted: >-` at the same indent, i.e. the region stops at the sibling key and does not swallow it. protocol_amendment_draft.yaml and defect_reproduction.yaml have ZERO exempt regions, so the exemption cannot be blanking anything in them.'
      and_the_converse_limb: 'ac4_affirmation_check fires on protocol_amendment_draft.yaml and on category_and_licensing_analysis.yaml (pass) and not on defect_reproduction.yaml (FAIL). The self_check''s all_pass() uses `any(...)` over the affirmation results, which is correct: the reproduction artifact is not where an affirmation belongs. I confirmed this is deliberate and not a masked failure by reading the all_pass() source.'
