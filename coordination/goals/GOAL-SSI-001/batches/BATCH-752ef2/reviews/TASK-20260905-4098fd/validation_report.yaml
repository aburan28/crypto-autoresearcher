    method_1_my_own_sentence_level_hand_scan:
      what: I normalised protocol_amendment_draft.yaml, category_and_licensing_analysis.yaml and defect_reproduction.yaml across YAML line folds, split into sentences, and printed EVERY sentence containing `two-sided`, `one-sided`, `two sided`, `one sided` or `lower bound`, with its line number. I then read all of them.
      result: SIXTEEN such sentences across the three artifacts. Exactly ONE states the superseded framing, and it is inside the declared exempt region of category_and_licensing_analysis.yaml (lines 181-189), introduced by `What follows is quoted solely in order to disclaim it, is recorded as SUPERSEDED by DEC-20260904-4c81b6 PD-8, and is NOT asserted anywhere in this package`. Every other sentence affirms the narrow form or affirms the two-sided test.
      the_affirmations_i_verified_by_hand:
      - 'protocol_amendment_draft.yaml L257 (clause_3): `Its target is the source''s ARITHMETIC, and a reimplementation landing above the source''s figure is as suspect as one landing below, so the two-sided 0.75-bit tolerance is CORRECT FOR C1''S OWN DECLARED PURPOSE and is retained here unchanged.`'
      - 'protocol_amendment_draft.yaml L112 (target.secondary_annotation_only): `The two-sided 0.75-bit test is not changed, not widened, not narrowed, and not made one-sided.`'
      - 'category_and_licensing_analysis.yaml L173: `The two-sided test is therefore CORRECT for C1''s own declared purpose, is retained unchanged by the draft amendment, and is not weakened by any clause of it.`'
      - 'category_and_licensing_analysis.yaml L253: `C1''s instrument-sanity verdict, unchanged: the two-sided test remains the right test for the question C1 asks, and an off_curve status is not a reason to relax it.`'
