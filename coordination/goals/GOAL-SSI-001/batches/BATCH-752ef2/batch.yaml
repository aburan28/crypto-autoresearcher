  authority_read_note: >-
    The goal head field above was read directly from
    ledger/goals/GOAL-SSI-001/goal.yaml by this authoring task. This task holds
    Read/Grep/Glob/Write/Edit and NO SHELL, so it could not run
    `python3 tools/goal_head.py show GOAL-SSI-001 --field next_action`; the
