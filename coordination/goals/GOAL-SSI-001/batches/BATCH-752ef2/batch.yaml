# TASK-20260905-a210bd - which must extract ten numbers from an externally
# retrieved copy of a paper BEFORE it is allowed to see this program's own copy -
# can read it in full without learning anything it is supposed to discover.
# Consequently: no value of the EXP-WESOVOW-001 PAPER_PAIRS mapping appears here,
# no composed verdict token of the BATCH-dc1424 RC-1 round appears here, and the
# three constraints that bind the RC-6 amendment are named BY LOCATOR only and
# quoted in full on exactly one task card, which that agent does not read.
# The protection is declared mechanically below (blind_phase_hygiene), not in
# prose: CORR-20260905-547849 is the worked example of a prose rule that a
# `git log` walked straight past.
batch:
  id: BATCH-752ef2
  goal_id: GOAL-SSI-001
  question_ids:
