      - label: PAPER_PAIRS pair value 5 of 10
        locator: cost_model.py line 63, first numeric token after the leading key token
      - label: PAPER_PAIRS pair value 6 of 10
        locator: cost_model.py line 63, second numeric token after the leading key token
      - label: PAPER_PAIRS pair value 7 of 10
