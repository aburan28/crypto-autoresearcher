    protected_sha256_status: >-
      ARMED 2026-09-05 by the dispatching session, which holds a shell. The eleven
      digests below were produced by running this file's own arming recipe, which
      extracts each value BY LOCATOR from experiments/EXP-WESOVOW-001/cost_model.py
      lines 61-65 and from the BATCH-dc1424 checkpoint shard rather than by
      transcription, and asserts: exactly two values on each of the five lines,
