      history check fire on ordinary sentences and teach every reader to ignore
      it, which is worse than not running it. The arming procedure below asserts
      that no protected digest is the digest of a field size.
        protected_sha256_status: >-
      ARMED 2026-09-05 by the dispatching session. The eleven digests below were
      computed by running this file's own arming recipe, which extracts each value
      BY LOCATOR from experiments/EXP-WESOVOW-001/cost_model.py lines 61-65 and from
      the BATCH-dc1424 checkpoint shard rather than by transcription, and asserts:
