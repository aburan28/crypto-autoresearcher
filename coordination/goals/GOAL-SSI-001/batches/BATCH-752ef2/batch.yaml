    experiments/EXP-WESOVOW-001/specification.yaml,
    experiments/EXP-WESOVOW-001/cost_model.py, every artifact under
    experiments/EXP-WESOVOW-001/runs/, and everything under
    inputs/P13-WESOLOWSKI-2026/ are READ-ONLY for every task in this batch. They
