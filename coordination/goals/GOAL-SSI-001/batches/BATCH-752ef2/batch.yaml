        rationale:
          - >-
            CF-1 IS THE GATING DELIVERABLE BECAUSE IT IS THE CAMPAIGN'S OLDEST
            UNDISCHARGED ADVERSE FINDING AND IT IS NOW UNBLOCKED. DEC-20260904-166ab5
            deferred it pending RC-1 on an explicit maintainer ruling; RC-1 ran,
            DEC-20260904-4c81b6 composed it, and the goal head names the amendment
            as the single next research action. A frozen contract that no reader
            can satisfy silently invalidates every control keyed to it, and it has
            now survived three batches.
          - >-
            THE DELIVERABLE IS AN AMENDMENT RECORD, NOT AN EDIT, AND THE CARD SAYS
            SO FOUR TIMES. specification.yaml is frozen and appears in no write
            scope in this batch. The single most likely way this task goes wrong is
            an agent that "fixes" the file; the second is an agent that drafts an
            amendment whose premise is a defect it never reproduced. The card
            therefore requires the defect to be reproduced from the frozen file
            alone, with line locators and the algebra written out, in a SEPARATE
            artifact finalized before the amendment is drafted.
          - >-
            RC-1'S OUTCOME CONSTRAINS THE AMENDMENT IN THREE WAYS AND THEY ARE
            QUOTED VERBATIM ON EXACTLY ONE CARD. They are not restated in this
            file, in the queue, or in any other card, because stating them
            discloses the composed RC-1 verdict to an agent whose whole value is
            not knowing it. This is PD-6 of DEC-20260904-4c81b6 applied at batch
            level: the control plane states assignments and decoy constructions,
            never properties of the protected object.
          - >-
            THE SECOND CONSTRAINT IS THE ONE MOST LIKELY TO BE BREACHED, AND IT
            HAS A CONTROL. DEC-20260904-4c81b6 PD-8 records that this program had
            been framing the one-sided-versus-two-sided question more broadly than
            the evidence supports, and adopts the Red Team's narrower OBJ-2 form:
            for control C1's own declared instrument-sanity purpose the two-sided
            test is CORRECT, and the defensible defect is that the SERIALIZED
            `paper_pair` values escape carrying neither the relation nor the unit.
            The broad framing is rhetorically easier and is what a drafting agent
            will drift back to. Control AC-4 exists because I expect that drift,
            and it has a positive control so its pass carries information.
          - >-
            EVERY CONTROL ON THE RC-6 CARD NAMES THE INPUT THAT MAKES IT FAIL, ON
            A REAL OBJECT, AND HAS A POSITIVE CONTROL. DEC-20260904-166ab5 refuted
            a control of an earlier round for having no reachable failure branch,
            so its pass carried no information; DEC-20260904-4c81b6 F-3 found the
            successor defect - a firing condition asserted from a mental model
            rather than read out of the instrument. AC-1 through AC-4 each state
            the input, require the branch to be FIRED, and require the positive
            control to be fired too.
          - >-
            OBJ-4 IS DISPATCHED IN PARALLEL BECAUSE IT IS CHEAP, DECISIVE, AND
            INDEPENDENT, AND BECAUSE IT IS THE ONLY REMAINING CHECK OF ITS KIND.
            Every fidelity result this program holds compares the frozen
            transcript against itself or against code derived from it;
            DEC-20260904-4c81b6 records that as the largest residual uncertainty
            in its J5 and records that no further internal re-transcription can
            reduce it. Ten characters of external comparison collapse it, or fail
            to and say why.
          - >-
            OBJ-4'S BLINDNESS IS DECLARED MECHANICALLY, WHICH IS THE WHOLE
            DIFFERENCE FROM LAST ROUND. CORR-20260905-547849 records a prose rule
            defeated by a commit message, because `blind_from` is a list of FILES
            and a commit message is not a file. This batch declares
            blind_phase_hygiene.protected_sha256 - digests, never preimages, since
            the batch file is exactly what the blind agent must read - and binds
            dispatch of both blind tasks to the arming procedure having run and to
            `--blind-history` having been run on the exact ref handed over. The
            declaration is EMPTY as authored and the tool reports UNCHECKABLE
            until it is armed; that is the honest state and is recorded as such
            rather than papered over with a placeholder digest that would make the
            checker report a false PASS.
          - >-
            THE ARCHIVE GATES MATCH WHAT THE DISPATCHER ACTUALLY ENFORCES.
            BATCH-dc1424's ledger-archive gate said the commit "changes exactly
            the five declared paths", which is NARROWER than
            tools/research_dispatch.py, whose expected set is the archive task's
            own artifact_paths UNION every source task's artifact_paths, and which
            additionally requires path_sha256 to cover that whole union on a
            completed archive. That mismatch cost a rejected archive. Both archive
            cards here state the union explicitly, enumerate it, and name the
            count.
          - >-
            THE ROUND GETS A REVIEW PLAN THE TOOL CAN ACTUALLY CONSUME. PD-2 of
            DEC-20260904-4c81b6 recorded the independence gate as OUTSTANDING
            because no `review_plan` file existed in a form the checker resolves.
            Here the plan is a standalone file with a top-level `review_plan`
            mapping, it is the only such file in the batch directory, no task card
            carries a plan block, and the coordinator prior is recorded in it
            before any task runs.
          - >-
            THE SOURCE-RECORD EDIT THE GOAL HEAD ASKS FOR IS DELIBERATELY NOT
            PERFORMED BY A PRODUCER. The provenance block is drafted as a separate
            artifact and the attachment to
            inputs/P13-WESOLOWSKI-2026/source_record.yaml is named as a successor
            Coordinator act on reviewed evidence. An unreviewed producer edit to a
            frozen provenance record is the act this campaign has refused twice,
            and if the retrieval disagrees with the transcript the correct
            successor is a correction under a new identifier, not an addendum.
          - >-
            ONE REVIEWER IS A COST AND IS RECORDED AS ONE. Five identifiers were
            pre-allocated and this authoring task cannot mint a sixth; the host
            runs two tasks at a time. The RC-6 argument is therefore checked once,
            by one adversarial session. Nothing is promoted by this batch, the
            amendment stays a draft, and a red-team pass on it is a named
            precondition for approving it.
          - >-
            EVERY CARRIED-FORWARD ITEM IS NAMED WITH ITS ORIGIN AND ITS DISPATCH
            STATE, INCLUDING THE ONES DELIBERATELY HELD. CF-9 is cheap, unblocked
            and NOT dispatched, for a scheduling reason that is stated and that
            asserts nothing about its value. Unlimited ECC budget removes the
            batch ceiling and not the duty to rank; a third producer competing for
            four cores would change what neither of the two ranked tasks
            concludes.
