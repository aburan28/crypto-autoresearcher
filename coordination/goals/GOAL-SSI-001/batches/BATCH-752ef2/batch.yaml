      6238cb841755fdaeedd3c7372557d6be0a7c1340309897c9fb00e9fd01bab081: "the composed RC-1 verdict token"
    blind_base_commit_determined_by_running_the_check: >-
      856ca9fec58fd2240542e96d0c9d2a4bf0d5213b. THE ARMED CHECK FIRED ON ITS FIRST
      REAL USE AND THE FINDING IS MATERIAL: run against HEAD it reports ALL ELEVEN
      protected values stated in reachable commit messages, because commit 6eacc1fdf
      -- the leak CORR-20260905-547849 records -- reached `main` when PR #739 merged.
      Every tree derived from current `main` therefore discloses this batch's
      protected set to anyone who runs `git log`. That is not repairable by
      rewriting history, which is forbidden over archived run records and would
      destroy the evidence of the defect.
      So the blind tasks are given a worktree at 856ca9fec, the last `main` commit
      before that merge, which the checker clears over 400 reachable commits; the
      four control-plane files they need are copied in, each already shown by the
      self-check above to state zero protected values. Blindness is thereby a
      property of the tree handed over, verified by running the check on that exact
      ref, rather than a property asserted of a rule.
      COST, STATED: 856ca9fec predates this batch, so the blind agent's checkout
      does not contain BATCH-752ef2 and cannot be used to reconstruct the batch from
      its own history. Its assignment reaches it as copied files and prompt text.
    arming_procedure:
      run_by: the dispatching session, which holds a shell
      when: >-
        BEFORE the batch control plane is committed, and in any case BEFORE
        TASK-20260905-a210bd or TASK-20260905-4098fd is dispatched.
      recipe_not_run_by_this_task: |
        python3 - <<'PY'
        import hashlib, json, pathlib, re
        NUM = re.compile(r"-?\d+(?:\.\d+)?(?:[eE][-+]?\d+)?$")
        TOK = re.compile(r"[A-Za-z_][A-Za-z0-9_]*|-?\d+(?:\.\d+)?(?:[eE][-+]?\d+)?")
        lines = pathlib.Path("experiments/EXP-WESOVOW-001/cost_model.py").read_text().splitlines()
        out, per_line = {}, []
        for lineno in range(61, 66):                             # 1-based, inclusive
            nums = [t for t in TOK.findall(lines[lineno - 1]) if NUM.match(t)]
            per_line.append(nums[1:])                            # drop the leading key token
        flat = [v for row in per_line for v in row]
        keys = {"256", "384", "512", "576", "768"}
        assert all(len(row) == 2 for row in per_line), "each of lines 61-65 must contribute exactly two values"
        assert len(flat) == 10, "exactly ten protected pair values expected"
        assert not (set(flat) & keys), "a field size was captured as a protected value; STOP"
        import yaml
        shard = yaml.safe_load(pathlib.Path(
            "ledger/goals/GOAL-SSI-001/checkpoints/BATCH-dc1424.yaml").read_text())
        verdict = shard["batch_checkpoint"]["rc1_verdict"].split()[0].strip(".,;:")
        assert re.fullmatch(r"[a-z][a-z0-9_]*", verdict), "unexpected verdict token shape; STOP"
        for index, value in enumerate(flat, 1):
            out[hashlib.sha256(value.encode()).hexdigest()] = f"PAPER_PAIRS pair value {index} of 10"
        out[hashlib.sha256(verdict.encode()).hexdigest()] = "composed RC-1 verdict token"
        print(json.dumps(out, indent=2, sort_keys=True))
        PY
      what_to_do_with_the_output: >-
        Paste it as the `protected_sha256` mapping of this file (digest -> label),
        set `protected_sha256_status` to ARMED with the date, and commit it with
        the rest of the control plane. Never write a preimage anywhere.
      if_an_assertion_fires: >-
        STOP and report. Do not relax an assertion to make the recipe produce
        output. A mapping whose literal formatting differs from what the recipe
        expects is a real finding about a frozen file and belongs in the receipt,
        not in a widened regex.
      self_check_required_after_arming: >-
        Tokenize batch.yaml, review_plan.yaml, dispatch_queue.json and every
        task_card.yaml of this batch with the same token regex, hash each token,
        and assert that no token digest is in the protected set. This is the
        check that would have caught CORR-20260905-547849 one layer earlier, and
        it is cheap. Record the count of files scanned and the result in the
        arming receipt. ON A HIT, the offending control-plane file is CORRECTED
        BEFORE THE CONTROL PLANE IS COMMITTED - replace the value with a locator -
        and the hit is recorded in the receipt by FILE and LABEL, never by value.
        Do not proceed to dispatch with a known hit, and do not relax the check.
      history_check_required_after_arming: >-
        Run `python3 tools/check_review_independence.py --blind-history <REF>
        --protected-from coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/batch.yaml`
        for REF = the exact ref the blind agent will be given. A FAIL is not a
        reason to edit history: it is a reason to hand the blind agent a
        different tree (DEC-20260904-4c81b6 PD-1 standing ruling: a blind task is
        given a WORKING TREE, not a rule). Record the ref, the commit count
        scanned, and the verbatim PASS/FAIL either way.
    dispatch_precondition_binding: >-
      TASK-20260905-a210bd and TASK-20260905-4098fd MAY NOT BE DISPATCHED while
      `protected_sha256` is empty. TASK-20260905-28c89d and the archives are not
      blind and are not gated by this. If the arming procedure cannot be run at
      all, the honest outcome is that this batch dispatches only its non-blind
      tasks and records the blind phase as UNARMED AND NOT ATTEMPTED - never a
      blind phase run on a prose rule, which is exactly what
      CORR-20260905-547849 records the cost of.

  citation_prohibition:
    status: >-
      IN FORCE, RETAINED IN FULL, AND WIDENED BY PREDICATE. NOT LIFTED BY THIS
      BATCH, AND NO TASK OF THIS BATCH MAY LIFT IT. It was considered for lifting
      in DEC-20260904-4c81b6 and deliberately not lifted; every ground recorded
      there survives this batch untouched, because nothing here measures a
      crossover, an anchor, a margin, or a sign.
    retained_verbatim: >-
      The `P=512` crossover value and its `w=2^80` sign are **NOT
      citation-eligible**. This task does not lift that prohibition. Only a
      committed Coordinator decision on independently reviewed evidence can lift
      it.
    predicate_extension_verbatim: >-
      In addition to the retained sentence, a row of any EXP-WESOVOW-001
      reconciliation is NOT citation-eligible when either (a) the two anchors
      disagree in the SIGN of the baseline comparison at that row, or (b) the
      smaller |margin| across the two anchors at that row is below that field
      size's anchor gap |Delta log2 T_full + Delta log2 M / 2|.
    machine_flag_status: >-
      BATCH-256a94's anchor_reconciliation.json per-row `citation_prohibited`
      flag is scoped by field size and is KNOWN TO UNDER-REPORT: at least two
      rows carrying `citation_prohibited: false`, at log2 p = 256, fall under the
      predicate. That artifact is snapshot-bound, immutable, and MUST NOT be
      edited. Every consumer applies DEC-20260904-166ab5 and DEC-20260904-4c81b6
      on top of it. This batch produces no successor to it and does not repair
      the flag.
    application_to_this_batch: >-
      Reasoned, not assumed. The prohibition covers crossover values and
      baseline-comparison signs. THE RC-6 TASK IS THE ONE PLACE IN THIS BATCH
      WHERE THE PREDICATE COULD PLAUSIBLY FIRE, because specification.yaml:39-40
      is itself an analytic crossover line and the amendment must quote and
      discuss it. Quoting the frozen contract's own text is permitted; DERIVING,
      RECOMPUTING, TABULATING OR CITING a crossover value or a baseline sign from
      it is NOT, and the amendment must state the contract's defect without
      asserting what the corrected crossover is. TASK-20260905-a210bd computes no
      crossover, no baseline comparison, no margin and no speedup, so neither limb
      is expected to fire there. Every task must restate the retained sentence and
      the predicate verbatim and state which of them, if either, it found
      applicable and why.
    lift_procedure: >-
      Only a committed coordinator_decision resting on independently reviewed
      evidence archived under this batch's ledger archive may lift it. No
      identifier is reserved here for a lift and none is in prospect: this batch
      produces no anchor evidence of any kind. A reviewer may RECOMMEND lifting or
      retaining; a recommendation is not a decision.

