    algebra on two blocks of one frozen file, one document retrieval, and a diff
    of ten numbers.

  review_routing_determination:
    tier: review-adversarial at xhigh, for the single independent reviewer.
    basis: >-
      The routing rules escalate to review-breakthrough for a claimed
      breakthrough, a proposed closure, or a result contradicting prior VALIDATED
      evidence. NONE APPLIES AT THE OPENING STATE: this round claims no
      breakthrough, closes no lane, approves no amendment, and moves no status.
      That is recorded first and on purpose, and it is a statement about the
      opening state only.
    stop_condition_that_can_change_it: >-
      IF TASK-20260905-a210bd OR THE REVIEWER'S OWN EXTERNAL EXTRACTION REPORTS A
      DIGIT-LEVEL DISAGREEMENT with the frozen transcript, that object
      CONTRADICTS A COMMITTED, VALIDATED EVIDENCE RECORD (EV-SSI-7a3e91, strength
      `replicated` for the transcription measurement). Under AGENTS.md rule 12 it
      requires review-breakthrough at `max`, which is `degradable: false` and
      which the recorded inference environment of this goal cannot serve (IMP-1).
      THE BATCH THEN HALTS on that object: it is NOT composed under
      review-adversarial, the CLAIM stays un-promoted, GOAL-SSI-001 stays
      `active` with the impediment recorded, and the Coordinator decides what
      else the round can still record. Substituting an adversarial review for a
      breakthrough review to keep the round moving is the silent downgrade the
      policy layer forbids (CLAUDE.md rule 10 item 2). The rest of the batch -
      the RC-6 draft and its joints - is unaffected and is composed normally.
    why_one_reviewer_and_not_two: >-
      RECORDED AS A COST, NOT PRESENTED AS A DESIGN VIRTUE. BATCH-dc1424 ran a
      Validator and a Red Team. This batch runs one independent adversarial
      reviewer owning four joints, for two reasons, both practical: exactly five
      task identifiers were pre-allocated and checked for this batch, and this
      authoring task holds no shell and so cannot mint a sixth with
      `tools/allocate_id.py --next`; and this host runs two tasks at a time. The
      epistemic cost is real and is stated: there is no second, differently-
      motivated agent attacking the RC-6 amendment's reasoning, so the draft's
      argument is checked once. It is mitigated only by the facts that NOTHING IS
      PROMOTED BY THIS BATCH - the amendment is a draft, its approval is a later
      committed decision, and that decision must carry its own review - and that
      the reviewer's joints are enumerated and its attacks are worked. A red-team
      pass on the amendment is named in the ledger archive's next_actions as a
      precondition for approving it.

  inference_environment:
    resolvable_backends: local only
    basis: >-
      NOT PROBED BY THIS AUTHORING TASK, which holds no shell. Carried forward
      from BATCH-dc1424/batch.yaml inference_environment, which carried it from
      BATCH-256a94's recorded `python3 -m orchestration.adapter doctor` run at
      15:22Z on 2026-09-04, and from IMP-1 on the GOAL-SSI-001 head. It is an
      ASSUMPTION here, labelled as one, and is re-checkable with
      `python3 -m orchestration.adapter doctor --probe`.
    consequence: >-
      No task in this batch may require a second model backend or a
      model-independent review; such a task could not be served here. The
      review-breakthrough tier cannot be served here at all, which is what makes
      the stop condition above a stop rather than an escalation.
    declared_limitation: >-
      The single review in this batch is SESSION-independent, not
      MODEL-independent. Its agreement with a producer is correlated by
      construction, must be recorded as such in the evidence record, and may
      NEVER be presented as agreement between distinct models. What the round
      buys is corroboration by two independent METHODS - a drafted argument and
      an adversarial re-derivation of the same defect from the frozen file alone,
      and two independently retrieved external copies - which is a different and
      weaker thing, stated as such.

