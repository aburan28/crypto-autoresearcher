  opened_under_next_action_note: >-
    The three ways RC-1's outcome constrains the amendment are stated in the same
    head field and in ledger/decisions/DEC-20260904-4c81b6.yaml next_actions[0].
    They are NOT restated in this file, in dispatch_queue.json, or in any task
    card other than TASK-20260905-28c89d's, because stating them discloses the
    composed RC-1 verdict, which is a protected value for this batch's blind
