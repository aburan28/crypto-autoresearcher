  objective: >-
    (1) CF-1/RC-6, the gating deliverable: from the frozen contract and the
    committed record alone, and WITHOUT EDITING ANY FROZEN PATH, draft the
    recorded superseding protocol amendment for
    experiments/EXP-WESOVOW-001/specification.yaml:39-40, reproducing the defect
    exactly before proposing any repair, and satisfying the three binding
    constraints quoted on TASK-20260905-28c89d's card. The deliverable is the
    amendment record and its justification, NOT the edit: specification.yaml is
    frozen and no task of this batch may modify it. The draft is a DRAFT - it is
    not approved by this batch and approval remains a separate committed
    Coordinator decision.
    (2) OBJ-4, dispatchable in parallel and cheap: retrieve a published copy of
    the paper from outside this repository, extract from it the ten numbers this
    program's frozen transcript prints at
    inputs/P13-WESOLOWSKI-2026/paper_fulltext.md:234-238, and report the diff,
    with the retrieval URL, retrieval method, and a checksum of the retrieved
    bytes. Every fidelity check this program has performed so far verifies the
    transcript against itself; this is the only one that does not.

  why_these_two_and_why_now:
    rc6_is_the_gate: >-
      It is the single next action of the committed decision that closed
      BATCH-dc1424 and of the goal head, and it is the campaign's oldest
      undischarged adverse finding: a frozen contract that no reader can satisfy
      is a defect that silently invalidates every control keyed to it. It is
      document reading, algebra on two committed blocks of one file, and drafting.
      It needs no run, no solver, no network, and no second backend.
    obj4_is_ranked_ahead_of_doing_nothing_on_its_own: >-
      Every fidelity result this program holds about the frozen transcript is a
      comparison of that transcript against itself or against code derived from
      it. Two independent readings of one possibly-corrupted source agree exactly
      as strongly as one. DEC-20260904-4c81b6 records this as the single largest
      remaining uncertainty in its J5, and records that no further internal
      re-transcription can reduce it. The task is minutes of retrieval and a diff.
      It is also the ONLY task in this campaign whose value is destroyed by
      telling its operator the answer, which is why this batch spends most of its
      control-plane machinery on protecting it.
    what_is_deliberately_not_dispatched: >-
      CF-7 remainder, CF-8, CF-9 and CF-10 are carried forward below with their
      origins, unchanged and undispatched. CF-9 in particular is cheap and
      unblocked and could have been added; it is not, because this host runs two
      tasks at a time and a third producer would compete with the two ranked
      above it for the same cores without changing what either concludes. Not
      dispatching it is a scheduling decision, asserts nothing about its value,
      and is recorded so it cannot evaporate.

  blind_phase_hygiene:
    rule: >-
      No control-plane artifact of this batch - this file, dispatch_queue.json,
      review_plan.yaml, any task card, any ledger handoff copy, and NO COMMIT
      MESSAGE OF ANY COMMIT REACHABLE FROM THE TREE A BLIND AGENT IS GIVEN -
      states any protected value of this batch. Protected values are named by
      LOCATOR and declared by HASH below. Where a deliverable would name one, a
      locator satisfies it (DEC-20260904-166ab5 PD-2, applied to blindness).
    why: >-
      TASK-20260905-a210bd extracts ten numbers from an externally retrieved copy
      of the paper before it is permitted to open this program's own copy. An
      operator told those numbers in advance is not checking anything, and nothing
      downstream can tell an agreement that was earned from an agreement that was
      supplied. TASK-20260905-4098fd repeats the extraction from its own retrieved
      copy under the same rule.
    why_the_declaration_is_by_hash_and_not_by_list: >-
      The batch file is exactly the file the blind agent must read to learn its
      assignment, so the list of protected values cannot be a plaintext list in
      it. tools/check_review_independence.py therefore tokenizes each commit
      message and hashes each token, and recognises a value it was never told.
      STATED PLAINLY, FROM THAT TOOL'S OWN DOCSTRING: this is obfuscation against
      a reader, NOT secrecy against a determined search - the space of plausible
      figures is small and brute-forceable. It keeps the value out of the blind
      agent's eyes, which is all it claims. It cannot see a paraphrase, a value
      written to different precision, or a verdict described in words it was not
      given, and it does not replace giving the blind agent a clean tree.
