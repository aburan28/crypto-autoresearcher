  frozen_artifact_ruling_note_on_source_record: >-
    inputs/P13-WESOLOWSKI-2026/source_record.yaml IS INSIDE THAT RULING, AND THE
    GOAL HEAD ASKS FOR A URL AND CHECKSUM TO BE RECORDED ON IT. THIS BATCH
    DELIBERATELY DOES NOT DO THAT, AND THE DEPARTURE IS RECORDED HERE RATHER THAN
    ABSORBED. TASK-20260905-a210bd drafts the provenance block as a separate
    artifact in its own task directory
    (`source_record_provenance_addendum.yaml`), does not touch source_record.yaml,
    and states the exact insertion it proposes. Three reasons: an unreviewed
    producer edit to a frozen provenance record is the act this campaign has
    refused for two rounds running; if retrieval fails there is nothing to attach
    and an edit would be worse than none; and if the retrieved copy DISAGREES with
    the frozen transcript, the correct successor is a correction record under a
    new identifier, not an addendum. Attaching the reviewed block to
    source_record.yaml is named as the successor action in the ledger archive's
    next_actions and is a Coordinator act on reviewed evidence, not a producer
    act.

  execution_prohibition:
    new_experiment_runs_authorized: 0
    statement: >-
      This batch authorizes NO execution of any experiment implementation and
      creates NO run record. Authorized invocations are of a task's own
      standalone scripts inside its own task directory, which import nothing from
      experiments/. A reviewer's or producer's own throwaway arithmetic and
      scratch scripts are NOT runs - the standing interpretation ruled in
      DEC-20260904-166ab5 PD-4, restated on every card of this batch rather than
      left to be inferred. A network retrieval is likewise not a run; it is an
      observation with a recorded method and checksum.

  network_use:
    permitted_for: TASK-20260905-a210bd and TASK-20260905-4098fd, and only for retrieval of a published copy of the paper.
    statement: >-
      Outbound HTTPS in this environment goes through a pre-configured agent
      proxy. NEVER disable TLS verification and never unset HTTPS_PROXY; if a
      transfer fails, consult the proxy status endpoint and record the failure.
      A retrieval failure is INFRASTRUCTURE SIGNAL and is never evidence about
      the paper, the transcript, the cost model, or any isogeny problem
      (AGENTS.md core rule 5). "Could not retrieve" is a complete and honest
      OBJ-4 outcome and is contracted as one below.
    prohibited: >-
      Never select a provider, backend, endpoint, or model identifier containing
      `bedrock`, case-insensitively (AGENTS.md rule 16). Do not upload, paste, or
      transmit any repository content to any service in order to perform the
      comparison; the retrieval is one-way.

  the_obj4_outcomes_are_all_real_results:
    retrieved_and_agree: >-
      A published copy is retrieved, its URL and a checksum of the retrieved
      bytes are recorded, the ten numbers are located in it, and every one agrees
      with the frozen transcript within the pre-registered tolerance. RESULT: the
      provenance gap DEC-20260904-4c81b6 names as the largest residual
      uncertainty in its J5 is closed for those ten numbers, and for nothing
      else - it says nothing about the rest of the 350-line transcript.
    retrieved_and_disagree: >-
      At least one of the ten differs. RESULT, AND A STOP CONDITION: this would
      contradict a committed evidence record (EV-SSI-7a3e91). See
      review_routing_determination - the round HALTS, the object is not composed
      under this batch's review tier, and the Coordinator decides. It is not a
      failure of the task; it is the most consequential thing this task can find,
      and it is the reason the task exists.
    retrieved_but_not_comparable: >-
      A published copy is retrieved but at least one of the ten cannot be located
      in it in a directly comparable form - a different section numbering, a
      table where the transcript has prose, a revised version with different
      figures. RESULT: the freeze is lossy in a NAMED, LOCATED way, which is
      strictly more than this program knows today, and it scopes what any future
      re-transcription can claim.
    not_retrievable: >-
