  title: >-
    CF-1/RC-6 first: draft the recorded superseding protocol amendment for the
    frozen contract experiments/EXP-WESOVOW-001/specification.yaml:39-40, and in
    parallel close the last provenance gap on inputs/P13-WESOLOWSKI-2026 by
    comparing this program's frozen transcript against an externally retrieved
    published copy.
  status: ready_for_dispatch
  status_note: >-
    Successor control plane to BATCH-dc1424, which DEC-20260904-4c81b6 closed as
    `revise` with exactly one next action. This file authorizes no execution by
    itself; dispatch_queue.json is the bounded dispatch contract. Two tasks are
    ready at the opening state. NO hypothesis status, experiment status, or goal
    status moves in this batch, and opening a batch is not approving its
    contents.

  opened_under_next_action: >-
