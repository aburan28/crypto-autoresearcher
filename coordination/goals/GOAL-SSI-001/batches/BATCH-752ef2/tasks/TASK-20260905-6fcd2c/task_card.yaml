task_card:
  id: TASK-20260905-6fcd2c
  goal_id: GOAL-SSI-001
  batch_id: BATCH-752ef2
  title: >-
    Snapshot archive of both producer packages - the RC-6 amendment draft and the
    OBJ-4 external provenance diff - alone, and before the independent reviewer
    reads a byte of either.
  role: coordinator
  state: queued
  review_required: false
  depends_on:
    - TASK-20260905-28c89d
    - TASK-20260905-a210bd

handoff:
  id: TASK-20260905-6fcd2c
  from: coordinator
  to: coordinator
  objective: >-
    Run alone and snapshot exactly the ten declared producer artifacts of
    TASK-20260905-28c89d and TASK-20260905-a210bd, plus this receipt, in ONE
    commit, before the independent reviewer reads them - so that the review
    attacks a bit-identical, immutably bound package and a later disagreement
    between reviewer and producer localizes to a claim instead of to a question
    about what the package said. Then verify, mechanically, that the tree handed
    to the reviewer states none of this batch's protected values in any reachable
    commit message.
  uncertainty_reduced: >-
    Whether both producer packages are bound to an immutable, exact-path archive
    whose content hashes verify independently, and whether the tree the blind
    half of the review will run in is clean of the one disclosure channel no
    read-scope rule can see.
  inputs:
    - The six declared artifacts under BATCH-752ef2/tasks/TASK-20260905-28c89d/
    - The four declared artifacts under BATCH-752ef2/tasks/TASK-20260905-a210bd/
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/batch.yaml, including blind_phase_hygiene.protected_sha256
    - This task card
  constraints:
    - >-
      RUN ALONE. No other task of this batch may be running while this archive
      runs. Both producers must have terminal receipts before you start.
    - >-
      STAGE EXACTLY THE ELEVEN DECLARED PATHS BY EXACT PATHSPEC, IN ONE COMMIT.
      Never `git add -A`, never stage a directory, never stage a frozen path,
      never stage a control-plane file. The expected change set is the UNION of
      this task's own artifact_paths and BOTH source tasks' artifact_paths - that
      is what tools/research_dispatch.py computes and enforces, and stating it
      more narrowly is what got an archive of the previous batch rejected.
    - >-
      THE COMMIT MESSAGE STATES RECORD IDENTIFIERS AND LOCATORS ONLY. It must not
      state any of this batch's protected values, any composed verdict, any of the
      ten numbers, any per-value outcome, or any characterization of what either
      package concluded. A commit message cannot be reverted: on 2026-09-05 one
      on this campaign's branch stated ten values and a verdict, the reverting
      commit quoted its subject verbatim, and `git log --oneline` displayed it
      twice to a tree a blind agent was to run in (CORR-20260905-547849). Name
      TASK-20260905-28c89d, TASK-20260905-a210bd, TASK-20260905-6fcd2c,
      GOAL-SSI-001 and BATCH-752ef2, and say what was archived, not what it says.
    - >-
      AFTER COMMITTING, RUN THE BLIND-HISTORY CHECK ON THE POST-COMMIT HEAD AND
      RECORD ITS VERBATIM OUTPUT:
      `python3 tools/check_review_independence.py --blind-history HEAD
      --protected-from coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/batch.yaml`.
      A FAIL blocks dispatch of TASK-20260905-4098fd until the reviewer can be
      given a clean tree; it NEVER licenses rewriting history. An UNCHECKABLE
      result - the batch's protected_sha256 is empty - is recorded as UNCHECKABLE
      and is NOT recorded as a pass, and it likewise blocks the reviewer's blind
      phase.
    - >-
      DO NOT EDIT, STAGE, MOVE OR EXECUTE anything under experiments/ or inputs/,
      and do not write any ledger or scientific record.
    - >-
      NEVER RECONSTRUCT, ESTIMATE, OR GUESS a commit SHA, a parent SHA, or a path
      hash. Leave a binding null until a real archive commit exists.
    - >-
      FETCH origin/main BEFORE COMMITTING AND MERGE IT into the working branch -
      merge, never rebase, because rebasing rewrites the commits run records were
      archived in. Record the base commit checked and the merge outcome in the
      receipt. If a sync conflicts inside an immutable record, do not pick a
      side: stop and report, and the resolution is a new superseding record.
    - >-
      PUSH THE BRANCH and open or refresh the PR against main naming
      TASK-20260905-28c89d, TASK-20260905-a210bd and BATCH-752ef2. A record that
      exists only in a local commit is unpublished and is not durable evidence.
    - >-
      NO INDEPENDENT REVIEWER STARTS until this snapshot receipt is accepted by
      the post-commit verifier AND the blind-history check above has been run and
      recorded.
    - >-
      DO NOT WRITE A CORRECTION, NOTE, OR COMMENTARY THAT AFFIRMS OR
      CHARACTERIZES ANY REVIEWED VERDICT. DEC-20260904-166ab5 PD-1 rules that a
      pre-review correction states what it corrects and does NOT state that the
      reviewed verdict stands.
    - >-
      IF A PRODUCER STOPPED EARLY - a defect that did not reproduce, a retrieval
      that failed, a declared stop condition that fired, or an exhausted budget -
      SNAPSHOT THE PACKAGE EXACTLY AS IT IS. An honest stop, an honest
      `not_retrievable`, and an honest `not_reproduced` are archived exactly like
      a complete package and are not annotated as failures. If a producer wrote
      fewer than its declared artifacts, do NOT invent, complete, or stub the
      missing ones: report the shortfall in the receipt and return to the
      Coordinator, because the dispatcher's expected path set will not match and
      the archive must not be forced.
    - >-
      Change no status, write no ledger record, approve nothing, and make no
      interpretation of either package's contents.
    - >-
      Never select a provider, backend, endpoint, or model identifier containing
      Bedrock, case-insensitively.
  deliverables:
    - snapshot_commit_receipt.json
  deliverable_contracts:
    snapshot_commit_receipt.json: >-
      Commit information and hashes obtained from Git and from nowhere else:
      commit_sha, parent_sha, the full expected path set with its sha256 map, the
      fetched base commit of origin/main and the merge outcome, the push result,
      the PR URL, and the verbatim output of the blind-history check with the ref
      it was run against and the commit count scanned. It must also state
      explicitly whether the protected_sha256 declaration was armed at the time of
      the check, and if it was not, that the check reported UNCHECKABLE rather
      than passing.
  expected_commit_path_set:
    rule: >-
      tools/research_dispatch.py computes the expected set as this archive task's
      own `artifact_paths` UNION every source task's `artifact_paths`, requires
      the commit to change EXACTLY that set with no duplicates, and requires
      `path_sha256` to cover the whole union on a completed archive. Eleven paths.
    enumerated:
      - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/archives/TASK-20260905-6fcd2c/snapshot_commit_receipt.json
      - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/defect_reproduction.yaml
      - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/protocol_amendment_draft.yaml
      - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/category_and_licensing_analysis.yaml
      - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/amendment_controls.py
      - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/amendment_controls_report.yaml
      - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/runtime_session_receipt.yaml
      - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-a210bd/external_provenance_diff.yaml
      - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-a210bd/retrieval_log.yaml
      - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-a210bd/source_record_provenance_addendum.yaml
      - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-a210bd/runtime_session_receipt.yaml
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/archives/TASK-20260905-6fcd2c/snapshot_commit_receipt.json
  read_scope:
    - AGENTS.md
    - agents/coordinator.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-a210bd
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/batch.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/dispatch_queue.json
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/archives/TASK-20260905-6fcd2c
  write_scope:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/archives/TASK-20260905-6fcd2c
  archived_by: TASK-20260905-6fcd2c
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - The snapshot commit changes EXACTLY the eleven paths enumerated in expected_commit_path_set - this task's artifact_paths UNION both source tasks' artifact_paths - with no duplicates and nothing else, and path_sha256 covers all eleven.
    - No path under experiments/ or inputs/ appears in the commit, and no control-plane file of this batch appears in it.
    - The commit message names TASK-20260905-28c89d, TASK-20260905-a210bd, TASK-20260905-6fcd2c, GOAL-SSI-001 and BATCH-752ef2, and states no protected value, no verdict, and no characterization of either package's conclusions.
    - The receipt records only commit information and hashes obtained from Git, with the fetched origin/main base commit and the merge outcome.
    - "`tools/check_review_independence.py --blind-history <post-commit ref> --protected-from .../BATCH-752ef2/batch.yaml` was run, its ref, commit count and verbatim output are in the receipt, and an UNCHECKABLE result is recorded as UNCHECKABLE and not as a pass."
    - The branch is pushed and a PR against main names the two producer tasks and BATCH-752ef2.
    - No ledger or scientific record is written, no status is changed, and no verdict of either package is affirmed or characterized anywhere.
  return_format: >-
    A short report naming the commit sha, the parent, the eleven-path change set
    as verified, the origin/main base and merge outcome, the PR, and the verbatim
    blind-history result. If any producer package was short of its declared
    artifacts, say so and stop.

citation_prohibition_verbatim: >-
  The `P=512` crossover value and its `w=2^80` sign are **NOT
  citation-eligible**. This task does not lift that prohibition. Only a
  committed Coordinator decision on independently reviewed evidence can lift it.

citation_prohibition_predicate_extension_verbatim: >-
  In addition to the retained sentence, a row of any EXP-WESOVOW-001
  reconciliation is NOT citation-eligible when either (a) the two anchors
  disagree in the SIGN of the baseline comparison at that row, or (b) the
  smaller |margin| across the two anchors at that row is below that field size's
  anchor gap |Delta log2 T_full + Delta log2 M / 2|.
