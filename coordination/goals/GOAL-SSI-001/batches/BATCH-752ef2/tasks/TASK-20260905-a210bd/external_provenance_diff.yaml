composed_outcome:
  rule_as_stated_on_the_task_card_and_not_choosable_by_this_task: >-
    (1) If no document that is the article was retrieved, the outcome is
    `not_retrievable`, whatever else you learned. (2) Otherwise, if ANY of the ten
    per-value verdicts is `disagree`, the outcome is `retrieved_and_disagree` - one
    disagreement is decisive and is not outvoted by nine agreements. (3) Otherwise, if any
    per-value verdict is `not_comparable`, the outcome is `retrieved_but_not_comparable`.
    (4) Otherwise the outcome is `retrieved_and_agree`.
  rule_shown_being_applied:
    clause_1:
      test: "Was a document that IS the article retrieved?"
      answer: >-
        YES. The 13-page full-text PDF at https://eprint.iacr.org/2026/1486.pdf, sha256
        ccc85233147b4de39f093b70c6c29864ff13e9d1becb5f1f1b4c81416b73d3d7, 437637 bytes,
        HTTP 200, content-type application/pdf. It is the article, not an abstract page,
        listing entry, summary, slide deck, citation in another work, or different paper
        by the same author. The separately-fetched landing page IS an abstract page and no
        value was taken from it.
      clause_disposed: "Clause (1) does not select. Proceed to clause (2)."
    clause_2:
      test: "Is ANY of the ten per-value verdicts `disagree`?"
      answer: "NO. disagree count = 0 of 10."
      clause_disposed: "Clause (2) does not select. Proceed to clause (3)."
    clause_3:
      test: "Is ANY per-value verdict `not_comparable`?"
      answer: "NO. not_comparable count = 0 of 10."
      clause_disposed: "Clause (3) does not select. Proceed to clause (4)."
    clause_4:
      answer: "Otherwise the outcome is `retrieved_and_agree`. Ten of ten agree."
      clause_disposed: "CLAUSE (4) SELECTS."
  outcome: retrieved_and_agree
  composition_rule_objections: >-
    NONE. I have no objection to the rule and would have followed it regardless. Recorded
    explicitly so that its absence is not mistaken for an omission.

what_this_does_not_settle:
  - >-
    IT SETTLES THE TEN VALUES AND NOTHING ELSE ABOUT THE TRANSCRIPT. The frozen
    inputs/P13-WESOLOWSKI-2026/paper_fulltext.md is a roughly 350-line document. This task
    compared ten numbers on five of its lines, character by character, plus three sentences
    of adjacent prose post-hoc and non-blind. Every other line of the transcript - the
    lemma statements, the proofs, the algorithm listings, Heuristic 1, Section 4.2's
    experimental tables, the bibliography - IS UNCHECKED AGAINST THE PUBLISHED COPY by
    this task, and no fidelity claim about them may be strengthened on the strength of
    this result.
  - >-
    IT IS ONE COPY FROM ONE VENUE. The comparison rests on a single retrieval from
    eprint.iacr.org. If the ePrint copy were itself corrupt, or if the archive served
    altered bytes, this task would report agreement and be wrong. The remedy is the
    independent retrieval assigned to joint J4, ideally from a DIFFERENT host. arXiv
    rate-limited this host (retrieval_log.yaml attempt 2), so no second venue was tried.
  - >-
    THE VALUES WERE READ THROUGH A TEXT EXTRACTOR, NOT OFF A RENDERED PAGE. No PDF
    rasteriser was available (`pdftoppm` absent), so I could not visually inspect the
    typeset page. The mitigation was two independent extraction engines (pypdf 6.17.0 and
    pdfminer.six) agreeing character-for-character on all ten digit strings. A
    hypothetical font- or encoding-level corruption that both engines reproduce identically
    is not excluded.
  - >-
    IT SAYS NOTHING ABOUT WHETHER THE PAPER'S NUMBERS ARE CORRECT. This is a comparison
    between two documents. It asserts nothing about whether the cost estimates are right,
    tight, reproducible, or applicable to any parameter set; nothing about SQIsign, CSIDH,
    or any standardized parameter set in either direction; and nothing about any exponent,
    asymptotic complexity, crossover, margin, speedup, or baseline comparison. None of
    those was computed.
  - >-
    IT DOES NOT MAKE THE TEN VALUES INTO EQUALITIES. All ten are published as LOWER BOUNDS
    (`≥`), under the paper's own stated assumption that the Lemma 3.5 probability bound is
    tight, with the author's explicit warning that they rest on "a rough underestimation"
    and "may be overestimating the factor 1/P0". Both documents carry that qualifier
    identically. Any downstream consumer that treats them as point estimates is making a
    modelling choice this task neither performed nor endorses.
  - >-
    IT VALIDATES NO DERIVED ARTIFACT. Whether any code, mapping, or reconciliation
    elsewhere in this program reproduces these ten values FAITHFULLY FROM the transcript is
    a different question with a different scope, and this task did not read, execute, or
    check any such artifact. cost_model.py was neither read nor run.
  - >-
    IT CHANGES NO STATUS AND LIFTS NO PROHIBITION. No ledger record was written, no
    hypothesis, experiment, or goal status was moved, nothing was committed, and the
    citation prohibition and its predicate extension remain in force in full.
  - >-
    THE ORDERING GUARANTEE IS AN ATTESTATION, NOT A PROOF. The blind phase was enforced by
    my own discipline plus the clean worktree I was handed; the phase_a hash proves the
    block was not EDITED after it was written, but no tool in this environment proves that
    the transcript was not read before it was written. My attestation, in this artifact and
    in runtime_session_receipt.yaml blind_phase_attestation, is what carries that, and it
    is offered as accurate.

