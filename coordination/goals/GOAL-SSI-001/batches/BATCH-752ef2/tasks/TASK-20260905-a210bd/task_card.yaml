# THIS IS THE BLIND TASK OF BATCH-752ef2.
#
# Its entire value is that its operator fetches ten numbers from OUTSIDE this
# repository and compares. An operator told the numbers in advance is not
# checking anything, and nothing downstream can tell an agreement that was
# earned from an agreement that was supplied. This card, and every file in its
# read scope, is therefore written to contain none of them, and the batch
# declares the protected set by HASH in
# coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/batch.yaml
# `blind_phase_hygiene.protected_sha256`, checked against the reachable
# commit-message history of the tree you are given with
#   python3 tools/check_review_independence.py --blind-history <ref> \
#       --protected-from coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/batch.yaml
# THIS TASK MAY NOT BE DISPATCHED WHILE THAT DECLARATION IS EMPTY.
# CORR-20260905-547849 is the worked example of what a prose rule bought.
task_card:
  id: TASK-20260905-a210bd
  goal_id: GOAL-SSI-001
  batch_id: BATCH-752ef2
  title: >-
    OBJ-4: retrieve a published copy of the source paper from outside this
    repository, extract the ten cost values it states for the five field sizes,
    and diff them against this program's frozen transcript - recording the
    retrieval URL, method and checksum. Blind in phase A.
  role: executor
  state: queued
  review_required: true
  archived_by: TASK-20260905-6fcd2c
  reviewed_by:
    - TASK-20260905-4098fd
  review_plan_ref: coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/review_plan.yaml
  review_plan_read_prohibition: >-
    DO NOT OPEN review_plan.yaml. It is referenced here only so this card is
    complete for a later reader. That file states the round's decoy constructions
    and its blind-rederivation contract, and it is deliberately outside your read
    scope. You need nothing from it: everything binding on you is on this card.

handoff:
  id: TASK-20260905-a210bd
  from: coordinator
  to: executor
  objective: >-
    PHASE A, BLIND. Using only this card, the frozen source-provenance record at
    inputs/P13-WESOLOWSKI-2026/source_record.yaml (title, author, year), and the
    unit declarations at experiments/EXP-WESOVOW-001/specification.yaml
    model_definition, retrieve a PUBLISHED copy of that paper from outside this
    repository. Record the URL, the exact retrieval command, the byte length and
    a sha256 of the retrieved bytes, and the section you located. From that copy
    alone, transcribe the (time, memory) cost pair the paper states for each of
    the five field sizes log2 p in {256, 384, 512, 576, 768} - ten values - with
    a locator for each, and judge per value whether the published copy states it
    in a form directly comparable to the units declared in specification.yaml.
    Write that block, and stop.
    PHASE B. Only then open inputs/P13-WESOLOWSKI-2026/paper_fulltext.md and
    compare, value by value, your Phase A transcription against the ten numbers
    that file prints at lines 234-238. Report agree, disagree, or not comparable
    for each, and draft the provenance block that should later be attached to the
    source record.
  uncertainty_reduced: >-
    Whether this program's frozen transcript of an external paper is faithful to
    the published article, for the ten numbers every anchor comparison in this
    campaign rests on. EVERY fidelity check performed so far verifies that
    transcript against itself or against code derived from it, and two
    independent readings of one possibly-corrupted source agree exactly as
    strongly as one. The frozen source record currently states only that the text
    was provided verbatim in conversation on 2026-07-24: no DOI, no retrieval
    URL, no checksum. This is the only check that can close that gap, and no
    further internal re-reading can.
  why_you_are_not_told_the_answer: >-
    Stated plainly so it does not read as obstruction. Ten numbers you were shown
    in advance are ten numbers you will find. The whole information content of
    this task is the independence of your extraction from this repository's copy,
    so your card, the batch file, and the tree you are given have been checked to
    state neither the ten values nor the verdict of the prior round that examined
    them. If you find you already know them from anything you were given, STOP
    AND SAY SO IMMEDIATELY: an honestly reported leak is recoverable and costs one
    task, and an unreported one invalidates the round and everything built on it.
  inputs:
    - inputs/P13-WESOLOWSKI-2026/source_record.yaml (PHASE A; title, author, year, and the provenance block you will draft an addendum to)
    - experiments/EXP-WESOVOW-001/specification.yaml (PHASE A; model_definition.unit_of_cost, model_definition.unit_of_memory and scenario_definitions.field_sizes_log2p - this file contains none of the ten values)
    - The public internet, through the configured agent proxy (PHASE A; retrieval only)
    - inputs/P13-WESOLOWSKI-2026/paper_fulltext.md (PHASE B ONLY; the ten numbers are printed at lines 234-238)
    - AGENTS.md, and the frozen_artifact_ruling, citation_prohibition, blind_phase_hygiene, execution_prohibition, network_use and the_obj4_outcomes_are_all_real_results blocks of BATCH-752ef2/batch.yaml
  constraints:
    - >-
      PHASE A IS FIRST, IS WRITTEN DOWN BEFORE ANY PHASE B INPUT IS OPENED, AND
      IS NOT REVISED AFTERWARDS. Write your retrieval record, your ten values,
      your locators and your per-value comparability judgement into
      external_provenance_diff.yaml under a `phase_a` block, and record a sha256
      of that block's serialized text, BEFORE you open
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md. If Phase B changes your mind
      about the published copy, record that as a separate `phase_c` note; do not
      edit phase_a.
    - >-
      DO NOT READ, LIST, OR GLOB, AT ANY POINT: experiments/EXP-WESOVOW-001/cost_model.py;
      anything under experiments/EXP-WESOVOW-001/runs/; ledger/evidence/;
      ledger/decisions/; ledger/goals/GOAL-SSI-001/; anything under
      coordination/goals/GOAL-SSI-001/batches/ other than
      BATCH-752ef2/batch.yaml and your own task directory; and
      coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/review_plan.yaml,
      dispatch_queue.json, and tasks/TASK-20260905-28c89d/. Every one of them
      either carries the ten values, lets them be reconstructed, or states the
      verdict of the prior round about them. A directory listing is a read for
      this purpose when the filenames would tell you what was concluded.
    - >-
      DO NOT RUN `git log`, `git show`, `git blame` OR ANY OTHER COMMAND THAT
      PRINTS A COMMIT MESSAGE, and do not read files under .git/. This is not
      paranoia: on 2026-09-05 a commit message on this campaign's own working
      branch stated all ten values and a composed verdict, reverting the commit
      restored the files and could not retract the message, and `git log
      --oneline` - a routine orientation command, in nobody's blind list -
      displayed it twice (CORR-20260905-547849). The tree you were given has been
      checked mechanically against the batch's declared protected digests, but
      that check cannot see a paraphrase, and you have no need of history.
    - >-
      RETRIEVE THE ARTICLE, NOT SOMETHING NEAR IT. An abstract page, a landing
      page, a listing entry, a citation in another work, a summary, a slide deck,
      or a different paper by the same author is NOT the article and must not be
      compared. Record the document type you actually obtained. If what you can
      reach is an abstract only, that is a `not_retrievable` outcome for the ten
      values and you say so.
    - >-
      A MODEL RECOLLECTION IS NOT A RETRIEVAL. If you believe you remember what
      the paper says, that is a `recalled` pointer under AGENTS.md rule 9: it may
      be recorded, marked, as a hint to a later reader, and it may NEVER be
      written into your Phase A transcription, your diff, or your conclusion.
      Values you did not read out of a document you fetched do not exist for this
      task.
    - >-
      RECORD THE RETRIEVAL SO IT CAN BE REPRODUCED AND ATTACKED: the full URL,
      the exact command, the HTTP status, the content type, the byte length, a
      sha256 of the retrieved bytes, the document's own version and date strings
      if it carries them, and the section number and heading you located. A
      reviewer will fetch independently and compare these. An agreement reported
      without them is worthless and is a completion-gate failure.
    - >-
      NETWORK RULES. Outbound HTTPS goes through a pre-configured agent proxy.
      NEVER disable TLS verification and NEVER unset HTTPS_PROXY. If a transfer
      fails, consult the proxy status endpoint, record the verbatim error and the
      status output, and try a different endpoint. Do not upload, paste, or
      transmit any repository content to any service; the retrieval is one-way.
      Never select a provider, backend, endpoint, or model identifier containing
      Bedrock, case-insensitively.
    - >-
      A RETRIEVAL FAILURE IS INFRASTRUCTURE SIGNAL AND IS A COMPLETE, HONEST
      OUTCOME. It is never evidence about the paper, the transcript, the cost
      model, or any isogeny problem, and it must never be reported as a task
      failure, a budget shortfall, or a reason to substitute a weaker source. See
      batch.yaml the_obj4_outcomes_are_all_real_results, which contracts all four
      outcomes including this one. Record the endpoints attempted and the exact
      errors so the next agent does not repeat your search.
    - >-
      TOLERANCE, PRE-REGISTERED BY THIS CARD AND NOT CHOOSABLE BY YOU: two values
      agree when their absolute difference is at most half a unit in the last
      decimal place they carry. If the published copy states a value to COARSER
      precision, use half a unit in the PUBLISHED copy's last stated place, record
      the widened tolerance for that value explicitly, and flag it
      `precision_limited`. If the published copy states a value only
      qualitatively, or in a different quantity or unit, the value is NOT
      COMPARABLE - never a match, and never a mismatch. If you convert units to
      make a comparison possible, that conversion is a NEW computation: record it
      under `derived_comparison` with the derivation written out, and it may NOT
      become the value's verdict.
    - >-
      READ-ONLY, ABSOLUTELY: everything under inputs/P13-WESOLOWSKI-2026/ and
      everything under experiments/. DO NOT EDIT source_record.yaml. The goal
      head asks for a URL and checksum to be recorded on it; this batch
      deliberately does not do that here, and the reason is in batch.yaml
      frozen_artifact_ruling_note_on_source_record. You DRAFT the block, in your
      own directory, and state the exact insertion you propose. The attachment is
      a later Coordinator act on reviewed evidence.
    - >-
      DO NOT EXECUTE cost_model.py, and do not read it. You do not need it: your
      comparison is between a retrieved document and
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md lines 234-238.
    - >-
      Make no security, SQIsign, CSIDH, standardized-parameter, exponent, or
      asymptotic-complexity claim in any direction, and construct no attack. Your
      comparison is between two documents; it says nothing about whether the
      paper's result is correct, and no sentence of yours may imply that it does.
      Compute no crossover, no baseline comparison, no margin and no speedup.
    - >-
      RESTATE THE CITATION PROHIBITION VERBATIM IN EVERY ARTIFACT together with
      its predicate extension, both reproduced at the foot of this card, and state
      for each artifact whether either fired and why. Do not lift either.
    - >-
      Write no ledger record, change no status, approve nothing, and do not
      commit. A timeout, crash, missing dependency, or exhausted budget is an
      operational observation and never mathematical evidence.
  deliverables:
    - external_provenance_diff.yaml
    - retrieval_log.yaml
    - source_record_provenance_addendum.yaml
    - runtime_session_receipt.yaml
  deliverable_contracts:
    external_provenance_diff.yaml: >-
      THE GATING ARTIFACT. A `phase_a` block, written and hashed before any Phase
      B input was opened, carrying: the document you retrieved and its identity
      fields; the section you located with its number and heading; your ten
      values, keyed by (log2 p, quantity) with quantity in {time, memory}, each
      with a locator (page or line, and the verbatim quoted sentence, row or cell)
      and a comparability judgement in {direct, requires_derivation, absent}; a
      count of how many distinct places in the retrieved document state any of
      these quantities; and the search you performed for a second, disagreeing
      statement. Then a `phase_b` block: the value-by-value comparison against
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md lines 234-238, each with a
      verdict in {agree, disagree, not_comparable}, the tolerance applied, any
      widening and its reason, and any `derived_comparison`. Then a composed
      outcome from exactly {retrieved_and_agree, retrieved_and_disagree,
      retrieved_but_not_comparable, not_retrievable}, computed by the rule stated
      in this card's `composition_rule` and SHOWN BEING APPLIED. Then a
      `what_this_does_not_settle` list. If the outcome is not_retrievable, say
      plainly that this is a result about the provenance gap and not a failure of
      the task.
    retrieval_log.yaml: >-
      Every endpoint attempted, in order, with: the exact command, the HTTP
      status or the verbatim error, the content type, the byte length, the sha256
      of the retrieved bytes where anything was retrieved, and the timestamp.
      Include the proxy status output if any transfer failed. Include the
      searches you ran to find candidate URLs. This artifact must be sufficient
      for an independent agent to reproduce or refute your retrieval without
      asking you anything.
    source_record_provenance_addendum.yaml: >-
      A DRAFT block, NOT AN EDIT. The exact YAML you propose be added to
      inputs/P13-WESOLOWSKI-2026/source_record.yaml, the exact key path it would
      be added under, and a statement of what it asserts and what it does not.
      It carries `status: draft`, `applied: false`, and names the committed
      Coordinator decision that would be required to attach it. If the outcome is
      `retrieved_and_disagree`, DO NOT draft an addendum: state instead that the
      correct successor is a correction record under a new identifier, and why. If
      the outcome is `not_retrievable`, the draft records the failed search as
      provenance - that a search was performed and what it found is itself worth
      recording - and asserts no URL and no checksum.
    runtime_session_receipt.yaml: >-
      Inference provenance: requested_policy, reasoning_effort, backend,
      resolved_model_id, model_verified, fallback_used, degraded_requirements,
      and the exact command you ran to obtain them with its output. IF YOU RAN NO
      SUCH COMMAND, record model_verified: false and
      resolved_model_id_self_reported, and say plainly that no probe was run.
      Never record a probe you did not perform. Additionally record a
      `blind_phase_attestation` block: the paths you read in Phase A, the paths
      you read in Phase B, an explicit statement that no path in this card's
      read-prohibition list was read, listed or globbed at any point, and an
      explicit statement of whether you ran any command that printed a commit
      message.
  composition_rule:
    stated_before_you_retrieve_and_not_choosable_by_you: >-
      (1) If no document that is the article was retrieved, the outcome is
      `not_retrievable`, whatever else you learned. (2) Otherwise, if ANY of the
      ten per-value verdicts is `disagree`, the outcome is
      `retrieved_and_disagree` - one disagreement is decisive and is not outvoted
      by nine agreements. (3) Otherwise, if any per-value verdict is
      `not_comparable`, the outcome is `retrieved_but_not_comparable`. (4)
      Otherwise the outcome is `retrieved_and_agree`. Show this rule being applied
      to your actual per-value verdicts.
    if_you_believe_this_rule_is_wrong: >-
      Record that under `composition_rule_objections` and FOLLOW IT ANYWAY.
      Changing a success criterion after observing an outcome requires a versioned
      protocol amendment and is not within this task's authority (AGENTS.md).
  stop_condition_you_must_obey: >-
    IF ANY PER-VALUE VERDICT IS `disagree`, STOP AFTER RECORDING IT. Do not
    investigate further, do not attempt to explain it, do not look for which side
    is right, and do not soften it. That finding contradicts a committed evidence
    record of this program, which requires a review tier this environment cannot
    serve, so the round halts on it and the Coordinator decides. Recording it
    cleanly is the most valuable thing this task can do; resolving it here would
    destroy its value.
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-a210bd/external_provenance_diff.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-a210bd/retrieval_log.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-a210bd/source_record_provenance_addendum.yaml
