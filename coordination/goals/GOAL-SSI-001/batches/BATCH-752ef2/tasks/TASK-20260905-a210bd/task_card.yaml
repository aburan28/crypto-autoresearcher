  budget:
    wall_clock_seconds: 2400
    memory_gb: 2
    maximum_runs: 4
  budget_note: >-
    `maximum_runs` bounds executions of experiment code, producer
    implementations, and anything that writes a run record. A network retrieval
    is NOT a run; it is an observation with a recorded method and checksum. Your
    own throwaway scripts are not runs either (DEC-20260904-166ab5 PD-4). This
    batch authorizes ZERO new experiment runs.
  completion_gate:
    - All four artifacts exist at their exact declared paths and nothing else was written.
    - The phase_a block is present, carries its own recorded hash, and is stated to have been written before inputs/P13-WESOLOWSKI-2026/paper_fulltext.md was opened.
    - retrieval_log.yaml records every endpoint attempted with its exact command and its status or verbatim error, and records a sha256 and byte length for anything retrieved.
    - The document type actually obtained is stated, and it is stated whether it is the article rather than an abstract, listing, summary, or other work.
    - No value entered Phase A that was not read out of a document actually retrieved in this task; no recalled or remembered value appears in any transcription, diff, or conclusion.
    - All ten values carry a Phase B verdict from exactly {agree, disagree, not_comparable}, each with its locator, the tolerance applied and any widening with its reason; or the outcome is not_retrievable and the ten are recorded as unattempted with the reason.
    - Any unit conversion appears under derived_comparison and is NOT used as a verdict.
    - The composed outcome is computed by this card's composition_rule and the rule is shown being applied.
    - If any verdict is `disagree`, the task stopped there and did not investigate, explain, or soften it.
    - source_record_provenance_addendum.yaml is a draft with applied false, and inputs/P13-WESOLOWSKI-2026/source_record.yaml was not modified.
    - No file under inputs/ or experiments/ was modified, moved, staged, or executed; cost_model.py was neither read nor run.
    - The blind_phase_attestation lists Phase A and Phase B reads separately, states that no read-prohibited path was read, listed or globbed, and states whether any commit message was printed.
    - The citation prohibition and its predicate extension are restated verbatim in every artifact, neither is lifted, and each artifact states whether either fired.
    - No ledger or scientific record was written, no status was changed, and nothing was committed.
  return_format: >-
    A short task report in the final message naming: whether a published copy was
    retrieved and what document type it was; the composed outcome; the per-value
    verdict counts by category; whether any value required a derivation; whether
    the blind phase was respected without exception; and every limitation. Do NOT
    put the ten values in the message. Findings live in the artifacts; a result
    that exists only in a message did not happen.

citation_prohibition_verbatim: >-
  The `P=512` crossover value and its `w=2^80` sign are **NOT
  citation-eligible**. This task does not lift that prohibition. Only a
  committed Coordinator decision on independently reviewed evidence can lift it.

citation_prohibition_predicate_extension_verbatim: >-
  In addition to the retained sentence, a row of any EXP-WESOVOW-001
  reconciliation is NOT citation-eligible when either (a) the two anchors
  disagree in the SIGN of the baseline comparison at that row, or (b) the
  smaller |margin| across the two anchors at that row is below that field size's
  anchor gap |Delta log2 T_full + Delta log2 M / 2|.
