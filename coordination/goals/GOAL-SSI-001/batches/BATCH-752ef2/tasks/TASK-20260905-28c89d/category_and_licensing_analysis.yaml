schema: crypto.autoresearch.category_and_licensing_analysis.v1
# Supporting analysis for the DRAFT amendment at protocol_amendment_draft.yaml.
# Nothing here is in force and nothing here is approved.
analysis:
  task_id: TASK-20260905-28c89d
  goal_id: GOAL-SSI-001
  batch_id: BATCH-752ef2
  recorded_at: '2026-09-05'
  repo_head_commit: 0b8b1b7799d15e083294d847a952f38d8f3f7482
  status: draft_supporting_analysis
  approved_by: null

  citation_prohibition_restated_verbatim: >-
    The `P=512` crossover value and its `w=2^80` sign are **NOT
    citation-eligible**. This task does not lift that prohibition. Only a
    committed Coordinator decision on independently reviewed evidence can lift
    it.
  citation_prohibition_predicate_extension_restated_verbatim: >-
    In addition to the retained sentence, a row of any EXP-WESOVOW-001
    reconciliation is NOT citation-eligible when either (a) the two anchors
    disagree in the SIGN of the baseline comparison at that row, or (b) the
    smaller |margin| across the two anchors at that row is below that field
    size's anchor gap |Delta log2 T_full + Delta log2 M / 2|.
  citation_prohibition_applicability_in_this_artifact:
    retained_sentence:
      applicable: true
      fired: false
      why: >-
        APPLICABLE because the licensing block below discusses what may and may
        not be cited from anchor-derived rows, which is the same subject matter.
        NOT FIRED: this artifact cites no crossover value, no baseline
        comparison, no margin, no sign and no speedup at any field size, and it
        names log2 p = 512 only as a member of a declared field-size set. It
        does not lift the prohibition and could not.
    predicate_extension:
      applicable: true
      fired: false
      why: >-
        APPLICABLE because the predicate is about rows where two anchors
        disagree, and the licensing block is precisely about the two anchors
        being different kinds of quantity. NOT FIRED: no row is cited, no margin
        is computed, no anchor gap is evaluated. The licensing block below
        RESTRICTS what may be cited from such rows and lifts nothing.
  blind_phase_hygiene_compliance: >-
    No value of the PAPER_PAIRS mapping at cost_model.py:60-66 and none of the
    five paper-minus-attained-minimum deltas of EV-SSI-5d954c is restated in
    this artifact. They are named by locator only. No per-field reachability
    status is paired with a numeric value anywhere here.

  # ===================================================================== 1
  category:
    the_question: >-
      What quantity is the serialized per-field comparison value actually, what
      relation and what unit does it carry, and what does it fail to carry?

    what_the_value_is:
      identity: >-
        It is a pair of REAL NUMBERS COPIED OUT OF A SOURCE DOCUMENT, being the
        base-2 logarithms of a time and a memory that the source states for a
        given field size. It is not a measurement, not an output of this cost
        model, and not a quantity this model computes. It enters the program as
        a hard-coded mapping and leaves it as JSON.
      lifecycle_by_locator:
        - locator: experiments/EXP-WESOVOW-001/cost_model.py:60-66
          what_happens: >-
            The mapping is declared, under the name PAPER_PAIRS, with a trailing
            comment naming the source section and the pair's meaning as
            "(log2 time, log2 memory)". Ten values, five field sizes. The
            comment is a comment: it is not carried by any value.
        - locator: experiments/EXP-WESOVOW-001/cost_model.py:256
          what_happens: The pair for the current field size is unpacked into two bare floats.
        - locator: experiments/EXP-WESOVOW-001/cost_model.py:257-258
          what_happens: >-
            Two signed differences are formed, this model's optimized value
            minus the source's value, one for time and one for memory.
        - locator: experiments/EXP-WESOVOW-001/cost_model.py:302
          what_happens: >-
            THE SITE THE CATEGORY QUESTION IS ABOUT. The pair is serialized into
            the per-field result mapping under a key named `paper_pair`, with
            two sub-keys named `log2time` and `log2memory` and two bare numeric
            values. Nothing else accompanies it.
        - locator: experiments/EXP-WESOVOW-001/cost_model.py:303-305
          what_happens: >-
            The two signed differences are serialized under `deviation_bits`,
            together with a boolean whose key names the tolerance and which is
            computed with the two-sided test `abs(dev) <= SANITY_TOLERANCE_BITS`
            on both coordinates (the constant is declared at line 72).
        - locator: experiments/EXP-WESOVOW-001/cost_model.py:344-345
          what_happens: >-
            The same pair and the same signed differences are printed to stdout
            in a fixed-width table, again with no relation and no unit.
    what_it_carries:
      - A sign convention on the deviation, implicit in the subtraction order at lines 257-258 and stated nowhere in the emitted record.
      - Key names that identify the two coordinates as a time and a memory.
      - A boolean whose key name embeds the numeric tolerance.
    what_it_fails_to_carry:
      relation:
        missing: true
        detail: >-
          The source states these figures as LOWER BOUNDS, from an
          underestimation the source itself describes as rough (recorded at
          DEC-20260904-4c81b6 next_actions[0] limb (ii); the source location is
          recorded by that decision's next_actions[1] as
          inputs/P13-WESOLOWSKI-2026/paper_fulltext.md:234-238, and THIS TASK DID
          NOT OPEN THAT FILE - it is outside its read scope and its lines are
          protected for a concurrent blind task, so the locator is cited to the
          decision that records it, not to a reading). The serialized value
          carries no relation at all. A reader of the emitted record sees a
          quantity that reads as an equality-valued figure.
      unit:
        missing: true
        detail: >-
          The contract declares one unit of cost, F_{p^2}-operations, and one
          unit of memory, table entries (specification.yaml:71-73), and
          cost_model.py does emit those two strings - but at lines 232-233, in a
          `model` block that is a SIBLING of `per_field`, not inside the
          per-field value. A consumer that slices out a per-field row, which is
          exactly what a reconciliation does, takes the numbers and leaves the
          units behind.
      source_locator:
        missing: true
        detail: >-
          The emitted value carries no pointer to where in the source it came
          from. The only pointer is the source comment at line 60, which does
          not travel.
    why_this_matters_concretely_and_not_in_principle: >-
      DEC-20260904-166ab5:178 records that the C1 tolerance is exceeded at every
      field size. So these figures are in fact being read, somewhere downstream,
      as signed anchors: a deviation is computed against them, its sign is
      recorded, and rows are produced from it. Those rows travel into records
      whose readers must re-derive both the relation and the unit from a
      document that is outside most read scopes in this campaign. That is the
      defensible defect: not that anyone computed anything wrongly, but that the
      value escapes the file stripped of the two facts a reader needs to
      interpret its sign.

    what_control_C1_is_declared_to_be:
      verbatim_quotes:
        specification_yaml_47_52: |
          47:  success_criterion_note: NULL, AND THE NULL IS THE DESIGN. The contract is observation-only,
          48:    so no measured value makes it succeed or fail. The nearest thing is control C1-sanity-paper-pairs,
          49:    which is an INSTRUMENT SANITY GATE carrying a 3-bit tolerance and feeding a stopping rule
          50:    about inspecting for implementation error -- not a criterion on a hypothesis. The field
          51:    is present and explicitly null rather than absent so a reader cannot mistake an omitted
          52:    field for an overlooked one.
        specification_yaml_134_141: |
          134:  - id: C1-sanity-paper-pairs
          135:    description: 'Reproduce the paper''s five Section 4.1 (log2 time, log2 memory) pairs for
          136:      log2(p) in {256, 384, 512, 576, 768}.
          137:
          138:      '
          139:    tolerance: abs deviation <= 0.75 bit on both time and memory
          140:    on_violation: record deviation honestly in execution_report; run stays valid (this is
          141:      a model-reproduction check, not an implementation check)
      note_on_the_two_tolerances: >-
        RECORDED BECAUSE IT IS A REAL DISCREPANCY IN THE FROZEN FILE AND IS NOT
        THIS TASK'S SUBJECT. Line 49 describes C1 as "carrying a 3-bit
        tolerance" while C1's own tolerance line 139 says 0.75 bit; the 3-bit
        figure is the stopping rule's rerun threshold at line 151. The
        implementation uses 0.75 (line 72). This is a wording inconsistency in
        the contract, it is orthogonal to the defect being amended, and the
        draft amendment does not touch it. Flagged here so a later reader does
        not discover it and assume it was missed.
    why_its_two_sided_test_is_correct_for_that_declared_purpose: >-
      C1 is an INSTRUMENT SANITY GATE and a model-reproduction check - both
      lines say so, and on_violation says so a third time by declaring that a
      violation leaves the run valid. Its target is the SOURCE'S ARITHMETIC: it
      asks whether this reimplementation of the source's own formulas lands
      where the source's own formulas land. For that question a reimplementation
      landing ABOVE the source's figure is exactly as suspect as one landing
      below, because either direction is a sign that the arithmetic was not
      reproduced. The source's relation attaches to the INTERPRETATION of that
      arithmetic as an attack cost, not to the arithmetic itself. The two-sided
      test is therefore CORRECT for C1's own declared purpose, is retained
      unchanged by the draft amendment, and is not weakened by any clause of it.
    adopted_narrow_form_quoted_verbatim_and_worked_from: >-
      "the defensible defect is that the SERIALIZED `paper_pair` values escape
      cost_model.py carrying neither the relation nor the unit, while the
      two-sided test remains CORRECT for control C1's own declared
      instrument-sanity purpose"
    superseded_broad_framing_quoted_for_disclaimer_only: >-
      DECLARED SCAN-EXEMPT REGION, AND THE ONLY ONE IN THIS PACKAGE. Control
      AC-4 exempts the value of this key by name and reports its line range, and
      the report also records the result of the same scan run WITHOUT the
      exemption, so the exemption is auditable rather than a hole. What follows
      is quoted solely in order to disclaim it, is recorded as SUPERSEDED by
      DEC-20260904-4c81b6 PD-8, and is NOT asserted anywhere in this package:
      "applying a two-sided `abs(dev) <= 0.75` test to the paper's one-sided
      `>=` figures is itself the defect."
    plain_statement_of_what_is_not_asserted: >-
      This analysis and the draft amendment do NOT assert the framing quoted in
      the declared exempt region above, in that form or in any paraphrase.
      DEC-20260904-4c81b6 PD-8 records that this program had been framing the
      question more broadly than the evidence supports, including in its own
      committed commit messages, and adopts the Red Team's narrower OBJ-2 form.
      The narrow form is the one quoted under
      adopted_narrow_form_quoted_verbatim_and_worked_from and is the one every
      clause of the draft is built on.
    smallest_change_that_makes_the_relation_and_the_unit_travel:
      statement: >-
        Change the serialized per-field anchor at cost_model.py:302 from a
        mapping of two bare numbers under coordinate names to a mapping that
        also carries, per coordinate, the relation the source states, the unit
        the contract declares, and a locator for the source line; and add to the
        `deviation_bits` mapping at 303-305 one string field stating the
        subtraction order and stating that the sign is a difference of two kinds
        of quantity, not by itself an instrument fault.
      properties_of_that_change:
        - Purely additive. No existing key is removed or renamed, so no consumer breaks.
        - Changes no numeric value anywhere, so no committed number moves and no run needs re-scoring.
        - Does not touch the C1 test, the tolerance constant at line 72, or the boolean at 304-305.
        - Operates on the contract's own declared units at specification.yaml:71-73 and on a relation already recorded in a committed decision. It introduces no new fact.
      where_it_is_assigned: >-
        The contract-level REQUIREMENT is drafted at
        protocol_amendment_draft.yaml clause_3
        (`serialization_requirement`, `deviation_sign_note`). The implementing
        edit to cost_model.py is assigned to the companion record described at
        protocol_amendment_draft.yaml cf_10_raw_path_placement, and is NOT
        performed by this task: cost_model.py is frozen and read-only for this
        batch and was never executed.

  # ===================================================================== 2
  licensing:
    the_recorded_status:
      what_RC_2_returned: >-
        An independent reviewer, recomputing bit-exactly, returned `off_curve`
        at log2 p in {256, 384, 512} and `reachable` at {576, 768}. Recorded at
        DEC-20260904-4c81b6 rationale item 4 and its verification, and accepted
        by that decision. The underlying pattern is EV-SSI-5d954c observation 7.
        The per-field numeric gaps that observation records are NOT restated
        here.
      what_off_curve_means_exactly: >-
        The anchor's TIME is not a value of this cost model on the contract's
        own declared optimizer grid: the contract declares the objective as
        minimizing log2(T_full) over log2B in [1.0, 60.0] at step 0.1
        (specification.yaml:74-78, implemented at cost_model.py:181-191), so the
        attained per-field minimum is by definition the smallest log2 T_full
        this model produces, and a value below it is not a value of the
        function.
      what_it_is_NOT: >-
        IT IS NOT AN ANOMALY, IT IS NOT AN OBSTRUCTION, AND IT IS NOT A CLAIM
        THAT ANY PUBLISHED FIGURE IS WRONG. Both reviewers of BATCH-dc1424
        independently named the same leading and entirely benign explanation:
        the source's figures are lower bounds from a deliberate
        underestimation, and a lower bound is entitled to lie below a model's
        attained minimum. That explanation is stated first here because it is
        the leading one.

    at_the_three_field_sizes_where_the_status_is_off_curve:
      field_sizes: log2 p in {256, 384, 512}
      licenses:
        - Reporting the anchor as the source's stated lower bound for that field size, cited by locator and carrying its relation and unit.
        - Comparing this model's attained value against it and reporting the signed difference, PROVIDED the reachability status is reported in the same breath.
        - C1's instrument-sanity verdict, unchanged: the two-sided test remains the right test for the question C1 asks, and an `off_curve` status is not a reason to relax it.
        - Recording the status itself as an observation about this cost model's grid.
      forecloses:
        - Treating the anchor as an admissible (T_full, M) INPUT to this cost model at that field size. It is not one, and the proves-too-much control of BATCH-256a94 broke on exactly that object.
        - Describing the anchor and this model's attained value as "two estimates of one quantity", or as "a genuine difference between two committed inputs". At these field sizes they are different KINDS of quantity.
        - Citing any vOW row, crossover, speedup or baseline comparison derived from the anchor at these field sizes as a cost of anything.
        - Any inference from the status to a defect in the source. Constraint (i) of DEC-20260904-4c81b6 next_actions[0] forecloses that route independently, and the enumeration below shows it is not even the leading candidate.
    at_the_two_field_sizes_where_the_status_is_reachable:
      field_sizes: log2 p in {576, 768}
      licenses:
        - Using the anchor as a model point at that field size: it is a value this model can attain on its declared grid.
        - Comparing it against the attained minimum as two values of one function, and reporting the signed difference as such.
      forecloses:
        - Reading `reachable` as AGREEMENT. Reachability says the anchor is in the model's range; it says nothing about whether the model reproduces it within any tolerance. C1 answers that question and answers it separately.
        - Reading `reachable` as VALIDATION of the model, of the source, or of the transcription.
        - Any transfer of the `reachable` status to the three field sizes where it is `off_curve`, or any statement of the form "the anchor is a model point" without the field size attached.
        - Exemption from the standing citation prohibition or its predicate extension, both of which apply at every field size regardless of status.
    what_else_besides_a_wrong_figure_could_produce_off_curve:
      preface: >-
        Enumerated so the readings are not foreclosed. These are not ranked by
        likelihood except that the first is recorded by two independent
        reviewers as the leading one. None of them is a claim that a published
        figure is wrong, and the amendment is premised on none of them.
      explanations:
        - id: E1
          explanation: >-
            THE LEADING AND ENTIRELY BENIGN ONE. The source's figures are lower
            bounds from a deliberate, explicitly rough underestimation. A lower
            bound is entitled to lie below a model's attained minimum; that is
            what a lower bound is for. Under E1 the status is not a discrepancy at
            all.
        - id: E2
          explanation: >-
            Grid discretization. The optimizer searches log2B on a 0.1 step
            (specification.yaml:76), so the model's attained minimum is a GRID
            minimum, strictly at or above the continuous one. A figure lying below
            the grid minimum may lie at or above the continuous minimum.
        - id: E3
          explanation: >-
            Grid range truncation. The search is confined to log2B in [1.0, 60.0].
            A true optimum outside that interval is unreachable by construction.
        - id: E4
          explanation: >-
            Numerical evaluation of the Dickman function. rho is tabulated by
            Laplace inversion and log2(rho) linearly interpolated
            (specification.yaml:79-107), with a stated residual accuracy. A
            different evaluation shifts the attained minimum.
        - id: E5
          explanation: >-
            Convention differences in the cost unit. The contract adopts "the
            paper's conservative convention: 1 op per table entry"
            (specification.yaml:71). A source figure stated under a different
            accounting of an operation is a different quantity, not a smaller one.
        - id: E6
          explanation: >-
            The source may state its pair for a PARTICULAR choice of the
            smoothness bound - for instance an asymptotic choice, which this
            implementation computes separately at cost_model.py:260-262 - rather
            than for the optimizer's minimizer. Comparing a non-optimal-B pair
            against an optimized minimum is a category difference between two
            procedures, not a discrepancy between two numbers.
        - id: E7
          explanation: >-
            This reimplementation's rendering of the source's FORMULAS into
            specification.yaml:60-70 could differ from the source's Section 4.1 in
            a way that shifts the attained minimum. This is a question about the
            formulas, which no task of this campaign has independently re-derived
            from the source; it is expressly NOT a question about the ten values,
            whose fidelity EV-SSI-7a3e91 settled.
        - id: E8
          explanation: >-
            Reported precision. Figures stated to one decimal place carry a
            rounding interval; a figure at the edge of that interval can fall on
            either side of a boundary. This is a property of reporting precision.
      closing_note: >-
        E2, E3, E4, E6 and E8 are all properties of THIS PROGRAM'S instrument or
        of reporting conventions, not of the source. E1 is a property of what
        the source says it is doing. E5 and E7 are properties of the interface
        between them. The enumeration is not claimed to be exhaustive.
    what_a_reader_may_and_may_not_cite_the_anchor_for_after_this_amendment:
      may:
        - The anchor, by locator, as the source's stated lower bound at a named field size, with its relation and unit attached.
        - The C1 instrument-sanity verdict, with its tolerance and its two-sided character stated.
        - The reachability status per field size, as an observation about this cost model's declared grid.
        - The signed deviation, when reported together with the reachability status and the subtraction order.
      may_not:
        - The anchor as a cost, a security level, a work factor, or an attack cost of anything.
        - The anchor as a model point at a field size where the status is `off_curve`.
        - Any row, crossover, speedup or baseline comparison derived from an `off_curve` anchor, as a quantity of this model.
        - The `P=512` crossover value or its `w=2^80` sign, which stay non-citation-eligible; nor any row falling under the predicate extension.
        - The status, in either direction, as evidence about the source, the transcript, any isogeny problem, any scheme, any parameter set, or any exponent.
    scope_of_everything_in_this_block: >-
      Everything above is scoped to the frozen EXP-WESOVOW-001 contract, its two
      committed run packages, the five declared field sizes, the six declared
      memory budgets, the four declared overhead scenarios, this cost model and
      these two anchors. NO security, SQIsign, CSIDH, standardized-parameter,
      exponent, asymptotic-complexity, speedup or attack claim is made in any
      direction, and no transfer to any other parameter, scheme or method is
      claimed or admissible.

  limitations_of_this_analysis:
    - >-
      The source characterization "lower bounds from an explicitly rough
      underestimation" is taken from DEC-20260904-4c81b6, not from a reading of
      the source. This task did not open inputs/P13-WESOLOWSKI-2026/, which is
      outside its read scope and whose relevant lines are protected for a
      concurrent blind task. Every clause resting on that characterization
      inherits the decision's own evidence and no more.
    - >-
      The reachability statuses are cited from RC-2 as recorded. This task
      recomputed nothing: recomputing them would require executing
      cost_model.py, which is prohibited absolutely.
    - >-
      The E-list is an enumeration of live readings, not a ranking with
      evidence. This task performed no test that would discriminate among E1-E8,
      and none of them is asserted.
    - >-
      The category analysis rests on reading cost_model.py as text at the line
      numbers cited. It was never executed and no emitted record was regenerated
      to confirm the serialization shape; the shape is read off the source at
      lines 298-319 and off the committed record's structure as described in
      already-committed reviews.
