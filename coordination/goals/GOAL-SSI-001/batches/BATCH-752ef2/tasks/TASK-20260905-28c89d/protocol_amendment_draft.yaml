schema: crypto.autoresearch.protocol_amendment.v1
# DRAFT. NOT IN FORCE. NOT APPROVED BY THIS TASK, BY THIS BATCH, OR BY THE
# DECISION THAT OPENED THIS BATCH. Drafting an amendment is not licence to
# perform it, and experiments/EXP-WESOVOW-001/specification.yaml was not
# modified, moved, reformatted or staged by this task.
amendment:
  status: draft
  approved_by: null
  approved_by_task: null
  drafted_by_task: TASK-20260905-28c89d
  drafted_at: '2026-09-05'
  goal_id: GOAL-SSI-001
  batch_id: BATCH-752ef2
  experiment_id: EXP-WESOVOW-001
  version_from: 1
  version_to: 2
  version_note: >-
    `version_to: 2` numbers the CONTRACT. It is unrelated to the version_from/
    version_to pair of the earlier recorded amendment at
    .../BATCH-2e6130/tasks/TASK-20260809-ef3e58/protocol_amendment.yaml, which
    governs cost_model.py and which explicitly listed specification.yaml under
    its immutable_exclusions. The contract has never been amended and is still
    at version 1 on origin/main.
  repo_head_commit_at_drafting: 0b8b1b7799d15e083294d847a952f38d8f3f7482

  in_force: false
  in_force_statement: >-
    THIS RECORD IS A DRAFT AND HAS NO EFFECT. Nothing below is a change that has
    been made. EXP-WESOVOW-001 remains `approved` and UNAMENDED, its
    specification file is unchanged, no run is authorized, no status moves, and
    no reader may cite any clause of this draft as governing. An amendment that
    reads as though it were in force would be a fabrication of authority; this
    line exists so that no excerpt of this file can be read that way.

  citation_prohibition_restated_verbatim: >-
    The `P=512` crossover value and its `w=2^80` sign are **NOT
    citation-eligible**. This task does not lift that prohibition. Only a
    committed Coordinator decision on independently reviewed evidence can lift
    it.
  citation_prohibition_predicate_extension_restated_verbatim: >-
    In addition to the retained sentence, a row of any EXP-WESOVOW-001
    reconciliation is NOT citation-eligible when either (a) the two anchors
    disagree in the SIGN of the baseline comparison at that row, or (b) the
    smaller |margin| across the two anchors at that row is below that field
    size's anchor gap |Delta log2 T_full + Delta log2 M / 2|.
  citation_prohibition_applicability_in_this_artifact:
    retained_sentence:
      applicable: true
      fired: false
      why: >-
        APPLICABLE, AND THIS IS THE ARTIFACT WHERE THE QUESTION IS SHARPEST: the
        superseded text is itself an analytic crossover line and this draft
        quotes it verbatim, which the batch permits. NOT FIRED: the proposed
        replacement text deliberately states NO closed form for w*, asserts no
        corrected crossover, and contains no crossover value, no baseline
        comparison, no margin, no sign and no speedup at any field size. That
        restraint is not incidental - see
        design_choice_the_replacement_states_no_closed_form below. This draft
        does not lift either limb and could not; only a committed Coordinator
        decision can.
    predicate_extension:
      applicable: false
      fired: false
      why: >-
        The predicate scopes rows of an EXP-WESOVOW-001 reconciliation. This
        draft cites no reconciliation row and computes no per-row margin, so the
        predicate has no object here. The draft does, at clause_3, PROPOSE a
        contract requirement that is adjacent in spirit; that proposal neither
        lifts, narrows, nor restates the standing prohibition, which survives
        this draft untouched whether or not the draft is ever enacted.
  blind_phase_hygiene_compliance: >-
    No value of the PAPER_PAIRS mapping at cost_model.py:60-66 and none of the
    five paper-minus-attained-minimum deltas of EV-SSI-5d954c is restated in
    this artifact. They are named by locator only. The formulas of the earlier
    recorded amendment are likewise named by locator and not restated.

  # =====================================================================
  gating_reproduction:
    artifact: coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/defect_reproduction.yaml
    verdict: reproduced
    finalized_before_this_draft_was_begun: true
    summary_without_restating_it: >-
      The reproduction, performed from the frozen file alone and including the
      scope audit that establishes the two blocks are in one scope, returned
      `reproduced`, with satisfying set R x {0} in (log2 T_full, log2 M) and
      degenerate witness log2 M = 0. It also found that control C3 forces the
      same satisfying set independently of control C4. This draft is
      conditioned on nothing else.

  # =====================================================================
  target:
    primary:
      file: experiments/EXP-WESOVOW-001/specification.yaml
      line_range: 39-40
      key_path: experiment.metrics[5]
      prior_text_verbatim: |
        39:  - crossover memory log2(w*) per (p, overhead c), analytic: w* = (T_full * 2^{c*sqrt(log2
        40:      p)} / T_DG)^2, capped by M
    secondary_annotation_only:
      - file: experiments/EXP-WESOVOW-001/specification.yaml
        line_range: 58-107
        key_path: experiment.model_definition
        nature: >-
          ADDITIVE. One new key is added to model_definition. No existing key of
          model_definition is changed, reworded, reordered or removed.
      - file: experiments/EXP-WESOVOW-001/specification.yaml
        line_range: 134-141
        key_path: experiment.controls[0] (C1-sanity-paper-pairs)
        nature: >-
          ADDITIVE ANNOTATION ONLY. C1's id, description, tolerance and
          on_violation lines are RETAINED WORD FOR WORD. Two new keys are added
          alongside them. The two-sided 0.75-bit test is not changed, not
          widened, not narrowed, and not made one-sided.
        prior_text_verbatim: |
          134:  - id: C1-sanity-paper-pairs
          135:    description: 'Reproduce the paper''s five Section 4.1 (log2 time, log2 memory) pairs for
          136:      log2(p) in {256, 384, 512, 576, 768}.
          137:
          138:      '
          139:    tolerance: abs deviation <= 0.75 bit on both time and memory
          140:    on_violation: record deviation honestly in execution_report; run stays valid (this is
          141:      a model-reproduction check, not an implementation check)
    not_targeted_and_explicitly_untouched:
      - experiment.controls[1] (C2), lines 142-144
      - experiment.controls[2] (C3), lines 145-147
      - experiment.controls[3] (C4), lines 148-149 - C4 is the block the defect is measured against and it is CORRECT AS WRITTEN; this amendment repairs the metrics line to agree with C4, never C4 to agree with the metrics line
      - experiment.model_definition.quantities, lines 58-70
      - experiment.scenario_definitions, lines 108-132
      - experiment.budget, lines 42-45
      - experiment.stopping_rules, lines 150-154
      - experiment.honesty_constraints, lines 155-159
      - experiment.metrics[0..4] and metrics[6], lines 34-38 and 41
      - everything under experiments/EXP-WESOVOW-001/runs/
      - everything under inputs/P13-WESOLOWSKI-2026/

  # =====================================================================
  why_an_amendment_and_not_an_edit: >-
    specification.yaml is a FROZEN, APPROVED CONTRACT (experiment.status:
    approved, experiment.approved_by: coordinator, experiment.approved_by_task:
    TASK-20260724-P13-COST). Two committed run packages, at least two committed
    evidence records and two committed decisions were produced against its text
    as written, and their meaning is fixed by what that text said at the time
    they were produced. An in-place edit would silently re-score those records
    against a contract they were never run under, would destroy the ability of
    any later reader to see what the earlier reviewers actually read, and would
    make the campaign's oldest adverse finding disappear rather than be
    discharged - the exact failure AGENTS.md forbids when it requires
    corrections to supersede and never overwrite. A recorded superseding
    amendment leaves the defective text in place and readable, states the
    replacement beside it, and dates the change, so that every prior record
    stays scoped to the version it was produced under. Additionally, the
    program has one live instance of the opposite choice going wrong in the
    other direction: the earlier amendment excluded specification.yaml from its
    own reach, which is how the contract came to disagree with the
    implementation that its own amendment governs. This draft therefore names
    the contract as its target explicitly rather than by exclusion.

  design_choice_the_replacement_states_no_closed_form: >-
    DELIBERATE AND LOAD-BEARING. The proposed replacement does not put a
    corrected closed form for w* into the metrics list, for three independent
    reasons. FIRST, the batch's citation prohibition permits quoting the frozen
    contract's crossover text but forbids asserting what the corrected crossover
    is, and this draft is bound by that. SECOND, it is the actual root cause: a
    metrics list is a list of REPORTED QUANTITIES, and the defect exists because
    a law was stated there, in a place where no reader looks for the governing
    law and where nothing checks it against the controls. Moving the law out of
    the metrics list is the smallest change that makes the class of defect
    unrepeatable, rather than fixing one instance of it. THIRD, a governing
    statement of the law already exists as a committed, frozen record - the
    earlier recorded amendment - and authoring a second, independently worded
    copy of it in a different file is how two statements come to disagree in the
    first place. The replacement therefore names the reported quantity and its
    unit, incorporates the law by reference to that record, and adds an
    invariant that any incorporated law must satisfy the contract's own controls
    C3 and C4. The invariant is what makes the contract self-checking: under it,
    the defect being repaired here could not have been written down.

  proposed_replacement:
    clause_1:
      addresses: the primary target, experiment.metrics[5], lines 39-40
      operation: replace in full
      replacement_text_in_full: |
        - crossover memory log2(w*) per (p, overhead c): the memory budget, in
          table entries, at which the overhead-inflated vOW time of a given
          (p, c) scenario meets the Delfs-Galbraith baseline fixed by control
          C2, reported together with a feasibility flag recording whether that
          budget lies at or below log2 M. This metrics list names reported
          quantities and their units and states no law. The vOW charging law
          from which log2(w*) is computed, and the closed form of log2(w*)
          itself, are stated once for this contract in
          model_definition.vow_charging_law and nowhere else.
      what_it_removes: >-
        The closed form `w* = (T_full * 2^{c*sqrt(log2 p)} / T_DG)^2, capped by
        M` as a statement of this contract. It is removed as a STATEMENT, not
        erased as a fact: the prior text is quoted verbatim in this record under
        target.primary.prior_text_verbatim and stays readable in the frozen file
        until and unless a Coordinator decision enacts this amendment.
    clause_2:
      addresses: experiment.model_definition, lines 58-107
      operation: add one key; change nothing existing
      replacement_text_in_full: |
        vow_charging_law:
          status_in_this_contract: >-
            The single governing statement of T(w) for this experiment. Before
            this amendment the contract stated no charging law in
            model_definition at all, and the only recoverable statement of one
            was the closed-form crossover that formerly stood in the metrics
            list. That is the defect this amendment repairs.
          incorporated_by_reference:
            record: coordination/goals/GOAL-SSI-001/batches/BATCH-2e6130/tasks/TASK-20260809-ef3e58/protocol_amendment.yaml
            keys: amendment.corrected_model.log2_law, amendment.corrected_model.endpoint_behavior, amendment.corrected_model.crossover
            why_by_reference_and_not_restated: >-
              That record is committed, frozen, and already governs
              cost_model.py. A second independently worded copy of a law in a
              second file is how the two came to disagree. This contract holds
              exactly one pointer, not a paraphrase.
          invariants_that_any_incorporated_law_must_satisfy:
            - Control C3 of this contract: T(w) non-increasing in w for every (p, overhead) scenario, and T(w) = T_full for w >= M.
            - Control C4 of this contract: T(M) = T_full exactly, before the declared overhead multiplier.
            - The crossover closed form used to report metrics[5] must be the crossover OF THAT SAME LAW, i.e. it must solve log2 T(w*) + overhead_bits = log2 T_DG under it.
          binding_effect: >-
            If an incorporated law violates any invariant above, the contract is
            defective and the defect is repaired by a further recorded
            amendment, never by an edit and never by relaxing a control.
          notation_note: >-
            RECORDED BECAUSE IT WAS FOUND AND IS REAL. The symbol `w` is used in
            two senses in this contract: the Dickman argument log2X/log2B in
            model_definition.quantities, and the MEMORY BUDGET in table entries
            in the metrics list, in scenario_definitions
            .memory_budgets_log2w_entries, and in controls C3 and C4. Every
            occurrence of `w` in this key and in metrics[5] is the memory-budget
            sense. This amendment records the collision and does not rename
            either use; renaming would touch text no defect requires touching.
    clause_3:
      addresses: experiment.controls[0], C1-sanity-paper-pairs, lines 134-141
      operation: >-
        add two keys alongside the existing four; change no existing line of C1
      replacement_text_in_full: |
        anchor_semantics:
          what_the_five_pairs_are: >-
            Figures stated in the frozen source as LOWER BOUNDS, from an
            underestimation the source itself describes as rough. PROVENANCE OF
            THAT CHARACTERIZATION, STATED EXACTLY: it is recorded by
            DEC-20260904-4c81b6 next_actions[0] limb (ii), and that decision's
            next_actions[1] records the source location as
            inputs/P13-WESOLOWSKI-2026/paper_fulltext.md:234-238. THE DRAFTING
            TASK DID NOT OPEN THAT FILE - it is outside its read scope and its
            lines are protected for a concurrent blind task - so the locator is
            cited to the decision that records it and not to a reading. Their
            fidelity to that source is settled: EV-SSI-7a3e91 records a producer
            verification and a blind independent second extraction agreeing on
            all ten values. This contract takes those values as given and
            proposes no change to any of them. AN ENACTING COORDINATOR SHOULD
            CONFIRM THE LOCATOR AGAINST THE FILE BEFORE ENACTMENT.
          what_C1_is_and_why_its_test_is_two_sided: >-
            C1 is an INSTRUMENT SANITY GATE and a model-reproduction check, as
            success_criterion_note and C1.on_violation both declare. Its target
            is the source's ARITHMETIC, and a reimplementation landing above the
            source's figure is as suspect as one landing below, so the two-sided
            0.75-bit tolerance is CORRECT FOR C1'S OWN DECLARED PURPOSE and is
            retained here unchanged. The source's relation attaches to the
            INTERPRETATION of that arithmetic as an attack cost, not to the
            arithmetic itself.
          serialization_requirement: >-
            THE OPERATIVE CLAUSE. Any implementation of this contract that
            serializes a per-field anchor value, or a deviation computed against
            one, must emit with it: the relation the source states for it, the
            unit of the value, and a locator for the source line. A bare
            numeric pair under keys naming only a time and a memory is
            non-conforming, because it escapes the implementation carrying
            neither the relation nor the unit into records whose readers must
            re-derive both from a document outside their read scope.
          deviation_sign_note: >-
            A deviation computed against such an anchor is the signed difference
            of this model's value minus the source's stated figure. Its sign is
            information about the two quantities being different kinds of thing,
            not by itself an instrument fault, and it may not be reported as one
            without the anchor_reachability status required by clause_4.
    clause_4:
      addresses: experiment.controls[0], C1-sanity-paper-pairs, lines 134-141
      operation: add one further key alongside those of clause_3
      replacement_text_in_full: |
        anchor_reachability:
          requirement: >-
            For every field size, an implementation of this contract must record
            whether the anchor's time is attainable by this cost model on the
            optimizer grid declared in model_definition.optimizer - that is,
            whether it lies at or above the minimum of log2(T_full) attained
            over log2B in [1.0, 60.0] at step 0.1. The status is recorded per
            field size, in the raw output, as `reachable` or `off_curve`.
          why_it_is_required: >-
            Because the reported status is already known to differ across the
            declared field sizes, and because an implementation that emits fully
            formed comparison rows from an anchor that is not a point of this
            model, with no field recording that fact, invites a reader to treat
            two different KINDS of quantity as two estimates of one quantity.
            Recording the status is what stops that reading; it is not a defect
            report about the anchor and is not a claim that any published figure
            is wrong.
          licensing: >-
            The full statement of what each status licenses and forecloses is at
            category_and_licensing_analysis.yaml of the drafting task and is
            summarized here: an `off_curve` status licenses reporting and
            comparing the anchor as the source's stated lower bound and licenses
            C1's instrument-sanity verdict; it FORECLOSES treating the anchor as
            an admissible (T_full, M) input to this model at that field size,
            and forecloses citing any row derived from it as a cost, a speedup
            or a crossover of this model. A `reachable` status licenses using
            the anchor as a model point at that field size, and licenses nothing
            about the field sizes where the status is `off_curve`.
          relation_to_the_standing_citation_prohibition: >-
            This clause neither lifts, narrows, nor restates the standing
            citation prohibition on the `P=512` crossover value and its
            `w=2^80` sign, nor its predicate extension. Both survive this
            amendment in full and are lifted only by a committed Coordinator
            decision on independently reviewed evidence.

  # =====================================================================
  what_this_changes:
    - The contract stops stating a charging law inside its metrics list; metrics[5] becomes a description of a reported quantity and its unit.
    - The contract gains, for the first time, a single named place where its vOW charging law lives (model_definition.vow_charging_law), incorporated by reference to the already-committed record that governs the implementation.
    - The contract gains an invariant requiring any incorporated law to satisfy its own controls C3 and C4, which makes this class of defect unwritable in future.
    - The contract records the `w` name collision it has always had, without renaming either use.
    - C1 gains a declaration of what the five anchor values ARE in the source and of why its own two-sided test is correct for its declared purpose.
    - Implementations become required to serialize the relation, the unit and a source locator with any anchor value or anchor-derived deviation.
    - Implementations become required to record, per field size, whether the anchor is a point of this cost model on the declared optimizer grid.
    - CF-1 of BATCH-dc1424 becomes dischargeable, and EV-SSI-5d954c observations 1 and 2 become historical rather than live, if and only if a Coordinator decision enacts this.
  what_this_does_not_change:
    - No value of the source-derived anchor mapping at cost_model.py:60-66. Not one. No clause of this amendment operates on any of those ten values or is conditioned on them.
    - C1's two-sided 0.75-bit tolerance, which is retained word for word and is correct for C1's declared instrument-sanity purpose.
    - C1's on_violation rule, its description, or its status as an instrument sanity gate rather than a success criterion.
    - Controls C2, C3 and C4, which are unchanged; C4 in particular is correct as written and is the block the metrics line is being brought into agreement with.
    - model_definition.quantities, the optimizer declaration, the Dickman method, the scenario definitions, the budget, the stopping rules, the honesty constraints, and metrics[0..4] and [6].
    - The observation-only character of the contract; success_criterion and falsification_criterion stay null.
    - Any committed run package. RUN-WESOVOW-001 and RUN-WESOVOW-201692-001 are immutable and are not re-scored, re-run, re-read or reinterpreted by this amendment; they remain scoped to version 1 of the contract.
    - Any committed evidence record, decision, review report or archive receipt.
    - The standing citation prohibition and its predicate extension, both of which survive in full.
    - The status of EXP-WESOVOW-001, of GOAL-SSI-001, or of any hypothesis. None moves.
    - The frozen source at inputs/P13-WESOLOWSKI-2026/, which is not touched and about which no claim is made.

  # =====================================================================
  constraint_compliance:
    constraint_i:
      quoted_from: ledger/decisions/DEC-20260904-4c81b6.yaml, next_actions[0], limb (i)
      answer: >-
        DISCHARGED, and discharged by construction rather than by disclaimer.
        Every clause of this amendment operates on the CONTRACT'S OWN statements
        - where its charging law lives, what its metrics list may state, what an
        implementation must serialize alongside a value, and what an
        implementation must record about reachability. No clause proposes to
        change, replace, adjust, or condition itself on any of the ten values of
        the source-derived mapping at cost_model.py:60-66. EV-SSI-7a3e91
        established their fidelity to the frozen source by a producer
        verification replicated by a blind independent second extraction, and
        this amendment takes that as settled and closed. clause_3's
        `what_the_five_pairs_are` states the values as given and says so in
        terms.
      discharged_at:
        - proposed_replacement.clause_3.replacement_text_in_full, key what_the_five_pairs_are
        - what_this_does_not_change, first item
      checked_mechanically_by: AC-3, reported in amendment_controls_report.yaml
    constraint_ii:
      quoted_from: ledger/decisions/DEC-20260904-4c81b6.yaml, next_actions[0], limb (ii)
      answer: >-
        DISCHARGED AT clause_3, IN THE NARROW FORM ADOPTED BY PD-8 AND NOT IN
        THE BROADER ONE. The amendment treats this as a CATEGORY question about
        what a serialized value carries, not as a question about digits.
        clause_3 affirms in the contract's own text that C1's two-sided test is
        CORRECT FOR C1'S OWN DECLARED INSTRUMENT-SANITY PURPOSE and retains that
        test unchanged; the operative repair is the serialization requirement,
        which makes the relation, the unit and a source locator travel with any
        anchor value or anchor-derived deviation, so that no downstream reader
        has to re-derive them from a document outside their read scope. The
        object of the repair is cost_model.py's serialization at line 302, whose
        emitted keys name only a time and a memory; the contract-level
        requirement is stated here and the implementing change to that file is
        assigned to the companion record named under
        cf_10_raw_path_placement. The full category analysis, including the
        adopted narrow form quoted and the superseded broader one disclaimed, is
        at category_and_licensing_analysis.yaml.
      discharged_at:
        - proposed_replacement.clause_3, keys what_C1_is_and_why_its_test_is_two_sided, serialization_requirement, deviation_sign_note
        - category_and_licensing_analysis.yaml, block `category`
      checked_mechanically_by: AC-4, reported in amendment_controls_report.yaml
    constraint_iii:
      quoted_from: ledger/decisions/DEC-20260904-4c81b6.yaml, next_actions[0], limb (iii)
      answer: >-
        DISCHARGED AT clause_4, AND COVERING BOTH KINDS OF FIELD SIZE. The
        contract gains a requirement to record the anchor's reachability status
        per field size, and the licensing statement covers what an `off_curve`
        status licenses and forecloses AND what a `reachable` status licenses -
        including that a `reachable` status at some field sizes licenses nothing
        at the others. The status is recorded as a property of this cost model's
        declared optimizer grid, never as a defect report about the source: the
        leading and entirely benign explanation, that a lower bound is entitled
        to lie below a model's attained minimum, is stated first, and seven
        further explanations besides a wrong figure are enumerated in
        category_and_licensing_analysis.yaml. No field size is named with a
        status in this draft; the per-field statuses are cited by their
        recording task in that analysis.
      discharged_at:
        - proposed_replacement.clause_4, keys requirement, why_it_is_required, licensing
        - category_and_licensing_analysis.yaml, block `licensing`

  # =====================================================================
  scope:
    what_the_amended_contract_governs: >-
      Exactly what version 1 governed and nothing more. The objects are: the
      five declared field sizes log2 p in {256, 384, 512, 576, 768}; the six
      declared memory budgets log2 w in {30, 40, 50, 60, 70, 80} table entries;
      the four declared overhead scenarios c in {0.0, 0.5, 1.0, 2.0}; the two
      declared byte-per-entry conversions.
    curves: >-
      NO CURVE IS INSTANTIATED AND NONE IS TESTED. The contract is an analytic
      cost model over supersingular isogeny parameters at the declared field
      sizes; it computes no isogeny, generates no curve, and solves no instance.
      "Curves and parameters" for this contract means the five field sizes above
      and nothing else.
    solver: >-
      There is no solver. The implementation is a deterministic numerical
      optimizer over log2B on the declared grid, with the Dickman rho evaluated
      by the declared Laplace-inversion method. No search, no randomness, seed
      recorded as 0 and unused.
    budget: >-
      Unchanged from version 1: wall_clock_seconds 600, memory_gb 2,
      maximum_runs 2. This amendment authorizes NO new run. Whether a successor
      run is ever executed under the amended contract is a separate Coordinator
      decision, and the CF-10 hazard below is a reason it must be.
    claim_ceiling: >-
      Unchanged and observation-only. No security, SQIsign, CSIDH,
      standardized-parameter, exponent, asymptotic-complexity, speedup or attack
      claim is made or supported by this amendment in any direction, and none is
      admissible from it. Nothing here measures anything about any isogeny
      problem.

  # =====================================================================
  blast_radius:
    statement: >-
      Every committed artifact, control and record whose MEANING changes if this
      amendment is enacted. None of their bytes change; all are immutable. What
      changes is the contract version they must henceforth be read against.
    frozen_artifacts:
      - path: experiments/EXP-WESOVOW-001/specification.yaml
        effect: The direct target. Lines 39-40 superseded; model_definition and C1 gain additive keys. Version becomes 2 and every record produced before enactment stays scoped to version 1.
      - path: experiments/EXP-WESOVOW-001/cost_model.py
        effect: >-
          Becomes NON-CONFORMING to the amended contract in two ways it was not
          non-conforming before: its per-field serialization at line 302 emits a
          bare numeric pair with neither relation nor unit nor source locator,
          and it records no per-field reachability status. Its charging law and
          crossover computation at lines 239 and 288 already match the
          incorporated record and are unaffected. Bringing it into conformance
          is the companion record below and is not performed by this amendment.
      - path: experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-001/
        effect: Immutable and not re-scored. Read henceforth as a version-1 run under the pre-amendment metrics line.
      - path: experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-201692-001/
        effect: Immutable and not re-scored. Its raw-result.json `paper_pair` and `deviation_bits` blocks are exactly the non-conforming serialization clause_3 addresses; they stay as emitted.
    committed_records_whose_reading_changes:
      - id_or_path: ledger/evidence/EV-SSI-5d954c.yaml
