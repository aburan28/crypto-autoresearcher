  completion_gate:
    - All six declared artifacts exist at their exact declared paths and NOTHING ELSE was written into the task directory; an undeclared seventh file makes the snapshot commit fail verification.
    - No file under experiments/ or inputs/ was modified, moved, staged, or executed, and cost_model.py was never run.
