handoff:
  id: TASK-20260905-28c89d
  from: coordinator
  to: executor
  objective: >-
    (A) Reproduce, from experiments/EXP-WESOVOW-001/specification.yaml alone and
    with line locators and the algebra written out, the defect that
    DEC-20260904-166ab5 and EV-SSI-5d954c record at lines 39-40 of that file:
    that it still carries the pre-fix analytic crossover and that no single
    charging law satisfies both that metrics line and control C4 of the same file
    unless log2 M = 0. Finalize that reproduction BEFORE drafting anything. (B)
    Then draft a RECORDED SUPERSEDING PROTOCOL AMENDMENT for that contract, as a
    draft record in your own task directory, satisfying the three binding
    constraints quoted verbatim below. THE DELIVERABLE IS THE AMENDMENT RECORD
    AND ITS JUSTIFICATION, NOT THE EDIT. specification.yaml is a FROZEN CONTRACT,
    is not in your write scope, and may not be modified, moved, reformatted or
    staged by you or by anyone in this batch.
  uncertainty_reduced: >-
    Whether the campaign's oldest undischarged adverse finding - a frozen
    experiment contract that no reader can satisfy - is real as recorded and, if
    it is, what the smallest correct repair actually says now that RC-1 has
    eliminated the transcription explanation for the anchor divergence. Three
    batches have cited "internally unsatisfiable" from one blind re-derivation
    that nobody has repeated, and no committed artifact states what the repair
    should be.
  inputs:
    - experiments/EXP-WESOVOW-001/specification.yaml (READ-ONLY; the target is lines 39-40 and control C4, in the context of the whole file)
    - experiments/EXP-WESOVOW-001/cost_model.py (READ-ONLY, AS TEXT ONLY, NEVER EXECUTED; lines about 295-315 carry the serialization the category question is about)
    - ledger/decisions/DEC-20260904-4c81b6.yaml (the decision that ordered this task; its rationale items 5 and 6, PD-8, and next_actions[0] bind here)
    - ledger/decisions/DEC-20260904-166ab5.yaml (the origin of RC-6/O1 and of the citation prohibition's predicate extension)
    - ledger/evidence/EV-SSI-5d954c.yaml (observations 1-2 are the recorded defect; observation 7 is the anchor pattern)
    - ledger/evidence/EV-SSI-7a3e91.yaml (the RC-1 evidence record; it names values by locator only)
    - ledger/goals/GOAL-SSI-001/checkpoints/BATCH-dc1424.yaml (the closing checkpoint of the round that unblocked this task)
    - AGENTS.md, and the frozen_artifact_ruling, citation_prohibition, blind_phase_hygiene, execution_prohibition and carried_forward blocks of BATCH-752ef2/batch.yaml
  the_three_binding_constraints_quoted_verbatim:
    source: ledger/decisions/DEC-20260904-4c81b6.yaml, next_actions[0]
    constraint_i: >-
      "(i) it may NOT propose repairing the anchor by correcting the literals -
      they are the paper's own digits, ten of ten, independently and blindly
      confirmed, and any amendment premised on a transcription defect is now
      excluded"
    constraint_ii: >-
      "(ii) it must address the CATEGORY question NS-2 and OBJ-2 raise rather
      than a digits question - the paper states all ten as lower bounds from an
      explicitly rough underestimation, and the defensible defect is that the
      SERIALIZED `paper_pair` values escape cost_model.py carrying neither the
      relation nor the unit, while the two-sided test remains CORRECT for control
      C1's own declared instrument-sanity purpose"
    constraint_iii: >-
      "(iii) it must state what an anchor whose time is `off_curve` at three of
      five field sizes licenses, since RC-2 confirms the two anchors are not two
      estimates of one quantity there while naming 'the paper's figures are lower
      bounds' as the leading and entirely benign explanation"
    what_constraint_ii_narrowly_means_and_the_framing_you_must_not_revert_to: >-
      DEC-20260904-4c81b6 PD-8 records that this program had been framing this
      more broadly than the evidence supports, INCLUDING IN ITS OWN COMMITTED
      COMMIT MESSAGES, and adopts the Red Team's narrower OBJ-2 form. THE
      SUPERSEDED BROAD FRAMING, WHICH YOU MUST NOT ASSERT: "applying a two-sided
      `abs(dev) <= 0.75` test to the paper's one-sided `>=` figures is itself the
      defect." THE ADOPTED NARROW FORM, WHICH YOU MUST WORK FROM: for control C1's
      own declared purpose the two-sided test is CORRECT - C1 is declared an
      INSTRUMENT SANITY GATE and a model-reproduction check
      (specification.yaml:47-52, 134-141), its target is the source's ARITHMETIC,
      and a reimplementation landing above the source's figure is as suspect as
      one landing below; the source's `>=` attaches to the INTERPRETATION of that
      arithmetic as an attack cost, not to the arithmetic itself. The defensible
      objection is the narrower one: the SERIALIZED `paper_pair` values at
      cost_model.py line 302 escape the file carrying neither the relation nor the
      unit, into records whose readers must re-derive both from a document outside
      most read_scopes in this campaign - and DEC-20260904-166ab5:178 records that
      the C1 tolerance is exceeded at every field size, so those figures are in
      fact being read as signed anchors somewhere. THAT is what your amendment
      addresses.
    what_constraint_iii_can_and_cannot_rest_on: >-
      RC-2 returned `off_curve` at log2 p in {256, 384, 512} and `reachable` at
      {576, 768}, recomputed bit-exactly by an independent reviewer. `off_curve`
      means the anchor's time is not a value of this cost model on the contract's
      own declared optimizer grid. IT IS NOT AN ANOMALY, IT IS NOT AN
      OBSTRUCTION, AND IT IS NOT A CLAIM THAT ANY PUBLISHED FIGURE IS WRONG: both
      reviewers of BATCH-dc1424 independently named the same leading and entirely
      benign explanation, that the source's figures are lower bounds from a
      deliberate underestimation and a lower bound is entitled to lie below a
      model's attained minimum. Your statement must cover BOTH kinds of field
      size - the three where it is unreachable and the two where it is reachable -
      and must enumerate what else could produce `off_curve` besides a wrong
      figure, rather than foreclosing those readings.
  constraints:
    - >-
      READ-ONLY, ABSOLUTELY, AND THIS IS THE CONSTRAINT MOST LIKELY TO BE BROKEN
      BY A WELL-MEANING AGENT: everything under experiments/EXP-WESOVOW-001/ and
      everything under inputs/P13-WESOLOWSKI-2026/. DO NOT EDIT
      specification.yaml. Not one line, not a comment, not a reformat, not a
      "while I am here". A frozen contract changes only by a recorded protocol
      amendment, and drafting that amendment is not licence to perform it. Your
      write scope is your own task directory and nothing else.
    - >-
      DO NOT EXECUTE cost_model.py, EVER - not to reproduce a value, not to check
      a claim, not with WESOVOW_RAW_PATH set. Its default output path names a
      committed run directory, which is the standing evidence-integrity hazard
      CF-10. Read it as text only.
    - >-
      REPRODUCE THE DEFECT BEFORE YOU DRAFT THE REPAIR, AND FINALIZE THE
      REPRODUCTION FIRST. defect_reproduction.yaml is written and finalized before
      protocol_amendment_draft.yaml is begun. Nothing in the drafting may alter
      the reproduction; if drafting makes you want to, record the wish under
      `post_hoc_pressure` in amendment_controls_report.yaml and leave the
      reproduction as written.
    - >-
      IF THE DEFECT DOES NOT REPRODUCE, SAY SO AND STOP DRAFTING. This is a
      contracted, valuable outcome and NOT a failed task. Three batches have cited
      "internally unsatisfiable" from a single blind re-derivation that nobody has
      repeated. If the metrics line and control C4 turn out not to be in the same
      scope - a scenario-scoped override, a superseded block, two different
      quantities sharing a name - then the correct deliverable is the reproduction
      recording exactly that, plus a CLARIFICATION proposal, and an explicit
      statement that the campaign has been reasoning from a misread. Do NOT
      manufacture a defect in order to have something to amend. That outcome
      contradicts a prior finding, so it returns to the Coordinator; write it up
      and stop rather than resolving it yourself.
    - >-
      THE AMENDMENT IS A DRAFT AND MUST SAY SO IN ITS OWN TEXT. It is not
      approved by this task, by this batch, or by the decision that opened this
      batch. It carries `status: draft` and `approved_by: null`, and it names the
      committed Coordinator decision that would be required to enact it. An
      amendment that reads as though it were in force is a fabrication of
      authority.
    - >-
      NO PREMISE OF A TRANSCRIPTION DEFECT, ANYWHERE. Constraint (i) is absolute.
      Do not propose correcting a literal, do not condition any clause on a
      literal being wrong, and do not hedge with "if the literals are correct".
      Control AC-3 exists to check this mechanically and you must run it.
    - >-
      DO NOT REVERT TO THE SUPERSEDED BROAD FRAMING. See
      the_three_binding_constraints_quoted_verbatim.what_constraint_ii_narrowly_means
      above. Control AC-4 exists to check this mechanically and you must run it,
      including its positive control.
    - >-
      EVERY CONTROL NAMES THE CONCRETE INPUT THAT MAKES IT FAIL, THAT INPUT MUST
      BE REAL AND REACHABLE, AND YOU MUST ACTUALLY FIRE THE BRANCH.
      DEC-20260904-166ab5 refuted a control of an earlier round for having no
      reachable failure branch on any real object, so its pass carried no
      information; DEC-20260904-4c81b6 F-3 then found the successor defect, a
      firing condition asserted from a plausible mental model rather than read out
      of the instrument by execution. For each of AC-1, AC-2, AC-3 and AC-4: state
      the input, RUN the control's own code on it, and report what actually
      happened. If a control turns out to be entailed by its own construction, SAY
      SO and report it as carrying no information - that disclosure is worth more
      than the pass.
    - >-
      amendment_controls.py IS A REQUIRED, DECLARED ARTIFACT, NOT AN OPTIONAL
      SCRATCH FILE. It must be standalone: Python standard library only, no
      network, no numpy requirement, no SageMath, no imports from experiments/. It
      reads committed inputs read-only and writes only inside this task directory.
      AC-1 through AC-4 must be implemented in it as separate functions with
      reachable failure branches that a reviewer can import and call with its own
      inputs; joint J2 of the review plan assigns exactly that. PRODUCE EXACTLY
      THE SIX DECLARED ARTIFACTS AND NO SEVENTH: the snapshot archive commits an
      exact path set and an undeclared extra file makes that commit fail
      verification. Use a scratchpad outside the repository for anything else.
    - >-
      BLIND-PHASE HYGIENE BINDS YOU EVEN THOUGH YOU ARE NOT BLIND. Do not restate
      any value of the PAPER_PAIRS mapping at cost_model.py:61-65 in ANY artifact
      you write, and do not restate the five paper-minus-attained-minimum deltas
      of EV-SSI-5d954c. Name them by locator. A concurrent task of this batch
      re-derives those numbers from an external source and your artifacts are
      committed into the tree that task's reviewer is handed. This is the
      CORR-20260905-547849 channel, one layer in.
    - >-
      RESTATE THE CITATION PROHIBITION VERBATIM IN EVERY ARTIFACT, together with
      the predicate extension, and state for each artifact which of them you found
      applicable and why. THIS TASK IS THE ONE PLACE IN THIS BATCH WHERE THE
      PREDICATE COULD PLAUSIBLY FIRE, because specification.yaml:39-40 is itself
      an analytic crossover line: quoting the frozen contract's own text is
      permitted, but DERIVING, RECOMPUTING, TABULATING OR CITING a crossover
      value, a T_DG baseline comparison, a margin or a sign is NOT. State the
      contract's defect without asserting what the corrected crossover is. Do not
      lift either limb; only a committed Coordinator decision can.
    - >-
      Every claim must trace to a committed path and a line or key path. Never
      fabricate commands, outputs, timings, statistics, citations, line numbers,
      or runs. A locator you did not open is a fabrication under AGENTS.md rule 9.
    - >-
      A timeout, crash, missing dependency, or exhausted budget is an operational
      observation and never mathematical evidence about the contract, the cost
      model, the source, or any isogeny problem.
    - >-
      Make no security, SQIsign, CSIDH, standardized-parameter, exponent, or
      asymptotic-complexity claim in any direction, and construct no attack. Write
      no ledger record, change no status, approve nothing, and do not commit.
    - >-
      Do not read, list, or glob
      coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-a210bd/.
      That task is running concurrently with yours and its work is blind; you have
      no need of it and a listing is a read when filenames would tell you what it
      concluded.
    - >-
      Never select a provider, backend, endpoint, or model identifier containing
      Bedrock, case-insensitively.
  deliverables:
    - defect_reproduction.yaml
    - protocol_amendment_draft.yaml
    - category_and_licensing_analysis.yaml
    - amendment_controls.py
    - amendment_controls_report.yaml
    - runtime_session_receipt.yaml
  deliverable_contracts:
    defect_reproduction.yaml: >-
      THE GATING ARTIFACT, FINALIZED FIRST. Quote experiments/EXP-WESOVOW-001/
      specification.yaml lines 39-40 verbatim with their surrounding block and
      key path, and control C4 verbatim with its line range and key path. Write
      out, in symbols, the charging law each implies and solve for the set of
      (log2 T, log2 M) satisfying both; state the satisfying set explicitly and
      state the degenerate witness explicitly. THEN THE SCOPE AUDIT, WHICH IS THE
      LOAD-BEARING PART AND WHICH NOBODY HAS DONE: enumerate every block of that
      file that could scope, override, restrict, supersede or redefine either of
      the two - scenario-scoped overrides, later metrics blocks, differing unit
      declarations, a control that applies to a different quantity of the same
      name - list each with its line range, and record for each whether you
      checked it and what you found. Finish with a verdict from exactly
      {reproduced, not_reproduced, undetermined} and, for `not_reproduced` or
      `undetermined`, the exact reading that dissolves or blocks the defect.
    protocol_amendment_draft.yaml: >-
      The amendment record, as a DRAFT. It carries: `status: draft`;
      `approved_by: null`; the exact target (file, line range, key path) it
      supersedes; the prior text quoted verbatim; the proposed replacement text in
      full; a `why_an_amendment_and_not_an_edit` statement; a
      `what_this_changes` list and a matching `what_this_does_not_change` list; an
      explicit `constraint_compliance` block answering constraints (i), (ii) and
      (iii) one by one and citing where in this draft each is discharged; a
      `scope` statement naming the curves, parameters, solver and budget the
      amended contract governs; and a `blast_radius` list naming every committed
      artifact, control and record whose meaning changes if this amendment is
      enacted. It must also state, with its reason, whether the CF-10 RAW_PATH
      output-path repair belongs in THIS amendment or in a separate one - not
      whether to do it, but where it belongs and why.
    category_and_licensing_analysis.yaml: >-
      Two blocks. CATEGORY: what quantity the serialized per-field comparison
      value actually is; what relation and what unit it carries and fails to
      carry, with the exact cost_model.py line numbers you read; what control C1
      is declared to be and why its two-sided test is correct for that declared
      purpose; and the smallest change that makes the relation and the unit travel
      with the value. State plainly that you are NOT asserting the superseded
      broad framing, and quote the adopted narrow form you are working from.
      LICENSING: what the anchor's recorded reachability status licenses and
      forecloses, separately for the field sizes where RC-2 found it unreachable
      and for the two where it found it reachable; an enumeration of everything
      besides a wrong figure that could produce `off_curve`; and an explicit
      statement of what a reader may and may not cite the anchor for after this
      amendment.
    amendment_controls.py: >-
      Standalone, standard library only, no network, no imports from
      experiments/. Implements AC-1, AC-2, AC-3 and AC-4 as separate importable
      functions, each with a reachable failure branch, each taking its input as an
      argument so a reviewer can call it with an input the reviewer constructs.
      It reads committed inputs read-only and writes only inside this task
      directory. It never executes cost_model.py and never imports from
      experiments/.
    amendment_controls_report.yaml: >-
      AC-1, AC-2, AC-3 and AC-4, each with: what it tests, the CONCRETE input that
      makes it fail, the observed result on that input from actually running it,
      the verdict, and an explicit statement of whether its pass is entailed by
      its own construction. AC-3 and AC-4 each additionally report their POSITIVE
      control - the scratch copy with the offending sentence inserted - having
      been constructed and the scan having actually fired on it. Plus
      `post_hoc_pressure`: anything the drafting made you want to change about the
      finalized reproduction, recorded and not acted on. Plus the exact commands
      you ran against amendment_controls.py, with their output.
    runtime_session_receipt.yaml: >-
      Inference provenance, determinable from committed state rather than from
      prose: requested_policy, reasoning_effort, backend, resolved_model_id,
      model_verified, fallback_used, degraded_requirements, and the exact command
      you ran to obtain them (for example `python3 -m orchestration.adapter
      resolve --role executor`) with its output. IF YOU RAN NO SUCH COMMAND,
      record model_verified: false and resolved_model_id_self_reported, and say
      plainly that no probe was run. Never record a probe you did not perform.
  controls:
    AC-1: >-
      SATISFIABILITY CONTROL (proves-too-much on your own argument). Construct a
      SYNTHETIC pair of blocks in the same shape as the metrics line and control
      C4 but chosen so that a single charging law satisfies both on an open set,
      and run your unsatisfiability argument on it. FAILS IF the argument returns
      unsatisfiable. An argument that finds a contradiction in a contract that has
      none is finding it in its own method, and its verdict on the real contract
      then carries no information. Report what it did, not what it should have.
    AC-2: >-
      DEGENERATE-WITNESS CONTROL. Evaluate your argument at the one point your own
      reproduction concedes the real blocks are jointly satisfiable. FAILS IF the
      argument reports a contradiction there, i.e. if it claims unsatisfiability
      unconditionally rather than on the set your derivation actually excludes.
      This control is the difference between "unsatisfiable" and "unsatisfiable
      except at a degenerate point", and the whole amendment rests on which one is
      true.
    AC-3: >-
      TRANSCRIPTION-PREMISE CONTROL, with a POSITIVE CONTROL that must be fired.
      Declare a premise vocabulary - phrases by which a draft would be premised on
      the literals being wrong, e.g. correcting a literal, a mis-transcription, a
      typo in the anchor, conditioning a clause on the literals being right - and
      scan your own draft for them mechanically. FAILS IF the scan reports a hit
      in the real draft. AND FAILS EQUALLY IF THE SCAN CANNOT FIRE: make a scratch
      copy of the draft with one such sentence inserted, run the same scan on it,
      and confirm it reports the hit. A scan that has never been shown to fire is
      not a control (DEC-20260904-4c81b6 F-3).
    AC-4: >-
      FRAMING-DRIFT CONTROL, with a POSITIVE CONTROL that must be fired. Scan your
      draft and your analysis for any sentence asserting, implying, or quotable as
      asserting the SUPERSEDED BROAD FRAMING that a two-sided tolerance test
      applied to one-sided figures is itself the defect. FAILS IF a hit is found
      in the real draft. AND FAILS EQUALLY IF THE SCAN CANNOT FIRE: insert such a
      sentence into a scratch copy, run the same scan, and confirm it reports the
      hit. Then check the converse by hand and record it: that the draft AFFIRMS
      the two-sided test as correct for control C1's own declared
      instrument-sanity purpose and does not weaken C1 by side effect.
