    - The draft states, with its reason, whether the CF-10 RAW_PATH repair belongs in this amendment or a separate one.
    - AC-1, AC-2, AC-3 and AC-4 each carry a verdict, the concrete failing input, the observed result from ACTUALLY RUNNING the control, and an entailment disclosure; AC-3 and AC-4 each additionally report their positive control having been fired.
    - No value of the cost_model.py PAPER_PAIRS mapping and no EV-SSI-5d954c delta is restated in any artifact; they are named by locator.
    - No crossover value, baseline comparison, margin, sign or speedup is derived, recomputed, tabulated or cited anywhere in the package.
    - The citation prohibition and its predicate extension are restated verbatim in every artifact, neither is lifted, and each artifact states whether either fired.
    - runtime_session_receipt.yaml records inference provenance and records no probe that was not run.
    - No ledger or scientific record was written, no status was changed, nothing was approved, and nothing was committed.
