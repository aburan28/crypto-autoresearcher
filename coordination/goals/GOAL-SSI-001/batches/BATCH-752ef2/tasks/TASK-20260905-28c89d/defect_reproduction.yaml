schema: crypto.autoresearch.defect_reproduction.v1
# GATING ARTIFACT. Written and FINALIZED before protocol_amendment_draft.yaml was
# begun. Nothing in the drafting altered it; pressure to alter it is recorded in
# amendment_controls_report.yaml under `post_hoc_pressure`, not acted on here.
defect_reproduction:
  task_id: TASK-20260905-28c89d
  goal_id: GOAL-SSI-001
  batch_id: BATCH-752ef2
  role: executor
  recorded_at: '2026-09-05'
  repo_head_commit: 0b8b1b7799d15e083294d847a952f38d8f3f7482
  working_tree_dirty_at_read_time: false

  citation_prohibition_restated_verbatim: >-
    The `P=512` crossover value and its `w=2^80` sign are **NOT
    citation-eligible**. This task does not lift that prohibition. Only a
    committed Coordinator decision on independently reviewed evidence can lift
    it.
  citation_prohibition_predicate_extension_restated_verbatim: >-
    In addition to the retained sentence, a row of any EXP-WESOVOW-001
    reconciliation is NOT citation-eligible when either (a) the two anchors
    disagree in the SIGN of the baseline comparison at that row, or (b) the
    smaller |margin| across the two anchors at that row is below that field
    size's anchor gap |Delta log2 T_full + Delta log2 M / 2|.
  citation_prohibition_applicability_in_this_artifact:
    retained_sentence:
      applicable: true
      fired: false
      why: >-
        APPLICABLE, because this artifact quotes and symbolically analyses the
        frozen contract's own analytic crossover line. NOT FIRED, because
        nothing here derives, recomputes, tabulates or cites a crossover value,
        a T_DG baseline comparison, a margin, a sign or a speedup at any field
        size, and log2 p = 512 is named only as a member of the declared field
        size list at specification.yaml:109-114. The analysis below is purely
        symbolic: it contains no numeral that is a crossover, a time, a memory,
        a margin or a deviation.
    predicate_extension:
      applicable: false
      fired: false
      why: >-
        The predicate scopes rows of an EXP-WESOVOW-001 reconciliation. This
        artifact cites no reconciliation row, computes no per-row margin, and
        compares no two anchors at any row, so the predicate has no object here.
  blind_phase_hygiene_compliance: >-
    No value of the PAPER_PAIRS mapping at cost_model.py:60-66 and none of the
    five paper-minus-attained-minimum deltas of EV-SSI-5d954c is restated in
    this artifact. They are named by locator only.

  # ------------------------------------------------------------------ PART 1
  # The two blocks, quoted verbatim from the frozen contract.
  target_block_A:
    file: experiments/EXP-WESOVOW-001/specification.yaml
    line_range: 39-40
    key_path: experiment.metrics[5]
    key_path_derivation: >-
      `metrics:` opens at line 33; its list items are line 34 -> metrics[0],
      35 -> [1], 36 -> [2], 37 -> [3], 38 -> [4], 39-40 -> [5] (a single item
      continued onto line 40 by YAML block folding), 41 -> [6]. metrics[5] is
      therefore the target and it is one list item, not two.
    verbatim_quote: |
      39:  - crossover memory log2(w*) per (p, overhead c), analytic: w* = (T_full * 2^{c*sqrt(log2
      40:      p)} / T_DG)^2, capped by M
    surrounding_block_verbatim: |
      33:  metrics:
      34:  - log2B_opt, B_opt per field size
      35:  - log2X, w_opt, u_opt, log2P0 per field size
      36:  - log2M (memory, entries), log2T_full (time, F_{p^2}-ops) per field size
      37:  - deviation from the paper's five pairs (bits)
      38:  - per (p, w, overhead c): log2 T(w), log2 speedup vs T_DG, crossover flag
      39:  - crossover memory log2(w*) per (p, overhead c), analytic: w* = (T_full * 2^{c*sqrt(log2
      40:      p)} / T_DG)^2, capped by M
      41:  - memory in bytes for 64 and 256 bytes/entry
  target_block_B:
    file: experiments/EXP-WESOVOW-001/specification.yaml
    line_range: 148-149
    key_path: experiment.controls[3]
    verbatim_quote: |
      148:  - id: C4-vow-asymptote
      149:    description: At w = M, vOW time must equal T_full exactly (cap check).
    surrounding_block_verbatim: |
      133:  controls:
      134:  - id: C1-sanity-paper-pairs
      ...
      142:  - id: C2-baseline-consistency
      ...
      145:  - id: C3-monotonicity
      146:    description: T(w) must be non-increasing in memory budget w for every (p, overhead) scenario;
      147:      T(w) must equal T_full for w >= M.
      148:  - id: C4-vow-asymptote
      149:    description: At w = M, vOW time must equal T_full exactly (cap check).
    surrounding_block_elision_note: >-
      The `...` marks elide the description/tolerance/on_violation lines of C1
      (135-141) and the description line of C2 (143-144), which are quoted in
      full elsewhere in this package (C1 at category_and_licensing_analysis.yaml)
      and are not needed for the algebra. The elision is marked so no reader
      mistakes the quote for contiguous text.

  # ------------------------------------------------------------------ PART 2
  # The algebra, written out in symbols. No numerals of the model appear.
  notation:
    t: log2(T_full), the full-memory time in F_{p^2}-operations (spec:70, :36)
    m: log2(M), the full-memory table size in entries (spec:65-66, :36)
    x: log2(w), a memory budget in entries (spec:115-121 declares w in entries)
    d: log2(T_DG), the Delfs-Galbraith baseline (spec:142-144, control C2)
    h: overhead_bits = c*sqrt(log2 p), the declared superpolynomial multiplier (spec:122-129)
    g: >-
      g(x) := log2(T(w)) - t - h, the charging law's memory-dependent term,
      i.e. the amount by which the vOW middle-memory time at budget w differs
      from the full-memory time before overhead.
  what_the_contract_does_and_does_not_state:
    - >-
      LOAD-BEARING AND EASY TO MISS: the frozen contract NEVER STATES A vOW
      CHARGING LAW T(w) ANYWHERE. model_definition.quantities (spec:59-70)
      defines log2X, w, log2Psi, log2M, u, log2P0 and log2Tfull and stops; it
      contains no T(w). The metrics list at :38 names `log2 T(w)` as a reported
      quantity without defining it. So target_block_A at :39-40 is the ONLY
      place in the whole frozen file from which a charging law can be recovered,
      and C4 at :148-149 is a CONSTRAINT ON that same law. This is why the two
      blocks bear on each other at all, and it is what the scope audit in PART 3
      had to establish rather than assume.
  derivation:
    step_1_definition_of_the_crossover: >-
      A crossover memory w* is, by the meaning of the word and by the reported
      `crossover flag` / `log2 speedup vs T_DG` companion metric at :38, the
      budget at which the overhead-inflated vOW time meets the baseline:
      log2(T(w*)) + h = d. In the notation above, t + g(log2 w*) + h = d,
      i.e. g(log2 w*) = -(t + h - d).
    step_2_abbreviation: >-
      Write A := t + h - d, the overhead-inflated full-memory gap to baseline.
      Then step 1 says g(log2 w*) = -A.
    step_3_what_block_A_asserts: >-
      Block A states w* = (T_full * 2^{h} / T_DG)^2 in linear form, i.e. in
      logs: log2 w* = 2*(t + h - d) = 2A. There is NO m term. The trailing
      clause "capped by M" is read in PART 3 under both available readings.
    step_4_the_implied_law: >-
      Substituting step 3 into step 2: g(2A) = -A for every attainable A.
      A is attainable at many distinct points by construction of the contract's
      own scenario grid: h = c*sqrt(log2 p) takes 4 declared c values
      (spec:126-129) at each of 5 declared field sizes (spec:110-114), and d and
      t vary with the field size, so A takes at least twenty distinct values.
      Hence g(y) = -y/2 at at least twenty points of its domain, and on the
      one-parameter power-law family that any single charging law of this form
      inhabits, g(y) = -y/2 identically. With the cap clause this is
      g(y) = -min(y, m)/2. Equivalently:
      LAW IMPLIED BY BLOCK A:  log2 T(w) = t - (1/2)*min(log2 w, m) + h.
    step_5_what_block_B_requires: >-
      C4 requires T(M) = T_full exactly, i.e. at log2 w = m and before the
      declared overhead scenario, g(m) = 0.
    step_6_the_conflict: >-
      Applying step 5 to step 4: g(m) = -min(m, m)/2 = -m/2, and C4 requires
      this to be 0. Therefore m = 0.
  satisfying_set:
    statement_in_symbols: >-
      S = { (t, m) in R x R : m = 0 } = R x {0}.
    in_words: >-
      The pair of blocks is jointly satisfiable by a single charging law if and
      only if log2 M = 0, i.e. M = 1 table entry, for every field size. t is
      unconstrained: the conflict is entirely in the memory coordinate.
    complement: >-
      For every (t, m) with m != 0 there is NO single charging law satisfying
      both blocks. The defect is therefore "unsatisfiable except on the
      degenerate slice m = 0", NOT "unsatisfiable unconditionally". That
      distinction is what control AC-2 exists to protect.
  degenerate_witness:
    statement_in_symbols: '(t, m) = (t_0, 0) for any t_0 in R; equivalently M = 2^0 = 1 entry.'
    why_it_is_degenerate_and_not_a_reading_that_saves_the_contract:
      - >-
        M = 1 entry makes the declared memory-budget grid log2 w in
        {30,40,50,60,70,80} (spec:115-121) lie entirely above M, so every
        declared scenario would be in the flat cap regime and metric :38's
        `log2 T(w)` would be constant across the whole grid.
      - >-
        M = 1 makes control C3 (spec:145-147) vacuous: "T(w) must be
        non-increasing in w" and "T(w) must equal T_full for w >= M" would hold
        trivially at every declared budget.
      - >-
        M = 1 makes metric :41, "memory in bytes for 64 and 256 bytes/entry",
        and the byte-conversion declaration at spec:71-73 pointless.
      - >-
        M is not a free parameter of the contract at all: spec:65-66 fixes
        log2 M = 2*log2X + log2(rho(w)) and spec:60 fixes
        log2X = 0.5*log2B + (log2 p - 1)/6, so m is determined by the optimizer
        over log2B on the grid [1.0, 60.0] (spec:74-78) at each declared field
        size. Whether the determined m equals 0 is a question about attained
        values that this artifact deliberately does not evaluate: evaluating it
        would require executing cost_model.py, which is prohibited absolutely
        (batch.frozen_artifact_ruling, CF-10). The degeneracy argument above
        does not need that evaluation.
    honest_limit_of_the_witness: >-
      The witness is a point of the (t, m) plane, not an observation. This
      artifact does not assert what m actually is at any field size, and no
      number is claimed for it.

  # ------------------------------------------------------------------ PART 3
  # THE SCOPE AUDIT. The load-bearing part, and the part nobody in this program
  # had done: is block A even in the same scope as block B?
  scope_audit:
    question: >-
      Could specification.yaml:39-40 and control C4 be about different objects,
      different regimes, different units, or different versions - so that
      BATCH-256a94's blind re-derivation was reading two blocks that never had
      to agree? Every block of the file that could scope, override, restrict,
      supersede or redefine either target is enumerated below with its line
      range, whether it was checked, and what was found. The file is 167 lines
      and every line is inside exactly one entry of this enumeration, so the
      enumeration is exhaustive by construction.
    blocks_examined:
      - block: experiment header (id, version, status, approved_by, approved_by_task)
        lines: 1-6
        checked: true
        finding: >-
          version: 1, status: approved. One version only; no superseding version
          of either block is present in the file. No scoping effect.
      - block: title
        lines: 7-10
        checked: true
        finding: >-
          Names "the van Oorschot-Wiener middle-memory regime" as the single
          regime of the whole contract. This BINDS the two targets into one
          scope rather than separating them: C4's "vOW time" and block A's
          crossover are both statements about that one regime.
      - block: role
        lines: 11
        checked: true
        finding: No scoping effect.
      - block: schema_repair_note
        lines: 12-18
        checked: true
        finding: >-
          DECISIVE FOR THE VERSION QUESTION, AND CHECKED FOR EXACTLY THAT. It
          records that the 2026-08-02 nesting under CORR-20260802-013 was
          "Field renames only" and states: "No objective, model definition,
          scenario, control, metric, budget, stopping rule or honesty constraint
          is added, removed or reworded." So metrics[5] and control C4 are both
          original text of the approved contract, neither was touched by the
          schema repair, and neither is a stale remnant of a superseded block.
      - block: hypothesis_id and hypothesis_id_note
        lines: 19-23
        checked: true
        finding: Observation-only declaration. No scoping effect on either target.
      - block: objective
        lines: 24-30
        checked: true
        finding: >-
          "then extend into the van Oorschot-Wiener middle-memory regime and
          explicit superpolynomial-overhead scenarios". Confirms one regime and
          one overhead mechanism, shared by both targets. No override.
      - block: frozen_source, created
        lines: 31-32
        checked: true
        finding: No scoping effect.
      - block: metrics list (the target's own container)
        lines: 33-41
        checked: true
        finding: >-
          A single flat list, no scenario keys, no conditional items, no second
          metrics block anywhere in the file (verified by reading all 167 lines;
          `metrics:` occurs once, at line 33). metrics[4] at :38 names
          `log2 T(w)` and a `crossover flag`, i.e. the SAME T(w) and the SAME
          crossover the target item quantifies. Nothing in the list scopes
          metrics[5] to a subset of field sizes, budgets or overhead scenarios.
      - block: budget
        lines: 42-45
        checked: true
        finding: Run budget only. No scoping effect.
      - block: success_criterion and its note
        lines: 46-52
        checked: true
        finding: >-
          Declares the contract observation-only and declares C1 an INSTRUMENT
          SANITY GATE. It scopes C1, not C4, and says nothing about the charging
          law or the crossover. Relevant to the category question, not to this
          audit's conflict. No override of either target.
      - block: falsification_criterion and its note
        lines: 53-57
        checked: true
        finding: >-
          Null with a stated reason. Does NOT weaken controls: it says no
          outcome falsifies a hypothesis, not that a control may fail. No
          scoping effect on C4's force as a contract constraint.
      - block: model_definition.quantities
        lines: 58-70
        checked: true
        finding: >-
          THE MOST IMPORTANT NEGATIVE FINDING OF THIS AUDIT. It defines log2X,
          w (the Dickman u-argument), log2Psi, log2M, u, log2P0 and log2Tfull,
          and it DOES NOT DEFINE T(w). There is therefore no third, governing
          statement of the charging law that could make block A a mere
          shorthand and C4 a mere consistency note. Also checked here for a
          NAME COLLISION and one is present and must be recorded: `w` at :62 is
          the Dickman argument log2X/log2B, whereas `w` in metrics[5], in C3,
          in C4 and in scenario_definitions.memory_budgets_log2w_entries
          (:115-121) is the MEMORY BUDGET in entries. The collision is real, it
          is a genuine defect of the contract's notation, and it is NOT a
          dissolving reading: metrics[5] says "crossover memory log2(w*)" and
          "capped by M", both of which are memory quantities in entries, and
          C4's "At w = M" compares w to M, which only type-checks in entries.
          Both targets therefore use the memory sense of w. Recorded as a
          separate, non-dissolving observation.
      - block: model_definition unit declarations (unit_of_cost, unit_of_memory)
        lines: 71-73
        checked: true
        finding: >-
          One unit of cost (F_{p^2}-operations) and one unit of memory (table
          entries) for the whole contract; byte conversions are declared as
          scenario parameters, not as an alternative unit for M or w. A
          differing-unit reading, in which block A's M and C4's M were the same
          symbol in different units, is therefore CHECKED AND EXCLUDED.
      - block: model_definition.optimizer
        lines: 74-78
        checked: true
        finding: >-
          Declares the minimization of log2(T_full) over log2B in [1.0, 60.0],
          step 0.1, with constraints w >= 1, u >= 1 (the Dickman w of :62).
          This determines m rather than freeing it, and bears on the degenerate
          witness (PART 2) and on the licensing question (a separate artifact).
          No scoping effect on either target.
      - block: model_definition.dickman_rho (method, why_not_dde_marching, validation, accuracy_note)
        lines: 79-107
        checked: true
        finding: >-
          Numerical method for rho only. Read in full; contains no statement
          about T(w), the cap, or the crossover. No scoping effect.
      - block: scenario_definitions.field_sizes_log2p
        lines: 109-114
        checked: true
        finding: >-
          Five field sizes, no per-field-size override of any metric or control.
      - block: scenario_definitions.memory_budgets_log2w_entries
        lines: 115-121
        checked: true
        finding: >-
          Fixes the unit of the memory budget as entries and lists six budgets.
          THIS IS WHERE A SCENARIO-SCOPED OVERRIDE WOULD LIVE IF ONE EXISTED,
          and it is the reading the stop condition of BATCH-752ef2 asks about
          most directly. There is none: the list is six integers with no
          attached law, cap, tolerance or exception.
      - block: scenario_definitions.overhead_scenarios
        lines: 122-129
        checked: true
        finding: >-
          Declares the multiplier 2^{c*sqrt(log2 p)} "on T(w)" with four c
          values. Confirms the overhead is a multiplier applied to the SAME
          T(w) that both targets speak about, and that block A's
          2^{c*sqrt(log2 p)} factor is that same multiplier. Binds the targets
          together; does not separate them. Note c = 0.0 is declared, so the
          conflict is not an artefact of the overhead: at c = 0 block A reduces
          to log2 w* = 2*(t - d) and the derivation of PART 2 is unchanged.
      - block: scenario_definitions.bytes_per_entry
        lines: 130-132
        checked: true
        finding: Byte conversion parameters only. No scoping effect.
      - block: controls C1-sanity-paper-pairs
        lines: 134-141
        checked: true
        finding: >-
          A DIFFERENT QUANTITY OF A RELATED NAME, checked precisely because the
          task card names that scenario. C1 governs the reproduction of the
          source's five (time, memory) pairs against a 0.75-bit two-sided
          tolerance. It constrains neither T(w), nor the cap, nor the crossover,
          and it does not scope C4. It is analysed in
          category_and_licensing_analysis.yaml for a different purpose entirely.
      - block: controls C2-baseline-consistency
        lines: 142-144
        checked: true
        finding: >-
          Fixes log2(T_DG) = log2(p)/2 as the baseline. This is block A's own
          T_DG, so it BINDS block A into the same scope as the controls list
          rather than separating it. Its five parenthesised baseline figures are
          not restated here and are not needed.
      - block: controls C3-monotonicity
        lines: 145-147
        checked: true
        finding: >-
          CORROBORATES THE CONFLICT INDEPENDENTLY OF C4, and was checked for the
          opposite possibility. C3 requires "T(w) must equal T_full for
          w >= M". Under the law implied by block A (PART 2 step 4), T(w) for
          w >= M equals T_full * 2^{-m/2} before overhead, which equals T_full
          only if m = 0. So the same satisfying set S = R x {0} is forced by C3
          alone. The defect therefore does not depend on reading C4 in any
          particular way, and a reading that dissolved C4 would still leave C3.
      - block: controls C4-vow-asymptote
        lines: 148-149
        checked: true
        finding: The target. No qualifier, no scenario restriction, no exception clause.
      - block: stopping_rules
        lines: 150-154
        checked: true
        finding: >-
          Rule 1 conditions a rerun on C1, not on C3 or C4. Rule 2 is the
          infrastructure rule. Neither weakens, scopes or excuses C4, and
          neither mentions the crossover.
      - block: honesty_constraints
        lines: 155-159
        checked: true
        finding: >-
          "this model uses the paper's own conservative conventions; observations
          about cost are model-conditional". Checked for a reading in which
          metrics[5] is a quotation of the paper's convention rather than a
          statement of this contract's own law. Found NOT to support it: the
          line is in this contract's metrics list, is written in this contract's
          own symbols (T_full, T_DG, M, c), and the contract's honesty clause
          governs the interpretation of results, not the ownership of formulas.
          Recorded as a candidate dissolving reading examined and rejected.
      - block: required_artifacts
        lines: 160-167
        checked: true
        finding: No scoping effect.
    candidate_dissolving_readings_examined:
      - reading: >-
          "capped by M" caps the LAW, i.e. the trailing clause already supplies
          the missing m dependence and there is no conflict.
        checked: true
        verdict: rejected
        why: >-
          A cap on the law is exactly what PART 2 step 4 already grants:
          g(y) = -min(y, m)/2. A cap makes the law FLAT above M at the value
          -m/2, which is precisely the value C4 forbids. The cap clause is the
          reason the conflict exists rather than a rescue from it.
      - reading: >-
          "capped by M" caps the REPORTED VALUE w*, i.e. the reported crossover
          is min(w*, M) and the formula is only a pre-cap intermediate.
        checked: true
        verdict: rejected, and it is the weaker of the two readings for the contract
        why: >-
          Under this reading the closed form still has to be the true crossover
          wherever it lies at or below M, since otherwise the reported
          "crossover flag" of metrics[4] would flag a budget at which the
          overhead-inflated time does not in fact meet the baseline. The
          crossover condition of step 1 therefore still applies at every
          uncapped point, and step 4 goes through unchanged.
      - reading: >-
          Block A's T_full is a different quantity from C4's T_full.
        checked: true
        verdict: rejected
        why: >-
          log2Tfull is defined exactly once, at spec:70, and both targets use
          the bare name. No second definition exists in the file.
      - reading: >-
          C4's "vOW time" is a different function from the T(w) whose crossover
          block A states.
        checked: true
        verdict: rejected
        why: >-
          The contract names one regime (spec:7-10, 24-30), one T(w)
          (metrics[4] at :38), and one overhead multiplier applied "on T(w)"
          (:122-125) which is block A's own factor. There is no second time
          function in the file.
      - reading: >-
          `w` means the Dickman argument in one target and the memory budget in
          the other, so the two never meet.
        checked: true
        verdict: rejected, but the underlying name collision is REAL and is recorded
        why: >-
          See the model_definition.quantities finding above. Both targets use
          the memory sense; the collision is a separate notational defect of
          the contract which this reproduction records and does not repair.
      - reading: >-
          metrics[5] is a superseded remnant that a later amendment already
          replaced, so the frozen file's text is not the governing law.
        checked: true
        verdict: >-
          rejected AS A DISSOLVING READING, and the reason is itself the
          strongest recorded fact about this defect
        why: >-
          The recorded protocol amendment at
          coordination/goals/GOAL-SSI-001/batches/BATCH-2e6130/tasks/TASK-20260809-ef3e58/protocol_amendment.yaml
          governs cost_model.py and lists
          experiments/EXP-WESOVOW-001/specification.yaml under its
          `immutable_exclusions`. It therefore explicitly did NOT supersede this
          line. The contract's own metrics[5] remains the governing contract
          text, unamended, which is why an amendment is needed now. This artifact
          restates no formula from that amendment record; it is named by locator.
    scope_audit_conclusion: >-
      The two targets are in the SAME SCOPE: one regime, one T(w), one T_full,
      one M, one unit of memory, one overhead multiplier, one version, one
      controls list with no scenario restriction, and no superseding block. No
      reading of the frozen file separates them, and the one name collision
      found (`w`) resolves to the memory sense in both targets. Additionally,
      control C3 forces the same satisfying set independently of C4, so the
      finding does not rest on a single control.

  # ------------------------------------------------------------------ PART 4
  verdict: reproduced
  verdict_statement: >-
    REPRODUCED, from the frozen file alone, and by a route that includes the
    scope audit the prior record did not have. specification.yaml:39-40 states a
    closed-form analytic crossover with no log2 M term. The unique charging law
    consistent with that closed form, under the crossover's own definition and
    on the contract's own scenario grid, is
    log2 T(w) = log2 T_full - (1/2)*min(log2 w, log2 M) + overhead_bits. That
    law violates control C4 (spec:148-149) unless log2 M = 0, and independently
    violates control C3 (spec:145-147) unless log2 M = 0. The satisfying set is
    R x {0} and the degenerate witness is log2 M = 0.
  precise_form_of_the_finding_and_what_it_is_not: >-
    STATED PRECISELY, BECAUSE THE LOOSE FORM OVERSTATES IT. The frozen file does
    not contain two sentences that contradict each other as sentences: it
    contains one closed-form crossover and two controls, and the contradiction
    is between the LAW THAT CLOSED FORM IMPLIES and what those controls require.
    A reader who declines to infer any charging law from a crossover formula
    does not meet a contradiction; that reader instead meets a contract that
    states no charging law at all (model_definition has none) and can therefore
    not be implemented as written. Either way the contract is unsatisfiable as a
    specification of an implementable procedure, and the repair is the same. The
    finding is "unsatisfiable except on the degenerate slice log2 M = 0", never
