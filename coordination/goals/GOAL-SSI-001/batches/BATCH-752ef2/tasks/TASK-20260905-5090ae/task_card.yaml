# `DEC-20260905-5f5592` below are NOT identifiers and do not match the
# validator's regexes. They must be replaced with tokens minted by
# `python3 tools/allocate_id.py --next` and confirmed with `--check` before this
# task runs; the exhaustive substitution site list is in
# coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/batch.yaml
# reserved_record_ids.substitution_sites_exhaustive. The batch cannot reach its
# ledger archive unarmed, and that is deliberate.
task_card:
  id: TASK-20260905-5090ae
  goal_id: GOAL-SSI-001
  batch_id: BATCH-752ef2
  title: >-
    Coordinator ledger archive for BATCH-752ef2: compose the round, record the
    evidence and the decision, checkpoint the goal, and commit exactly the
    declared set - alone, after the independent review has returned.
  role: coordinator
  state: queued
  review_required: false
  depends_on:
    - TASK-20260905-4098fd

handoff:
  id: TASK-20260905-5090ae
  from: coordinator
  to: coordinator
  objective: >-
    Run alone after the independent review has returned; compose its four
    per-joint verdicts and the two producer packages into one evidence record and
    one decision; compare the recorded coordinator prior against the outcome
    element by element; carry forward every undispatched carried_forward item;
    checkpoint the goal in a write-once shard; and commit exactly those records -
    without changing the frozen experiment, approving the drafted amendment,
    inventing a result, or making any transition the review does not support.
  uncertainty_reduced: >-
    Whether the round's outcome - a reproduced or unreproduced contract defect, a
    drafted amendment and its adequacy, and an external provenance comparison
    that succeeded, failed, or could not be attempted - together with its scope
    limits and its consequences for the campaign's next step, is durably recorded
    before any successor batch is opened.
  inputs:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/reviews/TASK-20260905-4098fd/validation_report.yaml
    - The snapshot-bound producer packages and the receipt from TASK-20260905-6fcd2c
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/review_plan.yaml, including the recorded coordinator_prior
    - The carried_forward list in coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/batch.yaml
    - templates/research-records.md, ledger/decisions/DEC-20260904-4c81b6.yaml, ledger/goals/GOAL-SSI-001/goal.yaml and its checkpoints/BATCH-dc1424.yaml
  constraints:
    - >-
      RUN ALONE, and stage only the declared ledger-archive paths by exact
      pathspec, in ONE commit.
    - >-
      ALLOCATE THE LEDGER IDENTIFIERS BEFORE WRITING THEM. Run
      `python3 tools/allocate_id.py --next evidence --area SSI` and
      `--next decision --date 20260905`, `--check` each, and substitute them at
      every site listed in batch.yaml
      reserved_record_ids.substitution_sites_exhaustive. Never allocate by
      grepping committed state for a maximum; never invent a token by hand.
      Record the allocation in the receipt.
    - >-
      RUN THE GATES AND DO NOT REPORT ONE YOU DID NOT RUN. Run
      `python3 tools/check_review_independence.py --batch
      coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2` - the plan is a
      standalone file at that batch root and this is the round where that gate is
      expected to run for the first time, so record its verbatim output whichever
      way it goes. Run `python3 tools/validate_ledger.py` on the merged tree. Run
      `python3 tools/check_review_independence.py --blind-history <ref>
      --protected-from .../BATCH-752ef2/batch.yaml` and record whether the
      declaration was armed. If this task holds no shell, record each gate as
      OUTSTANDING in the receipt with that reason, state that blindness was
      verified only by reading the report and its attestation, and say plainly
      that this is weaker than the tool (DEC-20260904-166ab5 PD-6).
    - >-
      COMPOSE THE VERDICTS YOURSELF. The reviewer owned four joints and its
      report is not a vote on the whole claim. A joint with no verdict is recorded
      as UNCOVERED, never assumed to hold. Record explicitly that this round had
      ONE reviewer, that its concurrence with either producer is correlated by
      construction because only the `local` backend resolves here, and that it may
      never be presented as agreement between distinct models.
    - >-
      COMPARE THE RECORDED COORDINATOR PRIOR AGAINST THE OUTCOME, ELEMENT BY
      ELEMENT, AND SAY WHICH ELEMENTS WERE OVERTURNED. The prior in
      review_plan.yaml makes seven numbered commitments, including a
      pre-commitment about what the Coordinator expected to be tempted to do.
      Report each as held, overturned, or overturned in its mechanism. A prior the
      review overturns is among the most valuable results this program can
      produce and it is worthless if softened afterwards.
    - >-
      TREAT EVERY CONTRACTED OUTCOME AS A RESULT. A `not_reproduced` defect
      verdict means three batches of this campaign have been reasoning from a
      misread and is a major finding; a `not_retrievable` provenance outcome means
      the gap remains open with a measured account of why, and no fidelity claim
      anywhere in this campaign may be strengthened. Neither is an incomplete
      task, a failed run, or a budget shortfall, and neither may be recorded as
      one.
    - >-
      IF ANY VALUE DISAGREED, THE ROUND HALTS ON THAT OBJECT AND YOU DO NOT
      COMPOSE IT. A digit-level disagreement with the frozen transcript
      contradicts EV-SSI-7a3e91, a committed evidence record at strength
      `replicated`, and under AGENTS.md rule 12 that requires review-breakthrough
      at `max`, which this environment cannot serve. Record the object precisely,
      record the impediment on the still-active goal with what_is_blocked,
      clears_when and recheck, leave the CLAIM un-promoted, and compose only the
      rest of the round. Substituting this round's adversarial review for the
      tier that object needs is the silent downgrade the policy layer forbids.
    - >-
      DO NOT APPROVE THE DRAFTED AMENDMENT. This archive records that a draft
      exists, what the review found about it, and what would be required to enact
      it. Enacting a protocol amendment against a frozen contract is a separate
      committed Coordinator decision on a reviewed draft, and a red-team pass on
      the draft is a named precondition for it. EXP-WESOVOW-001 stays `approved`
      and UNAMENDED.
    - >-
      DO NOT ATTACH THE PROVENANCE BLOCK TO inputs/P13-WESOLOWSKI-2026/source_record.yaml
      IN THIS ARCHIVE. That file is not in your write scope. If the review
      confirms a successful retrieval, name the attachment as the successor action
      with the exact block and key path from the producer's draft; if the outcome
      was a disagreement, name a correction record under a new identifier instead.
    - >-
      Do not edit experiments/ or inputs/ or anything under them, do not execute
      cost_model.py, and do not reconstruct, estimate or guess any commit SHA or
      path hash.
    - >-
      THE EVIDENCE RECORD IS A CONTRACT AUDIT, A DRAFTED AMENDMENT, AND ONE
      EXTERNAL DOCUMENT COMPARISON - NOT A NEW EXPERIMENT MEASUREMENT.
      certificate.kind is none; run_ids names only runs actually read, and this
      batch read none; claim_tier may not exceed what document reading, contract
      algebra and a ten-value diff supports; proof_status and proof_refs are set
      honestly. State the tested scope - which file, which line ranges, which
      retrieved document and version - and every transfer assumption.
    - >-
      NO hypothesis status transition, NO experiment status transition, and NO
      goal status transition. GOAL-SSI-001 remains `active` and this batch meets
      and approaches no completion criterion. `paused` and `blocked` are not
      permitted goal statuses.
    - >-
      FILL knowledge_promotion. Promote a KN-FIND only on a `support` or
      `reject_scoped` decision backed by `replicated` or `strong` evidence,
      otherwise record a concrete not_warranted reason. If the external retrieval
      succeeded and agreed, say precisely what that does and does not establish -
      it is a fact about ten numbers in one document at one version, not a durable
      finding about isogenies - and reconsider promotion against the standing
      not_warranted reasoning in DEC-20260904-4c81b6.
    - >-
      IF ANY PART OF THE DECISION WOULD CLOSE A LANE, it carries a complete
      `obstruction` block with a measured quantity, its value with units and error
      bars, the artifacts it is read from, its scope, and a `resource_check`. A
      `not_retrievable` outcome is NOT an obstruction block and may not be used as
      one: it is an infrastructure observation.
    - >-
      DO NOT LIFT THE CITATION PROHIBITION unless this decision itself lifts it on
      the strength of the independent report, and then only with the exact scope
      stated. Retain the predicate extension verbatim unless explicitly superseded
      here, and restate that the committed machine-readable flag under-reports and
      must not be edited.
    - >-
      CARRY FORWARD EVERY UNDISPATCHED carried_forward ITEM INTO next_actions WITH
      ITS ORIGIN, so that CF-7's remainder, CF-8, CF-9, CF-10 and CF-12 cannot
      evaporate between batches, and record what CF-1 and CF-11 discharged and
      what they did not.
    - >-
      CHECKPOINT THE GOAL in the write-once shard
      ledger/goals/GOAL-SSI-001/checkpoints/BATCH-752ef2.yaml and make exactly one
      additive change to goal.yaml: its single next_action plus the pointers to
      this decision, this evidence record, this checkpoint and the verified
      commit. Do not append new narrative keys to the goal head. Preserve exactly
      one next action.
    - >-
      THE COMMIT MESSAGE STATES RECORD IDENTIFIERS AND LOCATORS ONLY, and no
      protected value and no composed verdict token. The blind phase of this
      campaign is not over: successors will re-read this history.
    - >-
      FETCH origin/main BEFORE COMMITTING AND MERGE IT - never rebase. Record the
      base commit and the merge outcome in the receipt, then push and open or
      refresh the PR against main naming the new EV-*, DEC-*,
      TASK-20260905-4098fd and BATCH-752ef2. If a sync conflicts inside an
      immutable record, do not pick a side: stop and create a superseding record
      under a new identifier.
    - >-
      IF THE ROUND RETURNED INCONCLUSIVE, OR A PRODUCER STOPPED, SAY SO PLAINLY.
      An inconclusive round is a result and is never rewritten into a cleaner
      history.
    - >-
      Never select a provider, backend, endpoint, or model identifier containing
      Bedrock, case-insensitively.
  deliverables:
    - ledger_commit_receipt.json
    - ledger/evidence/EV-SSI-2aaf6f.yaml
    - ledger/decisions/DEC-20260905-5f5592.yaml
    - ledger/goals/GOAL-SSI-001/checkpoints/BATCH-752ef2.yaml
    - The single next_action update on ledger/goals/GOAL-SSI-001/goal.yaml
  expected_commit_path_set:
    rule: >-
      tools/research_dispatch.py computes the expected set as this archive task's
      own `artifact_paths` UNION every source task's `artifact_paths`, requires
      the commit to change EXACTLY that set with no duplicates, and requires
      `path_sha256` to cover the whole union on a completed archive. SIX PATHS -
      five declared here plus the review report, which is the source artifact.
      BATCH-dc1424's equivalent gate said "exactly the five declared paths" and
      the dispatcher rejected the archive until the review reports were in the
      same commit; do not repeat that.
    enumerated:
      - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/archives/TASK-20260905-5090ae/ledger_commit_receipt.json
      - ledger/evidence/EV-SSI-2aaf6f.yaml
      - ledger/decisions/DEC-20260905-5f5592.yaml
      - ledger/goals/GOAL-SSI-001/checkpoints/BATCH-752ef2.yaml
      - ledger/goals/GOAL-SSI-001/goal.yaml
      - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/reviews/TASK-20260905-4098fd/validation_report.yaml
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/archives/TASK-20260905-5090ae/ledger_commit_receipt.json
    - ledger/evidence/EV-SSI-2aaf6f.yaml
    - ledger/decisions/DEC-20260905-5f5592.yaml
    - ledger/goals/GOAL-SSI-001/checkpoints/BATCH-752ef2.yaml
    - ledger/goals/GOAL-SSI-001/goal.yaml
  read_scope:
    - AGENTS.md
    - CLAUDE.md
    - agents/coordinator.md
    - templates/research-records.md
    - docs/claims-and-verification.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2
    - ledger/goals/GOAL-SSI-001
    - ledger/decisions/DEC-20260904-4c81b6.yaml
    - ledger/decisions/DEC-20260904-166ab5.yaml
    - ledger/evidence/EV-SSI-7a3e91.yaml
    - ledger/corrections/CORR-20260905-547849.yaml
    - experiments/EXP-WESOVOW-001/specification.yaml
  write_scope:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/archives/TASK-20260905-5090ae
    - ledger/evidence/EV-SSI-2aaf6f.yaml
    - ledger/decisions/DEC-20260905-5f5592.yaml
    - ledger/goals/GOAL-SSI-001/checkpoints/BATCH-752ef2.yaml
    - ledger/goals/GOAL-SSI-001/goal.yaml
  archived_by: TASK-20260905-5090ae
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - The commit changes EXACTLY the six paths enumerated in expected_commit_path_set - this task's artifact_paths UNION the review task's artifact_paths - preserves their recorded hashes, and path_sha256 covers all six.
    - The ledger identifiers were minted with tools/allocate_id.py --next, checked with --check, substituted at every declared site, and the allocation is recorded in the receipt.
    - Every joint in the review plan has a composed verdict, or is recorded as UNCOVERED.
    - The coordinator prior is compared against the outcome element by element across all seven numbered commitments, and the single-reviewer and correlated-review limitations are recorded.
    - The independence checker, its blind-history mode, and the ledger validator were each run and their verbatim results recorded, or each is recorded as OUTSTANDING with the reason and with blindness stated as hand-verified and weaker.
    - The evidence record carries claim_tier, proof_status, proof_refs and certificate.kind none, states its tested scope including the retrieved document's version, and cites only runs actually read.
    - The decision fills knowledge_promotion, records procedure_deviations, approves no amendment, and makes no hypothesis, experiment, or goal status transition.
    - inputs/P13-WESOLOWSKI-2026/source_record.yaml is unmodified and the attachment is named as a successor action.
    - The citation prohibition and its predicate extension are either retained verbatim or lifted with an explicit scope, by this decision and nothing else.
    - Every undispatched carried_forward item of batch.yaml appears in next_actions with its origin, and what CF-1 and CF-11 discharged and did not discharge is stated.
    - The goal checkpoint shard is written, GOAL-SSI-001 stays active, and exactly one next_action remains on the head.
    - The commit message states no protected value and no composed verdict token.
    - The branch is pushed and the PR against main names the new records.
  return_format: >-
    A short report naming the composed per-joint verdicts, the decision and its
    scope, the prior-versus-outcome result element by element, the gates run and
    the gates outstanding, the carried-forward list, the single next action, and
    every limitation.

citation_prohibition_verbatim: >-
  The `P=512` crossover value and its `w=2^80` sign are **NOT
  citation-eligible**. This task does not lift that prohibition. Only a
  committed Coordinator decision on independently reviewed evidence can lift it.

citation_prohibition_predicate_extension_verbatim: >-
  In addition to the retained sentence, a row of any EXP-WESOVOW-001
  reconciliation is NOT citation-eligible when either (a) the two anchors
  disagree in the SIGN of the baseline comparison at that row, or (b) the
  smaller |margin| across the two anchors at that row is below that field size's
  anchor gap |Delta log2 T_full + Delta log2 M / 2|.
