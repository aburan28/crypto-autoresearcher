    - Each of J1, J2, J3 and J4 carries its own verdict and its own recorded attack, and none is answered only by restating a producer.
    - The phase_a block is present, carries its own recorded hash, and is stated to have been written before inputs/P13-WESOLOWSKI-2026/paper_fulltext.md and TASK-20260905-a210bd's directory were opened; or the retrieval failed and the blind half of J4 is recorded as UNPERFORMED with its endpoints and errors.
