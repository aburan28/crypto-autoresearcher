handoff:
  id: TASK-20260905-4098fd
  from: coordinator
  to: validator
  objective: >-
    Independently decide, on joints J1, J2, J3 and J4 of
    coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/review_plan.yaml:
    whether the contract defect at
    experiments/EXP-WESOVOW-001/specification.yaml:39-40 reproduces from the
    frozen file alone and whether its scope assumption survives audit; whether the
    drafted amendment addresses the category question in the narrow form this
    program adopted rather than the broader form it recorded as superseded;
    whether the amendment's licensing statement covers what it must and
    forecloses nothing it should not, and whether it quietly repairs anything it
    does not name; and, by retrieving a published copy of the source paper
    YOURSELF before reading anything of the producer's, whether this program's
    frozen transcript is faithful to the published article for the ten values
    every anchor comparison in this campaign rests on.
  uncertainty_reduced: >-
    Whether the campaign's oldest adverse finding is real as recorded or is a
    misread that three batches have cited, and whether the frozen transcript
    everything here depends on has ever been checked against anything outside
    this repository.
  phase_order:
    binding: true
    phase_a_blind: >-
      FIRST, AND BEFORE ANYTHING OF THE PRODUCER'S. Retrieve a published copy of
      the paper yourself, by your own search and your own URL. Record the URL, the
      exact retrieval command, HTTP status, content type, byte length, a sha256 of
      the retrieved bytes, and the document's own version and date strings.
      Locate the section stating the attack's (time, memory) cost pairs.
      Transcribe the ten values for log2 p in {256, 384, 512, 576, 768} with a
      locator each, and judge per value whether the published copy states it in a
      form directly comparable to the units at
      experiments/EXP-WESOVOW-001/specification.yaml model_definition. Write that
      block into your report and record a sha256 of its serialized text. THEN
      STOP. You may work J1, J2 and J3 before, during, or after Phase A - they do
      not touch the ten values - but you may not open either Phase B path until
      Phase A is written and hashed.
    phase_b: >-
      Only then open inputs/P13-WESOLOWSKI-2026/paper_fulltext.md and
      coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-a210bd/.
      Do three things and report them separately: compare your ten against the
      frozen transcript at lines 234-238; compare your ten against the producer's
      ten; and audit the producer's PROCEDURE - does its URL resolve, does its
      checksum reproduce from the bytes it claims, does its recorded command
      produce what it says, and did it retrieve the same version you did.
    if_your_retrieval_fails: >-
      The blind half of J4 is UNPERFORMED and is recorded as unperformed, with the
      endpoints attempted, the exact errors, and the proxy status output. DO NOT
      substitute recomputation from the producer's artifacts: that is precisely
      the substitution a blind re-derivation exists to prevent, and it would
      reproduce a wrong-but-self-consistent retrieval faithfully. It is not
      negative evidence about anything. The Phase B audit of the producer's
      procedure proceeds regardless.
  inputs:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/review_plan.yaml - joints J1-J4, the proves-too-much control and the blind re-derivation are all yours
    - The snapshot-bound package under BATCH-752ef2/tasks/TASK-20260905-28c89d/ and the receipt at archives/TASK-20260905-6fcd2c/snapshot_commit_receipt.json
    - experiments/EXP-WESOVOW-001/specification.yaml, which you read yourself at the recorded line ranges and well beyond them
    - ledger/decisions/DEC-20260904-4c81b6.yaml (rationale items 5-6, PD-8, next_actions[0]) and ledger/decisions/DEC-20260904-166ab5.yaml
    - The public internet, through the configured agent proxy, for your own Phase A retrieval
    - inputs/P13-WESOLOWSKI-2026/paper_fulltext.md and BATCH-752ef2/tasks/TASK-20260905-a210bd/ - PHASE B ONLY
  constraints:
    - >-
      INDEPENDENT SESSION. You are the only reviewer of this round, which is
      recorded as a cost in batch.yaml
      review_routing_determination.why_one_reviewer_and_not_two, not as a design
      virtue. You still report on YOUR joints and you do not return a whole-claim
      verdict; the Coordinator composes. Copy the four joint names VERBATIM into
      joints_owned in your attestation.
    - >-
      DO NOT READ, LIST, OR GLOB ANY PATH IN THE PLAN'S blind_rederivation.blind_from,
      AT ANY POINT, IN ANY PHASE: experiments/EXP-WESOVOW-001/cost_model.py; both
      directories under experiments/EXP-WESOVOW-001/runs/;
      ledger/evidence/EV-SSI-5d954c.yaml;
      coordination/goals/GOAL-SSI-001/batches/BATCH-256a94;
      coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403;
      and coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/reviews. Every one
      carries the ten values or lets them be reconstructed by arithmetic, and NONE
      is needed for any joint you own. This list is fully mechanical:
      tools/check_review_independence.py compares it against your own
      sources_read, so list every path you read honestly and completely and set
      `blind_from_respected: true` only if it is true.
    - >-
      DO NOT RUN `git log`, `git show`, `git blame` OR ANY COMMAND THAT PRINTS A
      COMMIT MESSAGE before your Phase A block is written and hashed, and do not
      read files under .git/. `blind_from` is a list of FILES and a commit message
      is not a file; that is exactly how a protected verdict reached a blind agent
      on 2026-09-05 (CORR-20260905-547849). The tree you were given has been
      checked against this batch's declared protected digests and the result is in
      the snapshot receipt - read that result, not the history.
    - >-
      A MODEL RECOLLECTION IS NOT A RETRIEVAL. Values you did not read out of a
      document you fetched in this task may not appear in your Phase A
      transcription or your comparison. A remembered figure is a `recalled`
      pointer under AGENTS.md rule 9 and is never support.
    - >-
      RUN THE PRODUCER'S OWN CONTROL CODE AGAINST INPUTS YOU CONSTRUCT. Import
      BATCH-752ef2/tasks/TASK-20260905-28c89d/amendment_controls.py as a module
      into your own scratch script and call AC-1 through AC-4 directly. Do not
      accept a prose claim that a failure branch is reachable. In particular,
      construct the positive-control inputs for AC-3 and AC-4 yourself - a scratch
      copy of the draft with the offending sentence inserted - and confirm the
      scans fire on them. Write only into your own review directory and into a
      scratchpad outside the repository.
    - >-
      RUN THE PROVES-TOO-MUCH CONTROL on all five declared objects of the plan,
      including the positive control, and report what each procedure ACTUALLY DID
      on each, not what it should have done. A pass where the conclusion is known
      false is a BREAK and is reported as one, not as robustness. A procedure that
      rejects every object has rejected the decoys for no reason.
    - >-
      READ specification.yaml YOURSELF, THE WHOLE FILE, not only the two blocks
      the producer cites. J1's load-bearing question is a SCOPE question - whether
      the metrics line and control C4 are in the same scope at all - and it cannot
      be answered from two quoted excerpts.
    - >-
      YOUR REPORT IS A .yaml FILE WITH A TOP-LEVEL `review_attestation` MAPPING
      carrying task_id, joints_owned, sources_read, read_sibling_reports,
      blind_from_respected and verdict. It must be valid YAML that
      yaml.safe_load parses as a whole. It must be the ONLY file in this batch
      directory carrying a `review_attestation` key.
    - >-
      DO NOT RESTATE ANY OF THE TEN VALUES IN A CONTROL-PLANE FILE OR IN A
      MESSAGE. Your report is a review artifact and may carry them where the joint
      requires it; nothing else may.
    - >-
      READ-ONLY on experiments/ and inputs/. Verify and state that no file under
      either was modified by this batch. DO NOT EXECUTE cost_model.py - it is in
      your blind_from and you may not even read it.
    - >-
      `maximum_runs` BOUNDS EXECUTIONS OF EXPERIMENT CODE, PRODUCER
      IMPLEMENTATIONS, AND ANYTHING THAT WRITES A RUN RECORD. Your own throwaway
      arithmetic, scratch scripts and network retrievals are NOT runs
      (DEC-20260904-166ab5 PD-4). This batch authorizes zero new experiment runs.
    - >-
      NETWORK RULES. Outbound HTTPS goes through a pre-configured agent proxy.
      Never disable TLS verification, never unset HTTPS_PROXY, and transmit no
      repository content to any service. A retrieval failure is infrastructure
      signal and never mathematical evidence. Never select a provider, backend,
      endpoint, or model identifier containing Bedrock, case-insensitively.
    - >-
      RECORD AT LEAST ONE CONCRETE OBJECTION PER OWNED JOINT, or state for that
      joint that you searched for one and found none, and exactly how you
      searched. A joint answered by restating the producer is an uncovered joint.
    - >-
      A `not_reproduced` DEFECT VERDICT AND A `not_retrievable` PROVENANCE
      OUTCOME ARE RESULTS, NOT INCOMPLETE TASKS. Review them as results: the
      question is whether the conclusion is honestly grounded in what the file and
      the network actually gave, not whether the producer should have tried
      harder.
    - >-
      IF ANY VALUE DISAGREES - yours against the frozen transcript, or yours
      against the producer's - RECORD IT PRECISELY AND STOP INVESTIGATING IT. That
      finding contradicts a committed evidence record of this program and requires
      a review tier this environment cannot serve; the round halts on it and the
      Coordinator decides. Do not explain it, do not adjudicate it, and do not
      soften it.
    - >-
      Do not repair, complete, or rewrite any producer artifact. Do not change any
      status, write any ledger record, approve any amendment, or commit anything.
      You may RECOMMEND on the citation prohibition; a recommendation is not a
      decision.
    - >-
      RESTATE THE CITATION PROHIBITION AND ITS PREDICATE EXTENSION VERBATIM, do
      not lift either, and state whether either fired on this package. The RC-6
      package is the one place in this batch where the predicate could plausibly
      fire; check specifically that no crossover value, baseline comparison,
      margin or sign is derived, recomputed, tabulated or cited anywhere in it.
    - >-
      Make no security, SQIsign, CSIDH, standardized-parameter, exponent, or
      asymptotic-complexity claim in either direction, and construct no attack.
  deliverables:
    - >-
      validation_report.yaml: a parseable YAML document carrying a `phase_a`
      block written and hashed before either Phase B path was opened (your
