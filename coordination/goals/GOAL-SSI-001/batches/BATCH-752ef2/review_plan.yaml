# THE REVIEW PLAN FOR BATCH-752ef2, WRITTEN BEFORE ANY TASK OF THE BATCH RUNS.
#
# It is a STANDALONE FILE whose top-level key is `review_plan`, which is the
# CF-11 fix: PD-2 of DEC-20260904-4c81b6 recorded the independence gate as
# OUTSTANDING for BATCH-dc1424 because no plan file existed in a form
# tools/check_review_independence.py resolves. This file is the ONLY file in
# this batch directory carrying a `review_plan` block, so
#   python3 tools/check_review_independence.py --batch \
#       coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2
# resolves exactly one plan, and --plan names this file directly.
#
# THIS FILE IS NOT IN TASK-20260905-a210bd's READ SCOPE. It states decoy
# CONSTRUCTIONS and assignments; it states no property of the protected values,
# and it does not state the composed RC-1 verdict of BATCH-dc1424. That is PD-6
# of DEC-20260904-4c81b6 applied to a plan: last round the plan's own
# proves_too_much text disclosed a structural property of the protected values
# to the agent that had to read the plan to know its assignment.
review_plan:
  batch_id: BATCH-752ef2
  goal_id: GOAL-SSI-001
  written_at: '2026-09-05'
  written_by: coordinator
  round_opened_by_handoff: TASK-20260905-28c89d

  claim_under_review: >-
    The two packages produced by TASK-20260905-28c89d and TASK-20260905-a210bd,
    as those tasks state them in their own artifacts. (A) The RC-6 package: that
    experiments/EXP-WESOVOW-001/specification.yaml:39-40 carries a defect the
    package reproduces from the frozen file alone; that the drafted superseding
    protocol amendment repairs exactly that defect and no more; that the
    amendment addresses the category question in the narrow form
    DEC-20260904-4c81b6 adopted rather than the broader framing that decision
    records as superseded; and that it states what the anchor's reachability
    status licenses and forecloses. (B) The OBJ-4 package: that an external,
    published copy of the paper was actually retrieved by the recorded method
    from the recorded URL with the recorded checksum, and that the ten numbers
    this program's frozen transcript prints at
    inputs/P13-WESOLOWSKI-2026/paper_fulltext.md:234-238 do or do not appear in
    it in a directly comparable form, value by value.

  coordinator_prior: >-
    RECORDED BEFORE ANY TASK OF THIS BATCH RUNS, by a Coordinator that has NOT
    read inputs/P13-WESOLOWSKI-2026/paper_fulltext.md:234-238, has NOT read
    Section 4.1 of that document, and has NOT read
    experiments/EXP-WESOVOW-001/cost_model.py lines 56-70. This prior therefore
    contains no protected value and could not; it rests on the committed
    decisions DEC-20260904-166ab5 and DEC-20260904-4c81b6, on the BATCH-dc1424
    checkpoint, and on the structure of the problem.
    (1) DEFECT REPRODUCTION. I expect the RC-6 producer to reproduce the internal
    unsatisfiability of specification.yaml:39-40 against control C4 of the same
    file, and to find it holds for every log2 M > 0 with the single degenerate
    witness log2 M = 0 - i.e. exactly what BATCH-256a94's blind re-derivation
    recorded. I hold that at roughly 0.7. The most informative alternative, which
    I explicitly want checked rather than assumed away, is that the two blocks are
    NOT in the same scope - a scenario-scoped override, a superseded metrics line,
    or a units mismatch between the two - in which case the correct deliverable is
    a recorded finding plus a CLARIFICATION, not a supersession, and three batches
    of this campaign have been reasoning from a misread. I hold that at roughly
    0.2, and the remaining 0.1 to some third reading nobody has proposed.
    (2) THE CATEGORY QUESTION IS WHERE I EXPECT THE DRAFT TO FAIL. I expect the
    amendment to land on the serialization defect - that the emitted per-field
    comparison value escapes carrying neither its relation nor its unit - and to
    preserve control C1's two-sided test as CORRECT for C1's own declared
    instrument-sanity purpose. I ALSO predict, at roughly 0.5, that at least one
    sentence of the draft drifts back to the broader framing that
    DEC-20260904-4c81b6 PD-8 records as superseded, namely that applying a
    two-sided test to one-sided figures is ITSELF the defect. That framing is
    rhetorically easier and is what this program's own commit messages carried.
    Control AC-4 exists because I expect that drift; a J2 that finds no such
    sentence would overturn this element.
    (3) LICENSING IS WHERE I EXPECT THE DRAFT TO BE THINNEST. I expect a
    competent statement of what the anchor licenses at the field sizes where RC-2
    found it unreachable, and a weak or absent statement of what it licenses at
    the two where RC-2 found it reachable - because the unreachable case has an
    obvious reading and the reachable case does not. I predict the draft
    under-answers the reachable case, at roughly 0.6.
    (4) OBJ-4 RETRIEVAL. I expect retrieval to SUCCEED at roughly 0.6; the source
    record already carries a corroborating external arXiv identifier for a
    different reference, so this environment has reached that ecosystem before.
    I give roughly 0.25 to NOT RETRIEVABLE - a proxy failure, a paywall, or no
    published version existing under the recorded title - and roughly 0.15 to
    RETRIEVED BUT NOT DIRECTLY COMPARABLE, i.e. the frozen text is a lossy
    derivative in which at least one of the ten cannot be located in the published
    copy in the same form. Conditional on retrieval succeeding and the values
    being locatable, I expect AGREEMENT at high confidence.
    (5) A DIGIT-LEVEL DISAGREEMENT WOULD OVERTURN THE MOST AND I HAVE PRE-COMMITTED
    TO NOT COMPOSING IT HERE. It would contradict EV-SSI-7a3e91, a committed
    evidence record at strength `replicated`. Under AGENTS.md rule 12 that object
    needs review-breakthrough at `max`, which this environment cannot serve, so
    the round halts on it rather than resolving it at this tier. I am recording in
    advance that I expect to be tempted to resolve it anyway, because the finding
    would be exciting and the machinery is right here.
    (6) THE INDEPENDENCE GATES. I expect
    `tools/check_review_independence.py --batch` to PASS this round, where it
    could not run at all last round. I expect the `--blind-history` check to FAIL
    at least once on the working branch before the blind tasks are dispatched,
    because this campaign has already put a protected token into a commit message
    once (CORR-20260905-547849) and the reverting commit quoted the subject
    verbatim. If it passes on the first ref tried, that is mildly surprising and
    worth recording as such.
    (7) THE REVIEWER'S OWN RETRIEVAL IS THE WEAKEST PART OF THIS ROUND. J4's
    blind half depends on network access this program has not demonstrated. If the
    reviewer cannot retrieve an external copy, the blind half of J4 is UNPERFORMED
    and must be recorded that way - never as agreement, and never as a review of
    the producer's numbers by arithmetic on the producer's own artifacts, which is
    exactly the substitution a blind re-derivation exists to prevent.
    WHAT WOULD MOST INFORM THIS PROGRAM is any of: a demonstration that the
    contract defect is a misread; a sentence-level demonstration that the draft
    reverted to the superseded framing; a located, quoted external disagreement on
    any of the ten numbers; or a demonstration that no published copy exists to
    compare against, with the search recorded well enough that the next agent does
    not repeat it.

  joints:
    - joint: J1 independent reproduction of the contract defect, from the frozen file alone
      assigned_to: TASK-20260905-4098fd
      attack_plan: >-
        DO NOT ACCEPT THE PRODUCER'S REPRODUCTION. Open
        experiments/EXP-WESOVOW-001/specification.yaml yourself, read lines 39-40
        and the whole of control C4 with their surrounding blocks, and re-derive
        the satisfiability question from the file's own text: write out the
        charging law each block implies, in symbols, and solve for the set of
        (log2 T, log2 M) that satisfies both. Then attack the SCOPE assumption,
        which is the load-bearing one and which nobody has checked: establish from
        the file itself that the metrics line and control C4 are in the same
        scope - not one scenario-scoped and the other global, not one superseded
        by a later block, not two different quantities that happen to share a
        name. Enumerate every block of that file that could override, restrict, or
        redefine either, and say which you checked. Then run the degenerate
        witness: confirm the pair IS satisfiable at log2 M = 0 and that the
        producer's argument says so rather than claiming a contradiction
        unconditionally. WHERE I THINK THIS BREAKS: the scope assumption. Three
        batches of this campaign have cited "internally unsatisfiable" from one
        blind re-derivation that nobody has repeated, and if the two blocks are
        not in the same scope the whole amendment is answering a question that
        does not exist.
      breaking_artifact: >-
        A block of specification.yaml that scopes, overrides, or supersedes either
        of the two, quoted with its line range; a derivation showing the two are
        jointly satisfiable on a set larger than {log2 M = 0}; a demonstration
        that the producer's algebra does not follow from the file's own text; or a
        producer argument that claims contradiction at log2 M = 0 as well.
    - joint: J2 the category question, and whether the draft reverts to the superseded broader framing
      assigned_to: TASK-20260905-4098fd
      attack_plan: >-
        Read ledger/decisions/DEC-20260904-4c81b6.yaml rationale item 6 and PD-8,
        which record the narrow form this program adopted and the broader form it
        recorded as superseded. Then read every sentence of
        protocol_amendment_draft.yaml and category_and_licensing_analysis.yaml
        AGAINST THAT DISTINCTION, and quote any sentence that asserts, implies, or
        can be quoted as asserting that a two-sided tolerance test applied to
        one-sided figures is itself the defect. Check the converse too: that the
        draft AFFIRMS the two-sided test as correct for control C1's own declared
        instrument-sanity purpose and does not weaken C1 by side effect. Then
        check the positive content: that the defect the amendment actually names
        is the SERIALIZATION - a per-field comparison value emitted carrying
        neither its relation nor its unit into records whose readers cannot
        re-derive either - and that the amendment's proposed repair is scoped to
        that and does not silently also change what C1 tests. Finally run the
        producer's own AC-3 and AC-4 controls yourself: import its control script
        into your own scratch script, feed each control the scratch copy that
        SHOULD make it fire, and confirm the branch is actually taken. A prose
        claim that a control can fail is not evidence that it can. WHERE I THINK
        THIS BREAKS: one sentence of framing drift in a document that is otherwise
        correct, and a control whose positive branch was described rather than
        run.
      breaking_artifact: >-
        A quoted sentence of the draft asserting the superseded broader framing;
        a draft that weakens or redefines control C1 while claiming to leave it
        alone; an amendment whose repair changes more than the serialization
        defect it names; or AC-3 or AC-4 failing to fire on an input constructed
        to make it fire.
    - joint: J3 what the amendment licenses, forecloses, and quietly repairs
      assigned_to: TASK-20260905-4098fd
      attack_plan: >-
        Attack the interpretation rather than the algebra. First, the anchor:
        check that the draft states what the anchor's recorded reachability status
        licenses at BOTH kinds of field size - the ones where RC-2 found it
        unreachable AND the two where it found it reachable - and that it does not
        treat an unreachable anchor as a claim that any published figure is wrong.
        Enumerate what else could produce that status besides a wrong figure - a
        grid that does not contain the source's parameter, a different auxiliary
        function, a different unit of cost - and check whether the draft's
        language admits those or forecloses them. Second, the quiet repairs: list
        every change the amendment makes BEYOND the defect it names, including
        anything it says about the RAW_PATH output-path hazard, and check each is
        separately justified rather than carried along. Third, the over-reading
        audit: enumerate every sentence of the package that could be quoted as
        support for a claim about the source's correctness, about SQIsign or
        CSIDH, about a standardized parameter set, about an exponent, or about the
        status of GOAL-SSI-001 or EXP-WESOVOW-001, and show the shortest path by
        which a later reader over-reads it. Fourth, apply the citation prohibition
        and its predicate extension to the package yourself: the RC-6 task is the
        one place in this batch where the predicate could plausibly fire, because
        specification.yaml:39-40 is itself a crossover line. Check that the
        package quotes the contract's text without deriving, recomputing,
        tabulating or citing a crossover value or a baseline sign. WHERE I THINK
        THIS BREAKS: a draft that reads as "the contract was wrong, here is the
        right crossover", which would both over-read and breach the prohibition in
        one sentence.
      breaking_artifact: >-
        A derived, recomputed or tabulated crossover value or baseline sign
        anywhere in the package; a sentence treating an unreachable anchor as a
        claim about a published result; a change made by the amendment that it
        does not name and justify; or a named sentence with a worked over-reading
        path.
    - joint: J4 external provenance of the frozen transcript, with an independent retrieval
      assigned_to: TASK-20260905-4098fd
      attack_plan: >-
        THIS JOINT IS NOT AN AUDIT FIRST; IT IS A SECOND INDEPENDENT INSTANCE OF
        THE SAME MEASUREMENT, AND ITS VALUE IS ENTIRELY IN THE ORDER YOU DO IT IN.
        PHASE A, BLIND: retrieve a published copy of the paper YOURSELF, by your
        own search and your own URL, without reading
        TASK-20260905-a210bd's task directory, without reading
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, and without reading any path
        in this plan's blind_rederivation.blind_from. Record the URL, the exact
        retrieval command, the byte length and a sha256 of the retrieved bytes,
        and the section you located. Transcribe from it the ten values the
        quantity statement below defines, with a locator for each, and record your
        own judgement per value of whether the published copy states it in a
        directly comparable form. Write that block and stop. PHASE B: only then
        open TASK-20260905-a210bd's artifacts and
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, and do three things -
        compare your ten against the frozen transcript's ten, compare your ten
        against the producer's ten, and audit the producer's PROCEDURE: is its URL
        resolvable, is its checksum reproducible from the bytes it says it
        fetched, does its recorded retrieval command actually produce what it
        says, and did it retrieve the same version you did. A version mismatch
        between two retrieved copies is itself a finding. WHERE I THINK THIS
        BREAKS: the producer reports agreement having retrieved a landing page, an
        abstract, a different version, or a secondary summary rather than the
        article - which is invisible unless someone fetches independently and
        compares checksums and versions.
      breaking_artifact: >-
        A producer URL that does not resolve or resolves to something other than
        the article; a checksum that does not reproduce; a version, date or
        section numbering mismatch between two independently retrieved copies; a
        value where your Phase A transcription disagrees with the producer's or
        with the frozen transcript; or a producer conclusion of agreement reached
        without a recorded retrieval.

  blindness:
    mutual: true
    lifted_for: []
    rationale: null
    note: >-
      This round has ONE reviewer, so mutual blindness between reviewers is
      vacuous and is NOT claimed as a property of this round. It is set true
      because no reviewer of this round may read another's report if one is ever
      added by amendment. The blindness that IS claimed and is load-bearing here
      is different and is stated in blind_rederivation below: the reviewer's Phase
      A retrieval and extraction happen before it opens the producer's artifacts
      or this program's frozen transcript. The reason this round has one reviewer,
      and its epistemic cost, are recorded in batch.yaml
      review_routing_determination.why_one_reviewer_and_not_two.

  proves_too_much:
    objects:
      - >-
        SATISFIABLE CONTROL CONTRACT. A synthetic pair of blocks in the shape of
        a metrics line and a control, constructed so that a single charging law
        satisfies both on an open set. "This contract is internally
        unsatisfiable" is KNOWN FALSE for it. An argument that returns
        unsatisfiable here proves too much and its verdict on the real contract
        carries no information.
      - >-
        DEGENERATE WITNESS. The real pair of blocks evaluated at the one point
        where the reproduction itself concedes they are jointly satisfiable.
        "There is no satisfying assignment" is KNOWN FALSE at that point. An
        argument that reports a contradiction there is not reading its own
        derivation.
      - >-
        DECOY EXTERNAL SOURCE, for J4. A retrieved document that is NOT the
        article: an abstract or landing page, a different paper by the same
        author, or a differently-dated version, offered to the provenance
        procedure as "the published copy". "This is the published article the
        frozen transcript was taken from" is KNOWN FALSE for each. A procedure
        that reports a successful comparison against any of them has proved too
        much, and this is the exact failure mode a checksum and a version field
        exist to catch.
      - >-
        UNIT DECOY, for J4. The ten values with the five of one kind transformed
        by a constant additive offset corresponding to a different declared unit -
        the transformation OBJ-1 of DEC-20260904-4c81b6 identifies as producing a
        clean, symptomless error. "These agree with the frozen transcript in the
        same unit" is KNOWN FALSE. A comparison procedure that reports agreement
        is comparing magnitudes without checking units, which is the defect that
        would make every anchor comparison in this campaign meaningless.
      - >-
        POSITIVE CONTROL, which is not optional. The real contract for the first
        two objects, and the frozen transcript compared against itself for the
        last two. A procedure that rejects EVERY object has rejected the decoys
        for no reason and its rejections carry no information either. Report what
        the procedure did on this object too.
    failure_signature: >-
      On the first object the argument must return SATISFIABLE; on the second it
      must return SATISFIABLE AT THAT POINT and must say so in the same words the
      real derivation uses; on the third it must REJECT the document as not the
      article, naming the field that caught it; on the fourth it must return
      DISAGREE or NOT COMPARABLE and must never return agreement by silently
      absorbing a unit change; on the positive control it must ACCEPT. Report what
      each procedure ACTUALLY DID on each object, not what it should have done. A
      pass where the conclusion is known false is a BREAK and is reported as one,
      not as robustness. If any procedure's pass turns out to be entailed by its
      own construction, say so plainly: that disclosure is worth more than the
      pass (DEC-20260904-166ab5 on RG-4; DEC-20260904-4c81b6 F-3).
    assigned_to: TASK-20260905-4098fd

  blind_rederivation:
    required: true
    quantity: >-
      The ten numbers that the PUBLISHED version of Wesolowski, "The
      supersingular isogeny problem in time and memory p^{1/3+o(1)}" (2026),
      states for the five field sizes log2 p in {256, 384, 512, 576, 768} as the
      (time, memory) cost pair of the attack of its Section 4.1, in the units the
      published article states them in; together with, per value, whether the
      published article states it in a form directly comparable to the units
      declared at experiments/EXP-WESOVOW-001/specification.yaml
      model_definition.unit_of_cost and unit_of_memory, or only in a form
      requiring a derivation the article does not itself perform. The section is
      to be LOCATED IN THE RETRIEVED DOCUMENT BY THE RE-DERIVER, not handed to
      it, and the re-deriver's copy must be one it fetched itself.
    parameters: >-
      The five field sizes log2 p in {256, 384, 512, 576, 768}, declared at
      experiments/EXP-WESOVOW-001/specification.yaml
      scenario_definitions.field_sizes_log2p. The unit definitions are that same
      file's model_definition.unit_of_cost and unit_of_memory. That file contains
      none of the ten values. Comparison tolerance: half a unit in the last
      decimal place the compared values carry, widened to half a unit in the
      published copy's last stated place if it is coarser, with the widening
      recorded per value; a qualitative statement is NOT COMPARABLE, never a
      match.
    blind_from:
      - experiments/EXP-WESOVOW-001/cost_model.py
      - experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-001
      - experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-201692-001
      - ledger/evidence/EV-SSI-5d954c.yaml
      - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94
      - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403
      - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/reviews
    blind_from_rationale: >-
      Every path listed carries the ten values or lets them be reconstructed by
      arithmetic, and NONE of them is needed for any joint of this round. That
      combination is what makes this list MECHANICALLY CHECKABLE rather than
      merely declared: the reviewer must never read any of them at all, at any
      phase, so tools/check_review_independence.py can compare the list against
      the reviewer's own sources_read and get a definite answer. cost_model.py is
      in the list because, unlike in BATCH-dc1424, this round's re-derivation
      compares a retrieved external copy against the FROZEN TRANSCRIPT, and the
      code literals are not needed for that.
    not_mechanically_checkable: >-
      STATED SO IT IS NOT OVERSTATED. Two paths the reviewer MUST read in Phase B
      are deliberately NOT in blind_from, because putting them there would forbid
      the comparison that is the point of the joint:
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md and
      coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-a210bd/.
      The PHASE A / PHASE B ORDERING with respect to those two is therefore
      ATTESTED, NOT TOOL-CHECKED: the reviewer declares in its attestation that
      its Phase A retrieval, extraction and locators were written and hashed
      before either was opened, and no tool can verify that. What IS mechanically
      checked is the blind_from list above, and separately the commit-message
      history of the tree the reviewer is handed
      (blind_phase_hygiene.protected_sha256 in batch.yaml, checked with
      --blind-history). Two of three channels are mechanical; the ordering channel
      is not, exactly as it was not last round.
    if_retrieval_fails: >-
      The blind half of J4 is UNPERFORMED and is recorded as unperformed, with the
      endpoints attempted, the exact errors, and the proxy status output. It is
      NOT to be substituted by recomputing from the producer's artifacts - that is
      the precise substitution a blind re-derivation exists to prevent, and it
      would reproduce a wrong-but-self-consistent retrieval faithfully. It is also
      not negative evidence about anything. The Phase B audit of the producer's
      procedure proceeds regardless and is reported separately.
    assigned_to: TASK-20260905-4098fd

  procedure_deviations: []
  procedure_deviations_note: >-
    Empty at authoring, and required to be filled by the composing ledger-archive
    task with every departure from this plan - acting before a report returns,
    reassigning a joint, dropping a control, dispatching a blind task on an
    unarmed declaration. DEC-20260904-4c81b6 PD-1 through PD-8 are the standing
    example of what belongs here; an undocumented deviation leaves a protocol that
    still reads as rigorous while no longer being it.
