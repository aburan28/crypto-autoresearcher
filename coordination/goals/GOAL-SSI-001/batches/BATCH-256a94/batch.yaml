batch:
  id: BATCH-256a94
  goal_id: GOAL-SSI-001
  question_ids:
    - RQ-SSI-001
  title: >-
    Post-merge reconciliation of the EXP-WESOVOW-001 charging-law repair:
    establish from committed state whether a source fix remains outstanding,
    prove or refute equivalence between the two independently produced
    corrected laws, and reconcile the fitted_opt and PAPER_PAIRS anchors.
  status: ready_for_dispatch
  status_note: >-
    Successor control plane to the terminal BATCH-eb0a7e. This file authorizes
    no execution by itself; dispatch_queue.json is the bounded dispatch
    contract and the Executor is the only ready task at the opening state.
    No hypothesis status, experiment status, or goal status moves in this
    batch.

  opened_under_next_action: >-
    Quoted verbatim from the GOAL-SSI-001 head at authoring time: "Keep
    GOAL-SSI-001 active with no hypothesis or goal-status transition.
    BATCH-eb0a7e is terminal and its neutral arithmetic/review outcome is
    archived by TASK-20260824-52f6d0. The next research action, if selected, is
    a fresh Executor-scoped source-fix batch for the frozen EXP-WESOVOW-001
    charging-law defect and fitted_opt/PAPER_PAIRS anchor reconciliation, with
    a new review plan and an explicit prohibition on citing the P=512 crossover
    or w=2^80 sign until independently reviewed. This is a future coordination
    action, not a claim that the source fix has been made or that any
    completion criterion is met."

  opening_observation:
    summary: >-
      The premise that the charging-law defect is still live in the tree is in
      doubt, and this batch is designed so that establishing the true state is
      its first gate rather than an assumption. Reading the working tree while
      authoring this batch, experiments/EXP-WESOVOW-001/cost_model.py appears to
      carry the RATIO-anchored law, not the count-anchored law that BATCH-eb0a7e
      localized: line 239 serializes "T(w) = T_full * sqrt(M / min(w, M))" and
      lines 273-275 compute log2Tw = log2Tfull + 0.5*max(0, log2M - lw) +
      overhead_bits. A second run directory,
      experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-201692-001/, exists alongside
      the frozen RUN-WESOVOW-001 and serializes the same ratio-anchored law,
      while RUN-WESOVOW-001/raw-result.json:13 still serializes the defective
      "T_full / sqrt(min(w, M))".
    committed_records_that_appear_to_govern_the_repair:
      - DEC-20260809-c1066f
      - DEC-20260809-39eb45
      - EV-SSI-4b17e7
      - EV-SSI-e8cc71
      - TASK-20260809-ef3e58
    leading_hypothesis: >-
      The source repair was made, reviewed, and admitted upstream on 2026-08-09
      under BATCH-2e6130/BATCH-dbfee9, and reached this working branch only in
      the recent merge of origin/main; BATCH-eb0a7e's producer and Validator
      therefore read a pre-merge cost_model.py, which is consistent with their
      quoting the defective law at cost_model.py:236 and :270 where the merged
      file now holds the corrected law at :239 and :273-275.
    epistemic_status: >-
      HYPOTHESIS, NOT A FINDING. These lines were read from the working tree by
      the authoring Coordinator task; that task ran no git command and verified
      no commit, hash, or branch ancestry. Nothing here is evidence, and no
      artifact of this batch may cite this block as support. RG-0 in
      TASK-20260904-1f4e2f exists to establish the state independently and may
      return fix_outstanding or indeterminate, either of which is a legitimate
      result that redirects the batch rather than a failure of it.
    consequence_for_this_batch: >-
      An Executor instructed to "apply the source fix" against an already
      repaired file could regress reviewed work or produce a second, divergent
      law. So the producer's write scope excludes every frozen path, the fix is
      dispatched CONDITIONALLY on RG-0, and a still-needed fix is delivered as a
      PROPOSED patch inside the task directory, never applied. Applying any
      change to the frozen contract or implementation requires a recorded
      protocol amendment and a committed Coordinator decision, neither of which
      is in this batch's authority.

  objective: >-
    From committed inputs only, and without editing any frozen contract,
    implementation, or committed run artifact: (1) establish which charging law
    each governing artifact actually carries and whether a source fix remains
    outstanding; (2) decide whether the corrected law admitted upstream and the
    corrected law independently derived in BATCH-eb0a7e are the same law, by
    algebra and by numerical agreement over the frozen grid; (3) reconcile the
    fitted_opt anchor (RUN-WESOVOW-001 per_field optimal values) against the
    PAPER_PAIRS anchor (cost_model.py:60-65 literals), localizing every
    disagreement to an anchor or to a formula; and (4) determine whether
    anything in the reconciled state bears on the standing P=512 citation
    prohibition, as a recommendation to the Coordinator only.

  claim_ceiling: >-
    Cost-model reconciliation and measurement hygiene. No attack, no
    certificate, no security claim about SQIsign, CSIDH, or any standardized
    parameter set in either direction; no exponent or asymptotic-complexity
    claim; no hypothesis status change; no experiment status change; no
    knowledge promotion; no asymptotic promotion gate engaged; and no
    completion criterion of GOAL-SSI-001 met or approached. This batch measures
    nothing new: it is arithmetic on already-committed literals, code reading,
    and record reading.

  citation_prohibition:
    status: IN FORCE, NOT LIFTED BY THIS BATCH
    verbatim: >-
      The `P=512` crossover value and its `w=2^80` sign are **NOT
      citation-eligible**. This task does not lift that prohibition. Only a
      committed Coordinator decision on independently reviewed evidence can
      lift it.
    extension: >-
      The prohibition covers the P=512 crossover value and the w=2^80 sign
      under BOTH anchors and in BOTH run packages, including any value read from
      RUN-WESOVOW-201692-001 or recomputed in this batch. It covers restatement,
      paraphrase, rounding, sign-only summary, and use as an intermediate step
      in any further claim.
    restatement_requirement: >-
      Every artifact produced by every task in this batch must restate the
      verbatim sentence above and must not lift it. A reviewer may RECOMMEND
      lifting or retaining it; a recommendation is not a decision.
    lift_procedure: >-
      Only a committed coordinator_decision, resting on independently reviewed
      evidence archived under this batch's ledger archive, may lift it. The
      identifier reserved for that decision is DEC-20260904-166ab5; reserving
      an identifier is not a commitment to lift.
    known_basis_for_the_prohibition: >-
      BATCH-eb0a7e recorded opposite corrected speedup signs at P=512,
      log2(w)=80, c=0 under the two anchors, and its independent Validator
      confirmed these are anchor-dependent rather than a rounding artifact
      (validation_report.md, TASK-20260824-5b150a). That is a reason the
      prohibition stands; it is also one of the exact things this batch
      re-examines.

  frozen_artifact_ruling: >-
    experiments/EXP-WESOVOW-001/specification.yaml,
    experiments/EXP-WESOVOW-001/cost_model.py, and every artifact under
    experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-001/ and
    experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-201692-001/ are READ-ONLY for
    every task in this batch. They are not to be edited, moved, regenerated,
    reformatted, rerun, or staged. No task in this batch holds any frozen path
    in its write_scope. The specification is a frozen contract and may be
    changed only by a recorded protocol amendment, never by an edit; a proposed
    source change is delivered as an unapplied patch inside the producer's task
    directory and takes effect only through a later amendment and a committed
    Coordinator decision.

  dispatch_precondition: >-
    BATCH-eb0a7e is terminal: all four of its tasks are completed, its snapshot
    archive TASK-20260824-e8f6b7 and ledger archive TASK-20260824-52f6d0 are
    verified, and its outcome is recorded in EV-SSI-12c22e and
    DEC-20260824-384e78. This batch opens as its successor and reuses none of
    its identifiers. The working branch was merged with origin/main before this
    batch was authored; the merge base and outcome are recorded by the
    orchestrating session, not asserted here.

  max_concurrent: 1
  max_concurrent_note: >-
    Serial by design and sized to the execution environment, not to idle
    capacity. The chain is Executor -> snapshot archive -> two independent
    blinded reviews -> Coordinator ledger archive; archives must run alone in
    any case, and this container is small. Exactly one task is ready at the
    opening state.

  inference_environment:
    resolvable_backends_at_authoring: local only
    basis: >-
      `python3 -m orchestration.adapter doctor` was run by the orchestrating
      session at 15:22Z and reported that only the `local` backend resolves;
      every API backend lacks credentials. Not re-probed by this authoring task.
    consequence: >-
      No task in this batch may require a second model backend or a
      model-independent review; such a task could not be served here and would
      trip a pause condition on dispatch. review-breakthrough is NOT indicated
      and is NOT used: this batch reviews a source-state census and arithmetic
      reconciliation, not a claimed breakthrough, closure, or contradiction
      between validated evidence records.
    declared_limitation: >-
      The two reviews in this batch are SESSION-independent, not
      MODEL-independent. Their concurrence is correlated by construction and
      must be recorded as such in the evidence record; it may not be presented
      as independent corroboration by distinct models.

  producer_task_ids:
    - TASK-20260904-1f4e2f
  review_task_ids:
