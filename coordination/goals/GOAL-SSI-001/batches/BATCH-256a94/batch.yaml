  reserved_unused_note: >-
    Allocated and verified free for this batch but deliberately not used. It is
    not a placeholder for undeclared work; a successor task needs its own card,
    handoff, and queue entry.

  review_plan_location:
    defined_on: TASK-20260904-1f4e2f
    path: >-
      coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f/task_card.yaml
    ledger_copy: ledger/handoffs/TASK-20260904-1f4e2f.yaml
    note: >-
      The review plan is written before any reviewer runs and lives on the
      handoff that opens the round. It is the single review_plan block in this
      batch directory, so `tools/check_review_independence.py --batch` resolves
      it unambiguously.
    joint_owners:
      J1 source-state census: TASK-20260904-e13cf2
      J2 law equivalence: TASK-20260904-e13cf2
      J3 numerical reconciliation: TASK-20260904-e13cf2
      J5 control capability: TASK-20260904-e13cf2
      J4 anchor reconciliation and citation eligibility: TASK-20260904-22e444
      J6 scope and provenance of the fix-status verdict: TASK-20260904-22e444

  budget:
    wall_clock_seconds_total: 15300
    per_task_wall_clock_seconds:
      TASK-20260904-1f4e2f: 5400
      TASK-20260904-47c3ea: 900
      TASK-20260904-e13cf2: 3600
      TASK-20260904-22e444: 3600
      TASK-20260904-63e06e: 1800
    memory_gb_per_task: 2
    maximum_runs_total: 9
    new_experiment_runs_authorized: 0
    new_experiment_runs_note: >-
      This batch authorizes NO execution of any experiment implementation and
      no new run record. The producer's authorized invocations are of its own
      standalone reconciliation script inside its task directory.

  required_artifacts:
    producer:
      - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f/source_state_census.md
      - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f/law_equivalence.md
      - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f/reconcile.py
      - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f/anchor_reconciliation.json
      - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f/anchor_reconciliation.md
      - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f/controls_report.md
      - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f/outstanding_fix.md
