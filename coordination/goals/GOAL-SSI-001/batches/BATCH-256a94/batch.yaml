    decision: DEC-20260904-166ab5
    spare_decision: DEC-20260904-cff4f4
    note: >-
      Reserved and verified free. An identifier is reserved, never assumed
      used: if the review round produces no evidence record worth writing, the
      ledger archive says so and the identifier stays unused rather than being
      filled to look complete.

  opening_decision:
    id: DEC-20260904-cff4f4
    status: NOT YET A LEDGER RECORD
    reason: >-
      The decision to open this batch with a reconciliation-first design,
      rather than the naive source-fix design the recorded next action
      anticipated, is a coordinator_decision and belongs in
      ledger/decisions/DEC-20260904-cff4f4.yaml. The authoring task's declared
      write_scope covers only this batch directory and
      ledger/handoffs/TASK-20260904-*.yaml, so it did not write outside it. The
      decision text is returned by the authoring task and must be persisted by
      the orchestrating session under an explicit scope, or superseded, before
      it is treated as durable. Until then it is unpublished and is not
      evidence for anything.

  stop_conditions:
    - >-
      RG-0 returns indeterminate: the producer stops with a state report and no
      reconciliation table, and the batch returns to the Coordinator for a
      scoped successor. That is a legitimate outcome, not a failure.
    - >-
      Any task that cannot complete within its declared budget stops and
      reports the exhaustion as an operational observation. A timeout, crash,
      missing dependency, or exhausted budget is infrastructure signal and is
      never negative mathematical evidence.
    - >-
      Any attempt to modify a frozen path, or a requirement for a second model
      backend, halts the batch and returns it to the Coordinator.

