task_card:
  id: TASK-20260904-47c3ea
  goal_id: GOAL-SSI-001
  batch_id: BATCH-256a94
  title: >-
    Snapshot archive of the EXP-WESOVOW-001 source-state and anchor
    reconciliation package
  role: coordinator
  state: queued
  review_required: false
  archive_kind: snapshot
  runs_alone: true
  archives:
    - TASK-20260904-1f4e2f

handoff:
  id: TASK-20260904-47c3ea
  from: coordinator
  to: coordinator
  objective: >-
    Run alone and snapshot exactly the seven producer artifacts of
    TASK-20260904-1f4e2f before either independent reviewer reads them, so that
    both reviews attack a bit-identical, immutably bound package.
  uncertainty_reduced: >-
    Whether the producer package is bound to an immutable, exact-path snapshot
    commit before review, so that a later disagreement between reviewer and
    producer can be localized instead of being an argument about what the
    package said.
  inputs:
    - The seven declared producer artifacts under BATCH-256a94/tasks/TASK-20260904-1f4e2f/
    - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/batch.yaml
    - This task card
  constraints:
    - Run alone. No other task may be running while this archive runs.
    - >-
      Stage exactly the seven producer paths plus this receipt, by exact
      pathspec. Never `git add -A`, never stage a directory, never stage a
      frozen path.
    - >-
      Do not edit experiments/EXP-WESOVOW-001/ or any file under it, and do not
      write any ledger or scientific record. This is an archival task, not a
      research one.
    - >-
      Never reconstruct or estimate a commit SHA, parent SHA, or path hash.
      Every value in the receipt comes from Git as it actually is; leave a
      binding null until a real archive commit exists.
    - >-
      Before committing, fetch origin/main and record the base commit checked
      and the merge outcome in the receipt. Merge, never rebase.
    - >-
      Push the branch and open or refresh the PR against main naming the
      records this archive adds, so the package is published rather than local.
    - >-
      No independent reviewer starts until this snapshot receipt is accepted by
      the post-commit verifier.
    - >-
      If the producer stopped at an RG-0 indeterminate verdict, snapshot the
      package as it is. An honest stop is archived exactly like a complete run;
      do not wait for a better package and do not fill a stub.
  deliverables:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/archives/TASK-20260904-47c3ea/snapshot_commit_receipt.json
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/archives/TASK-20260904-47c3ea/snapshot_commit_receipt.json
  read_scope:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f
    - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/batch.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-47c3ea
  write_scope:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/archives/TASK-20260904-47c3ea
  archived_by: TASK-20260904-47c3ea
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - The snapshot commit changes exactly the seven producer paths plus this receipt, and nothing else.
    - No path under experiments/ appears in the commit.
    - The receipt records only commit information and hashes obtained from Git, with the fetched base commit and merge outcome.
    - The branch is pushed and a PR against main names the archived task ID.
    - No ledger or scientific record is written and no status is changed.
