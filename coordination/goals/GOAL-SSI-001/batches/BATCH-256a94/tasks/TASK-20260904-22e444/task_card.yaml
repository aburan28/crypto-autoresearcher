  title: >-
    Independent Red Team review of the anchor reconciliation, the citation
    boundary, and the provenance of the fix-status verdict, with a blind
    re-derivation of the charging law
  role: red-team
  state: queued
  review_required: false
  archived_by: TASK-20260904-63e06e
  reviews: TASK-20260904-1f4e2f
  joints_owned:
    - J4 anchor reconciliation and citation eligibility
