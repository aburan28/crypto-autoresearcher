  completion_gate:
    - The blind re-derivation appears in the report and is stated to have been written before any producer artifact was opened, with its sources named.
    - No blind_from path appears in sources_read, and blind_from_respected is explicitly true.
    - J4 and J6 each carry a verdict, a worked attack, and at least one concrete objection or an explicit statement of how a search for one was conducted and failed.
    - The proves-too-much control is run on all three declared known-false objects and its results are reported, including any pass where the conclusion is false.
    - The recommendation on the P=512 prohibition is explicit and explicitly not a decision.
    - The review_attestation block lists the two joint names verbatim, sets read_sibling_reports to false, and carries a verdict of holds, breaks, or inconclusive.
    - No security, parameter, exponent, or asymptotic claim is made, no attack is constructed, no status is changed, and nothing is committed.
