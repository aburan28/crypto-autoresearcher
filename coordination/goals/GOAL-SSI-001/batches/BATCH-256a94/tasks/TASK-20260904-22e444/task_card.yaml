    - coordination/goals/GOAL-SSI-001/batches/BATCH-eb0a7e/tasks/TASK-20260824-dd5b5c/recomputed_table.json
    - experiments/EXP-WESOVOW-001
    - ledger/evidence/EV-WESO-001.yaml
