    - coordination/goals/GOAL-SSI-001/batches/BATCH-eb0a7e/reviews/TASK-20260824-5b150a/validation_report.md
  read_scope_exclusions_note: >-
    These five paths fall inside directories named in read_scope but are the
    review plan's blind_from set and must not be opened. The exclusion is
    declared here so that the blindness is checkable rather than promised;
    `tools/check_review_independence.py` compares them against the
    `sources_read` list in your attestation.
  write_scope:
