handoff:
  id: TASK-20260904-22e444
  from: coordinator
  to: red-team
  objective: >-
    Attack, on the two joints assigned to you, the conclusions the producer
    package invites rather than the arithmetic it displays: whether the
    fitted_opt and PAPER_PAIRS anchors are comparable quantities at all and
    whether anything in the reconciliation could justify lifting the P=512
    citation prohibition; and whether the fix-status verdict is supported by
    admissible evidence or rests on an unverified worktree read or on the
    Coordinator's own inadmissible opening observation. Run the
    proves-too-much control and the blind re-derivation assigned to you in the
    review plan.
  uncertainty_reduced: >-
    Whether accepting this package would license any statement beyond
    arithmetic on committed literals, and whether the load-bearing charging law
    survives a derivation that never reads the implementations that produced
    it.
  inputs:
    - The review plan on TASK-20260904-1f4e2f, whose joints J4 and J6, proves_too_much control, and blind_rederivation are yours
    - experiments/EXP-WESOVOW-001/specification.yaml, for the blind re-derivation
    - The snapshot-bound producer artifacts you are permitted to read
    - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/archives/TASK-20260904-47c3ea/snapshot_commit_receipt.json
  constraints:
    - >-
      BLIND RE-DERIVATION FIRST. Before reading any producer artifact, derive
      log2 T(w) and the crossover budget log2 w* from the statement of the
      quantity and the frozen specification's C3 and C4 alone, and write that
      derivation into your report. Only then read anything else.
    - >-
      DO NOT READ, at any point, the five blind_from paths named in the review
      plan: the producer's reconcile.py, law_equivalence.md and
      controls_report.md, and BATCH-eb0a7e's corrected_charging.py and
      validation_report.md. Recomputing from the implementation you are meant
      to check reproduces a wrong-but-self-consistent implementation faithfully,
      which is the one failure validation cannot see.
    - >-
      Set `blind_from_respected: true` in your attestation only if it is true,
      and list every path you read in `sources_read`. An honest leak reported
      is recoverable; an unreported one invalidates the round.
    - >-
      Independent session. Do not read the sibling validation report;
      blindness is mutual.
    - >-
      Report on YOUR joints. You own J4 and J6 and cannot see J1, J2, J3 or J5
      by construction, so do not return a whole-claim verdict; the Coordinator
      composes them.
    - >-
      Copy the joint names verbatim into `joints_owned`: "J4 anchor
      reconciliation and citation eligibility", "J6 scope and provenance of
      the fix-status verdict".
    - >-
      Run the proves-too-much control on all three declared known-false
      objects and report what the package's own procedure does on each. A pass
      where the conclusion is known false is a break, not a robustness result.
    - >-
      Do not repair, complete, or rewrite any producer artifact. Do not change
      any status, write any ledger record, or commit anything. READ-ONLY on
      experiments/ and on both run directories.
    - >-
      Treat the batch.yaml opening_observation block as an unverified
      Coordinator hypothesis and as inadmissible support; if the producer
      leaned on it, that is a finding under J6.
    - >-
      Restate the P=512 citation prohibition verbatim and do not lift it. You
      may recommend lifting or retaining with conditions; a recommendation is
      not a decision.
    - >-
      Make no security, standardized-parameter, exponent, or asymptotic claim
      in either direction, and do not construct an attack.
    - >-
      A timeout, crash, or exhausted budget is an operational observation and
      never mathematical evidence.
  deliverables:
    - >-
      red_team_report.md containing the blind re-derivation written before any
      producer artifact was opened, a verdict per owned joint, the
      proves-too-much results on all three known-false objects, at least one
      concrete objection or falsification route per owned joint, an explicit
      recommendation on the P=512 prohibition marked as a recommendation, and a
      `review_attestation` block with `joints_owned` copied verbatim,
      `sources_read`, `read_sibling_reports: false`, `blind_from_respected`,
      and a verdict of holds, breaks, or inconclusive.
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/reviews/TASK-20260904-22e444/red_team_report.md
  read_scope:
    - AGENTS.md
    - agents/red-team.md
    - docs/claims-and-verification.md
    - docs/inventor-protocol.md
    - templates/research-records.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/batch.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks
    - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/archives
    - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/dispatch_queue.json
    - coordination/goals/GOAL-SSI-001/batches/BATCH-eb0a7e/batch.yaml
