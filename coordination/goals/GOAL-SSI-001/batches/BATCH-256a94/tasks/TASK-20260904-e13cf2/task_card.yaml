task_card:
  id: TASK-20260904-e13cf2
  goal_id: GOAL-SSI-001
  batch_id: BATCH-256a94
  title: >-
    Independent Validator review of the source-state census, law equivalence,
    numerical reconciliation, and control capability
  role: validator
  state: queued
  review_required: false
  archived_by: TASK-20260904-63e06e
  reviews: TASK-20260904-1f4e2f
  joints_owned:
    - J1 source-state census
