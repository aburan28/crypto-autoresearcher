handoff:
  id: TASK-20260904-e13cf2
  from: coordinator
  to: validator
  objective: >-
    Independently decide, on the four joints assigned to you in the review plan
    on TASK-20260904-1f4e2f, whether the producer's source-state census is a
    claim about committed state or about an unverified worktree; whether the
    two corrected charging laws are genuinely the same law including at and
    above the memory cap; whether the reconciliation table recomputes from
    committed literals; and whether each of the producer's controls was capable
    of failing.
  uncertainty_reduced: >-
    Whether the producer package is a checkable reconciliation of the
    EXP-WESOVOW-001 charging-law state, or a self-consistent restatement behind
    controls that could not fail.
  inputs:
    - The snapshot-bound producer package under BATCH-256a94/tasks/TASK-20260904-1f4e2f/
    - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/archives/TASK-20260904-47c3ea/snapshot_commit_receipt.json
    - The review plan on TASK-20260904-1f4e2f, whose joints J1, J2, J3 and J5 are yours
    - The frozen experiment, both run packages, and the committed records, which you read independently
  constraints:
    - >-
      Independent session. Do not read the sibling red-team report for this
      round; blindness is mutual and you must attest to what you read.
    - >-
      Report on YOUR joints. You own J1, J2, J3 and J5 and cannot see J4 or J6
      by construction, so do not return a whole-claim verdict; the Coordinator
      composes them.
    - >-
      Copy the joint names verbatim into `joints_owned` in your review
      attestation: "J1 source-state census", "J2 law equivalence", "J3
      numerical reconciliation", "J5 control capability".
    - >-
      Derive the required law from specification.yaml alone and write your
      derivation down BEFORE opening law_equivalence.md; state the source of
      the derivation.
    - >-
      Read the governing artifacts yourself at their own line numbers rather
      than accepting the producer's quotations, and distinguish explicitly
      between what is committed and what is merely in the worktree.
    - >-
      Do not repair, complete, or rewrite any producer artifact. Do not change
      any status, write any ledger record, or commit anything.
    - >-
      READ-ONLY on experiments/EXP-WESOVOW-001/ and both run directories.
      Verify, and state, that no file under experiments/ was modified by this
      batch.
    - >-
      Treat the batch.yaml opening_observation block as an unverified
      Coordinator hypothesis. It is not evidence and may not support any
      verdict of yours.
    - >-
      Treat the result as arithmetic and record reading, not an executed
      attack. Make no security, standardized-parameter, exponent, or
      asymptotic claim in either direction.
    - >-
      Restate the P=512 citation prohibition verbatim and do not lift it. You
      may recommend; only a committed Coordinator decision decides.
    - >-
      Record at least one concrete objection per owned joint, or state
      explicitly for that joint that you searched for one and found none, and
      how you searched.
    - >-
      A timeout, crash, or exhausted budget is an operational observation and
      never mathematical evidence.
  deliverables:
    - >-
      validation_report.md with a per-joint verdict from CONFIRMED, CONFIRMED
      WITH CAVEAT, or REFUTED, a per-deliverable table, an explicit list of
      limitations, and a `review_attestation` block whose `joints_owned` copies
      the four joint names verbatim and whose `verdict` is holds, breaks, or
      inconclusive.
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/reviews/TASK-20260904-e13cf2/validation_report.md
  read_scope:
    - AGENTS.md
    - agents/validator.md
    - docs/claims-and-verification.md
    - docs/task-lifecycle.md
    - templates/research-records.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94
    - coordination/goals/GOAL-SSI-001/batches/BATCH-eb0a7e
    - experiments/EXP-WESOVOW-001
    - ledger/evidence/EV-WESO-001.yaml
    - ledger/evidence/EV-SSI-4b17e7.yaml
    - ledger/evidence/EV-SSI-e8cc71.yaml
    - ledger/evidence/EV-SSI-12c22e.yaml
    - ledger/decisions/DEC-20260809-c1066f.yaml
    - ledger/decisions/DEC-20260809-39eb45.yaml
    - ledger/decisions/DEC-20260824-384e78.yaml
    - ledger/corrections
  write_scope:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/reviews/TASK-20260904-e13cf2
  archived_by: TASK-20260904-63e06e
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 3600
    memory_gb: 2
    maximum_runs: 2
  completion_gate:
    - Each of J1, J2, J3 and J5 carries its own verdict and its own recorded attack, and none is answered only by restating the producer.
    - The law derivation from specification.yaml is recorded and its precedence over reading the producer's conclusion is stated.
    - The census claim is checked against committed state, and any conflation of worktree with committed state is named.
    - A sample of the reconciliation table is independently recomputed from committed literals, with the sampling rule stated and adversarially chosen rows included.
    - Every control carries a capable-of-failing assessment naming the concrete input that would have failed it, including whether RG-4's cap identity is entailed by the law under test.
    - Frozen-artifact immutability is checked and stated.
    - The review_attestation block lists the four joint names verbatim, sets read_sibling_reports to false, and carries a verdict of holds, breaks, or inconclusive.
    - The P=512 prohibition is restated verbatim, any recommendation about it is explicitly not a decision, and no security, parameter, exponent, or asymptotic claim is made.
