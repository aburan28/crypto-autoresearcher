        - experiments/EXP-SSI-e29417/specification.yaml:896-924
        - experiments/EXP-SSI-e29417/specification.yaml:982-1009
        - experiments/EXP-SSI-e29417/specification.yaml:1074-1098
    - metric: target_query_capacity_scale
      status: incomplete
      result: >-
        The target/selection expansion is explicitly |V_p| times D_branch,
        which is a useful correction to a hidden oracle. However H_Q is not
        assigned a wire encoding or maximum, b_selection and b_payload_ptr
        are undefined in the byte equation, and the full-advice product can
        exceed both the older per-prime b_count and the new 560-bit large
        integer envelope. No exact index-header or slot-capacity bytes are
