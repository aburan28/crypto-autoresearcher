  repairs:
    - id: R1
      issue: direct_predecessor_provenance
      repair: >-
        The v7 path, supersedes field, predecessor_contract input, predecessor
        review paths, evidence, decision, and duplication audit all name the
        immutable v6 record EXP-SSI-8fbe66 and BATCH-b47cd5 artifacts.
    - id: R2
      issue: helper_physical_layout
      repair: >-
        C-HELPER-v2 defines H_C, b_slot_C, a complete header, exact occupied and
        empty slot records, pair-key derivation, initial slot, linear probing,
        equality, placement, pointer checks, body bytes, two digest preimages,
        peak memory, and charged operations.
    - id: R3
      issue: order_oracle_and_query_index
      repair: >-
        ORDER-MANIFEST-v2 binds its exact owner set, owner-set digest, generator
        identity, output bytes, and setup cost. The target query index expands
        every target/selection pair with an explicit H_Q, query-key frame,
        lookup/probe/equality/payload rules, and charged build cost, so no hidden
        full-order or target oracle is free.
    - id: R4
      issue: cryptographic_scale_counter_bounds
      repair: >-
        SSI-BYTES-v1.1 large integers have a 70-byte/560-bit allocation bound,
        canonical zero and magnitude rules, explicit overflow, and a declared
        use list covering all builder, permutation, saturation, and cap counters.
    - id: R5
      issue: finite_builder_and_break_even
      repair: >-
        Builder terminal classes distinguish zero request, completed request,
        partial padding, cap exhaustion, zero retention, invalid records,
        overflow, and infrastructure. INCUMBENT-FOE-v1, exact setup/attempt/memory
        sums, finite q_run, and integer cross-multiplied Q_break_even are required
        operands; missing operands emit invalid_accounting rather than rows.
    - id: R6
      issue: certificate_and_hnf_output
      repair: >-
        EDGE-CERT-v1.1 binds horizon, path byte budget, availability/provider
        receipt, local mirror, transition root, and byte digest. HNF pullback,
        factor-by-factor saturation, scalar classification, branch order source,
        and normalized output bytes are explicit and charged.
    - id: R7
      issue: replay_null_pair_and_synthetic_controls
      repair: >-
        Paired attempts consume a full common event stream with only the final
        identity bit masked. Next-distinct and Fisher-Yates bounds are exact;
        C-pair nulls use the same marginal/descriptor/helper algorithm over a
        declared finite null-replicate reference rather than iid; synthetic
        cells bind seeds, target sets, rational references, censoring, and max
        aggregation.
