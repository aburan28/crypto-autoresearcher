schedule_pin:
  task_id: TASK-20260730-021
  schedule_id: CSIDH-CS-6f9188e4-logn2-logl2-logs0-theta3over4
  source:
    repository: https://github.com/cpeikert/CollimationSieve
    commit: 6f9188e4eb5611bcfdf29a3e1ec3cd69a29a50e9
    path: src/Main.hs
    construction: >-
      n = 2^logn; L = 2^logl; S_0 = 2^logs; takeWhile (< n)
      (iterate (\t -> (2*t*L) div 3) S_0) ++ [n].
    invocation_parameters:
      logn: 2
      logl: 2
      logs: 0
      threshold: "3/4"
  n: 4
  L: 4
  interval_list: [1, 2, 4]
  recursion_depth: 2
  alwaysKeep_policy:
    root_call: true
    all_recursive_calls: false
  finite_random_source_model:
    name: typed_choice_tape_v1
    scope: one root invocation with at most one same-level retry at a
      designated internal S=2 call; the S=1 root has alwaysKeep=true and
      therefore has no discard/retry branch. All other internal calls are
      required to keep on their first attempt in the bounded model.
    symbols:
      base_draw:
        domain: [0, 1, 2, 3]
        use: exact outcome of getRandomR (0,n-1) at an S=4 base call
      index_draw:
        domain: [0, 1, 2, 3]
        use: >-
          exact selected index at collimate, constrained to the current vector
          length; each enabled value is enumerated once, so it is uniform on
          the enabled range.
    state: >-
      (call_history, typed tape position, remaining typed symbols). A tape is
      a finite sequence of branch-labeled symbols; invalid index symbols are
      not transitions. This is an explicit finite ideal-choice abstraction,
      not a claim about the concrete HashDRBG.
    concrete_drbg_equivalence_claimed: false
  pin_rationale: >-
    This is the smallest nondegenerate schedule generated by Main.hs with
    n=4, L=4, and S_0=1: its multiplier 2L/3 is 8/3, producing [1,2,4].
    It has two internal levels and therefore exposes recursive child history
    and a same-level retry without executing the simulator.
  pinned_before_analysis: true
