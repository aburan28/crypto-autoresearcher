    - >-
      Static pair-set coverage should not be described as explicit typed-tape
      transition exploration unless the transition machine is emitted.

  cost_model_challenges:
    - >-
      The local keep bound is not a complete end-to-end stopping distribution.
    - >-
      W/R/B/M_tail widths, overlap, and cleanup remain unquantified.
    - >-
      Recovery, verification, residual-tail, and component failure costs remain
