  schedule_pin_assessment:
    schedule_construction_spot_check: confirmed
    arithmetic: >-
      With logn=2, logl=2, logs=0, n=L=4 and S0=1. Iterating
      floor(2*t*L/3) while t<n gives 1,2 and appending n gives [1,2,4].
    source_basis: >-
      This agrees with the source construction already pinned and reviewed in
      BATCH-012 and with the expression reproduced in the committed producer
      report.
    smallest_nondegenerate_rationale: plausible
    pinned_before_analysis_independently_established: false
    post_selection_assessment: >-
      The handoff required one actual small schedule but did not predeclare
      which schedule. schedule_pin.yaml and the analysis results first become
      durable in the same snapshot commit. The producer's
      pinned_before_analysis=true field is therefore a self-attestation, not
      independently checkable preregistration. No evidence shows post-selection,
      but the snapshot cannot exclude it.
    required_revision: >-
      Replace the unqualified historical claim "pinned before analysis" with
      "recorded by the producer as pinned before analysis, not independently
      preregistered," or cite an earlier immutable artifact that fixes the
      schedule before result inspection.

  reachability_assessment:
    independent_spot_check:
      status: arithmetic_recomputed
      schedule: [1, 2, 4]
      S2_pre_collimation_pair_counts_by_requested_length:
        "1": 16
        "2": 32
        "3": 64
        "4": 64
      total_pairs: 176
      minimum_keep_probability_by_requested_length:
        "1": "1"
        "2": "3/4"
        "3": "3/4"
        "4": "3/4"
      representative_positive_keep_state:
        requested_length: 2
        v1: [0, 0, 1, 3]
        v2: [0, 3]
        q_bin_sizes: {"0": 3, "1": 3, "2": 1, "3": 1}
        required_bin_size: 2
        keep_probability: "3/4"
    zero_progress_absent_from_enumerated_pair_set: true
    jointly_reachable_judgment: >-
      false only in the declared finite ideal-choice abstraction. Because the
      enumerated possible S=2 pair set contains no zero-progress member, no
      typed-tape path in that abstraction can jointly reach one. This is a
      schedule-specific finite exclusion, not a concrete-HashDRBG result.
    recurrent_judgment: >-
      false only as a bounded-model class-occupancy statement: the class is
      empty at both declared history markers, so it cannot be revisited through
      the one-retry horizon. It is not a global nonrecurrence theorem. Standard
      recurrence is an unbounded-time property and cannot be established from
      a one-retry truncation.
    analyzer_representation_caveat: >-
      The embedded reproduction program enumerates vector-pair sets and keep
      probabilities. It does not implement a tape-position state machine or
      recursive-history transitions; the reported 352 history-augmented states
      are the 176 static pairs duplicated across two markers. This is enough
      for the empty-class exclusion because every possible pair is positive,
      but it does not substantiate a stronger claim that a transition-level
      typed-tape analyzer was implemented.
    global_C2_rejected: false
    global_stopping_law_established: false
    concrete_HashDRBG_modeled: false

  disposition_assessment:
    claimed: FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED
    supported: true
    query_memory_support: supported
    qualification: >-
      The schedule-specific positive keep bound removes one zero-progress
      witness route only inside one bounded ideal-choice model. It does not
      supply a history-uniform end-to-end stopping law, concrete-DRBG contract,
      global memory map, recovery procedure, or final operational error map.
      QUERY_MEMORY therefore remains unreconciled with QM-STOPPING,
      QM-MEMORY-MAP, and QM-ERROR.

  C2_assessment:
    status: remains_live
    local_update: >-
      No zero-progress class occurs in the enumerated internal S=2 pair set for
      this one schedule, and every checked pair has keep probability at least
      3/4 except requested length 1, where it is 1.
    not_established:
      - a bound for other schedules or parameter sizes
      - a bound over deeper or unbounded retry histories
      - equivalence of typed ideal choices to concrete HashDRBG evolution
      - a complete stopping law including recovery and terminal handling
      - finite joint Q/S/P/C expectations
    broad_C2_rejected: false

  C3_assessment:
    status: lexical_simulator_phasevector_subcase_rejected_only
    judgment: >-
      No recovery implementation, object widths, runtime lifetime trace,
      quantum workspace, QRACM contract, backing-store peak, or terminal-tail
      memory was added. Broad C3 and QM-MEMORY-MAP remain unresolved.
    broad_C3_rejected: false
    QM_MEMORY_MAP_cleared: false

  error_map_assessment:
    status: remains_live
    judgment: >-
      The local symbolic sieve analysis neither implements recovery and
      independent verification nor maps all component failures to final
      key-recovery event F. QM-ERROR remains blocking.

  objections:
    - id: PIN-ORDER-NOT-DURABLE
      severity: revision_required
      title: Pre-analysis pin order is self-attested
      detail: >-
        Schedule pin and results entered durable history together. The snapshot
        verifies content integrity, not temporal ordering before inspection.
      required_control: >-
        Cite an earlier immutable pin or qualify the historical assertion.
    - id: TAPE-HISTORY-IMPLEMENTATION-OVERSTATEMENT
      severity: revision_required
      title: Embedded analyzer has no tape transition state
      detail: >-
        The reproduction code statically enumerates vector pairs. It contains
        neither call_history nor tape_position and does not execute retry
        successors. The 352 count is marker duplication, not independently
        visible transition exploration.
      required_control: >-
        Describe the result as a static exhaustive pair-set exclusion, or emit
        code that explicitly enumerates typed tapes and history transitions.
    - id: RECURRENCE-SCOPE
      severity: blocking_for_global_nonrecurrence
      title: One retry cannot prove global nonrecurrence
      detail: >-
        Empty-class occupancy through two markers permits the bounded statement,
        but recurrence of the actual process is an infinite-history property.
      required_control: >-
        Keep recurrent=false nested under the bounded model and prohibit its
        use as a global C2 rejection or stopping proof.
    - id: QUERY-MEMORY-NOT-CLEARED
      severity: blocking_for_query_reconciliation
      title: Two independent gates remain wholly absent
      detail: >-
        Even a global local-sieve progress proof would not supply the FC0
        W/R/B/M_tail lifetime map or final recovery-error implication.
      required_control: >-
        Implement recovery with a machine-checkable object-lifetime and
        component-to-F trace before considering QUERY_MEMORY clearance.

  required_controls:
    - id: PREDECLARED-SCHEDULE-REPLICATION
      control: >-
        Before inspecting outputs, commit a schedule-selection rule or a small
        schedule panel, then run the same analyzer on every selected row.
      pass_condition: >-
        Selection is immutable before results and all panel outputs are
        reported, including failures and unexpected states.
    - id: EXPLICIT-TAPE-TRANSITION-AUDIT
      control: >-
        Encode typed symbols, tape positions, child-generation phase, retry
        count, and successor transitions directly, then compare its projected
        pair set with the current static enumeration.
      pass_condition: >-
        The explicit machine reaches exactly the claimed projected states and
        records every retry successor without invalid-index transitions.
    - id: IMPLEMENTED-RECOVERY-TRACE
      control: >-
        Instantiate W/R/B/M_tail widths, births, last uses, cleanup,
        concurrency, Verify, and all terminal exits for one bounded attempt.
      pass_condition: >-
        A trace yields a defensible peak live set and an exhaustive map to F.

  counterexample_or_mutation: >-
    The cheapest discriminating mutation is a preregistered adjacent schedule
    panel: hold n and threshold fixed, commit all valid small (logl,logs) rows
    before execution, and apply the same static pair audit plus an explicit
    two-marker tape-state machine to every row. A zero-progress row, a mismatch
    between projected pair sets, or an omitted successor falsifies any attempted
    transfer from this selected [1,2,4] instance.

