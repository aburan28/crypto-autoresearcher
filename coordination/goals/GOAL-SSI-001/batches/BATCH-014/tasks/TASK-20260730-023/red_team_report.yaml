      time: not_claimed
      memory: not_claimed
      data_or_oracle: not_claimed

  narrowest_supported_statement: >-
    At snapshot a3ac87c9, the [1,2,4] schedule arithmetic and the static
    enumeration of 176 internal S=2 vector-pair states independently check.
    Every enumerated pair has positive keep probability, with minimum 3/4 for
    requested lengths 2, 3, and 4 and 1 for length 1. Thus the zero-progress
    class is absent, hence neither jointly reachable nor revisitable through
    the declared one-retry bounded ideal-choice abstraction. This does not
    establish global nonrecurrence, a stopping law, or concrete-HashDRBG
    behavior. The claim that the schedule was pinned before analysis is not
    independently established, and the embedded analyzer should be described
    as static pair-set enumeration rather than an implemented tape-transition
    machine. C2 remains live; C3 remains lexical-only; the error map remains
    live; FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED remains supported.

