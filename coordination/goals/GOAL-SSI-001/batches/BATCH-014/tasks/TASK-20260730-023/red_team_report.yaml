  reduction_and_scope_challenges:
    - >-
      Representation, relation path, rank, scalar orientation, source recovery,
      target descent, and verified key recovery are out of scope.
    - >-
      Nothing transfers to generic ECDLP, numeric CSIDH security, SIDH/SIKE,
      SQIsign/CGL path finding, or GOAL-SSI-001 completion.
    - >-
      Failure to find a zero-progress state in this finite row is not an
      impossibility result and does not close C2.

  scope_limits:
    - >-
      Review is limited to Coordinator-committed snapshot
      a3ac87c9b369b4d306fa8827946c894e62626de5.
    - >-
      One independent deterministic arithmetic recomputation of the embedded
