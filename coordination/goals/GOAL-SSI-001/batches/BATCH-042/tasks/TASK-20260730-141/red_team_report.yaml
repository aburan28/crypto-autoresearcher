        host-level exhaustiveness, invented numerics, τ, relabel-only, and
        QM-STOPPING reopen. That is the correct adversarial guard for the claimed
        outcome, but a future reader must not treat a green harness as
        independent evaluation that OUTCOME-P/OUTCOME-N were runnable
        alternatives — they were audited in prose and the tightening was
        preferred because a genuine committed-structure advance existed.
        Non-blocking.
      blocks_confirm: false
    - id: OBJ-4
