        no_admissible_pin — the same pin QM-STOPPING REV-1 needs. REV-E2 needs a
        committed error-probability source (inventing one is forbidden). REV-E3
        needs a real crypto Verify body. After OBL-2a, the remaining obligations
        are ALL host/source/probability-gated. The Coordinator should therefore
        NOT queue another zero-compute QM-ERROR tightening pass expecting to move
        an obligation, and should treat the QM-ERROR lane as effectively
        pin/source-blocked short of REV. Feeds next_concrete_action. Non-blocking.
      blocks_confirm: false
    - id: OBJ-3
      severity: informational
      title: >-
        The harness positively locks the disposition to f_union_tightened, so it
        is a claim-guard for THIS batch rather than a general three-outcome
        verifier.
      detail: >-
        check_obligation_ledger / check_md_machine_block / check_classification
