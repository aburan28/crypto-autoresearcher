falsifiable_criteria:
  task_id: TASK-20260730-139
  goal_id: GOAL-SSI-001
  batch_id: BATCH-042
  idea_id: IDEA-20260729-001
  decision_ref: DEC-20260730-039
  evidence_input_ref: EV-SSI-041
  registered_before_claim: true
  zero_compute: true
  question: >-
    Can the QM-ERROR blocker (f_union_ledger_partial) be tightened from
    committed in-repo structure short of QUERY_MEMORY clearance without
    inventing probabilities, numeric error bounds, security bits, or τ; or must
    it be paused with concrete revisit conditions?

  outcomes:
    f_union_tightened:
      id: OUTCOME-T
      earns: scoped_qm_error_ledger_tightening
      requires_all:
      - 'A: at least one named obligation is advanced from committed structure with an explicit citation that a reader can check against repository text'
      - 'B: the advance is scoped (spec-internal / structural), explicitly NOT host-level exhaustiveness, NOT probabilistic, NOT a crypto Verify body, NOT clearance'
      - 'C: no invented probabilities, numeric error bounds, security bits, or τ anywhere in the package'
      - 'D: residual obligations are honestly classified in the allowed status vocabulary with concrete revisit conditions'
      - 'E: the advance adds new checkable content not present in the BATCH-025 ledger (reverse inclusion was previously unstated), i.e. it is not a pure relabel'
      falsified_if:
      - The "advance" adds no checkable content beyond BATCH-025 (pure relabel / fatigue re-record)
      - The advance smuggles host-level exhaustiveness, a probability, a numeric bound, security bits, or τ
      - QM-ERROR / QM-STOPPING / QUERY_MEMORY / QM-MEMORY-MAP is claimed cleared or advanced
      - A CollimationSieve API is invented or the BATCH-020 no_admissible_pin is contradicted
      - The QM-STOPPING lane is reopened while REV-1/REV-2 remain unmet
    qm_error_pause_revisit:
      id: OUTCOME-P
      earns: qm_error_lane_pause_with_revisit
      requires_all:
      - 'No committed-structure tightening of any obligation is available in this bounded step'
      - 'Pause names concrete revisit conditions (host pin, error-probability source, or crypto Verify body)'
      - 'Not a ninth unverified fatigue re-record as the primary disposition'
      falsified_if:
      - A committed-structure tightening was in fact available and withheld
      - Pause lacks concrete revisit conditions
      - Illicit clearance / breakthrough / fake-τ claimed alongside pause
    pin_seeking_without_api_invention:
      id: OUTCOME-N
      earns: narrower_host_admissibility_probe
      requires_all:
      - 'A host-admissibility / pin-seeking probe is the narrower uncertainty reduction actually performed'
      - 'No CollimationSieve@6f9188e4 API is invented'
      falsified_if:
      - An API surface is invented to fabricate admissibility
      - The probe silently claims a pin where BATCH-020 no_admissible_pin holds

  selected_outcome: f_union_tightened
  selection_rationale: >-
    A genuine committed-structure tightening is available (OBL-2a: the reverse
    inclusion at spec-internal scope, a definitional consequence of the
    recovery_spec exit typing that BATCH-025 never stated), so OUTCOME-T is both
    warranted and preferred by the batch objective over a pause. Concrete
    revisit conditions REV-E1/REV-E2/REV-E3 are still registered for the
    obligations that remain genuinely blocked, preserving pause-grade honesty
    for the un-tightened part of the account.

  null_object_control_note: >-
    Per inventor-protocol §3: no error-rate / probability signal is claimed in
    this batch, so no null-object control measurement is owed yet. The tightening
    is a set-theoretic (spec-internal) inclusion, not a measured quantity;
    should any future batch report a numeric error rate, it must first be run
    against a random/permuted acceptance distribution of the same shape.
    Registered for successors (REV-E2).
