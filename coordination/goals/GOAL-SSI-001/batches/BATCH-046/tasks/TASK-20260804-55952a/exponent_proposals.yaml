exponent_proposals:
  task_id: TASK-20260804-55952a
  goal_id: GOAL-SSI-001
  batch_id: BATCH-046
  baseline: "Wesolowski 2026: p^{1/3+o(1)} time and memory"
  exponent_target: "sub-p^{1/3}"
  structural_barrier: >-
    The p^{1/3} exponent reflects a fundamental lattice geometry fact: the
    traceless sublattice of a maximal order in B_{p,infty} (rank 3 under Nrd)
    has first minimum ~p^{1/3}. Any algorithm reducing to short-vector-finding
    in quaternion orders hits this barrier. Breaking below p^{1/3} requires a
    fundamentally different algebraic framework.
  proposals:
    - id: IDEA-SSI-EXP-002
      title: "Dimensional descent: g=2 PIP to g=1 path-finding via Morita equivalence"
      priority: highest
      claim: >-
        If the heuristic polynomial-time PIP algorithm for matrix rings M_2(O)
        can be adapted to extract rank-1 ideal generators, the supersingular
        isogeny problem reduces to polynomial time in a higher-dimensional setting.
      mechanism: >-
        End(E x E) = M_2(End(E)). PIP in matrix rings over quaternion orders
        is known to be solvable in heuristic polynomial time at g >= 2.
        Morita equivalence gives a bijection between left O-ideals and left
        M_2(O)-modules. If this bijection is computationally effective for PIP,
        the g=1 problem (which IS the isogeny problem) inherits polynomial time.
      key_obstruction: >-
        Circularity: the algorithm may require O = End(E) as input, but
        computing End(E) IS the problem we're trying to solve.
      cheapest_decisive_test: >-
        Read KN-LIT-7641 and determine: (a) does the PIP algorithm need O as
        explicit input? (b) which step requires g >= 2? (c) is the rank-descent
        (M_2(O) -> O) constructive under Morita equivalence?
      target_complexity: "polynomial time (if reduction works)"
      sota_delta: "infinite improvement over p^{1/3} (if non-circular)"
      dominated_by: null
      falsification: "Algorithm requires O as input (circular), OR g>=2 step uses matrix-specific structure with no rank-1 analogue"
    - id: IDEA-SSI-EXP-001
      title: "Tighter minimal-degree bound via quaternion lattice geometry"
      priority: medium
      claim: >-
        If the Aubry-Oyono-Vincent bound lambda_1 <= (p/2)^{1/3} is not tight,
        Wesolowski's algorithm immediately improves to p^{alpha+o(1)} for alpha < 1/3.
      mechanism: >-
        Re-analyze whether [4]'s bound is achieved or has room for improvement.
        Compare empirical lambda_1 distribution against det^{1/4} (Minkowski for
        generic rank-4) vs det^{1/3} (the current bound).
      key_obstruction: "Wesolowski's experiments show typical lambda_1 ~ p^{1/3}, suggesting tightness"
      cheapest_decisive_test: "Read [4] and check if a LOWER bound argument exists proving p^{1/3} is necessary"
      target_complexity: "p^{alpha+o(1)} for alpha < 1/3"
      sota_delta: "dependent on alpha; likely 0 (bound appears tight)"
      dominated_by: null
      falsification: "Lower bound proof exists in [4], or empirical data consistently at p^{1/3}"
    - id: IDEA-SSI-EXP-003
      title: "Index calculus on supersingular graph via Eichler-order factor base"
      priority: low
      claim: "Subexponential if structured relations can be found cheaply"
      key_obstruction: "Finding relations reduces to solving the full problem (circular)"
      falsification: "No structured factor base avoids the circularity"
      dominated_by: "Wesolowski 2026"
    - id: IDEA-SSI-EXP-004
      title: "Non-cyclic kernel exploitation"
      priority: low
      claim: "Cofactor improvement only (o(1) term); does NOT change exponent"
      dominated_by: "Wesolowski 2026 (same exponent)"
    - id: IDEA-SSI-EXP-005
      title: "Quantum claw-finding on Wesolowski table"
      priority: deferred
      claim: "p^{2/9+o(1)} quantum with p^{1/3+o(1)} QRACM"
      key_obstruction: "Requires quantum hardware; likely already analyzed by Jaques-Schanck"
      dominated_by: "deferred per quantum policy"
    - id: IDEA-SSI-EXP-006
      title: "Norm-equation sieve in B_{p,infty}"
      priority: low
      claim: "Likely reduces to Wesolowski in different notation"
      key_obstruction: "Lattice minimum is ~p^{1/3}; sieving doesn't find below minimum"
      dominated_by: "Wesolowski 2026"
  selected_next_gate:
    proposal_id: IDEA-SSI-EXP-002
    gate_type: theory_reading
    description: >-
      Read KN-LIT-7641 (the higher-dimensional PIP algorithm). Determine whether
      the reduction from g=1 to g=2 is circular. This is zero-compute, decisive,
      and has maximal payoff.
    expected_outcome: >-
      Most likely: circular (algorithm needs O as input). If so, p^{1/3} is a
      hard structural barrier and the goal should record this as the honest state.
      Less likely but high-payoff: non-circular, opening a polynomial-time avenue.
