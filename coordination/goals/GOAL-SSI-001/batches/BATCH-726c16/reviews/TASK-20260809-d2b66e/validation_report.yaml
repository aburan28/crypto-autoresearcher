      references:
        - experiments/EXP-SSI-16649/specification.yaml:479-491
        - coordination/goals/GOAL-SSI-001/batches/BATCH-726c16/dispatch_queue.json:117-124
    - check: evidence_boundary
      status: no_evidence
      evidence: >-
        This review reports no timing, FOE row, memory measurement, baseline
        comparison, control outcome, attack, security, exponent, novelty,
        hypothesis-transition, or completion result. The missing incumbent is
        an admission condition, not negative evidence.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:1-39
        - experiments/EXP-SSI-16649/inputs/INCUMBENT-FOE-v1.yaml:33-45

  cost_model_checks:
    - check: event_to_foe_mapping
      status: incomplete
      evidence: >-
        The primitive table assigns costs to numeric codes, but setup_events
        and query_events are names with no numeric event-code table. The event
        record contains operand_count and operands but no declared operation
        count, although event_foe is defined using that absent count. Terminal,
        branch-null, digest, provider, matrix, witness, and replay events do
        not receive a complete one-to-one code/phase/payload mapping. The
        attempt sum therefore cannot be independently recomputed from a trace.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:353-402
        - experiments/EXP-SSI-16649/specification.yaml:433-458
    - check: setup_access_and_attempt_accounting
      status: incomplete
      evidence: >-
        Builder setup versus query access is separated in prose, but no
        branch-specific event schedule proves which setup artifacts are built
        once, which bytes are read per attempt, and which setup-access reads
        are included in T_attempt versus T_setup. The trace lacks the operand
        bytes and exact event population needed to detect omission or duplicate
        charging.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:266-300
        - experiments/EXP-SSI-16649/specification.yaml:394-403
    - check: memory_accounting
      status: incomplete
      evidence: >-
        M_advice and M_work are named, but helper header_bytes, index
        header_bytes, certificate_header_bytes, max_transition_bytes, all
        record widths, incumbent/source bytes, and the required live-range
        table are not supplied. A source digest or on-disk file is said not to
        be free, but its byte storage and lifetime are not modeled. Exact peak
        memory cannot be recomputed.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:209-215
        - experiments/EXP-SSI-16649/specification.yaml:254-259
        - experiments/EXP-SSI-16649/specification.yaml:331-352
        - experiments/EXP-SSI-16649/specification.yaml:403-408
    - check: incumbent_admission_and_break_even
      status: correctly_blocked_but_not_admissible
      evidence: >-
        The input is a hash-declared gate file, but both parameter FOE values
        and peak memories are null, and source path, command, commit, digest,
        generator version, and independent receipt are null. The v8 hard gate
        correctly keeps freeze, comparison, improvement, and break-even
        invalid. This is an intentional external measurement/admission
        condition, not evidence against the SSI mechanism.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:409-431
        - experiments/EXP-SSI-16649/inputs/INCUMBENT-FOE-v1.yaml:1-45

  proof_architecture_checks:
    - check: edge_certificate_v3
      status: incomplete
      evidence: >-
        The outer certificate field order is stated, but transition frames have
        no tag/version/payload grammar, field widths, transition digest
        preimage, or exact edge-count parsing rule. No equality binds
        edge_count to parsed transitions or path_bytes to the edge stream, and
        provider receipt/mirror metadata have no canonical source artifact or
        field maxima beyond generic bytestring limits. certificate_header_bytes
        and max_transition_bytes are undefined.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:331-352
        - experiments/EXP-SSI-16649/specification.yaml:99-121
    - check: edge_to_hnf_interface
      status: incomplete
      evidence: >-
        EDGE-CERT-v3 transitions carry source/destination indices, degrees, and
        factor lists, but no deterministic mapping produces the MATRIX-v3 or
        any edge transition matrix consumed by HNF-RIGHT-ROW-v2. The positive
        path names a certificate read but does not bind certificate transitions
        to the helper payload, matrix digest, or output witness.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:301-329
        - experiments/EXP-SSI-16649/specification.yaml:331-350
    - check: hnf_and_saturation_algorithm
      status: incomplete
      evidence: >-
        "Specified deterministic right-row operations" are not actually
        specified elsewhere: pivot/remainder/sign conventions, operation
        record grammar, factor-list count/bytes, scalar values, exact lattice
        saturation, intermediate bounds, and operation-log digest preimage are
        absent. MATRIX-v3 dimensions are bounded individually but its product
        and serialized byte size are not.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:301-318
        - experiments/EXP-SSI-16649/specification.yaml:99-145
    - check: output_v3
      status: incomplete
      evidence: >-
        OUTPUT-v3 names branch_code, scalar_class, witness_count, witnesses,
        matrix_digest, hnf_log_digest, and output_digest, but witness-record
        bytes, scalar-class/branch-code literals, complete-witness predicate,
        and output_digest preimage are not defined. The null reason code is
        likewise untyped. Thus the high-level positive path is present, but no
        unique output byte stream or output event can be recomputed.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:319-329
        - experiments/EXP-SSI-16649/specification.yaml:433-443
    - check: finite_builder_terminal_and_padding
      status: incomplete
      evidence: >-
        Fixed-width null records and a one-time terminal frame improve the v7
        boundary, but terminal names have no numeric code table, reason bytes
        have no allowed literal grammar, and no FINITE_MANIFEST_EXHAUSTED
        terminal distinguishes finite-owner exhaustion from CAP_EXHAUSTED.
        Retained-record width is not defined, and no rule says how null/padding
        positions affect retained, attempted, failed, duplicate, padding, or
        S_eff counts and their costs. requested_owner_count also has no
        explicit relation to the finite owner manifest.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:266-300
        - coordination/goals/GOAL-SSI-001/batches/BATCH-5a886c/reviews/TASK-20260809-f3ef91/validation_report.yaml:529-539

  residual_gaps:
    - id: PROV-001
      category: infrastructure_provenance
      severity: blocking_for_exact_snapshot_admission
      finding: >-
        The requested and queue-bound snapshot SHA is unresolvable and differs
        from the actual snapshot parent reachable from HEAD. A Coordinator
        must create an additive provenance correction or new snapshot binding;
        this review cannot repair it.
      references:
        - coordination/goals/GOAL-SSI-001/batches/BATCH-726c16/dispatch_queue.json:64-75
    - id: PROV-002
      category: infrastructure_provenance
      severity: caveat
      finding: >-
        The snapshot receipt is not self-binding: commit_sha is null and
        verification is pending_post_commit. The queue archive's parent also
        does not match the actual snapshot parent.
      references:
        - coordination/goals/GOAL-SSI-001/batches/BATCH-726c16/archives/TASK-20260809-754c17/snapshot-receipt.json:8-25
        - coordination/goals/GOAL-SSI-001/batches/BATCH-726c16/dispatch_queue.json:64-76
    - id: DESIGN-001
      category: design
      severity: freeze_blocking
      finding: >-
        The v8 generic biguint inventory does not provide complete per-field
        and derived-product bounds; counts, lengths, matrix products, event
        streams, certificate bytes, and memory sums are not closed against the
        declared limits.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:99-145
        - experiments/EXP-SSI-16649/specification.yaml:122-133
    - id: DESIGN-002
      category: design
      severity: freeze_blocking
      finding: >-
        C-HELPER-v3 declares a 96-byte slot whose own canonical fields require
        377 bytes. Its capacity rule also lacks zero and over-capacity behavior.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:178-215
    - id: DESIGN-003
      category: design
      severity: freeze_blocking
      finding: >-
        C-helper stores a digest and zero reservation rather than a typed
        middle-factor payload, while later helper_payload_decode and the HNF
        path require payload data. No payload digest preimage or factor/matrix
        mapping closes that interface.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:192-215
        - experiments/EXP-SSI-16649/specification.yaml:301-329
    - id: DESIGN-004
      category: design
      severity: freeze_blocking
      finding: >-
        ORDER-MANIFEST-v3 has a useful field order but no concrete generator
        source path, owner-set digest preimage, branch/advice constructor, or
        exact header-byte operands. The vertex manifest likewise names
        SSJ-ENUM-v1 and S_p_sha256 without a committed generator/source byte
        binding.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:164-176
        - experiments/EXP-SSI-16649/specification.yaml:216-234
    - id: DESIGN-005
      category: design
      severity: freeze_blocking
      finding: >-
        TARGET-SELECTION-INDEX-v3 has no selection-code meaning or mapping to
        owner/endpoint pairs. Its 0x40 query-key construction is not the
        C-helper 0x31 pair-key construction, and no translation between the
        two key domains is defined.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:178-215
        - experiments/EXP-SSI-16649/specification.yaml:235-259
    - id: DESIGN-006
      category: design
      severity: freeze_blocking
      finding: >-
        Target-index record_width/header bytes and target_count*selection_count
        capacity/overflow rules are absent. The visible record is 206 bytes
        under the stated encoding, but the contract never binds that value.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:122-133
        - experiments/EXP-SSI-16649/specification.yaml:235-264
    - id: DESIGN-007
      category: design
      severity: freeze_blocking
      finding: >-
        The finite builder has no numeric terminal/reason code table, no
        finite-manifest-exhaustion terminal, no retained-row grammar, and no
        padding/S_eff/counter accounting rule. Fixed-width null intent alone
        does not make the stream byte-recomputable.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:266-300
    - id: DESIGN-008
      category: design
      severity: freeze_blocking
      finding: >-
        Event names are not mapped to numeric event codes, operation count is
        absent from event records despite being used in event_foe, and terminal,
        null, certificate, matrix, witness, and replay events have no complete
        event schedule or payload grammar.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:353-402
    - id: DESIGN-009
      category: design
      severity: freeze_blocking
      finding: >-
        M_advice/M_work cannot be recomputed because record/header widths,
