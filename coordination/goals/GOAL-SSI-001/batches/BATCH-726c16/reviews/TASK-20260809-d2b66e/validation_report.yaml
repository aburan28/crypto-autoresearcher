  metric_recomputations:
    - metric: canonical_integer_envelope
      status: incomplete
      result: >-
        The global 70-byte biguint rule gives a common encoding, but it is not
        a field-by-field domain bound. Derived products and counts have no
        explicit admissibility inequalities: owner-set cardinality and pair
        count A_C, target_count*selection_count, manifest/body byte products,
        matrix-entry products, factor-list lengths, event counts, witness
        counts, transition sizes, and live-buffer sums are not all bounded
        against their respective maxima. A blanket inventory paragraph cannot
        prove that each derived operand fits both biguint and frame limits.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:99-145
        - experiments/EXP-SSI-16649/specification.yaml:122-133
        - experiments/EXP-SSI-16649/specification.yaml:235-264
        - experiments/EXP-SSI-16649/specification.yaml:301-352
    - metric: c_helper_slot_width
      status: failed_internal_consistency
      result: >-
        Under the v8 encoding, the declared C-HELPER-v3 slot record requires
        1 + 32 + 4*70 + 32 + 32 = 377 bytes: occupied, key, owner_index,
        endpoint_index, middle_degree, middle_factor_count,
        middle_factor_digest, and payload_reserved. The declared
        slot_width_bytes is 96. Thus the table body, capacity memory equation,
        slot reads, and helper digest cannot all describe the same bytes.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:99-121
        - experiments/EXP-SSI-16649/specification.yaml:178-215
    - metric: c_helper_capacity_and_payload
      status: incomplete_and_inconsistent
      result: >-
        next_power_of_two(2*A_C) is undefined for A_C=0 and can produce
        capacity 2^32 when A_C is above the range compatible with the stated
        max_capacity 2^32-1. No bound ties A_C to the finite owner set or to
        the table byte/frame limits. In addition, payload_width_bytes is 64,
        while the slot contains only a 32-byte digest and 32 zero bytes; no
        serialized middle-factor record, matrix, or factor payload is present
        for helper_payload_decode or the later HNF path to consume.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:186-215
        - experiments/EXP-SSI-16649/specification.yaml:301-329
    - metric: target_index_record_width_and_capacity
      status: incomplete
      result: >-
        The visible fixed record fields would occupy 70 + 1 + 32 + 70 + 32 + 1
        = 206 bytes under the stated encoding, but record_width and
        index_header_bytes are never assigned. The index requires four records
        per target while max_query_records is only a global 2^32-1 limit; no
        target_count*selection_count overflow or frame-size rule is supplied.
        The memory and build-FOE rows therefore cannot be recomputed.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:235-259
        - experiments/EXP-SSI-16649/specification.yaml:122-133

  control_checks:
    - control: schema_precedence
      status: verified_as_namespace_boundary
      evidence: >-
        SSI-CANONICAL-v8 is named as the active namespace, historical inputs
        are lineage-only, conflicts are resolved in favor of v8, and missing
        v8 fields are invalid rather than inherited. This closes the specific
        v1/v6/v1.1/v2 co-active-precedence defect at the prose boundary.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:41-55
        - experiments/EXP-SSI-16649/specification.yaml:84-98
    - control: paired_replay
      status: incomplete_and_internally_tensioned
      evidence: >-
        The full-stream and post-hash final-bit requirements are explicit, but
        no event-code table, event payload grammar, trace-container framing,
        treatment/replay record schema, continuation rule after treatment
        success, or identity-bit preimage is defined. The same-stream clause
        also conflicts with branch_null's OUTPUT-v3 scalar_class=2 and reason
        code when treatment emits a non-scalar witness: those output bytes are
        not identical if output serialization is part of the shared stream.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:388-402
        - experiments/EXP-SSI-16649/specification.yaml:433-438
        - experiments/EXP-SSI-16649/specification.yaml:439-447
    - control: owner_specific_branch_null
      status: incomplete
      evidence: >-
        The contract requires an owner-specific null path and a scalar_class=2
        output, but it supplies no branch-code table, reason-code literals,
        owner mutation/generation algorithm, null certificate binding, or
        proof that the null and treatment use the same semantic path and event
        population. "Every branch code" is not an enumerated finite control.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:277-295
        - experiments/EXP-SSI-16649/specification.yaml:319-329
        - experiments/EXP-SSI-16649/specification.yaml:439-443
    - control: c_pair_null
      status: incomplete
      evidence: >-
        v8 correctly forbids silent iid substitution and says the dependent
        null reuses the treatment generators, but it does not specify the
        finite null table's seed bytes, replicate count, finite reference law,
        censoring/acceptance threshold, digest preimage, endpoint/marginal
        serialization, duplicate policy, or rejection terminal. The control
        is a declaration of intended matching, not a replayable finite object.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:433-447
        - experiments/EXP-SSI-16649/specification.yaml:454-458
        - coordination/goals/GOAL-SSI-001/batches/BATCH-5a886c/reviews/TASK-20260809-f3ef91/validation_report.yaml:602-612
    - control: synthetic_reference
      status: incomplete
      evidence: >-
        The per-cell field list and max-over-complete-target-rows rule are
        useful boundaries, but v8 gives no synthetic graph/domain generator,
        target-set/start derivation, rational recurrence or reference law,
        literal seed/digest framing, rational field grammar, or exact
        aggregation gate. The target-set field is named but no canonical
        target-set identity/byte preimage is defined.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:448-453
        - experiments/EXP-SSI-16649/specification.yaml:479-491
        - coordination/goals/GOAL-SSI-001/batches/BATCH-5a886c/reviews/TASK-20260809-f3ef91/validation_report.yaml:613-623
    - control: query_generation_and_rejection
      status: incomplete
      evidence: >-
        The seed-domain expression is present, but Fisher-Yates and
        next-distinct rejection bounds are only asserted, not given as finite
        numeric limits with draw-width, exhaustion encoding, or terminal
        mappings. Selection-code semantics and the owner/endpoint selected by
        each code are also absent.
      references:
        - experiments/EXP-SSI-16649/specification.yaml:242-253
        - experiments/EXP-SSI-16649/specification.yaml:454-458

  heuristic_validation_checks:
    - check: design_scope_and_quantifier
      status: verified_as_scope_only
      evidence: >-
        The fixed-advice quantifier is explicit, per-query advice regeneration
        is prohibited, and the claim ceiling excludes all-advice lower bounds,
        deployed security, and positive SIDH/SIKE results. This is a claim
