      references:
        - experiments/EXP-SSI-16649/specification.yaml:57-82
    - check: proof_search_map
      status: present_not_discharged
      evidence: >-
        The baseline, collision, quantifier-order, and nearby-control audits
        are named. No baseline reproduction, collision search, nearby-object
        run, or heuristic observation was performed under this no-execution
