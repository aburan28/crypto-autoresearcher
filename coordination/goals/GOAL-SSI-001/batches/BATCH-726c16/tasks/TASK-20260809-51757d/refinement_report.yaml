    - id: R4
      issue: finite_accounting
      repair: >-
        Builder records, null padding, terminal codes, setup/access separation,
        event tags, primitive cost mapping, complete attempt sums, memory live
        ranges, and exact rational break-even are defined once.
    - id: R5
      issue: incumbent_binding
      repair: >-
        A real path and SHA256 bind INCUMBENT-FOE-v1. The artifact deliberately
        records pending_external_measurement with null values; this is a hard
        freeze blocker rather than a fabricated baseline.
    - id: R6
      issue: certificate_hnf_output
      repair: >-
        EDGE-CERT-v3 has one complete frame, transition root, provider receipt,
        mirror digest, horizon, and byte budget. The only positive path is
        helper lookup through HNF, factor saturation, scalar classification,
        and OUTPUT-v3.
    - id: R7
      issue: replay_null_pair_synthetic
      repair: >-
        Full-stream paired replay, owner-specific nulls, finite C-pair null
        replicates, and per-cell synthetic rational references are bound to
        identical seeds, bytes, and censoring rules.
