        inclusion package. Prefer a dedicated
        collimation_sieve_negative_control_commit field over overloading
        artifact_commit_reference.
    - id: STATUS-STRING-NOT-CLEARANCE
      severity: blocking_for_scope_expansion
      title: path_justified_partial is not QM-ERROR / QUERY_MEMORY clearance
      detail: >-
        QM-ERROR now carries path_justified_partial. That string must not be
        compressed into clearance, reconciliation, PIN_COMPLETE, crypto
        end-to-end F_* ⊆ F, probability-composed union closure, or
        QUERY_MEMORY success. Producer fields already set clearance: false
        and reconciled: false; the failure mode is downstream ledger wording.
      required_control: >-
        Official ledger language must say QM-ERROR remains open under
        path_justified_partial (not cleared), with crypto Verify body /
        probability composition / F_sim→F still pending; keep QM-STOPPING
        open, MEMORY-MAP peak_liveset_partial, and disposition unreconciled.
    - id: SCAFFOLD-PATH-NOT-CRYPTO-E2E
      severity: blocking_for_scope_expansion
      title: path_justified_on_scaffold is not crypto end-to-end F_* ⊆ F
      detail: >-
        Every constituent is path_justified_on_scaffold via ScaffoldProcedure
        injections on no-crypto token Verify. All seven retain
        justified_by_implemented_end_to_end_crypto_path=false and
        probability_bounds=false. Treating scaffold path justification as
        CollimationSieve operational error-map composition or QM-ERROR
        clearance would invent evidence.
      required_control: >-
        Keep composition_status=path_justified_partial and
        justified_by_implemented_end_to_end_crypto_path=false in all official
        claims; next ERROR work remains probability-composed union inclusion
        and/or crypto-or-host Verify under an explicit protocol, still without
        CollimationSieve API invention.
    - id: CLASSIFY-F-IS-DEFINITIONAL
      severity: blocking_for_scope_expansion
      title: Common-F classification is definitional once Verify=true is absent
      detail: >-
        _classify_common_F is not verify_true_returned. Any halt that never
        returns Verify=true is ∈ F by the recovery_spec definition. The
        non-tautological content of path_justified_on_scaffold is the
        executable named-channel injection plus contrasting success control,
        not an independent probabilistic membership argument. Reading
        classified_as_common_F=true as a distribution-level inclusion proof
        would invent evidence.
      required_control: >-
        Ledger language must call the advance scaffold-procedure path
        justification only; require probability composition (and crypto/
        host Verify where claimed) before any operational error-bound or
        clearance reading.
    - id: F-CLEANUP-DRIVER-APPEND
      severity: non_blocking_qualification
      title: F_cleanup failures list appended by procedure driver
      detail: >-
        BATCH-022 _destroy raises LifetimeError(F_cleanup) without appending
        to reg.failures; procedure_driver appends the channel for path
        accounting and documents scaffold_failures_append=procedure_driver.
        This is honest bookkeeping for a real LifetimeError path, not silent
        invention of a scaffold API, but it is weaker than native
        reg.failures recording.
      required_control: >-
        Keep the documented note in EV/DEC prose; do not present F_cleanup
        as natively recorded by BATCH-022 FailureChannel append semantics
        alone.

