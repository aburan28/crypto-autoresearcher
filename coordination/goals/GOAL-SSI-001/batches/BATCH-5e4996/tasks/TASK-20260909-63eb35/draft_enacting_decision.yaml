# DRAFT ENACTING DECISION - DEC-20260909-e7a4fe
# TASK-20260909-63eb35, BATCH-5e4996, GOAL-SSI-001.
# DRAFT: not in force until committed by the ledger archive. It DECLARES the
# version 1 -> 2 transition; it does not perform it (the ledger-archive
# enactment commit performs it). It enacts the companion record UNALTERED in
# the same decision. It resolves exactly the six NA-2 items in its own text and
# nothing beyond. It lifts no prohibition and authorizes no run.
coordinator_decision:
  id: DEC-20260909-e7a4fe
  goal_id: GOAL-SSI-001
  batch_id: BATCH-5e4996
  decided_by: coordinator
  decision_kind: enacting_decision_draft
  recorded_at: '2026-09-09'
  status: draft

  identifier_check:
    id: DEC-20260909-e7a4fe
    command: 'python3 tools/allocate_id.py --check DEC-20260909-e7a4fe'
    status: NOT OBTAINED (no shell in this runtime's tool surface)
    read_only_equivalent: >-
      A direct content search of ledger/ finds DEC-20260909-e7a4fe only at its
      declared reservation site (ledger/decisions/DEC-20260909-b810da.yaml, the
      opening decision for this batch, which names it as the reserved enacting
      id), and no file ledger/decisions/DEC-20260909-e7a4fe.yaml exists. The
      token conforms to the 6-hex grammar. This is weaker than the tool and is
      recorded as such; the literal --check output is recorded in the runtime
      receipt (e) as NOT OBTAINED.

  authority_and_scope: >-
    Coordinator authority alone. Authored under the standing user authorization
    of 2026-09-06 for ideas and experiments, which removes permission prompts
    and removes nothing else. This is a DRAFT of the enacting decision: it
    declares the effect of enacting the redraft and the companion, resolves the
    six NA-2 items, and restates the citation prohibition. It performs no
    version transition (the ledger-archive enactment commit does), it enacts
    the companion UNALTERED in the same decision, and it moves no hypothesis,
    experiment, research-direction or goal status. GOAL-SSI-001 stays `active`.

  what_this_decision_enacts:
    - >-
      The four redraft clauses (clause_1..clause_4) spliced exactly per the
      redraft's splice_procedure, as the enacted text
      enacted_specification_v2.yaml in this task directory.
    - >-
      The AF-1 version transition 1 -> 2, DECLARED here and performed only by
      the ledger-archive enactment commit.
    - >-
      The companion record
      coordination/goals/GOAL-SSI-001/batches/BATCH-5e4996/tasks/TASK-20260909-8b3cce/companion_record_package.yaml
      UNALTERED, in the same decision (see companion_enacted_unaltered).

  version_transition:
    from: 1
    to: 2
    declared_not_performed: true
    performed_by: the ledger-archive enactment commit (this decision declares it; it does not perform it)
    af_1_position: (a)
    exact_bytes_changed: 'experiment.version: 1 -> 2 (the only byte change outside the four clauses)'
    enacted_difference_set: >-
      SIX, per AF-1: the four-clause five differences (metrics[5] old key
      REMOVED, metrics[5] new key ADDED, model_definition.vow_charging_law
      ADDED, controls[0].anchor_semantics ADDED, controls[0].anchor_reachability
      ADDED) plus the version bump (experiment.version VALUE CHANGED).
    structural_diff_rerun: >-
      See structural_diff_rerun_receipt.yaml (P-7). The mechanical re-run is
      BLOCKED (no shell); the reading-based structural analysis of the enacted
      artifact against the frozen v1 yields exactly the six differences and
      nothing else. The control-built document's five-difference result is NOT
      cited as the enacted artifact's result.

  # =======================================================================
  na_2_resolutions:
    preamble: >-
      The six items of NA-2, each resolved in this decision's own text under a
      locatable heading, per DEC-20260909-eb21b9 what_this_decision_does_not_
      resolve and DEC-20260906-f709b2 must_be_resolved_in_the_enacting_decision.

    na_2_i_cf_10_raw_path_and_travels_with:
      item: >-
        CF-10's RAW_PATH placement question, with the `travels with` authority
        limb (DEC-20260904-4c81b6 next_actions[4]).
      resolution: >-
        RESOLVED. The CF-10 repair - cost_model.py's default raw-result output
        path naming the committed run directory RUN-WESOVOW-201692-001, so an
        invocation without WESOVOW_RAW_PATH set would write into a committed run
        directory - travels in the COMPANION RECORD, enacted in the same
        decision as this one. I RESOLVE the `travels with` authority limb by
        adopting the redraft's reading: `travels with` means the same ACTION and
        the same enacting DECISION, not necessarily the same RECORD. The
        companion is therefore enacted as a SEPARATE RECORD by this SAME
        decision. This is consistent with the redraft's four reasons (different
        artifact and kind, different defect class, different enactment
        consequence, economy), with the red team's fifth reason and its
        same-decision condition, with P-6 (gating on existence is compatible
        with either reading), and with the companion having been drafted in
        separate-record form. The CF-10 output-path repair is inspection-
        verifiable; the clause_4 raw-output STATUS is prospective and needs a
        separate execution decision, which this decision does not authorize.

    na_2_ii_f_7_over_reading_path:
      item: >-
        The F-7 over-reading path: any enacting text carrying `fidelity ...
        settled and closed` must say `to the frozen transcript` in the same
        sentence, citing the external limb separately and only for the ten
        values.
      resolution: >-
        RESOLVED BY SCOPING. The statement that the ten values' fidelity is
        settled is scoped TO THE FROZEN TRANSCRIPT: it is the fidelity of the
        specific extraction verified by EV-SSI-7a3e91 (a producer verification
        and a blind independent second extraction agreeing on all ten values),
        and that is the only fidelity this decision calls settled. The external
        limb - the source's own characterization of the five pairs as lower
        bounds - is cited SEPARATELY, to DEC-20260904-4c81b6 next_actions[0]
        limb (ii) and its recorded locator (inputs/P13-WESOLOWSKI-2026/
        paper_fulltext.md:234-238), and ONLY for the ten values. The enacted
        clause_3 text carries this scoping (it cites the locator to the decision
        that records it, not to a reading, and takes the values as given).

    na_2_iii_f_2_f_3_warrant_defects:
      item: >-
        The F-2 and F-3 warrant defects, by a SUCCESSOR RECORD and never by
        superseding an immutable artifact - to which RT-2 adds CF-22.
      resolution: >-
        RESOLVED BY ROUTING TO A SUCCESSOR RECORD. The F-2 and F-3 warrant
        defects are NOT repaired here and NOT by any edit to an immutable
        artifact; they travel by a successor record in the NA-3/NA-4 stream,
        carrying RT-2's CF-22. The stronger claim - that the R3 warrant
        sentence is wrong - is left UN-PROMOTED: evaluating the R3 warrant
        sentence's antecedent (the `A > 0` governed sign) would require
        computing a governed baseline-comparison sign, and asserting the warrant
        is wrong would need `review-breakthrough` at `max`, which is
        `degradable: false` and unservable here under IMP-1. Substituting a
        lower tier is the silent downgrade the policy layer forbids, and it was
        not done.

    na_2_iv_rt_6_rt_9a_rt_12:
      item: >-
        RT-6, RT-9(a) and RT-12, each reserved to the enacting decision by
        DEC-20260905-3b8e94 next_actions[1](iv) and CF-23.
      resolution: >-
        RESOLVED, EACH A RULING ONLY THE ENACTING COORDINATOR CAN MAKE.
        RT-6: the qualifier "before the declared overhead multiplier" in
        clause_2's second invariant is RETAINED AS A NON-OPERATIVE
        CLARIFICATION - a gloss on C4 stated by reference, not a change to C4's
        own text or mathematical content. C4 remains listed as untouched in the
        sense that its content is unchanged; the qualifier is the "stated by
        bare reference" reading of the red team's two smaller repairs, and C4 is
        not re-listed as annotated.
        RT-9(a): the enactment precondition is satisfied for the LOCATOR (the
        three key paths clause_2 names exist - the AF-3 check), and the
        CHARACTERIZATION (that the five pairs are lower bounds) is ATTRIBUTED to
        DEC-20260904-4c81b6 next_actions[0] limb (ii) and its recorded locator,
        not re-verified by this decision. clause_3 already carries this
        attribution, and this decision adopts it rather than extending the
        precondition to re-verify the characterization.
        RT-12: the sentence an enacting decision quotes is the producer's
        DISJUNCTIVE statement, not the bare word "unsatisfiable". The
        gating_reproduction verdict is `reproduced`, with the satisfying set and
        the witness; the disjunctive statement is the accurate characterization
        and is the one quoted.

    na_2_v_rt_4_licensing:
      item: >-
        RT-4's licensing question, standing and unchanged; its ruling is ADOPTED
        and its merits remain attackable (W_1).
      resolution: >-
        RESOLVED BY ADOPTION. I ADOPT the RT-4 licensing ruling at
        coordination/goals/GOAL-SSI-001/batches/BATCH-1fa3fb/tasks/TASK-20260906-6afb30/rt4_licensing_ruling.yaml
        (adopted by name in DEC-20260906-2e712f): the redraft's repair -
        carrying the two provisos into clause_4's own text and declaring them
        operative, leaving only a residual `fuller_statement` pointer that
        carries no operative condition - DISCHARGES RT-4, and RT-4 requires
        nothing further. ADOPTION IS NOT SETTLEMENT OF THE MERITS: the ruling's
        merits were checked by nobody in BATCH-1fa3fb by deliberate design, and
        the attack it exists to buy is performed below (w_1_merits_attack). The
        two residual observations the ruling recorded (OBS_1 count-versus-
        enumeration, OBS_2 locator completeness) travel with it UN-PROMOTED.

    na_2_vi_af_1_through_af_4_and_f_j2_1:
      item: >-
        The four act items AF-1 through AF-4 and F-J2-1's naming.
      resolution: >-
        RESOLVED. AF-1: position (a) - this decision performs the version bump
        in its declared effect, names the exact bytes it changes
        (experiment.version: 1 -> 2), records that the ENACTED difference set is
        SIX rather than five, and re-runs the committed structural diff against
        the ENACTED artifact (structural_diff_rerun_receipt.yaml) rather than
        citing a five-difference result obtained on a document that was never
        version-bumped. AF-2: the artifact treated as discharging
        prerequisites_before_such_a_decision[1] is the pre-review commit
        9da258d0e, which is what actually placed the package under an
        independent reviewer; TASK-20260906-9f3e2a is a `ledger` archive and not
        a snapshot archive, and that commit carried none of the archival gates.
        The prerequisite's INTENT is discharged while its LETTER is recorded as
        naming the wrong task; the immutable redraft is not edited and a
        successor record may correct the letter. AF-3: the transitive pointer is
        checked - the three key paths clause_2 names
        (amendment.corrected_model.log2_law, .endpoint_behavior, .crossover) are
        confirmed to exist in
        coordination/goals/GOAL-SSI-001/batches/BATCH-2e6130/tasks/TASK-20260809-ef3e58/protocol_amendment.yaml,
        and that record's own status and in_force fields and whether the law it
        states satisfies clause_2's three invariants are recorded in the
        pre-enactment check below. AF-4: the interval ruling is stated in
        af_4_interval_ruling. F-J2-1: clause_4's LICENCE and its FORECLOSURE
        limb are named among the effects enacted in f_j2_1_naming.

  # =======================================================================
  af_3_pre_enactment_check:
    pointer: coordination/goals/GOAL-SSI-001/batches/BATCH-2e6130/tasks/TASK-20260809-ef3e58/protocol_amendment.yaml
    opened: true
    key_paths_exist: >-
      CONFIRMED BY OPENING THE RECORD: all three key paths clause_2 names exist
      - amendment.corrected_model.log2_law (the law log2(T(w)) = log2(T_full) +
      0.5*max(0, log2(M) - log2(w)) + overhead_bits), amendment.corrected_model.
      endpoint_behavior (the w=1, w=M and w>M rows), and amendment.corrected_
      model.crossover (the closed form log2(w_star) = log2(M) + 2*(log2(T_full)
      + overhead_bits - log2(T_DG))).
    record_status_and_in_force: >-
      RECORDED FROM THE POINTED-TO RECORD: status is `prospective_and_frozen`;
      the record carries NO in_force field (absent, not false). This decision
      records both exactly as the record states them and does not re-assert them
      beyond the read.
    law_satisfies_invariants: >-
      CHECKED AGAINST THE LAW AS STATED. (1) C3: the law is non-increasing in w
      (the term 0.5*max(0, log2(M)-log2(w)) falls as w rises) and, before the
      overhead multiplier, T(w) = T_full for w >= M (the endpoint_behavior block
      states w=M and w>M both give T_full before overhead). (2) C4: T(M) = T_full
      exactly before the declared overhead multiplier (endpoint_behavior.
      w_equals_M). (3) The crossover closed form is the crossover of that same
      law: solving log2 T(w*) + overhead_bits = log2 T_DG under the law for w* <
      M gives log2(w*) = log2(M) + 2*(log2(T_full) + overhead_bits - log2(T_DG)),
      which is exactly the record's crossover equation. All three invariants hold.
    scope_note: >-
      The pointed-to record is not in this task's declared read_scope; it was
      opened to perform the AF-3 precondition check that DEC-20260906-f709b2
      names as P-2 of the enacting batch. This read is disclosed here and in the
      runtime receipt, and it is a read of a committed coordination record, not
      of any frozen target or of inputs/.

  # =======================================================================
  af_4_interval_ruling:
    ruling: >-
      TWO SENTENCES, CLOSING THE INTERVAL QUESTION WITHOUT TOUCHING A CLAUSE.
      FIRST: clause_4's raw-output status requirement is PROSPECTIVE on
      implementations, and the one existing implementation is non-conforming
      from the instant of enactment, and this is accepted knowingly. SECOND:
      clause_3's unsubjected `deviation_sign_note` binds reports written after
      enactment and may be satisfied by citing statuses already recorded in a
      committed coordination artifact.

  # =======================================================================
  f_j2_1_naming:
    effects_enacted_named: >-
      clause_4's LICENCE and its FORECLOSURE limb are named EXPLICITLY among the
      effects this decision enacts, because the record's own declared effect set
      (amendment.what_this_changes, nine items) omits both. The LICENCE is the
      statement of what an `off_curve` and a `reachable` status license; the
      FORECLOSURE is the statement that an `off_curve` status forecloses
      treating the anchor as an admissible (T_full, M) input at that field size
      and forecloses citing any row derived from it as a cost, a speedup or a
      crossover of this model.
    internal_disclosure_cited: >-
      I cite amendment.constraint_compliance.constraint_iii as the record's own
      internal disclosure of both limbs, as DEC-20260906-f709b2 expressly
      permits.
    what_this_naming_does_not_do: >-
      It does NOT settle RT-4's licensing question (that is na_2_v, resolved by
      adoption), and it does NOT read clause_4 as lifting, narrowing or widening
      the standing citation prohibition, which clause_4's own
      relation_to_the_standing_citation_prohibition denies.

  # =======================================================================
  w_1_merits_attack:
    preamble: >-
      A SUBSTANTIVE attack on the adopted RT-4 ruling, performed as the enacting
      batch's producer is required to do. One real counterfactual, and where it
      bites. This is not ceremony: a ruling that cannot name what would have
      changed it is a restatement wearing a ruling's header.
    the_counterfactual: >-
      The ruling's load-bearing anchor R2 turns on the DISJUNCTION in
      DEC-20260905-3b8e94's RT-4 disposition - "Two lines of redraft, OR an
      explicit ruling in the enacting decision that the provisos travel." Had
      that sentence instead named ONE sufficient disposition and named a
      relocation - for example "the provisos must be carried AND the analysis
      relocated out of the coordination directory before the contract may point
      at it" - then two lines of carrying would not have answered RT-4, the
      redraft's repair would be incomplete on the routing decision's own terms,
      and POSITION 2 (RT-4 not discharged; no pointer into a coordination
      directory survives in contract text) would follow directly.
    where_it_bites: >-
      It bites at R1 and R2. R1 reads RT-4's scope off its SUGGESTED REPAIR
      ("carry the two provisos into clause_4's own text; it is about two lines")
      rather than off its FINDING SENTENCE, which has two clauses joined by
      "and" and closes by calling the structure "the identical structural
      weakness the draft itself flags for clause_2's incorporation by
      reference, unflagged here" - a structural objection to pointer-borne
      contract content that survives moving the provisos. R2 turns on the word
      "or"; change the disjunction to a conjunction-plus-relocation and the
      ruling changes.
    honest_assessment: >-
      ON THE COMMITTED BYTES the disjunction is present, and R4's check (I
      opened analysis.licensing and found no condition on the licence that
      clause_4's own text does not carry) supports the discharge, so the ruling
      STANDS. The attack does not land on the committed bytes. It is recorded
      here as the STANDING MERITS ATTACK SURFACE: a successor that finds the
      finding-sentence reading is the centre of gravity, or that locates a
      condition in the pointed-to analysis that clause_4 does not carry, has a
      named route to POSITION 2 without re-deriving the question.

  # =======================================================================
  companion_enacted_unaltered:
    record: coordination/goals/GOAL-SSI-001/batches/BATCH-5e4996/tasks/TASK-20260909-8b3cce/companion_record_package.yaml
    enacted: UNALTERED, in the same decision as this one
    form: separate record (per na_2_i resolution of the `travels with` limb)
    carries:
      - the output-path repair (no invocation writes into a committed run directory, with or without WESOVOW_RAW_PATH set)
      - the serialization change implementing clause_3 at the per-field emission site
      - the reachability status emission implementing clause_4
      - explicitly NO run authorization (a further, separate Coordinator decision)
    verification: inspection of the diff and re-parse of the contract; never execution of cost_model.py
    if_any_change_needed: STOP and report; do not enact a changed companion under this decision

  # =======================================================================
  citation_prohibition:
    retained_verbatim: >-
      The `P=512` crossover value and its `w=2^80` sign are **NOT
      citation-eligible**. This task does not lift that prohibition. Only a
      committed Coordinator decision on independently reviewed evidence can lift
      it.
    predicate_extension_verbatim: >-
      In addition to the retained sentence, a row of any EXP-WESOVOW-001
      reconciliation is NOT citation-eligible when either (a) the two anchors
      disagree in the SIGN of the baseline comparison at that row, or (b) the
      smaller |margin| across the two anchors at that row is below that field
      size's anchor gap |Delta log2 T_full + Delta log2 M / 2|.
    status: RETAINED IN FULL, BOTH LIMBS. NOT LIFTED, NOT NARROWED, NOT WIDENED.
    reasoning_for_this_round: >-
      Restated rather than inherited, per the round discipline. Nothing in this
      decision rests on independently reviewed evidence bearing on the
      prohibited values; the enacting act adds clause_4's own citation
      foreclosure over exactly the class of quantity the standing prohibition
      governs, which is a reason to retain, not lift, the prohibition in the
      same period the governing contract is amended to add one.

  # =======================================================================
  exactly_six_items_nothing_beyond: >-
    This decision resolves EXACTLY the six NA-2 items and nothing beyond. It
    does NOT resolve, and leaves to successor records: AF-5, AF-6, AF-7, F-J1-1,
    F-J3-1, F-J3-2, F-J4-1, A4-1's recommendation, CF-25, CF-26, CF-7's
    remainder, CF-8, CF-13, CF-14, CF-24's residue, CF-28, CF-29, CF-30, and any
    other reserved item. The precondition set does not grow.

  asserts_nothing_about: >-
    any isogeny problem, the mathematics of EXP-WESOVOW-001, the rightness of
    the incorporated law as a model of the vOW middle-memory regime, or any
    hypothesis. It is a coordination act on the order of two artifacts, resting
    on committed records, and it moves no status.
