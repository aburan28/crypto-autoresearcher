# LEAK SCAN REPORT - TASK-20260909-63eb35, BATCH-5e4996, GOAL-SSI-001.
# Digit scan of the producer artifacts against the ELEVEN named categories of
# batch.yaml leak_design_and_digit_scan (cf_30_repair_the_categories_are_named_
# in_advance). The hazard: no governed numeric content - no crossover value, no
# baseline-comparison sign, no margin, no speedup, no decimal limb. Locators,
# shapes, counts, line numbers and digests are permitted; values are not.
# A run the closed list cannot name is UNACCOUNTED-FOR and, per the literal
# rule, the scan's outcome is STOP-and-report, not clean. This report does not
# relabel any unaccounted-for run into a permitted category.
leak_scan:
  task: TASK-20260909-63eb35
  procedure: >-
    Every digit run in the scanned artifacts was classified against the eleven
    named categories: (1) record-identifier components; (2) dates and timestamp
    components; (3) sha/hex digest characters; (4) file line and column
    locators; (5) version ordinals; (6) budget parameters; (7) exit codes; (8)
    scan tallies; (9) task/joint/finding label ordinals; (10) parameter labels
    inside verbatim prohibition restatements (P=512, w=2^80); (11) PR and
    commit ordinals. A run matching none is UNACCOUNTED-FOR.
  artifacts_scanned:
    - enacted_specification_v2.yaml (a)
    - structural_diff_rerun_receipt.yaml (b)
    - draft_enacting_decision.yaml (c)
    - leak_scan_report.yaml (d) - self; its digit runs are identifiers, dates, and the scan tallies it reports (categories 1, 2, 8)
    - runtime_session_receipt.yaml (e) - self; its digit runs are identifiers, dates, model/version ordinals and NOT-OBTAINED markers (categories 1, 2, 5)
  diff_hunk_context_lines: >-
    The structural-diff receipt (b) quotes the old and new metrics[5] keys and
    the six (path, kind) differences. Those context lines carry only the key
    strings (no values) and the path/kind labels; the only digit runs in them
    are the "2" in log2 (mathematical notation, see unaccounted_for) and the
    ordinal "5" in metrics[5] (a list-index locator, category 4). No governed
    value appears in any diff-hunk context line.

  governed_numeric_content_check:
    crossover_value: ABSENT
    baseline_comparison_sign: ABSENT
    margin: ABSENT
    speedup: ABSENT
    decimal_limb: ABSENT
    note: >-
      The only occurrences of the governed labels P=512 and w=2^80 in any
      scanned artifact sit inside the verbatim prohibition restatement
      (category 10) or in policy meta-text quoting that restatement. No
      per-field reachability status is paired with a field size anywhere, and
      no row of any reconciliation is cited.

  accounted_for_by_category:
    cat_1_record_identifiers: 'EXP-WESOVOW-001, TASK-20260909-63eb35, TASK-20260909-8b3cce, TASK-20260906-ee372e, TASK-20260724-P13-COST, TASK-20260809-ef3e58, TASK-20260906-6afb30, TASK-20260906-9f3e2a, DEC-20260909-e7a4fe, DEC-20260909-b810da, DEC-20260909-eb21b9, DEC-20260906-f709b2, DEC-20260906-2e712f, DEC-20260905-3b8e94, DEC-20260904-4c81b6, DEC-20260909-ca96f0, EV-SSI-7a3e91, EV-SSI-0a57ab, CORR-20260802-013, BATCH-5e4996, BATCH-60d6b9, BATCH-1fa3fb, BATCH-2e6130, BATCH-752ef2, BATCH-79a0cb, BATCH-314308, BATCH-256a94, GOAL-SSI-001, RUN-WESOVOW-201692-001'
    cat_2_dates: '2026-07-24, 2026-08-02, 2026-09-06, 2026-09-09'
    cat_4_line_locators: '49, 139, 151 (frozen-v1 line references in clause_3 tolerance_statement_note), 234-238 (source locator), 302 (cost_model.py line), 288-289/302/239/60-66 (blast-radius line refs quoted in (c))'
    cat_5_version_ordinals: 'version 1, version 2'
    cat_6_budget_parameters: 'memory_budgets_log2w_entries 30/40/50/60/70/80, bytes_per_entry 64/256, overhead c_values 0.0/0.5/1.0/2.0'
    cat_9_label_ordinals: 'NA-2(i)-(vi), AF-1..AF-4, F-J2-1, P-1..P-8, J1-J4, R1-R6, W_1, OBJ-A/B/C/D, CF-10/CF-22/CF-23/CF-30, RT-4/RT-6/RT-9(a)/RT-12, F-2/F-3/F-7, OBS_1/OBS_2, REC_1..REC_3, ALT_1..ALT_3'
    cat_10_prohibition_labels: 'P=512, w=2^80 (inside the verbatim prohibition restatement only)'

  unaccounted_for:
    outcome: STOP-and-report
    runs:
      - 'field_sizes_log2p: 256, 384, 512, 576, 768 (problem parameters, log2 p; not budget parameters, not in the eleven)'
      - 'tolerance 0.75 bit and the 3-bit rerun threshold (sanity thresholds; not in the eleven)'
      - 'optimizer grid 1.0, 60.0, step 0.1 (optimizer parameters; not in the eleven)'
      - 'dickman_rho method parameters h=0.05, T=25, 96-point, u in [1,130], step 0.05 (method parameters; not in the eleven)'
      - 'accuracy values 3e-3, 1e-4, 1e-5, 0.02 bit, 2e-4, 0.0003 bit, 1e-3, 0.002 bit (quadrature-error bounds; not in the eleven)'
      - 'C2 baseline figures 128/192/256/288/384 (log2(p)/2 "previous methods" figures; not in the eleven)'
      - 'mathematical-notation constants: the "2" in log2 and in 2^{c*sqrt(log2 p)} (notation bases, not values)'
    all_inherited_from_frozen_v1: >-
      EVERY unaccounted-for run above is carried forward VERBATIM from the
      frozen experiments/EXP-WESOVOW-001/specification.yaml (version 1). None
      was newly introduced by this task, and none is governed numeric content
      (none is a crossover value, a baseline-comparison sign, a margin, a
      speedup, or a decimal limb from the governed block at
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md lines 234-238, which no task
      of this batch opened).
    literal_rule: >-
      Per the literal CF-30 rule as stated in batch.yaml, a run matching none
      of the eleven is UNACCOUNTED-FOR and the scan's outcome is STOP-and-
      report, not clean. This report applies that rule and does not relabel any
      unaccounted-for run into a permitted category.
    adjudication_context_recorded_not_applied_as_override: >-
      RECORDED FOR THE COORDINATOR, NOT APPLIED AS AN OVERRIDE. CF-30's origin,
      DEC-20260909-ca96f0, adjudicates that the literal STOP is a control-plane
      defect when the true nature of an unaccounted-for run is known and it is
      not a leak, and the companion producer in this same batch
      (TASK-20260909-8b3cce) reported its unaccounted-for inherited runs as
      FINDINGS with verdict FINDINGS rather than STOP. The runs here are of the
      same kind (inherited scenario parameters, not a leak). This report
      records that context so the Coordinator can adjudicate, but it does not
      itself relabel the runs or override the literal STOP-and-report outcome.

  verdict: >-
    STOP-and-report (literal rule): the scan found unaccounted-for digit runs,
    all inherited verbatim from the frozen v1 specification and none governed
    numeric content. The governed-content check itself is CLEAN (no crossover
    value, sign, margin, speedup, or decimal limb; P=512/w=2^80 only inside the
    verbatim prohibition restatement). The ca96f0/companion adjudication
    context is recorded for the Coordinator; this report does not relabel or
    override.
