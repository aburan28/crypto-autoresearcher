          "path: experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-201692-001/", each
          "Immutable and not re-scored"). cf_10_raw_path_placement names only
          RUN-WESOVOW-201692-001; RUN-WESOVOW-001 is named by blast_radius.
      - detail: the new default directory name RUN-WESOVOW-201692-002
        classification: EXECUTOR_CHOSEN
        reason: >-
          The redraft mandates that the default path not name a committed run
          directory but does not name the replacement directory. I chose the next
          run in the existing series (RUN-WESOVOW-201692-002, following
          RUN-WESOVOW-201692-001) as the minimal faithful option: a new,
          uncommitted run directory in the same series, so the default case points
          at a valid, non-committed location rather than tripping the guard.
        flagged_for_reviewer: true
      - detail: the guard function _assert_not_in_committed_run_dir and its call at the write site
        classification: EXECUTOR_CHOSEN
        reason: >-
          The redraft mandates the PROPERTY (no invocation writes into a committed
          run directory) but not the MECHANISM. I chose a guard that raises
          RuntimeError if the resolved write path equals or is under a committed
          run directory, called immediately before the write. This is the minimal
          mechanism that enforces the property for the WESOVOW_RAW_PATH-set case
          (which the default-path change alone cannot cover, since the env var is
          user-controlled). The guard is scoped to the two committed run
          directories named by the redraft; if a future run is committed, the list
          must be extended (a limitation, not a defect of this change).
        flagged_for_reviewer: true
    inspection_only_verification: >-
