  id: BATCH-5e4996
  goal_id: GOAL-SSI-001
  question_ids:
    - RQ-SSI-001
  title: >-
    THE ENACTING BATCH - produce the companion record first (P-6's accepted
    consequence), then the enactment act package, review the ACT independently
    (P-5), and ONLY THEN commit the enacting decision that moves
    EXP-WESOVOW-001 to version 2 and enacts the companion in the same decision.
  status: ready_for_dispatch
  opened_under_next_action: >-
    Quoted from the committed GOAL-SSI-001 head (ledger/goals/GOAL-SSI-001/goal.yaml,
    single next_action as replaced by the BATCH-1fa3fb ledger archive): "THE
    ENACTING BATCH, AND ONLY WHEN ITS NAMED PRECONDITION SET IS MET - UPDATED BY
    BATCH-1fa3fb ONLY BY WHICH PRECONDITIONS NOW EXIST. ... PRECONDITION STATUS
    under the named set of DEC-20260906-f709b2 NA-1 - THE SET MAY NOT GROW ...
    P-1 SATISFIED ...; P-2 SATISFIED; P-3 SATISFIED; P-6 NOT YET SATISFIED - a
    committed position on whether the companion record's EXISTENCE gates
    enactment must exist BEFORE the enacting batch's producer runs; P-4, P-5,
    P-7 and P-8 remain properties OF THE ENACTING BATCH ITSELF ..."
  opened_under_next_action_how_it_was_obtained: >-
    THIS AUTHORING SESSION HOLDS A SHELL AND READ THE COMMITTED HEAD DIRECTLY at
    origin/main plus the P-6 position DEC-20260909-eb21b9 committed on this
    branch (commit a3dc29183f, PR #1069), which SATISFIES P-6. The set has not
    grown: P-6 was already named in it, and satisfying a named precondition is
    not adding one.

  # =======================================================================
  what_this_batch_is_and_what_it_is_not:
    opening_it_is_not_approving: >-
      STATED FIRST. THIS CONTROL PLANE APPROVES NOTHING. It does not enact the
      amendment, does not enact the companion, performs no version transition,
      and does not promise that any future decision will enact. The enactment
      exists ONLY when DEC-20260909-e7a4fe is committed at the ledger archive
      after a PASS review, and a FAIL on any joint returns the batch to the
      Coordinator with NO enactment.
    what_it_is: >-
      FIVE TASKS, STRICTLY SERIAL: (1) the companion record package (P-6's
      accepted consequence - it exists FIRST); (2) the enactment act package -
      the enacted specification.yaml version 2 text, its sha256, the committed
      structural diff RE-RUN against it (P-7), and the draft enacting decision
      resolving the six NA-2 items in its own text with the W_1 merits attack on
      the adopted RT-4 ruling recorded; (3) one snapshot archive binding both
      packages before any reviewer reads them; (4) the independent review of the
      ACT (P-5) on joints J1-J5; (5) the ledger archive committing the enacting
      decision, the evidence record, the checkpoint, the goal-head edit, and -
      as the declared effect of the decision, never before it - the enacted
      amendment targets.
    why_this_and_why_now: >-
      THE PRECONDITION SET IS MET. P-1/P-2/P-3 are durable on main (PR #1057
      merged, archive commit 2e5754a6da57da9960b833c27badfe7dc2b5b75f, merge
      commit 2b2b740a31fcf75c17fa8f7d928c7275c3ee314c, verified an ancestor of
      this branch base); P-6 is satisfied by DEC-20260909-eb21b9 on this branch.
      P-4, P-5, P-7 and P-8 are THIS batch's own properties and are discharged
      here or the enactment does not happen.
    ranking_statement_required_by_the_unlimited_ecc_budget: >-
      GOAL-SSI-001 is an ECC goal (SSI is in the declared ECC area set at
      orchestration/research-priority.yaml, read through tools/ecc_priority.py,
      never inferred from the identifier). This batch is ranked ahead of doing
      nothing because it is the goal's own recorded single next research action,
      its precondition set is now met, and it either enacts a contract repair
      under full review or produces a recorded, reviewed refusal - both complete
      outcomes. It is ranked ahead of the portfolio's other offers: the
      batch-complete non-ECC goals awaiting checkpoints are lower priority under
      ECC-first; the needs-repair ECC goals carry stale archive-hash mismatches
      belonging to their own lanes' repair tasks; the blocked ECC goals are
      gated or claimed. No other ECC goal offers a ranked, justified, unowned
      task this session can start.

  # =======================================================================
  precondition_discharge_map:
    P-4: >-
      DISCHARGED HERE BY TASK-20260909-63eb35 AND REVIEWED AT J2: the six NA-2
      items resolved in the enacting decision's OWN TEXT - (i) CF-10's RAW_PATH
      placement WITH the `travels with` authority limb RULED (same ACTION and
      same decision is settled by P-6's consequence; the SAME-RECORD-vs-SEPARATE-
      RECORD question is ruled in the act, not here), the red team's companion
