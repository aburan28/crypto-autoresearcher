    basis: >-
      The escalation rule fires for a claimed breakthrough, a closure result, or
      a contradiction between validated evidence records. This act is NONE of
      the three: it repairs a contract that cannot be satisfied as written,
      enacts the code companion that makes a conforming implementation exist,
