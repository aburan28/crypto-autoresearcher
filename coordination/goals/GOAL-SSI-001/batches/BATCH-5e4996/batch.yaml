  entailed_control_analysis:
    why_this_block_is_here: >-
      This campaign has repeatedly found checks whose outcome was entailed by
      their own construction (CF-28's lineage). Named here, before dispatch, so
      the reviewer can tell a real control from a ceremony.
    the_real_controls_of_this_batch: >-
      The P-7 structural-diff re-run CAN FAIL (the enacted text can differ from
      the redraft's declared effect); the companion inspection CAN FAIL (a
      change can be missing, misplaced, or over-reaching); the review CAN return
      FAIL on any joint and then there is NO enactment. None of these is
