    predicate_extension_verbatim: >-
      In addition to the retained sentence, a row of any EXP-WESOVOW-001
      reconciliation is NOT citation-eligible when either (a) the two anchors
      disagree in the SIGN of the baseline comparison at that row, or (b) the
      smaller |margin| across the two anchors at that row is below that field
      size's anchor gap |Delta log2 T_full + Delta log2 M / 2|.
    machine_flag_status: >-
      The committed machine-readable flag under-reports and MUST NOT BE EDITED.
      No task of this batch touches it.
    application_to_this_batch: >-
      REASONED, NOT ASSUMED. The act package authors contract text and code
      changes; neither may carry the prohibited values, the crossover, any
      baseline-comparison sign, margin or speedup, or any decimal limb of the
      governed block. Parameter LABELS (P=512, w=2^80) appear only inside the
