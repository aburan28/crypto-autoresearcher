    the_named_entailed_control_objects:
      OBJ-A: >-
        NEGATIVE CONTROL ON P-7, RUN BY THE REVIEWER: the committed structural
        diff re-run against the UNAMENDED version-1 specification.yaml MUST
        report failure or a non-conforming difference set. If it passes on the
