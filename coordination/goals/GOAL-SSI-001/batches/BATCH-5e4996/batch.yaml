    the_rule_for_every_producer_artifact: >-
      NO governed numeric content, no crossover value, no baseline-comparison
      sign, no margin, no speedup, no decimal limb. Locators, shapes, counts,
      line numbers and digests are permitted; values are not.
    cf_30_repair_the_categories_are_named_in_advance: >-
      Per CF-30 (origin DEC-20260909-ca96f0, confirmed by the BATCH-1fa3fb
      reviewer), each producer's digit scan classifies every digit run against
      THIS NAMED CLOSED LIST, and a run the list cannot name is reported as
      UNACCOUNTED-FOR - which is a finding, never silently relabelled: (1)
      record-identifier components; (2) dates and timestamp components; (3)
      sha/hex digest characters; (4) file line and column locators; (5) version
      ordinals; (6) budget parameters; (7) exit codes; (8) scan tallies; (9)
      task/joint/finding label ordinals (P-6, J2, AF-4 shapes); (10) parameter
      labels inside verbatim prohibition restatements (P=512, w=2^80); (11) PR
      and commit ordinals. A run matching none of the eleven is UNACCOUNTED-FOR
      and the scan's outcome is STOP-and-report, not clean.
    positive_control: >-
      OBJ-C below. A scan that cannot fire on a planted governed-shape token in
      a scratch object asserts nothing.

