# CONTROL PLANE OF THE ENACTING BATCH. Opening a batch approves NOTHING in it.
# The enactment is performed ONLY by the committed decision DEC-20260909-e7a4fe
# at the ledger archive, AFTER the independent review of P-5, and NOT BEFORE.
