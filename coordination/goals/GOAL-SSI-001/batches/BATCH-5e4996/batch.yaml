      OBJ-B: >-
        NEGATIVE CONTROL ON THE COMPANION CHECKLIST, RUN BY THE REVIEWER: a
        scratch companion draft MISSING ONE of the three required changes (built
        in the reviewer's own scratch, never committed) MUST be caught by the
        reviewer's own completeness checklist. If it is not, the checklist is
        vacuous and J3 is FAIL.
      OBJ-C: >-
        POSITIVE CONTROL ON THE DIGIT SCAN, RUN BY THE REVIEWER: a scratch text
        carrying a planted governed-shape decimal token MUST be flagged by the
        same scan procedure the producers used. If it is not, the scans assert
        nothing and J5 is FAIL.
    both_directions_are_required: >-
      A procedure that fails everything is as vacuous as one that passes
      everything; each object above is paired with the producer's real artifact
      on which the same procedure must behave as declared.
    cf_28_candidate_recorded: >-
      CF-28's sixth entailed-control object - a committed record proposing a
      REAL, APPLICABLE act on a DIFFERENT artifact - is a CANDIDATE FOR
      DISCHARGE BY THIS BATCH'S OWN ACT PACKAGE: the draft enacting decision
