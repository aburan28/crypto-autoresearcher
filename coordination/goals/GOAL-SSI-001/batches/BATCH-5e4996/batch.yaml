      impediment is recorded. Substituting a lower tier is the silent downgrade
      the policy layer forbids. The reviewer checks this at J4 and a discovered
      escalating limb is a FAIL, not a note.
    producer_tiers: >-
      T1 companion producer: executor-implementation, role executor - its
      product is a recorded specification of changes, not a verdict. T2 act
