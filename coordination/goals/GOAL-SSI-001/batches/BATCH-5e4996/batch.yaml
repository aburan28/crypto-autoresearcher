  # =======================================================================
  review_routing_determination:
    determination: >-
      THE ACT NEEDS review-adversarial AT xhigh IN AN INDEPENDENT SESSION, AND
      NOT review-breakthrough. THIS IS THE ENACTING BATCH'S OWN ROUTING
      DETERMINATION, MADE AND RECORDED BEFORE ANY PRODUCER RUNS, as P-5
