# REVIEW PLAN OF BATCH-5e4996 - WRITTEN AND COMMITTED BEFORE ANY PRODUCER RUNS.
# The Coordinator's prior is recorded here FIRST. A prior the round overturns is
# among the most valuable results this programme can produce and is worthless if
# softened afterwards.
review_plan:
  batch_id: BATCH-5e4996
  goal_id: GOAL-SSI-001
  review_task_id: TASK-20260909-34c1cf
  written_by: coordinator
  written_at: '2026-09-09'
  written_before_any_producer_ran: 'TRUE AND CHECKABLE: this file is committed with the control plane and the opening
    decision, and the first producer task is dispatch-eligible only after that commit. The git history is the proof.'
  the_claim_under_review: 'NOT A MATHEMATICAL CLAIM. The object reviewed is an ACT PACKAGE: the enacted version-2
    contract text with its P-7 binding, the companion record package with its exact amended cost_model.py content,
    and the draft enacting decision DEC-20260909-e7a4fe resolving the six NA-2 items. The review question is whether
    that package, if committed as-is, would perform exactly the enactment it declares - no more, no less, nothing
    unreviewed smuggled in - and whether anything in it escalates the review tier.'
  reviewer_shape:
    count: 1
    role: validator
    policy: review-adversarial at xhigh
    independent_session: REQUIRED - a session that did not compose any package.
    blindness:
      lifted_for: 'THE REVIEWER, BY NAME AND DELIBERATELY: it reads both producer packages, both leak scans, the
        redraft, the adopted RT-4 ruling, DEC-20260906-f709b2 NA-1/NA-2, DEC-20260909-eb21b9, and this plan, because
        reviewing an act against its reserved-item authority requires the whole declared context.'
      lifted_against_whom: There is no sibling reviewer in this round; the lift is against the producers' reports
        only in the sense declared at blind_rederivation below. The round is SESSION-INDEPENDENT AND NOT MODEL-INDEPENDENT,
        stated in advance, as every round of this campaign has done since PD-8.
      containment_note: 'The two producers are NOT separated from each other by design this round: the act producer
        reads the companion package (it must, to enact both in one decision). The protection that replaces separation
        is ORDER plus SNAPSHOT plus REVIEW: the companion is complete and frozen before the act drafts, both are
        frozen again at the snapshot before the reviewer reads, and the reviewer checks at J3 whether the act''s
        treatment of the companion altered it - an alteration is a FAIL.'
  joints:
  - joint: J1
    assigned_to: TASK-20260909-34c1cf
    attack_plan: 'RE-RUN BOTH: hash the enacted artifact yourself and re-run coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/reviews/TASK-20260906-ba0284/
      independent_parse_check.py against it, BEFORE reading the producer''s recorded results (see blind_rederivation).
      Then run OBJ-A: the same re-run against the UNAMENDED version-1 specification.yaml must FAIL or report a non-conforming
      set; if it passes on v1, the check is vacuous and this joint is FAIL. Compare clause-by-clause against the
      redraft''s declared text; a clause applied approximately, reordered, or with an added effect is a FAIL.'
    question: 'Does the enacted specification.yaml version-2 text apply EXACTLY the declared effect - the four clauses
      plus the AF-1/AF-2/AF-3 corrections - and does the P-7 binding hold: sha256 recorded, the committed structural
      diff RE-RUN against the ENACTED artifact reporting exactly the declared difference set?'
    where_i_think_it_breaks: At the seam between clause_2's incorporated-law pointer and AF-3's transitive pointer
      correction - two edits to the same referencing machinery, the likeliest place for an undeclared extra difference
      to hide in a large diff.
  - joint: J2
    assigned_to: TASK-20260909-34c1cf
    attack_plan: 'Item-by-item against DEC-20260906-f709b2 NA-2''s restatement: (i) CF-10 placement WITH the `travels
      with` same-record-vs-separate-record limb RULED and the red team''s preference recorded as a recommendation;
      (ii) F-7 scoped to the frozen transcript in the same sentence, external limb cited separately and only for
      the ten values; (iii) F-2/F-3 by successor record with CF-22, never superseding an immutable artifact; (iv)
      RT-6, RT-9(a), RT-12; (v) RT-4 licensing on the adopted ruling with the W_1 merits attack present and real;
      (vi) AF-1 version transition declared, AF-2 prerequisite mislabel corrected, AF-3 transitive pointer with
      its pre-enactment check, AF-4 interval ruling, F-J2-1 naming. THEN ATTACK THE OTHER DIRECTION: any ruling
      the decision makes that is NOT reserved to it - a claim promotion, a prohibition lift, a hypothesis or goal
      status touch, a run authorization - is over-reach and this joint is FAIL. A W_1 attack that is ceremonial
      (no named counterfactual, no cited anchor) is FAIL: the ruling was adopted with its merits attacked by nobody,
      and this is the round that owes the attack.'
    question: Does the draft enacting decision resolve ALL SIX NA-2 items in its own text, each within its reserved
      authority - and nothing beyond them?
    where_i_think_it_breaks: 'At (iii): the temptation to carry CF-25/CF-26 by editing an immutable artifact instead
      of the successor-record route the act itself declares.'
  - joint: J3
    assigned_to: TASK-20260909-34c1cf
    attack_plan: 'Diff amended_cost_model_content.py against the committed experiments/EXP-WESOVOW-001/cost_model.py
      yourself and classify EVERY hunk: each must map to one of the three named changes; a fourth hunk is FAIL.
      Check the emission site is the per-field site, not a summary site. Check NO execution was performed (the producer''s
      receipt and the absence of any new artifact under runs/). Run OBJ-B: build a scratch companion draft missing
      one change and confirm your own checklist catches it; if it does not, the checklist is vacuous and this joint
      is FAIL. Then verify the act enacts the companion UNALTERED - any edit between the snapshot and the act''s
      treatment is a FAIL.'
    question: Does the companion package carry EXACTLY the three changes the redraft's what_the_companion_record_should_carry
      names - output-path repair, clause_3 serialization at the per-field emission site (cost_model.py line 302),
      clause_4 reachability status emission - with explicitly NO run authorization, verifiable by inspection alone,
      and does the act's treatment of the companion ALTER it?
    where_i_think_it_breaks: 'At the output-path repair: a repair that only handles the WESOVOW_RAW_PATH-set case
      and leaves the default-path invocation able to write into the committed run directory would pass a casual
      reading and defeat CF-10''s whole purpose.'
  - joint: J4
    assigned_to: TASK-20260909-34c1cf
    attack_plan: 'Read the draft enacting decision against the routing determination''s escalation clause in batch.yaml
      and the opening decision. Search specifically for: any sentence reading the reconciliation as evidence for
      or against the paper''s asymptotic claim; any closure of the amendment question beyond the act; any statement
      contradicting BATCH-256a94''s corrected record or any validated evidence record; any run authorization. A
      discovered escalating limb is a FAIL, never a note. Then verify OBJ-A/OBJ-B/OBJ-C were run by YOU (not cited
      from the producer) and behaved as declared, and that each real control (the P-7 re-run, the companion checklist,
      the scans) failed-or-passed on the real artifacts consistently with its behaviour on the null objects.'
    question: 'TIER COMPLIANCE AND ENTAILMENT: does any limb of the act package propose a breakthrough claim, a
      closure result, or a contradiction between validated evidence records - which would escalate the tier to review-breakthrough
      at max, unservable here, and stop the enactment? And do the controls of this round behave as declared in BOTH
      directions?'
    where_i_think_it_breaks: 'Nowhere I can name in advance on the tier question - the act was scoped for eight
      rounds away from claim territory; the honest prior is below. The realistic break is a ceremony: a control
      run only on the real artifact and never on its null object.'
  - joint: J5
    assigned_to: TASK-20260909-34c1cf
    attack_plan: 'RE-SCAN all nine producer artifacts yourself with the eleven-category classification named in
      batch.yaml. Run OBJ-C: plant a governed-shape decimal token in a scratch text and confirm the scan procedure
      flags it; if it does not, the scans assert nothing and this joint is FAIL. Check the prohibition''s two limbs
      appear VERBATIM in the draft decision and that no lift is performed or implied. Verify runs/ is untouched
      and inputs/ was never opened (receipts plus the absence of any artifact betraying a read). A parameter label
      (P=512, w=2^80) outside a verbatim prohibition restatement is a FAIL.'
    question: 'LEAK AND CITATION DISCIPLINE: is the package free of governed numeric content - the prohibited values,
      any crossover, any baseline-comparison sign, margin, speedup, decimal limb - with the prohibition retained
      verbatim in the draft decision, no write under inputs/, no execution of cost_model.py, zero runs, and both
      producers'' digit scans classified against the ELEVEN NAMED CATEGORIES with every unnameable run reported
      UNACCOUNTED-FOR rather than relabelled?'
    where_i_think_it_breaks: 'In the structural-diff receipt: a diff hunk quoting specification.yaml context lines
      could carry a numeric constant from the reconciliation section into a coordination artifact nobody scans.'
  coordinator_prior:
    recording_rule: RECORDED BEFORE ANY PRODUCER RAN, element by element, with the losses first when compared later.
      These are the Coordinator's honest degrees of belief at control-plane authoring, not aspirations.
    element_1_the_package_comes_back_complete: ~0.7 that both producer packages return complete against their declared
      artifact sets on the first attempt. The shapes are fully specified and the predecessor round's producers all
      returned complete; the residual 0.3 is the act package's sheer size - a draft decision resolving six reserved
      items in its own text is the largest single artifact this campaign has asked one producer for.
    element_2_p7_holds_on_first_run: '~0.55 that the producer''s structural-diff re-run against the enacted artifact
      reports exactly the declared difference set on the FIRST attempt. This is the round''s genuine uncertainty:
      the enacted text is built by applying a redraft to a live v1 file that has drifted through corrections since
      the redraft was drafted, and a five-difference expectation obtained on a control-built document is exactly
      the thing A4-1/AF-1 warned about. A first-run mismatch is NOT a disaster - it is the control working, and
      the producer iterates inside its task.'
    element_3_the_review_returns_all_holds: '~0.45 that all five joints come back holds with no FAIL. LOWER THAN
      THE PREDECESSOR ROUND''S CLEAN RESULT AND DELIBERATELY SO: this package is bigger, the controls are sharper
      (three named null objects, a blind re-derivation, a real merits attack owed at J2), and a review round whose
      prior is near-certainty of agreement measures the reviewer''s compliance, not the package. A FAIL here is
      a FULL RESULT and the batch''s contracted outcome - NO ENACTMENT, return to the Coordinator - was written
      before dispatch.'
    element_4_the_escalation_clause_never_fires: '~0.9 that no escalating limb is found at J4. The act has been
      scoped away from claim territory for eight consecutive rounds and the prohibition is restated in every record.
      The residual 0.1 is AF-4''s interval ruling: an interval ruling written carelessly could read as a claim about
      what the licence EVIDENCES, and that is the sentence to watch.'
    element_5_a_leak_is_found: '~0.25 that some governed-adjacent numeric content is found in a package artifact
      before the review''s re-scan closes it - concentrated, as named at J5, in diff-hunk context lines. FOUND-BY-CONTROL
      IS THE DESIGNED OUTCOME: the scans, the eleven categories, and OBJ-C exist so that finding it is a STOP-and-report
      rather than a publication. The predecessor round''s clean result with positive controls firing is the bar,
      not an assumption.'
    element_6_the_w1_attack_is_real: ~0.5 that the act producer's W_1 merits attack on the adopted RT-4 ruling is
      substantive on first draft - names a counterfactual that would have changed the ruling and cites where it
      bites. The ruling has now been carried by two rounds with its merits attacked by nobody by design; the first
      producer asked to attack it may produce ceremony instead, and J2 is written to FAIL ceremony.
    element_7_the_enactment_actually_commits_this_batch: '~0.5. The honest composite of elements 1-3 and 6: complete
      packages, a converging P-7, an all-holds review, and a real W_1 attack on the first pass through. If any fails,
      the batch returns to the Coordinator and the enactment waits for a scoped successor - which is a recorded
      outcome, not a stall, and does not pause the goal.'
    what_i_would_not_have_guessed: 'Recorded so the comparison is honest later: I expect the most informative surprise,
      if one comes, to be at J3''s output-path repair - the change everybody will read fastest is the one whose
      failure mode (default-path invocation still writing into the run directory) is the quietest.'
  blind_rederivation:
    quantity: 'THE P-7 RESULTS: the sha256 of the enacted specification artifact and the structural-diff re-run
      output against it.'
    who: TASK-20260909-34c1cf, at J1.
    blind_from:
    - The producer's structural_diff_rerun_receipt.yaml RESULTS SECTION. The reviewer re-runs the committed script
      against the snapshotted artifact FIRST, records its own output, and only then reads the producer's recorded
      results and compares. Agreement is then evidence about the binding; disagreement localises to one of two named
      executions of one committed script - never resolved by preferring either.
    why_this_and_not_a_full_blind_phase: 'This is the strongest blind object this batch has, and it is WEAKER than
      a true blind phase (CF-15''s first limb, owed for a fifth batch and recorded as owed in batch.yaml): the reviewer
      reads the artifact the producer built; it re-derives the MEASUREMENT, not the object. Recorded as weaker rather
      than dressed up.'
    required: true
    assigned_to: TASK-20260909-34c1cf
  procedure_deviations_rule: Departures from this plan go in the review's and the closing decision's procedure_deviations
    - acting before a report returns, reassigning a joint, dropping a control, or lifting blindness beyond what
    is declared here. None is self-documenting; a review protocol silently deviated from is worth less than one
    never declared.
  composed_verdict_rule: The reviewer reports per-joint; the Coordinator composes. A joint with no verdict is uncovered
    and is NEVER assumed to hold. The closing decision records the composition, the prior comparison losses-first
    across all seven elements, and the temptation report (under-weighting a finding that delays the enactment is
    the named danger of this round, with over-weighting a minor observation so the batch looks productive as its
    symmetric partner).
  blindness:
    lifted_for:
    - TASK-20260909-34c1cf
    rationale: 'THE REVIEWER, BY NAME AND DELIBERATELY: it reads both producer packages, both leak scans, the redraft,
      the adopted RT-4 ruling, DEC-20260906-f709b2 NA-1/NA-2, DEC-20260909-eb21b9, and this plan, because reviewing
      an act against its reserved-item authority requires the whole declared context.'
    mirrors: reviewer_shape.blindness, unchanged; this block is the structural form the independence checker reads
  proves_too_much:
    objects:
    - 'OBJ-A - the diff re-run must NOT pass on the unamended v1 contract (known-false: the enacted difference set
      exists)'
    - 'OBJ-B - the companion three-change checklist must CATCH a missing change (known-false: a complete companion)'
    - 'OBJ-C - the digit scan must FLAG a planted governed-shape token (known-false: a clean package)'
    failure_signature: A procedure that still passes where its conclusion is false is wrong somewhere nobody has
      read closely enough yet, and the affected joint is FAIL.
    statement: 'The act package''s verification procedures are run against objects for which the intended verdict
      is KNOWN FALSE, per the review architecture: OBJ-A (the diff re-run must not pass on the unamended v1 contract),
      OBJ-B (the companion checklist must catch a missing change), OBJ-C (the digit scan must flag a planted governed-shape
      token). A procedure that still passes where its conclusion is false is wrong somewhere nobody has read closely
      enough yet, and the affected joint is FAIL.'
    who_runs_them: THE REVIEWER, in its own scratch, never committed, results recorded at J4.
  structural_repair_20260910:
    what: STRUCTURE-ONLY repair of this plan file by the dispatching Coordinator at the ledger archive (TASK-20260909-da8761),
      disclosed under its procedure_deviations_rule and in DEC-20260909-e7a4fe review_composition.
    why: tools/check_review_independence.py reads joints as a LIST of {joint, assigned_to, attack_plan}, proves_too_much.objects/failure_signature,
      top-level blindness.lifted_for/rationale, and blind_rederivation.required/assigned_to/blind_from-as-list.
      This plan was authored with the same content in different shapes (joints as a mapping keyed J1-J5 with owner/question/attack;
      proves_too_much_control; blindness nested in reviewer_shape; blind_from as prose). The checker therefore reported
      the plan empty and the composition gate could not run.
    what_did_not_change: 'EVERY VALUE. Programmatic verification at repair time: each joint question/attack/where_i_think_it_breaks
      text identical and owner==assigned_to for all five joints; all other top-level plan keys byte-identical in
      parsed value; blind_rederivation quantity/who/blind_from text identical; proves statement/who_runs_them identical.
      No joint added, removed, reassigned or reworded; no control dropped; the prior untouched. The round was executed
      under the committed text and the reviewer read the same content in the old shape.'
    the_alternative_considered: Stopping the enactment on a formatting defect. Rejected as disproportionate ONLY
      because the transformation is value-identical and machine-verified here; had any value moved, the gate would
      have stopped the enactment.
