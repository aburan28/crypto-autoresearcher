      cost, are in batch.yaml review_routing_determination.why_one_red_team_and_not_two.

  proves_too_much:
    objects:
      - >-
        SATISFIABLE CONTROL CONTRACT. A synthetic pair of blocks in the shape of
        a metrics line and a control, constructed so that a single charging law
        satisfies both on an open set. `This contract is internally
        unsatisfiable` is KNOWN FALSE for it. An argument - the producer's, the
        first reviewer's, or your own - that returns unsatisfiable here proves too
        much and its verdict on the real contract carries no information.
      - >-
        DEGENERATE WITNESS. The real pair of blocks evaluated at the one point
        where every derivation on the record concedes they are jointly
        satisfiable. `There is no satisfying assignment` is KNOWN FALSE there. An
        argument that reports a contradiction at that point is not reading its own
        derivation.
      - >-
        A CORRECT CONTROL. Apply the amendment's own diagnostic reasoning to
        control C4, and to control C2, which the draft itself says are CORRECT AS
        WRITTEN and which it explicitly does not target. `This block is defective
        and needs superseding` is KNOWN FALSE for them. A diagnostic that finds a
        defect wherever it looks is a diagnostic whose finding about lines 39-40
        carries no information.
      - >-
        A SCANNING CONTROL AGAINST A TEXT THAT SHOULD MAKE IT FIRE. Feed each
        scanning control a text you construct that contains, plainly, the thing
        that control exists to catch - for AC-4 a sentence asserting the
        superseded broader framing, for AC-3 a sentence premising a transcription
        defect. `This text is free of the thing` is KNOWN FALSE for each. A
        control that passes it cannot fail, and its pass on the real draft is
        worth nothing. THIS IS F-1'S DEFECT TURNED INTO A CONTROL, and it must be
        run pattern by pattern, not only on the whole vocabulary, because a
        vocabulary can pass as a whole while one of its patterns is dead.
      - >-
        POSITIVE CONTROL, WHICH IS NOT OPTIONAL. The real contract for the first
        three objects and the real draft for the fourth. A procedure that rejects
        EVERY object has rejected the decoys for no reason and its rejections
        carry no information either. Report what each procedure did on this object
        too.
    failure_signature: >-
      On the first object the argument must return SATISFIABLE. On the second it
      must return SATISFIABLE AT THAT POINT and say so in the same words the real
      derivation uses. On the third it must find NO DEFECT in C2 or C4, and if it
      does find one, that is a break of the diagnostic and not a discovery about
      C2 or C4. On the fourth every scanning control must FIRE, pattern by
      pattern, and a pattern that does not fire is reported by its index with the
      input that should have fired it. On the positive control the procedures must
      behave as the record says they behave. REPORT WHAT EACH PROCEDURE ACTUALLY
      DID ON EACH OBJECT, NOT WHAT IT SHOULD HAVE DONE. A pass where the
      conclusion is known false is a BREAK and is reported as one, never as
      robustness. If a procedure's pass turns out to be entailed by its own
      construction, say so plainly: that disclosure is worth more than the pass
      (DEC-20260904-166ab5 on RG-4; DEC-20260904-4c81b6 F-3).
    assigned_to: TASK-20260905-6d5c9c

  blind_rederivation:
    required: false
    why_not_required: >-
      A DELIBERATE `false`, WITH ITS REASON, AND NOT AN OMISSION. The
      load-bearing quantity of this campaign - the satisfying set of
      specification.yaml:39-40 against control C4, and its degenerate witness -
      HAS ALREADY HAD TWO INDEPENDENT RE-DERIVATIONS ON THE RECORD: BATCH-256a94's
      blind re-derivation, and TASK-20260905-4098fd's, which read the whole 167-line
      file before opening any producer artifact and reached the same satisfying
      set by a route that avoids the producer's step-4 posit. A third
      re-derivation performed BLIND from the producer's artifacts would require
      forbidding this red team to read defect_reproduction.yaml and
      amendment_controls.py - which are precisely the artifacts whose WARRANTS
      (F-2, F-3, F-4 and the F-1 instrument defect) it is assigned to attack at
      R1, R2 and R3. That trade buys a third instance of an answer already held
      twice at the cost of the whole pass.
      WHAT REPLACES IT, AND IT IS WEAKER: the reading-order requirement at R1 and
      in batch.yaml, under which the red team forms and writes its own reading of
      the contract before opening the producer's reproduction, and ATTESTS the
      order. That is an attestation, not a mechanically checkable blind_from list,
      and it is recorded as weaker rather than described as equivalent. No path is
