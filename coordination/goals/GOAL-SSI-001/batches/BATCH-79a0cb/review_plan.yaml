    - joint: R4 whether the amendment does what an amendment must, without widening beyond the defect it repairs
      assigned_to: TASK-20260905-6d5c9c
      attack_plan: >-
        FOUR THINGS AN AMENDMENT MUST DO, THEN THE ONE THING IT MUST NOT.
        (a) THE CATEGORY QUESTION. DEC-20260904-4c81b6 PD-8 adopted a NARROW form
        - for control C1's own declared instrument-sanity purpose the two-sided
