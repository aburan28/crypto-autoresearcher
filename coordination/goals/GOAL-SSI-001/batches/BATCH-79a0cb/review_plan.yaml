  blindness:
    mutual: true
    lifted_for:
      - TASK-20260905-6d5c9c
    rationale: >-
      DELIBERATELY LIFTED, NOT DRIFTED, AND THIS IS THE `later hardening round`
      case AGENTS.md names. The red team is GIVEN
      BATCH-752ef2/reviews/TASK-20260905-4098fd/validation_report.yaml and the
