        two routes and is corroborated twice from outside the file. ATTACK THE
        FRAMING INSTEAD, and attack it from the file's own text. THE SCOPE
        ASSUMPTION IS THE LOAD-BEARING ONE AND IT IS GIVEN TO YOU EXPLICITLY AS AN
        ATTACKABLE OBJECT: the finding requires that the metrics line and control
