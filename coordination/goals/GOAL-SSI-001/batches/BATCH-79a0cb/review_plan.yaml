        TASK-20260905-28c89d/defect_reproduction.yaml, read
        experiments/EXP-WESOVOW-001/specification.yaml yourself - THE WHOLE FILE,
        not the quoted excerpts - and write down your own reading of lines 39-40
        against controls C3 and C4: what each block says, what a single charging
