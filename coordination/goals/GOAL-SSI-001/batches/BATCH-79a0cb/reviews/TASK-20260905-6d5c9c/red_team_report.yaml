r4:
  joint: R4 whether the amendment does what an amendment must, without widening beyond the defect it repairs
  subject_of_the_verdict: >-
    The PACKAGE's claim that the amendment addresses the category question in the
    adopted narrow form, carries no transcription premise, states what an
    `off_curve` anchor licenses, and does not widen beyond the defect it repairs.
  verdict: CONFIRMED WITH CAVEAT

  a_the_category_question:
    verdict: >-
      ADDRESSED IN THE NARROW PD-8 FORM. I read every sentence of the draft and
      the category and licensing blocks of the analysis BY HAND, not only with the
      instrument, because the instrument is under attack at R2.
    what_i_confirmed: >-
      The draft affirms C1's two-sided test as CORRECT FOR C1'S OWN DECLARED
      INSTRUMENT-SANITY PURPOSE, retains C1's four existing lines word for word
      (clause_3 operation is "add two keys alongside the existing four"), and
      names the SERIALIZATION as the operative repair. Nowhere in the draft did I
      find the superseded broader framing asserted.
    exempt_region_hand_audit: >-
      I READ THE NINE LINES MYSELF rather than trusting the scanner that exempts
      them. category_and_licensing_analysis.yaml:181-189, key
      superseded_broad_framing_quoted_for_disclaimer_only. The region announces
      itself as a declared scan-exempt region, states that what follows "is quoted
      solely in order to disclaim it, is recorded as SUPERSEDED by
      DEC-20260904-4c81b6 PD-8, and is NOT asserted anywhere in this package", and
      then gives the superseded sentence INSIDE QUOTATION MARKS. The immediately
      following sibling key repeats the disclaimer outside the exemption. THE
      REGION EXEMPTS A QUOTATION, NOT AN ASSERTION. I found no drifting sentence
      inside it. This is the check the plan asked for and it comes back clean.
  b_no_transcription_premise:
    verdict: >-
      NO TRANSCRIPTION PREMISE IN THE SENSE CONSTRAINT (i) FORBIDS. No clause
      proposes to change, replace or adjust any of the ten source-derived values,
      and none is conditioned on one. I checked by hand and by AC-3, whose eleven
      patterns I had first proved all live.
    the_subtler_form_the_plan_asked_about: >-
      There IS a justification that presupposes something about the values, and it
      is disclosed rather than hidden. constraint_i's answer states "EV-SSI-7a3e91
      established their fidelity to the frozen source ... and this amendment takes
      that as settled and closed", and clause_3's what_the_five_pairs_are - text
      PROPOSED TO BECOME CONTRACT TEXT - characterizes the five pairs as lower
      bounds from a rough underestimation, on a locator the drafting task states
      it did not open. That is a presupposition about a property of the values,
      not about their digits, so it does not breach constraint (i). It does mean
      enactment would write into a frozen contract an assertion about an external
      document that the drafter never read.
    what_the_draft_does_about_it_and_where_it_stops_short: >-
      The draft mitigates it explicitly: "AN ENACTING COORDINATOR SHOULD CONFIRM
      THE LOCATOR AGAINST THE FILE BEFORE ENACTMENT." The mitigation names the
      LOCATOR only. It does not ask the Coordinator to confirm the
      CHARACTERIZATION - the "lower bounds" relation and the "rough
      underestimation" description - which is the part that carries the
      contract-level meaning. SMALLER REPAIR: extend the enactment precondition to
      the characterization, or attribute the characterization inside the contract
      text to DEC-20260904-4c81b6 rather than stating it in the contract's own
      voice. Severity: low. This is RT-9(a).
  c_what_an_off_curve_anchor_licenses:
    is_licenses_C1s_verdict_coherent: >-
      COHERENT BUT WEAKER THAN THE SENTENCE READS, AND I STATE THE BOUNDARY
      CAREFULLY SO NOBODY READS ME AS REVIVING THE SUPERSEDED FRAMING. I am NOT
      saying that applying a two-sided test to one-sided figures is itself the
      defect; PD-8 superseded that and I do not assert it. What I am saying is a
      consequence of clause_4's OWN definition: `off_curve` is defined there as
      the anchor's time lying below the minimum of log2(T_full) attained on the
      declared optimizer grid, so at such a field size the direction of C1's time
      comparison is fixed by the status itself. C1's verdict there is a check on
      the MAGNITUDE of a structurally directed gap rather than a two-sided
      instrument check, and neither the draft nor the analysis says so. The
      analysis comes closest, and guards it well, by requiring the status to be
      reported "in the same breath".
    does_the_licensing_cover_both_kinds_of_field_size_without_transferring_anything: >-
      YES, AND THIS IS THE STRONGEST PART OF THE DRAFT. clause_4 states what
      `reachable` licenses AND that it "licenses nothing about the field sizes
      where the status is `off_curve`"; the analysis additionally forecloses
      reading `reachable` as agreement or as validation. I looked for a transfer
      and found none. I restate no status here.
    the_structural_problem_the_plan_named_and_what_it_costs_the_clause: >-
      The per-field statuses clause_4 is built around were verified by nobody in
      the previous round and could only be recomputed by executing a file this
      batch prohibits absolutely. WHAT IT COSTS: strictly less than it looks. The
      REQUIREMENT - record the status per field size - does not depend on the
      statuses being what anyone thinks they are; it is well formed and harmless
      even if every field size turned out the same. What depends on the unverified
      premise is only the JUSTIFICATION sentence "Because the reported status is
      already known to differ across the declared field sizes". SMALLER REPAIR:
      state the justification hypothetically ("because the status may differ
      across field sizes, and a row that does not carry it invites ...").
      Severity: low. This is RT-9(b).
    a_residual_i_checked_and_cleared: >-
      The status is defined relative to a discretized grid (step 0.1), so it is a
      property of the model PLUS its grid resolution, and a finer grid could move
      it. clause_4 binds the definition to "the optimizer grid declared in
      model_definition.optimizer", which is the correct and honest handling. No
      finding.
    finding_RT_4: >-
      THE LICENSING SUMMARY THAT WOULD BECOME CONTRACT TEXT DROPS BOTH PROVISOS.
      Severity low. The analysis licenses, at an `off_curve` field size,
      "Reporting the anchor as the source's stated lower bound for that field
      size, cited by locator and carrying its relation and unit" and "Comparing
      this model's attained value against it and reporting the signed difference,
      PROVIDED the reachability status is reported in the same breath". clause_4's
      licensing key compresses both into "licenses reporting and comparing the
      anchor as the source's stated lower bound and licenses C1's
      instrument-sanity verdict", dropping the locator/relation/unit condition and
      dropping the same-breath proviso, and incorporates the full statement by a
      pointer into a batch task directory. On enactment the CONTRACT carries the
      unprovisoed sentence while the provisos live only in a coordination
      directory - the identical structural weakness the draft itself flags for
      clause_2's incorporation by reference, unflagged here. SMALLER REPAIR: carry
      the two provisos into clause_4's own text; it is about two lines.

  d_every_change_the_amendment_makes_beyond_the_defect_it_names:
    preamble: >-
      The defect the amendment NAMES is specification.yaml:39-40. Note first a
      distinction the joint's phrasing can blur: clauses 3 and 4 go beyond that
      defect but are ORDERED by DEC-20260904-4c81b6 next_actions[0] limbs (ii) and
      (iii), so they are mandated widening, not unmandated. I enumerate everything
      and mark which is which.
    enumeration:
      - change: clause_1 replaces metrics[5] with a prose description naming the reported quantity and its unit
        required_by_the_defect: YES. This is the repair.
        objection: none to the content. See RT-1 for its FORM.
      - change: clause_1 additionally requires "a feasibility flag recording whether that budget lies at or below log2 M", where the prior text said "capped by M"
        required_by_the_defect: ARGUABLY. It replaces the cap semantics rather than restating them.
        objection: >-
          WITHDRAWN AFTER CHECKING. I suspected a new emission requirement and a
          third non-conformance for cost_model.py. Reading the implementation as
          text shows it ALREADY emits `feasible_at_or_below_M` at
          cost_model.py:289. The requirement codifies existing behaviour. The
          draft's "two ways" blast-radius statement survives this attack.
      - change: clause_2 adds model_definition.vow_charging_law, incorporating the law by reference
        required_by_the_defect: YES, and it is the root-cause form of the repair.
        objection: >-
          None beyond the one the draft itself discloses (a contract pointing into
          a coordination directory rather than into ledger/). I agree with the
          draft's own reviewer_notes on this and add nothing.
      - change: clause_2 adds an invariant that any incorporated law must satisfy C3 and C4
        required_by_the_defect: NOT STRICTLY. The defect is repaired without it.
        objection: >-
          I DO NOT OBJECT. It is the one clause that makes this class of defect
          unwritable again, it is stated as an invariant rather than as a new
          control, and it changes nothing about what the contract computes. This
          is the coordinator_prior's second candidate and I disagree with it,
          which the prior asks me to say.
      - change: clause_2's invariant restates C4 as "T(M) = T_full exactly, BEFORE THE DECLARED OVERHEAD MULTIPLIER"
        required_by_the_defect: NO.
        objection: >-
          RT-6, low severity. C4's own text (spec:149) says "At w = M, vOW time
          must equal T_full exactly (cap check)" and says nothing about the
          overhead multiplier. The qualifier is a real disambiguation - the file
          IS ambiguous about whether C4 binds the loaded or the unloaded time,
          since overhead_scenarios declares the multiplier "on T(w)" - but the
          draft lists C4 under not_targeted_and_explicitly_untouched and calls it
          "unchanged in text", while glossing its meaning inside clause_2. A
          contract that is amended by a gloss on a control declared untouched is
          the small version of the failure this whole amendment exists to prevent.
          SMALLER REPAIR: either state the invariant by bare reference to C3 and
          C4 without the qualifier, or name the qualifier as a clarification of
          C4's scope and list C4 as annotated rather than untouched.
      - change: clause_2 records the `w` name collision without renaming either use
        required_by_the_defect: NO. Disclosure only, no operative effect.
        objection: none. This is the correct handling and it is the convention I hold the draft to at RT-8.
      - change: clause_3 adds anchor_semantics to C1 (what the five pairs are; why the two-sided test is correct; the SERIALIZATION REQUIREMENT; the deviation sign note)
        required_by_the_defect: NO - required by DEC-20260904-4c81b6 next_actions[0] limb (ii). Mandated widening.
        objection: >-
          RT-5, low severity, on the LABEL rather than the content. The draft's
          target block calls this "ADDITIVE ANNOTATION ONLY" while clause_3's own
          text calls the serialization requirement "THE OPERATIVE CLAUSE" and the
          blast radius records that it makes the only existing implementation
          non-conforming. An annotation does not do that. SMALLER REPAIR: rename
          the key, or say "additive in text and operative in effect". Nothing
          substantive turns on it; a later reader skimming the target block will
          mis-size the change.
      - change: clause_4 adds anchor_reachability to C1 (a per-field recording requirement plus the licensing statement)
        required_by_the_defect: NO - required by limb (iii). Mandated widening.
        objection: RT-4 above, on the licensing summary's dropped provisos. I do NOT object to the requirement itself.
      - change: the effect of clause_1 on the implementation's existing reporting behaviour
        required_by_the_defect: incidental
        objection: >-
          RT-7, low severity. Under version 1 the metrics line says "capped by M"
          while cost_model.py:288-289 emits an UNCAPPED value plus a flag - a small
          existing deviation. clause_1 converts that deviation into conformance.
          The draft's blast_radius names two ways the implementation becomes
          non-conforming and does not name this one way in which it becomes
          conforming. The blast radius is presented as complete; it is one item
          short. SMALLER REPAIR: one line in blast_radius.
    on_the_coordinators_advance_candidates: >-
      I AGREE WITH NONE OF THE THREE AS STATED, WHICH THE PRIOR ASKS ME TO SAY
      PLAINLY. Candidate 1, clause_4's reachability requirement: I do not find it
      widening - it is ordered by limb (iii), and its requirement survives even if
      every per-field status is wrong. My objection there is narrower and is about
      the licensing summary's dropped provisos. Candidate 2, clause_2's invariant:
      I actively defend it. Candidate 3, the CF-14 and `w`-collision silence: the
      `w` collision IS recorded, so only CF-14 is silent, and my objection is not
      that it should have been repaired but that the draft has a convention for
      disclosed non-repairs and did not apply it - see RT-8. My own strongest R4
      finding, RT-1, is in clause_1, which no prior element named.

