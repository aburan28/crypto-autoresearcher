r3:
  joint: R3 F-3, and the corrected C3 route the Coordinator adopted
  subject_of_the_verdict: >-
    The PACKAGE's claim, at defect_reproduction scope_audit (C3 entry and
    conclusion) and carried into protocol_amendment_draft
    gating_reproduction.summary_without_restating_it: that control C3 forces the
    same satisfying set INDEPENDENTLY of control C4.
  verdict: REFUTED
  my_own_check_of_the_entailment:
    statement: >-
      C3's second clause is "T(w) must equal T_full for w >= M" (spec:146-147).
      C4 is "At w = M, vOW time must equal T_full exactly" (spec:148-149). The set
      {w : w >= M} contains w = M, and the file has exactly one time function
      (there is no second T(w) anywhere in it), so C3 clause 2 instantiated at
      w = M IS C4. C3b |= C4.
    independence_i_can_claim_here: >-
      I wrote this entailment down in my pre-producer reading, section 3, before I
      opened defect_reproduction.yaml or the first reviewer's report. It is the
      ONE object in this round where my agreement with an existing F-number is
      genuinely independent of the report that raised it. Everything else at R2,
      R3 and R4 was formed after reading that report.
    consequence: >-
      The producer's C3 route is the same inference from a strictly stronger
      premise, not a second source. "the finding does not rest on a single
      control" invites a reader to count one source as two. F-3 is right.
  does_anything_in_the_amendment_depend_on_the_independence_claim:
    answer: >-
      NO CLAUSE DOES. I checked all four. clause_1 references C2 for the baseline;
      clause_2's invariants list C3 and C4 separately, which is a belt-and-braces
      choice and not a dependence on their independence; clause_3 and clause_4
      concern C1 and do not touch it.
    but: >-
      The overstatement IS carried, verbatim in substance, into the draft's
      gating_reproduction.summary_without_restating_it - "It also found that
      control C3 forces the same satisfying set independently of control C4. This
      draft is conditioned on nothing else." That is the sentence an enacting
      decision would quote as the draft's warrant. The repair is one sentence and
      it is a redraft item, not a caveat item.

  finding_RT_2:
    id: RT-2
    severity: moderate
    what: >-
      THE CORRECTED ROUTE THE COORDINATOR ADOPTED IS MISSING TWO PREMISES, AND AS
      RECORDED IT REPORTS A CONTRADICTION ON TWO OBJECTS OF THIS BATCH'S OWN
      PROVES-TOO-MUCH CONTROL. Its conclusion survives repair; its stated
      derivation does not stand as written.
    target:
      - ledger/decisions/DEC-20260905-5f5592.yaml, rationale, the item beginning "F-3'S OVERSTATEMENT IS CORRECTED ON THE RECORD RATHER THAN INHERITED"
      - ledger/evidence/EV-SSI-2aaf6f.yaml, OBS-11
      - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/reviews/TASK-20260905-4098fd/validation_report.yaml, F-3, key what_C3_DOES_add_that_the_package_did_not_record
    the_claim_as_recorded: >-
      "C3's FIRST clause, monotonicity, needs no charging law at all and gives
      that whenever the overhead-inflated full-memory time exceeds the baseline NO
      CROSSOVER EXISTS ANYWHERE, while the metrics line returns a finite one - the
      metrics line asserts the existence of an object C3 forbids. That strengthens
      the finding, and the satisfying set is unchanged either way."
    missing_premise_1_the_endpoint_condition_is_C4_in_disguise: >-
      MONOTONICITY ALONE DOES NOT GIVE IT. C3's first clause says T is
      non-increasing in w; by itself that leaves inf_w T(w) entirely unconstrained
      below T_full, and the argument needs T(w) >= T_full FOR EVERY w. Getting
      there takes an endpoint anchor: for w >= M, T(w) = T_full, which is C3's
      SECOND clause; and for w < M, monotonicity plus that clause AT THE SINGLE
      POINT w = M. That single point is exactly control C4. So the route is
      attributed to C3's first clause and in fact needs the second clause at the
      one point that entails C4. The correction therefore reproduces the structure
      of the error it corrects: it presents as independent of C4 an argument whose
      load-bearing premise is C4. The phrase "the overhead-inflated FULL-MEMORY
      time" is where the endpoint enters the sentence unattributed.
    missing_premise_2_the_cap_clause: >-
      "the metrics line returns a finite one" is not the same as "the metrics line
      asserts a crossover exists", because metrics[5] ends with "capped by M" and
      the implementation reads that as a feasibility flag (cost_model.py:288-289).
      Without that premise the inference over-fires; with it, the metrics line
      asserts existence only when its value lies at or below log2 M, i.e. only when
      2*(log2 T_full + overhead_bits - log2 T_DG) <= log2 M.
    what_that_costs_the_route_as_recorded:
      - >-
        ON PROVES-TOO-MUCH OBJECT 1, THE SATISFIABLE SYNTHETIC: I ran the route as
        recorded on the synthetic contract whose crossover CARRIES the M term
        (alpha = 1), the object on which "unsatisfiable" is KNOWN FALSE. It
        returns "CONTRADICTION". That is a BREAK, and I report it as one. With
        premise 2 restored it returns "no contradiction", correctly, because the
        synthetic's value exceeds log2 M whenever the antecedent holds.
      - >-
        ON PROVES-TOO-MUCH OBJECT 2, THE DEGENERATE WITNESS: the route as recorded
        returns "CONTRADICTION" at log2 M = 0, the one point every derivation on
        the record - the producer's, the first reviewer's, mine, control AC-2, and
        EV-SSI-2aaf6f at strength `replicated` - concedes is satisfiable. That is
        a second BREAK. With premise 2 restored it returns "no contradiction"
        there, because the antecedent forces the value strictly above log2 M = 0.
      - >-
        "the satisfying set is unchanged either way" IS NOT ESTABLISHED BY THE
        ROUTE AS RECORDED - as recorded the route excludes points with log2 M = 0,
        so it does not leave R x {0} standing. It IS TRUE of the repaired route,
        and I verified this rather than assuming it: the repaired route's
        exclusion region is {A > 0 and 2A <= log2 M}, and A > 0 with log2 M >= 2A
        forces log2 M > 0, so the region is a strict subset of {log2 M != 0}. The
        decision's conclusion is right. Its derivation needs the two premises.
    the_corrected_statement_written_out: >-
      Let T be any charging law satisfying control C3. Then (i) by C3's second
      clause T(w) = T_full for w >= M; (ii) by C3's first clause together with (i)
      at the single point w = M, T(w) >= T_full for every w. Hence in any scenario
      whose overhead-inflated full-memory time strictly exceeds the baseline, the
      overhead-inflated time exceeds the baseline at EVERY budget and no crossover
      exists at any w. In such a scenario the metrics line of
      specification.yaml:39-40 nevertheless reports a crossover, and - reading its
      trailing "capped by M" clause as the feasibility condition the
      implementation gives it - reports it as FEASIBLE whenever its value lies at
      or below log2 M. Where that holds the metrics line asserts the existence of
      an object C3 forbids. THIS ROUTE NEEDS NO FUNCTIONAL FORM FOR T - which IS a
      real gain over the producer's step 4 - BUT IT IS NOT INDEPENDENT OF CONTROL
      C4: its step (ii) is C3's second clause at w = M, which is C4.
    what_it_does_not_overturn: >-
      NOTHING ABOUT THE DEFECT. The satisfying set is R x {0}, the witness is
      log2 M = 0, the scope holds, and the amendment's clauses do not depend on
      this route. This is a warrant defect in a composing decision, not a defect
      in the finding. I say that plainly so the composition does not over-weight it.
    the_antecedent_is_a_prohibited_quantity: >-
      A > 0 is the per-row baseline-comparison sign. I treated A as a free symbol
      and did not evaluate it at any declared field size or overhead value.
      Consequence an enacting decision needs: this route cannot be discharged from
      a conditional into a statement about the contract's actual rows without
      computing a quantity the standing prohibition governs. I state that it would
      be required; I do not state the value.
  what_i_did_not_accept_from_the_first_reviewers_report_at_this_joint:
    - >-
      I did not accept F-3's derivation_3 - the monotonicity route - as correct
      merely because the Coordinator adopted it into DEC-20260905-5f5592 and
      EV-SSI-2aaf6f. It had been checked by nobody. I checked it and it has two
      missing premises.
    - >-
      I did accept F-3's entailment claim, but I reached it myself first, in
      writing, before opening the report - which is the only place in this round I
      can say that.

