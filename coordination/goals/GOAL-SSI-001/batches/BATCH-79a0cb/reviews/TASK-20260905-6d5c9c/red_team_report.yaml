  - id: RT-12
    severity: low
    joint: R1
    target: the characterization used by defect_reproduction.yaml verdict_statement and carried into the draft's gating_reproduction summary
    finding: >-
      "Unsatisfiable" is premise-bearing. Over arbitrary non-increasing laws the
      three blocks are not contradictory; the contradiction needs the vOW form,
      which the contract names but never writes. The producer already wrote the
      correct disjunctive statement at
      precise_form_of_the_finding_and_what_it_is_not; an enacting decision should
      quote THAT sentence rather than the bare "unsatisfiable except on the
