r2:
  joint: R2 F-1 and its class - what else in this package is a check that cannot fail
  subject_of_the_verdict: >-
    The PACKAGE's claim that its own controls can fail, so that their passes
    carry information.
  verdict: CONFIRMED WITH CAVEAT
  headline: >-
    THE OVERTURNING RESULT THE PLAN NAMED IS ACHIEVED. I exercised EVERY pattern
    of EVERY scanning vocabulary on an input I constructed for it: 23 patterns,
    23 exercised, 22 fired, exactly ONE did not - AC-4's eighth, the one already
    known as F-1. It is also the ONLY pattern in any of the three vocabularies
    containing an uppercase literal. The class is a class of one, and it is
    closed by exercise rather than by reading.
  how_i_ran_it: >-
    I imported amendment_controls.py as a module into a scratch script OUTSIDE
    the repository, with sys.dont_write_bytecode = True and
    PYTHONDONTWRITEBYTECODE=1 set, so that importing could not refresh the .pyc
    in the snapshot-bound task directory. Every pattern was driven through the
    module's own entry points - scan_text, ac3_transcription_premise_control,
    ac4_framing_drift_control, ac4_affirmation_check - never through a bare
    re.search that would bypass the lowercasing and the normalizer.
  f1_reproduced_by_me_before_i_agreed_with_it:
    - "Pattern alone, through ac.scan_text on the sentence `Control C1 should be one-sided.`: 0 hits."
    - "The FULL AC-4 vocabulary on the same sentence: verdict `pass`, 0 hits - a sentence built to make that pattern fire, and the whole control passes it."
    - "Mechanical cause, read out of the instrument: scan_text lowercases the haystack at line 317 (`low = norm.lower()`) and calls re.finditer with no re.IGNORECASE, while the pattern at line 242 carries the uppercase literal `C1`."
    - "Systematic version, which F-1 did not run: I stripped regex syntax from all 23 patterns and searched for uppercase literals. Exactly one pattern has any: AC-4 index 7. AC-3 has none, AFFIRMATION_PATTERNS has none."
  pattern_by_pattern_exercise_table:
    total_patterns: 23
    exercised: 23
    fired: 22
    did_not_fire: 1
    vocabularies:
      - name: TRANSCRIPTION_PREMISE_VOCABULARY (AC-3)
        patterns: 11
        fired: 11
        driven_through: ac3_transcription_premise_control (verdict FAIL on every constructed input)
        inputs_i_built: |
          [0] "The anchor divergence means correcting the digits is required."          -> FIRED
