proves_too_much_control:
  how_i_ran_it: >-
    Three arguments encoded as decision procedures and run on every object: P =
    the producer's engine (amendment_controls.solve_joint, the affine-family
    route); R = my own reading's route (does the crossover scale with M, as
    C3b+C4 require of any scale-free law); M = the monotonicity route
    DEC-20260905-5f5592 adopted, AS RECORDED; and M' = the same route with the
    "capped by M" premise restored. All symbolic: alpha, beta, delta and free
    symbols A and log2 M. No numeral of the model appears.
  object_1_satisfiable_control_contract:
    object: synthetic pair whose crossover CARRIES the m term (alpha=1, beta=2, delta=0); "unsatisfiable" is KNOWN FALSE for it
    P: "returned satisfiable_unconstrained. CORRECT. Not a break."
    R: "returned satisfiable - the crossover scales with M and the cap condition holds. CORRECT. Not a break."
    M_as_recorded: "returned CONTRADICTION. **BREAK**, and reported as one, not as robustness."
    M_prime_with_the_cap_premise: "returned no contradiction (the value exceeds log2 M whenever the antecedent holds). CORRECT."
  object_2_degenerate_witness:
    object: the real blocks at log2 M = 0; "there is no satisfying assignment" is KNOWN FALSE there
    P: "returned satisfiable_only_on_slice with m_solution = -0.0 and witness_is_in_satisfying_set = true. CORRECT, and it says so in the same words the reproduction uses (`unsatisfiable except on the degenerate slice`)."
    R: "my route's satisfying set IS log2 M = 0, so it returns satisfiable at that point. CORRECT."
    M_as_recorded: "returned CONTRADICTION at log2 M = 0. **BREAK**. This is the finding RT-2 rests on."
    M_prime_with_the_cap_premise: "returned no contradiction at the witness. CORRECT."
  object_3_a_correct_control_C4_and_C2:
    object: controls C4 and C2, which the draft says are CORRECT AS WRITTEN and does not target; "this block is defective" is KNOWN FALSE for them
    P_on_C4: >-
      The engine has no input shape for a control alone; the nearest admissible
      input is a corrected metrics line paired with C4 (alpha=1, delta=0), on
      which it returns satisfiable_unconstrained - NO DEFECT FOUND. The diagnostic
      keys on the missing M term, not on C4.
    P_on_C2: "NOT APPLICABLE and reported as such: C2 fixes a constant, not a law, and the engine has no shape for it. A diagnostic that returned a verdict here would be the suspicious result."
    R_on_C4: "C4 is satisfied by T(w) = T_full*sqrt(M/min(w,M)). NO DEFECT. My dimensional limb does not fire: T and T_full share a unit."
    R_on_C2: "log2 T_DG = log2(p)/2 declares one constant per field size; there is no cross-unit comparison of the kind that fires my limb on lines 39-40. NO DEFECT."
    M_on_both: "the route needs a metrics line asserting a crossover; C2 and C4 assert none, so it is silent. NO DEFECT."
    verdict: "CORRECT ON BOTH BLOCKS BY ALL THREE ARGUMENTS. NOT A BREAK. The diagnostics do not find a defect wherever they look."
  object_4_scanning_controls_against_texts_that_should_make_them_fire:
    how: pattern by pattern, not only whole-vocabulary, exactly as the plan requires
    result: "23 patterns, 23 exercised, 22 FIRED. One did not: FRAMING_DRIFT_VOCABULARY index 7, amendment_controls.py:242, on the input `Control C1 should be one-sided.` reported above by index with its input."
    verdict: "PARTIAL BREAK, confined to the single already-known pattern. AC-3 (11/11), AFFIRMATION (4/4) and AC-4 (7/8) are otherwise live."
  object_5_positive_control_not_optional:
    the_real_contract_for_the_first_three_arguments:
      P: "returned satisfiable_only_on_slice with m_solution = -0.0. It REJECTS the real contract, as the record says it does."
      R: "returned defect - the crossover carries no M factor, so the implied law violates the cap at w = M. It rejects the real contract."
      M_as_recorded: "returned CONTRADICTION."
      M_prime: "returned CONTRADICTION where 2A <= log2 M and no contradiction where 2A > log2 M - i.e. it discriminates, which is what the repaired route should do."
    the_real_draft_for_the_scanning_arguments:
      AC_3: "pass on all three scanned artifacts."
      AC_4_with_the_declared_exemption: "pass on all three."
      AC_4_affirmation_on_the_draft: "pass, five matches including `two-sided test is CORRECT FOR` and `CORRECT FOR C1'S OWN DECLARED PURPOSE`."
      injected_positive_controls: "I ran both myself into a scratch directory OUTSIDE the repository. AC-3's fired: true. AC-4's fired: true."
    verdict: >-
      THE PROCEDURES ACCEPT WHAT THEY SHOULD ACCEPT AND REJECT WHAT THEY SHOULD
      REJECT, so their rejections carry information - with the two exceptions
      reported above as breaks: the monotonicity route as recorded on objects 1
      and 2, and AC-4's single dead pattern on object 4. No procedure rejected
      every object.

# =====================================================================
findings:
  - id: RT-1
    severity: material - the one finding that should be fixed before an enacting decision, and it is a two-space fix
    joint: R4
    target: coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/protocol_amendment_draft.yaml, key amendment.proposed_replacement.clause_1.replacement_text_in_full (draft lines 182-191), applied to experiments/EXP-WESOVOW-001/specification.yaml:39-40
    finding: >-
      THE ONE CLAUSE THAT CARRIES THE ACTUAL REPAIR IS THE ONE CLAUSE WHOSE
      REPLACEMENT TEXT DOES NOT PARSE. clause_1's operation is "replace in full"
      and its replacement_text_in_full is a YAML sequence item whose key is
      terminated by a colon after "(p, overhead c)" and whose continuation lines
      are indented to the SAME column as that key. Spliced into the frozen file in
      place of lines 39-40, the resulting specification.yaml raises a YAML parse
      error and the contract does not load.
    how_i_demonstrated_it: >-
      Not by eye. I loaded the draft with yaml.safe_load, took the EXACT bytes of
      clause_1.replacement_text_in_full (584 characters, 9 content lines), spliced
      them over lines 39-40 of the real specification.yaml, and parsed the result.
      Indented by 2 to match the file's own metrics indentation: "while scanning a
      simple key" - DOES NOT PARSE. Spliced verbatim without indentation: "while
      parsing a block mapping" - DOES NOT PARSE. I then ran the same splice for
      clause_2 (appended to model_definition), clause_3 and clause_4 (appended to
      controls[0]): ALL THREE PARSE, and clause_3/clause_4 yield C1 keys
      [id, description, tolerance, on_violation, anchor_semantics] and
      [.., anchor_reachability] respectively. The defect is isolated to clause_1.
    the_smaller_repair_i_verified: >-
      Indent the eight continuation lines by two additional spaces. I applied
      exactly that and parsed: the file loads, metrics has 7 items, and metrics[5]
      is a single-key mapping with key "crossover memory log2(w*) per (p, overhead
      c)" - the SAME parsed type the prior text has today, so no consumer that
      indexes the metrics list sees a type change. A folded `>-` block scalar would
      work equally and would change the parsed type to a string, which I would not
      choose for that reason.
    why_it_matters: >-
      A recorded superseding amendment's whole value is that its replacement text
      is exact and mechanically applicable; the draft's own
      why_an_amendment_and_not_an_edit rests on that. As drafted, an enacting party
      must silently reflow the "exact" replacement text by hand to make the
      contract load - which is precisely the class of unrecorded transformation
      this amendment exists to prevent. And the frozen contract MUST parse: it is
      a YAML contract whose consumers, validators and every future reader load it.
    what_it_does_NOT_overturn: >-
      Nothing about the defect, the scope, the satisfying set, the category
      analysis, the licensing, or the substance of any clause. The replacement's
      CONTENT is fine and its parsed shape is preserved by the repair. This is a
      redraft item, not a rejection.
    i_did_not_fix_it: >-
      Correct. BATCH-752ef2 is snapshot-bound at commit
      2eef128634f23971727626c3974808fa27026987 and is the object under attack. I
      changed nothing.
  - id: RT-2
    severity: moderate
    joint: R3
    target: ledger/decisions/DEC-20260905-5f5592.yaml rationale (the F-3 correction item); ledger/evidence/EV-SSI-2aaf6f.yaml OBS-11; validation_report.yaml F-3.what_C3_DOES_add_that_the_package_did_not_record
    finding: The adopted monotonicity route is missing two premises and as recorded breaks proves-too-much objects 1 and 2. Full statement, demonstration and corrected wording at r3.finding_RT_2.
    what_it_does_NOT_overturn: The satisfying set, the witness, the scope, or any clause of the amendment. It is a warrant defect in a composing decision.
  - id: RT-3
    severity: low
    joint: R2
    target: coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/amendment_controls_report.yaml, AC-1 block, key is_the_pass_entailed_by_its_own_construction
    finding: >-
      The report answers "NO, and this was demonstrated rather than asserted" and
      then demonstrates something else: that the ENGINE returns five different
      verdicts on five shapes. That establishes the engine discriminates, not that
      AC-1's pass is unentailed. My 144-shape sweep shows AC-1's pass region is
      exactly {alpha = 1, delta = 0, beta != 0}, which is precisely how AC-1's own
      input is constructed. The same report answers the identical question for
      AC-2 with an exemplary "PARTIALLY YES"; the two answers should have matched.
    what_it_does_NOT_overturn: AC-1's residual value as a code control, or any verdict resting on it.
  - id: RT-4
    severity: low
    joint: R4
    target: protocol_amendment_draft.yaml proposed_replacement.clause_4.replacement_text_in_full, key licensing
    finding: The licensing summary that would become contract text drops both provisos the analysis attaches, and incorporates them only by pointer into a batch task directory. Full statement at r4.c.finding_RT_4.
  - id: RT-5
    severity: low
    joint: R4
    target: protocol_amendment_draft.yaml target.secondary_annotation_only, the controls[0] entry, key nature
    finding: '"ADDITIVE ANNOTATION ONLY" labels the clause whose own text says "THE OPERATIVE CLAUSE" and which makes the only existing implementation non-conforming.'
  - id: RT-6
    severity: low
    joint: R4
    target: protocol_amendment_draft.yaml proposed_replacement.clause_2.replacement_text_in_full, key invariants_that_any_incorporated_law_must_satisfy, second item
    finding: C4 is restated with the added qualifier "before the declared overhead multiplier", which is not in C4's text, inside an amendment that lists C4 as untouched and unchanged in text.
  - id: RT-7
    severity: low
    joint: R4
    target: protocol_amendment_draft.yaml blast_radius.frozen_artifacts, the cost_model.py entry
    finding: One effect of clause_1 is unnamed - it converts an existing deviation (an uncapped crossover value plus a flag at cost_model.py:288-289, against a version-1 metrics line that says "capped by M") into conformance. The blast radius is presented as complete and is one item short.
  - id: RT-8
    severity: informational
    joint: R4
    target: protocol_amendment_draft.yaml clause_3, against experiments/EXP-WESOVOW-001/specification.yaml:49 versus :139 and :151
    finding: CF-14 is not disclosed, though the draft has its own convention for disclosed non-repairs at clause_2.notation_note and adds new C1 text that restates the 0.75-bit tolerance. Not a call to repair CF-14. Full reading at r4.cf_14_reading.
  - id: RT-9
    severity: low
    joint: R4
    target: (a) protocol_amendment_draft.yaml clause_3.what_the_five_pairs_are; (b) clause_4.why_it_is_required
    finding: >-
      Two justifications rest on premises this batch cannot verify, both
      disclosed, both with a smaller repair. (a) The enactment precondition asks
      the Coordinator to confirm the LOCATOR but not the CHARACTERIZATION that
      does the contract-level work. (b) "Because the reported status is already
      known to differ across the declared field sizes" is an empirical premise
      that could only be rechecked by executing a prohibited file; the requirement
      does not need it and the justification could be stated hypothetically.
  - id: RT-10
    severity: informational
    joint: R2
    target: amendment_controls.py lines 68-71, the solve_joint derivation comment
    finding: The engine posits the law's memory term affine in (log2 w, log2 M), so AC-1 and AC-2 are conditional on the same functional-form premise as the reproduction's step 4 and neither can test it. Disclosed by the package; recorded here because the joint asks for checks that cannot fail in a given direction.
  - id: RT-11
    severity: informational
    joint: all - a property of this ROUND
    target: this report
    finding: >-
      MY AGREEMENT WITH F-1, F-3 AND F-7 IS NOT INDEPENDENT OF THE FIRST
      REVIEWER'S REPORT, which I was given and read. The single exception is the
      C3-clause-2-entails-C4 entailment, which I wrote down before opening
