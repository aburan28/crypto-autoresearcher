  cf_10_placement_recommendation:
    this_is_a_recommendation_and_not_a_decision: true
    what_i_would_defend: >-
      THE COMPANION-RECORD STRUCTURE THE DRAFT RECOMMENDS, enacted in the SAME
      Coordinator decision - i.e. I agree with the draft, for one reason of my own
      that it does not give.
    my_own_reason: >-
      THE TWO RECORDS HAVE DIFFERENT ENACTMENT PREDICATES, AND ONE OF THEM IS
      CURRENTLY UNSERVABLE. A contract amendment is verified as enacted by
      re-parsing one YAML file and comparing it against the recorded replacement
      text - an operation this batch can perform, and which RT-1 shows is not
      trivial here. A code repair's enactment is verified by inspecting or running
      a program whose EXECUTION IS PROHIBITED under CF-10, which is the very
      hazard the repair addresses. Binding them into one record makes the
      contract amendment's verification inherit the code record's containment. The
      draft's four reasons are also sound; this is a fifth and it is the one that
      binds hardest under this batch's own constraints.
    the_condition_i_would_attach: >-
      The two records must be enacted by the SAME decision, as the draft says,
      because clause_3 and clause_4 leave the contract with NO conforming
      implementation until the companion record lands. Enacting the amendment
      alone would create a contract that nothing implements.
    the_authority_question_i_do_not_resolve: >-
      DEC-20260904-4c81b6 next_actions[4] says the CF-10 repair "travels with the
      CF-1 amendment because it is a change to a frozen artifact". The draft reads
      "travels with" as the same enacting ACTION rather than the same RECORD. That
      reading is available and I find it the better one, but the authority is the
      enacting Coordinator's and my preference does not settle it.

  cf_14_reading:
    the_facts_i_verified_in_the_frozen_file_myself: >-
      specification.yaml:49 describes C1 as "an INSTRUMENT SANITY GATE carrying a
      3-bit tolerance"; C1's own tolerance at :139 is "abs deviation <= 0.75 bit on
