citation_prohibition:
  restated_verbatim: >-
    The `P=512` crossover value and its `w=2^80` sign are **NOT
    citation-eligible**. This task does not lift that prohibition. Only a
    committed Coordinator decision on independently reviewed evidence can lift it.
  predicate_extension_restated_verbatim: >-
    In addition to the retained sentence, a row of any EXP-WESOVOW-001
    reconciliation is NOT citation-eligible when either (a) the two anchors
    disagree in the SIGN of the baseline comparison at that row, or (b) the
    smaller |margin| across the two anchors at that row is below that field size's
    anchor gap |Delta log2 T_full + Delta log2 M / 2|.
  neither_limb_is_lifted_by_this_report: true
  did_it_fire_on_the_package:
    retained_sentence:
      applicable: true
      fired: false
      how_i_checked: >-
        Not by trusting the package's declaration. I ran a numeral census over
        protocol_amendment_draft.yaml (222 numeral tokens, 74 distinct),
        defect_reproduction.yaml (303 tokens, 97 distinct) and
        category_and_licensing_analysis.yaml (138 tokens, 69 distinct) and
        inspected the distinct sets. The tokens I inspected are line numbers,
        record-identifier fragments, the declared optimizer grid (1.0, 60.0,
        step 0.1), the declared overhead values (0.0, 0.5, 1.0, 2.0), the
        declared C1 tolerance (0.75) and the declared field sizes. I found no
        crossover value, no baseline comparison, no margin and no speedup. I did
        NOT exhaustively classify every one of the 240 distinct tokens; I
        inspected the distinct sets and every value I inspected fell in those
        classes. Reported at that strength and no higher.
    predicate_extension:
      applicable: false
      fired: false
      why: >-
        The predicate scopes rows of an EXP-WESOVOW-001 reconciliation. The
        package cites no reconciliation row and computes no per-row margin. I
        note separately that category_and_licensing_analysis.yaml discloses the
        COUNT and the field sizes of the reachability statuses; a reachability
        status is a comparison of an anchor against this model's attained
        minimum, not a baseline comparison against T_DG, so neither limb reaches
        it. I do not restate any status here.
  did_it_fire_on_my_own_report:
    retained_sentence:
      applicable: true
      fired: false
      why: >-
        APPLICABLE, because this report analyses the frozen contract's own
        analytic crossover line and reads the implementation's crossover site.
        NOT FIRED. This report derives, recomputes, tabulates and cites NO
        crossover value, NO baseline-comparison sign, NO margin and NO speedup at
        any field size. My R1 derivation is purely symbolic and contains no
        numeral that is a time, a memory, a crossover, a margin or a deviation.
        Following the practice the first review established at its F-11, I
        deliberately DO NOT reproduce the closed form at cost_model.py:288: I
        state only, by locator, that the implementation's crossover expression
        carries an additive log2 M term that specification.yaml:39-40 does not.
    predicate_extension:
      applicable: false
      fired: false
      why: I cite no reconciliation row and compute no per-row margin.
  the_attack_i_did_not_run_because_it_would_have_required_a_prohibited_value:
    what: >-
      The adopted monotonicity route (R3) is conditional on the antecedent
      A > 0, where A = log2 T_full + overhead_bits - log2 T_DG. That antecedent
      IS the per-row baseline-comparison sign the retained sentence governs.
      Determining whether any declared scenario satisfies it would require
      computing exactly the quantity the prohibition covers.
    what_i_did_instead: >-
      I treated A as a free symbol throughout, established the route's structure
      on every sign of A, and record here THE STATEMENT that instantiating it at
      any declared row would require a prohibited value - never the value. This
      is a consequence an enacting decision needs: the adopted route cannot be
      discharged from a conditional into a statement about the contract's actual
      rows without lifting the prohibition first.
  recommendation_marked_as_a_recommendation:
    text: >-
      I RECOMMEND no change to either limb on this round's evidence, and I have
      no evidence bearing on a lift. A recommendation is not a decision; only a
      committed Coordinator decision on independently reviewed evidence lifts it.
  do_not_restate_compliance: >-
    No value of the cost_model.py PAPER_PAIRS mapping and no EV-SSI-5d954c delta
    is restated anywhere in this report. Neither is named except by locator. No
    per-field reachability status is restated.

# =====================================================================
r1:
  joint: R1 the defect reproduction and its scope assumption, attacked as a reading rather than as algebra
  subject_of_the_verdict: >-
    The PACKAGE's claim: that specification.yaml:39-40 and control C4 are jointly
    satisfiable only on the degenerate slice log2 M = 0, and that the two blocks
    are in one scope.
  verdict: CONFIRMED WITH CAVEAT

  reading_order_attestation:
    i_wrote_my_own_reading_first: true
    statement: >-
      I ATTEST, AND THIS IS AN ATTESTATION AND NOT A TOOL RESULT: I read
      experiments/EXP-WESOVOW-001/specification.yaml in full, all 167 lines, and
      wrote my own reading of lines 39-40 against controls C3 and C4 to a file
      OUTSIDE the repository, BEFORE I opened defect_reproduction.yaml, before I
      opened any other artifact of TASK-20260905-28c89d, before I opened the
      first reviewer's validation_report.yaml, and before I opened
      BATCH-79a0cb/review_plan.yaml. The only things I had read at that point
      were my own task card, my handoff, and the frozen contract itself.
    artifact: <session scratchpad outside the repository>/own_reading_R1.md
    sha256: f9633878e5d1d69fc549327520d229f5b54d4e642e9f58615318abb9cc062ca4
    written_at_utc: '2026-09-05T22:45:40Z'
    honest_limit: >-
      The scratchpad is ephemeral and the hash is self-reported; a successor
      cannot verify the ordering from it. It is exactly as strong as the plan
      says an attestation is, and no stronger.

  my_own_reading_of_lines_39_40:
    what_the_metrics_line_says: >-
      metrics[5], lines 39-40, quoted from the frozen file:
      "crossover memory log2(w*) per (p, overhead c), analytic: w* = (T_full *
      2^{c*sqrt(log2 p)} / T_DG)^2, capped by M".
    what_C3_says: >-
      C3-monotonicity, lines 145-147, has TWO clauses: (C3a) T(w) non-increasing
      in the memory budget w for every (p, overhead) scenario; (C3b) T(w) = T_full
      for w >= M.
    what_C4_says: >-
      C4-vow-asymptote, lines 148-149: at w = M the vOW time must equal T_full
      exactly (cap check). I noted IN MY PRE-PRODUCER READING, before seeing any
      F-number, that C3b quantifies over all w >= M and so C3b entails C4; C4 is
      that clause at a single point. That observation is therefore mine
      independently, and it is the one place in this round where my agreement
      with the first reviewer is NOT anchored on its report. See r3.
    units_the_file_itself_fixes: >-
      w is in TABLE ENTRIES - the key at line 115 is literally
      `memory_budgets_log2w_entries`, and unit_of_memory at line 72 is "table
      entries". M is in the same unit (log2 M = 2 log2 X + log2 rho(w), lines
      65-66; metric at line 36 says "log2M (memory, entries)"). C3b and C4
      compare w to M directly, which is well formed only if they share a unit.
    what_a_single_charging_law_must_satisfy_to_satisfy_both: >-
      A law T_{p,c}(w) that is non-increasing in w and whose value AT w = M is
      pinned to T_full exactly, with no free constant left over.
    the_satisfying_set_as_I_derived_it: |
      Write s := 2^{c*sqrt(log2 p)} and r := T_full * s / T_DG.
      (a) In the vOW square-root family T(w) = A * w^{-1/2} for w <= M, C4 and
          C3b force A = T_full * M^{1/2}, i.e. T(w) = T_full * (M/w)^{1/2}. The
          crossover, the budget where the overhead-inflated time meets the
          baseline, then solves T_full*(M/w*)^{1/2}*s = T_DG, giving
          w* = M * r^2. Lines 39-40 state w* = r^2. THE FACTOR M IS ABSENT.
      (b) Inverting instead: if lines 39-40 are exact then T(w*) = T_DG/s =
          T_full/r = T_full/sqrt(w*), so the implied law is T(w) = T_full*w^{-1/2},
          whose value at w = M is T_full*M^{-1/2}. That equals T_full iff M = 1,
          i.e. iff log2 M = 0. SATISFYING SET = R x {0} in (log2 T_full, log2 M);
          log2 T_full is unconstrained, the whole conflict is in the memory
          coordinate.
      (c) Generalised past the power law, using only scale-freeness: for any law
          in which the budget enters through w/M, T(w) = T_full*f(w/M) with
          f(x) = 1 for x >= 1 - which is exactly what C3b and C4 assert - the
          crossover is w* = M * f^{-1}(1/r), PROPORTIONAL TO M. Lines 39-40 have
          no M dependence at all. Forcing M*f^{-1}(1/r) = r^2 over a range of r
          gives f(x) = (M x)^{-1/2}, hence f(1) = M^{-1/2} != 1, and C4 fails again.
      (d) A unit tell that needs no law: T_full, T_DG and s are times and a
          dimensionless multiplier, so r^2 is DIMENSIONLESS, while line 39 calls
          it "crossover memory" and line 40 caps it "by M", an entry count. A
          dimensionless ratio is not a memory and cannot be capped by one.
    the_honest_limit_of_my_own_derivation_stated_before_i_read_anyone_else: >-
      I recorded in my pre-producer reading, and I repeat it here because it is
      the caveat in my verdict: {C3, C4, lines 39-40} is NOT a contradiction over
      ARBITRARY non-increasing functions. A pathological, non-scale-free T that
      happens to pass through the four points the declared c grid asks for while
      still equalling T_full at w = M is not excluded by pure logic. The
      contradiction needs the vOW form, which the contract commits to by NAME in
      its title (lines 7-8), in its objective (lines 24-28) and in C4's own words
      ("vOW time", "cap check") - but never writes down. So my route is not
      premise-free either: it needs scale-freeness, which is weaker than the
      producer's power-law family posit but is not nothing. I state my own
      premise rather than claim I avoided one.
  where_my_reading_differs_from_the_producers:
    - >-
      SAME SATISFYING SET, SAME WITNESS, DIFFERENT PREMISE. The producer's step 4
      obtains g(y) = -y/2 identically from agreement at "at least twenty points"
      plus "the one-parameter power-law family that any single charging law of
      this form inhabits". I reach the same set from scale-freeness alone, which
      is strictly weaker. I did NOT accept the first reviewer's stronger claim to
      have reached it by a route "that avoids the producer's step-4 posit"
      without any posit at all: I looked for such a route and did not find one.
      Every route I could construct needs SOME restriction on the law's form; the
      question is only how weak, and C3b+C4 themselves are the natural source of
      the weakest one.
    - >-
      THE TWENTY POINTS ARE NOT TWENTY POINTS OF ONE FUNCTION. g is defined per
      (p, c) after subtracting the overhead, so for a fixed field size the four
      declared c values give FOUR points of one function, not twenty of one. The
      producer's phrasing overstates the constraint's strength; the first review
      makes the same observation at F-4 and I reproduce it independently here.
    - >-
      I ADD ONE OBSERVATION THE PACKAGE DOES NOT MAKE, AND IT MATTERS AT R3: the
      "capped by M" clause is what turns "the formula returns a finite value"
      into or out of "the contract asserts a crossover exists". Under lines 39-40
      the uncapped value is r^2, so whether the cap binds is the condition
      2*(log2 T_full + overhead_bits - log2 T_DG) > log2 M. I state that
      condition symbolically and DO NOT evaluate it at any row.

  three_dissolving_readings_worked_against_the_files_own_text:
    - reading: >-
        (a) A METRICS LIST IS A LIST OF REPORTED QUANTITIES, so lines 39-40
        describe what to report and not a law the contract asserts - in which
        case the contract is UNDER-SPECIFIED rather than unsatisfiable and the
        correct deliverable is a clarification, not a supersession.
      verdict: >-
        ADMITTED AS A READING, AND IT DOES NOT DISSOLVE THE DEFECT. This is the
        strongest of the three and the one the coordinator_prior holds at ~0.12.
        It survives as a reading and fails as a dissolution.
      what_the_files_own_text_does_with_it: >-
        FOR THE READING: metrics[0..3] and [6] name reported quantities with no
        formulas at all, and metrics[4] at line 38 names `log2 T(w)` and a
        `crossover flag` WITHOUT defining T(w) anywhere in the file. So the list
        demonstrably does name quantities it does not define; it behaves as a
        reporting schema. AGAINST THE READING: metrics[5] is the ONLY item in the
        list carrying a closed form, and it flags it `analytic:`; every other
        definitional formula in the contract lives in model_definition.quantities
        (lines 60-70), each with a bracketed provenance to the paper; and
        model_definition contains no T(w) and no w*. So under reading (a) the
        contract defines w* NOWHERE and cannot be implemented as written for
        metrics[5] or for metrics[4]'s crossover flag.
      why_it_does_not_dissolve_anything: >-
        Under (a) the closed form is still WRONG as a formula for the crossover of
        any C4-compliant law, and it is still the only statement of w* in the
        file. A clarification that merely said "the law lives elsewhere" would
        leave the false closed form standing in the contract's metrics list. The
        deliverable is a change to the contract's text either way. What (a)
        changes is the CHARACTERIZATION - "internally unsatisfiable" versus
        "under-specified, with its only statement of the reported quantity
        inconsistent with any law its own controls admit" - and the enacting
        decision should use the disjunctive form the producer already wrote at
        defect_reproduction.precise_form_of_the_finding_and_what_it_is_not.
      the_decisive_point_for_the_coordinators_prior: >-
        THE DRAFT ITSELF ALREADY ADOPTS READING (a). Its
        design_choice_the_replacement_states_no_closed_form says, in its own
        words, "a metrics list is a list of REPORTED QUANTITIES, and the defect
        exists because a law was stated there, in a place where no reader looks
        for the governing law". The clause_1 replacement text says "This metrics
        list names reported quantities and their units and states no law." So
        reading (a) is not a threat to the amendment: it is the amendment's own
        root-cause diagnosis, and the repair is built around it. Prior element 2
        is resolved in the direction that the reading is real and the deliverable
        is unchanged.
    - reading: >-
        (b) The two blocks quantify over different objects - `w` is used in two
        senses in this file and the argument needs both occurrences to be the
        memory-budget sense.
      verdict: FORECLOSED BY THE FILE'S OWN TEXT.
      what_the_files_own_text_does_with_it: >-
        The collision is REAL: line 62 defines w = log2X/log2B, the Dickman
        argument, reported as w_opt at line 35. But four independent features of
        the text force the memory sense in BOTH targets. (i) The key name at line
        115 is `memory_budgets_log2w_entries`. (ii) C3 and C4 compare w to M
        ("w >= M", "at w = M"), which type-checks only in entries, M being an
        entry count at lines 36 and 65-66. (iii) metrics[5] itself says
        "crossover memory log2(w*)" and "capped by M". (iv) The Dickman w is
        dimensionless and is constrained by "w >= 1" in the optimizer at line 78,
        a dimensionless constraint that would be vacuous for a memory budget on a
        grid that starts at 2^30 entries. The collision is a genuine notational
        defect and is not a dissolution.
    - reading: >-
        (c) `capped by M` is an operational instruction to the reporting code
        rather than a constraint the law must satisfy.
      verdict: >-
        ADMITTED, AND IT IS WHAT THE IMPLEMENTATION ACTUALLY DOES - and it still
        does not dissolve the defect. It is, however, LOAD-BEARING IN THE OTHER
        DIRECTION, which nobody has recorded.
      what_the_files_own_text_does_with_it: >-
        The implementation takes exactly this reading: cost_model.py:288-289
        emits an uncapped crossover value alongside a boolean
        `feasible_at_or_below_M` rather than a capped number. Under (c) the
        closed form still has to be the true crossover wherever the value lies at
        or below M, since otherwise metrics[4]'s `crossover flag` flags a budget
        at which the loaded time does not meet the baseline; so the conflict at
        every uncapped point is untouched.
      the_part_nobody_recorded: >-
        Reading (c) is the premise the ADOPTED monotonicity route of
        DEC-20260905-5f5592 omits. Without it, "the metrics line returns a finite
        one" does not mean "the metrics line asserts a crossover exists", and the
        route fires where it must not. See r3.finding_RT_2. A dissolving reading
        that fails at R1 turns out to be a missing premise at R3.

  scope_audit_as_i_performed_it:
    method: >-
      NOT a line-range enumeration. I parsed the file with yaml.safe_load and
      enumerated its structure, because R1's load-bearing question is structural
      and a line-range table is exactly the kind of warrant that can be false in
      two lines without anyone noticing.
    what_i_ran: python3 scope_audit.py in a scratchpad outside the repository, reading specification.yaml read-only
    results:
      sha256_of_the_file_i_read: c5cc16f7033407dd098fcba3ee79edca19c1f9a8aad2175e352db1a30fc4aa52
      size: 8376 bytes, 167 lines
      top_level_document_keys: ['experiment']
      keys_under_experiment: 25
      metrics: one flat list, length 7, no scenario keys, no conditional items
      controls: one list, length 4, ids C1-sanity-paper-pairs, C2-baseline-consistency, C3-monotonicity, C4-vow-asymptote
      the_target_is_one_item: >-
        metrics[5] is a single list item spanning lines 39-40, confirmed by the
        parse returning a 7-element list; the producer's key_path is correct.
    structural_finding_of_my_own_that_nobody_has_recorded: >-
      metrics[5] and metrics[4] PARSE AS SINGLE-KEY MAPPINGS, not as strings,
      because each contains a colon: metrics[5] has key "crossover memory
      log2(w*) per (p, overhead c), analytic" and value "w* = (T_full *
      2^{c*sqrt(log2 p)} / T_DG)^2, capped by M". The other five items are
      strings. The metrics list is therefore heterogeneous in TYPE. This is
      pre-existing, harmless as far as I can tell, and I record it because it is
      the reason I checked whether the amendment's replacement text preserves the
      parsed shape - it does, and that check is what produced RT-1.
    conclusion: >-
      SAME SCOPE, CONFIRMED BY MY OWN METHOD. One document, one experiment
      record, one version, one metrics list, one controls list, one unit of
      memory, one overhead multiplier, and no block that scopes, overrides,
      restricts or redefines either target. I found no block the producer's
      enumeration missed, and I looked for one structurally rather than by eye.
  degenerate_witness_check: >-
    RUN. The producer's argument SAYS the pair is satisfiable at log2 M = 0 -
    defect_reproduction satisfying_set.complement states the finding as
    "unsatisfiable except on the degenerate slice m = 0, NOT unsatisfiable
    unconditionally" - and its control AC-2 returns
    witness_is_in_satisfying_set: true on the real shape, which I reproduced
    myself. My own derivation reaches m = 0 as the witness by route (b) above. No
    derivation on the record, and not mine, claims a contradiction at that point.
    The one argument that DOES claim one there is the adopted monotonicity route
    as recorded, which is RT-2 and is not the producer's.
  what_i_did_not_accept_from_the_first_reviewers_report_at_this_joint:
    - >-
      I did not accept its claim to have re-derived the satisfying set "by a
      route that does not use the producer's step-4 posit" as meaning a
      premise-free route. I searched for one, could not construct one, and record
      my own premise (scale-freeness) explicitly instead.
    - >-
