    my_reading: >-
      NEITHER CORRECT RESTRAINT NOR AN INCOMPLETE REPAIR - IT IS AN INCONSISTENT
      APPLICATION OF THE DRAFT'S OWN CONVENTION. Not repairing CF-14 is right:
      it is a different defect in a different key and repairing it would widen.
      But the draft has an established convention for exactly this situation -
      clause_2's notation_note records the `w` collision, says it is "RECORDED
