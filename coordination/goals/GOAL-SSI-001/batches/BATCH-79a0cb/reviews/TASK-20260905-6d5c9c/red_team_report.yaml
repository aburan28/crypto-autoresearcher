      that the conflict was seen.
    what_i_recommend_as_the_smaller_repair_and_it_is_a_recommendation: >-
      Add to clause_3 a note of the same shape as clause_2's notation_note,
      recording the :49 versus :139 inconsistency, stating that this amendment
