# THIS BATCH HAS NO BLIND PHASE, AND THAT IS A DECISION, NOT AN OMISSION.
# There is no `blind_phase_hygiene` block below and no `protected_sha256` map.
# BATCH-752ef2 needed both because one of its tasks had to extract ten numbers
# from an externally retrieved document BEFORE it was allowed to see this
# program's own copy. Nothing in this batch re-derives a value from outside the
# repository. The single producer here is a Red Team whose assignment is to
# attack a DRAFTED AMENDMENT and the package around it, so the object under
# attack is exactly the thing it must read in full. Copying the previous
# batch's armed digest map here would declare a protection that protects
# nothing, and a declaration that protects nothing teaches every later reader
# to skip the one that does. See no_blind_phase below for the full statement,
# including what would re-arm one.
batch:
  id: BATCH-79a0cb
  goal_id: GOAL-SSI-001
  question_ids:
