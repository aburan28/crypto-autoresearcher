  execution_prohibition:
    new_experiment_runs_authorized: 0
    statement: >-
      This batch authorizes NO execution of any experiment implementation and
      creates NO run record. Authorized invocations are of the red team's own
      throwaway scratch scripts, written OUTSIDE the repository, including a
      scratch script that IMPORTS BATCH-752ef2's amendment_controls.py as a
      module and calls its controls on inputs the red team constructs. Importing
      a producer's standalone control module and calling it is not a run and does
      not write a run record; this is the standing interpretation ruled in
      DEC-20260904-166ab5 PD-4 and restated on every card of this batch rather
      than left to be inferred. Nothing may be written into any BATCH-752ef2
      directory.

  network_use:
    required_by_any_task: false
    statement: >-
      No task of this batch needs the network, and no conclusion of this round
      may rest on a retrieval. If the red team chooses to check an external
      citation it may, through the pre-configured agent proxy only - never
      disabling TLS verification, never unsetting HTTPS_PROXY, never
      transmitting repository content to any service - and it must record the
      URL, the method and a checksum. A retrieval failure is infrastructure
      signal and is never mathematical evidence about anything. A model
      recollection is a `recalled` pointer under AGENTS.md rule 9 and is never
      support; naming the nearest work you can recall, marked and hedged, is
      wanted, and presenting it as a checked source is the violation.
    prohibited: >-
      Never select a provider, backend, endpoint, or model identifier containing
      `bedrock`, case-insensitively (AGENTS.md rule 16).

  archive_topology:
    shape: >-
      Three tasks: TASK-20260905-6d5c9c (red team, non-archive) ->
      TASK-20260905-06907f (the SNAPSHOT COMMIT, coordinator, runs alone) ->
      TASK-20260905-e1d527 (the LEDGER ARCHIVE, coordinator, runs alone). Two
      commits, in that order, exactly as the program's archival contract
      requires: the producer package is bound immutably before the Coordinator
      composes it, and the ledger records are committed after.
    why_the_snapshot_task_carries_no_archive_block_in_the_queue: >-
      A DELIBERATE SCHEMA CHOICE, RECORDED IN FULL BECAUSE IT LOOKS LIKE AN
      OMISSION AND IS NOT. tools/research_dispatch.py enforces three rules that
      interact: an archive task's `archive.source_task_ids` must be a NONEMPTY
      text list (require_text_list at the archive-shape validator); a non-archive
      task may be assigned to AT MOST ONE archive task ("is assigned to both");
      and EVERY non-archive task must be assigned to EXACTLY ONE archive task. A
      batch with ONE producer and TWO archive-block tasks therefore cannot
      render at all: whichever archive owns the producer, the other has no legal
      source. BATCH-752ef2 did not meet this because it had two producer groups -
      two producers owned by its snapshot, one reviewer owned by its ledger
      archive. This batch has one producer, because the ranked work is one
      adversarial pass.
      THE RESOLUTION, WHICH PRESERVES BOTH COMMITS AND ADDS NO PRODUCER:
      TASK-20260905-06907f is declared as a coordinator task WITHOUT an `archive`
      block. It still runs alone, still stages exactly three declared paths by
      exact pathspec in one commit, still records a snapshot_commit_receipt.json,
      and is still forbidden to interpret anything. TASK-20260905-e1d527 is the
      queue's single archive task, `kind: ledger`, and owns BOTH non-archive
      tasks as sources, so the dispatcher's expected path set for it is the union
      of eight paths enumerated on its card.
    why_binding_mode_is_content_first: >-
      Because three of those eight paths - the two red-team artifacts and the
      snapshot receipt - are committed by the snapshot commit BEFORE the ledger
      archive runs, so one exact changed-path commit cannot express custody of
      the whole set. That is the documented purpose of `content_first` in
      tools/research_dispatch.py ("for source packages committed before their
      archive task ran, where one exact changed-path commit cannot express intact
      custody"), and it is opt-in precisely so nobody infers it from a failed
      scope check. Under it the verifier still requires a REAL, REACHABLE commit
      with its declared parent and the archival identifiers in its message, and
      it binds every declared artifact's bytes at HEAD; what it does not require
      is that one commit changed all eight. `path_sha256` must therefore cover
      ALL EIGHT paths on completion, not five.
    what_this_costs_and_what_it_does_not: >-
      COST: the snapshot commit is not itself passed through the dispatcher's
      post-commit archive verifier as an archive record, so its own scope
      discipline rests on its card and on the ledger archive re-verifying it.
      MITIGATION, WHICH IS A COMPLETION GATE ON THE LEDGER ARCHIVE: that task
      must recompute the sha256 of all three snapshot-committed paths, confirm
      they match the snapshot receipt, confirm the snapshot commit is an ancestor
      of HEAD, and record the result either way. WHAT IT DOES NOT COST: nothing
      about the isolation rule. Neither commit task runs beside anything, both
      stage only declared paths, and no worker commits into the shared worktree.

  model_independence:
    claimable: session-independent only
    statement: >-
      MODEL-INDEPENDENCE CANNOT BE SERVED HERE AND MUST NOT BE CLAIMED BY ANY
      ARTIFACT OF THIS BATCH. Three concrete facts, none of them inferred: (a)
      IMP-1 on the GOAL-SSI-001 head records that only the `local` backend
      resolves in this environment; (b) the BATCH-752ef2 RC-6 producer's own
      runtime receipt recorded an adapter-resolved model identifier
      `claude-sonnet-5` against that session's self-report of `claude-opus-5`,
      with `model_verified: false` and no probe run, and the divergence was
      escalated rather than absorbed (F-10 of TASK-20260905-4098fd); (c) every
      agent of this batch is a subagent of one orchestrating session, sharing one
      filesystem and one scratchpad, as the previous round's reviewer established
      for itself and the OBJ-4 producer. THE MOST THIS BATCH CAN ASSERT IS THAT
      THE RED TEAM RAN IN ITS OWN SESSION, INDEPENDENT OF THE PRODUCER'S AND OF
      THE FIRST REVIEWER'S. A `holds` from it is corroboration by a THIRD METHOD
      in a THIRD SESSION, never agreement between distinct models, and any
      artifact that presents it as the latter is wrong.
    what_that_leaves_open: >-
      Concretely, and already named by DEC-20260904-4c81b6 and re-confirmed by
      DEC-20260905-5f5592: a shared misreading of the frozen file, a shared
      assumption about which block governs, a shared blind spot about what an
      amendment is allowed to do. Three sessions of one model family agreeing is
      evidence about the argument's legibility to that family and weaker evidence
      about its correctness.
    the_receipt_requirement_that_follows: >-
      The red team's runtime_session_receipt.yaml must record the requested
      policy, the resolved model identifier as the adapter reports it, its own
      self-report if it differs, `model_verified` with whether a probe was run,
      and must ESCALATE rather than absorb any divergence. Recording an
      attestation, a probe, or a model identity you did not obtain is a
      fabrication under AGENTS.md rule 9.

  inference_environment:
    resolvable_backends: local only
    basis: >-
      NOT PROBED BY THIS AUTHORING TASK, which holds no shell. Carried forward
      from IMP-1 on the GOAL-SSI-001 head and from BATCH-752ef2's
      inference_environment, which carried it from BATCH-256a94's recorded
      `python3 -m orchestration.adapter doctor` run. It is an ASSUMPTION here,
      labelled as one, re-checkable with `python3 -m orchestration.adapter doctor
      --probe`.
    consequence: >-
      No task in this batch may require a second model backend or a
      model-independent review; such a task could not be served. The
      review-breakthrough tier cannot be served here at all, which is what makes
      the stop condition below a stop rather than an escalation.

  review_routing_determination:
    tier: review-adversarial at xhigh, in an independent session, for the single Red Team task.
    basis: >-
      The routing rules escalate to review-breakthrough at `max` for a claimed
      breakthrough, a proposed closure, or a result contradicting prior VALIDATED
      evidence. NONE APPLIES AT THE OPENING STATE: this round claims no
      breakthrough, closes no lane, approves no amendment, promotes no knowledge
      and moves no status. That is recorded first, on purpose, and it is a
      statement about the opening state only.
    stop_condition_that_can_change_it: >-
      IF THE RED TEAM CONCLUDES THAT THE DEFECT DOES NOT REPRODUCE - that
      specification.yaml:39-40 and control C4 are not jointly unsatisfiable off
      the degenerate slice, or that the two blocks are not in one scope - THAT
      OBJECT CONTRADICTS COMMITTED, VALIDATED EVIDENCE. EV-SSI-2aaf6f records the
      reproduction at strength `replicated`. Under AGENTS.md rule 12 such an
      object requires review-breakthrough at `max`, which is `degradable: false`
      and which this environment cannot serve (IMP-1). THE BATCH THEN HALTS ON
      THAT OBJECT: it is NOT composed under review-adversarial, the CLAIM stays
      un-promoted, GOAL-SSI-001 stays `active` with the impediment recorded, and
      the Coordinator decides what else the round can still record. Substituting
      an adversarial review for a breakthrough review to keep the round moving is
      the silent downgrade the policy layer forbids (CLAUDE.md rule 10 item 2).
      THIS IS NOT A REASON TO SOFTEN SUCH A FINDING: it is the most consequential
      thing this task could find, it must be recorded precisely and in full, and
      what halts is the composition, not the report.
    why_one_red_team_and_not_two: >-
      RECORDED AS A COST, NOT AS A DESIGN VIRTUE. The amendment's adequacy will
      have been examined by two independent sessions after this round - one
      Validator and one Red Team - and by no more. Three task identifiers were
      pre-allocated for this batch and this authoring task holds no shell with
      which to mint a fourth; the ranked work is one adversarial pass; and the
      host is small. The epistemic cost is that each of R1 through R4 is attacked
      once, by one agent, of one model family. It is mitigated only by the facts
      that nothing is promoted or enacted by this round and that the enacting
      decision must still be made deliberately, on this report and on the first
      review together.
    a_holds_verdict_is_a_full_result: >-
      RECORDED IN THE CONTROL PLANE, BEFORE THE PASS, SO IT CANNOT BE READ AS
      RELIEF AFTERWARDS. `holds` on all four joints is a fully acceptable and
      fully valuable outcome of this batch. The defect has been reproduced from
      the frozen file by two routes in two sessions, its scope assumption
      survived an independent 25-block enumeration of the whole file, and two
      corroborations lie outside the file entirely. A red team that searches hard
      and finds nothing has produced a real result and must say so plainly.
      STRAINING TO BREAK SOMETHING IN ORDER TO JUSTIFY THE PASS IS THE FAILURE
      MODE OF THIS BATCH - manufactured objections are worse than none, because
      they consume the enacting decision's attention and teach later readers to
      discount red-team findings generally. What is required is not a break; it
      is a recorded, specific, checkable SEARCH per joint.

  launching_prompt_disclosure:
    requirement: >-
      THE DISPATCHING SESSION MUST RECORD, IN THIS BATCH'S SNAPSHOT RECEIPT, WHAT
      IT TOLD THE RED TEAM AT LAUNCH - the substance of the launching prompt, and
      verbatim any statement it made about an expected outcome, a preferred
      verdict, a known finding, or how a previous agent concluded.
    origin_and_scope: >-
      CF-15, from F-12 of the TASK-20260905-4098fd review and PD-3 of
      DEC-20260905-5f5592: a launching prompt is a third disclosure channel that
      names no file, leaves no auditable trace, and can only be reported by the
      dispatching session or by the receiving agent's own candour. THIS
      REQUIREMENT DISCHARGES CF-15 ONLY IN PART. It makes the channel visible for
      this batch; it does not amend the blind-phase rule, which still enumerates
      files and commit messages only, and it cannot be enforced by any tool.
    why_it_still_matters_with_no_blind_phase: >-
      Because the effect it guards against here is not disclosure but
      CONFIRMATION PRESSURE. An adversarial pass told in advance that two
      sessions already agreed, or that a `holds` is expected, is measurably less
      likely to look for the break. The mitigation is that the same instruction
      also tells it plainly that `holds` is acceptable and that manufacturing a
      break is the failure mode - which is a weaker mitigation than not telling
      it anything, and is recorded as weaker.

  carried_forward:
    - id: CF-1
      origin: >-
        DEC-20260904-4c81b6 next_actions[0]; DEC-20260905-5f5592 next_actions[0];
        CF-1 of BATCH-752ef2/batch.yaml; EV-SSI-5d954c observations 1-2
      item: >-
        experiments/EXP-WESOVOW-001/specification.yaml:39-40 carries the pre-fix
        analytic crossover and is jointly satisfiable with control C4 of the same
        file only on the degenerate slice log2 M = 0. The repair is a RECORDED
        SUPERSEDING PROTOCOL AMENDMENT; the specification is frozen and may not be
