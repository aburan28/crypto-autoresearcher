  status: ready_for_dispatch
  status_note: >-
    Successor control plane to BATCH-752ef2, which DEC-20260905-5f5592 closed as
    `revise` with exactly one next research action. THREE TASKS: one adversarial
    pass, one snapshot commit, one ledger archive. This file authorizes no
    execution by itself; dispatch_queue.json is the bounded dispatch contract.
    NO hypothesis status, experiment status, or goal status moves in this batch.
    OPENING A BATCH IS NOT APPROVING ANYTHING IN IT, and this batch does not
    contain the decision that would approve the amendment: the red-team pass is
    a PRECONDITION for that future decision, not the decision.

  opened_under_next_action: >-
    Quoted from the committed GOAL-SSI-001 head (ledger/goals/GOAL-SSI-001/goal.yaml,
    field `next_action`), which this batch implements: "THE NEXT RESEARCH ACTION
    is to open one bounded successor batch whose GATING task is the RED-TEAM PASS
    on coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/protocol_amendment_draft.yaml
    and its two supporting artifacts, and whose enacting decision must resolve
    three things BATCH-752ef2 deliberately did not: the CF-10 RAW_PATH placement
    question the draft submits to the Coordinator; the F-7 over-reading path,
    scoped explicitly to the frozen transcript; and the F-2/F-3 warrant defects,
    by a successor record and never by superseding an immutable artifact."
  opened_under_next_action_read_note: >-
    HOW THAT FIELD WAS OBTAINED, STATED EXACTLY. This authoring task holds
    Read/Grep/Glob/Write/Edit and NO SHELL. It could not run
    `python3 tools/goal_head.py show GOAL-SSI-001 --field next_action`, which is
    the instrument the dispatching session named. It read the committed file
    ledger/goals/GOAL-SSI-001/goal.yaml directly, and independently read
    ledger/decisions/DEC-20260905-5f5592.yaml next_actions[0] and
    ledger/goals/GOAL-SSI-001/checkpoints/BATCH-752ef2.yaml `next_action`; all
    three agree on the gating task and on the three items the enacting decision
    must resolve. THE DISPATCHING SESSION SHOULD RE-RUN THE TOOL AND RECORD ANY
    DIVERGENCE AS A FINDING rather than reconciling it silently. Reading a file
    the tool renders is weaker than running the tool, and is recorded as such.
  the_enacting_decision_is_not_in_this_batch: >-
    STATED FIRST BECAUSE IT IS THE MOST LIKELY MISREADING OF THIS BATCH. This
    batch supplies the missing precondition. It does not approve the amendment,
    does not enact it, and does not move EXP-WESOVOW-001 off `approved` at
    version 1. The three items the enacting decision must resolve (CF-10
    placement, the F-7 over-reading path, the F-2/F-3 warrant defects) are
    attacked here as OBJECTS so that the future enacting decision has an
    adversarial reading of each; resolving them is that decision's job.

  objective: >-
    One independent Red Team pass, at review-adversarial and xhigh, in its own
    session, on the drafted superseding protocol amendment at
    coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/protocol_amendment_draft.yaml
    and its two supporting artifacts (defect_reproduction.yaml and
    category_and_licensing_analysis.yaml), with amendment_controls.py and
    amendment_controls_report.yaml available as the instruments those artifacts
    rest on. Four joints, R1 through R4, enumerated and owned in review_plan.yaml.
    Then one isolated snapshot commit binding the red-team package, then one
    isolated ledger archive composing the round.

  why_this_one_task_and_why_now:
    it_is_the_named_precondition: >-
      BATCH-752ef2's batch.yaml review_routing_determination.why_one_reviewer_and_not_two
      recorded, IN ADVANCE, that running one reviewer left the RC-6 argument
      checked once, and named a red-team pass on the draft as the precondition
      for approving it. DEC-20260905-5f5592 adopted that as the single next
      research action. This is that pass. It needs no run, no solver, no
      network, and no second backend.
    what_it_buys_that_the_first_review_did_not: >-
      A differently-motivated agent. The Validator's contract is to check
      integrity, controls and stated metrics; the Red Team's is to falsify the
      interpretation, the cost model and the scope of a proposed conclusion
      (AGENTS.md Roles). The first review confirmed all four of its joints with
      caveats and found thirteen findings; what it did not do, because it was
      not asked to, is attack the amendment as a PROPOSED ACT - whether it
      widens beyond the defect it repairs, whether its checks can fail, and
      whether there is a reading on which the defect is not a defect.
    what_is_deliberately_not_dispatched: >-
      Everything else. CF-9 (the two dirty_tree runs) is cheap, unblocked and
      remains the first candidate for the batch after this one; CF-7's
      remainder, CF-8 and CF-12(a) follow the enacted amendment because their
      design depends on what it says the reconciliation is FOR; CF-13's
      one-character fix belongs to whoever next holds amendment_controls.py open
      under a task that may write it, which no task here does. Not dispatching
      them is a scheduling decision, asserts nothing about their value, and is
      recorded per item under carried_forward so it cannot evaporate.
    ranking_statement_required_by_the_unlimited_ecc_budget: >-
      GOAL-SSI-001 is an ECC goal, so its campaign budget is unlimited
      (CLAUDE.md rule 11). Unlimited removes the batch ceiling, NOT the duty to
      rank. This task is ranked ahead of doing nothing because a named
      precondition for the campaign's only live enactment path is missing, and
      it is ranked ahead of CF-9 because CF-9 changes nothing about whether the
      amendment can be enacted. One task is dispatched, not three, because the
      host runs a small number of tasks at a time and because the ranked work
      here is one adversarial pass, not a new measurement.

  no_blind_phase:
    declared: false
    statement: >-
      THIS BATCH HAS NO BLIND PHASE. No value is protected, no `protected_sha256`
      map is armed, no commit-message history check gates any dispatch, and no
      task is handed a pre-merge worktree. `tools/check_review_independence.py
      --blind-history` is NOT APPLICABLE to this batch and a report of
      UNCHECKABLE from it would be correct rather than a defect.
    why: >-
      A blind phase exists to stop an operator being told the answer to a
      measurement it is about to make independently. THE RED TEAM MAKES NO SUCH
      MEASUREMENT. Its object is a drafted amendment and the package around it,
      all of which it must read in full to attack; its verdict is a judgement
      about that text, not an extraction from a document this program also
      holds. The ten Section 4.1 cost values that were protected in BATCH-752ef2
      are not an object of any joint here, are needed by none of them, and are
      not to be restated by anyone - but that is the citation and scope
      discipline below, not blindness.
    what_would_re_arm_one: >-
      Any successor task that re-derives a quantity this repository already
      holds - a second external retrieval, a re-extraction of the ten values, an
      independent recomputation of a crossover, a re-derivation of a composed
      verdict. Such a task gets the full BATCH-752ef2 machinery back: the arming
      recipe, the digest map, the self-check over control-plane files, the
      --blind-history run on the exact ref handed over, and a pre-merge base
      (BATCH-752ef2's snapshot receipt records that any future blind task on that
      batch must be given a pre-merge base, never that branch and never main,
      because the CORR-20260905-547849 leak reached `main`).
    the_honest_residual: >-
      Declaring no blind phase does NOT make this round free of disclosure
      effects. The red team is launched by a session that has read the producer
      package, the first review, and the composing decision, and it is told what
      to attack. That is F-12's channel (CF-15) and it is unavoidable when the
      assignment IS the attack. It is bounded instead of hidden: see
      launching_prompt_disclosure below, which requires the dispatching session
      to record what it told the red team.

  reading_order:
    binding: true
    it_is_not_a_blind_phase: >-
      SAID PLAINLY SO IT IS NOT MISREAD AS ONE. This is an ordering requirement
      on one joint, attested by the red team and NOT tool-checkable. No path is
      forbidden to it at any time, nothing is protected, and no hygiene
      declaration is armed. The plan's `blind_rederivation.required` is
      deliberately false and the reason is recorded there.
    requirement: >-
      For joint R1 only: form and write down your own reading of
      experiments/EXP-WESOVOW-001/specification.yaml lines 39-40 against controls
      C3 and C4 of the same file - what each block says, what a single charging
      law would have to satisfy to satisfy both, and what the satisfying set is -
      BEFORE opening TASK-20260905-28c89d/defect_reproduction.yaml. Then open it
      and everything else. Record in your report that you did it in that order,
      or record honestly that you did not.
    why: >-
      R1 asks for the reading on which the finding is NOT a defect. An agent
      that absorbs the producer's frame first will attack the producer's algebra,
      which two sessions have already checked, instead of the producer's
      framing, which nobody has. The cost of getting this wrong is a pass that
      re-checks the wrong thing.

  citation_prohibition:
    status: >-
      IN FORCE, RETAINED IN FULL, BOTH LIMBS. NOT LIFTED, NOT NARROWED, NOT
      WIDENED BY THIS BATCH, AND NO TASK OF THIS BATCH MAY LIFT IT. It has now
      been considered for lifting and deliberately retained in three consecutive
      committed decisions (DEC-20260904-166ab5, DEC-20260904-4c81b6,
      DEC-20260905-5f5592). Every ground those decisions recorded survives this
      batch untouched, because nothing here measures a crossover, an anchor, a
      margin or a sign.
    retained_verbatim: >-
      The `P=512` crossover value and its `w=2^80` sign are **NOT
      citation-eligible**. This task does not lift that prohibition. Only a
      committed Coordinator decision on independently reviewed evidence can lift
      it.
    predicate_extension_verbatim: >-
      In addition to the retained sentence, a row of any EXP-WESOVOW-001
      reconciliation is NOT citation-eligible when either (a) the two anchors
      disagree in the SIGN of the baseline comparison at that row, or (b) the
      smaller |margin| across the two anchors at that row is below that field
      size's anchor gap |Delta log2 T_full + Delta log2 M / 2|.
    machine_flag_status: >-
      BATCH-256a94's anchor_reconciliation.json per-row `citation_prohibited`
      flag is scoped by field size and is KNOWN TO UNDER-REPORT: at least two
      rows carrying `citation_prohibited: false`, at log2 p = 256, fall under the
      predicate. That artifact is snapshot-bound, IMMUTABLE, and MUST NOT be
      edited. Every consumer applies the three decisions above on top of it. This
      batch produces no successor to it and does not repair it.
    application_to_this_batch: >-
      Reasoned, not assumed. The red team reads a package whose primary target
      is itself an analytic crossover line, so the retained sentence is
      APPLICABLE here exactly as it was applicable to the drafting task.
      QUOTING the frozen contract's text, and quoting the draft's replacement
      text, is permitted. DERIVING, RECOMPUTING, TABULATING or CITING a crossover
      value, a baseline-comparison sign, a margin or a speedup is NOT - including
      in the course of arguing that the draft should have stated one. If the red
      team's attack requires computing a corrected crossover to be made, the
      correct output is the STATEMENT that the attack requires it, not the value.
      Every artifact of this batch restates both limbs verbatim and states which,
      if either, it found applicable and whether either fired.
    lift_procedure: >-
      Only a committed coordinator_decision resting on independently reviewed
      evidence may lift it. No identifier is reserved here for a lift and none is
      in prospect: this batch produces no anchor evidence of any kind. The red
      team may RECOMMEND lifting or retaining; a recommendation is not a decision.

  frozen_artifact_ruling: >-
    READ-ONLY FOR EVERY TASK IN THIS BATCH, with no exception and no task holding
    any of them in a write scope: experiments/EXP-WESOVOW-001/specification.yaml;
    experiments/EXP-WESOVOW-001/cost_model.py; everything under
    experiments/EXP-WESOVOW-001/runs/; everything under
    inputs/P13-WESOLOWSKI-2026/; and - ADDED BY THIS BATCH - every artifact of
