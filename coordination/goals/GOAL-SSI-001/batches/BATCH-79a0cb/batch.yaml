    literal, not with WESOVOW_RAW_PATH set. That prohibition is absolute and is
    the containment for the standing hazard CF-10, which BATCH-752ef2 contained
    the same way and which its containment did not repair.
  frozen_artifact_ruling_note_on_the_f1_fix: >-
    THE ONE-CHARACTER FIX FOR F-1 IS NOT MADE HERE, AND THE REASON IS NOT
    TIMIDITY. amendment_controls.py is bound by BATCH-752ef2's snapshot commit
    2eef128634f23971727626c3974808fa27026987 and is the instrument whose pass the
