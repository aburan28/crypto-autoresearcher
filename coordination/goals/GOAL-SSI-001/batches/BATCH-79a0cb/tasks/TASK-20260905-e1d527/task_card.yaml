    - The coordinator prior is compared against the outcome element by element across all eight elements, including the named candidate for widening and the named most-likely site for a second dead check.
    - Every finding is classified by what it changes about enactability, and an all-holds round with no blocking finding is recorded as a complete result rather than as a thin one.
