# THE SINGLE ARCHIVE-BLOCK TASK OF THIS BATCH. It owns BOTH non-archive tasks
# as sources - the red team and the snapshot commit - because a batch with one
# producer cannot carry two archive-block tasks through
# tools/research_dispatch.py (batch.yaml archive_topology). Its binding_mode is
# `content_first`, which exists for exactly this case: three of its eight
# declared paths were committed by the snapshot commit before this task ran, so
# one exact changed-path commit cannot express custody of the whole set. That
# mode still requires a real, reachable commit with its declared parent and the
# archival identifiers in its message; what it drops is the requirement that ONE
# commit changed all eight. `path_sha256` must therefore cover ALL EIGHT.
#
# THE LEDGER IDENTIFIERS BELOW WERE PRE-ALLOCATED AND ARE NOT PLACEHOLDERS.
# `EV-SSI-1a95bc` and `DEC-20260905-3b8e94` conform to the identifier grammar,
# so unlike BATCH-752ef2's deliberate non-conforming placeholders they WOULD
# commit if they were wrong. Running `tools/allocate_id.py --check` on both is
# therefore a hard precondition of this task, not a formality.
task_card:
  id: TASK-20260905-e1d527
  goal_id: GOAL-SSI-001
  batch_id: BATCH-79a0cb
  title: >-
    Coordinator ledger archive for BATCH-79a0cb - compose the red-team round,
    record the evidence and the decision, checkpoint the goal, and commit exactly
    the declared set, alone, after the pass has returned and been bound.
  role: coordinator
  state: queued
  review_required: false
  depends_on:
    - TASK-20260905-6d5c9c
    - TASK-20260905-06907f

handoff:
  id: TASK-20260905-e1d527
  from: coordinator
  to: coordinator
  objective: >-
    Run alone after the red-team pass has returned and been snapshot-committed;
    compose its four per-joint verdicts into one evidence record and one
    decision; compare the recorded coordinator prior against the outcome element
    by element; state precisely what the pass does and does not settle about
    ENACTABILITY; carry forward every undispatched item with its origin;
    checkpoint the goal in a write-once shard; and commit exactly those records -
    WITHOUT approving the amendment, moving any status, or inventing a result the
    report does not carry.
  uncertainty_reduced: >-
    Whether the round's outcome - an adversarial pass that held, broke, or was
    inconclusive on each of four joints - together with its scope limits and its
    consequences for the enactment path, is durably recorded before any successor
    batch or enacting decision is opened.
  inputs:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/reviews/TASK-20260905-6d5c9c/red_team_report.yaml and runtime_session_receipt.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/archives/TASK-20260905-06907f/snapshot_commit_receipt.json, including its independence-gate output and its launching-prompt disclosure
    - coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/review_plan.yaml, including the recorded coordinator_prior and its eight elements
    - The carried_forward list in coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/batch.yaml
    - ledger/decisions/DEC-20260905-5f5592.yaml, ledger/evidence/EV-SSI-2aaf6f.yaml, ledger/goals/GOAL-SSI-001/goal.yaml and its checkpoints/BATCH-752ef2.yaml
    - templates/research-records.md and docs/claims-and-verification.md
  constraints:
    - >-
      RUN ALONE, and stage only the five declared ledger-archive paths by exact
      pathspec, in ONE commit.
    - >-
      CHECK THE LEDGER IDENTIFIERS BEFORE WRITING THEM. Run `python3
      tools/allocate_id.py --check EV-SSI-1a95bc` and `--check
      DEC-20260905-3b8e94`. Both were pre-allocated by the dispatching session
      and re-checked by the authoring task ONLY BY DIRECT SEARCH, which is weaker
      than the tool. If either is taken, mint a fresh one with `--next`, `--check`
      it, and substitute at every site in batch.yaml
      reserved_record_ids.substitution_sites_exhaustive - a substitution is a NEW
      identifier and NEVER a rename. Record the outcome in the receipt either way.
    - >-
      RUN THE GATES AND DO NOT REPORT ONE YOU DID NOT RUN. `python3
      tools/validate_ledger.py` on the merged tree, confirming the paths written
      here add no new error. Re-verify the snapshot: recompute the sha256 of all
      THREE snapshot-committed paths, confirm they match
      snapshot_commit_receipt.json, and confirm the snapshot commit is an ancestor
      of HEAD - that re-verification is this batch's substitute for the snapshot
      having been a dispatcher-verified archive record, and it is a completion
      gate. Read the independence-gate result out of the snapshot receipt rather
      than re-running it, unless the plan or the report changed since, in which
      case re-run and record both. IF THIS TASK HOLDS NO SHELL, record each gate
      as OUTSTANDING with that reason, state that composition rested on reading
      the report and its attestation, and say plainly that this is weaker than the
      tool (DEC-20260904-166ab5 PD-6).
    - >-
      RECORD THE CF-16 DISCHARGE, WITH ITS PROVENANCE AND ITS RESIDUE. CF-16 is
      DISCHARGED: `python3 tools/check_review_independence.py --batch
      coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2` was run by the
      dispatching session and PASSED, reporting every joint owned and attested,
      blindness respected and controls declared, exit 0. Record it as DONE, not as
      owed. TWO THINGS ARE STILL REQUIRED OF YOU: preserve the verbatim output,
      the exact command and the ref in a durable artifact of this archive, because
      a discharge nobody can re-read is not durable evidence; and state that
      DEC-20260905-5f5592 and ledger/goals/GOAL-SSI-001/checkpoints/BATCH-752ef2.yaml
      both record that gate as OUTSTANDING, that both are IMMUTABLE, and that THIS
      RECORD IS THE SUCCESSOR THAT CORRECTS THEM - never an edit to either.
    - >-
      COMPOSE THE VERDICTS YOURSELF. The red team owned four joints and its
      report is not a vote on whether the amendment may be enacted. A joint with
      no verdict is recorded as UNCOVERED, never assumed to hold. Record
      explicitly that this round had ONE adversarial agent, that the amendment's
      adequacy has now been examined by two independent sessions and no more, and
      that blindness was DELIBERATELY LIFTED for the red team (review_plan.yaml
      blindness.lifted_for), so its agreement with findings F-1, F-3 and F-7 of
      the previous round is not independent of that report.
    - >-
      WEIGHT FINDINGS BY WHAT THEY CHANGE ABOUT ENACTABILITY, AND SAY WHEN THE
      ANSWER IS NOTHING. The prior records in advance that the composing
      Coordinator will be tempted to over-weight a minor finding to make the round
      look productive. For each finding state one of: it blocks enactment; it must
      be resolved IN the enacting decision; it must be recorded in a successor
      record and does not block; or it changes nothing about enactability. AN
      ALL-`holds` ROUND WITH NO BLOCKING FINDING IS A COMPLETE AND VALUABLE
      RESULT and is recorded as one, not as a thin round.
    - >-
      COMPARE THE RECORDED COORDINATOR PRIOR AGAINST THE OUTCOME, ELEMENT BY
      ELEMENT, ACROSS ALL EIGHT ELEMENTS, AND SAY WHICH WERE OVERTURNED. The prior
      includes a named candidate for the most likely widening (clause_4), a named
      most-likely site for a second dead check (AC-3), a probability that the
      Coordinator's own adopted C3 correction is defective, and a prediction that
      the round's most valuable finding will be one the first review did not raise
      at all. Report each as held, overturned, or overturned in its mechanism. A
      prior the pass overturns is among the most valuable results this program can
      produce and it is worthless if softened afterwards.
    - >-
      IF THE PASS REPORTED THAT THE DEFECT DOES NOT REPRODUCE, THE ROUND HALTS ON
      THAT OBJECT AND YOU DO NOT COMPOSE IT. It contradicts EV-SSI-2aaf6f at
      strength `replicated`, and under AGENTS.md rule 12 it requires
      review-breakthrough at `max`, which this environment cannot serve (IMP-1).
      Record the object precisely and in full, record the impediment on the
      still-active goal with what_is_blocked, clears_when and recheck, leave the
      CLAIM un-promoted, and compose only the rest of the round. Substituting this
      round's adversarial tier for the tier that object needs is the silent
      downgrade the policy layer forbids.
    - >-
      DO NOT APPROVE THE AMENDMENT AND DO NOT ENACT IT. This archive records that
      a drafted amendment has now received the red-team pass its approval was
      conditioned on, what that pass found, and what an enacting decision must
      still resolve. EXP-WESOVOW-001 stays `approved` and UNAMENDED at version 1;
      the draft stays `status: draft`, `in_force: false`, `approved_by: null`.
      NAME, in next_actions, the three things the enacting decision must resolve
      and add the fourth if the pass produced one: (i) the CF-10 RAW_PATH
      placement question the draft submits to the Coordinator, with the red team's
      recommendation recorded as a recommendation; (ii) the F-7 over-reading path,
      where any enacting text carrying `fidelity ... settled and closed` must say
      `to the frozen transcript` in the same sentence and may cite the external
      limb separately and only for the ten values; (iii) the F-2 and F-3 warrant
      defects, to be recorded in a SUCCESSOR record and explicitly NOT grounds to
      reject or supersede the immutable package.
    - >-
      Do not edit experiments/, inputs/, or anything under
      coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/. Do not execute
      cost_model.py. Do not make the F-1 one-character fix - it is CF-13 and it
      belongs to whoever next holds amendment_controls.py open under a task that
      may write it. Do not attach the provenance block to
      inputs/P13-WESOLOWSKI-2026/source_record.yaml - that is CF-19, it is a
      Coordinator act on reviewed evidence, that file is in no write scope here,
      and doing it would break this archive's enumerated path set. Carry both
      forward with their origins instead.
    - >-
      NEVER RECONSTRUCT, ESTIMATE OR GUESS a commit SHA, a parent SHA or a path
      hash. If a sha must be read rather than computed, say where it was read
      from, as DEC-20260905-5f5592 PD-9 did.
    - >-
      THE EVIDENCE RECORD IS AN ADVERSARIAL READING OF A DRAFTED AMENDMENT AND OF
      ONE FROZEN CONTRACT - NOT A NEW EXPERIMENT MEASUREMENT. `certificate.kind`
      is none; `run_ids` names only runs actually read, and this batch read none;
      `claim_tier` may not exceed what document reading and contract algebra
      support; `proof_status` and `proof_refs` are set honestly and
      `empirical_only` is not used for an argument that is not empirical. State
      the tested scope - which file, which line ranges, which package, which
      commit - and every transfer assumption. Record the strength honestly: a
      third session agreeing with two earlier ones, with blindness lifted, is not
      the same as an independent replication and must not be recorded as one.
    - >-
      NO hypothesis status transition, NO experiment status transition, and NO
      goal status transition. GOAL-SSI-001 remains `active` and this batch meets
      and approaches no completion criterion. `paused` and `blocked` are not
      permitted goal statuses (CLAUDE.md rule 10). IMP-1 is re-confirmed rather
      than re-raised unless this round met an impediment its text does not cover.
    - >-
      FILL knowledge_promotion. Promote a KN-FIND only on a `support` or
      `reject_scoped` decision backed by `replicated` or `strong` evidence,
      otherwise record a CONCRETE not_warranted reason, weighed against the
      standing reasoning in DEC-20260905-5f5592 rather than inherited from it.
      That decision asked for promotion to be reconsidered when the amendment is
      enacted by a committed decision with a red-team pass, and when CF-13 or
      CF-17 has a working implementation behind it; the first of those conditions
      is now partly met, so answer it on this evidence rather than by reference.
    - >-
      IF ANY PART OF THE DECISION WOULD CLOSE A LANE, it carries a complete
      `obstruction` block - a measured quantity with units and error bars, the
      artifacts it is read from, its scope, and a `resource_check` that was
      genuinely asked. An adversarial pass that found nothing is NOT an
      obstruction block and may not be used as one.
    - >-
      DO NOT LIFT THE CITATION PROHIBITION unless this decision itself lifts it on
      the strength of the independent report, and then only with the exact scope
      stated. Retain both limbs verbatim otherwise, restate that the committed
      machine-readable flag under-reports and must not be edited, and record the
      reasoning for retaining or lifting rather than inheriting it - this would be
      the FOURTH consecutive round in which the lift was available.
    - >-
      RECORD `procedure_deviations` IN THE DECISION. review_plan.yaml names the
      committed decision as the authoritative location for them, deliberately,
      because that file is not in your write scope and writing it would break the
      expected commit path set. Every departure goes there: acting before a report
      returned, a gate not run, a joint reassigned, a control dropped, a scope
      exceeded.
    - >-
      CARRY FORWARD EVERY UNDISPATCHED carried_forward ITEM INTO next_actions WITH
      ITS ORIGIN - CF-2, CF-7's remainder, CF-8, CF-9, CF-10, CF-12(a) and (b),
      CF-13, CF-14, CF-15, CF-17, CF-18 and CF-19 - and record what CF-1, CF-11
      and CF-16 discharged and what they did not. CF-9 HAS NOW BEEN HELD TWICE:
      either dispatch it next or record a reason, because a third silent holding
      is deprioritization without a recorded rationale.
    - >-
      CHECKPOINT THE GOAL in the write-once shard
      ledger/goals/GOAL-SSI-001/checkpoints/BATCH-79a0cb.yaml and make exactly one
      additive change to goal.yaml: its single next_action plus the pointers to
      this decision, this evidence record, this checkpoint and the verified
      commit. Do not append new narrative keys to the goal head, do not copy the
      superseded next_action into a new key, and PRESERVE EXACTLY ONE NEXT ACTION.
      Note in the checkpoint - as the previous two archives did, without repairing
      them - that `current_batch_id` and `dispatch_queue_path` on the head remain
      stale with respect to four batches now, and that repairing them is a
      control-plane act for a session that can render the dispatcher.
    - >-
      THE COMMIT MESSAGE STATES RECORD IDENTIFIERS AND LOCATORS ONLY - no verdict
      token, no finding, no severity. Successors re-read this history.
    - >-
      FETCH origin/main BEFORE COMMITTING AND MERGE IT - never rebase. Record the
      base commit and the merge outcome in the receipt, then push and open or
      refresh the PR against main naming EV-SSI-1a95bc, DEC-20260905-3b8e94,
      TASK-20260905-6d5c9c and BATCH-79a0cb. If a sync conflicts inside an
      immutable record, do not pick a side: stop and create a superseding record
      under a new identifier.
    - >-
      IF THE ROUND RETURNED INCONCLUSIVE, SAY SO PLAINLY. An inconclusive round is
      a result and is never rewritten into a cleaner history, and neither is a
      round whose only finding is that nothing is wrong.
    - >-
      Never select a provider, backend, endpoint, or model identifier containing
      Bedrock, case-insensitively.
