    - >-
      RUN THE PROVES-TOO-MUCH CONTROL on all five declared objects of the plan,
      INCLUDING the positive control, and report what each procedure ACTUALLY DID
      on each object, not what it should have done. A pass where the conclusion is
      known false is a BREAK and is reported as one, not as robustness. A
      procedure that rejects every object has rejected the decoys for no reason
