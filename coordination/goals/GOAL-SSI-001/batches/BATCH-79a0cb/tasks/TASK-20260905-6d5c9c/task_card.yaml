      `blind_from_respected: true`, which is trivially true because this plan
      declares no blind_from list and forbids you nothing. `verdict` must be one
      of holds, breaks, inconclusive.
    - >-
      NETWORK IS NOT REQUIRED AND NO CONCLUSION MAY REST ON A RETRIEVAL. If you
      check an external citation, go through the pre-configured agent proxy,
      never disable TLS verification, never unset HTTPS_PROXY, transmit no
