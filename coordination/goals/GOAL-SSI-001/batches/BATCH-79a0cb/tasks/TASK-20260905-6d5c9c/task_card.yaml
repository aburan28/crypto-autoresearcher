      This batch declares no blind phase, so this is scope discipline and not
      blindness - but successors re-read this history and a value written down
      once is written down forever.
    - >-
      YOUR REPORT IS A .yaml FILE WITH A TOP-LEVEL `review_attestation` MAPPING
      carrying task_id, joints_owned, sources_read, read_sibling_reports,
      blind_from_respected and verdict. It must be valid YAML that
      `yaml.safe_load` parses as a whole, and it must be the ONLY file in this
