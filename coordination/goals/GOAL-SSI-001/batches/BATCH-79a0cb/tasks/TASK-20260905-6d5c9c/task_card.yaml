    - >-
      SAY PER JOINT WHAT YOU DID NOT ACCEPT FROM THE FIRST REVIEWER'S REPORT.
      Blindness is lifted for you deliberately, so your agreement with F-1, F-3
      and F-7 is not independent of that report. Reproduce each of them yourself
      from the artifacts before you agree with it, and if a round of yours
      consists entirely of re-confirming existing F-numbers, say so - that is a
