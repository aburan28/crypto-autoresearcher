      helpers directly. Do not accept a prose claim that a failure branch is
      reachable; the whole of R2 exists because one such claim was false. Write
      only into your own review directory and into a scratchpad OUTSIDE the
      repository.
    - >-
      DO NOT FIX ANYTHING, AND ESPECIALLY NOT THE ONE-CHARACTER F-1 FIX.
      Everything under coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/ is
      snapshot-bound by commit 2eef128634f23971727626c3974808fa27026987 and is
      IMMUTABLE; it is the object under attack, and editing it would rewrite that
