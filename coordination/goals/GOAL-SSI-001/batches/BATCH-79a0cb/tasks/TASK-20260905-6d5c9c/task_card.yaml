      file open under a task that may write it. That is not you.
    - >-
      READ-ONLY, ABSOLUTELY, on experiments/ and inputs/. DO NOT EDIT
      specification.yaml - not one line, not a comment, not a reformat: it is a
      frozen contract and changes only by a recorded amendment, and reviewing the
