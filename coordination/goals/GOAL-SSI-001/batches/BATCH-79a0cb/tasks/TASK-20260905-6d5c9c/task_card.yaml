    - >-
      A VERDICT OF `holds` IS A FULLY ACCEPTABLE OUTCOME AND IS CONTRACTED AS ONE
      IN ADVANCE. The defect has been reproduced from the frozen file by two
      routes in two sessions, its scope assumption survived an independent
      enumeration of all 25 top-level blocks of the file, and two corroborations
