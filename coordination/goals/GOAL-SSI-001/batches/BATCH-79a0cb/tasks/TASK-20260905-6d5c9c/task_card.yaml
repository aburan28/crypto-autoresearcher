    addresses the category question in the adopted narrow form, carries no
    transcription premise, states what an `off_curve` anchor licenses, and does
    NOT widen beyond the defect it repairs.
  uncertainty_reduced: >-
    Whether the campaign's oldest adverse finding survives an adversarial reading
    rather than a further check of its algebra, and whether the drafted repair is
    safe to enact against a frozen contract - which is the precondition
    DEC-20260905-5f5592 names for approving it and which BATCH-752ef2's single
    reviewer was not asked to supply.
