    - experiments/EXP-WESOVOW-001/specification.yaml, READ-ONLY, read by you in full and not through anyone's excerpts
    - The snapshot-bound BATCH-752ef2 package under tasks/TASK-20260905-28c89d/ - the amendment draft, the defect reproduction, the category and licensing analysis, amendment_controls.py and its report. IMMUTABLE, READ-ONLY.
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/reviews/TASK-20260905-4098fd/validation_report.yaml - you ARE given the first reviewer's report; blindness is deliberately lifted for you and you must declare that you read it
