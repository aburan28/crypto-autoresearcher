# THIS TASK CARRIES NO `archive` BLOCK IN dispatch_queue.json, AND THAT IS A
# DELIBERATE SCHEMA CHOICE, NOT AN OMISSION. It still performs a real snapshot
# commit, alone, of exactly three declared paths. The reason is recorded in full
# at batch.yaml archive_topology: tools/research_dispatch.py requires every
# archive task to name a NONEMPTY source list and forbids one non-archive task
# being assigned to two archives, so a batch with ONE producer and TWO
# archive-block tasks cannot render at all. The single archive-block task of
# this batch is the ledger archive TASK-20260905-e1d527, which owns both
# non-archive tasks as sources under `content_first` binding and re-verifies
# this commit's hashes.
task_card:
  id: TASK-20260905-06907f
  goal_id: GOAL-SSI-001
  batch_id: BATCH-79a0cb
  title: >-
    Snapshot commit of the red-team package - alone, immediately on its return,
    and before the Coordinator composes a single sentence of it.
  role: coordinator
  state: queued
  review_required: false
  archived_by: TASK-20260905-e1d527
  depends_on:
    - TASK-20260905-6d5c9c

handoff:
  id: TASK-20260905-06907f
  from: coordinator
  to: coordinator
  objective: >-
    Run alone and commit exactly the two declared artifacts of
    TASK-20260905-6d5c9c plus this receipt, in ONE commit, by exact pathspec,
    before any composition of the report begins - so that the ledger archive
    composes a bit-identical, immutably bound object and a later disagreement
    about what the red team said localizes to a claim instead of to a question
    about what the file contained. Then run the independence gate that this
    campaign has recorded as OUTSTANDING for two rounds, on THIS batch, and
    record its verbatim output whichever way it goes.
  uncertainty_reduced: >-
    Whether the red-team package is bound to an immutable, exact-path commit
    whose content hashes verify independently, and whether this round's review
    architecture - one plan, four enumerated joints, one owner, one attestation -
    actually satisfies tools/check_review_independence.py rather than merely
    looking as though it would.
  inputs:
    - The two declared artifacts under BATCH-79a0cb/reviews/TASK-20260905-6d5c9c/
    - coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/batch.yaml and review_plan.yaml
    - This task card
    - The launching prompt that was given to TASK-20260905-6d5c9c, held by the dispatching session
  constraints:
    - >-
      RUN ALONE. No other task of this batch may be running while this commit
      runs. TASK-20260905-6d5c9c must have a terminal receipt before you start.
    - >-
      STAGE EXACTLY THE THREE DECLARED PATHS BY EXACT PATHSPEC, IN ONE COMMIT.
      Never `git add -A`, never stage a directory, never stage a frozen path,
      never stage a control-plane file, never stage anything under
      coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/. The expected change
      set is this task's own artifact_paths UNION its source task's
      artifact_paths - THREE PATHS, enumerated below with their count. Stating an
      archive's expected set more narrowly than the union is what got an archive
      of BATCH-dc1424 rejected three times; stating it as the union is what landed
      BATCH-752ef2's on the first attempt.
    - >-
      THE COMMIT MESSAGE STATES RECORD IDENTIFIERS AND LOCATORS ONLY. Name
      TASK-20260905-6d5c9c, TASK-20260905-06907f, GOAL-SSI-001 and BATCH-79a0cb,
      and say WHAT was archived, not what it says. No verdict, no finding, no
      severity, no characterization of what the red team concluded. This batch
      declares no blind phase, so no value is protected - but a commit message
      cannot be reverted, successors of this campaign re-read this history, and on
      2026-09-05 a commit message on this branch stated ten protected values and a
      composed verdict, the reverting commit quoted its subject verbatim, and
      `git log --oneline` then displayed it twice to a tree a blind agent was to
      run in (CORR-20260905-547849).
    - >-
      RECORD WHAT THE LAUNCHING PROMPT TOLD THE RED TEAM. This is CF-15 applied,
      and it is a required field of the receipt. Record the substance of the
      prompt that launched TASK-20260905-6d5c9c and, VERBATIM, any statement it
      made about an expected outcome, a preferred verdict, a finding already
      known, or how a previous agent concluded. A launching prompt names no file
      and leaves no auditable trace; only you can report it. If the prompt
      disclosed something the card did not, that is a finding about this round's
      dispatch and belongs in the receipt, not in a later apology.
    - >-
      RUN `python3 tools/check_review_independence.py --batch
      coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb` AND RECORD ITS
      VERBATIM OUTPUT AND EXIT CODE, WHICHEVER WAY IT GOES. The plan is a
      standalone file at this batch root with a top-level `review_plan` mapping
      and is the only such file in the directory; the red-team report is the only
      file carrying a `review_attestation`. If it FAILS to resolve the plan or
      reports a problem, THAT IS A FINDING and belongs in the receipt - it is not
      a reason to stop writing plan files in the shape the tool documents, and it
      is not a reason to edit the report. A FAIL blocks the ledger archive until
      the Coordinator rules on it. NEVER RECORD A PASS YOU DID NOT SEE.
    - >-
      DO NOT RUN `--blind-history` AND DO NOT RECORD A RESULT FROM IT. This batch
      declares no blind phase and no protected values, so that mode has no
      object here; it would report UNCHECKABLE, and an UNCHECKABLE recorded
      beside a real gate is how a reader learns to skim gate lists. Record instead
      the single line that this batch has no blind phase, citing batch.yaml
      no_blind_phase.
    - >-
      DO NOT EDIT, STAGE, MOVE OR EXECUTE anything under experiments/, inputs/,
      or coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/, and write no
      ledger or scientific record.
    - >-
      NEVER RECONSTRUCT, ESTIMATE, OR GUESS a commit SHA, a parent SHA, or a path
      hash. A receipt cannot hash the commit that contains it: leave commit_sha
      null in the receipt body if that is the honest state and record where the
      real sha can be read from, exactly as BATCH-752ef2's snapshot receipt did
      (DEC-20260905-5f5592 PD-9).
    - >-
      FETCH origin/main BEFORE COMMITTING AND MERGE IT into the working branch -
      merge, never rebase, because rebasing rewrites the commits run records were
      archived in. Record the base commit checked and the merge outcome in the
      receipt. If a sync conflicts inside an immutable record, do not pick a side:
      stop and report, and the resolution is a new superseding record under a new
      identifier.
    - >-
      PUSH THE BRANCH and open or refresh the PR against main naming
      TASK-20260905-6d5c9c and BATCH-79a0cb. A record that exists only in a local
      commit is unpublished and is not durable evidence.
    - >-
      IF THE RED TEAM STOPPED EARLY - a stop condition fired, the defect did not
      reproduce, a budget was exhausted - SNAPSHOT THE PACKAGE EXACTLY AS IT IS.
      An honest stop and an honest `breaks` are archived exactly like a `holds`
      and are not annotated as failures. If it wrote fewer or more than its two
      declared artifacts, do NOT invent, complete, stub, or delete anything:
      report the shortfall or the excess in the receipt and return to the
      Coordinator, because the expected path set will not match and the archive
      must not be forced.
    - >-
      DO NOT WRITE A CORRECTION, NOTE, OR COMMENTARY THAT AFFIRMS OR
      CHARACTERIZES THE RED TEAM'S VERDICT. DEC-20260904-166ab5 PD-1 rules that a
      pre-composition commit states what it commits and does NOT state that the
      reviewed verdict stands. Change no status, approve nothing, and interpret
      nothing.
    - >-
      Never select a provider, backend, endpoint, or model identifier containing
      Bedrock, case-insensitively.
  deliverables:
    - snapshot_commit_receipt.json
  deliverable_contracts:
    snapshot_commit_receipt.json: >-
      Commit information and hashes obtained from Git and from nowhere else:
      commit_sha (or null with the reason and where the real sha can be read
      from), parent_sha, the full three-path expected set with its sha256 map,
      the fetched base commit of origin/main and the merge outcome, the push
      result and the PR URL. PLUS THREE FIELDS THIS BATCH ADDS: (1) the verbatim
      output and exit code of `check_review_independence.py --batch` on this
      batch, with the exact command line; (2) the launching-prompt disclosure
      required above; (3) an explicit statement that `--blind-history` was NOT
      run and that this batch declares no blind phase, citing batch.yaml
      no_blind_phase.
  expected_commit_path_set:
    rule: >-
      This task's own `artifact_paths` UNION its source task's `artifact_paths`.
      THREE PATHS. Enumerated below and counted, deliberately: the archive
      contract in this program is stated as a union with a count because a
      narrower statement of it has cost this campaign three rejected archive
      attempts. The dispatcher's own enforcement for this batch happens on the
      ledger archive, which declares the union of all eight paths under
      `content_first` binding and re-verifies these three; that does not relax
      this commit's scope, it verifies it afterwards.
    count: 3
    enumerated:
      - coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/archives/TASK-20260905-06907f/snapshot_commit_receipt.json
      - coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/reviews/TASK-20260905-6d5c9c/red_team_report.yaml
      - coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/reviews/TASK-20260905-6d5c9c/runtime_session_receipt.yaml
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/archives/TASK-20260905-06907f/snapshot_commit_receipt.json
  read_scope:
    - AGENTS.md
    - agents/coordinator.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/reviews/TASK-20260905-6d5c9c
    - coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/batch.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/review_plan.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/dispatch_queue.json
    - coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/archives/TASK-20260905-06907f
  write_scope:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/archives/TASK-20260905-06907f
  archived_by: TASK-20260905-e1d527
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - The commit changes EXACTLY the three paths enumerated in expected_commit_path_set - this task's artifact_paths UNION its source task's - with no duplicates and nothing else, and the receipt's sha256 map covers all three.
    - No path under experiments/, inputs/, or coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/ appears in the commit, and no control-plane file of this batch appears in it.
    - The commit message names TASK-20260905-6d5c9c, TASK-20260905-06907f, GOAL-SSI-001 and BATCH-79a0cb, and states no verdict, no finding and no characterization of the red team's conclusions.
    - The receipt records only commit information and hashes obtained from Git, with the fetched origin/main base commit and the merge outcome, and reconstructs no sha or hash.
    - "`python3 tools/check_review_independence.py --batch coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb` was run, and its exact command, verbatim output and exit code are in the receipt. A failure is recorded as a failure and blocks the ledger archive."
    - The receipt states that --blind-history was not run and that this batch declares no blind phase, citing batch.yaml no_blind_phase.
    - The launching-prompt disclosure is present and records verbatim any statement the prompt made about an expected outcome, a preferred verdict, or a known finding.
    - The branch is pushed and a PR against main names TASK-20260905-6d5c9c and BATCH-79a0cb.
    - No ledger or scientific record is written, no status is changed, and the red team's verdict is neither affirmed nor characterized anywhere.
  return_format: >-
    A short report naming the commit sha, the parent, the three-path change set as
    verified, the origin/main base and merge outcome, the PR, the verbatim
    independence-gate result with its exit code, and the launching-prompt
    disclosure. If the red-team package was short of or beyond its declared
    artifacts, say so and stop.

citation_prohibition_verbatim: >-
  The `P=512` crossover value and its `w=2^80` sign are **NOT
  citation-eligible**. This task does not lift that prohibition. Only a
  committed Coordinator decision on independently reviewed evidence can lift it.

citation_prohibition_predicate_extension_verbatim: >-
  In addition to the retained sentence, a row of any EXP-WESOVOW-001
  reconciliation is NOT citation-eligible when either (a) the two anchors
  disagree in the SIGN of the baseline comparison at that row, or (b) the
  smaller |margin| across the two anchors at that row is below that field size's
  anchor gap |Delta log2 T_full + Delta log2 M / 2|.
