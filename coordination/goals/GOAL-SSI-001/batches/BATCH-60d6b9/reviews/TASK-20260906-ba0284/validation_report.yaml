              3206a252...c042 and size 15416. The recorded source_sha256_at_run
              714e6366...4842 belongs to a DIFFERENT committed blob, a7ec7fd1...,
              size 15549, and to exactly one - I enumerated every committed
              version of that path and there are two. The introducing commit is
              7d188a7c..., authored 2026-08-08T23:45:42-07:00 = 2026-08-09T06:45:42Z,
              which is after the manifest's recorded run_completed_utc of
              2026-08-09T06:36:50Z; it has the recorded commit as an ancestor and
              is itself an ancestor of HEAD; and a7ec7fd1 is still the version at
              HEAD.
            verdict: >-
              EVERY FIGURE REPRODUCES EXACTLY, including the digests, the blob
              ids, the sizes and the ancestry. The attestation's headline - that
              the recorded digest does NOT match the blob at commit_at_run_time
