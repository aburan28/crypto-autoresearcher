          - which: RUN-WESOVOW-201692-001 limb ii, the source_sha256_at_run comparison
            what_i_ran: >-
              git ls-tree 6f8b400d... -- experiments/EXP-WESOVOW-001/cost_model.py;
              git cat-file blob <that blob> | sha256sum; then git rev-list --all
              over the path, hashing every distinct blob; then git log -1 on the
              introducing commit and two git merge-base --is-ancestor checks.
