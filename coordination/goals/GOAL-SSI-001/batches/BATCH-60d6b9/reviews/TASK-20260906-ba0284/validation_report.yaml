        Read only. Never opened for writing, never edited, never reformatted, and
        no amended copy of it exists anywhere in the repository. Every amended
        variant in this review existed only as a Python string in memory.

  # =======================================================================
  joint_verdicts:

    J1:
      joint: J1 the redrafted clause_1 and whether the amended contract actually parses with the declared shape
      verdict: CONFIRMED
      what_i_did: >-
        Wrote independent_parse_check.py (my declared artifact) and ran it before
        opening any producer control. It reads specification.yaml read-only,
        reads the redraft record and the superseded draft, takes the EXACT bytes
        of each clause's replacement_text_in_full, indents every non-empty line
        by the declared splice_indent, splices IN MEMORY, and parses with
        yaml.safe_load. Anchors for the two append sites are recomputed BY SEARCH
        rather than counted, so no clause's anchor can be moved by a previously
        applied clause.
      my_results:
        unamended_frozen_file:
          parses: true
          metrics_len: 7
          metrics_item_types: [str, str, str, str, dict, dict, str]
          metrics_5_type: dict
          metrics_5_keys: ['crossover memory log2(w*) per (p, overhead c), analytic']
          note: >-
            CONFIRMED INDEPENDENTLY, AND I ADD ONE FACT NO RECORD OF THIS
            CAMPAIGN STATES - metrics[4] IS ALSO A SINGLE-KEY MAPPING, key `per
            (p, w, overhead c)`, at specification.yaml:38. The frozen file
            therefore has TWO mapping-valued metrics items, not one. It is not a
            parse defect (line 38 is a single line and closes its own value) and
            it is not the block being amended; I record it because "metrics[5] is
            a single-key mapping" is a weaker discriminator than it looks, and
            because a later reader auditing metrics-item homogeneity should know.
        redrafted_clause_1_spliced_at_indent_2:
          parses: true
          metrics_len: 7
          metrics_5_type: dict
          metrics_5_keys: ['crossover memory log2(w*) per (p, overhead c)']
          metrics_5_key_equals_the_replacements_own_key: true
          columns_observed: >-
            dash at column 2, mapping key at column 4, all eight continuation
            lines at column 6 - exactly what
            splice_procedure.clause_1.resulting_columns declares. The eight
            continuation lines are stored at column 4 in the record and the
            declared splice_indent of 2 carries them to 6.
        superseded_clause_1:
          tried_at_columns: [0, 2, 4]
          parses_at_column_0: false
          error_at_column_0: "ParserError: while parsing a block mapping ... expected <block end>, but found '-' at line 39, column 1"
          parses_at_column_2: false
          error_at_column_2: "ScannerError: while scanning a simple key at line 40, column 5 ... could not find expected ':' at line 41, column 5"
          parses_at_column_4: false
          error_at_column_4: "ParserError: while parsing a block mapping at line 38, column 5 ... expected <block end>, but found '-' at line 39, column 5"
          statement: >-
            IT DOES NOT PARSE, AT ANY OF THE THREE CANDIDATE COLUMNS. This is the
            THIRD independent session to report that, and the first to report it
            at three columns rather than two. I did NOT accept RT-1's result; I
            re-derived it. Note that the superseded draft declares no
            splice_indent at all (I checked: all four are absent from that
            record), which is why three columns had to be tried.
        redrafted_clause_2_spliced_alone:
          parses: true
          model_definition_keys: [quantities, unit_of_cost, unit_of_memory, optimizer, dickman_rho, vow_charging_law]
        redrafted_clause_3_spliced_alone:
          parses: true
          controls_0_keys: [id, description, tolerance, on_violation, anchor_semantics]
        redrafted_clause_4_spliced_alone:
          parses: true
          controls_0_keys: [id, description, tolerance, on_violation, anchor_reachability]
          note: >-
            THIS IS THE CLAUSE THE COORDINATOR'S PRIOR NAMED AS THE RESIDUAL RISK
            AT ROUGHLY 0.25 - "the one clause whose replacement text nobody has
            ever spliced in its repaired form". I spliced it in its repaired form
            and it parses, alone, together with clause_3, and in the all-four
            file. THE PRIOR'S ELEMENT (2) RESIDUAL IS NOT REALISED.
        all_four_applied_bottom_up:
          parses: true
          metrics_len: 7
          metrics_5_keys: ['crossover memory log2(w*) per (p, overhead c)']
          model_definition_keys: [quantities, unit_of_cost, unit_of_memory, optimizer, dickman_rho, vow_charging_law]
          controls_0_keys: [id, description, tolerance, on_violation, anchor_semantics, anchor_reachability]
        duplicate_key_scan:
          method: >-
            yaml.safe_load silently keeps the LAST of two identical mapping keys,
            so a clause that re-added an existing key would parse cleanly and
            shadow it, and no shape assertion could see it. I subclassed
            SafeLoader to record every collision and ran it on all ten objects.
          result: >-
            ZERO duplicate keys in every object that parses, including the
            all-four file. A clean negative result.
        structural_diff_frozen_vs_fully_amended:
          method: recursive path-by-path comparison of the two PARSED documents
          differences_found: 5
          differences:
            - REMOVED .experiment.metrics[5].crossover memory log2(w*) per (p, overhead c), analytic
            - ADDED .experiment.metrics[5].crossover memory log2(w*) per (p, overhead c)
            - ADDED .experiment.model_definition.vow_charging_law
            - ADDED .experiment.controls[0].anchor_semantics
            - ADDED .experiment.controls[0].anchor_reachability
          statement: >-
            EXACTLY FIVE, AND EXACTLY THE FIVE THE AMENDMENT DECLARES. No other
            key, value, list length or ordering anywhere in the parsed contract
            changes. This is the strongest single J1 result I obtained and no
            assertion in the producer's control makes it.
      content_check_beyond_the_parse:
        question: >-
          Does the redrafted clause_1 change any word of the replacement's
          substance relative to the superseded one, beyond indentation and the
          items DEC-20260905-3b8e94 ordered?
        answer: >-
          NO. Byte-identical: false (as expected). Identical after normalising
          leading and internal whitespace: TRUE. Per-line leading spaces are
          [0,4,4,4,4,4,4,4,4,0] in the redraft and [0,2,2,2,2,2,2,2,2,0] in the
          superseded - a uniform +2 on the eight continuation lines and nothing
          else. Line breaks fall at the same word boundaries in both. No
          substantive word is smuggled in under a whitespace repair.
        clause_1_sha256_redraft: 47bb56cb4a05644f07cd647e70e53d233864b1749cd3cfcc09a53f5425f9a8cb
        clause_1_sha256_superseded: 2ca25ceaf9d67767d34e52bad0d7df5affe525e607e8f0eae35b0198024f31d4
        clause_2_byte_identical_to_superseded: true
        clause_3_byte_identical_to_superseded: false
        clause_4_byte_identical_to_superseded: false
      one_wording_point_recorded_as_informational_only: >-
        proposed_replacement.clause_1.rt_1_repair_note asserts "the parsed value
        is character-for-character the same string". The superseded text does not
        parse at any column, so it HAS no parsed value and the comparison is a
        counterfactual rather than a check. The counterfactual is true under
        YAML's plain-scalar folding rule (a uniform indent shift does not change
        the folded value), and the checkable part of the sentence - that no word,
        punctuation mark or line break differs - I verified and it holds. I
        record this only so that nobody cites the sentence as a measurement. It
        is NOT a finding and I do not raise it as one.
      what_i_did_not_accept_from_the_reports_i_was_given: >-
        RT-1's parse failure - re-derived myself at three columns, from the
        superseded record's own bytes, before opening any producer control.
        BATCH-79a0cb OBS-3's statement about the unamended file's metrics shape -
        re-derived myself, and extended (metrics[4] is also a mapping). The
        redraft's own rt_1_repair_note claim that only whitespace differs -
        checked byte-for-byte rather than accepted. The redraft's
        splice_procedure.clause_1.resulting_columns - measured rather than read.
      finding_for_this_joint: >-
        NONE THAT CHANGES THE RECORD. I searched by splicing rather than by
        reading, at four clause sites, at three candidate columns for the
        superseded text, with a duplicate-key scan and a whole-document
        structural diff, and every declared property held. Recorded as a complete
        result, not as an absence of effort.

    J2:
      joint: J2 the new parse control and whether it can fail - or whether its pass is entailed by its own construction
      verdict: CONFIRMED WITH CAVEAT
      the_headline_and_it_overturns_the_coordinators_prior: >-
        THE CONTROL FAILS ON THE UNAMENDED FROZEN FILE, ON ITS CONTENT ASSERTION
        P4, AND IT WAS DESIGNED TO. review_plan.yaml coordinator_prior element (3)
        held roughly 0.6 that the control as first written would PASS there
        because it would assert only shape. IT DOES NOT. The producer anticipated
        the failure mode, added a fourth assertion comparing metrics[5] against
        the standalone parse of clause_1's own replacement text, named the
        unamended file as its FIRST negative object, and documents the reasoning
        in the script's own docstring under "WHY P4 IS NOT OPTIONAL". THE PRIOR'S
        ELEMENT (3) IS OVERTURNED, which the plan itself records as the better
        outcome. I state it plainly as the plan asks.
      the_control_as_i_read_it:
        assertions:
          P1: the amended text parses with yaml.safe_load
          P2: experiment.metrics is a list of exactly 7 items
          P3: metrics[5] is a mapping with exactly one key
          P4: metrics[5] equals - key AND value - the standalone parse of clause_1's own replacement_text_in_full
        evaluation_order: P1 then P2 then P3 then P4; first failure wins and is named
      the_five_proves_too_much_objects_run_by_me:
        how: >-
          I ran the committed script from the command line on the objects it
          constructs (`--selftest`, and each object individually), AND
          independently imported `run_control` as a module and fed it the ten
          objects MY OWN script constructs, which are different bytes built by a
          different splicer. PYTHONDONTWRITEBYTECODE=1 was set on every
          invocation. Importing the control is not a run (DEC-20260904-166ab5
          PD-4); zero experiment runs were executed.
        object_a_unamended_frozen_file:
          known_false_conclusion: the amendment has been applied and the amended contract has the declared shape
          what_the_control_actually_did: FAIL
          assertion_that_fired: P4
          exact_message: >-
            "P4 FAILED - metrics[5] does not equal the parse of clause_1's own
            replacement text; the key differs: amended file has 'crossover memory
            log2(w*) per (p, overhead c), analytic', clause_1 declares 'crossover
            memory log2(w*) per (p, overhead c)'. THIS IS THE ASSERTION THAT
            DISTINGUISHES THE AMENDED FILE FROM THE UNAMENDED ONE."
          observed_by_me_in_the_observations_block: >-
            P1, P2 AND P3 ALL PASSED on this object. The pass of the three shape
            assertions IS entailed by the file's pre-existing shape, exactly as
            the plan predicted; what is NOT entailed is P4, and P4 is what fires.
          this_is_not_a_break: >-
            A pass here would have been a BREAK. It failed. Reported as the plan
            requires: what it actually did, not what it should have done.
        object_b_superseded_clause_1:
          known_false_conclusion: this amended file parses
          what_the_control_actually_did: FAIL
          assertion_that_fired: P1
          exact_message_class: "ScannerError: while scanning a simple key at line 40 column 5 ... could not find expected ':' at line 41 column 5"
          agreement_with_my_own_result: >-
            IDENTICAL to my own independent splice at column 2, error class and
            location included. It failed on the PARSE assertion, naming it, which
            is what the plan required.
        object_c_length_breaking:
          known_false_conclusion: the declared shape is preserved
          what_the_control_actually_did: FAIL
