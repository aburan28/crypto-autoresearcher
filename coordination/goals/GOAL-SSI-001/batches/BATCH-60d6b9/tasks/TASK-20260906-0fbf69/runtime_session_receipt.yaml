citation_prohibition:
  retained_sentence_verbatim: >-
    The `P=512` crossover value and its `w=2^80` sign are **NOT
    citation-eligible**. This task does not lift that prohibition. Only a
    committed Coordinator decision on independently reviewed evidence can lift
    it.
  predicate_extension_verbatim: >-
    In addition to the retained sentence, a row of any EXP-WESOVOW-001
    reconciliation is NOT citation-eligible when either (a) the two anchors
    disagree in the SIGN of the baseline comparison at that row, or (b) the
    smaller |margin| across the two anchors at that row is below that field
    size's anchor gap |Delta log2 T_full + Delta log2 M / 2|.
  did_either_fire: >-
    NEITHER FIRED. No crossover value, sign, margin, delta, speedup or
    reconciliation row is cited by value or by outcome in this receipt or in
    the companion attestation. No occasion for either prohibition arose.
  discharging_cf_9_lifts_nothing: >-
    CF-9 is ONE GROUND among several on which the citation prohibition is
    retained. The other grounds - the anchor recorded `off_curve` at three of
    five field sizes, CF-7's undischarged remainder for the reconciliation
    procedure, the free overhead knob, and RT-2's `A > 0` antecedent - are
    untouched by anything in this task. Discharging CF-9 lifts, narrows and
    excepts nothing, and neither artifact of this task may be cited as a reason
    to revisit the prohibition. Only a committed Coordinator decision on
    independently reviewed evidence can lift it.

infrastructure_gap_is_never_mathematical_evidence: >-
  Everything this task produced concerns bytes, commits, digests and files.
  None of it is evidence for or against the EXP-WESOVOW-001 cost model, the
  frozen contract, the Wesolowski paper, any van Oorschot-Wiener tradeoff, or
  any isogeny or discrete-logarithm problem, in either direction. A recorded
  provenance gap is an infrastructure observation and is never a negative
  mathematical result; a recovered provenance chain is likewise never a
  positive one.

failure_taxonomy_classification:
  outcome: completed
  classification_of_findings: >-
    The UNATTESTABLE and PARTIALLY ATTESTED findings are classified as
    OPERATIONAL / INFRASTRUCTURE OBSERVATIONS about run-record provenance. They
    are explicitly NOT classified as `negative_observation`, because
    `negative_observation` is empirical evidence about a mathematical claim and
