# ---------------------------------------------------------------------------
# INFERENCE PROVENANCE - RECORDED HONESTLY, WITH A DIVERGENCE ESCALATED
# ---------------------------------------------------------------------------

inference:
  requested_policy: executor-implementation
  requested_policy_source: >-
    ledger/handoffs/TASK-20260906-0fbf69.yaml -> inference.policy, and
    task_card.yaml -> inference.policy. The two agree.
  requested_reasoning_effort: medium
  fallback_allowed: false
  degraded_allowed: false
  independent_session_required: false

  adapter_resolution:
    command: python3 -m orchestration.adapter resolve --role executor
    output_verbatim: "executor-implementation -> anthropic:claude-sonnet-5 (effort=medium)"
    adapter_resolved_model_id: anthropic:claude-sonnet-5
    adapter_resolved_effort: medium

  runtime_self_report:
    runtime: claude_code
    self_reported_model_id: claude-opus-5
    self_report_source: >-
      The session system prompt states "You are powered by the model named Opus
      5. The exact model ID is claude-opus-5." This is a SELF-REPORT read from
      the prompt, not a measurement.
    session_environment_check:
      command: env | grep -i "AUTORESEARCH\|ANTHROPIC_MODEL\|CLAUDE_MODEL" | sort
      output: >-
        No AUTORESEARCH_POLICY, AUTORESEARCH_BACKEND, ANTHROPIC_MODEL or
        CLAUDE_MODEL variable is set in this session (the only matching lines
        were OLDPWD and PWD, which matched incidentally on the substring). The
        session was therefore NOT launched through
        `python3 -m orchestration.adapter env`, so no adapter-set policy or
        backend variable is available to corroborate either value.

  model_verified: false
  model_verification_status: >-
    NOT VERIFIED. No adapter model receipt exists for this session and no
    identity probe was run.
  probe_run: false
  probe_note: >-
    NO PROBE WAS RUN AND NONE IS RECORDED. An asked-the-model-what-it-is answer
    would be another self-report, not a verification, and AGENTS.md forbids
    recording an attestation that was not obtained.

  divergence:
    present: true
    description: >-
      The adapter resolves the requested policy `executor-implementation` to
      `anthropic:claude-sonnet-5`, while the runtime self-reports
      `claude-opus-5`. The two identifiers DISAGREE.
    which_is_authoritative: >-
      UNDETERMINED FROM THIS SESSION. The adapter output states what WOULD
      serve the policy under the configured bindings; it does not observe what
      DID serve this session. The self-report states what the session says it
      is; it is not independently checkable here. Neither is a measurement of
      the other.
    fallback_used: >-
      UNKNOWN, AND NOT ASSERTED EITHER WAY. `fallback_allowed` is false in the
      handoff. If the divergence reflects a substitution, that substitution was
      not requested by this executor, was not announced to it, and is not
      silently accepted here - it is reported.
    escalated: true
    escalation_route: >-
      Reported to the Coordinator in this task's return report and recorded
      here. This executor changed no binding, edited no agent file, selected no
      model, and did not attempt to re-launch under a different resolution.
    effort_agreement: >-
      The requested effort (medium) and the adapter-resolved effort (medium)
      AGREE. Only the model identifier diverges.
    bedrock_constraint: >-
      No provider, backend, endpoint or model identifier containing "Bedrock"
      (case-insensitively) was selected, requested or used. No backend was
      selected by this executor at all.

# ---------------------------------------------------------------------------
# LAUNCHING-PROMPT DISCLOSURE (CF-15)
# ---------------------------------------------------------------------------

launching_prompt_disclosure:
  why_disclosed: >-
    CF-15 requires disclosing what the launching prompt told this executor, so
    a reviewer can judge whether the conclusions were steered rather than
    found.
  what_the_launching_prompt_told_me:
    - >-
      It named the task, goal and batch (TASK-20260906-0fbf69, GOAL-SSI-001,
      BATCH-60d6b9) and instructed me to discharge CF-9, reading the task card,
      handoff, batch file, AGENTS.md, CLAUDE.md and my role contract first.
    - >-
      It stated as fact that RUN-WESOVOW-001 and RUN-WESOVOW-201692-001 both
      record `dirty_tree: true` in their manifests. I VERIFIED THIS RATHER THAN
      ACCEPTING IT: both manifests were read and both do record it.
    - >-
      It instructed me to work from committed artifacts and git history only,
      and to record each limb either as attested with the naming artifact and
      checksum, or as UNATTESTABLE with the unrecoverable fact and what would
      recover it.
    - >-
      IT TOLD ME, IN ADVANCE, THAT AN HONEST "UNATTESTABLE" IS A COMPLETE AND
      VALUABLE RESULT, that CF-9 had been held for two consecutive batches and
      is dispatched now so it stops being carried, and - explicitly - "Do not
      strain to attest something the artifacts cannot support"; "a manufactured
      attestation is far worse here than a recorded gap". THIS IS A PRESSURE
      TOWARD RECORDING GAPS, and it is disclosed as such. It did not cause me
      to suppress an attestation: RUN-WESOVOW-201692-001's limb ii DID resolve
      to a checksum match against a committed blob, and that positive finding
      is recorded in full even though the prompt made a negative finding
      comfortable.
    - >-
      Hard constraints it imposed: never edit a manifest; never re-run
      anything; never execute cost_model.py (its default output path names a
      committed run directory - CF-10); write only into my own task directory
      and produce exactly the declared artifacts; a `dirty_tree: true` run is
      NOT thereby invalid and this task does not adjudicate evidential status;
      restate the citation prohibition verbatim in every artifact and state
      whether it fired; discharging CF-9 lifts nothing; never fabricate a
      command, output, checksum, commit sha or citation, and never reconstruct
      a sha rather than read it from git; do not commit or push; change no
      status.
    - >-
      It gave the return format: per-limb verdicts, whether
      source_sha256_at_run matched a committed blob with both digests, the null
      object's result, the unrecoverable facts, and every limitation.
  what_the_launching_prompt_did_not_tell_me: >-
    It did not tell me what answer to reach for either run, did not assert that
    either run was valid or invalid, and did not supply any digest, commit sha
    or output value. Every sha, digest and command output in the companion
    artifact was read from this repository by a command quoted alongside it.
  steering_assessment: >-
    The prompt steered METHOD (checksum-bound, read-only, gaps recorded) and
    did not steer CONCLUSION. The two runs received different verdicts -
    UNATTESTABLE and PARTIALLY ATTESTED - and the null object received a third,
    ATTESTED, which is the evidence that the procedure was not pre-committed to
    an outcome.

