# ---------------------------------------------------------------------------
# WHAT THIS RECORD IS AND IS NOT
# ---------------------------------------------------------------------------

what_this_record_is: >-
  A new, independent record establishing - limb by limb, from COMMITTED
  ARTIFACTS AND GIT HISTORY ONLY - what can and cannot be attested about the
  execution provenance of the two EXP-WESOVOW-001 runs whose manifests record
  `dirty_tree: true`: RUN-WESOVOW-001 and RUN-WESOVOW-201692-001. Neither
  manifest was read for its results and neither was edited, annotated or
  extended. Nothing was re-run.

what_this_record_is_not:
  - >-
    NOT an adjudication of either run's evidential status. A `dirty_tree: true`
    run is not thereby invalid and this record does not make it so. Whether
    either run's evidence stands is a Coordinator decision on reviewed
    evidence, not an executor's finding.
  - >-
    NOT a statement about whether either run's RESULTS are right or wrong.
    Provenance recoverability and numerical correctness are independent, and
    this record asserts nothing about the latter in either direction.
  - >-
    NOT mathematical evidence of any kind. AN INFRASTRUCTURE GAP IS NEVER A
    MATHEMATICAL RESULT. Nothing established below is evidence about the cost
    model, the frozen contract, the Wesolowski paper, van Oorschot-Wiener
    tradeoffs, supersingular isogeny problems, or any isogeny or discrete-log
    problem, in either direction. A limb recorded UNATTESTABLE below says a
    fact about a filesystem and a git object store is unrecoverable; it says
    nothing whatsoever about mathematics. A limb recorded ATTESTED likewise
    proves only that bytes are recoverable.
  - >-
    NOT a lifting or narrowing of any prohibition. See
    `citation_prohibition` below.

# ---------------------------------------------------------------------------
# CITATION PROHIBITION - RESTATED VERBATIM, LIFTED BY NOTHING HERE
# ---------------------------------------------------------------------------

citation_prohibition:
  retained_sentence_verbatim: >-
    The `P=512` crossover value and its `w=2^80` sign are **NOT
    citation-eligible**. This task does not lift that prohibition. Only a
    committed Coordinator decision on independently reviewed evidence can lift
    it.
  predicate_extension_verbatim: >-
    In addition to the retained sentence, a row of any EXP-WESOVOW-001
    reconciliation is NOT citation-eligible when either (a) the two anchors
    disagree in the SIGN of the baseline comparison at that row, or (b) the
    smaller |margin| across the two anchors at that row is below that field
    size's anchor gap |Delta log2 T_full + Delta log2 M / 2|.
  did_the_retained_sentence_fire: >-
    NO - it did not fire, because no occasion for it arose. This record cites
    no crossover value, no sign, no margin, no delta, no speedup and no
    PAPER_PAIRS entry. Every reference to run output below is BY LOCATOR
    (path, field name, byte digest) and never by value. The prohibition was
    therefore never approached, let alone tested.
  did_the_predicate_extension_fire: >-
    NO - it did not fire, for the same reason: no reconciliation row is cited
    by value or by outcome anywhere in this record.
  discharging_cf_9_lifts_nothing: >-
    STATED EXPLICITLY BECAUSE THE OPPOSITE READING WOULD BE THE WORST OUTCOME
    OF THIS TASK. CF-9 is ONE GROUND among several on which the citation
    prohibition is retained. The other grounds - the anchor recorded
    `off_curve` at three of five field sizes, CF-7's undischarged remainder for
    the reconciliation procedure, the free overhead knob, and RT-2's `A > 0`
    antecedent - are entirely untouched by anything found here and are neither
    strengthened nor weakened by it. Discharging CF-9 removes one ground; it
    does not lift, narrow, soften or create an exception to the prohibition,
    and the findings below - including the ATTESTED ones - may not be cited as
    a reason to revisit it. Only a committed Coordinator decision on
    independently reviewed evidence can lift it.

# ---------------------------------------------------------------------------
# METHOD
# ---------------------------------------------------------------------------

method:
  binding_rule_cf_17: >-
    BIND TO A CHECKSUM, NEVER TO A NARRATIVE. `dirty_tree: true` means the
    bytes executed NEED NOT equal any committed bytes, so the proposition "the
    recorded commit exists and is reachable" attests THE COMMIT and not THE
    EXECUTION. Every ATTESTED verdict below names the digest and the
    recoverable object it binds to. Where only a plausible story was available,
    the verdict is UNATTESTABLE - except in the one place where a story was
    CONVERTED into a checksum test and the test was run
    (limb_iii of RUN-WESOVOW-001, `identifier_substitution_test`).
  verdict_definitions:
    ATTESTED: >-
      The exact bytes in question are identified and match a recoverable
      object by computed digest.
    PARTIALLY_ATTESTED: >-
      Named sub-facts are recoverable and named sub-facts are not. Both lists
      are stated.
    UNATTESTABLE: >-
      The exact unrecoverable fact is named, with why it is unrecoverable and
      what would recover it.
  unattestable_is_a_complete_result: >-
    Contracted in advance by the task card and the handoff, so it cannot be
    read afterwards as a failure of this task.
  read_only_discipline: >-
    Only read-only git commands (cat-file, ls-tree, show, log, rev-list,
    rev-parse, merge-base, for-each-ref, status) and sha256sum were used, plus
    one read-only scan script in a scratchpad OUTSIDE the repository. No
    experiment code was executed. `experiments/EXP-WESOVOW-001/cost_model.py`
    was neither executed nor modified, with or without WESOVOW_RAW_PATH set.
    Zero new experiment runs; the batch authorized zero.
  repository_state_at_attestation:
    command: git rev-parse HEAD
    output: 0b0719711e67b3b83b5290f472626d99dc7347a6
    branch_command: git branch --show-current
    branch_output: claude/isogeny-search-prime-fields-5xcc2x
    working_tree_command: git status --porcelain
    working_tree_output: >-
      (empty at the time of every hash computation below - the working tree was
      clean, so every `sha256sum <path>` in this record equals the sha256 of
      the blob at HEAD for that path)
  procedure_deviation_recorded_not_discarded:
    what_happened: >-
      One early command was written as
      `git show cf82d44f...:experiments/EXP-WESOVOW-001/cost_model.py 2>&1 |
      sha256sum`, which merged stderr into the hashed stream. The path does not
      exist at that commit, so the command hashed git's error text and emitted
      the digest `e0aff5fdb62550c97e2662c0876e6177d07804a5d2fc5804eae9689ac9a4ecdb`.
    disposition: >-
      THAT DIGEST IS RETRACTED AND IS NOT THE DIGEST OF ANY BLOB. It is
      recorded here rather than deleted. The command was re-run with stderr
      separated; its verbatim output appears in limb_ii of RUN-WESOVOW-001
      below and is `fatal: path ... exists on disk, but not in
      'cf82d44f636d056a492ab415bea19270b7b10a7d'` with exit code 128. All other
      digests in this record were computed with stderr separated or from
      `git cat-file blob <blobid>`.

