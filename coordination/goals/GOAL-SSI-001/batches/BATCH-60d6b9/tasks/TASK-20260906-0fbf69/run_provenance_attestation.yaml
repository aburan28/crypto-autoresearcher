              disk, but not in 'cf82d44f636d056a492ab415bea19270b7b10a7d'
            exit_code: 128
        the_exact_unrecoverable_fact: >-
          THE SHA256 OF THE BYTES OF cost_model.py THAT THE INTERPRETER
          ACTUALLY EXECUTED AT 2026-07-25T00:33:34Z IS UNRECOVERABLE. Two
          independent reasons, either of which alone is sufficient: (1) the
          manifest records NO source digest field of any kind for this run, so
          there is nothing to compare against; and (2) the recorded
          `commit_at_run_time` does not contain the experiment directory at
          all, so the recorded commit cannot supply a candidate blob even in
          principle. The source was untracked at run time - which the run's own
          `dirty_summary` asserts and which the empty `git ls-tree` above
          independently confirms.
        why_it_cannot_be_recovered_now: >-
          The executing checkout was `/Volumes/Volume/crypto-autoresearcher` on
          a "Kimi Work managed runtime" host. Untracked bytes on a host that no
          longer exists in this record's reach leave no object in this
          repository. No digest of them was taken at run time, so no later
          object can be tested against them.
        the_closest_recoverable_candidate_and_why_it_is_not_an_attestation:
          candidate_blob: b48c63d640b6c7250992a075fab9b4213317d3b2
          candidate_path_at_that_commit: experiments/EXP-P13VOW-001/cost_model.py
          candidate_commit: f397c011e46f67c793197a24e7d1c07fe9ffab59
          candidate_commit_authored: 2026-07-24T17:41:27-07:00
