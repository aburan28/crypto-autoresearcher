null_object:
  why_it_is_not_optional: >-
    A PROCEDURE THAT RETURNS UNATTESTABLE FOR EVERYTHING CARRIES NO
    INFORMATION, and its verdicts on the two real runs would be worthless -
    F-1's lesson (a check that cannot fire) in a different instrument. The same
    procedure was therefore applied unchanged to a run recording a CLEAN tree.
  was_a_committed_one_found: >-
    YES. No manifest anywhere under experiments/ records the exact string
    `dirty_tree: false` (`grep -rl "dirty_tree: false" experiments/
    --include='manifest*.yaml'` returned nothing, count 0), but many record the
    equivalent `dirty: false` under `run.code`. One was selected. NOTHING WAS
    CONSTRUCTED IN THE SCRATCHPAD; the null object is a real committed record.
  selection:
    chosen: experiments/EXP-ECDLP-fce71d/runs/RUN-ECDLP-fce71d-001/manifest.yaml
    why_chosen: >-
      It records `run.code.dirty: false`, a 40-hex commit, a command naming its
      source path, AND a `frozen_input_sha256` - so it offers a digest
      comparison that can actually FAIL, which is the property the null object
      needs.
    first_candidate_rejected_and_why_that_is_recorded: >-
      RUN-GGM-s1-b8 (experiments/EXP-GGM-001/runs/RUN-GGM-s1-b8/manifest.yaml)
      was examined first. It records `dirty: false` and commit
      7ec5251ff6c23cbc26ada90ecb0fced928f84b85, which `git cat-file -t` reports
      as `commit` and `git merge-base --is-ancestor ... HEAD` accepts (exit 0);
