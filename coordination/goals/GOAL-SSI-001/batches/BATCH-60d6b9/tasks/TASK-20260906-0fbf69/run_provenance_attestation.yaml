          why_this_is_not_an_attestation: >-
            THIS IS EXACTLY THE NARRATIVE CF-17 FORBIDS TREATING AS PROOF. That
            an archive commit landed eight minutes after the run is
            circumstantial, not a checksum. NOTHING recorded at run time binds
            the executed bytes to this blob: the run took no source digest, so
