        what_this_attests: >-
          THE COMMIT EXISTS AND IS AN ANCESTOR OF HEAD AND OF `main`. That is
          all. Per CF-17 this attests THE COMMIT, NOT THE EXECUTION.
        what_this_does_not_attest: >-
          It does not attest that any byte executed on 2026-07-25 is present in
          that commit. Limb ii shows that in fact the experiment's source path
          did not exist at that commit at all.

      - limb: ii
        question: >-
          Does a recorded `source_sha256_at_run` match the sha256 of the
          committed blob of the file it names at that commit?
        verdict: UNATTESTABLE
        commands_and_verbatim_output:
