      experiments/EXP-GGM-001/simulability_test.py` returns EMPTY - the source
      named by its command does not exist at its recorded commit. Its limb ii
      would therefore also be UNATTESTABLE, which would have left the procedure
      undiscriminating. It was set aside for a null object that could return
      ATTESTED, and the rejection is recorded here rather than dropped. NOTE: a
      digest was NOT computed for that absent path; an early attempt piped
      git's error into sha256sum and the resulting value is retracted (see
      method.procedure_deviation_recorded_not_discarded).
