        manifest.yaml
        raw-result-attempt-001-invalid-map-root.json
        raw-result.json
        stderr.log
        stdout.log
  what_the_procedure_returned_on_the_null_object:
    limb_i: ATTESTED
    limb_ii: >-
      ATTESTED. Because `dirty: false` is recorded, the executed bytes are
      claimed to be the tree at f75f915f, and that tree IS recoverable: the
      named source exists there as blob cbaf4f62 with sha256 ab3ab2e9...e451.
      The one digest the manifest records that CAN be tested -
      `frozen_input_sha256` - was tested and MATCHED bc561cf6...432b8 exactly.
    limb_iii: ATTESTED (first-add commit identified; artifacts present)
    limb_iv: >-
      NOT APPLICABLE - no `dirty_summary` exists because the tree is recorded
      clean. This is itself informative: the limb that is unrecoverable for
      both dirty runs simply does not arise here.
    limb_v: >-
      PARTIALLY_ATTESTED - environment.json and command.txt exist and are
      committed, but their contents are version strings, i.e. testimony, the
      same residual as for RUN-WESOVOW-201692-001.
    summary_verdict: ATTESTED
  did_the_null_object_return_a_different_answer: >-
    YES, AND IN THE DIRECTION THAT MATTERS. The procedure returned a SUMMARY
    VERDICT OF ATTESTED on the clean-tree run and did NOT return ATTESTED for
    either dirty-tree run (UNATTESTABLE for RUN-WESOVOW-001, PARTIALLY
    ATTESTED for RUN-WESOVOW-201692-001). The specific check that separated
    them is the digest comparison at limb ii, which MATCHED on the null object,
    was IMPOSSIBLE TO EVEN POSE for RUN-WESOVOW-001 (no digest recorded, path
    absent at the commit), and MISMATCHED against the recorded commit for
    RUN-WESOVOW-201692-001 while matching a different, later blob. The
    procedure is therefore capable of firing and capable of passing; its
    verdicts on the two real runs are not artifacts of a check that can only
    say no.
  honest_limits_of_the_null_object:
    - >-
      One null object was run, not a family. It shows the procedure CAN return
      ATTESTED; it does not measure how often it does.
    - >-
      The null object's limb ii rests on `dirty: false` being TRUE, which is
      itself self-reported. The procedure inherits that: for a clean-tree run
      it attests "the recorded commit's bytes are recoverable and the recorded
      digest matches them", not "the interpreter loaded them". The same
      residual named for RUN-WESOVOW-201692-001 applies here, so the
      discrimination demonstrated is real but bounded.
    - >-
      The first candidate (RUN-GGM-s1-b8) shows that `dirty: false` alone does
      NOT guarantee an ATTESTED verdict: its source path is absent at its
      recorded commit. That is recorded as an incidental observation about a
      record outside this task's scope. It is NOT a finding about EXP-GGM-001,
      it was not investigated further, and nothing follows from it here.

