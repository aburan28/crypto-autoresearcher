            output: >-
              cf82d44f636d056a492ab415bea19270b7b10a7d|e428a4a1937fd4e4b93577df3ab057a24ac85755|Adam
              Buran|aburan28@gmail.com|2026-07-24T17:15:30-07:00|2026-07-24T17:15:30-07:00|research:
