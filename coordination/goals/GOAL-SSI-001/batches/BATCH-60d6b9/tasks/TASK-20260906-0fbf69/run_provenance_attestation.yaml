facts_that_remain_unrecoverable_consolidated:
  - fact: The sha256 of the cost_model.py bytes executed by RUN-WESOVOW-001.
    why: No source digest was recorded; the path was untracked and absent from the recorded commit; the host is out of reach.
    what_would_recover_it: A run-time source digest in the manifest, or an archive receipt with source_path_sha256 for the 2026-07-24 archive. Neither exists and neither can be created now.
  - fact: The working-tree state of either executing checkout at its invocation instant.
    why: Neither run captured `git status --porcelain` output to an artifact; both recorded prose summaries instead.
    what_would_recover_it: Capture of the porcelain output plus per-path digests at invocation time.
  - fact: An independent witness that RUN-WESOVOW-201692-001's interpreter loaded blob a7ec7fd1.
    why: The source digest is self-reported by the executing wrapper; the snapshot receipt is a second record written after the fact over the same working tree.
    what_would_recover_it: A wrapper-external preflight digest artifact, or an independent deterministic re-execution compared against raw-result.json d65442b6...130c - not attempted here, barred by this task and by CF-10.
  - fact: The machine, interpreter build and library binaries for both runs.
    why: Attested by version strings only; RUN-WESOVOW-001 has no environment.json or runtime receipt at all.
    what_would_recover_it: Digests of the interpreter/library artifacts or a container image digest recorded at invocation.
  - fact: Whether RUN-WESOVOW-201692-001's invocation-time source modification was the APPROVED repair rather than some other modification.
    why: A governance fact about intent; no checksum can carry it.
    what_would_recover_it: Comparison against the frozen protocol amendment's own declared source digest, if it carries one - outside this limb's scope and not performed here.
  - fact: The receipts of the earlier RUN-WESOVOW-001 development execution.
    why: The manifest records that they were OVERWRITTEN by the final run.
    what_would_recover_it: Nothing. They no longer exist.

limitations_of_this_attestation:
  - >-
    SCOPE. Only two runs plus one null object were examined, and only their
    provenance. No result, metric, control outcome or reconciliation row was
    read for its value, and none appears here.
  - >-
    EVERY DIGEST HERE WAS COMPUTED ON THIS CHECKOUT AT HEAD
    0b0719711e67b3b83b5290f472626d99dc7347a6 with a clean working tree, so
    `sha256sum <path>` equals the sha256 of the blob at HEAD. A reader on a
    different commit must recompute.
  - >-
    THIS RECORD CANNOT DISTINGUISH AN HONEST RECORD FROM A CONSISTENT ONE. Every
    positive finding is of the form "digest X recorded in artifact A equals the
    digest of recoverable bytes B". Where A and B were produced by the same
    session, agreement shows internal consistency, which is weaker than
    independent corroboration. This limitation is named per limb rather than
    hidden in a summary.
  - >-
    ONE ARCHIVE RECEIPT WAS RELIED ON AS A SECOND RECORD
    (TASK-20260809-981821). Its `commit_sha` is null and its verification
    status is `pending_post_commit`; it was used as a CONTENT binding only,
    with all nine declared path digests recomputed, per CLAUDE.md's rule that
    receipts bind to content first.
  - >-
    NO RE-EXECUTION, HENCE NO REPRODUCTION CHECK. The strongest available
    provenance test for a deterministic model - rerun and compare output
    digests - was neither performed nor is it available: this task forbids it,
    CF-10 makes cost_model.py's default output path a hazard to a committed run
    directory, and a re-run is a new execution rather than evidence about an
    old one. Any future reproduction attempt must set an output path OUTSIDE
    every committed run directory.
  - >-
    THE RENAME FINDING IS REPORTED, NOT ADJUDICATED. That RUN-WESOVOW-001's
    archived bytes were modified in place on 2026-08-02 is an operational
    observation about run-record immutability handling. Whether it requires any
    corrective record is a Coordinator matter; this executor neither judges it
    nor acts on it, and changed no status.
  - >-
    BUDGET AND EXECUTION COUNT. Zero experiment runs were executed against a
    budget of maximum_runs 4, of which this batch authorized zero. Only
    read-only git commands, sha256sum, and one read-only scan script in a
    scratchpad outside the repository were used. No budget was exhausted.

closing_statement_required_by_the_contract: >-
  An infrastructure gap is never mathematical evidence. Everything recorded
  above concerns bytes, commits, digests and files. Not one line of it is
  evidence for or against the EXP-WESOVOW-001 cost model, the frozen contract,
  the Wesolowski result, any van Oorschot-Wiener tradeoff, or any isogeny or
  discrete-logarithm problem, in either direction. That RUN-WESOVOW-001's
  provenance is UNATTESTABLE does not make its numbers wrong, and that
  RUN-WESOVOW-201692-001's provenance is largely recoverable does not make its
  numbers right; provenance recoverability and numerical correctness are
  independent and this record asserts only the former. The `P=512` crossover
  value and its `w=2^80` sign remain NOT citation-eligible, this task lifts
  nothing, and CF-9's discharge removes one ground among several while leaving
  the others exactly as they stood.
