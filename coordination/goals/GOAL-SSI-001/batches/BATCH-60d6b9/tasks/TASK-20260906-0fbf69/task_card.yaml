task_card:
  id: TASK-20260906-0fbf69
  goal_id: GOAL-SSI-001
  batch_id: BATCH-60d6b9
  title: >-
    Attest, or record as unattestable, the execution provenance of the two runs
    whose manifests carry `dirty_tree: true` - RUN-WESOVOW-001 and
    RUN-WESOVOW-201692-001.
  role: executor
  state: queued
  review_required: false
  reviewed_by: TASK-20260906-ba0284
  archived_by: TASK-20260906-9f3e2a
  depends_on: []
  review_plan_ref: coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/review_plan.yaml

  what_cf_9_actually_asks: >-
    Not "were these runs correct". ONLY: what, from COMMITTED ARTIFACTS AND GIT
    HISTORY, can be established about WHAT WAS EXECUTED - and what cannot. Both
    manifests record `git.dirty_tree: true`, which means the bytes executed NEED NOT
    equal any committed bytes. `experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-001/manifest.yaml`
    records `commit_at_run_time` and `dirty_tree: true`;
    `.../RUN-WESOVOW-201692-001/manifest.yaml` records a commit, `dirty_tree: true`,
    a `dirty_summary`, and a `source_sha256_at_run` WHICH NOBODY HAS EVER CHECKED
    AGAINST A COMMITTED BLOB. Checking it is the single most decisive thing this task
    can do.

  attest_limb_by_limb_then_summarise:
    - (i) Does `git.commit_at_run_time` exist in this repository and is it reachable? Show the command and its verbatim output.
    - >-
      (ii) Where a `source_sha256_at_run` is recorded, does it match the sha256 of the
      COMMITTED BLOB of the file it names at that commit? COMPUTE IT - `git show
      <sha>:<path>` piped to a sha256 - and quote both digests. Do not assume, and do
      not infer a match from a plausible narrative.
    - (iii) Which of the run's declared artifacts exist, are committed, and at which commit was each first added?
    - (iv) What does the recorded `dirty_summary`, where one exists, establish and what does it merely assert?
    - (v) What do environment.json and the runtime-session receipt establish about the machine, the interpreter and the invocation?
  verdicts_and_their_definitions:
    ATTESTED: The exact bytes executed are identified and match a recoverable object.
    PARTIALLY ATTESTED: Named limbs recoverable, named limbs not. State both lists.
    UNATTESTABLE: State exactly which fact is unrecoverable, why, and what would recover it.
  unattestable_is_a_complete_result: >-
    CONTRACTED IN ADVANCE, SO IT CANNOT BE READ AS FAILURE AFTERWARDS. If the
    provenance of one or both runs cannot be recovered, that is the answer, it is
    worth having, and it is recorded plainly. An infrastructure gap is NEVER
    mathematical evidence: nothing you find is evidence about the cost model, the
    contract, the paper or any isogeny problem, in either direction, and your record
    must say so in its own words. Do not assert or imply that the runs' RESULTS are
    right or wrong because of what provenance you could recover.

  bind_to_a_checksum_never_to_a_narrative: >-
    CF-17 is the standing rule and it binds this method even though CF-17 itself is
    not dispatched: a provenance claim binds to the CHECKSUM of bytes, never to value
    containment or to a plausible story. A different paper containing four of the ten
    values would have been PARTIALLY ACCEPTED by a containment-style identity check
    and only the checksum rejected it. Here the same trap reads: `the commit exists
    and is reachable` attests THE COMMIT, not THE EXECUTION, and a record that slides
    from one to the other has overstated.

  the_null_object_is_not_optional: >-
    Apply your procedure to a run manifest recording `dirty_tree: false`. Find a
    committed one if it exists; if none does, construct one in your scratchpad and
    say plainly that you did. A PROCEDURE THAT RETURNS UNATTESTABLE FOR EVERYTHING
    CARRIES NO INFORMATION, and its verdicts on the two real runs would be worthless
    - which is F-1's lesson (a check that cannot fire) in a different instrument.
    Report what your procedure returned on the null object.

  what_you_must_not_do:
    - >-
      DO NOT EDIT, ANNOTATE OR ADD A FIELD TO EITHER MANIFEST, or to anything else
      under experiments/ or inputs/. Run records are IMMUTABLE. An immutable record
      that turns out to be unattestable stays exactly as it is; your attestation is a
      NEW record in your own task directory.
    - >-
      DO NOT RE-RUN ANYTHING, AND DO NOT EXECUTE
      experiments/EXP-WESOVOW-001/cost_model.py, with or without WESOVOW_RAW_PATH
      set. ITS DEFAULT RAW-OUTPUT PATH NAMES THE COMMITTED RUN DIRECTORY
      RUN-WESOVOW-201692-001 (CF-10), so a single careless invocation overwrites a
      committed run artifact - the exact evidence-integrity hazard you are attesting
      around. RE-RUNNING IS NOT A WAY TO ATTEST ANYTHING: it would produce a new
      execution, not evidence about the old one.
    - >-
      DO NOT COPY ANY VALUE OUT OF A RAW RESULT OR A STDOUT. raw-result.json and
      stdout.txt are inside your reading radius; no PAPER_PAIRS value, delta,
      crossover, margin, sign or speedup may appear in your record. Name rows and
      fields BY LOCATOR.
    - >-
      DO NOT SUGGEST THAT DISCHARGING CF-9 LIFTS OR NARROWS THE CITATION
      PROHIBITION. CF-9 is ONE GROUND among several on which it is retained; the
      others - the anchor recorded off_curve at three of five field sizes, CF-7's
      undischarged remainder for the reconciliation procedure, the free overhead knob,
      and RT-2's `A > 0` antecedent - are untouched by whatever you find. Only a
      committed Coordinator decision can lift it.
    - >-
      DO NOT RECONSTRUCT, ESTIMATE OR GUESS a commit sha, a parent sha or a hash.
      Every git command appears in the record with its exact text and its verbatim
      output, or it is not claimed.

  citation_prohibition_verbatim: >-
    The `P=512` crossover value and its `w=2^80` sign are **NOT citation-eligible**.
    This task does not lift that prohibition. Only a committed Coordinator decision
    on independently reviewed evidence can lift it.
  citation_prohibition_predicate_extension_verbatim: >-
    In addition to the retained sentence, a row of any EXP-WESOVOW-001
    reconciliation is NOT citation-eligible when either (a) the two anchors disagree
    in the SIGN of the baseline comparison at that row, or (b) the smaller |margin|
    across the two anchors at that row is below that field size's anchor gap |Delta
    log2 T_full + Delta log2 M / 2|.

