schema: crypto.autoresearch.runtime_session_receipt.v1
# WHAT ACTUALLY RAN, WHO ACTUALLY ANSWERED, AND WHAT THE SESSION WAS TOLD.
# Nothing below is a probe result unless it says a probe was run, and no probe
# was run. Where a value could only be self-reported it is labelled
# self-reported and is not presented as verified.
runtime_session_receipt:
  task_id: TASK-20260906-ee372e
  batch_id: BATCH-60d6b9
  goal_id: GOAL-SSI-001
  role: executor
  recorded_at: '2026-09-06'
  runtime: claude_code

  # =====================================================================
  citation_prohibition_restated_verbatim: >-
    The `P=512` crossover value and its `w=2^80` sign are **NOT
    citation-eligible**. This task does not lift that prohibition. Only a
    committed Coordinator decision on independently reviewed evidence can lift
    it.
  citation_prohibition_predicate_extension_restated_verbatim: >-
    In addition to the retained sentence, a row of any EXP-WESOVOW-001
    reconciliation is NOT citation-eligible when either (a) the two anchors
    disagree in the SIGN of the baseline comparison at that row, or (b) the
    smaller |margin| across the two anchors at that row is below that field
    size's anchor gap |Delta log2 T_full + Delta log2 M / 2|.
  did_either_limb_fire_on_this_artifact: >-
    NEITHER FIRED, AND NEITHER IS LIFTED. This receipt reports provenance,
    hygiene checks and hashes. It derives, recomputes, tabulates and cites no
    crossover value, no baseline-comparison sign, no margin and no speedup.

  # =====================================================================
  inference_provenance:
    requested_policy: executor-implementation
    requested_reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    adapter_resolution:
      command: python3 -m orchestration.adapter resolve --role executor
      stdout_verbatim: 'executor-implementation -> anthropic:claude-sonnet-5 (effort=medium)'
      resolved_backend: anthropic
      resolved_model_identifier: claude-sonnet-5
      resolved_effort: medium
    session_self_report:
      model_identifier: claude-opus-5
      how_obtained: >-
        SELF-REPORTED FROM THE SESSION'S OWN SYSTEM PROMPT, which states "You are
        powered by the model named Opus 5. The exact model ID is claude-opus-5."
        NO PROBE WAS RUN. There is no API call, no /model output and no external
        attestation behind this value, and it is recorded as a self-report and
        not as a measurement.
      reasoning_effort_self_report: >-
        NOT OBSERVABLE FROM INSIDE THE SESSION. The effort a subagent runs at is
        set by its .claude/agents/ frontmatter, which this session did not read
        and cannot confirm from its own state. `medium` is what the handoff
        requested and what the adapter resolves; whether it was applied is not
        something this receipt can attest.
    model_verified: false
    probe_run: false
    divergence:
      present: true
      what_diverges: >-
        The adapter resolves the executor-implementation policy to
        anthropic:claude-sonnet-5. The session self-reports as claude-opus-5.
        These are different model identifiers for the same role in the same
        repository state.
      escalated: true
      escalated_how_and_to_whom: >-
        RECORDED HERE, IN THE ARTIFACT THE COORDINATOR AND THE REVIEWER BOTH
        READ, AND STATED IN THE EXECUTOR'S RETURN REPORT TO THE COORDINATOR. It
        is a Coordinator matter: this task has no authority to change a binding,
        to select a model, or to re-run itself under another one, and doing any
        of those would be a worse answer than reporting the divergence.
      was_it_a_fallback: >-
        UNKNOWN AND NOT ASSERTED EITHER WAY. `fallback_allowed: false` is
        declared in the handoff. This session did not select a provider, a
        backend, an endpoint or a model identifier; it was launched into an
        already-resolved environment and cannot see how that environment was
        chosen. Recording `fallback_used: false` would be an attestation this
        session cannot make, and recording `true` would be a claim about a
        decision it did not observe. The divergence above is the observation;
        its cause is not.
      what_it_does_and_does_not_affect: >-
        It affects who to ask about the artifacts, not what the artifacts say.
        Every mechanical result in amendment_parse_control_report.yaml was
        produced by running a committed script under CPython 3.11.15 and PyYAML
        6.0.1 and is re-runnable by anyone; none of it depends on which model
        wrote the script. The redraft's editorial judgments do depend on the
        model, and that is what the divergence bears on.
    environment_variables_observed: >-
      Neither AUTORESEARCH_POLICY nor AUTORESEARCH_BACKEND was set in this
      session's environment; `env | grep -i "AUTORESEARCH\|ANTHROPIC_MODEL\|CLAUDE_MODEL"`
      returned no matching variable. The session was therefore not launched
      through `python3 -m orchestration.adapter env`, which is itself part of
      the divergence above.
    bedrock_check: >-
      No provider, backend, endpoint or model identifier containing "bedrock"
      (case-insensitively) was selected, requested or used. Nothing was selected
      by this session at all.

  # =====================================================================
  launching_prompt_disclosure_CF_15:
    was_there_one: true
    what_it_contained_that_goes_beyond_pointers: >-
      DISCLOSED IN FULL BECAUSE IT MATERIALLY SHAPED THE WORK AND A READER WHO
      DOES NOT KNOW THAT WILL OVER-CREDIT THIS SESSION'S INDEPENDENCE. The
      launching prompt did not merely name the task card and the records to
      read. It also: (1) stated RT-1's content, including that the failing text
      is 9 lines with 8 continuations, that a verbatim splice raises a
      ParserError, and that indenting the continuations past the key makes the
      file parse with a well-formed 7-element metrics list; (2) named the trap
      that the unamended frozen file already satisfies P1-P3 and stated that the
      control must therefore assert content identity; (3) enumerated all five
      negative objects and the outcome each must produce; (4) stated that R3 was
      REFUTED and summarized the two missing premises; (5) stated that AC-1's
      pass region is exactly {alpha=1, delta=0} over a 144-shape sweep; and (6)
      instructed that clause_4 carries the most edits.
    what_that_means_for_independence: >-
      THIS SESSION'S CONSTRUCTION OF THE FIVE NEGATIVE OBJECTS IS NOT
      INDEPENDENT OF ITS LAUNCHING PROMPT, and its agreement with RT-1's parse
      result is not independent of RT-1, which it read before running anything.
      What IS this session's own: performing the splices and running the control
      (the results are mechanical and re-runnable by anyone), finding and fixing
      the anchor-shift defect in its own control, and the wording of the redraft.
      The design of the control's assertion set was substantially specified for
      it.
    was_any_of_it_treated_as_authority: >-
      NO. The prompt directed the work; it approved nothing, moved no status and
      was not treated as evidence. Every constraint acted on was verified in the
      committed task card at
      coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/task_card.yaml
      and the committed handoff at ledger/handoffs/TASK-20260906-ee372e.yaml,
      both of which were read in full before anything was written. Where the
      prompt and the card overlap, the card and the queue's handoff block were
      followed.

  # =====================================================================
  budget:
    declared_wall_clock_seconds: 5400
    declared_memory_gb: 2
    declared_maximum_runs: 6
    wall_clock_used_seconds_approx: 900
    wall_clock_measurement_note: >-
      APPROXIMATE AND STATED AS SUCH. Bounded by two `date -u` observations
      inside the session, 2026-09-06T05:34Z to 2026-09-06T05:50Z, plus the time
      to write the final two artifacts. It is a bound on this session's own
      elapsed time, not a measured process runtime, and no per-command timing
      was instrumented.
    memory: >-
      Not instrumented and not claimed. The heaviest operation performed was
      yaml.safe_load over a 167-line file, repeated a few dozen times; peak
      usage was far below the 2 GB cap and no cap was approached, but no
      measurement is offered.
    runs_executed: 0
    runs_statement: >-
      ZERO EXPERIMENT RUNS WERE EXECUTED, and this batch authorizes zero. No run
      directory was created, no manifest was written, no raw-result.json was
      produced, and no run record exists for this task. Per DEC-20260904-166ab5
      PD-4 the control script and the scratch probes are NOT runs; they write
      nothing, produce no run record, and execute no experiment code. The
      maximum_runs budget of 6 is therefore untouched.
    budget_exhaustion: none. No limit was reached or approached.

  # =====================================================================
  prohibited_actions_and_how_each_was_checked:
    specification_yaml_not_edited:
      statement: >-
        experiments/EXP-WESOVOW-001/specification.yaml was NOT edited - not one
        line, not a comment, not a reformat - was not moved, was not staged, and
        no amended copy of it was written anywhere inside the repository, even
        temporarily, even under another name. Every splice was performed on an
        in-memory string.
      how_checked: >-
        `sha256sum experiments/EXP-WESOVOW-001/specification.yaml` returned
        c5cc16f7033407dd098fcba3ee79edca19c1f9a8aad2175e352db1a30fc4aa52 and
        `git rev-parse HEAD:experiments/EXP-WESOVOW-001/specification.yaml`
        returned blob 989d1eaffd7406c6166739ec22f80a2a526a87c7; `git status
        --porcelain -- experiments/` returned zero lines and `git diff --stat
        HEAD -- experiments/` returned zero lines. The control script opens
        every file with io.open(path, "r").
    cost_model_py_neither_executed_nor_modified:
      statement: >-
        experiments/EXP-WESOVOW-001/cost_model.py was NOT executed, with or
        without WESOVOW_RAW_PATH set, was NOT imported, and was NOT modified.
        This task did not even read it as text - which the batch would have
        permitted - so the blast-radius line numbers 60-66, 239, 288-289 and 302
        carried into the redraft are carried from the superseded draft and from
        the BATCH-79a0cb red-team report, which records that it verified them by
        reading the file as text. That is a limitation of this task and is
        disclosed in the redraft at
        blast_radius.frozen_artifacts, key
        how_this_was_checked_and_the_disclosure_it_requires.
      how_checked: >-
        No command in this session names cost_model.py as an argument to python3
        or to any reader; the control script names it only inside a docstring
        and a comment. `git status --porcelain -- experiments/` returned zero
        lines, so it is byte-unmodified.
    immutable_artifacts_untouched:
      statement: >-
        Nothing under experiments/, inputs/,
        coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/ or
        coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/ was written,
        edited, annotated, marked, renamed or deleted. The BATCH-752ef2 draft
        was read read-only and parsed read-only; it carries no marker from this
        task. The supersession is stated from the redraft's own side only.
      how_checked: >-
        `git status --porcelain -- experiments/ inputs/
        coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/
        coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/` returned ZERO
        lines, and `git diff --stat HEAD` over the same four paths returned zero
        lines.
    write_scope:
      statement: >-
        Exactly four files were written into the repository, all inside
        coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/:
        protocol_amendment_redraft.yaml, amendment_parse_control.py,
        amendment_parse_control_report.yaml and this receipt. No fifth file, no
        directory outside that path, nothing in ledger/, nothing in knowledge/.
      how_checked: >-
        `git status --porcelain` was run after the control exercises and showed
        exactly two untracked paths, both inside the task directory; the
        remaining two artifacts are this report pair, written into the same
        directory. `ls` of the task directory shows the task card plus this
        task's artifacts and nothing else.
      scratchpad: >-
        All throwaway scripts, all captured stdout/stderr, and the three
        negative-object clause files live in
        /tmp/claude-0/-home-user-crypto-autoresearcher/856101d1-27f2-5a5a-bf76-1d39ceab2f65/scratchpad,
        OUTSIDE the repository. No amended copy of the contract was written even
        there; the splices were in memory.
    no_pycache_in_a_snapshot_bound_directory:
      statement: >-
        PYTHONDONTWRITEBYTECODE=1 was set on every invocation and the control
        script sets sys.dont_write_bytecode = True before importing anything.
        No __pycache__ exists inside this task's directory.
      pre_existing_one_disclosed: >-
        A __pycache__ DOES exist at
        coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/__pycache__,
        holding amendment_controls.cpython-311.pyc dated 2026-09-05 04:59:49 -
        a day before this task. It is gitignored (.gitignore:1) and untracked.
        THIS TASK DID NOT CREATE IT, did not refresh it, and imported nothing
        from that directory. Recorded so a reviewer who finds it knows whose it
        is; its mtime was read with `ls --time-style=full-iso`.
    no_status_moved:
      statement: >-
        No status was changed anywhere. EXP-WESOVOW-001 remains `approved` and
