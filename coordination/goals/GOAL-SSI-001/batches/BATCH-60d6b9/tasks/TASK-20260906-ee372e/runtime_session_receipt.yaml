    claim_ceiling:
      statement: >-
        No security, SQIsign, CSIDH, standardized-parameter, exponent or
        asymptotic claim is made in either direction anywhere in this package,
        and none is admissible from it. Nothing here measures anything about any
        isogeny problem. The strongest thing asserted is that a YAML file parses
        and has a stated shape.

  # =====================================================================
  what_this_session_could_not_do:
