  limitations:
    - >-
      THE CONTROL IS A SHAPE-AND-IDENTITY CONTROL AND NOTHING MORE. See
      is_this_controls_pass_entailed_by_its_own_construction. A pass means
      applicable, never correct.
    - >-
      ONLY clause_1 IS ON THE PASS/FAIL PATH. Clauses 2, 3 and 4 are spliced and
      their key lists REPORTED; no assertion is made on them, so a shape defect
      in one of them would be visible in this report but would not turn the
      control red.
    - >-
      THE SPLICE PROCEDURE IS THE AMENDMENT'S OWN DECLARATION AND THE CONTROL
      IMPLEMENTS IT RATHER THAN VALIDATING IT. If the declared columns or
      anchors are wrong for some other reading of the amendment, the control
      will not say so; it will faithfully check the wrong thing. J1's
      independent splice is the check on that.
    - >-
      OBJECT (c) TRIPS P2 BUT WOULD ALSO HAVE TRIPPED P4, for the independent
      reason that its text does not parse standalone as a single metrics item.
      P2 fires first and P2 is what it was built for, but it is not a clean
      single-cause object.
    - >-
      THE TWO SYNTHETIC OBJECTS' EXACT BYTES ARE PRODUCED BY FUNCTIONS IN THE
      COMMITTED SCRIPT, not stored as committed fixture files, because this
      task's artifact path set is exact and admits no fifth file. They are
      reconstructible by calling those functions; their sha256 values are
      recorded above.
    - >-
      THIS SESSION READ RT-1 BEFORE RUNNING ANYTHING. Its agreement with RT-1's
      parse result is NOT independent of RT-1. The independent check is J1's,
      by a different task.
    - >-
      YAML PARSING IS LIBRARY-SPECIFIC. Every result here is PyYAML 6.0.1 under
      CPython 3.11.15. Another YAML implementation could in principle disagree
      about a plain multi-line scalar; nothing here tests that, and the frozen
      contract's consumers in this repository use PyYAML.
