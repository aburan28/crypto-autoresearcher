schema: crypto.autoresearch.control_report.v1
# THE EXERCISED RESULT OF PC-1. Every result below was obtained by running the
# committed script; nothing here is asserted from reading it. A control
# described but not exercised does not count, and this file is what makes the
# previous round's CF-24 - mechanical results re-checkable from no committed
# artifact - dischargeable for this round.
control_report:
  id: PC-1-amendment-parse-control-exercised
  task_id: TASK-20260906-ee372e
  batch_id: BATCH-60d6b9
  goal_id: GOAL-SSI-001
  recorded_at: '2026-09-06'
  control_script: coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/amendment_parse_control.py
  amendment_under_test: coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/protocol_amendment_redraft.yaml
  frozen_contract_read_only: experiments/EXP-WESOVOW-001/specification.yaml
  superseded_draft_read_only: coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/protocol_amendment_draft.yaml

  # =====================================================================
  citation_prohibition_restated_verbatim: >-
    The `P=512` crossover value and its `w=2^80` sign are **NOT
    citation-eligible**. This task does not lift that prohibition. Only a
    committed Coordinator decision on independently reviewed evidence can lift
    it.
  citation_prohibition_predicate_extension_restated_verbatim: >-
    In addition to the retained sentence, a row of any EXP-WESOVOW-001
    reconciliation is NOT citation-eligible when either (a) the two anchors
    disagree in the SIGN of the baseline comparison at that row, or (b) the
    smaller |margin| across the two anchors at that row is below that field
    size's anchor gap |Delta log2 T_full + Delta log2 M / 2|.
  did_either_limb_fire_on_this_artifact:
    retained_sentence: {applicable: true, fired: false}
    predicate_extension: {applicable: false, fired: false}
    why: >-
      This artifact reports YAML parse outcomes, list lengths, mapping key
      counts and key strings. It derives, recomputes, tabulates and cites no
      crossover value, no baseline-comparison sign, no margin and no speedup, at
      any field size or overhead value. The only crossover TEXT that appears is
      the frozen contract's own metrics[5] key string, quoted as an observed
      parse result, which the batch permits.

  # =====================================================================
  environment:
    python: 3.11.15 (main, Mar  3 2026, 09:26:23) [GCC 13.3.0]
    pyyaml: 6.0.1
    dependencies_beyond_stdlib: PyYAML only
    repo_head_commit: 0b0719711e67b3b83b5290f472626d99dc7347a6
    repo_tree_state: >-
      clean at the start of the task; at the end `git status --porcelain` showed
      exactly the two untracked producer artifacts of this task and nothing else
      (see write_hygiene below).
    cwd_for_every_command_below: /home/user/crypto-autoresearcher
    bytecode: >-
      PYTHONDONTWRITEBYTECODE=1 was set on every invocation AND the script sets
      sys.dont_write_bytecode = True before importing anything.

  # =====================================================================
  assertions:
    P1: the amended text parses with yaml.safe_load.
    P2: experiment.metrics is a list of exactly 7 items.
    P3: metrics[5] is a mapping with exactly one key.
    P4: >-
      THE CONTENT ASSERTION. metrics[5] equals - key AND value - the standalone
      parse of clause_1's own replacement_text_in_full, obtained from the clause
      independently of the splice.
    evaluation_order: P1, then P2, then P3, then P4. The first failure wins, is named on stdout, and the process exits 1.

  # =====================================================================
  the_five_objects:
    - object: (a)
      name: THE UNAMENDED FROZEN specification.yaml, no clause applied
      how_constructed: >-
        The frozen file read read-only and passed through with apply_clause_1 =
        False. Nothing is spliced. The expected content still comes from the
        redraft's clause_1, so the control is asking "is this file the amended
        one?".
      declared_must: FAIL, on P4
      command: >-
        PYTHONDONTWRITEBYTECODE=1 python3
        coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/amendment_parse_control.py
        --spec experiments/EXP-WESOVOW-001/specification.yaml
        --amendment coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/protocol_amendment_redraft.yaml
        --no-splice
      exit_code: 1
      assertion_that_fired: P4
      stdout_verbatim: |
        object  : coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/protocol_amendment_redraft.yaml [no-splice]
        result  : FAIL
        assertion that fired: P4
        message : P4 FAILED - metrics[5] does not equal the parse of clause_1's own replacement text; the key differs: amended file has 'crossover memory log2(w*) per (p, overhead c), analytic', clause_1 declares 'crossover memory log2(w*) per (p, overhead c)'. THIS IS THE ASSERTION THAT DISTINGUISHES THE AMENDED FILE FROM THE UNAMENDED ONE.
        observations:
        {
          "P1": "pass - the amended text parses",
          "P2": "pass - experiment.metrics is a list of 7 items",
          "P3": "pass - metrics[5] is a single-key mapping",
          "clause_1_applied": false,
          "expected_metrics_5_keys": [
            "crossover memory log2(w*) per (p, overhead c)"
          ],
          "expected_metrics_item_parsed": true,
          "metrics_5_keys": [
            "crossover memory log2(w*) per (p, overhead c), analytic"
          ],
          "metrics_5_type": "dict",
          "metrics_len": 7,
          "metrics_type": "list"
        }
      stderr_verbatim: ''
      what_this_object_establishes: >-
        THE POINT OF THE WHOLE CONTROL, AND IT IS VISIBLE IN THE OBSERVATIONS
        BLOCK RATHER THAN INFERRED. P1, P2 AND P3 ALL PASS ON THE UNAMENDED
        FROZEN FILE. Its metrics list is already 7 items long and its item 5 is
        already a single-key mapping - the mapping arises because the version-1
        text contains a colon after "analytic". A control asserting only P1-P3
        would therefore have returned PASS here, on the file it exists to detect
        the amendment of, and its pass on the redraft would have been entailed
        by the file's pre-existing shape. P4 is what fails, and it fails on the
        KEY: the version-1 key ends ", analytic" and the replacement's does not.
    - object: (b)
      name: THE SUPERSEDED BATCH-752ef2 clause_1, spliced over lines 39-40
      how_constructed: >-
        amendment.proposed_replacement.clause_1.replacement_text_in_full read
        from the superseded draft with yaml.safe_load and written to a file in a
        scratchpad OUTSIDE the repository. 584 bytes, 9 content lines. sha256
        2ca25ceaf9d67767d34e52bad0d7df5affe525e607e8f0eae35b0198024f31d4. The
        superseded draft was read read-only and not modified.
      declared_must: FAIL, on P1, with the parse error named
      command: >-
        PYTHONDONTWRITEBYTECODE=1 python3
        coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/amendment_parse_control.py
        --spec experiments/EXP-WESOVOW-001/specification.yaml
        --amendment coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/protocol_amendment_redraft.yaml
        --clause-1-file <SCRATCHPAD>/obj_b_superseded_clause_1.txt
      exit_code: 1
      assertion_that_fired: P1
      parse_error_type: yaml.scanner.ScannerError
      stdout_verbatim: |
        object  : <SCRATCHPAD>/obj_b_superseded_clause_1.txt
        result  : FAIL
        assertion that fired: P1
        message : P1 FAILED - the amended text does not parse with yaml.safe_load. ScannerError: while scanning a simple key |   in "<unicode string>", line 40, column 5: |         table entries, at which the over ...  |         ^ | could not find expected ':' |   in "<unicode string>", line 41, column 5: |         (p, c) scenario meets the Delfs- ...  |         ^
        observations:
        {
          "clause_1_applied": true,
          "expected_metrics_item_error": "ScannerError: while scanning a simple key\n  in \"<unicode string>\", line 2, column 3:\n      table entries, at which the over ... \n      ^\ncould not find expected ':'\n  in \"<unicode string>\", line 3, column 3:\n      (p, c) scenario meets the Delfs- ... \n      ^",
          "expected_metrics_item_parsed": false,
          "parse_error": "while scanning a simple key\n  in \"<unicode string>\", line 40, column 5:\n        table entries, at which the over ... \n        ^\ncould not find expected ':'\n  in \"<unicode string>\", line 41, column 5:\n        (p, c) scenario meets the Delfs- ... \n        ^",
          "parse_error_type": "ScannerError"
        }
      stderr_verbatim: ''
      independent_agreement_with_RT_1: >-
        THIS IS THE THIRD SESSION TO REPORT THAT THIS TEXT DOES NOT PARSE, and
        the error matches RT-1's report by NAME: RT-1 records "while scanning a
        simple key" for the indent-by-2 splice and "while parsing a block
        mapping" for the column-0 splice. The control's declared procedure is
        indent-by-2, and it reproduces the first of those verbatim. A separate
        scratch probe run before the control existed reproduced BOTH, at
        indent 0 and indent 2 respectively, matching RT-1 on both readings. THE
        SUPERSEDED clause_1 DID NOT PARSE FOR ME EITHER, and it is worth saying
        that this agreement is not independent of RT-1's report, which I read
        before running anything.
      note_on_the_second_error_in_the_observations: >-
        `expected_metrics_item_error` shows the SAME ScannerError raised when
        the superseded text is parsed STANDALONE, at line 2 column 3 rather than
        line 40 column 5. The defect is in the text's own relative indentation
        and is not created by the splice; the splice only moves where it
        surfaces. P1 fires first regardless.
    - object: (c)
      name: A LENGTH-BREAKING replacement - parses, but yields metrics of length 8
      how_constructed: >-
        The redraft's clause_1 text with one extra sequence item appended:
        "- an eighth metrics entry that nobody declared". Built by
        `synthetic_length_breaking()` in the committed control script, so it is
        reconstructible from the committed artifact alone; written to a
        scratchpad file OUTSIDE the repository, sha256
        6333a207061fb4e960f9b9593de6704c953ebcac206767f56f17d4793f5015a5.
      declared_must: FAIL, on P2
      command: >-
        PYTHONDONTWRITEBYTECODE=1 python3
        coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/amendment_parse_control.py
        --spec experiments/EXP-WESOVOW-001/specification.yaml
        --amendment coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/protocol_amendment_redraft.yaml
        --clause-1-file <SCRATCHPAD>/obj_c_length_breaking.txt
      exit_code: 1
      assertion_that_fired: P2
      stdout_verbatim: |
        object  : <SCRATCHPAD>/obj_c_length_breaking.txt
        result  : FAIL
        assertion that fired: P2
        message : P2 FAILED - experiment.metrics is not a list of exactly 7 items; it is a list of length 8
        observations:
        {
          "P1": "pass - the amended text parses",
          "clause_1_applied": true,
          "expected_metrics_item_error": "ValueError: clause_1 replacement text does not parse standalone as a one-item sequence; got 'list'",
          "expected_metrics_item_parsed": false,
          "metrics_len": 8,
          "metrics_type": "list"
        }
      stderr_verbatim: ''
      honest_note: >-
        P1 PASSED on this object, which is the point of it - it parses and is
        rejected on shape. Note also that its expected-content parse failed for
        an independent reason (a two-item sequence is not a single metrics
        item), which would have failed P4 as well; P2 fires first and P2 is what
        the object was built to trip, so the declared behaviour is met. A
        reviewer wanting P2 isolated from that second reason can construct a
        replacement that is one item shorter instead of one longer.
    - object: (d)
      name: A TYPE-BREAKING replacement - parses, but makes metrics[5] a plain string
      how_constructed: >-
        A two-line replacement containing no colon, so it parses as a multi-line
        plain scalar rather than a mapping. Built by `synthetic_type_breaking()`
        in the committed control script; written to a scratchpad file OUTSIDE
        the repository, sha256
        e0f25c0d5e92849358e016a2fe8eb054daa7ab5c49faba085f30a39201bd4c84. Its
        exact bytes are:
        "- crossover memory log2(w*) per (p, overhead c) - a plain string\n  with a continuation line and no colon, so it parses as a scalar\n"
      declared_must: FAIL, on P3
      command: >-
        PYTHONDONTWRITEBYTECODE=1 python3
        coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/amendment_parse_control.py
        --spec experiments/EXP-WESOVOW-001/specification.yaml
        --amendment coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/protocol_amendment_redraft.yaml
        --clause-1-file <SCRATCHPAD>/obj_d_type_breaking.txt
      exit_code: 1
      assertion_that_fired: P3
      stdout_verbatim: |
        object  : <SCRATCHPAD>/obj_d_type_breaking.txt
        result  : FAIL
        assertion that fired: P3
        message : P3 FAILED - metrics[5] is not a mapping with exactly one key; it is a str
        observations:
        {
          "P1": "pass - the amended text parses",
          "P2": "pass - experiment.metrics is a list of 7 items",
          "clause_1_applied": true,
          "expected_metrics_item_parsed": true,
          "metrics_5_keys": null,
          "metrics_5_type": "str",
          "metrics_len": 7,
          "metrics_type": "list"
        }
      stderr_verbatim: ''
      why_this_object_matters_beyond_the_assertion: >-
        IT IS THE OBJECT THAT REJECTS THE ALTERNATIVE REPAIR. RT-1 records that
        a folded `>-` block scalar would also have made the superseded clause
        parse. It would also have made metrics[5] a plain STRING, which is
        exactly the shape this object carries and exactly what P3 rejects. So
        the control does not merely check that the file loads; it enforces the
        preservation of the parsed TYPE that the redraft's rt_1_repair_note
        claims, and it would have caught the wrong repair.
    - object: (e)
      name: THE POSITIVE CONTROL - the redraft's own clause_1
      how_constructed: >-
        amendment.proposed_replacement.clause_1.replacement_text_in_full read
        from the redraft and spliced over lines 39-40 at indent 2 under the
        declared splice procedure.
      declared_must: PASS
      command: >-
        PYTHONDONTWRITEBYTECODE=1 python3
        coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/amendment_parse_control.py
        --spec experiments/EXP-WESOVOW-001/specification.yaml
        --amendment coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/protocol_amendment_redraft.yaml
      exit_code: 0
      assertion_that_fired: none
      stdout_verbatim: |
        object  : coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/protocol_amendment_redraft.yaml
        result  : PASS
        message : PASS - P1, P2, P3 and P4 all hold.
        observations:
        {
          "P1": "pass - the amended text parses",
          "P2": "pass - experiment.metrics is a list of 7 items",
          "P3": "pass - metrics[5] is a single-key mapping",
          "P4": "pass - metrics[5] equals the standalone parse of clause_1's replacement text",
          "clause_1_applied": true,
          "expected_metrics_5_keys": [
            "crossover memory log2(w*) per (p, overhead c)"
          ],
          "expected_metrics_item_parsed": true,
          "metrics_5_keys": [
            "crossover memory log2(w*) per (p, overhead c)"
          ],
          "metrics_5_type": "dict",
          "metrics_len": 7,
          "metrics_type": "list"
        }
      stderr_verbatim: ''
      the_gate_this_discharges: >-
        RT-1 IS REPAIRED AND THE REPAIR IS DEMONSTRATED RATHER THAN ASSERTED.
        The redrafted clause_1, spliced verbatim over specification.yaml lines
        39-40 under the declared procedure, yields a file that PARSES, with
        experiment.metrics a 7-element list and metrics[5] a mapping with
        exactly one key - "crossover memory log2(w*) per (p, overhead c)" - and
        that mapping equals the standalone parse of the clause's own text. The
        parsed TYPE is a single-key mapping, the same parsed type the version-1
        text has today, so no consumer indexing the metrics list sees a type
        change.

  summary_of_the_five: >-
    5/5 objects behaved exactly as declared. FAIL on (a) at P4, FAIL on (b) at
    P1, FAIL on (c) at P2, FAIL on (d) at P3, PASS on (e). Each of the four
    assertions was reached and fired on at least one object, so no assertion in
    the control is unreachable, and no assertion is the only one ever reached.

  # =====================================================================
  selftest_run:
    what_it_is: >-
      A single committed entry point that constructs all five objects itself -
      including the two synthetic ones - and runs the control on each, so that
      the whole exercise is reproducible from the committed artifacts alone
      without reconstructing any scratchpad file.
    command: >-
      PYTHONDONTWRITEBYTECODE=1 python3
      coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/amendment_parse_control.py
      --spec experiments/EXP-WESOVOW-001/specification.yaml
      --amendment coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/protocol_amendment_redraft.yaml
      --superseded coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/protocol_amendment_draft.yaml
      --selftest
    exit_code: 0
    last_line_of_stdout_verbatim: 'SELFTEST PASS - 5/5 objects behaved as declared.'
    per_object_verdicts_verbatim: |
      (a) UNAMENDED frozen specification.yaml, no clause applied
          declared: FAIL on P4
          observed: FAIL on P4
          verdict : AS DECLARED
      (b) SUPERSEDED BATCH-752ef2 clause_1, spliced over lines 39-40
          declared: FAIL on P1
          observed: FAIL on P1
          verdict : AS DECLARED
      (c) LENGTH-BREAKING replacement (parses; metrics length 8)
          declared: FAIL on P2
          observed: FAIL on P2
          verdict : AS DECLARED
      (d) TYPE-BREAKING replacement (parses; metrics[5] a plain string)
          declared: FAIL on P3
          observed: FAIL on P3
          verdict : AS DECLARED
      (e) THE REDRAFT's clause_1 - the positive control
          declared: PASS
          observed: PASS
          verdict : AS DECLARED
    exit_semantics_disclosed: >-
      --selftest exits 0 when every object behaves AS DECLARED, which for four
      of the five objects means FAILING. Its exit code therefore does NOT mean
      "the amendment applies"; the object-(e) exit code does. Stated so nobody
      reads a green selftest as a green amendment.

  # =====================================================================
  all_four_clauses_spliced_and_parsed:
    procedure: >-
      As declared at protocol_amendment_redraft.yaml
      amendment.splice_procedure: clause_1 REPLACES lines 39-40 at indent 2;
      clause_2 is APPENDED inside experiment.model_definition at indent 4;
      clause_3 and clause_4 are APPENDED inside experiment.controls[0] at
      indent 4. All splices are in memory; no amended copy of the contract was
      written anywhere, inside or outside the repository.
    clause_1:
      parses: true
      metrics_len: 7
      metrics_5_keys: ['crossover memory log2(w*) per (p, overhead c)']
      metrics_5_type: dict
    clause_2:
      parses: true
      model_definition_keys: [quantities, unit_of_cost, unit_of_memory, optimizer, dickman_rho, vow_charging_law]
      note: One key added; the five existing keys are unchanged and in their original order.
    clause_3:
      parses: true
      controls_0_keys: [id, description, tolerance, on_violation, anchor_semantics]
      note: >-
        Same key list the red team reported for the SUPERSEDED clause_3, which
        is expected: RT-8's repair adds a sub-key INSIDE anchor_semantics
        (tolerance_statement_note) and adds no new key to C1.
    clause_4:
      parses: true
      controls_0_keys: [id, description, tolerance, on_violation, anchor_reachability]
      note: >-
        THE CLAUSE NOBODY HAD EVER SPLICED IN A REPAIRED FORM, and the review
        plan's expected residual risk. It parses. RT-4's two provisos and
        RT-9(b)'s hypothetical justification are carried inside
        anchor_reachability, so C1's key list is unchanged from the superseded
        clause_4's; the sub-keys of anchor_reachability are requirement,
        why_it_is_required, licensing, licensing_provisos_are_operative,
        fuller_statement, relation_to_the_standing_citation_prohibition - two
        more than the superseded clause_4 had.
    clause_3_and_clause_4_together:
      parses: true
      controls_0_keys: [id, description, tolerance, on_violation, anchor_semantics, anchor_reachability]
    all_four_clauses_together:
      parses: true
      metrics_len: 7
      metrics_5_keys: ['crossover memory log2(w*) per (p, overhead c)']
      model_definition_keys: [quantities, unit_of_cost, unit_of_memory, optimizer, dickman_rho, vow_charging_law]
      controls_0_keys: [id, description, tolerance, on_violation, anchor_semantics, anchor_reachability]
      note: >-
        THE FULLY AMENDED CONTRACT LOADS AND HAS THE DECLARED SHAPE IN ALL THREE
        PLACES AT ONCE. This is the object an enacting party would actually
        produce, and it had never been built before.

  # =====================================================================
  defect_found_in_this_control_during_its_own_development:
    what_happened: >-
      RECORDED BECAUSE IT IS THE MOST INFORMATIVE THING THIS TASK PRODUCED AND
      BECAUSE DISCARDING IT WOULD BE THE FAILURE THE PROGRAM FORBIDS. The first
      version of `splice_all_clauses` built the all-four-clauses object using
      the FIXED line-number anchors declared for the unmodified version-1 file.
      Those anchors are correct for each clause applied ALONE and wrong for any
      clause applied after another: clause_1 replaces 2 lines with 9, so every
      line below 40 moves down by 7. Applying clause_2 at the unshifted anchor
      inserted it seven lines early, inside the dickman_rho block.
    what_it_produced: >-
      A FILE THAT STILL PARSED. It did not raise. `model_definition_keys` came
      back as [quantities, unit_of_cost, unit_of_memory, optimizer, dickman_rho]
      with vow_charging_law ABSENT - the clause had been absorbed into a
      neighbouring scalar. A silently wrong application that still loads is
      strictly worse than one that raises, and it was caught only because the
      function REPORTS the key list rather than asserting a boolean.
    the_fix: >-
      `find_anchor()` relocates both anchors by searching for
      `  scenario_definitions:` and `  - id: C2-baseline-consistency` after each
      preceding clause is applied. The per-clause objects still use the declared
      constants, because for a single clause applied alone they are correct and
      checking the declaration is part of the point.
    what_it_changed_in_the_amendment_record: >-
      A new key, splice_procedure.order_of_application_and_why_the_line_numbers_shift,
      stating that an applying party must apply the clauses bottom-up or
      relocate the anchors by search. Nothing in any clause's text changed.
    what_a_reviewer_should_take_from_it: >-
      NOT that the control is now known correct - one caught defect is evidence
      about the search, not about the residue. It is evidence that reporting
      observed shapes alongside boolean assertions catches things a boolean
      alone does not, and it is a live example of the class of defect this whole
      amendment exists to prevent: an application of a recorded replacement text
      that appears to succeed and quietly does not.

  # =====================================================================
  is_this_controls_pass_entailed_by_its_own_construction:
    answer: >-
      PARTIALLY YES, AND THE PART THAT IS ENTAILED IS NAMED. Answering "no"
      would repeat exactly what RT-3 found wrong with AC-1's report.
    what_is_entailed: >-
      P1, P2 AND P3 ARE VERY NEARLY ENTAILED BY THE OBJECT, NOT BY THE
      AMENDMENT. Object (a) proves it directly: all three PASS on the unamended
      frozen file, which the amendment has not touched. They are properties the
      target file already had, and any replacement that parses at all and does
      not change the item count or the item type inherits them. Their pass on
      the redraft is therefore weak evidence about the redraft and strong
      evidence only about the file.
      AND P4 IS PARTLY SELF-REFERENTIAL BY CONSTRUCTION: it compares the amended
      file against the SAME clause text that was spliced into it, so for any
      clause whose text parses standalone into a single-key mapping and splices
      cleanly, P4 must pass. P4 cannot distinguish a correct replacement from an
      incorrect one; it distinguishes an APPLIED replacement from an unapplied
      one, which is a different and smaller thing.
    what_is_not_entailed: >-
      THE CONJUNCTION IS NOT ENTAILED, AND THE FOUR NEGATIVE OBJECTS SHOW WHICH
      PART EACH ASSERTION CARRIES. P1 is not entailed - object (b), the
      superseded clause, is a real historical text that fails it. P2 is not
      entailed - object (c) parses and fails it. P3 is not entailed - object (d)
      parses, has 7 metrics items, and fails it; and object (d) is precisely the
      shape the ALTERNATIVE repair (a folded `>-` scalar) would have produced,
      so P3 discriminates between two repairs that both make the file load. P4
      is not entailed - object (a) satisfies P1, P2 and P3 and fails it. Every
      assertion was reached and fired.
    the_residual_that_remains: >-
      THE CONTROL CANNOT FAIL FOR A REASON THAT WOULD MATTER MOST. It cannot
      tell whether the replacement's CONTENT is right, whether the incorporated
      law is the right model, or whether any other consumer of the contract
      accepts the amended file. It is a shape-and-identity control. A green
      object-(e) result means the amendment is APPLICABLE; it does not mean the
      amendment is CORRECT, and no reader may take it for that.
    stated_against_the_question_the_reviewer_will_ask: >-
      "Is there any input on which this control returns the WRONG answer?" I
      know of one CLASS and state it rather than wait to be told: a replacement
      whose text differs from the redraft's clause_1 in any way that still
      parses standalone into a single-key mapping and still splices cleanly will
      PASS, because P4 compares the amended file against whatever clause text
      it was given. The control checks the APPLICATION of a clause, not the
      IDENTITY of the clause with the one the amendment record declares - that
      identity is checked by reading the record, and by J1's independent splice.
      A reviewer wanting the stronger check would pin the clause text's sha256
      in the amendment record and have the control verify it.

