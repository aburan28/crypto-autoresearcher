  what_you_are_repairing_and_why_it_is_not_just_two_spaces: >-
    RT-1 of the BATCH-79a0cb red-team report found that clause_1's
    `replacement_text_in_full` - the ONE clause carrying the actual repair - does
    not parse when spliced over experiments/EXP-WESOVOW-001/specification.yaml
    lines 39-40. It was demonstrated mechanically, not by eye: the draft was loaded
    with yaml.safe_load, the exact 584 bytes (9 content lines, 8 of them
    continuations) were spliced over the target lines, and the result raised a
    ParserError - `while scanning a simple key` indented by 2, `while parsing a
    block mapping` verbatim. The orchestrating session independently re-performed
    the splice and reported the same result. The repair is two spaces on the eight
    continuation lines, after which the file loads, metrics has 7 items, and
    metrics[5] is a single-key mapping - THE SAME PARSED TYPE the prior text has
    today, so no consumer indexing the metrics list sees a type change.
    THE TWO SPACES ARE NOT WHY THIS IS A PRODUCER TASK. The finding's real content
    is its last sentence: the check that would have caught it - parse the amended
    contract and report that experiment.metrics still has 7 items with metrics[5] a
    single-key mapping - IS THE ONE CONTROL THIS AMENDMENT LACKS. An amendment that
    replaces text in a machine-readable contract has no control that the result
    still loads. IMPLEMENTING AND EXERCISING THAT CONTROL IS THE POINT OF THIS
    TASK, and it is the difference between a redraft and a repair that generalizes.

  the_two_results_that_bind_this_redraft_negatively:
    r3_was_refuted: >-
      DO NOT REST ON THE REFUTED DERIVATION AND DO NOT SILENTLY SUBSTITUTE THE
      REPAIRED ONE. BATCH-79a0cb returned REFUTED on the claim that control C3
      forces the satisfying set INDEPENDENTLY of control C4: C3's second clause
      instantiated at w = M IS C4, so the C3 route is the same inference from a
      strictly stronger premise and invites a reader to count one source as two.
      AND the monotonicity route DEC-20260905-5f5592 adopted in its place was itself
      found to be missing an endpoint premise (C4 again) and the omitted `capped by
      M` premise; as recorded it returns CONTRADICTION on two proves-too-much
      objects where the conclusion is KNOWN FALSE. Repaired, its exclusion region is
      a STRICT SUBSET of the producer's and the satisfying set stands. YOUR WARRANT
      SENTENCE MUST SAY WHAT IS TRUE: state the entailment plainly, and where you
      rely on the repaired route, NAME IT AS REPAIRED and state the two restored
      premises. Do not assert that any committed record is wrong - that stronger
      claim is deliberately un-promoted for want of a review tier this environment
      cannot serve.
    ac_1s_pass_was_entailed_by_its_own_construction: >-
      DO NOT CARRY AC-1 FORWARD UNCHANGED AS THOUGH IT DISCRIMINATES. Over a
      144-shape sweep, AC-1's pass region is exactly {alpha = 1, delta = 0, beta !=
      0}, which is precisely how AC-1's own input is constructed - so its pass is
      entailed by its own construction, while the package's own report answers that
      question `NO`. AC-1 retains real residual value as a CODE control and that is
      not in dispute. What is forbidden is presenting it as evidence that
      discriminates. THE SAME TRAP IS SET FOR YOUR NEW CONTROL and the card names it
      below at P4.

  the_control_you_must_implement_and_exercise:
    file: coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/amendment_parse_control.py
    it_must_be_exercised_not_described: >-
      A control that exists only as a clause of the draft is a description. This one
      is a committed, re-runnable script, and its report carries the verbatim result
      of running it on five named objects. That is also how CF-24 is discharged for
      this round: the previous round's mechanical results were re-checkable from no
      committed artifact.
    assertions:
      - P1 - the amended text parses with yaml.safe_load.
      - P2 - experiment.metrics is a list of exactly 7 items.
      - P3 - metrics[5] is a mapping with exactly one key.
      - >-
        P4 - THE CONTENT ASSERTION, AND IT IS NOT OPTIONAL. metrics[5] equals the
        parse of clause_1's own replacement text, so the control DISTINGUISHES THE
        AMENDED FILE FROM THE UNAMENDED ONE.
    why_p4_exists_stated_so_you_cannot_rediscover_it_too_late: >-
      THE UNAMENDED FROZEN FILE ALREADY HAS A 7-ELEMENT METRICS LIST WHOSE ITEM 5 IS
      A SINGLE-KEY MAPPING - BATCH-79a0cb's structural parse records exactly that
      (metrics[5] and metrics[4] parse as single-key mappings because each contains a
      colon, so the metrics list is heterogeneous in type). A control asserting only
      P1-P3 therefore PASSES ON THE FILE IT EXISTS TO DETECT THE AMENDMENT OF, and
      its pass on your redraft would be entailed by the file's pre-existing shape.
      That is RT-3's failure mode reproduced inside the control written to answer
      RT-1, and the reviewer is instructed to run exactly that object first.
    objects_it_must_be_run_on_and_what_each_must_do:
      - (a) THE UNAMENDED FROZEN FILE, no clause applied - must FAIL, on P4.
      - (b) THE SUPERSEDED clause_1 TEXT spliced over lines 39-40 - must FAIL, on P1, with the parse error named.
      - (c) A replacement that parses but leaves a metrics list of length other than 7 - must FAIL, on P2.
      - (d) A replacement that parses but makes metrics[5] a plain string - must FAIL, on P3.
      - (e) THE POSITIVE CONTROL, your real redraft - must PASS.
    also_required: >-
      Splice and parse ALL FOUR clauses of the redraft, not only clause_1, and report
      the resulting key lists. clause_4 is the clause you are editing most, because
      RT-4's two provisos go into its own text, and nobody has ever spliced clause_4
      in a repaired form. A new parse or shape defect there is the single most
      valuable thing this task could surface.

  the_items_routed_to_this_redraft_and_no_others:
    - RT-1 - indent clause_1's eight continuation lines two spaces deeper; preserve the parsed type.
    - >-
      RT-4 - carry BOTH provisos INTO clause_4's own text: the locator/relation/unit
      condition, and the same-breath proviso that the reachability status is reported
      with the signed difference. CARRYING THEM BEHIND A POINTER REPEATS THE VERY
      DEFECT RT-4 NAMES - the licensing summary becomes CONTRACT TEXT while the
      provisos live in a coordination directory.
    - RT-5 - relabel the clause called `ADDITIVE ANNOTATION ONLY` whose own text says `THE OPERATIVE CLAUSE` and which makes the only existing implementation non-conforming.
    - RT-7 - add the missing blast-radius line - clause_1 converts an EXISTING deviation (an uncapped crossover value plus a flag, against a version-1 metrics line saying `capped by M`) into conformance.
    - RT-8 - add a CF-14 DISCLOSURE NOTE in the shape of clause_2's notation_note, naming CF-14 and stating that this amendment does NOT repair it.
    - RT-9(b) - state clause_4's justification HYPOTHETICALLY; the per-field reachability statuses were verified by nobody and could only be recomputed by executing a prohibited file.
    - OP-2 - `Unchanged in text and vindicated in substance` becomes `unchanged in text, and not the block being repaired`.
    - OP-3 - `seven further explanations besides a wrong figure are enumerated` becomes a form that does not place a wrong published figure on the package's own candidate list.
    - The R3 warrant sentence, per the_two_results_that_bind_this_redraft_negatively.

  what_you_must_not_do:
