amendment:
  status: draft
  in_force: false
  approved_by: null
  approved_by_task: null
  drafted_by_task: TASK-20260906-ee372e
  drafted_at: '2026-09-06'
  goal_id: GOAL-SSI-001
  batch_id: BATCH-60d6b9
  experiment_id: EXP-WESOVOW-001
  version_from: 1
  version_to: 2
  version_note: >-
    `version_to: 2` numbers the CONTRACT. It is unrelated to the version_from/
    version_to pair of the earlier recorded amendment at
    .../BATCH-2e6130/tasks/TASK-20260809-ef3e58/protocol_amendment.yaml, which
    governs cost_model.py and which explicitly listed specification.yaml under
    its immutable_exclusions. The contract has never been amended and is still
    at version 1.
  repo_head_commit_at_drafting: 0b0719711e67b3b83b5290f472626d99dc7347a6
  repo_tree_state_at_drafting: >-
    clean. `git status --porcelain` returned no lines at the moment this
    redraft was begun, and the value above is `git rev-parse HEAD` at that
    moment.

  in_force_statement: >-
    THIS RECORD IS A DRAFT AND HAS NO EFFECT. Nothing below is a change that has
    been made. EXP-WESOVOW-001 remains `approved` and UNAMENDED at version 1,
    its specification file is unchanged, no run is authorized, no status moves,
    and no reader may cite any clause of this draft as governing. An amendment
    that reads as though it were in force would be a fabrication of authority;
    this line exists so that no excerpt of this file can be read that way.

  # =====================================================================
  supersedes:
    record: coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/protocol_amendment_draft.yaml
    snapshot_commit: 2eef128634f23971727626c3974808fa27026987
    drafted_by_task: TASK-20260905-28c89d
    batch_id: BATCH-752ef2
    status_of_the_superseded_record: >-
      IMMUTABLE, SNAPSHOT-BOUND, AND UNTOUCHED BY THIS TASK. It was read
      read-only and parsed read-only. It carries no marker, no annotation and no
      deletion from this task, and it is not withdrawn - a draft cannot withdraw
      another agent's committed record. It remains the record of what the
      previous round actually produced and of what the red team actually
      attacked.
    supersession_direction: >-
      STATED FROM THIS RECORD'S OWN SIDE, WHICH IS THE ONLY SIDE THAT MAY. A
      reader who arrives at the superseded draft first will find no pointer
      here; that asymmetry is a cost of immutability and is accepted rather
      than repaired by editing the older file.
    why_superseded: >-
      RT-1 of the BATCH-79a0cb red-team report
      (coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/reviews/TASK-20260905-6d5c9c/red_team_report.yaml,
      findings, id RT-1): the one clause carrying the actual repair, clause_1,
      has a replacement_text_in_full that does NOT parse when spliced over
      experiments/EXP-WESOVOW-001/specification.yaml lines 39-40. Plus seven
      smaller routed repairs and the R3 warrant sentence, all routed to a
      redraft by ledger/decisions/DEC-20260905-3b8e94.yaml next_actions[0](A).
    what_is_carried_over_unchanged: >-
      The substance. Every clause's CONTENT, the target block, the scope, the
      blast radius, the constraint-compliance analysis, the CF-10 placement
      submission and the reviewer notes are carried forward, changed only where
      DEC-20260905-3b8e94 routed a change. The enumeration at
      changes_from_the_superseded_draft is exhaustive and classifies every
      difference.

  # =====================================================================
  citation_prohibition_restated_verbatim: >-
    The `P=512` crossover value and its `w=2^80` sign are **NOT
    citation-eligible**. This task does not lift that prohibition. Only a
    committed Coordinator decision on independently reviewed evidence can lift
    it.
  citation_prohibition_predicate_extension_restated_verbatim: >-
    In addition to the retained sentence, a row of any EXP-WESOVOW-001
    reconciliation is NOT citation-eligible when either (a) the two anchors
    disagree in the SIGN of the baseline comparison at that row, or (b) the
    smaller |margin| across the two anchors at that row is below that field
    size's anchor gap |Delta log2 T_full + Delta log2 M / 2|.
  citation_prohibition_applicability_in_this_artifact:
    retained_sentence:
      applicable: true
      fired: false
      why: >-
        APPLICABLE, AND THIS IS THE ARTIFACT WHERE THE QUESTION IS SHARPEST: the
        superseded contract text is itself an analytic crossover line and this
        draft quotes it verbatim, which the batch permits. NOT FIRED: the
        proposed replacement text deliberately states NO closed form for w*,
        asserts no corrected crossover, and contains no crossover value, no
        baseline comparison, no margin, no sign and no speedup at any field
        size. That restraint is not incidental - see
        design_choice_the_replacement_states_no_closed_form below. This draft
        does not lift either limb and could not; only a committed Coordinator
        decision can.
    predicate_extension:
      applicable: false
      fired: false
      why: >-
        The predicate scopes rows of an EXP-WESOVOW-001 reconciliation. This
        draft cites no reconciliation row and computes no per-row margin, so the
        predicate has no object here. The draft does, at clause_3, PROPOSE a
        contract requirement that is adjacent in spirit; that proposal neither
        lifts, narrows, nor restates the standing prohibition, which survives
        this draft untouched whether or not the draft is ever enacted.
    the_one_place_a_reader_should_look_hardest: >-
      THE R3 WARRANT SENTENCE BELOW, which is new in this redraft and which
      states a feasibility condition symbolically. It writes the antecedent as a
      FREE SYMBOL A - the amount by which a scenario's overhead-inflated
      full-memory time exceeds the baseline - and never instantiates A, any
      field size, any overhead value, any memory budget, any margin or any
      speedup. Nothing there is evaluated, tabulated or cited. That is the same
      handling the red team applied to the same symbol, and it is recorded here
      so a reviewer can check it rather than take it.

  blind_phase_hygiene_compliance: >-
    This batch declares NO blind phase (BATCH-60d6b9 batch.yaml, no_blind_phase),
    so no value is protected by hash here. The restraint of the previous round is
    kept anyway and is now a habit rather than an obligation: no value of the
    PAPER_PAIRS mapping at cost_model.py:60-66 and none of the five
    paper-minus-attained-minimum deltas of EV-SSI-5d954c is restated in this
    artifact. They are named by locator only. The formulas of the earlier
    recorded amendment are likewise named by locator and not restated.

  # =====================================================================
  gating_reproduction:
    artifact: coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/defect_reproduction.yaml
    verdict: reproduced
    finalized_before_the_superseded_draft_was_begun: true
    summary_without_restating_it: >-
      The reproduction, performed from the frozen file alone and including the
      scope audit that establishes the two blocks are in one scope, returned
      `reproduced`, with satisfying set R x {0} in (log2 T_full, log2 M) and
      degenerate witness log2 M = 0. This draft is conditioned on nothing else.
      THE SENTENCE THE SUPERSEDED DRAFT ALSO CARRIED HERE - that control C3
      forces the same satisfying set INDEPENDENTLY of control C4 - IS NOT
      CARRIED FORWARD, and the reason is set out immediately below at
      r3_warrant_sentence. This redraft does not rest on that independence
      claim, and no clause of it ever did.
    r3_warrant_sentence: >-
      WHAT IS TRUE, STATED PLAINLY AND WITHOUT RESTING ON A REFUTED DERIVATION.
      (1) THE ENTAILMENT. Control C3's second clause reads "T(w) must equal
      T_full for w >= M" (specification.yaml:146-147) and control C4 reads "At
      w = M, vOW time must equal T_full exactly (cap check)"
      (specification.yaml:148-149). The set {w : w >= M} contains the point
      w = M, and the contract states exactly one time function, so C3's second
      clause instantiated at w = M IS C4; that is, C3b entails C4. It follows
      that a route through C3 is THE SAME INFERENCE FROM A STRICTLY STRONGER
      PREMISE, not a second and independent source, and stating it as a second
      source would invite a reader to count one source as two. This redraft
      therefore claims no independence of C3 from C4 anywhere.
      (2) WHERE THIS DRAFT USES THE MONOTONICITY ROUTE, IT USES THE REPAIRED
      FORM AND NAMES IT AS REPAIRED. The route as recorded at
      ledger/decisions/DEC-20260905-5f5592.yaml (rationale, the item beginning
      "F-3'S OVERSTATEMENT IS CORRECTED ON THE RECORD RATHER THAN INHERITED")
      and at ledger/evidence/EV-SSI-2aaf6f.yaml OBS-11 was attacked at
      BATCH-79a0cb r3.finding_RT_2, which reports it as missing two premises and
      as returning CONTRADICTION on two of that batch's own proves-too-much
      objects. THE TWO RESTORED PREMISES ARE: (i) THE ENDPOINT PREMISE -
      monotonicity alone leaves inf_w T(w) unconstrained below T_full, so the
      step "T(w) >= T_full for every w" needs C3's SECOND clause at the single
      point w = M, which is C4; the route is therefore NOT independent of C4;
      and (ii) THE OMITTED CAP PREMISE - metrics[5] ends "capped by M" and the
      implementation reads that as a feasibility flag, so the metrics line
      asserts the EXISTENCE of a crossover only where its value lies at or below
      log2 M, i.e. only where 2A <= log2 M, writing A for the amount by which
      the scenario's overhead-inflated full-memory time exceeds the baseline.
      WITH BOTH PREMISES RESTORED the route reads: for any charging law
      satisfying C3, (i) T(w) = T_full for w >= M by C3's second clause, and
      (ii) T(w) >= T_full for every w by C3's first clause together with (i) at
      w = M; hence in any scenario with A > 0 no crossover exists at any budget,
      while the metrics line nevertheless reports one and reports it as feasible
      where 2A <= log2 M - so on that region the metrics line asserts the
      existence of an object C3 forbids. Its exclusion region is {A > 0 and
      2A <= log2 M}; A > 0 with log2 M >= 2A forces log2 M > 0, so the region is
      a STRICT SUBSET of {log2 M != 0} and the satisfying set R x {0} and its
      degenerate witness log2 M = 0 stand.
      (3) WHAT IS NOT ASSERTED. A is a free symbol here. It is not evaluated at
      any declared field size, overhead value or memory budget; no crossover
      value, baseline-comparison sign, margin or speedup is derived, recomputed,
      tabulated or cited, and the standing citation prohibition and its
      predicate extension are neither lifted nor narrowed. NOR DOES THIS DRAFT
      ASSERT THAT ANY COMMITTED RECORD IS WRONG. DEC-20260905-5f5592 and
      EV-SSI-2aaf6f are committed and immutable; RT-2 is an adversarial finding
      whose acceptance is reserved to the enacting decision, and its own author
      records that the conclusion survives repair and that the amendment's
      clauses do not depend on the route. This draft simply does not rest on the
      route in any form other than the one written out above, and says so.
      (4) WHAT DEPENDS ON THIS. NOTHING IN THE FOUR CLAUSES. clause_1 references
      C2 for the baseline; clause_2's invariants list C3 and C4 separately,
      which is belt-and-braces and not a dependence on their independence;
      clause_3 and clause_4 concern C1 and do not touch it. The warrant sentence
      is what an enacting decision would quote, and this is what it may quote.

  # =====================================================================
  target:
    primary:
      file: experiments/EXP-WESOVOW-001/specification.yaml
      line_range: 39-40
      key_path: experiment.metrics[5]
      prior_text_verbatim: |
        39:  - crossover memory log2(w*) per (p, overhead c), analytic: w* = (T_full * 2^{c*sqrt(log2
        40:      p)} / T_DG)^2, capped by M
    secondary_annotation_only:
      - file: experiments/EXP-WESOVOW-001/specification.yaml
        line_range: 58-107
        key_path: experiment.model_definition
        nature: >-
          ADDITIVE. One new key is added to model_definition. No existing key of
          model_definition is changed, reworded, reordered or removed.
      - file: experiments/EXP-WESOVOW-001/specification.yaml
        line_range: 134-141
        key_path: experiment.controls[0] (C1-sanity-paper-pairs)
        nature: >-
          ADDITIVE IN TEXT AND OPERATIVE IN EFFECT. C1's id, description,
          tolerance and on_violation lines are RETAINED WORD FOR WORD and three
          new keys are added alongside them, so nothing existing is edited - that
          is the ADDITIVE part, and the two-sided 0.75-bit test is not changed,
          not widened, not narrowed, and not made one-sided. IT IS NOT MERELY AN
          ANNOTATION. clause_3's serialization requirement calls itself the
          operative clause of this amendment and, together with clause_4's
          recording requirement, makes the ONE existing implementation
          non-conforming, which blast_radius records. A reader skimming this
          block must not mis-size the change, and the previous label
          `ADDITIVE ANNOTATION ONLY` invited exactly that.
        relabelled_because: >-
          RT-5 of the BATCH-79a0cb red-team report: the label
          `ADDITIVE ANNOTATION ONLY` was attached to the clause whose own text
          says `THE OPERATIVE CLAUSE` and which makes the only existing
          implementation non-conforming. The repair is to the LABEL and not to
          the content; no word of clause_3 or clause_4 changed on account of
          RT-5.
        prior_text_verbatim: |
          134:  - id: C1-sanity-paper-pairs
          135:    description: 'Reproduce the paper''s five Section 4.1 (log2 time, log2 memory) pairs for
          136:      log2(p) in {256, 384, 512, 576, 768}.
          137:
          138:      '
          139:    tolerance: abs deviation <= 0.75 bit on both time and memory
          140:    on_violation: record deviation honestly in execution_report; run stays valid (this is
          141:      a model-reproduction check, not an implementation check)
    not_targeted_and_explicitly_untouched:
      - experiment.controls[1] (C2), lines 142-144
      - experiment.controls[2] (C3), lines 145-147
      - experiment.controls[3] (C4), lines 148-149 - C4 is the block the defect is measured against and it is CORRECT AS WRITTEN; this amendment repairs the metrics line to agree with C4, never C4 to agree with the metrics line
      - experiment.model_definition.quantities, lines 58-70
      - experiment.scenario_definitions, lines 108-132
      - experiment.budget, lines 42-45
      - experiment.stopping_rules, lines 150-154
      - experiment.honesty_constraints, lines 155-159
      - experiment.metrics[0..4] and metrics[6], lines 34-38 and 41
      - everything under experiments/EXP-WESOVOW-001/runs/
      - everything under inputs/P13-WESOLOWSKI-2026/

  # =====================================================================
  splice_procedure:
    why_this_block_exists: >-
      RT-1 IS ONLY WELL DEFINED RELATIVE TO A SPLICE PROCEDURE, AND THE
      SUPERSEDED DRAFT DECLARED NONE. Its clause texts are stored DEDENTED - the
      first line of each begins at column 0 of the block scalar - so an enacting
      party must know at which column to place them. The red team tried both
      readings and both failed for clause_1; this block removes the ambiguity so
      that no enacting party has to choose, and so that a machine can perform
      and verify the application. It states a procedure; it changes no clause's
      words.
    clause_1:
      operation: replace lines 39-40 of experiments/EXP-WESOVOW-001/specification.yaml
      indent_applied_to_every_line_of_the_stored_text: 2
      why_2: >-
        2 is the column at which the items of `experiment.metrics` stand in the
        target file; line 39 begins with exactly the four characters "  - ". An
        applying tool should assert that before splicing.
      resulting_columns: >-
        The sequence dash lands at column 2, the mapping key at column 4, and
        the eight continuation lines at column 6 - strictly deeper than the key,
        which is what makes the value a multi-line plain scalar rather than a
        second key at the same column. THAT IS THE WHOLE OF THE RT-1 REPAIR.
    clause_2:
      operation: append inside experiment.model_definition, after line 107
      indent_applied_to_every_line_of_the_stored_text: 4
      why_4: the column of model_definition's existing keys (`quantities`, `unit_of_cost`, ...).
    clause_3_and_clause_4:
      operation: append inside experiment.controls[0], after line 141, clause_3 then clause_4
      indent_applied_to_every_line_of_the_stored_text: 4
      why_4: the column of C1's existing keys (`id`, `description`, `tolerance`, `on_violation`).
    order_of_application_and_why_the_line_numbers_shift: >-
      THE FOUR LINE NUMBERS ABOVE ARE ANCHORS INTO THE UNMODIFIED VERSION-1
      FILE, AND EACH CLAUSE APPLIED MOVES THE ONES BELOW IT. clause_1 replaces
      two lines with nine, so everything below line 40 moves down by seven, and
      clause_2 then moves controls[0] again by its own length. An applying party
      must therefore either apply the clauses BOTTOM-UP (clause_4, clause_3,
      clause_2, clause_1) or relocate each anchor by SEARCH after each step -
      `  scenario_definitions:` for the end of model_definition and
      `  - id: C2-baseline-consistency` for the end of controls[0]. THIS IS
      RECORDED BECAUSE THE FIRST VERSION OF THE PARSE CONTROL GOT IT WRONG, in
      the informative direction: applying all four with the fixed constants
      produced a file that STILL PARSED but in which
      model_definition.vow_charging_law was absent. A silently wrong application
      that still loads is worse than one that raises, and it was caught only by
      reading the reported key list. The control now recomputes both anchors by
      search; the incident and the fix are recorded at
      amendment_parse_control_report.yaml.
    verbatim_splice_at_column_0_is_not_the_procedure: >-
      Stated so nobody has to discover it: placing any of these stored texts at
      column 0 does not apply the amendment and does not parse, because the
      surrounding blocks are nested. That is a property of the storage
      convention inherited from the superseded draft, not a defect of any
      clause, and this block is the fix for it.
    checked_by: >-
      coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/amendment_parse_control.py,
      whose result is recorded at amendment_parse_control_report.yaml. The
      procedure above is the one the control implements, and clauses 2, 3 and 4
      were spliced and parsed under it as well as clause_1.

  # =====================================================================
  why_an_amendment_and_not_an_edit: >-
    specification.yaml is a FROZEN, APPROVED CONTRACT (experiment.status:
    approved, experiment.approved_by: coordinator, experiment.approved_by_task:
    TASK-20260724-P13-COST). Two committed run packages, at least two committed
    evidence records and two committed decisions were produced against its text
    as written, and their meaning is fixed by what that text said at the time
    they were produced. An in-place edit would silently re-score those records
    against a contract they were never run under, would destroy the ability of
    any later reader to see what the earlier reviewers actually read, and would
    make the campaign's oldest adverse finding disappear rather than be
    discharged - the exact failure AGENTS.md forbids when it requires
    corrections to supersede and never overwrite. A recorded superseding
    amendment leaves the defective text in place and readable, states the
    replacement beside it, and dates the change, so that every prior record
    stays scoped to the version it was produced under. Additionally, the
    program has one live instance of the opposite choice going wrong in the
    other direction: the earlier amendment excluded specification.yaml from its
    own reach, which is how the contract came to disagree with the
    implementation that its own amendment governs. This draft therefore names
    the contract as its target explicitly rather than by exclusion.
  and_why_that_makes_the_parse_control_load_bearing: >-
    AN AMENDMENT WHOSE WHOLE VALUE IS THAT ITS REPLACEMENT TEXT IS EXACT AND
    MECHANICALLY APPLICABLE MUST BE ABLE TO SHOW THAT IT IS. The superseded
    draft rested its case on exactness and carried no check of it, and the one
    clause carrying the repair did not apply. The general remedy is not two
    spaces; it is that an amendment which replaces text in a machine-readable
    contract carries a control that the RESULT STILL LOADS AND STILL HAS THE
    DECLARED SHAPE - and that the control is exercised and shown able to fail,
    rather than described. That is the `controls` block below.

  design_choice_the_replacement_states_no_closed_form: >-
    DELIBERATE AND LOAD-BEARING. The proposed replacement does not put a
    corrected closed form for w* into the metrics list, for three independent
    reasons. FIRST, the batch's citation prohibition permits quoting the frozen
    contract's crossover text but forbids asserting what the corrected crossover
    is, and this draft is bound by that. SECOND, it is the actual root cause: a
    metrics list is a list of REPORTED QUANTITIES, and the defect exists because
    a law was stated there, in a place where no reader looks for the governing
    law and where nothing checks it against the controls. Moving the law out of
    the metrics list is the smallest change that makes the class of defect
    unrepeatable, rather than fixing one instance of it. THIRD, a governing
    statement of the law already exists as a committed, frozen record - the
    earlier recorded amendment - and authoring a second, independently worded
    copy of it in a different file is how two statements come to disagree in the
    first place. The replacement therefore names the reported quantity and its
    unit, incorporates the law by reference to that record, and adds an
    invariant that any incorporated law must satisfy the contract's own controls
    C3 and C4. The invariant is what makes the contract self-checking: under it,
    the defect being repaired here could not have been written down.

  # =====================================================================
  proposed_replacement:
    clause_1:
      addresses: the primary target, experiment.metrics[5], lines 39-40
      operation: replace in full
      splice_indent: 2
      rt_1_repair_note: >-
        THE ONLY DIFFERENCE BETWEEN THIS TEXT AND THE SUPERSEDED DRAFT'S IS
        WHITESPACE. Every one of the eight continuation lines is indented two
        spaces deeper than in the superseded text; not one word, punctuation
        mark or line break of the content changed, and the parsed value is
        character-for-character the same string. A folded `>-` block scalar
        would also parse and IS REJECTED, because it would make metrics[5] a
        plain STRING where the prior text parses as a single-key MAPPING, and a
        consumer indexing the metrics list would see a type change the
        amendment never announced.
      replacement_text_in_full: |
        - crossover memory log2(w*) per (p, overhead c): the memory budget, in
            table entries, at which the overhead-inflated vOW time of a given
            (p, c) scenario meets the Delfs-Galbraith baseline fixed by control
            C2, reported together with a feasibility flag recording whether that
            budget lies at or below log2 M. This metrics list names reported
            quantities and their units and states no law. The vOW charging law
            from which log2(w*) is computed, and the closed form of log2(w*)
            itself, are stated once for this contract in
            model_definition.vow_charging_law and nowhere else.
      what_it_removes: >-
        The closed form `w* = (T_full * 2^{c*sqrt(log2 p)} / T_DG)^2, capped by
        M` as a statement of this contract. It is removed as a STATEMENT, not
        erased as a fact: the prior text is quoted verbatim in this record under
        target.primary.prior_text_verbatim and stays readable in the frozen file
        until and unless a Coordinator decision enacts this amendment.
    clause_2:
      addresses: experiment.model_definition, lines 58-107
      operation: add one key; change nothing existing
      splice_indent: 4
      unchanged_from_the_superseded_draft: >-
        WORD FOR WORD. Nothing was routed to clause_2 by DEC-20260905-3b8e94.
        RT-6 concerns this clause's second invariant and is RESERVED TO THE
        ENACTING DECISION; see reserved_to_the_enacting_decision below. The text
        is reproduced here in full rather than incorporated by reference,
        because a superseding record that carries only its diffs is not
        applicable on its own.
      replacement_text_in_full: |
        vow_charging_law:
          status_in_this_contract: >-
            The single governing statement of T(w) for this experiment. Before
            this amendment the contract stated no charging law in
            model_definition at all, and the only recoverable statement of one
            was the closed-form crossover that formerly stood in the metrics
            list. That is the defect this amendment repairs.
          incorporated_by_reference:
            record: coordination/goals/GOAL-SSI-001/batches/BATCH-2e6130/tasks/TASK-20260809-ef3e58/protocol_amendment.yaml
            keys: amendment.corrected_model.log2_law, amendment.corrected_model.endpoint_behavior, amendment.corrected_model.crossover
            why_by_reference_and_not_restated: >-
              That record is committed, frozen, and already governs
              cost_model.py. A second independently worded copy of a law in a
              second file is how the two came to disagree. This contract holds
              exactly one pointer, not a paraphrase.
          invariants_that_any_incorporated_law_must_satisfy:
            - Control C3 of this contract: T(w) non-increasing in w for every (p, overhead) scenario, and T(w) = T_full for w >= M.
            - Control C4 of this contract: T(M) = T_full exactly, before the declared overhead multiplier.
            - The crossover closed form used to report metrics[5] must be the crossover OF THAT SAME LAW, i.e. it must solve log2 T(w*) + overhead_bits = log2 T_DG under it.
          binding_effect: >-
            If an incorporated law violates any invariant above, the contract is
            defective and the defect is repaired by a further recorded
            amendment, never by an edit and never by relaxing a control.
          notation_note: >-
            RECORDED BECAUSE IT WAS FOUND AND IS REAL. The symbol `w` is used in
            two senses in this contract: the Dickman argument log2X/log2B in
            model_definition.quantities, and the MEMORY BUDGET in table entries
            in the metrics list, in scenario_definitions
            .memory_budgets_log2w_entries, and in controls C3 and C4. Every
            occurrence of `w` in this key and in metrics[5] is the memory-budget
            sense. This amendment records the collision and does not rename
            either use; renaming would touch text no defect requires touching.
    clause_3:
      addresses: experiment.controls[0], C1-sanity-paper-pairs, lines 134-141
      operation: >-
        add three keys alongside the existing four; change no existing line of C1
      splice_indent: 4
      changed_from_the_superseded_draft: >-
        ONE NEW KEY, `tolerance_statement_note`, carrying RT-8's CF-14
        DISCLOSURE. Nothing else in clause_3 changed. The operation line reads
        "three keys" rather than "two" because of that key, and because clause_4
        adds its own key separately as before.
      replacement_text_in_full: |
        anchor_semantics:
          what_the_five_pairs_are: >-
            Figures stated in the frozen source as LOWER BOUNDS, from an
            underestimation the source itself describes as rough. PROVENANCE OF
            THAT CHARACTERIZATION, STATED EXACTLY: it is recorded by
            DEC-20260904-4c81b6 next_actions[0] limb (ii), and that decision's
            next_actions[1] records the source location as
            inputs/P13-WESOLOWSKI-2026/paper_fulltext.md:234-238. THE DRAFTING
            TASK DID NOT OPEN THAT FILE - it is outside its read scope - so the
            locator is cited to the decision that records it and not to a
            reading. Their fidelity to that source is settled: EV-SSI-7a3e91
            records a producer verification and a blind independent second
            extraction agreeing on all ten values. This contract takes those
            values as given and proposes no change to any of them. AN ENACTING
            COORDINATOR SHOULD CONFIRM THE LOCATOR AGAINST THE FILE BEFORE
            ENACTMENT.
          what_C1_is_and_why_its_test_is_two_sided: >-
            C1 is an INSTRUMENT SANITY GATE and a model-reproduction check, as
            success_criterion_note and C1.on_violation both declare. Its target
            is the source's ARITHMETIC, and a reimplementation landing above the
            source's figure is as suspect as one landing below, so the two-sided
            0.75-bit tolerance is CORRECT FOR C1'S OWN DECLARED PURPOSE and is
            retained here unchanged. The source's relation attaches to the
            INTERPRETATION of that arithmetic as an attack cost, not to the
            arithmetic itself.
          serialization_requirement: >-
            THE OPERATIVE CLAUSE. Any implementation of this contract that
            serializes a per-field anchor value, or a deviation computed against
            one, must emit with it: the relation the source states for it, the
            unit of the value, and a locator for the source line. A bare
            numeric pair under keys naming only a time and a memory is
            non-conforming, because it escapes the implementation carrying
            neither the relation nor the unit into records whose readers must
            re-derive both from a document outside their read scope.
          deviation_sign_note: >-
            A deviation computed against such an anchor is the signed difference
            of this model's value minus the source's stated figure. Its sign is
            information about the two quantities being different kinds of thing,
            not by itself an instrument fault, and it may not be reported as one
            without the anchor_reachability status required by clause_4.
          tolerance_statement_note: >-
            RECORDED BECAUSE IT WAS FOUND AND IS REAL, AND NOT REPAIRED HERE.
            This contract states C1's tolerance in two different magnitudes.
            success_criterion_note at line 49 calls C1 "an INSTRUMENT SANITY
            GATE carrying a 3-bit tolerance"; C1's own tolerance line at 139
            reads "abs deviation <= 0.75 bit on both time and memory"; and 3
            bits is the STOPPING RULE's rerun threshold at line 151, which is a
            different thing from a tolerance. The operative tolerance is the one
            on C1 itself. THIS AMENDMENT DOES NOT REPAIR THAT INCONSISTENCY: it
            is a different defect in a different key, it is tracked as CF-14,
            and repairing it here would touch text no defect this amendment
            names requires touching - the same reason clause_2's notation_note
            gives for not renaming `w`. The note exists so that the new C1 text
            above, which restates the 0.75-bit tolerance, cannot be read as
            having silently settled the conflict.
    clause_4:
      addresses: experiment.controls[0], C1-sanity-paper-pairs, lines 134-141
      operation: add one further key alongside those of clause_3
      splice_indent: 4
      changed_from_the_superseded_draft: >-
        TWO CHANGES, BOTH ROUTED. (1) RT-9(b): `why_it_is_required` is stated
        HYPOTHETICALLY - "may differ" replaces "is already known to differ" -
        because the per-field statuses were verified by nobody and could only be
        recomputed by executing a file this batch prohibits. The REQUIREMENT is
        unchanged and never depended on the premise. (2) RT-4: the two provisos
        the licensing analysis attaches are carried INTO this clause's own text
        rather than left behind a pointer into a batch task directory, so that
        on enactment the CONTRACT carries them and not just the coordination
        directory. The pointer to the fuller analysis is retained as a pointer
        to a fuller statement, which is a different thing from carrying the
        operative conditions behind it.
      replacement_text_in_full: |
        anchor_reachability:
          requirement: >-
            For every field size, an implementation of this contract must record
            whether the anchor's time is attainable by this cost model on the
            optimizer grid declared in model_definition.optimizer - that is,
            whether it lies at or above the minimum of log2(T_full) attained
            over log2B in [1.0, 60.0] at step 0.1. The status is recorded per
            field size, in the raw output, as `reachable` or `off_curve`.
          why_it_is_required: >-
            Stated hypothetically and deliberately so: BECAUSE THE STATUS MAY
            DIFFER ACROSS THE DECLARED FIELD SIZES, and because an
            implementation that emits fully formed comparison rows from an
            anchor that is not a point of this model, with no field recording
            that fact, invites a reader to treat two different KINDS of quantity
            as two estimates of one quantity. The requirement does not depend on
            what any per-field status turns out to be, and is well formed and
            useful even if every field size returns the same status. Recording
            the status is what stops that reading; it is not a defect report
            about the anchor and is not a claim that any published figure is
            wrong.
          licensing: >-
            An `off_curve` status LICENSES two things and no more. FIRST,
            reporting the anchor as the source's stated lower bound for that
            field size, CITED BY LOCATOR AND CARRYING ITS RELATION AND ITS UNIT -
            a bare number is not licensed. SECOND, comparing this model's
            attained value against it and reporting the signed difference,
            PROVIDED THE REACHABILITY STATUS IS REPORTED IN THE SAME BREATH AS
            THE DIFFERENCE - a signed difference emitted without its status is
            not licensed. It also licenses C1's instrument-sanity verdict, read
            alongside that status. An `off_curve` status FORECLOSES treating the
            anchor as an admissible (T_full, M) input to this model at that
            field size, and forecloses citing any row derived from it as a cost,
            a speedup or a crossover of this model. A `reachable` status
            licenses using the anchor as a model point at that field size, and
            licenses NOTHING about the field sizes where the status is
            `off_curve`.
          licensing_provisos_are_operative: >-
            The two conditions stated in capitals above - locator, relation and
            unit; and status in the same breath as the signed difference - are
            CONDITIONS ON THE LICENCE and not commentary. A report that omits
            either is outside the licence, exactly as if the status had not been
            recorded at all.
          fuller_statement: >-
            A longer discussion of what each status licenses and forecloses, and
            of the explanations that do and do not follow from a status, is at
            category_and_licensing_analysis.yaml of the BATCH-752ef2 drafting
            task. THAT POINTER IS TO A FULLER DISCUSSION ONLY. Every operative
            condition of the licence is stated in this clause's own text above,
            and a reader who never opens the pointer is not missing a condition.
          relation_to_the_standing_citation_prohibition: >-
            This clause neither lifts, narrows, nor restates the standing
            citation prohibition on the `P=512` crossover value and its
            `w=2^80` sign, nor its predicate extension. Both survive this
            amendment in full and are lifted only by a committed Coordinator
            decision on independently reviewed evidence.

