  # =====================================================================
  cf_10_raw_path_placement:
    question_as_posed: >-
      Does the CF-10 repair - cost_model.py's default raw-result output path
      naming the committed run directory RUN-WESOVOW-201692-001, so that an
      invocation without WESOVOW_RAW_PATH set writes into a committed run
      directory - belong in THIS amendment or in a separate one?
    answer: A SEPARATE, COMPANION RECORD, enacted in the same Coordinator decision as this one.
    status_of_that_answer: >-
      A SUBMISSION AND NOT A RULING, carried forward unchanged. The authority
      question - whether DEC-20260904-4c81b6 next_actions[4]'s `travels with`
      means the same ACTION or the same RECORD - is expressly reserved to the
      enacting decision by DEC-20260905-3b8e94 next_actions[1](i), and is not
      resolved here.
    reasons:
      - >-
        DIFFERENT ARTIFACT AND DIFFERENT KIND OF ARTIFACT. This amendment's
        target is a contract: a declarative YAML file that governs. CF-10's
        target is executable code. An amendment record whose target set spans
        both cannot be verified as enacted by one check, and the program has one
        live instance of a target set that was drawn wrong - the earlier
        amendment excluded the contract and the contract then drifted.
      - >-
        DIFFERENT DEFECT CLASS. CF-10 is an evidence-integrity hazard: the harm
        it risks is overwriting an immutable receipt. The defect this amendment
        repairs is a contract that cannot be satisfied as written. They are
        contained by different mechanisms - CF-10 by an execution prohibition,
        this one by nothing at all until amended - and a reviewer must be able
        to accept one and reject the other.
      - >-
        DIFFERENT ENACTMENT CONSEQUENCE. Repairing an output path is only
        meaningful if an invocation is contemplated, so that record naturally
        carries a run authorization question. THIS amendment authorizes no run
        and must stay separable from any record that does, so that enacting a
        contract repair never smuggles in an execution licence.
      - >-
        ECONOMY. The clause_3 serialization requirement and the clause_4
        reachability requirement also land in cost_model.py. One companion
        record carrying the output-path repair AND the serialization and
        reachability changes touches that file once, under one review, rather
        than twice.
    the_red_teams_fifth_reason_recorded_as_a_recommendation: >-
      RECORDED, NOT ADOPTED AS A RULING. BATCH-79a0cb's red team agreed with the
      companion-record structure for a fifth reason of its own: the two records
      have DIFFERENT ENACTMENT PREDICATES and one of them is currently
      unservable, because a contract amendment is verified as enacted by
      re-parsing one YAML file - an operation this batch can perform, and which
      RT-1 showed is not trivial - while a code repair's enactment is verified
      by inspecting or running a program whose EXECUTION IS PROHIBITED under
      CF-10. It attached a condition: both must be enacted by the same decision,
      because clauses 3 and 4 leave the contract with no conforming
      implementation until the companion lands. DEC-20260905-3b8e94
      next_actions[1](i) records that preference AS A RECOMMENDATION AND NOT AS
      A RULING, and this draft carries it the same way.
    what_the_companion_record_should_carry:
      - the output-path repair, so no invocation can write into a committed run directory with or without WESOVOW_RAW_PATH set
      - the serialization change implementing clause_3 at the per-field emission site, cost_model.py line 302
      - the reachability status emission implementing clause_4
      - explicitly NO run authorization; that is a further, separate Coordinator decision
    recorded_tension_the_coordinator_must_resolve: >-
      DISCLOSED RATHER THAN ABSORBED. DEC-20260904-4c81b6 next_actions[4] states
      of CF-10 that "the repair travels with the CF-1 amendment because it is a
      change to a frozen artifact." This draft reads "travels with" as travelling
      in the same amendment ACTION and the same enacting decision, not
      necessarily inside the same amendment RECORD, and recommends the companion
      structure above on the four reasons given. If the Coordinator reads
      next_actions[4] as requiring one record, that reading governs and this
      draft is wrong on this point alone; nothing else in it depends on the
      answer. The tension is recorded here so the choice is made deliberately
      rather than inherited.

