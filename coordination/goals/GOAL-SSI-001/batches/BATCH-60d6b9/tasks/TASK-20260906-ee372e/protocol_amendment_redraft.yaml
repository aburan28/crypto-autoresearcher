      implemented_at: coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/amendment_parse_control.py
      exercised_result_at: coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/amendment_parse_control_report.yaml
      what_it_is_for: >-
        THE CONTROL RT-1 SHOWED THIS AMENDMENT LACKED. An amendment that
        replaces text in a machine-readable contract must carry a check that the
        RESULT still loads and still has the declared shape. This one applies
        clause_1 under the declared splice procedure and checks the result.
      assertions:
        - P1 - the amended text parses with yaml.safe_load.
        - P2 - experiment.metrics is a list of exactly 7 items.
        - P3 - metrics[5] is a mapping with exactly one key.
        - >-
          P4 - THE CONTENT ASSERTION. metrics[5] equals, key and value, the
          parse of clause_1's own replacement_text_in_full. Without P4 the
          control passes on the UNAMENDED frozen file, whose metrics list is
          already 7 items long and whose item 5 is already a single-key mapping,
          and a control that passes on the file it exists to detect the
          amendment of carries no information about the amendment.
      failure_behaviour: exits nonzero and names the first assertion that failed, with the parse error where P1 is the one that fails.
      negative_objects_it_was_exercised_on:
        - the UNAMENDED frozen file with no clause applied - must fail, on P4
        - the SUPERSEDED BATCH-752ef2 clause_1 text - must fail, on P1
        - a replacement that parses but yields a metrics list of length other than 7 - must fail, on P2
        - a replacement that parses but makes metrics[5] a plain string - must fail, on P3
        - this redraft's clause_1 - must pass
      what_it_does_not_check: >-
        STATED SO IT IS NOT OVER-READ. It checks that the amended contract LOADS
        and that metrics[5] carries this clause's own content. It does NOT check
        that the content is correct, that the incorporated law is the right
        model of the vOW middle-memory regime, that any other consumer of the
        contract accepts the amended file, or that clauses 2, 3 and 4 are
        substantively right - only that they splice and parse, which the report
        records separately. It is a shape-and-identity control, not a semantic
        one.

