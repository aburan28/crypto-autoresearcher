  execution_prohibition:
    new_experiment_runs_authorized: 0
    statement: >-
      This batch authorizes NO execution of any experiment implementation and
      creates NO run record. Authorized invocations are of (i) the redraft
      producer's own standalone parse control, which reads the frozen contract and
      its own draft record and writes NOTHING into the repository outside its task
      directory; (ii) the reviewer's own standalone re-check; and (iii) either
      agent's throwaway scratch scripts, written OUTSIDE the repository. Calling a
      standalone control module is NOT a run and does not write a run record: this
      is the standing interpretation ruled in DEC-20260904-166ab5 PD-4, restated on
      every card of this batch rather than left to be inferred. NOTHING may be
      written into any BATCH-752ef2 or BATCH-79a0cb directory, into experiments/,
      or into inputs/.
    the_amended_file_is_never_written_to_disk_in_the_repository: >-
      The parse control splices IN MEMORY, or into a scratchpad OUTSIDE the
      repository. Writing an amended specification.yaml anywhere under
      experiments/ - even under a different name, even temporarily - is a stop
      condition. The contract is frozen and unamended at version 1 and must remain
      so at every instant of this batch.

  network_use:
    required_by_any_task: false
    statement: >-
      No task of this batch needs the network, and no conclusion of this round may
      rest on a retrieval. A retrieval failure is infrastructure signal and is
      never mathematical evidence about anything. A model recollection is a
      `recalled` pointer under AGENTS.md rule 9 and is never support; naming the
      nearest work you can recall, marked and hedged, is wanted, and presenting it
      as a checked source is the violation.
    prohibited: >-
      Never select a provider, backend, endpoint, or model identifier containing
      `bedrock`, case-insensitively (AGENTS.md rule 16).

  archive_topology:
    shape: >-
      FOUR TASKS. TASK-20260906-ee372e and TASK-20260906-0fbf69 (producers,
      parallel, disjoint write scopes) -> [PRE-REVIEW COMMIT, see below] ->
      TASK-20260906-ba0284 (validator, independent session, runs alone after the
      producers) -> TASK-20260906-9f3e2a (the LEDGER ARCHIVE, coordinator, runs
      alone, the queue's SINGLE archive-block task, `kind: ledger`,
      `binding_mode: content_first`, owning ALL THREE non-archive tasks as
      sources).
    what_four_identifiers_foreclose_and_it_is_stated_first: >-
      THE SHAPE THIS PROGRAM'S ARCHIVAL CONTRACT WANTS FOR TWO PRODUCERS AND A
      REVIEW IS FIVE TASKS, NOT FOUR, AND THIS BATCH COULD NOT MINT A FIFTH.
      BATCH-752ef2 is the worked example: two producers with `review_required:
      true`, a SNAPSHOT ARCHIVE task owning both, a Validator depending on both and
      on the snapshot, and a LEDGER ARCHIVE owning the Validator.
      tools/research_dispatch.py `_validate_review_chains` ENFORCES exactly that
      chain the moment a producer sets `review_required: true`. Five tasks need
      five identifiers; FOUR were pre-allocated, and this authoring task holds no
      shell and cannot run `tools/allocate_id.py --next task`, and inventing a
      conforming token is forbidden. So the batch is designed to the identifiers it
      has, exactly as BATCH-79a0cb designed itself to three, AND THE COST IS
      RECORDED RATHER THAN HIDDEN.
    the_two_renderable_four_task_shapes_and_why_this_one: >-
      With two producers and four identifiers there are exactly two shapes that
      render, because the dispatcher requires every archive to name a NONEMPTY
      source list, forbids one non-archive task being assigned to two archives, and
      requires EVERY non-archive task to be assigned to exactly one archive.
      SHAPE ONE: two producers, a snapshot-committing coordinator task carrying no
      archive block, and a ledger archive owning all three - BATCH-79a0cb's proven
      topology, which has NO REVIEWER, so `check_review_independence.py` finds no
      `review_attestation`, exits 2, and the review plan is unexercised.
      SHAPE TWO, CHOSEN HERE: two producers, an independent reviewer, and a ledger
      archive owning all three. It buys the independent review and the exercised
      independence gate, and it costs the SNAPSHOT ARCHIVE TASK.
    review_required_is_false_on_both_producers_and_that_is_a_declaration_not_a_claim: >-
      READ THIS BEFORE CONCLUDING THE PRODUCERS ARE UNREVIEWED. Both producers
      carry `review_required: false` in the queue. THEY ARE REVIEWED - by
      TASK-20260906-ba0284, which depends on both by name, owns four joints
      covering both, and files the round's review_attestation. The flag is false
      because setting it true triggers the five-task chain above, which this batch
      cannot express with four identifiers; leaving it true would produce a queue
      that does not render, which is a worse failure than a declared one. THE
      SUBSTANCE OF THE CHAIN IS PRESERVED BY EXPLICIT `depends_on` AND BY THE
      PRE-REVIEW COMMIT PRECONDITION BELOW. This is recorded as a DEPARTURE, in the
      opening decision DEC-20260906-78d9f7 procedure_deviations, and it must not be
      read as a judgement that either producer is not claim-relevant.
    the_pre_review_commit_which_is_how_snapshot_before_review_survives: >-
      AGENTS.md requires a producer's exact artifacts to be committed BEFORE an
      independent agent reviews them, and this batch honours that in substance
      while spending no identifier on it. TASK-20260906-ba0284 carries a BINDING
      `dispatch_precondition`: it may not be dispatched until the dispatching
      Coordinator session has committed EXACTLY the six producer artifact paths, by
      exact pathspec, in ONE commit whose message states record identifiers and
      locators only, and has recorded that commit's sha, its parent, and the
      sha256 of each of the six paths, to be carried verbatim into
      TASK-20260906-9f3e2a's ledger_commit_receipt.json. IF THAT COMMIT CANNOT BE
      MADE, THE REVIEW IS NOT DISPATCHED: the batch stops and returns to the
      Coordinator rather than reviewing uncommitted artifacts.
    what_the_pre_review_commit_costs_and_what_it_does_not: >-
      COST, STATED PLAINLY. That commit is made by the dispatching session and NOT
      by a queued archival task, so it has no task card, no budget, no completion
      gate of its own, and NO DISPATCHER POST-COMMIT VERIFIER PASSES OVER IT. That
      is the same cost BATCH-79a0cb accepted for its snapshot commit, one notch
      worse: BATCH-79a0cb's snapshot at least had a card and a receipt.
      MITIGATION, WHICH IS A COMPLETION GATE ON THE LEDGER ARCHIVE: TASK-20260906-9f3e2a
      must recompute the sha256 of all six producer paths, confirm they match what
      was recorded before the review ran, confirm the pre-review commit is an
      ancestor of HEAD, and RECORD THE RESULT EITHER WAY. A mismatch means a
      producer artifact changed after it was reviewed and is a stop, not a note.
      WHAT IT DOES NOT COST: nothing about the isolation rule. No worker commits
      into the shared worktree, the reviewer commits nothing, and the ledger
      archive runs alone.
    why_binding_mode_is_content_first: >-
      Because six of the fourteen expected paths - both producers' artifacts - are
      committed by the pre-review commit BEFORE the ledger archive runs, so one
      exact changed-path commit cannot express custody of the whole set. That is
      the documented purpose of `content_first` in tools/research_dispatch.py, and
      it is opt-in precisely so nobody infers it from a failed scope check. Under
      it the verifier still requires a REAL, REACHABLE commit with its declared
      parent and the archival identifiers in its message, and it binds every
      declared artifact's bytes at HEAD; what it does not require is that one
      commit changed all fourteen. THE LEDGER ARCHIVE'S OWN COMMIT CHANGES EXACTLY
      EIGHT PATHS - its five, plus the reviewer's three - and its `path_sha256`
      MUST COVER ALL FOURTEEN on completion.
    expected_path_set_for_the_single_archive_task_enumerated_with_its_count:
      count: 14
      rule: this task's artifact_paths UNION every source task's artifact_paths
      paths:
