  no_blind_phase:
    declared: false
    statement: >-
      THIS BATCH HAS NO BLIND PHASE. No value is protected, no `protected_sha256`
      map is armed, no commit-message history check gates any dispatch, and no
      task is handed a pre-merge worktree. `tools/check_review_independence.py
      --blind-history` is NOT APPLICABLE to this batch; a report of UNCHECKABLE
      from that mode would be CORRECT rather than a defect, and it must not be run
      or recorded.
    why_reasoned_for_this_batch: >-
      A blind phase exists to stop an agent being told the answer to a
      measurement it is about to make independently. THREE TASKS WERE CHECKED
      AGAINST THAT TEST, ONE BY ONE. (A) The redraft producer measures nothing: it
      rewrites a record and then runs a deterministic parser over its own output.
      Its mechanical result is not a quantity this repository holds; it is a
      property of a file that does not exist yet. (B) The CF-9 producer attests
      provenance FROM committed artifacts and git history - the artifacts ARE its
      evidence, so withholding them would not blind it, it would disable it, and
      there is no external document from which anything is re-extracted. (C) The
      reviewer's most independent act is re-performing the splice-and-parse; but
      the ANSWER to that check for the SUPERSEDED text is already published in
      committed records (the red-team report, EV-SSI-1a95bc, the goal head), and
      the answer for the REDRAFTED text will be in the producer's committed report
      the reviewer must read to review it. There is nothing to protect. What
      replaces protection is an ATTESTED READING ORDER, below, which is weaker and
      is recorded as weaker.
    the_ten_values_are_not_an_object_here: >-
      The ten Section 4.1 cost values that were protected in BATCH-752ef2 are not
      an object of any joint of this batch, are needed by no task, and are not to
      be restated by anyone. That is the citation and scope discipline below, not
      blindness, and the two must not be conflated.
    what_would_re_arm_one: >-
      Any successor task that re-derives a quantity this repository already holds:
      a second external retrieval, a re-extraction of the ten values, an
      independent recomputation of a crossover or an anchor, or a re-derivation of
      a composed verdict. Such a task gets the full BATCH-752ef2 machinery back -
      the arming recipe, the digest map, the self-check over control-plane files,
      `--blind-history` on the exact ref handed over, and a PRE-MERGE base, never
      that branch and never main, because the CORR-20260905-547849 leak reached
      `main`.
    cf_15_first_limb_still_has_no_object: >-
      CF-15's first limb - naming the launching prompt as a protected channel
      INSIDE a blind-phase declaration - has no object here for the second batch
      running, because this batch declares no blind phase. It remains OWED by the
      next batch that declares one. Its second limb IS applied: see
      launching_prompt_disclosure.
    the_honest_residual: >-
      Declaring no blind phase does NOT make this round free of disclosure
      effects. The reviewer is launched by a session that has read the producers'
      output, the red-team report and the composing decision, and it is told what
      to attack. That is F-12's channel (CF-15) and it is unavoidable when the
      assignment IS the attack. It is bounded instead of hidden.

  reading_order:
    binding: true
    it_is_not_a_blind_phase: >-
      SAID PLAINLY SO IT IS NOT MISREAD AS ONE. This is an ordering requirement on
      two joints, attested by the reviewer and NOT tool-checkable. No path is
      forbidden to the reviewer at any time, nothing is protected, and no hygiene
      declaration is armed. review_plan.yaml `blind_rederivation.required` is
      deliberately false and the reason is recorded there.
    requirement: >-
      For joints J1 and J2 only: write and run YOUR OWN splice-and-parse of the
      redrafted clause_1 - and of the SUPERSEDED clause_1 - against
      experiments/EXP-WESOVOW-001/specification.yaml lines 39-40, from the
      redraft record's own bytes, BEFORE opening
      tasks/TASK-20260906-ee372e/amendment_parse_control.py or its report. Then
      open them and say where yours differs. Record in your report that you did it
      in that order, or record honestly that you did not.
    why: >-
      J2 asks whether the new control can fail. An agent that reads the
      producer's control first will check the producer's assertions, which is a
      different and weaker question than whether the amended file actually parses
      and actually differs from the unamended one. The cost of getting this wrong
      is a review that re-runs the producer's own construction and reports its
      agreement as corroboration.

  citation_prohibition:
    status: >-
      IN FORCE, RETAINED IN FULL, BOTH LIMBS. NOT LIFTED, NOT NARROWED, NOT
      WIDENED BY THIS BATCH, AND NO TASK OF THIS BATCH MAY LIFT IT. It has been
      considered for lifting and deliberately retained in FOUR consecutive
      committed decisions (DEC-20260904-166ab5, DEC-20260904-4c81b6,
      DEC-20260905-5f5592, DEC-20260905-3b8e94). Every ground those decisions
      recorded survives the opening of this batch untouched.
    retained_verbatim: >-
      The `P=512` crossover value and its `w=2^80` sign are **NOT
      citation-eligible**. This task does not lift that prohibition. Only a
      committed Coordinator decision on independently reviewed evidence can lift
      it.
    predicate_extension_verbatim: >-
      In addition to the retained sentence, a row of any EXP-WESOVOW-001
      reconciliation is NOT citation-eligible when either (a) the two anchors
      disagree in the SIGN of the baseline comparison at that row, or (b) the
      smaller |margin| across the two anchors at that row is below that field
      size's anchor gap |Delta log2 T_full + Delta log2 M / 2|.
    the_newest_ground_for_retention_restated: >-
      DEC-20260905-3b8e94 added a ground that did not exist before and it binds
      this batch: RT-2 establishes that the adopted monotonicity route is
      CONDITIONAL ON `A > 0`, and `A > 0` IS the per-row baseline-comparison sign
      the retained sentence governs. Discharging that conditional into a statement
      about the contract's actual rows would require computing exactly the
      governed quantity. NO TASK OF THIS BATCH MAY COMPUTE IT, including while
      arguing that the redraft should have said something about it.
    machine_flag_status: >-
      BATCH-256a94's anchor_reconciliation.json per-row `citation_prohibited` flag
      is scoped by field size and is KNOWN TO UNDER-REPORT: at least two rows
      carrying `citation_prohibited: false`, at log2 p = 256, fall under the
      predicate. That artifact is snapshot-bound, IMMUTABLE, and MUST NOT be
      edited. Every consumer applies the four decisions above on top of it. This
      batch produces no successor to it and does not repair it.
    application_to_this_batch: >-
      Reasoned, not assumed. Producer (A) rewrites a record whose primary target is
      an analytic crossover line, so the retained sentence is APPLICABLE exactly as
      it was applicable to the original drafting task. QUOTING the frozen
      contract's text and the draft's replacement text is permitted. DERIVING,
      RECOMPUTING, TABULATING or CITING a crossover value, a baseline-comparison
      sign, a margin or a speedup is NOT. Producer (B) will have
      RUN-WESOVOW-201692-001/raw-result.json inside its reading radius and MUST NOT
      copy any value out of it into its record; it names rows and fields by
      locator. Every artifact of this batch restates both limbs verbatim and states
      which, if either, it found applicable and whether either fired.
    lift_procedure: >-
      Only a committed coordinator_decision resting on independently reviewed
      evidence may lift it. No identifier is reserved here for a lift. NOTE, AND IT
      IS THE ONE THING THIS BATCH CHANGES ABOUT THE QUESTION: CF-9 is a standing
      GROUND for retention, so a CF-9 discharge removes one ground and by itself
      lifts nothing - the off_curve anchor status at three of five field sizes,
      CF-7's undischarged remainder for the reconciliation procedure, the free
      overhead knob, and the RT-2 ground above all survive whatever CF-9 returns.
      The closing decision must reason the question FOR THIS ROUND rather than
      inherit it.

