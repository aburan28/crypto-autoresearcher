  why_these_two_producers_and_why_now:
    producer_a_is_the_single_next_action: >-
      RT-1 is the ONLY BLOCKING finding of BATCH-79a0cb and the enactment path
      cannot proceed until the draft is redrafted as a NEW record. The repair
      itself is two spaces on eight continuation lines; the reason this is a
      producer task and not a footnote is the SECOND half of RT-1, which is the
      finding's real content: the check that would have caught it - parse the
      amended contract and report its shape - is the one control this amendment
      lacks, and an amendment that replaces text in a machine-readable contract
      has no control that the result still loads. THAT CONTROL IS THE DELIVERABLE
      THIS BATCH EXISTS TO PRODUCE. DEC-20260905-3b8e94 knowledge_promotion
      records it as "demonstrated once, by the failure it would have caught, and
      not yet implemented anywhere"; implementing it is what turns CF-20 from a
      good intention into something a successor can re-run.
    producer_b_is_owed_and_the_holding_ends: >-
      CF-9 was held for TWO CONSECUTIVE BATCHES and DEC-20260905-3b8e94
      next_actions[3] records it as DISPATCHED IN THIS ONE, with the expired
      holding reason stated: the reason given twice was that a second producer
