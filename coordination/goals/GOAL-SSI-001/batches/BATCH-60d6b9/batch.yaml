      the round before that recorded an adapter-resolved identifier DIVERGING from
      its own session's self-report; (c) every agent of this batch is a subagent of
      one orchestrating session, sharing one filesystem and one scratchpad. THE
      MOST THIS BATCH CAN ASSERT IS THAT THE REVIEWER RAN IN ITS OWN SESSION,
      INDEPENDENT OF BOTH PRODUCERS'. Agreement between the reviewer and a producer
      is corroboration by a second METHOD in a second SESSION, never agreement
      between distinct models, and any artifact that presents it as the latter is
      wrong.
    what_that_leaves_open: >-
      Concretely: a shared misreading of the frozen file, a shared assumption about
      what a control must assert, and a shared blind spot about what an amendment
      is allowed to do. Two sessions of one model family agreeing is evidence about
      the argument's legibility to that family and weaker evidence about its
      correctness.
