  review_routing_determination:
    tier: review-adversarial at xhigh, in an independent session, for the single review task.
    basis: >-
      The routing rules escalate to review-breakthrough at `max` for a claimed
      breakthrough, a proposed closure, or a result contradicting prior VALIDATED
      evidence. NONE APPLIES AT THE OPENING STATE: this round claims no
      breakthrough, closes no lane, approves no amendment, enacts nothing, promotes
      no knowledge and moves no status. That is a statement about the opening state
      only.
    why_a_validator_and_not_a_red_team: >-
      CHOSEN, AND THE ALTERNATIVE IS NAMED. The objects of this round are an
      artifact's INTEGRITY and a control's ABILITY TO FAIL: does the redraft carry
      exactly what was ordered and nothing more, does the new control actually
      discriminate, does the CF-9 attestation claim exactly what its evidence
      supports. That is the Validator's contract - integrity, controls, stated
      metrics. A Red Team would attack the INTERPRETATION and SCOPE of the redraft
      as a proposed act, which BATCH-79a0cb already did to its predecessor and
      which the ENACTING decision will need again on the redraft. WHAT THIS COSTS:
      the redraft receives an integrity review and not a second adversarial reading,
      so the enacting decision may not treat this round as the red-team pass on the
      redrafted record. It is not one, and no artifact of this batch may say it is.
    why_one_reviewer_and_not_two: >-
      RECORDED AS A COST, NOT AS A DESIGN VIRTUE. Four identifiers, two of which are
      producers and one an archive, leave exactly one review task. Each of J1
      through J4 is therefore attacked ONCE, by one agent, of one model family,
      under one orchestrating session. It is mitigated only by the facts that
      nothing is promoted or enacted by this round and that the enacting decision
      must still be made deliberately.
    a_no_findings_verdict_is_a_full_result: >-
      RECORDED IN THE CONTROL PLANE, BEFORE THE REVIEW, SO IT CANNOT BE READ AS
      RELIEF AFTERWARDS. `holds` on all four joints is a fully acceptable and fully
      valuable outcome. STRAINING TO BREAK SOMETHING IN ORDER TO JUSTIFY THE PASS
      IS ONE OF THIS BATCH'S TWO NAMED FAILURE MODES - manufactured objections are
      worse than none, because they consume the enacting decision's attention and
      teach later readers to discount review findings generally. What is required is
      not a break; it is a recorded, specific, checkable SEARCH per joint.
    the_other_named_failure_mode_which_belongs_to_the_producer: >-
      A REDRAFT THAT QUIETLY IMPROVES THINGS NOBODY ORDERED. The standing
      temptation of a redraft is to fix what it notices. Every change beyond the
      enumerated ordered list is unmandated widening, is exactly what BATCH-79a0cb's
      joint R4 was built to catch, and is J3's assignment here.
    stop_condition_that_can_change_the_tier: >-
      IF THE REVIEWER CONCLUDES THAT THE UNDERLYING DEFECT DOES NOT REPRODUCE -
      that specification.yaml:39-40 and control C4 are not jointly unsatisfiable off
      the degenerate slice, or that the two blocks are not in one scope - THAT
      OBJECT CONTRADICTS COMMITTED, VALIDATED EVIDENCE. EV-SSI-2aaf6f records the
      reproduction at strength `replicated`. Under AGENTS.md rule 12 such an object
      requires review-breakthrough at `max`, which is `degradable: false` and which
      this environment cannot serve (IMP-1). THE BATCH THEN HALTS ON THAT OBJECT: it
      is NOT composed under review-adversarial, the CLAIM stays un-promoted,
      GOAL-SSI-001 stays `active` with the impediment recorded, and the Coordinator
      decides what else the round can still record. Substituting an adversarial
      review for a breakthrough review to keep the round moving is the silent
      downgrade the policy layer forbids. THIS IS NOT A REASON TO SOFTEN SUCH A
      FINDING: it is the most consequential thing the reviewer could find.

