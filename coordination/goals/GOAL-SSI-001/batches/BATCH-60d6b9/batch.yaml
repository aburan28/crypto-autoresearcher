      Every task's runtime receipt records the requested policy, the resolved model
      identifier as the adapter reports it, its own self-report if it differs,
      `model_verified` with whether a probe was actually run, and must ESCALATE
      rather than absorb any divergence. Recording an attestation, a probe, or a
      model identity you did not obtain is a fabrication under AGENTS.md rule 9.

