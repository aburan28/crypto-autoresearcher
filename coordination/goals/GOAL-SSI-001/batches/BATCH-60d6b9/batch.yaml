  frozen_artifact_ruling_note_on_the_f1_fix: >-
    THE ONE-CHARACTER FIX FOR F-1 IS NOT MADE HERE, AND THE REASON IS NOT
    TIMIDITY. amendment_controls.py is bound by BATCH-752ef2's snapshot commit,
    was the instrument under attack at BATCH-79a0cb's joint R2, and is in no write
