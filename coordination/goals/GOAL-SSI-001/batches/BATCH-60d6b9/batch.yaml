# THIS BATCH HAS NO BLIND PHASE, AND THAT IS A DECISION TAKEN FOR THIS BATCH,
# NOT COPIED FROM THE LAST ONE. There is no `blind_phase_hygiene` block below
# and no `protected_sha256` map. The analysis is at no_blind_phase and it is
# done from this batch's own tasks: neither producer re-derives a value this
# repository already holds from a source outside it, and the reviewer is given
# every producer artifact by design because judging them is its assignment.
# Arming a digest map here would declare a protection that protects nothing,
# and a declaration that protects nothing teaches every later reader to skip
# the one that does (CORR-20260905-547849 is the record of what that costs).
#
# THIS BATCH APPROVES NOTHING AND ENACTS NOTHING. EXP-WESOVOW-001 remains
# `approved` and UNAMENDED at version 1. The deliverable of producer (A) is a
# `status: draft` record. DRAFTING IS NOT AMENDING, and opening a batch is not
# approving anything in it.
batch:
  id: BATCH-60d6b9
  goal_id: GOAL-SSI-001
  question_ids:
    - RQ-SSI-001
  title: >-
    The redraft of the superseding protocol amendment for
    experiments/EXP-WESOVOW-001/specification.yaml:39-40 - repairing RT-1 and
    IMPLEMENTING THE CONTROL WHOSE ABSENCE RT-1 EXPOSED - together with CF-9,
    the two `dirty_tree` runs, dispatched rather than held a third time.
  status: ready_for_dispatch
  status_note: >-
    Successor control plane to BATCH-79a0cb, which DEC-20260905-3b8e94 closed as
    `revise` with exactly one next research action. FOUR TASKS: two producers in
    parallel, one independent review, one ledger archive. This file authorizes no
    execution by itself; dispatch_queue.json is the bounded dispatch contract.
    NO hypothesis status, experiment status, or goal status moves in this batch.

  opened_under_next_action: >-
    Quoted from the committed GOAL-SSI-001 head (ledger/goals/GOAL-SSI-001/goal.yaml,
    field `next_action`), which this batch implements: "THE NEXT RESEARCH ACTION
    is to open ONE bounded successor batch with TWO producers: (A) a NEW
    superseding amendment draft record - never an edit to the immutable
    BATCH-752ef2 draft - repairing RT-1 and carrying RT-4, RT-5, RT-7, RT-8,
    RT-9(b), OP-2, OP-3 and the R3 warrant sentence, AND adding the parse
    control; and (B) CF-9, the two `dirty_tree` runs, DISPATCHED RATHER THAN HELD
    A THIRD TIME."
  opened_under_next_action_read_note: >-
    HOW THAT FIELD WAS OBTAINED, STATED EXACTLY. This authoring task holds
    Read/Grep/Glob/Write/Edit and NO SHELL. It could not run
    `python3 tools/goal_head.py show GOAL-SSI-001 --field next_action`, which is
    the instrument the dispatching session named. It read the committed file
    ledger/goals/GOAL-SSI-001/goal.yaml directly and independently read
    ledger/decisions/DEC-20260905-3b8e94.yaml next_actions[0] and [3] and
    ledger/goals/GOAL-SSI-001/checkpoints/BATCH-79a0cb.yaml `next_action`; all
    three agree on the two producers and on what each must carry. THE DISPATCHING
    SESSION SHOULD RE-RUN THE TOOL AND RECORD ANY DIVERGENCE AS A FINDING rather
    than reconciling it silently. Reading a file the tool renders is weaker than
    running the tool, and is recorded as such.

  the_enacting_decision_is_not_in_this_batch: >-
    STATED FIRST BECAUSE IT IS THE MOST LIKELY MISREADING OF THIS BATCH. This
    batch produces a NEW DRAFT and reviews it. It does not approve the amendment,
    does not enact it, and does not move EXP-WESOVOW-001 off `approved` at
    version 1. The four items DEC-20260905-3b8e94 next_actions[1] reserves to the
    enacting decision - the CF-10 RAW_PATH placement question, the F-7
    over-reading path, the F-2/F-3 warrant defects, and RT-4/RT-6/RT-9(a)/RT-12 -
    are NOT resolved here. Two of them (RT-4 and RT-9(b)) are carried into the
    REDRAFT'S TEXT because DEC-20260905-3b8e94 routed them there; carrying a
    proviso into a drafted clause is not resolving the enacting decision's
    question about that clause, and the redraft may not present it as such.

  objective: >-
    Two producers in parallel, then one independent review, then one ledger
    archive. (A) TASK-20260906-ee372e produces a NEW, SUPERSEDING amendment DRAFT
    record - never an edit to
    coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/protocol_amendment_draft.yaml,
    which is immutable and snapshot-bound at 2eef128634f23971727626c3974808fa27026987 -
    repairing RT-1, carrying the seven small repairs DEC-20260905-3b8e94 routed to
    the redraft, repairing the R3 warrant sentence WITHOUT resting on the refuted
    monotonicity derivation, AND IMPLEMENTING AND EXERCISING THE CONTROL THE
    AMENDMENT LACKS: a standalone check that parses the amended contract and
