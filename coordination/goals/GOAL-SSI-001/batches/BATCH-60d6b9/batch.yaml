  frozen_artifact_ruling_note_on_the_run_manifests: >-
    STATED SEPARATELY BECAUSE CF-9 IS ABOUT THEM AND THE TEMPTATION IS REAL. The
    two manifests carrying `dirty_tree: true` are IMMUTABLE RUN RECORDS. CF-9 is
    discharged by writing a NEW attestation record ABOUT them, in the producer's
    own task directory. It is never discharged by editing a manifest, by adding a
