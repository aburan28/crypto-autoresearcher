      ranked ahead of doing nothing because it is the single blocking item on the
      campaign's only live enactment path and because its control generalizes to
      every future amendment of a YAML contract in this program. (B) is ranked
      ahead of doing nothing because it is owed, cheap, and unblocked, and
      because leaving it unheld-but-undone a third time would be deprioritization
