      SHOULD HAVE DONE. A pass where the conclusion is known false is a BREAK and is
      reported as one, never as robustness. If a pass turns out to be entailed by its
      own construction, say so plainly: that disclosure is worth more than the pass
      (DEC-20260904-166ab5 on RG-4; DEC-20260904-4c81b6 F-3; RT-3 of the BATCH-79a0cb
      report).
    assigned_to: TASK-20260906-ba0284

  blind_rederivation:
    required: false
    why_not_required: >-
      A DELIBERATE `false`, WITH ITS REASON, AND NOT AN OMISSION - and the reason is
      MECHANICAL, not merely economic. A `blind_from` list is checked by
      tools/check_review_independence.py against the re-deriver's declared
      `sources_read`, and this round has ONE reviewer whose assignment REQUIRES it to
      read the producer's control script and report (joint J2 is precisely a review
      of that script). Declaring those files `blind_from` would either make the
      reviewer's honest `sources_read` collide with its own blind list, or force it to
      skip the joint. With one reviewer the two cannot be separated; with two
      reviewers they could, and a successor batch with five identifiers should do
      exactly that.
    what_replaces_it_and_it_is_weaker: >-
      THE ATTESTED READING ORDER at batch.yaml reading_order and in joints J1 and J2:
      the reviewer writes and runs its OWN splice-and-parse, from the redraft record's
      own bytes, BEFORE opening amendment_parse_control.py or its report, and attests
      the order. That is an attestation, not a mechanically checkable `blind_from`
      list, and it is recorded as weaker rather than described as equivalent. No path
      is forbidden to the reviewer at any time.
    quantity_if_it_were_required: >-
      Recorded so a successor does not have to reconstruct it: whether the file
      obtained by splicing the redrafted clause_1 replacement text over
      experiments/EXP-WESOVOW-001/specification.yaml lines 39-40 parses, and whether
      its `experiment.metrics` is a 7-element list whose item 5 is a single-key
      mapping carrying the replacement's own key - together with the same three
      answers for the SUPERSEDED clause_1 text and for the unamended file.
    blind_from: []
    assigned_to: null

