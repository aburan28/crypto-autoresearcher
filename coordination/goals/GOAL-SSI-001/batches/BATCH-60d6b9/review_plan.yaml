    objects:
      - >-
        THE UNAMENDED FROZEN CONTRACT. Run the new parse control against
        experiments/EXP-WESOVOW-001/specification.yaml exactly as committed, with no
        clause applied. "The amendment has been applied and the amended contract has
        the declared shape" is KNOWN FALSE for it - and the file nevertheless ALREADY
