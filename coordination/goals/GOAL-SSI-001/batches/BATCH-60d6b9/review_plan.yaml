      - >-
        THE SUPERSEDED clause_1 TEXT, spliced over lines 39-40. "This amended file
        parses" is KNOWN FALSE for it: two sessions have reported a ParserError. The
        control must FAIL, and must fail on the PARSE assertion rather than on a
        shape assertion. A control that reports a shape failure here is not reading
        what it thinks it is reading; a control that PASSES here contradicts two
        committed reports and that contradiction is itself the finding.
      - >-
        A REPLACEMENT THAT PARSES BUT BREAKS THE SHAPE, in two variants you
        construct: one that leaves experiment.metrics with a number of items other
        than 7, and one that makes metrics[5] a plain string rather than a single-key
