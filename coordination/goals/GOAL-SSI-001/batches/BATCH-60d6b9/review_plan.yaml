    - joint: J2 the new parse control and whether it can fail - or whether its pass is entailed by its own construction
      assigned_to: TASK-20260906-ba0284
      attack_plan: >-
        THE JOINT THIS ROUND EXISTS FOR. RT-1's real content is that the amendment
        lacked a control that the amended contract still loads. A control that
        cannot fail is worse than no control, because it converts an unchecked
        assertion into a checked-looking one - and this package has already produced
