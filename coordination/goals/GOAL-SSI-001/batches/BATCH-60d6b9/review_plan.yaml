        wrong place, or not carried. RT-4 IS THE ONE I EXPECT TO BE CARRIED IN THE
        WRONG PLACE - its entire content is that a proviso behind a pointer is not a
        proviso in the contract, so a redraft that summarizes it again, or points at
        the analysis again, has repeated the defect while appearing to repair it.
        THE R3 WARRANT SENTENCE GETS ITS OWN CHECK, BECAUSE IT IS THE HARDEST.
        BATCH-79a0cb REFUTED the claim that C3 forces the satisfying set
        INDEPENDENTLY of C4: C3's second clause instantiated at w = M IS C4, so the
        C3 route is the same inference from a strictly stronger premise and invites a
        reader to count one source as two. AND the replacement route
        DEC-20260905-5f5592 adopted - monotonicity - was itself found to be missing
        an endpoint premise (which is C4 again) and the omitted `capped by M` premise,
        and as recorded it returns CONTRADICTION on two objects where that is known
        false. THE REDRAFT MAY NOT REST ON THE REFUTED DERIVATION AND MAY NOT SILENTLY
        SUBSTITUTE THE REPAIRED ONE WITHOUT SAYING IT IS REPAIRED. Read its warrant
        sentence against both requirements and quote it.
        SECOND, NON-WIDENING. Enumerate EVERY difference between the redraft and the
        superseded draft, and classify each as: ordered by DEC-20260905-3b8e94;
        required by an ordered item; or NEW AND UNMANDATED. For every new-and-
        unmandated one, name the smaller repair. Specific traps: does it repair CF-14
        instead of disclosing it (widening); does it resolve RT-6, RT-9(a) or RT-12,
        which are RESERVED TO THE ENACTING DECISION and are not the redraft's to
        settle; does it change any of the ten source-derived anchor values or condition
        any clause on one (constraint (i), absolute); does it derive, recompute,
        tabulate or cite a crossover, a baseline-comparison sign, a margin or a
        speedup anywhere, including while arguing that the draft should have stated
        one; does it mark, annotate or otherwise touch the immutable BATCH-752ef2
        draft, which it may only supersede from its own side.
      breaking_artifact: >-
        An ordered item not carried, or carried behind a pointer where the order was
        to carry it into the text. A warrant sentence that quotes the refuted route,
        or that uses the repaired one without naming it as repaired. A change nobody
        ordered, with its smaller repair. A clause conditioned on an anchor value. A
        crossover, sign, margin or speedup anywhere in the package. A ruling reserved
        to the enacting decision made here instead. Any edit or annotation of a
        BATCH-752ef2 or BATCH-79a0cb artifact.
    - joint: J4 CF-9 and whether the run-provenance attestation claims exactly what its evidence supports
      assigned_to: TASK-20260906-ba0284
      attack_plan: >-
        CF-9 HAS BEEN HELD FOR TWO BATCHES AND IS FINALLY DISPATCHED, AND THE RISK
        OF A LONG-DEFERRED ITEM IS THAT IT COMES BACK OVERSTATED IN EITHER
        DIRECTION. Check the attestation in both directions and do not privilege
        either.
        OVERSTATEMENT: for every limb the record calls ATTESTED, find the artifact it
        rests on and confirm the claim is a CHECKSUM claim and not a narrative one.
        CF-17 is the standing rule and it binds this method: bind provenance to a
        checksum, never to value containment or to a plausible story. `dirty_tree:
        true` means the executed bytes NEED NOT equal any committed bytes - so
        "commit_at_run_time exists and is reachable" attests the commit, not the
        execution, and a record that slides from one to the other has overstated.
        Re-run at least one of its checks yourself.
        UNDERSTATEMENT: for every limb it calls UNATTESTABLE, ask whether a committed
        artifact would in fact settle it - the recorded `source_sha256_at_run`, the
        environment.json, the runtime-session receipt, the stdout, the first-add
        commit of each declared artifact. An item declared unattestable that a
        thirty-second check would have settled is a different failure and just as
        real.
        THE NULL OBJECT IS NOT OPTIONAL: confirm the producer ran its procedure
        against a manifest recording `dirty_tree: false` and that the procedure
        returned a DIFFERENT answer there. A procedure that returns UNATTESTABLE for
        everything carries no information, which is F-1's lesson in a different
        instrument.
        SCOPE DISCIPLINE: confirm the record does not present an infrastructure gap as
        a mathematical result, does not assert or imply anything about whether the
        runs' RESULTS are right, does not restate any PAPER_PAIRS value, delta,
        crossover, margin or sign copied out of raw-result.json, does not modify or
        annotate either immutable manifest, and does not claim that discharging CF-9
        lifts or narrows the citation prohibition - only a committed Coordinator
        decision can do that, and CF-9 is one ground among several.
      breaking_artifact: >-
        An ATTESTED limb resting on inference rather than on a checksum against
        recoverable bytes. An UNATTESTABLE limb a committed artifact settles. A
        missing or degenerate null object. Any edit to a run manifest. Any value
        copied out of a raw result. Any sentence treating unattestable provenance as
        evidence about the model, the contract or an isogeny problem. Any claim that
        the prohibition is affected.

  blindness:
    mutual: true
    lifted_for:
      - TASK-20260906-ba0284
    rationale: >-
      DELIBERATELY LIFTED, NOT DRIFTED. The reviewer is GIVEN, and must read, the
      committed reports of the two previous rounds -
      BATCH-752ef2/reviews/TASK-20260905-4098fd/validation_report.yaml and
