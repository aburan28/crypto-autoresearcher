        own construction (RT-3, CF-21). ASSUME NEITHER LESSON WAS LEARNED AND CHECK.
        IMPORT amendment_parse_control.py as a module into your own script, OUTSIDE
        the repository, and CALL IT on objects you construct, at minimum these:
        (a) THE UNAMENDED FROZEN FILE. This is the object I most want run. The
        unamended specification.yaml ALREADY has a 7-element metrics list whose item
        5 is a single-key mapping (BATCH-79a0cb OBS-3 records exactly that), so a
        control that asserts only SHAPE PASSES ON THE FILE IT EXISTS TO DETECT THE
        AMENDMENT OF. Run it. If it passes, the control's pass on the redraft is
        entailed by the file's pre-existing shape and carries no information about
        the amendment, and that is a material finding.
        (b) THE SUPERSEDED clause_1 TEXT. The control must FAIL, on the PARSE
