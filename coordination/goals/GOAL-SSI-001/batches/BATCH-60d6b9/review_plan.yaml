    - joint: J3 whether the redraft carries exactly what was ordered, and nothing else
      assigned_to: TASK-20260906-ba0284
      attack_plan: >-
        TWO DIRECTIONS, AND THE SECOND IS THE ONE PEOPLE FORGET.
        FIRST, COMPLETENESS. DEC-20260905-3b8e94 next_actions[0] and the
        GOAL-SSI-001 head route EXACTLY these to the redraft, and no others: RT-1's
