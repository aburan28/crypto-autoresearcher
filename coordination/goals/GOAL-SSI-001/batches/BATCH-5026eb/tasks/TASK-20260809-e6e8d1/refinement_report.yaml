  claim_ceiling: >-
    No observation, attack, security result, exponent change, novelty claim,
    hypothesis transition, goal completion, or v11 closure claim is made. This
    report records an additive contract repair and bounded static audits only.
  repairs:
    - id: R1
      issue: local_digest_and_subrecord_fiber
      repair: >-
        Defined local digest fields as allowed integrity fields rather than
        standalone objects, listed every local digest-bearing schema, and gave
        one raw-record preimage for endpoint, payload, event, operation,
        saturation, control, and replay records.
    - id: R2
      issue: null_and_shortened_frame_length
      repair: >-
        Fixed NULL-RECORD-v7 at payload_len=4090 and complete width=4096 with an
        explicit padding equation. Defined shortened T0/T1 terminal frames with
        their actual payload lengths and a non-circular stream/terminal order.
    - id: R3
      issue: source_bound_fixed_advice
      repair: >-
        Added registered SOURCE-BLOB-v7 and SOURCE-ALGORITHM-v7 frames carrying
        exact bytes, tree commit, canonical path, algorithm version, and a
        target-free transcript. A_p explicitly includes these objects and their
        charged reads; digest identifiers alone are invalid.
    - id: R4
      issue: missing_source_map_and_provider_preimages
      repair: >-
        Added exact DOMAIN-v7 preimages for curve tables, source objects, maps,
        artifact and mirror bytes, provider signatures, transition roots, and
        all special/local digests.
    - id: R5
      issue: finite_terminal_totalization
      repair: >-
        Added a serialized deterministic attempt-to-owner schedule, candidate
        cap, owner exhaustion, replay-failure predicate, strict terminal
        precedence, first-terminal position, and bounded count equations.
    - id: R6
      issue: typed_edge_semantics
      repair: >-
        Added registered EDGE-ALGORITHM-v7 with opcode operand widths, field
        relations, witness bytecode, transcript schema, and implementation plus
        independent replay gates. Provider work remains transport-only.
    - id: R7
      issue: cost_and_memory_observation_fibers
      repair: >-
        Expanded EVENT-v7 to include output, hash, signature, provider,
        serialization, and memory byte populations; added exact primitive charge
        equations and BUFFER-v7 advice/work classes with live-interval maxima.
    - id: R8
      issue: hnf_and_output_ambiguity
      repair: >-
        Replaced conflicting truncating Euclidean prose with positive-pivot,
        lowest-row/tie-broken, mathematical-floor quotient and nonnegative
        remainder pseudocode, with explicit overflow, empty, saturation, and
        witness conditions.
    - id: R9
      issue: paired_replay_identity
      repair: >-
        Fixed the shared prefix through the complete pair-request frame, a
        deterministic next-owner null mutation, serialized rejected draws,
        exact normalization and byte-equality identity predicate, and separate
        arm digests.
    - id: R10
      issue: controls_and_incumbent_scope
      repair: >-
        Made C-pair endpoint universe and synthetic initial state typed inputs,
        retained exact row/cell/table digest rules, and added a typed incumbent
        baseline with matched advice/preprocessing scope and guarded break_even_q.
  protected_history:
