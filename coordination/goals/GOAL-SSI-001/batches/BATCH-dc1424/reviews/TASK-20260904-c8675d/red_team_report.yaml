      cheapest_control: >-
        Have the archive task verify path_sha256 for
        experiments/EXP-WESOVOW-001/cost_model.py and
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md at commit a773ebc against
        the receipt, once the receipt is reachable.
    - id: OBJ-7
      severity: low
      title: "Weaknesses in my own procedure, stated so they are not left for someone else to find."
      statement: >-
        (a) Exact-equality comparison has no tolerance and cannot distinguish a
        rounding difference from a mis-transcription; it answers a character
        question, not a numerical one. (b) My slot regex depends on the exact
        Unicode glyphs "≥" and "≈" surviving the freeze; had they been
        re-encoded, extraction would have returned zero pairs - a fail-loud mode,
        and it did not fire (five pairs extracted), but the dependency is real.
