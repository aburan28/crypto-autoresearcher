red_team_report:
  id: RT-20260905-c8675d
  id_note: >-
    A report-local label derived from this task's token. It is NOT a minted
    ledger identifier; I am not permitted to write ledger records and did not
    run tools/allocate_id.py.
  task_id: TASK-20260904-c8675d
  claim_under_review: >-
    J5 only: that the five (log2 time, log2 memory) pairs literalized at
    experiments/EXP-WESOVOW-001/cost_model.py:61-65 are the pairs Section 4.1 of
    inputs/P13-WESOLOWSKI-2026/paper_fulltext.md states, in a form comparable to
    the cost model's declared units. I own no other joint and return no
    whole-claim verdict.
  verdict_on_J5: holds
  verdict_qualification: >-
    HOLDS ON DIGITS, UNITS, ORDER AND KEYING - all ten literals are exactly what
    the frozen paper prints, the tuple order is (time, memory) as used, and both
    units match the specification with no arithmetic derivation required. It
    holds ON THE FROZEN DOCUMENT ONLY, and it holds on TRANSCRIPTION only: it
    says nothing about whether the paper's numbers are correct, whether the cost
    model reproduces them, or what any divergence means. The one substantive gap
    I found is FORM, not value - see OBJ-2 - and it is a gap in what the code
    RECORDS about the numbers, not in which numbers it recorded.

  objections:
    - id: OBJ-1
      severity: high
      title: "The +6.0-bit unit error the UNIT OBJECT decoy models is a live, reachable code path in this very file."
      statement: >-
        The unit decoy is not hypothetical here. cost_model.py lines 309-313
        emit, into the same per_field record as `paper_pair`, a `memory_bytes`
        dict containing BOTH "log2M_entries" AND "log2bytes_64B_per_entry" =
        log2M + 6.0 and "log2bytes_256B_per_entry" = log2M + 8.0. Meanwhile
        `paper_pair.log2memory` (line 302) carries NO unit annotation, and the
        PAPER_PAIRS comment on line 60 carries none either - note that the very
        next parameter, MEMORY_BUDGETS on line 67, IS annotated "entries". So
        the one memory quantity in the file that is compared against the paper
        is the one memory quantity with no declared unit, and a differently-
        united sibling of it sits three keys away in the same serialized record.
        Any downstream consumer that reaches for `log2bytes_64B_per_entry`
        instead of `log2M_entries` reproduces decoy (iv) exactly, with a clean
        +6.0-bit error and no symptom.
      cheapest_control: >-
        In any consumer of raw-result.json, assert that the memory figure
        compared against `paper_pair.log2memory` is read from `log2M_entries`
        (or from `optimal.log2M`) and never from a `log2bytes_*` key. One
        assertion, no run. Independently: grep any reconciliation artifact for
        differences of exactly 6.0 or 8.0 bits in the memory column.
      what_i_did_not_check: >-
        Whether any existing downstream artifact actually made this error. The
        run directories and the reconciliation artifacts are blind_from and I
        did not read them. This objection is raised from the code alone.
    - id: OBJ-2
      severity: medium
      title: "The committed literals record the digits and discard the relation symbol."
      statement: >-
        All ten numbers are printed in the paper as "≥". cost_model.py records
        them as bare floats, compares by signed difference, and gates on a
        two-sided abs(dev) <= 0.75. Nothing in the file preserves that they are
        inequalities. For the file's own declared purpose - C1, an instrument
        sanity gate reproducing the paper's arithmetic - the two-sided test is
        correct and I say so plainly. The objection is that the SERIALIZED
        `paper_pair` values (line 302) escape the file carrying neither the
        relation nor the unit, into records whose readers must then re-derive
        both from a paper that is outside most read_scopes in this campaign.
        DEC-20260904-166ab5:178 states that the C1 tolerance "is exceeded at
        every field size", so the figures are in fact being read as signed
        anchors somewhere, which is precisely the reading the "≥" complicates.
      cheapest_control: >-
        Annotate line 60 with the relation and both units (comment-only), and
        add "relation": ">=" alongside log2time/log2memory in the `paper_pair`
        output dict so the qualification travels with the value. Both are
        changes to committed artifacts and are the Coordinator's to authorize; I
        made neither.
    - id: OBJ-3
      severity: high
      title: "A containment-style locator check cannot verify the time column at all, because the Delfs-Galbraith figures are printed on the same five lines."
      statement: >-
        See proves_too_much, decoy (iii). Lines 234-238 each contain TWO time
        figures: the new attack's and, in the same sentence, "previous methods:
        ≈ 2^128" etc. The five previous-methods values are exactly log2(p)/2 -
        the null object's entire time column. Therefore any verification of the
        form "the quoted text at the recorded line range contains the recorded
        paper_value" returns PRESENT for a claimed time column that is the
        Delfs-Galbraith baseline rather than the new attack. This is the exact
        shape of failure - wrong and self-consistent - that a blind
        re-transcription exists to catch, and it would be invisible to any
        amount of recomputation from the producer's own artifacts.
      cheapest_control: "As above: feed a containment check the vector (128, 192, 256, 288, 384) as a claimed time column and see whether it objects."
      status_here: >-
        My own procedure is not vulnerable, because P2 extracts by slot. I
        report the break of the containment variant because the containment
        formulation is what VC-0 literally specifies, and because I cannot see
        which formulation the producer used.
    - id: OBJ-4
      severity: high
      title: "Blind re-transcription from the SAME frozen artifact cannot detect an error introduced by the freeze. This is the load-bearing limit of my own result."
      statement: >-
        My independence is from the producer, not from the document. Both
        transcribers read one file whose provenance record
        (inputs/P13-WESOLOWSKI-2026/source_record.yaml) says: "Full text provided
        verbatim by the repository owner in conversation on 2026-07-24." There is
        no DOI, no arXiv/eprint identifier, no retrieval URL and no checksum
        against a published version anywhere in that record, and the same record
        already discloses that one referenced artifact was "not independently
        re-fetched". The freeze is demonstrably LOSSY relative to a published
        paper: Figures 1 and 2 exist only as caption text, there are zero image
        references in the markdown, and there are zero markdown tables in the
        entire document. If the original presented these costs in a TABLE - a
        very common presentation for exactly this content - the flattening into
        five prose bullets happened in an unverified conversion step, and a
        digit lost or transposed there is invisible to me, invisible to the
        producer, and invisible to any number of further blind
        re-transcriptions. Two independent readings of one possibly-corrupted
        source agree exactly as strongly as one.
      cheapest_control: >-
        Fetch the published version and diff ONLY the ten numbers on lines
        234-238. Ten characters of comparison against an external source
        collapses the entire remaining uncertainty in J5. Nothing else in this
        campaign can.
      what_i_did: "I did not attempt it: it is outside my read_scope and outside this task's mandate. Recorded as the next concrete action."
    - id: OBJ-5
      severity: medium
      title: "J5 holding eliminates exactly one of three worlds, and its most likely misuse is being read as though it eliminated all three."
      statement: >-
        The producer's card names three worlds for the committed divergence: a
        transcription defect, a defect or difference in the cost model, or a
        genuine external disagreement between the paper and this model. My
        result closes the FIRST and touches neither of the other two. The
        shortest over-reading path is one sentence long: "the paper's pairs were
        independently confirmed" → "the anchor comparison checks out" → a
        citation of a prohibited cell. I flag it because a clean 10/10 agreement
