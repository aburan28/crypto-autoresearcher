  units_question:
    does_the_paper_attach_a_unit_word_to_the_TIME_figures: true
    time_unit_evidence: >-
      Each of the five bullets prints the unit inline and adjacent:
      "≥ 2^106.5 F_{p^2}-operations". It is also stated in prose at line
      230: "its time cost is ≈ M/P0 F_{p^2}-operations".
    does_the_paper_attach_a_unit_word_to_the_MEMORY_figures: false
    memory_unit_evidence_absent: >-
      All five bullets print a bare "memory ≥ 2^X" with no unit word, no
      "entries", and no byte figure. The string "byte" does not occur anywhere
      in the 350-line document (verified by case-insensitive grep). The paper
      NEVER expresses memory in bytes.
    chain_that_establishes_the_memory_unit:
      hop_1:
        line: 226
        quoted_text: "The size of the tables constructed in Algorithm 2 is at least"
      hop_2:
        line: 228
        quoted_text: "M = Ψ(X, B)X."
      hop_3:
        line: 230
        quoted_text: "Now, let us be conservative and assume that constructing a table costs a single F_{p^2}-operation per entry, so a total of M F_{p^2}-operations per table. In doing so, we anticipate that Algorithm 1 is not optimal. Now, the memory cost of the algorithm is ≈ M, and its time cost is ≈ M/P0 F_{p^2}-operations, where P0 is the probability of success of one iteration of Algorithm 3."
      corroborating_hop:
        line: 169
        quoted_text: "3. L ← a table containing each entry ψ : E → E′ of L(E, X, B), keyed by the codomain E′ (let us write them as pairs (E′, ψ) ∈ L)."
        why: >-
          Fixes what "an entry" of the table is - one isogeny keyed by its
          codomain - which is exactly the specification's gloss of a table
          entry, so the chain terminates in a defined object rather than in a
          word.
      chain_conclusion: >-
        M is the SIZE of a table whose contents are entries, hence a COUNT OF
        TABLE ENTRIES; and the memory cost is ≈ M. So the memory figures in
        the bullets are in table entries. The paper performs every step of this
        chain itself, within Section 4.1, in two sentences.
    does_reading_the_chain_convert_any_number: false
    explicitly: >-
      READING THE CHAIN CONVERTS NO NUMBER. It identifies the unit and leaves
      all five memory digits exactly as printed. If a reader instead assumed the
      memory figures were bytes, or converted entries to bytes at 64 bytes per
      entry, every memory value would move by +6.0 bits and would no longer be
      what the paper printed. The paper supplies no bytes-per-entry constant, so
      there is nothing in the paper to license such a conversion.
    unit_match_against_the_specification:
      spec_unit_of_cost: "F_{p^2}-operations (paper's conservative convention: 1 op per table entry)"
      spec_unit_of_memory: "table entries (an entry stores one isogeny/curve record); byte conversions use 64 and 256 bytes/entry as scenario parameters"
      time_verdict: >-
        The specification's unit_of_cost is the paper's own printed unit word,
        including the parenthetical convention, which is line 230 verbatim in
        substance. Match.
      memory_verdict: >-
        The specification's unit_of_memory is what the paper's chain
        establishes. The specification's 64 and 256 bytes/entry are declared as
        SCENARIO PARAMETERS applied on top, not as the unit of the five
        Section 4.1 memory figures, so the specification does not itself
        introduce the conversion the paper cannot license. Match.

  per_value_comparability_judgement:
    categories_used:
      direct: >-
        The paper prints the value with its unit word adjacent, and that unit is
        the cost model's declared unit. No derivation, no conversion.
      direct_after_in_section_unit_chain: >-
        The paper prints the value with NO unit word, but establishes the unit
        itself, in the same section, in prose the paper writes. The chain is a
        unit identification, not an arithmetic derivation: no digit changes.
        This is weaker than `direct` in exactly one respect - the value read in
        isolation is unitless - and it is NOT `undetermined`.
      requires_derivation: >-
        Making the value comparable would require an arithmetic step the paper
        does not itself perform.
      undetermined: >-
        The paper does not state the quantity in a form that can be made
        comparable at all.
    judgements:
      - log2p: 256
        time: direct
        memory: direct_after_in_section_unit_chain
      - log2p: 384
        time: direct
        memory: direct_after_in_section_unit_chain
      - log2p: 512
        time: direct
        memory: direct_after_in_section_unit_chain
      - log2p: 576
        time: direct
        memory: direct_after_in_section_unit_chain
      - log2p: 768
        time: direct
        memory: direct_after_in_section_unit_chain
    summary: >-
      Ten of ten values are comparable in MAGNITUDE and UNIT to the cost model's
      declared units with no arithmetic derivation. Zero are `requires_derivation`
      and zero are `undetermined` on the units question.
    the_separate_thing_that_is_NOT_direct: >-
      Units are not the only axis of comparability, and on the second axis the
      answer is different. All ten numbers are printed as INEQUALITIES ("≥"),
      not as point estimates. A cost model that consumes them as point values is
      making a comparison the paper's grammar does not license, and that gap is
      a form question, not a units question. It is recorded in full under
      `qualification_observation` and is deliberately NOT folded into the
      per-value units judgement above, because folding it in would hide which of
      the two axes actually fails.

  phase_a_prediction_recorded_before_phase_b:
    what_i_expect_to_find: >-
      Recorded so that Phase B cannot be quietly reinterpreted. I expect the
      committed literals to carry these same ten digits, because they are
      unambiguous on the page and occur in exactly one place. I expect the open
      question to be FORM, not digits: whether an implementation that treats a
      printed lower bound as an anchor point is doing what the paper permits.
