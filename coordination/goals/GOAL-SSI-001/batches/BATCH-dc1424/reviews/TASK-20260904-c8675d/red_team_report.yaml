# ============================================================================
# QUALIFICATION OBSERVATION - recorded as its own finding, separate from the
# comparison above, per the assignment.
# ============================================================================
qualification_observation:
  how_the_paper_qualifies_these_quantities:
    grammatical_form_of_each_of_the_ten_numbers: >-
      EVERY ONE OF THE TEN IS AN INEQUALITY, NOT AN EQUALITY OR A POINT
      ESTIMATE. The paper writes "≥ 2^106.5 F_{p^2}-operations and memory ≥
      2^92.5". The relation symbol is "≥" in all ten cases, in all five bullets,
      for both columns. Not one of the ten is written as "=", as "≈", or as a
      bare figure. By contrast the paper DOES use "≈" for the previous-methods
      column in the same sentences ("previous methods: ≈ 2^128"), so the choice
      of "≥" over "≈" for the new figures is a deliberate distinction the author
      makes inside a single line, not a stylistic accident.
    the_field_size_is_also_hedged: >-
      Each bullet opens "For log2(p) ≈ 256", with "≈" on the field size. The
      arithmetic behind the bullets nonetheless uses the ROUND value exactly:
      the previous-methods column is 128/192/256/288/384, which is exactly
      log2(p)/2 for log2 p = 256/384/512/576/768. So the "≈" hedges which prime,
      not which number was fed to the formula. Section 4.2 of the same paper
      runs its experiments on p = 5·2^248−1 and p = 27·2^500−1, which are
      different objects from the round log2 p the bullets evaluate. Recorded as
      a documentary observation about what the paper's own text does; I MAKE NO
      CLAIM ABOUT ANY PARAMETER SET, ANY SCHEME, OR ANY SECURITY LEVEL, IN
      EITHER DIRECTION.
  surrounding_text_bearing_on_how_they_should_be_read:
    - locator: "paper_fulltext.md:224 (the section heading itself)"
      quoted_text: "### 4.1. Rough estimation of the concrete cost"
      bearing: "The section is titled a ROUGH ESTIMATION. The qualification is in the heading, before any number."
    - locator: "paper_fulltext.md:226"
      quoted_text: "Let us estimate a lower bound on the concrete cost of the algorithm (under the assumption that the bound on the success probability derived in Lemma 3.5 is tight)."
      bearing: >-
        Declares the whole computation to be a LOWER BOUND, and declares it
        CONDITIONAL on Lemma 3.5's bound being tight - a condition the paper
        does not claim holds and later says it does not expect to hold.
    - locator: "paper_fulltext.md:230"
      quoted_text: "Now, let us be conservative and assume that constructing a table costs a single F_{p^2}-operation per entry, so a total of M F_{p^2}-operations per table. In doing so, we anticipate that Algorithm 1 is not optimal."
      bearing: >-
        The unit convention is explicitly an under-costing chosen for
        conservatism, not a measured per-entry cost.
    - locator: "paper_fulltext.md:232"
      quoted_text: "With these estimates, and optimizing B for best time, we obtain the following costs:"
      bearing: >-
        B is optimized FOR TIME. Memory is whatever falls out at the
        time-optimal B; it is not itself minimized and is not a separate
        optimum. This matches the specification's optimizer objective
        (minimize log2(T_full)).
    - locator: "paper_fulltext.md:240"
      quoted_text: "We emphasize again that these numbers are obtained via a rough underestimation of the size of the table and the cost of its generation. On the other hand, we are assuming here that the bound of Lemma 3.5 is tight: the above numbers may be overestimating the factor 1/P0 (see Remark 1)."
      bearing: >-
        THIS IS THE MOST IMPORTANT SENTENCE FOR HOW THE TEN NUMBERS SHOULD BE
        READ, AND IT IS TWO-SIDED. The paper says the numbers UNDERestimate one
        factor (table size and generation cost) and may OVERestimate another
        (1/P0). The paper therefore does NOT assert a net direction of error.
        The "≥" is a lower bound WITHIN the stated model, not a claim that the
        real cost is at least this much.
    - locator: "paper_fulltext.md:191 (Remark 1, forward-referenced by line 240)"
      quoted_text: "**Remark 1.** Lemma 3.5 is a simple lower bound on the probability, and is not expected to be optimal. Indeed, it considers the single smallest isogeny E → E^{(p)}, and estimates its smoothness probability; but there are generally multiple small (non-cyclic) isogenies E → E^{(p)}, and it is sufficient for any one of them to be smooth."
      bearing: >-
        The paper expects P0 to be LARGER than Lemma 3.5's bound, hence 1/P0
        smaller, hence the ten TIME figures to be too large by an unquantified
        factor. The memory column is not affected by this, since M does not
        involve P0.
    - locator: "paper_fulltext.md:43 (Section 1.1, outside Section 4.1)"
      quoted_text: "We compute tentative bounds on the concrete cost of the algorithm in Section 4.1. Note that these estimates make optimistic assumptions on the actual cost of certain steps, hence should not be interpreted as accurate predictions."
      bearing: >-
        The introduction pre-emptively forbids reading these as predictions.
        The word is "tentative", and the instruction "should not be interpreted
        as accurate predictions" is explicit.
  how_cost_model_py_consumes_them:
    consumption_sites:
      - "line 60 comment: '# paper Sec. 4.1 (log2 time, log2 memory)' - records the section and the tuple order"
      - "lines 256-258: pt, pm = PAPER_PAIRS[b2p]; dev_t = opt['log2T'] - pt; dev_m = opt['log2M'] - pm"
      - "lines 303-305: 'deviation_bits': {'time': dev_t, 'memory': dev_m, 'within_tolerance_0.75bit': abs(dev_t) <= 0.75 and abs(dev_m) <= 0.75}"
      - "line 302: 'paper_pair': {'log2time': pt, 'log2memory': pm} - the raw values are re-emitted into the per-field output record"
      - "lines 344-345: printed as columns papT / dT / papM / dM in stdout"
      - "PAPER_PAIRS is used nowhere else in the file"
    does_the_consumption_match_the_form: >-
      NO, NOT IN THE GENERAL CASE, AND I WILL NOT SOFTEN IT IN EITHER
      DIRECTION. The paper prints "≥ x". The code consumes it as "= x", takes a
      SIGNED difference, and then applies a TWO-SIDED absolute-value test
      abs(dev) <= 0.75. Nothing anywhere in cost_model.py records that the ten
      numbers are inequalities: the comment on line 60 preserves the section and
      the tuple order but drops the relation symbol, and there is no
      one-sided branch anywhere. A reader of the code alone cannot recover that
      the paper wrote "≥".
    the_counterweight_stated_just_as_plainly: >-
      For the use the code actually makes of them, the two-sided test is the
      RIGHT test, and saying otherwise would be the opposite error. The
      specification declares this consumption as control C1-sanity-paper-pairs,
      "an INSTRUMENT SANITY GATE" and "a model-reproduction check, not an
      implementation check" (specification.yaml:47-52, 134-141). As a
      reproduction check the target is the paper's ARITHMETIC - the value of
      M and M/P0 at the time-optimal B - and a reimplementation that lands
      above the paper's figure is just as suspect as one that lands below, so
      the two-sided band is correct for that purpose. The paper's "≥" attaches
      to the interpretation of that arithmetic as an attack cost, not to the
      arithmetic itself.
    where_the_mismatch_stops_being_latent_and_becomes_real: >-
      The moment `paper_pair` is read as "the paper's cost" in a SIGNED margin
      or anchor comparison rather than as a reproduction target. Line 302
      re-emits both raw values into the per-field output record, where they sit
      next to the model's own optimum and next to a memory figure in a
      DIFFERENT UNIT (see OBJ-1), with no unit or relation annotation
      travelling with them. At that point a downstream reader must supply the
      "≥" from the paper, and there is nothing in the serialized record to tell
      them it exists. I have not read any downstream artifact - the run
      directories and the reconciliation artifacts are blind_from - so I flag
      this as a hazard visible in the code, and assert nothing about whether any
      downstream artifact actually fell into it.
    one_line_fix: >-
      Change the line 60 comment to record the relation and both units, e.g.
      "# paper Sec. 4.1 lines 234-238: LOWER BOUNDS, (log2 time in
      F_{p^2}-ops, log2 memory in TABLE ENTRIES)". This is a comment-only
      change to a committed experiment input and is therefore a supersede-not-
      overwrite question for the Coordinator, not something I may do; I did not
      modify the file.

# ============================================================================
# PROVES-TOO-MUCH CONTROL (assigned to this task) - run against MY OWN
# transcription and comparison procedure, on all four declared objects.
# ============================================================================
proves_too_much:
  what_was_tested: >-
    My own procedure, not the producer's. I have never seen the producer's
    procedure or its output.
  procedure_used:
    P1: "For each of the five field sizes, find the Section 4.1 bullet whose stated field size is that value."
    P2: >-
      SLOT-BASED extraction, not substring containment: within that bullet,
      match the pattern "≥ 2^<T> F_{p^2}-operations and memory ≥ 2^<M>" and take
      T and M from those two positions. This deliberately refuses to accept a
      number merely because it appears somewhere on the line.
    P3: "Time unit gate: the token F_{p^2}-operations must be adjacent to the time value, and must match specification.yaml model_definition.unit_of_cost."
    P4: >-
      Memory unit gate: the bullets carry no unit word, so require the paper's
      own in-section chain (line 226 'The size of the tables ... is at least' /
      line 228 'M = Ψ(X, B)X.' / line 230 'the memory cost of the algorithm is ≈
      M') to be present verbatim, which fixes the unit as TABLE ENTRIES. Then
      refuse any candidate whose memory column is a uniform bytes-per-entry
      rescaling (+6.0 or +8.0 bits) of the paper's, since the paper supplies no
      bytes-per-entry constant.
    P5: "Compare by exact Decimal equality on the literal strings. No tolerance."
    P6: "Both components of a pair must come from the SAME bullet."
    P7: "Structural checks on the candidate: time > memory at every size (since T = M/P0, P0 ≤ 1), and both columns strictly increasing in log2 p."
    P8: "Per-value outcome in {agree, disagree, incomparable}; set verdict literals_faithful only if all ten agree AND both unit gates pass."
  results:
    - object: "POSITIVE CONTROL (identity): my own Phase A transcription fed back in"
      procedure_returned: literals_faithful
      per_value: "10/10 agree"
      is_this_a_break: false
      why_it_matters: >-
        THE PROCEDURE ACCEPTS SOMETHING. A procedure that rejected every input
        would have rejected the four decoys for no reason and its rejections
        would carry no information. This control was run explicitly because the
        task card requires it.
    - object: "REAL OBJECT: the committed literals at cost_model.py:61-65"
      procedure_returned: literals_faithful
      per_value: "10/10 agree"
      is_this_a_break: false
    - object: "DECOY (i) SHIFT: all ten committed numbers +0.30 bits"
      procedure_returned: mis_transcribed
      per_value: "10/10 disagree"
      is_this_a_break: false
      note: "Correctly rejected. No self-contradiction: the procedure did not return faithful for both the committed set and its shift."
    - object: "DECOY (ii) CYCLIC PERMUTATION across field sizes"
      procedure_returned: mis_transcribed
      per_value: "10/10 disagree"
      additional_signal: "P7 also fired: 'not strictly increasing in log2 p'."
      is_this_a_break: false
      note: "Correctly rejected, and rejected twice over - by value and by structure."
    - object: "DECOY (iii) NULL OBJECT: (log2 p / 2, 0.0) at every field size"
      procedure_returned: mis_transcribed
      per_value: "10/10 disagree"
      is_this_a_break_of_my_procedure: false
      A_BREAK_OF_A_DIFFERENT_AND_ENTIRELY_PLAUSIBLE_PROCEDURE: >-
        YES, AND THIS IS THE MOST IMPORTANT RESULT IN THIS BLOCK. I additionally
        ran a containment-only variant - "the quoted line at the recorded
        locator contains the value attributed to it", which is VC-0 as literally
        worded on the producer's card - against the same decoys. On the NULL
        OBJECT it returns PRESENT for ALL FIVE TIME VALUES. The reason is in the
        paper: 128, 192, 256, 288 and 384 are printed on lines 234-238
        themselves, as the "previous methods" column ("previous methods: ≈ 2^128
        F_{p^2}-operations and negligible memory"). So a locator check that
        verifies containment rather than SLOT POSITION cannot distinguish the
        paper's new-attack time figures from the Delfs-Galbraith baseline
        figures printed in the same sentence. The null object's memory column
        (2^0) is still rejected by containment, so the SET verdict survives -
        but it survives on the memory column alone, and the time column, which
        is the column the campaign's baseline comparison turns on, is not
        checked at all by a containment-style test.
      where_in_the_argument_the_survival_happens: >-
        At P2. Every step after extraction is sound; the failure is entirely in
        how the number is taken off the line. Any procedure that verifies "value
        V appears in line N" rather than "value V appears in the new-attack time
        slot of line N" inherits this break.
      cheapest_control_that_detects_it: >-
        Feed the containment check the vector (128, 192, 256, 288, 384) as a
        claimed time column. If it returns PRESENT, the check is a containment
        check and its agreement on the time column is uninformative. This costs
        one line and needs no run.
    - object: "DECOY (iv) UNIT OBJECT: committed memory +6.0 bits (same quantity per 64-byte entry)"
      procedure_returned: mis_transcribed
      per_value: "time 5/5 agree; memory 5/5 flagged unit_mismatch"
      is_this_a_break: false
      note: >-
        Rejected, AND rejected for the right reason. P4 identified the memory
        column as a uniform +6.0-bit rescaling, named it as a per-64-byte-entry
        expression of the same quantity, and refused the conversion on the
        ground that the paper supplies no bytes-per-entry constant (the string
        "byte" does not occur anywhere in the 350-line document). The procedure
        did NOT return faithful by silently accepting a unit conversion, which
        is the specific defect this object exists to detect.
  self_contradiction_check: >-
    NONE OCCURRED. The procedure returned literals_faithful for exactly two
    inputs - the paper's own values and the committed literals, which are the
    same ten numbers - and mis_transcribed for all four decoys. It did not
    return faithful for both a set and its shift, nor for both a set and its
    permutation, so no contradiction was produced and the verdict on the real
    literals is not voided by this control.
  resolution_probe:
    what_was_measured: "Smallest uniform perturbation of the TIME column at which the procedure still returns mis_transcribed."
    result: "0.01 bits (the smallest probed). The procedure uses exact Decimal equality, so its resolution is unbounded: any nonzero difference is detected."
    against_the_0_2_bit_floor: "Passes with margin at every value. The procedure is not blind at the scale this campaign operates at."
    THE_COST_OF_THAT_RESOLUTION_STATED_HONESTLY: >-
      Infinite resolution is not free. My procedure would flag 106.500001 as
      mis_transcribed even though it is the paper's number to the paper's own
      printed precision. It answers "are these the same characters the paper
      printed", which is the right question for a transcription check and the
      WRONG question for a numerical-agreement check. It also cannot detect an
      error in the paper, and it cannot detect an error introduced by the
      freeze - see limitations.

