  how_section_4_1_was_located:
    method: >-
      Grepped the 350-line frozen paper for markdown headings, without being
      told where Section 4.1 is. The heading index returned "## 4. Experimental
      results" at line 222 and "### 4.1. Rough estimation of the concrete cost"
      at line 224, with the next heading "### 4.2. Supporting the heuristic
      assumption" at line 242. Section 4.1 is therefore lines 224-241 inclusive.
    section_bounds: "inputs/P13-WESOLOWSKI-2026/paper_fulltext.md lines 224-241"
    searches_performed:
      - "grep -n '^#' over the paper to build a heading index (no hint used)"
      - "read lines 218-260 verbatim to see Section 4.1 whole plus its neighbours"
      - "grep -n for each of the ten transcribed decimal strings over the WHOLE paper, to count restatements"
      - "grep -n -i for 'byte|entry|entries|memory' over the WHOLE paper, to find every unit-bearing sentence"
      - "grep -n for 'Remark 1' and read it, because line 240 forward-references it as bearing on these numbers"

  distinct_places_stating_these_quantities:
    count_in_section_4_1: 1
    what_that_one_place_is: >-
      A single contiguous bulleted list at lines 234-238, one bullet per field
      size, five bullets. There is no table, no repetition, and no second
      statement of any of the ten values anywhere in Section 4.1.
    count_in_whole_document: 1
    evidence_for_the_count: >-
      Each of the ten decimal strings 106.5, 92.5, 157.5, 138.6, 204.2, 181.3,
      230.9, 206.0, 302.4, 272.2 was grepped across all 350 lines of
      paper_fulltext.md. Every one returns EXACTLY ONE matching line, and that
      line is its own bullet in 234-238. No value is restated in the abstract,
      the introduction, Section 1.1, Section 3, Section 4.2, or the references.
    near_reference_that_is_not_a_statement: >-
      Line 43 ("We compute tentative bounds on the concrete cost of the
      algorithm in Section 4.1. Note that these estimates make optimistic
      assumptions on the actual cost of certain steps, hence should not be
      interpreted as accurate predictions.") refers to these quantities and
      qualifies them, but states no value. It is counted as a reference, not as
      a place stating the quantities.
    why_the_count_matters: >-
      A count of 1 means there is no internal cross-check available inside the
      paper. Nothing in the document can catch a typo in line 234-238, and a
      transcriber has exactly one shot at each digit. It also means the values
      cannot be recovered from the paper by any route other than reading those
      five lines.

  transcription:
    convention: >-
      Reported as (log2 time, log2 memory), i.e. the base-2 EXPONENT the paper
      writes, for the five field sizes log2 p in {256, 384, 512, 576, 768}
      declared in experiments/EXP-WESOVOW-001/specification.yaml
      scenario_definitions.field_sizes_log2p. The paper writes the quantities as
      powers of two ("2^106.5"), so the exponent is read directly off the page
      and no logarithm is computed by me.
