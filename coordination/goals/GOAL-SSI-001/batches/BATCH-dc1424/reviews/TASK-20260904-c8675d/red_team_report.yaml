        state the narrowest form: the literals are faithful to the frozen
        document; the divergence therefore does not come from the transcription;
        which of the remaining two worlds it comes from is untouched by this
        task.
      cheapest_control: "Require any sentence citing J5 to name what J5 did not test, in the same sentence."
    - id: OBJ-6
      severity: low
      title: "One declared input does not exist at the commit I was given, and I could not read it."
      statement: >-
        My read_scope and the handoff's inputs list
        coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/archives/TASK-20260904-977d04/snapshot_commit_receipt.json.
