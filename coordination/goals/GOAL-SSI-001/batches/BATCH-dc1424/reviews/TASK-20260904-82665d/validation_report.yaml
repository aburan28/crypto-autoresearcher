    - joint: J2 verdict composition and the undetermined discipline
      verdict: CONFIRMED WITH CAVEAT
      preregistration_vs_task_card: >-
        I diffed the pre-registration against the task card's own text. The
        `TOLERANCE, PRE-REGISTERED` constraint and the `DIRECTLY COMPARABLE,
        PRE-REGISTERED` constraint are reproduced WORD FOR WORD in
        preregistration.tolerance and preregistration.directly_comparable_test,
        split into keys but with no wording changed, nothing dropped and
        nothing added. The extra `absent` clause traces to the card's separate
        `A LOCATOR FOR EVERY VALUE, INCLUDING EVERY ABSENT ONE` constraint and
        is consistent with it. One component does not trace - see finding F-7.
      composition_recomputed_independently: >-
        I recomputed the ten per-value verdicts from scratch, using the values I
        transcribed myself off lines 234-238 rather than the producer's
        paper_value fields, and the literals I read myself at cost_model.py
        lines 61-65. Signed difference paper minus literal is exactly 0.0 at all
        ten (Python `paper - literal` printed with repr, giving `0.0` in every
        case, not a rounded display). Applying the rule by hand -
        `any mis_transcribed` is False, `all faithful` is True - clause (2)
        fires and the composed verdict is `literals_faithful`. I then called the
        producer's own `compose()` on the same ten verdicts and it also returns
        `literals_faithful`. Hand and code agree, and both agree with the
        package.
      tolerance_actually_applied: >-
        tolerance_applied is 0.05 at all ten entries, equal to the pre-registered
        default. tolerance_widened_reason is null at all ten,
        precision_limited is false at all ten, and
        tolerance_widenings_applied is 0. No widening was chosen at any point,
        so no widening could have been chosen after a value was seen. The
        paper states every value to one decimal place, the same precision the
        literals carry, so half a unit in the paper's last stated place equals
        0.05 and the coarser-precision rule never engages.
      over_claiming_check_derivation_used_as_a_verdict: >-
        derived_comparison is null at all ten entries and
        derived_comparisons_performed is 0. No derivation was performed, so no
        derivation could have been used as a verdict. I separately checked that
        no value was obtained by evaluating a formula, converting a unit, or
        reading a rounded figure at a precision the paper does not carry: the
        paper prints each of the ten as a literal decimal exponent and the
        package copies it.
      under_claiming_check: >-
        Vacuously clean. There are zero `undetermined` per-value verdicts, so
        no `undetermined` was used to avoid recording a mismatch. And there is
        no mismatch to mask: I re-derived all ten differences as exactly 0.0.
      the_memory_form_question_which_could_flip_the_verdict:
        the_question: >-
          Section 4.1's bullets attach the unit word `F_{p^2}-operations` to
          the time figures and NO unit word to the memory figures. The producer
          judged the five memory values `direct` on the ground that the section
          fixes the unit without converting any number. If that chain is
          instead a derivation, all five memory values become
          `requires_derivation`, hence `undetermined`, and the composed verdict
          becomes `undetermined`.
        i_decided_it_on_the_paper_text_and_i_land_on_direct: >-
          I AGREE WITH THE PRODUCER. `direct`, and therefore `literals_faithful`.
        my_reasoning_from_the_paper_alone:
          - >-
            The pre-registered `requires_derivation` test enumerates exactly
            three triggers - memory stated in bytes, in a different entry
            convention, or as a formula the reader must evaluate. I checked all
            three against the document. Bytes - the tokens `byte`, `bytes`,
            `word` and `cell` occur ZERO times in the whole 350-line document;
            the single `bits` is at line 51 and means bits of security, not
            memory. Different entry convention - line 185 calls the elements of
            the table L `entries`, Definition 3.1 (line 131) makes L a set of
            isogenies, and specification.yaml's unit_of_memory is `table
            entries (an entry stores one isogeny/curve record)`; same object.
            Formula to evaluate - the paper PRINTS `2^92.5`; no arithmetic is
            needed to obtain it. None of the three triggers fires.
          - >-
            The `direct` test asks whether the section states the value as a
            number in the same quantity and unit the literal carries. It does.
            Line 230, inside Section 4.1, says `the memory cost of the
            algorithm is ~ M`; line 226 says `The size of the tables
            constructed in Algorithm 2 is at least` and line 228 gives `M =
            Psi(X, B)X`; and line 230 charges `a single F_{p^2}-operation per
            entry, so a total of M F_{p^2}-operations per table`, which fixes M
            as a COUNT OF ENTRIES. That last sentence is the decisive one and
            it is in the same section.
          - >-
            The distinction the pre-registration actually draws is between
            IDENTIFYING a unit and CONVERTING a number. Reading three sentences
            of the same section to learn what an unlabelled number counts is
            reading. Multiplying, dividing or re-expressing that number would
            be deriving, and nothing of the kind occurs. If the paper had given
            only `M = Psi(X,B)X` and no printed number, the value would be
            `requires_derivation`; it gives the number.
        was_the_correction_for_the_pull_itself_an_overcorrection: >-
          NO, in effect - but the producer's own statement of its reasons is
          ordered wrongly, and that is worth saying. PHP-2 gives two reasons for
          not moving to `undetermined` and labels the SECOND one - that
          `undetermined` is the outcome the batch calls most informative and is
          therefore a reason to distrust the pull - as `decisively` binding. A
          meta-reason about one's own incentives can license extra scrutiny; it
          cannot decide a question of what a document says, and a verdict
          resting on it WOULD be an overcorrection symmetric with the
          overclaim it guards against. The producer's FIRST reason - the chain
          converts no number - is the one that actually decides it, is correct,
          and is sufficient on its own. So the outcome is right and the frozen
          test compels it; only the adverb is misplaced. Recorded as reasoning
          hygiene, not as a defect in the verdict.
      the_lower_bound_observation_and_whether_excluding_it_was_correct:
        the_observation: >-
          Confirmed independently and at full strength. Every bullet at lines
          234-238 reads `>= 2^x F_{p^2}-operations and memory >= 2^y`. Line 226
          opens `Let us estimate a lower bound on the concrete cost`; line 230
          says `let us be conservative`; line 240 says `these numbers are
          obtained via a rough underestimation of the size of the table and the
          cost of its generation`; line 43 calls them `tentative bounds ...
          optimistic assumptions ... should not be interpreted as accurate
          predictions`. The paper deliberately CONTRASTS this with the `~` it
          uses for the previous-methods figures in the same sentence. Against
          that, cost_model.py consumes PAPER_PAIRS through a two-sided test - I
          read it at lines 303-305, `bool(abs(dev_t) <= SANITY_TOLERANCE_BITS
          and abs(dev_m) <= SANITY_TOLERANCE_BITS)` with SANITY_TOLERANCE_BITS
          = 0.75 at line 72.
        was_excluding_it_from_the_verdict_correct: >-
          YES. The frozen per-value rule assigns a verdict from comparison_form
          and |paper - literal| only. comparison_form is defined by QUANTITY
          AND UNIT, and its three `requires_derivation` triggers do not include
          `stated as an inequality`. The `qualitative` escape hatch is scoped by
          its own examples to hedge words - `about 2^106`, `roughly` - and `>=`
          is not a hedge but an exact relation which the paper uses in
          deliberate contrast to `~`. So under the rule as frozen the ten
          values are `faithful`, and folding the bound-versus-point-value
          mismatch into the verdict would have required revising the
          pre-registration after seeing the paper - which the task card forbids
          outright and routes to a versioned protocol_amendment outside this
          task's authority. The producer recorded it in three places with
          locators (NS-2, PHP-1, and the per-entry `note` of all ten locator
          entries) and left the verdict alone. That is the correct handling and
          I would have done the same.
        but_see_F_10_and_the_J4_licensing_finding: >-
          Excluding it was correct; leaving the control plane's gloss on
          `literals_faithful` unqualified is where the residual risk sits. See
          finding F-12 under J4.
      concrete_objection: >-
        FINDINGS F-7 and F-8. The composition rule was authored rather than
        copied while `source_of_this_block` says `Copied`, and the
        `preregistration_frozen_hash` does not reproduce under any plausible
        serialization, so the pre-registration's central integrity claim rests
        on attestation rather than on a check. Neither changes the verdict.

