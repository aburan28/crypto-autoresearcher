    - joint: J1 locator fidelity of the paper-side transcription
      verdict: CONFIRMED WITH CAVEAT
      what_i_did: >-
        I did not accept a single producer quotation. I opened
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md myself and printed lines
        222-242 with `awk 'NR>=222 && NR<=242 {printf "%d|%s\n", NR, $0}'`,
        establishing the section boundary independently - heading `### 4.1.
        Rough estimation of the concrete cost` at line 224, body 226-240, next
        heading `### 4.2. Supporting the heuristic assumption` at line 242, the
        five bullets at 234-238, one per field size. I then read the section in
        full, all 17 lines 224-240, and also read lines 27-64 (the whole of
        Sections 1.1-1.4) so a rounder second statement in the introduction
        would be findable.
      per_entry_check: >-
        For all ten entries I re-read the recorded line range out of the file
        and compared it to the recorded quoted_text with an exact string
        equality, then checked the `2^<value>` token is inside that quotation.
        All ten quoted_text values are BYTE-IDENTICAL to the text at their
        recorded lines and all ten contain their attributed token. I then
        checked attribution by hand, which no code in the package does: in each
        bullet the first 2^x is followed by `F_{p^2}-operations` (time), the
        second is preceded by `memory >=` (memory), and the third is inside
        `(previous methods: ...)`. cost_model.py:60 documents PAPER_PAIRS as
        `(log2 time, log2 memory)`. No time/memory swap and no field-size
        misfiling exists at any of the ten.
      second_statement_search:
        outcome: >-
          NONE FOUND. Reported either way as the plan requires.
        how_i_searched_independently_of_the_producer:
          - >-
            Per-value exact occurrence count over the WHOLE 350-line file with
            `grep -o -F "<v>" ... | wc -l` for each of the ten values, which
            counts occurrences rather than lines. Every one of the ten returns
            exactly 1.
          - >-
            `grep -n -o "2\^[0-9.]*"` over the whole file: 22 tokens. 15 are on
            lines 234-238 (the ten under test plus five `previous methods`
            Delfs-Galbraith figures). The other 7 are 2^256 at line 51 (the
            CGL prime-size remark in Section 1.3) and the prime specifications
            2^248 / 2^500 at lines 248, 250, 252, 254, 256 in Section 4.2 and
            its figure captions. None is a second statement of any value under
            test.
          - >-
            `grep -nE "[0-9]+\.[0-9]+"` over the whole file with lines 234-238
            excluded, to catch a decimal restatement in any other notation.
            Every hit is a theorem/lemma/definition number, a reference number,
            a DOI, or a page range.
          - >-
            Structural sweep with `grep -nE "^#|^\*\*Figure|^\*\*Table|Table
            [0-9]"`. The document contains no table anywhere and no figure
            inside Section 4.1; Figures 1 and 2 are in Section 4.2 and are
            smoothness-CDF captions carrying no cost figure.
        conclusion: >-
          The producer's `exhaustive_search_for_second_statements` finding
