        rule ... is PRE-REGISTERED on the producer's task card"). The producer
        therefore constructed the precedence ordering itself.
      why_it_matters: >-
        The hole is in the control plane, not in the producer's conduct, and
        the ordering the producer chose is a faithful reading of batch.yaml's
        three definitions and is the conservative one for the mixed case. It is
        immaterial here - 10 faithful / 0 / 0 composes to `literals_faithful`
        under any sane rule - but it WOULD have mattered under the NS-3 flip,
        where the mixed 5-and-5 case is decided by a rule nobody pre-registered
        in the control plane. The word "Copied" over-describes one of the four
        components.
      changes_a_verdict: false
    - id: F-8
      joint: J2
      severity: low
      title: preregistration_frozen_hash is not independently checkable
      detail: >-
        The artifact records sha256
        a8e0678c66a154a198c7deb540d4e4e8f27a18f1797b23f75434fb8046513225 and a
        UTC timestamp for the pre-registration block, but records no
        serialization convention. I tried five plausible ones - yaml.safe_dump
        with sort_keys True and False, yaml.dump default_flow_style False,
        json.dumps sort_keys, json.dumps indent=2 sort_keys - and none
        reproduces it. So the package's central integrity claim, that the
        pre-registration was written before Section 4.1 was opened, rests on
        attestation rather than on a check a reviewer can run.
      mitigating_and_material: >-
        Two things push the other way and I record them at equal strength.
        First, the two testable components of the pre-registration match the
        task card WORD FOR WORD; a block revised after seeing the paper would
        more likely have drifted. Second, the separately recorded
        RC-1-before-RC-2 ordering attestation IS checkable and it HOLDS - the
        two sha256 values recorded inside anchor_reachability.yaml equal the
        sha256 of the delivered RC-1 artifacts, and anchor_reachability.yaml is
        itself hash-bound by the snapshot. I have no evidence of any revision
        and I allege none.
      changes_a_verdict: false
    - id: F-9
      joint: J4
      severity: high
      scope_note: >-
        THIS IS NOT A DEFECT IN THE PRODUCER'S SIX ARTIFACTS. It is in the
        archive chain that binds them, i.e. TASK-20260904-977d04's work
        product, and it is reported here because J4 owns what is bound to and
        quotable from this package. Route it accordingly.
      title: >-
        A reverted-but-reachable commit message leaks all ten values and
        characterizes the reviewed verdict
      detail: >-
        Commit 6eacc1fdfc485193e951d8317347d7172ef81a54 is reachable from HEAD.
        Its FILES were reverted in f8c09984e and the revert is honestly
        disclosed in the snapshot receipt's ordering_note; its MESSAGE was not
        reverted. That message contains, in plain text: all ten values laid out
        per field size, the composed verdict, the per-value counts, the
        exactly-once-and-no-table finding, and the subject line "the
        PAPER_PAIRS literals are FAITHFUL, and the comparison is not". The
        subject line survives verbatim inside f8c09984e's own subject, so `git
        log --oneline` alone displays the composed verdict twice. I verified
        the leak by counting distinct values in each message: 6eacc1fdf carries
        10 of 10; f8c09984e carries 0; the accepted archive commit 98e3945a5
        carries 0 and explicitly states "THIS RECEIPT AFFIRMS NO VERDICT".
      why_it_matters:
        - >-
          BLINDING. BATCH-dc1424's blind_phase_hygiene declaration says no
          control-plane file restates any of the ten values, precisely because
          TASK-20260904-c8675d must read the control plane to learn its
          assignment and then re-transcribe the five pairs blind. The review
          plan's blind_from is a list of FILES and
          tools/check_review_independence.py can only check declared file
          reads. A `git log` on the branch is not a file read, is not in
          blind_from, is a routine orientation command, and displays the
          answer. This is a channel the plan's own
          `not_mechanically_checkable` note did not anticipate - it worried
          only about the ordering with respect to cost_model.py.
        - >-
          AFFIRMATION. The archive task was constrained "DO NOT WRITE A
          CORRECTION, NOTE, OR COMMENTARY THAT AFFIRMS ANY REVIEWED VERDICT"
          with the gate "no verdict of the package is affirmed or characterized
          anywhere". 6eacc1fdf's message affirms the verdict, states the
          committing session "VERIFIED INDEPENDENTLY ... against both primary
          sources" before either blinded reviewer ran, and adds a
          characterization - "the comparison is not [faithful]" - which
          promotes NS-2 from a recorded non-verdict observation to a headline
          assertion the package deliberately kept out of its verdict.
      what_i_did_about_it: >-
        I sent a pointer to the main session mid-review, naming the commit and
        quoting no value, because a blinding hazard is useless to report after
        the round closes. That message is a pointer and not a finding of
        record; this entry is the record.
      recommendation_not_a_decision: >-
        I recommend nothing about rewriting history and note that rewriting
        over an archived run record is forbidden regardless. What the round
        does about a possibly-contaminated J5 is a Coordinator decision on the
        evidence, and TASK-20260904-c8675d's own attestation of what it read is
        the instrument that should settle it.
      changes_a_verdict: >-
        Not the RC-1 verdict, which is unaffected. It bears on the round's
        independence claim, which is the Coordinator's to compose.
    - id: F-10
      joint: J2
      severity: low
      title: NS-2 records the ">=" but not the "~"
      detail: >-
        NS-2 correctly records that the ten values are stated as lower bounds
        against a two-sided consumer. The memory figures carry a SECOND
        approximation it does not record: line 230 says "the memory cost of the
        algorithm is ~ M", an approximate identity, and line 226 says "The size
        of the tables" (plural - Algorithm 2 builds a table from E and one from
        E^{(p)}), so a factor near two is absorbed by that "~". The bullet's
        memory number is therefore a lower bound on an approximation, while the
        committed literal is a point value fed to a two-sided +-0.75 bit test.
      why_it_matters: >-
        Same defect class as NS-2, equally outside the frozen verdict for
        exactly the same reason, and equally worth recording. NS-2 as written
        covers only the bullets' ">=".
      changes_a_verdict: false
    - id: F-11
      joint: J4
      severity: informational
      title: RC-2 is invariant to which committed run supplies the attained minima
      detail: >-
        cost_model.py's default WESOVOW_RAW_PATH names
        runs/RUN-WESOVOW-201692-001/raw-result.json, while the producer read
        runs/RUN-WESOVOW-001/raw-result.json as its handoff directed. A reader
        could reasonably ask whether the choice of run drove the result. It did
        not: I ran the producer's own load_attained_minima against BOTH
        packages and the five per_field optimal log2T values are bit-identical,
        so RC-2 returns the same five verdicts and the same five signed
        differences either way.
      why_i_record_it: >-
        It closes an alternative explanation of `off_curve` that neither the
        card nor the package addresses, and it does so in the package's favour.
        Reporting only adverse findings would be its own distortion.
      changes_a_verdict: false
    - id: F-12
      joint: J4
      severity: low
      title: >-
        The control plane's gloss on `literals_faithful` is falsified by the
        package's own NS-2, and only NS-2 records why
      detail: >-
        batch.yaml's the_three_outcomes_are_all_real_results glosses
        literals_faithful as "the anchor divergence is not a transcription
        defect, and the successor question is a model or comparison question".
        The package's NS-2 exhibits a third possibility that gloss does not
        contemplate: the divergence may be neither a transcription defect nor a
        model defect but a CATEGORY defect - a quantity the source states as a
        lower bound, from an explicitly rough underestimation, consumed by a
        two-sided +-0.75 bit point test.
      why_it_matters: >-
        This is not an overclaim by the producer, which is scrupulous about it
        and keeps it out of the verdict correctly. The risk is downstream:
        `literals_faithful` is what a ledger record will carry forward, the
        gloss travels with the verdict, and NS-2 does not. If the verdict is
        recorded without NS-2 attached, the round will read as having narrowed
        the question to "model or external disagreement" when the package
        itself found a third branch.
      recommendation_not_a_decision: >-
        Any record carrying `literals_faithful` forward should carry NS-2 with
        it. That is a Coordinator decision; I state it as a recommendation and
        it binds nobody.
      changes_a_verdict: false

  # ---------------------------------------------------------------------
  heuristic_validation_checks:
    - check: applicability
      result: >-
        NOT APPLICABLE, stated rather than silently omitted. This batch
        validates no heuristic and samples nothing. It is document reading,
        code reading and arithmetic on already-committed literals, as its own
        objective says. There is no pre-registered distribution prediction, no
        sample, no seed, no empirical CDF and no correspondence substituting
        for direct sampling in anything this package produced.
    - check: pre-registration discipline, the one heuristic-validation obligation that does transfer
      result: >-
        SATISFIED IN FORM, ATTESTED IN FACT. The comparison criteria were
        pre-registered and the two testable components match their source word
        for word. The claim that they were written before the source was opened
        is attested and not checkable - see F-8. The RC-1-before-RC-2 ordering
        is checkable and holds.
    - check: scale binding
      result: >-
        RECORDED. The package's scope is five field sizes log2 p in {256, 384,
        512, 576, 768}, one frozen document, one cost model, two committed run
        packages, at one commit. NS-6 additionally scopes the result to the
        frozen TRANSCRIPT rather than to the published article, disclosing that
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md is a verbatim text
        provided on 2026-07-24 per its source_record.yaml and that a structure
        lost in transcription would be invisible. I confirm that disclosure is
        the right scope statement and that no independent copy of the article
        was fetched by this review either; it is not in my read_scope and I did
        not seek one. No transfer to any other parameter, scheme or method is
        claimed by the package or by me.

  cost_model_checks:
    - check: cost-unit declaration
      result: >-
        DECLARED AND VERIFIED. specification.yaml model_definition declares
        unit_of_cost as "F_{p^2}-operations (paper's conservative convention: 1
        op per table entry)" at line 71 and unit_of_memory as "table entries
        (an entry stores one isogeny/curve record)" at lines 72-73, with byte
        conversions carried as scenario parameters at 64 and 256 bytes per
        entry rather than as the primary unit. The source states the same units
        in the same section - `F_{p^2}-operations` explicitly for time, and
        entries implicitly for memory via M. So the anchor comparison is
        between declared and matching units. This is the finding that decides
        J2's memory-form question.
    - check: memory reported alongside time
      result: >-
        YES on both sides. The paper states a (time, memory) pair per field
        size, and the model records log2T and log2M per field size. This review
        makes no claim about either.
    - check: per-attempt cost times inverse success probability
      result: >-
        The model implements exactly this bookkeeping and I verified it as an
        identity on the committed numbers without executing anything -
        specification.yaml declares log2T_full = log2M - log2P0, i.e. per-table
        cost M multiplied by 1/P0, and the recorded optima satisfy it
        bit-exactly at all five field sizes. The source states the same shape
        at line 230 - "its time cost is ~ M/P0 F_{p^2}-operations". Success is
        NOT treated as certain on either side. This is an internal-consistency
        observation about a committed artifact and is not a validation of the
        cost model, which NS-7 correctly disclaims and which nothing in this
        batch attempted.
    - check: optimistic assumptions flagged
      result: >-
        Flagged in the source itself, at lines 226, 230, 240 and 43, and
        carried into the package at NS-2, PHP-1 and anchor_reachability
        alternative explanation (3). See F-10 for the one flag the package does
        not carry.
    - check: concrete cost table produced by this batch
      result: >-
        NONE. This batch produces no cost table and asserts no concrete cost.

  proof_architecture_checks:
    - check: applicability
      result: >-
        NOT APPLICABLE, stated rather than omitted. The package proposes no
        theorem, bound, certificate family, reduction or closure argument, so
        no proof_search_map is required and none is claimed. No baseline
        fixture, strictness witness, interface-preservation record, method
        ceiling or quantifier-order statement is at stake.
    - check: proves-too-much control
      result: >-
        Assigned to TASK-20260904-c8675d, not to me. I did not perform it, do
        not report on it, and my J3 execution of VC-1's four decoys is a test
        of the producer's control implementation rather than the round's
        proves-too-much control.

  scaled_down_ladder_check_inventor_protocol_section_6:
    engaged: false
    reason: >-
      Stated explicitly because its absence must be a decision rather than an
      omission. Section 6's ladder governs a claimed improvement that cannot be
      executed at the scale where it would matter. This batch claims no
      improvement, no speedup and no ratio against any baseline, at any scale.
      It reports a transcription equality and one reachability comparison on
      already-committed numbers. There is therefore no assumption to isolate,
      no scaled-down instance to run, no measured ratio to demand and no
      real-scale cheat to classify. Nothing here is an extrapolation, and the
      package asserts nothing that a ladder step would be needed to support.

  # ---------------------------------------------------------------------
  limitations:
    - >-
      MY REVIEW IS SESSION-INDEPENDENT BUT NOT MODEL-INDEPENDENT. It ran in an
      independent session under the review-adversarial policy at xhigh effort,
      but the harness resolves every policy alias to one backend, so my
      judgement and the producer's are correlated in a way no attestation can
      remove. Agreement between us is weaker evidence than it looks. This is
