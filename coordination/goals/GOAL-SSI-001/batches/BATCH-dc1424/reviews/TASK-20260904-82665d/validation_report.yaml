      verdict: accepted with defects recorded
    - artifact: runtime_session_receipt.yaml
      exists: true
      hash_matches_binding: true
      parses: 'yes, yaml.safe_load'
      required_content_present: >-
        requested policy and its source, reasoning effort, backend, resolved
