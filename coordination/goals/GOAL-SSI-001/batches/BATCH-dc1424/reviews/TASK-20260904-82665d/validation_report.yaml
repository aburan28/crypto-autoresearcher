      independent_verification: >-
        PN-2's corrected figure is right: I computed the minimum displacement
        of decoy object (ii) over all ten permuted assignments as
        24.69999999999999 bits at log2p=576|log2_memory, which is the corrected
        24.7 and not the withdrawn 45.7. PN-1's claim that the 0.18-3.22 bit
