  # ---------------------------------------------------------------------
  metric_recomputations:
    - metric: the ten paper-side values
      source_read_by_me: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md lines 234-238
      recomputed: >-
        256 -> (106.5, 92.5); 384 -> (157.5, 138.6); 512 -> (204.2, 181.3);
        576 -> (230.9, 206.0); 768 -> (302.4, 272.2), each read off its own
        bullet with the time figure carrying `F_{p^2}-operations` and the
        memory figure carrying `memory >=`.
      agrees_with_package: true
    - metric: the ten committed literals
      source_read_by_me: experiments/EXP-WESOVOW-001/cost_model.py lines 61-65
      recomputed: >-
        identical to the above, PAPER_PAIRS element 0 = log2 time, element 1 =
        log2 memory per the comment at line 60.
      agrees_with_package: true
    - metric: the ten signed differences (paper minus literal)
      expression: 'signed_difference = paper_value - committed_literal'
      recomputed: 'exactly 0.0 at all ten, printed with repr, not rounded for display'
      agrees_with_package: true
    - metric: the composed RC-1 verdict
      expression: >-
        if any(v == mis_transcribed) -> literals_mis_transcribed;
        elif all(v == faithful) -> literals_faithful; else -> undetermined
      recomputed_by_hand: literals_faithful
      recomputed_via_producer_compose: literals_faithful
      agrees_with_package: true
    - metric: RC-2 signed differences and verdicts
      expression: >-
        signed_difference = PAPER_PAIRS[log2p][0]
        - raw['per_field']['log2p=<N>']['optimal']['log2T'];
        verdict = reachable if signed_difference >= 0.0 else off_curve
      recomputed: >-
        -2.2308895880061783, -0.3743903181755286, -1.903896739417803,
        +0.9187897604140574, +1.464564302171425
      agrees_with_package: 'true, bit-exactly'
    - metric: VC-1 decoy minimum displacements
      expression: 'min over the ten keys of abs(decoy[fs][q] - literal[fs][q])'
      recomputed: >-
        object i: 0.30 uniformly. object ii: 24.69999999999999, attained at
        log2p=576|log2_memory. object iii: 21.5, attained at
        log2p=256|log2_time. object iv: 6.0 on the five memory values, 0.0 on
        the five time values.
      agrees_with_package: >-
        true, and it confirms PN-2's correction from 45.7 to 24.7 rather than
        merely accepting it.
    - metric: VC-2 float boundary
      expression: '(v + 0.05) - v <= 0.05'
      recomputed: >-
        0.04999999999999716 (True) at 106.5 and 92.5; 0.05000000000001137
        (False) at the other eight.
      agrees_with_package: true
    - metric: internal consistency of the attained minima
      expression: >-
        log2X = 0.5*log2B + (log2p-1)/6; w = log2X/log2B;
        u = (log2p-1)/(3*log2B); log2P0 = -u*log2(u);
        log2T = log2M - log2P0
      recomputed: >-
        all five relations hold at all five field sizes, the last bit-exactly.
        cost_model.py was NOT executed; this is arithmetic on the committed
        raw-result.json against specification.yaml's stated formulas.
      agrees_with_package: >-
        consistent with anchor_reachability.yaml's
        why_the_attained_minimum_is_a_minimum, without establishing minimality.
    - metric: preregistration_frozen_hash
      expression: sha256 of the preregistration block under an unstated serialization
      recomputed: >-
        NOT REPRODUCED under yaml.safe_dump with sort_keys True or False,
        yaml.dump default_flow_style False, json.dumps sort_keys, or
        json.dumps indent=2 sort_keys. See finding F-8.
      agrees_with_package: unverifiable

  # ---------------------------------------------------------------------
  control_checks:
    summary: >-
      Every declared control was called by me, by importing check_literals.py
      as a module and invoking its functions on inputs I constructed. Failure
      branches were established by EXECUTION, never by reading a description.
      Detail is under joints.J3.
    VC-0:
      pass_entailed_by_construction: false
      failure_branches_reachable_and_fired: 4
      producers_disclosure_accurate: true
      undisclosed_blind_spot_found: 'yes - F-4'
    VC-1:
      pass_entailed_by_construction: true
      producer_disclosed_the_entailment: 'yes, explicitly and in the strongest terms'
      failure_branch_reachable_and_fired: 'yes - W-1'
      self_contradiction_branch_reachable_and_fired: 'yes - W-2'
      disclosure_incomplete_by_one_item: 'yes - F-3, the non-constancy probe'
    VC-2:
      pass_entailed_by_construction: true
      producer_disclosed_the_entailment: yes
      failure_branch_reachable_and_fired: 'yes - X-1'
      measurement_reproduces: yes
    RC-2:
      pass_entailed_by_construction: 'substantially, for both declared directions'
      producer_disclosed_the_entailment: 'yes, and correctly framed it as a wiring bound'
      branches_reachable_and_fired: >-
        all three - reachable, off_curve and not_attempted. The producer
        exercised two; I exercised the third.
      wiring_claim_verified_by_execution: 'yes - Y-2'
    null_object_control_per_inventor_protocol_section_3: >-
      Present and executed. VC-1 object iii is an explicit null object - the
      pair set (log2 p / 2, 0.0), for which "these are Section 4.1's (time,
      memory) pairs" is known false - and the procedure rejects it. I verified
      the rejection is entailed by magnitude (minimum displacement 21.5 bits
      against a 0.05-bit tolerance), so the null object bounds nothing beyond
      the arithmetic. Recorded, and the package says the same.
    decay_tell_per_inventor_protocol_section_3: >-
      Not applicable and stated rather than omitted. The package reports no
      correlation, bias or excess and sweeps no parameter that is meant to
      destroy a signal, so there is no quantity whose failure to decay could be
      the artifact tell. Nothing here is a statistical measurement.

  # ---------------------------------------------------------------------
  findings:
    - id: F-1
      joint: J1
      severity: low
      title: Three secondary locators are wrong, eight occurrences across four artifacts
      detail: >-
        (a) All five memory entries of locator_table.json, and NS-3 of
        paper_literals_verification.yaml, cite "line 226 defines 'the memory
        cost of the algorithm is ~ M'". That sentence is at LINE 230. Line 226
        reads "Let us estimate a lower bound on the concrete cost ... The size
        of the tables constructed in Algorithm 2 is at least". The same
        sentence also attributes "the size of the tables" to line 228, whereas
        line 228 carries only the display equation "M = Psi(X, B)X." and the
        phrase is at line 226. Verified with `grep -n "memory cost of the
        algorithm"`, which returns line 230 and nothing else, and `grep -n
        "size of the tables"`, which returns line 226 and nothing else.
        (b) NS-2 of paper_literals_verification.yaml and PHP-1 of
        controls_report.yaml cite "SANITY_TOLERANCE_BITS = 0.75,
        cost_model.py:71". It is at LINE 72; line 71 is "B_GRID_LO, B_GRID_HI,
        B_GRID_STEP = 1.0, 60.0, 0.1".
        (c) anchor_reachability.yaml cites "MEMORY_BUDGETS (cost_model.py:66)".
        It is at LINE 67; line 66 is the closing brace of PAPER_PAIRS.
      why_it_matters: >-
        The ten PRIMARY locators are exact and are machine-checked by VC-0.
        Secondary locators are checked by nothing. Two of these three sit
        inside the memory-unit chain that NS-3 itself names as the one
        judgement that could flip the composed verdict, so a Coordinator or a
        successor reviewer following those locators to re-decide that judgement
        lands on the wrong lines. Instance (b) is literally J1's declared
        breaking-artifact shape - a line range whose text does not contain the
        attributed number - applied to a secondary number.
      changes_a_verdict: false
      remedy_is_not_mine_to_apply: >-
        The artifacts are immutable and snapshot-bound. A correction supersedes;
        nothing here is repairable in place and I repaired nothing.
    - id: F-2
      joint: J4
      severity: medium
      title: The gating artifact omits the citation prohibition entirely
      detail: >-
        paper_literals_verification.yaml - the artifact the task card calls
        "THE GATING ARTIFACT" and the one carrying the composed verdict -
        contains no citation_prohibition_verbatim, no predicate extension, and
        no statement of whether either fired. Its top-level keys are
        preregistration, preregistration_frozen_hash,
        preregistration_frozen_at_utc,
        preregistration_revised_after_seeing_a_paper_value,
        preregistration_objections, section_identification,
        exhaustive_search_for_second_statements, per_value_verdicts,
        per_value_verdict_counts, comparison_form_counts,
        precision_limited_values, tolerance_widenings_applied,
        derived_comparisons_performed,
        values_with_a_recorded_failed_search_instead_of_a_locator, composition
        and what_this_does_not_settle. `grep -i citation` over that file
        returns one line, 364, which is about the execution prohibition and not
        this one. The other five artifacts all carry both strings verbatim plus
        an application statement; I checked containment after whitespace
        normalisation, so this is not a line-folding artifact.
      why_it_matters: >-
        Two declared completion-gate items are unmet - the task card's
        constraint "RESTATE THE CITATION PROHIBITION VERBATIM IN EVERY
        ARTIFACT" and its gate "The citation prohibition and its predicate
        extension are restated verbatim in every artifact ... and each artifact
        states whether either fired." The gate exists so that a consumer
        reading one artifact sees the prohibition, and the gating artifact is
        the one most likely to be read alone and quoted from.
      mitigating: >-
        Nothing prohibited escaped. I scanned that artifact independently: it
        restates no crossover value, no `w = 2^80` sign, no baseline
        comparison, no margin and no speedup, so the prohibition would not have
        fired had it been stated.
      changes_a_verdict: false
    - id: F-3
      joint: J3
      severity: medium
      title: The entailment-disclosure set is incomplete by exactly one item
      detail: >-
        controls_report.yaml discloses VC-1, VC-2 and RC-2 as having entailed
        passes and presents `vc1_non_constancy_probe` as VC-1's non-entailed
        informative content - "That, and not the four rejections, is what VC-1
        bought" - and its honest_overall_reading says the three entailed
        controls each have "the non-entailed measurement it nevertheless
        produced named separately". By execution the probe's outcome is
        entailed by the SAME arithmetic that entails the four rejections: with
        all ten differences exactly 0.0 and tolerance 0.05, the probe displaces
        by 0.02 and |0.0 + 0.02| = 0.02 <= 0.05, so `literals_faithful` follows
        without any property of the procedure being tested. I made this
        concrete: forcing tolerance_applied to 0.01 makes the SAME probe report
        `procedure_is_constant_rejector: True` on a procedure that is plainly
        not a constant rejector, which shows the flag is a function of (probe
        delta versus tolerance) and not of constancy.
      what_the_probe_does_establish: >-
        A wiring property - that compare_value is not a constant function -
        which is real and worth having, and which is exactly the category the
        producer used correctly for RC-2 directions (a) and (b). The defect is
        the filing, not the probe.
      why_it_matters: >-
        This is the defect class this program has hit repeatedly: a control
        whose firing condition is asserted from a plausible mental model rather
        than read out of the instrument. The mental model here is "acceptance
        below tolerance is informative where rejection above it is not". The
        instrument shows both are fixed by the same arithmetic. The producer's
        own disclosures are otherwise the most creditable part of the package
        and the four they made are correct; this is the fifth they did not
        make, and it is the one attached to the thing the package puts forward
        as its non-entailed content.
      changes_a_verdict: >-
        No. VC-1's information content is bounded either way, and the package
        does not claim its control suite corroborates the RC-1 verdict.
    - id: F-4
      joint: J3
      severity: low
      title: VC-0 does not check the attributed number on non-`direct` entries, undisclosed
      detail: >-
        vc0_locator_completeness guards the `2^<value>` token check with `if
        e["comparison_form"] == "direct"`. On any other form the paper_value is
        never compared with the quoted text at all. Executed: a table with
        log2p=576|log2_time set to comparison_form `requires_derivation` and
        paper_value 4242.4 - a number absent from its quotation - returns
        {'passed': True, 'problems': [], 'entries_checked': 10}.
      why_it_matters: >-
        Harmless as delivered, because all ten entries are `direct`. It is
        precisely the branch that matters if a reviewer accepts NS-3 and moves
        the five memory entries to `requires_derivation`: VC-0 would then
        silently stop checking half the values while still reporting
        `passed: true` over ten entries. The producer disclosed VC-0's
        within-bullet-swap gap accurately - I confirmed that one by execution
        too - but not this one.
      changes_a_verdict: false
    - id: F-5
      joint: J3
      severity: low
      title: Under the NS-3 flip the whole control suite goes vacuous, undisclosed
      detail: >-
        Setting all ten comparison_forms to `requires_derivation` - the exact
        world NS-3 names as the live alternative - and re-running the
        producer's own controls: VC-1 returns passed=True with
        composed=`undetermined` and zero decoys returning faithful; VC-2
        returns passed=True with every per-value resolution None; the
        non-constancy probe returns
        `procedure_is_constant_rejector: True`. So in that world no control
        discriminates anything, and VC-1's pass criterion ("no decoy returns
        literals_faithful") is satisfied trivially by a procedure that emits
        `undetermined` for everything.
      why_it_matters: >-
        The package discloses that the flip moves the VERDICT. It does not
        disclose that the flip also empties the controls, so a reader who
        accepts the flip would be left believing the control suite still
        constrains something.
      changes_a_verdict: false
    - id: F-6
      joint: J3
      severity: low
      title: RC-2's third branch was never exercised
      detail: >-
        rc2_reachability has three outcomes. The producer's completion gate
        reads "RC-2 exercises both failure directions on real inputs and
        reports both", and it exercised `reachable` and `off_curve`. The third,
        `not_attempted` on an absent committed value, was not exercised; the
        artifact reports `not_attempted: []`. I exercised it by setting
        attained[512] to None and it fires correctly, returning {'verdict':
        'not_attempted', 'reason': 'a needed committed value is absent'} for
        that row and leaving the other four intact.
      mitigating: >-
        Not a defect in the finding. All five key paths are present - I
        verified them in both committed run packages - so the branch's
        condition never obtained and its emptiness is a true report.
      changes_a_verdict: false
    - id: F-7
      joint: J2
      severity: low
      title: The composition rule was authored, not copied, while the artifact says "Copied"
      detail: >-
        preregistration.source_of_this_block says the block was "Copied from
        the constraints of TASK-20260904-d66403's task card ... and from
        BATCH-dc1424/batch.yaml `the_three_outcomes_are_all_real_results`". The
        tolerance and directly-comparable tests ARE copied - I diffed them word
        for word. The composition rule is not: the task card asserts the
