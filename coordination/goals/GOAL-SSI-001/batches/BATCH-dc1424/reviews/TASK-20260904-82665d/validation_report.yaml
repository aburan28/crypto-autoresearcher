          passed=True, committed_set_composed=literals_faithful,
          decoys_returning_faithful=[], self_contradiction=False. Per-decoy
          counts reproduce the producer's `observed` blocks EXACTLY, including
          the 5-faithful/5-mis_transcribed split on the unit object.
        my_failing_inputs_and_what_its_own_code_did:
          - input: >-
              W-1. Literals set to paper minus 0.30, so decoy i (shift +0.30)
              lands exactly on the paper values.
            observed: >-
              passed=False, committed_set_composed=literals_mis_transcribed,
              decoys_returning_faithful=['i_shift_plus_0.30'],
              self_contradiction=False
            branch: the decoy-accepted branch. FIRED.
          - input: >-
              W-2. Real literals, every tolerance widened to 1.0 bit, so both
              the committed set and the +0.30 decoy are inside tolerance.
            observed: >-
              passed=False, committed_set_composed=literals_faithful,
              decoys_returning_faithful=['i_shift_plus_0.30'],
              self_contradiction=True
            branch: >-
              the self_contradiction detector, the deepest branch in VC-1.
              FIRED. It is reachable and it works.
        entailment_of_its_pass: >-
          ENTAILED, and the producer says so in the strongest terms. I verified
          the arithmetic rather than accepting it: I computed the per-value
          displacement of every decoy from the committed set. Object i is 0.30
          everywhere; object ii has minimum 24.69999999999999 bits, attained at
          log2p=576|log2_memory - which independently confirms the producer's
          PN-2 correction from 45.7 to 24.7 and shows the corrected figure is
          right; object iii has minimum 21.5 bits at log2p=256|log2_time,
          confirming "more than 20 bits everywhere"; object iv is 6.0 on all
          five memory values. Every one exceeds 0.05. Rejection follows from
          arithmetic alone.
        the_producers_entailment_disclosure_is_incomplete_by_one_item: >-
          See finding F-3. The non-constancy probe is presented as VC-1's
          non-entailed content and is itself entailed.
        constant_rejector_hole: >-
          The plan asks specifically whether the procedure ACCEPTS something. It
          does: the probe accepts a set displaced 0.02 bits, and W-2 shows it
          accepts a set displaced 0.30 bits once the tolerance permits. So the
          procedure is not a constant rejector. That much holds - only its
          evidential status is misfiled.
      VC_2:
        real_input: >-
          passed=True, values_blind_at_0.2_bits=[]. Per-value smallest delta
          still returning mis_transcribed reproduces the producer's table
          exactly: 0.1 at both log2p=256 values, 0.05 at the other eight.
        my_failing_input_and_what_its_own_code_did:
          - input: >-
              X-1. tolerance_applied widened to 0.5 on log2p=512|log2_time
              only.
            observed: >-
              passed=False, values_blind_at_0.2_bits=['log2p=512|log2_time']
            branch: the blind-at-0.2-bits branch. FIRED.
        float_boundary_claim_recomputed_from_scratch: >-
          The producer's PO-1 and its 0.05-asymmetry disclosure are correct. I
          computed (v + 0.05) - v for all ten values in Python: the two
          log2 p = 256 values both give 0.04999999999999716, which is <= 0.05
          and so `faithful`; the other eight all give 0.05000000000001137,
          which is > 0.05 and so `mis_transcribed`. The producer's quoted
          digits 0.049999999999997 and 0.050000000000011 are truncations of
          exactly these, not invented. The split is at the value level and it
          is an IEEE-754 artifact of the `<=` boundary, as disclosed. It
          affects no verdict here because all ten committed differences are
          exactly 0.0.
        entailment_of_its_pass: >-
          ENTAILED - 0.2 > 0.05, so a 0.2-bit perturbation necessarily exceeds
          the tolerance at every `direct` value. The producer says so. The
          MEASUREMENT (0.05-0.1 bit resolution) is not entailed in the same
          way, and the producer's note that the coordinator_prior predicted
          resolution no tighter than 0.5 bits and was not borne out is correct.
        one_sided_ladder: >-
          Observation, not a finding. The ladder perturbs upward only. I
          checked the downward direction by hand: |(106.5 - 0.05) - 106.5| =
          0.04999999999999716 and |(138.6 - 0.05) - 138.6| = 0.05000000000001137,
          the same split. Verdict-neutral here because every committed
          difference is 0.0.
      RC_2_as_a_control:
        real_input: >-
          off_curve at 256, 384, 512; reachable at 576, 768; not_attempted
          empty. Both branches taken on the real input without synthetic help,
          as the producer reports.
        producer_direction_a: >-
          Model's own optima as anchors -> all five `reachable`, signed
          difference exactly 0.0 at every field size. Reproduced.
        producer_direction_b: >-
          Anchors 5.0 bits below the minimum -> all five `off_curve`, signed
          difference exactly -5.0 at every field size. Reproduced.
        my_inputs_and_what_its_own_code_did:
          - input: >-
              Y-1. attained[512] set to None - the third branch, which the
              producer never exercised.
            observed: >-
              row 512 returns {'verdict': 'not_attempted', 'reason': 'a needed
              committed value is absent'}; the other four rows are unchanged.
            branch: not_attempted. FIRED. See finding F-6.
          - input: >-
              Y-2. Field sizes deliberately MIS-MAPPED - anchors set to the
              attained minima, cyclically shifted by one field size.
            observed: >-
              256 -> +192.2045461098224 `reachable`; 384 -> -49.14350073016935;
              512 -> -48.22950642124226; 576 -> -23.877313500168157;
              768 -> -70.9542254582426, all `off_curve`.
            reading: >-
              This is the test the producer only ARGUED for. It confirms by
              execution that direction (a) would in fact catch a field-size
              mis-mapping, because a mis-map produces differences tens of bits
              from zero instead of exactly 0.0. The producer's wiring reading
              of directions (a) and (b) is therefore correct rather than merely
              plausible.
          - input: >-
              Y-3. Anchor exactly equal to the minimum, and anchor one ULP
              below it (math.nextafter towards -inf).
            observed: >-
              equal -> `reachable` with difference 0.0 at all five; one ULP
              below -> `off_curve` with differences of order 1e-14 at all five.
            reading: >-
              The `>= 0.0` boundary behaves as declared. The three real
              off_curve margins are 0.374 to 2.231 bits, roughly thirteen
              orders of magnitude above the ULP scale, so no RC-2 verdict is
              float-boundary sensitive. The producer did not check this; it
              strengthens RC-2 rather than weakening it.
        entailment_of_its_pass: >-
          ENTAILED for both declared directions, and the producer says so
          precisely and correctly: (a) compares x >= x and (b) compares
          x - 5.0 >= x. What they bound is the WIRING of the comparison. My
          Y-2 makes that bound concrete rather than argued.
      concrete_objection: >-
        FINDINGS F-3, F-4, F-5, F-6. The most important is F-3: the producer's
        entailment-disclosure set - which is otherwise the most creditable part
        of this package - is incomplete by exactly one item, and the missing
        item is the one thing the package puts forward as VC-1's non-entailed
        content.

    - joint: J4 anchor reachability, the citation predicate, and what the package licenses
      verdict: CONFIRMED WITH CAVEAT
      rc2_recomputed_independently:
        method: >-
          I recomputed RC-2 in my own script, without the producer's code, by
          loading experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-001/raw-result.json
          with json.load and reading raw['per_field']['log2p=<N>']['optimal']['log2T'],
          and taking the anchor times from cost_model.py lines 61-65 which I
          read myself. Expression, so the committing session can re-derive it -
          signed_difference = anchor_log2T - attained_min_log2T, and
          verdict = 'reachable' if signed_difference >= 0.0 else 'off_curve'.
        key_paths_claimed_by_the_package_and_whether_they_exist: >-
          All five exist. per_field keys are exactly ['log2p=256', 'log2p=384',
          'log2p=512', 'log2p=576', 'log2p=768'] and each carries an `optimal`
          dict with keys ['log2B', 'log2M', 'log2P0', 'log2T', 'log2X', 'u',
          'w']. No key the package claims to have read is missing.
        rows:
          - log2p: 256
            anchor: 106.5
            attained_min: 108.73088958800618
            signed_difference: -2.2308895880061783
            verdict: off_curve
            matches_package: true
          - log2p: 384
            anchor: 157.5
            attained_min: 157.87439031817553
            signed_difference: -0.3743903181755286
            verdict: off_curve
            matches_package: true
          - log2p: 512
            anchor: 204.2
            attained_min: 206.1038967394178
            signed_difference: -1.903896739417803
            verdict: off_curve
            matches_package: true
          - log2p: 576
            anchor: 230.9
            attained_min: 229.98121023958595
            signed_difference: 0.9187897604140574
            verdict: reachable
            matches_package: true
          - log2p: 768
            anchor: 302.4
            attained_min: 300.93543569782855
            signed_difference: 1.464564302171425
            verdict: reachable
            matches_package: true
        result: >-
          BIT-EXACT AGREEMENT at all five rows, including every digit of the
          five signed differences. RC-2 recomputes.
        agreement_with_the_prior_committed_record: >-
          EV-SSI-5d954c already records these same five deltas (-2.231, -0.374,
          -1.904, +0.919, +1.465). RC-2 reproduces that pattern rather than
          disagreeing with it, which is what the coordinator_prior's item (4)
          expected. The most informative outcome RC-2 could have produced - a
          disagreement between two computations of the same committed numbers -
          did not occur.
        additional_check_the_package_does_not_perform: >-
          See finding F-11. RC-2 is invariant to which of the two committed run
          packages supplies the attained minima.
        internal_consistency_of_the_attained_minima: >-
          Arithmetic only; cost_model.py was not executed. At all five field
          sizes the recorded `optimal` block satisfies specification.yaml's own
          stated relations - log2X = 0.5*log2B + (log2p-1)/6, w = log2X/log2B,
          u = (log2p-1)/(3*log2B), log2P0 = -u*log2(u), and log2T = log2M -
          log2P0 - the last of these bit-exactly at all five. So the number
          RC-2 compares against is the number specification.yaml says it is.
          This does NOT establish that it is the grid minimum: the run package
          stores only the optimum, not the B-grid curve, so the minimality
          claim rests on the contract's declaration of the optimizer's
          objective, exactly as anchor_reachability.yaml's
          `why_the_attained_minimum_is_a_minimum` says. I could not
          independently verify minimality without executing the model, which is
          prohibited, and I do not assert it.
      what_else_could_produce_off_curve: >-
        I enumerated the alternatives independently before reading the
        package's list, and every one I produced is already in it: a grid that
        does not contain the paper's optimal B (the grid is log2 B in [1.0,
        60.0] at step 0.1); a different rho evaluation, P0 convention or
        rounding in the source; the paper's numbers being LOWER BOUNDS from a
        deliberate underestimation, so that lying below a model minimum is what
        a lower bound is entitled to do; the constraints w >= 1 and u >= 1
        excluding the paper's operating point; a difference of cost unit not
        visible in the digits. anchor_reachability.yaml's
        `what_reachability_does_NOT_establish` lists all five, names the
        lower-bound explanation as the leading one, and says explicitly that
        `off_curve` at three field sizes is UNSURPRISING rather than anomalous.
        I found no alternative the package's language forecloses. Its
        qualifiers - `this cost model`, `on this grid` - are present in every
        sentence that could be read as a claim about the paper.
      citation_predicate_applied_by_me: >-
        Neither limb fires and the retained sentence does not fire. I verified
        this by scanning all six artifacts for `crossover`, `w=2^80`, `2^80`,
        `van Oorschot`, `T_DG`, `log2TDG`, `baseline`, `margin` and `speedup`:
        every hit is inside the verbatim prohibition text or inside the
        reasoning that shows it does not apply. No prohibited value or sign is
        restated anywhere in the package. The package computes no crossover, no
        baseline comparison, no margin and no speedup, so limb (a) has no sign
        to disagree on and limb (b) has no |margin| term and forms no anchor
        gap. My own report is subject to the same check and passes it.
      verbatim_restatement_audit: >-
        I whitespace-normalised each artifact and each canonical string and
        tested containment. Five of the six artifacts carry BOTH the retained
        sentence and the predicate extension verbatim. The sixth does not - see
        finding F-2, which is the most consequential procedural finding in this
        review.
      over_reading_enumeration:
        - id: OR-1
          sentence_location: >-
            anchor_reachability.yaml, what_reachability_establishes, first
            bullet - "the PAPER_PAIRS time literal is STRICTLY BELOW the
            smallest log2 T_full this cost model attains on the grid its own
            frozen contract declares".
          shortest_over_reading_path: >-
            Drop `this cost model attains`, read `below the minimum` as
            `impossible`, cite the row as evidence that a published cost
            estimate is unattainable, i.e. as a security claim about
            standardized parameter sets.
          named_by_the_producer: true
          my_assessment: >-
            Correctly identified and correctly qualified in situ. The producer
            names this path itself and states the inference is not licensed.
        - id: OR-2
          sentence_location: >-
            paper_literals_verification.yaml, what_this_does_not_settle NS-1 -
            "RC-2 (anchor_reachability.yaml) shows they cannot both be minima
            of the same function on this grid at three of five field sizes".
          shortest_over_reading_path: >-
            Quote the clause without the mid-sentence prepositional phrase `on
            this grid`, yielding "they cannot both be minima of the same
            function" - which reads as a fact about the two quantities rather
            than about one implementation on one grid, and licenses a claim
            about what the paper's numbers ARE.
          named_by_the_producer: false
          my_assessment: >-
            The qualifier is present and load-bearing, so the sentence as
            written is accurate. The risk is that a mid-sentence prepositional
            phrase is the easiest thing to lose in a re-quotation, and this
            sentence sits in the gating artifact where a downstream ledger
            record is most likely to draw from.
        - id: OR-3
          sentence_location: >-
            anchor_reachability.yaml, what_reachability_does_NOT_establish,
            penultimate bullet - "at three of five field sizes the two anchors
            CANNOT both be minima of this function on this grid, so treating
            them as two estimates of one quantity is not supported at those
            field sizes".
          shortest_over_reading_path: >-
            An affirmative conclusion placed inside a list headed
            `what_reachability_does_NOT_establish`. Quote the `so ...` clause
            and the negating frame is gone, leaving what reads as the
            package's positive finding about the relationship between a
            published estimate and this model.
          named_by_the_producer: false
          my_assessment: >-
            Structural rather than verbal. The claim is correct and scoped; the
            risk is that its container is a negation and quotations do not
            carry containers.
        - id: OR-4
          sentence_location: >-
            controls_report.yaml, VC-1 unit_blindness_disclosure - "A unit
            error that preserved magnitude would pass every control in this
            file undetected".
          shortest_over_reading_path: >-
            The asymmetric risk runs the other way here. A reader quotes VC-1's
            PASS and the rejection of the `unit object` decoy as evidence that
            the package checked units. It did not: object iv was rejected
            because +6.0 bits exceeds a 0.05-bit tolerance, by MAGNITUDE, and
            check_literals.py contains no unit checking at all. The producer
            states this plainly; the risk is that the disclosure travels less
            well than the pass.
          named_by_the_producer: true
          my_assessment: >-
            The disclosure is accurate and I confirmed it by reading the code:
            no function in check_literals.py inspects a unit. The only guard
            against a unit mismatch is the per-entry comparison_form judgement,
            which is prose. That is why J2's memory-form question had to be
            decided by reading the paper and not by any control.
      what_the_package_licenses:
        it_licenses: >-
          Exactly two things. First, that ten decimal literals at
          experiments/EXP-WESOVOW-001/cost_model.py lines 61-65 equal ten
          decimal literals at inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
          lines 234-238, at one frozen commit, with signed difference exactly
          0.0 at every one, each occurring exactly once in the document.
          Second, that the PAPER_PAIRS time lies strictly below this cost
          model's attained minimum log2 T_full at log2 p in {256, 384, 512} and
          at or above it at {576, 768}, on the committed numbers.
        it_does_not_license: >-
          Any statement about the paper's correctness, about SQIsign, CSIDH,
          any standardized parameter set, any exponent, any asymptotic
          complexity, any security level, any speedup, or the status of
          GOAL-SSI-001 or of any hypothesis - in either direction. It does not
          establish that the two anchors are two estimates of one quantity, and
          it does not distinguish `a defect or difference in the cost model`
          from `a genuine external disagreement`. The package says all of this
          itself, at NS-1 through NS-7 and in anchor_reachability.yaml's
          does-NOT-establish list, and its scope discipline is the strongest
          part of it.
        the_one_licensing_gap_i_found: >-
          FINDING F-12, below. It is not an overclaim by the producer; it is a
          gloss in the control plane that the producer's own NS-2 has
          falsified, and that will be lost if the verdict is carried forward
          without NS-2.
      concrete_objection: >-
        FINDINGS F-2, F-9 and F-12. F-2 is the gating artifact omitting the
        prohibition entirely. F-9 concerns the archive chain rather than the
        producer's six artifacts and is a live blinding hazard; it is reported
        here because J4 owns what is bound to and quotable from this package.

  # ---------------------------------------------------------------------
  per_deliverable_table:
    - artifact: paper_literals_verification.yaml
      exists: true
      hash_matches_binding: true
      parses: 'yes, yaml.safe_load'
      required_content_present: >-
        preregistration block with the before-opening attestation; section
        identification; ten per-value verdicts each with comparison_form,
        locator, tolerance_applied and signed difference; composition shown
        being applied; what_this_does_not_settle with seven entries.
      defects: >-
        F-2 (omits the citation prohibition and its predicate extension
        entirely, and states nowhere whether either fired - the only artifact
        of the six that does); F-1a (NS-3 mislocates `the memory cost of the
        algorithm is ~ M` to line 226; it is at line 230); F-1b (NS-2
        mislocates SANITY_TOLERANCE_BITS to cost_model.py:71; it is at line
        72); F-7; F-8.
      verdict: accepted with defects recorded
    - artifact: locator_table.json
      exists: true
      hash_matches_binding: true
      parses: 'yes, json.load'
      required_content_present: >-
        exactly ten entries keyed by (log2p, quantity); every declared field
        present at every entry including committed_literal_locator_only,
        paper_locator with path/line_start/line_end/quoted_text,
        comparison_form, tolerance_applied, tolerance_widened_reason,
        derived_comparison, failed_search, verdict and note.
      independent_verification: >-
        All ten quoted_text values are byte-identical to the text at their
        recorded lines and contain their attributed 2^value token.
      defects: >-
        F-1a, repeated in the comparison_form_reason of all five memory
        entries.
      verdict: accepted with defects recorded
    - artifact: check_literals.py
      exists: true
      hash_matches_binding: true
      parses: 'yes, imports and runs under python3.11 stdlib only'
      standalone_claim_verified: >-
        Imports are json, os, re, sys only. No numpy, no SageMath, no network
        module, no subprocess, no import from experiments/. It reads
        cost_model.py as text by regex and never imports or executes it.
      defects: >-
        F-4 (VC-0 skips the token check on non-`direct` entries, undisclosed);
        and a documentation inconsistency, recorded as an observation rather
        than a finding - the docstring says "Writes only inside this task
        directory (and only when --emit is passed)" but there is no argument
        handling of any kind and main() writes only to stdout. It writes less
        than it claims, which is the safe direction.
      verdict: accepted with defects recorded
    - artifact: controls_report.yaml
      exists: true
      hash_matches_binding: true
      parses: 'yes, yaml.safe_load'
      required_content_present: >-
        VC-0, VC-1, VC-2 and RC-2 each with what it tests, the concrete failing
        input, the observed result, a verdict and an entailment disclosure;
        post_hoc_pressure with PHP-1, PHP-2 and PHP-3.
      independent_verification: >-
        Every `observed` block I could re-run reproduced exactly, including the
        per-decoy counts, the VC-2 resolution table, the float-boundary digits
        and both RC-2 directions.
      defects: F-3, F-5, F-1b (PHP-1 mislocates SANITY_TOLERANCE_BITS).
      verdict: accepted with defects recorded
    - artifact: anchor_reachability.yaml
      exists: true
      hash_matches_binding: true
      parses: 'yes, yaml.safe_load'
      required_content_present: >-
        ordering attestation with re-checkable hashes; method with both
        sources by exact locator and key path; five rows; summary;
        what_reachability_establishes and does_NOT_establish; a named
        over-reading sentence with its path.
      independent_verification: >-
        All five rows recompute bit-exactly; all five key paths exist; the
        ordering attestation's two sha256 values match the delivered RC-1
        artifacts.
      defects: >-
        F-1c (mislocates MEMORY_BUDGETS to cost_model.py:66; it is at line 67);
