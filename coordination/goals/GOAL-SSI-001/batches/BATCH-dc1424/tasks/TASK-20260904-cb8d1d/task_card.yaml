task_card:
  id: TASK-20260904-cb8d1d
  goal_id: GOAL-SSI-001
  batch_id: BATCH-dc1424
  title: >-
    Coordinator ledger archive for the BATCH-dc1424 RC-1 round: compose the two
    blinded reviews, record the evidence and decision, checkpoint the goal, and
    commit exactly those records
  role: coordinator
  state: queued
  review_required: false
  archives:
    - TASK-20260904-82665d
    - TASK-20260904-c8675d

handoff:
  id: TASK-20260904-cb8d1d
  from: coordinator
  to: coordinator
  objective: >-
    Run alone after both independent reviews have returned; compose their
    per-joint verdicts into one evidence record and one decision; carry forward
    every undispatched item of BATCH-dc1424's carried_forward list; checkpoint
    the goal; and commit exactly those records without changing the frozen
    experiment, inventing a result, or making any transition the reviews do not
    support.
  uncertainty_reduced: >-
    Whether the RC-1 outcome - whichever of the three it is - its scope limits,
    its consequence for the anchor question and the citation boundary, and the
    successor it implies for the RC-6 contract amendment are durably recorded
    before any official state transition or successor batch.
  inputs:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/reviews/TASK-20260904-82665d/validation_report.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/reviews/TASK-20260904-c8675d/red_team_report.yaml
    - The snapshot-bound producer package and the receipt from TASK-20260904-977d04
    - The review plan on TASK-20260904-d66403, including the recorded coordinator_prior
    - The carried_forward list in coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/batch.yaml
    - templates/research-records.md, ledger/decisions/DEC-20260904-166ab5.yaml, and the existing GOAL-SSI-001 head
  constraints:
    - Run alone, and stage only the declared ledger archive paths by exact pathspec.
    - >-
      VERIFY THE RESERVED IDENTIFIERS BEFORE WRITING THEM. Run `python3
      tools/allocate_id.py --check EV-SSI-7a3e91` and `--check
      DEC-20260904-4c81b6`. They were reserved by an authoring task that held no
      shell and are declared CANDIDATE, NOT TOOL-VERIFIED in batch.yaml. If
      either is taken, do not overwrite anything: mint a replacement with
      `--next`, `--check` it, and record the substitution in the receipt.
    - >-
      RUN THE GATES AND DO NOT REPORT ONE YOU DID NOT RUN. Run `python3
      tools/check_review_independence.py --batch
      coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424` and `python3
      tools/validate_ledger.py` before treating the round as complete. In
      BATCH-256a94 the archive task held no shell, so neither was run and the
      gate had to be recorded as OUTSTANDING (DEC-20260904-166ab5 PD-6). If this
      task holds no shell, do exactly that again: record the gate as outstanding
      in the receipt, state that blindness was verified only by reading both
      reports in full, and say plainly that this is weaker than the tool. Never
      report a check as run that was not run.
    - >-
      Compose the verdicts yourself. Each reviewer owned a subset of the joints
      and neither report is a vote on the whole claim. A joint with no verdict is
      recorded as UNCOVERED, never assumed to hold.
    - >-
      COMPARE THE RECORDED COORDINATOR PRIOR AGAINST THE OUTCOME, ELEMENT BY
      ELEMENT, AND SAY WHICH ELEMENTS WERE OVERTURNED. The prior on
      TASK-20260904-d66403 makes six numbered commitments, including a
      prediction about where a mis-transcription would be found that is stated by
      reference to an immutable record rather than by value. Resolve that
      reference and state whether the prediction held. A prior the review
      overturned must not be quietly dropped, and the prior's own failure to
      anticipate the actual outcome is itself a recordable result.
    - >-
      TREAT AN `undetermined` COMPOSED VERDICT AS A RESULT AND RECORD IT AS ONE.
      If Section 4.1 does not state the pairs in a directly comparable form, that
      is the round's finding and it is decisive: it would mean PAPER_PAIRS was
      never a transcription of stated values and the two anchors were never two
      estimates of one quantity, which changes what the RC-6 amendment must say.
      Do not record it as an incomplete task, a failed run, or a budget
      shortfall, and do not soften it into "further work is needed".
    - >-
      Record explicitly that the two reviews were SESSION-independent but NOT
      MODEL-independent, because only the `local` backend resolves in this
      environment, so their concurrence is correlated by construction and may
      never be presented as agreement between distinct models. Record what this
      round did buy instead: two independent METHODS - a locator-checked audit
      and a blind re-transcription from the source.
    - >-
      Record the Red Team's Phase A / Phase B ordering as ATTESTED and NOT
      TOOL-CHECKED with respect to cost_model.py and DEC-20260904-166ab5, and
      record the mechanical blind_from result separately, so a later reader can
      tell which part of the blindness a tool verified.
    - >-
      Do not edit experiments/EXP-WESOVOW-001/ or inputs/ or anything under
      them, do not execute cost_model.py, and do not reconstruct any commit SHA
      or path hash.
    - >-
      The evidence record is a source-fidelity verification and one reachability
      measurement, not a new experiment measurement: certificate.kind is none,
      run_ids names only runs actually read, claim_tier may not exceed what
      document reading and arithmetic on committed literals supports, and
      proof_status / proof_refs are set honestly - `derivation` where the basis
      is a checkable reading of a frozen document, `empirical_only` where it is
      not.
    - >-
      NO hypothesis status transition, NO experiment status transition, and NO
      goal status transition. GOAL-SSI-001 remains `active` and this batch meets
      no completion criterion. `paused` and `blocked` are not permitted goal
      statuses; an impediment is recorded on the still-active goal with
      what_is_blocked, clears_when and recheck.
    - >-
      Fill knowledge_promotion: promote a KN-FIND only on a `support` or
      `reject_scoped` decision backed by `replicated` or `strong` evidence,
      otherwise record a concrete not_warranted reason. A single unreplicated
      document comparison does not reach `replicated`; if the producer and the
      blind re-transcriber independently agree value by value, say precisely what
      that does and does not replicate.
    - >-
      If any part of the decision would close a lane, it carries a complete
      `obstruction` block with a measured quantity, a value with units and error
      bars, its source artifacts, its scope, and a `resource_check`. Without
      that, do not close. An `off_curve` reachability verdict is NOT an
      obstruction block and may not be used as one.
    - >-
      DO NOT LIFT THE CITATION PROHIBITION unless this decision itself lifts it
      on the strength of both independent reports, and then only with the exact
      scope of the lift stated. Retain the predicate extension of
      DEC-20260904-166ab5 verbatim unless it is explicitly superseded here, and
      restate that the committed machine-readable flag under-reports.
    - >-
      CARRY FORWARD EVERY UNDISPATCHED ITEM OF batch.yaml's carried_forward LIST
      INTO THE DECISION'S next_actions, each with its origin, so that CF-1
      (the internally unsatisfiable frozen contract at specification.yaml:39-40),
      CF-8 (RC-3), CF-9 (RC-7) and CF-10 (the RAW_PATH hazard) cannot evaporate
      between batches. Name the RC-6 amendment's successor explicitly and state
      how RC-1's outcome changes what it must say.
    - >-
      Checkpoint the goal in the write-once shard
      ledger/goals/GOAL-SSI-001/checkpoints/BATCH-dc1424.yaml and make exactly
      one additive change to goal.yaml: its single next_action plus the pointer
      to this decision. Do not append new narrative keys to the goal head.
    - >-
      Fetch origin/main before committing and MERGE it - never rebase. Record the
      base commit and the merge outcome in the receipt, then push and open or
      refresh the PR against main naming the new EV-*, DEC-*, TASK-20260904-82665d,
      TASK-20260904-c8675d and BATCH-dc1424.
    - >-
      If a sync conflicts inside an immutable record, do not pick a side: stop
      and create a superseding record under a new identifier.
    - >-
      If the round returned inconclusive, or the producer stopped, say so
      plainly. An inconclusive round is a result and is never rewritten into a
      cleaner history.
  deliverables:
    - ledger_commit_receipt.json
    - ledger/evidence/EV-SSI-7a3e91.yaml
    - ledger/decisions/DEC-20260904-4c81b6.yaml
    - ledger/goals/GOAL-SSI-001/checkpoints/BATCH-dc1424.yaml
    - The single next_action update on ledger/goals/GOAL-SSI-001/goal.yaml
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/archives/TASK-20260904-cb8d1d/ledger_commit_receipt.json
    - ledger/evidence/EV-SSI-7a3e91.yaml
    - ledger/decisions/DEC-20260904-4c81b6.yaml
    - ledger/goals/GOAL-SSI-001/checkpoints/BATCH-dc1424.yaml
    - ledger/goals/GOAL-SSI-001/goal.yaml
  read_scope:
    - AGENTS.md
    - agents/coordinator.md
    - templates/research-records.md
    - docs/claims-and-verification.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424
    - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94
    - ledger/goals/GOAL-SSI-001
    - ledger/decisions/DEC-20260904-166ab5.yaml
    - ledger/evidence/EV-SSI-5d954c.yaml
    - experiments/EXP-WESOVOW-001/specification.yaml
  write_scope:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/archives/TASK-20260904-cb8d1d
    - ledger/evidence/EV-SSI-7a3e91.yaml
    - ledger/decisions/DEC-20260904-4c81b6.yaml
    - ledger/goals/GOAL-SSI-001/checkpoints/BATCH-dc1424.yaml
    - ledger/goals/GOAL-SSI-001/goal.yaml
  archived_by: TASK-20260904-cb8d1d
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - The commit changes exactly the five declared paths and preserves their recorded hashes.
    - Every joint in the review plan has a composed verdict, or is recorded as uncovered.
    - The coordinator_prior is compared against the outcome element by element, including resolving its by-reference prediction, and the correlated-review limitation is recorded.
    - The reserved identifiers were checked with tools/allocate_id.py before use, or a substitution is recorded.
    - The independence checker and the ledger validator were run, or are recorded as OUTSTANDING with the reason and with blindness stated as hand-verified and weaker.
    - The evidence record carries claim_tier, proof_status, proof_refs, and certificate.kind none, and cites only runs actually read.
    - The decision fills knowledge_promotion, records procedure_deviations, and makes no hypothesis, experiment, or goal status transition.
    - The citation prohibition and its predicate extension are either retained verbatim or lifted with an explicit scope, by this decision and nothing else.
    - Every undispatched carried_forward item of batch.yaml appears in next_actions with its origin.
    - The goal checkpoint shard is written, GOAL-SSI-001 stays active, and exactly one next_action remains on the head.
    - The branch is pushed and the PR against main names the new records.
  return_format: >-
    The coordinator_decision YAML block as written to the ledger, plus the
    receipt summary naming the commit, its parent, the archived paths, the base
    commit fetched, the merge outcome, and any gate recorded as outstanding.
