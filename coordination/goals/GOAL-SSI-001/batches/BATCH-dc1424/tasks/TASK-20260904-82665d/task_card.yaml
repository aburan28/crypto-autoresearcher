task_card:
  id: TASK-20260904-82665d
  goal_id: GOAL-SSI-001
  batch_id: BATCH-dc1424
  title: >-
    Independent Validator review of the RC-1 locator fidelity, verdict
    composition and undetermined discipline, control capability on real inputs,
    and the RC-2 anchor-reachability measurement
  role: validator
  state: queued
  review_required: false
  archived_by: TASK-20260904-cb8d1d
  joints_owned:
    - J1 locator fidelity of the paper-side transcription
    - J2 verdict composition and the undetermined discipline
    - J3 control capability on real inputs
    - J4 anchor reachability, the citation predicate, and what the package licenses

handoff:
  id: TASK-20260904-82665d
  from: coordinator
  to: validator
  objective: >-
    Independently decide, on joints J1, J2, J3 and J4 of the review plan on
    TASK-20260904-d66403: whether each recorded paper locator actually contains
    and correctly attributes the number filed against it; whether the composed
    RC-1 verdict follows from the pre-registered rule and whether `undetermined`
    was used honestly in both directions; whether each declared control has a
    reachable failure branch when its own code is called on real inputs; and
    whether the RC-2 reachability measurement recomputes and whether the package
    licenses anything beyond it.
  uncertainty_reduced: >-
    Whether the RC-1 package is a checkable, source-grounded verification of
    five committed literals, or a confident answer produced by a derivation the
    paper does not perform, behind controls that could not fail.
  inputs:
    - The snapshot-bound producer package under BATCH-dc1424/tasks/TASK-20260904-d66403/
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/archives/TASK-20260904-977d04/snapshot_commit_receipt.json
    - The review plan on TASK-20260904-d66403, whose joints J1, J2, J3 and J4 are yours
    - inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, which you read yourself at the recorded line ranges and beyond them
    - experiments/EXP-WESOVOW-001/cost_model.py and specification.yaml, and RUN-WESOVOW-001/raw-result.json, all read-only
    - ledger/decisions/DEC-20260904-166ab5.yaml and ledger/evidence/EV-SSI-5d954c.yaml
  constraints:
    - >-
      Independent session. Do not read the sibling red-team report for this
      round; blindness is mutual and you attest to what you read. If the
      red-team report exists when you run, do not open, list, or grep it.
    - >-
      Report on YOUR joints. You own J1, J2, J3 and J4 and cannot see J5 by
      construction, so do not return a whole-claim verdict; the Coordinator
      composes them.
    - >-
      Copy the joint names verbatim into joints_owned in your review
      attestation: "J1 locator fidelity of the paper-side transcription", "J2
      verdict composition and the undetermined discipline", "J3 control
      capability on real inputs", "J4 anchor reachability, the citation
      predicate, and what the package licenses".
    - >-
      YOUR REPORT IS A .yaml FILE WITH A TOP-LEVEL `review_attestation` MAPPING.
      In BATCH-256a94 the reports were .md, so
      tools/check_review_independence.py - which yaml.safe_loads the whole
      report file - could read neither attestation and the independence gate
      could not run at all. Write
      reviews/TASK-20260904-82665d/validation_report.yaml as valid YAML that
      `yaml.safe_load` parses, carrying `review_attestation` at the top level
      with task_id, joints_owned, sources_read, read_sibling_reports,
      blind_from_respected, and verdict.
    - >-
      READ THE PAPER YOURSELF at every recorded line range, and read the whole
      of Section 4.1 rather than only the cited lines, so that a second and
      disagreeing statement of any of the ten quantities is findable. Do not
      accept the producer's quotations.
    - >-
      RUN THE PRODUCER'S OWN CONTROL CODE against inputs you construct. Import
      check_literals.py as a module into your own scratch script and call its
      control functions directly; a prose claim that a failure branch is
      reachable is not evidence that it is. Write only to your own review
      directory and to a scratchpad outside the repository.
    - >-
      `maximum_runs` ON THIS CARD BOUNDS EXECUTIONS OF EXPERIMENT CODE,
      PRODUCER IMPLEMENTATIONS, AND ANYTHING THAT WRITES A RUN RECORD. Your own
      throwaway arithmetic and scratch scripts are NOT runs. This is the
      standing interpretation ruled in DEC-20260904-166ab5 PD-4, stated here
      explicitly instead of left to be inferred. This batch authorizes zero new
      experiment runs and you may not execute cost_model.py at all.
    - >-
      READ-ONLY on experiments/ and inputs/. Do not edit, move, regenerate,
      reformat, rerun, or stage anything there, and verify and state that no
      file under experiments/ or inputs/ was modified by this batch.
    - >-
      Do not repair, complete, or rewrite any producer artifact. Do not change
      any status, write any ledger record, or commit anything.
    - >-
      Record at least one concrete objection per owned joint, or state for that
      joint that you searched for one and found none, and exactly how you
      searched. A joint answered by restating the producer is an uncovered
      joint.
    - >-
      An `undetermined` composed verdict is a RESULT, not an incomplete task.
      Review it as one: the question is whether the undetermination is honestly
      grounded in what Section 4.1 says, not whether the producer should have
      tried harder to reach a verdict.
    - >-
      Restate the citation prohibition and its predicate extension verbatim, do
      not lift either, and state whether either fired on this package. You may
      RECOMMEND lifting or retaining with conditions; a recommendation is not a
      decision, and only a committed Coordinator decision decides.
    - >-
      Make no security, SQIsign, CSIDH, standardized-parameter, exponent, or
      asymptotic-complexity claim in either direction, and construct no attack.
    - >-
      A timeout, crash, missing dependency, or exhausted budget is an
      operational observation and never mathematical evidence.
    - >-
      Never select a provider, backend, endpoint, or model identifier containing
      Bedrock, case-insensitively.
  deliverables:
    - >-
      validation_report.yaml: a parseable YAML document carrying a per-joint
      verdict from CONFIRMED, CONFIRMED WITH CAVEAT, or REFUTED for each of J1,
      J2, J3 and J4; a per-deliverable table over the producer's six artifacts;
      the concrete objection or the recorded failed search per joint; the inputs
      you fed to each producer control and what its own code did on them; your
      independent recomputation of RC-2 with the key paths you read; an explicit
      limitations list including whether your review is model-independent; and a
      top-level `review_attestation` block.
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/reviews/TASK-20260904-82665d/validation_report.yaml
  read_scope:
    - AGENTS.md
    - agents/validator.md
    - docs/claims-and-verification.md
    - docs/task-lifecycle.md
    - templates/research-records.md
    - inputs/P13-WESOLOWSKI-2026
    - experiments/EXP-WESOVOW-001
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/batch.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/dispatch_queue.json
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/archives
    - ledger/decisions/DEC-20260904-166ab5.yaml
    - ledger/evidence/EV-SSI-5d954c.yaml
  read_scope_note: >-
    `coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/reviews` is
    DELIBERATELY ABSENT. The sibling red-team report will live there and you are
    blind from it. Your own report is written into your own review directory,
    which is your write_scope, not your read_scope.
  write_scope:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/reviews/TASK-20260904-82665d
  archived_by: TASK-20260904-cb8d1d
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 3600
    memory_gb: 2
    maximum_runs: 3
  completion_gate:
    - Each of J1, J2, J3 and J4 carries its own verdict and its own recorded attack, and none is answered only by restating the producer.
    - The whole of Section 4.1 was read independently, and the search for a second or disagreeing statement of any of the ten quantities is reported with its outcome either way.
    - Every producer control was called on an input you constructed, and the report records what the producer's own code did on that input.
    - Every value marked `faithful` was checked for a hidden derivation, and every value marked `undetermined` was checked for a masked mismatch.
    - RC-2 is independently recomputed from the two committed sources, with the exact key paths named.
    - Frozen-artifact immutability is checked and stated, and cost_model.py was never executed.
    - The report is a YAML file that yaml.safe_load parses, with a top-level review_attestation listing the four joint names verbatim, read_sibling_reports false, and a verdict of holds, breaks, or inconclusive.
    - The citation prohibition and its predicate extension are restated verbatim, neither is lifted, any recommendation is marked as not a decision, and no security, parameter, exponent, or asymptotic claim is made.
  return_format: >-
    A short report in the final message naming each joint's verdict, the single
    most consequential objection you found, and every limitation. Findings live
    in the artifact; a result that exists only in a message did not happen.

citation_prohibition_verbatim: >-
  The `P=512` crossover value and its `w=2^80` sign are **NOT
  citation-eligible**. This task does not lift that prohibition. Only a
  committed Coordinator decision on independently reviewed evidence can lift it.

citation_prohibition_predicate_extension_verbatim: >-
  In addition to the retained sentence, a row of any EXP-WESOVOW-001
  reconciliation is NOT citation-eligible when either (a) the two anchors
  disagree in the SIGN of the baseline comparison at that row, or (b) the
  smaller |margin| across the two anchors at that row is below that field size's
  anchor gap |Delta log2 T_full + Delta log2 M / 2|.
