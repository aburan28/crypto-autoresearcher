protocol_notes:
  - id: PN-1
    note: >-
      ledger/evidence/EV-SSI-5d954c.yaml is inside this task's read_scope and was
      DELIBERATELY NOT OPENED before the RC-1 verdict was frozen, and has not
      been opened at all. It records the five signed paper-minus-attained-minimum
      deltas, from which the ten literals are recoverable by arithmetic against
      the committed run, and reading it would have anchored the transcription on
      the answer. This is a self-imposed tightening of the declared scope, not a
      deviation from it, and it is recorded so a reviewer knows the omission was
      chosen rather than accidental. The 0.18-3.22 bit figure used by VC-2 was
      taken from the task card, which states it, not from that record.
  - id: PN-2
    note: >-
      One computed claim inside controls_report.yaml was corrected before
      delivery: the minimum displacement of VC-1 decoy object (ii) was first
      written as 45.7 bits and is 24.7 bits (attained at log2 p = 576 memory).
      The correction was verified by an explicit computation over all ten
      permuted assignments. No verdict depended on it - both figures exceed the
      0.05 bit tolerance by three orders of magnitude - and it is recorded rather
      than silently absorbed.
