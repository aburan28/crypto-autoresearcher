divergence_finding:
  id: DIV-1
  raised_by: executor, TASK-20260904-d66403
  what: >-
    The adapter's configured binding for `executor-implementation` resolves to
    `anthropic:claude-sonnet-5`, while this session self-reports as
    `claude-opus-5`. The two do not agree.
  what_it_is_not: >-
    NOT a fallback and NOT a degradation performed by this task. This session did
    not select, substitute, or alter its own model, which core rule 11 forbids;
    it was launched with whatever the harness launched it with, and the
    divergence is between the ADAPTER CONFIGURATION and the SESSION, not between
    a request and a response inside this task.
  why_it_cannot_be_resolved_here: >-
    `doctor --probe` verifies no backend in this environment, so there is no
    instrument available to this task that could establish which identity
    actually served the tokens. Recording both, labelled, is the only honest
    option; asserting either as verified would be recording a probe that was not
    performed.
  asserts_nothing_about: >-
    The science. This is an operational observation about inference provenance
    and is not evidence about the paper, the cost model, or any isogeny problem.
  suggested_recheck: >-
    `python3 -m orchestration.adapter doctor --probe` once a backend credential
    is available in the executing environment.

