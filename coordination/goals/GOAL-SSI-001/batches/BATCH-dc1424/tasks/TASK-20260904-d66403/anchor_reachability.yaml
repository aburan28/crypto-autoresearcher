  not_attempted: []
  sign_pattern: mixed (three negative, two positive)

what_reachability_establishes:
  - >-
    At log2 p in {256, 384, 512} the PAPER_PAIRS time literal is STRICTLY BELOW
    the smallest log2 T_full this cost model attains on the grid its own frozen
    contract declares. It is therefore NOT A VALUE OF THIS FUNCTION ON THIS GRID,
    and no choice of log2 B in [1.0, 60.0] at step 0.1 under this model's Dickman
    rho reproduces it.
  - >-
    At log2 p in {576, 768} the anchor time lies at or above the attained minimum,
    so it is not excluded on this ground. That is strictly weaker than saying the
    grid attains it: a value above the minimum lies in the model's range, but this
    control did not search the grid for a log2 B that produces it.

what_reachability_does_NOT_establish:
  - >-
    IT DOES NOT MEAN THE PAPER IS WRONG. `off_curve` is a statement about THIS
    MODEL ON THIS GRID and carries no assertion about the published result.
  - >-
    IT DOES NOT MEAN THE LITERAL IS WRONG. RC-1, frozen before this artifact was
    computed, found all ten literals faithful to the frozen document at all ten
    values with signed difference 0.0.
  - >-
    IT DOES NOT MEAN THE MODEL IS WRONG.
  - >-
    ENUMERATED ALTERNATIVE EXPLANATIONS OF `off_curve`, none of which this
    artifact's language forecloses and none of which it tests: (1) the paper
    optimized B over a continuum or a different range while this grid is
    [1.0, 60.0] at step 0.1, so the paper's optimal B may not be a grid point or
    may lie outside the range; (2) the paper's rho, P0 = u^{-u} evaluation, or
    rounding differs from this model's tabulated Dickman rho and linear log2
    interpolation; (3) the paper's numbers are LOWER BOUNDS from a deliberate
    underestimation (paper_fulltext.md lines 226, 230, 240), and a lower bound
    lying below a model's minimum is exactly what a lower bound is entitled to
    do - this is the leading explanation on the face of the source and it makes
    `off_curve` at three field sizes UNSURPRISING rather than anomalous;
    (4) the model's constraints w >= 1, u >= 1 may exclude the paper's operating
    point; (5) the unit of cost may differ in a way not visible in the digits.
  - >-
    IT SETTLES NOTHING ABOUT WHICH ANCHOR TO CITE. That is a Coordinator
    decision, and this task neither makes it nor recommends it. What this
    artifact supplies is one input to it: at three of five field sizes the two
    anchors CANNOT both be minima of this function on this grid, so treating
    them as two estimates of one quantity is not supported at those field sizes.
  - >-
    IT MAKES NO SECURITY, SQIsign, CSIDH, STANDARDIZED-PARAMETER, EXPONENT, OR
    ASYMPTOTIC-COMPLEXITY CLAIM in any direction.

over_reading_risk:
  named_sentence: >-
    "the PAPER_PAIRS time literal is STRICTLY BELOW the smallest log2 T_full this
    cost model attains".
  shortest_over_reading_path: >-
    A later reader drops the qualifier `this cost model attains`, reads `below
    the minimum` as `impossible`, and cites the row as evidence that the paper's
    cost estimate is unattainable - i.e. as a security claim about SQIsign
    NIST-I/III/V parameters. THAT INFERENCE IS NOT LICENSED. The qualifier is
    load-bearing in every sentence of this artifact and alternative explanation
    (3) above is sufficient on its own to account for all three `off_curve` rows.
