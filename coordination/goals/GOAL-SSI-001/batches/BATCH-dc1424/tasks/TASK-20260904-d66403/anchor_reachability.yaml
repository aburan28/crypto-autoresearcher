citation_prohibition_verbatim: >-
  The `P=512` crossover value and its `w=2^80` sign are **NOT
  citation-eligible**. This task does not lift that prohibition. Only a
  committed Coordinator decision on independently reviewed evidence can lift it.
citation_prohibition_predicate_extension_verbatim: >-
  In addition to the retained sentence, a row of any EXP-WESOVOW-001
  reconciliation is NOT citation-eligible when either (a) the two anchors
  disagree in the SIGN of the baseline comparison at that row, or (b) the
  smaller |margin| across the two anchors at that row is below that field size's
  anchor gap |Delta log2 T_full + Delta log2 M / 2|.
citation_prohibition_application_to_this_artifact:
  reasoned_not_assumed: >-
    This artifact is the one in the package most exposed to the prohibition,
    because it does compute a signed difference at log2 p = 512 and a careless
    reader could take that for a margin. It is not one, and the two limbs are
    applied explicitly below rather than waved off.
  retained_sentence_fired: false
  retained_sentence_reasoning: >-
    The retained sentence covers the `P=512` CROSSOVER value and its `w = 2^80`
    SIGN. This artifact computes no crossover: a crossover is the memory budget
    or parameter at which this model's cost meets a baseline's, and no baseline
    appears anywhere here. It restates no `w` value at all - the memory-budget
    axis MEMORY_BUDGETS (cost_model.py:66) is not read by this artifact - and so
    restates no `w = 2^80` sign.
  predicate_extension_fired: false
  predicate_extension_limb_a: >-
    NOT FIRED. Limb (a) requires the two anchors to disagree in the SIGN OF THE
    BASELINE COMPARISON at a row. This artifact performs no baseline comparison.
    The signed difference it reports is anchor time MINUS THIS MODEL'S OWN
    ATTAINED MINIMUM, an internal self-comparison; neither baseline_log2TDG nor
    van_oorschot_wiener nor crossover was read from raw-result.json, and the
    key paths actually read are recorded below.
  predicate_extension_limb_b: >-
    NOT FIRED. Limb (b) requires a |margin| across two anchors to be compared
    against a field size's anchor gap. This artifact computes no margin and no
    speedup, so there is no |margin| term to evaluate, and it computes no
    Delta log2 M, so the anchor gap |Delta log2 T_full + Delta log2 M / 2| is not
    formed here either.
  neither_is_lifted: >-
    Neither is lifted. This task holds no authority to lift either, and does not
    recommend lifting or retaining - that is a Coordinator decision on
    independently reviewed evidence.
  standing_flag_warning_carried_forward: >-
    BATCH-dc1424 batch.yaml records that anchor_reconciliation.json's per-row
    `citation_prohibited` flag is KNOWN TO UNDER-REPORT, with at least two rows
    at log2 p = 256 carrying `citation_prohibited: false` that fall under the
    predicate. This artifact produces no successor to that file, does not repair
    the flag, and does not read it.

method:
  rule: >-
    Pre-declared: verdict `reachable` when anchor_time >= attained_minimum,
    `off_curve` when anchor_time < attained_minimum.
  anchor_time_source:
    path: experiments/EXP-WESOVOW-001/cost_model.py
    lines: 61-65
    detail: >-
      PAPER_PAIRS[<log2p>][0], the log2 time element. Read AS TEXT by
      check_literals.py `read_committed_literals()` via regex. cost_model.py was
      NEVER executed, with or without WESOVOW_RAW_PATH set (BATCH-dc1424
      frozen_artifact_ruling; hazard O7/R2).
  attained_minimum_source:
    path: experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-001/raw-result.json
    exact_key_path: "per_field['log2p=<N>']['optimal']['log2T']"
    all_five_keys_present: true
    keys_read:
      - "per_field['log2p=256']['optimal']['log2T']"
      - "per_field['log2p=384']['optimal']['log2T']"
      - "per_field['log2p=512']['optimal']['log2T']"
      - "per_field['log2p=576']['optimal']['log2T']"
      - "per_field['log2p=768']['optimal']['log2T']"
    nothing_recomputed: >-
      The optimizer was not rerun, Dickman rho was not re-derived, and
      cost_model.py was not run. Every model number below is a committed number
      read by key path.
  why_the_attained_minimum_is_a_minimum: >-
    experiments/EXP-WESOVOW-001/specification.yaml model_definition.optimizer
    declares variable log2(B), grid log2(B) in [1.0, 60.0] step 0.1, objective
    `minimize log2(T_full)`, constraints w >= 1, u >= 1, w within Dickman grid
    range. per_field[*].optimal.log2T is therefore by the contract's own
    declaration the smallest log2 T_full this model attains ON THAT GRID under
    those constraints.

