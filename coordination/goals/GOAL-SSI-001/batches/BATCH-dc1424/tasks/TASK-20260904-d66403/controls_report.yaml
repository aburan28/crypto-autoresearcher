all_controls_were_executed: >-
  Every result below is the OBSERVED output of check_literals.py on the stated
  input, not an assertion about what the code would do. Reproduce with
  `python3 check_literals.py` from this directory; it takes under a second, uses
  the standard library only, and writes nothing.

citation_prohibition_verbatim: >-
  The `P=512` crossover value and its `w=2^80` sign are **NOT
  citation-eligible**. This task does not lift that prohibition. Only a
  committed Coordinator decision on independently reviewed evidence can lift it.
citation_prohibition_predicate_extension_verbatim: >-
  In addition to the retained sentence, a row of any EXP-WESOVOW-001
  reconciliation is NOT citation-eligible when either (a) the two anchors
  disagree in the SIGN of the baseline comparison at that row, or (b) the
  smaller |margin| across the two anchors at that row is below that field size's
  anchor gap |Delta log2 T_full + Delta log2 M / 2|.
citation_prohibition_application_to_this_artifact:
  retained_sentence_fired: false
  retained_sentence_reasoning: >-
    No crossover value and no `w = 2^80` sign is computed or restated here. The
    only log2 p = 512 numbers appearing are RC-2's anchor time, attained minimum
    and their internal signed difference, which are model inputs and an internal
    self-comparison.
  predicate_extension_fired: false
  predicate_extension_reasoning: >-
    Limb (a) needs a baseline-comparison SIGN; no baseline comparison is
    performed by any control here. Limb (b) needs a |margin| against a baseline;
    none is computed, so no anchor gap is formed.
  neither_is_lifted: true

# ---------------------------------------------------------------------------
controls:

  VC-0:
    name: locator completeness and quotation integrity
    what_it_tests: >-
      That all ten numbers carry a locator or a recorded failed search; that each
      recorded quoted_text is ACTUALLY the text at its recorded line range in
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md (re-read from the file, not
      trusted); and that for every `direct` value the quoted_text contains the
      number attributed to it, as the token `2^<value>`.
    implemented_by: check_literals.py `vc0_locator_completeness(loc, paper_path)`
    run_on_real_input:
      input: the committed locator_table.json, checked against the real paper file
      observed: {"entries_checked": 10, "passed": true, "problems": []}
      verdict: PASS
    concrete_input_that_makes_it_fail:
      description: >-
        A deep copy of locator_table.json in which the quoted_text of entry
        `log2p=256|log2_time` is replaced by the quoted_text of entry
        `log2p=384|log2_time` - i.e. the log2 p = 384 bullet filed under the
        log2 p = 256 row. This is a REAL failure mode, not a hypothetical: it is
        exactly what a hurried locator search over five near-identical bullets
        returns, and review joint J1 names it.
      constructed_by: check_literals.py `main()`, the `mutated` block
      observed: >-
        {"passed": false, "problems": ["log2p=256|log2_time: quoted_text is not
        the text at inputs/P13-WESOLOWSKI-2026/paper_fulltext.md:234-234"]}
      verdict: THE CONTROL FIRED, on the first of its two failure clauses.
    is_the_pass_entailed_by_its_own_construction: >-
      NO. VC-0 re-reads the paper file at each recorded line range and compares
      against the recorded text, so it can and does fail on a real input; the
      failure was exercised above and produced a specific, correct problem
      string. Its pass therefore carries information: the ten quotations are the
      text at the lines claimed.
    what_its_pass_does_NOT_establish: >-
      That the quoted bullet attributes the number to the right QUANTITY. VC-0
      checks the token `2^<value>` occurs in the line; each bullet at lines
      234-238 contains three such tokens (time, memory, and the `previous
      methods` baseline), so a time/memory swap WITHIN one bullet would pass
      VC-0. That check is a human reading, recorded in locator_table.json
      comparison_form_reason, and is assigned to review joint J1. Disclosed as a
      real gap in this control rather than papered over.

  VC-1:
    name: decoy rejection (proves-too-much on the producer's own procedure)
    what_it_tests: >-
      Whether the SAME procedure that returned `literals_faithful` on the
      committed set also returns `literals_faithful` on any of four sets for
      which that conclusion is known false.
    implemented_by: check_literals.py `vc1_decoy_rejection(lits, ptable)`
    committed_set_result: literals_faithful
    run_on_each_decoy:
      i_shift_plus_0.30:
        input: every one of the ten committed numbers + 0.30 bits
        observed: {composed: literals_mis_transcribed, n_mis_transcribed: 10, n_faithful: 0}
      ii_cyclic_permutation:
        input: 256's pair -> 384, 384's -> 512, 512's -> 576, 576's -> 768, 768's -> 256
        observed: {composed: literals_mis_transcribed, n_mis_transcribed: 10, n_faithful: 0}
      iii_null_object:
        input: (log2 p / 2, 0.0) at every field size
        observed: {composed: literals_mis_transcribed, n_mis_transcribed: 10, n_faithful: 0}
      iv_unit_object_memory_plus_6.0:
        input: the committed memory values + 6.0 bits (per 64-byte entry rather than per entry)
        observed: {composed: literals_mis_transcribed, n_mis_transcribed: 5, n_faithful: 5}
        note: >-
          The five faithful values are the five TIME values, which this object
          leaves untouched. All five MEMORY values were rejected.
    decoys_returning_faithful: []
    self_contradiction_detected: false
    verdict: PASS - no decoy returned `literals_faithful`.
    is_the_pass_entailed_by_its_own_construction: >-
      YES, ARITHMETICALLY, AND THIS IS THE MOST IMPORTANT LINE IN THIS FILE.
      All ten committed literals match their paper values with signed difference
      EXACTLY 0.0, and the pre-registered tolerance is 0.05 bits. Every one of
      the four decoys displaces at least one value by at least 0.30 bits (object
      i by 0.30; object ii by at least 24.7 bits, the minimum over all ten
      permuted assignments, attained at log2 p = 576 memory; object iii by more than 20 bits everywhere; object iv
      by 6.0 bits on all five memory values). 0.30 > 0.05, so REJECTION OF EVERY
      DECOY FOLLOWS FROM ARITHMETIC ALONE ONCE THE COMMITTED SET MATCHES
      EXACTLY. The control could not have come out any other way, and its pass
      is therefore NOT evidence that the procedure is discriminating. Reporting
      four rejections as robustness would be precisely the defect
      DEC-20260904-166ab5 refuted in the previous round, and it is not claimed
      here.
    what_the_control_DID_establish_non_trivially: >-
      One thing only, and it comes from the separate non-constancy probe below
      rather than from the four decoys: the procedure is NOT a constant rejector.
      A procedure that returned `literals_mis_transcribed` on every input would
      have passed VC-1 exactly as written while carrying no information at all,
      and joint J3 names that hole. The probe closes it.
    non_constancy_probe:
      status: NOT one of the four declared decoys; an additional probe, labelled so it cannot be miscounted as one.
      implemented_by: check_literals.py `vc1_non_constancy_probe(lits, ptable, delta=0.02)`
      input: every one of the ten committed numbers + 0.02 bits, i.e. a displacement BELOW the pre-registered tolerance of 0.05
      observed: {composed: literals_faithful, procedure_is_constant_rejector: false}
      reading: >-
        The procedure ACCEPTS a set that differs from the committed one by less
        than its tolerance and REJECTS every set that differs by more. It is
        applying its declared tolerance rather than rejecting or accepting
        everything. That, and not the four rejections, is what VC-1 bought.
    unit_blindness_disclosure: >-
      Object iv was rejected because +6.0 bits exceeds the tolerance - by
      MAGNITUDE, not by any unit check. check_literals.py contains NO unit
      checking whatsoever. The only guard against a unit mismatch in this package
      is the `comparison_form` judgement recorded per entry in
      locator_table.json, which is a human reading of Section 4.1 and is not
      code. A unit error that preserved magnitude would pass every control in
      this file undetected.

  VC-2:
    name: discrimination at the scale this campaign cares about
    what_it_tests: >-
      Per value, the smallest delta in {0.5, 0.2, 0.1, 0.05, 0.02} bits at which
      the procedure still returns `mis_transcribed` for that value. The campaign's
      disputed quantities sit at 0.18-3.22 bits (EV-SSI-5d954c, by locator; the
      values themselves are not restated).
    implemented_by: check_literals.py `vc2_resolution(lits, ptable, ladder)`
    fails_if: any value whose comparison_form is `direct` cannot be distinguished at delta = 0.2 bits
    observed_values_blind_at_0.2_bits: []
    verdict: PASS
    measured_resolution_per_value:
      note: >-
        Reported per value as required, not as a single headline number. Column
        is `smallest delta in the ladder still returning mis_transcribed`.
      log2p=256|log2_time: 0.1
      log2p=256|log2_memory: 0.1
      log2p=384|log2_time: 0.05
      log2p=384|log2_memory: 0.05
      log2p=512|log2_time: 0.05
      log2p=512|log2_memory: 0.05
      log2p=576|log2_time: 0.05
      log2p=576|log2_memory: 0.05
      log2p=768|log2_time: 0.05
      log2p=768|log2_memory: 0.05
    the_0.05_asymmetry_is_a_float_artifact_and_is_disclosed: >-
      Eight of ten values resolve 0.05 bits and two - both at log2 p = 256 -
      resolve only 0.1. This is NOT a property of those two values: delta = 0.05
      lands exactly on the `<=` boundary of the pre-registered tolerance, so its
      verdict is decided by IEEE-754 rounding. 106.5 + 0.05 - 106.5 evaluates to
      0.049999999999997, which is <= 0.05 and so `faithful`; 138.6 + 0.05 - 138.6
      evaluates to 0.050000000000011, which is > 0.05 and so `mis_transcribed`.
      Recorded as pre-registration objection PO-1 in
      paper_literals_verification.yaml. It affects no verdict in this package,
      because all ten committed differences are exactly 0.0.
    is_the_pass_entailed_by_its_own_construction: >-
      YES. The pre-registered tolerance is 0.05 bits and the failure threshold is
      0.2 bits; since 0.2 > 0.05, a perturbation of 0.2 necessarily exceeds the
      tolerance and necessarily returns `mis_transcribed` at every `direct`
      value. VC-2's PASS/FAIL outcome was fixed the moment the tolerance was
      pre-registered and carries no information about the procedure.
    what_it_nonetheless_measured: >-
      The pass is entailed; the MEASUREMENT is not. What VC-2 actually produced
      is the resolution figure - 0.05-0.1 bits, well below the campaign's
      0.18-3.22 bit dispute range - together with the discovery of the boundary
      asymmetry, which was not predicted and which no other control would have
      surfaced. The coordinator_prior predicted VC-2 would report resolution no
      tighter than 0.5 bits and thereby confirm the previous round's defect. That
      prediction is NOT borne out: the measured resolution is 0.05-0.1 bits.

  RC-2:
    name: anchor reachability
    what_it_tests: >-
      Whether the PAPER_PAIRS time at each field size lies at or above the
      minimum log2 T_full this cost model attains on its own declared optimizer
      grid. Full result in anchor_reachability.yaml.
    implemented_by: check_literals.py `rc2_reachability(anchor_times, attained)`
    run_on_real_input:
      observed: {off_curve: [256, 384, 512], reachable: [576, 768], not_attempted: []}
      verdict: both branches were taken on the real input, without any synthetic help
    failure_direction_a:
      description: feed the control the model's OWN per_field optimal log2T at every field size; every field size must come back `reachable`
      input: "attained[fs] for fs in {256, 384, 512, 576, 768}, read from RUN-WESOVOW-001/raw-result.json per_field['log2p=<N>']['optimal']['log2T']"
      observed: >-
        All five rows `reachable`, signed difference exactly 0.0 at every field
        size. The control does NOT report the model's own optimum as off-curve.
      verdict: PASS
    failure_direction_b:
      description: feed a synthetic anchor set placed 5.0 bits BELOW the attained minimum at every field size; every field size must come back `off_curve`
      input: "attained[fs] - 5.0 for fs in {256, 384, 512, 576, 768}"
      observed: >-
        All five rows `off_curve`, signed difference exactly -5.0 at every field
        size. The control does have a failure branch and takes it.
      verdict: PASS
    both_directions_exercised_on_real_inputs: true
    is_the_pass_entailed_by_its_own_construction: >-
      SUBSTANTIALLY YES, AND THE DISCLOSURE MATTERS. Direction (a) feeds x and
      compares x >= x; direction (b) feeds x - 5.0 and compares x - 5.0 >= x.
      Both outcomes follow from the comparison operator alone. Neither direction
      can distinguish a correct model from an incorrect one, and neither is
      evidence about the RC-2 finding.
      WHAT THEY CAN STILL FAIL ON, which is why they were run rather than
      asserted: a WIRING error. If `rc2_reachability` read the wrong key path,
      mapped field sizes inconsistently between its two arguments, inverted the
      comparison sign, or silently dropped a field size, direction (a) would
      report a nonzero difference or a missing row and direction (b) would report
      `reachable`. Both ran clean, so the control's pass bounds the WIRING of the
      comparison and nothing else. It is reported here as a wiring check, not as
      support for the reachability finding.
    what_an_off_curve_verdict_means_and_does_not_mean: >-
      It means the anchor is not a value of this function on this grid. It does
      NOT by itself mean the paper is wrong, the literal is wrong, or the model
      is wrong. Five alternative explanations are enumerated in
      anchor_reachability.yaml what_reachability_does_NOT_establish, including
      the leading one: the paper states these numbers as LOWER BOUNDS from a
      deliberate underestimation, and a lower bound lying below a model's minimum
      is what a lower bound is entitled to do.

# ---------------------------------------------------------------------------
post_hoc_pressure:
  - id: PHP-1
    what_made_me_want_to_change_the_frozen_verdict: >-
      Reading Section 4.1 in full made clear that all ten values are stated as
      LOWER BOUNDS (`>= 2^x`) inside a section whose own text calls them a `rough
      underestimation` (line 240) and which the introduction calls `tentative
      bounds ... should not be interpreted as accurate predictions` (line 43),
      while PAPER_PAIRS carries them as point values against a two-sided +-0.75
      bit sanity tolerance (cost_model.py:71). RC-2 then returned `off_curve` at
      three of five field sizes, which is exactly what a lower bound should do
      against a model minimum, and that made the composed verdict
      `literals_faithful` feel like it understates the finding.
    what_i_wanted_to_do: >-
      Re-characterize some or all ten values as `undetermined` on the ground that
      a lower bound is not directly comparable to a point value.
    why_i_did_not: >-
      The pre-registered `direct` test is about the QUANTITY AND UNIT, not about
      bound-versus-point-value semantics, and the pre-registered per-value rule
      assigns `faithful` on |paper - literal| <= tolerance. Changing the test
      after seeing the section is exactly the failure this task exists to detect,
      and it requires a versioned protocol_amendment which is not within this
      task's authority.
    where_it_is_recorded_instead: >-
      paper_literals_verification.yaml what_this_does_not_settle NS-2, and
      anchor_reachability.yaml alternative explanation (3). It is recorded as an
      observation with locators and is available to the Coordinator without any
      verdict having moved.
    verdict_changed: false
  - id: PHP-2
    what_made_me_want_to_change_the_frozen_verdict: >-
      The memory form judgement (NS-3). Section 4.1 writes `memory >= 2^92.5`
      with no unit word in the bullet itself, and the unit must be read off three
      earlier sentences. Having seen RC-2, there was pressure to reclassify the
      five memory values as `requires_derivation` so the composed verdict became
      `undetermined`, which the batch's own framing describes as `the most
      informative outcome available here`.
    why_i_did_not: >-
      Two reasons, and the second is the binding one. First, the chain converts
      no number: the paper states `2^92.5` and the model wants log2 of table
      entries, and identifying that the paper's M counts entries requires zero
      arithmetic, so under the pre-registered test it is `direct`. Second, and
      decisively, `undetermined` being the outcome the batch calls most
      informative is a REASON TO DISTRUST THE PULL, not a reason to follow it.
      Straining toward the interesting answer is the same defect as straining
      toward the convenient one.
    where_it_is_recorded_instead: >-
      paper_literals_verification.yaml NS-3, and per entry in
      locator_table.json comparison_form_reason, each of which states explicitly
      that a reviewer judging otherwise flips the composed verdict to
      `undetermined`.
    verdict_changed: false
  - id: PHP-3
    what_made_me_want_to_change_the_frozen_verdict: null
    note: >-
      Nothing in RC-2 or in any control gave any reason to move a value toward
      `mis_transcribed`. All ten signed differences are exactly 0.0.
    verdict_changed: false

controls_summary:
  VC-0: PASS (failure branch exercised on a real mutated input; pass NOT entailed)
  VC-1: PASS (pass IS entailed arithmetically; the informative content is the separate non-constancy probe)
  VC-2: PASS (pass IS entailed by the pre-registered tolerance; the measurement - 0.05-0.1 bit resolution - is not)
  RC-2: PASS in both failure directions (both passes substantially entailed; they bound the comparison's WIRING only)
honest_overall_reading_of_the_control_suite: >-
  Of the four controls, ONE - VC-0 - has a pass that is not entailed by its own
  construction, and it was made to fail on a real input before it was trusted.
  The other three have entailed passes; each is reported as such, with the
  non-entailed measurement it nevertheless produced named separately. The
  package does not claim its control suite corroborates the RC-1 verdict beyond
  that.
