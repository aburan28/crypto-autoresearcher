task_card:
  id: TASK-20260904-d66403
  goal_id: GOAL-SSI-001
  batch_id: BATCH-dc1424
  title: >-
    RC-1: verify the five PAPER_PAIRS literals at cost_model.py:61-65 against
    Section 4.1 of the frozen paper, with a locator for every value, and measure
    PAPER_PAIRS anchor reachability against this model's attained minimum (RC-2)
  role: executor
  state: queued
  review_required: true
  archived_by: TASK-20260904-977d04
  reviewed_by:
    - TASK-20260904-82665d
    - TASK-20260904-c8675d

handoff:
  id: TASK-20260904-d66403
  from: coordinator
  to: executor
  objective: >-
    Determine, value by value and with a locator for each, whether the five
    (log2 time, log2 memory) pairs literalized at
    experiments/EXP-WESOVOW-001/cost_model.py:61-65 are (a) FAITHFUL to Section
    4.1 of inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, (b) MIS-TRANSCRIBED, or
    (c) UNDETERMINED because the paper does not state them in a form directly
    comparable to the cost model's units; and, separately and afterwards,
    measure whether the PAPER_PAIRS time at each field size lies at or above the
    minimum log2 T_full this cost model attains on the contract's own declared
    optimizer grid (RC-2, anchor reachability).
  uncertainty_reduced: >-
    Which of three different worlds the committed fitted_opt / PAPER_PAIRS
    divergence comes from - a transcription defect in a committed
    implementation input, a defect or difference in the cost model, or a
    genuine external disagreement between the paper and this model - and
    whether the two anchors were ever two estimates of one quantity at all.
    Nobody in this program has ever read the source to check. Both reviewers of
    BATCH-256a94 named this the cheapest decisive step in that round, and it
    was not performed there because the paper was outside every declared
    read_scope.
  inputs:
    - inputs/P13-WESOLOWSKI-2026/paper_fulltext.md (the frozen source; Section 4.1 is the target, read-only)
    - inputs/P13-WESOLOWSKI-2026/source_record.yaml (provenance of that document, read-only)
    - experiments/EXP-WESOVOW-001/cost_model.py (read-only; the five literals are at lines 61-65 inside the PAPER_PAIRS mapping opened at line 60)
    - experiments/EXP-WESOVOW-001/specification.yaml (read-only; model_definition.quantities states the units and cites the paper's Section 4.1 formulas, and the optimizer block declares the grid RC-2 needs)
    - experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-001/raw-result.json (read-only; per_field optimal values are the model's attained minimum for RC-2)
    - AGENTS.md, and the frozen_artifact_ruling, citation_prohibition, blind_phase_hygiene and execution_prohibition blocks of BATCH-dc1424/batch.yaml
    - ledger/decisions/DEC-20260904-166ab5.yaml (the decision that ordered this task; its PD-2 and PD-4 rulings bind here)
  constraints:
    - >-
      READ-ONLY, ABSOLUTELY: everything under inputs/P13-WESOLOWSKI-2026/,
      experiments/EXP-WESOVOW-001/specification.yaml,
      experiments/EXP-WESOVOW-001/cost_model.py, and everything under
      experiments/EXP-WESOVOW-001/runs/. Do not edit, move, regenerate,
      reformat, rerun, or stage any of them.
    - >-
      DO NOT EXECUTE cost_model.py, EVER - not to reproduce a value, not to
      check a literal, not with WESOVOW_RAW_PATH set. Its default output path
      names a committed run directory, which is a standing evidence-integrity
      hazard (DEC-20260904-166ab5, O7/R2). Read it as text only.
    - >-
      WRITE ONLY inside
      coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403/
      and produce exactly the six declared artifacts, no seventh. Do not modify
      this task_card.yaml.
    - >-
      WRITE THE PRE-REGISTRATION FIRST, BEFORE OPENING SECTION 4.1. The
      `preregistration` block of paper_literals_verification.yaml - the
      comparison tolerance, the per-value verdict vocabulary, the composition
      rule, and the directly-comparable test - is fixed by this card and is to
      be copied into that file and stated as written before the paper section is
      read. It may not be revised after any paper value is seen. If you believe
      the pre-registration is wrong, record that as a finding under
      `preregistration_objections` and follow it anyway; changing a criterion
      after seeing the outcome requires a versioned protocol_amendment and is
      not within this task's authority.
    - >-
      TOLERANCE, PRE-REGISTERED: a committed literal and a paper-stated value
      agree when |paper - literal| <= 0.05 bits, which is half a unit in the
      last decimal place the committed literals carry. If the paper states a
      value to COARSER precision than that, do not tighten and do not silently
      widen: use half a unit in the PAPER's last stated place, record the
      widened tolerance for that value explicitly in locator_table.json, and
      flag the value as `precision_limited`. If the paper states a value only
      qualitatively ("about 2^106", "roughly"), the value is `undetermined`.
    - >-
      DIRECTLY COMPARABLE, PRE-REGISTERED. A paper value is `direct` only if
      Section 4.1 states it as a number in the same quantity and unit the
      literal carries - log2 of F_{p^2}-operations for time, log2 of TABLE
      ENTRIES for memory. If the paper states memory in bytes, in a different
      entry convention, or as a formula the reader must evaluate, the comparison
      form is `requires_derivation` and the value's verdict is `undetermined`.
      IF YOU PERFORM SUCH A DERIVATION ANYWAY, it is a NEW model computation:
      record it in locator_table.json under `derived_comparison` with the
      derivation written out, and it may NOT become the value's verdict.
      Deriving a number and then reporting it as what the paper says is exactly
      the failure this task exists to detect.
    - >-
      A LOCATOR FOR EVERY VALUE, INCLUDING EVERY ABSENT ONE. Each of the ten
      numbers carries: the file path, a line range in
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, and the verbatim quoted
      sentence, table row, or cell containing it. For a value you could not
      find, record instead the search you performed - the line range of Section
      4.1 you read in full, and the search terms you used - so that `absent` is
      a reported measurement and not an omission.
    - >-
      RC-1 IS THE GATE AND ITS VERDICT IS FROZEN BEFORE RC-2 RUNS. Write and
      finalize paper_literals_verification.yaml and locator_table.json first.
      Only then compute anchor_reachability.yaml. Nothing in RC-2 may alter a
      single per-value verdict or the composed verdict; if RC-2 makes you want
      to, record the wish under `post_hoc_pressure` in controls_report.yaml and
      leave the verdict as written.
    - >-
      RC-2 READS COMMITTED NUMBERS ONLY. Take the model's attained minimum from
      RUN-WESOVOW-001/raw-result.json per_field optimal values by exact key
      path; take the anchor time from the cost_model.py literals. Do not
      recompute the optimizer, do not re-derive Dickman rho, and do not run
      cost_model.py. If a needed key is absent from the committed run, say so
      and report RC-2 as not attempted for that field size; missing data stays
      missing.
    - >-
      EVERY CONTROL NAMES THE CONCRETE INPUT THAT MAKES IT FAIL, AND THAT INPUT
      MUST BE REAL AND REACHABLE. DEC-20260904-166ab5 REFUTED a control of the
      last round for having no reachable failure branch on any real anchor: it
      passed on every possible input, so its pass carried no information. For
      each of VC-0, VC-1, VC-2 and RC-2, state the input, run the control's own
      code on that input, and report what actually happened. If a control turns
      out to be entailed by its own construction, SAY SO and report it as
      carrying no information - that disclosure is worth more than the pass.
    - >-
      check_literals.py must be standalone: Python standard library only, no
      network, no numpy requirement, no SageMath, no imports from experiments/.
      It reads committed inputs read-only and writes only inside this task
      directory. Its controls must be functions with reachable failure branches
      that a reviewer can import and call with its own inputs.
    - >-
      RESTATE THE CITATION PROHIBITION VERBATIM IN EVERY ARTIFACT, together with
      the predicate extension quoted in batch.yaml, and state for each artifact
      which of them you found applicable and why. Do not lift either. Where a
      deliverable would name a prohibited value, a LOCATOR satisfies it
      (DEC-20260904-166ab5 PD-2).
    - >-
      Every number must trace to a committed path and a line or key path.
      Never fabricate commands, outputs, timings, statistics, citations, page
      numbers, or runs. A locator you did not open is a fabrication under
      AGENTS.md rule 9, and it is the specific fabrication this task is most
      exposed to.
    - >-
      A timeout, crash, missing dependency, or exhausted budget is an
      operational observation and never mathematical evidence about the paper,
      the cost model, or any isogeny problem. An `undetermined` verdict is a
      RESULT and is not an operational failure; do not conflate the two, in
      either direction.
    - >-
      Make no security, SQIsign, CSIDH, standardized-parameter, exponent, or
      asymptotic-complexity claim in any direction. Write no ledger or
      scientific record, change no status, and do not commit.
    - >-
      Never select a provider, backend, endpoint, or model identifier containing
      Bedrock, case-insensitively.
  deliverables:
    - paper_literals_verification.yaml
    - locator_table.json
    - check_literals.py
    - controls_report.yaml
    - anchor_reachability.yaml
    - runtime_session_receipt.yaml
  deliverable_contracts:
    paper_literals_verification.yaml: >-
      THE GATING ARTIFACT. A `preregistration` block copied from this card and
      stated to have been written before Section 4.1 was opened; the section
      boundary you identified in the paper with its line range and heading text;
      a per-value verdict table over all ten numbers, each `faithful |
      mis_transcribed | undetermined` with its comparison form and locator; the
      composed verdict, computed by the pre-registered rule and shown being
      applied; and a `what_this_does_not_settle` list. If the composed verdict
      is `undetermined`, state plainly that this is a result about the anchor
      and not a failure of the task.
    locator_table.json: >-
      Machine-readable, ten entries, one per number, keyed by (log2p, quantity)
      with quantity in {log2_time, log2_memory}. Each entry carries:
      committed_literal_source (path and line), committed_literal_locator_only
      (do NOT restate the value in any control-plane file, but DO record it
      here - this is the producer's own artifact, not a control-plane file),
      paper_value (or null), paper_locator {path, line_start, line_end,
      quoted_text}, comparison_form {direct | requires_derivation | absent},
      tolerance_applied, tolerance_widened_reason (or null), derived_comparison
      (or null), verdict, and note.
    check_literals.py: >-
      Standalone. Loads locator_table.json and the committed literals, applies
      the pre-registered tolerance and composition rule, and implements VC-0,
      VC-1, VC-2 and RC-2 as separate functions with reachable failure branches.
      No import from experiments/, no execution of cost_model.py, no network.
    controls_report.yaml: >-
      VC-0, VC-1, VC-2 and RC-2, each with: what it tests, the CONCRETE input
      that makes it fail, the observed result on that input, the verdict, and an
      explicit statement of whether its pass is entailed by its own
      construction. Plus `post_hoc_pressure`: anything RC-2 or a control made
      you want to change about the frozen RC-1 verdict, recorded and not acted
      on.
    anchor_reachability.yaml: >-
      RC-2. For each of the five field sizes: the committed PAPER_PAIRS time by
      locator, the model's attained minimum log2 T_full from
      RUN-WESOVOW-001/raw-result.json by exact key path, their signed
      difference, and the verdict `reachable` (anchor time >= attained minimum)
      or `off_curve` (anchor time < attained minimum, i.e. below a declared
      minimum and therefore not a value of this function on this grid). Plus an
      explicit statement of what reachability does and does not establish about
      which anchor to cite, and an explicit application of the citation
      predicate showing why it does or does not fire on this artifact.
    runtime_session_receipt.yaml: >-
      Inference provenance, so it is determinable from committed state rather
      than from prose. Record requested_policy, reasoning_effort, backend,
      resolved_model_id, model_verified, fallback_used, degraded_requirements,
      and the exact command you ran to obtain them (for example `python3 -m
      orchestration.adapter resolve --role executor`) with its output. IF YOU
      RAN NO SUCH COMMAND, record model_verified: false and
      resolved_model_id_self_reported, and say plainly that no probe was run.
      Never record a probe you did not perform.
  controls:
    VC-0: >-
      LOCATOR COMPLETENESS AND QUOTATION INTEGRITY. Every one of the ten numbers
      has a locator, and for every value whose comparison_form is `direct`, the
      quoted_text at the recorded line range actually contains the recorded
      paper_value. FAILS ON: any entry whose quoted_text does not contain the
      number attributed to it, or any entry with neither a paper locator nor a
      recorded search that failed. This is reachable by construction and its
      failure branch is exercised by VC-1 below.
    VC-1: >-
      DECOY REJECTION (proves-too-much on your own procedure). Build four decoy
      literal sets and run the SAME comparison procedure on each: (i) the
      committed literals with every one of the ten numbers shifted by +0.30
      bits; (ii) the committed pairs cyclically permuted across field sizes
      (256's pair assigned to 384, 384's to 512, ..., 768's to 256); (iii) a
      null set assigning (log2 p / 2, 0.0) at every field size - a memory of 2^0
      entries contradicts the paper's own M = Psi(X,B)*X, so "these are Section
      4.1's pairs" is known false; (iv) the committed memory values shifted by
      +6.0 bits, i.e. the same quantity expressed per 64-byte entry rather than
      per entry. FAILS ON: any decoy set for which the procedure returns
      `literals_faithful`. At most one of {committed set, decoy set (i)} can be
      faithful, and likewise for (ii), so a `faithful` on both is a
      contradiction the procedure produced and its verdict on the real literals
      then carries no information. Report that plainly if it happens rather than
      treating rejection of the other decoys as robustness.
    VC-2: >-
      DISCRIMINATION AT THE SCALE THIS CAMPAIGN CARES ABOUT. The quantities in
      dispute in this campaign sit at 0.18-3.22 bits (EV-SSI-5d954c, values by
      locator). Perturb each committed literal by delta in {0.5, 0.2, 0.1, 0.05,
      0.02} bits and report the smallest delta at which the procedure still
      returns `mis_transcribed` for that value. FAILS IF the procedure cannot
      distinguish delta = 0.2 bits at any value whose comparison_form is
      `direct` - a procedure blind at that scale is blind to everything this
      round is about, and its agreement elsewhere bounds nothing. Report the
      measured resolution per value, not a single headline number.
    RC-2: >-
      ANCHOR REACHABILITY, THE CONTROL NO EXISTING ARTIFACT PROVIDES. The
      contract declares the optimizer's objective as minimizing log2(T_full)
      over log2 B in [1.0, 60.0], so per_field[*].optimal.log2T is by definition
      the smallest log2 T_full this model attains. Compare each anchor's time
      against it. FAILS IN TWO DIRECTIONS, AND BOTH MUST BE EXERCISED ON REAL
      INPUTS: (a) feed the control the model's OWN per_field optimal pairs -
      every field size must come back `reachable`; a control that reports the
      model's own optimum as off-curve is broken; (b) feed it a synthetic anchor
      set placed 5.0 bits BELOW the attained minimum at every field size - every
      field size must come back `off_curve`; a control that reports those as
      reachable has no failure branch. Report both runs. Then state, without
      inferring beyond it, what an `off_curve` verdict does and does not mean:
      it means the anchor is not a value of this function on this grid, and it
      does NOT by itself mean the paper is wrong, the literal is wrong, or the
      model is wrong.
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403/paper_literals_verification.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403/locator_table.json
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403/check_literals.py
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403/controls_report.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403/anchor_reachability.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403/runtime_session_receipt.yaml
  read_scope:
    - AGENTS.md
    - CLAUDE.md
    - docs/claims-and-verification.md
    - inputs/P13-WESOLOWSKI-2026
    - experiments/EXP-WESOVOW-001
    - ledger/decisions/DEC-20260904-166ab5.yaml
    - ledger/evidence/EV-SSI-5d954c.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424
  write_scope:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403
  archived_by: TASK-20260904-977d04
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 2
    maximum_runs: 6
  completion_gate:
    - All six artifacts exist at their exact declared paths and nothing else was written.
    - No file under experiments/ or inputs/ was modified, moved, staged, or executed, and cost_model.py was never run.
    - The preregistration block is present, matches this card, and is stated to have been written before Section 4.1 was opened.
    - All ten numbers carry a verdict from exactly {faithful, mis_transcribed, undetermined}, each with a locator or a recorded failed search, and each with its comparison_form.
    - The composed verdict is computed by the pre-registered rule and the rule is shown being applied.
    - Any derivation performed to make a paper value comparable appears under derived_comparison and is NOT used as a verdict.
    - VC-0, VC-1, VC-2 and RC-2 each carry a verdict, the concrete failing input, the observed result on that input, and an entailment disclosure.
    - RC-2 exercises both failure directions on real inputs and reports both.
    - anchor_reachability.yaml was produced after the RC-1 verdict was final, and no RC-1 verdict changed after it.
    - The citation prohibition and its predicate extension are restated verbatim in every artifact, neither is lifted, and each artifact states whether either fired.
    - runtime_session_receipt.yaml records inference provenance and records no probe that was not run.
    - No ledger or scientific record was written, no status was changed, and nothing was committed.
  return_format: >-
    A short task report in the final message naming the composed RC-1 verdict,
    the per-value verdict counts, each control verdict, the RC-2 per-field
    reachability verdicts, and every limitation. Findings live in the artifacts;
    a result that exists only in a message did not happen.
  review_plan:
    claim_under_review: >-
      The package produced by TASK-20260904-d66403, as that task states it in
      its own artifacts: the per-value and composed RC-1 verdict on whether the
      five (log2 time, log2 memory) pairs literalized at
      experiments/EXP-WESOVOW-001/cost_model.py:61-65 are faithful to Section
      4.1 of inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, are mis-transcribed,
      or are undetermined for want of a directly comparable statement; and the
      RC-2 finding on whether the PAPER_PAIRS time is reachable by this cost
      model at each field size.
    coordinator_prior: >-
      Recorded before any task of this batch runs. I HAVE NOT READ SECTION 4.1
      and will not; this prior rests only on committed artifacts of BATCH-256a94
      and on the structure of the problem. (1) I expect the composed verdict to
      be `literals_faithful`, at perhaps half my belief, on the ground that the
      Red Team of BATCH-256a94 independently reproduced the fitted_opt anchor
      from the frozen contract with an independent Dickman rho to <= 2.5e-4
      bits, so the model side is reproducible and the residual divergence is
      more likely to live in the source's own optimization than in an
      arithmetic error here; and on the ground that the five signed
      paper-minus-attained-minimum deltas recorded in EV-SSI-5d954c (values
      deliberately not restated here - see batch.yaml blind_phase_hygiene) are
      small and of MIXED sign, which is the signature of a slightly different
      optimization or of rounding in the source, not of a typo, which is usually
      large and isolated. (2) I give roughly a third of my belief to
      `undetermined`, on a specific and checkable ground: Section 4.1 may state
      the pairs in a form that is not directly comparable - memory in bytes or
      in a different entry convention, or a formula to evaluate rather than a
      tabulated number. If that is what the section holds, the honest verdict is
      `undetermined` and the round's real finding is that PAPER_PAIRS was never
      a transcription of stated values, so the two anchors were never two
      estimates of one quantity and the whole reconciliation framing of
      BATCH-eb0a7e and BATCH-256a94 was mis-posed. That would be the most
      informative outcome available here. (3) I give the remainder to
      `literals_mis_transcribed`, and I name where I would look first WITHOUT
      naming it: the field size carrying the largest-magnitude delta in
      EV-SSI-5d954c, which I withhold here so the blind re-transcription is
      uncontaminated and which resolves uniquely against that immutable record.
      (4) On RC-2 I expect `off_curve` at three field sizes and `reachable` at
      two, reproducing EV-SSI-5d954c's recorded pattern from the committed
      literals; a DISAGREEMENT with that pattern would be the most informative
      thing RC-2 can produce, because it would mean one of the two computations
      of the same committed numbers is wrong. (5) I expect the controls to be
      the weak point again, and I name the specific failure I predict: a decoy
      perturbation chosen large enough to be rejected trivially, leaving the
      procedure's resolution unbounded at the 0.18-3.22 bit scale that this
      campaign actually cares about. VC-2 exists because I expect that, and a
      VC-2 that reports resolution no tighter than 0.5 bits confirms it. (6) I
      expect the Red Team's blind re-transcription to AGREE with the producer on
      any value whose comparison_form is `direct`, and I expect the informative
      disagreement, if there is one, to be about FORM rather than about digits -
      one agent judging a value directly comparable and the other judging it to
      require a derivation. The findings that would most inform this program are
      the ones that overturn this prior: a demonstrated mis-transcription at any
      field size, an `undetermined` grounded in what the section actually says,
      or a demonstration that the reachability comparison is itself ill-posed
      because the paper's memory unit is not the model's.
    joints:
      - joint: J1 locator fidelity of the paper-side transcription
        assigned_to: TASK-20260904-82665d
        attack_plan: >-
          Do not accept the producer's quotations. Open
          inputs/P13-WESOLOWSKI-2026/paper_fulltext.md at every recorded line
          range yourself and check three things per entry: that the quoted_text
          is actually at those lines; that the quoted_text contains the number
          attributed to it; and that the recorded number is the one the
          surrounding sentence attributes to that field size and that quantity
          rather than to a neighbouring one. Then go the other way: read the
          whole of Section 4.1 yourself and look for a SECOND statement of any
          of the ten quantities elsewhere in the section - a table beside a
          sentence, an example, a footnote - that the producer did not cite and
          that disagrees with the one it did. Where I think this breaks: a
          section that states the pairs twice, once roundly in prose and once
          precisely in a table, with the producer having found only one; or an
          entry whose quoted sentence contains the digits but attributes them to
          a different quantity, which is exactly what a hurried locator search
          returns.
        breaking_artifact: >-
          A recorded line range whose text does not contain the attributed
          number; a second, disagreeing statement of any of the ten quantities
          inside Section 4.1 that the package does not cite; or an entry whose
          quotation supports a different (field size, quantity) pair than the one
          it is filed under.
      - joint: J2 verdict composition and the undetermined discipline
        assigned_to: TASK-20260904-82665d
        attack_plan: >-
          Check the pre-registration against this card word for word, then
          recompute the composed verdict from the ten per-value verdicts by the
          pre-registered rule and confirm it is what the package reports. Then
          attack the `undetermined` boundary in both directions, because both
          errors are live. Over-claiming: find any value marked `faithful` whose
          comparison_form should have been `requires_derivation` - in
          particular, any value the producer arrived at by converting units,
          evaluating a formula, or reading a rounded figure at a precision the
          paper does not carry, with the conversion recorded under
          derived_comparison and the verdict nonetheless set to `faithful`.
          Under-claiming: find any value marked `undetermined` for which Section
          4.1 in fact states the quantity directly, i.e. an `undetermined` used
          to avoid recording a mismatch. Check that the tolerance actually
          applied per value equals the pre-registered one or a properly declared
          widening, and that no widening was chosen after the value was seen.
          Where I think this breaks: the derivation route. Deriving a comparable
          number and then reporting it as what the paper says is the single most
          likely way this task produces a confident wrong answer, and it looks
          identical to a correct answer unless someone reads
          derived_comparison against the verdict.
        breaking_artifact: >-
          A value whose verdict does not follow from its own comparison_form and
          tolerance; a composed verdict that is not what the pre-registered rule
          returns on the ten per-value verdicts; a tolerance widened without a
          declared reason; or a derivation used as a verdict.
      - joint: J3 control capability on real inputs
        assigned_to: TASK-20260904-82665d
        attack_plan: >-
          For each of VC-0, VC-1, VC-2 and RC-2, construct the concrete input
          that should make it fail and RUN THE PRODUCER'S OWN FUNCTION on it -
          import check_literals.py as a module into your own scratch script and
          call its control functions directly, as the Validator of BATCH-256a94
          did to refute RG-4. Do not accept a prose claim that a branch is
          reachable. Specifically: feed VC-1 a decoy that differs from the
          committed set by less than the tolerance and confirm the procedure
          does NOT reject it (if it does, the procedure is not applying its own
          tolerance); feed VC-2 the delta ladder yourself and check the reported
          resolution is the one the code produces; feed RC-2 the model's own
          per_field optimal pairs and a set placed below the minimum, and check
          both branches are actually taken. Then ask, for each control, whether
          its PASS is entailed by its construction - the RG-4 failure mode - and
          say so if it is. Where I think this breaks: VC-1 objects (i) and (ii)
