        On each object the procedure must return `mis_transcribed` or
        `undetermined` and never `literals_faithful`. A `faithful` on the shift
        or permutation objects together with a `faithful` on the committed set
        is a self-contradiction the procedure produced, and its verdict on the
        real literals then carries no information: say that explicitly rather
        than reporting the other rejections as robustness. A `faithful` on the
        unit object specifically indicates the procedure is comparing magnitudes
        without checking units, which is the exact defect that would make the
        whole anchor comparison meaningless. Report what the procedure DID on
        each object, not what it should have done.
