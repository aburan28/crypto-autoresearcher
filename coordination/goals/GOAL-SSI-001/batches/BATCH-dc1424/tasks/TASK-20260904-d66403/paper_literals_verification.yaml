exhaustive_search_for_second_statements:
  why: >-
    A locator search that finds one statement does not establish it is the only
    one. Review joint J1 asks specifically for a SECOND, disagreeing statement
    elsewhere in the section.
  searches_run:
    - command: grep -n "106\.5\|92\.5\|157\.5\|138\.6\|204\.2\|181\.3\|230\.9\|206\.0\|302\.4\|272\.2" inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
      scope: the WHOLE 350-line file, not only Section 4.1
      result: >-
        Exactly five matching lines, 234-238, one per field size. Each of the ten
        numbers occurs exactly once in the entire document.
    - command: grep -n -o "2\^[0-9.]*" inputs/P13-WESOLOWSKI-2026/paper_fulltext.md | sort | uniq -c
      scope: the WHOLE file
      result: >-
        22 power-of-2 tokens in the document. 15 are in Section 4.1 lines 234-238
        (the ten values under test plus the five `previous methods` figures
        2^128, 2^192, 2^256, 2^288, 2^384, which are the Delfs-Galbraith
        baseline and are NOT under test here); the remaining 7 are 2^256 at line
        51 and the prime specifications 2^248 / 2^500 in Section 4.2 at lines
        248-256. No token is a second statement of any of the ten values.
  finding: >-
    NO second statement, table, footnote, or example restating any of the ten
    quantities exists anywhere in the frozen document. Section 4.1 states each of
    the ten exactly once, in prose bullets. There is no table in Section 4.1.
  what_this_does_not_establish: >-
    That the published paper contains no such table. This document is a frozen
    verbatim transcript provided by the repository owner
    (inputs/P13-WESOLOWSKI-2026/source_record.yaml, provenance.acquisition,
    2026-07-24), and the two figures of Section 4.2 are present only as captions.
    A structure lost in transcription would be invisible here. This task's scope
    is the frozen document.

