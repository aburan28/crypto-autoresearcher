# ---------------------------------------------------------------------------
# COMPOSITION, showing the pre-registered rule being applied
# ---------------------------------------------------------------------------
composition:
  rule_applied_verbatim: >-
    (1) if ANY of the ten per-value verdicts is `mis_transcribed`, the composed
    verdict is `literals_mis_transcribed`; (2) else if ALL TEN per-value verdicts
    are `faithful`, the composed verdict is `literals_faithful`; (3) otherwise
    (at least one `undetermined`, none `mis_transcribed`) the composed verdict is
    `undetermined`.
  step_1: >-
    Is any of the ten per-value verdicts `mis_transcribed`? NO - the count is 0.
    Clause (1) does not fire.
  step_2: >-
    Are all ten per-value verdicts `faithful`? YES - the count is 10 of 10.
    Clause (2) fires.
  step_3: >-
    Clause (3) is not reached.
  composed_verdict: literals_faithful
  computed_independently_in_code: >-
    check_literals.py `compose()` returns `literals_faithful` on the same ten
    per-value verdicts (see controls_report.yaml, rc1 block). The code implements
    the rule; this block shows it being applied by hand and the two agree.
  composed_verdict_is_undetermined: false
  note_on_undetermined: >-
    Stated because the deliverable contract requires it conditionally. Had the
    composed verdict been `undetermined`, that would have been a RESULT about the
    anchor and not a failure of the task. It is not the outcome here.

# ---------------------------------------------------------------------------
what_this_does_not_settle:
  - id: NS-1
    item: >-
      IT DOES NOT SETTLE THAT THE TWO ANCHORS ARE TWO ESTIMATES OF ONE QUANTITY.
      This measures TRANSCRIPTION only: that ten digits in cost_model.py match
      ten digits in the frozen document. It says nothing about whether this cost
      model's log2 T_full is the same functional quantity the paper's numbers
      are, and RC-2 (anchor_reachability.yaml) shows they cannot both be minima
      of the same function on this grid at three of five field sizes.
  - id: NS-2
    item: >-
      THE PAPER STATES ALL TEN VALUES AS LOWER BOUNDS, AND THE COMMITTED
      LITERALS CARRY THEM AS POINT VALUES. Every bullet at lines 234-238 reads
      `>= 2^x F_{p^2}-operations and memory >= 2^y`. Line 226 opens the section
      `Let us estimate a LOWER BOUND on the concrete cost`; line 230 says `let us
      be conservative`; line 240 says `these numbers are obtained via a rough
      UNDERESTIMATION of the size of the table and the cost of its generation`;
      line 43 of the same document calls them `tentative bounds ... optimistic
      assumptions ... should not be interpreted as accurate predictions`. The
      PAPER_PAIRS mapping and cost_model.py's C1 sanity check (SANITY_TOLERANCE_
      BITS = 0.75, cost_model.py:71) treat them as two-sided targets. Under the
      pre-registered rule this is NOT a mis-transcription - the digits are the
      digits - but a lower bound and a point estimate are different objects and
      any use of PAPER_PAIRS as a two-sided target is a modelling choice this
      task did not evaluate and does not endorse. This is the single most
      load-bearing thing this task found and it is deliberately kept OUT of the
      verdict, because folding it in would be revising the pre-registration
      after seeing the paper.
  - id: NS-3
    item: >-
      IT DOES NOT SETTLE THE MEMORY UNIT BEYOND ONE FORM JUDGEMENT. Section 4.1
      never writes a unit word beside the memory figures. The producer judged
      them `direct` in table ENTRIES by reading the section's own definitions
      (line 226 `the memory cost of the algorithm is ~ M`, line 228 `M = Psi(X,
      B)X`, line 230 `a single F_{p^2}-operation per entry, so a total of M
      F_{p^2}-operations per table`), a chain that converts no number. A reviewer
      who instead judges that chain a derivation moves all five memory values to
      `requires_derivation`, hence to `undetermined`, and the composed verdict
      to `undetermined`. That is the one judgement in this package that could
      flip the composed verdict, it is recorded per entry in locator_table.json
      under comparison_form_reason, and it is the disagreement review joint J5
      predicts.
  - id: NS-4
    item: >-
      IT SETTLES NOTHING ABOUT WHERE THE fitted_opt / PAPER_PAIRS DIVERGENCE
      COMES FROM BEYOND ELIMINATING ONE OF THREE WORLDS. `literals_faithful`
      eliminates `a transcription defect in a committed implementation input`.
      It does not distinguish `a defect or difference in the cost model` from `a
      genuine external disagreement between the paper and this model`, and it
      cannot: both remaining worlds produce identical committed symptoms and
      separating them needs work this task did not do.
  - id: NS-5
    item: >-
      IT ASSERTS NOTHING ABOUT THE PAPER'S CORRECTNESS, about SQIsign, CSIDH, any
      standardized parameter set, any exponent, any asymptotic complexity, or any
      security level, in any direction. It compares digits in two committed files
      at one frozen commit.
  - id: NS-6
    item: >-
      IT IS SCOPED TO THE FROZEN TRANSCRIPT, NOT TO THE PUBLISHED PAPER.
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md is a verbatim text provided in
      conversation on 2026-07-24 (source_record.yaml). If that transcript differs
      from the published article at lines 234-238, this whole result inherits the
      difference. No independent copy was fetched and none is in read_scope.
  - id: NS-7
    item: >-
      IT DOES NOT VALIDATE THE COST MODEL. cost_model.py was read as text and
      never executed (absolutely prohibited by BATCH-dc1424
      frozen_artifact_ruling, containing hazard O7/R2). All model numbers used
      here come from the committed RUN-WESOVOW-001/raw-result.json.
