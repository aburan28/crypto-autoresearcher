preregistration:
  written_before_section_4_1_was_opened: true
  attestation: >-
    This block was written and hashed before any line of Section 4.1 of
    inputs/P13-WESOLOWSKI-2026/paper_fulltext.md was read. At the time of
    writing the producer had read: the task card, BATCH-dc1424/batch.yaml,
    AGENTS.md, DEC-20260904-166ab5 (PD-2, PD-4 and the O7/R2 line),
    inputs/P13-WESOLOWSKI-2026/source_record.yaml, cost_model.py lines 40-90
    (the committed literals), specification.yaml lines 55-120 (units, optimizer,
    field sizes), and the per_field `optimal` blocks of
    RUN-WESOVOW-001/raw-result.json. It had NOT opened paper_fulltext.md.
  source_of_this_block: >-
    Copied from the constraints of TASK-20260904-d66403's task card
    ("TOLERANCE, PRE-REGISTERED" and "DIRECTLY COMPARABLE, PRE-REGISTERED") and
    from BATCH-dc1424/batch.yaml `the_three_outcomes_are_all_real_results`. It
    is fixed and may not be revised after any paper value is seen.
  tolerance:
    default_bits: 0.05
    default_rationale: >-
      A committed literal and a paper-stated value agree when
      |paper - literal| <= 0.05 bits, which is half a unit in the last decimal
      place the committed literals carry.
    coarser_paper_precision_rule: >-
      If the paper states a value to COARSER precision than that, do not tighten
      and do not silently widen: use half a unit in the PAPER's last stated
      place, record the widened tolerance for that value explicitly in
      locator_table.json, and flag the value as `precision_limited`.
    qualitative_rule: >-
      If the paper states a value only qualitatively ("about 2^106", "roughly"),
      the value is `undetermined`.
  directly_comparable_test:
    direct: >-
      A paper value is `direct` only if Section 4.1 states it as a number in the
      same quantity and unit the literal carries - log2 of F_{p^2}-operations
      for time, log2 of TABLE ENTRIES for memory.
    requires_derivation: >-
      If the paper states memory in bytes, in a different entry convention, or
      as a formula the reader must evaluate, the comparison form is
      `requires_derivation` and the value's verdict is `undetermined`.
    derivation_may_not_be_a_verdict: >-
      IF A DERIVATION IS PERFORMED ANYWAY, it is a NEW model computation:
      recorded in locator_table.json under `derived_comparison` with the
      derivation written out, and it may NOT become the value's verdict.
      Deriving a number and then reporting it as what the paper says is exactly
      the failure this task exists to detect.
    absent: >-
      Comparison form `absent` when no statement of that (field size, quantity)
      is found in the identified section; the entry then carries the recorded
      failed search (line range read in full, search terms used) in place of a
      paper locator, and the verdict is `undetermined`.
  per_value_verdict_vocabulary:
    - faithful
    - mis_transcribed
    - undetermined
  per_value_assignment_rule:
    faithful: comparison_form == direct AND |paper - literal| <= tolerance_applied
    mis_transcribed: comparison_form == direct AND |paper - literal| > tolerance_applied
    undetermined: comparison_form in {requires_derivation, absent}, or the paper states the value only qualitatively
  composition_rule:
    statement: >-
      Applied to the ten per-value verdicts in this precedence order, taken from
      BATCH-dc1424/batch.yaml `the_three_outcomes_are_all_real_results`:
      (1) if ANY of the ten per-value verdicts is `mis_transcribed`, the composed
      verdict is `literals_mis_transcribed`;
      (2) else if ALL TEN per-value verdicts are `faithful`, the composed verdict
      is `literals_faithful`;
      (3) otherwise (at least one `undetermined`, none `mis_transcribed`) the
      composed verdict is `undetermined`.
    ordered_precedence: [literals_mis_transcribed, literals_faithful, undetermined]
    undetermined_is_a_result: >-
      An `undetermined` composed verdict is a RESULT about the anchor and not a
      failure of the task: it means PAPER_PAIRS was never a transcription of
      stated values in comparable units, so the two anchors were never two
      estimates of one quantity.
  scope:
    values_under_test: 10
    field_sizes_log2p: [256, 384, 512, 576, 768]
    quantities: [log2_time, log2_memory]
    committed_literal_source: experiments/EXP-WESOVOW-001/cost_model.py lines 61-65 (mapping PAPER_PAIRS opened at line 60)
    model_units:
      time: "F_{p^2}-operations (specification.yaml model_definition.unit_of_cost)"
      memory: "table entries (specification.yaml model_definition.unit_of_memory)"
preregistration_frozen_hash: a8e0678c66a154a198c7deb540d4e4e8f27a18f1797b23f75434fb8046513225
preregistration_frozen_at_utc: '2026-09-04T23:51:24Z'
preregistration_revised_after_seeing_a_paper_value: false

preregistration_objections:
  - id: PO-1
    objection: >-
      The pre-registered default tolerance of 0.05 bits sits EXACTLY at the
      half-unit boundary of the paper's own stated precision, so a perturbation
      of exactly 0.05 bits lands on the comparison's `<=` boundary and its
      verdict is decided by IEEE-754 rounding of `literal + 0.05` rather than by
      the rule. This is visible in VC-2: at log2 p = 256 a +0.05 perturbation
      returns `faithful` (106.5 + 0.05 - 106.5 evaluates to 0.049999999999997)
      while at the other four field sizes it returns `mis_transcribed`
      (138.6 + 0.05 - 138.6 evaluates to 0.050000000000011).
    would_have_preferred: >-
      A tolerance stated with an explicit epsilon, e.g. |paper - literal| <=
      0.05 + 1e-9, or a decimal comparison.
    effect_on_this_task: >-
      NONE on any verdict recorded here. Every one of the ten committed literals
      matches its paper value EXACTLY (signed difference 0.0 at all ten), so no
      value is anywhere near the boundary and the objection changes nothing. It
      is recorded because it would matter to a successor whose literals differ
      by exactly a half unit.
    followed_anyway: true

