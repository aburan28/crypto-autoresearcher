batch:
  id: BATCH-dc1424
  goal_id: GOAL-SSI-001
  question_ids:
    - RQ-SSI-001
  title: >-
    RC-1 first: verify the five PAPER_PAIRS literals at
    experiments/EXP-WESOVOW-001/cost_model.py:61-65 against Section 4.1 of the
    frozen paper, with locators for every value, and measure whether the
    PAPER_PAIRS anchor is reachable by this cost model at all (RC-2).
  status: ready_for_dispatch
  status_note: >-
    Successor control plane to BATCH-256a94, which DEC-20260904-166ab5 closed as
    `revise` with exactly one next action. This file authorizes no execution by
    itself; dispatch_queue.json is the bounded dispatch contract and
    TASK-20260904-d66403 is the only ready task at the opening state. No
    hypothesis status, experiment status, or goal status moves in this batch.

  opened_under_next_action: >-
    Quoted verbatim from ledger/decisions/DEC-20260904-166ab5.yaml,
    next_actions[0], the single next action of the committed decision that
    closed BATCH-256a94: "SINGLE NEXT ACTION - RC-1. Open one bounded successor
    batch on GOAL-SSI-001 whose first and gating task verifies the five
    PAPER_PAIRS literals at experiments/EXP-WESOVOW-001/cost_model.py:61-65
    against Section 4.1 of inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, with
    page or line locators, in a task whose read_scope includes that path. It is
    a text lookup, both reviewers name it the cheapest decisive step in the
    round, and it is the only step that can distinguish a transcription defect
    from a model defect from a genuine external disagreement. Chosen over the
    contract reconciliation amendment because the amendment's correct content
    depends on it: if the literals are mis-transcribed, the anchor question
    changes shape before any contract text is rewritten. Nothing else is
    dispatched until that batch is scoped."
  opened_under_next_action_note: >-
    The authority quoted is the committed decision record, not the GOAL-SSI-001
    head. This authoring task holds no shell and could not run
    `python3 tools/goal_head.py show GOAL-SSI-001 --field next_action`, and
    ledger/goals/GOAL-SSI-001/goal.yaml is far too large to read whole for one
    field. The decision record is the authority for what was decided in any
    case; the goal head is its checkpointed reflection, written by
    TASK-20260904-63e06e. The committing session should confirm the two agree
    before dispatch and record any divergence as a finding rather than
    reconciling it silently.

  maintainer_ruling:
    date: '2026-09-04'
    source: repository owner, asked directly
    ruling: >-
      "Run RC-1 first" - verify the five PAPER_PAIRS literals against the source
      paper BEFORE writing any superseding amendment, because if the literals
      are mis-transcribed the amendment's correct content changes before it is
      written.
    consequence_for_this_batch: >-
      RC-1 is the gating first task and the only producer. The contract
      reconciliation amendment (RC-6/O1) is recorded under carried_forward and
      is NOT dispatched here.

  objective: >-
    From the frozen paper and committed code alone, and without editing any
    frozen path: (1) determine, value by value and with a locator for each,
    whether the five (log2 time, log2 memory) pairs literalized at
    experiments/EXP-WESOVOW-001/cost_model.py:61-65 are faithful to Section 4.1
    of inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, are mis-transcribed, or
    cannot be determined because the paper does not state them in a directly
    comparable form; and (2) measure, as a first anchor-reachability control
    (RC-2), whether the PAPER_PAIRS time at each field size lies at or above the
    minimum log2 T_full this cost model attains on the contract's own declared
    optimizer grid. Nobody in this program has ever performed (1), and no
    committed control performs (2).

  why_rc1_is_the_gate: >-
    Three distinct states of the world produce the same committed symptom - the
    fitted_opt / PAPER_PAIRS divergence recorded in EV-SSI-5d954c - and they
    have different successors. A transcription defect is repaired by a
    correction to the implementation's literals. A model defect is a contract
    question and changes what the RC-6 amendment must say. A genuine external
    disagreement between the paper and this cost model is a research finding
    about the model, not a defect at all. Only reading the source separates
    them, and reading the source is nearly free.

  the_three_outcomes_are_all_real_results:
    literals_faithful: >-
      Every one of the ten numbers is stated in Section 4.1 in a directly
      comparable form and matches the committed literal within the
      pre-registered tolerance. RESULT: the anchor divergence is not a
      transcription defect, and the successor question is a model or comparison
      question.
    literals_mis_transcribed: >-
      At least one of the ten numbers is stated in Section 4.1 in a directly
      comparable form and does NOT match the committed literal. RESULT: a
      localized defect in a committed implementation input, repairable by a
      recorded correction, and the RC-6 amendment's content changes before it is
      written. This is the outcome the maintainer's ruling exists to catch.
    undetermined: >-
      Section 4.1 does not state the values in a form directly comparable to the
      cost model's units, so no comparison is possible without a derivation the
      paper does not itself perform. RESULT, AND A SUCCESS: the anchor question
      cannot be settled by reading, which is itself decisive - it means
      PAPER_PAIRS was never a transcription of stated values and the two anchors
      were never two estimates of one quantity. An honest `undetermined` closes
      the cheapest route and redirects the campaign; it is not a failure of the
      task and must not be reported, budgeted, or reviewed as one.
    partial_outcomes_permitted: >-
      Per-value verdicts may be mixed. The composition rule from per-value
      verdicts to the batch verdict is PRE-REGISTERED on the producer's task
      card and may not be chosen after the values are seen.

  blind_phase_hygiene:
    rule: >-
      No control-plane artifact of this batch - batch.yaml, dispatch_queue.json,
      any task card, or any ledger handoff copy - restates any of the ten
      PAPER_PAIRS values, any of the five paper-minus-attained-minimum deltas
      recorded in EV-SSI-5d954c, or any per_field optimal value from either run
      package. They are named by LOCATOR only.
    why: >-
      TASK-20260904-c8675d re-transcribes the five pairs from the paper alone
      before opening the committed literals. A number quoted in a card the
      re-transcriber must read to know its own assignment would contaminate that
      re-transcription silently and irreversibly, and nothing downstream could
      detect it. This rule is what makes the blind phase real rather than
      declared.
    consequence: >-
      Where a value is needed, cite the path, line range or key path. A locator
      satisfies any deliverable that names a value under this rule - the
      standing ruling of DEC-20260904-166ab5 PD-2, applied here to blindness
      rather than to the citation prohibition.

  citation_prohibition:
    status: >-
      IN FORCE, RETAINED IN FULL, AND WIDENED BY PREDICATE. NOT LIFTED BY THIS
      BATCH, AND NO TASK OF THIS BATCH MAY LIFT IT.
    retained_verbatim: >-
      The `P=512` crossover value and its `w=2^80` sign are **NOT
      citation-eligible**. This task does not lift that prohibition. Only a
      committed Coordinator decision on independently reviewed evidence can lift
      it.
    predicate_extension_verbatim_from_DEC_20260904_166ab5: >-
      In addition to the retained sentence, a row of any EXP-WESOVOW-001
      reconciliation is NOT citation-eligible when either (a) the two anchors
      disagree in the SIGN of the baseline comparison at that row, or (b) the
      smaller |margin| across the two anchors at that row is below that field
      size's anchor gap |Delta log2 T_full + Delta log2 M / 2|.
    machine_flag_status: >-
      anchor_reconciliation.json's per-row `citation_prohibited` flag is scoped
      by FIELD SIZE and is KNOWN TO UNDER-REPORT: at least two rows carrying
      `citation_prohibited: false`, at log2 p = 256, fall under the predicate.
      That artifact is snapshot-bound, immutable, and MUST NOT be edited. Any
      consumer reading it applies DEC-20260904-166ab5 on top of it. This batch
      produces no successor to that artifact and does not repair the flag.
    application_to_this_batch: >-
      Reasoned, not assumed. The prohibition covers crossover values and
      baseline-comparison signs. No task of this batch computes a crossover, a
      T_DG baseline comparison, a margin, or a speedup, so neither the retained
      sentence nor the predicate fires on anything this batch produces. The five
      PAPER_PAIRS literals and the per_field optimal log2 T_full values are
      committed model INPUTS, not crossover values or signs, and are not
      prohibited - but see blind_phase_hygiene above, which withholds them from
      the control plane for an unrelated and independently binding reason.
      Every task must restate the retained sentence and the predicate verbatim
      and must state which of them, if either, it found applicable and why.
    lift_procedure: >-
      Only a committed coordinator_decision resting on independently reviewed
      evidence archived under this batch's ledger archive may lift it. No
      identifier is reserved here for a lift, because on the state of the
      evidence at the opening of this batch a lift is not in prospect: RC-1 is
      unperformed, one anchor may not be a point of the model, and both runs'
      execution provenance is unattested. A reviewer may RECOMMEND lifting or
      retaining; a recommendation is not a decision.

  frozen_artifact_ruling: >-
    experiments/EXP-WESOVOW-001/specification.yaml,
    experiments/EXP-WESOVOW-001/cost_model.py, every artifact under
    experiments/EXP-WESOVOW-001/runs/, and inputs/P13-WESOLOWSKI-2026/ are
    READ-ONLY for every task in this batch. They are not to be edited, moved,
    regenerated, reformatted, rerun, or staged, and no task holds any of them in
    its write_scope. specification.yaml is a frozen contract and may be changed
    only by a recorded protocol amendment, never by an edit. Additionally, NO
    TASK OF THIS BATCH MAY EXECUTE cost_model.py AT ALL - not to reproduce a
    value, not to check a literal, not with WESOVOW_RAW_PATH set. That
    prohibition is absolute and is the containment for the standing hazard
    recorded as O7/R2 below.

  execution_prohibition:
    new_experiment_runs_authorized: 0
    statement: >-
      This batch authorizes NO execution of any experiment implementation and
      creates NO run record. The producer's authorized invocations are of its
      own standalone script inside its own task directory, which imports nothing
      from experiments/. A reviewer's own throwaway arithmetic is not a run -
      the standing interpretation ruled in DEC-20260904-166ab5 PD-4, restated on
      every review card of this batch rather than left to be inferred.

  carried_forward:
    - id: CF-1
      origin: DEC-20260904-166ab5 next_actions[1] (RC-6/O1); EV-SSI-5d954c observations 1-2
      item: >-
        experiments/EXP-WESOVOW-001/specification.yaml:39-40 still carries the
        PRE-FIX analytic crossover on origin/main, and on the Red Team's blind
        re-derivation the frozen contract is INTERNALLY UNSATISFIABLE: no single
        charging law satisfies both that metrics line and control C4 of the same
        file unless log2 M = 0. The repair is a RECORDED SUPERSEDING PROTOCOL
        AMENDMENT. The specification is frozen and may not be edited.
      status: RECORDED, NOT DISPATCHED
      why_not_dispatched: >-
        The maintainer's ruling of 2026-09-04. The amendment's correct content
        depends on RC-1's verdict: if the literals are mis-transcribed the
        anchor question changes shape before any contract text is rewritten.
        Dispatched by this batch's successor, on the RC-1 result.
      not_evaporating: >-
        This item is the round's headline adverse finding. It is carried here so
        that it cannot be lost between batches, and the ledger archive of this
        batch must carry it forward again if it is still undispatched.
    - id: CF-2
      origin: DEC-20260904-166ab5 citation_boundary; EV-SSI-5d954c observation 6
      item: >-
        The P=512 crossover and w=2^80 sign prohibition, retained in full and
        widened by predicate, with the committed machine-readable flag known to
        under-report.
      status: RETAINED AND ENFORCED IN THIS BATCH
      where: batch.citation_prohibition above, restated on every task card.
    - id: CF-3
      origin: DEC-20260904-166ab5 next_actions[1] (RC-2); EV-SSI-5d954c observation 7
      item: >-
        PAPER_PAIRS is INFEASIBLE for this model at three of five field sizes -
        its transcribed time lies below the minimum the model attains on the
        contract's own optimizer grid - and NO existing control tests anchor
        reachability.
      status: DISPATCHED IN THIS BATCH
      where: >-
        TASK-20260904-d66403 deliverable anchor_reachability.yaml and control
        RC-2, reviewed under joint J4.
    - id: CF-4
      origin: DEC-20260904-166ab5 rationale (J5 refutation); next_actions[3]
      item: >-
        Every declared control must name the concrete input that makes it FAIL,
        ON A REAL ANCHOR, not a mutation of the law in the code. RG-4 was
        REFUTED last round for being algebraically entailed, so it passed on
        every possible input and its pass carried no information.
      status: ENFORCED IN THIS BATCH
      where: >-
        Each of VC-0, VC-1, VC-2 and RC-2 on TASK-20260904-d66403 declares its
        failing input; joint J3 is a reviewer whose whole assignment is to
        construct those inputs and run the producer's own control functions
        against them.
    - id: CF-5
      origin: DEC-20260904-166ab5 PD-6; EV-SSI-5d954c review_composition.blindness
      item: >-
        In BATCH-256a94 the review reports were .md, so
        tools/check_review_independence.py - which yaml.safe_loads the whole
        report file - could not read either attestation and the independence
        gate could not run at all. Blindness had to be verified by hand, which
        is weaker.
      status: FIXED IN THIS BATCH
      where: >-
        Both review artifacts are declared as .yaml carrying a top-level
        `review_attestation` block. Exactly one file in this batch directory
        carries a `review_plan` block (the producer's task card), so
        `--batch` resolves the plan unambiguously; and no non-review artifact of
        this batch may carry a `review_attestation` key, so `--batch` collects
        exactly two reports.
    - id: CF-6
      origin: DEC-20260904-166ab5 next_actions[3]; EV-SSI-5d954c boundaries (producer provenance)
      item: >-
        The BATCH-256a94 producer package recorded no resolved-model provenance,
        so its inference provenance was undetermined from committed state. The
        task card did not require one.
      status: FIXED IN THIS BATCH
      where: >-
        runtime_session_receipt.yaml is a declared, required producer artifact
        on TASK-20260904-d66403, and each reviewer records the same fields in
        its attestation.
    - id: CF-7
      origin: DEC-20260904-166ab5 next_actions[1] (RC-4); EV-SSI-5d954c unresolved_confounds
      item: >-
        RG-3 bounded the procedure's resolution nowhere tighter than 46.25 bits
        and was blind to every quantity this campaign studies, which sit at
        0.18-3.22 bits.
      status: PARTIALLY DISPATCHED IN THIS BATCH
      where: >-
        Control VC-2 measures the resolution of the LITERAL-COMPARISON procedure
        at perturbations of 0.05-0.5 bits, which is the scale that matters here.
        This does NOT discharge RC-4 for the reconciliation procedure, which
        remains carried forward undischarged.
    - id: CF-8
      origin: DEC-20260904-166ab5 next_actions[1] (RC-3)
      item: >-
        A null-object recount of the sign disagreements using two synthetic
        anchors separated by the same per-field constant.
      status: RECORDED, NOT DISPATCHED
      why_not_dispatched: >-
        It is a reconciliation-procedure control and its design depends on
        whether PAPER_PAIRS is a transcription at all, which is what RC-1
        determines. Scoped by this batch's successor.
    - id: CF-9
      origin: DEC-20260904-166ab5 next_actions[1] (RC-7); EV-SSI-5d954c unresolved_confounds
      item: >-
        Attest, or record as unattestable, the two runs whose manifests carry
        dirty_tree: true.
      status: RECORDED, NOT DISPATCHED
      why_not_dispatched: >-
        Independent of RC-1 and cheap, but it is a provenance task on frozen run
        packages with its own scope and would dilute a gating batch whose whole
        point is one question. Dispatched next, in parallel with the RC-6
        amendment, and it is not blocked by anything here.
    - id: CF-10
      origin: DEC-20260904-166ab5 next_actions[1] (O7/R2); EV-SSI-5d954c unresolved_confounds
      item: >-
        cost_model.py's default output path names RUN-WESOVOW-201692-001, so an
        invocation without WESOVOW_RAW_PATH set writes into a committed run
        directory. This is a standing EVIDENCE-INTEGRITY HAZARD and is not to be
        left classified as a bookkeeping non-defect.
      status: CONTAINED HERE, REPAIR NOT DISPATCHED
      where: >-
        batch.frozen_artifact_ruling forbids every task of this batch from
        executing cost_model.py at all, so the hazard cannot fire in this batch.
        Containment is not repair; the repair needs a protocol amendment and is
        carried forward with CF-1.

  claim_ceiling: >-
    Source-fidelity verification of five committed implementation literals
    against one frozen document, plus one anchor-reachability measurement on
    already-committed numbers. No attack, no certificate, no security claim
    about SQIsign, CSIDH, or any standardized parameter set in either direction;
    no exponent or asymptotic-complexity claim; no hypothesis status change; no
    experiment status change; no knowledge promotion; no asymptotic promotion
    gate engaged; and no completion criterion of GOAL-SSI-001 met or approached.
    This batch measures nothing new about any isogeny problem: it is document
    reading, code reading, and arithmetic on already-committed literals.

  review_routing_determination:
    tier: review-adversarial at xhigh, for both reviewers
    basis: >-
      The routing rules escalate to review-breakthrough for a claimed
      breakthrough, a proposed closure, or a result contradicting prior
      VALIDATED evidence. None applies: this round claims no breakthrough,
      closes no lane, and the only prior record it bears on, EV-SSI-5d954c, is
      recorded at strength `inconclusive` and itself states that RC-1 is
      unperformed. review-breakthrough is therefore NOT indicated - which is
      fortunate but is NOT the reason, and the reason is recorded first on
      purpose.
    if_the_round_produces_a_breakthrough_tier_object: >-
      STOP CONDITION, not a downgrade. If any task produces a claimed
      contradiction between two committed evidence records, a proposed closure,
      or a claimed breakthrough, that object is NOT composed under
      review-adversarial. The batch halts and returns to the Coordinator, the
      CLAIM stays un-promoted, and GOAL-SSI-001 stays `active` with a recorded
      impediment. review-breakthrough is `degradable: false` and cannot be
      served on this host; substituting an adversarial review for it is the
      silent downgrade the policy layer forbids (AGENTS.md rule 12; CLAUDE.md
      rule 10 item 2).

  inference_environment:
    resolvable_backends: local only
    basis: >-
      NOT PROBED BY THIS AUTHORING TASK, which holds no shell. The most recent
      recorded probe is BATCH-256a94/batch.yaml inference_environment: `python3
      -m orchestration.adapter doctor` run by the orchestrating session at
      15:22Z on 2026-09-04, reporting that only the `local` backend resolves and
      every API backend lacks credentials. Carried forward as the operating
      assumption and re-checkable with the same command. It is an assumption
      here, not a measurement, and is labelled so.
    consequence: >-
      No task in this batch may require a second model backend or a
      model-independent review; such a task could not be served here.
    declared_limitation: >-
      The two reviews in this batch are SESSION-independent, not
      MODEL-independent. Their concurrence is correlated by construction, must
      be recorded as such in the evidence record, and may NEVER be presented as
      corroboration by distinct models. What this batch buys instead is
      corroboration by two independent METHODS - a locator-checked audit of the
      producer's table and a blind re-transcription from the source - which is a
      different and weaker thing, stated as such.

