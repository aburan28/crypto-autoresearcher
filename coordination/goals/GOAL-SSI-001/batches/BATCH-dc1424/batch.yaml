    decision_record:
      coordinator_decision:
        id: DEC-20260904-9be0f2
        context: >-
          Opening one bounded successor batch, BATCH-dc1424, on GOAL-SSI-001,
          under the single next action of the committed decision
          DEC-20260904-166ab5 and under the repository owner's explicit ruling of
          2026-09-04 that RC-1 runs first. BATCH-256a94 closed as `revise` with
          EV-SSI-5d954c at strength `inconclusive`. Its headline adverse finding
          is that the frozen contract experiments/EXP-WESOVOW-001/specification.yaml
          still carries the pre-fix analytic crossover at lines 39-40 and is
          internally unsatisfiable against its own control C4; its second finding
          is that PAPER_PAIRS is not a point of this cost model at three of five
          field sizes; and its recorded gap is that nobody has ever compared the
          five PAPER_PAIRS literals against the source paper. This decision
          approves the composition, scope, controls, review architecture and
          budget of the successor batch. It approves no experiment, changes no
          status, and records no result.
        decision: approve
        decision_scope: batch_composition_and_review_architecture
        target_ids:
          - GOAL-SSI-001
          - BATCH-dc1424
          - EXP-WESOVOW-001
          - TASK-20260904-d66403
          - TASK-20260904-977d04
          - TASK-20260904-82665d
          - TASK-20260904-c8675d
          - TASK-20260904-cb8d1d
        rationale:
          - >-
            RC-1 IS DISPATCHED FIRST AND ALONE BECAUSE THE AMENDMENT'S CORRECT
            CONTENT DEPENDS ON IT. The owner's ruling and DEC-20260904-166ab5
            agree: if the literals are mis-transcribed, the anchor question
            changes shape before any contract text is rewritten. Writing the RC-6
            amendment first would freeze a reconciliation whose premise is
            untested. RC-1 is a text lookup against a frozen document and is the
            cheapest decisive step available anywhere in this campaign.
          - >-
            ALL THREE RC-1 OUTCOMES ARE CONTRACTED AS RESULTS, AND THE HARDEST
            ONE IS NAMED AS A SUCCESS. `undetermined` - the paper does not state
            the pairs in a directly comparable form - is not a failed task. It
            would establish that PAPER_PAIRS was never a transcription of stated
            values, hence that the two anchors were never two estimates of one
            quantity, hence that the reconciliation framing of BATCH-eb0a7e and
            BATCH-256a94 was mis-posed. A contract that treated `undetermined` as
            a shortfall would push the Executor toward a derivation, and a
            derivation reported as what the paper says is the exact failure this
            task exists to detect. The card therefore separates
            `derived_comparison` from the verdict and forbids the former becoming
            the latter.
          - >-
            THE PRE-REGISTRATION IS WRITTEN BY THE COORDINATOR, NOT CHOSEN BY THE
            PRODUCER. The tolerance (0.05 bits, half a unit in the last decimal
            place the literals carry), the directly-comparable test, and the
            composition rule (mis_transcribed > undetermined > faithful) are fixed
            on the task card before the paper is opened. AGENTS.md forbids
            changing a success criterion after observing an outcome; the cheapest
            way to honour that here is to remove the choice from the agent that
            will see the outcome.
          - >-
            RC-2 IS ADDED BECAUSE NO COMMITTED CONTROL TESTS ANCHOR
            REACHABILITY. EV-SSI-5d954c records that the procedure of BATCH-256a94
            accepted an infeasible anchor and emitted 120 fully formed rows from
            it, 72 at field sizes where the anchor is not a value of the function,
            with no schema field recording that the anchor was off-curve. RC-2 is
            cheap (a comparison of committed numbers), it is gated behind the
            frozen RC-1 verdict so it cannot contaminate the gate, and it carries
            failure branches in BOTH directions on real inputs.
          - >-
            EVERY CONTROL NAMES THE INPUT THAT MAKES IT FAIL, ON A REAL OBJECT.
            DEC-20260904-166ab5 refuted RG-4 for having no reachable failure
            branch on any real anchor, so its pass carried no information. VC-1's
            decoys, VC-2's delta ladder and RC-2's two directions are all real
            inputs, and a whole review joint (J3) is assigned to constructing
            those inputs and calling the producer's own functions on them rather
            than reading its prose.
          - >-
            THE REVIEW ARCHITECTURE BUYS THE ONE THING VALIDATION CANNOT. The
            Red Team's assignment is not an audit but a second independent
            instance of the measurement: a blind re-transcription from the source
            by an agent that has never seen the committed literals, the
            producer's answer, or any record from which they can be reconstructed.
            That is why its blind_from list includes EV-SSI-5d954c, both
            BATCH-256a94 reconciliation artifacts, both prior review reports and
            both run directories, and why no control-plane file of this batch
            restates any of the ten values or the five deltas. The joint split is
            four to the Validator and one to the Red Team because a reviewer that
            opens the package to attack a second joint has spent the blindness
            that makes the first joint worth having.
          - >-
            THE REVIEW ARTIFACTS ARE .yaml, WHICH REPAIRS A GATE THAT WAS INERT.
            In BATCH-256a94 both reports were .md, so
            tools/check_review_independence.py - which yaml.safe_loads the whole
            report file - could read neither attestation and the independence
            gate could not run at all; blindness had to be verified by hand and
            was recorded as weaker. Both reports here are YAML with a top-level
            review_attestation, exactly one file in the batch directory carries a
            review_plan, and no non-review artifact carries a review_attestation
            key, so `--batch` resolves one plan and exactly two reports.
          - >-
            WHAT THIS BATCH CANNOT CHECK IS SAID OUT LOUD. The Phase A / Phase B
            ordering with respect to cost_model.py and DEC-20260904-166ab5 is
            attested, not tool-checked, because the re-transcriber must open both
            in Phase B; and the two reviews are session-independent but not
            model-independent, because only the `local` backend resolves here.
            Recording both limits in the plan is what keeps the round from
            reading as stronger than it is.
          - >-
            THE CITATION PROHIBITION IS RETAINED IN FULL AND WIDENED BY PREDICATE,
            AND THE PREDICATE'S APPLICATION HERE IS REASONED RATHER THAN ASSUMED.
            No task of this batch computes a crossover, a baseline comparison, a
            margin or a speedup, so neither the retained sentence nor the
            predicate is expected to fire; every task must nonetheless restate
            both and report whether either fired, and the committed
            machine-readable flag remains known to under-report and must not be
            edited.
          - >-
            EVERY CARRIED-FORWARD ITEM IS NAMED, WITH ITS ORIGIN AND ITS DISPATCH
            STATE. CF-1 (the internally unsatisfiable frozen contract), CF-3
            (RC-2), CF-4 (controls that can fail), CF-5 (.yaml review artifacts),
