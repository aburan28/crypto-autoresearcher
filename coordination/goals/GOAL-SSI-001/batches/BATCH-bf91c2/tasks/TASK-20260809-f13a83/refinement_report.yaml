ssi_v13_refinement:
  id: TASK-20260809-f13a83
  goal_id: GOAL-SSI-001
  batch_id: BATCH-bf91c2
  role: coordinator
  status: completed_design_only
  experiment_id: EXP-SSI-87e5f0
  predecessor_experiment: EXP-SSI-31c008
  predecessor_snapshot_commit: 9916b3a172584383d5424b39812aae5ae5b83461
  objective: >-
    Produce an additive SSI-CANONICAL-v13 contract that repairs the concrete
    v12 static-audit gaps while preserving the zero-run, no-execution boundary.
  claim_ceiling: >-
    This report establishes only that the v13 files were authored for review.
    It is not evidence of an SSI algorithm, an isogeny result, a OneEnd result,
    a security result, an exponent change, a cost advantage, or a materialized
    incumbent.
  inputs_reviewed:
    - experiments/EXP-SSI-31c008/specification.yaml
    - experiments/EXP-SSI-31c008/inputs/FRAME-REGISTRY-v7.yaml
    - experiments/EXP-SSI-31c008/controls/C-PAIR-REF-v7.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-5026eb/tasks/TASK-20260809-e6e8d1/refinement_report.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-b0c877/reviews/TASK-20260809-7161f4/red_team_report.md
  repairs:
    - id: V13-R1
      issue: specification_registry_metadata_parity
      repair: >-
        Every specification registry entry now carries schema_digest,
        final_field_code, and final_digest in the same key set and order as the
        FRAME-REGISTRY-v7 input. An explicit entry encoding and byte-parity
        rejection rule were added.
      residual: >-
        All schema and final digests remain null by design. This is still an
        admission blocker and requires later materialization plus independent
        verification.
    - id: V13-R2
      issue: local_digest_preimage_and_width_ambiguity
      repair: >-
        Added a field-level local-preimage table with domain code, body schema,
        digest offset or grammar, width, and containing-range semantics for
        every named local digest. Corrected the arithmetic widths of
        SATURATION-ROW-v7 (172) and C-PAIR-ROW-v7 (385) and the copied control
        manifest. Retained EVENT-v7=196 and BUFFER-v7=34 with an explicit
        reserved byte.
      residual: >-
        The local digests are not computed because the source, controls, and
        semantic implementation are intentionally not materialized.
    - id: V13-R3
      issue: null_frame_and_terminal_length
      repair: >-
        NULL-RECORD-v7 now states complete outer width 4096, complete payload
        length 4090, shortened preimage payload length 4058, exact 3973-byte
        padding, and the final-digest dependency. Terminal codes 0..6,
        zero-based positions, emitted-count equation, and total precedence are
        enumerated explicitly.
      residual: >-
        Terminal mutation tests have not run; maximum_runs remains zero.
    - id: V13-R4
      issue: source_quantifier_and_path_boundary
      repair: >-
        A_p is defined as one ordered concatenation of complete source-bound
        frames and inputs. Canonical repository-relative path bytes, tree commit,
        exact source bytes, algorithm bytes, and target-free transcript are
        required; target, query, attempt, provider, and replay material remain
        outside A_p.
      residual: >-
        No source object or transcript digest is materialized, so universal
        advice is not frozen and no all-advice claim is allowed.
    - id: V13-R5
      issue: typed_edge_program_boundary
      repair: >-
        Added finite operation-code and witness-instruction grammars with fixed
        operand-index and width checks. The input manifest repeats the grammar
        and continues to reject names or implementation_digest as substitutes
        for equations.
      residual: >-
        EDGE-ALGORITHM-v7 still has null implementation and replay receipts;
        this is an admission blocker, not a negative mathematical result.
    - id: V13-R6
      issue: cost_population_and_total_bytes
      repair: >-
        Enumerated unique event codes for seeds, requests, owner/null records,
        provider/signature work, terminal, digest, and buffer work. Defined
        primitive FOE equations and corrected total_bytes to include input,
        output, hash-input, signature, provider, and serialization populations.
      residual: >-
        No event trace or cost result exists. Every population must be
        materialized and independently recomputed later.
    - id: V13-R7
      issue: hnf_replay_control_and_incumbent_scope
      repair: >-
        Expanded the HNF loop order, replay draw grammar and identity bytes,
        exact C-pair row width/endpoint universe, and byte-equal incumbent scope
        tuple. These are contract rules only.
      residual: >-
        Controls, incumbent, replay receipts, and semantic edge replay remain
        null and block freeze and comparison.
  hard_gates:
    - registry_digest and all schema_digest values are null until materialization
    - source, edge, provider, controls, incumbent, and replay inputs are null or absent
    - frozen: false
    - execution_authorized: false
    - evidence_eligible: false
    - maximum_runs: 0
  validation_performed:
    - YAML and JSON parsing will be performed before the v13 snapshot archive
    - static registry parity and width arithmetic are required snapshot checks
    - no experiment, diagnostic, provider probe, or backend execution was performed
  next_action: >-
    Snapshot the exact v13 producer artifacts, then obtain independent Validator
    and Red Team review of that immutable snapshot when a permitted
    review-adversarial backend passes preflight.
