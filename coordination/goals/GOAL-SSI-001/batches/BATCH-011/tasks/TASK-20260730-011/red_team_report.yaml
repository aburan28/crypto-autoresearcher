  disposition_assessment:
    claimed: FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED
    supported: true
    qualification: >-
      The disposition is a failure to clear a joint accounting gate, not a
      proof that the source algorithm has infinite expected cost or unbounded
      implemented memory. The source-compatible candidate remains a schema:
      no cited transition kernel, uniform conditional success bound, complete
      global liveness schedule, or end-to-end error map instantiates it.
      Retaining QUERY_MEMORY is therefore the narrow result.

  objections:
    - id: QM-STOPPING
      severity: blocking_for_query_reconciliation
      title: No cited joint retry and recovery law
      detail: >-
        Per-run query estimates, empirical regularization behavior, and
        expected recovered information do not define the common stopping
        process or prove finite expected random sums over every retry,
        recovery run, and tail transition.
      required_revision: >-
        Instantiate a source- or implementation-compatible transition law and
        prove a conditional success or tail bound sufficient for finite joint
        Q/S/P/C expectations.
    - id: QM-MEMORY
      severity: blocking_for_memory_reconciliation
      title: Per-vector QRACM cap is not global liveness
      detail: >-
        Equation (3.5) and the 8L hard cap constrain a charged vector, but do
        not enumerate all coherent, QRACM, classical-backing, retry, cleanup,
        and terminal-tail lifetimes on one timeline.
      required_revision: >-
        Supply widths, births, deaths, reuse, cleanup, and a deterministic
        concurrency bound for W/R/B/M_tail across the complete procedure.
    - id: QM-ERROR
      severity: blocking_for_end_to_end_reconciliation
      title: Error components lack one operational event
      detail: >-
        The producer correctly identifies a final event type F, but no cited
        maps connect all oracle, sieve, postprocessing, recovery, verification,
        and residual-tail errors to Pr[F].
      required_revision: >-
        Define the operational success/failure experiment and derive each
        component-to-F implication before composing a bound.
    - id: MUTATION-SCOPE
      severity: non_blocking_scope_guard
      title: C2 and C3 show underdetermination only
      detail: >-
        The heavy-tail law and delayed-cleanup overlap schedule are not shown
        to be the paper's actual process. Their valid role is to refute an
        inference from the cited local facts to the desired global bounds.
      required_revision: >-
        Preserve the producer's current not-rejected-by-source wording; do not
        restate either mutation as an observed or prescribed behavior.

  required_controls:
    - id: C2
      control: >-
        Heavy-tail stopping mutation with
        Pr[tau=n]=1/(n(n+1)), preserving positive finite per-run costs.
      status: remains_live
      source_rejects_mutation: false
      pass_condition: >-
        A cited or implementation-derived conditional tail bound excludes the
        mutation for the complete retry, recovery, and tail-entry process and
        proves all required additive expectations finite under one law.
    - id: C3
      control: >-
        Overlap mutation that keeps each vector within the 8L cap while
        retaining an unbounded number of retry/recovery backing objects.
      status: remains_live
      source_rejects_mutation: false
      pass_condition: >-
        A deterministic cleanup and concurrency schedule bounds every live
        coherent, QRACM, classical-backing, and tail object globally.
    - id: C4
      control: >-
        Error-map audit against one declared final key-recovery failure event.
      status: required
      pass_condition: >-
        Every component error has a cited or derived implication into the same
        event and the composed probability bound has no omitted path.

  counterexample_or_mutation: >-
    C2 is the cheapest discriminator for invented stopping laws: the cited
    local per-run facts remain true under a normalized stopping distribution
    with Pr[tau>=n]=1/n and infinite E[tau]. Any proposed geometric retry law
    must therefore expose the source or implementation fact that supplies
    independence or a uniform conditional success lower bound. C3 separately
    prevents a per-vector 8L cap from being relabeled as a global memory peak.

  baseline_comparison:
    pollard_rho: >-
      No generic ECDLP attack, complete oracle implementation, or finite
      end-to-end resource vector is instantiated. No comparison with Pollard
      rho is admissible.
    bsgs: >-
      Missing global memory and stopping semantics prevent placement against
      the BSGS time-memory frontier.
    closest_specialized: >-
      The closest specialized baseline remains Peikert's own binary
      collimation-sieve Figure 1 accounting under its QRACM and optimistic
      oracle assumptions. TASK-20260730-009 does not produce a competing
      attack row; it identifies why the source row has not yet been converted
      into FC0-R2's complete joint operational ledger.
    conclusion: >-
      No quantitative sota_delta or Pareto dominance statement can be made
      from this control.

  heuristic_challenges:
    - >-
      Empirical success percentages do not justify an iid geometric stopping
      law without a dependence argument or uniform conditional bound.
    - >-
      Expected information per run does not by itself bound the stopping time
      required to recover the declared total information.
    - >-
      Typical phase-vector length and a hard cap on each generated vector do
      not determine global live-object concurrency.

  cost_model_challenges:
    - >-
      Per-run resource estimates cannot be promoted to total expected cost
      without the retry and recovery stopping law.
    - >-
      Reusable QRACM is one memory category; coherent workspace, classical
      backing, retained retry state, verification, and terminal-tail memory
      remain unpriced.
    - >-
      A final error probability cannot be composed from heterogeneous model,
      measurement, implementation, and tail assumptions until they are mapped
      to one operational event.

  reduction_and_scope_challenges:
    - >-
      Representation, relation collection, rank, scalar orientation, source
      recovery, and target descent are not instantiated as a new complete
      attack path in this accounting-only batch.
    - >-
      No conclusion transfers to generic ECDLP, SIDH/SIKE, SQIsign/CGL path
      finding, numeric CSIDH security, or the closed IDEA-20260725-001/002/003
      lanes.
    - >-
      Failure of this control is not evidence that no compatible stopping law
      or schedule exists; it says the reviewed source extraction did not
      supply one.

