      note: >-
        BATCH-010's hash-addressed author-hosted verification remains adequate
        for the checked Equation (3.5), Equation (4.1), hard 8L language, and
        conservative symbolic-cap scope. The BATCH-011 fetch returned HTTP
        200 converted text but no canonical PDF bytes or SHA-256, so canonical
        byte identity remains unverified and O5 is not broadened.

  scope_limits:
    - >-
      Review is limited to Coordinator-committed snapshot
      442dbe6994d2c62dac286febc52b1ffeb369b3bc.
    - >-
      No curve, isogeny, simulator, or quantum-circuit computation was run.
    - >-
