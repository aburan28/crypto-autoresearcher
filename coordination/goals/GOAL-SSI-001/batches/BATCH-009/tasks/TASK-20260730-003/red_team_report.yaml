red_team_report:
  id: RT-20260730-003
  task_id: TASK-20260730-003
  goal_id: GOAL-SSI-001
  batch_id: BATCH-009
  verdict: REVISE
  claim_under_review: >-
    TASK-20260730-037 claims that CSIDH-COLLIMATION-FC0-R2 repairs the
    expectation-versus-trace category error, archives primary-source support
    for Equation (4.1), Equation (3.5), and the 8L maximum, leaves O1/O3/O4
    partial while treating O2 as an adequate type repair and O5 as an adequate
    primary anchor, and conservatively retains disposition
    FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED.
  exact_supported_final_claim: >-
    At immutable snapshot 886e496d96e274bb5dbb6fbd3cfcee35810181bc,
    FC0-R2 repairs the O1 expectation-versus-realized-trace type defect and
    honestly leaves source instantiation unresolved. The committed excerpt
    artifact gives a coherent conditional derivation of the 8L symbolic cap,
    but the snapshot does not contain the cited PDF, its hash, page mapping,
    or an extraction transcript, so an independent reviewer cannot reproduce
    the producer's verified_primary status or rule out transcription changes.
    O5 is therefore conditionally supported on excerpt fidelity, not
    independently source-verified. O1/O3/O4 remain partial, O2 remains an
    adequate type repair, O1-O5 are not collectively closed, and disposition
    FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED remains supported. No numeric,
    breakthrough, ECDLP, parameter, or GOAL-completion claim is supported.

  inference:
    requested_policy: review-xhigh
    resolved_model: GPT-5.6 Sol
    exact_backend_suffix: not_exposed
    reasoning_effort: not_exposed
    fallback_used: true
    fallback_reason: >-
      The runtime did not expose confirmation that the legacy review-xhigh
      alias or xhigh reasoning effort was served.
    independent_session_required: true
    independent_session: true
    independence_limit: >-
      This session did not originate the producer artifacts. Producer and red
      team both resolved to the GPT-5.6 Sol family, and the exact backend
      suffix and reasoning tier were not exposed. This is session-level, not
      independently resolved-model, evidence and cannot count toward a
      completion quorum or support a breakthrough claim.

  snapshot_review:
    reviewed_commit: 886e496d96e274bb5dbb6fbd3cfcee35810181bc
    reachable_from_review_head: true
    review_head: 211475831452b52f3364a3bd7e9342fcc51b9b35
