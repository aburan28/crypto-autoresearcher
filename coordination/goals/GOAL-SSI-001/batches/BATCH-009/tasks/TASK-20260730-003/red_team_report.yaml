  query_memory_disposition_supported: true
  recommended_next_gate: >-
    Keep the QUERY_MEMORY gate. First pass a source-integrity subgate by
    archiving a hash-addressed source revision, raw extraction, page/equation
    mapping, and independent quote verification. Then instantiate the actual
    stopping law and joint query/repeated-sieve/postprocessing/tail/memory/error
    vector. Do not advance to the uniform-oracle gate until both controls pass.
  next_concrete_action: >-
    Archive the exact Peikert source revision or its content hash with raw
    extraction and page locators, independently verify Equation (4.1),
    Equation (3.5), the 8L sentence, and their linkage, and downgrade O5 to
    conditional until that verification is durable.
