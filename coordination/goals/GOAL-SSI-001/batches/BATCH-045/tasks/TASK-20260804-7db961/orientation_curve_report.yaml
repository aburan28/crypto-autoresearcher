orientation_curve_report:
  task_id: TASK-20260804-7db961
  goal_id: GOAL-SSI-001
  batch_id: BATCH-045
  rt_ctrl_resolved: [RT-CTRL-002, RT-CTRL-003]
  curves_with_known_end:
    - j_invariant: "0"
      conditions: "p ≡ 2 mod 3"
      end_ring: "Maximal order in B_{p,∞} containing Z[ζ₃]"
      why_known: >-
        Extra automorphisms (Aut(E) = Z/6Z). Explicit construction from
        automorphism group and Frobenius. No path-finding needed.
      orientation_available: "Full Z[ζ₃]-orientation via degree-1 automorphism"
      attack_relevance: >-
        End fully known → KLPT solves path-finding in poly time FROM this
        curve. Orientation provides zero marginal information.
    - j_invariant: "1728"
      conditions: "p ≡ 3 mod 4"
      end_ring: "Maximal order in B_{p,∞} containing Z[i]"
      why_known: >-
        Extra automorphisms (Aut(E) = Z/4Z). Same structural reason as j=0.
      orientation_available: "Full Z[i]-orientation via degree-1 automorphism"
      attack_relevance: >-
        Identical to j=0: End fully known, KLPT applies. No marginal utility.
    - j_invariant: "roots of H_D(x) mod p for small |D|"
      conditions: "p inert in Q(√-D), |D| = O(poly(log p))"
      end_ring: "Unique maximal order containing O_D embedding"
      why_known: >-
        CM theory: H_D computable in O(|D|^{1+ε}), roots mod p give ss
        j-invariants with constructive O_D ↪ End(E).
      orientation_available: "O_D-orientation: degree-|D| CM endomorphism"
      attack_relevance: "End fully computable → KLPT applies."
      count_per_discriminant: "h(-D) curves"
      total_feasible: "O((log p)^{3c/2}) for D_max = (log p)^c"
    - j_invariant: "any curve reachable by RECORDED walk from known curve"
      conditions: "walk from j=0 or j=1728, path recorded"
      end_ring: "O_R(I₁·I₂·...·Iₖ) via Deuring correspondence"
      why_known: "The recorded path IS the solution to path-finding"
      orientation_available: "Full End known (not merely orientation)"
      attack_relevance: >-
        Circular: knowing the path = knowing End. An adversary without the
        path cannot compute End. This is PROVER's knowledge (e.g. SQIsign
        secret key), not public.
    - j_invariant: "CSIDH public keys [a]·E₀"
      conditions: "E₀ fixed with known O-orientation"
      end_ring: "Contains O (partial); full End requires knowing [a]"
      why_known: "O-orientation is public by CSIDH construction"
      orientation_available: "Partial only: O ↪ End(E) but not full rank-4 lattice"
      attack_relevance: >-
        The hard problem is class-group-action vectorization (hidden shift),
        NOT EndRing. Reduces to Kuperberg/subexponential attacks.
  density_assessment:
    total_supersingular_curves: "~p/12"
    known_end_public_count: "2 + O((log p)^{3c/2})"
    known_end_fraction: "O((log p)^{O(1)} / p) → 0 as p → ∞"
    classification: measure_zero
    partial_orientation_count: "~√p (CSIDH F_p-rational locus)"
    partial_orientation_fraction: "12/√p → 0"
  implications_for_ssi_o2:
    trilemma: >-
      (A) Known End → trivial via KLPT, no walk needed.
      (B) CSIDH partial orientation → different problem (vectorization).
      (C) Generic curves → no orientation available.
    cgl_hash: "Starting curve End known (trivial); endpoint End unknown (the hard problem)"
    sqisign: "Prover knows End = secret; verifier does not; orientation is private"
    wesolowski_comparison: >-
      p^{1/3+o(1)} works on ALL curves without orientation. SSI-O2 cannot beat
      this: where it applies, problem is already easier; where it doesn't, inapplicable.
  pareto_resolution:
    ssi_o2_dominated_by:
      - Wesolowski-2026 (p^{1/3+o(1)} for all curves, no orientation)
      - Kuperberg-2011 (2^{O(√(log p))} quantum for CSIDH subproblem)
      - VW-collision (p^{1/2} generic path-finding, no orientation)
  lane_status: closed
  lane_closure_justification: >-
    Structural obstruction: the Deuring-correspondence dichotomy. Orientation
    either gives full End (trivializing via KLPT) or partial info that reduces
    to class-group-action vectorization (different problem with specialized attacks).
    No intermediate regime exists where orientation assists EndRing while it remains hard.
  named_obstruction: Deuring-correspondence dichotomy
  forward_guidance:
    what_remains_open:
      - CSIDH quantum attacks (SSI-Q1/Q2) — different problem, unaffected
      - Whether quantum algorithms exploit partial orientation differently
      - Novel partial-End sources escaping the dichotomy (requires new structural ingredient)
    revisit_condition: >-
      Discovery of an efficiently computable invariant of a generic supersingular
      curve revealing End(E) information beyond what is available from the curve
      equation alone, without being equivalent to solving EndRing.
  dominated_by: null
  sota_delta: >-
    Structural analysis resolving red-team control; no complexity claim.
    Confirms SSI-O2 dominated by Wesolowski, Kuperberg, VW on all axes.
