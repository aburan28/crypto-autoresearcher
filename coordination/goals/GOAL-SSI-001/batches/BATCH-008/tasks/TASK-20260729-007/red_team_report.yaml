red_team_report:
  id: RT-20260729-007
  task_id: TASK-20260729-007
  goal_id: GOAL-SSI-001
  batch_id: BATCH-008
  verdict: REVISE
  claim_under_review: >-
    TASK-20260729-005 claims that CSIDH-COLLIMATION-FC0-R1 concretely repairs
    O1-O5, aligns with KN-TECH-051 under the
    peikert_unconstrained_collimation_explicit_qracm posture, and that its one
    zero-compute worksheet supports disposition
    FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED before the separately unresolved
    uniform-oracle gate.
  exact_supported_final_claim: >-
    At immutable snapshot 5c8e1f65c32176fd973de0a173eeb73e52d1b98d,
    R1 materially improves the FC0 typing and the conservative disposition
    FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED is supported: no source-compatible
    end-to-end query, repeated-sieve, postprocessing, tail, and memory vector
    is instantiated. The stronger classification that O1-O5 are all
    adequately repaired is not supported. O2 is adequately repaired as a
    type rule; O1, O3, and O4 remain partial; O5 is a provisional conservative
    rule whose claimed source completeness cannot be checked from the
    committed evidence. No numeric-security, parameter, breakthrough, ECDLP,
    or GOAL-completion claim is supported.

  inference:
    requested_policy: review-xhigh
    resolved_model: GPT-5.6 Sol
    reasoning_effort: not_exposed
    fallback_used: true
    independent_session_required: true
    independent_session: true
    independence_limit: >-
      This is a separate red-team session and did not originate the producer
      artifacts. The runtime did not expose confirmation that the legacy
      review-xhigh alias or xhigh effort was actually served. The producer and
      reviewer both resolve to GPT-5.6 Sol, so model-level independence is not
      present; this review cannot count toward a distinct-model completion
      quorum or support a breakthrough claim.

  snapshot_review:
    reviewed_commit: 5c8e1f65c32176fd973de0a173eeb73e52d1b98d
    reachable_from_review_head: true
    review_head: ddb9e5c8fcb63e1b8b7fad2297489efc3d7ca952
    parent_commit: 80a39ade07c27fe578ea14d80a84bf477e8e3054
    exact_commit_scope:
      - coordination/goals/GOAL-SSI-001/batches/BATCH-008/archives/TASK-20260729-006/snapshot-receipt.json
      - coordination/goals/GOAL-SSI-001/batches/BATCH-008/tasks/TASK-20260729-005/classification.yaml
      - coordination/goals/GOAL-SSI-001/batches/BATCH-008/tasks/TASK-20260729-005/derivation_note.md
      - coordination/goals/GOAL-SSI-001/batches/BATCH-008/tasks/TASK-20260729-005/fc0_revision_note.md
    artifact_hashes_match_receipt: true
    verified_hashes:
      fc0_revision_note.md: 21dc3be577364d1ca698a056a04d1101b7afaa5b670b934c0f5dc55b95ba1cd8
      derivation_note.md: 6cf2e7af0e651340c066e824f97201bb7e2a1bd6ccad8c008e7ad7514ebf2d65
      classification.yaml: 35f3863a7b5df3be4d17748f230f40fe043dd6edea47531038adada05cf1b48b
      snapshot-receipt.json: ebf18d5b678ae684167e98c029146fa2bad247f3402ece4d8f190d42fecbd5f4
    receipt_declared_commit_sha: null
    receipt_verification_status: pending_post_commit
    receipt_limit: >-
      Git reachability, parent, exact changed paths, and all declared producer
      hashes passed independent checks. The committed receipt nevertheless
      still says pending_post_commit and commit_sha null, so dispatcher
      post-commit acceptance is not durable in the reviewed snapshot.

  o1_o5_assessment:
    all_adequately_repaired: false
    o1:
      result: partial_not_adequate
      reason: >-
        Per-invocation charging and removal of the generic success multiplier
        are valid improvements, but R1 equates a source aggregate with a sum
        over a stochastic realized invocation multiset without declaring
        expectation, quantile, or worst-case semantics. A single trace cannot
        in general reconcile exactly with an expected aggregate.
    o2:
      result: adequate_type_repair
      reason: >-
        The canonical classical tail is removed from quantum query, T-count,
        depth, and coherent width, while classical work and memory remain
        explicit unknowns. This repairs the prior double-counting/type defect;
        it does not instantiate a complete cost.
    o3:
      result: partial_not_adequate
      reason: >-
        Complete-channel diamond distance is a composable oracle contract, but
        epsilon_sieve, epsilon_post, and epsilon_tail are not defined in the
        same operational metric before being added to it. No committed source
        instantiates the required complete uniform channel.
    o4:
      result: partial_not_adequate
      reason: >-
        The global-live-register principle is correct, but the supplied table
        is a checklist of register classes rather than an instantiated
        liveness schedule with widths and allocation/deallocation boundaries.
        The max over one invocation also needs an explicit non-overlap proof or
        a global timeline if retries overlap.
    o5:
      result: provisional_not_source_verified
      reason: >-
        Reusing the enforced 8L QRACM cell cap as an Equation (4.1) upper bound
        can be conservative only if that cap is proved to bound every relevant
        phase vector. The snapshot does not contain the primary source text or
        an immutable excerpt establishing that implication, and d_i and
        delta_i are not typed in R1. source_complete true is therefore too
        strong.

  disposition_assessment:
    claimed: FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED
    supported: true
    qualification: >-
      The worksheet does not instantiate the attack schedule or a complete
      resource vector, so the query/recovery/memory semantics remain
      unreconciled. The expectation-versus-realized-trace defect strengthens
      that conservative disposition. It does not show that query semantics are
      the only obstruction: the uniform-oracle channel, coherent width,
      classical tail, and error semantics also remain unresolved.

  knowledge_alignment:
    kn_tech_051_aligned: true_with_qualification
    detail: >-
      R1 consistently chooses an explicitly reported QRACM row with no
      exogenous memory cap and refuses to import a SQALE resource-constrained
      row, matching KN-TECH-051's resource-model axis. However,
      "Peikert unconstrained" must remain the name of this local convention,
      not a source-verified attribution: KN-TECH-051 and KN-LIT-127 explicitly
      say the concrete Peikert costs and primary-source details were not
      verified.

  objections:
    - id: O1-R1
      severity: blocking
      title: Aggregate equality mixes expected and realized schedules
      detail: >-
        I_src includes stochastic discards, retries, recovery invocations, and
        stopping events, while the producer describes the source row through
        aggregate queries and expected recovered information. R1-Q writes an
        exact equality Q_tilde_total = sum_i Q_i without saying whether either
        side is a random variable, an expectation, a percentile, or a
        deterministic budget. R1-FULL and R1-ERR then sum other resources over
        the same undeclared object.
      required_revision: >-
        Define the stopping process and random variables for query, sieve,
        postprocessing, classical, and error costs. Choose one comparison
        statistic and apply it consistently; if an expected query count is
        used, derive expected repeated work rather than requiring one trace to
        equal the expectation.
    - id: O2-R1
      severity: evidence_blocker
      title: Exact source semantics and constants are not durable evidence
      detail: >-
        The producer attributes exact equation roles, revision dates, factor
        36, the 8L cap, and the 56-bit residual to primary papers, but no paper
        text or immutable excerpt is in the snapshot. KN-LIT-127 and
        KN-TECH-051 explicitly state that concrete query, memory, and security
        figures were not verified from a primary source. This does not prove
        invention, but it prevents an independent check and contradicts the
        unqualified source_complete claim for O5.
      required_revision: >-
        Archive source pages or exact excerpts with hashes and equation/page
        locators, then independently check every imported constant and
        semantic claim without mixing revisions.
    - id: O3-R1
      severity: blocking_for_pin_complete
      title: Error terms are not composition-typed end to end
      detail: >-
        eta_i_j is diamond distance between complete channels, but the sieve,
        postprocessing, and tail epsilon terms are added without definitions
        as channel distances or operational failure bounds. A scalar failure
        probability cannot be inserted into the same expression without a
        theorem relating it to the chosen final distinguishing or failure
        metric.
      required_revision: >-
        Give every error term a domain and metric, state the final operational
        guarantee, and derive the hybrid/union bound that maps each component
        into that guarantee.
    - id: O4-R1
      severity: blocking_for_pin_complete
      title: Register categories are not a liveness schedule
      detail: >-
        R1-WIDTH fixes the right principle but no register widths, births,
        deaths, overlap events, or reuse proof are supplied. The retry row
        allows overlap conditionally, while max_i_t is naturally scoped to one
        invocation.
      required_revision: >-
        Instantiate a global schedule table with register sizes and
        allocation/uncomputation times. Either forbid invocation overlap and
        prove cleanup at boundaries or maximize over a global timeline that
        includes every overlapping invocation.
    - id: O5-R1
      severity: blocking_for_source_complete
      title: The Equation 4.1 cap implication is unverified
      detail: >-
        Numerically setting the typical-length upper bound to a QRACM hard cap
        is conservative only if the latter is an enforced bound on the same
        phase vectors throughout the charged traversal. R1 asserts but does
        not durably source that implication and leaves d_i and delta_i
        undefined.
      required_revision: >-
        Pin the exact source statement proving the cap applies to every
        charged vector, type d_i and delta_i, and retain the factor-eight
        sensitivity. Otherwise mark O5 source_complete false.
    - id: O6-R1
      severity: procedural_blocker
      title: Snapshot receipt still records pending verification
      detail: >-
        The snapshot commit and hashes pass manual Git checks, but its receipt
        has commit_sha null and verification.status pending_post_commit.
      required_revision: >-
        Obtain and durably record the Coordinator-only dispatcher post-commit
        verification before any official state transition.

  required_controls:
    - id: C1
      control: >-
        Stochastic-schedule mutation: use a geometric number of identical
        sieve invocations with expected aggregate query count equal to the
        source Q_tilde_total, then compare two realized traces.
      pass_condition: >-
        R1 does not require either trace to equal the expectation and reports
        query, repeated sieve, postprocessing, and tail costs under one
        explicitly chosen expectation or percentile semantics.
    - id: C2
      control: >-
        Source-anchor check: for every imported constant and equation role,
        match an immutable primary-source excerpt, revision hash, page, and
        equation locator.
      pass_condition: >-
        Factor 36, 8L, the residual-bit count, aggregate-query meaning, and
        Equation (4.1) cap implication all match one declared source revision.
    - id: C3
      control: >-
        Error-unit mutation: keep eta_i_j fixed but reinterpret epsilon_tail
        as an average failure probability concentrated on one input region.
      pass_condition: >-
        The row refuses the addition until both quantities are mapped to one
        final operational metric.
    - id: C4
      control: >-
        Liveness mutation: retain a recursion frontier across a fresh sieve
        retry while allocating the next oracle's scratch registers.
      pass_condition: >-
        Either the schedule rejects overlap or the reported global width
        includes both invocations and all caller-owned registers.
    - id: C5
      control: >-
        Resource-posture mutation: impose a finite quantum-accessible-memory
        cap on the R1 row while retaining its Peikert constants.
      pass_condition: >-
        The worksheet rejects the mutation and requires a separately named,
        source-consistent resource-constrained convention.
    - id: C6
      control: >-
        Numeric-creep mutation: turn the query aggregate, factor-eight
        sensitivity, or QRACM amount into security bits, a NIST level, or a
        parameter recommendation.
      pass_condition: >-
        The gate rejects the row until all typed resources, architecture,
        scheduling statistic, physical costs, and baseline comparison are
        complete.

  counterexample_or_mutation: >-
    Cheapest discriminator: let each top-level invocation cost q queries and
    s non-oracle work, and let the number of invocations R be geometric. Then
    Q_tilde_total = E[R]q can be source-compatible while no ordinary realized
    trace satisfies sum_i Q_i = Q_tilde_total. If R1 insists on exact trace
    equality, O1 is not repaired; if it means expectation, it must also charge
    E[R]s and define expectation or tail bounds for every other resource.

  baseline_comparison:
    pollard_rho: >-
      A generic CSIDH vectorization comparator would charge approximately
      square-root class-group-order action evaluations under its stated action
      model, with low generic memory. No complete R1 action-oracle cost or
      attack statistic exists, so no concrete or asymptotic advantage over
      this comparator is established.
    bsgs: >-
      Generic BSGS/MITM uses square-root class-group-order action work and
      square-root storage. R1 emits no complete time-memory point and therefore
      cannot establish dominance, equality, or a security delta relative to
      BSGS.
    closest_specialized: >-
      The closest specialized baseline is the exact final Peikert binary
      collimation-sieve query/QRACM row under the same source revision and
      memory posture. Bonnetain-Schrottenloher is only a convention cross-check
      and SQALE is a distinct resource-constrained row; neither may supply
      missing Peikert constants.
    conclusion: >-
      No end-to-end resource point was emitted, so the producer's zero
      algorithmic-improvement entries mean "no new attack claimed," not a
      measured zero delta against the frontier.

  heuristic_challenges:
    - >-
      The stopping/retry distribution is an implicit probabilistic assumption.
      It must be explicit before expected aggregate queries can be transferred
      to expected or high-probability non-oracle work.
    - >-
      A source- or code-derived single trace is not evidence that the aggregate
      statistic is correct; repeated or exact analytic reconciliation is
      required.

  cost_model_challenges:
    - >-
      Query, repeated sieve work, postprocessing, classical tail, width, QRACM,
      and error must share a declared attack statistic and stopping rule.
    - >-
      Unknown resources are honestly named, but they remain uncharged and
      prohibit any numeric or Pareto comparison.
    - >-
      A QRACM cap is not interchangeable with ordinary coherent width or with
      a resource-constrained adversary budget.

  reduction_and_scope_challenges:
    - >-
      The worksheet does not instantiate the complete hidden-shift oracle or
      source-recovery path, so it is not an end-to-end CSIDH key-recovery cost.
    - >-
      Nothing here transfers to SIDH/SIKE, CGL/SQIsign path finding, ECDLP, or
      the closed IDEA-20260725-001/002/003 lanes.
    - >-
      The disposition is a control-gate result, not evidence that CSIDH is
      secure or insecure and not a resolution of KN-OPEN-014.

  scope_limits:
    - >-
      Review is limited to the Coordinator-committed snapshot and the exact
      Peikert-unconstrained, explicit-QRACM convention named by the producer.
    - >-
      No primary paper, curve, isogeny, simulator, or quantum circuit was
      executed or independently reproduced.
    - >-
      Failure to reconcile this transcription does not falsify the Peikert
      algorithm or any hidden-shift attack.
    - >-
      No numeric-security, NIST-level, parameter-size, breakthrough, or
      completion statement is admissible.

  pareto_assessment:
    applicable_attack_point: false
    dominated_by: not_evaluable_incomplete_resource_vector
    sota_delta:
      query: not_claimed
      time: not_claimed
      memory: not_claimed
      data_or_oracle: not_claimed

  narrowest_supported_statement: >-
    CSIDH-COLLIMATION-FC0-R1 is a materially improved but still incomplete
    accounting schema. It correctly blocks a numeric row at
    FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED and keeps the later uniform-oracle
    boundary visible. It does not yet justify o1_o5_all_addressed true,
    source_complete true for O5, or any attack/security comparison.
  breakthrough_claim_detected: false
  numeric_security_claim_detected: false
  parameter_recommendation_detected: false
  goal_completion_claim_detected: false
  goal_completion_criteria_met: false
  closed_lane_reopened: false
  official_state_changed: false
  query_memory_disposition_supported: true
  next_concrete_action: >-
    Build one source-anchored stochastic invocation ledger: archive the exact
    primary-source excerpts, define the stopping distribution and resource
    random variables, and reconcile aggregate queries with repeated sieve,
    postprocessing, tail, memory, and error under one declared statistic.
    Preserve FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED until that control passes.
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-008/tasks/TASK-20260729-007/red_team_report.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-008/tasks/TASK-20260729-007/falsification_review.md
