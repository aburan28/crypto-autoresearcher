disposition: FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED
disposition_basis: >-
  Peikert Figure 1 pins an attack-aggregate query count and a compatible QRACM
  row, but does not expose the exact top-level recovery/retry ledger needed to
  charge Equation 4.1 and postprocessing once per invocation. Because the
  query/recovery schedule is the first-stage gate, it determines the
  disposition even though the uniform-oracle boundary also remains unresolved.

forward_guidance: >-
  Obtain a source- or code-derived top-level invocation trace whose summed
  complete-oracle queries reconcile exactly with Q_tilde_total and whose every
  sieve, postprocessing, and classical-tail event is separately charged.

