objection_mapping:
  o1:
    mapped_to_concrete_change: true
    change: >-
      Preserve source aggregate Q_tilde_total and replace the scalar
      success-multiplied equation with sums over a source invocation multiset,
      charging query, sieve, postprocessing, classical work, and failure for
      every invocation.
    equations: [R1-Q, R1-FULL]
    source_complete: false
    residual: >-
      The source does not enumerate the exact recovery/retry invocation and
      stopping ledger needed to sum repeated sieve and postprocessing work.
  o2:
    mapped_to_concrete_change: true
    change: >-
      Type the canonical residual search as classical, set all quantum-tail
      resources to zero, and separately require classical action work, memory,
      stopping, verification, and failure.
    equations: [R1-TAIL-Q, R1-TAIL-C]
    source_complete: false
    residual: classical unit cost, memory, and stopping certificate are unpinned
  o3:
    mapped_to_concrete_change: true
    change: >-
      Replace the scalar oracle-failure union bound with a complete-channel
      diamond-distance contract and adaptive hybrid composition; reject
      input-correlated conditioning without a distribution-preservation proof.
    equations: [R1-ORACLE-ERR, R1-ERR]
    source_complete: false
    residual: >-
      The favorable-distribution action source does not instantiate the
      uniform complete labeled-state channel.
  o4:
    mapped_to_concrete_change: true
    change: >-
      Define peak coherent width from a schedule-level live-register set and
      require leaf, collimation, postprocessing, and retry-boundary liveness
      rows including caller-owned phase states.
    equations: [R1-WIDTH, R1-QRACM-PEAK]
    source_complete: false
    residual: source-level whole-attack register widths are unpinned
  o5:
    mapped_to_concrete_change: true
    change: >-
      Separate the QRACM hard cell cap from the Equation 4.1 typical-length
      upper-bound type; use the enforced cap as a conservative source-derived
      upper bound and preserve interval sensitivity.
    equations: [R1-4.1, R1-4.1-SENS]
    source_complete: true
    residual: null
  o1_o5_all_addressed: true
  addressed_meaning: >-
    Every objection has a concrete equation or typing repair. Addressed does
    not mean that every required source value is resolved.

