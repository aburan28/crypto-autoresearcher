        failure. Recommend a future harness harden the clearance scan to an
        allowlist / string-truthiness scan symmetric with the numeric guard.
      blocks_confirm: false
    - id: OBJ-2
      severity: minor
      title: >-
        peak_byte_bound=24 carries near-zero information beyond "M is the
        stipulated-heaviest class"; the max-over-stages selector is trivially
        M-dominated.
      detail: >-
        tail_verification=24 is driven entirely by M_tail (M=16); without M its
        load is 8 and the peak stage would flip to sieve_attempt (18). The peak
        STAGE identity is therefore an artifact of the arbitrary stipulated
        ordering (M heaviest), not of any structural memory fact about
        tail_verification. The two-level operator is genuinely exercised
        (within-stage additivity yields sieve=18; across-stage max<sum is shown
        by 67>24), so the demonstration is real, but the headline number 24 is a
        low-content restatement of "M=16 plus four B=2 slots." This bounds what
        the gate demonstrates; it does not invalidate it. The producer already
        states the magnitudes are arbitrary and meaningless outside the document.
      blocks_confirm: false
    - id: OBJ-3
      severity: informational
      title: >-
        Committed harness_receipt.json corresponds to a full-tree run
        (cross_batch023 found:true), not the execution-time run the report
        describes (found:false at HEAD c36cad125).
      detail: >-
        instantiation_report.md §5 honestly discloses that at execution time the
        BATCH-023 file was not materialized, so the best-effort cross-check
        recorded found:false; the committed receipt shows found:true. The
        committed receipt is thus a regenerated full-tree artifact, not the exact
        c36cad125 execution-time artifact. This is disclosed, non-fabricated, and
        my independent re-run reproduces the committed receipt byte-for-byte with
        BATCH-023 membership independently verified equal to canonical. Substance
        is sound; noting only that the receipt's provenance is "full-tree
        reviewer run," which is exactly the stronger check.
      blocks_confirm: false
    - id: OBJ-4
      severity: informational
      title: >-
        model_verified:false — resolved model identifier was not probe-verified.
      detail: >-
        classification.yaml records model_verified:false with an authorized
        fallback amendment. Acceptable for a zero-compute scaffold gate that
        makes no cryptographic claim; flagged for ledger completeness only.
      blocks_confirm: false

