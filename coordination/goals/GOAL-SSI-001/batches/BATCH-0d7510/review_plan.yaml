    quantity: 'THE ROUTED-ITEM LIST: the set of items DEC-20260909-e7a4fe routes to successor records - the
      exactly_six_items_nothing_beyond list plus the F-2/F-3+CF-22 item, the AF-2 letter, the W_1 surface, and the
      leak-discipline narrowness.'
    who: TASK-20260910-a089be, at J1.
    blind_from:
    - The register (successor_item_register.yaml). The reviewer re-derives the routed-item list from DEC-e7a4fe's text
      ALONE FIRST, records its own list, and only then reads the register and compares. Agreement is then evidence
      about the register's completeness; disagreement localises to one of two named derivations of one committed
      routing - never resolved by preferring either.
    why_this_and_not_a_full_blind_phase: 'This is the strongest blind object this batch has, and it is WEAKER than a
      true blind phase (CF-15''s first limb, owed and recorded as owed in batch.yaml): the reviewer re-derives the
      LIST, not the object - the locators and classifications are properties of committed records the reviewer must
