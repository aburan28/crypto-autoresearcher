    element_5_the_prerequisites_evaluation_stays_an_evaluation: ~0.8 that the prerequisites evaluation stays an
      evaluation - no runs authorized, no candidate-1 decision. The evaluation was deliberately NOT bundled into this
      batch; the residual 0.2 is the drift from evaluation to decision that J5 exists to catch.
    element_6_the_batch_commits_this_round: '~0.55. The honest composite of elements 1-3 and 5: a complete register,
      in-bounds record groups, an all-holds review, and an evaluation that stays an evaluation on the first pass
      through. If any fails, the batch returns to the Coordinator and the composing decision waits for a scoped
      successor - which is a recorded outcome, not a stall, and does not pause the goal.'
    what_i_would_not_have_guessed: 'Recorded so the comparison is honest later: I expect the most informative surprise,
      if one comes, to be at J4 - a W_1 landing on the adopted RT-4 ruling would be the round''s most informative
      result and is the outcome DEC-e7a4fe''s honest_assessment does not expect.'
