    required: true
    assigned_to: TASK-20260910-a089be
  procedure_deviations_rule: Departures from this plan go in the review's and the composing decision's
    procedure_deviations - acting before a report returns, reassigning a joint, dropping a control, or lifting
    blindness beyond what is declared here. None is self-documenting; a review protocol silently deviated from is
    worth less than one never declared.
