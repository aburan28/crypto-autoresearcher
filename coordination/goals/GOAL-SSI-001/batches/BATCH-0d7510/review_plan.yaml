    element_4_the_w1_attack_does_not_land: '~0.6 that the W_1 attack does NOT land - that the adopted RT-4 ruling
      survives the merits attack. DEC-e7a4fe''s honest_assessment is that the ruling holds; the attack is owed because
      the ruling was adopted with its merits attacked by nobody, not because a landing is expected. A landing would be
