# REVIEW PLAN OF BATCH-0d7510 - WRITTEN AND COMMITTED BEFORE ANY PRODUCER RUNS.
# The Coordinator's prior is recorded here FIRST. A prior the round overturns is
# among the most valuable results this programme can produce and is worthless if
# softened afterwards.
review_plan:
  batch_id: BATCH-0d7510
  goal_id: GOAL-SSI-001
  review_task_id: TASK-20260910-a089be
  written_by: coordinator
  written_at: '2026-09-10'
  written_before_any_producer_ran: 'TRUE AND CHECKABLE: this file is committed with the control plane at opening, and
    the first producer task is dispatch-eligible only after that commit. The opening decision DEC-20260910-442bd5 is
    written with the control plane at opening and committed at the ledger archive (TASK-20260910-8c491d) as the
    composing decision, finalized only as the review''s recorded findings require. The git history is the proof.'
  the_claim_under_review: 'NOT A MATHEMATICAL CLAIM. The object reviewed is a SUCCESSOR-RECORDS PACKAGE: the successor
    item register locating every item DEC-20260909-e7a4fe routes to successor records, the three record groups that
    correct letters and route defects, and the W_1 standing merits attack on the adopted RT-4 ruling. The review
    question is whether that package, if committed as-is, would carry exactly the routed items it declares - no more,
    no less, nothing unreviewed smuggled in - without promoting any claim, editing any immutable artifact, or
    escalating the review tier.'
  reviewer_shape:
    count: 1
    role: validator
    policy: review-adversarial at xhigh
    independent_session: REQUIRED - a session that did not compose the register or any record group.
    blindness:
      lifted_for: 'THE REVIEWER, BY NAME AND DELIBERATELY: it reads the register, all three record groups, the W_1
        attack record, the redraft, the adopted RT-4 ruling, the analysis it points to, DEC-20260909-e7a4fe, and this
        plan, because reviewing the successor records against their routing authority requires the whole declared
        context.'
      lifted_against_whom: There is no sibling reviewer in this round; the lift is against the producers' reports
        only in the sense declared at blind_rederivation below. The round is SESSION-INDEPENDENT AND NOT MODEL-INDEPENDENT,
        stated in advance, as every round of this campaign has done since PD-8.
      containment_note: 'The three record-group producers are NOT separated from each other by design this round: each
        reads the register (it must, to author against its locators). The protection that replaces separation is ORDER
        plus SNAPSHOT plus REVIEW: the register is complete and frozen before the record groups author, all four are
        frozen again at the snapshot before the reviewer reads, and the reviewer checks at J1 whether the register is
        complete and at J2/J3 whether any record group promotes or edits an immutable artifact - a violation is a FAIL.'
  joints:
  - joint: J1
    assigned_to: TASK-20260910-a089be
    attack_plan: 'RE-DERIVE FIRST: from DEC-20260909-e7a4fe''s text ALONE (exactly_six_items_nothing_beyond, na_2_iii,
      the AF-2 letter, w_1_merits_attack, the leak-discipline narrowness), re-derive the routed-item list WITHOUT
      reading the register (see blind_rederivation). Record your own list. THEN read the register and compare item by
      item: every item you derived must appear with a verified record path and line/field locator, and every item the
      register lists must be one you derived - an extra item is over-reach, a missing item is an omission. Run OBJ-A:
      plant an omitted item in a scratch register and confirm your completeness check catches it; if it does not, the
      check is vacuous and this joint is FAIL. Open three random named locators yourself and confirm they resolve; a
      locator that does not resolve is a FAIL.'
    question: 'Is the register COMPLETE and EXACT: does it carry every item DEC-20260909-e7a4fe routes to successor
      records at a verified record path and line/field locator, and nothing beyond them?'
    where_i_think_it_breaks: 'At the seam between the exactly_six_items_nothing_beyond list and the four additional
      routed items (F-2/F-3+CF-22, the AF-2 letter, the W_1 surface, the leak-discipline narrowness) - the six-item
      list is the easy part; the four additions are the ones a hurried register drops or mislocates.'
  - joint: J2
    assigned_to: TASK-20260910-a089be
    attack_plan: 'Record by record against the disposition classes the register names: (i) the F-2/F-3 warrant-defect
      record corrects the warrant''s LETTER and routes CF-22 to the warrant in DEC-20260905-5f5592 and EV-SSI-2aaf6f
      OBS-11 WITHOUT asserting the R3 warrant sentence is wrong - the stronger claim stays UN-PROMOTED; (ii) the AF-2
      letter record corrects the LETTER of prerequisites_before_such_a_decision[1] as a NEW record; (iii) the record
      groups B and C carry their items without resolving any beyond carrying it. THEN ATTACK THE OTHER DIRECTION: any
      promotion language, any claim-tier inflation, any status change, any assertion that the R3 warrant is wrong, is
      over-reach and this joint is FAIL. Run OBJ-B: plant promotion wording in a scratch record and confirm your
      boundary check catches it; if it does not, the check is vacuous and this joint is FAIL.'
    question: 'Do the successor records stay within their disposition boundaries - correcting letters and routing
      defects, with the stronger R3-warrant claim UN-PROMOTED - and promote nothing?'
    where_i_think_it_breaks: 'At the F-2/F-3 record: the temptation to assert the R3 warrant sentence is wrong (the
      stronger claim) rather than correct its letter and route CF-22 - the exact promotion this batch exists to avoid
      under IMP-1.'
  - joint: J3
    assigned_to: TASK-20260910-a089be
    attack_plan: 'Check the changed-path set of the snapshot against the immutable-artifact list: the redraft, the
      enacted specification.yaml, the enacted cost_model.py, DEC-20260905-5f5592, EV-SSI-2aaf6f, the BATCH-314308
      source records, and every committed decision, evidence, review, and checkpoint record. ANY immutable path in the
      changed set is a FAIL. Verify every correction travels as a NEW file that names the immutable record it corrects
      or routes - a correction that edits the immutable record in place is a FAIL. Confirm the snapshot commit changed
      exactly the declared producer paths and nothing else.'
    question: 'Does the letter-correction discipline hold - every correction a NEW record, no immutable path in the
      changed set, the immutable artifacts named but never edited?'
    where_i_think_it_breaks: 'At the AF-2 letter: a correction that edits the redraft''s prerequisites_before_such_a_decision[1]
      in place rather than naming it from a NEW record - the quietest way to violate immutability.'
  - joint: J4
    assigned_to: TASK-20260910-a089be
    attack_plan: 'Re-open the COMMITTED RT-4 ruling bytes (rt4_licensing_ruling.yaml) and the analysis it points to
      (category_and_licensing_analysis.yaml, analysis.licensing) yourself, and re-verify the W_1 attack against them:
      both readings of the licensing condition worked out, the licensing-condition search, and the named counterfactual
      (or its recorded absence). A landing must be recorded UN-PROMOTED with its named route to POSITION 2 (review-breakthrough
      at max, unservable under IMP-1) - a landing presented as a promotion, a closure, or a contradiction of a validated
      evidence record is a FAIL. Run OBJ-C: run the W_1 attack procedure against a KNOWN-DISCHARGED control ruling and
      confirm it does NOT report a landing; if it does, the attack procedure is artifactual and this joint is FAIL.'
    question: 'Is the W_1 attack executed and honest - both readings plus the licensing-condition search, re-verified
      against the committed RT-4 bytes, with any landing recorded UN-PROMOTED and never promoted on a lower tier?'
    where_i_think_it_breaks: 'At the licensing-condition search: a search that names a counterfactual but does not
      cite where it bites is ceremony, and a landing that reads as a promotion rather than an UN-PROMOTED finding is
      the tier violation this joint exists to catch.'
  - joint: J5
    assigned_to: TASK-20260910-a089be
    attack_plan: 'Read the prerequisites_evaluation section of the register against the redraft''s
      amendment.enactment.prerequisites_before_such_a_decision (lines 1142-1146) and the runs-authorization-specific
      prerequisites DEC-e7a4fe names (the clause_4 raw-output status, na_2_i; the AF-4 interval ruling). Each
      prerequisite must appear with its current discharge status and a locator. The section must be marked an
      EVALUATION, not a decision - any runs authorization, any candidate-1 decision, any bundled decision is a FAIL.
      Confirm the evaluation does not authorize any run and does not make the candidate-1 decision.'
    question: 'Is the candidate-1 prerequisites evaluation an EVALUATION - each prerequisite''s discharge status with
      locators, no runs authorized, no candidate-1 decision made or bundled?'
    where_i_think_it_breaks: 'At the boundary between evaluation and decision: a prerequisites evaluation that drifts
      into authorizing runs or deciding candidate 1 is the over-reach this joint exists to catch - the evaluation was
      deliberately NOT bundled into this batch.'
  coordinator_prior:
    recording_rule: RECORDED BEFORE ANY PRODUCER RAN, element by element, with the losses first when compared later.
      These are the Coordinator's honest degrees of belief at control-plane authoring, not aspirations.
    element_1_the_register_comes_back_complete: ~0.75 that the register returns complete and exact against the routed
      list on the first attempt. The routed list is fully specified in DEC-e7a4fe and the locators were verified at
      control-plane authoring; the residual 0.25 is the four additional routed items (F-2/F-3+CF-22, the AF-2 letter,
      the W_1 surface, the leak-discipline narrowness) that a hurried register drops or mislocates.
    element_2_the_record_groups_stay_in_bounds: ~0.7 that all three record groups stay within their disposition
      boundaries - correcting letters and routing defects, the stronger R3-warrant claim UN-PROMOTED, no immutable
