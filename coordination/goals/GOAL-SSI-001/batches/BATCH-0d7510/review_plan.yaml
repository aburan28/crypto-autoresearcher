      residual 0.3 is the F-2/F-3 record's temptation to assert the stronger claim.
    element_3_the_review_returns_all_holds: '~0.5 that all five joints come back holds with no FAIL. This package is
      smaller than the enacting batch but the controls are sharp (three named null objects, a blind re-derivation, a
      real merits attack owed at J4), and a review round whose prior is near-certainty of agreement measures the
