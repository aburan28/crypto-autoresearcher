  metric_recomputations:
    - metric: named_integer_widths_and_finite_ranges
      status: partial_pass
      result: >-
        The stated fixed widths are internally legible: u8/u16/u32/u64 are
        1/2/4/8 bytes with the listed unsigned ranges; digest is 32 bytes;
        BI560/SIGNED560 is 1 sign byte plus 70 magnitude bytes, hence 71 bytes,
        with negative zero forbidden and magnitude below 2^560. Bytestrings
        carry a u32 length. The fixed maxima for payload, blobs, matrices,
        factors, witnesses, events, traces, and output are finite and explicit.
        The residual is that several frame-specific tags, payload field bounds,
        and derived total-size inequalities are not assigned explicitly enough
        to make every named object independently serializable.
      references:
        - experiments/EXP-SSI-9d821a/specification.yaml:96-151
        - experiments/EXP-SSI-9d821a/specification.yaml:153-192
    - metric: serialized_size_formulas
      status: partial_pass
      result: >-
        The vertex, order, helper blob, helper frame, index, source, matrix,
        event, and output formulas are arithmetically coherent where their
        operands are defined. For example, the maximum vertex manifest is
        516000339 bytes at curve_id_bytes=129 and vertex_count=4000000; the
        maximum index payload is 1024000172 bytes and its frame is 1024000178;
        the maximum matrix payload is 18612264 bytes; the maximum event trace
        bound is 57200142 bytes; and the output formula is 138+71*witness_count.
        The certificate, request, terminal, and complete builder-stream sizes
        do not have equally complete declared formulas or total bounds.
      references:
        - experiments/EXP-SSI-9d821a/specification.yaml:194-229
        - experiments/EXP-SSI-9d821a/specification.yaml:430-501
    - metric: c_helper_slot_and_payload
      status: slot_pass_payload_incomplete
      result: >-
        The C-HELPER-v4 occupied slot recomputes to exactly 96 bytes:
        1+1+32+8+8+8+4+32+2. Empty slots are also explicitly 96 zero bytes,
        and the helper capacity bound gives 524288*96=50331648 bytes. The
        separate framed payload blob, range offset/length/digest, factor list,
        and matrix frame repair the v8 377-byte-versus-96-byte contradiction.
        Exact helper payload byte totals and frame tags for all nested payload
        objects remain unspecified, so the downstream helper is not yet fully
        byte-recomputable.
      references:
        - experiments/EXP-SSI-9d821a/specification.yaml:267-320
        - coordination/goals/GOAL-SSI-001/batches/BATCH-726c16/reviews/TASK-20260809-d2b66e/validation_report.yaml:149-172
    - metric: target_index_query_wiring_and_width
      status: partial_pass
      result: >-
        The SELECTION-MAP payload is 4*5+32=52 bytes, the index record is
        exactly 128 bytes from 1+8+1+1+32+8+4+32+32+9, and the maximum record
        product is covered by the 172-byte static header term. The query key
        includes target_manifest_digest, advice_commit_digest, target_index,
        selection_code, selection_map_digest, and the exact C-helper pair_key.
        The residual is that the query-attempt seed is written as raw
        tag||version||fields at line 425 rather than an explicit outer frame
        including payload_len, contrary to the universal framing rule.
      references:
        - experiments/EXP-SSI-9d821a/specification.yaml:321-360
        - experiments/EXP-SSI-9d821a/specification.yaml:419-428
    - metric: finite_builder_stride_terminal_and_stream
      status: partial_pass
      result: >-
        Endpoint frames recompute to 6+506=512 bytes and owner strides to
        6+4090=4096 bytes. The terminal codes, precedence, zero-request rule,
        null-stride padding, stream digest, and finite-owner-exhausted terminal
        are explicit. However, requested_owner_count*4096 bounds only the
        fixed strides: the request frame and terminal frame are omitted from
        the source/object totals, terminal_reason has no explicit maximum, and
        the non-null owner-record tag/version and complete null-record field
        layout are not numerically specified.
      references:
        - experiments/EXP-SSI-9d821a/specification.yaml:161-192
        - experiments/EXP-SSI-9d821a/specification.yaml:362-428
    - metric: phase_separated_foe
      status: partial_pass
      result: >-
        The event payload recomputes to 137 bytes and the complete event frame
        to 143 bytes. The primitive cost rules correctly distinguish operation,
        byte, and SHA-256 block charging, and phase 0/phase 1 are declared
        disjoint with setup excluded from T_attempt. The named setup_events and
        query_events are not mapped one-to-one to numeric event_code values or
        a complete event schedule, and the finite attempt distribution behind
        E[W] and q_cap is not materialized. Exact FOE rows therefore cannot yet
        be regenerated from a future trace solely from this text.
      references:
        - experiments/EXP-SSI-9d821a/specification.yaml:430-478
    - metric: phase_separated_memory
      status: incomplete
      result: >-
        The memory entries name the intended stage-0 and query buffers and use
        serialized sizes or explicit maxima. The table tuples contain a stage
        and ordering index but no start/end or lifetime interval, while the
        memory rule depends on overlapping live ranges. Consequently M_advice
        and M_work cannot be independently recomputed as maxima of an explicit
        set of intervals. Certificate mirror and source terms are also upper
        bounds rather than fully materialized per-object byte receipts.
      references:
        - experiments/EXP-SSI-9d821a/specification.yaml:215-229
        - experiments/EXP-SSI-9d821a/specification.yaml:479-501

