  verdict: incomplete
  review_verdict: DISSENT_ON_FREEZE_BYTE_RECOMPUTABILITY_AND_EXECUTION_READINESS
  verdict_scope: >-
    Independent static validation of the immutable SSI v9 design snapshot only.
    The report concurs with the design-only and no-execution boundary, but does
    not concur that the v9 contract has met its freeze or byte-recomputability
    gate.
  limitations:
    - >-
      Snapshot provenance is readable and path-hash verified, but its immutable
      receipt remains commit_sha:null with pending_post_commit status; this is
      an archival condition, not research evidence.
    - >-
      Fixed widths and the repaired 96-byte helper, 128-byte index, 512-byte
      endpoint, 4096-byte owner, 143-byte event, matrix, and output arithmetic
      are coherent, but nested frame tags, exact payload lengths, and several
      digest preimages are not fully assigned.
    - >-
      The query-attempt seed omits the universal frame payload_len in its
      written preimage, so seed bytes are not uniquely defined under the stated
      canonical wire grammar.
    - >-
      Builder total-size bounds omit request and terminal overhead, terminal
      reason has no explicit maximum, and null/non-null record layouts do not
      enumerate all numeric widths and tags.
    - >-
      The FOE primitive rules are present, but named event populations are not
      mapped to numeric event codes and the memory table lacks explicit live
      range endpoints.
    - >-
      Certificate/provider/mirror and HNF/output contracts are materially
      improved but still lack complete source/artifact equality, total size,
      finite operation, factor-to-matrix, and witness semantics.
    - >-
      Paired replay/null has a declared shared trace and deterministic mutation,
      but branch-null zero/exhaustion behavior and serialized replay material
      remain open.
    - >-
      C-pair and synthetic manifests are design manifests only: rows/cells and
      independent verification receipts are absent, so their declared missing
      material is INVALID_CONTROL and not a research result.
    - >-
      INCUMBENT-FOE-v1 is correctly pending with null exact values and no source
      receipt; comparison, break-even, freeze, and improvement claims remain
      inadmissible.
    - >-
      No experiment, diagnostic, cryptanalytic computation, scientific metric,
      hypothesis transition, or official research-state transition was made.
