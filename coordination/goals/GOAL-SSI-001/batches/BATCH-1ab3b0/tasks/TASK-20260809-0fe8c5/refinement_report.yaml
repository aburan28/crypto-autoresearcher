refinement:
  id: TASK-20260809-0fe8c5
  batch_id: BATCH-1ab3b0
  goal_id: GOAL-SSI-001
  candidate_id: IDEA-20260806-9c2f80
  successor_experiment: EXP-SSI-9d821a
  predecessor_experiment: EXP-SSI-16649a
  status: design_only
  execution_authorized: false
  claim_ceiling: >-
    No observation, attack, security, exponent, novelty, hypothesis transition,
    or completion claim is made.
  repairs:
    - id: R1
      issue: universal_frame_ambiguity
      repair: >-
        Every v9 object is tag||version||payload_len||payload; all local layouts
        describe payload bytes only and every digest preimage names full frames.
    - id: R2
      issue: helper_slot_impossibility
      repair: >-
        C-HELPER-v4 uses an exact 96-byte metadata slot with offset/length/digest
        pointers into one separately framed helper payload blob containing the
        actual factor and matrix bytes.
    - id: R3
      issue: query_and_advice_wiring
      repair: >-
        ADVICE-COMMIT-v4 excludes target fields; the query key uses the exact
        C-helper pair-key domain, target manifest digest, advice digest, and an
        explicit four-entry selection map.
    - id: R4
      issue: finite_fields_and_terminals
      repair: >-
        v9 assigns widths and finite inequalities to every scalar, uses fixed
        4096-byte builder strides, enumerated terminal codes and precedence,
        explicit null padding, stream identity, and finite exhaustion.
    - id: R5
      issue: accounting_overlap
      repair: >-
        Phase-0 setup and phase-1 query event sets are disjoint. Event payloads
        state operation, byte, hash-block, FOE, and operand-digest equations;
        memory uses an explicit live-range table.
    - id: R6
      issue: certificate_hnf_output
      repair: >-
        EDGE-CERT-v4 binds target/advice identity, transition frames, root,
        provider signature, mirror digest, horizon, and path bytes. MATRIX-v4,
        OP-LOG-v4, SATURATION-v4, and OUTPUT-v4 close the only positive path.
    - id: R7
      issue: controls_and_incumbent
      repair: >-
        Paired replay separates shared trace from final identity, branch nulls
        have a deterministic owner mutation, and C-pair/synthetic manifests
        specify finite rows, seeds, rational fields, censoring, and invalid
        control states. The incumbent remains a required external measurement.
    - id: R8
      issue: finite_size_and_width_residuals
      repair: >-
        v9 fixes maxima so the vertex manifest, target index, builder source,
        helper slots, matrix, trace, and output all fit their named bounds. It
        defines exact serialized-size formulas, a fixed 143-byte event frame,
        per-primitive cost rules, and the signed 560-bit alias.
    - id: R9
      issue: control_seed_materialization
      repair: >-
        C-pair and synthetic controls enumerate finite index domains and exact
        seed/target derivation bytes, with row and cell digest preimages. They
        remain design manifests without measured rows or cells.
  protected_history:
    - experiments/EXP-SSI-16649a/specification.yaml
    - ledger/evidence/EV-SSI-a5f9a7.yaml
    - ledger/decisions/DEC-20260809-f5eca6.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-726c16/reviews/TASK-20260809-d2b66e/
    - coordination/goals/GOAL-SSI-001/batches/BATCH-726c16/reviews/TASK-20260809-5ef381/
  hard_gates:
    - direct predecessor and review paths exist
    - no execution or evidence eligibility is granted
    - pending incumbent and control manifests block freeze
    - all predecessor bytes remain unchanged
  completion_gate:
    - YAML parses
    - all v9 frames and widths are explicit
    - helper metadata and payload bytes are jointly digest-bound
    - phase-separated FOE and memory equations are explicit
    - execution_authorized remains false
