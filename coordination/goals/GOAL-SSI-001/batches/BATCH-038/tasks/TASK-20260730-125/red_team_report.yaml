        result: MISSED (harness stays green)
      - mutation: items[0].numeric_width = 4096
        result: MISSED (harness stays green)
      - mutation: items[0].peak_byte_bound = 99999
        result: MISSED (harness stays green)
    interpretation: >-
      The detector fires on invented composition_operator / aggregation_factor
      values and on illicit clearance / tau_invented booleans, so the specific
      falsifiers named in the mandate are guarded. But the check named
      "no_invented_numerics" does NOT scan the numeric_width, peak_byte_bound,
      or global_memory_bound value fields for invented numbers, even though the
      batch objective explicitly forbids inventing those. A green harness is
      therefore NOT a sufficient witness for the full "no invented numerics"
      claim; the claim is backed here by the independent numeric-field scan
      above, not by the harness. See objection CONTROL-COVERAGE-GAP.

  objections:
    - id: SEARCH-FATIGUE-SCHEMA-STACKING
      severity: blocking_for_next_batch_direction
      title: Fourteenth-lane placeholder deepening is a search-fatigue signal, not MEMORY-MAP progress
      detail: >-
        BATCH-023 through BATCH-038 have emitted a monotone chain of
        "*_schema_partial" placeholder lanes (peak_liveset, resource_vector,
        charge_incidence, retry_cleanup_tail, verify_exit, history_uniform_tail,
        tau_schema_stopping_fail, width_schema, width_slot_binding,
        retry_peak_byte, peak_byte_bound, charge_metering, global_memory_bound,
        and now composition_aggregation) WITHOUT ever instantiating a single
        numeric width / peak-byte / global bound / charge, or a Verify-relative
        tau. The QM-MEMORY-MAP status string has been renamed at least four
        times (charge_metering -> peak_byte_bound... -> global_memory_bound ->
        composition_aggregation) while every value field it names stays
        null/unresolved and control_result stays FAIL. Under
        docs/inventor-protocol.md sec.4 this pattern is a fatigue report about the
        search, not a statement about the problem: "we named N more obligations"
        is not advancement toward QUERY_MEMORY reconciliation. The prior
        red-team RT-20260730-121 already recorded the required control
        NEXT-MEMORY-MAP-OR-STOPPING-GATE demanding instantiation OR tau; the
        program answered by adding another placeholder lane. The claim that
        QM-MEMORY-MAP is "advancing" is therefore, as a claim of progress,
        UNVERIFIED. What the reported quantity should do: the count of
        not_instantiated/not_supported value fields is the parameter that should
        DECAY as the lane makes progress; across these batches it does not decay
        (it stays ~13 lineage placeholders plus per-item nulls), which is the
        canonical artifact/fatigue tell.
      does_not_falsify: >-
        This is not a falsifier of the BATCH-038 artifact, which honestly and
        correctly executes the exact brief the Coordinator handed it. It is a
        challenge to the CONTINUATION direction, binding on next_action.
      required_control: >-
        BATCH-039 must adopt exactly ONE substantive instantiation gate (see
        next_concrete_action) and must NOT emit another *_schema_partial
        placeholder lane. If BATCH-039 again emits placeholders-only with all
        value fields null, that outcome must be recorded as a controlled
        null / fatigue report at status unverified, NOT as MEMORY-MAP
        advancement.
    - id: CONTROL-COVERAGE-GAP
      severity: revise_control_before_reliance
      title: no_invented_numerics harness does not cover numeric_width / peak_byte_bound / global_memory_bound values
      detail: >-
        check_no_invented_numerics only flags non-null values under keys
        composition_operator and aggregation_factor, plus a fixed list of
        forbidden-true booleans. Positive-control injections of numeric
        global_memory_bound / numeric_width / peak_byte_bound values into an
        item pass the harness green (cases M5-M7 above). The objective forbids
        inventing exactly those quantities, so the automated control is weaker
        than its name and than the claim it is cited to support.
      does_not_falsify: >-
        The committed snapshot contains no such invented values (independent
        full-item scan), so this is not a falsifier of BATCH-038; it is a
        control-integrity gap that must not be relied on by downstream reviews.
      required_control: >-
        Downstream evidence/decision must cite the independent numeric-field
        scan (not the harness alone) as the witness for "no invented numerics".
        Successor harnesses should extend the numeric detector to scan
        global_memory_bound / numeric_width / peak_byte_bound / charge value
        fields for non-placeholder numeric values.
    - id: SCHEMA-PARTIAL-NOT-A-BOUND
      severity: blocking_for_scope_expansion
      title: composition_aggregation_schema_partial is not a composed bound and not clearance
      detail: >-
        ledger_status / QM-MEMORY-MAP = composition_aggregation_schema_partial
        names placeholder composition-law / peak-aggregation obligation wiring
        only. CA-CF-composition_law_api and CA-CF-numeric_composed_bound are
        not_supported; CA-GB-global_fc0_memory_bound and
        CA-CM-numeric_charge_meter are not_supported; all composition_operator /
        aggregation_factor / global_memory_bound / numeric_width /
        peak_byte_bound values are null/unresolved. Reading the status string,
        the 25 wired_symbolic edges, or the harness pass as an instantiated
        composed global bound, a peak-aggregation factor, or QUERY_MEMORY /
        QM-MEMORY-MAP clearance would invent evidence.
      required_control: >-
        Official ledger language must state composition_aggregation_schema_partial
        != clearance / PIN_COMPLETE / instantiated composition operator /
        aggregation factor / numeric bound; keep reconciled=false,
        clearance=false, query_memory_cleared=false.
    - id: WIRED-SYMBOLIC-NOT-NUMERIC
      severity: blocking_for_scope_expansion
      title: 25 wired_symbolic composition/lineage edges are not numeric aggregation
      detail: >-
        25 of 39 items are wired_symbolic (14 of them pure lineage_cross_link
        retentions). Vocabulary and non_claims exclude numeric operators,
        aggregation factors, and global bounds. wired_symbolic coverage is
        interface naming, not filled aggregation accounting.
      required_control: >-
        Refuse any sentence equating wired_symbolic coverage or lineage
        retention with MEMORY-MAP clearance or numeric bound instantiation.
    - id: HARNESS-HARDCODED-EXPECTED-COUNTS
      severity: non_blocking_qualification
      title: Edge-count expectations (39; 6/5/5/4/5/14; 25/1/9/4/0) are hardcoded harness constants
      detail: >-
        EXPECTED_COUNTS in ledger_checks.py hardcodes the schema cardinality;
        the harness only verifies the ledger matches those constants, not that
        39 is the uniquely correct obligation count. Independent recount here
        confirms the same totals and the 25+1+9+4+0=39 identity.
      required_control: >-
        Treat harness pass as consistency with the declared contract, not proof
        that the obligation count is canonical.
    - id: RECEIPT-PENDING-POST-COMMIT
      severity: non_blocking_qualification
      title: Snapshot receipt still pending_post_commit with null commit_sha
      detail: >-
        archives/TASK-20260730-124/snapshot-receipt.json records commit_sha:null
        and verification.status: pending_post_commit. Independent Git checks
        (parent 32b689ea6, exact eleven-path scope, matching source_path_sha256)
        establish the durable snapshot; do not treat the null receipt fields as
        absence of a durable snapshot.
      required_control: >-
        Coordinator post-commit verifier should fill commit_sha /
        verification.status on ledger archive.
    - id: PRODUCER-MISSING-DOMINATED-BY
      severity: non_blocking_qualification
      title: Producer omits dominated_by / sota_delta
      detail: >-
        Inventor-protocol Pareto fields are absent from producer artifacts. No
        complexity/security/attack-point claim is made, so this is an omitted
        n/a rather than a dominated_by:null fabrication under AGENTS rule 5.
      required_control: >-
        EV/DEC prose records dominated_by as not_evaluable (no attack point) and
        sota_delta as not_claimed; do not invent a Pareto comparison.

