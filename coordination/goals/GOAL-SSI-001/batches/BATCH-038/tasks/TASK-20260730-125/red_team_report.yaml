  positive_control:
    method: >-
      RT-121-style detector fault injection against
      composition_aggregation_harness.ledger_checks.check_no_invented_numerics,
      run on the scratch copy only.
    detected_cases:
      - mutation: items[0].aggregation_factor = 2.0
        result: DETECTED (hit on aggregation_factor)
      - mutation: items[0].composition_operator = 3
        result: DETECTED (hit on composition_operator)
