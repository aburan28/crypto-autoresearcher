  successor_experiment: EXP-SSI-fe3f76
  predecessor_experiment: EXP-SSI-1d0f36
  status: design_only
  execution_authorized: false
  claim_ceiling: >-
    This report and successor specification make no observation, attack,
    security, exponent, novelty, or hypothesis-status claim.
  predecessor_review_bindings:
    validator: coordination/goals/GOAL-SSI-001/batches/BATCH-6c960d/reviews/TASK-20260809-9f5850/validation_report.yaml
    validator_sha256: 5331de21f403c67833d33d60c3a812109d29ccbec92851f77b5851385cfb317b
    red_team: coordination/goals/GOAL-SSI-001/batches/BATCH-6c960d/reviews/TASK-20260809-950724/red_team_report.md
    red_team_sha256: f75f96ae54505e9f055ded5826dfb9eabc5398507a059e663da00f0b9a519004
  repairs:
    - id: R1
      issue: exact_prime_and_vertex_convention
      repair: >-
        Pin SQISign-I to p=5*2^248-1 and SQISign-V to p=27*2^500-1 from the
        frozen paper, define canonical F_p^2 j-invariant bytes, and derive
        b_p and b_curve from the exact expressions. No invented toy prime is
        introduced.
    - id: R2
      issue: incomplete_Tq_and_zero_success_semantics
      repair: >-
        Define one-attempt work W, q as the query-randomness success probability,
        T_q(A,E)=E[W]/q when q>0, T_q=infinity when q=0, worst-case max over
        V_p, fixed builder seed, L_steps=2^20, and explicit restart-cap handling.
    - id: R3
      issue: incomplete_A_B_C_bytes_and_B_mapping
      repair: >-
        Specify curve, order, slot, shared-index, middle-descriptor, and branch
        widths as exact functions of b_p and S. Map every sigma label to B theta;
        labels below 1/2 are explicitly not applicable, and saturation/padding
        counts are separately charged.
    - id: R4
      issue: shared_index_and_fiber_accounting
      repair: >-
        Replace R_t(A) with R_t(A;I_A), define the union over records with
        read-only shared-index access, and report fiber mass together with the
        shared index and shared-byte charge.
    - id: R5
      issue: validity_tag_and_identity_rejection_nulls
      repair: >-
        Replace malformed validity-tag nulls with valid order tags whose owner
        curve differs from the lookup target. Random-advice and shuffled-fiber
        controls execute parse, validation, path, pullback, saturation, and only
        then final identity rejection. Both carry 32768 paired instances, exact
        integer gates, delta_path<=1/64, and pre-registered distinct seeds.
    - id: R6
      issue: C_null_and_R_statistic_precision
      repair: >-
        Pin the C null to n=8192 and 256 bins with z_max<=6 and collision excess
        <=4/sqrt(8192); pin the H-ADV-1-R diagnostic to 1024 sets, 4096 starts,
        8 replicates, and D_KS<=4/sqrt(4096).
  protected_history:
    - experiments/EXP-SSI-1d0f36/specification.yaml
    - experiments/EXP-SSI-2d8583/specification.yaml
    - ledger/proposals/IDEA-20260806-9c2f80.yaml
    - tools/schema_supersession_registry.yaml
  registry_policy: >-
    The completed archive binds tools/schema_supersession_registry.yaml. It is
    intentionally unchanged; EXP-SSI-fe3f76 carries explicit supersedes lineage
    and is not appended to that global registry in this refinement.
  completion_gate:
    - successor parses as YAML
    - exact primes and all sigma labels are present
    - T_q defines q=0 and fixed-seed semantics
    - all A/B/C schemas and B mappings are explicit
    - semantic null controls have counts, statistics, tolerances, and seeds
    - execution_authorized remains false
