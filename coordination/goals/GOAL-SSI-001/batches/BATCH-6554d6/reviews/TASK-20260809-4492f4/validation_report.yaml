        all-advice, deployed-parameter, and hypothesis-transition claims.
      references:
        - experiments/EXP-SSI-fe3f76/specification.yaml:1-43@b12abf38922e62329d7bd51cf690c88bf759b50d

    - id: AC-SSI-4492f4-3
      check: exact_prime_and_vertex_byte_contract
      status: verified_as_design_with_encoding_residual
      evidence: >-
        The exact source expressions are SQISign-I p=5*2^248-1 and SQISign-V
        p=27*2^500-1, with frozen-paper references. Field elements are
        declared canonical unsigned little-endian integers in [0,p-1], with
        b_p derived from the exact expression, and vertex IDs have a version
        byte plus two b_p-byte components. The expressions and byte widths are
        therefore no longer absent. Exact byte serialization is not fully
        closed because the literal encoding-version value and the F_{p^2}
        basis/coefficient ordering are not assigned in the successor. The
        declared log2_p/log2_p_approx metadata also does not equal the exact
        expressions: their bit lengths are 251 and 505, with log2 values
        approximately 250.321928 and 504.754888, not 256 and 512.
      references:
        - experiments/EXP-SSI-fe3f76/specification.yaml:99-110@b12abf38922e62329d7bd51cf690c88bf759b50d
        - inputs/P13-WESOLOWSKI-2026/paper_fulltext.md:248-256

  metric_recomputations:
