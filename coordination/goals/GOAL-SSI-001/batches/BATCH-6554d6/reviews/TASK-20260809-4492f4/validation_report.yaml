    - id: AC-SSI-4492f4-2
      check: additive_successor_lineage_and_claim_state
      status: verified
      evidence: >-
        EXP-SSI-fe3f76 is version 3, review_required, frozen false,
        execution_authorized false, evidence_eligible false, hypothesis_id
        null, approved_by null, and supersedes EXP-SSI-1d0f36. Its top-level
