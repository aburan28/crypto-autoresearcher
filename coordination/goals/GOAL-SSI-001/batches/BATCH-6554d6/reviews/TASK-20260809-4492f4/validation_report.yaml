    - metric: declared_control_counts_and_tolerances
      status: verified_as_preregistered_text
      result: >-
        The successor declares 4096 instances per replicate, 8 replicates,
        32768 total paired instances, exact integer counts and rational ratios,
        C-pair n=8192 with 256 bins and its z/collision gates, and H-ADV-1-R
        1024 sets, 4096 starts, 8 replicates, and its D_KS gate. These are
        declarations only and were not measured.
    - metric: exact_prime_bit_lengths
      status: recomputed_as_read_only_arithmetic
      result: >-
        For p=5*2^248-1, bit_length(p)=251 and ceil(bit_length/8)=32; for
        p=27*2^500-1, bit_length(p)=505 and ceil(bit_length/8)=64. This is a
        parameter-consistency check only, not a scientific result.

  control_checks:
    - id: CTRL-SSI-4492f4-S0
      control: CTRL-S0
      status: verified_as_preregistered_design_only
      evidence: >-
        S=0 is a distinguished known-answer control, ordered before treatment,
        with failure terminating treatment rows. It is not an observation.
      reference: experiments/EXP-SSI-fe3f76/specification.yaml:111-128,316-321@b12abf38922e62329d7bd51cf690c88bf759b50d

    - id: CTRL-SSI-4492f4-FULL
      control: CTRL-S-P-HARDCODED
      status: verified_as_symbolic_corner_only
      evidence: >-
        The full V_p order-tagged table is explicitly a known-answer symbolic
        corner and is not treated as a random-sampler construction result.
      reference: experiments/EXP-SSI-fe3f76/specification.yaml:119-128,322-325@b12abf38922e62329d7bd51cf690c88bf759b50d

    - id: CTRL-SSI-4492f4-RANDOM
      control: CTRL-RANDOM-ADVICE
      status: verified_as_semantic_path_design_with_schema_residual
      evidence: >-
        The null uses the selected treatment record and shared index, valid
        lookup and order fields, an owner curve selected at a different index,
        and defers NO_WITNESS until after parse, validation, path
        reconstruction, pullback, saturation, and the final identity gate.
        It declares witness_count=0, completed_attempt_count=32768, paired
        replay path work, and delta_path<=1/64. The paired replay construction,
        seed derivation, and exact path-work field schema are not specified;
        the |V_p|=1 fallback is also absent here.
      reference: experiments/EXP-SSI-fe3f76/specification.yaml:300-342@b12abf38922e62329d7bd51cf690c88bf759b50d

    - id: CTRL-SSI-4492f4-SHUFFLED
      control: CTRL-SHUFFLED-FIBER
      status: verified_as_semantic_path_design_with_schema_residual
      evidence: >-
        Valid fixed-width fields, a deterministic cyclic owner permutation, a
        |V_p|=1 fallback, and the same parse/validation/path/pullback/saturation
        and final-gate path are declared. The control does not explicitly say
        before_treatment, and its statistic names completion_count while the
        random null names completed_attempt_count. The exact paired replay and
        seed derivation remain unspecified, so the two controls are not yet
        fully executable gates.
      reference: experiments/EXP-SSI-fe3f76/specification.yaml:310-315,343-352@b12abf38922e62329d7bd51cf690c88bf759b50d

    - id: CTRL-SSI-4492f4-C
      control: CTRL-C-PAIR-NULL
      status: verified_as_finite_gate_with_generation_residual
      evidence: >-
        The control pins n=8192, B=256, z_max, collision_excess, exact
        rational tolerances, a treatment-matched endpoint access path, and a
        scope-limited failure action for Construction C. The key permutation,
        ordered/unordered pair convention, pair-table key, and middle-factor
        representation are not fully machine-specified, so the finite gate is
        declared but not yet reproducible from bytes alone.
      reference: experiments/EXP-SSI-fe3f76/specification.yaml:151-157,353-376@b12abf38922e62329d7bd51cf690c88bf759b50d

    - id: CTRL-SSI-4492f4-SEEDS
      control: seed_commitment_and_finite_plan
      status: verified_as_declared_with_pairing_residual
      evidence: >-
        Six distinct 32-byte hex seed values are listed for build, query,
        random-advice, shuffled-fiber, pair-null, and hitting-time uses. The
        finite plan pins 4096 per replicate, 8 replicates, 32768 total, paired
        query seeds, exact integer/rational acceptance, and no post-hoc
        tolerance. 'paired_query_seeds: true' does not define how the paired
        replay stream is derived from the single query_seed or how per-instance
        seeds are recorded.
      reference: experiments/EXP-SSI-fe3f76/specification.yaml:300-315@b12abf38922e62329d7bd51cf690c88bf759b50d

  heuristic_validation_checks:
    - id: HV-SSI-4492f4-QUANTIFIER
      check: fixed_advice_vs_random_set_scope
      status: verified_as_explicitly_separated
      evidence: >-
        A_p is fixed after p and before E; query randomness is the only
        expectation; T_q is worst-case over E in V_p; builder randomness is
        conditioned into T_build; and H-ADV-1-R is explicitly unable to
        validate H-ADV-1-W. No universal hitting result is accepted.
      references:
        - experiments/EXP-SSI-fe3f76/specification.yaml:74-97,221-240,283-290@b12abf38922e62329d7bd51cf690c88bf759b50d

    - id: HV-SSI-4492f4-TQ
      check: T_q_success_and_zero_success_semantics
      status: verified_with_budget_residual
      evidence: >-
        q(A_p,E) is explicitly the probability of an admissible output before
        the hard budget, q=0 maps to infinity, and nonzero q uses expected
        one-attempt work divided by q. Independent restarts use the same A_p,
        while restart-cap hits are infrastructure/invalid status. The symbol
        L_steps is named but no numeric value is frozen in the successor; the
        refinement narrative's suggested 2^20 value is not carried into the
        committed experiment specification. The query_seed is also not
        connected to an omega distribution or a deterministic independent
        per-restart/domain-separated stream.
      reference: experiments/EXP-SSI-fe3f76/specification.yaml:79-97@b12abf38922e62329d7bd51cf690c88bf759b50d

    - id: HV-SSI-4492f4-B
      check: construction_B_theta_to_sigma_mapping
      status: verified_as_design_only
      evidence: >-
        The exact formula sigma_B(theta)=1/2+3*theta/2 and inverse are given.
        Every declared sigma has a row: 0, 1/6, and 1/3 are not applicable
        below the p^(1/2) threshold; 1/2, 2/3, 4/5, and 1 map to theta 0,
        1/9, 1/5, and 1/3 respectively. Saturation and no-padding behavior
        are separately stated.
      reference: experiments/EXP-SSI-fe3f76/specification.yaml:161-189@b12abf38922e62329d7bd51cf690c88bf759b50d

  cost_model_checks:
    - id: CM-SSI-4492f4-SCHEMAS
      check: typed_A_B_C_schemas
      status: verified_with_physical_schema_residual
      evidence: >-
        A, order-tagged B, membership-only B, and C have separate field lists
        and entry-width formulas. Curve IDs, signed order scalars, order tags,
        slots, shared-index records, and C middle descriptors have declared
        symbolic widths. However b_shared is referenced but never defined;
        C's pair index/shared metadata and optional B delta-screen certificate
        bytes have no exact widths or serialization rules. Signed scalar
        endianness, canonical zero/sign encoding, version-byte values, and the
        terminal membership-only-B procedure are also not frozen.
      reference: experiments/EXP-SSI-fe3f76/specification.yaml:138-175,190-194@b12abf38922e62329d7bd51cf690c88bf759b50d

    - id: CM-SSI-4492f4-FIBER
      check: shared_index_R_t_and_output_accounting
      status: verified_as_formal_scope_with_execution_residual
      evidence: >-
        R_t(a;I_A) is defined over distinct input vertices that yield an
        explicit admissible non-scalar OneEnd witness, and R_t(A;I_A) is a
        union before counting. Shared index and shared-byte charges are stated
        separately, preventing overlap double counting. The operational access
        model is still only partial: b_shared is undefined, C multi-entry or
        adaptive access is not specified, and path direction, field encoding,
        order validation, saturation, and pushed-order-to-OneEnd conversion
        are deferred to a future implementation.
      reference: experiments/EXP-SSI-fe3f76/specification.yaml:196-219@b12abf38922e62329d7bd51cf690c88bf759b50d

    - id: CM-SSI-4492f4-AMORTIZATION
      check: build_query_memory_and_break_even_axes
      status: verified_as_declared_design_only
      evidence: >-
        T_build, T_q, T_amort, Q_break_even, retained entry bytes, shared index,
        deduplication, failed-build receipts, padding, and M_work_bytes are all
        named. No physical cost or timing was measured, and undefined byte
        components prevent a future exact table until repaired.
      reference: experiments/EXP-SSI-fe3f76/specification.yaml:88-97,138-194,384-404@b12abf38922e62329d7bd51cf690c88bf759b50d

  proof_architecture_checks:
    - id: PA-SSI-4492f4-BOUNDARY
      check: bounded_closed_list_and_nearby_control_ceiling
      status: verified
      evidence: >-
        The fiber comparison is restricted to named typed branches; H-ADV-1-R
        cannot establish the fixed-advice worst-case statement; H-ADV-4 is
        construction-C-only and conditional; and the nearby oriented object is
        explicitly non-gating. No all-advice lower bound or method-ceiling
        theorem is accepted.
      reference: experiments/EXP-SSI-fe3f76/specification.yaml:221-290,365-369,397-404@b12abf38922e62329d7bd51cf690c88bf759b50d

    - id: PA-SSI-4492f4-OUTPUT
      check: output_producing_fiber_and_pullback_obligation
      status: present_but_not_closed
      evidence: >-
        The successor requires an explicit non-scalar OneEnd output and charges
        pullback/saturation/conversion, but leaves the canonical path and field
        representation to a future implementation. This is an obligation and
        not proof or execution-ready evidence.
      reference: experiments/EXP-SSI-fe3f76/specification.yaml:196-215,470-476@b12abf38922e62329d7bd51cf690c88bf759b50d

  execution_boundary_checks:
    - id: EB-SSI-4492f4-1
      check: no_execution_claim_ceiling
      status: verified
      evidence: >-
        The experiment is review_required, frozen=false, execution_authorized
        false, evidence_eligible false, and approved_by null. Stage 0 and
        Stage 1 are conditional on separate approval; the optional diagnostic
        is not_authorized. Stopping, invalidation, success, and claim-ceiling
        text all prohibit treating this design as an observation or scientific
        result.
      reference: experiments/EXP-SSI-fe3f76/specification.yaml:1-43,406-460@b12abf38922e62329d7bd51cf690c88bf759b50d

  unresolved_defects:
    - id: UD-SSI-4492f4-1
      severity: execution_blocking
      finding: >-
        L_steps is used as the hard per-attempt query budget but has no numeric
        value in EXP-SSI-fe3f76. A finite T_q functional cannot be reproduced
        from the successor bytes until this value and its unit are frozen.
      required_successor_action: >-
        Add a machine-readable numeric L_steps value, unit, and branch-wide
        interpretation before freeze or authorization. Define the omega
        distribution and domain-separated independent restart seed stream.

    - id: UD-SSI-4492f4-2
      severity: execution_blocking
      finding: >-
        Vertex widths are improved but exact vertex bytes remain incomplete:
        encoding_version has no literal value and the F_{p^2} basis and j_0/j_1
        coefficient ordering are not frozen. Two implementations can therefore
        serialize the same mathematical j-invariant differently.
      required_successor_action: >-
        Freeze the version byte, F_{p^2} basis/coefficient order, and canonical
        component serialization, with one machine-readable encoding table. Also
        correct or explicitly rename the declared 256/512 log2_p metadata.

    - id: UD-SSI-4492f4-3
      severity: execution_blocking
      finding: >-
        b_shared is referenced in the fiber and memory formulas but never
        defined. C pair-index/shared metadata and optional B delta-screen
        certificate bytes likewise lack exact widths and serialization rules.
      required_successor_action: >-
        Define every shared/index/certificate byte component and charge it once
        under a branch-specific physical-memory schema, including signed scalar
        canonical encoding and the membership-only-B terminal procedure.

    - id: UD-SSI-4492f4-4
      severity: execution_blocking
      finding: >-
        R_t(a;I_A) and its union are formally improved, but the operational
        witness path is deferred: path direction, field encoding, order
        validation, saturation, and conversion to the explicit OneEnd output
        are not frozen. C multi-entry/adaptive access semantics are also not
        specified.
      required_successor_action: >-
        Freeze the access model and canonical output construction before using
        fiber mass or query cost in a treatment row.

    - id: UD-SSI-4492f4-5
      severity: execution_blocking
      finding: >-
        The random-advice and shuffled-fiber controls now exercise the intended
        semantic path and pin 32768 instances, counts, and delta_path<=1/64,
        but the paired final-gate-disabled replay is not defined as an artifact
        or algorithm. The successor gives one query seed plus a boolean
        paired_query_seeds flag, not a deterministic per-instance pairing and
        replay-seed derivation.
      required_successor_action: >-
        Define the paired replay generator, per-instance seed derivation, path
        work fields, and exact paired-record schema before authorization. Specify
        how shuffled owner reassignment preserves order validity and resolve the
        |V_p|=1 forced-no-witness edge case.

    - id: UD-SSI-4492f4-6
      severity: execution_blocking
      finding: >-
        CTRL-SHUFFLED-FIBER refers to completion_count while CTRL-RANDOM-ADVICE
        refers to completed_attempt_count, and only the random control explicitly
        carries order: before_treatment. This leaves a field-name and control
        ordering ambiguity in the finite acceptance gate.
      required_successor_action: >-
        Use one exact count field name and explicitly order both semantic nulls
        before treatment rows.

    - id: UD-SSI-4492f4-7
      severity: execution_blocking
      finding: >-
        The C-pair null pins its sample size, bins, statistics, and tolerances,
        but 'key-permute only the right endpoints' does not freeze the key
        derivation, ordered versus unordered pair convention, pair-table key, or
        middle-factor encoding. The finite gate is consequently not
        byte-reproducible.
      required_successor_action: >-
        Specify the pair generator, permutation key/seed derivation, endpoint
        ordering, table key, middle descriptor, and an exact algebraic or
        squared comparison for the square-root tolerances in the same schema as
        treatment C.

    - id: UD-SSI-4492f4-8
      severity: provenance_caveat
      finding: >-
        The immutable snapshot receipt retains commit_sha: null and
        verification.status: pending_post_commit even though the supplied
        snapshot commit is the review authority. The receipt is not
        self-contained post-commit provenance. The successor's
        prior_validator/prior_red_team fields also still name BATCH-4f52ab,
        while the direct refinement report binds BATCH-6c960d, and the
        successor does not pin the frozen-paper SHA-256.
      required_successor_action: >-
        Coordinator archival work must preserve the supplied Git commit binding
        and must not describe the null receipt fields as populated or silently
        repair this immutable receipt.

  limitations:
    - >-
      This report validates only the design and claim boundary of
      EXP-SSI-fe3f76. It validates no run, statistic, timing, cost value,
      heuristic, control outcome, or scientific conclusion.
    - >-
      Exact prime expressions, little-endian field-element width rules, q=0
      semantics, A/B/C branch separation, B theta mapping, shared-index union
      accounting, finite control counts, statistics, tolerances, and seeds are
      present as declarations, subject to the residual defects above.
    - >-
      No experiment, Stage 0, Stage 1, optional diagnostic, cost model, or
      cryptographic computation was executed. Read-only schema parsing,
      hashing, integer arithmetic, queue verification, environment preflight,
      and repository validation were performed and are recorded in the runtime
      receipt; none is scientific evidence.
    - >-
      The no-execution ceiling is accepted as written; this incomplete verdict
      must not be read as negative mathematical evidence.
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-6554d6/reviews/TASK-20260809-4492f4/validation_report.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-6554d6/reviews/TASK-20260809-4492f4/runtime-session-receipt.json
