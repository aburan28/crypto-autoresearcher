        In EV/DEC text, state explicitly that the BATCH-018 control executed
        and FAILED, so QM-STOPPING remains open alongside MEMORY/ERROR.
    - id: FAIL-NOT-MATHEMATICAL-BOUNDARY
      severity: blocking_for_scope_expansion
      title: Control FAIL is not a durable negative cryptanalytic boundary
      detail: >-
        FAIL means source-compatible τ and joint finiteness were not
        instantiated against the pinned package. It does not prove that no
        future stopping law can exist, does not change Peikert asymptotics,
        and does not supply a security number or GOAL-SSI-001 completion.
      required_control: >-
        Retain FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED; introduce no numeric
        security, breakthrough, parameter, or completion claim; do not treat
        this FAIL as lane closure under inventor-protocol §4.
    - id: TYPE-OBLIGATIONS-NOT-INSTANTIATION
      severity: blocking_for_scope_expansion
      title: recovery_spec Verify/F_stop types are not τ instantiation
      detail: >-
        recovery_spec sharpens what τ must cover but does not supply a
        transition kernel, independence conditions, uniform success bound,
        or Verify(x,k') predicate in CollimationSieve@6f9188e4. Treating
        type obligations as source instantiation would invent joint
        finiteness.
      required_control: >-
        Keep τ and all joint expectations not_instantiated until a pinned
        implementation or source law supplies them.

