      QM-ERROR therefore remain live. TTM-RETURN-MODULUS and
      TTM-REQUESTED-LENGTH are specification-repair blockers, not independent
      cryptanalytic evidence against the sieve.
    batch014_wording_qualifications_recorded: true
    batch014_wording_detail: >-
      The audit correctly records that the BATCH-014 pin was self-attested
      rather than independently durable, and that the BATCH-014 analyzer was
      static pair-set enumeration rather than an explicit tape/history
      machine.

  objections:
    - id: TTM-EXECUTION-TRACE-OVERSTATEMENT
      severity: revision_required
      title: Boundary checker is not the frozen transition explorer
      detail: >-
        The emitted helper has no recursive machine state or retained
        transition-trace artifacts. Aggregate modulus checks cannot
        substantiate claims of literal recursive execution or full compliance
        with ttm-v1's required audit outputs.
      required_control: >-
        Narrow the current claim to a static type-consistency diagnosis, or
        emit machine-readable traces to the first ill-typed return with
        frame, history, phase, tape-position, symbol, and return-event
        fields.
    - id: SECOND-ROW-HISTORY-OMISSION
      severity: revision_required
      title: Second-row narrative omits the S=5 frame
      detail: >-
        [1,2,5,8] reaches its base only through root S=1, internal S=2,
        internal S=5, then base S=8. The shared prose skips S=5 while the
        modulus comparison relies on it.
      required_control: >-
        Correct the narrative and retain the exact recursive prefix for each
        row.
    - id: TYPE-ERROR-NOT-MATHEMATICAL-EVIDENCE
      severity: blocking_for_scope_expansion
      title: Specification failure is not sieve evidence
      detail: >-
        An undefined typed return is a defect in ttm-v1, not evidence of a
        zero-progress class, nonreachability, recurrence, or runtime tail of
        CollimationSieve.
      required_control: >-
        Keep all panel metrics not_computable and rerun only under a
        separately committed successor specification.
    - id: QUERY-MEMORY-REMAINS-OPEN
      severity: blocking_for_query_reconciliation
      title: Recovery and lifetime gates remain absent
      detail: >-
        No recovery, verification, object-lifetime, backing-store, or final
        error-event analysis was performed.
      required_control: >-
        Keep recovery/object-lifetime as a separate gate; do not infer
        QUERY_MEMORY clearance from any repaired finite-panel result.

  required_controls:
    - id: TYPED-RETURN-AMENDMENT
      control: >-
        Before inspecting successor outputs, commit a successor specification
        that states whether child vectors retain child modulus, reduce into
        the parent modulus, or become tagged integer representatives, and
        that defines requested-length propagation.
      pass_condition: >-
        Every return lands in the declared parent state space by an explicit
        deterministic rule, source-compatible where claimed.
    - id: TRACE-PREFIX-CONTROL
      control: >-
        Execute one canonical all-zero tape per row and retain the complete
        recursive trace prefix through the first return.
      pass_condition: >-
        The trace includes every frame and proves the exact transition at
        which the old specification fails or the successor proceeds.
    - id: FULL-PANEL-RERUN
      control: >-
        Under the committed successor spec, exhaustively run both
        preregistered rows through the declared one-retry horizon and report
        every panel result.
      pass_condition: >-
        Projected pair sets and classification targets are computed without
        post-selection and compared only where definitions agree.

  counterexample_or_mutation: >-
    Cheapest discriminating mutation: commit two candidate return semantics
    as explicit successor specifications—one reducing child values modulo the
    active parent, one retaining integer representatives with a modulus
    tag—then run the all-zero tape on each panel row and compare the first
    returned child_store and subsequent collimation state. Divergence shows
    ttm-v1 underdetermines the requested audit; agreement permits selecting
    the source-compatible rule before exhaustive outputs are inspected.

