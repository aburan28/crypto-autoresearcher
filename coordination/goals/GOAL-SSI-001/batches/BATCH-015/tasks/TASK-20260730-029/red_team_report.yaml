        matches_preregistration: true

  specification_error_assessment:
    ttm_return_modulus_blocker_supported: true
    over_strict_reading_invented: false
    reasoning: >-
      Frozen ttm-v1 types each active parent's child_store vectors as
      elements of Z/s_r Z, while a base call emits a sorted vector reduced
      modulo the row endpoint n. At the first base return the active parent
      modulus is s_r=2 for [1,2,4] and s_r=5 for [1,2,5,8], against produced
      types Z/4Z and Z/8Z. The return transition says to store v1 / v2 but
      defines no coercion, reduction, retagging, or untyped-representative
      convention. Refusing to invent a coercion is the literal reading
      required by the preregistered machine; it is not an over-strict
      invention. For [1,2,5,8], even a naive reduce-mod-s_r repair is not a
      ring homomorphism Z/8Z -> Z/5Z, which further shows that any repair must
      be an explicit successor specification rather than a silent patch.
    return_label_qualification: >-
      ttm-v1's explicit no-transition rule names mismatched return labels,
      not mismatched value moduli. The modulus failure is implied by closure
      of the declared typed state space plus the absence of a coercion rule.
      Durable wording should call this an undefined / ill-typed return
      transition, not an explicitly enumerated invalid-return branch.
    requested_length_gap_supported: true
    requested_length_reasoning: >-
      ttm-v1 fixes BaseDraw count at round(log2 L)=2 from row-level L and has
      no requested-length state. It therefore cannot reproduce BATCH-014's
      length-indexed pair family without amendment; not_comparable is
      correct.
    finite_counts_spot_check: >-
      Exhaustive two-symbol BaseDraw tapes give n^2 attempts: 4^2=16 and
      8^2=64. These are boundary-attempt counts under a structural type
      inequality, not pair counts, keep probabilities, or distinct semantic
      bugs per tape.
    before_S2_collimation: true
    before_S2_detail: >-
      Designated internal_S2 collimation requires successful child returns
      into the S=2 frame. Both rows block at the first base return earlier in
      the recursion ([1,2,4] directly into the S=2 parent; [1,2,5,8] into the
      intermediate S=5 parent), so no LeftIndex/RightIndex/decide/retry path
      is enabled.
    implementation_revision_required: true
    implementation_issue: >-
      The helper embedded in panel_audit_report.md is a static BaseDraw
      enumeration plus endpoint-versus-parent-modulus comparison. It does not
      instantiate machine state, phases, call_history, tape_position, child
      frames, labeled return events, or per-symbol traces. Phrases such as
      "complete executed typed boundary analyzer" and "literal typed-tape and
      recursive-history transition execution" overstate what was emitted.
      ttm-v1's required audit outputs still demand retained transition traces
      through unavailable transitions; a short prefix does not erase that
      requirement.
    row_trace_issue: >-
      The shared narrative says that for each row the explorer "enters root,
      spawns the first internal child, then spawns that child's base child."
      For [1,2,5,8] the recursive prefix is root S=1, internal S=2, internal
      S=5, base S=8. Skipping S=5 while reporting a Z/8Z-versus-Z/5Z boundary
      confirms that no auditable recursive trace was retained.
    narrow_effect: >-
      Missing explorer/traces require wording and artifact revision. They do
      not defeat the type-level blocker, which follows from the frozen state
      and return declarations before exhaustive exploration.

  disposition_assessment:
    claimed: FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED
    supported: true
    query_memory_support: supported
    named_blockers_supported:
      - QM-STOPPING
      - QM-MEMORY-MAP
      - QM-ERROR
