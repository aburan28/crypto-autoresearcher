batch:
  id: BATCH-f85613
  goal_id: GOAL-SSI-001
  question_ids:
    - RQ-SSI-001
  title: >-
    Localize the EXP-WESOVOW-001 vOW anchor defect at its source and recompute
    the vOW-versus-Delfs-Galbraith comparison under the corrected charging law,
    from committed inputs only.
  status: draft_pending_id_allocation
  status_note: >-
    NOT ready_for_dispatch. Every identifier in this batch is a literal
    placeholder. The authoring Coordinator session held Read, Grep, Glob, Write
    and Edit and NO SHELL: it could not run tools/allocate_id.py,
    tools/research_dispatch.py, tools/validate_ledger.py, git, or any hash or
    parser. Nothing in this directory has been parsed or rendered by any tool.
    See id_allocation and unrun_checks below.

  selection:
    selected_item: >-
      Item 2 of the three queued in GOAL-SSI-001's head - the
      EXP-WESOVOW-001/cost_model.py anchor bug, still uncorrected at its source.
    selected_from: >-
      The head of ledger/goals/GOAL-SSI-001/goal.yaml, whose closing directive
      is to select and scope exactly one of three queued items or an optional
      fourth. Read as a whole folded scalar, not line-scoped.
    ranking:
      - rank: 1
        item: >-
          Item 2 - EXP-WESOVOW-001/cost_model.py's anchor bug, uncorrected at
          source. SELECTED.
        why: >-
          It is the only one of the four whose answer is not already known, and
          it is upstream of item 3. The overclaim CORR-20260808-c792f8 refuted
          in EV-WESO-001 is attributed by that same correction to this defect;
          the defect therefore keeps regenerating derived claims until it is
          corrected where it lives. Reading the three places the charging law is
          stated suggests they do not agree with one another, which if confirmed
          makes this a control-integrity finding rather than a typo - see
          coordinator_reading_to_be_independently_rechecked.
      - rank: 2
        item: >-
          Item 3 - rederive CORR-20260808-c792f8's P=512 crossover from
          RUN-WESOVOW-001/raw-result.json's own opt values. NOT SELECTED, STAYS
          QUEUED, AND ITS BASIS IMPROVES IF ITEM 2 RUNS FIRST.
        why: >-
          Cheapest of the four and it lifts a concrete standing prohibition, but
          its numeric answer was already computed twice by the Validator
          (crossover 81.6, w=2^80 sign -0.82 bits, recorded in this goal's head),
          so its expected information gain is confirmation only. Filing its
          amendment first would anchor a new record on a run whose charging law
          is still wrong at source. Ordering it after item 2 costs one batch and
          buys a better-founded amendment.
      - rank: 3
        item: >-
          Item 1 - EV-SSI-59f7a2's missing SC-1/SC-3 conditionality. NOT
          SELECTED, STAYS QUEUED.
        why: >-
          Its own committed record states the uncertainty plainly - per
          DEC-20260808-7ed316, none remains on WHAT is missing, only on WHEN it
          is filed. Expected information gain is therefore approximately zero at
          a low but nonzero cost. It matters, because it is a conditionality and
          problem-label defect on the program's most quotable security figure,
          but it is blocked by nothing and can be discharged in any later batch
          or bundled with item 3's amendment.
      - rank: 4
        item: >-
          Optional item 4 - Section 3's GOAL-P13-001 margin claim in
          analysis/SSI-ECDLP-SYNTHESIS-20260803.md. NOT SELECTED.
        why: >-
          The head itself calls it an unqueued option rather than an obligation
          and says it may belong under GOAL-P13-001. It is also the only one of
          the four whose stated address has drifted - see
          line_number_drift_finding. Selecting a cross-goal claim check while
          this goal's own upstream defect stands uncorrected would be
          misordering.
    retraction_determination:
      question: >-
        Which numbered item does the CORR-20260808-ea85c0 retraction close?
      answer: >-
        It closes the item numbered 3 in
        coordination/goals/GOAL-SSI-001/batches/BATCH-5a3d0a/closeout.md - the
        analysis/SSI-ECDLP-SYNTHESIS-20260803.md comfortable-margins sentence -
        and NOT the item numbered 3 in the goal head. The head's item 3 is the
        P=512 rederivation, which is the closeout's item 4 and is not retracted.
      how_determined: >-
        Read directly from the correction record rather than inferred from the
        head's summary. CORR-20260808-ea85c0's own corrects list names two
        targets by path and position, one of which is
        coordination/goals/GOAL-SSI-001/batches/BATCH-5a3d0a/closeout.md
        (Next action section, item 3), the other DEC-20260808-7ed316's
        next_actions fourth item. The closeout lists four items, its item 3
        being the synthesis-document sentence and its item 4 the P=512 anchor
        ambiguity, marked there as new and surfaced by the Validator review. The
        head lists three, having dropped the retracted one, so the closeout's
        item 4 became the head's item 3. The two numberings differ by exactly
        that removal.
      why_this_matters: >-
        The head's optional fourth item and the retracted closeout item 3 both
        point at the same line of the same document but at different sentences
        and different quantities. That collision is what produced the original
        mis-scoping, and repeating it would re-queue closed work.
    line_number_drift_finding:
      claim: >-
        The line numbers used by both the head and CORR-20260808-ea85c0 to
        address analysis/SSI-ECDLP-SYNTHESIS-20260803.md are stale against the
        file as it now stands in this worktree.
      exact_search: >-
        Grep, pattern comfortable, single file
        analysis/SSI-ECDLP-SYNTHESIS-20260803.md, output mode content with line
        numbers, no line-scoped filtering, whole-file scope.
      result: >-
        Two matches, at lines 191 and 231. Zero matches at line 171. Line 231 is
        the Section 3 GOAL-P13-001 sentence the head's optional fourth item
        targets; line 191 is inside the Section 2 addendum that
        DEC-20260808-0de8b2 added, which itself states that it supersedes the
        Section 3 framing. The addendum shifted the addresses by about sixty
        lines.
      consequence: >-
        Any future task that selects the optional fourth item must re-anchor it
        to content, not to line 171. Recorded here so the stale address is not
        copied forward a third time. Nothing about the retraction determination
        depends on this: that determination rests on the correction record's own
        corrects list, which addresses records by path and item position.

  objective: >-
    Determine, from committed inputs alone and without editing any frozen
    contract or committed run artifact, exactly where and how the
    EXP-WESOVOW-001 van Oorschot-Wiener charging law is mis-anchored; recompute
    the full vOW-versus-Delfs-Galbraith comparison under the corrected law at
    every field size, memory budget and overhead scenario the contract itself
    declares; and report the anchor sensitivity of every conclusion, under both
    the run's own fitted opt values and cost_model.py's PAPER_PAIRS literals.

  claim_ceiling: >-
    Arithmetic on already-committed literals, plus code reading. This batch runs
    no attack, solves nothing, and produces no certificate - certificate.kind is
    none throughout. It may not assert that SQIsign, CSIDH, or any standardized
    parameter set is broken, weakened, or unsafe, in either direction. It moves
    no hypothesis status, promotes nothing to knowledge, engages none of the
    four asymptotic-complexity promotion gates, and approaches no completion
    criterion of GOAL-SSI-001. Its honest description under
    docs/target-result-profile.md is cost-model repair and measurement hygiene,
    NOT an exponent-moving result.

  standing_prohibition_carried_unchanged: >-
    Per this goal's head and BATCH-5a3d0a's closeout, the crossover values and
    never-beats-DG verdicts at P=384, P=576 and P=768 are citation-eligible; the
    P=512 crossover value and its w=2^80 sign are NOT citation-eligible pending
    resolution of the anchor ambiguity. This batch does not lift that
    prohibition. Its producer and its reviewer must restate it in their own
    deliverables, and only a committed Coordinator decision on independently
    reviewed evidence may ever lift it.

  coordinator_reading_to_be_independently_rechecked: >-
    STATED AS A HYPOTHESIS FOR THE PRODUCER TO CHECK, NOT AS A FINDING TO COPY.
    The Coordinator read three committed files and observed what appear to be
    three mutually inconsistent statements of the same charging law. In
    experiments/EXP-WESOVOW-001/cost_model.py the documentation string at line
    236 reads T_full / sqrt(min(w, M)) and the computation at line 270 reads
    log2Tw = log2Tfull - 0.5 * min(lw, log2M) + overhead_bits, which decreases
    time as memory decreases. In experiments/EXP-WESOVOW-001/specification.yaml
    the declared crossover metric reads w* = (T_full * 2^{c*sqrt(log2 p)} /
    T_DG)^2 capped by M, and controls C3 and C4 require T(w) to equal T_full for
    w at or above M. In
    experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-001/execution_report.yaml the
    control block records C4_vow_asymptote as PASS by construction against a
    formula written there as T_full * min(1, sqrt(M/w)), with a note that the
    cap branch is not exercised by the tested grid. The corrected charging law
    used by CORR-20260808-c792f8 and verified twice by red team for
    EXP-SSI-9b542d is log2T_A(P,w) = log2T_full + 0.5 * max(0, log2M - log2w).
    The producer must re-read all three files and reach its own conclusion,
    including the conclusion that this reading is wrong. Nothing above was
    executed; no tool was run.

  dispatch_precondition:
    binding: true
    requirement: >-
      NO TASK IN THIS BATCH MAY BE DISPATCHED until the four BATCH-284f63 and
      BATCH-b3c87f archive cards named in this goal's head - TASK-20260806-b03b21,
      TASK-20260806-e80052, TASK-20260806-274d8a and TASK-20260806-91f36a - are
      in a terminal state, reached either by a genuinely determined
      archive.commit_sha with a complete path_sha256 map the verifier accepts,
      or by termination per finding F-1 of
      coordination/reconciliation/RECON-20260810-002/tasks/TASK-20260810-cb696d/discharge_sweep.yaml.
    why: >-
      This is the head's own stated precondition, carried unchanged. Until those
      cards are terminal the renderer keeps offering TASK-20260806-55cf1f and
      TASK-20260806-976fd5, whose write_scopes contain a frozen experiment
      contract and a live hypothesis, and a producer from this batch could then
      run concurrently with one of them.
    not_waived_by: >-
      Setting dispatch_queue_path to this batch's queue does not waive it. This
      Coordinator has no authority to waive a precondition set by the committed
      head.

  frozen_artifact_ruling:
    ruling: >-
      experiments/EXP-WESOVOW-001/cost_model.py,
      experiments/EXP-WESOVOW-001/specification.yaml and every artifact under
      experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-001/ are READ-ONLY for this
      batch and are not to be edited, moved, regenerated, or rerun in place.
    basis: >-
      cost_model.py is the executed code artifact of a committed run and is
      listed in that contract's own required_artifacts. Editing it in place
      would silently invalidate RUN-WESOVOW-001's reproducibility while leaving
      the run record asserting otherwise, which is the defect class AGENTS.md
      rule 4 exists to prevent. The contract is also approved and frozen, so its
      declared crossover metric cannot be restated without a versioned
      protocol_amendment record.
    what_correcting_at_source_therefore_means_here: >-
      A committed, independently reviewed localization of the defect, a
      corrected reference implementation held outside the frozen directory, and
      a committed correction record bound to the exact file and lines. It does
      NOT mean an in-place code edit, and it does NOT mean a rerun of the frozen
      contract.
    what_is_deliberately_left_for_a_successor: >-
      A superseding experiment contract carrying the corrected charging law and
      a new run under it, should the program later want the corrected model
      re-executed rather than recomputed. That needs a new EXP identifier and a
      protocol_amendment and is out of scope here.

  relation_to_the_other_queued_items:
    item_3: >-
      This batch produces the corrected law and the recomputed table under the
      run's own fitted opt anchor, which is the anchor item 3 asks for. It does
      NOT file item 3's deliverable - the versioned amendment to
      CORR-20260808-c792f8's crossover table - and does not lift the P=512
      prohibition. Item 3 stays queued with a stronger basis.
    item_1: >-
      Untouched. Neither EV-SSI-59f7a2 nor DEC-20260805-596d71 is written by any
      task in this batch.
    item_4: >-
      Untouched, and explicitly NOT settled by this batch. Item 4 concerns the
      GOAL-P13-001 margin measured by EXP-SSI-9b542d, a different experiment
      whose anchor was already repaired; the similarity is in the wording of the
      claim, not in its source. Do not treat this batch as bearing on it.

  maximum_wall_clock_seconds: 12000
  max_concurrent: 1
  max_concurrent_note: >-
    Serial by design. The chain is strictly sequential, two of the four cards
    take the git index, and no two cards may hold it at once.

