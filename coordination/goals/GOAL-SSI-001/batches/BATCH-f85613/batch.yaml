      - python3 -m orchestration.adapter resolve - the resolved model behind the
        requested policy was not observed.
    yaml_mitigation_not_a_check: >-
      Every prose value in this file and in the task cards is written as a
      folded block scalar so that a colon followed by a space inside prose
      cannot be read as a mapping, and every filesystem path is kept on one line
      so that folding cannot insert a space inside it. Every JSON string in the
      queue avoids embedded double quotes. That is a MITIGATION chosen because
      no parser was available. It is not a check and must not be reported as
      one.

  validation_baseline:
