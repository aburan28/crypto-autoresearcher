  control_checks:
    - id: CTRL-SSI-1
      control: CTRL-S0
      status: verified_as_preregistered
      evidence: >-
        Known-answer zero-advice control is present, has a forced incumbent
        result, and terminates before treatment rows on failure.
      reference: experiments/EXP-SSI-2d8583/specification.yaml:77-81@40172a499a4895357e1897bed52fb3390743c425
    - id: CTRL-SSI-2
      control: CTRL-RANDOM-ADVICE
      status: verified_as_matched_null_design
      evidence: >-
        The null is explicitly kind matched_null, ordered before treatment, and
        matched on declared size, access model, and query budget. Its forced
        result is the incumbent row at every declared S, and failure invalidates
        the instrument and forbids treatment reporting. The same null is also
        present in preregistered_prediction and in the stopping rules.
      reference: experiments/EXP-SSI-2d8583/specification.yaml:82-87,109-115,139-143@40172a499a4895357e1897bed52fb3390743c425
    - id: CTRL-SSI-3
      control: CTRL-S-P and CTRL-SHUFFLED-FIBER
      status: verified_as_known_and_negative_controls
      evidence: >-
        The trivial full-advice known answer and shuffled-fiber negative control
        are both declared with forced outcomes that distinguish the accounting
        object from an order-permutation artifact.
      reference: experiments/EXP-SSI-2d8583/specification.yaml:88-93@40172a499a4895357e1897bed52fb3390743c425
    - id: CTRL-SSI-4
      control: CTRL-NEARBY-ORIENTED
      status: verified_as_method_ceiling_control
      evidence: >-
        The oriented/CSIDH-shaped nearby-object control is explicitly required
        not to return the same flat frontier; the same condition appears in the
        method-ceiling audit.
      reference: experiments/EXP-SSI-2d8583/specification.yaml:67-70,94-96@40172a499a4895357e1897bed52fb3390743c425

  heuristic_validation_checks:
    - id: HV-SSI-1
      check: pre-registered prediction and falsification boundary
      status: verified_as_design_only
      evidence: >-
        T_min(S), the seven sigma values, the random-null prediction, and the
        Construction C gap are recorded before any permitted execution. The
        falsification criterion names exact-gate, null, monotonicity, and
        domination failures and classifies timeout/crash/dependency failure as
        infrastructure only.
      reference: experiments/EXP-SSI-2d8583/specification.yaml:109-118,155-159@40172a499a4895357e1897bed52fb3390743c425
    - id: HV-SSI-2
      check: scale and transfer honesty
      status: verified
      evidence: >-
        The specification labels the work tier derivation, states that Stage 1
        performs no cryptographic computation, sets correspondence null, and
        forbids transfer to cryptographic security. No toy or arithmetic output
        was promoted to evidence.
      reference: experiments/EXP-SSI-2d8583/specification.yaml:27-36,167-173@40172a499a4895357e1897bed52fb3390743c425
    - id: HV-SSI-3
      check: proof-architecture portfolio audits
      status: verified_as_declared_and_scoped
      evidence: >-
        The successor carries all four required pre-compute audits: exact
        baseline reproduction, observation collision, quantifier order, and
        method ceiling with the nearby-object control. The audit status is
        explicitly restricted to the bounded closed list; it is not accepted as
        a proof or global lower-bound claim. The source proposal carries the
        corresponding full proof_search_map and the same scope restriction.
      references:
        - experiments/EXP-SSI-2d8583/specification.yaml:53-76@40172a499a4895357e1897bed52fb3390743c425
        - ledger/proposals/IDEA-20260806-9c2f80.yaml:376-455@452f033e7648f8efcc2570ee00b5d3ff888a109e

  cost_model_checks:
    - id: CM-SSI-1
      check: bounded design budget
      status: verified
      evidence: >-
        The corrected contract supplies the previously absent top-level budget:
        4200 seconds per run, 0.2 CPU-hours total, 1 GB maximum memory, one run,
        and one worker. Stage 0 and Stage 1 budgets sum to the declared wall
        budget, and execution remains unauthorized.
      reference: experiments/EXP-SSI-2d8583/specification.yaml:119-138@40172a499a4895357e1897bed52fb3390743c425
    - id: CM-SSI-2
      check: time-memory-advice axes and unit limitation
      status: conditional
      evidence: >-
        Advice and working memory are explicitly separated, and metrics name
        log2 advice entries, query-cost exponents, and physical memory. No
        concrete table or operation-count result exists yet, so the future
        execution/archive must preserve explicit units for any generated table
        (for example field operations, entries, and memory cells). This is not
        treated as a run failure because the task is design-only.
      references:
        - experiments/EXP-SSI-2d8583/specification.yaml:45-52,97-108,160-166@40172a499a4895357e1897bed52fb3390743c425

  proof_architecture_checks:
    - id: PA-SSI-1
      check: baseline reproduction audit
      status: present_and_scoped
      evidence: >-
        The map fixes S=0 to the incumbent row and S=p^(1/2) to the stated
        MITM/Delfs-Galbraith embedding; it is a named closed-list boundary, not
        a global statement.
      reference: experiments/EXP-SSI-2d8583/specification.yaml:53-58@40172a499a4895357e1897bed52fb3390743c425
    - id: PA-SSI-2
      check: observation-collision search
      status: present_and_scoped
      evidence: >-
        The A/B collision at (p^(4/5), p^(1/5)) is recorded and explained as a
        notation collision because B's curves already carry orders.
      reference: experiments/EXP-SSI-2d8583/specification.yaml:59-62@40172a499a4895357e1897bed52fb3390743c425
    - id: PA-SSI-3
      check: quantifier fidelity
      status: present_and_scoped
      evidence: >-
        The witness A_p is independent of E and the incumbent is separately
        stated as the no-advice forall-p forall-E case.
      reference: experiments/EXP-SSI-2d8583/specification.yaml:63-66@40172a499a4895357e1897bed52fb3390743c425
    - id: PA-SSI-4
      check: method ceiling and nearby-object control
      status: present_and_scoped
      evidence: >-
        Certification is limited to the pre-registered named list and requires
        the oriented/CSIDH-shaped nearby object not to reproduce the same flat
        frontier. The specification separately forbids all-advice lower-bound,
        attack, security, and exponent claims.
      reference: experiments/EXP-SSI-2d8583/specification.yaml:67-70,144-148@40172a499a4895357e1897bed52fb3390743c425
    - id: PA-SSI-5
      check: strictness witness boundary
      status: declared_not_executed
      evidence: >-
        The preregistered Construction C gap is stated as sigma/2 > 0 for sigma
        > 0 and the exact arithmetic is listed as a Stage 0 proof obligation.
        This review confirms the witness is pre-registered but does not turn it
        into an independently validated strictness result.
      reference: experiments/EXP-SSI-2d8583/specification.yaml:71-76,109-115,120-124@40172a499a4895357e1897bed52fb3390743c425

