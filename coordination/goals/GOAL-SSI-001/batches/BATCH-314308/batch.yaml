  review_routing_determination:
    producer_tier: review-adversarial at xhigh, in an independent session, role red-team.
    reviewer_tier: review-adversarial at xhigh, in an independent session, role validator.
    basis: >-
      The routing rules escalate to review-breakthrough at `max` for a claimed
      breakthrough, a proposed closure, or a result contradicting prior VALIDATED
      evidence. NONE APPLIES AT THE OPENING STATE: this round claims no breakthrough,
      closes no lane, approves no amendment, enacts nothing, and moves no status. That
      is a statement about the OPENING STATE ONLY, and the stop condition below is what
      happens if it stops being true mid-round.
    why_the_producer_is_a_red_team_and_not_a_validator: >-
      Because the object is an ACT and not an artifact. BATCH-60d6b9 chose a Validator
      because its objects were an artifact's INTEGRITY and a control's ABILITY TO FAIL,
      and it recorded the cost: "the redraft received an integrity review and not a
      second adversarial reading, and the enacting decision still needs one". This is
      that reading.
    why_the_reviewer_is_a_validator_and_not_a_second_red_team: >-
      Because the question about the pass is whether it CLAIMS WHAT ITS EVIDENCE
      SUPPORTS - integrity, controls, stated findings - which is the Validator's
      contract. A red team attacking a red team is a regress that returns opinions
      about opinions; what is wanted is whether each act-finding is anchored in the
      redraft's own bytes and whether the pass's finding set is entailed by its own
      construction. THE COST: nobody adversarially attacks the REVIEW. It is bounded by
      the review's own inability to change any status.
    a_pass_that_finds_nothing_is_a_full_result_and_so_is_a_pass_that_finds_much: >-
      RECORDED IN THE CONTROL PLANE, BEFORE THE ROUND, SO NEITHER CAN BE READ AS RELIEF
      AFTERWARDS. TWO SYMMETRIC FAILURE MODES ARE NAMED. (1) MANUFACTURED FINDINGS: a
      pass that produces foreclosures because it was asked for foreclosures. Every
      record proposing anything forecloses something, so "I found foreclosures" is
      entailed by the assignment and carries no information; that is what the
      entailed-control objects exist to detect. (2) A CLEAN PASS TREATED AS A FAILURE:
      if the pass searches hard on all four axes, runs every entailed-control object,
      and concludes that the redraft's act is what it says it is, THAT IS A COMPLETE AND
      VALUABLE RESULT and this batch contracts in advance to record it as one - it is
      the single most enactment-relevant thing this round could return.

