# THIS BATCH HAS NO BLIND PHASE, AND THAT IS A DECISION TAKEN FOR THIS BATCH ON
# THREE GROUNDS OF ITS OWN, NOT COPIED FROM BATCH-60d6b9. There is no
# `blind_phase_hygiene` block below and no `protected_sha256` map. The reasoning
# is at no_blind_phase and it includes one ground BATCH-60d6b9 did not have: this
# authoring task holds NO SHELL and therefore could not arm a digest map even if
# a blind phase were warranted, and an armed-looking map with no digests in it is
# the declaration-that-protects-nothing CORR-20260905-547849 exists to record.
#
# THIS BATCH APPROVES NOTHING AND ENACTS NOTHING. EXP-WESOVOW-001 remains
# `approved` and UNAMENDED at version 1. The object under attack -
# coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/protocol_amendment_redraft.yaml -
# is COMMITTED AND IMMUTABLE and remains `status: draft`, `in_force: false`,
# `approved_by: null`. ATTACKING A DRAFT IS NOT ENACTING IT, and opening a batch
# is not approving anything in it.
#
# THE ENACTING DECISION IS NOT IN THIS BATCH. See
# the_enacting_decision_is_not_in_this_batch below for the reasoning and, stated
# in the same block, THE COST OF DEFERRING IT A SEVENTH ROUND.
batch:
  id: BATCH-314308
  goal_id: GOAL-SSI-001
  question_ids:
    - RQ-SSI-001
  title: >-
    THE INDEPENDENT RED TEAM PASS ON THE REDRAFTED RECORD AS A PROPOSED ACT -
    not on its integrity, which BATCH-60d6b9 checked, but on what it would DO to
    the contract, whom it binds, what it forecloses, and what a reader of a green
    parse control would wrongly conclude - followed by an independent review of
    that pass, and by the ledger archive that finally performs CF-19 and the
    KN-TECH promotion.
  status: ready_for_dispatch
  status_note: >-
    Successor control plane to BATCH-60d6b9, which DEC-20260906-408595 closed as
    `revise` with exactly one next research action and with ZERO findings blocking
    the enactment path. FOUR TASKS IN A STRICT SERIAL CHAIN: one red-team
    producer, one snapshot archive, one independent validator review, one ledger
    archive. This file authorizes no execution by itself; dispatch_queue.json is
    the bounded dispatch contract. NO hypothesis status, experiment status, or
    goal status moves in this batch.

  opened_under_next_action: >-
    Quoted from the committed GOAL-SSI-001 head (ledger/goals/GOAL-SSI-001/goal.yaml,
    field `next_action`), which this batch implements: "THE NEXT RESEARCH ACTION is
    to open ONE bounded successor batch whose producer is an INDEPENDENT RED TEAM
    PASS ON THE REDRAFTED RECORD AS A PROPOSED ACT - not on its integrity, which
    this round checked, but on what it would DO to the contract, whom it binds,
    what it forecloses, and what a reader of a green parse control would wrongly
    conclude. THAT PASS IS THE MISSING PREREQUISITE FOR ANY ENACTING DECISION AND
    BATCH-60d6b9 WAS NOT IT."
  opened_under_next_action_read_note: >-
    HOW THAT FIELD WAS OBTAINED, STATED EXACTLY. This authoring task holds
    Read/Grep/Glob/Write/Edit and NO SHELL. It could not run
    `python3 tools/goal_head.py show GOAL-SSI-001 --field next_action`. It read the
    committed file ledger/goals/GOAL-SSI-001/goal.yaml directly and independently
    read ledger/decisions/DEC-20260906-408595.yaml next_actions NA-1 and NA-2 and
    ledger/evidence/EV-SSI-804e09.yaml boundaries; all three agree on the producer,
    on what the pass may not do, and on the FIVE items reserved to the enacting
    decision. THE DISPATCHING SESSION SHOULD RE-RUN THE TOOL AND RECORD ANY
    DIVERGENCE AS A FINDING rather than reconciling it silently. Reading a file the
    tool renders is weaker than running the tool, and is recorded as such.

  # =====================================================================
  the_enacting_decision_is_not_in_this_batch:
    ruling: >-
      THE ENACTING DECISION IS NOT COMPOSED BY THIS BATCH'S LEDGER ARCHIVE, AND
      THAT IS A DECISION TAKEN HERE RATHER THAN A CONSTRAINT INHERITED. The goal
      head says the enacting decision "is in neither batch until that pass
      returns", which makes it AVAILABLE to a batch in which the pass does return.
      This one does. It is deliberately not taken.
    the_three_reasons:
      - >-
        AN ENACTING DECISION COMPOSED IN THE SAME TASK THAT FIRST READS THE PASS
        HAS NO INDEPENDENT CHECK ON THE ENACTMENT ITSELF. Every artifact of this
        batch is an input to the enactment; none of them is a review OF it. The
        campaign's own standard - that a claim-changing act is reviewed by an agent
        that did not produce it - would be satisfied for the PASS and unsatisfied
        for the ACT. Enacting on a red-team pass that returns findings would be the
        campaign's strongest act to date, and it would rest on one reading, by the
        composing Coordinator, of a report delivered hours earlier.
      - >-
        FOUR OF THE FIVE RESERVED ITEMS NEED THE PASS'S INPUT AND THE FIFTH NEEDS
        SOMETHING THE PASS IS FORBIDDEN TO SUPPLY. RT-4's LICENSING question was
        carried into clause_4's text as ordered and, in DEC-20260906-408595's own
        words, "did not and could not SETTLE" it. The pass may not settle it either
        - it is expressly reserved to the enacting Coordinator. So the pass returns
        the material for a ruling and never the ruling, and a Coordinator that
        rules the same hour it receives the material has not deliberated, it has
        transcribed.
      - >-
        ENACTMENT MOVES EXP-WESOVOW-001 OFF VERSION 1. That is a status and version
        transition of an `approved`, frozen experiment contract on this campaign's
        only live enactment path, and it deserves its own bounded round with its
        own review plan, its own reserved identifiers and its own recorded prior -
        not a slot inside an archive task that is already composing a round,
        performing CF-19 and writing this campaign's first knowledge promotion.
    the_cost_of_deferring_it_again_stated_plainly: >-
      THIS IS THE SEVENTH CONSECUTIVE ROUND IN WHICH THE CONTRACT STAYS DEFECTIVE
      AND UNAMENDED, AND THE COST IS NOT ZERO. CF-1 remains DISCHARGED ONLY IN
      PART. experiments/EXP-WESOVOW-001/specification.yaml:39-40 is still jointly
      satisfiable with its own control C4 only on the degenerate slice log2 M = 0,
      it is still the governing document of an `approved` experiment, and a reader
      who does not read five committed decisions deep will not know. THE CAMPAIGN
      HAS ALSO DEFERRED CF-19 FOUR TIMES AND THE CITATION LIFT FIVE TIMES, and a
      programme that defers by default has stopped choosing. THIS BATCH THEREFORE
      DOES TWO THINGS TO KEEP THE DEFERRAL FROM BECOMING A HABIT. (a) It ENDS the
      CF-19 deferral and the knowledge-promotion deferral here, in its own ledger
      archive, rather than naming them again. (b) It requires its closing decision
      to make THE ENACTING BATCH the single next action with a NAMED PRECONDITION
      SET rather than an open-ended "when ready", so that a successor can check
      whether the precondition is met instead of re-arguing whether it is time.
    what_would_have_had_to_be_true_for_the_enactment_to_be_here: >-
      RECORDED SO THE DEFERRAL IS CHECKABLE AND NOT MERELY CAUTIOUS. Three things,
      none of which this batch can arrange: a second independent session reviewing
      the ENACTMENT rather than the pass; a Coordinator ruling on RT-4's licensing
      question drafted BEFORE the pass returned, so that the pass could attack the
      ruling rather than supply it; and the companion record for clause_3 and
      clause_4 in existence, because the redraft's own reviewer_notes state that
      enacting without it "leaves the contract with no conforming implementation"
      and that the two "should be enacted together".
    what_this_ruling_does_not_do: >-
      It does not promise that a future decision will enact, does not pre-approve
      the amendment, does not rank enactment above whatever the pass returns, and
      does not bind the closing decision to any outcome. If the pass returns a
      finding that BLOCKS enactment, the enacting batch is not opened at all and
      the closing decision says so.

  # =====================================================================
  objective: >-
    ONE producer, then one snapshot archive, then one independent review, then one
    ledger archive, strictly serial. (A) TASK-20260906-dc4905 is an INDEPENDENT RED
    TEAM PASS on the committed, immutable redraft
    coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/protocol_amendment_redraft.yaml
    AS A PROPOSED ACT, on four axes A1-A4, with a mandatory entailed-control
    exercise on named objects for which its conclusions are KNOWN FALSE. (B)
    TASK-20260906-51fec3 commits exactly that package, alone, before any reviewer
    sees it. (C) TASK-20260906-918585 independently reviews the pass on four joints
    J1-J4 owned in review_plan.yaml. (D) TASK-20260906-8f3ee7 composes the round
    into EV-SSI-0a57ab and DEC-20260906-f709b2, checkpoints the goal, PERFORMS CF-19,
    and writes this campaign's first KNOWLEDGE PROMOTION.

  why_this_producer_and_why_now:
    it_is_the_single_next_action: >-
      The goal head and DEC-20260906-408595 NA-1 name exactly one next research
      action and this batch is it. BATCH-60d6b9 bought an INTEGRITY review with its
      single review identifier and recorded the cost in advance: the redraft has had
      NO adversarial pass, its own reviewer says so, and no artifact of that round
      may be presented as one. The enacting decision cannot be made without it.
    what_is_new_about_the_object: >-
      The redraft is no longer a proposal on paper. It is COMMITTED, it PARSES when
      spliced, it differs from the frozen contract in exactly the five declared
      places, and its control has been shown able to FAIL on the unamended file.
      THAT IS PRECISELY WHY THE ACT QUESTION IS NOW THE LIVE ONE: a record that
      cannot be applied forecloses nothing, and this one can be applied. Every
      integrity question BATCH-60d6b9 answered makes the act question sharper, not
      softer.
    ranking_statement_required_by_the_unlimited_ecc_budget: >-
      GOAL-SSI-001 is an ECC goal - SSI is in the declared ECC area set at
      orchestration/research-priority.yaml line 47, READ THERE AND NEVER INFERRED
      FROM AN IDENTIFIER PREFIX - so its campaign budget is unlimited (CLAUDE.md
      rule 11). UNLIMITED REMOVES THE BATCH CEILING, NOT THE DUTY TO RANK. This pass
      is ranked first because it is the single blocking prerequisite on the
      campaign's only live enactment path; because its object is committed and
      immutable, so the round is cheap and fully reproducible; and because the
      alternative uses of the round - CF-7's remainder, CF-8, CF-12(a) - all depend
      on what an ENACTED amendment says the reconciliation is FOR, and nothing is
      enacted. ONE producer is dispatched and not two: the head names one, and a
      second adversarial pass launched by the same session under the same prompt
      would buy correlated agreement at the cost of the reviewer's depth.
      Re-checkable with `python3 tools/ecc_priority.py --classify GOAL-SSI-001`,
      which this authoring task holds no shell to run and therefore records with its
      source rather than as a tool output.
    what_is_deliberately_not_dispatched: >-
      Everything else, per item, under carried_forward below, so that not
      dispatching cannot evaporate into silence. In particular: CF-13's
      one-character fix (amendment_controls.py is in no write scope of this batch),
      CF-7's remainder, CF-8, CF-12(a) and (b), CF-18, and CF-25's three verified
      smaller repairs, which belong to a SUCCESSOR RECORD and never to an edit of
      the now-immutable redraft. None of these is a judgement about their value.

  # =====================================================================
  no_blind_phase:
    declared: false
    statement: >-
      THIS BATCH HAS NO BLIND PHASE. No value is protected, no `protected_sha256`
      map is armed, no commit-message history check gates any dispatch, and no task
      is handed a pre-merge worktree. `tools/check_review_independence.py
      --blind-history` is NOT APPLICABLE to this batch; it MUST NOT be run or
      recorded, and a report of UNCHECKABLE from that mode would be CORRECT rather
      than a defect.
    why_reasoned_for_this_batch:
      ground_1_nothing_is_re_derived: >-
        A blind phase exists to stop an agent being told the answer to a measurement
        it is about to make independently. THE PRODUCER MEASURES NOTHING AND
        RE-DERIVES NOTHING. Its core question - what the redraft would DO, whom it
        binds, what it forecloses - HAS NO PUBLISHED ANSWER ANYWHERE IN THIS
        REPOSITORY. Nobody has ever written it. There is no quantity to withhold.
        The mechanical facts about the redraft's bytes ARE published (EV-SSI-804e09
        OBS-1 through OBS-8), and withholding them would not blind the pass, it
        would make it spend its budget re-deriving what is already on the record.
      ground_2_the_mechanism_does_not_reach_a_producer: >-
        `blind_rederivation.assigned_to` is checked by the tool against an agent
        that files a `review_attestation`, and `blind_from` is compared with that
        agent's declared `sources_read`. THE ONLY REVIEWER OF THIS BATCH MUST READ
        THE PASS'S REPORT - it is its object - so a `blind_from` list naming it
        would either collide with the reviewer's own honest `sources_read` or force
        it to skip its joints. That is the identical mechanical reason BATCH-60d6b9
        recorded, and having SIX identifiers rather than four does not change it:
        what would change it is a SECOND reviewer re-deriving a quantity a first
        agent produced, and this batch has no such quantity to re-derive.
      ground_3_this_batch_could_not_arm_one_and_says_so: >-
        NEW IN THIS BATCH AND DECISIVE ON ITS OWN. This authoring task holds NO
        SHELL. It cannot compute a sha256 and may not invent one, so
        `blind_phase_hygiene.protected_sha256` could not be armed here at all. And
        even with a shell there is no object for it: that map protects LITERAL
        VALUES against leaking through commit messages, and this round's candidate
        protected object is a FILE, not a number. Declaring a blind phase whose
        hygiene map is empty would announce a protection that protects nothing, and
        a declaration that protects nothing teaches every later reader to skip the
        one that does.
    what_replaces_protection_and_it_is_weaker: >-
      TWO STRUCTURAL MEASURES, BOTH WEAKER THAN A BLIND PHASE AND BOTH RECORDED AS
      WEAKER. (i) A READ_SCOPE BOUNDARY: review_plan.yaml, which carries the
      Coordinator's prior, is NOT in the producer's read_scope. This is the one
      thing this batch does that BATCH-60d6b9 did not, and its cost is that the
      proves-too-much objects had to be reproduced in the producer's own card. A
      read_scope declaration is not a tool-enforced blind phase. (ii) AN ATTESTED
      ORDERING on the reviewer: produce your own entailed-control results BEFORE
      opening the pass's entailed_control_objects.yaml, then open it and say where
      yours differs. That is an attestation, not a tool result.
    cf_15_first_limb_still_has_no_object_and_this_is_the_third_batch: >-
      CF-15's FIRST limb - naming the launching prompt as a protected channel INSIDE
      a blind-phase declaration - has NO OBJECT HERE FOR THE THIRD BATCH RUNNING,
      because this batch declares no blind phase. IT REMAINS OWED, and this batch
      names exactly what would create an object for it so a successor does not have
      to reconstruct it: a batch in which a SECOND reviewer independently re-derives
      a quantity a first agent produced, with that agent's output in its OWN FILE so
      `blind_from` can name it without colliding with an honest `sources_read`, and
      with the digest map armed by a session that HOLDS A SHELL before dispatch.
      Its SECOND limb IS applied: see launching_prompt_disclosure.
    the_honest_residual: >-
      Declaring no blind phase does NOT make this round free of disclosure effects.
      The producer is launched by a session that has read the redraft, the
      BATCH-79a0cb red-team report, the BATCH-60d6b9 validation report and
      DEC-20260906-408595, and it is told which key paths to attack. That is F-12's
      channel (CF-15) and it is unavoidable when the assignment IS the attack. It is
      BOUNDED AND DISCLOSED instead of hidden - see launching_prompt_disclosure and
      key_paths_named_to_the_producer.

  # =====================================================================
  key_paths_named_to_the_producer:
    why_this_block_exists: >-
      NAMING A KEY PATH IS A STEER, AND A STEER THAT IS NOT WRITTEN DOWN IS A
      CHANNEL. BATCH-60d6b9's most consequential recorded discount was that its
      producer's launching prompt "NAMED THE TRAP" and "ENUMERATED ALL FIVE NEGATIVE
      OBJECTS WITH THE OUTCOME EACH MUST PRODUCE", so the producer's anticipation
      was substantially the dispatching session's. This batch cannot avoid pointing
      the pass at an object, but it CAN record exactly where it pointed and exactly
      what it did not say.
    key_paths_this_control_plane_names_to_the_producer:
      - amendment.proposed_replacement (all four clauses)
      - amendment.blast_radius
      - amendment.what_this_changes and amendment.what_this_does_not_change
      - amendment.reserved_to_the_enacting_decision
      - amendment.cf_10_raw_path_placement
      - amendment.enactment (including prerequisites_before_such_a_decision)
      - amendment.controls
      - amendment.scope
      - amendment.reviewer_notes.known_weaknesses_of_this_draft
    what_this_control_plane_deliberately_does_not_say: >-
      IT DOES NOT SAY WHAT IS WRONG WITH ANY OF THEM, does not say whether any of
      them is defective, does not name an expected finding, does not say which axis
      any of them belongs to, and does not say how many findings a good pass
      returns. The Coordinator's prior, which DOES contain expectations, is in
      review_plan.yaml and is OUTSIDE THE PRODUCER'S READ SCOPE for exactly this
      reason. THE DISPATCHING SESSION MUST NOT REPAIR THAT SEPARATION BY SPEAKING
      THE PRIOR ALOUD AT LAUNCH, and it must disclose its launching prompt either
      way.
    the_residual_that_survives_this_disclosure: >-
      A list of nine key paths is itself information: it says these blocks are where
      the Coordinator thinks an act lives. A pass that finds its material only in
      those nine has been steered, and the reviewer is asked at J3 to check exactly
      that - whether any finding rests on a block this list does not name.

  # =====================================================================
  citation_prohibition:
    status: >-
      IN FORCE, RETAINED IN FULL, BOTH LIMBS. NOT LIFTED, NOT NARROWED, NOT WIDENED
      BY THIS BATCH, AND NO TASK OF THIS BATCH MAY LIFT IT. It has been considered
      for lifting and deliberately retained in FIVE consecutive committed decisions
      (DEC-20260904-166ab5, DEC-20260904-4c81b6, DEC-20260905-5f5592,
      DEC-20260905-3b8e94, DEC-20260906-408595). THIS BATCH IS THE SIXTH CONSECUTIVE
      ROUND IN WHICH THE LIFT IS AVAILABLE. Opening the batch does not lift it and
      does not pre-decide the question; the closing decision must reason it AFRESH
      FOR THIS ROUND rather than inherit an answer, and the repetition is itself a
      reason to reason it afresh.
    retained_verbatim: >-
      The `P=512` crossover value and its `w=2^80` sign are **NOT
      citation-eligible**. This task does not lift that prohibition. Only a
      committed Coordinator decision on independently reviewed evidence can lift it.
    predicate_extension_verbatim: >-
      In addition to the retained sentence, a row of any EXP-WESOVOW-001
      reconciliation is NOT citation-eligible when either (a) the two anchors
      disagree in the SIGN of the baseline comparison at that row, or (b) the
      smaller |margin| across the two anchors at that row is below that field size's
      anchor gap |Delta log2 T_full + Delta log2 M / 2|.
    the_ground_that_binds_this_batch_hardest: >-
      RT-2 establishes that the adopted monotonicity route is CONDITIONAL ON
      `A > 0`, and `A > 0` IS the per-row baseline-comparison sign the retained
      sentence governs. The redraft's own R3 warrant sentence relies on an exclusion
      region with that antecedent. A RED TEAM ATTACKING THAT WARRANT SENTENCE WILL
      BE TEMPTED TO CHECK THE ANTECEDENT AT A DECLARED FIELD SIZE. IT MAY NOT.
      WHERE A CHECK WOULD REQUIRE A GOVERNED SIGN, THE CORRECT OUTPUT IS THE
      STATEMENT THAT IT WOULD, NEVER THE VALUE. BATCH-60d6b9's reviewer reached this
      independently and acted on it; this batch requires it in advance.
    machine_flag_status: >-
      BATCH-256a94's anchor_reconciliation.json per-row `citation_prohibited` flag is
      scoped by field size and is KNOWN TO UNDER-REPORT: at least two rows carrying
      `citation_prohibited: false`, at log2 p = 256, fall under the predicate. That
      artifact is snapshot-bound, IMMUTABLE, and MUST NOT be edited. Every consumer
      applies the five decisions above on top of it. This batch produces no successor
      to it and does not repair it.
    application_to_this_batch: >-
      Reasoned, not assumed. The producer reads a record whose primary target is an
      analytic crossover line and reads the frozen contract itself, so the retained
      sentence is APPLICABLE. QUOTING the frozen contract's text and the redraft's
      replacement text is permitted and is required by J2. DERIVING, RECOMPUTING,
      TABULATING or CITING a crossover value, a baseline-comparison sign, a margin
      or a speedup is NOT - including while arguing that the redraft should have
      stated one. Rows and fields are named BY LOCATOR. Every artifact of this batch
      restates both limbs verbatim and states which, if either, it found applicable
      and whether either fired.
    lift_procedure: >-
      Only a committed coordinator_decision resting on independently reviewed
      evidence may lift it. No identifier is reserved here for a lift. What would
      support one is recorded in DEC-20260906-408595
      citation_boundary.what_would_actually_support_a_lift and none of its four
      pieces is in this batch.

  # =====================================================================
  frozen_artifact_ruling: >-
    READ-ONLY FOR EVERY TASK IN THIS BATCH, with ONE narrow declared exception named
    below: experiments/EXP-WESOVOW-001/specification.yaml;
    experiments/EXP-WESOVOW-001/cost_model.py; everything under
    experiments/EXP-WESOVOW-001/runs/; everything under inputs/P13-WESOLOWSKI-2026/;
    every artifact of BATCH-752ef2; every artifact of BATCH-79a0cb; and - ADDED BY
