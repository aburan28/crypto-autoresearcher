      OF THIS BATCH. IT IS FORECLOSED IN ADVANCE RATHER THAN CLAIMED AND WITHDRAWN.
      Three facts, none inferred: (a) IMP-1 on the GOAL-SSI-001 head records that only
      the `local` backend resolves in this environment; (b) the previous three rounds
      each recorded an adapter resolution with `model_verified: false` and NO PROBE
      RUN, and two producers recorded an adapter-resolved identifier DIVERGING from
      their own session self-report, ruled NOT a fallback by DEC-20260906-408595
      because no binding was in force; (c) EVERY AGENT OF THIS BATCH IS A SUBAGENT OF
      ONE ORCHESTRATING SESSION, sharing one filesystem and one scratchpad. THE MOST
      THIS BATCH CAN ASSERT IS THAT THE REVIEWER RAN IN ITS OWN SESSION, INDEPENDENT OF
      THE PRODUCER'S. Agreement between the reviewer and the pass is corroboration by a
      second METHOD in a second SESSION, NEVER agreement between distinct models, and
      any artifact that presents it as the latter is wrong.
    what_that_leaves_open: >-
      Concretely: a shared reading of what an amendment is ALLOWED to do, a shared
      blind spot about whom a contract binds, and a shared sense of which consequences
      are worth calling foreclosures. Two sessions of one model family agreeing is
      evidence about the argument's legibility to that family and weaker evidence about
