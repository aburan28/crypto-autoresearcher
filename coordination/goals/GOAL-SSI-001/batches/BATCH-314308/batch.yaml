      margin or a speedup halts the batch. Where a check would require one, the correct output
      is THE STATEMENT that it would, and the task continues.
    - >-
      ANY TASK APPROVING OR ENACTING THE AMENDMENT, resolving one of the five items reserved
      to the enacting decision, or lifting either limb of the citation prohibition. None of
      these is within any task's authority here, and a task that finds itself about to do one
      stops and returns the object to the Coordinator.
    - >-
      THE PASS OR THE REVIEWER CONCLUDES THE UNDERLYING DEFECT DOES NOT REPRODUCE - that
      specification.yaml:39-40 and control C4 are not jointly unsatisfiable off the degenerate
      slice, or that the two blocks are not in one scope. Halt on that object: it contradicts
      EV-SSI-2aaf6f at strength `replicated` and requires review-breakthrough at `max`, which
      is `degradable: false` and which this environment cannot serve (IMP-1). Record it
      precisely and in full, compose the rest of the round, LEAVE THE CLAIM UN-PROMOTED, and
      return the object to the Coordinator. THE CAMPAIGN DOES NOT STOP AND THE GOAL STAYS
      `active`. This is the most consequential thing either agent could find and the stop
      condition must not discourage finding it.
    - >-
      THE SNAPSHOT COMMIT CANNOT BE MADE, or does not change exactly the four declared paths.
      The review is NOT dispatched; the batch stops and returns to the Coordinator. Reviewing
      uncommitted producer artifacts is not a fallback.
    - >-
      A PRODUCER ARTIFACT'S SHA256 AT LEDGER-ARCHIVE TIME DOES NOT MATCH WHAT THE SNAPSHOT
      ARCHIVE RECORDED. That means the reviewed object changed after it was reviewed. The
      archive stops and returns to the Coordinator; it is not a note and it is never repaired
      by re-hashing.
    - >-
      Any task that cannot complete within its declared budget stops and reports the exhaustion
      as an operational observation. A timeout, crash, missing dependency or exhausted budget is
      INFRASTRUCTURE SIGNAL and is NEVER negative mathematical evidence.
    - >-
      If a task wrote fewer or more than its declared artifacts, the shortfall or excess is
      reported and the batch returns to the Coordinator. Nothing is invented, completed or
