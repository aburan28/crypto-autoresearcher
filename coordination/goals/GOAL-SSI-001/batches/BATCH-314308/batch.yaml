      producer is asked to produce, not after it returns.
    what_would_make_this_producers_output_vacuous:
      - >-
        ENTAILED BY THE ASSIGNMENT. Asked "what does it foreclose", any agent returns
        foreclosures, because every record that proposes anything forecloses something.
        A finding set whose existence is guaranteed by the question carries no
        information about the redraft.
      - >-
        ENTAILED BY THE PROMPT. The launching prompt and this control plane name nine
        key paths and four axes. A report whose findings are exactly those nine blocks
        populated into those four axes is the dispatching session's outline with a
        red-team header.
      - >-
        ENTAILED BY THE CAMPAIGN RECORD. Re-confirming RT-1, RT-4, RT-5, RT-7, RT-8,
        RT-9(b), F-2, F-3, F-7, V-1, V-2 and V-3 and relabelling them as act findings
        is a bibliography, not a pass. Blindness is deliberately lifted for the
        producer, so its agreement with any of them is NOT independent of the reports
        it was given.
      - >-
        ENTAILED BY THE DRAFT'S OWN DISCLOSURES. The redraft carries
        `reviewer_notes.known_weaknesses_of_this_draft`, which already names four
        weaknesses including that clause_3 and clause_4 leave the one existing
        implementation non-conforming. A pass that returns those four has read the
        draft's own confession back to it.
    the_named_entailed_control_object: >-
      THE INERT OBJECT:
      coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-0fbf69/run_provenance_attestation.yaml.
      It is a committed record of this campaign that PROPOSES NO ACT: it attests
      provenance about two immutable run manifests, binds nobody, amends nothing, and
      changes no contract. "This record would bind a party, foreclose an option, or
      mislead a reader of a green control about an amendment" IS KNOWN FALSE FOR IT.
      RUN THE ACT-ANALYSIS PROCEDURE, UNCHANGED, ON IT. If the procedure returns
      act-findings of the same class and severity there, the findings are products of
      the procedure and not of the redraft, and THAT IS THE ROUND'S MOST VALUABLE
      POSSIBLE RESULT.
    the_discriminating_twin_object: >-
      THE SUPERSEDED BATCH-752ef2 DRAFT at
      coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/protocol_amendment_draft.yaml.
      It is immutable, superseded, and KNOWN UN-ENACTABLE - its clause_1 does not parse
      when spliced, established by three independent sessions at three candidate
      columns. "This is a live proposed act" is KNOWN FALSE for it. Any foreclosure
      finding that applies EQUALLY to the twin is a finding about amendments of this
      shape in general, or about this campaign, and NOT about the redraft's own text,
      and it must be labelled as such. This is the object that separates "what THIS
      redraft does" from "what any amendment like it does".
    why_a_null_object_alone_would_not_be_enough: >-
      Because a procedure can be non-vacuous and still be unspecific. The inert object
      catches a procedure that fires on anything; the twin catches a procedure that
      fires on the class rather than on the instance. The campaign's three previous
      entailment failures were all of the FIRST kind, which is exactly why the second
      is worth paying for now.
    both_directions_are_required: >-
      A procedure that returns NOTHING on every object - including the redraft - is
      equally uninformative, and its silence is not evidence that the redraft is safe.
      The positive control is not optional.

