  frozen_artifact_ruling_the_one_declared_exception: >-
    TASK-20260906-8f3ee7, THE LEDGER ARCHIVE, AND IT ALONE, HOLDS
    inputs/P13-WESOLOWSKI-2026/source_record.yaml IN ITS WRITE SCOPE, FOR EXACTLY ONE
    INSERTION: CF-19, the provenance block at key path `provenance.external_retrieval`,
    added as a NEW sub-mapping under the EXISTING top-level `provenance:` mapping,
    with nothing existing edited, reworded, reordered or removed. This is a
    COORDINATOR ACT ON REVIEWED EVIDENCE and is available to an archive that DECLARES
    the path in its own set, which this one does. It is available to NO producer and
    to NO reviewer, and any other write anywhere under inputs/ is a stop condition.
  frozen_artifact_ruling_scope_clarification_on_reading_cost_model_py: >-
    A CLARIFICATION THIS BATCH MAKES IN WRITING BECAUSE TWO COMMITTED RECORDS READ
    DIFFERENTLY AND AN AGENT SHOULD NOT HAVE TO GUESS. BATCH-60d6b9's producer card
    permitted READING cost_model.py as text with disclosure; DEC-20260906-408595
    limitations describe the file as "unreadable under CF-10's containment", which is
    stronger than the card said. THE RULING FOR THIS BATCH: READING
    experiments/EXP-WESOVOW-001/cost_model.py AS TEXT IS PERMITTED, and any task that
    does so must say so and say which lines it read; EXECUTING IT IS ABSOLUTELY
    FORBIDDEN, with or without WESOVOW_RAW_PATH. This matters because the redraft's
    blast-radius line numbers "were verified by NOBODY this round" and reading is the
    only instrument that can verify them. THIS IS A TASK-SCOPE RULING AND IT IS NOT A
    RESOLUTION OF CF-10, whose reserved item is the RAW_PATH PLACEMENT question and
    which stays open to the enacting decision.

  execution_prohibition:
    new_experiment_runs_authorized: 0
    statement: >-
      THIS BATCH AUTHORIZES ZERO EXPERIMENT RUNS. It authorizes NO execution of any
      experiment implementation and creates NO run record. Authorized invocations are
      of (i) the two committed scripts of BATCH-60d6b9 -
      tasks/TASK-20260906-ee372e/amendment_parse_control.py and
      reviews/TASK-20260906-ba0284/independent_parse_check.py - run UNMODIFIED and
      read-only, which is permitted and is how a claim about the redraft's bytes is
      checked rather than believed; and (ii) either agent's throwaway scratch scripts,
      written OUTSIDE the repository. Calling a standalone control module is NOT a run
      and does not write a run record: this is the standing interpretation ruled in
      DEC-20260904-166ab5 PD-4, restated on every card of this batch rather than left
      to be inferred. NOTHING may be written into any BATCH-752ef2, BATCH-79a0cb or
      BATCH-60d6b9 directory, into experiments/, or into inputs/ - except the one
      declared CF-19 insertion by the ledger archive.
    the_amended_file_is_never_written_to_disk_in_the_repository: >-
      Any splice is IN MEMORY, or into a scratchpad OUTSIDE the repository. Writing an
      amended specification.yaml anywhere under experiments/ - even under a different
      name, even temporarily - is a stop condition. The contract is frozen and
      unamended at version 1 and must remain so at every instant of this batch.

  network_use:
    required_by_any_task: false
    statement: >-
      No task of this batch needs the network, and no conclusion of this round may
      rest on a retrieval. A retrieval failure is infrastructure signal and is never
      mathematical evidence about anything. A model recollection is a `recalled`
      pointer under AGENTS.md rule 9 and is never support; naming the nearest work you
      can recall, marked and hedged, is wanted, and presenting it as a checked source
      is the violation.
    prohibited: >-
      Never select a provider, backend, endpoint, or model identifier containing
      `bedrock`, case-insensitively (AGENTS.md rule 16).

  # =====================================================================
  archive_topology:
    shape: >-
      FOUR TASKS IN A STRICT SERIAL CHAIN, AND FOR THE FIRST TIME IN THREE BATCHES IT
      IS THE FULL CHAIN THIS PROGRAM'S ARCHIVAL CONTRACT WANTS.
      TASK-20260906-dc4905 (red-team producer, `review_required: TRUE`) ->
      TASK-20260906-51fec3 (SNAPSHOT ARCHIVE, coordinator, `kind: snapshot`,
      `binding_mode: commit`, owning the producer, RUNS ALONE) ->
      TASK-20260906-918585 (validator, independent session, depends on BOTH the
      producer and the snapshot) -> TASK-20260906-8f3ee7 (LEDGER ARCHIVE, coordinator,
      `kind: ledger`, `binding_mode: commit`, owning the review, RUNS ALONE).
    what_six_identifiers_bought_that_four_did_not:
      stated_first_because_it_is_the_answer_to_the_previous_round: >-
        BATCH-60d6b9 recorded, as a real cost, that FOUR identifiers could not express
        this shape once a producer sets `review_required: true`, because
        tools/research_dispatch.py `_validate_review_chains` then demands
        producer -> snapshot archive -> review -> ledger archive. It chose the
        four-task shape with a reviewer and NO snapshot-archive task, and its own
        `what_a_successor_should_do` says: use the five-task shape. THIS BATCH DOES.
      it_bought_three_concrete_things:
        - >-
          `review_required: true` ON THE PRODUCER IS NOW TRUE OF THE FLAG AND TRUE OF
          THE WORLD. BATCH-60d6b9 had to declare it false on two reviewed producers
          and record that the flag was "TRUE OF THE FLAG AND FALSE OF THE WORLD".
          That declaration is gone.
        - >-
          THE PRE-REVIEW COMMIT IS A QUEUED ARCHIVAL TASK AGAIN. It has a card, a
          budget, a completion gate, a receipt and a DISPATCHER POST-COMMIT VERIFIER
          PASS. BATCH-60d6b9's pre-review commit had none of those - it was a
          dispatch_precondition executed by the dispatching session, which its own
          PD-1 called "the same cost BATCH-79a0cb accepted, one notch worse". That
          cost is gone, and with it the compensating six-hash gate that PD-2 records
          as SPENT BUT NEVER BOUGHT because the composing task could not run it.
        - >-
          BOTH ARCHIVES BIND IN `commit` MODE RATHER THAN `content_first`. Neither
          archive's expected path set contains a path committed by somebody else, so
          each commit can be required to change EXACTLY its expected set - which is
          the stronger binding, and it is available only because the snapshot task
          exists.
      and_it_bought_two_spare_identifiers_which_are_reserved_and_not_filled: >-
        TASK-20260906-23f571 and TASK-20260906-238142 are RESERVED UNUSED. A second
        reviewer and a second adversarial pass were both considered and both declined:
        the goal head names ONE producer, a second pass launched by the same session
        under the same prompt would buy correlated agreement at the cost of the single
        reviewer's depth, and a second reviewer with disjoint joints would have needed
        a genuine blind separation this batch has no object for (no_blind_phase ground
        2). INVENTING WORK FOR AN IDENTIFIER IS WORSE THAN LEAVING IT UNUSED, and an
        unused identifier is recorded rather than quietly dropped.
    binding_mode_reasoning: >-
      `commit` FOR BOTH, DELIBERATELY, AND NOT INFERRED FROM A FAILED SCOPE CHECK.
      The snapshot archive's expected set is its own receipt plus the producer's three
      artifacts, and its commit changes exactly those four. The ledger archive's
      expected set is its own SEVEN artifacts plus the reviewer's THREE, and its
      commit changes exactly those ten. `content_first` is for source packages
      committed before their archive task ran and one exact changed-path commit cannot
      express custody of the whole set; that is not this batch's situation for either
      archive, and opting into the weaker mode without needing it would waste the one
      thing the extra identifiers bought.
