    why_this_block_is_here: >-
      THIS CAMPAIGN HAS NOW SEEN THREE INSTANCES OF A CHECK WHOSE PASS WAS ENTAILED BY
      ITS OWN CONSTRUCTION - AC-1's pass region being exactly how AC-1's input is built
