        RT-9(a)'s locator sentence survives word for word, RT-12 is neither adopted nor
        rejected, and the redraft's own `reserved_to_the_enacting_decision` block records
        all three as undecided. If the pass reports any of the three as resolved, foreclosed
        or settled by the redraft, THAT IS A BREAK OF THE PASS - a reading defect against
        committed bytes - and not a finding about the redraft.
      - >-
        THE GREEN-CONTROL READER OBJECT. Take
        BATCH-60d6b9/tasks/TASK-20260906-ee372e/amendment_parse_control_report.yaml, which
        records the control PASSING on the redraft. Enumerate what a reader would wrongly
        conclude from that green result and CHECK EACH CANDIDATE AGAINST A COMMITTED
        ARTIFACT rather than asserting it: "the contract has been amended" is known false
        (nothing is enacted; the file is byte-identical); "nothing else in the contract
        moved" is NOT established by the control (V-2, no whole-document invariant) but IS
        established separately by the reviewer's structural diff (EV-SSI-804e09 OBS-1), so a
        pass that reports the first without the second has overstated; "the amendment is
        correct" was never tested by anything. A candidate wrong conclusion that a committed
        artifact in fact establishes is a BREAK of the pass.
      - >-
        POSITIVE CONTROL, WHICH IS NOT OPTIONAL. THE REDRAFT ITSELF. The procedure must
        return the pass's actual act-findings on it. A procedure that returns nothing on
        every object, including the object it was built for, has rejected the decoys for no
        reason and its silence carries no information either - and it is not evidence that
        enactment is safe.
    failure_signature: >-
      ON THE INERT OBJECT the procedure must return NO act-finding; if it returns findings
      of the same class and severity as against the redraft, report a BREAK with the finding
      set that survived and the point in the procedure where the survival happens - THAT
      LOCATION IS THE FINDING. ON THE TWIN OBJECT the surviving set must be strictly smaller
      than, or differently classed from, the redraft's, and every survivor must be labelled
      a class finding; an unlabelled survivor is a BREAK. ON THE KNOWN-FALSE ATTRIBUTION
      OBJECT the pass must report all three of RT-6, RT-9(a) and RT-12 as UNRESOLVED; any
      other answer is a BREAK of the pass. ON THE GREEN-CONTROL READER OBJECT every claimed
      wrong conclusion must be checked against a committed artifact and any that a committed
      artifact establishes is a BREAK. ON THE POSITIVE CONTROL the procedure must return the
      pass's actual findings. REPORT WHAT THE PROCEDURE ACTUALLY DID ON EACH OBJECT, NOT WHAT
      IT SHOULD HAVE DONE. A finding where the conclusion is known false is a BREAK and is
      reported as one, never as thoroughness. If a finding set turns out to be entailed by
      its own construction, SAY SO PLAINLY: that disclosure is worth more than the findings
      (DEC-20260904-166ab5 on RG-4; DEC-20260904-4c81b6 F-3; RT-3 of the BATCH-79a0cb report;
      and OBS-3 of EV-SSI-804e09, where a producer anticipating exactly this overturned the
      Coordinator's prior).
    assigned_to: TASK-20260906-918585
    also_required_of_the_producer: >-
      THE PRODUCER MUST RUN ALL FIVE OBJECTS ITSELF and file entailed_control_objects.yaml.
      That requirement is on its task card and in the queue's handoff block because THIS FILE
      IS OUTSIDE ITS READ SCOPE. The two statements are intended to be identical; IF THEY EVER
      DIFFER, THIS FILE GOVERNS, and the reviewer reports the divergence as a defect of the
      control plane rather than of the producer.

  blind_rederivation:
    required: false
    why_not_required: >-
      A DELIBERATE `false`, WITH ITS REASON, AND THE REASON IS MECHANICAL RATHER THAN
      ECONOMIC. `blind_from` is checked by tools/check_review_independence.py against the
      re-deriver's declared `sources_read`, and `assigned_to` must name an agent that FILES A
      review_attestation. This batch has ONE reviewer and its object IS the producer's report,
      so declaring that report `blind_from` would either collide with an honest `sources_read`
      or force every joint to be skipped. A PRODUCER CANNOT CARRY A blind_from LIST AT ALL
      UNDER THIS TOOL, so the one separation this batch does have - keeping this plan out of
      the producer's read_scope - is not expressible here and is declared in batch.yaml
      instead. SIX IDENTIFIERS DID NOT CHANGE THIS: what would change it is a SECOND reviewer
      re-deriving a quantity a FIRST agent produced, and this round has no such quantity -
      its product is an argument, not a measurement.
    what_replaces_it_and_it_is_weaker: >-
      THE ATTESTED ORDERING AT J3: the reviewer applies the pass's own procedure to the inert
      and twin objects and records its own results BEFORE opening
      tasks/TASK-20260906-dc4905/entailed_control_objects.yaml, then opens it and says where
      its results differ. That is an attestation, not a mechanically checkable `blind_from`
      list, and it is recorded as weaker rather than described as equivalent. No path is
      forbidden to the reviewer at any time.
    quantity_if_it_were_required: >-
      Recorded so a successor does not have to reconstruct it: what the act-analysis
      procedure returns when applied UNCHANGED to
      BATCH-60d6b9/tasks/TASK-20260906-0fbf69/run_provenance_attestation.yaml and to
      BATCH-752ef2/tasks/TASK-20260905-28c89d/protocol_amendment_draft.yaml - specifically,
      whether it returns any act-finding on the first, and which of the redraft's act-findings
      survive unchanged on the second.
    blind_from: []
    assigned_to: null

  procedure_deviations: []
  procedure_deviations_note: >-
    Empty at authoring, and REQUIRED TO BE FILLED BY THE COMPOSING LEDGER-ARCHIVE TASK with
    every departure from this plan - acting before the report returns, reassigning a joint,
    dropping a control object, dispatching without a gate, or dispatching the review before the
    snapshot commit exists. THE AUTHORITATIVE LOCATION FOR THIS ROUND'S PROCEDURE DEVIATIONS IS
    `procedure_deviations` IN THE COMMITTED DECISIONS - DEC-20260906-6a620e for what is known at
    open, DEC-20260906-f709b2 for the round - deliberately, because this file is NOT in either
    archive task's write scope and writing it would break their enumerated expected path sets.
    This resolution follows DEC-20260905-5f5592 PD-8 and both predecessor plans, which
    established that a deviation recorded in a committed decision is stronger than one recorded
    in a control-plane file. NOTE THAT THIS BATCH OPENS WITH EIGHT DEVIATIONS ALREADY DECLARED
    in DEC-20260906-6a620e, none of which is a defect discovered later.
