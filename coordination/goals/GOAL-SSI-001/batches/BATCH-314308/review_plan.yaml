# THE REVIEW PLAN FOR BATCH-314308, WRITTEN BEFORE THE PRODUCER RUNS.
#
# STANDALONE FILE, TOP-LEVEL KEY `review_plan`, and the ONLY file in this batch
# directory carrying one, so
#   python3 tools/check_review_independence.py --batch \
#       coordination/goals/GOAL-SSI-001/batches/BATCH-314308
# resolves exactly one plan and `--plan` names this file directly. No task card of
# this batch carries a `review_plan` mapping; each carries a `review_plan_ref`
# STRING, which the tool's plan resolver ignores.
#
# THIS FILE IS OUTSIDE THE PRODUCER'S READ SCOPE, DELIBERATELY. TASK-20260906-dc4905
# does not read it. The Coordinator's prior below is an expectation about what an
# adversarial pass will find, and handing it to the agent that is about to look is
# the CF-15 channel with extra steps. The producer receives its four axes, its
# entailed-control objects and its prohibitions from its own task card and from the
# queue's handoff block. THE COST: the object list exists in two places and two
# copies can disagree. THIS FILE GOVERNS.
#
# THIS BATCH HAS NO BLIND PHASE. Nothing is protected, nothing is withheld by
# hash, and no value is declared by digest. See batch.yaml no_blind_phase for the
# three grounds, one of which is that the authoring task held no shell and could
# not arm a `protected_sha256` map at all. `blind_rederivation.required` is
# deliberately FALSE below, with its reason, and an ATTESTED ORDERING replaces it
# and is weaker. `--blind-history` is NOT APPLICABLE and must not be run.
review_plan:
  batch_id: BATCH-314308
  goal_id: GOAL-SSI-001
  written_at: '2026-09-06'
  written_by: coordinator
  round_opened_by_handoff: TASK-20260906-918585

  claim_under_review: >-
    ONE PRODUCER PACKAGE OF THIS BATCH, AND NOTHING ELSE: the independent red team
    pass at
    coordination/goals/GOAL-SSI-001/batches/BATCH-314308/tasks/TASK-20260906-dc4905/,
    comprising act_analysis_red_team_report.yaml and entailed_control_objects.yaml.
    Concretely: that its account of what the redrafted record would DO to
    experiments/EXP-WESOVOW-001/specification.yaml if enacted, of whom it binds, of
    what it forecloses, and of what a reader of a green parse control would wrongly
    conclude, is exactly what the redraft's own committed bytes support - no
    stronger and no weaker; and that its finding set is not entailed by its own
    construction, by its launching prompt, or by the campaign's existing record.
    THE OBJECT OF THE PASS - the redraft at
    coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/protocol_amendment_redraft.yaml -
    IS COMMITTED AND IMMUTABLE AND IS NOT ITSELF THE CLAIM UNDER REVIEW HERE; its
    integrity was reviewed by TASK-20260906-ba0284 and is not re-litigated. THE
    REDRAFT IS NOT APPROVED BY THIS ROUND AND IS NOT APPROVED BY ANY DECISION OF
    THIS BATCH. EXP-WESOVOW-001 stays `approved` and UNAMENDED at version 1.

  what_this_round_is_for: >-
    Checking an adversarial reading by an agent that did not write it. BATCH-60d6b9
    established that the redraft's INTEGRITY holds: it splices, it parses, it
    differs from the frozen contract in exactly five declared places, it carries
    what was ordered, and its control can fail. NONE OF THAT IS AN ANSWER TO WHAT
    ENACTING IT WOULD DO. This batch buys that answer, and this plan exists because
    an act analysis is the easiest kind of report to write persuasively and the
    hardest to check: it has no exit code, its findings can be true of every
    amendment ever drafted, and a reader cannot tell a foreclosure the text effects
    from a foreclosure the analyst inferred. THE JOINTS BELOW ARE THE PLACES WHERE
    THAT DIFFERENCE IS CHECKABLE.

  coordinator_prior: >-
    RECORDED BEFORE THE PRODUCER RUNS, AND THE COORDINATOR'S OWN EXPOSURE IS
    DISCLOSED FIRST. This prior is written by a Coordinator that HAS read
    DEC-20260906-408595 and EV-SSI-804e09 in full, the BATCH-60d6b9 batch file,
    review plan, queue and task cards, and the redraft's own key-path index plus its
    `what_this_changes`, `what_this_does_not_change`,
    `reserved_to_the_enacting_decision`, `enactment` and
    `reviewer_notes.known_weaknesses_of_this_draft` blocks. It has NOT read the
    redraft's four `proposed_replacement` clauses, has NOT opened
    experiments/EXP-WESOVOW-001/specification.yaml, has not read cost_model.py, the
    parse control, the control report, the BATCH-79a0cb red-team report or the
    BATCH-60d6b9 validation report, and has run NO TOOL OF ANY KIND. So this is a
    prior about what a PASS WILL FIND, not about the contract, and the Coordinator's
    account of every mechanical fact in it rests on committed reports rather than on
    its own reading.
    (1) OVERALL. I expect the pass to return at least one act-finding that changes
    what an enacting decision must SAY, at roughly 0.75. I give roughly 0.35 to a
    finding that BLOCKS enactment outright rather than shaping it, roughly 0.2 to
    the pass's most valuable output being not a finding at all but a sharpened
    statement of one of the five reserved items, and roughly 0.1 to something I have
    not thought of. I RECORD PLAINLY THAT I EXPECT THIS PASS TO MATTER: it is the
    last prerequisite before the campaign's strongest act, and I would rather it
    delay that act than decorate it.
    (2) WHERE I THINK THE ACT BITES HARDEST, NAMED IN ADVANCE SO A HIT IS NOT READ AS
    A SURPRISE AND A MISS IS NOT READ AS SILENCE. The redraft's own
    reviewer_notes state that clause_3's serialization requirement and clause_4's
    reachability requirement make THE ONE EXISTING IMPLEMENTATION NON-CONFORMING and
    that enacting without a companion record "leaves the contract with no conforming
    implementation". I hold roughly 0.6 that the pass identifies that state as the
    sharpest consequence of enactment. BUT THE DRAFT DISCLOSES IT ITSELF, so a pass
    that returns it has read the draft's own confession back to it and added nothing;
    WHAT WOULD BE NEW is a statement of who is BOUND, and to what, in the interval
    between enactment and the companion record - which nobody has written.
    (3) THE FORECLOSURE I THINK IS UNDER-EXAMINED. `what_this_changes` ends by saying
    that on enactment CF-1 becomes dischargeable and EV-SSI-5d954c observations 1 and
    2 "become historical rather than live". That is an amendment changing how an
    IMMUTABLE EVIDENCE RECORD READS. I hold roughly 0.45 that the pass raises it. If
    it does not, that is a COVERAGE GAP and I will record it as one rather than as
    absence of a problem.
    (4) THE ENACTMENT PRECONDITION LIST. `amendment.enactment.prerequisites_before_such_a_decision`
    enumerates four prerequisites for the decision that would enact this draft. I
    hold roughly 0.5 that the pass finds that list wrong in some direction, and I am
    deliberately NOT recording which direction, because naming it would be handing
    the pass its finding. IF THE PASS REPORTS THE LIST COMPLETE AND CORRECT, THAT IS
    A RESULT AND I WILL RECORD IT AS ONE.
    (5) THE ENTAILED-CONTROL RESULT, WHICH IS THE ELEMENT I AM LEAST CONFIDENT ABOUT
    AND WHICH MATTERS MOST. I hold roughly 0.4 that the pass's procedure returns
    act-findings on THE INERT OBJECT - the CF-9 run-provenance attestation, which
    proposes no act at all - because the four axes are broad enough to find "binding"
    and "foreclosure" in almost any record if one is looking. I hold roughly 0.55
    that at least one finding survives unchanged on THE TWIN OBJECT, the superseded
    and un-enactable BATCH-752ef2 draft, which would mean that finding is about
    amendments of this shape rather than about this redraft. A PASS THAT RUNS BOTH
    AND REPORTS EITHER OUTCOME HONESTLY HAS DONE THE MOST VALUABLE THING IN THIS
    ROUND, AND A PASS THAT ANTICIPATES THE PROBLEM AND SEPARATES CLASS-FINDINGS FROM
    INSTANCE-FINDINGS BY ITSELF OVERTURNS THIS ELEMENT, WHICH IS A BETTER OUTCOME
    THAN MY BEING RIGHT.
    (6) THE GREEN-CONTROL AXIS. I hold roughly 0.5 that the pass's A4 answer is
    weaker than the others, because the axis asks about a READER rather than about a
    text and it is the easiest place to write something plausible and uncheckable. I
    hold roughly 0.3 that it finds a wrong conclusion a green control invites that no
    committed record has named. CF-27 - metrics[4] of the frozen contract is ALSO a
    single-key mapping - is committed and available to it, so a pass that offers only
    CF-27 here has cited the record rather than attacked the object.
    (7) THIS ROUND'S OWN WEAKEST LINK, RECORDED IN ADVANCE. Two things, and neither is
    the algebra. FIRST, THE PASS'S FINDINGS ARE PROSE. Unlike the previous round,
    almost nothing here has an exit code: an act analysis is checked by reading
    committed bytes at a named key path, which is why J2 requires every finding to
    carry one and why the reviewer must file independent_act_check.md. SECOND, ONE
    REVIEWER, OF ONE MODEL FAMILY, IN ONE SESSION, WITH BLINDNESS DELIBERATELY
    LIFTED, reviewing a package written by a session of the same family under a
    prompt from the same dispatcher. I predict at roughly 0.45 that the reviewer's
    most valuable finding is one no committed record of this campaign has raised; IF
    EVERY FINDING IS A RE-CONFIRMATION OF AN EXISTING RT-, F- OR V-NUMBER, THAT IS A
    SIGNAL ABOUT THIS ROUND'S INDEPENDENCE AND MUST BE RECORDED AS ONE rather than
    read as corroboration.
    (8) BOTH CLEAN OUTCOMES ARE FULL RESULTS AND I AM PRE-COMMITTING TO BOTH. If the
    pass searches hard on all four axes, runs every entailed-control object, and
    concludes that the redraft's act is what it says it is, THAT IS A COMPLETE AND
    VALUABLE RESULT and the most enactment-relevant thing this round could return. If
    the reviewer searches hard and finds the pass sound, THAT IS ALSO A COMPLETE
    RESULT. I RECORD IN ADVANCE THE TWO SYMMETRIC TEMPTATIONS I EXPECT TO FEEL WHEN
    COMPOSING: to over-weight a minor act-finding so the round looks productive, and -
    new this round, because the enactment is now within reach - TO UNDER-WEIGHT A
    FINDING THAT WOULD DELAY THE ENACTMENT. The second is the more dangerous and it
    is named first in the composition's requirements.
    WHAT WOULD MOST INFORM THIS PROGRAM, in descending order: a demonstration that the
    pass's finding set is entailed by its own construction, found by running the
    procedure on the inert object; a foreclosure the redraft's text EFFECTS that no
    committed record has named, quoted at a key path; a finding that survives on the
    twin object and is therefore about the class rather than the instance, correctly
    labelled as such by whoever finds it; a wrong conclusion a green parse control
    invites that no committed record has named; and a defect in the redraft's own
    enactment precondition list, in whichever direction it lies.

  joints:
    - joint: J1 whether the pass attacked the redraft AS A PROPOSED ACT rather than re-attacking its integrity
      assigned_to: TASK-20260906-918585
      attack_plan: >-
        DO THIS ONE FIRST, BECAUSE IT DETERMINES WHETHER THE ROUND BOUGHT WHAT IT PAID
        FOR. The goal head commissioned an adversarial pass on the redraft AS A
        PROPOSED ACT - "not on its integrity, which this round checked, but on what it
        would DO to the contract, whom it binds, what it forecloses, and what a reader
        of a green parse control would wrongly conclude". CLASSIFY EVERY FINDING IN THE
        PASS INTO EXACTLY ONE OF FOUR BUCKETS AND SHOW THE CLASSIFICATION: (a) AN ACT
        FINDING - it says what enacting the record would cause, permit, require or
        prevent; (b) AN INTEGRITY FINDING WEARING AN ACT HEADER - it is about whether
        the text parses, splices, carries what was ordered, or is internally
        consistent, which BATCH-60d6b9 already checked and which is not what this round
        bought; (c) A RESTATEMENT of an existing RT-, F- or V-number, which is a
        bibliography entry and not a pass, and which must be checked against the
        numbered record it restates; (d) A DRAFT SELF-DISCLOSURE read back - the
        redraft's own `reviewer_notes.known_weaknesses_of_this_draft` names four
        weaknesses and any finding that reproduces one of them without adding
        consequence is the draft's confession, not a discovery. THEN COUNT: how many
        findings are in bucket (a), and does any of the four axes A1-A4 rest ENTIRELY
        on buckets (b), (c) or (d)? An axis with no bucket-(a) finding is an UNCOVERED
        AXIS and is reported as one. FINALLY, CHECK THE STEER: batch.yaml
        key_paths_named_to_the_producer lists NINE key paths this control plane named
        to the producer. Does any bucket-(a) finding rest on a block that list does not
        name? If every finding lives inside the nine, the pass has been steered and
        that is a finding about the round.
      breaking_artifact: >-
        An axis with no act-finding. A report whose act-findings are all
        classifications (b), (c) or (d). A pass that concludes the record cannot be
        attacked as an act BECAUSE it is a draft - which is true of every draft and
        would make the assignment impossible rather than complete. Or the converse: a
        pass that treats the draft as ALREADY IN FORCE and attacks consequences that
        only follow from a decision nobody has made.
    - joint: J2 whether every act-finding is anchored in the redraft's own bytes at a named key path, and whether the pass overstates or understates
      assigned_to: TASK-20260906-918585
      attack_plan: >-
        TWO DIRECTIONS, AND DO NOT PRIVILEGE EITHER. This is the joint that separates a
        foreclosure the TEXT EFFECTS from a foreclosure the ANALYST INFERRED, and it is
        checked by opening the redraft yourself, not by reading the pass's quotations.
        OVERSTATEMENT: for EVERY act-finding, open
        BATCH-60d6b9/tasks/TASK-20260906-ee372e/protocol_amendment_redraft.yaml at the
        key path the finding names, READ THE BYTES YOURSELF, and answer three
        questions - does the text say what the finding says it says; does the effect
        claimed FOLLOW from that text, or does it follow only if some further decision
        is also taken; and is a party named as BOUND actually addressed by the text, or
        is the binding an inference about who would in practice have to comply. A
        finding whose key path does not carry the quoted words is a break of the pass.
        A finding that needs an unstated further decision is not wrong but is
        MIS-SCOPED, and the smaller repair is to state the decision.
        NOTE THE STANDING GAP THIS CLOSES: DEC-20260906-408595 PD-9 records that NO
        COORDINATOR HAS INDEPENDENTLY CONFIRMED THAT THE REDRAFTED clause_1's TEXT IS
        WHAT THE REPORTS SAY IT IS, and directs that the red-team pass and the enacting
        decision must each confirm it against the file. Check that the PASS did so, and
        do it yourself for at least the clauses its findings rest on.
        UNDERSTATEMENT, WHICH IS THE HALF PEOPLE SKIP: find at least one act the
        redraft's text plainly effects that the pass did NOT report, or state that you
        looked and found none and say exactly where you looked. Read clause_3 and
        clause_4 in full - they are the clauses that impose requirements on
        IMPLEMENTATIONS - and read `amendment.blast_radius`,
        `amendment.what_this_changes` and `amendment.scope` against them.
        YOU MAY RUN THE TWO COMMITTED SCRIPTS UNMODIFIED
        (BATCH-60d6b9/tasks/TASK-20260906-ee372e/amendment_parse_control.py and
        BATCH-60d6b9/reviews/TASK-20260906-ba0284/independent_parse_check.py) if a
        finding turns on what the amended document actually contains. Running them is
        not a run. Modifying them is a stop condition.
      breaking_artifact: >-
        An act-finding whose named key path does not carry the words quoted. An effect
        claimed that requires a decision the finding does not name. A party described as
        bound whom the text does not address. An act the text plainly effects that the
        pass missed, found by you. Or a finding stated without any key path at all,
        which is unfalsifiable and is reported as such.
    - joint: J3 whether the pass's finding set is entailed by its own construction, its prompt, or the campaign record
      assigned_to: TASK-20260906-918585
      attack_plan: >-
        THE JOINT THIS ROUND EXISTS FOR, AND THE THIRD TIME THIS CAMPAIGN HAS PAID FOR
        THIS QUESTION - AC-1's pass region being exactly how AC-1's input was built
        (RT-3, CF-21), AC-4's pattern that can never fire (F-1, CF-13), and the
        shape-only parse control that would have passed on the file it exists to detect
        the amendment of. ASSUME NO LESSON WAS LEARNED AND CHECK.
        ORDERING, ATTESTED AND BINDING: BEFORE opening
        tasks/TASK-20260906-dc4905/entailed_control_objects.yaml, apply the pass's OWN
        STATED PROCEDURE - as its report describes it - yourself, unchanged, to the two
        objects below, and record what YOU got. Then open the producer's file and say
        where yours differs. Record that you did it in that order, or record honestly
        that you did not. Nothing is forbidden to you at any time; this is an
        attestation, not a blind phase.
        (a) THE INERT OBJECT:
        BATCH-60d6b9/tasks/TASK-20260906-0fbf69/run_provenance_attestation.yaml. It
        proposes no act, binds nobody, amends nothing. "This record would bind a party,
        foreclose an option, or mislead a reader of a green control about an amendment"
        is KNOWN FALSE for it. If the procedure returns act-findings of the same class
        and severity there, THE FINDINGS ARE PRODUCTS OF THE PROCEDURE AND NOT OF THE
        REDRAFT, and that is the most valuable result available in this round.
        (b) THE TWIN OBJECT: the superseded
        BATCH-752ef2/tasks/TASK-20260905-28c89d/protocol_amendment_draft.yaml, which is
        immutable, superseded and KNOWN UN-ENACTABLE because its clause_1 does not parse
        when spliced. "This is a live proposed act" is KNOWN FALSE for it. TAKE EVERY
        ACT-FINDING THE PASS MADE AGAINST THE REDRAFT AND ASK WHETHER IT SURVIVES
        UNCHANGED HERE. Every finding that does is about amendments of this shape, or
        about this campaign, and NOT about the redraft's own text; it must be LABELLED
        so, and a pass that did not label it has attributed a class property to an
        instance.
        THEN THE OTHER TWO SOURCES OF ENTAILMENT. THE PROMPT: the producer's runtime
        receipt must disclose what it was told at launch (CF-15). Read it against
        batch.yaml key_paths_named_to_the_producer, which records the nine key paths
        this control plane itself named, and against the prohibition on the dispatching
        session speaking the withheld coordinator_prior aloud. Report any finding that
        appears to be the prompt's outline with a red-team header, and report if the
        receipt discloses that an expected outcome, a preferred verdict or a suspected
        defect was named. THE CAMPAIGN RECORD: for each finding, say whether a committed
        record already states it - RT-1 through RT-12, F-1 through F-12, V-1 through
        V-6, CF-1 through CF-27 - and if the pass's set is entirely re-confirmation, SAY
        SO PLAINLY. Blindness is deliberately lifted for the producer, so its agreement
        with any numbered finding is NOT independent of the reports it was given.
        FINALLY THE OTHER DIRECTION: a procedure that returns NOTHING on every object
        including the redraft is equally uninformative, and its silence is not evidence
        that enactment is safe. Confirm the positive control ran and returned the pass's
        actual findings.
      breaking_artifact: >-
        The procedure returns act-findings on the inert object. A finding indistinguishable
        on the twin object and not labelled as a class finding. The pass never ran either
        object, or ran a constructed object while presenting it as a committed one. The
        producer's receipt discloses that an expected finding was named to it. Every
        finding traces to a committed RT-, F- or V-number. Or the procedure returns
        nothing anywhere, including on the redraft.
    - joint: J4 whether the pass stayed inside what it may not do, and settled nothing reserved to the enacting decision
      assigned_to: TASK-20260906-918585
      attack_plan: >-
        MECHANICAL, ITEM BY ITEM, AND IT IS NOT A FORMALITY: an adversarial agent asked
        what a record would DO is under continuous pressure to say what should be done
        about it, and the line between a RECOMMENDATION and a RULING is exactly where
        this campaign's authority sits. CHECK EACH AND SAY CARRIED OR BREACHED.
        (i) DID IT APPROVE OR ENACT ANYTHING? It may not. EXP-WESOVOW-001 must remain
        `approved` and UNAMENDED at version 1 in every sentence of the package, and the
        redraft must remain described as `status: draft`, `in_force: false`,
        `approved_by: null`.
        (ii) DID IT SETTLE ANY OF THE FIVE ITEMS RESERVED TO THE ENACTING DECISION? They
        are: the CF-10 RAW_PATH placement question, with the red team's companion-record
        preference recorded as a RECOMMENDATION and the `travels with` authority question
        EXPRESSLY UNRESOLVED; the F-7 over-reading path, which any enacting text carrying
        `fidelity ... settled and closed` must scope to `to the frozen transcript` IN THE
        SAME SENTENCE; the F-2 and F-3 warrant defects, to be repaired by a SUCCESSOR
        RECORD and never by superseding an immutable artifact, to which RT-2 adds CF-22;
        RT-6, RT-9(a) and RT-12; and RT-4's LICENSING QUESTION, which the redraft carried
        into clause_4's text as ordered but did not and could not SETTLE. THE PASS MAY
        SUPPLY MATERIAL FOR ANY OF THE FIVE AND MAY RECOMMEND. IT MAY NOT DECIDE. Check
        whether any recommendation is phrased as a ruling, and check specifically whether
        it treated RT-4's licensing question as answered because clause_4 now carries the
        provisos - CARRYING A PROVISO INTO A DRAFTED CLAUSE IS NOT RESOLVING THE ENACTING
        DECISION'S QUESTION ABOUT THAT CLAUSE.
        (iii) DID IT LIFT, NARROW OR WIDEN EITHER LIMB OF THE CITATION PROHIBITION, or
        state a governed baseline-comparison sign, a crossover value, a margin or a
        speedup anywhere - INCLUDING while attacking the R3 warrant sentence, whose
        antecedent `A > 0` IS the governed sign? Where a check would require one, the only
        correct output is THE STATEMENT that it would. Scan the package for decimal
        figures and report what the matches are.
        (iv) DID IT EXECUTE cost_model.py? Absolutely forbidden (CF-10). Reading it as text
        is permitted with disclosure under this batch's scope clarification; confirm which
        it did and that the receipt says so.
        (v) DID IT EDIT, ANNOTATE OR MARK ANY FROZEN OR IMMUTABLE ARTIFACT? Confirm nothing
        under experiments/, inputs/, BATCH-752ef2/, BATCH-79a0cb/ or BATCH-60d6b9/ was
        modified - the redraft above all, which is the object under attack and is immutable.
        (vi) DID IT ASSERT THAT A COMMITTED IMMUTABLE RECORD IS WRONG? That stronger claim
        needs a review tier this environment cannot serve (IMP-1) and stays un-promoted;
        naming a defect and leaving the claim un-promoted is correct, asserting the
        conclusion is not.
      breaking_artifact: >-
        Any approval, enactment or status transition. Any of the five reserved items
        answered rather than informed. A recommendation phrased as a ruling. Any
        PAPER_PAIRS value, delta, crossover, margin, sign or speedup anywhere in the
        package. Any execution of cost_model.py. Any edit to a frozen or immutable path.
        A claim that a committed record is wrong, asserted rather than left un-promoted.

