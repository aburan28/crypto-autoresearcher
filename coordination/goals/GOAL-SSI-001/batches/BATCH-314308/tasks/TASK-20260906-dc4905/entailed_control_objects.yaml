schema: crypto.autoresearch.entailed_control_objects.v1
# WHAT MY ACT-ANALYSIS PROCEDURE ACTUALLY DID ON FIVE OBJECTS, FOUR OF WHICH ARE
# CHOSEN SO THAT ITS CONCLUSIONS THERE ARE KNOWN FALSE.
#
# THIS FILE APPROVES NOTHING AND ENACTS NOTHING. EXP-WESOVOW-001 is `approved`
# and UNAMENDED at version 1; the redraft is a draft, not in force, with a null
# approved_by. Nothing here settles any of the five items reserved to the
# enacting decision.
#
# A FINDING WHOSE CONCLUSION IS KNOWN FALSE IS A BREAK AND IS REPORTED AS ONE,
# NEVER AS THOROUGHNESS. Every result below is WHAT THE PROCEDURE DID, not what
# it should have done.

entailed_control_objects:
  task_id: TASK-20260906-dc4905
  batch_id: BATCH-314308
  goal_id: GOAL-SSI-001
  recorded_by: red-team
  recorded_at: '2026-09-06'

  citation_prohibition_restated_verbatim: >-
    The `P=512` crossover value and its `w=2^80` sign are **NOT
    citation-eligible**. This task does not lift that prohibition. Only a
    committed Coordinator decision on independently reviewed evidence can lift
    it.
  citation_prohibition_predicate_extension_restated_verbatim: >-
    In addition to the retained sentence, a row of any EXP-WESOVOW-001
    reconciliation is NOT citation-eligible when either (a) the two anchors
    disagree in the SIGN of the baseline comparison at that row, or (b) the
    smaller |margin| across the two anchors at that row is below that field
    size's anchor gap |Delta log2 T_full + Delta log2 M / 2|.
  did_either_limb_fire_here:
    retained_sentence: {applicable: true, fired: false}
    predicate_extension: {applicable: false, fired: false}
    why: >-
      This file reports parse outcomes, key counts, record kinds and the survival
      of prose findings across records. No crossover value, baseline-comparison
      sign, margin, speedup or PAPER_PAIRS value or delta appears anywhere in it.

  the_procedure_being_exercised:
    note: >-
      IDENTICAL TO THE ONE IN act_analysis_red_team_report.yaml, restated here in
      short form so this file stands alone. IT WAS APPLIED UNCHANGED TO EVERY
      OBJECT - no step was skipped, softened, or added for any object, including
      the ones where I knew the answer in advance.
    S1: THE ENACTABILITY GATE - does the record declare an OPERATION on a NAMED artifact OUTSIDE itself, at a LOCATOR, with applicable text? If no, S2-S4 return nothing and only S5 may run.
    S2: EFFECT CLOSURE - every claimed effect must have a clause effecting it, and every clause effect must be in the claimed set.
    S3: BINDING - every normative sentence, its stated subject, and separately the party who must comply.
    S4: FORECLOSURE - for each new invariant, pointer or requirement, the future record, repair or reading it removes.
    S5: GREEN-CONTROL OVER-READING - the set of documents passing each control assertion, versus what a reader would conclude, each candidate checked against a committed artifact.
    S6: RESERVED-ITEM CHECK - the record does not settle what it reserves, and enactment does not settle it de facto.
    S7: ANCHORING - every finding quotes the record's own bytes at a named key path, confirmed against the file.

  # =====================================================================
  objects:

    - id: '(a)'
      name: THE INERT OBJECT
      path: coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-0fbf69/run_provenance_attestation.yaml
      why_it_is_here: >-
        It proposes no act, binds nobody, amends nothing and forecloses no
        option. "This record would bind a party, foreclose an option, or mislead
        a reader of a green control about an amendment" IS KNOWN FALSE FOR IT. If
        my procedure returns act-findings here of the same class and severity as
        against the redraft, the findings are products of the procedure and that
        is a BREAK of my own method.
      what_my_procedure_ACTUALLY_DID:
        S1_enactability_gate: >-
          GATE RETURNED NO-ACT, AND THIS IS WHERE THE DISCRIMINATION LIVES. I
          searched the record for an operation on a named artifact at a locator
          with applicable text. There is none: it declares
          `record_class: provenance_attestation_from_committed_artifacts_and_git_history_only`,
          its `what_this_record_is` says it establishes "what can and cannot be
          attested ... from COMMITTED ARTIFACTS AND GIT HISTORY ONLY", and its
          `what_this_record_is_not` says in terms that it is "NOT an adjudication
          of either run's evidential status" and "NOT mathematical evidence of
          any kind". No replacement text, no target line range, no splice, no
          version transition.
        S2_S3_S4: >-
          NOT RUN, BECAUSE THE GATE STOPPED THEM. That is the procedure behaving
          as designed and not a shortcut: S2-S4 are defined only for a record
          that proposes an operation.
        S5: >-
          RUN, AND RETURNED NOTHING. The record contains a null-object exercise
          with its own reported outcomes, so a control does exist inside it. But
          S5's own gate asks whether the control's green result could be read as
          certifying an AMENDMENT of an artifact, and this one certifies a
          provenance verdict about two run manifests. No candidate reader
          conclusion about an amendment survives, because there is no amendment.
        S6_S7: >-
          S6 found nothing reserved and nothing settled. S7 had nothing to
          anchor.
      act_findings_returned: 0
      is_this_a_break: 'NO. The procedure returned NO act-finding on the inert object.'
      the_near_miss_i_am_reporting_anyway: >-
        REPORTED BECAUSE IT IS WHERE A LOOSER PROCEDURE WOULD HAVE FIRED. The
        record carries a top-level field `discharges: CF-9`. A procedure whose
        gate asked "does this record claim to change the campaign's state?"
        rather than "does it declare an operation on a named artifact at a
        locator?" would have read that as an act and produced a foreclosure
        finding about CF-9's discharge. My gate excluded it because discharging a
        carried-forward item names no artifact and no locator, and because the
        actual discharge was a Coordinator act recorded in
        DEC-20260906-408595 rather than something this record performs. THAT IS
        THE EXACT POINT AT WHICH MY PROCEDURE'S SPECIFICITY IS PURCHASED, and a
        reviewer who wants to attack my method should attack S1's gate condition
        first.
      what_this_result_does_and_does_not_license: >-
        It licenses the statement that my procedure does not fire on anything. It
        does NOT license the statement that my procedure is correct, or that its
        findings against the redraft are right. A procedure can be non-vacuous
        and still be wrong, which is why object (b) exists.

    - id: '(b)'
      name: THE TWIN OBJECT - the superseded, known un-enactable BATCH-752ef2 draft
      path: coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/protocol_amendment_draft.yaml
      why_it_is_here: >-
        Immutable, superseded, and KNOWN UN-ENACTABLE - its clause_1 does not
        parse when spliced, established at three candidate columns by three
        independent sessions. "This is a live proposed act" is KNOWN FALSE for
        it. The inert object catches a procedure that fires on anything; the twin
        catches one that fires on the CLASS rather than the INSTANCE.
      what_my_procedure_ACTUALLY_DID:
        S1_enactability_gate: >-
          GATE RETURNED PARTIAL-ACT, WHICH IS THE HONEST ANSWER AND NOT A PASS.
          The twin declares operations at locators for all four clauses, so it
          proposes an act in form; but its clause_1 has no applicable text, which
          is the whole reason for the redraft, so its only substantive clause
          cannot be applied. S2-S4 therefore ran, with every result carrying the
          standing qualification that nothing here can actually be enacted.
        S2_S3_S4: >-
          RAN IN FULL. I took each of my seven act findings against the redraft
          and asked whether it SURVIVES UNCHANGED on the twin, from the twin's own
          bytes. The table is below.
        S5: >-
          RETURNED NOTHING - the twin carries no control block and no green
          control report, so there is no green result for a reader to over-read.
          THIS IS THE ONE PLACE WHERE THE REDRAFT'S ADDITIONS, NOT ITS INHERITED
          SUBSTANCE, ARE WHAT MY A4 FINDINGS ATTACH TO.
        S6: >-
          The twin has no reserved_to_the_enacting_decision block at all - that
          block is new in the redraft and is one of V-3's eight unenumerated
          differences. So nothing to check.
      survival_table:
        legend: >-
          SURVIVES = the finding holds, unchanged, against the twin's own bytes,
          and is therefore a finding about amendments OF THIS SHAPE or about this
          campaign's drafting lineage, NOT about the redraft's own instance. It is
          LABELLED SO, in this table and in the finding itself. An unlabelled
          survivor would attribute a class property to an instance.
        rows:
          - finding: AF-1 - declared version transition that no clause effects
            survives_unchanged_on_the_twin: true
            evidence_at_the_twin: >-
              twin lines 15-16 carry the same version_from and version_to pair,
              1 and 2; twin line 444 carries the sentence "Version becomes 2 and
              every record produced before enactment stays scoped to version 1";
              no clause of the twin touches specification.yaml line 3
            label: CLASS FINDING - inherited from the lineage
            what_is_nevertheless_instance_level: >-
              THE CONSEQUENCE. On the twin the gap is inert, because nothing can
              be applied; on the redraft it is live, because BATCH-60d6b9
              established that this record CAN be applied. "A record that cannot
              be applied forecloses nothing, and this one can be applied" is this
              batch's own sentence and it is exactly what separates the two here.
          - finding: AF-2 - prerequisite names a ledger archive as "the snapshot archive of this package"
            survives_unchanged_on_the_twin: false
            evidence_at_the_twin: >-
              twin line 575 names TASK-20260905-6fcd2c, and
              BATCH-752ef2/archives/TASK-20260905-6fcd2c/snapshot_commit_receipt.json
              carries `"kind": "snapshot"`. THE TWIN'S ITEM IS CORRECT. The
              redraft's names TASK-20260906-9f3e2a, whose receipt carries
              `"kind": "ledger"`, and BATCH-60d6b9 has no snapshot-archive task
              at all.
            label: INSTANCE FINDING - about this record and no other
            note: THIS IS THE FINDING THE TWIN OBJECT WAS PAID FOR. Without it I could not have told AF-2 apart from a property of amendment drafts in general.
          - finding: AF-3 - the contract's only source of law is an unopened pointer
            survives_unchanged_on_the_twin: true
            evidence_at_the_twin: >-
              clause_2 is BYTE-IDENTICAL between the two records - BATCH-60d6b9
              validation_report.yaml records the key
              `clause_2_byte_identical_to_superseded` as true - and clause_1's
              content is identical modulo indentation
            label: CLASS FINDING
            what_is_nevertheless_instance_level: none - the finding is wholly inherited. Its live-ness is inherited from AF-1's enactability asymmetry and nothing more.
          - finding: AF-4 - unmeetable implementation requirement plus an unsubjected prohibition
            survives_unchanged_on_the_twin: true
            evidence_at_the_twin: clause_3's deviation_sign_note is unchanged between the records (the validator's clause-level diff finds exactly two clause_3 differences, neither in that key); the twin's clause_4 carries the same "in the raw output" status requirement
            label: CLASS FINDING
          - finding: AF-5 - prerequisite list omits the companion record
            survives_unchanged_on_the_twin: partially
            evidence_at_the_twin: the twin's list has three items and also omits it, and the twin carries the same reviewer_notes sentence "The two should be enacted together"
            label: CLASS FINDING on the omission; INSTANCE-LEVEL only in that the redraft ADDED a fourth prerequisite and still did not add this one
          - finding: AF-6 - binding_effect forecloses the control-is-wrong repair branch
            survives_unchanged_on_the_twin: true
            evidence_at_the_twin: clause_2 byte-identical
            label: CLASS FINDING
          - finding: AF-7 - clause_3's operation line misstates its effect on C1's key count
            survives_unchanged_on_the_twin: true
            evidence_at_the_twin: twin lines 236-237 read "add two keys alongside the existing four", also wrong - the clause adds one
            label: CLASS FINDING on the miscount; INSTANCE-LEVEL in that the redraft was ORDERED to touch this exact line (change 7, RT-8) and incremented the wrong number instead of correcting it
          - finding: A4-1 through A4-4 - green-control over-readings
            survives_unchanged_on_the_twin: false
            evidence_at_the_twin: the twin has no control block, no control script and no control report; RT-1's finding was precisely that the amendment LACKED a control
            label: INSTANCE FINDINGS - they attach to what the redraft ADDED
      the_structural_result_this_object_produced_and_it_is_the_most_useful_thing_in_this_file: >-
        FIVE OF MY SEVEN ACT FINDINGS SURVIVE ON A RECORD THAT CANNOT BE ENACTED,
        AND THAT IS NOT AN ACCIDENT OF MY PROCEDURE - IT IS A PROPERTY OF THE
        OBJECT I WAS GIVEN. The redraft was ordered to change whitespace plus
        eight routed items and nothing else; clause_2 is byte-identical, clause_1
        differs only in indentation, and the validator's mechanical diff confirms
        it. So almost every SUBSTANTIVE act-property of the redraft is inherited
        from the twin, and the twin control cannot discriminate for any of them.
        What discriminates is not the finding but the ENACTABILITY: the twin's
        defects were harmless because nothing could be applied; the redraft's
        identical defects are live because it can be applied. A REVIEWER SHOULD
        THEREFORE WEIGHT AF-2 AND THE A4 FINDINGS - THE NON-SURVIVORS - ABOVE THE
        REST, and should read the five survivors as "this is what this LINEAGE of
        amendment does", which is a weaker and different statement.

    - id: '(c)'
      name: THE KNOWN-FALSE ATTRIBUTION OBJECT - "the redraft RESOLVES RT-6, RT-9(a) or RT-12"
      why_it_is_here: >-
        KNOWN FALSE on committed evidence. If my reading says otherwise, that is
        a DEFECT IN MY READING and I report it as one.
      what_my_procedure_ACTUALLY_DID: >-
        S6 ran against the file, not against any report. I checked each of the
        three at the redraft's own bytes and against the frozen contract, and I
        did NOT accept the reviewer's conclusion as my check.
      results:
        - id: RT-6
          my_reported_status: UNRESOLVED
          how_i_checked_it_myself: >-
            RT-6 concerns clause_2's second invariant restating C4 with the
            qualifier "before the declared overhead multiplier", which is not in
            C4's own text, inside an amendment that lists C4 as untouched. I read
            C4 at the frozen file, specification.yaml:148-149 - "At w = M, vOW
            time must equal T_full exactly (cap check)" - and clause_2's
            invariant at the redraft - "Control C4 of this contract: T(M) =
            T_full exactly, before the declared overhead multiplier". The
            qualifier is present in the clause and absent from C4. The redraft's
            own reserved_to_the_enacting_decision block says it "CARRIED THE TEXT
            UNCHANGED AND DECIDED NOTHING". Nothing resolves it.
          my_reading_says_otherwise: false
        - id: RT-9(a)
          my_reported_status: UNRESOLVED
          how_i_checked_it_myself: >-
            RT-9(a) is that the enactment precondition asks a Coordinator to
            confirm the LOCATOR of the five pairs' characterization but not the
            CHARACTERIZATION. I read clause_3's `what_the_five_pairs_are` at the
            file: the sentence "AN ENACTING COORDINATOR SHOULD CONFIRM THE
            LOCATOR AGAINST THE FILE BEFORE ENACTMENT" is present, word for word,
            and nothing anywhere in clause_3 extends it to the
            characterization ("Figures stated in the frozen source as LOWER
            BOUNDS, from an underestimation the source itself describes as
            rough"). Nothing resolves it.
          my_reading_says_otherwise: false
          one_thing_i_add_and_it_is_not_a_resolution: >-
            The characterization becomes CONTRACT TEXT on enactment, and no agent
            of this program has confirmed it against inputs/, which is outside
            every recent reviewer's read scope including mine. That is material
            for RT-9(a) and a RECOMMENDATION to confirm before enacting. IT IS
            NOT A RULING ON RT-9(a), which stays reserved.
        - id: RT-12
          my_reported_status: UNRESOLVED
          how_i_checked_it_myself: >-
            RT-12 is whether "unsatisfiable" or the producer's disjunctive
            statement is the sentence an enacting decision should quote. I read
            amendment.gating_reproduction at the file: it reports the verdict
            `reproduced`, the satisfying set and the degenerate witness, and does
            not use the bare word "unsatisfiable" as its characterization. That
            is a consequence of summarizing and is neither adoption nor
            rejection. Nothing resolves it.
          my_reading_says_otherwise: false
      break_check: 'NO BREAK. My reading agrees that all three are unresolved, which is the known-true answer, and I reached it from the file rather than from the reports.'

    - id: '(d)'
      name: THE GREEN-CONTROL READER OBJECT
      path: coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/amendment_parse_control_report.yaml
      why_it_is_here: >-
        It records PC-1 PASSING on the redraft. A control that passes is exactly
        the kind of artifact a later reader over-reads. Each candidate wrong
        conclusion must be CHECKED AGAINST A COMMITTED ARTIFACT rather than
        asserted; a candidate that a committed artifact in fact establishes is a
        BREAK of my analysis.
      what_my_procedure_ACTUALLY_DID: >-
        S5 ran in full. I read the script (all 524 lines), computed the set of
        documents passing P1-P4, re-ran the committed selftest UNMODIFIED to see
        the control's behaviour for myself rather than believing the report, and
        enumerated EIGHT candidate reader conclusions. FOUR SURVIVED CHECKING AND
        FOUR WERE KILLED BY IT.
      my_own_rerun_of_the_committed_control: >-
        `PYTHONDONTWRITEBYTECODE=1 python3 .../amendment_parse_control.py --spec
        .../specification.yaml --amendment .../protocol_amendment_redraft.yaml
        --superseded .../protocol_amendment_draft.yaml --selftest`, run unmodified
        from a working directory outside the repository, returned "SELFTEST PASS -
        5/5 objects behaved as declared" with exit 0. THE CONTROL CAN FAIL AND
        DOES FAIL on four of five objects, including the unamended frozen file at
        P4. Running it is not a run (DEC-20260904-166ab5 PD-4).
      candidates_that_SURVIVED_checking:
        - id: A4-1
          candidate: the enacted file will be the file PC-1 validated
          committed_artifact_checked: amendment_parse_control_report.yaml, defect_found_in_this_control_during_its_own_development; amendment_parse_control.py lines 359-393
          result: NOT ESTABLISHED - and the campaign has an actually-occurred instance of the failure, a wrong application that still parsed with vow_charging_law absent
        - id: A4-2
          candidate: the amended contract is at version 2
          committed_artifact_checked: BATCH-60d6b9 validation_report.yaml structural_diff_frozen_vs_fully_amended (five differences, none at .experiment.version); plus my own in-memory splice
          result: NOT ESTABLISHED, AND REFUTED - the amended document reads version 1
        - id: A4-3
          candidate: P2 and P3 are discriminating
          committed_artifact_checked: the frozen specification.yaml itself; amendment_parse_control.py docstring lines 20-26
          result: NOT ESTABLISHED - the frozen file passes P2 and P3, and metrics[4] is also a single-key mapping
        - id: A4-4
          candidate: clauses 2, 3 and 4 were asserted on
          committed_artifact_checked: amendment_parse_control.py run_control versus splice_all_clauses; amendment.reviewer_notes[3]
          result: NOT ESTABLISHED - reported, not asserted. Rated informational because both artifacts disclose it in terms.
      candidates_KILLED_by_checking_and_reported_as_kills:
        - candidate: a green --selftest exit code means the amendment applies
          committed_artifact_checked: amendment_parse_control_report.yaml, key exit_semantics_disclosed
          result: >-
            KILLED. The artifact pre-empts the misreading in its own words:
            "--selftest exits 0 when every object behaves AS DECLARED, which for
            four of the five objects means FAILING. Its exit code therefore does
            NOT mean 'the amendment applies'." HAD I RAISED THIS AS A FINDING IT
            WOULD HAVE BEEN A BREAK OF MY OWN ANALYSIS.
        - candidate: the control's pass is entailed by its construction / it cannot fail
          committed_artifact_checked: my own unmodified re-run of the committed selftest
          result: KILLED - it fails on four of five declared objects, observed by me and not read off a report
        - candidate: a green control means the frozen contract has been amended in the repository
          committed_artifact_checked: git status --porcelain; sha256 of specification.yaml; script docstring lines 35-41
          result: KILLED as a fact about the world - the file is unchanged and the script writes nothing. Recorded as a rejection rather than dropped.
        - candidate: a green control means the amendment is RIGHT
          committed_artifact_checked: amendment.controls[0].what_it_does_not_check; script docstring lines 28-33
          result: KILLED - both say it in terms, "A green result means the amendment is APPLICABLE, never that it is RIGHT". Raising it would have been reading the record's own words back to it.
      break_check: >-
        NO BREAK, AND THE KILL RATE IS THE EVIDENCE. Four of my eight candidates
        were destroyed by checking them against committed artifacts, which is
        exactly what a purely entailed candidate list would not have suffered. I
        report the four kills as prominently as the four survivors.

    - id: '(e)'
      name: THE POSITIVE CONTROL - the redraft itself
      path: coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/protocol_amendment_redraft.yaml
      why_it_is_here: >-
        NOT OPTIONAL. A procedure that returns nothing on every object including
        the one it was built for has rejected the decoys for no reason, and its
        silence is NOT evidence that enactment is safe.
      what_my_procedure_ACTUALLY_DID:
        S1_enactability_gate: PASSED - four operations at four locators with applicable text, established mechanically by BATCH-60d6b9 and re-derived by my own in-memory splice.
        S2: RETURNED AF-1, AF-3, AF-7.
        S3: RETURNED AF-2, AF-4's subject analysis, AF-5.
        S4: RETURNED AF-4, AF-6.
        S5: RETURNED A4-1 through A4-4, with four candidates killed.
        S6: RETURNED NOTHING - all three reserved items verified unresolved at the file, and enactment settles none of them de facto.
        S7: EVERY finding carries a key path and quoted words confirmed against the file.
      act_findings_returned: 7 act findings plus 4 green-control over-readings
      the_procedure_is_therefore_not_silent: >-
        It fires on the object it was built for, does not fire on the inert
        object, and separates two of its eleven results from the class. That is
        the most I can claim for it and I claim no more.

  # =====================================================================
  is_my_finding_set_entailed_by_its_own_construction:
    answer: 'YES, PARTLY.'
    by_the_assignment: >-
      PARTLY. Asked for foreclosures, I found foreclosures - that is guaranteed
      by the question. S1's gate is where the guarantee is broken, and the gate
      demonstrably fires (0 act-findings on the inert object) rather than merely
      being declared.
    by_my_launching_prompt: >-
      PARTLY, AND DISCLOSED VERBATIM IN MY RECEIPT. The prompt told me
      BATCH-60d6b9 "returned zero blocking findings", enumerated the five control
      objects with the outcome each must produce, and told me both a clean pass
      and a strong finding are acceptable. It named no suspected defect, no
      weakest key path, and no expected finding count. AF-5 has real overlap with
      what BATCH-314308/batch.yaml already says; AF-1, AF-2 and AF-7 rest on
      blocks the nine-path key-path list does not name.
    by_the_campaign_record: >-
      PARTLY. Blindness was lifted and I read both prior reports before forming
      findings. NO FINDING OF MINE IS A RELABELLED RT-, F- OR V-NUMBER. Where one
      is adjacent I name the adjacency - AF-6 to RT-6, AF-7 to V-3, AF-3 to the
      BATCH-79a0cb reviewer's own declared limitation.
    by_the_drafts_own_reviewer_notes: >-
      PARTLY, AND ONLY FOR AF-4 AND A4-4. The draft confesses five weaknesses;
      reading them back would have been a bibliography. AF-4 extends one of them
      with an analysis it does not make, and A4-4 is explicitly classified as a
      self-disclosure read back and rated informational for that reason.
    the_number_i_want_a_reviewer_to_use: >-
      OF ELEVEN RESULTS, TWO ARE SEPARATED FROM THE CLASS BY THE TWIN (AF-2 and
      the A4 group) AND FIVE ARE NOT. Four of eight A4 candidates were killed by
      checking. One finding (AF-4) was NARROWED after a committed artifact
      contradicted my first, stronger formulation, and I recorded the narrowing
      rather than quietly shipping the weaker claim. Those three numbers are the
      honest measure of this pass's discriminating power, and they are better
      evidence about it than the finding count.

  what_would_have_made_this_exercise_stronger_and_was_not_available: >-
    A SIXTH OBJECT: a committed record that proposes a REAL, APPLICABLE act on a
    DIFFERENT artifact - so that "this is a live proposed act" is KNOWN TRUE and
    the specific findings are known false. The twin fixes enactability to false
    and holds the text nearly fixed; the inert object fixes act-ness to false. No
    object in this campaign holds act-ness true while varying the text, so my
    procedure's ability to find the RIGHT findings on a DIFFERENT live act is
    untested. I name this rather than presenting the three-object exercise as
    complete.
