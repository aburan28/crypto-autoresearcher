      ARGUMENT AND IT HAS THE SAME FAILURE MODE: every record that proposes anything
      forecloses something, so a list of foreclosures is entailed by the assignment and
      carries no information about THIS record.
    objects:
      - >-
        (a) THE INERT OBJECT, AND IT IS THE ONE MOST WANTED:
        coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-0fbf69/run_provenance_attestation.yaml.
        It proposes no act, binds nobody, amends nothing, forecloses no option. "This
        record would bind a party, foreclose an option, or mislead a reader of a green
        control about an amendment" IS KNOWN FALSE FOR IT. Apply your procedure
        UNCHANGED. It must return NO act-finding. If it returns findings of the same
        class and severity as against the redraft, THAT IS A BREAK, report it as one,
        and name the point in your procedure where the survival happens - that location
        is the finding.
      - >-
        (b) THE TWIN OBJECT, WHICH IS THE DISCRIMINATOR:
        coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/protocol_amendment_draft.yaml.
        Immutable, superseded, and KNOWN UN-ENACTABLE - its clause_1 does not parse when
        spliced, established at three candidate columns by three independent sessions.
        "This is a live proposed act" is KNOWN FALSE for it. TAKE EVERY ACT-FINDING YOU
        MADE AGAINST THE REDRAFT AND ASK WHETHER IT SURVIVES UNCHANGED HERE. Every
        survivor is about amendments of this shape, or about this campaign, and NOT about
        your object - LABEL IT SO. An unlabelled survivor attributes a class property to
        an instance.
      - >-
        (c) THE KNOWN-FALSE ATTRIBUTION OBJECT: the proposition that the redraft RESOLVES
        RT-6, RT-9(a) or RT-12. KNOWN FALSE on committed evidence - clause_2 is
        byte-identical to the superseded text so RT-6 could not have been resolved even
        by accident, RT-9(a)'s locator sentence survives word for word, RT-12 is neither
        adopted nor rejected, and the redraft's own reserved_to_the_enacting_decision
        block records all three as undecided. Report all three as UNRESOLVED. If your
        reading says otherwise, that is a DEFECT IN YOUR READING and you report it as one.
      - >-
        (d) THE GREEN-CONTROL READER OBJECT:
        coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/amendment_parse_control_report.yaml,
        which records the control PASSING on the redraft. Enumerate what a reader would
        wrongly conclude from that green result and CHECK EACH CANDIDATE AGAINST A
        COMMITTED ARTIFACT rather than asserting it. A candidate wrong conclusion that a
        committed artifact in fact establishes is a BREAK of your own analysis.
      - >-
        (e) THE POSITIVE CONTROL, WHICH IS NOT OPTIONAL: the redraft itself. Your
        procedure must return your actual act-findings on it. A procedure that returns
        nothing on every object including the one it was built for has rejected the decoys
        for no reason, and its silence is NOT evidence that enactment is safe.
    report_what_it_actually_did: >-
      For every object, report WHAT YOUR PROCEDURE ACTUALLY DID, not what it should have
      done. A finding where the conclusion is known false is a BREAK and is reported as
      one, never as thoroughness. AND ANSWER IN WRITING: is my finding set entailed by
      its own construction, by my launching prompt, by the campaign's existing RT-, F-,
