  what_you_must_not_do:
    - >-
      DO NOT APPROVE OR ENACT ANYTHING. EXP-WESOVOW-001 stays `approved` and UNAMENDED at version 1; the redraft stays `status: draft`, `in_force: false`, `approved_by: null` in every sentence you write.
    - DO NOT SETTLE ANY OF THE FIVE ITEMS RESERVED TO THE ENACTING DECISION - the CF-10 RAW_PATH placement question (companion-record preference is a RECOMMENDATION; the `travels with` authority question is EXPRESSLY UNRESOLVED); the F-7 over-reading path; the F-2 and F-3 warrant defects, to which RT-2 adds CF-22; RT-6, RT-9(a) and RT-12; and RT-4's LICENSING question, which the redraft carried into clause_4's text as ordered but did not and COULD NOT SETTLE. You may supply MATERIAL and you may RECOMMEND; label every such statement a RECOMMENDATION. A recommendation is not a decision.
    - DO NOT EDIT, ANNOTATE, MARK OR APPEND TO ANY IMMUTABLE ARTIFACT - the redraft above all, and everything under BATCH-60d6b9/, BATCH-79a0cb/, BATCH-752ef2/, experiments/ and inputs/. A finding against an immutable record lives in a NEW record in your own task directory. Repairing the object destroys the evidence.
    - DO NOT EXECUTE experiments/EXP-WESOVOW-001/cost_model.py, with or without WESOVOW_RAW_PATH set (CF-10). READING it as text is permitted by this batch's scope clarification; if you read it, say so and say which lines.
    - DO NOT EDIT experiments/EXP-WESOVOW-001/specification.yaml and never write an amended copy of it anywhere inside the repository. Splice in memory or in a scratchpad OUTSIDE the repository.
    - DO NOT MODIFY THE TWO COMMITTED SCRIPTS. You may RUN amendment_parse_control.py and independent_parse_check.py unmodified; running them is not a run. Set PYTHONDONTWRITEBYTECODE=1 and sys.dont_write_bytecode before importing anything from a snapshot-bound directory and leave no __pycache__ anywhere.
    - DO NOT STATE ANY PAPER_PAIRS VALUE, delta, crossover, margin, SIGN or speedup anywhere. Name them by locator. RT-2's antecedent `A > 0` IS the governed sign, so if attacking the R3 warrant sentence would require checking it at a declared field size, THE CORRECT OUTPUT IS THE STATEMENT THAT IT WOULD, NEVER THE VALUE.
    - DO NOT ASSERT THAT A COMMITTED IMMUTABLE RECORD IS WRONG. Name the defect and leave the stronger claim UN-PROMOTED; asserting it needs review-breakthrough at `max`, which is `degradable: false` and which this environment cannot serve (IMP-1). Never substitute a lower tier for a claim that needs a higher one.
    - DO NOT change a status, write a ledger record, commit anything, or make any security, SQIsign, CSIDH, standardized-parameter, exponent or asymptotic claim in either direction.
    - Never select a provider, backend, endpoint, or model identifier containing Bedrock, case-insensitively.

  the_stop_condition: >-
    IF YOU CONCLUDE THE UNDERLYING DEFECT DOES NOT REPRODUCE - that
    specification.yaml:39-40 and control C4 are not jointly unsatisfiable off the
    degenerate slice, or that the two blocks are not in one scope - record it precisely
    and in full and STOP INVESTIGATING IT. That object contradicts EV-SSI-2aaf6f at
    strength `replicated` and requires review-breakthrough at `max`, which this
    environment cannot serve (IMP-1). The round HALTS on that object, the claim stays
    un-promoted, GOAL-SSI-001 stays `active`, and the Coordinator decides what else the
    round can record. IT IS THE MOST CONSEQUENTIAL THING YOU COULD FIND, it must not be
    softened, and the stop condition must not discourage you from finding it.

