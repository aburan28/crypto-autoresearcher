    integrity defect, report it and LABEL IT AS AN INTEGRITY FINDING.

  the_one_integrity_thing_you_must_do_anyway: >-
    CONFIRM THE REDRAFT'S TEXT AGAINST THE FILE ITSELF, for every clause your
    findings rest on. DEC-20260906-408595 PD-9 records plainly that NO COORDINATOR
    HAS INDEPENDENTLY CONFIRMED THAT THE REDRAFTED clause_1's TEXT IS WHAT THE
    REPORTS SAY IT IS, and directs that the red-team pass and the enacting decision
    must each confirm it against the file. Say which clauses you confirmed and which
    you did not. An act finding resting on a report's paraphrase of a clause is an
    act finding resting on nothing.

