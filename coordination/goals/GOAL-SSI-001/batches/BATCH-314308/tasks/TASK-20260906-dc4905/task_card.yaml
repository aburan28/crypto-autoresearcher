      Coordinator thinks an act lives. Your reviewer is asked to check whether any of
      your findings rests on a block this list does not name. Reading outside the list
      is expected, not merely permitted.

  the_entailed_control_objects_are_mandatory:
    why: >-
      THIS CAMPAIGN HAS SEEN THREE CHECKS WHOSE PASS WAS ENTAILED BY THEIR OWN
      CONSTRUCTION - AC-1's pass region being exactly how its input was built (RT-3,
      CF-21); AC-4's pattern that can never fire (F-1, CF-13); and the shape-only parse
      control that would have passed on the very file it exists to detect the amendment
