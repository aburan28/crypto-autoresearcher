      four weaknesses? AN HONEST `YES, PARTLY` IS WORTH MORE THAN A CONFIDENT LIST.

  both_clean_outcomes_are_full_results: >-
    CONTRACTED IN ADVANCE. If you search hard on all four axes, run every object, and
    conclude the redraft's act is what it says it is, SAY SO PLAINLY and record HOW you
    searched - that is the most enactment-relevant thing this round could return.
