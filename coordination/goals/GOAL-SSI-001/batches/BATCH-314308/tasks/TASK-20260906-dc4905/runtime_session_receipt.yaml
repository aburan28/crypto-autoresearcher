schema: crypto.autoresearch.runtime_session_receipt.v1
# THE PRODUCER'S OWN ACCOUNT OF ITS SESSION. Inference provenance, the launching
# prompt disclosed from my own side (CF-15 second limb), and the write-hygiene
# statements this batch requires with how each was checked.
#
# NOTHING RECORDED HERE WAS INVENTED. Where a check was not run it is recorded
# as NOT RUN and never as passed; where an identity was not probe-verified it is
# recorded as unverified.

runtime_session_receipt:
  task_id: TASK-20260906-dc4905
  batch_id: BATCH-314308
  goal_id: GOAL-SSI-001
  role: red-team
  recorded_by: red-team
  recorded_at: '2026-09-06'

  # =====================================================================
  citation_prohibition_restated_verbatim: >-
    The `P=512` crossover value and its `w=2^80` sign are **NOT
    citation-eligible**. This task does not lift that prohibition. Only a
    committed Coordinator decision on independently reviewed evidence can lift
    it.
  citation_prohibition_predicate_extension_restated_verbatim: >-
    In addition to the retained sentence, a row of any EXP-WESOVOW-001
    reconciliation is NOT citation-eligible when either (a) the two anchors
    disagree in the SIGN of the baseline comparison at that row, or (b) the
    smaller |margin| across the two anchors at that row is below that field
    size's anchor gap |Delta log2 T_full + Delta log2 M / 2|.
  citation_prohibition_status_in_my_artifacts:
    lifted_by_me: false
    narrowed_by_me: false
    widened_by_me: false
    retained_sentence: {applicable: true, fired: false}
    predicate_extension: {applicable: false, fired: false}
    the_one_deliberate_restraint_i_exercised: >-
      I read cost_model.py lines 55-70, which contain the PAPER_PAIRS mapping,
      THROUGH A REDACTION FILTER that replaced every numeral with a placeholder
      BEFORE the text reached my transcript. I therefore never held a PAPER_PAIRS
      value and could not have restated one. What I report about that range is
      structural only: it is a five-key mapping of pairs spanning lines 60-66,
      which verifies the redraft's blast-radius locator without touching a value.
    where_a_check_would_have_required_a_governed_value: >-
      Attacking the R3 warrant sentence at a declared field size would require
      evaluating its antecedent `A > 0`, which IS the governed
      baseline-comparison sign. I DID NOT EVALUATE IT. I state that such a check
      would require it, which is the correct output, and I state no value.

  # =====================================================================
  inference:
    requested_policy: review-adversarial
    requested_reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
    adapter_resolution_command: 'python3 -m orchestration.adapter resolve --role red-team --independent-session'
    adapter_resolution_stdout_verbatim: 'review-adversarial -> anthropic:claude-opus-5 (effort=xhigh)'
    adapter_resolution_exit_code: 0
    first_attempt_recorded_because_it_is_informative: >-
      Run without `--independent-session` the same command returned
      "error: policy review-adversarial requires an independent session; the
      caller did not assert one (pass --independent-session /
      independent_session=True)". Recorded because it shows the policy's
      independence requirement is enforced by the adapter and not merely
      declared.
    my_own_self_report: >-
      I am Claude Opus 5, model identifier `claude-opus-5`, running as the
      `red-team` subagent of this Claude Code session, whose agent file carries
      `effort: xhigh` derived from the `review-adversarial` policy.
    self_report_versus_adapter_resolution: >-
      THEY AGREE. The adapter resolves `anthropic:claude-opus-5` and my own
      self-report is `claude-opus-5`. This is a change from the previous two
      rounds, which DEC-20260906-408595 records as having produced an
      adapter-resolved identifier DIVERGING from the producer's own self-report.
      I record the agreement as an observation and not as a verification.
    model_verified: false
    model_verified_reason: >-
      NO PROBE WAS RUN AND I RECORD NO PROBE I DID NOT OBTAIN. I did not run
      `python3 -m orchestration.adapter doctor --probe`. A probe enumerates and
      contacts configured backends, and this batch's network_use block says no
      task needs the network and no conclusion may rest on a retrieval, while
      AGENTS.md rule 16 forbids selecting any provider, backend, endpoint or
      model identifier containing `bedrock`. I declined to run an enumeration I
      could not first constrain, and the cost is that the resolved identifier
      stays unverified configuration. That cost is recorded rather than
      smoothed.
    fallback_used: false
    degraded_requirements: []
    a_divergence_i_ESCALATE_RATHER_THAN_ABSORB: >-
      BATCH-314308/batch.yaml `inference_environment` records
      `resolvable_backends: local only`, explicitly as an ASSUMPTION carried
      forward from IMP-1 and labelled as one. The adapter resolution I actually
      obtained for my own role names `anthropic:claude-opus-5`, not a `local`
      binding. I DO NOT RECONCILE THESE AND I DRAW NO CONCLUSION FROM IT. I ran
      no probe, so I assert nothing about which backends are servable; I do NOT
      claim that more than one backend resolves; I do NOT downgrade IMP-1, which
      stands re-confirmed; and no claim of mine is promoted on the strength of
      it. THE COORDINATOR SHOULD RECHECK WITH THE COMMAND IMP-1 NAMES and record
      the outcome, because IMP-1's `clears_when` turns on exactly this question.
    model_independence_statement: >-
      THIS ROUND IS SESSION-INDEPENDENT AND NOT MODEL-INDEPENDENT. Every agent of
      this batch is a subagent of one orchestrating session, sharing one
      filesystem and one scratchpad. MY AGREEMENT WITH ANY PRIOR REPORT MAY NEVER
      BE PRESENTED AS AGREEMENT BETWEEN DISTINCT MODELS. Blindness was
      deliberately lifted for me by name, so my agreement with any RT-, F- or
      V-number is additionally not independent of the reports I was handed.
    bedrock_prohibition: >-
      HONOURED. No provider, backend, endpoint or model identifier containing
      `bedrock`, case-insensitively, was selected, requested, probed or contacted
      by me at any point.

  # =====================================================================
  launching_prompt_disclosure_CF_15_second_limb:
    channel: >-
      I was launched by the orchestrating session with a prompt that is not a
      committed artifact and leaves no auditable trace. It can be reported only
      by that session or by my own candour. This block is my candour.
    what_it_told_me_in_substance: >-
      It named my task, batch and goal; ordered the documents I must read and in
      what order; stated that where the card and the queue overlap the queue's
      handoff block governs and its completion_gate is authoritative; described
      what this pass is and is not; enumerated my read scope and the one
      deliberate exclusion; restated the entailed-control discipline and the five
      objects; restated the hard constraints on approving, enacting, settling
      reserved items, editing immutable artifacts, executing cost_model.py,
      writing outside my task directory, and restating governed quantities; and
      restated the budget, the inference provenance requirements, IMP-1 and the
      Bedrock prohibition.
    verbatim_statements_it_made_about_an_expected_outcome_a_preferred_verdict_a_known_finding_a_suspected_defect_or_how_a_previous_agent_concluded:
      - >-
        "`BATCH-60d6b9` checked the redraft's **integrity** - does it parse, does
        it carry what was ordered, can its control fail. That round returned zero
        blocking findings and it is committed."
      - >-
        "**A pass that finds nothing blocking is a complete and valuable result
        and is contracted as one in advance.** If you search hard and find
        nothing, say so and record *how* you searched. **Manufacturing an
        objection to make this round look productive is a named failure mode**:
        it consumes the enacting decision's attention and teaches later readers
        to discount red-team findings generally. Rate severities honestly,
        including informational."
      - >-
        "Equally: if enacting this redraft would genuinely bind someone it should
        not, foreclose something it should not, or license a reading the evidence
        does not support, **say it at full strength and do not soften it.** This
        pass is the gate before enactment; understating here is the more
        expensive error."
      - >-
        "This campaign has now produced **three** checks whose pass was entailed
        by their own construction - the third was caught only at design time."
      - >-
        "**The inert object** - a committed record that proposes no act, binds
        nobody and forecloses nothing. If your procedure returns act-findings
        there, those findings are products of the procedure, not of the redraft.
        **A hit there is a BREAK of your own method and must be reported as one,
        never suppressed.**"
      - >-
        "**The discriminating twin** - the superseded, known-un-enactable
        BATCH-752ef2 draft. The inert object catches a procedure that fires on
        anything; the twin catches one that fires on the *class* rather than the
        *instance*. All three of this campaign's previous entailment failures
        were the first kind."
      - >-
        "The redraft is a DRAFT - `in_force: false`, `approved_by: null` - and
        `EXP-WESOVOW-001` remains `approved` and **unamended at version 1**."
      - >-
        "**DO NOT SETTLE ANY OF THE FIVE ITEMS RESERVED TO THE ENACTING
        DECISION** ... and **RT-4's licensing question, which the redraft carried
        into clause_4's text as ordered but did not and could not settle.**"
      - >-
        "The redraft's own low findings (V-1, V-2, V-3) belong in a SUCCESSOR
        record, never in an edit."
      - >-
        "`review_plan.yaml` is **deliberately outside your read scope.** The
        reviewer's joints are not yours to anticipate ... Do not read it, and
        record that you did not."
    what_it_did_NOT_tell_me:
      - It named no suspected defect and no expected finding.
      - It did not say which of the nine key paths is weakest or where it thought a break would be.
      - It did not say how many findings a good pass returns.
      - It did not speak the Coordinator's prior, and I did not open review_plan.yaml.
    how_i_treated_the_contamination: >-
      A DISCLOSED CONTAMINATION IS A DISCOUNT AND AN UNDISCLOSED ONE IS A
      FABRICATION, so it is disclosed. The load-bearing item is the sentence that
      BATCH-60d6b9 "returned zero blocking findings", which is a statement about
      how a previous agent concluded and which I received before I looked. I
      cannot unlearn it. What I did instead: I wrote my procedure down BEFORE
      running it, ran it on the inert object and the twin, and reported four of
      my eight A4 candidates as KILLED by checking. My finding set's entailment
      is answered in writing in both of my other artifacts, and the answer is
      "yes, partly", per finding.

