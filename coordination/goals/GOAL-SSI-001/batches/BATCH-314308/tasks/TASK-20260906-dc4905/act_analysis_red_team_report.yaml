schema: crypto.autoresearch.red_team_report.v1
# THE INDEPENDENT RED TEAM PASS ON THE REDRAFTED RECORD AS A PROPOSED ACT.
#
# NOTHING HERE APPROVES OR ENACTS ANYTHING. EXP-WESOVOW-001 is `approved` and
# UNAMENDED at version 1; its specification.yaml is unchanged, unstaged and
# unread-for-write by this task. The object under attack -
# coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/protocol_amendment_redraft.yaml -
# is COMMITTED AND IMMUTABLE and remains `status: draft`, `in_force: false`,
# `approved_by: null`. Attacking a draft is not enacting it. No status moves, no
# ledger record is written, nothing is committed by this task, and none of the
# FIVE items reserved to the enacting decision is settled here.

red_team_report:
  id: RT-20260906-dc4905
  task_id: TASK-20260906-dc4905
  batch_id: BATCH-314308
  goal_id: GOAL-SSI-001
  role: red-team
  recorded_by: red-team
  recorded_at: '2026-09-06'

  claim_under_review: >-
    NOT A MATHEMATICAL CLAIM. The object is a PROPOSED ACT: whether enacting the
    committed redraft would do what the redraft says it would do, to whom it
    would do it, what it would foreclose, and what a reader of the green PC-1
    parse control would wrongly conclude. This pass returns a verdict on those
    four axes only. It returns NO verdict on enactability as a whole; the
    Coordinator composes.

  object:
    path: coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ee372e/protocol_amendment_redraft.yaml
    sha256_measured_by_this_task: 89f2aa8ab4a3279f3a9396571ca5ee871faba1e852bfad8476a8a017a7009b2c
    digest_agreement: >-
      THE OBJECT I ATTACKED IS THE OBJECT THAT WAS REVIEWED AND ARCHIVED. The
      sha256 I measured with `sha256sum` equals the value recorded at
      BATCH-60d6b9/reviews/TASK-20260906-ba0284/validation_report.yaml:165, at
      BATCH-60d6b9/archives/TASK-20260906-9f3e2a/ledger_commit_receipt.json:83,
      and in BATCH-60d6b9/dispatch_queue.json:446. Checked, not assumed.
    committed_in: >-
      9da258d0e, whose commit subject reads "pre-review(GOAL-SSI-001): commit six
      producer artifacts of BATCH-60d6b9"
    frozen_contract_sha256_measured_by_this_task: c5cc16f7033407dd098fcba3ee79edca19c1f9a8aad2175e352db1a30fc4aa52

  # =====================================================================
  citation_prohibition_restated_verbatim: >-
    The `P=512` crossover value and its `w=2^80` sign are **NOT
    citation-eligible**. This task does not lift that prohibition. Only a
    committed Coordinator decision on independently reviewed evidence can lift
    it.
  citation_prohibition_predicate_extension_restated_verbatim: >-
    In addition to the retained sentence, a row of any EXP-WESOVOW-001
    reconciliation is NOT citation-eligible when either (a) the two anchors
    disagree in the SIGN of the baseline comparison at that row, or (b) the
    smaller |margin| across the two anchors at that row is below that field
    size's anchor gap |Delta log2 T_full + Delta log2 M / 2|.
  citation_prohibition_applicability:
    retained_sentence:
      applicable: true
      fired: false
      why: >-
        APPLICABLE - I read the frozen contract, whose metrics[5] IS an analytic
        crossover line, and I read cost_model.py as text at four ranges
        including the PAPER_PAIRS mapping. NOT FIRED. No crossover value, no
        baseline-comparison sign, no margin, no speedup and no PAPER_PAIRS value
        or delta appears anywhere in my three artifacts. The PAPER_PAIRS block
        was read with every numeral suppressed at the point of reading (I piped
        the range through a redaction filter before it reached my transcript);
        what I report about it is structural only - that it is a five-key
        mapping of pairs spanning cost_model.py lines 60-66.
    predicate_extension:
      applicable: false
      fired: false
      why: >-
        I cite no row of any EXP-WESOVOW-001 reconciliation and compute no
        per-row margin. The predicate has no object in this pass.
    the_one_place_it_could_have_fired_and_did_not: >-
      Attacking the redraft's R3 warrant sentence
      (amendment.gating_reproduction.r3_warrant_sentence) at a declared field
      size would require evaluating its antecedent `A > 0`, and RT-2's
      antecedent `A > 0` IS the governed baseline-comparison sign. I DID NOT
      EVALUATE IT AND I STATE ONLY THAT SUCH A CHECK WOULD REQUIRE IT. That is
      the correct output and it is not the value. I neither rest on the refuted
      derivation nor silently substitute the repaired one; CF-22 is reserved to
      the enacting decision and I leave it there.
    one_symbolic_check_i_did_run_and_why_it_is_not_a_citation: >-
      I checked, purely symbolically and with NOTHING instantiated, whether
      cost_model.py's crossover expression at line 288 is the crossover of
      cost_model.py's own charging-law string at line 239 - i.e. whether it
      solves the equation clause_2's third invariant states. It is. No field
      size, no overhead value, no memory budget, no anchor and no numeral enters
      that check; it is an identity between two quoted committed expressions.
      Neither prohibition limb fired on it and no value, sign, margin or speedup
      is derived, recomputed, tabulated or cited by it.

  # =====================================================================
  the_procedure_i_ran:
    why_it_is_written_down_first: >-
      MY OUTPUT IS AN ARGUMENT AND AN ARGUMENT HAS THE SAME FAILURE MODE AS A
      CONTROL: every record that proposes anything forecloses something, so a
      list of foreclosures is entailed by the assignment. The procedure is
      stated before its results so that its discriminating power is checkable
      rather than asserted, and so that the entailed-control objects exercise
      the SAME procedure rather than a softened one.
    steps:
      - >-
        S1 THE ENACTABILITY GATE. Does the record declare an OPERATION (replace,
        add, remove) on a NAMED artifact OUTSIDE itself, at a LOCATOR, with
        applicable text? If no, the record proposes no act: S2-S4 return nothing
        and only S5 may run. This is the gate the inert object must trip.
      - >-
        S2 EFFECT CLOSURE (axis A1). Enumerate every effect the record CLAIMS on
        its target - in version fields, what_this_changes, blast_radius - and
        for each, name the clause text that effects it. A claimed effect with no
        clause effecting it is a finding. A clause effect outside the claimed
        set is a finding.
      - >-
        S3 BINDING (axis A2). Enumerate every sentence of the proposed
        replacement text carrying a normative verb (must, required, may not,
        non-conforming, licenses, forecloses). For each, name the SUBJECT the
        text addresses, and separately the party who would in practice have to
        comply. Ask whether compliance is possible at the instant of enactment
        and who carries the gap until it is.
      - >-
        S4 FORECLOSURE (axis A3). For each new invariant, pointer or
        requirement, name the future record, repair or reading that becomes
        unavailable or costlier, and check whether the record already discloses
        it.
      - >-
        S5 GREEN-CONTROL OVER-READING (axis A4). For each assertion of the
        record's own control, compute the set of amended-document states that
        pass it. Enumerate what a reader would conclude that is NOT in that set,
        and CHECK EACH CANDIDATE AGAINST A COMMITTED ARTIFACT. A candidate a
        committed artifact in fact establishes is a BREAK of my analysis and is
        reported as one, not quietly dropped.
      - >-
        S6 RESERVED-ITEM CHECK. For each item the record reserves, verify from
        the record's own bytes that it does not settle it, and separately verify
        that ENACTMENT would not settle it de facto.
      - >-
        S7 ANCHORING. Every finding quotes the record's own bytes at a named key
        path, confirmed against the file itself and never through a report.

  # =====================================================================
  clause_text_confirmation_against_the_file:
    why_this_is_here: >-
      DEC-20260906-408595 PD-9 records plainly that "NO COORDINATOR HAS
      INDEPENDENTLY CONFIRMED THAT THE REDRAFTED clause_1's TEXT IS WHAT THE
      REPORTS SAY IT IS. The red-team pass and the enacting decision must each
      confirm it against the file." This block is my half of that.
    how: >-
      I read the redraft directly with `sed -n` over its whole 1184 lines, and
      independently parsed it with yaml.safe_load in a scratch script OUTSIDE
      the repository, pulling each clause from
      amendment.proposed_replacement.<clause>.replacement_text_in_full. I then
      spliced all four clauses IN MEMORY under the redraft's own declared
      splice_procedure, implemented in my own scratch code and NOT by importing
      the producer's control, and inspected the resulting parsed document. No
      finding below rests on anyone's paraphrase.
    clauses_confirmed_against_the_file:
      - clause_1 - CONFIRMED. Text read at the file, parsed standalone, and spliced by my own code at indent 2 over lines 39-40.
      - clause_2 - CONFIRMED. Text read at the file and spliced at indent 4 inside model_definition; resulting key set inspected.
      - clause_3 - CONFIRMED. Text read at the file and spliced at indent 4 inside controls[0]; resulting key set inspected.
      - clause_4 - CONFIRMED. Text read at the file and spliced at indent 4 inside controls[0]; resulting key set inspected.
    non_clause_key_paths_confirmed_against_the_file:
      - amendment.version_from, amendment.version_to, amendment.version_note
      - amendment.target.primary and amendment.target.not_targeted_and_explicitly_untouched
      - amendment.splice_procedure (all sub-keys)
      - amendment.controls (PC-1, its four assertions, its negative objects, what_it_does_not_check)
      - amendment.what_this_changes and amendment.what_this_does_not_change
      - amendment.reserved_to_the_enacting_decision (all three items)
      - amendment.cf_10_raw_path_placement (all sub-keys)
      - amendment.blast_radius (all sub-blocks)
      - amendment.scope
      - amendment.enactment (including prerequisites_before_such_a_decision)
      - amendment.reviewer_notes.known_weaknesses_of_this_draft (all five items)
      - amendment.gating_reproduction.r3_warrant_sentence (read in full; NOT evaluated)
      - amendment.changes_from_the_superseded_draft (all 19 items)
    what_i_did_not_confirm: >-
      THE INCORPORATED LAW. clause_2 points at
      coordination/goals/GOAL-SSI-001/batches/BATCH-2e6130/tasks/TASK-20260809-ef3e58/protocol_amendment.yaml
      keys amendment.corrected_model.log2_law, .endpoint_behavior and
      .crossover. THAT RECORD IS OUTSIDE MY DECLARED read_scope AND I DID NOT
      OPEN IT. I therefore confirmed neither that those three key paths exist,
      nor that the record is in force, nor that the law it states satisfies the
      three invariants clause_2 would impose on it. See finding AF-3. I also did
      not open inputs/P13-WESOLOWSKI-2026/ (outside read_scope), so I confirmed
      neither the locator paper_fulltext.md:234-238 nor the characterization
      clause_3 would put into the contract.

  # =====================================================================
  findings:

    - id: AF-1
      axis: A1
      severity: medium
      classification: ACT finding
      title: >-
        THE AMENDMENT DECLARES A VERSION CHANGE THAT NONE OF ITS CLAUSES
        EFFECTS. Applied exactly as written, the amended contract still reads
        `version: 1`.
      key_paths_and_quoted_words:
        - path: amendment.version_to
          quoted: '2'
        - path: amendment.version_note
          quoted: >-
            "`version_to: 2` numbers the CONTRACT."
        - path: amendment.blast_radius.frozen_artifacts[0].effect
          quoted: >-
            "The direct target. Lines 39-40 superseded; model_definition and C1
            gain additive keys. Version becomes 2 and every record produced
            before enactment stays scoped to version 1."
        - path: amendment.enactment.what_would_be_required
          quoted: >-
            "a committed coordinator_decision record under ledger/decisions/ ...
            that approves this amendment and moves EXP-WESOVOW-001 to version 2"
        - path: amendment.proposed_replacement (all four clauses) and amendment.splice_procedure
          quoted: >-
            clause_1 "replace lines 39-40"; clause_2 "append inside
            experiment.model_definition, after line 107"; clause_3_and_clause_4
            "append inside experiment.controls[0], after line 141". No operation
            names experiments/EXP-WESOVOW-001/specification.yaml line 3, which
            reads "  version: 1".
      what_i_actually_did: >-
        I spliced all four clauses in memory with my own code under the declared
        procedure and read `experiment.version` off the resulting parsed
        document. IT IS 1. The top-level key set of the amended document is
        identical to the frozen one; `stopping_rules` and `success_criterion_note`
        are unchanged. This is corroborated - not derived from - the committed
        structural diff at
        BATCH-60d6b9/reviews/TASK-20260906-ba0284/validation_report.yaml,
        `structural_diff_frozen_vs_fully_amended`, which returns exactly five
        differences, NONE of them `.experiment.version`.
      follows_from: >-
        THE TEXT ALONE. No further decision is needed for this consequence: it
        is what the four clauses do.
      why_it_matters_and_it_is_not_cosmetic: >-
        The amendment's central promise is version-scoping: that prior records
        "stay scoped to version 1" and that this is why an amendment is used
        instead of an edit (amendment.why_an_amendment_and_not_an_edit). That
        promise is discharged by a mark IN THE CONTRACT FILE distinguishing the
        two versions, and no clause makes that mark. The enacting decision is
        therefore forced into one of two positions, and neither is written down
        anywhere: (a) it performs the version bump ITSELF, in which case the
        enacted file differs from the frozen one in SIX places, one of which is
        outside the amendment's declared difference set - so the committed
        five-difference verification no longer covers the enacted artifact and
        the amendment's own principle that repairs come "never by an edit"
        (clause_2.binding_effect) is strained by the enactment's own first act;
        or (b) it does not, in which case the contract governs at "version 2"
        while saying `version: 1`, and every later reader must learn the version
        from a decision record rather than from the contract. PC-1 cannot see
        either outcome: it asserts on metrics[5] and nothing else.
      party_addressed_vs_party_who_must_comply: >-
        The text addresses no party here at all - that is the defect. The party
        who must comply is the enacting Coordinator, who is given no clause to
        apply.
      smaller_repair_LABELLED_RECOMMENDATION: >-
        RECOMMENDATION, NOT A RULING, and it does not settle any reserved item.
        Either (i) a SUCCESSOR record - never an edit of the immutable redraft -
        adds a fifth clause replacing specification.yaml line 3 with `  version: 2`
        at splice_indent 2, and PC-1 gains a fifth assertion `P5: experiment.version == 2`;
        or (ii) the enacting decision states in its own text that IT performs the
        version transition, names the exact bytes it changes, records that the
        enacted difference set is six rather than five, and re-runs the committed
        structural diff (BATCH-60d6b9/reviews/TASK-20260906-ba0284/independent_parse_check.py)
        against the ENACTED artifact rather than citing the five-difference result
        obtained on a document that was never version-bumped.
      entailment_honesty: >-
        NOT entailed by my prompt, which named nine key paths and said nothing
        about the version field. NOT a restatement: I grepped
        `version_to|version_from|Version becomes|experiment.version|version: 2`
        across the BATCH-79a0cb red-team report, the BATCH-60d6b9 validation
        report, EV-SSI-804e09 and DEC-20260906-408595 and the field is mentioned
        in NONE of them. It is partly entailed by the ASSIGNMENT in the weak
        sense that "what would this do to the file" is exactly what I was asked;
        the specific gap is not.
      twin_survival: >-
        SURVIVES on the superseded BATCH-752ef2 draft, which carries the
        identical `version_to: 2` (line 16) and the identical "Version becomes 2"
        sentence (line 444) with no version clause either. THE DEFECT IS
        THEREFORE CLASS-LEVEL - inherited from the lineage - AND I LABEL IT SO.
        THE CONSEQUENCE IS NOT: the twin cannot be enacted at all (its clause_1
        does not parse when spliced), so on the twin the gap is inert. On the
        redraft it is live, because BATCH-60d6b9 established that this record
        CAN be applied. That asymmetry is the whole content of the finding and I
        state it rather than letting the survival either kill or inflate it.

    - id: AF-2
      axis: A2
      severity: medium
      classification: ACT finding
      title: >-
        THE REDRAFT'S OWN ENACTMENT CHECKLIST NAMES A PREREQUISITE THAT NO
        ARTIFACT OF ITS BATCH SATISFIES AS STATED: "the snapshot archive of this
        package (TASK-20260906-9f3e2a)" is a LEDGER archive that ran AFTER the
        review.
      key_paths_and_quoted_words:
        - path: amendment.enactment.prerequisites_before_such_a_decision[1]
          quoted: 'the snapshot archive of this package (TASK-20260906-9f3e2a)'
      what_i_actually_did: >-
        I read the receipt at
        BATCH-60d6b9/archives/TASK-20260906-9f3e2a/ledger_commit_receipt.json
        and the card at BATCH-60d6b9/tasks/TASK-20260906-9f3e2a/task_card.yaml.
        The receipt carries `"kind": "ledger"` and `"binding_mode": "content_first"`;
        the card's own header reads "THE SINGLE ARCHIVE-BLOCK TASK OF BATCH-60d6b9"
        and states that six of its fourteen paths "were committed before the
        review ran, by the dispatching session's PRE-REVIEW COMMIT, which is why
        the binding mode is content_first and not commit". BATCH-60d6b9 has
        exactly one archives/ directory and it is that ledger archive. The
        pre-review commit itself exists (9da258d0e) but was made by the
        dispatching session as a dispatch precondition, with - in this batch's
        own words at BATCH-314308/batch.yaml
        archive_topology.what_six_identifiers_bought_that_four_did_not - no card,
        no budget, no completion gate, no receipt and no dispatcher post-commit
        verifier pass.
      follows_from: >-
        THE TEXT ALONE for the mislabel. The CONSEQUENCE - that an enacting
        decision ticks a checklist item by citing an artifact of the wrong kind -
        needs the further act of that decision, which is exactly the act this
        pass precedes.
      party_addressed_vs_party_who_must_comply: >-
        Addressed: the enacting Coordinator, explicitly, as the reader of
        prerequisites_before_such_a_decision. Must comply: the same party. There
        is no third party here, which is why the defect is cheap to fix and
        expensive to leave.
      smaller_repair_LABELLED_RECOMMENDATION: >-
        RECOMMENDATION. The enacting decision records, in its own text, WHICH
        artifact it treats as discharging prerequisite (2), that
        TASK-20260906-9f3e2a is a `ledger` archive and not a snapshot archive,
        that the pre-review commit 9da258d0e is what actually placed the package
        under an independent reviewer, and that that commit carried none of the
        archival gates - i.e. it discharges the prerequisite's INTENT while
        recording that its LETTER names the wrong task. A successor record may
        correct the letter; the immutable redraft may not be edited.
      entailment_honesty: >-
        NOT entailed by my prompt or by any numbered finding. V-3 of the
        BATCH-60d6b9 review touches this key path only to observe that "one new
        entry each under enactment.decisions_that_are_NOT_sufficient_to_enact_it
        and .prerequisites_before_such_a_decision" is missing from the redraft's
        change enumeration - a completeness point about the ENUMERATION, not
        about the CONTENT of the prerequisite. I read V-3 before forming this and
        say so.
      twin_survival: >-
        DOES NOT SURVIVE. THIS IS THE FINDING THE TWIN CONTROL DISCRIMINATES.
        The superseded BATCH-752ef2 draft's corresponding item (line 575) reads
        "the snapshot archive of this package (TASK-20260905-6fcd2c)", and
        BATCH-752ef2/archives/TASK-20260905-6fcd2c/snapshot_commit_receipt.json
        carries `"kind": "snapshot"`. The twin's item is CORRECT. The redraft's
        is not. This finding is therefore about THIS INSTANCE and I say so.

    - id: AF-3
      axis: A1
      severity: medium
      classification: ACT finding
      title: >-
        AFTER ENACTMENT THE CONTRACT'S ONLY STATEMENT OF ITS GOVERNING CHARGING
        LAW IS A POINTER INTO A COORDINATION BATCH DIRECTORY THAT NO REVIEWER IN
        THIS CHAIN HAS BEEN SCOPED TO OPEN - and clause_1's own words say the law
        is "stated" there.
      key_paths_and_quoted_words:
        - path: amendment.proposed_replacement.clause_1.replacement_text_in_full
          quoted: >-
            "The vOW charging law from which log2(w*) is computed, and the closed
            form of log2(w*) itself, are stated once for this contract in
            model_definition.vow_charging_law and nowhere else."
        - path: amendment.proposed_replacement.clause_2.replacement_text_in_full, key incorporated_by_reference
          quoted: >-
            record "coordination/goals/GOAL-SSI-001/batches/BATCH-2e6130/tasks/TASK-20260809-ef3e58/protocol_amendment.yaml",
            keys "amendment.corrected_model.log2_law, amendment.corrected_model.endpoint_behavior, amendment.corrected_model.crossover";
            "This contract holds exactly one pointer, not a paraphrase."
      what_i_actually_did: >-
        I built the amended document in memory and listed
        model_definition.vow_charging_law's keys: [status_in_this_contract,
        incorporated_by_reference, invariants_that_any_incorporated_law_must_satisfy,
        binding_effect, notation_note]. NO CHARGING LAW AND NO CLOSED FORM IS
        STATED THERE. clause_1's sentence is true only transitively, through the
        pointer. I then established that the pointer's target has been confirmed
        by nobody in this review chain: the BATCH-79a0cb red team records in its
        own limitations that "I did not open inputs/, EV-SSI-5d954c,
        EV-SSI-7a3e91, the BATCH-2e6130 amendment record, or the BATCH-256a94
        artifacts ... In particular I did NOT independently confirm that the
        incorporated law at clause_2's reference is what the draft says it is";
        the BATCH-60d6b9 validator's structural diff compares two versions of
        specification.yaml and never reaches it; and BATCH-2e6130 is outside MY
        declared read_scope, so I did not open it either. THREE CONSECUTIVE
        ADVERSARIAL OR VALIDATING ROUNDS HAVE LEFT THE CONTRACT'S FUTURE ONLY
        SOURCE OF LAW UNOPENED, each for a defensible scope reason.
      what_i_could_check_and_did: >-
        The IMPLEMENTATION's law, which is a different object. Reading
        cost_model.py as text (permitted by this batch, disclosed in my receipt),
        line 239 carries the charging-law string and lines 288-289 the crossover
        and its feasibility flag. Symbolically and with nothing instantiated,
        that law is non-increasing in the memory budget, equals its full-memory
        value at and above M, and line 288 is exactly the crossover of that same
        law - so on the IMPLEMENTATION the three invariants clause_2 would impose
        are satisfied and clause_2's `binding_effect` would not fire on
        enactment. THAT IS NOT THE SAME AS CHECKING THE INCORPORATED RECORD, and
        the redraft's claim that the two "already match" is precisely what
        nobody has verified.
      follows_from: >-
        THE TEXT ALONE for the structure. Whether the incorporated record
        actually carries the three named keys, is in force, and satisfies the
        invariants is a matter of fact that a further reading - not a further
        decision - would settle.
      smaller_repair_LABELLED_RECOMMENDATION: >-
        RECOMMENDATION, and it is the cheapest high-value pre-enactment check
        available. Before enacting, the Coordinator opens
        BATCH-2e6130/tasks/TASK-20260809-ef3e58/protocol_amendment.yaml and
        records, in the enacting decision: (a) that the three key paths exist;
        (b) that record's own status/in_force fields; and (c) that the law it
        states satisfies the three invariants clause_2 would impose. If any of
        the three fails, the amendment as drafted would leave the contract with
        a dangling or non-conforming statement of law and the smaller repair is
        the one the redraft itself already concedes at
        reviewer_notes.known_weaknesses_of_this_draft[0] - promote the law to a
        ledger record first, which "this draft would not resist". A second,
        one-line RECOMMENDATION independent of that: clause_1's "are stated once
        for this contract in model_definition.vow_charging_law" would read more
        truly as "are fixed for this contract by model_definition.vow_charging_law,
        which incorporates them by reference"; that is a successor-record change
        and never an edit.
      entailment_honesty: >-
        PARTLY ENTAILED. The pointer's structural weakness is DISCLOSED by the
        draft itself (reviewer_notes item 0) and the non-confirmation is on the
        record as a LIMITATION of the BATCH-79a0cb review. What is mine is the
        act-framing - that this becomes the amended contract's ONLY source of
        law - and the observation that the non-confirmation has now survived
        three rounds by scope construction rather than by anyone's judgement
        that it does not matter.
      twin_survival: >-
        SURVIVES UNCHANGED. clause_2 is byte-identical between the two records
        (established mechanically at
        BATCH-60d6b9/reviews/TASK-20260906-ba0284/validation_report.yaml,
        `clause_2_byte_identical_to_superseded: true`), and clause_1's content is
        identical modulo indentation. CLASS FINDING, labelled as one; live only
        on the redraft, for the enactability reason given under AF-1.

    - id: AF-4
      axis: A3
      severity: medium
      classification: ACT finding, extending a DRAFT SELF-DISCLOSURE
      title: >-
        CLAUSE_4 IMPOSES A CONTRACT-LEVEL REQUIREMENT THAT NO IMPLEMENTATION CAN
        MEET AND THAT NOTHING IN THIS BATCH CAN MAKE MEETABLE, and clause_3
        carries one operative prohibition with no stated subject.
      i_narrowed_this_finding_after_checking_a_committed_artifact: >-
        RECORDED BECAUSE CATCHING MY OWN OVERSTATEMENT IS THE POINT OF THE
        DISCIPLINE. My first formulation said the licence's predicate - a
        recorded per-field reachability status - exists nowhere, so that no
        anchor-derived comparison could satisfy clause_4's proviso. I then
        checked it against
        BATCH-752ef2/tasks/TASK-20260905-28c89d/category_and_licensing_analysis.yaml,
        which at lines 226-227 DOES record per-field statuses from an independent
        reviewer's bit-exact recomputation. THAT KILLS THE STRONG FORM: a report
        CAN cite those statuses and satisfy the licence proviso. What survives is
        narrower and is what I claim: clause_4 requires the status "per field
        size, IN THE RAW OUTPUT" of an implementation, statuses in a coordination
        analysis do not discharge that, and the requirement cannot be met by the
        only implementation there is.
      key_paths_and_quoted_words:
        - path: amendment.proposed_replacement.clause_4.replacement_text_in_full, key requirement
          quoted: >-
            "an implementation of this contract must record whether the anchor's
            time is attainable by this cost model on the optimizer grid ... The
            status is recorded per field size, in the raw output, as `reachable`
            or `off_curve`."
        - path: amendment.proposed_replacement.clause_4.replacement_text_in_full, key licensing_provisos_are_operative
          quoted: >-
            "The two conditions stated in capitals above - locator, relation and
            unit; and status in the same breath as the signed difference - are
            CONDITIONS ON THE LICENCE and not commentary. A report that omits
            either is outside the licence, exactly as if the status had not been
            recorded at all."
        - path: amendment.proposed_replacement.clause_3.replacement_text_in_full, key deviation_sign_note
          quoted: >-
            "it may not be reported as one without the anchor_reachability status
            required by clause_4"
        - path: amendment.blast_radius.frozen_artifacts[3].effect
          quoted: >-
            "Its raw-result.json `paper_pair` and `deviation_bits` blocks are
            exactly the non-conforming serialization clause_3 addresses; they stay
            as emitted."
      what_i_actually_did: >-
        I traced the requirement to the artifact that would have to satisfy it. I
        read cost_model.py line 302 as text: it emits `"paper_pair":
        {"log2time": pt, "log2memory": pm}` - keys naming only a time and a
        memory, with no relation, no unit, no locator and no reachability
        status. So the only implementation is non-conforming on both clause_3's
        serialization requirement and clause_4's status requirement, which the
        redraft discloses. What the redraft does NOT trace is what it would take
        to end that state: a conforming implementation requires the companion
        record, WHICH DOES NOT EXIST; and emitting a status "in the raw output"
        requires EXECUTING an implementation, which this amendment expressly does
        not authorize (amendment.scope.budget: "This amendment authorizes NO new
        run") and which CF-10's standing containment currently forbids for the
        one implementation there is. Separately, on subjects: clause_4's
        requirement addresses "an implementation of this contract", but clause_3's
        deviation_sign_note - "it may not be reported as one without the
        anchor_reachability status required by clause_4" - has no stated subject
        at all, so its prohibition lands on any writer of any later report.
        amendment.what_this_changes reports only the implementation limb ("Implementations
        become required to ...") and so understates clause_3 by one sentence.
      follows_from: >-
        THE TEXT ALONE for the binding on implementations and for clause_3's
        unsubjected prohibition. That the state cannot be ended follows from the
        text PLUS two standing conditions I name rather than assume: the
        non-existence of the companion record, and CF-10's execution
        prohibition, whose lifting is a separate Coordinator act I do not take.
      party_addressed_vs_party_who_must_comply: >-
        Addressed by clause_4: "an implementation of this contract". Addressed by
        clause_3's deviation_sign_note: NOBODY - the sentence is an unsubjected
        passive, so its prohibition reaches any writer of any later report, not
        only an implementation. Who must comply in the interval: the maintainer
        of cost_model.py, who is not addressed by any clause and who cannot act
        while CF-10's containment stands; and every future report-writer, who is
        bound by an unsubjected sentence and who CAN comply, because per-field
        statuses do exist in a committed coordination artifact even though no raw
        output carries them.
      smaller_repair_LABELLED_RECOMMENDATION: >-
        RECOMMENDATION. Either (i) enact only alongside the companion record, as
        the draft's own reviewer_notes[1] says ("The two should be enacted
        together") - which makes the companion record a PREREQUISITE and not a
        preference, and see AF-5; or (ii) the enacting decision states expressly
        that clause_4's requirement is PROSPECTIVE on implementations, that the
        one existing implementation is non-conforming from the instant of
        enactment and that this is accepted knowingly, and that clause_3's
        deviation_sign_note binds reports written after enactment and may be
        satisfied by citing the statuses already recorded at
        BATCH-752ef2/tasks/TASK-20260905-28c89d/category_and_licensing_analysis.yaml.
        Two sentences in the decision close the interval question without
        touching a clause.
      entailment_honesty: >-
        PARTLY ENTAILED BY THE DRAFT'S OWN CONFESSION. reviewer_notes[1] already
        says enacting without the companion "leaves the contract with no
        conforming implementation". What I add is the predicate analysis - that
        the licence's condition is not merely unmet but currently unproducible,
        and that clause_3's prohibition has no stated subject and so reaches
        beyond implementations. Reading the draft's confession back would have
        been a bibliography; this is the part it does not say.
      twin_survival: >-
