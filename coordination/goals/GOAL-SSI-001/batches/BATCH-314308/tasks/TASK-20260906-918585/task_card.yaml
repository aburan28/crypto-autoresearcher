  why_your_working_record_is_a_declared_artifact: >-
    CF-24, adapted to a round whose product is an ARGUMENT rather than a computation. The
    previous rounds' mechanical results were re-checkable because two scripts were
    committed; almost nothing here has an exit code. independent_act_check.md is your
    substitute: per act-finding, the key path you opened, the words you found there and your
    verdict, plus your own inert-object and twin-object results as you produced them. A
    successor can then re-check every J2 conclusion against committed bytes WITHOUT re-running
    anything. IT IS WEAKER THAN A RE-RUNNABLE SCRIPT AND YOU MUST SAY SO.

  budget:
    wall_clock_seconds: 5400
    memory_gb: 2
    maximum_runs: 4
  budget_note: >-
    maximum_runs bounds executions of experiment code, producer implementations and anything
    that writes a run record. Your own scratch scripts, and re-running a committed control
    unmodified, are NOT runs (DEC-20260904-166ab5 PD-4). THIS BATCH AUTHORIZES ZERO NEW
    EXPERIMENT RUNS. AN EXHAUSTED BUDGET, A TIMEOUT OR A CRASH IS AN OPERATIONAL OBSERVATION
    AND IS NEVER NEGATIVE MATHEMATICAL EVIDENCE. Report the exhaustion and stop.
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  report_shape_requirement: >-
    Your report is a .yaml file with a TOP-LEVEL `review_attestation` mapping carrying
    task_id, joints_owned (the four names verbatim), sources_read, read_sibling_reports,
    blind_from_respected and verdict, parseable in full by yaml.safe_load.
    `blind_from_respected` is true because this plan declares no blind_from list. `verdict`
    is one of holds, breaks, inconclusive, ON YOUR JOINTS ONLY - you do not return a
    whole-claim verdict on enactability and the Coordinator composes.
  completion_gate_ref: >-
    dispatch_queue.json tasks[TASK-20260906-918585].handoff.completion_gate is the
    authoritative gate list and is not duplicated here.
  return_format: >-
    A short report naming the four joint verdicts; how many of the pass's findings are act
    findings and whether any axis is uncovered; whether you produced your own inert-object
    and twin-object results before opening the producer's file, and what they were; your
