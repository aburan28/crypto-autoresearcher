task_card:
  id: TASK-20260906-918585
  goal_id: GOAL-SSI-001
  batch_id: BATCH-314308
  title: >-
    Independent review of the red team pass: did it attack the ACT rather than the
    integrity, is every finding anchored in the redraft's own bytes, is its finding
    set entailed by its own construction, and did it settle anything reserved to the
    enacting decision.
  role: validator
  state: queued
  review_required: false
  archived_by: TASK-20260906-8f3ee7
  depends_on:
    - TASK-20260906-dc4905
    - TASK-20260906-51fec3
  review_plan_ref: coordination/goals/GOAL-SSI-001/batches/BATCH-314308/review_plan.yaml
  joints_owned:
    - J1 whether the pass attacked the redraft AS A PROPOSED ACT rather than re-attacking its integrity
    - J2 whether every act-finding is anchored in the redraft's own bytes at a named key path, and whether the pass overstates or understates
    - J3 whether the pass's finding set is entailed by its own construction, its prompt, or the campaign record
    - J4 whether the pass stayed inside what it may not do, and settled nothing reserved to the enacting decision
  joints_owned_note: >-
    COPY THESE FOUR NAMES VERBATIM into your report's review_attestation.joints_owned.
    tools/check_review_independence.py matches them by string against review_plan.yaml,
    and a paraphrase reads to the tool as an unowned joint.

  why_a_validator_and_what_that_means_you_are_not: >-
    You are the Validator - integrity, controls, stated claims - because the question
    about the pass is whether it CLAIMS WHAT ITS EVIDENCE SUPPORTS. You are NOT a second
    red team and you are not being asked for a second opinion about the amendment; a red
    team attacking a red team returns opinions about opinions. What is wanted is whether
    each act-finding is anchored in the redraft's own bytes and whether the pass's
    finding set is entailed by its own construction. THE COST, STATED SO YOU KNOW IT:
    nobody adversarially attacks THIS REVIEW, and it is bounded only by the review's own
    inability to change any status.

  the_attested_ordering_and_it_is_not_a_blind_phase: >-
    BINDING, FOR J3. BEFORE opening
    tasks/TASK-20260906-dc4905/entailed_control_objects.yaml, apply the pass's OWN STATED
    PROCEDURE - as its report describes it - UNCHANGED, to THE INERT OBJECT
    (BATCH-60d6b9/tasks/TASK-20260906-0fbf69/run_provenance_attestation.yaml) and to THE
    TWIN OBJECT (BATCH-752ef2/tasks/TASK-20260905-28c89d/protocol_amendment_draft.yaml),
    and record what YOU got in independent_act_check.md. Then open the producer's file and
    say where yours differs. Record that you did it in that order, or record honestly that
    you did not. NOTHING IS FORBIDDEN TO YOU AT ANY TIME: this batch declares no blind
    phase, nothing is protected, and `blind_rederivation.required` is false with its
    reason recorded in the plan. This is an ATTESTATION, not a tool result, and it is
    recorded as weaker.

  the_object_i_most_want_run: >-
    THE INERT OBJECT, THROUGH THE PASS'S OWN PROCEDURE. It proposes no act, binds nobody,
    amends nothing. "This record would bind a party, foreclose an option, or mislead a
    reader of a green control about an amendment" IS KNOWN FALSE FOR IT. If the procedure
    returns act-findings of the same class and severity there, THE PASS'S FINDINGS ARE
    PRODUCTS OF THE PROCEDURE AND NOT OF THE REDRAFT - and that is the most valuable
    result available in this round. A FINDING THERE IS A BREAK and is reported as one,
    never as thoroughness. If the producer anticipated it and separated class findings
    from instance findings by itself, SAY SO PLAINLY: that overturns the Coordinator's
    recorded prior and is a better outcome than confirming it.

  the_five_proves_too_much_objects_are_yours: >-
    Run all five, including the POSITIVE CONTROL, and report what the procedure ACTUALLY
    DID on each rather than what it should have done: the inert object; the twin object;
    the known-false attribution object (the proposition that the redraft resolves RT-6,
    RT-9(a) or RT-12, which is known false on committed evidence); the green-control
    reader object; and the redraft itself. A procedure that returns nothing on every
    object has rejected the decoys for no reason and its silence is NOT evidence that
    enactment is safe. Full statement and failure signature: review_plan.yaml
    proves_too_much.

  the_understatement_half_that_people_skip: >-
    AT J2, FIND AT LEAST ONE ACT THE REDRAFT'S TEXT PLAINLY EFFECTS THAT THE PASS DID NOT
    REPORT, or state that you looked and found none and say exactly where you looked. Read
    clause_3 and clause_4 in full - they are the clauses that impose requirements on
    IMPLEMENTATIONS - and read amendment.blast_radius, amendment.what_this_changes and
    amendment.scope against them. An overstatement check alone would let a pass pass by
    being cautious.

  a_clean_review_is_a_full_result: >-
    CONTRACTED IN ADVANCE. If the pass attacked the act, anchored every finding, ran every
    object, and stayed inside its prohibitions, then this round has produced a complete and
    valuable result and it will be recorded as one. STRAINING TO BREAK SOMETHING TO JUSTIFY
    THE PASS IS A NAMED FAILURE MODE OF THIS BATCH - manufactured objections consume the
    enacting decision's attention and teach later readers to discount review findings
    generally. What is required is not a break; it is a recorded, specific, checkable
    SEARCH per joint.

  blindness_is_lifted_for_you_and_here_is_what_it_costs: >-
    You are GIVEN, and must read, BATCH-79a0cb's red-team report, BATCH-60d6b9's validation
    report and the producer's package, because J1 and J3 require you to classify findings
    against numbered records. Set `read_sibling_reports: true` HONESTLY. THE COST: your
    agreement with any RT-, F- or V-number is NOT independent of those reports. Reproduce
    each yourself before agreeing, and record PER JOINT what you did NOT accept from what
    you were given. If your round consists entirely of re-confirming existing numbers, SAY
    SO - that is a signal about this round's independence and must be recorded as one
    rather than read as corroboration.

  what_you_must_not_do:
    - DO NOT FIX ANYTHING. The producer package is the object under review and is committed; repairing it destroys the evidence. Name the defect, give the smaller repair, and leave it.
    - DO NOT EDIT, ANNOTATE OR MARK the redraft or any artifact of BATCH-60d6b9, BATCH-79a0cb or BATCH-752ef2. All are immutable.
    - DO NOT EDIT experiments/EXP-WESOVOW-001/specification.yaml and never write an amended copy of it anywhere inside the repository.
    - DO NOT EXECUTE cost_model.py, with or without WESOVOW_RAW_PATH set (CF-10). Reading it as text is permitted with disclosure. Set PYTHONDONTWRITEBYTECODE=1 and sys.dont_write_bytecode before importing anything from a snapshot-bound directory.
    - DO NOT MODIFY the two committed scripts; you may run them unmodified and running them is not a run.
    - DO NOT RESTATE any PAPER_PAIRS value, delta, crossover, margin, sign or speedup. Name them by locator.
    - DO NOT ASSERT that a committed immutable record is wrong; name the defect and leave the claim UN-PROMOTED (IMP-1).
    - DO NOT change a status, write a ledger record, approve anything, enact anything or commit anything.
    - Never select a provider, backend, endpoint, or model identifier containing Bedrock, case-insensitively.

  the_stop_condition: >-
    IF YOU CONCLUDE THE UNDERLYING DEFECT DOES NOT REPRODUCE - that specification.yaml:39-40
    and control C4 are not jointly unsatisfiable off the degenerate slice, or that the two
    blocks are not in one scope - record it precisely and in full and STOP INVESTIGATING IT.
    That object contradicts EV-SSI-2aaf6f at strength `replicated` and requires
    review-breakthrough at `max`, which is `degradable: false` and which this environment
    cannot serve (IMP-1). The round HALTS on that object, the claim stays un-promoted,
    GOAL-SSI-001 stays `active`, and the Coordinator decides what else the round can record.
    IT IS THE MOST CONSEQUENTIAL THING YOU COULD FIND, it must not be softened, and the stop
    condition must not discourage you from finding it.

  model_independence: >-
    THIS ROUND IS SESSION-INDEPENDENT AND NOT MODEL-INDEPENDENT, declared in advance rather
    than claimed and withdrawn. Only the `local` backend resolves here (IMP-1), and every
    agent of this batch - the producer, both archives and you - is a subagent of one
    orchestrating session. State this in your limitations. Your agreement with the producer
    may NEVER be presented as agreement between distinct models.

  citation_prohibition_verbatim: >-
    The `P=512` crossover value and its `w=2^80` sign are **NOT citation-eligible**. This
    task does not lift that prohibition. Only a committed Coordinator decision on
    independently reviewed evidence can lift it.
  citation_prohibition_predicate_extension_verbatim: >-
    In addition to the retained sentence, a row of any EXP-WESOVOW-001 reconciliation is NOT
    citation-eligible when either (a) the two anchors disagree in the SIGN of the baseline
    comparison at that row, or (b) the smaller |margin| across the two anchors at that row
    is below that field size's anchor gap |Delta log2 T_full + Delta log2 M / 2|.
  citation_prohibition_application: >-
    Restate both limbs verbatim and state whether either fired on the package and on your
    own report. THIS IS THE SIXTH CONSECUTIVE ROUND IN WHICH THE LIFT IS AVAILABLE AND NO
    TASK OF THIS BATCH MAY LIFT IT. If a check would require computing a corrected crossover
    or a baseline-comparison sign, the correct output is THE STATEMENT that it would, never
    the value - RT-2's antecedent `A > 0` IS the governed sign, which is how the prohibition
    bit on the previous round's own method. You may RECOMMEND; a recommendation is not a
    decision.

