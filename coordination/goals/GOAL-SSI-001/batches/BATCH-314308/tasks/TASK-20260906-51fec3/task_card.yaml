# THE SNAPSHOT ARCHIVE FOR BATCH-314308 - THE TASK BATCH-60d6b9 COULD NOT AFFORD.
#
# AGENTS.md and agents/coordinator.md require a producer's exact artifacts to be
# committed by an ISOLATED ARCHIVAL TASK before an independent agent reviews them.
# BATCH-60d6b9 had four identifiers, could not express the five-task chain, and
# carried the substance in a dispatch_precondition executed by the dispatching
# session - a commit with no card, no budget, no completion gate and NO DISPATCHER
# POST-COMMIT VERIFIER PASS (DEC-20260906-408595 PD-1). Its compensating six-hash
# gate was then never run, because the composing task held no shell (PD-2), so the
# deviation was SPENT WITHOUT THE MITIGATION BEING BOUGHT. THIS CARD EXISTS SO THAT
# CANNOT RECUR.
#
# RUN ALONE. Nothing else in this batch may be running.
#
# WHERE THIS CARD AND dispatch_queue.json OVERLAP, THE QUEUE'S handoff BLOCK GOVERNS.
task_card:
  id: TASK-20260906-51fec3
  goal_id: GOAL-SSI-001
  batch_id: BATCH-314308
  title: >-
    Coordinator snapshot archive: commit exactly the red team package, alone, before
    any reviewer sees it, bound by content and by a real reachable commit.
  role: coordinator
  state: queued
  review_required: false
  archived_by: TASK-20260906-51fec3
  depends_on:
    - TASK-20260906-dc4905

  if_you_hold_no_shell_you_cannot_do_this_task: >-
    STATED FIRST BECAUSE IT IS THE MOST LIKELY WAY THIS CARD FAILS. A coordinator
    subagent has NO SHELL on this runtime - recorded by DEC-20260906-408595 PD-2 and
    PD-3, by EV-SSI-804e09 OBS-16, and broadcast by this campaign's own session at
    coordination/bus/messages/MSG-20260906-dc0f1e.yaml note 2. IF YOU CANNOT RUN
    `git`, `sha256sum` OR THEIR EQUIVALENTS, YOU CANNOT PERFORM THIS TASK AND MUST NOT
    PRETEND TO: record every gate as OUTSTANDING with that exact reason, invent no sha,
    no hash, no exit code and no command output, and return the task to the dispatching
    session, which executes the commit and the gates under batch.yaml
    archive_execution_ruling. THAT IS A DECLARED DESIGN, NOT A FAILURE - what is a
    failure is describing a gate you did not run as done.

  the_producer_output_set_check_is_a_gate_and_comes_first: >-
    Before anything is staged: exactly the THREE declared artifacts of
    TASK-20260906-dc4905 exist at their exact declared paths; nothing else was written
    anywhere in the repository; nothing under experiments/, inputs/, BATCH-752ef2/,
    BATCH-79a0cb/ or BATCH-60d6b9/ was modified; and no __pycache__ was left inside a
    snapshot-bound directory. A SHORTFALL OR AN EXCESS IS A STOP that returns the batch
    to the Coordinator - not a note, and never repaired by writing the missing file
    yourself. Record the exact commands and their verbatim output.

  what_you_commit:
    count: 4
    paths:
      - coordination/goals/GOAL-SSI-001/batches/BATCH-314308/tasks/TASK-20260906-dc4905/act_analysis_red_team_report.yaml
      - coordination/goals/GOAL-SSI-001/batches/BATCH-314308/tasks/TASK-20260906-dc4905/entailed_control_objects.yaml
      - coordination/goals/GOAL-SSI-001/batches/BATCH-314308/tasks/TASK-20260906-dc4905/runtime_session_receipt.yaml
      - coordination/goals/GOAL-SSI-001/batches/BATCH-314308/archives/TASK-20260906-51fec3/snapshot_commit_receipt.json
    binding_mode: commit
    binding_mode_reason: >-
      `commit`, DELIBERATELY, AND NOT INFERRED FROM A FAILED SCOPE CHECK. Every path
      above is uncommitted when you run, so ONE exact changed-path commit CAN express
      custody of the whole set - the stronger binding. `content_first` exists for source
      packages committed before their archive task ran, which is not this situation.
    staging_rule: >-
      Stage ONLY these four, by exact pathspec. `git add -A` is forbidden. The commit
      must change EXACTLY these four paths and archive.path_sha256 must cover all four.

  the_commit_message_rule: >-
    RECORD IDENTIFIERS AND LOCATORS ONLY - BATCH-314308, GOAL-SSI-001,
    TASK-20260906-dc4905, TASK-20260906-51fec3, and the four paths. NO VERDICT TOKEN, NO
    FINDING, NO SEVERITY, NO COUNT OF FINDINGS, NO CHARACTERIZATION OF THE PASS'S
    OUTCOME. A commit message cannot be reverted (CORR-20260905-547849), and a message
    that leaks the pass's outcome reaches the reviewer through a channel nobody declared.

  you_are_custody_not_composition: >-
    DO NOT READ THE PRODUCER'S FINDINGS FOR CONTENT AND DO NOT SUMMARISE THEM ANYWHERE -
    not in the receipt, not in the commit message, not in a return message. Reading a
    file to hash it is not reading it for content. IF YOU DO READ FOR CONTENT, SAY SO IN
    THE RECEIPT: you sit between the producer and the reviewer and you are a channel.
    DO NOT REPAIR ANYTHING THE PRODUCER WROTE; if an artifact is malformed, record it
    exactly and stop.

  compute_never_reconstruct: >-
    Compute the sha256 of each of the four paths and record it as COMPUTED. Take the
    commit sha and its parent from a named git command. NEVER RECONSTRUCT, ESTIMATE OR
    GUESS a sha, a parent or a hash; if a value was read rather than computed, label it
    as read and say where from. This is CF-17's rule applied to custody: bind to a
    checksum, never to the existence of a file at a path.

  sync_and_publish:
    fetch_and_merge: >-
      Fetch origin/main and MERGE it - never rebase - before committing. Record the base
      commit checked and the merge outcome in the receipt. A sync conflict inside an
      immutable record is resolved by a superseding record under a new identifier, never
      by picking a side, and never by editing the record.
    push_and_pr: >-
      Push the branch and open or refresh the PR against main naming BATCH-314308 and
      TASK-20260906-dc4905. A package that exists only in a local commit is UNPUBLISHED
      and is not durable evidence, and TASK-20260906-918585 may not be dispatched against
      unpublished bytes.

  launching_prompt_disclosure_you_must_record: >-
    CF-15, second limb. Record what the dispatching session told TASK-20260906-dc4905 at
    launch - the substance, and VERBATIM anything it said about an expected outcome, a
    preferred verdict, a known finding or a suspected defect. RECORD EXPLICITLY WHETHER
    THE WITHHELD coordinator_prior WAS SPOKEN ALOUD, which batch.yaml forbids: the plan
    is outside the producer's read scope by design and speaking it would repair the
    separation away.

  what_you_must_not_do:
    - DO NOT change a status, write a ledger record, approve anything or enact anything.
    - DO NOT touch any frozen or immutable artifact, and do not execute cost_model.py.
    - DO NOT stage anything outside the four declared paths, and do not use `git add -A`.
    - DO NOT report a gate as passed that you did not run, and do not invent a sha, hash, exit code or output.
    - Never select a provider, backend, endpoint, or model identifier containing Bedrock, case-insensitively.

  citation_prohibition_verbatim: >-
    The `P=512` crossover value and its `w=2^80` sign are **NOT citation-eligible**.
    This task does not lift that prohibition. Only a committed Coordinator decision on
    independently reviewed evidence can lift it.
  citation_prohibition_predicate_extension_verbatim: >-
    In addition to the retained sentence, a row of any EXP-WESOVOW-001 reconciliation is
    NOT citation-eligible when either (a) the two anchors disagree in the SIGN of the
    baseline comparison at that row, or (b) the smaller |margin| across the two anchors
    at that row is below that field size's anchor gap |Delta log2 T_full + Delta log2 M
    / 2|.
  citation_prohibition_application: >-
    Restate both limbs verbatim in the receipt, lift neither, and state whether either
    fired on anything you wrote. Neither should: a custody receipt names paths, hashes
    and commits, and no crossover value, baseline-comparison sign, margin or speedup
    belongs in one.

  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-314308/archives/TASK-20260906-51fec3/snapshot_commit_receipt.json
  write_scope:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-314308/archives/TASK-20260906-51fec3
  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 1
  budget_note: >-
    maximum_runs bounds executions of experiment code, producer implementations and
    anything that writes a run record; git commands and hashing are not runs. THIS BATCH
    AUTHORIZES ZERO NEW EXPERIMENT RUNS. AN EXHAUSTED BUDGET IS AN OPERATIONAL
    OBSERVATION AND IS NEVER NEGATIVE MATHEMATICAL EVIDENCE.
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  completion_gate_ref: >-
    dispatch_queue.json tasks[TASK-20260906-51fec3].handoff.completion_gate is the
    authoritative gate list and is not duplicated here.
  return_format: >-
    The commit sha and its parent; the four computed digests; the exact pathspec staged;
    the producer output-set verification result; the fetch/merge base and outcome; the
    push and PR result; the producer's launching-prompt disclosure including whether the
    withheld prior was spoken; and an explicit list of every gate you RAN with its exit
    code and every gate you recorded OUTSTANDING with its reason. Do not characterize the
    pass's findings.
  recorded_by: coordinator
  recorded_at: '2026-09-06'
