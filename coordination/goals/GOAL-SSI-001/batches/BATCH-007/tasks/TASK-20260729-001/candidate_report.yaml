candidate:
  id: IDEA-20260729-001
  title: >-
    CSIDH-COLLIMATION-FC0 typed resource-vector gate for the binary
    collimation sieve
  class: control
  target_problem: >-
    Concrete quantum cost of CSIDH vectorization through an abelian
    hidden-shift collimation sieve, with the complete uniform-superposition
    class-group-action oracle, query count, QRACM, coherent width, circuit
    work, classical work, and failure probability kept explicit.
  target_open_problem: KN-OPEN-014
  claim: >-
    For a fixed CSIDH instance and the final Peikert binary collimation-sieve
    row, a zero-curve-compute source-reconciliation gate can decide whether a
    complete query/memory/circuit resource vector is instantiable without
    borrowing a distribution-specific action cost or silently omitting
    preprocessing, retries, memory, tail search, or error composition. A
    numerical security comparison is admissible only if every required field
    is filled under CSIDH-COLLIMATION-FC0.
  mechanism: >-
    Freeze the instance, binary c-sieve revision and parameters, complete
    labeled-state query unit, nine-lookup QRACM formula, sequential schedule,
    logical Clifford+T metrics, and additive full-cost equation before
    selecting a numerical point. Decompose each complete hidden-shift oracle
    into uniform group preparation, coherent action, canonicalization,
    label/QFT work, failure handling, and uncomputation. This exposes whether
    the concrete-estimate spread is reconcilable accounting or an unresolved
    uniform-oracle circuit boundary.
  novelty_status: adaptation
  question_id: RQ-SSI-001
  source_refs:
    - KN-OPEN-014
    - KN-TECH-027
    - KN-LIT-069
    - KN-LIT-071
    - DEC-20260725-007
    - https://eprint.iacr.org/2019/725
    - https://eprint.iacr.org/2018/537
    - https://eprint.iacr.org/2018/1059
  assumptions:
    - >-
      The target is CSIDH vectorization in a free, transitive class-group
      action with no SIDH-style torsion images.
    - >-
      The numerical instance fixes p, O, G = Cl(O), N, invariant-factor or
      cyclic decomposition, public curves, ideal basis, relation lattice, and
      encodings from one cited parameter-data revision.
    - >-
      The hidden-shift algorithm is the binary r = 2 collimation sieve in the
      final 2020-02-23 Peikert ePrint 2019/725, with alpha = 1/2, S = L,
      punctured regularization, L_tilde_max = 8L, nine-lookups QRACM, and a
      56-bit separately charged classical tail.
    - >-
      Canonical scheduling is sequential with P_oracle = 1. Parallel schedules
      are separate rows that must charge multiplicative width and report
      depth.
    - >-
      A complete U_HS query includes uniform group-superposition preparation,
      both public branches as required, coherent action, canonicalization,
      label production, failure handling, inverse work, and uncomputation.
    - >-
      A bounded secret-key-distribution action cost is not a uniform
      group-superposition action cost unless a cited coherent conversion is
      charged.
    - >-
      Logical T-count, T-depth, coherent logical qubits, QRACM bits, classical
      time, and classical memory remain separate resources; no physical-cost
      scalar is inferred without a named fault-tolerant architecture.
    - >-
      All source-level probabilities and simulator point estimates remain
      reported assumptions until independently derived under the frozen row.
  predictions:
    - metric: untyped_required_fields
      direction: lower
      minimum_effect: >-
        The derivation must reduce this count to exactly zero across query
        success semantics, a_act, T_action_uniform, W_U_HS, preprocessing,
        postprocessing, tail, and error composition; any positive count blocks
        a later numeric-security row.
    - metric: oracle_T_fraction
      direction: higher
      minimum_effect: >-
        Conditional on a cited uniform-action circuit near the optimistic
        source estimate, Q_HS * T_U_HS must exceed T_sieve for the frozen
        CSIDH-512 row. A fraction at or below 1/2 falsifies oracle dominance
        under this convention.
    - metric: uncharged_distribution_conversions
      direction: lower
      minimum_effect: >-
        Directly substituting the BLMP bounded-secret-distribution action count
        must leave at least one conversion unresolved unless the gate cites and
        charges a reversible uniform-group-to-short-vector map; the admitted
        row requires exactly zero unresolved conversions.
  minimal_test:
    design: >-
      Perform one literature/derivation worksheet with zero curve computation.
      Transcribe the final Peikert CSIDH-512 c-sieve row and Equations (3.5)
      and (4.1), including success and retry semantics; expand one complete
      U_HS and map every term to the final BLMP circuit or mark it unresolved;
      use final Bonnetain-Schrottenloher as an independent convention
      cross-check without mixing constants. Fill the complete typed vector and
      error budget without assigning a security level.
    controls:
      - >-
        Distribution-mismatch control: replace uniform action by the
        bounded-secret-distribution action and require the worksheet to flag
        the missing coherent map.
      - >-
        Memory-type control: present the same QRACM exponent as ordinary
        logical qubits and require rejection as a unit/type error.
      - >-
        Revision control: combine a superseded hidden-shift query row with a
        revised oracle circuit and require rejection unless compatibility is
        explicitly derived.
      - >-
        Amortization control: set K greater than 1 without declaring a target
        population and require reversion to K = 1.
    required_metrics:
      - Q_HS_complete_oracle_calls
      - M_QRACM_peak_bits
      - W_logical_peak_qubits
      - T_full
      - T_depth
      - Clifford_count
      - C_classical
      - M_classical
      - epsilon_total
      - untyped_required_fields
      - uncharged_distribution_conversions
  falsification_conditions:
    - >-
      Any required resource can be instantiated only by changing the frozen
      algorithm revision, query unit, action-input distribution, memory type,
      success target, or amortization count.
    - >-
      Query and memory values cannot be reconciled with one declared
      simulator/table row and success/retry convention.
    - >-
      The complete uniform-superposition U_HS cost or coherent width remains
      unresolved after the source mapping; this blocks admission to a later
      numerical gate, though it does not refute hidden-shift cryptanalysis.
    - >-
      A numeric security or parameter-sizing conclusion is drawn from
      T-count alone while QRACM, width, depth, classical resources, or error
      composition is missing.
    - >-
      The route imports SIDH torsion images or reopens
      IDEA-20260725-001, IDEA-20260725-002, or IDEA-20260725-003.
  confounders:
    - >-
      Peikert's c-sieve query values are model/simulator estimates and depend
      on punctured-regularization success, discard behavior, and postprocessing
      assumptions.
    - >-
      Peikert's optimistic full-attack T column assumes a uniform action cost
      near a favorable action-distribution estimate; this is the tested
      boundary, not a granted fact.
    - >-
      QRACM/QROM hardware, routing, fault correction, and magic-state factory
      costs are architecture-dependent and are outside the logical FC0 row.
    - >-
      Exact class-group decomposition and relation-lattice preprocessing may
      differ by parameter set and paper revision.
    - >-
      A union-bound error budget may be loose; any stronger composition must
      be cited and frozen rather than assumed.
  interpretation_limits:
    - >-
      Novelty-screen admission only; not an experiment, new quantum algorithm,
      CSIDH break, security-bit estimate, parameter recommendation, or
      GOAL-SSI-001 completion claim.
    - >-
      The CSIDH-512 query/memory anchor is reported literature context, not
      newly verified evidence and not a full-cost estimate.
    - >-
      Negative output closes only the ability to form a numeric row under this
      frozen convention; it does not declare CSIDH secure or hidden-shift
      attacks inapplicable.
    - >-
      No claim transfers to CGL/SQIsign path-finding, SIDH/SIKE, other
      class-group-action parameter sets, or a physical quantum architecture.
    - >-
      Same-lineage fallback requires independent review of formulas, units,
      source revisions, and the oracle distribution boundary.
  estimated_cost:
    implementation: low
    compute: low
    derivation_wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 0
  recommended_priority: high
  ranking_rationale: >-
    This is the single candidate to test first because it addresses the exact
    residual named by KN-OPEN-014 and DEC-20260725-007, while its cheapest
    valid discriminator is a bounded source-reconciliation worksheet requiring
    no curve, isogeny, or circuit execution. It has high information gain:
    success admits one typed later numeric review, while failure localizes the
    residual to either uniform-oracle circuit cost or query/memory semantics
    without inventing a constant or reopening any closed lane.

  frozen_cost_convention:
    name: CSIDH-COLLIMATION-FC0
    version: 0
    scope: >-
      Logical-resource accounting for one fixed CSIDH instance attacked by the
      final Peikert binary collimation sieve; no physical architecture and no
      security-level scalarization.
    instance_tuple:
      - p
      - imaginary_quadratic_order_O
      - class_group_G
      - group_order_N
      - group_decomposition
      - public_curves_E0_E1
      - ideal_generator_basis
      - relation_lattice
      - canonical_encodings
      - parameter_data_revision
    algorithm_pin:
      source: IACR-ePrint-2019-725-final-2020-02-23
      algorithm: binary_collimation_sieve
      r: 2
      alpha: 0.5
      S_equals_L: true
      punctured_regularization: true
      L_tilde_max_factor: 8
      qracm_variant: nine_lookup_minimum_QRACM
      secret_tail_bits: 56
      oracle_parallelism: 1
      default_amortization_targets_K: 1
    reported_anchor_not_adopted_as_security_claim:
      parameter: CSIDH-512
      log2_group_order: 257.1
      log2_L: 31.3
      sieve_depth: 8
      log2_Q_model: 15.7
      log2_QRACM_bits: 40
      source: Peikert-2019-725-Figure-1
      limitation: >-
        Query/memory anchor only. The reported T column assumes an oracle-cost
        bridge that FC0 requires the next derivation to justify.
    query_convention:
      unit: complete_labeled_state_oracle_U_HS
      includes:
        - uniform_group_superposition_preparation
        - coherent_E0_E1_branching
        - coherent_class_group_action
        - canonical_output_encoding
        - label_and_QFT_work
        - failure_handling
        - inverse_calls_and_uncomputation
      named_parameters:
        Q_model: >-
          Total modeled U_HS calls for the frozen sieve row before explicit
          success amplification.
        rho_run: Cited useful-output probability for one complete run.
        epsilon_target: Declared total attack failure target.
        R_success: >-
          ceil(log(epsilon_target) / log(1 - rho_run)) when independent
          repetition is the cited amplification rule.
      equation: Q_HS = R_success * Q_model
    memory_convention:
      qracm_peak_equation: >-
        max_v L_tilde_max_v * ceil(max(1.5 * log2(S0_v / S_v),
        log2(L_tilde_max_v))) reusable QRACM bits
      coherent_width_equation: >-
        W_logical = max(W_U_HS, W_collimation, W_postprocessing, W_tail)
        under P_oracle = 1, including all live registers and ancillae
      qrom_lookup_constants:
        lookups_per_collimation: 9
        T_gates_per_lookup_per_indexable_cell: 4
        ancillary_qubits_per_lookup: ceil(log2(L_tilde_max))
      separation_rule: >-
        QRACM bits, coherent logical qubits, and classical storage are distinct
        typed resources.
    circuit_convention:
      gate_set: logical_Clifford_plus_T
      primary_metrics:
        - T_count
        - T_depth
        - logical_qubit_width
        - Clifford_count
      U_HS_equation: >-
        T_U_HS = a_act * T_action_uniform + T_group_prep + T_branch +
        T_canonicalization + T_label_QFT + T_failure + T_uncompute
      sieve_T_equation: >-
        T_sieve = 36 * L_tilde * (2 / (1 - delta))^d
      sieve_constants:
        delta: 0.02
        provenance: Peikert-2019-725-Equation-4.1-comparison-point
      full_T_equation: >-
        T_full = T_quantum_preprocessing / K + Q_HS * T_U_HS + T_sieve +
        T_postprocessing + T_tail
      preprocessing_separation: >-
        T_quantum_preprocessing enters T_full; classical preprocessing time
        and storage enter C_classical and M_classical separately.
      error_equation: >-
        epsilon_total <= Q_HS * epsilon_U_HS + epsilon_sieve +
        epsilon_postprocessing + epsilon_tail
      unresolved_named_constant_parameters:
        - a_act
        - T_action_uniform
        - W_U_HS
        - T_group_prep
        - T_branch
        - T_canonicalization
        - T_label_QFT
        - T_failure
        - T_uncompute
        - rho_run
        - epsilon_U_HS
        - Clifford_count
        - T_depth
        - classical_preprocessing_and_tail_costs
      numeric_claim_rule: >-
        No security-bit, NIST-level, or parameter-sizing number until every
        unresolved named parameter is cited and instantiated under one
        compatible instance/algorithm/circuit row.
    resource_vector:
      - Q_HS
      - M_QRACM
      - W_logical
      - T_full
      - T_depth
      - Clifford_count
      - C_classical
      - M_classical
      - epsilon_total

  full_cost_boundary:
    charged:
      - complete_U_HS_queries_and_retries
      - uniform_group_preparation_and_short_vector_conversion
      - coherent_action_inverse_work_and_uncomputation
      - canonicalization_label_and_QFT_work
      - QRACM_storage_and_QROM_lookup_T_count
      - coherent_width_T_count_T_depth_and_Clifford_count
      - class_group_and_relation_lattice_preprocessing
      - classical_sieve_work_and_storage
      - postprocessing_and_56_bit_tail
      - failure_probability_and_amplification
    requires_separate_architecture:
      - physical_qubits
      - error_correction
      - routing
      - magic_state_factories
      - wall_clock_time
      - energy
    forbidden_free_resources:
      - QRACM
      - class_group_or_relation_lattice_data
      - uniform_to_short_vector_coherent_map
      - oracle_uncomputation
      - preprocessing_amortization_without_declared_K
      - classical_tail_search

  competing_explanations:
    - id: ACCOUNTING_RECONCILIATION
      meaning: >-
        Final source components instantiate one complete compatible resource
        vector, so a later numerical comparison is meaningful.
      decisive_outcome: FC0_PIN_COMPLETE_FOR_LATER_NUMERIC_REVIEW
    - id: UNIFORM_ORACLE_BOUNDARY
      meaning: >-
        Query/memory accounting is pinned, but the complete coherent
        uniform-superposition U_HS cannot be costed from the
        distribution-specific circuit source without an uncharged step.
      decisive_outcome: FC0_UNIFORM_ORACLE_BOUNDARY_UNRESOLVED
    - id: QUERY_MEMORY_MISMATCH
      meaning: >-
        The query row, success semantics, QRACM formula, or source revisions
        cannot be reconciled under the frozen algorithm.
      decisive_outcome: FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED

  cheapest_falsification_gate:
    type: derivation
    description: >-
      One zero-compute source-reconciliation worksheet: freeze and transcribe
      the final Peikert CSIDH-512 binary c-sieve row plus Equations (3.5) and
      (4.1); expand one complete U_HS; map each circuit term to final BLMP or
      mark it unresolved; use final Bonnetain-Schrottenloher only as an
      independent convention cross-check; fill the resource vector, provenance,
      and error budget with no security label.
    allowed_outputs:
      - FC0_PIN_COMPLETE_FOR_LATER_NUMERIC_REVIEW
      - FC0_UNIFORM_ORACLE_BOUNDARY_UNRESOLVED
      - FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED
    budget:
      wall_clock_seconds: 1800
      memory_gb: 2
      maximum_runs: 0
    falsifies_if:
      - Any required field needs a mixed revision or changed query unit.
      - Uniform-action cost is replaced by a favorable-distribution action cost without a charged coherent map.
      - QRACM, coherent width, preprocessing, tail, retries, or errors are omitted.
      - A numeric security or completion claim is emitted.
    residual_open_question_if_failed: >-
      What are the concrete reversible T-count, T-depth, coherent width, and
      failure cost of the complete uniform-superposition CSIDH hidden-shift
      oracle U_HS under one exact parameter and class-group-data revision?

  novelty_screen:
    corpus_search:
      knowledge_result: >-
        KN-OPEN-014 / KN-TECH-027 / KN-LIT-069 / KN-LIT-071 record the
        asymptotic hidden-shift attack and contested concrete accounting, but
        do not freeze a complete query unit, QRACM equation, coherent width,
        circuit boundary, or error composition.
      hypothesis_result: >-
        No CSIDH, Kuperberg, hidden-shift, or quantum-cost hypothesis exists in
        ledger/hypotheses.
    web_primary_sources:
      - source: https://eprint.iacr.org/2019/725
        verified_fields: >-
          Final revision metadata; binary c-sieve query/QRACM trade-off;
          nine-lookups Equation (3.5); non-oracle T-count Equation (4.1);
          explicit caveat that uniform-oracle cost remains a question.
      - source: https://eprint.iacr.org/2018/537
        verified_fields: >-
          Final revision metadata; non-asymptotic hidden-shift trade-offs;
          separate accounting for inherent algorithm memory and oracle memory;
          logical Clifford+T convention.
      - source: https://eprint.iacr.org/2018/1059
        verified_fields: >-
          Revised metadata; concrete action-circuit methodology; nonlinear-bit
          to Toffoli/T conversion; favorable input-distribution and memory
          limitations.
    classification: adaptation
    classification_reason: >-
      Every algorithmic and circuit component is known. The candidate's only
      proposed contribution is a program-local typed composition/control gate
      that prevents source, distribution, and unit mismatch. It claims no new
      algorithm, constant, or cryptanalytic result.
    dedup_verdict: >-
      Distinct from closed IDEA-20260725-001 because it does not re-baseline
      classical supersingular path-finding or modify KN-TECH-050; this is the
      separate KN-OPEN-014 quantum convention explicitly named as a possible
      resume lane by DEC-20260725-007. It does not use the orientation residual
      of IDEA-20260725-002 or the SQI-FS-T0 lane of IDEA-20260725-003.

