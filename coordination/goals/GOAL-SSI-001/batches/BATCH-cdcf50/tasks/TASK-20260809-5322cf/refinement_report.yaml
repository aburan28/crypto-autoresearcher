  repairs:
    - id: R1
      issue: incomplete_registered_namespace
      repair: >-
        Added ATTEMPT-SEED-LIST-v5 as registered tag 44 and made its digest an
        explicit BUILDER-REQUEST-v5 input. The finite attempt sample is now an
        ordered seed list, not an implicit PRNG state.
    - id: R2
      issue: advice_target_dependency
      repair: >-
        Removed helper_digest and index_digest from the source-bound advice
        receipt. The pre-target transcript is now an explicit literal-domain
        digest over only p, manifest, advice, generator, source commit, and
        source digest fields.
    - id: R3
      issue: key_domain_and_control_collision
      repair: >-
        Defined exactly four production KEY-DOMAIN-v5 bodies with complete
        field lists. C-pair and synthetic control seeds use separate literal
        control domains and no longer invent production key-domain codes.
    - id: R4
      issue: digest_circularity_and_provider_binding
      repair: >-
        Removed helper blob-id self-reference by defining a domain-tagged
        preimage that excludes both blob identifiers. Provider signatures now
        bind certificate identity, artifact and mirror digests, mirror path,
        transition root, and the trusted public key without recursively signing
        the receipt frame.
    - id: R5
      issue: byte_width_and_builder_residuals
      repair: >-
        Closed the 192-byte target-index record, 183-byte request frame, and
        147+reason terminal formula; corrected the null-record payload grammar,
        registered frame parity, and derived size checks.
    - id: R6
      issue: semantic_helper_certificate_hnf_residuals
      repair: >-
        Bound helper matrices to a named deterministic pair-matrix relation,
        specified transition witness preimages, fixed HNF row/column opcode
        semantics, bounded operation counts, and stated the saturation
        predicate required before output classification.
    - id: R7
      issue: cost_and_memory_residuals
      repair: >-
        Added numeric event-code charge mappings, a materialized seed-list
        requirement, and exact buffer-size formulas with allocation/release
        intervals. No event, buffer, or finite-run metric is measured here.
