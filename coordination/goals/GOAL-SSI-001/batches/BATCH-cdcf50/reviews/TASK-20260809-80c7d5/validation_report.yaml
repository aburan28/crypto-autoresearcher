  verdict: incomplete
  review_verdict: INCOMPLETE_ON_V10_BYTE_RECOMPUTABILITY_AND_ADMISSION_READINESS
  verdict_scope: >-
    Independent static validation of the exact SSI-CANONICAL-v10 design
    snapshot only. The verdict concerns contract completeness and admission
    readiness; it is not a result about SSI, OneEnd, EndRing, SQIsign, CSIDH,
    security, hardness, exponent, novelty, or performance.
  narrowest_supported_statement: >-
    At the path-hash-bound v10 snapshot, the successor makes real additive
    progress over v9: the main fixed widths, finite builder totals, terminal
    precedence, finite seed-list binding, numeric event-code families,
    interval-shaped memory records, provider field coverage, HNF/output
    interfaces, and control admission states are more explicit. It remains a
    design-only and execution-unauthorized contract, not evidence. The
    registry/digest catalog, terminal digest dependency, pair/null frame
    grammar, helper matrix semantics, event schedule/memory encoding,
    provider transition-root preimages, HNF/output semantics, and materialized
    controls remain unresolved; the incumbent gate also remains empty.
  residuals:
    - id: R-V10-ARCHIVE
      severity: provenance_blocking
      finding: >-
        The snapshot receipt has commit_sha:null and pending_post_commit even
        though the queue and reachable commit identify 659a1a... with the
        declared parent. Path hashes pass, but the receipt is not self-bound.
    - id: R-V10-REGISTRY
      severity: byte_recomputability_blocking
      finding: >-
        The registry has no canonical frame/tag/payload grammar or non-null
        registry_digest, and HELPER-SLOT is an unframed/no-digest exception
        under a universal framed-object rule.
    - id: R-V10-DIGESTS
      severity: byte_recomputability_blocking
      finding: >-
        Several embedded and domain digests are raw or underdefined, including
        S_p_digest, owner_set_digest, target_set_digest, transition_root,
        aggregate op-log, pair/null identities, and control seed/target-domain
        digests; the global final-digest rule does not reconcile them.
    - id: R-V10-TERMINAL-CYCLE
      severity: byte_recomputability_blocking
      finding: >-
        stream_digest includes terminal_digest while terminal_digest includes
        stream_digest, so terminal bytes cannot be computed without an explicit
