  metric_recomputations:
    - metric: fixed_frame_width_arithmetic
      status: partial_pass
      result: >-
        The stated arithmetic is internally consistent for the main fixed
        records: HELPER-SLOT is 96 bytes; TARGET-SELECTION-INDEX records are
        192 bytes; BUILDER-REQUEST is 177 payload plus 6 outer bytes = 183;
        ENDPOINT-RECORD is 512; OWNER-RECORD and NULL-OWNER-RECORD are 4096;
        EVENT is 171 payload plus 6 = 177; and terminal bytes are
        147+reason_body_bytes, at most 1171. The derived total inequalities
        are finite. This is only a static arithmetic check, not a serializer
        execution.
      residual: >-
        HELPER-SLOT is registered with no digest but is described without the
        universal version/payload_len header; fixed index records have an
        unspecified record_tag value and no version field. The contract must
        explicitly classify these as fixed subrecords outside the object
        grammar, or give them a complete grammar. The certificate, provider,
        event-trace header, aggregate operation-log, and control-container
        byte formulas are not all independently instantiated.
      references:
        - experiments/EXP-SSI-7b1469/specification.yaml:102-150
        - experiments/EXP-SSI-7b1469/specification.yaml:307-350
        - experiments/EXP-SSI-7b1469/specification.yaml:353-413
        - experiments/EXP-SSI-7b1469/specification.yaml:414-418

    - metric: registered_namespace_and_digest_preimages
      status: incomplete
      result: >-
        Tags 16 through 44 and tag 193 are unique in the manifest, and the
        specification repeats the same namespace. The ordinary final-digest
        rule is stated for registered frames.
      residual: >-
        FRAME-REGISTRY-v5 has no registered tag, version, payload field order,
        or canonical serialized registry frame, yet registry_digest is defined
        as a digest of that missing frame and is null. The digest catalog says
        every digest field is final except registry_digest and blob_digest, but
        v10 also uses raw/domain preimages for source_digest,
        input_transcript_digest, blob_id, control seeds and target identifiers,
        transition_witness_digest, provider signed_message_digest, and the
        branch-null domain. Preimages for S_p_digest, owner_set_digest,
        target_set_digest, transition_root, normalized op-log, aggregate
        op-log, pair_request_digest, and null_mutation_digest are not stated.
        Consequently the namespace is enumerated but not yet a complete
        byte-recomputable digest catalog.
      references:
        - experiments/EXP-SSI-7b1469/specification.yaml:152-196
        - experiments/EXP-SSI-7b1469/inputs/FRAME-REGISTRY-v5.yaml:1-45
        - experiments/EXP-SSI-7b1469/controls/C-PAIR-REF-v5.yaml:9-18
        - experiments/EXP-SSI-7b1469/controls/SYNTHETIC-REF-v5.yaml:9-15

    - metric: advice_quantifier_and_source_binding
      status: partial_pass
      result: >-
        The intended quantifier is explicit as forall p exists fixed A_p forall
        E in V_p. The advice fields are declared target-, instance-, attempt-,
        and selection-free, and the source is required before the target frame.
      residual: >-
        The source algorithm and its exact interpreter are not supplied or
        specified, owner_set_digest has no explicit preimage, and the
        input_transcript_digest is a literal-domain concatenation rather than
        a fully typed v10 frame. No pre-target advice construction receipt or
        source material is present, so the quantifier is a design assertion,
        not an independently replayable witness.
      references:
        - experiments/EXP-SSI-7b1469/specification.yaml:74-91
        - experiments/EXP-SSI-7b1469/specification.yaml:241-283
        - coordination/goals/GOAL-SSI-001/batches/BATCH-cdcf50/tasks/TASK-20260809-5322cf/refinement_report.yaml:17-30

    - metric: helper_index_identity_and_semantics
      status: partial_pass
      result: >-
        V10 improves the v9 contract by defining four KEY-DOMAIN bodies,
        explicit pair/query/restart/null fields, helper-slot pointer fields,
        helper payload cross-checks, a blob range rule, and 192-byte index
        records. The index is required to recheck helper, endpoint, owner,
        pair-key, range, and query identities.
      residual: >-
        The record_tag value/version is not fixed, the helper slot grammar
        conflicts with the universal outer-frame statement, and the named
        SSI-PAIR-MATRIX-v5 deterministic relation and input transcript are not
        defined or materialized. Embedded owner_set, order, blob, normalized
        operation-log, and aggregate identities therefore cannot all be
        independently recomputed from this snapshot.
      references:
        - experiments/EXP-SSI-7b1469/specification.yaml:285-352
        - experiments/EXP-SSI-7b1469/specification.yaml:496-516

    - metric: builder_totals_and_terminal_precedence
      status: partial_pass
      result: >-
        Request, owner, endpoint, null, and terminal widths are explicit; the
        source total includes request, every emitted fixed stride, and the
        terminal. The zero-request and malformed-request ordering and the
        nonzero terminal precedence are stated, including OVERFLOW first and
        COMPLETE last.
      residual: >-
        stream_digest is defined over the terminal frame without
        stream_digest, which still includes terminal_digest, while
        terminal_digest covers the terminal frame including stream_digest.
        Those definitions are mutually circular. In addition, the exact
        record emission schedule and the relation of emitted_count,
        retained_count, and candidate_count to each terminal branch are prose
        only; the terminal reason is bounded but its canonical reason-code
        grammar is absent.
      references:
        - experiments/EXP-SSI-7b1469/specification.yaml:353-413

    - metric: finite_attempt_seed_binding
      status: partial_pass
      result: >-
        The finite ATTEMPT-SEED-LIST-v5 is registered, contains request-bound
        advice/target/request identity, ordered attempt_index/attempt_seed
        pairs, and a final seed_list_digest. The request includes that digest,
        and the restart KEY-DOMAIN includes target, advice, target index,
        attempt index, and attempt seed. Success and exhausted-run semantics
        are explicitly finite.
      residual: >-
        The pair encoding has no separately typed pair frame or uniqueness and
        weighting rule, while the prose also calls the attempt_seed space
        uniform without specifying how a finite declared list establishes that
        distribution. The request binds only the list digest, so the executor
        must still receive and archive the exact list as a separate required
        artifact. This is sufficient to block an implicit PRNG state but not a
        complete finite sampling/probability contract.
      references:
        - experiments/EXP-SSI-7b1469/specification.yaml:469-489
        - experiments/EXP-SSI-7b1469/specification.yaml:353-360
        - experiments/EXP-SSI-7b1469/specification.yaml:642-661

  control_checks:
    - control: numeric_event_charges_and_phase_separation
      status: partial_pass
      evidence: >-
