      references:
        - experiments/EXP-SSI-7b1469/controls/SYNTHETIC-REF-v5.yaml:1-35
        - experiments/EXP-SSI-7b1469/specification.yaml:618-623

    - control: incumbent_gate
      status: passed_as_blocking_gate
      evidence: >-
        The incumbent file hash matches the v10 specification's declared
