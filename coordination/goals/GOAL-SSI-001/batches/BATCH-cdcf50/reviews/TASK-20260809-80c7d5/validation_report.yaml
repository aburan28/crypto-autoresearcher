      residual: >-
        No incumbent measurement, source bytes, or independent verification
        receipt exists, so no break-even, improvement, or freeze claim is
        admissible. The gate is correctly retained and is not a v10 result.
      references:
        - experiments/EXP-SSI-16649a/inputs/INCUMBENT-FOE-v1.yaml:1-45
        - experiments/EXP-SSI-7b1469/specification.yaml:62-70

