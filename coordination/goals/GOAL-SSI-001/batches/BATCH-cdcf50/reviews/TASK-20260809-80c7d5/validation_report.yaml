      references:
        - experiments/EXP-SSI-7b1469/specification.yaml:414-418
        - experiments/EXP-SSI-7b1469/specification.yaml:496-516
        - experiments/EXP-SSI-7b1469/specification.yaml:642-661

    - control: provider_certificate_and_path_binding
      status: blocked_by_pending_trust_and_semantic_residuals
      evidence: >-
        The provider receipt signed-message fields include p, target, advice,
        horizon, edge count, path bytes, artifact and mirror digests,
        transition root, path, provider identity, and public key. The
        certificate requires byte-equal ordered transition and mirror streams,
        path continuity, endpoint selection, and a trusted key before
        acceptance. PROVIDER-TRUST-v5 intentionally has null provider id/key,
        null key digest, no verification command, measured:false, and no
        independent receipt, so INVALID_CERTIFICATE/freeze blocking is correct.
      residual: >-
        artifact_digest, mirror_digest, and transition_root do not each have a
        complete named preimage rule; the trust statement says the trusted key
        digest must equal provider_public_key, which is a digest-to-key type
        mismatch unless an additional SHA-256 relation is supplied. No provider
        receipt, certificate, mirror, or transition stream exists. This is a
        correct pending admission gate, not evidence against the method.
      references:
        - experiments/EXP-SSI-7b1469/specification.yaml:518-562
        - experiments/EXP-SSI-7b1469/inputs/PROVIDER-TRUST-v5.yaml:1-14

    - control: hnf_saturation_and_output_semantics
      status: incomplete
      evidence: >-
        V10 gives opcode numbers, row/column indices, factor indices,
        pre/post matrix digests, chained operation digests, factor-order
        consumption, scalar/non-scalar class labels, and a saturation
        predicate outline.
      residual: >-
        The signed-normalization algorithm, pivot/remainder canonical interval,
        factor-to-matrix relation, aggregate op-log digest preimage, exact
        saturation transition, non-scalar predicate, and witness relation are
        still not machine-checkable. A self-consistent matrix/op-log/output
