      references:
        - experiments/EXP-SSI-7b1469/controls/C-PAIR-REF-v5.yaml:1-32
        - experiments/EXP-SSI-7b1469/specification.yaml:612-617

    - control: synthetic_reference
      status: invalid_control_pending_materialization
      evidence: >-
        SYNTHETIC-REF-v5 fixes eight cells, 16 target rows per cell, rational
