        shared-event boundaries, final-mask semantics, and changed path bytes
        are consequently not replayable. No pair was materialized.
      references:
        - experiments/EXP-SSI-7b1469/specification.yaml:593-611
        - experiments/EXP-SSI-7b1469/inputs/FRAME-REGISTRY-v5.yaml:29-35

    - control: c_pair_reference
      status: invalid_control_pending_materialization
      evidence: >-
        C-PAIR-REF-v5 improves the predecessor with 32 ordered framed row
