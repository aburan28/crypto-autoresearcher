        final cell-frame digest rule.
      residual: >-
        measured_cells_present:false and independent_verification_receipt:null;
        no target rows or cell_table_digest exist. target_set_digest and the
        per-target row frame/preimage are unspecified, while cell and target
        seed identifiers use literal domain concatenations. The control cannot
        be admitted or supply evidence until materialized and independently
