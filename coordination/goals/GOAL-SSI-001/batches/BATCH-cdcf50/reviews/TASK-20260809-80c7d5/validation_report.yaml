      residual: >-
        measured_rows_present:false and independent_verification_receipt:null;
        there are no row bytes or finite_table_digest. The literal seed
        preimage and seed_list_digest are not tied to an explicit v10 frame,
        and owner/endpoint generator source and target acceptance semantics are
