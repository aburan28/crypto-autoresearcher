      references:
        - experiments/EXP-SSI-7b1469/specification.yaml:550-592
        - experiments/EXP-SSI-7b1469/specification.yaml:496-516

    - control: paired_replay_and_branch_null
      status: incomplete
      evidence: >-
        The intended paired control distinguishes treatment and null by branch
