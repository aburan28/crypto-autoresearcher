      residual: >-
        PAIR-REQUEST-v5, TRACE-SHARED-v5, and FINAL-IDENTITY-v5 payload field
        grammars are absent from the specification; null_mutation_digest has no
        preimage; and the branch-null text says domain_code(1) while referring
