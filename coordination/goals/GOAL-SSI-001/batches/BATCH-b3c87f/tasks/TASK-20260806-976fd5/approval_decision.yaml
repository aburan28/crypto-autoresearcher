coordinator_decision:
  id: null
  id_note: >-
    NO DEC-* IDENTIFIER IS MINTED HERE, DELIBERATELY. AGENTS.md rule 14 requires
    every identifier be drawn by `python3 tools/allocate_id.py --next decision
    --date 20260806` and confirmed with `--check`; this session has no shell and
    therefore cannot mint one, and inventing a token by inspection is exactly the
    collision mode rule 14 exists to prevent. Separately, `ledger/decisions/` is
    not in TASK-20260806-976fd5's write_scope, and BATCH-b3c87f already reserves
    the batch decision id DEC-20260806-a00a28 for the ledger-archive task
    TASK-20260806-91f36a. This block is the design task's in-scope decision
    record; the ledger-level decision is that task's to write.
  task_id: TASK-20260806-976fd5
  batch_id: BATCH-b3c87f
  goal_id: GOAL-SSI-001
  decided_by: coordinator
  decided_at: '2026-08-06'

  context: >-
    GOAL-SSI-001 held 19 committed SSI/SSIQ proposals and zero frozen experiment
    contracts. IDEA-20260803-48e258 asked for the Wesolowski crossover locus
    p*(w) to be emitted from already-committed numbers, on the argument that the
    NIST-I margin is INCONCLUSIVE because it is being reported as a scalar whose
    band exceeds its value, while the sign - the part BATCH-003 established as
    robust - is exactly what a crossing point reports. This task converted that
    proposal into a specified hypothesis and a frozen, executable contract.

  decision: approve

  target_ids:
    - H-SSI-7fe2bf
    - EXP-SSI-697354
    - IDEA-20260803-48e258

  rationale:
    - >-
      EXECUTABILITY WAS CHECKED, NOT ASSUMED, AND DROVE THE DESIGN. Two committed
      records disagree about this container's package set across time
      (TASK-20260724-P13-VAL/validation_report.yaml lines 74/98 records numpy
      2.4.4 present; coordination/events/main/f12e21b55a8d.yaml line 42 records a
      SageMath/g6k environment having to be requested, which is why EXP-P13-NC36
      was never run), and requirements-dev.txt pins neither. The contract
      therefore makes its PRIMARY PATH stdlib-only - a strict subset of "numpy
      alone" - so it cannot be blocked under either reading. numpy appears in
      exactly one optional cross-check whose absence changes no reported number.
      The Dickman-rho / B-optimisation machinery that would have required numpy is
      off the primary path entirely: L_paper and L_mem come straight from the
      paper's committed 5-row table.
    - >-
      THE PROPOSAL'S DECLARED BLOCKING DEPENDENCY DOES NOT FIRE. The proposal made
      the bibliographic subtask BLOCKING for the absolute locus, and its F5
      degradation route would have reduced the deliverable to ratio form. Reading
      the frozen source showed the paper's own Section 4.1 bullets carry a
      previous-methods column (2^128 / 2^192 / 2^256 / 2^288 / 2^384) equal to
      2^{log2 p / 2} at all five rows. That is the matched baseline, committed
      verbatim, so the absolute locus is computable. The honesty cost is recorded
      rather than hidden: it is the paper's own rounding, not an independently
      transcribed Delfs-Galbraith constant (KN-TECH-050 says the corpus cannot
      supply one), so it is carried as HEUR-XO-2 with the ratio form primary and
      d(p*)/d(log2 k_DG) reported at every w.
    - >-
      THE CORPUS CONTAINS TWO INCOMPATIBLE CHARGINGS OF THE SAME vOW LAW AND NO
      RECORD RECONCILES THEM. EXP-P13VOW-001 gives the memory discount to the
      attack ("T_w_vOW = T_full / sqrt(min(w, M))"), and EV-WESO-001 records the
      consequence that the method "beats Delfs-Galbraith at every tested budget
      w = 2^30..2^80 for all five sizes". The paper's Section 1.1 law as quoted in
      RT-20260805-92751c OBJ-5 gives it to the baseline, and CMC-4 records the
      opposite consequence. They imply opposite signs and opposite monotonicity in
      w; IDEA-20260803-48e258's own instrument guard assumes the second while the
      campaign's committed model implements the first. A contract that picked one
      silently would manufacture the sign of its own answer, so the convention is
      an explicit two-valued axis and H-SSI-7fe2bf H2 predicts it, not the
      estimator correction, controls the sign.
    - >-
      ALL THREE MANDATORY CONTROLS ARE PRESENT AND EACH NAMES THE CONCRETE INPUT
      THAT WOULD MAKE IT RETURN A NEGATIVE. The reproduction gate DERIVES the
      2^{118.5} endpoint from the raw 8-row table under four independent fit rules
      into a 0.5-bit window; the null-object control is measured on the margin
      SURFACE (which always has resolution) rather than only on the locus (which
      may be categorical), with three distinct pre-registered failure modes; and
      the monotonicity control has five limbs including a clamp-kink check at the
      committed L_mem values, a convention-discrimination limb, and a pure data
      check on the committed table that no formula in the contract implies.
      MONO-3 is explicitly forbidden from passing vacuously and must report
      NOT_EVALUABLE with its count instead.
    - >-
      THE INPUT'S OWN UNCERTAINTY IS CARRIED, NOT COLLAPSED. Every output is a
      band composed of 4 per-entry laws x 2 structural surcharges x 4
      AES-equivalence models x 5 overhead scenarios x 2 memory conventions, plus
      an alpha=1.1321 extrapolation sensitivity that KN-FIND-4e7a92 records as
      never having been propagated into any margin row, plus a k_DG sensitivity,
      plus an explicitly reported adversarial corner. A band without its
      categorical counts is incomplete by contract, and the spread of four
      readings of one table may never be reported as a confidence interval.
    - >-
      SCOPE WAS CORRECTED RATHER THAN COPIED. The dispatch card asked the contract
      to note that NIST-III/V retain margin under every tested overhead scenario.
      Under the committed paper table that is true on ONE of three axes. On
      advantage-over-baseline and on gap-below-target the numbers move the other
      way (design-time: gaps below target of about 9.5 / 22 / 39 bits at NIST-I /
      III / V), because the p^{1/2}-p^{1/3} spread grows with p. Only on memory
      feasibility do NIST-III/V retain more margin, and there they retain a great
      deal (2^{98.5} / 2^{144.6} / 2^{187.3} bytes against about 2^{73} bytes of
      recorded global storage). The contract computes all three axes separately
      and FORBIDS the unqualified sentence. Smoothing this would have laundered a
      false safety claim into a frozen contract.

  evidence_refs:
    - EV-SSI-59f7a2
    - EV-WESO-001
    - EV-WESO-b6ceff
    - KN-FIND-4e7a92
    - KN-FIND-d1c853
    - KN-TECH-050
    - coordination/goals/GOAL-SSI-001/batches/BATCH-046/tasks/TASK-20260804-55952a/implementation/cost_measurements.json
    - coordination/goals/GOAL-SSI-001/batches/BATCH-046/tasks/TASK-20260804-55952a/concrete_cost_analysis.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-046/tasks/TASK-20260804-55952a/red_team_concrete_cost.yaml
    - inputs/P13-WESOLOWSKI-2026/paper_fulltext.md (lines 224-240)
    - coordination/tasks/TASK-20260724-P13-VAL/repro/experiments/EXP-P13VOW-001/cost_model.py (declared read-scope extension)
    - analysis/SSI-ECDLP-SYNTHESIS-20260803.md

  limitations:
    - >-
      NOTHING WAS MEASURED. This decision approves a contract. No run exists, no
      evidence exists, and no hypothesis status may move toward `supported` on the
      strength of it. `approved` on H-SSI-7fe2bf means exactly that
      EXP-SSI-697354 may be dispatched.
    - >-
      Conditional on Wesolowski Heuristic 1, which remains unvalidated after
      NC-3/NC-6 returned failed_infrastructure (EV-WESO-b6ceff; KN-FIND-d1c853).
      Under AGENTS.md rule 5 that is evidence in neither direction. This contract
      does not validate it and does not substitute for EXP-P13-NC36.
    - >-
      Claim tier medium, by the mechanical rule: the load-bearing measured input
      tops out at p = 2^40 and every emitted number is an extrapolation of 6.4x to
      19.2x beyond that fit window (HEUR-XO-1). It is never crypto-scale
      validation.
    - >-
      No security claim of any kind is licensed. The assessed method requires
      2^{92.5} table entries at NIST-I, priced by RT-20260805-92751c OBJ-5 at
      roughly 5*10^{29} bytes against about 10^{22} bytes of global storage.
    - >-
      The ell-range mismatch is carried, not resolved: T1 exercises only
      ell in {2,3,5} while RT-20260805-92751c OBJ-1 states the operating ell at
      NIST-I is far larger and that the linear extrapolation approximates the FFT
      figure only because two errors partially cancel.
    - >-
      The structural surcharge S = 3.0 bits is a DECLARED INPUT, not a
      re-derivation: the committed record does not decompose the 118.5-to-121.5
      bracket width into named factors. The reproduction gate is split so that
      RG-1 derives and RG-2 only checks placement, and the spec says so on its
      face.
    - >-
      Design-time hand arithmetic suggests much of the rectangle will be
      categorical at c = 0, which would push MONO-3 and the F2 band comparison
      toward NOT_EVALUABLE. Including the committed overhead axis c is what
      restores numeric loci; if that judgement is wrong, RG-1 and MONO-3 are
      where it will surface.

  knowledge_promotion:
    promoted: false
    status: not_warranted
    reason: >-
      This task measured nothing. Knowledge promotion requires a `support` or
      `reject_scoped` decision on `replicated`/`strong` evidence; there is no
      evidence record here at all, only a hypothesis and a frozen contract. A
      KN-FIND at this point would assert a finding that no run produced.

  next_actions:
    - >-
      TASK-20260806-274d8a (snapshot archive, runs alone) stages exactly
      ledger/hypotheses/H-SSI-7fe2bf.yaml,
      experiments/EXP-SSI-697354/specification.yaml, and this task directory,
      and adds H-SSI-7fe2bf and EXP-SSI-697354 to archive.record_ids alongside
      every IDEA id TASK-20260806-fd3518 actually filed. Push the branch and open
      or refresh a PR against main naming those records - a record that exists
      only in a local commit is not durable.
    - >-
      TASK-20260806-9536f4 (red team, independent session) must return an
      explicit capable-of-failing verdict for EACH of RG-1..RG-5, both null arms,
      MONO-1..MONO-5, FITTED-WINDOW-GUARD, ADVERSARIAL-CORNER and SANITY-1, and
      must verify the stdlib-only dependency claim by inspection rather than
      accepting it.
    - >-
      If the red team clears the contract, the FOLLOWING batch dispatches one
      Executor task to run EXP-SSI-697354 under a handoff with a budget and an
      assigned archival task (600 s, 1 GB, 1 run, stdlib-only), followed by an
      independent Validator who re-derives RG-1..RG-5 from T1 and T2 with an
      implementation written without reference to the Executor's.
    - >-
      If the red team finds a control incapable of failing or the contract
      unrunnable, DEC-20260806-a00a28 must say so and the next action is the
      repair. Do not archive around an adverse review.
    - >-
      SEPARATE AND HIGHEST-VALUE FOLLOW-UP IDENTIFIED BY THIS DESIGN: a derivation
      note deriving the van Oorschot-Wiener time-memory law for BOTH the
      table-based assessed method and the golden-collision baseline from one cost
      model, so the discount's attachment is derived rather than chosen
      (HEUR-XO-3). Until that exists, every margin row in this campaign carries an
      unstated modelling choice that controls its sign.
    - >-
      UNCHANGED AND NOT DISPLACED: the Heuristic 1 pairing (EXP-P13-NC36) remains
      the campaign's substantive outstanding item. This contract says so on its
      face and must never be cited as reducing the need for it.

  git_state:
    committed_by_this_task: false
    note: >-
      TASK-20260806-976fd5 explicitly runs no git command. All three artifacts are
      uncommitted working-tree files until TASK-20260806-274d8a stages them. Per
      AGENTS.md, no official transition may be made from uncommitted artifacts,
      and this decision makes none.

  inference:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-opus-5
    reasoning_effort: null
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve the policy aliases in
