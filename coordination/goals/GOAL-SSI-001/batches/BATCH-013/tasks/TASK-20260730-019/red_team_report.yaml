  witness_assessment:
    status: independently_recomputed
    recomputation_summary:
      parameter_rows: 36
      ordered_parameterized_child_pairs_checked: 1014
      zero_progress_witnesses: 16
      minimum_positive_p: "1/4"
      rows_containing_zero_progress:
        - {n: 3, ell: 2, s: 1, theta: "3/4", zero_count: 2}
        - {n: 3, ell: 2, s: 1, theta: "1", zero_count: 2}
        - {n: 4, ell: 2, s: 1, theta: "3/4", zero_count: 6}
        - {n: 4, ell: 2, s: 1, theta: "1", zero_count: 6}
    representative:
      parameters: {n: 3, ell: 2, s: 1, theta: "3/4"}
      v1: [0, 1]
      v2: [0, 2]
      required_bin_size: 2
      q_to_cardinality: {"0": 1, "1": 1, "2": 1, "3": 1}
      p: "0"
      reachable_in_stated_base_model: true
    judgment: >-
      The representative arithmetic is exact: z=1 and z=2 generate the two
      base vectors, the four sums occupy four singleton bins, and no bin meets
      the threshold two. This is a counterexample to a strictly positive
      progress lower bound over the full enumerated idealized state set only.
    wording_guard: >-
      analyzer_report.md says the model lacks a lower bound "at all tested
      parameter rows." Zero witnesses occur in only four of 36 rows. Future
      synthesis must say "over the combined enumerated state set, with zero
      witnesses in four rows," not imply every tested row contains a witness.

  disposition_assessment:
    claimed: FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED
    supported: true
    query_memory_support: supported
    qualification: >-
      The witness blocks one finite-state lower-bound route, while the separate
      recovery specification supplies no implementation trace, object widths,
      stopping distribution, or component error probabilities. This supports
      unreconciliation, not infinite cost, unbounded memory, numeric security,
      or impossibility.

  c2_assessment:
    status: remains_live
    strengthened_scope: >-
      The finite idealized state set now contains explicit zero-progress
      witnesses, so no positive lower bound over that whole set is available.
    not_established:
      - witness reachability under the pinned simulator's actual interval schedule
      - witness reachability under concrete HashDRBG state evolution
      - persistence or recurrence of zero-progress states after retries
      - a history-uniform lower bound or equivalent summable stopping tail
      - a global heavy-tail law or finite joint Q/S/P/C expectations
    broad_c2_rejected: false

  c3_assessment:
    status: lexical_simulator_phasevector_subcase_rejected_only
    judgment: >-
      BATCH-013 adds only an unimplemented schedule of required object classes.
      It does not establish widths, implementation lifetimes, reset/uncompute
      behavior, concurrency, or a global peak. Broad C3 and QM-MEMORY-MAP remain
      unresolved.
    broad_c3_rejected: false
    qm_memory_map_cleared: false

  error_map_assessment:
    status: remains_live
    judgment: >-
      recovery_spec.md defines a candidate operational event F and required
      constituent inclusions, but no procedure instantiates Verify, no trace
      proves that every exit is typed, no component probabilities are bounded,
      and F_sim is not mapped to F. The document is a checklist, not evidence
      of implemented recovery.

  objections:
    - id: ROW-SCOPE-WORDING
      severity: non_blocking_scope_guard
      title: Zero witnesses do not occur in every row
      detail: >-
        Independent recomputation locates zero-progress witnesses in four of
        36 parameter rows. The combined state set lacks a positive minimum,
        but wording that says this happens "at all tested parameter rows" can
        be read as a row-wise claim and is false under that reading.
      required_control: >-
        Report the four witness-bearing rows explicitly and distinguish a
        minimum over the union from a minimum in each row.
    - id: C2-REACHABILITY-GAP
      severity: blocking_for_global_c2_rejection
      title: Idealized base reachability is not process reachability
      detail: >-
        Reachability by isolated base draws does not show that the actual
        interval schedule, concrete DRBG, recursive history, and retry state
        jointly reach or revisit a witness.
      required_control: >-
        Pin the actual schedule and enumerate or prove concrete history-aware
        reachability before attributing a stopping obstruction to the
        implementation.
    - id: RECOVERY-SPEC-NOT-IMPLEMENTATION
      severity: blocking_for_query_reconciliation
      title: Required object schedule has no implementation witness
      detail: >-
        W/R/B/M_tail births and deaths are normative declarations without
        widths, code locations, runtime traces, or cleanup proofs.
      required_control: >-
        Implement one end-to-end recovery attempt and emit a machine-checkable
        object-lifetime trace and common-event failure trace.
    - id: ERROR-MAP-INCOMPLETE
      severity: blocking_for_query_reconciliation
      title: Event F is declared but not instantiated
      detail: >-
        A formal union of named failure constituents does not establish
        exhaustiveness or probabilities and does not connect simulator
        reporting to recovered-key verification.
      required_control: >-
        Instantiate Verify and prove trace exhaustiveness plus each
        component-to-F implication on the implemented procedure.

  required_controls:
    - id: ACTUAL-SCHEDULE-REACHABILITY
      control: >-
        Use the pinned schedule and a bounded explicit random-state model to
        determine whether the representative witness or any zero-progress
        class is history-reachable at an internal retry site.
      pass_condition: >-
        A checkable trace reaches such a state, or exhaustive bounded
        enumeration excludes it for the declared bounds.
    - id: ROW-WISE-PROGRESS
      control: >-
        Emit the minimum p separately for every parameter row, including zero
        counts, rather than only the minimum over their union.
      pass_condition: >-
        The report cannot be misread as asserting a witness in every row.
    - id: IMPLEMENTED-RECOVERY-TRACE
      control: >-
        Instantiate W/R/B/M_tail widths, births, last uses, cleanup events,
        concurrency, Verify, and all terminal exits for one bounded attempt.
      pass_condition: >-
        A trace yields a defensible peak live set and an exhaustive map to F.

  counterexample_or_mutation: >-
    The cheapest discriminator is to pin one actual small schedule row and
    enumerate schedule state plus explicit finite random-source state through
    one retry. Test whether (0,1),(0,2) is jointly reachable at s=1 and whether
    a discard can regenerate into the same zero-progress class. This separates
    an isolated one-level artifact from a process-level stopping obstruction.

  baseline_comparison:
    pollard_rho: >-
      No generic ECDLP instance, solve path, or end-to-end resource vector is
      implemented, so no Pollard-rho comparison is admissible.
    bsgs: >-
      No query/time/memory/data point is available for placement on the BSGS
      time-memory frontier.
    closest_specialized: >-
      Peikert's pinned CollimationSieve remains the closest specialized
      baseline. The analyzer probes an idealized local kernel and the recovery
      document is not an attack implementation, so neither changes the
      baseline's concrete or asymptotic cost.
    conclusion: >-
      No quantitative sota_delta, Pareto dominance, parameter recommendation,
      or security estimate follows.

  heuristic_challenges:
    - >-
      One-level base-model reachability does not transfer automatically to
      history-aware process reachability.
    - >-
      A zero conditional progress state does not imply a heavy tail unless the
      process reaches and revisits it with an appropriately bounded
      probability.
    - >-
      Absence of zero states in other finite rows would not prove a
      parameter-uniform positive gap.

  cost_model_challenges:
    - >-
      No stopping law converts per-transition costs into expected total costs.
    - >-
      Unquantified W/R/B/M_tail labels cannot establish a memory peak.
    - >-
      Recovery, verification, residual-tail, and failure costs remain absent.

  reduction_and_scope_challenges:
    - >-
      Representation, relation path, rank, scalar orientation, source
      recovery, target descent, and verified key recovery are not implemented.
    - >-
      Nothing transfers to generic ECDLP, numeric CSIDH security, SIDH/SIKE,
      SQIsign/CGL path finding, or goal completion.
    - >-
      Failure of this finite lower-bound route is not an impossibility result;
      another invariant or tail argument may still establish stopping.

  scope_limits:
    - >-
      Review is limited to Coordinator-committed snapshot
      e726092f064c9c8961b4422fc175661161fcc512.
    - >-
      One independent deterministic recomputation of the embedded analyzer was
      run; no simulator, curve, isogeny, or quantum-circuit computation ran.
    - >-
      The witness is exact only in the stated idealized one-level model.
    - >-
      No breakthrough, completion, numeric-security, parameter, or
      cryptographic-scale conclusion is admissible.

  pareto_assessment:
    applicable_attack_point: false
    dominated_by: not_evaluable_incomplete_resource_vector
    sota_delta:
      query: not_claimed
      time: not_claimed
      memory: not_claimed
      data_or_oracle: not_claimed

  narrowest_supported_statement: >-
    The finite idealized one-level analyzer has a zero minimum progress
    probability over its combined enumerated state set, with 16 witnesses
    confined to four of 36 parameter rows; the representative p=0 arithmetic
    independently checks. This supports retaining C2 as an unresolved stopping
    control but does not reject C2 globally or establish implementation-level
    reachability or a heavy tail. The unimplemented recovery specification
    leaves broad C3, QM-MEMORY-MAP, and the common error map unresolved.
    FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED remains supported.
  breakthrough_claim_detected: false
  numeric_security_claim_detected: false
  parameter_recommendation_detected: false
  goal_completion_claim_detected: false
  goal_completion_criteria_met: false
  illicit_global_tail_inference_detected: false
  overclaimed_global_c2_rejection_detected: false
  invented_implemented_recovery_schedule_detected: false
  claim_creep_detected: false
  row_scope_wording_hazard_detected: true
  query_memory_disposition_supported: true
  recommended_next_gate: >-
    Retain FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED. Do not advance to numeric,
    global-tail, breakthrough, or completion review until actual-schedule
    history reachability, a summable stopping law, quantified object
    lifetimes, and an implemented common-event trace are supplied.
  next_concrete_action: >-
    Pin one actual small interval-schedule instance and extend the analyzer by
    the minimum state needed to track recursive history and an explicit finite
    random source through one retry; determine whether a zero-progress class is
    jointly reachable and recurrent, while keeping recovery implementation and
    object-lifetime tracing as a separate gate.
