        those conclusions for this snapshot; the receipt alone is not a
        measurement of API invention or security-bit absence.
      required_control: >-
        Prefer deriving receipt honesty flags from ledger_checks /
        path-scope scans; do not treat hardcoded receipt literals as
        independent evidence beyond the YAML/Git checks already performed.
