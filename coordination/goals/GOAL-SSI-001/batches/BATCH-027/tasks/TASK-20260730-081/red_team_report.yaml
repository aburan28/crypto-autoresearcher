        resource vector, or peak-byte accounting would invent evidence —
        especially for P/C/H which remain not_instantiated.
      required_control: >-
        Keep charge_incidence_status=charge_incidence_partial and every
        field numeric_charge=not_supported; refuse any sentence that
        equates wired_symbolic coverage with complete charge incidence or
        MEMORY-MAP clearance.
    - id: SCHEMA-HARNESS-NOT-MATHEMATICAL-INCIDENCE
      severity: blocking_for_scope_expansion
      title: Harness is YAML schema consistency, not a charge-incidence proof
      detail: >-
        charge_incidence_harness checks declared edge counts against
        hardcoded EXPECTED_COUNTS, field-coverage flags, disposition, and
        absence of forbidden clearance booleans. It does not derive Q/S/P/C(+H)
        charges from an implemented lifetime. Reading harness-pass as
        complete charge incidence or MEMORY-MAP closure would invent evidence.
      required_control: >-
        Keep charge_incidence_status=charge_incidence_partial and
        numeric_charges_invented=false in all official claims; next MEMORY
        work remains numeric widths / charge metering / peak-byte accounting
        under an explicit protocol, still without CollimationSieve API
        invention.
    - id: HARNESS-HARDCODED-RECEIPT-FLAGS
      severity: non_blocking_qualification
      title: Some receipt honesty flags are hardcoded constants
      detail: >-
