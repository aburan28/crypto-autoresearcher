  # ------------------------------------------- R3, the load-bearing replacement argument

  R3_lemma_4_prime_b_replacement_argument:
    verdict: SOUND_AND_A_GENUINE_REPAIR
    reached: true
    i_checked_the_argument_not_merely_its_existence: true
    the_refutation_is_correct: >-
      The erratum's step is false as the discharge says. With y = h(u) =
      (b(u), i(u)), the colliding endpoint g(y) is the walk endpoint from
      E_{b(u)}, so it is a FUNCTION of the side bit. Independence is the wrong
      word for a dependent pair, and a conclusion reached through a false step
      is unproven until someone supplies a valid step. The discharge is right to
      refute and right to keep the conclusion pending a replacement.
    my_independent_check_of_the_replacement:
      bayes_step: >-
        VALID. If Pr[collision | beta, beta-prime] is the same (1 +- o(1))/n_V
        for all four side configurations, then the marginal Pr[collision] is
        that same quantity, and the posterior Pr[beta not equal beta-prime |
        collision] equals the prior times (1 +- o(1)). Uniformity across
        conditionings makes the posterior equal the prior; it does not need
        independence. This is the correct repair of an independence argument and
        it is a different argument, not a restatement.
      prior_is_one_half: >-
        VALID UNDER THE PRF MODEL, and the discharge correctly discharges the
        side condition. b(u) and b(u-prime) are unbiased independent bits
        provided u is not equal to u-prime, and u = u-prime would force
        y = y-prime since y is a function of u.
      the_l2_input: >-
        I RE-DERIVED IT AND IT HOLDS. With e = mu - U and the Ramanujan bound
        ||e||_2 <= poly(d)*ell^{-d/2}, at d = (1+eps)log_ell p one gets
        |<e_beta, e_beta-prime>| <= poly(log p)*p^{-(1+eps)} = o(1/n_V), since
        polylog is beaten by p^{eps} for any fixed eps > 0. Hence the pairwise
        endpoint-collision probability is (1 +- o(1))/n_V.
      the_diagonal_case_which_is_where_i_expected_it_to_break: >-
        IT DOES NOT BREAK, AND I CHECKED IT SPECIFICALLY. When beta =
        beta-prime the two walks start from the SAME curve, so Cauchy-Schwarz is
        not available and the relevant quantity is sum_v mu_beta(v)^2 =
        1/n_V + ||e_beta||_2^2. The same Ramanujan bound gives ||e||_2^2 <=
        poly*p^{-(1+eps)} = o(1/n_V), so the diagonal configuration obeys the
        SAME (1 +- o(1))/n_V. The uniformity claim survives the case that had
        the most reason to fail.
      the_extra_diagonal_channel: >-
        The diagonal also carries a channel the off-diagonal does not - if
        i(u) = i(u-prime) as well as beta = beta-prime, the two walks are
        IDENTICAL and collide with probability 1. That channel has rate
        1/|I| = p^{-1-eps} = o(1/n_V), so uniformity still holds, but the
        discharge prices it in step one (as the h-collision cause) rather than
        inside the conditioning where it structurally belongs. See objection O7:
        bookkeeping, not error.
    consequence_for_memory_independence: >-
      THE MEMORY-INDEPENDENCE CONCLUSION OF THE BATCH-002 ERRATUM STANDS, on the
      replacement argument supplied in TASK-20260728-011 and re-derived by me
      here, and NOT on the erratum's own argument. rho = 1/2 - o(1) is
      Theta(1), so k = Theta(1), which is above the sharp threshold the
      discharge itself identifies (memory-independence needs rho at least
      1/polylog and falls exactly when rho is polynomially small). I checked
      that threshold table and it is right, including the p^{-delta} row where
      T = Theta(p^{1/2+delta}/sqrt(w)) becomes explicitly w-dependent.
    but_it_now_stands_on_a_heuristic_the_erratum_does_not_state:
      id: O6
      detail: >-
        THIS IS THE ONE THING THE DISCHARGE DOES NOT SAY ABOUT ITS OWN REPAIR.
        The replacement argument consumes the L^2 bound, not H1-prime as
        numbered - it is the same substitution the discharge's own O1 shows is
        NOT licensed by the numbered heuristic. So the memory-independence
        conclusion now rests on a statement that is not in the erratum's
        numbered heuristic inventory. RC8 is therefore not the cosmetic
        restatement the discharge calls it (its blocks field says Nothing); it
        is a PRECONDITION of the very conclusion this discharge preserves.
        Until H1-prime is restated in L^2 form, the correct label for
        memory-independence is: stands, conditional on the L^2 spectral bound,
        which is proved in the erratum's section 2.1(i) but is not the numbered
        heuristic three lemmas cite.
    residual_gap_i_did_not_close:
      id: O7
      detail: >-
        Trail heads. The discharge asserts that heads have no predecessor, take
        their side bit from the start distribution, are a 1/L fraction, and that
        the argument applies to them under a uniform start. That is asserted,
        not derived, and a non-uniform start distribution would reintroduce a
        side-dependent bias in exactly the quantity RC10 pre-registers. It is a
        1/L fraction and cannot move rho off Theta(1), so it is NONFATAL, but it
        is the one step of the replacement I could not verify from what is
        written.

  R3_d1_verdict:
    verdict: CONFIRMED_AND_I_RE_DERIVED_IT
    detail: >-
      E[C] = |I|^2*(1/n_V + <e_1,e_2>) = (1 +- o(1))*p^{2+2eps}/p =
      Theta(p^{1+2eps}) against M = Theta(p^{1+eps}), so C/M = Theta(p^{eps})
      diverges and C = omega(M). The arithmetic is right on both readings of M
      that the discharge checks, and the discharge's own observation that a
      third (distinct-vertex) reading flips the DIRECTION while leaving
      Theta(M) wrong on every reading is the correct way to report an ambiguous
      definition. RT-20260728-007's note_on_lemma_4_robustness is wrong on its
      repaired-regime half and right on its near-bijective half, as stated.
    but_i_endorse_the_downgrade: >-
      The discharge's own objection O3 is the more important finding: nothing
      downstream consumes C, so D1 changes no cost, no exponent and no verdict.
      A review that self-downgrades its predecessor's headline disagreement to
      bookkeeping, and then names the item nobody had checked as the real
      load-bearing one, is behaving correctly. I found no self-serving asymmetry
      in the discharge's verdicts.

  # ---------------------------------------------------- R1, candidate admissibility

  R1_candidate_admissibility:
    axis: TIME_EXPONENT_ONLY_AS_THE_CARD_DIRECTS
    S1_verdict:
      holds: true
      qualified: true
      detail: >-
        S1 HOLDS as a conditional transfer lemma, and the one-for-one claim is
        the real content. I checked the arithmetic closes: X = B^{1/2}p^{beta/2}
        gives X^2 = B*p^{beta}, and at the standard choice making B = p^{o(1)}
        and u^{u} = p^{o(1)} simultaneously, expected time = per-attempt X^{2+o(1)}
        times inverse success u^{u(1+o(1))} = p^{beta+o(1)}. At beta = 1/3 it
        reproduces the archived headline, which is the correct sanity check. I
        looked for a second channel and did not find one: the inverse-success
        factor depends on beta only through u = beta*log p/log B and moves
        FAVOURABLY as beta falls; the modular-polynomial cost is B^{O(1)},
        independent of beta; and there is no additive p^{Omega(1)} term to
        dominate a smaller table. The cost bookkeeping is done as per-attempt
        times inverse-success throughout, never per-attempt alone.
      what_makes_it_conditional_and_is_correctly_labelled: >-
        S1 presupposes the RESTATED smoothness heuristic at the new u, and the
        artifact numbers that as C1-H1 with Canfield-Erdos-Pomerance as its
        rigorous distribution half. That is the correct exemplar-profile shape.
        Its random-model transfer is the weak point and the artifact knows it:
        the minimal degree of the smallest isogeny E -> E^{(p)} is a
        MINIMISED, structured quantity, not a uniformly random integer.
    candidates:
      - id: C1
        verdict: UNDECIDED_AND_I_DISPUTE_ITS_RANKING_NOT_ITS_ADMISSIBILITY
        targets_a_time_exponent_of_a_named_hard_problem: true
        benchmarked_against_the_corrected_time_tiers: true
        l1_ceiling_applied: >-
          YES AND CORRECTLY. C1 is placed ABOVE the superpolynomial o(1) and
          inherits it unchanged, and the artifact says so at every mention.
        uncharged_resource_found: >-
          NONE. No oracle, no preprocessing, no quantum, and memory is disclosed
          at p^{beta+o(1)} rather than suppressed.
        conditional_written_as_conditional: >-
          YES. plausibly_could_beat reads YES ... IF beta < 1/3 EXISTS, and
          novelty_status is unverified because reference [4] was not located.
        constant_factor_or_log_cofactor: >-
          NO. If the ingredient exists it moves an asymptotic time exponent,
          which is rule A1's bar. If it does not exist it produces no result at
          all rather than a small one, which the artifact states.
        my_objection: See O8, which is the sharpest objection in this report.
      - id: C2
        verdict: REJECTION_UPHELD_I_RE_DERIVED_S2
        detail: >-
          D_K >= D_1/K is correct: if F is in T_K via psi of degree at most K
          and phi from E to F has degree D_K, then psi composed with phi is an
          isogeny E -> E^{(p)} of degree at most K*D_K, so minimality gives
          D_1 <= K*D_K. It survives the cyclicity worry, because factoring a
          non-cyclic part out only lowers the degree. The cost side then gives
          Theta(K^2)*B*D_K >= Theta(K)*B*D_1, so K = p^{delta} RAISES the
          exponent to 1/3 + delta. I also tested the sharing evasion the
          artifact lists as its own falsification condition: building ONE
          enlarged list from E^{(p)} instead of K^2 lists does not escape,
          because the union of the radius-X neighbourhoods of T_K sits inside a
          radius-K*X neighbourhood of E^{(p)} of size Theta((K*X)^2), which is
          the same K^2*X^2. The rejection is robust, and it is correctly SCOPED
          to compose-with-a-small-isogeny families rather than declared as an
          impossibility.
        cost_bookkeeping: >-
          CORRECT AND WORTH NAMING. The candidate's only gain is success
          probability, capped at 1, against a penalty it would replace that is
          u^{u} = p^{o(1)}; the price is p^{Omega(1)}. That is the
          per-attempt-versus-total confusion caught rather than committed.
      - id: C3
        verdict: LIVE_AS_A_FLOOR_ARGUMENT_UNDECIDED_AS_A_CANDIDATE
        s3_arithmetic: >-
          I re-derived it. Hitting cost p/|W| from a uniform endpoint law, inner
          birthday |W|^{1/2}, sum minimised where p/|W| = |W|^{1/2}, i.e.
          |W| = p^{2/3} and cost p^{1/3}. Both consistency checkpoints
          reproduce: |W| = p^{1/2} gives p^{1/2}, and an F_p-rational input
          gives p^{1/4} because the hitting term vanishes. The V-shape
          max(1-gamma, gamma/2) is right.
        l1_ceiling_position_is_the_candidate_s_real_content: >-
          I AGREE WITH THE ARTIFACT AND THINK IT IS UNDERSOLD. C3 uses no
          smoothness heuristic and no B^{O(1)} enumeration, so its cofactors are
          (log p)^{O(1)}. A p^{1/3}(log p)^{O(1)} algorithm DOMINATES a
          p^{1/3+o(1)} algorithm whose o(1) is superpolynomial at every
          realisable p. It is the only candidate on the list that escapes the L1
          ceiling rather than inheriting it, and the artifact says so.
        the_blocker_labelling: See O9. The labelling MOSTLY holds but not in the field a reader greps.
        target_class_under_A1: >-
          The artifact's both-halves-must-be-quoted-together treatment is
          correct and I endorse it. Beating the unconditional tier 1/2 -> 1/3 is
          target-class; tying the conditional tier is not; quoting either half
          alone misrepresents the frontier.
      - id: C4
        verdict: REJECTION_UPHELD_ON_THE_DIRECT_TRANSFER
        detail: >-
          The degeneration is elementary and correct. For E with a model over
          F_p the Frobenius conjugate is the same curve, so the minimal isogeny
          E -> E^{(p)} has degree 1 and the endomorphism the architecture
          returns is pi, which lies in the a-priori-known Z[pi]. The mechanism
          recovers nothing beyond the known suborder on the whole F_p locus.
          This is a genuine STRUCTURAL explanation of the archived text's own
          line-35 safe-from-the-attack line for CSIDH, not a restatement of it,
          and it is properly labelled as very likely folklore rather than
          claimed new. The twist control is correctly named.
        repaired_transfer: >-
          CORRECTLY SCREENED AS UNLIKELY AND CORRECTLY LABELLED UNVERIFIED. The
          Eichler/Hurwitz counting estimate that puts beta_p at or above 1/3 is
          marked, three times, as an unverified reading from memory with no
          source read, and is excluded from the derivation status. The L1
          treatment here is the sharpest on the list: the repaired transfer
          would carry the full superpolynomial o(1) while competing against a
          Delfs-Galbraith baseline carrying only (log p)^{O(1)}, so it must beat
          1/4 by a margin large enough to survive a superpolynomial handicap.
        inherited_confidence: >-
          CORRECTLY CARRIED. C4 is scored against an F_p baseline at
          relayed_from_abstract, and the artifact says any C4 verdict inherits
          that label. Given O5 that label is, as the discharge puts it,
          generous.
    no_candidate_is_a_constant_factor_or_log_cofactor_improvement: >-
      Confirmed. C2 and C4 are rejected on the exponent; C1 and C3 are exponent
      claims. The only o(1)-level gain anywhere on the list is C2's success
      probability, which the artifact itself names as the reason C2 is NOT
      target-class under rule A1.

  # ------------------------------------------------------------------- R4 sourcing

  R4_sourcing:
    verdict: HONESTLY_RECORDED_WITH_ONE_WORD_TO_FIX
    no_confidence_label_upgraded_without_primary_text: >-
      CONFIRMED. confidence_labels_changed reads NONE, KN-LIT-078 and the
      BATCH-002 v2 record keep relayed_from_abstract, and the KN-TECH-056 draft
      correspondingly declines to supersede the F_p line. The direction of the
      discipline is right: the session had a finding that CONTRADICTED the
      erratum and still changed no label.
    failed_fetches_recorded_as_failures: >-
      CONFIRMED AND EXEMPLARY. Five RC5 attempts are itemised with verbatim
      error strings, including the Content-Length versus Transfer-Encoding parse
      error twice and a 303 to a paywall authorisation endpoint. The retrieved
      Haifa PDF was opened, identified as a 2013 student seminar slide deck, and
      DISCARDED rather than cited - that is the single best piece of sourcing
      discipline in either package. A search-engine summary restating
      n^{2/3+o(1)} was explicitly refused as not the paper. An O(p^{1/4})
      storage figure that appeared in one retrieval was identified as the fetch
      summariser's INFERENCE and not adopted. Nothing was reconstructed.
    rc4_finding_and_my_objection:
      i_agree_it_contradicts_the_erratum: >-
        The quoted text - run random walks from E0 and E1 UNTIL WE HIT a
        supersingular curve defined over F_p - is a single long walk, not the
        erratum's restart form, and the erratum's restart repair is therefore an
        in-repo substitute. The discharge is right to record a finding against
        the artifact it was reviewing, and right to add that this does NOT
        license any claim that Delfs-Galbraith is wrong.
      objection_O10: >-
        ONE WORD IS OVERSTATED, AND IT IS THE WORD THE DEBT IS ABOUT. The
        discharge says THE PUBLISHED descent is one long walk. What it retrieved
        was ar5iv's rendering of the arXiv preprint 1310.7789. The SAME report's
        O5 establishes that the arXiv object and the published DCC object differ
        enough that their abstracts disagree on whether p^{1/4} appears at all.
        The finding is therefore sound for the arXiv version and UNVERIFIED for
        the published DCC version, and those are the two objects O5 just showed
        apart. Fix: relabel finding_b as the arXiv version's descent. Nonfatal,
        one word, no exponent moves - but leaving it reads as a primary-source
        claim about the published paper that the session's own evidence does not
        support.
    o5_scoping:
      correctly_scoped: true
      does_any_confidence_label_need_to_change: >-
        NO LABEL NEEDS TO DROP, AND ONE MARKER SHOULD BE ADDED. relayed_from_abstract
        remains the right label because the figure IS relayed from an abstract.
        But relayed and CONTESTED are different defects, and O5 establishes the
        second: one of the two retrieved abstracts contains no p^{1/4} at all.
        The honest marker is contested_across_retrievals ALONGSIDE the existing
        label, wherever the F_p figure is quoted - which is KN-LIT-078, the
        BATCH-002 v2 baseline, and the KN-TECH-056 front-matter complexity
        field (admit condition AC2). I explicitly do NOT recommend downgrading
        the F_p ranking, because the direction of the discrepancy is unknown and
        the likeliest explanation, an arXiv version difference, is itself
        unverified. Absence of a stable source is not evidence the figure is
        wrong.

  # --------------------------------------------------------------- R5 overclaim check

  R5_overclaim_check:
    either_package_overclaims: NO
    detail: >-
      Both packages sit at or below their evidence tier and both stopped inside
      their caps and named what they did not reach. The mechanism screen calls
      itself a bounded screen, declares that no candidate below is claimed to
      work, and marks every novelty_status unverified because the one decisive
      retrieval failed. The discharge declares its own web retrievals
      non-durable and states that no committed record may cite it as archived
      until the snapshot commit exists. Neither calls anything a cryptanalytic
      result. I found NO instance of a conditional claim written as
      unconditional, and NO instance of per-attempt cost quoted as total
      expected cost, in either package.
    new_attack_mechanism_detected: false
    this_is_my_own_verdict_not_a_deferral: >-
      I reached it independently and I agree with the three prior sessions. My
      reasoning, which does not reuse theirs: the flag can only be true if some
      candidate beats an operative TIME threshold on present information. C2 and
      C4 are rejected on the exponent by derivations I re-derived myself. C1
      cannot beat anything until an external ingredient exists that this program
      searched for and failed to locate, and objection O8 gives a positive
      reason to expect it does not exist - so C1 is a research direction, not a
      mechanism. C3 at BEST TIES the conditional tier, by its own floor lemma
      S3, and is blocked on an unverified existence question. A tie is not a
      detection. Separately, the discharge's only preserved conclusion is
      memory-independence, which is a NEGATIVE result about attacks - a theorem
      that a resource does not help is not an attack mechanism, and I endorse
      that framing. If I disagreed I would say so; I do not.
    could_anything_in_batch_003_satisfy_a_goal_ssi_001_completion_criterion: >-
      NO. Neither package is evidence. Both performed zero curve compute, both
      are theory-tier, and the model-independence failure independently caps any
      resulting evidence record. The one thing in BATCH-003 with durable value
      is the pair of scoped NEGATIVE results (S2 closing the polynomial branch
      for one family, C4's degeneration explaining the F_p safe line) plus the
      Lemma 4-prime(b) repair - none of which is a completion criterion.

  # ------------------------------------------------------------------- R6 objections

  objections:
    - id: O6
      severity: nonfatal_but_it_changes_a_dependency_label
      target: TASK-20260728-011, the Lemma 4-prime(b) replacement argument and RC8's blocks field
      title: >-
        The replacement argument consumes the L^2 bound, so RC8 is a
        precondition of the preserved conclusion, not a cosmetic restatement
      detail: >-
        See R3. The discharge raises O1 (H1-prime is numbered as
        total-variation but consumed as L^2) and then, three sections later,
        builds its own replacement argument on the L^2 bound. Both are correct
        individually. Together they mean memory-independence now rests on a
        statement absent from the numbered heuristic inventory, while RC8's
        blocks field reads Nothing. It should read: blocks the L^2 step of the
        Lemma 4-prime(b) replacement argument and hence the memory-independence
        conclusion as currently supported.
      cost_to_fix: One field and one clause. Zero compute.
    - id: O7
      severity: nonfatal_unclosed_step
      target: TASK-20260728-011, trail heads in the replacement argument
      title: The trail-head case is asserted rather than derived
      detail: >-
        See R3 residual_gap. A 1/L fraction cannot move rho off Theta(1), so the
        conclusion is safe, but the uniform-start assumption is exactly the kind
        of assumption RC10's experiment would probe and it is not numbered.
      cost_to_fix: One paragraph, or one line added to RC10's pre-registration.
    - id: O8
      severity: material_to_the_recommendation_not_to_any_verdict
      target: TASK-20260728-010, recommendation.develop_first = C1
      title: >-
        The screen had the ingredients for a cheap heuristic count suggesting
        beta = 1/3 is TIGHT, and applied that count only to C4, never to C1
      detail: >-
        THIS IS THE SHARPEST OBJECTION IN THIS REPORT AND IT IS THE CHEAPEST
        DISCRIMINATING CONTROL. C4-H2 invokes Eichler-type Hurwitz class-number
        sums to estimate the F_p smallest-non-CM-endomorphism exponent. The SAME
        counting machinery applies directly to C1's object and points AGAINST
        it. Sketch, pen and paper, zero compute: an isogeny phi of degree m from
        E to E^{(p)} composed with the dual of Frobenius yields an endomorphism
        of E of degree m*p, so a bound of p^{beta} on the smallest such isogeny
        for EVERY supersingular E requires the Eichler/Hurwitz count of pairs
        (E, alpha) with deg alpha at most N = p^{1+beta} to cover all
        Theta(p) supersingular curves. The class-number sum grows like
        N^{3/2}/p in that normalisation, so coverage needs N^{3/2} of order
        p^2, i.e. N of order p^{4/3}, i.e. beta of order 1/3. On the counting
        heuristic beta = 1/3 is therefore essentially TIGHT, which is exactly
        C1's own falsification condition 1 arriving from the artifact's own
        toolkit rather than from an unobtained reference [4].
      why_this_matters_for_the_recommendation: >-
        The screen ranks C1 first partly because BOTH outcomes are informative.
        That is fair. But it presents C1 as the highest-leverage OPEN lever
        while holding, unused, a heuristic reason to expect the lever is
        already at its stop. Combined with O9, the C1-over-C3 ordering is
        supported by an unrun count that disfavours C1 and an unverified
        recollection that disfavours C3 - two errors pointing the same way.
      what_i_do_NOT_conclude: >-
        NOT that C1 is dead and NOT that beta = 1/3 is proved optimal. This is a
        counting HEURISTIC on a MINIMISED structured quantity, which is exactly
        the random-model-transfer failure mode agents/red-team.md item 2 warns
        about, and the true minimal degree could sit below the count for
        structural reasons. It is a reason to run the count before spending the
        retrieval, not a reason to close the candidate. S1 is untouched by this.
      cheapest_discriminating_control: >-
        Do the Eichler/Hurwitz sum properly, on paper, for the F_{p^2}
        E -> E^{(p)} case BEFORE attempting the reference [4] retrieval. Zero
        compute, one session, and it either kills C1's premise cheaply or
        materially strengthens it. If it lands at 1/3, S1 converts into the
        barrier the artifact itself calls the valuable outcome.
    - id: O9
      severity: nonfatal_labelling_defect_in_a_greppable_field
      target: TASK-20260728-010, C3 screen_verdict and recommendation.rationale
      title: >-
        The unchecked-recollection label holds in the prose fields but NOT in
        the verdict field, and the recommendation leans on the recollection
      detail: >-
        I checked this as instructed. The label DOES hold where the blocker is
        described: blocker says to this screener's knowledge and records THIS
        BELIEF IS NOT VERIFIED HERE, and novelty_screen_evidence repeats that
        the blocker is an unchecked recollection and that the web was NOT
        searched for this candidate. That is honest. BUT the field a downstream
        reader greps is screen_verdict, and it reads
        LIVE_BUT_BLOCKED_ON_A_KNOWN_HARD_SUBPROBLEM. The token KNOWN_HARD
        asserts a literature fact that the artifact elsewhere says it does not
        have. Rename to LIVE_BUT_BLOCKED_ON_AN_UNVERIFIED_HARDNESS_RECOLLECTION.
      does_anything_downstream_lean_on_it: >-
        YES, AND THIS IS THE PART THAT MATTERS. recommendation.rationale demotes
        C3 below C1 on the ground that its minimal test is a larger retrieval
        WITH A LIKELY NEGATIVE ANSWER, and
        new_attack_mechanism_justification calls C3 blocked on an existence
        question WHOSE LIKELY ANSWER IS NEGATIVE. Both lean on the unverified
        recollection. The FLAG is robust regardless, because C3 can at best tie
        the conditional tier and a tie is not a detection - so the false verdict
        does not move. The RANKING is not robust: strike the likely-negative
        clause and C1-over-C3 rests only on retrieval size, while C3 is the sole
        candidate that escapes the L1 ceiling.
      cost_to_fix: One field rename and one struck clause. Zero compute.
    - id: O10
      severity: nonfatal_sourcing_overstatement
      target: TASK-20260728-011, debt item D3 finding_b
      title: The arXiv version's descent is asserted as THE PUBLISHED descent
      detail: See R4 rc4_finding_and_my_objection. One word, and it is the word the debt is about.
      cost_to_fix: One word.
    - id: O11
      severity: nonfatal_unnamed_evasion
      target: TASK-20260728-010, S3 falsification conditions
      title: >-
        S3's floor assumes the hitting cost is paid by rejection sampling, and
        the sibling task retrieved the text describing the alternative
      detail: >-
        S3 charges p^{1+o(1)}/|W| to reach W, which is the cost of walking at
        random until you land in W. A mechanism that STEERS toward W does not
        pay that. This is not hypothetical: TASK-20260728-011's own RC4
        retrieval quotes Delfs-Galbraith offering exactly such an alternative -
        there should be a short path to the subset of j in F_p of length
        (1/2)log(p) so one could distribute a depth-first search through all
        short paths from E0. If a directed search reaches W below p/|W|, the
        V-shape and its 1/3 floor both move. S3 lists an error in its cost model
        as a falsification condition but does not name this evasion, and the two
        producers ran concurrently so neither could see the other's find.
      cost_to_fix: >-
        Add it as a named falsification condition and price the DFS alternative.
        Pen and paper, zero compute. It is a cross-artifact catch available only
        to a reviewer reading both packages, which is why this gate exists.
    - id: O12
      severity: nonfatal_scope_note
      target: TASK-20260728-011, the whole memory-independence line
      title: The object under analysis is this repository's own construction
      detail: >-
        The discharge says this itself and I am recording it so it is not lost
        downstream: the side bit b is a design element THIS PROGRAM specified in
        erratum section 2.3, not a property of any published algorithm.
        Confirming Lemma 4-prime(b) confirms internal consistency of this
        repository's Algorithm 2 and nothing about Delfs-Galbraith, Wesolowski
