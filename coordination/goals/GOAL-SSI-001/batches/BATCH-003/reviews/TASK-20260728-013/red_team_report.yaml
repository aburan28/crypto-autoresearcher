  counterexample_or_mutation: >-
    The cheapest discriminating control in this batch is objection O8's counting
    sum, and it costs a sheet of paper. Compose a degree-m isogeny E -> E^{(p)}
    with the dual of Frobenius to get an endomorphism of degree m*p, then ask
    the Eichler/Hurwitz count how large m must be for EVERY supersingular curve
    to be covered. If it returns 1/3, C1's premise is heuristically closed
    before the failed retrieval is ever repeated, and S1 converts from a lever
    into the barrier the screen itself calls the valuable outcome. I also
    re-derived, and confirm, the discharge's own pen-and-paper counterexample to
    H1-prime: mass 1/n_V + p^{-1/4} on one vertex has total-variation distance
    p^{-1/4} yet collision probability Theta(p^{-1/2}), inflating the count by
    Theta(p^{1/2}). Both are zero compute, zero curve, zero graph.

  baseline_comparison: >-
    Nothing in either package beats or matches a baseline, and neither claims
    to. Against the corrected TIME tiers - p^{1/2+o(1)} unconditional at
    polynomial memory over F_{p^2}, p^{1/3+o(1)} conditional on Heuristic 1, and
    p^{1/4+o(1)} on F_p at relayed_from_abstract confidence - C2 and C4 land
    ABOVE the relevant tier by derivations I re-derived, C1 is undefined until
    an unlocated ingredient exists, and C3 would beat only the unconditional
    tier while tying the conditional one. The discharge's preserved result,
    p^{1/2+o(1)} at polylog memory, is exactly the point the archived text
    itself names at line 39 as the classic algorithms with polynomial memory
    like [21], and the van Oorschot-Wiener interpolation
    p^{1/2+o(1)}/w^{1/2} at memory w connects the two tiers as one curve rather
    than rival algorithms - both packages state their position on that curve
    rather than claiming to escape it, which is the disclosure this role exists
    to demand. Against Pollard-rho and BSGS the comparison is not applicable in
    kind, since this is claw-finding on an isogeny graph rather than a discrete
    logarithm in a cyclic group; the structural point that does transfer is that
    a theorem saying a resource does not help is a negative result about
    attacks, not an attack. The closest specialized baseline, Delfs-Galbraith on
    F_p-rational instances, is untouched by everything here and its figure is
    now known to be contested across retrievals, not merely relayed.

  heuristic_challenges:
    - id: HC-A
      target: C1-H1, the restated Heuristic 1
      challenge: >-
        RANDOM-MODEL TRANSFER, and it is the exemplar failure mode verbatim. The
        heuristic asserts that the degree of the SMALLEST isogeny E -> E^{(p)}
        behaves like a uniformly random integer of its size. A minimised,
        structurally constrained quantity is not a uniformly random integer, and
        minimality biases toward the exceptional. The artifact numbers the
        heuristic, pairs it with Canfield-Erdos-Pomerance as its rigorous
        distribution half, and prescribes validation by sampling minimal degrees
        at CRYPTOGRAPHIC p via the Deuring correspondence with an explicit
        statement that toy scale validates nothing - that is the correct shape
        and I raise no defect in the inventory. My challenge is O8: the same
        minimality that makes the random model doubtful also supports a counting
        heuristic pointing at beta = 1/3 being tight.
    - id: HC-B
      target: C1-H1 note, shrinking beta shrinks u
      challenge: >-
        The observation is correct and is the one self-reinforcing direction,
        but it must not be read as evidence FOR C1. It says the heuristic gets
        easier IF the bound improves; it says nothing about whether the bound
        can improve. The artifact does not conflate these; I record it so a
        downstream reader does not.
    - id: HC-C
      target: C3-H2, unbiased entry into W
      challenge: >-
        CORRECTLY FLAGGED AS UNSUPPORTED by the artifact itself - no rigorous
        support is claimed, and it notes that for W = V_p this is H3-prime,
        strictly weaker than H1-prime because V_p carries class-group rather
        than full Ramanujan structure. For a general ORIENTED W the weakness is
        larger, exactly as stated, since orientability is a CM condition. No
        objection; the quarantine is right.
    - id: HC-D
      target: H1-prime as numbered
      challenge: >-
        I independently verified the discharge's O1 counterexample and it is
        CORRECT. Total variation does not control a pairwise collision
        probability, the L^2 bound does, and L^2 implies TV by Cauchy-Schwarz
        while the converse fails. This is a genuine heuristic-inventory defect
        found by the producer against the artifact it was reviewing, and it
        deserves to survive into the record.
    - id: HC-E
      target: O2, the descent quantifier
      challenge: >-
        I independently verified the arithmetic and it is CORRECT. The error
        term sqrt(S)*||e||_2 = polylog*p^{-1/4-eps/2} must be o(p^{-1/2}), which
        needs eps > 1/2 and hence d > (3/2)log_ell p, not eps > 0. No exponent
        moves because d stays Theta(log p). The observation that the erratum
        fixed v1's unquantified constant and then reintroduced an insufficient
        quantifier one section later is fair and is the kind of finding a
        self-review usually misses.
    - id: HC-F
      target: Heuristic 1 of the archived source
      challenge: >-
        CORRECTLY QUARANTINED EVERYWHERE, including in the KN-TECH-056 draft.
        This program has neither validated nor challenged it and holds no
        evidence bearing on it. I found no instance in either package of the
        conditional tier quoted unconditionally.
    - id: HC-G
      target: Scale honesty, AGENTS rule 7
      challenge: >-
        NOT APPLICABLE AND CORRECTLY SO. Zero curve compute in both producers
        and in this review, so there is no toy-scale-presented-as-crypto-scale
        defect because there is no scale at all. Every validation plan in the
        mechanism screen names cryptographic scale via the Deuring
        correspondence and states that toy scale validates nothing. The
        requirement passes forward to the first card that computes, and RC10
        must carry it.

  cost_model_challenges:
    - id: CMC1
      challenge: >-
        TOTAL EXPECTED COST EQUALS PER-ATTEMPT TIMES INVERSE SUCCESS. I checked
        both packages for this specifically and found NO violation. S1 states
        expected time as X^{2+o(1)} times the inverse-success factor
        explicitly; C2's rejection turns precisely on refusing to trade a
        success-probability gain against an exponent cost in one sentence, and
        names that refusal as a confounder; the discharge's Algorithm 3-prime
        composes p^{1/2+o(1)} expected restarts with Theta(log p) steps each.
        This is the strongest accounting discipline in both artifacts.
    - id: CMC2
      challenge: >-
        THE o(1) IS NOT LEFT IMPLICIT ANYWHERE, and the L1 ceiling is applied
        per candidate as the artifact's own per_candidate_placement_is_mandatory
        flag requires. C1 and C2 inherit the superpolynomial o(1); C3 escapes
        it; C4 carries it against a (log p)^{O(1)} baseline, which is correctly
        identified as the sharpest form of the handicap. I endorse the standing
        prohibition on benchmarking against full-cost figures computed ABOVE a
        superpolynomial o(1): such a figure is a threshold nobody can evaluate
        at any realisable p.
    - id: CMC3
      challenge: >-
        THE VAN OORSCHOT-WIENER INTERPOLATION IS PRESENT IN BOTH PACKAGES and in
        the KN-TECH-056 draft, quoted rather than paraphrased, and C1 propagates
        it correctly to the new exponent as sqrt(N^3/w) with
        N = p^{beta+o(1)}, giving p^{3beta/2+o(1)}/w^{1/2}. I checked that
        propagation and it is right: at beta = 1/3 it returns p^{1/2}/w^{1/2},
        the archived figure. No objection.
    - id: CMC4
      challenge: >-
        MEMORY IS DISCLOSED, NOT SUPPRESSED, even though the card puts it out of
        scope as a comparison axis. Every candidate carries a memory_exponent
        line marked disclosure-only, and C3's polylog memory claim is explicitly
        marked as NOT the basis of any claim. The one place memory is asserted
        rather than sourced is the Delfs-Galbraith inner search, which RC4
        leaves open and which the KN-TECH-056 draft correspondingly declines to
        supersede. This is the correct handling of a scoped axis and I raise no
        objection; I note only that admitting candidates on TIME alone means no
        candidate here has been shown to be admissible on FULL COST, and the
        record must not later read as if it had.

  reduction_and_scope_challenges:
    - id: RSC1
      target: Corollary 1.2 via [35, Theorem 1] and [35, Proposition 8.5]
      challenge: >-
        I read lines 19 and 23 myself and confirm the corollary is stated as
        CONDITIONAL on Heuristic 1 and as obtained by citing those reductions,
        and that the KN-TECH-056 draft and C1's cascades_to field both state it
        as the source states it. I did NOT verify the cited theorems'
        hypotheses; [35] is not in this repository. Neither producer asserts
        that they transfer, and both mark it unverified. RECORDED AS NOT
        VERIFIED BY ANY SESSION IN THIS PROGRAM - which means C1's
        cascades-for-free claim to EndRing and Isogeny is inherited, not
        checked, and should carry that label at every downstream mention.
    - id: RSC2
      target: Affected-versus-safe scheme scope
      challenge: >-
        NO SCOPE INFLATION FOUND. The draft quotes the source's affected list
        (CGL, SQIsign family, GPS signatures, PRISM, tensor-MIKE) and its safe
        list (CSIDH and other group-action constructions, M(D)-SIDH, FESTA,
        POKE), attributes both to the source, and instructs that they not be
        widened. The safe list rests on the source's stated ground that other
        cryptanalytic algorithms dominate those schemes' security analysis,
        which is the safe-because-a-different-attack-dominates form this role
        requires rather than safe-because-never-considered. C4 adds a STRUCTURAL
        reason for the CSIDH line (target degeneration) without widening the
        claim, and explicitly disclaims any bearing on CSIDH's quantum security.
    - id: RSC3
      target: S2 and S3 as negative results
      challenge: >-
        BOTH ARE CORRECTLY SCOPED AND NEITHER IS AN IMPOSSIBILITY CLAIM. S2 is
        scoped to compose-with-a-small-isogeny families and names Kani
        constructions and larger-field Galois conjugates as uncovered. S3 is
        scoped to one mechanism class with an explicit must never be quoted as a
        general lower bound. I add O11's evasion to S3's scope. This is the
        narrowest-valid-conclusion discipline applied correctly, and I confirm
        neither producer converts a bounded failure into an impossibility.

