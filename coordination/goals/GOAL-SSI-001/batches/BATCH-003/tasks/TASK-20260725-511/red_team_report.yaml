red_team_report:
  id: RT-20260725-511
  task_id: TASK-20260725-511
  goal_id: GOAL-SSI-001
  batch_id: BATCH-003
  verdict: REVISE
  claim_under_review: >-
    IDEA-20260725-002 admits a typed effective-orientation mechanism: a public
    non-scalar endomorphism alpha on E0 of poly(log p) degree reduces oriented
    path-finding to charged Cl-vectorization, to be compared against KN-TECH-050
    baselines under KN-OPEN-013.
  exact_supported_final_claim: >-
    At immutable snapshot 899f7c26e4295b094db990b7ad0a2902ba744d1c, the producer
    typed a partial-endomorphism / orientation candidate distinct from the closed
    cost-model lane and from SIDH torsion novelty, with an explicit KN-TECH-050
    comparator and a zero-compute derivation falsification gate. Admission as a
    novelty screen is directionally correct, but the candidate overstates
    novelty relative to classical oriented/CSIDH vectorization and leaves the
    orbit-membership assumption under-specified. Revise before ledger admission:
    tighten the public-input model, require an explicit non-CSIDH instance class,
    and demote any claim that merely restates known Cl-MITM costs.

  inference:
    requested_policy: review-xhigh
    resolved_model: cursor-grok-4.5-high-fast
    reasoning_effort: high
    fallback_used: true
    independent_session: false
    independence_limit: >-
      Same conversation lineage as producer after research-sol-max /
      review-xhigh subagent unavailability (API limit). Independence weakened;
      acceptable for revise/reject hygiene, not for completion claims.

  snapshot_review:
    reviewed_commit: 899f7c26e4295b094db990b7ad0a2902ba744d1c
    reachable_from_review_head: true
    parent_commit: 5e1cf2784cd938acbc394e3c6cdacc242afdcca9
    artifact_hashes_match_receipt: true
    verified_hashes:
      mechanism_screen.md: b05d6387a10b8bd83c16f95fe6a27f8c340dae9390dc7ad5f8b759f7e951d4bb
      candidate_report.yaml: 4bb9048ed4ee471469ad525fb8ddf9e8160450a8c676793ef94b8a308c75f204
      snapshot-receipt.json: 1829dd3316849f9c6e880fafd91381b335af83405bbef6f86188b7b460e0acec

  fatal_objections: []

  nonfatal_objections:
    - id: N1
      title: Orbit-membership assumption may smuggle the instance into CSIDH
      detail: >-
        The candidate assumes E1 lies in the Cl(Z[alpha]) orbit of E0. For
        typical CSIDH-like public keys this is the protocol model already
        covered by KN-TECH-027 classical vectorization. Without a precisely
        scoped non-protocol path-finding instance class (e.g. CGL endpoints
        plus independently published alpha), the idea risks rediscribing known
        CSIDH classical cost rather than probing KN-OPEN-013 End/path hardness.
    - id: N2
      title: Novelty vs classical CSIDH vectorization is thin
      detail: >-
        Cl-MITM/BSGS at O~(sqrt(h)) is standard. The only novelty is the
        partial-End → orientation packaging for path-finding under KN-TECH-050.
        That packaging is enough for a revise-track derivation gate, not for a
        breakthrough-track mechanism claim.
    - id: N3
      title: F_p DG comparison likely falsifies material advantage a priori
      detail: >-
        For Delta ~ -p, h ~ sqrt(p) gives sqrt(h) ~ p^{1/4}, matching DG order
        rather than beating it. Producer predictions already allow this; the
        revise must make NEVER_BEATS_BASELINE on F_p the default expectation
        unless a poly-bounded discriminant regime is public and justified.
    - id: N4
      title: Weakened review independence
      detail: Same-lineage fallback; no completion-level upgrade permitted.

  kn_tech_promotion:
    warranted: false
    scope: >-
      No knowledge promotion until the revised derivation gate produces a
      decision-relevant regime result. Not a KN-FIND.

  idea_admission:
    warranted_after_revise: true
    required_revisions:
      - >-
        Freeze a public-input model that is not identical to a CSIDH public-key
        tuple unless the claim is explicitly "CSIDH classical cost vs KN-TECH-050
        unoriented baselines" (usually documentation-only).
      - >-
        Prefer CGL/path-finding plus independently published small-degree
        endomorphism on E0, with orbit membership as a falsifiable assumption
        rather than silent protocol structure.
      - >-
        Cap BATCH-004 at the zero-compute derivation gate already named; do not
        open experiments until MATERIAL_IN_SOME_REGIME survives red-team.

  breakthrough_claim_detected: false
  completion_criteria_met: false
  official_state_changed: false

  cheapest_next_gate: >-
    BATCH-004 (after revise): run the named zero-compute derivation for revised
    IDEA-20260725-002 under the tightened public-input model; emit
    MATERIAL_IN_SOME_REGIME | NEVER_BEATS_BASELINE |
    REDUCTION_REQUIRES_UNCHARGED_ORACLE_OR_FULL_END.
