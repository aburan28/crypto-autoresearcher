    companion: >-
      coordination/goals/GOAL-SSI-001/batches/BATCH-002/tasks/TASK-20260728-009/errata_note.md
    operative_time_thresholds:
      F_p2_unconditional: p^{1/2+o(1)} TIME at polynomial memory
      F_p2_heuristic_conditional: >-
        p^{1/3+o(1)} TIME, conditional on Heuristic 1 of
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
      F_p: >-
        Delfs-Galbraith p^{1/4+o(1)} step count, carried at confidence
        relayed_from_abstract (RC4 open, KN-LIT-078 not read here either)
    settled_and_not_reopened:
      - MITM full cost is Omega(p^{2/3}) uniformly in the table size.
      - The p^{3/5} MITM rebalance does not exist.
      - >-
        BATCH-002 reported new_attack_mechanism_detected false three times
        independently. Nothing below contradicts that; this screen also finds no
        mechanism that beats a threshold.

  # ------------------------------------------------- the L1 o(1) ceiling, stated once

  o1_ceiling:
    id: L1
    statement_source: >-
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md line 39, read directly in this
      session, verbatim - "the overhead hiding in the o(1) term is
      superpolynomial, much larger than the previous (log p)^{O(1)} cofactor".
    consequence: >-
      The p^{1/3+o(1)} conditional tier is a threshold nobody can evaluate at any
      realisable p. A candidate that lowers the exponent WITHIN the same
      architecture inherits the identical superpolynomial o(1), because that o(1)
      is exactly the u^{u} inverse-success factor of Heuristic 1 together with the
      B^{O(1)} modular-polynomial cost of Algorithm 1. Such a candidate therefore
      improves an unevaluable threshold and remains unevaluable.
    consequence_direction_that_cuts_the_other_way: >-
      A candidate that reaches an exponent at (log p)^{O(1)} cofactors - i.e. one
      that does NOT use Heuristic 1 - is measured against the UNCONDITIONAL tier
      p^{1/2+o(1)}, and would dominate the conditional tier at realisable p even
      at an equal exponent. Candidate C3 sits here; C1 and C2 do not.
    per_candidate_placement_is_mandatory: true

  # ------------------------------------------------------------ shared lemma sketches

  shared_derivations:
    S1:
      name: transfer lemma - time exponent equals the structural degree-bound exponent
      statement: >-
        In the Wesolowski architecture (Algorithms 1-3 of
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md), suppose Theorem 1.5's
        bound is replaced by "every supersingular E/F_{p^2} admits an isogeny
        E -> E^{(p)} of degree at most p^{beta}", and suppose the corresponding
        smoothness heuristic holds with u = beta*log(p)/log(B). Then setting
        X = B^{1/2}*p^{beta/2} the expected running time is p^{beta+o(1)}, and the
        memory is p^{beta+o(1)}.
      derivation: companion note section 2, derived in place
      status: DERIVED_IN_PLACE_CONDITIONAL_ON_THE_RESTATED_HEURISTIC
      why_it_matters: >-
        beta enters the time exponent ONE FOR ONE and nothing else in the
        architecture does. Every candidate that hopes to move the conditional
        tier must either move beta or leave the architecture.
    S2:
      name: polynomial target-family enlargement is exponent-neutral at best
      statement: >-
        Let T_K(E) = {F such that some isogeny F -> E^{(p)} has degree at most K},
        so |T_K| = O(K^2*log K). Let D_K = min over F in T_K of the minimal degree
        of an isogeny E -> F. Then D_K >= D_1/K, where D_1 is the minimal degree of
        an isogeny E -> E^{(p)}. Running the architecture against T_K costs
        Theta(K^2)*X^2 with X^2 = B*D_K, hence at least Theta(K)*B*D_1, which is
        the K = 1 cost times Theta(K). The only quantity the enlargement improves
        is the success probability, which is capped at 1 while the K = 1 penalty
        it would replace is u^{u} = p^{o(1)}.
      derivation: companion note section 3, derived in place
      status: DERIVED_IN_PLACE
      strengthens_the_prior_ceiling: >-
        The BATCH-002 record left L1's ceiling as "o(1) unless the alternative
        target set grows POLYNOMIALLY in p". S2 closes the polynomial branch too,
        FOR THIS FAMILY: polynomial growth of a compose-with-a-small-isogeny
        family strictly RAISES the time exponent. It does not close families
        defined by a different structural relation - see C2 scope_limits.
    S3:
      name: recognizable-subgraph mechanisms have a p^{1/3} time floor
      statement: >-
        Let W be a subset of the supersingular vertex set V with (i) membership
        testable in time p^{o(1)}, (ii) a walkable subgraph structure, (iii)
        connectivity within W. The Delfs-Galbraith-type mechanism on W costs
        p^{1+o(1)}/|W| to reach W from an arbitrary input plus |W|^{1/2+o(1)} for
        the collision search inside W. The sum is minimised at |W| = p^{2/3},
        where it equals p^{1/3+o(1)}. Hence no mechanism of this class beats
        p^{1/3+o(1)} TIME, and any that attains it needs a recognizable walkable W
        of size p^{2/3+o(1)}.
      derivation: companion note section 4, derived in place under H1-prime
      status: DERIVED_IN_PLACE_CONDITIONAL_ON_H1_PRIME
      consistency_checks_that_pass:
        - >-
          W = V_p, |W| = p^{1/2+o(1)}, arbitrary F_{p^2} input - gives
          p^{1/2+o(1)} + p^{1/4+o(1)} = p^{1/2+o(1)}, matching the archived
          unconditional tier.
        - >-
          W = V_p, F_p-rational input - the hitting term is zero and the cost is
          p^{1/4+o(1)}, matching the archived F_p baseline.
      why_it_matters: >-
        It explains the otherwise-unexplained coincidence that the best
        heuristic-conditional exponent and the optimum of the entirely different
        Delfs-Galbraith mechanism are the SAME 1/3, and it converts "find a better
        subgraph" from an open-ended hope into one concrete existence question.

  # -------------------------------------------------------------------- candidates

  candidates:

    - id: C1
      one_line: >-
        Replace Theorem 1.5's (p/2)^{1/3} degree bound on the smallest isogeny
        E -> E^{(p)} with a smaller bound p^{beta}, beta < 1/3, and inherit
        time p^{beta+o(1)} unchanged everywhere else.
      class: mechanism
      targets_assumption: >-
        Supersingular endomorphism-ring / path-finding over F_{p^2} (OneEnd,
        EndRing, Isogeny - Problems 2.2, 2.3, 2.4 of the archived text). These are
        the SQIsign and CGL foundations.
      threshold_it_must_beat: p^{1/3+o(1)} TIME (heuristic-conditional tier)
      plausibly_could_beat: >-
        YES, ONE-FOR-ONE AND WITH NO OTHER CHANGE, IF beta < 1/3 EXISTS. That
        conditional is the entire content of the candidate, and its truth value is
        UNKNOWN TO THIS SCREEN - see novelty_screen_evidence. The mechanism half
        (S1) is derived; the ingredient half is not in hand.
      mechanism: >-
        By S1 the architecture's time exponent is exactly the exponent of the
        rigorous structural bound it is fed. Theorem 1.5 is the load-bearing wall
        of the p^{1/3} result and the ONLY place where the number 1/3 enters.
        Lowering it is therefore not one improvement among many, it is the single
        lever the architecture exposes.
      why_not_a_renamed_known_approach: >-
        The known approach is to accept Theorem 1.5 as given and optimise around
        it, which is what the archived paper does. This candidate treats the bound
        itself as the object and asks whether its exponent is tight - a question
        the archived text does not raise anywhere in the portion read here
        (lines 1-205).
      screen_verdict: LIVE_BUT_INGREDIENT_MISSING
      o1_ceiling_position: >-
        SITS ABOVE THE SUPERPOLYNOMIAL o(1) AND INHERITS IT UNCHANGED. Same
        Heuristic-1 u^{u} penalty, same B^{O(1)} modular-polynomial cost. A
        success here lowers an exponent nobody can evaluate at realisable p, and
        the record must say so at every downstream mention.
      target_class_under_A1: >-
        YES IF THE INGREDIENT EXISTS. It moves the asymptotic time exponent of a
        central hard problem, which is exactly rule A1's bar. It is NOT a
        constant-factor or log-cofactor improvement. If the ingredient does not
        exist the candidate produces no result at all, not a small one.
      cascades_to:
        - >-
          EndRing and Isogeny, by the reductions cited as [35, Theorem 1] and
          [35, Proposition 8.5] in the archived text (its Corollary 1.2). A
          p^{beta+o(1)} OneEnd cascades to both for free.
      novelty_status: unverified
      novelty_screen_evidence: >-
        SCREEN RUN, INGREDIENT NOT LOCATED. Corpus - grepped knowledge/ for
        isogeny/supersingular/CSIDH/SQIsign/Deuring/endomorphism (250-file cap
        hit); read KN-TECH-055, KN-TECH-027 in full; KN-TECH-055 names the
        structural-bound slot as "the scarce resource" but records no candidate
        successor bound. Ledger - grepped ledger/proposals/ for the same terms,
        three hits (IDEA-20260725-001, IDEA-20260726-002, IDEA-20260726-004),
        none about a degree bound to the Frobenius conjugate. Web - three
        WebSearch calls and two WebFetch calls, listed in
        external_search_log below. THE SOURCE OF THEOREM 1.5 (reference [4] of the
        archived text) WAS NOT IDENTIFIED, so its proof technique, its tightness
        status, and whether its authors conjecture an improvement are ALL UNKNOWN
        HERE. novelty_status is therefore unverified and cannot be raised without
        that retrieval.
      heuristic_assumptions:
        - id: C1-H1
          statement: >-
            Restated Heuristic 1. For a uniformly random supersingular
            E/F_{p^2}, the degree of the smallest isogeny E -> E^{(p)} is B-smooth
            with probability at least u^{-u(1+o(1))} where
            u = beta*log(p)/log(B), uniformly as p -> infinity in the range
            (log p)^eps < u < (log p)^{1-eps}.
          rigorous_support: >-
            Canfield-Erdos-Pomerance, quoted as Theorem 1.4 ([10]) of the archived
            text - Psi(X,B) = X*u^{-u(1+o(1))} in the same u-range. The heuristic
            asserts the minimal degree behaves like a uniformly random integer of
            its size.
          validation_plan: >-
            Sample minimal degrees at cryptographic p via the Deuring
            correspondence (shortest vectors in maximal orders), as the archived
            text's own Section 4 does, and compare the empirical CDF against
            Dickman-de Bruijn rho(u) with a tail check on the smoothest observed
            sample. NOT PERFORMED HERE - zero curve compute. Toy-scale sampling
            would validate nothing at cryptographic scale and must never be
            reported as if it did.
          note: >-
            Shrinking beta SHRINKS u, which makes the heuristic EASIER, not
            harder - the smoothness penalty u^{u} falls with beta. This is the one
            direction in which C1 is self-reinforcing.
        - id: C1-H2
          statement: >-
            The re-randomisation walk of Algorithm 3 (non-backtracking, length
            n = O(log p) in the 2-isogeny graph) still delivers a curve
            indistinguishable from uniform for the purposes of C1-H1 at the new
            parameters.
          rigorous_support: >-
            The Ramanujan spectral gap (KN-TECH-024, confidence established), used
            in the archived text via its references [37] and [6, Lemma 14]. The
            BATCH-002 erratum's H1-prime records that the quantifier must read
            (1+eps)*log_ell(p), not c*log_ell(p) with c unquantified.
          validation_plan: >-
            Chi-square of endpoint occupancy against uniform at increasing walk
            length, at the scale the Deuring correspondence permits. NOT PERFORMED
            HERE.
      predictions:
        - metric: time exponent of OneEnd under the archived architecture
          direction: lower
          minimum_effect: >-
            strictly below 1/3, and equal to beta by S1. Anything that does not
            lower beta produces no change at all - S1 leaves no other channel.
        - metric: memory exponent (disclosure only, out of scope as a comparison axis)
          direction: lower
          minimum_effect: >-
            also equal to beta by S1; the architecture's memory equals its table
            size equals X^2.
      minimal_test:
        design: >-
          A bounded literature retrieval, zero curve compute. Obtain reference [4]
          of inputs/P13-WESOLOWSKI-2026/paper_fulltext.md (the source of Theorem
          1.5) from the primary source and record, verbatim - (a) the exact
          statement and the constant, (b) the proof technique, (c) whether any
          lower bound or tightness claim is made for the exponent 1/3, (d) whether
          a variant for a larger target family is stated. Then screen for any 2025
          or 2026 successor that improves the exponent.
        controls:
          - >-
            Record a failed retrieval as failed. The retrieval attempted in THIS
            task failed and is recorded as such in external_search_log.
          - >-
            Do not infer tightness from the archived text's silence - it is a
            paper about an algorithm, not about the bound.
          - >-
            Distinguish the E -> E^{(p)} bound from the "largest minimal isogeny
            degree among arbitrary pairs" bound, which is a different and
            necessarily larger quantity (see companion note section 5).
        required_metrics:
          - exponent stated in the retrieved bound
          - presence or absence of a matching lower bound
          - publication identifiers, confirmed not guessed
      falsification_conditions:
        - >-
          Reference [4] or a successor proves a matching lower bound - i.e. an
          explicit family of E whose minimal isogeny to E^{(p)} has degree
          p^{1/3-o(1)}. Then beta = 1/3 is optimal, C1 is dead, and by S1 the
          ENTIRE architecture is capped at p^{1/3+o(1)} TIME. That is a barrier
          result and is a valuable outcome, not a null one.
        - >-
          S1 is wrong - i.e. some step of Algorithms 1-3 costs more than X^{2+o(1)}
          when beta is lowered. Check - the loop of Algorithm 1 is charged per
          table entry and the table has X^{2+o(1)} entries at any beta, so the
          failure would have to be in the heuristic's uniformity range.
      confounders:
        - >-
          A bound proved for a RESTRICTED class of curves (e.g. only those with a
          small non-integer endomorphism) does not feed S1, which needs a bound
          valid for EVERY supersingular E. Retrieval must check the quantifier.
        - >-
          A bound on the minimal degree of a NON-CYCLIC isogeny does not feed
          Lemma 3.4 of the archived text, whose proof uses cyclicity by minimality.
      interpretation_limits:
        - >-
          Even a successful C1 is heuristic-conditional and unevaluable at
          realisable p (see o1_ceiling_position). It would not break anything.
        - >-
          C1 says nothing about the F_p regime, where the target object degenerates
          (see C4), and nothing about CSIDH.
      target_complexity:
        time_exponent: p^{beta+o(1)}, beta < 1/3 by hypothesis
        memory_exponent: p^{beta+o(1)} (disclosure only; out of scope as an axis)
        best_known: >-
          p^{1/3+o(1)} time heuristic-conditional; p^{1/2+o(1)} time unconditional
          at polynomial memory
        hidden_overhead: >-
          Identical superpolynomial o(1) to the archived result - the u^{u}
          inverse-success factor and B^{O(1)} modular-polynomial evaluations, both
          p^{o(1)} but superpolynomial in log p, disclosed by the source's own
          author at line 39.
        tradeoff_note: >-
          The van Oorschot-Wiener interpolation quoted at line 39,
          sqrt(N^3/w) with N = p^{beta+o(1)}, applies unchanged, giving time
          p^{(3beta)/2 + o(1)}/w^{1/2} at memory w and perfect parallelisation.
          Recorded for completeness; the memory axis is out of this task's scope.
      estimated_cost:
        implementation: low
        compute: low
      recommended_priority: high

    - id: C2
      one_line: >-
        Enlarge the single target E^{(p)} to a polynomially large family of
        targets reachable from E^{(p)} by isogenies of degree at most K, so that
        the smoothness requirement has many chances to be met.
      class: composition
      targets_assumption: >-
        Same as C1 - OneEnd / EndRing / Isogeny over F_{p^2}.
      threshold_it_must_beat: p^{1/3+o(1)} TIME
      plausibly_could_beat: >-
        NO. Screened out by S2, derived in place. Polynomial K strictly RAISES the
        time exponent to 1/3 + delta for K = p^{delta}, because the family's
        members are all reached by composing with a degree-at-most-K isogeny and
        therefore cannot lower the minimal degree by more than a factor K, while
        the number of tables to build grows as K^2.
      mechanism: >-
        The intended mechanism was to trade the u^{u} inverse-success factor for a
        larger target set. It fails on arithmetic - the factor it buys is capped
        at u^{u} = p^{o(1)} while the price is p^{Omega(1)}.
      screen_verdict: REJECTED_WITH_DERIVATION
      screen_verdict_scope: >-
        REJECTED FOR THE COMPOSE-WITH-A-SMALL-ISOGENY FAMILY ONLY. S2's
        inequality D_K >= D_1/K uses precisely that every family member composes
        back to an E -> E^{(p)} isogeny. A family defined by a DIFFERENT
        structural relation - for instance targets in a higher-dimensional Kani
        construction, or Galois conjugates over a larger field - is not covered
        and is NOT screened here. Nothing is declared impossible.
      o1_ceiling_position: >-
        Would have inherited the same superpolynomial o(1); moot, since the
        candidate is rejected on the exponent itself.
      target_class_under_A1: >-
        NO. In its best case it improves only the o(1) (the success probability),
        which is explicitly not target-class under rule A1; in the polynomial
        regime it makes the exponent worse.
      novelty_status: adaptation
      novelty_screen_evidence: >-
        This is the surviving branch of lead L1 as recorded in
        BATCH-002/TASK-20260728-009/baseline_recommendation_v2.yaml, field
        candidate_generated_and_falsified_in_place.ceiling_added_by_the_review_and_carried_here,
        read in full in this session, which cites Remark 1 of the archived text
        (line 191, read directly here) pricing the constant-multiplicity version
        as "absorbed in the hidden term of the asymptotic complexity" and leaving
        the polynomial branch open. Not novel; the contribution here is S2, which
        closes that branch for this family.
      heuristic_assumptions:
        - id: C2-H1
          statement: >-
            The count of isogenies of degree at most K from a fixed curve, with
            cyclic kernel, is O(K^2*log K).
          rigorous_support: >-
            Lemma 3.2 and its proof in the archived text, which bounds the number
            of degree-x cyclic-kernel isogenies by x(log x + 2), citing
            [2, Lemma 5.7]. Summing over x <= K gives O(K^2 log K). This is a
            cited bound, not a heuristic; it is listed here because S2 consumes it.
          validation_plan: >-
            None required - it is a proved bound in the archived text. Recorded so
            the reader can locate the dependency.
      predictions:
        - metric: time exponent as a function of the enlargement parameter K = p^{delta}
          direction: higher
          minimum_effect: >-
            exponent 1/3 + delta - o(1); strictly increasing in delta. A measured
            or derived exponent that DECREASES with delta would falsify S2.
      minimal_test:
        design: >-
          Pen-and-paper only, zero curve compute. Re-derive S2 independently, then
          attempt to construct a target family that evades its inequality - i.e. a
          family T with |T| = p^{Omega(1)} whose members are NOT all reachable from
          E^{(p)} by a bounded-degree isogeny and for which a rigorous
          minimal-distance bound is available.
        controls:
          - >-
            An adversarial re-derivation by a different session, since S2 is the
            load-bearing step and was derived by the same session that proposes it.
          - >-
            Check S2's cost side against the alternative implementation that
            builds ONE enlarged list from E^{(p)} rather than K^2 lists, to
            confirm the floor is implementation-independent (companion note
            section 3.2 sketches this; it is a sketch, not a proof).
        required_metrics:
          - exponent of the number of tables required as a function of K
          - the best provable lower bound on D_K
      falsification_conditions:
        - >-
          Exhibiting a target family with |T| = p^{Omega(1)} and a rigorous
          minimal-distance bound better than D_1/|T|^{1/2}. That would revive C2
          and would be a genuine ingredient.
        - >-
          Showing that the K^2 target lists can be shared or compressed so the
          cost is o(K)*B*D_1. S2's cost side assumes no such sharing.
      confounders:
        - >-
          Success probability and exponent must not be traded in the same
          sentence. C2 improves the former and worsens the latter; a comparison
          that quotes only "success probability improves" is misleading.
      interpretation_limits:
        - >-
          S2 is a screen result inside one architecture. It is not an
          impossibility claim about target-set enlargement in general.
      target_complexity:
        time_exponent: p^{1/3 + delta + o(1)} for K = p^{delta} - i.e. WORSE
        memory_exponent: p^{1/3 + delta + o(1)} (disclosure only)
        best_known: p^{1/3+o(1)} heuristic-conditional
        hidden_overhead: >-
          Same superpolynomial o(1); C2 reduces the u^{u} part of it, which is
          precisely the part rule A1 excludes from target-class.
        tradeoff_note: not applicable - the candidate is rejected on time alone.
      estimated_cost:
        implementation: low
        compute: low
      recommended_priority: low

    - id: C3
      one_line: >-
        Find a poly-time-recognizable, walkable subgraph W of the supersingular
        graph of size p^{2/3+o(1)} and run the Delfs-Galbraith mechanism on it,
        giving p^{1/3+o(1)} TIME with (log p)^{O(1)} cofactors and NO smoothness
        heuristic.
      class: mechanism
      targets_assumption: >-
        Supersingular path-finding over F_{p^2} (Problem 2.4) and, through the
        archived reductions, EndRing. Directly the CGL and SQIsign foundation.
      threshold_it_must_beat:
        against_the_unconditional_tier: p^{1/2+o(1)} TIME - WOULD BEAT IT by p^{1/6}
        against_the_conditional_tier: p^{1/3+o(1)} TIME - WOULD TIE, NOT BEAT
      plausibly_could_beat: >-
        AGAINST THE UNCONDITIONAL TIER, YES, IF W EXISTS. AGAINST THE CONDITIONAL
        TIER, NO - S3 proves p^{1/3} is a FLOOR for the whole mechanism class, so
        this candidate can at best tie the conditional exponent. Its distinct value
        is that it would tie it WITHOUT Heuristic 1 and WITHOUT the superpolynomial
        o(1), which is the one axis on which a tie is not a null result.
      mechanism: >-
        Delfs-Galbraith works because V_p is recognizable (test j in F_p),
        walkable (an ell-isogeny between F_p-rational curves stays F_p-rational)
        and small (p^{1/2+o(1)}). S3 shows the mechanism's cost as a function of
        |W| is p/|W| + |W|^{1/2}, so V_p is not at the optimum - the optimum is
        |W| = p^{2/3}. The candidate is the existence question for such a W. The
        natural family is the O-orientable locus for an imaginary quadratic order
        O of discriminant about p^{4/3}, whose size is h(O) = p^{2/3+o(1)} and
        which carries a class-group action, hence is walkable.
      why_not_a_renamed_known_approach: >-
        Delfs-Galbraith is the known approach at ONE point of a one-parameter
        family. S3 makes the family explicit and locates its optimum, which turns
        an open-ended "look for a better subgraph" into a single existence
        question with a named required size. Whether that reframing is itself
        known in the literature is NOT established here - see novelty_status.
      screen_verdict: LIVE_BUT_BLOCKED_ON_A_KNOWN_HARD_SUBPROBLEM
      blocker: >-
        The membership test. For W = the O-orientable locus with disc(O) about
        p^{4/3}, deciding orientability in poly time is, to this screener's
        knowledge, believed to be as hard as computing the endomorphism ring - in
        which case the mechanism is circular. THIS BELIEF IS NOT VERIFIED HERE and
        is recorded as an unchecked recollection, not as a citation. Verifying it
        is the minimal test.
      o1_ceiling_position: >-
        BELOW IT, WHICH IS THE POINT. A recognizable-subgraph mechanism uses no
        smoothness heuristic and no B^{O(1)} enumeration, so its cofactors are
        (log p)^{O(1)}, like Delfs-Galbraith's. At any realisable p a
        p^{1/3}*(log p)^{O(1)} algorithm dominates a p^{1/3+o(1)} algorithm whose
        o(1) is superpolynomial. This is the only candidate screened here that
        escapes the L1 ceiling rather than inheriting it.
      target_class_under_A1: >-
        YES AGAINST THE UNCONDITIONAL TIER (1/2 -> 1/3 is an exponent move on a
        central hard problem). NO AGAINST THE CONDITIONAL TIER (it ties). Both
        halves must be quoted together; quoting only the first would misrepresent
        the frontier, and quoting only the second would discard the candidate's
        actual content.
      novelty_status: unverified
      novelty_screen_evidence: >-
        Corpus - KN-TECH-027 read in full (CSIDH class-group action, orientation,
        volcano; it names orientation by an imaginary quadratic order as the
        program's own research object but states no size-versus-cost optimisation);
        KN-TECH-055 read in full (no subgraph mechanism); knowledge/ grepped as
        for C1. Ledger - ledger/proposals/ grepped, no hit. Web - NOT SEARCHED FOR
        THIS CANDIDATE. The 600-second bound was reached before an orientability
        -hardness search could be run. novelty_status is therefore unverified and
        the blocker above is an unchecked recollection.
      heuristic_assumptions:
        - id: C3-H1
          statement: >-
            H1-prime of the authoritative baseline. For d at least
            (1+eps)*log_ell(p), the endpoint of a uniformly random
            non-backtracking ell-isogeny path of length d from a fixed
            supersingular E/F_{p^2} is within total-variation distance
            p^{-Omega(1)} of uniform on V. Consumed by S3's hitting term
            p^{1+o(1)}/|W|.
          rigorous_support: >-
            The Ramanujan spectral gap (KN-TECH-024, confidence established) via
            TV <= (1/2)*poly(d)*(n_V/ell^d)^{1/2}, as restated in
            BATCH-002/TASK-20260728-009 under control RC2.
          validation_plan: >-
            Chi-square of endpoint occupancy against uniform at increasing d, at
            Deuring-correspondence-reachable scale. NOT PERFORMED HERE. Toy scale
            validates nothing at cryptographic scale.
        - id: C3-H2
          statement: >-
            The restriction of the hitting law to W is unbiased - i.e. the walk
            enters W near-uniformly, so the subsequent collision search inside W
            behaves as a birthday search on |W| points.
          rigorous_support: >-
            None claimed. For W = V_p this is exactly H3-prime of the
            authoritative baseline, which that record flags as STRICTLY WEAKER
            than H1-prime because V_p carries class-group (CM) structure
            (KN-TECH-027) rather than the full Ramanujan structure. For a general
            oriented W the same weakness applies and is if anything larger.
          validation_plan: >-
            Compare the empirical entry-point distribution on W against uniform on
            W. NOT PERFORMED HERE, and it requires a W that does not yet exist.
      predictions:
        - metric: >-
            time exponent of supersingular path-finding as a function of the
            recognizable-subgraph size |W| = p^{gamma}
          direction: different
          minimum_effect: >-
            exponent max(1-gamma, gamma/2), a V-shape with its minimum 1/3 at
            gamma = 2/3. Two named checkpoints must reproduce - gamma = 1/2 must
            give 1/2, and gamma = 1/2 with an F_p-rational input must give 1/4.
        - metric: existence of a poly-time membership test for a walkable W at gamma = 2/3
          direction: different
          minimum_effect: >-
            binary. Existence makes C3 the strongest candidate on this list;
            a reduction from EndRing to that membership test kills C3 as circular
            and is itself a publishable barrier.
      minimal_test:
        design: >-
          Two-part, zero curve compute. (a) Independently re-derive S3 and check
          its two consistency checkpoints. (b) A bounded literature retrieval on
          the complexity of deciding O-orientability of a supersingular curve for
          an order of discriminant p^{Theta(1)} - specifically whether a reduction
          from EndRing (or from OneEnd) to orientability-testing is published.
        controls:
          - >-
            Distinguish "given an orientation, act with the class group" (easy,
            CSIDH) from "decide whether an orientation exists" (the blocker).
            KN-TECH-027 covers only the former.
          - >-
            Check the walkability requirement separately from the recognizability
            requirement. A recognizable W that is not walkable fails S3's inner
            term, and the poly-neighbourhood construction (companion note section
            4.3) is exactly such a failure.
        required_metrics:
          - the exponent gamma achievable by any W with a published poly-time test
          - presence or absence of a published hardness reduction for the test
      falsification_conditions:
        - >-
          A published reduction showing that poly-time orientability testing at
          disc p^{Theta(1)} implies a poly-time EndRing algorithm. C3 dies as
          circular, and S3 becomes a clean barrier statement covering
          Delfs-Galbraith and all its relatives.
        - >-
          An error in S3's cost model - for instance if entering W does not
          preserve the ability to search inside it, making the inner term larger
          than |W|^{1/2+o(1)}. Then the V-shape and its 1/3 floor both move.
        - >-
          A recognizable walkable W with gamma strictly between 1/2 and 1 that has
          a poly-time test. C3 fires, at exponent max(1-gamma, gamma/2).
      confounders:
        - >-
          A "recognizable" set whose test costs p^{delta} rather than p^{o(1)}
          multiplies the hitting term by p^{delta} and can silently cancel the
          entire gain. The companion note section 4.3 shows the d-neighbourhood of
          V_p doing exactly this - it enlarges |W| and raises the test cost by the
          same factor, netting p^{1/2} again.
        - >-
          S3's floor assumes the mechanism pays the hitting cost. An input already
          inside W pays nothing, which is why the F_p regime is at 1/4 and is not
          governed by the 1/3 floor.
      interpretation_limits:
        - >-
          S3 bounds ONE mechanism class. It is not a general lower bound on
          path-finding and must never be quoted as one.
        - >-
          C3 would tie, not beat, the conditional tier. Any downstream statement
          must carry both halves of target_class_under_A1.
      target_complexity:
        time_exponent: p^{1/3}*(log p)^{O(1)} at gamma = 2/3, if W exists
        memory_exponent: >-
          polylog under a distinguished-point collision search inside W
          (disclosure only; out of scope as a comparison axis, and NOT the basis
          of any claim here)
        best_known: >-
          p^{1/2+o(1)} unconditional at polynomial memory; p^{1/3+o(1)}
          heuristic-conditional
        hidden_overhead: >-
          (log p)^{O(1)} only, PROVIDED the membership test is poly-time. If the
          test costs p^{delta} the whole advantage is consumed - see confounders.
        tradeoff_note: >-
          The inner collision search parallelises as van Oorschot-Wiener does. Not
          developed here; memory is out of scope.
      estimated_cost:
        implementation: low
        compute: low
      recommended_priority: high

    - id: C4
      one_line: >-
        Transfer the Frobenius-conjugate mechanism to the F_p / CSIDH class-group
        lane by targeting the smallest endomorphism outside the CM order Z[pi]
        instead of the smallest isogeny E -> E^{(p)}.
      class: representation
      targets_assumption: >-
        CSIDH class-group action and F_p-rational supersingular path-finding
        (Problem 2 of the authoritative baseline).
      threshold_it_must_beat: >-
        p^{1/4+o(1)} TIME (Delfs-Galbraith), carried at confidence
        relayed_from_abstract because KN-LIT-078 has still not been read - RC4
        remains open and was not in this task's scope either.
      plausibly_could_beat: >-
        NO ON THE DIRECT TRANSFER, and the reason is structural rather than
        quantitative - the mechanism's target object DEGENERATES on the F_p locus.
        The repaired transfer is screened as UNLIKELY on a counting estimate that
        is explicitly labelled unverified below.
      mechanism: >-
        Degeneration, derived in place and elementary - for E defined over F_p the
        Frobenius conjugate E^{(p)} is isomorphic to E, so the smallest isogeny
        E -> E^{(p)} has degree 1 and the endomorphism the architecture produces is
        the Frobenius pi itself, which is known a priori. The mechanism returns no
        information beyond Z[pi] on the whole F_p locus. This is a structural
        explanation for the archived text's own statement (line 35) that
        group-action constructions like CSIDH are "safe from the attack", and it
        also explains why C1 cannot be expected to help CSIDH even if it succeeds.
      repaired_transfer_and_its_screen: >-
        The non-degenerate F_p analogue is to seek the smallest endomorphism
        OUTSIDE Z[pi], since that is what upgrades the known suborder to End(E).
        By S1 the architecture would then run in time p^{beta_p+o(1)} where
        p^{beta_p} bounds that degree. UNVERIFIED COUNTING ESTIMATE, labelled as
        such - the number of pairs (E, alpha) with alpha an endomorphism of degree
        at most m is governed by Hurwitz class-number sums of the Eichler type, and
        a crude reading of those sums suggests m must be at least about p^{1/3} for
        every F_p-rational curve to be covered. If that reading is right,
        beta_p >= 1/3 > 1/4 and the repaired transfer is strictly dominated by
        Delfs-Galbraith. I DID NOT VERIFY THIS SUM, I read no source for it in this
        session, and it must not be quoted as a derivation.
      screen_verdict: REJECTED_ON_THE_DIRECT_TRANSFER, UNLIKELY_ON_THE_REPAIRED_TRANSFER
      o1_ceiling_position: >-
        The repaired transfer would inherit the full superpolynomial o(1) (it uses
        the same smoothness heuristic), while competing against a Delfs-Galbraith
        baseline whose cofactors are (log p)^{O(1)}. It would therefore have to
        beat 1/4 by a margin large enough to survive a superpolynomial handicap -
        a strictly harder bar than the exponent comparison alone suggests. This is
        the sharpest form of the L1 ceiling anywhere on this list.
      target_class_under_A1: >-
        NO as screened. The direct transfer produces no algorithm at all; the
        repaired transfer is estimated to land above the baseline exponent.
      novelty_status: unverified
      novelty_screen_evidence: >-
        Corpus - KN-TECH-027 read in full; it records the CSIDH class-group action
        and the Kuperberg quantum attack but says nothing about the
        Frobenius-conjugate mechanism or its degeneration, which is unsurprising
        since KN-TECH-027 predates the archived paper. Ledger - no hit. Web - one
        WebSearch touched CSIDH-adjacent material only incidentally; NO dedicated
        search was run for this candidate before the bound was reached. The
        degeneration observation is elementary and is very likely folklore; it is
        recorded here because it is not in the corpus, NOT because it is claimed
        new.
      heuristic_assumptions:
        - id: C4-H1
          statement: >-
            An F_p analogue of Heuristic 1 - the degree of the smallest
            endomorphism of an F_p-rational supersingular curve outside Z[pi] is
            B-smooth with the probability expected of a uniformly random integer
            of its size.
          rigorous_support: >-
            Canfield-Erdos-Pomerance again, as in C1-H1. But the rigorous BOUND
            half of the pattern - the analogue of Theorem 1.5 - IS MISSING
            ENTIRELY. Under KN-TECH-055's five-component pattern this candidate
            fails at component 1, which that entry names as "the load-bearing wall;
            everything heuristic sits on top of it, never underneath it".
          validation_plan: >-
            Not worth pre-registering until the missing bound exists. Recorded so
            that the gap is visible rather than implied.
        - id: C4-H2
          statement: >-
            The counting estimate quoted in repaired_transfer_and_its_screen -
            that covering every F_p-rational supersingular curve by an
            endomorphism of degree at most m outside Z[pi] requires
            m = p^{1/3-o(1)}.
          rigorous_support: >-
            NONE PRESENTED. This is an unverified reading of Eichler-type class
            number sums by this session, from memory, with no source read. It is
            recorded as a screening estimate to be checked, not as support.
          validation_plan: >-
            Retrieve a standard reference for the Eichler mass formula / Hurwitz
            class-number count of supersingular endomorphisms of bounded degree and
            redo the sum, restricted to the F_p-rational locus. Zero curve compute.
      predictions:
        - metric: >-
            information recovered by the archived architecture on an F_p-rational
            input
          direction: different
          minimum_effect: >-
            exactly the known suborder Z[pi] and nothing more. Recovering any
            endomorphism outside Z[pi] from the unmodified architecture on an
            F_p-rational input would falsify the degeneration argument.
        - metric: >-
            beta_p, the exponent of the smallest-non-CM-endomorphism degree bound
          direction: different
          minimum_effect: >-
            below 1/4 revives the candidate; at or above 1/4 it stays dominated by
            Delfs-Galbraith.
      minimal_test:
        design: >-
          Pen and paper plus one retrieval, zero curve compute. (a) Confirm the
          degeneration by checking that E defined over F_p implies E^{(p)}
          isomorphic to E and that the resulting endomorphism is pi. (b) Retrieve
          a source for the Eichler/Hurwitz count and settle C4-H2 as a
          calculation rather than a recollection.
        controls:
          - >-
            Twists. E and its quadratic twist share a j-invariant in F_p; check
            that the degeneration argument is about j-invariants and is not
            disturbed by the twist.
          - >-
            Do not compare an F_p exponent against an F_{p^2} exponent. The
            baseline's own warning applies - the asymptotically stronger general
            algorithm can be the wrong baseline on a sub-regime.
        required_metrics:
          - degree of the endomorphism produced on an F_p-rational input
          - the exponent implied by the class-number sum
      falsification_conditions:
        - >-
          A rigorous bound beta_p < 1/4 on the smallest non-CM endomorphism degree
          for every F_p-rational supersingular curve. C4 fires and, by S1, gives
          time p^{beta_p+o(1)} against a p^{1/4} baseline - subject to the L1
          handicap noted above.
        - >-
          The degeneration argument being wrong, i.e. the architecture producing a
          non-scalar endomorphism outside Z[pi] on F_p-rational input.
      confounders:
        - >-
          The F_p baseline itself is at confidence relayed_from_abstract. A
          candidate scored against p^{1/4+o(1)} inherits that uncertainty, and RC4
          is still open. Any C4 verdict must carry the same confidence label.
      interpretation_limits:
        - >-
          Nothing here bears on the QUANTUM security of CSIDH (Kuperberg,
          KN-TECH-027, KN-OPEN-014). This screen is classical and time-only.
        - >-
          The degeneration is a statement about ONE mechanism. It does not say
          CSIDH is safe from anything else, and declares no direction impossible.
      target_complexity:
        time_exponent: >-
          p^{beta_p+o(1)} with beta_p estimated at or above 1/3 by an UNVERIFIED
          count - i.e. worse than the baseline, on present information
        memory_exponent: p^{beta_p+o(1)} (disclosure only)
        best_known: p^{1/4+o(1)} step count, confidence relayed_from_abstract
        hidden_overhead: >-
          Full superpolynomial o(1) inherited, against a baseline carrying only
          (log p)^{O(1)}. See o1_ceiling_position.
        tradeoff_note: not developed - the candidate does not clear the time bar.
      estimated_cost:
        implementation: low
        compute: low
      recommended_priority: low

