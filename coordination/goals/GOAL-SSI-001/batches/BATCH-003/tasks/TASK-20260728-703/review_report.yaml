    distinguished predicate, collision-to-path reconstruction with
    walk-function tracking and recomputed kernels, no uncharged oracles;
    (4) VW full-cost exponents p^{1/2} (F_{p^2}), p^{1/4} (F_p conditional
    on mixing) -- re-derived with F1 fix and N1 clock-cycle reconciliation;
    (5) matched-baseline recommendation (VW, not MITM/DG, under full cost;
    F_p conditional on mixing with DG fallback at p^{1/3}). KN-TECH-029
    records step-count exponents only and does not include full-cost
    exponents or the VW analogue, so the package adds new information.
    The KN-TECH entry should explicitly note: (a) the birthday bound on
    the Ramanujan graph is a heuristic application of the birthday paradox
    to mixed walks, not a direct transfer of Wiener's group theorem (NF2);
    (b) the walk independence is heuristic (limitation 5); (c) the F_p
    variant rests on unproven subgraph mixing with DG fallback. Promoting
    the complete package in a single coherent promotion is correct --
    promoting MITM/DG without VW would be misleading because the matched-
    baseline recommendation depends on all three algorithms being
    correctly costed. This is a matched-baseline recommendation, not a
    breakthrough claim; no review-breakthrough review is required.
  fatal_objections: []
  nonfatal_objections:
    - id: NF1
      title: Receipt metadata gap -- null commit_sha and parent_sha
      detail: >-
        The snapshot-receipt.json has commit_sha: null, parent_sha: null,
        and verification.status: "pending_post_commit". The receipt was
        committed together with the producer files in commit 94df4f86
        (unlike BATCH-002 where the receipt was committed separately after
        the snapshot commit 65e5bdb8). The commit is independently
        verifiable: 94df4f86 is reachable from HEAD, has parent bf766ae6,
        changes exactly the 3 declared paths, and the producer file hashes
        match the receipt. But the receipt does not self-record its commit
        SHA, so the dispatcher's verification ("the commit must be
        reachable from HEAD, have the expected parent") cannot check
        against the receipt's own claim. The Coordinator should update
        the receipt with commit_sha=94df4f86 and parent_sha=bf766ae6, or
        the dispatcher should fill these in during verification. This is
        a metadata gap, not an evidence-integrity failure -- the content
        is verifiable against Git.
    - id: NF2
      title: Wiener theorem applicability -- birthday bound on Ramanujan graph is heuristic, not direct group-theorem transfer
      detail: >-
        Wiener's parallel collision search theorem (KN-LIT-094) and the
        van Oorschot-Wiener method (KN-LIT-012) are proven for random
        walks on cyclic groups. The supersingular l-isogeny graph is a
        Ramanujan expander, not a group. The birthday bound O~(sqrt(|V|))
        on a Ramanujan graph after mixing is a well-supported heuristic:
        the Ramanujan property gives mixing time O(log |V|), after which
        the walk distribution is close to uniform, and the birthday
        paradox applies to near-uniform distributions. The deterministic
        walk structure ensures that collided walks merge and can be
        detected at distinguished points, exactly as in the group setting.
        However, this is NOT a direct application of Wiener's group
        theorem -- it is an application of the birthday paradox to mixed
        walks on an expander graph. The derivation cites KN-LIT-012 and
        KN-TECH-024 but does not explicitly state the group-vs-expander
        distinction. Limitation 5 acknowledges the heuristic nature of
        walk independence but frames it as a joint-distribution issue
        rather than a group-vs-expander transfer issue. The result is
        correct as a heuristic; the KN-TECH entry should explicitly note
        that the VW collision-search framework is adapted from the group
        setting to the expander-graph setting via the birthday paradox on
        mixed walks, and that a formal proof would require expander-graph
        collision-time analysis (which is standard in the literature but
        not cited here).
    - id: NF3
      title: Useless-collision overhead reasoning is imprecise
      detail: >-
        Section 5 states "the expected number of useful collisions before
        a useless collision is O(P/2) / O(P/2) = O(1), so the overhead
        from useless collisions is constant." The notation O(P/2) / O(P/2)
        is sloppy and does not clearly explain why the overhead is
        constant. The correct argument: there are C(P/2,2) ~ P^2/8
        same-endpoint pairs (useless) and (P/2)^2 = P^2/4 cross-endpoint
        pairs (useful), so useful and useless pairs are both O(P^2) and
        equally numerous. The first collision is equally likely to be
        useful or useless, giving a factor-2 overhead that does not
        affect the exponent. The result (constant overhead) is correct;
        the reasoning should be restated more precisely in the KN-TECH
        entry.
  breakthrough_claim_detected: false
  official_state_changed: false
