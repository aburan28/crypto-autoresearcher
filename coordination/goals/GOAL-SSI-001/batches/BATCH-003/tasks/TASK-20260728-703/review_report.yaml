  verdict: SUPPORT
  claim_under_review: |
    The corrected derivation note (TASK-20260728-701) claims that the F1 fix
    (per-processor walk-function variation via seeded hash functions
    h_i(x) = H(i || x) mod (l+1), with P/2 distinct functions from E_0 and
    P/2 from E_1) correctly restores P = p^{1/4} useful processors for the
    van Oorschot-Wiener distinguished-point collision search on the
    supersingular l-isogeny graph, confirming the VW full-cost exponents at
    p^{1/2} (F_{p^2}) and p^{1/4} (F_p conditional on unproven F_p subgraph
    mixing). It claims that N1-N4 from the BATCH-002 red-team review are all
    reconciled, that the MITM (p^{2/3}) and Delfs-Galbraith (p^{1/3})
    full-cost exponents are unchanged and correct, and that the complete
    matched-baseline package (MITM/DG/VW full-cost exponents + VW analogue
    definition + matched-baseline recommendation) is coherent and ready for
    KN-TECH promotion.
  exact_supported_final_claim: |
    The F1 fix is correct and complete. The seeded hash construction
    h_i(x) = H(i || x) mod (l+1) produces P genuinely distinct walk
    functions (not merely l+1 constant edge selectors), because at each
    vertex the edge selected depends on both the j-invariant x and the
    processor seed i. Different seeds produce different pseudo-random edge
    selections at each vertex, so walks from the same starting curve
    diverge after O(1) steps with probability 1 - (1/(l+1))^t. With P/2
    walks from E_0 and P/2 from E_1, a collision between any E_0-walk and
    any E_1-walk yields a path E_0 -> E_1, restoring P = p^{1/4} useful
    processors (F_{p^2}) or P = p^{1/8} (F_p). The re-derived VW full-cost
    exponents are confirmed: p^{1/2} for F_{p^2} (P=p^{1/4}, T=p^{1/4},
    clock cycle O(1) from per-processor storage, hardware O(p^{1/4}),
    full cost p^{1/4} * p^{1/4} = p^{1/2}) and p^{1/4} for F_p (P=p^{1/8},
    T=p^{1/8}, full cost p^{1/8} * p^{1/8} = p^{1/4}, conditional on
    unproven F_p subgraph mixing). The MITM full-cost exponent p^{2/3}
    (F_{p^2}) and DG full-cost exponent p^{1/3} (F_p) are unchanged and
    correct. All four nonfatal objections N1-N4 are correctly reconciled.
    The complete matched-baseline package is coherent and ready for KN-TECH
    promotion, subject to Coordinator verification of promotion gates and
    three nonfatal objections recorded below. The birthday bound
    O~(sqrt(|V|)) on the Ramanujan graph is a heuristic application of the
    birthday paradox to mixed walks (not a direct transfer of Wiener's
    group theorem), correctly acknowledged as heuristic in limitation 5.
    The F_p variant is additionally conditional on unproven mixing of
    G_l^{F_p}, with DG at p^{1/3} as the unconditional fallback. No
    breakthrough claim is made; no sub-p^{1/4} break is claimed; no
    official state is changed.
