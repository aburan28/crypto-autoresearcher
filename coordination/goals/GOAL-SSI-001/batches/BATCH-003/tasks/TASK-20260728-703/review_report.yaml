  f1_fix_verification: |
    CORRECT AND COMPLETE. The F1 fix describes per-processor walk-function
    variation using seeded hash functions: h_i(x) = H(i || x) mod (l+1),
    where i is the processor seed and x is the j-invariant. This produces
    P genuinely distinct walk functions, NOT merely l+1 constant edge
    selectors. At each vertex, the edge selected depends on both the
    j-invariant and the seed, so different seeds yield different
    pseudo-random edge selections. Two walks from E_0 with different seeds
    diverge after O(1) steps with probability 1 - (1/(l+1))^t. The
    retraction of "the walk function is fixed and shared by all processors"
    is explicit (section 5, "Retraction (F1 fix)"). P = p^{1/4} useful
    processors is correctly restored: P/2 from E_0, P/2 from E_1. A
    collision between any E_0-walk (using h_i) and any E_1-walk (using h_j)
    yields a path E_0 -> E_1, because the walks are deterministic given
    their hash functions and starting curves. The reconstruction correctly
    records the walk-function index, enabling the correct deterministic
    walk to be re-run. The "distinct hash functions" concern (that l=2
    gives only 3 possible edge selections) is NOT a fatal objection: the
    hash functions are seeded pseudo-random functions on F_{p^2} ->
    {0,...,l}, not constant selectors. At each vertex there are l+1
    possible edges, but the function h_i selects which one based on both i
    and x, giving P distinct functions. The useless-collision overhead
    (E_0-E_0 or E_1-E_1 collisions) is constant: useful and useless pairs
    are both O(P^2), so the first collision is equally likely to be useful
    or useless, giving a factor-2 overhead that does not affect the
    exponent. The walk independence is acknowledged as heuristic
    (limitation 5: "A formal proof that the P/2 + P/2 walks cover the
    birthday bound would require analysis of the joint distribution").
  n1_reconciliation: |
    CORRECTLY RECONCILED. The corrected derivation explicitly states that
    the clock cycle for VW is set by per-processor storage O(1), not the
    shared table, because the table is accessed only at distinguished
    points (once every 2^d steps). The amortized table-access cost per
    walk step is O(S^{1/3}/2^d) = O(p^{1/12}/p^{1/4}) = O(p^{-1/6}), which
    is subconstant and does not affect the clock cycle. Even if charged at
    O(S^{1/3}) per access, table accesses occur O(1) times per processor,
    contributing O(p^{1/12}) to wall-clock -- dominated by the O~(p^{1/4})
    walk steps. The tau column is reconciled: the table linear dimension
    p^{1/12} is listed but explicitly marked "does NOT set clock cycle."
    This is Wiener's explicit theorem (KN-LIT-094): "parallel collision
    search retains its asymptotic advantage because per-processor storage
    is small." The result (full cost p^{1/2}) is correct; the reasoning is
    now internally consistent. Section 4 of the corrected derivation also
    generalizes the clock-cycle definition: "For algorithms that access a
    table of S entries at every step, the clock cycle is tau = S^{1/3}.
    For algorithms with only local (O(1)) per-step storage, the clock cycle
    is O(1)." This cleanly separates the MITM and VW cases.
  n2_reconciliation: |
    CORRECTLY RECONCILED. Both the corrected derivation note and the
    corrected YAML use "recomputed kernels" / "kernels recomputed during
    reconstruction" throughout, replacing the BATCH-002 "stored kernels"
    phrasing. The derivation note (section 5, step 4 of reconstruction)
    states: "the kernel K is recomputed from h_i(j(E)) mod (l+1) (for
    walk A) or h_j(j(E)) mod (l+1) (for walk B) -- kernels are not stored
    (N2 fix)." The YAML states: "Kernels are recomputed at each step from
    h_i(j(E)) mod (l+1) during the reconstruction re-run -- not stored
    (N2 fix: 'recomputed kernels,' not 'stored kernels')." No per-step
    kernel storage is implied. The polynomial-space claim is preserved.
  n3_reconciliation: |
    CORRECTLY RECONCILED. The isogeny degree l is specified as a small
    fixed prime (l = 2 for CGL) in section 1 and section 5 of the
    derivation note, and in the YAML walk_model fields. The derivation
    states: "Computing E[l] via the l-division polynomial and enumerating
    its (l+1) subgroups of order l is polynomial in log p for fixed small
    l. All per-step costs in this note assume fixed small l; the exponents
    are in p, not in l." This is correct: the l-division polynomial has
    degree O(l^2) = O(1) for fixed l, and Velu's formulas involve O(l) =
    O(1) field operations.
  n4_reconciliation: |
    CORRECTLY RECONCILED. The corrected derivation explicitly states
    (section 5, "Mixing-time assumption (N4)"): "The O~(sqrt(|V|))
    birthday bound assumes that O(log p) mixing steps have occurred before
    a collision is expected (Ramanujan property of G_l, KN-TECH-024).
    After O(log p) steps, the walk distribution is close to uniform on V,
    and the birthday bound applies. If a collision occurs before mixing
    (short paths), the birthday constant may differ, but the exponent is
    unaffected." This is also noted in limitation 4 and in the YAML
    vw_mixing_assumption fields. The F_p subgraph caveat (G_l^{F_p} not
    known to be Ramanujan) is correctly stated as a stronger heuristic
    assumption with DG fallback at p^{1/3}.
  mathematical_correctness:
    vw_full_cost_exponent_f_p2: >-
      CORRECT. With the F1 fix: P = p^{1/4} useful processors (P/2 from
      E_0, P/2 from E_1), total walk steps O~(sqrt(|V|)) = O~(p^{1/2}),
      steps per processor p^{1/2}/p^{1/4} = p^{1/4}. Clock cycle O(1)
      (per-processor storage, N1 reconciliation). Wall-clock O~(p^{1/4}).
      Hardware O(p^{1/4}) (processors + table). Full cost p^{1/4} *
      O~(p^{1/4}) = O~(p^{1/2}). Confirmed at the BATCH-002 value.
      Without the fix: P=2, wall-clock O~(p^{1/2}), full cost O~(p^{3/4}),
      worse than MITM's p^{2/3}. The F1 fix is essential.
    vw_full_cost_exponent_f_p: >-
      CORRECT (conditional on mixing). With the F1 fix: P = p^{1/8} useful
      processors on the F_p subgraph (|V^{F_p}| ~ sqrt(p)), total walk
      steps O~(sqrt(|V^{F_p}|)) = O~(p^{1/4}), steps per processor
      p^{1/4}/p^{1/8} = p^{1/8}. Clock cycle O(1). Wall-clock O~(p^{1/8}).
      Hardware O(p^{1/8}). Full cost O~(p^{1/4}). Confirmed at the
      BATCH-002 value, conditional on unproven F_p subgraph mixing.
      Without the fix: P=2, wall-clock O~(p^{1/4}), full cost O~(p^{3/8}),
      worse than DG's p^{1/3} (3/8 > 1/3). The F1 fix is essential.
    mitm_full_cost_exponent: >-
      CORRECT (unchanged). Table of p^{1/2} entries, clock cycle p^{1/6}
      (set by table; every step accesses it), optimal P = p^{1/2},
      wall-clock p^{1/6}, hardware p^{1/2}, full cost p^{1/2} * p^{1/6} =
      p^{2/3}. Matches Wiener BSGS result with n = |V| ~ p. Confirmed by
      RT-20260727-603 (check 2a).
    dg_full_cost_exponent: >-
      CORRECT (unchanged). DG is MITM on the F_p subgraph of |V^{F_p}| ~
      sqrt(p) vertices. Table of p^{1/4} entries, clock cycle p^{1/12}
      (set by table), optimal P = p^{1/4}, wall-clock p^{1/12}, hardware
      p^{1/4}, full cost p^{1/4} * p^{1/12} = p^{1/3}. Matches Wiener
      BSGS result with n = sqrt(p). Confirmed by RT-20260727-603
      (check 2b).
  knowledge_promotion_assessment: |
    The complete matched-baseline package is coherent and ready for KN-TECH
    promotion, subject to Coordinator verification of promotion gates
    (archived proof decomposition, validated heuristics, independent
    review, red-team pass) and the three nonfatal objections below. The
