        - target: https://link.springer.com/content/pdf/10.1007/s00145-003-0213-5.pdf
          outcome: >-
            FAILED. 303 redirect to idp.springer.com/authorize, a paywall
            authorization endpoint.
      finding: >-
        NOTHING WAS OBTAINED FROM WIENER'S OWN TEXT IN THIS SESSION. The question
        RC5 asks is exactly as open as before.
      in_repo_observation_costing_nothing: >-
        KN-LIT-094 carries confidence established and citation_verified read, but
