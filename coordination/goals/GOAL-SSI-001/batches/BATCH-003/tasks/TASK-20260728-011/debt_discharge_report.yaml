  objections:
    - id: O1
      severity: nonfatal_but_heuristic_inventory_defect
      target: >-
        Erratum section 2.2 heuristic H1-prime, as consumed by sections 2.4, 3.2
      title: >-
        H1-prime is numbered as a total-variation statement, but three downstream
        steps need an L2 statement, which is strictly stronger
      detail: |-
        TV smallness does not control a pairwise collision probability. Concrete
        counterexample, pen and paper, zero compute. Let mu place mass
        1/n_V + delta on one distinguished vertex and redistribute the deficit
        uniformly. Then TV(mu, U) is about delta, which satisfies H1-prime for
        delta = p^{-1/4}, since that is p^{-Omega(1)}. Yet
          sum_v mu(v)^2 = 1/n_V + delta^2 = Theta(p^{-1}) + Theta(p^{-1/2})
                        = Theta(p^{-1/2}),
        a collision probability inflated by a factor Theta(p^{1/2}) over 1/n_V. So
        a distribution satisfying H1-prime AS STATED can inflate C by a polynomial
        factor. This does not overturn D1, because the true bound is the L2 one and
        that bound is already displayed inside the erratum's own section 2.1(i) as
        the PROOF of H1-prime. But downstream lemmas cite H1-prime, not its proof,
        and H1-prime as numbered is strictly weaker than what section 2.4 uses.
      why_it_matters: >-
        This is the heuristic-inventory failure mode agents/red-team.md item 1
        exists to catch. A numbered heuristic must be strong enough for everything
        that cites it; here it is not, and the gap was invisible because the same
        session wrote both the proof and the statement.
      cost_to_fix: One paragraph. Zero compute.

    - id: O2
      severity: nonfatal_quantifier_defect_no_exponent_moves
      target: Erratum section 3.2, the Algorithm 3-prime descent hitting probability
      title: >-
        The descent needs eps greater than 1/2, not eps greater than 0
      detail: |-
        Section 3.2 argues each restart hits V_p with probability
        (1+o(1)) S/n_V = p^{-1/2+o(1)} "under H1-prime", with S = p^{1/2+o(1)}.
        Check the error term. With e = mu_d - U,
          | mu_d(V_p) - S/n_V | = | sum_{v in V_p} e(v) | <= sqrt(S) * ||e||_2
                                <= sqrt(p^{1/2}) * poly(log p) * ell^{-d/2}
                                =  poly(log p) * p^{1/4} * p^{-(1+eps)/2}
                                =  poly(log p) * p^{-1/4 - eps/2}.
        For this to be o(S/n_V) = o(p^{-1/2}) one needs 1/4 + eps/2 > 1/2, that is
        eps > 1/2, equivalently d > (3/2) log_ell p. At eps just above 0 the error
        term DOMINATES the quantity being estimated. The TV route is worse still,
        since TV <= poly * p^{-eps/2} exceeds p^{-1/2} for every eps below 1.
      impact: >-
        NONE ON ANY EXPONENT. d = (3/2 + delta) log_ell p is still Theta(log p) and
        is absorbed in the same o(1). The correction is to the QUANTIFIER, exactly
        as the erratum's own c > 1 correction was to v1. It is nevertheless a real
        defect: the erratum fixed v1's unquantified c and then reintroduced an
        insufficient quantifier one section later.

    - id: O3
      severity: nonfatal_framing
      target: Erratum section 5 item 1, and baseline_recommendation_v2 disagreements block
      title: The D1 disagreement is framed as substantive when it is bookkeeping
      detail: >-
        The erratum calls D1 "the one substantive point on which I differ from the
        review". D1 is correct, but nothing downstream consumes C, so correcting it
        changes no cost, no exponent and no verdict. Recording it as substantive
        risks a downstream reader inferring that the memory-independence conclusion
        turned on it. It did not; it turns on Lemma 4-prime(b), which the same
        erratum introduced and which no session had checked until this one.

    - id: O4
      severity: nonfatal_but_it_is_the_reason_D2_was_load_bearing
      target: Erratum section 2.4(b), the side-bit independence sentence
      title: A false lemma step that happens to have a true conclusion
      detail: >-
        See debt item D2. The stated reason is wrong, the conclusion is right, and
        the correct reason is a uniformity-across-conditionings argument rather
        than an independence argument. A conclusion reached by an invalid step is
        not confirmed until someone supplies a valid one, and until this session
        nobody had.

    - id: O5
      severity: nonfatal_sourcing
      target: KN-LIT-078, and every figure relayed through KN-TECH-029 from it
      title: The abstract that KN-LIT-078 relays is not a stable object
      detail: >-
        Two retrievals under the identifiers KN-LIT-078 lists returned two
        different abstracts, one of which contains no p^{1/4} figure at all. See
        debt item D3. Any F_p figure in this program is therefore relayed from an
        unstable source and must keep its relayed_from_abstract label until the
        paper itself is read.

  required_controls:
    - id: RC8
      title: Restate H1-prime in L2 or collision (Renyi-2) form
      detail: >-
        Replace the total-variation statement with
        ||mu_d - U||_2 <= poly(log p) ell^{-d/2}, from which the TV form follows by
        Cauchy-Schwarz but not conversely. Three downstream steps need the L2 form
        and not the TV form, namely Lemma 4-prime(a), Lemma 4-prime(b) cause 1, and
        the descent hitting probability.
      cost: One paragraph, pen and paper, zero compute.
      blocks: Nothing. It is a restatement, and every affected number is unchanged.

    - id: RC9
      title: Restate the descent walk length at d >= (3/2 + delta) log_ell p
      detail: >-
        Or state the hitting-probability requirement as its own numbered heuristic
        separate from H1-prime. See objection O2.
      cost: One line, zero compute.
      blocks: Nothing. No exponent moves.

    - id: RC10
      title: >-
        Pre-register the side-dependence experiment, not the side-independence
        experiment
      detail: >-
        The cheapest discriminating control for Lemma 4-prime(b) is to measure
        whether the collision rate depends on the side configuration - that is,
        whether Pr[collision | side 1, side 2] differs from
        Pr[collision | side 1, side 1] by more than a 1+o(1) factor - NOT whether a
        side bit correlates with its own endpoint, which it provably does and
        harmlessly. This supersedes the falsification condition the erratum's
        H4-prime states. It belongs in RC7's pre-registration, and it must state in
        place that toy-scale sampling validates nothing at cryptographic scale.
      cost: Design only. This card authorizes no run and performs zero curve compute.

    - id: RC4
      title: Delfs-Galbraith primary source
      status: STILL_OPEN
      residue: >-
        The quantitative inner-search memory figure, the F_p-rationality criterion,
        and the headline p^{1/4} figure itself. See debt item D3.

    - id: RC5
      title: Wiener attribution for n^{2/3}
      status: STILL_OPEN
      residue: >-
        Everything. Four fetch attempts, all recorded in debt item D4, none
        returning the paper's own text. The cheapest remaining route is an
        institutional copy of J. Cryptology 17(2), 105-124, or a working mirror of
        cr.yp.to/2005-590/wiener.pdf that does not trip the Content-Length and
        Transfer-Encoding conflict.

  counterexample_or_mutation: >-
    The cheapest counterexample in this report is the one in objection O1, and it
    costs a sheet of paper. Take mu placing mass 1/n_V + p^{-1/4} on a single
    vertex and uniform elsewhere. It satisfies H1-prime as numbered, yet its
    collision probability exceeds 1/n_V by a factor Theta(p^{1/2}). That single
    distribution shows the numbered heuristic does not license the constant three
    downstream lemmas draw from it. No computation, no curve, no graph.

  baseline_comparison: >-
    Nothing in the discharged debt beats or matches a new baseline, and nothing
    should be read as if it did. Lemma 4-prime(b)'s Theta(1) usable fraction is the
    same factor-of-two loss the standard van Oorschot-Wiener meet-in-the-middle
    already takes from the same side-bit device; the resulting p^{1/2+o(1)} at
    polylog memory is exactly what van Oorschot-Wiener composed with the classical
    path-finding baseline already gives, and the archived primary text names that
    point directly at paper_fulltext.md line 39, "the classic p^{1/2+o(1)}
    algorithms with polynomial memory like [21]". Against Pollard-rho and BSGS the
    comparison is not applicable in kind - this is a claw-finding problem on an
    isogeny graph, not a discrete logarithm in a cyclic group - but the relevant
    structural point transfers: the memory-independence result is a NEGATIVE result
    about attacks (memory buys nothing when claws are abundant), and a theorem that
    a resource does not help is not an attack mechanism. The closest specialized
    baseline, Delfs-Galbraith on F_p-rational instances at Otilde(p^{1/4}), is
    untouched by everything in this report and remains at relayed_from_abstract
    confidence after RC4.

  heuristic_challenges:
    - id: HC1
      target: H1-prime
      challenge: >-
        See objection O1. Numbered as TV, consumed as L2. The random-model
        justification is real - the Ramanujan spectral gap is a rigorous bound on
        the object - but the heuristic as WRITTEN does not carry it to the three
        places that cite it.
    - id: HC2
      target: H4-prime, falsification condition
      challenge: >-
        The stated falsification condition tests the wrong quantity. See required
        control RC10.
    - id: HC3
      target: H3-prime, the F_p-subgraph analogue
      challenge: >-
        Correctly quarantined by the erratum, which states that V_p carries
        class-group structure rather than the full Ramanujan structure and does not
        claim H3-prime follows from KN-TECH-024. I raise no objection, and I note
        that objection O2's error-term arithmetic would need redoing inside V_p
        before any H3-prime figure is quoted quantitatively.
    - id: HC4
      target: Heuristic 1 of the archived source
      challenge: >-
        Correctly quarantined throughout, including in my KN-TECH-056 draft. This
        program has neither validated nor challenged it and holds no evidence
        bearing on it. No conditional statement was written as unconditional in
        anything I read.
    - id: HC5
      target: Scale honesty, AGENTS rule 7
      challenge: >-
        NOT APPLICABLE AND CORRECTLY SO. Zero curve compute across BATCH-002 and
        this card. There is no toy-scale-presented-as-crypto-scale defect because
        there is no scale at all. RC10 and RC7 carry the requirement forward to the
        first card that actually computes.

  cost_model_challenges:
    - id: CM1
      challenge: >-
        Per-attempt cost times inverse success probability. I checked this
        explicitly and found NO instance of per-attempt cost quoted as total
        expected cost. Lemma 5-prime's T(k) = sqrt(2 M-prime k) is the birthday
        accumulation, not a per-attempt figure; Lemma 7-prime composes k = Theta(1)
        from 4-prime(b) with Lemma 5-prime; Algorithm 3-prime composes
        p^{1/2+o(1)} expected restarts with Theta(log p) steps each, which is the
        inverse-success-probability multiplication done explicitly. This is the
        artifact's strongest accounting discipline.
    - id: CM2
      challenge: >-
        The van Oorschot-Wiener time-memory interpolation back to the old baseline
        is present and quoted verbatim from the source at line 39, and the
        memory-independence result is stated as a position ON that curve rather
        than as an escape from it. I raise no objection. I do object to any
        downstream use of the provisional FULL-COST figures as thresholds: they sit
        above a superpolynomial o(1) the source's own authors disclose at line 39,
        so a candidate measured against them is measured against a threshold nobody
        can evaluate at any realisable p. The BATCH-003 queue already forbids this
        and I endorse the prohibition.
    - id: CM3
      challenge: >-
        Memory is charged beside time everywhere I checked, including in the
        KN-TECH-056 draft, where the conditional tier's p^{1/3+o(1)} MEMORY is
        carried in the same sentence as its time. The one place memory is asserted
        rather than sourced is the Delfs-Galbraith inner search, which RC4 leaves
        open, and the KN-TECH-056 draft correspondingly declines to supersede the
        F_p line.

  reduction_and_scope_challenges:
    - id: RS1
      target: Corollary 1.2 of the archived source, via [35, Theorem 1] and [35, Proposition 8.5]
      challenge: >-
        I read lines 21 and 23 of paper_fulltext.md myself and confirm the corollary
        is stated as CONDITIONAL on Heuristic 1 and as obtained by citing those two
        reductions. I did NOT verify the cited theorems' hypotheses against [35],
        which is not in this repository, and I do not assert that they transfer. The
        KN-TECH-056 draft states the corollary as the source states it and claims no
        more. NOT VERIFIED, recorded as such.
    - id: RS2
      target: Affected-versus-safe scheme scope, lines 31 to 37
      challenge: >-
        The source names CGL, the SQIsign family, GPS signatures, PRISM and
        tensor-MIKE as affected, and CSIDH and other group-action constructions,
        plus M(D)-SIDH, FESTA and POKE, as out of range on the stated ground that
        "other cryptanalytic algorithms dominate the security analysis of these
        schemes". That is a safe-because-a-different-attack-dominates justification,
        which is the correct form. My KN-TECH-056 draft quotes it, attributes it to
        the source rather than to this program, and instructs that it not be
        widened. NO SCOPE INFLATION FOUND in the artifacts I read.

  narrowest_supported_statement: >-
    On the restated sizing of the BATCH-002 erratum, the cross-side claw count
    satisfies C = omega(M) and not C = Theta(M), so RT-20260728-007's
    note_on_lemma_4_robustness is wrong on its repaired-regime half and right on
    its near-bijective half; the correction has no downstream cost consequence.
    Separately, a Theta(1) fraction - specifically 1/2 - o(1) - of detected
    f-collisions are usable cross-side claws, so k = Theta(1) and the erratum's
    memory-independence conclusion STANDS, but it stands on an argument supplied in
    THIS session rather than on the one the erratum gives, whose independence step
    is false as written. Both statements are model-internal, conditional on the
    Ramanujan L2 bound and on the PRF model for h, and both concern a construction
    this repository specified rather than any published algorithm. RC4 is partially
    closed with a finding that the published Delfs-Galbraith descent is one long
    walk rather than restarts; RC5 returned nothing and stays open. No exponent
    moves, nothing is broken, and NONE OF THIS IS A CRYPTANALYTIC RESULT. BATCH-003
    satisfies no GOAL-SSI-001 completion criterion on the strength of this card, and
    this card detects no new attack mechanism.

  new_attack_mechanism_detected: false
  new_attack_mechanism_basis: >-
