  debt_items:

    - id: D1
      gate: D1
      title: >-
        Is the cross-side claw count C equal to omega(M), as the erratum claims,
        or Theta(M), as RT-20260728-007 note_on_lemma_4_robustness claims?
      verdict: CONFIRMED_FOR_THE_ERRATUM
      derived_in_this_session: true
      derivation_locator: independent_check_note.md section 1.2
      derivation_summary: |-
        Restated sizing: |I| = Theta(p^{1+eps}) per side, M = |D| = 2|I| =
        Theta(p^{1+eps}), n_V = Theta(p). Let mu_1, mu_2 be the two endpoint laws
        on V and e_i = mu_i - U. By linearity of expectation over the |I|^2
        cross-side pairs,
          E[C] = |I|^2 * sum_v mu_1(v) mu_2(v) = |I|^2 * ( 1/n_V + <e_1,e_2> ).
        Cauchy-Schwarz gives |<e_1,e_2>| <= ||e_1||_2 ||e_2||_2, and the Ramanujan
        L2 bound displayed in the erratum's own section 2.1(i) gives
        ||e_i||_2 <= poly(d) ell^{-d/2}, so
          |<e_1,e_2>| <= poly(log p) * Theta(p^{-(1+eps)}) = o(1/n_V),
        because poly(log p) is much smaller than p^{eps}. Hence
          E[C] = (1 +- o(1)) |I|^2 / n_V = Theta(p^{1+2eps}),
        and C/M = Theta(p^{eps}) which tends to infinity. Therefore C = omega(M).
      alternative_readings_checked: |-
        Reading 1, M = |D| = Theta(p^{1+eps}):  C/M  = Theta(p^{eps})  -> infinity.
        Reading 2, M = |im f| = Theta(n_V) = Theta(p):  C/M = Theta(p^{2eps}) -> infinity.
        Under both readings of M the review's C = Theta(M) fails. A third reading
        in which C counts DISTINCT doubly-hit vertices rather than pairs gives
        C = Theta(n_V) = Theta(p) = o(M), so the DIRECTION of the failure flips
        with the definition while Theta(M) is wrong on every reading. The
        pair-counting definition is the correct one, because it is the
        golden-collision multiplicity the van Oorschot-Wiener bookkeeping consumes.
      review_half_that_is_correct: >-
        The review's near-bijective half is right. At v1's sizing |I| = Theta(n_V),
        the same formula gives C = Theta(n_V) = Theta(M/2) = Theta(M). The review
        erred only in extending that to the repaired regime.
      consequence_for_note_on_lemma_4_robustness: >-
        WITHDRAWN, not merely narrowed. The erratum's decision to retire C = Theta(M)
        rather than carry it forward is correct and should stand.
      downstream_weight: NIL
      downstream_weight_reason: >-
        Neither Lemma 5-prime nor Lemma 7-prime consumes C. What Lemma 5-prime
        consumes is k, the number of detected collisions to be sifted, and
        k = Theta(1/rho) where rho is the usable fraction of Lemma 4-prime(b). C
        appears only as a qualitative statement that claws are abundant, which is
        true on every reading. D1 is a bookkeeping correction with no downstream
        consequence, and the erratum's framing of it as its one substantive
        disagreement overstates the stake. The genuinely load-bearing item is
        Lemma 4-prime(b), which no session had checked at all.

    - id: D2
      gate: D2
      title: >-
        Lemma 4-prime(b) - is a Theta(1) fraction of detected f-collisions usable
        cross-side claws?
      verdict: CONFIRMED_IN_CONCLUSION_PROOF_REFUTED_AS_WRITTEN
      derived_in_this_session: true
      derivation_locator: independent_check_note.md sections 2.2, 2.3, 2.4
      step_one_two_disjoint_causes: >-
        HOLDS, modulo objection O1. Cause 1, g(y) = g(y-prime), has rate
        (1 +- o(1))/n_V = Theta(p^{-1}); cause 2, an h-collision on distinct
        vertices, has rate 1/|D| = Theta(p^{-1-eps}). Ratio Theta(p^{-eps}), so a
        1 - O(p^{-eps}) fraction of detected f-collisions have cause 1. I add a
        robustness check the erratum does not make. At eps = 0 the two rates are
        comparable and the genuine fraction drops to a constant strictly below 1
        but is still Theta(1), so the conclusion is not an artifact of taking eps
        bounded away from zero.
      step_two_side_bit_argument: |-
        THE ARGUMENT AS WRITTEN IS FALSE. The erratum says each covered point's
        side bit is b(.) at its predecessor's endpoint "and is therefore
        independent of the endpoint that collides". Let u = g(pred(y)). Then
        y = h(u) = (b(u), i(u)), so side(y) = b(u) AND g(y) is the endpoint of
        walk i(u) starting from E_{b(u)}. The colliding endpoint g(y) is a
        FUNCTION of b(u): change the side bit and you walk from a different base
        curve. side(y) and g(y) are dependent, not independent.
      step_two_correct_argument_supplied_here: |-
        The conclusion survives by conditioning rather than by independence.
        Condition on (b(u), b(u-prime)) = (beta, beta-prime) in {1,2}^2. Given
        that, g(y) is the length-d endpoint from E_beta at index i(u) and
        g(y-prime) likewise from E_{beta-prime} at index i(u-prime); u is not
        equal to u-prime, since u = u-prime would force y = y-prime. By the same
        L2 computation as D1 applied to the pair (mu_beta, mu_{beta-prime}),
          Pr[ g(y) = g(y-prime) | beta, beta-prime ] = (1 +- o(1))/n_V
        IDENTICALLY, to relative o(1), for all four side configurations. Bayes
        then gives Pr[ beta not equal beta-prime | collision ] =
        Pr[ beta not equal beta-prime ] * (1 +- o(1)) = 1/2 - o(1). Combining with
        step one, rho = 1/2 - o(1) = Theta(1).
      why_the_distinction_matters: >-
        The falsification condition changes. What would break 4-prime(b) is not a
        correlation between a side bit and its own endpoint - that correlation is
        present and harmless - but a SIDE-DEPENDENT BIAS IN THE COLLISION RATE,
        that is Pr[collision | 1,2] differing from Pr[collision | 1,1] by more
        than a 1+o(1) factor. That is a different experiment from the one the
        erratum's falsification condition names, and it is the one that should be
        pre-registered under RC7.
      smaller_gaps_closed_not_objections: |-
        Trail heads have no predecessor and take their side bit from the start
        distribution; they are a 1/L fraction and the argument applies to them
        under a uniform start. Degenerate pairs with beta = beta-prime and
        i(u) = i(u-prime) give y = y-prime and are excluded. Same-side genuine
        claws certify an endomorphism-like cycle at E_beta rather than a path
        E_1 -> E_2 and are correctly discarded; the loss is exactly the factor 2.
      what_breaks_if_4_prime_b_fails: |-
        Let rho be the true usable fraction, so k = Theta(1/rho), and feed that
        into Lemma 5-prime with M-prime = Theta(p).
        rho = Theta(1):        k = Theta(1). First branch for EVERY w >= 2, so
                               T = Theta(sqrt(M-prime)) = Theta(p^{1/2}), w-free.
                               MEMORY-INDEPENDENCE HOLDS.
        rho = 1/polylog(p):    k = polylog. First branch for every w >= 2k, so
                               T = p^{1/2+o(1)} still. MEMORY-INDEPENDENCE
                               DEGRADES to "independent of w above a polylog
                               floor"; the exponent is unchanged. Survives.
        rho = p^{-delta}:      k = p^{delta}. At polylog w this is the SECOND
                               branch, T = Theta(p^{1/2+delta}/sqrt(w)),
                               explicitly w-DEPENDENT and worse than p^{1/2} at
                               polylog memory. MEMORY-INDEPENDENCE FALLS, and one
                               needs w of order p^{2delta} merely to recover
                               p^{1/2+o(1)}.
        The threshold is therefore sharp: memory-independence requires
        rho >= 1/polylog(p) and fails exactly when rho is polynomially small. My
        derivation puts rho = 1/2 - o(1), above the threshold with polynomial
        margin. This is the one place in the artifact where an error would have
        cost an exponent, and it does not.
      narrowest_valid_conclusion_if_it_did_fail: >-
        Only the IN-PLACE DERIVATION of a p^{1/2+o(1)} polynomial-memory algorithm
        would fall. The existence of one survives by citation to
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md line 39, read by me in this
        session, which names "the classic p^{1/2+o(1)} algorithms with polynomial
        memory like [21]". A failure of 4-prime(b) would be a failure of this
        repository's reconstruction, not of the baseline.
      scope_caveat: >-
        The side bit b is a design element this program specified in erratum
        section 2.3, not a property of any published algorithm. Confirming
        4-prime(b) confirms internal consistency of this repository's Algorithm 2.
        The 1/2 factor is the same factor the standard van Oorschot-Wiener
        meet-in-the-middle loses by the same device. Nothing here is new and
        nothing here beats a baseline.

    - id: D3
      gate: D3
      control: RC4
      title: Delfs-Galbraith from the primary source
      outcome: PARTIALLY_CLOSED_REMAINS_OPEN
      identifiers_used: >-
        arXiv:1310.7789; DOI 10.1007/s10623-014-0010-1. The IACR ePrint number was
        not used, per KN-LIT-078's own record that it could not be confirmed.
      attempts:
        - target: https://arxiv.org/abs/1310.7789
          outcome: >-
            RETURNED. Title, authors and an abstract verbatim. No memory figure,
            no p^{1/2} or p^{1/4} figure, no descent description.
        - target: https://arxiv.org/pdf/1310.7789
          outcome: >-
            FAILED. PDF retrieved, 325.2 KB, but the fetch tool could not extract
            text from the FlateDecode streams.
        - target: https://ar5iv.org/abs/1310.7789
          outcome: REDIRECT, 301 to ar5iv.labs.arxiv.org, not followed automatically.
        - target: https://ar5iv.labs.arxiv.org/abs/1310.7789
          outcome: RETURNED, in summary form with some quotation.
        - target: https://ar5iv.labs.arxiv.org/html/1310.7789
          outcome: RETURNED, with verbatim quotation of the passages requested.
      finding_b_descent: |-
        CLOSED, AND IT CONTRADICTS THE ERRATUM. Quoted from the section 4 passage
        returned:
          "Run random walks in the graph from E0 and E1 until we hit a
          supersingular curve defined over F_p."
          "Since the graph is an expander, we expect the walks to quickly be
          sampling uniformly from the graph, and so we expect to select a vertex
          in the subset of j in F_p with probability approximately
          p^(1/2)/p = 1/p^(1/2)."
        and, offered as an alternative rather than as the algorithm:
          "there should be a short path to the subset of j in F_p of length
          (1/2)log(p) so one could distribute a depth-first search through all
          short paths from E0."
        The published descent is ONE LONG RANDOM WALK, "until we hit", not the
        erratum's restart form. The erratum's section 3.2 restart repair is an
        IN-REPO SUBSTITUTE, not what the authors do. That is exactly the
        disjunction RC4 was written to settle.
      finding_b_consequence_and_its_limit: >-
        This vindicates the erratum's relabelling of C-alpha as CITED and
        strengthens rather than weakens its memory objection, since a single walk
        that must be composed is the object the erratum's Proposition 10 prices at
        Theta(p^{1/2}) memory, and the returned text states NO memory profile for
        the descent at all. What this does NOT license is any claim that
        Delfs-Galbraith is wrong. The stated Otilde(p^{1/4}) is a bit-operations
        claim, and whether the authors intend the descent walk to be stored,
        recomputed, or handled some third way is NOT settled by what I retrieved.
        I do not settle it.
      finding_a_inner_search_memory: >-
        PARTIALLY CLOSED. The returned text calls Algorithm 1 of section 3 a
        "high-storage bi-directional-search algorithm" maintaining two sets S_0
        and S_1 of visited vertices and testing their intersection, so the inner
        search is HIGH-STORAGE by the paper's own wording rather than a low-memory
        method. But the QUANTITATIVE figure was not obtained: the html retrieval
        reports explicitly that the paper contains no explicit statement of
        Algorithm 1's storage requirement beyond that phrase. The O(p^{1/4})
        storage figure that appeared in one retrieval was the fetch summariser's
        INFERENCE, not a quotation, and I do not adopt it.
      finding_c_rationality_criterion: >-
        UNRESOLVED. Two retrievals disagree. One reported a Proposition 2.4 reading
        "E is defined over F_p if and only if Z[sqrt(-p)] is contained in End E";
        the other reported that the paper does not explicitly state how
        F_p-rationality is tested in Algorithm 1. I record the disagreement rather
        than picking a side. Note also that "defined over F_p" and "j in F_p" are
        NOT the same condition, and the erratum's section 3.2 tests the latter;
        whether that matches the published criterion is UNVERIFIED.
      unexpected_observation_two_different_abstracts: >-
        The arXiv abs page returned an abstract ending "We give an algorithm to
        construct isogenies between such supersingular elliptic curves that works
        faster than the usual algorithm", containing NO p^{1/4} at all. The ar5iv
        retrieval quoted an abstract containing "works in O~(p^{1/4}) bit
        operations". These are not the same abstract. The likely explanation is an
        arXiv version difference between the 2013 preprint and the 2016 DCC
        version, but I DID NOT VERIFY THAT and do not assert it. What matters here
        is that KN-LIT-078 records its p^{1/2} and p^{1/4} figures as relayed from
        the abstract, and the abstract is not a stable object across the
        identifiers that entry lists. That is a stronger sourcing defect than the
        one the erratum recorded.
      confidence_labels_changed: NONE
      confidence_label_statement: >-
        No F_p confidence label is changed by this session. KN-LIT-078 and the
        BATCH-002 v2 record keep confidence relayed_from_abstract, which after the
        two-abstracts observation is if anything generous. RC4 stays OPEN on the
        quantitative inner-search memory, on the rationality criterion, and on the
        headline p^{1/4} figure.
      effect_on_the_F_p_ranking: >-
        NONE, as the card anticipated. This was a precision control and it behaved
        like one.

    - id: D4
      gate: D4
      control: RC5
      title: >-
        Does Wiener frame n^{2/3} as a textbook square-root balance or as an
        optimum over the table size?
      outcome: FAILED_REMAINS_OPEN
      attempts:
        - target: >-
            WebSearch, query "Wiener full cost of cryptanalytic attacks baby-step
            giant-step n^{2/3} optimum table size"
          outcome: >-
            RETURNED candidate locations only. The engine's own summary restated
            n^{2/3+o(1)}. A SEARCH SUMMARY IS NOT THE PAPER and I take no figure
            from it.
        - target: https://cr.yp.to/2005-590/wiener.pdf
          outcome: >-
            FAILED. Verbatim error, "Parse Error, Content-Length can't be present
            with Transfer-Encoding".
        - target: http://cr.yp.to/2005-590/wiener.pdf
          outcome: FAILED, identical error on retry over http.
        - target: https://www.cs.haifa.ac.il/~orrd/BlockCipherSeminar/IlyaEfanov.pdf
          outcome: >-
            RETRIEVED, 956.5 KB, AND DISCARDED. I opened pages 1 and 2 directly.
            It is a student seminar slide deck titled "The Full Cost of
            Cryptanalytic Attacks / Michael J. Wiener / Presented by Ilya Efanov /
            02.06.2013". THIRD-PARTY PRESENTATION, NOT THE PAPER. No figure taken
