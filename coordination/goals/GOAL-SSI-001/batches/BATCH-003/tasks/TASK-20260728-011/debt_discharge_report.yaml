        introduction's Shanks-versus-rho passage were read while "the per-attack
        derivations in Sections 3 onward were not re-derived". The corpus does not
        itself claim to have read the BSGS derivation, so the attribution question
        was never closed in-repo either.
      verdict_on_the_erratum_wording: CONFIRMED_NARROW_AND_CORRECT
      verdict_detail: >-
        "closed_within_SSI_FC_2026; external attribution pending RC5" should be
        kept verbatim and must NOT be widened to closed. I add one point the
        erratum does not make. The erratum's section 1.5 recovers n^{2/3} as the
        optimum over m under THIS REPOSITORY'S W2 convention, while KN-LIT-094
        reports n^{2/3+o(1)} under Wiener's own wiring model. Those are two
        different cost models reaching the same exponent, so agreement of the
        numbers is NOT evidence that the framings agree. Coincidence of exponents
