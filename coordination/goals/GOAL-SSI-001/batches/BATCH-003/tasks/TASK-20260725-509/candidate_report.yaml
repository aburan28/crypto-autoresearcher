candidate:
  id: IDEA-20260725-002
  title: >-
    Effective orientation from a known small-degree endomorphism vs KN-TECH-050
    path-finding baselines
  class: structure-attack
  target_problem: >-
    Supersingular endomorphism-ring / path-finding instances that publish a
    non-scalar endomorphism alpha on E0 of poly(log p) degree, without torsion
    images under a secret isogeny.
  target_open_problem: KN-OPEN-013
  mechanism_summary: >-
    Treat Z[alpha] as an effective imaginary-quadratic orientation of E0. When
    E1 is in the corresponding class-group orbit, recover a connecting ideal by
    classical Cl-vectorization (MITM/BSGS), charging each class-group action.
    Compare O~(sqrt(h)) to KN-TECH-050 matched baselines (F_p2 claw-PCS /
    MITM-full-cost; F_p Delfs-Galbraith). This probes the partial-endomorphism
    gap left by Wesolowski full-End equivalence (KN-LIT-074), not a SIDH torsion
    attack and not a cost-model re-baseline.
  assumptions:
    - Public non-scalar alpha in End(E0) of degree d = poly(log p); minimal polynomial known.
    - Instance is oriented: E1 lies in the Cl(Z[alpha]) orbit of E0, or the gate must fail closed if orbit membership is not public.
    - No torsion-point images under a secret isogeny; no free End(E1).
    - Class-group action evaluation cost is charged per step; large Cl tables charged under Wiener full-cost when applicable.
    - KN-TECH-050 baselines are the honest unoriented comparators.
  predictions:
    - metric: oriented_cl_cost_vs_claw_pcs
      direction: lower
      minimum_effect: >-
        Under at least one honest discriminant regime with public orbit
        membership, charged O~(sqrt(h)) is o(p^{1/2}) versus F_p2 claw-PCS.
    - metric: oriented_cl_cost_vs_delfs_galbraith
      direction: lower_or_not
      minimum_effect: >-
        Either identify a regime where O~(sqrt(h)) = o(p^{1/4}) versus DG, or
        document that F_p-rational oriented instances remain DG-dominated
        (including typical CSIDH-like Delta ~ -p).
  matched_baseline_comparison:
    reference: KN-TECH-050
    F_p2: claw_PCS_O~(p^{1/2})_or_MITM_full_cost_O~(p^{2/3+o(1)})
    F_p: delfs_galbraith_O~(p^{1/4})
    rule: >-
      Any material-advantage claim must beat the regime-appropriate baseline
      under the same cost convention; memory-free MITM is forbidden.
  full_cost_boundary:
    charged:
      - class-group action / isogeny-walk evaluations
      - Cl MITM or BSGS table memory under Wiener accounting when tables are large
      - orientation setup from alpha (polynomial-time algebraic work must be stated)
    not_charged_here:
      - torsion-image oracles (forbidden)
      - free full End(E1)
      - quantum Kuperberg queries (KN-OPEN-014 secondary lane, not selected)
      - SQIsign transcript leakage (deferred)
    cost_convention_name: kn_tech_050_matched_plus_charged_class_group_action
  cheapest_falsification_gate:
    type: derivation
    description: >-
      Zero-compute derivation: fix public (alpha, E0, E1) and orbit assumption;
      reduce to Cl-vectorization with charged action unit; under h ~ sqrt(|Delta|)
      compare sqrt(h) to KN-TECH-050 for poly-bounded |Delta| and CSIDH-like
      Delta ~ -p; emit MATERIAL_IN_SOME_REGIME, NEVER_BEATS_BASELINE, or
      REDUCTION_REQUIRES_UNCHARGED_ORACLE_OR_FULL_END.
    budget:
      wall_clock_seconds: 1800
      memory_gb: 2
      maximum_runs: 1
    falsifies_if:
      - Publishing alpha is End-equivalent / already baseline-cost path-finding.
      - Every honest orientation regime yields NEVER_BEATS_BASELINE.
      - Reduction requires torsion images or free End(E1).
  novelty_screen:
    against_knowledge_spine:
      - KN-TECH-050/029 fix unoriented baselines; do not cost effective-orientation Cl-vectorization for path-finding instances.
      - KN-TECH-027 records CSIDH oriented group action; this candidate targets path-finding/End instances with partial End on E0, not a new CSIDH quantum claim.
      - KN-LIT-074 equivalence is for full End; partial End residual is exactly KN-OPEN-013 structure gap.
      - KN-TECH-028 KLPT assumes trapdoor End/connecting ideal — stronger than one endomorphism on E0.
    against_known_sidh_attacks:
      - Not Castryck-Decru / Maino-Martindale / Robert (no torsion images).
      - Not GPST / Petit torsion misuse.
    dedup_verdict: >-
      Distinct from closed cost-model IDEA-20260725-001 and from SIDH breaks.
      Closest sibling is classical CSIDH vectorization; the novelty is the
      partial-endomorphism → oriented path-finding reduction under KN-TECH-050
      comparators, which BATCH-001 correctly rejected only as an untyped slogan.
  interpretation_limits:
    - Novelty-screen admission only; not a cryptanalytic break of CGL, SQIsign, or CSIDH.
    - Does not count toward GOAL-SSI-001 completion until a confirmed mechanism with charged advantage exists.
    - If derivation shows no regime beats baselines, demote to residual documentation under KN-OPEN-013.

