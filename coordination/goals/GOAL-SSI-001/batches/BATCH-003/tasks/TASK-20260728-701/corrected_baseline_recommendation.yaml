knowledge_promotion_note: >-
  Create a new KN-TECH entry (or update KN-TECH-029) to record the
  complete matched-baseline package in a single coherent promotion: (1)
  the full-cost exponents for MITM (p^{2/3} F_{p^2}) and Delfs-Galbraith
  (p^{1/3} F_p) under the Wiener 3D wiring model -- confirmed correct by
  RT-20260727-603, unchanged from BATCH-002; (2) the definition of the van
  Oorschot-Wiener distinguished-point collision search on the supersingular
  l-isogeny graph, including the corrected walk model (random l-isogeny
  steps with per-processor hash-function variation, F1 fix; l = small fixed
  prime, N3), distinguished predicate (leading-zero-bits on j-invariant),
  and collision-to-path reconstruction (distinguished-point segmenting +
  Velu duals from recomputed kernels with walk-function tracking, N2; no
  uncharged oracles); (3) the full-cost exponents for VW (p^{1/2} F_{p^2},
  p^{1/4} F_p conditional on mixing) -- re-derived with F1 fix and N1
  clock-cycle reconciliation, confirmed at BATCH-002 values; (4) the
  matched-baseline recommendation (VW, not MITM/DG, under full cost; F_p
  conditional on mixing with DG fallback at p^{1/3}); (5) the mixing-time
  assumption (N4) and its limitation. This fills the gap identified in the
  BATCH-001 candidate report: KN-TECH-029 records step-count exponents but
  does not apply Wiener full-cost accounting, and the isogeny-graph VW
  analogue was not present in the spine. The Coordinator must verify
  promotion gates (archived proof decomposition, validated heuristics,
  independent review, red-team pass) before promoting. This is a
  matched-baseline recommendation, not a breakthrough claim; no
  review-breakthrough review is required.
