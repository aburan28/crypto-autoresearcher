      source: experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-201692-001/raw-result.json
      formula: >-
        T(w) = T_full * sqrt(M / min(w, M));
        log2T(w) = log2T_full + 0.5*max(0, log2M-log2w) +
        c*sqrt(log2p).
      independent_derivation: >-
        For each field, log2T_full was recomputed as raw optimal log2M minus
        raw optimal log2P0. At log2w = log2M the penalty is zero, and for
        log2w > log2M the min/cap leaves T(w) equal to T_full. The displayed
        raw optimal log2T values agree with this anchor within decimal
        serialization residuals.
