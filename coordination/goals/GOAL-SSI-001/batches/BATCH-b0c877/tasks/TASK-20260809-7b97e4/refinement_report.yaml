refinement:
  id: TASK-20260809-7b97e4
  batch_id: BATCH-b0c877
  goal_id: GOAL-SSI-001
  candidate_id: IDEA-20260806-9c2f80
  successor_experiment: EXP-SSI-bf10ef
  predecessor_experiment: EXP-SSI-7b1469
  predecessor_snapshot_commit: 659a1a93ac53d9e03fb4fef1c9d58468d1b394a6
  status: design_only
  execution_authorized: false
  claim_ceiling: >-
    No observation, attack, security result, exponent change, novelty claim,
    hypothesis transition, or goal-completion claim is made. This report records
    a byte-contract repair and bounded self-audits only.
  repairs:
    - id: R1
      issue: registered_schema_metadata_mismatch
      repair: >-
        Made the v6 registry input and specification table carry the same 29
        tags, names, schema_digest slots, final-field codes, and digest names.
        Null schema and registry digests remain explicit admission blockers.
    - id: R2
      issue: top_level_vs_subrecord_ambiguity
      repair: >-
        Repeated the outer-frame grammar, classified every embedded record as
        an unframed subrecord, and defined PAYLOAD-v6 separately inside the
        helper payload blob. EDGE-TRANSITION-v6 is explicitly top-level only.
    - id: R3
      issue: advice_quantifier_and_source_oracle
      repair: >-
        Kept A_p target-free, made target-index construction phase 1, defined
        owner/order digest preimages, and gave source_domain_frame a typed
        domain-9 body with source algorithm and source-byte digests. Source
        reads are bounded and charged rather than implicit.
    - id: R4
      issue: finite_seed_and_terminal_replay
      repair: >-
        Bound every finite attempt to a unique indexed DOMAIN-v6 seed frame and
        gave stream_digest and terminal_digest dependency-breaking preimages
        with recomputed count equations. No finite-list uniformity claim is made.
    - id: R5
      issue: provider_and_semantic_edge_ceiling
      repair: >-
        Added a typed EDGE-ALGORITHM-v6 input manifest with opcode, witness,
        transcript, and implementation-receipt fields. Provider trust remains
        transport-only; missing algorithm implementation or independent edge
        replay is INVALID_CERTIFICATE and blocks freeze.
    - id: R6
      issue: deterministic_matrix_hnf_output
      repair: >-
        Repeated matrix, OP-v6, saturation, output, and HNF rules with fixed
        pivot/tie/remainder/overflow behavior and recomputation requirements.
        A digest-only asserted matrix or output is invalid.
    - id: R7
      issue: cost_and_memory_recomputability
      repair: >-
        Repeated the numeric event schedule, primitive charge table, exact
        EVENT-v6 and BUFFER-v6 widths, inclusive allocation convention, and
        complete buffer inventory. Missing buffers or charge rows are invalid.
    - id: R8
      issue: typed_replay_and_null_identity
      repair: >-
        Defined PAIR-REQUEST, arm, shared-prefix, final-identity, and bounded
        null-draw frames. Shared bytes are fixed and arm-specific bytes cannot
        enter shared_digest; rejected null draws are serialized.
    - id: R9
      issue: control_materialization_and_row_digest
      repair: >-
        Kept C-pair and synthetic controls as design manifests with no measured
        rows/cells, added exact 384-byte and 237-byte row grammars, and removed
        circular digest wording. Missing rows, cells, and receipts remain
        INVALID_CONTROL rather than negative evidence.
    - id: R10
      issue: incumbent_and_execution_boundary
      repair: >-
        Retained the independently verified incumbent as a hard comparison gate,
        set maximum_runs to zero, and kept frozen, execution_authorized, and
        evidence_eligible false.
  protected_history:
    - experiments/EXP-SSI-7b1469/specification.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-cdcf50/reviews/TASK-20260809-80c7d5/
    - coordination/goals/GOAL-SSI-001/batches/BATCH-cdcf50/reviews/TASK-20260809-68dca1/
    - ledger/evidence/EV-SSI-770b21.yaml
    - ledger/decisions/DEC-20260809-6c3274.yaml
  self_audits:
    yaml_parse: PASS
    registry_manifest_parity: PASS
    duplicate_tag_check: PASS
    duplicate_name_check: PASS
    exact_byte_checks: PASS
    execution_or_evidence: NOT_RUN
  hard_gates:
    - schema_digest and registry_digest materialization remain pending
    - EDGE-ALGORITHM-v6 implementation and independent replay remain absent
    - provider trust anchor remains null and blocks certificate admission
    - C-pair and synthetic measured rows remain absent and block control admission
    - incumbent measurement remains independently required
    - frozen, execution_authorized, and evidence_eligible remain false
  completion_gate:
    - independent Validator and Red Team review the snapshot commit
    - dispatcher validates every queue and archive transition
    - any dissent or incomplete finding is answered by a new immutable successor
