correction_derivation:
  id: TASK-20260809-238546
  goal_id: GOAL-SSI-001
  batch_id: BATCH-d03e96
  role: coordinator
  objective: >-
    Derive the narrowest qualitative successor to EV-SSI-59f7a2 from the
    immutable Section 4.1 source, the prior cost-model artifacts, and the
    committed SC-1/SC-3 standing conditions.
  predecessor:
    evidence_id: EV-SSI-59f7a2
    immutable: true
    treatment: supersede_only_the_unqualified_label_and_inference
  source_interpretation:
    section_4_1: >-
      Wesolowski Section 4.1 estimates the concrete cost of the table-based
      algorithm under the bound on P0, and explicitly calls 2^106.5 at
      log2(p) approximately 256 a rough lower bound obtained by charging one
      F_{p^2}-operation per table entry. It warns that table generation is
      underestimated and separately notes that the bound on P0 may not be
      tight. The passage is not a direct key-recovery measurement for SQIsign.
    prior_refinement: >-
      EV-SSI-59f7a2 records a toy-scale cost-model refinement and red-team
      conversion, preserving its quoted 2^{120-123} AES-equivalent bracket.
      This batch does not recompute, endorse, or alter that numerical bracket.
    transfer_boundary: >-
      The source's Section 4.1 algorithmic estimate is a OneEnd-side
      cost-model quantity. A statement about the supersingular isogeny problem
      or SQIsign requires the committed reduction path and its conditions; the
      existence of a source paragraph mentioning SQIsign does not transfer the
      concrete cost automatically.
  standing_conditions:
    - id: SC-1
      statement: >-
        GRH enters at the Isogeny arrow through [35, Proposition 8.5]. It is
        not an assumption listed in the frozen source's Corollary 1.2, so an
        isogeny/SQIsign transfer cannot be described as conditional on
        Heuristic 1 alone. OneEnd and EndRing retain their narrower source
        condition where applicable.
      source: ledger/goals/GOAL-SSIQ-001/checkpoints/BATCH-002.yaml
    - id: SC-3
      statement: >-
        Concrete cost is not inheritable across the [35] EndRing/OneEnd/
        Isogeny cascade. The OneEnd bracket therefore must not be relabeled as
        a direct SQIsign security estimate without a separate reduction-aware
        cost analysis.
      source: ledger/goals/GOAL-SSIQ-001/checkpoints/BATCH-002.yaml
  correction:
    preserve:
      - >-
        The numerical 2^{120-123} bracket as the prior record's explicitly
        model-dependent OneEnd-side cost estimate, pending a separate
        reduction-aware analysis.
      - The predecessor EV-SSI-59f7a2 bytes and all of its source artifacts.
      - The memory-infeasibility and toy-extrapolation caveats already present
        in the predecessor, without converting them into a security theorem.
    supersede:
      - >-
        The phrase and inference that calls the bracket an unqualified
        "security estimate" or direct concrete security result "at SQIsign
        NIST-I".
      - >-
        Any implication that the Section 4.1 OneEnd cost is inherited by the
        isogeny problem or by SQIsign key recovery.
      - >-
        Any omission of SC-1's GRH condition at the isogeny arrow and SC-3's
        non-inheritable-cost rule.
  negative_space:
    no_new_experiment: true
    no_numeric_recalculation: true
    no_security_conclusion: true
    no_hypothesis_status_change: true
    no_goal_completion: true
    sc2_status: >-
      SC-2 remains a separate standing condition on future candidates and is
      neither solved nor silently folded into this qualitative correction.
