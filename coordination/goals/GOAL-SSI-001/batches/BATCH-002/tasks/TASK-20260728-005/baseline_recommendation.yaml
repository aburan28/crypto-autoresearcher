  cost_convention:
    name: SSI-FC-2026
    parent_convention: wiener_full_cost_plus_isogeny_step_count
    definition_ref: derivation_note.md §2
    applied_identically_to:
      - meet-in-the-middle (Algorithm 1)
      - low-memory collision search / LMCS (Algorithm 2)
      - Delfs-Galbraith (Algorithm 3)
      - the archived p^{1/3+o(1)} algorithm of inputs/P13-WESOLOWSKI-2026
    assumptions:
      W1: full cost = hardware quantity x wall-clock time it is occupied (KN-LIT-094, KN-TECH-035).
      W2: three-dimensional memory, random-access throughput Theta(w^{2/3}) per unit time; bisection lower bound derived in place (Lemma 2), matching upper bound assumed.
      W3: unit of work = one ell-isogeny step via Phi_ell; polynomial cofactors absorbed in o(1) uniformly for every algorithm.
      W4: charged - table construction, table storage over its occupancy, every memory access, re-randomisation, output conversion, processors and their occupancy.
      W5: not charged - quantum resources of any kind, torsion-image oracles, energy/cooling/bandwidth/latency beyond the W2 abstraction, all constants and o(1) terms.
      W6: n processors permitted; H = n + w and T_wall >= T_steps/n subject to W2.
    asymmetric_charge_audit: >-
      NONE FOUND BY THE PRODUCER. Every algorithm is charged for table
      construction, storage, access, and processors under the same W1-W6. The
      only asymmetry in the RESULTS is a property of the algorithms, not of the
      accounting: Algorithm 2 touches memory once per trail of length L, MITM
      touches it once per step, and that difference is what the wiring charge
      detects. An independent check of this audit is R2 of TASK-20260728-007.

  heuristics_relied_on:
    H1: >-
      Endpoint mixing: for d >= c*log_ell(p) the endpoint of a random
      non-backtracking length-d path is within TV distance p^{-Omega(1)} of
      uniform on V. Rigorous ingredient: Ramanujan spectral gap (KN-TECH-024,
      established). Falsification and validation route in derivation_note.md §3.
    H2: >-
      Random-function model for the collision map f: after t evaluations the
      expected number of detected collisions is Theta(t^2/|D|) (KN-LIT-012 /
      KN-TECH-006 record this as heuristic).
    H3: >-
      F_p-subgraph mixing. WEAKER THAN H1 and flagged as such: the F_p-rational
      subgraph carries class-group structure rather than the full Ramanujan
      structure. The F_p verdict does not depend on it (see regime_F_p below).
    H4: >-
      Claw multiplicity C = Theta(|I_1|*|I_2|/n_V) under H1 (Poisson heuristic).
    external_H1_of_archived_paper: >-
      Heuristic 1 of inputs/P13-WESOLOWSKI-2026/paper_fulltext.md. Every
      p^{1/3+o(1)}, p^{4/9+o(1)} and p^{2/5+o(1)} figure below is CONDITIONAL on
      it. Dropping that qualifier downstream is a claim-tier violation under
      docs/claims-and-verification.md.
    none_validated_here: >-
      TRUE. Validating any of H1-H4 requires curve computation, which this batch
      forbids. No empirical claim arises from this record.

  regime_F_p2:
    problem: >-
      Problem 1 (SSI-Path-F_{p^2}): given two supersingular E_1, E_2 / F_{p^2}
      with no torsion images and no prescribed degree, output an isogeny of
      polynomial description size.
    matched_baseline_verdict: >-
      TWO TIERS, BOTH TO BE QUOTED. Unconditional tier: p^{1/2+o(1)} time at
      POLYNOMIAL memory, full cost p^{1/2+o(1)} (Delfs-Galbraith's general
      algorithm; equivalently Algorithm 2 of the note). Heuristic-conditional
      tier: p^{1/3+o(1)} time and memory, full cost p^{2/5+o(1)} after vOW
      memory rebalancing to w = p^{1/5+o(1)}, conditional on Heuristic 1 of
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md.
    meet_in_the_middle_status: >-
      NOT THE MATCHED BASELINE UNDER ANY CONVENTION EXAMINED. Record it as a
      high-memory footnote.
    exponent_table:
      - algorithm: MITM, textbook balance m=q=p^{1/2}
        time_exponent: 0.5
        memory_exponent: 0.5
        full_cost_exponent: 0.6667
        basis: derived in place (Lemma 3), cited step count KN-TECH-029/KN-LIT-078
      - algorithm: MITM, full-cost-optimal m=p^{3/5}
        time_exponent: 0.6
        memory_exponent: 0.6
        full_cost_exponent: 0.6
        basis: derived in place (Lemma 3)
      - algorithm: LMCS (Algorithm 2) / Delfs-Galbraith general
        time_exponent: 0.5
        memory_exponent: polylog
        full_cost_exponent: 0.5
        basis: >-
          derived in place (Lemmas 4-7); the exponent AND the polynomial-memory
          profile are independently attested by
          inputs/P13-WESOLOWSKI-2026/paper_fulltext.md §1.1 ("the classic
          p^{1/2+o(1)} algorithms with polynomial memory like [21]").
      - algorithm: archived p^{1/3+o(1)} algorithm, as operated (w = p^{1/3})
        time_exponent: 0.3333
        memory_exponent: 0.3333
        full_cost_exponent: 0.4444
        basis: >-
          time/memory CITED (Theorem 1.1, Corollary 1.2, conditional on its
          Heuristic 1); full cost DERIVED IN PLACE (Lemma 9).
      - algorithm: same, vOW-rebalanced to w = p^{1/5}
        time_exponent: 0.4
        memory_exponent: 0.2
        full_cost_exponent: 0.4
        basis: >-
          derived in place (Lemma 9) from the vOW tradeoff sqrt(N^3/w) quoted in
          the same archived text; conditional on its Heuristic 1.
    what_a_future_candidate_must_beat: >-
      p^{1/2+o(1)} full cost unconditionally, or p^{2/5+o(1)} full cost against
      the heuristic-conditional tier. Beating p^{1/2} in STEP COUNT alone is not
      an improvement over the matched baseline, because the classical baseline
      is already memory-light and no memory charge can be levied against it.

  regime_F_p:
    problem: >-
      Problem 2 (SSI-Path-F_p): Problem 1 restricted to F_p-rational E_1, E_2
      (the regime CSIDH and many oriented constructions live in).
    matched_baseline_verdict: >-
      DELFS-GALBRAITH at p^{1/4+o(1)} step count. Under H3 its full cost is also
      p^{1/4+o(1)} at polylog memory; without H3 the MITM-inside-the-subgraph
      fallback gives full cost p^{1/3+o(1)}. Either way it dominates.
    mitm_ever_competitive: false
    mitm_verdict_proof: >-
      MODEL-INDEPENDENT, derived in place. Lemma 1 gives FC(A) >= T_steps(A)
      for every algorithm under W1/W6, so FC(MITM) >= p^{1/2}. Since
      FC(Delfs-Galbraith) <= p^{1/3+o(1)} even without H3, MITM loses by at
      least p^{1/6+o(1)}, and by p^{1/4+o(1)} under H3. No wiring model
      satisfying W1 can reverse this.
    gap_widening:
      step_count_gap: p^{1/4}
      full_cost_gap_vs_textbook_MITM: p^{5/12}
      full_cost_gap_vs_rebalanced_MITM: p^{7/20}
      direction: >-
        Charging memory WIDENS the pre-existing gap. It never narrows it.
    displaced_by_p_one_third_algorithm: false
    displaced_by_note: >-
      The archived p^{1/3+o(1)} algorithm covers Problem 2 as well (its
      Corollary 1.2), but 1/4 < 1/3, so Delfs-Galbraith remains the matched
      baseline here. This is the sharpest instance of KN-TECH-050's rule that
      the asymptotically stronger general algorithm can be the WRONG baseline on
      a sub-regime.

  red_team_objection_disposition:
    objection_id: RT-20260725-503 F2
    objection_restated: >-
      "Delfs-Galbraith likely already dominates the F_p regime before full cost.
      Charging MITM memory makes MITM worse, which strengthens DG's dominance
