      target_class_under_A1: false
      why_not: >-
        A bookkeeping correction that imports someone else's exponent. It is
        nonetheless the single most decision-relevant output of this gate.
      suggested_disposition: >-
        A KN-TECH baseline note is warranted, but knowledge/ is deliberately
        outside every BATCH-002 write scope; this is a Coordinator decision for
        a separately dispatched successor task with its own declared paths and a
        regenerated knowledge/INDEX.md. Nothing in knowledge/ was written by
        this task.
    C_gamma:
      statement: >-
        Under SSI-FC-2026 the archived p^{1/3+o(1)} headline costs
        p^{4/9+o(1)} as operated and p^{2/5+o(1)} after memory rebalancing, so
        its margin over the classical baseline narrows from p^{1/6} to
        p^{1/10}. This is a DEFENDER-FAVOURABLE correction to an attacker's
        headline - the same sign KN-LIT-126 reports on the quantum side, and the
        sign KN-TECH-050 warns is easy to get backwards.
      target_class_under_A1: false
      conditional_on: Heuristic 1 of the archived paper, plus H2 and W1-W4.

  uncharged_residue:
    - All constants and all o(1) terms; the archived p^{1/3+o(1)} result discloses a SUPERPOLYNOMIAL overhead inside its o(1), inherited unchanged by every full-cost figure here.
    - The upper-bound half of W2 (Theta(w^{1/3}) mesh-routing achievability) is assumed, not proved; only the bisection lower bound is derived.
    - Energy, cooling, bandwidth, latency, and interconnect topology beyond the 3-D mesh abstraction.
    - The vOW shared-table / distributed-server communication pattern beyond mesh routing.
    - Modular-polynomial precomputation of Phi_ell and batched-evaluation engineering.
    - Reliability over long runs (error correction, restarts, checkpointing).
    - All quantum resources (excluded by the card; KN-OPEN-014 lane).
    - Torsion-image oracles (forbidden; SIDH regime).
    - The heuristics H1-H4 themselves, which are unvalidated because validating them requires the curve computation this batch forbids.
    - Delfs-Galbraith's actual published memory profile; §6.1-6.2 of the note RECONSTRUCT it, and KN-LIT-078's entry records that the full paper was not read.
    - The class-number asymptotic behind S = |V_p| = p^{1/2+o(1)}, used on KN-TECH-029's authority and not re-derived.

  new_attack_mechanism_detected: false
  new_attack_mechanism_justification: >-
    Nothing produced here changes the asymptotic exponent of a named hard
    problem, which is the bar docs/target-result-profile.md rule A1 sets.
    Item by item: (1) Algorithm 2 MATCHES the known p^{1/2+o(1)}-at-polynomial-
    memory point and is labelled an adaptation; (2) the p^{3/5} MITM rebalance
    lowers the full cost of an algorithm that is dominated in both regimes, so
    it improves nothing an attacker would run; (3) the p^{2/5+o(1)} figure
    RAISES the effective cost of the archived p^{1/3+o(1)} algorithm, and a
    correction that makes an attack more expensive is not an attack mechanism;
    (4) the any-claw/golden-claw distinction explains exponents rather than
    producing an algorithm that beats one. Consequently BATCH-002 does not count
    toward any GOAL-SSI-001 completion criterion, exactly as
    GOAL-SSI-001.open_batch.completion_counting requires. The flag is not
    inflated and no mechanism was manufactured to satisfy a completion route.

  candidate_generated_and_falsified_in_place:
    id: PROP-11
    candidate: >-
      Batched re-randomisation of the archived p^{1/3+o(1)} algorithm: build one
      table over k re-randomised curves E'_1..E'_k at cost k*M and accept a claw
      between a domain-E'_i entry with codomain F and a domain-E'_j entry with
      codomain F^{(p)}, giving k^2 chances at cost k*M.
    verdict: FALSIFIED_IN_PLACE
    reason: >-
      The correctness of the archived Algorithm 2 rests on its Theorem 1.5,
      which bounds the smallest isogeny E -> E^{(p)} by (p/2)^{1/3} and is
      SPECIFIC to the Frobenius conjugate of the SAME curve (it comes from the
      two-sided quaternionic ideal of reduced norm p). For i != j the pair
      (E'_i, E'^{(p)}_j) is a generic pair of supersingular curves and no
      archived bound replaces Theorem 1.5 for it, so the degree-split inequality
      fails and cross-pairs contribute nothing at the chosen X.
    secondary_reasons_recorded: >-
      The k^2 pair events are not independent (no justification was
      constructed), and even a clean factor-k gain would only shrink
      1/P_0 = p^{o(1)}, leaving the 1/3 exponent untouched. Remark 1 of the
      archived paper already records the closely related multiplicity effect as
      absorbed in the hidden asymptotic term.
    recorded_because: >-
      The falsification is the useful artifact, and a reviewer should be able to
      verify that no live candidate was silently discarded.

  leads_for_successor_batches:
    - id: L1
      statement: >-
        Is there a target set of size p^{epsilon} playing the role {E^{(p)}}
        plays in the archived algorithm, for which a Theorem-1.5-style
        minimal-degree bound DOES hold? PROP-11 falsifies the naive choice; it
        does not falsify every choice, and this artifact declares no direction
        impossible.
      cheapest_gate: >-
        Literature check for minimal-degree bounds on isogenies to targets other
        than the Frobenius conjugate. Zero compute.
      status: lead_only_not_a_mechanism
    - id: L2
      statement: >-
        KN-LIT-132 (fixed-degree, essentially memory-free, 2024) lives in
        Problem 3, which §5.4 identifies as exactly the regime where memory
        matters at exponent level. Its corpus entry deliberately records no
        complexity range because a search-returned abstract looked internally
        inconsistent.
      cheapest_gate: >-
        Obtain the intervals, the parameterisation, and the memory model from
        the primary source. This artifact quotes no number from it.
      status: lead_only_not_a_mechanism
    - id: L3
      statement: >-
        H3 (F_p-subgraph mixing) is the weakest assumption used anywhere here,
        and Delfs-Galbraith's published memory profile for the inner search is
        not in this corpus. Both are cheap to settle from the primary paper.
      cheapest_gate: Read KN-LIT-078's primary text; upgrade its corpus entry.
      status: lead_only_not_a_mechanism

  interpretation_limits:
