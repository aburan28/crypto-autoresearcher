      IDEA-20260725-001: its prediction matched_baseline_identity = different is
      FALSE on the F_p regime, and would have been false under any honest
      convention. The two regimes carry separate verdicts throughout; a blended
      ranking is not offered anywhere in this artifact.
    other_objections:
      F1: >-
        UPHELD. This lane is cost-model hygiene, not a cryptanalytic mechanism.
        See new_attack_mechanism_detected below.
      N1: >-
        DISCHARGED CONSTRUCTIVELY. The low-memory analogue is now defined
        (Algorithm 2), and the naive variant N1 was worried about is falsified
        in place (Proposition 10).
      N2: >-
        UPHELD. Novelty of the isogeny instantiation is methodological, not
        cryptanalytic. Algorithm 2's novelty_status is "adaptation".
      N4: >-
        PARTIALLY REPAIRED. This note upgrades its central citations to the
        repository's archived PRIMARY text
        (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md) rather than relaying the
