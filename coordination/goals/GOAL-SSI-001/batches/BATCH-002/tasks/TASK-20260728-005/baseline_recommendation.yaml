    - Asymptotic full-cost statements settle BASELINE IDENTITY, not concrete bit security. No security level for any parameter set is asserted or implied.
    - Every p^{1/3+o(1)}, p^{4/9+o(1)} and p^{2/5+o(1)} figure is CONDITIONAL on Heuristic 1 of inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, which this program has neither validated nor challenged.
    - H1-H4 are unvalidated. This batch computed nothing and therefore supports no empirical claim at any tier.
    - Nothing here closes KN-OPEN-013, KN-OPEN-014, or KN-OPEN-015, and nothing here bears on sub-p^{1/4} endomorphism-ring attacks, quantum attacks, or torsion-image attacks.
    - SIDH/SIKE torsion-image key recovery remains a closed known attack and was not a target.
    - One unreplicated derivation by one producer, pending TASK-20260728-007.

