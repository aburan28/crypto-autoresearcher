  low_memory_analogue:
    gate: G3
    verdict: DEFINED
    verdict_is_not: >-
      Not "underspecified". The gate explicitly refuses that verdict and it is
      not returned.
    name: LMCS (low-memory collision search on the isogeny graph), Algorithm 2
    walk_law: >-
      A pseudorandom self-map on the PATH-INDEX space, not on the graph:
      D = {1,2} x I with I the set of non-backtracking length-d path encodings,
      |D| = M = Theta(p); f(b,s) = h(j(endpoint of path s from E_b));
      x_{i+1} = f(x_i) from random starts. Each evaluation recomputes a fresh
      length-d path, costing d = Theta(log_ell p) isogeny steps.
    distinguished_point_predicate: >-
      x is distinguished iff the first ceil(log2(1/theta)) bits of its canonical
      encoding are zero; expected trail length L = 1/theta, set to
      max(1, sqrt(M/w)) per the van Oorschot-Wiener parameterisation.
    collision_to_path_reconstruction: >-
      A cross-side collision (1,s_1),(2,s_2) with equal endpoint F yields the
      concatenation of the length-d path E_1 -> F with the reverse of the
      length-d path E_2 -> F: an isogeny E_1 -> E_2 of degree dividing
      ell^{2d}, of POLYNOMIAL description size. Correctness needs no heuristic
      (Lemma 6).
    any_vs_golden_collision_accounting: >-
      THE CRUX. For unrestricted-degree path-finding (Problems 1 and 2) the claw
      count is C = Theta(M) (Lemma 4), so only k = Theta(1) collisions must be
      sifted and the cost is Theta(sqrt(M)) INDEPENDENT OF MEMORY w (Lemma 5).
      For FIXED-degree CSSI (Problem 3) the degree constraint leaves C = 1, so
      k = Theta(M) and the cost is Theta(sqrt(M^3/w)) - memory matters at
      exponent level. This is exactly why the SIDH/CSSI vOW-vs-MITM cost-model
      literature (KN-LIT-124, KN-LIT-125) does NOT transfer to pure
      path-finding, and it is the precise technical reason IDEA-20260725-001's
      premise fails on F_{p^2}.
    cost:
      time: p^{1/2+o(1)} ell-isogeny steps
      memory: polylog (w is a free parameter and does not affect the exponent)
      full_cost: p^{1/2+o(1)}
      parallelisation: time p^{1/2+o(1)}/n on n processors, full cost unchanged
    uncharged_oracle_used: false
    nonstandard_graph_access_used: false
    primitive_required: >-
      Phi_ell neighbour evaluation only - the same primitive MITM and
      Delfs-Galbraith require, charged identically under W3.
    novelty_status: adaptation
    novelty_basis: >-
      It MATCHES a known exponent at a known memory profile. The archived
      primary text states that the classic p^{1/2+o(1)} algorithms already use
      polynomial memory. Algorithm 2 is not a new algorithm and no novelty is
      claimed for it. What is not stated in any archived corpus entry, and is
      derived here, is the w-INDEPENDENCE and its any-claw explanation.
    falsified_variant:
      name: continuous graph-walk variant
      statement: >-
        A deterministic pseudorandom walk F: V -> V on the graph itself, run
        from E_1 and E_2 with distinguished points until the trails merge.
      why_falsified: >-
        Merge depth is Theta(p^{1/2}), so the certified isogeny has degree
        ell^{Theta(p^{1/2})} and its only representation is the trail itself.
        Emitting it violates the polynomial-description-size requirement;
        storing it costs Theta(p^{1/2}) memory - exactly the memory the
        construction existed to avoid. Proposition 10, derivation_note.md §5.6.

  pre_registered_falsification_outcomes:
    source: IDEA-20260725-001.cheapest_falsification_gate.falsifies_if
    outcome_1_mitm_full_cost_collapses:
      fired: false
      detail: >-
        MITM's full-cost exponent STRICTLY EXCEEDS its step-count exponent:
        2/3 at the textbook balance, 3/5 at the full-cost optimum, versus 1/2.
        It collapses to 1/2 only under unit-cost random access, i.e. the RAM
        model that KN-LIT-094 and KN-TECH-035 exist to reject.
    outcome_2_analogue_undefinable:
      fired: false
      detail: >-
        The analogue is defined without any uncharged oracle and without
        nonstandard graph access (Algorithm 2). Separately, the naive variant is
        falsified in place.
    outcome_3_dg_dominant_no_correction:
      fired: PARTIALLY
      first_clause_dg_dominates: true
      second_clause_no_decision_relevant_correction: false
      detail: >-
        Delfs-Galbraith (or its memory-light equivalent) dominates MITM in both
        regimes under every convention examined, so the first clause fires and
        the STATED mechanism of IDEA-20260725-001 - charging MITM memory - adds
        nothing. The second clause does not fire, because executing the gate
        surfaced two corrections that are decision-relevant for reasons
        unrelated to memory charging (C-alpha and C-beta below).

  decision_relevant_corrections:
    C_alpha:
      statement: >-
        The classical F_{p^2} baseline is MEMORY-LIGHT, not memory-heavy. A
        future GOAL-SSI-001 candidate therefore cannot win a comparison by
        charging memory to the classical baseline; that entire class of
        accounting-artifact advantage claim is closed off in advance.
      target_class_under_A1: false
      why_not: Moves no exponent of any hard problem.
    C_beta:
      statement: >-
        KN-TECH-029's Otilde(p^{1/2}) classical F_{p^2} figure is STALE against
        this repository's own archived primary text
        (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md), which places the
        frontier at p^{1/3+o(1)} conditional on its Heuristic 1. Any candidate
        benchmarked against p^{1/2} on F_{p^2} is measuring against a superseded
