      name: continuous graph-walk variant
      statement: >-
        A deterministic pseudorandom walk F: V -> V on the graph itself, run from
        E_1 and E_2 with distinguished points until the trails merge.
      why_falsified: >-
        Merge depth is Theta(p^{1/2}), so the certified isogeny has degree
        ell^{Theta(p^{1/2})} and its only representation is the trail itself.
