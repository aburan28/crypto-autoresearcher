        it costs Theta(p^{1/2}) memory - exactly the memory the construction
        existed to avoid. Proposition 10, TASK-20260728-005 derivation_note.md
        section 5.6. UNCHANGED, and it now also bites v1's own Algorithm 3 step
        1, which RC3 repairs.

