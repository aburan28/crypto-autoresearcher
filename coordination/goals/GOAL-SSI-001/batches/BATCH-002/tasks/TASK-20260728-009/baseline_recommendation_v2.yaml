    control: RC3
    objection: F3
    v1_defect: >-
      v1 Algorithm 3 step 1 specified a single walk in the F_{p^2} graph until an
      F_p-rational curve is reached, annotated "O(1) memory: nothing is stored",
      while step 3 said "compose the three pieces". Contradictory: a walk that
      stores nothing cannot be composed, and a stored walk of Theta(p^{1/2})
      steps certifies an isogeny of degree ell^{Theta(p^{1/2})} at Theta(p^{1/2})
      memory - verbatim the falsification v1's own Proposition 10 applies to the
      naive LMCS variant. CONFIRMED independently in this session.
