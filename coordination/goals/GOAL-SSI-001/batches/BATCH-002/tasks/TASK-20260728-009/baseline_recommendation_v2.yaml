  # ---------------------------------------------------------------- convention

  cost_convention:
    name: SSI-FC-2026
    parent_convention: wiener_full_cost_plus_isogeny_step_count
    definition_ref: TASK-20260728-005/derivation_note.md section 2 (unchanged)
    applied_identically_to:
      - meet-in-the-middle (Algorithm 1)
      - low-memory collision search / LMCS (Algorithm 2, as restated by RC2)
      - Delfs-Galbraith (Algorithm 3', as repaired by RC3)
      - the archived p^{1/3+o(1)} algorithm of inputs/P13-WESOLOWSKI-2026
    assumptions:
      W1: full cost = hardware quantity x wall-clock time it is occupied (KN-LIT-094, KN-TECH-035).
      W2: three-dimensional memory, random-access throughput Theta(w^{2/3}) per unit time; bisection lower bound derived in place (Lemma 2), matching upper bound assumed.
      W3: unit of work = one ell-isogeny step via Phi_ell; polynomial cofactors absorbed in o(1) uniformly for every algorithm.
      W4: charged - table CONSTRUCTION INCLUDING ITS MEMORY ACCESSES (corrected by RC1), table storage over its occupancy, every memory access, re-randomisation, output conversion, processors and their occupancy.
      W5: not charged - quantum resources of any kind, torsion-image oracles, energy/cooling/bandwidth/latency beyond the W2 abstraction, all constants and o(1) terms.
      W6: n processors permitted; H = n + w and T_wall >= T_steps/n subject to W2.
    asymmetric_charge_audit: ONE_FOUND_AND_CORRECTED
    asymmetric_charge_audit_detail: >-
      One asymmetry existed INSIDE Algorithm 1 and is corrected here. v1's Lemma 3
      charged W2 to the q table lookups but charged the m table INSERTIONS only as
      one unit each, although under W2 the insertions are m random accesses into an
      m-cell memory and are indistinguishable from the lookups. Corrected charge:
      FC_build = Omega(m^{4/3}). Derivation: errata_note.md section 1.2. This was
      found by the independent red team (RT-20260728-007 F1) and independently
      re-derived here, including a second implementation route (sort-and-merge,
      errata_note.md section 1.3) that reaches the same floor. Every OTHER
      algorithm was re-checked and no further asymmetry was found: Algorithm 2
      writes once per trail (polylog writes at polylog w), Algorithm 3' stores one
      O(log p)-step path, and Lemma 9 already charged writes correctly via its
      n/L <= w^{2/3} constraint.
    asymmetric_charge_audit_v1_value_withdrawn: >-
      v1's value for this field asserted that no asymmetry had been found by the
      producer (scoped to the producer and deferring to review gate R2). That value
      is WITHDRAWN: RT-20260728-007 objection N4 falsifies it and F1 supplies the
      asymmetry. Credit where due - the honest producer-scoped framing is what made
      it findable.

  # ---------------------------------------------------------------- heuristics

  heuristics_relied_on:
    H1_prime: >-
      ENDPOINT MIXING, QUANTIFIED (restated by RC2; supersedes v1's H1). Fix
      eps > 0. For d >= (1+eps)*log_ell(p), the endpoint of a uniformly random
      non-backtracking ell-isogeny path of length d from a fixed supersingular
      E/F_{p^2} is within total-variation distance O(poly(d)*p^{-eps/2}) =
      p^{-Omega(1)} of uniform on V. Rigorous ingredient: the Ramanujan spectral
      gap (KN-TECH-024, established) via TV <= (1/2)*poly(d)*(n_V/ell^d)^{1/2}.
      WHY THE QUANTIFIER MOVED: at ell^d = Theta(n_V) that bound is vacuous and
      the asserted p^{-Omega(1)} is provably unreachable, so v1's unquantified
      c is forced to c > 1 strictly. Derivation: errata_note.md section 2.1.
      Falsification: an explicit family (p, ell, E) whose length-(1+eps)log_ell p
      endpoint law deviates from uniform by more than p^{-o(1)}.
    H2_prime: >-
      RANDOM-FUNCTION MODEL ON THE RIGHT PARAMETER (restated by RC2; supersedes
      v1's H2). f = h.g factors through the vertex set, so im f is contained in
      h(V) and |im f| <= n_V whatever d is; after one step every iterate lies in
      im f. Assume f restricted to im f behaves, for collision statistics, like a
      uniformly random self-map of a set of size Theta(n_V): after t evaluations
      the expected number of detected collisions is Theta(t^2/n_V). CHANGE FROM
      v1: the birthday parameter is |im f| = Theta(n_V), NOT |D| = 2|I|.
      Validation must be run against |im f|; a run compared against |D| would
      appear to confirm a model wrong by exactly the factor F2 identifies.
    H3_prime: >-
      F_p-SUBGRAPH MIXING. The analogue of H1_prime inside V_p at walk length
      (1+eps)*log_ell(S). STILL WEAKER THAN H1_prime and flagged as such: V_p
      carries class-group (CM) structure (KN-TECH-027) rather than the full
      Ramanujan structure, and this record does NOT claim H3_prime follows from
      KN-TECH-024. The F_p verdict is constructed not to depend on it.
    H4_prime: >-
      CLAW MULTIPLICITY AND USEFUL FRACTION (restated by RC2; supersedes v1's
      H4). Under H1_prime with |I| = Theta(ell^d) = Theta(p^{1+eps}) per side,
      the cross-side claw count is C = Theta(|I|^2/n_V) = Theta(p^{1+2eps}); AND
      the fraction of DETECTED f-collisions that are cross-side genuine claws is
      Theta(1). Falsification (this absorbs N8, which v1 left asserted): measured
      claw counts, OR the measured cross-side fraction of detected collisions,
      deviating by a growing factor; or a structural bias in g suppressing
      cross-side coincidences.
    external_H1_of_archived_paper: >-
      Heuristic 1 of inputs/P13-WESOLOWSKI-2026/paper_fulltext.md. Every
      p^{1/3+o(1)}, p^{4/9+o(1)} and p^{2/5+o(1)} figure below is CONDITIONAL on
      it. Dropping that qualifier downstream is a claim-tier violation under
      docs/claims-and-verification.md.
    none_validated_here: >-
      TRUE. Validating any of H1_prime-H4_prime requires curve computation, which
      this task forbids. No empirical claim arises from this record. Pre-registered
      validation is RC7, out of scope here.

  # ------------------------------------------------------------- F_{p^2} regime

  regime_F_p2:
    problem: >-
      Problem 1 (SSI-Path-F_{p^2}): given two supersingular E_1, E_2 / F_{p^2}
      with no torsion images and no prescribed degree, output an isogeny of
      polynomial description size.
    matched_baseline_verdict: >-
      TWO TIERS, BOTH TO BE QUOTED. Unconditional tier: p^{1/2+o(1)} time at
      POLYNOMIAL memory, full cost p^{1/2+o(1)}. Heuristic-conditional tier:
      p^{1/3+o(1)} time and memory, full cost p^{2/5+o(1)} after vOW memory
      rebalancing to w = p^{1/5+o(1)}, conditional on Heuristic 1 of
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md.
    unconditional_tier_memory_profile_basis: CITED
    unconditional_tier_memory_profile_basis_detail: >-
      CITED, NOT DERIVED (RC3). The memory-light reading of the classical
      F_{p^2} baseline rests on inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
      line 39, read directly in this session: "This allows one to interpolate
      between the p^{1/3+o(1)} high-memory algorithm presented here and the
      classic p^{1/2+o(1)} algorithms with polynomial memory like [21]."
      Reading "polynomial memory" against an input size of log p as poly(log p)
      is standard but IS A READING; it is labelled an interpretation of a
      quotation, not a quotation. The in-repo reconstruction (Algorithm 3', RC3)
      is DERIVED_CONDITIONAL_ON_H1_PRIME and is NOT the basis of this tier.
    meet_in_the_middle_status: >-
      NOT THE MATCHED BASELINE UNDER ANY CONVENTION EXAMINED. Record it as a
      high-memory footnote. Its full cost is now Omega(p^{2/3}) UNIFORMLY IN THE
      TABLE SIZE, which is a stronger statement than v1 made.
    exponent_table:
      - algorithm: MITM (Algorithm 1), any table size m
        time_exponent: 0.5
        time_exponent_note: p^{1/2} at the optimum m = q = p^{1/2}
        memory_exponent: 0.5
        full_cost_exponent: 0.6667
        full_cost_qualifier: >-
          Omega(p^{2/3}) for EVERY m, with the minimum attained exactly at the
          textbook balance m = q = p^{1/2}. There is no cheaper table size.
        basis: >-
          DERIVED IN PLACE (errata_note.md section 1.2), correcting v1's Lemma 3
          under RC1. min over m of max(m^{4/3}, p*m^{-2/3}) = p^{2/3} at m = p^{1/2}.
          Step count cited to KN-TECH-029 / KN-LIT-078, confidence reported.
      - algorithm: LMCS (Algorithm 2), as restated by RC2
        time_exponent: 0.5
        memory_exponent: polylog
        full_cost_exponent: 0.5
        basis: DERIVED_CONDITIONAL_ON_H1_PRIME
        basis_detail: >-
          Derived in place from restated Lemmas 4', 5', 6, 7' (errata_note.md
          sections 2.4-2.6) under H1_prime, H2_prime, H4_prime and W1-W4/W6. The
          archived sentence at paper_fulltext.md line 39 attests [21] =
          Delfs-Galbraith; it does NOT attest Algorithm 2, which is an in-repo
          construction. Row split from Delfs-Galbraith per N5.
      - algorithm: Delfs-Galbraith general (Algorithm 3', as repaired by RC3)
        time_exponent: 0.5
        memory_exponent: polynomial (poly(log p) under the standard reading)
        full_cost_exponent: 0.5
        basis: CITED for the memory profile; DERIVED_CONDITIONAL_ON_H1_PRIME for the in-repo reconstruction
        basis_detail: >-
          The exponent and the polynomial-memory profile are attested by
          paper_fulltext.md line 39 ("the classic p^{1/2+o(1)} algorithms with
          polynomial memory like [21]"). The in-repo reconstruction of the
          descent (Theta(p^{1/2}) restarts of (1+eps)log_ell p-length walks,
          errata_note.md section 3.2) is conditional on H1_prime and is offered
          as a consistent specification, NOT as evidence for the cited profile.
          Whether the published algorithm descends by one walk or by restarts is
          UNVERIFIED here; that is RC4.
      - algorithm: archived p^{1/3+o(1)} algorithm, as operated (w = p^{1/3})
        time_exponent: 0.3333
        memory_exponent: 0.3333
        full_cost_exponent: 0.4444
        basis: >-
          time/memory CITED (Theorem 1.1, Corollary 1.2, conditional on its
          Heuristic 1); full cost DERIVED IN PLACE (Lemma 9), re-verified in this
          session (errata_note.md section 1.4). Survives RC1 intact.
      - algorithm: same, vOW-rebalanced to w = p^{1/5}
        time_exponent: 0.4
        memory_exponent: 0.2
        full_cost_exponent: 0.4
        basis: >-
          derived in place (Lemma 9) from the vOW tradeoff sqrt(N^3/w) quoted
          verbatim in the archived text; conditional on its Heuristic 1.
          Re-verified in this session; at w = M the same formula reproduces RC1's
          corrected build charge M^{4/3}, an internal cross-check.
    what_a_future_candidate_must_beat:
      operative_thresholds_are_the_time_tiers: >-
        p^{1/2+o(1)} TIME unconditionally, or p^{1/3+o(1)} TIME against the
        heuristic-conditional tier. These are the thresholds a future candidate
        should be measured against.
      full_cost_thresholds_are_provisional: >-
        p^{1/2+o(1)} full cost unconditionally, p^{2/5+o(1)} full cost against the
        conditional tier - CARRIED AS PROVISIONAL (CM3). The conditional
        full-cost figure sits above a SUPERPOLYNOMIAL o(1) disclosed by the
        source's own authors, so it is a threshold nobody can evaluate at any
        realisable p. v1 stated it as an operative target; that framing is
        corrected here.
      standing_consequence_of_C_alpha: >-
        Beating p^{1/2} in STEP COUNT alone is not an improvement over the matched
        baseline, because the classical baseline is already memory-light (CITED)
        and no memory charge can be levied against it.

  # ----------------------------------------------------------------- F_p regime

  regime_F_p:
    problem: >-
      Problem 2 (SSI-Path-F_p): Problem 1 restricted to F_p-rational E_1, E_2
      (the regime CSIDH and many oriented constructions live in).
    matched_baseline_verdict: >-
      DELFS-GALBRAITH at p^{1/4+o(1)} step count. Under H3_prime its full cost is
      also p^{1/4+o(1)} at polylog memory; without H3_prime the
      MITM-inside-the-subgraph fallback gives full cost p^{1/3+o(1)}. Either way
      it dominates every p^{1/2} general algorithm.
    matched_baseline_confidence: relayed_from_abstract
    matched_baseline_confidence_detail: >-
      RECORDED, NOT PAPERED OVER (N3). p^{1/4+o(1)} and S = |V_p| = p^{1/2+o(1)}
      relay through KN-TECH-029 (confidence reported) to KN-LIT-078, whose own
      corpus entry states verbatim: "Full paper not read; the p^{1/2} / p^{1/4}
      costs relayed from the abstract (hence confidence: reported). The IACR
      ePrint number could NOT be confirmed and is omitted". KN-TECH-050 instructs
      a BATCH-002 derivation that it "must obtain every quoted figure from the
      papers themselves". The F_{p^2} figures satisfy that instruction; THE F_p
      FIGURES DO NOT. Both quotations were verified verbatim in this session.
      Closing this gap is RC4, which is NOT in this task's scope (no literature
      fetch was authorized and none was performed).
    mitm_over_full_graph_ever_competitive: false
    mitm_over_full_graph_verdict_proof: >-
      MODEL-INDEPENDENT, derived in place, UNCHANGED by RC1/RC2/RC3. Lemma 1
      gives FC(A) >= T_steps(A) for every algorithm under W1/W6 alone, so
      FC(MITM over the full F_{p^2} graph) >= p^{1/2}. Since
      FC(Delfs-Galbraith) <= p^{1/3+o(1)} even without H3_prime, MITM over the
      full graph loses by at least p^{1/6+o(1)}, and by p^{1/4+o(1)} under
      H3_prime. No wiring model satisfying W1 can reverse this.
    mitm_as_inner_search_within_Vp:
      is_competitive: true
      steps: p^{1/4+o(1)}
      memory: p^{1/4+o(1)}
      full_cost: p^{1/3+o(1)}
      status: >-
        COMPETITIVE BUT NOT OPTIMAL. As Delfs-Galbraith's inner search inside
        V_p this MITM beats every p^{1/2} general algorithm on F_p-rational
        instances, and it is the H3_prime-free fallback. It is dominated by the
        LMCS inner search at p^{1/4+o(1)} full cost under H3_prime.
      basis: >-
        DERIVED IN PLACE under RC1's corrected formula: FC =
        Omega(max(m^{4/3}, S*m^{-2/3})), minimised at m = S^{1/2} giving S^{2/3},
        and S = p^{1/2+o(1)} gives p^{1/3+o(1)}. The NUMBER is unchanged from v1
        because v1's formula and the corrected formula coincide at the textbook
        balance; what changed is that it is now the optimum over m rather than a
        balance point.
      why_this_field_exists: >-
        RC6/N1. v1 carried an unqualified boolean asserting that MITM is never
        competitive on F_p. That flag over-generalised a proof about MITM over
        the FULL graph into a claim about all MITM, and a downstream ledger
        record would have quoted it. v1's prose (section 6.2) was already
        correct; only the machine-readable field was not.
    exponent_table:
      - algorithm: MITM on the full F_{p^2} graph
        time_exponent: 0.5
        memory_exponent: 0.5
        full_cost_exponent: 0.6667
        full_cost_qualifier: Omega(p^{2/3}) for every m
        basis: Lemma 1 and RC1's corrected Lemma 3 (errata_note.md section 1.2)
      - algorithm: DG + LMCS inner search (Algorithm 3' + Algorithm 2 restricted to V_p)
        time_exponent: 0.25
        memory_exponent: polylog
        full_cost_exponent: 0.25
        basis: >-
          DERIVED_CONDITIONAL_ON_H1_PRIME AND H3_PRIME (errata_note.md section
          2.7); step count relayed at confidence relayed_from_abstract via
          KN-TECH-029 / KN-LIT-078.
      - algorithm: DG + MITM inner search (H3_prime-free fallback)
        time_exponent: 0.25
        memory_exponent: 0.25
        full_cost_exponent: 0.3333
        basis: derived in place under RC1's corrected formula with p -> S
      - algorithm: archived p^{1/3+o(1)} algorithm
        time_exponent: 0.3333
        memory_exponent: 0.3333
        full_cost_exponent: 0.4444
        basis: cited (Corollary 1.2, conditional on its Heuristic 1) + Lemma 9
    gap_widening:
      step_count_gap: p^{1/4}
      full_cost_gap_vs_MITM_over_full_graph_under_H3_prime: p^{5/12}
      full_cost_gap_vs_MITM_over_full_graph_without_H3_prime: p^{1/3}
      applies_to_every_MITM_parameterisation: true
      applies_to_every_MITM_parameterisation_basis: >-
        Under RC1, FC(MITM over the full graph) = Omega(p^{2/3}) for every table
        size, so a single gap figure now covers all parameterisations. v1 quoted
        two gaps, one per MITM parameterisation; the second is withdrawn with the
        rebalance that produced it (see superseded_fields).
      direction: >-
        Charging memory WIDENS the pre-existing gap. It never narrows it, and by
        Lemma 1 no wiring model satisfying W1 can reverse the ranking.
    displaced_by_p_one_third_algorithm: false
    displaced_by_note: >-
      The archived p^{1/3+o(1)} algorithm covers Problem 2 as well (its Corollary
      1.2), but 1/4 < 1/3, so Delfs-Galbraith remains the matched baseline here.
      This is the sharpest instance of KN-TECH-050's rule that the asymptotically
      stronger general algorithm can be the WRONG baseline on a sub-regime.

  # ------------------------------------------------------- low-memory analogue

  low_memory_analogue:
    gate: G3
    verdict: DEFINED
    verdict_qualifier: >-
      DEFINED, AND WELL-DEFINED ONLY UNDER H1_prime/H2_prime/H4_prime AND ONLY
      AFTER THE RC2 RESTATEMENT. Not "underspecified" and not falsified. The
      review's own R4 verdict is
      WELL_DEFINED_ONLY_UNDER_EXTRA_ASSUMPTIONS_AND_ONLY_AFTER_ONE_RESTATEMENT
      and this record adopts it.
    name: LMCS (low-memory collision search on the isogeny graph), Algorithm 2
    walk_law: >-
      A pseudorandom self-map on the PATH-INDEX space, not on the graph.
      d = (1+eps)*log_ell(p) (RESTATED by RC2: v1 used ell^d = Theta(n_V), at
      which length H1's conclusion is provably false). I = the set of
      non-backtracking length-d path encodings, |I| = Theta(ell^d) =
      Theta(p^{1+eps}); D = {1,2} x I; f(b,s) = h(j(endpoint of path s from
      E_b)); x_{i+1} = f(x_i) from random starts. Each evaluation recomputes a
      fresh length-d path, costing d = Theta(log_ell p) isogeny steps.
    hash_specification: >-
      SPECIFIED HERE (N6, which this record treats as LOAD-BEARING rather than
      cosmetic). h(v) = (b(v), i(v)) with b(v) in {1,2} one PRF output bit and
      i(v) in I a PRF output, both keyed on a canonical encoding of j(v); cost
      poly(log p), absorbed in W3's o(1). v1 called h "bijection-like", which it
      cannot be since |D| = 2|I| >> |V|. If b(.) were constant, every iterate
      after step 1 would sit on one side, no cross-side collision would ever be
      detected, and Algorithm 2 would return bottom on every input. The
      pseudorandom side bit is a CORRECTNESS requirement.
    distinguished_point_predicate: >-
      x is distinguished iff the first ceil(log2(1/theta)) bits of its canonical
      encoding are zero; expected trail length L = 1/theta, set to
      max(1, sqrt(M'/w)) with M' = |im f| = Theta(n_V) per the van
      Oorschot-Wiener parameterisation.
    collision_to_path_reconstruction: >-
      A cross-side collision (1,s_1),(2,s_2) with equal endpoint F yields the
      concatenation of the length-d path E_1 -> F with the reverse of the
      length-d path E_2 -> F: an isogeny E_1 -> E_2 of degree dividing
      ell^{2d}, described by 2d = 2(1+eps)log_ell(p) = Theta(log p) steps, hence
      POLYNOMIAL description size. Correctness needs no heuristic (Lemma 6,
      unchanged by RC2).
    any_vs_golden_collision_accounting: >-
      THE CRUX, RESTATED AND STRENGTHENED BY RC2. For unrestricted-degree
      path-finding (Problems 1 and 2) the cross-side claw count under H1_prime is
      C = Theta(|I|^2/n_V) = Theta(p^{1+2eps}), and the fraction of DETECTED
      f-collisions that are usable cross-side claws is 1/2 - o(1) = Theta(1)
      (Lemma 4', errata_note.md section 2.4). Hence only k = Theta(1) collisions
      must be sifted, and by Lemma 5' the cost is Theta(sqrt(M')) with
      M' = |im f| = Theta(n_V) - INDEPENDENT OF MEMORY w. For FIXED-degree CSSI
      (Problem 3) the degree constraint leaves C = 1, so k = Theta(M') and the
      cost is Theta(sqrt(M'^3/w)) - memory matters at exponent level. This is
      exactly why the SIDH/CSSI vOW-vs-MITM cost-model literature (KN-LIT-124,
      KN-LIT-125) does NOT transfer to pure path-finding, and it is the precise
      technical reason IDEA-20260725-001's premise fails on F_{p^2}.
    any_vs_golden_v1_statement_retired: >-
      v1 stated the claw count as C = Theta(M) with M = |D|. That equality is
      RETIRED, not merely restated: with |D| = Theta(p^{1+eps}) and
      C = Theta(p^{1+2eps}) we have C/|D| = Theta(p^{eps}) -> infinity, so
      C = omega(|D|), not Theta(|D|). See disagreements_with_the_review item 1.
      The OPERATIVE conclusion (claws abundant, k = Theta(1), w-independence)
      survives and is strengthened.
    cost:
      time: p^{1/2+o(1)} ell-isogeny steps
      memory: polylog (w is a free parameter and does not affect the exponent)
      full_cost: p^{1/2+o(1)}
      parallelisation: time p^{1/2+o(1)}/n on n processors, full cost unchanged
      derivation_status_after_RC2: >-
        THE HEADLINE FOLLOWS FROM ITS OWN LEMMAS AFTER THE RESTATEMENT, AND DID
        NOT BEFORE. The number is unchanged; the justification is not. v1's
        arithmetic gave the right exponent only because at v1's sizing
        |D| = 2|I| = Theta(p) coincided numerically with |im f| = Theta(n_V) =
        Theta(p). Decoupling d from the index-space size exposes it.
    uncharged_oracle_used: false
    nonstandard_graph_access_used: false
    primitive_required: >-
      Phi_ell neighbour evaluation only - the same primitive MITM and
      Delfs-Galbraith require, charged identically under W3.
    novelty_status: adaptation
    novelty_basis: >-
      It MATCHES a known exponent at a known memory profile; the archived primary
      text states that the classic p^{1/2+o(1)} algorithms already use polynomial
      memory. Algorithm 2 is not a new algorithm and no novelty is claimed for
      it. What is not stated in any archived corpus entry, and is derived here,
