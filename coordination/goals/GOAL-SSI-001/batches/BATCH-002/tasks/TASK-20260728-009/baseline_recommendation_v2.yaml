  # ---------------------------------------------------------- completion flag

  new_attack_mechanism_detected: false
  new_attack_mechanism_justification: >-
    Reached independently in this session and NOT by adopting v1's justification,
    one of whose four items is withdrawn under N2. Nothing produced here changes
    the asymptotic exponent of a named hard problem, which is the bar
    docs/target-result-profile.md rule A1 sets.
    (1) Algorithm 2, as restated by RC2, reaches p^{1/2+o(1)} at polylog memory;
    the archived primary text already places "the classic p^{1/2+o(1)} algorithms
    with polynomial memory like [21]" at exactly that point. Matching a known
    exponent at a known memory profile is an adaptation, and it is labelled one.
    (2) The w-independence result is a NEGATIVE result about attacks - memory buys
    nothing when claws are abundant. A theorem that a resource does not help is
    not an attack mechanism, and RC2 strengthens the negative.
    (3) RC1 makes MITM MORE expensive than v1 claimed, Omega(p^{2/3}) uniformly,
    for an algorithm already dominated in both regimes. Raising the cost of a
    dominated algorithm is not an attack mechanism. The rebalanced MITM table size
    v1 cited at this point does not exist.
    (4) REPLACING v1's UNSOUND ITEM (3), per N2: the p^{2/5+o(1)} rebalance DOES
    LOWER a live attack's full cost, from p^{4/9+o(1)} as operated to p^{2/5+o(1)}
    at w = p^{1/5+o(1)}. That is stated plainly here rather than the withdrawn
    claim that it raises the cost. It is nonetheless not target-class under rule
    A1, on four grounds: (a) it is a parameter choice on a time-memory tradeoff
    the source text itself offers and explicitly invites; (b) it RAISES the time
    exponent from 1/3 to 2/5, and the goal's baselines are quoted in time; (c) it
    is conditional on a Heuristic 1 this program has neither validated nor
    challenged, above a superpolynomial o(1) the source's own authors disclose, so
    no concrete-parameter conclusion follows; (d) the best-known time exponent for
    the hard problem is unchanged at 1/3.
    (5) The any-claw/golden-claw distinction EXPLAINS why the exponents are what
    they are and produces no algorithm that beats a baseline. It remains the
    artifact's genuine content and is present in no archived corpus entry found
    here, but explanatory content is not a mechanism.
    (6) PROP-11 remains correctly falsified in place. This session did NOT
    re-verify Theorem 1.5 against the primary text; RT-20260728-007 RS1 reports
    doing so, and that verification is carried here as the REVIEW's, attributed,
    not as this session's.
    (7) A mechanism was looked for within this erratum's scope and none was found.
    That is ABSENCE OF EVIDENCE WITHIN ONE DERIVATION, not an impossibility claim
