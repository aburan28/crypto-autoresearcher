      Theta(p^{1/2}) INDEPENDENT RESTARTS of non-backtracking walks of length
      d_0 = (1+eps)*log_ell(p) from E_i, testing each endpoint for F_p-rationality
      (j in F_p, a test on the canonical F_{p^2} representation, cost poly(log p))
      and storing only the successful O(log p)-step path.
    repaired_cost:
      steps: p^{1/2+o(1)} (unchanged)
      memory: polylog
      output: a path of Theta(log p) ell-isogenies, polynomial description size, composable
      derivation: errata_note.md section 3.2
    repair_is_conditional_on: H1_prime
