  # ------------------------------------------ disagreements with the review

  disagreements_with_the_review:
    - id: D1
      target: RT-20260728-007 objection F2, field note_on_lemma_4_robustness
      review_says: >-
        Lemma 4's conclusion C = Theta(M) "happens to be robust: it holds both in
        the near-bijective regime the note actually sits in and in the repaired
        regime."
      i_say: >-
        It does NOT hold in the repaired regime. With d = (1+eps)log_ell(p),
        M = |D| = 2|I| = Theta(p^{1+eps}) while C = Theta(|I|^2/n_V) =
        Theta(p^{1+2eps}), so C/M = Theta(p^{eps}) -> infinity and C = omega(M).
        The reviewer's OPERATIVE point - claws are abundant and the
        w-independence is strengthened - is correct and is what Lemma 5' consumes.
        The stated equality is not, so this record retires it and replaces it
        with Lemma 4'(a) (the claw count) and Lemma 4'(b) (the Theta(1) useful
        fraction of detected collisions), which is the quantity the cost argument
        actually needs.
      affects_any_verdict: false
    - id: D2
      target: RT-20260728-007 objection N6, severity classification
      review_says: nonfatal; "no correctness bug follows" because line 7 re-tests g(y) = g(y').
      i_say: >-
        The re-test handles h-COLLISIONS but not the SIDE BIT. If h's side
        component were constant, every iterate after step 1 would sit on one side,
        no cross-side collision would ever be detected, and Algorithm 2 would
        return bottom on every input. N6 is therefore load-bearing for Lemma 4'(b)
        and is fixed here by specifying h, not deferred.
      affects_any_verdict: false
    - id: D3
      target: >-
        RT-20260728-007 RC1 "decides" text and the surviving_elements entry for
        honest_open_item #1
      review_says: >-
        honest_open_item #1 "closes in Wiener's favour", pending RC5
        confirmation.
      i_say: >-
        Agreed in direction, narrower in claim. What is settled by pen and paper
        is the INTERNAL INCONSISTENCY of SSI-FC-2026: with the build charged, the
        optimum over m coincides with the textbook balance and reproduces the
        n^{2/3+o(1)} recorded in KN-LIT-094. Whether KN-LIT-094 itself states
        n^{2/3} as an optimum over m is an attribution question that no
        pen-and-paper step can settle. This record therefore reads
        closed_within_SSI_FC_2026 rather than closed.
      affects_any_verdict: false
    - id: D4
      target: RT-20260728-007 objection F2, the counting argument
      review_says: >-
        at ell^d = Theta(n_V), "a map I -> V with |I| = |V| leaves an e^{-1}
        fraction of V unhit under H1's own random model, so the TV distance to
        uniform is Omega(1)".
      i_say: >-
        SHARPENING, NOT A DISAGREEMENT. The review does flag this as
        model-internal. Recording which half carries rigorous weight: the
        support-counting bound TV >= 1 - |I|/n_V is rigorous only when
        |I| <= (1-delta)n_V; for |I| = A*n_V with A >= 1 the Omega(1) conclusion
        is model-internal (TV -> (1/(2A))E|Poisson(A) - A|). The DECISIVE
        rigorous argument is the spectral one: the Ramanujan bound H1 cites gives
        TV <= (1/2)poly(d)(n_V/ell^d)^{1/2}, which reaches p^{-Omega(1)} only for
        ell^d >= n_V^{1+Omega(1)}, forcing c > 1 strictly. Conclusion unchanged.
      affects_any_verdict: false
  agreement_elsewhere: >-
    This record agrees with every other element of F1, F2, F3, N1-N9, with the
