      MEMORY PROFILE IS THEREFORE RECORDED AS CITED, NOT DERIVED.
    unverified_here: >-
      Whether the published Delfs-Galbraith descent is one long walk or restarts,
      and whether its F_p-rationality criterion matches the one above, is
      UNVERIFIED: KN-LIT-078 was not read. That is RC4, carried open.
    not_affected: >-
