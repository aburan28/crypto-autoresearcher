  definition of the van Oorschot-Wiener distinguished-point collision search
  on the supersingular l-isogeny graph, including the walk model (random
  l-isogeny steps with hash-based edge selection), distinguished predicate
  (leading-zero-bits on j-invariant), and collision-to-path reconstruction
