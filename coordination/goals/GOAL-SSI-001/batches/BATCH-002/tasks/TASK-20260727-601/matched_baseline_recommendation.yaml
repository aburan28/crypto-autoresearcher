  oracles); (3) the full-cost exponents for VW (p^{1/2} F_{p^2}, p^{1/4} F_p
  conditional on mixing); (4) the matched-baseline recommendation (VW, not
  MITM/DG, under full cost). This fills the gap identified in the BATCH-001
  candidate report: KN-TECH-029 records step-count exponents but does not
  apply Wiener full-cost accounting, and the isogeny-graph VW analogue was
  not present in the spine.
