regimes:
  F_p2:
    mitm_step_count_exponent: "1/2"
    mitm_full_cost_exponent: "2/3"
    low_memory_collision_search:
      defined: true
      time_exponent: "1/2"
      space_exponent: "poly"
      obstruction: null
      walk_model: >-
        Deterministic random walk on the supersingular l-isogeny graph G_l:
        at each vertex, select one of (l+1) order-l subgroups of E[l] via
        hash(j(E)) mod (l+1), compute the l-isogeny via Velu. Ramanujan
        mixing time O(log p) guarantees the birthday bound O~(p^{1/2}).
      distinguished_predicate: >-
        j-invariant with d leading zero bits in canonical F_{p^2} encoding
        (d tunable; set 2^d = p^{1/4} for optimal full cost).
      collision_to_path_reconstruction: >-
        Well-defined. Re-run both walks from starting curves, using
        distinguished-point segmenting to locate the merge vertex in
        polynomial space. Compose one path with the dual of the other (Velu
        duals from stored kernels) plus the F_{p^2}-isomorphism for curves at
        the same j-invariant. No uncharged oracles required.
      full_cost_exponent: "1/2"
      full_cost_note: >-
        Polynomial space means no 3D wiring penalty; full cost equals step
        count. Strictly dominates MITM full cost p^{2/3}.
    delfs_galbraith_exponent: "not applicable to F_{p^2} regime"
    matched_baseline: "VW distinguished-point collision search"
    matched_baseline_full_cost_exponent: "1/2"
    decision_relevant: true
    decision_relevant_note: >-
      Under full cost, the matched baseline changes from MITM (p^{2/3}) to VW
      (p^{1/2}). The step-count exponent is unchanged (1/2). A candidate must
      beat p^{1/2} full cost, not the easier p^{2/3} MITM target.
  F_p:
    delfs_galbraith_step_count_exponent: "1/4"
    delfs_galbraith_full_cost_exponent: "1/3"
    mitm_step_count_exponent: "1/2"
    mitm_full_cost_exponent: "2/3"
    low_memory_collision_search:
      defined: true
      time_exponent: "1/4"
      space_exponent: "poly"
      obstruction: >-
        Conditional definition: requires rapid mixing of the F_p-rational
        subgraph G_l^{F_p}, which is NOT proven (the subgraph is not known to
        be Ramanujan). Delfs-Galbraith uses BFS-based MITM and does not
        require mixing. If the mixing assumption fails, the VW analogue on
        the F_p subgraph is falsified and DG at p^{1/3} full cost remains the
        baseline.
      walk_model: >-
        Same as F_{p^2} but restricted to F_p-rational curves and
        F_p-rational l-isogenies. State space N' ~ sqrt(p); birthday bound
        gives O~(p^{1/4}) steps conditional on mixing.
      distinguished_predicate: >-
        Same as F_{p^2}: leading zero bits on j-invariant encoding.
      collision_to_path_reconstruction: >-
        Same as F_{p^2}: re-run walks with distinguished-point segmenting,
        compose with dual isogeny. No uncharged oracles required.
      full_cost_exponent: "1/4"
      full_cost_note: >-
        Polynomial space means no wiring penalty; full cost equals step
        count. Strictly dominates DG full cost p^{1/3}, conditional on the
        mixing assumption.
    matched_baseline: "VW distinguished-point collision search (conditional on F_p subgraph mixing)"
    matched_baseline_full_cost_exponent: "1/4"
    matched_baseline_fallback: >-
      If the F_p subgraph mixing assumption is rejected, Delfs-Galbraith at
      full cost p^{1/3} is the matched baseline.
    decision_relevant: true
    decision_relevant_note: >-
      Under full cost, the matched baseline changes from DG (p^{1/3}) to VW
      (p^{1/4}), conditional on mixing. The step-count exponent is unchanged
      (1/4). A candidate must beat p^{1/4} full cost (or p^{1/3} if mixing is
      rejected), not the easier DG full-cost target.
overall_recommendation: >-
  The honest matched baseline under Wiener full-cost accounting is the
  low-memory van Oorschot-Wiener distinguished-point collision search, not
  MITM or Delfs-Galbraith, in both regimes. For F_{p^2}, VW achieves full
  cost O~(p^{1/2}) with polynomial space, strictly dominating MITM's full
  cost p^{2/3}; the Ramanujan property guarantees mixing. For F_p, VW
  achieves full cost O~(p^{1/4}) on the F_p subgraph, strictly dominating
  DG's full cost p^{1/3}, but this is conditional on an unproven mixing
  assumption for the F_p subgraph (DG's BFS does not need mixing). In both
  regimes, the full-cost exponent of the matched baseline equals the
  step-count exponent, because the low-memory property eliminates the 3D
  wiring penalty. Full-cost accounting changes which algorithm is the
  baseline (MITM/DG -> VW) but does not change the hardness exponent
  (p^{1/2} for F_{p^2}, p^{1/4} for F_p). This is a matched-baseline
  correction, not a material ranking change or a sub-p^{1/4} break. It is
  decision-relevant because it raises the bar for novelty screening: future
  candidates must beat the VW full cost, not the easier MITM/DG full cost.
knowledge_promotion_warranted: true
knowledge_promotion_note: >-
  Create a new KN-TECH entry (or update KN-TECH-029) to record: (1) the
