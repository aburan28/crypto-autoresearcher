  objections:

    - id: F1
      severity: fatal_to_a_derived_exponent_nonfatal_to_every_verdict
      title: >-
        W2 is applied asymmetrically INSIDE Algorithm 1 - the table build phase
        is not charged for memory access - which voids the p^{3/5} figure
      gate: R2
      target: derivation_note.md Lemma 3 (4.4); baseline_recommendation.yaml exponent_table row 2 and gap_widening
      detail: >-
        Lemma 3 charges W2 to the q lookups (T_wall >= q/m^{2/3}) but charges the
        m table INSERTIONS only as "each of m entries costs one unit; H.T >= m".
        Algorithm 1 line 4 writes T[j(endpoint(s))] <- s: those are m RANDOM
        accesses into an m-cell memory, indistinguishable under W2 from the
        lookups. Endpoints arrive in an order unrelated to their j-invariants, so
        the table cannot be built in place; hashing requires routing and sorting
        requires a mesh sort, and both cost Omega(m^{1/3}) wall-clock at H >= m.
        The honest build charge is FC_build = Omega(m^{4/3}), not Omega(m).
      corrected_result: >-
        FC(Alg. 1) = Omega(max(m^{4/3}, p/m^{2/3})). The two branches cross at
        m^{4/3} = p.m^{-2/3}, i.e. m^2 = p, i.e. m = p^{1/2}, where both equal
        p^{2/3}. Therefore the TEXTBOOK BALANCE IS the full-cost optimum and
        FC(Alg. 1) = Omega(p^{2/3}) for EVERY m. There is no p^{3/5} regime.
      what_must_be_withdrawn:
        - "p^{3/5} as a full-cost-optimal MITM rebalance (note 4.4 consequence 2, 4.5, 6.3, 7.2 table row 2)"
        - "exponent_table row 'MITM, full-cost-optimal m=p^{3/5}' with full_cost_exponent 0.6"
        - "gap_widening.full_cost_gap_vs_rebalanced_MITM: p^{7/20}"
        - "asymmetric_charge_audit: NONE FOUND (see N4)"
      direction_of_error: >-
        CONSERVATIVE with respect to the producer's own conclusions. The
        correction makes MITM MORE expensive, uniformly p^{2/3}. G1 ("strictly
        exceeds 1/2") gets stronger and becomes uniform in m; G2 is untouched
        (it runs off Lemma 1, not W2); the F_p full-cost gap becomes p^{5/12}
        for every MITM parameterisation.
      unexpected_bonus: >-
        This DISSOLVES the producer's own honest_open_item #1. The note could not
        settle why Wiener publishes n^{2/3} while its own optimisation gave
        n^{3/5}, and labelled the discrepancy an untested expectation. The answer
        is that n^{3/5} was an artifact of the uncharged build phase: with the
        build charged, n^{2/3} at m = n^{1/2} is BOTH the textbook figure and the
        optimum, exactly as KN-LIT-094 and KN-TECH-035 report ("the sqrt(n)-element
        table cannot be reached in unit time"). The W2 consistency check is
        therefore STRONGER than the producer claimed, not weaker - it matches at
        the optimum rather than coincidentally at an arbitrary balance point.
      does_this_asymmetry_also_affect_the_other_algorithms: >-
        NO, and I checked both. Algorithm 2 writes once per trail: with w polylog
        and L = sqrt(M/w), the run performs O(sqrt(w)) = polylog writes, so the
        W2 charge is polylog either way. Lemma 9 ALREADY charges writes correctly
        - its constraint n/L <= w^{2/3} IS the write-throughput bound, and reads
        occur at the same rate. So the asymmetry is localised to Lemma 3, and
        C-gamma (p^{4/9} / p^{2/5}) survives F1 intact.
      cheapest_discriminating_control: >-
        Pen and paper, zero compute: minimise max(m^{4/3}, p.m^{-2/3}) over m.

    - id: F2
      severity: fatal_to_the_stated_justification_nonfatal_to_the_headline
      title: >-
        Algorithm 2's walk-length sizing is incompatible with H1 - H1's
        conclusion is provably FALSE at the length the algorithm uses
      gate: R4
      target: derivation_note.md 5.1 (Index space), Lemma 4 (5.2), Lemma 5 (5.3), Lemma 7 (5.5), and 6.2 by the same argument
      detail: >-
        Algorithm 2 fixes the index space at |I| = (ell+1)ell^{d-1} = Theta(n_V),
        i.e. d = log_ell(p) - O(1), and Lemma 5 then runs the birthday analysis
        with M = |D| = 2|I|. H1 asserts near-uniformity (TV <= p^{-Omega(1)}) only
        for d >= c.log_ell(p), with c never quantified. The two requirements
        cannot both hold. At ell^d = Theta(n_V) the endpoint distribution is
        carried by at most Theta(n_V) paths onto n_V vertices with weights that
        are multiples of 1/|I|; a map I -> V with |I| = |V| leaves an e^{-1}
        fraction of V unhit under H1's own random model, so the TV distance to
        uniform is Omega(1), not p^{-Omega(1)}. Independently, the Ramanujan
        ingredient H1 cites cannot deliver p^{-Omega(1)} at d = log_ell n_V: the
        non-backtracking equidistribution bound needs ell^d >= n_V^{1+Omega(1)},
        so c > 1 STRICTLY and |I| must be p^{1+Omega(1)}, not Theta(n_V).
      why_this_is_not_pedantry: >-
        With |I| = p^{1+eps} the note's own Lemma 5 returns
        T = Theta(sqrt(M)) = Theta(p^{(1+eps)/2}), NOT p^{1/2+o(1)}. The stated
        cost follows from the stated lemmas only at the walk length where the
        stated heuristic is false. This is exactly the "random-model transfer"
        failure the red-team contract asks about: a uniform-endpoint model
        applied at a regime where it provably cannot hold.
      repair_available_and_the_headline_survives: >-
        YES, and I give it so the narrowest valid conclusion is preserved. Take
        d = (1+eps).log_ell(p) so H1 applies, and run the birthday analysis on
        |im f| rather than on |D|. Because f = h.g factors through the VERTEX set,
        |im f| <= n_V = Theta(p) whatever d is; after one step every iterate lies
        in that set. Hence t = Theta(sqrt(n_V)) = Theta(p^{1/2}) evaluations at
        d = O(log p) isogeny steps each, giving T_steps = p^{1/2+o(1)} at polylog
        memory - the same headline. Claws become C = |I|^2/n_V = p^{1+2eps},
        super-abundant, so k = Theta(1) and the w-INDEPENDENCE conclusion is
        strengthened, not weakened.
      what_must_be_restated: >-
        Lemmas 4, 5 and 7 must be restated with the birthday parameter |im f| =
        Theta(n_V) and with d decoupled from the index-space size. As written
        they are correct only under a sizing choice that contradicts H1.
      note_on_lemma_4_robustness: >-
        Lemma 4's CONCLUSION (C = Theta(M)) happens to be robust: it holds both
        in the near-bijective regime the note actually sits in and in the
        repaired regime. Its PROOF via H1 does not hold in the former. Recorded
        so the correction is not overstated into a falsification.
      cheapest_discriminating_control: >-
        Pen and paper, zero compute: bound the TV distance to uniform of a
        distribution supported on <= n_V points with atom sizes in (1/|I|)Z when
        |I| = Theta(n_V), and compare with the p^{-Omega(1)} that H1 asserts.

    - id: F3
      severity: fatal_to_a_reconstruction_nonfatal_to_the_cited_claim
      title: >-
        Algorithm 3 step 1 is stated in the exact form the note's own
        Proposition 10 falsifies - a double standard applied to the note's own
        baseline
      gate: R3
      target: derivation_note.md 6.1 Algorithm 3 lines 1 and 3; 6.1 closing paragraph; regime_F_p2 exponent_table row 3 basis
      detail: >-
        Algorithm 3 step 1 reads "random-walk in the F_{p^2} graph until an
        F_p-rational curve is reached. # Theta(n_V/S) = p^{1/2+o(1)} steps, O(1)
        memory: nothing is stored", and step 3 reads "compose the three pieces".
        Those are contradictory: a walk that stores nothing cannot be composed,
        and a stored walk of Theta(p^{1/2}) steps certifies an isogeny of degree
        ell^{Theta(p^{1/2})} at Theta(p^{1/2}) memory. That is verbatim the
        falsification Proposition 10 (5.6) applies to the naive LMCS variant. The
        note therefore applies a falsification standard to a rival construction
        that it does not apply to its own baseline, and 6.1's claim that "step
        1's memory profile is derived here" is a derivation from an inconsistent
        specification.
      repair_available: >-
        YES. Replace the single long walk by Theta(p^{1/2}) INDEPENDENT restarts
        of short walks of length Theta(log_ell p) from E_i, testing each endpoint
        for F_p-rationality and storing only the successful O(log p)-step path.
        Step count is unchanged at p^{1/2+o(1)}, memory returns to polylog, and
        the output regains polynomial description size. But the repair is
        CONDITIONAL ON H1 (the short-walk endpoint must be near-uniform on V for
        the hitting probability to be S/n_V), which matters for the next line.
      consequence_for_the_unconditional_tier: >-
        regime_F_p2's "unconditional tier" survives ONLY BY CITATION to the
        archived sentence, not by the note's derivation. As derived it is
        conditional on H1; as cited it is unconditional. The recommendation must
        say which, because exponent_table row 3's basis currently says both at
        once ("derived in place (Lemmas 4-7); the exponent AND the polynomial-
        memory profile are independently attested by ...").
      not_affected: >-
        The F_p verdict (Problem 2) is untouched: its inputs are already
        F_p-rational, so step 1 is never executed.

    - id: N1
      severity: nonfatal
      title: "mitm_ever_competitive: false equivocates over which MITM"
      gate: R1
      target: baseline_recommendation.yaml regime_F_p.mitm_ever_competitive and mitm_verdict_proof
      detail: >-
        The proof runs on MITM over the FULL F_{p^2} graph (T_steps = Omega(p^{1/2})).
        But the note's own F_p table lists "DG + MITM inner search" at p^{1/4}
        steps, p^{1/4} memory, full cost p^{1/3+o(1)} - a MITM that is the
        H3-free fallback and that beats every p^{1/2} general algorithm on this
        regime. So a MITM IS competitive on F_p; it is simply the wrong-scoped
        MITM that is not. The prose (6.2) gets this right; the machine-readable
        flag, which is what a downstream ledger record will quote, does not.
      required_fix: >-
        Rename to mitm_over_full_graph_ever_competitive: false and add
        mitm_as_inner_search_within_Vp: full cost p^{1/3+o(1)}, the H3-free
        fallback.

    - id: N2
      severity: nonfatal
      title: G5 justification item (3) misstates the sign of the p^{2/5} correction
      gate: R6
      target: derivation_note.md 8 item 3; baseline_recommendation.yaml new_attack_mechanism_justification item (3)
      detail: >-
        "The p^{2/5+o(1)} figure RAISES the effective cost" is true only against
        the p^{1/3} TIME headline. Against the same algorithm's own full cost AS
        OPERATED (p^{4/9}, Lemma 9), the rebalance to w = p^{1/5} LOWERS full
        cost to p^{2/5}. So the note simultaneously derives a cheaper way to run
        a live attack in the full-cost metric and cites "it made attacks more
        expensive" as a reason no mechanism was found. The VERDICT is still
        correct (see my R6 reasoning, which does not use this argument), but the
        justification as written is unsound and must not be relayed.
      required_fix: >-
        Replace item (3) with: the rebalance is a parameter choice on the
        time-memory tradeoff the source text itself offers ("This allows one to
        interpolate between the p^{1/3+o(1)} high-memory algorithm presented here
        and the classic p^{1/2+o(1)} algorithms"), it RAISES the time exponent
        from 1/3 to 2/5, and under rule A1 moving an auxiliary cost metric of an
        existing algorithm along a published tradeoff curve is not target-class.

    - id: N3
      severity: nonfatal
      title: The entire F_p matched baseline rests on relays of a paper nobody in this repository has read
      gate: R3
      target: baseline_recommendation.yaml regime_F_p.matched_baseline_verdict
      detail: >-
        p^{1/4+o(1)} and S = |V_p| = p^{1/2+o(1)} come from KN-TECH-029
        (confidence reported) sourcing KN-LIT-078, whose own entry states
        "Full paper not read; the p^{1/2} / p^{1/4} costs relayed from the
        abstract" and citation_verified: web. KN-TECH-050 explicitly instructs a
        BATCH-002 derivation that it "must obtain every quoted figure from the
        papers themselves". The F_{p^2} figures satisfy that (archived primary
        text). The F_p figures do not. The note discloses this in 10 and residue
        item 10/11; the YAML verdict states p^{1/4+o(1)} flatly.
      required_fix: >-
        Carry confidence: reported inline into regime_F_p.matched_baseline_verdict,
        or obtain KN-LIT-078 (arXiv:1310.7789) and upgrade the corpus entry.

    - id: N4
      severity: nonfatal
      title: "asymmetric_charge_audit: NONE FOUND is falsified by F1"
      gate: R2
      target: baseline_recommendation.yaml cost_convention.asymmetric_charge_audit
      detail: >-
        There IS an asymmetric charge (F1). Credit where due: the field is
        explicitly scoped "NONE FOUND BY THE PRODUCER" and defers to R2 of this
        card, which is the honest framing and the reason I could find it quickly.
        But the field must be superseded before it is relayed as a finding.

    - id: N5
      severity: nonfatal
      title: The F_{p^2} table merges LMCS and Delfs-Galbraith into one row, transferring an attestation that does not cover LMCS
      gate: R3
      target: derivation_note.md 7.2 table row 3; baseline_recommendation.yaml exponent_table row 3 basis
      detail: >-
        "LMCS (Alg. 2) / DG general (Alg. 3)" is one row with one basis claiming
        the exponent and memory profile "are independently attested" by the
        archived sentence "the classic p^{1/2+o(1)} algorithms with polynomial
        memory like [21]". That sentence attests [21] = Delfs-Galbraith. It does
        not attest Algorithm 2, which is the note's own construction and which
        F2 shows needs restating. Split the row.

    - id: N6
      severity: nonfatal
      title: The hash h is called "bijection-like" but cannot be a bijection, and is never specified
      gate: R4
      target: derivation_note.md 5.1 Hash line
      detail: >-
        h : V -> D with |D| = 2|V| cannot be a bijection. What Algorithm 2
        actually needs is an efficiently computable near-uniform encoding of
        j-invariants into D. That is cheap and standard (canonical F_{p^2}
        encoding plus a PRF) and absorbs into W3's o(1), and line 7 already
        filters h-collisions by re-testing g(y) = g(y'), so no correctness bug
        follows. But it is the one unspecified component of the walk law, and R4
        asks about the walk law.

    - id: N7
      severity: nonfatal
      title: A cited-but-unused corpus entry
      gate: R3
      target: baseline_recommendation.yaml citations.knowledge_corpus
      detail: >-
        KN-TECH-044 is listed among the citations and appears nowhere in
        derivation_note.md. Over-citation in a machine-readable provenance list
        makes automated provenance checks lie. Drop it or use it.

    - id: N8
      severity: nonfatal
      title: Lemma 4's "constant fraction of f-collisions are usable claws" is asserted, not derived
      gate: R3
      target: derivation_note.md 5.2 parenthetical
      detail: >-
        "(genuine same-side coincidences plus h-collisions contribute Theta(M) as
        well)" carries the whole constant-fraction conclusion and is stated
        without derivation. It is believable under H2 and the note disclaims the
        constants, but the cross-side FRACTION is what decides how many
        collisions must be sifted, and it is the quantity a structural bias in g
        would attack first. Fold it into H4's falsification condition explicitly.

    - id: N9
      severity: nonfatal_procedural
      title: The archive card's three-path constraint is unsatisfiable as written
      gate: R8
      target: dispatch_queue.json TASK-20260728-006 constraints
      detail: >-
        See snapshot_verification.receipt_discrepancy_observed. The archiver did
        the right thing and said so. The queue text should be amended for future
        batches so a correct archiver is not forced to record a deviation.

  gate_verdicts:
    R1:
      question: Are the F_{p^2} and F_p regimes genuinely separated or blended, and is RT-20260725-503 F2 addressed by name?
      verdict: GENUINELY_SEPARATED; F2_ADDRESSED_BY_NAME_AND_CORRECTLY_UPHELD
      reasoning: >-
        Separate problem statements (1 vs 2), separate sections (4/7.2 vs
        6/7.2), separate exponent tables, separate YAML blocks regime_F_p2 and
        regime_F_p, and no blended ranking anywhere. F2 is quoted in a section
        heading, restated faithfully against its RT-20260725-503 text including
        its "must split the regimes or this is a non-result" clause, and upheld
        rather than argued away - which is the harder and more honest
        disposition, since upholding it makes the producer's own idea vacuous on
        that regime. The only leakage is 6.2 importing Lemma 3 with p -> S, which
        is disclosed. One deduction: N1, the YAML flag that blurs which MITM.
    R2:
      question: Is ONE cost convention applied identically to MITM, the low-memory analogue, and Delfs-Galbraith?
      verdict: NO - ONE ASYMMETRY FOUND, IN THE DIRECTION THAT FLATTERS MITM
      reasoning: >-
        W1-W6 are genuinely shared and W3's o(1) absorption is uniform. But
        Lemma 3 charges W2 to MITM's lookups and not to its table build (F1),
        while Lemma 9 charges both directions for the vOW rebalance and Algorithm
        2 genuinely touches memory only once per trail. Fixing it makes MITM
        uniformly p^{2/3} and deletes the p^{3/5} row. The asymmetry is
        conservative with respect to every verdict the producer reached, which is
        the unusual and creditworthy direction for an error of this kind, but it
        still voids three published numbers.
    R3:
      question: Does every asserted exponent, constant and bound have an archived source or an in-note derivation?
      verdict: MOSTLY YES; THREE DEFECTS AND ONE UNSOURCED-BY-PRIMARY REGIME
      reasoning: >-
        I independently confirmed in
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md: the load-bearing sentence
        "the classic p^{1/2+o(1)} algorithms with polynomial memory like [21]"
        (line 39, verbatim); the vOW tradeoff sqrt(N^3/w) = p^{1/2+o(1)}/w^{1/2}
        and its parallel form (lines 39, 41); Theorem 1.1 and Corollary 1.2
        conditional on Heuristic 1 (lines 19, 23); Heuristic 1's exact statement
        (line 69); Theorem 1.5's (p/2)^{1/3} bound on E -> E^{(p)} (line 81);
        Lemma 3.3, Lemma 3.4, and Remark 1 (lines 154, 160, 191); and the
        superpolynomial o(1) overhead (lines 13, 39). All are used accurately and
        none is overstated. I also confirmed against KN-LIT-094 and KN-TECH-035
        that Wiener's model IS three-dimensional and that n^{2/3} is reported for
        the sqrt(n)-element table - so W2's choice of 3 dimensions is SOURCED,
        which I had expected to be the weak point and it is not. Defects: F1
        (p^{3/5} derived from an incomplete charge), F2 (p^{1/2+o(1)} for
        Algorithm 2 derived from lemmas whose sizing contradicts H1), F3 (DG step
        1's memory "derived here" from an inconsistent specification), and N3
        (the whole F_p regime relayed from an unread abstract).
    R3_hardest_press:
      question: The producer's self-declared weakest link - that the F_{p^2} baseline was NEVER memory-heavy.
      verdict: THE CITED SENTENCE HOLDS AND I CONCUR WITH THE CONCLUSION; THE RECONSTRUCTION BUILT ON IT DOES NOT HOLD AS WRITTEN
      reasoning: >-
        I read the sentence myself at line 39 and it says what the producer says
        it says, in a sentence whose surrounding clauses (the vOW interpolation)
        make the memory-light reading the only coherent one. "Polynomial memory"
        against an input size of log p means poly(log p); that reading is
        standard but it IS a reading, and it should be labelled an interpretation
        rather than a quotation. What does NOT survive is the reconstruction:
        6.1's O(1)-memory Delfs-Galbraith step 1 is falsified by the note's own
        Proposition 10 (F3), and Algorithm 2's memory-light profile is derived
        from lemmas that contradict H1 (F2). So the claim stands on one
        parenthetical clause of a related-work paragraph in a paper about a
        different algorithm, plus two repairable-but-currently-broken
        reconstructions. That is enough to dissolve IDEA-20260725-001's premise -
        a premise only needs one solid counter-fact - and NOT enough to be quoted
        as independently derived. C-alpha should be recorded as CITED, not
        DERIVED, until KN-LIT-078 is read.
    R4:
      question: Is the low-memory analogue well-defined as specified, well-defined only under extra assumptions, or falsified?
      verdict: WELL_DEFINED_ONLY_UNDER_EXTRA_ASSUMPTIONS_AND_ONLY_AFTER_ONE_RESTATEMENT
      reasoning: >-
        Not falsified, and materially better than "underspecified" - the gate's
        forbidden verdict is correctly avoided. Checking each component the gate
        names: WALK LAW - present and the key design choice (walk on path
        indices, not on the graph) is right and is what evades Proposition 10;
        but h is unspecified (N6) and the index-space sizing contradicts H1 (F2).
        DISTINGUISHED-POINT PREDICATE - present, standard, correctly
        parameterised at L = sqrt(M/w). RECONSTRUCTION - present, correct, and
        Lemma 6 rightly notes correctness needs no heuristic; output degree
        ell^{2d} with 2d = O(log p) is genuinely polynomial description size.
        ANY-VERSUS-GOLDEN ACCOUNTING - this is the best thing in the artifact.
        The observation that unrestricted degree gives C = Theta(M) so cost is
        w-independent, while fixed-degree CSSI gives C = 1 so cost is
        Theta(sqrt(M^3/w)), is correct, is the precise reason the SIDH/CSSI
        vOW-versus-MITM literature does not transfer, and is stated in no
        archived corpus entry I could find. It survives every objection above and
        is strengthened by F2's repair. NO uncharged oracle and NO nonstandard
        graph access is used: Phi_ell neighbour evaluation only, charged under W3
        identically to MITM and DG. Proposition 10's falsification of the naive
        variant is correct and is the right thing to have recorded.
    R5:
      question: Is the matched-baseline recommendation decision-relevant or documentation-only?
      verdict: DECISION_RELEVANT - BUT FOR REASONS ORTHOGONAL TO THE COST CONVENTION IT WAS COMMISSIONED TO APPLY
      reasoning: >-
        The gate's stated mechanism (charge MITM's memory) is documentation-only,
        and worse than the producer admits: KN-TECH-050 ALREADY recorded that DG
        "dominates MITM in step count on F_p-rational instances, before any
        memory charge - so on that regime the memory question does not even
        arise". G2 therefore adds rigour, not information. What IS
        decision-relevant is C-beta (KN-TECH-029's Otilde(p^{1/2}) F_{p^2} figure
        is stale against this repository's own archived primary text, which puts
        the frontier at p^{1/3+o(1)} conditional on Heuristic 1) and C-alpha (the
        classical baseline is memory-light, so no future candidate can win by
        charging memory to it). Neither needs a cost model at all. C-gamma is the
        only genuinely cost-model-derived output, and it survives F1. No
        overclaim relative to the evidence tier was found: the claim ceiling, the
        conditionality on the source's Heuristic 1, the derivation label, the
        zero-compute disclosure, and 10's established/derived/speculative split
        are all honoured, and 9's eleven-item uncharged residue is unusually
        complete.
    R6:
      question: Your own verdict on new_attack_mechanism_detected.
      verdict: FALSE - I AGREE WITH THE PRODUCER, ON PARTLY DIFFERENT REASONING
      reasoning: >-
        See new_attack_mechanism_detected below. I reached this independently and
        do not adopt the producer's item (3), which N2 shows is unsound.
    R7:
      question: Are all objections enumerated with IDs and does every surviving element have a bounded next gate or a closure?
      verdict: DONE - see objections, required_controls, and surviving_elements below
    R8:
      question: Snapshot verification, independence, model resolution.
      verdict: SNAPSHOT_VERIFIED_CLEAN; SESSION_INDEPENDENCE_ACHIEVED; MODEL_INDEPENDENCE_NOT_ACHIEVED; MODEL_UNVERIFIED
      reasoning: See snapshot_verification, independence, and inference above.

  required_controls:
    - id: RC1
      objection: F1
      action: >-
        Recharge W2 against Algorithm 1's table-construction phase and recompute
        min over m of max(m^{4/3}, p.m^{-2/3}).
      cost: Zero compute. Pen and paper.
      decides: >-
        Whether p^{3/5} exists at all. If it does not, MITM is uniformly
        Omega(p^{2/3}) and honest_open_item #1 closes in Wiener's favour.
    - id: RC2
      objection: F2
      action: >-
        Restate Lemmas 4, 5 and 7 with d = (1+eps).log_ell(p) and with the
        birthday parameter |im f| = Theta(n_V) instead of |D| = 2|I|.
      cost: Zero compute. Pen and paper.
      decides: >-
        Whether Algorithm 2's p^{1/2+o(1)} follows from its own lemmas. I expect
        it does after the restatement; it does not before.
    - id: RC3
      objection: F3
      action: >-
        Replace Algorithm 3 step 1 with Theta(p^{1/2}) restarts of
        Theta(log_ell p)-length walks, and relabel the F_{p^2} unconditional
        tier's memory profile CITED rather than DERIVED.
      cost: Zero compute.
      decides: >-
        Whether the note's own baseline survives its own Proposition 10.
    - id: RC4
      objection: N3, F3, residue item 10
      action: >-
        Obtain KN-LIT-078 (Delfs-Galbraith, arXiv:1310.7789) from the primary
        source and record (a) the actual memory profile of the inner F_p search
        and (b) whether the descent to V_p is one long walk or restarts.
      cost: One literature fetch. Zero compute.
      decides: >-
        Whether the F_p matched baseline is p^{1/4+o(1)} at polylog memory (as
        reconstructed under H3) or at p^{1/4} memory (in which case the note's
        own H3-free fallback figure p^{1/3+o(1)} is the honest one). Either way
        the F_p RANKING is unchanged - the note built that robustness in on
        purpose and deserves credit for it - so this is a precision control, not
        a verdict control.
    - id: RC5
      objection: F1 cross-check
      action: >-
        Read KN-LIT-094 section 3's BSGS derivation and record whether n^{2/3} is
        stated at m = sqrt(n) or as an optimum over m.
      cost: One literature fetch. Zero compute.
      decides: >-
        Whether RC1's resolution of honest_open_item #1 is confirmed by Wiener
        directly rather than only by my re-derivation.
    - id: RC6
      objection: F1, N1, N2, N4, N5, N7
      action: >-
        Correct baseline_recommendation.yaml's machine-readable fields in a
        SUPERSEDING artifact under a new task id - never by editing the immutable
        snapshot - before EV-SSI-002 or DEC-20260728-004 quote them.
      cost: Zero compute.
      decides: >-
        Whether the ledger inherits three withdrawn exponents and two mislabelled
        flags.
    - id: RC7
      objection: heuristic hygiene, for a successor batch only
      action: >-
        Pre-register the H1/H2/H4 validation the note already sketches
        (chi-square of endpoint occupancy versus uniform at increasing d;
        measured collision rate versus Theta(t^2/|D|); measured claw counts
        versus H4) AND state up front that toy-scale results validate nothing at
        cryptographic scale, so the Deuring-correspondence substitute sampling
        route of paper_fulltext.md 4.2 is required, exactly as the exemplar does
        at p = 5.2^248-1 and p = 27.2^500-1.
      cost: Out of scope for BATCH-002 (zero curve compute). Recorded, not requested.
      decides: Nothing in this batch. Prevents a future toy-scale validation being read as crypto-scale.

  counterexample_or_mutation: >-
    Two, both zero-compute and both decisive on their own objection.
    (1) ALGEBRAIC MUTATION, decides F1: charge Algorithm 1's m table INSERTIONS
    under the same W2 that charges its q lookups. FC becomes
    Omega(max(m^{4/3}, p.m^{-2/3})), whose minimum over m is p^{2/3} at
    m = p^{1/2}. The claimed p^{3/5} full-cost optimum disappears, MITM is
    uniformly Omega(p^{2/3}), and Wiener's published n^{2/3} is recovered as an
    OPTIMUM rather than as a coincidence at an arbitrary balance point.
    (2) COUNTING COUNTEREXAMPLE, decides F2: at the walk length Algorithm 2
    specifies (ell^d = Theta(n_V)), the endpoint distribution is carried by
    Theta(n_V) paths onto n_V vertices; under H1's own random model an e^{-1}
    fraction of V is unhit, so TV distance to uniform is Omega(1), not the
    p^{-Omega(1)} H1 asserts. H1 cannot hold at the length the algorithm uses,
    and the non-backtracking Ramanujan bound independently forces
    ell^d >= n_V^{1+Omega(1)}, i.e. c > 1 strictly.

  baseline_comparison:
    convention: SSI-FC-2026 as corrected by F1, applied identically to all four algorithms
    bsgs_analogue:
      algorithm: MITM over the F_{p^2} graph (Algorithm 1) - the isogeny-graph BSGS
      steps: p^{1/2} at the textbook balance
      memory: p^{1/2}
      full_cost_as_claimed_by_producer: p^{2/3} at balance, p^{3/5} rebalanced
      full_cost_after_F1: Omega(p^{2/3}) for EVERY m; no rebalance helps
      status: NOT THE BASELINE IN EITHER REGIME, under any convention examined
    pollard_rho_analogue:
      algorithm: LMCS (Algorithm 2) - distinguished-point collision search on the path-index space
      steps: p^{1/2+o(1)}
      memory: polylog, and provably w-independent because claws are abundant
      full_cost: p^{1/2+o(1)}
      status: >-
        MATCHES the classical baseline. This is the correct rho-analogue and its
        w-independence is the artifact's genuine technical content. It BEATS
        nothing.
    closest_specialized_baseline_Fp:
      algorithm: Delfs-Galbraith (KN-LIT-078 via KN-TECH-029, confidence reported)
      steps: p^{1/4+o(1)}
      full_cost: p^{1/4+o(1)} under H3; p^{1/3+o(1)} without H3
      status: MATCHED BASELINE for F_p-rational instances; not displaced, since 1/4 < 1/3
    closest_specialized_baseline_Fp2:
      algorithm: the archived p^{1/3+o(1)} algorithm (Theorem 1.1 / Corollary 1.2, conditional on its Heuristic 1)
      steps: p^{1/3+o(1)}
      memory: p^{1/3+o(1)}
      full_cost: p^{4/9+o(1)} as operated; p^{2/5+o(1)} rebalanced to w = p^{1/5}
      status: >-
        MATCHED BASELINE for generic F_{p^2}, heuristic-conditional tier. Survives
        F1 untouched (Lemma 9 charged writes correctly). Carries a
        SUPERPOLYNOMIAL o(1) overhead by its own authors' disclosure, so no
        concrete-parameter conclusion follows from the exponent.
    net: >-
      Nothing produced in BATCH-002 beats any of these four at any parameter
      regime, in step count, memory, or full cost. The gap the artifact closes is
      a bookkeeping gap, not a cryptanalytic one.

  heuristic_challenges:
    - id: HC1
      target: H1 (endpoint mixing)
      challenge: >-
        Numbered, formally stated, given a rigorous ingredient (Ramanujan
        spectral gap, KN-TECH-024 established) and a classical companion
        (expander mixing), with a falsification condition and a validation route.
        That structure is exactly what docs/target-result-profile.md A2/C3-C5
        asks for and the producer delivered it. The defect is not the statement
        but the APPLICATION: c is never quantified, and the algorithm that
        consumes H1 uses a walk length at which H1's conclusion is provably false
        (F2). An unquantified constant inside a heuristic is where the exponent
        goes to hide.
    - id: HC2
      target: H2 (random-function model for f)
      challenge: >-
        The transfer question the red-team contract asks: f = h.g is NOT a
        uniformly random self-map of D. It factors through the vertex set, so its
        image is at most n_V regardless of |D|; it is built from a minimal-degree-
        free but highly structured object (non-backtracking path endpoints on a
        Ramanujan graph); and the note's own Lemma 4 relies on the cross-side
        FRACTION of collisions rather than on their count. The cheapest
        experiment that would expose a systematic deviation is the one the note
        already names for a successor batch - measured collision rate against
        Theta(t^2/|im f|) - but it must be run against |im f|, not |D|, or it will
        appear to confirm a model that is off by the factor F2 identifies.
    - id: HC3
      target: H3 (F_p-subgraph mixing)
      challenge: >-
        Correctly flagged as the weakest assumption in the artifact: V_p carries
        class-group (CM) structure rather than the full Ramanujan structure, and
        the note explicitly refuses to derive H3 from KN-TECH-024. Credit for
        that refusal. The F_p verdict is deliberately constructed not to depend
        on it (H3-free fallback p^{1/3+o(1)} still beats p^{1/2}), which is the
        right way to carry a weak heuristic. No objection beyond N3.
    - id: HC4
      target: H4 (claw multiplicity)
      challenge: >-
        Poisson heuristic on near-uniform independent endpoints. Independence
        across the two sides is asserted, not argued; and the conclusion is
        inherited from H1, so it inherits F2. Its conclusion happens to be robust
        to F2 (see F2.note_on_lemma_4_robustness), which should be stated as a
        separate observation rather than left resting on a proof that fails.
    - id: HC5
      target: Heuristic 1 of the archived paper (external)
      challenge: >-
        Correctly quarantined. Every p^{1/3}, p^{4/9} and p^{2/5} figure is
        labelled conditional on it, in both artifacts, and interpretation_limits
        states this program has neither validated nor challenged it. No
        conditional statement was written as unconditional. This is the strongest
        conditional-rigour discipline in the artifact and I raise no objection.
    - id: HC6
      target: scale honesty (AGENTS rule 7)
      challenge: >-
        NOT APPLICABLE AND CORRECTLY SO. The batch computed nothing, asserts no
        empirical claim at any tier, and says so repeatedly. There is no
        toy-scale-presented-as-crypto-scale defect here because there is no
        scale at all. Recorded as a required control for any successor (RC7)
        precisely so that the first batch that DOES compute cannot slip.

  cost_model_challenges:
    - id: CM1
      challenge: >-
        The one asymmetric charge (F1), which is the classic way a baseline
        comparison cheats. Here it cheats in the direction that makes the
        producer's own conclusion look weaker than it is, which is why I judge it
        an error rather than a thumb on the scale.
    - id: CM2
      challenge: >-
        W2's achievability half is assumed, not proved, and the note says so
        (residue item 2, and W2's own text). Every full-cost UPPER bound in the
        artifact therefore rests on an assumed mesh-routing result. The LOWER
        bounds (Lemma 2, and hence F1's corrected MITM figure) do not, so the
        "MITM loses" conclusions are safe even if achievability fails.
    - id: CM3
      challenge: >-
        The o(1) is not decorative here. The archived paper's own authors
        disclose the overhead hiding in it as SUPERPOLYNOMIAL and "much larger
        than the previous (log p)^{O(1)} cofactor", and state that the practical
        impact "is still unclear". The note inherits this correctly (residue item
        1: "a rebalanced p^{2/5+o(1)} is not a smaller machine than p^{4/9+o(1)}
        at any stated p"). But what_a_future_candidate_must_beat then tells a
        future candidate to beat "p^{2/5+o(1)} full cost", which at any
        realisable p is a threshold nobody can evaluate. The operative
        thresholds a future candidate should be measured against are the
        p^{1/2+o(1)} unconditional and p^{1/3+o(1)} conditional TIME tiers; the
        full-cost figures should be carried as provisional.
    - id: CM4
      challenge: >-
        Per-attempt versus total expected cost. The archived algorithm's expected
        cost is per-attempt M divided by success probability P_0 = u^{-u(1+o(1))}
        = p^{o(1)}, and the note handles this correctly - it does not set the
        probability to 1, and PROP-11's secondary reason explicitly prices a
        would-be factor-k gain against 1/P_0 = p^{o(1)}. No objection.
    - id: CM5
      challenge: >-
        The van Oorschot-Wiener interpolation back to the old baseline is present
        and is used correctly: sqrt(N^3/w) = p^{1/2+o(1)}/w^{1/2} is quoted
        verbatim from the archived text, Lemma 5 reproduces it in the golden
        regime as an internal check, and Lemma 9 optimises along it. This is the
        checklist item most claims of this shape omit, and it is here. Credit.
    - id: CM6
      challenge: >-
        Memory appears beside time in every row of both exponent tables, and
        polylog is written as "polylog" rather than elided. No cost-model
        challenge.

  reduction_and_scope_challenges:
    - id: RS1
      target: PROP-11's falsification of the batched re-randomisation candidate
      finding: VERIFIED CORRECT, INDEPENDENTLY
      detail: >-
        I checked the cited theorem against the archived text rather than
        accepting the relay. Theorem 1.5 (line 81) reads "Let E be a supersingular
        elliptic curve over a finite field F_{p^2}. Then there exists an isogeny
        from E to E^{(p)} of degree less than or equal to (p/2)^{1/3}" - it is
        about E and ITS OWN Frobenius conjugate. Lemma 3.4 (line 160) requires
        "the smallest isogeny E -> E^{(p)} is B-smooth". So for i != j the pair
        (E'_i, E'^{(p)}_j) genuinely has no such bound and the degree-split
        inequality in the proof at line 177 genuinely fails. The falsification is
        sound, and recording it rather than discarding it is exactly right.
      additional_bound_the_producer_did_not_state: >-
        Remark 1 (line 191) prices the closest repaired variant - several small
        isogenies E -> E^{(p)}, any one of which suffices - as "absorbed in the
        hidden term of the asymptotic complexity". So the CEILING on lead L1 is
        already known to be o(1) unless the alternative target set grows
        POLYNOMIALLY in p rather than by a constant multiplicity. L1's next gate
        should carry that ceiling, or it will be re-derived at cost.
    - id: RS2
      target: Corollary 1.2's applicability to Problem 2 (F_p)
      finding: CORRECTLY INSTANTIATED
      detail: >-
        Corollary 1.2 (line 23) covers the supersingular isogeny problem for
        supersingular E, E' generally, so it does cover F_p-rational inputs, and
        the note says so and then correctly declines to let it displace
        Delfs-Galbraith because 1/4 < 1/3. That is the cited-reduction hypothesis
        check done right, and it is the sharpest instance of KN-TECH-050's rule
        in the artifact.
    - id: RS3
      target: affected-versus-safe scope
      finding: NO SCOPE INFLATION FOUND
      detail: >-
        The artifact claims no break of CGL, SQIsign, or CSIDH; closes no
        KN-OPEN-013/014/015; asserts no bit security for any parameter set;
        excludes quantum and torsion-image lanes by the card; and states in both
        artifacts that asymptotic full-cost settles baseline identity and not
        security levels. If anything the scope is stated more narrowly than the
        content requires. The one place scope is INFLATED is in the opposite
        direction from usual: N1's mitm_ever_competitive flag over-generalises a
        proof about one MITM into a claim about all MITM.
    - id: RS4
      target: rule A1 target-class self-assessment
      finding: CORRECT
      detail: >-
        C-alpha, C-beta and C-gamma are each individually marked
        target_class_under_A1: false with a reason. I agree with all three. A1
        excludes constant-factor and log-cofactor improvements; these are a
        corpus-currency fix, a closed-off class of accounting-artifact claims,
        and a cost-metric re-parameterisation of someone else's algorithm.

  new_attack_mechanism_detected: false
  agrees_with_producer: true
  new_attack_mechanism_reasoning: >-
    Reached independently, item by item, and NOT by adopting the producer's
    justification - one of whose four items (N2) is unsound.
    (1) Algorithm 2 reaches p^{1/2+o(1)} at polylog memory. The archived primary
    text already places "the classic p^{1/2+o(1)} algorithms with polynomial
    memory like [21]" at exactly that point. Matching a known exponent at a known
    memory profile is an adaptation, and the note labels it one.
    (2) The w-independence result is a NEGATIVE result about attacks - memory
    buys nothing when claws are abundant. A theorem that says a resource does not
    help is not a mechanism.
    (3) The p^{3/5} MITM rebalance does not exist (F1); and even as claimed it
    improved an algorithm dominated in both regimes.
    (4) The p^{2/5+o(1)} rebalance DOES lower a live attack's full cost from
    p^{4/9} to p^{2/5}, so I reject the producer's stated reason. I nonetheless
    reach the same verdict on three independent grounds: it is a parameter choice
    on the time-memory tradeoff the source text itself offers and explicitly
    invites ("This allows one to interpolate between the p^{1/3+o(1)} high-memory
    algorithm presented here and the classic p^{1/2+o(1)} algorithms"); it RAISES
    the time exponent from 1/3 to 2/5; and it is conditional on a Heuristic 1
    this program has neither validated nor challenged, above a superpolynomial
    o(1) its own authors disclose. Under rule A1 that is not target-class.
    (5) The any-claw/golden-claw distinction is the artifact's real content, and
    it EXPLAINS exponents rather than moving one.
    (6) The one candidate mechanism generated (PROP-11) is correctly falsified,
    and I verified the falsification against the primary text rather than
    accepting it (RS1). L1/L2/L3 are leads with named cheapest gates, not
    mechanisms, and the artifact explicitly declares no direction impossible.
    (7) I looked for a mechanism the producer missed and found none in the
    snapshot's scope. That is absence of evidence within one derivation, not an
    impossibility claim over the literature.
  completion_criterion_consequence: >-
    BATCH-002 SATISFIES NO GOAL-SSI-001 COMPLETION CRITERION. The goal record
    requires that both TASK-20260728-005 and TASK-20260728-007 independently
    report a new attack mechanism; both report false, so the condition fails on
    both halves rather than one. Criterion 1 is not met (nothing materially
    improves a matched baseline). Criterion 2 is not met by this report, which
    verifies scope and cost hygiene for a derivation and not novelty of an
    attack. Criterion 3 is a Coordinator matter for TASK-20260728-008.
    Caveat carried forward: my concurrence and the producer's resolve to the SAME
    model (inference.model_correlation_with_producer), so this is two sessions,
    not two independently-resolved judgements.

  surviving_elements_and_their_next_gates:
    - element: G1 - MITM full cost strictly exceeds step count on F_{p^2}
      status: SURVIVES, STRENGTHENED
      restated: FC(Alg. 1) = Omega(p^{2/3}) for every m, versus step count p^{1/2}
      next_gate: RC1 then RC5
    - element: G2 - MITM never competitive on F_p
      status: SURVIVES UNCHANGED
      basis: >-
        Runs off Lemma 1 (FC >= T_steps), which needs only W1/W6 and is untouched
        by F1, F2 and F3. Model-independence is real. Only the YAML flag needs
        rescoping (N1).
