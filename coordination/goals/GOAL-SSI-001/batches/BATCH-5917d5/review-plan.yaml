review_plan:
  schema: crypto.autoresearch.review_plan.v1
  id: REVIEW-PLAN-BATCH-5917d5
  goal_id: GOAL-SSI-001
  batch_id: BATCH-5917d5
  work_unit: source-fix-verification-and-anchor-reconciliation
  recorded_at: '2026-08-30'
  recorded_by: coordinator
  recorded_before_any_reviewer_ran: true
  claim_scope: >-
    The review may change only the disposition of this verification and
    reconciliation package (source-fix verification report, re-execution
    residual, anchor-reconciliation decision record, P=512 re-derivation,
    provenance note). It cannot lift the P=512 citation prohibition, change
    any hypothesis, experiment, or goal status, establish a SQIsign, CSIDH,
    standardized-parameter, security, attack, certificate, or
    asymptotic-complexity conclusion, or assert any relation to the published
    state of the art in either direction.
  coordinator_prior: >-
    I expect the source-fix verification to pass cleanly: the 7d188a7c3 diff
    changes exactly the formula declaration, the executable charging line,
    and the crossover line to the law EV-SSI-e8cc71 already records, and the
    201692 run was produced by that same source in its own worktree, so a
    deterministic re-execution (SEED=0, no randomness) should reproduce the
    committed raw result to floating-point tolerance with tiny residuals. My
    prior for the anchor reconciliation is that the defensible decision is
    "fitted_opt authoritative, PAPER_PAIRS a declared scenario anchor": the
    reviewed EV-SSI-e8cc71 crossovers were already taken from the corrected
    run's fitted values, the 2026-08-09 decision records the paper-pair
    49.5 as an approximation, and PAPER_PAIRS is a rounded two-column paper
    literal, not an optimized value. The likely reviewer fight is
    definitional: what "authoritative" licenses for future citations, and
    whether the P=512 re-derivation under the authoritative anchor is any
    closer to citation-eligible than before (it is NOT; the prohibition
    stands until the post-review Coordinator decision). If the re-execution
    does not reproduce the committed raw result, the expected cause is host
    dependency drift (numpy/scipy/leggauss), which is an environmental
    deviation to record with the exact versions, not a source defect; a
    source defect that large would be the surprise to record and probe
    skeptically before composing any PASS.
  prior:
    expectation: >-
      Source verification passes; re-execution reproduces the committed
      201692 raw result to floating-point tolerance (residuals reported, not
      asserted); the anchor decision lands on fitted_opt-authoritative with
      PAPER_PAIRS declared a scenario anchor; the P=512 re-derivation agrees
      with the 81.64362615310625 / -0.821813076553 pair from the corrected
      run literals; the prohibition text survives in every artifact.
    decision_if_overturned: >-
      If the re-execution disagrees beyond floating-point tolerance, record
      the exact environment versions and the residual distribution as an
      environmental deviation and re-scope the verification to source-reading
      plus the 201692 run's own archived stdout, rather than declaring the
      source defective. If the anchor evidence supports PAPER_PAIRS as
      authoritative or a dual-anchor reading, follow the arithmetic, not the
      prior, and say so. If any artifact drops the P=512 prohibition text,
      that is a boundary violation and the disposition is REVISE regardless
      of arithmetic quality.
  joints:
    - joint: J1-source-fix-correctness-and-reproducibility
      assigned_to: TASK-20260830-92f16c
      role: validator
      attack_plan: >-
        Read the merged experiments/EXP-WESOVOW-001/cost_model.py and verify
        the three load-bearing lines: the serialized formula declaration,
        the executable charging computation, and the crossover computation,
        against the law stated in EV-SSI-e8cc71 (T(w) = T_full *
        sqrt(M/min(w,M)); log2T(w) = log2T_full + 0.5*max(0, log2M-log2w) +
        c*sqrt(log2p); log2w_star = log2M + 2*(log2Tfull + c*sqrt(log2p) -
        log2TDG)). Check the cap requirement of specification.yaml line 149
        (at w=M, time equals T_full exactly) against the executable form by
        hand. Re-execute the merged source yourself (independent of the
        producer's re-execution) with WESOVOW_RAW_PATH pointed at your own
        review directory, and diff your output against the committed
        RUN-WESOVOW-201692-001/raw-result.json: report the maximum absolute
        residual per field, do not silently pass. Check nondegression:
        RUN-WESOVOW-001, RUN-WESOVOW-201692-001, specification.yaml,
        EV-WESO-001, EV-SSI-e8cc71 and EV-SSI-12c22e are byte-unchanged
        (git), and the producer edited no frozen byte.
      expected_break: >-
        A merged-source line that still implements the pre-fix law, a cap
        check that does not return exactly T_full at w=M, a re-execution
        residual beyond floating-point tolerance without a recorded
        environment explanation, or any frozen artifact changed.
    - joint: J2-anchor-reconciliation-integrity
      assigned_to: TASK-20260830-92f16c
      role: validator
      attack_plan: >-
        Verify the reconciliation record states exactly one explicit
        authority decision (fitted_opt authoritative, PAPER_PAIRS
        authoritative, or dual scenario anchors), with the reasoning tied to
        committed records (EV-SSI-e8cc71's reviewed crossovers, DEC-20260809-
        39eb45's paper-pair approximation note, the PAPER_PAIRS literal
        provenance in cost_model.py:60-65, and the 2026-08-24 closeout).
        Spot-check the arithmetic: the package's P=512 rows must agree with
        the committed 240-row table of BATCH-eb0a7e (recomputed_table.json)
        where the two overlap, and with the anchor_sensitivity.md table.
        Verify no anchor is silently substituted anywhere in the package and
        that the decision does not assert any comparison against the
        published state of the art in either direction.
      expected_break: >-
        A hedged or dual authority with no decision, a value that disagrees
        with the committed 240-row table without a stated reason, or any
        state-of-the-art assertion.
    - joint: J3-p512-rerivation
      assigned_to: TASK-20260830-92f16c
      role: validator
      attack_plan: >-
        Perform the blind re-derivation: from the committed
        RUN-WESOVOW-201692-001/raw-result.json per_field[log2p=512].optimal
        literals (log2T, log2M) and the specification's grid and baseline
        (log2T_DG = log2p/2) alone, re-derive the P=512 crossover
        log2w_star at c=0 and the log2w=80,c=0 sign, never reading the
        producer's re-derivation artifacts, anchor-reconciliation record, or
        re-execution output. Compare against the producer's numbers; report
        agreement or disagreement with the exact residuals. Confirm the
        package's boundary text preserves the P=512 prohibition verbatim and
        that the versioned-amendment input it prepares names CORR-20260830-
        660318 as the filing vehicle without pre-lifting the ban.
      expected_break: >-
        A disagreement between blind re-derivation and the producer's value
        beyond floating-point tolerance, or any artifact that treats the
        re-derived value as citation-eligible.
  blindness:
    reviewers_may_read:
      - AGENTS.md
      - CLAUDE.md
      - docs/
      - experiments/EXP-WESOVOW-001/
      - ledger/evidence/EV-WESO-001.yaml
      - ledger/evidence/EV-SSI-e8cc71.yaml
      - ledger/evidence/EV-SSI-12c22e.yaml
      - ledger/decisions/DEC-20260809-39eb45.yaml
      - ledger/decisions/DEC-20260824-384e78.yaml
      - ledger/corrections/CORR-20260808-c792f8.yaml
      - coordination/goals/GOAL-SSI-001/batches/BATCH-dbfee9/
      - coordination/goals/GOAL-SSI-001/batches/BATCH-eb0a7e/
      - coordination/goals/GOAL-SSI-001/batches/BATCH-5917d5/tasks/TASK-20260830-fffafa/
      - coordination/goals/GOAL-SSI-001/batches/BATCH-5917d5/review-plan.yaml
      - coordination/goals/GOAL-SSI-001/batches/BATCH-5917d5/dispatch_queue.json
    sibling_reports:
      forbidden_until_ledger_archive: true
      paths:
        - coordination/goals/GOAL-SSI-001/batches/BATCH-5917d5/reviews/TASK-20260830-92f16c/
    attestation_required: >-
      The reviewer states exactly what it read, confirms it did not read any
      sibling report (none is expected to exist), and discloses requested
      policy and resolved model provenance. For J3 the reviewer additionally
      attests to the blind_from list below. Independence is a fresh session
      and disjoint context, not a distinct-model quorum.
  proves_too_much:
    required: true
    assigned_to: TASK-20260830-92f16c
    objects:
      - >-
        The pre-fix raw result RUN-WESOVOW-001/raw-result.json, whose
        serialized law is T_full / sqrt(min(w, M)): the J1 argument "the
        merged source implements the cap-compliant law" must FAIL when run
        against this known-false object (its w=M row does not return T_full).
      - >-
        A tampered anchor set: swap two PAPER_PAIRS field entries in a
        scratch copy; the J2/J3 arithmetic must detect the inconsistency
        (a mismatch against the committed 240-row table or the corrected run
        literals), not silently accept it.
    failure_signature: >-
      The verification and re-derivation arguments must FAIL on each
      known-false object. A procedure that passes the pre-fix run as
      cap-compliant, or accepts a tampered anchor set, is a review-method
      failure that forces REVISE of the disposition regardless of the
      arithmetic's correctness on the real package.
  blind_rederivation:
    required: true
    assigned_to: TASK-20260830-92f16c
    quantity: >-
      The P=512 crossover log2w_star at c=0 and the log2w=80,c=0 sign under
      the authoritative anchor: re-derived from the committed corrected-run
      literals and the specification's grid and baseline alone.
    blind_from:
      - coordination/goals/GOAL-SSI-001/batches/BATCH-5917d5/tasks/TASK-20260830-fffafa/p512_rerivation.md
      - coordination/goals/GOAL-SSI-001/batches/BATCH-5917d5/tasks/TASK-20260830-fffafa/p512_rerivation.json
      - coordination/goals/GOAL-SSI-001/batches/BATCH-5917d5/tasks/TASK-20260830-fffafa/anchor_reconciliation.md
    agreement_means: >-
      Agreement is evidence the producer's re-derived value is real;
      disagreement localises to one of two named suspects -- the corrected-
      run literals the producer read, or the producer's arithmetic -- not an
      undifferentiated failure.
