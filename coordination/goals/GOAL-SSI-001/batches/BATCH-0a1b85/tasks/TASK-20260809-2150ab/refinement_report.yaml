  successor_experiment: EXP-SSI-8e589d
  predecessor_experiment: EXP-SSI-fe3f76
  status: design_only
  execution_authorized: false
  claim_ceiling: >-
    This report and successor specification make no observation, attack,
    security, exponent, novelty, hypothesis-status, or completion claim.
  predecessor_review_bindings:
    validator: coordination/goals/GOAL-SSI-001/batches/BATCH-6554d6/reviews/TASK-20260809-4492f4/validation_report.yaml
    validator_sha256: e22019132191cc0b901b18a26b871c27b0e2dd07b31f1b60b2ee248f6b42b33f
    red_team: coordination/goals/GOAL-SSI-001/batches/BATCH-6554d6/reviews/TASK-20260809-2ded5b/red_team_report.md
    red_team_sha256: c2a8e7fcfb2da2d067a3d8220225d6c8f74f5fa3f4c4594f22177517403f7740
  repairs:
    - id: R1
      issue: exact_prime_metadata_and_fp2_vertex_bytes
      repair: >-
        Separate security-level labels 256/512 from exact p bit lengths 251/505;
        pin F_{p^2}=F_p[u]/(u^2+1), basis [1,u], coefficient order [j_0,j_1],
        version byte 0x01, little-endian fields, exact curve widths, and the
        SSJ-ENUM-v1 root manifest/membership/sampling procedure.
    - id: R2
      issue: finite_Tq_and_common_units
      repair: >-
        Freeze L_steps=1048576, maximum observed restarts 65536, FOE primitive
        counters, deterministic query/replay seed derivation, builder attempt
        cap, and integer Q_break_even semantics. q=0 remains infinity.
    - id: R3
      issue: auxiliary_physical_schemas_and_b_shared
      repair: >-
        Pin the quaternion/HNF order encoding, branch-specific fields, C middle
        descriptor, open-addressed table capacity, occupancy/key/index widths,
        b_shared=49 bytes, retained-versus-attempted accounting, and no hidden
        certificate/padding bytes.
    - id: R4
      issue: output_and_branch_access_contract
      repair: >-
        Freeze directed E-to-owner path tuples, HNF pullback/saturation/output
        gate, one-slot A/B access, and at-most-two-slot C access with every
        adaptive probe and output counter charged in FOE.
    - id: R5
      issue: branch_specific_semantic_nulls
      repair: >-
        Add typed nulls for A-tagged, B-tagged, B-membership, shuffled A/B, and
        C. Valid owner-mismatch records reach the final target gate; S=0 and
        singleton V_p are explicitly not_applicable rather than forced-null.
    - id: R6
      issue: paired_replay_and_control_schema
      repair: >-
        Freeze a path-work trace schema, per-instance seed derivation, replay
        derivation, one completed_attempt_count field, and before-treatment
        ordering for all semantic controls.
    - id: R7
      issue: C_pair_null_reproducibility
      repair: >-
        Define pair key, endpoint ordering, keyed index permutation, low-byte
        bins, C_obs, C_iid, n=8192, and squared rational tolerances without
        hidden floating-point square roots.
    - id: R8
      issue: H_ADV_1_R_toy_protocol
      repair: >-
        Replace ambiguous toy-prime wording with an exact non-SSI synthetic
        graph family on Z/N for N in {64,128,256}, fixed walk kernel, target
        sizes, horizon, censoring, samples, and squared KS gate. It remains
        unable to validate H-ADV-1-W.
  protected_history:
    - experiments/EXP-SSI-fe3f76/specification.yaml
    - ledger/evidence/EV-SSI-584f42.yaml
    - ledger/decisions/DEC-20260809-28dff0.yaml
    - tools/schema_supersession_registry.yaml
  registry_policy: >-
    The completed archive binds tools/schema_supersession_registry.yaml. It is
    intentionally unchanged; EXP-SSI-8e589d carries explicit supersedes
    lineage and is not appended to that global registry in this refinement.
  completion_gate:
    - successor parses as YAML
    - exact prime expressions, bit lengths, F_p2 bytes, and manifest procedure are present
    - numeric L_steps, FOE counters, builder cap, and replay seed derivation are present
    - all branch physical schemas and b_shared are explicit
    - every declared branch has a typed semantic control or explicit not_applicable rule
    - C and synthetic graph statistics are exact and pre-registered
    - execution_authorized remains false
