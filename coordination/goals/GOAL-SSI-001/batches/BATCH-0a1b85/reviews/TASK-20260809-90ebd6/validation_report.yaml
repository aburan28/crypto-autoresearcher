  metric_recomputations:
    - id: MR-SSI-90ebd6-1
      metric: exact_prime_bit_lengths_and_field_widths
      status: verified_as_read_only_arithmetic
      result: >-
        5*2^248-1 is strictly between 2^250 and 2^251, so bit_length=251 and
        b_p=ceil(251/8)=32; 27*2^500-1 is strictly between 2^504 and 2^505,
        so bit_length=505 and b_p=ceil(505/8)=64. Both primes are 3 mod 4,
        making u^2+1 irreducible over F_p. The declared curve widths
        b_curve=1+2*b_p are therefore 65 and 129 bytes. These are arithmetic
        consequences of the declared expressions, not run observations.
      references:
        - experiments/EXP-SSI-8e589d/specification.yaml:99-130@59f0700234c94ac5eb211e01f03ba517f247e9a7

    - id: MR-SSI-90ebd6-2
      metric: Fp2_and_vertex_serialization
      status: verified_for_declared_vertex_fields
      result: >-
        The successor fixes version byte 0x01, basis [1,u], coefficient order
        [j_0,j_1], canonical unsigned little-endian coefficients in [0,p-1],
        and curve_id=version||j_0||j_1. That closes the specific predecessor
        omission for the mathematical vertex fields. It does not close all
        byte-level encodings: hash-input fields, uint32/uint64 fields, and the
        finite manifest generator are not canonically serialized in the
        successor; see unresolved defects UD-SSI-90ebd6-2 and
        UD-SSI-90ebd6-7.
      references:
        - experiments/EXP-SSI-8e589d/specification.yaml:114-128@59f0700234c94ac5eb211e01f03ba517f247e9a7

    - id: MR-SSI-90ebd6-3
      metric: shared_and_branch_width_arithmetic
      status: partially_verified
      result: >-
        b_shared=1+16+4*8=49 bytes is exact. If b_scalar=2*b_p+5 is intended
        as the total encoded scalar width, it gives 69 and 133 bytes and
        b_order=1+b_curve+16*b_scalar gives 1170 and 2258 bytes. However the
        scalar field says sign(1)||magnitude with magnitude width
        2*b_p+5, while b_order charges only 16*b_scalar; whether sign(1) is a
        byte, bit, or included in b_scalar is not defined. The order widths
        therefore cannot yet be accepted as exact physical bytes.
      references:
        - experiments/EXP-SSI-8e589d/specification.yaml:158-171@59f0700234c94ac5eb211e01f03ba517f247e9a7

    - id: MR-SSI-90ebd6-4
      metric: C_pair_null_statistics
      status: verified_as_exact_declared_formula_only
      result: >-
        For n=8192 and B=256, n/B=32 and C_iid=n(n-1)/(2B)=131056. The
        per-bin squared-z denominator is n*(1/B)*(255/B)=255/8, so the first
        gate is exact rational arithmetic. The collision gate is
        (C_obs-131056)^2/8192^2 <= 16/8192, equivalently
        (C_obs-131056)^2 <= 131072. The formulas are exact, but the pair
        generator, pair-key byte encoding, and calibration of C_iid to the
        permutation null are not fully specified; no C statistic was run.
      references:
        - experiments/EXP-SSI-8e589d/specification.yaml:378-386@59f0700234c94ac5eb211e01f03ba517f247e9a7

    - id: MR-SSI-90ebd6-5
      metric: scientific_or_runtime_metrics
      status: not_applicable
      result: >-
        No experiment, Stage 0, Stage 1 arithmetic production, cost computation,
        SSI diagnostic, or synthetic graph diagnostic was executed. No missing
        measurement, timing, probability, control outcome, or cost value was
        substituted.

