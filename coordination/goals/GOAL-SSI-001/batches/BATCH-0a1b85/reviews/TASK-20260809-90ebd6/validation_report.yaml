      reference: experiments/EXP-SSI-8e589d/specification.yaml:378-386@59f0700234c94ac5eb211e01f03ba517f247e9a7

    - id: CTRL-SSI-90ebd6-GRAPH
      control: CTRL-GRAPH-RANDOM-SET
      status: scope_verified_protocol_incomplete
      evidence: >-
        The diagnostic is explicitly non-SSI: it uses G_N on Z/N for N in
        {64,128,256}, says it cannot validate H-ADV-1-W or any SSI-curve claim,
        and is ordered before any SSI diagnostic. Its graph vertices and edge
        set, target-set sizes, starts, horizon, and retained censoring are
        named. The transition probabilities, hit-at-time-zero convention,
        target-set/starting-seed serialization, reference CDF for D_KS, and
        replicate aggregation are not frozen, so no synthetic diagnostic is
        reproducible from the current bytes.
      reference: experiments/EXP-SSI-8e589d/specification.yaml:387-407@59f0700234c94ac5eb211e01f03ba517f247e9a7

  heuristic_validation_checks:
    - id: HV-SSI-90ebd6-QUANTIFIER
      check: fixed_advice_vs_random_set_scope
      status: verified_as_scope_boundary
      evidence: >-
        The successor states forall p exists fixed A_p forall E in V_p, with
