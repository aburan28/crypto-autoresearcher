    - id: HV-SSI-90ebd6-TQ
      check: T_q_zero_success_budget_and_restart_semantics
      status: incomplete
      evidence: >-
        L_steps=1048576 and q=0 maps to infinity, which repairs two prior
        omissions. However maximum_observed_restarts is not a declared restart
        cap, no distribution for omega is defined despite fixed deterministic
        seed derivations, and the attempt/restart stopping and independence
        semantics are absent. A fixed seed tuple alone supplies no probability
        space for q. The query functional is therefore not reproducible as a
        finite-or-infinite charged functional.
      references:
        - experiments/EXP-SSI-8e589d/specification.yaml:79-97@59f0700234c94ac5eb211e01f03ba517f247e9a7
        - experiments/EXP-SSI-8e589d/specification.yaml:140-147@59f0700234c94ac5eb211e01f03ba517f247e9a7

  cost_model_checks:
    - id: CM-SSI-90ebd6-FOE
      check: FOE_unit_and_path_work
      status: incomplete
      evidence: >-
        Primitive FOE prices and L_steps are named, but the path trace has only
        aggregate lookup/parse/validation/walk/pullback/saturation/output
        counters. It does not define how field_add, field_mul, field_square,
        field_inv, byte_compare, table_probe, and graph_step operations map to
        those counters, nor does it provide an analogous builder counter
        schema. total_foe is consequently a formula over unspecified units,
        not an exact independently recomputable charge.
      references:
        - experiments/EXP-SSI-8e589d/specification.yaml:140-147@59f0700234c94ac5eb211e01f03ba517f247e9a7
        - experiments/EXP-SSI-8e589d/specification.yaml:216-225@59f0700234c94ac5eb211e01f03ba517f247e9a7
        - experiments/EXP-SSI-8e589d/specification.yaml:326-330@59f0700234c94ac5eb211e01f03ba517f247e9a7

    - id: CM-SSI-90ebd6-BUILDER
      check: builder_attempt_cap_and_saturation
      status: incomplete
      evidence: >-
        The candidate cap max(1,2^20*S_req) is present, but the algorithm stops
        only at S_req or the cap. When S_req>|V_p|, it cannot reach S_req after
        all distinct vertices are retained and can incorrectly reach the cap;
        no finite-manifest saturation stop/classification is specified. This
        conflicts with the separate S_eff=min(S_req,|V_p|) and saturation-count
        reporting. Failed, duplicate, overflow, and saturated attempts also
        lack a complete builder trace and compatible T_build equation.
      references:
        - experiments/EXP-SSI-8e589d/specification.yaml:135-157@59f0700234c94ac5eb211e01f03ba517f247e9a7
        - experiments/EXP-SSI-8e589d/specification.yaml:206-213@59f0700234c94ac5eb211e01f03ba517f247e9a7

    - id: CM-SSI-90ebd6-Q
      check: incumbent_and_break_even
      status: incomplete
      evidence: >-
        T_inc_foe is only an input placeholder with no numeric counter or
        construction/source in the successor. Q_break_even has a positive
        denominator condition and ceil, but no Q>=1 convention, branch/min-row
        selection rule, or reporting rule for T_q>=T_inc. T_C_pair likewise
        has a conditional exponent expression but no exact FOE cost or
        endpoint-pair size law. No cost table can be evaluated from these bytes.
      references:
        - experiments/EXP-SSI-8e589d/specification.yaml:137-147@59f0700234c94ac5eb211e01f03ba517f247e9a7
        - experiments/EXP-SSI-8e589d/specification.yaml:193-205@59f0700234c94ac5eb211e01f03ba517f247e9a7
        - experiments/EXP-SSI-8e589d/specification.yaml:420-430@59f0700234c94ac5eb211e01f03ba517f247e9a7

    - id: CM-SSI-90ebd6-HNF
      check: quaternion_and_HNF_physical_encoding
      status: incomplete
      evidence: >-
        The quaternion algebra and 4x4 HNF basis are named, but HNF remainder
        ranges, pivot convention, row ordering, envelope bounds, and the
        canonical mapping of equivalent bases are not machine-complete. The
        scalar definition is internally ambiguous: it declares sign(1) plus a
        magnitude of width 2*b_p+5, while b_scalar=2*b_p+5 is then charged as
        the whole scalar in b_order. Sign encoding and zero/sign canonicalization
        are not fixed, so order_tag and all branch byte counts remain open.
      reference: experiments/EXP-SSI-8e589d/specification.yaml:158-166@59f0700234c94ac5eb211e01f03ba517f247e9a7

    - id: CM-SSI-90ebd6-INDEX
      check: common_index_and_slot_physical_schema
      status: incomplete
      evidence: >-
        b_shared=49 and an open-addressed table formula are present, but
        branch_id, p_label, uint32/uint64 endianness, initial bucket, probe
        sequence, modulo/capacity rule, collision metadata semantics, and
        record-slot-to-entry mapping are not fixed. More concretely, b_slot is
        based on S_eff+1 while H=2*max(1,S_eff); for S_eff=129, H=258 but
        b_slot=1 cannot encode slot 257. C's middle slot widths therefore
        inherit an under-width at ordinary finite sizes.
      reference: experiments/EXP-SSI-8e589d/specification.yaml:163-176@59f0700234c94ac5eb211e01f03ba517f247e9a7

    - id: CM-SSI-90ebd6-BRANCH
      check: branch_specific_physical_schemas_and_C_size
      status: incomplete
      evidence: >-
        A, tagged-B, membership-only-B, and C have distinct field lists, which
        is a material repair. Membership-only B has no order material from
        which its terminal procedure can construct an output. C's
        middle_factor_code has no canonical factor mapping, and its pair-index
        layout, endpoint-list/pair size law, and branch-specific index metadata
        are absent. The C S_C expression therefore does not produce a physical
        record or query-cost contract.
      references:
        - experiments/EXP-SSI-8e589d/specification.yaml:178-205@59f0700234c94ac5eb211e01f03ba517f247e9a7
        - experiments/EXP-SSI-8e589d/specification.yaml:188-192@59f0700234c94ac5eb211e01f03ba517f247e9a7

    - id: CM-SSI-90ebd6-ACCESS
      check: branch_access_and_output_semantics
      status: incomplete
      evidence: >-
        The directed path, pullback, saturation, and final target/non-scalar
        gate are stated, but edge degree/orientation byte encodings, path
        generation and termination, selected-slot lookup, HNF pullback
        algorithm, saturation degree-product semantics, and OneEnd output
        serialization are not fully specified. B-membership says membership
        hit followed by a terminal procedure without defining the procedure or
        how an order/output is obtained. C permits at most two slots but does
        not define the adaptive second-slot rule or the relation between pair
        slots and middle descriptor slots.
      references:
        - experiments/EXP-SSI-8e589d/specification.yaml:216-238@59f0700234c94ac5eb211e01f03ba517f247e9a7
        - experiments/EXP-SSI-8e589d/specification.yaml:306-313@59f0700234c94ac5eb211e01f03ba517e9a7

  proof_architecture_checks:
    - id: PA-SSI-90ebd6-BOUNDARY
      check: named_branch_ceiling_and_nearby_scope
      status: verified
      evidence: >-
        The successor limits fiber comparisons to the named typed branches,
        rejects an all-advice lower-bound interpretation, marks H-ADV-1-R as
        unable to validate H-ADV-1-W, and demotes the synthetic graph to a
        non-SSI diagnostic. No method-ceiling or transfer claim is introduced.
      references:
        - experiments/EXP-SSI-8e589d/specification.yaml:42-43@59f0700234c94ac5eb211e01f03ba517f247e9a7
        - experiments/EXP-SSI-8e589d/specification.yaml:232-251@59f0700234c94ac5eb211e01f03ba517f247e9a7
        - experiments/EXP-SSI-8e589d/specification.yaml:387-407@59f0700234c94ac5eb211e01f03ba517f247e9a7

    - id: PA-SSI-90ebd6-PAIRED
      check: paired_replay_seed_and_trace_schema
      status: incomplete
      evidence: >-
        The successor adds per-instance and replay derivation formulas, a
        single completed_attempt_count field, and a paired-stream intention.
        It does not define byte encodings for p_label, branch, replicate,
        instance, attempt, or replay_domain; replay_seed_derivation and
        replay_rule use inconsistent names; and path_work_trace_schema has one
        set of counters with no phase/gate-mode field for the claimed treatment
        and final-gate-disabled replay traces. witness_count and delta_path are
        gate quantities with no record fields or exact formulas. Thus paired
        replay/path-cost equality cannot be recomputed from a future receipt.
      references:
        - experiments/EXP-SSI-8e589d/specification.yaml:140-147@59f0700234c94ac5eb211e01f03ba517f247e9a7
        - experiments/EXP-SSI-8e589d/specification.yaml:324-338@59f0700234c94ac5eb211e01f03ba517f247e9a7
        - experiments/EXP-SSI-8e589d/specification.yaml:351-376@59f0700234c94ac5eb211e01f03ba517f247e9a7

  unresolved_defects:
    - id: UD-SSI-90ebd6-1
      severity: provenance_caveat
      finding: >-
        The immutable snapshot receipt has commit_sha: null and
        verification.status: pending_post_commit. It records the correct
        parent and path hashes but is not self-contained proof that its
        declared paths were verified after commit.
      required_successor_action: >-
        Preserve this receipt unchanged and let the Coordinator's archival
        task add any post-commit binding/verification record; do not describe
        the null receipt fields as populated.

    - id: UD-SSI-90ebd6-2
      severity: execution_blocking
      finding: >-
        V_p is only procedurally named. SSJ-ENUM-v1, the exact supersingular
        polynomial digest, root multiplicity/normalization rules, manifest
        generator version, and canonical byte encodings of p_label, counter,
        and SHAKE-derived indices are not frozen. Without those bytes,
        |V_p|, target-index mapping, duplicate rejection, sampling, and the
        full-advice control are not reproducible.
      required_successor_action: >-
        Supply a machine-readable finite manifest and exact length-prefixed or
        fixed-width encodings for every hash input and integer conversion before
        any arithmetic or control run.

    - id: UD-SSI-90ebd6-3
      severity: execution_blocking
      finding: >-
        T_q declares L_steps=1048576 and q=0=infinity, but omega has no
        probability law after the query seed is fixed, and
        maximum_observed_restarts is not a hard restart cap. Independent
        restart count, restart stopping, and per-restart domain-separated seed
        semantics are absent, so E[W]/q is not an instantiable functional.
      required_successor_action: >-
        Define the query randomness distribution, a numeric restart cap and
        invalid/infrastructure classification, and a canonical independent
        restart stream with exact seed encodings.

    - id: UD-SSI-90ebd6-4
      severity: execution_blocking
      finding: >-
        FOE primitive prices are not connected to the path trace. The trace
        omits field-operation, byte-compare, and table-probe counters and does
        not define the unit contribution of its aggregate counters; T_build has
        no corresponding builder trace schema. total_foe is therefore not an
        independently recomputable charge.
      required_successor_action: >-
        Freeze per-primitive counter fields and equations for query and build,
        including lookup/probe, parsing, validation, walks, pullback,
        saturation, output, serialization, duplicate rejection, and failed
        attempts.

    - id: UD-SSI-90ebd6-5
      severity: execution_blocking
      finding: >-
        The builder cap max(1,2^20*S_req) is present, but there is no stop when
        S_eff reaches finite |V_p| while S_req is larger. Such a row can hit
        the cap and be mislabeled failed infrastructure/invalid rather than
        finite-manifest saturation. Attempted, failed, duplicate, retained,
        saturated, and padded physical accounting is not reconciled with
        T_build.
      required_successor_action: >-
        Add an explicit saturation stop and classification, define cap scope
        for S=0 and full-advice rows, and give a builder work/peak-memory trace
        with all count fields charged in FOE.

    - id: UD-SSI-90ebd6-6
      severity: execution_blocking
      finding: >-
        Quaternion/HNF serialization is not exact. HNF remainder ranges,
        pivot and row conventions, fixed scalar envelope, equivalent-basis
        normalization, sign encoding, and zero/sign canonicalization are
        missing. The scalar wording makes b_order internally inconsistent by
        assigning a magnitude width equal to b_scalar while also prepending
        sign(1) and charging only b_scalar bytes.
      required_successor_action: >-
        Specify a canonical HNF algorithm and all scalar byte fields, including
        whether sign is a byte or bit, the exact total width, range checks, and
        the resulting b_order table for both primes.

    - id: UD-SSI-90ebd6-7
      severity: execution_blocking
      finding: >-
        The common index is not byte-reproducible. Branch and prime label byte
        values, uint32/uint64 endianness, initial bucket, probe sequence,
        capacity arithmetic, collision metadata meaning, and record-slot
        mapping are unspecified. In addition, b_slot is based on S_eff while
        H=2*S_eff: for S_eff=129, H=258 but one-byte b_slot cannot encode slot
        257.
      required_successor_action: >-
        Define all integer byte orders and branch identifiers, use a width
        based on H-1, freeze the open-addressing algorithm, and specify the
        physical mapping and metadata charges for each branch index.

    - id: UD-SSI-90ebd6-8
      severity: execution_blocking
      finding: >-
        Typed branch schemas exist but are not physically complete. The
        membership-only B record has no order material or defined terminal
        procedure from which to create an explicit OneEnd output. C lacks a
        canonical middle-factor code/mapping, pair-index layout, endpoint-pair
        size law, and branch-specific index accounting; its conditional
        exponent expression is not an FOE cost row.
      required_successor_action: >-
        Define the B membership terminal construction and output bytes, and
        define C pair records, middle-factor identity/reconstruction, endpoint
        sampling, pair-index capacity, and exact build/query/memory charges.

    - id: UD-SSI-90ebd6-9
      severity: execution_blocking
      finding: >-
        Access/output semantics remain abstract. Edge degree/orientation
        encoding, path generation and termination, selected-slot lookup,
        HNF pullback and saturation algorithm, OneEnd output representation,
        and final-gate record fields are not fixed. C's at-most-two-slot access
        has no adaptive second-slot rule, and B-membership's terminal path is
        only named.
      required_successor_action: >-
        Freeze a branch-by-branch access algorithm and machine-readable path,
        pullback, saturation, and output trace; charge every adaptive probe and
        make the final acceptance predicate explicit.

    - id: UD-SSI-90ebd6-10
      severity: execution_blocking
      finding: >-
        The semantic nulls do not yet define valid branch-preserving controls.
        The tagged random null does not guarantee a distinct owner from its
        sample_vertex expression; B-tagged lacks a singleton rule; membership
        null intentionally violates the treatment owner-equals-lookup
        invariant without an exception; and shuffled permutation does not say
        which fields move or how owner-dependent payloads stay valid. S=0 and
        all branch edge cases are not fully marked not_applicable.
      required_successor_action: >-
        Define exact branch-specific null records, owner reassignment and
        validation rules, singleton/S=0 applicability, and identical pre-final
        path work before the final target/output gate.

    - id: UD-SSI-90ebd6-11
      severity: execution_blocking
      finding: >-
        Paired replay is not a complete record schema. p_label, branch,
        replicate, instance, attempt, and replay_domain encodings are absent;
        replay_seed_derivation and replay_rule use different names; one trace
        field set has no treatment/replay phase or final-gate mode; and
        witness_count, completed_attempt_count scope, and delta_path formula
        are not represented in the path record. A future delta_path gate cannot
        be recomputed from the declared fields.
      required_successor_action: >-
        Add explicit domain bytes, widths, phase-tagged paired trace rows,
        outcome/count fields, deterministic attempt semantics, and an exact
        delta_path definition with branch and replicate scope.

    - id: UD-SSI-90ebd6-12
      severity: execution_blocking
      finding: >-
        C-pair statistics are arithmetically named but not generationally
        reproducible. Treatment-matched marginals have no finite generator;
        permuting right endpoints leaves endpoint order, orientation, slots,
        and middle-factor references underspecified; the pair-key integer byte
        format is incomplete; and C_iid is not justified for the dependent
        permutation null. No exact pair-table access path is bound to the gate.
      required_successor_action: >-
        Freeze treatment and null pair generation, all endpoint/middle-field
        transformations, pair-key bytes, duplicate policy, and the exact null
        reference distribution used by both C_iid and the squared gates.

    - id: UD-SSI-90ebd6-13
      severity: execution_blocking
      finding: >-
        The non-SSI graph diagnostic has the correct narrow scope but lacks a
        complete protocol: the edge set does not state transition
        probabilities, hit-at-time-zero is undefined, seed encodings and target
        sampling are unspecified, and D_KS has no reference CDF or aggregation
        rule. It cannot yet be replayed even in its deliberately non-SSI scope.
      required_successor_action: >-
        Define the exact random-walk kernel, hit/censoring conventions, seed
        and set sampling bytes, reference CDF, and per-cell/replicate KS
        aggregation while retaining the explicit non-SSI non-transfer ceiling.

