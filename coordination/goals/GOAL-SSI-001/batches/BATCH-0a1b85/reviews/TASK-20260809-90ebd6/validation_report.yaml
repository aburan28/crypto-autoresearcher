    - id: CTRL-SSI-90ebd6-S0
      control: CTRL-S0
      status: verified_as_scope_only
      evidence: >-
        S=0 is ordered before treatment and has no advice lookup, using a
        declared incumbent input. It is a known-answer/control declaration,
        not an observed baseline. Its applicability to every branch-specific
        paired trace is not defined, so it cannot close the paired-control
        contract by itself.
      reference: experiments/EXP-SSI-8e589d/specification.yaml:335-347@59f0700234c94ac5eb211e01f03ba517f247e9a7

    - id: CTRL-SSI-90ebd6-FULL
      control: CTRL-S-P-HARDCODED
      status: verified_as_non_evidence_symbolic_corner
      evidence: >-
        The full V_p order-tagged table is explicitly a symbolic known-answer
        corner. It is not treated as a random sampler or a cryptographic
        measurement. Its physical S=p versus finite-manifest saturation is not
        reconciled in the builder contract.
      reference: experiments/EXP-SSI-8e589d/specification.yaml:341-347@59f0700234c94ac5eb211e01f03ba517f247e9a7

    - id: CTRL-SSI-90ebd6-RANDOM
      control: branch_specific_random_advice_nulls
      status: incomplete
      evidence: >-
        A-tagged, B-tagged, and B-membership controls are now named and placed
        before treatment. The A/B-tagged owner construction uses
        sample_vertex(random_advice_seed,index+1), but no rejection or
        deterministic next-distinct rule proves owner!=target; the B-tagged
