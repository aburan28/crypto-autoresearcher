      reference: experiments/EXP-SSI-8e589d/specification.yaml:370-376@59f0700234c94ac5eb211e01f03ba517f247e9a7

    - id: CTRL-SSI-90ebd6-PAIR
      control: CTRL-C-PAIR-NULL
      status: incomplete
      evidence: >-
        The pair key, endpoint order, sample size, bins, C_obs, C_iid, and
        squared tolerances are named. Treatment-matched marginals are not an
        executable generator; keyed right-endpoint permutation does not specify
        how endpoint order, orientation, slot references, or middle-factor code
        are rebuilt after permutation; and the same pair-table access path is
        not bound to a concrete layout. A permutation null is also not shown to
        have iid collision expectation C_iid, so the gate's calibration remains
