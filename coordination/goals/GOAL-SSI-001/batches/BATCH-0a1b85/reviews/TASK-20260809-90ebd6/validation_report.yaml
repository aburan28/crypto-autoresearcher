      references:
        - experiments/EXP-SSI-8e589d/specification.yaml:351-369@59f0700234c94ac5eb211e01f03ba517f247e9a7
        - experiments/EXP-SSI-8e589d/specification.yaml:137-157@59f0700234c94ac5eb211e01f03ba517f247e9a7

    - id: CTRL-SSI-90ebd6-SHUFFLED
      control: CTRL-SHUFFLED-FIBER
      status: incomplete
      evidence: >-
        The control has a single count field and before-treatment ordering, and
        correctly keeps singleton manifests not_applicable. It does not define
        which branch field is permuted, how a retained record is mapped to the
        manifest index i, how tagged order payloads remain valid for a changed
