refinement:
  id: TASK-20260809-7ad114
  batch_id: BATCH-c057fd
  goal_id: GOAL-SSI-001
  candidate_id: IDEA-20260806-9c2f80
  successor_experiment: EXP-SSI-357363
  predecessor_experiment: EXP-SSI-8e589d
  status: design_only
  execution_authorized: false
  claim_ceiling: >-
    This report and successor specification make no observation, attack,
    security, exponent, novelty, hypothesis-status, or completion claim.
  predecessor_review_bindings:
    validator: coordination/goals/GOAL-SSI-001/batches/BATCH-0a1b85/reviews/TASK-20260809-90ebd6/validation_report.yaml
    validator_sha256: f29cf0e84790970913107f5e9e74b0592f97b9fffac5299270cc8f4eff760f45
    red_team: coordination/goals/GOAL-SSI-001/batches/BATCH-0a1b85/reviews/TASK-20260809-a35dda/red_team_report.md
    red_team_sha256: 7d054b56556b88cc341632334bb0318ac94c1509d4f71d7afe2dc397406e4a7c
  repairs:
    - id: R1
      issue: direct_width_contradictions
      repair: >-
        Define one sign byte per HNF scalar and set b_scalar=1+b_mag; pin
        b_order=1+b_curve+16*b_scalar to 1186 and 2274 bytes. Replace the
        uint64 H header with exact b_count bytes and charge the full
        (3+b_count)-byte index header.
    - id: R2
      issue: canonical_framing_and_cryptographic_counts
      repair: >-
        Add SSI-BYTES-v1 literal p/branch/domain codes, fixed integer rules,
        length-prefixed text fields, framed hash/SHAKE inputs, b_count and
        b_attempt widths, and explicit overflow rejection. H, vertex counts,
        attempt caps, and shared counters are no longer declared uint64 at
        cryptographic scale.
    - id: R3
      issue: manifest_and_setup_cost
      repair: >-
        Define SSJ-MANIFEST-v1 canonical binary bytes, digest, generator,
        storage, and setup charge, plus ORDER-MANIFEST-v1 and C-HELPER-v1
        helper manifests. A missing or wrong-digest manifest is a Stage-0
        failure rather than a free external input.
    - id: R4
      issue: static_index_and_hnf_semantics
      repair: >-
        Pin HNF-RIGHT-ROW-v1, signed scalar zero rules, linear probing,
        payload pointers, duplicate and failed-record handling, occupancy,
        exact slot widths, and complete index/header byte formulas.
    - id: R5
      issue: output_and_construction_axes
      repair: >-
        Make A/B/C output paths explicit through ORDER-MANIFEST-v1,
        EDGE-STREAM-v1, HNF pullback/saturation, and final non-scalar target
        gates. Separate Construction C pair count S_C from helper count A_C
        and charge both axes and their memory.
    - id: R6
      issue: restart_foe_and_path_boundary
      repair: >-
        Set a hard 32768-attempt cap, enumerate the FOE primitive and event
        costs, define exact rational break-even, and require a committed
        EDGE-STREAM-v1 certificate with SHA256 digest, byte cost, transition
        checks, path termination, and explicit non-self-contained boundary.
    - id: R7
      issue: paired_replay_and_null_validity
      repair: >-
        Replay consumes the byte-identical pre-gate event trace and query seed;
        it never derives an alternate path. Owner-mismatch nulls use a checked
        next-distinct rule, tagged shuffles regenerate valid owner orders,
        membership-B records declare the null invariant exception, and all
        controls carry trace identity gates.
    - id: R8
      issue: c_pair_and_synthetic_diagnostics
      repair: >-
        Define PAIR-DESCRIPTOR-v1 recomputation after endpoint permutation,
        exact per-replicate C statistics and rejection caps, and a synthetic
        graph transition kernel, first-hit convention, exact reference CDF,
        and max-cell aggregation. These remain diagnostic-only and cannot
        validate H-ADV-1-W.
  protected_history:
    - experiments/EXP-SSI-8e589d/specification.yaml
    - ledger/evidence/EV-SSI-3b03d8.yaml
    - ledger/decisions/DEC-20260809-2f2502.yaml
    - tools/schema_supersession_registry.yaml
  registry_policy: >-
    The completed archives bind the existing schema-supersession registry. It
    is intentionally unchanged; EXP-SSI-357363 carries explicit supersedes
    lineage and is not appended to that global registry in this refinement.
  completion_gate:
    - successor parses as YAML
    - direct b_order and b_index equations include every declared byte
    - all integer/string framing and cryptographic-scale count widths are explicit
    - SSJ-MANIFEST-v1, ORDER-MANIFEST-v1, C-HELPER-v1, and setup costs are explicit
    - A/B/C output paths, index semantics, hard restart cap, and FOE coverage are explicit
    - paired replay, owner-mismatch nulls, C descriptor regeneration, and graph diagnostic scope are reproducible
    - execution_authorized remains false
