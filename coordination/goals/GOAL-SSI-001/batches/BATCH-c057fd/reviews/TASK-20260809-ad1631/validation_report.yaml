        stale-payload ambiguity. It does not define the permutation algorithm,
        does not mark S_eff<2 as not_applicable, does not target-condition the
        permutation to guarantee owner mismatch, and does not state the
        control-specific exception for the membership treatment invariant. Its
        forced witness_count=0 gate is therefore not entailed.
      reference: experiments/EXP-SSI-357363/specification.yaml:531-543@d2e1cb4eed78b798682b779db3d86ee17c60d024

    - control: paired_replay
      status: incomplete
      evidence: >-
        The successor correctly removes a second replay seed and requires a
        byte-identical pre-gate trace, identical query seed, and equality of
        selected slots, probes, edges, parse outcomes, HNF operations, and the
        trace hash. It does not define a binary schema for the two traces,
        phase/gate-mode fields, event-code values, witness_count, delta_path, or
        treatment continuation to the exact 32768-attempt control count.
      references:
        - experiments/EXP-SSI-357363/specification.yaml:450-489@d2e1cb4eed78b798682b779db3d86ee17c60d024

    - control: CTRL-C-PAIR-NULL
      status: incomplete
      evidence: >-
        PAIR-DESCRIPTOR-v1 now requires endpoint order, orientation, slots, and
        middle-factor code to be recomputed after endpoint permutation, and the
        statistic is explicitly per replicate with max aggregation. Treatment-
        matched left-endpoint generation, the exact keyed permutation, a
        numeric rejection cap, duplicate handling, final pair-key regeneration,
        and the helper-table access path remain unspecified. The C_iid reference
        is not justified for the dependent permutation null.
      reference: experiments/EXP-SSI-357363/specification.yaml:280-298@d2e1cb4eed78b798682b779db3d86ee17c60d024
      additional_reference: experiments/EXP-SSI-357363/specification.yaml:544-559@d2e1cb4eed78b798682b779db3d86ee17c60d024

    - control: CTRL-GRAPH-RANDOM-SET
      status: scope_verified_protocol_incomplete
      evidence: >-
        The arm is explicitly non-SSI, uses the declared Z/N graph family, and
        cannot validate H-ADV-1-W or any SSI claim. The transition probabilities,
        time-zero convention, horizon censoring, target-set/start sampling, and
        per-cell/max aggregation are now named. The actual graph seed value and
        derivation are not frozen, and the exact reference-CDF recurrence is
        deferred to diagnostic output rather than pre-registered.
      references:
        - experiments/EXP-SSI-357363/specification.yaml:560-583@d2e1cb4eed78b798682b779db3d86ee17c60d024

  heuristic_validation_checks:
    - check: fixed_advice_quantifier
      status: verified_as_claim_boundary
      evidence: >-
        The specification states forall p exists fixed A_p forall E in V_p and
        separates query randomness from the fixed advice. H-ADV-1-R is explicitly
        weaker and cannot validate H-ADV-1-W. No heuristic was validated here.
      references:
        - experiments/EXP-SSI-357363/specification.yaml:42-61@d2e1cb4eed78b798682b779db3d86ee17c60d024
        - experiments/EXP-SSI-357363/specification.yaml:382-416@d2e1cb4eed78b798682b779db3d86ee17c60d024

    - check: H-ADV-4_pair_scope
      status: verified_as_conditional_scope_only
      evidence: >-
        H-ADV-4 is restricted to the Construction C pair branch and its null is
        described as a control gate. No pair result, near-uniformity claim, or
        transfer to A/B or SSI security was accepted.
      reference: experiments/EXP-SSI-357363/specification.yaml:408-416@d2e1cb4eed78b798682b779db3d86ee17c60d024

    - check: synthetic_diagnostic_scope
      status: verified_as_non_transfer_boundary
      evidence: >-
        H-ADV-1-R is explicitly marked unverified_diagnostic and cannot establish
        H-ADV-1-W. The graph arm is a separate synthetic control, not SSI
        evidence, and no result was produced.
      references:
        - experiments/EXP-SSI-357363/specification.yaml:391-396@d2e1cb4eed78b798682b779db3d86ee17c60d024
        - experiments/EXP-SSI-357363/specification.yaml:560-583@d2e1cb4eed78b798682b779db3d86ee17c60d024

  cost_model_checks:
    - check: manifest_and_helper_setup
      status: incomplete
      evidence: >-
        SSJ-MANIFEST-v1 has a binary header/body/digest outline and charges
