  metric_recomputations:
    - metric: prime_bit_lengths_and_vertex_widths
      status: verified_as_read_only_arithmetic
      result: >-
        The declared prime bit lengths 251 and 505 imply b_p values 32 and 64
        bytes, and b_curve=1+2*b_p gives 65 and 129 bytes. The two expressions
        are 3 modulo 4, consistent with the declared u^2+1 representation.
        These are exact consequences of the literal expressions, not run data.
      references:
        - experiments/EXP-SSI-357363/specification.yaml:63-96@d2e1cb4eed78b798682b779db3d86ee17c60d024

    - metric: direct_b_order_arithmetic
      status: verified
      result: >-
        b_mag=2*b_p+5 gives 69 and 133 bytes. The explicit one-byte sign makes
        b_scalar=1+b_mag equal to 70 and 134 bytes. Therefore
        b_order=1+b_curve+16*b_scalar gives 1186 bytes for SQISign-I and 2274
        bytes for SQISign-V. The order-tag fields charge exactly those bytes;
        the predecessor's 16-sign-byte omission is repaired.
      references:
        - experiments/EXP-SSI-357363/specification.yaml:221-231@d2e1cb4eed78b798682b779db3d86ee17c60d024

    - metric: direct_b_index_and_shared_arithmetic
      status: verified_as_declared_formula
      result: >-
        The index header is 3+b_count bytes, and each slot is
        1+b_curve+b_slot+16 bytes, so the stated b_index formula includes the
        complete header and slot fields. The shared header formula
        17+3*b_attempt+b_count matches its version, 16-byte hash domain, three
        attempt-width counters, and one count-width padding counter. The
        formulas are correct, but their exact byte encodings and helper-table
        use remain incomplete below.
      references:
        - experiments/EXP-SSI-357363/specification.yaml:232-251@d2e1cb4eed78b798682b779db3d86ee17c60d024

    - metric: cryptographic_scale_count_widths
      status: partially_verified
      result: >-
        b_count=ceil((exact_bit_length+1)/8) is sufficient for H=2*S_eff and
        vertex counts up to the declared prime scale; b_attempt=ceil((exact_bit_length+20)/8)
        is sufficient for the 2^20*S_req cap. The specification does not define
        the fixed-width byte order/padding for these fields, does not type every
        reported count, and still generates builder candidates with counter_u64.
        That u64 counter cannot enumerate the declared cryptographic-scale cap.
      references:
        - experiments/EXP-SSI-357363/specification.yaml:154-181@d2e1cb4eed78b798682b779db3d86ee17c60d024
        - experiments/EXP-SSI-357363/specification.yaml:184-215@d2e1cb4eed78b798682b779db3d86ee17c60d024
        - experiments/EXP-SSI-357363/specification.yaml:330-344@d2e1cb4eed78b798682b779db3d86ee17c60d024

    - metric: B_sigma_mapping
      status: verified_as_symbolic_mapping
      result: >-
        The applicable B rows consistently map sigma_B=1/2+3*theta/2 at
        theta=0, 1/9, 1/5, and 1/3 to sigma 1/2, 2/3, 4/5, and 1. The lower
        rows are explicitly not_applicable. This is a symbolic branch-label
        check only and not a generated arithmetic row.
      references:
        - experiments/EXP-SSI-357363/specification.yaml:299-329@d2e1cb4eed78b798682b779db3d86ee17c60d024

    - metric: edge_stream_byte_formula
      status: verified_as_declared_formula
      result: >-
        EDGE-STREAM-v1 has a four-byte edge count and each edge has two
        b_curve identifiers, a four-byte degree class, and one orientation byte;
        the stated path byte formula edge_count*(2*b_curve+5)+4 follows. The
        missing transition-certificate and trace semantics still prevent an
        executable cost check.
      references:
        - experiments/EXP-SSI-357363/specification.yaml:347-367@d2e1cb4eed78b798682b779db3d86ee17c60d024

    - metric: C_pair_gate_arithmetic
      status: verified_as_declared_exact_rational
      result: >-
        The successor specifies n=8192, 256 bins, per-replicate C_obs and C_iid,
        exact squared-z and collision tolerances, eight replicate reports, and
        max aggregation. No pair sample, statistic, or scientific conclusion
        was executed; the check is limited to the declared formulas and gate
        scope.
      references:
        - experiments/EXP-SSI-357363/specification.yaml:544-559@d2e1cb4eed78b798682b779db3d86ee17c60d024

  control_checks:
    - control: CTRL-S0
