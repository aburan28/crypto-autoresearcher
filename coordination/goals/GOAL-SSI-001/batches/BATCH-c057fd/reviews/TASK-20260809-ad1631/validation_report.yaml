  unresolved_defects:
    - label: snapshot_archive_provenance
      severity: provenance_caveat
      finding: >-
        The immutable snapshot receipt records commit_sha: null,
        parent_sha: 0d31d0f13, and verification.status: pending_post_commit.
        The supplied Git commit and path hashes establish the review boundary,
        but the receipt is not self-contained post-commit proof and the snapshot
        queue task is still marked queued.
      required_successor_action: >-
        Preserve the immutable receipt and let the Coordinator's archival task
        add a separate post-commit binding/verification record. Do not rewrite
        the receipt or treat the null fields as populated.

    - label: successor_predecessor_input_paths
      severity: artifact_integrity
      finding: >-
        EXP-SSI-357363 inputs prior_validator and prior_red_team point to the
        current review tasks ad1631 and bcd3d9, not the predecessor reports
        90ebd6 and a35dda that the producer refinement actually binds. The two
        current paths are absent at the snapshot commit.
      required_successor_action: >-
        Create an additive provenance correction that points to the immutable
        predecessor reports and preserves the current specification bytes.

    - label: SSJ_manifest_canonical_generation
      severity: execution_blocking
      finding: >-
        SSJ-ENUM-v1 remains a procedural name. The exact polynomial byte
        serialization, S_p digest value, root multiplicity/normalization rules,
        generator-version bytes, and full manifest generator commitment are not
        frozen. A manifest can therefore not be independently reproduced or
        rejected as wrong-generator from the stated bytes.
      required_successor_action: >-
        Freeze the SSJ-MANIFEST-v1 header/body/digest preimages, polynomial
        serialization and digest, generator version, root rules, and all index
        and counter conversions.

    - label: ORDER_and_C_HELPER_manifest_formats
      severity: execution_blocking
      finding: >-
        ORDER-MANIFEST-v1 and C-HELPER-v1 list logical fields but do not specify
        complete headers, count fields, entry framing, record-digest preimages,
        generator-version encodings, capacities, duplicate rules, helper-table
        slot widths, or exact physical byte-size formulas. Setup costs are named
        but not independently chargeable.
      required_successor_action: >-
        Add canonical binary schemas and digest commitments for both helper
        manifests, including separate helper count/capacity widths and exact
        T_setup and peak-memory equations.

    - label: SSI_BYTES_framing_gaps
      severity: execution_blocking
      finding: >-
        Literal p, branch, and domain codes are a material repair, but the
        general length-prefix encoding is not fully typed; sampling uses the
        undefined seed_frame||p_code||counter_u64 form; probing hashes the
        unframed hash_key||table_capacity_bytes; hash_domain bytes and trace,
        event, helper, and manifest domain encodings are absent; and digest-to-
        integer endianness is not fixed.
      required_successor_action: >-
        Make every hash/SHAKE input, variable byte field, digest-to-integer
        conversion, and domain/hash-domain literal a canonical SSI-BYTES-v1
        byte sequence, including the probe and sampling paths.

    - label: count_width_and_overflow_coverage
      severity: execution_blocking
      finding: >-
        The b_count and b_attempt formulas are sufficient in principle for H,
        vertex counts, and the 2^20*S_req cap, but their fixed-width byte order
        and padding are not explicit and several report fields lack widths.
        More directly, the builder candidate generator uses counter_u64 even
        though its declared cryptographic-scale cap exceeds u64. C-helper A_C,
        completed-attempt, rejection, saturation, trace, and other counters do
        not have a complete width/overflow table.
      required_successor_action: >-
        Replace unbounded-scale u64 counters with declared biguint/fixed widths,
        define little-endian padding and overflow for every count, and bind each
        count field to its scope and maximum.

    - label: finite_manifest_saturation_stop
      severity: execution_blocking
      finding: >-
        The builder stops only at S_req or the exact cap. It has no explicit
        finite-manifest exhaustion stop when S_eff reaches |V_p| while S_req is
        larger, no saturation terminal classification, and no reconciliation of
        duplicate/padding/attempted work with that outcome. The full-advice and
        finite-set rows therefore remain non-reproducible.
      required_successor_action: >-
        Add a deterministic saturation stop before cap exhaustion, a typed
        saturation outcome, exact counter semantics, and a complete builder
        trace/cost rule for all failed, duplicate, retained, padded, and
        saturated attempts.

    - label: HNF_scalar_and_output_normalization
      severity: execution_blocking
      finding: >-
        HNF-RIGHT-ROW-v1 does not fully fix pivot positions, row/column
        orientation, all remainder ranges, equivalent-basis normalization, or
        the mathematical fixed scalar envelope. The pulled-back/saturated output
        has no separate serialized witness schema or size rule. A sign byte and
        zero-sign rule alone do not make every order/output byte string unique.
      required_successor_action: >-
        Specify the complete HNF algorithm and envelope, then define canonical
        normalized output bytes and overflow/rejection behavior for pullback and
        saturation.

    - label: index_probe_and_C_helper_slot_semantics
      severity: execution_blocking
      finding: >-
        Linear probing and slot records are named, but b_count encoding, hash
        integer conversion, selected-slot derivation, full-record comparison,
        and C pair key/payload mapping are not exact. C-HELPER endpoint_slot
        reuses b_slot derived from H=2*S_eff even though A_C is a separate axis;
        no helper capacity or helper-specific slot width is defined, so low-
        sigma C rows can overflow their endpoint slot representation.
      required_successor_action: >-
        Define branch-specific query keys and slot selection, complete collision
        comparisons, helper capacities and widths, and separate C-helper index
        and payload accounting.

    - label: builder_and_setup_cost_trace
      severity: execution_blocking
      finding: >-
        Candidate byte generation, ORDER-GEN-v1, C-helper generation, and
        builder rejection/canonicalization work are not algorithmically fixed.
        T_build/T_index_build/T_manifest/T_order_helper and peak memory have no
        complete primitive decomposition or builder trace, so the requested
        physical cost rows cannot be recomputed.
      required_successor_action: >-
        Freeze deterministic candidate/helper generators and add complete build
        and setup event/counter schemas with exact FOE and peak-memory equations.

    - label: output_path_and_edge_certificate_semantics
      severity: execution_blocking
      finding: >-
        The A/B/C output pipelines are named, and EDGE-STREAM-v1 has an exact
        tuple layout and overall digest, but the committed certificate artifact,
        edge_count>L_steps rule, next-step digest field/chain, seed-to-edge and
        selected-slot mapping, path termination/restart policy, and output witness
        serialization are not frozen. B membership and C pair paths still depend
        on missing helper/selection algorithms.
      required_successor_action: >-
        Bind the certificate artifact and complete the edge/path transition,
        termination, pullback, saturation, output, and branch-selection schemas.

    - label: FOE_trace_and_memory_accounting
      severity: execution_blocking
      finding: >-
        path_work_trace_schema has aggregate fields but no literal event-code
        table or mapping for all listed primitive costs. It omits explicit
        field/byte/hash/SHAKE/manifest/graph/serialization counters, builder and
        setup traces, edge-certificate digest, and exact M_work/path workspace
        accounting. total_foe is consequently not independently recomputable.
      required_successor_action: >-
        Add typed event records, primitive cost equations, digest binding, build
        and setup traces, and exact time/memory aggregation rules.

    - label: hard_cap_probability_and_break_even_scope
      severity: execution_blocking
      finding: >-
        The hard query cap and exact rational break-even predicate are repairs,
        but omega's distribution, independent restart semantics, cap-conditioned
        q/failure rule, numeric T_inc_foe baseline, and branch T_q/T_setup cost
        equations are absent. The formula is therefore semantically bounded but
        not computable from the snapshot.
      required_successor_action: >-
        Freeze query/restart probability and stop semantics, supply a same-unit
        incumbent counter, and define every branch's build/query/memory row
        before any arithmetic output.

    - label: paired_replay_trace_schema
      severity: execution_blocking
      finding: >-
        Replay consumes the identical seed and pre-gate trace, but the two-trace
        row grammar, field widths, event codes, phase/gate mode, edge-certificate
        digest, witness_count, final outcome, delta_path formula, aggregation
        scope, and treatment continuation to 32768 attempts are absent.
      required_successor_action: >-
        Define a complete paired trace record and exact trace-hash/delta_path
        equations; require the same pre-gate attempt population for both paths.

    - label: owner_mismatch_and_shuffle_controls
      severity: execution_blocking
      finding: >-
        next_distinct and canonical owner generation are named but not byte-exact.
        The shuffle permutation has no exact generation algorithm or S_eff<2
        applicability rule, does not guarantee owner mismatch for its forced-zero
        gate, and does not define the membership-invariant exception. Thus the
        controls are not guaranteed same-path nulls with the stated outcomes.
      required_successor_action: >-
        Freeze next-distinct and permutation bytes, target-condition owner
        mismatch or relax the forced-zero gate, and state all branch-specific
        invariant and singleton exceptions.

    - label: C_pair_descriptor_generation_and_statistics
      severity: execution_blocking
      finding: >-
        Descriptor recomputation and per-replicate exact gates are present, but
        treatment-matched left marginals, keyed right permutation, pair-key and
        helper regeneration, middle-factor mapping, duplicate policy, and a
        numeric invalid-proposal rejection cap are not specified. The dependent
        permutation null is not shown to have the iid C_iid reference used by the
        gate, and its pair-table access path is not complete.
      required_successor_action: >-
        Freeze the treatment/null pair generators, descriptor and pair-key
        rebuild order, helper mapping, rejection cap, duplicate semantics, and
        the exact reference distribution/calibration for each replicate gate.

    - label: synthetic_graph_reproducibility
      severity: diagnostic_only_execution_blocking
      finding: >-
        The graph arm's non-SSI/non-transfer boundary is correct, and its kernel,
